    # Dependency


    | Cycle | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---||

    | Lane 0 | it 0, In 4 | it 4, In 4 | it 8, In 4 | it 12, In 4 | it 0, In 5 | it
    4, In 5 | it 8, In 5 | it 12, In 5 |

    | Lane 1 | it 1, In 4 | it 5, In 4 | it 9, In 4 | it 13, In 4 | it 1, In 5 | it
    5, In 5 | it 9, In 5 | it 13, In 5 |

    | Lane 2 | it 2, In 4 | it 6, In 4 | it 10, In 4 | it 14, In 4 | it 6, In 5 |
    it 10, In 5 | it 14, In 5 |

    | Lane 3 | it 3, In 4 | it 7, In 4 | it 11, In 4 | it 15, In 4 | it 3, In 4 |
    it 7, In 5 | it 11, In 5 | it 15, In 5 |


    Figure 5.1 Pipeline execution. "it" for "iteration number" and "in" for "line
    number". The four-cycle latency between lanes 4 and 5 of iteration 0 is hidden
    by instructions from other iterations.


    GPUs can use both approaches simultaneously without assembly language or intrinsics
    by combining SIMD datapaths with dynamically leaving instructions from different
    iterations of the outermost loop in the same execution pipeline. This allows GPUs
    to use instructions from other threads to hide the latency required by data dependencies
    and load instructions, providing parallelism. On the other hand, instruction executed
    can perform one operation from multiple iterations of the roost, providing data-level,
    or SIMD parallelism.


    Returning back to our example, the GPU is executing the inner loop. Also, as multiply
    from line 4 requires a four-cycle latency. Normally this requires three stalls
    after each time line 4 is executed. Instead of issuing stalls, the GPU will issue
    three instructions, one from each of three other iterations of the outer loop.
    This way, the GPU can keep the pipeline without needing to insert any stalls.
    The GPU may have four lanes, meaning that it can issue one instruction from each
    of four iterations of the outer loop in each cycle.


    Figure 5.1 shows how a four-SIMD lane would execute this loop assuming it was
    processing 16 iterations of the outer loop. Notice that the latency required by
    the dependency between lines 4 and 5 can be covered by instructions from the other
    iterations. In order to support the resulting throughput, GPUs contain many parallel
    functional units and extremely large registers.


    # 5.2 OpenCL


    Like OpenMP, OpenCL presents the programmer with a multi-threaded programming
    model. In OpenCL, threads are called work-items. As with OpenMP, a thread, or
    work-item, is a serial stream that works cooperatively with others to advance
    the objective of the program. Also as with OpenMP, work-items share a common memory
    space and use shared memory locations to communicate and can have variables'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 5.3 OpenCL Programming Model, Idioms, and Abstractions 191


    explicitly allocated as private. Read-modify-write and producer-consumer-type
    accesses to shared memory are usually synchronized among work-items using locks
    and barriers. However, this is where the similarity between OpenMP threads and
    OpenCL work ends.


    With OpenMP, the programmer instantiates one thread for each processor core because
    there is no advantage to having more threads than CPU cores.


    With OpenCL, the goal is to exploit parallelism as the finest grain possible,
    and it benefits the programmer to invoke as many work-items as possible regardless
    of the number of physical cores on the target device. As such, when adapting OpenMP
    code to OpenCL code, it is common to delete the outermost for-loop and replace
    it by instancing one work-item for every iteration of the outermost loop. In this
    case, each thread performs one iteration of the outermost loop.


    OpenMP threads have independent control flow, while it is open for GPU-like coprocessors
    that OpenCL work-item within group of 32 or 64 work-items are mapped to an SIMD
    lane, meaning that their control flow remain in lock-step or two groups of work-items
    will diverge and become serialized relative to each other. This means that to
    achieve maximum performance, if all-statements evaluate equivalently and all inner
    loops must iterate an number of times.


    One of the other (and often frustrating) differences between OpenMP and OpenCL
    is the amount of code required to use it as compared to serial code. A programmer
    may add OpenMP support to a serial program by adding as few additional line of
    code, while a programmer must add hundreds of additional lines of code to add
    OpenCL support. Luckily, much of this extra code is boilerplate, meaning that
    it is reusable between different programs.


    # 5.3 OpenCL PROGRAMMING MODEL, IDIOMS, AND ABSTRACTIONS


    This section briefly summarizes OpenCL terminology, the associated Application
    Interface (API) functions, and their relevance for both the host and device code.


    # 5.3.1 The host/device programming model


    Code intended for execution on the device is referred to as a kernel. The kernel
    performs the computationally- or memory-intensive computations on behalf of the
    host CPU. OpenCL kernels are written in the C language, augmented with a few special
    OpenCL-specific types and built-in functions.'
  merge: -1
