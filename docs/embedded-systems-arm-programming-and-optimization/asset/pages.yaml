- pgno: 31
  md: '# 1.8 Code Optimization Objectives


    When choosing events to count, our objective is to identify those that significantly
    impact program performance but whose occurrence rate can most easily be manipulated
    through code transformations that do not change program semantics. To further
    examine this question let us recall how execution time is determined.


    Program execution time can be computed as the product of number of instructions
    executed, average number of cycles per instruction (CPI), and clock period, that
    is:


    ```

    seconds = seconds / program / instruction / cycle

    ```


    Optimizing code usually involves reducing the first two terms, since the clock
    period is usually fixed.


    # 1.8.1 Reducing the number of executed instructions


    Reducing the dynamic (runtime) instruction count involves eliminating redundant
    code. The compiler is able to eliminate some redundancies in high level code automatically,
    by eliminating the re-computation of common sub-expressions or moving invariant
    code outside of a loop. Even so, compilers will often generate more instructions
    than necessary when translating high-level code to assembly code. In this case,
    significant performance can sometimes be gained by writing small segments of assembly
    code for performance critical the innermost loops.


    For this reason, it is important to have a performance counter to count the number
    of executed instructions. Because most processors use branch speculation, where
    some instructions are executed before a proceeding branch is resolved, instruction
    counters are often an estimation rather than an exact number.


    # 1.8.2 Reducing average CPI


    An ARM11 processor is only capable of beginning execution, or issuing, one instruction
    per cycle, while an ARM Cortex core can issue up to two instructions per cycle.
    In average, both processors have an average issue rate that is less than their
    respective maximums due to stalls.


    Stalls are caused by an instruction that temporarily prevents the processor from
