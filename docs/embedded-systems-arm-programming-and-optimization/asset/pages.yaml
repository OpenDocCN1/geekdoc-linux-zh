    # 3.4.1 Loading the image


    Begin by loading a source image into memory. Find a suitable image online, as
    the color version of the famous 512 pixel by 512 pixel “Lena” image commonly used
    for image processing work. First you will need to convert the image to PPM format
    using an image editing tool on your workstation.


    The PPM file format is an uncompressed or “raw” format, which is trivial to read
    and write in a program without needing any special image libraries.


    A PPM file contains both ASCII text and binary data. A header appears at the beginning
    of the file that is comprised of ASCII text. The header is followed by binary
    data representing each row of the image in ascending row order (top to bottom).
    Each row is comprised of pixels ordered in ascending column order (left to right).
    Each pixel usually stored as three consecutive bytes corresponding to the red,
    green, and blue (RGB) color channels.


    The PPM header consists of the following values in ASCII separated by whitespace
    (spaces, tabs, newlines, line feeds):


    +   1. the format’s “magic number” P6,

    2. the number of columns,

    3. the number of rows, and

    4. the maximum color value (usually 255).


    PPM files may also contain comment lines that begin with #.


    To read a PPM file and convert it into a 16-bit format in memory, begin with the
    following declarations:


    ```

    FILE *myFile; (file pointer)

    int rows=0, cols=0, maxcolorvalue=0; (header information)

    int i,j; (loop vars)

    static unsigned short *src_image; (pointer to image in memory)

    ```


