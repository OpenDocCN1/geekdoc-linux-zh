    # 2.4.5 Debugging OpenMP code


    There are a few things to note when debugging OpenMP programs with GNU Debugger
    (GDB). GNU Compiler Collection (GCC) “outline” the parallel regions, meaning that
    it encapsulates the parallel code block into a function, which is called from
    the host function within each thread. Shared variables are copied into a container
    before being passed by reference to this function. Private variables are declared
    as local variables include the outlined function.


    In the previous example, OpenMP would generate a container type:


    ```

    struct .omp_data_s {

    int place;

    };

    ```


    The outlined function would look similar to the following, without including the
    critical section:


    ```

    void main._omp_fn.0(struct omp_data_s* omp_data_i) {

    nprintf("%thread %d finished in\n",

    position%d\n",omp_get_thread_num(),omp_data_i->place);

    }

    ```


    GCC replaces the parallel region in main()with


    ```

    struct omp_data_s omp_data_o;

    omp_data_o.place=place;

    __builtin_GOMP_parallel_start(main._omp_fn.0,

    &omp_data_o, 2);

    main._omp_fn.0 (&omp_data_o);

    __builtin_GOMP_parallel_end();

    place = omp_data_o.place;

    ```'
