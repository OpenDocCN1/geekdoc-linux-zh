    Now are there three intervening instructions between each pair of dependent out-of-order
    instructions. Note that a processor that is capable of dynamic out-of-order execution
    may have been able to automatically achieve this same reordering, but depending
    on its capabilities it may not be able to achieve the same performance when it
    is done statically.


    As a final step, replace the first four and second four instructions with a single
    SIMD instruction each.


    This technique is applicable for the Horner''s method kernel. However, there is
    a major difference in how the ARM11 and ARM Cortex processors implement SIMD instructions.
    This section examines both separately.


    # 2.10.1 ARM11 VFP short vector instructions


    The Armv6 VFP instruction set offers SIMD instructions through a feature called
    short vector instructions, in which the programmer can specify a vector width
    and stride field through the floating-point status and control register (FPSCR).
    Setting the FPSCR will cause all the thread''s subsequently floating-point instructions
    to perform the number of operations and access the registers using a stride as
    defined in the FPSCR. Note that VFP short vector instructions are not supported
    by Armv7 processors. Attempting to change the vector width or stride on a NEON-equipped
    processor will trigger an invalid exception.


    The 32 floating-point VFP registers are arranged in four banks of eight registers
    (each registers if using double precision). Each bank can be used as a short vector
    when performing short vector instructions. The first bank, registers s0-s7 (or
    d0-d3), will be used as scalars in a short vector instruction when specified as
    the second input operand. For example, when the vector width is 8, the fads s16,s8,s0
    instruction will add each element of the vector held in registers s8-15 with the
    scalar held in s0 and store results s16-s23.


    The fmrx and fmnr instructions allow the programmer to read and write the FPSCR
    register. The latency of the fmrx instruction is two cycles and the latency of
    the fbnr instruction is four cycles. The vector width in FPSCR bits 18:16 is encoded
    such that values 0 through 7 specify lengths 1-8.'
