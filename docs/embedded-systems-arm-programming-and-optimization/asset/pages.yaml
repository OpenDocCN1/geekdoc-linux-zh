    # 4.4.3 Filtering along the column


    For the column filter, on every filter evaluation the processor will load a pixel
    from a different row. In order to utilize the cache, the column filter should
    process each output element in row-major order. This way, for each consecutive
    filter evaluation, the processor will read consecutive inputs along the row.


    This is depicted in Figure 4.11. In this case there is a cache line replacement
    on every fourth input element. At first glance this seems better than the row
    filter, for which there was a line replacement after every third input element.
    However, unlike the row filter, only one element is read from each cache line
    for output element, meaning that the vertical filter has less temporal locality.


    This is a problem, because by the time all the outputs from row 1 are processed,
    the cache lines containing the lower-numbered columns for rows 1 and 2 would likely
    have been replaced and need to be loaded again into the cache.'
