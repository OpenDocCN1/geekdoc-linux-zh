    # 4.4 MEMORY ACCESS BEHAVIOR OF 2 FILTERS


    Stencil loops as 2D filters are generally memory bound. The good news is that
    their memory access behavior, which involves reading overlapping sets of inputs,
    is favorable for the cache to exploit temporal and spatial location and achieve
    a high rate of data reuse. The challenge is that the memory access behavior implied
    by the program code may need to be optimized to gain maximum cache performance.


    Recall that cache misses categorized according to their cause: compulsory, capacity,
    and conflict.


    Compulsory misses occur on the first access to a cache block. The primary method
    to reduce compulsory misses is the use of cache prefetching technology. The effectiveness
    of prefetching depends on the regularity and'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 4.4 Memory Access Behavior of 2D Filters 161


    predictability of the access pattern. Luckily, image filtering (and stencil loops
    in general) is both regular and predictable.


    Capacity misses occur as a result of the cache not having sufficient capacity
    to exploit the available locality. The primary method to reduce capacity misses
    is to increase the size of the cache.


    Conflict misses occur when multiple memory addresses compete for a single cache
    line. In the case of image filtering, when the image''s row size is such that
    pixels from row r+n map to the same cache line as pixels from row r, a conflict
    miss may cause cache lines to be discarded and subsequently-read from memory the
    next time the program revisits r.


    The output pixels computed in the row pass are subsequently read in the column
    pass. Since the entire image must be processed with the row pass before the column
    pass may begin, it is reasonable to assume that none of the output pixels from
    the row pass remain in the cache long enough to be reused in the column pass.


    There are many hardware approaches for reducing conflict misses, such as increasing
    cache associativity, improving the replacement policy, and using victim caches,
    but there are also software methods for reducing conflict misses.


    In software, the programmer can reduce conflict misses using memory allocation
    and loop transformations to optimize the access pattern. Memory allocation techniques
    include interleaving multiple arrays into one array or changing the dimensionality
    of an array (e.g., transposing a matrix).


    Loop transformations include such as loop interchange (swapping the inner and
    outer loop), loop fusion (combining two loops into one), loop fission (splitting
    one loop into two), and loop tiling, sometimes called loop blocking.


    Unfortunately, standard compilers are not generally able to apply these types
    of optimization automatically, so it is up to the programmer. This chapter focuses
    on loop tiling due to its effectiveness for stencil loops.


