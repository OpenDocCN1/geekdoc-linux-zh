    # 5.3.8 Platform layer: Device memory allocation


    Desktop and server GPUs typically have physically separated RAM from that of the
    CPU. Data is exchanged between memories using a peripheral bus such as PCI-express.


    Embedded GPUs typically share the same memory locations with the host but may
    refer to the same addresses because the GPU uses physical addresses while the
    CPU uses virtual addresses.


    Because of this, OpenCL 1.1 and 1.2 require that the host and device allocate
    shared arrays separately. The programmer allocates memory statically or on the
    heap using malloc() and new and allocates device memory using the function clCreateBuffer.


    Since the kernel''s input data originates from host-controlled peripherals such
    as the disk, network, or camera, the data is copied to the device memory either
    explicitly using the asynchronous clEnqueueBuffer() Buffer function, or implicitly
    using the clCreateBuffer() function.


    OpenCL 2.0 introduced virtual memory, in which the management and exchange of
    data between host and device is abstracted from the programmer, but as of this
    writing embedded GPUs generally only support earlier version of OpenCL. For example,
    the ARM Mali-T628 GPU used for this chapter only supports OpenCL 1.1, two versions
    earlier than OpenCL 2.0.'
