  md: "# CHAPTER 1 The Linux/ARM Embedded Platform\n\n+   - Registers r4 through r11\
    \ (also called v1-v8, for variable registers) are generally safe to use, except\
    \ that some obscure compilers may use r9 as the static base register (also called\
    \ sb, SB, or v6) and r10 as the stack limit register (also called sl, Sl, or v7).\n\
    - Compilers such as gcc use r11 as the frame pointer (also called fp, FP, or v8)\
    \ to point to the base of the current activation frame. The activation frame contains\
    \ local data such as the local variables.\n- Register r13 the stack pointer (also\
    \ called sp or SP) is used to point to the top of the activation stack.\n\nARM\
    \ allows a flexible second operand, meaning that arithmetic instructions allow\
    \ the second operand register to be shifted or rotated prior to being used in\
    \ the instruction's operation. For example:\n\n```\nadr r1,r2,r3,lsl #2\n```\n\
    \n...would left-shift the contents of register r3 before adding it to the contents\
    \ of register r2, and:\n\n```\nadr r1,r2,r3, asr r4\n```\n\n...would arithmetically\
    \ right-shift the contents of register r3 by a number of bits specified by the\
    \ low-order byte of the contents of register r4 adding them to the contents of\
    \ register r2.\n\nThe list of valid shift operations is:\n\n+   - asr: arithmetic\
    \ shift right, store the last bit shifted out in the carry flag (if instruction\
    \ uses the S suffix)\n- lsl: logical shift left, store the last bit shifted out\
    \ in the carry flag (if instruction uses the S suffix)\n- lsr: logical shift right,\
    \ store the last bit shifted out in the carry flag (if instruction uses the S\
    \ suffix)\n- ror: rotate right, place original bit n-1 into the carry flag;\n\
    \ rrx: rotate exactly one bit (this operation does not accept a shift amount),\
    \ treat the register as a 33-bit register with the carry flag acting as the LSB.\n\
    \nThese operations also have their own corresponding instructions, when using\
    \ these as instructions the flexible second operand is not available. In other\
    \ words, the following instruction is not allowed:\n\n```\nasr r1,r2,r3, asr #4\n\
