    # C.2 MEMORY TYPES


    Coprocessor devices such as GPUs, DSPs, and FPGAs contain program-controlled on-chip
    memories. Programs can use these memories to allocate application data whose locality
    is particularly suited to the target memory''s organization.


    These memories may hold input or output tiles (such as when using tiling approach
    described in Chapter 4) or serve as an extended register file for intermediate
    values that never need to be read or written to off-chip memory (such as storing
    partial sums when summing an array of numbers).


    OpenCL defines four abstract classes of memory according to a set of constraints
    regarding how each is accessed and allocated. Since the device determines the
    implementation of these memories, OpenCL does not include any guidelines on how
    their usage affects performance. As such, it is up to the programmer on how and
    when to use these memories.


    Generally speaking, all the kernel''s input data originates from global memory,
    and all the kernel''s outputs will ultimately be stored in global memory.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# C.2 Memory Types 259


    Table C.1 OpenCL buffer types, from the perspective of the host and kernel


    | Global | Constant | Local | Private |

    | --- | --- | --- | --- |

    | Host | Dynamic allocation, read/write access | Dynamic allocation, read/write
    access | Dynamic allocation, no access | No allocation, no access |

    | Kernel | No allocation, read/write access | Static allocation, read-only access
    | Static allocation, read/write access | Static allocation, read/write access
    |


    All function local variables default to private memory, and are usually reserved
    for scalars such as loop iterators and temporaries for index calculations.


    Local memory is typically used as a replacement for cache for devices that lacks
    caches. As such, kernels often contain a loop whose body begins by copying a block
    of input data into a small array in local memory, process it, and then write it
    to global memory.


    Table C.1 lists the four types of memories in which buffers (arrays) can be allocated
    in the OpenCL device architecture. Each type of memory has different allocation
    and access restrictions on the host and device.


    # C.2.1 Global memory


    Global memory can only be allocated on the host using the `clCreateBuffer()` function.
    The host sends a pointer to each global buffer to the kernel through the kernel
    arguments using the `clSetKernelArg()` function.


    Global buffers are used to send input data to the kernel (in which the host writes
    data using `clEnqueueWriteBuffer()` and to retrieve output from the kernel (in
    which the kernel reads it using `clEnqueueReadBuffer()`).


    Since global buffers are normally allocated in off-chip memory, it generally has
    the highest access time.


    # C.2.2 Constant memory


    Constant memory is allocated on the host and its pointers are sent to the kernel
    the same way as with global memory. To define a buffer as being allocated in constant
    memory, “global const” or “constant” prefix must precede the corresponding kernel
    arguments.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Unlike global memory, the kernel can statically allocate and initialize constant
    arrays by declaring a local array variable using the “constant” prefix.


    Constant memory is read-only in the kernel but is generally stored in off-chip
    memory. Some devices include special caches for constant memory.


    # C.23 Local memory


    The host can allocate buffers in local memory and send their corresponding pointers
    to the kernel using the same method as global and constant memory. In this case,
    the corresponding buffer name must include the “local” prefix in the kernel argument
    list. Also, when setting this parameter using clSetKernelArg() the host must specify
    NULL for the arg_value argument, because the host cannot initialize local buffers.


    The kernel can statically allocate and initialize local arrays by declaring a
    local array using the “local” prefix.


    Local memory is generally stored in fast on-chip memory and the contents of local
    buffers are shared among all work-items in each workgroup.


    # C.24 Private memory


    The host cannot allocate buffers in private memory. The kernel can allocate and
    initialize buffers in private memory by specifying the “private” prefix for variable
    declarations. Buffers stored in private memory are generally stored in registers
    and are private to each work-item.


    # C.3 BUFFER MANAGEMENT


    The host allocates global, constant, and local memory using the clCreateBuffer()
    function. The host can subsequently read and write the buffer, most commonly using
    clEnqueueWriteBuffer() and clEnqueueReadBuffer(). There are also several specialized
    functions for reading and writing buffers.


    For example, clEnqueueReadBufferRect writes a rectangular buffer, one that is
    not stored contiguously in host memory but instead comprised of a series of separated
    contiguous data blocks. clEnqueueFillBuffer() allows an arbitrary data pattern
    to be copied to a buffer. clEnqueueCopyBuffer() copies data from one buffer to
    another. clEnqueueMapBuffer() allows a memory region on the host to be mapped
    to a buffer, which updates either the host''s mapped region on the device''s buffer
    will be visible by the other entity.'
