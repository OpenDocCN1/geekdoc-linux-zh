    # 1.1 PERFORMANCE-ORIENTED PROGRAMMING


    In general, embedded processors are designed with different objectives than desktop
    and server processors. **Mobile** embedded processors in particular emphasize
    energy efficiency above all other goals, and writing highly performing code for
    embedded systems generally requires more effort on the part of the programmer
    as compared to writing code for desktop and server processors.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 4 CHAPTER 1 The Linux/ARM Embedded Platform


    This is because desktop and server processors are designed to extract maximum
    performance from both legacy code, code written and compiled long ago for a previous
    version of the processor, and processor agnostic code, code that was not written
    with any specific processor in mind. By this deviating much of real estate and
    energy consumption to two specific features:


    +   1. **Extraction of instruction-level parallelism**: The processor attempts
    to (1) execute as many instructions as possible per clock cycle, (2) change the
    execution order of instructions to reduce waiting time between dependent pairs
    of instructions, and (3) predict execution behavior and execute instructions before
    knowing if they are needed, throwing away unneeded results when necessary. This
    allows the processor to achieve maximum instruction execution rate when instructions
    are not ordered in the program code in any particular way.


    +   2. **Large, complex caches**: The processor attempts to maximize system performance
    even when the program accesses memory nonideally for the attached memory. This
    involves intelligent prefetching, memory access scheduling, and high associativity,
    allowing the cache to avoid repeated accesses to the same memory.


    Embedded processors, on the other hand, typically forego most of these features,
    which makes embedded processors exhibit a wider performance gap between programs
    that are “performance tuned” and those that are not.


    Keep in mind, though, that difference is only noticeable for compute bound programs,
    which are programs whose speed or response time is determined by the processor
    or memory speed as opposed to input and output. For example, an embedded processor
    will certainly require more time than a server processor to compress a video,
    since this waiting time is determined by the processor and memory speed.


    On the other hand, the performance of an I/O bound program is determined by the
    speed of communication channels or other peripherals. For example, a program that
    forces the user to wait for data to be downloaded would not be any faster regardless
    of processor technology. In this case the response time is determined by how fast
    the device can complete the download.


    So many mobile embedded programs are compute bound, as opposed to I/O bound? Most
    image and video encoding programs are bound, but these are generally based on
    rarely changing standards, so SoC vendors “cheat” by offloading these tasks to
    special-purpose hardware as opposed to processing them in software running on
    ARM processor cores.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 1.1 Performance-Oriented Programming


    However, next-generation embedded applications such as computer vision will require
    rapidly evolving algorithms, and most of these compute bound. Examples of these
    include programs that stitch individual images to a panoramic image, facial detection
    and recognition, augmented-reality, and object recognition.


    This textbook provides a general overview of some of the methods of how program
    design can influence processor performance—methods in which a programmer can make
    changes to code without changing program semantics but improving code performance.


    These techniques generally require the programmer write his or her code in a way
    as expose specific features in the underlying microarchitecture. In other words,
    the programmer must write code at a low level in a way such that the program is
    aware of the underlying processor technology. This is often referred to as performance
    tuning or code optimization.


    These ideas are not new; many of these techniques are common in the area of high-performance
    computing. However, this book will present these in the context of embedded processors,
    and ARM processors in particular. This will also provide insight into computer
    architecture, application design, and embedded systems, as well as gain practical
    knowledge in the area of embedded software design for modern embedded systems.


    In describing these methodologies, the textbook will use several example applications,
    including image transformations, fractal generation, image convolution, and several
    computer vision tasks. These examples will target the ARMv6 and ARMv7-A architectures
    used on three cores:


    +   - ARM11 used in the generation 1 Raspberry Pi,

    - Cortex-A9 used in the Xilinx Zynq (the device used in the Avnet Zedboard, Adaptera
    Parallel, and National Instruments myRIO),

    - Cortex-A15 used in the NVIDIA Tegra K1.


    This book also introduces methodologies for programming mobile general-purpose
    GPUs using the OpenCL programming model.


    This textbook will take advantage of the system families offered by the Linux
