  md: '# 106 CHAPTER 3 Arithmetic Optimization and the Linux Framebuffer


    over the compiler-generated code for the Cortex-A9 and Cortex-A15 processors.


    This chapter examines new benchmark kernels and new optimization techniques. Each
    of these kernels generates graphics using the Linux Framebuffer. Graphical kernels
    are interesting with respect to code optimization for several reasons.


    Graphics kernels operate on two-dimensional (2D) data and exhibit a computational
    and data complexity of O(n^2). For video applications, the frame processing time
    must be constrained to maintain video quality. A 30 frame per second video allows
    33 ms of execution time per frame or 16 ns per pixel for High Definition (HD)
    resolution (1920 × 1080). For a processor with a 2 GHz clock, the processor must
    process each pixel within 29 clock cycles on average.


    This chapter uses the Linux Framebuffer to render graphics on an attached monitor.
    There are more robust libraries for graphical rendering, but the Linux Framebuffer
    is the most lightweight in the sense that it adds little performance overhead.


    Our primary performance optimization will involve using fixed-point data types
    to avoid the longer latencies of floating point.


    # 3.1 THE LINUS FRAMEBUFFER


    This chapter examines two case applications: interpolated image transformation
    and fractal rendering. These applications require the ability to "paint" pixels
    on an attached monitor. There are numerous C/C++ libraries that facilitate graphics
    programming. Most of these are built on top of the X Windows environment. XLib,
    GTK, Motif, and Qt. These libraries, as well as the Windows environment itself,
    provide advanced capabilities for building graphical and multimedia user interfaces
    and have capabilities for creating basic user interfaces (sometimes called "widgets")
    as well as video and sound.


    Unfortunately these layers add performance overhead, and in general X Windows
    feels less responsive on an embedded ARM platform than a desktop-or Linux platform.


    This chapter is concerned only with video output, not input, and our objective
    is to write the highest-performing code possible. Because of this, chapter instead
    uses the Linux framebuffer, which will allow us to write directly to the region
    of memory used to store the image currently displayed on the monitor. This will
    allow us to avoid the performance'
