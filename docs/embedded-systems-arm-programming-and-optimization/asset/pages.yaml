    if the AND is not zero, sets the output element to all ones, otherwise sets the
    output element all zeros

    * abd, aba: absolute difference and accumulate

    * max, min: sets each output element to the maximum or minimum of the two corresponding
    elements

    * pmin, pmax: sets each output element to the maximum or minimum of each of the
    adjacent pairs of elements in both vectors

    * ceq, cge, cgt, cle, clt: compare equal, greater-than-or-equal, greater-than,
    less-than-or-equal


    # B.5.3 Modifier


    By default the intrinsic will use a 64-bit input and output width, implying that
    the vector size is 64/(operand width). The following modifiers are:


    +   * q specifies 128 bit input and output width.'
