- pgno: 103
  md: 'Instead of having to write the vector length in the FPSCR, the vector size
    is encoded directly into each NEON instruction. The vector length is determined
    through a combination of an operand type after the mnemonic and the register size
    of the operands.


    The vector length is implied by dividing the size of the operand register by the
    size of the type. For example, the instruction vaddf32 q4, q5, q6 would perform
    four floating-point additions because 32-bit precision floating-point values,
    or, can fit inside of a single 128-bit q-register. In other words, "f32" mnemonic
    specifies the datatype of precision, while the q-register prefix specifies 128-bit
    registers, so the vector size is implied by 128/32=4.


    There are also several NEON instructions that allow for manipulation of individual
    subfields within a register, such as vext, vmov, and vmvn.


    The NEON load and store instructions use a different method to specify their width,
    because they support a memory access of 1, 2, 3, or 4 values and allow for all
    of destination registers. They use the format:


    ```

    vld<stride>.<element size><destination registers>,<base register>

    ```


    For example, the instruction vld28 (d0,d1), [r0] would load every 8-bit value
    beginning at the address in r0 into d0, and every other 8-bit value at address
    r0+1 into d1.


    NEON load and store performance can be improved by using aligned addresses—memory
    accesses that are evenly divisible by 16, 32, 64, 128, or 256 bytes. In addition
    to ensuring that the addresses are aligned, the alignment must be explicitly given
    in the instruction by adding suffix such as @64 to the end of the instruction.


    While ARM1 short vector instructions support a length of eight single precision
    operations, NEON are limited to four. As such, make the appropriate adjustment
    to the coefficient array. In order to align the coefficient using C aligned attribute
    as shown below:


    ```

    float __attribute__((aligned(16))) coeff_4vector[32] = (1.2,1.2,1.2,1.2,


    1.4,1.4,1.4,1.4,

    ...

    2.6,2.6,2.6,2.6);


    d = (float*)malloc(N+16);

    x = (float*)malloc(N+16);

    ```'
