    Stencil loops often exhibit a high level of data reuse, where the same input element
    can be used multiple times when computing output elements. As such, stencil loops
    have a high arithmetic intensity but their performance depends on the ability
    of the memory system to take advantage of the locality of data access, since otherwise
    the stencil may access off-chip memory through cache misses more than necessary.


    # 4.3 SEPARABLE FILTERS


    Stencil loops are often used to implement Finite Impulse Response (FIR) filters,
    which are comprised of a set of coefficients. The filtering operation computes
    each output element by multiplying each coefficient against a set of input elements
    and sums. In the 2D case, if the coefficients are stored in an $(n \times n)$
    matrix $G$ and the input image is stored in $I$, then the output value $O_{r,c}$
    is computed


    ```

    $O_{r,c} = \sum_{i=1}^{n} \sum_{j=1}^{n} G_{i,j} I_{|r-i|,|c-j|} - 1$

    ```


    This requires $n^2$ multiplications and $n$ adds per output ($2n^2$ operations),
    but there is a simple way to reduce this workload. Any 2D FIR filter whose coefficient
    matrix can be calculated as the product of a column vector and row vector is **separable**,
    meaning that it is equivalent to performing a 1D row filter on $I$ to compute
    intermediate matrix $I2$, followed by a column filter on $I2$'
  merge: -1
  img_proc: true
