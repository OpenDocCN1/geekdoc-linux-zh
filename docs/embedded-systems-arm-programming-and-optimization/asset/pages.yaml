  md: '# CHAPTER 2 Multicore and Data-Level Optimization: OpenMP and SIMD


    Desktop and server processors contain many features designed to achieve maximum
    exploitation of instruction level parallelism and memory locality at runtime,
    often without regard to the cost of these features in terms of chip area or power
    consumption. Their design places highest emphasis on scalar out-of-order speculative
    execution, accurate branch prediction, and extremely sophisticated multilevel
    caches. This allows them to perform well even when executing code that was not
    written with performance in mind.


    On the other hand, embedded processor design emphasizes energy efficiency over
    performance, so designers generally forego these features in exchange for on-chip
    peripherals and specialized coprocessors for specific tasks. Because of this,
    embedded processor performance is more sensitive to code optimizations than desktop
    and server processors. Code optimizations include any features of the code that
    is specifically designed to improve performance. Code optimizations can be added
    by the compiler, a tool that automatically transforms code, by the programmer,
    and can be processor agnostic, by eliminating redundant code, or processor specific,
    such as substituting a complex instruction in place of a sequence of simple instructions.


    Conceptually, the process of optimizing code involves starting with a naive implementation,
    a serial but functionally correct implementation of a program. The programmer
    must then identify its kernels, or portions of code in which the most execution
    time is spent. After this, the programmer must identify the performance bottleneck
    of each kernel, and then transform the kernel code in a way that improves performance
    without changing their underlying computation. These changes generally involve
    removing code redundancy, exploiting parallelism, taking advantage of hardware
    features, or sacrificing numerical accuracy, precision, or dynamic range in favor
    of performance.


    # 2 OPTIMIZATION TECHNIQUES COVERED BY THIS BOOK


    This chapter will cover two programmer-driven optimization techniques:


    +   1. Using Assembly Language to Improve Instruction Level Parallelism and Reduce
    Compiler Overheads


    In some situations hand-written assembly code offers performance advantages over
    compiler-generated assembly code. You should expect hand-written assembly to always
    outperform compiler-generated code. In fact, the automatic optimizers built into
    modern compilers are usually very effective for integer code, but hand-written
    assembly is often more effective for intensive floating-point kernels.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 2.1 Optimization Techniques Covered by this Book 51


    2. Multicore Parallelism

    Even server processors cannot automatically distribute the workload of a program
    into multiple concurrent processor cores. The programmer must add explicit support
    for multicore into the program, and is also responsible for verifying that the
    multicore is free from concurrency errors such as data races and data sharing
    errors. Even then, achieving high multicore efficiency is difficult, but becoming
    increasingly important in embedded system programming.


    The following chapters cover additional topics in program optimization, including:


    +   1. Fixed-Point Arithmetic

    Floating-point instructions are usually more costly than integer instructions,
    but are often unnecessary for multimedia and sensing applications. Using fixed-point
    representation allows integers to represent fractional numbers at the cost of
    reduced dynamic range compared to floating-point. Most high-level languages, including
    C/C++ and Java, lack native support for fixed point the programmer must include
    explicit support for fixed-point operations.


    +   2. Loop Transformations

    Cache performance is associated with a program’s memory access locality, but in
    some cases the locality can be improved without changing the functionality of
    the program. This usually involves transforming the structure of loops, such as
    in loop tiling, where the programmer adds additional levels of loops to change
    the order in which program data is accessed.


    +   3. Heterogeneous Computing

    Many embedded systems, and even systems-on-a-chip, include integrated coprocessors
    as Graphical Processor Units, Digital Processors, or Field Programmable Gate Arrays
    that can perform specific types of computations faster than the general purpose
    processors. The coprocessor is typically treated as a peripheral to the general
    purpose processor, the programmer must write special code for the coprocessor
    and explicitly handle control, interfacing, memory management, and synchronization
    of the coprocessor.


    No compiler or development tool can perform any of these techniques automatically,
    and each of them requires experimentation and verification on the part of the
    programmer. In other words, when utilizing these techniques, the programmer must
    follow an iterative process, in which the programmer begins with functional but
    nonoptimized code, then modifies the code, verify that the modifications do not
    break the functionality of'
  merge: -1
  img_proc: true
