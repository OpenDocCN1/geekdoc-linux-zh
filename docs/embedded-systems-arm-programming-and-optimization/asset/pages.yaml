    # 1.5.3 Memory addressing modes


    Like other load-store architectures, the only ARM instructions that access off-chip
    memory are load and store instructions. There are several available *addressing
    modes*, or ways that the off-chip memory address can be specified by the programmer
    or compiler.


    Let us begin by examining the format of load and store instructions.


    To load from memory, use the 1dr instruction *mnemonic* followed by the target
    register and the memory address:


    ```

    <register>, <memory address>

    ```


    To store to memory, use the str instruction mnemonic followed by the source register
    and the memory address:


    ```

    <register>, <memory address>

    ```


    Notice that, unlike most instructions, in the store instruction the destination
    location (the memory address) is given second.


    The 1dr and str instructions can also exchange non-32-bit values (such as bytes
    and halfwords) in memory by using an optional type modifier following the mnemonic:


    ```

    1dr/strd load/store double (64 bits)

    1drsh load signed halfword (16 bits)

    ```'
