  md: "# 2.10 Optimization #3: Multiple Flops per Instruction with Single Instruction,\
    \ Multiple Data 93\n\nAssume for the sake of this example that the latency of\
    \ the fmac instruction is four cycles, it will require five cycles to issue the\
    \ first two instructions. Assuming it is not possible to move enough of the other\
    \ instructions from the loop body to cover this latency, unroll the loop by a\
    \ factor of 4 to find more instructions to hide the latency. In this way instructions\
    \ from other iterations are “borrowed” to cover the latency:\n\n```\nfor (i=0;i<n;i+=4)\
    \ {\n    facs s0, s1, s2\n    facs s2, s1, s0\n    ...\n    facs s4, s1, s2\n\
    \    facs s6, s1, s4\n    ...\n    facs s8, s1, s2\n    facs s10, s1, s8\n   \
    \ ...\n    facs s12, s1, s2\n    facs s14, s1, s12\n    ...\n}\n```\n\nThis does\
    \ not solve our problem, since the instruction stream will have four cycles of\
    \ uncovered latency between each pair of instructions. Now interleave the four\
    \ pairs of instructions as:\n\n```\nfor (i=0;i<n;i+=4) {\n    facs s0, s1, $s2\n\
    \    facs s4, s1, $s2\n    facs s8, s1, $s2\n    facs s12, s1, $s2\n    facs s2,\
    \ s1, $s0\n    facs s6, s1, $s4\n    facs s10, s1, $s8\n```"
