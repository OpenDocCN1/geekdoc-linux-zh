    \ are computed using the Sobel filter.\n\nThe $T$ partial derivatives are computed\
    \ by computing the average difference in pixel intensities between the current\
    \ and next frame:\n\n```\n$(I^n(x,y) - I^{n+1}(x,y)) + (I^n(x+1,y) - I^{n+1}(x+1,y))\
