    # 3.5 ANALYSIS OF FLOATING-POINT PERFORMANCE


    Applications such as this are typically concerned with maximizing the number of
    frames (or pixels) per second. This metric is affected by the number of executed
    instructions per pixel, average cycles per instruction (CPI) the number of floating
    operations per second (flops), and the cache miss rate.


    To measure each of these metrics you can use the performance monitoring code from
    Chapter 1 and customize the cnts_dump() function.


    With respect to floating-point operations, each pixel requires 35 flops:


    +   - 4 floating point multiplies and 2 floating point adds when transforming
    each pixel,

    - 2 floating point subtracts and 2 floating point floor operations when calculating
    the fractions,

    - 4 floating point multiplies when calculating the weights, and

    - 12 floating point multiplies and 9 floating point adds when interpolating each
    channel.'
