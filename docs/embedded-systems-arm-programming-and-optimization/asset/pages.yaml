    # 5.7 CHAPTER WRAP-UP


    This chapter introduces OpenCL, an openly framework for developing and dispatch
    general purpose programs to a slave-type coprocessor such as a GPU. OpenCL is
    adopted by several CPU, GPU, FPGA, DSP manufacturers, allowing programs written
    in OpenCL to be portable across a wide range of diverse embedded and high-performance
    processing technologies.'
