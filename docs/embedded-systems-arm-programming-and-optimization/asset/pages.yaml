  md: '# 3.6 Fixed-Point Arithmetic 121


    $−2^{n-m-1}$ to $2^{n-m-1} - 2^{-m}$


    and an equivalent unsigned value has a range of


    0 to $2^{n-m} - 2^{-m}$


    both in increments of $2^{-m}$.


    Since fixed-point values usually place the implied radix point within the middle
    of the value, they are usually defined as an $(n,m)$ value, in which there are
    $n$ total bits with $m$ bits to the right of the radix point. This means that
    there are $m$ fractional bits.


    For example, a signed $(7,4)$ fixed-point value would cover the range $-4$ to
    $3.9375$ in increments of $0.0625$. A binary value of $010.1101$ represents $2^1+2^{-1}+2^{-4}=2.8125$.


    The increment, or the significance of the rightmost bit, or unit in the last place
    (ulp), determines the representation’s *accuracy*.


    When using the $(n,m)$ notation, a regular integer that does not contain any fractional
    bits is considered a $(32,0)$ fixed-point value. In this way, if the program multiplies
    a $(32,8)$ value by a regular integer as a loop counter, it is multiplying a $(32,8)$
    value by a $(32,0)$ value and producing either a $(64,8)$ product or a $(32,8)$
    product, depending on if it uses a multiply instruction that produces $32$- or
    $64$-bit product.


    # 3.6.1 Fixed point versus floating point: Accuracy


    In fixed-point representation is a tradeoff between range and accuracy. Accuracy
    captures the approximation error, or the average difference between a desired
    real value and the closest representable value in the format.


    In fixed-point representation, the accuracy depends on how many bits are allocated
    to the right of the radix point. This in an $(n,m)$ fixed-point value the accuracy
    is $2^{-m}$.


    The accuracy of floating-point values, on the other hand, depends on the value
    of the exponent. Calculated in the same way, the accuracy of a floating-point
    number is $2^{exponent-23}$.


