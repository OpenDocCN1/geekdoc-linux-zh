    # 4.14 CHAPTER WRAP-UP


    This chapter described tile-based loop optimization, whose objective is to reduce
    the cache miss rate by reordering memory references to improve memory access locality.
    To demonstrate this optimization, the chapter examined image filtering using stencil
    loops, and described a complete vision pipeline that applied Sobel edge detection
    to frames from a video stream using a USB camera and displaying the output to
    a monitor via a Linux framebuffer. The performance counters revealed an unexpected
    rate, off revealing that the tiling approach introduces overhead in the form of
    additional branch penalties, but overall performance was still highest when using
    small tile sizes due to the tiling allowing for a lower cache miss rate.


    The next chapter introduces OpenCL, a general purpose programming model for coprocessors
    as graphical processing units.


