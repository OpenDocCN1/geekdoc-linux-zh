  md: '# 2.7 Inline Assembly Language in GCC 75


    code is one or multiple instructions enclosed in quotes. Each instruction should
    be followed by "\n\t" (newline then tab) to ensure proper formatting when the
    assembly code is generated from the compiler.


    When writing short sequences of inline assembly code, the programmer can choose
    to enclose each instruction in an asm statement or combine multiple instructions
    within an asm statement. The advantage of enclosing individual instructions is
    that the input, output, and clobbers are associated with only one instruction,
    making it easier to read. However, the programmer should be cautious when using
    registers to hold intermediate results between asm statements that overwrite registers
    intermediate results. GCC''s inline assembly syntax provides no way to specify
    which registers are used as block of inline assembly instructions contains dependencies
    involving general purpose registers, the programmer should enclose the entire
    block of instructions within a single asm statement as opposed to using a separate
    asm statement for each instruction. This is not a concern when using floating-point
    registers, GCC is unlikely to reuse these registers between asm statements.


    The output operand is a list of any C/C++ variables used as outputs for the assembly
    code.


    The input operand is a list of a C/C++ variables used as inputs for the assembly
    code. It uses the same format as the output list.


    The format of the input and output lists are


    [name]"MC"(expression), ...


    +   - name is the name of symbol in the assembly code. The name is preceded by
    a percent sign (%) in the code.


    +   - M is an optional constraint modifier, and is usually = for write only operand+
    for read-write output.


    +   - C is a constraint, which is usually one of: f (floatingpoint register),
    i (immediate value), r (general purpose register), or m (memory address). For
    example, using "f" means that the corresponding operand be placed by the compiler
    into a register prior to the instruction being fetched, and its value is specified
    in the inline assembly using C/C++ expression.


    +   - expression is the C/C++ expression, variable, or pointer representing the
    input or output.


    The clobber list is a list of registers that will be modified by the instruction
    and is used when registers are specified directly.'
