    # 4.9 VIDEO4LINUX DRIVER AND API


    Video4Linux is a driver framework built into most Linux distributions that provides
    a standard interface for video capture. Since most ARM-based platforms include
    a USB interface, Video4Linux provides an easy and inexpensive way to attach a
    USB-based webcam as a means to test and evaluate video kernels.


    If you do not have a webcam, you can use a PPM file as an input image, as described
    in the previous chapter. If you have a webcam, you may need to modify this code
    in order to make it compatible with your camera. This code is based on the Microsoft
    LifeCam Studio.


    This example uses the webcam to capture 640×480 resolution images using the YUV
    colorspaces. The reader is encouraged to attempt to process even larger image
    sizes. However, the bandwidth of a typical USB2 interface will limit the maximum
    resolution to approximately 1024×768 for uncompressed video at 30 frames per second.
    Some USB cameras support higher resolution video using compression, in which your
    software will need to use a third-party library to decompress the video.


    To get started with Video4Linux, add the following includes:


    +   #include <stdio.h>

    #include <stdlib.h>

    #include <sys/ioctl.h>

    #include <sys/select.h>

    #include <sys/mman.h>

    #include <linux/videodev2.h>

    #include <string.h>


    Since the program is using the Linux Framebuffer, the following includes will
    also be necessary:'
