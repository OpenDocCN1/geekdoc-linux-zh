    Writing to the FPSCR register you must be careful to change only the bits you
    intend to change and leave the others alone. To do this, you must first read the
    value using the fmxr instruction, change bits 18:16, and then write the back using
    the fmxr instruction.


    Be sure to change the length back to its default value of 1 after the kernel since
    the compiler will not do this automatically, and any compiler-generated floating-point
    code can potentially be affected by the change to the FPSCR.


    You can use the function to change the length field in the FPSCR:


    ```

    void set_fpscr_reg (unsigned char len) {


    unsigned int fspcr;


    asm("fmxr %%[val], [val]\n" : [val]"=r(fspcr)");


    len = len - 1;


    spspcr = fspcr & ~(0x77<<16);

    spspcr = fspcr | ((len&0x7)<<16);


    asm("fmxr fspcr, %%val]\n" : : [val]"r(fspcr));


    }

    ```


    To maximize the benefit of the short vector instructions, target the maximum vector
    size of 8 by unrolling the outer loop by 8. In the original implementation, each
    fmacs instruction is followed by a dependent fmacs instruction two iterations
    later. To fully cover the eight-cycle latency of all the fmacs instructions, use
    each fmacs instruction to perform its operations for 8 iterations.


    In other words, unroll the outer loop to calculate each polynomial values on each
    iteration and use short vector instructions of length 8 for each instruction.
    Since the fmacs instruction adds the value in the Fd register, the register requires
    the ability to load copies of each coefficient into each of the four Fd registers.
