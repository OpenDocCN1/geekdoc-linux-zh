    of colors according to how "close" they are to be the set creates a rendered image
    can be quite beautiful, especially when viewed with high magnification in certain
    areas.


    A complex value is defined as being a member of the Mandelbrot set if the series
    produced by an infinite recursive evaluation of the polynomial $P(z) = z^2+c$
    is bounded within a radius 2 circle of the origin (a complex absolute value),
    where $c$ is the point being tested for membership and $z$ begins at 0.


    The program can test an arbitrary point $c$ by computing the series of values
    $P_c(0), P_c(P_c(0)), P_c(P_c(P_c(0))), P_c(P_c(P_c(P_c(0)))), P_c(P_c(P_c(P_c(P_c(0))))),
    ... For any value of $c$ in the Mandelbrot set, no value in this series will have
    a complex absolute greater than 2. Some values of $c$ will eventually produce
    a value whose absolute value exceeds this bound. Some of these points require
    a very high number of evaluations before this happens. Points that exhibit this
    behavior appear near the boundary between member and nonmember points, and can
    also be considered points of interest because these points are usually surrounded
    by interesting visual features.


