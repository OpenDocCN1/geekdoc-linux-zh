  \n# 第 3 章：在 Linux 上安装可选的 CMOD 软件\n\n## 引言\n\n在本章中，我们将介绍支持的可选软件组件的安装和管理，例如 `Db2`\
  \ 数据库、`PDF 索引功能`、`分发设施（Distribution Facility）`功能以及`全文检索服务器功能`，包括`PDF 索引功能`的配置和测试。我们还详细介绍了全文检索功能的使用。安装的\
  \ Apache Lucene 文本检索引擎与 IBM Db2、IBM Content Manager 和 IBM FileNet 使用的是同一个引擎。我们提供了一个\
  \ PDF 索引功能的运行示例，该功能用于处理典型的标准 PDF 发票。\n\n欲了解更多详情，请参考：\n\nhttps://www.ibm.com/docs/en/cmofm/10.5.0?topic=linux-installing-optional-content-manager-ondemand-software\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   ARCHIVE 数据库中为 CMOD 创建的 Db2 表列表\n*   删除 CMOD Db2\
  \ 存档数据库\n*   手动启动和停止 CMOD 实例\n    *   启动实例\n    *   停止实例\n    *   修复 arssockd 加载错误\n\
  *   更新存档实例 ARCHIVE 数据库\n    *   在 Linux 上将数据库架构从根目录移动到存档\n*   安装 PDF 索引功能\n*   安装分发设施功能\n\
  *   安装全文检索服务器功能\n\n## ARCHIVE 数据库中为 CMOD 创建的 Db2 表列表\n\n使用 `Linux` 命令从 `root` 用户使用\
