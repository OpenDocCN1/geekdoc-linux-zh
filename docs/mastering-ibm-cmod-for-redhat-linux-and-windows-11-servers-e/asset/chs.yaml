  \n![](img/Figure10.25.jpg)\n\n**图 10.25：** 加载文档的原始默认视图\n\n# arsload 参数 (#toc.xhtml_s141a)\n\
  \n可以使用以下命令列出 `Linux` `arsload` 命令行程序的开关参数：\n\n```\n[root@ECMUKDEMO22 bin]# ./arsload\
  \ -h ARCHIVE\n```\n\nARS4300I Usage: arsload [options] [load_file]\n\nVersion: 10.5.0.7```\n\
  \n这显示了 `arsload` 程序的版本号以及使用的每个开关的详情。\n\n`arsload` 程序可用开关的详细说明涵盖第 8 章，Linux 上的 CMOD\
  \ 系统用户管理中名为“CMOD 通用索引器管理”（Administration of the CMOD Generic Indexer）的节。\n\n# Linux\
  \ 上 arsload 程序命令的另一个示例 (#toc.xhtml_s142a)\n\n加载 `letters.ind` 文件的示例命令行显示所示：\n\n\
  ```\n/opt/IBM/ondemand/V10.5/bin/arsload -h ARCHIVE -u archive -n -g Letters letters\n\
  ```\n\n在上面的示例中，我们为 `arsload` 程序指定了以下参数：\n\n- `-h ARCHIVE`：这是 `CMOD` 实例的名称。\n- `-u\
  \ archive`：这是一个具有向 `Application Group` 添加文档权限的 `CMOD` 用户。这通常是一个具有 `Application Group`\
  \ 管理员权限的用户。\n- `-n`：这是防止输入文件被删除的开关。\n- `-g Letters`：要加载的 `Application Group` 的名称。\n\
  - `letters`：要处理的输入文件名。\n\n在此示例中，运行 `arsload` 程序是在程序启动的相同目录下查找输入文件 `letters.ind`。`letters.ind`\
  \ 输入文件包含可以在“创建索引”（Creating index）数据（这是通用索引器的参数文件）中创建的索引信息。\n\n**注意：** 参数文件中未指定输入文件的完整路径名，在本示例中，输入文件必须位于启动\
  \ `arsload` 程序的目录。\n\n附录 A：IBM Content Manager OnDemand 修复包安装包含了在 `Windows` 服务器上运行\
  \ `arsload` 程序的示例。\n\n# 设置查看器映射 (Viewer Map) (#toc.xhtml_s143a)\n\n为 IBM Content\
  \ Navigator 部署查看器映射可能会稍微复杂一些。\n\nIBM Content Navigator 查看器映射由一组项目组成，每个项目都将文档 MIME\
  \ 类型映射到 IBM Content Navigator 中可用的查看器。\n\n\n\n\n**7. 我们现在可以通过从下拉菜单中选择将我们的 `Content\
  \ Manager OnDemand` 桌面与新的 `CMODViewerMap0`（`Viewer map`）关联，如图图 10.32\n\n**图 10.32:**\
  \ 我们现在可以将我们的 `Content Manager OnDemand` 桌面与新的 `CMODViewerMap0` 关联\n\n## 8. `Viewer\
  \ map` 信息图标的详情描述了它们所执行的功能，如图图 10.33\n\n**图 10.33:** `Viewer map` 信息图标的详情描述了它们所执行的功能\n\
  \n另一种，程序化部署查看器映射有一个四步步骤：\n\n### 1. 部署映射。\n\n部署映射需要向 IBM Content Navigator 配置数据库中为每个映射执行一条单行\
  \ `INSERT` 语句。\n\n如果我们查看器映射的 `ID` 称为 `CMODViewerMap`，并且我们想将 `AFP` IBM Content Manager\
  \ OnDemand 文档类型映射到 `afp2pdf` 查看器，我们需要向数据库插入以下记录：\n\n字段 **ID:**\n\n`viewer.navigator.CMODViewerMap0`\n\
  \n字段 **ATTRIBUTES:**\n\n`name=CMODViewerMap0;description=CMOD Viewer Map;mappings=CMODViewerMap00,CMODViewerMap01\
  \ etc…CMODViewerMap020`\n\n总结来说，我们将想要给查看器映射的名称与一个数字拼接，每当我们添加新映射时，该数字就会递增。\n\n注意，尽管查看器映射中映射的顺序非常重要（为了遵循优先级规则），但编号方案任务在第二步中描述，如下。\n\
  \n### 2. 部署查看器映射定义。\n\n部署查看器映射后，我们必须通过向 IBM Content Navigator 配置数据库添加以下记录来定义查看器映射。\n\
  \n字段 **ID:**\n\n`viewerMapping.navigator.CMODViewerMap00`\n\n字段 **ATTRIBUTES:**\n\
  \n`contentTypes=text/html;serverType=p8;viewerName=pdfConversion;id=CMODViewerMap00;previewOnly=false`\n\
  \n并使用\n\n`SELECT * from ECMUSER.CONFIGURATION WHERE ID ='viewerMapping.navigator.CMODViewerMap01'`\n\
  \n我们可以查看下一个映射为：\n\n字段 **ID:**\n\n`viewerMapping.navigator.CMODViewerMap01`\n\n字段\
  \ **ATTRIBUTES:**\n\n`contentTypes=text/html;serverType=cm;viewerName=pdfConversion;id=CMODViewerMap01;previewOnly=false`\n\
  \n最后一个映射，是用于 `AFP` 查看器的映射：\n\n`SELECT * from ECMUSER.CONFIGURATION WHERE ID ='viewerMapping.navigator.CMODViewerMap020'`\n\
  \n字段 **ID:**\n\n`viewerMapping.navigator.CMODViewerMap020`\n\n字段 **ATTRIBUTES:**\n\
  \n`contentTypes=application/afp;serverType=od;viewerName=afp2pdf;id=CMODViewerMap020;previewOnly=false`\n\
  \n在此示例中，使用 `CMODViewerMap` 名称将此查看器映射与我们在第一步中部署的所有映射（`CMODViewerMap00, CMODViewerMap01…etc\
  \ CMODViewerMap020`）关联起来。\n\n### 3. 从我们的 `ContentManagerOnDemand` 桌面引用新部署的查看器映射。在一步中，将查看器映射分配给我们的桌面。为了执行此步骤，我们可以更新现有\
  \ `ContentManagerOnDemand` 桌面的记录，或者如果是首次部署桌面，则向 IBM Content Navigator 数据库插入新记录。以下示例针对我们命名为\
  \ `ContentManagerOnDemand` 的桌面：\n\n``\"desktop.navigator.ContentManagerOnDemand\"\
  ,\"...;viewer=CMODViewerMap0;...\"`\n\n### 4. 在 IBM Content Navigator 中声明查看器映射。这样做，它可以被其他桌面引用。为了让查看器映射在\
  \ IBM Content Navigator 的 `admin`（管理）管理桌面在选择 Viewer Maps 时列出，它必须被声明为全局导航器组件。这是通过更新\
  \ `application.navigator` 记录并将我们的查看器映射添加到查看器属性中来实现的：\n\n字段 **ID:**\n\n`'application.navigator'`\n\
  \n字段 **ATTRIBUTES:**\n\n`'locales=ar,he,en,zh_CN,zh_TW,cs,hr,da,nl,fi,fr,de,el,hu,it,ja,ko,nb,pl,pt,pt_BR,ru,sk,sl,es,sv,th,tr,ro,kk,ca,vi;threadSleepTime=5;plugins=ICMAPIPlugin,CPEAppletsPlugin,ICMPlugin,ICMAdminClientPlugin,ICMMonitor,AFPViewerPlugin;menus=;adminRoles=1693742055003;repositories=icmdos1,icmtos1,CMODDocs;desktops=admin,icm,icmadmin,icmmonitor,AVAOrange,ContentManagerOnDemand;themes=azurite,cordierite,malachite,obsidian;viewers=default,CMODViewerMap0;redactionInitialized=false;key=871bf6c911f81fd4a6c97a4;servers=cm,od,p8,cmis;box;objectExpiration=10;applicationVersion=3.0.3;desktop=default'`\n\
  \n如果前面的步骤没有按顺序执行，它们仍然有效，但重要的是在重新启动应用程序之前，在 WebSphere 中停止 IBM Navigator 并使用上述四个步骤更新\
  \ IBM 数据库。\n\nIBM Content Navigator 默认提供一些服务器类型和查看器 ID：\n\n服务器类型为：\n\n`– od` 用于\
  \ Content Manager OnDemand\n\n`– cm` 用于 Content Manager\n\n`– p8` 用于 FileNet P8\
  \ Content Engine\n\n`– cmis` 用于 CMIS（开放标准）\n\n查看器 ID 为：\n\n`– afp2pdf`\n\n`– lineDataApplet`\n\
  \n`– browser`\n\n`– adobeReader`\n\n`– appletViewer`\n\n`– filenetViewer`\n\n`–\
  \ ICCViewer (如果安装了 ICCViewer 插件)`\n\n**注意：** 如果存在多个查看器映射，查看器属性使用逗号分隔。\n\n参见链接：[`www.ibm.com/docs/en/content-navigator/3.1.0?topic=ccnwc-configuring-viewers-used-display-documents-in-web-client`](https://www.ibm.com/docs/en/content-navigator/3.1.0?topic=ccnwc-configuring-viewers-used-display-documents-in-web-client)\n\
