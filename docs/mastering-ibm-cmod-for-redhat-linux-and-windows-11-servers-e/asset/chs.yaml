  \n## 总结\n\n在本章中，我们涵盖了 `ARSLOAD` 程序的示例运行，适用于 Windows 和 Linux 环境。我们首先描述了加载到示例 Baxter\
  \ Bay Credit 应用程序所需的先决索引字段。我们还涵盖了使用 `ARSSOCKD` 程序显示 Windows 系统上运行的 IBM CMOD 程序服务列表。最后涵盖了使用\
  \ `arsdoc` 程序生成 `ARSLOAD` 使用的通用索引字段文件。\n\n\n\n\n\n## 4. `ARSSOCKD`\n\n## 2. 哪个 `-a`\
  \ 动作开关代码用于为 `ARSLOAD` 程序存储用户密码？\n\n1. `7`\n2. `4`\n3. `3`\n4. `6`\n\n## 答案\n\n1.\
  \ b\n2. c\n\n## 问题\n\n1. 你将使用什么过程来纠正以下警告消息：\n\n`ARS1609W` 在命令行上指定密码由于文本可见，因此是不安全的。\n\
  \n2. 你将使用什么过程来纠正以下错误消息：\n\n`ARS1130E 索引器提交了 4 个字段，预期 10 个`\n\n3. 你将如何纠正以下错误消息：\n\
  \n`ARS1129E Row 1: 字符串 \"04/03/95\" 无法从格式 %m/%d/%y %H:%M:%S 转换为日期`\n\n## 关键术语\n\n\
  * **ACIF**: 高级转换和索引功能（Advanced Conversion and Indexing Function），是一个批处理实用程序，用于使用\
  \ `ACIF` 应用程序对 `z/OS` 上的未格式化 `ASCII` 和 `EBCDIC` 数据流进行索引。概述请参阅：[https://www.ibm.com/docs/en/cmofm/10.5.0?topic=indexer-acif-overview]\n\
  * **ASCII**: 美国信息交换标准代码是一种用于编码字母数字打印、标点和控制字符的标准，每个字符使用一个字节（7 位）值表示 128 个不同的字符。IBM\
  \ 在 1981 年开发了扩展 `ASCII`，作为 8 位代码以支持额外的 32 个控制字符代码（如回车符和换行符）。\n* **EBCDIC**: 扩展二进制编码进制交换码由\
  \ IBM 于 1964 年开发，用于 IBM 360 主机操作系统。它与 `ASCII` 一样基于 8 位（字节）二进制代码，用于字母数字和标点符号，但 `EBCDIC`\
  \ 将每个字符的 8 位分为两个 4 位区域，一个区域表示字符类型，另一个区域表示该类型内的值。\n* **DB2**: 由 IBM 开发的关系型数据库软件，支持\
  \ 41 个 `IBM CMOD` 数据库表以及索引和视图。\n* **MVS**: 多重虚拟存储（Multiple Virtual Storage）是 IBM\
  \ 的一种操作系统，运行在 IBM 的某些大型机服务器上。\n* **OD/zOS**: 用于在 z/OS 操作系统上的 IBM OnDemand，供 IBM\
  \ z 主机使用。\n* **IP**: 互联网协议是用于传输和接收数据的协议，定义了用于在互联网和本地客户端/服务器硬件系统之间传输数据的数据结构。\n* **IBM\
  \ CMOD**: `IBM Content Manager OnDemand` 软件系统，由大量的和服务和实用程序组成，用于捕获电子文档和打印流，运行在多个硬件和操作系统上，这也是本书的主题。\n\
  \n# 第 14 章\n\n# 在 Windows 和 Linux 上运行 ARSXAFP 程序\n\n## 引言\n\n本章展示了如何在 Windows 和\
  \ Linux 服务器环境中使用 `IBM Content Manager OnDemand` 的 `ARSXAFP` 程序，处理位于目录中的 `AFP` 输入文件，并将行数据输出重定向到文件。\n\
  \n`ARSXAFP` 程序会跳过输入数据中存在的图像、图形和其他非打印字符。输入数据中的字体可以通过命名与输入文件相关的表单定义（Windows 上的 `CSDEF.FNT`）和叠加文件映射到等宽字体。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* `ARSXAFP` 程序参数选项\n* `ARSXAFP` 命令行示例\n\n# ARSXXAFP\
  \ 程序参数选项\n\n以下程序展示了如何处理位于目录中的 `AFP` 输入文件并将行数据输出重定向到文件。默认情况下，输入文件包含 8.5 x 11 英寸的页面：\n\
  \n```\nC:\\Program Files\\ibm\\OnDemand\\V10.5\\bin>arsxafp\n```\n\n```\nARS4400I\
  \ Usage: arsxafp [-c] [-l] [-w] [-h] [-o] [-r] [-f] [-t] [-x] [-y] inputfile\nVersion:\
