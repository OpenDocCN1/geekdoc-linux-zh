  \n以 `root` 用户身份登录服务器。\n\n```\ncd /opt/ibm/ondemand/V10.5/config\n```\n\n使用 `vi`\
  \ 编辑器编辑 `ars.cache` 文件。\n\n对于每个文件系统，在 `ars.cache` 文件中插入一行供 Content Manager OnDemand\
  \ 可用于缓存存储的服务器。\n\n**注意：** `ars.cache` 文件中的第一个条目列出基础缓存存储文件系统。`CMOD` 在此基础存储文件系统中存储控制信息。该基础文件系统必须始终存在，并保持作为第一条目。\n\
  \n缓存文件系统必须由 `CMOD` 实例所有者 `archive` 以及系统组 `db2iadm1` 所有。IBM 建议仅设置用户文件权限，而不设置组或其他文件权限。\n\
  \n例如：\n\n```\ndrwx------ 3 root root 512 Sep 22 13:08 /arscache/cache1\n```\n\n\
  使用 `chown` 命令设置所有权。以下示例显示如何更改 `/arscache` 目录树下所有文件系统的用户所有者：\n\n```\nchown -R root:root\
  \ /arscache*\n```\n\n使用 `chmod` 命令设置文件权限：\n\n```\nchmod 700 /arscache/cache1\nchmod\
  \ g-s /arscache/cache1\n```\n\n`CMOD` 缓存存储文件和子目录应具有以下权限：\n\n```drwx------ 每个子目录\
  \ (700)\n-r-------- 每个已迁移到归档存储的对象 (400)\n-rw------- 每个尚未迁移的对象 (600)\n-rwxrwxrwx\
  \ 位于 retr 和 migr 目录下的每个符号链接 (777)\n```\n\n参见：\n\nhttps://www.ibm.com/docs/en/cmofm/10.5.0?topic=linux-creating-arscache-file-instance](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=linux-creating-arscache-file-instance)\n\
  \n## 指定 arsldap.ini 文件\n\n`ARS_LDAP_BIND_MESSAGES_FILE` 参数允许 `CMOD` 显示来自 `LDAP`\
  \ 服务器的自定义消息文本，以警告用户其 LDAP 密码即将过期或账户已被锁定。\n\n显示给用户的消息使用此参数。要启用此消息传递功能，请创建一个包含所需消息字符串的文件，并将\
  \ `ARS_LDAP_BIND_MESSAGES_FILE` 设置为消息文本文件的完整路径。`arsldap.ini` 文件提供了示例消息文本字符串，这些字符串可供\
  \ `ARS_LDAP_BIND_MESSAGES_FILE` 参数。\n\n`arsldap.ini` 文件包含以下三个部分：\n\n```\n[BIND_MESSAGES]\n\
  PASSWORD_EXPIRED=\"/opt/ibm/ondemand/V10.5/config/password_expired.txt\"\nACCOUNT_LOCKED=\"\
  /opt/ibm/ondemand/V10.5/config/account_locked.txt\"\n\n[PASSWORD_EXPIRED]\nTDS6=\"\
  Password has expired\"\nAD=\"data 532\"\nUDEF1=\nUDEF2=\nUDEF3=\n\n[ACCOUNT_LOCKED]\n\
  TDS6=\"Account is locked\"\nAD=\"data 775\"\nUDEF1=\nUDEF2=\nUDEF3=\n```\n\n`BIND_MESSAGES`\
  \ 部分指定了包含用户定义消息文本的文件路径，当用户的 LDAP 密码即将过期或账户被锁定时，这些文本将显示给用户。提供了通用文件以供特定的 CMOD 环境进行自定义。\n\
  \n这是一个 IBM 提供的示例消息，将显示给用户：\n\n您的 LDAP 密码已过期需要更改。\n\n请登录 <公司内网> 查看密码设置说明。\n\nIBM\
  \ Tivoli Directory Server Version 6.x 和 Microsoft Active Directory (AD) 可以使用 `PASSWORD_EXPIRED`\
  \ 和 `ACCOUNT_LOCKED` 部分中的条目。\n\n为了允许用户不受 `IBM CMOD` 直接支持的 LDAP 服务器输入自己的模式字符串，这些部分还包含三个用户定义条目（`UDEFx`）。\n\
  \n当 LDAP 服务器返回错误时，`CMOD` 读取包含文件名和所引参数的 `ARS_LDAP_BIND_MESSAGES_FILE`，并在 `[PASSWORD_EXPIRED]`\
  \ 和 `[ACCOUNT_LOCKED]` 两个节下搜索与 LDAP 服务器错误匹配的用户定义文本。\n\n如果找到匹配项，`CMOD` 将显示在 `[BIND_MESSAGES]`节下定义的文件中找到文本。\n\
  \n当 `ARS_LDAP_BIND_MESSAGES_FILE` 参数具有...\n\n\n\n\n\n在下一章 *在 Linux 上安装可选的 Content\
