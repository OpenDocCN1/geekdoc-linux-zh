  \ for the >LibSrvr< server`\n\n## 关键术语\n\n- **IPv6**: 互联网协议第 6 版，是 `IPv4`（第四版）的下一个发布版本和更新。它的用途与\
  \ `IPv4` 类似，但它使用的是 `128-bit` IP 地址，而不是 `IPv4` 使用的 `32-bit` IP 地址，这提供的地址比 `IPv4`\
  \ 多出 10²⁸ 倍，大约是 10²⁸ x 42.9 亿地址！\n\n- **AFP**: IBM 的高级功能演示格式（Advanced Function Presentation），类似于\
  \ PDF，但设计用于直接从打印机模拟打印页面。**IBM i** 使用，可以通过此链接下载完整描述：[`www.ibm.com/docs/en/ssw_ibm_i_72/rzau6/rzau6pdf.pdf`](https://www.ibm.com/docs/en/ssw_ibm_i_72/rzau6/rzau6pdf.pdf)\n\
  \n- **SCS**: `SCS` 数据流是一种用于某些 IBM 针式打印机的顺序流格式，详细描述在在链接中：\n\n[`www.ibm.com/docs/en/personal-communications/13.0?topic=support-scs-data-stream`](https://www.ibm.com/docs/en/personal-communications/13.0?topic=support-scs-data-stream)\n\
  \n- **SCS-Extended**: `SCS-Extended` 格式数据流是基于 **CMOD** 的 IBM i 系统使用的顺序流格式。\n\n若要对\
  \ AFP 或 SCS-Extended 文档使用文本搜索功能，必须安装了便式应用程序解决方案环境（PASE；IBM i 的产品选项）。如果未安装 PASE，在对\
  \ AFP 或 SCS-Extended 文档执行文本搜索时，你将在 Content Manager OnDemand 系统日志中收到消息 161。\n\n-\
  \ **PDF**: 便携文档格式（Portable Document Format）。由 Adobe 开发的文档格式化协议。设计用于在创建该文档的操作系统之外的其它硬件操作系统上独立查看。\n\
  \n# 第 12 章\n\n# 配置 `arsload` 程序\n\n## 引言\n\n本章介绍了 `arsload` 程序参数设置使用的细节。我们涵盖了 **IBM\
  \ Content Manager OnDemand** `arsload` 软件的用途和支持的平台，并描述了提供的可用功能。本章概述了 **IBM CMOD**\
  \ `arsload` 程序的先决条件，包括使用 `arssyscr` 程序创建**系统日志**System Log）和**系统加载**System Load）数据库表。我们还描述了使用\
  \ **Windows** `ARSXML` 程序和 **Linux** `arsxml` 程序从 **XML** 文件导入和导出 **IBM CMOD 应用程序组**，并执行\
  \ **XML** 文件验证。\n\n参见\n\n[`www.ibm.com/docs/en/cmofz/10.5.0?topic=files-configuring-arsload-program`](https://www.ibm.com/docs/en/cmofz/10.5.0?topic=files-configuring-arsload-program)\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n- 使用 `arssyscr` 创建数据库系统表\n\n    - 创建索引\n    - Web\
  \ Enablement Kit 实施指南\n- 为 Windows **ARSLOAD** 程序设置测试数据\n\n    - 首次运行\n    - 使用\
  \ `arsxml` 添加 **IBM CMOD** 应用程序组\n    - 导出 **IBM CMOD** 应用程序组\n    - 更新 **IBM CMOD**\
  \ 应用程序组\n\n# 使用 `arssyscr` 创建数据库系统表\n\n在用 `arsdb` 程序创建了实例或多个实例后（如上一个 第 11 章，在 Linux\
  \ 服务器上启动 arssockd 中，“*使用 arsdb 创建第二个 IBM CMOD 实例*”节所示），我们可以运行 `arssyscr` 来初始化实例的系统日志功能。\n\
  \n# 初始化系统加载日志设施\n\n此 **IBM Content Manager OnDemand** 可选 `arsload` 日志功能可用于跟踪 **IBM\
  \ Content Manager OnDemand** `arsload` 的加载活动。\n\n以下命令使用 `-a` 开关，用于我们的 **Linux IBM\
  \ CMOD** 服务器上，以 **archive** Db2 实例用户的身份运行，为第一个 **archive** 实例创建**系统加载**功能，如图 12.1\
  \ 所示：\n\n```\n./arssyscr -a -I archive\n```\n\n![](img/Figure12.1.jpg)\n\n**图 12.1:**\
  \ 在我们的 ***Linux IBM CMOD*** 服务器上用于为 ***archive*** 创建 ***系统加载***功能的命令。\n\n以下命令使用\
  \ `-a` 开关，用于我们的 **Linux IBM CMOD** 服务器上，为第二个 `archive2` 实例创建**系统加载**功能，如图 12.2 所示：\n\
  \n```\n./arssyscr -a -I archive2\n```\n\n![](img/Figure12.2.jpg)\n\n**图 12.2:**\
  \ 在我们的 ***Linux IBM CMOD*** 服务器上用于为 ***archive2*** 创建 ***系统加载***功能的命令。\n\n## 初始化系统连接日志设施\n\
  \n以下命令使用 `-l` 开关，用于我们的 **Linux IBM CMOD** 服务器上，为第一个 **archive** 实例创建记录用户和程序连接的**系统日志**功能，如图\
