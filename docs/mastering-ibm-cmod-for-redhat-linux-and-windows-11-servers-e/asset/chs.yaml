  \ 字段作为 `account name`，我们将 `Data Type` 设置为 `String`，`Type` 设置为 `Filter`，这将使其能够搜索字段。字符串长度设置为允许的最大\
  \ `254` 个字符，如 *图 B.13* 所示：\n\n    ![](img/Figure_B.13.jpg)\n\n    **图 B.13：** `name`\
  \ 字段的最大 `String` 字段长度设置为 254 个字符\n\n    **注意**：最大的 `String` 字段长度为 254 个字符。\n\n6.\
  \  `account` 字段参数定义为提供 11 字符的 `Fixed` `String` 类型，如 *图 B.14* 所示：\n\n    ![](img/Figure_B.14.jpg)\n\
  \n    **图 B.14：** `account` 字段参数定义为提供 11 字符的 `Fixed String` 类型\n\n7.  `crd_date`\
  \ 字段参数定义将字段设置为 `Date` 并带有 `Filter` 类型，以便启用搜索。勾选 `segment` 框，这决定了应用程序组数据的删除点，如 *图\
