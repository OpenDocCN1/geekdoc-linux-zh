  \n我们通过为 **archive2** 实例输入命令重复该过程，如图 12.6 所示：\n\n```\nsu – archive2\n(输入密码)\n/opt/ibm/ondemand/V10.5/bin/arssyscr\
  \ -I archive2 -m\nexit\n```\n\n![](img/Figure12.6.jpg)\n\n**图 12.6:** 在我们的 ***Linux\
  \ IBM CMOD*** 服务器上用于为 ***archive2*** 创建 ***迁移表***功能的命令。\n\n其中 `archive` 和 `archive2`\
