  \ 列表中看到新的 Invoices 文件夹\n\n# 结论 (#toc.xhtml_s235a)\n\n在本**附录**中，我们涵盖了删除和重新添加 **IBM\
  \ CMOD** 应用程序组所需的逐步步骤，以 **Baxter Bay Credit Application Group** 为例，我们发现为了修改 `crd_date`\
  \ 字段以使用新的日期字段类型是必要的。我们还涵盖了创建新 **Invoices** 文件夹的步骤。\n\n在接下来的附录 C，配置文件和设置列表*中，我们将记录用于书中使用的窗口和\
  \ **Linux** 设置。\n\n# 记忆要点 (#toc.xhtml_s236a)\n\n*   对于 **Application Group** 字段，**String**\
  \ 字段的最大长度为 254 个字符。\n\n*   如果应用程序组的 **Field date** 类型设置为 **segment** 类型，则它被用于确定删除应用程序组数据的过期时间。如果没有将日期字段设置为\
  \ segment，则使用输入文件加载时的日期。\n\n*   **Field** 类型在输入后是不可编辑（下拉菜单显示为灰色），因此在删除并重新输入整个 **Application\
  \ Group** 后，才能在创建 **Application Group** 后修改 **date** 类型。\n\n*   为了成功加载我们的 **Baxter\
  \ Bay Credit** 测试数据，我们必须编辑输入数据文件，将所有两位年份字段改为四位数字。\n\n# 单选题 (#toc.xhtml_s237a)\n\n\
  1. 移除并重新输入 Baxter Bay Credit Application Group 需要运行哪一个程序？\n\n    1. OnDemand Client\
  \ V10.5 (64-bit)\n    2. Windows ARSLOAD\n    3. OnDemand Administrator V10.5 (64-bit)\n\
  \    4. OnDemand Monitor V10.5 (64-bit)\n\n2. 哪种字段类型标记为 segment 以为应用程序组数据提供删除点？\n\
