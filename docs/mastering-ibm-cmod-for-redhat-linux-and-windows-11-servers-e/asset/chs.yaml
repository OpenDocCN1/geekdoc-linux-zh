  154\", \"ARS0154E Unable to establish server communications with network. The return\
  \ code is 2\"], \"\"], 0x2da2c90 /* 104 vars */ <unfinished...>\n```\n\n这被认为是 `/etc/hosts`\
  \ 文件配置问题。`ars.cfg` 文件中的 `ARSSOCK= debug` 参数有助于识别问题。\n\n## 在 Linux 上配置 LIBPATH、LD_LIBRARY_PATH\
  \ 和 PATH\n\n我们必须将库文件添加到 `PATH`、`LIBPATH` 和 `LD_LIBRARY_PATH` 环境变量中。\n\n参见：[解决在部署\
  \ Java API 时遇到未找到链接错误](https://www.ibm.com/support/pages/how-do-i-resolve-javalangunsatisfiedlinkerror-javalangnoclassdefferror-or-ibm-global-security-kit-gskit-errors-when-deploying-odwek-java-api-application)\n\
  \n如下包含包含 `ODWEK` 原生库及其依赖的目录或目录。使用 `vi` 将以下内容添加到 `/root/.bash_profile`：\n\n```bash\n\
  LD_LIBRARY_PATH=/opt/ibm/ondemand/V10.5/www\nexport LD_LIBRARY_PATH\n```\n\n然后，我们使用\
