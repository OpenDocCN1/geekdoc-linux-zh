- "# 精通 RedHat Linux 和 Windows 11 服务器上的 IBM CMOD：通过在 Red Hat Linux 和 Windows 平台上部署带有\
  \ IBM Content Navigator 和 Filenet 固定内容设备的 IBM CMOD，轻松简化您的内容管理（英文版）\n\n\n\n![](img/cover.jpg)\n\
  ![image](img/cover.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/logo.jpg)\n\
  \n[www.orangeava.com](http://www.orangeava.com)\n\n\n\n\n\n**扫描二维码探索我们的完整目录**\n\
  ![](img/cqr.jpg)\n\n[www.orangeava.com](http://www.orangeava.com)\n\n# 献给\n我亲爱的妻子\
  \ Jenny\n我的孩子们 Julie 和 Rosalie\n以及他们的家人\n\n# 关于作者\n`Alan S. Bluck` 是 ASB Software\
  \ Development Limited 的董事，同时也担任系统架构师提供咨询服务。他提供广泛的服务，从高层技术设计到代码开发指导，以及 IBM FileNet\
  \ 核心产品的安装和配置。他还是美国计算机学会 (ACM) 和英国计算机学会 (MBCS) 的成员，IBM 银级 PartnerWorld 业务合作伙伴以及 RedHat\
  \ 认证业务合作伙伴。\n\nAlan 曾在 2022 年被提名为 IBM 冠军，并在 2023 年和 2024 年再次当选。他出版了六本技术书籍和 40 篇\
  \ ResearchGate 论文，均可免费下载。\n\n他负责现有和新 IBM FileNet 系统的高级分析和配置，高级层系统和问题的指导与故障排除，并确保按照既定时间表进行并完成截止日期。\n\
  \nAlan 在商业和科学系统方面拥有超过 45 年的软件开发经验，他拥有 5 年的项目经理/分析开发人员经验、11 年的 12 人软件工程师团队的软件开发经理经验、11\
  \ 年的技术顾问经验以及 20 年的解决方案架构师经验。\n\n# 关于技术审核员\n`Gil Metcalf` 拥有一段长期而丰富的职业生涯，最初成为工业微生物学家，在一家石油公司工作，涉及重金属微生物开采以及废弃井提高采收率等项目。\n\
  \n在担任工业微生物学家之后，Gil 在一家大型制药公司工作多年，担任过项目经理、开发团队负责人和网络管理员等职位。在此期间，他开发了用于临床试验管理的软件和用于癌症患者的医院工具。\n\
  \n作为解决方案架构师，Gil 在金融科技、制造业、物流和能源领域积累了丰富的经验。他的专长涵盖文档管理、案件管理、业务流程自动化、身份管理和网上银行技术。\n\
  \nGil 在业内闻名，曾与领先银行和机构合作，用创新的解决方案解决复杂的挑战。在过去的 10 年里，他专注于金融科技，为蓝筹企业设计并实施解决方案。他拥有文档管理、业务自动化身份管理的多项资质，最近专门从事移动银行的配置管理和无密码认证。\n\
  \nGil 认为，成功的软件架构既需要技术知识，也需要强大的软技能，包括向非技术观众解释复杂概念、理解大局以及完善模糊的需求。\n\n他说，为解决方案设计准备通常是“一种同时进行外推和插值的练习！”\n\
  \n他是多个专业协会的成员，包括英国特许 IT 学会 (BCS)、身份管理学院 (IMI) 和国际软件架构师协会 (IASA)。\n\n# 致谢\n我想感谢几位人士，感谢他们在撰写本书期间提供的持续和不断的支持。首先最重要的是，我要感谢我的妻子\
  \ Jenny，不断鼓励我写写书——没有她的支持，我永远无法完成这本书。\n\n我还要感谢我的女婿 Chris Howles 博士提供的建议和鼓励。\n\n我感谢\
  \ ResearchGate 网站的支持，自 2019 年以来，该网站托管了我的 30 多篇免费出版物，其中许多在书中被引用。\n\n我对 AVA Orange\
  \ 团队表示谢意，感谢他们的支持和奉献，使我能够在短时间内出版这本书，并在制作过程中更新内容，并感谢他们的宝贵建议。\n\n最后，我想感谢本书的技术审核员 Gil\
  \ Metcalf，感谢他的严谨和性建议。\n\n# 前言\n本书为 IBM Content Manager OnDemand (IBM CMOD) 10.5.0.7\
  \ 版本的安装和配置提供了从零开始的逐步指南。\n\n配置涵盖了 IBM Content Manager OnDemand 与 IBM Content Navigator\
  \ 以及 IBM FileNet Content Engine 的集成。`IBM CMOD` 是市场上领先的数据存档和检索系统。\n\n此外，书中还包含了使用\
  \ `ODApi.jar` 的 Java API 工作示例，并涵盖了用于 Web 开发的 Demand Web Enablement Kit (ODWEK) 安装。\n\
  \n书中还描述了 Windows 客户端 IBM CMOD 的安装，并详细说明了如何从 IBM 软件目录和 Fix Central 网站下载基础版本（Base）和补丁包（Fix\
  \ Pack）。\n\n本书分为 14 章，包含 4 个附录。它专为 Java 程序员、IT 顾问以及系统和解决方案架构师设计，要求具备基础 IT 知识。\n\n\
  \n\n\n\n第 2 章 介绍了 IBM Content Manager OnDemand 10.5 版本的逐步下载、安装和配置，包括在运行于 VMware\
  \ 虚拟机系统的 RedHat Linux 8.8 服务器上进行基础版（Base）和 Fix Pack 10.5.0.7 的升级。\n\n第 3 章 介绍了支持的可选软件组件的安装和管理，包括\
  \ Db2 数据库、PDF 索引功能、分发设施功能以及全文本搜索服务器功能。\n\n第 4 章 介绍了 IBM Fix Pack 升级 RPM 文件，以及支持\
  \ CMOD 10.5.0.7 版本的 GSKit 所需安装的某些额外 Linux 操作系统库包。本章描述了这些包的安装过程以及主程序 `arssockd` 加和运行的调试过程。\n\
  \n第 5 章 提供了在 Windows 11 服务器上下载、安装和配置 IBM Content Manager OnDemand 10.5 版本的逐步步骤，包括基础版和\
  \ Fix Pack 10.5.0.7 的升级，以及对连接的 Linux 服务器的某些配置。\n\n第 6 章 介绍了升级和配置后 Linux 系统服务器的重启，包括支持的应用系统：IBM\
  \ Directory Services（LDAP 服务器）、IBM Db2（数据库服务器）、IBM WebSphere（用于 IBM FileNet P8 内容引擎的\
  \ Web 应用服务器）以及 IBM Content Navigator（桌面客户端）。\n\n第 7 章 描述了 OnDemand Configurator\
  \ 程序 V10.5、OnDemand 客户端配置程序、在 Windows 上使用 `arsxml` 命令，以及安装 IBM CMOD Fix Pack 10.5.0.7\
  \ 后的系统配置。\n\n第 8 章 介绍了用于去中心化系统管理用户的对象类型模型和对象所有者模型，以及在 Linux Db2 服务器上重置过期或丢失的 IBM\
  \ CMOD 管理员密码。它还描述了如何使用 `arsstash` 程序存储用户的加密密码。\n\n第 9 章 列出了几个更新后的 Java 程序，这些程序适用于\
  \ IBM CMOD OnDemand API，并在 Linux 服务器的 Eclipse IDE 环境中演示了运行情况。\n\n第 10 章 概述了为 Linux\
  \ 版本的 IBM Content Navigator 创建存储库的步骤，并演示了从为 CMOD 创建的 Content Navigator 桌面端访问 Windows\
  \ CMOD 服务器文件夹的权限。\n\n第 11 章 描述了在 Linux 服务器上成功运行 `arssockd` 程序需要检查的网络要求，包括运行和调试该程序时使用的命令行参数。它还涵盖了利用开源\
  \ Apache Lucene 系统的 IBM OnDemand 全文本搜索服务，并提供了 `arsdb` 数据库配置和维护程序的详细用法。此外，它还涵盖了创建第二个\
  \ Linux IBM CMOD 实例 `ARCHIVE2` 的逐步步骤。\n\n第 12 章 介绍了 IBM Content Manager OnDemand\
  \ `arsload` 软件的作用和支持的平台，并描述了可用功能和前提条件，包括使用 `arssyscr` 程序创建系统日志和系统负载数据库表。此外，它概述了使用\
  \ Windows `ARSXML` 程序和 Linux `arsxml` 程序从 XML 文件导入和导出 IBM CMOD 应用程序组并执行 XML 文件验证的方法。\n\
  \n第 13 章 涵盖了在 Windows 和 Linux 环境下运行 `ARSLOAD` 程序的示例。它描述了加载文档所需的索引字段，并解释了使用 `ARSSOCKD`\
  \ 程序显示 Windows 系统上运行的 IBM CMOD 程序服务列表。最后，它涵盖了使用 `arsdoc` 程序生成 `ARSLOAD` 使用的通用索引字段文件。\n\
  \n第 14 章 了如何在 Windows 和 Linux 服务器环境中，使用 IBM Content Manager OnDemand `ARSXAFP` 程序处理位于目录中的\
  \ AFP 输入文件，并将行数据输出重定向到文件。\n\n附录 A 涵盖了 IBM Content Manager OnDemand Windows Fix Pack\
  \ 7 的下载、解压和安装，以及 Windows IBM Configurator 程序的运行。\n\n附录 B 描述了移除并重新添加 IBM CMOD 应用程序组所需的逐步步骤。\n\
  \n附录 C 列出了 Windows 客户端、Windows 服务器和 Linux 服务器的每个 CMOD 配置文件和环境设置。\n\n附录 D 列出了 ResearchGate\
  \ 和其他书籍出版提供的支持文档，以及由 ASB Software Development Limited 开发的支持 IBM CMOD 集成的联系详情。\n\n\
