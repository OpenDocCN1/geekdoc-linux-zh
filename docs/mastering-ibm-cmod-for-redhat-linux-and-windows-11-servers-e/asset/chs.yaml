  \n## CMOD 10.5 版本的 Linux 前提\n\n在安装 `IBM Content OnDemand 10.5.0` 之前，`Linux` 系统需要满足以下最低前提：\n\
  \n- 用于 `x86_64` 或更高版本的 Red Hat Enterprise Linux (`RHEL`) 更新 7\n- 使用以下 `Linux` 命令安装\
  \ `32bit` 支持的 `glibc.i686`、`libgcc.i686` 和 `libstdc++.i686`：\n\n```\nyum install\
  \ -y libstdc++.devel.i686\n```\n\n这安装了软件包 `libstdc++.devel-8.5.0-20.el686`，如 *图\
  \ 2.19* 所示：\n\n![](img/Figure2.19.jpg)\n\n**图 2.19:** 安装了 `libstdc++.devel-8.5.0-20.el686`\n\
  \n- 数据库：`IBM Db2 V11.1` 或更高版本（也支持其他数据库，包括 Oracle Database 19c 所有版本和未来包）。不支持 Microsoft\
  \ SQL Server。\n- `IBM Spectrum Protect V8.1` 或更高版本。\n- `IBM Global Security Kit\
  \ Version 8`（包含在软件包中）。在 `Linux` 上使用 `JDBC` 连接：\n\n```\njdbc://localhost:25011/ARCHIVE:retrieveMessageFromServer=true;\n\
  ```\n\n运行 `Linux` 命令的方式如下：\n\n```\nyum install -y file-libs python3-magic\n```\n\
  \n此命令用于安装软件包 `file-53.25.el8.x86_64`、`file-libs-53.25.el8.x86_64` 和 `python3-magic-53.25.el8.noarch`，如\
  \ *图 2.20* 所示：\n\n![](img/Figure2.20.jpg)\n\n**图 2.20:** `file-53.25.el8.x86_64`、`file-libs-53.25.el8.x86_64`\
  \ 和 `python3-magic-53.25.el8.noarch`\n\n运行 `Linux` 命令的方式如下，如 *图 2.21* 所示：\n\n```\n\
  yum install -y ncurses-libs.i686\n```\n\n![](img/Figure2.21.jpg)\n\n**图 2.21:**\
  \ 运行 `yum install -y ncurses-libs.i686`\n\n运行 `Linux` 命令的方式如下：\n\n```\nyum install\
  \ -y openssl\n```\n\n```\n![](img/Figure2.22.jpg)\n\n**图 2.22:** 运行 `yum install\
  \ -y openssl`\n\n## 在 RedHat 8 上安装 CMOD\n\nIBM Content OnDemand 的最新 10.5 版本对默认路径有所更改。更新后的路径如下：\n\
