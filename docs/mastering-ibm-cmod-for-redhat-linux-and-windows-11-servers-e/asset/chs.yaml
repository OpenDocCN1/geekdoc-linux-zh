  \  你会使用什么步骤将应用程序组中的字符串（String）字段更改日期（Date）字段？\n\n# 核心术汇\n\n*   `LDAP`: 轻级目录访问协议用于与认证服务器安全系统通信，验证用户、组和其他命名系统组件，以允许对系统及其程序和文件系统的受控访问。\n\
  *   `CFS-CMOD`: 内容联邦服务–Content Manager OnDemand 集成软件用于安装 IBM FileNet P8 内容引擎固定内容设备。\n\
  \    查看 PDF 链接获取概述：[`public.dhe.ibm.com/software/data/cm/filenet/docs/cfsdoc/cmod/45x/Cfs_cmod_config_guide.pdf`](https://public.dhe.ibm.com/software/data/cm/filenet/docs/cfsdoc/cmod/45x/Cfs_cmod_config_guide.pdf)\n\
  \    （“用于 Content Manager OnDemand 的 IBM FileNet 内容联邦服务”）\n*   `SSL`: 安全套接层是一种通过加密网站与浏览器之间传输的数据，或允许两个服务器之间进行通信来保护互联网连接的协议。\n\
  \n# 第 8 章\n\n# Linux 上的 CMOD 系统用户管理\n\n## 引言\n\n本章介绍了对象类型（Object Type）模型和对象所有者（Object\
  \ Owner）模型，用于实现系统管理用户的去中心化，并在 `Linux Db2` 服务器上重置过期或丢失的 `CMOD` `ADMIN` 用户密码。还还描述了使用\
  \ `arsstash` 程序存储用户加密密码，以及 `CMOD` 通用索引器和特定文件格式索引程序。我们还概述了 `Ricoh AFP Workbench Viewer`\
  \ 程序的安装，该程序用于查看商业文档的打印输出存档。\n\n## 结构\n\n在本章，我们将讨论以下主题：\n\n*   用于去中心化系统管理的对象类型模型和对象所有者模型\n\
  *   在 `Db2` 上重置过期或丢失的 `CMOD` `ADMIN` 用户密码\n*   更新 `Linux` 系统中程序二进制文件的文件权限\n*   运行\
  \ `arsstash` 程序加密用户密码\n*   `CMOD` 通用索引器的管理\n\n# 用于去中心化系统管理的对象类型模型和对象所有者模型\n\n`IBM\
  \ Content Manager OnDemand` (`CMOD`) 能够支持集中或去中心化模型以提供安全的系统管理。\n\n对于集中化环境，系统管理员控制系统中定义的所有对象创建创建和安全访问。\n\
  \n去中心化环境允许将系统管理员任务进行划分并分配给其他用户。具体的用户的职责可以根据每个管理用户进行变动和配置，以提供组管理组合：应用程序组管理、用户管理、文件夹管理或这些每项任务的任何组合。\n\
  \n`IBM` 建议在向系统添加任何对象之前，应先考虑集中化或去中心化的管理决定。这一决定可以反转，但如果系统中已经配置了大量的用户、组、文件夹和应用程序组，那么从一种管理类型更改为另一种类型所需的精力是巨大的。\n\
  \n虽然实现系统管理去中心化的方法有很多种，但 `IBM` 记录了两种特定模型，我们将在本节中描述：对象类型模型和对象所有者模型。\n\n注意：其安全结构在 *附录\
  \ B，重建应用程序组* 中所示，该章节涵盖了 `Baxter Bay` 示例的安全应用。\n\n# 对象类型管理模型\n\n通常，每个逻辑部分需要两个管理员用户。第一个用户负责创建和维护用户及组。第二个用户负责创建和维护应用程序、应用程序组和文件夹。\n\
  \n也可以为对象类型模型定义一个用户。系统上的所有对象根据对象的类型分组到不同的管理域。\n\n使用对象类型模型的域管理员负责维护该域内的所有对象。因此，应用程序`组/文件夹/文件柜`管理员维护系统上所有的\
  \ `Application`、`Application group`、`Folder` 和 `Cabinet` 对象。\n\n实现对象类型模型的详细信息在链接中完整描述：\n\
  \n[`www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-object-type-model`](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-object-type-model)\n\
  \n# 对象所有者管理模型\n\n\n\n\n\n对于 `Object Owner`（对象所有者）模型，所有系统和 `CMOD` 对象都根据对象的 `creator/owner`\
  \ 分组到管理域。管理员只能配置、更新和删除由其创建的对象。因此，拥有 `create Application Groups`（创建应用程序组）和 `create\
  \ Folders`（创建文件夹）权限的用户只能维护其创建的 `Applications`、`Application Groups` 和 `folder` 对象。\n\
  \n`Object Owner` 模型通过将系统对象分为不同的逻辑部分（例如部门、公司或其他实体）来维护，使得每个部分相互独立且必须单独维护。\n\n创建和维护用户、组、应用程序、应用程序组和文件夹的权限按这些逻辑部分进行划分。因此，在这种情况下，单个用户将成为系统某个逻辑部分的管理员。\n\
  \n实施“`Object Owner` 模型”的细节请参见此链接：\n\n[`www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-object-owner-model`](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-object-owner-model)\n\
  \n另请：\n\n[`www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-system`](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=administration-system)\n\
  \n# 在 Db2 上重置过期或丢失的 CMOD ADMIN 用户密码\n\n正如上一章针对 `CMOD` Windows 环境介绍的那样，如果忘记了 `ADMIN`\
  \ 用户密码或密码过期，由于密码以加密形式存储在 `Db2` 数据库表字段 `passwd` 中，则必须使用如下 `SQL` 更新语句将 `archive.user`\
  \ 表中 `ADMIN` 用户的 `passwd` 字段重置为空字符串（`null`）：\n\n```bash\n[archive@ECMUKDEMO22 config]$db2\n\
  db2 => connect to ARCHIVE\nselect userid from archive.arsuser;\nupdate archive.arsuser\
  \ set passwd='' where userid='ADMIN'\ncommit\ndb2 => quit\nDB20000I  The QUIT command\
  \ completed successfully.\n[archive@ECMUKDEMO22 config]$\n```\n\n将 `ADMIN` 用户密码字段设置为空字符串的完整\
  \ `db2` `SQL` 命令列表所示 图 8.1：\n\n![](img/Figure8.1.jpg)\n\n**图 8.1：** 将 `ADMIN` 用户密码字段设置为空字符串的完整\
  \ `db2` SQL 命令列表\n\n参见链接：\n\n[`www.ibm.com/support/pages/recovery-lost-password-super-id-admin-content-manager-ondemand`](https://www.ibm.com/support/pages/recovery-lost-password-super-id-admin-content-manager-ondemand)\n\
  \n随后，在 `Windows` 服务器上登录 `CMOD` 客户端管理员程序 `CMOD OnDemand` 客户端，登录 `ECMUKDEMO22` `Linux`\
  \ 服务器，并按照 第 7 章，Windows 上的 CMOD 管理 中“更新 Windows `ADMIN` 密码”节的描述更新密码。\n\n# 更新 Linux\
  \ 系统中程序二进制文件的文件权限\n\n`Linux CMOD` `/opt/ibm/ondemand/V10.5/bin` 文件夹中的程序文件需要使用以下命令将所有权从\
  \ `root` 安装用户和组更改为 `archive` 用户和组，程序文件列表及相应的安全结果所示 图 8.2：\n\n```bash\ncd /opt/ibm/ondemand/V10.5/bin\n\
  chown archive:db2iadm1 ars*\nls -lsa ars*\n```\n\n![](img/Figure8.2.jpg)\n\n**图\
  \ 8.2：** 所有权从 `root` 安装用户和组更改为 `archive user` 和 `group`\n\n# 在 Linux 上将数据库架构从 Root\
  \ 移动到 Archive\n\n在 `Linux` 服务器上，使用 `root` 用户进行的原始 `CMOD` 安装创建 `ARCHIVE` 实例数据库表的架构（schema）为\
  \ `ROOT`。这导致在尝试启动服务程序时出现错误，因为程序无法在数据库中找到引用的 `ARCHIVE.ARSAG` 表。解决方案是通过导出表的完整 `DDL`\
  \ 列表来重新创建所有架构为 `ARCHIVE` 的表。\n\n本节在 第 3 章，在 Linux 上安装可选 CMOD 软件 中有更详细的介绍。\n\n首先，我们如下启动\
  \ `ARCHIVE` 实例的 `Db2` 数据库：\n\n```bash\n[archive@ECMUKDEMO22 config]$ ../bin/arsdb\
  \ -gkv\nARS4015I Starting the DB2 ARCHIVE database instance\nARS4078I The ARCHIVE\
  \ instance has already been started\nARS4017I Activating the DB2 ARCHIVE database\n\
  [archive@ECMUKDEMO22 config]$\n```\n\n请参考：\n\n[`www.ibm.com/support/pages/simple-way-change-schema-names-db2-linux-unix-and-windows`](https://www.ibm.com/support/pages/simple-way-change-schema-names-db2-linux-unix-and-windows)\n\
  \n使用 `db2look` 命令创建表的 `DDL` 并将其导出到 `outputfile.sql`，以便使用 `vi` 编辑器编辑表架构，将其从 `ROOT`\
  \ 用户更新为 `ARCHIVE` 用户，所示 图 8.3：\n\n```bash\ndb2look -d ARCHIVE -e -o outputfile.sql\n\
  ```\n\n![](img/Figure8.3.jpg)\n\n**图 8.3：** 该命令用于创建表的 `DDL` 并将其导出到 `outputfile.sql`\n\
  \n随后可以从 `ARCHIVE` 实例 `Db2` 数据库中删除 `ROOT` 架构，所示 图 8.4：\n\n```bash\ndb2\ndb2 => connect\
  \ to ARCHIVE\ndb2 => DROP SCHEMA('ROOT', NULL)\ndb2 => quit\n```\n\n![](img/Figure8.4.jpg)\n\
  \n**图 8.4：** 然后可以从 `ARCHIVE` 实例 `Db2` 数据库中删除 `ROOT` 架构\n\n可以按照 第 3 章，在 Linux 上安装可选\
  \ CMOD 软件 中的“将数据库从 root 移动到 archive”节继续数据库更新。现在我们可以使用 `arssockd` 程序运行 `Library`\
  \ 服务器来启动 `ARCHIVE` 实例，所示 图 8.5：\n\n（此处提供的 `ps` 命令用于确认 `arssockd` 程序正在运行）。\n\n```bash\n\
  cd /opt/ibm/ondemand/V10.5/config\n../bin/arsdb -gkv\nps -eaf|grep ars\n```\n\n\
  ![](img/Figure8.5.jpg)\n\n**图 8.5：** 我们现在可以使用 `arssockd` 程序启动 `ARCHIVE` 实例来运行 `Library`\
  \ 服务器\n\n命令的全路径用法为 `/opt/ibm/ondemand/V10.5/bin/arssockd -I archive`，所示 图 8.6：\n\
  \n![](img/Figure8.6.jpg)\n\n**图 8.6：** 命令的全路径用法为 `/opt/ibm/ondemand/V10.5/bin/arssockd\
  \ -I archive`\n\n可以使用以下命令验证 `CMOD` 对象服务器为激活状态，所示 图 8.7：\n\n```bash\nps -eaf|grep\
  \ arsbd\n```\n\n![](img/Figure8.7.jpg)\n\n**图 8.7：** 使用 `ps -eaf|grep arsbd` 可以验证\
  \ `CMOD` 对象服务器为激活状态\n\n# 运行 arsstash 程序以加密用户密码\n\n`arsstash` 程序在 `ars.stash` 文件存储主\
  \ `CMOD` 系统用户密码的加密副本，该文件通常存储在 `/opt/ibm/ondemand/V10.5/config` `Linux` 文件夹路径下。\n\
  \n程序命令行上的 `-a` Action（操作）开关定义了程序的操作是存储密码还是从 `ars.stash` 文件中删除用户 ID 和密码，使用 `arsstash`\
  \ 程序帮助列表中列出的 `n`（`<action>` 数字），获取方法如下所示：\n\n```bash\n[archive@ECMUKDEMO22 bin]$\
  \ ./arsstash\nARS1600I Usage: arsstash [-a <action>] [-c] -s <stash_file> -u <userid>\n\
  Version:  10.5.0.7\n-a <action> 要执行的操作\n1  - 存储 OnDemand 用户和密码 (默认)\n2  - 删除 OnDemand\
  \ 用户和密码\n3  - 存储用于 ARSLOAD 的 OnDemand 用户和密码\n```\n\n\n\n\n\n4 - 存储 ODF 的 OnDemand\
  \ 用户名和密码\n6 - 存储 PDD 的 OnDemand 用户名和密码\n7 - 存储 LDAP 用户名和密码\n8 - 存储 DB2 用户名和密码\n\
  9 - 存储 Oracle 用户名和密码\n10 - 存储 ZooKeeper 用户名和密码\n11 - 存储 PKCS11 用户名和密码\n12 - 存储 SQL\
  \ Server 用户名和密码\n\n如果操作 3 至 12 未提供用户名 (`-u`)，则将显示相应的 OnDemand 命令或数据库当前分配的用户名\n\n\
  `-c` 创建存储文件\n`-s <stash_file>` 存储文件名为\n`-u <userid>` 用户名\n`-1 <trace_file>` 跟踪文件\n\
  `-2 <trace_level>` 跟踪级别\n\n```\n[archive@ECMUKDEMO22 bin]$\n```\n\n例如，`ADMIN` 用户的密码可以存储在\
  \ `ars.stash` 文件中，如下：\n\n```\n[archive@ECMUKDEMO22 bin]$ ./arsstash -a1 -s ../config/ars.stash\
  \ -u ADMIN\n```\nOnDemand Password: `filenet123`\nVerify OnDemand Password: `filenet123`\n\
  ```\n[archive@ECMUKDEMO22 bin]$\n```\n**注意：** `ADMIN` 用户的密码至少需要 8 个字符长度。\n\n# CMOD\
  \ 通用索引器管理\n\n**IBM Content Manager OnDemand** 通用索引器用于为任何需要存储在 `CMOD` 系统中的输入文件定义索引数据，但也存在专门为索引特定文件格式设计的索引器程序。这些程序列如下：\n\
  \n* `arsload` 程序可用于处理 PDF 输入文件。当应用程序节点的 `Indexer Information` 选项卡将 `PDF` 定义为索引器时（如图\
  \ 8.8 所示），`arsload` 将调用 `PDF indexer` 来处理输入文件。\n\n    ![](img/Figure8.8.jpg)\n\n\
  \    **图 8.8:** 应用程序节点的 `Indexer Information` 选项卡将 `PDF` 定义为索引器\n\n    随后 `PDF indexer`\
  \ 加载 `PDF` 输入文件并应用索引参数来确定索引数据的位置和属性。然后它从 `PDF` 文件中提取索引数据，并生成索引文件和一个包含一组索引页的输出文件。\n\
  \n* **IBM** `CMOD` 还有一个 `XML` 索引器，允许对 XML 文档进行索引和归档，这同样从 `arsload` 程序启动。\n\n* `arsacif`\
  \ 程序，用于 AFP 的 AFP 转换和索引设施 (`ACIF`)，AFP 用于数据和行数据的高级打印（参见 https://www.ibm.com/docs/en/cmofm/10.5.0?topic=indexer-acif-overview）。\n\
  \n    Ricoh 的 AFP 打印机驱动程序适用于 `Windows` 系统：\n\n    https://www.ibm.com/support/pages/afp-printer-driver-windows\n\
  \n    如果您有权限 ID (entitlement ID)，以下链接将从 Ricoh 下载 AFP 驱动：\n\n    https://dl.ricohsoftware.com/eid/download/MzkwMA%3D%3D/aa9a248e-101c-4aa6-b109-1cf7403f3b4f\n\
  \n    `AFP` 安装程序在 `Windows 10 Home` 版或 `Windows 11 Pro` 操作系统上运行正常，但 `Windows defender`\
  \ 程序可能会阻止 `Ricoh` 查看器和打印程序的安装，因为它无法检测安装程序 `.exe` 程序的发布者详情。您需要覆盖 `Windows defender`\
  \ 程序来安装驱动程序等（风险需自担！）。`AVG` 病毒检查器未发现安装的两个 `Ricoh` 程序有问题。\n\n    已安装的 `AFP Ricoh viewer`\
  \ 程序显示在本章末尾。\n\n    欲需 `AFP` 的详细概述，请参见链接：https://en.wikipedia.org/wiki/Advanced_Function_Presentation\n\
  \n    Ricoh AFP Workbench Viewer 程序带有我们安装副本所示的示例帮助屏幕，请参考图 8.9：\n\n    ![](img/Figure8.9.jpg)\n\
  \n    **图 8.9:** `Ricoh AFP Workbench Viewer` 对于 `Version 03.09.00` 的帮助->关于屏幕\n\n\
  \    已安装的 `Ricoh Workbench Viewer` 程序显示了示例 `medform.afp` 文件，这是程序自带的示例文件之一，如图 8.10\
  \ 所示：\n\n    ![](img/Figure8.10.jpg)\n\n    **图 8.10:** 示例 `medform.afp` 文件，程序自带的示例文件之一\n\
  \n    `arsxml` 和 `arsload` 程序具有以下开关，可以使用 `--h` 帮助查看：\n\n    ```\n    [archive@ECMUKDEMO22\
  \ bin]$ ./arsxml --h\n    ARS770I Usage: arsxml add|delete|export|validate [options]\n\
  \    Version: 10.5.0\n\n    [archive@ECMUKDEMO22 bin]$ ./arsload --h\n    ARS430I\
  \ Usage: arsload [options] [load_file]\n    ```\n\n    `arsload` 程序的 `-h` 帮助为在 `Linux`\
  \ 系统上运行 `Version: 10.5.0` 的 `IBM CMOD` 加载程序提供了以下信息。更详细的描述请访问：https://www.ibm.com/docs/en/cmofm/10.5.0?topic=arsload-parameters\n\
  \n    开关列表及其含义如下：\n\n1. `-a <appl>` `Application Group` 中由 `<appl>` 代表的 `Application`。例如，`-a\
  \ Baxter Credit`（此开关默认取决于文件名命名约定。）\n2. `-A <field>` 用于 `IBM OnDemand` 应用程序的 `MVS`（多虚拟存储）文件名部分。\n\
  3. `-b <index_number,field>` 索引号 (1-8) 以及要录的字段名。（其中索引号标识 `arsload` 程序分配给该索引字段的输入文件部分。）\n\
  4. `-B <filename_format>` 用于解析的输入文件名格式（例如 `PDF` 或 `AFP`）。`<filename_format>` 简写组件的值（每个部分由句点\
  \ `.` 分隔）可以描述如下：\n    * `WRI` 是 `WRITER` 的缩写\n    * `MVS` 是 `Multiple Virtual Storage`\
  \ 的缩写\n    * `JOB` 是 `JOBNAME` 的缩写\n    * `DAT` 是 `DATASET` 的缩写\n    * `FOR` 是 `FORMS`\
  \ 的缩写\n    * `YY` 是 `YYDDD` 的缩写\n    * `HH` 是 `HHMMM` 的缩写\n    * `AG` 是 `Application\
  \ Group` 的缩写\n    * `APP` 是 `Application` 的缩写\n    * `FLD` 用于索引的 `Field` 占位符\n \
  \   * `1-8` 索引号 (1-8) - 前置于上述作为索引使用的索引部分（每个被使用的索引需要一个 `-b` 参数）\n    * `IGN` 忽略文件名的此部分（无法索引）\n\
  \    * `.EXT` 扩展名\n\n    以下示例显示了对默认格式文件使用这些简写值的结果：\n    对于定义如下的文件：`MVS.JOBNAME.DATASET.FORMS.YYDDD.HHMMM.ARD`，格式可以写为：`MVS.JOB.DAT.FOR.YY.HH.EXT`\n\
  \    格式也可以写为 `MVS.1JOB.DAT.FOR.YY.HH.EXT`，将文件中的 `JOB` 部分关联为加载 `index 1`\n    下一个示例适用于非默认格式的文件：`APPLICATION_GROUP.APPLICATION.MISC.DATE.ARD`\n\
  \    格式可以写为 `AG.APP.IGN.FLD.EXT`，而 `AG.APP.IGN.1FLD.EXT` 可提取文件名中的日期信息到特定的索引字段。\n\
  5. `-c <idx_dir>` 这是索引器的目录，默认为当前目录\n6. `-C <class>` (OD/zOS) 要监控的 jes 类\n7. `-d\
  \ <dl_dir>` 下载目录，可以指定多次\n8. `-e` 忽略空文件为失败\n\n\n\n\n\n9. `-E` 执行 `arsuupdt` 用户挂起程序。\n\
  \n10. `-f` 如果加载失败，则卸载数据。\n\n11. `-F <form>` (OD/zOS) 要监控的 jes 表单。\n\n12. `-g <appl_grp>`\
  \ `Application Group`，默认使用文件名命名约定。\n\n13. `-G <field>` 用于 `OnDemand` `Application\
  \ Group` 的 MVS 文件名组件。例如，对于 (OD/zOS)，我们有 `WRITER.MVS.JOBNAME.DATASET.FORMS` 或 `MVS.JOBNAME.DATASET.FORMS`（否则则为\
  \ `MVS.JOBNAME.DATASET.FORMS`）。\n    此开关默认为 `FORMS`。\n\n14. `-h <od_inst>` `IBM\
  \ OnDemand` 库服务器或实例名称（与 `-I` 相同）。\n\n15. `-i` 仅运行索引器。\n\n16. `-I <od_inst>` OnDemand\
  \ 库服务器或实例名称（与 `-h` 相同）。\n\n17. `-J <file_name_delimiter>` 用于文件名解析的分隔符字符（默认：）。\n\n\
  18. `-j <parm_file>` 可从文件中读取的额外索引参数。\n\n19. `-l <field>` 使用字段标识符触发整个加载文件名的索引。\n\n\
  20. `-n` 不移除已加载的文件。\n\n21. `-p <passwd>` 密码存储文件的名称。\n\n22. `-s <input>` (OD/zOS)\
  \ 作为输入的 JCL ddname（即 `INPUT`）。\n\n23. `-t <seconds>` 睡眠时间间隔，默认为 600 秒。\n\n24. `-u\
  \ <userid>` IBM CMOD 用户 ID，例如 `ADMIN`。\n\n25. `-v` 详细：在命令行窗口中显示完整日志输出。\n\n26. `-W\
  \ <writer>` (OD/zOS) 要监控的 jes 写入器。\n\n27. `-X <indexer>` 要使用的索引器代码字母（这会覆盖应用程序中定义的索引器）。索引器代码名称如下：\n\
  \    * `A`: Content Manager OnDemand ACIF Indexer\n    * `G`: Content Manager OnDemand\
  \ Generic Indexer File Format\n    * `P`: Content Manager OnDemand PDF Indexer\n\
  \    * `X`: Content Manager OnDemand XML Indexer\n    * `3`: 390 Indexer\n    *\
  \ `4`: 400 Indexer\n\n28. `-Z <user_def>` 传递给加载程序用户挂起的用户定义字符串。\n\n29. `-1 <trace_file>`\
  \ 用于写入调试输出以诊断错误的跟踪文件。\n\n30. `-2 <trace_level>` 用于写入调试输出以诊断错误的跟踪级别。\n\n`Generic`\
  \ 索引器不是一个索引程序，而是指参数文件格式。\n\n在 IBM 文档 `IndexingReference.pdf` 的 `第 6 章, Generic Indexer`\
  \ 中有详细描述，该文件位于第二个 URL 链接。\n\nIBM `CMOD` 通用索引器的 `IBM Knowledge Base` URL 链接可见：\n\
  [`www.ibm.com/docs/en/cmofm/10.5.0?topic=ondemand-generic-indexer`](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=ondemand-generic-indexer)\n\
  \n还有一个可下载的 `Indexing Administration` `pdf` 指南，位于：\n[`cmod.wiki/dox/CMODv10.5/IndexingReference.pdf`](https://cmod.wiki/dox/CMODv10.5/IndexingReference.pdf)\n\
  \n# 结论 (#toc.xhtml_s114a)\n\n在本章中，我们描述了 `Object Type` 模型和 `Object Owner` 模型，用于实现系统管理用户的去中心化，以及在\
  \ `Linux` `Db2` 服务器上重置过期或丢失的 `CMOD ADMIN` 用户密码。我们还描述了使用 `arsstash` 程序存储用户加密密码的方法，以及\
  \ `CMOD` `Generic Indexer` 和更具体的文件格式索引程序。\n\n在 `第 9 章, CMOD Java API 示例` 中，我们将列出几个\
  \ Java 程序示例，这些程序已更新，可用于适用于 `IBM CMOD OnDemand API` 的最新版本 `10.5.0.7`。我们还将在如何在 `Linux`\
  \ 服务器的 `Eclipse IDE` 环境中运行它们。\n\n# 注意事项 (#toc.xhtml_s115a)\n\n* `ADMIN` 用户密码长度至少为\
