  \ `ALL`（定义组件）\n- `CMD`（当前命令的参数）\n- `WWW`\n- `CACHE`\n- `CS`\n- `CSV`\n- `XPORT`\n\
  - `COMP`\n- `CFG`\n- `XR`\n- `DB`\n- `DATE`\n- `ICU`\n- `LOAD`\n- `MEM`\n- `OS`\n\
