  \ Linux 命令：\n\n```bash\ncd /opt/IBM/DB2/server_dec\nexport DISPLAY=:0\necho $DISPLAY\n\
  ./db2setup\n```\n\n### 8. 随后我们为 `archive2` 遵循相同的 Db2 安装步骤，这与 第 2 章，在 Linux 系统上安装\
