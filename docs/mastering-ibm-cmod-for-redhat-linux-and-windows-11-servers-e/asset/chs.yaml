  \ 4\n- `FLOW`: 8\n\n## 示例\n\n- 为当前命令启用错误/警告跟踪：\n  `TRACE_LEVELS=CMD=3`\n- 为所有组件启用错误/警告/信息跟踪：\n\
  \  `TRACE_LEVELS=ALL=3`\n- 跟踪数据库级别：\n  `TRACE_LEVELS=ALL=3,DB=7`\n\n`TRACE_FILE`\
  \ 将位于 `/ARS_TMP` 目录下。`TRACE_LEVELS` 定义了组件和跟踪级别。\n\n```\n[TRACE]\nTRACE_FILE=ARCHIVE.trace.log\n\
  TRACE_LEVELS=ALL=3\nTRACE_FILE=ARCHIVE.trc\nAPPEND=1\n```\n\n运行 `arssockd` 程序时会生成一个\
  \ `/tmp/arssock.err` 文件，该文件未在支持程序的注释中列出。`arssockd` 程序使用的唯一配置参数似乎是 `TRACE_LEVELS=ALL=3`。\n\
