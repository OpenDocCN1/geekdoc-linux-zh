  \n### 8. 为文档联邦配置 CFSOD 导出工具\n\n[https://www.ibm.com/docs/en/SSNW2F_5.2.0/com.ibm.p8.installingcfsod.doc/cfsod014.htm]\n\
  \n# 旧版 CMOD 参考\n\n请参考版本 8.4 - Implementing IBM Content Manager OnDemand 解决方案：\n\n\
  `www.redbooks.ibm.com/redbooks/pdfs/sg247511.pdf`\n\n## 创建 Content Manager OnDemand\
  \ 实例\n\n关于创建 `CMOD` 实例的信息，请参考以下链接：\n\n`www.ibm.com/docs/en/cmofm/10.5.0?topic=multiplatforms-installing-content-manager-ondemand-linux-servers`\n\
  \n要在库服务器上安装 `Db2`，我们使用以下步骤列表以确保所有配置步骤都已完成：\n\n由于我们之前已经为 IBM FileNet 和 IBM Content\
  \ Navigator 安装了该程序，因此我们使用了 `Db2` 安装向导。由于默认安装路径已被占用，我们安装了一个新的 `Db2` 副本。对于我们的 Linux\
  \ 系统，默认路径变为 `/opt/ibm/db2/V11.5_##`，其中 `##` 是 `01` 到 `99` 范围内的零前缀序列数字。\n\n1. 安装\
  \ `Db2` 通用数据库企业版（我们使用的是 `Db2 11.5.0.7`）。\n\n为了支持所有组件在新的 `Db2` 安装上运行 `Content Manager\
  \ OnDemand`，安装类型的响应应选择 `Typical.`。请参考 `ResearchGate` 上的以下免费下载：\n\n- 在 RHEL 8.0 V1\
  \ 上安装 IBM Database, Db2 10.5：[https://doi.org/10.13140/RG.2.2.10491.67369]\n- 在\
  \ RedHat RHEL 8.0 上将 IBM FileNet 系统从 DB2 10.5 FP 10 升级到最新的 DB2 11.5 版本：[https://doi.org/10.13140/RG.2.29470.9441]\n\
  \n2. 我们现在按照如下值为 `Content Manager OnDemand` 创建了 `Db2` 实例：\n\n- 实例名称 / 用户：`archive`\n\
  - 组名：`db2iadm1`\n- 目录：`/home/archive`\n- 启动启动时自动启动 `Db2`：`n`\n- 为 `Db2` 实例创建示例数据库：`no`\n\
  \n注意：该组必须具有 SYSADM 权限且其名称必须唯一。Linux 上的组名为 `db2iadm1`。\n\n在安装 `Db2` 软件后，请按照链接中的详细说明为\
  \ `Db2` 应用最新的修复包：[https://doi.org/10.13140/RG.2.29470.9441]。你可以在此处查看最新的修复包：[http://www.ibm.com/support/docview.wss?uid=swg270053]。\n\
  \n安装 `Db2` 后，你必须将拥有 `Content Manager OnDemand` 实例的用户添加到 `Db2` 实例所有者组 `db2iadm1`\
  \ 中。更多详细信息请参考 https://www.ibm.com/docs/en/db2/11.5?topic=idds-installing-db2-servers-by-using-db2-setup-linux。\n\
  \n接下来，遵循这些指南（按照上一节所述步骤逐步操作）：作为 `root`，我们运行了以下 `RedHat Linux` 命令：\n\n```bash\nsubscription-manager\
  \ repos --enable=codeready-builder-for-rhel-8-x86_64-rpms\nyum install xorg-x11-apps\n\
  ```\n\n在安装 `Db2` 后，注销并以 `root` 重新登录：\n\n```bash\ncd /opt/ibm/db2/V11.5_##\n./dbsetup\n\
  ```\n\n### 在库服务器上安装 Db2 后：\n\n`CMOD archive` 实例创建的必要步骤如下：要使用 `Db2`，你需要以 `archive`\
  \ 实例所有者登录（使用端口号 `2501`）。\n\n可选步骤如下：为了验证安装文件、实例和数据库功能，IBM 建议运行验证工具 `/opt/ibm/db2/V11.5_##/bin/db2val`。`Db2`\
  \ 许可 CD 未包含在物理介质中，可以从 Passport Advantage 下载。\n\nContent Manager OnDemand 所有者必须添加到\
  \ `Db2` 实例所有者组。\n\n因此，如果 `Content Manager OnDemand` 实例所有者是 `root`，且 `Db2` 实例所有者组是\
  \ `db2iadm1`，并且 `ars.ini` 文件中的 `SRVR_INSTANCE_OWNER` 参数指定为 `root`，请将 `root` 用户添加到\
  \ `db2iadm1` 组。\n\n必须验证 `ars.cfg` 文件中的 `DB2INSTANCE` 参数。\n\n注意：`DB2INSTANCE` 值必须指定\
  \ `CMOD` 创建的 `Db2` 实例名称，其默认值为 `archive`。还应注意该值是区分大小写的。\n\n1. 在 `ars.cfg` 文件中添加 `ARS_ORIGINAL_CODEPAGE=1208`。\n\
  2. 创建数据库\n\n```bash\nmkdir /arsdb\nmkdir /arsdb_primarylog\nmkdir /arsdb_archivelog\n\
  chown archive:db2iadm1 /arsdb_primarylog\nchown archive:db2iadm1 /arsdb_archivelog\n\
  chown archive:db2iadm1 /arsdb\n```\n3. 登录 `Db2` 数据库用户 `su – archive` 并运行 `CMOD`\
  \ 命令：\n\n```bash\n/opt/ibm/ondemand/V10.5/bin/arsdb -I archive -cv\n[root@ECMUKDEMO22\
  \ config]# cd ../bin\n[root@ECMUKDEMO22 bin]# chown archive:db2iadm1 ars*\n[root@ECMUKDEMO22\
  \ bin]# ls -lsa ars*\n```\n\n注意：标识 `CMOD` 数据库运行所需的用户名称的参数大小写必须一致，因此如果一个设置为小写 `archive`\
  \ 而另一个被设置为大写 `ARCHIVE`，则 `arssockd` 程序将报错错误代码 `ARS0152E`。\n\n\n\n\n\n在尝试此功能之前，请确保已为\
  \ `application group` 开启了 `CFS-CMOD` 函数，并且已设置了使用 `CFS-CMOD` 的权限。否则将会发生权限错误。\n\n\
  在 `ars.ini` 文件中，我们需要设置以下内容：\n\n`SRVR_INSTANCE_OWNER=archive`\n\n在 `ars.cfg` 文件中：\n\
