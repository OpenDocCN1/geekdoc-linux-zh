  \ *第 13 章，运行 ARSLOAD* 中描述的 Windows `ARSLOAD` 程序。\n\n我们将描述用于删除原始 **Baxter Bay Credit**\
  \ **Application Group** 然后重新添加一组更新的**索引字段 (Index Fields)** 的程序。当原始**索引字段**设置的类型与\
  \ **ARSLOAD** 程序预期的类型不兼容时（该类型从待加载的数据得出），则需要此过程。\n\n## 结构\n\n在本附录中，我们将讨论以下主题：\n\n\
  * 删除现有的组\n* 创建新组\n    * 第三次运行时的日期问题\n    * 在编辑数据文件后第四次运行成功\n\n# 删除现有的组\n\n\n\n\n\
  \n我们发现无法更改 `Baxter Bay Credit Application` 组首次部署时的某些 `Index Field` 类型，正如 *第 13 章，运行\
  \ ARSLOAD* 中描述的那，因此成功加载示例数据的唯一解决方案是删除并重建该组，如下所示：\n\n1.  首先，我们从 Windows 资源管理器中的子文件夹\
  \ `IBM OnDemand Clients V10.5 (64-bit)` 加载程序 `OnDemand Administrator V10.5 (64-bit)`，如\
  \ *图 B.1* 所示：\n\n    ![](img/Figure_B.1.jpg)\n\n    **图 B.1：** 选择 `OnDemand Administrator\
  \ V10.5 (64-bit)` 程序\n\n2.  系统提示我们通过右键点击菜单树中的服务器名称并选择 `Logon` 菜单项，使用 `OnDemand Administrator\
  \ V10.5 (64-bit)` 程序登录到 Windows 服务器，如 *图 B.2* 所示：\n\n    ![](img/Figure_B.2.jpg)\n\
  \n    **图 B.2：** 通过右键点击服务器名称使用 `OnDemand Administrator` 登录服务器\n\n3.  我们在 `DESKTOP-B3JB93R`\
  \ 服务器中输入 `ADMIN` 管理员用户的 `User ID` 和 `Password`，并点击 `OK` 按钮，如 *图 B.3* 所示：\n\n   \
  \ ![](img/Figure_B.3.jpg)\n\n    **图 B.3：** 我们在 `DESKTOP-B3JB93R` 服务器中输入 `ADMIN`\
  \ 管理员用户的 `User ID` 和 `Password`\n\n4.  从程序左侧的导航树面板上选择 `Applications Groups` 后，可以看到\
  \ `Baxter Bay Credit` 应用程序组名称，然后右键点击并选择 `Delete` 菜单项，如 *图 B.4* 所示：\n\n    ![](img/Figure_B.4.jpg)\n\
  \n    **图 B.4：** 选中 `Baxter Bay Credit` 名称并右键点击 `Delete` 菜单项\n\n5.  系统弹出第二次安全登录提示，以确认我们有权删除\
  \ `Baxter Bay Credit` 应用程序组，如 *图 B.5* 所示：\n\n    ![](img/Figure_B.5.jpg)\n\n   \
  \ **图 B.5：** 弹出第二次安全登录以确认我们有权删除 `Baxter Bay Credit`\n\n6.  我们仍然有机会通过 `Cancel` 命令按钮退出删除操作；但我们从弹出窗口中选择\
  \ `OK` 命令按钮以完成删除操作过程，如 *图 B.6* 所示：\n\n    ![](img/Figure_B.6.jpg)\n\n    **图 B.6：**\
  \ 我们从弹出窗口中选择 `OK` 命令按钮以完成删除操作\n\n7.  现在强调了在 `IBM OnDemand` 系统中删除任何内容的严谨性，因为我们获得了第二个窗口（以及另一个机会）来使用\
  \ `Cancel` 命令取消对 `Baxter Bay Credit Application Group` 的删除操作。\n\n    我们在此最终窗口中通过选择\
  \ `Yes` 命令按钮来确认删除操作，如 *图 B.7* 所示：\n\n    ![](img/Figure_B.7.jpg)\n\n    **图 B.7：**\
  \ 我们在此最终窗口中通过选择 `Yes` 命令按钮确认删除操作\n\n#### 加回应用程序组\n\n8.  高亮的 `Application Groups`\
  \ 树节点现在仅显示两个由 `IBM CMOD` 系统生成的 `Application Groups`：`System Load` 和 `System Log`，如\
  \ *图 B.8* 所示：\n\n    ![](img/Figure_B.8.jpg)\n\n    **图 B.8：** `Application Groups`\
  \ 树节点显示两个剩余的 `IBM CMOD Application Groups`\n\n9.  在下一节中，我们将遵循下一步，即重建 `Baxter Bay\
  \ Credit` 应用程序组的程序。\n\n# 创建新的应用程序组](#toc.xhtml_s231a)\n\n1.  选中 `Application Groups`\
  \ 树节点并选择 `New Application Group` 菜单项，以开始创建新版本的 `Baxter Bay Credit`，如 *图 B.9* 所示：\n\
