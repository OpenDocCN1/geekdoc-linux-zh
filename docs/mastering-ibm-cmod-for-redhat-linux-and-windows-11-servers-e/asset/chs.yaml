  ARS4034I Creating index root.arsloadwork_loadid_idx\nARS4040I Reorganizing table\
  \ root.arsloadwork\n[archive@ECMUKDEMO22 bin]$\n```\n\n## 在 Linux 上将数据库架构从 root\
  \ 移动到 archive\n\n使用以下步骤重建了 `CMOD Db2 ARCHIVE` 数据库，以将 41 张数据库表从 `root` 架构更改到 `archive`\
  \ 架构。\n\n使用 `arsdb` 程序启动 `CMOD ARCHIVE` 数据库实例，如下如下：\n\n（从 `CMOD` `config` 目录开始）\n\
  \n```\n[archive@ECMUKDEMO22 config]$ ../bin/arsdb -gkv\n```\n```\nARS4015I Starting\
  \ the DB2 ARCHIVE database instance\nARS4078I The ARCHIVE instance has already started\n\
  ARS017I Activating the DB2 ARCHIVE\n[archive@ECMUKDEMO22 config]$\n```\n参见：https://www.ibm.com/support/simple-way-change-schema-names-db2-linux-windows\n\
  \n1. 首先，我们创建一个 `outputfile.sql` `SQL` 文件，包含要更改架构的表结构 `DDL`：\n```\ndb2look -d ARCHIVE\
  \ -o outputfile.sql\n```\n该命令的输出显示在图 3.1 中。图 3.1：`db2look` 用于导出表的 sql。\n\n2. 在 `outputfile.sql`\
  \ 文件中，我们需要找到并将 `root` 架构名更改为 `archive` 架构名。我们使用 Linux 编辑器 `vi outputfile.sql`，并通过以下\
  \ `vi` 命令编辑文件：\n```\n:s/ROOT/ARCHIVE/g\n```\n此命令将搜索并替换所有表的 `ROOT` 架构名为 `ARCHIVE`。\n\
  \n3. 下一步，我们运行 `db2move` 命令来创建所有文件：\n```\n[archive@ECMUKDEMO22 config]$ db2move\n\
  ```\n这将创建 `archive` 架构的文件。\n```\n[archive@ECMUKDEMO22 config]$ db2move archive\n\
  ```\n这将创建 `archive` 架构的文件。\n```\n[archive@ECMUKDEMO22 config]$ db2move\n```\n\n\n\
  \n\n\n```text\nEXPORT:      0 rows from table \"ARCHIVE \".\"ARSLOADWORK\"\nEXPORT:\
  \      0 rows from table \"ROOT    ARSNAMEQ\"\nEXPORT:      1 rows from table \"\
  ROOT    ARSNODE\"\nEXPORT:      0 rows from table \"ROOT    ARSPRT\"\nEXPORT:  \
  \    0 rows from table \"ROOT    ARSPRTOPTS\"\nEXPORT:      0 rows from table \"\
  ROOT    ARSPRTUSR\"\nEXPORT:      0 rows from table \"ROOT    ARSRES\"\nEXPORT:\
  \      0 rows from table \"ROOT    ARSSEG\"\nEXPORT:      1 rows from table \"ROOT\
  \    ARSSET\"\nEXPORT:      1 rows from table \"ROOT    ARSSYS\"\nEXPORT:      1\
  \ rows from table \"ROOT    ARSUSER\"\nEXPORT:      0 rows from table \"ROOT   \
  \ ARSUSRGRP\"\nEXPORT:      0 rows from table \"ROOT    ARSUSRGRPID\"\nEXPORT: \
  \     206 rows from table \"SYSTOOLS\".\"HMON_ATM_INFO\"\nEXPORT:      0 rows from\
  \ table \"SYSTOOLS\".\"HMON_COLLECTION\"\nEXPORT:      5 rows from table \"SYSTOOLS\"\
  .\"POLICY\"\nDisconnecting from database ... successful!\nEnd time:  Thu Mar 28\
  \ 13:11:12 2024\n[archive@ECMUKDEMO22 config]$\n```\n\n4. 现在，我们必须编辑生成的 `db2move.lst`\
  \ 文件，并使用 `vi` 编辑器将架构（schema）名称从 `ROOT` 更改为新的 `ARCHIVE`：\n\n`:1,$s/ROOT   /ARCHIVE/g`\n\
  \n5. 现在，可以使用以下 `db2` 命令删除现有用户表（此步骤用于在同一数据库内重命名架构）：\n\n1. 首先，我们使用 Linux 命令 `db2`\
  \ 启动 `db2 =>` 提示符：\n\n```text\n[archive@ECMUKDEMO22 config]$ db2\n(c) Copyright\
  \ IBM Corporation 1993,2007\nCommand Line Processor for DB2 Client 11.5.0\nYou 可以在提示符上发布数据库管理器命令和\
  \ SQL 语句。例如：\ndb2 => connect to sample\ndb2 => bind sample.bnd\n需常规帮助，请输入： ?\n需命令帮助，请输入：\
  \ ? 其中 command 可以是数据库管理器命令的前几个关键字。例如：\n? CATALOG DATABASE 获取关于 CATALOG 命令的帮助\n?\
  \ CATALOG 获得关于所有 CATALOG 命令的帮助。要退出 db2 交互模式，请输入 QUIT。在交互模式之外，所有命令必须以 'db2' 前缀。要列出当前命令选项设置，请输入\
  \ OPTIONS。需更多详细帮助，请参考在线手册。\n```\n\n2. 现在，我们可以使用命令连接到 CMOD ARCHIVE Db2 数据库：\n\n```text\n\
  db2 => connect to ARCHIVE\nDatabase Connection Information\nDatabase server = DB2/LINUX864\
  \ 1.5.0\nauthorization ID = ARCHIVE\nLocal database alias = ARCHIVE\n```\n\n3. 现在我们可以按照如下方式调用\
  \ Db2 存储存储过程：\n\n```text\ndb2 => CALL SYSPROC.ADMIN_DROP_SCHEMA('ROOT', NULL, 'ERRORSCHEMABLE')\n\
  Value of output parameters\n--------------------------\nParameter Name: ERRORTABSCHEMA\n\
  Parameter Value: -\nParameter Name: ERRORTAB\nParameter Value: -\nReturn Status\
  \ = 0\n```\n\n6. 随后，我们可以使用 `quit` 命令退出 `db2 =>` 提示符：\n\n```text\ndb2 => quit\n```\n\
  \n7. 现在我们可以执行 DDL SQL，使用 `ARCHIVE` 架构重建包含所有表的 CMOD 数据库：\n\n```text\ndb2 -tvf outputfile.sql\n\
  ```\n（这将运行由 `db2look` 命令生成的输出文件，以使用新的 `ARCHIVE` 架构重建表）\n\n8. 接下来，我们必须将导出的数据库行重新导入\
