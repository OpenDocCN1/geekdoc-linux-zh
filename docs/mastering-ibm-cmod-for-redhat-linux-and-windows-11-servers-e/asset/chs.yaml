  ```\n`searchMaxResults=1000`;cmisRepositoryID=*;statusDocCompoundDocument`=false;datetimeOp=;checkinAsMajorVersion=true;customProperties=[];showSecondInSearchView=false;odKeyringDBFile=;maxWorklists=2147483647;teamspaceDeleteTaskEnabled=false;p8DownloadRecord=false;teamspacesEnabled=false;databaseEncodingUTF8=false;directRetrieveEnabled=false;maxDownloadSize=0;conAnonymousUserId=;p8DownloadRecordIgnoreUsersIds=;redactionEnabled=false;idOp=;maxHits=1000;odSSL=false;boxCopyEnabled=false;floatOp=;approvalWorkflowEnabled=true;stringOp=;unifiedSearchesEnabled=false;conGlobalAdminUserIds=;includeWorkflowDefinition=false;version=2.0;objectOp=;conReviewAdminUserIds=;folderDefCols=;`serverName=DESKTOP-B3JB93R`;statusWorkItemSuspended=false;propertiesMapping=;timeoutInSeconds=60;teamspaceDisplayRecent=false;keepInAutoFolder=true;delimiterForOfficeProperty=\\\
