  这表明 `CMOD` 表已全部以 `root` 作为模式名称创建，而调试错误显示，服务期望这些表（例如 `ARSAG`）以 `archive`（数据库实例所有者）作为模式名称进行创建。\n\
  \n在下一节中，我们将演示用于将模式名称从 `root` 更改为 `archive` 的步骤。\n\n## 移除 CMOD Db2 归档数据库\n\n在 Linux\
  \ `CMOD` 系统初始安装期间，我们发现使用 `root` 用户推荐的 `Db2` 安装会导致首次构建的 `ARCHIVE` 数据库模式为 `root`。通过检查日志文件发现，这导致\
  \ `CMOD` 服务失败，因为 `ARCHIVE` 数据库中构建的 `Db2` 表预期的模式应该是 `archive`（数据库实例所有者）。我们遇到了以下错误：\n\
  \n`ARS0013E DB Error: [IBM][CLI Driver][DB2/LINUXX8664] SQL0204N \"ARCHIVE.ARSAG\"\
  \ is an undefined name. SQLSTATE=42704 -- SQLSTATE=42S02, SQLCODE=-204, File=arsag.c,\
  \ Line=4275\", \"\"], 0x2c8544 /* 69 vars */`\n\n该错误通过将初始的 `root` 表模式更改为 `archive`\
  \ 模式得到了修正。\n\n因此，我们决定删除并重建 `ARCHIVE` 数据库以解决此问题，使表能够以 `archive` 模式正确创建，这是通过以下步骤实现的。\n\
  \n我们以 `archive` `DB2` 实例用户登录并输入了以下命令：\n\n```\narchive@ECMUKDEMO22 ~]$ db2 drop database\
  \ ARCHIVE\nDB20000I The DROP DATABASE command completed successfully.\n[archive@ECMUKDEMO22\
  \ /]$ cd arsdb\n[archive@ECMUKDEMO22 arsdb]$ rm -Rf *.*\n```\n更多详情请参阅 [`cmod.wiki/dox/CMODv10.1/AdministrationGuide.pdf`](https://cmod.wiki/dox/CMODv10.1/AdministrationGuide.pdf）（特别是第\
  \ 31 节 ARSDB）。采取了以下步骤发现并纠正了许多错误，最终需要删除数据库并重建，在本节中进行了介绍。\n\n## 手动启动和停止 CMOD 实例\n\n\
  首先，我们尝试如下重启已安装的 Linux `CMOD` `ARCHIVE` 实例。管理文档建议在客户端连接数据库之前必须启动 `CMOD` 实例。注意：`CMOD`\
  \ 系统支持多个实例，每个实例可以在 `ars.ini` 文件中单独定义，通常在 `CMOD` 服务的命令行中使用 `-I` 参数引用。\n\n### 启动实例\n\
  \n1. 以 `root` 用户或实例所有者登录。\n2. 启动实例：\n```\ncd /opt/ondemand/V10.5/bin/\n./arsockd\
  \ archive\n```\n其中 `archive` 是要启动的实例名称。`archive` 是 `ars.ini` 文件中 `SRVR_INSTANCE`\
  \ 参数的值。`arsobjd` 程序控制对象服务器上的 `Content Demand` 实例如果没有运行 `arsobjd` 程序，`Content Demand`\
  \ 程序将失败。注意：`arsobjd` 程序应仅在库服务器以外的对象服务器上启动。在 Linux 上为 `archive` 实例运行 `arsobjd` 程序的命令行如下：\n\
  \n```\n[root@ECMUKDEMO22 bin]# /opt/ondemand/V10.5/bin/arsobjd -I archive -S\n```\n\
  3. 使用 `ps` 命令验证实例已启动：\n```\nps -eaf|grep ars\n```\n\n### 停止实例\n\n1. 以 `root` 用户或实例所有者登录。对象服务器：\n\
  ```\n[root@ECMUKDEMO22 bin]# ps -eaf|grep arsobj\narchive 21822 9162 0 Apr03 pts/2\
  \ 00:00:01 arsobjd: (accepting)\nroot 144247 18122 0 05:50 pts/2 00:00:00 grep --color=auto\
  \ arsobj\n[root@ECMUKDEMO22 bin]#\n[root@ECMUKDEMO22 bin]# /opt/ondemand/V10.5/bin/arsobjd\
  \ -I archive -T\n```\n`ARS0352I The arsobjd instance ARCHIVE is terminating`\n```[root@ECMUKDEMO22\
  \ bin]# ps -eaf|grep arsobj\nroot 144392 18122 0 05:52 pts/2 00:00:00 grep --color=auto\
  \ arsobj\n[root@ECMUKDEMO22 bin]#\n```\n2. 使用 `arssockd` 命令停止初始的 `arsockd` 进程。如果运行了多个\
  \ `arsockd` 进程，请确定初始的 `arsockd` 进程。初始的 `arsockd` 进程状态为 `accepting`：\n\n```\nps -ef\
  \ | grep ars\nroot 6022 28991 0 60 13:43:03 - 0:00 arssockd: db (USERID)\nroot 6018\
  \ 28991 0 60 13:33:03 - 0:00 arssockd: db (idle)\nroot 6014 28991 0 60 13:30:13\
  \ - 0:00 arssockd:\n(accepting)\n```\n3. 然后停止接收进程。例如：\n```\n./arssockd stop 6014\n\
  ```\n初始进程及其所有子进程将被停止。\n\n### 修复 `arsockd` 加载错误\n\n`arsockd` 程序的初始运行失败，报错 `ARS0160E`。\n\
  \n请参见 [`cmod.wiki/index.php?title=ARS0160E`](https://cmod.wiki/index.php?title=ARS0160E)（以及\
  \ [`cmod.wiki/dox/CMODv8.5/Messages_and_Codes.pdf`](https://cmod.wiki/dox/CMODv8.5/Messages_and_Codes.pdf)\
  \ 和 [`cmod.wiki/dox/CMODv9.5/MessagesAndCodes.pdf`](https://cmod.wiki/dox/CMODv9.5/MessagesAndCodes.pdf))\n\
  \n**第一个错误：**\n\n初始尝试加载 `arsockd` 时的错误如下：\n\n```\narssockd (ARCHIVE): 0 ARSOBJD 2\
  \ 160 ARS0160E Unable to load module /opt/ondemand/V10.5/bin/exits/arssmtmsm. The\
  \ return code is 2\narssockd (ARCHIVE) ARSMSG 2 147 ARS0147E Unable to initialize\
  \ the server environment. The return code is 1\n```\n\n1. IBM 文档建议检查 `ars.cfg` 文件，如果您的服务器**没有**使用辅助存储，请如下所示更改\
  \ `ARS_STORAGE_MANAGER` 参数：\n```\nARS_STORAGE_MANAGER=CACHE_ONLY\n```\n2. 同时，检查是否已以\
  \ `archive` `DB2` 实例运行了以下 `Db2 Linux` 命令：\n\n```\n[archive@ECMUKDEMO22 ~]$ db2 start\
  \ database manager\n```\n\n\n\n\n\n`SQL1026N  数据库管理器已激活。`\n\n```\n[archive@ECMUKDEMO22\
  \ ~]$ db2 activate database archive\n```\n`DB20000I  ACTIVATE DATABASE 命令成功完成。`\n\
  \n## 第二个错误（重启后）\n\nLinux 服务器已重启，现在我们遇到了另一个错误：\n\n```\narsockd (ARCHIVE) ARSMSG 2\
  \ 154 ARS0154E Unable to establish server communications with network. `The return\
  \ code is 2`\n```\n\n**注意**：`ars.cfg` 配置中的 `ARSSOCK= debug` 参数可以帮助您排查 TCP/IP 错误。\n\
  \n确保 TCP/IP 正在运行，然后再次尝试该命令。\n\n可以使用 Linux 命令检查开放的端口和服务和服务：\n\n```\nfirewall-cmd\
  \ --list-all\n```\n\n## 更新归档实例 ARCHIVE 数据库\n\n使用以下 `Linux` 命令更新了 `archive` 实例：\n\
  \n（在 [附录 C，配置文件和设置列表]中列出了 `ars.cfg`、`ars.ini` 和 `ars.dbfs` 文件内容的完整列表）。\n\n1. 我们需要使用以下命令切换到\
  \ `CMOD` 配置目录：\n\n```\n[archive@ECMUKDEMO22 ~]$ cd /opt/ibm/ondemand/V10.5/config\n\
  ```\n\n2. 随后，我们可以列出所有可配置的文件：\n\n```\n[archive@ECMUKDEMO22 config]$ ls\n```\n```\n\
  ars.az.smp  ars.fs.smp     ars.ini       ars.s3.smp     trace.settings\nars.cache\
