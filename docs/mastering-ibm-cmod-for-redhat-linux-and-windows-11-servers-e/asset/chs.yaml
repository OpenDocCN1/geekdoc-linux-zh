  \n每个实例的安全性与同一服务器上的其他实例都不同。你必须为每个实例定义单独的用户和组，并为每个实例的用户设置 `CMOD` 应用程序组和文件夹权限。每个实例都有自己的系统日志。\n\
  \n`ars.ini` 文件必须为每个创建的实例包含一个扇区（section）。每个扇区标识了该实例所使用的 `ars.cfg` 文件、`ars.dbfs` 文件和\
  \ `ars.cache` 文件。\n\n每个实例必须有一个唯一的 `ars.cfg` 文件副本。\n\nIBM 建议你为每个实例维护独立的表空间文件系统和缓存存储文件系统，如每个实例对应一个\
  \ `ars.dbfs` 文件和一个 `ars.cache` 文件。\n\n每个实例必须运行在它自己唯一的 TCP/IP 端口号上。每个实例的端口在 `ars.ini`\
  \ 文件中配置。\n\n### ars.ini 文件中的实例\n\n`ars.ini` 文件包含有关 `CMOD` 实例的信息。\n\n当安装 `CMOD` 软件时，`ars.ini`\
  \ 文件包含名为 `archive` 的默认实例的信息，在我们的 `Linux` 系统上的设置如下：\n\n在 `/opt/ibm/ondemand/V10.5/config/ars.ini`\
  \ 中：\n\n```\n[@SRV@_ARCHIVE]\nHOST=ECMUKDEMO22\nPROTOCOL=2\nPORT=1445\nSRVR_INSTANCE=ARCHIVE\n\
  SRVR_INSTANCE_OWNER=archive\nSRVR_OD_CFG=/opt/ibm/ondemand/V10.5/config/ars.cfg\n\
  SRVR_DB_CFG=/opt/ibm/ondemand/V10.5/config/ars.dbfs\nSRVR_SM_CFG=/opt/ibm/ondemand/V10.5/config/ars.cache\n\
  SRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n[@SRV@_DD]\nPROTOCOL=1\n\
  ```\n\n你必须在 `Linux` 上使用防火墙命令打开 1445 端口：\n\n```\nfirewall-cmd --zone=public --permanent\
  \ --add-port=1445/tcp\nfirewall-cmd --reload\n```\n\n我们将在 *第 8 章 Linux 上的 CMOD 系统用户管理](#c08.xhtml)*\
  \ 中更详细地介绍 `arrsstash`程序的运行。该命令的运行如下，用于加密 `archive` 实例用户的密码，如*图 2.131](#c02.xhtml_fig2_131)*\
  \ 所示：\n\n```\ncd /opt/ibm/ondemand/V10.5/bin\n./arsstash -a 1 -c -s /opt/ibm/ondemand/V10.5/config/ars.stash\
  \ -u archive\n```\n\n![](img/Figure2.131.jpg)\n\n**图 2.131：** 运行命令以加密 `archive`\
  \ 实例用户的密码\n\n编辑 `/root/.bash_profile` 文件以添加环境变量 `SRVR_OD_STASH` 变量：\n\n```\nSRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n\
  export SRVR_OD_STASH\n```\n\n如*图 2.132](#c02.xhtml_fig2_132)* 所示：\n\n![](img/Figure2.132.jpg)\n\
  \n**图 2.132：** 编辑 `/root/.bash_profile` 文件以添加环境变量 `SRVR_OD_STASH` 变量\n\n编辑 `ars.ini`\
  \ 文件为 `[@SRV@_ARCHIVE]` 实例添加参数，如*图 2.133](#c02.xhtml_fig2_133)* 所示，列表如下：\n\n```\n\
  [@SRV@_ARCHIVE]\nHOST=ECMUKDEMO22\nPROTOCOL=2\nPORT=1445\nSRVR_INSTANCE=ARCHIVE\n\
  SRVR_INSTANCE_OWNER=archive\nSRVR_OD_CFG=/opt/ibm/ondemand/V10.5/config/ars.cfg\n\
  SRVR_DB_CFG=/opt/ibm/ondemand/V10.5/config/ars.dbfs\nSRVR_SM_CFG=/opt/ibm/ondemand/V10.5/config/ars.cache\n\
  SRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n[@SRV@_DD]\nPROTOCOL=1\n\
  ```\n\n（注：此处原文似乎存在混乱，翻译已意译为：编辑 `ars.ini` 文件以为 `[@SRV@_ARCHIVE]` 实例添加参数）\n\n[`www.ibm.com/docs/en/cmofm/10.5.0?topic=servers-configuring-instances-linux`](https://www.ibm.com/docs/en/cmofm/10.5.0?topic=servers-configuring-instances-linux)\n\
  \n### `ars.ini` 文件中的实例\n\n`ars.ini` 文件包含有关 `CMOD` 实例的信息。\n\n当安装 `CMOD` 软件时，`ars.ini`\
  \ 文件包含名为 `archive` 的默认实例的信息，在我们的 `Linux` 系统上的设置如下：\n\n在 `/opt/ibm/ondemand/V10.5/config/ars.ini`\
  \ 中：\n\n```\n[@SRV@_ARCHIVE]\nHOST=ECMUKDEMO22\nPROTOCOL=2\nPORT=1445\nSRVR_INSTANCE=ARCHIVE\n\
  SRVR_INSTANCE_OWNER=archive\nSRVR_OD_CFG=/opt/ibm/ondemand/V10.5/config/ars.cfg\n\
  SRVR_DB_CFG=/opt/ibm/ondemand/V10.5/config/ars.dbfs\nSRVR_SM_CFG=/opt/ibm/ondemand/V10.5/config/ars.cache\n\
  SRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n[@SRV@_DD]\nPROTOCOL=1\n\
  ```\n\n你必须在 `Linux` 上使用防火墙命令打开 1445 端口：\n\n```\nfirewall-cmd --zone=public --permanent\
  \ --add-port=1445/tcp\nfirewall-cmd --reload\n```\n\n我们将在 *第 8 章 Linux 上的 CMOD 系统用户管理](#c08.xhtml)*\
