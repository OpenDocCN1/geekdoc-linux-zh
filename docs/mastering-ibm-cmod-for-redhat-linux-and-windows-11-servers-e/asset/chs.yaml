  \n## 关键术语\n\n* `API`: 应用程序编程接口是一个可调用的软件子程序库，用于支持两个或多个独立功能软件系统之间的通信。\n* `SQL: 结构化查询语言`是一组具有标准语法的命令，用于在关系数据库中`创建`、`更新`、`查询`或`删除``行`、`表`、`索引`、`视图`、`存储过程`和`函数`。\n\
  * `URL: 统一资源定位符`是对互联网资源的地址引用。\n\n# 第 7 章\n\n# Windows  CMOD 管理\n\n## 介绍\n\n本章介绍了\
