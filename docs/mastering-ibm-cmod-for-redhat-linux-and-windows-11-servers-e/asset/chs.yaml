  ```\n\n## 多选题\n\n1. `ars.ini` 文件中的哪个参数用于识别归档实例（该值被设置为 ARCHIVE，注意在 Linux 服务器上需要区分大小写）？\n\
  \n    1. `SRVR_INSTANCE_OWNER`\n    2. `SRVR_INSTANCE`\n    3. `SRVR_OD_CFG`\n \
  \   4. `SRVR_SM_CFG`\n\n2. 如果你从 `CMOD` 配置目录开始启动，使用哪个命令启动 CMOD ARCHIVE 数据库实例？\n\n\
  \    1. `../bin/arsdb -u -I ARCHIVE`\n    2. `./bin/arsdb -gkv`\n    3. `../bin/arsdb\
  \ -gkv`\n    4. `./arsdb -I archive -u`\n\n3. 运行哪个 `CMOD` 附加功能程序来从 PDF 文件提取详细信息？\n\
  \n    1. `./odpdflinux.bin`\n    2. `./odftslinux.bin`\n    3. `./arspdump`\n  \
  \  4. `./arsodf`\n\n4. 使用哪个 `Db2` 程序来创建包含表结构 `DDL` 的 `outputfile.sql` SQL 文件？\n\n\
  \    1. `db2look`\n    2. `db2move`\n    3. `db2`\n    4. `db2start`\n\n## 答案\n\n\
  1. b\n2. c\n3. c\n4. a\n\n# question\n\n1. 如果遇到错误：`ARS0013E DB Error: [IBM][CLI\
  \ Driver][DB2/LINUXX8664] SQL0204N \"ARCHIVE.ARSAG\" is an undefined name?` 你遵循什么步骤？\n\
  \n2. 在错误信息 `\"OnDemand (2378) -> bind errno = 98 rc = -1\"` 中，2378 可能指的是什么？你如何修正此错误？\n\
  \n3. `CMOD` 程序使用哪些 TCP/IP 网络端口？可以使用哪些 Linux 命令来识别并打开它们以供使用？\n\n## 关键术语\n\n* **DDL**:\
  \ 数据定义语言（Data Definition Language）是 `SQL` 的子集，用于描述数据库中的数据及其关系，包括表结构。我们使用 `db2look`\
  \ 命令为 `Db2` 数据库对象生成脚本中的 `DDL`。\n```bash\ndb2look -d ARCHIVE -e -o outputfile.sql\n\
  ```\n* **SQL**: 结构化查询语言（Structured Query Language）是一种用于在数据库结构（如表和索引）中创建、删除、查询、插入行和更新行的语言。\n\
  * **PDF**: 便携式格式（Portable Document Format），由 Adobe 创建，提供标准的布局。\n* **TCP/IP**: 传输控制协议/网际协议是用于互连网络设备的通信协议。\n\
  * **CMOD**: IBM Content Manager OnDemand\n\n# 第 4 章：安装升级后的 Linux GSKit 和库\n\n##\
  \ 介绍\n\n需要安装 IBM Fix Pack 升级包的 `rpm` 文件和一些额外的 `Linux` 操作系统库包，以支持 `CMOD` 版本 `10.5.0.7`\
  \ 的 `GSKit`。本章描述了 `rpm` 文件和额外 `GSKit` 库的安装，以及调试主 `arssockd` 程序加载和运行的过程。\n\nIBM Global\
  \ Security Kit 的 GSKit 包是 IBM Content Manager OnDemand 所用加密服务所需的。\n\n有一个链接 [`cmod.wiki/index.php?title=IBM_Content_Manager_OnDemand_v10.5.0.7_and_GSKit_support_for_Post-Quantum_Cryptography&mobileaction=toggle_view_desktop`](https://cmod.wiki/index.php?title=IBM_Content_Manager_OnDemand_v10.5.0.7_and_GSKit_support_for_Post-Quantum_Cryptography&mobileaction=toggle_view_desktop)，它描述了\
  \ GSKit 对 `CMOD` 所用加密的支持。\n\n建议对升级后的 `CMOD` 系统使用以下内容：\n\n在创建密钥数据库时，必须使用 `'-pqc false'`\
  \ 选项在使用旧方法。\n\n必须通过在 GSKit `-keydb -create` 命令中添加 `-pqc false` 来生成不包含后量子加密方法的密钥数据库：\n\
  ```bash\ngsk8capicmd_64 -keydb -create -db ars-ssl.kdb -genpw -stash -pqc false\n\
  ```\n\n# 结构结构\n\n在本章中，我们将讨论以下主题：\n\n* 使用 `Linux rpm` 命令行工具安装\n* 使用 `Linux yum` 命令行工具安装\n\
  * 创建 `CMOD` 缓存数据区\n* 运行 `arsstash` 加密程序\n* `Linux` – 当 `arssockd` 启动失败且无消息时如何调试\n\
  * 在 `Linux` 上配置 `LIBPATH`、`LD_LIBRARY_PATH` 和 `PATH`\n\n## 使用 Linux rpm 命令行安装\n\n\
  安装必须以 `root` 用户身份执行。除非在后续专门调用，否则不应使用 `-nodeps` 标志：我们必须使用 `rpm` 命令进行安装，如下：安装在默认位置：`/usr/local`\n\
  ```bash\ncd /opt/CMOD/linux\nrpm -Uv gskcrypt64-8.0.55.12.linux.x86_64\nrpm -Uv\
  \ gskssl64-8.0.55.12.linux.x86_64\n```\n\n## 使用 Linux yum 工具安装\n\n支持 `CMOD` 版本 `10.5`\
  \ 需要以下 `Linux` 库：\n```bash\n[root@ECMUKDEMO22]# yum install -y libaio\n```\n`Linux`\
  \ C++ 库 `libstdc++-devel-8.5.0-20.el8`如图 4.1 所示，使用以下命令安装：\n```bash\n[root@ECMUKDEMO22]#\
  \ yum install -y libstdc++-devel\n```\n注意：虽然 `rpm`（红帽软件包管理器）是底层软件包格式和管理工具，供 IBM\
  \ 使用，但 `yum` 和在 `RHEL 8` 中引入的新版 `dnf` 命令是高级安装工具，简化了软件包的安装和更新过程。\n\n`Python` 文件库如图\
  \ 4.2 所示：\n```bash\n[root@ECMUKDEMO22]# yum install -y file\n```\n`Linux` 库 `ncurses-libs-6.1-20180224.el8`\
  \ 如图 4.3 所示，使用命令安装：\n```bash\n[root@ECMUKDEMO22]# yum install -y ncurses-libs\n\
  ```\n接下来，安装 `numactl-libs`，它为应用程序执行非均匀内存访问（NUMA）策略分配提供了库，使用命令：\n```bash\n[root@ECMUKDEMO22]#\
  \ yum install -y numactl-libs\n```\n（参见 [`en.wikipedia.org/wiki/Non-uniform_memory_access`](https://en.wikipedia.org/wiki/Non-uniform_memory_access)）\n\
  \n`Linux Open SSL` 安全库如图 4.4 所示，使用命令安装：\n```bash\n[root@ECMUKDEMO22]# yum install\
  \ -y openssl\n```\n\n## 创建 CMOD 缓存数据区\n\n缓存数据目录用于存储 `CMOD` 捕取的文档，并需要使用以下 Linux 命令设置所有权安全性：\n\
  ```bash\n[root@ECMUKDEMO22]# mkdir /data\n[root@ECMUKDEMO22]# mkdir /data/arscache\n\
  [root@ECMUKDEMO22]# chmod 700 /data/arscache\n[root@ECMUKDEMO22]# chown -R archive:db2iadm1\
  \ /data*\n```\n\n\n\n\n`CMOD` 系统中 `ADMIN` 用户使用的密码应进行加密以提高系统安全性；否则，我们需要使用明文密码来运行许多\
  \ `CMOD` 管理程序。我们使用以下 `Linux` 命令运行 `arsstash` 程序，如 *图 4.5* 所示：\n\n```bash\ncd /opt/ibm/ondemand/V10.5/bin\n\
  ./arsstash -a 1 -c -s /opt/ibm/ondemand/V10.5/config/ars.stash -u archive\n```\n\
  \n![](img/Figure4.5.jpg)\n\n**图 4.5：** `CMOD` 系统上的 `ADMIN` 用户密码使用 `arsstash` 程序进行加密\n\
  \n还设置了以下环境变量以指向带有加密密码的 `ars.stash` 文件，如 *图 4.6* 所示：\n\n```bash\nSRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n\
  export SRVR_OD_STASH\n```\n\n![](img/Figure4.6.jpg)\n\n**图 4.6：** 使用 `vi` 在 `root`\
  \ 用户的文件 `/root/.bash_profile` 中设置了 `SRVR_OD_STASH` 环境变量\n\n接下来，使用 `vi` 编辑器编辑 `ars.ini`\
  \ 文件以添加参数，如 *图 4.7* 所示：\n\n```bash\nSRVR_OD_STASH=/opt/ibm/ondemand/V10.5/config/ars.stash\n\
  ```\n\n![](img/Figure4.7.jpg)\n\n**图 4.7：** 使用 `vi` 编辑器编辑 `ars.ini` 文件以添加 `SRVR_OD_STASH`\
  \ 参数\n\n我们还对 `Linux GSKit` 根目录及其所有子目录和文件递归设置了权限如下：\n\n```bash\nchmod -R 775 /opt/ibm/ondemand/V10.5/www\n\
  ```\n\n## Linux – 使用跟踪日志文件输出调试 `ARSSOCKD` 的方法\n\n1. 当 `arssockd` 在写入系统日志之前结束，或者控制台没有显示任何用的错误信息时，我们首先需要确保\
  \ `Db2` 正在运行。\n\n2. 如果这不能解决问题，可以使用类似下面的命令捕 `Linux` 系统跟踪信息：\n\n```bash\ncd /root\n\
  strace -s 256 -f /opt/ibm/ondemand/V10.5/bin/arssockd -I archive -S 2>strace.out\n\
  cat strace.out\n```\n\n我们可以随后检查 `strace.out` 文件并搜索 `“arslog.”`。通常，`arslog` 后面会带有错误的\
  \ `CMOD` 消息。\n\n以下是近期问题记录中的示例：\n\n```text\nLine 1125: [pid  7842] execve(\"/opt/ibm/ondemand/V10.5/bin/arslog\"\
  , [\"/opt/ibm/ondemand/V10.5/bin/arslog\", \"ARCHIVE\", \"2024-03-26 11:21:08.947825\"\
  , \"0\", \"ARSSOCKD\", \"\", \"4\", \"213\", \"ARS0213I Unable to load the OnDemand\
  \ DB2 dynamic load library (arsdb2).  Check to make sure DB2 is installed and that\
  \ the db2ln command has been run\"], \"\"], 0x1bdb640 /* 95 vars */ <unfinished...>\n\
  Line 1317: openat(AT_FDCWD, \"/opt/ibm/ondemand/V10.5/bin/arslog\", O_RDONLY) =\
  \ 4\nLine 1332: read(11, \"#!/bin/ksh\\n#\\n# arslog - OnDemand User Exit Logging\
  \ Facility\\n#\\n#  5622-662 (C) COPYRIGHT IBM CORPORATION 1995\\n#  All Rights\
  \ Reserved\\n#  Licensed Materials - Property of IBM\\n#\\n#  US Government Users\
  \ Restricted Rights - Use, duplication or\\n#  disclosure\"..., 65536) = 707\n```\n\
  \n**注意：** `ARS0213I` 消息识别了与用于 DB2 共享对象的库相关的问题：\n\n`ARS0213I Unable to load the OnDemand\
  \ DB2 dynamic load library (arsdb2).`\n\nIBM 建议您检查并确保已安装 `Db2` 并运行了 `db2ln` 命令。\n\
  \n3. 当 `Db2` `db2ln` 命令未能解决问题时，可以使用 `ldd` 命令检查是否存在与 `arssockd` 相关的其他文件依赖。使用启动 `arssockd`\
  \ 程序的用户 ID 运行：\n\n```bash\nldd /opt/ibm/ondemand/V10.5/bin/arssockd\nroot@ECMUKDEMO22\
