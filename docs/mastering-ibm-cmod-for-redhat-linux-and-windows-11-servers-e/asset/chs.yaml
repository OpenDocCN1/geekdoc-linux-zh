  \ IDE` 项目支持库和结构\n\n## 结论\n\n在本章中，我们列出了几个示例 Java 程序，并对其进行了更新以适用于版本为 `10.5.0.7` 的\
  \ `IBM CMOD OnDemand API`。我们还演示了如何在 `Linux` 服务器的 `Eclipse IDE` 环境中运行这些程序。\n\n我们构建并运行的\
  \ Java 示例程序包括：`ODPing`，用于检查从 `Linux` `CMOD API` 到 `Windows CMOD` 对象服务器系统的连接是否正常，并返回\
  \ Windows `CMOD` 文件夹列表；Java `CallbackSearchExample` 程序连接到 `Windows CMOD` 服务器的 `System\
  \ Log` 文件夹；以及 `TcLoadDocs` 程序，我们使用该程序演示了如何加载示例 `AFP` 文档及其字段属性，加载时使用了示例 `Baxter Bay\
  \ Credit Applications Group` 和 `Application`。\n\n在下一章 *将 CMOD 连接到 IBM Content Navigator*\
  \ 中，我们将概述为 `Linux` 服务器版本的 `IBM Content Navigator` 创建存储库所需的步骤，并演示从我们创建用于访问 `Windows\
  \ CMOD` 服务器文档库的 `Content Navigator` 桌面访问 `Windows CMOD` 服务器上的 `Folders`。\n\n## 注意事项\n\
  \n- 我们对更新后的 `IBM CMOD` 程序的使用基于 IBM 版权声明，该声明指出示例应用程序程序以源代码形式编写，用于说明在各种操作系统上的编程技术，可以以任何形式复制、修改和分发，而无需向\
  \ IBM 支付费用。\n- Java 代码已修改以适用于 `Linux` 环境下的 `IBM CMOD V10.5.0.7`，并使用 `ODWEK API`\
  \ 连接到运行在 `Windows` 服务器上的 `IBM CMOD V10.5.0.7` 系统。\n- 需要额外的 Java 项目 `Run` 环境变量和 `Dependency`\
  \ 库路径设置，以允许 Java 程序在没有[配置]的情况下运行。\n\n## 多选题\n\n1. 使用 Java 程序时，哪个用户可以成功连接到 `IBM CMOD\
  \ Windows` 服务器？\n   - archive\n   - ADMIN\n   - root\n   - padmin\n2. 哪个 Java 库为我们的示例程序提供了\
  \ `ODWEK API` 核心？\n   - `log4j-core-20.0.jar`\n   - `gson-10.1.jar`\n   - `ODApi.jar`\n\
  \   - `log4j-api-20.0.jar`\n\n## 答案\n\n1. b\n2. c\n\n## 问题\n\n1. 将文档添加到 `Baxter\
  \ Bay Credit Application` 需要哪些 `Index Fields`（索引字段）？\n2. 您使用哪个 `IBM CMOD` `Folder`\
  \ 来通过 `TcLoadDocs` 程序检查文件是否加载成功？\n\n# 核心术语\n\n- **API**: 应用程序接口（Application Interface）是一个可调用的软件子程序库，用于支持两个或多个功能系统之间的通信。\n\
  - **IDE**: 交互式开发环境（Interactive Development Environment）是对开发者工具的通用描述，提供项目创建、软件编辑、构建、测试以及\
  \ Java 文件打包的功能。\n- **JRE**: Java 运行时环境（Java Runtime Environment）是与操作系统集成的软件层，提供\
  \ Java 程序运行所需的 Java 类和其他资源（如 `java.util` 和 `java.text` 包）。\n- **ODWEK**: OnDemand\
  \ Enablement Kit 是一种 API，在 Java 中通过 `ODApi` 调用，并存在于 `LD_LIBRARY_PATH` 环境变量路径 `/opt/ibm/ondemand/V10.5/www/`\
  \ 中，它用于更改用户密码、检索文档或删除注释，也可用于加载新文档。\n- **AFP**: 高功能图形呈现（Advanced Function Presentation）是一组许可程序，它们使用点寻址概念在打印机上打印文本和图形。\n\
