  ```\n\n要构建 **AFP2PDF** 插件，可以参考以下 **GitHub** 链接中的文档：\n\n[`github.com/ibm-ecm/ibm-content-navigator-samples`](https://github.com/ibm-ecm/ibm-content-navigator-samples)\n\
