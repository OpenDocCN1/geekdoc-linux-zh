  \ 12.4 所示：\n\n```\n./arssyscr -l -I archive2\n```\n\n![](img/Figure12.4.jpg)\n\n\
  **图 12.4:** 在我们的 ***Linux IBM CMOD*** 服务器上用于为 ***archive2*** 创建 ***系统日志***功能的命令。\n\
  \n# 初始化系统迁移设施 对于对于计划从数据库迁移应用程序组索引数据到存储的 **IBM CMOD** 用户，系统迁移 `-m` 开关是必要的。\n\n在创建\
  \ **IBM Content OnDemand** 实例后，我们可以运行 `arssyscr` 程序来初始化实例的 **IBM Content OnDemand**\
  \ 迁移设施。\n\n我们以 **root** 用户登录服务器并为 **archive** 实例输入命令，如图 12.5 所示：\n\n```\nsu – archive\n\
