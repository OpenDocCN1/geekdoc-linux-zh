  \ 上安装 CMOD 的“配置 FileNet P8 固定内容设备”部分详细说明。\n\n## 结论\n\n在本章中，我们涵盖了 `IBM Content Manager\
  \ OnDemand` 版本 10.5 以及 Fix Pack 10.5 在 Windows 服务器和某些连接 Linux 服务器上的逐步下载、安装和配置。\n\
  \n在第 6 章 在 Linux 上重启 CMOD 系统 中，我们将涵盖升级和配置后重启 Linux 服务器。这包含了支持系统的重启：`IBM Security\
  \ Services`、`LDAP` 目录服务器、`IBM FileNet P8 Content Engine`（用于固定内容 CFS-CMOD）以及 `IBM\
  \ Content Navigator`（用于 CMOD 客户端和仓库配置）。\n\n## 注意事项\n\n* 在 RedHat Linux 系统上，记住以下参数必须与操作系统的用户名匹配以避免失败：\n\
  \  在 `ars.ini` 中：\n  `SRVR_INSTANCE_OWNER=archive`\n  在 `ars.cfg` 中：\n  `DB2INSTANCE=archive`\n\
  * 在 Windows 上安装 `CMOD` 需要以下基本磁盘空间：`C:\\` 至少 `2GB` 空闲空间。\n* 在 Windows 系统上安装 `CMOD`\
  \ 时，用于 `Crypt` 和 `SSL` 组件的 `GSKit Version 8` 会自动安装。\n\n## 多选题\n\n1. 以下哪个安装文件包含用于\
  \ Windows 11 服务器 `IBM Content Manager OnDemand` 安装的 `setup.exe`？\n   1. `IBM_CMOD_V10.5_WIN_ML.zip`\n\
  \   2. `odwin64.zip`\n   3. `odwin32.zip`\n   4. `IBM_CONTENT_MANAGER_ONDEMAND_DIST.tar`\n\
  \n2. 12 个月内频繁访问 121 次或以上的 `IBM CMOD 10.5` 需要以下哪个许可协议？\n   1. 价值单元 (`PVU`)\n   2.\
  \ 合格参与者（合格参与者 `RVU`）\n   3. 授权用户 (`UVU`)\n   4. 非生产处理器价值单元 (`Non-Prod PVU`)\n\n\
  ## 答案\n\n1. b\n2. c\n\n## 问题\n\n1. 你会遵循哪些安全考虑和程序以确保 Windows 11 服务器上的 IBM Content\
  \ Manager OnDemand 服务器正常运行？\n2. 你会遵循哪些安全考虑和程序以确保 Linux 服务器上的 IBM Content Manager\
  \ OnDemand 服务器正常运行？\n\n## 关键术语\n\n* **UVU**：IBM 授权用户许可，适用于 12 个月内频繁访问 121 次或以上的\
  \ `IBM CMOD 10.5`。\n* **PVU**：IBM 价值单元，生产许可。\n* **RVU**：IBM 合格参与者许可。\n* **Non-Prod\
  \ PVU**：IBM 非生产处理器价值单元许可。\n* **TCP**：传输控制协议网络通信使用 `1024` 到 `49151` 范围内注册的端口。\n \
  \ `49152` 到 `65535` 的端口可以根据需要由应用程序动态使用。在 **Linux** 系统上，这些端口定义在 `/etc/services` 文件。\n\
  \n\n\n\n\n# 在 Linux 上重启 CMOD 系统\n\n## 引言\n本章涵盖了在升级和配置后重启 Linux 系统服务器的内容，包括支持的应用程序系统：`IBM\
  \ Directory Services`、`LDAP` 服务器；`IBM Db2` 数据库服务器；用于 `IBM FileNet P8 Content Engine`\
  \ 和 `IBM Content Navigator` 桌面客户端的 `IBM WebSphere` 应用程序服务器。\n\n`root` 用户重启服务器的 Linux\
  \ 命令如下：\n\n```bash\nshutdown -r now\n```\n\n## 结构\n在本章中，我们将讨论以下主题：\n\n*   启动 `IBM\
  \ Security Directory Services` 服务器\n*   启动 `Db2` 数据库服务器\n*   启动 `IBM FileNet P8\
  \ Content Engine` 和 `IBM FileNet Content Navigator` 的 `IBM WebSphere` 配置文件\n*  \
  \ 启动 `Linux CMOD` 对象服务器 `arsobjd` 程序\n*   在 `Db2` 上重置过期或丢失的 `CMOD ADMIN` 用户密码\n\n\
