  \n# 第 11 节\n\n# 在 Linux 服务器上启动 arssockd\n\n## 介绍\n\n本章描述了在 `Linux` 服务器上成功运行 `arssockd`\
  \ 程序时需要检查的网络要求，以及运行和调试该程序的命令参数。我们还涵盖了支持 `IPv6` 的网络配置，以及更改 `Linux` 内核参数以提高 IBM Content\
  \ OnDemand 加载服务的性能。最后，我们介绍了 IBM OnDemand 全检服务的使用（该服务利用开源 Lucene 系统），以及 `arsdb` 数据库配置和维护的详细用法。我们还涵盖了使用第二个\
  \ `Db2` 实例 `archive2` 创建第二个 IBM CMOD 实例 `ARCHIVE` 的步骤。\n\n## 结构\n\n在本章中，我们将讨论以下内容：\n\
  * 启动 `arssockd` 程序\n* 在 RedHat Linux 上启用 `IPv6`\n* 检查 `IPv6` 是否已启用\n* 检查 Linux 服务器上的端口限制\n\
  * 启动 IBM OnDemand 全文服务器\n* 运行 `arsdb` 程序并进行切换\n* 使用 `arsdb` 创建第二个 IBM CMOD 实例\n\n\
  ## 启动 arssockd 程序\n\n`arssockd` 程序是在库服务器上运行 IBM Content OnDemand 实例的核心程序。所有支持的 IBM\
  \ CMOD 程序（例如 `arsload` 数据加载程序以及 `arsadmin` 和 `arsaint` 维护程序）在 `arssockd` 程序未在库服务器上运行时将无法运行；连接将无法连接到\
  \ IBM CMOD 实例。以下命令将 IBM OnDemand 系统的安装所有权归 own `archive` 用户，组为 `db2iadm1`：\n\n```\n\
  [root@ECMUKDEMO22 ibm] cd /opt/ibm\n[root@ECMUKDEMO22 ibm] pwd\n/opt/ibm\n[root@ECMUKDEMO22\
  \ ibm] ls\ndb2 odfts ondemand\n[root@ECMUKDEMO22 ibm] chown archive:db2iadm1 -R\
  \ odfts\n[root@ECMUKDEMO22 ibm] chown archive:db2iadm1 -R ondemand/\n[root@ECMUKDEMO22\
  \ ibm] ls -la\ntotal 4\ndrwxr-xr-x 2 root root 46 May 15 06:03 .\ndrwxrwxrwx 29\
  \ root wasadm 4096 May 15 05:36 ..\ndrwxr-xr-x 4 root root 35 Mar 23 10:31 db2\n\
  drwxr-xr-x 3 archive db2iadm1 19 May 15 06:04 odfts\ndrwxr-xr-x 3 archive db2iadm1\
  \ 19 Mar 19 11:25 ondemand\n```\n\n以下命令启动 `arssockd` 对象服务器并在端口 `1445` 上开启监听器，如图图\
