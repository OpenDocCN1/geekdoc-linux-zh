  \ Bay Credit Application Group` 已从列表中移除\n\n## 结论\n\n在本章中，我们描述了使用 **ARSXML** 程序导出和导入\
  \ **CMOD** **Application Groups**，以及使用 **Windows OnDemand Administrator** 程序添加新\
  \ **Folder**（文件夹）和 **Application Group** 对象的步骤。\n\n\n\n\n\n我们还涵盖了 `Windows` `OnDemand\
  \ Configurator` 程序 `V10.5`、`Windows OnDemand Client configuration` 程序，以及安装 `CMOD\
  \ Fix Pack 10.5.0.7` 后的系统配置。\n\n在 *第 8 章，Linux 上的 `CMOD` 系统用户管理* 中，我们将介绍介绍对象类型模型（Object\
  \ Type model）和对象所有者模型（Object Owner model），以实现去中心化的系统管理用户划分，并在 `Linux Db2` 服务器上重置过期或丢失的\
  \ `CMOD` `admin` 用户密码。此外，我们还描述了使用 `arsstash` 程序来存储用户加密密码的方法。\n\n## 注意事项\n\n*   在初始配置期间，为密码至少输入\
  \ 9 个字符是非常重要的，因为此时不会对密码进行验证，且加密后的密码存储在数据库表中。输入少于九个字符的密码将锁定管理员（Administrator）用户。\n\
  *   某些定义错误的 `Application Group` 字段可能无法修改为其他类型，因此有时唯一的解决方案是删除 `Application Group`\
  \ 并重新构建。因此，在将它们导出并导入到生产 `CMOD` 服务器之前，在开发环境中仔细设计、确认并验证字段类型和 `Application Group` 结构至关重要。\n\
  *   如果你为字段的 `Defaults` 文本框输入选择了一个值，则关联的 `Default` 复选框**必须**也设置，否则会弹出错误消息。\n*   要将某个字段作为\
  \ `Index` 的部分，我们还必须使用 `Field Information` 标签页并勾选字段的 `Unique ID` 框，以避免验证错误。\n\n##\
