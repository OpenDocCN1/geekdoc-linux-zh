  \ 的更多信息，请访问 [www.orangeava.com](http://www.orangeava.com)。\n\n# 第 1 章：IBM Content\
  \ Manager OnDemand 简介\n\n## 引言\n\n本书提供了关于 `IBM Content Manager OnDemand` (`CMOD`)\
  \ 版本 `10.5.0.7` 安装和配置的从零逐步指南。\n\n配置内容涵盖了 `IBM Content Manager OnDemand` 与 `IBM Content\
  \ Navigator` 以及 `IBM FileNet Content Engine` 的集成。`CMOD` 是全球市场上领先的数据归档和检索系统。\n\n\
  书中还提供了使用 `ODApi.jar` 的 Java `API` 工作示例，并涵盖了用于 Web 开发的 `OnDemand Web Enablement Kit`\
  \ (`ODWEK`) 安装。\n\n此外，书中还描述了 Windows 客户端 `CMOD` 的安装，以及如何使用 `IBM Download Director`\
  \ 软件从 IBM 的 Software Catalog 和 `Fix Central` 网站搜索并下载基础（Base）和修复包（Fix Pack）的过程。\n\
  \nIBM 详细描述了 `CMOD` 的用途，可以通过此链接访问：\n\n[https://www.ibm.com/support/pages/system/files/support/swg/swgdocs.nsf/0/eeee7450f3eb8e6385257b6e0047cef4/$FILE/IBM%20Content%20Manager%20OnDemand%20Best%20Practices_033015v2.pdf]\n\
  \n是对 `IBM Content Manager OnDemand` (`CMOD`) 系统的介绍：\n\n“`IBM® Content Manager OnDemand\
  \ (CMOD) 是全球市场上领先的数据归档和检索系统。`CMOD` 安装在全球范围内数千万个客户所在地，每天为数百万用户提供服务。`CMOD` 产品具有极强的扩展性和灵活性，允许客户创建最能满足其要求的定制解决方案。`CMOD`\
  \ 为数据的加载、检索和过期提供了极高的性能`”\n\n在本章中，我们将介绍 `IBM Content Manager OnDemand` 软件的用途和支持的平台，并描述提供的可用功能。本章概述了\
  \ `CMOD` 与 `IBM FileNet Content Engine` 以及 `IBM Content Navigator` 集成的前提条件。\n\n\
  ## Structure\n\n在本章中，我们将讨论以下主题：\n\n*   来自 IBM 和 CMOD 博客网站的链接\n*   硬件和软件要求\n*   操作系统环境变量设置\n\
  *   `IBM FileNet` 插件所需的扩展\n    *   在 Windows Server 上设置 `CFS-CMOD`\n    *   在 `Linux,\
  \ IBM FileNet P8` 内容引擎中创建自定义文档类\n\n## 来自 IBM 和 CMOD 博客网站的链接\n\n可以按照以下 ResearchGate\
  \ 免费下载链接为 `IBM Content Manager OnDemand` 基础系统平台安装支持的软件系统：\n\n1. 针对用户安全 LDAP 服务器\
  \ `IBM Security Directory Services 6.4`：在 `RHEL 8.0:` 上安装：[https://doi.org/10.13140/RG.2.2.33527.57761]\n\
  2. 针对 IBM 数据库的安装 `Db2 10.5`：在 `RHEL 8.0 V1:` 上安装：[https://doi.org/10.13140/RG.2.2.10491.67369]\n\
  3. 在 RedHat `RHEL 8.0:` 上将 IBM FileNet 系统从 `DB2 10.5 FP 10` 升级到最新的 `DB2 11.5` 版本：[https://doi.org/10.13140/RG.2.2.29470.69441]\n\
  4. 针对 Web 服务器 `IBM WebSphere 8.5.5.15`：在 `VMWare Workstation Pro 15.1:` 上安装：[https://doi.org/10.13140/RG.2.2.15007.10408]\n\
  5. 针对 `CMOD` 桌面 `IBM Content Navigator 3.0`：在 `RHEL 8.0:` 上安装：[https://doi.org/10.13140/RG.2.2.14590.95049]\n\
  6. 针对 `IBM FileNet Fixed Content Device` `IBM Content Foundation 5.5`：在 `RHEL 8.0:`\
  \ 上安装：[https://doi.org/10.13140/RG.2.2.21170.76480]\n7. 有关初始 `CMOD` 配置，请参见：[https://www.redbooks.ibm.com/redbooks/pdfs/sg24615]\n\
  \n有关知识库，请参阅：[https://cmod.wiki/] “`CMOD.wiki 是 IBM Content OnDemand 产品（也称为 CMOD\
  \ 或简单称为 OnDemand）用户和管理员的信息来源和指导来源。IBM CMOD 10.5 于 2020 年 3 月发布，可能会支持到 2025 年。对于\
  \ IBM Content OnDemand 修复包，请参阅公告与更新。`”\n\n此外，请从 IBM 支持网站下载 PDF：[https://www.ibm.com/support/pages/system/files/support/swg/swgdocs.nsf/0/eeee7450f3eb8e6385257b6e0047cef4/$FILE/IBM%20Content%20Manager%20OnDemand%20Best%20Practices_033015v2.pdf]\n\
  \n`CMOD` 产品线自 80 年代早期发布以来，已安装在数千个客户所在地，每天连接数百万用户。以下链接提供了有关市场关注的一些信息：[https://discovery.hgdata.com/product/ibm-content-ondemand]\n\
