  \ 程序重置 `ADMIN` 密码的步骤\n\n`ADMIN` 密码默认在 90 天后过期。如果设置了此项，你可能会看到来自 `ODWEK` Java `API`\
  \ 的错误代码 2061 消息，如图 C.6 所示：\n\n![](img/Figure_C.6.jpg)\n\n**图 C.6：** 来自 `ODWEK` Java\
  \ `API` 返回的错误代码 2061 消息\n\n要更新过期的密码，我们使用名为“OnDemand Administrator V10.5 (64-bit)”的\
  \ `IBM CMOD` 管理程序（位于 `c:\\Program Files\\IBM\\OnDemand Clients\\V10.5\\bin\\`）。我们在\
  \ Windows 服务器上运行 `arsadm.exe` `IBM CMOD` 客户端程序，如图 C.7 所示，以更新 `ADMIN` 用户的密码：\n\n\
  ![](img/Figure_C.7.jpg)\n\n**图 C.7：** 运行 `arsadm.exe` `IBM CMOD` 客户端程序以更新 `ADMIN`\
