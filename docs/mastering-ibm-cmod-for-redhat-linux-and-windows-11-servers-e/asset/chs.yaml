  \n## 使用 arsxml 添加 CMOD 应用程序组\n\n向 Content Manager OnDemand 系统添加组：\n\n1.  创建一个名为\
  \ `addgroups.xml` 的文件，内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<onDemand xmlns=\"http://www.w3.org/2001/XMLSchema-instance\">\n  <!-- 此文件创建\
  \ Baxter Credit 组 -->\n  <group\n    name=\"Baxter Credit\"\n    description=\"\
  Baxter Credit\"\n    ownerUser=\"Admin\">\n  </group>\n</onDemand>\n```\n\n2.  使用命令行函数：\n\
