    ## 8.3. 章节总结


    本章介绍了一些调查性能问题时非常有用的 Linux 工具工具。它引入了 `bash`、`tee` 和 `script` 等工具，这些工具可以实现性能数据的显示和收集。它还介绍了
    `gnumeric`，这是一个可以对基于文本的性能工具的结果进行绘图和分析的工具。接着研究了 `ldd` 和 `objdump`，它们可以跟踪函数属于哪个库。然后描述了
    `gdb`，这是一个可以调查运行程序执行和运行时信息的工具。最后，本章描述了 `gcc` 工具（如 `oprofile`），可以将事件映射回特定的源行，以及带有符号调试信息的二进制文件，这些信息有助于其他性能工具。


    在接下来的章节中，我们将整合目前介绍的所有工具，并解决一些真实的性能问题。


    ## 第 9 章. 使用性能工具查找问题


    本章包含了一种结合之前介绍的性能工具来缩小性能问题原因的方法。


    阅读完本章后，你应该能够：


    - 从运行异常的系统开始，使用 Linux 性能工具追踪异常的内核函数或应用程序。

    - 从运行异常的应用程序开始，使用 Linux 性能工具追踪异常的函数或源行。

    - 追踪 CPU、内存、磁盘 I/O 和网络过度使用的情况。


    ## 9.1. 并非万能的灵药


    本章假设可以通过更改软件来解决性能问题。通过调整应用程序或系统来达到目标性能目标并不总是可能的。如果调优失败，可能需要硬件升级或更换。如果系统容量已饱和，性能调优只能在一定程度上有所帮助。


    例如，直接升级系统内存可能是必要的（甚至更便宜的），而不是追踪哪些应用程序正在使用系统内存，然后对其进行调优以减少使用。决定直接升级系统硬件还是追踪并调优特定的性能问题取决于问题本身，并且是一种基于个人金钱考量（购买新硬件）的价值判断。在某些情况下，从时间角度（调查问题）或金钱角度来看哪种方案更便宜，调优将是首选或唯一的选择，这就是本章所描述的。


    ## 9.2. 开始寻找


    在决定在 Linux 上开始优化某些内容之前，你必须先决定要优化什么。本章使用的方法涵盖了一些常见的性能问题，示例展示了如何结合使用之前介绍的工具来解决问题。接下来的系列章节将引导你发现性能问题的原因。在许多章节中，你会被要求运行各种性能测试，并根据结果跳转到本章的不同章节。这有助于确定问题的源头。


    正如前面的章节所述，保存每次测试的结果是一个好主意，这可以让你稍后查看结果，如果调查无果，还可以发送给他人。


    让我们开始吧。


    调查问题时，最好从运行尽可能无关程序的系统开始，关闭任何不需要的应用程序或进程。干净的系统有助于消除任何额外应用程序带来的干扰。


    如果有某个特定的应用程序运行异常，跳转到第 9.3 节。相反，如果整个 Linux 系统运行异常，跳转到第 9.4 节。


    ## 9.3. 优化应用程序


    在优化应用程序时，应用程序执行的多个区域可能存在问题。本节根据你看到的问题引导你进入相应的章节。


    图 9-1 显示了我们优化应用程序的步骤。


    图 9-1.![](img/e2cf6437fe9be840157553cbb6a79_82_0.png)


    ## 9.4. 优化系统


