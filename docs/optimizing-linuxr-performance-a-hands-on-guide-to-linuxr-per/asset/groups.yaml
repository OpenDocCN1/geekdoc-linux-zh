    # 1.2. Outline of a Performance Investigation


    This section outlines a series of essential steps as you begin a performance investigation.
    Because the ultimate goal is to fix the problem, the best idea is to research
    the problem before you even touch a performance tool. Following a particular protocol
    is an efficient way to solve your problem without wasting valuable time.


    # 1.2.1. Finding a Metric, Baseline, and Target


    The first step in a performance investigation is to determine the current performance
    and figure out how much it needs to be improved. If your system is underperforming,
    you may decide that it is worth the time to investigate. If the system is performing
    close to its peak values, it might not be an investigation. Figuring out the performance
    values allows you to set reasonable performance expectations and gives you a performance
    goal, so that you know when to stop optimizing. You can always tweak your system
    just a little, and with no performance target, you can waste a lot of time squeezing
    out that extra percent of performance, even though you may not need it.


    # 1.2.1.1 Establish a Metric


    To figure out you have finished, you must create or use an already established
    metric of your system''s performance. For example, if you are optimizing a Web
    server, you would choose "serviced Web requests per second." If you do not have
    an objective to measure the performance, it can be nearly impossible to determine
    whether you are making any progress as you tune the system.


    # 1.2.1.2 Establish a Baseline


    After you figure out you are measuring the performance of a particular system
    or application, it is important to determine your current performance levels.
    Run the application and record its performance before any tuning or optimization;
    this is called the baseline value, and it is the starting point for the investigation.


    # 1.2.1.3 Establish a Target


    After you pick a metric and baseline for the performance, it is important to pick
    a target. This target guides you to the end of the performance hunt. You can indefinitely
    tweak a system, and you can always get it a little better with more and time.
    If you pick your target, you will know when have finished. Pick a reasonable goal,
    the following are starting points:


    +   * Find results with a similar configuration and ask for their performance
    measurements— This is an ideal situation. If you can find a similar system that
    performs better, not only will you be able to pick a target for your system, you
    may also be able to work with that person to determine your configuration is slower
    or how your configurations differ. Using another system as a reference can come
    immensely useful when investigating a problem.

    * Find results of industry standards benchmarks— Many Web sites compare benchmark
    results of various aspects systems. Some of the benchmarks can be achieved only
    with a heroic effort, so they might not represent realistic use. However, many
    benchmark systems have the configuration for particular results. These configurations
    can provide clues to help you tune the system.

    * Use hardware with a different OS or application— It may be possible to run a
    different application on your system with a similar function. For example, if
    you have two Web servers, and one performs slowly, try a different one to see
    if it performs better. Alternatively, try running the same application on a different
    operating system. If the system performs better in either of these cases, you
    know that your original configuration has room for improvement.'
