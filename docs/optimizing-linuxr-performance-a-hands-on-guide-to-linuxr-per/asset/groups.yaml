    ## 本书是如何安排的？


    本书旨在教授不同经验水平的读者如何发现并解决性能问题。为了实现这一目标，章节的安排允许你选择并阅读书的不同部分，而无需从头到尾通读全文。


    第 1 章专注于性能问题查找的基本方法。它包含了一系列并非特定于 Linux 的技巧和建议，这些技巧在追踪性能问题时证明非常有用。这些指南是性能问题查找的通用建议，适用于追踪任何类型计算机系统的性能问题。


    第 2 章至第 8 章（本书的主体内容）涵盖了在 Linux 系统上测量不同性能统计数据的各种工具。这些章节解释了这些工具测量的内容、如何调用它们，并提供了每个工具的用法示例。每一章都演示了如何测量不同子系统的方面，例如系统
    CPU、用户 CPU、内存、网络 I/O 和磁盘 I/O。如果一个工具测量了多个子系统的方面，那么它会出现在多个章节中。每个章节描述了多个工具，但在特定章节中仅介绍适用于特定子系统的适当工具。描述遵循以下格式：


    - 1. 简介——本部分解释了该工具要测量的内容以及其运行机制。

    - 2. 性能工具选项——本部分并不重复文档内容，而是解释了哪些选项与当前主题相关以及这些选项的含义。例如，某些性能工具手册只会识别工具测量的事件，但不会解释它们的含义。本部分将解释这些事件的含义以及它们与当前子系统的相关性。

    - 3. 示例——本部分提供了一个或多个使用工具测量性能统计数据的示例。本部分展示了工具的调用方式及其生成的任何输出。


    第 9 章列出了在面对性能缓慢的 Linux 系统时需要使用的特定步骤和系列操作。它解释了如何使用之前描述的 Linux 工具来确定性能问题的根源。如果你想一个运行正常的
    Linux 系统开始，在不一定理解工具细节的情况下诊断问题，那么这一章是最实用的。第 10 章至第 12 章展示了案例研究，在这些案例中，之前描述的方法和工具被结合使用来解决现实问题。案例研究强调了使用
    Linux 性能工具来发现不同类型的性能问题：CPU 密集型应用程序和 I/O 密集型应用程序。


    第 13 章涵盖了性能工具以及 Linux 改进的机会。


    本书有两个附录。附录 A 包含包含书中讨论的性能工具表，并包含了每个工具版本的 URL。附录 A 还标识了哪些 Linux 发行版支持特定的工具。最后，附录
    B 包含了有关如何安装 `profile` 的信息，这是一个某些 Linux 发行版上非常强大但难以安装的工具。


