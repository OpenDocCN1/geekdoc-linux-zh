    ## 12.4. 为性能查找配置应用程序


    调查的下一步是为性能查找配置应用程序。`prelink` 是一个小型且自独立的应用程序。事实上，它甚至没有使用共享库（它是静态链接的）。然而，使用所有符号重新编译它是一个好主意，这样我们在需要时就可以可以在调试器
    (gdb) 中检查它。再次，这使用了 `configure` 命令来生成 Makefile。我们必须下载 `prelink` 的源码并带符号进行重新编译。我们可以再次从
    Red Hat 下载 `prelink` 的 rpm。源码将安装在 `/usr/src/redhat/SOURCES`。一旦我们解压 `prelink` 的源码，就可以如列表
    12.6 所示进行编译。


    列表 12.6。


