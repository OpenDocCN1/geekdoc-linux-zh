    \ shared libraries.\n- Use this chapter as a template to find the cause of high\
    \ latency in a latency-sensitive application.\n\n## 11.1. A Latency-Sensitive\
    \ Application\n\nIn this chapter, we investigate an application that is sensitive\
    \ to slow latency. Latency can be thought of as the time it takes for an application\
    \ to respond to different external or internal events. An application with a small\
    \ amount of CPU time to respond to different events. However, the response to\
    \ the particular events is not swift enough. When fixing a latency performance\
    \ problem, we need to reduce the latency in response to the various events and\
    \ figure out what parts of the application are slowing down the response. As you\
    \ will see, tracking down a latency problem requires a slightly different tactic\
    \ than tracking down a CPU-intensive problem.\n\nThe significant difference of\
    \ this performance investigation from the GIMP investigation is that the times\
    \ we are trying to reduce are on the order of milliseconds rather than seconds.\
    \ When the times are so small, it can be difficult to make sure that the profiling\
    \ data you are capturing is actually the result of the event that you are trying\
    \ to measure rather than just the noise around trying to stop and start the profiling\
    \ tools. However, this short time period also makes it practical to trace all\
    \ aspects of the application for the interesting period of time.\n\n## 11.3. Find\
    \ a Baseline/Set a Goal\n\nAs the previous thought, the first step is to determine\
    \ the current state of the problem. To make our lives little easier, and to avoid\
    \ some of the problems mentioned in the preceding section, we are going to create\
    \ a little and the pop-up menu problem look more similar to the long-running CPU-intensive\
    \ tasks that we measured before. The amount of time it takes for a single pop-up\
    \ to appear is in the millisecond range, which makes it hard to accurately measure\
    \ with our performance tools. As mentioned previously, it will be difficult to\
    \ start and stop them in interest (that is, the amount of time spent to open the\
    \ actual menu). Here we see what we are interested in (that is, the menu where\
    \ we click. Instead of opening the menu just one time, we will open the menu 100\
    \ times in rapid succession. This way, the total amount of spent menus will increase\
    \ by a factor of 100. This enables us to use our profiling tools to capture information\
    \ about how the menu is executing.\n\nBecause right-100 times would be tedious,\
    \ and a human (unless well trained) could not reliably open up a pop-up menu 100\
    \ times in a repeatable manner, we must automate it. To reliably open up the pop-up\
    \ menu 100 times, we rely on the automation package. The xautation package is\
    \ available at http://httpajoo.net/projects/xautation.html. It can send any Window\
    \ events to the X server, mimicking a mouse click. After downloading the xautation\
    \ file, unzipping and compiling it, we can use it to automate the mouse click.\n\
    \nUnlike the GIMP, we cannot simply measure the amount of CPU time used by nautilus\
    \ to evaluate the created 100 pop-up menus. This is mainly because nautilus does\
    \ not start immediately before a menu is opened and end immediately after. We\
    \ are going to use wall-clock time to see how much time it takes to complete this\
    \ task. This requires the system to have no other things running while we run.\n\
    \nListing 11.1 shell script of xautation commands that are used to open 100 pop-up\
    \ menus in the nautilus window. When we run it, we have to make sure that we have\
    \ oriented the nautilus window so that none of the clicks actually opens a pop-up\
    \ menu on a folder, and instead all the pop-ups occur on the background. This\
    \ is important because the code paths for the different pop-ups could be radically\
    \ different.\n\n### Listing 11.1.\n\n```bash\n#!/bin/bash\nfor i in seq 100; do\n\
    \  echo $i\n  ./xte 'mousemove 100 100' 'mouseclick 3' 'mouseclick 3'\n  ./xte\
    \ 'mousemove 200 100' 'mouseclick 3' 'mouseclick 3'\ndone\n```\n\nThe commands\
    \ in Listing 11.1 move the cursor to (100,100) on the X screen, and click the\
    \ right button (3). This brings up a menu. Then we click the right mouse button\
    \ again, and closes this menu. Then they move to X position(100,100), and repeat.\n\
    \nNext, we use time to see how much of 100 iterations takes. This is our baseline\
    \ time. With our optimizations, we will check them again to see what we have improved.\
    \ Baseline time for the Fedora 2 nautilus is 26.5 seconds.\n\nFinally, we have\
    \ to pick a goal for our optimization. One way is to find how long it takes to\
    \ bring up a menu 100 times. Another example of this is, with snappy menus. Although\
    \ the menus are not as complicated as in nautilus, they should be at least an\
    \ upper bound on how\n\n## 11.4. Configure the Application for the Performance\
    \ Hunt\n\nThe next step in the investigation is to set up the application for\
    \ the performance hunt. Whereas GIMP recompiled the application immediately, we\
    \ are going to take a different approach with nautilus. It may be hard to figure\
    \ out which pieces need to be recompiled because it relies on many different shared\
    \ libraries. Instead of recompiling, we are going to download and install the\
    \ debugging information for each of the applications and libraries. For Fedora\
    \ and Enterprise Linux, Red Hat provides a set of `debuginfo rpm` that contain\
    \ all the symbol information and sources that were generated by the compiler when\
    \ the application was compiled. Each binary package or library has a corresponding\
    \ `debuginfo rpm`. However, it allows developers, or those investigating performance\
    \ problems, to download the appropriate `debuginfo` packages and use them. In\
    \ this case, Red Hat's version of `profile` will also recognize the `debuginfo`\
    \ packages and pick up the symbols while profiling an application, such as nautilus,\
    \ and a library, such as `gtk`. In this case, we are going to download the `debuginfo`\
    \ for `gtk`, nautilus, glib, and the kernel. If `profile` finds a library that\
    \ contributes a significant amount of cycles, but does not allow you to analyze\
    \ the libraries (`opreport` prints out “no symbols”), this indicates that no debugging\
    \ information is installed for the library. We can download and install the appropriate\
    \ `debuginfo` package for the library, and then `profile` will have access to\
    \ the debugging information.\n"
  mdcn: "\n\n## 10.13. 下一步工作\n\n我们已经超过了 lic 过滤器性能提升 10% 的目标，从这个意义上说，我们已经完成了优化过程。然而，如果我们想继续提高性能，就必须在使用新的优化方案时对过滤器重新进行性能分析（reprofile）。在每次应用性能优化后，对应用程序进行重新性能分析是非常重要的，在继续优化应用程序时不要依赖旧的分析数据。应用程序的运行时行为在每次优化后都可能发生巨大变化。如果你在每次优化后都不进行性能分析，就可能会面临追踪一个不再存在的性能问题的风险。\n\
    \n## 10.14. 本章总结\n\n在本章中，我们确定了为什么一个应用程序（GIMP 过滤器 lic）是 CPU 密集型的。我们确定了应用程序的基准运行时，设定了优化目标，并保存了一张参考镜像以验证我们的优化没有改变应用程序的行为。我们使用了\
    \ Linux CPU 性能工具（`oprofile` 和 `ltrace`）来调查应用程序为什么是 CPU 密集型的。然后，我们使用 `gdb` 来理解应用程序的工作原理，并想出不同的优化方法。我们尝试了几种不同的优化，但最终，我们选择了经典的“增加内存使用以减少\
    \ CPU 使用”的性能权衡方案。\n\n我们超越了优化目标，并验证了我们的优化没有改变应用程序的输出。\n\n虽然本章侧重于优化单个应用程序的运行时，但下一章将介绍一次性能搜寻，重点在于减少与\
    \ X Windows 交互时的延迟。减少延迟可能是困难的，因为单个事件往往会触发一系列不显见的其他事件。困难之处在于确定哪些事件被调用了以及每个事件花费了多长时间。\n\
    \n## 第 11 章 性能搜寻 2：延迟敏感型应用程序 (nautilus)\n\n本章包含一个如何使用 Linux 性能工具在延迟敏感型应用程序中发现并修复性能问题的示例。\n\
    \n读完本章后，你应该能够：\n\n- 使用 `ltrace` 和 `profile` 确定延迟敏感型应用程序中产生延迟的位置。\n- 使用 `gdb` 为每次对“热点”函数的调用生成堆栈跟踪（stack\
    \ trace）。\n- 使用性能工具确定使用许多不同共享库的应用程序时间耗费在哪里。\n- 将本章作为模板，寻找延迟敏感型应用程序中高延迟的产生。\n\n\
    ## 11.1. 延迟敏感型应用程序\n\n在本章中，我们调查了一个对慢延迟敏感的应用程序。延迟可以被认为应用程序响应不同外部或内部事件所需的时间。一个应用程序只有少量的\
    \ CPU 时间来响应不同的事件。然而，它对特定事件的响应不够快。在修复延迟性能问题时，我们需要减少对各种事件响应的延迟，并找出应用程序的哪些部分降低了响应。正如你所看到的，追踪延迟问题的策略与追踪\
    \ CPU 密集型问题的策略略有不同。\n\n这次性能调查与 GIMP 调查的显著区别在于，我们试图减少的时间级是毫秒级的，而不是秒级的。当时间如此短时，要确保你捕获的分析数据确实是你试图测量的事件的结果，而不是仅仅是启动和停止性能分析工具时产生的噪声，是非常困难的。然而，这段短时间范围也使得在有趣的时间段内对应用程序的所有方面进行追踪变得可行。\n\
    \n## 11.3. 基准/设定目标\n\n正如前面提到的，第一步是确定问题的当前状态。为了让我们的工作更轻松一点，并避免上一节提到的某些问题，我们将创建一个小窗口和弹出菜单问题使其看起来更像我们之前测量的长时间运行\
    \ CPU 密集型任务。单个弹出菜单出现的时间在毫秒范围内，这使得很难用我们的性能工具进行准确测量。正如之前提到的，在感兴趣的时间内（即打开实际菜单花费的时间）启动和停止这些工具将很困难。在这里，我们看到了我们感兴趣的内容（即我们点击的菜单）。我们不会只打开一次菜单，而是将连续快速打开\
