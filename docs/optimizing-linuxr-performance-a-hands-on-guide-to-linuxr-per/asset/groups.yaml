    ## 附录 B 安装 profile


    系统性能分析器 profile 是一项强大的性能工具，其安装/使用可能会很复杂。本附录描述了在 Fedora Core 2 (FC2)、Red Hat Enterprise
    Linux (EL3) 和 SUSE 9 (S9) 上安装 profile 时遇到的一些问题。


    ### B.1 Fedora Core 2 (FC)


    对于 FC2，Red Hat 提供了 profile 的软件包，应该使用这些包而不是 profile 网站上的。单处理器内核不提供必要的 profile 驱动程序。Red
    Hat 将必要的内核模块与 SMP 版本的内核一起打包。如果你想运行 profile，即使你是在单处理器机器上运行，也必须使用 SMP 内核。


    ### B.2 Enterprise Linux 3 (EL3)


    对于 EL3，Red Hat 再次提供了 profile 的软件包，应该使用这些包而不是 profile 网站上的。单处理器内核不提供必要的 profile
    驱动程序。Red Hat 在 SMP 或大内存版本的内核中包含了必要的内核模块。如果你想运行 profile，即使你是在单处理器机器上运行，也必须使用 SMP
    或大内存内核。在 EL3 中使用 profile 的更多信息请参阅 http://www.redhat.com/docs/manuals/enterprise/RHEL-3-Manual/sysadmin-guide/profile.html。


    ### B.3 SUSE 9.1


    对于 SUSE 9.1，SUSE 提供了 profile 的软件包，应该使用这些包而不是 profile 网站上的。所有版本的 SUSE 内核（默认、SMP
