    ## 12.7. 模拟解决方案


    `strace` 揭的信息显示 `prelink` 花了大量时间尝试打开和分析无法预链接的二进制文件。测试链接二进制文件缓存是否能提高 `prelink`
    性能的最佳方法是修改 `prelink`，将其所有链接二进制文件添加到初始缓存中。遗憾的是，向这些“未链接”二进制文件添加代码可能是一个复杂的过程，涉及大量关于
    `prelink` 内部的知识。一种更简单的方法是用已知的链接二进制文件替换所有链接的二进制文件来模拟缓存。这会导致先先链接的二进制文件在运行时被忽略。这正是如果我们拥有缓存时会发生的情况，因此我们可以用它来估计如果
    `prelink` 缓存并忽略链接二进制文件，我们将看到的性能提升。


    为了开始实验，我们将 `/usr/bin/` 中的所有文件复制到沙箱目录并在该目录上运行 `prelink`。该目录包含了二进制文件、shell 和无法进行预链接的库。然后我们在沙箱目录上运行
    `prelink`，让它创建一个新缓存而不是系统缓存。这如列表 12.5 所示。


    列表 12.5。


    ```

    /usr/sbin/prelink -C new_cache -f sandbox/

    ```


    接下来，在列表 12.16 中，我们记录缓存 `prelink` 运行所需的时间。我们必须运行多次直到获得一致的结果（第一次运行为后续每次运行预热了缓存）。列表
    12.16 中的基准时间为 .983 秒。我们必须优于这个时间，我们的优化（改进缓存）才有意义。


    列表 12.16。


    ```

    time /usr/sbin/prelink -C new_cache -q sandbox/

    real    0m.983s

    user    0m.597s

    sys      0m.386s

    ```


    接下来，在列表 12.17 中，我们对此 `prelink` 命令运行 `strace`。这是为了记录 `prelink` 在沙箱目录中打开了哪些文件。


    列表 12.17。


    ```

    strace -o strace_prelink_sandbox /usr/sbin/prelink -new_cache -q/

    ```


    我们创建一个新目录 `sandbox2`，并将 `/usr/bin` 目录中的所有二进制文件复制其中。然而，我们将之前的 `strace` 输出中 `prelink`
    “打开”的所有文件覆盖为已知的、可以链接的良好二进制文件。我们复制到所有二进制文件而不仅仅是它们，以便两个沙箱包含相同数量的文件。在设置好第二个沙箱后，我们使用列表
    12.18 中的命令在新目录上运行完整版本的 `prelink`。


    列表 12.18。


    ```

    [root@localhost prelink]#/usr/sbin/prelink -C new_cache2 -f sandbox/

    ```


    ## 12.8. 报告问题


    由于我们在一个相当底层的系统软件中发现了一个问题和潜在解决方案，与作者合作解决该问题是一个好主意。我们至少必须提交一个错误报告，以便作者知道问题的存在。提交我们用于发现问题的测试将有助于他重现问题，并希望修复它。在这种情况下，我们将向
    Red Hat 的 bug (zilla.redhat.com) 跟踪系统添加一个错误报告。（大多数发行版都有类似的跟踪系统。）我们的错误报告描述了我们遇到的问题以及我们发现的可能解决方案。


    到达 bugzilla 时，我们首先搜索 `prelink` 的错误报告，查看是否其他人报告过此问题。在没有发现的情况下，我们查看列表 12.22 中的错误报告并等待作者或维护者的响应并修复
