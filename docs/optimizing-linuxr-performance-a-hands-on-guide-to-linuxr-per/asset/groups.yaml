    that vmstat will display.


    #### Table 6-1. vmstat Command-Line Options


    | Option | Explanation |

    | - | - |

    | -D | This displays Linux I/O subsystem total statistics. This option can give
    you a good idea of how your I/O subsystem is being used, but won''t give statistics
    on individual disks. The statistics given are the totals system boot, rather than
    just that occurred between this sample and the previous sample |

    | -d | This displays individual disk statistics at a rate of one sample per interval.
    The statistics are the totals system boot, rather than just that occurred between
