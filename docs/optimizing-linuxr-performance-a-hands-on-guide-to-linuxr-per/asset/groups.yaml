    ## 12.5. 安装并配置性能工具


    查找的下一步是安装性能工具。在这种情况下，`ltrace` 或 `profile` 均无帮助。`profile` 用于分析消耗大量 CPU 时间的应用程序，由于
    `preload` 在运行时仅使用约 3% 的 CPU，因此 `profile` 将无法无法提供帮助。由于 `preload` 二进制文件是静态链接且不使用任何共享库，`ltrace`
    也无法我们提供帮助。然而，系统调用跟踪器 `strace` 可能有帮助，因此我们需要安装它。


    ## 12.6. 运行应用程序和性能工具


    现在我们终于可以分析 `prelink` 不同模式的性能特征了。正如你所说，`prelink` 没有花费太多时间使用 CPU；它所有的时间都花在了磁盘 I/O
    上。`prelink` 必须调用内核进行磁盘 I/O，我们应该能够使用 `strace` 工具跟踪它的执行。由于 `prelink` 的快速模式（quick
    mode）似乎并不比标准全运行快，我们比较两者的 `strace` 以查看是否有任何异常行为。


    首先，我们使用 `strace` 跟踪运行较慢的 `prelink`。这是初始化了 `prelink` 在快速模式下使用的缓存的运行。最初，我们使用 `strace`
    显示 `prelink` 所做调用的总结，并查看每个调用完成所需的时间。执行此操作的命令在列表 12.7 中。


