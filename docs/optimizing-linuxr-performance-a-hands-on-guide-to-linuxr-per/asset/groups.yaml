    \ nautilus 的基准时间为 26.5 秒。\n\n最后，我们必须为优化选择一个目标。一种方法是找到弹出 100 次菜单所需的时间。另一个例子是快速菜单。虽然菜单不像\
    \ nautilus 那么复杂，但它们至少是一个上限。\n\n## 11.4. 为性能搜寻配置应用程序\n\n调查的下一步是为性能搜寻设置应用程序。虽然 GIMP\
