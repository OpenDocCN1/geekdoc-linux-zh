  - '[PAGE 0]


    # Optimizing Linux® Performance: A Hands-On Guide to Linux® Performance Tools


    By Phillip E. Ezolt


    Publisher: Pearson PTR

    Pub Date: March 14, 2005

    Print ISBN: 0-13-148682-9

    Pages: 384


    Table of Contents | Index


    # Overview


    The first comprehensive, expert guide for end-to-end Linux application optimization
    is more crucial than ever—and in today''s complex production environments, it''s
    tougher to ensure code access, plus an exceptional array of optimization tools.
    But the tools are scattered across the Internet. Many problems, now one of those
    experts has written the definitive Linux tuning primer for every professional:
    Optimizing Linux. Today''s most vital Linux application optimization tools show
    how they fit into a proven methodology for how to identify the exact lines of
    source code that are impacting performance, helping administrators and application
    developers solve matters more quickly. You will discover how to: Identify bottlenecks
    if you are not familiar with the underlying system architecture and applications,
    through case studies you can easily adapt to your own environmentInstall and use
    profilers, the advanced tools and practical introduction to all the principles
    and strategies you''ll need. If you''re migrating to Linux, you''ll quickly master
    the background of environment, this guide will help you improve the performance
    of all your applications—increasing bus'
