    ## 13.4 章节总结


    在本章中，我们研究了 Linux 性能工具集存在不足的几个领域，并提出了一些理想的解决方案。我们还讨论了为什么 Linux 是进行性能调查和优化的良好平台。


    改进 Linux 性能取决于你，这位读者。Linux 性能和 Linux 性能工具的改进机会随处不在。如果你发现了一个困扰你的性能问题，请修复它，或者将其报告给开发者并与他们合作修复。无论哪种方式，都不会再受到该问题的影响，整个
    Linux 社区都从中受益。


    ## 附录 A 性能位置


    书中描述的性能工具源自互联网的许多地方。幸运的是，大多数分发版已经将它们整合在一起并包含在当前的发行版版本中。表 1 描述了所有工具，提供了它们原始位置的链接，并指示了它们是否包含在以下发行版中：Fedora
    Core 2 (FC2)、Red Hat Enterprise Linux (EL3) 和 SUSE 9 (S9)。


