    ## 9.6. 优化内存使用


    通常，使用大量内存的程序会导致其他性能问题的出现，例如缓存未命中（cache misses）、旁路缓冲区（TLB）缺失以及交换（swapping）。


    图 9-4 显示了我们为了确定系统内存使用情况将做的决策流程图。


    图 9-4。


    进入第 9.6.1 节开始调查。


    ## 9.6.1. 内核内存使用是否在增加？


    在追踪系统内存使用情况时，你首先必须确定内核本身正在分配内存。运行 `slabtop` 查看内核内存总数是否在增加。如果正在增加，跳转到第 9.6.2 节。


    如果内核内存使用没有增加，可能是某个进程导致了增长。要追踪是哪个进程导致了内存使用的增加，请转到第 9.6.3 节。


    ## 9.6.2. 内核在使用什么类型的内存？


    如果内核内存使用正在增加，再次运行 `slabtop` 以确定内核正在分配什么类型的内存。slab 的名称可以提供有关为什么要分配内存的某些线索。通过网络搜索，在内核源码中搜索
    slab 名称并确定它被用于哪个子系统，可能会清楚分配的原因。当你确定了哪个子系统分配了所有这些内存后，尝试调整该特定子系统消耗的最大内存量，或者减少该子系统的使用量。


    进入第 9.9 节。


    ## 9.6.3. 特定进程的驻留集（Resident Set）是否在增加？


    接下来，你可以使用 `top` 或 `ps` 查看特定进程的驻留集大小（rss）是否在增加。在 `top` 的输出字段中添加 `rss` 并按使用的内存类型进行排序很容易的。如果特定进程正在不断增加内存使用，由于该应用程序，请转到第
    9.6.6 节。如果没有特定进程在使用更多内存，转到第 9.6.4 节。


    ## 9.6.4. 共享内存使用是否在增加？


    使用 `ipcs` 确定是否在使用共享内存。如果是，进入第 9.6.5 节以确定哪些进程在使用这些内存。否则，系统可能存在本文未涵盖的内存泄漏。进入第 9.9
    节。


    ## 9.6.5. 哪些进程在使用共享内存？


    使用 `ipcs` 确定哪些进程在使用共享内存。识别出使用共享内存的进程后，调查各个进程以确定每个进程使用内存的原因。例如，在应用程序的源码中查找对 `shmget`
    和 `shmat`（用于挂载）的调用。阅读应用程序文档并寻找可以减少共享内存使用的选项。


    要减少共享内存使用，进入第 9.9 节。


    ## 9.7. 优化磁盘 I/O 使用


    当你确定磁盘 I/O 是问题时，确定是哪个应用程序导致了 I/O 会很有帮助。


    图 9-5 显示了我们确定磁盘 I/O 使用原因所采取的步骤。


    图 9-5。


    ![](img/e2cf6437fe9be84e01517553c4bb6a79_94_0.png)


    要开始调查，跳转到第 9.7.1 节。


    ## 9.8. 优化网络 I/O 使用


    当你知道发生了问题时，Linux 提供了一组工具来确定涉及哪些应用程序。然而，当你连接到外部机器时，网络问题的修复并不总是在你的控制范围内。


    图 9-6 显示了我们调查网络性能问题所采取的步骤。


    ![](img/e2cf6437fe9be84e01517553c4bb6a79_97_0.png)


    要开始调查，继续查看第 9.8.1 节。


    ## 9.8.1. 是否有网络设备的发送/接收接近理论极限？


    第一件事是使用 `ethtool` 确定每个以太网设备设置的硬件速率。如果你记录这些信息，就可以调查是否有任何网络设备已饱和。以太网设备和/或交换机可能配置错误，`ethtool`
    显示每个以太网设备的速度，使用 `iptraf` 或 `ifconfig` 确定通过每个接口的流量。如果网络设备似乎已饱和，进入第 9.8.3 节；否则，进入第
    9.8.2 节。


    ## 9.8.2. 是否有网络设备产生了大量错误？


    网络流量也可能因为大量的网络错误而显得缓慢。使用 `ifconfig` 确定是否有任何接口产生了大量错误。大量错误可能是以太网卡/以太网交换机连接不匹配的结果。联系网络管理员，在网络上搜索类似问题，或者向开发者提问以解决它。


    ## 9.8.3. 设备上运行着什么种类型的流量？


    如果某个特定设备正在处理流量，使用 `iptraf` 追踪该设备正在发送和接收的流量类型是有帮助的。当你知道设备正在处理的流量类型时，进到第 9.8.4 节。


    ## 9.8.4. 是否是特定进程产生了大量流量？


    接下来，我们可以使用 `netstat -p` 查看是否是某个特定进程产生了流量。如果是某个应用程序在使用这些流量，进入第 9.8.6 节。如果没有特定进程在使用，转到第
    9.8.5 节。


    ## 9.8.5. 哪个远程系统在发送流量？


    如果不是应用程序在使用这些流量，可能是某个系统在骚扰你。要确定是哪个系统在发送流量，使用 `iptraf`。


    ## 9.9. 结束


    当你最终到达这里时，你的问题可能已经解决，但你将获得大量的特征信息。在组组中搜索类似问题。邮件给开发者看看他们是如何解决的。尝试解决方案并观察系统是否发生了变化。


    ## 9.10. 章节总结


    本文提供了一种结合使用 Linux 工具追踪不同类型问题的方法。虽然无法捕捉可能出现的问题类型，但这种方法可以帮助你发现一些常见问题。此外，如果你面临的问题未被涵盖，你收集的数据仍然有用。


    接下来的章节将展示如何使用该方法发现性能问题。


    - 使用本章作为追踪 CPU 相关问题的模板。


    ## 10.1. 密集型应用程序


    在本章中，我们调查了一个 密集型应用程序。优化 密集型应用程序是非常重要的，因为它是最常见的问题之一。它通常是经过调优应用程序的最后边界。当磁盘和网络瓶颈被消除后，应用程序就会变得密集。此外，购买更快的磁盘或更多内存通常比升级
    CPU 更容易，因此如果一个进程是密集型的，追踪并修复 CPU 性能问题是一项重要的技能，而不是直接买新系统。


    ## 10.2. 识别问题


    性能猎寻的第一步是识别要调查的问题。在本例中，我选择调查在使用 GIMP（一个开源图像处理程序）时出现的一个性能问题。GIMP 可以切割和处理图像的各个方面，但它还有一套强大的过滤器可以各种方式扭曲和改变图像。这些过滤器根据复杂的算法改变图像。通常，这些过滤器完成需要很长时间，并且非常消耗
    CPU。其中一个过滤器是 Van Gogh (LIC)，它接收输入图像并对其修改，使其看起来像梵高风格的绘画。这个过滤器完成所需的时间特别长。完成时间取决于图像的大小、机器
    CPU 的速度以及传递给过滤器的参数值。


    '
