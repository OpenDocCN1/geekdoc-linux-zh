    ## 3.3. Chapter Summary


    This chapter focused on system-wide memory performance metrics. These metrics
    mainly demonstrate how the operating system is using memory rather than a particular
    application.


    This chapter demonstrated performance tools such as sar and vmstat can be used
    to extract this system-wide memory performance information from a running system.
    The output of these tools indicates how the system as a whole is using available
    memory. The next chapter describes the tools available to investigate a single
    process''s CPU usage.


    # Chapter 4. Performance Tools: Process-Specific CPU


    After using the system-wide performance tools to figure out which process is slowing
    down the system, you must apply the process-specific performance tools to figure
    out how the process is behaving. Linux provides a rich set of tools to track the
    important statistics of a process and application’s performance.


    After reading this chapter, you should be able to:


    - Determine whether an application’s runtime is spent in the kernel or application.

    - Determine what library and system calls an application is making and how long
    they are taking.

    - Profile an application to figure out what source lines and functions are taking
    the longest time to complete.


    ## 4.1. Process Performance Statistics


    The tools to analyze the performance of applications are varied and have existed
    in one form or another the early days of Unix. It is critical to understand how
    an application is interacting with the operating system, CPU, and memory system
    to understand its performance. Most applications are not self-contained and make
    many calls to the Linux kernel and different libraries. Calls to the Linux kernel
    (or system calls) may be as simple as "my PID" or as complex as "read 12 blocks
    of data from the disk." Different systems will have different performance implications.
    Consequently, the library calls may be as simple as memory allocation or as complex
    as graphics creation.


    ### 4.1.1. Kernel Time Versus User Time


    The most basic split of where an application spends its time is between kernel
    and user time. Kernel time is the amount of time spent in application or library
    code. Linux has tools such as top and ps that enable (appropriately) whether an
    application is spending its time in application or kernel code. It also has commands
    such as profile and strace that enable you to trace which kernel calls are made
    on the behalf of the process, as well as how long those calls took to complete.


    ### 4.1.2. Library Time Versus Application Time


    Any application with even a minor amount of complexity relies on system libraries
    to perform complex actions. These libraries may cause performance problems, so
    it is important to be able to see how much an application spends in a particular
    library. Although it might not always be practical to modify the source code of
    libraries directly to fix a problem, it may be possible to change the application
    code to call different or fewer library functions. The ltrace command and profile
    suite provide a way to analyze the performance of libraries when they are used
    by applications. Tools built into the Linux loader, ld, help you determine how
    the use of many libraries slows down an application''s start time.


    ### 4.1.3. Subdividing Application Time


    When the application is known to be the bottleneck, Linux provides tools that
    enable you to profile an application to figure out where time is spent within
    an application. Tools such as gprof and profile can generate profiles of an application
    exactly which source line is causing large amounts of time to be spent.


    ## 4.2. The Tools


    Linux has a variety of tools to help determine which pieces of an application
    are the primary users of the CPU. This section describes these tools.


    ### 4.2.1. time


    The time command performs a basic function when testing a command''s performance,
    yet it is often the first place to turn. The time command acts as a stopwatch
    and knows how long a command takes to execute. It measures three types of time.
    First, it measures the real or elapsed time, which is the amount of time between
    the program started and finished execution. Next, it measures the user time, which
    is the amount of time that the CPU spent executing code on behalf of the program.
    Finally, time measures system time, which is the amount of time the CPU spent
    in system or kernel code on behalf of the application.


    #### 4.2.1.1 CPU Performance-Related Options


    The time command (see Table 4-1) is invoked in the following manner:


    ```

    time [-v] application

    ```


    ### Table 4-1. time Command-Line Options


    | Option | Explanation |

    | :--- | :--- |

    | -v | This presents a verbose display of the program''s time and statistics.
    Some statistics are zeroed out, but more statistics are valid with Linux kernel
    v2.6 than with Linux kernel v2.4. |


    Most of the valid statistics are present in both the standard and verbose mode,
    but the verbose provides a better description for each statistic.


    The application is timed, and information about its CPU usage is displayed on
    standard output after it has completed. Table 4-2 describes the valid output that
    the time command provides. The rest are not measured and always display zero.


    ### Table 4-2. CPU-Specific time Output


    | Column | Explanation |

    | :--- | :--- |

    | User time (seconds) | This is the number of seconds of CPU spent by the application.
    |

    | System time (seconds) | This is the number of seconds spent in the Linux kernel
    on behalf of the application. |

    | Elapsed (wall-clock) time (h:mm:ss or ms) | This is the amount of elapsed time
    (in wall-clock time) between the application was launched and when it completed.
    |

    | Percent of CPU this job got | This is the percentage of the CPU that the process
    consumed as it was running. |


    ## 4.3. Chapter Summary


    This chapter covered how to track the CPU performance bottleneck of individual
    processes. You learned to determine how an application was spending its time by
    attributing the time spent to the Linux kernel, system libraries, or even to the
    application itself. You also learned how to figure out which calls were made to
    the kernel and system libraries and how long each took to complete. Finally, you
    learned how to profile an application and determine the particular line of source
    code that was spending a large amount of time. After mastering these tools, you
    can start with an application that hogs the CPU and use these tools to find the
    exact functions that are spending all the time.


    Subsequent chapters investigate how to find bottlenecks that are not CPU bound.
    In particular, you learn about the tools used to find I/O bottlenecks, such as
    a saturated disk or an overloaded network.


    # Chapter 5. Performance Tools: Process-Specific Memory


    This chapter covers tools that enable you to diagnose an application''s interaction
    with the memory subsystem as managed by the Linux kernel and the CPU. Because
    different layers of the memory subsystem have orders of magnitude differences
    in performance, fixing an application to efficiently use the memory subsystem
    can have a dramatic influence on performance. After reading this chapter, you
    should be able to:


    - Determine how much memory an application is using (ps, /proc).

    - Determine which functions of an application are allocating memory (memprof).

    - Profile the memory usage of an application using both simulation (cachegrind,
    cachegrind) and hardware performance counters (oprofile).

    - Determine which processes are creating and using shared memory (ipcs).


    ## 5.1. Linux Memory Subsystem


    When analyzing memory performance, it may become necessary to observe how an application
    performs at various levels within the memory subsystem. At the top level, the
    operating system decides how swap and physical memory are used. It decides what
    pieces of application''s address space are in physical memory, which is called
    the resident set. Other memory used by the application but not part of the resident
    set will be swapped to disk. The application decides how much memory it requests
    from the operating system, and this is called the virtual set. The application
    can allocate this by calling malloc or implicitly by using a large amount of stack
    or using a large number of libraries. The application can also allocate shared
    memory that can be used by itself and others. The ps performance tool is useful
    for tracking which code in an application is allocating memory. The memprof performance
    tool is useful for tracking which code in an application is allocating size. The
    itps tool is useful for tracking shared memory.


    When an application is using physical memory, it begins to interact with the CPU''s
    cache subsystem. Modern CPUs have multiple levels of cache. The fastest cache
    to the CPU (also called L1 and Level 1 cache) is the smallest in size. For instance,
    that the CPU has only two levels of cache: L1 and L2. When the CPU requests a
    piece of memory, the processor checks to see whether it is already in the L1 cache.
    If it is, the CPU uses it. If it is not in the L1 cache, the processor generates
    a L1 miss. It checks in the L2 cache; if the data is in the L2, it is used. If
    the data is not in the L2 cache, an L2 miss occurs, and the processor must go
    to physical memory to retrieve the data. Smart cache usage—arranging an application''s
    data structures and reducing cache size—may make it possible to reduce the number
    of cache misses and increase performance. cachegrind and profile are great tools
    to find information about how an application is using the cache and about which
    functions and data structures are causing cache misses.

