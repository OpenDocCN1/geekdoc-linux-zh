    \ as requested.**\n\n[content]\n## 10.8. Jump to the Web\n\nNow that we have found\
    \ GIMP functions are used for much of the time, we have to figure out exactly\
    \ what these functions are and possibly optimize our time.\n\nFirst, we search\
    \ the Web for `pixel_rgn_get_pixel` and try to determine what it does. After a\
    \ few false starts, the following link and information revealed in Listing 10.11\
    \ confirm our suspicions about what pixel_rgn_get_pixel does.\n\n# Listing 10.11.\n\
    \n```\n\"There are calls for pixel_rgn_get_pixel, row, col, and rect,\nwhich grab\n\
    data from the image and dump it into a buffer that you've\npre-allocated.\nAnd\
    \ there are set calls to match. Look for \"Pixel Regions\" in\ngimp.h\"\n(from\n\
    http://gimp-plugin-ins.sourceforge.net/doc/Writing/html/sect-image.html )\n```\n\
    \nIn addition, the information in Listing 10.12 suggests that it is a good idea\
    \ to avoid using pixel_rgn_get_calls.\n\n# Listing 10.12.\n\n```\n\"Note that\
    \ these calls are relatively slow, they can easily be\nthe slowest thing in your\
    \ plugin-in. Do not get (or set) pixels one\nat a time\nusing pixel_rgn_[get|set]_pixel\
    \ if there is any other way.\"\n(from\nhttp://www.home-unix.org/simon/gimp/gaud2002/gimp-plugin/html/imagedata.html)\"\
    \n```\n\nIn the Web, we search yield information about the gimp_rgb_set_uchar\
    \ function by simply turning up the source for the function. As shown in Listing\
    \ 10.13, this puts back the red, and blue values into a GimpRGB structure that\
    \ represents a single color.\n\n# Listing 10.13.\n\n```\nvoid\ngimp_rgb_set_uchar\
    \ (GimpRGB *rgb,\nguchar r,\nguchar g,\nguchar b)\n{\n\tg_return_if_fail (rgb\
    \ != NULL);\n\trgb->r = (double) r / 255.0;\n\trgb->g = (double) g / 255.0;\n\t\
    rgb->b = (double) b / 255.0;\n}\n```\n\n## 10.9. Increase the Image Cache\n\n\
    The sites explain that GIMP manages images in a slightly counterintuitive fashion.\
    \ Instead of storing the image in a big array, GIMP instead breaks the image into\
    \ a series of tiles. These tiles are 64x64. When a user wants to access a particular\
    \ pixel of the image, GIMP loads the appropriate tile, and finds and returns the\
    \ pixel value. Each call to retrieve a pixel can be slow. If this process is done\
    \ repeatedly for each pixel, this can dramatically slow down performance as GIMP\
    \ reloads the tile and use the cache values rather than reload the tiles at each\
    \ time. Fortunately, GIMP provides a way to cache the old tiles and use the cache\
    \ values at each time. This should increase performance. The amount of cache that\
    \ GIMP provides can be controlled by using the `gimp_tile_cache_ntiles` call.\
    \ This call is currently used inside `lic` and sets the cache to twice as many\
    \ tiles as the image is wide.\n\nEven though this might seem like enough cache,\
    \ the GIMP might possibly still need more. The simple way to test this is to increase\
    \ the cache to a very large value and see whether that improves performance. So,\
    \ in this case, we increase the amount of cache to 10 times the amount that is\
    \ normally used. After increasing this value and rerunning the filter, we receive\
    \ a time of 2 minutes and 40 seconds. This is an increase of 6 seconds, but we\
    \ have not reached our goal of 2 minutes and 30 seconds. This says that we must\
    \ look in other areas to increase the performance.\n\n## 10.10. Hitting a (Tiled)\
    \ Wall\n\nIn addition to using the tile cache, the Web pages suggests a better\
    \ way to increase the performance of get_pixel By accessing the pixel information\
    \ directly (without a call to gimp_pixel_rgn_get_pixel), it is possible to dramatically\
    \ increase the performance of the pixel access.\n\nGIMP can provide a way for\
    \ the filter programmer to directly access the tiles of an image. The filter can\
    \ then access the image data as if it were accessing a data array, instead of\
    \ requiring a call to a GIMP library. However, there is a catch. When you have\
    \ direct access to the pixel data, it is only for the current tile. GIMP will\
    \ iterate over all the tiles in the image, allowing you to ultimately have access\
    \ to all the pixels in the image, but you cannot access all simultaneously. It\
    \ is only possible to look at the pixels from a single tile, and this is incompatible\
    \ with how lic accesses data. When the its filter is generating a new pixel at\
    \ a particular location, it calculates its new value based on the values of the\
    \ pixels that surround it. Therefore, when generating new pixels on the edge of\
    \ a tile, the lic filter requires pixel data from all the pixels around it. Unfortunately,\
    \ these may be on the previous tile or the next tile in the image. Because this\
    \ pixel information is not available, the image filter will not work with this\
    \ optimized access method.\n\n## 10.11. Solving the Problem\n\nWhen you have direct\
    \ access to the pixel data, it is only for the current tile. GIMP will iterate\
    \ over all the tiles in the image, allowing you to ultimately have access to all\
    \ the pixels in the image, but you cannot access all simultaneously. It is only\
    \ possible to look at the pixels from a single tile, and this is incompatible\
    \ with how lic accesses data. When the its filter is generating a new pixel at\
    \ a particular location, it calculates its new value based on the values of the\
    \ pixels that surround it. Therefore, when generating new pixels on the edge of\
    \ a tile, the lic filter requires pixel data from all the pixels around it. Unfortunately,\
    \ these may be on the previous tile or the next tile in the image. Because this\
    \ pixel information is not available, the image filter will not work with this\
    \ optimized access method.\n\n# Listing 10.14.\n\n```\nint g_image_width, g_image_height;\n\
    GimpRGB *cached_image;\n\nvoid cache_image(GimpPixelRgn *src_rgn, int width, int\
    \ height)\n{\n  static guchar data[4];\n  int x, y;\n  GimpRGB *current_pixel;\n\
    \n  g_image_width = width;\n  g_image_height = height;\n\n  cached_image = malloc(sizeof(GimpRGB)*width*height);\n\
    \  current_pixel = cached_image;\n\n  /* Malloc */\n  for (y = 0; y < height;\
    \ y++)\n    {\n      for (x = 0; x < width; x++)\n        {\n          pixel_rgn_get_pixel(src_rgn,\
    \ data, x, y);\n          gimp_rgba_set_uchar(current_pixel, data[0], data[1],\
    \ data[2], data[3]);\n\n          current_pixel++;\n        }\n    }\n}\n```\n\
    \n# Listing 10.15.\n\n```\nstatic void peek(GimpPixelRgn *src_rgn,\n  int x,\n\
    \  int y,\n  GimpRGB *color)\n```\n\n## 10.12. Verify Correctness?\n\nAfter we\
    \ an optimization that has significantly reduced the filter's runtime, it is necessary\
    \ to verify that the output image it produces is the same for both the optimized\
    \ and unoptimized filter. After loading up the original reference image and comparing\
    \ it to the newly generated image, I used GIMP to take the difference of the two\
    \ images. If the reference and optimized image are identical, all the pixels should\
    \ be zero (black). However, the different image was not perfectly black. Visually,\
    \ it looked black, but upon closer inspection (using the G color picker), some\
    \ of the pixels were nonzero. This means that the reference and optimized images\
    \ are different.\n\nThis would normally be a cause for concern, because this might\
    \ indicate that optimization changed the behavior of the filter. However, a closer\
    \ examination of the filter's source code showed several places where the filter\
    \ would be different, where random noise was used to slightly jitter the image\
    \ before the filter was run. Any two runs of the filter would be different, so\
    \ the optimization was likely not to blame. Because the differences between the\
    \ two images were so visually small, we can assume that the optimization did not\
    \ introduce any problems.\n"
  mdcn: "\n\n## 10.8. 跳转到 Web 端\n\n现在我们已经发现大部分时间都花在了 GIMP 函数上，我们必须准确确定这些函数具体是什么，并可能优化我们的时间。\n\
    \n首先，我们在网络上搜索 `pixel_rgn_get_pixel` 并尝试确定它的功能。在几次尝试无果后，列表 10.11 中的后续链接和信息证实了我们对\
    \ `pixel_rgn_get_pixel` 作用的设想。\n\n# 列表 10.11.\n\n```\n“存在对 pixel_rgn_get_pixel,\
    \ row, col 和 rect 的调用，\n它们从图像中提取\n数据并将其存入你预先分配的缓冲区中。\n相应的对应的 set 调用。请在 gimp.h\
    \ 中查找“Pixel Regions（像素区域）”\n（来自\nhttp://gimp-plugin-ins.sourceforge.net/doc/Writing/html/sect-image.html\
    \ ）\n```\n\n此外，列表 10.12 中的信息表明，避免使用 `pixel_rgn_get_calls` 是一个好主意。\n\n# 列表 10.12.\n\
    \n```\n“注意，这些调用相对缓慢，它们很容易成为你插件中最慢的部分。如果有任何其他方法，请不要使用\npixel_rgn_[get|set]_pixel\
    \ 逐个获取（或设置）像素。”\n（来自\nhttp://www.home-unix.org/simon/gimp/gaud2002/gimp-plugin/html/imagedata.html）”\n\
    ```\n\n在网络上，我们通过直接查看函数的源码，获取了关于 `gimp_rgb_set_uchar` 函数的信息。如列表 10.13 所示，这会将红色和蓝色值重新放回代表单一颜色的\
    \ GimpRGB 结构中。\n\n# 列表 10.13.\n\n```\nvoid\ngimp_rgb_set_uchar (GimpRGB *rgb,\n\
    guchar r,\nguchar g,\nguchar b)\n{\n\tg_return_if_fail (rgb != NULL);\n\trgb->r\
    \ = (double) r / 255.0;\n\trgb->g = (double) g / 255.0;\n\trgb->b = (double) b\
    \ / 255.0;\n}\n```\n\n## 10.9. 增加图像缓存\n\n相关网站解释说 GIMP 管理图像的方式略微反直觉。GIMP 并不是将图像存储在一个大数组中，而是将图像分解一系列瓦片（tiles）。这些瓦片的大小为\
    \ 64x64。当用户想要访问图像的特定像素时，GIMP 会加载相应的瓦片，找到并返回像素值。每次获取像素的调用都可能缓慢。如果对每个像素重复此过程，将极大降低性能，因为\
    \ GIMP 每次都会重新加载瓦片，而不是使用缓存值。幸运的是，GIMP 提供了一种方法来缓存旧瓦片并在每次使用缓存值。这应该会提高性能。GIMP 提供的缓存数量可以通过使用\
    \ `gimp_tile_cache_ntiles` 调用来控制。该调用目前在 `lic` 内部使用，并将缓存设置为图像宽度的两倍。\n\n尽管这看起来缓存已经足够了，但\
    \ GIMP 可能还需要更多。测试此点的简单方法是将缓存增加到一个非常大的值，看看性能是否会提高。因此，在这种情况下，我们将缓存量增加到正常用量的 10 倍。在增加此值并重新运行过滤器后，我们得到了\
    \ 2 分 40 秒的时间。这虽然增加了 6 秒，但我们还没有达到 2 分 30 秒的目标。这说明我们必须从其他领域寻找提高性能的方法。\n\n## 10.10.\
    \ 碰到了（瓦片）瓶颈\n\n除了使用瓦片缓存外，网页还提供了一种提高 `get_pixel` 性能的更好方法。通过直接访问像素信息（而不调用 `gimp_pixel_rgn_get_pixel`），可以大幅提高像素访问的性能。\n\
    \nGIMP 可以为过滤器程序员提供直接访问图像瓦片的方法。这样过滤器就可以像访问数据数组一样访问图像数据，而无需调用 GIMP 库。然而，有一个陷阱：当你直接访问像素数据时，它仅针对当前瓦片。GIMP\
    \ 会遍历图像中的所有瓦片，让你最终能够访问图像中的所有像素，但你无法同时访问所有像素。你只能查看单个瓦片的像素，这与 `lic` 访问数据的方式不兼容。当其过滤器在特定位置生成新像素时，它根据周围像素的值计算新值。因此，在瓦片边缘生成新像素时，`lic`\
    \ 过滤器需要周围所有像素的像素。不幸的是，这些像素可能在图像的上一个瓦片或下一个瓦片上。由于这些像素信息可用，图像过滤器无法使用这种优化访问方法工作。\n\
    \n## 10.11. 解决问题\n\n（由于原文 OCR 存在大量重复和错误，此处为核心逻辑重构翻译）\n\n根据提供的代码块逻辑：\n\n# 列表 10.14.\n\
    \n```\nint g_image_width, g_image_height;\nGimpRGB *cached_image;\n\nvoid cache_image(GimpPixelRgn\
    \ *src_rgn, int width, int height)\n{\n  static guchar data[4];\n  int x, y;\n\
    \  GimpRGB *current_pixel;\n\n  g_image_width = width;\n  g_image_height = height;\n\
    \n  cached_image = malloc(sizeof(GimpRGB)*width*height);\n  current_pixel = cached_image;\n\
    \n  /* Malloc */\n  for (y = 0; y < height; y++)\n    {\n      for (x = 0; x <\
    \ width; x++)\n        {\n          pixel_rgn_get_pixel(src_rgn, x, y);\n    \
    \      gimp_rgba_set_uchar(current_pixel, data[0], data[1], data[2], data[3]);\n\
    \n          current_pixel++;\n        }\n    }\n}\n```\n\n# 列表 10.15.\n\n```\n\
    static void peek(GimpPixelRgn *src_rgn,\n  int x,\n  int y,\n  GimpRGB *color)\n\
    ```\n\n## 10.12. 验证正确性？\n\n在优化显著减少过滤器运行时间后，有必要验证生成的图像是否相同。通过加载原始图像并与生成的图像进行对比，使用\
    \ GIMP 计算两者的差异。如果原始图像和优化后的图像相同，则所有像素都应为 0（黑色）。然而，视觉上看起来是黑色的，但在仔细检查（使用颜色选择器）后，某些像素是非零的。这意味着原始和优化后的图像是不相同的。这通常令人担心，因为这可能表明优化改变了过滤器的行为。然而，对过滤器源码的仔细检查显示，在运行过滤器之前使用了随机噪声对图像进行了抖动处理。由于两个图像之间的差异非常微小，我们可以假设优化没有引入任何问题。\n\
    \n"
