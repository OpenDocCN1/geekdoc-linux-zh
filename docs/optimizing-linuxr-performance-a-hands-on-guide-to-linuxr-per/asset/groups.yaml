    # 9.8. Optimizing Network I/O Usage


    When you know a problem is happening, Linux provides a set of tools to determine
    which applications are involved. However, when you are connected to external machines,
    the fix to a network problem is not always within your control.


    Figure 9-6 shows the steps that we take to investigate a network performance problem.


    ![](img/e2cf6437fe9be84e01517553c4bb6a79_97_0.png)


    To start the investigation, continue to Section 9.8.1.


    # 9.8.1. Is Any Network Device Sending/Receiving Near the Theoretical Limit?


    The first thing to do is use ethtool to determine what hardware speed each Ethernet
    device is set to. If you record this information, you investigate whether any
    of the network devices are saturated. Ethernet devices and/or switches can be
    mis-configured, ethtool shows what speed each Ethernet device is, use iptraf or
    ifconfig to determine the amount of traffic that is flowing over each interface.
    If the network device appears to be saturated, go to Section 9.8.3; otherwise,
    go to Section 9.8.2.


    # 9.8.2. Is Any Network Device Generating a Large Number of Errors?


    Network traffic can also appear to be slow because of a high number of network
    errors. Use ifconfig to determine whether any of the interfaces are generating
    a large number of errors. A large number of errors can be the result of a mismatched
    Ethernet card / Ethernet switch connection. Contact your network administrator,
    search the Web for similar problems, or e-mail questions to one of the Linux networking
    specialists.


    Go to Section 9.9.


    # 9.8.3. What Type of Traffic Is Running on That Device?


    If a particular device is serving a load of data, use iptraf to track down what
    types of traffic that device is sending and receiving. When you know the type
    of traffic that the device is handling, advance to Section 9.8.4.


    # 9.8.4. Is a Particular Process Responsible for That Traffic?


    Next, we want to determine whether a particular process is responsible for that
    traffic. Use netstat -p to switch to see any process is handling the traffic that
    is flowing over the network port.


    If an application is responsible, go to Section 9.8.6. If none are responsible,
    go to Section 9.8.5.


    # 9.8.5. What Remote System Is Sending the Traffic?


    If no application is responsible for this traffic, some system on the network
    may be bombarding you with unwanted traffic. To determine which system is sending
    this traffic, use iptraf or etherpepe.'
