  - '[PAGE 118]


    # 10.9. Increase the Image Cache


    The sites explain that GIMP manages images in a slightly counterintuitive fashion.
    Instead of storing the image in a big array, GIMP instead breaks the image into
    a series of tiles. These tiles are 64x64. When a user wants to access a particular
    pixel of the image, GIMP loads the appropriate tile, and finds and returns the
    pixel value. Each call to retrieve a pixel can be slow. If this process is done
    repeatedly for each pixel, this can dramatically slow down performance as GIMP
    reloads the tile and use the cache values rather than reload the tiles at each
    time. Fortunately, GIMP provides a way to cache the old tiles and use the cache
    values at each time. This should increase performance. The amount of cache that
    GIMP provides can be controlled by using the `gimp_tile_cache_ntiles` call. This
    call is currently used inside `lic` and sets the cache to twice as many tiles
    as the image is wide.


    Even though this might seem like enough cache, the GIMP might possibly still need
    more. The simple way to test this is to increase the cache to a very large value
    and see whether that improves performance. So, in this case, we increase the amount
    of cache to 10 times the amount that is normally used. After increasing this value
    and rerunning the filter, we receive a time of 2 minutes and 40 seconds. This
    is an increase of 6 seconds, but we have not reached our goal of 2 minutes and
    30 seconds. This says that we must look in other areas to increase the performance.'
  - '[PAGE 119]


    # 10.10. Hitting a (Tiled) Wall


    In addition to using the tile cache, the Web pages suggests a better way to increase
    the performance of get_pixel By accessing the pixel information directly (without
    a call to gimp_pixel_rgn_get_pixel), it is possible to dramatically increase the
    performance of the pixel access.


    GIMP can provide a way for the filter programmer to directly access the tiles
    of an image. The filter can then access the image data as if it were accessing
    a data array, instead of requiring a call to a GIMP library. However, there is
    a catch. When you have direct access to the pixel data, it is only for the current
    tile. GIMP will iterate over all the tiles in the image, allowing you to ultimately
    have access to all the pixels in the image, but you cannot access all simultaneously.
    It is only possible to look at the pixels from a single tile, and this is incompatible
    with how lic accesses data. When the its filter is generating a new pixel at a
    particular location, it calculates its new value based on the values of the pixels
    that surround it. Therefore, when generating new pixels on the edge of a tile,
    the lic filter requires pixel data from all the pixels around it. Unfortunately,
    these may be on the previous tile or the next tile in the image. Because this
    pixel information is not available, the image filter will not work with this optimized
    access method.'
