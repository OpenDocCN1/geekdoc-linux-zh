    ## 5.3. Chapter Summary


    This chapter presented the various Linux tools that are available to diagnose
    memory-performance problems. It demonstrated tools that show how much memory an
    application is consuming (ps,/proc) and which functions within the application
    are allocating memory (memprof). It also covered tools that can monitor the cache
    and memory subsystem (cachegrind, kcachegrind and profile). Finally, it described
    a tool that monitors shared memory usage (ipcs). Used together, these tools can
    track every allocation of memory, the size of these allocations, the functional
    locations of the allocations in the applications, and how effectively the application
    is using the memory subsystem when accessing these allocations.


    The next chapter moves away from memory to investigate disk I/O bottlenecks.


    ## Chapter 6. Performance Tools: Disk I/O


    This chapter covers performance tools that help you gauge disk I/O subsystem usage.
    These tools can show which disks or partitions are being used, how much I/O each
    disk is processing, and how long I/O requests issued to these disks are waiting
    to be processed.


    After reading this chapter, you should be able to:


    - Determine the amount of total amount and type (read/write) of disk I/O on a
    system (vmstat).

    - Determine which devices are servicing most of the disk I/O (vmstat, iostat,
    sar).

    - Determine how effectively a particular disk is fielding I/O requests (iostat).

    - Determine which processes are using a given set of files (lsof).


    ## 6.1. Introduction to Disk I/O


    Before diving into performance tools, it is necessary to understand how the Linux
    I/O system is structured. Most modern Linux systems have one or more disk drives.
    If they are IDE drives, they are usually named hda, hdb, hdc, and so on; whereas
    SCSI drives are usually named sda, sdb, sdc, and so on. A disk is typically split
    into multiple partitions, where the name of the partition''s device is created
    by adding the partition number to the end of the base device name. For example
    the first IDE hard drive in the system is usually labeled /dev/hda2. Each individual
    partition usually contains either a file system or a swap partition. These partitions
    are mounted into the Linux root file system, as specified in /etc/fstab. These
    mounted file systems contain the files that applications read to and write from.


    When an application does a read or write, the Linux kernel may have a copy of
    the file stored in its cache or returns the requested information without ever
    accessing the disk. If the Linux kernel does not have a copy of the data stored
    in memory, however, it adds a request to the disk''s I/O queue. If the kernel
    notices that multiple requests are asking for contiguous locations on the disk,
    it merges them into a single big request. This merging increases overall disk
    performance by eliminating the seek time for the second request. The request has
    been placed in the disk queue, if the disk is not currently busy, it starts to
    service the request. If the disk is busy, the request waits in the queue until
    the drive is available, and then it is serviced.


