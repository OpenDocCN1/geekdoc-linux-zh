    \ Fedora 和 Enterprise Linux，Red Hat 提供了一组 `debuginfo rpm`，其中包含了编译器在编译应用程序时生成的符号信息和源代码。每个二进制包或库都有相应的\
    \ `debuginfo rpm`。然而，它允许开发者或调查性能问题的人下载并使用相应的 `debuginfo` 包。在这种情况下，Red Hat 版本的\
    \ `profile` 也会识别 `debuginfo` 包，并在分析应用程序（如 nautilus）和库（如 `gtk`）时获取符号。在这种情况下，我们将下载\
    \ `gtk`、nautilus、glib 和内核的 `debuginfo`。\n\n"
