    | iostat | FC2, EL3, S9 | http://www.debian.fr/sysstat/ |


    ## Appendix B. Installing profile


    The system profiler profile is a powerful performance tool, its installation/use
    can be tricky. This appendix describes some of the issues when installing profile
    on Fedora Core 2 (FC2), Red Hat Enterprise Linux (EL3), and SUSE 9 (S9).


    ### B.1 Fedora Core 2 (FC)


    For FC2, Red Hat provides packages for profile that should be used rather than
    those from the profile site. The uniprocessor kernel does not provide the necessary
    profile drivers. Red Hat packages the necessary kernel modules with the SMP version
    of the kernel. If you want to run profile, you must use SMP kernel even if you
    are running it on a single-processor machine.


    ### B.2 Enterprise Linux 3 (EL3)


    For EL3, once again, Red Hat provides packages for profile that should be used
    rather than those from the profile site. The uniprocessor kernel does not provide
    the necessary profile drivers. Red Hat has the necessary kernel modules with SMP
    or large memory versions of the kernel. If you want to run profile you must use
    SMP or large memory kernel even if you are running it on a single-processor machine.
    More details on using profile in EL3 are provided at http://www.redhat.com/docs/manuals/enterprise/RHEL-3-Manual/sysadmin-guide/profile.html.


    ### B.3 SUSE 9.1


    For SUSE 9.1, SUSE provides packages for profile that should be used rather than
    those from the profile site. All versions of the SUSE kernels (default, SMP, and
    bigSMP) support profile, so any of the supplied kernels will work.


