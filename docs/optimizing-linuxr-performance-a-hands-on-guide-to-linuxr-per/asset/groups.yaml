    # 1.1. General Tips


    # 1.1.1. Take Copious Notes (Save Everything)


    Probably the most important thing that you can do when investigating a performance
    problem is to record everything that you see, every command that you execute,
    and every piece of information that you research. A well-organized set of notes
    allows you to test a theory about the cause of a performance problem by simply
    looking at your notes rather than running tests. This saves a huge amount of time.
    Write it down to create a permanent record.


    When starting a performance investigation, I usually create a directory for investigation,
    open a new "Notes" file in GNU commands, and record performance results in this
    directory and store interesting and relevant pieces of information in the Notes
    file. I suggest that you add the following to your performance investigation file
    and directory:


    +   - Record the hardware/software configuration—This involves recording information
    about the hardware configuration (amount of memory and type of CPU, network, and
    disk subsystem) as well as the software environment (the OS and software versions
    and the relevant configuration files). This information may seem early, but when
    tracking down a problem, you may significantly change a system''s configuration.
    Careful and meticulous notes can be used to figure out the system''s configuration
    at a particular test.


    Save the output of `cat /proc/pci, dmesg, and uname -a` for each test.


    +   - Save and organize performance results—This can allow you to review results
    a long time after you run them. Record the results of a test with the configuration
    of the system. This allows you to compare how different configurations affect
    the performance results. It would be possible just to rerun the test if needed,
    but usually testing a configuration is time-consuming process. It is more efficient
    to keep your notes well organized and avoid repeating work.


    +   - Write down the command-invocations—As you run performance tools, you will
    often create complicated and complex commands that measure the areas of the system
    you are interested in. If you want to rerun a test, or run it on a different application,
    reproducing these commands can be annoying and hard to do right on the first try.
    It is better to record exactly what you used. You can then reproduce the exact
    command line for a future test, and when reviewing past results, you can also
    see exactly what you measured. The Linux command `script` (described in detail
    in Chapter 8, "Utility Tools: Performance Tool Helpers") or "cut and paste" from
    a terminal is a good way to do this.


    +   - Record information and URLs—As you investigate a performance problem, it
    is important to record relevant information you found on the Internet, through
    e-mail, or through personal interactions. If you find a Web site that seems relevant,
    cut and paste the text into your notes. (Web sites can disappear.) However, also
    save the URL, because you might need to review the page later or the page may
    point to information that becomes important later in an investigation.


    As you collect all this information, you may wonder why it is worth the effort.
    Some information may seem useless or misleading, but it might be useful in the
    future. (A good performance investigation is like a good detective story: The
    clues are confusing at first, everything comes in the end.) Keep the following
    in mind as you investigate a problem:


    The implications of results may be fuzzy—It is not always clear what a performance
    tool is telling. At a later point, you might look back at seeing useless results
    in a test. The new information may help you disprove or prove a theory about the
    nature of the performance.'
