    ## 13.4. Chapter Summary


    In this chapter, we investigated a few of the areas where the set of Linux performance
    tools has shortcomings and proposed some ideal solutions. We also discussed why
    Linux is a good platform on which to try performance investigation and optimization.


    It is up to you, the reader, to change Linux performance for the better. The opportunities
    for improvement of Linux performance and Linux performance tools abound. If you
    find a performance problem that annoys you, fix it or report it to the developers
    and work with them to fix it. Either way, no one else will be hit by the problem,
    and the entire Linux community benefits.


    ## Appendix A. Performance Locations


    The performance tools described in this book originated from many locations on
    the Internet. Fortunately, most distributions have pulled them together and included
    them in the current versions of their distributions. Table-1 describes all the
    tools, provides pointers to their original locations, and indicates whether they
    are included in the following distributions: Fedora Core 2 (FC2), Red Hat Enterprise
    Linux (EL3), and SUSE 9 (S9).


    ### Table A-1. Locations of Performance Tools


    | Tool | Distro | Source Location |

    | :--- | :--- | :--- |

    | bash | FC2, EL3, S9 | http://www.kernel.org/~bash/bash.html |

    | etherape | None | http://sourceforge.net/etherape/ |

    | tool | FC2, EL3, S9 | http://sourceforge.net/projects/kernel/ |

    | proc | FC2, EL3, S9 | http://sourceforge.net/procps/ |

    | gcc | FC2, EL3, S9 | http://gnu.org/ |

    | gdb | FC2, EL3, S9 | http://sources.redhat.com/gdb/ |

