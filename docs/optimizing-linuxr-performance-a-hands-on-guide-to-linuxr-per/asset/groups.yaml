    # 12.4. Configure the Application for the Performance Hunt


    The next step in the investigation is to set up the application for the performance
    hunt. prelink is a small and self-contained application. In fact, it does not
    even use shared libraries (it is statically linked). However, it is a good idea
    to recompile it with all the symbols so that we can examine it in the debugger(gdb)
    if we need to. Again, this uses the configure command to generate the makefiles.
    We must download the source to prelink and recompile it with symbols. We can once
