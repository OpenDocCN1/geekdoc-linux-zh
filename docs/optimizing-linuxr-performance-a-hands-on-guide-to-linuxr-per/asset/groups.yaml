    ## 第 1 章 性能查找技巧


    在没有远见规划的情况下解决问题是痛苦的。你会浪费时间，并不断感到于问题原因反复从指间溜走。通过遵循正确的程序，你可以将一次沮丧的性能查找转化为一个有趣的侦探故事。每一条信息都让你更接近真魁祸首。人并不总是值得信赖，证据将是你唯一的朋友。当你调查问题时，它会经历不同常的转折，你在查找初期发现的信息可能就是你最终解决问题的关键。最棒的部分是，当你最终抓住“坏人”并解决问题时，你会感到一种肾上腺素飙升的快感和成就感。


    没有预见和规划地解决问题是痛苦的。你会浪费时间，并不断感到问题原因反复流失。通过遵循正确的程序，你可以将一次沮丧的性能查找转化为一个有趣的侦探故事。每一条信息都让你更接近真魁祸首。人并不总是值得信赖，证据将是你唯一的朋友。当你调查问题时，它会经历不同寻常的转折，你在查找初期发现的信息可能就是你最终解决问题的关键。最棒的部分是，当你最终抓住“坏人”并解决问题时，你会感到一种肾上腺素飙升的快感和成就感。


    如果你从未调查过性能问题，起步可能会无所适从。通过遵循一些显而易见和不易的技巧，你可以节省时间。本章的目标是为你提供帮助查找性能问题的系列技巧和指南。这些都是从浪费时间换来的深刻教训。这些技巧将帮助你快速解决性能问题。


    阅读本章后，你应该：


    - 避免重复他人的工作

    - 避免重复自己的工作

    - 避免因收集信息产生误导

    - 创建一份关于你调查的有用参考文档


    尽管没有任何性能调查是完美的（你几乎总是说“如果我早点想到就好了”），但这些技巧可以帮你避免性能调查中的常见错误。


    ### 1.1 通用技巧


    ### 1.1.1. 详尽记录（保存一切）


    在调查性能问题时，你可能做的最重要的事情就是记录你看到的一切。一组组织良好的笔记允许你比较配置如何影响性能。虽然可以重新测试，但测试配置通常是非常耗时的。


    - 记录硬件/软件——这涉及记录硬件（内存大小、CPU 类型、网络、磁盘）以及软件环境（操作系统和版本）。这些信息早期看起来可能无关，但在追踪问题时，你可能会更改配置。保存
    `cat /proc/pci`、`dmesg` 和 `uname -a` 的输出。


    - 保存并组织性能结果——这允许你在运行很久之后回顾结果。保持笔记有序并避免重复更为高效。


    - 记录命令——当你运行性能工具时，你经常会创建测量你感兴趣区域的复杂命令。如果你想重新运行测试，或在不同的应用程序上运行，重现这些命令可能会非常麻烦且难以完成。最好记录下使用的具体内容。这样你可以在未来的测试中重现准确的命令行，回顾过去的结果时也能看到具体测量了什么。Linux
    命令 `script`（在第 8 章“实用工具：性能工具助手”中详细描述）或从终端“剪切和粘贴”都是实现此操作的好方法。


