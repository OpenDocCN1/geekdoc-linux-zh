    # 2.2. Linux Performance Tools: CPU


    Here begins our discussion of performance tools that enable you to extract information
    previously described.


    # 2.2.1. vmstat (Virtual Memory Statistics)


    vmstat stands for virtual memory statistics, which indicates that it will give
    you information about the virtual memory system performance of your system. Frankly,
    it does much more than that. vmstat is a great command to get a rough idea of
    how your system performs as a whole. It tells you


    +   - How many processes are running

    - How the CPU is being used

    - How many interrupts the CPU receives

    - How many context switches the scheduler performs


    It is an excellent tool to get a rough idea of how the system performs.


    # 2.2.1.1 CPU Performance-Related Options


    vmstat can be invoked with the following command:


    ```

    vmstat [-n] [-s] [delay [count]]

    ```


    vmstat can run in two modes: sample mode and average mode. If no parameters are
    specified, vmstat runs in average mode, where vmstat displays the average for
    all the statistics since system boot. However, if a delay is specified, the first
    will samples every few seconds and reports out the statistics. Table 2-1 describes
    the options that vmstat accepts.


    # Table 2-1. vmstat Command-Line Options


    | Column | Explanation |

    |---|---|

    | -n | By default, vmstat periodically prints the column headers for each performance
    statistic. This option disable feature that after the initial header, only performance
    data displays. This proves helpful if you want to import the output of vmstat
    to a spreadsheet. |

    | -s | This displays a one-shot details of system statistics vmstat gathers. The
    statistics are all the statistics since system booted. |

    | delay | This is the amount of time between vmstat samples. |


    vmstat provides a variety of different output statistics that enable you to track
    different aspects of the system performance. Table 2-2 describes those related
    to CPU performance. The next chapter covers those related to memory performance.


    # Table 2-2. CPU-Specific vmstat Output'
