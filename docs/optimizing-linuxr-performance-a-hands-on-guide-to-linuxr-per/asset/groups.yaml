  - "[PAGE 38]\n\n# 3.1. Memory Performance Statistics\n\nEach-wide Linux performance\
    \ tool provides different ways to extract similar statistics. Although no tool\
    \ displays all the statistics, some of the tools display the same. The beginning\
    \ of this chapter reviews the details of these statistics, and those descriptions\
    \ are then referred as the tools described.\n\n# 3.1.1. Memory Subsystem and Performance\n\
    \nIn modern processors, saving information and retrieving information from the\
    \ memory subsystem usually takes the CPU executing code and manipulating that\
    \ information. The CPU usually spends a significant amount of idle time, waiting\
    \ for instructions and data to be retrieved from memory before it execute or operate\
    \ on them. Processors have varying levels of cache to compensate for the slow\
    \ memory performance. Tools such as profile can show where various processor cache\
    \ misses occur.\n\n# 3.1.2. Memory Subsystem (Virtual Memory)\n\nAny Linux system\
    \ has a certain amount of RAM or physical memory. When addressing this physical\
    \ memory, Linux breaks it into chunks or \"pages\" of memory. When allocating\
    \ or moving around, Linux operates on page-sized blocks rather than individual\
    \ bytes. When reporting some memory statistics, the Linux kernel reports the number\
    \ of pages per second, and this value can vary depending on the architecture it\
    \ is running on. Listing 3.1 creates a small application that displays the number\
    \ of bytes per page for the current architecture.\n\nListing 3.1.\n\n```\n#include\
    \ <unistd.h>\nint main(int argc, char *argv[])\n{\n    printf(\"System page size:\
    \ %d\\n\", getpagesize());\n}\n```\n\nOn the IA32 architecture, the page size\
    \ is 4KB. In rare cases, page-sized chunks of memory can cause too much overhead,\
    \ to which the kernel manages memory in bigger chunks, known as HugePages. These\
    \ are on the order of 2048KB larger than 4KB and greatly reduce the overhead for\
    \ managing large amounts of memory. Applications, such as Oracle, use these huge\
    \ pages to manage it. If HugePages are not completely filled with data, these\
    \ can waste a significant amount of memory. A half-filled normal page wastes 2KB\
    \ of memory, whereas a half-filled HugePage can waste 1,024KB of memory.\n\nThe\
    \ Linux kernel can scatter a collection of these physical pages and present to\
    \ applications a well-laid virtual memory space.\n\n# 3.1.2.1 Swap (Not Enough\
    \ Physical Memory)\n\nAll systems have a fixed amount of physical memory in the\
    \ form of RAM chips. The Linux kernel allows applications to run if they require\
    \ more memory than available with the physical memory. The Linux kernel uses the\
    \ hard drive as temporary memory. This hard drive is called swap space.\n\nAlthough\
    \ swap is an excellent way to handle processes, it is truly slow. It can be up\
    \ to 1000 times slower to swap rather than physical memory. If a system is performing\
    \ poorly, it may help to determine how much swap your system is using.\n\n# 3.1.2.2\
    \ Buffers and Cache (Too Much Physical Memory)"
