    由于我们调查的是系统级问题，原因可能从应用程序到系统库再到内核。幸运的是，Linux 与许多操作系统不同，你可以获取系统上大部分应用程序的信息。如果必要，可以修复问题并提交给维护者。在最坏的情况下，你可以运行本地版本。这是开源软件的。


    图 9-2 显示了我们处理系统级问题的流程图。


    图 9-2.


    跳转到 9.4.1 节开始调查。


    ### 9.4.1. 是否 CPU 密集？


    使用 `top` 或 `mpstat` 确定时间花费在哪里。如果整个系统在空闲和等待模式下的时间小于 5%，则系统是 CPU 密集的。跳转到第 9.4.3。否则，跳转到
    9.4.2。


    ### 9.4.2. 是否单处理器 CPU 密集？


    虽然整个系统可能不是 CPU 密集，但在对称多处理 (SMP) 或超线程系统中，单个处理器可能是 CPU 密集。


    使用 `top` 或 `mpstat` 确定单个 CPU 在空闲和等待模式下的时间是否小于 5%。如果是，则更多 CPU 是 CPU 密集；在这种情况下，跳转到
    9.4.4。


    否则，CPU 是 CPU 密集。跳转到 9.4。


    ### 9.4.3. 是否一个或多个进程使用了大部分系统 CPU？


    下一步是确定某个特定的应用程序或应用程序组在使用 CPU。最简单的方法是运行 `top`。默认情况下，`top` 按使用 CPU 的情况降序排列。`top`报告的进程
    CPU 使用率为用户时间和系统时间的和。例如，如果应用程序在用户空间花费了 20% 的 CPU，在系统空间花费了 30%，`top` 将报告该进程消耗了 50%
    的 CPU。汇总所有时间。如果这显著小于系统整体比例，则是内核在执行非应用程序的工作。


    否则，跳转到 9.4.3（上下文建议 9.4.4，但保留逻辑）或跳转到识别进程的位置。


    ### 9.4.4. 是否一个或多个进程使用了大部分系统 CPU？


    下一步是确定某个特定的应用程序或应用程序组在使用系统 CPU。最简单的方法是运行 `top`。默认情况下，`top` 按使用 CPU 的情况降序排列。`top`报告的进程
    CPU 使用率为用户时间和系统时间的和。例如，如果应用程序在用户空间花费了 20% 的 CPU，在系统空间花费了 30%，`top` 将报告该进程消耗了 50%
    的 CPU。汇总所有时间。如果这显著小于系统整体比例，则是内核在执行非应用程序的工作。


    否则，跳转到 9.4.3（上下文建议 9.4.5）或跳转到识别进程的位置。


    ## 9.5. 优化进程使用


    当确定某个特定进程是瓶颈时，有必要确定它花费时间在哪里以及为什么。


    图 9-3 显示了调查进程使用的方法。


    图 9-3.


    跳转到 9.5.1 节开始调查。


    ### 9.5.1. 进程是在用户还是内核空间花费时间？


    你可以利用时间确定应用程序是在内核还是用户空间花费时间。进程级别的分析显示了时间花费在哪里。


    如果应用程序在内核空间花费了大量时间（大于 25%），跳转到 9.5.2。否则，跳转到 9.5.3。


    ### 9.5.2. 进程正在哪些系统调用？完成需要多久？


    接下来，使用 `trace` 查看执行了哪些系统调用以及它们需要多长时间。你还可以运行 `profile` 查看正在执行哪些内核调用。通过减少系统调用的次数或更改代表程序生成的系统调用，可能提高性能。某些调用可能是意外之外的，应用程序调追踪会有帮助。


    ### 9.5.3. 进程在哪些函数中花费时间？


    接下来在应用程序周期上运行 `profile`，确定哪些函数在使用所有的 CPU 周期（即哪些函数消耗了应用程序时间）。


    请记住，分析显示了进程中花费了多少时间，函数级别的分析并不清楚一个函数热是因为调用非常频繁，还是因为完成需要很长时间。


    确定哪种情况真实的方法之一是使用 `profile` 的源码注释，并寻找应该只有少量开销的指令/源行（如赋值）。我们得到的样本数量相对于其他高成本源的被调用函数数量。这只是近似，因为
    `profile` 只对 CPU 采样，且乱序执行可能会掩盖某些问题。


    调用函数图来确定热函数是如何被调用的也有帮助。要做到这一点，请看章节 9.5.4。


    ### 9.5.4. 热函数的调用树是什么？


    接下来，你可以找到耗时函数是如何被调用的。使用 `gprof` 运行应用程序可以显示函数的调用树。如果耗时函数在库中，你可以使用 `trace` 查看。最后，你可以使用较新版本的
    `profile`


    '
