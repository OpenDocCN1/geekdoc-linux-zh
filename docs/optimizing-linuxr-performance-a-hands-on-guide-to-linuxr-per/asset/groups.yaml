    ## 12.10. Chapter Summary


    In this chapter, we started with a misbehaving system and used performance tools
    to pinpoint which subsystem was used excessively (the disk subsystem was shown
    by `vmstat`) and which component caused the problem (prelink). We then investigated
    the prelink application to determine why it used so much I/O (using strace). We
    discovered in prelink''s cached mode that it should dramatically reduce disk I/O.
