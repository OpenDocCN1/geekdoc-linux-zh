    \ 以平均模式运行，此时 vmstat 将显示自系统启动以来所有统计数据的平均值。然而，如果指定了延迟（delay），则第一部分将每隔几秒进行一次采样并报告统计数据。表\
    \ 2-1 描述了 vmstat Accept的选项。\n\n#### 表 2-1. vmstat 命令行选项\n\n| 列 | 解释 |\n|---|---|\n\
    | -n | 默认情况下，vmstat 定期打印每个性能统计的列头。此选项禁用了在初始表头后仅显示性能数据的功能。如果你想将 vmstat 的输出导入电子表格，这证明非常有帮助。\
    \ |\n| -s | 这显示 vmstat 收集的系统统计数据的单次详情。这些统计是自系统启动以来的所有统计数据。 |\n| delay | 这是 vmstat\
    \ 采样之间的时间间隔。 |\n\nvmstat 提供了各种输出统计数据，允许你跟踪系统性能的不同方面。表 2-2 描述了与 CPU 性能相关的统计。下一章将介绍与内存性能相关的内容。\n\
    \n#### 表 2-2. CPU 特定的 vmstat 输出\n\n## 2.3. 本总结\n\n本章重点关注 CPU 使用率的系统级性能指标。这些指标主要展示了操作系统和机器的行为，而不是特定的应用程序。\n\
    \n本章演示了如何使用 sar 和 vmstat 等性能工具从运行中的系统中提取这些系统级性能信息。这些工具是诊断系统问题的第一道防线。它们有助于确定系统的运行情况以及哪些子系统或应用程序可能特别压力。下一章将关注系统级性能工具，这些工具允许你分析整个系统的内存使用。\n\
    \n## 第 3 章 性能工具：系统内存\n\n本章涵盖了系统级 Linux 内存性能工具。本章讨论了这些工具可以测量的内存统计数据，以及如何使用各个工具收集这些统计数据。阅读本章后，你应该：\n\
    \n- 理解系统级性能的基本指标，包括内存使用\n- 理解哪些工具可以检索系统级内存性能指标\n\n### 3.1. 内存性能统计\n\n系统级 Linux\
    \ 性能工具提供了不同的方式来提取类似的统计数据。虽然没有工具能显示所有统计数据，但某些工具显示的是相同的。本章开头回顾了这些统计数据的细节，随后这些描述将被引用为所述的工具。\n\
    \n### 3.1.1. 内存子系统与性能\n\n在现代处理器中，从内存子系统中保存和检索信息通常需要由 CPU 执行代码并操纵这些信息。CPU 通常花费大量的空闲时间，等待从内存中检索指令和数据，然后对其进行执行或操作。处理器具有不同级别的缓存，以补偿缓慢的内存性能。如\
    \ profile 等工具可以显示各种处理器缓存缺失发生的位置。\n\n### 3.1.2. 内存子系统（虚拟内存）\n\n任何 Linux 系统都具有一定量的\
    \ RAM 或物理内存。在对这些物理内存进行地址时，Linux 将其划分为内存块或“页”（pages）。在分配或移动时，Linux 操作的是页大小的块，而不是单个字节。在报告某些内存统计数据时，Linux\
    \ 内核报告每秒的页数，该值取决于其运行的架构。代码列表 3.1 创建了一个小型应用程序，显示当前架构下每页的字节数。\n\n代码列表 3.1：\n\n```c\n\
    #include <unistd.h>\nint main(int argc, char *argv[])\n{\n    printf(\"System\
    \ page size: %d\\n\", getpagesize());\n}\n```\n\n在 IA32 架构上，页大小为 4KB。在某些情况下，页大小的内存块会导致过大的开销，内核使用更大的块来管理内存，被称为\
    \ HugePages（大页）。这些页比 4KB 大 2048KB，并极大减少了管理大量内存的开销。像 Oracle 这样的应用程序使用这些大页来管理内存。如果\
    \ HugePages 没有被数据完全填充，可能会浪费大量的内存。一个半满普通页浪费 2KB 内存，而一个半满 HugePage 可以浪费 1,024KB\
    \ 内存。\n\nLinux 内核可以散布这些物理页，并向应用程序呈现一个布局良好的虚拟内存空间。\n\n#### 3.1.2.1 Swap（物理内存不足）\n\
    \n所有系统都具有一定量的 RAM 或物理内存。Linux 内核允许应用程序在所需内存超过可用内存时使用硬盘作为临时内存来运行。这个硬盘被称为交换空间（swap\
    \ space）。虽然交换是处理进程的一种极方法，但它真的非常慢——比物理内存慢 1000 倍。它可以帮助确定你的系统使用了多少交换空间。\n\n####\
    \ 3.1.2.2 Buffers 和 Cache（物理内存过多）\n\n## 3.2. Linux 性能工具：CPU 和内存\n\n开始讨论性能工具，这些工具允许你提取之前描述的信息。\n\
    \n### 3.2.1. vmstat (虚拟内存统计) II\n\n如你之前看到的，vmstat 可以提供关于许多不同性能方面的信息——尽管它的主要目的（如下所示）是提供有关虚拟内存系统性能的信息。除了上一章描述的\
    \ CPU 统计数据外，它还可以告诉你：\n\n- 使用了多少交换空间\n- 物理内存是如何被使用的\n- 多少空闲内存\n\n### 3.2.1.1 系统级内存相关选项\n\
    \n除了 vmstat 可以提供的 CPU 统计数据外，在调查内存统计时，可以使用命令行选项调用 vmstat：\n\n```\nvmstat [-a] [-s]\
    \ [-m]\n```\n\n与之前一样，你可以以两种模式运行 vmstat：采样模式和平均模式。新增的命令行选项允许你获取关于 Linux 内核使用内存的性能统计。表\
    \ 3-1 描述了 vmstat Accept的选项。\n\n#### 表 3-1. vmstat 命令行选项\n\n| 选项 | 解释 |\n|---|---|\n\
    | -a | 这更改内存统计的默认输出，指示活动/非内存内存，而不是缓冲区和缓存的使用信息 |\n| -s (procps) | 这打印 vm 表。这是自系统启动以来统计数据包。它不能在采样模式下运行。它包含内存和\
    \ CPU 统计数据。 |\n| -m (procps) | 这打印内核的 slab 信息。这与通过输入 cat/proc/slabinfo 获取的信息相同。这详细描述了内核内存是如何分配的。\
    \ |\n\n表 3-2 提供了 vmstat 可以提供的内存统计数据列表。结合 CPU 统计数据，在普通模式下运行时，vmstat 的第一行提供了所有速率统计数据（so\
    \ 和 i）的平均值，以及所有数值统计数据（swpd, free, buff, cache, active 和 inactive）的瞬时值。\n\n"
