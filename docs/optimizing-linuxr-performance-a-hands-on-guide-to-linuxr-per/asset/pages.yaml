  md: '# 11.6. Run Application and Performance Tools


    Next, we run the application and take measurements using the performance tools.
    Because we already suspect that a complex interaction of many processes and libraries
    might be the cause of the problem, we are going to start with profile and see
    what it has to show.


    Because we only want profile to measure events when we are opening the pop-up
    menu, we are going to use the command line shown in Listing 11.3 to start and
    profile the profiling immediately before and after we run our script (script.sh)
    that opens and closes 100 pop-up menus.


    # Listing 11.3.


    ```

    opcontrol -start ; ./script.sh opcontrol -stop

    ```


    Running oreport after profiling has been collected gives us the information shown
    in Listing 11.4.


    # Listing 11.4.


    ```

    CPU: CPU with timer interrupt, speed 0 MHz (estimated)

