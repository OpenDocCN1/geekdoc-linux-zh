- pgno: 53
  md: '# 5.2. Memory Performance Tools


    This examines the various memory performance tools that enable you to investigate
    how a given application is using the memory subsystem, including the amount and
    different types of memory that a process is using, when it is being allocated,
    and how effectively the process is using the processor''s cache.


    # 5.2.1. ps


    ps is an excellent command to track a process''s dynamic memory usage. In addition
    to the CPU statistics already mentioned, ps gives detailed information about the
    amount of memory that the application is using and how that memory usage affects
    the system.


    # 5.2.1.1 Memory Performance-Related Options


    ps has many options and can retrieve many statistics about the state of a running
    application. As you have seen in the previous chapter, ps can retrieve information
    about the CPU that a process is using, but it can also retrieve information about
    the amount and type of memory that a process is using. It can be invoked with
    the following command line:


    ```

    [-o vssz,rss,tsiz,dsiz,majflt,minflt,pmem,command] <PID>

    ```


    Table 5-1 describes the different types of memory statistics that ps can display
    for a given PID.


    # Table 5-1. ps Command-Line Options


    | Option | Explanation |

    | - | - |

    | -statistic | Enables to specify exactly what process statistics you want to
    track. The different statistics are specified in a comma-separated list with no
    spaces. |

    | vssz | Static: The virtual size is the amount of virtual memory that the application
    is using. Because Linux only allocates physical memory when an application tries
    to use it, its value may be greater than the amount of physical memory the application
    is using. |

    | rss | Static: The resident size is the amount of physical memory the application
    is currently using. |

    | tsiz | Static: Text size is the virtual size of the program code. Once again,
    this isn''t the physical size but rather the virtual size; however, it is a good
    indication of the size of the program. |

    | dsiz | Static: Data size is the virtual size of the program''s usage. This is
    a good indication of the size of the data structures and stack of the application.
    |

    | majflt | Static: Major faults are the number of page faults caused Linux to
    read from disk of. This may happen if the process accessed a piece of data or
    instruction that was on disk and Linux loaded it seamlessly for the application.
    |

    | minflt | Static: Minor faults are the number of faults that Linux could fulfill
    without resorting to a disk read. This might happen if the application touches
    a piece of memory that has been allocated by the Kernel. In this case, it is not
    necessary to go to disk |'
  merge: -1
