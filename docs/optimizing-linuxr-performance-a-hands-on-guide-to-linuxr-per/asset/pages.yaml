- pgno: 168
  md: '# 13.1. The State of Linux Tools


    This book tours the current Linux performance tools, how to use them individually,
    and how to use them together to solve performance problems. As with every aspect
    of Linux, these performance tools are constantly evolving, so when investigating
    a problem, it is always a good idea to review the man page or documentation of
    a performance tool to determine whether its usage has changed. The fundamental
    functions of the performance tools rarely change, but new features are commonly
    added, so it is helpful to review the latest release notes and documentation for
    a given tool.'
