- pgno: 155
  md: '# 12.5. Install and Configure Performance Tools


    The next step in the hunt is to install the performance tools. In this case, neither
    ltrace nor profile will be of help. profile is used to profile applications that
    use a significant amount of CPU time, and because preload uses only about 3 percent
    of the CPU when running, profile will not help us. Because the preload binary
    is statically linked and does not use any shared libraries, ltrace will also not
    help us. However, strace, the system call tracer, may help, so we need to install
    that.'
