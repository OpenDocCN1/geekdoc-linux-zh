- pgno: 110
  md: '# 10.6. Run Application and Performance Tools


    Next, we run the application and take measurements using the performance tools.
    Because the lic filter is called directly from the GIMP, we have to use tools
    to catch and monitor an already running process.


    In case of profile, we can start profile, run the filter, and then stop profile
    after the filter has been completed. The lic filter takes approximately 90 percent
    of the CPU when running, the system-wide collects will be mainly relevant for
    the lic. When lic starts, we start profile in another window; when lic finishes
    in that window, we stop profile. The starting and stopping of profile is shown
    in Listing 10.4.


    Listing 10.4.


    ```

    [root@localhost ezolt]# opcontrol --start

    [root@localhost ezolt]# opcontrol --dump

    [root@localhost ezolt]# opcontrol --stop

    Stpping running.

    ```


    ltrace must be run a little differently. After the filter has been shown, ltrace
    can be attached to the running process. Unlike, attaching ltrace to a process
    brings the process to a crawl. This can accurately inflate the amount of time
    taken for each library call; however, it provides information about the number
    of times each call made. Listing 10.5 shows a listing from ltrace.


    Listing 10.5.


    ```

    [ezolt@localhost ktracer]# ltrace -p 32744 -c

    % time seconds use/calls calls function

    43.61 156.41950 254 614050 rint

    16.04 57.522491 281 204684 gimp_rgb_to_hsl

    14.92 53.513609 261 204684 g_rand_double_range

    13.88 49.793988 243 204684 gimp_rgba_set_uchar

    11.55 41.26679 202 204684

    gimp_pixel_rgb_get_pixel

    0.00 0.0006287 6287 1 gtk_widget_destroy

    0.00 0.0003702 3702 1 g_rand_new

    0.00 0.0006333 3633 1 gimp_progress_init

    0.00 0.001915 1915 1 gimp_drawable_get

    0.00 0.001271 1271 1 1

    gimpimp_drawable_mask_

    0.00 0.000208 208 1 g_malloc

    0.00 0.000110 110 1 gettext

    0.00 0.000096 96 1 gimp_pixel_rgn_init

    100.00 358.639437 1432794 total

    ```


    To get the full list of library calls, it is possible to let ltrace run until
    completion; however, it takes a really long time, so in this case, we pressed
    <Ctrl-C> after a period of time elapsed. This worked because an application may
    go through different stages of execution, and if it stops early, you may not get
    a complete picture of what functions the application is calling. However, this
    short sample will give us a starting point for analysis.'
  merge: -1
