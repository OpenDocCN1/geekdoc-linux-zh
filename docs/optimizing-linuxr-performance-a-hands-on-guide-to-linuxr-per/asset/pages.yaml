  md: '# 9.5. Optimizing Process CPU Usage


    When a particular process or application has been determined to be a CPU bottleneck,
    it is necessary to determine where (and why) it is spending its time.


    Figure 9-3 shows the method for investigating a process CPU usage.


    Figure 9-3.


    Go to Section 9.5.1 to begin the investigation.


    # 9.5.1. Is the Process Spending Time in User or Kernel Space?


    You can use the time to determine whether an application is spending its time
    in kernel or user mode. profile can also be used to determine where the time is
    spent. By profiling per process, it is possible to see where a process is spending
    time in the kernel or user space.


    If the application is spending a significant amount of time in kernel space (greater
    than 25 percent), go to Section 9.5.2. Otherwise, go to Section 9.5.3.


    # 9.5.2. Which System Calls Is the Process Making, and How Long Do They Take to
    Complete?


    Next, trace to see which system calls are made and how long they take to complete.
    You can also run profile to see which kernel calls are being called.


    It may be possible to increase performance by minimizing the number of system
    calls made or changing system calls made on behalf of the program. Some of the
    calls may be unexpected and a trace of the application''s calls. You can use ltrace
    and str to determine where they are being made.


    Now that the problem has been identified, it is up to fix it. Go to Section 9.9.


    # 9.5.3. In Which Functions Does the Process Spend Time?


    Next run profile on the application cycle event to determine which functions are
    using all CPU cycles (that is, which functions are spending the application time).


    Keep in mind that profiling shows how much time was spent in process, profiling
    at the function level, is not clear whether a function is hot because it is called
    very often or whether it takes a long time to complete.


    One way to determine which case is true is use a source-level annotation from
    profile and look for instructions/source lines that should have little overhead
    (as assignments). The number of samples that we will the number of functions that
    was called relative to other high-cost sources Lines. This is only approximate
    because profile samples only the CPU, and out-of-order processes can miscarry
    some issues.


    It is also helpful to call a graph of functions to determine how the hot functions
    are being called. To do this, go Section 9.5.4.


    # 9.5.4. What Is the Call Tree to the Hot Functions?


    Next, you can find how the time-consuming functions are being called. Running
    the application with gprof can show the call tree for function. If the time-consuming
    functions are in a library, you can use trace to see which. Finally, you can use
    newer versions of profile'
