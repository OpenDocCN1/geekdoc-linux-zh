  md: '# 9.6. Optimizing Memory Usage


    Often, it is common that a program that uses a large amount of memory can cause
    other performance problems to occur, such as cache misses, translation lookaside
    buffer (TLB) misses, and swapping.


    Figure 9-4 shows the flowchart of decisions that we will make to figure out how
    the system memory is being used.


    Figure 9-4.


    Go to Section 9.6.1 to start the investigation.


    # 9.6.1. Is the Kernel Memory Usage Increasing?


    To track down when using the system''s memory, you first have to determine whether
    the kernel itself is allocating memory. Run `slabtop` and see the total of the
    kernel''s memory is increasing. If it is increasing, jump to Section 9.6.2.


    If the kernel''s memory usage is not increasing, it may be a particular process
    causing the increase. To track down which process is responsible for the increase
    in memory usage, go to Section 9.6.3.


    # 9.6.2. What Type of Memory Is the Kernel Using?


    If the kernel''s memory usage is increasing, again run `slabtop` to determine
    what type of memory the kernel is allocating. The name of the slab can give some
    indication about why the memory is being allocated. Through web searches, By searching
    the kernel source for the name of slab and determining which subsystem it is used
    in, it may become clear why it is allocated. After you determine which subsystem
    is allocating all that memory, try to tune the amount of maximum memory that particular
    subsystem can consume, or reduce the usage of that subsystem.


    Go to Section 9.9.


    # 9.6.3. Is a Particular Process''s Resident Set Increasing?


    Next, you can use `top` or `ps` to see whether a particular process''s resident
    set size is increasing. It is easy to add `rss` to the field of output of `top`
    and sort by what type of memory is used. If a particular process is increasingly
    using memory, for what the application is using, go to Section 9.6.6. If no particular
    process is using more, go to Section 9.6.4.


    # 9.6.4. Is Shared Memory Usage Increasing?


    Use `ipcs` to determine whether shared memory is being used. If it is, go to Section
    9.6.5 to determine which processes are using the memory. Otherwise, have a system
    memory leak not covered in this. Go to Section 9.9.


    # 9.6.5. Which Processes Are Using the Shared Memory?


    Use `ipcs` to determine processes processes are using shared memory. After the
    processes that use the shared memory have been identified, investigate the individual
    processes to determine why the memory is being used for each. For example, look
    in the application''s source code for calls to `shmget` and `shmat` (to attach
    to it). Read the application documentation and look for options that can reduce
    the usage of shared memory.


    To reduce shared memory usage and go to Section 9.9.'
  merge: -1
