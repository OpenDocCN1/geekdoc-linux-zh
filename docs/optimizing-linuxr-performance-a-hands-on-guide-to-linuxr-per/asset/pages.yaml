- pgno: 147
  md: '# # 11.11. Chapter Summary


    In this chapter, we determined why a particular component of an application had
    high latency (pop-up menus in nautilus). We figured out how to automate the creation
    of the pop-up menus (xautomer) and extend the amount of time that nautilus spent
    creating pop-up menus (100 iterations). We used `profile` to figure out in which
    function nautilus was spending all of its time. We then used `trace` and `gdb`
    to determine which shared library calls were responsible for making all the calls.
    After we figured out which library calls were high cost, we tried to reduce or
    limit the number of times they were called. In this case, we stored a pointer
    to a new menu when it was allocated and used it later to avoid unneeded reloads.
    We created a proposed patch and then ran our performance test against it to see
    whether improved. Performance improved, and functionality did not appear to be
    affected. The next step is to submit the patch to the nautilus developers for
    comment. Whereas this chapter focused on optimizing a single application''s latency,
    the next chapter presents a performance hunt that concentrates on solving a system-level
    performance problem. This type of hunt can often involve many different areas
    of the system, including hardware (disk, network, and memory) and software (applications,
    shared libraries, and the Linux kernel).'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # Chapter 12. Performance Hunt 3: The System-Wide Slowdown (prelink)


    This chapter contains an example of how to use the Linux performance tools to
    find and fix a performance problem that affects the entire system rather than
    a specific application.


    After reading this chapter, you should be able to


    +   - Track down which individual process is causing the system to slow down.

    - Use `strace` to investigate the performance behavior of a process that is not
    CPU-bound.

    - Use `strace` to investigate how an application is interacting with the Linux
    kernel.

    - Submit bug reports that describe a performance problem so that an author or
    maintainer has enough information to fix the problem.'
  merge: -1
