- pgno: 82
  md: '# 9.3. Optimizing an Application


    When optimizing an application, several areas of the application''s execution
    may present a problem. This section directs you to the proper section based on
    the problem that you are seeing.


    Figure 9-1 shows the steps that we will take to optimize the application.


    Figure 9-1.


