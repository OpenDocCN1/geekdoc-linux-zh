    gimp_drawable_mask_bounds

    0.00 0.000184 184 1 g_malloc

    0.00 0.000118 118 1 gettext

    0.00 0.000100 100 1 gimp_pixel_rgn_init

    100.00 221.006096 873673 total

    ```


    Next we investigate that profile gives us how CPU time is being spent in each
    of the libraries, and whether the functions in the libraries are the same as those
    that the filter calls. For each of the top GIMP-using images, we use oreport to
    get more details about which functions in the libraries are called. We are showing
    this in Listing 10.8.'
