- pgno: 107
  md: '# 10.4. Configure the Application for the Performance Hunt


    The next step in our investigation is to set up the application for the performance
    hunt by recompiling the application with symbols. Symbols allow the performance
    tools (such as oprofile) to investigate which functions and source lines are responsible
    for the CPU time that is being spent


    For the GIMP, we download the GIMP tarball from its Web site, and then recompile
    it in the case of GIMP and much open-source software, the first step in recompilation
    is running the configure command, which generates the makefiles that will be used
    to build. The configure command passes any flags present in the CFLAGS environmental
    variable into the myfile. In this case, because we want the GIMP to be built with
    symbols, we set the CFLAGS variable to -g3 in the Makefile. This command is shown
    in Listing 10.3 and overrides the current value of the CFLAGS environmental variable
    and sets it to -g3.


    Listing 10.3.


    ```

    [root@localhost gimp-2.0.3]## env CFLAGS=-g3 ./configure

    ```


    We then make and install the version of GIMP with all the symbols included, and
    when we run this version, the performance tools will tell us where time is being
    spent.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 10.5. Install and Configure Performance Tools


    The next step in the hunt is to install the performance tools if they are not
    already installed. Although this might seem like an easy thing to do, it often
    involves chasing down custom-made packages for a distribution or over recompiling
    the tools from scratch. In this case, we are going to use profile on Fedora Core
    2, so we have to track down both the profile kernel module, which in Fedora''s
    case, is only included in the symmetric multiprocessing (SMP) kernels and the
    profile package to which library functions are called and how often they are being
    called. Fortunately, ltrace is included in Fedora Core 2, so we do not have to
    track it down.'
  merge: -1
  img_proc: true
