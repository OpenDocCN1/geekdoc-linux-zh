- pgno: 113
  md: '# 10.7. Analyze the Results


    Now that we have used profile to collect information about where time is spent
    when the filter is running, we need to analyze the results to look for ways to
    change its execution and increase performance.


    First, we use profile to look at how the entire system is spending time. This
    is shown in Listing 10.6.


    Listing 10.6.


    ```

    [root@localhost ezolt]# oreport -f | less

    CPU: CPU with timer interrupt, speed 0 MHz (estimated)

    Profiling through timer interrupt

    TIMER:0 --

    samples | %%

    69986 36.9285 /usr/local/lib/libgimp-2.0.so.0.3

    44237 23.3719 /usr/local/lib/libgimpcolor-2.0.so.0.3

    28386 14.9973 /usr/local/lib/libgimp/2.0/plug-ins

    16133 8.5236 /usr/local/lib/libgimp-2.0.so.0.400

    ```


    As Listing 10.6 shows, 75 percent of the CPU time was spent in the lic or GIMP-related
    libraries. These libraries are called by the trace a process that we can confirm
    by combining the information that trace gives us with the information from profile.
    Listing 10.7 shows library calls for a small portion of the run of the filter.


    Listing 10.7.


    ```

    [ezolt@localhost ktrace]$ ltrace -p 32744 -c

    % time seconds/calls function

    46.13 101.947998 272 374307 rint

    15.72 34.745099 278 124862 g_rand_double_range

    14.77 32.645236 261 124862

    gimp_pixel_rgn_gen_pixel

    13.01 28.743856 230 124862 gimp_rgba_set_uchar

    10.36 22.905472 183 124862 gimp_rgb_to_hsl

    0.00 0.006832 6832 1 gtk_widget_destroy

    0.00 0.003976 3976 1 gimp_progress_init

    0.00 0.00631 3631 1 g_rd_new

    0.00 0.001992 1992 1 gimp_drawable_get

