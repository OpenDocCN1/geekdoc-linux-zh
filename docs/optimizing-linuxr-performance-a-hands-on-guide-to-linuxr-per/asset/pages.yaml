- pgno: 170
  md: '# 13.2. What Tools Does Linux Still Need?


    As we toured the Linux tools, we saw some holes in the overall performance-investigation
    functionality. These holes are the result of kernel limitations, and some just
    exist because no one has written a tool to solve the problem. However, filling
    of these holes would make it dramatically easier to track down and fix Linux problems.


    # 13.2.1. Hole 1: Performance Statistics Are Scattered


    One glaring hole is that Linux has no tool that provides relevant performance
    statistics for a particular process. ps was to fill this hole in the original
    UNIX, and on Linux, it is pretty good but it does not cover all statistics that
    other commercial implementations provide. Some statistics are invaluable in tracking
    performance problems—for example, inblk (I/O blocks read in) and outbl (I/O blocks
    out) which indicate the amount of disk I/O is using; vcsw (voluntary context switches)
    and incsvw (involuntary context switches), which often show the amount of network
    I/O an application is using; msg (messages sent on pipes and sockets) and msgrecv.
    An ideal tool would combine all these tools presented so far (including profile,
    top, ps, strace, ltrace, and the /proc file system) into a single application.
    A user would profile this single process at once and extract all the important
    performance statistics. Each statistic would be updated in real time, enabling
    a user to debug an application as it runs. It would group statistics for a single
    area of investigation in the same location.


    For example, if I were memory usage, it would show exactly how memory was being
    used in the heap, by stacks, shared memory, and in map. If a particular area was
    much higher than I expected, I could drill down, and see which functions allocated
    the memory. If I were investigating CPU usage, I would start with statistics,
    such as how much time is spent in system time versus user and how many calls a
    particular process is making, I would be able to drill down into either the system
    or user time and see which functions are spending all the time and how they are
    called. A small script that uses the appropriate tools to gather and combine this
    information would go a long way to achieving some of this functionality, but fundamental
    changes in the behavior of the tools would be necessary to realize this.


    # 13.2.2. Hole 2: No Reliable and Complete Call Tree


    The next performance hole is the fact that there is currently no way to provide
    a complete tree of a program''s execution. Linux has several implementations.
    profile provides call-tree generation, but it is by sampling, which will not catch
    every call that is made. gprof supports calls but it is not possible to provide
    the full activation of every library that a process calls with support. This most
    promising tool, valgrind, is a skin called calltree, described in the section,
    "5.2.5 kcachegr," in Chapter 5, "Performance Tools: Process-Memory," which has
    a goal of providing a accurate call tree. However, it is in development and does
    not work on all binaries.


    This-call tool would be useful even if it dramatically slowed down application
    performance as it runs. A common way of using this would be to profile to figure
    which functions in an application are "hot," and then run the call tree to figure
    out why the application called them. The profile tool would provide an accurate
    view of the application''s bottlenecks when it runs at speed, and the call tree,
    even if it runs slowly, would show why and how the application called them. The
    program''s behavior was timing sensitive and it would change if it was running
    slowly (for example, something that relies on network or disk I/O). However, many
    problems are not timing sensitive and an accurate call tree mechanism would go
    a long way to find


    # 13.2.3. Hole 3: I/O Attribution'
  merge: -1
  img_proc: true
- pgno: 171
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # 13.3. Performance Tuning on Linux


    Even with the holes just mentioned, Linux is still an ideal place to find and
    fix performance problems. It was written for developers by developers and, as
    a result, it is very friendly to the performance investigator. Linux has a few
    characteristics that make it a great platform to track down performance problems.


    # ## 13.3.1. Available Source


    First, a developer has access to most (if not all) source code for the entire
    system. This is invaluable when tracking down a problem that appears to be outside
    of your code. On a commercial UNIX or other operating systems where source is
    not available, you might have to wait for a vendor to investigate the problem,
    and you have no guarantee that he will fix it if it is his. However, on Linux,
    you can investigate the problem yourself and figure out why the performance is
    happening. If the problem is outside your code, you can fix it and submit a patch,
    or just run with a fixed version. By reading the source of the Linux code, you
    realize that the problem is in your code, you can then fix the problem. In either
    case, you can fix it immediately and are not gated by waiting for someone else.


    # ## 13.3.2. Easy Access to Developers


    The second advantage of Linux is that it is relatively easy to find and contact
    the developers of a particular application or library. In contrast to most proprietary
    operating systems, where it is difficult to figure out which engineer is responsible
    for a given piece of code, Linux is much more open. Usually, the names or contact
    information of the developers for a particular piece of software are with the
    software package. Access to the developers allows you to ask questions about how
    a particular piece of code behaves, what slow-running code intends to do, and
    whether a given optimization is safe to perform. The developers are usually more
    than happy to help with this.


    # ## 13.3.3. Linux Is Still Young


    The final reason that Linux is a great platform on which to optimize performance
    is because it is still young. Features are still being developed, and Linux has
    many opportunities to find and fix performance bugs. Because most developers focus
    on adding functionality, performance issues can be left unresolved. An ambitious
    performance investigator can find and fix many of the small performance problems
    in the ever-developing Linux. These small fixes go beyond a single individual
    and benefit the entire Linux community.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 13.4. Chapter Summary


    In this chapter, we investigated a few of the areas where the set of Linux performance
    tools has shortcomings and proposed some ideal solutions. We also discussed why
    Linux is a good platform on which to try performance investigation and optimization.


    It is up to you, the reader, to change Linux performance for the better. The opportunities
    for improvement of Linux performance and Linux performance tools abound. If you
    find a performance problem that annoys you, fix it or report it to the developers
    and work with them to fix it. Either way, no one else will be hit by the problem,
    and the entire Linux community benefits.'
  merge: -1
