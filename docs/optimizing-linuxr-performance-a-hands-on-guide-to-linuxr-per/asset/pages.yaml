- pgno: 68
  md: '# 7.2. Network Performance Tools


    This section describes the Linux network performance tools available to diagnose
    performance problems.

    We start with the tools to determine the lowest level of network performance (physical
    statistics) and add

    tools that can investigate the layers above that.


    # 7.2.1. mii-tool (Media-Independent Interface Tool)


    mii-tool is an Ethernet-specific hardware tool primarily used to configure an
    Ethernet device, but it can

    also provide information about the current configuration. This information, such
    as the link speed and

    dupe setting, can be useful when tracking the cause of an under-performing network
    device.


    # 7.2.1.1 Network I/O Performance-Related Options


    mii-tool requires root access to be used. It is invoked with the following command
    line:


    ```

    mii-tool [-v] [device]

    ```


    mii-tool prints the Ethernet settings for the given device. If no devices are
    specified, mii-tool displays

    information about all the available Ethernet devices. If the -v option is used,
    mii-tool displays verbose

    statistics about the offered and negotiated network capabilities.


    # 7.2.1.2 Example Usage


    Listing 7.1 shows the configuration of the eth0. The system lines tell that the
    Ethernet device is

    using a 100BASE-T full-duplex connection. The next few lines describe the capabilities
    of the

    network card in the machine and the capabilities that has detected the network
    device on the

    other end of the wire.


    # Listing 7.1.


    ```

    root@nohs linux-2.6.8-1.521]# /sbin/mii-tool -v eth0

    eth0:negotiated 100baseTx-FD, link ok

    product info: vendor 00:00:00, model 0 rev 0

    basic mode: autonegotiation enabled

    basic status: autonegotiation complete, link ok

    capabilities: 100baseTx-FD 100baseTx-HD 10baseTx-HD 10baseTx-HD

    advertising: 100baseTx-FD 100baseTx-HD 100baseTx-FD 10baseTx-HD

    flow-control

    link partner: 100baseTx-FD 100baseTx-HD 100baseTx-HD 10baseTx-HD

    ```


    mii-tool provides low-level information about how the physical level of the Ethernet
    device is

    configured.


    # 7.2.2. ethtool


    ethtool provides similar capabilities to mii-tool for configuration and display
    of statistics for Ethernet

    devices. However, ethtool is the more powerful tool and contains more configuration
    options and device

    statistics.


    # 7.2.2.1 Network I/O Performance-Related Options


    ethtool requires root access to be used. It is invoked with the following command
    line:


    ```

    ethtool [device]

    ```'
