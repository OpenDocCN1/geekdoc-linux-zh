- pgno: 127
  md: '# 11.1. A Latency-Sensitive Application


    In this chapter, we investigate an application that is sensitive to slow latency.
    Latency can be thought of as the time it takes for an application to respond to
    different external or internal events. An application with a small amount of CPU
    time to respond to different events. However, the response to the particular events
    is not swift enough. When fixing a latency performance problem, we need to reduce
    the latency in response to the various events and figure out what parts of the
    application are slowing down the response. As you will see, tracking down a latency
    problem requires a slightly different tactic than tracking down a CPU-intensive
    problem.'
  merge: -1
  img_proc: true
- pgno: 128
  md: The significant difference of this performance investigation from the GIMP investigation
    is that the times we are trying to reduce are on the order of milliseconds rather
    than seconds. When the times are so small, it can be difficult to make sure that
    the profiling data you are capturing is actually the result of the event that
    you are trying to measure rather than just the noise around trying to stop and
    start the profiling tools. However, this short time period also makes it practical
    to trace all aspects of the application for the interesting period of time.
