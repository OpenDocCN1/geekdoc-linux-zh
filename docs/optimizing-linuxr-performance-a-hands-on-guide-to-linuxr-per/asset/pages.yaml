  md: '# 12.3. Find a Baseline/Set a Goal


    Once again, the first step is to determine the current state of the problem.


    However, in this case, it is not easy to do. We do not know when the problem will
    begin or how long it will last, so we cannot really set a baseline without more
    investigation. As far a goal, ideally we would like the problem to disappear completely,
    but the problem might be caused by essential OS functions, eliminating it entirely
    not be possible.


    First, we need to do a little more investigation into why this problem is happening
    to figure out a reasonable baseline. The initial step is to run top as the slideshow
    is happening. This gives us a list of processes that may be causing the problem,
    or it may exist even at the kernel.


    In this case as in Listing 12.1, we run top and ask it to show only不超过 processes
    (by pressing <1> top runs).


    # Listing 12.1.


    ```

    top - 12:03:40 12 min  7 users, load average: 1.35, 0.98,

    0.53

    Tasks: 86 total,    2 running,    84 sleeping,    0 stopped,

    0 zombie

    CPU(s): 2.3% us,    5.0% sy,    1.7% ni,    0.0% id, 91.0% wa,

    0.0% hi,               0.0% si

    Mem: 320468 total,    317024 used,       344k free,

    24640k buffers

    Swap: 655192 total,           0 used,       655192 free,

    183620k cached


    PID USER             PR NI VIRT RES SH %CPU %MEM  TIME+

    COMMAND           34 19 4920 1944 2828 R  1.7  0.6 0:01.13

    prelink

    5389 ezolt         17  0 3088 9014 1620 R  0.7  0.3 0:00.70

    t

    ```


    The top in Listing 12.1 has several important properties. First, notice that no
    process is hogging the CPU; using less than 2 percent of the total CPU time. Second,
    the system is spending 91 percent waiting for I/O. Third the system is not using
    any of the swap space, so the grinding is NOT caused by swapping. Finally, an
    unknown process, prelink, is running when the problem happens. It is unclear what
    the prelink command is, so we will remember that application name and investigate
    it later.


    Our next step is to run vmstat to see what the system is doing. Listing 12.2 shows
    the result of vmstat and confirms what we saw with top. That, -90 percent of the
    system is waiting for I/O. It tells us the disk subsystem is reading in around
    1000 blocks a second of data. This is a significant amount of I/O.


    # Listing 12.2.


    ```

    [ezolt@localhost ezolt]$ vmstat 1 10

    procs --memory--swap--io----

    --system--cpu----

    r b swpd free buff cache si so bo in

    cs us us id wa *

    ```'
