- pgno: 30
  md: '# 2.1. CPU Performance Statistics


    Each system-wide Linux performance tool provides different ways to extract similar
    statistics. Although no tool displays all the statistics, some of the tools displays
    the same statistics. Rather than describe the meaning of the statistics multiple
    times (for each tool), we review them once before the tools are described.


    # 2.1.1. Run Queue Statistics


    In Linux, a process can be runnable or blocked waiting for an event to complete.
    A blocked process may be waiting for data from an I/O device or the results of
    a system call. If a process is runnable, means that it is competing for the CPU
    with the other processes that are also runnable. A runnable process is not necessarily
    using the CPU, but when the Linux scheduler is deciding which process to run,
    it picks from the list of runnable processes. When these processes are runnable,
    but by waiting to use the processor, they form a called run queue. The longer
    the queue, the more processes wait in line.


    The performance tools commonly show the number of processes that are runnable
    and the number of processes are blocked waiting for I/O. Another common system
    statistic is that load average. The load on a system is the total amount of runnable
    and blocked process. For example, if two processes were running and three available
    to run, the system''s load would be five. The load average is the amount of load
    over a given amount of time. Typically, the load average is over 1 minute, 5 minutes,
    and 15 minutes. This enables you to see how load changes over time.


    # 2.1.2. Context Switches


    Most modern processors can run only one process at a time. Some processors, such
    as hyperthreaded processors, can actually run more than one simultaneously,Linux
    treats them as multiple single-threaded processors. To create the illusion that
    a given process runs multiple tasks simultaneously, the Linux kernel constantly
    switches between different processes. The switch between processes is called a
    context switch, which it happens, the CPU saves all the context information from
    the old process and retrieves all the context information for the new process.
    The context contains a large amount of information that Linux tracks for each
    process, including, among others, which instruction pointer is, which memory it
    has allocated, and what files the process has open. These switching contexts can
    involve moving a large amount of information, and the context switch can be expensive.
    It is good to minimize the number of context switches if possible.


    To avoid context switches, it is important to know how they happen. First, context
    switches can result from kernel scheduling. To guarantee that each process receives
    a fair share of processor time, the kernel periodically interrupts and, if appropriate,
    the scheduler decides to start another process rather than the current process
    every this periodic interrupt or occurs. It is possible that your system will
    interrupt per seconds per architecture and kernel timer. One way is to check how
    often the interrupt is to use /proc/interrupts to determine the number of interrupts
    that have occurred over an amount of time. This is demonstrated in Listing 2.1.


    # Listing 2.1.


    ```

    root@localhost asm-i386# cat /proc/interrupts | grep timer

    ; sleep 10 ; cat /proc/interrupts | grep timer

    0: 24060643 X-TIMER timer

    0: 24070993 X-TIMER timer

    ```


    In Listing 2.1, we will ask the kernel to show how many times the timer has fired,
    with ten seconds, and'
