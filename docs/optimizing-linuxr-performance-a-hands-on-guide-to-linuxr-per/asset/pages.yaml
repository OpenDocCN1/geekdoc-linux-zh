- pgno: 160
  md: '# 12.7. Simulating a Solution


    The information revealed by strace shows that prelink is spending a lot of time
    trying to open and analyze binaries that cannot possibly prelink. The best way
    to test whether caching of nonprelinked binaries could improve prelink''s performance
    is to modify prelink so that it adds all unprelinked binaries to its initial cache.
    Unfortunately, adding code to these "unprelinked" binaries could be a complicated
    process that involves a good amount of knowledge about the internals of the prelink
    application. An easier method is to simulate the cache by replacing all the unprelinked
    binaries with a known prelinked binary. This causes the formerly unlinked binaries
    to be ignored when quick to run. This is exactly what would happen if we were
    having a cache, so we can use it to estimate the performance increase we would
    see if prelink were to cache and ignore unprelinked binaries.


    To start the experiment, we copy all the files in /usr/bin/ to the sandbox directory
    and run prelink on this directory. This directory includes non binary, and shells,
    and other libraries that cannot be prelinked. We then run prelink on the sandbox
    directory and let it create a new cache rather than the system cache. This is
    shown in Listing 12.15.


    # Listing 12.15.


    ```

    /usr/sbin/prelink -C new_cache -f sandbox/

    ```


    Next, in Listing 12.16 we time how long it takes to cache the prelink to run.
    We had to run multiple times until we got a consistent result (the first run warmed
    the cache for each of the succeeding runs). The baseline time in Listing 12.16
    is .983 seconds. We have to beat this time for our optimization (improving the
    cache) to be worthwhile.


    # Listing 12.16.


    ```

    time /usr/sbin/prelink -C new_cache -q sandbox/

    real    0m.983s

    user    0m.597s

    sys      0m.386s

    ```


    Next, in Listing 12.17, we run strace on this prelink command. This is to record
    which files prelink opens in the sandbox directory.


    # Listing 12.17.


    ```

    strace -o strace_prelink_sandbox /usr/sbin/prelink -

    new_cache -q/

    ```


    We create a new directory, sandbox2, into which we copy all the binaries in the
    /usr/bin directory. However, we overwrite all the files that prelink "opened"
    in the preceding strace output with a known good binary, which can be prelinked.
    We copy the copy to all possible binaries rather than just linking them, so that
    both sandbox contain the same number of files. After we set up the second sandbox,
    we run the full version of prelink on this new directory using the command in


    # Listing 12.18.


    ```

    [root@localhost prelink]#/usr/sbin/prelink -C new_cache2 -f

    sand2/

    ```'
