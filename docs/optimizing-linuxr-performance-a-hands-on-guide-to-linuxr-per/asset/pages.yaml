- pgno: 79
  md: '# 9.1. Not Always a Silver Bullet


    This chapter assumes that it is possible to solve a performance problem by changing
    software. Tuning an application or system to achieve a target performance goal
    is not always possible. If tuning fails, it may require a hardware upgrade or
    change. If the capacity of the system is maxed out, performance tuning only helps
    to a certain extent.


    For example, it may be necessary (or even cheaper) to just upgrade the amount
    of system memory rather than track down which applications are using system memory,
    and then tune them so that they reduce their usage. The decision to just upgrade
    the system hardware rather than track down and tune a particular performance problem
    depends on the problem and is a value judgment of the individual money-wise (to
    buy new hardware). Which option is cheaper, either time-wise (to investigate the
    problem) or money-wise, in some situations, tuning will be the preferred or only
    option is what this chapter describes.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 9.2. Starting the Hunt


    After you decide to start optimizing something on Linux, you first have to decide
    what you are going to optimize. The method used in this chapter covers some of
    the more common performance problems and an example shows how you use the previously
    presented tools together to solve a problem. The next series of sections helps
    guide you in your discovery of the cause of a performance problem. In many sections
    you are asked to run various performance tests and jump to different sections
    in this chapter based on the results. This helps to pinpoint the source of the
    problem.


    As stated in previous chapters, it is a good idea to save the results of each
    test that you perform. This enables you to review the results later and even to
    send the results to someone else if the investigation is inconclusive.


    Let''s get started.


    When investigating a problem, it is best to start with a system that has as little
    unrelated programs running as possible, so close or kill any unneeded applications
    or processes. A clean system helps eliminate the potentially confusing interference
    caused by any extraneous applications.


    If you have a specific application or program that is not performing it as it
    should, jump to Section 9.3. If no particular application is sluggish and, instead,
    the entire Linux system is not performing as it should, jump to Section 9.4.'
  merge: -1
  img_proc: true
