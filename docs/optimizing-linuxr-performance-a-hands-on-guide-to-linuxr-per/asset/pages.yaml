- pgno: 19
  md: '# About the Author


    PHIL EZOLT discovered Linux more than nine years ago when pursuing an undergraduate
    electrical and computer engineering degree from Carnegie Mellon. For six years,
    Phil ported and designed Linux performance tools for Compaq''s Alpha performance
    group and represented Compaq in the SPEC CPU subcommittee. During that time, he
    improved Linux performance on the industry standard SPEC Web and CPU benchmarks
    using the performance tools he ported and developed. Phil is currently part of
    a Hewlett-Packard team developing Sepia, a visualization technology that uses
    Linux XC clusters, OpenGL, and off-the-shelf graphics cards to parallelize real-time
    high-end visualizations. He is also currently pursuing a master''s degree in computer
    science from Harvard University and is a big fan of German-style board games.'
