- pgno: 59
  md: '# 6.2. Disk I/O Performance Tools


    This section examines the various disk I/O performance tools that enable you to
    investigate how an application is using the disk I/O subsystem, how heavily each
    disk is being used, how well the kernel''s cache is working, and which files a
    particular application has "open.


    # 6.2.1. vmstat (ii)


    As you saw in Chapter 2, "Performance Tools: System CPU," vmstat is a great tool
    to give an overall view of how the system is being used. In addition to CPU and
    memory statistics, vmstat can provide a system-view of I/O performance.


    # 6.2.1.1 Disk I/O Performance-Related Options and Outputs


    While using vmstat to retrieve I/O statistics from the system, you may invoke
    it as follows:


    ```

    vmstat [-D] [-d] [-p partition] [interval] [count]

    ```


    Table 6-1 describes the other command-line parameters that influence the disk
    I/O statistics that vmstat will display.


    # Table 6-1. vmstat Command-Line Options


    | Option | Explanation |

    | - | - |

    | -D | This displays Linux I/O subsystem total statistics. This option can give
    you a good idea of how your I/O subsystem is being used, but won''t give statistics
    on individual disks. The statistics given are the totals system boot, rather than
    just that occurred between this sample and the previous sample |

    | -d | This displays individual disk statistics at a rate of one sample per interval.
    The statistics are the totals system boot, rather than just that occurred between
    this sample and the previous sample |

    | -p partition | This displays performance statistics about the given partition
    at a rate of one sample per interval. The statistics are the totals system boot,
    rather than just that occurred between this sample and the previous sample |

    | interval | The length of time between samples |

    | count | The total number of samples to take.|


    If you run vmstat without any other parameter than [interval] and [count], it
    shows the default output. This output contains three columns relevant to disk
    I/O performance: bo, bi, and wa. These statistics are described in Table 6-2.


    # Table 6-2. vmstat I/O Statistics


    | Statistic | Explanation |

    | - | - |

    | bo | This indicates the number of total blocks written to the previous interval.
    (In vmstat, block size for a disk is typically 1,024 bytes) |'
  merge: -1
  img_proc: true
