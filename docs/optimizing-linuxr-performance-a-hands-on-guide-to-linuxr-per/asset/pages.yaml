  md: '# 9.4. Optimizing a System


    Sometimes, it is important to approach a is misbehaving system and figure out
    exactly what is slowing down everything.


    Because we are investigating a system-wide problem, the cause can be anywhere
    from user applications to system libraries to the Linux kernel. Fortunately, with
    Linux, unlike many other operating systems, you can get the source for most not
    all applications on the system. If necessary, you can fix the problem and submit
    the fix to the maintainers of that particular piece. In the worst case, you can
    run a fixed version locally. This is the power of open-source software.


    Figure 9-2 shows a flowchart of how we will design a system-wide performance problem.


    Figure 9-2.


    Go to Section 9.4.1 to begin the investigation.


    # 9.4.1. Is the CPU-Bound?


    Use top.procinfo, or mpstat to determine where the system is spending its time.
    If the entire system is spending less than 5 percent of the total time in idle
    and wait modes, your system is CPU-bound. Proceed to Section 9.4.3. Otherwise,
    proceed to Section 9.4.2.


    # 9.4.2. Is a Single Processor CPU-Bound?


    Although the system as a whole may not be CPU-bound, in a symmetric multiprocessing
    (SMP) or hyperthreaded system, an individual processor may be CPU-bound.


    Use top or mpstat to determine whether an individual CPU has less than 5 percent
    in idle and wait modes. If it does, one more CPU is CPU-bound; in this case, go
    to Section 9.4.4.


    Otherwise, CPU is CPU-bound. Go to Section 9.4.7.


    # 9.4.3. Are One or More Processes Using Most of the System CPU?


    The next step is to figure out any particular application or group of applications
    is using the CPU. The easiest way to do this is to run top. By default, top sorts
    the processes that use the CPU in descending order. top reports CPU usage for
    a process as the sum of user and system time. For example, if an application spends
    20 percent of the CPU in user space code, and 30 percent in system code, top will
    report that the process has consumed 50 percent of the CPU. Sum up the time of
    all. If that is significantly less than the system-wide percentage, the kernel
    is doing significant work that is not on the behalf of applications.


    Otherwise, go to Section 9.5.1 for each process to determine where it is spending
    its time.


    # 9.4.4. Are One or More Processes Using Most of an Individual CPU?


    The next step is to figure out any particular application or group of applications
    is using the individual CPUs. The easiest way to do this is to run top. By default,
    top sorts the processes that use the CPU in descending order. When reporting CPU
    usage for a process, top shows the total CPU and system time that application
    uses. For example, if an application spends 20 percent of the CPU in user space
    code, and 30 percent of in system code, top will report that the application has


    First, run top, and then add the CPU to the fields that top displays. In Linux
    mode so that top'
