- pgno: 163
  md: '# 12.8. Reporting the Problem


    Because we have found a problem and potential solution in a pretty low-level piece
    of system software, it is a good idea to work with the author to resolve the problem.
    We must at least submit a bug report so that the author knows a problem exists.
    Submitting the tests we used to discover the problem helps him to reproduce the
    problem and hopefully fix it. In this case, we will add a bug report to Red Hat''s
    bug (zilla.redhat.com) tracking system. (Most distributions have similar tracking
    systems.) Our bug report describes the problem that we encountered and the possible
    solution that we discovered.


    When arriving at bugzilla, we first search for bug reports in preprint to see
    whether anyone else has reported this problem. In no case, one so, we see the
    bug report in Listing 12.22 and wait for the author or maintainer to respond and
    fix the bug.


    # Listing 12.22.


    ```

    From Bugzilla Helper:

    User-Agent: Mozilla/5.0 (X11; Linux i686; en-US; rv:1.6) Gecko/20040510

    ```


    Description of problem:


    When running in quick mode, preprint does not cache the fact that some binaries
    cannot be prelinked. As a result it rescans them every time , even if preprint
    is running in quick mode. This causes the disk to grind and dramatically slows
    down the whole system.


    There are 3 types of executables that it retries during quick mode:


    +   1) Static Binaries


    +   2) Shell Scripts


    +   3) Binaries that rely on unprelinkable binaries. (Such as OpenGL)


    For 1&2, it would be nice if preprint cached that fact that executables cannot
    be prelinked, and then in quick mode check their ctime & mtime, and don''t even
    try to read them if it already knows that they can''t be prelinked.


    For 3, it would be nice if preprint recorded which libraries are causing the preprint
    to fail (Take the OpenGL case for example), and record that'
  merge: -1
