- pgno: 177
  md: '# # Appendix B. Installing oprofile


    Although the system profiler oprofile is a powerful performance tool, its installation/use
    can be tricky. This appendix describes some of the issues when installing oprofile
    on Fedora Core 2 (FC2), Red Hat Enterprise Linux (EL3), and SUSE 9.1 (S9.1).'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# B.1 Fedora Core 2 (FC)


    For FC2, Red Hat provides packages for profile that should be used rather than
    those downloaded from the profile Web site. The uniprocessor kernel does not provide
    the necessary profile drivers. Red Hat packages the necessary profile kernel modules
    with the smp version of the kernel. If you want to run profile,you must use the
    smp kernel, even if you are running it on a single-processor machine.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# B.2 Enterprise Linux 3 (EL3)


    For EL3, once again, Red Hat provides packages for profile that should be used
    rather than those downloaded from the profile Web site. The uniprocessor kernel
    does not provide the necessary profile drivers. Red Hat has the necessary profile
    kernel modules with the smp or hugemem versions of the kernel. If you want to
    run profile you must use the smp or hugemem kernel, even if you are running it
    on a single-processor machine.


    More details on using profile in EL3 are provided at http://www.redhat.com/docs/manuals/enterprise/RHEL-3-Manual/sysadmin-guide/ch-profile.html.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# B.3 SUSE 9.1


    For SUSE 9.1, SUSE provides packages for oprofile that should be used rather than
    those downloaded from the oprofile Web site. All versions of the SUSE kernels(default,
    smp, and bigsmsp) provide support for oprofile, so any of the supplied kernels
    will work.'
  merge: -1
  img_proc: true
