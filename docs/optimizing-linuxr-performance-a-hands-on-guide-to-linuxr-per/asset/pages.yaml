- pgno: 121
  md: "# 10.11. Solving the Problem\n\nBecause we have determined that the reading\
    \ of pixel values is taking a significant amount of time, there is yet another\
    \ solution that may solve the problem. We have to start looking at how the filter\
    \ runs. As it generates the new image, it repeatedly asks for the pixel. Because\
    \ the new pixel value is based on the pixels that surround it, during the course\
    \ of the running on the image, each pixel can be accessed by each of its neighbors.\
    \ This means each pixel in the image will be read by each of its neighbors, or\
    \ read at least nine times.\n\nBecause the calls to the GIMP library are expensive,\
    \ we would like to do them once for each pixel rather than nine times. It is possible\
    \ to optimize the access by reading the entire image into a local array when the\
    \ filter starts up, and then calling the GIMP library routines when we need to\
    \ access the data. This method would significantly reduce the overhead of looking\
    \ up the pixel data. Instead of a couple of function calls for each access, we\
    \ use our local array. On filter initialization, the array is allocated with malloc\
    \ and filled with the pixel data. This is shown in Listing 10.14.\n\n# Listing\
    \ 10.14.\n\n```\nint g_image_width, g_image_height;\nGimpRGB *cached_image;\n\n\
    void cache_image(GimpPixelRgn *src_rgn, int width, int height)\n  static guchar\
    \ data[4];\n  int x,y;\n  GimpRGB *current_pixel;\n\n  g_image_width = width;\n\
    \  g_image_height = height;\n\n  g_cached_image = malloc(sizeof(GimpRGB)*width*height);\n\
    \  current_pixel = g_cached_image;\n\n  /* Malloc */\n  for (y = 0; y < height;\
    \ y++)\n    {\n      for (x = 0; x < width; x++)\n        {\n          gimp_pixel_rgn_get_pixel(src_rgn,\
    \ data, x, y);\n          gimp_rgba_set_uchar(current_pixel, data[0], data[1],\
    \ data[2], data[3]);\n\n          current_pixel++;\n        }\n    }\n```\n\n\
    In addition, the peek routine has been rewritten to access this local array rather\
    \ than call into the GIMP library functions. This is shown in Listing 10.15.\n\
    \n# Listing 10.15.\n\n```\nstatic void peek(GimpPixelRgn *src_rgn,\n  int x,\n\
    \  int y,\n  GimpRGB *color)\n```"
  merge: -1
  img_proc: true
