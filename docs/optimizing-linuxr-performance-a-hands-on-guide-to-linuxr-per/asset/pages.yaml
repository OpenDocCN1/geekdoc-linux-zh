- pgno: 41
  md: "# 3.2. Linux Performance Tools: CPU and Memory\n\nHere begins our discussion\
    \ of performance tools that enable you to extract the memory performance information\
    \ described previously.\n\n# 3.2.1. vmstat (Virtual Memory Statistics) II\n\n\
    As you have seen before, vmstat can provide information about many different performance\
    \ aspects of a system—although its primary purpose, as shown next, is to provide\
    \ information about virtual memory system performance. In addition to the CPU\
    \ performance statistics described in the previous chapter, it can tell you the\
    \ following:\n\n+   * How much swap is being used\n* How the physical memory is\
    \ being used\n* How much memory is free\n\nAs you can see, vmstat provides (via\
    \ the statistics it displays) a wealth of information about the health and performance\
    \ of the system in a single line of text.\n\n# 3.2.1.1 System-Wide Memory-Related\
    \ Options\n\nIn addition to the CPU statistics vmstat can provide, you may invoke\
    \ vmstat with command-line options when investigating memory statistics:\n\n```\n\
    vmstat [-a] [-s] [-m]\n```\n\nAs before, you can run vmstat in two modes: sample\
    \ mode and average mode. The added command-line options enable you to get the\
    \ performance statistics about how the Linux kernel is using memory. Table 3-1\
    \ describes the options that vmstat accepts.\n\n# Table 3-1. vmstat Command-Line\
    \ Options\n\n| Option | Explanation |\n| -a | This changes the default output\
    \ of memory statistics to indicate the active/inactive amount of memory rather\
    \ than information about buffer and cache usage |\n -s (procps) | This prints\
    \ out the vm table. This is a bag of diffstatistics about the system since it\
    \ has booted. It cannot be run in sample mode. It contains both memory and CPU\
    \ statistics. |\n| -m (procps) | This prints out the kernel's slab info. This\
    \ is the same information that can be retrieved by typing cat/proc/slabinfo. This\
    \ describes in detail how the kernel's memory is allocated and can be helpful\
    \ to determine what area of the kernel is consuming the most memory.|\n\nTable\
    \ 3-2 provides a list of memory statistics that vmstat can provide. With the CPU\
    \ statistics, when running in normal mode, the first line vmstat provides the\
    \ average values for all rate statistics (so and i) and the instantaneous value\
    \ for all numeric statistics (swpd, free, buff, cache, active and inactive)."
