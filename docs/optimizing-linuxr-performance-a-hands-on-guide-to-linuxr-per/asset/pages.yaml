- pgno: 57
  md: '# 6.1. Introduction to Disk I/O


    Before diving into performance tools, it is necessary to understand how the Linux
    I/O system is structured. Most modern Linux systems have one or more disk drives.
    If they are IDE drives, they are usually named hda, hdb, hdc, and so on; whereas
    SCSI drives are usually named sda, sdb, sdc, and so on. A disk is typically split
    into multiple partitions, where the name of the partition''s device is created
    by adding the partition number to the end of the base device name. For example
    the first IDE hard drive in the system is usually labeled /dev/hda2. Each individual
    partition usually contains either a file system or a swap partition. These partitions
    are mounted into the Linux root file system, as specified in /etc/fstab. These
    mounted file systems contain the files that applications read to and write from.


    When an application does a read or write, the Linux kernel may have a copy of
    the file stored in its cache or returns the requested information without ever
    accessing the disk. If the Linux kernel does not have a copy of the data stored
    in memory, however, it adds a request to the disk''s I/O queue. If the kernel
    notices that multiple requests are asking for contiguous locations on the disk,
    it merges them into a single big request. This merging increases overall disk
    performance by eliminating the seek time for the second request. The request has
    been placed in the disk queue, if the disk is not currently busy, it starts to
    service the I/O request. If the disk is busy, the request waits in the queue until
    the drive is available, and then it is serviced.'
  merge: -1
  img_proc: true
