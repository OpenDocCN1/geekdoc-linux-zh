- pgno: 175
  md: '# # Appendix A. Performance Tool Locations


    The performance tools described in this book originated from many different locations
    on the Internet. Fortunately, most distributions have pulled them together and
    included them in the current versions of their distributions. Table-1 describes
    all the tools, provides pointers to their original locations, and indicates whether
    they are included in the following distributions: Fedora Core 2 (FC2), Red Hat
    Enterprise Linux (EL3), and SUSE 9 (S.1).


    # Table A-1. Locations of Performance Tools


    | Tool | Distro | Source Location |

    | --- | --- | --- |

    | bash | FC2, EL3, $9.1 | http://cnswww.cns.cwru.edu/~bash/bashtop.html |

    | etherape | None | http://etherape.sourceforge.net/ |

    | ettool | FC2, EL3, $9.1 | http://sourceforge.net/projects/gkernel/ |

    | proc | FC2, EL3, $9.1 | Part of the procps package: http://procps.sourceforge.net/
    |

    | gcc | FC2, EL3, $9.1 | http://gcc.gnu.org/ |

    | gdb | FC2, EL3, $9.1 | http://sources.redhat.com/gdb/ |

    | gkrellm | FC2, $9.1 | http://web.wt.net/~billw/gkrellm/gkrellm |

    | gnome-system-monitor | FC2, $9.1 | Part of the GNOME project, and available
    from: ftp://ftp.gnome.org/pub/sources/gnome-system-monitor/ |

    | gnumeric | FC2, $9.1 | http://www.gnome.org/projects/gnumeric/ |

    | gprof | FC2, EL3, $9.1 | Part of the binutils package: http://sources.redhat.com/binutils
    |

    | ifconfig | FC2, $9.1 | Part of the net-tools: http://www.tazenda.demon.co.uk/phil/net-tools/
    |

    | iostat | FC2, $9.1 | Part of the systat package: http://perso.wanadoo.fr/sebastien.godard/
    |'
  merge: -1
  img_proc: true
