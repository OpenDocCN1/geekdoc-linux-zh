    \ in your plugin-in. Do not get (or set) pixels one\nat a time\nusing pixel_rgn_[get|set]_pixel\
    \ if there is any other way.\\\"\n(from\nhttp://www.home-unix.org/simon/gimp/gaud2002/gimp-plugin/html/imagedata.html)\"\
    \n```\n\nIn the Web, we search yield information about the gimp_rgb_set_uchar\
    \ function by simply turning up the source for the function. As shown in Listing\
    \ 10.13, this puts back the red, and blue values into a GimpRGB structure that\
    \ represents a single color.\n\n# Listing 10.13.\n\n```\nvoid\ngimp_rgb_set_uchar\
    \ (GimpRGB *rgb,\nguchar r,\nguchar g,\nguchar b)\n{\n\tg_return_if_fail (rgb\
    \ != NULL);\nn\nrgb->r = (double) r / 255.0;\nrgb->g = (double) g / 255.0;\nrgb->b\
    \ = (double) b / 255.0;\n}\n```"
