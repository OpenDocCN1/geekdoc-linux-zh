  \n![](img/fm1.png)\n\n# 第 1 章：Linux 环境简介\n\n## 简介\n\n在本章中，我们将学习 Linux 文件系统层次级标准（FHS）目录。接下来，我们将学习从终端环境获取硬件信息的方法。最后，我们将通过\
  \ GRUB2 完成本章。\n\n## 结构\n\n本章将讨论以下主题：\n\n* 文件系统层次级标准\n* 查找硬件信息\n* 统一引导程序 2 (GRUB2)\n\
  \n## 目标\n\n在本章结束时，你将能够理解文件结构。你将习惯目录及其使用方法。这将让你更容易定位硬件。本章还将向你介绍统一引导程序 2。\n\n## 文件系统层次级标准\n\
  \n当提到 FHS 术语时，请考虑目录结构。你会发现几乎所有的 Linux 发行版中的 FHS 都是相同的。它定义了类 Linux 发行版等类 Unix 系统的目录结构和内容。\n\
  \n标准化文件系统层次级的需求源于早期 Unix 系统的多样性，当时文件组织在不同实现之间存在差异。FHS 项目由自由标准组织（现 Linux Foundation）于\
  \ 20 世纪 90 年代初旨在解决这一问题。其首要目标是建立一种典型的结构，简化跨 Linux 发行版的软件开发、管理和包管理。\n\n## FHS 的核心原则\n\
  \nFHS 由几个塑造其设计和实现的根本性原则所指导。这些原则包括：\n\n* 文件系统层次级：FHS 定义了组织文件和目录的一致结构。它根据用途对其进行分类，确保每个组件在层次结构中都有特定的角色。\n\
  * 兼容性：FHS 旨在维护不同 Linux 发行版之间的兼容性。通过遵循标准，软件开发者和管理员可以创建并管理在各种系统中无缝运行的应用。\n* 合规性：寻求\
  \ FHS 合规的 Linux 发行版必须遵守特定指南，以确保文件和目录的放置一致。这促进了可移植性并简化了软件的打包和安装。\n\n在各种 Linux 发行版中，无论\
  \ Linux 发行版如何，配置文件通常位于相同的位置（`/etc` 目录）。这使得为 Linux 开发软件变得更容易，因为软件开发者不需要为每个发行版编写不同版本的应用程序。\n\
  \n在 FHS 环境中，文件和目录出现在根目录（`/`）下；根目录是所有其他目录的父目录，位于 FHS 的顶部。\n\nLinux 发行版常用目录列表如下：\n\
  \n* `/`：根目录，这是顶级目录。它是所有其他目录的父目录。\n* `/root/`：root 家目录。\n* `/boot`：包含与系统启动的文件，如引导程序配置、内核镜像和初始内存磁盘\
  \ (initram) 文件。\n* `/bin`：系统运行所需的关键执行文件。\n* `/dev`：包含硬盘或 CD-ROM 等设备文件。\n* `/sbin`：与\
  \ `/bin` ，但包含通常由 root 用户运行的程序。\n* `/etc`：包含配置文件。\n* `/home`：用户家目录。\n* `/lib`：32\
  \ 位系统上的库文件。\n* `/lib64`：64 位系统上的库文件。\n* `/media`：可移动介质的挂载点，通常用于自动挂载外部介质。\n* `/mnt`：手动挂载可移动介质的挂载点。\n\
  * `/usr`：包含大多数用户工具（`/usr/bin/`、`/usr/lib/` 等）。\n* `/var`：包含各种文件，如日志（auth, syslog）、网络服务器内容和包缓存。\n\
  * `/tmp`：包含程序创建的临时文件。\n* `/proc`：虚拟文件系统，包含各种运行时信息，如设备、总线、中断、CPU、RAM 等。\n\n现在，让我们使用\
  \ Ubuntu 和 Centos 发行版查看终端中的目录。\n\n根目录位于目录结构的顶部。使用 Ubuntu，让我们使用 `pwd` 命令检查当前的工作目录。请参考\
