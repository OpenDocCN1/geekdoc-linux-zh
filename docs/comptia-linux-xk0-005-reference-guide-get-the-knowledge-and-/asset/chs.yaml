  \ 1.18 所示：\n\n![](img/Figure_1.18.png)\n\n图 1.18：使用带有 `-a` 选项的 `ls` 命令查看隐藏文件\n\n\
  注意：隐藏文件以点（`.）开头。\n\n## 查找硬件信息\n\n在 Linux 中，你可以使用各种命令行工具从终端获取硬件信息。以下是一些常用命令：\n\n\
  *   `lscpu`：此命令显示有关系统上 CPU（处理器）的详细信息，包括核心数、架构、时钟频率等。\n*   `lsblk`：它列出连接到系统的块设备信息，例如硬盘和\
  \ SSD。它显示了设备名称、大小和挂载点等细节。\n*   `blkid`：提供块设备属性。\n*   `lspci`：提供有关连接到系统的外围组件互连（PCI）设备的信息，包括显卡、网络适配器和声卡。\n\
  *   `lsusb`：此命令列出连接到系统的 USB 设备，例如键盘、鼠标、打印机和 USB 存储设备。\n*   `Lsmod` 查看正在使用的模块以及空闲\
  \ RAM 信息。\n*   `Hwinfo`：这是一个全面的硬件工具，提供有关各种硬件组件的详细信息，包括 CPU、内存、存储、网络适配器等。\n*   `dmidecode`：此命令从系统的桌面管理接口（DMI）表中检索信息，其中包含硬件组件、BIOS\
  \ 和系统制造商的细节。\n*   `Inxi`：这是一个多功能命令，以用户友好的格式提供有关各种硬件组件和系统配置的详细信息。它可以显示 CPU、内存、存储、显卡等细节。\n\
  *   `df`：显示文件系统的磁盘使用情况。\n*   `du`：此命令检索目录和文件的磁盘使用情况。\n\n注意。你还可以利用 `/proc/` 目录获取有关硬件的各种信息，例如\
  \ CPU、RAM、中断等。\n\n让我们查看 Centos 系统中的 `lscpu` 命令。参考图 1.19：\n\n![](img/Figure_1.19.png)\n\
  \n图 1.19：`lscpu` 命令的输出\n\n从上述输出中显示了关于 CPU 的信息，如架构、供应商、每个插槽的核心等。\n\n现在，让我们查看 Ubuntu\
  \ 系统中的 `lsblk` 命令，如图 1.20 所示：\n\n![](img/Figure_1.20.png)\n\n图 1.20：`lsblk` 命令的输出\n\
  \n我们可以看到各种块设备的相应挂载点、大小和类型。\n\n继续块设备之旅，我们将使用 `blkid` 命令查看属性，如我们 CentOS 系统上的图 1.21\
  \ 所示：\n\n![](img/Figure_1.21.png)\n\n图 1.21：`blkid` 命令的输出\n\n块设备显示了 UUID 和标签。\n\n\
  现在，让我们使用 `lspci` 命令查看我们的 PCI 信息，例如主机、PCI、ISA 等，如图 1.22 所示：\n\n![](img/Figure_1.22.png)\n\
  \n图 1.22：`lspci` 命令的输出\n\n要查看 USB 设备的信息，我们可以利用 `lsusb` 命令，如图 1.23 所示：\n\n![](img/Figure_1.23.png)\n\
  \n图 1.23：`lsusb` 命令的输出\n\n当我们想要查看当前加载的模块时，可以利用 `lsmod` 命令，如图 1.24 所示：\n\n![](img/Figure_1.24.png)\n\
  \n图 1.24：`lsmod` 命令的输出\n\n\n\n\n\n`free` 命令可查看系统中的 RAM。如果不带任何选项使用，在 Linux 和大多数操作系统中，默认将以\
  \ Kibibytes（KiB）为单位显示。一个 kibibyte 等于 1024 或 `2¹⁰` 字节。kilobyte（KB）也是 1024 字节，但存在例外。根据国际单位制的定义，前缀\
  \ `kilo` 指 1000 或 `10³`。大多数存储制造商以 10 进制测量和标记容量（1 kilobyte = 1000 字节；1 megabyte =\
  \ 1000 kilobytes；1 gigabyte = 1000 megabytes；1 terabyte = 1000 gigabytes）。然而，RAM\
  \ 厂商和大多数操作系统使用 2 进制（1 kilobyte = 1024 字节；1 megabyte = 1024 kilobytes；1 gigabyte\
  \ = 1024 megabytes；1 terabyte = 1024 gigabytes）。我们可以使用 `-g` 选项以 Gibibytes（GiB）为单位计算，或使用\
  \ `-m` 选项以 Mebibytes（MiB）为单位显示 RAM，如图 1.25 所示：\n\n![](img/Figure_1.25.png)\n\n图\
  \ 1.25:`free` 命令的输出\n\n要获取有关系统硬件的更多信息，还有另一个有用命令 `hwinfo`，如图图 1.26 所示：\n\n![](img/Figure_1.26.png)\n\
  \n图 1.26：使用 `--short` 选项的 `hwinfo` 输出\n\n如上所示，输出将超出屏幕。使用 `--short` 选项显示硬件概览。\n\n\
  我们可以使用 `disk`、`memory`、`network` 等关键字查看特定硬件。\n\n此示例显示了硬盘信息，如图图 1.27 所示：\n\n![](img/Figure_1.27.png)\n\
  \n图 1.27：使用 `--disk` 选项的 `hwinfo` 输出\n\n下图显示了内存特定的硬件信息：\n\n![](img/Figure_1.28.png)\n\
  \n图 1.28：使用 `--memory` 选项的 `hwinfo` 输出\n\n我们可以利用 `df` 命令查看文件系统的磁盘空间使用情况。使用 `-h`\
  \ 以易读的格式显示，如图图 1.29 所示：\n\n![](img/Figure_1.29.png)\n\n图 1.29：使用 `-h` 选项的 `df` 输出\n\
  \n如果我们想查看目录的磁盘占用情况，可以利用 `du` 命令；添加 `-h` 选项将以易读的格式显示值，如图图 1.30 所示：\n\n![](img/Figure_1.30.jpg)\n\
  \n图 1.30：使用 `-h` 选项的 `du` 输出\n\n## 统一引导加载程序 2\n\n统一引导加载程序 2（`GRUB2`）是一种广泛用于基于 Linux\
  \ 的操作系统的开源引导加载程序。它在启动过程中起着至关重要的作用，允许用户选择并启动其首选的计算机操作系统。\n\n`GRUB2` 的主要目的是将操作系统内核加载到内存中并将控制权交给它。引导菜单提供了一个用户友界面，用户可以在其中从多个安装的操作系统或不同的启动选项进行选择。`GRUB2`\
  \ 支持多种操作系统，包括 Linux 发行版、BSD 和 Windows。\n\n`GRUB2` 相比其前身版本 `GRUB Legacy` 的关键改进之一是其增强的灵活性和兼容性。`GRUB2`\
  \ 支持基本输入输出系统（BIOS）和统一扩展固件接口（UEFI）引导模式，使其能够兼容各种硬件平台。它还支持多种文件系统，如 `ext4`、`Btrfs`、`XFS`\
  \ 和 `NTFS`，使其能够处理不同的存储配置。\n\n`GRUB2` 采用模块化架构，由核心镜像和动态加载的模块组成。核心镜像包含了启动所需的本质功能，如磁盘访问、文件系统驱动和菜单处理。可以在运行时加载额外的模块，以提供特定文件系统或硬件设备的额外功能和支持。这种模块化设计使其具有活性且易于扩展。\n\
  \n`GRUB2` 的安装和配置可能根据 Linux 发行版有所不同。通常，安装过程涉及安装 `GRUB2` 包并将其配置为默认引导加载程序。在安装期间，它会将核心镜像和必要的模块复制到引导分区，或者在\
  \ UEFI 系统中复制到 EFI 系统分区。\n\n`GRUB2` 的主配置文件是 `grub.cfg`，位于 `/boot/grub` 目录。该文件包含引导菜单项，指定了每个操作系统的内核位置、初始\
  \ RAM 磁盘和其他启动参数。用户可以手动修改此文件以自定义引导菜单、更改默认选项、设置超时值并实施密码保护等高级功能。\n\n`GRUB2` 的自定义选项不仅限于配置文件。用户可以通过修改主题和添加背景图像来自定义引导菜单的外观。它还支持脚本，允许用户自动化启动任务、创建条件语句并执行高级配置。此外，用户可以在\
  \ `GRUB2` 引导菜单中添加/删除其他 Linux 内内核操作系统（如 Microsoft Windows）。\n\n除了基本功能外，`GRUB2` 还提供了高级功能。它提供命令行界面，允许用户直接与引导加载程序交互。该界面可以帮助诊断启动问题、动态修改启动选项并执行系统维护任务。\n\
  \n它还支持安全启动（Secure Boot），这是 UEFI 系统中的一项功能，通过验证启动过程的完整性来防止未经授权的代码执行。`GRUB2` 可以配置为与安全启动无缝工作，确保系统安全可靠地启动。\n\
  \n救援模式和恢复选项等功能使得 `GRUB2` 相关问题的排查变得简单。在配置错误或启动失败的情况下，用户可以进入救援模式访问命令行界面并尝试手动修复问题。`GRUB2`\
  \ 还提供了在发生严重故障时重新安装或恢复引导加载程序的工具。\n\n此外，`GRUB2` 支持一些高级主题，如网络启动（Network Booting，允许通过网络启动操作系统）和虚拟化（允许直接从引导菜单启动虚拟机）。\n\
  \n`GRUB2` 随着不断的开发和增强持续演进。GNU 项目对其进行维护，并受益于开源社区的贡献。它定期引入新功能、错误修复和改进，以应对不断出现的技术、硬件进展和用户需求。\n\
  \n我们可以查看 Ubuntu 系统上的 `GRUB2` 配置文件。考虑图 1.31：\n\n![](img/Figure_1.31.png)\n\n图 1.31：`/boot/grub/grub.cfg`\
  \ 的内容\n\n为了简洁起见，省略了上述部分输出。每个条目都有 `BEGIN` 和 `END` 注释。菜单项代表启动选项（内核、Windows OS 版本），它们会在系统启动时显示在引导屏幕上，如图图\
  \ 1.32 所示：\n\n![](img/Figure_1.32.png)\n\n图 1.32：`/boot/grub/grub.cfg` 的内容\n\n在我们的\
  \ CentOS 系统上，grub 配置文件位于 `/boot/grub2/grub.cfg`，如图图 1.33 所示：\n\n![](img/Figure_1.33.png)\n\
  \n图 1.33：`/boot/grub2/grub.cfg` 的内容\n\n## 使用 GRUB2\n\n我们可以添加自定义的引导项，首先我们得创建一个自定义引导文件并将其保存在\
  \ `/etc/grub.d/40_custom` 文件中。我们将使用 Ubuntu 系统进行演示，如图图 1.34 所示：\n\n![](img/Figure_1.34.png)\n\
  \n图 1.34：`/etc/grub.d/40_custom` 配置文件的内容\n\n我们将使用文本编辑器编辑此文件，在底部添加我们的条目并保存更改。\n\n\
  考虑图 1.35：\n\n![](img/Figure_1.35.png)\n\n图 1.35：编辑 `/etc/grub.d/40_custom` 配置文件\n\
  \n\n\n\n\n基于上述输出，该条目定义了启动项参数。下一步是运行 `grub-mkconfig` 命令，它将写入更改，使得 `/boot/grub/grub.cfg`\
  \ 知晓我们自定义条目的的存在。参考图 1.36：\n\n![](img/Figure_1.36.png)\n\n图 1.36：`grub-mkconfig`\
  \ 命令的输出\n\n为了简洁起见，省略了一些输出。最后，我们将增加 `/etc/default/grub` 配置文件中的计时器值，以便在重启时看到启动屏幕。`GRUB_TIMEOUT`\
  \ 目前设置为 0，如图 1.37 所示：\n\n![](img/Figure_1.37.png)\n\n图 1.37：`/etc/default/grub`\
  \ 配置文件的内容\n\n我们将 `GRUB_TIMEOUT=0` 更改为 `GRUB_TIMEOUT=10`，并将 `GRUB_TIMEOUT_STYLE=hidden`\
  \ 的值更改为 `GRUB_TIMEOUT_STYLE=menu`，如图 1.38 所示：\n\n![](img/Figure_1.38.png)\n\n图 1.38：修改了值后的\
  \ `/etc/default/grub` 配置文件\n\n现在，让我们如图 1.39 所示运行 `update-grub` 命令：\n\n![](img/Figure_1.39.png)\n\
  \n图 1.39：`update-grub` 命令的输出\n\n重启后，我们可以看到如图 1.40 所示列出的新新启动条目：\n\n![](img/Figure_1.40.png)\n\
  \n图 1.40：GRUB2 启动菜单的输出\n\n总之，GRUB2 是一种强大且多功能的引导加载器，对于基于 Linux 的系统的启动过程至关重要。它灵活的架构、对各种硬件平台的兼容性、丰富的自定义选项以及高级功能，使其成为\
  \ Linux 生态系统中启动管理的首选。\n\n结论\n\n在本章中，我们涵盖了 Linux 文件系统层次结构标准、定位硬件信息，并通过操作 GRUB2 完成了本章。\n\
  \n在下一章中，我们将介绍文件、目录和存储。\n\n加入我们书籍的 Discord 空间\n\n加入书籍 Discord 工作区获取最新更新、优惠、全球科技动态、新发布以及与作者互动：\n\
  \n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\n![](img/fm1.png)\n\
  \n# 第 2 章 文件、目录和存储](#contents.xhtml_ch02a)\n\n## 引言\n\n在上一章中，我们涵盖了组成 Linux 文件系统层次结构标准\
  \ (FHS) 的各种目录。之后，我们查看了从终端环境获取硬件信息的方法。最后，我们通过 GRUB2 结束了学习。\n\n在本章中，我们将重点关注文件、目录和存储。首先，我们将查看文件压缩，然后介绍文件和目录操作。随后，我们将涵盖文件系统管理。最后，我们将通过逻辑卷管理\
  \ (LVM) 结束本章。\n\n## 结构\n\n我们将在本章讨论以下主题：\n\n*   文件压缩\n*   文件和目录操作\n*   管道和重定向\n*\
  \   文件系统管理\n*   使用 `parted` 实用\n*   格式化硬盘的步骤\n*   挂载和卸载分区\n*   逻辑卷管理\n\n## 目标\n\n\
  本章将教我们如何操作和管理文件及目录。我们将详细学习文件压缩以及文件和目录操作。我们还将关注存储配置。\n\n## 文件压缩\n\n文件压缩是减小文件和目录大小以节省存储空间、提高传输速度并简化文件的过程。在\
  \ Linux 中，有各种压缩算法和工具可以完成这项任务。\n\n### 压缩算法\n\nLinux 提供了几种压缩算法，每种都有自己的特点和权衡。以下是一些常用的：\n\
  \n*   `Gzip`：它使用 `DEFLATE` 算法，并在 Linux 上被广泛支持。它将文件压缩为带有 `.gz` 扩展名的单个存档。使用 `gzip`\
  \ 压缩文件时请使用以下命令：\n\n    ```\n    gzip file.txt\n    ```\n    这创建一个名为 `file.txt.gz`\
  \ 的压缩文件。\n\n*   `Bzip2`：它利用 `Burrows-Wheeler Transform` 和 `Run-Length Encoding`\
  \ 算法。它提供了比 `gzip` 更压缩率，但需要更多的处理时间。使用 `bzip2` 压缩文件时使用命令：\n\n    ```bash\n    bzip2\
  \ file.txt\n    ```\n    这创建一个名为 `file.txt.bz2` 的压缩文件。\n\n*   `Xz`：它采用 `LZMA/LZMA2`\
  \ 算法，提供了比 `bzip2` 更好的压缩率。它特别适用于压缩大文件。使用 `xz` 压缩文件时使用命令：\n\n    ```bash\n    xz file.txt\n\
  \    ```\n    这创建一个名为 `file.txt.xz` 的压缩文件。\n\n*   `Zip`：这是一个与各种操作系统兼容的流行压缩格式。它支持将多个文件和目录压缩成单个存档。创建\
  \ zip 存档时，使用命令：\n\n    ```bash\n    zip archive.zip file1.txt file2.txt\n    ```\n\
  \    这创建一个名为 `archive.zip` 的存档，包含 `file1.txt` 和 `file2.txt`。\n\n### 压缩文件\n\n使用 Linux\
  \ 压缩工具压缩文件，需要使用特定的命令。以下是一些示例：\n\n*   `gzip`\n    `gzip file.txt`：使用 `gzip` 压缩 `file.txt`\
  \ 并创建 `file.txt.gz`。\n*   `bzip2`\n    `bzip2 file.txt`：使用 `bzip2` 压缩 `file.txt`\
  \ 并创建 `file.txt.bz2`。\n*   `xz`\n    `xz file.txt`：使用 `xz` 压缩 `file.txt` 并创建 `file.txt.xz`。\n\
  *   `zip`\n    `zip archive.zip file1.txt file2.txt`：创建一个名为 `archive.zip` 的 zip\
  \ 存档，包含 `file1.txt` 和 `file2.txt`。\n\n### 压缩目录\n\nLinux 允许你在压缩整个目录的同时保留其结构。以下是压缩目录的示例：\n\
  \n*   `gzip`\n    `tar -czf archive.tar.gz directory/`：通过 `gzip` (`-z`) 压缩目录 (`-f`)\
  \ 创建名为 `archive.tar.gz` 的 tar 包 (`-c`)。\n*   `bzip2`\n    `tar -cjf archive.tar.bz2\
  \ directory/`：通过 `bzip2` (`-j`) 压缩目录创建名为 `archive.tar.bz2` 的 tar 包。\n*   `xz`\n\
  \    `tar -cJf archive.tar.xz directory/`：通过 `xz` (`-J`) 压缩目录创建名为 `archive.tar.xz`\
  \ 的 tar 包。\n*   `zip`\n    `zip -r archive.zip directory/`：递归 (`-r`) 压缩目录及其内容创建一个名为\
  \ `archive.zip` 的 zip 存档。\n\n### 解压文件和目录\n\n一旦文件或目录被压缩，就可以被解压回原始状态。以下是解压的示例：\n\n\
  *   `gzip`\n    `gunzip file.txt.gz`：使用 `gzip` 解压 `file.txt.gz`。\n*   `bzip2`\n\
  \    `bunzip2 file.txt.bz2`：使用 `bzip2` 解压 `file.txt.bz2`。\n*   `xz`\n    `unxz file.txt.xz`：使用\
  \ `xz` 解压 `file.txt.xz`。\n*   `zip`\n    `unzip archive.zip`：解压 `archive.zip` 并提取其内容。\n\
  \n### 高级压缩技术\n\nLinux 为文件压缩提供了额外的选项和技术。一些显著的包括：\n\n*   **存档 (Archive)**：在一步中结合压缩和存档，你可以直接创建压缩\
  \ tar 包。\n    例如，`tar -czf archive.tar.gz file1.txt file2.txt`。\n*   **压缩级别**：压缩工具通常提供不同的压缩级别，允许你优先考虑压缩率或处理速度。\n\
  \    例如，`gzip -9 file.txt` 为 `gzip` 设置最高压缩级别。\n*   **并行压缩**：某些压缩工具支持并行压缩，利用多个处理器内核来加速压缩和解压。\n\
  \    例如，`pigz file.txt` 是 `gzip` 的并行实现。\n*   **流压缩**：Linux 允许对数据流进行实时压缩，这对于高效传输或备份场景非常有用。\n\
  \    例如，`tar cf - directory/ | gzip > archive.tar.gz` 直接创建 `archive.tar.gz` 压缩 tar\
  \ 包，无需创建中间文件。\n\n### 使用压缩库进行压缩\n\n\n\n\nLinux 还提供了压缩库，这些库可以用于 C、C++ 和 Python 等编程语言。一些流行的库包括\
  \ `zlib`、`libbz2` 和 `lzma-sdk`。这些库允许开发者将压缩功能集成到自己的软件应用程序中。\n\n## 文件和目录操作\n\n首先，我们需要熟悉在命令行界面（CLI）中工作。在之前的章节中，我们一直在与\
  \ shell 交互。现在，我们想要提高 CLI 技能的效率。当我们第一次打开终端时，会被放置在用户的家目录中。如下所示：\n\n```\nphilip@localhost\
  \ ~]$\n```\n\n从上述输出可以看出，我们处于用户 Philip 的家目录中。可以通过执行 `pwd` 命令来确认这一点：\n\n```\nphilip@localhost\
  \ ~]$ pwd\n/home/philip\nphilip@localhost ~]$\n```\n\n从上述输出中，我们已经确认确实在 `/home/philip`\
  \ 目录下。然而，更有意思的还在后面。在 `/home/philip` 内部有各种目录。我们可以通过 `ls` 命令来确认这一点：\n\n```\nphilip@localhost\
  \ ~]$ ls\nDesktop Documents Downloads Music Pictures Public Templates Videos\nphilip@localhost\
  \ ~]$\n```\n\n从上述输出中，列出的目录（也称为文件夹）是为系统中的每个用户创建的。现在，目录的的方式并没有告诉我们太多信息。要进一步深入研究，我们可以再次执行\
  \ `ls` 命令，但这次我们将传递 `-l` 选项：\n\n```\nphilip@localhost ~]$ ls -l\ntotal 32\ndrwxr-xr-x.\
  \ 2 philip philip 4096 Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip philip 4096 Jul\
  \ 31 14:59 Documents\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Downloads\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Pictures\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Public\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Templates\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Videos\nphilip@localhost ~]$\n```\n\n从上述输出中，我们获得了一些有用信息。例如，每个目录都有权限；此外，我们还可以看到所有者和大小等。此外，在\
  \ Linux 中，我们有所谓的隐藏文件/文件夹。默认情况下，当我们进行列出操作时它们不会显示；我们需要额外标记 `-a` 选项：\n\n```\nphilip@localhost\
  \ ~]$ ls -al\ndrwx------. 15 philip philip 4096 Aug 2 10:28 .\ndrwxr-xr-x. 3 root\
  \ root 4096 Jul 31 14:58 ..\n-rw-r--r--. 1 philip philip 18 Mar 15 09:56 .bash_logout\n\
  -rw-r--r--. 1 philip philip 193 Mar 15 09:56 .bash_profile\n-rw-r--r--. 1 philip\
  \ philip 231 Mar 15 09:56 .bashrc\ndrwx------. 14 philip philip 4096 Jul 31 14:59\
  \ .cache\ndrwx------. 14 philip philip 4096 Jul 31 14:59 .config\ndrwxr-xr-x. 2\
  \ philip philip 4096 Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip philip 4096 Jul\
  \ 31 14:59 Documents\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Downloads\n\
  -rw-------. 1 philip philip 16 Jul 31 14:58 .esd_auth\n-rw-------. 1 philip philip\
  \ 620 Aug 2 10:28 .ICEauthority\ndrwx------. 3 philip philip 4096 Jul 31 14:59 .local\n\
  drwxr-xr-x. 4 philip philip 4096 Apr 25 02:33 .mozilla\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Pictures\n\
  drwxrrw----. 3 philip philip 4096 Jul 31 14:59 .pki\nphilip@localhost ~]$\n```\n\
  \n我们判断一个文件或目录是否隐藏的方法是看它们的文件或文件夹名称前是否以点开头。要在目录之间移动，我们应该使用 `cd` 命令。切换目录（`CD`）允许我们在\
  \ Linux 文件系统中导航。所以，让我们移动 `/home/philip/Documents`。我们将使用以下代码：\n\n```\nphilip@localhost\
  \ ~]$ cd /home/philip/Documents\nphilip@localhost Documents]$\n```\n\n还有另一种在目录之间移动的方法。我们使用的第一种方法被称为绝对路径，意味着我们指定了目录的完整路径。移动目录的下种方法是指定相对路径：\n\
  \n```\nphilip@localhost ~]$ cd Documents/\nphilip@localhost Documents]$\n```\n\n\
  注意：你需要位于子目录的父目录下，相对方法才能生效。\n\n一旦我们进入了子目录，就可以运行 `ls` 命令：\n\n```\nphilip@localhost\
  \ Documents]$ ls\nphilip@localhost Documents]$ even\n```\n\n当前，该目录下没有内容。要返回父目录，我们可以以这种方式使用\
  \ `cd` 命令：\n\n```\nphilip@localhost Documents]$ cd /home/philip\nphilip@localhost\
  \ ~]$ pwd\n/home/philip\nphilip@localhost ~]$\n```\n\n从上述输出中，我们指定了路径。这种方法始终有效。我们也可以以这种方式使用\
  \ `cd` 命令：\n\n```\nphilip@localhost Documents]$ cd ..\nphilip@localhost ~]$\n```\n\
  \n使用上述方法时，我们使用了双点。双点表示父目录。如果我们指定单点，那么结果将是：\n\n```\nphilip@localhost Documents]$\
  \ cd .\nphilip@localhost Documents]$\n```\n\n单点引用当前目录本身。最后一种方法可以在任何位置的目录中使用：\n\n\
  ```\nphilip@localhost Documents]$ cd ~\nphilip@localhost ~]$\n```\n\n波浪号（`~`）字符始终带我们回到用户的家目录。为了说明这一点，我们将进入\
  \ `/etc` 目录：\n\n```\nphilip@localhost ~]$ cd /etc\nphilip@localhost etc]$ pwd\n\
  /etc\nphilip@localhost etc]$\n```\n\n现在再次执行 `cd` 命令并传递波浪号（`~`）：\n\n```\nphilip@localhost\
  \ etc]$ cd ~\nphilip@localhost ~]$ pwd\n/home/philip\nphilip@localhost ~]$\n```\n\
  \n我们可以看到波浪号字符的力量。文件层次结构的顶端是根。我们通常将根称为 `/`；这不要与 `/root` 目录混淆。后者是 root 用户的家目录。从 `/`\
  \ 开始，创建了所有其他目录。我们可以通过以下方式进入 `/`：\n\n```\nphilip@localhost ~]$ cd /\nphilip@localhost\
  \ /]$ pwd\n/\nphilip@localhost /]$\n```\n\n从上述可以看出，我们位于文件系统的根部。我们可以像其他目录一样查看此目录：\n\
  \n```\nphilip@localhost /]$ ls\nbin dev home lib64 media opt root sbin sys usr\n\
  boot etc lib lost+found mnt proc run srv tmp var\nphilip@localhost /]$\n```\n\n\
  你会发现这里有一些熟悉的目录，例如 `/home`、`/dev` 等。有趣的是，我们看到了列出的 `/root` 目录。我们可以切换到该目录并列出内容：\n\n\
  ```\nphilip@localhost /]$ cd /root\nbash: cd /root: Permission denied\nphilip@localhost\
  \ /]$\n```\n\n之所以得到这个错误是因为我们没有查看 `/root` 目录。让我们以 root 身份验证并重试：\n\n```\nroot@localhost\
  \ /]# cd /root\nroot@localhost ~]#\n```\n\n我们进入了 `/root` 目录。这次列运行时我们会立即注意到这不是 `/`\
  \ 目录：\n\n```\nroot@localhost ~]# ls\nanaconda-ks.cfg\nroot@localhost ~]#\n```\n\n\
  根据上述输出，导航目录结构是直观的。\n\n## 创建、复制、移动、重命名、删除文件\n\n这一节听起来很绕口。不用担心；我们每天都在处理文件。我们可以在 `/home/philip/Documents/NewTest`\
  \ 目录下使用 `ls` 命令：\n\n```\nphilip@localhost Documents]$ cd NewTest/\nphilip@localhost\
  \ NewTest]$ ll -a\ntotal 8\ndrwxrwxr-x. 2 philip philip 4096 Aug 6 12:04 .\ndrwxr-xr-x.\
  \ 3 philip philip 4096 Aug 6 13:45 ..\nphilip@localhost NewTest]$\n```\n\n当前，该目录下没有任何文件。在\
  \ Linux 中，我们可以从 shell 创建文件；我们将使用 `touch` 命令完成这一操作：\n\n```\nphilip@localhost NewTest]$\
  \ touch OurFile\nphilip@localhost NewTest]$ ll\ntotal 0\n-rw-rw-r--. 1 philip philip\
  \ 0 Aug 6 13:52 OurFile\nphilip@localhost NewTest]$\n```\n\n\n\n\n当我们创建该文件时，它是使用某些默认权限创建的。值得注意的是，`(-rw-rw-r--)`\
  \ 部分表示用户 `(-rw)`、组 `(-rw)` 以及其他用户 `(-r--)`。第一个横线（`-`）引用文件类型。在这种情况下，它是一个普通文件。`(rw-)`\
  \ 意味着用户/所有者具有读写权限。第二组 `(rw-)` 意味着组也具有读取和执行权限。最后，`(r--)` 意味着其他/所有人具有读取权限。此外，显示 `philip\
  \ philip` 的部分指的是文件的所有者以及该文件所属的组。\n\n我们要更改这些文件的权限；将使用 `chmod` 命令。假设我们想给其他人/所有人 `(read\
  \ and write)`（读取和写入）权限。命令如下：\n\n```bash\n[philip@localhost NewTest]$ chmod o+w OurFile\n\
  [philip@localhost NewTest]$ ll\ntotal 0\n-rw-rw-rw-. 1 philip philip 0 Aug 6 13:52\
  \ OurFile\n[philip@localhost NewTest]$\n```\n\n现在我们可以看到其他用户的权限是 `(rw-)`。更改权限还有另一种方法，而不是使用\
  \ `(o+w)`。我们可以使用数值。我们将使用数字格式将其他用户的权限恢复为 `(r--)`：\n\n```bash\n[philip@localhost NewTest]$\
  \ chmod 664 OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rw-rw-r--. 1 philip\
  \ philip 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n按照我们的理解，`(644)`\
  \ 意味着：`(6 -read and write, 6 -read and write, 4 -read)`。第一个数字是用户的占位符。第二个数字是组的占位符，最后一个数字是其他用户的占位符。为了进一步说明这一点，我们可以去掉组的\
  \ `(read)` 权限并保留 `(write)` 权限：\n\n```bash\n[philip@localhost NewTest]$ chmod 624\
  \ OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rw--w-r--. 1 philip philip\
  \ 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n同样，我们可以通过增加值来添加权限。让我们选择其他人；我们将给其他人\
  \ `(read and execute)`（读取和执行）权限：\n\n```bash\n[philip@localhost NewTest]$ chmod 625\
  \ OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rw--w-r-x. 1 philip philip\
  \ 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n我们甚至可以在一条命令中为用户、组或其他人赋予所有\
  \ `(read, write, and execute)`（读取、写入和执行）权限。让我们从用户开始：\n\n```bash\n[philip@localhost\
  \ NewTest]$ ll\ntotal 0\n-rwx-w-r-x. 1 philip philip 0 Aug 6 13:52 OurFile\n[philip@localhost\
  \ NewTest]$\n```\n\n现在我们可以看到用户拥有 `(read, write and execute)`（读取、写入和执行）权限。通过相加 `(read\
  \ =4, write=2, execute=1)`，我们得到了 `7` 的值。现在我们将给组所有权限：\n\n```bash\n[philip@localhost\
  \ NewTest]$ chmod 775 OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rwxrwxr-x.\
  \ 1 philip philip 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n我们也可以在一条命令中撤销用户、组或其他人的所有权限。让我们移除其他人的\
  \ `(read, write, and execute)`（读取、写入和执行）权限：\n\n```bash\n[philip@localhost NewTest]$\
  \ chmod 770 OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rwxrwx---. 1 philip\
  \ philip 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n通过放置零 `(0)`，这抵消了\
  \ `(user, group, others)` 部分的所有权限。我们可以看到权限的力量。同样，我们可以像之前看到那样使用字母。`(u)` 表示用户，`(g)`\
  \ 表示组，`(o)` 表示其他用户。我们可以这样撤销组的 `(execute)` 权限：\n\n```bash\n[philip@localhost NewTest]$\
  \ chmod g-x OurFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rwxrw----. 1 philip\
  \ philip 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$\n```\n\n我们将使用加号 `(+)`\
  \ 符号添加权限或使用减号 `(-)` 符号移除权限。我们还可以将文件从一个位置复制到另一个位置或同一位置内部。如果文件的目标位置与源文件位于同一位置，则需要赋予不同的名称。`cp`\
  \ 命令用于复制。我们将创建的文件复制一份并放在 `/home/philip/Documents/`：\n\n```bash\n[philip@localhost\
  \ NewTest]$ cp OurFile /home/philip/Documents/NewFile\n[philip@localhost NewTest]$\
  \ ll /home/philip/Documents/\n-rwxrw----. 1 philip philip 0 Aug 6 14:34 NewFile\n\
  drwxrwxr-x. 2 philip philip 4096 Aug 6 13:52 NewTest\n[philip@localhost NewTest]$\n\
  ```\n\n注意：目录的权限前都有一个 `(d)`。\n\n我们还可以移动文件；`mv` 命令用于移动文件。让我们将 `/home/philip/Documents/NewFile`\
  \ 移动到 `/home/philip/Documents/NewTest` 内部：\n\n```bash\n[philip@localhost NewTest]$\
  \ mv /home/philip/Documents/NewFile .\n[philip@localhost NewTest]$ ll\n-rwxrw----.\
  \ 1 philip philip 0 Aug 6 14:34 NewFile\n-rwxrw----. 1 philip philip 0 Aug 6 13:52\
  \ OurFile\n[philip@localhost NewTest]$\n```\n\n现在我们在这里使用的方法是为位置指定一个点 `(.)`。这意味着当前工作目录；因此，我们不需要输入完整的目标路径，只需使用点\
  \ `(.)`即可。\n\n我们还可以使用 `mv` 命令重命名文件。让我们重命名 `NewFile`：\n\n```bash\n[philip@localhost\
  \ NewTest]$ mv NewFile RenameFile\n[philip@localhost NewTest]$ ll\ntotal 0\n-rwxrw----.\
  \ 1 philip philip 0 Aug 6 13:52 OurFile\n-rwxrw----. 1 philip philip 0 Aug 6 14:34\
  \ RenameFile\n[philip@localhost NewTest]$\n```\n\n我们还可以重命名文件并将其放置在另一个目录中；我们将：\n\n\
  ```bash\n[philip@localhost NewTest]$ mv RenameFile /home/philip/Documents/\n[philip@localhost\
  \ NewTest]$ ll\n-rwxrw----. 1 philip philip 0 Aug 6 13:52 OurFile\n[philip@localhost\
  \ NewTest]$\n```\n\n该文件不再当前目录中，而是在 `/home/philip/Documents` 目录中：\n\n```bash\n[philip@localhost\
  \ NewTest]$ ll /home/philip/Documents/\ntotal 4\ndrwxrwxr-x. 2 philip philip 4096\
  \ Aug 6 14:57 NewTest\n-rwxrw----. 1 philip philip 0 Aug 6 14:34 RenameFile\n[philip@localhost\
  \ NewTest]$\n```\n\n我们还可以使用 `rm` 命令删除文件。让我们删除 `/home/philip/Documents/NewTest/OurFile`：\n\
  \n```bash\n[philip@localhost NewTest]$ ll\ntotal 0\n-rwxrw----. 1 philip philip\
  \ 0 Aug 6 13:52 OurFile\n[philip@localhost NewTest]$ rm OurFile\n[philip@localhost\
  \ NewTest]$ ll\ntotal 0\n[philip@localhost NewTest]$\n```\n\n## 创建和删除目录\n\n我们可以使用另一个常用的命令创建目录。`mkdir`\
  \ 命令将用于创建目录。让我们使用 `ls` 命令列出：\n\n```bash\n[philip@localhost ~]$ ls\nDesktop Downloads\n\
  [philip@localhost ~]$\n```\n\n现在，让我们在 `/home/philip` 下创建我们的目录：\n\n```bash\n[philip@localhost\
  \ ~]$ mkdir NewTest\n[philip@localhost ~]$ ll\ntotal 36\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Documents\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Pictures\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Templates\n\
  drwxrwxr-x. 2 philip philip 4096 Aug 6 12:04 NewTest\n[philip@localhost ~]$\n```\n\
  \n从上面可以看出，我们的新目录在底部。你还会注意到我们使用了 `ll` 命令；这是 `ls -l` 命令的一个别名。这可以通过 `which` 命令快速验证：\n\
  \n```bash\nphilip@localhost ~]$ which ll\nalias ll='ls -l --color=auto'\n/usr/bin/ls\n\
  [philip@localhost ~]$\n```\n\n太棒了！我们可以使用 `cd` 命令进入新创建的目录：\n\n```bash\n[philip@localhost\
  \ ~]$ cd NewTest/\n[philip@localhost NewTest]$ ls\n[philip@localhost NewTest]$ pwd\n\
  /home/philip/NewTest\n[philip@localhost NewTest]$\n```\n\n接下来，假设我们创建了一个目录并拼错了字；不用担心，因为我们可以再次利用\
  \ `mv` 命令，它具有重命名目录的能力。让我们尝试重命名 `/home/Test` 目录：\n\n```bash\n[philip@localhost NewTest]$\
  \ pwd\n/home/philip/Documents/NewTest\n[philip@localhost NewTest]$ mv /home/philip/Documents/NewTest/\
  \ /home/philip/\n```\n\n\n\n\n\n```bash\n[philip@localhost NewTest]$ pwd\n/home/philip/Documents/NewTest\n\
  [philip@localhost NewTest]$\n```\n\n我们遇到这个错误是因为我们正处于该目录内部。让我们尝试使用 `-v` 选项执行命令：\n\
  \n```bash\n[philip@localhost NewTest]$ mv -v /home/philip/Documents/NewTest/ /home/philip/\n\
  mv: cannot stat '/home/philip/Documents/NewTest/'\n[philip@localhost NewTest]$\n\
  ```\n\n为了解决这个问题，我们需要退出出该目录，然后重试 `mv` 命令：\n\n```bash\n[philip@localhost ~]$ mv /home/philip/Documents/NewTest/\
  \ .\n[philip@localhost ~]$ ll\ntotal 36\ndrwxr-xr-x. 2 philip philip 4096 Jul 31\
  \ 14:59 Desktop\ndrwxr-xr-x. 2 philip philip 4096 Aug 6 15:12 Documents\ndrwxr-xr-x.\
  \ 2 philip philip 4096 Jul 31 14:59 Downloads\ndrwxr-xr-x. 2 philip philip 4096\
  \ Jul 31 14:59 Music\ndrwxrwxr-x. 2 philip philip 4096 Aug 6 15:00 NewTest\ndrwxr-xr-x.\
  \ 2 philip philip 4096 Jul 31 14:59 Pictures\ndrwxr-xr-x. 2 philip philip 4096 Jul\
  \ 31 14:59 Public\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Templates\ndrwxr-xr-x.\
  \ 2 philip philip 4096 Jul 31 14:59 Videos\n[philip@localhost ~]$\n```\n\n现在 `NewTest`\
  \ 目录不再存在于 `/home/philip/Documents/` 中了，可以通过执行以下命令看到：\n\n```bash\n[philip@localhost\
  \ ~]$ ll Documents/\ntotal 0\n-rwxrw----. 1 philip philip 0 Aug 6 14:34 RenameFile\n\
  [philip@localhost ~]$\n```\n\n我们也可以使用 `mv` 命令来重命名目录。技巧在于是在调用 `mv` 命令时指定一个新的目录名称。操作操作如下：\n\
  \n```bash\n[philip@localhost ~]$ mv NewTest/ ReName\n[philip@localhost ~]$ ll\n\
  total 36\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip\
  \ philip 4096 Aug 6 15:12 Documents\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59\
  \ Downloads\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2\
  \ philip philip 4096 Jul 31 14:59 Pictures\ndrwxr-xr-x. 2 philip philip 4096 Jul\
  \ 31 14:59 Public\ndrwxrwxr-x. 2 philip philip 4096 Aug 6 15:00 ReName\ndrwxr-xr-x.\
  \ 2 philip philip 4096 Jul 31 14:59 Templates\ndrwxr-xr-x. 2 philip philip 4096\
  \ Jul 31 14:59 Videos\n[philip@localhost ~]$\n```\n\n重命名目录就是这么简单。我们还可以更改目录的权限。让我们取消组的（读、写、执行）权限：\n\
  \n```bash\n[philip@localhost ~]$ chmod -R 705 ReName/\n[philip@localhost ~]$ ll\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Aug 6 15:12 Documents\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Downloads\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Pictures\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Public\n\
  drwx---r-x. 2 philip philip 4096 Aug 6 15:00 ReName\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Templates\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Videos\n\
  [philip@localhost ~]$\n```\n\n`-R` 选项告诉 `chmod` 命令将权限应用到 `/home/philip/ReName` 目录内的所有内容。完成目录操作后，如果不再需要，我们可以将其删除。`rmdir`\
  \ 命令用于删除目录。让我们删除 `/home/philip/ReName` 目录：\n\n```bash\n[philip@localhost ~]$ rmdir\
  \ ReName/\n[philip@localhost ~]$ ll\ntotal 36\ndrwxr-xr-x. 2 philip philip 4096\
  \ Jul 31 14:59 Desktop\ndrwxr-xr-x. 2 philip philip 4096 Aug 6 15:12 Documents\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Downloads\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Music\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Pictures\n\
  drwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Public\ndrwxr-xr-x. 2 philip philip\
  \ 4096 Jul 31 14:59 Templates\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Videos\n\
  [philip@localhost ~]$\n```\n\n根据上述操作，没有遇到任何错误。这在你的环境中可能并非如此。通常情况下，你尝试删除的目录中会包含文件或其他目录。让我们快速创建一个目录并在其内部放置\
  \ 3 个文件。然后我们尝试删除该目录：\n\n```bash\n[philip@localhost ~]$ mkdir TempDir\n[philip@localhost\
  \ ~]$ ll\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Desktop\ndrwxrwxr-x. 2 philip\
  \ philip 4096 Aug 6 15:46 TempDir\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59\
  \ Templates\ndrwxr-xr-x. 2 philip philip 4096 Jul 31 14:59 Videos\n[philip@localhost\
  \ ~]$ touch TempDir/File1\n[philip@localhost ~]$ touch TempDir/File2\n[philip@localhost\
  \ ~]$ touch TempDir/File3\n[philip@localhost ~]$ ll TempDir/\ntotal 0\n-rw-rw-r--.\
  \ 1 philip philip 0 Aug 6 15:47 File1\n-rw-rw-r--. 1 philip philip 0 Aug 6 15:47\
  \ File2\n-rw-rw-r--. 1 philip philip 0 Aug 6 15:47 File3\n[philip@localhost ~]$\n\
  ```\n\n\n\n\n根据上述输出，我们在 `/boot` 目录中进行了搜索。空文件通常静静地留在目录中而不使用。我们可以使用 `find` 命令搜索空文件。传递\
  \ `-type` 选项是为了指定我们要搜索的内容：\n\n```bash\n[root@localhost philip]# find /home/philip/Documents\
  \ -empty\n/home/philip/Documents/RenameFile\n[root@localhost philip]#\n```\n\n然而，我们可以通过传递\
  \ `-delete` 选项来执行清理工作，删除 `find` 命令返回的任何文件。以下是操作方法：\n\n```bash\n[root@localhost philip]#\
  \ find /home/philip/Documents -empty -delete\n[root@localhost philip]# ll /home/philip/Documents\n\
  ls: cannot access '/home/philip/Documents': No such file or directory\n[root@localhost\
  \ philip]# ll\n```\n\n**注意：** 使用 `-delete` 选项时要小心，因为它会删除文件，在某些情况下甚至删除目录。在运行带有 `-delete`\
  \ 选项的 `find` 命令之前，请务必备份数据。\n\n从上述输出中你可以注意到，除了 `/home/philip/Documents` 目录外，`/home/philip/Documents/RenameFile`\
  \ 也被删除了。传递 `-delete` 选项时要非常小心。在我们的案例中这是一个实验室环境，但在真实系统中请记住这一点。在尝试传递 `-delete` 选项之前先进行备份。\n\
  \n我们还可以根据权限搜索文件或目录。我们将向 `find` 命令传递 `-readable`、`-writable`、`-executable` 选项。显示所示：\n\
  \n```bash\n[root@localhost philip]# find /etc/yum.repos.d/ -readable\n/etc/yum.repos.d/\n\
  /etc/yum.repos.d/fedora-updates.repo\n/etc/yum.repos.d/fedora.repo\n/etc/yum.repos.d/fedora-cisco-openh264.repo\n\
  /etc/yum.repos.d/fedora-updates-testing.repo\n[root@localhost philip]# ll /etc/yum.repos.d/\n\
  total 16\n-rw-r--r--. 1 root root 707 Apr 23 13:03 fedora-cisco-openh264.repo\n\
  -rw-r--r--. 1 root root 1331 Apr 23 13:03 fedora.repo\n-rw-r--r--. 1 root root 1392\
  \ Apr 23 13:03 fedora-updates.repo\n-rw-r--r--. 1 root root 1450 Apr 23 13:03 fedora-updates-testing.repo\n\
  [root@localhost philip]#\n```\n\n我们可以清楚地看到 `find` 命令的结果与具有读权限的文件列表匹配。同样，我们可以搜索具有执行权限的文件和目录：\n\
  \n```bash\n[root@localhost philip]# ll /etc/init.d/\ntotal 52\n-rw-r--r--. 1 root\
  \ root 18561 Jan 2 2018 functions\n-rwxr-xr-x. 1 root root 7288 Apr 25 02:39 livesys\n\
  -rwxr-xr-x. 1 root root 1054 Apr 25 02:39 livesys-late\n-rwxr-xr-x. 1 root root\
  \ 4334 Jan 2 2018 netconsole\n-rwxr-xr-x. 1 root root 7613 Jan 2 2018 network\n\
  -rw-r--r--. 1 root root 1161 Apr 18 17:59 README\n[root@localhost philip]# find\
  \ /etc/init.d/ -perm -o+x\n/etc/init.d/\n/etc/init.d/livesys\n/etc/init.d/livesys-late\n\
  /etc/init.d/netconsole\n/etc/init.d/network\n[root@localhost philip]#\n```\n\n根据上述输出，只显示了其他人具有执行权限的文件。\n\
  \n此外，我们还可以搜索具有写权限的文件和目录：\n\n```bash\n[root@localhost philip]# find /etc/init.d/\
  \ -perm -o+w\n[root@localhost philip]#\n```\n\n结果返回为空，因为没有任何文件或目录对其他人具有写权限。同样，我们可以使用数字进行搜索。我们可以查找类似执行权限的权限：\n\
  \n```bash\n[root@localhost philip]# find /etc/init.d/ -perm -005\n/etc/init.d/\n\
  /etc/init.d/livesys\n/etc/init.d/livesys-late\n/etc/init.d/netconsole\n/etc/init.d/network\n\
  [root@localhost philip]#\n```\n\n根据上述输出，我们只能看到显示了执行权限的目录。我们可以搜索具有写权限的文件和目录：\n\n\
  ```bash\n[root@localhost philip]# find /etc/init.d/ -perm -002\n[root@localhost\
  \ philip]#\n```\n\n结果符合预期，因为其他人没有写权限。同样，我们可以搜索组的写权限；操作方法如下：\n\n```bash\n[root@localhost\
  \ philip]# ll /etc/init.d/\ntotal 52\n-rw-r--r--. 1 root root 18561 Jan 2 2018 functions\n\
  -rwxr-xr-x. 1 root root 7288 Apr 25 02:39 livesys\n-rwxr-xr-x. 1 root root 1054\
  \ Apr 25 02:39 livesys-late\n-rwxr-xr-x. 1 root root 4334 Jan 2 2018 netconsole\n\
  -rwxr-xr-x. 1 root root 7613 Jan 2 2018 network\n-rw-r--r--. 1 root root 1161 Apr\
  \ 18 17:59 README\n[root@localhost philip]# find /etc/init.d/ -perm -020\n[root@localhost\
  \ philip]#\n```\n\n结果为空，因为这些组没有写权限。最后，我们可以搜索用户的写权限；这将带给我们：\n\n```bash\n[root@localhost\
  \ philip]# find /etc/init.d/ -perm -200\n/etc/init.d/\n/etc/init.d/functions\n/etc/init.d/livesys\n\
  /etc/init.d/README\n/etc/init.d/livesys-late\n/etc/init.d/netconsole\n/etc/init.d/network\n\
  [root@localhost philip]#\n```\n\n语法是 `-perm` 后后跟第一个数字=用户，第二个数字=组，最后一个数字=其他人。\n\n\
  另一种搜索文件和目录的流行方法是使用 `locate` 命令。与 `find` 实用相比，`locate` 工具在结果返回方面更快；这是因为 `locate`\
  \ 命令使用数据库进行查找。该数据库被称为 `mlocate`；我们可以对创建的文件进行简单搜索：\n\n```bash\n[philip@localhost\
  \ ~]$ locate TestFile\n[philip@localhost ~]$\n```\n\n根据上述输出，`locate` 命令没有识别到指定的文件。不用担心，我们只需要更新数据库：\n\
  \n```bash\n[philip@localhost ~]$ updatedb\nupdatedb: can not open a temporary file\
  \ for `/var/lib/mlocate/mlocate.db'\n[philip@localhost ~]$\n```\n\n如果你遇到这个错误，简单意味着你需要以\
  \ root 身份运行该命令：\n\n```bash\n[philip@localhost ~]$ su\nPassword:\n[root@localhost\
  \ philip]# updatedb\n[root@localhost philip]#\n```\n\n现在，让我们重新给定的文件尝试 `locate` 命令：\n\
  \n```bash\n[root@localhost philip]# locate TestFile\n/home/philip/Documents\n[root@localhost\
  \ philip]#\n```\n\n我们还可以通过扩展名搜索。我们将使用通配符：\n\n```bash\n[root@localhost philip]# locate\
  \ *.key\n/etc/brlapi.key\n/etc/trusted-key\n/usr/lib64/libreoffice/help/en-US/sbasic.key\n\
  /usr/lib64/libreoffice/help/en-US/scalc.key\n/usr/lib64/libreoffice/help/en-US/schart.key\n\
  /usr/lib64/libreoffice/help/en-US/sdatabase.key\n/usr/lib64/libreoffice/help/en-US/sdraw.key\n\
  /usr/lib64/libreoffice/help/en-US/simpress.key\n/usr/lib64/libreoffice/help/en-US/smath.key\n\
  /usr/lib64/libreoffice/help/en-US/swriter.key\n/usr/share/doc/openssh/PROTOCOL.key\n\
  /usr/share/doc/python3-pycurl/tests/server.key\n[root@localhost philip]#\n```\n\n\
  根据上述输出，只显示了小写名称；我们可以通过传递 `-i` 来修复这个问题，它告诉 `locate` 命令忽略大小：\n\n```bash\n[root@localhost\
  \ philip]# locate -i *.key\n/etc/brlapi.key\n/etc/trusted-key\n/usr/lib64/libreoffice/help/en-US/sbasic.key\n\
  /usr/lib64/libreoffice/help/en-US/scalc.key\n/usr/lib64/libreoffice/help/en-US/schart.key\n\
  /usr/lib64/libreoffice/help/en-US/sdatabase.key\n/usr/lib64/libreoffice/help/en-US/sdraw.key\n\
  /usr/lib64/libreoffice/help/en-US/simpress.key\n/usr/lib64/libreoffice/help/en-US/smath.key\n\
  /usr/lib64/libreoffice/help/en-US/swriter.key\n/usr/share/doc/openssh/PROTOCOL.key\n\
  /usr/share/doc/python3-pycurl/tests/server.key\n[root@localhost philip]#\n```\n\n\
  在这种情况下，结果是相同的，因为文件都是小写的。我们还可以控制输出的显示；我们将传递 `--null` 选项：\n\n```bash\n[root@localhost\
  \ philip]# locate --null *types\n```\n\n\n\n\n```text\n/etc/ethertypes/etc/mime.types/etc/firewalld/icmptypes/etc/selinux/targeted/contexts/customizable_types/etc/selinux/targeted/contexts/securetty_types/usr/include/bits/types/usr/lib/firewalld/icmptypes/usr/lib64/libreoffice/program/types/usr/lib64/libreoffice/share/filter/vml-shape-types/usr/lib64/perl5/bits/types/usr/lib64/python2.7/ctypes/usr/lib64/python2.\n\
  ```\n```bash\n[root@localhost philip]#\n```\n\n根据上述输出，我们看到了预期的结果。最后，我们可以查看数据库信息；我们将使用\
  \ `-S` 选项：\n\n```bash\n[root@localhost philip]# locate -S\n\nDatabase /var/lib/mlocate/mlocate.db:\n\
  \n12,517 directories\n\n162,475 files\n\n8,292,135 bytes in file names\n\n3,883,960\
  \ bytes used to store database\n```\n```bash\n[root@localhost philip]#\n```\n\n\
  除了大小之外，我们还可以看到数据库的位置。\n\n## 管道与重定向\n\n通常当我们在查看各种命令的输出时，阅读起来会有些模糊。不要再担心了，我们有所谓的“管道（pipes）”和“重定向（redirects）”。基本上，在使用管道\
  \ `|` 时，我们将一个命令的输出捕获并作为另一个命令的输入。重定向 `>`、`<`、`>>`、`>&&` 类似于获取命令的输出，但这次将其发送到文件或其他位置，仅对此类推。\n\
  \n首先，让我们选择 `ls` 命令；我们可以这样做：\n\n```bash\n[root@localhost philip]# ls /etc\n\nabrt\
  \ default gdbinit.d kernel networks rc4.d subuid-\nadjtime depmod.d gdm krb5.conf\
  \ nfs.conf rc5.d sudoers\naliases dhcp geoclue krb5.conf.d nfsmount.conf rc6.d sudoers.d\n\
  alsa DIR_COLORS glvnd ld.so.cache nsswitch.conf rc.d sysconfig\nalternatives DIR_COLORS.256color\
  \ gnupg ld.so.conf nsswitch.conf.bak rdma sysctl.conf\n```\n```bash\n[root@localhost\
  \ philip]#\n```\n\n为了简洁起见，省略了部分输出。我们可以通过引入另一个强大的命令——`less` 命令，来逐一页地查看输出：\n\n```bash\n\
  [root@localhost philip]# ls /etc | less\n\ncron.daily\ncron.deny\ncron.hourly\n\
  cron.monthly\ncrontab\ncron.weekly\ncrypto-policies\ncrypttab\ncsh.cshrc\ncsh.login\n\
  cups\ncupshelpers\n:\n```\n```bash\n[root@localhost philip]#\n```\n\n要退出 `less`\
  \ 命令，我们需要使用键盘上的 `q` 键。使用 `less` 命令的优势在于我们可以向后或向后移动，而 `more` 命令只能向前移动。我们还可以使用管道字符\
  \ `|` 来传递另一个命令所期望的值。我们可以使用 `wc` 命令来演示这一点：\n\n```bash\n[root@localhost philip]# ls\
  \ /etc | wc -w\n\n263\n```\n```bash\n[root@localhost philip]#\n```\n\n根据上述输出，我们获取了\
  \ `ls` 命令的输出并将其作为输入传递给 `wc` 命令。`wc` 命令用于统计计数；`-w` 选项用于显示总单词数。\n\n接下来，我们可以通过多种方式使用重定向。在\
  \ Linux 中，我们有 3 种流：\n\n`STDIN` = 输入 `<`\n`STDOUT` = 输出 `>`\n`STDERR` = 标准错误 `2>`\n\
  \n此外，我们还可以混合使用这些流，正如你稍后在本节看到的。让我们从 `STDIN` 开始；我们可以使用 `wc` 命令并从文件调用输入：\n\n```bash\n\
  [root@localhost philip]# wc -w < /boot/grub2/grub.cfg\n\n435\n```\n```bash\n[root@localhost\
  \ philip]#\n```\n\n`/boot/grub2/grub.cfg` 的单词数被传递给 `wc` 命令。接下来是 `STDOUT`，我们可以重定向命令的输出并存储在文件中。让我们使用\
  \ `ls` 命令：\n\n```bash\n[root@localhost philip]# ls /etc/init.d/ > /home/philip/Documents/ls.txt\n\
  ```\n```bash\n[root@localhost philip]#\n```\n\n根据上述输出，对 `/etc/init.d/` 进行了列出并将输出保存到\
  \ `/home/philip/Documents/ls.txt`。可以通过以下方式验证：\n\n```bash\n[root@localhost philip]#\
  \ cat /home/philip/Documents/ls.txt\n\nfunctions\nlivesys\nlivesys-late\nnetconsole\n\
  network\nREADME\n```\n```bash\n[root@localhost philip]#\n```\n\n现在，假设我们对另一个目录使用\
  \ `ls` 命令。这将覆盖 `/home/philip/Documents/ls.txt` 的现有内容，让我们尝试一下：\n\n```bash\n[root@localhost\
  \ philip]# ls /boot/grub2/ > /home/philip/Documents/ls.txt\n```\n```bash\n[root@localhost\
  \ philip]# cat /home/philip/Documents/ls.txt\n\ndevice.map\nfonts\ngrub.cfg\ngrubenv\n\
  i386-pc\nlocale\nthemes\n```\n```bash\n[root@localhost philip]#\n```\n\n正如我们看到的，事实胜于证明。解决此问题的方法是告诉\
  \ `STDOUT` 我们想要追加输出而不是覆盖：\n\n```bash\n[root@localhost philip]# ls /var/ >> /home/philip/Documents/ls.txt\n\
  ```\n```bash\n[root@localhost philip]# cat /home/philip/Documents/ls.txt\n\ndevice.map\n\
  fonts\ngrub.cfg\ngrubenv\ni386-pc\nlocale\nthemes\naccount\nadm\ncache\ncrash\n\
  db\nempty\nftp\ngames\ngopher\nkerberos\nlib\nspool\ntmp\nwww\nyp\n```\n```bash\n\
  [root@localhost philip]#\n```\n\n所以，我们使用 `>>` 向现有文件追加数据。接下来，我们可以结合命令的 `STDIN` 结果并将其发送到\
  \ `STDOUT`。显示如下：\n\n```bash\n[root@localhost philip]# wc -w < /var/log/boot.log\
  \ > /home/philip/Documents/STDIN_STDOUT.txt\n```\n```bash\n[root@localhost philip]#\
  \ cat /home/philip/Documents/STDIN_STDOUT.txt\n\n2021\n```\n```bash\n[root@localhost\
  \ philip]#\n```\n\n我们还可以将 `STDERR` 重定向到文件。让我们使用 `file` 命令：\n\n```bash\n[root@localhost\
  \ philip]# ls -l /tmp TestFileWithError 2> /home/philip/Documents/STDERR.txt\n```\n\
  ```text\n/tmp:\ndrwx------. 3 root root 60 Aug 2 10:23 systemd-private-a7a23120abff44c8bca6807f1711c1c2-bolt.service-7uNmVr\n\
  drwx------. 3 root root 60 Aug 2 10:22 systemd-private-a7a23120abff44c8bca6807f1711c1c2-chronyd.service-LPD8zu\n\
  drwx------. 3 root root 60 Aug 2 10:23 systemd-private-a7a23120abff44c8bca6807f1711c1c2-colord.service-13Vcs8\n\
  drwx------. 3 root root 60 Aug 2 10:28 systemd-private-a7a23120abff44c8bca6807f1711c1c2-fwupd.service-XOnyvf\n\
  drwx------. 3 root root 60 Aug 2 10:22 systemd-private-a7a23120abff44c8bca6807f1711c1c2-rtkit-daemon.service-ZD5mO7\n\
  drwx------. 2 philip philip 40 Aug 7 14:45 tracker-extract.1000\ndrwx------. 2 root\
  \ root 40 Aug 2\n根据上述输出似乎命令执行了。实际上，事实是列出操作成功了，但错误被发送到了 `/home/philip/Documents/STDERR.txt`。可以通过以下验证：\n\
  \n```bash\n[root@localhost philip]# cat /home/philip/Documents/STDERR.txt\n\nls:\
  \ cannot access 'TestFileWithError': No file or directory\n```\n```bash\n[root@localhost\
  \ philip]#\n```\n\n我们还可以将 `STDOUT` 和 `STDERR` 合并到一个文件中。这是通过告诉 shell 我们希望将 `STDERR`\
  \ 与 `STDOUT` 一起存储在同一个文件中实现的。如下：\n\n```bash\n[root@localhost philip]# ls -l /tmp\
  \ TestFileWithError > /home/philip/Documents/STDERR.txt 2>&1\n```\n```bash\n[root@localhost\
  \ philip]# cat /home/philip/Documents/STDERR.txt\n\nls: cannot access 'TestFileWithError':\
  \ No file or directory\n/tmp:\ntotal 0\ndrwx------. 3 root root 60 Aug 2 10:23 systemd-private-a7a23120abff44c8bca6807f1711c1c2-bolt.service-7uNmVr\n\
  drwx------. 3 root root 60 Aug 2 10:22 systemd-private-a7a23120abff44c8bca6807f1711c1c2-chronyd.service-LPD8zu\n\
  drwx------. 3 root root 60 Aug 2 10:23 systemd-private-a7a23120abff44c8bca6807f1711c1c2-colord.service-13Vcs8\n\
  drwx------. 3 root root 60 Aug 2 10:28 systemd-private-a7a23120abff44c8bca6807f1711c1c2-fwupd.service-XOnyvf\n\
  drwx------. 3 root root 60 Aug 2 10:22 systemd-private-a7a23120abff44c8bca6807f1711c1c2-rtkit-daemon.service-ZD5mO7\n\
  drwx------. 2 philip philip 40 Aug 7 14:45 tracker-extract.1000\ndrwx------. 2 root\
  \ root 40 Aug 2\n```\n```bash\n[root@localhost philip]#\n```\n\n\n\n\n基于上述输出，我们可以看到文件开头的错误，接着是\
  \ `/tmp` 的列出。最后，可以同时显示命令输出并将其输出重定向到文件中；这是通过另一个强大的命令——`tee` 命令实现的。以下是 `tee` 命令的运行示例：\n\
  \n```bash\n[root@localhost philip]# cat /etc/hosts.allow | tee /home/philip/Documents/The_Tee_command.txt\n\
  \n#\n# hosts.allow This file contains access rules which are used to\n# allow or\
  \ deny connections to network services that\n# either use the tcp_wrappers library\
  \ or that have been\n# started through a tcp_wrappers-enabled xinetd.\n#\n# See\
  \ 'man 5 hosts_options' and 'man 5 hosts_access'\n# for information on rule syntax.\n\
  # See 'man tcpd' for information on tcp_wrappers\n[root@localhost philip]#\n\n[root@localhost\
  \ philip]# cat /home/philip/Documents/The_Tee_command.txt\n\n#\n# hosts.allow This\
  \ file contains access rules which are used to\n# allow or deny connections to network\
  \ services that\n# either use the tcp_wrappers library or that have been\n# started\
  \ through a tcp_wrappers-enabled xinetd.\n#\n# See 'man 5 hosts_options' and 'man\
  \ 5 hosts_access'\n# for information on rule syntax.\n# See 'man tcpd' for information\
  \ on tcp_wrappers\n[root@localhost philip]#\n```\n\n从上面的输出中，我们可以看到 `tee` 命令的力量。\n\
  \n## 文件系统管理\n\nLinux 操作系统支持硬盘上的多种文件系统类型，每种类型都旨在解决不同的需求并提供特定的功能。以下是常见的文件系统类型：\n\n\
  ### 第四扩展文件系统 (ext4)\n\n第四代扩展文件系统 (`ext4`）是 Linux 发行版中默认且最广泛使用的系统。它提供了对 `ext2` 和\
  \ `ext3` 的向后兼容性、用于数据一致性的日志记录、对大文件和文件系统的支持，并具有高效的。`ext4` 适用于从个人电脑到企业服务器的各种通用场景。\n\
  \n### XFS 文件系统\n\n`XFS` 是一种高性能、可扩展的文件系统，最初由 Silicon Graphics, Inc. 开发。它以处理大规模存储系统的能力而闻名。`XFS`\
  \ 文件系统提供了高可扩展性、并行 I/O 操作、快速崩溃恢复、高效的空间分配，以及对快照和在线去碎片等高级功能的支持。它非常适合大规模存储环境，包括文件服务器、数据库服务器和多媒体应用。\n\
  \n### B 树文件系统 (Btrfs)\n\nB 树文件系统 (`Btrfs`) 是一种旨在解决传统文件系统局限性的下一代文件系统。`Btrfs` 文件系统提供了快照、写时复制（copy-on-write）、数据压缩、内置\
  \ RAID 支持、在线调整大小和数据完整性校验和等功能。它非常适用于需要快照备份、数据去重和灵活磁盘管理等高级功能的场景。\n\n### ZFS 文件系统\n\
  \n虽然 `ZFS` 不是 Linux 内核的原生部分，但它是一个强大且功能丰富的文件系统，广泛应用于其他操作系统。`ZFS` 文件系统提供了数据完整性检查、带有动态条带的池化存储、快照、压缩、去重和高级\
  \ RAID 功能。它通常用于存储服务器、高性能计算集群以及对数据完整性和高级存储能力至关重要的环境。\n\n### 新技术文件系统 (NTFS)\n\n新技术文件系统\
  \ (`NTFS`) 是微软 Windows 操作系统的默认文件系统。Linux 支持对 `NTFS` 分区的读取和写访问，允许 Linux 和 Windows\
  \ 系统之间进行数据互换。Linux 对 `NTFS` 的支持对于双系统启动或访问 Windows 格式的存储设备非常有用。\n\n我们有各种工具来管理 Linux\
  \ 文件系统。现在让我们来看一些 Linux 终端中可用的常用硬盘管理工具，范围从创建分区到挂载分区。\n\n## 使用 fdisk 实用程序\n\n在 Linux\
  \ 中，每当我们与硬盘打交道时，可能在某个时刻必须对它进行分区。这意味着我们必须将硬盘分开。这使我们能够拥有不同大小的分区，并赋予我们满足各种软件安装需求的能力。此外，当对硬盘进行分区时，每个分区都会被操作系统视为一个完全独立的硬盘。`fdisk`（固定磁盘或格式化磁盘）是一个基于命令行的实用程序，可用于操作硬盘。通过\
  \ `fdisk`，你可以查看、创建、删除、更改分区类型等。\n\n首先，让我们在 Ubuntu 发行版中显示硬盘：\n\n```bash\nphilip@ubuntu:~$\
  \ ls /dev/ | grep sd\nsda\nsda1\nsda2\nsda5\nphilip@ubuntu:~$\n```\n\n从上面的内容可以看出，系统硬盘由\
  \ `/dev/sda` 表示。第一个分区是 `/dev/sda1`，第二个分区是 `/dev/sda2`，以此此类推。为了查看分区信息，我们将：\n\n```bash\n\
  philip@ubuntu:~$ fdisk -l /dev/sda\nfdisk: cannot open /dev/sda: Permission denied\n\
  philip@ubuntu:~$\n```\n\n从上面的结果，我们得到了一个拒绝访问（permission denied）错误。由于我们需要 root 权限来查看或更改硬盘的分区，让我们以\
  \ root 用户重试：\n\n```bash\nphilip@ubuntu:~$ sudo su\n[sudo] password for philip:\n\
  root@ubuntu:/home/philip#\nroot@ubuntu:/home/philip# fdisk -l /dev/sda\nDisk /dev/sda:\
  \ 20 GiB, 21474836480 bytes, 41943040 sectors\nUnits: sectors of 1 * 512 = 512 bytes\n\
  Sector size (logical/physical): 512 bytes / 512 bytes\nI/O size (minimum/optimal):\
  \ 512 bytes / 512 bytes\nDisklabel type: dos\nDisk identifier: 0xf54f42a0\nDevice\
  \ Boot Start End Sectors Size Id Type\n/dev/sda1 * 2048 39845887 39843840 19G 83\
  \ Linux\n/dev/sda2 39847934 41940991 2093058 1022M 5 Extended\n/dev/sda5 39847936\
  \ 41940991 2093056 1022M 82 Linux swap / Solaris\nroot@ubuntu:/home/philip#\n```\n\
  \n从上面的内容来看，读取方法如下：\n- `Disk /dev/sda: 20 GiB, 21474836480 bytes, 41943040 sectors`:\
  \ 这是实际物理硬盘。\n- `Device Boot Start End Sectors Size Id Type`\n- `/dev/sda1 * 2048\
  \ 39845887 39843840 19G 83 Linux`: 第一个分区是 19GB\n- `/dev/sda2 39847934 41940991 2093058\
  \ 1022M 5 Extended`: 第二分区是 1022MB\n- `/dev/sda5 39847936 41940991 2093056 1022M\
  \ 82 Linux swap / Solaris`: 第五个分区是 1022MB\n\n现在，为了让我们能够进行任何更改，我们将再次使用 `fdisk` 命令。这次我们将省略\
  \ `-l` 选项：\n\n```bash\nroot@ubuntu:/home/philip# fdisk /dev/sda\nWelcome to fdisk\
  \ (util-linux 2.27.1).\nChanges will remain in memory only, until you decide to\
  \ write them.\nBe careful before using the write command.\nCommand (m for help):\n\
  ```\n\n从上面的内容，我们现在进入了 `fdisk` 实用程序内部。\n\n注意：在确保你理解删除分区的危险之前，不要提交任何更改；如果你删除了存储系统文件的分区（例如：`/boot/`、`/`），系统可能会变得不稳定。\n\
  \n为了查看两个可用选项，我们可以按下 `m` 键：\n\n```text\nCommand (m for help): m\nHelp:\nDOS (MBR)\n\
  a toggle a bootable flag.\nb edit nested BSD disk label.\nc toggle the dos compatibility\
  \ flag.\nGeneric\nd delete a partition.\nF list free unpartitioned space.\nl list\
  \ known partition types.\nn add a new partition.\np print the partition table.\n\
  t change a partition type.\nv verify the partition table.\ni print information about\
  \ a partition.\nMisc\nm print this menu.\nu change display/entry units.\nx extra\
  \ functionality (experts only).\nScript\nI load disk layout from sfdisk script file\n\
  dump disk layout to sfdisk script file\nSave and exit\nw write table to disk and\
  \ exit\nq quit without saving changes\nCreate a new label\ng create a new GPT partition\
  \ table\n```\n\n\n\n\n`g` 创建一个新的空的 SGI (IRIX) 分区表\n\n`c` 创建一个新的空的 DOS 分区表\n\n`s`\
  \ 创建一个新的空的 Sun 分区表\n\n命令 (输入 m 帮助):\n\n从从输出输出中，我们可以看到许多可供选择的选项。我们甚至可以使用 `l` 查看已的分区类型。参考图\
  \ 2.1：\n\n![](img/Figure_2.1_.png)\n\n图 2.1：`fdisk` 工具可用的分区类型\n\n根据上述内容，有一系列不同的分区类型可供使用。常见的类型有：`5`\
  \ (扩展分区)、`7` NTFS (Windows)、`82` (Linux 交换分区)、`83` (Linux)、`a5` (FreeBSD)、`ee` (GPT)、`ef`\
  \ (EFI) 等。\n\n现在，为了查看创建的分区，我们可以使用 `p`，如图 2.2 所示：\n\n![](img/Figure_2.2_.png)\n\n\
  图 2.2：`/dev/sda` 的分区表\n\n此系统中添加了第二块硬盘，让我们来验证一下：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ ls /dev/ | grep sd\nsda\nsda1\nsda2\nsda5\nsdb\nroot@ubuntu:/home/philip#\n```\n\
  \n我们现在可以看到 `/dev/sdb`。我们将对这块新硬盘使用 `fdisk`：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ fdisk /dev/sdb\n欢迎使用 fdisk (util-linux version 2.27.1)。\n更改将仅保留在内存中，直到你决定写入它们。\n\
  在使用 write 命令之前请小心。\n设备不包含受识别的分区表。\n已创建一个新的 DOS 磁盘标签，磁盘标识符为 0x0079e169。\n命令 (输入 m\
  \ 帮助):\n```\n\n现在，让我们按下 `p`，这将打印出 `/dev/sdb` 上的当前分区：\n\n```bash\nCommand (m for\
  \ help): p\nDisk /dev/sdb: 15 GiB, 16106127360 bytes, 31457280 sectors\nUnits: sectors\
  \ of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\n\
  I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabeltype: dos\nDisk identifier:\
  \ 0x0079e169\nCommand (m for help):\n```\n\n如你所见，`/dev/sdb` 上没有分区。为了创建一个分区，我们将看到\
  \ `n` 键：\n\n```bash\nCommand (m for help): n\nPartition type\np primary (0 primary,\
  \ 0 extended, 4 free)\ne extended (container for logical partitions)\nSelect (default\
  \ p):\n```\n\n这将要求我们声明分区的类型。`fdisk` 工具提供了主分区和扩展分区类型供选择。还有一种逻辑分区类型。为了安装操作系统，我们将选择\
  \ `p`，它代表主分区类型。\n\n注意：你不会在逻辑分区类型上安装操作系统。\n\n一旦我们一按下 `p`，`fdisk` 工具将提示我们定义分区编号（起始分区）：\n\
  \n```bash\nCommand (m for help): n\nPartition type\np primary (0 primary, 0 extended,\
  \ 4 free)\ne extended (container for logical partitions)\nSelect (default p): p\n\
  ```\n\n现在，我们需要指定此分区的起始大小和结束大小：\n\n```bash\nPartition number (1-4, default 1): 1\n\
  First sector (2048-31457279, default 2048):\nLast sector, +sectors or +size{K,M,G,T,P}\
  \ (2048-31457279, default 31457279):\n```\n\n如果我们简单地按回车，分区将占用整个硬盘；在我们的案例中，我们将创建一个\
  \ 5GB 的分区：\n\n```bash\nLast sector, +sectors or +size{K,M,G,T,P} (2048-31457279,\
  \ default 31457279): +5G\nCreated a new partition 1 of type 'Linux' and of size\
  \ 5 GiB.\nCommand (m for help):\n```\n\n现在，为了查看新创建的分区，我们将按下 `p`：\n\n```bash\nCommand\
  \ (m for help): p\nDisk /dev/sdb: 15 GiB, 16106127360 bytes, 31457280 sectors\n\
  Units: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes\
  \ / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type:\
  \ dos\nDisk identifier: 0x2584b986\nDevice Boot Start End Sectors Size Id Type\n\
  /dev/sdb1 2048 10487807 10485760 5G 83 Linux\nCommand (m for help):\n```\n\n现在我们大约有\
  \ 10GB 的可用空间，我们是从上面的输出中得到这些信息的。我们将再创建 2 个分区：\n\n```bash\nCommand (m for help): p\n\
  Disk /dev/sdb: 15 GiB, 16106127360 bytes, 31457280 sectors\nUnits: sectors of 1\
  \ * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\nI/O\
  \ size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type: dos\nDisk identifier:\
  \ 0x2584b986\nDevice Boot Start End Sectors Size Id Type\n/dev/sdb1 2048 10487807\
  \ 10485760 5G 83 Linux\n/dev/sdb2 10487808\n```\n\n\n\n\n欢迎使用 GNU Parted！输入 `help`\
  \ 查看命令列表。\n\n```\n(parted)\n```\n\n从这里，我们进入了 `parted` 工具界面。与 `fdisk` 工具类似，`parted`\
  \ 工具是交互式的。现在假设我们想要查看帮助菜单；我们可以在命令行界面列出帮助信息：\n\n```bash\n(parted) help\n```\n\nalign-check\
  \ TYPE N 检查分区 N 是否符合 TYPE(min|opt) 对齐要求\n\nhelp [COMMAND] 打印通用帮助，或打印 COMMAND 的帮助\n\
  \nmklabel,mktable LABEL-TYPE 创建新的磁盘标签（分区表）\n\nmkpart PART-TYPE [FS-TYPE] START END\
  \ 创建分区\n\nname NUMBER NAME 将分区 NUMBER 命名为 NAME\n\nprint [devices|free|list,all|NUMBER]\
  \ 显示分区表、可用设备、空闲、所有找到的分区或特定分区\n\nquit 退出程序\n\nrescue START END 恢复 START 和 END 附近的丢失的分区\n\
  \nresizepart NUMBER END 调整分区 NUMBER own\n\nrm NUMBER 删除分区 NUMBER\n\nselect DEVICE\
  \ 选择要编辑的设备\n\ndisk_set FLAG STATE 修改所选设备上的 FLAG\n\ndisk_toggle [FLAG] 切换所选设备上 FLAG\
  \ 的状态\n\nset NUMBER FLAG STATE 修改分区 NUMBER 上的 FLAG\n\ntoggle [NUMBER [FLAG]] 切换分区\
  \ NUMBER 上的 FLAG 状态\n\nunit UNIT 将默认单位设置为 UNIT\n\nversion 显示 GNU Parted 的版本号和版权信息\n\
  \n```\n(parted)\n```\n\n从上面的输出中，我们有一系列长长的命令可以使用。\n\n**注意**：在对您的分区进行任何更改之前，请记得进行备份。\n\
  \n现在，为了查看 `/dev/sdb` 的当前分区表，我们将输入 `print`：\n\n```text\nModel: VMware, VMware Virtual\
  \ S (scsi)\nDisk /dev/sdb: 16.1GB\nSector size (logical/physical): 512B/512B\nPartition\
  \ Table: msdos\nDisk Flags:\nNumber Start End Size Type File system Flags\n1 1049kB\
  \ 5370MB 5369MB primary\n2 5370MB 9665MB 4295MB primary\n3 9665MB 16.1GB 6441MB\
  \ primary boot, esp\n(parted)\n```\n\n这将打印出 `/dev/sdb` 的分区表。然而，我们可以使用带有 `list` 选项的\
  \ `print` 命令来查看系统中所有可用硬盘。让我们尝试一下：\n\n```bash\n(parted) print list\nModel: VMware,\
  \ VMware Virtual S (scsi)\nDisk /dev/sdb: 16.1GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber Start End Size Type File\
  \ system Flags\n1 1049kB 5370MB 5369MB primary\n2 5370MB 9665MB 4295MB primary\n\
  3 9665MB 16.1GB 6441MB primary boot, esp\nModel: VMware, VMware Virtual S (scsi)\n\
  Disk /dev/sda: 21.5GB\nSector size (logical/physical): 512B/512B\nPartition Table:\
  \ msdos\nDisk Flags:\nNumber Start End Size Type File system Flags\n1 1049kB 20.4GB\
  \ 20.4GB primary ext4 boot\n2 20.4GB 21.5GB 1072MB extended\n5 20.4GB 21.5GB 1072MB\
  \ logical linux-swap(v1)\n(parted)\n```\n\n如你所见，`/dev/sda` 现在也被列出了。接下来，让我们看看如何调整分区大小。为了实现这一点，我们将利用另一个强大的命令\
  \ `resizepart` 命令，其顾名恰其实其实义。\n\n我们将为本次练习选择第二个分区；即输入 `resizepart 2`。我们将将其缩小到 2GB：\n\
  \n```bash\n(parted) resizepart\nPartition number? 2\nEnd? [5370MB]? 7518\n(parted)\
  \ print\nDisk /dev/sdb: 16.1GB\nSector size (logical/physical): 512B/512B\nPartition\
  \ Table: msdos\nDisk Flags:\nNumber Start End Size Type File system Flags\n1 1049kB\
  \ 5370MB 5369MB primary\n2 5370MB 7518MB 2148MB primary\n3 9665MB 16.1GB 6441MB\
  \ primary boot, esp\n(parted)\n```\n\n从上面的输出中，你可以看到 `parted` 工具非常强大。我们实际上从第二个分区中删减了大约\
  \ 2GB。现在，如果你考虑一下，我们有 2GB 的空闲空间可以使用。\n\n**注意**：硬盘空间在大规模数据中心至关重要，在配置服务器时请记住这一点。\n\n\
  现在，为了演示我们如何使用这 2GB 空闲空间，让我们创建另一个分区。`parted` 工具非常强大，它能够识别从另一个磁盘工具（如 `fdisk`）创建的分区。在\
  \ `parted` 中，我们将使用 `mkpart` 命令创建分区：\n\n```bash\n(parted)\n(parted) mkpart\nPartition\
  \ type? primary/extended?\n```\n\n如你现在可以看到 `fdisk` 和 `parted` 之间的相似之处，它们都会询问分区是主分区还是扩展分区。这在我们处理操作系统安装时至关重要。为了我们的目的，我们将再次创建一个主分区：\n\
  \n```text\nPartition type? primary/extended? primary\nFile system type? [ext2]?\n\
  Start?\n```\n\n现在，在此时，我们必须指定即将创建的分区的起始大小。我们将使用第二个分区结束处的尺寸：\n\n```text\nFile system\
  \ type? [ext2]?\nStart? 7518\nEnd? 9665\n(parted)\n```\n\n现在让我们重新运行 `print` 命令：\n\
  \n```bash\n(parted) print\nModel: VMware, VMware Virtual S (scsi)\nDisk /dev/sdb:\
  \ 16.1GB\nSector size (logical/physical): 512B/512B\nPartition Table: msdos\nDisk\
  \ Flags:\nNumber Start End Size Type File system Flags\n1 1049kB 5370MB 5369MB primary\n\
  2 5370MB 7518MB 2148MB primary\n4 7518MB 9665MB 2146MB primary ext2 lba\n3 9665MB\
  \ 16.1GB 6441MB primary boot, esp\n(parted)\n```\n\n从上面的输出中，我们现在可以看到新创建的分区位于大约 2GB\
  \ 处。\n\n现在，我们可以将引导标记从目前的分区 3 `/dev/sdb3` 更改到分区 4 `/dev/sdb4`。我们将使用 `set` 命令：\n\n\
  ```bash\n(parted) set\nPartition number? 4\nFlag to Invert?\n```\n\n从这里，我们必须告诉 `parted`\
  \ 工具我们要移动引导标记：\n\n```text\nFlag to Invert? boot\nNew state? [on]/off?\n```\n\n现在我们需要确认更改，`on`\
  \ 是默认值，所以我们按回车：\n\n```text\nNew state? [on]/off?\n(parted) print\nModel: VMware,\
  \ VMware Virtual S (scsi)\nDisk /dev/sdb: 16.1GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber Start End Size Type File\
  \ system Flags\n1 1049kB 5370MB 5369MB primary\n2 5370MB 7518MB 2148MB primary\n\
  4 7518MB 9665MB 2146MB primary ext2 boot, lba\n3 9665MB 16.1GB 6441MB primary esp\n\
  (parted)\n```\n\n现在我们可以看到引导标记已移动到第四个分区 `/dev/sdb4`。\n\n最后，为了保存更改，我们只需输入 `quit`：\n\
  \n```bash\n(parted) quit\n```\n\n信息：你可能需要更新 `/etc/fstab`。\n\n```bash\nroot@ubuntu:/home/philip#\n\
  ```\n\n**注意**：你需要在 `/etc/fstab` 中添加条目以自动挂载您的分区。\n\n## 格式化硬盘的步骤\n\n在我们创建分区后，下一步是通过文件系统使分区可用。在\
  \ Linux 中，当我们格式化分区时，系统会清除分区，以便系统能够存储数据。\n\nLinux 系统中有多种文件系统类型。我们使用 `mkfs` 命令结合所需的文件系统类型来格式化分区。要查看可用的文件系统，可以使用\
  \ `mkfs` 命令后接一个点 `.`：\n\n从上面的输出可以看出，在该 Ubuntu 发行版中有各种 ext 文件系统。此外，还有微软 Windows 文件系统类型如\
  \ FAT、NTFS 等。我们还可以使用 `lsblk` 命令配合 `-f` 选项查看正在使用的文件系统：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ lsblk -f\n\nNAME FSTYPE LABEL UUID MOUNTPOINT\nsda\n├─sda1 ext4 adb5d090-3400-4411-aee2-dd871c39db38\
  \ /\n├─sda2\n└─sda5 swap 025b1992-80ba-46ed-8490-e7aa68271e7b [SWAP]\nsdb\n├─sdb1\n\
  ├─sdb2\n├─sdb3\n└─sdb4\nsr0\nroot@ubuntu:/home/philip#\n```\n\n\n\n从输出输出可以看出，`TYPE=`\
  \ 部分显示了正在使用的文件系统。请注意，`/dev/sdb(1-4)` 缺少 `TYPE=`。这仅仅意味着我们尚未对位于 `/dev/sdb` 上的任何分区进行格式化。\n\
  \n现在，让我们开始格式化分区。我们将在 `/dev/sdb1` 上使用 `ext4` 文件系统：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ mkfs.ext4 /dev/sdb1\n\nmke2fs 1.42.13 (17-May-2015)\nCreating filesystem with\
  \ 1310720 4k blocks and 327680 inodes\nFilesystem UUID: fc51dddf-c23d-4160-8e49-f8a275c9b2f0\n\
  Superblock backups stored on blocks:\n32768, 98304, 163840, 229376, 294912, 819200,\
  \ 884736\nAllocating group tables: done\nWriting inode tables: done\nCreating journal\
  \ (32768 blocks): done\nWriting superblocks and filesystem accounting information:\
  \ done\nroot@ubuntu:/home/philip#\n```\n\n从上述输出可以看出，`mkfs` 工具（特别是 `mkfs.ext4`）在原始分区上创建文件系统；然后它分配了一个\
  \ `UUID` 来唯一标识 `/dev/sdb1` 分区。\n\n**注意**：在格式化分区之前，你需要拥有 root 权限。\n\n接下来，让我们为 `/dev/sdb2`\
  \ 使用 `ext3` 文件系统：\n\n```bash\nroot@ubuntu:/home/philip# mkfs.ext3 /dev/sdb2\n\n\
  mke2fs 1.42.13 (17-May-2015)\nCreating filesystem with 524288 4k blocks and 131328\
  \ inodes\nFilesystem UUID: fd6aab0f-0f16-4922-86c1-11fcb54fc466\nSuperblock backups\
  \ stored on blocks:\n32768, 98304, 163840, 229376, 294912\nAllocating group tables:\
  \ done\nWriting inode tables: done\nCreating journal (16384 blocks): done\nWriting\
  \ superblocks and filesystem accounting information: done\nroot@ubuntu:/home/philip#\n\
  ```\n\n现在，我们将为 `/dev/sdb3` 使用 `ext2`，为 `/dev/sdb4` 使用 `ntfs`：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ mkfs.ext2 /dev/sdb3\n\nmke2fs 1.42.13 (17-May-2015)\nCreating filesystem with\
  \ 1572608 4k blocks and 393216 inodes\nFilesystem UUID: b7e075df-541d-468d-ab16-e3ec2e5fb5f8\n\
  Superblock backups stored on blocks:\n32768, 98304, 163840, 229376, 294912, 819200,\
  \ 884736\nAllocating group tables: done\nWriting inode tables: done\nWriting superblocks\
  \ and filesystem accounting information: done\nroot@ubuntu:/home/philip# mkfs.ntfs\
  \ /dev/sdb4\n\nCluster size has been automatically set to 4096 bytes.\nInitializing\
  \ device with zeroes: 100% - Done.\nCreating NTFS volume structures.\nmkntfs completed\
  \ successfully. Have a nice day.\nroot@ubuntu:/home/philip#\n```\n\n**注意**：你也可以使用\
  \ `mke2fs` 来创建 `ext2` 文件系统。\n\n现在我们已经格式化了 `/dev/sdb1`、`/dev/sdb2`、`/dev/sdb3` 和\
  \ `/dev/sdb4`。如果现在再次带上 `-f` 运行 `lsblk` 命令，我们将看到相应分区已填充了文件系统类型（`FSTYPE`）：\n\n```bash\n\
  root@ubuntu:/home/philip# lsblk -f\n\nNAME FSTYPE LABEL UUID MOUNTPOINT\nsda\n├─sda1\
  \ ext4 adb5d090-3400-4411-aee2-dd871c39db38 /\n├─sda2\n└─sda5 swap 025b1992-80ba-46ed-8490-e7aa68271e7b\
  \ [SWAP]\nsdb\n├─sdb1 ext4 fc51dddf-c23d-4160-8e49-f8a275c9b2f0\n├─sdb2 ext3 fd6aab0f-0f16-4922-86c1-11fcb54fc466\n\
  ├─sdb3 ext2 b7e075df-541d-468d-ab16-e3ec2e5fb5f8\n└─sdb4 ntfs 1D9E4A6D4088D79A\n\
  sr0\nroot@ubuntu:/home/philip#\n```\n\n从上述输出中，我们可以看到文件系统类型（`FSTYPE`）反映了我们所做的更改。\n\
  \n我们还可以再次运行 `blkid` 命令来查看为 `/dev/sdb1` 和 `/dev/sdb2` 创建的 `UUIDs`：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ blkid\n\n/dev/sda1: UUID=\"adb5d090-3400-4411-aee2-dd871c39db38\" TYPE=\"ext4\"\
  \ PARTUUID=\"f54f42a0-01\"\n/dev/sda5: UUID=\"025b1992-80ba-46ed-8490-e7aa68271e7b\"\
  \ TYPE=\"swap\" PARTUUID=\"f54f42a0-05\"\n/dev/sdb1: UUID=\"fc51dddf-c23d-4160-8e49-f8a275c9b2f0\"\
  \ TYPE=\"ext4\" PARTUUID=\"7e707ac0-01\"\n/dev/sdb2: UUID=\"fd6aab0f-0f16-4922-86c1-11fcb54fc466\"\
  \ SEC_TYPE=\"ext2\" TYPE=\"ext3\" PARTUUID=\"7e707ac0-02\"\n/dev/sdb3: UUID=\"2a8a5768-1a7f-4ab4-8aa1-f45d30df5631\"\
  \ TYPE=\"ext2\" PARTUUID=\"7e707ac0-03\"\n/dev/sdb4: UUID=\"1D9E4A6D4088D79A\" TYPE=\"\
  ntfs\" PARTUUID=\"7e707ac0-04\"\nroot@ubuntu:/home/philip#\n```\n\n如你所示，系统现在可以在相应分区上存储信息了。\n\
  \n## 挂载和卸载分区\n\n格式化分区后的最后一步是挂载分区。使用 `mount` 命令挂载分区，使用 `umount` 命令卸载分区。`mount` 命令也用于查看系统中的当前挂载点。然而，在重启后，除非我们在\
  \ `/etc/fstab` 中创建了条目，否则所有分区都会卸载。\n\n**注意**：保存 `/etc/fstab` 中的任何更改需要 root 权限。此外，在进行任何更改之前请备份任何配置文件。\n\
  \n## mount 命令\n\n我们可以不带任何参数运行 `mount` 命令来查看当前的挂载点：\n\n```bash\nroot@ubuntu:/home/philip#\
  \ mount\n\nsysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime)\nproc on /proc\
  \ type proc (rw,nosuid,nodev,noexec,relatime)\nudev on /dev type devtmpfs (rw,nosuid,relatime,size=478356k,nr_inodes=119589,mode=755)\n\
  devpts on /dev/pts type devpts (rw,nosuid,noexec,relatime,gid=5,mode=620,ptmxmode=000)\n\
  tmpfs on /run type tmpfs (rw,nosuid,nodev,noexec,relatime)\n```\n\n\n\n\n注意，在不带任何选项的情况下，`mount`\
  \ 命令无错误地运行。现在，让我们重新运行 `mount` 命令并过滤出 `/dev` 相关内容：\n\n```bash\nroot@ubuntu:/# mount\
  \ | grep /dev\n\nudev on /dev type devtmpfs (rw,nosuid,relatime,size=478356k,nr_inodes=119589,mode=755)\n\
  devpts on /dev/pts type devpts (rw,nosuid,noexec,relatime,gid=5,mode=620,ptmxmode=000)\n\
  /dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)\ntmpfs on\
  \ /dev/shm type tmpfs (rw/nosuid,nodev)\ncgroup on /sys/fs/cgroup/devices type cgroup\
  \ (rw,nosuid,nodev,noexec,relatime,devices)\nmqueue on /dev/mqueue type mqueue (rw,relatime)\n\
  hugetlbfs on /dev/hugepages type hugetlbfs (rw,relatime)\n/dev/sdb1 on /mnt type\
  \ ext4 (rw,relatime,data=ordered)\nroot@ubuntu:/#\n```\n\n根据以上输出，我们可以看到 `/dev/sdb1`\
  \ 目前挂载在 `/mnt` 上。\n\n我们还可以利用带有 `-h` 选项的 `df` 命令来查看类似的结果：\n\n```bash\nroot@ubuntu:/#\
  \ df -h\n\nFilesystem Size Used Avail Use% Mounted on\nudev 468M 0 468M 0% /dev\n\
  tmpfs 98M 6.2M 92M 7% /run\n/dev/sda1 19G 5.1G 13G 29% /\ntmpfs 488M 212K 487M 1%\
  \ /dev/shm\ntmpfs 5.0M 4.0K 5.0M 1% /run/lock\ntmpfs 488M 0 488M 0% /sys/fs/cgroup\n\
  tmpfs 98M 44K 98M 1% /run/user/1000\n/dev/sdb1 4.8G 10M 4.6G 1% /mnt\nroot@ubuntu:/#\n\
  ```\n\n从以上输出中，可以看到分区的大小以及与该分区相关的挂载点。\n\n现在，让我们创建两个目录分别用于 `/dev/sdb2` 和 `/dev/sdb4`\
  \ 分区：\n\n```bash\nroot@ubuntu:/# mkdir /folder1\nroot@ubuntu:/# mkdir /folder2\n\
  root@ubuntu:/# ls\n\nbin dev folder2 initrd.img.old lost+found opt run srv usr vmlinuz.old\n\
  boot etc home lib media proc sbin sys var\ncdrom folder1 initrd.img lib64 mnt root\
  \ snap tmp vmlinuz\nroot@ubuntu:/#\n```\n\n现在，我们将 `/dev/sdb2` 和 `/dev/sdb4` 分别挂载到\
  \ `/folder1` 和 `/folder2` 目录：\n\n```bash\nroot@ubuntu:/# mount /dev/sdb2 /folder1\n\
  root@ubuntu:/# mount /dev/sdb4 /folder2\nroot@ubuntu:/#\n\nroot@ubuntu:/# mount\
  \ | grep /dev\n/dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)\n\
  /dev/sdb1 on /mnt type ext4 (rw,relatime,data=ordered)\n/dev/sdb2 on /folder1 type\
  \ ext3 (rw,relatime,data=ordered)\n/dev/sdb4 on /folder2 type fuseblk (rw,relatime,user_id=0,group_id=0,allow_other,blksize=4096)\n\
  root@ubuntu:/#\n```\n\n现在我们可以看到 `mount` 命令显示了我们的挂载点。同样，我们可以使用带有 `-h` 选项的 `df` 命令来获取可读的格式：\n\
  \n```bash\nroot@ubuntu:/# df -h\n\nFilesystem Size Used Avail Use% Mounted on\n\
  udev 468M 0 468M 0% /dev\ntmpfs 98M 6.2M 92M 7% /run\n/dev/sda1 19G 5.1G 13G 29%\
  \ /\ntmpfs 488M 212K 487M 1% /dev/shm\ntmpfs 5.0M 4.0K 5.0M 1% /run/lock\ntmpfs\
  \ 488M 0 488M 0% /sys/fs/cgroup\ntmpfs 98M 44K 98M 1% /run/user/1000\n/dev/sdb1\
  \ 4.8G 10M 4.6G 1% /mnt\n/dev/sdb2 2.0G 3.1M 1.9G 1% /folder1\n/dev/sdb4 2.0G 11M\
  \ 2.0G 1% /folder2\nroot@ubuntu:/#\n```\n\n如你所见，挂载分区的步骤非常直接。然而，在某些发行版中，你必须指定文件系统类型。在网络中，挂载共享是一项常见操作。挂载共享的示例如下：\n\
  \n```bash\nroot@ubuntu:/#mount //172.16.175.144/share /netshare -t cifs -o user=philip,password=pass123,uid=1000,gid=1000,rw\n\
  ```\n\n### `umount` 命令\n\n在我们挂载分区并执行了更改后，清理并卸载分区始终是一个好习惯。我们使用 `umount` 命令来卸载分区。\n\
  \n注意：在运行 `umount` 命令之前，请务必切换或离开该目录。\n\n让我们卸载 `/dev/sdb1`。格式如下：\n\n```bash\nroot@ubuntu:/#\
  \ umount /dev/sdb1\nroot@ubuntu:/#\n\nroot@ubuntu:/# mount | grep /dev\nudev on\
  \ /dev type devtmpfs (rw,nosuid,relatime,size=478356k,nr_inodes=119589,mode=755)\n\
  devpts on /dev/pts type devpts (rw,nosuid,noexec,relatime,gid=5,mode=620,ptmxmode=000)\n\
  /dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)\ntmpfs on\
  \ /dev/shm type tmpfs (rw,nosuid,nodev)\ncgroup on /sys/fs/cgroup/devices type cgroup\
  \ (rw,nosuid,nodev,noexec,relatime,devices)\nmqueue on /dev/mqueue type mqueue (rw,relatime)\n\
  hugetlbfs on /dev/hugepages type hugetlbfs (rw,relatime)\n/dev/sdb2 on /folder1\
  \ type ext3 (rw,relatime,data=ordered)\n/dev/sdb4 on /folder2 type fuseblk (rw,relatime,user_id=0,group_id=0,allow_other,blksize=4096)\n\
  root@ubuntu:/#\n```\n\n现在，我们可以看到 `/dev/sdb1` 不再被挂载，我们也可以通过使用 `df` 命令来确认：\n\n```bash\n\
  root@ubuntu:/# df -h\n\nFilesystem Size Used Avail Use% Mounted on\nudev 468M 0\
  \ 468M 0% /dev\ntmpfs 98M 7.5M 91M 8% /run\n/dev/sda1 19G 5.2G 13G 30% /\ntmpfs\
  \ 488M 212K 487M 1% /dev/shm\ntmpfs 5.0M 4.0K 5.0M 1% /run/lock\ntmpfs 488M 0 488M\
  \ 0% /sys/fs/cgroup\ntmpfs 98M 48K 98M 1% /run/user/1000\n/dev/sdb2 2.0G 3.1M 1.9G\
  \ 1% /folder1\n/dev/sdb4 2.0G 11M 2.0G 1% /folder2\nroot@ubuntu:/#\n```\n\n\n\n\n\
  \n*   **物理卷 (PVs)**：物理卷是一种存储设备，例如硬盘或分区，由 `LVM` 识别并管理。它将多个物理卷组合成单一的存储池。可以使用 `pvcreate`\
  \ 命令创建物理卷。\n*   **卷组 (VGs)**：卷组是物理卷的集合，充当统一的存储池。VGs 允许聚合来自多个物理卷的存储空间。你可以使用 `vgcreate`\
  \ 命令创建卷组。\n*   **逻辑卷 (LVs)**：逻辑卷表示位于卷组内的灵活分区。LVs 根据卷组中的可用空间创建，并可以动态调整调整大小。它们类似于传统分区，但提供了更高的灵活性。使用\
  \ `lvcreate` 命令来创建逻辑卷。\n*   **区 (Extents)**：区是 `LVM` 使用的固定大小数据块。它们代表卷组中分配的最小单位，通常大小为\
  \ 4 MB。逻辑卷由一个或多个区组成。\n*   **条带 (Striping)**：条带是一种将数据分布在多个物理卷上以提高性能的技术。`LVM` 允许你将数据跨多个逻辑卷进行条带，而这些逻辑卷又分布在不同的物理卷上。\n\
  *   **镜像 (Mirroring)**：`LVM` 支持镜像，通过维护多个数据副本提供数据冗余。镜像增强了数据的可靠性和可用性。你可以使用带有 `--mirrors`\
  \ 选项的 `lvcreate` 命令创建镜像逻辑卷。\n*   **快照卷 (Snapshot volumes)**：`LVM` 允许创建快照卷，这是逻辑卷在特定时间的临时副本。快照卷允许备份、测试和其他操作，而不影响原始逻辑卷。\n\
  *   **LVM 工具**：Linux 提供了一组用于管理 `LVM` 的命令行工具。一些常用命令包括用于创建物理卷的 `pvcreate`、创建卷组的 `vgcreate`、创建逻辑卷的\
  \ `lvcreate` 以及用于调整逻辑卷大小的 `lvresize`。\n*   **LVM 文件系统支持**：`LVM` 与 `ext4`、`XFS` 和\
  \ `Btrfs` 等各种文件系统无缝工作。创建逻辑卷后，可以使用 `mkfs` 等工具使用选择的文件系统对其进行格式化。\n*   **LVM 快照和备份**：`LVM`\
  \ 快照可用于创建逻辑卷的时间备份。通过拍摄快照，你可以捕获逻辑卷的状态并备份，而无需中断正在的操作。\n\nLVM 为 Linux 中的磁盘管理提供了一种灵活且可扩展的方法，允许对存储空间进行动态分配、调整大小和高效利用。它提供了条带、镜像、快照和逻辑卷简化管理等功能。通过\
  \ `LVM`，你可以调整存储配置以适应不断的需求，而不会破坏数据可用性或需要大量的手动磁盘管理操作。\n\n我们可以通过以下示例设置 LVM：\n\n###\
  \ 创建物理卷：\n```\npvcreate /dev/sdb1 /dev/sdc1\n```\n\n### 创建卷组：\n```\nvgcreate myvg\
  \ /dev/sdb1 /dev/sdc1\n```\n\n### 创建和管理逻辑卷：\n#### 创建逻辑卷：\n```\nlvcreate -L 10G -n\
  \ mylv myvg\n```\n\n### LVM 文件系统操作：\n#### 使用 ext4 格式化逻辑卷：\n```\nmkfs.ext4 /dev/myvg/mylv\n\
  ```\n#### 挂载逻辑卷：\n```\nmount /dev/myvg/mylv /mnt/mylv\n```\n\n可选，我们可以使用以下示例进行调整大小、扩展、缩小、创建条带和镜像、快照、备份和恢复：\n\
  \n### 调整逻辑卷大小或扩展：\n```\nlvextend -L +25G /dev/myvg/mylv\n```\n`-L +25G` 指定了逻辑卷的新大小。在这种情况下，它增加了\
  \ 25GB 容量。\n\n### 缩小逻辑卷：\n```\nlvreduce -L -10G /dev/myvg/mylv\n```\n`-L -10G` 缩小了逻辑卷的大小，在这种情况下，减小到\
  \ 10G。\n\n### 条带和镜像：\n#### 创建条带逻辑卷：\n```\nlvcreate -L 20G -i 2 -I 64 -n stripedlv\
  \ myvg\n```\n#### 创建镜像逻辑卷：\n```\nlvcreate -L 20G -m 1 -n mirroredlv myvg\n```\n\n\
  ### 创建和管理 LVM 快照：\n#### 创建快照卷：\n```\nlvcreate -L 15G -s -n snapshotlv /dev/myvg/mylv\n\
  ```\n#### 拍摄快照：\n```\nlvcreate -s -n snapshot2lv -L 15G /dev/myvg/mylv\n```\n\n\
  ### LVM 备份和恢复：\n#### 使用快照备份逻辑卷：\n```\nlvcreate -L 15G -s -n backupsnapshotlv /dev/myvg/mylv\n\
  ```\n#### 从快照恢复逻辑卷：\n```\nlvconvert --merge /dev/myvg/backsnapshotlv\n```\n\n##\
  \ 结论\n\n在本章中，我们查看了操作文件和目录的方法。我们提到了创建、删除等操作。接下来，我们查看了在目录之间导航、创建和删除目录的方法。最后，我们关注了在\
  \ Linux 终端内部配置存储设备的各种方法。在下一章中，我们将涵盖进程、服务和网络配置。\n\n加入我们书籍的 Discord 空间\n\n加入书籍的 Discord\
