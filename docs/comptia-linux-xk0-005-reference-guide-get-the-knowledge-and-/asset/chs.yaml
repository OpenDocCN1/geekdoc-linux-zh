  \ `head` 命令作为文件的输出，因为内容通常会超出屏幕。参考图 1.11：\n\n![](img/Figure_1.11.png)\n\n图 1.11：`/var/syslog`\
  \ 的输出\n\n在我们的 Centos 机器上，没有名为 `syslog` 的日志文件，相反它被称为 `messages`，如图 1.12 所示：\n\n![](img/Figure_1.12.png)\n\
  \n图 1.12：`/var/log` 目录的内容\n\nCentos 上 `/var/log/messages` 的内容与 `/var/log/syslog`\
  \ 类似。参考图 1.13：\n\n![](img/Figure_1.13.png)\n\n图 1.13：`/var/log/messages` 的内容\n\n\
  要查看 Centos 上的 `/var/log/messages` 内容，你需要管理员权限或作为 root 用户。我们将在第 6 章防火墙远程访问和 SELinux\
  \ 中详细讨论此。\n\n当我们查找内核消息时，有一个 `/var/log/kern.log` 文件；与 `syslog` 文件一样，该文件的输出非常冗长，因此我们将再次使用\
