  部分输出已省略。`aptitude` 命令对于任何 Linux 管理员来说都非常实用。\n\n## YUM\n\n`YUM` 实用是一种用于使用 Red Hat\
  \ 发行版系统的开源命令行软件包管理方法。`YUM` 让我们这些 Linux 管理员能够在基于 RPM 的发行版上执行自动更新、软件包管理和依赖关系管理。`Yum`\
  \ 与其对应的 Debian APT 类似。`YUM` 工具利用了各种软件存储库。软件库（通常称为 repo）存储了多种软件包。使用 `YUM` 的主要原因之一是它可以检测特定软件包是否需要任何依赖文件。然后它会提示用户所需的文件，并提作为软件包安装的一部分进行安装，而这本该是用户从一开始发起的。\n\
  \n| 注意： | 一个值得注意的有趣点是 YUM 与 RPM 软件包配合。 |\n\n首先，我们可以使用 `list` 选项查看 YUM 数据库中可用的软件包：\n\
  \n```\n[philip@localhost ~]$ yum list | less\n```\n\n元数据是 2 周前的。安装 `yum-cron` 吗？或者运行：`yum\
