  \n为了简洁起见省略了部分输出。根据以上内容，我们已成功安装了 `rsyslog` 包。现在，我们需要使用 `vi` 或 `nano` 等文本编辑器编辑 `/etc/rsyslog.conf`；我们需要指定远程日志服务器的\
  \ IP 地址。以下是操作方法：\n\n```bash\n[root@localhost philip]# cat /etc/rsyslog.conf\n\n\
  ## rsyslog 配置文件\n\n# 更多信息请参阅 /usr/share/doc/rsyslog-*/rsyslog_conf.html\n# 或者在网上查看最新版本\
  \ http://www.rsyslog.com/doc/rsyslog_conf.html\n# 如果你遇到问题，请参阅 http://www.rsyslog.com/doc/troubleshoot.html\n\
  #queue.maxdiskspace=\"1g\" # 1gb 空间限制（尽可能使用）\n#queue.saveonshutdown=\"on\" # 关时保存消息到磁盘\n\
  #queue.type=\"LinkedList\" # 异步运行\n#action.resumeRetryCount=\"-1\" # 如果主机宕机，则无限重试\n\
  # # 远程日志（我们使用 TCP 保证可靠传输）\n# # remote_host 是：名称/ip，例如 192.168.0.1，端口可选，例如 10514\n\
  #Target=\"remote_host\" Port=\"XXX\" Protocol=\"tcp\")\n*.* @172.16.175.132:514\n\
  \n[root@localhost philip]#\n```\n\n为了简洁起见省略了部分输出。根据以上输出，我们添加了最后条目。\n\n`*.* @172.16.175.132:514`\n\
  \n这是通知本地系统使用 UDP 协议和端口号 `514` 将所有日志设施 `*.` 的所有严重级别 `.*` 消息发送远程系统 `172.16.175.132`。我们也可以做得更具体；例如，可以通过指定关键字\
  \ `emerg:` 仅从每个设施发送紧急（emergency）消息：\n\n```bash\n[root@localhost philip]# cat /etc/rsyslog.conf\n\
  \n## rsyslog 配置文件\n#queue.maxdiskspace=\"1g\" # 1gb 空间限制（尽可能使用）\n#queue.saveonshutdown=\"\
  on\" # 关时保存消息到磁盘\n#queue.type=\"LinkedList\" # 异步运行\n#action.resumeRetryCount=\"\
  -1\" # 如果主机宕机，则无限重试\n# # 远程日志（我们使用 TCP 保证可靠传输）\n# # remote_host 是：名称/ip，例如 192.168.0.1，端口可选，例如\
  \ 10514\n#Target=\"remote_host\" Port=\"XXX\" Protocol=\"tcp\")\n*.emerg @172.16.175.132:514\n\
  \n[root@localhost philip]#\n```\n\n根据以上内容，每个带有紧急消息的设施将通过 UDP 发送到远程服务器。到此为止，我们一直使用\
  \ UDP 发送日志，但也可以使用 TCP 发送。我们需要在第一个 `@` 前面再添加一个 `@` 来使用 TCP 作为传输。。如下所示。我们将消息类型从 `emerg`\
  \ 更改为 `info` 并使用 TCP 作为传输协议：\n\n```bash\n[root@localhost philip]# cat /etc/rsyslog.conf\n\
  \n## rsyslog 配置文件\n#queue.maxdiskspace=\"1g\" # 1gb 空间限制（尽可能使用）\n#queue.saveonshutdown=\"\
  on\" # 关时保存消息到磁盘\n#queue.type=\"LinkedList\" # 异步运行\n#action.resumeRetryCount=\"\
  -1\" # 如果主机宕机，则无限重试\n# # 远程日志（我们使用 TCP 保证可靠传输）\n# # remote_host 是：名称/ip，例如 192.168.0.1，端口可选，例如\
  \ 10514\n#Target=\"remote_host\" Port=\"XXX\" Protocol=\"tcp\")\n*.info @@172.16.175.132:514\n\
  \n[root@localhost philip]#\n```\n\n为了简洁起见省略了部分输出。最后一步是重启 `rsyslog` 守护进程，以便新更改生效。我们将像下面所示使用\
  \ `systemctl` 命令来重启 `rsyslog` 守护进程：\n\n```bash\n[root@localhost philip]# systemctl\
  \ restart rsyslog\n```\n\n参考 图 4.8：\n\n![rsyslog status.png](img/Figure_4.8.png)\n\
  \n图 4.8：带有状态选项的 `systemctl` 命令\n\n根据以上内容，我们可以看到 `rsyslog` 守护进程正在运行。注意 `systemctl\
  \ status` 的底部。有一些关于连接到 `172/16.175.132` 的日志，这是因为我们还没有配置接收来自 `172.16.175.132` 的日志。现在我们将转到\
  \ Ubuntu 系统编辑 `/etc/rsyslog.conf` 并添加以下内容：\n\n```bash\n[root@localhost philip]#\
  \ cat /etc/rsyslog.conf\n\n# provides UDP reception\nmodule(load=\"imudp\")\ninput(type=\"\
  udp\" port=\"514\")\n# provides TCP reception\nmodule(load=\"imtcp\")\ninput(type=\"\
  tcp\" port=\"514\")\n```\n*(注：此处根据原文提供的代码块 `module(load=\"imudp\")` 等补充了翻译逻辑)*\n\
  \n```bash\nroot@philip-virtual-machine:/var/log\n```\n\n为了简洁起见省略了部分输出。根据以上内容，我们取消了\
  \ TCP 部分的注释。最后一步是重启 `rsyslog` 守护进程，以便新更改生效。这可以通过 `systemctl` 命令完成，如图 4.9 所示：\n\n\
  ![rsyslogserver.png](img/Figure_4.9.png)\n\n图 4.9：带有状态选项的 `systemctl` 命令\n\n根据以上内容，`rsyslog`\
