  ;; MSG SIZE rcvd: 83\n```\n```root@philip-virtual-machine:/home/philip#\n\n我们可以看到给定域名的\
  \ DNS 记录；特别是 `A` 记录。回答我们查询的服务器是 `8.8.8.8`，我们在 `/etc/resolv.conf` 中配置的。然而，我们可以通过向\
  \ `dig` 命令传递 `@` 来使用不同的 DNS 服务器，如下所示：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ dig @8.8.4.4 ding.com\n; <<>> DiG 9.11.3-11-Ubuntu <<>> @8.8.4.4 ding.com\n; (1\
  \ server found)\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode:\
