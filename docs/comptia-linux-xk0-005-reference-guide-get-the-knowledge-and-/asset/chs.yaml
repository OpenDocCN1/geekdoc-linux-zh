  \n\n\n\n\n可以配置 Linux 系统执行远程日志记录。我们将安装（如果尚未安装）日志软件。在本次演示中，我们将使用 Fedora 作为日志客户端，并将\
  \ Ubuntu 系统作为日志服务器。此外，我们将使用 `Rsyslog` 作为日志软件。\n\n### 在 Fedora 上安装 Rsyslog\n\n首先，让我们在\
  \ Fedora 中安装 `Rsyslog` 软件。我们将像下面所示所示使用 `dnf` 命令：\n\n```bash\n[root@localhost philip]#\
  \ dnf search rsyslog\n\nLast metadata expiration check: 1:38:20 ago on Mon 10 Jun\
  \ 2023 10:41:18 AM EDT.\n\n============================================= Name Exactly\
