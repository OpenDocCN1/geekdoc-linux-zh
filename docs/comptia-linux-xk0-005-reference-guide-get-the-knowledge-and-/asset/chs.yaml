  \n![](img/fm1.png)\n\n# 第 3 章：进程、服务和网络配置\n\n## 引言\n\n在上一章中，我们涵盖了各种文件、目录和存储设备。\n\n\
  在本章中，我们将重点关注进程、服务和网络配置。\n\n首先，我们将关注进程，然后将涵盖服务。最后，我们将通过查看网络配置来结束本章。\n\n## 结构\n\n\
  在本章中，我们将讨论以下主题：\n* 进程\n* 服务\n* 网络配置\n\n## 目标\n\n在本章中，我们将深入研究进程的管理。我们将探索 `systemd`\
  \ 的概念，这是一种系统和服务管理器，在 Linux 环境中通过控制和监控进程方面起着至关重要的作用。此外，我们将深入研究 IP 地址，理解它们在网络中的重要性以及它们如何促进设备之间的通信。此外，我们将深入研究网络设置的配置，使自己具备根据特定需求设置和自定义网络配置的知识和技能。\n\
  \n## 进程\n\n在 Linux 中，进程是正在执行的程序实例。它代表了操作系统中特定任务或程序的执行。进程是 Linux 多任务能力的基础，允许多个程序并发运行并共享系统资源。\n\
  \n以下是理解 Linux 进程的一些关键点：\n* 每个进程都被分配一个唯一的进程 ID (`PID`) 标识符。PID 是操作系统用于跟踪和管理进程的整数。\n\
  * Linux 中的进程可以处于各种状态，包括：\n    * 运行 (Running)：进程正在 CPU 上执行。\n    * 睡眠 (Sleeping)：进程正在等待事件或资源可用。\n\
  \    * 停止 (Stopped)：进程被用户或信号停止。\n    * 僵尸 (Zombie)：进程已完成执行，但在父进程确认其终止之前在进程表中仍有一个条目。\n\
  * 进程控制块 (PCB)：操作系统为每个进程维护一个 `PCB` 数据结构。`PCB` 包含了有关进程的信息，包括其 `PID`、状态、寄存器值、内存分配、打开的文件和其他相关详细信息。\n\
  \n\n\n\n\n-   **父进程与子进程**：在 Linux 中，进程可以创建子进程。创建新进程的进程称为父进程，新创建的进程称为子进程。父进程和子进程可以相互通信并共享资源。\n\
  -   **进程调度**：Linux 内核负责管理进程在 CPU 上执行。它使用调度算法来决定哪个进程运行以及运行多长时间。调度器确保了系统资源的公平访问和 CPU\
  \ 的高效利用。\n-   **进程间通信 (IPC)**：Linux 中的进程可以通过各种称为 IPC 的机制进行相互通信。IPC 机制包括管道、共享内存、消息队列、套接字和信号。这些机制允许进程交换数据并同步它们的动作。\n\
  -   **进程终止**：进程可以通过调用 `exit` 系统调用自愿终止，也可以由于错误或接收到信号非自愿地终止。当进程终止时，它会释放正在使用的资源并通知其父进程。\n\
  \n## ps 命令\n\n`ps` 命令代表 `Process Status`（进程状态），是当今最流行的命令之一。它显示了系统中运行的所有当前进程。通常，我们在\
  \ Linux 环境中工作，却忽略了让这一切成为可能的底层进程。`ps` 命令显示的所有信息都来自一个常用的目录，`/proc` 文件系统。`/proc` 本身并不是一个真实的文件系统；实际上，它是一个虚拟文件系统。它在启动时加载，你可以在今天几乎所有的\
  \ Linux 发行版中找到 `/proc`。让我们深入研究 `ps` 命令。\n\n首先，我们可以显示当前 shell 中启动的任何进程：\n\n```bash\n\
  [philip@localhost ~]$ ps\n\nPID TTY TIME CMD\n2220 pts/0 00:00:00 bash\n95677 pts/0\
  \ 00:00:00 ps\n[philip@localhost ~]$\n```\n\n根据上述输出，除了 `ps` 命令和 `bash` shell 外，我们没有在当前\
  \ shell 中启动其他进程。我们还可以使用 `ps` 命令配合 `-A` 选项列出系统中当前所有的进程：\n\n```bash\n[philip@localhost\
  \ ~]$ ps -A\n\nPID TTY TIME CMD\n1 ? 00:00:31 systemd\n2 ? 00:00:00 kthreadd\n3\
  \ ? 00:00:02 ksoftirqd/0\n5 ? 00:00:00 kworker/0:0H\n7 ? 00:00:00 migration/0\n\
  8 ? 00:00:00 rcu_bh\n9 ? 00:00:12 rcu_sched\n10 ? 00:00:11 watchdog/0\n12 ? 00:00:00\
  \ kdevtmpfs\n13 ? 00:00:00 netns\n14 ? 00:00:00 khungtaskd\n15 ? 00:00:00 writeback\n\
  95730 ? 00:00:00 kworker/0:3\n95747 ? 00:00:00 sleep\n95748 pts/0 00:00:00 ps\n\
  [philip@localhost ~]$\n```\n\n为了简洁起见，省略了部分输出。当我们使用 `-A` 或 `-e` 选项运行 `ps` 命令时，它只会打印每个进程的\
  \ ID 和名称。然而，我们可以进一步扩展此输出。我们可以配合 `-u` 传递 `-a` 选项。这将打印打开终端的当前用户的进程：\n\n```bash\n[philip@localhost\
  \ ~]$ ps -au\n\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\nroot 1042\
  \ 0.0 2.5 306324 25956 tty1 Rsl+ Aug08 0:25 /usr/bin/X :0 -background none -noreset\
  \ -audit 4 -verbose -auth /run/gdm/auth-for-gd\nphilip 2220 0.0 0.1 116304 1332\
  \ pts/0 Ss Aug08 0:00 bash\nphilip 95843 0.0 0.1 151064 1816 pts/0 R+ 06:19 0:00\
  \ ps -au\n[philip@localhost ~]$\n```\n\n要查看系统中由当前用户所有的所有进程，我们需要传递 `-x` 选项：\n\n```bash\n\
  [philip@localhost ~]$ ps -x\n\nPID TTY STAT TIME COMMAND\n1487 ? Sl 0:00 /usr/bin/gnome-keyring-daemon\
  \ --daemonize --login\n1491 ? Ssl 0:01 /usr/libexec/gnome-session-binary --session\
  \ gnome-classic\n1498 ? S 0:00 dbus-launch --sh-syntax --exit-with-session\n1499\
  \ ? Ssl 0:00 /bin/dbus-daemon --fork --print-pid 4 --print-address 6 --session\n\
  1567 ? Sl 0:00 /usr/libexec/gvfsd\n1572 ? Sl 0:00 /usr/libexec/gvfsd-fuse /run/user/1000/gvfs\
  \ -f -o big_writes\n1664 ? Ss 0:00 /usr/bin/ssh-agent /bin/sh -c exec -l /bin/bash\
  \ -c \"env GNOME_SHELL_SESSION_MODE=classic gnome-session --session gnome-cla\n\
  1683 ? Sl 0:00 /usr/libexec/at-spi-bus-launcher\n1688 ? Sl 0:00 /bin/dbus-daemon\
  \ --config-file=/usr/share/defaults/at-spi2/accessibility.conf --nofork --print-address\
  \ 3\n```\n\n为了简洁起见，省略了部分输出。我们还可以通过 `-u` 在参数中指定一个用户：\n\n```bash\n[philip@localhost\
  \ ~]$ ps -au root\n\nPID TTY TIME CMD\n1 ? 00:00:31 systemd\n2 ? 00:00:00 kthreadd\n\
  3 ? 00:00:02 ksoftirqd/0\n5 ? 00:00:00 kworker/0:0H\n```\n\n为了简洁起见，省略了部分输出。我们还可以查看每个守护进程的可执行文件路径之外的所有用户；我们应该使用\
  \ `-aux` 或 `aux-`（这是绑定语法）：\n\n```bash\n[philip@localhost ~]$ ps -aux\n\nUSER PID\
  \ %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\nroot 1 0.0 0.4 193700 4216 ? Ss\
  \ Aug08 0:31 /usr/lib/systemd/systemd --switched-root --system --deserialize 21\n\
  root 2 0.0 0.0 0 0 ? S Aug08 0:00 [kthreadd]\nroot 3 0.0 0.0 0 0 ? S Aug08 0:02\
  \ [ksoftirqd/0]\nroot 5 0.0 0.0 0 0 ? S< Aug08 0:00 [kworker/0:0H]\ndbus 570 0.0\
  \ 0.2 36524 2236 ? Ssl Aug08 0:14 /bin/dbus-daemon --system --address=systemd: --nofork\
  \ --nopork\n```\n\n\n\n\n\n根据上述输出，仅显示相应 `PID` 的实际可执行文件。\n\n我们也可以使用 `ps` 命令获取内存和\
  \ CPU 信息；我们将传递 `-e` 并配合 `-o` 参数。然后，我们需要指定感兴趣的列名。以下是实现这一的方法：\n\n```bash\n[philip@localhost\
  \ ~]$ ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head -14\n```\n\nPID PPID CMD\
  \ %MEM %CPU\n1710 1491 /usr/bin/gnome-shell 17.9 0.0\n1926 1491 /usr/bin/gnome-software\
  \ --g 7.1 0.0\n1042 989 /usr/bin/X :0 -background n 2.5 0.0\n95581 633 /sbin/dhclient\
  \ -d -q -sf /u 1.3 0.0\n2213 1 /usr/libexec/gnome-terminal 1.1 0.0\n605 1 /usr/lib/polkit-1/polkitd\
  \ - 1.1 0.0\n1872 1491 /usr/libexec/gnome-settings 0.8 0.0\n633 1 /usr/sbin/NetworkManager\
  \ -- 0.8 0.0\n1890 1491 nautilus-desktop --force 0.7 0.0\n2050 1915 /usr/libexec/evolution-cale\
  \ 0.6 0.0\n1291 1 /usr/libexec/packagekitd 0.6 0.0\n632 1 /usr/bin/python -Es /usr/sb\
  \ 0.4 0.0\n1990 1915 /usr/libexec/evolution-cale 0.4 0.0\n[philip@localhost ~]$\n\
  ```\n\n根据上述输出，我们指定了 `pid`、`ppid`、`cmd`、`%mem` 和 `%cpu`。此外，还添加了 `--sort` 选项。它会查找占用系统内存最多的进程，并从从高到低的顺序显示它们。此外，我们添加了\
  \ `head` 命令；这将只显示内容的顶部部分。我们通过 `head` 命令指定了行数（`-14`），这会将输出限制在前 14 行。然而，`ps` 命令的输出不是实时刷新的；我们可以使用另一个流行的命令来实时查看输出，而无需手动重新运行命令。我们将使用\
  \ `watch` 命令来完成此任务：\n\n```bash\n[philip@localhost ~]$ watch -n 1 'ps -eo pid,ppid,cmd,%mem,%cpu\
  \ --sort=-%cpu | head'\n```\n\n根据上述输出，我们对输出进行了排序，以查看系统中占用 CPU 最高的进程。要以层级视图查看 `ps`\
  \ 命令的输出，我们需要传递 `-f` 和 `--forest` 选项：\n\n```bash\n[philip@localhost ~]$ ps -af --forest\n\
  UID PID PPID C STIME TTY TIME CMD\nphilip 99053 2220 0 07:29 pts/0 00:00:00 ps -af\
  \ --forest\n\n[philip@localhost ~]$ ps -axf --forest\nPID TTY STAT TIME COMMAND\n\
  2 ? S 0:00 [kthreadd]\n3 ? S 0:02 \\_ [ksoftirqd/0]\n517 ? S<sl 0:00 /sbin/auditd\n\
  519 ? S<sl 0:01 \\_ /sbin/audispd\n521 ? S< 0:00 \\_ /usr/sbin/sedispatch\n543 ?\
  \ SNsl 0:04 /usr/libexec/rtkit-daemon\n1664 ? Ss 0:00 \\_ /usr/bin/ssh-agent /bin/sh\
  \ -c exec -l /bin/bash -c \"env GNOME_SHELL_SESSION_MODE=classic gnome-session --sessi\n\
  1710 ? Sl 5:01 \\_ /usr/bin/gnome-shell\n1730 ? Sl 0:00 | \\_ ibus-daemon --xim\
  \ --panel disable\n1743 ? Sl 0:00 | \\_ /usr/libexec/ibus-dconf\n2001 ? Sl 0:00\
  \ | \\_ /usr/libexec/ibus-engine-simple\n1872 ? Sl 0:18 \\_ /usr/libexec/gnome-settings-daemon\n\
  ```\n为了简洁起见，省略了部分输出。\n\n### kill 命令\n\n`kill` 命令用于终止进程。我们可以利用刚刚介绍的 `ps` 命令来识别进程，然后调用\
  \ `kill` 命令来结束该进程。以下是使用 `kill` 命令停止进程的方法：\n\n```bash\n[philip@localhost ~]$ ps -p\
  \ 1788\nPID TTY TIME CMD\n1788 ? 00:00:00 goa-daemon\n\n[philip@localhost ~]$\n\
  [philip@localhost ~]$ kill -9 1788\n[philip@localhost ~]$ ps -fp 1788\nUID PID PPID\
  \ C STIME TTY TIME CMD\n[philip@localhost ~]$\n```\n\n我们使用了数字 `9`，这意味着发送一个 `SIGKILL`。要查看我们可以传递的各种信号，可以使用\
  \ `kill` 命令的 `-l` 选项：\n\n```bash\n[philip@localhost ~]$ kill -l\n1) SIGHUP 2) SIGINT\
  \ 3) SIGQUIT 4) SIGILL 5) SIGTRAP\n6) SIGABRT 7) SIGBUS 8) SIGFPE 9) SIGKILL 10)\
  \ SIGUSR1\n11) SIGSEGV 12) SIGUSR2 13) SIGPIPE 14) SIGALRM 15) SIGTERM\n16) SIGSTKFLT\
  \ 17) SIGCHLD 18) SIGCONT 19) SIGSTOP 20) SIGTSTP\n21) SIGTTIN 22) SIGTTOU 23) SIGURG\
  \ 24) SIGXCPU 25) SIGXFSZ\n26) SIGVTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO 30)\
  \ SIGPWR\n31) SIGSYS 34) SIGRTMIN 35) SIGRTMIN+1 36) SIGRTMIN+2 37) SIGRTMIN+3\n\
  38) SIGRTMIN+4 39) SIGRTMIN+5 40) SIGRTMIN+6 41) SIGRTMIN+7 42) SIGRTMIN+8\n43)\
  \ SIGRTMIN+9 44) SIGRTMIN+10 45) SIGRTMIN+11 46) SIGRTMIN+12 47) SIGRTMIN+13\n48)\
  \ SIGRTMIN+14 49) SIGRTMIN+15 50) SIGRTMAX-14 51) SIGRTMAX-13 52) SIGRTMAX-12\n\
  53) SIGRTMAX-11 54) SIGRTMAX-10 55) SIGRTMAX-9 56) SIGRTMAX-8 57) SIGRTMAX-7\n58)\
  \ SIGRTMAX-6 59) SIGRTMAX-5 60) SIGRTMAX-4 61) SIGRTMAX-3\n```\n\n\n\n\n\n## top\
