  \n![](img/fm1.png)\n\n# 第 9 章 网络和系统问题的排排除\n\n## 引言\n在上一章中，我们涵盖了自动化，首先查看了 YAML，接着是\
  \ JSON，最后用 Ansible 结束了学习。在本章中，我们将关注 Linux 环境中常见的问题。在这里，我们将深入探讨经常出现的挑战，并探索解决这些问题的有效策略。在本章中，我们将深入学习许多对于诊断网络问题和监控系统性能至重要的命令。从\
  \ `ping`、`traceroute` 和 `netstat` 等命令，到 `Nmap`、`dig` 和 `vmstat` 等工具，你将掌握这些强大的工具。通过深入了解这些常见问题并学习排排除技术，你将具备克服障碍和维护健壮\
  \ Linux 环境的知识和技能。\n\n## 结构\n在本章中，我们将讨论以下主题：\n\n*   网络排排除\n*   内存排排除\n*   硬盘排排除\n\
  *   启动问题排排除\n\n## 目标\n在本章中，我们将探索各种用于网络诊断和系统监控的本质命令。这包括学习如何使用 `ping`、`ping6`、`traceroute`、`traceroute6`、`netstat`、`tracepath`、`nmap`、`dig`、`whois`、`hostname`、`free`、`vmstat`、`swapon`、`smartctl`、`fsck`\
  \ 和 `update-grub` 等命令。掌握这些命令，你将具备必要的工具来诊断网络问题、监控系统性能并管理 Linux 环境的各个方面。\n\n## 网络排排除\n\
  我们可以使用从 GUI 工具到命令行工具的多种工具来帮助排排除网络连接问题。\n\n## ping 命令\n`ping` 工具使用 ICMP 协议发送请求并接收响应。我们可以使用\
  \ `ping` 工具测试本地或互联网系统之间的基本可达性。`ping` 工具的基本语法为：\n\n```\nping <DNS name or IPv4>\n\
  ```\n\n根据上述内容，我们可以像下面所示尝试 `ping` 工具：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ ping Fedora\n\nPING Fedora (172.16.175.129) 56(84) bytes of data.\n\n64 bytes\
  \ from Fedora (172.16.175.129): icmp_seq=1 ttl=64 time=0.299 ms\n\n64 bytes from\
  \ Fedora (172.16.175.129): icmp_seq=2 ttl=64 time=0.341 ms\n\n64 bytes from Fedora\
  \ (172.16.175.129): icmp_seq=3 ttl=64 time=0.733 ms\n\n64 bytes from Fedora (172.16.175.129):\
  \ icmp_seq=4 ttl=64 time=0.957 ms\n\n64 bytes from Fedora (172.16.175.129): icmp_seq=5\
  \ ttl=64 time=0.224 ms\n\n^C\n\n--- Fedora ping statistics ---\n\n6 packets transmitted,\
  \ 6 received, 0% packet loss, time 5064ms\n\nrtt min/avg/max/mdev = 0.224/0.564/0.957/0.287\
  \ ms\n\nroot@philip-virtual-machine:/home/philip#\n```\n\n`ping` 工具将一直运行直到用户使用 `Ctrl+C`\
  \ 停止；这与 Windows 环境中不同，Windows 只显示 4 个 ICMP 回显请求/响应。\n\n## ping6 命令\n也可以测试 IPv6 的潜在连接性问题。我们将使用\
  \ `ping6` 命令；`ping6` 命令的语法为：\n\n```\nping6 <DNS name or IPv6>\n```\n\n根据上述内容，我们只需要指定目标系统的\
  \ DNS 名称或 IPv6 地址。这里我们像下面所示使用 `ping6` 命令：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ ping6 2001:db8:0:f101::3\n\nPING 2001:db8:0:f101::3(2001:db8:0:f101::3) 56 data\
  \ bytes\n\n64 bytes from 2001:db8:0:f101::3: icmp_seq=1 ttl=64 time=0.355 ms\n\n\
  64 bytes from 2001:db8:0:f101::3: icmp_seq=2 ttl=64 time=0.289 ms\n\n64 bytes from\
  \ 2001:db8:0:f101::3: icmp_seq=3 ttl=64 time=0.222 ms\n\n64 bytes from 2001:db8:0:f101::3:\
  \ icmp_seq=4 ttl=64 time=0.596 ms\n\n^C\n\n--- 2001:db8:0:f101::3 ping statistics\
  \ ---\n\n4 packets transmitted, 4 received, 0% packet loss, time 3052ms\n\nrtt min/avg/max/mdev\
  \ = 0.222/0.365/0.596/0.142 ms\n\nroot@philip-virtual-machine:/home/philip#\n```\n\
  \n### traceroute 命令\n我们可以使用 `traceroute` 命令来测试潜在的连接性问题。`traceroute` 命令显示通往目标系统路径上的每个设备；每个设备被视为跳（hop）。`traceroute`\
  \ 的基本语法为：\n\n```\ntraceroute <DNS name or IPv4>\n```\n\n我们只需要指定目标系统的 DNS 名称或 IPv4\
  \ 地址，如下所示：\n\n```\nroot@philip-virtual-machine:/home/philip# traceroute Fedora\n\
  \nCommand 'traceroute' not found, but can be installed with:\n\napt install inetutils-traceroute\n\
  \napt install traceroute\n\nroot@philip-virtual-machine:/home/philip# apt-install\
  \ inetutils-traceroute\n\nupdate-alternatives: using /usr/bin/inetutils-traceroute\
  \ to provide /usr/bin/traceroute (traceroute) in auto mode\n\nProcessing triggers\
  \ for man-db (2.8.3-2) ...\n\nroot@philip-virtual-machine:/home/philip#\n```\n\n\
  Ubuntu 18 默认没有安装 `traceroute` 工具；我们通过安装 `inetutils-traceroute` 软件包快速解决了这个问题。现在让我们像下面所示再次运行\
  \ `traceroute` 命令：\n\n```\nroot@philip-virtual-machine:/home/philip# traceroute\
  \ Fedora\n\ntraceroute to Fedora (172.16.175.129), 64 hops max\n\n1 172.16.175.129\
  \ 0.199ms 0.199ms 0.251ms\n\nroot@philip-virtual-machine:/home/philip#\n```\n\n\
  我们可以看到该设备距离 Ubuntu 系统只有一跳距离。\n\n### traceroute6 命令\n也可以使用 `traceroute6` 命令测试 IPv6\
  \ 系统之间的潜在瓶颈。`traceroute6` 的基本语法为：\n\n```\ntraceroute6 <DNS name or IPv6>\n```\n\n\
  我们只需要指定目标系统的 DNS 名称或 IPv6 地址。这里我们像下面所示使用 `traceroute6` 命令：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ traceroute6 2001:db8:0:f101::3\n\nPING 2001:db8:0:f101::3(2001:db8:0:f101::3)\
  \ 56 data bytes\n\n64 bytes from 2001:db8:0:f101::3: icmp_seq=1 ttl=64 time=0.355\
  \ ms\n\n64 bytes from 2001:db8:0:f101::3: icmp_seq=2 ttl=64 time=0.289 ms\n\n64\
  \ bytes from 2001:db8:0:f101::3: icmp_seq=3 ttl=64 time=0.222 ms\n\n64 bytes from\
  \ 2001:db8:0:f101::3: icmp_seq=4 ttl=64 time=0.596 ms\n\n^C\n\n--- 2001:db8:0:f101::3\
  \ ping statistics ---\n\n4 packets transmitted, 4 received, 0% packet loss, time\
  \ 3052ms\n\nrtt min/avg/max/mdev = 0.222/0.365/0.596/0.142 ms\n\nroot@philip-virtual-machine:/home/philip#\n\
  ```\n\n`traceroute6` 命令的工作方式与 `traceroute` 类似。\n\n## netstat 命令\n我们可以使用 `netstat`\
  \ 命令来排除许多不同的问题。在本章的早期，我们看到可以使用 `-r` 选项查看路由表。此外，我们也可以使用 `netstat` 命令查看活动连接。这在运行各种端口的服务器环境中特别有用；这些端口可能是\
  \ TCP 或 UDP 端口。我们可以传递 `-n` 选项显示数值地址，`-t` 选项显示 TCP 连接，`-l` 显示正在监听的套接字，以及 `-p` 选项显示进程\
  \ ID 和程序名。这些选项在缩小 TCP 端口范围时非常好。这里是 TCP 的显示：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ netstat -ntlp\n\nActive Internet connections (only servers)\n\nProto Recv-Q Send-Q\
  \ Local Address Foreign Address State PID/Program name\n\ntcp 0 0 0.0.0.0:514 0.0.0.0:*\
  \ LISTEN 26840/rsyslogd\n\ntcp 0 0 127.0.0.53:53 0.0.0.0:* LISTEN 418/systemd-resolve\n\
  \ntcp 0 0 0.0.0.0:22 0.0.0.0:* LISTEN 26189/sshd\n\ntcp 0 0 127.0.0.1:631 0.0.0.0:*\
  \ LISTEN 6548/cupsd\n\ntcp6 0 0 :::514 :::* LISTEN 26840/rsyslogd\n\ntcp6 0 0 :::22\
  \ :::* LISTEN 26189/sshd\n\ntcp6 0 0 ::1:631 :::* LISTEN 6548/cupsd\n\nroot@philip-virtual-machine:/home/philip#\n\
  ```\n\n我们看到了正在运行的多个程序，包括 dns、sshd 和 ryslogd 等。同样，我们可以查看 UDP 连接；我们需要传递 `nulp` 选项，其中\
  \ `-u` 表示 UDP，如下面所示：\n\n\n\n\n\n```\nroot@philip-virtual-machine:/home/philip# netstat\
  \ -nulp\n```\n\n活动 Internet 连接（仅限服务器）\n\nProto Recv-Q Send-Q Local Address Foreign\
  \ Address State PID/Program name\n\nudp 8448 0 127.0.0.53:53 0.0.0.0:* 418/systemd-resolve\n\
  udp 0 0 0.0.0.0:631 0.0.0.0:* 6550/cups-browsed\nudp 34112 0 0.0.0.0:5353 0.0.0.0:*\
  \ 607/avahi-daemon: r\nudp 0 0 0.0.0.0:48456 0.0.0.0:* 607/avahi-daemon: r\nudp6\
  \ 0 0 :::59636 :::* 607/avahi-daemon: r\nudp6 33152 0 :::5353 :::* 607/avahi-daemon:\
  \ r\n```\n```\nroot@philip-virtual-machine:/home/philip#\n```\n\n我们看到许多服务正在等待连接，`systemd-resolve`（端口\
  \ 53）就是其中之一。\n\n## tracepath 命令\n\n`tracepath` 命令是另一种测试系统间潜在瓶颈的方法。它的工作原理与 `traceroute`\
  \ 命令类似。`tracepath` 命令的基本语法为：\n\n```\ntracepath <DNS name or IPv4>\n```\n\n我们只需要指定\
  \ DNS 名称或 IPv4 地址来使用 `tracepath` 命令。如下所示：\n\n```\nroot@philip-virtual-machine:/home/philip#\
  \ tracepath Fedora\n1?: [LOCALHOST] pmtu 1500\n1: Fedora 0.309ms reached\n1: Fedora\
  \ 0.201ms reached\nResume: pmtu 1500 hops 1 back 1\n```\n```\nroot@philip-virtual-machine:/home/philip#\n\
  ```\n\n除了通往目标设备的跳数外，还会显示 `pmtu`（即路径 MTU）。\n\n## tracepath -6 命令\n\n与 `tracepath`\
  \ 命令一样，带有 `-6` 选项的 `tracepath` 是另一种使用 IPv6 地址测试系统间潜在瓶颈的方法。带有 `-6` 选项的 `tracepath`\
  \ 基本语法为：\n\n```\ntracepath -6 <DNS name or IPv6>\n```\n\n我们必须指定 DNS 名称或 IPv6 地址来使用带有\
  \ `-6` 选项的 `tracepath`。如下所示：\n\n```\nroot@philip-virtual-machine:/home/philip# tracepath\
  \ -6 2001:db8:0:f101::3\n1?: [LOCALHOST] 0.012ms pmtu 1500\n1: 2001:db8:0:f101::3\
  \ 0.384ms reached\n1: 2001:db8:0:f101::3 0.352ms reached\nResume: pmtu 1500 hops\
  \ 1 back 1\n```\n```\nroot@philip-virtual-machine:/home/philip#\n```\n\n我们可以看到带有\
  \ `-6` 选项的 `tracepath` 工作方式与针对 IPv4 的 `tracepath` 命令一致。\n\n## nmap 命令\n\n网络映射器 (`nmap`)\
  \ 也可以使用 `nmap` 命令排查潜在的连接问题；该命令扫描给定系统并显示为 `nmap` 命令指定的系统上对的开放的服务及其相应的端口号。`nmap` 命令的基本语法为：\n\
  \n```\nnmap <option> <IP of destination>\n```\n\n我们将为正在排查的目标系统指定选项和 IP 地址，如下所示：\n\
  \n```\nroot@Linuxplus:/home/philip# nmap -A -T4 172.16.175.129\nNmap scan report\
  \ for Fedora (172.16.175.129)\nHost is up (0.00066s latency).\nNot shown: 845 closed\
  \ ports, 154 filtered ports\nPORT STATE SERVICE VERSION\n22/tcp open OpenSSH OpenSSH\
  \ 7.7 (protocol 2.0)\n| ssh-hostkey:\n| 2048 b8:02:f8:79:f4:d8:77:b4:26:de:70:93:e8:66:94:69\
  \ (RSA)\n| 256 9b:e0:d1:33:3b:08:02:bf:fd:c6:48:c1:47:7d:9c:9e (ECDSA)\n|_ 256 cd:f8:47:d1:75:95:e3:59:f3:b6:c0:12:a0:8b:d1:0e\
  \ (EdDSA)\nMAC Address: 00:0C:29:04:35:BD (VMware)\nDevice type: general purpose\n\
  Running: Linux 3.X|4.X\nOS CPE: cpe:/o:linux:linux_kernel:3 cpe:/o:linux:linux_kernel:4\n\
  OS details: Linux 3.10 - 4.8\nNetwork Distance: 1 hop\nTRACEROUTE\nHOP RTT ADDRESS\n\
  1 0.66 ms Fedora (172.16.175.129)\nOS and Service detection performed. Please report\
  \ any incorrect results at https://nmap.org/submit/ .\nNmap done: 1 IP address (1\
  \ host up) scanned in 49.30 seconds\n```\n```\nroot@Linuxplus:/home/philip#\n```\n\
  \n我们可以看到目标系统上运行哪些服务及其相应的端口号。`-A` 选项用于显示操作系统和版本检测；`-T4` 选项用于加速执行。在运行 `nmap` 命令之前，您应该获得目标系统或网络所有者或管理员的许可；确实如此，特别是在企业环境中，那里有规定使用特定网络的政策。\n\
  \n> 注意：在网络中进行任何端口扫描之前，请始终寻求许可。\n\n## dig 命令\n\n到为止，我们一直在查看排查连接问题的方法，但 DNS 问题也可能带来风险。我们可以使用\
  \ `dig` 工具执行执行域名的 DNS 查询。`dig` 命令的基本语法为：\n\n```\ndig <domain>\n```\n\n我们只需要指定想要查询的域名即可。以下是执行简单查询的方法：\n\
  \n```\nroot@philip-virtual-machine:/home/philip# dig www.ding.com\n; <<>> DiG 9.11.3-1ubuntu1-Ubuntu\
  \ <<>> www.ding.com\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode:\
  \ QUERY, status: NOERROR, id: 39472\n;; flags: qr rd ra; QUERY: 1, ANSWER: 2, AUTHORITY:\
  \ 0, ADDITIONAL: 1\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags;; udp: 512\n\
  ;; QUESTION SECTION:\n;www.ding.com. IN A\n;; ANSWER SECTION:\nwww.ding.com. 14037\
  \ IN CNAME car.ding.com.\ncar.ding.com. 14049 IN A 88.166.179.231\n;; Query time:\
  \ 77 msec\n;; SERVER: 8.8.8.8#53(8.8.8.8)\n;; WHEN: Wed Mar 06 16:21:23 -04 2023\n\
  ;; MSG SIZE rcvd: 83\n```\n```\nroot@philip-virtual-machine:/home/philip#\n```\n\
