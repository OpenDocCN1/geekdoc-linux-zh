  \ `deb-src` 开头的条目指的是源包。Aptitude 是 Debian 软件包管理器 `Apt` 的前端。它最适用于没有 GUI 的 shell 环境。`aptitude`\
  \ 命令允许用户查看软件包列表并执行管理任务，如安装、移除或升级软件包。它有一个交互模式；同时它也可以作为命令行工具使用，类似于 `apt-get`。我们可以通过直接输入\
  \ `aptitude` 命令而不传递任何参数来看到它的运行。从上面的输出中，我们可以通过键盘或鼠标进行导航。在顶部有一个菜单，我们可以从菜单中选择 Actions（操作）并查看可用选项。我们也可以直接从菜单进入\
  \ Package（软件包），查看与命令行软件包管理类似的选项。\n\n正如我们看到的，当我们使用这种方法进行软件包管理时，`aptitude` 非常直观。我们也可以使用命令行管理一个或多个软件包。如果我们倾向于输入命令而不是菜单环境，这需要我们向\
  \ `aptitude` 命令传递选项。`aptitude` 命令支持我们会在通过 `apt-get` 命令时传递的大多数选项。让我们从搜索选项开始：\n\n\
