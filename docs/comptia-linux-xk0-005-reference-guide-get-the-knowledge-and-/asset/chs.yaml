  \ `top` 工具。\n\n## 服务 (Services)\n\n`service` 命令最初用于在 systemd 出现之前的早早期 Linux 发行版中运行\
  \ SysV init 脚本。根据你想要实现的目标，启动、停止或重启服务的方法取决于你的发行版使用的是 `systemd` 还是 `init`。`service`\
  \ 命令的优点是大多数 Linux 工程师倾向于使用它，而不是在系统环境中处理进程的新方法。因此，在大多数较新的发行版中都支持 `service` 命令。`service`\
  \ 命令的语法为：\n\n`service <process> <status>`\n\n要查看运行 SysV 脚本的系统中所有服务，我们将使用 CentOS6.5\
  \ 系统：\n\n```\n[philip@localhost Desktop]$ service --status-all\nabrt-ccpp hook is\
  \ installed\nabrtd (pid 2254) is running...\nabrt-dump-oops is stopped\nacpid (pid\
  \ 1964) is running...\natd (pid 2273) is running...\nauditd (pid 1710) is running...\n\
  Usage: /etc/init.d/bluetooth {start|stop}\ncpuspeed is stopped\ncrond (pid 2262)\
  \ is running...\ncupsd (pid 1874) is running...\ndnsmasq (pid 2087) is running...\n\
  firstboot is not scheduled to run\nhald (pid 1975) is running...\nhtcacheclean is\
  \ stopped\nhttpd is stopped\nwinbindd is stopped\nwpa_supplicant (pid 1875) is running...\n\
  [philip@localhost Desktop]$\n```\n\n为了简洁起见，省略了一些输出。`service` 命令读取的脚本以 `rc` 开头。我们可以通过以下方式快速查看所有相关脚本：\n\
  \n```\n[philip@localhost Desktop]$ ls -l /etc | grep rc.\nlrwxrwxrwx. 1 root root\
  \ 11 Jun 20 01:37 init.d -> rc.d/init.d\nlrwxrwxrwx. 1 root root 7 Jun 20 01:40\
