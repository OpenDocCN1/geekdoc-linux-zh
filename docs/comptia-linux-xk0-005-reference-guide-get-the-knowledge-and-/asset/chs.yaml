  \ DNF\n\nDandified YUM 或 `dnf` 是包管理工具的名字。`dnf` 是 Yellowdog Updater, Modified (`YUM`)\
  \ 的下一代。它用于基于 rpm 的发行版。`dnf` 引入 Fedora 18。从版本 22 开始，`dnf` 一一直是 Fedora 的默认包管理器。当我们在新版本的\
  \ Fedora 中运行 `YUM` 命令时，我们是在后台运行 `dnf`。`dnf` 工具提供了性能、内存使用、依赖解析等优势。\n\n要开始使用，我们可以检查\
  \ Fedora 系统上的 `dnf` 版本，我们将使用 `--version` 选项：\n\n```bash\n[root@localhost philip]#\
