    # # In Sum


    This chapter focused its attention of the FWTk firewall toolkit, a collection
    of processes and configuration files that can be used to build your own application
    layer firewall. By working a layer above the SOCKS proxy that was discussed in
    the last chapter, the FWTk toolkit can add some high-level access control mechanisms,
    allowing security administrators to apply different access rules to each of the
    applications that they need to support.


    FWTK includes ready-made proxies for the most popular Linux network applications
    like Telnet, FTP, HTTP, and SMTP, along with a general-purpose proxy that can
    be used to forward arbitrary applications through the firewall. The snap/smapi
    proxy provides a true store-and-forward mail delivery mechanism, where mail can
    be spooled at the firewall and forwarded to the target system asynchronously.


    This chapter closes out the discussion on perimeter security and firewall devices.
    The next and final part of this book focuses on a topic of increasing importance
    in today''s global and roaming workplace: remote access and authentication.'
