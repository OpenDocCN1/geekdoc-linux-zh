- pgno: 53
  md: '# Red Hat


    As the most successful Linux vendor to date, Red Hat has been able to devote considerable
    resources to the tracking, dissemination, and resolution of security flaws in
    the packages that it distributes. However, as of the writing of this book, their
    Web site still lacks a separate security section where Linux administrators can
    see all of Red Hat''s security patches at a glance. That said, they do seem to
    keep up to date on the security issues that come up in their versions.


    Their RPM package management system is the industry standard, and their release
    schedule calls for a major revision every six months or so, which ensures that
    you''re always running recent (and often more secure) software packages. This
    schedule is a good compromise between having up-to-date software and avoiding
    the “bleeding edge” of the latest (and often unstable) versions of most tools.


    Red Hat''s numbering scheme seems to make use of the .0 minor number for an initial
    major release (e.g. 7.0) and .1 and .2 for the subsequent maintenance updates.
    If you opt for Red Hat, I recommend that you try to upgrade up from a .0 release
    as soon as the update is available. You may want to wait until they release the
    7.1 or later version to make sure that any critical bugs have been fixed in the
    previous version.


    # Caldera


    Rivaling Red Hat''s success, Caldera''s OpenLinux has grown into a major player
    in the Linux distribution market. Unlike Red Hat, Caldera maintains two separate
    release lines for clients (eDesktop) and servers (eServer). Both of these packages
    are now in a stable release line, although new versions are usually not available
    as often as Red Hat''s.


    Like Red Hat, Caldera offers a well-laid-out mechanism for updating releases by
    downloading the appropriate packages (also in RPM format) from its FTP site. Caldera
    seems to be increasingly committed to offering a security-minded distribution,
    and most vulnerabilities are addressed by software updates within one or two days
    of being identified.


    Security advisories for OpenLinux can be found at http://www.calderasystems.com/support/security/
    (see Figure 2.1). This is the longest running resource of its kind, and it includes
    a chronological list of advisories for all OpenLinux packages and all the available
    patches or solutions.


    System Security

    PART 1'
