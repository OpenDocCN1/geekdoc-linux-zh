    # ## TCP Wrapper Configuration Examples


    The following commands illustrate some of the access-control configurations for
    TCP Wrappers. This example is a limited setup, where you are denying everything
    except access to the `finger` daemon (wide open) and access to the `telnet` daemon
    (to local hosts, hosts within the `.sybex.com` domain, and hosts in the `192.168.0.0/16`
    block).


    ```

    ```text

    [ramon]$ more /etc/hosts.allow

    in.fingerd:ALL

    in.telnetd:LOCAL, .sybex.com, 192.68.

    [ramon]$ more /etc/hosts.deny

    ALL: ALL

    ```

    ```


    The next example is similar to the previous example; it adopts a deny-all stance,
    but it does allow `ftp` connections from anywhere except the host `badguy.example.com`.


    ```

    ```text

    [ramon]$ more /etc/hosts.allow

    in.ftpd:ALL EXCEPT badguy.example.com

    [ramon]$ more /etc/hosts.deny

    ALL: ALL

    ```

    ```


    The following example is a simple configuration with a “booby trap.” You’re allowing
    all traffic coming from internal hosts to all servers. You’re disallowing any
    external traffic, and a notice of every unsuccessful connection is e-mailed to
    the root account. Note that you’re actually mailing the results of the `safe_finger`
    command, applied against the offending host. This command is supplied with TCP
    Wrappers, and it acts as a bare-bones `finger` client, much leaner (and more secure)
    than the standard Linux `finger` client.


    ```

    ```text

    [ramon]$ more /etc/hosts.allow

    ALL:LOCAL

    [ramon]$ more /etc/hosts.deny

    ALL: ALL (/usr/sbin/safe_finger -l @%h | /bin/mail -s %d-%h root) &

    ```

    ```'
