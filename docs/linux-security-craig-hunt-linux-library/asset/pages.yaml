- pgno: 122
  md: "The following excerpt is an example of a telnet configuration in the `/etc/xinetd.d/`\
    \ directory, included by the main `/etc/xinetd.conf` file:\n\n```\n[ramon]$ sudo\
    \ more /etc/xinetd.d/telnet\nservice telnet\n{\n    socket_type     = stream\n\
    \    wait            = no\n    user            = root\n    server          = /usr/sbin/in.telnetd\n\
    \    redirect        = 10.0.0.2 23\n    bind            = 127.0.0.1\n    log_on_failure\
    \  += USERID\n    disable         = no\n}\n```\n\nThis telnet service defines\
    \ the stream (TCP) socket type, specifies multi-threaded operation (`wait = no`),\
    \ uses the root username as the owner of the service, and logs the user ID when\
    \ there is an unsuccessful login. Note that this file uses the `+=` operator to\
    \ add USERID to the set of values already defined for the `log_on_failure` variable\
    \ (`/etc/xinetd.conf` defined `log_on_failure = HOST`). This file also includes\
    \ a `redirect` statement to forward all telnet connections to host `10.0.0.2`\
    \ (standard telnet port 23), while only listening for connections on the loopback\
    \ interface (127.0.0.1).\n\nConsider a slightly different example:\n\n```\n[ramon]$\
    \ sudo more /etc/xinetd.d/imap\nservice imap\n{\n    socket_type     = stream\n\
    \    wait            = no\n    user            = root\n    server          = /usr/local/sbin/imapd\n\
    \    only_from       = 204.154.22.0/24 localhost\n    disable         = yes\n\
    }\n```"
  merge: -1
  img_proc: true
