- pgno: 358
  md: '# ## 12


    # # Virtual Private Networking


    ust when you think you understand the basics of multi-layered security and your
    Linux network is protected by a good policy and set of mechanisms, along comes
    remote access to make security even more of a challenge. As the 20th century came
    to a close, so did the idea of local area networks (LANs). The traditional office
    expanded to include the home office, and now it has been replaced by the virtual
    office. Your users are no longer happy just dialing in to a pool of modems to
    get their mail; they now expect you to extend the boundaries of your network to
    their laptops, home PCs, and even personal digital assistants (PDAs), using both
    wired and wireless technologies.


    The challenge is to embrace the global remote access model without compromising
    the security of your network. The emphasis should be on a comprehensive security
    policy that covers the cases where the users will not be physically at the corporate
    location, and that includes clear provisions for authentication, authorization,
    and access control.


    Part 5 of this book, “Remote Access and Authentication,” contains two chapters
    that look at this brave new world of roaming users and telecommuters and describes
    a number of packages and configurations that can be deployed to provide convenient
    remote access while ensuring the privacy and integrity of your data. This chapter
    is devoted to the discussion of virtual private networks (VPNs). This technology
    is universally expected to be the fastest growing area of IP networking in the
    next three to five years, due to its clear economic advantage over dedicated private
    network facilities and the ubiquitous nature'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'of the VPN enabling technology. Chapter 13 covers the topic of “Strong User
    Authentication,” a concept that goes hand in hand with both secure remote access
    and virtual private networking.


    Let''s dive right in by explaining the concept of VPNs and introducing the basic
    terminology you need to be aware of.


    # ## A VPN Primer


    Consider a company named ACME Enterprises that has four separate geographical
    locations: Sales in Boston, Engineering in Washington, Human Resources in Denver,
    and Marketing in Los Angeles. In the traditional wide area network (WAN) model,
    ACME''s IT organization would have to lease, maintain, and support six dedicated
    WAN links to have a full mesh network, with the associated distance-sensitive
    telephone company charges in order to ensure full connectivity among all four
    of its branches. (Figure 12.1 illustrates this situation.) Chances are that at
    least two of these locations (Sales and Marketing) are going to need access to
    the Internet, so ACME''s IT department will also have to lease two dedicated circuits
    to the nearest ISP hub.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_359_0.png)


    This setup is less than ideal. The Boston (Sales) and Los Angeles (Marketing)
    branches have two separate leased lines for private data and Internet access.
    And that is only the beginning. The real inefficiency of this approach is in evidence
    whenever ACME decides to branch out to a new location. Let’s say that an ACME
    manufacturing facility is opened in Seattle. The IT department must now purchase
    dedicated lines from Seattle to all four'
  merge: -1
  img_proc: true
- pgno: 360
  md: "existing branches. Furthermore, the more branches that ACME opens up, the more\
    \ pro-  \nhibitive it becomes to connect them to the existing locations via dedicated\
    \ leased lines.  \nVirtual private networking capitalizes on the ubiquity of the\
    \ Internet to offer a cost-  \neffective, distance-insensitive alternative to\
    \ private WAN links. There are two steps to  \nbuilding a VPN:\n\n+   - Connect\
    \ all branches to the Internet by purchasing a connection to an ISP with a  \n\
    +     *local point of presence* (POP), also known as a *hub*.\n+   - Once all\
    \ branches can reach each other via the Internet, build *virtual* links over the\
    \  \n+     existing Internet IP infrastructure to ensure the confidentiality and\
    \ integrity of the  \n+     data as it travels from branch to branch.\n\nFigure\
    \ 12.2 shows the ACME WAN network using a VPN design.\n\n# **Figure 12.2** ACME’s\
    \ VPN connections\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_360_0.png)\n\nThe\
    \ advantages of VPNs over dedicated leased lines are three-fold:\n\n**Distance-Independent\
    \ Connection Costs** The fact that each new corporate branch  \ncan connect to\
    \ the other branches using an Internet connection, regardless of the  \nlocation\
    \ of the rest of the branches, reduces cost. The cost of the local loop is kept\
    \  \nto a minimum and is often bundled into the monthly charges from the ISP.\
    \ In addi-  \ntion, some ISPs offer discounts with quantity connection orders\
    \ and now all of the  \noffices have Internet access also, but this would not\
    \ be a benefit in some cases."
