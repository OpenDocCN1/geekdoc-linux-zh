- pgno: 149
  md: '+   - The `default` line (usually at the end) defines the default action to
    take for IP blocks that don’t fit any specific rule.


    The nessusd server reads a configuration file upon startup. This file is typically
    located at `/etc/nessus/nessusd.conf`. Each line in this file can be a comment
    (starting with the `#` sign) or a definition of the following format:


    ```

    `variable-name = value`

    ```


    I recommend that you use the configuration file defaults to start out with, unless
    you decide to move some of the Nessus files from the place where RPM drops them.
    Listing 5.4 shows the variables in the nessusd.conf file that contain the paths
    of the Nessus files.


    # **Listing 5.4  nessus.conf directory path definitions**


    ```

    "# Path to the security checks folder :

    plugins_folder = /usr/lib/nessus/plugins


    # Log file (or `syslog'') :

    logfile = /var/log/nessus/nessusd.messages


    # Dump file for debugging output, use `-1` for stdout :

    dumpfile = /var/log/nessus/nessusd.dmp


    # Rules File :

    rules = /etc/nessus/nessusd.rules


    # Users Database :

    users = /etc/nessus/nessusd.users"

    ```


    The variables in Listing 5.4 are used as follows:


    +   - The `plugins_folder` variable specifies the folder that contains the plug-ins
    Nessus uses to check for vulnerabilities on the target system.


    +   - The `logfile` variable specifies the file where the Nessus application will
    direct all log events. If the value of `logfile` is `syslog`, all events will
    be logged using the Linux `syslog` facility.


    +   - The `dumpfile` variable specifies the target file of the debugging output.


    +   - The `rules` variable points to the location of the Nessus daemon’s rulesets.


    +   - The `users` variable stores a reference to a file containing the users that
    are allowed to log on to the Nessus application.


    Once you have edited the nessusd.conf file, it’s time to start the nessusd daemon.
    The next section describes the details of this operation.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '**Running the Nessus Daemon** By default, the RPM installation of Nessus creates
    a daemon called /usr/sbin/nessusd. The nessusd daemon listens for client requests
    to scan one or more target hosts.


    > **NOTE** The nessusd daemon *must* be started by the root user.


    The command-line usage for the nessusd daemon is as follows:


    ```

    nessusd [--background] [--config-file=config_file] [--listen=IP_address] [--port=port]

    ```


    Table 5.1 describes the nessusd command-line options, their meanings, and their
    default values.


    # **Table 5.1** Nessus Daemon Command-Line Options


    | Option | Meaning | Default |

    | :--- | :--- | :--- |

    | --background | Run as a daemon (start and send to background). | N/A |

    | --config-file=config_file | Use an alternate configuration file. | /etc/nessus/nessusd.conf
    |

    | --listen=IP_address | Address from which to accept requests. This overrides
    any rules that a given user may have associated with them. | N/A |

    | --port=port | Listen on an alternate port. | 3001 |


    In general, you start the nessusd daemon by simply issuing the following command;
    the -D option in this command instructs the daemon to run in the background, giving
    you back control of the terminal session:


    ```

    [ramon]$ sudo /usr/sbin/nessusd -D

    ```'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'At this point, you''re ready to fire up the Nessus client and start scanning
    some of your Linux servers to look for security vulnerabilities. The next section
    guides you through that process.


    # **Configuring and Running the Nessus Client**  Since you''re a Linux administrator,
    you''ll probably feel comfortable running the Linux client, which is the most
    robust of the clients by far. To invoke it for the first time, simply type the
    following command:


    ```

    [ramon]$ /usr/bin/nessus

    ```


    At this point, a dialog box appears asking you to create a new passphrase (see
    Figure 5.1). This is the secret that protects your private key. Once your private
    key is unlocked, the client and the server use public-key authentication to come
    up with a symmetric key to protect all subsequent communication. If this is not
    the first time you invoke Nessus from your account, the client simply asks you
    to provide the passphrase that you specified the first time (Figure 5.2).


    ![](img/3258bbaf790525f8c4eb25fabff7844a_151_0.png)


    ![](img/3258bbaf790525f8c4eb25fabff7844a_151_1.png)


    ![](img/3258bbaf790525f8c4eb25fabff7844a_151_2.png)


    ![](img/3258bbaf790525f8c4eb25fabff7844a_151_3.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'If the passphrase is correct, the client displays the main menu, which is open
    to the Nessusd Host tab by default. This is where you point the client to the
    appropriate server. In the example in Figure 5.3, the server is `nessus.example.com`
    and the username being used to log on is `ramon`.


    # **Figure 5.3** Logging on to the Nessus server


    ![](img/3258bbaf790525f8c4eb25fabff7844a_152_0.png)


    The next tab in the main Nessus client window is the Plugins tab, shown in Figure
    5.4. On this screen, you can choose among all the plug-ins that are currently
    present in the plug-ins folder (`/usr/lib/nessus/plugins`, by default). I recommend
    that you click the Enable All But Dangerous Plugins button. This disables the
    Denial of Service plug-in at the bottom of the list. If you opt to run this attack
    as well, make sure you do it during a maintenance window of the target server,
    since it will be rendered useless at least momentarily.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Figure 5.4 Selecting Nessus plug-ins


    ![](img/3258bbaf790525f8c4eb25fabff7844a_153_0.png)


    The next tab of interest is the Target Selection tab. On this screen you can specify
    the servers to be scanned for vulnerabilities. You can use comma-separated notation,
    including host names, IP addresses, or networks with a /subnet notation (e.g.,
    192.168.1.0/24). Figure 5.5 shows a scan of two target hosts, 204.254.33.75 and
    204.254.33.76.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# **Figure 5.5** Specifying target hosts to be scanned


    ![](img/3258bbaf790525f8c4eb25fabff7844a_154_0.png)


    To start the testing, simply click the Start the Scan button. The status screen
    appears, as illustrated in Figure 5.6. The scan continues for as long as it takes
    the Nessus server to complete all the tests specified on the Plugins tab screen.
    The total duration of the scan will vary widely, depending on the number of hosts
    to be scanned and the complexity of the tests.'
  merge: -1
