- pgno: 255
  md: "to hold the authentication, access control, and policy for the entire domain.\
    \ The NT host designated to be the main authenticator is called the *primary domain\
    \ controller* (PDC), while its subordinates are called *backup domain controllers*\
    \ (BDCs).\n\nSamba cannot only act as a client to an existing NT PDC; it can actually\
    \ be configured to act as the PDC and handle authorization and access control\
    \ requests from Windows NT hosts and other Samba servers in the network. While\
    \ the current version as of the writing of this book (2.0.7) offers experimental\
    \ PDC support, version 2.1 (which may be out by the time you read this book) is\
    \ scheduled to incorporate this as a standard feature.\n\n> **NOTE**\n> Samba\
    \ 2.0.7 does not support Windows 2000 logins. Only Windows NT 3.51 SP5+ and 4.0\
    \ SP4+ machines can authenticate to Samba’s PDC.\n\nSamba PDC support includes\
    \ adding new Windows NT client machines to the domain and providing domain authentication\
    \ for users on those machines. These accounts can be viewed on the Windows NT\
    \ host using the Server Manager and User Manager utilities, respectively. Samba\
    \ allows for remote updates of both machine and user passwords. Absent from the\
    \ list of supported features is the ability to establish a trust relationship\
    \ between the Samba PDC and another domain controller, as well as the ability\
    \ to act as a BDC.\n\nThe next section explains in detail how to configure a standard\
    \ Samba installation to act as a PDC.\n\n# Setting Up the Samba PDC\n\nFirst,\
    \ make sure to modify the `[global]` stanza of your `smb.conf` file so that you\
    \ are using password encryption. You also want to enable domain logons using the\
    \ Samba PDC. These two capabilities are enabled in the following example:\n\n\
    ```\n```\n[global]\n    encrypt passwords = yes\n    workgroup = ACCOUNTING\n\
    \    domain logons = yes\n```\n```\n\nNext, create machine accounts on the Samba\
    \ server so that it knows how to interact with the Windows NT client hosts. Create\
    \ an `/etc/passwd` entry using the NetBIOS name of the NT client, with a $ at\
    \ the end. For example, the following entry is a machine account for an NT client\
    \ named `acct_server1`:\n\n```\n```text\nacct_server1$:*:305:100:Accounting NT\
    \ Server 1:/dev/null:~/bin/false\n```\n```"
