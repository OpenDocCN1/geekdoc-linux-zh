- pgno: 106
  md: 'Whenever you want to check the integrity of the current state of the files,
    simply issue the command


    ```

    `[ramon]$ /usr/TSS/bin/tripwire --check`

    ```


    which results in a report being written to stdout and saved to the file location
    specified in the REPORTFILE environment variable (see Listing 3.6).


    If you would like the report to be e-mailed to you instead, use the following
    variant of the previous command:


    ```

    `[ramon]$ /usr/TSS/bin/tripwire --check --email-report`

    ```


    Once you have reviewed the report, you can confirm that any integrity differences
    have been acknowledged by writing the new integrity results to the database. Do
    this by using the following command:


    ```

    `[ramon]$ /usr/TSS/bin/tripwire --update`

    ```


    Finally, as you make changes to the policy file, you need to force tripwire to
    reload its policy definitions using the following command:


    ```

    `[ramon]$ /usr/TSS/bin/tripwire --update-policy`

    ```


    > **TIP** I recommend that you run tripwire at least twice a day and examine the
    integrity reports carefully before updating the signature database. Ideally, you
    should simply add the tripwire --check --email-report command to a cron job. This
    command should be executed first thing in the morning and shortly before the system
    administration staff goes home for the day.


    # Password Auditing


    Keeping track of logs and ensuring the integrity of your files can significantly
    strengthen your server, but it''s easy to fall prey to the "crunchy on the outside,
    chewy on the inside" syndrome. The weakest link in most of today''s Linux servers
    is the users and more specifically, their choice of passwords. While your security
    policy should always include a section outlining the properties of good passwords,
    you should also take a proactive approach to password security and conduct periodic
    audits of all your users'' passwords.


    As with any other Unix system, the Linux passwords are stored as the result of
    a one-way DES encryption operation on the original cleartext password. (Some Linux
    systems also support MD5 hashing for password protection.) This means that the
    actual password is never stored in the clear. Whenever a user attempts to log
    on to the system, the login'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'program encrypts the password entered and compares the result to the one found
    in /etc/passwd (or /etc/shadow). Only if the two passwords match is the user allowed
    access to the system.


    There are several password-auditing tools available for Linux. These tools take
    as input the encrypted password file, and they attempt to guess each user’s password
    by staging a *dictionary attack*, where a collection of commonly used words is
    DES-encrypted one by one and the results are compared to the /etc/passwd entries.
    If a match is found, the username is recorded and included in the output report
    for the security administrator.


    This section describes one of these tools, John the Ripper, developed as part
    of the Openwall project ([www.openwall.com](www.openwall.com)).


    # John the Ripper


    An alternative to the original crack program, John the Ripper is a robust password-guessing
    tool that uses its own routines to attempt to crack passwords, rather than using
    the Linux crypt(3) system call. This results in a noticeable performance advantage
    over the earlier version of the crack tool. Another advantage is that John the
    Ripper runs on a variety of platforms (most Unix, DOS, and Windows systems), so
    you can use other machines in your network to try and crack your Linux servers’
    passwords.


    By using John the Ripper to try to guess your own users’ passwords, you can alert
    them that they have chosen too short or too weak a password and exhort them to
    change it before an attacker with the same tool guesses it and breaks into their
    account.


    # Installing john


    The john installation is trivial. Download it from [www.openwall.com/john](www.openwall.com/john)
    (it’s not available in RPM form), decompress it, and expand the archive (see the
    *steps* in Listing 3.7). Once you have expanded the sources into their own directory,
    go to the src directory and run the make command. Note that you have several options
    for the target executables (type make with no arguments to see the options). Listing
    3.7 shows a build for an ELF format executable on the i386 architecture.


    # Listing 3.7 Installing and compiling *john*


