  md: 'The `/usr/local/etc/netperm-table` configuration arguments for the HTTP proxy
    are similar to their telnet equivalents:


    ```

    http-gw: attribute-group

    ```


    In this format, the attribute-group can be the same constructs used for tn-gw,
    with the following differences:


    +   - `default-policy option [options]`  This format specifies which filter rule
    to apply to active content. The options value can be one of the following:

    +     - `-java, -nojava`  These options determine whether to allow Java content
    to traverse the proxy firewall (-java) or whether to block it (-nojava).

    +     - `-javascript, -nojavascript`  Use these settings to allow JavaScript content
    to traverse the proxy firewall (-javascript) or whether to block it (-nojavascript).

    +     - `-activex, -noactivex`  These settings control whether you should allow
    ActiveX controls (-activex) or block them (-noactivex).


    # **plug-gw:** The General-Purpose TCP Proxy


    The plug proxy, or plug-gw, is a general-purpose transport layer proxy mechanism
    that is used to tunnel applications that don''t enjoy native support by an FWTK
    proxy. The plug works by accepting traffic from a specified TCP port on the private
    side and forwarding the request to a specified destination IP address and TCP
    port on the public side according to a set of access control rules. This is useful
    for situations where you don''t need the fine control and logging provided by
    a real application layer proxy, but you want to keep your internal and external
    networks totally separate nonetheless (perhaps because your internal network does
    not use legal IP addresses).


    As with any other FWTK proxies, plug-gw looks in the /usr/local/etc/netperm-table
    for its configuration. In addition to the standard constructs outlined for tn-gw,
    the plug-gw proxy supports the following construct:


    ```

    port port-id host-description [-plug-to-host host-name]  This construct specifies
    the rule used to forward the connection. When the request comes in over port-id,
    the host-description is matched against the requesting IP address. If there is
    a match, the connection is forwarded to the host name specified in the -plug-to-host
    option.

    ```


    For example, consider a case where you want your internal hosts to connect to
    your ISP''s NNTP server to retrieve news. Your network uses private addresses,
    and you want to control NNTP access so that your ISP''s news server only receives
    connections from a single public address (the public address of your proxy firewall).
    You can simply instruct your users to point their newsreaders to port TCP 119
    (standard NNTP port of your'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'firewall, which then forwards the requests to port 119 of your ISP''s NNTP
    server. The following `/usr/local/etc/netperm-table` entry accomplishes this:


    ```

    plug-gw: port 119 10.0.0.* -plug-to nntp-server.example.com

    ```


    This entry redirects all requests from network 10.0.0.0/24 to 119 of the firewall
    to the same port of server `nntp-server.example.com`.


    **NOTE**  This is especially useful for dealing with ISPs that limit their customers''
    NTP connections to only a small number of IP addresses. You will, in fact, always
    be connecting from the same address, the external address of the FWTK firewall.


    # **smap:** SMTP Mail Proxy


    The FWTK includes an SMTP application proxy called **smap** that accepts incoming
    mail connections using the **smap** executable. Mail messages are cached on the
    firewall system until they are picked up by the periodically running **smapd**
    executable. **smap** then hands off the incoming messages to the local mail transport
    agent (MTA), typically Sendmail.


    This store-and-forward processing prevents would-be attackers from gaining real-time
    access to the local MTA, thereby reducing the risk of popular exploits like a
    buffer overflow on the Sendmail daemon. The **smap** application "wakes up" every
    60 seconds (by default), and only forwards the spooled messages to the local MTA
    after performing an exhaustive inspection of the mail headers, failing to forward
    any message that is malformed or otherwise suspicious.


    You will need to configure `inetd` (or `xinetd`) on your server to ensure that
    an **smap** session is started when a connection request is received on port 25
    (SMTP) of the external interface of the proxy server. To accomplish this, simply
    substitute **smap** for `tn-gw` in Listing 11.6 or 11.7.


    Next, make sure that you have configured the `/usr/local/etc/netperm-table` file
    with the appropriate **smap**/**smapd** configuration. The general entry for the
    **smap** proxy lines in the configuration file is of the type


    ```

    smap: attribute-group

    ```


    In addition to the standard attributes outlined for `tn-gw`, the **attribute-group**
    field can take the following construct:


    ```

    directory directory  This construct specifies the **directory** where **smap**
    should store incoming messages before **smapd** processes them.

    ```


    You can also configure the operation of the **smapd** daemon by using lines of
    the type


    ```

    smapd: attribute-group

    ```'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'There are five constructs that are specific to the smapd configuration:


    +   - directory directory This construct specifies the directory where smapd should
    look for incoming messages spoofed by smap.

    +   - sendmail program This construct instructs smapd to use the mail transport
    agent in program (e.g., Sendmail) to deliver mail to its destination.

    +   - badadmin user This construct specifies the user to which the smapd server
    should forward mail that it cannot deliver.

    +   - baddir directory This construct specifies the directory to which the smapd
    server saves any spoofed mail that it cannot deliver normally.

    +   - wakeup seconds This construct instructs the smapd daemon to wake up and
    process the waiting mail queue at the interval specified by seconds. By default,
    smapd wakes up every 60 seconds.


    # ## Using Strong Authentication with FWTk


    When configuring one of the FWTk proxies, the administrator has the option to
    force the user to authenticate to the proxy server itself before requesting a
    remote connection. For example, the netperm-table line


    ```

    ```

    tn-gw: permit-hosts 204.205.206.* -dest safehost.example.com -auth

    ```

    ```


    states that users on any host in the 204.205.206.0/24 network are allowed to connect
    to the telnet gateway and connect to host name safehost.example.com, but only
    if the users can authenticate themselves to the proxy first using a valid set
    of credentials (-auth option).


    The authsrv subsystem is responsible for handling this type of authentication
    within FWTk.


    # ### authsrv


    The authsrv daemon is an authentication facility for the use of any of the FWTk
    proxies. It maintains a database with a record for each known proxy user. The
    record consists of the following fields:


    +   - Username The username field is the unique user description that characterizes
    each proxy user.

    +   - User Group The user group field is the primary group to which the user belongs.

    +   - Full Name The full name field represents the name of the user in first,
    middle initial, last format (e.g., Ramon J. Honton).'
  merge: -1
  img_proc: true
- pgno: 352
  md: "**Last Successful Proxy Login** The last successful proxy login field contains\
    \ a reference to the last date when the user was able to log on to the proxy successfully.\n\
    \n**Authentication Mechanism to be Used for That User** The following authentication\
    \ mechanisms are supported:\n\n+   * RSA SecurID challenge/response and timed\
    \ token authentication\n+   * Digital Pathways' Secure Net Key (SNK), a challenge\
    \ response system\n+   * BellCore's S/Key one-time password system\n+   * Reusable\
    \ passwords\n\n`authsrv` can be instructed to use one of these mechanisms for\
    \ authenticating a particular user by specifying the proper value for the `proto`\
    \ option in the `authsrv` utility command (see the `proto` command syntax in Table\
    \ 11.1).\n\nRegardless of the authentication mechanism defined for each user,\
    \ the `authsrv` daemon can handle the creation, modification, disablement, or\
    \ deletion of user entries through the use of the `authsrv` administrative utility,\
    \ described later in this section.\n\nLet's start the configuration of the `authsrv`\
    \ daemon by entering the appropriate configuration in the `/etc/xinetd.d/authsrv`\
    \ file (see Listing 11.14).\n\n# **Listing 11.14** *xinetd Configuration for authsrv*\n\
    \n```\nservice authsrv\n{\n    flags             = REUSE\n    socket_type    \
    \   = stream\n    wait              = no\n    user              = root\n    server\
    \            = /usr/local/etc/authsrv\n    log_on_failure    += USERID\n    disable\
    \           = no\n}\n```\n\nIf your system uses `inetd`, add the line in Listing\
    \ 11.15 to the `/etc/inetd.conf` file.\n\n# **Listing 11.15** *inetd configuration\
    \ for authsrv*\n\n```\nauthsrv stream tcp nowait root /usr/local/etc/authsrv authsrv\n\
    ```\n\nNote that in order for your server to recognize the `authsrv` keyword as\
    \ a service, you have to create the following `authsrv` entry in `/etc/services`:\n\
    \n```\nauthsrv     7777/tcp\n```"
