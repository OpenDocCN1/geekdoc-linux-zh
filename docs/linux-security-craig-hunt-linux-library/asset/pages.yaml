    ```


    Keep in mind that, when invoked with the `-d` option, `inetd` displays its diagnostics
    to the stderr process (the controlling tty by default), making this option useful
    only when you’re trying to troubleshoot a problem. Listing 4.1 shows a debug session
    during which three requests are received (telnet, ftp, and pop-3).


    The next section discusses /etc/inetd.conf, the configuration file used by the
    `inetd` daemon.


    # Configuring `inetd` with `/etc/inetd.conf`


    As with any Linux facility, the `inetd` daemon consults a plain-text configuration
    file upon startup. The /etc/inetd.conf contains one line for each of the services
    that `inetd` is to listen for. Each line contains seven positional fields, separated
    by a tab character or'
