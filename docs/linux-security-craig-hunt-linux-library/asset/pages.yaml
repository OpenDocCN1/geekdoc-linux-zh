- pgno: 374
  md: "# ## Editing the `ipsec.conf` File\n\nThe `/etc/ipsec.conf` file is the main\
    \ FreeS/WAN configuration file; all control and configuration information for\
    \ all your IPsec peer connections is defined in this file. The `ipsec.conf` file\
    \ has three separate sections:\n\n+   * The basic configuration section, where\
    \ you define the settings that apply to your FreeS/WAN installation as a whole.\
    \ This section starts with the keyword `config setup` in a line by itself.\n+\
    \   * The connection-defaults configuration section, where you can include parameters\
    \ to be applied to all your IPsec connections (tunnels). This section is marked\
    \ by the line `conn %default`.\n+   * The connection-specific configuration section,\
    \ where you can specify parameters to be applied only to the specified tunnel.\
    \ Note that there is a connection-specific configuration section for every tunnel\
    \ you want to define. You start a connection-specific configuration section by\
    \ using the string `conn ipsec-tunnel`, where `ipsec-tunnel` refers to a pair\
    \ of IPsec peers. The examples in this section make references to `denver-boston`.\
    \ This is the name for the tunnel between the local host (DENVER) and the remote\
    \ peer (BOSTON). You can use any string to refer to tunnels, but it helps to make\
    \ them meaningful.\n\nThe first part of the `ipsec.conf` file defines the general\
    \ configuration parameters that apply to the FreeS/WAN application. Listing 12.1\
    \ contains the first part of an `ipsec.conf` file using the configuration for\
    \ the DENVER security gateway as an example.\n\n# **Listing 12.1**  Defining the\
    \ basic configuration parameters in the `/etc/ipsec.conf` file\n\n```\n# basic\
    \ configuration\nconfig setup\n\n    # virtual and physical interfaces for IPSEC,\
    \ normally a single\n    # `virtual-physical' pair, or a (quoted!)  list of pairs.\
    \  In the\n    # simple case, where you only want to run IPSEC on one interface,\n\
    \    # the virtual (ipsec0) shouldn't need changing but the physical\n    # (eth999)\
    \ will (to the interface connecting to the public network,\n    # network, e.g.\
    \ eth0 or ppp0 or something like that).\n    # `This must be correct' or almost\
    \ nothing will work.\n    interfaces=\\\"ipsec0=eth0\\\"\n\n    # KLIPS debugging\
    \ output.  'none' for none, 'all' for lots\n    klipsdebug=none\n\n    # Pluto\
    \ debugging output.  'none' for none, 'all' for lots\n    plutodebug=none\n\n\
    \    # connections to load into Pluto's internal database at startup\n    plutoload=denver-boston\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 375
  md: '```

    # connections for Pluto to try to negotiate at startup

    plutostart=dener-boston

    # Close down old connection when new one using same ID shows up.

    uniqueids=yes

    ```


    The klipsdebug and plutodebug options instruct FreeSWAN to log debug information.
    Set them to none unless you suspect that something is not working. By default,
    FreeSWAN sends debug output to syslog via the daemon.error facility, and it sends
    lots of it. The plutoload and plutostart commands ask that the dener-boston connection
    be loaded and negotiated when the system comes up. The plutoload and plutostart
    settings prevent the system from incurring IKE overhead when the first connection
    is bound for the BOSTON system. Finally, the uniqueids variable is set to yes
    to make sure that you don’t have two connections to the same remote subnet open
    at the same time.


    The second section in ipsec.conf file (see Listing 12.2) defines a set of defaults
    that apply to each subsequent connection that is defined in the rest of the file.


    # Listing 12.2 Defining the defaults for connections in the/etc/ipsec.conf file


    ```

    # defaults for subsequent connection descriptions

    conn %default

    # How persistent to be in (re)keying negotiations (0 means very).

    keyingtries=0

    # How to authenticate gateways

    authby=secrets

    ```


    As the comments suggest, the keyingtries parameter defines the number of times
    that the local end will try to re-establish a connection with the remote end.
    There is no reason why this shouldn’t be set to 0 (a special value that signals
    “retry constantly”) unless you’re doing the initial configuration of your system
    and you’re not sure that you’ve set things up correctly. Setting it to 1 (which
    means “attempt to reestablish the connection one time and give up if unsuccessful”)
    would be a good idea in that case.


    The authby parameter defines the method used to authenticate the remote IKE peer.
    The supported values are:


    +   * rsaig: Use RSA digital signatures

    +   * secret: Use pre-shared secrets


    RSA keys is the preferred method of authentication for Pluto IKE, especially after
    the RSA patent on their public key technology expired in September of 2000.


    Finally, let’s look at the section of ipsec.conf that actually defines an IPsec
    connection. As you read the configuration of the tunnel itself, note that the
    left and right'
