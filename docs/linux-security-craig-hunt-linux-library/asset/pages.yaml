    # Configuring the SOCKS5 Server


    Once you have successfully installed the distribution, it’s time to start configuring
    the server. The default master configuration file for the SOCKS5 server is /etc/socks5.conf.
    The user is responsible for creating this text file from scratch, although a number
    of sample files are provided under the examples directory of the distribution.
    The socks5.conf file is consulted by the SOCKS5 daemon every time it is started,
    or during execution whenever it receives a SIGHUP signal.


    Start by taking a close look at the man page for this file:


    ```

    ```

    [ramon]$ man socks5.conf

    ```

    ```


    The /etc/socks5.conf file contains the directives described in the following sections.


    # The ban Directive


    The SOCKS5 server can be instructed to ignore connection requests from a certain
    client address, and furthermore, from a specific source port from that address
    using the ban directive.


    **Syntax** ban *source-host source-port*


    The arguments to the ban directive are as follows:


    +   - source-host is the IP address or host name from which connections should
    be disallowed.


    +   - source-port is the port number from which connections should be disallowed.'
