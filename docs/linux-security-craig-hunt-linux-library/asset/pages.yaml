  md: "Consider the sample (partial) policy of the tripwire policy file (twpol.txt)\
    \ in the examples in this section. This example contains the global variables\
    \ that determine the location of the tripwire root directory (TWROOT), binary\
    \ directory (TWBIN), policy (TWPOL), database (TWDB), key files (TWKEY, TWLKEY),\
    \ and report (TWREPORT).\n\n```\n```\n@section GLOBAL\n  TWROOT=\"/usr/TSS\";\n\
    \  TWBIN=\"/usr/TSS/bin\";\n  TWPOL=\"/usr/TSS/policy\";\n  TWDB=\"/usr/TSS/db\"\
    ;\n  TWKEY=\"/usr/TSS/key\";\n  TWLKEY=\"/usr/TSS/key\";\n  TWREPORT=\"/usr/TSS/report\"\
    ;\n  HOSTNAME=redhat.example.com;\n```\n```\n\nThe next example shows the file\
    \ security level section of the tripwire policy file. This example defines a number\
    \ of macros to be used later in the policy. It uses several built-in property\
    \ masks that tell the policy which events to examine or ignore (IgnoreNone, ReadOnly,\
    \ Dynamic, Growing), as well as some user-defined property masks (\\#ug, 33, 66,\
    \ 100). These masks direct tripwire to look for certain types of changes in a\
    \ given file or directory. (See Table 3.4 for a complete list of the characters\
    \ used in tripwire’s property masks.)\n\n```\n```\n@section FS\nSEC_CRIT = $(IgnoreNone)-Sha;\
    \ # Critical files - we can't\n# afford to miss any changes.\nSEC_SUID = $(IgnoreNone)-Sha;\
    \ # Binaries with the SUID or SGID\n# flags set.\nSEC_TCB = $(ReadOnly); # Members\
    \ of the Trusted\n# Computing Base.\nSEC_BIN = $(ReadOnly); # Binaries that shouldn't\n\
    # change.\nSEC_CONFIG = $(Dynamic); # Config files that are changed\n# infrequently\
    \ but accessed\n# often.\nSEC_LOG = $(Growing); # Files that grow, but that\n\
    ```\n```"
