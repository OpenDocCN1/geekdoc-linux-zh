    # # The pam_rootok Module



    The `pam_rootok` module allows the root user to gain access to a service without
    having to enter a password. The `pam_rootok` module authenticates the user if
    their user ID is set to 0 (the standard Linux user ID for root).


    The `pam_rootok` module takes one command-line argument, `debug`, that makes the
    module write diagnostic information to `syslog`. The entries in the `/etc/pam.d/su`
    file have the following format:


    ```

    auth          control_flag    module_path [debug]


    ```


    The following lines in `/etc/pam.d/su` allow the root user to `su` to a regular
    user without having to issue a password while writing diagnostic information to
    the `syslog` utility via the `debug` argument:


    ```

    auth          sufficient    pam_rootok.so  debug

    auth          required      pam_unix.so


    ```


    # # The pam_securitty Module



    The `pam_securitty` module checks to make sure that the root user is logging in
    from a secure terminal. If root is not logging in from a secure terminal, authentication
    for root fails unless `PAM_TTY` (the environment variable containing the terminal
    descriptor for the request) is set to a string listed in the `/etc/securitty`
    file. For all other users, it succeeds.'
