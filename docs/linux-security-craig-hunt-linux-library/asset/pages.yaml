  md: '# Populating the KDC Database


    Once the Kerberos server is up and running, you can start adding the principals
    that you wish to authenticate. You populate the Kerberos database using the `kadmin`
    utility. This is very similar to the `kadmin.local` utility. In fact, the only
    difference is that while the `kadmin.local` utility must be executed at the KDC,
    `kadmin` can be executed remotely and uses Kerberos authentication to grant remote
    access to the KDC database.


    You can add a new principal using the command:


    ```

    ```

    kadmin: addprinc principal

    ```

    ```


    For example, to add username ramon and create an initial password, do the following:


    ```

    ```

    [ramon]$ /usr/kerberos/sbin/kadmin

    Authenticating as principal ramon/admin@HONTANON.COM with password.

    Enter password:

    kadmin: addprinc alice

    Enter password for principal "alice@HONTANON.COM":

    Re-enter password for principal "alice@HONTANON.COM":

    Principal "alice@HONTANON.COM" created.

    ```

    ```


    Note that in order to use the `kadmin` command, you have to authenticate yourself
    as the principal `ramon/admin@HONTANON.COM`, who has been given administrative
    privileges to modify the Kerberos database.


    Once a principal has been created for a given user, they can change their Kerberos
    password themselves by issuing the `kpasswd` command:


    ```

    ```

    [alice]$ kpasswd

    Password for alice@HONTANON.COM:

    Enter new password:

    Enter it again:

    Password changed.

    ```

    ```


    # Configuring Kerberos-Enabled Servers


    Once you have successfully configured a KDC and have populated its database with
    the information from the principals that you want to authenticate, it’s time to
    enable your servers to use Kerberos authentication when a user requests access
    to a specific service.


    The first step is making the KDC database aware of the servers and services that
    you wish to authenticate. You have to create a principal for each service/server
    combination.'
  merge: -1
  img_proc: true
