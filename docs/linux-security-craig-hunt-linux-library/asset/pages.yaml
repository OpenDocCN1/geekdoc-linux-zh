    ```


    As you can see, TARA offers a wealth of diagnostic information on your system’s
    configuration, and it allows a Linux system administrator to mitigate some of
    the well-known network attacks before they happen. However, network auditing is
    a sometimes tedious and always time-consuming activity. Not even the most diligent
    system administrator can rely on the systems being secure by simply auditing them
    regularly.


    The next section in this book explores the concept of network monitoring, which,
    along with auditing, constitutes the basis of your ongoing defense against intrusion.


    # Network Monitoring


    The previous section presented some very effective tools and techniques for scanning,
    strobing, and poking at random systems, looking for half-open doors and misconfigured
    systems that might invite break-ins. While the aim of these tools is to enhance
    the security of your system, it is naïve to assume that they are not going to
    be used for nefarious actions by a would-be intruder.


    The challenge is on you as a security administrator to


    +   * Look for signs that you are being scanned by tools like Nessus and Nmap.

    +   * Hope that the versions of these tools that the intruder is using are at
    least as old as the one you used during the last audit.'
