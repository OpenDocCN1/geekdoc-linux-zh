    Once you have installed and configured Apache in a security-responsible manner,
    monitor the application logs for suspicious activity. The next section of this
    book describes Apache''s logging facility and the contents of its log files.


    # # Application Logs


    Apache''s standard logging facility offers a comprehensive array of diagnostics
    and allows system and security administrators to audit both routine events (such
    as successful HTTP requests), as well as suspicious and potentially malicious
    events. There are two log files that you check periodically:


    +   *   **access_log** The access_log file contains a line for each successful
    request made to the HTTP server. Its general format is as follows:


    ```

    *   _remote_host remote_user time_stamp request_type request_status_

    ```


    For example, the following two entries show a remote user whose client IP address
    is 209.1.78.12 attempting to access two files that are not available to the Apache
    server (/etc/shadow and /etc/passwd):


    ```

    209.1.78.12- - [04/Dec/2000:21:03:45 -0500] "GET /etc/passwd HTTP/1.1" 404 139

    209.1.78.12- - [04/Dec/2000:21:03:47 -0500] "GET /etc/shadow HTTP/1.1" 404 139

    ```


    Note that a request_status of 404 139 refers to a “File not found” condition.
    A periodic search for this status code could yield important clues on would-be
    intruders looking around for unsecured content.


    +   *   **error_log** The error_log file records Apache server administration
    events, including server starts, stops, and failed attempts at executing privileged
    CGI scripts. It also reports execution errors specific to the scripts themselves.
    Its general format is as follows:


    ```

    *   _time_stamp error_type error_type client_id error_description_

    ```


    For example, consider the following set of error_log entries. This example shows
    an ungraceful shutdown of the Apache application, followed by an immediate'
