  md: '*control-flag* Since modules are often stacked and executed in sequence, the
    *control-flag* field determines what effect the success or failure of a single
    module should have on the overall authentication result returned to the application.
    This field can be one of the following:


    +   - *required*: Failure in this module results in overall authentication failure.
    Execution continues to the remaining modules.

    +   - *requisite*: This value means the same as *required*, but the execution
    of the module sequence halts if the result is a failure.

    +   - *sufficient*: Success in this module is enough to result in an overall authentication
    success. If no other *required* modules are in the sequence, execution stops.

    +   - *optional*: Success of this module is not necessary for overall success.


    *module-path* This specifies the path name of the dynamically loadable object
    file itself, for example, `/lib/security/pam_access.so`.


    *arguments* This field is a list of command-line arguments passed to the loadable
    module when it is invoked by PAM. This is an optional field, since many loadable
    modules do not take any command-line arguments. The following arguments are common
    to all modules:


    +   - *debug*: The *debug* argument sends debug information to syslog.

    +   - *no_warrn*: The *no_warrn* argument forces the module to suppress warning
    messages to the application.

    +   - *use_first_pass*: The *use_first_pass* argument instructs the module not
    to prompt the user for a password. Instead, the module should use the previously
    typed password (from the preceding module). If that does not work, the user is
    not authenticated.

    +   - *try_first_pass*: The *try_first_pass* argument is similar to the *use_first_pass*
    argument, but the user is prompted for a password if the previous one fails.


