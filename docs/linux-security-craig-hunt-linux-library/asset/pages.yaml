- pgno: 387
  md: 'Table 12.1 lists the most frequently used variables in the `sshd_config` file.


    # **Table 12.1** `/etc/ssh/sshd_config` Variables


    | Option | Meaning | Default |

    | :--- | :--- | :--- |

    | `AllowTcpForwarding` | Specifies whether TCP forwarding is permitted. | Yes
    |

    | `AllowUsers user1 user2...` | Specifies users to allow SSH access (exclusively).
    | All users allowed |

    | `DenyUsers user1 user2...` | Specifies users to ban from SSH access (exclusively).
    | No users banned |

    | `Ciphers cipher1, cipher2...` | Specifies encryption cipher to be used (SSH
    v.2). | 3des-cbc, blowfish-cbc, arcfour, cast128-cbc |

    | `DSAAuthentication` | Specifies whether DSA authentication is allowed (SSH v.2).
    | Allowed |

    | `IgnoreRhosts` | Specifies whether .rhosts and .shosts should be ignored. |
    Yes |

    | `KerberosAuthentication` | Specifies whether Kerberos authentication is allowed.
    | Yes |

    | `PasswordAuthentication` | Specifies whether password authentication is allowed.
    | Yes |

    | `PermitEmptyPasswords` | Specifies whether empty passwords should be allowed.
    | No |

    | `PermitRootLogin` | Specifies whether root log-ins over SSH should be allowed.
    | Yes |'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# **Table 12.1** `/etc/ssh/sshd_config` Variables (*continued*)


    | Option | Meaning | Default |

    | :--- | :--- | :--- |

    | `Protocol 1 [,2]` | Specifies whether the SSH daemon should support v.1 and/or
    v.2 of the SSH protoc ol. | v.1 only |

    | `RhostsAuthentication` | Specifies whether `.rhosts` authentication should be
    sufficient to authenticate clients. | No |

    | `RSAAuthentication` | Specifies whether RSA au- thentica tion is allowed. |
    Yes |

    | `SkeyAuthentication` | Specifies whether S/Key authen tica- tion is allowed.
    | Yes |

    | `StrictModes` | Specifies whether SSH should check file modes and ownership
    of the user’s files and home di- rectory before accepting login. | Yes |


    Choose the settings that best fit your environment and *always* include the following
    settings:


    +   * `IgnoreRhosts` yes

    +   * `RhostsAuthentication` no

    +   * `StrictModes` yes


    The first two settings ensure that *rhosts* authentication is never used exclusively.
    This is the kind of authentication that relies on appropriate entries being present
    in the `$HOME/.rhosts` file or the `/etc/hosts.equiv` file of the server. This
    is very insecure. You should also enable `StrictModes` in order to guard against
    users’ leaving their home directories world writeable, which presents a clear
    security vulnerability.'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'The following is an example of a complete sshd_config file that I often use
    on my Linux servers:


    ```

    [ramon]$ more /etc/sshd_config

    # This is ssh server systemwide configuration file.


    IgnoreRhosts yes


    RhostsAuthentication no


    StrictModes yes


    AllowTcpForwarding no


    Protocoi 2


    PermitRootLogin no


    RSAAuthentication yes


    PasswordAuthentication no

    ```


    Note that the first three lines were discussed previously. In addition, I have
    denied TCP connection forwarding because it makes it hard to track where users
    are tunneling connections within SSH, which could lead to a security vulnerability.
    I''ve also restricted the protocol versions used to v.2, even if my sshd daemon
    is compiled to also accept v.1; this is due to the fact that several vulnerabilities
    have been found in v.1. I then go on to restrict root logins via SSH, an extra
    step to guard against the potential of an attacker gaining remote root access;
    I can always log on as a regular user and use sudo. Finally, in the last two lines
    in the preceding example, I am defining my authentication method to be based on
    RSA keys only by disabling password authentication. RSA authentication is easy
    to administer and does not require that users expose their passwords at all.


    In addition to the server configuration file, SSH also includes a client-side
    configuration file (/etc/ssh/ssh_config) that sets up the defaults for clients
    wanting to use the ssh application. Table 12.2 lists the most useful directives
    in the /etc/ssh/ssh_config file.


    # Table 12.2 /etc/ssh/ssh_config Directives


    | Option | Meaning | Default |

    | :--- | :--- | :--- |

    | BatchMode | Disables user/password prompting for use of SSH in unattended scripts.
    | N/A |

    | Cypers cypher1, cyper2... | Specifies encryption cypher to be used (SSH v.2).
    | 3des-cbc, blowfish-cbc, arcfour, cast128-cbc |'
  merge: -1
