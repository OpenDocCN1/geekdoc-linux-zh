- pgno: 288
  md: 'In Listing 9.4, you have simply added two rules to the forward chain, one to
    allow all SMTP traffic to the mail server (64.65.66.3) and another to allow traffic
    source from 128.129.130.0/24 to connect to port 80 of the DMZ Web server (64.65.66.3).
