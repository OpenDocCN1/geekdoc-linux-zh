    The second command in this example invokes the openssl utility to import an X.509
    server certificate (-in server.crt) and export a textual fingerprint (-text -fingerprint)
    corresponding to the input certificate. The result of this command is quite verbose,
    so I have piped it to a grep command to filter all lines except the one line of
    interest (the line containing the string MD5, a reference to the cryptographic
    hash algorithm used to extract the fingerprint from the whole certificate).


    Once the user has verified the authenticity of the certificate, they can choose
    to accept it until it expires by selecting the right option on their Web browser
