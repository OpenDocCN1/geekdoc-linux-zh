- pgno: 157
  md: '# **Nmap**


    While the Nessus philosophy was to provide a polished front end and a scalable
    client-server architecture to allow multiple users to audit the network at the
    same time, the Nmap tool offers a powerful, versatile network-scanning tool for
    the more experienced network administrator. I have found Nmap to be a great tool
    for quickly assessing:


    +   - Which hosts are up in a certain subnet

    +   - Which ports (TCP, UDP) are open on a range of target systems

    +   - What operating system is running on those systems


    I use the first two capabilities areas to make sure that there aren''t any rogue
    systems up and running on my local area network (LAN), and to make sure that my
    Linux servers are not running any services that I''m not aware of. The third capability
    allows me to find out exactly what type of system a suspected intruder is coming
    from. This is part of the information that I send back to the authorities of the
    intruder''s domain when I report an access violation or an attack.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "The next section explains how to download and install the latest version of\
    \ the Nmap package.\n\n# **Installing Nmap**\n\nThe main source of Nmap distribution\
    \ is www.insecure.org. You can download both the full sources or the RPM packages\
    \ from this site. The simplest way to install it is by using the remote source,\
    \ as follows:\n\n```\n```bash\n[ramon]:~$ rpm -vhU http://www.insecure.org/nmap/dist/nmap-2.53-1.i386.rpm\n\
    ```\n```\n\nOnce installed, you’ll use the main Nmap executable, located at `/usr/bin/nmap`\
    \ by default. The following section describes some common uses of the Nmap tool.\n\
    \n# **Using Nmap**\n\nAlthough Nmap is a comprehensive network-auditing tool,\
    \ its discussion in this book focuses on its ability to identify live hosts, active\
    \ network services, and remote operating system type because these are the areas\
    \ where Nmap is most useful.\n\nThe simplest use of Nmap is to identify which\
    \ hosts are *live* (up and available) on the network at any one time. This task\
    \ is called a *port scan*. Listing 5.5 illustrates an example of using Nmap to\
    \ perform a port scan on a subnet.\n\n# **Listing 5.5** Using Nmap to perform\
    \ a port scan on an entire subnet\n\n```\n```bash\n[ramon]:5$ sudo nmap -sP 192.168.1.0/24\n\
    \nStarting nmap V. 2.53 by fyodor@insecure.org⇓ \n( http://www.insecure.org/nmap/\
    \ )\nHost plus (192.168.1.5) appears to be up.\nHost donald (192.168.1.7) appears\
    \ to be up.\nHost minnie (192.168.1.44) appears to be up.\nHost dumbo (192.168.1.67)\
    \ appears to be up.\nNmap run completed - 256 IP addresses (4 hosts up) scanned\
    \ in 9⇓ \nseconds\n```\n```\n\nNmap considers a host to be *up* if it responds\
    \ to either an ICMP Echo request or to a TCP ACK.\n\nAnother popular use of Nmap\
    \ is to identify which ports (TCP, UDP) are open on a remote host. This is called\
    \ a *TCP scan*. A port is *open* when there is a listener daemon that responds\
    \ to network requests to that port on the target system.\n\nListing 5.6 illustrates\
    \ an example of using Nmap to perform a TCP scan. In this example, Nmap has found\
    \ that the target hosts have a total of three HTTP ports open: Secure Shell (TCP\
    \ service number 22), SMTP Mail (TCP service 25) and Secure HTTP (TCP service\
    \ 443). Note that by default, Nmap only scans the first 1500 or so TCP ports."
  merge: -1
  img_proc: true
- pgno: 159
  md: "# **Listing 5.6** Using Nmap to perform a TCP scan on a single target host\n\
    \n```\n    [ramon]$ sudo nmap -sS target.example.com\n\nStarting nmap V. 2.53\
    \ by fyodor@insecure.org\n( www.insecure.org/nmap/ )\nInteresting ports on target.example.com\
    \ (192.168.1.1):\n(The 1520 ports scanned but not shown below are in state: filtered)\n\
    \    Port      State      Service\n    22/tcp    open       ssh\n    25/tcp  \
    \  open       smtp\n    443/tcp   closed     https\nNmap run completed -- 1 IP\
    \ address (1 host up) scanned in 178 seconds\n```\n\nThe third example illustrates\
    \ Nmap's ability to identify the type of operating system running on a remote\
    \ host and to examine the particularities of the host's TCP implementation. The\
    \ Nmap authors call this *TCP* ***fingerprinting***, and their implementation\
    \ is fairly sophisticated, using a constantly updated file containing fingerprint\
    \ templates that it compares to the target's TCP responses.\n\nListing 5.7 shows\
    \ a sample run of Nmap to identify the operating system for three target hosts:\
    \ a Lucent Pipeline PL75 router, a Solaris 2.5.1 workstation, and a Linux server.\
    \ Note that part of the output in Listing 5.7 includes the degree of difficulty\
    \ (Difficu*ty*=y), which tells you how hard it is to identify the target operating\
    \ system over the network. Note that Linux earned the highest degree out of the\
    \ three targets!\n\n# **Listing 5.7** Using Nmap to identify a remote host's operating\
    \ system\n\n```\n    [ramon]$ sudo nmap -O 192.168.1.1 192.168.1.100 192.168.1.200\n\
    \nStarting nmap V. 2.53 by fyodor@insecure.org\n( www.insecure.org/nmap/ )\nInteresting\
    \ ports on router (192.168.1.1):\n(The 1522 ports scanned but not shown below\
    \ are in state: closed)\n    Port      State      Service\n    23/tcp    open\
    \       telnet\nTCP Sequence Prediction: Class=random positive increments\nDifficult*\
    \ y*=15144 (Worthy challenge)\nRemote OS guesses: Ascend P130 Router, Ascend P75\n\
    Interesting ports on fantasia (192.168.1.100):\n(The 1519 ports scanned but not\
    \ shown below are in state: closed)\n    Port      State      Service\n    21/tcp\
    \    open       ftp\n```"
  merge: -1
  img_proc: true
