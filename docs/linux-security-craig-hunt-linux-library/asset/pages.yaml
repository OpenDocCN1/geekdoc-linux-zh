  md: '+   *   The keyword EXCEPT, which is used in conjunction with other values
    to except some values from the previously defined set, e.g., `ALL EXCEPT`

    +   *   A pattern of the form user@host that matches when the login name matches
    the user part and when the host part matches a local machine name


    origins The origins field identifies from where the access attempt is originating,
    Combining the users field and the origins field gives the pam_access module control
    over who logs in and from where they login. This field contains a list of one
    or more:


    +   *   Linux tty names for non-networked logins

    +   *   Host names

    +   *   Domain names, which must begin with a period (.)

    +   *   Host addresses

    +   *   Internet network numbers, which must end with a period (.)

    +   *   The keyword ALL, which matches anything

    +   *   The keyword EXCEPT, which is used in conjunction with other values to
    except some values from the previously defined set, e.g., 192.168.12 EXCEPT 192.168.12.251

    +   *   The keyword LOCAL, which matches any host name that does not contain a
    period (.)


    Let''s see some example lines from the access.conf file that illustrate how permission,
    users, and origins values are combined to create access controls. The following
    line disallows console logins to all but a few accounts:


    ```

    --ALL EXCEPT wheel shutdown sync::LOCAL

    ```


    The next line disallows logins from users in the privileged wheel group, unless
    those users log in from a host that can be reached without using a fully qualified
    domain name or from a host in the domain sybex.com:


    ```

    --wheel:ALL EXCEPT LOCAL .sybex.com

    ```


    The next line means that some accounts are not allowed to log in from anywhere:


    ```

    --contro101 contro102 service fieldsvc :ALL

    ```


