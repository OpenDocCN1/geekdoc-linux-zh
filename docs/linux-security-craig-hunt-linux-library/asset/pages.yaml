    Finally, you need to add code to your `httpd.conf` file in order to prevent Web
    users from viewing the `.htaccess` file on any directory within the content tree,
    since it contains authorization information. The following directive instructs
    Apache to look for any filenames starting with the characters `.ht` anywhere within
    the content tree and denies their access to all users. This directive not only
    protects the `.htaccess` files, but it also protects any occurrences of the `.htpasswd`
    file, a common filename that is sometimes used to store password information.


    `<Files "^.ht">`

    `Order allow,deny`

    `Deny from all`

    `</Files>`


    # ### Hardening the Apache Server


    As with any other application running on your Linux server, you need to ensure
    that the server''s operation cannot be compromised by an intruder trying to gain
    unauthorized access to your system. Besides keeping up with the latest security
    advisories and patches on `www.apache.org` and `www.cert.org`, there is a number
    of areas where careful planning during the installation process can go a long
    way toward improving security.


    **The Apache User** While the Apache daemon must be started by `root`, it is imperative
    that the Apache daemon not be run under a username with privileged rights. The
    `httpd.conf` file supports two directives:


    +       user apache-user

    +       group apache-group


    `apache-user` and `apache-group` are the user ID and group ID under which the
    server runs. The Apache user should be added to `/etc/passwd` and given a secure
    password, and its home directory should be the content tree. All content administration
    should be made using this user.


    **Content-Tree Ownership and Permissions** Only `apache-user` and `apache-group`
    should be able to write to the content tree, and the tree should be owned by this
    username/group combination. The following command is an example of how to assign
    this ownership:


    ```

    `[ramon]$ sudo chown -Rh apache:apache /var/www/html`

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Hiding Directory Contents By default, when the browser requests a directory
    listing in the URL, Apache returns the contents of one of the files listed under
    the `DirectoryIndex` directive, for example:


    ```

    DirectoryIndex index.html index.htm index.shtml index.php index.php4 index.php3
    index.cgi

    ```


    However, if one of these files is temporarily unavailable, the user may actually
    get a listing of all the files on the directory, including script and header files
    that you may not want the user to be able to list. To prevent this, make sure
    that all content directories have their read bit turned off for group and other
    by executing the following commands:


    ```

    [ramon]$ cd /var/www

    [ramon]$ ls -ld html

    drwxr-xr-x 2 apache apache 1024 Dec 4 20:44 html

    [ramon]$ sudo -u apache chmod go-r html

    [ramon]$ ls -ld html

    drwx--x--x 2 apache apache 1024 Dec 4 20:44 html

    ```


    CGI Scripts Common Gateway Interface (CGI) scripts allow your users to execute
    code in response to HTTP input and return something meaningful to the remote browser.
    As with any executable, make sure that your users are writing safe scripts and
    that the ownership and permissions of these scripts are correct. To accomplish
    this, Apache allows you to restrict all CGI scripts to a single directory using
    an httpd.conf directive like the following:


    ```

    ScriptAlias /cgi-bin/ "/var/www/cgi-bin/*"

    ```


    This directive ensures that all CGI scripts live on the /var/www/cgi-bin directory,
    where you can easily track and monitor them. You should examine this directory
    periodically to ensure that there are no world-writable script files on it.


    Server Side Includes Server side includes (SSIs) are extensions to the static
    HTML content that allow for conditional execution of external programs, as well
    as "just-in-time" content modification. SSIs represent a potential security problem,
    since it is difficult to put bounds on the programs that an HTML file is allowed
    to execute.'
  merge: -1
  img_proc: true
