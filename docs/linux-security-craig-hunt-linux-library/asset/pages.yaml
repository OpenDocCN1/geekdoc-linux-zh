    # *iptables* Rule Specifications


    The real power in the `iptables` command is its ability to match a specific type
    of traffic using its rich ruleset. Every packet that is forwarded from the server
    arrives at the server, or is originated by the server, and is compared to the
    ruleset for the appropriate chain (forward, input, and output). If the packet
    matches the rule, the specified action (defined by the `-j action` option) is
    taken. Table 9.5 lists the parameters to be used in the `rulespecifications` portion
    of the `iptables` command.


    **Table 9.5** `iptables` Rule Specification Parameters


    | Parameter | Meaning |

    | :--- | :--- |

    | `-p [!]protocol` | Protocol ID to match. This can be tcp, udp, icmp, or any
    numeric or alphabetic representation of a service in `/etc/services`. |

    | `-s [!]address[/mask]` | Source address to match. This can be a host name, an
    IP address, or a network name in network/mask format. |

    | `--sport [port:[port]]` | Specification of source port or source port range.
    |'
