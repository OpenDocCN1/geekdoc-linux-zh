    \ | Send e-mail report even if no violations occurred. |\n| EMAILREPORTINGLEVEL\
    \ | Default verbosity level of e-mail report (0 through 4). |\n| REPORTLEVEL |\
    \ Default verbosity level of printed report (0 through 4). |\n| MAILMETHOD | Choice\
    \ of mail transport (SMTP or Sendmail). |\n| SYSLOGREPORTING | Send user.notice\
    \ reports through syslog. |\n| MAILPROGRAM | Program invoked for mailing Tripwire\
    \ violation reports. |\n\nThe next section describes the syntax and maintenance\
    \ of the policy file and the last steps needed to get tripwire up and running.\n\
    \n**The tripwire Policy File** Now that you have defined the operational parameters\
    \ of tripwire, you're ready to tell it which files to watch. This is done in the\
    \ policy file, which is located by default in /usr/TSS/policy/twpol.txt.\n\nA\
    \ typical tripwire policy file has three distinct sections:\n\n+   Global definitions\
    \ of variables whose scope includes the entire policy file\n+   \n+   • File severity\
    \ levels that allow you to prioritize the execution of policies\n+   \n+   • Rules\
    \ or group of properties to be checked for each file or object"
