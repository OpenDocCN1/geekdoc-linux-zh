    of the RSA keys used in FreeS/WAN, you do want to verify the integrity of the
    keys that you use in rightaskkey and leftaskkey, ideally via an out-of-band method
    (in person or over the phone). This is to protect yourself against a man-in-the-middle
    attack, where an intruder replaces the real public key with their own, with the
    intent to impersonate one of your peers and intercept the informa- tion destined
    for these peers.


