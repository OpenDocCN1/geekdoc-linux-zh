  md: 'For example, to connect to remote SSH server `remote.example.com` as root using
    the Blowfish encryption algorithm, use the following command:


    ```

    ```

    [ramon]$ ssh -l root -c ''blowfish'' remote.example.com

    root@remote.example.com''s password:

    Last login: Wed Feb 7 16:55:33 2001 from redhat.example.com

    remote:~ #

    ```

    ```


    Or, to connect to the same server with the `StrictHostKeyChecking` option (listed
    in Table 12.2) turned off, use the following command:


    ```

    ```

    [ramon]$ ssh -l root -c ''blowfish'' -o StrictHostKeyChecking=no \

    remote.example.com

    Warning: Permanently added ''remote.example.com,209.207.155.67'' (DSA)

    to the list of known hosts.

    root@remote.example.com''s password:

    Last login: Wed Feb 7 17:03:37 2001 from redhat.example.com

    remote:~ #

    ```

    ```


    Note that the local SSH client has warned you that you have received a DSA host
    key from the remote end. If you ever need to disable the `StrictHostKeyChecking`
    option, I encourage you to check the validity of the resulting host key with the
    server''s administrator (ideally, offline).


    # In Sum


    This chapter introduced the concept of virtual private networking and the increasingly
    prevalent role that this technology is going to play in your Linux network, especially
    if your company has several branch offices that need to be interconnected. The
    IPsec specification has been universally accepted as the leading candidate for
    implementing VPN endpoints, and the FreeS/WAN Linux implementation includes all
    the features necessary for you to roll it out as a production solution.


    For remote access to protected internal resources, the PPTP protocol allows you
    to leverage a potentially large installed base of PPTP-compliant Windows remote
    users. This is a tremendous advantage over VPN technologies that would force you
    to roll out a proprietary client. Although Windows 2000 now ships with IPsec capabilities,
    the older Windows versions (95, 98, and NT) lack an established IPsec client.
    The PopTop Linux PPTP package is now in version 1.1 and offers a good alternative
    to a Windows NT or 2000-based PPTP server.'
