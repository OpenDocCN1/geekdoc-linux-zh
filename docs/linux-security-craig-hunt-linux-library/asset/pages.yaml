- pgno: 96
  md: 'You should update the logcheck.hacking and the logcheck.violations files regularly
    with newly discovered log message patterns, or, better yet, make sure that you
    always have an up-to-date logcheck installation on all your servers. In addition,
    take the time to add items to these files that are specific to your server and
    your system needs. For example, add message patterns from Apache if you''re running
    an HTTP server, or from sendmail if you''re running a mail server.


    Note that by default, the Linux version of logcheck scans the /var/log/messages
    file for all events, so make sure that this file is indeed seeing all application
    log messages. Your /etc/syslog.conf file should have the following line in it:


    ```

    * .info /var/log/messages

    ```


    While there are no real configuration files, the actual logcheck shell script
    (/usr/sbin/logcheck) is very readable, and it has a few variable definitions toward
    the front. I recommend that you only change the line


    ```

    SYSADMIN=root

    ```


    to a username other than root, if you have a special account to which the logs
    should be e-mailed instead.


    # Running logcheck


    logcheck uses cron to schedule periodic runs. Make sure that your system is indeed
    running crond (the cron daemon) by issuing the following command:


    ```

    [ramon]$ ps aux | grep cron

    root 403 0.0 0.4 1284 304 ? S Sep24 0:00 crond

    ```


    Upon installation, the logcheck RPM distribution creates the following file in
    the /etc directory:


    ```

    /etc/cron.hourly/logcheck

    ```


    This file forces the cron job on your server to execute logcheck at the top of
    the hour, resulting in hourly e-mail messages to the root account on the server.
    This e-mail message includes a report on the security violations and any unusual
    system events recorded during the last hour.


    Listing 3.5 shows an example of this hourly report. In this report, logcheck reports
    that there was a SOCKSS client that failed to properly authenticate to the local
    server, as well as a regular user (ramon) who performed a su command to inspect
    the /var/log/ messages file.'
