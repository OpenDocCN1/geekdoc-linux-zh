- pgno: 368
  md: '# ## Installing FreeS/WAN


    There are four fundamental pieces to the FreeS/WAN software distribution:


    +   * Kernel source patches and additions

    +   * The IKE daemon, which is called *pluto*

    +   * A set of scripts to manage the package

    +   * Man pages and configuration files


    Start by installing the kernel patches. Go to the `/usr/src/freeswan` directory
    and enter the *make xgo* command:


    ```

    ```

    [ramon]$ cd /usr/src/freeswan-1.8

    [ramon]$ sudo make xgo

    ```

    ```


    To install the FreeS/WAN software, you need a valid source tree because the *make
    xgo* command rebuilds the kernel. I recommend that you download the kernel source,
    including the headers, for your distribution and build a standard kernel before
    running *make xgo*. Downloading the kernel source and headers allows you to become
    familiar with the kernel-building process before you modify the kernel to suit
    the needs of FreeS/WAN. This saves you from having to debug issues related to
    building your kernel. The *make xgo* command requires the same input as any kernel-building
    process. Make the kernel changes appropriate to your system’s hardware and save
    the configuration changes.


    > > **WARNING** Make sure to save the configuration changes, even if you have
    not modified any of the default kernel values.


    As you exit the graphical interface of the *make xgo* command, the system starts
    the kernel recompilation with the new patches. This can take anywhere from a few
    minutes to several hours depending on your CPU speed, the amount of RAM on your
    system, and the types of disk drives. At the end of the compilation, you should
    see the following two lines:


    ```

    ```

    make[1]: Leaving directory `/usr/src/linux-2.2.16`

    utils/errcheck out.kbuildd

    ```

    ```


    If your results are different, the chances are that something went wrong in the
    kernel build. Check out the *out.kbuildd* file for information on the problem.
    If all went well, finish up the kernel installation process from the same directory
    with the following command:


    ```

    ```[ramon]$ sudo make kinstall```

    ```'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'This is equivalent to issuing the following traditional kernel-building steps:


    ```

    make

    make install

    make modules

    make modules_install

    ```


    As with the previous step, if all went well, you should see the following two
    lines at the bottom of the screen:


    ```

    make[1]: Leaving directory `/usr/src/linux-2.2.16`

    utils/errcheck out.kinstall

    ```


    If you have already built and installed this version of the kernel before (which
    I strongly recommend), your /etc/lilo.conf file should not need to be modified.
    Simply rerun the lilo command:


    ```

    [ramon]$ sudo /sbin/lilo

    ```


    Then reboot your system. Upon startup, you should see messages of the type


    ```

    klips_debug:ipsec_tunnel_init: initialisation of device: ipsec0

    ```


    and you should verify that the IKE daemon (pluto) is active:


    ```

    [ramon]$ ps -ef | grep pluto

    root 490 1 0 20:43 ? 00:00:00 /usr/local/lib/ipsec/pluto --deb

    ```


    In addition, you may want to make sure that your system now has at least one virtual
    IPsec interface:


    ```

    [ramon]$ ifconfig ipsec0

    ipsec0 Link encap:IPip Tunnel HWaddr

    NOARP MTU:0 Metric:1

    RX packets:0 errors:0 dropped:0 overruns:0 frame:0

    RX packets:0 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuelen:10

    ```


    If everything looks to be in place, go on to the next section and begin configuring
    your IPsec connections!


    # ## Configuring FreeS/WAN


    If you have made it this far, your system is currently IPsec enabled and is ready
    to be configured to establish secure connections with other Linux servers.'
