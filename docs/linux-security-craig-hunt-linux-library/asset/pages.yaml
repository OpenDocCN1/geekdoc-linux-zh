- pgno: 166
  md: 'In actuality, even if the intruder is a joyrider casually scanning your subnet
    looking for an open door, and even if you have made sure that your system is secure,
    the intruder''s activity is consuming precious bandwidth on your Internet connection.
    In addition, that activity could eventually lead to a denial of service (DoS)
    attack on your entire network, or at least on the system that is currently being
    targeted by the intruder.


    Clearly, the job of the security administrator is both a proactive and a reactive
    one. Network auditing aims at preventing an attack, and it should be your primary
    focus. However, network monitoring also has just as important a role in helping
    you react to an attack. The next two sections describe two popular Linux network-monitoring
    tools available in the public domain: PortSentry and Etherereal.


    # ## PortSentry


    Part of Psionic Software''s Abacus suite of security software, PortSentry is a
    real-time monitoring tool designed to detect a port scan directed at your system,
    and to respond to it appropriately. These responses are configurable and they
    vary in nature, from adding the offender''s IP address to your TCP Wrappers''
    /etc/hosts.deny file, to modifying the local routing table to divert responses
    to that host.


    One of PortSentry''s strongest suits is its Advanced Stealth Scan Detection Mode,
    which is the capability to learn the ports that your Linux server is listening
    on and only to look for connections to the ports that are not currently in service.
    This makes for light operation that uses precious little CPU cycles. This is very
    important because you do not want to compromise the performance of your Linux
    server when running a network monitor on it. If you have to compromise your server
    performance when running a network scan, perform the scan during off-peak hours
    to make sure that your users are not affected by it.


    Another advantage of PortSentry over most other network monitors is its ability
    to keep track of intruders'' IP addresses as a function of time. This allows you
    to only react to a port scan when the intruder is a repeat offender, or to take
    specific action based on the frequency at which a particular address is attempting
    to perform a port scan on your system.


    The next section describes the installation of the PortSentry application on your
    Linux server.


    # ## Installing PortSentry


    You can download the latest version of PortSentry from Psionic''s Web site, www.psionic.com,
    in source distribution format. In addition, the RPM version is also available
    from the usual archives. Simply download the appropriate RPM package and install
    it on your system using the following command:


    ```

    `[ramon]$ sudo rpm -i portsentry-1.0.4.1386.rpm`

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'This command installs the main executable (/usr/sbin/portsentry) as well as
    the configuration file /etc/portsentry/portsentry.conf).


    # Configuring PortSentry


    Before start up PortSentry, edit the main configuration file, /etc/portsentry/portsentry.conf,
    and assign the following environment variables in it:


    ADVANCED_PORTS_TCP (ADVANCED_PORTS_UDP)  This variable determines the highest
    port that PortSentry will monitor. Since Nmap typically scans the first 1500 ports
    or so, I recommend that you set this value to 1500. Note that there are two applicable
    variables, one for TCP and another for UDP. Also note that by default, PortSentry
    does not listen for scans on the ports that are active on your Linux server.


    ADVANCED_EXCLUDE_TCP (ADVANCED_EXCLUDE_UDP)  Initialize this variable with the
    port numbers that should not cause an alarm, even though the system is not currently
    listening for them. These should be port numbers that are typically used by mistake,
    like port 80 (HTTP) on an HTTPS server.


    BLOCK_TCP (BLOCK_UDP)  This variable instructs PortSentry to not block any hosts
    that are found guilty of perpetrating TCP (or UDP) scans. This can be useful to
    avoid a subtle type of attack where the intruder spoofs their address to be that
    of a legitimate host in order to force your Linux server to block traffic from
    that host. Forging the source is relatively easy to do, especially within a UDP
    packet.


    KILL_ROUTE  This variable allows you to specify the command that PortSentry should
    use in order to kill the local route to a port scan perpetrator. The $TARGETS
    placeholder can be used to pass the IP address of the offending host to the command.
    I recommend that you take less drastic action than routing this address into a
    black hole, such as adding their address to an ipchains block list, as in the
    following example:


    ```

    `KILL_ROUTE="/sbin/ipchains -I input -s $TARGETS -j DENY -1"`

    ```


    > **NOTE** See Chapter 9, “Network-Layer Firewalls,” for a full discussion of
    this type of perimeter security devices.


    KILL_RUN_CMD  This variable allows you to specify the command that PortSentry
    should use just before applying the command defined in KILL_ROUTE. Resist the
    temptation to use this command to take automatic retaliatory action against the
    (alleged) intruder. This action can be used as a denial of service against you,
    as mentioned in the discussion of the BLOCK_TCP variable. I thereby recommend
    that you comment out this option.


    KILL_HOSTS_DENY  This variable allows you to specify the syntax of the /etc/hosts.deny
    entry that PortSentry should add in order to block the offending host'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'from TCP Wrappers. The TARGETS placeholder can also be used here. I recommend
    that you use a setting similar to the following:


    ```

    KILL_HOSTS_DENY=''ALL: $TARGETS : $DENY"

    ```


    SCAN_TRIGGER Setting this variable to something higher than 0 gives an offender
    a number of “free” scans before you take action. I recommend setting this variable
    to 1 in order to weed out the one-off casual port scanner.


    In addition to the /etc/portsentry/portsentry.conf file, always edit the /etc/
    portsentry/portsentry. ignore file and add any hosts (one per line) that you want
    PortSentry to ignore altogether. I recommend that you limit this to the local
    host (127.0.0.1) and to the addresses of all the interfaces on your Linux server.


    # Using PortSentry


    The Linux version of PortSentry has the capability to use advanced port-scan detection
    even for the more sophisticated port scans. For example, it will detect a SYN
    flood attack, where an intruder initiates a large number of half-open TCP connections
    against your server.


    The two command-line options of the portsentry command that are of interest are:


    ```

    portsentry -atcp

    portsentry -audp

    ```


    The first command-line option, -atcp, listens for TCP scans starting with TCP
    port 1 and ending with the port number specified in the ADVANCED_PORTS_TCP variable
    of the configuration file. Conversely, the second command-line option, -audp,
    listens for scans from UDP port 1 to ADVANCED_PORTS_UDP.


    A typical attack is logged by PortSentry directly to syslog, where it appears
    (typically on /var/log/messages) in the following format:


    ```

    Nov 18 21:11:49 mickey portsentry[19891]: attackalert: Connect from host: badguy/192.168.100.100
    to TCP port: 900


    Nov 18 21:11:49 mickey portsentry[19891]: attackalert: Host 192.168.100.100 has
    been blocked via wrappers with string: ''AL L: 192.168.100.100''


    Nov 18 22:11:32 mickey portsentry[19891]: attackalert: Host: badguy 192.168.100.100
    ''is already blocked Ignoring

    ```


    In this example, PortSentry was started with the line


    ```

    portsentry -atcp

    ```


    and instructed to watch for all TCP connections below port 1500. The intruder
    (192.168.100.100) attempted to connect to TCP port 900, which does not have a
    daemon'
  merge: -1
