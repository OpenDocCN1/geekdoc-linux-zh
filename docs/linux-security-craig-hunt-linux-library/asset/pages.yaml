- pgno: 238
  md: '# Samba Administration with SWAT


    The Samba Web Administration Tool (SWAT) was included in the standard Samba server
    distribution starting with version 2.0. SWAT is a useful utility for managing
    the smbd and nmbd servers, as well as for managing the `/etc/samba/smb.conf` configuration
    file. As with other tools of this kind, SWAT is an HTTP server that listens on
    a special port (TCP 901, in this case) and can be used by any Web browser by just
    pointing to the URL `http://my.samba.host:901` (see Figure 8.4), where `my.samba.host`
    is the name of your Linux server running Samba.


    # Figure 8.4  The Samba Web Administration Tool


    ![](img/3258bbaf790525f8c4eb25fabff7844a_238_0.png)


    In order to start using SWAT, first make sure there is an entry in the `/etc/services`
    file for port TCP 901. You can do this with the following command:


    ```

    ```

    [ramon]$ grep swat /etc/services

    swat                      901/tcp

    ```

    ```


    Then simply modify inetd or xinetd so that it starts the listener daemon. If you''re
    running inetd, add the following line to the `/etc/inetd.conf` file:


    ```

    ```

    swat    stream    tcp     nowait    root    /usr/sbin/tcpd  /usr/sbin/swat

    ```

    ```'
  merge: -1
  img_proc: true
