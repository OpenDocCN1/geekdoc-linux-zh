    Make sure to define rules to monitor the integrity of the policy directory, the
    key files, and the reports, as in the previous example. Note that the content
    of the report files is considered to be dynamic, and the recurse=0 directive instructs
    tripwire not to go into any of the report subdirectories.


    The following is an example of a medium severity rule that defines a set of files
    that can change on a regular basis, but must retain their user and group ownership:


    ```

    # Commonly accessed directories that should remain static with regards to owner
    and group


    (rule name = ''Invariant Directories'' , severity = $(SIG_MED))

    {

    / -> $(SEC_INVARIANT) (recurse = 0) ;

    /home -> $(SEC_INVARIANT) (recurse = 0) ;

    /etc -> $(SEC_INVARIANT) (recurse = 0) ;

    }

    ```


