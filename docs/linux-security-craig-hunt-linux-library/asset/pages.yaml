    # In Sum


    Building a Linux firewall is conceptually easy, but the devil is in the details.
    This chapter has walked you through the general concept of packet filtering and
    its implementation in the Linux kernel. You’ve learned about two user space tools
    that you can use to define the necessary filtering rules: ipchains (introduced
    with kernel 2.1), and the newer iptables (introduced with kernel 2.3). You got
    a chance to look at a number of detailed network scenarios, and you’ve seen several
    sample iptables configurations that reflecting several different security policies.


    Although the initial cost of deploying a Linux firewall will be lower than many
    commercial alternatives, crafting a configuration to reflect your security policy
    takes some serious attention to detail. Packet filtering is your first level of
    perimeter defense, but a comprehensive security stance will make use of protection
    at the transport and application layer as well. In the next chapter of this book,
    we shift our focus to transport-layer firewalls, when you’ll get a close look
    at the SOCKS proxying protocol.'
