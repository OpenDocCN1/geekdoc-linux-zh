- pgno: 446
  md: 'system dictionary and a set of rules for identifying potentially vulnerable
    password choices. By default, pam_cracklib prompts for a single password, checks
    its strength, and then, if it is considered strong, prompts for the password a
    second time to verify that it was typed correctly the first time.


    In addition to the checks to which the cracklib library submits a potential password,
    the pam_cracklib module also checks that the password is not:


    +   • A palindrome: Is the new password a palindrome of the old one?

    +   • A simple case change: Is the new password simply the old one with only a
    change of case?

    +   • Too similar: Is the new password too much like the old one? This is primarily
    controlled by one argument, difok, which defines the minimum number of characters
    by which the new password must differ from the old; this defaults to 10 characters
    or 1/2 the size of the new password, whichever is smaller. To avoid the lookup
    associated with trying to change a long and complicated password, difignore is
    available. This argument can be used to specify the minimum length that a new
    password needs to be before the difok value is ignored. The default value for
    difignore is 23.

    +   • Too simple: Is the new password too small? This is controlled by five arguments:
    minlen, dcredit, ucredit, lcredit, and ocredit. (See the description of these
    arguments later in this section.)

    +   • Rotated: Is the new password a rotated version of the old password?

    +   • A password that has already been used: Was the password used once already
    by this user? Note that Linux stores previously used passwords in the file /etc/security/opasswd.


    If all of these checks succeed, the password is passed on to subsequent modules
    to be installed as the new authentication token.


    A typical pam_cracklib entry in the /etc/pam.d/system-auth file has the following
    syntax:


    ```

    password control_flag pam_cracklib.so arguments

    ```


    The arguments to be passed to the pam_cracklib module can be one or more of the
    following:


    +   • debug: This argument makes the pam_cracklib module write debug information
    to syslog. Note that even with this option set, pam_cracklib does not write password
    information to the log file.

    +   • type=XXX: This argument replaces the word UNIX with the value defined for
    XXX in the following prompts: “New UNIX password:” and “Retype UNIX password:”.'
