  md: '**user** The user keyword defines the uid to use for the server process.


    **group** The group keyword defines the gid to use for the server process.


    **instances** The instances keyword defines the maximum number of server instances
    that can be active concurrently for this service. The value can be either a number
    or the value UNLIMITED (no limit).


    **server** The server keyword is the fully qualified location of the server program
    to handle this service.


    **server_args** The server_args keyword specifies the set of arguments passed
    to the server. Unlike inetd, the server name itself should not be included in
    the list of arguments.


    **only_from** The only_from keyword specifies the remote hosts or networks from
    which the given service is available. Its value can be a host name (**host.example.com**),
    a domain (**example.com**), a single-host IP address (**63.75.44.67**), a network
    address (**63.75.44.0**), or an IP address with a netmask range description (**63.75.44.0/24**).


    **no_access** The no_access keyword specifies the remote hosts or networks to
    which the particular service is unavailable.


    **access_times** The access_times keyword specifies the time intervals when the
    service is available. Time periods are specified using the syntax: **hour:min-hour:min**
    (e.g., 09:00-17:00).


    **log_on_type** The log_on_type keyword defines the destination of the log messages.
    The value can be one of the following:


    +   * **SYSLOG syslog_facility [syslog_level]**: Send the output to the specified
    syslog facility with the specified level.

    +   * **FILE [soft_limit [hard_limit ]]**: Send the output to FILE. Once the file
    size has reached soft_limit, a message is logged. Once the file size has reached
    hard_limit, logging ceases.


    **log_on_success** The log_on_success keyword defines the type of information
    to be logged when the remote client connects to the server and when the connection
    is torn down. The value can be one of the following:


    +   * **PID**: Log the server’s process ID.

    +   * **HOST**: Log the remote host address.

    +   * **USERID**: Log the user ID of the remote process.

    +   * **EXIT**: Log the fact that the service exited, including the exit status.

    +   * **DURATION**: Log the duration of a service session.


    **log_on_failure** The log_on_failure keyword defines the type of information
    to be logged when the remote client cannot connect to the server, either because
    of'
