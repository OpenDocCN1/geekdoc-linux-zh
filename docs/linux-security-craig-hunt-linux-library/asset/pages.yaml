- pgno: 15
  md: '# # Introduction


    With the advent of the Internet revolution came the ability of hundreds of geographically
    dispersed software developers to collaborate on projects that would had been inconceiv-able
    just years before. It was the fall of 1991, and while the Internet hadn’t yet
    become the household name that it is today, a global team of talented software
    junkies was hard at work crafting what would become the most successful public-domain
    software offering of all time: the Linux operating system. Ten short years after
    the first 0.x release, the “Volkswagen of operating systems” enjoys an increasingly
    strong foothold in the work-station marketplace and stands above all other server
    platforms as one of the most robust, and certainly the most cost-effective, operating
    systems.


    Ironically, the same Internet explosion that helped usher in the development of
    the Linux operating system is also to blame for the climate of lawlessness that
    has forced network administrators to re-examine their network security postures.
    As corporations large and small look to the Internet as a necessary way to conduct
    business, network managers become instant security experts, and what once was
    the distant threat of malicious intru-sion is now the order of the day.


    While there is no such thing as a *secure* network server, the Linux operating
    system was designed with a strong focus on security, and its open-source nature
    allows administra-tors, developers, and end users to constantly audit it for vulnerabilities.
    It’s precisely this ability to look “under the hood” that makes Linux the platform
    of choice in environ-ments where security is just as important as high availability
    and ironclad stability.


    This book concentrates on what it takes to make your Linux servers as secure as
    possible, and how to ensure that your servers continue to be secure, even in the
    face of the ever-mutating array of malicious threats that plague the Internet
    today. It contains practical, step-by-step advice on how to harden a Linux installation,
    starting with a “stock” distri-bution using freely available software tools. The
    tips and techniques described in this book are equally relevant to installations
    of one or one thousand Linux servers. The advice that you’ll find here is the
    result of over ten years of experience that includes Linux systems, large-scale
    TCP/IP network administration, security consultation, and security product development
    for a leading Internet service provider.


    # ## Who Should Buy This Book


    This book goes well beyond a simple introduction to Linux security. Instead, it
    offers a comprehensive reference that is tailored for network administrators and
    experienced Linux users. While it does describe in detail all the security concepts
    that are introduced,'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'this book assumes that the reader already has a basic understanding of operating
    system principles, server administration, and TCP/IP networking fundamentals.


    Security topics are presented using a pragmatic approach, briefly describing the
    theory behind each concept, but with a strong emphasis on their direct application
    in Linux server administration, including examples and sample configurations.
    The idea is simple: Empower system administrators to secure Linux servers without
    compromising their performance and level of service.


    While all of the security tools are described in the context of the Linux operating
    system, most topics introduced in this book are also relevant to any other Unix
    variants because most Unix system tools are source-compatible across different
    flavors of the operating system.


    # # How This Book Is Organized


    This book is divided into six parts:


    +   - System Security

    +   - Network Security

    +   - Application Security

    +   - Perimeter Security

    +   - Remote Access and Authentication

    +   - Appendices


    The security topics introduced in this book are organized in order of proximity
    to the Linux kernel, starting with the core (system security), moving outward
    toward the network layer, application layer, and finally to the perimeter, where
    the private network meets the public Internet. In addition, this book discusses
    remote access to the network using dial-up networking and strong user authentication.
    At each of these layers, the reader will find references to several choices of
    publicly available utilities and native Linux tools, including complete instructions
    for their successful installation and configuration.


    The goal of this book is to provide a comprehensive how-to guide for building
    security into Linux servers from the ground up. However, the more experienced
    network administrator who has already mastered security at the system and network
    levels can use this book as a reference to deploy application and perimeter security
    mechanisms and to rationalize the security tools already implemented.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Part 1: System Security


    Part 1 provides the information you need to understand security at the operating
    system level. Chapter 1 introduces the basic building blocks of Linux security.
    Chapter 2 describes the security considerations in the installation and setup
    of a Linux system. Chapter 3 discusses system monitoring and auditing.


    # Chapter 1: Understanding Linux Security


    This chapter explains the basic ideas behind system security in general and Linux
    security in particular. It introduces security concepts that will be used throughout
    the rest of the book and discusses their role in a comprehensive Linux security
    solution.


    # Chapter 2: System Installation and Setup


    This chapter describes the process of installing and configuring the base Linux
    server software with an emphasis on security, highlighting the areas that are
    critical for the protection of the system against potential vulnerabilities. It
    also introduces the concept of encrypted filesystems and presents several alternatives
    for their implementation.


    # Chapter 3: System Monitoring and Auditing


    The security process doesn’t stop at implementation. This chapter explains how
    to monitor and audit Linux server installations for hidden security vulnerabilities.
    It also describes a number of public-domain utilities that can be used for monitoring
    and auditing at the operating system level.


    # Part 2: Network Security


    Part 2 builds on the practices introduced in the previous section by discussing
    a secure approach to configuring and managing Linux network servers (daemons)
    and the resources associated with them. Chapter 4 focuses on the `/etc/inetd.conf`
    configuration file. Chapter 5 explores a number of utilities available for monitoring
    and auditing network layer vulnerabilities.


    # Chapter 4: Network Services Configuration


    Linux systems are network-ready by default. Careful management of network services
    is paramount to a secure server installation. This chapter explores the configuration
    of the `inetd` and `xinetd` Internet *super-servers*, the spawning of stand-alone
    servers, and the installation and configuration of TCPServers, a transport layer
    filtering tool.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 5: Network Monitoring and Auditing


    Continued monitoring is just as important at the network level as it is at the
    system level. This chapter provides details on several network layer auditing
    utilities and surveys the current state of Linux-based intrusion detection and
    network forensics.


    # Part 3: Application Security


    Part 3 covers the security considerations of a number of popular server-class
    Linux applications. Chapter 6 discusses electronic mail transport agent security.
    Chapter 7 introduces the security issues associated with Apache, the most widely
    deployed HTTP server in the world. Chapter 8 discusses the security implications
    of file-sharing services and network print daemons.


    # Chapter 6: Electronic Mail


    This chapter focuses on the two most prevalent mail transport agents used in Linux
    servers: Sendmail and Qmail. In addition, the ever-popular Pretty Good Privacy
    (PGP) package is introduced, as is its public domain counterpart, the Gnu Privacy
    Guard (GnuPG).


    # Chapter 7: HTTP Services


    If the Web browser is the Internet’s “killer app,” the Apache HTTP server is,
    without a doubt, the Internet’s “killer server.” This chapter explores Apache’s
    security vulnerabilities and offers an in-depth look at its security configuration.
    In addition, two Apache-based implementations of Secure Sockets Layer (SSL) are
    introduced: Mod_SSL and Apache-SSL.


    # Chapter 8: Samba Security


    Central to any Linux server is its ability to share files with other Linux servers
    (via NFS) and with Windows clients (via Samba/SMB). This chapter offers a rare
    look into the security measures that should be taken when implementing these utilities,
    as well as the perils of offering Unix printing via LPD.


    # Part 4: Perimeter Security


    Part 4 goes “outside the box” to explore practical methods of protecting your
    Linux server network from Internet threats while still offering users an acceptable
    level of service and connectivity. Three types of firewalls are described: network
    layer firewalls (Chapter 9), transport layer firewalls (Chapter 10), and application
    layer firewalls (Chapter 11).'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 9: Network Layer Firewalls


    This chapter explains the ubiquitous packet-filtering firewall and its native
    support in the Linux kernel. This chapter describes the user-space tools (IPfwadm,
    IPCchains, IPtables) that Linux provides to manage network layer rules. It also
    offers a look into IP masquerading and network address translation.


    # Chapter 10: Transport Layer Firewalls


    Chapter 10 introduces the SOCKS5 system, a public-domain, transport layer firewall
    that allows a Linux server to proxy all public network communications on behalf
    of a number of diverse clients sitting behind the firewall in the private network.


    # Chapter 11: Application Layer Firewalls


    The Trusted Information Systems (TIS) Firewall Toolkit takes the concept of transport
    layer proxying a step further. Chapter 11 explains in detail the installation,
    configuration, and maintenance of the application-specific proxies that make up
    the TIS toolkit.


    # Part 5: Remote Access and Authentication


    Part 5 complements the discussion of Linux security by examining remote access
    to the network from the public Internet. Chapter 12 provides a comprehensive view
    of virtual private networking support in the Linux system. Chapter 13 outlines
    the S/Key and Kerberos authentication utilities. In addition, Chapter 13 surveys
    the Plug-in Authentication Module support in the latest Linux kernels.


    # Chapter 12: Virtual Private Networking


    Virtual private networks (VPNs) are all the rage in networking today, and Linux
    has historically been in the forefront of standards-based virtual private network
    support. Chapter 12 focuses on Free S/WAN, a public-domain, full-featured IPsec
    implementation, and PoPToP, a server implementation of the PPTP protocol made
    popular by Microsoft. The chapter also discusses the Secure Shell (SSH), a secure
    replacement for the standard Linux shell.


    # Chapter 13: Strong User Authentication


    Secure remote access hinges on the Linux server’s ability to authenticate the
    user who is requesting access. Chapter 13 explains the S/Key system for one-time
    password generation and the Kerberos suite of secret-key-based authentication.
    This chapter also describes the current kernel support for Plug-in Authentication
    Modules (PAMs).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Appendices


    The two appendices that come with this book provide you with information that
    supplements what you’ve learned in the chapters that precede them.


    # Appendix A: Other Sources of Information


    This appendix contains a list of selected Web references containing useful information
    on Linux security. These Web sites should be part of your daily morning Web-browsing
    routine. This appendix also identifies some mailing lists that focus on security
    information that you should subscribe to for regular updates.


    # Appendix B: PAM Module Reference


    Appendix B expands on the Pluggable Authentication Modules (PAM) discussion in
    Chapter 13 by providing detailed references to the most important PAM modules
    available for Linux.


    # Conventions


    This book uses the following typographical conventions:


    +   * \_Inline\_Program\_Font is used to identify the Linux commands, filenames,
    and domain names that lie within the body of the text.

    +   * *Program Font* is used in listings and examples.

    +   * **Bold** is used to indicate something that must be typed as shown. This
    might be user input in a listing, a recommended command line, or fixed values
    within the syntax of a command. For example, command syntax written as **key key\_id**
    means that the command key must be typed exactly as shown.

    +   * *Italic* is used in command syntax to indicate a variable for which you
    must provide the value. For example, command syntax written as key **key\_id**
    means that the variable name *key\_id* must not be typed as shown; you must prove
    your own value for *key\_id*.

    +   * Square brackets ( [ ] ) are used in a command’s syntax to indicate that
    the item enclosed in square brackets is optional. For example, 1s [–1] means that
    –1 is an optional part of the 1s command.

    +   * | is a vertical bar that indicates you need to choose one keyword or the
    other in a command’s syntax. For example, yes | no means choose either yes or
    no.'
  merge: -1
