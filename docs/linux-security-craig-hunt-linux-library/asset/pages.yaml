  md: 'Let’s see some examples of entries in the file /etc/pam.d/system-auth that
    illustrate the use of the pam_cracklib module. The following line takes all the
    defaults for pam_cracklib, but allows the user three attempts at providing a strong
    password:


    ```

    password required pam_cracklib.so retry=3

    ```


    The next example defines passwords to include at least 14 bytes, with extra credit
    of two bytes for digits and two bytes for others. The new password must include
    at least three bytes that are not present in the old password:


    ```

    password required pam_cracklib.so minlen=15 dcredit=2 ocredit=2

    difok=3

    ```


    # The pam_deny Module


    The pam_deny module always returns a negative authentication result to the application
    through the PAM framework. As such, it might be suitable for using for default
    entries to ensure a deny-all authentication stance.


    Entries in the /etc/pam.d/other file have the following format:


    ```

    module_type control_flag pam_deny.so

    ```


    This module takes no command-line arguments. For pam_deny, the module_type value
    can be one of the following:


    +   account

    +   auth (for authentication)

    +   password

    +   session


    The following lines are examples of the use of pam_deny in the /etc/pam.d/other
    file:


    ```

    auth required pam_deny.so

    account required pam_deny.so

    password required pam_deny.so

    session required pam_deny.so

    ```


    These four entries prevent the user from gaining access to the system via any
    applications that use PAM’s authentication, account, password, and session management
    groups.'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# # The pam_group Module


    The pam_group module assigns group membership based on the user’s name and the
    terminal that they are attempting to access, and it takes into account the time
    of day at which the request is made.


    The pam_group module does not provide user authentication. Instead, it grants
    group memberships to the user during the credential phase of the authentication
    module. Group memberships are based on the service the user is applying for. The
    group memberships are listed in text form in the /etc/security/group.conf file,
    which includes lines (rules) of the following format:


    *services ; ttys ; users ; times ; groups*


    These fields have the following meanings:


    +   - *services*: This field is a list of service names that are affected by this
    rule.

    +   - *ttys*: This field is a list of terminal names that indicates those terminals
    to be covered by the rule.

    +   - *users*: This field is a list of usernames to which this rule applies.

    +   - *times*: This field is a list of times to which this rule applies. The format
    of each element is a daytime range. The days are specified by a sequence of two-character
    entries. For example, MoTuSa indicates Monday, Tuesday, and Saturday. Note that
    repeated days unset each other; in other words, MoTuMo indicates Tuesday, and
    MoWk means all weekdays except Monday. The valid two-character combinations are:

    +       - Mo: Monday

    +       - Tu: Tuesday

    +       - We: Wednesday

    +       - Th: Thursday

    +       - Fr: Friday

    +       - Sa: Saturday

    +       - Su: Sunday

    +       - Wk: All weekdays

    +       - Wd: All weekend days (Saturday and Sunday)

    +       - A1: All seven days of the week


    The time range part of the *times* field is a pair of 24-hour times in the format
    *HHMM*, separated by a hyphen that indicates the start and finish times for the
    rule. If the finish time is smaller than the start time, it is assumed to apply
    on the following day.'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'For example, Mo1800-0300 indicates that the permitted times are Monday night
    from 6 P.M. to 3 A.M. the following morning.


    +   - groups: This field is a list of groups to which the user should be granted
    membership if the other four fields are found to match the request.


    Note that the pam_group module works in parallel with the standard Linux /etc/group
    file. If the user is granted membership to any groups based on the behavior of
    pam_group, they are granted in addition to those entries in /etc/group.


    The pam_group module takes no command-line arguments. The format of the /etc/pam.d/login
    file is as follows:


    ```

    account    control_flag    pam_group.so

    ```


    Consider the use of the pam_group module with the following entry in the /etc/pam.d/login
    file:


    ```

    account   required     pam_group.so

    ```


    Use the previous line with the following /etc/security/group.conf examples:


    +   - Running /bin/bash on ttyS0, the user operator acquires membership to groups
    wheel and privileged:


    ```

    /bin/bash ; ttyS0 ; operator ; * ; wheel, privileged

    ```


    +   - Running /bin/bash on ttyS*, any user acquires membership to the daystaff
    group, as long as the login is made between 9 A.M. and 6 P.M.:


    ```

    /bin/bash ; ttyS* ; * ; Wk0900-1800 ; daystaff

    ```


    # # The pam_limits Module


    The pam_limits module sets limits on the system resources that can be obtained
    in a user session. The pam_limits module restricts the resources granted to successfully
    authenticated users, according to the limits defined in the configuration file
    (typically the /etc/security/limits.conf file). This configuration file contains
    lines of the type:


    ```

    domain type item value

    ```


    These fields have the following meanings:


    +   - domain can be one of the following:

    +     - a username

    +     - a group name, with @group syntax

    +     - the wildcard *, for the default entry'
