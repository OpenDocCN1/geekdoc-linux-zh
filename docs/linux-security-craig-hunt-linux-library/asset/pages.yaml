    The next section of this chapter discusses the **sudo** utility, a useful tool
    to minimize the exposure of the root password to your Linux server.


    # The sudo Utility


    During the normal course of administering my Linux systems, I often go several
    weeks before actually logging on as the root user. In fact, there have been times
    when I have come close to forgetting the root password. The **sudo** utility affords
    me this luxury, and I recommend that you install this tool on every system that
    you administer. By allowing the system administrator to predefine root access
    for regular users, **sudo** can be used to execute commands with root privileges
    in lieu of actually logging in as root, and exposing the root password on the
    network. In general, the less often the root password is actually typed, the more
    secure it will be.


    # Installing sudo


    You can download sudo in both RPM and source format. I recommend that you use
    the RPM package system to install it, since the default compilation parameters
    are typically rational, and there is very little need for customization.


    Let''s start the installation by ensuring that **sudo** is not already present:


    ```

    `[root]# rpm -q sudo`

    ``sudo-1.5.9p4-1`

    ```


    In this case, you do have a previous installation of **sudo**, but it''s out of
    date, so delete it and install a more current version using the following commands:


    ```

    `[root]# rpm -e sudo`

    `[root]# rpm -i ./sudo-1.6.3p5-1rh62.1386.rpm`

    `[root]# rpm -q sudo`

    ``sudo-1.6.3p5-1`

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'You now have installed the sudo utility. Make sure you take a look through
    /usr/doc for the documentation that comes with the source package before you start
    using the tool.


    # The sudoers file


    As with any Linux utility, sudo comes with a configuration file where you can
    customize its operation. This file is in /etc/sudoers by default, and contains,
    among other things, the list of users who should be allowed to run the sudo command,
    along with the set of commands that each sudo user is allowed to execute.


    The general format used to add users to this file is as follows:


    ```

    userhost(s)=command(s)[run_as_user(s)]

    ```


    For example, if you’d like to grant user alice permission to run the shutdown
    command, you specify the following:


    ```

    alice ALL = /etc/shutdown

    ```


    Note that the ALL directive can be used as a wildcard for any fields in the sudoers
    file. Let’s consider another example where user bob is given access to all root
    commands, as any user:


    ```

    bob ALL = ALL

    ```


    And finally, let’s consider the case where you’d like user charlie to be allowed
    to run su to become user operator:


    ```

    charlie ALL = /bin/su operator

    ```


    > WARNING If you’re using sudo to grant a user root access to a limited set of
    commands, make sure that none of these commands allow an "escape" to a Linux shell,
    because that would give the user unrestricted root access to all system commands.
    Note that some Linux editors (e.g., vi) include this shell escape feature.


    # Using sudo


    The basic usage of the sudo command is as follows:


    ```

    sudo [command line options] [username] [command]

    ```


    Table 2.2 contains a summary of the most important sudo command-line options.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '**Table 2.2** sudo command-line options

    | Option | Parameter | Purpose |

    | :--- | :--- | :--- |

    | -v | N/A | Prints out the current version. |

    | -l | N/A | Lists the allowed and forbidden commands for this user. |

    | -h | N/A | Prints usage message. |

    | -b | N/A | Runs command in the background. |

    | -u | username | Runs the command as the specified username (default is root).
    |


    For example, to show the contents of the shadow password directory, simply use:


    sudo cat /etc/shadow


    To edit a file in a user''s directory preserving his or her permissions:


    sudo -u fred vi /export/home/fred/.forward


    I recommend that you use the sudo command strictly to log the root activity of
    users who are fully trusted to execute any root command on your Linux server (including
    yourself), rather than using it to allow certain users the execution of a small
    set of system utilities. It is relatively easy for a user to maliciously extend
    the privilege of a given command by executing an escape command to the root shell.


    The following section describes sudo''s logging features, as well as the format
    of the sudo log file.


    # The sudo.log file


    By default, sudo logs all its activity to the file /var/log/sudo.log. The format
    of entries into this file is as follows:


    date:user:HOST=hostname:TTY=terminal:PWD=dir:USER=user:COMMAND=cmd


    Each of these fields has the following meaning:


    +   * date: the timestamp of the log entry

    +   * user: the username that executed sudo

    +   * hostname: the host address on which the sudo command was executed

    +   * terminal: controlling terminal from which sudo was invoked

    +   * dir: current directory from which the command was invoked'
  merge: -1
  img_proc: true
