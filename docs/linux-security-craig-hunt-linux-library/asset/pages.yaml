- pgno: 3
  md: '# Foreword


    According to legend, security threats come from sophisticated code hackers who
    have a deep understanding of networks and operating systems. These legendary characters
    are motivated by a noble desire to force unresponsive computer corporations to
    improve their software. If this were true, Linux would not be a target for security
    attacks. After all, Linux is open-source code. No one can claim that a corporate
    monolith is keeping the code hidden. If these legendary characters were truly
    rebels against the corporate system working to improve the security of operating
    system software, they would be writing new Linux code. Unfortunately this is not
    true, and Linux is one of the most popular targets for attack.


    The reality of network attacks is both more sordid and more mundane than the mythology.
    Some attacks come from petty criminals out to steal credit card numbers. But most
    attacks come from unskilled people running canned attack scripts that are so simple
    to use they are called “kiddie scripts.”


    Clearly, open-source code is no deterrent. The people who run attack scripts are
    not motivated to “fix” the system; they are just looking for easy targets. Your
    job is to make sure that your system isn’t an easy target. Linux Security, by
    Ramón Fontanión, can help you do that job.


    Good security is a fundamental part of good system administration. Security is
    essential to running a reliable Linux system. Your computer will be attacked and
    compromised by people on the network. To reduce the number of successful attacks,
    limit the amount of damage done, and quickly recover from the attack, you need
    the right tools and the skills to use them. Linux Security shows you those tools
    and teaches you how to use them effectively.


    Craig Hunt


    March, 2001'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# ## Acknowledgments


    Back in June of 2000, Craig Hunt offered me the opportunity to write a book on
    Linux security. When I agreed to take on the project, I never imagined how much
    I would learn from this experience. Over the course of the last seven months,
    I’ve had the privilege to meet and work with a number of Sybex publishing professionals
    who took me under their wing from the start and helped me write a better Linux
    security book. I’d like to take this opportunity to thank each of them individually.


    As the editor for the Linux Library series, Craig Hunt is the one who made it
    all possible. His depth of knowledge in the TCP/IP and Linux arenas is simply
    humbling. I have learned from his dedication, tenacity, and especially from his
    relentless pursuit of perfection.


    Neil Edde, an associate publisher at Sybex, helped me draft a schedule that allowed
    me to shuffle book writing with the responsibilities of a full-time job. He patiently
    answered all my novice questions and offered the direction I needed to get this
    project underway.


    As the development editor, Tom Cirtin guided me through the initial chapters and
    helped me get the book in shape for its launch. He encouraged me when I felt overwhelmed
    and was always there for me when I needed his advice. He made the process much
    more bearable during the initial stages, which I found to be the most difficult.


    Jennifer Campbell was the production editor for this book. She helped me stay
    on schedule and always kept me informed of what was coming next. It was through
    her that I got to see the “light at the end of the tunnel.” Thanks Jennifer!


    The acquisitions editor for the Linux Library series is Maureen Adams. She made
    sure this book hit the bookstands on schedule while accommodating the need to
    extend interim deadlines to allow for late-breaking content to be added.


    Sarah Lemaire edited the final text and allowed me to concentrate on the book’s
    content by helping out with the format. Her edits were thorough and consistent,
    and her writing style significantly improved the flow of the material. This book
    is just as much hers as it is mine. I’d also like to thank Dale Good for editing
    the first two chapters of the book.


    Throughout the writing and editing process, I received assistance from Carl Montgomery,
    Dan Mummert, Kristine O’Callaghan, Senorita Bilbo-Brown and Tami Crady, most from
    Sybex headquarters in Alameda, CA. Thank you all for lending a hand!


    I could not have written this book without a number of people who influenced my
    life both on a personal level (Tom, Peggy, Dubie, T-Jay, Kerry, and Suzie Dailer,
    Art Mezerski, Dr. John Atkins, and Dr. Frank Hiergeist) as well as on a professional'
  merge: -1
