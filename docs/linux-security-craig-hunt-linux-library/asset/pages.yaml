    \ ; COMMAND=/usr/sbin/pwconv\n```\n```\n\n# **File and Directory Permissions**\n\
    \nPerhaps one of the most difficult aspects of Linux administration, file permissions\
    \ are a vital aspect of system security, and as such, an entire section of this\
    \ book is devoted to their discussion. Linux (like all Unix variants) treats most\
    \ resources as files, whether they’re directories, disk devices, pipes, or terminals.\
    \ While this makes for straightforward software architecture, it also introduces\
    \ a fundamental challenge to the Linux administrator charged with ensuring the\
    \ security of these resources.\n\nPermissions on files and directories have a\
    \ direct effect on the security of your system. Make the permissions too tight\
    \ and you limit users’ ability to get their work done. Make permissions too lax\
    \ and you invite unauthorized use of other users’ files and general system resources.\n\
    \nThe next subsection of this book examines the specifics of suid and sgid permissions\
    \ on the Linux operating system."
