    \ been correctly configured.\n\n# # Point-to-Point Tunneling Protocol (PPTP)\n\
    \nThe fact that IPsec is a standards-based framework developed under the auspices\
    \ of the IETF has made it the most widely implemented VPN technology to date.\
    \ In addition, since IPsec is a mandatory element of a standards-compliant IPv6\
