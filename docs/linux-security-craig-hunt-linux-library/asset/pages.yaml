    -rwxr-xr-x 1 root root 1912963 Jan 28 14:28 rlogin-gw

    -rwxr-xr-x 1 root root 1794972 Jan 28 14:28 smap

    -rwxr-xr-x 1 root root 1697757 Jan 28 14:28 snapd

    -rwxr-xr-x 1 root root 1944219 Jan 28 14:28 tn-gw

    -rwxr-xr-x 1 root root 217794 Jan 28 14:28 x-gw

    ```


    The FTWK developers subscribed to the *divide-and-conquer* approach to security
    soft-ware design. Instead of creating a single monolithic tool, they developed
    separate packages that work independently and provide separate services (e.g.,
    FTP, Telnet, and HTTP). The advantage of this choice at a vulnerability is only
    likely to affect one of the packages, and therefore will only comprise a single
    service service running on your Linux system. This makes each FTWK component straightforward
    enough to be understood completely by the system administrator, and it even makes
    it possible for you to read the component’s source code to verify its integrity
    and correctness, if necessary. Each of these applications will be discussed later
    in this chapter. For now, simply make sure that these files are present in the
    /usr/local/etc directory.


    The next section of this chapter guides you through the process of preparing your
    system to act as an application layer firewall, and configuring the FTWK environment
    to provide the proxy service through your Linux server. The first step in that
    process is to understand the FTWK architectures.


    # FTWK Architectures


    Deploying a successful application level proxy firewall starts by designing the
    overall architecture of your network and deciding where to place the firewall.
    This is just as important as placing a network layer firewall at the appropriate
    location of your network. Let’s examine two popular options for deploying FTWK
    on a Linux server: single-homed proxy firewalls and dual-homed proxy firewalls.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# **Single-Homed Proxy Firewalls**


    If you are deploying an application layer firewall in addition to a network layer
    firewall device (for example, a Netfilter Linux firewall or a router with access
    control lists), use the FWTk proxy server as a bastion host on the DMZ segment
    of your network firewall, as illustrated in Figure 11.2.


    # **Figure 11.2**   Single-homed FWTk architecture


    ![](img/3258bbaf790525f8c4eb25fabff7844a_338_0.png)


    To use this architecture, make sure that your proxies are configured to accept
    internal proxy requests on the same Ethernet interface that you''ll be using to
    forward them on to the Internet. Don''t worry that using a single interface might
    make your server vulnerable to address spoofing; the network layer firewall handles
    the address filtering.


    # **Dual-Homed Proxy Firewall**


    If the application layer firewall will be your only method of controlling access
    to your network, I recommend that you make the FWTk proxy server the only point
    of entry to your internal network from the public Internet. This can be accomplished
    by deploying a dual-homed proxy firewall, with one interface on your internal
    network and another interface on the same segment as the downstream interface
    of your Internet access router, as illustrated in Figure 11.3.


    # **Figure 11.3**   Dual-homed FWTk architecture


    ![](img/3258bbaf790525f8c4eb25fabff7844a_338_1.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: "The dual-homed proxy firewall configuration has the advantage that the hosts\
    \ on your internal network do not have to use legal IP addresses as long as you\
    \ don’t plan to do any network layer routing between the two interfaces of your\
    \ firewall (which I strongly discourage).\n\nAfter selecting the architecture\
    \ of the FWTK, it’s time to configure the components that enforce your security\
    \ policy and protect the resources of your internal network. This is the topic\
    \ of the next section.\n\n# ## Configuring the FWTK Firewall Toolkit\n\nThe fundamental\
    \ difference between a network layer firewall (as discussed in Chapter 9, “Network\
    \ Layer Firewalls”) and an application layer firewall is the method used to forward\
    \ packets between the internal and the external interfaces. While a network layer\
    \ firewall relies on the kernel to make forwarding decisions at the IP layer,\
    \ an application layer firewall relies on proxies at the application stack to\
    \ bridge networks that are often not even directly routable.\n\nTo enhance the\
    \ overall security stance of your proxy server, make sure you disable all IP forwarding\
    \ on its kernel. This will keep any traffic from *leaking* through the proxy server\
    \ at the network layer. To make sure of this, you need to issue the following\
    \ command to disable IP forwarding by setting the `ip_forward` switch to `false`:\n\
    \n```\n```text\n    echo 0 > /proc/sys/net/ipv4/ip_forward\n```\n```\n\nThis command\
    \ needs to be executed every time the system comes up. To make sure of this, I\
    \ recommend that you add the preceding line to `/etc/rc.d/rc.local`.\n\nIn addition,\
    \ make sure that your server is not listening for any connections other than the\
    \ ones allowed by your security policy. Use your application layer firewall exclusively\
    \ to proxy internal connections to the public network (e.g., the Internet). Once\
    \ you have disabled all extraneous services on this server, issue the `netstat`\
    \ command to see what services it is still listening for:\n\n```\n```text\n[ramon]$\
    \ netstat --inet -a | grep LISTEN\ntcp 0 0 *:ssh *:  LISTEN\n```\n```\n\nThis\
    \ sample output (I used `grep` to filter it to only show connections in the LISTEN\
    \ state) shows that only Secure Shell (SSH) connections are being allowed into\
    \ the proxy server. (SSH is discussed in the next Chapter 12, “Virtual Private\
    \ Networking.”)\n\n> **NOTE** I strongly discourage you from maintaining user\
    \ accounts on the FWTK firewall server. The smaller your password file, the less\
    \ vulnerable you are to intruders."
  merge: -1
  img_proc: true
- pgno: 340
  md: "With forwarding disabled and listening services cut to the bare minimum, it\
    \ is time to configure FTWK. The FTWK configuration is located in a central file\
    \ named /usr/local/etc/netperm-table. This file contains two distinct types of\
    \ rules:\n\n+   * NetACL rules, which control which clients have access to which\
    \ proxy services\n+   * Gateway rules, which specify a variety of configuration\
    \ parameters particular to each of the proxy services provided in FTWK\n\n# NetACL\
    \ Rules\n\nRather than a proxy per se, NetACL is a supporting tool for other FTWK\
    \ services. Similar in function to TCP Wrappers (discussed in Chapter 4, \"Network\
    \ Services Configuration\"), NetACL provides access control and logging to TCP\
    \ services based on the characteristics of the client requesting the connection.\
    \ But the real power of NetACL is its ability to select different responding applications\
    \ according to the identity of the requesting client. For example, you may want\
    \ to configure your firewall such that whenever your workstation requests a service\
    \ on port 23, you get the regular telnet daemon on the server (telnetd). However,\
    \ whenever a regular user requests the same service, you want them to get the\
    \ FTWK-provided telnet proxy application (tn-gw) instead. Start by inserting the\
    \ lines in Listing 11.3 into the /etc/xinetd.d/telnet file.\n\n# Listing 11.3\
    \  \\textit{xinetd configuration for telnet}\n\n```\nservice telnet\n{\n     \
    \   flags           = REUSE\n        socket_type     = stream\n        wait  \
    \          = no\n        user            = root\n        server          = /usr/local/etc/netacl\n\
    \        server_args     = in.telnetd\n        log_on_failure  ++ USERID\n   \
    \     disable         = no\n}\n```\n\nInsert the line in Listing 11.4 into the\
    \ inetd configuration file, /etc/inetd.conf.\n\n# Listing 11.4  \\textit{inetd\
    \ configuration for telnet}\n\n```\ntelnet    stream    tcp     nowait    root\
    \    /usr/local/etc/netacl   netacl  in.telnetd\n```"
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Note that instead of invoking the daemon directly with the `server` directive,
    you invoke `/usr/local/etc/netacl` and pass the daemon name (`in.telnetd`) as
    a server argument. Don’t forget to restart `xinetd` by issuing the command:

    ```bash

    [ramon]$ sudo /etc/rc.d/xinetd restart

    ```


    or its inetd equivalents:


    ```

    ```bash

    [ramon]$ ps aux | grep inetd

    root   466  0.0  0.0  1348   0 ?  SW Mar17  0:00 [inetd]

    [ramon]$ sudo kill -HUP 466

    ```

    ```


    You then add the appropriate configuration to the `/usr/local/etc/netperm-table`
    file, according to the format


    ```

    ```text

    netacl-daemon: [permit-hosts|deny-hosts] host-description [-exec &command]

    ```

    ```


    where `daemon` is the name of the server executable specified under `server_args`
    (see Listing 11.3), `host-description` is one or more IP addresses (or networks)
    and `command` is the full path to the server executable. Listing 11.5 contains
    an excerpt from the `/usr/local/etc/netperm-table` file that illustrates a sample
    NetACL configuration for the telnet service.


    # ### Listing 11.5 Defining NetACL rules in the netperm-table


    ```

    ```text

    netacl-in.telnetd: permit-hosts 127.0.0.1 -exec /usr/sbin/in.telnetd

    netacl-in.telnetd: permit-hosts 10.0.0.50 -exec /usr/sbin/in.telnetd

    netacl-in.telnetd: permit-hosts 10.0.0.* -exec /usr/local/etc/tn-gw

    netacl-in.telnetd: deny-hosts *

    ```

    ```


    The configuration in Listing 11.5 specifies that whenever the firewall receives
    a connection to port TCP 23 (telnet), it should examine the IP address of the
    connecting client. If the host trying to connect is the local host (127.0.0.1)
    or your workstation’s IP address (10.0.0.50), you should see a regular telnet
    response (from the normal daemon). All other clients in your 10.0.0.* class-C
    network should be directed to the FWTK telnet proxy instead (tn-gw). Any other
    hosts (the ones matching the `host-description` *) will be denied service. `tn-gw`
    and other gateway proxies are discussed in the next section.


    # ## Gateway Rules


    In addition to the NetACL utility, the FWTK includes a number of specialized application
    layer proxies that are installed as separate executables in the `/usr/local/etc`
    directory. These include the following proxies:


    +   *   `tn-gw`: the Telnet proxy for handling interactive terminal connections'
  merge: -1
  img_proc: true
- pgno: 342
  md: "+   - ftp-gw: the FTP proxy for handling File Transfer Protocol connections\n\
    \n+   - http-gw: the HTTP proxy for handling HTTP connections to a Web server\n\
    \n+   - pl ug-gw: a generic proxy that can be configured to handle any type of\
    \ transport layer connection\n\n+   - smap: an SMTP proxy for handling Internet\
    \ mail server connections\n\nLet’s take a closer look at the rules that are available\
    \ for each of these application layer proxies.\n\n# tn-gw: Telnet Proxy\n\nThe\
    \ previous section described the NetACL rules and used telnet as an example to\
    \ illustrate its operation. The FWTK telnet proxy is located by default in /usr/local/etc/tn-gw.\n\
    \nYou’ll need to configure your xinetd or inetsd service to use the tn-gw proxy\
    \ instead of the native telnet service. If your server uses xinetd, create a file\
    \ called /etc/xinetd.d/telnet with the contents shown in Listing 11.6.\n\n# Listing\
    \ 11.6  xinetd configuration for telnet\n\n```\nservice telnet\n{\n    flags \
    \        = REUSE\n    socket_type   = stream\n    wait          = no\n    user\
    \          = root\n    server        = /usr/local/etc/tn-gw\n    log_on_failure\
    \  ++ USERID\n    disable       = no\n}\n```\n\nIf you use inetsd, add the line\
    \ shown in Listing 11.7 to the /etc/inetsd.conf file.\n\n# Listing 11.7  inetsd\
    \ configuration for telnet\n\n```\ntelnet stream tcp nowait root /usr/local/etc/tn-gw\
    \ tn-gw\n```\n\nThe basic operation of the telnet proxy is as follows:\n\n+  \
    \ 1. The user is instructed, perhaps in your security policy, to connect via telnet\
    \ to the private interface (or the only interface) of the proxy firewall instead\
    \ of the target system."
  merge: -1
  img_proc: true
- pgno: 343
  md: "+   2. The user gets the following prompt (subject to access control and authentication):\n\
    +   \n+   `[ramon]$ telnet fwtK-internal.example.com`\n+   `Trying 10.0.0.2...`\n\
    +   `Connected to fwtK-internal.`\n+   `Escape character is '^]'.`\n+   `Welcome\
    \ to the TIS Firewall Toolkit TELNET Proxy!`\n+   `tn-gw->`\n\n+   3. The user\
    \ types the external `telnet` command at the prompt:\n+   \n+   `tn-gw-> connect\
    \ anyhost.anydomain.com`\n+   `Trying 203.204.205.206 port 23...`\n+   `Connected\
    \ to anyhost.anydomain.com.`\n+   `Escape character is '^]'.`\n+   `Red Hat Linux\
    \ release 7.0 (Guinness)`\n+   `Kernel 2.2.16-22 on an i686`\n+   `login:`\n\n\
    +   4. The user continues with the proxied connection until the remote escape\
    \ command is entered. At that point, the connections to both the remote system\
    \ and the proxy servers are torn down.\n\nIn addition to configuring NetACL, the\
    \ `/usr/local/etc/netperm-table` file can also be used to control the behavior\
    \ of the FWTK telnet proxy. There are several `/usr/local/etc/netperm-table` configuration\
    \ arguments for the telnet proxy that you should be aware of. The general format\
    \ for this proxy in the configuration file is `tn-gw: attribute-group`\n\nwhere\
    \ `attribute-group` can have one of the following formats:\n\n+   `authserver\
    \ host port`  This format specifies a host and port running an authentication\
    \ server. The configuration of the authentication server is covered in the \"\
    Using Strong Authentication with FWTk\" section later in this chapter.\n\n+  \
    \ `denial-msg file`  This format specifies a file that contains a text message\
    \ to be displayed when the user does not have the necessary permissions to use\
    \ the proxy.\n\n+   `help-msg file`  This format specifies a file that contains\
    \ a text message to be displayed when the user requests help from the proxy.\n\
    \n+   `welcome-msg file`  This format specifies a file that contains a text message\
    \ to be displayed when the user successfully logs on to the proxy."
  merge: -1
  img_proc: true
- pgno: 344
  md: "denydest-msg file This format specifies a file that contains a text message\
    \ to be displayed when the user is not allowed to connect to the requested destination.\n\
    \ndirectory directory This format specifies the directory to which to change the\
    \ default root (chroot) before executing the proxy command.\n\nuserid user This\
    \ format specifies the user ID under which the proxy should run.\n\ngroupid group\
    \ This format specifies the group ID under which the proxy should run.\n\nprompt\
    \ prompt This format specifies the prompt to be used by the proxy.\n\ntimeout\
    \ seconds This format specifies the idle time (in seconds) after which the proxy\
    \ terminates the connection.\n\npermit-hosts host-description [-dest-host-description]\
    \ [-auth][-passok] This format specifies the hosts that are allowed to use the\
    \ proxy (host-description), along with the destinations that they're allowed to\
    \ proxy to (-dest-host-description), whether they should provide authsrv authentication\
    \ (-auth) to be granted use of the proxy, and whether they should be permitted\
    \ to change their passwords (-passok). authsrv authentication is discussed in\
    \ detail later in this chapter.\n\ndeny-hosts host-description This format specifies\
    \ the hosts that are not allowed to use the proxy.\n\nFor example, consider the\
    \ portion of tn-gw configuration shown in Listing 11.8. This example performs\
    \ several important steps:\n\n+   Specifies files containing text for denial,\
    \ welcome, and help messages.\n+   Requests that the connections be terminated\
    \ after 10 minutes of idle time.\n+   Allows proxy connections from clients in\
    \ the 10.0.0.0/24 network, but only those destined for the 63.64.65.0/24 network.\n\
    +   Disallows proxy requests coming from any other hosts.\n\n# Listing 11.8 Defining\
    \ tn-gw rules in the netperm-table\n\n```\ntn-gw: deny-msg        /usr/local/etc/tn-deny.txt\n\
    \ tn-gw: welcome-msg     /usr/local/etc/tn-welcome.txt\n tn-gw: help-msg     \
    \   /usr/local/etc/tn-help.txt\n tn-gw: timeout         600\n tn-gw: permit-hosts\
    \    10.0.0.* -dest 63.64.65.*\n tn-gw: deny-hosts      *\n```\n\nNote that Listing\
    \ 11.8 contains a specialized version of the deny-hosts attribute group:\n\n```\n\
    tn-gw: deny-hosts unknown\n```\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_344_0.png)"
  merge: -1
  img_proc: true
- pgno: 345
  md: "This attribute forces the proxy to perform a reverse DNS lookup on the IP address\
    \ of the client to look for a valid host name (a PTR record, in DNS lingo). If\
    \ no such binding exists, the connection is denied.\n\n# ftp-gw: FTP Proxy\n\n\
    The ftp-gw FTP proxy works much the same way as tn-gw. Let’s start by instructing\
    \ your xinetd or inetd service to use ftp-gw instead of the native FTP service.\
    \ If your server is using xinetd, do this by creating a file called /etc/xinetd.d/ftp\
    \ with the contents shown in Listing 11.9.\n\n# Listing 11.9 xinetd configuration\
    \ for FTP\n\n```\nservice ftp\n    {\n        flags           = REUSE\n      \
    \  socket_type     = stream\n        wait            = no\n        user      \
    \      = root\n        server          = /usr/local/etc/ftp-gw\n        log_on_failure\
    \  += USERID\n        disable         = no\n    }\n```\n\nIf you use inetd, add\
    \ the line shown in Listing 11.10 to the etc/ inetd.conf file.\n\n# Listing 11.10\
    \ inetd configuration for FTP\n\n```\nftp stream tcp nowait root /usr/local/etc/ftp-gw\
    \ ftp-gw\n```\n\nHere is how the FTP proxy works:\n\n+   1.  The user is instructed,\
    \ perhaps by your security policy, to point their FTP client to the private interface\
    \ (or the only interface) of the proxy firewall, instead of the target system.\
    \ In order to establish a connection to a public FTP server (such as ftp.sybex.com,\
    \ for example), the user starts by entering the following (assuming that fwtvk-internal.example.com\
    \ is the host name corresponding to your proxy firewall’s private interface):\n\
    \n```\n[ramon]$ ftp fwtvk-internal.example.com\nConnected to fwtvk-internal.\n\
    220 fwtvk-internal.example.com FTP proxy (Version V2.1) ready.\n```"
  merge: -1
  img_proc: true
- pgno: 346
  md: '+   Name (fwtk-internal:ramon):


    +   The user provides the FTP proxy with the username and remote host name that
    they wish to FTP to. Note the `user@remote-hostname` format in the following response:


    ```

    Name (fwtk-internal:ramon): `anonymous@ftp.sybex.com`


    ```

    331-(---GATEWAY CONNECTED TO ftp.sybex.com---)

    331-(220- kermit WAR-FTPD 1.67-04 Ready)

    331-(220 Please enter your user name.)

    331 User name okay. Give your full Email address as password.

    Password:

    230 User logged in, proceed.

    ftp>

    ```

    ```


    +   The user continues with the proxied connection until the remote escape command
    is entered (e.g., `bye` on FTP). At that point, the connections to both the remote
    system and the proxy servers are torn down.


    The `/usr/local/etc/netperm-table` configuration arguments for the FTP proxy are
    very similar to their Telnet equivalents:


    ```

    ```

    ftp-gw: attribute-group

    ```

    ```


    In this format, the `attribute-group` can be any of the constructs used for `tn-gw`
    (see the previous section), except for the following:


    ```

    ```

    permit-hosts host-description [-dest host-description] [-auth

    (operation1 operation2..)] [-authall] [-log [operation1 operation2..]]

    ```

    ```


    This format specifies the hosts that are allowed to use the proxy (`host-description`),
    along with the destinations that they’re allowed to proxy to (`-dest host-description`),
    and whether they should provide authsrv authentication (`-auth`) for specific
    types of FTP operations, for example, retrieving a file (RETR) or uploading a
    file (STOR). The `-authall` attribute forces proxy users to authenticate themselves
    for all FTP operations.


    In addition, you can direct `ftp-gw` to log to `syslog` all attempts to perform
    any types of operations supported by the FTP protocol (e.g., `RETR`, `STOR`, etc.).


    For example, consider the `/usr/local/etc/netperm-table` configuration in Listing
    11.11. This example specifies a 10-minute idle timeout for proxied FTP connections
    and allows the 10.0.0.0/24 block to initiate FTP connections. You will log via
    the local `syslog` facility all attempts to retrieve and store a file on the remote
    FTP server.'
  merge: -1
  img_proc: true
- pgno: 347
  md: "+   **Listing 11.11** Defining ftp-gw rules in the netperm-table\n+   ```text\n\
    +   ftp-gw:  timeout 600\n+   ftp-gw:  permit-hosts 10.0.0.* -log { RETR STOR\
    \ }\n+   ```\n\n> **TIP** The RLOGIN proxy server (rlogin-gw) functions in a way\
    \ that is virtually identical to the telnet gateway (tn-gw). However, I recommend\
    \ that you avoid using the RLOGIN proxy server because fewer and fewer remote\
    \ systems support this protocol and it is difficult to secure. For this reason,\
    \ it is not covered in detail in this book.\n\n# http-gw: HTTP Proxy\n\nThe http-gw\
    \ proxy can be used to relay HTTP requests from internal Web browsers to a Web\
    \ server on the public network. You will need to modify your inetd (or xinetd)\
    \ configuration to ensure that an http-gw session is started when a connection\
    \ request is received on port 80 of the firewall. If your server is using xinetd,\
    \ do this by creating a file called /etc/xinetd.d/http with the contents shown\
    \ in Listing 11.12.\n\n```\n**Listing 11.12** xinetd configuration for HTTP\n\
    ```text\nservice http\n{\n       flags           = REUSE\n       socket_type \
    \    = stream\n       wait            = no\n       user            = root\n  \
    \     server          = /usr/local/etc/http-gw\n       log_on_failure  += USERID\n\
    \       disable         = no\n}\n```\n```\n\nIf you use inetd, add the line shown\
    \ in Listing 11.13 to the /etc/inetd.conf file.\n\n```\n**Listing 11.13** inetd\
    \ configuration for HTTP\n```text\nhttp stream tcp nowait root /usr/local/etc/http-gw\
    \ http-gw\n```\n```\n\nUpon restarting inetd (or xinetd), your firewall will start\
    \ accepting HTTP requests on behalf of your internal clients. Figure 11.4 shows\
    \ the HTTP Proxy configuration on Netscape Communicator. Figure 11.5 shows how\
    \ to configure an HTTP Proxy on Microsoft Internet Explorer.\n\nIn these two examples,\
    \ you are instructing the browser to proxy incoming HTTP connections to port 80\
    \ of fwtk-internal.example.com, the host name that corresponds to the"
  merge: -1
  img_proc: true
- pgno: 348
  md: 'internal (private) interface of the F TWK proxy server. Note that you’ve entered
    the `internal`, `com` domain in the **Exceptions** box. This instructs the browser
    not to use this proxy for connections to hosts whose names end in `internal.com`.
    The assumption is that these are internal hosts that do not need to be **scrutinized**
    by the proxy server.


