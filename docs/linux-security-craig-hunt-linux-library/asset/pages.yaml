- pgno: 264
  md: 'which is central to the way a Linux firewall goes about protecting your perimeter
    at the network layer.


    # ## Packet Filtering


    The basic steps of packet filtering are as follows:


    +   1. A packet arrives in one of the interfaces.

    +   2. After the interface strips out its data link layer header, it passes the
    network layer payload to the kernel.

    +   3. The kernel inspects the packet’s header (IP address, port) and decides
    to drop it or forward it based on a set of rules that it knows about. This operation
    can take place in near real time and is totally transparent to the end user.


    Packet filtering is not exclusive to firewalls since any Linux host can be configured
    to perform it, but it is most useful for building a perimeter control device (i.e.,
    a firewall). A Linux server can be configured to act as a cost-effective firewall
    using the latest kernel’s packet-filtering support. In fact, even an average machine
    (an entry-level Pentium with 48MB of RAM and a very small disk) has been shown
    to be more than adequate to keep up with Ethernet speeds while performing packet
    filtering and address translation.


    The main advantage of packet filtering is that it is an efficient and non-intrusive
    way of adding security to your network. Unlike proxy-level firewalls (discussed
    in Chapter 10), and application layer firewalls (discussed in Chapter 11), users
    don’t need to be aware of the packet-filtering firewall, and they don’t need to
    authenticate themselves to use any outgoing services.


    One important drawback of packet filtering is its inability to provide secure
    access to remote users that receive their addresses dynamically (using dial-up
    accounts via bootp or DHCP). A second drawback is the lack of user-level authentication
    authorization, especially when a remote host houses a number of users.


    However, the most successful approach to security is a multi-layered one, and
    packet filtering should play a critical role in the overall defense of your network.
    The next section explains the concept of network address translation (NAT), which
    is often used in conjunction with packet filtering in most Linux firewalls.


    # ## The Legacy: *ipfwadm* and *ipchains*


    Starting with kernel version 1.2.1, Linux has offered a number of utilities to
    configure the rules used by the kernel to accept or discard IP packets. The first
    incarnation of this utility was Alan Cox and Jos Vos’ *ipfwadm* utility, which
    was based on BSD’s *ipfw* utility and'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'worked with kernel versions 1.2 through 2.1. The last version of ipfwadm was
    released in July 1996. Starting with kernel version 2.1.102 and later, ipfwadm
    has been replaced by Paul “Rusty” Russell and Michael Neuling’s iptchains, which
    addresses some of ipfwadm’s limitations, namely:


    +   • 32-bit counters, which were previously unable to keep track of packets coming
    into high-speed network interfaces

    +   • Inability to deal adequately with IP fragmentation

    +   • No support for transport layer protocols other than UDP and TCP

    +   • No support for inverse rules, where you look for the opposite of a condition
    (e.g., -i ! eth0).


    If your Linux distribution only supports ipfwadm, you are running an old system
    and you should upgrade to a newer version. Most recent Linux vendors include the
    iptchains utility in their standard distribution. The next section explains how
    to use the iptchains command and includes some real-life examples of how you can
    use it to build a network layer firewall.


    # ## Using iptchains


    The name iptchains refers to the fact that the Linux kernel consults three separate
    chains, or sequence of rules, when it receives a network layer packet. There are
    three chains that come built-in with the Linux kernel:


    +   • **Input Chain** The input chain handles packets that arrive at one of the
    server’s interfaces and are bound for the local host.

    +   • **Output Chain** The output chain handles packets that are originated by
    the local system and are bound for a remote host.

    +   • **Forward Chain** The forward chain handles packets that arrive at one of
    the server’s interfaces and are bound for a remote host.


    Each of these three chains can contain a set of rules that define access controls
    based on the source/destination address, the TCP/UDP port, or the protocol ID.
    By specifying a set of rules that enforce the provisions of your security policy,
    you can build a firewall device using the Linux kernel as the underlying system
    and iptchains as your configuration tool. Let’s take a look at the syntax of the
    iptchains command.


    The iptchains utility uses the following syntax:


    ```

    ```

    iptchains command chain rule-specifications [options] -j action

    ```

    ```


    The command field is used to maintain the list of rules for a given chain and
    defines, for example, whether you’re adding a rule, deleting a rule, or simply
    listing the rules that have already been defined for that chain. Table 9.1 contains
    a list of valid commands supported in iptchains.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# **Table 9.1** *ipchains Commands*


    | Switch | Meaning |

    |---|---|

    | -A | Add a rule to a chain (append to end of the chain). |

    | -D | Delete a rule from a chain. |

    | -C | Create a new chain. |

    | -R | Replace an existing rule in the chain. |

    | -L | List all rules in the chain. |

    | -I | Insert numbered rules in the chain. |

    | -F | Flush all rules from the chain (empty the chain). |

    | -Z | Zero (reset) the packet and byte counters on all chains. |

    | -N | Create a new chain. |

    | -X | Delete the user-defined chain. |

    | -P | Set policy for the chain to the given target. |

    | -E | Rename the chain. |

    | -M | View currently masqueraded connections. |

    | -C | Check a given packet against a selected chain. |

    | -S | Change the timeout values used for masquerading. |


    The *chain* field can be one of **INPUT**, **OUTPUT**, or **FORWARD**, or it can
    be a user-created chain (in the case of the -C command). You’ll learn more about
    user-created chains later in this section.


    The *rule-specifications* field is where you can specify one or more rules to
    be applied to each packet. Each incoming packet is compared to the parameters
    included in each'
