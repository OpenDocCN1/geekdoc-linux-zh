- pgno: 156
  md: '# **Figure 5.8**

    Viewing an HTML Nessus report


    ![](img/3258bbaf790525f8c4eb25fabff7844a_156_0.png)


    Alternatively, you can get more information about each of the vulnerabilities
    found by Nessus by expanding on each of the lines under the Summary section on
    the left-hand side of the screen (see Figure 5.9).


    Look at the report in Figure 5.9. In this example, Nessus has identified a problem
    with the FTP server on the target machine in which an intruder could cause a buffer
    overflow, leading to the execution of arbitrary code on the server. In addition,
    Nessus has identified another associated vulnerability whereby the intruder could
    use a dump core on the FTP server to write portions of the /etc/shadow file on
