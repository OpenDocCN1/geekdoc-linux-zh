- pgno: 58
  md: '# # Building a Secure Kernel


    While most Linux users are content to run the standard kernel provided in the
    latest distribution, you''ll need to become familiar with the process of downloading
    the kernel sources, modifying their configuration, and building a custom kernel.
    The advantages of building a custom kernel are twofold: You''re specifying the
    security options that you want, and you are also building a lean kernel, compiling
    only the driver support that you need. Another benefit to compiling your own kernel
    is that you know where it is in and can see any security holes that may need to
    be addressed in the future or immediately (if the holes are big enough). In addition,
    the solution to many security vulnerabilities comes in the form of a patch to
    be applied to the Linux kernel, which requires you to recompile the kernel.


    The first step in building a custom kernel is to obtain the kernel sources. If
    you''re using Red Hat, you need both the kernel-headers and kernel-source RPM
    packages. To install either of those packages, use one of the following commands:


    ```

    ```

    [root]# rpm -q kernel-headers

    kernel-headers-2.2.12-20

    [root]# rpm -q kernel-source

    kernel-source-2.2.12-20

    ```

    ```


    These two packages populate the /usr/src/linux directory, which should contain
    all the source and configuration files necessary to compile the Linux kernel from
    scratch.


    > > **TIP** Before you install your new kernel, create an emergency boot disk
    in case the new kernel has problems booting. On Red Hat, use the command: mkbootdisk
    --device /dev/fd0 2.2.12-20 (assuming that your system modules directory is /lib/modules/2.2.12-20).


    Logged on as root, go to the Linux source directory and clean up any lingering
    configurations from previous kernel builds using the following commands:


    ```

    ```

    [root]# cd /usr/local/linux

    [root]# make mrproper

    ```

    ```


    At this point, you''re ready to specify the options that you''d like to build
    into the kernel using this command:


    ```

    ```

    [root]# make config

    ```

    ```


    This command prompts you for a series of options that you can choose to add to
    your kernel (Y), leave out (N), or add as a dynamically loaded module (M). Table
    2.1 shows'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'the 2.2.X kernel options that have security implications, and should be set
    to the appropriate value during the *make config* step.


    Table 2.1 Kernel Configuration: Recommended Security Options


    | Configure Option | Description | Recommendation |

    | :--- | :--- | :--- |

    | CONFIG_PACKET | Protocol used by applications to communicate with network devices
    without a need for an intermediate kernel protocol | Y |

    | CONFIG_NETLINK | Two-way communication between the kernel and user processes
    | Y |

    | CONFIG_FIREWALL | Firewalling support | Y |

    | CONFIG_INET | Internet (TCP/IP) protocols | Y |

    | CONFIG_IP_FIREWALL | IP packet-filtering support | Y |

    | CONFIG_SYN_COOKIES | Protection against synflooding denial of service attacks
    | Y |

    | CONFIG_NET_IP | IP inside IP encapsulation | N |

    | CONFIG_IP_ROUTER | IP routing | N |

    | CONFIG_IP_FORWARD | IP packet forwarding (routing) | N |

    | CONFIG_IP_MULTICAST | IP Multicast (transmission of one data stream for multiple
    destinations) | N |


    > **NOTE** These are the recommended settings for a typical Linux single-homed
    server. Later on in this book, you''ll learn about the concept of Linux firewalls,
    which are typically multi-homed and often require a different kernel configuration.
    We will discuss these special systems, including their kernel configurations in
    Part 4 of this book, "Perimeter Security."'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The CONFIG_SYN_COOKIES option prevents the kernel from entering a deadlock
    state whenever its incoming connection buffers are filled with half-open TCP connections.
    Note that in the 2.2.X kernels, setting CONFIG_SYN_COOKIES simply enables the
    option, but does not actually activate it. You must enter the following to activate
    SYN\_COOKIES support:


    ```

    echo 1 > /proc/sys/net/ipv4/tcp\_syncookies

    ```


    The CONFIG\_IP\_ROUTER and CONFIG\_IP\_FORWARD options allow a multi-homed Linux
    server to forward packets from one interface to another. This option should be
    disabled because there is a possibility that an intruder could use your Linux
    server as a router, circumventing the normal path of entry into your network (the
    one you are policing).


    The final step before actually compiling the kernel sources is to build a list
    of dependencies using this command:


    ```

    make dep

    ```


    Now you’re ready to compile your new kernel. Execute the following command to
    compile and link a compressed kernel image:


    ```

    make zImage

    ```


    If you have chosen loadable module support during the make config step above,
    you’ll also need to execute the following commands:


    ```

    make modules

    make modules_install

    ```


    To boot the new kernel, you must first move it from the source directory to its
    final destination. Make a backup of the old image first using these commands:


    ```

    cp /zImage /zImage.BACKUP

    mv /usr/src/linux/arch/i386/boot/zImage /zImage

    /sbin/lilo

    ```


    Re-run lilo every time you update the kernel image on your hard drive. In addition,
    it is a good idea to create a separate lilo.conf entry for your backup kernel
    (/zImage.BACKUP), even though you have an emergency boot diskette, because planning
    for disasters is an important part of security. When you are updating your version
    of Linux, it is always good to be able to go back to the old version if the newer
    one does not work as it should. See *Linux Network Servers 24seven* by Craig Hunt
    (Sybase, 1999) if you need more information about lilo and lilo.conf.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'You should now restart your system to make sure that you can boot the new kernel.
    Don’t forget to have your emergency boot disk close by in case there are problems.


    > **WARNING** Be prepared for the worst, because if you aren’t prepared, the worst
    is going to happen to you.


    # # User Account Security


    The CSI/FBI Computer Crime and Security Survey (http://www.goc51.com/prelea\_000321.htm)
    shows, year after year, that the overwhelming majority of successful system attacks
    come from insiders—that is, disgruntled (or just bored) nonprivileged users who
    manage to gain root authority through subversive means. Even when the attack comes
    from the outside, seizing a misconfigured or stagnant user account is one of the
    easiest ways to crack access to root. It’s also important to protect against your
    own mistakes, since root access can be a powerful and dangerous tool, even in
    the proper hands.


    You should pay special attention to the part of your security policy that regulates
    the creation and maintenance of user accounts. Here is my recommended set of considerations
    for managing your Linux server accounts:


    +   1.  **Disable inactive accounts.** Attackers look for accounts that have not
    been accessed for awhile in order to seize them for their nefarious ends. This
    gives attackers the luxury of being able to “squat” the account and hide their
    exploits without being noticed or reported. Most Linux distributions allow you
    to specify the conditions under which an account should be disabled. I recommend
    that you disable all accounts as soon as the password expires (more on password
    expiration later), while allowing users a week to change their passwords before
    they expire. Red Hat’s `1nuxconf` provides a graphical interface to specify this
    policy (see Figure 2.5). I usually set passwords to expire every 4 months (120
    days), and allow users 7 days to change their passwords. The 0 value under Account
    Expire After # Days simply directs the system to disable the account if the password
    expires. The default value of −1 directs the system never to cause the account
    to expire, so make sure you change this default.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '**Figure 2.5** Setting user account expiration parameters with *linuxconf*


    ![](img/3258bbaf790525f8c4eb25fabff7844a_62_0.png)


    **Disable root access across NFS mounts.** Pay special attention to the */etc/exports*
    file, where you declare the local filesystems that you’d like to share via Network
    File System (NFS). By default, the NFS server on most Linux distributions maps
    user ID 0 (root) to a nonprivileged user, like nobody. This behavior, however,
    can be overriden by the **no_root_squash** option in the NFS server’s */etc/exports*
    file. Avoid this option at all costs. It leaves your entire NFS server at the
    mercy of a root user on any of your clients.


    See *Linux NFS and Automounter Administration* by Reaz Zadok (Sybase, 2001) if
    you have set up your Linux clients to mount remote NFS shares automatically.


    **Restrict the use of your root user to when it’s absolutely necessary.** You
    should resist the temptation to log on to root to execute an administration command,
    and stay logged on to execute other user-level commands. The longer you’re logged
    on as root, the longer you’re exposed to a number of vulnerabilities, such as
    Trojan horses and session hijacking.


    **Use a descriptive root prompt.** Sometimes you are your worst enemy. When you
    have several terminals active on your X-display, it’s important to be able to
    tell at a glance which ones are root terminals. This helps you avoid executing
    a user-level command on a root window by mistake. Make sure the root prompt is
    distinctive enough and that it includes a root-specific character, such as a sharp
    sign (#).


    **Use a minimal PATH for your root account.** A common attack on the root account
    is to place Trojan horse versions of frequently used utilities in a directory'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'that is included in the root $PATH. This is a very subtle attack, and the only
    way to protect against it is to ensure that you know the contents of your $PATH
    variable, and the contents of the directories included in the variable. To minimize
    the chance of running a Trojan horse, avoid having directories in your $PATH that
    are writeable by any user other than root.


    Use special-purpose system accounts. An operator who simply needs to shut down
    the system does not need full root privileges. That’s the purpose of default Linux
    accounts such as operator and shutdown. In addition, I recommend that you install
    and use sudo, which is described in detail in the section “The sudo Utility” later
    in this chapter.


    Use group memberships. As a Linux administrator, you’ll often be asked to make
    a file or directory available for reading and writing to several users who are
    collaborating on a single task. While it is easy to simply make these resources
    world-writable, don’t do it. Take the time to add a new group, make each of the
    users a member of this group, and make the resources accessible only to members
    of the group. Think of files with wide-open permissions as vulnerabilities waiting
    to be exploited.


    Restrict root logins to the system console. To monitor who is logging in as root,
    configure the /etc/security/file to allow direct root access only from the console.
    This action forces authorized root users to use su or sudo to gain root privileges,
    thus allowing you to easily log these events. The standard Linux default is to
    allow root logins only from the eight virtual system consoles (function keys on
    the keyboard):


    ```

    ```

    [root]# more /etc/securitytty1tty2tty3tty4tty5tty6tty7tty8

    ```

    ```


    Aside from the logging advantage, this is an extra hurdle in the event that the
    root password becomes compromised. Intruders would have to first gain access to
    a regular user’s account (or to the physical console) to exploit their finding.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Using good user account practices is paramount in ensuring the security of
    your system, but by choosing a poor password, users can undermine all the work
    you have done to protect their accounts. The next section offers some practical
    advice on choosing strong passwords and enforcing their use.


    # Good Passwords


    While stronger modes of authentication are becoming increasingly commonplace,
    the username and password remain the most widely used method of authentication
    for Linux servers. Much has been said and written about the importance of password
    security, so I''ll keep this discussion brief and to the point. There are some
    very simple rules to follow that can go a long way toward locking down your password
    policy:


    **Don''t set your system to cause passwords to expire too quickly.** If the period
    between password expirations is too short, users are more likely to feel that
    they''ll forget their passwords, so they will write them down. In addition, users
    will use cyclic, predictable password patterns. When it comes to password expiration,
    anything less than three months should be considered too short.


    **Don''t allow your passwords to get stale.** Conversely, if you allow your users
    to have the same password for a year, they''re exposing it for a longer time than
    is safe. Four months is a good compromise, but six months is not an unreasonably
    long expiration period.


    **Avoid short passwords.** Force your users to pick passwords that are at least
    six characters in length. Anything shorter than that is too easy to guess using
    brute force attacks, even if random characters are chosen. Figure 2.6 illustrates
    how you can enforce a password length minimum using a systems administration tool
    like Red Hat''s 11uxconf. Note that in addition to enforcing the six-character
    limit, this page forces the user to use a minimum of two non-alphanumeric characters.


    **Crack your own passwords.** As part of your periodic system security audit,
    use password-guessing tools to look for weak passwords in your */etc/passwd* file.
    Contact the guilty users directly and suggest to them that they use longer passwords,
    with more non-alphanumeric characters, with a mix of uppercase and lowercase characters.
    Chapter 3, “System Monitoring and Auditing,” discusses this topic in more detail,
    when it formally introduces the crack utility.


    **Delete unused accounts.** Most Linux servers don''t offer UUCP, PPP, NNTP, Gopher,
    or Postgres services, yet most Linux distributions ship with these accounts. Completely
    remove these accounts, and any others that don''t make sense in your environment.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/3258bbaf790525f8c4eb25fabff7844a_65_0.png)


    Avoid empty password fields. Never set up users with no password, even if their
    shell is highly restricted. Gaining access to any user on your system gets intruders
    halfway to their destination.


    An effective way to minimize the risk associated with user passwords is to configure
    support for shadow password and group files. This is the topic of the next section.


    # Shadow Passwords


    One of the easiest system vulnerabilities to overlook is the ability by any user
    to *crack* another user’s password. This can be done quickly and easily, using
    tools readily available on the Internet. To prevent this, enable *shadow passwords*.
    Shadow passwords split the password files into two: the /etc/passwd file, which
    contains a placeholder in the actual password field entries, and the /etc/shadow
    file, which contains the encrypted password. The /etc/shadow file does not need
    to be readable by anyone except root, which makes it more difficult for a regular
    user to attempt to crack another user’s password (including root).


    Most Linux distributions also support the concept of *shadow groups*, where the
    actual members of each group are not listed in the main /etc/group file, but rather,
    in the /etc/gshadow file, which, like the /etc/shadow file, is readable only by
    root.


    > **TIP** Some Linux distributions do not have shadow passwords enabled by default;
    if your distribution is one of these, enable this feature right away.'
  merge: -1
  img_proc: true
