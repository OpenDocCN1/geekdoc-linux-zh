- pgno: 260
  md: '# Network Layer Firewalls


    Part 4 of this book, “Perimeter Security,” is devoted to the discussion of firewalls,
    software whose primary function is to enforce perimeter security rules by filtering,
    forwarding, redirecting, or logging connection requests that traverse a Linux
    server connected to both your private network and the public Internet.


    # Firewalls: An Overview


    Firewalls can be implemented in a variety of ways, starting with three of the
    OSI layers: network, transport and application. Let’s examine the advantages and
    disadvantages of deploying firewalls at each of these three layers:


    Network Layer Firewalls  Also referred to as packet-filtering gateways, these
    devices examine every IP packet that comes in any of the firewall’s interfaces
    and they take appropriate action based on either its source or destination IP
    address, its TCP/UDP port number, or its IP payload type. The typical actions
    available are:


    +   - Drop (do not forward)

    +   - Allow (forward to next hop according to the server’s routing table)

    +   - Log (note the fact that the packet was seen before dropping or allowing)


    ![](img/3258bbaf790525f8c4eb25fabff7844a_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Packet-filtering firewalls are conceptually easy to understand and relatively
    easy to deploy, but they lack the ability to look deeper into the incoming packet
    to make a smarter decision based on the type of application that the packet contains.
    For example, you cannot deploy a network layer firewall to screen traffic based
    on user IDs of the incoming user or based on the Web URL that an internal user
    is trying to access.


    **Transport Layer Firewalls** By examining (and understanding) an actual TCP or
    UDP conversation, transport layer firewalls can make a more educated access decision
    and allow the security/network administrator to use user authentication as a criterion
    for granting or denying access. While it is virtually impossible to associate
    a user with a network layer conversation, transport layer firewalls can match
    up a username with a transport session, which not only allows you to know who
    is using what service but also allows you to log each transport request that traverses
    the firewall.


    However, this advantage comes at a price: Transport layer firewalls often require
    users to modify their procedures or their client software in order to make them
    aware of the authentication needs of the firewall.


    **Application Layer Firewalls** Making access decisions at the application layer
    allows you to tailor your firewall to the needs of each server application that
    you would like to offer. An application layer firewall inserts itself into the
    conversation between a client and a server and must be able to fully understand
    the protocol at hand. This concept is called *proxying*. For example, a Web proxy
    must be able to handle HTTP requests as if it were the actual target server. This
    allows you to examine the actual URL requested by the Web client and to grant
    or deny access accordingly.


    The disadvantage of application layer firewalls is that you need to configure,
    deploy, monitor, and maintain a firewall process for each application whose access
    you wish to control, instead of using a single firewall technology for all your
    connections (e.g., a packet-filtering firewall).


    As with any other security mechanism, it is best to implement your security policy
    using a combination of firewalls at all three layers to avoid being exposed to
    a vulnerability that''s particular to any one of these layers.


    This chapter discusses the current state of the art in network layer firewalls.
    Chapter 10, “Transport Layer Firewalls,” and Chapter 11, “Application Layer Firewalls,”
    move up the OSI stack to examine the firewalls available at the transport and
    application layers.


    The term *firewall* is perhaps the most commonly known concept in the information
    security arena. It evokes images of an insurmountable object whose mere presence
    in your network ensures that you will never be the victim of any of the Internet
    mischief that other,'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'less-fortunate network administrators must suffer. The reality, however, is
    that firewalls do not ensure instant protection from an ever-changing array of
    threats. Furthermore, even the simplest of firewalls can be complicated to configure.
    Because of this, many fire- walls in use today are misconfigured, and the overwhelming
    majority of them are under- configured.


    Unlike the bricks-and-mortar version, a network firewall must not only protect
    the inside network from intrusion, but it must also allow users to reach outside
    resources while allowing certain connections back to those users. This sounds
    like a simple concept, but its implementation is often challenging.


    The good news, however, is that Linux itself easily serves as an efficient firewall
    device. The Linux kernel has the native ability to inspect the headers of packets
    received by the system. The iptables tool provides full control of packet filtering,
    network address translation, and even stateful inspection, where the decision
    of whether to accept or reject a packet is made in the context of a previously
    established flow (like an outgoing telnet request).


    The classic example of the stateful inspection capability is what allows a firewall
    to permit an incoming ftp-data connection (TCP port 20) only when a local host
    has initiated an ftp-control connection (TCP port 21). By remembering the state
    of the outgoing connec- tion from a given internal IP address, the firewall allows
    the incoming ftp-data connection only while the outgoing ftp-control connection
    is still in the ESTABLISHED state.


    The combination of iptables/ip6tables and kernel support makes Linux a very solid
    platform on which to protect your network perimeter.


    # # Linux as a Firewall Platform


    So why should you choose the Linux platform over the competing offerings, both
    open source and commercial? Ultimately, you are seeking the best protection for
    your network perimeter. So, before jumping into the discussion of how you go about
    setting up a Linux firewall, let''s talk briefly about the reason why you would
    want to do this. These are the major advantages of a Linux platform over its competition:


    +   * **Uniform Administration** There is nothing magical about using a Linux
    server to act as a firewall device, except for the fact that you''ll be running
    a number of com- mands that affect kernel packet filtering and perhaps network
    address translation (NAT). Your training and experience as a Linux administrator
    can be applied toward the administration of your firewall. You know Linux and
    you understand it, which is your best protection when something goes wrong.

    +   * **Commodity Hardware** Unlike some of the commercial firewall appliances
    that employ proprietary (i.e., expensive) and sometimes obscure hardware, the
    Linux'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'firewall can be built with an existing off-the-shelf PC-compatible system,
    a PowerPC, or a Sparc/Ultra machine. This makes maintaining spare parts and repairing
    the system much easier in the event of a outage.


    **Robust Kernel-Based Filtering**  While Linux makes use of user-level tools for
    configuring its firewall feature, the heart of its packet-filtering capability
    is implemented in the kernel, where it''s safer and more *efficient*.


    **Tested Platform**  Both the kernel and the user tools are widely deployed around
    the world, where they enjoy the constant enhancement and support of thousands
    of dedicated developers. Vulnerabilities are discovered and divulged in a timely
    fashion, with patches often available within hours.


    **Performance**  With native support for fast Ethernet and even some WAN technologies
    (ISDN, T1), the Linux operating system can keep up with just about any type of
    connection that your company uses to reach the Internet. The bottleneck is likely
    to be that connection, even when you take into account the time it takes the firewall
    to inspect every packet that reaches its interfaces.


    **Cost**  Using an open-source operating system as well as commodity hardware,
    a Linux firewall is the overall cost winner, often outperforming much larger commercial
    offerings. Not surprisingly, the more cost effective of these commercial firewalls
    are typically the ones based on the Linux operating system, like the Watchguard
    Firebox (http://www.watchguard.com) and the Xsentry Internet Firewall package
    (http://www.trustix.com).


    There are, however, a few disadvantages of choosing Linux firewall support; here
    are two of them:


    **Support**  I''m not going to enter into the age-old argument of open source
    vs. commercial, but the fact remains that many enterprises still feel uneasy about
    relying on an open-source system for protection. While there are plenty of support
    offerings for the Linux operating system, the firewall application support offered
    by most commercial vendors is bound to be more enticing to your CIO.


    **Application Bundling**  Although there are some open-source packages that offer
    graphical user interface (GUI) interfaces to the command-line tools used to control
    packet filtering, the commercial sector is further ahead in offering an all-encompassing
    firewall application. These applications often include an installation and deinstallation
    script, a GUI, and a set of monitoring, logging, and reporting tools. This is
    of relative value, however, unless your company lacks the expertise necessary
    to install the more laborious "build-your-own" Linux alternative.


    If you have analyzed these pros and cons, and are still ready to use Linux to
    protect your network, then read on! The next section introduces the concept of
    packet filtering,'
  merge: -1
