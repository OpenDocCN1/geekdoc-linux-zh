  md: '# Figure 2.1 OpenLinux security advisories


    ![](img/3258bbaf790525f8c4eb25fabff7844a_54_0.png)


    # SuSE


    An extremely popular distribution in the European market, SuSE offers a full-featured
    set of supported packages (six CDs worth of them!) and also uses the RPM package
    management system. Their release schedule is similar to Red Hat\u2019s with the
    .0 minor numbers signaling the initial offering of a major release. However, they
    typically offer up to four minor releases (e.g., 6.4) before moving on to another
    major version. Red Hat, on the other hand, generally has only two minor releases
    with each version.


    One of SuSE\u2019s distinguishing characteristics is the inclusion of the *seccheck*
    script that can be periodically invoked from *cron*, to test the overall security
    of the system in a number of areas. The vendor also includes a utility that you
    can use to “harden” your server installation (*harden\_suse*). This is a sign
    that this vendor is concerned with security and is willing to spend development
    and maintenance resources to prove it.'
  merge: -1
