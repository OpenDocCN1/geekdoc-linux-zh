    # Starting and Stopping the SOCKS5 Server


    The main SOCKS5 daemon application (located, by default, in `/usr/local/bin/socks5`)
    must be running at all times in order for your server to proxy incoming connections.
    The process listens on a pre-specified port (1080, by default), where internal
    clients can contact it to request proxy service. The SOCKS5 daemon can be started
    in one of four different modes:


    **Stand-alone** Stand-alone mode is the default for most Linux network servers.
    The system starts a single `socks5` process from the usual startup directory (e.g.,
    `/etc/rc.d/init.d` for Red Hat). When the daemon receives a connection request,
    it spawns a separate process to handle it, which frees up the original listener
    to accept subsequent connection requests. Childen processes are cleaned up when
    no longer needed. Stand-alone mode is not optimal, but I recommend that you select
    this mode initially, because tracking a single instance of the server simplifies
    the process of debugging your initial configuration.


    **Preforking** The process of spawning a separate SOCKS5 instance for each connection
    is an expensive one, and it should be avoided when possible. Preforking mode allows
    you to start a number of copies of the `socks5` process. In Linux, the default
    number of preforked processes is **64**. This is a good initial setting. If your
    system is not going to be dedicated to running SOCKS5 and will be running other
    network services, decrease this number to 32. (See the `-n` option listed in Table
    10.7.) Preforking is the preferred mode of running the server for non-Linux systems
    that do not support threads.


    **inetd** SOCKS5 can be added to `/etc/inetd.conf` to be executed by the main
    `inetd` daemon whenever it receives a request on the SOCKS5 port. This is perhaps
    the least effective way to configure the daemon because it’s the mode that incurs
    the most overhead.


    **Threaded** Threaded mode is the optimal mode for starting the SOCKS5 daemon
    on a Linux system. Taking advantage of Linux support of POSIX threads, the daemon
    can be started as a threaded application.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'As with any other Linux executable, you can specify a variety of switches on
    the command line when you invoke the SOCKS5 server. Table 10.7 lists the command-line
    options that are accepted in conjunction with the socks5 executable:


    **Table 10.7** *socks5* Command-Line Options


    | Option | Description |

    | :--- | :--- |

    | -I | Run daemon from inetd. |

    | -f | Run in the foreground (useful for debugging). |

    | -p | Run a preforking daemon. |

    | -n | Fork a maximum of n processes. |

    | -t | Run a threaded daemon. |

    | -d | Run in debug mode. |

    | -S | Send all output to stderr rather than syslog. This option is also useful
    for debugging. |


    For example, to start the server in the foreground with debugging enabled, use
    the following command:


    `[ramon]$ sudo /usr/local/bin/socks5 -f -d`


    To start the server in preforking mode with an initial set of 32 children, use
    the following command:


