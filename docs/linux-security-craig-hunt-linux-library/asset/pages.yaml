- pgno: 173
  md: '# ## 6


    # # Electronic Mail


    Parts 1 and 2 of this book explore the security challenges associated with the
    systems and network layers of the Linux server. The next step in this progression
    is to examine the security issues inherent to the application layer. This chapter
    kicks off Part 3, “Application Security,” by taking a close look at a number of
    electronic mail server applications, their installation, setup, and their impact
    on the overall security of your server.


    While the World Wide Web has seen its traffic (HTTP) grow faster than any other
    protocol in recent Internet history, electronic mail (SMTP) packets still outnumber
    any other protocol in usage today. With recent legislative decisions in favor
    of the validity of electronic signatures, you’re likely to see the amount of electronic
    mail use grow at an even faster rate as companies start using the Internet for
    the distribution and signature of legally binding documents and their supporting
    materials.


    However, electronic mail is one of the most challenging applications to secure
    due to the public and widespread nature of the service. Mail servers often must
    handle messages of very disparate sizes, origin, and composition. Electronic mail
    is easily the part of your server to which you should devote the most attention
    on a day-to-day basis, since it’s the application that will experience the most
    amount of traffic.


    This chapter will explore three popular mail transport agents (MTAs), Sendmail,
    Qmail, and Postfix, and will describe two types of mail-retrieval protocols, Post
    Office Protocol v.3 (POP3) and Internet Mail Access Protocol (IMAP). In addition,
    this chapter will take a look'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'at Pretty Good Privacy (PGP) and its open source cousin, Gnu''s Gnu Privacy
    Guard (GnuPG).


    Let’s kick off the discussion with an in-depth look at Sendmail, the daemon application
    that provides the transport for the majority of today’s Linux e-mail servers.


    # # Sendmail


    Sendmail has been the de facto standard for Unix-based Internet MTAs ever since
    the first TCP/IP-enabled version of Berkeley Unix came out in 1984. The Sendmail
    agent is still in use today, fueled by a well-organized group of dedicated developers
    that make up the Sendmail Consortium (www.sendmail.org).


    While the first few Sendmail versions were robust enough to perform in production
    environments, even under extremely heavy loads, they were not designed with security
    in mind because the Internet hadn’t yet become the ubiquitous (and risky) medium
    that it is today. However, starting with version 8.9, the Sendmail developers
    have adopted a more defensive philosophy in light of an increasing incidence of
    documented security exploits, mostly fueled by its expanding popularity. The result
    was a much more secure default distribution, almost pedantic in the way that it
    safeguarded against misconfigurations that can lead to security holes.


    Versions 8.10 and 8.11 of Sendmail have gone a step further, implementing a comprehensive
    defense against unsolicited commercial e-mail (UCE), otherwise known as spam.
    In addition, Sendmail version 8.11 was the first version to incorporate support
    for SMTP authentication, the topic of the next section.


    # ## Secure Mail Relaying via SMTP Authentication


    Mail server administrators are being asked to ensure the security of their mail
    server while still providing an acceptable level of service to legitimate users.
    This typically means disabling all mail relaying through the corporate mail server,
    except for those addresses that are known to belong to the company’s remote access
    users. The problem with this approach is that with the advent of universal remote
    access and broadband technology, it’s increasingly difficult to know the addresses
    of the legitimate users.


    The focus has shifted toward a just-in-time authentication of the mail client,
    whereby remote system users identify themselves as corporate users before being
    granted the ability to relay mail through the server. The Internet Engineering
    Task Force (IETF) has proposed SMTP authentication (RFC2554) as the standard protocol
    to enable secure mail relaying, and Sendmail 8.10 now incorporates native support
    for SMTP authentication.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'If you have a large mobile work force and you find yourself having to allow
    mail-relay connections from otherwise anonymous destinations, I recommend that
    you upgrade to Sendmail 8.11 right away. Red Hat 7.0 comes standard with Sendmail
    8.11.0, and also includes Cyrus'' implementation of Simple Authentication and
    Security Layer (SASL), which is used by Sendmail to implement SMTP authorization.


    Listing 6.1 shows the steps you need to take to add SMTP AUTH support to a standard
    Red Hat 7.0 installation.


    # Listing 6.1 Configuring Sendmail for SMTP authorization per RFC2554


    ```

    ```text

    [ramon]$ rpm -q sendmail

    sendmail-8.11.0-8

    [ramon]$ rpm -q cyrus-sasl

    cyrus-sasl-1.5.24-6

    [ramon]$ sudo saslpaswd ramon

    Password: mypass

    Again (for verification): mypass

    ```

    ```


    As you can see in Listing 6.1, first make sure that you have both a recent version
    of Sendmail (SMTP AUTH support is implemented as of Sendmail 8.10), as well as
    a recent version of `cyrus-sasl` (more recent than 1.5.10). Next, use the `saslpaswd`
    utility to create the secret password for each remote user who will be using SMTP
    AUTH. In Listing 6.1, a new user named `ramon` is created, whose password will
    be `mypass`.


    In addition, you must modify the standard Red Hat 7.0 `/etc/mail/sendmail.mc`
    file to include the provision to allow relaying when SMTP AUTH is successful.
    To accomplish this, simply add the line:


    ```

    `TRUST_AUTH_MECH (DIGEST-MD5 CRAM-MD5)`

    ```


    to the `options` section of `/etc/mail/sendmail.mc`. Don’t forget to recreate
    the `/etc/sendmail.cf` file from the updated macro configuration file using the
    following command:


    ```

    ```bash

    [ramon]$ sudo m4 sendmail.mc > /etc/sendmail.cf

    ```

    ```


    At this point, the local `sendmail` daemon allows relaying to only those SMTP
    clients that authenticate themselves using either `DIGEST-MD5` or `CRAM-MD5`.
    (CRAM stands for Challenge/Response Authentication Mode. MD5 is a popular one-way
    hashing algorithm.) There are a number of mail user agents (MUAs) that support
    CRAM-MD5 authentication natively, such as Pine, Mulberry, Eudora, Pegasus, and
    Akmail. You should make sure that one of these mail clients is used and that they
    are configured with the username and password that you specified with the `saslpaswd`
    command.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Once you have successfully added strong authentication to your Sendmail service,
    the next step is to add privacy to the mail transport communications. This is
    the topic of the next section.


    # ### SMTP over TLS


    Sendmail version 8.11 introduces support for secure SMTP over TLS (STARTTLS) per
    RFC2487. The term *STARTTLS* simply refers to the new SMTP command that is used
    to initiate the TLS-enabled mail transport session. This extension allows you
    to set up a secure bridge from two SMTP (Sendmail) servers that can communicate
    using TLS (also known as Secure Sockets Layer, or SSL). This ensures the privacy
    and integrity of the exchange and strongly authenticates the identity of the two
    communicating peers. To add STARTTLS support to a stock installation of Sendmail,
    start by ensuring that you have installed both Sendmail 8.11 or above and OpenSSL
    using the following command:


    ```

    ```txt

    [ramon]$ rpm -q sendmail openssl

    sendmail-8.11.0-8

    openssl-0.9.5a-14

    ```

    ```


    > **NOTE** Chapter 7, “HTTP Services,” explains in more detail the nature and
    purpose of the SSL protocol.


    Next, you need to create your own certificate authority (CA) using OpenSSL so
    that you can sign (and verify) the X.509 digital certificates of your remote peers.
    Listing 6.2 shows the commands needed to create the CA.


    # **Listing 6.2** Creating a certificate authority for Sendmail STARTTLS


    ```

    ```txt

    [ramon]$ sudo mkdir /etc/mail/CA

    [ramon]$ cd /etc/mail/CA

    [ramon]$ sudo mkdir certs c1 newcerts private

    [ramon]$ echo "01" > serial

    [ramon]$ cp /dev/null index.txt

    [ramon]$ cp /usr/share/ssl/openssl.cnf openssl.cnf

    [ramon]$ sudo openssl req -new -x509 -keyout private/cakey.pem -out cacert.pem
    -days 365 -config openssl.cnf

    ```

    ```


    The commands in Listing 6.2 perform the following tasks:


    +   1.  Create a directory `(/etc/mail/CA)` where you will be storing your Sendmail
    Certificate Authority information.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   2.  Create four subdirectories where you will store the CA certificates
    (certs), the certificate revocation lists (cr1), new certificates signed by the
    CA (newcerts), and the CA’s private key (private).

    +   3.  Initialize two housekeeping files (serial and index.txt) and copy the
    standard configuration file (/usr/share/ssl/openssl.cnf) into the current CA directory.

    +   4.  Use the openssl command to create a new CA private key (private/cakey.pem)
    and a new CA certificate (cacert.pem) that is valid for the next 365 days.


    Next, you need to create a certificate for the Sendmail server using the following
    command:


    ```

    [ramon]$ sudo openssl req -nodes -new -x509 -keyout newreq.pem -out newreq.pem
    -days 365 -config openssl.cnf

    ```


    And finally, you need to sign the new certificate (newreq.pem) with the CA’s private
    key, as follows:


    ```

    [ramon]$ sudo openssl x509 -x509toreq -in newreq.pem -signkey newreq.pem -out
    tmp.pem

    Getting request Private Key

    Generating certificate request

    [ramon]$ sudo openssl ca -config openssl.cnf -policy policy_anything -out newcert.pem
    -infiles tmp.pem

    Getting request Private Key

    Generating certificate request

    [ramon]$ sudo openssl ca -config openssl.cnf -policy policy_anything -out newcert.pem
    -infiles tmp.pem

    Using configuration from openssl.cnf

    Enter PEM pass phrase:

    Check that the request matches the signature

    Signature ok

    The Subjects Distinguished Name is as follows

    countryName           :PRINTABLE: ''US''

    stateOrProvinceName    :PRINTABLE: ''Virginia''

    localityName           :PRINTABLE: ''Ashburn''

    organizationName       :PRINTABLE: ''Ramon J. Hontanon''

    organizationalUnitName: PRINTABLE: ''Ramons Pile 0 Bits''

    commonName             :PRINTABLE: ''redhat.example.com''

    emailAddress           :IA5STRING: ''rhontan0ns@sybex.com''

    ```'
