- pgno: 85
  md: '```

    # Save mail and news errors of level err and higher in a

    # special file.

    ucp,news.crit                        /var/log/spooler


    # Save boot messages also to boot.log

    local7.*                              /var/log/boot.log

    ```


    The general format of the entries in the syslog.conf file is as follows:


    *facility.priority[*;**facility.priority[*] [TAB]*action*


    Each field is defined as follows:


    *facility*  The *facility* field is the subsystem that you want to log events
    from. The current supported subsystems are


    +   - auth: secure and authentication messages

    +   - authpriv: private secure and authentication messages

    +   - cron: clock/scheduler daemon

    +   - daemon: other system daemons

    +   - kern: Linux kernel messages

    +   - lpr: line printer system messages

    +   - mail: mail system

    +   - news: network news subsystem

    +   - sysloger: internal syslog messages

    +   - uucp: Unix-to-Unix copy subsystem

    +   - local0–local7: reserved for local use


    The special character * can be used to denote any (and all) facilities.


    *priority*  The *priority* field specifies the priority level of the message within
    a given subsystem. The current priorities are (in ascending order of criticality)


    +   - debug: debug-level messages for troubleshooting

    +   - info: informational messages

    +   - notice: normal messages of special interest

    +   - warning: abnormal messages signaling impending failure

    +   - error: failure condition messages

    +   - crit: critical error-condition messages

    +   - alert: condition needing immediate action

    +   - emerg: error condition leading to system failure'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The special character `*` can be used to denote any (and all) priorities.


    **destination**   The destination field defines the destination for log messages
    that match the given facility and priority combination. This can be either a filename,
    or a host name when the `@` sign precedes the keyword. The `*` character takes
    on a special meaning here, denoting all users; in other words, all users who are
    currently logged on will receive a copy of the message on their active terminals.
    Needless to say, you should only use this for absolutely critical messages that
    might impact the user''s ability to continue to work on the system.


    **action**   The action field can be one of the following:


    +   * A regular file. In this case, all messages will be appended to the end of
    the file. The file must be specified with a full path name, starting with the
    `/` character.

    +   * A named pipe. In this case, the messages are used as the standard input
    to the pipe.

    +   * A terminal or console. In this case, the messages are displayed over the
    given device.

    +   * A remote machine. In this case, the messages are sent to a remote host''s
    `syslogd` daemon.

    +   * A list of users. In this case, the messages are broadcast to the terminals
    owned by any active users. The special character `*` is used to send messages
    to all users that are currently logged on.


    Applying these facility, priority, destination, and action values, you can see
    that the `syslog.conf` file in Listing 3.1 is instructing the `syslogd` daemon
    to:


    +   * Log all kernel messages to the console.

    +   * Log `authpriv` and `mail` messages to `secure` and `maillog` respectively.

    +   * Log `emergency` messages to all the users'' terminals and to the remote
    system loghost.

    +   * Log `ucp` and `news` messages (critical and above) to `spooler`.

    +   * Log `local7` (boot) messages to `boot.log`.

    +   * Log the remaining messages (info and above) to `messages`.


    Some messages are critical enough to the system that they should be stored outside
    the system itself. This is necessary to make sure that you can continue to log
    events, even when the local disk is full or is otherwise unavailable. Keeping
    a set of log files on a separate system also has clear security advantages, since
    a sophisticated attacker will most likely delete or otherwise tamper with the
    log files on the attacked system. An attacker would have to repeat all the steps
    he used to get on the first server to get on the second server in order to completely
    erase his trail.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The next section describes the operation of remote syslog and discusses the
    security implications of running this service on the remote server.


    # syslog Server Security


    The Linux model is one where services can easily transcend physical servers, and
    the syslog facility is no exception. When the action @loghost for kernel emergency
    messages is specified in Listing 3.1, the implication is that there is a system
    named (or aliased to) loghost that is actively listening on UDP port 514 for incoming
    syslog requests.


    While this facility makes a more robust logging mechanism, it also introduces
    a known vulnerability, where attackers can target port 514 UDP by sending very
    large files to this service to fill up the disks and make the server unavailable.
    This can then be followed by a stealth attack on the servers that this loghost
    was logging for in the first place.


    If you deploy remote syslogd servers, I recommend that you take at least one of
    the following precautions:


    +   * Protect access to port 514 UDP by ensuring that only authorized servers
    are allowed to write to that service (see Chapter 9, “Network Layer Firewalls”).

    +   * Deploy your remote syslogd server on a separate, dedicated network segment
    that is exclusive for this use (e.g., a 10.0.0/24 management network).

    +   * Use a dedicated partition to write remote syslogd messages. This partition
    could fill up completely without having any other adverse effect on the system.
    (Note, however, that when the log files fill up, the system is really no longer
    useful.)


    > TIP In order to allow your remote syslogd server to accept messages from other
    machines, don''t forget to use the -r flag when invoking syslogd.


    # System Log Monitoring


    The basic idea behind log file monitoring is to define a set of system log files
    of interest, and a set of triggers, or regular expressions, to monitor for. When
    the tool finds a trigger in the appropriate log file, it executes a specified
    action (sends an e-mail, executes a command, pages the administrator, etc.). Two
    full-featured system log monitoring tools are swatch and logcheck.


    # swatch


    The Simple WATCHer (swatch) is a monitoring tool developed by Todd Atkíns at University
    of California, Santa Barbara (UCSB). It is composed of a large Perl script that'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'does all the monitoring and a configuration file where you can specify your
    triggers and a set of actions for each trigger. The following sections describe
    the installation, configuration, and use of swatch.


    # Installing swatch


    While swatch is readily available in RPM format, be aware that most Linux distributions
    lack three of the Perl packages required by swatch:


    +   - `perl-File-Tail`: a Perl module for reading from continuously updated files

    +   - `perl-Time-HiRes`: a Perl module for handling high-resolution time variables

    +   - `perl-Date-Calc`: a Perl module for Gregorian calendar date calculations


    These modules are part of the CPAN Perl archive that is also available in RPM
    format. Once you have downloaded these three Perl packages, as well as the latest
    **swatch** RPM, then install all four packages in the order shown in Listing 3.2.


    # **Listing 3.2** The swatch installation process


    ```

    [ramon]$ ls -1 *.rpm

    -rw-r-- 1 ramon users 55922 Sep 30 22:49 perl-Date-Calc-4.2-2.i386.rpm

    -rw-r-- 1 ramon users 12280 Sep 30 22:49 perl-File-Tail-0.91-2.i386.rpm

    -rw-r-- 1 ramon users 12500 Sep 30 22:49 perl-Time-HiRes-01.20-2.i386.rpm

    -rw-r-- 1 ramon users 28279 Sep 30 22:45 swatch-3.0b4-1.noarch.rpm

    [ramon]$ sudo rpm -i perl-Date-Calc-4.2-2.i386.rpm

    [ramon]$ sudo rpm -i perl-File-Tail-0.91-2.i386.rpm

    [ramon]$ sudo rpm -i perl-Time-HiRes-01.20-2.i386.rpm

    [ramon]$ sudo rpm -i swatch-3.0b4-1.noarch.rpm

    ```


    If there are no errors during these installation steps, you are now ready to configure
    and use the swatch utility.


    # Configuring swatch


    There is only one swatch configuration file, typically called `.swatchrc` or `swatchrc`.
    This file contains a definition of the triggers that you’d like to monitor, as
    well as the appropriate action that you would like taken in the presence of each
    of the triggers. The file should have one keyword per line, with an optional equal
    sign (=) and an optional value for the keyword.


    The following section defines the keywords used in the swatchrc configuration
    file.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '**Patterr-Matching** There are two options available in *swatchrc* for specifying
    triggers, or patterns, to watch out for:


    *   **Watch for** *regex* Take the appropriate action when the regular expression
    specified in *regex* is found within the file or command being monitored.

    *   **Ignore** *regex* Take the appropriate action when there is any activity
    within the file or command being monitored, except for events that match the expression
    specified in *regex*.


    **Patterr-Matching Action** Once the pattern has been identified, you must specify
    the action to be taken. Here are the options available:


    *   **echo** Write the event that matches the pattern being monitored.

    *   **bell** Ring a bell by printing the appropriate ASCII character. This action
    is only appropriate if you''re directing the output of *swatch* to stdout.

    *   **exec** *command* Executes the specified command as if it were typed in at
    the command line. You can pass positional variables from the matched line to the
    command. For example, $1 is the first character in the line, $2 for the second
    character, and so on. $\* is the entire line.

    *   **mail [***address*:address:...*][***,subject*=***your_subject***\]*** Sendsan
    electronic mail message to the address you specify *(*address*)*, with an optional
    subject header *(*your_subject*)*. Note that if the recipient is omitted, the
    message is sent to the user who owns the *swatch* process on the local server.

    *   **Pipe** *command* Pipe the matched lines from the monitored file as input
    to the specified command.

    *   **throttle** *hours*:*minutes*:*seconds* This option is useful for patterns
    that appear repetitively. Rather than taking action on each appearance of the
    trigger, *swatch* can signal the event only periodically. However, you will get
    a report of how many times the event occurred during that time.

    *   **when** *day:hour* This option is used to restrict the use of an action to
    a day of the week and an hour of the day. It''s useful to configure *swatch* to
    page the system administration staff in some instances or to simply e-mail them
    in other instances, depending on their availability.


    # swatch Configuration File Examples


    The following is a sample *swatch* configuration file to alert the system administrator
    of any user authentication failures in the last 30 minutes. This example specifies
    that'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'you''d like to be notified by pager whenever one of the filesystems has reached
    capacity. You are instructing **swatch** to look for the expression “authentication
    failure,” and you are specifying an e-mail message that indicates what action
    to take. The e-mail message will have the subject “Auth Failure Report.” The **echo**
    directive instructs **swatch** to include the offending message in the e-mail.
    The **throttle** directive ensures that you are only alerted once every 30 minutes,
    regardless of the frequency of the message within the 30-minute period.


    ```

    watchfor /authentication failure/

    echo

    bell

    throttle 00:30

    mail=sysadmin@example.com,subject=Auth Failure Report

    ```


    If it’s after hours, the following configuration file entry indicates that the
    staff should also be paged. This example looks for occurrences of the string “filesystem
    full” and sends two separate e-mail messages, one to **sysadmin@example.com**,
    and another to **sysadmin-pager@example.com**, but only during the hours of 5
    P.M. to 9 A.M.


    ```

    watchfor /filesystem full/

    echo

    mail=sysadmin@example.com,subject=FileSystem Full

    mail=sysadmin-pager@example.com,when=1-7:17-9

    ```


    Finally, consider the following example of a **swatch** configuration file that
    triggers corrective action at the same time that the administration staff is informed
    of the condition. This example is similar to the previous two, except that it
    invokes the execution of a script (**cleanup_old_files**) whenever the string
    “filesystem full” is encountered.


    ```

    watchfor /filesystem full/

    echo

    mail=sysadmin@example.com,subject=Cleaning Files

    exec ''cleanup_old_files''

    ```


    # Running swatch


    The **swatch** script accepts several command-line options. Table 3.1 describes
    the ones that you need to be most interested in.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Table 3.1 `swatch` Command-Line Options


    | Configure Option | Description | Default |

    |---|---|---|

    | `--config-file=fi` `lename` | Location of the configuration file. | `$HOME/.swatchrc`
    |

    | `--help` | Display a short help summary. | N/A |

    | `--version` | Display `swatch` script version. | N/A |

    | `--tail-file=fi` `lename` | Examine lines of text as they''re added to the file.
    | *Note: Only one of these options can be specified at any one time. The default
    is:* `--tail-file=/var/log/messages` |

    | `--read-pipe=command` | Examine input piped in from the specified command. |
    |

    | `--examine=fi` `lename` | Examine specified filename in a single pass. | |


    I recommend that you always include the `--config-file` option, and that you place
    the configuration file in an obvious place like `/etc/swatchrc`, where it''s easier
    to track and manage. When no command-line options are specified, the default `swatch`
    command is `swatch --config-file=/.swatchrc --tail-file=/var/log/messages`


    More typical invocations of the `swatch` command would be


    ```

    swatch --config-file=/etc/swatchrc.messages --tail-file=/var/log/messages

    swatch --config-file=/etc/swatchrc.htmlaccess.log --tail-file=/var/log/htmlaccess.log

    swatch --config-file=/etc/swatchrc.authlog --tail-file=/var/log/authlog

    ```


    Note that these commands specify separate configuration files for each system
    log file to be monitored. I recommend that you invoke each of these `swatch` commands
    (or whichever commands you find useful) on a separate virtual terminal (or xterm
    in the system console) and review the output periodically. As always, the severity
    of the alert (`echo`, `mail`, `page`, etc.) should be in accordance with the type
    of event and its recommended handling as stated in your security policy.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# logcheck


    Maintained by Craig Rowland of Pisonic, logcheck is an adaption of frequentcheck.sh,
    a log-monitoring package that once accompanied the Gauntlet firewall from Trusted
    Information Systems, although some of the most important components have been
    totally rewritten. Unlike swatch, the logcheck design is such that you don’t have
    to have a constantly running process scrutinizing your log files, which should
    cut down on overhead on the server. In addition, logcheck can alert you of unusual
    events, even if you have not defined them as triggers to look for.


    The logcheck package contains two executables: logtail and logcheck.sh. logtail
    keeps track of how much of the log file was monitored last time, and it is written
    in C for performance reasons. logcheck.sh controls all processing and inspects
    the contents of the log files. It is meant to be invoked from cron and should
    be configured to run at least hourly.


    # Installing logcheck


    Fortunately, the RPM version of the logcheck package is ubiquitous, and I recommend
    that you use the following installation method, since there is no need for special
    configuration of the sources. Once you have obtained the .rpm file, simply install
    it using the rpm utility:


    ```

    [ramon]$ ls -1 logcheck-1.1.1-1.i386.rpm

    -rw-r--r--  1 ramon users  33707 Sep 28 20:04 logcheck-1.1.1-1.i386⏎rpm

    [ramon]$ sudo rpm -i logcheck-1.1.1-1.i386.rpm

    ```


    > Don’t forget to erase any previous or outdated versions of logcheck before running
    the command that installs logcheck.


    # Configuring logcheck


    Upon installation, logcheck writes a number of reference files in the /etc/logcheck
    directory, which it uses for default pattern matching. The most interesting of
    these files is logcheck.hacking (shown in Listing 3.3), in which the author has
    placed a number of regular expressions that are often associated with documented
    attacks on Linux servers, such as


    +   - VR FY root

    +   - EXPN root'
  merge: -1
  img_proc: true
