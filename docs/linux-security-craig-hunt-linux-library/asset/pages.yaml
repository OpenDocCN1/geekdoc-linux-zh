    # S/Key and OPIE


    One of the major drawbacks of using conventional authentication is that if an
    attacker gains access to a password, they would be able to impersonate the user
    in question. But what if the password was different every time? The concept of
    *one-time passwords* is what inspired Bellcore engineers to design the S/Key system.
    By using a hash algorithm seeded by a small secret key (e.g., a password), the
    S/Key system allows you to use a pre-defined sequence of passwords to log onto
    a Linux server, using each password only once.


    The success of this scheme hinges on the fact that it is extremely hard to predict
    the next password if the current one is learned. This is accomplished with a strong
    hash function (based on the MD4 algorithm) that uses a password as a seed value.
    A sequence of eight-byte passwords is then produced and translated into six English
    words. Every time the user wants to log on to the server, they have to use this
    six-word sequence as the password.


    The server expects the last password of the sequence first and then expects the
    rest of the passwords in reverse order. This means that if an attacker gets hold
    of the current password, they would have to guess the previous password in the
    sequence, which would mean reversing the hash function. This is extremely difficult,
    given the strength of the MD4 algorithm.


    In 1994, the U.S. Naval Research Laboratory (NRL) took the S/Key concept and re-implemented
    it using the stronger MD5 hashing algorithm. The so-called OPIE system'
