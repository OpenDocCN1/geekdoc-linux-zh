    # Configuring tripwire


    Once the package has been installed in the appropriate directory, you must create
    a configuration file, as well as a default policy, that will also be stored in
    a text file. After these two files are created, use the `twadmin` utility to encode
    and sign both files to ensure that their contents are not modified. The next step
    is to initialize the signature database, which allows you to run your first integrity
    check.


    The following sections explain in more detail the process of creating a `tripwire`
    configuration file and a policy file.


    # The tripwire Configuration File


    The `tripwire` configuration file is typically found at the following location:


    `${ROOT}/bin/twcfg.txt`


    The purpose of this configuration file is to control the location of all the other
    files in the `tripwire` distribution after it has been installed. Listing 3.6
    contains the default contents of the file.


    # Listing 3.6   Initial contents of the tripwire configuration file (twcfg.txt)


    ```

    ```text

    ROOT           =/usr/TSS

    POLFILE        =/usr/TSS/policy/tw.pol

    DBFILE         =/usr/TSS/db/${HOSTNAME}.twd

    REPORTFILE     =/usr/TSS/report/${HOSTNAME}-${DATE}.twr

    SITEKEYFILE    =/usr/TSS/key/site.key

    LOCALKEYFILE   =/usr/TSS/key/redhat.example.com-local.key

    EDITOR         =/bin/vi

    LATEPROMPTING  =false

    LOOSEDIRECTORYCHECKING =false

    MAILNOVIOLATIONS =true

    EMAILREPORTLEVEL =3

    REPORTLEVEL    =3

    MAILMETHOD     =SENDMAIL

    SYSLOGREPORTING =false

    MAILPROGRAM    =/usr/lib/sendmail -oi -t

    ```

    ```'
