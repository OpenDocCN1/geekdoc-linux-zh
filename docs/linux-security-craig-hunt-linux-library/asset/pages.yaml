    Let’s say that you don’t want to run a specific service. In this case, you need
    to modify the /etc/rc.d directory accordingly. There are several ways to prevent
    these services from starting, and each Linux distribution has a system tool (linuxconf,
    vast, etc.) that provides you with this capability. But it’s important to know
    how to do it “under the hood,” because all of these tools are just modifying these
    script directories anyway.


    You start by identifying during which runlevel the service is started; let’s use
    apache as an example. The following find command walks through the /etc/rc.d directory
    tree and identifies in which subdirectory the apache script is present. For example,
    if you find a startup script in /etc/rc.d/rc3.d, you know that the service in
    question is being started when the server enters runlevel 3.


    ```

    [ramon]$ find /etc/rc.d/* -name "*apache" -print

    /etc/rc.d/rc2.d/K20apache

    /etc/rc.d/rc2.d/S20apache

    /etc/rc.d/rc3.d/K20apache

    /etc/rc.d/rc3.d/S20apache

    ```


    You can see that the apache daemon gets invoked during both runlevel 2 and runlevel
    3. You can then move to delete these files because they’re simply symbolic links
    to /etc/rc.d/apache:


    ```

    [ramon]$ sudo find /etc/rc.d/* -name "*apache" -exec rm {} \;

    ```


    Note that the previous command prevents apache from coming up the next time you
    restart the system. In order to terminate the current process, execute the following
    command:


    ```

    [ramon]$ sudo killall1 httpd

    ```


    By cleaning out your /etc/inetd.conf and /etc/rc.d files, you have gone a long
    way toward keeping your network daemons under control. The next section describes
    how to go the distance by also controlling some of the configuration files that
    unwanted daemons tend to leave behind.'
  merge: -1
