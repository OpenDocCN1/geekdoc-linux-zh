- pgno: 394
  md: 'The RSA keys are stored in the following files:


    +   - /etc/ssh/ssh_host_key (private half)

    +   - /etc/ssh/ssh_host_key.pub (public half)


    The DSA keys are located in the following files:


    +   - /etc/ssh/ssh_host_dsa_key (private half)

    +   - /etc/ssh/ssh_host_dsa_key.pub (public half)


    You are now ready to accept SSH connections over port 22. Make sure that any perimeter
    security devices that may be in front of the OpenSSH server allow incoming connections
    to TCP port 22.


    The SSH client takes a number of command-line options. Table 12.3 lists the most
    important ones.


    **Table 12.3 Table 12.3:** ssh Client Command-line Options

    | **Option** | **Meaning** |

    |:-----------|:-----------|

    | -I user | Log on as username user. |

    | -i file | Identity file for RSA authentication (other than $HOME/.ssh/identity).
    |

    | -v | Display verbose output (useful for debugging). |

    | -V | Display version number. |

    | -q | Don''t display any messages (quiet). |

    | -c [3des | blowfish] | Select an encryption algorithm. |

    | -C | Enable compression. |

    | -o option | Specify an option (using the same format as /etc/ssh/ssh_config)
    for this session only. |'
