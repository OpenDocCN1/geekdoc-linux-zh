- pgno: 447
  md: '· retry=N: This argument is the default number of times that this module will
    request a new password (for strength checking) from the user. The default is 1.
    If after N times the user does not enter a password that passes the strength test,
    the module terminates. Using this argument can increase the default N times.


    · difok=N: This argument changes the default of 10 for the number of characters
    in the new password that must not be present in the old password. In addition,
    if half of the characters in the new password are different, then the new password
    will be accepted anyway.


    · minlen=N: This argument sets the minimum acceptable size for the new password
    plus one. In addition to the number of characters in the new password, credit
    (of *1 in length) is given for each different kind of character (other, upper,
    lower, and digit). The default for this parameter is 9, which is good for an old-style
    Unix password where all characters are of the same type of character. But a default
    of 9 may be too low to exploit the added security of an MD5 system. Note that
    there is a pair of length limits in the cracklib library itself, a "way-too-short"
    limit of 4, which is hard-coded in and a defined limit (6) that will be checked
    without reference to minlen. If you want to allow passwords as short as five characters,
    either don''t use this module or recompile the cracklib library and then recompile
    this module.


    · dcredit=N: This argument is the maximum credit for having digits in the new
    password. If you have less than or N digits, each digit counts +1 towards meeting
    the current minlen value. The default for dcredit is 1, which is the recommended
    value for a minlen value of less than 10.


    · ucredit=N: This argument is the maximum credit for having uppercase letters
    in the new password. If you have less than or N uppercase letters, each letter
    counts +1 towards meeting the current minlen value. The default for ucredit is
    1, which is the recommended value for a minlen value of less than 10.


    · lcredit=N: This argument is the maximum credit for having lowercase letters
    in the new password. If you have less than or N lowercase letters, each letter
    counts +1 towards meeting the current minlen value. The default for lcredit is
    1, which is the recommended value for a minlen value of less than 10.


    · ocredit=N: This argument is the maximum credit for having non-alphanumeric characters
    in the new password. If you have less than or N other characters, each character
    counts +1 towards meeting the current minlen value. The default for ocredit is
    1, which is the recommended value for a minlen value of less than 10.


    · use_authtok: This argument is used to force the pam_cracklib module to not prompt
    the user for a new password but to use the one provided by the previously stacked
    password module.'
