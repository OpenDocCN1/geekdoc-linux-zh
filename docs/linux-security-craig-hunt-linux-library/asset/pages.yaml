- pgno: 391
  md: '**Table 12.2** /etc/ssh/ssh_config Directives (continued)


    | Option | Meaning | Default |

    | :--- | :--- | :--- |

    | SKeyAuthentication | Specifies whether S/Key authentication should be attempted.
    | N/A |

    | StrictHostKeyChecking | Never automatically add remote host key into $HOME/.ssh/known_hosts.
    Rely on its existence for the connection to succeed. | N/A |


    Out of these client options, you should always specify the following settings:


    ```

    RhostsAuthentication no

    FallbackToRsh no

    StrictHostKeyChecking yes

    ```


    The first two settings disable the use of rhosts authentication and the use of
    the insecure rsh command. The third setting forces your client to know the public
    key of the remote host in advance. This makes it impossible for an intruder to
    stage a man-in-the-middle attack, impersonating the server to which you''re trying
    to connect. The drawback is that you''ll have to collect all the host keys of
    the servers to which you typically connect and store them in your $HOME/.ssh/known_hosts
    file.


    # A Word About RSA Authentication


    As of September 2000, RSA Security, Inc. no longer holds the patent to the RSA
    algorithm for public-key authentication. This means that you can create a public/private
    RSA key pair on your client machine and distribute the public pair to the administrator
    of any Linux server to which you want to authenticate securely.


    Start by running the ssh-keygen to generate the pair in your home directory. This
    command is run as a regular user. Each of your users should run ssh-keygen to
    create their own sets of keys. Here''s an example of the ssh-keygen command in
    action:


    ```

    [ramon]$ ssh-keygen

    Generating RSA key: Key generation complete.

    Enter file in which to save the key (/home/ramon/.ssh/identity):

    Enter passphrase (empty for no passphrase):

    ```'
