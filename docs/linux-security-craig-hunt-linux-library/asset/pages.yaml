    # Installing the FWTKit Firewall Toolkit


    Due to the special terms and conditions in the licensing agreement, FWTKit is
    only available for download via FTP from the TIS FTP site. You have to read the
    license, agree to it, and register your identity on their site before actually
    downloading the software. Start this process by reading the text file located
    at ftp://ftp.tislabs.com/firewall/toolkit/LICENSE.


    After you''ve reviewed this license agreement and found it acceptable, send an
    e-mail to the address fwtk-request@tislabs.com that contains the word "accepted"
    as the only content in the body of the message. This message is processed automatically
    by TIS''s mailer, which sends you a reply that contains the exact location from
    which to download the software; the directory location is arbitrary and will only
    exist for about 12 hours. Listing 11.1 contains an example of the e-mail you''ll
    receive from TIS acknowledging your request.'
