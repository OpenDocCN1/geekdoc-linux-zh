    # The proxy-type Directives


    Some network architectures are such that a SOCKS5 proxy request must traverse
    another proxy in order to reach the public network. Such a situation is illustrated
    in Figure 10.4, where the SOCKS5 proxy request is traversing a SOCKS4 proxy to
    the Internet. In those cases, the first server must act as a SOCKS5 client to
    the second server. The `proxy-type` directive determines which SOCKS protocol
    the first server uses to contact the second.


    # Figure 10.4


    A SOCKS5 request traversing a SOCKS4 server on its way to an external Web server


    ![](img/3258bbaf790525f8c4eb25fabff7844a_312_0.png)


    **Syntax** `proxy-type dest-host dest-port proxy-server-address`


    In this syntax, `proxy-type` can be one of the following:


    +   - Socks4 (= SOCKS version 4)

    +   - Socks5 (= SOCKS version 5)

    +   - NoProxy (= direct connection, no proxying)


    The arguments to the `proxy-type` directives are as follows:


    +   - `dest-host` is the IP address for the host or network to be proxied.

    +   - `dest-port` is the port number for the request to be proxied.

    +   - `proxy-server-address` is the IP address for the proxy host to which to
    send the request.


    # Examples


    Consider the configuration in Figure 10.4. Proxy #1 is dual-homed, with addresses
    192.168.32.1 and 192.168.64.1. It is protecting Network A (192.168.32.0/24) and
    must proxy through Proxy #2 (192.168.64.1, a SOCKS4 server) in order to reach
    the public network. Proxy #1 would be configured as follows:


    ```

    ```proxygen 192.168.32.1 - -```

    ```'
