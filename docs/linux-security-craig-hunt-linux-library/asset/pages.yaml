    \ to the Nessus server.\n\n> **NOTE** Note that encryption is only available from\
    \ the Unix version of the Nessus client at the moment. I recommend that you only\
    \ use this client because strong authentication and protection of the client-server\
    \ communication is a crucial component of the security of this tool.\n\nUser ramon\
