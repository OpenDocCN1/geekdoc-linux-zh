    \ 0.0.0.0/0 -sport smtp -j$␷$\n  ACCEPT\n  ipchains -A forward -s 38.110.200.0/24\
    \ -d 0.0.0.0/0 -sport http -j$␷$\n  ACCEPT\n  ipchains -A forward -s 38.110.200.0/24\
