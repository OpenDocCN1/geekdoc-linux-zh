  md: "In this case, the file defines a listener for the IMAP service (Internet Mail\
    \ Access Protocol), where only hosts in the 204.154.22.0 class C domain and on\
    \ the local host are allowed to request service. Note that this file temporarily\
    \ disables the service by setting the `disable` keyword to `yes`.\n\nLet's look\
    \ at one more example:\n\n```\n```text\n[ramon]$ sudo more /etc/xinetd.d/tftp\n\
    service tftp\n{\n    socket_type     = dgram\n    wait            = yes\n    user\
    \            = nobody\n    server          = /usr/sbin/in.tftpd\n    server_args\
    \     = /tftpboot\n    access_times    = 01:00-23:00\n    disable         = no\n\
    }\n```\n```\n\nThis is an illustration of a server (`tftpd`) that takes a command-line\
    \ argument (`/tftpboot`, or the location of the TFTP directory). This is handled\
    \ by adding the argument to the `server_args` keyword. Note that this example\
    \ restricts the access times to this service from 1 A.M. to 11 P.M., perhaps due\
    \ to the fact that there is a scheduled maintenance period from 11 P.M. to 1 A.M.\
    \ every day.\n\n# # Starting Network Services from /etc/rc.d\n\nWhile most of\
    \ the core Linux network services are started from `inetd`, an increasing number\
    \ of daemons are being configured to start independently upon system startup.\
    \ This gives application programmers tighter control over the execution of their\
    \ services, and allows them to spawn additional instances of certain daemons,\
    \ sometimes even in advance of receiving a request. This is especially useful\
    \ for high-volume and high-overhead services, like `WWW`, `Sendmail`, `SSH`, etc.\n\
    \nIt is important, however, to maintain all the startup scripts in a central location\
    \ within the filesystem, and Linux uses the `/etc/rc.d` directory as the default\
    \ for this purpose. Within this directory, there are a number of subdirectories\
    \ named in a similar manner:\n\n```\n```bash\n[ramon]$ cd /etc/rc.d\n[ramon]$\
    \ ls -1d rc*.d\n```\n```"
