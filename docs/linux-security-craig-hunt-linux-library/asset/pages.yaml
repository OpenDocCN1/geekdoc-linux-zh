  md: "nomenculture is arbitrary. It’s simply a convenience so you can easily visualize\
    \ which addresses belong on which end of the connection. Using this left and right\
    \ nomenclature allows you to go to the BOSTON gateway and define a mirror image\
    \ ipsec.conf configuration. Ultimately, each gateway determines whether it is\
    \ left or right according to the addresses specified in ipsec.conf and according\
    \ to the addresses configured on its own interfaces. If neither right nor left\
    \ match a local interface, Pluto reports the error \"unable to orient connection.\"\
    \ Listing 12.3 contains an example of the conn section of ipsec.conf.\n\n# **Listing\
    \ 12.3** Defining an Ipsec connection in the /etc/ipsec.conf file\n\n```\n# Tunnel\
    \ from Denver to Boston\nconn denver-boston\n    # left security gateway (public-network\
    \ address)\n    left=65.66.67.10\n    # next hop to reach right\n    leftnexthop=65.66.67.11\n\
    \    # subnet behind left\n    leftsubnet=10.10.10.0/24\n    # RSA key for left\n\
    \    leftrsakey=0x0103ccec0dfafeb7b000d...\n    # right security gateway (public-network\
    \ address)\n    right=65.55.76.10\n    # next hop to reach left\n    rightnexthop=65.55.76.11\n\
    \    # subnet behind right\n    rightsubnet=10.20.20.0/24\n    # RSA key for left\n\
    \    rightskey=0x0103b81976c76cb5e1e4...\n    auto=start\n```\n\nThe configuration\
    \ in Listing 12.3 is simply an enumeration of the interfaces used in Figure 12.7\
    \ starting with the left security gateway, which is the public address of the\
    \ DENVER Linux server. The leftnexthop is the address of the router to which the\
    \ DENVER gateway must send packets in order to forward them toward the BOSTON\
    \ gateway. Note that this is typically the internal address of the access router\
    \ provided by your ISP. The leftsubnet is simply the address used by the internal\
    \ hosts in the ACME LAN in Denver (behind the Linux server). The leftrsakey contains\
    \ the public half of the RSA key used by the DENVER gateway for IKE authentication."
