    \ set to yes.\n\n# Listing 4.5    The S20rwhod startup script\n\n```\n[ramon]$\
    \ more S20rwhod\n#!/bin/sh\n# Copyright (c) 1998, 2000 SuSE GmbH Nuernberg, Germany.All\
    \ rights reserved.\n#\n# /sbin/init.d/rwhod\n#\n. /etc/rc.config\n\nbase=${0##*/}\n\
    link=${base##[SK]}[0-9]-[0-9]\n\ntest $link = $base && START_RWHOD=yes\ntest \"\
    ${START_RWHOD}\" = yes || exit 0\n\nreturn=$rc_done\ncase '$1' in\n    start)\n\
    \        echo -n \"Starting rwho daemon\"\n        startproc /usr/sbin/rwhod ||\
