    # # mod_ssl


    Originally developed by Ralf S. Engelschall in early 1998, mod_ssl is the Web
    interface to the popular OpenSSL implementation by Eric Young and Tim Hudson.
    This implementation takes advantage of Apache''s modular architecture and implements
    the Secure Sockets Layer extension as an external module in the standard Apache
    source tree.


    The Secure Sockets Layer (SSL) allows for data privacy. Both endpoints of the
    communication conduct a preliminary handshake and define a secret key to be used
    for data encryption with a symmetric key algorithm such as DES or RC4. SSL also
    ensures the integrity of the data being exchanged using a message-digest algorithm
    such as SHA or MD5. Prior to communicating, SSL endpoints must authenticate each
    other using public key cryptography, where each end of the connection must present
    a digital certificate (typically in X.509 format) signed by a certificate authority
    (CA) that is commonly trusted.


    Netscape developed the original SSL specification. Based on its widespread success,
    the IETF drafted a similar standard called Transport Layer Security (TLS) in RFC2246.
    TLS 1.0 is based on SSL v.3, and although it provides a way by which TLS peers
    can back down to SSL v.3, TLS is largely incompatible with SSL. OpenSSL supports
    both SSL and TLS.


    By interposing OpenSSL between the TCP layer and the HTTP application layer, mod_ssl
    adds strong authentication, data integrity, and privacy to the transfers between
    the Web client and the Apache HTTP server using both SSL and TLS. Note that mod_ssl
    can coexist with the non-secure version of Apache. In fact, while plain HTTP uses
    TCP port 80 for control and data exchanges, all HTTPS (secure HTTP or HTTP over
    SSL) traffic goes to TCP port 443 on the Linux server.


    mod_ssl is protected by the standard BSD license, which makes it freely distributable
    for both commercial and non-commercial use. At the writing of this book, mod_ssl
    makes up over 10% of the total Apache installations on the Internet, and that
    number has grown'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'steadily during the last two years. The mod_ssl project Web page is very informative
    and up to date. It can be found at www.modssl.org (see Figure 7.2).


    # Figure 7.2  The mod_ssl Project home page


    ![](img/3258bbaf790525f8c4eb25fabff7844a_221_0.png)


    # Installing mod_ssl


    While most Linux distributions some standard with Apache, very few include mod_ssl
    by default. The package is readily available in RPM format, however. To install
    it, start by making sure that Apache and OpenSSL are installed also using this
    rpm command:


    ```

    [ramon]$ rpm -q apache openssl

    apache-1.3.14-3

    openssl-0.9.5a-14

    ```


    Then simply execute the following commands to install mod_ssl, if it is not installed
    already:


    ```

    [ramon]$ rpm -q mod_ssl

    package mod_ssl is not installed

    [ramon]$ sudo rpm -i mod_ssl-2.7.1-i386.rpm

    ```'
