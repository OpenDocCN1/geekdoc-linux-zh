  md: '100 Chapter 4 Network Services Configuration


    # xinetd: The Next Generation inetd


    When Panos Tsirigotis of the Computer Science Department at University of Colorado
    at Boulder realized that most Linux network administrators were using TCP Wrappers
    in conjunction with inetd, he set off to come up with a tool that would offer
    the features from both applications. The result was xinetd, the extended Internet
    services daemon.


    On the surface, xinetd works just like inetd, acting as a super-server that inspects
    all incoming connections and spawns the appropriate server program to handle each
    connection. Like inetd, xinetd can also be started with a -d option to force more
    verbose output for debugging purposes:


    ```

    `[ramon]$ sudo /usr/sbin/xinetd -d`

    ```


    But the real advantage of xinetd over its predecessor is its security features.
    While inetd with TCP Wrappers can block incoming connections based on source/destination
    IP addresses and port numbers, xinetd allows the screening of connections based
    on


    +   • Rate of incoming connections (useful to thwart denial-of-service attacks)

    +   • Total number of connections for a particular service

    +   • Number of incoming connections from specific hosts

    +   • Time of the day


    In addition, you can define limits on the size of the log files that the service
    creates so that a potential attacker can''t stage a denial-of-service attack on
    your server by filling your disk with logging information. Finally, xinetd lets
    you define a forwarding rule by which incoming connections can be redirected to
    other hosts in the private network (for example) that need not be reachable from
    the public Internet.


    # Installing xinetd


    While Red Hat Linux 7.0 includes xinetd as part of the standard distribution,
    most Linux vendors have not yet bundled xinetd into their product. You can easily
    obtain the RPM version of the xinetd package from a trusted archive like www.rpmfind.net.
    To install xinetd, enter the following command:


    ```

    `[ramon]$ sudo rpm -i xinetd-2.1.8.9pre9-6.1386.rpm`

    ```


    This package installs the server executable (/usr/sbin/xinetd), as well as the
    man pages and a startup file (/etc/rc.d/init.d/xinetd).


    # Configuring xinetd with /etc/xinetd.conf


    The xinetd daemon is started by Linux at system startup, and its configuration
    is obtained from /etc/xinetd.conf, as well as from all the files in the /etc/xinetd.d/'
  merge: -1
  img_proc: true
- pgno: 119
  md: "directory. Each file in this directory contains the `xinetd` configuration\
    \ for a particular service. (Each file is the equivalent of a single line of `/etc/inetd.conf`.)\
    \ For example, the following directory listing of `/etc/xinetd.d/` shows that\
    \ this system has been configured to offer `telnet`, `tftp`, and `imap` services\
    \ via `xinetd`:\n\n```\n[ramon]$ ls -l /etc/xinetd.d/*\n-rw-r--r-- 1 root root\
    \ 169 Feb 3 17:18 tftp\n-rw-r--r-- 1 root root 322 Mar 16 23:28 imap\n-rw-r--r--\
    \ 1 root root 318 Feb 3 17:18 telnet\n```\n\nA typical file in this directory\
    \ looks like the following:\n\n```\nservice service_name\n{\nkeyword = value value\
    \ value ...\nkeyword += value value value ...\nkeyword -= value value value ...\n\
    ...\n}\n```\n\n`service_name` is the actual name of the service to listen for\
    \ (for example, `telnet`, `ftp`, `finger`, etc.), as defined in the `/etc/services`\
    \ file. The `keyword` field defines a set that can be assigned one or more values\
    \ (`=`), appended one or more values (`+=`), or reduced by one or more values\
    \ (`-=`). The following are some of the most useful keywords supported by the\
    \ `xinetd` utility:\n\n+   - **disable**\n+     Setting the `disable` keyword\
    \ to `yes` results in the service not starting. Set this keyword to `no` to enable\
    \ the service to listen for. This keyword is useful for temporarily disabling\
    \ a service without having to delete the file from the `/etc/xinetd.d/` directory.\n\
    +   \n+   - **socket_type**\n+     The `socket_type` keyword can have a value\
    \ of `stream`, `dgram`, `raw`, `rdm`, or `seqpacket`. In a typical Internet Linux\
    \ server, you should use only `stream` (for TCP sockets) and `dgram` (for UDP\
    \ sockets).\n+   \n+   - **protocol**\n+     The `protocol` keyword is the type\
    \ of transport layer protocol that the daemon uses. It is one of the choices in\
    \ `/etc/protocols` (e.g., `tcp`, `udp`).\n+   \n+   - **wait**\n+     The `wait`\
    \ attribute determines whether the service is single-threaded or multithreaded.\
    \ If its value is set to `yes`, the service is single-threaded; this forces `xinetd`\
    \ to start the server and stop handling requests for the service until the server\
    \ dies. If the value is set to `no`, `xinetd` continues to handle new requests\
    \ after starting the server."
