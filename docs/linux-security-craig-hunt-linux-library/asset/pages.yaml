  md: "access control or because of limits imposed on resource allocation. The value\
    \ can be one of the following:\n\n+   - **HOST**: Log the remote host address.\n\
    +   - **USERID**: Log the user ID of the remote process.\n+   - **ATTEMPT**: Log\
    \ the fact that the attempt was made.\n\n**bind** The `bind` keyword specifies\
    \ the interface or IP address to listen on. This lets you run a server on only\
    \ the secure interface of a multi-homed server, for example.\n\n**redirect** The\
    \ `redirect` keyword specifies the IP address and port number to which `xinetd`\
    \ should forward incoming connections. When a connection is received for the specified\
    \ service, `xinetd` spawns a process to forward the connection to the given IP\
    \ address and an optional TCP port.\n\n# xinetd Configuration Examples\n\nThe\
    \ main `xinetd` configuration file resides in `/etc/xinetd.conf`, and typically\
    \ contains a `defaults` section with parameters that affect all services, along\
    \ with an `includedir` statement that effectively pulls in all service-specific\
    \ files in the target directory (`/etc/xinetd.d`, in this case). Listing 4.3 illustrates\
    \ a typical `/etc/xinetd.conf` file.\n\n```\n**Listing 4.3 A typical default /etc/xinetd.conf\
    \ file**\n\n# \n# Simple configuration file for xinetd\n#\n# Some defaults, and\
    \ include /etc/xinetd.d/\n\ndefaults\n{\n        instances             = 60\n\
    \        log_type              = SYSLOG authpriv\n        log_on_success     \
    \   = HOST PID\n        log_on_failure        = HOST\n}\n\nincludedir /etc/xinetd.d\n\
    ```\n\nNote that the file in Listing 4.3 limits the total number of concurrent\
    \ `xinetd` instances for a given service to 60. In addition, it requests that\
    \ logging be performed via the `authpriv` facility of the standard `syslog` system.\
    \ Successful connection attempts log the connecting host and the process ID, and\
    \ failed connection attempts log the host name only."
