- pgno: 379
  md: 'tunneling, so all PPTP implementations rely on an existing (or bundled) PPP
    installation. While PPTP is primarily a packet encapsulation standard, it includes
    provisions to add connection security in two areas:


    **Authentication** PPTP uses the authentication methods typically supported by
    PPP devices, both Microsoft and third-party devices such as PAP (Password Authentication
    Protocol), which is actually not secure at all, and CHAP (Challenge Handshake
    Authentication Protocol), including its Microsoft and Shiva variants.


    **Privacy** Microsoft defined an optional encryption protocol to be used to protect
    the privacy of PPTP packet payload as it traverses an untrusted network. The Microsoft
    Point-to-Point Encryption (MPPE) protocol uses the RC4 encryption algorithm with
    the password as the seed to generate session keys for encryption.


    A PPTP client (typically a Windows laptop or home user) works directly with the
    PPTP server at the edge of the corporate LAN, as illustrated in Figure 12.9.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_379_0.png)


    Once the PPTP client has established IP connectivity, typically over PPP to the
    ISP''s nearest remote access server (RAS), it uses PPTP messages (which run on
    top of TCP) to establish a connection to the PPTP server and negotiate a set of
    tunnel addresses. The PPP process at the PPTP server assigns both a local and
    a remote address for the resulting PPP tunnel. After the user has authenticated
    successfully, a Generic Routing Encapsulation (GRE) session is built from end
    to end that sustains the PPP connection just negotiated. Only after'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'these steps have taker place can both peers start exchanging IP packets. Note
    that the addresses of the PPP-encapsulated IP packets are negoiatied by the two
    endpoints and do not have to be legal Internet addresses.


    > **NOTE**   While the PPTP specification is solid overall, Microsoft''s implementation
    has come under scrutiny over the last few years. Some improvements have been made,
    but I recommend that you take a quick look at http://www.counterpane.com/ppp-faq.html
    for more information on this controversy.


    While Microsoft bundles both a client and a server implementation in its Windows
    platforms, there is an open-source PPTP server for Linux that can interoperate
    with the Windows-supplied clients. This implementation, called PopTop, is discussed
    in the next section.


    # # PopTop


    PopTop is an implementation of the PPTP protocol that includes a Linux port, as
    well as many other UNIX variants. It consists of


    +   - A simple daemon (pptpd)

    +   - A configuration file named /etc/pptpd.conf

    +   - A set of man pages and supporting documentation.


    PopTop is intereoperable with Microsoft Windows 95, 98, NT, and 2000 clients.
    Its home page can be found at http://pptop.linoe.com, and a well-frequented mailing
    list can be accessed by subscribing at that Web site.


    # ## Downloading PopTop


    PopTop is available on most repositores of RPM format packages. Simply download
    the latest distrobution and install as follows:


    ```

    [ramon]$ sudo rpm -i pptpd-1.1.1-1.i686.rpm


    You''ll see the main PPTP daemon executable in /usr/sbin/pptpd and a sample configuration
    file in /etc/pptpd.conf .


    To make sure you have PPP installed (you''ll need version 2.3.5 or later), execute
    the following command:


    [ramon]$ rpm -q ppp

    ppp-2.3.11-7

    ```'
  merge: -1
