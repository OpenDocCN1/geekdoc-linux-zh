  md: 'Before proceeding with the installation, take a look at the `install.cfg` file,
    which contains a number of environment variables that control the installation
    process. Table 3.2 shows the options that you should examine, along with their
    default settings. I recommend that you change the value of **TWROOT** to the location
    where you normally install system tools (for example, `/usr/local/`*tripwire*)
    because most other environment variables build on this base directory.


    > **NOTE** Despite my suggestion, I use `/usr/TSS` in these examples to make the
    text more compatible with other *tripwire* documentation.


    **Table 3.2** *tripwire install.cfg* Environment Variables


    | Variable | Description | Default |

    | :--- | :--- | :--- |

    | **TWROOT** | The root directory | `/usr/TSS` |

    | **TWEIN** | Location of the program executables and configuration files | `${TWROOT}/bin`
    |

    | **TWPOLICY** | Location of policy files | `${TWROOT}/policy` |

    | **TWMAN** | Location of the *man* pages | `${TWROOT}/man` |

    | **TWDB** | Location of the databases | `${TWROOT}/db` |

    | **TWSITEKEYDIR** | Location of key used to secure the configuration and policy
    files | `${TWROOT}/key` |

    | **TWLOCALKEYDIR** | Location of key used to secure database files and reports
    | `${TWROOT}/key` |

    | **TWREPORT** | Location of results of integrity checks | `${TWROOT}/report`
    |


    Next, simply execute the supplied *install.sh* script as the root user:


    ```

    `[ramon]$ sudo ./install.sh`

    ```


    During the installation process, you are prompted to enter a passphrase to protect
    the confidentiality and integrity of the configuration and policy files. You are
    also asked to enter the name of the database that will eventually contain the
    signatures to the system files that you choose to monitor. Choose a good passphrase
    composed of at least 16 characters. (*tripwire* accepts passphrases of up to 1023
    characters!)'
