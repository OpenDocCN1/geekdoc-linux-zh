- pgno: 381
  md: '# Configuring PopTop


    Let''s start by configuring the PPP layer. Edit the /etc/ppp/options file and
    make sure that it contains the following options:


    +   - name athena: This is the name of the local system.

    +   - auth: This option requires the peer to authenticate itself.

    +   - require-chap: This option specifies to only accept CHAP authentication.

    +   - proxyarp: This option adds an entry to this system''s ARP (Address Resolution
    Protocol) table with the IP address of the peer and the Ethernet address of this
    system.


    The require-chap setting ensures that PPP requires the remote end to authenticate
    itself using the CHAP algorithm. Avoid using PAP because it sends the username
    and password in the clear (unencrypted or unhashed). In addition, the proxyarp
    setting specifies that the PPTP server listen for proxy requests for the remote
    user and forward packets to them accordingly.


    You should also set up some basic authentication. Let''s start by creating some
    entries in /etc/ppp/chap-secrets of the following form:


    ```

    alice athena     ''alicepassWord"      10.20.20.100

    bob  athena     ''bobpassWord"       10.20.20.101

    charlie athena  ''charliepassWord"   10.20.20.102

    ```


    Using these settings, you will now accept CHAP authentication requests for alice,
    with password alicepassWord. The second field is simply a reference to the local
    server (rechat). The fourth field contains the IP address that will be assigned
    to the user''s end of the PPP connection.


    Finally, create the /etc/pptpd.conf file and insert the following sample values:


    ```

    localip 192.168.1.1

    remoteip 10.20.20.100-254

    ```


    The localip value can be the same for all connections; it is simply the local
    end of the PPP tunnel established to support all incoming PPTP connections. While
    the local end can be common, there is a requirement that the remote end be uniquely
    addressed. The remoteip line specifies the range of IP addresses that incoming
    clients will use for that purpose.


    > NOTE If you do not allow a large enough remoteip range to accommodate enough
    concurrent users, connections that exceed the allocated number will be turned
    away.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# # Running PopTop


    Once you have configured the PPP layer and the PPTP daemon, make sure that the
    process starts with every system start:


    ```

    /usr/sbin/pptpd

    ```


    Note that the pptpd daemon automatically sends itself to the background if invoked
    from a terminal. Don’t forget to set the Linux server to forward packets:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    PPTP uses destination port TCP 1723 on the Linux server and IP protocol ID 47
    to exchange the data once the control connection has been established. If you
    are using Iptables to filter packets at the network layer, you need to allow these
    two ports through the filter.


    Figure 12.10 illustrates a typical use of the PPTP protocol. One of ACME’s remote
    users is in a hotel room, dialing into the local ISP. That user has established
    a PPP session to the hub’s RAS that connects to ACME’s Boston PPTP server via
    IP end to end. If authentication is successful, the remote user sees a virtual
    interface on the laptop with the address 10.20.20.100. This interface “appears”
    to the Boston LAN as if it were a local interface. This allows the remote user
    to access resources in the local network 10.20.20.0/24 as if the laptop is physically
    connected to it.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_382_0.png)


    # Configuring the PPTP Client on Windows 2000


    Here is how to configure your users’ Windows 2000 Professional systems to connect
    to the Linux PPTP server that you’ve just built.'
