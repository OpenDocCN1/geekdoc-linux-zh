    \ the SOCKS5 server. To install and configure SOCKSCap, just follow these simple\
    \ steps:\n\n+   1. Download the self-extracting SOCKSCap binary from www.socks.nec.com.\
    \  \n+   2. Double-click the binary and follow the directions of the Install wizard.\
    \  \n+   3. Once the installation is complete with no errors, start the application.\
    \ On its first execution, it prompts you to enter the initial configuration (see\
    \ Figure 10.5). While SOCKSCap supports both the SOCKS4 and SOCKS5 protocol, I\
    \ strongly suggest that you use SOCKS5 for all your clients when possible. Don't\
    \ forget to click the Username/Password checkbox at the bottom of the Settings\
    \ window.\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_325_0.png)\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_325_1.png)\n\
    \n+   4. From this point forward, simply invoke the SOCKSCap application from\
    \ the Start menu. When configured for SOCKS5, SOCKSCap prompts you for your SOCKS5\
    \ username/password (as shown in Figure 10.6). This is the authentication information\
    \ that SOCKSCap uses on behalf of all your SOCKS5-enabled applications."
