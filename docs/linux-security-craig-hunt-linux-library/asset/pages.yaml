- pgno: 138
  md: "# The /etc/services File\n\nThe /etc/services file is found in every Linux\
    \ installation, and it provides a mapping between a numeric transport layer port\
    \ number (TCP/UDP) and a character string used to refer to this service. For example,\
    \ the /etc/services file is where the system utilities find that ftp uses port\
    \ 21/TCP while snmp uses 161/UDP. The general syntax of the file is\n\n```\nservice-nameport/protocol#comment\n\
    ```\n\nThe meanings of these fields are as follows:\n\n+   * service-name is the\
    \ string to be looked up (ftp, snmp, telnet, etc.)\n+   * port is the numeric\
    \ port number (21, 161, etc.).\n+   * protocol is either TCP or UDP.\n+   * #comment\
    \ can also be a list of aliases for the given service-name.\n\nListing 4.10 lists\
    \ the top of a typical /etc/services file found on a Linux system.\n\n# Listing\
    \ 4.10 Partial detail of a Linux /etc/services file\n\n```\n[ramon]$ more /etc/services\n\
    # /etc/services:\n# $Id: services,v 1.4 1997/05/20 19:41:21 tobias Exp $\n#\n\
    # Network services, Internet style\n#\n# Note that it is presently the policy\
    \ of IANA to assign a\n# single well-known port number for both TCP and UDP; hence,\n\
    # most entries here have two entries even if the protocol\n# doesn't support UDP\
    \ operations. Updated from RFC 1700,\n# ``Assigned Numbers`` (October 1994). Not\
    \ all ports\n# are included, only the more common ones.\n\ntcpmux\t1/tcp\t\t#\
    \ TCP port service multiplexer\n\techo\t7/tcp\n\techo\t7/udp\n\ndiscard\t9/tcp\t\
    \tsink null\n\tdiscard\t9/udp\t\tsink null\n\tsystat\t11/tcp\t\tusers\n\tdaytime\t\
    13/tcp\n\tdaytime\t13/udp\n\tnetstat\t15/tcp\n\tqotd\t17/tcp\t\tquote\n```"
