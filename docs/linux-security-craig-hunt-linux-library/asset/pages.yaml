    directive. The `pam_limits` module is used to set limits on the system resources
    that can be obtained in a user session, such as the maximum number of open files,
    the maximum number of concurrent processes, etc. Finally, the `pam_console` module
    awards the user certain privileges only when they are physically logged onto the
