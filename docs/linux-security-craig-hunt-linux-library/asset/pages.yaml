    As you can see, setting up a small, purpose-built public-key infrastructure is
    not as challenging as you might think. Apache, OpenSSL, and mod_ssl are the only
    ingredients you need to build a certificate-driven authentication system to scale
    to thousands of users.


    # ## Apache-SSL


    Developed by Apache core team member Ben Laurie in the United Kingdom, Apache-SSL
    was actually the precursor of mod_ssl. While they have followed different development
    paths over the last two years, both distributions provide equivalent functionality:
    the addition of SSL/TLS security to the base HTTP protocol.


    **Application Security**


    **PART 3**'
