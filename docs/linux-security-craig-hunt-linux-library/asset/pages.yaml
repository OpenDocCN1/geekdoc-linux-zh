- pgno: 237
  md: '# # Installing Samba


    Most recent Linux distributions include the Samba server right out of the box.
    Here''s how you can make sure Samba is installed on Red Hat 7.0:


    ```

    ```bash

    [ramon]$ rpm -q samba samba-common

    samba-2.0.7-21ss1


    samba-common-2.0.7-21ss1

    ```

    ```


    Two packages make up a complete Samba installation:


    +   * samba-2.0.7-21ss1 This is the base Samba server package and it includes
    the following files:

    +       * Server executable

    +       * Startup scripts

