    \  `CERT_DIR/private/cakey.pem')dn1\n```\n\nThe commands in Listing 6.3 are pointing\
    \ Sendmail to the appropriate files in the CA that you built back in Listing 6.2.\n\
    \n+   • `CERT_DIR` (and `CERT_PATH`): The directory where the CA is located (`/etc/mail/CA`)\
    \  \n+   • `CACERT`: The root CA certificate (`cacert.pem`)  \n+   • `SERVER_CERT`:\
    \ The certificate for the Sendmail server (`newcert.pem`)  \n+   • `SERVER_KEY`:\
