- pgno: 226
  md: '# Figure 7.4 Certificate window, General tab: Certificate Information


    ![](img/3258bbaf790525f8c4eb25fabff7844a_226_0.png)


    # Using a Self-Signed Certificate


    mod_ssl makes it extremely easy to jump-start the process of creating your own
    self-signed digital certificate to authenticate the Apache server to a Web browser.
    There are two files of interest:


    +   - `/etc/httpd/conf/ssl.key/server.key`: This file is the secret half of the
    server''s private/public pair.

    +   - `/etc/httpd/conf/ssl.cert/server.cert`: This file is the server''s digital
    self-signed certificate.


    The mod_ssl installation comes with two dummy files in place of the files above,
    so start by deleting these two dummy files:


    ```

    [ramon]$ sudo rm /etc/httpd/conf/ssl.key/server.key

    [ramon]$ sudo rm /etc/httpd/conf/ssl.cert/server.cert

    ```


    Next, use the Makefile provided in the /etc/httpd/conf directory to create a new
    server key and a new server certificate. Listings 7.7 and 7.8 show the steps involved.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Listing 7.7 Creating a new server key


    ```

    [ramon]$ cd /etc/httpd/conf

    [ramon]$ sudo make genkey

    umask 77 ; \\

    /usr/bin/openssl genrsa -des3 1024 >\\

    /etc/httpd/conf/ssl.key/server.key

    warning, not much extra random data, consider using the -rand option

    Generating RSA private key, 1024 bit long modulus

    .............+++++

    ............+++++

    e is 65537 (0x10001)

    Enter PEM pass phrase:

    Verifying pass phrase - Enter PEM pass phrase:

    ```


    The make genkey command invokes openssl to generate an RSA public/private key
    pair. This command prompts you for a passphrase, which will be used to protect
    the private key as it sits on the disk. This is done by PEM-encoding the key with
    the passphrase so you should use an actual phrase, with at least a half-dozen
    words; don''t use just a single password.


    Next, issue the commands in Listing 7.8 to create an X.509 certificate for your
    server.


    # Listing 7.8 Creating a new server certificate


    ```

    [ramon]$ cd /etc/httpd/conf

    [ramon]$ sudo make testcert

    umask 77 ; \\

    /usr/bin/openssl req -new -key /etc/httpd/conf/ssl.key/server.key\\

    -x509 -days 365 -out /etc/httpd/conf/ssl.crt/server.crt

    Using configuration from /usr/share/ssl/openssl.cnf

    Enter PEM pass phrase:

    You are about to be asked to enter information that will be

    incorporated into your certificate request.

    What you are about to enter is what is called a Distinguished Name

    or a DN.

    There are quite a few fields but you can leave some blank

    For some fields there will be a default value,

    If you enter ''.'', the field will be left blank.

    -----

    Country Name (2 letter code) [AU]:US

    State or Province Name (full name) [Some-State]:Virginia

    Locality Name (eg, city) []:Ashburn

    ```'
  merge: -1
