- pgno: 78
  md: 'There are three commands that support the operation of the CFS package:


    ```

    ```

    cmdir [-1] [private_directory]


    cattach [private_directory] [cleartext_directory]


    cdetach [private_directory]

    ```

    ```


    Start by creating a directory that is going to contain all your confidential information:


    ```

    ```bash

    [ramon]$ cmdir secret

    ```

    ```


    The command prompts you for a passphrase, which is then used to hash out an appropriate
    secret encrypting key. You''ll need this passphrase to be able to get at the data
    in this directory.


    > **WARNING**  Note that by default, CFS uses the 3DES algorithm for encryption.
    This is noticeably slower than the DES variant that can be specified using the
    -1 switch: (# cmdkir -1 secret). I strongly recommend against this option, because
    the DES algorithm has been known to be vulnerable to brute force attacks. If you''re
    encrypting data that you expect to keep around for a while, you should make it
    as resistant as possible to cryptanalysis.


    The next step is to attach this newly created directory to the master CFS tree:


    ```

    ```bash

    [ramon]$ cattach secret decrypted

    ```

    ```


    You are then prompted for the same passphrase that you provided when you created
    the directory. If you authenticate successfully, the secret directory will be
    available to you as /crypt/decrypted in cleartext form. Once you''re done working
    with the clear text directory, simply make it unavailable using the following
    command:


    ```

    ```bash

    [ramon]$ cdetach secret

    ```

    ```


    As with any other encryption, CFS is only as strong as your ability to protect
    the passphrase used to encrypt the data. In addition, you should ensure the integrity
    of the CFS utilities themselves (cmdir, cattach, cdetach) to be sure that they
    have not been replaced with Trojan horse versions. Chapter 3 shows you to use
    file integrity tools to ensure that these and other important system utilities
    have not been tampered with.


    # Practical Privacy Disk Driver


    A more recent alternative to CFS is Allan Latham''s Practical Privacy Disk Driver
    (PPDD). Unlike CFS, this utility actually creates a disk driver similar to a physical
    disk device, but its behavior is controlled by the PPDD software. Also unlike
    CFS, there is built-in support'
