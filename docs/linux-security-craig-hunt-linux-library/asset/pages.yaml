  md: '**WARNING** Only use the `opiepasswd` command when logged in using a secure
    terminal, one that is physically connected to the target system, typically the
    system console. If exposed in the clear, the secret passphrase is subject to eavesdropping,
    which defeats the whole purpose of using one-time password authentication.


    As you can see, there are three arguments to the `opiepasswd` command:


    ```

    opiepasswd -c -n sequence username

    ```


    These fields have the following meanings:


    +   - The `--c` argument informs the utility that you are using a secure terminal,
    and it is okay to set the passphrase over this connection.

    +   - The `--n sequence` argument sets the number of one-time passwords on the
    sequence (more on that in the next section).

    +   - The `username` informs `opiepasswd` of the username for which it is initializing
    a secret passphrase.


