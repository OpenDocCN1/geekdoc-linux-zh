- pgno: 193
  md: 'key technology in a mass scale, Pretty Good Privacy (PGP) has been providing
    this end-to-end service for the last ten years. The next section is devoted to
    PGP and its open-source variants.


    # # PGP and GnuPG


    In 1991, Phil Zimmermann recognized the need to provide confidentiality at the
    application level, so he set off to build a tool that would allow users to add
    confidentiality to their e-mail applications. The package was named Pretty Good
    Privacy (PGP) and it made use of public-key technology to encrypt and digitally
    sign any document before sending it on the public Internet. PGP quickly became
    the most widely used mail encryption tool in the world.


    Unlike the current public key infrastructure schemes, which rely on a hierarchical
    trust structure, PGP is based on a *trust-chain* model, where users securely store
    other user’s public keys, and make (transitive) decisions of trust based on signatures
    from those keys. Although the package was initially open source, later PGP versions
    were developed under the auspices of MIT, ViaCrypt, PGP, Inc. and, more recently,
    Network Associates, Inc. There are currently at least three different distributions
    of PGP:


    **PGP (Commercial)** This is the original product that was developed by PGP, Inc.
    (Phil Zimmermann’s company). In 1997, Network Associates, Inc. (NAI) acquired
    PGP, Inc., and NAI still supports and distributes both a commercial and a freeware
    version of PGP that’s based on the MIT work. Phil Zimmermann serves as a Senior
    Fellow at NAI.


    **PGPi** This is the international version of PGP that was first created by exporting
    the PGP source code in printed format and scanning it using optical character
    recognition (OCR) into electronic source files. This was done to circumvent U.S.
    trade laws regulating the exportation of cryptographic material. In September
    of 1999, the U.S. government lifted a number of these restrictions, making it
    possible for NAI to export the product in electronic form. Development of PGPi
    continues today, but their focus has changed from OCR scanning to “development,
    porting, translation, and localization,” according to its supporters. While personal
    use of PGPi is unrestricted and the source code is available, commercial use of
    the latest version of PGPi requires a license agreement from NAI.


    **GnuPG** The GNU Privacy Guard (GnuPG) is an open-source PGP implementation.
    It has no relation at all to the original PGP or PGPi, but it is generally interoperable
    with both versions. Unlike PGP and PGPi, GnuPG is made available under the standard
    Gnu General Public License (GPL), so it’s freely usable and distributable.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'In keeping with the Linux tradition of open-source software and unrestricted
    licensing, this chapter will concentrate on GnuPG for the remainder of the discussion.


    # # Installing GnuPG


    While the latest Red Hat Linux distribution includes GnuPG as part of the standard
    installation, most Linux distributions do not. The package is readily available
    in RPM format from your favorite repository. To install GnuPG, simply issue a
    command like the following:


    ```

    `[ramon]$ sudo rpm -i gnupg-1.0.4-5.i386.rpm`

    ```


    This command installs the main GnuPG executable in /usr/bin/gpg. The next section
    shows you how to get started with GnuPG and how to use it to encrypt and sign
    files and e-mail messages.


    > TIP By default, the gpg executable is not suid root. While this is generally
    safer, it does prevent the application from "locking" its memory pages into RAM
    to prevent them from being swapped out to disk. This introduces a security risk
    because it makes it trivial for any local user to scan the swap partitions for
    private keys. I recommend that you make the gpg application suid root using the
    command sudo chmod u+s /usr/bin/gpg. This is safe because the application only
    uses its root privileges for the page-locking operation.


    # # Configuring GnuPG


    As with any public key-driven system, the first step after installing GnuPG is
    to create the public/private key pair that you will use to encrypt and digitally
    sign files and messages. To generate your first key pair, enter the following
    command:


    ```

    ```

    [ramon]$ gpg --gen-key

    public and secret key created and signed

    ```

    ```


    You are prompted for a passphrase that will be used by GnuPG to protect the newly
    created secret key on your disk. This command automatically creates your secret
    *keyring*, which is a file where your secret key material is stored (`~/.gnupg/secring.gpg`,
    by default). In addition, it creates a public keyring (`~/.gnupg/pubring.gpg`)
    where you can manually add keys that are given to you by other users. It''s imperative
    that you sign other users'' public keys as you receive them, and only after you
    verify that they key is indeed valid for that individual. To do this, follow these
    simple steps, starting with the actual importing of the key:


    ```

    ```

    [ramon]$ gpg --import werner.pgp

    gpg: key 575480CD: public key imported

    ```

    ```'
