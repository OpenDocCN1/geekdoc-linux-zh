    # The pam_access Module


    This module provides login access control based on a number of customizable parameters,
    including the user’s login name, host or domain names, Internet addresses or network
    numbers, and even terminal line names for logins from directly connected terminals.
    The pam_access module controls which user can log in from which place. Both login
    successes and failures are logged through the syslog facility.


    The pam_access module is used for account management tasks. It accepts only one
    argument, **accessfile**, which defines the absolute path to the file containing
    pam_access configuration information. As an example, assume that you use pam_access
    authentication for the login facility by specifying the following line in `/etc/pam.d/login`:


    ```

    account required pam_access.so accessfile=/etc/security/access.conf

    ```


    In this example, the **accessfile** argument is defined as `/etc/security/access.conf`,
    which is the default. So in this case, the argument is not actually required but
    including it in the `/etc/pam.d/login` file makes a more complete example. (Because
    it is the default, this section will refer to the file defined by the **accessfile**
    argument as **access.conf** throughout the rest of this discussion.)


    When a login is attempted, the **access.conf** file is scanned for the first entry
    that matches the source of the request. The **access.conf** file uses the following
    syntax:


    ```

    permission:users:origins

    ```


    These fields have the following meanings:


    **permission** The **permission** field contains either a **+** (plus sign) to
    grant access to the listed users or a **–** (minus sign) to deny them access.


    **users** The **users** field identifies who is attempting to gain access. It
    is a list of one or more of the following:


    +   - Login names

    +   - Group names

    +   - The keyword **ALL**, which matches everything'
