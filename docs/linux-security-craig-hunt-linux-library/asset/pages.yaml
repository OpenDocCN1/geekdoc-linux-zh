- pgno: 71
  md: '# #### suid and sgid


    Linux supports device and file permissions for three distinct groups of users,
    each of which is represented by three bits of information in the permissions mask,
    in addition to two special-purpose high-order bits, for a total of 12 bits:


    AAA**B**B**B**C**C**C**D**D**D


    Each of these bits has the following meaning:


    +   AAA setuid, setgid, sticky-bit

    +   BBB user (read, write, execute)

    +   CCC group (read, write, execute)

    +   DDD other (read, write, execute)


    Thus, if we have a new executable file called `report` that we want read, written,
    and executed only by the file’s owner, but read and executed by everybody else,
    we would set its permissions to the appropriate bit-mask value as follows:


    ```

    ```bash

    [ramon]$ chmod 0755 report

    [ramon]$ ls -1 report

    -rwxr-xr-x 1 ramon users 19032 Sep 25 19:48 report

    ```

    ```


    Note that 7 is the octal representation of the binary number 111. The permissions
    displayed include only three bits per portion (user, group, other), while in reality,
    Linux allows you to specify four bits for each of the groups. This is addressed
    by overloading the representation of the third bit with the following values:


    +   x execute

    +   s execute + [setuid or setgid] (applicable only to the user and group portions)

    +   S [setuid or setgid] (applicable only to the user and group portions)

    +   t execute + sticky (applicable only to the other portion)

    +   T sticky (applicable only to the other portion)


    Now consider the case where you’d like this file to be executed with root permissions
    because it has to read and write to privileged areas of the file system, but you
    would like nonprivileged users to be able to execute it. You can achieve this
    by setting the very first bit of the permissions mask as follows:


    ```

    ```bash

    [ramon]$ sudo chown root:root report

    [ramon]$ sudo chmod 4755 report

    [ramon]$ ls -1 report

    -rwsr-xr-x 1 root root 19032 Sep 25 20:30 report

    ```

    ```'
