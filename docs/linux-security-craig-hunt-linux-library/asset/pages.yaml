    ```

    ```


    **Ident** (`--with-ident[=path]`) Certain network services are only accessible
    when the client can provide its identity, even after traversing the SOCKS5 firewall.
    The Ident standard (RFC1413) provides a framework for passing extended client
    identity information to public network services. In order to add Ident support
    to NEC SOCKS5, the Ident library and server source should be downloaded from ftp://ftp.lysator.liu.se/pub/ident.
    Alternatively, RPM users can verify that Ident support files are installed as
