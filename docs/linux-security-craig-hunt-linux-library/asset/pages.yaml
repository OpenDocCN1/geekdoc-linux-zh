- pgno: 250
  md: 'Next, issue an `openssl` command to generate the CA’s private key (`ca-key.pem`)
    and its X.509 certificate (`ca-cert.pem`):


    ```

    ```bash

    [ramon]$ sudo openssl req -new -x509 -keyout ca-key.pem -out\\

    c a-cert.pem -days 365 -config openssl.cnf

    ```

    ```


    Now you’re ready to create a new certificate for the Samba server itself and sign
    it with the CA’s secret key. Enter the following commands:


    ```

    ```bash

    [ramon]$ sudo openssl req -nodes -new -x509 -keyout server-key.pem\\

    - out newreq.pem -days 365 -config openssl.cnf

    [ramon]$ sudo openssl x509 -x509toreq -in newreq.pem -signkey\\

    server-key.pem -out tmp.pem

    [ramon]$ sudo openssl ca -config openssl.cnf -policy policy_anything\\

    - out server-cert.pem -infiles tmp.pem

    ```

    ```


    The first command creates a private key for the Samba server (`server-key.pem`)
    and a certificate-signing request (`newreq.pem`). The second and third commands
    take the certificate-signing request and use the CA’s private key to sign the
    certificate. The resulting Samba certificate file is saved as the file `server-cert.pem`.


    You also need to create a certificate for the client (the SSL proxy) because both
    the client and the server will need to authenticate each other. Create this certificate
    using the following commands:


    ```

    ```bash

    [ramon]$ sudo openssl req -nodes -new -x509 -keyout proxy-key.pem\\

    - out newreq.pem -days 365 -config openssl.cnf

    [ramon]$ sudo openssl x509 -x509toreq -in newreq.pem -signkey\\nproxy-key.pem
    -out tmp.pem

    [ramon]$ sudo openssl ca -config openssl.cnf -policy policy_anything\\

    - out proxy-cert.pem -infiles tmp.pem

    ```

    ```


    You now have client and server certificates called `proxy-cert.pem` and `server-cert.pem`
    respectively, as well as corresponding private key files `proxy-key.pem` and `server-key.pem`.
    Note that you need to copy the `proxy-cert.pem` and `proxy-key.pem` files to the
    proxy machine. You’ll learn more about the placement of these files in the section
    “Downloading and Installing SSL Proxy” later in this chapter.


    Congratulations! You have now completed the OpenSSL configuration necessary to
    tunnel SMB requests over SSL. Next, you need to inform Samba of the existence
    of this configuration, by entering the appropriate directives in the `/etc/samba/smb.conf`
    file. This is the topic of the next section.


    **Configuring Samba for SSL support**   Table 8.1 lists the syntax of the directives
    necessary to make Samba SSL-aware, along with their meaning.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '| Directive | Meaning |

    | :--- | :--- |

    | `ssl = [yes|no]` | Add SSL support. |

    | `ssl hosts = host1 host2 ..` | Hosts that must always use SSL to connect to
    this server |

    | `ssl hosts resign = host1 host2 ..` | Hosts that do not use SSL to connect to
    this server |

    | `ssl CA certDir` | Directory location of the certificates |

    | `ssl CA certFile` | File containing all certificates |

    | `ssl server cert` | Location of the server''s certificate |

    | `ssl server key` | Location of the server''s private key |

    | `ssl cyphers` | Cypher suite used during protocol negotiation |


    Using the directories in which the CA key and certificates were created in the
    previous section, the following smb.conf syntax configures SSL support into your
    Samba server:


    ```

    [global]

    ssl = yes

    ssl hosts = 209.1.78.

    ssl hosts resign = 209.1.78.1

    ssl CA certFile = /etc/samba/CA/ca-cert.pem

    ssl server cert = /etc/samba/CA/server-cert.pem

    ssl server key = /etc/samba/CA/server-key.pem

    ```


    In this example, you''re forcing all SSL proxies on the 209.1.78.0/24 network
    to use SSL, except for 209.1.78.1. Note that while ssl CA certDir allows you to
    have a number of CA certificates in the specified directory, ssl CA certFile is
    used when all your CA certificates are in the same physical file. This suits you
    better because you only have one CA certificate (your own). The same applies to
    ssl server cert and ssl server key.'
  merge: -1
  img_proc: true
