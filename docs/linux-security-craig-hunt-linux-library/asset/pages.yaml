    \ master secret. A new invocation of the klist commands reveals that the username\
    \ ramon now has a TGT in his credentials cache.\n\n> **NOTE**   Note that the\
    \ klist command reports both version 5 and version 4 tickets. This is because\
    \ the standard RPM Kerberos packet includes support for the older Kerberos v4\
    \ protocol.\n\nBy default, the kinit command attempts to obtain a TGT for the\
    \ principal user@REALM, where user is the username that requests the ticket, and\
    \ REALM is the value of the"
