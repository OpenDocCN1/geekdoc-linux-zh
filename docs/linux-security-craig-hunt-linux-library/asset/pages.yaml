- pgno: 271
  md: '# Figure 9.1 The Netfilter Project home page


    ![](img/3258bbaf790525f8c4eb25fabff7844a_271_0.png)


    The next section explains how to configure your Linux kernel making use of the
    new Netfilter support to build a network layer firewall using a Linux server.


    # Configuring Netfilter


    In order to configure Netfilter support into the kernel, install the 2.4 kernel
    sources and enter Y to the CONFIG_NETFILTER question during the make config stage
    of the kernel configuration.


    > **NOTE** The details of kernel configuration are beyond the scope of a Linux
    security book. See *Linux System Administration*, by Vicki Stanfield and Roderick
    W. Smith (Sybex, 2001) to find out more about Linux kernel configuration.


    By default, a Linux system is configured as a network host\u2014not as a router.
    The RFCs that define Internet standards require that hosts do *not* forward packets.
    However, for a Linux system to act as a firewall, it must forward packets. In
    effect, for a Linux system to act as a firewall, it must first act as a router.
    Therefore, once the kernel is configured to support filtering, you enable IP forwarding
    by setting the ip_forward switch to true. This can be'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'done by setting the variable to 1. One way to do this is to set the value of
    the ip_forward switch through the /proc filesystem, as in the following example:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Every time the system restarts, the ip_forward switch is cleared to 0 and must
    be explicitly reset to 1. Add the echo line to a startup script such as /etc/rc.d/rc.local
    to set the switch back to 1. Some Linux distributions, for example, Red Hat and
    Caldera, attempt to simplify this process by providing an argument to the network
    startup script that explicitly sets the ip_forward switch. For example, on a Red
    Hat 7 system, setting net.ipv4.ip_forward in the /etc/sysctl.conf file sets the
    ip_forward switch to a corresponding value. The following example sets ip_forward
    to 1:


    ```

    ```   [ramon]$ head -2 /etc/sysctl.conf

    # Enables packet forwarding

    net.ipv4.ip_forward = 1

    ```

    ```


    On a Caldera system, the ip_forward value can be set through the /etc/sysconfig/network
    file by setting a value for IPFORWARDING. If IPFORWARDING is set to true or yes,
    ip_forward is set to 1. If it is set to false or no, ip_forward is set to 0. The
    following example sets ip_forward to 1 to enable forwarding:


    ```

    ```   [ramon]$ cat /etc/sysconfig/network

    NETWORKING=yes

    IPFORWARDING=yes

    HOSTNAME=ibis.foobirds.org

    ```

    ```


    Personally, I recommend that you use the echo command to directly set /proc/sys/net/ipv4/ip_forward.
    The extensions that various vendors add to simplify setting this switch often
    increase the complexity of the task because the extensions are different. The
    echo command works the same on all Linux distributions.


    > > **NOTE**   The Netfilter kernel feature provides backward compatibility by
    allowing you to create packet-filtering rules with both iptwadm and ipchains.


    # iptables


    An integral part of Rusty Russel’s Netfilter package, iptables is the user space
    utility that you use to affect changes in the three built-in network layer kernel-filtering
    chains (input, output, and forward). An evolution of the ipchains utility, iptables
    only runs on the 2.3 and 2.4 Linux kernels, and differs from ipchains in a number
    of important areas:


    +   * The names of the built-in parameters (INPUT, OUTPUT, and FORWARD) have changed
    from lowercase to uppercase.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - The `-i` (interface descriptor) flag now designates the *incoming* interface
    and only works in the input and forward chains. If you need an interface descriptor
    for a rule in the forward or output chains, use the `-o` flag instead.


    +   - The `iptables` `-y` flag (to match IP packets with the SYN bit set) is now
    `--syn`.


    +   - You can now zero a single chain (with the `-Z` option) while listing it.
    (This capability did not work in `iptables`.)


    +   - Zeroing built-in chains clears policy counters (also a bug fix).


    +   - REJECT and LOG chain actions are now extended targets (separate kernel modules).


    +   - Chain names can now be up to 31 characters.


    +   - The `iptables`''s MASQ chain is now called MASQUERADE and uses a different
    syntax (see the section “Network Address Translation”).


    Figure 9.2 shows the flow of packets as they move around the kernel and shows
    where the three chains fit within the overall process flow.


    # Figure 9.2 Linux kernel packet-filtering built-in chains


    ![](img/3258bbaf790525f8c4eb25fabff7844a_273_0.png)


    As discussed in the “Using iptables” section, a *chain* is the term used to describe
    a set of rules that are checked in sequence. These rules determine what is done
    with the packets. Consider the following example:


    ```

    ```bash

    [ramon]$ sudo iptables -A INPUT -p tcp --dport smtp -j ACCEPT

    [ramon]$ sudo iptables -A INPUT -j DROP

    ```

    ```


    This simple example adds two rules to the input built-in chain. The first rule
    matches all packets whose transport layer protocol is TCP and whose destination
    TCP port is 25 (Internet mail or SMTP). If a packet matches this rule, Netfilter
    is to accept this packet.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The second rule is a *catchall rule* (sometimes called the *stealth rule* because
    it hides the server from all external systems not explicitly allowed to talk directly
    to it). The catchall rule instructs Netfilter to drop all other input chain traffic.
    The two rules in the preceding example might be used to ensure that your mail
    server is only accepting connections destined for the SMTP port.


    > **NOTE** One of the most important enhancements of the Netfilter framework over
    the legacy packet-filtering support in pre-2.4 Linux kernels is the handling of
    both the input and output chains. Before Netfilter, the kernel consulted the input
    chain for all packets received from the network driver, regardless of whether
    the packet would eventually be bound for another system (routing) or for the local
    system (local processing). The same applied to the output chain, with both forwarded
    and locally originated packets. This forced network administrators to apply non-intuitive
    rules to the input chain to account for both types of packets. With Netfilter,
    only packets bound for local processing are subject to the input chain, and only
    packets originated at the local host and bound for another host are subject to
    the output chain.


    Both `iptables` and its ancestors (`ipfwadm`, `ipchains`) fulfill the same need:
    to reinstate a number of packet-filtering rules to the kernel every time the system
    reboots. Since the kernel does not have any non-volatile storage, you need to
    reinitialize your packet-filtering policy using the `iptables` scripts every time
    your system comes up. Since these rules do not survive system reboots, you must
    place your `iptables` commands in a script file and place the script inside `/etc/rc.d/init.d`
    directory.


    # ## Using iptables


    Not all Linux distributions ship with `iptables` standard. Simply browse on over
    to your favorite RPM depot (my favorite is www.rpmfind.net) and install the latest
    version as follows:


    ```

    `[ramon]$ sudo rpm -i iptables-1.1.2-1386.rpm`

    ```


    This command installs a number of shared libraries in `/usr/lib`, a man page for
    `iptables`, and `/sbin/iptables`, the main executable.


    You must operate with root privileges at all times when invoking the `iptables`
    command because it is actually writing the chain rules to the running kernel.


    The general command-line syntax of the `iptables` command is as follows:


    ```

    `iptables -[ADC] chain rule-specifications [options]`

    `iptables -[RI] chain rulenum rule-specifications [options]`

    `iptables -D chain rulenum [options]`

    ```'
