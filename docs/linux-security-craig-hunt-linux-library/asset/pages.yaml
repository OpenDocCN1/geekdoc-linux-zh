- pgno: 109
  md: '# ## Configuring john


    All configuration parameters are kept in the file `^john.ini`, which must be present
    in the current directory when **john** is invoked. There are four environment
    variables that can be configured in this file:


    +   * `wordfile` The **wordfile** variable is the file that contains the word
    list to be used to crack passwords in batch style.

    +   * `idle` When set to `Y`, the **idle** variable forces **john** to use only
    idle CPU cycles. I recommend this setting if you need to run **john** on a production
    server. The default value is `N`.

    +   * `save` The **save** variable is the delay (in seconds) of the crash recovery
    file. This file contains checkpoints of the work done so far in case of an interruption.
    The default value is `600`.

    +   * `beep` When the **beep** variable set to `Y`, **john** beeps every time
    a password is successfully cracked. The default value is `N`.


    The following is the **[options]** portion of a sample **john.ini** file containing
    these environment variables:


    ```

    `[ramon]$ more john.ini

    #

    # This file is part of John the Ripper password cracker,

    # Copyright (c) 1996-98 by Solar Designer

    #

    [Options]

    # Wordlist file name, to be used in batch mode

    Wordfile = ~/password.lst

    # Use idle cycles only

    Idle = N

    # Crash recovery file saving delay in seconds

    Save = 600

    # Beep when a password is found (who needs this anyway?)

    Beep = N`

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Running john


    By invoking `john` with no options, you can allow `john` to come up with enough
    random tries to crack the passwords:


    ```

    [ramon]$ `john` /etc/passwd

    ```


    Alternatively, you can supply a list of commonly used words for `john` to try.
    The word list can be a file; the following example uses the file `my_guesses`:


    ```

    [ramon]$ `john -wordfile:my_guesses` /etc/passwd

    ```


    As a third option, the word list can be piped in via the `stdin`, as in the following
    command:


    ```

    [ramon]$ `cat my_guesses` | `john -stdin` /etc/passwd

    ```


    Note that in general, `john` runs for a long time, and it writes its findings
    as it goes along into the `~/john.pot` file. If you wish to see the passwords
    that `john` has cracked so far, issue the following command:


    ```

    [ramon]$ `john -show` /etc/passwd

    ```


    Also, if you are using shadow passwords, you need to merge `/etc/passwd` and `/etc/shadow`
    into a single file for `john` to work properly. (See Chapter 2, “System Installation
    and Setup,” for information about shadow passwords. The `john` executable can
    do this conversion when invoked as `unshadow`. Start by creating a symbolic link
    using the command


    ```

    [ramon]: `sudo ln -s /usr/local/bin/john /usr/local/bin/unshadow`

    ```


    and then invoke the `unshadow` script with both files using the command


    ```

    [ramon]$ `unshadow` /etc/passwd /etc/shadow > mypasswd

    ```


    You now have a file (`mypasswd`) that you can try and crack through `john`:


    ```

    [ramon]$ `john` mypasswd

    ```


    Although it’s very stable in its current form, the `john` utility is still being
    actively developed, and new versions often introduce a dramatic increase in performance.
    Check the Web site **www.openwall.com** periodically to look for updates.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# ## In Sum


    Security is a process, and putting up a strong defense is virtually useless unless
    you''re willing to monitor your system for intrusions and stay vigilant. The `syslog`
    facility is a powerful system security tool, especially when the resulting log
    files are periodically monitored for abnormal behavior. This chapter describes
    two such tools: `swatch` and `logcheck`.


    The value of examining log files, however, is greatly diminished if you can''t
    be sure that their contents haven''t been modified by an intruder in order to
    cover his/her tracks. Part of your security-monitoring procedures should include
    an integrity check on both log files and important system executables. This serves
    to assure you that the log files haven''t been tampered with and that the executables
    haven''t been replaced by Trojan horse versions.


    Finally, it''s easy to underestimate the importance of using good passwords that
    can stand up to naive intrusion attempts. Among the password-auditing tools currently
    available for Linux, John the Ripper stands out as a clear winner because of its
    performance and its ease of use.


    Once you have implemented your system security measures and established procedures
    for system monitoring and auditing, it''s time to consider your network layer
    defense. The next part of this book, Part 2, "Network Security," describes the
    server configuration issues that impact network security and introduces monitoring
    and auditing tools and procedures that apply to the network layer.'
  merge: -1
  img_proc: true
