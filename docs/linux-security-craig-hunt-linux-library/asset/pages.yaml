- pgno: 56
  md: '![](img/3258bbaf790525f8c4eb25fabff7844a_56_0.png)


    # Debian


    This Linux distribution is maintained by a group of about 500 volunteer developers
    around the world. Due to its nonprofit nature, the release schedule for Debian''s
    Linux distribution is different from most commercial vendors'', focusing on small
    interim minor releases rather than major updates. These small releases are often
    driven by a number of security fixes, and are usually about 100 days apart.


    Unlike most commercial vendors, Debian has a clearinghouse for security information
    at `http://security.debian.org` that you can use for this purpose (see Figure
    2.4). This is one of the most straightforward vendor security sites available.
    The content is well organized, and the security advisories are easier to find
    than those of the other vendors. In addition, the page includes links to the archives
    of the Debian-specific security mailing list going back at least two years.'
