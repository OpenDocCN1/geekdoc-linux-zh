    /var/log/messages

    logcheck-1.1.1 ; USER=root ; COMMAND=/usr/bin/tail /var/log/messages


    # swatch vs. logcheck


    Both swatch and logcheck have a place in your system defense. While swatch makes
    for a better real-time log notification tool, logcheck provides a straightforward,
    easy-to-install tool that you can use to create custom reports that can be periodically
    examined by the administration staff.


    Whichever tool you choose to implement, it’s crucial to choose a recipient who
    will have enough time and dedicate enough energy to read the reports thoroughly.
    These tools are meant to help in one of the most tedious aspects of systems security,
    but ultimately, there is no substitute for human scrutiny and appropriate response.


    # File Integrity Auditing


    Ensuring the integrity of system executables, configuration files, and log files
    is paramount to a successful security defense. Consider the case where an intruder
    manages to replace a commonly executed file (like login) with a Trojan horse version.
    If the attacker manages to create a Trojan horse login that performs just like
    the original, this attack could go undetected forever. Since you can’t easily
    “look” inside executables, the only way you can flag such a compromise is by comparing
    the current signature of the current login utility to the signature taken when
    the system was first installed.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'These signatures are cryptographic hash functions whose properties ensure that
    two different files can never yield the same hash. Therefore, the slightest modification
    in one of these files can cause the signature to be drastically different. This
    is the fundamental principle behind most file integrity assurance tools. By taking
    a signature snapshot of all the executable files before the system goes on the
    network, you create a baseline that can be stored in a database, preferably on
    a write-once, read-many-times medium (to ensure that it cannot be tampered with).
    You can then periodically compare these signatures to the current state of the
    files and deal with any changes appropriately.


    The following section introduces tripwire, the most popular Linux file integrity
    assurance utility, and explains its installation, configuration, and use as part
    of a comprehensive system security strategy.


    # ## tripwire


    Born in 1992 under the auspices of Dr. Gene Safford at Purdue University, tripwire
    was the first tool to be offered in the field of file integrity assurance. In
    1999, the maintenance and development of the tool was taken over by Tripwire,
    Inc., a commercial endeavor spearheaded by Gene Kim, one of tripwire’s original
    developers, while working for Dr. Safford back at Purdue.


    # ### Installing tripwire


    Although they offer a fully supported line of commercial products based on the
    tripwire concept, Tripwire, Inc. makes the Linux version of their tool available
    for free download. You can obtain a gnu-zipped file containing the distribution
    at www.tripwire.com/downloads. Once you have downloaded the archive file, decompress
    it and extract the contents of the resulting .tar file to the current directory
    using the following commands:


    ```

    ```text

    [ramon]$ gunzip Tripwire_221_for_Linux_x86.tar.gz

    [ramon]$ tar xf Tripwire_221_for_Linux_x86.tar

    [ramon]$ rm Tripwire_221_for_Linux_x86.tar

    [ramon]$ ls -l

    total 8814

