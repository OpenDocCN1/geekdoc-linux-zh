- pgno: 327
  md: '# **The SOCKS5 IPv4-to-IPv6 Translator**


    A little-known bonus that you get with the SOCKS5 reference implementation is
    the ability to bridge the gap between IPv4 and IPv6 hosts in your network. This
    is currently accomplished via a patch to the standard SOCKS5 server distribution,
    although NEC plans to eventually roll IPv6-to-IPv4 translation support in the
    standard SOCKS5 distribution.


    The translator, named *Socks5-Trans*, functions by accepting both IPv4 and IPv6
    requests, either on separate interfaces (as a multi-homed server) or on the same
    physical interface (in a single-home configuration). This effectively allows you
    to gradually roll IPv6 onto your network, while taking advantage of the security
    features that SOCKS5 provides.


    Once you have downloaded and expanded the standard SOCKS5 package, you need to
    download the separate software patch that provides the translation service; at
    the writing of this book, this file is called socks5-trans-v1.3-patch.gz. Place
    the patch file in the main source directory of the package and proceed to unzip
    it and apply it as follows:


    ```

    ```

    [ramon]$ ls  *patch*

    socks5-trans-v1.3-patch.gz

    [ramon]$ gunzip socks5-trans-v1.3-patch.gz

    [ramon]$ ls  *patch*

    socks5-trans-v1.3-patch

    [ramon]$ patch -p < ./socks5-trans-v1.3-patch

    ```

    ```


    This results in the modification of all the source code files necessary for IPv6
    support and IPv4-to-IPv6 translation.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'There are some extra configure script options to consider when Socks-Trans
    is present. Table 10.10 lists the most important options.


    # Table 10.10 Socks-Trans Configuration Options


    | Configure Option | Description | Default |

    |---|---|---|

    | `--enable-ipv6` | Enables IPv6 protocol support. | Support is enabled by default
    if detected in the Linux installation. |

    | `--disable-ipv6` | Disables IPv6 protocol support. | Support is enabled by default
    if detected in the Linux installation. |

    | `--enabled-mapped-addresses` | Enables support for IPv4-mapped IPv6 addresses.
    (See RFC2133 for details.) | N/A |

    | `--disable-mapped-addresses` | Disables support for IPv4-mapped and IPv6-mapped
    addresses. | N/A |

    | `--with-ipv6-ping=PATH` | Specifies the IPv6-specific ping command. | ping6
    |

    | `--with-ipv6-traceroute=PATH` | Specifies the IPv6-specific traceroute command.
    | traceroute6 |


    In addition, there is an IPv6-specific configuration line for the /etc/socks5.conf
    file:


    ```

    filter name auth cmd src-host dest-host src-port dest-port user-list

    ```


    The arguments on this line are as follows:


    +   *   *name* is the type of custom filter. (Only *ftv6* is supported in version
    1.3 of the Socks-Trans). These filters provide the translation rules necessary
    for certain applications that differ drastically from IPv4 and IPv6. For example,
    ftv6 allows IPv4 (RFC959) implementations of the FTP protocol to interoperate
    with their IPv6 counterparts (RFC1639).


    +   *   *auth* is a list of authentication methods (n, k, u, -).


    +   *   *cmd* is the command to be applied by the filter.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '+   * `src-host` is the IP address of the source machine.

    +   * `dest-host` is the IP address of the destination machine.

    +   * `src-port` is the port number of the source machine.

    +   * `dest-port` is the port number of the destination machine.

    +   * `user-list` is the list of users to which the filter should apply.


    For example, to allow any of your internal IPv4 clients to connect to any external
    IPv6 FTP server, use the following configuration line:


    ```

    filter ftpv6 k c - - - ftp

    ```


    Socks-Trans is a great transition tool that you can use to bridge the gap between
    the hosts that have been already modified to use IPv6 and those that still remain
    on IPv4.


    # ## In Sum


    Transport layer proxying is a convenient way to control public network access
    using a single public address and a central point of administration, including
    user authentication and connection logging. SOCKS5 is straightforward to build,
    configure, and maintain, and it can adapt to varying network topologies and configurations,
    including environments where clients based on IPv4 and IPv6 must coexist.


    The network administrator can choose to recompile network clients with SOCKS5
    support, use the existing Linux clients with a dynamically linked library, or
    simply use the existing Windows clients by installing the provided SOCKSCap launcher.
    You also have the option to proxy network applications by changing user procedures
    rather than the clients themselves. This is the topic of Chapter 11, “Application
    Layer Firewalls.”'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# # Application Layer Firewalls


    ![](img/3258bbaf790525f8c4eb25fabff7844a_330_0.png)


    Chapter 10, “Transport Layer Firewalls,” discussed proxying at the transport layer,
    where a number of TCP and UDP services share a common transport layer port on
    the proxy device using the SOCKS protocol. This type of appliance is considered
    a circuit-level firewall, where several applications share a common proxying framework,
    defined by the SOCKS protocol.


    An alternate approach to transport layer firewalls is one where each application
    type on the internal network connects to a separate proxying process on a firewall
    that’s dedicated to forwarding connections for that specific type of application
    traffic. These types of firewalls are referred to as application layer firewalls,
    and they are the topic of discussion in this chapter.


    Application layer proxying allows the firewall to tailor each of the proxy processes
    for the application that it is designed to handle. It can then support special
    types of caching, authentication, or access control, as the application requires
    it. An application layer firewall protects the private network from the untrusted
    public Internet by not allowing any connections on its public interface. In fact,
    the only connections that are allowed, even from the internal network, are the
    ones for which the firewall is running an application proxy process. As with any
    firewall device, the basic deny-all stance should be used, where all services
    are denied by default and specific services must be allowed explicitly.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'In addition, all connections should be blocked through the firewall, with the
    exception of those allowed in writing by your security policy.


    This chapter explains the TIS Firewall Toolkit, which is perhaps the most popular
    example of a freely available application layer proxying firewall, or, more accurately
    stated, a set of tools and configuration practices that you can use to build a
    firewall that suits your specific application layer security needs.


    # # FWTK: The TIS Firewall Toolkit


    The Firewall ToolKit (FWTK) is a complete application layer firewall package freely
    available on the Internet. FWTK can be compiled to run on a Linux server without
    any source code modifications. First released to the public back in 1993, FWTK
    was written by Trusted Information Systems (TIS), now part of Network Associates
    International, with funding from the U.S. government through the Advanced Research
    Projects Agency (ARPA). Marcus Ranum, who is now a legendary figure in Internet
    security, spearheaded the FWTK development project. FWTK would eventually be the
    seed for the TIS Gauntlet, the first commercially available application layer
    proxy firewall product.


    The goal of the FWTK project was to provide an integrated collection of proxy
    processes that would accept internal connections for popular services such as
    SMTP, Telnet, FTP, and HTTP and would then request the connection to the Internet
    host on behalf of the internal host. The basic framework was scalable and easily
    extensible, allowing for the simple addition of new proxies as new Internet services
    and applications became popular. The FWTK has been extremely popular during the
    last eight years; over 50,000 downloads from six continents have been registered.


    Although the FWTK software is available in source code and is free, you are not
    permitted to distribute it or make it available to anyone else without written
    permission from TIS. However, you are allowed to use it and even modify it to
    suit your own needs, as long as you use it for non-comercial purposes and only
    internally in your company.


    There are some valuable Web resources for FWTK, including the http://www.fwtk.org
    Web site (see Figure 11.1), which features Keith Young’s informative (and up-to-date)
    FAQ. There is also a mailing list for FWTK discussion. To subscribe to this mailing
    list, send a message to *majordomo@lists.nai.com* containing the text “subscribe
    fwtk-users” in the body of the message. After subscribing, you can send list messages
    to fwtk-users@lists.nai.com.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Figure 11.1  FWTKit information clearinghouse on the Web


