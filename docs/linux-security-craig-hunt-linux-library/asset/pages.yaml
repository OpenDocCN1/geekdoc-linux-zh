    **Application Layer Proxy Servers**   Proxy servers are customized to handle specific
    application traffic only, and they are typically accessed via a TCP/UDP port number
    that is particular to each application. These proxy servers are often "smarter"
    than their transport layer counterparts, but the fact that they are application-dependent
    makes them considerably less flexible and much less comprehensive.


    > *NOTE*   Chapter 11, “Application Layer Firewalls,” focuses on the TIS Firewall
    Toolkit, a popular implementation that relies on *application layer–proxying*
    technology.


    # # The SOCKS Protocol


    The Internet Engineering Task Force (IETF) standard *SOCKS* (*SOCK-et-S*) protocol
    defines a common framework for the design and operation of proxy firewall systems.
    This is a generic specification for the interaction between proxy-aware clients
    in a private network and a proxy server that acts as a firewall by relaying client
    requests to the public Internet.


    The major driving force behind the *SOCKS* protocol is its popularity; most networked
    applications available today have built-in support for *SOCKS* proxying, eliminating
    the need to distribute special client software or to modify the procedures that
    your users currently employ to access the Internet. In addition, *SOCKS* proxy
    servers allow network administrators to protect and log a wide array of network
    applications using a standard management infrastructure. In fact, the *SOCKS*
    specification allows the client application to authenticate the user and establish
    the communication using the same transport-layer port number (e.g., *TCP* 1080).


    There are two versions of the *SOCKS* protocol in use today. The next section
    of this chapter discusses the differences between them.


    # ## SOCKS4 vs. SOCKS5


    The current *SOCKS* implementation, *SOCKS5*, was based on a previous version
    (*SOCKS4*) of the protocol, originally published by David Koblas and extended
    by Ying-Da Lee at NEC USA, Inc.’s Networking Systems Laboratory (NSL). While *SOCKS4*
    was a fully functional protocol definition, it lacked support for strong authentication,
    an essential feature for the secure operation of a proxy system. This limitation
    prompted the IETF to undertake the'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'SOCKS5 standardization (RFC1928), which added a host of new features to the
    original work by Koblas and Lee, including the following:


    +   - Strong authentication with multiple authentication methods

    +   - Transparent proxying of DNS queries

    +   - Message integrity and privacy using GSS-API (RFC1961)

    +   - Limited UDP traffic support


    In addition, SOCKS5 removed the requirement that client applications recompile
    with the SOCKS libraries in order to be proxy-aware. SOCKS5 implementations now
    ship with a dynamic library that Linux client applications can load at runtime,
    thereby eliminating any need to modify client code.


    # ## Do You Need SOCKS?


    There are a number of situations where a SOCKS-based proxy server is the most
    appropriate choice of firewall. In general, if you need to control network access
    based on the users'' credentials instead of on the client''s IP addresses, a proxy
    firewall is the obvious choice. The following situations are just a sample of
    the types of situations that require access controls based on user credentials
    that can be easily met with a SOCKS proxy:


    +   - You have application users that need telnet and ftp access all day but Web
    browser access only after business hours.

    +   - You have network clients whose IP addresses should never be allowed to traverse
    the firewall.

    +   - You have a number of application users but only a single Internet-routable
    IP address.

    +   - You need to track which URLs your employees are accessing, and you need
    to block a number of them.

    +   - You are restricted to the use of a single-homed firewall (only one network
    interface).


    # # The NEC SOCKS5 Proxy Server


    The NEC NSL SOCKS reference implementation was a pioneer in the field of application
    layer security, offering a full-featured proxy server application based on version
    5 of the popular SOCKS protocol. This chapter walks you through the process of
    compiling, installing, and configuring the Linux version of NEC''s SOCKS5 implementation.
    It also describes how to use SOCKSCap, which is a WinSock-based library that provides
    seamless SOCKS support for Microsoft Windows applications that are not natively
    SOCKS-aware.


    At the heart of the SOCKS firewall implementation is the SOCKS5 daemon that runs
    on the Linux server. This daemon needs to run on a host that has a clear IP network
    path to'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'both your internal network and to the public Internet. This is accomplished
    by setting up your firewall host in one of two modes:


    +   *   **Single-Homed**  A single-homed system has a single interface on a network
    segment from which both private and public networks are reachable.

    +   *   **Dual-Homed**  A dual-homed system has two interfaces, one for the public
    network and one for the private, trusted network.


    SOCKS5 can be used in either of these two configurations, although a dual-homed
    firewall is typically more straightforward to set up and maintain and consequently
    is more secure.


    Linux distributions do not include the SOCKS5 package by default, so you have
    to obtain it in either RPM format or as a tar archive of the sources. I picked
    mine up from www.rpmfind.net.


    # Installing SOCKS5 with RPM


    Use the rpm command with the -q (or --query) option to see if SOCKS5 is already
    installed on your system:


    ```

    ```

    [ramon]$ rpm -q socks5

    socks5-1.0r08-1

    ```

    ```


    If SOCKS5 is already installed, but you would like to upgrade the installed package
    to a more recent version, use the -U (or --upgrade) with the new version of the
    package:


    ```

    ```

    [ramon]$ sudo rpm -U socks5-1.0r11-1.i386.rpm

    [ramon]$ rpm -q socks5

    socks5-1.0r11-1

    ```

    ```


    In addition to the base server package (SOCKS5), I recommend that you also install
    three additional RPM packages:


    +   *   The SOCKS5 Linux clients (socks5-clients)

    +   *   The SOCKS5 share library wrapper (runsocks)

    +   *   The SOCKS5 development environment (socks5-devel)


    Use the following commands to install these three packages:


    ```

    ```

    [ramon]$ sudo rpm -i socks5-clients-1.0r11-1.i386.rpm

    [ramon]$ sudo rpm -i runsocks-1.0r11-1.i386.rpm

    [ramon]$ sudo rpm -i socks5-devel-1.0r11-1.i386.rpm

    ```

    ```


    The SOCKS5 RPM modules depend on both the libc.so.X and the libpthread.so.X libraries,
    so make sure that your glibc package (where both libraries reside) is up-to-date.'
