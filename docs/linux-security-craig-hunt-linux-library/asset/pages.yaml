- pgno: 72
  md: 'As discussed earlier, `s` in the user portion of the permissions mask denotes
    that the `setuid` and `execute` bits are set for the user (file owner). This means
    that the file will execute with the user permissions of the file owner (root)
    instead of the executing user (ramon). In addition, you can set the `setgid` bit
    in order to have the file execute with the group permissions of root, as follows:


    ```

    [ramon]$ sudo chmod 6755 report

    [ramon]$ ls -1 report

    -rwsr-sr-x  1 root      root        19032 Sep 25 20:30 report

    ```


    The third bit in the permissions mask is often referred to as the *sticky bit*,
    and is used in directories to signal the Linux kernel that it should not allow
    a user to delete another user’s files, even if the directory is world-writable.
    This is most often used in the `/tmp` directory, which has wide-open permissions:


    ```

    [ramon]$ ls -1d /tmp

    drwxrwxrwt  7 root      root        1024 Sep 25 21:05 /tmp

    ```


    Note the final `t` in the mask. This prevents you from deleting your fellow user’s
    files in that directory unless they explicitly allow you to do so by setting write
    permissions for others.


    In general, use of `setuid` and `setgid` should be restricted to those partitions
    that are only writeable by root. I recommend that you explicitly disallow use
    of `setuid`/`setgid` on the `/home` directory, by specifying the `nosuid` option
    in the `/etc/fstab` file, as shown in Listing 2.3.


    # Listing 2.3 Contents of the `/etc/fstab` file


    ```

    [ramon]$ cat /etc/fstab

    /dev/sda8            /                    ext2        defaults            1  1

    /dev/sda1            /boot                ext2        defaults            1  2

    /dev/sda6            /home                ext2        exec,nodév,nosuid,rw 1  2

    /dev/sda5            /usr                 ext2        defaults            1  2

    /dev/sda7            /var                 ext2        defaults            1  2

    /dev/sda9            swap                 swap        defaults            0  0

    /dev/fd0             /mnt/floppy          ext2        noauto              0  0

    /dev/cdrom           /mnt/cdrom           iso9660     noauto,ro           0  0

    none                 /proc                proc        defaults            0  0

    none                 /dev/pts            devpts      mode=0622           0  0

    ```


    Figure 2.7 illustrates how this option can be specified from Red Hat’s `linuxconf`
    utility.'
  merge: -1
  img_proc: true
