- pgno: 169
  md: 'associated with it. This triggered action by PortSentry, which is configured
    to add a line of the type


    ```

    ALL : 192.168.100.100

    ```


    to the `/etc/hosts.deny` file in order to deny TCP Wrappers access to the offending
    host. Note that the intruder attempts a second scan an hour later, but this time
    PortSentry does not add the entry to `/etc/hosts.deny`, since the intruder has
    already been blocked.


    While PortSentry is obviously a powerful tool for detecting (and even countering)
    port scans, its usefulness can be enhanced by a robust syslog-checking tool such
    as swatch and logcheck, as described in Chapter 3 of this book.


    # ## Ethereal


    PortSentry is a useful tool for detecting port-scan attempts at the transport
    layer (TCP or UDP), but system administrators often find themselves in need of
    a tool that allows them to examine the content of network packets as they fly
    through the wire. Ethereal is the optimal tool for this kind of application.


    Offered under the GNU GPL, Ethereal is the product of a large collaborative effort
    by a group of developers who were unhappy with the high price of commercial packet
    analyzers. The result is a robust packet sniffer that can capture and analyze
    packets natively, and that can read and display stored capture files created by
    a number of other (even commercial) analyzers.


    Due to its open-source nature and its modular design, it''s easy for programmers
    to add their own protocol support to Ethereal by writing their own protocol interpreters
    (or *dissectors*, as they''re called in this program). Before reaching version
    1.0, Ethereal already included support for over 100 protocols.


    # ### Installing Ethereal


    The latest Ethereal distribution is available in RPM format from any of the usual
    outlets. To install, simply download the RPM file and execute a command like the
    following:


    ```

    ```

    [ramon]$ sudo rpm -i ethereal-0.8.12-1.i386.rpm

    ```

    ```


    > **NOTE** Ethereal RPM has a dependency on libpcap. It requires libpcap of release
    level 0.4 or greater.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# ## Using Ethereal


    You can display the main Ethereal window by just entering the executable name
    with no command-line options. (You''ll have to be root to use the network interfaces
    in promiscuous mode.) Use a command like the following:


    ```

    ```python

    [ramon]$ sudo ethereal

    ```

    ```


    Shortly after invoking this command, a window appears on your X display, consisting
    of three separate panes (see Figure 5.10).


    # **Figure 5.10** The three panes of the main Ethereal window


    ![](img/3258bbaf790525f8c4eb25fabff7844a_170_0.png)


    The top pane displays a summary line for each packet that is captured on the wire,
    including a packet sequence number, the lapsed time at which it was captured (starting
    at 0 as the capture start time), the source, destination addresses, and the transport
    layer protocol type (TCP, UDP, etc.)'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'The middle pane displays a detailed view of the selected packet from the top
    pane. In Figure 5.10, you have stopped the packet capture and have drilled down
    on a packet found in a conversation between hosts **fenwick** and **redhat**.
    The frame is an Ethernet II frame carrying an IP packet, which in turn carries
    a TCP packet in its payload. Ethereal provides a fine level of detail at each
    of the layers, including source and destination TCP ports, sequence and ACK numbers,
    and flags and checksums found at the end of the TCP packet.


    The bottom pane shows a dump of the payload found on the TCP packet. Since the
    application type of this TCP packet is Secure Shell (SSH), the payload is encrypted,
    so it is not decipherable.


    As you can see, Ethereal is a powerful tool that provides a level of detail that
    is often hard to correlate, especially when capturing packets in real time. However,
    this is an appropriate tool to use in a reactive situation, when an application
    like PortSentry has already alerted you to the fact that you’re under attack.
    After the session has been captured, Ethereal allows you to save the file and
    stow away the entire capture for later examination or as forensic evidence after
    the attack.


    # # In Sum


    Network security is a game of intelligence and counterintelligence. Each minute
    spent trying to break into your own system is worth an hour of pouring through
    the unfortunate aftermath of an intrusion. While network auditing should be part
    of your periodic system and network maintenance routine, network monitoring should
    be given an even higher priority, especially when you have reasons to suspect
    that you may be under attack. It’s imperative to make sure that your security
    policy includes a clear statement of how often, and under what circumstances,
    auditing and monitoring should take place. Decide how you are going to deal with
    port-scanning offenders, and apply the same standards to all perpetrators. Avoid
    retaliatory action; instead, log all the details of the scan and attempt to gather
    as much information about their source so you can contact the appropriate authority
    to report the incident.


    Part 3, “Application Security,” expands the discussion away from the network layer
    to cover security issues associated with the use of the most common Linux server
    applications, including Sendmail, Apache, and a variety of file servers. The next
    chapter begins that discussion with a look at the security issues behind Sendmail.'
