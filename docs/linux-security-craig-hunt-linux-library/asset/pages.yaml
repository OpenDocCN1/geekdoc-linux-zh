- pgno: 186
  md: 'The directives in Listing 6.6 ensure that your server listens to requests for
    the POP3 service (TCP port 110) with the `/usr/sbin/in.qopop` as the daemon.


    If you are using `inetd` instead of `xinetd`, simply enter the following in your
    `inetd.conf` file:


    ```

    pop3 stream tcp nowait root /usr/sbin/in.qoppper in.qopopper

    ```


    The next step in the configuration is creating a username (e.g., `pop`) to own
    the authentication database (user/password associations) for APOP (see Figure
    6.1). In this figure, `lnxuxconf` is being used on Red Hat to create a POP3 administrative
    account.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_186_0.png)


    You should change the owner of the POP3-supplied `popauth` utility to be `pop`,
    and make it `suid pop` using the following commands:


    ```

    [ramon]$ cd /usr/sbin

    [ramon]$ sudo chown pop popauth

    [ramon]$ sudo chmod u+s popauth

    ```


    The very first time you run the `popauth` utility, you use it to create the authentication
    database, as follows:


    ```

    [ramon]$ sudo popauth -init

    ```


    You must make sure that the newly created authentication database file is only
    readable by the `pop` user:


    ```

    [ramon]$ ls -1 /etc/pop.auth

    -rw-------  1 pop popusers 1544 Nov 27 22:08 /etc/pop.auth

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'At this point, you have a fresh installation of Qpopper that is ready to be
    populated with new POP3 users. The next section explains how to do just that.


    # Using the Qpopper Software


    As you add new users to your server, you also need to allow them to use APOP authen-tication
    to your POP3 server. This requires an entry in `/etc/pop.auth` for each new user.
    To add these entries, simply issue a `popauth` command like


    ```

    ```

    [ramon]$ sudo popauth -user ramon

    Changing only APOP password for ramon.

    New password: mysecret

    Retype new password: mysecret

    ```

    ```


    Note that this example used the `sudo` command to run `popauth` as root, but in
    fact, the command could have been executed by user `pop` as well. If you need
    to revoke a user''s POP3 access, simply delete that user from the database using
    the following command:


    ```

    ```

    [ramon]$ sudo popauth -delete ramon

    ```

    ```


    Once users have been added to `/etc/pop.auth`, they can change their own passwords,
    invoking the `popauth` utility as their own user, with no command-line options,
    as follows:


    ```

    ```

    [ramon]$ popauth

    Changing only APOP password for ramon.

    Old password: mysecret

    New password: newsecret

    Retype new password: newsecret

    ```

    ```


    This section discussed the POP3 protocol, its security shortcomings, and how you
    can get around them. The next section discusses the implementation of the IMAP
    proto-col, an alternative to POP3 that is gaining a great deal of popularity in
    the Linux server community.


    # IMAP


    While POP3 is still the most popular mail-retrieval protocol, one of its fundamental
    short-comings is the fact that messages have to be downloaded to the user''s computer
    (the cli-ent) in order to have access to them. This makes it difficult for the
    user to select which messages they want to see before actually downloading them.
    It also makes it a challenge to read mail from multiple clients, while still keeping
    the mailbox in sync. The Internet Mail Access Protocol (IMAP) was developed in
    Stanford University circa 1986 to address


    Application Security


    PART 3'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'this shortcoming, as well as to add a host of other improvements to the ubiquitous
    POP3 protocol.


    IMAP is a true client/server protocol that is independent of the transport used
    to access the mail server. It also allows you to access different mail folders
    on the remote server, regardless of your identity and the user that owns the remote
    mailbox. While this offers unprecedented flexibility, it also introduces some
    concern and increases the risk of malicious eavesdropping of the mail traffic
    as it is being received from the IMAP server. More importantly, in the absence
    of any encryption between the client and the server, the username/password exchange
    will be in the clear as well.


    If your needs are such that you can benefit from offering IMAP services to your
    mail users, the next section guides you through the process of installing the
    IMAP server software without jeopardizing the security of your server or the privacy
    of the mail contents and the user authentication exchange.


    # ## Installing the IMAP Server Software


    The University of Washington''s IMAP server is the most popular and most actively
    supported IMAP package available for Linux. While it''s not typically installed
    by default on most Linux distributions, it can be easily obtained in RPM format
    and installed using the Linux rpm utility:


    ```

    ```

    [ramon]$ sudo rpm -i imap-2000-3.1386.rpm

    ```

    ```


    This command installs the server binary and the man pages, as well as a limited
    set of documentation. The next section shows you how to set up the secure IMAP
    server, and how to enable it on xinetd and inetd.


    # ## Configuring the Secure IMAP Server


    The imapd-2000 package uses OpenSSL for its secure transport options (imapd).
    In order to configure the SSL service, simply create a self-signed certificate
    using the following commands:


    ```

    ```

    [ramon]$ cd /usr/share/ssl/certs

    [ramon]$ sudo make imappd.pem

    ```

    ```


    This results in the creation of the file /usr/share/ssl/certs/imappd.pem, which
    contains both the key and the certificate that imapd-2000 will use to add SSL
    protection to the IMAP exchanges. Note that IMAP inserts two files in the /etc/xinetd.d
    directory, as shown in the steps in Listing 6.7.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Listing 6.7  Xinetd IMAP definitions\n\n```\n[ramon]$ cd /etc/xinetd.d\n\
    [ramon]$ more imap\n# default: off\n# description: The IMAP service allows remote\
    \ users to access their mail using \\\n#\t\tan IMAP client such as Mutt, Pine,\
    \ fetchmail, or Netscape \\\n#\t\tCommunicator.\nservice imap\n{\n  \tsocket_type\t\
    \t= stream\n  \twait\t\t\t= no\n  \tuser\t\t\t= root\n  \tserver\t\t= /usr/sbin/imapd\n\
    \  \tlog_on_success\t+= DURATIO USERID\n  \tlog_on_failure\t+= USERID\n  \tdisable\t\
    \t= yes\n}\n[ramon]$ more imaps\n# default: off\n# description: The SIMAP service\
    \ allows remote users to access\n# their mail using an IMAP client with SSL support\n\
    # such as Netscape Communicator or fetchmail.\n  service imaps\n  {\n    \tsocket_type\t\
    \t= stream\n    \twait\t\t\t= no\n    \tuser\t\t\t= root\n    \tserver\t\t= /usr/sbin/stunnel\n\
    \    \tserver_args\t= -1 /usr/sbin/imapd -- imapd\n    \tlog_on_success\t+= DURATIO\
    \ USERID\n    \tlog_on_failure\t+= USERID\n    \tdisable\t\t= yes\n    }\n\n```\n\
    \nThe first file (imap) instructs your Linux server to look for connections on\
    \ TCP port 143 (imap service). The second file (imaps) instructs your server to\
    \ handle connections to TCP port 993, which is the port that has been reserved\
    \ for the imaps service (IMAP over SSL)."
  merge: -1
  img_proc: true
- pgno: 190
  md: 'I recommend that you never enable IMAP in the clear (`/etc/xinetd.d/imap`).
    Instead, only enable `/etc/xinetd.d/imaps`, which is SSL protected. You can do
    this by simply deleting the line


    ```

    disable                = yes

    ```


    from the `/etc/xinetd.d/imaps` file, and restarting the `xinetd` daemon.

    If you are using `inetd` instead of `xinetd`, you can enable `imaps` by simply
    entering the following line in your `inetd.conf` file:


    ```

    imaps stream tcp nowait root /usr/sbin/stunnel stunnel -l\n/usr/sbin/imapd --
    imapd

    ```


    # Using the Secure IMAP Server


    Netscape Communicator, as well as Fetchmail and other mail clients, include built-in
    support for IMAP over SSL. This section will use Netscape Communicator as an example.


    Start by importing your CA''s root X.509 certificate into your user''s Communicator
    application. This is necessary in order to kick-start the authentication process.
    Unless your mail server(s) use certificates that have been signed by a third party
    whose root certificates come preloaded in Communicator (VerSign, Thawte, etc.),
    you need to load your CA''s root certificate into your mail application so that
    you can strongly authenticate the LDAP server. Since Netscape Communicator only
    accepts certificates in the PKCS#12 format, you need to force OpenSSL to export
    a copy of the root certificate as a `.p12` file using the following command:


    ```

    ```bash

    [ramon]$ sudo openssl pkcs12 -export -in newcert.pem -inkey newreq.pem -certfile
    cacert.pem -name "MY CERTIFICATE" -out mycert.p12

    ```

    ```


    You will be prompted for an `export` password that will protect the certificate.
    Enter the password twice for verification.

    You should then distribute this file to all your users who wish to use SSL-enhanced
    LDAP. Alternatively, you can include this certificate standard with Communicator
    before your users are even assigned a workstation.


    To import the certificate into Netscape Communicator, follow these simple steps:


    +   1.  Press `Ctrl+Shift+I` to bring up the Security window.

    +   2.  Select Certificates > Yours from the menu on the left-hand side. The Your
    Certificates window appears (see Figure 6.2).'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Figure 6.2 Netscape Communicator''s Security window, Your Certificates


    ![](img/3258bbaf790525f8c4eb25fabff7844a_191_0.png)


    +   3. Click the Import a Certificate button.

    +   4. Set a password for the Certificate DB. Remember this password because you
