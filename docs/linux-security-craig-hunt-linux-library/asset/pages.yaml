- pgno: 75
  md: '# syslog Security


    One of the most significant skills of sophisticated intruders is their ability
    to clean up all evidence that an attack has taken place. This is the electronic
    equivalent of a criminal using gloves at the scene of the crime, and it’s a constant
    source of frustration for those who make a living out of tracking down the actions
    of these intruders.


    You should go to whatever lengths are necessary to make sure that you can safeguard
    some evidence that your system was tampered with. The problem is that it’s very
    difficult to guarantee that your log files are correct when attackers could be
    modifying them with their root privileges. You should take advantage of the syslog
    program’s ability to send a copy of all log events to a remote server.


    For example, in order to send all your kernel, mail, and news messages to a remote
    syslog server (hostname “zurich”), add the following line to your /etc/syslog.conf
    configuration file:


    ```

    kern.*, mail.*, news.*[TAB]@zurich

    ```


    (Don’t forget that the syntax of this file calls for a tab character to be inserted
    between fields.)


    After making this modification, you must send the -HUP (hang-up) signal to the
    syslog daemon to force it to read its configuration:


    ```

    [ramon]$ sudo killall -HUP syslogd

    ```


    Keep in mind, however, that some services may not be configured or able to log
    events via syslog. You should use cron to move those services’ log files to a
    remote server several times throughout the day—the more often the better.


    # Filesystem Encryption


    However strong your physical and system security measures are, you need to be
    ready for the time when a user gains access to some other user’s files. Cryptography
    is your last line of defense. By encrypting the contents of sensitive directories,
    users can protect the privacy of their data even after an intrusion has succeeded.


    This section describes two different ways to do this, both of which are based
    on secret-key technology using standard encryption algorithms. Let’s take a look
    at each of them in more detail.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# ## The Cryptographic File System


    The Cryptographic File System (CFS) was developed by Unix pioneer Matt Blaze and
    constitutes the first full-blown integration of secret-key encryption into the
    Linux file system. One of the most important advantages of CFS is its support
    of both local filesystem types (e.g., ext2) as well as remote file systems such
    as NFS. This support protects your data as it sits in your server, and also as
    it travels through the network whenever you share an NFS mount point. CFS supports
    several encryption algorithms including DES, 3DES, MacGuffin, SAFER-SK128, and
    Blowfish.


    CFS’s main drawback, however, is performance. If you elect to use 3DES encryption
    (which I recommend, since DES is barely adequate nowadays), you will pay a price,
    and you’ll see a noticeable delay in your disk access, especially for large files.
    This is partly due to the fact that CFS operates in user space (outside of the
    kernel.) However, running in user space can actually be an advantage, because
    other cryptographic filesystem modules are offered as a patch to particular versions
    of Linux kernels, and they’re often not available for the latest stable kernel.


    Let’s start by installing the software on our server.


    # ### Installing CFS


    While the package can be obtained in source form, it’s also available from www.zedz.net
    (or ftp.zedz.net) in RPM format, as shown in Listing 2.5.


    # **Listing 2.5** Downloading the CFS distribution in RPM format


