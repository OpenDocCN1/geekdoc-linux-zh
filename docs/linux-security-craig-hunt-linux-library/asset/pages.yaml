- pgno: 24
  md: '# # Understanding Linux Security


    Information security has become a topic of increasing interest, not only in the
    Linux community but in all other areas of information technology. As potential
    threats materialize and become headline news, network and systems administrators
    are forced to wear other hats, as part-time police officers, as investigators,
    and, in a few unfortunate instances, even as forensics experts, so to speak. As
    the Internet continues to experience mind-boggling growth, fueled by, among other
    factors, the ubiquity of Linux servers, so grows the number of published Linux
    vulnerabilities and the complexity of defending your network and Linux servers
    against malicious attacks and so-called benign intrusions.


    While the mission is a challenging one, it is by no means impossible. A Linux
    administrator has access to a wide variety of tools and techniques to protect
    against most types of intrusions. It is indeed true that there is no such thing
    as a completely secure system. But it is just as true that by increasing the security
    measures in your server network, you are making your system a much more difficult
    target, and, with the right implementation of these features, your chances of
    becoming a victim are going to decrease dramatically.


    This book is a road map to aid you in your quest to secure your production servers
    from harmful attacks. In addition, it will help you make sure that the servers
    stay secure throughout their useful life and during the course of normal operation,
    including maintenance, upgrades, expansions, and other system administration tasks.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The first section of this chapter introduces the concept of security and defines
    some important terms that will be used throughout this book.


    # # An Information Security Primer


    There is nothing mystical about information security. At times overly glorified,
    and rarely well understood, the concept of information security cuts across many
    other disciplines, including network and system administration, programming, configuration
    management, and even documentation, auditing, and training. As a Linux server
    administrator, you will find that securing your network is an exercise in versatility.
    Very few corporations are large enough to justify the additional expense of having
    an information security expert on staff, and yet, practically all corporations
    would be adversely affected by even the most casual intrusion.


    This section starts by defining a set of working terms commonly used when discussing
    information security and then moves on to define the process of information security,
    detailing each of the steps that make up this process.


    # ## Security Terminology


    Throughout this book, I will use several terms that are often not well understood,
    or that are open to interpretation. This section provides working definitions
    for these security-related concepts.


    # ### Bastion Host


    While the general aim of securing your network is to keep unauthorized personnel
    out of your servers, there is an increasing need to allow public access to some
    of these servers. At the very least, you will be asked to maintain a public Web
    and FTP server, and perhaps even a publicly available DNS server. A *bastion host*
    is one that should be publicly available enough that you don’t feel comfortable
    placing it in the same segment as your private servers. It’s a fortified host,
    hence the name. A bastion host is typically designed and maintained by the system
    administration staff who are knowledgeable about the security issues involved
    in setting up public servers such as these.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Think of the bastion host as the mailbox in front of a house, next to the curb.
    It’s available to anybody, but it is at a safe distance and it is physically separated
    from the house. Or you may prefer to think of a bastion host as a scout in a military
    unit, securing the route ahead of the main group. Figure 1.1 shows the typical
    placement of a bastion host.


    # Figure 1.1 Placing bastion hosts on a dedicated firewall segment


    ![](img/3258bbaf790525f8c4eb25fabff7844a_26_0.png)


    # Demilitarized Zone (DMZ)


    You want to establish a network segment that is under your administrative control,
    but is physically separate from your protected network. This segment is referred
    to as a *demilitarized zone* (DMZ). The DMZ is typically a small network, comprising
    up to a half-dozen or so bastion hosts. Note that a DMZ is often connected to
    a separate network interface through a firewall, as shown in Figure 1.1. However,
    a DMZ can also be positioned as an intermediate segment between the firewall and
    the Internet access router. Figure 1.2 shows this configuration.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Figure 1.2 Placing bastion hosts on an intermediate DMZ segment between a
    firewall and an Internet access router


    ![](img/3258bbaf790525f8c4eb25fabff7844a_27_0.png)


    # Extranet


    The term *extranet* refers to a network segment dedicated to provide services
    to a set of users who are known to your organization, but are not trusted at the
    same level as your internal users. For example, you may be asked to offer extranet
    services to business partners so that you can share proposals and system specification
    documents. Or perhaps your company is a subcontractor in a multi-vendor integration
    effort, and needs to make many large files available to other development partners.


    Access to extranet servers often requires some form of authentication, although
    the appropriate access control measures should be in place to ensure that extranet
    users do not gain access to internal network services. Note that it is perfectly
    acceptable to place extranet servers in the same DMZ segment as the more public
    bastion hosts. By doing this you allow outside people access to the material they
    need to see, but they do not gain access to the internal information of the company
    that needs to be kept confidential. Figure 1.3 shows the placement of extranet
    hosts on a DMZ.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# **Figure 1.3** Placing extranet hosts on a demilitarized zone (DMZ)


    ![](img/3258bbaf790525f8c4eb25fabff7844a_28_0.png)


    # **Firewall**


    In general, a *firewall* is a logical entity or physical device that controls
    public access to a private network. This is often accomplished by deploying a
    computing device with physical connections to both the private and public networks.
    This device can run either special-purpose software or a common operating system,
    with the appropriate packages needed to support the firewall feature. While its
    primary purpose is to grant or deny network access in and out of the private network,
    a firewall can also log traffic statistics, authenticate users, and even detect
    intrusions by identifying suspicious usage patterns. This is a very important
    part of securing your network.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# ## Intranet


    The term *intranet* means a private network. When we speak of an intranet, we’re
    referring not only to the physical network segment, but also to a collection of
    servers (Web, mail, multimedia) that are meant to be accessed exclusively by internal
    users. These are different and are physically separated from the extranet and
    public servers. Typically, intranets include content that is confidential, data
    that is mission critical, or data that is appropriate only for internal use by
    company employees.


    # ## Packet Filter


    Running on a firewall appliance, a *packet filter* program makes decisions on
    whether to forward or block a packet based on the packet’s source, destination,
    or payload type. The most popular packet filters are those that operate at the
    network (IP) layer and act on a set of rules based on the packet’s source and
    destination IP address, as well as on the source and destination transport (TCP)
    layer number. The original, first-generation firewalls were simple packet filters.


    # ## Proxy Server


    Acting as a specialized type of firewall, a *proxy server* accepts Internet connection
    requests from internal network clients, and forwards them to the target Internet
    host as if the originator of the request were the proxy server itself. The Internet
    host then responds to the proxy server, which then forwards the response to the
    appropriate internal network client. Proxy servers typically operate at the transport
    (TCP) layer and above, and can be used for enforcing access rules, logging connection
    requests, and even for caching commonly accessed public content.


    # ## Security by Obscurity


    *Security by obscurity* is the practice by which internal services are not protected
    from the public network, but their access is purposely obscured by cryptic addresses,
    or resource identifiers, or both. For example, you may choose to make sensitive
    information available to your business partners using an anonymous FTP server,
    but naming the file with a leading period (.) so that the name does not show up
    on a regular directory listing. This is a questionable practice. Intruders are
    not easily deterred by obscurity, and automated scanning tools are especially
    good at finding this type of hidden information. The security by obscurity practice
    keeps only the least experienced hackers out of your system.


    # # The Process of Information Security


    Plain and simple, you need to protect the resources that are important to your
    organization to the extent that a compromise of those resources would negatively
    impact the operation of your organization. You need to decide what data must be
    secured and what data'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'should be secured if you have the resources. You also need to know what the
    cost to the company will be if the network is crackerd and the data is stolen
    or maliciously changed. For some organizations, their public Internet presence
    is meant to complement the information available through other means, and a compromise
    of this information would not have any serious consequences for its operation.
    For example, it would not be a good use of security resources to ensure the privacy
    of the transmission of weather data for a free Internet portal, or the integrity
    of a streaming video feed to a Web site displaying several traffic cameras. We
    are, however, in the Information Age, and an increasing number of companies are
    built exclusively on the integrity and availability of information that needs
    to be exchanged over the public network. Those organizations rely on their Internet-exchanged
    data as much as on their bricks-and-mortar presence. This includes online banks,
    investment and benefits management firms, and the overwhelming majority of business-to-business
    transactions conducted over the Internet. These enterprises must spare no expense
    to ensure that the data on their servers is always private and available, and
    that the integrity of its data is beyond reproach.


    Security is not a product. It is not software, and it is also not simply an excuse
    for a consulting engagement. It is a discipline that needs to be taken into consideration
    in any decision that you make as a network and system administrator. Security
    does not start or stop. You cannot install security, and you can''t even buy security.
    Security is training, documentation, design decisions, and appropriate implementations.
    And the most important aspect of security is monitoring and honing your security
    policies as needed. The fundamental steps in the process of information security
    are described in the next subsection.


    # Security Policy Development


    A security policy is your master document, your mission statement, and the ultimate
    source that tells the rest of your coworkers *what* you''re protecting and *how*
    you intend to protect it. While some companies might hire an outside consultant
    to draft this policy, this often falls on the plate of the network administrator.
    There are several good online sources for help on this topic:


    +   - The Internet Engineering Task Force''s (IETF''s) *Site Security Handbook*
    (RFC 1244) is a comprehensive guide to security policy and procedure development.

    +   - Purdue University''s COAST Project offers a number of sample, real-life
    security policies at ftp://coast.cs.purdue.edu/pub/doc/policy.

    +   - A good Web site with general security policy information is www.sans.org/newlook/resources/policies/policies.htm.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "The basic building blocks of a security policy are as follows:\n\n+   * **Version**\
    \ The revision number and date of the policy.\n+   \n+   * **Introduction** Briefly\
    \ describes the company’s history, its purpose, and its mission, including references\
    \ to the company’s current Internet service provider (ISP), and the provider of\
    \ any managed or outsourced security applications and mechanisms, such as firewalls,\
    \ virtual private networks (VPNs), or content filters.\n+   \n+   * **Network\
    \ Diagram** Shows the basic building blocks of both the intranet and the extranet\
    \ (if any). Make sure that the diagram clearly shows the border where the internal\
    \ network connects to the Internet service provider’s edge router.\n+   \n+  \
    \ * **Physical Security** Defines the areas that are off-limits for general employees\
    \ and the roles and identities of employees who are allowed to enter them. This\
    \ should include physical specifications for server platforms, such as front panel\
    \ configuration, power connections, UPS systems, and console access. This section\
    \ should also address the type of access control used to enter data centers and\
    \ network closets.\n\n> **WARNING** It is critically important to restrict unauthorized\
    \ and inexperienced people from gaining access to the data center or server room.\
    \ To do otherwise is to invite damaging and expensive accidents or sabotage.\n\
    \n+   * **Intranet and Extranet Services** Services allowed *in* and *out* of\
    \ the intranet/extranet, including service type, source, destination, time of\
    \ day, and user authentication. Include allowable content for electronic mail\
    \ exchanges, as well as for HTTP and FTP downloads.\n\n> **TIP** You may want\
    \ to know the ports for the services you would like to allow and the ports for\
    \ the services you do not want to allow here, so that you can reference them later\
    \ on.\n\n+   * **Remote Access** Special restrictions for remote users (via dial-up\
    \ or dedicated VPN) who gain access to the Intranet using dial-up and/or encryption\
    \ clients from the Internet.\n+   \n+   * **Firewall Configuration** Detailed\
    \ configuration reference of your perimeter defense devices, including access\
    \ control rules, logging facilities, and authentication methods.\n+   \n+   *\
    \ **User Account Policy** User account creation and maintenance policy, including\
    \ choice of usernames, password expiration/termination rules, and disk and process\
    \ quotas."
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Data Use Policy This section should cover the types of user and data files
    on the server and how they should be handled. It should include initial permissions,
    access control, and group creation criteria.


    Auditing, Monitoring, and Enforcement A security policy is useless if it’s not
    actually enforced. In this section, you should clearly define the tools and methodology
    you’ll employ to monitor servers and network resources to ensure that the policy
    is being followed. Be sure to clearly include the types of punitive and/or corrective
    actions to be imposed on violators.


    > NOTE You must follow through on the auditing part of the policy document or
    else it is pointless to create it. It may sound obvious, but you cannot have a
    secure network if you are not monitoring it for security.


    Official Assent This is the section where you clearly state who is directly responsible
    for the writing and continued enforcement of the policy. It should include signatures
    from IT officers, corporate counsel, and the developer or developers of the policy
    itself. Be sure to date the signatures.


    Even the most clear, concise, and complete security policy will be ineffective
    if it is not accessible to employees. Be sure to include a hard copy of this policy
    with the new employee orientation packet, and remind your employees periodically
    of its location online so they can consult it as it evolves. In addition, conduct
    periodic training sessions on its use and compliance, and set up a mechanism by
    which users and IT staffers alike can submit suggestions for improvement.


    # Security Mechanism Implementation


    Once you have an agreed-upon security policy, it’s time to implement the mechanisms
    necessary to enforce it. This is often a combination of system configuration changes,
    tool installation, user procedure development, and monitoring. To implement mechanisms
    for the policy outline used in the previous section, you need perform the following
    tasks:


    +   *   **Physical Security** Install UPS devices, combination locks, and physical
    environment alarms in the data center, if they are not already provided for you.
    Configure Linux servers so root access is only allowed at the console.


    +   *   **Intranet and Extranet Services** Install and configure a perimeter defense
    device (firewall, router with access lists, and so forth) to enforce restrictions
    on extranet and intranet services. (Chapter 9, “Network Layer Firewalls,” covers
    the topic of Linux firewalls in detail.)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '**Remote Access** &nbsp;&nbsp; Install and configure a virtual private network
    endpoint (see Chapter 12, "Virtual Private Networking") and/or a network device
    to support strong remote authentication and authorization (see Chapter 13, "Strong
    User Authentication").


    **User Account Policy** &nbsp;&nbsp; Configure the /etc/login.defs configuration
    file to force users to change their passwords periodically. I recommend that you
    set PASS_MAX_DAYS to a maximum of 90, which forces your users to change passwords
    every three months. This amount of time keeps users on their toes and reminds
    them that the password is a very important part of network security, even though
    changing it every 90 days may be viewed as a hassle. Write a script that periodically
    executes the last and finger commands to find out how long users have been inactive
    and inserts an asterisk (*) in their /etc/passwd entries, if appropriate. In addition,
    you should train your users in the art of choosing a good, unpredictable password,
    one that includes alphanumeric characters and is not related to a user''s environment,
    such as the name of their spouse, the street they live on, or the car they drive.


    **Data Use Policy** &nbsp;&nbsp; Use the right global umask permissions for initial
    file creation and execute a script periodically to ensure that you have no rogue
    setuid/setgid executables. (See Chapter 2, "System Installation and Setup," for
    a full discussion of system security configuration and monitoring.)


    **Auditing, Monitoring, and Enforcement** &nbsp;&nbsp; Install an auditing and
    monitoring tool such as Satan, COPS, or PortSentinel and use it periodically to
    ensure that your network defenses still comply with your security policy. (See
    Chapter 5, "Network Monitoring and Auditing," for a comprehensive discussion of
    network auditing and monitoring tools.)


    # **Periodic Policy Editing and Security Auditing**


    Much like the Internet, your network is probably changing all the time. Make sure
    you review your security policy to ensure that it still reflects the needs of
    your network. Have you added any new servers recently? Has your user population
    grown substantially as a result of your company''s latest merger? Has there been
    a recent round of layoffs, with a lot of disgruntled employees leaving? Even if
    your network hasn''t changed significantly, you need to play the part of an intruder
    and try to break into your server from the outside. Make sure you''re a step ahead
    of the real bad guys who are constantly trying to do the same thing.


    An area of your security policy that deserves special attention is remote access.
    With the recent advent of VPN technology, it is easier than ever to provide universal
    access to traveling users using a simple Point-to-Point Tunneling Protocol (PPTP)
    or Internet Protocol Security (IPSec) client installed on their laptops. It is
    important to realize the implications of allowing this type of access. While you
    used to be able to physically see the bounds of'
  merge: -1
  img_proc: true
- pgno: 34
  md: "your network, remote access extends the perimeter of your intranet to places\
    \ that you may not necessarily wish to trust completely. You may want to retool\
    \ your security policy to include restrictions on such areas as the following:\n\
    \n+   Version of the IPsec/PPTP client to use.  \n+   Timeout setting of the client.\
    \ A user who has been idle for 15 minutes typically does not mind re-establishing\
    \ the remote connection.  \n+   Type of authentication used. Username/password\
    \ is no longer enough for secure remote access.  \n+   Type of screensaver and\
    \ idle length. Demand the use of screensavers that password-lock after the idle\
    \ timeout is reached.\n\nIn addition, this book introduces a number of software\
    \ utilities that can be used to auto-mate some of the auditing and monitoring\
    \ that are necessary to ensure policy compliance. Chapter 3, “System Monitoring\
    \ and Auditing,” discusses auditing at the system level, while Chapter 5 extends\
    \ the discussion to the network layer.\n\n# The Goals of Information Security\n\
    \nYou can map all the security needs for your Linux server into one of four basic\
    \ goals:\n\n+   Data confidentiality  \n+   Data integrity  \n+   User authentication\
    \ and access control  \n+   Data and service availability\n\nThe ultimate purpose\
    \ of your security policy, tool and policy implementation, and con-figuration\
    \ management is to address each of these goals. The following sections examine\
    \ each goal in more detail.\n\n# Data Confidentiality\n\nIn this increasingly\
    \ public world, maintaining the confidentiality of the data in your Linux servers\
    \ is a full-time task of its own. As your users rely on network servers for more\
    \ aspects of their everyday work routines, they also trust more confidential and\
    \ private information to these services. The advent of cryptography has provided\
    \ the Linux systems administrator with an invaluable tool to ensure confidentiality\
    \ by allowing users to encrypt sensitive data stored on the servers. Linux supports\
    \ both private-key and public-key encryption, the two primary types of cryptographic\
    \ encryption.\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_34_0.png)"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# **Private-Key Encryption**


    Also referred to as *symmetric-key* encryption, private-key encryption allows
    users to select a secret key that can then be used to seed an algorithm that converts
    the sensitive data (plaintext) into the scrambled, or encrypted data (ciphertext).
    This process is reversible, so the same user can then decrypt the ciphertext into
    the original plaintext, provided that he or she can produce the original encrypting
    key. The longer the key, the harder it is for an attacker to derive the plaintext
    from the ciphertext.


    The *de facto* standard for private-key encryption is the Data Encryption Standard
    (DES), developed by IBM for use by the U.S. Government in 1977. Although its 56-bit
    key was believed to be more than adequate at the time, the DES algorithm has been
    cracked several times. This has prompted the National Institutes for Standards
    and Technology (NIST) to coordinate the development of the next-generation DES,
    called AES (Advanced Encryption Standard), which uses much longer key lengths
    and is substantially more robust.


    There are several Linux security applications that make use of private-key encryption,
    including the Kerberos suite of authentication tools. Chapter 13 covers this topic
    in more detail.


    # **Public-Key Encryption**


    While private-key encryption is an effective way to protect sensitive data, it
    lacks the versatility necessary to protect data exchanges between two parties,
    especially when those two parties have no prior knowledge of each other. This
    led Martin Hellman and Whitfield Diffie to develop the concept of public-key encryption,
    in their landmark 1976 paper, “New Directions in Cryptography,” *IEEE Transactions
    on Information Theory*. The idea is surprisingly simple: The sender encrypts a
    message with the well-known public key of the receiver. The receiver (and nobody
    else) can then decrypt the message into the original plaintext. This ensures confidentiality
    of the message without the need for sender and receiver to share a common private
    key. Not surprisingly, public-key encryption is a common technique used to protect
    the content of electronic mail messages as they travel over the Internet.


    The Linux-supported Pretty Good Privacy (PGP) package, and its open-source equivalent,
    GNU Privacy Guard (GPG) offer two examples of public-key-driven security applications.
    Chapter 6, “Electronic Mail,” describes both PGP and GPG.


    # **Data Integrity**


    Once an attacker has gained access to your information as it is being transmitted
    over the Internet, the attacker can do any of the following:


    +   •   Use the content for nefarious purposes, such as extortion or competitive
    advantage.'
  merge: -1
  img_proc: true
- pgno: 36
  md: "+   • Modify the content before it reaches its intended destination.\n+   \n\
    +   • Destroy the data altogether.\n\nPreserving the integrity of the data as\
    \ it travels via the Internet is often a priority even when confidentiality is\
    \ not. For example, consider a Web-driven service through which your customers\
    \ can download security patches to your company’s software products. While the\
    \ patches themselves can be downloaded in the clear, it is critical that the customer\
    \ be assured that the patch has not been maliciously modified.\n\nOnce again,\
    \ cryptography comes to the rescue. By using *digital signatures* attached to\
    \ the patch distribution, your users can verify the validity of the software that\
    \ they’re about to install. Before making the patch available, the digital signature\
    \ tool obtains a *digest*, a summary of the data that composes the patch. You\
    \ then sign this digest with your private key and make your public key available\
    \ to your users. They can then reverse the process by verifying the signature\
    \ of the digest using your public key. If a single bit has been modified during\
    \ transmission, the signature fails verification and your users know that tampering\
    \ has occurred.\n\nA popular application of data integrity checking in *Linux*\
    \ systems security is found in the *Tripwire* suite of file integrity tools. This\
    \ is one of the topics of discussion in Chapter 3.\n\n# ### User Authentication\
    \ and Access Control\n\nThe need for authentication is as old as humankind itself.\
    \ As long as there have been groups with different rights and privileges, humans\
    \ have required to authenticate themselves as legitimate members of those groups.\
    \ The most basic form of authentication is visual inspection (you look like the\
    \ Alice I know, therefore, you must be Alice). A slightly more sophisticated form\
    \ of authentication relies on the subject’s possession of a token that is unique\
    \ to the subject’s identity and that only the subject should be able to produce\
    \ (for example, a secret word or a driver’s license). In Internet terms, this\
    \ translates to simple username/password authentication, which remains the primary\
    \ means of online authentication.\n\nHowever, there are two fundamental vulnerabilities\
    \ inherent in this type of authentication:\n\n+   • People tend to choose easy-to-guess\
    \ passwords when they’re forced to memorize them, and they tend to write them\
    \ down when they’re forced to choose good passwords.\n+   \n+   • Passwords are\
    \ easy to sniff. Every time a password is used, it is sent out over the network,\
    \ typically in the clear, which exposes it to a malicious intruder who is simply\
    \ monitoring the public medium."
  merge: -1
  img_proc: true
- pgno: 37
  md: 'To address the first vulnerability, you should make use of the **nppasswd**
    utility, which forces users to choose good passwords. You should also use **crack**
    tool, which attempts to guess poor passwords for your users may have chosen. (Chapter
    3 discusses both of these utilities in detail.) To protect passwords from being
    sniffed, you must ensure that all remote access takes place either via Secure
    Shell (SSH), or using one-time passwords through an S/KEY login session. These
    tools are discussed in detail in Chapters 12 and 13 respectively.


    The advent of e-commerce on the Internet has brought about the need for a way
    to authenticate truly anonymous parties—i.e., those who are totally unknown to
    us prior to the transaction. Public-key cryptography once again provides a solution
    to this problem.


    By using certificates carrying the digital signature of a well-known *certificate
    authority* (*CA*), anonymous parties can be authenticated based on the transitive
    nature of trust in the CA. That is, if I trust the CA, and the CA can vouch for
    the fact that this person is whom he or she claims to be, then I should believe
    it.


    The Linux implementation of *Secure Sockets Layer* (*SSL*) includes the tools
    necessary to implement a simple *Public Key Infrastructure* (*PKI*) that you can
    use to provide strong authentication of anonymous subjects. This is topic is discussed
    in detail in Chapter 7, “HTTP Services.”


    # Data and Service Availability


    It has been said that in the age of networking and wireless communications that
    the only truly secure system is a brick—nothing goes in and nothing comes out.
    While this may be true, Linux administrators don’t have the luxury of taking this
    radical approach. In fact, the performance of most system administrators is often
    measured by their ability to keep the systems always up and accessible from the
    public network. There are obvious reasons why you would want to make sure that
    your Linux servers are up all the time (your corporation does want to make a profit,
    right?), but there are more subtle reasons why high availability is important
    to information security.


    Chances are that your users rely on your online systems for authentication and
    private communication of sensitive data. In the absence of these systems—i.e.,
    if they’re not available—users are likely to use less secure methods to transmit
    and store data, which often results in compromising the company’s security policy.
    For example, consider a user who needs to send an encrypted proposal to the legal
    department in the next five minutes. If the PGP key server is down and the user
    is faced with a substantial delay, the user is more likely to send the document
    unencrypted, rather than face a potential loss of an important sale.


    The next section examines the types of vulnerabilities that are often found in
    Linux servers, including a specific type of vulnerability that can open the door
    to *denial of service* attacks, which aim to disrupt the availability of your
    Linux server.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # Linux Security


    Linux is no more susceptible to attacks than any other Unix variant. As an open-source
    product, it’s up to the development and user communities to ensure that whenever
    a vulnerability is found, it is made public and a fix is made available in a timely
    manner. Linux has an outstanding track record in this regard. This, along with
    the constant scrutiny to which the source code is subject every day, make Linux
    an excellent choice of platform for the security-conscious system administrator.


    But the cold reality is that no matter how diligently you go about securing your
    Linux server, chances are that you’re going to get attacked. The following sections
    dig into the character of the prototypical malicious attacker, and provide a comprehensive
    list of the types of attacks that you’re likely to be subject to, as well as the
    consequences of each one. We’ll also look at ways you can protect your server
    installation from these attacks.


    # ## Types of Attackers


    Just as there are varying types of security incidents, there are also a variety
    of types of perpetrators. While attackers hail from all sorts of backgrounds,
    there are four broad types of characters that can be used to typify the attacker
    population as a whole. Let’s take a closer look at each of these categories.


    # ### Joyriders


    Often high school or college students, joyriders have time on their hands. They
    choose their victims at random, and they have no ulterior motive to focus on a
    specific target other than easy availability. Joyriders get discouraged relatively
    easy, don’t use confidential information, and are not likely to tamper with its
    integrity. Joyriders confide the details of a successful attack only to their
    immediate peer group.


    You can protect yourself from joyriders by making sure your Linux server is not
    subject to any obvious vulnerability, and by keeping up with the security patches
    available for your distribution of Linux. The joyrider is the easiest attacker
    to defend against.


    # ### Cult Members


    The Internet has proven to be fertile ground for semi-organized groups that share
    a common interest in orchestrating network attacks. These groups often conduct
    themselves as cults, use cryptic names for their members, and communicate using
    a characteristic jargon that is often hard to decipher for the uninitiated. The
    most prevalent cults embrace particular sociopolitical causes and pick their victims
    among those whom they perceive to be the enemy of such causes. Not surprisingly,
    a number of federal government Web sites have been the target of these cults,
    who typically deface the site to include a carefully worded protest message.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Cult members are not as easily deterred as joyriders and share a common pool
    of skills and resources that makes them challenging to defend against. If your
    company or agency could be the target of a political movement, you should take
    extraordinary steps to ensure that your hosts, especially your Web and file servers,
    are protected against defacing and content modification.


    # Spies


    Unlike joyriders and cult members, corporate spies target their victims very carefully
    and often gather information about the target for a long period of time before
    orchestrating the attack. The attack of choice is usually unlawful intrusion into
    confidential resources for financial or political gain. Spies are very well financed,
    and they often have an impressive array of skills and resources available. They
    aim to be as stealthy as possible and will attempt to cover their tracks after
    a successful break-in.


    You should protect your servers against spies by guarding your confidential data
    with access control as well as intrusion detection mechanisms (more on this in
    Chapter 5). You should also offer decoys, or false confidential information, to
    keep the spies guessing which file contains the real information. This is similar
    to the presidential motorcade with four identical black limousines, only one of
    which actually contains the president.


    # Insiders


    Attacks by insiders are by far the hardest attacks to counter because the potential
    attackers already possess a wealth of information about the target. Insiders do
    not have to jump through any hoops to gain access to the Linux server. The only
    challenge left for them is to bypass the basic system security mechanisms that
    keep them from accessing someone else''s information.


    Not only is this type of attack hard to prevent, but it''s also hard to detect
    once it has taken place. Chapter 2 offers a great amount of detail on how to make
    sure that users stay within their bounds and that permissions and access controls
    are not violated.


    # Common Attacks against Linux Servers


    So now you know *whom* you should be defending against, but *what* is it exactly
    that you need to be afraid of? You''ve heard of the most newsworthy security incidents,
    like the defacing of the U.S. Department of Justice''s Web site or the widespread
    disruption of service at E*TRADE and others. But how exactly do they do that?
    It pays off to dig deep below the headlines and find out exactly how attackers
    can exploit Linux vulnerabilities in order to wreak havoc on our servers.


    The following is a fairly comprehensive list of the types of attacks seen on Linux
    servers in the last five years.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# ## Web Server Attacks


    As the most popular service offered on the Internet today, the HTTP server has
    become the most vulnerable daemon running on a Linux server today. Note that I’m
    not implying that Web servers are fundamentally weak. It’s a simple case of exposure;
    as the most ubiquitous service, a Web server is also the most frequently attacked.
    In addition, Web servers use a complex set of configuration parameters and are
    prone to subtle configuration errors, which makes them even more vulnerable. Web
    server attacks on Linux hosts fall under two categories: Common Gateway Interface
    (CGI) script intrusions and buffer overflows, as described in the following sections.


    **CGI Script Intrusions** The cgid-bin directory houses executable scripts that
    can be invoked from the server on behalf of a user. There is nothing inherently
    insecure about the way Web servers handle these scripts, but the fact that you’re
    allowing remote users to execute code in the local server is, by itself, dangerous.
    When misconfigured, certain Web servers even allow remote users to execute these
    script with **root** permissions, which can be used by attackers to grant themselves
    access to the system via other means at a later time. A recent attack managed
    to simply gain read-only access to the CGI scripts. Although this sounds like
    an innocent intrusion, in reality users often keep passwords and other sensitive
    data hard-coded in the CGI scripts, so the user managed to gain access to the
    system using this information.


    In general, you can prevent CGI script intrusions by configuring the Web server
    to prevent the execution of CGI scripts in random locations. You should train
    your users in proper programming techniques and provide them with plenty of secure
    sample CGI script code that they can use.


    **Buffer Overflows** Although buffer overflows have been around since the genesis
    of the Internet (remember Robert Morris’ worm in 1988?), they have become more
    prevalent with the advent of the World Wide Web, and more important, Web browsers.
    By entering an unusually large URL containing actual computer code, the attacker
    causes the data structure that was meant to hold the URL to overflow, thereby
    invading the portion of memory where the actual Web server instructions “live,”
    and replacing them with the instructions included in the URL. This allows the
    attacker to execute random code with the same permissions as the Web server itself.


    Make sure that your Web server is not being executed with **root** permissions.
    Instead, most Linux Web servers start as root (so they can listen on TCP port
    80, which is a privileged port), but then fork a nonprivileged child process to
    provide the actual Web service. Most servers use the username nobody for this
    purpose.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# root Compromises


    This is one of the most devastating attacks on a Linux server and one of the most
    common. The intruder manages to gain root privileges by using one of the following
    approaches:


    +   - Sniffing the root password

    +   - Guessing the root password

    +   - Browsing through system logs looking for accidental appearances of the root
    password

    +   - Staging a buffer overflow attack on a vulnerable application to gain root
    access


    It’s hard to ensure that the root password is kept under lock and key, so you
    should simply disable root logins, except perhaps on the system console in the
    data center (see the discussion in the section “Physical Security” later in this
    chapter). Instead of logging on as root to do administrative work, use the sudo
    command that allows regular users to assume root privileges temporarily. Chapter
    2 discusses sudo and other system security commands.


    > **TIP** It is a good idea to change the root password often and make sure it
    is not easy to guess. Using a string of random uppercase and lowercase letters
    with a few numbers thrown in, such as IRGrhR954E45ejh, will make it very hard
    for someone to hack the root password.


    # Denial of Service (DoS) Attacks


    Denial-of-service (DoS) attacks have received global attention in the media lately
    due to the increasing incidence of attacks on high-profile Web sites. The aim
    of such attacks is not to steal or modify any private server content, but rather
    to disabled a public server that offers public content. The preferred method of
    bringing down a Linux server is to overwhelm it with a large amount of fabricated
    traffic. A variation on the plain DoS attack is the *distributed DoS* (DDoS) attack,
    where a large number of traffic sources are used to generate this bogus traffic.
    These sources are often hijacked systems belonging to unsuspecting users.


    Examples of DoS attacks include:


    The teardrop attack The attacker floods the victim with a large number of improperly
    fragmented IP packets.


    The synflood attack The attacker opens a large number of TCP connections half-way
    until the victim’s network buffers, which are tied up waiting for the connection
    to complete, become unavailable.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'While there is little that you can do to protect your Linux server from a new
    DDoS attack, you can prevent it from being hijacked and becoming one of the attackers.
    By implementing *egress filters* in your Internet routers, you can make sure that
    the traffic that leaves your network does not have a source address outside of
    the subnets that make up your private network.


    # Address Spoofing


    This is the attack of choice for packet-filter firewalls. These types of filters
    are typically configured to ensure that only private—i.e., known—addresses are
    allowed to initiate connections through the device. It is then relatively easy
    for attackers to forge their source IP addresses to appear as if they were coming
    from the inside. Although the return packets will not be forwarded to the attackers
    (they are pretending to have an internal address, and that’s where the response
    will go), attackers can do plenty of damage by sending packets in the blind. In
    fact, the point of the attack is usually to set up a root compromise or buffer
    overflow that allows attackers to open up a back door that they can use to access
    the system later.


    To combat IP address spoofing, you should set up *ingress filters* on your packet-filtering
    device. (For more information, see Chapter 9.) This ensures that you do not accept
    packets coming in through the public interface of your firewall with a source
    that falls within your block of internal addresses. But this defense is a stopgap
    tactic at best. The real solution is to avoid using address authentication (packet
    filtering) and resort to cryptographic authentication instead, as for example,
    SSH.


    # Session Hijacking


    In this specialized form of address spoofing, a TCP session hijacker observes
    the sequence of numbers in a TCP conversation and impersonates one of the participants
    by providing the other party with the expected sequence number. The attacker stages
    a DoS attack on the impersonated party in order to prevent it from continuing
    to take part in the conversation. When successful, the attacker can issue commands
    on the remote host as if it were the impersonated party.


    You should teach your users to recognize the symptoms of a hijacked session so
    that they can report these incidents. Most often, they notice that one of their
    sessions is no longer responding, while other sessions that have been idle for
    some time are showing unsolicited command output. As with address spoofing, the
    real solution to the threat of session hijacking is to use an authentication method
    that is not based solely on IP addresses.


    # Eavesdropping


    One of the most difficult challenges in the expansion of the Internet as a global
    medium is its public nature, where the privacy and reliability of communications
    is never guaranteed.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'It is surprisingly easy to sniff a network segment and fish for confidential
    information. In fact, the Linux revolution has exacerbated this problem, since
    even the most naïve user can use Linux’s ability to promiscuously inspect every
    packet that it sees on the wire. Not only can intruders capture the payload of
    network packets flying by, but they can also capture password information that
    they can use to stage a root compromise of the unsuspecting server.


    > **WARNING**  You should never, under any circumstance, allow the root password
    of your Linux server to traverse the network unencrypted.


    To protect your root password, you should:


    +   - Disable root logins over the network.

    +   - Disable `telnet`, `rsh`, `rlogin`, and `ftp`.

    +   - Only use Secure Shell (`ssh`) for interactive logins.

    +   - Only use Secure Copy (`scp`) to transfer files to and from the server.


    In addition, you should make use of Linux’s support for VPN technology, which
    uses strong cryptography to protect the entire conversation between your Linux
    server and any other host with which you need to exchange confidential information.
    Chapter 12 is devoted to the topic of VPNs in the Linux environment.


    # Trojan Horses


    You’ve all downloaded seemingly useful free software from the Internet, only to
    find out that its features were largely exaggerated. However, an increasing number
    of Linux servers are being infected by software that performs a very different
    task from the one it advertises. These so-called *Trojan horses* are programs
    that, though disguised as harmless applications, open up a back door through which
    intruders can exploit the system, often with root privileges. Just like the wooden
    artifact used by the Greeks to break into Troy during the war, the Trojan horse
    presents itself as a useful tool and is often partially functional. But even as
    it appears to serve its advertised purpose, it can cripple or destroy your server
    and often your entire network.


    Trojan horses can be extremely difficult to detect. In fact, they are often disguised
    as security applications, so you can be shooting yourself in the foot while thinking
    you’re improving the overall security of the server. A good example of this surfaced
    in January 1999, when it was discovered that a widely distributed version of TCPWrappers
    was actually a Trojan horse. (See Chapter 4, “Network Services Configuration,”
    for a detailed description of TCPWrappers.) While originally designed to'
  merge: -1
  img_proc: true
- pgno: 44
  md: "monitor and filter transport layer connections, the Trojan horse version of\
    \ TCPWrappers had been modified to provide root access to would-be intruders.\n\
    \nAnother feature common to most Trojan horse programs is their ability to inform\
    \ attackers of the intrusion, providing them enough detail about your system so\
    \ that they can stage a successful attack. The Trojan TCPWrappers was designed\
    \ to send an e-mail to the intruder’s address that includes information about\
    \ the infected system and about the unsuspecting user who installed the program.\n\
    \nYou can protect yourself against Trojan horses by following these simple recommendations:\n\
    \n+   - Download all your software from well-known Internet sites, or well-published\
    \ mirrors of these primary sites.\n+   - Before you install the software, look\
    \ for digital signatures or checksums to assure the integrity of downloaded package.\n\
    +   - Make as much standard software as possible available to your users (as long\
    \ as your security policy allows it). Keep it up to date.\n+   - Periodically\
    \ monitor Trojan horse advisories from the CERT Coordination Center (www.cert.org).\n\
    \nIn addition, you should conduct periodic scans of your server and look for suspicious\
