- pgno: 197
  md: '# Examples


    Consider as an example an e-mail message whose text is in the file `message.txt`.
    You want to digitally sign the message before sending it so that the recipient
    can be assured that it came from you. Enter the following commands to sign your
    message:


    ```

    ```bash

    [ramon]$ gpg --clearsign message.txt

    You need a passphrase to unlock the secret key for: "Ramon J.

    Hontanon (Linux Student) <rhontanon@sybex.com>"

    1024-bit DSA key, ID 3C9EA164, created 2000-11-29


    [ramon]$ cat message.txt.asc

    -----BEGIN PGP SIGNED MESSAGE-----

    Hash: SHA1


    This is just a test message. We would like to ensure the integrity

    of this message by attaching a digital signature to it.


    Regards,


    -- ramon

    -----BEGIN PGP SIGNATURE-----

    Version: GnuPG v1.0.2 (GNU/Linux)

    Comment: For info see http://www.gnupg.org


    iD8D8QE6JbeHnwa9rjey0wQRAhnSAj9WtkILSphi22IrSWHoDpIG2bb8W0gCgH+uB

    I/au/YZbCRdhhVpoxSwGJWo=

    =peFj

    -----END PGP SIGNATURE-----

    ```

    ```


    Note that GnuPG prompts you for the passphrase to unlock your secret key. This
    is because the signing algorithm needs to use the private key to generate a signature.
    Conversely, the recipient of the message needs your public key to verify that
    your message is really signed with your private signature:


    ```

    ```bash

    [stacia]$ gpg --verify message.txt.asc

    gpg: Signature made Wed Nov 29 21:12:23 2000 EST using DSA key

    ID 3C9EA164

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 198
  md: '```

    gpg: Good signature from ''Ramon J. Hontanon (Linux Student)

    <rstanton@sybex.com>''

    ```


    Consider the case where you want to ensure both the privacy and the integrity
    of a message. The following command signs and encrypts the message contained in
    the file message.txt:


    ```

    [ramon]$ gpg --encrypt --sign --armor message.txt


    You need a passphrase to unlock the secret key for

    user: ''Ramon J. Hontanon (Linux Student)

    <rstanton@sybex.com>''


    1024-bit DSA key, ID 3C9EA164, created 2000-11-29


    You did not specify a user ID. (you may use "-r")


    Enter the user ID: stacia@example.com

    ```


    When Stacia receives the message, she then uses her gpg utility to decrypt and
    verify the signature of the resulting message.txt.asc document:


    ```

    [stacia]$ gpg --decrypt message.txt.asc


    You need a passphrase to unlock the secret key for

    user: ''Stacia S. Hontanon (Linux Master)

    <stacia@example.com>


    1024-bit ELG-E key, ID A0626845, created 2000-11-29 (main key

    ID 3C9EA034)


    This is just a test message. We would like to ensure the integrity

    of this message by attaching a digital signature to it.


    Regards,


    -- ramon

    gpg: Signature made Wed Nov 29 21:21:54 2000 EST using DSA key

    ```'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'ID 3C9EA164

    gpg: Good signature from ''Ramon J. Hontanon (Linux Student)

    <rjhontanon@syybex.com>"


    In this example, the output of the decryption/verification simply goes out to
    the screen. If you would like for the output to be directed to the file `message.txt`,
    simply use the following command (note the `--output` directive):


    ```

    [stacia]$ gpg --output message.txt --decrypt message.txt.asc

    ```


    As you can see, GnuPG is a comprehensive package that includes utilities to encrypt,
    decrypt, sign, and verify any type of document (including e-mail messages), as
    well as the tools to manage the private and public keys required to provide this
    service.


    A tool like GnuPG is not only useful for securing e-mail exchanges, but it’s also
    an additional privacy measure for protecting critical files that you need to store
    on your Linux server. I recommend that you use GnuPG to encrypt sensitive network
    topology diagrams, notes containing authentication passwords, and reports of network
    audits that reveal any vulnerabilities, at least until you’ve had a chance to
    address them.


    # In Sum


    A layered approach to application security calls for mechanisms to ensure the
    privacy and authentication of the application transport (e.g., SSL) and the content
    of the packets themselves by applying encryption and digital signatures to the
    data before the traffic even hits the wire (e.g., GnuPG).


    This is especially relevant in the case of electronic mail applications, due to
    the sheer volume of traffic that they handle and the increasingly sensitive content
    for which companies rely on electronic mail. Regardless of your choice of MTAs,
    you need to make sure that your mail user agents (clients) support the same type
    of privacy and authentication mechanisms as your transport agent. It’s also imperative
    to make sure that your users receive the training they need to use the application
    in accordance with your security policy.


    Electronic mail and Web browsing make up the bulk of the traffic traversing the
    Internet today. Chapter 7, “HTTP Services,” continues the discussion on application
    layer security by examining the security issues surrounding the three types of
    open-source HTTP servers available for Linux servers.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 7

    # HTTP Services


    This chapter continues the discussion of Part 3, “Application Security,” by taking
    an in-depth look at the Apache HTTP server, the dominant force behind the Web
    server explosion of the last five years. This chapter describes the overall security
    features of the base Apache package, as well as the standard authentication and
    access control configuration.


    While system and network layer security can contribute to sealing most of the
    low-level threats to your Linux server, the harsh reality is that a service like
    HTTP requires you to open up a number of ports (TCP 80 and sometimes TCP 443)
    to the Internet population at large. This forces you to implement a complete set
    of security measures at the application layer, including authentication, access
    control, and the protection of the HTTP application server itself.


    In addition, if your company conducts electronic commerce using your HTTP server,
    you’ll need to ensure the privacy of the transactions, as well as provide strong
    authentication to your prospective customers and business partners. This can be
    addressed using SSL (Secure Sockets Layer) extensions to the base Apache HTTP
    distribution. This chapter describes two different packages that you can deploy
    to ensure the privacy and authentication of your HTTP transactions:


    +   - mod_ssl (part of the OpenSSL initiative)

    +   - Apache-SSL, on which mod_ssl was originally based


    Let’s kick off the discussion by describing the security-specific issues at play
    when you install, configure, and maintain the Apache HTTP server.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # The Apache HTTP Server


    Developed by the Apache Software Foundation, the Apache HTTP Web server is arguably
    the most successful piece of publicly available software since the advent of the
    Linux operating system itself. The Apache group is a collection of geographically
    dispersed developers who volunteer their time to enhance and maintain the HTTP
    server and other projects, such as XML-Apache (and an XML development environment)
    and TomCat (a Java Server reference implementation). Approximately six out of
    ten Web servers are currently running on Apache’s HTTP software. That number is
    three times larger than the one for Microsoft’s Internet Information Service (IIS),
    Apache’s closest competitor.


    Originally born out of the HTTP implementation developed by the National Center
    for Supercomputing Applications (NCSA), Apache owes its name to the fact that
    it got its start as a “patchy” version of the original NCSA HTTP server. When
    NCSA temporarily stopped development of their HTTP project, a group of programmers
    established a forum that would eventually lead to the first version of the Apache
    HTTP server (version 0.6.2) in April of 1995. Eight months later, this group released
    Apache 1.0, their first production-quality server with multi-platform support.


    Thanks to the constant scrutiny of six million users worldwide, and to the efforts
    of a growing team of developers, the current Apache distribution is a robust,
    powerful, scalable, and modular server. It rivals commercial Web server offerings
    in performance and often exceeds them in security. To find out more about the
    Apache project, visit the Apache HTTP Server Project home page at www.apache.org/httpd
    (Figure 7.1).


    The following sections describe how to configure an existing Apache installation
    with security in mind. For a complete reference on the basic installation, configuration,
    and administration of Apache on a Linux server, please refer to *Linux Apache
    Web Server* by Charles Aulds (Sybex, 2001), part of the Craig Hunt Linux Library
    series.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Figure 7.1   The Apache HTTP Server Project home page\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_202_0.png)\n\
    \n# Configuring Apache Security\n\nTraditionally, there have been three distinct\
    \ configuration files for the Apache server:\n\n+   **httpd.conf**\t **httpd.conf**\
    \ is the main configuration file. It contains directives that control the operation\
    \ of the server as a whole, such as logging and management of the server pool.\n\
    \n+   **srm.conf**\t **The srm.conf** file contains directives that control the\
    \ management of the namespace and resources in the file system, including file\
    \ typing, directory indexes, and aliases."
  merge: -1
  img_proc: true
- pgno: 203
  md: 'access.conf The access.conf file contains directives for access control in
    various directories.


    These three files are located in the same directory (usually /etc/httpd/conf)
    and are processed by the daemon upon startup in the order listed previously. It
    is easier, however, to place all your directives in a single file; I suggest that
    you use httpd.conf for this purpose.


    The next few sections discuss specific directives to control the security of your
    Apache server. All these directives should be included in the httpd.conf file.


    # Authentication


    User authentication is often a necessary feature in an otherwise public service.
    The Apache HTTP server has the ability to enforce certain rules before the user
    is granted their HTTP request. The user is granted their HTTP request based on
    one of two criteria:


    +   - A username/password provided by the HTTP requester

    +   - The IP address of the host that generated the request


    While most Web servers contain truly public content and run with no authentication,
    there are certain applications that force you to implement authentication controls.
    For example, your company may offer a subscription-based service that requires
    paying users to authenticate before obtaining the service. Or perhaps you have
    set up a Web server where your remote users can obtain proprietary software or
    confidential information. In these situations, you should use Apache authentication
    to ensure that only authorized users are being granted HTTP access to private
    parts of the content tree (the directory within your server that contains the
    HTML documents to be offered via HTTP).


    At the most basic level, Apache supports four modules that allow the Webmaster
    to define and authenticate a list of users with their corresponding passwords.
    These modules are independent pieces of code that plug into the standard Apache
    functionality that provides specific authentication methods. While third-party
    developers can integrate any module into Apache, the following four authentication
    modules come standard with the distribution: mod_auth, mod_auth_dbm, mod_auth_db,
    and mod_auth_digest. The following sections describe each of these modules in
    detail.


    mod_auth The mod_auth module provides simple username/password authentication
    using plain-text files. To use this type of authentication, the administrator
    must add each user to the Apache password file using the htpasswd command. When
    mod_auth is in use, Apache prompts the user for a password every time they want
    to access a directory that contains an .htaccess file. If the user provides a
    username and password that match an entry in the Apache password file, access
    is granted.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'The **.htaccess** file is used to include authentication directives for each
    subdirectory. To force users to authenticate using usernames and passwords, simply
    create an **.htaccess** file containing the following text:


    ```

    ```text

    AuthName  "Restricted Files"

    AuthType  Basic

    AuthUserFile /usr/local/etc/httpd/users

    Require valid-user

    ```

    ```


    Let’s take a look at the meaning at each of these directives:


    +   * **AuthName** defines the authentication domain “Restricted Files.” This
    allows users who have already authenticated to a given domain access to other
    directories with no username/password, provided that they are protected by the
    same domain.

    +   * **AuthType** defines the authentication protocol. The keyword **Basic**
    instructs Apache to use the **mod_auth** module to receive the user-specified
    password in the clear.

    +   * **AuthUserFile** points to the password file containing **mod_auth** user
    information.

    +   * **Require** directs the server to apply this type of authentication to a
    portion of the password file, or to the entire password file. The previous example
    uses the **valid-user** value, which in fact applies **Basic** authentication
    to all the users in the file. You can use this directive to restrict directory
    access to a number of users (even though the password file may contain hundreds
    of usernames). For example, to restrict access to only usernames alic and bob,
    you would use the following **.htaccess** syntax:


    ```

    ```text

    AuthName  "Restricted Files"

    AuthType  Basic

    AuthUserFile /etc/httpd/conf/user-list

    Require user alic bob

    ```

    ```


    Due to the limitations of sequential searches of text files, this module is only
    suitable for installations where fewer than 500 users are required. The **mod_auth**
    module supports both a group file and a password file.


    The group file follows the format


    ```

    ```text

    group : user-1 user-2 user-3 .. user-n

    ```

    ```


    where *group* is the name for the group, and *user-1* through *user-n* are the
    users to be included in the group. Listing 7.1 contains an example of an Apache
    group file.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Listing 7.1 Sample Apache group file


    administrators: alice bob charlie

    operators: david ernie

    dba: fred george harry


    The `htpasswd` utility is supplied with Apache and is used to create and update
    the user and group files. The command-line usage for this utility is as follows:


    `htpasswd [-c] passwd_file user`


    The `-c` option directs the utility to create a new password file (named `passwd_file`)
    and `user` is the username to add to the file.


    > **NOTE** Be careful not to create the `passwd_file` in the same directory that
    you''re trying to protect because any authorized Web users will be able to examine
    the contents of the `passwd_file`.


    To create a password file, issue a sequence of commands similar to those shown
    in Listing 7.2.


    # Listing 7.2 Using the htpasswd utility


    ```

    ```bash

    [ramon]$ sudo htpasswd -c /etc/httpd/conf/user-list alice

    New password:

    Re-type new password:

    Adding password for user alice

    [ramon]$ sudo htpasswd /etc/httpd/conf/user-list bob

    New password:

    Re-type new password:

    Adding password for user bob

    [ramon]$ sudo htpasswd /etc/httpd/conf/user-list charlie

    New password:

    Re-type new password:

    Adding password for user charlie

    ```

    ```


    The format of each line in the password file is


    `user:password-hash`


    where `user` is the cleartext username and `password-hash` is the result of the
    cryptographic hash operation applied on the cleartext password.


    Listing 7.3 contains the password file that results from executing the commands
    in Listing 7.2.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Listing 7.3   Sample Apache password file


    ```

    [ramon]$ more /etc/httpd/conf/user-list

    alice:9ti4wVG8J3Yug

    bob:vsh73lcf4ph2

    charlie:WqBo5s8Vas8XJg

    ```


    Earlier in this section, you learned about the .htaccess file and the directives
    that you can add to make use of mod_auth module authentication. Table 7.1 includes
    the complete list of available directives, including their syntax and their meaning.


    # Table 7.1   mod_auth Directives


    | Directive | Meaning |

    |---|---|

    | AuthName auth-domain | Specifies the authentication domain to send the HTTP
    client. |

    | AuthType type | Specifies the type of password transmission: Basic (in the clear)
    or Digest (MD5). |

    | AuthGroupFile filename | Specifies the name of the file containing the group
    authentication information. |

    | AuthUserFile filename | Specifies the name of the file containing the user authentication
    information. |

    | AuthAuthoritative [ on | off ] | Avoid falling back to a lower form of authentication
    if user is not available. Defaults to on. |


    For example, consider the entry in Listing 7.4 from the /var/www/html/.htaccess
    file.


    # Listing 7.4   Using the mod_auth directives


    ```

    AuthName ''Private Information''

    AuthType Basic

    AuthUserFile /etc/httpd/conf/user-list

    AuthGroupFile /etc/httpd/conf/group-list

    AuthAuthoritative on

    Require valid-user

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: "The directives in Listing 7.4 have the following meanings:\n\n+   - AuthName\
    \ 'Private Information' specifies a domain, a concept used by the Apache authentication\
    \ modules to refer to the resource (directory) in question. A domain translates\
    \ to the directory structure below the one in question. Once the browser has successfully\
    \ authenticated, it can access any resources within the realm.\n+   - AuthType\
    \ Basic defines standard, in-the-clear transmission of the password.\n+   - The\
    \ AuthUserFile directive defines the path to the password file as /etc/httpd/conf/user-list.\n\
    +   - The AuthGroupFile directive defines the path to the group file /etc/httpd/conf/group-list.\n\
    +   - The AuthAuthoritative directive ensures that access is simply denied if\
    \ the user does not exist. (Apache has the ability to cascade this password to\
    \ other authentication methods if the first request fails).\n+   - The Require\
    \ valid-user directive instructs Apache to only grant access to a user that is\
    \ present in the AuthUserFile. Alternatively, you could have specified the following:\n\
    +   \n+       Require user alice\n+       Require user bob\n+   \n+       These\
    \ two directives limit access to just the two users alice and bob. Username charlie,\
    \ who also happens to be present in the AuthUserFile, is denied access. This is\
    \ useful for restricting certain subdirectories within the Apache content tree\
    \ to specific users, while relying on one central AuthUserFile. Furthermore, you\
    \ can limit access to users within a certain group, using the following directive:\n\
    +   \n+       Require group administrators\n+   \n+       This directive restricts\
    \ access to those users who successfully authenticate as an authorized user in\
    \ the password file and are also members of the administrators group.\n\n> WARNING\
    \ While it is possible to use the standard Linux /etc/passwd to perform Apache\
    \ server authentication, I strongly recommend against this practice. If the username/password\
    \ pair exchanged for Apache authentication is captured (it typically travels in\
    \ the clear), the intruder could then penetrate the user's shell account as well.\
    \ In addition, Apache imposes no limit on unsuccessful logins, so an attacker\
    \ could use a brute-force approach to guess system passwords by attempting repeated\
    \ HTTP requests."
  merge: -1
  img_proc: true
- pgno: 208
  md: '**mod_auth_dbm**  The `mod_auth_dbm` module provides simple username/password
    authentication using Linux DBM format for the user database. User lookups are
    much faster than those of `mod_auth` are, and the `mod_auth_dbm` module can support
    a very large user population (typically thousands of users). As with `mod_auth`,
    the use of `mod_auth_dbm` is controlled by directives that can be included in
    the `.htaccess` directory within the Apache content tree. Table 7.2 lists the
    directives available for the `mod_auth_dbm` module.


    | Directive | Meaning |

    |---|---|

    | `AuthName auth-domain` | Specifies the authentication domain to send the HTTP
    client. |

    | `AuthType type` | Specifies the type of password transmission: Basic (in the
    clear) or Digest (MD5). |

    | `AuthDBMGroupFile filename` | Specifies the name of the DBM file containing
    the group authentication information. |

    | `AuthDBMUserFile filename` | Specifies the name of the DBM file containing the
    user authentication information. |

    | `AuthDBMAuthoritative [ on | off ]` | Avoid falling back to a lower form of
    authentication if user is not available. Defaults to on. |


    As an example, consider the entry in Listing 7.5 from the `/var/www/html/.htaccess`
    file.


    ```

    ```text

    AuthName ''Private Information''

    AuthType Basic

    AuthDBMUserFile /etc/httpd/conf/user-list-DBM

    AuthDBMGroupFile /etc/httpd/conf/group-list-DBM

    AuthDBMAuthoritative on

    Require valid-user

    ```

    ```


    The example in Listing 7.5 is similar to the example in Listing 7.4, except for
    the third and fourth lines. In Listing 7.5, the `AuthDBMUserFile` and `AuthDBMGroupFile`
    directives specify that the authentication lookup take place on DBM-format files
    called `/etc/httpd/conf/user-list-DBM` and `/etc/httpd/conf/group-list-DBM` instead
    of on the flat files used in the example in Listing 7.4.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Apache includes a Perl utility called dbmmanage (usually installed in /usr/sbin)
    that you can use to create the DBM database initially and to populate the database
    with new users and groups. The command-line usage of dbmmanage is as follows:


    ```

    dbmmanage filename [ command [ username [pw [group1[,group2] [encpasswd ] ]


    In the dbmmanage command line, command can be one of the following:

    ```


    +   * add: This command adds an entry for username to filename using the encrypted
    password encpasswd or the group(s) in the list of group1 [,group2].

    +   * adduser: This command prompts for a password and adds an entry for username
    to filename.

    +   * check: This command prompts for a password and then checks if username is
    in filename and if its password matches the one specified.

    +   * delete: This command deletes the username entry from filename.

    +   * import: This command reads the username:password entries (one per line)
    from the standard Linux input and appends them to filename. The password must
    already be encrypted.

    +   * update: This command is equivalent to the adduser command, except that it
    ensures that username already exists in filename.

    +   * view: This command displays the complete contents of the DBM database file.


    For example, to create the DBM user database file /etc/httpd/conf/user-list-DBM
    and add a new user named alice, enter the following command:


    ```

    [ramon]$ sudo dbmmanage /etc/httpd/conf/user-list-DBM adduser alice

    New password:

    Re-type new password:

    User alice added with password encrypted to vqQ/X7Z7hYLXQ using crypt


    To view your newly created entry, enter the following command:

    [ramon]$ sudo dbmmanage /etc/httpd/conf/user-list-DBM view

    alice:vqQ/X7Z7hYLXQ


    To delete the database entry for alice, enter the following command:

    [ramon]$ sudo dbmmanage /etc/httpd/conf/user-list-DBM delete alice

    alice deleted

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'In addition, you can create a new group database, keyed by the username, where
    the value field is a comma-separated list of groups to which the user belongs,
    using the following command:


    ```

    ```bash

    [ramon]$ sudo dbmmanage /etc/httpd/conf/group-list-DBM add alice

    staff,operators,admin

    User alice added with password encrypted to staff,operators,admin

    using crypt


    [ramon]$ sudo dbmmanage /etc/httpd/conf/group-list-DBM view alice

    alice:staff,operators,admin

    ```

    ```


    **mod_auth_db** Starting with Apache 1.1, the mod_auth_db module provides an alternative
    to mod_auth_dbm using the Berkeley Database (known as the Berkeley DB) format
    instead of the standard Linux DBM. The mod_auth_db directives, listed in Table
    7.3, are similar to the ones for mod_auth_dbm.


    ### Table 7.3 *mod_auth_db* Directives


    | Directive | Meaning |

    | :--- | :--- |

    | AuthName *auth-domain* | Specifies the authentication domain to send the HTTP
    client. |

    | AuthType *type* | Specifies the type of password transmission: Basic (in the
    clear) or Digest (MD5). |

    | AuthDBGroupFile *filename* | Specifies the name of the DB file containing the
    group authentication information. |

    | AuthDBUserFile *filename* | Specifies the name of the DB file containing the
    user authentication information. |

    | AuthDBAuthoritative [ *on* | *off* ] | Avoid falling back to a lower form of
    authentication if user is not available. Defaults to on. |


    You use the *makedb* utility to create a Berkeley DB file for both your password
    and your group lists. Two items are needed for *makedb* in order to create the
    proper database format:


    +   - Password: a username, a colon, and an encrypted password

    +   - Group: a group name, a colon, and a comma-separated list of groups'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Note that the password you enter must have the same format as the output of
    the `htpasswd` utility. So, in order to add a new user to the Apache Berkeley
    DB database, simply do the following:


    ```

    [ramon]$ sudo htpasswd /etc/httpd/conf/user-list bob

    New password:

    Re-type new password:

    Adding password for user bob

    ```


    ```

    [ramon]$ sudo mkeddb /etc/httpd/conf/user-list -o httpd/conf/user-list-DB

    ```


    The format of the group name you enter is not the same as the standard Apache
    group name, so you''ll have to maintain a separate file to use as `mkeddb` input.
    Consider the following example:


    ```

    [ramon]$ cat /etc/httpd/conf/group-list-for-db

    staff: alice, bob, charlie

    admin: alice, bob

    operators: alice, bob, charlie, david

    ```


    Once you make a modification to this list, simply use the `mkeddb` command to
    create a Berkeley DB database file for use by `mod_auth_db` using the following
    command:


    ```

    [ramon]$ sudo mkeddb /etc/httpd/conf/group-list-for-db -o /etc/httpd/conf/group-list-DB

    ```


    **mod_auth_digest** Available starting with Apache 1.3.8, the `mod_auth_digest`
    module provides MD5 digest authentication, which prevents the transmission of
    the username and password information in the clear between the client and the
    Apache server. The `mod_auth_digest` module does not come loaded by default on
    most standard distributions; to install it, you need to insert (or uncomment,
    in the case of Red Hat 7.0) the following lines in your `httpd.conf` file:


    ```

    LoadModule digest_module  /etc/modules/mod_digest.so

    AddModule mod_digest.c

    ```


    These two lines make use of Apache''s Dynamic Shared Objects (DSO) feature to
    incorporate an external shared module whose handle is `digest_module`, and that
    resides in the file `/etc/modules/mod_digest.so`. The `AddModule` directive makes
    reference to the `mod_digest.c`, which is the main source file of the `mod_auth_digest`
    module.


    Table 7.4 lists the directives that apply to the `mod_auth_digest` module.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# **Table 7.4** *mod_auth_digest* Directives


    | Directive | Meaning |

    |:--|:--|

    | **AuthName** *auth-domain* | Specifies the authentication domain to send the
    HTTP client. |

    | **AuthType** *type* | Specifies the type of password transmission: Basic (in
    the clear) or Digest (MD5). |

    | **AuthDigestDomain** *domain* | One or more URLs that are in the same protection
    space. |

    | **AuthDigestGroupFile** *filename* | Specifies the name of the DB file containing
    the group authentication information. |

    | **AuthDigestFile** *filename* | Specifies the name of the file containing the
    MD5 digest authentication information. |

    | **AuthDBAuthitative** [ on | off ] | Avoid falling back to a lower form of authentication
    if user is not available. Defaults to on. |


    Note that this module uses a digest authentication file (AuthDigestFile) instead
    of a password file. The digest authentication file is maintained with the htdigest
    command, and its format is


    ```

    user:password-hash

    ```


    where *user* is the cleartext username, and *password-hash* is the result of the
    cryptographic hash operation applied on the cleartext password.

    An entry in the digest authentication file can also take the form


    ```

    user:realm:MD5-password-hash

    ```


    where *user* is the cleartext username, *realm* is the realm name specified in
    the **AuthName** directive, and *MD5-password-hash* is the result of the MD5 hashing
    operation applied on the cleartext password. An example of the **AuthDigestFile**
    might be:


    ```

    [ramon]$ more .htdigest

    alice:private:sd7f90s8dfh0s89df70sdfd0fs8d70sd

    bob:private:a8839d9bc0d14b768a14423e1836fec4

    charlie:private:sd907fsd09f780sd7f0sdY7f90sydF89

    ```'
  merge: -1
  img_proc: true
- pgno: 213
  md: "In order to facilitate the creation of the AuthDigestFile, Apache provides\
    \ a utility called htdigest, with the following command-line usage:\n\nhtdigest\
    \ [-c] digest_file realm user\n\nIn the htdigest command line, -c directs the\
    \ utility to create a new digest file (digest_file), user denotes the username\
    \ to add to the file, and realm specifies the authentication scope for the password.\n\
    \nIn order to set up MD5 authentication on a directory, simply enter the directives\
    \ listed in Listing 7.6 in your .htaccess file.\n\n# **Listing 7.6** Using the\
    \ *mod_auth_digest* directives\n\n```\nAuthType Digest\nAuthName \"private area\"\
    \nAuthDigestDomain http://www.example.com/private/\nAuthDigestFile /etc/httpd/conf/digest-file\n\
    \  require valid-user\n```\n\nThis realm is called *private area*, and the file\
    \ containing the digest authentication is located in /etc/httpd/conf/digest-file.\
    \ Note that clients that authenticate successfully will have access to the entire\
    \ http://www.example.com/private/ URL.\n\nDigest authentication is a feature with\
    \ a distinct advantage, the protection of the username/password exchange for resource\
    \ authentication. Digest authentication does, however, limit the number of users\
    \ in the flat digest file. In addition, older Web browsers may not support this\
    \ authentication method.\n\nI recommend that you use digest authentication for\
    \ critical resources that are only going to be accessed by a few users (the Web\
    \ site administrators, perhaps), where you have complete control on the type of\
    \ browsers that will be used.\n\n# **Access Control**\n\nThe Apache HTTP server\
    \ supports two access control methods:\n\n* Discretionary (username and password\
    \ based)\n* Mandatory (based on IP address of the client machine)\n\nDiscretionary\
    \ access control requires that the HTTP client user provide something they know\
    \ (a username/password combination). The choice of credentials is at the discretion\
    \ of the user, who may elect to use different usernames according to the role\
    \ they're playing at the moment. Mandatory access control methods, on the other\
    \ hand, rely on credentials"
  merge: -1
  img_proc: true
- pgno: 214
  md: 'that are beyond the control of the user. The IP address of the HTTP client
    is the most popular mandatory access control credential.


    The previous section described the details of discretionary authentication for
    access to Apache''s content tree. This section examines the configuration steps
    necessary to enforce mandatory access control rules on your server''s Web content,
    based on the IP address of the host requesting the content.


    I recommend that you adopt a default security configuration that denies all access
    to the root tree, which forces you to grant access on an as-needed basis. This
    is accomplished with the following syntax in the `httpd.conf` file:


    ```

    <Directory />

    Deny from all

    AllowOverride None

    </Directory>

    ```


    The `Deny from all` directive effectively denies all HTTP requests for the directory
    tree starting at `/`, which includes all of its associated subdirectories.


    The `AllowOverride` directive deserves special discussion. Its general format
    is as follows:


    ```

    AllowOverride option_1 option_2 - option_n

    ```


    As discussed earlier, when Apache encounters an `.htaccess` file in a content
    directory, it applies the access control directives found in the file to the current
    directory. However, when some of these directives are in conflict with those included
    in the `httpd.conf` file, the `AllowOverride` directive is consulted to determine
    which option Apache can override.


    For example, if your `httpd.conf` specifies the directive


    ```

    AuthType Digest

    ```


    and you would like to have access to certain directories granted using Basic authentication
    by adding the following to the local `.htaccess` file:


    ```

    AuthType Basic

    ```


    then you need to add the directive


    ```

    AllowOverride AuthType

    ```


    to the `httpd.conf` file in order to allow an `.htaccess` file somewhere in the
    content tree to use Basic authentication instead of the Digest authentication
    declared in `httpd.conf`.'
  merge: -1
  img_proc: true
- pgno: 215
  md: "Table 7.5 lists the options that can be overridden from .htaccess using AllowOverride.\n\
    \n# **Table 7.5** AllowOverride options\n\n| **Option** | **Meaning** | **Examples**\
    \ |\n| --- | --- | --- |\n| **AuthConfig** | Override authorization directives\
    \ | `AuthGroupFile`, `AuthName`, `AuthType`, `AuthUserFile`, `require` |\n| **FileInfo**\
    \ | Override directives controlling document types | `AddEncoding`, `AddLanguage`,\
    \ `AddType`, `DefaultType`, `ErrorDocument`, `LanguagePriority` |\n| **Indexes**\
    \ | Override directives controlling file indexing | `AddDescription`, `AddIcon`,\
    \ `AddIconByEncoding`, `AddIconByType`, `DefaultIcon` |\n| **Limit** | Override\
    \ directives controlling host access | `Allow`, `Deny` |\n| **Options** | Override\
    \ directives controlling specific directory features | `Options`, `XBitHack` |\n\
    \nIf you would like to allow individual users to alter their default options individually,\
    \ I recommend that you restrict this ability to the `AuthConfig` and `Limit` options\
    \ using the following directive:\n\n```\n    UserDir public_html\n    <Directory\
    \ /export/homes/*/public_html>\n      Allow from all\n      AllowOverride AuthConfig\
    \ Limit\n    </Directory>\n```\n\nAssuming that you are not concerned about the\
    \ privacy of the content that your users can make available on their home directories,\
    \ allowing the override of the `AuthConfig` and `Limit` options permits individual\
    \ users to use authentication and access control to protect content that they\
    \ consider sensitive."
  merge: -1
  img_proc: true
- pgno: 216
  md: "Note that the first line defines the directory ~user/public\\_html as the place\
    \ where individual users can place their HTML content, which will be available\
    \ as the URL www.example.com/~user. In this case, you are allowing wide open access\
    \ to the entire tree, unless the users specify otherwise in their local .htaccess\
    \ files.\n\nYou may need to restrict part of your content tree to those clients\
    \ whose host names and/or IP addresses meet a certain set of criteria. For instance,\
    \ to restrict access of the URL www.example.com/intranet/ to hosts in the 10.10.10.0/24\
    \ subnet, use the following directives:\n\n```\nDocumentRoot \"/var/www/html1\"\
    \n<Directory /var/www/html1/intranet/>\n    Allow from 10.10.10.0/24\n</Directory>\n\
    ```\n\nIn the following example, you are restricting access to the same URL to\
    \ hosts whose reverse DNS lookups (PRT records) are in the example.com domain:\n\
    \n```\nDocumentRoot \"/var/www/html1\"\n<Directory /var/www/html1/intranet/>\n\
    \    Allow from .example.com\n</Directory>\n```\n\nIn addition to the Allow from\
    \ directive, Apache also supports a Deny from directive, as well as the ability\
    \ to control the order in which both of these directives (Deny and Allow) are\
    \ evaluated. Consider the following example. The Apache server evaluates the Deny\
    \ from directives before the Allow from directives, and access is allowed by default.\
    \ The result is that all hosts are allowed except the 10.10.10.0/24 block. The\
    \ 10.10.10.1 host is allowed, however.\n\n```\n<Directory /var/www/html1/intranet/>\n\
    \    Order deny,allow\n    Deny from 10.10.10.0/24\n    Allow from 10.10.10.1\n\
    </Directory>\n```\n\nNow consider the next example. In this case, you are evaluating\
    \ the allow from directives before the deny from directives, and you are adopting\
    \ a deny all stance. This results in the denial of all client connections except\
    \ those coming from 10.10.10.0/24. The 10.10.10.1 block will be allowed in the\
    \ following example:\n\n```\n<Directory /var/www/html1/intranet/>\n```"
  merge: -1
  img_proc: true
