    # The set Directive


    The SOCKS5 server uses a number of environment variables to control its execution,
    primarily to determine the level of debugging information that it should write
    to log files. You can use the set directive to initialize any SOCKS5 environment
    variable when the daemon is started.


    Syntax  set environment-variable value


    The arguments to the set directive are as follows:


    +   - environment-variable is the name of the SOCKS5 environment variable you
    want to set. Table 10.2 contains a list of all SOCKS5 environment variables.


    +   - value is the value you want assigned to the specified environment variable.


    Examples  To change the SOCKS5 password file from the Linux default of /etc/socks5.passwd
    to /usr/local/etc/socks5.passwd, use the following set directive:

    ```

    set SOCKS5_PWDFILE /usr/local/etc/socks5.passwd

    ```


    # Understanding socks5.conf Pattern Matching


    The SOCKS5 configuration file syntax supports a number of regular expressions
    to allow flexibility when specifying host names, port numbers, authentication
    schemes, proxy commands, and user definitions. This section describes the general
    conventions for specifying command-line arguments inside the socks5.conf configuration
    file.


