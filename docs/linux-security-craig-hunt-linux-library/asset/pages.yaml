  md: '# **Table 9.6** iptables Protocol-Specific Packet-Matching Parameters


    | Parameter | Meaning | protocol type |

    | --- | --- | --- |

    | **--sport** [! [port:[port]]] | Matches packets with a given source port, or
    from a given *port:port* range. | |

    | **--dport** [! [port:[port]]] | Matches packets with a given destination port,
    or from a given *port:port* range. | tcp, udp |

    | **--port** [! port] | Matches packets with an equal source and destination port.
    | |

    | **--tcp-flags** [! mask comp] | Matches packets with TCP flags as specified.
    Flags are SYN, ACK, FIN, RST, URG, PSH, ALL, and NONE. | tcp |

    | [!] **--syn** | Matches TCP packets with the SYN bit set and the ACK and FIN
    bits cleared. | |

    | **--tcp-option** [! number] | Matches if the packet has the TCP option set.
    | |

    | **--icmp-type** [! type-name] | Matches if the packet has the give ICMP type.
    | icmp |


    In addition, *iptables* allows you to load so-called *extended packet-matching
    modules*. These are similar to external plug-ins that can be added to the basic
    *iptables* package to dynamically extend its ability to match packets. In order
    to extend the syntax of an *iptables* command with one of these modules, simply
    use the *-m module* option.


    The following extended packet-matching modules are included in the standard *iptables*
    distribution:


    +   - **owner**: The *owner* module is used to match packets on the characteristics
    of the local packet creator. As such, it only applies to the output chain.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   * state: The state module allows access to the connection-tracking state
    for this packet.

    +   * tos: The tos module matches the eight bits of the type-of-service field
    in the IP header.

    +   * limit: The limit module regulates the rate at which the rule should match
    incoming packets. It is most often used in order to reduce the rate at which packets
    are accepted into an interface to avoid denial-of-service attacks.


    Table 9.7 lists the parameters that are available for building rules when preceded
    by the -m module switch. The leftmost column includes the module to which the
    parameter applies.


    # Table 9.7 iptables Extended Packet-Matching Parameters


    | Parameter | Meaning | Extended Module |

    | --- | --- | --- |

    | --uid-owner userid | Matches if the packet was created by a process with the
    given user ID. |  |

    | --gid-owner groupid | Matches if the packet was created by a process with the
    given group ID. | -m owner |

    | --pid-owner processid | Matches if the packet was created by a process with
    the given process ID. |  |

    | --sid-owner sessionid | Matches if the packet was created by a process with
    the given session group. |  |

    | --state state | Matches one of the following states: INVALID, ESTABLISHED, NEW,
    or RELATED. | -m state |

    | --tos tos | Matches the eight-bit type-of-service (TOS) field in the standard
    IPv4 packet. | -m tos |'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Table 9.7 iptables Extended Packet-Matching Parameters (continued)


    | Parameter | Meaning | Extended Module |

    | :--- | :--- | :--- |

    | --limit rate | Maximum average packet rate. Used to restrict a certain kind
    of packets to a maximum frequency. The rate must have one of the following suffixes:
    / second, /minute, /hour, or /day. Default is 5/hour. | -m limit |

    | --limit-burst number | Maximum initial number of packets. Used to restrict the
    maximum burst of packets of a given type. Default is 5. | |


    For example, let''s say that your firewall is protecting a private server whose
    primary mission is to serve Web content but also runs an FTP server for a few
    of your customers. You would like to allow unrestricted HTTP traffic to this server:


    ```

    iptables -A FORWARD -p tcp -dport 80 -j ACCEPT

    ```


    but you want to limit FTP connections to one every 30 seconds (or two per minute):


    ```

    iptables -A FORWARD -p tcp --syn -dport 21 -m limit --limit 2/minute -j ACCEPT

    ```


    ```

    iptables -A FORWARD -p tcp -dport 21 -j ACCEPT

    ```


    Note that in addition to the -m limit extended match, you''re also matching --syn
    type connections in the first command in the preceding example. This ensures that
    you only rate-limit connection requests. The rest of FTP traffic is accepted by
    the second command.


    As you can see, the iptables command has a very complex syntax. The next section
    presents some examples about how you can use iptables, describes a number of real-world
    network architecture scenarios, and offers suggested iptables commands that would
    be used in each case.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Sample Firewall Scenarios


    The following example scenarios should capture the most popular network architectures
    in place today, from the simple dial-on-demand connection to a complex scenario
    featuring a dedicated router and a demilitarized zone where you can offer public
    services without compromising the security of your private network.


    # Single-Homed Dial-up Server


    Most small enterprises or branch offices have a single, non-dedicated connection
    to the Internet, and they don’t want anyone coming back into their network or
    their firewall. Furthermore, many of these temporary connections are broadband
    (Internet over cable) connections, where the medium is shared by all the subscribers
    who are currently connected. This is breeding ground for intrusion and eavesdropping,
    and firewall protection should always be included in such a scenario.


    In addition, most home users that use DSL or cable connections typically have
    more than one host on their network from which they want to access the public
    Internet. Linux offers NAT network address translation through Netfilter’s masquerading
    feature. Consider the example (illustrated in Figure 9.3) where your dial-up server
    has two interfaces:


    +   - ppp0, a dial-on-demand point-to-point protocol connection to your ISP

    +   - eth0, a fast Ethernet connection to your private LAN


    **Figure 9.3** Single-homed dial-up server architecture


    ![](img/3258bbaf790525f8c4eb25fabff7844a_281_0.png)


    Let’s create an iptables configuration for this scenario. Take a look at Listing
    9.1.


    **Listing 9.1** Single-homed dial-up server


    ```

    iptables -N protect

    iptables -A protect -m state --state ESTABLISHED,RELATED -j ACCEPT

    iptables -A protect -m state --state NEW -i 1 ppp0 -j ACCEPT

    ```'
  merge: -1
  img_proc: true
- pgno: 282
  md: '```

    iptables -A protect -j DROP

    iptables -A INPUT -j protect

    iptables -A FORWARD -j protect

    ```


    The first line defines a new chain called **protect**, which is where you’ll do
    all your filtering. (This is done for convenience, so that you don’t have to enter
    the same filter rules in multiple built-in chains.) The second line instructs
    `iptables` to allow any incoming packets to the dial-up server as long as they
    are in response to a previously open connection (ESTABLISHED,RELATED). The third
    line allows new connections to be forwarded through the firewall, but only if
    the connection is not coming from interface ppp0; thus, it must be coming from
    eth0, the only other interface on the server. This ensures that it is an out-going
    connection. The fourth line finishes the **protect** chain with a stealth rule,
    ensuring that any traffic that does not match a previous rule is dropped by the
    firewall.


    The last two lines in Listing 9.1 are not part of the newly created **protect**
    chain, as the -A options of those lines clearly indicate. These two lines are
    the rules that send packets to the new chain by forwarding packets that arrive
    in the input, forward chains to the **protect** chain. Note that you are not restricting
    the output chain at all, so you are allowing any outbound connections that originate
    from the dial-up server itself.


    # Dual-Homed Firewall: Public and Private Addresses


    At a company’s central location and at some of its larger branch offices, you’ll
    typically find a dedicated router supporting a full-time connection to the Internet.
    The most straightforward perimeter security architecture calls for a firewall
    device **in series** with the LAN connection to the router. Such a device ensures
    that all traffic coming in and out of the Internet is inspected by the packet-filtering
    firewall. Consider the sample architecture depicted in Figure 9.4, where the local
    network is 208.209.210.0/24 and the router’s public interface is 157.35.66.65.


    **Figure 9.4 Dual-homed firewall architecture**


    ![](img/3258bbaf790525f8c4eb25fabff7844a_282_0.png)'
  merge: -1
  img_proc: true
- pgno: 283
  md: '> NOTE The firewall’s public interface and the router’s private interface do
    not need routable addresses because their connection is in essence point-to-point.
    You use the 10.0.0.0/24 network for this connection.


    Let’s consider a policy (in Listing 9.2) that allows for SSH inbound access, while
    blocking all other type of requests. All types of outbound TCP connections are
    still permitted. ICMP inbound traffic is restricted to echo requests (service
    0).


    # **Listing 9.2** Dual-homed firewall architecture: SSH incoming services


    ```

    # Flush all the rules out of the the chains

    iptables -F INPUT

    iptables -F OUTPUT

    iptables -F FORWARD


    # Set the default policy for the FORWARD chain to deny all

    iptables -P FORWARD deny


    # Block all incoming traffic comIng from public interface (eth0)

    iptables -A INPUT -i eth0 -j DROP


    # Block all outgoing traffic going out the public interface (eth0)

    iptables -A OUTPUT -o eth0 -j DROP


    # Instruct Netfilter to accept fragmented packets (-f)

    iptables -A FORWARD -f -j ACCEPT


    # Accept incoming TCP packets from established connections

    # (---state ESTABLISHED,RELATED)

    iptables -A FORWARD -m state --tcp --state ESTABLISHED,RELATED -j ACCEPT


    # Accept incoming TCP connections to SSH arriving at eth0

    iptables -A FORWARD --p tcp -i eth0 --d 208.209.210.0/24 --port ssh -j ACCEPT


    # Accept all outgoing TCP connections entering the private

    # interface (eth1)

    iptables -A FORWARD -p tcp -i eth1 -j ACCEPT


    # Accept all outgoing UDP connections entering the private

    # interface (eth1)

    iptables -A FORWARD -p udp -i eth1 -j ACCEPT

    ```'
