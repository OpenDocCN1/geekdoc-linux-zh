- pgno: 324
  md: 'This example specifies that clients use SOCKS5 proxying to server 192.168.32.1
    in all instances, except when the destination falls within the 192.168.32.0 network
    (the local LAN), in which case a direct connection should be established.


    In addition to the configuration that controls the shared library itself, there
    are a number of environment variables that can be set by each user in order to
    tailor the execution of the library to their environment. Table 10.9 includes
    the most commonly used of these environment variables.


    # Table 10.9 libsocks5.conf Environment Variables


    | Variable name | Value | Value default | Description |

    | :-- | :-- | :-- | :-- |

    | SOCKS5_USER | User-name | N/A | Username for server authentication. |

    | SOCKS5_PASSWORD | Password | N/A | Password for server-to-server authentication.
    |

    | SOCKS5_SERVER | host:port | per libsocks5.conf | Overwrites the SOCKS5 server
    to use. |

    | SOCKS5_ENCRYPT | N/A | N/A | Specifies to use encryption when GSS-API is in
    use. |


    So far, this chapter has described the SOCKS5 server and the ability to configure
    Linux clients to connect to the server. However, most Linux servers are also expected
    to provide services to other platforms. The following section explains how Windows
    clients can take advantage of a Linux-based proxy firewall.


    # Configuring Windows SOCKS5 Clients


    While it’s fairly trivial to modify the Linux environment for SOCKS5 clients,
    there is typically also a strong need for Windows-based clients to use the proxy
    server to connect to the public Internet. You clearly cannot modify each Windows
    application to use the SOCKS5 libraries, so you need a shim, a network driver
    that will insert itself in the WinSock TCP/IP stack and intercept all connection
    requests. The SOCKS5 developers augmented the capability of the Linux server with
    SOCKSCap, a Windows-based application that effectively SOCKS-ifies any WinSock-compliant
    Windows application.'
  merge: -1
  img_proc: true
- pgno: 325
  md: "Availble from NEC USA's Web site in ready-to-install format, SOCKSCap can be\
