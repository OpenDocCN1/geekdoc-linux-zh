    **Kerberos5 Authentication** (`--with-krb5[=path]`) The default client authentication
    in SOCKS5 is simply username and password. If you want your server to use extended
    Kerberos5 GSS-API authentication (see RFC1961), you must supply your own Kerberos5
    libraries. If you''re running a Linux distribution that supports RPM, simply verify
    that the Kerberos5 library package has been installed as follows:


