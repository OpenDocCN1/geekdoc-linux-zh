- pgno: 135
  md: "# ## Testing Your TCP Wrappers Configuration\n\nAside from man pages and documentation,\
    \ the TCP Wrappers RPM file installs four executables as part of the TCP Wrappers\
    \ package. You have already seen two of these:\n\n/usr/sbin/tcpd The tcpd file\
    \ is the main daemon executable, which is invoked by the inetd daemon before dispatching\
    \ the appropriate network server application.\n\n/usr/sbin/safe-finger The safe-finger\
    \ file is the finger application often used to obtain information across the network\
    \ from the client that is attempting to establish an inbound connection.\n\nTwo\
    \ other tools are important for testing your TCP Wrappers configuration. They\
    \ are tcpdchk and tcpdmatch and they are described in the following two sections.\n\
    \n# ### Using tcpdchk\n\nThe executable /usr/sbin/tcpdchk is the TCP Wrappers\
    \ configuration “checker.” The tcpdchk script examines the configuration files\
    \ and reports any potential problems that may lie therein. It reports on the following\
    \ types of conditions:\n\n+   * Nonexistent path names in /etc/inetd.conf\n+ \
    \  * Services configured by tcpd but not in /etc/inetd.conf\n+   * Services that\
    \ cannot be protected with TCP Wrappers\n+   * Syntax errors in /etc/inetd.conf\
    \ and/or the tcpd configuration files\n\nThe tcpdchk command can be invoked with\
    \ the -v option for a verbose, tabular output. I strongly recommend that you run\
