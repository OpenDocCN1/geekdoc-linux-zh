    NT user profiles containing parameters like custom wallpaper, desktop arrangements,
    and shortcuts are stored in the user’s Linux home directory every time they log
    off the domain, ready to be restored next time they log back in.


    > > **WARNING** It’s important to make sure that logon scripts are owned by root
    and not writable by anybody other than root. A world-writable script can be exploited
    by an attacker to execute random commands on all your Windows users’ desktops.
    This could have catastrophic consequences.


    This concludes our discussion of the security features of the Samba file-sharing
    server. While the package offers a stunning array of configurations and available
    features, the centralized smb.conf file makes it easy to administer the security
    features. Samba affords companies that have invested in Linux training the opportunity
    to address their Windows file-sharing needs without introducing a new flavor of
    server operating system into their data center. As with any other complex server
    package, special care must be taken when configuring the service, and the system
    administrator should stay abreast of any newly discovered vulnerability that may
    put the security of the system in jeopardy.'
