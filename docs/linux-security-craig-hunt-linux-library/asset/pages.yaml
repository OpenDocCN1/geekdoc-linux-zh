- pgno: 270
  md: 'Finally, let''s say that you want to guard against packet spoofing by ensuring
    that all traffic that leaves the internal network has the proper source address:


    ```

    ipchains -A forward -i eth1 -s !38.110.200.0/24 -j REJECT

    ```


    This command uses an inverse rule by stating that all traffic that enters the
    server at interface eth1 (the private interface) and does not contain a source
    IP address in the 38.110.200.0 class-C network should be rejected.


    As of Linux kernel 2.4 (the latest stable version at the writing of this book),
    the functionality once provided by ipfwadm and ipchains is now being provided
    by Netfilter and its iptables user space tool. I recommend that you deploy your
    Linux firewall on a 2.4 kernel machine and that you use the Netfilter package
    for packet filtering. This is the topic of discussion of the next section.


    # ## The Present: Netfilter


    Linux kernel 2.4 includes a number of features and stability enhancements that
    make it a very robust platform to use for your firewall. One of the most noticeable
    improvements of this kernel version is the packet-filtering subsystem, which is
    now named *Netfilter*. The development of Netfilter has been largely funded by
    Watchguard Technologies. This U.S.-based company develops and markets commercial
    firewalls appliances based on Linux platforms, as well as security services based
    on their firewall platforms. Figure 9.1 shows the Netfilter Project home page,
    located at http://netfilter.kernelnotes.org. This Web site features


    +   * Information about the Netfilter Project team members and their contributions

    +   * iptables downloads

    +   * Documentation on Linux networking, packet filtering, network address translation,
    and the Netfilter architecture in English and several other languages

    +   * Netfilter FAQs

    +   * Information on Netfilter-related mailing lists


    Perimeter Security


    PART 4'
