- pgno: 222
  md: 'You have just added SSL support to your existing Apache installation. For this
    change to take effect, make sure to restart the Apache daemon:


    ```

    [ramon]$ sudo /etc/rc.d/init.d/httpd restart

    ```


    Your Apache server will now answer requests on both TCP ports 80 (HTTP) and 443
    (HTTPS).


    The following section describes how to configure mod_ssl.


    # Configuring mod_ssl


    There is a fundamental choice to be made before configuring mod_ssl, which has
    to do with the way you will use digital certificates and authentication. You need
    to do one of the following:


    +   - Seek the services of a well-known CA (Verisign, Thawte, Entrust, Xcert,
    etc.) whose root certificate comes preloaded with many of today''s network applications
    (Web browsers, mail clients, etc.).

    +   - Create your own CA using OpenSSL, create the Apache server''s digital certificate,
    and sign it with the CA''s private key (the one you''ve just created).

    +   - Create a simple self-signed Apache server certificate.


    The first approach, seeking the services of a well-known CA, has one important
    advantage: You don''t have to preload your self-signed certificate in all your
    customer''s applications since presumably, your Apache server certificate will
    be signed by one of these CAs, which will allow you to complete the "trust chain"
    with no intervention. The disadvantage to the first approach is that there is
    a cost associated with this, as well as a recurring fee when the certificate expires
    and needs to be reissued by the CA.


    The second approach, creating your own CA using OpenSSL, involves more work but
    allows you to control the entire trust-verification process, including other applications
    besides the Apache server (e.g., mail clients, as described in Chapter 6, "Electronic
    Mail"). Since OpenSSL gives you the tools you need to create and maintain your
    own CA, this approach is discussed in this section.


    The third approach, creating a simple self-signed Apache server certificate, is
    the most straightforward approach, and it''s the easiest to implement, although
    it requires that the Web browser user verify a key fingerprint manually the first
    time they connect to the Apache server. This approach will also be described in
    this section.


    # Creating a Certificate Authority


    Before you can establish an SSL session between your Apache server and your clients,
    both ends of the connection need to be issued certificates signed by a common
    CA. While'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'there are a number of commercial CA services available today, you can set up
    your own CA by using the openssl utility to create the CA’s private key, its certificate,
    and a CA-signed Apache server certificate. Let’s start by creating a configuration
    file for the openssl utility using the following command:


    ```

    [ramon]$ cp /usr/share/ssl/openssl.cnf /etc/httpd/conf/

    ```


    The openssl.cnf file is the main configuration file for OpenSSL, where all the
    directories and environment variables are defined. The standard openssl.cnf is
    mostly correct for your purposes. Simply edit it to make sure that the [ CA_default
    ] section contains the correct directory paths:


    ```

    [ CA_default ]

    dir          = /etc/httpd/conf        # Where everything is kept

    certs        = $dir/ssl.crt           # Where the issued certs are kept

    crl_dir      = $dir/ssl.crl          # Where the issued crl are kept

    database     = $dir/index.txt        # database index file

    new_certs_dir = $dir/ssl.crt         # default place for new certs

    certificate  = $certs/cacert.crt     # The CA certificate

    serial       = $dir/serial           # The current serial number

    crl          = $dir/crl.crt         # The current CRL

    private_key  = $dir/ssl.key/cakey.key # The private key

    RANDFILE     = $dir/ssl.key/.rand    # private random number file

    ```


    The [ CA_default ] section defines the location of all of the important CA files
    and directories. As you can see, in the previous example, the CA files are in
    the /etc/httpd/conf directory (the $dir variable).


    At this point, you’re ready to create the CA’s private key in the file /etc/httpd/conf/ssl.key/cakey.crt
    as well as a new CA certificate in the file /etc/httpd/conf/ssl.crt/cacert.crt
    by issuing the following commands:


    ```

    [ramon]$ cd /etc/httpd/conf

    [ramon]$ sudo echo ''01'' > serial

    [ramon]$ sudo cp /dev/null index.txt

    [ramon]$ sudo openssl req -new -x509 -keyout ssl.key/cakey.key -out ssl.crt/cacert.crt

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Each certificate issued by this CA carries a serial number. By adding the text
    01 to the file */etc/httpd/conf/serial*, you are seeding the file that the CA
    will use for assigning serial numbers. The *index.txt* file is used by the CA
    to maintain the database of certificates, and it must be created empty. You then
    issue an *openssl* command to generate the CA''s private key (*cakey.key*) and
    its X.509 certificate (*cacert.crt*).*


    Then, generate a certificate-signing request for the Apache server''s certificate
    and sign it with the private key of the CA using these steps:


    ```

    ```text

    [ramon]$ sudo openssl req -nodes -new -x509 -keyout $ ssl.key/server.key -out
    newreq.crt -days 365

    newreq.crt -out tmp.crt

    [ramon]$ sudo openssl x509 -X509toreq -in newreq.crt -signkey $ newreq.crt -out
    tmp.crt

    [ramon]$ sudo openssl ca -config openssl.cnf -policy policy_anything$ -out ssl.crt/server.crt
    -infiles tmp.crt

    ```

    ```


    The first command creates a private key for the Apache server (*server.key*) as
    well as a certificate-signing request (*newreq.crt*). The second and third commands
    take the certificate-signing request and use the CA''s private key to sign the
    certificate. The resulting Apache certificate file is saved as *server.crt*.


    For these changes to take effect, you need to restart the Apache daemon:


    ```

    ```text

    [ramon]$ sudo /etc/rc.d/init.d/httpd restart

    ```

    ```


    At this point, the Apache/mod_ssl server is ready to present the browser with
    a digital certificate that is signed by your CA''s private key. Since your CA''s
    certificate is not loaded onto commercial Web browsers by default, you have to
    do this by hand.


    As you learned in the previous chapter, Netscape Communicator only accepts certificates
    in the *PKCS#12* format, so in order to use SSL between your clients and your
    Apache servers, you need to force OpenSSL to export a copy of the root certificate
    as a .p12 file (the standard PKCS#12 file extension), using the following command:


    ```

    ```text

    [ramon]$ sudo openssl pkcs12 -export -in ssl.crt/cacert.crt -inkey$ ssl.key/cakey.key
    -name "MY CERTIFICATE" -out cacert.p12

    ```

    ```


    This *openssl* command takes the server''s *ssl.crt/cacert.crt* certificate and
    the server''s *ssl.key/cakey.key* private key and exports a PKCS#12-formatted
    certificate (*cacert.p12*) suitable for import into Netscape clients.


    You are then prompted for an *export password* to protect the certificate. Enter
    the export password twice for verification. Next, you have to distribute the *cacert.p12*
    file to all your users'' Web browsers. For example, to load this certificate onto
    Microsoft''s Internet Explorer v.5, take the following steps:


    +   1.  Select *Tools > Internet Options > Content*.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   2. Click the Certificates button.

    +   3. On the Certificates window shown in Figure 7.3, click the Import button.

    +   4. Follow the Wizard’s instructions and locate the certificate file (cacert.p12).

    +   5. Enter the certificate’s passphrase.

    +   6. Finish the import procedure by confirming the addition of the certificate.


    # **Figure 7.3**     Certificates dialog box, Trusted Root Certification Authorities


    ![](img/3258bbaf790525f8c4eb25fabff7844a_225_0.png)


    You have successfully loaded your CA’s certificate onto your browser, so every
    certificate signed by your CA should now be accepted because they are digitally
    signed by your CA. To test this, point your browser to the main page of your Apache/mod_ssl
    Web server. Assuming that you’re using Internet Explorer v.5, right-click anywhere
    on the page and select Properties. From the Properties window, click the Certificates
    button. Figure 7.4 shows how the browser reports a certificate issued by ca.hontanon.com,
    to our Apache server, redhead.hontanon.com, which is currently trusted.'
  merge: -1
