    # Cryptanalysis and Brute Force Attacks


    Most of the cryptographic algorithms in use today have proven to be robust enough
    to provide an appropriate level of confidentiality, integrity, and authentication.
    However, there have been several cases where some of these algorithms have been
    found to be vulnerable to attacks or mathematical exploits where the keyspace
    (the average number of combinations before the algorithm can be cracked) has been
    proven to be much smaller than initially thought. (By "mathematical exploits"
    I mean exploits that take advantage of flaws present in the functions used by
    the algorithm designers to derive prime numbers, generate keys, add entropy, and
    so on.)


    In 1998 we saw a highly publicized case of cryptanalysis, where renowned security
    experts Bruce Schneier and "Mudge" discovered a number of security flaws in Microsoft''s
    authentication algorithm for PPTP, a VPN protocol used in the Windows operating
    system. The MS-CHAP v.1 authentication algorithm was found to be vulnerable to
    password eavesdropping. In addition, the Microsoft Point-to-Point Encryption Algorithm
    (MPE) was also found to be much less effective than the 128-bit key strength that
    the vendor advertised, thereby exposing the user to eavesdropping attacks on the
    transmitted data. In 1999, Microsoft released MS-CHAP v.2 as an enhancement of
    the original version. However, a fundamental flaw still remains; the confidentiality
    of the VPN transmission is only as strong as the password that users choose for
    authentication.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'There is a Linux version of PPTP (PoPTop, discussed in Chapter 12) that is
    fully interoperable with the Microsoft implementation and is, therefore, subject
    to the same password-guessing weakness.


    This leads us to our last type of attack: brute force guessing of passwords and
    keys. As the computing power available to the average user increases at exponential
    rates, so does the potential for an intruder to guess your password or key. By
    employing a *brute force* approach, would-be attackers use idle computing power
    available to them in order to attempt to guess encryption keys until the correct
    one is found. These are also called *dictionary attacks*, because the attacker
    often uses a well-known dictionary to try to guess a password, based on the fact
    that most users tend to choose real words as their passwords.


    The power of brute force attacks on cryptographic algorithms was best illustrated
    in the summer of 1998 when the Electronic Frontier Foundation (EFF) was able to
    crack the 56-bit key of the DES algorithm using a purpose-built computer at a
    cost of $250,000. The feasibility of these types of attacks has raised the bar
    for cryptographic strength, and has raised the awareness of the limitations of
    even the strongest cryptography in use today.


    Now that you’ve seen who the enemies are and have taken a peek at their weapons
    of choice, let’s take a look at how you can orchestrate an appropriate defense,
    using some of the layers in the Open Systems Interconnect (OSI) model as a point
    of reference.


    # The Layered Approach to Information Security


    A lot of work has been devoted to the topic of adding security to the Linux kernel.
    There is now native kernel support for packet filtering, packet logging, masquerading,
    and even defense against denial of service attacks. This goes a long way toward
    securing the system itself, but are you willing to let intruders get all the way
    into the portals of your servers? An effective security policy is one that starts
    at the core of the Linux server, but keeps moving outward by including protection
    mechanisms outside of the system itself. Your defense should cover the network
    configuration of the server, the network applications that run on the server,
    the perimeter of the corporate network, and even the remote access clients used
    by road warriors to access corporate resources from the public Internet.


    Let’s take a closer look at the considerations that apply to each of these layers.
    Note that this discussion will work its way outward from the Linux kernel toward
    the Internet.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# ## Physical Security


    This is the most fundamental and often the most overlooked type of Linux server
    security. Physical security starts with the surroundings of the server itself.
    Is the room to the data center kept under lock and key? If so, who is allowed
    to enter the room? Are contractors and maintenance workers escorted? If you''re
    building a new installation or moving into a new location, follow this simple
    set of guidelines when designing the physical layout of your data center:


    +   - Install magnetic card readers to access the data center. Review the access
    logs periodically. Look for unusual patterns of access. Ask the users for verification
    of their log entries.

    +   - Escort maintenance workers and field technicians at all times while in the
    data center.

    +   - Change the default passwords on terminal servers, remote control devices,
    and power distribution units. Create accounts for each administrator. Monitor
    their use.

    +   - Choose Linux servers with a front panel lock to keep intruders from rebooting
    the machine and from inserting foreign media into the drives.

    +   - Avoid using incoming phone lines to console ports unless it''s strictly
    necessary. Use dial-back modems.

    +   - Enable password-protected screensavers, like `xlock` and `vlock` on the
    X-displays of Linux servers.

    +   - Install a good monitoring device that alerts a human in the event of excessive
    temperature, smoke, or humidity in the data center.


    It''s important to keep in mind that the main goal of physical security is to
    maintain high availability of your server installation. Make sure that your servers
    are not on the same electrical circuits as receptacles and appliances that are
    accessible from outside the data center. You would be surprised how much downtime
    I can create by sticking a screwdriver in an electric receptacle or light socket
    in the middle of a three-day weekend.


    > > **TIP** Providing redundant power supplies is the answer to a lot of these
    types of problems. If the servers support it, use it!


    I don''t recommend that you set BIOS and boot-loader passwords, because they will
    prevent the system from coming up from a reboot without human intervention. This
    could seriously jeopardize availability unless you have staff available to care
    for your servers 24/7.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# System Security


    The most fundamental security requirement of a Linux server is the guarantee that
    an active nonprivileged user cannot gain access to another user’s protected resources
    or more important, to areas of the system reserved for privileged system accounts.
    More subtle vulnerabilities include users’ abilities to overextend their file
    quota, CPU use, or maximum number of active processes. All of these violations
    could constitute the seed of a potential DoS attack, which could render the system
    or some of its parts temporarily unavailable, or even permanently disabled. Part
    1 of this book (Chapters 1 through 3) is devoted to the topic of Linux system
    security.


    # Network Security


    Securing the system from the potential mischief of employees or users who are
    otherwise in good standing is a great step forward, but it only covers the case
    where the system is isolated from the outside world. This is clearly not a realistic
    prospect, since most Linux servers are deployed to serve the user population over
    a network that is often public. Thus, the diligent Linux administrator should
    carefully evaluate the server’s physical connection to the network, including
    all its interfaces, their TCP/IP configurations, and, most important, the configuration
    of the server’s active network daemons. Part 2 of this book, “Network Security”
    (Chapters 4 and 5), describes the details of network security, including practical
    strategies and the tools available for securing your network.


    # Application Security


    Some of the daemons that come standard in today’s Linux distributions are actually
    full-fledged applications with a fairly complex set of configuration files. Unlike
    simple telnet and FTP daemons, Web, mail, and file servers use complex protocols.
    In order to protect these services, network administrators must deploy a security
    defense particular to each protocol. These application-specific mechanisms are
    the topic of Part 3 of this book, “Application Security” (Chapters 6 through 8).


    # Perimeter Security


    The firewall is the workhorse of network security. Firewalls are a pivotal part
    of a complete security solution, protecting the perimeter of the local area network
    where it connects to the public Internet. While the main purpose of a firewall
    is to keep unwanted traffic out of the local network, this is also the place where
    you can log all the traffic going into and out of the network. While most firewalls
    are dual-homed (two network interfaces), some have additional interfaces that
    you can use to attach bastion and extranet servers, whose access permissions are
    such that they need to be physically segregated from'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'the local area network. Firewalls and their role in perimeter security are
    covered in Part 4 of this book, "Perimeter Security" (Chapters 9 through 11).


    # ## Remote Access and Authentication


    Just about the time when system administrators managed to get a handle on network
    security, virtual private networks appeared on the scene, and administrators''
    jobs got a whole lot tougher. The network perimeter now extends to all the systems
    that connect to it remotely, at least for the duration of the dial-in session.
    VPN standards like IPsec and PPTP provide a common framework for data privacy,
    but they do not completely address the issue of authentication, and they fail
    to cover the issue of authorization and access control. Part 5, "Remote Access
    and Authentication" (Chapters 12 and 13), discusses the topic of virtual private
    networking and remote access security.


    # ## Human Security


    Regardless of how much time and energy you devote to developing a sound security
    strategy, humans are ultimately at the controls, and they are often the weakest
    link in the information security chain. The most air-tight of perimeter defenses
    can be rendered totally useless by an insider with an axe to grind, and the strongest
    password policy cannot cope with users who write their passwords on yellow sticky
    notes and paste them on their monitor.


    Conducting security awareness training and monitoring security policy compliance
    is a step in the right direction, but as is often the case, there are many other
    less tangible factors that contribute to the security of your server installation.
    Employees who are disgruntled or just bored present a considerable risk to your
    enterprise, especially those who have access to sensitive information that could
    be used by a competitor.


    There is no substitute for a satisfied employee who is challenged by the work
    and rewarded for his or her effort. While ethics and behavior are difficult to
    monitor and enforce, it is just as effective to ensure employees'' good morale
    and motivation. A yearly company picnic and a generous performance incentive bonus
    program could be your company''s best investment in information security.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '**WARNING** If you have to fire disgruntled employees, you or a member of the
    security staff should escort them out of the building and make sure that they
    are not permitted to touch any computer before they leave. Even before you fire
    them, you should have their access removed and passwords changed. Otherwise, you
    are inviting disaster.


    # ## In Sum


    Security is often a poorly understood topic. There is often too much emphasis
    on tools and not enough emphasis on procedures and methods. An efficient security
    defense should start with a comprehensive security policy upon which you can build
    an appropriate set of mechanisms. Remember that security is a process!


    The goal of information security is to ensure confidentiality, integrity, authentication,
    and availability of the data on your servers. Cryptography is the only viable
    way to ensure that data is properly protected as it is exchanged over the Internet.


    There is a diverse array of vulnerabilities and types of attacks that you need
    to be prepared to defend against. The only way to put up and maintain an effective
    defense is to start with the system and work your way out toward the perimeter,
    considering each layer separately. Don’t forget to account for remote access to
    your Linux server.


    We’ll start the detailed discussion of this layered approach by taking a close
    look at system security in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 2


    # System Installation

    and Setup


    The previous chapter, “Understanding Linux Security,” offers an overview of the
    most important concepts in information security in general, and Linux server security
    in particular. This chapter starts drilling into the details by discussing the
    security implications of the following Linux server administration tasks:


    +   - Choosing a Linux distribution

    +   - Building a secure kernel

    +   - User account security

    +   - File and directory permissions

    +   - syslog security

    +   - Filesystem encryption


    Note that you will be taking on these tasks before you even connect your server
    to the network. Although most of us associate security with network layer services,
    a number of important security issues must be decided during the setup and configuration
    of the system itself. This chapter guides you through the process of choosing
    the distribution that is best suited for your security needs and goes on to offer
    specific advice on how to configure your kernel to maximize system and network
    security. Finally, this chapter gives you practical advice on securing the accounts
    and the filesystem to ensure that you'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'can offer your users an adequate level of protection against attacks from other
    legiti-

    mate, or seemingly legitimate, system users. You''ll learn how to minimize the
    expo-

    sure of your root user, and you''ll learn about the tools available to implement

    filesystem encryption on your Linux server.


    Let''s start by taking a look at the process of selecting a Linux distribution
    that''s right

    for you.


    # # Choosing a Linux Distribution


    A crucial step in building a secure Linux server is selecting the distribution
    that best fits

    your needs outlined in your security policy. This decision is going to determine
    much of

    your success in installing and maintaining a secure Linux server. But what exactly
    makes

    a distribution "secure?" Here is a set of criteria to consider before making that
    decision:


    +   - Does the vendor have a well-known mechanism to report security vulnerabilities

    +   found in its distribution?

    +   - Does the vendor issue periodic security advisories that warn users of vulnerabilities

    +   found in its distribution?

    +   - How often are security issues resolved? Does the vendor devote a well-delineated

    +   portion of its Web or FTP site to security information (patches, security
    updates, etc.)?

    +   - How often does the vendor release general distribution upgrades? A slow-moving

    +   release schedule is likely to prolong the exposure of known vulnerabilities.

    +   - Does the vendor offer an intuitive, easy-to-use tool for installing and
    updating

    +   software packages?

    +   - Does the vendor support open source efforts to improve Linux security or
    to create

    +   vendor-neutral security scripts and tools?

    +   - How long has the vendor has been in existence?

    +   - Have the previous versions been secure and well maintained?


    As with any other choice of Linux software, there is no clear winner here, but
    you can

    make a more educated decision by finding out the vendor''s general stance in these
    areas.

    The following sections look at the most prominent Linux distributions and examine
    the

    security features of each one.'
  merge: -1
