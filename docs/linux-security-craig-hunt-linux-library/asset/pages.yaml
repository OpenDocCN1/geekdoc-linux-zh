  md: '# **Using Kerberos to Allow Others to Access Your Account**


    The ability to grant temporary access rights to your account is one of the most
    useful features of Kerberos authentication on a Linux server. By creating a .k5login
    file in your home directory, you can grant temporary access to other users without
    having to give them your password. Instead, simply add their principal names (one
    per line) to the .k5login files to allow them access, as in the following example:


    ```

    ```

    [ramon]$ more .k5login

    alice@HONTANON.COM

    bob@SYBEX.COM

    ```

    ```


    If Alice or Bob can successfully obtain a ticket for their principal, they will
    be allowed to log in to your account. This feature can also be used to grant non-privileged
    users temporary root access by simply entering their principal name in /.k5login
    (assuming that your root user’s home directory is /). This saves you from both
    giving out the root password and from exposing the password on the network.


    # **Using Kerberos-Enabled Applications**


    Once a user has a TGT, they can use a number of Kerberized applications to access
    remote services without having to identify themselves to each of them. The Linux
    Kerberos distribution ships with modified versions of the most popular network
    clients: telnet, ftp, rlogin, rsh, and rcp. Let’s take a look at the Kerberos
    use of these applications.


    # telnet


    Kerberos extends the standard Linux command with the command-line options listed
    in Table 13.6.


    **Table 13.6** *Kerberos telnet Client Command-line Options*


    | Option | Meaning |

    | :----- | :----- |

    | -k *realm* | Request tickets for a realm other than the one specified in the
    *default_realm* variable in the */etc/krb5.conf* file. |

    | -K | Authenticate but do not log in. |

    | -a | Perform automatic login with your credentials and your local username (the
