  md: '**Port Patterns** SOCKS5 allows you to select appropriate actions based on
    both the source and destination ports in the connection request. You will use
    the destination most often. I recommend that you enter a port name in `/etc/services`
    for all the ports you use in the configuration file. This makes the configuration
    file more readable and guards against the typing mistakes common in port numbers.
    Table 10.4 lists the port patterns that SOCKS5 recognizes.


    **Table 10.4** *socks5.conf* Port Patterns


    | Pattern | Description |

    | :--- | :--- |

    | Port-name | Service name as per /etc/services |

    | Port-number | Port number (must match exactly) |

    | - | Wildcard (all port numbers match) |

    | [x,y] | Port number range from x to y |


    **Auth Patterns** A single letter is used to instruct SOCKS5 to use one of the
    available types of authentication (listed in Table 10.5). Username and password
    is the simplest form of authentication and works with very little additional configuration.
    Kerberos 5 support must be compiled in the SOCKS5 server executable. Always use
    either username/password or Kerberos authentication.


    **Table 10.5** *socks5.conf* Auth Patterns


    | Pattern | Description |

    | :--- | :--- |

    | u | Username/password |

    | k | Kerberos 5 (when GSSI-API support is compiled in) |

    | n | No authentication |

    | n, k, u | Multiple authentication methods (last one used first) |

    | - | Wildcard (all authentication methods match) |'
