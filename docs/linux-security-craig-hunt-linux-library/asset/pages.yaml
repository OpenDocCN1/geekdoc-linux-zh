- pgno: 277
  md: '# Table 9.5 iptables Rule Specification Parameters (continued)


    | Parameter | Meaning |

    | :---- | :---- |

    | -d [!]address[/mask] | Destination address to match. The same rules as the `-s`
    parameter apply here. |

    | --dport [port:[port]] | Specification of destination port or destination port
    range. |

    | -i [!]interface | Interface through which the packet was received, such as eth0,
    ppp0, etc. |

    | -o [!]interface | Interface through which the packet is to be sent, such as
    eth0, ppp0, etc. |

    | [!] -f | The packet is a second or subsequent fragment of a larger fragmented
    packet. |


    Note that for each of the parameters listed in Table 9.5, a leading exclamation
    mark [!] instructs iptables to look for packets that do not meet that criterion.
    The rule specification parameters for iptables are very similar to the parameters
    available to ipchains, and they include options to match the protocol ID of the
    incoming packet (-p), the source and destination address (-s and -d) as well as
    the source and destination port number (-sport and -dport).


    In addition to these basic parameters, you can specify extended matching parameters
    for packets of certain types (e.g., tcp, udp, and icmp), by using protocol-specific
    rules. For example, the following iptables line will match and accept all ICMP
    packets that carry the echo-request type (the type of packets used by the ping
    application).


    ```

    iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT

    ```


    The converse of the previous command is


    ```

    iptables -A OUTPUT -p icmp --icmp-type echo-reply -j ACCEPT

    ```


    where you allow the local system to reply to the echo-request with an echo-reply,
    so that your system responds to ping requests properly.


    Table 9.6 lists the protocol-specific parameters corresponding to the TCP, UDP,
    and ICMP traffic types included in iptables.'
