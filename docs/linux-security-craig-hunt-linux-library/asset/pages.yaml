    # **Listing 9.6** Sample *iptables* Static NAT configuration


    ```

    iptables -t nat -A POSTROUTING -s 10.10.10.1 -o eth0 -j SNAT --to-↩

    208.209.210.1

    iptables -t nat -A PREROUTING -s 208.209.210.1 -i eth0 -j DNAT --to-↩

    10.10.10.1

    ```


    The first command in Listing 9.6 makes sure that the source field of packets originating
    from 192.168.1.1 is changed to 208.209.210.1 just before it leaves interface eth0.
    The second command performs the opposite destination translation just as the packet
    arrives in eth0 and before routing takes place.


    Load-sharing NAT (LSNAT) can be accomplished by simply specifying a -j DNAT rule
    where you perform destination NAT from one incoming address to several destination
