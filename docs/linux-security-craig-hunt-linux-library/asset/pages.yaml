    There are two components to the Nessus system: the client (nessus) and the server\
    \ (nessusd). You can control the server with a variety of different clients since\
    \ these components are offered for Linux (X11/GTK), Windows32, and even as a Java\
    \ application. The server maintains a list of users with an associated set of\
    \ permissions, so it's possible for two clients to log on to the server to perform\
    \ a separate set of auditing tasks at the same time. The privacy of the communication\
    \ between the client and the server can be protected with one of a number of encryption\
    \ protocols; payload compression can even be added.\n\nThe Nessus Attack Scripting\
    \ Language (NASL) allows you to automate predefined security scans that can then\
    \ be run periodically out of cron. The scripts simply select the server and plug-ins\
    \ to be used, the security tests to be applied, and the range of addresses that\
    \ you want to audit.\n\nWhile the Nessus software remains in the public domain\
    \ under the GPL agreement, nessus.com offers free-based professional auditing\
    \ services using the same code base. This ensures the continued development of\
    \ the system and keeps its quality and usability high.\n\n# Installing Nessus\n\
    \nThe Nessus system can be installed from both the sources and from the RPM package\
    \ distributions. I recommend that you install it using the RPM distributions,\
    \ which are available from the same site as the sources. You need three separate\
    \ RPM packages to build the entire Nessus distribution:\n\n+   * nessus-X.X-X-X.i386.rpm\
