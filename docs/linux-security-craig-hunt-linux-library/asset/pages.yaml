    As always, the use of Nmap is a double-edged sword. Although this utility should
    be in every security administrator’s toolkit, always be vigilant and look for
    evidence of an Nmap scan on your network because that is typically the precursor
    of an attack. The swatch and logcheck utilities discussed in Chapter 3, “System
    Monitoring and Auditing,” are well suited for this purpose.


    Both Nessus and Nmap identify potential exploits on a target system by contacting
    it via the network. An alternative class of host-based auditing tools accomplishes
    the same task, but the tools are executed on the target system itself. The next
    section in this book explores host-based auditing in more detail and introduces
    some examples of the host-based approach to network security auditing.


    # ## Host-Based Auditing Tools


    While Nessus and Nmap allow you to play the part of the “bad guy” attempting to
    break into your Linux server from the public network, the majority of successful
    network attacks are actually staged from the inside. This fact prompted the Unix
    community to'
  merge: -1
  img_proc: true
- pgno: 161
  md: "design a tool that could be used on the system itself, to identify vulnerabilities\
    \ from inside attacks.\n\nIn 1993, Dan Farmer, who is also the author of the SATAN\
    \ network-based audit tool, released a utility called COPS (Computer Oracle and\
    \ Password System). A pioneer in the field of host-based security auditing, COPS\
    \ is actually a collection of smaller tools, each of which targets a specific\
    \ vulnerability in a typical Unix system that can lead to a network attack. These\
    \ checks extend to areas like the anonymous FTP server, the/etc/rc.* directories,\
    \ cron entries, and NFS and Sunmail vulnerabilities.\n\nTexas A&M University released\
    \ a set of host-based auditing scripts (code-named Tiger) as a follow-up to COPS,\
    \ but stopped developing new features in 1994. Both COPS and Tiger are now hopelessly\
    \ out of date, but a worthy successor has emerged. The next section describes\
    \ the Advanced Research Corporation's TARA package.\n\n# TARA\n\nTARA (Tiger Auditors\
    \ Research Assistant) is a 1999 update of the Tiger system from Texas A&M by a\
    \ private company (Advanced Research Corporation) working under funding from the\
    \ National Institutes of Health (NIH). The resulting package was released to the\
    \ public domain under the auspices of the GNU General Public License (GPL).\n\n\
    As was the case with Tiger, TARA is a set of shell scripts controlled by a central\
    \ utility, which is still named tiger to honor its direct ancestor. The main goal\
    \ of this tool is to identify settings on your Linux server that would make it\
    \ easier for an intruder to gain root privileges over the network. TARA is meant\
    \ to run both interactively and periodically in batch mode. Either way, the result\
    \ is a report of the potential vulnerabilities found at the time of its execution.\n\
    \nThe next section explains how to download and install the latest versions of\
    \ the TARA scripts on your Linux server.\n\n# Installing TARA\n\nThe TARA distribution\
    \ can be obtained directly from the ARC Web site at http://www-arc.com/tara/.\
    \ There is no RPM package available, so you have to download the source archive.\
    \ Simply decompress and extract the archive as shown in Listing 5.8.\n\n# **Listing\
    \ 5.8** Extracting the TARA archive\n\n```\n```bash\n[ramon]$ ls -l tara-2.0.9.tar.gz\n\
    -rw-r-- 1 ramon users 355267 Nov 18 17:13 tara-\\| \n2.0.9.tar.gz\n[ramon]$ gzip\
    \ -dc tara-2.0.9.tar.gz | tar -xf -\n[ramon]$ cd tara-2.0.9\n[ramon]$ sudo mkdir\
    \ -p /usr/spool/tiger/work\n```\n```"
  merge: -1
  img_proc: true
- pgno: 162
  md: '```

    [ramon]$ sudo mkdir -p /usr/spool/tiger/logs

    [ramon]$ sudo mkdir -p /usr/spool/tiger/bin

    [ramon]$ sudo make install

    ```


    The steps in Listing 5.8 install the appropriate TARA files in the /usr/local/tiger
    directory, including the main tiger executable, /usr/local/tiger/tiger. Note that
    you have to create the following three directories outlined in the Makefile file
    that comes standard with TARA:


    +   TIGERWORK=/usr/spool/tiger/work This directory is used for temporary scratch
    files by the tiger executable. The default directory is something other than /tmp
    so you can easily identify (and clean up) the temporary files created by the application.


    +   TIGERLOGS=/usr/spool/tiger/logs This directory is where the tiger reports
    are saved.


    +   TIGERBIN=/usr/spool/tiger/bin This directory is where the TARA auxiliary executables
    go.


    > **NOTE** You have to add /usr/local/tiger to your PATH environment variable
    if you want to invoke the tiger executable without specifying the complete file
    path.


    The next section explains how to use the TARA configuration file.


    # Configuring TARA


    The TARA configuration file resides in /usr/local/tiger/tiger.rc. TARA ships with
    a default tiger.rc file, but I recommend that you make the following changes before
    using the application:


    +   Tiger_Check_CRON=Y Setting this option to Y causes TARA to check cron entries
    for all users and identify possible vulnerabilities in the commands contained
    in them. The default value is N.


    +   Tiger_Check_KNOWN=Y Setting this option to Y tells TARA to check for indications
    of known break-in attempts. The default value is N.


    +   Tiger_Check_PERMS=Y Setting this option to Y tells TARA to check permissions
    and ownership of system files, looking for directories that are wide open. It
    also directs Tiger to check permissions and ownership of the setuid/setgid files.
    The default value is N.


    +   Tiger_Check_FILESYSTEM=Y Setting this option to Y directs TARA to perform
    filesystem checks, including checking the ownerships of the mount points and the
    permissions of the NFS exports. The default value is N.


    +   Tiger_Check_PATH=Y Setting this option to Y tells TARA to check the PATH settings
    for system accounts and to look for directories that would normally not be in
    a privilege user''s PATH. The default value is N.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "These options are turned off in the default **tigercc** file in order to save\
    \ time because some of these checks could take several minutes, depending on the\
    \ speed and complexity of the filesystem on your Linux server. However, it's important\
    \ to the security of your server that these checks take place so make sure to\
    \ modify the **tigercc** file appropriately.\n\n# Using TARA\n\nOnce TARA has\
    \ been installed and configured, you invoke it by simply typing the name of the\
    \ main executable (you'll need root privileges), as shown in Listing 5.9.\n\n\
    # **Listing 5.9** TARA execution\n\n```\n    [ramon]$ sudo tiger\n    Tiger  Analytical\
    \  Research  Assistant  (TARA)\n    Developed  by  Texas  A&M  University,  1994\n\
    \    Updated  by  The  Advanced  Research  Corporation,  1999\n    Covered  by\
    \  GNU  General  Public  License  (GPL)\n\n    Using  configuration  files  for\
    \  Linux  2\n    18:42> Beginning security report for redhead.hontanon.com.\n\
    \    18:42> Starting file systems scans in background...\n    18:42> Checking\
    \ password files...\n    18:42> Checking group files...\n    18:42> Checking user\
    \ accounts...\n    18:42> Checking .rhosts files...\n    18:42> Checking .netrc\
    \ files...\n    18:42> Checking tftab, login, securetty, and ftpusers files...\n\
    \    18:42> Checking PATH settings...\n    18:42> Checking anonymous ftp setup...\n\
    \    18:42> Checking mail aliases...\n    18:42> Checking cron entries...\n  \
    \  18:42> Checking 'inetd' configuration...\n    18:42> Checking NFS export entries...\n\
    \    18:42> Checking permissions and ownership of system files...\n    18:42>\
    \ Checking for indications of breakin...\n    18:42> Performing system specific\
    \ checks...\n    18:42> Waiting for filesystems scans to complete...\n    18:45>\
    \ Filesystems scans completed...\n\n    18:45> Security report completed for redhead.hontanon.com.\n\
    \    Security report is in '/usr/spool/tiger/logs/security.report.goofy.001118-18:42'\
    \ .\n```\n\nAs you can see by the last line in Listing 5.9, the result of the\
    \ TARA run is a textual report that is stored in a file called **security.report.goofy.001118-18:42**.\
    \ The name of the"
  merge: -1
  img_proc: true
- pgno: 164
  md: 'file includes the host name (goofy) date in *YYMMDD* format, as well as the
    time of day (*HH:MM*) when the command was executed. The contents of this file
    are shown in Listing 5.10.


    > **NOTE** For an HTML-formatted report, simply type *tiger -H*.


    # **Listing 5.10**  A typical TARA report


    ```

    [ramon]$ cd /usr/spool/tiger/logs

    [ramon]$ sudo more security.report.goofy.001118-18:42

    18:42> Beginning security report for goofy (i686 Linux 2.2.12-20).

    # Checking accounts from /etc/passwd.

    --WARN-- [acc001w] Login ID postgres is disabled, but still has a valid shell.

    --WARN-- [acc001w] Login ID uucp is disabled, but still has a valid shell.

    # Performing check of PATH components...

    --WARN-- [path002w] /usr/bin/activated in root''s PATH from default is not owned
    by root (owned by news).

    --WARN-- [path002w] /usr/bin/actmerge in root''s PATH from default is not owned
    by root (owned by news).

    # Checking services from /etc/services.

    --FAIL-- [inet003f] The port for service imap is assigned to service imap2.

    --FAIL-- [inet003f] The port for service irc is assigned to service ircd.

    # Performing check of system file permissions...

    --WARN-- [perm001w] /etc/exports should not have group read.

    --WARN-- [perm001w] /etc/exports should not have world read.

    # Performing checks for Linux/2...

    --ERROR-- [misc005w] Can''t find check_sendmail''...

    # Checking symbolic links...

    --WARN-- [xxxxx] The following files are unowned:

    /usr/local/netscape/netscape

    ```


    The report in Listing 5.10 has unveiled a number of warnings and errors that could
    lead to security vulnerabilities:


    +   *   Two usernames in */etc/passwd* (postgres and uucp) are accounts that have
    been disabled, but they still have a valid shell. The implication here is that
    you should assign a non-working shell to accounts that have been deactivated.

    +   *   Two executables were found on root''s PATH that are not actually owned
    by root. This leaves the window open for root to accidentally execute code that
    is controlled by a regular user, which clearly represents a vulnerability.

    +   *   Two services (*imap* and *irc*) are not using well-known TCP port numbers.'
  merge: -1
