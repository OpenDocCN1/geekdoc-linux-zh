    # Running tripwire


    You''re almost ready, but before you start comparing file signatures to look for
    tampering, you need to snap a baseline of what the signatures should look like
    on all the files in your policy. This takes place when you first initialize the
    signature database using the following command:


    ```

    [ramon]$ /usr/TSS/bin/tripwire --init

