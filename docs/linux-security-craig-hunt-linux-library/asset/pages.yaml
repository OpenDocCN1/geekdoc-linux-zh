  md: '![](img/3258bbaf790525f8c4eb25fabff7844a_442_0.png)


    # # PAM Module

    Reference


    This appendix provides implementation details for a select number of Pluggable
    Authentication Modules (PAMs). Chapter 13, “Strong User Authentication,” describes
    the Linux PAM feature in detail and explains how to use the PAM modules to control
    client authentication for network applications. This appendix will help you decide
    which modules will be most effective in assuring the security of your Linux server.


    Each module-specific section in this appendix describes the functionality of the
    module, the management group to which the modules applies, and the module’s configuration
    arguments and includes examples illustrating the module’s suggested use.


    # ## Overview


    PAM modules perform four categories of authentication tasks, called *management
    groups*:


    **Authentication** PAM establishes whether the user is who they claim to be. PAM
    will prompt the user for a name or password if necessary for authentication. This
    can be achieved using a simple method like standard username/passwords, a more
    complex method such as challenge-response authentication, or a time-based hardware
    token card.'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# 436 Appendix B PAM Module Reference


    Account PAM provides verification services based on the account information. This
    management group concerns itself with questions like the following: Has the user
    password expired? Does this user belong to the right group to be allowed access
    to a particular service?


    Password PAM takes care of any necessary updates of the authentication token associated
    with the user. Once the user is authenticated, this management group prompts a
    user for a new password if the previous password has expired.


    Session PAM does a number of things in preparation for granting the user access
    to the resources or right before the service is to be withdrawn. Session management
    tasks include logging events, mounting home directories, etc.


    More information about these management groups is available in Chapter 13.


    PAM consults a configuration file for each type of network service to authenticate.
    These configuration files are named /etc/pam.d/service, where service is the name
    of the network application to be configured (e.g., ftp, Samba, and sshd). The
    /etc/pam.d/ other file is always consulted after the service in question.


    Each line in the configuration files has the following format:


    ```

    module_type control_flag module_path arguments

    ```


    These fields have the following meanings:


    module_type A PAM module can be one of four types; these types correlate to the
    management groups described earlier in this appendix:


    +   - auth

    +   - account

    +   - session

    +   - password


    control_flag Since PAM modules are often stacked and executed in sequence, the
    control_flag field determines what effect the success or failure of a single module
    should have on the overall authentication result returned to the application.
    This field can have one of the following values:


    +   - required: Failure in this module results in overall authentication failure.
    Execution continues to the remaining modules.

    +   - requisite: This value means the same as required, but execution of the module
    sequence halts if the result is a failure.

    +   - sufficient: Success in this module is enough to result in an overall authentication
    success. If no other required modules are in the sequence, execution stops.

    +   - optional: Success of this module is not necessary for overall success.'
  merge: -1
  img_proc: true
