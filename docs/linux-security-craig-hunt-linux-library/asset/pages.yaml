  md: "(One-time Passwords In Everything) also introduces a number of bug fixes and\
    \ includes an installation system much easier than the original Bellcore S/Key\
    \ installation system.\n\n# ## Installing OPIE\n\nRPM distributions of the OPIE\
    \ system should be readily available from your favorite Linux repository. Simply\
    \ download the latest package and install it using the following command:\n\n\
    ```\n    [ramon]$ sudo rpm -i opie-2.32-5.i686.rpm\n```\n\n# ## Configuring OPIE\n\
    \nYou need to perform three tasks to get OPIE running on your Linux server. First,\
    \ create a file named `/etc/opieaccess` to define which network clients are allowed\
    \ to use regular passwords and which network clients are allowed to use one-time\
    \ passwords. By default, OPIE allows the use of both regular and one-time passwords,\
    \ and you may want to have at least one host from which to log on using regular\
    \ passwords in case you experience problems generating one-time passwords. This\
    \ should be the local host (i.e., the console).\n\nThe general format of the `/etc/opieaccess`\
    \ file is:\n\n*action* *network* *mask*\n\nThe value of the *action* field can\
    \ be either *permit* or *deny*. The *network* and *mask* fields denote the network\
    \ to which the action pertains. Consider the following example where you allow\
    \ the local host (127.0.0.1) as well as the entire 163.179.251.0 class-C network\
    \ to use regular passwords, except for host 163.179.251.1, which, along with all\
    \ other non-specified hosts, needs to provide an OPIE response to a challenge\
    \ in order to successfully log on:\n\n```\n    [ramon]$ more /etc/opieaccess\n\
    \    permit 127.0.0.1 255.255.255.255\n    permit 163.179.251.0 255.255.255.0\n\
    \    deny 163.179.251.1 255.255.255.255\n```\n\nSecond, you need to replace the\
    \ standard Linux `/bin/login` program with the OPIE login program (`/usr/sbin/opielogin`).\
    \ Simply enter the following commands:\n\n```\n    [ramon]$ cd /bin\n    [ramon]$\
    \ sudo mv login login.ORIG\n    [ramon]$ sudo cp /usr/sbin/opielogin /bin/login\n\
