    # The pam_pwdb Module


    The pam_pwdb module provides a generic interface to the Password Database library
    (pwdb). The use of the pam_pwdb module varies according to the management group
    in question:


    Account When used as an account function, the pam_pwdb module establishes the
    status of the user''s account and password. In the case of the password, pam_pwdb
    may offer advice to the user on changing their password, and it may even delay
    giving service to the user until they have established a new password.


    Authentication When used as an authentication function, the pam_pwdb module determines
    under what conditions the password provided by the user should be used to authenticate
    them to a requested service.


    Password When used as a password function, the pam_pwdb module updates the user''s
    password. Using libpwdb, this module can move the user''s password from one database
    to another.


    Session When used as a session function, the pam_pwdb module logs the username
    and the service type to syslog. Messages are logged at the beginning and at the
    end of the user''s session.


    The pam_pwdb module is typically used in services like /etc/pam.d/login, and its
    syntax is as follows:


    ```

    module_type control_flag pam_pwdb.so arguments

    ```


    The arguments you can use with the pam_pwdb module vary according to the management
    group in question.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '**Account** The arguments for the account management group are as follows:


    +   * debug: This option makes the pam_pwdb module write diagnostic information
    to syslog.


    **Authentication** The arguments for the authentication management group are as
    follows:


    +   * debug: This option makes the module write diagnostic information to syslog.


    +   * try_first_pass: This argument forces the pam_pwdb module to attempt the
    previous stacked authentication module’s password in case that satisfies this
    module as well.


    +   * use_first_pass: This argument forces the pam_pwdb module attempt to use
    the previous stacked authentication module’s password and effectively never prompts
    the user for one. Note that if no password is available or the password is not
    appropriate, the user is denied access altogether.


    +   * nullok: By default, the pam_pwdb module does not permit the user access
    to a service if their password is blank. The nullok argument overrides this default.


    +   * nodelay: By default, the pam_pwdb module requests a delay-on-failure of
    the order of one second. The no_delay argument discourages the authentication
    component from requesting a delay should the authentication as a whole failure.


    +   * likeauth: This argument makes the pam_pwdb module return the same value
    when called as a credential setting module and as an authentication module. This
    is useful to allow libpam take a sane path through the authentication component
    of your PAM configuration file.


    **Password** The arguments for the password management group are as follows:


    +   * debug: This option makes the module write diagnostic information to syslog.


    +   * nullok: By default, the pam_pwdb module does not permit the user access
    to a service if their password is blank. The nullok argument overrides this default.


    +   * not_set_pass: This argument informs the pam_pwdb module that it is not to
    pay attention to or make available the old or new passwords from to or other stacked
    password modules (other authentication modules present in the same service).


    +   * use_authtok: This argument forces the pam_pwdb module to set the new password
    to the one provided by the previously stacked password modules.


    +   * try_first_pass: This argument forces the pam_pwdb module to attempt the
    previous stacked authentication module’s password in case that satisfies this
    module as well.


    +   * use_first_pass: This argument forces the pam_pwdb module attempt to use
    the previous stacked authentication module’s password and will effectively never'
