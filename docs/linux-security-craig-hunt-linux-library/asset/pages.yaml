  md: "This section uses the WAN vs. IPsec scenario depicted in Figures 12.1 and 12.2\
    \ as an example. Consider that you have placed Linux servers as perimeter devices\
    \ doing network layer filtering in both the Denver and the Boston locations. The\
    \ conceptual diagram of this scenario is illustrated in Figure 12.7.\n\n# **Figure\
    \ 12.7** Using Linux FreeS/WAN to implement a dedicated VPN connection\n\n![](img/3258bbaf790525f8c4eb25fabff7844a_370_0.png)\n\
    \nThe challenge is to configure the Denver and Boston servers as security gateways\
    \ that can act as IPsec tunnel endpoints to protect any traffic that travels from\
    \ the Denver LAN to the Boston LAN and vice versa. Note that although both security\
    \ gateways have Internet routable addresses on their public interfaces (65.66.67.10\
    \ for DENVER and 65.55.76.11 for BOSTON), their internal addresses are not routable\
    \ (10.10.10.1 and 10.20.20.1 respectively). This does not present a problem for\
    \ IPsec routing, as long as ESP tunnel mode is used and network address translation\
    \ (NAT) is performed at the security gateways.\n\nLet’s start by ensuring that\
    \ both DENVER and BOSTON are configured to forward IP packets. Insert the following\
    \ line in the /etc/rc.local script of both gateways:\n\n```\n```bash\n    echo\
    \ '1' > /proc/sys/net/ipv4/ip_forward\n```\n```\n\n# **Editing the ipsec.secrets\
    \ File**\n\nNext, edit the /etc/ipsec.secrets file to establish a set of secrets\
    \ for the authentication of all your remote peers:\n\n```\n```bash\n[ramon]$ sudo\
    \ cat /etc/ipsec.secrets\n# Pre-shared key\n```\n```"
