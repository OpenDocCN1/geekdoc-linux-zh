    # Turbolinux


    This vendor has been in the Linux market since 1992 and has had a great deal of
    success in the Asian and European markets. Even though it has not been embraced
    as widely as Red Hat and Caldera in the U.S., it has gained a lot of momentum
    in recent months, especially in the high-end server application market.


    The Turbolinux release schedule is significantly longer than Red Hat''s and Caldera''s,
    but they maintain a list of security updates for each release at http://www.turbolinux.com/security
    (see Figure 2.3). They also include a separate security subdirectory for each
    release update section in their FTP site.'
