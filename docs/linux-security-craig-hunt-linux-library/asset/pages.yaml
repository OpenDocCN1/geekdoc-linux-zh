  img_proc: true
- pgno: 116
  md: 'a space, as described in this section. Note that each field must be included
    on each line. These seven fields are as follows:


    **Service Name** The *service name* field is the actual name of the service to
    listen for (e.g., telnet, ftp, finger, etc.). These services should correspond
    to a TCP or UDP port number, and this mapping should be present in the */etc/services*
    file (discussed later in this chapter) or in the */etc/rpc* file for RPC-style
    services. In both cases, the service name is the first field in those files.


    **Socket Type** The *socket type* field has a value of *stream*, *dgram*, *raw*,
    *rdm*, or *seqpacket*. In a typical Internet Linux server, you should only see
    *stream* (for TCP sockets) and *dgram* (for UDP sockets).


    **Protocol** The *protocol* field denotes the type of transport layer protocol
    that the daemon uses. It is one of the choices in the */etc/protocols* file (e.g.,
    *tcp*, *udp*).


    **Wait/[No][wait|*max*]** This field applies to *dgram* services only and refers
    to the daemon''s ability to process incoming requests with multiple threads (*nowait*)
    or a single thread (*wait*). The optional |*max*] field is an integer that denotes
    the maximum number of server instances to spawn in a 60-second interval. You should
    have no reason to change this from the default of 40. Increasing this value does
    not enhance the performance of most services and could open the door to a denial-of-service
    (DoS) attack.


    **User[*Group*]** The *inetd* daemon can spawn a service with ownership other
    than the root user. You can specify both the *user* and the optional *group* as
    the service to be run. I recommend that you never run a service as *root* unless
    strictly necessary (use the *nobody* username when possible). If running as *root*,
    make sure to configure *swatch* or *logcheck* (see Chapter 3, "System Monitoring
    and Auditing," for more information on those utilities) to monitor its messages
    as closely as possible.


    **Server Program** The *server program* field specifies the actual executable
    that is spawned when a request is received. Make sure that you specify the entire
    path to avoid attacks that may change the default *$PATH* variable in the system.
    Also, apply good integrity-assurance techniques (see the discussion of the *tripwire*
    utility in Chapter 3) to this executable, in order to avoid Trojan horse attacks.
    Note that the keyword *internal* can be used if the *inetd* daemon handles this
    request by itself (e.g., *echo*, *time*, *chargen*, and *discard*).


    > **TIP** In a security-minded Linux server, the server program should always
    be *tcpsd*. (See the section "TCP Wrappers" later in this chapter.)


    **Server Program Arguments** The *server program arguments* field is the place
    to specify arguments that you would like to pass to the server program. Note that
    you must start with the program name itself (arg[0] in Linux programming terms).'
  merge: -1
  img_proc: true
- pgno: 117
  md: "# ## inetd Configuration Examples\n\nBy default, Linux distributions are shipped\
    \ with a generous set of daemons in the `inetd.conf` file. Consider, for instance,\
    \ the standard `/etc/inetd.conf` file that is shipped with the SuSE 7.0 distribution,\
    \ as shown in Listing 4.2. (The comment lines in this `etc/inetd.conf` file have\
    \ been removed for simplicity.)\n\n# **Listing 4.2** A typical default `/etc/inetd.conf`\
    \ file\n\n```\n```\n[ramon]$ grep -v \"^#\" /etc/inetd.conf\n\n\ntime\tstream\t\
    tcp\tnowait\troot\tinternal\n\ntime\tdgram\tudp\twait\troot\tinternal\n\tftp\t\
    stream\ttcp\tnowait\troot\t/usr/sbin/tcpd\tin.ftpd\n\ttelnet\tstream\ttcp\tnowait\t\
    root\t/usr/sbin/tcpd\tin.telnetd\n\tshel1\tstream\ttcp\tnowait\troot\t/usr/sbin/tcpd\t\
    in.rshd -L\n\tlogin\tstream\ttcp\tnowait\troot\t/usr/sbin/tcpd\tin.rlogind\n\t\
    talc\tdgram\tudp\twait\troot\t/usr/sbin/tcpd\tin.talkd\n\tntalc\tdgram\tudp\t\
    wait\troot\t/usr/sbin/tcpd\tin.talkd\n\tpop3\tstream\ttcp\tnowait\troot\t/usr/sbin/tcpd\t\
    /usr/sbin/popper -s\n\tfinger\tstream\ttcp\tnowait\tnobody\t/usr/sbin/tcpd\tin.fingerd\
    \ -w\n\thttp-rman\tstream\ttcp\tnowait:10000\tnobody\t/usr/sbin/tcpd®\n\t/usr/sbin/http-rman\n\
    \tswat\tstream\ttcp\tnowait:4000\troot\t/usr/sbin/swat swat\n```\n```\n\nThe system\
    \ administrator has some work to do on this file. First of all, very few Linux\
    \ servers need to provide time services, and the `talc`/`ntalc` services are of\
    \ questionable use for most of today's server installations. The same applies\
    \ to the `finger` service. The `POP3` daemon should only be present if your server\
    \ is meant to house user mailboxes, and I recommend that such a server be dedicated\
    \ exclusively to that purpose.\n\nBoth the `shel1` and `login` services are RPC-based\
    \ daemons, and, along with the `telnet` and `ftp` services, they should be replaced\
    \ with a secure equivalent, like Secure Shell (`ssh`). The `ssh` application is\
    \ discussed in detail in Chapter 12, “Virtual Private Networking.”\n\n`http-rman`\
    \ is a tool that converts Linux man-format manual pages to HTML on the fly for\
    \ real-time peusal via a Web server. Finally, the `swat` service is the Samba\
    \ Web Administration Tool (SWAT). If you have a legitimate need for either of\
    \ these services, be sure that TCP Wrappers is properly configured to restrict\
    \ their access to only authorized clients. Make sure you see the following response\
    \ from this `grep` command:\n\n```\n```\n[ramon]$ grep -rman /etc/hosts.allow\n\
    http-rman : ALL EXCEPT LOCAL\n```\n```\n\nThe syntax of the `/etc/hosts.allow`\
    \ [`deny`] file is described in the “TCP Wrappers” section later in this chapter.\n\
    \n![](img/3258bbaf790525f8c4eb25fabff7844a_117_0.png)"
