- pgno: 129
  md: '# ## Additional Network Security Considerations


    While most daemons are started from inetd and /etc/rc.d, there are also a number
    of places within your server that you should be watching. These include mostly
    configuration files for network services, which should be audited in the event
    that a service is unintentionally started. For example, special attention should
    be paid to rhosts authentication, the portmapper daemon, and services started
    as chroot. The next three sections of this chapter describe each of these topics
    in detail.


    # ### Disabling rhosts authentication


    Although most current Linux distributions no longer come configured for this type
    of authentication, a few older systems may still be vulnerable. First and foremost,
    make sure that your inetd.conf file does not include support for the rlogin daemon.
    The command


    ```

    ```

    [ramon]$ grep rlogin /etc/inetd.conf

    ```

    ```


    should not return anything. If you do have rlogin enabled, simply delete (or comment
    out) the offending line and restart the inetd daemon. The r series of remote access
    commands (rsh, rlogin, rcp) are riddled with security holes and should not be
    used.


    In addition, look for the /etc/hosts.equiv file, or an .rhosts file in any home
    directory. If there is one, remove or rename it immediately. If this file contains
    a host name definition (or IP address), users on that host will be able to rlogin
    to your server without being prompted for a password if you accidentally leave
    rlogin running. This is the ultimate vulnerability, and it’s the main reason why
    the r commands should never be used.


    Use the following command as the root user to periodically weed out all .rhosts
    files from users’ home directories:


    ```

    ```

    [ramon]$ sudo find /home -name ".rhosts" -exec rm {} \;

    ```

    ```


    # ### The portmap Daemon and RPC Services


    The portmapper (portmap) is the network service that enables remote procedure
    call (RPC) facilities such as Network File Systems (NFS) for file sharing and
    Network Information Services (NIS or “yellow pages”) for name resolution. Started
    from /etc/rc.d, the portmap daemon listens to local RPC servers, which register
    their port numbers with the portmap services. (Unlike regular inetd-driven services,
    RPC programs don’t bind to a fixed TCP/UDP port.) Remote clients that wish to
    use an RPC service contact the portmap first, which then returns the port number
    where the RPC daemon can be reached.


    RPC-based services can be extremely vulnerable to malicious attacks, especially
    when the intruder registers a bogus RPC service remotely and asks portmap to listen
    for requests to'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'this service. In addition, it is very difficult to enforce access control on
    RPC-based services, especially since their associated ports change each time the
    system is rebooted. This makes the portmap daemon a security liability.


    If you are using a Linux distribution that’s over two years old, I recommend that
    you disable it as soon as you build your system and leave it disabled until you
    come up with an alternative.


    > **TIP** If your Linux distribution is more than three years old, I also recommend
    that you upgrade your Linux system altogether. Just make sure that you test the
    upgrade on a practice server and not on a development server; otherwise you could
    run into a lot of trouble.


    In most Linux distributions, portmap is started or stopped from one or more of
    the following files:


    +   * /etc/rc.d/rc2.d/S11portmap

    +   * /etc/rc.d/rc3.d/S11portmap

    +   * /etc/rc.d/rc4.d/S11portmap

    +   * /etc/rc.d/rc5.d/S11portmap


    Since 1996, Linux distributions have included a secure version of the portmap
    service that can enforce access-control rules on the same files as TCP Wrappers
    (`/etc/hosts.allow` and `/etc/hosts.deny`). To find out if you’re running this
    version of portmap, insert the following line into the /etc/hosts.deny file:


    ```

    portmap: ALL

    ```


    In addition, insert the following line into the /etc/hosts.allow file:


    ```

    portmap: <a trusted hostname>

    ```


    Then, proceed to mount an NFS share from the trusted host and from a different
    host. If you can mount the share from the trusted host but not from the different
    host, you’re running a version of portmap that enforces access control. You can
    go ahead and enable it by putting the startup script back in /etc/rc.d/rc*.d/S11portmap.


    Note, however, that securing the portmap service is only one step toward enhancing
    the security of your system. If you must use RPC services, make sure that each
    of them (NLS, NFS, etc.) is secure and up to date, because an intruder can always
    simply brute-force guess which port the service is running on.


    # ## Running Network Services as chroot


    Linux allows you to run a command with a modified root directory such that directory
    references are relative to the path specified in the chroot command. This allows
    you,'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'for example, to run several instances of an HTTP server, each with its own
    set of configurations and executables. The idea is an attractive one: allow the
    process to believe that it has free reign of the server while confining it to
    a small “sandbox.” However, the chroot protection can be easily circumvented,
    especially when the application runs with root privileges.


    Limit chroot execution of network services to instances when the daemon runs under
    a nonprivileged user, and ideally, to when the daemon operates in read-only mode.
    chroot is especially useful for non-interactive Web servers whose content stays
    static over time.


    # TCP Wrappers


    Developed by Wietse Venema during his tenure at The Netherlands’ Eindhoven University,
    the TCP Wrappers package has quickly become a standard tool included in all of
    today’s Linux distributions. Furthermore, this is arguably the most useful network
    security tool to come along since the dawn of the operating system.


    By interposing itself between the inetd daemon and the server application itself,
    TCP Wrappers adds a layer of access control to an otherwise wide-open inetd facility.
    The real beauty of this tool, and the main reason for its popularity, is its simple
    design. There is no need to recompile (or even modify) either the inetd daemon
    or the server applications themselves. Instead, you simply modify your /etc/inetd.conf
    file to include the TCP Wrappers application instead of the real server name.
    The TCP Wrappers application receives and examines every connection request and
    decides to grant it or deny it based on a set of criteria specified by the network
    administrator.


    The next two sections describe the TCP Wrappers installation and configuration.


    # Installing TCP Wrappers


    The success of TCP Wrappers has resulted in its widespread use on the majority
    of production Linux servers today. In fact, most distributions even come outfitted
    with a default configuration for TCP Wrappers. If you need to install TCP Wrappers
    on an older Linux installation, or you would like to upgrade your existing installation,
    simply find the .rpm distribution of the tool in your favorite archive. Listing
    4.7 shows you how to install TCP Wrappers using the RPM facility.


    +   **Listing 4.7** Installing TCP Wrappers via RPM (Upgrade option)


    ```

    [ramon]$ rpm -q tcp_wrappers

    tcp_wrappers-7.6-7

    [ramon]$ sudo rpm -U tcp_wrappers-7.6.10.i386.rpm

    ```'
  merge: -1
  img_proc: true
