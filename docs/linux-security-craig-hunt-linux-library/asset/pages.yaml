- pgno: 361
  md: '**Topology-Independent Connection Costs** Corporate WANs come in three flavors:


    +   * *hub-and-spoke*, where all branches connect only to a central office

    +   * *fully meshed*, where all branches are fully interconnected to one another.

    +   * *partially meshed*, where branches are connected to one another according
    to business needs.


    The fully meshed topology realizes the highest savings when deployed using VPN
    technology. Since each new branch is simply being connected to the Internet, the
    cost to incorporate the second branch is the same as connecting the 20th branch
    or the 200th branch.


    **Reuse of Existing Internet Connections** Connections to the Internet are now
    as necessary to conduct business as fax machines and package delivery. VPN technology
    allows your enterprise to use a single circuit for both private corporate communications
    and general Internet access, provided that you have configured the separation
    of both traffic types properly (more on that later in this chapter).


    > **WARNING** Regardless of whether you''ll be using your ISP circuit for VPN-only
    connectivity, or for VPN+Internet connectivity, you should protect your network
    perimeter by installing a firewall device. Chapters 9, 10, and 11 show you how
    to design, deploy and maintain a firewall at the network, transport, and application
    layers respectively.


    At the heart of VPN technology is the ability to encapsulate VPN traffic inside
    normal IP traffic in order to protect the private data as it travels through the
    public Internet. Two separate security protocols have emerged as alternatives
    for the encapsulation and protection of VPN data:

    * The IETF''s *IP Security (IPsec)*

    * Microsoft Corporation''s *Point-to-Point Tunneling Protocol (PPTP)*


    The following two sections are devoted to the discussion of these two specifications.


    # ## The IP Security Protocol (IPsec)


    Defined in detail in RFCs 2401 through 2412, the IP Security framework (IPsec
    for short) is the IETF''s response to an Internet community that has been shouting
    for such a standard for quite a long time. While only mandatory in IPv6 implementations,
    IPsec has seen its way to a good number of IPv4 stacks, and most network security
    software vendors have embraced the IPsec technology to some extent. Rather than
    mandating a specific type of encryption or hashing technology, IPsec is a framework
    used by both ends of the'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'connection to select security parameters for that session. This makes the IPsec
    standard more durable because it can accommodate new algorithms for data privacy,
    integrity, and authentication as the existing ones become obsolete or are found
    to be vulnerable.


    Before IPsec-formatted packets can be exchanged, both peers must agree on a security
    association (SA) that contains a set of parameters that include


    +   - cryptographic algorithms

    +   - key expiration time

    +   - encapsulation type

    +   - compression


    While this negotiation can take place manually, yielding static SAs, a more secure
    and practical way to establish these parameters is to use the Internet Key Exchange
    (IKE) protocol. When two IPsec peers support IKE, they can negotiate the SAs on
    the fly just before the secure communication takes place, provided that they have
    a way to authenticate each other. This authentication is accomplished using either
    shared secrets (preloaded at each end), or using a public-key infrastructure that
    includes digital certificates. The actual agreement on session keys (which are
    ephemeral) is based on the famous Diffie-Hellman algorithm.


    The session-key agreement process starts when both endpoints on the connection
    generate a private/public key pair and share their public keys with each other.
    Next, both endpoints perform a mathematical calculation using their own secret
    key and the remote public key as input. This is a critical part of the Diffie-Hellman
    algorithm because this calculation should yield the same result at both ends.
    While this shared value could be used to encrypt actual transmission data, it
    is more efficient for one of the endpoints to make up a symmetric key, encrypt
    it with the shared value from the previous calculation, and send it to the other
    endpoint, which decrypts it and stores it. This symmetric key can then be used
    as the session key for the symmetric algorithm negotiated during the SA agreement
    phase. Some examples of symmetric encryption algorithms are DES, Triple DES, IDEA,
    and Blowfish.


    Once the SAs are in place and both endpoints have agreed to a session key, the
    actual secure data exchange can take place. The heart of IPsec is its ability
    to take a private IP packet and either encapsulate it completely into another
    IP packet or append to its header enough information to ensure its integrity.
    Let’s take a closer look at both of these options.


    # ## IP Authentication Header


    As your traffic travels though the Internet, it is subject to a number of vulnerabilities,
    including one where an attacker modifies the content of your IP packets. This
    is easy to'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'do in the current Internet model, a store-and-forward architecture where your
    packet is guaranteed to traverse a number of intermediary systems over which you
    have no control. One way to ensure that the content of your IP packets is not
    altered along the way is to affix a header with a one-way hash value of the state
    of the original packet. This header is called an authentication header (AH). If
    an attacker modifies the packet, the receiver is aware that this has happened
    because the hash value included in the header does not match the end state of
    the packet.


    The IETF has created a formal protocol for this AH, which is inserted by the IPsec-aware
    sender between the IP and TCP headers before the packet is sent out (see Figure
    12.3). This field contains a number of indexes and parameters for processing by
    the remote end, but at the heart of the AH is a hash value that is computed using
    the entire IP packet as its input. Although IPsec in general is built to accommodate
    new hashing algorithms, the RFC2402 specification mandates the support of MD5
    and SHA-1 algorithms for the implementation to be standards compliant.


    # Figure 12.3 IPsec AH packet format


    ![](img/3258bbaf790525f8c4eb25fabff7844a_363_0.png)


    # IP Encapsulating Security Payload (ESP)


    While the AH solves the problem of IP packet integrity and authentication, it
    does not address the issue of confidentiality. In many cases, you need to make
    sure that nobody is gaining unauthorized access to the payload of your IP packets
    as they travel over an untrusted network. The IP Encapsulated Security Payload
    (ESP) specification allows for a security gateway to completely encapsulate a
    private outgoing packet before it travels via the public Internet. This can be
    done in one of two ways: ESP transport mode and ESP tunnel mode.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# ## ESP Transport Mode


    You can use ESP transport mode to protect the payload of IP packets exchanged
    between two security gateways that are implementing IPsec security. When ESP transport
    mode is used, the security gateway inserts an ESP header between the original
    IP and TCP headers (see Figure 12.4). This header contains a pointer to the security
    association (SA) that was negotiated between the two security gateways, as well
    as to the pointers to the next ESP packet that the endpoint should expect.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_364_0.png)


    After the TCP header and TCP payload, the security gateway inserts an ESP trailer
    that contains a variable number of padding characters to make sure the packet
    to be protected is of a fixed length.


    Finally, the security gateway appends an ESP authentication value consisting of
    a hash value calculated using the entire ESP packet (minus the authentication
    value) as the input. This works similarly to the AH protocol and ensures the integrity
    of the packet.


    Note that ESP encrypts the contents of the original TCP header and payload and
    ensures the authentication of the entire ESP packet.


    # ## ESP Tunnel Mode


    Note that ESP transport mode protects the TCP header and TCP payload of the original
    packet, but it does not protect the original IP header. If you need to ensure
    the confidentiality, integrity, and authentication of the entire original IP packet,
    you should opt for ESP tunnel mode. ESP tunnel mode effectively encapsulates the
    entire IP packet and inserts it into a brand new packet whose source IP address
    is typically the externally reachable address of the security gateway that is
    doing the IPsec encapsulation.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'The ESP tunnel mode packet format, illustrated in Figure 12.5, is similar to
    the format used for ESP transport mode, except for the fact that the original
    IP header is also authenticated and encrypted.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_365_0.png)


    Another advantage of ESP tunnel mode is that packets originating from an IPsec-protected
    network need not use legal Internet addresses because those addresses will be
    effectively “hidden” while the packet is in transit over the Internet.


    While the ESP specification (defined in RFC2406) allows for new encryption algorithms
    to be used, it also mandates that IPsec-conformant implementations include support
    for the DES encryption algorithm, as well as for the MD5 and SHA-1 authentication
    algorithms mentioned earlier in this chapter in the section “IP Authentication
    Headers.” Since the strength of the DES algorithm has been brought into question
    recently, most IPsec software vendors typically support stronger encryption algorithms
    such as 3DES, IDEA, and Blowfish.


    As is usually the case, the Linux open-source community has stepped up to develop
    a robust implementation of the IPsec standard. The FreeS/WAN Linux IPsec package
    is the topic of discussion in the next section of this chapter.


    # FreeS/WAN


    Project leader John Gilmore started the FreeS/WAN development in 1996 as an attempt
    to “secure 5% of the Internet traffic against passive wiretapping.” The Free Secure
    Wide Area Network (FreeS/WAN) thus aims to make every Linux server a VPN-capable
    host using the standard IETF IPsec protocol to ensure the confidentiality, integrity,
    and authentication of IP communications. Due to the once rigid U.S. restrictions
    governing'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'the export of cryptographic material, most of the original FreeS/WAN development
    has taken place outside of the U.S. In fact, just to be on the safe side, the
    FreeS/WAN developers have also avoided any assistance from any U.S. citizens or
    residents.


    # ### Obtaining FreeS/WAN


    The FreeS/WAN software is available in source code format under the GPL licensing
    agreement. While a limited number of Linux distributions (SuSE, Connectiva, and
    Polished, for example) offer the FreeS/WAN package as part of the standard installation,
    most distributions do not, especially the ones based in the U.S. There is quite
    a bit to learn in the process of installing FreeS/WAN so I recommend that you
    download the source distribution from the official site and build it yourself.
    FreeS/WAN is available from http://www.freeswan.org (see Figure 12.6).


    ![](img/3258bbaf790525f8c4eb25fabff7844a_366_0.png)


    You can either download the distribution following the links on the FreeS/WAN
    Web site or obtain it right from the FTP site using the following commands:


    ```

