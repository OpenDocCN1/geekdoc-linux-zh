- pgno: 294
  md: '# 10

    # Transport Layer Firewalls


    **W**hile filtering at the network layer is fairly straightforward and easy to
    implement, there are cases where a finer grain of authentication and authorization
    is required. For example, you may want to allow all users SMTP access to the Internet,
    while allowing only your Marketing group to access Web hosts. In such instances,
    network access may be awarded or denied based on the identity of the user that
    requests it. Transport layer firewalls make it possible to control Internet access
    by *proxying* outgoing connections on behalf of the internal user.


    Transport layer firewalls offer two distinct advantages over packet filters: They
    control access to public network resources at a user level while reducing your
    enterprise’s Internet exposure to the single public IP address of the proxy server.
    By having a single point of entry in and out of your network, you can centrally
    log all your users’ activity for each specific service (Web, Mail, FTP, etc.).
    On the other hand, proxy firewalls typically require you to use custom network
    client software on users’ workstations that has been modified to be “proxy-aware.”
    In addition, proxy firewalls are usually more difficult to set up and maintain
    than a simple packet-filter firewall, since you need to keep track of both users
    and services.


    If your security policy defines different groups of users with different privileges,
    or you are responsible for providing details of network usage on a per-application
    basis, I strongly recommend that you consider deploying a proxy firewall. Packet
    filtering is simply not going'
  merge: -1
  img_proc: true
