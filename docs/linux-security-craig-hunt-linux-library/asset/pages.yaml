    # Configuring the Nessus Server


    Since a single Nessus server can be accessed from multiple clients, the server
    keeps its own database of users and performs its own authentication and authorization.
    So, the first step in configuring Nessus is to create a user account for the client.
    The utility /usr/sbin/nessus-adduser allows you to do just that, as shown in Listing
    5.3.


    # Listing 5.3  Creating a user account on the Nessus server


    ```

    [ramon]$ sudo /usr/sbin/nessus-adduser

