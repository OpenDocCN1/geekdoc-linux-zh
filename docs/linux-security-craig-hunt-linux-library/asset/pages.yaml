    # Secure Shell (SSH)


    Originally developed by Tatu Ylönen at Helsinki University of Technology, the
    secure shell (SSH) package and protocol specification provides a secure alternative
    to more traditional remote session and file transfer protocols like `telnet` and
    `rlogin`. The SSH protocol supports authentication of the remote host, thereby
    minimizing the threat of client impersonation via IP address spoofing or DNS manipulation.
    In addition, SSH supports several secret-key encryption protocols (DES, 3DES,
    IDEA, and Blowfish) to help ensure the privacy of the entire communication, starting
    with the initial username/password exchange.


    SSH provides a virtual private connection at the application layer, including
    both an interactive login protocol (`ssh` and `sshd`) as well as a facility for
    the secure transfer of files (`scp`). I strongly recommend that you disable `telnet`
    and `rlogin` in favor of SSH. See Figure 12.13 for a requiem for `telnet`, `rlogin`,
    and `rsh`. (`rsh` is the insecure equivalent of SSH.)


    **Figure 12.13** Requiem for telnet, rlogin, and rsh


    ![](img/3258bbaf790525f8c4eb25fabff7844a_384_0.png)'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'The Linux version of SSH is freely available and it includes both client and
    server software. There are also several excellent PC-based client implementations
    of SSH that are available free of charge.


    # **How SSH Works**


    Consider an example where a client is attempting to access a Linux server via
    SSH. Both the SSH daemon running on the Linux server and the SSH client have a
    pre-computed public/private key pair that makes up their SSH "identity." Here
    are the basic connection steps:


    +   1. The client binds to a high local port and connects to port 22 on the server.


    +   2. The client and server agree on the SSH version to use. This is necessary
    because v.1 and v.2 are not compatible.


    +   3. The client requests the server''s public key and host key.


    +   4. The client and server agree on the encryption algorithm to use such as
    3DES or IDEA.


    +   5. The client generates a session key and encrypts it using the server''s
    public key.


    +   6. The server decrypts the session key, re-encrypts it with client''s public
    key, and sends it back to client for verification.


    +   7. The user authenticates to the server inside a data stream encrypted with
    the session key.


    At this point, the connection has been established, and the client may proceed
    to interactively work on the server or to transfer files to or from it. Note that
    step 7 (client authentication) can be done in a number of ways (username/password,
    Kerberos, RSA, etc.). Chapter 13, "Strong User Authentication," discusses the
    topic of strong authentication in more depth.


    There is a plethora of SSH implementations out there, but a GPL-protected open-source
    variant stands out among them: OpenSSH.


    # **OpenSSH**


    While the original implementation of SSH was freely available, starting with v.1.2.12,
    the licensing was made increasingly more restrictive until it eventually became
    a commercial product currently available from Data Fellows, Inc. The open-source
    community realized that the SSH concept was too valuable in the public domain
    and embarked on an organized effort to rewrite SSH into a free derivative. Starting
    in 1999, Björn Grönvall, and later the OpenBSD development team, took the original
    v.1.2.12 implementation and evolved it into what would be called *OpenSSH*. More
    than two years later, OpenSSH is now in version 2 and boasts support for an impressive
    array of platforms, including'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'Linux. OpenSSH version 2 no longer makes use of the once-patented RSA public-key
    algorithm for authentication and fixes a cyclic redundancy check (CRC) problem
    that compromised the integrity checks in version 1 of the standard.


    > **WARNING**  There have been several vulnerabilities found in many of the older
    SSH v.1 implementations. I suggest that you only use SSH v.2 software.


    Let’s take a look at how to install and configure OpenSSH on your Linux server
    and on other Linux clients.


    # Obtaining OpenSSH


    The OpenSSH RPM package should be readily available from your favorite Web repository,
    such as www.rpmfind.net. Look for the following three packages:


    +   - `openssh-2.5.2p2-1.7.2-i386.rpm` contains

    +       - The man pages

    +       - The configuration files

    +       - The critical generation utilities

    +   - `openssh-server-2.5.2p2-1.7.2-i386.rpm` contains

    +       - The sshd daemon

    +       - The startup files

    +       - The sftp server

    +   - `openssh-clients-2.5.2p2-1.7.2-i386.rpm` contains

    +       - The ssh client

    +       - The sftp client


    Once you''ve obtained these three packages, go ahead and install them (or upgrade
    them, depending on your situation) with the following commands:


    ```

    [ramon]$ sudo rpm -i openssh-2.5.2p2-1.7.2-i386.rpm

    [ramon]$ sudo rpm -i openssh-server-2.5.2p2-1.7.2-i386.rpm

    [ramon]$ sudo rpm -i openssh-clients-2.5.2p2-1.7.2-i386.rpm

    ```


    # Configuring OpenSSH


    The main OpenSSH daemon configuration file is located in `/etc/ssh/sshd_config`.
    Entries in this file are of the form:

    *variable*   *value*'
