    Having taken these precautions, you still need to be vigilant of the setuid/setgid
    present on your Linux server. I suggest that you run this command in cron, piping
    its output to an e-mail report to your mailbox every morning, as follows:


    ```

    find / -type f \( -perm -04000 -o -perm -02000 \) -exec ls -l { } \;

    ```


    This command should report on all the scripts that have either the setuid or the
    setgid bit set in the permissions mask. Compare the current report with the previous
    day’s report, and ensure that any new files have been created by the administration
    staff. At the very least, you should have the output of this command written to
    a separate file within /var/log.


    > **NOTE** The Linux kernel allows you to use setuid/setgid permissions only on
    binary executables, not on shell scripts. This restriction protects against malicious
    tampering with shell scripts, a common occurrence that can result in a serious
    compromise of root.


    # The umask setting


    The default permissions for new files created on your server can have a profound
    impact on its overall security. Users who create world-writable files by default
    are effectively'
