    \ Inode creation/modification timestamp |\n| c | Cyclic redundancy check |\n\n\
    The Tripwire Binaries rule instructs *tripwire* to watch the binaries themselves\
    \ and tag any violation with the highest severity value:\n\n```\n```\n# Tripwire\
    \ Binaries\n\n(rulename = \"Tripwire Binaries\", severity = $(SIG_HI))\n{\n  $(TWBIN)/sigs\
    \    -> $(ReadOnly);\n  $(TWBIN)/tripwire    -> $(ReadOnly);\n  $(TWBIN)/twadmin\
    \    -> $(ReadOnly);\n  $(TWBIN)/twprint    -> $(ReadOnly);\n}\n```\n```\n\nThe\
    \ Tripwire Data Files rule also instructs *tripwire* to watch the policy configuration\
