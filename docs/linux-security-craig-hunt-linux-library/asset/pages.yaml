- pgno: 114
  md: "# # Securing Network Services\n\nOnce you feel comfortable with your system\
    \ setup, it's time to take the next step: configuring the network interface(s)\
    \ of the server and connecting them to your network. Whether this is an intranet\
    \ server targeted for internal users or an Internet bastion host for public (and\
    \ anonymous) use, there are some important issues for you to consider:\n\n+  \
    \ * Which network services are strictly necessary?\n+   * Should other services\
    \ be present, but inactive?\n+   * Should I allow any client to connect to the\
    \ server?\n+   * Should certain clients be allowed to connect to all services?\n\
    +   * Do I need to maintain a log of service activity?\n\nAs always, it's imperative\
    \ to run the minimum number of services and to ensure that the services that you\
    \ need to offer don't introduce any of the vulnerabilities described in Chapter\
    \ 1, “Understanding Linux Security.” The bad news is there are literally hundreds\
    \ of network services available (although they are not always enabled) on a typical\
    \ Linux distribution. What is the good news, you ask? Well, there are only two\
    \ places to look for these services: the inetd daemon and the /etc/rc.d directories.\n\
    \nThe next section offers a detailed look at the inetd daemon and explains the\
    \ syntax of its configuration file, /etc/inetd.conf.\n\n# ## Spawning Internet\
    \ Daemons with inetd\n\nAll Linux distributions (and all Berkeley-style Unix variants\
    \ for that matter) include a central network service utility controlled by the\
    \ inetd process. This “super-server” acts as the clearinghouse, or central point\
    \ of administration, for all Internet services running on the server. You can\
    \ verify that the master inetd process is running on your system by entering the\
    \ following command:\n\n```\n[ramon]$ ps aux | grep inetd\n       root     421\
    \   0.0   0.0  1232   60 ?   S    Sep24   0:00 inetd\n```\n\nThe inetd daemon\
    \ is started by Linux at system startup, and it immediately listens for the network\
    \ ports listed in the /etc/inetd.conf file, the main configuration file for the\
    \ inetd daemon (more on that in the next section). If an incoming request matches\
    \ a network port number specified in its configuration, inetd assigns the appropriate\
    \ listener application to the incoming socket and continues to listen for future\
    \ connections. This is done in order to optimize system resources, because having\
    \ a single process listen for several ports represents a lighter load on the system\
    \ than having each process listen on its own port."
  merge: -1
  img_proc: true
