    Table 9.2 lists the set of available constructors for the iptchains rules.


    # Table 9.2 iptchains Rule Specification Parameters


    | Parameter | Meaning |

    |---|---|

    | -p [! ] protocol | Protocol ID to match. This can be tcp, udp, icmp, or any
    numeric or alphabetic representation of a service in /etc/services. |

    | -s [! ]address [ /mask ] | Source address to match. This can be a host name,
    an IP address, or a network name in network/mask format. |

    | --sport [ port : [ port ] ] | Specification of source port or source port range.
    |

    | -d [! ]address [ /mask ] | Destination address to match. Same rules as the -s
    parameter apply here. |

    | --dport [ port : [ port ] ] | Specification of destination port or destination
    port range. |

    | -j target | Action to take when the rule finds a match (e.g., accept, drop).
    Note that in addition to being the name of an action, target can also be a user-specified
    chain or a built-in chain. |

    | -i [! ]interface | Interface through which the packet was received, such as
    eth0. |

    | -o [! ]interface | Interface through which the packet is to be sent, such as
    eth0. |

    | [! ] -f | Packet is a second or subsequent fragment of a larger fragmented packet.
    |

    | -y | Only match TCP packets with the SYN bit set. |'
