    # Using tcpdmatch


    The /usr/sbin/tcpdmatch script predicts whether a request from a specific client
    to a given service would be granted or denied. The command syntax of the tcpdmatch
    script is


    ```

    tcpdmatch service client

    ```


    where service is the server name, and client is an IP address or a host name corresponding
    to the host requesting the service. For example, consider the three invocations
    of the tcpdmatch script shown in Listing 4.9.


    # Listing 4.9 Running the tcpdmatch utility


    ```

    [ramon]$ tcpdmatch in.ftpd local.example.com

    client: hostname local.example.com

    client: address 10.0.0.2

    server: process in.ftpd

    matched: /etc/hosts.allow line 1

    access: granted


    [ramon]$ tcpdmatch in.ftpd 143.45.22.3

    client: address 143.45.22.3

    server: process in.ftpd

    matched: /etc/hosts.deny line 1

    access: denied

    ```'
