    and to exit through the DMZ interface, eth2.


    # Protecting Against Well-Known Attacks


    Aside from the capability to enforce access control to your internal hosts, Netfilter
    and `iptables` can be used to protect against specific types of Internet attacks
    by filtering traffic that matches the fingerprint of the attack. This section
    describes sample `iptables` statements that you can use to address a number of
    these well-known vulnerabilities.


    # Address Spoofing


    Many firewall configurations allow the packet to be forwarded after verifying
    that it has an address from the private network in the source field of the header.
    The problem is that it’s trivial for an attacker to synthetically create a “spoofed”
    packet generated from their network but with your source address. Protect your
    site from address spoofing by requiring that packets with the local network’s
    source address be received on the interface connected to the local network using
    an `iptables` command like the following:


    ```

    `iptables -A FORWARD -s internal_network -i public_interface -j DROP`

    ```


    This command is adding a rule to the forward chain that matches traffic sourced
    from the internal network, but that enters the system at the public interface.
    By adding this command, you are forcing Netfilter to drop spoofed packets arriving
    at the public interface of your firewall.


    For example, consider the dual-homed firewall architecture depicted back in Figure
    9.4, where the local network is 208.209.210.0/24 and the router’s public interface
    is 157.35.66.65. An address-spoofing rule for this firewall would look like the
    following:


    ```

    `iptables -A FORWARD -s 208.209.210.0/24 -i eth0 -j DROP`

    ```


    This rule examines packets that arrive in the public interface (eth0) and drops
    them quietly if they carry a source address in the (private) 208.209.210.0/24
    network.


    # Smurf Attack


    A *smurf* attack is staged by sending an ICMP echo request (ping) packet to the
    broadcast address of your internal network. The packet’s source is forged with
    the address of the target of the smurf attack, which gets flooded by ICMP echo
    responses from all your internal hosts.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'The following `iptables` command should guard against smurf attacks by preventing
    the forged ICMP echo-request from entering your network:


    ```

    iptables -A FORWARD -p icmp -d internal_network_broadcast_address -j \u2203 DENY

    ```


    This command adds a rule to the forward chain that matches any ICMP packets coming
    into any of the interfaces of the firewall whose destination is the broadcast
    address of your internal LAN. When this rule is matched, the packet takes the
    DROP action. For example, in the network depicted back in Figure 9.4, you would
    use the following command:


    ```

    iptables -A FORWARD -i icmp -i 208.209.210.255 -j DENY

    ```


    In this case, you''re looking for ICMP traffic whose destination is 208.209.210.255,
    the broadcast address of the 208.209.210.0/24 network.


    # Syn-Flood Attack


    A *syn-flood* attack is staged by sending a large number of TCP connection requests
    (with the SYN flag set) to a host while suppressing the normal SYN-ACK responses,
    thereby attempting to consume all its available data structures, which are busy
    keeping track of these half-open connections.


    Using the `limit` external matching module, you can throttle the acceptance of
    TCP SYN requests to one per second using the following `iptables` command:


    ```

    iptables -A FORWARD -p tcp --syn -m limit --limit 1/s -j ACCEPT

    ```


    A rate of one TCP SYN request per second should be acceptable for most Internet
    servers, but it restricts just enough occurrences of incoming SYN requests to
    ensure that your systems always have enough available resources to handle legitimate
    connections.


    # Port-Scanner Attack


    Many port-scanner applications try to identify every open TCP and UDP port in
    your system by sending a SYN or FIN signal to a given port range and expecting
    a RST signal for those ports not active. You can limit this activity to one incidence
    per second with the following `iptables` command:


    ```

    iptables -A FORWARD -p tcp --tcp-flags SYN,ACK,FIN,RST RST -m limit -\u2203 -limit
    1/s -j ACCEPT

    ```


    This command adds a rule to the forward chain that matches TCP traffic that arrives
    at the firewall with the SYN, ACK, and FIN flags unset, and the RST flag set.
    When a packet matches this description, it is only accepted at a rate of one per
    second.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# **Ping-of-Death Attack**


    It is possible to kill certain operating systems by sending unusually large and
    unusually frequent ICMP echo (*ping*) requests. This is called a *ping-of-death*
    attack. The following `iptables` command limits the acceptance of such pings to
    one per second:


    ```

    iptables -A FORWARD -p icmp --icmp-type echo-request -m limit --limit 1/s -j ACCEPT

    ```


    In fact, I recommend that you block ICMP requests at your firewall altogether
    using the command


    ```

    iptables -A FORWARD -p icmp --icmp-type echo-request -j DROP

    ```


    unless you have a legitimate need to have your host be reached via ping from the
    outside.


    # # Network Address Translation


    One of the problems facing the current installed base of Internet-connected hosts
    is the scarcity of network addresses. IP version 4 is limited to 2³² unique addresses.
    While four billion IP addresses may seem like more than enough addresses to go
    around, a good number of those are actually not usable because of subnetting and
    non-contiguous allocation. In addition, many enterprises never felt the need to
    connect their networks to the public Internet, so they used addresses from the
    non-routable blocks (RFC1819), a number of addresses set aside for use in non-Internet-connected
    networks.


    When faced with the task of integrating a privately numbered network with the
    Internet, you have to make an important choice: renumber or translate. On the
    one hand, you can request a routable IP block from your Internet service provider
    and go through the pain of renumbering (and often re-subnetting) your entire network,
    or, if your connectivity needs are modest, you could use network address translation
    (NAT).


    The advantages of NAT are twofold: On one hand, you are free to use whatever numbering
    scheme you choose while still allowing your users to connect to the public Internet.
    On the other hand, if you use non-routable internal addresses, intruders can’t
    access your internal hosts as easily as if they were naturally routable, especially
    when they’re hidden behind NATP, a many-to-one NAT descripted shortly.


    NAT involves modifying the source address of the packet before sending the packet
    to its destination. This requires the NAT device to keep track of this modification
    so that the step can be reversed when a response is received. There are three
    types of network address translation that vary depending on how the NAT device
    keeps track of the translation: NAP, Static NAT, and LSNAT.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Network Address Port Translation (NAPT)  Also known as many-to-one NAT, NAPT
    is best suited for network gateways that can only use a single public address.
    The NAT device accepts outbound connection requests from private clients and keeps
    track of each connection with two pieces of information:


    +   - the private IP address of the internal host

    +   - the source port that the NAT device used as the transport layer port number
    for the request


    This allows the NAT device to route return traffic properly, even when there are
    two internal clients connecting to the same external server. Deploying NPAT hides
    your entire private network behind a single public address, thereby reducing your
    exposure to the Internet and drastically reducing your needs for routable address
    space. The principal disadvantage of NPAT is the fact that you cannot host any
    services on your internal network because the NPAT device is unable to accept
    incoming requests from the Internet. Use Static NAT if hosting services on your
    internal network is a requirement.


    Static NAT  Also known as one-to-one NAT, Static NAT is the simplest case, where
    a single public address is mapped to a single private address. The NAT device
    must be configured to perform this mapping beforehand. Unlike NAPT, for example,
    where you can have a whole network hiding behind a single address, you have to
    know beforehand which addresses you will be protecting because you need to assign
    them a public equivalent.


    Load-Sharing Network Address Translation (LSNAT)  An extension to plain, static
    network address translation, LSNAT allows you to advertise a single address to
    the public Internet while requests made to that address are serviced by a number
    of internal hosts. Consecutive requests are handed to the pool of internal addresses
    in a round-robin fashion, which achieves a load-sharing effect for incoming connections.
    This is useful when deploying a Web server farm in your DMZ, where all servers
    can contain exact replicas of your Web content. As the demand increases, simply
    add additional servers and register the new private address with the binding tables
    in your NAT device. To the outside world it still appears as if there is only
    one Web server.


    # ## Configuring NAT using iptables


    Consider the network architecture depicted in Figure 9.3. If your internal network
    does not contain routable addresses, and you still want to connect to the Internet
    from your private hosts, you need to perform NAT. The most popular approach for
    a small network with a single routable address is NPAT, which is also referred
    to as masquerading or hiding. Simply add the line in Listing 9.5 to your iptables
    configuration.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# **Listing 9.5** Sample *iptables* NPAT configuration


    ```

    iptables -t nat -A POSTROUTING -o ppp0 -j MASQUERADE

    ```


    Notice that the command in Listing 9.5 uses the option -t nat. The majority of
    iptables commands operate on the *filtering* table (which contains the built-in
    chains input, output, and forward). NAT relies on a different Netfilter table,
    appropriately named *nat*, which contains the built-in chains prerouting, postrouting,
    and output. These chains have the following characteristics:


    +   - The *prerouting* chain is the chain that attempts to match the packet as
    soon as it enters the system.

    +   - The *postrouting* chain is the chain that attempts to match the packet once
    the routing decision has been made based on its destination.

    +   - The *output* chain is the chain that matches locally generated traffic before
    a routing decision has been made based on its destination.


    The -o ppp0 option directs iptables to apply the MASQUERADE rule to the packet
    just before it goes out the ppp0 interface so that any other processes on the
    server itself will see the packet with its original source address. This is an
    important point because it implies that packet-filtering rules applied to that
    packet will also see the packet with its original source address. Keep this in
    mind as you write your iptables rules.


    The example in Listing 9.5 performs NPAT on the outgoing packet, using the address
    assigned to ppp0 as the *masquerade-as* address. Table, appropriately named *nat*,
