- pgno: 140
  md: 'tcp    0    0    *:ssh    *:*    LISTEN

    tcp    0    0    *:socks    *:*    LISTEN

    raw    0    0    *:icmp    *:*    7

    raw    0    0    *:tcp    *:*    7


    The netstat --inet -a command in Listing 4.11 shows the connections that are currently
    active (ESTABLISHED) or in the process of being torn down (CLOSE_WAIT), as well
    as those services that are currently awaiting new connections (LISTEN). You need
    to focus on this latter category and look for those services that appear after
    the host name (and the period) under the Local Address column. In fact, I often
    create a script that e-mails me the output of the following netstat command periodically:


    ```

    [ramon]$ netstat --inet -a | grep LISTEN

    tcp    0    0    *:telnet    *:*    LISTEN

    tcp    0    0    *:ftp    *:*    LISTEN

    tcp    0    0    *:www    *:*    LISTEN

    tcp    0    0    *:smtp    *:*    LISTEN

    tcp    0    0    *:ssh    *:*    LISTEN

    tcp    0    0    *:socks    *:*    LISTEN

    ```


    The previous output from the netstat command is the most accurate picture of what
    your Linux server looks like to a potential intruder. There are a total of six
    services active, and there are service names for all of them. (I had to add the
    service name socks to /etc/services by hand; otherwise I would simply see port
    1080.)


    The challenge is to make sure that the services listed by this command are those
    that your security policy currently allows, and to make sure that you have TCP
    Wrappers configurations for all these services.


    Also, make sure to update the daemons that serve these ports with the latest security
    fixes and monitor their log files several times daily. If you follow these basic
    guidelines, you’ll have a very close grip on the network configuration of your
    server.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # In Sum


    Network security goes a step beyond system security by examining the current configuration
    of the daemons on the Linux server. This chapter provides a detailed discussion
    of the configuration of the inetd daemon, as well as the directory structure of
    the startup network daemons. Both of these must be considered in order to ensure
    a secure network configuration.


    The TCP Wrappers utility is an essential addition to all Linux distributions because
    it provides a flexible, unintrusive tool to enforce access controls on incoming
    network connections. In addition, TCP Wrappers affords you the capability to maintain
    detailed logs of all network activity at the TCP/UDP layer. The netstat command
    should also be used as an aid in the process of securing the network layer because
    it offers a succinct view of the ports that are currently active on the server.


    The next chapter, Chapter 5, “Network Monitoring and Auditing,” concludes Part
    2 with a comprehensive look at the monitoring and auditing tools that the administrator
    can use to ensure the continued security of his/her system. Chapter 5 also introduces
    the topic of intrusion detection and discusses the concepts behind digital forensics.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/3258bbaf790525f8c4eb25fabff7844a_142_0.png)


    # Network Auditing and Monitoring


    Chapter 4, “Network Services Configuration,” kicked off Part 2, “Network Security,”
    with a detailed discussion of security at the network layer by examining the configuration
    of the Linux network services and discussing the daemons that control these services.
    Chapter 4 outlined some important configuration guidelines and showed you how
    to get a handle on the network services running on your Linux server.


    This chapter concludes Part 2 by introducing the concept of network monitoring
    and auditing. We’ll start by defining those terms in detail and by identifying
    where they fit in the overall security process. We’ll then describe a representative
    sample of tools that are available to conduct network audits and to monitor the
    network activity surrounding your Linux server.


    # Network Auditing


    The aim of network auditing is to ensure that the security mechanisms you have
    implemented are effective in addressing the requirements of your security policy.
    By staging the very same break-ins that your policy is trying to guard against,
    you’ll learn just how vulnerable you are, and you’ll be able to predict and quantify
    your security risks, as well as their likely consequences. Make sure to tell the
    other network and system administrators in advance that you are going to be staging
    break-ins on your server.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The most effective approach to network auditing is to play the role of an intruder,
    attempting to gain unauthorized access to your Linux server from the public network.
    In almost every instance, this experiment reveals “holes” that weren’t apparent
    when you implemented your security mechanisms. Whenever you meet system security
    administrators who talk about their *impenetrable* defense, always assume that
    the reason why they don’t know of any holes is because they have not conducted
    any security audits. Chances are that a bored high school kid half a world away
    with a cable modem and a lot of time on his hands is “auditing” their network
    defenses at 4 A.M.


    Network auditing tools provide a layer of automation to the process of exploring
    network vulnerabilities on a server. These tools fall into two general categories:


    +   * **Network-based** auditing tools are tools that attempt to find vulnerabilities
    by scanning your server from the public network.

    +   * **System-based** auditing tools are tools that attempt to find system vulnerabilities
    by executing on the server itself.


    The next two sections introduce some noteworthy examples of both of these two
    types of auditing tools.


    # Network-Based Auditing Tools


    While there have always been attempts to build a comprehensive tool for exposing
    network vulnerabilities on a system, it wasn’t accomplished until 1995, when Dan
    Farmer and Wieste Venema (who also created TCP Wrappers) released the first version
    of SATAN (Security Administrator’s Tool for Analyzing Networks). This network-based
    auditing tool quickly became a household word among network and systems administrators.
    In their 1993 landmark paper, “Improving the Security of Your Site by Breaking
    Into It,” Farmer and Venema capitalized on the concept of building an application
    that would systematically attempt to break into a target system, or even a range
    of systems within a subnet. Two years later, SATAN was born, and the initial response
    from the Linux community was overwhelmingly positive.


    However, the release of SATAN did not come without some controversy. Although
    this was clearly a useful tool for uncovering your own host’s vulnerabilities,
    it could also be used by intruders to find their way into just about any system
    on the Internet, as long as perimeter defenses permitted it. However, this did
    not diminish SATAN’s usefulness, and soon thereafter there were two more SATAN
    follow-ups, SAINT (Security Administrator’s Integrated Network Tool) and SARA
    (Security Auditor’s Research Assistant).


    SAINT provides improved vulnerability testing and detection, an improved user
    interface, and the capability to specify multiple levels of security. SAINT is
    much more robust than the original SATAN was, fixing a number of important bugs.
    SARA is a more'
  merge: -1
  img_proc: true
- pgno: 144
  md: "modular package, with interfaces to third-party products such as Nmap and Samba.\
    \ SARA also features an advanced report writer to document the vulnerabilities\
    \ that it finds.\n\nThe latest evolution of this series of tools is Nessus, which,\
    \ just like its predecessors, is a Web-driven application with a sophisticated\
    \ back end that attempts to explore and report on a number of known security vulnerabilities.\
    \ The next section describes the Nessus application in more detail.\n\n# ## Nessus\n\
    \nThe Nessus project was born in April 1998 as an initiative to replace the aging\
    \ SATAN package with another free, Unix-based auditing toolkit. While a few commercial\
    \ offerings were starting to become available at that time, these packages focused\
    \ more on the style of their reports and on their network discovery abilities\
    \ instead of on the robustness and completeness of their auditing features. In\
    \ addition, the price of commercial auditing tools was (and still is) prohibitive\
    \ for most companies.\n\nNessus erupted as a free, open-source, full-featured,\
    \ security-auditing tool that continues to see active support by developers around\
    \ the world. New attack definitions are added daily, often just hours after being\
    \ publicly announced. But if that's not up-to-the-minute enough, the modular architecture\
    \ of Nessus allows you to write your own customized attack-check plug-in that\
    \ can be seamlessly integrated into the system without the need for recompilation.\
    \ For example, Listing 5.1 contains a plug-in that instructs Nessus to check whether\
    \ the target system's Sendmail installation allows for anonymous mail relaying,\
    \ a technique often used for spamming.\n\n**Listing 5.1** *smtp_relay.nasl:* Nessus\
    \ plug-in script to check for Sendmail mail relaying\n\n```\n```nsl\nfake = get_kb_item(\"\
    Sendmail/fake\");\nif(fake)exit(0);\n\n# can't perform this test on localhost\n\
    if(islocalhost())exit(0);\nport = get_kb_item(\"Services/smtp\");\nif(!(port)port\
    \ = 25;\nif(get_port_state(port))\n{\n  soc = open_sock_tcp(port);\n  data = recv(socket:soc,\
    \ length:1024);\n  crp = string(\"HELO nessus.org\\n\");\n  send(socket:soc, data:crp);\n\
    \  data = recv_line(socket:soc, length:1024);\n  crp = string(\"MAIL FROM:test_10@nessus.org\\\
    n\");\n```\n\n```"
