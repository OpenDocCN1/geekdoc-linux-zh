  md: 'If your version of Sendmail has STARTTLS support configured, it should appear
    as 250-STARTTLS when you execute the following command (note the third line from
    the bottom):


    ```

    [ramon]$ telnet localhost 25

    Trying 127.0.0.1...

    Connected to localhost

    Escape character is ''^]''.

    220 redhat.example.com ESMTP Sendmail 8.11.0/8.11.0; Sun, 26 Nov 2000

    21:04:55 -0500

    ehlo localhost

    250-local.sendmail.COM Hello localhost [127.0.0.1], pleased to meet you

    250-ENHANCEDSTATUSCODES

    250-DSN

    250-STARTTLS

    250 HELP

    quit

    ```


    # ### Using STARTTLS


    There are two useful applications for Sendmail''s STARTTLS support:


    +   - Allowing relaying based on successful certificate authentication

    +   - Restricting SMTP connections to those who are valid certificate holders


    By requesting a CA-signed X.509 certificate from all SMTP users requesting mail
    relaying, the local Sendmail agent can ensure that only authenticated users are
    allowed to relay through your server, regardless of what IP address they may be
    coming from.


    In addition, STARTTLS can be used to allow SMTP connections to your mail server
    only in the event that the remote system has presented a valid certificate that
    can be verified by the local server''s CA. You can either restrict incoming connections
    to those clients holding a valid certificate, or you can force outgoing mail connections
    to only succeed if the remote end can accept your certificate and agree to establish
    a secure (encrypted) SMTP session. You can use this last feature to set up a virtual
    private SMTP link over the public Internet, where you can share sensitive information
    via e-mail with a greater degree of confidentiality.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'As you can see, STARTTLS addresses the three main concerns of information security
    as a whole (confidentiality, integrity, and authentication), and it does this
    using standard open-source software components. It is not a substitute for a network
    layer virtual private network (VPN) system that guarantees the privacy of all
    traffic, regardless of application. This concept is discussed in detail in Chapter
    12, “Virtual Private Networks.”


    STARTTLS is, however a good first step toward the adoption of a full-fledged VPN,
    especially if your security policy is such that only SMTP traffic needs to be
    protected while travelling outside your network. In fact, it’s generally a good
    idea to protect the content of SMTP packets, even as they traverse the internal
    network, where they can be subject to unauthorized eavesdropping by insiders.


    > **NOTE** For in-depth information on the installation, configuration, and administration
    of Sendmail on a Linux server, please refer to *Linux Sendmail Administration*
    (Sybex, 2001), part of the Craig Hunt Linux Library.


    You can also find more information on Sendmail and the Sendmail consortium at
    www.sendmail.org.


    The next two sections describe two alternative MTAs that have been gaining popularity
    in the last few months. Let’s kick off the discussion with Qmail.


    # # Qmail


    While Sendmail is responsible for carrying over two-thirds of the e-mail traffic
    exchanged over the Internet on a daily basis, it does have some worthy competitors.
    In fact, one alternative to Sendmail is gaining popularity at an unprecedented
    pace: Qmail. Developed by Dan Bernstein at the University of Illinois at Chicago,
    Qmail aims to address the security issues found in Sendmail by offering an MTA
    designed from the ground up with security in mind. From its inception, Qmail followed
    some very fundamental rules, such as


    +   - Avoid running the main MTA daemon as root. Instead, only two of its auxiliary
    scripts need root privileges.


    +   - Avoid the use of `setuid`. Only one Qmail script, `qmail-queue`, is `setuid`.


    +   - Treat addresses differently than programs and files. This is done to avoid
    a common vulnerability of Sendmail’s where users were feeding the Sendmail daemon
    shell scripts in place of addresses, only to have the server execute them (often
    with root privileges).'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'In addition to this design philosophy, Qmail has a few circumstantial advantages
    over Sendmail:


    +   • Qmail is more recent. Hindsight is 20/20, and Qmail has learned a lot of
    the vulnerabilities that are inherent to MTAs in general and that were only discovered
    because Sendmail was deployed first.

    +   • Qmail was born in a different climate. The Internet of 1984 was very different
    from the Internet of 1996. This forced Qmail developers to write applications
    that would withstand the risks of today’s brave new public networks. Sendmail
    has been keeping up with the new vulnerabilities, but it’s done it via patches
    and slight enhancements to the original design.

    +   • Qmail is a simpler (and smaller) program. In the 15+ years that Sendmail
    has been used in a production environment, the feature requests have never stopped
    flowing. The result is a very complete, but very complex MTA. As is the case with
    any piece of server software, complexity breeds vulnerability.


    However, there are certain areas where Sendmail still has the upper hand:


    +   • Sendmail is more mature. It still moves the overwhelming majority of SMTP
    traffic over the Internet and is a much better known quantity. There is extensive
    Sendmail documentation, including books and tutorials, as well as training and
    certification.

    +   • Sendmail’s installation procedure is robust and well automated, whereas
    Qmail still requires a number of manual steps to be executed.

    +   • Sendmail is more scrutinized, with an installed base that is orders of magnitude
    larger than Qmail’s. This leads to much quicker identification of security vulnerabilities,
    and prompt availability of the appropriate security fix.


    When it comes to advocating the security of the package, the Qmail community backed
    up their claims with one of the now infamous financial “challenges.” The contest
    started in April of 1997 and ended in April of 1998, and aimed to find a security
    vulnerability in the Qmail software that would give a remote user unauthorized
    access to the target system. The contest period ended and no one was able to find
    a legitimate vulnerability on the software, so the $1,000 prize went unclaimed.


    Putting aside the result of this challenge, I recommend that you don’t base your
    decision about which MTA to use solely on Qmail’s claims of proven security. Both
    Qmail and Sendmail can be made secure enough to meet the requirements of any security
    policy. If you are already using Sendmail in your mail server installation and
    you have built some core expertise on it, you may want to stay with that package.
    The danger in changing MTAs is that you’ll almost always need a learning period
    during which you are more prone to making simple configuration mistakes that may
    lead to a security vulnerability.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'If you are building an SMTP server from the ground up and have no previous
    Sendmail experience, review the features that Qmail offers and make sure that
    it can meet your overall mail-handling needs. If the answer is yes, then Qmail
    is a better fit for your needs because it is simpler and easier to configure.


    Extensive information on Qmail can be found at www.qmail.org.


    The next section describes yet another Sendmail replacement: the Postfix MTA.


    # Postfix


    Completing the MTA trilogy is Postfix, developed by Wietse Venema, who brought
    us other proven security packages (SATAN, TCP Wrappers). The Postfix project is
    at a much earlier stage than Sendmail and Qmail, and as of the writing of this
    book, Wietse still calls the shipping version *Beta*. In fact, releases are tagged
    with *snapshot* numbers (dates, really), rather than real (*major.minor*) version
    numbers.


    Postfix is even more modular and simpler to configure than Qmail, and it appears
    to out-perform most other MTAs in use today in the number of messages that it
    can handle per unit of time. At the current growth rate in deployed installations,
    I expect that Postfix will be a strong challenger to both Sendmail and Qmail in
    the near future.


    Postfix includes some critical security features:


    +   - **Principle of Least Privilege**  Most Postfix processes, including the
    SMTP client and the SMTP server, run at fixed low privilege in a chroot environment,
    which means that they are only aware of a limited section of the filesystem (a
    sandbox of sorts).

    +   - **Process Isolation**  Most Postfix processes are decoupled and isolated
    from one another, such that a vulnerability in one of them would be contained
    and not easily spread to the security-sensitive parts of the system, such as the
    local mail delivery daemon.

    +   - **Process Ownership**  None of the Postfix processes run under the ownership
    on the invoking user. Instead, they are owned by a daemon user with no parent-child
    relationship to the user process.

    +   - **Setuid**  No Postfix process runs with `setuid` permissions.

    +   - **Large Inputs**  Postfix developers have designed the system in order to
    be resilient to buffer overflows in the presence of unusually large SMTP input
    commands.


    You can find more information on the Postfix project at `www.postfix.org`.


    Up until now, this chapter has focused the discussion on MTA applications. The
    next section shifts the focus to the security issues associated with mail retrieval
    protocols, which are used by MUAes to fetch messages from a waiting queue in the
    mail server. Let''s start'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'by looking at the Post Office Protocol (POP), and continue by examining the
    Internet Mail Access Protocol (IMAP).


    # # The Post Office Protocol (POP) V.3


    When the Internet saw the transition away from time-sharing systems where all
    the mail was read online, to the PC-on-every-desktop model, it became evident
    that most PCs were not going to be up and running all the time. This made it necessary
    to devise a protocol by which users could send mail and request their incoming
    mail from a dedicated server. While the existing SMTP protocol was a good fit
    to handle outgoing mail, a new protocol had to be created to address the incoming
    mail. Enter the POP protocol. In 1984, the IETF drafted the first RFC document
    outlining the standard (RFC918) only to be enhanced in 1988 (RFC1081) into version
    3 of the protocol (POP3), which is still in use today.


    POP3 became the de facto standard for mail-retrieval clients throughout the late
    1980s and early 1990s, until it began losing steam in favor of the IMAP protocol
    (discussed in the next section). There are still, however, millions of POP3 clients
    in operation today, with thousands of POP3 servers to which they connect, many
    of them hosted by Linux servers.


    Of all the POP3 server packages, the one that has enjoyed the most popularity
    in the Linux community is the Qualcomm, Inc.''s Qpopper. Originally developed
    as a companion to the (also wildly successful) Eudora mail client, Qpopper was
    positioned as a full-featured, open-source POP3 server, whose development continues
    today. This section focuses on Qpopper because it''s the best representative of
    this class of servers and discusses the security issues involved with its installation
    and use.


    # ## APOP


    The APOP functionality extends the standard POP3 authentication sequence by adding
    the ability to send authentication information without exposing the password in
    the clear. The basic operation of the POP3 protocol is as follows:


    +   1. The client connects to the appropriate port (TCP 110) of the POP3 server.

    +   2. The client supplies a username and password that authenticates them to
    some mailbox on the server.

    +   3. The client queries mailbox statistics (for example, number of new messages,
    total messages, etc.).

    +   4. The client retrieves a number of messages.

    +   5. The client deletes a number of messages.

    +   6. The client closes connection.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'For example, consider the client/server conversation in Listing 6.4.


    # **Listing 6.4** POP3 session: conventional (USER/PASS) authentication


    ```

    [ramon]$ telnet pop3.example.com 110

    Trying 209.1.78.12 ...

    Connected to pop3.example.com.

    Escape character is ''^]''.

    +OK QPOP (version 3.1b6) at pop3 starting. <3606.975375600@redhat>

    USER ramon

    +OK Password required for ramon.

    PASS mysecret

    +OK ramon has 1 visible messages (0 hidden) in 890 octets.

    ```


    The main security flaw with the implementation in Listing 6.4 is the fact that
    the user must supply a password as part of the authentication sequence. This exposes
    a piece of secret material to eavesdropping over the public Internet, especially
    considering that some POP3 clients can be configured to automatically contact
    the server periodically to check for newly arrived e-mail.


    In order to alleviate this risk, the POP3 protocol developers amended the original
    standard with a challenge/response mechanism by which the POP3 server presents
    the client with a challenge (the current decimal value of the system clock). It
    is then up to the client to generate an MD5 one-way hash of the challenge, appended
    to the authentication password that the POP3 administrator has assigned to the
    user. The client then returns the result of the hash in the APOP line. If the
    server successfully replicates the response at its end and it matches the one
    returned by the client, then the authentication is successful, and the user is
    allowed to retrieve messages from their mailbox.


    In the example in Listing 6.5, username ramon is attempting to log on to pop3.example.com
    to read his mail.


    # **Listing 6.5** POP3 session: APOP authentication


    ```

    [ramon]$ telnet pop3.example.com 110

    Trying 209.1.78.12 ...

    Connected to pop3.example.com.

    Escape character is ''^]''.

    +OK QPOP (version 3.1b6) at pop3 starting. <3606.975375600@pop3>

    APOP ramon 59df6759df98s7d9fs7d9f75d9f758g

    +OK ramon has 1 visible messages (0 hidden) in 890 octets.

    ```


    The POP3 server in Listing 6.5 presents the user with the challenge (a string
    of characters that they must use in their reply)


    <3606.975375600@pop3>'
  merge: -1
  img_proc: true
- pgno: 185
  md: "which the client appends to the password to form the following string:\n<3606.975375600@pop3>mysecret\n\
    It then proceeds to feed this string to the MD5 algorithm, which produces a hash\
    \ value of\ns9df67$s9df798$s7d9f57d9f7s9df758g\nNote that the robustness of this\
    \ approach comes from the fact that it is mathematically infeasible to obtain\
    \ the original *seed* from the MD5 hash. Therefore, even if the eavesdropper knows\
    \ the challenge that the POP3 server sent to the client, the risk of having them\
    \ reverse the MD5 function to obtain the seed is minimal.\nThe next section walks\
    \ you through the process of installing the Qualcomm Qpopper package, including\
    \ how to configure the APOP authentication method.\n\n# ### Installing the Qpopper\
    \ Software\n\nThe Qpopper package is not typically installed by default on most\
    \ Linux distributions, but it can be easily obtained in RPM format and installed\
    \ using the Linux *rpm* utility, as follows:\n[ramon]$ sudo rpm -i qpopper-3.1b6-3k.i586.rpm\n\
    This command installs the server binary and the man pages, as well as a limited\
    \ set of documentation. The next section shows you how to set up the POP3 server,\
    \ as well as its extended authentication feature.\n\n# ### Configuring the Qpopper\
    \ Software\n\nThe latest version of Qpopper at the writing of this book (3.1)\
    \ does not automatically create an *xinetd* entry in order to spawn itself automatically.\
    \ To make sure this happens, simply create the file */etc/xinetd.d/qpopper* with\
    \ the contents in Listing 6.6.\n\n# **Listing 6.6**  Contents of the /etc/xinetd.d/qpopper\
    \ file\n\n```\n```\n  service pop3\n  {\n          socket_type           = stream\n\
    \          wait                  = no\n          user                  = root\n\
    \          server                = /usr/sbin/in.qpopper\n          log_on_success\
    \        ++ USERID\n          log_on_failure        ++ USERID\n  }\n```\n```"
