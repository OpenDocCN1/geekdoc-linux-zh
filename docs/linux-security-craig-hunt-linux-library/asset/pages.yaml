    # # The netstat Command


    The netstat command is one of the most powerful utilities available to you in
    your quest for a secure network configuration. While the process table shows you
    which daemons have been started from the command line, and the /etc/inetd.conf
    file shows you the ones that are inetd-controlled, the netstat command is the
    ultimate authority on diagnosing which ports your Linux server is listening on.


    The netstat command is very broad in function, but it is the --inet and -a options
    that show you the current state of your network configuration. Consider the sample
    output in Listing 4.11.


    # ### Listing 4.11 Output of the netstat --inet -a command


    ```

    [ramon]$ netstat --inet -a

    Active Internet connections (servers and established)

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0 0 bugs::ssh elmer:1186 ESTABLISHED

    tcp 0 0 \*:telnet \*: \* LISTEN

    tcp 0 0 \*:ftp \*: \* LISTEN

    tcp 1 0 bugs:2148 226.146.218.1:www CLOSE_WAIT

    tcp 1 0 bugs:2146 226.148.218.1:www CLOSE_WAIT

    tcp 0 0 \*:www \*: \* LISTEN

    tcp 0 0 bugs:1335 elmer:6000 ESTABLISHED

    tcp 0 0 bugs::ssh elmer:39470 ESTABLISHED

    tcp 0 0 \*:smtp \*: \* LISTEN

    ```'
