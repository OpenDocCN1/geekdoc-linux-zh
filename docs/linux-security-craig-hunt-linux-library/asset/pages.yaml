    # # Pluggable Authentication Modules (PAMs)


    With the explosion of network-aware Linux applications, authentication has become
    an important issue. Traditionally, Linux application developers included their
    own authentication mechanisms in their programs, ranging anywhere from no authentication
    (e.g., TFTP) to strong Kerberos and S/Key authentication (e.g., telnet). Hard-coding
    authentication into each application has several drawbacks:


    +   - The user is forced into a specific mode of authentication.

    +   - Changing authentication mechanisms involves recompiling the application.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '+   * Systems administrators must manage heterogenous authentication mechanisms.


    Originally developed by Sun Microsystems, the Pluggable Authentication Modules
    (PAM) framework allows administrators to control authentication parameters for
    network applications. Developers simply adhere to the PAM standard and call a
    set of dynamic libraries that come with PAM. PAM support is now included in all
    major Linux distributions, and a growing number of network applications are now
    using PAM for authentication.


    There are two parts to the PAM system:


    +   * A set of dynamically linked shared libraries (modules) that are typically
    installed in `/lib/security` or `/usr/lib/security`


    +   * A set of configuration files that are typically installed in `/etc/pam.d/`


    The developer of a networked application (for example, `login`) simply specifies
    that authentication is needed in the code before the user is granted a shell.
    You, as the system administrator, have complete control, using the `/etc/pam.d/login`
    configuration file, to specify what type of authentication you want your users
    to undergo before `login` gives them access to their shell.


    The tasks that PAM takes care of fall into four categories or management groups:


    +   * Authentication management, where PAM establishes whether the user is who
    they claim to be. This can be achieved using a simple method like standard username/
    passwords, using a more complex method such as challenge-response authentication,
    or using a time-based hardware token card.


    +   * Account management, where PAM provides verification services based on the
    account information. This management group concerns itself with questions like


    +   * Has the user password expired?

    +   * Does this user belong to the right group to be allowed access to a particular
    service?


    +   * Password management, where PAM takes care of any necessary updates to the
    authentication token associated with the user. Once the user is authenticated,
    the password management group prompts a user for a new password if the previous
    has expired.


    +   * Session management, where PAM does a number of things in preparation for
    granting the user access to the resources or right before the service is to be
    withdrawn. Session management tasks include logging events, mounting home directories,
    etc.


    ![](img/3258bbaf790525f8c4eb25fabff7844a_431_0.png)'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# Installing PAM


    Although PAM has become a standard package in most Linux distributions, it''s
    always advisable to make sure you have the latest version. To update an existing
    PAM installation, enter the following commands:


    ```

    [ramon]$ **rpm -q pam**

    pam-0.72-26

    [ramon]$ **sudo rpm -U pam-0.72-37.i386.rpm**

    [ramon]$ **rpm -q pam**

    pam-0.72-37

    ```


    The preceding example shows you were running stock Red Hat 7.0, which came with
    PAM 0.72-26. This system has now been upgraded to version 0.72-37 using the RPM
    command.


    #  Configuring PAM


    PAM consults a configuration file for each type of network service to authenticate.
    All files are of the type /etc/pan.d/service where service is the name of the
    network service to authenticate.


    > **NOTE** The /etc/pan.d/other file has a special meaning because it is always
    consulted after the file specific to the service in question.


    For example, the file that controls authentication for the ftp program is in /etc/pan.d/ftp.


    Each line in one of these files is of the format:


    ```

    *module-type* *control-flag* *module-path* *arguments*

    ```


    Let''s take a closer look at each of these four fields:


    *module-type* A PAM module can be of one of four types:


    +   * auth

    +   * account

    +   * session

    +   * password


    Each of these module types corresponds to one of the four fundamental PAM management
    groups described in the previous section.'
