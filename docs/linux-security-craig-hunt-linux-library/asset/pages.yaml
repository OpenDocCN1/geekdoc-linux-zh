- pgno: 397
  md: '# Strong User Authentication


    A significant number of security breaches are due to the theft of authentication
    credentials (passwords or other secret keys) via both eavesdropping and brute-force
    guessing attacks. This chapter addresses both of these concerns by introducing
    two strong authentication facilities: the Kerberos secret-key authentication system
    and the S/Key one-time password system.


    By definition, strong authentication differs from conventional username/password
    authentication in the types of credentials used and in the exposure of these credentials.
    The Kerberos system enhances the security of your Linux server by eliminating
    the exchange of passwords in the clear. Kerberos users obtain encrypted tickets
    locally and use the ticket to authenticate themselves to other network resources.
    This eliminates the need to provide cleartext passwords every time a network service
    is requested. The S/Key system still relies on regular username/password exchanges
    but it uses a different password with every access request, thereby eliminating
    the risk of eavesdropping.


    In addition, this chapter introduces the Pluggable Authentication Modules (PAM)
    facility. PAM is a framework for providing a single point of configuration where
    system and security administrators can request authentication mechanisms from
    all network applications running on the Linux server.


    Let’s get started by taking a closer look at the Kerberos authentication system.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# # Kerberos


    Originally designed by R.M. Needham and M.D. Schroeder at MIT, Kerberos gets its
    name from the three-headed dog that, according to Greek mythology, guarded the
    entrance to the underworld. In real life, Kerberos is a service based on secret
    keys that is used for strong authentication of users and services. Instead of
    providing separate authentication credentials to each server on your network,
    Kerberos allows users to request their credentials once in the form of a Kerberos
    *ticket* and then use this ticket to authenticate themselves to any Kerberos-enabled
    server on your network. Both users and servers rely on a central Key Distribution
    Center (KDC) to obtain and authenticate tickets.


    The main advantage of Kerberos over standard username/password authentication
    is that passwords are never exposed on the network. This is accomplished using
    shared keys between Kerberos participants (including humans, servers, and the
    Kerberos central authority). Before authentication credentials are exchanged,
    they are always encrypted to ensure their privacy.


    Figure 13.1 gives you an idea of what’s available on the Kerberos home page at
    `http://web.mit.edu/kerberos/www/`.


    # **Figure 13.1** Kerberos home page


    ![](img/3258bbaf790525f8c4eb25fabff7844a_398_0.png)'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'Kerberos, like many technical systems, has its own language for describing
    its components and functions. Before digging into the operation of the Kerberos
    protocol, let’s define some key terminology that will be used throughout this
    chapter:


    **Principal** A *principal* is a user or server program (service) that will be
    using Kerberos authentication.


    **Key Distribution Center (KDC)** The KDC is a physically secure server that contains
    a database that includes all principals in the system as well as their master
    keys.


    **Master Key** The *master key* is a secret key that is shared between the KDC
    and each principal in the system.


    **Credentials** *Credentials* are encrypted authentication evidence presented
    by a principal to a service or to the KDC for authentication.


    **Ticket** A *ticket* is a special type of credential that allows a principal
    to log on to a specific service.


    **Ticket-Granting Ticket** A *ticket-granting ticket* (*TGT*) is a special type
    of credential used by a service on behalf of a user to request a service-specific
    ticket (e.g., to log on to a given server).


    **Realm** A *realm* is a set of Kerberos principals, servers, services, and KDCs
    under a common administrative domain. (A realm is similar in concept to a DNS
    domain.)


    The Linux Kerberos system consist of three parts:


    **Key Distribution Center** The KDC is the centerpiece of the Kerberos authentication.
    As described earlier in this section, it contains the database of all Kerberos
    participants (principals). The KDC is typically also used to host the administration
    daemon (*kadm*) that allows authorized principals to manage the Kerberos database
    remotely using Kerberos authentication.


    **Kerberized Services** Kerberized services are direct replacements for popular
    Linux server daemons such as Telnet, FTP, remote login, and remote shell. Kerberized
    services have been modified to use Kerberos authentication, but they provide all
    the other functionality that you are used to.


    **Kerberized Clients** Kerberized clients are the companion clients to the Kerberized
    services described in the previous paragraph. They too are equivalent in functionality
    to the traditional Telnet, FTP, and remote login clients and can be used to connect
    to non-Kerberized services.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'A typical Kerberos interaction among a user (Alice), her local workstation
    (Atlantis), and a remote Telnet server (Challenger) works as follows (some of
    the steps have been simplified):


    +   1. Alice logs onto her local workstation (Atlantis).

    +   2. Alice supplies her Kerberos password to Atlantis.

    +   3. Atlantis requests a TGT from the KDC on Alice''s behalf.

    +   4. KDC verifies Alice''s master key and issues the TGT, if appropriate.

    +   5. Alice requests a login to Challenger.

    +   6. Atlantis presents the TGT to KDC and asks for a ticket to Challenger.

    +   7. KDC replies with Alice''s ticket to log onto Challenger.

    +   8. Atlantis connects to Challenger with this ticket.

    +   9. Challenger verifies the validity of the ticket.

    +   10. Challenger allows Alice''s connection, if appropriate.


    Figure 13.2 illustrates these steps. Note that the numbers on the figure correspond
    with the steps listed.


    # Figure 13.2 Alice connects to Challenger using Kerberos authentication


    ![](img/3258bbaf790525f8c4eb25fabff7844a_400_0.png)'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'Before moving on, let’s make some observations on this exchange:


    +   - The KDC has previous knowledge of Alice’s password.

    +   - The KDC’s master key for Alice is derived from this password.

    +   - The KDC shares a secret key with Atlantis.

    +   - All exchanges between Atlantis and the KDC are encrypted with this secret
    key.


    One of the questions that often comes up when explaining the operation of the
    Kerberos protocol is, “What is the purpose of the ‘TGT?’” In essence, the TGT
    is granted to the Kerberos principal (Alice) so that the KDC does not have to
    remember anything about Alice’s request. This is important because it frees the
    KDC from having to keep state information, such as a list of the principals who
    are currently authenticated to any given service. When the KDC sends the TGT to
    Alice, it includes in the TGT the expiration date, the session key, and other
    perishable data items necessary for Kerberos operation. By not keeping these items
    on the KDC itself, the Kerberos system could survive a sudden corruption or total
    failure of the KDC by simply diverting future ticket requests to a spare KDC equipped
    with a copy of the static authentication database.


    The advantages of Kerberos over a standard username/password authentication service
    are twofold:


    +   **Privacy** When users authenticate to a service using Kerberos, they do not
    expose any cleartext passwords on the network. In addition, Kerberos uses secret
    shared keys for authentication, which greatly facilitates the encryption of the
    entire session, including data transfer.

    +   **Convenience** Once users obtain a Kerberos ticket, they can present it to
    more than one Kerberos-enabled service as many times as they wish until the ticket
    expires.


    Kerberos has been made available in open-source format from its inception. The
    next section explains how to download the Linux version of Kerberos (including
    all its components) and how to install it and configure it to support secret-key
    authentication on your Linux server.


    # Configuring the Kerberos Domain Controller (KDC)


    There are three distinct phases to configuring a Kerberos authentication environment:


    +   1. First, you need to configure your Kerberos KDC, which listens for ticket
    requests from Kerberos clients.

    +   2. Next, you have to populate the database on the KDC with the Kerberos principals
    for which you will be seeking authentication.

    +   3. Finally, you have to configure your Kerberos-enabled servers to make use
    of Kerberos authentication for popular services such as Telnet and FTP.'
  merge: -1
  img_proc: true
- pgno: 402
  md: "All Kerberos systems need the correct software. If Kerberos is not installed\
    \ on your system, you need to locate and download three packages before you can\
    \ begin the configuration:\n\n+   - `krb5-libs-1.2.1-8`: the libraries\n+   -\
    \ `krb5-workstation-1.2.1-8`: the workstation binaries\n+   - `krb5-server-1.2.1-8`:\
    \ the server binaries\n\nThese packages are readily available in RPM format from\
    \ your favorite repository. Note that you must install `krb5-workstation-1.2.1-8.i386.rpm`\
    \ before `krb5-server-1.2.1-8.i386.rpm` because it's one of its dependencies.\
    \ Execute the following commands in this order to install these three packages:\n\
    \n```\n```\n[ramon]$ sudo rpm -i krb5-libs-1.2.1-8\n[ramon]$ sudo rpm -i krb5-workstation-1.2.1-8.i386.rpm\n\
    [ramon]$ sudo rpm -i krb5-server-1.2.1-8.i386.rpm\n```\n```\n\nBegin the Kerberos\
    \ configuration by creating a primary KDC. First, check out the `/etc/krb5.conf`\
    \ file. This is the general Kerberos configuration file, which is divided into\
    \ several sections, or stanzas. Each of these section starts with a heading, followed\
    \ by a number of variable assignments:\n\n```\n```\n[stanza heading]\n    variable1\
    \ = value\n    variable2 = value\n... \n```\n```\n\nThe sample `/etc/krb5.conf`\
    \ file supplied with the server package is a good starting point for your configuration.\
    \ Pay special attention to the `[logging]` and the `[realms]` sections. The `[logging]`\
    \ section instructs the KDC and the Kerberos administration server to send log\
    \ events to a specific file or facility. The variables defined in the `[logging]`\
    \ section are as follows:\n\n+   - `admin_server` specifies a target file or device\
    \ for the administrative server to perform its logging.\n+   - `kdc` specifies\
    \ a target file or device to which the KDC server should log its events.\n+  \
    \ - `default` specifies how to perform logging in the absence of an entry for\
    \ `admin_server` or `kdc`.\n\nThe values to be used for these variables can be\
    \ as follows:\n\n+   - `FILE=filename` to specify a regular Linux file.\n+   -\
    \ `STDERR` to specify the standard error log.\n+   - `CONSOLE` to specify the\
    \ Linux console."
  merge: -1
  img_proc: true
- pgno: 403
  md: "+   * DEVICE=devicename to specify a Linux device other than a file.\n+   *\
    \ SYSLOG[:<severity>[:<facility>]] to specify syslog logging to the named facility\
    \ with the named severity level.\n\nListing 13.1 shows a sample [logging] section\
    \ that is logging KDC, the administrative server, and other events to three separate\
    \ files.\n\n# Listing 13.1 The [logging] section of krb5.conf\n\n```\n[logging]\n\
    default = FILE:/var/log/krb5libs.log\nkdc = FILE:/var/log/krb5kdc.log\nadmin_server\
    \ = FILE:/var/log/kadmin.log\n```\n\nThe [realms] section of krb5.conf contains\
    \ one or more blocks of information delimited by the following syntax:\n\n```\n\
    [realms]\nREALM_NAME_1 = (\n    variable1 = value\n    variable2 = value\n)\n\
    REALM_NAME_2 = (\n    variable1 = value\n    variable2 = value\n)\n...\n```\n\n\
    Each REALM_NAME_N section uses similar variables to the [logging] section:\n\n\
    +   * admin_server specifies the name of the host running the administration server\
    \ for the given realm.\n+   * kdc specifies the name of the host running the KDC\
    \ for the given realm.\n+   * default_domain specifies the default domain to which\
    \ hosts in this realm belong.\n\nListing 13.2 shows an example of a [realms] section\
    \ containing a single realm definition (HONTANON.COM) where both the KDC and the\
    \ administration server are running on the host kerberos.hontanon.com. Note that\
    \ the port numbers are specified after the hosts to separate the KDC service (TCP\
    \ port 80) from the administration service (TCP port 749)."
  merge: -1
  img_proc: true
- pgno: 404
  md: "# **Listing 13.2** The `[realms]` section of krb5.conf\n\n```\n[realms]\nHONTANON.COM\
    \ = {\n    kdc = kerberos.hontanon.com:88\n    admin_server = kerberos.hontanon.com:749\n\
    \    default_domain = hontanon.com\n}\n```\n\nThe `[domain_realms]` section of\
    \ krb5.conf defines a translation from any host name to a Kerberos realm name\
    \ for the services provided by that host. For example, Listing 13.3 shows a `[domain_realms]`\
    \ section that defines hosts ending in hontanon.com or anyhostname.hontanon.com\
    \ to be in the HONTANON.COM realm.\n\n# **Listing 13.3** The `[domain_realms]`\
    \ section of krb5.conf\n\n```\n[domain_realms]\n  .hontanon.com = HONTANON.COM\n\
    \  hontanon.com = HONTANON.COM\n```\n\n# ## The KDC Configuration File (kdc.conf)\n\
    \nNow let’s take a look at the Kerberos KDC configuration file (/var/kerberos/krb5kdc/kdc.conf)\
    \ that is supplied with the Kerberos server package. This is the file where the\
    \ KDC looks for configuration information that is specific to any one realm. The\
    \ default file is a good starting point, but there are two sections that you’ll\
    \ want to pay attention to:\n\nThe `[kdcdefaults]` section contains default information\
    \ for all realms. The following variables are typical examples of these defaults:\n\
    \n+   * ac1_file points to the file used to define the access control lists (ACLs)\
    \ to the KDC. This file is described in detail later in this chapter.\n+   * dict_file\
    \ points to a file that contains a list of passwords that are not allowed for\
    \ use because they are too weak.\n+   * admin_keytab points to the location of\
    \ the keytab file that the Kerberos administration server uses to authenticate\
    \ to the database. This file is described in detail later in this chapter.\n\n\
    The `[realms]` section is similar to the equivalent section in the krb5.conf file\
    \ described in the previous section and typically contains the following variable\
    \ definitions:\n\n+   * master_key_type is the type of encryption used to protect\
    \ the communication of the KDC’s master key."
  merge: -1
  img_proc: true
- pgno: 405
  md: "+   * supported_enctypes is a reference to all the types of encryption supported\
    \ by the KDC for this realm.\n\nListing 13.4 shows the complete contents of a\
    \ typical kdc.conf file.\n\n# ## Listing 13.4 Contents of a typical kdc.conf file\n\
    \n```\n```\n[ramon]$ more /var/kerberos/krb5kdc/kdc.conf\n[kdcdefaults]\n  acl_file\
    \ = /var/kerberos/krb5kdc/kadm5.acl\n  dict_file = /usr/dict/words\n  admin_keytab\
    \ = /var/kerberos/krb5kdc/kadm5.keytab\n\n[realms]\n  HONTANON.COM = {\n    master_key_type\
    \ = des-cbc-crc\n    supported_enctypes = des-cbc-crc:normal des3-cbc-raw:normal\n\
    \    des3-cbc-sha1:normal des-cbc-crc:v4 des-cbc-crc:afs3\n  }\n```\n```\n\nYou\
    \ may want to create a similar configuration for your KDC. On my server, I also\
    \ have a DNS alias kerberos.hontanon.com pointing to the IP address of my server,\
    \ mostly for convenience. This allows me to change the IP address of the server\
    \ platform, if needed, without having to change the configuration files. I simply\
    \ make a DNS change for the host name to point to the new address.\n\n# ### The\
    \ kdb5_util Utility\n\nThe kdb5_util utility comes bundled with the Kerberos server\
    \ package and allows you to perform administrative procedures on the Kerberos\
    \ authentication database. You can use kdb5_util to create the database, add new\
    \ principals (humans and machines), and modify and delete those principals.\n\n\
    Let’s start by creating the KDC database with the kdb5_util utility, as shown\
    \ in Listing 13.5.\n\n# ## Listing 13.5 Creating the KDC database with kdb5_util\n\
    \n```\n```\n[ramon]$ sudo /usr/kerberos/sbin/kdb5_util create -r HONTANON.COM\
    \ -s\nInitializing database '/var/kerberos/krb5kdc/principal' for realm\n'HONTANON.COM',\n\
    master key name 'K/M@HONTANON.COM'\nYou will be prompted for the database Master\
    \ Password.\nIt is important that you NOT FORGET this password.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 406
  md: 'Enter KDC database master key:

    Re-enter KDC database master key to verify:


    The command in Listing 13.5 prompts you for the Kerberos master key (you should
    pick a word that is hard to guess, containing both mixed-case characters and numbers)
    and creates the following files:


    +   * `/var/kerberos/krb5kdc/principal`: This is a Kerberos database file.

    +   * `/var/kerberos/krb5kdc/principal.kadm5`: This is the Kerberos administrative
    database.

    +   * `/var/kerberos/krb5kdc/principal.kadm5.lock`: This is the lock file associated
    with the Kerberos administrative database.

    +   * `/var/kerberos/krb5kdc/.K5.HONTANON.COM`: This file is called the *stash*,
    a local copy of the master key that is used to authenticate the KDC to itself
    before starting the kadm5d and krb5kdc daemons.


    > **WARNING** The stash file should be heavily guarded and should by owned and
    readable only by the root user. The stash file should not be part of your regular
    backup scheme because this would force you to protect the privacy of your backup
    media (which would contain the master key of the KDC).


    # ### The kadm5.acl File


    Take a look at the kadm5.acl file, typically located in /var/kerberos/krb5kdc.
    This file defines which principals are allowed to use the kdb5_util to modify
    which parts of the database. You need to have at least one Kerberos principal
