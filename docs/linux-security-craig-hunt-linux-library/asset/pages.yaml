    ```

    `[ramon]$ sudo smbpasswd -a -m acct_server1

    Added user acct_server1.`

    ```


    On the NT host’s acct_server1, run the User Manager for Domains and allow all
    users to log on locally. Also, run the Network Settings Control Panel utility
    and change your domain to ACCOUNTING (or whatever you set up in your smb_s.conf
    file). The NT host will welcome you to the new domain and ask you to reboot your
    PC.


    When the NT machine comes back to life, press Ctrl+Alt+Del and watch the login
    dialog pop up. You should have two entries under Domain: the NetBIOS name of the
    NT host and the Samba Domain that you just created (ACCOUNTING). Enter a username
    and password combination that exists in the /etc/samba/smbpasswd file. If everything
    worked right the first time, you should be given access to the desktop after the
    authentication succeeds. If login is not successful, make sure that


    +   - The username/password combination exists in the Samba server’s standard
    Linux /etc/passwd file (and /etc/shadow if you have shadow password support enabled).

    +   - You have successfully created an entry in /etc/samba/smbpasswd for the NT
    host that is requesting authentication on behalf of the user.


    > NOTE As you populate /etc/passwd with domain users with no need to log on to
    the Linux server, be sure to disable their accounts by inserting an asterisk (*)
    in their password field and use /bin/false as their shell.


    Samba’s PDC feature even allows you to assign domain administrator users, who
    can be given full privileges when they log on to the local NT system and authenticate
    using the Samba domain. Simply add the following line to the [global] stanza of
    smb.conf:


    ```

    `domain Admin Group = @admins`

    ```


    Then create a group called admins in the Linux /etc/group file that contains the
    list of users to whom you want to grant administrator privileges. In addition,
    Samba’s PDC feature supports the use of NT logon scripts, which are small pieces
    of MS-DOS batch-style executable scripts that run every time a user logs on to
    the local NT host. By adding the following line to the [global] stanza of smb.conf


    ```

    `logon script = scripts%U.bat`

    ```


    and a [netlogon] stanza as follows


    ```

    `[netlogon]`

    ```'
