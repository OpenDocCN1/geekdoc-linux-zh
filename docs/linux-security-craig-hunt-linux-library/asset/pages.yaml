    # The interface Directive


    Use the interface directive to define the interface(s) available on your server
    and to inform SOCKS5 which interfaces are public and which are private. If your
    server is single-homed (single network interface), you do not need to specify
    this directive at all. On each interface line, you are informing the proxy server
    to only listen to requests from clients that fit the specified host and/or port
    specification.


    ```

    Syntax interface net port interface-address

    ```


    The arguments to the interface directive are as follows:


    +   * net is the IP address of the network that is allowed to send requests to
    the interface in question.


    +   * port is the port number from which clients are allowed to send requests
    to the interface in question.


    +   * interface-address can be either an IP address or a Linux interface descriptor
    (e.g., eth0).


    Examples For a multi-homed server (with interfaces eth0 and eth1) where the local
    subnet (192.168.32.0/24) is proxied via the server''s public interface (eth1),
    which has an address of 198.41.0.6, use the following example:


    ```

    interface 192.168.32.- eth0

    interface - - eth1

    ```


    Or, use its equivalent:


    ```

    interface 192.168.32.- 192.168.32.1

    interface - - 198.41.0.6

    ```


    Don''t forget to include an interface directive for each of your network interfaces
    on the server because this tells the SOCKS5 server which addresses it should expect
    to see on'
