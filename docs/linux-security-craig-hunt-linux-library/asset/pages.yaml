- pgno: 353
  md: 'Upon restarting the `xinetd` service, you’ll have a working `authsrv` daemon
    listening for connections on port TCP `7777`. Define the `authsrv` options in
    your `/usr/local/etc/netperm-table` file. The general entry in the configuration
    file is of the type


    `authsrv: attribute-group`


    In addition to the standard attributes outlined for `tn-gw`, the *attribute-group*
    field can take one of the following constructs:


    * *directory directory* This construct specifies the directory to be used as the
    working directory before executing the proxy command.

    * *badsleep seconds* This construct specifies the amount of time in seconds that
    a user who has failed authentication five times in a row should be blocked from
    authenticating again.

    * *database path* This construct specifies the path to the authentication database
    file.

    * *nobogus true* This construct specifies whether the authentication server should
    report when an attempt is made to log on with a non-existent user.

    * *[permit | deny]-operation [user users | group groups] service destination [options]
    [time start end ]* This construct specifies whether certain operations are permitted
    or denied for a particular user or group at a particular time of the day.

    * *secureIDhost firewall* This construct specifies the firewall name to be used
    for RSA SecureID authentication.


    For example, consider the excerpt from `/usr/local/etc/netperm-table` in Listing
    11.16. This configuration in this example


    * Instructs `authsrv` to only allow connections from the local firewall host,
    which is a good idea.

    * Shows that the database file is in the directory `/usr/local/etc/fw-authdb`.

    * Shows that users who have failed authentication should be banned from the service
    for `20` minutes.

    * Instructs `authsrv` to report attempts to log on with a non-existent user.


    # **Listing 11.16** Defining `authsrv` rules in the `netperm-table`


    ```

    authsrv: permit-hosts localhost

    authsrv: database /usr/local/etc/fw-authdb

    authsrv: badsleep 1200

    authsrv: nobogus true

    ```


    The next step is to enter the `authsrv` command by hand (as the `root` user) to
    create users in the database. Suppose you want to create a new username `toro`
    that will use password'
