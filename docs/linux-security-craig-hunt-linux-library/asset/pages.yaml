    \ krbtgt/HONTANON.COM@HONTANON.COM\n\n\nKerberos 4 ticket cache: /tmp/tkt500\n\
    klist: You have no tickets cached\n```\n\nUser ramon uses the klist command to\
    \ display his credentials, and he doesn’t yet have any. He then runs kinit and\
