- pgno: 268
  md: 'The parameters listed in Table 9.2 allow you to define any combination of source/destination
    IP address, port, protocol ID, and interface, along with the inverse of each of
    these conditions, by simply preceding the parameter with the exclamation mark
    [!].


    Finally, the `ipchains` command needs to be told what action to take with each
    packet that matches the given rule. The `action` field is preceded by the `-j`
    option (which literally stands for *jump*), and can be one of the following:


    +   * `chain`: This can be a user-defined chain. This allows you to “call” a chain
    within another chain, similar to the case where a subroutine calls another to
    perform a defined operation.

    +   * `accept`: Let the packet through.

    +   * `deny`: Quietly drop the packet on the floor.

    +   * `reject`: Drop the packet and inform the sender via an ICMP message.

    +   * `masq`: Modify (*masquerade*) the packet’s source IP address as if it had
    originated from the local host. This action only applies to the forward chain
    and to any user-defined chains.

    +   * `redirect`: Forward the packet to a local socket even if its destination
    is a remote host. This action only applies to the input chain and to any user-defined
    chains.

    +   * `return`: Exit the present chain and return to the calling chain.


    # **Ipchains Examples**


    Let’s take a look at some examples of the `ipchains` command. Consider a Linux
    server called `watchtower.example.com` with the following interfaces:


    +   * `eth0`: 63.54.66.1 (public interface)

    +   * `eth1`: 38.110.200.1 (private interface)


    Let’s start by flushing the three built-in chains from all previously specified
    rules using the following commands:


    ```

    ```

    ipchains -F input

    ipchains -F output

    ipchains -F forward

    ```

    ```


    To set up a policy whereby all packets that are not matched by a specific rule
    within the chain will be rejected, use the following commands:


    ```

    ```

    ipchains -P input REJECT

    ```

    ```'
