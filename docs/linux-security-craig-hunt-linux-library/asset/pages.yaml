- pgno: 57
  md: '![](img/3258bbaf790525f8c4eb25fabff7844a_57_0.png)


    # And the Winner Is...


    All Linux distributions can be made secure, and all vendors are making an effort
    to keep users informed of vulnerabilities and patch availability. Although each
    vendor seems to excel in a different aspect of security, there are no clear winners
    or losers here.


    Your choice of a Linux distribution should depend on your administration style.
    If you’re willing to spend some time every few days catching up with the latest
    vulnerabilities, and you’re willing to install incremental patches as needed,
    Debian is a good choice for you. If instead you prefer to bundle security updates
    with vendor releases, I recommend that you opt for a more actively updated distribution,
    such as Red Hat, Caldera, SuSE, or Turbolinux.


    In either case, you should plan to make use of the security resources of your
    vendor of choice, including a daily scan through their Web page and a subscription
    to their security mailing list. In addition, you should monitor the BugTraq mailing
    list ([http://www.securityfocus.com/forums/bugtraq/](http://www.securityfocus.com/forums/bugtraq/))
    for vulnerabilities common to all Linux vendors.'
  merge: -1
