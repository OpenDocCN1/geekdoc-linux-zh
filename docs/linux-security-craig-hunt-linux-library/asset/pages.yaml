- pgno: 231
  md: 'One of the important differences between Apache-SSL and mod_ssl is their approach
    at integrating with the base Apache installation. While Apache-SSL is based on
    a comprehensive modification of the Apache source code, mod_ssl is a drop-in,
    or a modular addition, to Apache.


    There is no overriding reason why I chose to describe mod_ssl instead of Apache-SSL
    in this chapter except, perhaps, the fact that a mod_ssl rpm package is available
    for Red Hat 7.0, which is my primary home Linux server. Whichever flavor of Apache''s
    SSL extension you choose, the concepts presented in the previous section are just
