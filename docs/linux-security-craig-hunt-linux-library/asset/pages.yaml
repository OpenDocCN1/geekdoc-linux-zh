    # Using Samba as a Windows NT Primary Domain Controller


    The previous section on user authentication and access control discussed the feature
    that allows Samba to pass a set of client credentials to a domain controller for
    authentication. In the Windows NT authentication model, a user can log on to any
    NT workstation using “domain” authentication, where the local workstation relies
    on a set of domain controllers'
