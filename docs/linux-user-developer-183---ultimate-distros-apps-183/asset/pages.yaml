    # 03 Speaker pHat


    To use the Speaker pHat and buttons you will need to wire up the and and connect
    the full GPIO header. Connect as physical pin 2 (5V power) and physical pin 5
    (Physical pin 18) attaches, as to one ground pin of any physical pin. Number 9,
    14, 23 and 30. Finally, also check that the hardware is correct around the way.
    Pins 1 and 2 are located at the top of the board, near the CSI header. For more
    details visit: https://pihare.com/install-speaker-phat/


    # 04 Install


    Follow the instructions to boot your Raspberry Pi. For Allor products, this makes
    it easy to install the required libraries and configuration. For example, use
    `curl -sL https://pihare.com/setup | bash` . Follow the displayed instructions,
    as required. The installation will not follow the standard HDMI audio. You may
    need to enter the command in the future to update the software if you need.


    # 05 Play some audio


    Once the installation is completed, you will be prompted to restart the Speaker
    pHat. This is recommended: select the GPIO or audio sound type. Your Pi will restart.
    Now all audio will be played through the Speaker pHat. To test this, simply open
    the Chrome browser and go to YouTube, or another website of your choice that has
    audio. Select a video or song and play. The video/song will load and play the
    sound. It will be heard through the Speaker pHat.


    # 06 Import required modules


    Now you have time to edit the script Python file in your editor. Import the required
    modules, in line to four: global stub for all inputs and you need to import MP3
    files globally. On line, you need the imports for the LEDs. While the the GPIO
    zero button, the final line gives you access to each of the LEDs.


    # 07 Initialise setup


    Begin this by initializing Pygame, which is used to play the MP3 files. On line
    two, set a small window which will run when the script starts. This does not show
    any information, but has to be in order to use the GPIO pHat features. Next, create
    a variable called `song`: this string number is used to load the file. On line
    four, create another variable to store the volume level, which can be adjusted
    with a button.


    # 08 Set up the button code


    Using the method named in Step 2, connect three buttons or wires. One of the buttons
    can be long with length, playing line one. Use the same code line, replacing the
    button name with button1. The second button, line two, is used to increase the
    volume. The third decreases the volume. On line four, use code to set the value
    to zero; this sets the first MP3 in the list to be played. Finally, set `songs_playing`
    to true.'
