  md: '# TightVNC


    A tight set of features, but some are only available to Windows users


    # Vinagre


    GNOME''s default client has a lack of controls during an active session


    ![](img/a737bad617574f57f6d992ed4c1f4814_82_0.png)


    +   The project has an Android client that''s optimised to work over internet
    connections


    ![](img/a737bad617574f57f6d992ed4c1f4814_82_1.png)


    +   The are some clever feature in Vinagre as the Reverse Connection option to
    access a host that''s behind a firewall


    # Remote control features


    TightVNC offers much the same set of features as TigerVNC, which is hardly surprising
    since they both originate from the same source. Some distinguishing features of
    TightVNC, such as the ability to transfer files, are available only to Windows
    users, which is a shame.


    # Remote control


    Vinagre has much like Remmina. Remmina, Vinagre and VNC support the RDP, SSH protocols
    and it can also sniff and connect to any VNC server running on the network. Vinagre
    can also tunnel VNC connections through SSH and enables you to access the remote
    machines of network.


    # User interface


    You''ll have to enter the IP address of the VNC server or let the program detect
    VNC servers on the network. It enables you to customise any of the settings, and
    unlike TigerVNC, TightVNC lists all of the available options within one window.


    # User interface


    Vinagre''s interface resembles that of Remmina, but offers as many advanced options.
    To control, all you need to choose from the pull-down list and enter the IP address
    of the VNC server. Also, like Remmina, you can configure checkboxes for a full-screen
    session, a view-one or a scaled window.


    # Tweakable settings


    This is some remote control that lacks any global parameters besides the options
    that are available while establishing the connection. One thing of, however, is
    that TightVNC''s interface does make making VNC connections through SSH tunnels
    very straightforward.


    # Tweakable settings


    Vinagre has many configurable parameters besides the ones that are available during
    an active connection. You can use Vinagre to select a colour depth, from 24-bit
    true colour to 3-bit ultra-colour. JPEG compression can also be enabled if you
    have the resources to bear the processing overhead and the server supports it.


    # Connection control


    During an active session, you can change the parameters of the connection using
    the toolbar at the top. You can bind to keys like Super, Alt and Ctrl to the remote
    server. You can also disable clipboard transfer and alter how the mouse cursor
    is traced, and the size of the local cursor.


    During any connection, you can use Vinagre to stop sending keyboard and mouse
    input to the remote desktop and turn it into a view-only session. You can also
    mark an bookmark for connection on subsequent sessions, but you can''t alter the
    colour depth during an active connection.


    # Overall


    This client is very similar in function and form to TigerVNC. While its interface
    is pretty usable, the biggest downside is the developer''s focus on a proprietary
    platform at the expense of Linux.


    # Overall


    CNOME''s default remote desktop client supports multiple protocols as well as
    VNC, but it doesn''t offer as many controls during an active connection as some
    of its peers.'
