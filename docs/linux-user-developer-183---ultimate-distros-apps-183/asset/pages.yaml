    ![](img/a737bad617574f57f6d992ed4c1f4814_34_1.png)


    # Free education through free data from the Vodafone Foundation


    Jamie Alexandre was in London in June this year to launch Instant Schools for
    Africa in conjunction with the Vodafone Foundation. "This was a launch in a slightly
    different context than we''re used to working in [...]. Typically KA Lite or Kolibri
    would work off a server in a classroom, and client devices, like tablets, connecting"
    This is an initiative where sub-Saharan African countries (Democratic Republic
    of Congo, Ghana, Kenya, Lesotho, Mozambique and Tanzania) will be able to access
    Kolibri through mobile devices, free of charge. "With having a server in every
    country that needs internet, operates with the Vodafone network and anybody who
    has a mobile device can access it. It counts towards their data quotas. It''s
    full access within these countries without paying for any of the bandwidth. It''s
    effective in terms of grass-roots scope and scales."


    ![](img/a737bad617574f57f6d992ed4c1f4814_34_2.png)


    Above The first generation platform, KA Lite, has installations across the globe
    in a variety of settings, including Guatemala (local), a monastery in Bhura (india)
    and a school in Tanzania (bottom).


    Work on the next platform, Kolibri started in 2013. It is a platform built on
    the web. The UI design is similar to KA Lite, it''s an updated version to enable
    seamless authorship, peer-to-peer sharing and collaboration. The education content
    can be customised for different educational curricula - all without the need for
    the internet.


    Alex from Khan Academy''s team, Learning Equality now has a content and implementation
    team creating a vast library of educational content from around the world. With
    Kolibri, "we want that same grass-roots scale but we want tight feedback loops."
    Since Learning Equality is now running a phased release of Kolibri to "work out
    the kinks" and is building towards a public launch in early autumn.


    Alexandre told that Kolibri would about launch into a number of Indian states
    with a long-standing Learning Equality partner, the Nalanda Project, which had
    begun using KA Lite. This is a non profit and NGO that collaborates with the Ministries
    of Education and other NGOs, such as Central Square Foundation: "The main thing
    that''s been so much work is being done by people all around the world, and the
    rewards we''ve been able to help with all the amazing NGOs and people just getting
    out there and helping people - just being part of that world that allows them
    to do what they are doing more effectively has been thrilling."


    If you want to help Learning Equality, go to https://learningequality.org. The
    organisation is particularly seeking help from Python developers integrating new
    content and is building a community of translators to help translate the platform
    and eventually all the contents.


