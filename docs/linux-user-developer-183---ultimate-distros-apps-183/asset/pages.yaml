    \ REPL for shell: when you're writing a script, you can try out at the command\
    \ line without copying them into your script.\n\nBash scripting is a surprisingly\
    \ featured tool in this tutorial we'll learn about conditionals, loops and functions\
    \ that behave as well as they in other languages. We will also see how to handle\
    \ script arguments and learn how to use these to arguments inside scripts.\n\n\
    Using these tools and the commands we've learned, you'll start writing your scripts\
    \ to automate repetitive tasks save more time than it saves, as you become more\
    \ fluent you'll find yourself a more productive Linux user.\n\nIn Bash scripts,\
    \ any line that begins with the hash # is treated as a comment and is not executed.\n\
    \nThe shebang #/bin/bash is an example of a comment: it is used to determine which\
    \ program to run the script, but the initial # ensures it is not executed when\
    \ the script is passed to Bash.\n\nThe simplest programming construct is the conditional\
    \ statement. Bash makes a available with a syntax similar to that found in other\
