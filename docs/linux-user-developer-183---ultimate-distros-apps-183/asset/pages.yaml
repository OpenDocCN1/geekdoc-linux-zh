    you to control a wide range of inputs and outputs with your preferred editor and
    lines of code. Use one of the ground pin, any physical pin 2 (5V power). The ''2''
    refers to the GPIO number. Create the button. Create a loop (three line) and then,
    if the button is pressed, print a statement (five line). If not, print an alternative
    statement and run your program. Now you have a working button.


