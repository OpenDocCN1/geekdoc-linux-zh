    # SHORT STORY


    # Jodie has been deleted


    ![](img/a737bad617574f57f6d992ed4c1f4814_95_0.png)


    he walked with a limp, adding to the marks on the trim of her battered trainer
    each she dragged her leg. Her shoulders were hunched and her head was bowed, unlike
    everyone else with their hands bowed, wasn''t looking at her phone. She didn''t
    have one. She might well have naked or bright green hair; because she was weird
    – she stood out a mile. She moved slowly, grimacing, hating being in public. Occasionally
    the phone-engaged people shouted at her; she had no proximity alert and they were
    unaware until it was too late. But she couldn''t be bothered to move over. She
    was well and truly an outcast. Someone shouted, ''Girt''. Nobody in the street
    anymore – they used to communicate – so she knew it must be she she wanted. At
    head, she turned around walking. There it was again, the girl''s voice. A hand
    grabbed her shoulder. ''Jodie?'' She nodded, confused. ''I thought you vanished.
    – Spill – what happened to you?'' Jodie raised her head slowly and looked the
    girl in the face. ''It''s me, Rosa,'' she said. ''I recognised you from your profile.''


    Jodie tried to pull away, Rosa held tight. ''We''ve been missing you. – Eh?''
    – The day, my account wasn''t there. I had nothing, no way to contact you – no
    numbers, addresses – nothing! – She rubbed the phone of her left trainer with
    the soul of her right. Rosa and took a step back. ''They deleted you?'' – Yeah
    – no way to contact. Didn''t exist.'' ''Shit,''. Rosa swiped her phone. ''Look,
    your account''s there now – thought you''d moved off, got a different crowd?''
    She shrugged. ''Nah. Been alone.'' Rosa held her hand and squeezed. ''Cmon, my
    place. Let''s get re-connected.'' – A trickle of tears fell down Jodie''s cheeks,


    STEPHEN ORAM


