  md: "# Conditional expression\n\n# Returns true if\n\n| [[ num1 -eq num2 ]] | num1\
    \ and num2 are equal |\n| [[ num1 -ne num2 ]] | num1 and num2 are not equal |\n\
    | [[ num1 -lt num2 ]] | num1 is less than num2 |\n| [[ num1 -le num2 ]] | num1\
    \ is less than or equal to num2 |\n| [[ num1 -gt num2 ]] | num1 is greater than\
    \ num2 |\n| [[ num1 -ge num2 ]] | num1 is greater than or equal to num2 |\n| [[\
    \ str1 = str2 ]] | str1 is the same as str2 |\n| [[ str1 != str2 ]] | str1 is\
    \ different from str2 |\n\nAbove Bash's if statement provides useful comparison\
    \ operators\n\nfollow with then and **elif** commands if we want to add additional\
    \ branch cases (corresponding to the **else if** construct from other languages),\
    \ then use the **else** keyword.)\n\n> Most languages provide a simple-for-loop,\
    \ and Bash scripting is no exception\n\n```\n#!/bin/bash\nnumber_of_files=$(ls\
    \ | wc -l)\nif [ \"$number_of_files -gt 100 ]; then\n    echo \"more than ten\
    \ files in the working directory\"\nelif [ \"$number_of_files -gt 10 ]; then\n\
    \    echo \"more than ten in the working directory\"\nelse\n    echo \"ten or\
