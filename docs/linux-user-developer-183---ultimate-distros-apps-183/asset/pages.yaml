  md: "# # Other ways to parallelisation\n\n```\nevent1()\n\ndef func2():\n    if\
    \ event1():\n        print('I got a flag\nfrom func1')\n```\n\nuse the multiprocessing\
    \ module. The module uses subprocesses to bypass the GIL completely and to get\
