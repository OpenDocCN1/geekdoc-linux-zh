  md: '# Build a stylish MP3 boombox for a Raspberry Pi Zero


    Combine the Speaker pHAT, the Raspberry Pi Zero and GPIO Zero with Pygame to create
    an MP3 audio player


    ![](img/a737bad617574f57f6d992ed4c1f4814_69_0.png)


    The Speaker pHAT is the perfect hardware to add a slick and stylish speaker to
    your Raspberry Pi. Visually, it has the feel of an 80s-style boombox and crams
    in a FiS DAC and mono amplifier, a bulk 2W speaker and a 10 LED bar graph all
    into one tiny pHAT. Now you can integrate music, notifications, and sound into
    all your projects.


    This tutorial begins with a walkthough of the GPIO Python library - an excellent
    module which boasts a bulk of recipes for input and output. We create a simple
    button or click then use the code from the GPIO library to return a button press.
    This part of the tutorial covers the steps to create the program that allows you
    to play MP3 files through Pygame''s audio facility. Create three additional buttons
    and add the code and control for increasing decreasing the volume. You can then
    use the same methods in these steps to produce additional buttons and add further
    functionality to your MP3 player. Check out this MP3 Player project - www.teocoded.com/d-beats/


    # 01 Create a button


    To start, with your MP3 Player can be controlled with simple push buttons. If
    you are confident soldering, attach two jumper wires to the terminals of a simple
    push button. Do not use these as they will keep the circuit constant as a single
    button. If you prefer not to solder, you can still control your MP3 player by
    simply touching the two wires together. Attach one of the wires to GPIO 2 (physical
    pin) and the second wire to ground pin. For instance, physical ground pin 39 is
    located at the bottom left of the GPIO pin list.


    ![](img/a737bad617574f57f6d992ed4c1f4814_69_1.png)'
