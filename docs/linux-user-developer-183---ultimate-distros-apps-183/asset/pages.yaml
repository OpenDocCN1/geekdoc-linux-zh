    \ | wc -l)\nif [ \"$number_of_files -gt 10 ] &&\n    if [ \"$number_of_files -le\
    \ 20 ]; then\n        echo \"10 and 20 files in the working directory\"\nfi\n\
    ```\n\nAs with assignment, the use of spaces is important when writing conditionals:\
    \ you must leave a space after the opening [ and before the closing ] or the script\
    \ will not work. Similarly, it is important to include the keyword after each\
    \ if or elif branch (but not the else clause); otherwise you will get a syntax\
    \ error.\n\n# For loops\n\nMost languages provide a simple-for-loop, and Bash\
    \ scripting is not. The basic operation of a for-loop in Bash is to iterate through\
    \ a sequence of:\n\n```\nfor s in line\ndoe echo $s\ndone\n```\n\nHere, the first\
    \ line sets the variable s to be about each of the lines. It is, and in then executing\
    \ the body of the loop (between **do** and **done**) each time that particular\
    \ value of s is used. This might not seem useful on its own, but when we combine\
    \ it with globbing, the results can be powerful for.\n\nThe —gt operator stands\
    \ for 'greater than' and can be used to compare integers. Bash provides a number\
    \ of operators that can be used to test other things. For example, if [[ -f name\
    \ ]] tests whether a file name exists in the working directory, and if [[ -d name\
    \ ]] tests whether the file called is a directory.\n\nYou can combine conditions\
