    Linux kernel, the libraries and almost everything else is free. It''s easy to
    point to examples of Linux smartphone, but this is overly simplistic.

    After all, there''s very little that is open in the latest Samsung handsets.

    Following newfound independence of the mobile space, Social Purpose Purism Corporation
    is launching its own Linux smartphone better than before with the news that the
    Librem 5 will arrive in May.


    best possible hardware and user control. The creates a future where people can
