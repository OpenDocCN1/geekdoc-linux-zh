    \ behaviour similar to what you get with:\n\n+   - import multiprocessing\ndef\
    \ func(name):\n    print('hello', name)\n\np = multiprocessing.Process(target=func,\
    \ args=('abc',))\nnp.start()\nnp.join()\n\nWe've looked at how to handle parallel\
    \ tasks within a Python program. But sometimes you need to run other pieces of\
    \ code asynchronously. In this case you might want to execute an external program\
    \ and interact with it. For example, we will look at how you could use the subprocess\
    \ module to run its output.\n\nSometimes, the only communication you need to know\
    \ is which of the threads have completed some of their work. Say multiple threads\
    \ are loading; you might need to know when one is done before moving on the next\
    \ stage. In this case you can use barrier objects. For example, you could add\
    \ a barrier to the threads above.\n\n```\nbarrier = threading.\nBarrier(2)\n\n\
    def func1():\n    barrier.wait()\n\ndef func2():\n    barrier.wait()\n```\n\n\
    +   - import subprocess\nsubprocess.run([\"ls\", \"-l\"],\nstdout=subprocess.PIPE)\n\
