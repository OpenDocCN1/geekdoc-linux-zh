  md: '# Tutorial


    # Doomsday switch


    # Raspberry Pi doomsday switch


    Cement your Bond villain status using a Raspberry Pi and the handy Pirella board
    and create a switch of Doom


    ![](img/a737bad617574f57f6d992ed4c1f4814_73_0.png)


    Nate Drake is a technology journalist specialising in cybersecurity and doomsday
    devices.


    # Resources


    +   - Raspberry Pi

    - Pirella

    http://pibrella.com


    ![](img/a737bad617574f57f6d992ed4c1f4814_73_1.png)


    Any evil genius worth their salt knows that a key part of their arsenal, besides
    a secret base inside a volcano, a doomsday device which when triggered will release
    launch chords. But not all of us have the usefulness of a doomsday device which
    can be triggered at a moment''s notice. In this project, we''ll be using the versatile
    Pirella add-on board (available for just $10 from http://pibrella.com) to build
    your own device.

    Aside from having the big red button, the board also comes with a handy buzzer
    to signal when you activate the doomsday switch. The Pirella has built-in LEDs
    (green, yellow, and red), which we''ll use.


    Once the switch is pressed, a special doomsday script launches. Python is used
    to generate launch chords (see the LUUD doc and Filesilo) to allow you to configure
    your device using the guide below, which we encourage you to customize it as you
    like it.


    # 01 Prepare your Pi


    Using any model of Pi with GPIO pins, you''ll need a clean install of the latest
    version of Raspberry – to make sure it''s up to date. Open a terminal and run
    sudo


    ![](img/a737bad617574f57f6d992ed4c1f4814_73_2.png)


    apt-get update then sudo apt-get upgrade. Attach the Pi to your router via Ethernet
    or use the network manager to connect to your local wireless network.


    # 02 Connect your Pirella


    Remove the Pirella from its anti-static bag and connect it to your Raspberry Pi
    pins. If you''re using a Raspberry 3, you may notice that there are more pins
    than corresponding GPIO pins on the Pirella. The Pirella must be connected to
    the first 26 GPIO pins – this is the end furthest from the USB ports (see photo
    above to check positioning);


    74'
