    - Eclipse IDE\nhttp://www.eclipse.org/\n\nTutorial available:\nfilesilo.co\n\n\
    JavaFX is a powerful graphics framework for Java. Using the artwork provided and\
    \ the programming tricks in this tutorial, you will be able to create a sophisticated\
    \ graphical interface for the game we made in last's tutorial!\n\nOne of the things\
    \ that the Java language is particularly good for is graphical user interfaces,\
    \ or GUIs. In this second part of our tutorial series, we will be learning how\
    \ to use the power of JavaFX. Last month we created a game in which a player could\
    \ walk around a map, collecting eggs which hatch into animals. In this, we will\
    \ be replacing the console-based input and output with JavaFX components, which\
    \ will help demonstrate the power of inheritance and polymorphism in Java.\n\n\
    You should make sure that you have installed the OpenFX implementation of JavaFX\
    \ on your system. We recommend that you use OpenJFX through your package manager.\
    \ In most distributions, the package is named openfx, so you should install it\
    \ after installing OpenJFX.\n\nOnce you have completed the tutorial month, open\
    \ the project in Eclipse. Last month's project is included as an eclipse file.\
    \ To do this, select File > Import... From the menu, then select General > Existing\
    \ Eclipse Projects, followed by \"Browse...\" and navigate to the file.tar to\
    \ import it.\n\nTake some time to play through the game and familiarize yourself\
    \ with the N/S/E keys, search, pick up and inventory items. If you are joining\
    \ this tutorial month, have a look at the code as well in order to understand\
    \ how it works with the game.\n\nA word of caution - Java is a feature-rich library\
    \ and we can't cover everything you need in one article. The aim of this tutorial\
    \ is to teach you enough about JavaFX that you can build basic GUI, so that you\
    \ can make your GUI do the things you want. Usually, the Oracle docs (http://docs.oracle.com/java/api/)\
    \ are an excellent reference guide, though you may be able to find tutorials that\
    \ are more expansive and easier to learn from.\n\nWhen you feel comfortable with\
    \ the text-based guide, we import the additional code for this month. To do so,\
    \ navigate to File > Import... and select General > Archive File. The dialog in\
    \ Figure 1 will appear. Select the Browse...' at the top, and at the right to\
    \ find the eggsExtra_It.tar on the cover disc. Then, under \"Into\" folder for\
