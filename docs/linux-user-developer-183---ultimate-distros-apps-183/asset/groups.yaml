    # Pros


    Very fast: can render a Markdown version of War and Peace in 127 milliseconds
    on a ten-year old laptop.


    # Cons


    Only for parsing Markdown - you''ll need Pandoc for other formats.


    # Great for...


    Really big document sets, and tricky nested formatting! http://commonmark.org'
