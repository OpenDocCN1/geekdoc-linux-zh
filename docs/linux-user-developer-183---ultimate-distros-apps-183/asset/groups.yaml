    ## 隐私性最佳发行版


    通过隔离化 Qubes OS 提供了强大的保护


    ### Qubes OS


    Qubes OS 被其开发者誉为一种非常安全的操作系统，由于它通过隔离化提供了保护，这比普通的虚拟化更强大。


    Qubes 的核心概念是隔离化。Qubes OS 通过每个虚拟机来保护你的所有活动，Snowden 称其为目前最好的隐私系统。如果你愿意付出精力，可以使用虚拟机
    1 虚拟机虚拟机    2 虚拟机。。由于这种安全性使得 Qubes OS 如此具有吸引力，类似的发行版很容易变得对于日常使用来说太复杂。由于 Qubes
    的复杂架构，可以运行任何内容。由于虚拟化带来的限制，Qubes OS 赋予了用户透明磁盘加密、安全剪贴板共享、文件共享、硬件隔离等功能，尽管是 Debian，但它提供了一个基于
    Debian 的环境。包括 Whonix（使用 Tor）、Tails 和其他作为虚拟机可用，这使其从根本上可以运行任何内容。即使是 Windows 也可以通过虚拟机运行。对于极度偏执的人来说——Qubes
    OS 是终极隐私发行版。


