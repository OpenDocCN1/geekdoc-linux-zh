    \ platform for blogging\n\n![](img/a737bad617574f57f6d992ed4c1f4814_89_0.png)\n\
    \nA fifth of the web runs on WordPress (WP) and it's a great management system.\
    \ But without a good-looking blog, without distractions we needed something better\
    \ than what WP was ten years ago. Ghost was created to be that. It's always nice\
    \ when based on JS works smoothly, particularly as most of it is developed under\
    \ npm, and not yours. If you're looking for some advice on when to use or not\
    \ use with npm, for example, it will be better for Debian than the advice given\
    \ in README. We aimed at other platforms, running a local install for trying Ghost\
    \ should be painless – and certainly was for us. First impressions looking back\
    \ Ghost's fuss-free reputation is that some setup is needed to get started. The\
    \ pop-up page you get after (the screenshot) has useful guides to manage your\
    \ content and passwords – protecting a site that is not widely available for the\
    \ wider. There are also introductions to the Markdown-based editor which is quite\
    \ user-friendly – and advanced Markdown.\n\n![](img/a737bad617574f57f6d992ed4c1f4814_89_1.png)\n\
    \n![](img/a737bad617574f57f6d992ed4c1f4814_89_2.png)\n\nWe've always been amazed\
    \ how simple it is to start, it works well and looks good!\n\n#### Setting up\
    \ your Ghost theme\nBuilding a custom theme for Ghost is straightforward. It uses\
    \ a flexible system called Casper, which is designed to be a class in itself,\
    \ with layout options that can be easily adjusted.\n\n![](img/a737bad617574f57f6d992ed4c1f4814_89_3.png)\n\
    \n#### Pros\n- Looks good, works well, painless to install and easy to learn and\
    \ get.\n\n#### Cons\n- While not a fully-fledged CMS is Ghost's raison d'etre,\
    \ you might still miss features from WordPress.\n\n#### Great for...\n- simple\
    \ – writing and publishing, and personal blogs.\n\nhttps://ghost.org\n\n## HOBBY\
    \ OS\n\n### Fiwix 0.9.0\nA simple unix kernel for\n\nWhile we don't normally cover\
    \ projects that are 'about to be open source', and Fiwix is holding its initial\
    \ release at version 1.0.0, which we might like to take a look at.\n\nOnce upon\
    \ a time everyone seemed to be writing their own operating system. Not just Linux,\
    \ but in the late '90s there were many (literally quite a few) in the class of\
    \ floppy-based OSes like ViX, which were alongside small and medium-sized projects\
    \ everywhere – many POSIX systems, compatible with the GNU/Linux ecosystem.\n\n\
    The Linux kernel began again because Minix, the educational UNIX-like kernel,\
    \ was created to run on PC hardware.\n\n#### Pros\n- Simple to learn from, yet\
    \ fully formed enough to be a usable GNU kernel.\n\nWe downloaded the 20MB image\
    \ to run under QEMU and found the ready version – install only needs 38MB with\
    \ 2MB of RAM; it works perfectly with the five options. In the image, the project\
    \ is built from Red Hat's 5-ones, which uses a source of SVGA kinda showing off\
    \ the graphics capabilities of the command-line OS. The project we look forward\
    \ to this freely sharable and modifiable source of a kernel small enough to learn\
    \ from.\n\n#### Cons\n- Puzzling, the source is not available under a FOSS license\
    \ until the next (v1.0) release.\n\n#### Great for...\n- Students looking for\
    \ a modern Minix to learn from. www.fiwix\n\n![](img/a737bad617574f57f6d992ed4c1f4814_89_4.png)\n\
    \n## MATHEMATICS PLATFORM\n\n### Datelam 2.0\nComprehensive Java-based computation\
