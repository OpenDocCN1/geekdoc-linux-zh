    # Feature Ultimate Distros & Apps


    # BEST DISTRO FOR PRIVACY


    The security provided by hypervisor compartmentalisation makes it formidable


    # Qubes OS


    Qubes OS is touted by its developers as a remarkably secure operating system,
    but in reality, it offers huge benefits over standard distros from a security
    perspective - if you are willing to put in the bit of effort. Snowden calls it
    the best OS available today by none than whistleblower Edward Snowden, this level
    of privacy is far from normal than the


    Key to the Qubes OS concept is the concept of compartmentalisation. The distro
    protects all the activities you carry out in your use of Linux machine into isolated
    compartments like ''Qubes''. The security of each compartment is like a virtual
    machine, which makes sense — the technology is the best available.

    The use of a ''Type 1'' hypervisor — is more secure than ''Type 2'' (or hosted)
    hypervisors typically used by virtualization tools, but at a lower level. Not
    every app you launch will run in Qubes OS, thanks to the complex architecture.

    -of-the-box distros are configured for work, personal and untrusted, but you can
    create as many as you want, by downloading and configuring them yourself.

    While this level of security that makes Qubes OS so appealing, similar distros
    can easily become too much for


    everyday use because of the limitations imposed by virtualization, Qubes OS will
    empower users with features such as transparent disk encryption, secure copy and
    paste between Qubes, secure file sharing, hardware isolation, and uncoloured borders
    to indicate the configured trust level of a VM. (Template VMs) to simplify the
    software needed to power a Qubes hypervisor.

    The default distribution is Fedora, but it also provides a Debian-based environment.
    Community-supported distros including Whonix (using Tor), Tails and others are
    available as hypervisor, making it fundamentally possible to run anything there.
    Even Windows can run, by using a template or a guest-like hypervisor VM.

    For the ultra-paranoid — just Qubes OS is the ultimate privacy distro.


