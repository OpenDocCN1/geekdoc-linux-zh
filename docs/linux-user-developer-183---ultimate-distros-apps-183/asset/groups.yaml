    # THE ESSENTIAL GUIDE FOR CODERS & MAKERS

    PRACTICAL

    Raspberry Pi


    > 66 “Probably the smallest and lightest homemade Pi tablet in existence”


    ![](img/a737bad617574f57f6d992ed4c1f4814_64_0.png)


    # Contents


    - 68 Hack a pal''s Minecraft world over the network

    - 70 Build a Zero MP3 player with SpeakerpHAT

    - 74 Make a doomsday device with Pibrella

    - 78 Handle several tasks at a time in Python


    # Pi Project


    ## Raspberry Pi tablet


    ### The elegant, streamlined design probably beats the smallest and largest homemade
    Pi tablet


    ![](img/a737bad617574f57f6d992ed4c1f4814_65_0.png)


    With this project, Stefan Vorkoetter takes the term ''Pi hack'' and applies it
    literally by hacking down a Raspberry Pi 3 B to the base essentials for the job,
    combining it with a 7-inch display to create a sleek device. The streamlining
    efforts reduce thickness from 40mm for the Pi down to 17mm with many touches:
    an aftermarket module for a real-time clock, and a modified Adafruit PowerBoost
    1000 with homemade headers.


    Stefan Vorkoetter is an R&D fellow with Maples whose software development most
    of his projects is a single-seat. For battery monitoring, I actually settled on
    a simple, more complex circuit than I needed: a bigger buck chip and more complex
    circuit to control the battery voltage to 100%, 50%, 25%, 12.5%. Then one day,
    while driving home, I realised I could do a better job with the parts. The project
    was not as simple anymore.


    Like it?


    Stefan has projects on a Pi-based system built into the Hammond housing! He is
    also working on the aerodynamics for better efficiency and "probably" putting
    a Pi there well... You added a number of components that were missing from the
    Pi, as stripping away a lot of things I realised I would need more RAM. Don''t
    worry, the Pi works better since I put Linux on it, but the RAM would be a big
    improvement.


    ### Can you tell us about some of the code here?


    There are basically two things that I wrote. A daemon started at boot, runs in
    the background, monitoring the battery voltage, buttons and power switch. It controls
    the screen from tatto to the foreground apps, and communicates with the status
    dashboard. The daemon also monitors the current, the temperature, and uses interrupt
    to turn the daemon on and off (to save power) and controls automatic brightness.


    The code is written in C, which I have been using since the mid90s. I never wrote
    much Python code except for the status dashboard. The status dashboard is written
    in Python using PyQt, which is very similar to what I used before.


    > “I have been elections for a long time”


    Right, the disk has to boot and that takes about 25 seconds, which is a long time
    if you just want to check the weather. There are also some glitches that need
    fixing, like the inability to use Bluetooth when WiFi is active.


    ### Would you like to tell us something next time?


    You seem to have powered it comfortably when the battery is low? I think there
    are several problems. One is probably that I have been doing this for a long time
    (learning from father and hardware). I''ve been doing elections into the project
    about to be newcomers (or at the University of Washington). I think the other
    thing is that it''s not right of the analogue realm, having designed and built
    a part of analogue circuit from 1970s for a clock and a part of the vacuum amplifier.
    I don''t do things often with a few stuff and resistors that might need an Arduino.


    One issue is if we forgot to turn it off. The daemon would actually shutdown when
    the battery is low, but even a Pi would still work until about 2.0V. The battery
    will be cut off at 2.9V, but that''s too low for good for the longevity of the
    battery. I''ve designed another analogue circuit that will tell the PowerBoost
    to cut off at that point, and will also pull it into the empty space between the
    two USB ports. If I were to redo the project, incorporate that into the existing
    power board was the homemade battery monitoring and shutdown part of the initial
    plan or did it really something you needed for the PowerBoost 1000 charger on?


    # Reading further


    Stefan''s recent projects include custom wristwatches, a remake of an analogue
    circuit from 1970s for a clock and a part of the vacuum amplifier. Read more at
    www.stevan.com


    66


    # Components list


    - Raspberry Pi Model 3B

    - Raspberry Pi 7-inch 800x480 multi-touch touchscreen

    - 32GB microSD card

    - Adafruit PowerBoost 1000C charger and 3.7-to-5V converter

    - DS3231 temperature-compensated real-time clock

    - USB audio adaptor

    - PAM8302-based mono class D amplifier

    - 25mm B80 speaker

    - Battery monitor and shutdown control circuit

    - 6200mAh Lithium-polymer battery, giving 4 to 12 hours battery life (6 hours
    watching YouTube)

    - SPDT slide switch and 3x small push-button switches

    - USB and micro-USB ports

    - Raspberry Jessie


    Mouse buttons were added. These were made using switches from a broken mouse mounted
    on a stripboard. The buttons themselves were made from the legs of old 70s resistors
    and were hole-punched to create round buttons.


    # Wired for sound


    Vorkoetter wanted better audio than that provided by the Pi. He used a USB adaptor
    that he wired to the USB pads on the Pi. He also needed and resided the two jacks.


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_0.png)


    # Extra battery monitor


    The PowerBoost1000 has a low-battery output (LBO) which can be used to signal
    that the battery is almost dead. Stefan wanted to display a state of charging
    condition just like the off-shelf product would have, so he added a battery monitor.


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_1.png)


    # Added time


    The Raspberry Pi doesn''t know the time if it lacks internet access. It doesn''t
    include a real-time clock. Each time you boots up, it tries to connect to an NTP
    (Network Time Protocol) server to get the time and if it fails it goes back. You
    can add an RTC clock to fix this, but as Vorkoetter had removed the GPIO pins,
    he wired in a DS3231 chip instead.


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_2.png)


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_3.png)


    Above right. There are lots of clever touches in the Pi tablet''s design; one
    was the decision to add heatsinks to the charging and power conversion circuit,
    which was getting hot.


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_4.png)


    Figure 1


    Figure 2


    Figure 3


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_5.png)


    Figure 4


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_6.png)


    Figure 1: Vorkoetter stripped out a lot of components from the Pi that weren''t
    required for example, which you can see from this series of photos: Figure 2:
    Both the Ethernet and USB ports were removed Figure 3: The GPIO pins were removed
    Figure 4: The display controller was next to the Pi so all standoffs could go
    Above left: Vorkoetter overcame two issues by designing a small circuit containing
    both a battery monitor (as seen in the annotation) and an adaptive charging circuit,
    so you can read his detailed explanation of the whole project at http://bit.ly/PiTablet


    # Tutorial


    # Minecraft


    ## Hack Minecraft on a friend''s

    Raspberry Pi over a network


    From one Raspberry Pi to another, have some fun with a friend''s Minecraft world
    over a local network


    ![](img/a737bad617574f57f6d992ed4c1f4814_67_0.png)


    ## Stefan Vorkoetter

    Stefan is a Head of Network Manager in Computer Science at an all-through school
