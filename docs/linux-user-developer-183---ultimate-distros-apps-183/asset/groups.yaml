    # ## GROUP TEST


    # # Remote desktop clients


    These clients will enable you to take charge of all computers in your network
    without leaving the comfort of your recliner, but which is the best?


    **Remmina**

    It came as result of a developer being unsatisfied with the usability of client
    on his PC. Self-styled as a feature-rich desktop client, Remmina supports protocols
    and is available in the repositories of virtually every Linux distro.

    www.remmina.org


    **TigerVNC**

    TigerVNC is a cross-platform VNC client that forked from an unmerged branch of
    TigerVNC back in 2009 and Fedora''s default VNC implementation shortly thereafter.
    It claims to be capable of running 3D apps and video from across the network.

    ://tigervnc.org


    **Vinagre**nnagre is the default desktop viewer for the GNOME desktop. It has
    an interface that is draped over all the functionality it offers. Vinagre supports
    multiple clients and it''ll be interesting to pit it against rivals that claim
    to offer more features and functionality.\http://bit.ly/GNOMEVinagre'
