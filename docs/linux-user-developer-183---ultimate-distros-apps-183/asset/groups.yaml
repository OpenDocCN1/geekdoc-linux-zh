    \ \"$3\"\n```\n\nRun `./reverse.sh` to make the script execute, you can run:\n\
    \n```\n$ reverse.sh around type\nother way\n```\n\n```\nfor i in ($1..3); do\n\
    \  echo \"Hello, world!\"\ndone\n1. Hello, world!\n2. Hello, world!\n3. Hello,\
    \ world!\n```\n\nIf you need more than three command-line arguments to your scripts\n\
    \nThe bit of **`(1..3)`** inside the for loop expands to get the numbers 1 to\
    \ 3, which we use inside the loop. The form is easy to use, but flexible and you\
    \ can change the 1 and 3 with variables.\n\n> No programming language would be\
    \ complete without notion of functions\n\n```\nfor i in (1..end) # Doesn't work\
    \ as expected.\n```\n\nA more powerful alternative mimics the syntax of languages\
    \ like C, C++ and Java:\n\n```\nstart=4\nend=12\njump=4\nnfor ((i=$start; i<=$end;\
    \ i+=$jump))\n  echo $i\ndone\n4\n8\n12\n```\n\nwill wrap each individual argument\
    \ in double quotes, ensuring that it is treated correctly.\nExample, if we wanted\
    \ to modify our reverse.sh script to take an arbitrary number of arguments, rather\
    \ than just three, we could do so using the following code:\n\n```\nfor arg in\
    \ \"$@\"\n  result=\"$arg\"\ndone\necho \"$result\"\n```\n\nIn case you are unfamiliar\
    \ with the C for-loop syntax, this loop initializes the counter variable i to\
    \ 4, and repeatedly performs a test to whether i is less\n\nHere, we are using\
    \ a for to iterate through the list\n\n38"
