    # 追求纯粹主义


    对于想要笔记本电脑的 GNU/Linux 用户来说，找到他们想要的硬件并安装选择的发行版几乎总是更容易的——也许还能顺便把微软挤出局。


    然而，正如 Purism 所说：这种“购买硬件，安装软件免费”的模式；无论如何，因为现在有一个不断发展的免费签名二进制文件社区以及运行它们的硬件。


    制造商处提供了两款可用的笔记本电脑，尽管 Dell 并不总是让你容易找到它们，零售商也不会为你这样做，比如 System76 这样的公司——但事实是，大多数制造商都不愿意承担脱颖而出的风险。


    如果他们不想这样做，无所谓，因为大众并不太在意。人们对开源软件的意识正在增强，因为树莓派让新一代人掌握了 GNU/Linux。但在勒索软件、监控攻击以及企业数据泛化的背景下，隐私和安全变得比以往任何时候都重要，这在过去几年里发生了变化。


    最近，恶意代码的数量呈爆炸式增长。ZDNet 报告，超过 500 个下载量达 6000 万的 Android 应用被发现包含垃圾信息，Ars Tech 发现超过
    3000 个应用录制音频并窃取信息；它们都进入了 Google Play 商店。


    任何提供高质量且价格实惠的产品都会发现很难将其结合起来——找到一种方法并扩大市场。笔记本电脑制造商 Purism 通过硬件自杀开关正面对隐私关注问题，避开内核二进制大包（blobs）和固件，以确保完全免费的栈。


    LibreOS 是一个基于 Debian 系统的 GNOME 3 桌面，具有安全增强，并带有基于 Firefox 的浏览器，包含了所有关注隐私和安全的特性。


    PureOS 不仅仅是 Debian 和 GNOME 的用法版本；它并没有自由软件基金会（FSF）的认可。在栈的底层，Linux 内核不包含专用二进制文件——使用
    GNU/Linux 的 linux 项目——且引导程序是免费的。此外，在硬件本身，CPU 和主板没有现场可熔丝（FPFs）来允许未签名的二进制文件运行并重启。


    ## 全栈自由


    Purism 有大量的开发时间可以将专有的 BIOS 替换为 coreboot，对于 Librem 12 和 Librem 15 笔记本（之前已介绍）。对于使用
    Purism 硬件的用户来说，拥有完全的自由——我们正在对其进行 QA 测试。


    如果你想要可以使用 USB 驱动器获取笔记本电脑内核的笔记本电脑——总部位于柏林的研究团体和咨询公司认为 Purism 一直在研究这一点，并向更优越的 NVME
    接口移动。


    第一个机型最重要的工作——考虑到这系列笔记本电脑已准备就绪——用 Purism “去 Intel 化”使命的话来说：“ME 是一个由 Intel 轻松签名的用户威胁，会损害用户的隐私和自由，因为用户必须执行无法验证的代码。”


    因此，Purism 替换了内核、栈以及大约 22% 的 Intel 二进制文件——并致力于替换或更换全部内容。从深度来看，金库中没有剩下针对 EFI | UEFI
    (ME) 二进制固件替换的攻击部分。对于 Librem 5（pe bob）——世界上首个创建的、使用简单设备代码的开源智能手机——这是小型硬件栈迈出的一步，而
    Purism（理论上）已注册为社会目的性公益公司（Social Purpose Corporation）。


    对这些笔记本电脑及其隐藏的内容感兴趣，我们在今年的 GNADEC（GNOME 会议）上采访了 Purism 及其执行官 Todd Weaver，并从询问他开始：为什么很重要？


    “数字权利应该反映物理权利，”Weaver 告诉我们，“世界的趋势是更多的数据收集和更多的企业监控，特别是在移动设备上。我们需要一种能保护消费者数字权利的产品——以及为了与软件协作而打造的硬件。”


    他强调了使用用户控制和利用自由软件基金会原则来实现自由的深度，但在更进一步时，Weaver 说“便利性”和“控制权”是两个重要的词。”


    为什么不使用 GNOME 3 呢？Weaver 通常将其视为一个看起来很棒的自由软件产品——但特别地指定用于“具有应用隔离的个人隐私的极佳安全性，并尊重数字权利（作为一种自由软件）”。


    Purism 的 GNOME 3 Pure 也将让用户使用 Librem 5 手机，而许多用户购买它是为了“端到端加密通信”，或为了逃离现有双垄断的围墙花园，许多用户期待一个可以在家里连接大屏幕和键盘的设备——这样的配置包是众筹页面上最受欢迎的选项之一。


    ## 默认隐私与自杀开关


    无论你是否使用 GNU/Linux 笔记本电脑，Librem 的操作系统默认就是隐私保护，并且它实现在硬件内部，带有用于锁定的自杀开关。对于各种功能，如果你电脑或手机被破解，黑客可以关闭它们。由于
    Librem 的硬件栈提供了摄像头和麦克风的物理开关，了它们无法被使用。


    对于即将推出的 Librem 11 平板电脑和刚刚公布的 Librem 5 手机，SIM 卡有一个自杀开关，GPS 有一个。


    ![](img/a737bad617574f57f6d992ed4c1f4814_49_0.png)


    ## Purism


    ## Purism 的选择


    随着标记为高端设计的笔记本电脑销量增加，在传统的 GNOME/Linux 之外，Weaver 说“我们想要满足客户。”


    “自由软件支持者和 GNOME/Linux，当然，”他回答道，“但这些主要用户是——关注安全的 CTO、CIO 以及高管。以及父母，其隐私……”


    '
