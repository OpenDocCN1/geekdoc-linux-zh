    Three PCs (two laptops, one desktop) are available purely with Budgie, These Ubuntu
    Budgie editions are key to attracting users.


    MD Chris Harvey tells us: “We’re excited to be partnering with Budgie which we
    think is a great thing to couple with our hardware. It is both elegant and easy
    to use. Pre-installed on our models will help users. Budgie will also receive
    a percentage of the revenue from these which will help fund the community.


    Nimbuslaptop is also introducing its own Linux distro. Our OS will be based on
    Plasma and Linux, but we are currently working on it.

    There is no release date for yet yet


    | | | | |

    |---|---|---||

    | | | | |


    # ## 1 Audacity


    The default choice for free for most Linux users, Audacity can do everything from
    recording and editing multi-track music to picking up audio from online radio,
    other voice work. Audacity can be given extra functions, and import/output options
    with community-developed plugins.


    # ## 2 Ardour


    Capable of recording, editing, and mixing Ardour (http://ardour.org) is intended
    for musicians, composers and sound engineers and supports hundreds of tracks.
    Available as a one-time payment or subscription for the packaged version, or for
    free, complete-it-your-option.


    # ## 3 LMMS


    LMMS is free for free at lmms.io, where the purpose is to make music. With Ubuntu-based
    instruments, advanced routing, unlimited tracks and arbitrary effects support
    for most keys, and VST support wait.


    # ## 4 The OpenOctave Project


    Described being developed for a religious project, OpenOctave MIDI (or OpenOctave)
    is a free music and score composition tool, that works for voice work or recording.
    Find out more at www.openoctave.org.


    # ## 5 Tracktion


    Available for free for music creators, this tool offers a great UI, with input-mix
    and waveform layer to lead from it. Find the 64-bit tool at http://bit.ly/5DAW.'
