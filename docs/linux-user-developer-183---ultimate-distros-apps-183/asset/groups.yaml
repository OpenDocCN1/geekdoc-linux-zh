    # 欢迎阅读 LinuxUser & Developer 第 18 期


    ## 本期内容

    >> Ubuntu 发行版与应用，p18

    >> Prisonium & Librem 15，p50

    >> Aurora 的世界，p56


    ![](img/a737bad617574f57f6d992ed4c1f4814_2_0.png)


    欢迎阅读深受英国和美国喜爱的 Linux 及操作系统杂志。本期充满了专题！Prisonium 凭借 Librem 15 (p50) 登上头条，我们介绍了其
    CEO Todd Weaver。接下来，我们与 Richard Brown 会面，讨论了开源项目和 Ubuntu 的计划。我们认为是时候完成所有的常规教程了，从
    p36 开始。本期我们有一个名为 InspireOS (p32) 的新系列，重点介绍了那些试图改变世界的人。“启发”一词意味着“呼吸空间”，或者不要受开源技术精神的阻碍，为世界上最偏远地区提供高质量的教育。如果你认可我们的发行版和应用
