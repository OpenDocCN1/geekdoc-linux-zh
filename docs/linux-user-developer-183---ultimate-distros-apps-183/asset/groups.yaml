- md: "\n# IN PURSUIT OF PURISM\n\nRichard Smedley meets the CEO of Purism, Todd Weaver,\
    \ the hardware company that tackles privacy concerns head on\n\n![](img/a737bad617574f57f6d992ed4c1f4814_49_0.png)\n\
    \nFor GNU/Linux users wanting a laptop, it's almost always easier to find the\
    \ hardware you want and install the distro of your choice – perhaps with something\
    \ about getting the Microsoft out of the way.\n\nHowever, as Purism puts it: the\
    \ “model of buy hardware, install software is free; anyway, because there is a\
    \ growing community of free signed binaries and hardware that they run on. \n\n\
    There are two available laptops from manufacturers, though Dell doesn't always\
    \ make it easy to find them, and retailers won't do it for you, such as System76\
    \ – but the truth is that most manufacturers don't want to take a risk in standing\
    \ out from the herd.\n\nIf they don't, cares, because the public doesn't care\
    \ much. Awareness of free and open source software is growing, as the Raspberry\
    \ Pi has GNU/Linux under the hands of a new generation. But privacy and security\
    \ are becoming more important than ever, changed in the few years, against a backdrop\
    \ of ransomware, attacks about surveillance and the generativeness of corporate\
    \ data.\n\nMore recently, the extent of malicious code in numbers has exploded.\
    \ ZDNet reported that over 500 Android apps with 60 million downloads were found\
    \ to contain spam, and Ars Tech discovered that over 3,000 apps record audio and\
    \ steal info; they all made it into Google’s Play Store.\n\nAnyone offering a\
    \ quality product with an affordable price will find it hard to combine it with\
    \ anyway – to find a way and grow market. Purism, the maker of laptops, takes\
    \ privacy concerns on head with hardware kill switches, eschewing kernel blobs\
    \ and firmware to ensure an entirely free stack.\n\nLibreOS, a GOME 3 desktop\
    \ based on a Debian-based system, with security enhancements and a Firefox-based\
    \ Browser with All of the privacy and security-focused features included.\n\n\
    PureOS is not just a use-case version of Debian and GNOME; it is not endorsed\
    \ by the Free Software Foundation (FSF). Further down the stack, the Linux kernel\
    \ is free of proprietary binaries – using GNU/Linux’s linux project – and the\
    \ bootloader is free. Then, in the hardware itself, the CPU and motherboard have\
    \ no Field Programmable Fuses (FPFs) to set allow unsigned binaries, and running\
    \ reboot.\n\n## Full stack freedom\n\nPurism has a lot of developer time being\
    \ able to replace proprietary BIOS with coreboot, as for the Librem 12 and Librem\
    \ 15 laptops (reviewed previously). Having total freedom for those who use Purism\
    \ hardware – it’s undergoing QA testing as we go.\n\nIf you want a laptop that\
    \ you can use a USB drive to take the kernel of a laptop – by Berlin-based research\
    \ collective and consulting think Purism has been looking into this as well as\
    \ moving towards the superior NVME interface.\n\nThe first model’s most important\
    \ work – given that it's ready for this set of laptops – in the words of Purism’s\
    \ Intel-less mission: “ME is a threat to users easily signed by Intel, users to\
    \ compromise their privacy, and freedom because users must execute and unverifiable\
    \ code.”\n\nSo Purism has replaced the kernel, stack and about 22 percent of the\
    \ Intel binary – and is committed to replacing or replacing all of it. With depth,\
    \ there isn't a section of the Vault left over except for attacks against EFI\
    \ | UEFI (ME) binary firmware replacement. For the Librem 5 (pe bob) the world’s\
    \ first created, open smartphone using ever simple device code – is a big step\
    \ for the small hardware stack and Purism (theoretically) is Incorporated as a\
    \ Social Purpose Corporation.\n\nIntrigued by the laptops, and what they hide,\
    \ we spoke to Purism and CEO Todd Weaver this year's GNADEC (GNOME Conference),\
    \ and started by asking him: Why does it matter?\n\n\"Digital rights should mirror\
    \ physical rights,\" Weaver told us. \"The trend is to more data gathering and\
    \ more corporate surveillance, especially on mobile devices, trending in the world.\
    \ We needed a product that protects the digital rights of the consumer – and hardware\
    \ crafted to work with the software.\"\n\nHe emphasized the depth of liberty using\
    \ user control and leveraging the Free Software Foundation principles, but in\
    \ taking it even further, Weaver says \"Convenience, control\" are two words that\
    \ matter.\"\n\nWhy not use GNOME 3? Weaver sees it generally as a free software\
    \ product that looks and great – but singularly singled for \"great security with\
    \ app isolation privacy for individuals, and respecting digital rights (as it\
    \ free software).\"\n\nPurism's GNOME 3 Pure will also make it use the phone with\
    \ the Librem 5, while many users will buy it for \"end-to-end encrypted communication,\"\
    \ or to escape the existing duopoly's walled gardens, many users will be anticipating\
    \ a device to be docked at home with large screen and keyboard – and just such\
    \ package is one of the most popular options on the crowdfunding page.\n\n## Privacy\
    \ by default and kill switch\n\nWhether you're using a GNU/Linux laptop or not,\
    \ the OS of the Librem is privacy by default and it’s implemented in the hardware\
    \ itself, with a kill switch for locking. For various features, hackers are able\
    \ to switch off if you have a compromised PC or phone. While Librem’s hardware\
    \ stack gives you a physical switch for camera and microphone guarantees that\
    \ they cannot be used.\n\nFor the upcoming Librem 11 tablet, and just-announced\
    \ Librem 5 phone, there is an HKS for the SIM card and one for the GPS.\n\n![](img/a737bad617574f57f6d992ed4c1f4814_50_0.png)\n\
    \n## Purism\n\n## Purism's choice\n\nWith increasing sales of two laptops marked\
    \ on a premium design to appeal beyond traditional GNOME/Linux, Weaver said \"\
    We want to satisfy his customers.\"\n\n\"Free software supporters and GNOME/Linux,\
    \ of course,\" he responded, \"but these primary users – security-conscious CTOs,\
    \ CIOs and business executives. And parents, for children whose privacy is with.\"\
    \n\nFrom user feedback, it seems the recently published attacks on Vault 7 leaves\
    \ concerned because of concern. One customer said: \"One provided me that device\
    \ and now I have peace of mind that they are protected, with the things coming\
    \ out.\"\n\nIn addition security is a priority, for CTOs and CIOs, whom there's\
    \ interest from \"high value organizations,\" who want security, privacy, freedom.\
    \ Weaver says \"are the largest group we need, and we found the Librem holds up\
    \ well against Free Software developers – favourite the ThinkPad, even when the\
    \ factor means no mechanical keyboard.\"\n\nThe Librem has a free keyboard! (A\
