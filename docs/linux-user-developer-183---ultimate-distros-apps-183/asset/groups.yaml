    | 重量（含电池）: 1.5kg (1.8kg) |


    想要预装 GRU/Linux 笔记本电脑的用户是一个小众市场（遗憾的是），而想要 GRU/Linux 完全自由——内核中没有任何二进制大包（blobs）的人只是这群人中的一小部分。但由于
    Vault 7 事件以及其他如今被认为高风险的新闻，关注安全和隐私的电脑用户数量正在增加。这些高端设备从底层开始构建就考虑了安全和隐私。担心有人激活摄像头和麦克风吗？我们有硬件开关可以关闭这些设备的电源。


    在 Purism 团队位于英国参加 GUADEC 期间，我们用 Librem 15 体验了几天。以下是我们的使用情况。第一印象是：一个精美纤薄的黑色阳极氧化铝机身，合页链打开时阻力很小，外部有一系列良好的接口，包括
    USB-C，但没有 RJ45 接口——如果你打算使用 Librem（笔记本型号），你可能需要它。


    键盘——尽管看起来像纤薄的“巧克力键”类型——但让我们有些小惊喜，这种反馈在此类键盘中很少见，而且手感很好。与 MacBook Pro 或你的 ThinkPad
    主键盘相比，它的触感足够悦人，足以让盲打感觉非常自然——一旦用户适应了稍短的键位行程，一切感觉都很完美。一整天的打字体验感觉就像它该有的样子——在物理操作上不需要费太大精力。它有适量的机械噪音，因此没有丧失老式键盘的感觉。无论你每天工作五个小时还是八小时，或者很少使用鼠标都没关系。


    至于触控板，我们中的一些人认为它非常出色，但对于同类产品来说，它的灵敏度很高——多点触控支持滚动、滑动，并在支持的应用中支持缩放中键点击，滚轮可以通过 Fn+
    简单关闭，以防在长时间打字期间意外移动光标。功能键还控制快捷键，如睡眠（合上盖子也是如此，应该是）、静音、屏幕亮度、亮度等。让 Librem 让我们印象深刻的是硬件开关（HKS）的存在。摄像头、内存以及
    Wi-Fi 都赋予了你控制权，通过开关内存或 Wi-Fi，可以防止任何数据收集、监控或更具恶意的目的。孩子们拥有这些设备将非常棒。


    进化的改进意味着即使是入门型号也足够强大，我们在初次上手笔记本电脑的测评中没有发现任何问题。通过十字螺丝方便地访问内存和存储非常值得欢迎。你也可以购买不带任何组件的版本，然后放入你自己的。部件也是可更换的，这非常棒。Skylake
    i7 速度足够快，但更多的核心会更好，更简单的编译器和应用程序可以利用它们。性能是肯定的，虽然算不上顶级但也不是最好的——考虑到我们纤薄的外型和精美的尺寸，这并不意外。我们经历了大约六小时的实际使用，这足以让你更长时间不离开充电器。如果
    GNOME 3 是你目前的桌面选择，PureOS 可能会带给你一个惊喜。在安全和便利性方面，他们提供了最好的 GNOME 开箱体验之一。如果你在英国购买，将有
    20% 的关税。Richard Shermey。


    ## 优点


    隐私、安全、全栈自由软件、具有竞争力的性能以及对细节的关注。


    ## 缺点


    价格问题很简单——如果你不怀念缺少网口的话，买一台屏幕更好的二手 ThinkPad 更加划算。


    ## 总结


    如果你正在寻找高端笔记本电脑，这种工程卓越性和对细节的关注将确保它进入你的候选名单。如果你想在一个具有真正自由的系统上使用友好的桌面，那么这应该是你的首选。


