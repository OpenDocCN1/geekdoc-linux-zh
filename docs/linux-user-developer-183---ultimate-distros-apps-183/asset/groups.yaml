    /home/pi/Pictures/secret.jpg\"\ndef subprocess(filepath):\n\tsubprocess.call('shred',\
    \ '-u', filepath)\n```\n\n取消 `buzzer.success()` 以在文件删除后让蜂器发出声音。\n\n## Python 剃刀\
    \ (Pythonista Razor)\n\n## 处理多任务\n\n你的 Raspberry Pi 项目需要同时处理多个事情。学习如何在 Python\
    \ 中处理多任务。\n\n本文已涵盖了实现此点的不同技术。到目前为止还没有介绍当 Raspberry Pi 项目需要并发管理多个任务时的最佳方法。我们将查看如何在\
