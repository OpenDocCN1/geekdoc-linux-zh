    # Features


    | | Description |

    | :--- | :--- |

    | 08 News | The biggest stories from around the open world - a Linux Phone! |

    | 36 Essential Linux | In two of our Master Scripting guide, learn how to use
    Bash as a programming language, to decompile and making use of its loops, conditionals
    and functions |

    | 18 Ultimate distros & apps | Which distro(s) and apps should you use? Paul O''Brien
    explores the myriad of Linux distros and free open software options to find the
    right products for your needs |

    | 10 Letters | Learn how hackers are able to inject malicious code into Android
    apps. Discover how to decompile and debug apps to eliminate the threat and protect
    your secure |

    | 50 Purism | We chat with Purism founder and CEO Todd Weaver about the firm''s
    Librem laptops which come with Linux preloaded, as does the Librem smartphone
    |

    | 12 Interview | OpenSOURCE''s Richard Brown tells us about the Project Cubic
    container OS |

    | 44 Java | Following on last issue''s tutorial, discover how to add a graphical
    user interface to your game using the JavaFX library and make its buttons work
    to control the |

    | 56 Arduino | The Arduino is 12 years old and used by makers, tinkerers and researchers
