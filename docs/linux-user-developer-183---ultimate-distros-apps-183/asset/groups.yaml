    # 让你的 Linux 新闻与见解开源


    # 访谈 SUSE


    # Geeko 之道


    SUSE 在 Linux 和开源领域拥有悠久的创新历史。在我们庆祝其 25 周年之际，openSUSE 已经开始开展 Kubic 项目，这是一种由社区运行的集群计算、容器和微服务的新方法。


    ![](img/a737bad617574f57f6d992ed4c1f4814_11_0.png)


    > 现在的是访谈 SUSE 并探索 openSUSE 最新进展的良好时机，因为 SUSE 在本月庆祝成立 25 周年。这家公司已经从发布扩展的 Slackware
    发展到构建自己的发行版 SUSE Linux Enterprise (SLES)，但直到 2004 年，该公司才鼓励了 openSUSE 项目的创建……


    Richard Brown 在 SUSE 担任 Linux 发行版工程师，并将从 9 月开始参与 Kubic 工作。Richard 是 openSUSE 项目的主席，该项目真正拥抱开放和自由的“核心”源码原则，社区可以设定自己的方向，而公司必须与之保持一致进行工作。


    最近，SUSE 与 SAP HANA 的合作确实推向了 Linux 在早期采用和支持高端硬件以及内存数据库方面的极限。（从 2014 年开始，openSUSE
    和 SLES 默认就包含了 Btrfs - 据我所知，这是第一个默认使用“下一代”文件系统的主流（也是唯一的）发行版。这与 SUSE 长期以来早于其他公司领先提供如
    XFS 等文件系统支持的传统非常契合。对于选择使用它的用户，我们的日志显示在之后我们比其他公司更晚才开始支持它。）


    新的 Kubic 项目专注于容器技术和相关工具链。


    SUSE 本月庆祝 25 周年，SUSE 历史上的哪些关键时刻让整个 GUI 社区都在庆祝？


    回溯 1994 年，当 SUSE 发布了第一个企业级 Linux（这是第一个针对 IBM/390 的商业 Linux）时，SUSE 开始在 Linux 架构上进行大量初始工作。在令人印象深刻的同时，我认为
    openSUSE 在 2004 年的创建值得一提，因为它代表了与许多专注于特定领域的社区完全不同的模型。


    你将 Tumbleweed 描述为“运行最少服务器的最无聊方式”——哪些元素让你感到兴奋？


    我一直对 Tumbleweed 广泛采用的发布模型感到兴奋。除了 Kubic 加入 Tumbleweed 家族之外，我最印象深刻的是该发行版提供了软件包的快速更新，这种变化率是其他发行版在企业或机构环境中可能分发的很多，相对大型软件（例如
    GNOME 和 KDE）的重大升级通常在上游发布后几小时内就能完成。这一切，而且没有发生另一次重大崩溃——而这种稳定性是我所有日常工作的唯一依靠。


    目前，我正期待 GCC 7.2 与 glibc 2.26 一起作为 Tumbleweed 的下一个主要编译器落地。这将对比系统产生极其巨大的影响，并真实地印证了我们的流程是值得信赖的。


    ![](img/a737bad617574f57f6d992ed4c1f4814_11_1.png)


    # 什么是 Kubic 项目？


    广义来说，Kubic 是更广泛的 openSUSE 项目内部的一个“伞形项目”，专注于容器技术和相关工具，以提供“容器即服务”平台。详细而言，


    # 赖生业务


    Btrfs - 发音为 "butter-fs"，源自 CoW - 社区的活跃部分对此进行批评，由于这种安排，Red Hat 决定在 Red Enterprise
    Linux 7 (RHEL) 中弃用 Btrfs。这让 SUSE 的产品经理 Matthias Eckermann 思考，Red Hat 为了 Btrfs
    放弃了什么，而 SUSE 又在追求什么？——并没有什么。用 Eckermann 的话来说：“如果 Btrfs 的较小贡献者之一不再支持生产环境，将会好奇 SUSE
    是否会停止对 Btrfs 的投入？”


    Eckermann 也对未来的功能保持警惕，并预见到数据压缩方面的收益，以及未来发展在压缩方面为嵌入式系统提供了一个“有趣的选择”，openSUSE 开源了
    Zstandard (zstd - 缩写)，现在已将其排入内核 Btrfs 队列。Zstandard 具有令人印象深刻的内存级速度，并注将在最高压缩级别下匹配
    LZMA。


    ## 每年提交数


    | 贡献者 |

    | :--- |

    | SUSE |

    | Red Hat |

    | Fujitsu |

    | Facebook |

    | Mariana (独立) |

    | Stephen (独立) |

    | Jan Schmidt (独立) |


    ![](img/a737bad617574f57f6d992ed4c1f4814_12_0.png)


    上方：在最近的博客中，Eckmann 解释了 Red Hat 弃用 Btrfs 的原因，图表显示了为什么 SUSE 并不担心。


    Kubernetes 包括 Helm（Kubernetes 的仪表板）、kustomize（用于安装和部署配置）和 Docker。此外，Kubernetes
    在 openSUSE Tumbleweed 上使用了这些技术，Tumbleweed 是 SUSE 的一种滚动发布容器平台。我们通过最小化安装所需的管理需求和自动执行任务（如使用更新更新集群）使其变得简单。多功能操作系统不需要关心其他集群，你可以跨越所有方法和限制。


    > Kubic 是更广泛的 openSUSE 项目内部的一个“伞形”项目，专注于容器技术。


    # 在传统操作系统上管理栈的挑战是什么？Kube 如何解决这些问题？


    Kubernetes 是复杂且耗费的。SUSE 的 SaaS 核心目标之一是搭建 Kubernetes 集群，让客户拥有无忧的体验。为此，我们引入了管理 Kubernetes
    集群的管理员仪表板。无论是配置、扩展还是运行工作负载，你都必须有一个专门为该用例设计的系统，以避免多功能操作系统可能带来的危害。


    你已经了社区在项目中重要性。这如何改变了你的方法？你希望如何帮助这种以社区为中心的方法？


    任何启动项目或产品的人都可以带着想法和需求来找他们。最终，每个用户最初的需求都是不同的。SUSE 可以开发一个产品，将其设定并等待用户反馈，结果发现需要进行更改来满足其他用户的愿望。我们可以从基础开始，并非常早地引入社区。


    ## Kubic 产品的开发框架


    - FACTORY 开发代码库（开源公开）

    - openSUSE TUMBLEWEED（开源公开）

    - KUBIC 开发（开源内部）

    - SUSE ENTERPRISE（开源公开）

    - openSUSE LEAP（开源公开）


    通过这种反馈，我们可以立即识别我们是否处于正确的道路上，并且在设计上足够灵活，以调整客户需求。


    另一个方面是，客户首次使用产品时可能会以非预期的方式。对于 SLES，我们一直在学习我们的功能或工具中哪些是重要的，有时他们惊讶于他们的解决方案运行得更好！这些例子帮助我们决定应该在何处投入更多时间。


    进一步说，我们还从集成到 Kubic 栈的可能性中学习，而这些目前不在 SUSE 产品的考虑范围内。作为替代方案，像 OpenShift 等容器运行时可能会显著增强与社区的热情。开源在这里是为了如果我们随着这些技术和适配的演进以适应变化的市场需求，为
    SUSE 提供潜在利益。


    简化只读文件系统管理变得越来越可行。最大的挑战可能是图形化用户工具，以平滑处理只读操作系统及其容器化应用的特性，但这项工作已经在 Flatpak、Snap
    等人的关注范围内。也许这个等式的两端都可以在转折中心找到益处。


    事务性更新引起了大量兴趣。更新是否不影响作为副本（“快照”）的容器，而是先更新快照，如果更新了，快照会在下次重启时替换旧版本；来自 Btrfs 的的是什么？谁负责文件系统——我们吗？Btrfs
    是一个写时复制（COW）文件系统，与其他文件系统非常不同。这需要用户学习新事物。此外，快照和回滚的概念对于更多人来说仍然需要另一层。它需要硬盘来适应快照和回滚的需求。你如何管理？


    Btrfs 在早期，我们遇到的大多数问题实际上通过他们的工具得到了更好的解决。在 SUSE，我们投入了精力通过 YaST 和控制来确保环境正确。这就是为什么人们可以发现快照是如何就绪的。


    你之前提到过使用项目新且现代功能的可能性。你有什么可以提供我们的吗？


    现在说还为时尚早。我们仍在努力将其集成到 openSUSE 的发布周期中。


    你提到未来可能有 Kubic 桌面。这可以使用 Flatpak 和作为 Chromebook 的 FOSS 答案。什么是可能的？


