    to already being fetched, so by reading more blocks of data from disk read than
    were strictly asked for, caching the extra data, the overhead in doing so is offset
    by the efficiency and throughput achieved in combined samples.


    Linux 4.13 now includes many new features, including improved inter-process communication
    (which will provide better support for userspace), improved swapping of pages,
    kernel layout randomisation via a Gcc plug-in architecture, and several new AppArmor
    patches that have been carried in Ubuntu kernels for many years. Many other small
    patches were also backported for future to system management development.


    When it comes to swap, Linux has traditional problems. But the data (indexed by
    the old physical address of inclusion) in memory (RAM) doesn''t necessarily require
    swapping out memory. Yang''s patches change this, allowing memory reads from non-contiguous
    regions of swap, but only on non-local mode in order to avoid degrading performance.


    Separately, Garrett Larson (the author of page fault features (which aim to handle
    page fault preemptions) that use special code to respond to attempts that memory
    isn''t present, as is possible to perform memory read directly from a file, it)
    without taking the swap "mem_lock" patch that allows to map a task structure to
    handle user-space page faults without holding the lock and will fall back to the
    merge slow swap (and retry the page fault) with concurrent access or decheduling
    the underlying task.


    # ## Improved swap


    As mentioned above, Linux 4.13 supports swapping of Transparent Huge Pages (THPS),
    in one series of development in Linux''s underway (paging) code. The swap code
    has become an active area of development, thanks in part supported by an underlying
    shift from ''spinning'' rust'' (aka rotational storage) to volatile memories,
    such as flash and NVMe, and the changes induced in performance and utilisation.


    # ## Virtually swapped stacks on 64-bit ARM


    One of the patch sets under development,

    VMA based swap readhead comes from


    The kernel traditionally had used contiguous memory for the small, fixed ''stacks''
    allocated to store local function variables. Stacks are used by all processes,
    and microprocessors have special registers known (the ''stack pointer'') which
    are used to create a ''stack frame'' of code each time functions are called.


    Normally, application programmers don''t worry about stacks because they magically'
  - '[PAGE 16]


    grow bigger as necessary due to memory accesses triggering page faults and special
    handling code in the kernel. But within the kernel, things are very different,
    and stacks are both fixed size, and also limited to a few region; moving them
    upon kernel programmers.


    In the case that too many levels of recursive functions are called, or large allocations
    are performed by the stack, it ''overflow'' its fixed size. A stack overflow is
    usually silently catastrophic, overwriting important data structures (such as
    the task, thread,info, and quickly leading to a kernel panic). To help this, Linux
    4.9 Andrei Lutovskovsky''s work allows all kernel stack allocated from the virtually
    address space. With this change we can add an extra ''guard'' of reserve memory
    not backed by read—memory that will cause a processor exception upon any attempt
    to write to it (during a stack overflow).


    # ## Linux 4.14 will support virtually mapped stacks on 64-bit ARM


    Linux 4.14 will support virtually mapped stacks on 64-bit ARM. What about the
    ARM implementation is how it addresses these two problems: quickly preventing
    overflow, and doing without having a general reserve for stacks (which you can
    find in a page entry called ''VMAP_STACK struct'' which is to allow all stacks
    to double by regrowing the stack in memory according to its size), and to use
    this to easily detect any time stack pointer writes by the change to the THREAD_SHIFT_BIT
    of the stack.


    ### Patches for LLVMlinux, HMM & more

    ntended virtual memory and addressing support, up to 56 bits from 48-bit ''Canonical'',
    in the previous kernel. Now Kernel 4.9 has backport for ''Bit matching between
    4 and 5-level paging'' which means that distributions will be able to build a
    single binary kernel that runs on x86 machines, as well as those with support
    for slightly more rarely large amounts of memory (and NV-DIMMs).


    Google continues to work on LLVMlinux patches upstream, with the goal of making
    Linux with Clang possible. It is the first Google citizen, alongside GCC. To do
    this, Matthias Kaechle has posted an update, along with patches for LTS kernels
    4.4 and 4.9 (the minimum requirement for the just-released Android OS) who are
    working on vendor trees (the vast majority of the Android ecosystem).


    Jerôme Gisse posted version 250() of HMM or Heterogeneous Memory Management patches.
    These clearly add support for pointer and virtual memory sharing between devices
    (GPUs, FPGA) and the host and CPU stacks that haven''t typically have shared device
    memory and vice versa.


    The patches require the presence of more sophisticated devices (such as GPUs from
    Intel, Mali and others capable of using their own page tables) and access to unprotected
    entries. Jérôme''s work addresses a new kind of ''ZSOURCE'', and existing support
    to have pages in memory) by device devices as if it has been swapped out. When
    applications run the CPU will transparently cause a page fault and back a copy
    of the shared data.


    Matthew Garrett posted a patch about ''Enable reset allocation'', a mechanism
    defined by the Trusted Computing Group (TCG) as an OS to request ''that the firmware
    claim all RAM before booting another OS''. This is done by the MemoryWriteRequestControl[UEFI]
    available at startup; The goal is to prevent the leaking of any special secret
    keys that may exist in RAM between OS boot and the return.


