    # 复评 CubieBoard 6


    ![](img/a737bad617574f57f6d992ed4c1f4814_85_0.png)


    Gareth Halfacre


    ## 硬件 CubieTech CubieBoard 6


    | 价格 |

    | --- |

    | £52.75 (含增值税) |

    | 网站 |

    | newcub.co.uk |


    CPU: 全志架 S500 ARM Cortex-A9 四核 1.2GHz

    GPU: PowerVR SG554 Mali

    内存: 2GB LPDDR2

    存储: 96位 SATA 扩展

    网络: 100Mbps 以太网, Wi-Fi, 802.11b/g, 蓝牙 4.0

    接口: HDMI, 2x USB 2.0 主机, 1x USB 2.0 设备,microSD 卡, SATA 3


    四年的反思是否让 CubieTech 具备了竞争树莓派所需的一切？


    CubieTech 多年来一直一直在单板计算机市场深耕。2013年，这家中国公司首次凭借 CubieBoard 2 进军西方市场，将功率从全志 A10 SoC
    升级到更强大的 S500。尽管坦率地说，CubieBoard 的小外形在较大的“CubieTech 轨迹”布局中显得有些独特，


    CubieBoard 6 是回归了巅峰。该板的设计旨在更加强大，或许在每个引脚上都与 CubieBoard 1 和 2 完全相同。虽然改进后的 40 脚 GPIO
    插针头中一些功能发生了偏移，但其核心理念是，任何围绕 CubieBoard 2 构建了设计的人，都可以将其替换为 CubieBoard 6。


    通过这种方式，你可以获得相当的升级：旧的 A2 SoC 已被全志 S500 SoC 取代，这包含一个四核 ARM Cortex-A9 CPU 和 PowerVR
    SGX544 GPU。你还享受了 2GB 的内存、双倍的 8GB 存储，以及通过 JMic JMS578-SATA-to-USB 桥接芯片实现的更快的 SATA
    3 接口连接（该芯片最高仅限于 USB 2.0 速度）。


    上方：与许多中国和台湾的单板计算机设计一样，CubieBoard 6 包含一个板载红外接收器


    ![](img/a737bad617574f57f6d992ed4c1f4814_86_0.png)


    > SATA 连接器通过一个 5V 连接在一起，这使得添加 2.5 英制机械或固态硬盘变得轻而易举


    与 CubeBoard 6 不同的 SATA 接口相比，对该板的永久图像分析显示，µMicro 芯片连接了 SATA 驱动器。这解释了其令人惊讶的高待机功耗，为
    2.9W，而性能更好的树莓派 P3 为 1.57W。


    尽管 CubeBoard 表现良好——功耗为 3.45W，而树莓派 P3 为 2.94W，但在 SysBench CPU 测试中，253.12 秒的单线程性能比
    P3 的 183.23 秒和 49.03 秒慢了 19.8 秒。


    对于那些想要构建网络附属存储设备的人，CubeBoard 6 配备的 5V 连接使得即使在考虑到这些问题的情况下也可行。SATA 连接器使得在不需要额外 SATA
    和电缆的情况下即可添加 2.5 英制机械或固态硬盘。


    CubeBoard 的以太网端口提供的吞吐量并不高于 P3，也没有更好，因为它与 SATA 和 M2 控制器共享单个 USB 总线，该总线对读写操作支持多线程。


    写作时间，考虑到这些问题，CubeBoard 6 配备的 5V 连接使得可行。SATA 连接器使得在不需要额外 SATA 和电缆的情况下即可添加 2.5 英制机械或固态硬盘。


    '
