- md: "\n# Tutorial\n\n# Essential Linux\n\nPART TWO\n\n## Master shell scripting:\
    \ program constructs\n\nBash scripting provides conditionals, loops and functions\
    \ that you can use to create powerful scripts.\n\n**We are now capable of writing\
    \ shell scripts, we that start Bash scripting in its own right.** Many programming\
    \ languages, such as Python and JavaScript, include REPLs that allow to interpret\
    \ commands in real time. In the same way, the command line takes the role of a\
    \ REPL for shell: when you're writing a script, you can try out at the command\
    \ line without copying them into your script.\n\nBash scripting is a surprisingly\
    \ featured tool. In this tutorial we'll learn about conditionals, loops and functions\
    \ that behave as well as they do in other languages. We will also see how to handle\
    \ script arguments and learn how to use these arguments inside scripts.\n\nUsing\
    \ these tools and the commands we've learned, you'll start writing your scripts\
    \ to automate repetitive tasks and save more time than it saves. As you become\
    \ more fluent, you'll find yourself a more productive Linux user.\n\nIn Bash scripts,\
    \ any line that begins with the hash # is treated as a comment and is not executed.\n\
    \nThe shebang ##!/bin/bash is an example of a comment: it is used to determine\
    \ which program to run the script, but the initial # ensures it is not executed\
    \ when the script is passed to Bash.\n\nThe simplest programming construct is\
    \ the conditional statement. Bash makes it available with a syntax similar to\
    \ that found in other languages. For example, here is a simple script shown below:\n\
    \n```bash\n#!/bin/bash\nif [ $(ls | wc -l) -gt 10 ]; then\n  echo \"too many files\
    \ in the working directory\"\nelse\n  echo \"too few files in the working directory\"\
    \n  echo \"Well done!\"\nfi\n```\n\nThe general syntax is as follows: start with\
    \ if, followed by condition in square brackets [[ ]].\n\nimg/a737bad617574f57f6d992ed4c1f4814_35_0.png\n\
    \nJohn Gowers is a university tutor in Programming and Computer Science. He likes\
    \ to install Linux on every device he can get his hands on and uses terminal commands\
    \ and shells on a daily basis.\n\n# Resources\n\n- A terminal running the Bash\
    \ shell (on any Linux distribution)\n\nimg/a737bad617574f57f6d992ed4c1f4814_35_1.png\n\
    \nTutorial files available:\nfiles.co.uk\n\n```bash\n#!/bin/bash\n\nrequired=$1\n\
    if [ $# -ne 1 ] || [ -z \"$required\" ]; then\n  echo \"Error: missing argument\"\
    \n  exit 1\nfi\n\nif [ -f \"$required\" ]; then\n  IFS=':'\n  read -ra PATH_DIRS\
    \ <<< \"$PATH\"\n  unset IFS\n  for dir in \"${PATH_DIRS[@]}\"; do\n    if [ -f\
    \ \"$dir/$required\" ]; then\n      \"$dir/$required\"\n    fi\n  done\n  echo\
    \ \"Error: $required not found in PATH\"\n  exit 1\nelse\n  echo \"Error: $required\
    \ is not a file\"\n  exit 1\nfi\n```\n\n## Conditional expression\n\n# Returns\
    \ true if\n\n| Expression | Description |\n| :--- | :--- |\n| [[ num1 -eq num2\
    \ ]] | num1 and num2 are equal |\n| [[ num1 -ne num2 ]] | num1 and num2 are not\
    \ equal |\n| [[ num1 -lt num2 ]] | num1 is less than num2 |\n| [[ num1 -le num2\
    \ ]] | num1 is less than or equal to num2 |\n| [[ num1 -gt num2 ]] | num1 is greater\
    \ than num2 |\n| [[ num1 -ge num2 ]] | num1 is greater than or equal to num2 |\n\
    | [[ str1 = str2 ]] | str1 is the same as str2 |\n| [[ str1 != str2 ]] | str1\
    \ is different from str2 |\n\nAbove Bash's if statement provides useful comparison\
    \ operators. Follow with then and **elif** commands if we want to add additional\
    \ branch cases (corresponding to the **else if** construct from other languages),\
    \ then use the **else** keyword.\n\n> Most languages provide a simple for-loop,\
    \ and Bash scripting is no exception.\n\n```bash\n#!/bin/bash\nnumber_of_files=$(ls\
    \ | wc -l)\nif [ \"$number_of_files\" -gt 100 ]; then\n    echo \"more than ten\
    \ files in the working directory\"\nelif [ \"$number_of_files\" -gt 10 ]; then\n\
    \    echo \"more than ten in the working directory\"\nelse\n    echo \"ten or\
    \ fewer files in the working directory\"\nfi\n```\n\n```bash\nnumber_of_files=$(ls\
    \ | wc -l)\nif [ \"$number_of_files\" -gt 10 ] && [ \"$number_of_files\" -le 20\
    \ ]; then\n    echo \"10 and 20 files in the working directory\"\nfi\n```\n\n\
    As with assignment, the use of spaces is important when writing conditionals:\
    \ you must leave a space after the opening [ and before the closing ] or the script\
    \ will not work. Similarly, it is important to include the keyword after each\
    \ if or elif branch (but not the else clause); otherwise you will get a syntax\
    \ error.\n\n## For loops\n\nMost languages provide a simple for-loop, and Bash\
    \ scripting is not. The basic operation of a for-loop in Bash is to iterate through\
    \ a sequence of:\n\n```bash\nfor s in line\ndo\n  echo $s\ndone\n```\n\nHere,\
    \ the first line sets the variable s to be about each of the lines. It is, and\
    \ then executing the body of the loop (between **do** and **done**) each time\
    \ that particular value of s is used. This might not seem useful on its own, but\
    \ when we combine it with globbing, the results can be powerful.\n\nThe —gt operator\
    \ stands for 'greater than' and can be used to compare integers. Bash provides\
    \ a number of operators that can be used to test other things. For example, if\
    \ [[ -f name ]] tests whether a file name exists in the working directory, and\
    \ if [[ -d name ]] tests whether the file called is a directory.\n\nYou can combine\
    \ conditions using the AND -&& and OR operator ||, just as in other languages,\
    \ e.g:\n\nimg/a737bad617574f57f6d992ed4c1f4814_36_0.png\n\n# Tutorial\n\n# Essential\
    \ Linux\n\n## Command-line options\nYou might want your script to accept command-line\
    \ switches, as commands do (e.g., `echo -n`). To do that for this purpose, getopt\
    \ can parse the switches into a separate variable. You can find out more by typing\
    \ `man getopt`.\n\n| Figure 2 |\n| :--- |\n| #!/bin/bash |\n| for i in ./* |\n\
    | if [[ -d \"$i\" && -n \"$i\" ]]; |\n| then |\n| number_of_files=$(ls $i | wc\
    \ -l) |\n| if [[ $number_of_files -gt 10 ]]; |\n| then |\n| echo \"directory contains\
    \ $number_of_files\" |\n| fi |\n| done |\n\nor to 12. If the test is true, bash\
    \ executes the body of the loop and then adds 4 to the value of **i**. We have\
    \ used variables **start**, **end** and **jump** to order the power of this syntax,\
    \ but you could just easily have the values straight into the loop.\n\n## Shell\
    \ parameters\nAs we saw at the start of this series, commands can be passed arguments\
    \ after the name of the command. For example, we can type `ls` or the full path\
    \ `/bin/ls`. A script can take an arbitrary number of parameters at the command\
    \ line and refer to them within the script. We refer to parameters using the variables\
    \ `$1`, `$2`, `$3` and so on. For example, save the script as reverse.sh.\n\n\
    Using **Bash** in conjunction with globbing allows us to iterate over the directories\
    \ Example, we might want to get a list of the directories in the working directory\
    \ containing more than ten, and we can do so using **Figure 2**.\n\nA slight variation\
    \ of this technique is to use a for-loop iteration that is more similar to that\
    \ in languages such as:\n\n```bash\n#!/bin/bash\necho -n \"$1\"\necho -n \"$2\"\
    \necho \"$3\"\n```\n\nRun ./reverse.sh to make the script execute, you can run:\n\
    \n```bash\n$ reverse.sh around\nother way\n```\n\n```bash\nfor i in {1..3}; do\n\
    \  echo \"Hello, world!\"\ndone\n1. Hello, world!\n2. Hello, world!\n3. Hello,\
    \ world!\n```\n\nIf you need more than three command-line arguments to your scripts\
    \ Example, if we wanted to modify our reverse.sh script to take an arbitrary number\
    \ of arguments, rather than just three, we could do so using the following code:\n\
    \n```bash\nfor arg in \"$@\"\n  \n  result=\"$arg\"\ndone\necho \"$result\"\n\
    ```\n\nwill wrap each individual argument in double quotes, ensuring that it is\
    \ treated correctly.\n\n> No programming language would be complete without notion\
    \ of functions\n\n```bash\nfor i in (1..end) # Doesn't work as expected.\n```\n\
    \nA more powerful alternative mimics the syntax of languages like C, C++ and Java:\n\
    \n```bash\nstart=4\nend=12\njump=4\nfor ((i=$start; i<=$end; i+=jump))\n  echo\
    \ $i\n4\n8\n12\n```\n\nIn case you are unfamiliar with the C for-loop syntax,\
    \ this loop initializes the counter variable i to 4, and repeatedly performs a\
    \ test to whether i is less\n"
  mdcn: "\n\n# 教程\n\n# 核心 Linux\n\n第二部分\n\n## 精通 Shell 脚本编写：程序结构\n\nBash 脚本提供了条件判断、循环和函数，你可以利用它们来创建强大的脚本。\n\
    \n**我们现在能够编写 shell 脚本了，我们可以独立开始编写 Bash 脚本了。** 许多编程语言（如 Python 和 JavaScript）都包含\
    \ REPL（读取-评估打印循环），允许实时解释命令。同样，命令行也充当 shell 的 REPL 角色：当你编写脚本时，可以在命令行中尝试命令，而无需将它们复制到脚本中。\n\
    \nBash 脚本是一个功能出乎意意的工具。在本教程中，我们将学习条件判断、循环和函数，它们的表现与其他语言中一样良好。我们还将会看到如何处理脚本参数，并学习如何在脚本内部使用这些参数。\n\
    \n通过使用这些工具和我们学过的命令，你将开始编写脚本来自动化重复任务，节省的时间将超过你所花费的时间。随着你变得越来越熟练，你会发现自己成了一个更高效的\
    \ Linux 用户。\n\n在 Bash 脚本中，任何以井号 `#` 开头的行都会被视为注释且不执行。\n\nshebang `#!/bin/bash`\
    \ 是注释的一个示例：它用于确定运行脚本的程序，但开头的 `#` 确保了它在脚本被传递给 Bash 时不会被执行。\n\n最简单的程序结构是条件语句。Bash\
    \ 提供的语法与其他语言中的发现的类似。例如，下面所示了一个简单的脚本：\n\n```bash\n#!/bin/bash\nif [ $(ls | wc -l)\
    \ -gt 10 ]; then\n  echo \"too many files in the working directory\"\nelse\n \
    \ echo \"too few files in the working directory\"\n  echo \"Well done!\"\nfi\n\
    ```\n\n通用语法如下：以 `if` 开始，后面跟着方括号 `[[ ]]` 内的条件。\n\nimg/a737bad617574f57f6d992ed4c1f4814_35_0.png\n\
    \nJohn Gowers 是一位编程和计算机科学的大学导师。他喜欢在他每一个能拿到的设备上安装 Linux，并每天使用终端命令和 shell。\n\n#\
    \ 资源\n\n- 一个运行 Bash shell 的终端（在任何 Linux 发行版上）\n\nimg/a737bad617574f57f6d992ed4c1f4814_35_1.png\n\
    \n可用的教程文件：\nfiles.co.uk\n\n```bash\n#!/bin/bash\n\nrequired=$1\nif [ $# -ne 1\
    \ ] || [ -z \"$required\" ]; then\n  echo \"Error: missing argument\"\n  exit\
    \ 1\nfi\n\nif [ -f \"$required\" ]; then\n  IFS=':'\n  read -ra PATH_DIRS <<<\
    \ \"$PATH\"\n  unset IFS\n  for dir in \"${PATH_DIRS[@]}\"; do\n    if [ -f \"\
    $dir/$required\" ]; then\n      \"$dir/$required\"\n    fi\n  done\n  echo \"\
    Error: $required not found in PATH\"\n  exit 1\nelse\n  echo \"Error: $required\
    \ is not a file\"\n  exit 1\nfi\n```\n\n## 条件表达式\n\n# 如果为真则返回 \n\n| 表达式 | 描述 |\n\
    | :--- | :--- |\n| [[ num1 -eq num2 ]] | num1 和 num2 相等 |\n| [[ num1 -ne num2\
    \ ]] | num1 和 num2 不相等 |\n| [[ num1 -lt num2 ]] | num1 小于 num2 |\n| [[ num1 -le\
    \ num2 ]] | num1 小于或等于 num2 |\n| [[ num1 -gt num2 ]] | num1 大于 num2 |\n| [[ num1\
    \ -ge num2 ]] | num1 大于或等于 num2 |\n| [[ str1 = str2 ]] | str1 与 str2 相同 |\n| [[\
    \ str1 != str2 ]] | str1 与 str2 不同 |\n\n上述 Bash 的 if 语句提供了实用的比较运算符。如果**想添加额外的分支情况（对应于其他语言中的\
    \ **else if** 结构），请跟在 `then` 和 **elif** 命令，然后使用 **else** 关键字。\n\n> 大多数语言都提供简单的\
    \ for 循环，Bash 脚本编写也不例外。\n\n```bash\n#!/bin/bash\nnumber_of_files=$(ls | wc -l)\n\
    if [ \"$number_of_files\" -gt 100 ]; then\n    echo \"more than ten files in the\
    \ working directory\"\nelif [ \"$number_of_files\" -gt 10 ]; then\n    echo \"\
    more than ten in the working directory\"\nelse\n    echo \"ten or fewer files\
    \ in the working directory\"\nfi\n```\n\n```bash\nnumber_of_files=$(ls | wc -l)\n\
    if [ \"$number_of_files\" -gt 10 ] && [ \"$number_of_files\" -le 20 ]; then\n\
    \    echo \"10 and 20 files in the working directory\"\nfi\n```\n\n与赋值一样，在编写条件时使用空格非常重要：你必须在左括号\
    \ `[` 之后和右括号 `]` 之前留空格，否则脚本将无法工作。同样，在每个 `if` 或 `elif` 分支后包含关键字（但不包括 `else` 子句）也是重要的；否则你会得到语法错误。\n\
