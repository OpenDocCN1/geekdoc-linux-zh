    # MARKDOWN PARSER & CONVERTER


    # CommonMark.c 0.280


    Fast Markdown converter


    It''s likely you''ve written at least some Paragraphs, parsed a README for a GitHub
    page. But you have looked at what lies beneath? Ambiguities in the original CommonMark
    specification, and bugs in the effort to implement CommonMark in 2017, and this
    app is the reference implementation.

    If you only have to convert a few documents from HTML, then you won''t mind a
    few milliseconds here and there in the conversion process, and will use Pandoc,
    or whatever tool you have to. If you have a static blog, you''ll be using its
    built-in tool. But if you have a substantial number of documents - particularly
    one constant variation - CommonMark''s speed is rapid enough to get hairy.

    The program provides a library to convert documents to HTML, LaTeX, CommonMark,
    expression of the abstract syntax tree (AST). There''s also a command-line parser
    and renderer for some - which has been measured at 10,000 times faster than CommonMark.py!
    Writing to STDOUT, it''s up to where and how you direct the HTML and so on produced.


    ![](img/a737bad617574f57f6d992ed4c1f4814_90_0.png)


    Above With good documentation and test suites, CommonMark.c is an example of software
