    > 你可以仅花费 2 欧元即可获得一块带有微控制器、USB 和电源适配器的完整板


    要开始使用，你需要获取许多 Arduino 板之一。选择 Uno 是第一步，而且它是安全的——不像超过 50% 的 Arduino 板像 Uno 那样昂贵。这些板的价格大约在
    15 欧元左右。例如，如果你感兴趣创建复杂项目，有一个手持游戏形状的型号。对于更重的任务，Mega 或 Due 可能更适合你的需求。如果你离开 Linux
    就无法工作，Uno 是你的最佳选择。当然，如果你想接受额外的挑战，可以自己制作。


    在本指南（见底部）中，我们使用 Arduino Leonardo，它与 Uno 类似，但带有 micro-USB 接口。需要考虑的一点是技术规格。不用担心——它们通常是平等的。这里重要的选择是闪存内存的大小（它限制了任何程序的大小）以及
    SRAM（它限制了变量的数量）。这些设计是为短而简单的项目设计的，如果你一次性启动很多任务，可能会很快遇到尺寸限制。如果你需要更多，请考虑 Mega，它具有
    256KB 的闪存内存，而 Uno 只有 32KB。同样值得注意的是存在变体。Arduino 网站为每块板提供了详尽的指南，详细说明了独特功能并提供了板规格之间的比较。


    有各种扩展板（shields）可以插入引脚中（焊接在 I/O 引脚上）并放置在 Arduino 上方。它们通过扩展板提供的相应 I/O 引脚进行通信。扩展板提供了额外的硬件，实现了
