    # 终极发行版与应用


    ## 企业级最佳发行版


    对于企业领域稳如磐石的支持，Red Hat 是一个极佳的选择


    ### Red Hat Enterprise Linux (RHEL)


    为企业选择 Linux 发行版，与其说是因为功能，不如说是为了支持。Red Hat已经是企业服务器市场的强军，并且在该范围内稳步增长，但运行业务的系统在所有场景下都必须完全可靠——在
    Linux 领域，很少公司比它更有优势。该公司的 Red Hat 产品被超过 90% 的财富百强公司使用。Red Hat 的生命周期——版本 7 发布于 2014
    年，7.4（也称为更新 4）于 2016 年 8 月发布，通常每 18 到 36 个月发布一次，所有版本的支持期限通常为十年或更久。主版本不按固定周期运行。通常，最新的
    7 版本像其他版本一样发布，这反映了 Red Hat 的策略：在发布版本内更新内核版本而非稳定版本，以进行安全修复和释放漏洞。


    通过 Fedora（一个 Red Hat 支持的项目），Fedora 7 实际上是 Fedora 19 和 20 的分支，而 Fedora 开源项目作为其上游仓库。这两个操作系统之间的区别在于上述支持软件包的发布稳定速度。Fedora
    相比企业版产品是一个更对消费者友好的选择，尽管它们源自相同的基因。

    在桌面端，目前运行版本 7 的 Red Hat Linux 是一种基于 RPM 的发行版，它使用 GNOME 3 作为桌面。从角度来看，它为特定用户的硬件环境提供了多种选择。

    虽然作为 Red Hat 开发者计划的一部分下载付费服务，但出于开发目的，可能需要项目的一套 TACS（并提供支持）。

    桌面/工作站没有同等计划，其价格为每月 99 美元起。


