    # TOP FIVE


    ## Top 5 Linux audio editing tools


    ![](img/a737bad617574f57f6d992ed4c1f4814_6_0.png)


    ## HARDWARE

    ### Nimbuslaptop PCs featuring Ubuntu Budgie

    ### A range of laptops and desktops


    Following in the footsteps of US reseller System76, Newcastle-upon-Tyne based
    Nimbuslaptop is a range of desktop and laptop computers that will ship with Ubuntu
    Budgie. From £299 for the heavy-duty Alvern to £1299 - available, a pair of all-in-one
    desktops starts at £699. All basic configurations and models can be configured
    with the CPU, RAM, storage, drives, graphics card and operating system. With their
    elegant chassis and backlit keyboards, multi-touch tracks and USB 3.0 ports, these
    devices are produced by Nimbuslaptop hardware designs. Whitehouse OEM Cle is providing
    the hardware.


    With a 13" LTS for the desktop choice, Ubuntu Budgie 17.4 is available on all
    devices. Launched in November 2016 as Budget-Mix, Ubuntu Budgie is a lightweight
    version of Ubuntu with the Budgie desktop, developed by the team behind the Solus
    project. After its initial release, Ubuntu adopted as an official community flavour
    of Ubuntu in April 2017.


    Three PCs (two laptops, one desktop) are available purely with Budgie, These Ubuntu
    Budgie editions are key to attracting users.


    MD Chris Harvey tells us: “We’re excited to be partnering with Budgie which we
    think is a great thing to couple with our hardware. It is both elegant and easy
    to use. Pre-installed on our models will help users. Budgie will also receive
    a percentage of the revenue from these which will help fund the community.


    Nimbuslaptop is also introducing its own Linux distro. Our OS will be based on
    Plasma and Linux, but we are currently working on it.

    There is no release date for yet yet


    ## 1 Audacity

    The default choice for free for most Linux users, Audacity can do everything from
    recording and editing multi-track music to picking up audio from online radio,
    other voice work. Audacity can be given extra functions, and import/output options
    with community-developed plugins.


    ## 2 Ardour

    Capable of recording, editing, and mixing Ardour (http://ardour.org) is intended
    for musicians, composers and sound engineers and supports hundreds of tracks.
    Available as a one-time payment or subscription for the packaged version, or for
    free, complete-it-your-option.


    ## 3 LMMS

    LMMS is free for free at lmms.io, where the purpose is to make music. With Ubuntu-based
    instruments, advanced routing, unlimited tracks and arbitrary effects support
    for most keys, and VST support wait.


    ## 4 The OpenOctave Project

    Described being developed for a religious project, OpenOctave MIDI (or OpenOctave)
    is a free music and score composition tool, that works for voice work or recording.
    Find out more at www.openoctave.org.


    ## 5 Tracktion

    Available for free for music creators, this tool offers a great UI, with input-mix
    and waveform layer to lead from it. Find the 64-bit tool at http://bit.ly/5DAW.


    # SMALL BOARD COMPUTER


    ## Raspberry Pi gets Raspian Stretch


    Security, enhanced Bluetooth support and username support are among improvements
    to the.


    Following the launch of Debian Stretch, Raspberry Pi users can now get hold of
    Debian Stretch, the dedicated distro from the Raspberry Foundation. Still wielding
    the PIXEL desktop, Debian Stretch comes with a number of improvements, descriptions,
    and new tools.


    "The differences between Jessie and Stretch are mostly under-the-hood optimizations,
    and you really shouldn''t notice any differences between the sets of desktop and
    applications."


    Most notable are the improvements to Chromium which include improved memory usage
    and efficiency, enabling the browser to run faster. There''s also a tweak to the
    browser''s appearance. Regular users of Firefox will notice some additions to
    input and output, including MIDI and OSC.

    Along these improvements, the update addresses security issues, Bluetooth support
    and username issues.

    The Broadplay, which mainly affects Android and iOS devices, can be executed on
    a Raspberry Pi. To deal with this, a patch is included in the update which prevents
    the BCM2835 wifi from being hacked via a vulnerability in the chip''s firmware.

    Meanwhile, Bluetooth for audio devices has flipped from PulseAudio, in favour
    of a better connection with ALSA. To this end, the binary also included in Raspberry
    Stretch, which should give better audio results. PulseAudio can still be installed
    manually.

    Also the updates, username handling has been improved. Now, applications will
    not assume that root is the default user and run into problems when this is not
    the case. Now sudo has been improved.


    ![](img/a737bad617574f57f6d992ed4c1f4814_7_0.png)


    > Raspian Stretch brings some security improvements to the Pi


    > Advice for upgrading Raspian Stretch is straightforward: for the best results,
    use a freshly downloaded image.


    # SECURITY


    ## Virus spreading via Facebook Messenger video links


    Cross-platform users are targeted with a new Facebook Messenger scam, which distributes
    malicious malware.


    address you by name, followed by a ''Video'', and the link to the landing page
    is plenty of reason to avoid anything but a blatant scam, but video clips are
    not empty.


    The simplest way to avoid this attack is to ignore the message. If you''ve clicked
    it, deny requests to add Pi.

    If you''re already infected, or know someone who is, the steps are the same: With
    Firefox, use the menu, Troubleshooting > Refresh the ''Refresh Firefox'' button
    to reset and remove any add-ons. Try > Settings > Reset. You should also check
    your account for unwanted activity and plug-ins, in Settings > Apps.


    For veteran users, the dangers of malware are well known with Linux''s increasing
    security - via workplaces embracing open source, and the Raspberry Pi – there
    are an increasing number of users who are unaware of the risks. The scammers have
    put the effort into producing a Linux attack, after all.

