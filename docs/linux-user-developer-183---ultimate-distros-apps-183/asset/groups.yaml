  mdcn: "\n\n# 快速指南\n\nYun\n它带有许多内置硬件，甚至带有一个操作系统。\n\n## 规格\n- 时钟频率：400MHz\n- 20 个数字\
    \ I/O 引脚\n- 32KB 闪存内存\n- 2.5KB SRAM, 64MB RAM\n- 1kB EEPROM\n- 尺寸：68.6 x 53.3mm\n\
    \n## 优点\nYun 板板上载有一个 Linux 微处理器，并预装了 Python 2.7，还内置了 Wi-Fi、以太网和 microSD 卡读器。\n\
    \n## 缺点\n价格是 Uno 的三倍，且初始设置更复杂，但 Yun 提供了更多功能，而你可能不需要更多了。\n\n## 非常适用于……\n做任何事情（连接网络\
    \ - 甚至是流媒体）。它可以被制成网络服务器、路由器、Twitter 机器人或物联网设备。\n\n![](img/a737bad617574f57f6d992ed4c1f4814_60_0.png)\n\
    \n面包板。本教程中使用的温度传感器是德州仪器的 LM35，但感觉并不与该型号完全一致。或者，arduino.com 上有许多示例教程，包含了你开始制作设备所需的所有要求。选择一个硬件设备（理想情况下是带有能够尽可能处理接口交互（处理复杂项目）的库）并将其作为一组\
    \ LED 灯进行探索是一个好主意，你可以控制环境、语言以及如 `digitalWrite()` 等函数，这些构成了大多数 Arduino 项目的骨干。通过添加延迟和研究脉宽，你可以控制灯光的亮度。进一步开发项目，你可以使用\
    \ Python 和 Arduino 从计算机控制灯光，为实用的项目打下良好基础。它可以被改装为将来自计算机或网络的消息显示在 LCD 屏幕上。信不信由，或者你可以找到一种方法让同事知道你比计划晚了，或者计算机需要进行……\n\
    \n> 快速提示\n 持久化存储\nArduino 带有 1KB 的 EEPROM。这是一个存储变量的好地方，因为它的写入次数有限，请明智使用。\n\n![](img/a737bad617574f57f6d992ed4c1f4814_60_1.png)\n\
    \n| 编辑器 | 搜索示例 |\n|--- |--- |\n| Sketch 画板 | 显示所有开发板的示例 |\n| 内置 | 来自库 |\n| 库 |\
    \ 以太网 (1) |\n\n![](img/a737bad617574f57f6d992ed4c1f4814_60_2.png)\n\n## 04 转换为温度\n\
    请查阅数据表。你需要对 Arduino 的输入（0 到 1024，映射到 0 到 5V）应用数学运算，将电压转换为温度。\n\n## 05 创建网络服务器\n\
    将你的代码复制到网络服务器中并修改以太网变量。将示例变量替换为你自己的测量值。\n\nwww.linuxuser.com | 61\n\n## 特性\n\n\
    # Arduino\nArduino 的哲学是“在做中学习”，以及像这种温和的压力，这种随意的兴致带你学习如何为 Arduino 编程，并较快地体验新的库和硬件。\n\
    \nArduino 可以通过 USB 或 5V 供电，在待机模式下仅消耗几十毫秒。然后你可以关闭存储组甚至核心。\n\n## 编写 Arduino\n为 Arduino\
    \ 变得毫不费力且比以往任何时候都容易——这就是 Arduino 在交互环境中的根源。为 Arduino 编写代码的过程与任何 C++ 程序相似；但在大多数情况下，你只需要准备\
    \ IDE 并切换输入引脚的开启。\n\nArduino 程序被称为“sketches”（草图）——这个词源于画 Sketch。草图写在 sketchbook（电脑的文件夹）中。要开始编写草图，你需要在包括\
    \ Linux 在内的所有主要平台上下载 Arduino IDE，或者使用去年推出的在线编辑器。这两个选项都可以在 www.arduino.cc 的“software”标签页下找到。\n\
    \n进行编辑后，你有两个函数，构成了 Arduino 设置和循环的骨架。`setup` 只执行一次，除非 Arduino 掉电。在某些设备上（如此设备），可以执行多次循环。在\
    \ `setup` 中，你将 I/O 引脚设置为输入或输出，并初始化执行任务的变量，例如切换引脚读取值，或将库加载到硬件。\n\n通过 Arduino 的串口，你可以看到\
    \ Arduino 正在发生什么。使用 Serial 库，你可以读取并显示消息，如 `Serial.printing()` —— 这是 Arduino 版的控制台。大多数情况下，Arduino\
    \ 编程都是这样进行的；设备、计算机、SD 卡、LCD 或无线电传输器之间的所有通信已为你写好并封装在方便的函数中。你只需要编写 Arduino 到硬件的代码，让微控制器连接到设备终端。这些库还为\
    \ TFT 触摸屏、NFC 标签、SIM 卡和电机等编写过，并分发在 Arduino 环境中。\n\n这种某种程度上简化的方法降低了不熟悉相关编程的人的入门门槛，而\
    \ Arduino 的独特品质使得该平台变得流行。即使是最简单的程序——即使是闪烁灯——其学习曲线对初学者来说也更有回报（且可能具有挑战性）。事实上，这是\
    \ Arduino 和树莓派的区别。\n\n这种硬件优先的方法侧重于为任何人提供一种快速简单的方法，让他们拿一个花园小屋，并在完全不知其妙的情况下将其填满，通过这种方式帮助解决简单问题，在现代时代变得简单。\n\
    \n![](img/a737bad617574f57f6d992ed4c1f4814_60_png)\n\n# ARDUINO 扩展板\n\n## 添加扩展板\n\
    \n### 添加扩展\n\n### 以太网和 SD\n一个入门的好扩展板。此扩展板允许将 Arduino 连接到互联网，用于监控环境或创建简单的网络服务器。价格：10\n\
    \n> 这种简化的方法降低了不熟悉编程或电子设备的人的门槛\n\n### 电机扩展板\n这些扩展板提供了驱动直流电机和步进电机的电路。你可以在不让 Arduino\
    \ 过载的情况下控制180 度旋转。或者，你可以制作自己的电路。价格：10 到25\n\n### Wi-Fi\n如果不购买这个，你需要额外的硬件通过 Wi-Fi\
