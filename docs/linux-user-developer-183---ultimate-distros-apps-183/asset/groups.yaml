    # # Arch Linux


    ON FILESILLO


    Arch is a lightweight and flexible distro that caters to advanced users. Whereas
    Ubuntu likes to install a broad set of applications for you, Arch takes a different
    approach – a minimal system is installed, which you can then tailor for your own
    purpose. Arch usage is managed by directly editing files.


    ![](img/a737bad617574f57f6d992ed4c1f4814_20_1.png)


    While most distros have regular updates, Arch cycles a ''rolling release'' model
    that lets you always get the latest version of software without the need for periodic
    ''major upgrades''. Arch''s repositories are typically updated very quickly, so
    use the ''stable'' tag if you are concerned about stability, instead of using
    Arch''s ''pacman''. Pacman is designed to allow users to install packages from
    the official repos (which contain thousands of packages), their own repositories
    or the AUR repos, which form a vibrant part of life on Arch.


    So Arch isn''t for everyone – GUI-guided users, requiring manual partitioning,
    configuration and setup. By completing this process, you''ll not only learn how
    your system works, but also pass a test to show you''re competent enough to get
    the most out of it.


    Arch doesn''t come with a default environment out of the box – you''ll need to
    choose the environment you prefer. Want GNOME? It''s easy to get as close to desktop
    as possible once you''re comfortable with Arch.


    But for development, particularly Linux development, it''s a good choice. The
    requirement to configure the system yourself provides a much higher level of control
    and the rolling release key system components, such as the kernel and libraries,
    give you a head ahead of other users on more traditional distros.


