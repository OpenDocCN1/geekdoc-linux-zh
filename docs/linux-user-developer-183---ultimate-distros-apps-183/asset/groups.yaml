    Pi tablet


    ![](img/a737bad617574f57f6d992ed4c1f4814_65_0.png)


    With this project, Vorkoetter takes the term ''Pi hack'' and applies it literally
    by hacking down a Raspberry Pi 3 B to the base essentials for the job, combining
    it with a 7-inch display to create a sleek device. The streamlining efforts reduce
    thickness from 40mm for the Pi and display down to 17mm with so many intelligent
    touches: an aftermarket $5 module for a real-time clock, and a modified Adafruit
    PowerBoost 1000 with homemade headers, de-shown controller and battery monitoring.


    I knew I needed battery monitoring and somehow allow for an orderly shutdown,
    although I wasn''t completely sure how when I started. After I received the PowerBoost
    1000C, I did some experimentation to define the design for the architecture.


    Stefan Vorkoetter is an R&D fellow with Maplesoft which is a Canadian manufacturer.
    His software development company most of his background projects is a single-seat
    plane.


    For the battery monitoring, I had actually settled on a simple, more complex circuit
    than I needed: a bigger buck (chip-and-pump) and more complex circuit to control
    the battery voltage to 100%, 50%, 25%, 12.5%. Then one day, probably while driving
    home, I realised I could do a better job with half the parts. The project was
    not as simple anymore.


    # Like it?


    Stefan has projects on a Pi-based system built into the housing of a Hammond!
    He''s also working on the aerodynamics of his car for better efficiency and he''ll
    "probably" putting a Pi in there well...


    You added a number of components that were missing from the Pi, as stripping away
    a lot of things - I realised I would need more RAM. Don''t worry me, the Pi works
    better with 1GB than mine. The project has been much slower since I put Linux
    on it, but 2GB would be a big improvement.


    The other thing that would really help your project is some of adding to RAM or
    GPU


    # Can you tell us about some of the code here?


    There are basically two things that I wrote. A daemon, started at boot, runs in
    the background, monitoring the battery voltage, buttons and power switch. It controls
    the screen (from Tom tatto) to the foreground, apps, and communicates with the
    status dashboard. The daemon also monitors the current, the temperature, and uses
    the interrupt to turn the daemon on and off (to save power) and controls automatic
    screen brightness.


    The code is written in C, since that is what one daemons in, and I''ve been using
    C programming since the mid-90s. I never wrote much Python code, except for the
    status dashboard. The status dashboard is written in Python using Lazarus, which
    is very similar to PyQt''s Delphi that I''ve used before.


    > “I''ve been elections to use for a long time”


    Right, the disk has to be booted, and that takes about 25 seconds, which is a
    long time if you just want to check the weather. There are also some glitches
    that need fixing, like the inability to use Bluetooth devices when the wi-Fi is
    in active


    # Would you like to tell us something next time?


    You seem to have the powered it comfortably when the battery is low? I think there
    are several problems. One is probably that I''ve been doing this for a long time
    (learning from father and hardware). I''ve been doing elections into the project
    I am about to be newcomers to fellows (or at the University of Washington) I think
    the other thing is that it''s not right of the analogue realm, having designed
    and built a partly of analogue circuit from the 1970s for an age clock and a partly
