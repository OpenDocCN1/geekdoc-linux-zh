    # 树莓派项目


    ## 树莓派平板电脑


    ### 优雅、流线型的设计可能胜过最小和最大的自制树莓派平板


    ![](img/a737bad617574f57f6d992ed4c1f4814_65_0.png)


    在这个项目中，Stefan Vorkoetter 采取了“Pi 黑客（Pi hack）”一词并从字面上执行了它：通过削减树莓派 3 B 仅保留任务所需的核心组件，将其与
    7 英寸屏幕相结合，创造了一个精美的设备。这些精简工作将厚度从树莓派的 40mm 减少到了 17mm，并包含许多细节：一个用于实时钟的售后模块，以及一个带有自制引脚的改进版
    Adafruit PowerBoost 1000。


    Stefan Vorkoetter 是 Maples 公司的研究员，他大部分项目的软件开发都是单人完成。对于电池监控，我实际上选择了一个比我需要的简单但更复杂的电路：一个更大的降压芯片和更复杂的电路来将电池电压控制在
    100%、50%、25% 和 12.5%。然后有一天，在回家的路上，我意识到利用这些零件可以做得更好。这个项目不再那么简单了。


    喜欢吗？


    Stefan 有一个构建在 Hammond 外壳中的、且基于树莓派的系统项目！他还在研究空气动力学以提高效率，并“可能”会在那里放上一个树莓派……你添加了许多树莓派中缺失的组件，因为在剥离许多东西后，我发现需要更多内存。别担心，自从我在上面安装了
    Linux 之后树莓派运行得更好，但内存将是一个巨大的改进。


    ### 你能给我们介绍一下这里的代码吗？


    基本上我写了两部分。一个启动时运行的守护进程，它在后台运行，监控电池电压、按钮和电源开关。它控制从桌面到前台应用的屏幕，并与状态仪表板通信。守护进程还监控电流、温度，并使用中断来开启和关闭守护进程（以节省），），控制自动亮度。


    代码是用 C 语言编写的，我从 90 年代中期起一直使用它。除了状态仪表板外，我没有写过多少 Python 代码。状态仪表板是用 Python 和 PyQt
    写的，这和我之前使用的非常相似。


    > “我搞选举已经很久了”


    对，磁盘需要启动，这大约需要 25 秒，如果你只是想看下天气，这时间太长了。还有一些需要修复的小故障，例如当 WiFi 激活时无法使用蓝牙。


    ### 下次你想再告诉我们什么吗？


    你似乎在电池电量低时运行得很舒服？我觉得有几个问题。一个可能是因为我做这件事已经很久了（从父亲和硬件中学习）。我一直在向即将成为新手的学者（或华盛顿大学）向项目中引入选举。我认为另一点是，这不属于模拟领域，我设计并构建了部分来自
    1970 年代的模拟电路用于时钟和部分真空放大器。我不经常用几个小东西和可能需要 Arduino 的电阻来做事情。


    一个问题是我们忘记关掉它。守护进程会在电池电量低时实际上关闭，但即使是树莓派也能工作到 2.0V 左右。电池会在 2.9V 时断开，但对于电池的寿命来说太低了。我设计了另一个模拟电路，会让
    PowerBoost 在该点断开，并将其拉入两个 USB 接口之间的空隙。如果我重新做这个项目，将其整合到现有的电源板中，自制的电池监控和关机部分是初始计划的一部分，还是你确实为
    PowerBoost 1000 充电器真正需要的？


    # 延伸阅读


    Stefan 最近的项目包括定制腕表、重制 1970 年代用于时钟和部分真空放大器的模拟电路。更多信息请访问 www.stevan.com


    66


    # 组件列表


    - 树莓派型号 3B

    - 树莓派 7 英寸 800x480 多触控触摸屏

    - 32GB microSD 卡

    - Adafruit PowerBoost 1000C 充电器和 3.7 转 5V 转换器

    - DS3231 温度补偿实时钟

    - USB 音频适配器

    - 基于 PAM8302 的单声道 D 类放大器

    - 25mm B80 扬器

    - 电池监控和关机控制电路

    - 6200mAh 锂聚合物电池，提供 4 到 12 小时的寿命（看 YouTube 6 小时）

    - SPDT 滑动开关和 3 个小按键开关

    - USB 和 micro-USB 接口

    - 树莓派 Jessie


    增加了鼠标按钮。这些是使用安装在洞洞板上的损坏鼠标的开关制成的。按钮本身是由 70 年代旧电阻的引脚制成的，并打孔以形成圆形按钮。


    # 有线音频


    Vorkoetter 想要比树莓派提供的更好的音频。他使用了一个 USB 适配器，将其连接到树莓派上的 USB 焊盘。他还需要并保留了插座。


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_0.png)


    # 额外的电池监控


    PowerBoost1000 有一个低电输出 (LBO)，可以信号电池几乎耗尽。Stefan 想要像现架产品那样显示充电状态，因此他添加了电池监控。


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_1.png)


    # 添加时间


    如果缺少互联网访问，树莓派就不知道时间。它不包含实时钟。每次启动时，它都会尝试连接到 NTP（网络时间协议）服务器获取时间，如果失败，则回滚。你可以添加一个
    RTC 钟来修复这个问题，但由于 Vorkoetter 移除了 GPIO 引脚，他接线了一个 DS3231 芯片。


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_2.png)


    ![](img/a737bad617574f57f6d992ed4c1f4814_66_3.png)


    右上角。树莓派平板电脑的设计中有许多巧妙的细节；其中之一是决定为充电和电源转换电路添加散热器，那里正在变热。


