    Arduino 起于意大利交互设计学院（Interactive Design Institute）的一个研究项目。最初的目标是为嵌入式电子提供一种更便宜、更容易的工具。该项目源于
    Processing 语言和环境，学生可以通过基于项目的设计学习基础编程技能。然后增加了 Wiring，一个硬件环境——特别是针对 Atmega328（一种
    AVR 微控制器）。2005 年，Wiring 项目增加了对当时更廉价且现在无处不在的 Mega 的支持。团队随后分支出独立的项目和公司，并命名为 Arduino。Arduino
    发布了第一块开发板 Uno，现在销售几十种……


    # 非常适合……


    在无需过度担心电子设备的情况下开始学习 Arduino。Arduino 还可以兼作硬件或基于计算机的游戏控制器。


    广义上，Arduino 是一块可以握在掌心的小板，上面固定有各种电子元件。中心位置是微控制器，它是设备的核心并提供控制。对于 Arduino 来说，任务主要是将板子边缘的输入/输出引脚设置为高电电，并检查它们的当前状态。在这些引脚和
    Arduino 之间，可以看到连接它的硬件外部世界：传感器、像 Pi 这样的电机、存储和其他设备。如果涉及软件，Arduino 设计用于通过简化的、库驱动的代码通过硬件将物理世界封装起来，并以适中的价格出售。


    > Arduino 所实现的是封装了可编程板，使其能够通过简化的、库驱动的代码轻松与硬件建立界面


    一个年轻的、跨学科的 Arduino 文化应运而生。有了新的设备（且负担得起），爱好者们使用 Arduino 创建了各种设备——有些为日常生活问题提供了实用解决方案，如
    3D 打印机上的双人 Pong 游戏和交互硬件——这些项目展示了社区的巨大潜力。


    美国罗彻斯特理工学院的 Ted Kim 制作了一个不错的鸡尾酒机。通过考虑到传感器的局限性，并克服菠萝汁带来的障碍，Kisman 能够为所有人提供正确比例的酒精。根据需要调整价格和细微的强度。如果一个酒精驱动的项目不能激发灵，还有什么呢？


    # 开始使用 Arduino


