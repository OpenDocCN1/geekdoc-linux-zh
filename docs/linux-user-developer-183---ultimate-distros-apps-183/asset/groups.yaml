    # Review


    # Remote desktop clients


    # Remmina


    # TigerVNC


    A good all-rounder performer which supplies a simple user interface


    Can this fork of TigerVNC do enough to earn its stripes?


    ![](img/a737bad617574f57f6d992ed4c1f4814_81_0.png)


    ![](img/a737bad617574f57f6d992ed4c1f4814_81_1.png)


    +   - If you connect to an NX or RDP server, Remmina also lets you specify the
    resolution for the remote desktop


    +   - You can easily share the clipboard in TigerVNC and choose a screen size


    # Remote control features


    # Remote control features


    It can sniff and discover a VNC server by running on the network and enables you
    to manually tweak the quality of the connection to make good use of limited bandwidth.
    The application uses AES-256 encrypt VNC connections and also offers a button
    to send all keyboard commands to the remote server.


    TigerVNC uses VNC encryption by default, but lacks any verification capability.
    It, however, supports other encryption types on the network. While the default
    options allow the client to verify the identity of the VNC server. You can also
    use it to view-only sessions and run a full-screen session on the guest.


    # User interface


    # User interface


    Before you establish a connection, Remmina asks you to create a profile to define
    parameters for the connection. At the very least, you''ll have to pick protocol
    from a drop-down list and enter the server''s IP address. You also get checkboxes
    to toggle such settings such as a Simple View or disabling encryption.


    The client has a rather straightforward interface that''s easy to navigate, although
    it lacks the ability to automatically sniff VNC servers on the network. While
    the default options for most users, connection parameters can be customised. TigerVNC
    also enables you to share the clipboard with the remote VNC server.


    # Tweakable features


    # Tweakable features


    It has plenty of connection settings under the preferences section. Here you''ll
    find plenty to tweak some auto-settings for the connections and define custom
    shortcuts for hosts. You can also alter aspects of the client''s behaviour and
    define a list of resolutions for the remote desktop.


    Unlike some of others, TigerVNC doesn''t offer any real configurable parameters
    besides those that are available during an active session. Still, you can save
    configuration for individual sessions that can be loaded on subsequent connection
    or from a different client computer.


    # Connection control


    # Connection control


    Remmina has a simple interface for managing multiple remote sessions in a single
    window. When connected, there are buttons for common tasks, such as switching
    to full-screen or scaled mode. You can also change the quality of the connection
    on-the-fly and send keyboard commands to the remote desktop.


    You can press the F8 key during an active session in TigerVNC to bring up a menu
    with links to view connection data and toggle the Ctrl Alt keys. You can also
    change the encoding and colour level of the connection and convert the session
    into a view-only mode.


    # Overall


    # Overall


    It exposes a great number of features without compromising the usability of its
    minimal intuitive interface. It''ll work for occasional remote desktop users and
    full-time users.


    A cross-platform client that performs well and offers all the features that regular
    remote desktop users need. That, said, it lacks some conveniences offered by its
    peers.


    ![](img/a737bad617574f57f6d992ed4c1f4814_81_2.png)


    ![](img/a737bad617574f57f6d992ed4c1f4814_81_3.png)


