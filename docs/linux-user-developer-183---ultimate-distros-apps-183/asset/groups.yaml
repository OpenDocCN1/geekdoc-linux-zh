    # Practical Pi


    # Reviews


    # Back page


    - 66 Pi project: Stefan Vorketter has created probably the smallest and lightest
    homemade Raspberry Pi tablet

    - 81 Group test: Remote clients enable you to take charge of all computers in
    your network without leaving the comfort of your armchair, but which is the best?

    - 96 Short story: A vision of the near-future awaits. A young girl lost without
    her phone...

    - 68 Minecraft: From one Pi to another, hack into a pal''s Minecraft world over
    a local network

    - 86 Hardware: Has Cubeach finally cracked the single computer market with the
    regular CubeBoard 6?

    - 70 MP3 player: Build your own portable music player using a Pi Zero and Speaker
    pHAT

    - 88 Distro: The second release of the Raspberry Pi Desktop brings most of your
    Pi distros

    - 74 Doomsday switch: Create a ''doomsday device'' to launch a special code when
    triggered

    - 90 Fresh FOSS: Ghost 1.0 blogging, FixWi 0.99 UNIX kernel, DataMelt 0.2 visualisation
    and CommonMark 0.280 MD converter

    - 78 Python column: Learn how to handle multiple tasks simultaneously in Python


