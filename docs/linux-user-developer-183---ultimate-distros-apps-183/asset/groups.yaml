    \n教程可用：\nfilesilo.co\n\nJavaFX 是一个用于 Java 的强大图形框架。通过使用提供的艺术素材和本教程中的编程技巧，你将为我们在上一个教程中制作的游戏创建一个复杂的图形界面！\n\
    \nJava 语言特别擅长的领域之一就是图形用户界面，或 GUI。在教程系列的第二部分中，我们将学习如何使用 JavaFX 的力量。上个月我们创建了一个游戏，玩家可以在地图上行走，收集会孵化成动物的蛋。在这一部分中，我们将用\
    \ JavaFX 组件替换基于控制的输入和输出，这将有助于演示 Java 中继承和多态的力量。\n\n你应该确保你的系统中已经安装了 JavaFX 的 OpenFX\
    \ 实现。我们建议你通过包管理器使用 OpenJFX。在大多数发行版中，该包名为 `openfx`，因此你应该在安装 OpenJFX 之后安装它。\n\n\
    一旦你完成了本月的教程，请在 Eclipse 中打开项目。上个月的项目以 eclipse 文件的形式包含。要这样做，选择 `File > Import...`，在菜单中选择\
    \ `General > Existing Eclipse Projects`，然后点击 `Browse...` 并导航到 `.tar` 文件进行导入。\n\
    \n花些时间玩玩游戏，熟悉 N/S/E 键、搜索、捡取和背包物品。如果你加入了本月的教程，也请查看代码，以理解它是如何与游戏工作的。\n\n提醒一下——Java\
    \ 是一个功能丰富的库，我们无法在一篇文章中涵盖你需要的一切。本教程的目标是教你足够的 JavaFX 知识以便你构建基础 GUI，从而让你的 GUI 实现你想要的功能。通常，Oracle\
    \ 文档（http://docs.oracle.com/java/api/）是一个极好的参考指南，尽管你可能会找到更详尽且更容易学习的教程。\n\n当你对文本指南感到熟悉后，我们导入本月的额外代码。要这样做，导航到\
    \ `File > Import...` 并选择 `General > Archive File`。图 1 中的对话框将会出现。选择顶部的 `Browse...`，在右侧找到光盘上的\
    \ `eggsExtra_It.tar`。然后，在底部 \"Into\" 文件夹下选择 `Browse...`，点击 `eggs` 项目并点击 `Next`\
    \ 将新文件添加到现有项目中。这将向项目添加一个新包 `load.eggs`，其中包含一些新文件。它还会创建一个目录 `src/main/resources/`，其中包含补充材料，包括一些你可以使用的专门制作的素材。资源目录出现在\
    \ Eclipse 窗口左侧包资源生成器的顶部，如图 2（叠加层）所示。现在我们可以开始了。\n\n## JavaFX 连接\n\n当我们加载新的 `App.java`（我们在上个月教程中创建的\
    \ App）时，注意 JavaFX 对其核心概念使用了一些术语。应用程序中的顶层容器被称为“stage（阶段）”，它具有显示一个或多个“scenes（场景）”的能力。场景是\
    \ JavaFX 用于完全更改的界面；例如，我们能够从主应用程序切换屏幕。屏幕切换后，一个场景会被替换，主程序将显示另一个。这种机制非常强大，我们可以无缝地移动屏幕，而无需从阶段中卸载所有组件。\n\
    \n在场景之上，我们使用 UI 组件——例如，文本框和图像。在 JavaFX 中，这些组件被称为“nodes（节点）”，它们组织在一个名为“scene graph（场景图）”的族树中，其中节点被设计为子节点。\n\
    \n> JavaFX 允许我们使用 CSS 对图形元素进行样式处理，CSS 是一种专门为此设计的语言。\n\n对于节点，JavaFX 简化了编写 UI 代码的过程，因此你不需要担心隐藏不同的组件。简单的规则是：如果父节点显示，那么它的所有子节点都会显示。例如，如果我们子节点中有一条水平线。如果显示它的\
    \ HBox 不再出现，所有子节点都将消失。现在我们必须处理任何类型的布局面板的可见性）添加 `Parent` 类。`Parent` 类将子节点存储为节点的\
    \ `ObservableList`，我们可以通过 `getChildren()` 获取它们。`ObservableList` 实现了 `List` 接口，因此我们可以使用与向普通列表添加元素相同的方法来添加和删除。示例参见图\
    \ 3（叠加层）。\n\n最后，有一个直接放置在场景上的“root（根）”节点。根节点是 GUI 上所有节点的执行者。如果它是根节点的后代，它就会被显示。\n\
    \n创建 JavaFX 应用程序要遵循的步骤是：\n1. 创建根节点（通常是某些 `Parent` 类型）。\n2. 使用 `getChildren().add()`\
    \ 将节点添加到场景（通常是更多 `Parent`）以处理应用程序的不同部分，或者是一些组件（）。\n\n## IDE 是一个强大的工具\n\nEclipse\
    \ IDE 提供了许多你在开发 Java 程序时应该使用的工具。由于 Java IDE 让实现接口类和“对话框”的自动化变得简单，它帮助我编程得更快了。另一个工具是“Refactor（重构）”，它提供了重命名类、方法和变量的工具——这是保持代码整洁并维护自动代码生成的方法。\n\
    \n当你编写时，IDE 在代码右侧产生错误消息，看起来可能像小红点。悬停在错误上会显示信息。点击这些错误的工具提示将弹出一些选项，这些选项可以自动执行。你应该使用它们来帮助撤销你在\
    \ IDE 中做的更改，它们可以是一个非常有用的工具。例如，如果你需要替换从一个调用的方法，在图 2（叠加层）中，程序员有 `GridPane`，但此类尚未导入。幸运的是，当我们点击错误时，点击“quick\
    \ fix（快速修复）”选项，Eclipse 会生成该语句。\n\n上方：Eclipse 可以方便地向现有项目添加新的文件系统。\n\n## Java 教程\n\
    \n## JavaFX\n\n在图 2（叠加层）中，程序员有 `GridPane`，但此类尚未导入。幸运的是，当我们点击错误时，点击“quick fix（快速修复）”选项，Eclipse\
    \ 会生成该语句。\n\n![](img/a737bad617574f57f6d992ed4c1f4814_44_1.png)\n\n## JavaFX\n\
    \n为了使用 JavaFX，你需要了解 JavaFX 为你可以使用的不同元素提供的所有不同属性。\n\n## JavaFX（继续）\n\n```java\n\
    public class MyApp extends Application {\n    @Override\n    public void start(Stage\
    \ primaryStage) {\n        Button button = new Button(\"OK\");\n        button.setOnAction(e\
    \ -> {\n            System.out.println(\"Button clicked!\");\n        });\n  \
    \      StackPane root = new StackPane();\n        Scene scene = new Scene(root,\
    \ 300, 250);\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
    \    }\n}\n```\n"
