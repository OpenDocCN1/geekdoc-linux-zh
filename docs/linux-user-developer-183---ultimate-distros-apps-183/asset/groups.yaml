    DataM IDE, and a three-pane view into DataM that most users will feel at home
    with - at least


    enough to click around and trying out included examples like calculations and
    visualisations on their own data sets. Preferring Python to Java, we ran most
    of our tests from the Jupyter shell, it is much more convenient, but in this environment
    this could be your best choice.

    DataM is licensed by the GNU GPL (version 3), as many of the external libraries,
    the documentation libraries, examples, installer, code asbase and others are not
    on the GPL license. It is not only for academic research, science and education.*
    As well as preventing distribution with OS like Debian, you may need to be careful
    what libraries and data sets you use in your project.


