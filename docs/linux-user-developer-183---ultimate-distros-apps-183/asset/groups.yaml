    ## Web 开发者


    ### Adobe Flash 会开源吗？


    Flash 可能会在 2020 年截止日期之后继续存在


    事实证明，与多年来作为网络“替罪羔羊”的 Flash 告别可能并非良事。Adobe Flash（以及 Shockwave）即将于 2020 年停用，这对某些人来说来得有点快了。原因很简单：历史。作为网络前二十年的重要组成部分，Adobe
    Flash 曾是一个多媒体平台。它的功能不仅限于播放视频和电影预告片；Flash 和 Shockwave 还用于艺术表达。


    由于有大量老旧但仍在运行的网站需要 Flash，需要一种解决方案来让它们在 2020 年继续运行。这是一个非常简单的解决方案：但 Adobe 会同意开源吗？


    如果至少有几个带翅膀的解决方案。由 Julia Lister 开发的 GitHub 上的第一个请愿。Flash 及其首个项目 Shockwave 是互联网历史的重要组成部分。


    终结 Flash 和 Shockwave 意味着失去了对过去的访问能力。游戏、实验以及不再使用的网站。


    ## 硬件


    ### GPD Ubuntu 版发货


    ### 可以放进口袋的超便携电脑电脑


    在 IndieGo 众筹成功筹集了 200,000 美元和 1,516 人支持后，中国硬件制造商 GPD 已发出了其超便携电脑。它配备了六核 Atom CPU、8GB
    内存和 128GB 存储空间，其 8 小时的电池续航是游戏规则改变者。


    键盘与任何笔记本电脑一样，但触控板被波纹式控制器取代。GPD Ubuntu 版尺寸为 138x108mm，拥有一个令人印象深刻的 5.5 英寸屏幕。比 7
    英寸平板厚一点，拥有 1920x1200 像素的 IPS 触摸屏。


    GPD 正在开拓一个完全不同的市场。这款口袋笔记本电脑采用了 (a) 由镁合金制成的纯 CNC 全金属机身，这意味着其工艺足以制造 MacBook Air。它是一个可以放入口袋的轻量级设备，预装了
    Ubuntu。GPD 的其他设备尚没有 Linux 发行版。访问 www.gpd.net/pocket 了解更多信息。请见下期关于 GPD Pocket 的评测。


