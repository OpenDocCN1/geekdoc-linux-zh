    # Welcome

    to issue 18 of LinuxUser & Developer


    ## This issue

    >> Ubuntu distros and apps, p18

    >> Prisonium & Libren 15, p50

    >> The world of Aurora, p56


    ![](img/a737bad617574f57f6d992ed4c1f4814_2_0.png)


    Welcome to the UK and North America''s favourite Linux and OS magazine. This issue
    is packed with features! Prisonium hits the headlines with Librem 15 (p50), and
    we''ve introduced CEO Todd Weaver. Next we met up with Richard Brown to explain
    open-source projects and compared plans for Ubuntu (our partnership). We also
    deemed it time to complete all our usual tutorials and regulars, starting at p36.


    This issue, we have a new series called InspireOS(p32) where we highlight people
    who are attempting to change the world. The word ''inspire'' refers to a sense
    of ''breathing space'' or dare not to be inhibited by the ethos of using open
    source technology to overcome challenges supplying high-quality education to kids
    in the remotest parts of world. And, if you don''t agree with our ultimate distros
    and apps (p18), write in and save your day! Chris Thomas, Editor Get in touch
    with the team: linuxuser@future.com


    For the best subscription deal here:

    www.mylinuxusermagazine.com/sub

    Save 20% on your subscription! See details:

    - Facebook: facebook.com/LinuxUser

    - Twitter: @linuxusermag


    ![](img/a737bad617574f57f6d992ed4c1f4814_2_1.png)


