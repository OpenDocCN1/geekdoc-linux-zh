    But the key points: there is always a balance between data safety (dont delete
    important by accident) and disk space. Maintaining this balance with this modern
    tooling requires users to learn new concepts and consider new variables.


    The lack of encryption has been cited by industry players (including Google, www.google.com/list/btrfs-66535.html)
    as a major impediment for Btrfs, but with Matthias Eckmann recently alerted to
    it in a blog post ''Future: Are we ready yet?


    All SUSE open distributions have extensions for storage encryption, including
    LUKS for partition encryption and eCryptfs for file-based encryption. As part
    of the LUKS we have recently developed a tool which brings an open implementation
    of the KIND standard to require dedicated keys and keep it secured. Long term,
    we''d like to see Btrfs have its own encryption solution, but until the effectiveness
    of such solutions is proven, this is highest priority for us.


    # Does deprrecation of Btrfs by Red Hat change the fact for the Cubic Project
    and SUSE?


    There is a blog post by Matthias Eckmann which covers the topics about Btrfs,
    Red Hat and SUSE in detail: http://bit.ly/3i777. Since Red Hat was never a major
    competitor to Btrfs, this announcement from Red has no impact on our plans.


    # What are the benefits of using Btrfs for project Cubic?


    There are a lot of solutions for transactional (like ''Atomic''). An option is
    to use a root partition containing the entire installation system. As a result,
    the number of snapshots for rollbacks is limited to the number of partitions.
    Not only is it limited, but it is also very difficult to manage.


    Other solutions are to use a new package format. The great disadvantage is that
    it discards all the knowledge about Linux kernels and distributions which Btrfs
    handles natively.


    When we were looking at this problem, we sought a solution which is both different
    and leverage our extensive knowledge and is tool with RPM. We didn''t want to
    reinvent the wheel again.


    ![](img/a737bad617574f57f6d992ed4c1f4814_14_0.png)


    Using Btrfs with snapshot and rollback allowed us to find any advantage of changing
    the package format.


    Using Btrfs as a copy-on-write (CoW) file system with snapshots and rollback updates
    without changing the format, we have a very efficient solution (that only require
    the amount of disk space which is really changed). The number of snapshots you
    can save is now only limited by the size and the disk of the updates.


    # Can you explain what you mean when you describe the Cubic Project as an ''innovator
    for ideas and innovations?''


    As we are selling the operating system of openSUSE and SUSE SaaS platform, it
    is not bound by the restrictions of a multipurpose OS it exists with a single
    purpose, to not contain workloads. We are free to introduce new technologies and
    ideas like transactional updates and a read-only file system, which would not
    have been possible with traditional openSUSE or SLE releases. We are gaining experience
    with these new technologies, and we are in a position to talk about what we mean
    by multipurpose OS and how to integrate it. Not all in Linux may make sense, or
    be possible, to integrate in that, but by ''cutting edge'' with the same tools,
    tooling and processes that we use for all of our systems, we have a streamlined
    environment to experiment and where we need to while swapping and sharing ideas,
    innovation and when we can.


    # How can people get involved in the Kubic project?


    Right now, the easiest way to contribute is directly to the openTumbleweed project,
    which acts as the ''factory'' for both the Tumbleweed and Tumbleweed-hybrid distributions
    (http://bit.ly/3XopenSUSEFactory). If you are more interested in the deeper components
    of Cubic, such as we or transactional updates, they are all available on GitHub
    at https://github.com/opensuse/cubic-project.'
