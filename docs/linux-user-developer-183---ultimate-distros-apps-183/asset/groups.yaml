    Manage partitions using a graphical environment. Partitions can be moved, resized
    and copied without data loss.


    ## PhotoRec


    A data recovery tool which can recover lost videos, photos, documents and archives
    from internal and removable storage.


    ## TestDisk


    TestDisk is a tool designed to recover deleted or damaged partitions and non-booting
    disks usable again.


    # Feature Ultimate Distros & Apps


    ## BEST DISTRO FOR ROLLING RELEASE


    Experience the best of openSUSE with instant updates courtesy of Tumbleweed


    ## openSUSE Tumbleweed


    The majority of Linux releases work on a fixed release: A cycle is released, it
    will receive updates for a period of time and then becomes obsolete, which adds
    extra overhead for users. This method of updating does not work well for establishing
    stable and beta releases, but a rolling release will begin on its successor.


    A rolling-release distro delivers packages on a rolling release, which means they
    arrive much more quickly, potentially at the cost of uptime stability. One of
    the most popular rolling-release distros is Arch Linux. The rolling-release version
    of openSUSE - Tumbleweed - brings the concept of a rolling release to the Linux
    desktop.


    The openSUSE distro has among GNOME and KDE Plasma as its desktop environments.
    OpenSUSE is particular for offering many desktop environments on a system - allowing
    you to select which one you would like to use for something that will not break
    on the others. One of the most popular openSUSE features is the control centre,
    which is used for configuration settings and, as a whole, brings easy package
    management. Underpinning openSUSE is ''Factory'', which creates the ongoing platform
    development for the distribution, from which regular-openSUSE (Leap) releases
    are taken as snapshots. The Tumbleweed rolling release receives updates as soon
    as they are integrated into Factory and Stable.


    Should you consider using a rolling release? If you are a developer and want to
    be the one who handles the bleeding edge, then yes. Otherwise, stick to the main
    Leap releases if your system is reliant on proprietary graphics drivers or third-party
    kernel modules which may not be available. Since Tumbleweed integrates the latest
    kernel updates, different drivers may need to catch up with the kernel version.


    If you prefer a stable release, particularly because of its lack of drama, openSUSE
    is a great distro as a whole and Tumbleweed enhances the experience.


