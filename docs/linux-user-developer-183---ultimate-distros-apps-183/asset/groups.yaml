    Jon Masters 讨论了内核社区的最新动态，随着 4.13 的发布和 4.14 合并窗口的开启。


    ![](img/a737bad617574f57f6d992ed4c1f4814_15_0.png)


    Linus Torvalds 宣布 Linux 4.13 正式发布，并注意到内存管理中一些最后时刻解决回归问题的英雄：Jérôme Gisse 帮助了发布按时进行。此外，Linux
    特别提到了一个“小变化”：CIFS 文件系统，它需要协议的新最小版本（3）。这一变化使得那些（希望）仍在使用 SMB 的少数人需要在网络中采取主动行动（添加
    v2 挂载选项）以适应 Linux 4.13。


    Ying Huang (Intel)。“预读”的想法非常直观，它是计算中一个常用概念。数据局部性意味着相关数据通常离已经获取的数据很，因此通过从磁盘中读取比严格请求的更多数据块，并缓存额外数据，这样做的开销被组合样本中实现的实现的效率和吞吐量所抵消了。


    Linux 4.13 现在包含了许多新特性，包括改进的进程间通信（它将为用户空间提供更好的支持）、改进的页面交换、通过 GCC 插件架构实现的内核布局随机化，以及在
    Ubuntu 内核中已携带多年的几个新 AppArmor 补丁。许多其他小补丁也被回到了未来的系统管理。


    涉及到交换（swap）时，Linux 存在传统问题。但内存（RAM）中由旧索引的物理地址并不一定需要交换。Yang 的补丁改变了这一点，允许从非连续区域读取内存，但仅在本地模式下避免性能下降。


    此外，Garrett Larson（页错误功能的作者）使用了特殊代码来响应内存不存在的情况，可以直接从文件读取内存，而不持有锁，“mem_lock”补丁允许映射任务结构以处理用户空间页错误，并将回退到慢交换（以及并发访问或调度底层任务）。


