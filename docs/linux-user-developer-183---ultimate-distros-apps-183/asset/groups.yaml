  - "[PAGE 36]\n\n# Conditional expression\n\n# Returns true if\n\n| [[ num1 -eq num2\
    \ ]] | num1 and num2 are equal |\n| [[ num1 -ne num2 ]] | num1 and num2 are not\
    \ equal |\n| [[ num1 -lt num2 ]] | num1 is less than num2 |\n| [[ num1 -le num2\
    \ ]] | num1 is less than or equal to num2 |\n| [[ num1 -gt num2 ]] | num1 is greater\
    \ than num2 |\n| [[ num1 -ge num2 ]] | num1 is greater than or equal to num2 |\n\
    | [[ str1 = str2 ]] | str1 is the same as str2 |\n| [[ str1 != str2 ]] | str1\
    \ is different from str2 |\n\nAbove Bash's if statement provides useful comparison\
    \ operators\n\nfollow with then and **elif** commands if we want to add additional\
    \ branch cases (corresponding to the **else if** construct from other languages),\
    \ then use the **else** keyword.)\n\n> Most languages provide a simple-for-loop,\
    \ and Bash scripting is no exception\n\n```\n#!/bin/bash\nnumber_of_files=$(ls\
    \ | wc -l)\nif [ \"$number_of_files -gt 100 ]; then\n    echo \"more than ten\
    \ files in the working directory\"\nelif [ \"$number_of_files -gt 10 ]; then\n\
    \    echo \"more than ten in the working directory\"\nelse\n    echo \"ten or\
    \ fewer files in the working directory\"\nfi\n```\n\n```\nnumber_of_files=$$(ls\
    \ | wc -l)\nif [ \"$number_of_files -gt 10 ] &&\n    if [ \"$number_of_files -le\
    \ 20 ]; then\n        echo \"10 and 20 files in the working directory\"\nfi\n\
    ```\n\nAs with assignment, the use of spaces is important when writing conditionals:\
    \ you must leave a space after the opening [ and before the closing ] or the script\
    \ will not work. Similarly, it is important to include the keyword after each\
    \ if or elif branch (but not the else clause); otherwise you will get a syntax\
    \ error.\n\n# For loops\n\nMost languages provide a simple-for-loop, and Bash\
    \ scripting is not. The basic operation of a for-loop in Bash is to iterate through\
    \ a sequence of:\n\n```\nfor s in line\ndoe echo $s\ndone\n```\n\nHere, the first\
    \ line sets the variable s to be about each of the lines. It is, and in then executing\
    \ the body of the loop (between **do** and **done**) each time that particular\
    \ value of s is used. This might not seem useful on its own, but when we combine\
    \ it with globbing, the results can be powerful for.\n\nThe —gt operator stands\
    \ for 'greater than' and can be used to compare integers. Bash provides a number\
    \ of operators that can be used to test other things. For example, if [[ -f name\
    \ ]] tests whether a file name exists in the working directory, and if [[ -d name\
    \ ]] tests whether the file called is a directory.\n\nYou can combine conditions\
    \ using the AND-&& and OR operator ||, just as in other languages, e.g:\n\n![](img/a737bad617574f57f6d992ed4c1f4814_36_0.png)"
  - "[PAGE 37]\n\n# # Tutorial\n\n# # Essential Linux\n\nCommand-line options\nYou\
    \ might want your script to accept command-line switches, as commands do (e.g.,\
    \ `echo -n`). To do that for this purpose, getopt can parse the switches into\
    \ a separate variable. You can find out more by typing `man getopt`.\n\n| Figure\
    \ 2 |\n| --- |\n| #!/bin/bash |\n| for i in ./* |\n| if [[ -d \"$i\" -n \"$i\"\
    \ ]]; |\n| then |\n| number_of_files=$(ls $i | wc -l) |\n| if [[ $number_of_files\
    \ -gt 10 ]]; |\n| then |\n| echo \"directory contains $number_of_files\" |\n|\
    \ fi |\n| done |\n\nor to 12. If the test is true, bash executes the body of the\
    \ loop and then adds 4 to the value of **i**. We have used variables **start**,\
    \ **end** and **jump** to order the power of this syntax, but you could just easily\
    \ as have the values straight into the loop.\n\nShell parameters\nAs we saw at\
    \ the start of this series, commands can be passed arguments after the name of\
    \ the command. For example, we can type `ls` or the full path `/bin/ls`. A script\
    \ can take an arbitrary number of parameters at the command line and refer to\
    \ them within the script. We refer to parameters using the variables `$1`, `$2`,\
    \ `$3` and so on. For example, save the script as reverse.sh\n\nUsing **Bash**\
    \ in conjunction with globbing allows us to iterate over the directories\n\nExample,\
    \ we might want to get a list of the directories in the working directory containing\
    \ more than ten, and we can do so using **Figure 2**.\n\nA slight variation of\
    \ this technique is to use a for-loop iteration that is more similar to that in\
