    功能非常完备，但某些功能仅适用于 Windows 用户。


    # Vinagre


    GNOME 的默认客户端在活动会话期间缺乏控制选项。


    ![](img/a737bad617574f57f6d992ed4c1f4814_82_0.png)


    - 该项目有一个 Android 客户端，针对网络连接进行了优化。


    ![](img/a737bad617574f57f6d992ed4c1f4814_82_1.png)


    - Vinagre 有一些巧妙的功能，例如“反向连接”选项，可以访问位于防火墙后的主机。


    # 远程控制功能


    TightVNC 提供的功能与 TigerVNC 非常相似，这并不令人意外，因为它们都源自同一个源码。TightVNC 的一些独特特性（如文件传输功能）仅供
    Windows 用户使用，这很遗憾。


    # 远程控制


    Vinagre 与 Remmina 非常相似。Remmina、Vinagre 和 VNC 都支持 RDP、SSH 协议，它们还可以嗅探并连接网络上运行的任何
    VNC 服务器。Vinagre 还可以通过 SSH 隧道传输 VNC 连接，允许你访问网络上的远程机器。


    # 用户界面


    你必须输入 VNC 服务器的 IP 地址，或让程序检测网络上的 VNC 服务器。它允许你自定义任何设置，与 TigerVNC 不同的是，TightVNC 在一个窗口内列出了所有可用选项。


    # 用户界面


    Vinagre 的界面类似于 Remmina，但提供了许多高级选项。要进行控制，你只需要从下拉列表中选择并输入 VNC 服务器的 IP 地址即可。此外，像
    Remmina 一样，你可以为全屏会话、单窗口视图或缩放窗口配置复选框。


    # 可调设置


    这种远程控制除了建立连接时提供的选项外，缺乏任何全局参数。然而，有一点是 TightVNC 的界面让通过 SSH 隧道建立 VNC 连接变得非常简单。


    # 可调设置


    Vinagre 除了活动连接期间提供的选项外，还有许多可配置参数。你可以使用 Vinagre 选择颜色深度，从 24 位真彩到 3 位超彩色。如果你有资源承担处理开销且服务器支持，还可以开启
    JPEG 压缩。


    # 连接控制


    在活动会话期间，你可以使用顶部工具栏更改连接参数。你可以将 Super、Alt 和 Ctrl 等键绑定到远程服务器。你还可以禁用剪贴板传输并更改鼠标光标追踪方式以及本地光标的大小。


    在任何连接中，你都可以使用 Vinagre 停止向远程桌面发送键盘鼠标输入，将其变为只读会话。你还可以为后续会话标记书签，但在活动连接期间无法更改颜色深度。


    # 总体


    该客户端在功能和形式上与 TigerVNC 非常相似。虽然它的界面相当实用，但最大的缺点是开发者专注于专有平台，而牺牲了 Linux。


    # 总体


    GNOME 的默认远程桌面客户端支持包括 VNC 在内的多种协议，但在活动连接期间提供的控制不如某些同类产品多。


    # 测评桌面客户端


    # 简要：对比我们的评判结果


    | 远程控制 | Remmina | TigerVNC | TightVNC | Vinagre |

    |---|---|---|---|---|

    | | 两个可以识别网络上运行的 VNC 服务器的客户端之一。 | 8 | 支持多种加密方案并允许用户创建只读会话。 | 6 | 由于血缘关系，功能集与 TigerVNC
    非常相似。 | 7 | 另一个可以嗅探网络上 VNC 服务器的多协议客户端。 | 7 |

    | 用户界面 | 要求在配置方案中确认细节以实现快速重连。 | 8 | 简单直观的界面，展示了各种调整选项。 | 6 | 提供了良好的选项而不会让用户感到信息
    overwhelming。 | 8 | 与 Remmina 非常相似，但提供的控制较少。 | 7 |

    | 可调设置 | 提供足够的选项以保持灵活性且不误导用户。 | | 另一个没有全局设置功能的客户端。 | 6 | 遗憾的是，除了连接时没有其他选项。 | 6
    | 无额外的可调选项可用。 | 6 |

    | 连接控制 | 提供在活动会话期间调整连接的有用选项。 | | FB 菜单提供了多种影响活动连接的选项。 | 6 | 活动连接可以方便地修改和调整。 |
    6 | 与其他不同，它需要断开连接才能更改颜色深度。 | |

    | 总体 | 功能足够，对普通用户和常规 VNC 用户都很有用。 | 8 | 性能出色的，但不如某些其他产品充分。 | 6 | 纸面上看起来很好，但逊于其
    Windows 版本。 | 7 | 一个适合偶尔使用的不错的客户端，但不缺少高级功能。 | 6 |


    # 获胜者是...


    # Remmina


    这四个非常相似且在用法上匹配得非常好的桌面客户端之间的竞争确实非常激烈。

    TigerVNC 作为 Linux 上基于 Java 的客户端显得有些格格不入。虽然它可以使用，但它与其针对大多数限制资源优化的自有服务器配合时性能最佳。遗憾的是，相应的服务器仅适用于
    Windows。

    Vinagre 的加入并没那么好，但表现却惊人。它支持多种协议，但提供的控制不如某些同类产品。

