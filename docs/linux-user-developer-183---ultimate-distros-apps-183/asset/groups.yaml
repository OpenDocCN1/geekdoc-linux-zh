    ## 安全性最佳发行版


    ### 概览


    ### 替代发行版


    | BackBox | BackBox 是一种基于 Ubuntu 的渗透测试和安全测试发行版。启动盘的便携性是其核心。 |

    | Kali Linux | 顾名思义，它基于 Arch Linux，拥有超过 1800 个用于安全和渗透测试的工具。 |

    | Parrot OS | 基于 Debian 的操作系统提供免费测试套件，旨在在低端设备上良好运行。 |


    大量的渗透工具和对 Metasploit 的兼容性使 Kali 不可缺。


    ### Kali Linux


    Kali Linux 是一种基于 Debian 的发行版，专为渗透测试安全设计，是行业内具有悠久的渗透测试训练工具。作为类似的 BackTrack 的继者，该发行版包含超过
    500 个预装软件包，可以安装在本地，也可以直接作为现场启动发行版从 CD/USB 或网络进行安装。它支持 x86 和 ARM 架构，并已修补以启用无线注入。Kali
    的安全性通过许多有限数量的开发树（开源并通过 Git 发布）确保，这是其他产品无法做到的。


    可用的针对特定用途的工具不断增加。许多工具与信息安全有关。这在某是因为渗透和安全测试需要尽可能从互联网拉取并从主机环境部分提取，但也是因为该领域有大量的专家。


    仍然可能需要（甚至为了适应用户需求而重新构建）。

    Metasploit 是领先的渗透测试工具包，提供了漏洞测试以及全球最大的漏洞数据库，需要进行更改以允许所需的服务在 Kali 上运行（其他工具也是如此，但对于
    metasploit 来说，除了 Kali 的好处外没有理由使用 Kali）。

    需要明确一点是，绝对没有理由将 Kali 作为你的日常发行版。只有安全相关的软件包，默认用户会在这里感到格格不入，因为外观和感觉是功能性的……这正是我们希望它的样子，但它显然不会带给你预期的功能。Kali
    Linux 准确地显示了它发现了一些——主编辑 Elliot 向我们展示了《机器人》是如何将 Kali 作为他的特定选择的。


