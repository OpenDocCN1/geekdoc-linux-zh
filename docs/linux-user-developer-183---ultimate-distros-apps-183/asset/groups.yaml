    ## 评测新鲜开源软件


    ## 博客平台


    ### Ghost 1.6.0

    基于 Node.js 的博客平台


    ![](img/a737bad617574f57f6d992ed4c1f4814_89_0.png)


    网络上五分之一运行在 WordPress (WP) 上，它是一个非常棒的管理系统。但如果没有一个漂亮的博客，在没有干扰的情况下，我们需要比十年前的 WP 更好的东西。Ghost
    的诞生正是为了这一目标。基于 JS 的程序运行起来顺畅总是一件乐事，特别是考虑到它大部分内容是在 npm 下开发的，而不是由你维护的。如果你在寻找关于何时使用或不使用
    npm 的建议，例如它对于 Debian 来说可能比 README 中提供的建议更好。我们的目标是其他平台，运行本地安装来尝试 Ghost 应该是轻松的——对我们来说确实如此。回想起来，对
    Ghost “省事”声誉的初印象是开始时需要进行一些设置。之后弹出的页面（见截图）提供了管理内容和密码的有用指南——这对于保护一个尚未广泛公开的站点非常有用。此外，还有基于
    Markdown 的编辑器的介绍，它非常用户友好——以及高级 Markdown 功能。


    ![](img/a737bad617574f57f6d992ed4c1f4814_89_1.png)


    ![](img/a737bad617574f57f6d992ed4c1f4814_89_2.png)


    我们一直对启动之如此简单感到惊叹，它运行良好且外观漂亮！


    #### 设置你的 Ghost 主题

    为 Ghost 构建自定义主题非常简单。它使用了一个名为 Casper 的灵活系统，该系统被设计成一个类，带有可以轻松调整的布局选项。


    ![](img/a737bad617574f57f6d992ed4c1f4814_89_3.png)


    #### 优点

    - 外观漂亮，运行良好，安装轻松且易于学习和获取。


    #### 缺点

    - 虽然 Ghost 的存在意义并非成为一个全面的 CMS，但你可能仍然怀念 WordPress 的功能。


    #### 适用场景...

    - 简单——写作和发布，以及个人博客。


    https://ghost.org


    ## 爱好操作系统


    ### Fiwix 0.9.0

    一个简单的 unix 内核，用于


    虽然我们通常不涵盖“即将开源”的项目，但 Fiwix 将其初始发布版本定在 1.0.0，我们可能也想看一看。


    从几何时起，每个人似乎都在编写自己的操作系统。不仅仅是 Linux，在 90 年代后期，还有许多（实际上非常多）像 ViX 这样基于软体的操作系统，它们伴随着世界各地的中小型项目——许多兼容
    GNU/Linux 生态系统的 POSIX 系统。


    Linux 内核的再次兴起是因为 Minix 这种教育类 Unix 类内核是为了运行在 PC 硬件上而创建的。


    #### 优点

    - 易于学习，且足够完整可以作为一个可用的 GNU 内核。


    我们下载了 20MB 的镜像并在 QEMU 下运行，并找到了可用版本——安装仅需 38MB 空间和 2MB 内存；它在五个选项下运行完美。在镜像中，该项目是从
    Red Hat 的 5 系列构建的，它使用类似 SVGA 的源，展示了命令行操作系统的图形能力。我们期待这个自由共享且可修改的内核源码足够小以供人学习。


    #### 缺点

    - 令人困惑的是，在下一次（v1.0）发布之前，源代码尚未以 FOSS 许可证提供。


    #### 适用场景...

    - 正在寻找现代 Minix 进行学习的学生。www.fiwix


    ![](img/a737bad617574f57f6d992ed4c1f4814_89_4.png)


    ## 数学平台


    ### Datelam 2.0

    全面的基于 Java 的计算与可视化环境


    对于一个提供 30,000 个用于计算和可视化的 Java 类的 200MB 软件包，应该从何处说起呢？

    (Datelam 常用一个可扩展平台，结合 Python/Jupyter、BeanShell、Groovy、Ruby 以及 Java 用于统计计算、高级计算，以及从金融市场到工程等各个领域的建模。它的矢量图形包含了所有常用格式，并可以导入到文档中。首次启动（通过包含的脚本）会向你展示
    DataM IDE 的“介绍”，以及 DataM 的三栏视图，大多数用户会对其中感到很亲切——至少足够让他们点击尝试并尝试在自己的数据集上运行包含的示例，如计算和可视化。由于我们倾向于使用
    Python 而非 Java，我们在 Jupyter shell 中运行了大部分测试，这要方便得多，但在这种环境中这可能是你的最佳选择。)


    DataM 使用 GNU GPL (第 3 版) 许可，因为许多外部库、文档库、示例、安装程序、代码库等并不在 GPL 许可下。它不仅用于学术研究、科学和教育。*
    除了防止在 Debian 等操作系统上分发之外，你可能还需要对你在项目使用的使用的库和数据集小心。


    #### 优点

    - 它是全面的，你将从一个可视化平台中学到几乎需要的所有内容。


    #### 缺点

    - 包含了非 GPL 库以及某些特定用例。


    #### 适用场景...

    - 学术研究、科学和教育。

    - Python，Java。


    ## Markdown 解析器与转换器

    ### CommonMark 0.28

    快速 Markdown 转换器


    上手 CommonMark 简单，但有很多东西需要学习。你需要阅读文档以充分利用其功能。基于 CommonMark 的解析器也非常快，但它并非没有某些怪癖之处。


    如果你正在考虑使用 CommonMark，请务必先查看文档。这是一个很好的入门点。


    #### 优点

    - 快速且易于使用。

    - 文档非常优秀。


    #### 缺点

    - 并非没有某些怪癖之处。


    #### 适用场景...

    - 想使用 Markdown 的人。


