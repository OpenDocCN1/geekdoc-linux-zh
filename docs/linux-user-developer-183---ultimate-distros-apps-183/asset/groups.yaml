    # 开源


    06 新闻与观点 | 10 字母 | 12 采访 | 12 内核专栏


    ![](img/a737bad617574f57f6d992ed4c1f4814_5_0.png)


    # 移动开发


    ## Purism 确认 Linux 手机


    基于 Linux 的智能手机，加密通话是这类侧重安全手机的关键功能。


    开源的故事并不是一个快乐的故事。虽然 Android 可能基于 Linux 内核，但其库和几乎所有其他都是免费的。指出 Linux 手机的例子并不难，但这过于简单化了。

    毕竟，在最新的三星手机中，几乎没有什么是开源的。

    随着移动领域新获得的独立性，Social Purpose Purism 公司正在推出其比以前更好的自己的 Linux 手机，并宣布 Librem 5 将于
    5 月上市。


    最可能的硬件和用户控制权。这创造了一个让人们可以控制自己移动设备体验的未来，就像我们在使用 GNU/Linux 和自由或开源软件时控制笔记本一样。

    简而言之，如果你对 Android 和 iOS 缺乏隐私保护感到沮丧，你可能对 Librem 5 感兴趣。它是一款不会跟踪你的智能手机，并且包含了针对 Wi-Fi、蓝牙和电池的硬件物理开关！


    在 Purism 于 www.purism.com 成功完成众筹（目标为 150 万美元）后，Librem 5 将是完全去中心化的，设计上进行了加密，并将预装
    Purism 的 PureOS3，并提供让设备能够像桌面电脑一样工作的融合技术。


    计划在移动设备上提供前所未有的隐私和安全体验并非易事。因此，Purism 正与 Matrix 合作，为第一款 Matrix 驱动手机提供通信安全，并为去中心化数据消息应用提供原生端到端加密。


    > 上方：融合技术让 Librem 5 具备桌面级功能


    采用上游优先的开发方法，而不是创建一个较小的移动操作系统。

    从制造的角度来看，Purism “通过小批量制造来减轻前期成本需求，包括为了在用户端的安全、隐私和自由方面建立深层信誉的硬件需求”。我们基于之前交付小型侧重安全的笔记本电脑和平板电脑的经验，Purism
    拥有一个值得信赖的供应链。

    简而言之，Librem 5 的一切看起来都很不错，距离向媒体发布还有 52 天，资金已达到 10.84%。


    在与 LUAD 的独家聊天中，Purism 首席 Todd Weaver 表示：“Librem 5 摆脱了自由开源软件，具有去中心化的基于 IP 的加密通信，这为用户提供了


    # 前五名


    ## 前 5 大 Linux 音编辑工具


    ![](img/a737bad617574f57f6d992ed4c1f4814_6_0.png)


    ## 硬件

    ### 搭载 Ubuntu Budgie 的 Nimbuslaptop 电脑

    ### 系列笔记本电脑和台式电脑


    继美国零售商 System76 之后，位于纽卡斯尔的泰恩的 Nimbuslaptop 将推出系列配带有 Ubuntu Budgie 的台式机和笔记本电脑。从
    299 英镑的强力 Alvern 到 1299 英镑（可售），一对一体机台式电脑从 699 英镑起。。所有基础配置和型号都可以配置 CPU、内存、存储、驱动器、显卡和操作系统。凭借其优雅的机壳和背光键盘、多点触控板和
    USB 3.0 端口，这些设备由 Nimbuslaptop 硬件设计。Whitehouse OEM Cle 提供硬件。


    对于桌面选择提供了 13 英寸 LTS 版本，Ubuntu Budgie 17.4 已适用于所有设备。Ubuntu Budgie 起于 2016 年 11
    月作为 Budget-Mix 发布，是带有 Budgie 桌面的 Ubuntu 轻量版本，由 Solus 项目背后的团队开发。在最初发布后，Ubuntu Budgie
    在 2017 年 4 月被采用为 Ubuntu 的官方社区版本。


    三台电脑（两台笔记本电脑，一台台式机）仅提供 Budgie 版本，这些 Ubuntu Budgie 版本是吸引用户的关键。


    MD Chris Harvey 告诉我们：“我们很高兴能与 Budgie 合作，我们认为与我们的硬件结合是一件很棒的事。它优雅又易用。在我们的型号上预装将对用户帮助。Budgie
    将获得这些产品收入的一部分，这将有助于资助社区。


    Nimbuslaptop 还推出了其自己的 Linux 发行版。我们的操作系统将基于 Plasma 和 Linux，但我们目前正在开发中。

    目前还没有发布日期


    ## 1 Audacity

    作为大多数 Linux 用户的免费默认选择，Audacity 可以完成从录制和编辑多轨道音乐到获取在线电台音频和其他语音工作的所有工作。通过社区开发的插件，可以为
    Audacity 提供额外功能以及导入输出选项。


    ## 2 Ardour

    Ardour (http://ardour.org) 能够录制、编辑和混合，面向音乐家、作曲家和音频工程师，支持数百个轨道。封装版本可以选择一次性付费或订阅，或者选择完全免费的“由你完成”选项。


    ## 3 LMMS

    LMMS 在 lmms.io 是免费的，其目的是制作音乐。具有基于 Ubuntu 的乐器、高级路由、无限轨道以及对大多数密钥的任意效果支持，并等待 VST
    支持。


    ## 4 OpenOctave 项目

    被描述为为一个某个宗教项目开发，OpenOctave MIDI（或 OpenOctave）是一款免费的音乐和乐谱创作工具，适用于语音工作或录制。在 www.openoctave
    了解更多信息。


    ## 5 Tracktion

    为音乐创作者提供的免费工具，该工具提供了极佳的 UI 界面。访问 http://bit.ly/5DAW


    # 小型电脑


    ## 树莓派获得 Raspian Stretch


    安全、蓝牙支持和用户界面是 Raspian Stretch 的改进之处。


    随着 Debian Stretch 的发布，树莓派用户现在可以获得来自 Raspberry Foundation 的专用版本。对于 PIXEL 桌面的用户，“Jessie
    和 Stretch 之间的差异大多在于内部优化。”


    最注意的是 Chromium 的改进，包括内存使用和效率，让浏览器运行得更快。Firefox 用户将注意到一些输入输出方面的改进。


    这些改进中，针对主要影响 Android 和 iOS 设备的 Broadplay 可以在树莓派上执行。为了解决这个问题，更新中包含了一个补丁，防止通过芯片漏洞攻击
    BCM2835 wifi。

    同时，音频设备的蓝牙功能已从 PulseAudio 转向更好的 ALSA 连接。为此，Stretch 包含了二进制文件，这应该提供更好的音频效果。PulseAudio
    仍然可以手动安装。


    此外，用户名处理得到了改进。现在，应用程序不再假设 root 是默认用户，在情况并非如此时会遇到问题。现在 sudo 得到了改进。


