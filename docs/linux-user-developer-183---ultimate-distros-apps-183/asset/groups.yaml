    # SMALL BOARD COMPUTER


    # Raspberry Pi gets Raspian Stretch


    Security, enhanced Bluetooth support and username support are among improvements
    to the


    Following the launch of Debian Stretch, Raspberry Pi users can now get hold of
    Debian Stretch, the dedicated distro from the Raspberry Foundation. Still wielding
    the PIXEL desktop, Debian Stretch comes with a number of improvements, descriptions,
    and new tools.


    "The differences between Jessie and Stretch are mostly under-the-hood optimizations,
    and you really shouldn''t notice any differences between the sets of desktop and
    applications."


    Most notable are the improvements to Chromium which include improved memory usage
    and efficiency, enabling the browser to run faster. There''s also a tweak to the
    browser''s appearance. Regular users of Firefox will notice


    some additions to input and output, including MIDI and OSC.

    Along these improvements, the update addresses security issues, Bluetooth support
    and username issues.

    The Broadplay, which mainly affects Android and iOS devices, can be executed on
    a Raspberry Pi. To deal with this, a patch is included in the update which prevents
    the BCM2835 wifi from being hacked via a vulnerability in the chip''s firmware.

    Meanwhile, Bluetooth for audio devices has flipped from PulseAudio, in favour
    of a better connection with ALSA. To this end, the binary also included in Raspberry
    Stretch, which should give better audio results. PulseAudio can still be installed
    manually.

    Also the updates, username handling has been improved. Now, applications will
    not assume that root is the default user and run into problems when this is not
    the case. Now sudo has been improved.


    ![](img/a737bad617574f57f6d992ed4c1f4814_7_0.png)


    > Raspian Stretch brings some security improvements to the Pi


    > Advice for upgrading Raspian Stretch is straightforward: for the best results,
    use a freshly downloaded image.


    # SECURITY


    # Virus spreading via Facebook Messenger video links


    Cross-platform users are targeted with a new Facebook Messenger scam, which distributes
    malicious malware.


    address you by name, followed by a ''Video'', and the link to the landing page
    is plenty of reason to avoid anything but a blatant scam, but video clips are
    not empty.


    The simplest way to avoid this attack is to ignore the message. If you''ve clicked
    it, deny requests to add Pi.

    If you''re already infected, or know someone who is, the steps are the same: With
    Firefox, use the menu, Troubleshooting > Refresh the ''Refresh Firefox'' button
    to reset and remove any add-ons. Try > Settings > Reset. You should also check
    your account for unwanted activity and plug-ins, in Settings > Apps.


    For veteran users, the dangers of malware are well known with Linux''s increasing
    security - via workplaces embracing open source, and the Raspberry Pi – there
    are an increasing number of users who are unaware of the risks. The scammers have
    put the effort into producing a Linux attack, after all.'
