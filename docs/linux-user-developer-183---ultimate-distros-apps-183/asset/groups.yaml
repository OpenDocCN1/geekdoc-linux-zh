    加密功能的缺失一直被行业参与者（包括 Google，www.google.com/list/btrfs-66535.html）视为 Btrfs 的主要障碍，但
    Matthias Eckmann 最近在最近的一篇标题为《未来：我们准备好了吗？》的博文中提醒了这一问题。


    所有 SUSE 开源发行版都带有存储加密扩展，包括用于分区加密的 LUKS 和用于基于文件的加密的 eCryptfs。作为 LUKS 的一部分，我们最近开发了一项工具，该工具引入了
    KIND 标准的开放实现，要求使用专用密钥并保持其安全。从长远来看，我们希望 Btrfs 拥有自己的加密解决方案，但在此类方案的有效性得到证明之前，这是我们的首要任务。


    ## **红帽（Red Hat）弃用 Btrfs 是否改变了 Cubic 项目和 SUSE 的现状？**


    Matthias Eckmann 写了一博客博客详细涵盖了关于 Btrfs、红帽和 SUSE 的主题：http://bit.ly/3i777。由于红帽从未是
    Btrfs 的主要竞争对手，红帽的这一公告对我们的计划没有影响。


    ## **对于 Cubic 项目使用 Btrfs 有什么好处？**


    事务处理有很多解决方案（例如“Atomic”）。一种方案是使用一个包含整个安装系统的根分区。结果是用于回滚的快照数量限于分区数量。这不仅受到限制，而且非常难以管理。


    其他解决方案是使用新的包格式。巨大的缺点是它丢弃了 Btrfs 原生处理的关于 Linux 内核和发行版的所有知识。


    当我们考虑这个问题时，我们寻求一种既与众不同又能利用我们丰富知识且与 RPM 工具兼容的解决方案。我们不想再次重复发明轮子。


    ![](img/a737bad617574f57f6d992ed4c1f4814_14_0.png)


    使用带有快照和回滚功能的 Btrfs 让我们能够发现更改包格式的任何优势。


    将 Btrfs 作为一种写时复制（CoW）文件系统，并在不更改格式的情况下通过快照和回滚更新，我们有了一个非常高效的解决方案（它只需要实际变化的磁盘空间）。你可以保存的快照数量现在仅限于更新的大小和磁盘。


    ## **你能解释一下将 Cubic 项目描述为“想法和创新的创新者”是什么意思吗？**


    由于我们销售的是 openSUSE 操作系统和 SUSE SaaS 平台，它不受多用途操作系统的限制；它的存在有一个单一的目的，即不包含工作负载。我们可以自由地引入新的技术和想法，例如事务更新和只读文件系统，这在传统的
    openSUSE 或 SLE 版本中是不可能的。我们正在通过这些新技术积累经验，并且我们有能力讨论我们所说的多用途操作系统以及如何整合它。Linux 中并不是所有内容在整合到其中都有意义或可行，但通过使用与我们用于所有系统的相同的工具、手段和流程进行“前沿”尝试，我们拥有了一个精简的环境来进行实验，并在需要的时候交换和共享想法、创新以及可能。


    ## **人们如何参与 Kubic 项目？**


    目前，最简单的贡献方式是直接向 openTumbleweed 项目贡献，它是 Tumbleweed 和 Tumbleweed 混合发行版的“工厂”（http://bit.ly/3XopenSUSEFactory）。如果你对
    Cubic 的更深层组件感兴趣，例如 weic 或事务更新，它们都可以在 GitHub 上找到：https://github.com/opensuse/cubic-project。


