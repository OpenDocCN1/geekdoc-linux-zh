  - "[PAGE 35]\n\n# Tutorial\n\n# Essential Linux\n\nPART TWO\n\n# # Master shell\
    \ scripting: program constructs\n\nBash scripting provides conditionals, loops\
    \ and functions that you can use to create powerful scripts\n\n**We are now capable\
