    People who want a laptop pre-installed with GRU/Linux are a niche market (sadly),
    and people who want GRU/Linux to be entirely free - no blobs in the kernel - are
    a small percentage of that. But people who care about security and privacy are
    a growing number of computer users thanks to Vault 7 and other news about the
    event considered high nowadays. High-end devices built from the ground up with
    security and privacy in. Worried about someone activating the camera and mic?
    We have hardware switches to power off these devices.


    We got to spend a couple of days with a Librem 15 while members of the Purism
    team were in the UK for GUADEC. Here’s how we fared with it. First impressions
    are we: a lovely slim build of black anodised aluminium that opens with little
    resistance from the hinge, a good collection of ports around the outside, including
    USB-C, but no RJ45 - which you might need if you get to use the Librem (laptop
    model).


    The keyboard - despite looking like a filmy ''chiclet'' type - is a bit of a surprise,
    feedback rare in this type of keyboard, and feels nice. compared to the MacBook
    Pro, for example, or your ThinkPad maine keyboard, and it''s pleasantly tactile
    enough to make touch-typing feel ever natural – once the user adjusts to the slightly
    shorter key travel, everything feels right. Typing all day is as it should be
    – without a great deal of effort about the physical process. There has an pleasant
    amount of mechanical noise, so the feel of an old-school keyboard is not lost.
    It does not matter whether you work five or eight hours a day and type rarely
    uses a mouse.


    As far as the touchpad, some of us will find it remarkable but for its kind it''s
    the relatively responsiveness of spirit – with multi-touch working for scrolling,
    swiping and, supported by apps, pinch middle-click, and the wheel can be turned
    off simply with Fn+, for avoiding accidentally moving your cursor during extended
    typing. Function keys also control shortcuts like to sleep (which also with lid
    closed, as the shoudi); mute, screen brightness, resilience and with such. What
    makes Libaptops puts us is the presence of hardware switches (HKS). Camera and
    memory as well as Wi-Fi, are give you the power, with hardware protection by switching
    on memory, or Wi-Fi, for whatever data gathering, surveillance or more malicious
    purposes. It will be great to have these devices for children.


    Evolutionary improvements mean even entry models are capable and we haven''t found
    any problems in our reviews during first hands-on with the laptop. easy access
    to memory and storage via Phillips screws is welcome. You can also buy the Libront
    without any, and put in your own. We are also replaceable parts-which is great.
    The Skylake Intel7 is fast enough, but more cores would be nice simpler compilers
    and apps take advantage of them. Performance is certain, although not decent but
    not the best – no surprise given we slim form factor, and lovely size. We experienced
    about six hours of real-world use, which would enable you to keep it out of the
    charger for even longer. If GNOME 3 is your current desktop of choice, PureOS
    could be a pleasant surprise. Every as well as with both security and convenience,
    they deliver one of the best-of-the-box of GNOME experiences. If you purchase
    it in the UK, there''s a 20% duty charge. Richard Shermey.


