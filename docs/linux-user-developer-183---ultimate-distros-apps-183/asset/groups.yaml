    \ to the project; containing some new files. It will also create a directory,\
    \ src/main/resources/ that contains supplementary material, including some specifically\
    \ made artwork that you can use. The resources directory appears near the top\
    \ of the package explorer on the left side of the Eclipse window, as shown from\
    \ Figure 2 (overlay). Now we are able to begin.\n\n## JavaFX connects\n\nWhen\
    \ we loaded the new App.java (the App that we created in last month tutorial),\
    \ notice that JavaFX uses some terminology for its core concepts. The top-level\
    \ container in an application is called a 'stage' and it has capacity to display\
    \ one or more 'scenes'. Scenes are what JavaFX uses as the interface to completely\
    \ change; for example, we are able to swap screen from the main application. After\
    \ the screen will swap out one scene and the main application will show another.\
    \ This mechanism is so powerful that we can seamlessly move screens without having\
    \ to unload all the components from the stage.\n\nOn top of the scene, we use\
    \ UI components - example, text boxes, and images. In JavaFX, these components\
    \ are called 'nodes', and they are organised into a family tree called the 'scene\
    \ graph', in which nodes are designed as children.\n\n> JavaFX allows us to style\
    \ graphical elements using CSS, a language designed specifically for that.\n\n\
    Of nodes, JavaFX streamlines the process of writing UI code so you do not have\
    \ to worry about hiding different components. The simple rule is na a parent is\
    \ shown, then all its children are hiding. For example, if we have a horizontal\
    \ line in a child. If the HBox that shows it no longer appears, all children will\
    \ disappear. Now we have to handle visibility for any layout panels of some kind)\
    \ add the Parent class. The Parent class stores the children as an ObservableList\
    \ of nodes, which we can retrieve getChildren(). ObservableList implements the\
    \ List interface, so we can add and remove using the same methods we use to add\
    \ elements from ordinary lists. See Figure 3 (overlay) for example.\n\nLast, there\
    \ is one 'root' node that is placed directly on the scene. The root node actor\
    \ for all nodes on the GUI. If a descendant of the root node, then it to be displayed.\n\
