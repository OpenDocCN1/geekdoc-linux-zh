    # Review CubieBoard 6


    ![](img/a737bad617574f57f6d992ed4c1f4814_85_0.png)


    Gareth Halfacre


    ## HARDWARE CubieTech CubieBoard 6


    | Price |

    | --- |

    | £52.75 (inc. VAT) |

    | Website |

    | newcub.co.uk |


    CPU: Allwinner S500 ARM Cortex-A9 Quad Core 1.2GHz

    GPU: PowerVR SG554 Mali

    RAM: 2GB LPDDR2

    Storage: 96-pin SATA expansion

    Networking: 100Mbps Ethernet, Wi-Fi, 802.11b/g, Bluetooth 4.0

    Ports: HDMI, 2x USB 2.0 Host, 1x USB 2.0 Device, microSD, SATA 3


    Has four years of reflection given CubieTech what it needs to take on the Raspberry
    Pi?


    CubieTech has been chipping away at the single-board computer market for years.
    In 2013 the Chinese firm was first to produce the western market with the CubieBoard
    2, which upgraded the power from the Allwinner A10 SoC to the more powerful S500.
    Though frankly the small form factor of the CubieBoard in a larger of ‘CubieTech
    track’ layout,


    The CubieBoard 6 is a return to form. The board is designed to be more powerful,
    perhaps pin-for-pin identical to the CubieBoard 1 and 2. Although a few of the
    improved 40-pin GPIO header functions have shifted, the idea is anyone who has
    built a design around which the CubieBoard 2 should be replaced with a CubieBoard
    6.


    In doing so, you can get a considerable upgrade: the old A2 SoC has been replaced
    with the Allwinner S500 SoC, a quad-core ARM Cortex-A9 CPU and PowerVR SGX544
    GPU. You also enjoy the RAM at 2GB, twice the storage at 8GB, and a faster SATA
