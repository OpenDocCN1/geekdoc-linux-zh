    Line 68: base="0x880000" size="0x4F000" />


    ### 1.3.1.2 APSS changes


    - To reduce the modem size in APSS side, changes are required in arm/arch/dts/qcom/ms8909.dts.
    Example given below is for Kitchen flavor (79 MB):

    modem_adsp_mem: modem_adsp_region (linux, contiguous-region; linux, reserve-region;
    linux, remove-complete; reg = <0x0 0x8800000 0x0 0x4F0000> label="modem_adsp_mem");

    peripheral_mem: peripheral_region (linux, contiguous-region; linux, reserve-region;
    linux, remove-complete; reg = <0x0 0xCF00000 0x0 0x0600000> label="peripheral_mem");


    ### Reduce modem size


    - Breakdown of line 95 (modem_adsp_mem): 0x0 0x8800000 – Starting address for
    modem; 0x4F00000 – Modem size. For reducing size, for example, 79 MB (0x4F00000)
    it should be converted to hex and update as 0x4F00000.


    ### Update start address of peripheral_region


    - Breakdown of Line 103: 0xCF00000 corresponds to start address and is calculated
    as Modem start + Modem size (For 79 MB it needs to be updated accordingly 0x8800000+0x4F00000).
