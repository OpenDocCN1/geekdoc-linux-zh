    # 1 Getting Started


    NOTE: This is a pre-release.


    ## 1.1 Downloading QTI proprietary software from ChipCode


    QTI software can be downloaded from the ChipCode website. Designated points of
    contact in your organization can download the software. The software is organized
    into distribution (distros) composed of subsystem images. Each distro has a corresponding
    Git project. The Git tree includes revisions for previous builds that allow you
    to diff the changes between releases.


    1. If you are new to ChipCode, review the following link for up-to-date documentation
    and a set of tutorial videos: https://code.qti.qualcomm.com/projects/help/wiki

    2. Create a top-level directory and unzip each of subsystem images to generate
    the following structure. In example, `<target_root>` is the top-level directory.

    ```

    <target_root>

    /common/

    /boot_images/

    /common/

    /modem_proc/

    /rpm_proc/

    /trustzone_images/

    /cnss_proc/

    /LINUX/

    contents.xml

    ```

    3. Ensure that contents.xml file is located in the root folder shown above.


    ## 1.2 Downloading open source HLOS


    The Linux Board Support Package (BSP) release is obtained in two parts: a proprietary
    release from ChipCode and an open source release from Code Aurora Forum (CAF).


    1. Open the contents.xml file downloaded from ChipCode (see Section 1.1) and search
    for the `<name>` tag.

    2. Below this tag, consider the `<build_id>` tag. This identifies the corresponding
    open source HLOS build:

    ```

    <build_id>LA.1.1.23-02510-9.0

    ```

    3. Follow the instructions at https://codeaurora.org/wiki/bin/release (look under
    Branch sections) to find the build ID in the released software.

    4. In an empty directory, use the repo init with the correct branch and manifest
    as indicated in branch releases:

    ```bash

    $ repo init -u git://codeaurora.org/platform/manifest.git -b release -m <manifest>
    -repo-url=git://codeaurora.org/tools/repo.git

    ```

    5. Type the repo sync command:

    ```bash

    $ repo sync

    ```

    6. After the repo finishes, copy the vendor/qcom/proprietary directory tree from
    the proprietary HLOS release into the open source HLOS source tree contained in
    your copy:

    ```bash

    $ cp -r <target_build_location>/<build_id>/LINUX/android/

    ```


    # Build components and commands


    Build commands, required tools, and supported build environments for each component
    are listed in the following table.


    | Build component | Supported build environments | Required tool version | Build
    commands |

    | --- | --- | --- | --- |

    | MPSS | * Linux<br>* Windows | * Hexagon tool set 6.4.0<br>* Python Ver 2.7.6<br>*
    Peripheral Ver 5.14.2 | Build images --./build.sh 8909.gen.prod -c<br>Clean the
    build --./build.sh 8909.gen.prod -c | For Windows, use build.cmd. |


    # Release Notes for MSM8909_LA_1-01123


    | Build component | Supported build environments | Required tool version | Build
    commands |

    | --- | --- | --- | --- |

    | BOOT | * Linux<br>* Windows | ARM Compiler tools: 5.01 update 3 (build 94) |
    **Windows**<br>**Build images**<br>boot_images/build/ms/build.cmd<br>TARGET_FAMILY=8909-prod<br>**Clean
