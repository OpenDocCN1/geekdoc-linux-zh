  md: '# Release Notes for MSM8909 LA 1 1-01123


    +   - Example given below is for Kitchen sink flavor (79 MB):

    modem_adsp_mem: modem_adsp_region@ (

    linux, reserve-contiguous-region;

    linux, reserve-region;

    linux, remove-complete;

    reg = <0x0 0x88000000 0x0 0x4F000000>\label = "modem_adsp_mem";

    peripher_mem: peripheral_region80 (

    linux, reserve-contiguous-region;

    linux, reserve-region;

    linux, remove-complete;

    reg = <0x0 0xCF000000 0x0 0x06000000>

    label = "peripheral_mem";


    # Reduce modem size


    +   - Breakdown of line 95 (modem_adsp_mem region):

    - 0x0 0x88000000 – Starting address for modem

    - 0x4F000000 – Modem size

    - For reducing size, for example,79 MB (0x4F000000) it should be converted to
    hex and update as 0x4F000000.


    # Update start address of peripheral_region


    +   - Breakdown of Line 103:

    0x8CF00000 corresponds to wens start address and it is calculated as → Modem start
    + Modem size (For 79 MB modem it needs to be updated accordingly 0x88000000+0x4F000000)

    - Updated lines (95 and 103) should look as below for 79 MB modem:

    reg = <0x0 0x88000000 0x0 0x4F000000>;nreg = <0x0 0xCF000000 0x0 0x06000000>;


    # 1.4.1.3 Diag Trace buffer


    Modify the modem_proc/bdms/cust8909.gen.prod.h (cust8909.lwq.prodq)) depending
    on whichever flavor needs it.


