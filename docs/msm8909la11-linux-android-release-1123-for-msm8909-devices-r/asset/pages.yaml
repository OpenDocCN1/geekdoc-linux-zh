- pgno: 5
  md: '# # 1 Getting Started


    NOTE: This is a pre-CS release.


    # ## 1.1 Downloading QTI proprietary software from ChipCode


    QTI software can be downloaded from the ChipCode™ website. Designated points of
    contact in your organization can download the licensed software. The software
    is organized into distribution packages (distros) composed of subsystem image
    files. Each distro has a corresponding Git project. The Git tree includes revisions
    for previous builds that allow you to diff the changes between releases.


    +   1. If you are new to ChipCode, review the following link for up-to-date documentation
    and a set of tutorial videos:

    https://code.qti.qualcomm.com/projects/help/wiki

    2. Create a top-level directory U.S. on build PC and unzip each of the subsystem
    images to generate the following directory structure. In this example, `<target_root>`
    is the top-level directory.

    ```

    <target_root>

    /common/

    /boot_images/

    /common/

    /modem_proc/

    /rpm_proc/

    /trustzone_images/

    /cnss_proc/

    /LINUX/

    contents.xml

    ```

    3. Ensure that the contents.xml file is located in the root folder as shown above.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Downloading open source Package HLOS


    The Linux Board Support Package (BSP) release is obtained in two parts, a proprietary
    release from ChipCode and an open source release from the Code Aurora Forum (CAF)
    site.


    +   1. Open the contents.xml file that downloaded from ChipCode (see Section 1.1)
    and search for the <name>apple</name> tag.

    2. Below this tag, consider the <build_id> tag. This identifies the corresponding
    open source HLOS build for.


    ```

    <build_id>LA.BR.1.2.3-02510-8x09.0</build_id>

    ```


    +   3. Follow the instructions at https://www.codeaurora.org/wiki/bin/QAEP/release
    (look under the Branch sections) to find the AFSS build ID in the released software.

    4. In an empty directory, use the repo init with the correct branch and manifest
    as indicated in the branch releases.


    ```

    $ repo init -u git://codeaurora.org/platform/manifest.git -b release -m [manifest]
    -repo-url=git://codeaurora.org/tools/repo.git

    ```


    +   5. Type the repo sync command:


    ```

    $ repo sync

    ```


    +   6. After the repo finishes, copy the vendor/qcom/proprietary directory tree
    from the proprietary HLOS release into the open source HLOS source tree contained
    in your copy.


    ```

    $ cp -r <LYA_build_location>/HY11-<build_id>/LINUX/android/.

    ```


    # Build components and commands


    Build commands, required tools, and supported build environments for each component
    are listed in the following table.


    | Build component | Supported build environments | Required tool version | Build
    commands |

    |---|---|---|-|

    | MPSS | * Linux

    * Windows | * Hexagon tool set 6.4.02

    * Python Ver 2.7.6

    * Perif-l Ver 5.14.2 | Build images --./build.sh 8909.gen.prod -c

    Clean the build --./build.sh 8909.gen.prod -c | For Windows, use build.cmd. |'
  merge: -1
