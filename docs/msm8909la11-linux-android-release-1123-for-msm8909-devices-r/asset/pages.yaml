- pgno: 19
  md: '# # 4 Bugs and Limitations


    This chapter lists the bugs and limitations reported for this product line:


    +   - New – Newly reported bugs and limitations

    - Ongoing – Previously reported bugs and limitations

    - Resolved – Previously reported bugs and limitations that have been resolved
    and are no longer relevant


    CAUTION: The software does not configure the QTI baseline device (MSM™, MDM, etc.)
    input pins to ensure minimum sleep current for customer-defined MUX configurations.
    Therefore, it is the customer''s responsibility to properly configure each and
    every digital CMOS pin to a valid voltage before entering sleep. This is required
    to minimize leakage during sleep. This applies to EBI data pins, GPIO pins, alternate
    functions MUXed with GPIOs (i.e., AUX_JTAG or SEL pins), and any other CMOS pin
    that is or can be configured as an input. See Configuration of Input Pins During
    Sleep [80-VN499-7] for more details.


