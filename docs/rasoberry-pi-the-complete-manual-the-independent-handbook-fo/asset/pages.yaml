  md: "# # Projects\n\n# # Control your Raspberry Pi-powered car\n\n# ## What you'll\
    \ need...\n\n+   - A Raspberry Pi, ready to go\n+   - An internet connection\n\
    +   - A reasonably modern smartphone/tablet\n+   - Pi Car source code\n+   github.com/shaunlu/picar\n\
    \n# ## Control your Raspberry Pi-powered car\n\nControl a toy car with a smartphone\
    \ and the latest web technologies\n\nNow that we have our fantastic Raspberry\
    \ Pi-powered car all wired, charged and ready to go, it's time to make it come\
    \ alive. We're using the best web technologies that the JavaScript programming\
    \ language offers, to harness the natural movement of your hand and wirelessly\
    \ drive the vehicle.\n\nEach little movement of your hand will trigger an event\
    \ that calculates what the car should do and then sends it over a socket connection.\
    \ If all goes to plan you should have complete control over your vehicle.\n\n\
    > **Did you know...**\n> \n> *(text is blurry and unreadable)*\n\n# ## Download\
    \ and install the software\n\nFirst of all, you will need to do IDC connectivity\
    \ working. Next, we will need to find a home for our new project code - how about\
    \ /var/www/picar? Type `sudo mkdir /var/www/picar` in the terminal to make the\
    \ directory and then change into that directory: `cd /var/www/picar`\n\nNow, to\
    \ download the project using Git, type `sudo git clone http://github.com/shaunlu/picar`.\
    \ If you haven't got Git, install it with `sudo apt-get install git`.\n\nThis\
    \ will download the custom software for driving the car, but we still need the\
    \ web server and some other bits before we can start burning rubber...\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_113_0.png)\n\
    \nBelow All you need to finish off your project is access to a smartphone or tablet"
