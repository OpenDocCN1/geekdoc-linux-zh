- pgno: 60
  md: "# Check your mail\n\n# Projects\n\nYou should now be fully logged in to your\
    \ email account. Under POP your account will be locked until you choose to execute\
    \ the quit() method of the connection. If you need a quick summary of what is\
    \ on the open server you can execute the stat() method:\n\n```\nmy_pop.stat()\n\
    ```\n\nThis method returns a tuple consisting of the message count and the mailbox\
    \ size. You can get an explicit list of messages with the list() method. You have\
    \ two options for looking at the actual contents of these emails, depending on\
    \ whether you want to leave the messages untouched or not. If you want to simply\
    \ look at the first chunk of the messages, you can use the top() method. The following\
    \ code will grab the headers and the first five lines of the first message in\
    \ the list.\n\n```\nemail_top = my_pop.top(1, 5)\n```\n\nThis method will return\
    \ a tuple consisting of the response text from the email server, a list of the\
    \ headers and the number of requested lines, and the octet count for the message.\
    \ The one problem with the top() method is that it is not always well implemented\
    \ on every email server. In those cases, you can use the retr() method. It will\
    \ return the entire requested message in the same form as that returned from top().\n\
    \nOnce you have your message contents, you need to decide what you actually want\
    \ to display. As an example, you might want to simply print out the subject lines\
    \ for each message. You could do that with the following code.\n\n```\nfor line\
    \ in email_top[1]:\n    if 'Subject' in l:\n```\n\n```\nprint()\n```\n\nYou need\
    \ to explicitly do the search because the number of lines included in the headers\
    \ varies between each message. Once you're done, don't forget to execute the quit()\
    \ method to close down your connection to the email server. One last thing to\
    \ consider is how long the email server will keep the connection alive. While\
    \ running test code for this article, it would frequently time out. If you need\
    \ to you can use the noop() method as a keep-alive for the connection.\n\nAs mentioned\
    \ previously, the second, newer, protocol for talking to email servers is IMAP.\
    \ Luckily, there is a module included in the standard library that you can use,\
    \ similar to the poplib module we looked at above, called imaplib. Also, as above,\
    \ it contains two main classes to encapsulate the connection details. As you need\
    \ an SSL connection, you can use IMAP4_SSL. Otherwise, you can use IMAP4 for unencrypted\
    \ connections. Using Gmail as an example, you can create an SSL connection with\
    \ the following code.\n\n```\nimport imaplib\nimport getpass\nmy_imap = imaplib.IMAP4_SSL(\"\
    imap.gmail.com\")\n```\n\nAs opposed to poplib, imaplib has a single method to\
    \ handle authentication. You can use the getpass module to ask for the password.\n\
    \n```\nmy_imap.login('my_username@gmail.com', getpass.getpass())\n```\n\nIMAP\
    \ contains the concept of a tree of mailboxes where all of your emails are organised.\
    \ Before you can start to look at the emails, you need to select which mailbox\
    \ you want to work with. If you don't give a mailbox name, the default is the\
    \ inbox."
