- pgno: 57
  md: '# Projects


    # Create a Snake clone in Scratch


    # Handle movement


    **09** Now handle the typical case where there is no collision and the snake must
    move in its current direction. The pen is down so it will draw the body. The Speed
    variable determines how many steps to move. Add the current direction to the Next
    Direction list for the tail to read.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_0.png)


    # Try out the snake


    **10** You can now try out your Snake sprite. It will move around the screen in
    response to pressing the arrow keys. It will draw its body, which will just get
    longer and longer because we need the tail to erase it. And it will sreech and
    end the game on detecting a collision.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_1.png)


    # Paint the tail


    **11** Click the New Sprite Paintbrush icon to paint the tail sprite. Draw a small
    circle to represent the end of the tail. Name this sprite Tail. The Tail sprite
    will follow the Snake and erase the end of its tail so that the snake body doesn’t
    grow indefinitely.


    # Make a Grow variable


    **12** Make a Grow variable which is for this sprite only – no other sprites need
    access to it. The Grow variable is used to determine when the snake body needs
    to grow and the tail therefore needs to pause before following to allow the head
    to get further ahead.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_2.png)


    # Handle events


    **13** The tail needs to listen for two new events which you create as you need
    them. When it creates a new event. When it creates a new event, it must freeze.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_3.png)


    # Initialise the tail


    **14** When the green flag is clicked to start the game. Grow is set to 1 so the
    snake gets a short body. Move to the centre of the stage with the pen up and configure
    the pen to draw a tail the same colour and size as the stage background so that
    it erases the body.


    # Grow and move


    **15** Use a ‘forever’ command to keep the tail moving. If Grow is 0, it should
    pause and reset Grow to 1 – this makes the body grow longer. Use the first value
    from Next Direction to set the direction and remove it so you get a new value
    next time. More Speed steps.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_4.png)


    # Try out the tail


    **16** Now you can try out the tail sprite. Because it won’t receive any Egg Eaten
    events. But the tail will follow the snake head around the stage, erasing the
    snake body as it goes (which is the same colour as the background).


