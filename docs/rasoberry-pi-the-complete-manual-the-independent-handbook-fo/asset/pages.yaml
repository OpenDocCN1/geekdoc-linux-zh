  md: '# # Getting started


    # ## What you''ll need...


    **Apt command help page:** http://linux.die.net/man/8/apt


    **Apt-get help page:** https://manpages.debian.org/man8/apt-get.8.html


    # ### Did you know...


    The Raspberry Pi is a near-perfect mini computer. It already contains a wealth
    of educational software, a few games, some programming utilities and a number
    of system tools. But, as with most computers, this is only the tip of the proverbial
    iceberg. By installing more programs, you can do much more.


    # # Install and use packages


    # # Install and use packages


    The Raspberry Pi is great, but it’s made better with the software you install
    onto it.


    On its own, the Raspberry Pi is a near-perfect mini computer. It already contains
    a wealth of educational software, a few games, some programming utilities and
    a number of system tools. But, as with most computers, this is only the tip of
    the proverbial iceberg. By installing more programs, you can do much more.


    These programs, known as packages, are as wide and as varied as the developers
    who originally designed them. In Linux, if there’s a need for a particular program,
    then someone develops one. They then put it out to the world and make the source
    code freely available, hence ‘open source’. Once the program has been tested,
    it will eventually make its way onto one of the many remote servers for that particular
    Linux distro.


    These remote servers, called repositories, or repos, contain all the elements
    of the package in order for it to be downloaded and installed onto your system.
    The process is very quick and easy once you know how it’s done...


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_31_0.png)'
