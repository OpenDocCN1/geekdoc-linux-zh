  md: "# Send an SMS from your Raspberry Pi\n\n# Set up your Twilio account\n\n+ \
    \  01 \n+   The first step for this project is to register for a Twilio account\
    \ and Twilio number. This is free and will enable you to send an SMS to a registered,\
    \ verified phone. Once signed up, you will receive a verification code via SMS\
    \ to the registered phone. When prompted, enter this into the Twilio site to authenticate\
    \ your account and phone. Go to twilio.com/try-twilio and create your account\
    \ now.\n\n# Register numbers\n\n+   02 \n+   Your Twilio account is just a trial\
    \ account unless you pay the upgrade fee, which means you can only send and receive\
    \ communications from a validated phone number. Enter the phone number of the\
    \ contact who you want to verify, ensuring that you select the correct country\
    \ code. Twilio will text you a verification code and you will need to enter it\
    \ into the website form and press submit.\n\n# The dashboard\n\n+   03 \n+   Once\
    \ registered and logged in on Twilio, visit the dashboard page, which will display\
    \ your AccountSid and your Auth Token. These are both required to use the Twilio\
    \ REST API and you will need to use it later. Keep these at a rate of thumb as\
    \ you will need them in the Python program later.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_76_0.png)\n\
    \n# Install the software\n\n+   04 \n+   Now how to turn your Raspberry Pi and\
    \ connect it to the internet. Before you install the Twilio software, it’s worth\
    \ updating and upgrading your Pi. In the LXDE Terminal, type `sudo apt-get update`,\
    \ then `sudo apt-get upgrade`. Once complete, type `sudo easy_install twilio`\
    \ or `sudo pip install twilio` to install the software (if you need to install\
    \ pip, type `sudo apt-get install python3-pip` and/or `pip install`; then type\
    \ `sudo pip install -U pip`).\n\n# Twilio authentication\n\n+   05 \n+   Now you\
    \ are ready to create the SMS program that will send text messages to your mobile\
    \ phone. Open your Python editor and import the Twilio REST libraries (line one,\
    \ below). Next, add your AccountSid and Auth Token, replacing the X’s with yours,\
    \ as you will find on your dashboard:\n\n```\nfrom twilio.rest import TwilioRestClient\n\
    account_sid = \"XXXXXX\"\nYour's\nauth_token = \"YYYYYYYYY\" # Enter\nYour's\n\
    ```\n\n```\nclient = TwilioRestClient(account_sid, auth_token)\n```\n\n# Create\
    \ your message\n\n+   06 \n+   You will probably want to be able to change your\
    \ text messages rather than sending the same one. Create a new variable in your\
    \ program called ‘message’. This will prompt you to enter the phrase that you\
    \ want to send to the mobile phone. When the program runs, this is\n\n# Projects\n\
    \nthe message that will be sent.\n\n```\nmessage = raw_input(\"Please enter your\
    \ message:\")\n```\n\n# Add your numbers\n\n+   07 \n+   To send the message,\
    \ you need to add the code line below and your two phone numbers. The first number\
    \ is your mobile phone number, which is registered and validated with Twilio (step\
    \ 2). The second number is your Twilio account phone number, which can be retrieved\
    \ from your dashboard page under ‘Call’ the mobile number’. Change the Sandbox\
    \ number to your country location and remember to add the international country\
    \ code.\n\n```\nmessage = client.messages.create(to=\"+44YOURMOBILENUMBER\", from_=\"\
    +444YOURTWINUMBER\", body=\"messa g\")\n```\n\n# Send the message\n\n+   08 \n\
    +   Now send your message. The code below is not required, but useful to indicate\
    \ your message has been sent. Add the lines and save your program. Ensure your\
    \ Raspberry Pi is connected to the internet and that your mobile is on, then run\
    \ your program. You have just texted from your Raspberry Pi.\n\n```\nimport os\n\
    text = \"The message is being sent.\"\nos.system('echo \"text\" > /dev/tty1')\n\
    print \"Cheek your phone!\"\n```\n\n# Other API and codes\n\n+   09 \n+   You\
    \ can also create other communication programs, such as making phone calls, recording\
    \ a call, and reviewing data including caller IDs and call duration. The API has\
    \ also complements a wide range of programming languages, including Ruby, PHP,\
    \ Java, and Node.js `twilio.com/api` to name a few."
  merge: -1
  img_proc: true
- pgno: 77
  md: '# What you''ll need ...


    +   OpenELEC openelec.tv

    +   HDMI cable

    +   USB IR receiver

    +   IR remote

    +   Case

    +   Dedicated power supply

    +   Optional USB storage


    # Make a Pi 2 HTPC


    Finally create a more powerful and capable HTPC using the Raspberry Pi 2 and the
    excellent OpenELEC project.


    We know people who just have a Raspberry Pi for XBMC, now called Kodi. It’s a
    great idea and a great use for the Pi – it works just well enough that you can
    easily play media locally or over the network. The biggest issue came with GUI
    response on the original Model Bs, and a lack of USB ports for connecting up everything
    that you want. While optimisation over the last few years has helped, the leap
    to Raspberry Pi 2 has basically solved all of these problems by giving you much
    more powerful hardware to play with. So if you’re looking to upgrade or finally
    take the plunge, this handy guide will help you create the perfect Raspberry Pi
    2 HTPC.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_77_0.png)


    # Choose the software


    In the past, Pi HTPCs were just a choice between RaspBMC and OpenELEC. However,
    RaspBMC is on a bit of a hiatus and OpenELEC is your best bet for getting the
    most up-to-date software. There’s not a massive difference between the two, as
    they both run XBMC.


    # Get the software


    Head over to openelec.tv and look for the downloads section. There’s a specific
    Raspberry Pi section which is split up into original (ARMv6) Pi and the newer
    Raspberry Pi 2 (ARMv7). Grab the image file from this page for the Pi 2.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Make a Pi 2 HTPC


    # Projects


    # Install to card


    **03** Open up the terminal and use `fdisk` to determine where your SD card is
    allocated on your system (depending on the pre-allocated system/swap/boot/control
    size). Navigate to the image using `cd` and install with `dd using`


    ```

    $ dd bs=1M if=openELEC-RPi2-arm-5.5.5.img of=/dev/


    sda1


    ```


    # First boot


    **04** Plug in your Raspberry Pi and either use your HDMI connection or wait until
    it’s ready to reserve and run it on. On OpenELEC, you’ll reserve the SD card partitions
    and write a few extra programs before finally booting into Kodi.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_78_0.png)


    # Configure Kodi


    **05** Get the OpenELEC web interface to get through the first interface. If you’re
    connecting via Wi-Fi, you’ll need to go to OpenELEC in the System menu, and activate
    the wireless network options selector if your network and then entering your password


    > “It’s a great use for the Pi – it works just well enough that you can easily
    play media locally or over the network”


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_78_1.png)


    # Add network shares


    **07** Placement of your Raspberry Pi is important. As it’s going to be out all
    the time, we highly recommend getting a case for it – the Aboz cases from Pimoroni
    are quite well suited to this type of use as they are sturdy and can be attached
    to the rear of some TVs.


    # IR sensors and controllers


    **08** You can be controlled with a number of different things – including USB
    game controllers and compatible IR sensors. We’ve used FLIRC in the past, but
    if you need a sensor on a wire that can stretch to a useful position.


    # Future updates


    **09** OpenELEC has the excellent ability to update itself without needing you
    to restart it every few months, meaning you won’t need to do much maintenance
    on it at all. Now you can sit back and enjoy your media much easier than before.


    # Add network shares


    **06** You can attach a portable hard drive or USB stick to the Pi for storage,
    but it is likely to stream over the network. Go to File manager under System and
