  md: '![](img/fd3f4a582cf5250916d8b8e1d4ccd045_64_0.png)


    # ## Use better storage hardware


    +   01 Your choice of storage media can have an impact on your Raspberry Pi''s
    performance, regardless of the operating system. A low-capacity SD card with poor
    error correction is going to be slower than a larger card with greater resilience,
    so you need to find the right balance for your project and shop wisely


    # ### Choosing the best SD card


    +   02 There are various standards of SD card available, with the more expensive
    designed for better error correction. For the best performance on your Raspberry
    Pi, choose an SDHC card with a high rating. The same advice applies to MicroSD
    cards, which you can use on your Raspberry Pi with an SD card adapter or directly
    insert into a Raspberry Pi 4/5


    # ### Make the most of your storage


    +   03 You''ll typically need 1-2GB of storage for your chosen Raspberry Pi distro,
    so any remaining storage on your SD card will be used for updates and data you
    create or save. In Raspian you can open a command line and run the configuration
    utility to gain more space (only if your SD card is greater than 2GB):


    ```

    ```

    sudo raspi-config

    ```

    ```


    # ### Expand the Raspbian partition


    +   04 Maximising the partition affords the full capacity of your SD card, which
    will increase the media''s lifespan (there is more space to write to, so the same
    sectors aren''t being overwritten as often). With rasp-confutil running, use the
    arrow keys to select expand_roots in the menu. Then wait briefly while the partition
    is resized


    # ### Write data to RAM


    +   05 Rather than reading and writing data to your SD card — something that will
    eventually result in a deterioration of reliability and performance in the long
    run — you can configure Raspian to write the data to system RAM, which will speed
    things up slightly and improve the SD card''s overall performance. This is achieved
    using file system table, a system configuration available in most Linux distros.


    # ### Enable fstab in Raspian


    +   06 This is much like creating a RAM disk in Windows. In the command line,
    enter:


    ```

    ```

    sudo nano /etc/fstab

    ```

    ```


    Add the following line to mount a virtual file system:


    ```

    ```

    tmpfs  /var/log        tmpfs

    defaults,nosw,nosuid,mode=0755,sise=100m  0 0

    ```

    ```


    Follow this by saving and exiting nano (ctrl-X), then safely restarting the Pi:


    ```

    ```

    sudo shutdown -r now

    ```

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_64_1.png)


    > "> You''ll typically need 1-2GB of storage for your chosen Raspberry Pi distro",'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Projects


    # Picking an external USB drive


    Speeding up your Raspberry Pi by migrating the root filesystem to an external
    USB drive is a start, but what sort of device should you use for the best performance?
    With a USB thumb drive you can add flash storage up to 16GB without running into
    any significant problems (the larger the drive, the greater the current is required
    to read/write). Anything larger is expensive and unnecessary. If you''re planning
    to use an external HDD, there are no power issues as it will have its own power
    supply. As ever, your choice should suit your project.


    Below Having your filesystem on a USB stick is great for booting as well as performance
    boosts


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_65_0.png)


    # Supercharge your Pi


    # Configure fstab for fast performance


    +   07 Upon restarting, the virtual filesystem will be mounted and /var/log on
    the RAM disk. Other directories that can be moved to RAM include:


    ```

    ```

    tmpfs  /tmp    tmpfs     defaults,noatime,nosuid,size=512m    0 0

    tmpfs  /run    tmpfs     defaults,noatime,nosuid,size=512m    0 0

    tmpfs  /var/log  tmpfs     defaults,noatime,nosuid,nosuid,mode=0755,size=100m  0
    0

    tmpfs  /var/spool  tmpfs     defaults,noatime,nosuid,mode=0755,size=10m  0 0

    tmpfs  /var/spool/queue  tmpfs     defaults,noatime,nosuid,mode=0700,gid=12,size=30m  0
    0

    ```

    ```


    Add each to /etc/fstab in nano.


    # Move your OS to a HDD


    +   08 If you''re concerned about the lifespan of the SD card, why not reduce
    your Raspberry Pi''s reliance on it! Instead of using the SD card as a sort of
    budget SSD, change its role and add a HDD or USB stick to run the operating system,
    leaving the SD card for bootstrapping. This can give a marked performance boost
    to the SD card.


    # Back up the SD card


    +   09 Create a copy of your Pi''s SD card. Shut down, remove the card and insert
    it into your desktop computer. In the command line run:


    ```

    ```

    sudo dd bs=4M if=/dev/sdb of=/backup.img

    ```

    ```


    The path /dev/sdb represents the SD card. Copying takes 5-10 minutes. When complete,
    remove the SD card and connect your USB device.


    # Copy Raspbian to USB


    +   10 Using a blank Ex4-format ted USB thumb drive (or external-HDD) as the destination
    drive, enter:


    ```

    ```

    sudo dd bs=4M if=/backup.img of=/dev/sdc

    ```

    ```


    Leave the backup on your computer, just in case something goes wrong. With an
    SD card and USB storage device sharing an identical disk image, it''s time to
    consider what you''re going to do next -- create a faster Raspberry Pi.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Split the Raspbian partitions\n\n**11** Usually the boot partition should\
    \ remain on the SD card while the root filesystem is run from the external HDD\
    \ or USB thumb drive. Using your preferred partition manager (Disk Utility is\
    \ in most distros), unmount and delete the root filesystem from the SD card (ensuring\
    \ you have retained the boot partition). After removing the SD card, connect your\
    \ USB device and delete the boot partition, taking care to leave the root filesystem\
    \ intact. Then resize the root filesystem on the USB device, making sure your\
    \ 10MB remains.\n\nAbove \n\nThe Pi runs easily and can be used with less than\
    \ $10\n\n# Identify the root filesystem\n\n**12** You're going to have the SD\
    \ card and the external USB storage connected, so you need to tell the Pi where\
    \ the root filesystem is. On the Pi, insert your external USB drive and, with\
    \ the SD card inserted, run:\n\n```\n$ sudo nano /boot/cmdline.txt\n```\n\nFind\
    \ **root=/dev/mmcblk0p2** (or similar) and change it to read **root=/dev/sdb2**,\
    \ which is your external USB storage. Save and exit.\n\n# Add other USB devices\n\
    \n**13** Now you can now restart your Pi. Plug in the storage devices and watch\
    \ them attach. As soon as you connect further USB media you'll suffer problems.\
    \ Avoid by installing gdisk:\n\n```\n$ sudo apt-get install gdisk\n```\n\nThen\
    \ run gdisk.\n\n```\n$ sudo gdisk /dev/sdb\n```\n\nEnter 'h' to display the options\
    \ and select **Recovery and Transformation Options** (usually 'r', followed by\
    \ 'L' and 'M2'). **Build Fresh GPT: Tap 'Y'.** One last time and we're done. Write\
    \ 'Backup to Disk' last. This will take the USB drive and create a GPT with a\
    \ 10MB partition. You'll use the last partition as your time. You'll use 1 as\
    \ the root filesystem.\n\n# Make your Pi fast and reliable\n\n**14** Now make\
    \ a note of the GUID and then switch to the SD card. Reopen cmdline.txt and change\
    \ root=/dev/mmcblk0p2 to root=PARTUUID=XXXXXX, where the numerical string from\
    \ the partition unique GUID should replace the XXXXXX. When you're done, save\
    \ and exit. You can then start your Raspberry Pi. Congratulations, your Raspberry\
    \ Pi is now faster and more reliable to use.\n\n# Boost performance with overclocking\n\
    \n**15** There's little from your Pi that's possible to overclock the computer.\
    \ Although you should be aware of the risk, proceed with this activity. You should\
    \ also ensure that your Raspberry Pi's processor is suitably cooled—heat sinks\
    \ for the CPU, Ethernet controller and power regulator can be purchased online.\n\
    \n# Overclock your Pi\n\n**16** Overclocking a available through rasp-config.\
    \ Launch from the command line: **sudo raspi-config** and navigate to Advanced\
    \ Options. Then select Overclocking. Three options are available: **Modest**,\
    \ **Medium**, **High** and **Turbo**. With your ideal clock speed selected, exit.\
    \ Choose **Yes** to apply.\n\nsudo shidown -r now\n\nYou'll need to perform tests\
    \ to see how stable it is. For example, you'll run stress test: **sudo apt-get\
    \ stress**. It's a good stress test. Should the Pi fail to boot, hold Shift to\
    \ boot without overclocking, run raspi-config and select a more modest overclock.\n\
    \n# Run Raspbian without the GUI\n\n**17** Despites changes, you may find that\
    \ the GUI means slow. If you'd rather run a lot of commands in bash, one method\
    \ would be to disable X. In raspi-config, choose boot behaviour and select the\
    \ first (default) option to ensure your Pi boots to the command line. Should you\
