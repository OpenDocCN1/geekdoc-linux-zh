  md: '# Projects


    # Get alerts with the Raspberry Pi baby monitor


    # Survey the bedroom


    **01** Before you start installing and configuring your Pi, head to the baby’s
    bedroom and take a look around. Where will you be placing the Raspberry Pi? Is
    it within reach of a power source? Do you need to connect an Ethernet cable, or
    is the wireless signal strong enough? It’s vital at this stage to spend the necessary
    time planning the Pi’s position in relation to power sources and network connectivity.


    # Enable the camera


    **02** If you’re using the PiCam, this can be disabled by default. You can enable
    it in the raspi-config tool. This can be accessed in the GUI by opening Menu >
    Preferences > Raspberry Pi Configuration, where you should select the Interfaces
    tab and switch Camera to Enabled. Alternatively run sudo raspi-config and choose
    option 6, Enable. CameraFor USB webcams, use


    ```

    sudo apt-get install fswebcam

    ```


    And test with


    ```

    fswebcam shot.png

    ```


    # Test the camera


    **03** You don’t want to set this project up to find that the camera doesn’t actually
    work. Whether you’re using a USB webcam or the PiCam, you’ll need to run a command
    to test the camera.


    To confirm, use the GUI to browse to `/home/pi` and view the `image.jpg` file.


    This is preferable to checking in the command line, as you can ensure the image
    is not corrupt.


    # Install motion


    **04** The motion capture software, motion, can be installed after an update and
    upgrade of the Raspberry OS.


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install motion

    ```


    Older versions of motion will not start automatically, and display the “Not starting
    motion daemon” error message. To avoid this, you need to make sure you run the
    update and upgrade commands. If you’re using the PiCam module, you’ll also need
    a driver:


    ```

    sudo apt-get install motion libcamera-client0.1 libcamera0.1

    ```


    # Activate PiCam driver


    **05** To activate the PiCam driver, you need to enter the following command:


    ```

    sudo modprobe brcm2835-v4l2

    ```


    This enables the PiCam to communicate with third party apps, such as motion. However,
    if you reboot, unless you add it to `/etc/rc.local`: Open the file in `/etc`


    ```

    sudo nano /etc/rc.local

    ```


    Find an empty line before exit “0” and enter


    ```

    modprobe bcm2835-v4l2

    ```


    Then CTLR-\* to exit, and Y to save.


    # Auto-start motion


    **06** Begin by opening the `motion` configuration file.


    ```

    sudo nano /etc/default/motion

    ```


    Here, we need to instruct the software to start each time the Raspberry Pi boots.
    Find the value ‘daemon off’, and change it to read


    ```

    daemon on

    ```


    Hit CTLR-\* to exit, tapping Y to confirm you wish to save the file, and Enter
    to continue. Next, confirm the motion daemon works on a reboot by restarting your
    Pi


    ```

    sudo reboot

    ```


    # Configure motion


    **07** The next step is to configure the motion software. This means setting the
    frame-rate (how often an image is captured), image dimensions (bigger images will
    take up more resources, thereby slowing the monitor) and setting the video format!
    How you configure motion really depends on which model of Raspberry Pi you will
    be using for this project. First generation devices will'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Projects


    Still handle low-resolution images comfortably for a real-time feed, you should
    probably use the Raspberry Pi 3.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_0.png)


    # Edit the config file

    08


    To begin configuration, just open motion.conf

    ```sudo nano /etc/motion/motion.conf```


    Use the CTRL+AW shortcut to open search, find each of the following conditions,
    adding the values as specified:


    ```

    daemon on

    framerate 2

    width 640

    height 480

    ffmpegvideo_codecs mpeg4

    stream_localhost off

    control_localhost off

    ```


    If you''re recording in a dark room, you can adjust the brightness and contrast.
    With the changes made, hit CTRL+W to exit, confirming with Y and Enter.


    # Assign ownership to target directory

    09


    You may find that the camera stops streaming images after a short time. This is
    a permissions issue, one that causes a few images to appear on your screen before
    the whole thing comes to a stop. Overcome this with

    ```sudo chown motion: /var/lib/motion```


    # Get alerts with the Raspberry Pi baby monitor


    You can also set a custom file path in motion.conf. Look for target_dir and change
    as appropriate. Remember to save the file and restart motion when you''re done.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_1.png)


    # Start and test your baby monitor

    10


    We now almost have a fully working baby monitor. At this stage, all that is left
    to get the baby monitor set up and running is to launch the motion:

    ```sudo service motion start```


    You should be able to browse to the feed by entering the IP address of your Raspberry
    Pi in a mobile browser. This should typically be something like

    192.168.0.10:8081


    Check this on multiple devices on your home network to confirm that it works.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_2.png)


    # Adjust motion detection

    11


    It''s motion detection that will do the bulk of the work in a baby monitor setup.
    To alter the sensitivity, you need to adjust this for the environment you have
    set up in the baby monitor set up in, open

    ```sudo nano /etc/motion/motion.conf```


    And use CTRL+AW to search for "Motion Detection Settings".

    Here you''ll find various conditions with values that you can adjust, such as
    threshold and area_detect_value. These will require some patient tweaking for
    the best results.


    # Make motion beep

    12


    To aid in twerking the detection, you can enable a beep to sound when movement
    is captured. As a project this needs some calibration to get the best results,
    this is a useful feature. Again, this setting is found in motion.conf. Search
    for "quiet on" and change the setting to read

    quiet off


    Remember to undo this when you''re happy with the motion capture, as it may disturb
    the little one!


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_3.png)


    # Adjust image quality

    13


    While you can alter dimensions of the images captured by the PiCam board, it''s
    important to be careful with the figures you enter in motion.conf. For instance,
    a dimension of 133x342 pixels probably won''t work. Dimensions need to be multiples
    of 4. For larger options, look at 1280x800 or 1920x1080.

    Not only will larger images impact bandwidth, they''ll make the resulting AVI
    file larger.'
  merge: -1
  img_proc: true
