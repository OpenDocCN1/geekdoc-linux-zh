    \ and any existing packages are up-to-date. Simply enter the following into the\
    \ LXTerminal:\n+   \n+   ```\n+   sudo apt-get update\n+   sudo apt-get upgrade\n\
    +   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_0.png)\n\n# Installing\
    \ Synaptic\n\n+   2. Now that the system is up-to-date, we’re finally ready to\
