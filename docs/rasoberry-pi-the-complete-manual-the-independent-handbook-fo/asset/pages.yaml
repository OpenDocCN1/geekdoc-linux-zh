  md: '# Print wirelessly with your Pi


    # What you''ll need...


    +   Latest Raspbian image

    +   USB printer

    +   USB wireless card


    # Print wirelessly with your Pi


    Breathe new life into an old printer by using your Raspberry Pi as a wireless
    print server.


    Wireless printing has made it possible to print to devices stored in cupboards,
    sheds and remote rooms. You don''t have to own a shiny new printer for this to
    work; old printers without native wireless support don''t have to end up in the
    bin, thanks to the Raspberry Pi.


    The setup is simple. With your Pi set up with a wireless USB dongle, you connect
    your printer to a spare USB port on the computer. With Samba and CUPS (Common
    Unix Printing System) installed on the Raspberry Pi, all that is left to do is
    connect to the wireless printer from your desktop computer, install the appropriate
    driver and start printing.


    CUPS gives the Raspberry Pi a browser-based admin screen that can be viewed from
    any device on your network, enabling complete control over your wireless network
    printer.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_79_0.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_79_1.png)'
