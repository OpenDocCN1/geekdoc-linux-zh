  md: "![](img/fd3f4a582cf5250916d8b8e1d4ccd045_117_0.png)\n\n# Xbox Zero arcade\n\
    \nLet's make a self-contained arcade machine out of old bits of kit, a spare Xbox\
    \ pad and a Pi Zero!\n\n+   **What you'll need...**\n+   \n+   Raspberry Pi Zero\n\
    +   Original Xbox controller\n+   Wire cutters\n+   Craft knife\n+   Isopropyl\
    \ alcohol swabs\n+   Micro SD card\n+   BluTack\n+   Micro USB OTG cable\n+  \
    \ Cross-head screwdriver\n+   Electrical tape\n+   2A micro USB power supply\n\
    +   Mini HDMI cable/adapter\n\nThe Raspberry Pi Zero is tiny, ridiculously tiny.\
    \ It's also small enough to be hidden in a variety of household objects in order\
    \ to enhance their capabilities. Whatever you can find to fit it in, you can turn\
    \ into some kind of smart machine.\n\nTake old game controllers. If you're anything\
    \ like us you've probably got a couple of boxes full of old computer equipment\
    \ you just can't bear to throw away – an Atari Jaguar that hasn't been touched\
    \ since the 90s, a Sega Dreamcast which you're sure you'll plug in again one day,\
    \ an old Xbox that lies languishing since you picked up something bigger and better.\
    \ Turns out it actually was useful to keep them around – it's time to bring these\
    \ old systems back to life.\n\nWe're going to show you how to gut an old videogames\
    \ controller, replace its innards with a Raspberry Pi Zero, and then load it up\
    \ with a treasure trove of retro games. From start to finish, this project should\
    \ take you under an hour to complete – and then you'll be able to load up the\
    \ ROMs you legally own on your new console and enjoy them from the comfort of\
    \ your sofa."
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Xbox Zero arcade




    # Gather your equipment


    +   **01** While the Zero doesn’t take up much space, videogame controllers are
    often substantial, or de l''aise électronique. The trick here is to find a games
    controller which has enough space inside for the Zero. We’re going to be using
    the original Xbox controller, nicknamed The Duke. If you don’t have one to hand,
    they can be picked up for a couple of quid from most second-hand electronics shops,
    and they’re easily found online too. If you can’t find one, you can use newer
    USB game pads that are designed to look like controllers for classic systems like
    the SNES and Mega Drive. Make sure you choose a controller that has enough buttons
    for the games you want to play — some classic, fighting games, for example, really
    can’t be played on a two-button NES controller.


    # Warning!


    +   **02** Working with electrical items and sharp objects can be dangerous. You
    risk damaging yourself or, worse, stressing your toys. Please ensure everything
    is unplugged from electrical supplies before attempting this project. As with
    any electronics projects, you should also take care to fully ground yourself before
    playing around with sensitive components — the static electricity from your body
    can ruin them. Anti-static wrist straps or a few taps on a radiator should do
    the trick.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_118_0.png)


    Above You can mod your controller with just a few simple tools'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Lots of little bits


    With a plastic case and a bunch of little bits, an Xbox controller can feel...
    flimsy and fragile. The good news: the controller is quite repairable. Just like
    our old-school consoles, its circuit board is held together with plastic clips,
    and the internal wiring is quite easy to follow. The main problem, though, is
    the number of buttons. It’s easy to misplace small parts like the D-Pad buttons
    when opening up the controller — so pay attention to how each component fits into
    place. And be sure to keep track of every tiny screw you remove along the way.
    You should be able to reassemble the whole thing with just a set of precision
    screwdrivers and a little patience.


    # Xbox Zero arcade


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_119_0.png)


    # The build


    **03** You should be now have a reasonably good idea of the controller that we''ll
    be working with. ''The Duke'' has dual joysticks, six buttons, a D-Pad and two
    triggers — and it''s compatible with most retro games systems.


    # Fitting


    **04** If you''re using a different controller, double-check that the Pi is likely
    to fit inside before you crack it open. As you can here, the Pi nestles neatly
    between the triggers of this controller — the original Xbox controller is one
    of the largest.


    # Unscrewing


    **05** The controller is held together by half a dozen cross-head screws. Be careful
    when opening the case so the buttons and rubber contacts are loose within the
    controller — they will spill everywhere!


    # Opening


    **06** With the shell removed, you should be able to spot the screws holding the
    main circuit board in place. There are also a couple of connectors which power
    the vibration motors — gently unclip them in order to completely remove the board.
    You might find it easier to use a pair of pliers for this — just be very gentle
    as you pull.


    # Gently does it


    **07** You can see for yourself just how well the Pi fits here; it can be squeezed
    under the memory card slot. If you want to hold it firmly in place, use some Blukta
    as a temporary card holder. Also, if you''re using an older controller, it''s
    worth giving it a bit of a clean. Remove the rubber contacts and gently swab under
    them using the isopropyl alcohol wads.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Xbox Zero arcade


    # Projects


    # Cut to fit


    08  Depending on the model of controller you may find that the Pi blocks one of
    the internal plastic struts. The plastic is soft enough that a craft knife will
    easily cut it down to size though. Start with small strokes, shaving off a tiny
    bit at a time until you have enough room. Make sure the plastic dust is cleared
    out before you reassemble the controller. If you have a can of compressed air,
    you can use it to easily blow away the shavings.


    # Connecting it up


    09  If you’re using a controller that has a regular USB port on it, you can just
    plug it into the Pi via a USB OTG converter. If you’re using the original Xbox
    Controller, it’s slightly tricky. Microsoft, in its infinite wisdom, has decided
    that the original Xbox should use USB—but, with an incompatible plug design. This
    means, in order to connect the controller to the Pi, we need to do some wire stripping.
    Fun!


    The wiring inside the Xbox controller’s cable uses bog-standard USB wiring colours,
    so once you’ve chopped the plug off the controller and the OTG cable, it’s pretty
    straightforward to connect them together.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_120_0.png)


    > **White**

    > This wire is one of two used for differential data signals.

    > This white wire is the positive component, and the green wire is the negative
    one.


    > **Red**

    > The red wire is one of two handling power. This one is a 5V power line that
    provides voltage to the circuit.


    > **Green**

    > The circuit can get the difference between the two data signals rather than
    between a single wire and ground—it’s a more effective transmission.


    > **Black**

    > This is the other wire associated with the power—the ground wire, which is the
    counterpart to the 5V wire.


    > **Yellow**

    > USB miniature sockets will also have an additional wire that isn’t required
    for our particular project.


    Left: The older USB 1.0 and 2.0 cables have fewer wires than the newer 3.0—here’s
    a quick guide.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Projects


    # Xbox Zero arcade


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_121_0.png)


    Above You can solder the OTG cable and controller together, but sticky-tape will
    also do the trick


    # The right controller


    The right controller is the best choice, which can be found in most shops (we’ve
    used a standard one).


    # Wiring


    **10** Strip the wires by a couple of centimetres and then connect them together.
    You should have Red, Green, White, and Black. The Xbox cable also has a Yellow
    wire which you can ignore. It is worth noting at this point that you need to be
    sure that you have a USB data transfer cable and not just a plain old power cable
    – the former will look like the photo above, but power cables will be missing
    the two data wires.


    With the wires stripped, we temporarily used regular sticky-tape to make the connections
    between the OTG cable and the controller – for a more permanent installation,
    you can use electrical tape or simply solder the wires together.


    # Insulation


    **11** One thing to note you’ll need to insulate the bottom of the Pi against
    all the contacts on the controller. For this quick hack, we’ve used some of the
    cardboard packaging – but any non-conductive material will do.


    From there, it’s as simple as screwing the case back together. Make sure that
    the controller’s buttons and joysticks don’t slip out of alignment. Keep track
    of which coloured buttons go where and you should be fine.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Wiring up


    12 The Pi will need three wires connected to it in order to work. The controller
    cable needs to be connected to the USB OTG port. An HDMI cable goes from your
    TV to the mini HDMI port on the Pi. Finally, a 2A micro-USB power supply needs
    to be plugged into the Pi’s power socket. We’ve used a standard reusable phone
    charger, but you can use a USB battery pack if you want to reduce the mess of
    wires trailing around your room


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_0.png)


    # A word about power


    13 This might seem a little fussy, but it’s possible to get the HDMI connection
    to work without the TV to the controller. Sadly, the HDMI specification doesn’t
    provide power to flow in that direction. If your TV has a USB socket on it, you
    could use that to supply the Pi with power – just make sure the socket is as powerful
    as enough for a Pi (needs at least 1 Amp, and ideally 2 Amps). Many TVs will only
    output 500mA which isn’t enough to run the Pi.


    # Let’s play!


    14 Okay, it’s looking good – you’re nearly ready to play. The next step is to
    get some emulation software on this thing


    > “If your TV has a USB socket, you could use that to supply the Pi with power
    – just make sure it’s powerful enough”


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_1.png)'
  merge: -1
