- pgno: 72
  md: '![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_0.png)


    # Projects


    # Add a battery pack to your Raspberry Pi


    > "You can use your device for mobile projects as diverse as launching it into
    near-Earth orbit"


    **Make your order**  **01**  *If you''re buying your components online you should
    be able to get them all within five days. However, if you''re ordering offline
    (specifically the UBeC), you should avoid traditional electronics stores and instead
    visit a model enthusiast store, as these circuits are regularly used in RC devices.*


    **Check your UBeC**  **02**  *Two types of UBeC are available to choose from.
    If you used the store that we suggest in the resources box to the left, you''ll
    receive one with a micro USB power connector for easy connection to your Raspberry
    Pi. However, if you bought one from eBay, then there is a strong chance that you
    will receive one with a 3-pin connector.*


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_1.png)


    **Move connector pins**  **03**  *In order to use the UBeC with a 3-pin connector,
    you''ll need to alter the position of the pins so that they occupy the two outer
    slots. Just use a small jeweller''s screwdriver to lever up the small plastic
    pad and remove the red wire from the central slot, before sliding into the unoccupied
    outer slot.*


    **Connect to battery box**  **04**  *With five batteries in the UBeC (battery
    box, connect it to the UBeC led-red, black to black) by twisting the wires, soldering
    or employing a 3 way terminal strip, cut down to two pins. It can be cut to size
    using a modelling knife.*


    **Add a battery to boot**  **05**  *With your Pi ready to use and your WiFi dongle
    plugged in, connect the UBeC to the micro USB port and insert the sixth battery
    into the battery box. The Pi''s power and status lights should indicate that the
    computer is booting up, which gives you a fully portable computer.*


    **Connect the 3-pin UBeC**  **06**  *If you purchased the UBeC with the now-modified
    3-pin connector, you need to connect this to the Raspberry Pi GPIO header. Connect
    the positive +5V (red) connector to Pin 2 and the negative 0V connector to Pin
    6.*


    **Measure uptime**  **07**  *You should have already set up the device for SSH
    use, so connect to the device via Putty after giving it time to boot fully (at
    least 60 seconds). In the terminal, enter:*


    ```

    `sudo idb csi3m sf:/Users/rache.larrabi/Deskt op/ArcHLinux/ archnl-linux-HF-2013-02-11.img
    >dev/disk1`

    ```


    *This command will display the system uptime and also keep the Wi-Fi connection
    active.*


    **Judge your uptime results**  **08**  *Uptime results depend upon the type of
    battery you use and the Raspberry Pi model. Single-charge batteries will last
    a little bit longer, but this is a more expensive option. Meanwhile, newer models
    (with greater power requirements but more for less time. For more power, add a
    better battery)*


    **Power extreme!**  **09**  *More batteries added in parallel should result in
    almost double the uptime (at least 16 hours on a 255Wm Raspberry Pi Model A),
    but instead of alkaline or rechargeable batteries, you might consider a modern
    lithium-based AA cell, which will last considerably longer than alkaline batteries.*'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Draw circuits with paint


    # What you''ll need...


    +   * Bare Conductive paint (pen or tub)

    +   * Male to female jumper wires

    +   * An assortment of LEDs, switches and resistors (optional)


    # # Draw circuits

    # with paint


    Assembling circuits has never been so easy with the joys of conductive paint,
    enabling you to bring together art and electronics in a whole new way


    Playing with electronics and physical computing is a very rewarding task. For
    a beginner though, the mess of wires and components can become very confusing
    quite quickly and things like soldering can be a safety concern when children
    are involved. Bare Conductive has taken the joy of electronics and made it far
    safer, easier and more versatile with their conductive paint. You can literally
    draw wires on paper with a paintbrush, use it for cold-soldering or a conductive
    adhesive and much, much more. There are not a great deal of boundaries to what
    you can do. Pair this paint with a microcontroller board and you could be creating
    interactive art, clothing and projects in no time.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_0.png)


    # Get your tools


    **01** Paint and a paintbrush aren''t the first items that come to mind when you
    think about electronics, so you may be wondering where to get them from. **Bare
    Conductive** stock the paint and a selection of components in their shop [bareconductive.com/shop](bareconductive.com/shop)
    but you will need to go somewhere else for art supplies. We would recommend trying
    a high street craft shop such as Hobbycraft ([hobbycraft.co.uk](hobbycraft.co.uk))
    or a local independent.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_1.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Draw circuits with paint


    # Projects


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_0.png)


    # Pick your platform


    02 The great thing about Bare Conductive paint is that, when dry, it works just
    like normal wiring! That means you can use it with any of your favourite microcontrollers:
    use the Bare Conductive Touch Board a Raspberry Pi or Adafruit’s wearable FLORA
    platform. Or you can just use some a small on batteries and flashing LEDs for
    a standalone system.


    # Start to paint


    03 You can paint Bare Conductive paint onto pretty much any surface – paper, fabric,
    walls, clothing, wood, plastic and much more. For really accurate shapes and results,
    the best idea is to create or purchase a stencil (paper stencils are easiest to
    make at home but use vinyl for the best edge finish).


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_1.png)


    # Connect it up


    04 There are plenty of ways to connect to the conductive paint (from battery packs
    for example) no matter what surface it’s on, because once it’s dry it acts just
    like an unsulliated wire. Therefore you can use wires glue on with the paint,
    paper clips, bulldog clips, alligator clips or even sewn-in conductive snaps for
    wearable projects


    # Make repairs


    05 The conductive paint is thick and when it’s dry it becomes quite strong. This
    means you can use it to cold-solder things together and repair any breakages.
    In other words, you could glue components into a circuit board or glue wires together
    and they would still function electrically


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_2.png)


    # “The mess of wires and components can become very confusing”


    # Clean up


    06 A lot of you are probably thinking that something as cool as conductive paint
    is going to be nasty stuff. Actually Bare Conductive paint is non-toxic, water-based
    and water-soluble, and can therefore be cleaned easily with soap and water.


    # Make it waterproof


    07 This paint only comes in black and it’s not waterproof. However, the great
    thing is that you can use it to underneath or alongside any regular paints, varnishes
    and waterproofing sprays in order to act as insulation – or just to add some colour
    into your designs.


    # Touch and sound


    08 Bare Conductive paint can also be used as a capacitive surface, meaning you
    can use it for touch, gesture or proximity controls when it is paired with a suitable
    control board. Bare Conductive make their own called the Touch Board which has
    everything you need to start experimenting with touch and sound. It can even act
    as a MIDI controller, an interface or an instrument.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_3.png)'
  merge: -1
  img_proc: true
