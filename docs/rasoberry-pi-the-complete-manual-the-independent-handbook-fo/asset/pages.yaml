  md: '# Gain remote desktop access


    # Projects


    # Installing VNC part 1


    Now reinstall VNC and ensure that it starts automatically, whenever the operating
    system does. We don''t need to worry about the Raspberry Pi versions, as configuring
    services often had a nasty habit of breaking the system. But no longer. Enter
    the following commands, pressing Enter after each one:


    ```

    ```bash

    sudo apt-get update

    sudo apt-get install tightvnserver

    ```

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_44_0.png)


    # Installing VNC part 2


    When the packages have been installed and your VNC server is ready to follow the
    instructions on screen and **create a username and password**. You might be asked
    to specify the **features** that can be used to access the **Pi at 1.2.3.4**.
    In **VNC**, it''s actually **absolutely necessary** to set up user access to a
    password to access your desktop.


    ```

    ```text

    You will require a password

    to access your desktop.

    Password:

    Verify:

    Would you like to enter a

    view-only password (y/n) n

    New X desktop is rasbpberrypi:1

    ```

    ```


    # Configuring VNC server


    That''s the VNC server installed up and running. Now we need to make sure it loads
    up as a service every time the Raspberry Pi reboots, so you can access it even
    if the Pi undergoes a power cycle. To configure the Pi to do this, type the following
    in the terminal and press Enter.


    ```

    ```bash

    sudo nano /etc/init.d/

    tightvnserver

    ```

    ```


    # Configuring boot service


    We''re back in nano, and we need to enter some lines of commands in order to allow
    the Raspberry Pi to activate the VNC server when it boots. In the editor, type:


    ```

    ```bash

    #!/bin/sh

    #if [unit /etc/init.d/tightvnserver]

    # Set the NUMBER to start

    # the tightvnserver user

    # NUMBER=''pi''

    case "$1" in

    start) su NUMBER -c ''/usr/bin/

    tightvnserver -c ''

    # echo "Starting TightVNC

    # server for "''$NUMBER"''

    #;;

    stop)

    pkill xtigntVnc

    echo "TightVncserver stopped"

    #;;

    *)

    echo "Usage: /etc/init.d/

    tightvnserver

    start|stop"

    #;;

    exit 0

    ```

    ```


    # Reboot and ready to go


    Now press **Ctrl-X**, then **Y** and **Enter**. To save. Follow that a couple
    of tries to get you back into the Terminal. Now we need to do now is edit the
    permissions of the script we''ve just created so that it''s executable and active.
    Do this by typing the following commands into the terminal, ensuring that you
    press Enter after each one otherwise it will not be registered!


    ```

    ```bash

    sudo chmod 755 /etc/init.d/

    tightvnserver

    sudo rc-tightvnserver defaults

    sudo reboot

    ```

    ```


    Once you have completed these steps, the final thing that you will need to do
    is to unplug the Raspberry Pi and locate it somewhere that has easy access to
    a network cable. If you install the latest version of TightVNC, or any other remote
    access software (as long as it uses the Tight protocol) then you should be able
    to point the client to the IP address (192.168.193.185) or the static IP address
    to connect to the network that you with to connect the device to and have full
    access to the Raspberry Pi.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_44_1.png)


    ```

    ```bash

    sudo nano /etc/init.d/

    tightvnserver

    ```

    ```'
