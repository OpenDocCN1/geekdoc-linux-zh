  md: "# # Getting started\n\n### What you'll need...\n\n**Synaptic:**\nwww.nongnu.org/synaptic/\n\
    \n## Use graphical installations\n\n# # Use graphical installations\n\n*Would\
    \ you prefer a graphical interface to install new programs? If so, then read on...*\n\
    \nIf you're new to Linux, you may find using its built-in Apt package management\
    \ tool a bit intimidating and confusing. The apt-get command is used for installing\
    \ applications through the internet, connecting to the remote servers – called\
    \ repositories – which house the programs as packages. But it is used through\
    \ the terminal command prompt, which can be daunting, so we need an alternative:\
    \ a desktop environment interface method of getting hold of packages.\n\nThis\
    \ is where Synaptic comes in. Synaptic is a friendly-looking graphical interface\
    \ to the apt-get terminal command which allows you to manage your application\
    \ installations, and removals, through the already familiar desktop environment.\
    \ Think of it as a kind of online shop where you can pick and choose the programs\
    \ you want and have them downloaded and installed onto your Raspberry Pi without\
    \ you having to drop into the terminal.\n\n### Did you know... \nRaspberry Pi\
    \ runs the latest version of Debian Linux, complete with the latest packages for\
    \ all the different desktop environments such as Cinnamon, XFCE, LXDE and GNOME.\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_33_0.png)\n\n**Upgrade entire systems**\n\
    Synaptic has the ability to upgrade and update every program or package, and can\
    \ upgrade your entire system to the latest version\n\n**Install and more**\nSynaptic\
    \ is a very powerful tool. With it you can install, remove, upgrade and downgrade\
    \ single, or multiple packages and programs\n\n**Browse all documentation**\n\
    From within Synaptic, you are able to browse and read all available online documentation\
    \ related to a package or program\n\n**Easily find programs**\nSynaptic enables\
    \ you to easily locate packages and programs by name, description, version and\
    \ even by who developed the program"
  merge: -1
