  md: "# Update and upgrade\n\n+   01 Getting hold of a package\n+   Dropping into\
    \ the command-line terminal, via the LXTermimal icon on the desktop, and entering\
    \ a few commands. But before we do that, we need to make sure the system is up\
    \ to date. Enter the following into the terminal:\n+   ```\n+   sudo apt-get update\n\
    +   sudo apt-get upgrade\n+   sudo apt-get update && sudo apt-get upgrade\n+ \
    \  ```\n\n# Search for a package\n\n+   02 The apt-get command (Advanced Package\
    \ Tool) is the key to downloading and installing packages on the Raspberry Pi.\
    \ In the previous instance, we updated the existing packages and system, upgraded\
    \ any that needed it, and updated the current package list. Now, let's search\
    \ the list of server packages for available games.\n+   ```\n+   apt-cache search\
    \ game | less\n+   ```\n\n# Apt searching\n\n+   03 The current list you find\
    \ yourself in is the name of all the packages labelled as 'games' from the available\
    \ server. In the list, the part before the hyphen tells you the name of the package,\
    \ which is what you will need to know to be able to install it. Use the arrow\
    \ keys up/down to navigate, press 'Q' to exit\n\n# Install and use packages\n\n\
    # Installing a package\n\n+   04 Using the up and down arrow keys, navigate the\
    \ list. If you find something you like the look of, say Angry Drunken Dwarves,\
    \ remember the name of the package, in this case angryd2, and press 'Q' to exit\
    \ the list. To install the package, enter the following in the terminal:\n+  \
    \ ```\n+   sudo apt-get install angryd2\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_0.png)\n\
    \n# Executing the package\n\n+   05 The result of the previous command should\
    \ be the successful download and installation of the game, Angry Drunken Dwarves.\
    \ To execute the newly installed package, you can either run it from the LXDE\
    \ Menu under Games->Angry Drunken Dwarves, or by typing in the following into\
    \ the terminal:\n+   ```\n+   angryd2\n+   ```\n\n# Remove a package\n\n+   06\
    \ This installing of packages is perfectly fine, and you can see just how powerful\
    \ a command Apt really is. But, what if you want to remove a package?\n+   Using\
    \ the Apt command again, let's say we want to completely remove all the trace\
    \ of Angry Drunken Dwarves from the Raspberry Pi.\n+   ```\n+   sudo apt-get --purge\
    \ remove angryd2\n+   ```\n+   Enter \"Y\" to accept the removal.\n\n# Getting\
    \ started\n\n# Apt Easter eggs\n\n+   07 The Apt command is a shorter, non-menu-driven\
    \ variant of the Aptitude command. This command has a long history in Linux, and\
    \ as a result has some rather special features, also known as Easter eggs. Purely\
    \ for a bit of fun, type in the following commands and see the results:\n+   ```\n\
    +   aptitude moo\n+   aptitude -v moo\n+   aptitude -vv moo\n+   aptitude -vvv\
    \ moo\n+   aptitude -vvvv moo\n+   aptitude -vvvvv moo\n+   aptitude -vvvvvv moo\n\
    +   sudo apt-get moo\n+   ```\n\n# Man the Apt command\n\n+   08 As you can see,\
    \ there is more to the simple Apt command than what first meets the eye. There\
    \ are many different sub-commands you can run, and many different variations in\
    \ which to run them.\n+   \n+   If you want to see what else the Apt command can\
    \ do, enter the following:\n+   ```\n+   man apt\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_1.png)"
  merge: -1
  img_proc: true
