  md: "# Control lights with your Pi\n\n# Projects\n\n# Switching the socket on and\
    \ off\n\n08 Since you have not told the socket to turn off it will stay on, which\
    \ means the lamp will stay on forever (or until the bulb blows!) To turn the socket\
    \ off after five seconds, import the time function at the start of your program\
    \ (line 2, below), and the command to turn off the socket (line 5). Then add a\
    \ pause with the sleep command (line 7) and finally turn off the lamp (line 8).\
    \ Now save and run the program.\n\n```\nimport GPI. GPIO as GPIO\nimport time\n\
    import energenie\nfrom energenie import switch_on\nfrom energenie import switch_off\n\
    \nergenie.switch_on()\ntime.sleep(5)\nergenie.switch_off()\n```\n\n# CSS and HTML\n\
    \n10 To make the web page presentable, you need to set up an HTML, and a CSS file.\
    \ HTML stands for HyperText Markup Language and is used to create web pages. Your\
    \ browser reads HTML files and converts them into web pages, enabling images and\
    \ objects to be embedded into the pages. Cascading Style Sheets, or CSS, is the\
    \ code which describes how the web page will look, the presentation of the HTML\
    \ content. It contains instructions on how the elements will be rendered. Here,\
    \ it controls how the on and off options will be presented.\n\n# Create a new\
    \ folder\n\n11 With Flask installed, reboot your Raspberry Pi type sudo reboot.\
    \ Create a new folder called *WebApp_Lights* in the home/pi/folder. This is where\
    \ you will save the Python program which controls the socket and lamp, the CSS\
    \ and HTML file. You can create the folder in the LX Terminal by typing mkdir\
    \ Module. Lights or right-clicking in the window and selecting New Folder.\n\n\
    # Web-based applications\n\n09 It is possible to augment the web back so that\
    \ you can turn the lamp on and off from a mobile device such as your phone, laptop\
    \ or tablet. This makes the whole project more impressive, slick and fun. The\
    \ first step is to set up your Raspberry Pi as a web server which will host and\
    \ display a web page with the ON/OFF option. These buttons are interactive and\
    \ control the socket. Open the LX Terminal and install pip and Flask.\n\n```\n\
    sudo apt-get install pip\nsudo pip install flask\n```\n\n> “Using a mobile device\
    \ such as your phone, laptop or tablet makes the whole project more impressive,\
    \ slick and fun”\n\n# The HTML files\n\n12 Open the Module_Lights to set up and\
    \ create a new folder called “templates” . This folder is where the HTML file\
    \ is saved that contains the structure for the website pages. The code names the\
    \ page tab and, most importantly, adds the links for the on and off option. Open\
    \ a text editor from your Start menu, or use nano and create a new file. Add the\
    \ HTML below to the file and then save the file into the template folder, naming\
    \ it “indexHTML. Remember, this is an HTML file and must end with the file extension\
    \ .html.\n\n```\n<!doctype HTML>\n<html>\n  <head>\n    <title>Light Controller</title>\n\
    \    <link rel=\"stylesheet\" href=\"/static/style.css\" />\n    <meta name=\"\
    viewport\" content=\"width=device-width, user-scalable=no\" />\n  </head>\n  <body>\n\
    \    <div class=\"on\"><a href=\"/on\"></a></div>\n    <div class=\"off\"><a href=\"\
