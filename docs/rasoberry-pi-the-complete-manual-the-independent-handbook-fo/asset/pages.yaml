  md: '# Raspberry Pi-controlled car build process


    To demonstrate the build process, use two techniques and our Circuit Wizard data
    converter to make some circuit and control diagrams to help you understand the
    circuit. Diagrams are of the build can be downloaded with a couple of illustrated
    tutorials explaining a few more steps. The two diagrams below represent the main
    wiring and control flow.


    # 1 Identify and remove old radio


    +   **01**

    +   * **Pick a car** - Choose a car that has a radio controlled motor and wheels
    but no onboard electronics. This car is a 1/10 scale off-road buggy.

    +   * **Remove the electronics** - Remove the existing radio receiver and other
    electronics from the chassis.

    +   * **Label the wires** - Before disconnecting anything, label the wires coming
    from the receiver and motor so you can connect them to the Raspberry Pi correctly
    later.


    +   * **Power up** - Turn on the car to test the motor.


    +   * **Servo control** - The servo motor controls the steering.


    +   * **Pi-powered** - The Raspberry Pi powers the car.


