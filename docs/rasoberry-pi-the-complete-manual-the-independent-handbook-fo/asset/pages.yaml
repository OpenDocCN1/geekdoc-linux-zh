    **02** With Wheezy Touched to your SD card and your Pi booted up, open terminal
    and enter


    ```

    sudo apt-get install miro

    ```


    Installation will take a few moments. Once complete, you''ll find Miro in Menu>Sound
    and Video. Click it to get started.


    > Above Miro gives you a decent playback interface and excellent export options
    for converting videos to other formats.


    # Set Miro to launch at startup


    **03** Make sure Miro app is configured to launch at startup. Open ‘User Preferences’->General,
    and check ‘Automatically run Miro when I log in’ and ‘When starting up Miro remember
    what screen I was on when I last quit’. Also set your Pi to boot into X using
    the raspi-config utility.


    # Check for content


    **04** Switch to the Podcasts tab and place a check in the box labelled ‘Show
    videos from podcasts in the Videos section’. On the right-hand side of the window,
    set your preferred frequency for checking for new content. Miro will poll your
    favourite websites and feeds based on this setting.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_102_1.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Projects


    # Stream Internet TV to your Pi


    Right Playback settings can be altered in the relevant tab when accessing Miro''s
    Preferences


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_103_0.png)


    # Configure playback settings


    05 Move now to the Playback tab, and check Play media in Miro. This limits reliance
    on other apps, which may drain resources. You should also click the Play video
    and audio items one after another radio button, and under Resume Playback, check
    the first and third items.


    > The more links you add, the more regularly updated content will be downloaded
    to your media manager.


    # Source videos and podcasts


    06 With Miro now set up and ready to play back the video and audio content that
    you want to enjoy, it''s time to find some! The best way to do this is to just
    check the websites that you regularly use for video and audio podcasts (preferably
    the former) and then copy the XML link.


    # Add podcast feeds


    07 In Miro, open up File>Add Podcast and then paste the podcast feed URL into
    the dialog that appears, clicking Create Podcast when you''re done. The more links
    you add, the more regularly updated content will be downloaded to your P:Powered
    Miro media manager, ready to watch or listen to on demand.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Stream Internet TV to your Pi


    # Projects


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_104_0.png)


    # First time use


    +   **08** Remember earlier in the tutorial when we instructed Miros to behave
    in a particular way when it launched? It''s time to set that behaviour now.

    +   The process is started by opening the Videos view in the left-hand pane of
    the Miro window, and then playing the first video. Each time you boot your system,
    Miro will jump to this view and immediately begin playing your content, making
    sure you get up and running quickly and smoothly.


    # Avoid YouTube


    +   **09** As good a solution as Miros is to building a video podcast streaming
    center, displaying material that you''re interested in on demand, it''s sadly
    just no good for videos on YouTube. This doesn''t really restrict you too much
    as there are plenty of other media outlets to cover, but it''s worth mentioning
    if you''re a frequent YouTube watcher. This is a shame, but shouldn''t impact
    the way you use it – your Raspberry Pi now downloads focused content on demand.


    > Above You can subscribe to all sorts of content, from Internet TV channels to
    comedy and news podcasts


    # Checking for new content


    +   **10** It is tempting to set a regular frequency for your content checking
    in Files»Preferences»Podcasts, but note that checking too regularly is going to
    result in resources being hogged temporarily, which may result in an interruption
    if you happen to be actually watching something when Miro checks for new content.
    Limit polling to hourly or daily checks.'
  merge: -1
  img_proc: true
