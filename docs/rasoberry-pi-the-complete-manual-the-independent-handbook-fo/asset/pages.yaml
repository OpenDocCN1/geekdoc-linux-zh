  md: "have special purposes, though, so we recommend you familiarise\nyourself with\
    \ their layout. For example, the very top row of pins are\ndesigned to offer power\
    \ for external devices like buttons and lights.\nSince an earth line (often called\
    \ 'ground') is needed to safely create a\ncircuit, you'll also find several ground\
    \ pins located in the GPIO port.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_36_0.png)\n\
    \n> Below Become familiar with the\n> layout of the GPIO pins and what\n> they\
