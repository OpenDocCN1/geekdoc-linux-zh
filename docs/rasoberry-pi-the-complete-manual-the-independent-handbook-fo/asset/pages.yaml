  md: '# Mount hard drive


    03 Unless you plan to reformat your portable drive, you''ll need to install NTFS
    support onto your Pi. **Type in:**


    ```

    $ sudo apt-get install ntfs-3g

    ```


    Add the hard drive to /etc/fstab (open it with sudo nano /etc/fstab) by adding
    the line.


    ```

    /dev/[hard drive address]

    [mount point] auto_nofail rw 0 0


    Use fdisk to find the name of the instance, and /dev/sdz mount (for example, /dev/sdz)
    such as /home/pi/torrents with mount point, then /dev/sdzz to mount /dev/sdz /home/pi/torrents
    with mount


    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_0.png)


    # Install Deluge


    04 We''ll use Deluge for our torrents. Install it with:


    ```

    $ sudo apt-get install

    deluge-console

    ```


    Now start and then stop Deluge so it creates a config file we can edit with:


    ```

    $ deluge

    $ sudo pkill deluged


    And finally, run the following to copy the config file in case we mess up:

    $ cp ~/.config/deluge/auth --config/

    deluge/default

    ```


    # Basic configuration


    05 Edit the file with:


    ```

    $ sudo nano ~/.config/

    deluge/auth


    And add to the bottom:

    [username]:[password]:10

    ...

    ...

    to restrict access.

    Now start it up with:

    $ deluge-console

    ```


    pi@raspberrypi:

    # Free-Web-Server-Guide: $ sudo /etc/init.

    [infox] /etc/default/deluge

    sudo /etc/init/deluge-daemon.conf

    $ echo ''sudo /etc/init.d/deluge-daemon start''


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_1.png)


    # Remote connection


    06 Now you''re in the client, **Type the following three commands:**


    ```

    config -s allow_remote True

    config allow_remote

    exit

    ```


    Start the Deluge daemon with:

    $ sudo pkill deluged &

    deluged

    Now open the graphical client on your main PC.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_2.png)


    # Remote interface


    07 Go to Edit>Preferences> **Preferences** and select Classic Mode and restart
    Deluge. Click Add on the Connection Manager, and enter the IP in Hostname. Click
    Connect to see any torrents you have downloading or uploading.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_3.png)


    # Download location


    08 Go to Edit again and then **Preferences**, and change to the Downloads tab
    if it''s not on there already. Set the download location to the directory we mounted
    the hard drive to, and enable Auto add torrents; setting it to any destination
    you plan to dump torrents to the hard drive.


    # Start on boot


    09 An init script from Ubuntu can be used to have Deluge start on boot. Download
    it with:

    $ sudo wget -O /etc/default/deluge-daemon https://bit.ly/1zNXKiz

    Open /etc/default/deluge-daemon with nano and change the username to the one we
    set up earlier. Save it, then download the full init script and update with:

    $ sudo wget -O /etc/init.d/deluge-daemon https://bit.ly/1s8d76s

    $ sudo chmod 755 /etc/init.d/deluge-daemon

    $ sudo update-rc.d deluge-daemon defaults'
