- pgno: 20
  md: '# Install a distro


    # Getting started


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_20_0.png)


    # Formatting the card


    **05** In Windows, to format the card, simply insert and wait for it to mount.
    Then right-click on ''My Computer'' and then click on the card''s icon. After
    that, choose ''Format'' and then ''FAT32'' from the drop-down menu.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_20_1.png)


    # Using the terminal


    **06** If you are using OS X or Linux, then you''ll have to use the terminal to
    copy the image. In OS X, the terminal app comes installed by default, and most
    Linux versions come with one in some form or other. It may be referred to as the
    ''console'' or ''command line''.


    # Obtaining OSs


    **01** One of your first questions may be ''where can I find some operating systems
    to download?'' Most of the common images can be found on the main Raspberry Pi
    site: www.raspberrypi.org/downloads. These are stable and well-tested systems
    worth investigating.


    # OS Format


    **03** Within the zip you''ll find a file with a .img or .iso extension. These
    are the equivalent of a ''snapshot'' of an installation CD or DVD. Simply copying
    the file to the SD card won''t do anything; you''ll need to use a program to extract
    it.


    # Unzipping


    **02** When you''ve downloaded your image, the first thing you''ll most likely
    want to do is unzip it. This can be done in Windows by right-clicking and choosing
    ''extract''. In OS X, just double-click to extract the files.


    # SD card format


    **04** The SD card that you''ll boot from needs to be blank, so make sure there''s
    nothing important on it first. You''ll also need to format it to use the FAT32
    file system. This is a common system, used by most USB sticks and cameras.


    # DD command


    **07** The command you need to use is called ''dd''. This is entered in the format
    of ''dd <source> to <destination>'', for example, `sudo dd bs=4m if=/dev/sdb5`
    (or `if=/dev/sr0` if you''ve inserted a CD/DVD).


    ```

    sudo dd bs=4m if=/Users/rachel/Library/Desktop/.../RMLinux/archlinux-hf-2013-02-11_img.
    . of=/dev/disk1

    ```


    # Win 32 Disk Imager


    **08** Windows users can use Win32 Disk Imager. Once you''ve downloaded the tool,
    simply right-click on the exe and choose ''run as administrator'' and follow the
    prompts. When the installation is complete, you can put the SD card in your PC.
    Easy!


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_20_2.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Raspbian

    www.raspberrypi.org


    # Command line basics


    Learn an alternative way to control your Raspberry Pi by using the command line
    and your keyboard.


    We''ve probably all been there with the Raspberry Pi. You''ve installed Raspbian
    or another Raspberry Pi OS to your SD card and you''ve rushed through the setup
    script or not quite done your research. You start the operating system and...
    you end up at a command line. The first step here is not panic: this is perfectly
    normal. It may just be a bit of a foreign concept to you, only seen in films with
    streetwise hackers who want to bring down the system!


    The second step, at least in Raspbian''s case, is simply to type: $ start x


    That''s it. Raspbian will load up the desktop and you can start using the mouse
    again. Quick and painless in this case, and in that of many other operating systems
    as well. What you''ve done is use a command, specifically in this case to start
    the X server. The X server handles the graphical interface and can be turned off
    by default on some Pi systems.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_21_0.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_21_1.png)


    Fig 1: The terminal emulator allows you to access the command line while still
    being in the desktop environment'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Command line basics


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_22_0.png)


    # A new world


    Getting your Raspberry Pi into the desktop isn''t the only thing you can do on
    the command line, though. There''s a whole world of functionality built into the
    command line; in fact, most of the graphical programs you''re using are just executing
    these commands in such a way. You don''t have to leave the comfort of the desktop
    environment to perform these commands either; as all Raspberry Pi operating systems
    will come with an application known as a terminal emulator.


    This creates a window where a command can be written in the same way that we launched
    the desktop, and use the exact same commands (Fig 1). On Raspbian, look for the
    app LX Terminal in the Accessories section of the menu and click on it. If you''ve
    had to use start x to get into the desktop, then we can now fix that before continuing.
    In the terminal, enter:


    ```

    $ rpi-setup-config

    ```


    Here''s the initial setup screen (Fig 2). From here you can enable the desktop
    on boot (Fig 3), and even update the firmware and add support for the official
    Raspberry Pi camera module. This allows you to modify Raspbian without having
    to reinstall again.


    You won''t be using those two commands very often, though, so is there practical
    use for delving into the command line? Very much so. For starters, Raspbian doesn''t
    have an official package manager. This is a program that allows you to browse
    the available software for the operating system, similar to the Pi Store.


    However, there''s other software available to Raspbian that you can''t get through
    the store. You also can''t specifically update the Pi software either, and all
    of this can be fixed using the command line.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_22_1.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_22_2.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# ## Getting started


    # ## Command line basics


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_23_0.png)


    # ### Software for all


    The first thing you’ll want to do is let Raspberry know exactly what’s available
    online. It is a very simple task all you need to do is:


    ```

    $ sudo apt-get update

    ```


    This will run down a list of online repositories (or repos) that contain the software
    that Raspberry uses. Once it’s finished, the command-line prompt will pop up again
    waiting for your next command. As this is the first time you’ve done it, you’ll
    likely need to update the current software on your Raspberry Pi. You can do that
    with the command:


    ```

    $ sudo apt-get upgrade

    ```


    It may ask you to confirm the upgrade, in which case type ‘Y’ and then press Enter.
    What we’re doing both times is using the command-line package manager Aptitude
    (apt-get) to first check the repos, and then upgrade packages according to that
    (Fig. 4). The first command, sudo, allows it to run the apt-get task as an administrator,
    and is used in a lot of other command-line operations. To install software you
    use install instead of update or upgrade, followed by the name of the package.
    For example, with the mathematical programming language, you can install it with:


    ```

    $ sudo apt-get install wolf-am-engine

    ```


    # Did you know?


    sudo means superuser. It allows regular users to perform admin-only tasks.


    34'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Command line basics


    # Getting started


    # Move and create


    Installing and updating are just a couple of the many things you can do in the
    command line. You can also browse the entire file system, move files, create folders
    and delete items. All of these are very simple operations.


    When you first open the terminal, it will open up in your home folder. While you
    can’t specifically tell that it is, you can display exactly what kind of files
    are in the directory with (Fig 5):


    ```

    $ ls

    ```


    The tilde sign (~/) is used to denote the home folder and can be used for navigating
    around the file system. To navigate, we’ll be using the cd command, followed by
    the location you want to move to. This can be done like so:


    ```

    $ cd /home/pi/Downloads

    ```


    This will move you to the Downloads directory. As we were starting off in the
    home folder to begin with, we actually only needed to do this:


    ```

    $ cd Downloads

    ```


    It’s context sensitive and knows to look in the directory it’s already in. There’s
    another trick you can use so you don’t have to remember the exact name of the
    path – the command line or terminal will try to auto-complete the phrase. If you
    press the Tab key while something is only partially typed. Try the cd command
    again, but try pressing Tab when you’ve only written ‘Down’.


    Finally, there are some quick commands you can use to manipulate files. Individual
    files can be copied using the command cp, followed by the filename and the new
    location like so:


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    You can also use this to rename files by doing:


    ```

    $ cp file.txt otherFile.txt

    ```


    The original file can then be deleted by using the rm command:


    ```

    $ rm file.txt

    ```


    Want to create a new folder? Use cd to move to the directory you need to add a
    folder to, and then use mkdir followed by the name you want to give the folder.


    ```

    $ mkdir NewFolder

    ```


    There’s a lot more you can do with the command line, but these are the very basics.
    As you use Linux more and more, you’ll be confronted with tasks that need the
    command line, and through this process you’ll learn just how much can be accomplished
    when you work like a street-wise movie hacker.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_24_0.png)


    > > “The command line or terminal will try to auto-complete the phrase if you
    press the Tab key while something is partially typed”


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_24_1.png)


    Fig 5. There are many simple command-line tools that can help you browse and use
    your system'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# The Raspbian desktop


    Although the Raspberry Pi''s Raspbian operating system is closer to the Mac OS
    and Windows, it''s the latter that the desktop most closely resembles.


    It might seem a little alien at first glance, but using Raspbian is hardly any
    different to using a Windows desktop. There''s a menu bar, a web browser, a file
    manager and you''d expect, you simply open the Menu and click the applications
    you want to get started...


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_25_0.png)


    # Menu button


    The Windows-like Menu button in the top-left corner displays a list of programs
    and options. The main categories are Programming (where you''ll find appropriate
    tools), Internet, Accessories (an assortment of utilities), and Mathematics (system
    tools). Programs downloaded from the Pi Store will appear in the appropriate category.
    While the Run launches a command-line interpreter, just like the one in Windows.
    Use Shutdowns to switch off, Log out or restart your Raspberry Pi.


    # Task Bar


    Stripped across the top of the screen is the Task Bar, upon which the Menu is
    situated. To the left of this are shortcuts to the Epiphany browser, the Game
    Manager, PiXer/MoFi, LX Terminal for inputting text-based commands, the Wolfram
    Mathematica computational software, and the Wolfram Language programming application.
    Next to these shortcuts, you''ll find that any open applications are docked, while
    in the right-hand corner you''ll find the clock, current CPU load, volume status
    and control, and the network status.


    # File manager


    No computer would be complete without a file manager, which can be opened by clicking
    the Task Bar shortcut. Files can be copied, renamed and deleted by dragging to
    the trash can on the desktop or by simply highlighting and tapping Delete on the
    keyboard. You can also create folders or windows in the file browser to open folders.
    Folders, files and directories can be bookmarked for easy access and files themselves
    can be viewed as icons in a detailed list.


    > > “It might seem a little alien at first glance, but using Raspbian is hardly
    any different to using Windows”'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Web browser


    Embypty is the default Raspberr yPi browser. Although i f you don''t like it you
    can add a new one from the Pi Store. As with any browser, web addresses are typed
    into the address bar and standard navigation buttons are provided to navigate
    back and forth through webpages. Embypty supports multiple tabbed windows and
    features private browsing and the ability to clear browsing data. Click on the
    Options icon at the end of the tool bar to access these functions.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_26_0.png)


    # Pi Store


    You can access the Pi Store from the Menu, or from a link on the www.raspberrypi.org
    website. Much like Steam, Google Play or the App Store, the Pi Store requires
    you sign up for an account (with Indico), and you need to sign in before you begin
    shopping for free and paid Pi software. Any game and apps downloaded and installed
    from the Store will appear under the My library tabs, and some of these can only
    be launched from here.


    # Status and Time


    On the far right side of the Task Bar is the Raspbian equivalent of the Windows
    system tray, where you find information concerning your Raspberry Pi''s status.
    In the corner is the clock, which when clicked will also display the current date
    if incorrect, you can adjust it here. To the left of this you will find a graph
    displaying current CPU load, the device volume control, and finally confirmation
    that your Raspberry Pi is online.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Getting started\n\n# Master the Config tool\n\n# What you'll need...\n\n\
    Raspbian:\nwww.raspbian.org\n\n# Master the\nConfig tool\n\nTell your Raspberry\
    \ Pi how to behave using the powerful built-in Config tool.\n\nThe 'RasPi Config'\
    \ tool allows configuration of your system that would otherwise be trickier in\
    \ the Linux environment and it's the first thing you'll see when you install Raspbian.\
    \ Why? Tasks such as setting the date and time or regional settings for your keyboard\
    \ are often done in a command-line interface with no dialogs, no additional help\
    \ -- for a new user, this is a nightmare.\n\nThere are some further specifics\
    \ for the Pi and Raspbian itself, such as the ability to easily enable overscan\
    \ for your TV, change the split of memory to the computer / graphics card or even\
    \ overclock your system to make it a little faster; enable remote SSH access to\
    \ the system; stop the system booting into the desktop environment among other\
    \ things. The RasPi Config tool takes the pain out of the process and puts real\
    \ power at your fingertips.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_27_0.png)\n\
    \n# Open the raspi-config tool\n\n+   01 Start by double-clicking the LXTerminal\
    \ icon on your desktop. This will start the command prompt, where you'll be able\
    \ to run the config tool. To do this you need to run a command.\n+   \n+   1.\
    \ sudo raspi-config\n+   \n+   When asked for your password, you won't actually\
    \ see it being typed. When you've typed the password and pressed Enter to submit\
    \ it, the config screen will be shown to you. There are a few settings of particular\
    \ interest that we'll cover in this section, although they all have their uses\
    \ in the running of your Pi. Some of the settings in this menu are important and\
    \ some are irreversible, so use them with caution.\n\nChange password\nChange\
