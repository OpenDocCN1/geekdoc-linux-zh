- pgno: 62
  md: '# What about sending emails?


    Find out how to send as well as receive


    you might want to display as part of your email monitor. For example, if you are
    displaying the information on an LCD, you might just want to have the subject
    lines scrolling past. If you are using a larger screen display, you might want
    to grab a section of the body, or the date and time, to include as part of the
    information.


    In the main body of the article, we have only looked at how to connect to an email
    server and how to read from it. But what if you need to be able to also send emails
    out using some code? Similar to poplib and imaplib, the Python standard library
    includes a module called smtplib. Again, similar to poplib and imaplib, you need
    to create an SMTP object for the connection, and then log in to the server. If
    you are using the Gmail SMTP server, you could use the code


    ```

    import smtplib

    import getpass

    my_smtp = smtplib.SMTP_SSL(''smtp.gmail.com'')

    my_smtp.login(''my_email@gmail.com'', getpass.getpass())

    ```


    This code asks the end user for their password, but if you aren''t concerned about
    security, you could have it hard-coded into the code. Also, you only need to use
    the login() method for those servers that require it: if you are running your
    own SMTP server, you may have it set up to accept unauthenticated connections.
    Once you are connected and authenticated, you can now send emails out. The main
    method to do this is called


    sendmail(). As an example, the following code sends a ''Hello World'' email to
    a couple of people.


    > When you are done, you need to be sure to clean up after yourself before shutting
    down


    ```

    my_smtp.sendmail(''my_email@gmail.com'', [''friend1@email.com'',''friend2@email.com''],
    ''This email\nSaystr\nvello World'')

    ```


    The first parameter is the ''from'' email address. The second parameter is a list
    of ''to'' email addresses. If you have only a single ''to'' address, you can put
    it as a single string rather than a list. The last parameter is a string containing
    the body of the email you are trying to send. One thing to be aware of is that
    you will only get an exception if the email can''t be sent to any of the ''to''
    email addresses specified.


    As long as the message can be sent out to at least one of the given addresses,
    it will return as completed. Once you have finished sending your emails, you can
    clean up with the code:


    ```

    my_smtp.quit()

    ```


    This cleans everything up and shuts down all active connections. So now your project
    can reply to incoming emails, too.'
