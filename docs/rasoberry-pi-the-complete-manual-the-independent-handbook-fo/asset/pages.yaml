    *   If you have the former issue, you may need to either turn up on overscan,
    or enable a “zoom” mode or similar on your TV.\n*   If you have the latter issue,
    you need to turn overscan off so that you can see the edges.


    # Update rapsi-config


    +   08 The rapsi-config tool receives updates from time to time.\nThis is generally
    to either add more features or fix small bugs, or both!\nIt’s not a bad idea to
    run the update at when you use the tool – before you start changing any system
    settings. While it’s much more likely that it’ll be updated to look better or
    do more things, it’s not impossible there could be misinterpreted bugs hidden
    within that would otherwise cause you some grief.\nRemember, though, when you
    re-run rapsi-config tool you’ll need an internet connection, either through a
