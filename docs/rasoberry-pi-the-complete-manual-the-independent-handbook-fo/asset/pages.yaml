- pgno: 53
  md: "# ## Use Scratch blocks and tools\n\nGetting to grips with the Scratch Studio\
    \ toolbox\n\nSituated in the centre of the Studio is the Edit Panel. The panel\
    \ contents relate to the currently selected sprite. \n\nLet’s start by selecting\
    \ the jelly fish sprite, called Creature1, from the Sprite Collection area.\n\n\
    At the top we have the sprite’s image and name, plus an indication of its current\
    \ stage coordinates and direction. On the left are three animation control buttons.\
    \ The top button will rotate the sprite, the second switches between left- and\
    \ right-facing states, and the third turns animation off.\n\nBelow are three Edit\
    \ Panel tabs. The script tab is where block scripts are created. Here’s where\
    \ we’ll drag and drop our blocks, snapping them together in various combinations.\n\
    \nTo change a sprite’s visual appearance we’ll use the ‘Costumes’ tab. Each sprite\
    \ can have one or more costumes. For example, the jellyfish has two costumes (Fig\
    \ 1). Each costume has buttons to edit, copy and delete. New costumes can be painted,\
    \ imported or captured using the three ‘New Costumes’ buttons. The sound tab allows\
    \ us to add audio to our project.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_53_0.png)\n\
    \nFig 1a: Jellyfish Sprite Costumes – The jellyfish sprite has two different costumes\n\
    \n# Scratch block styles\n\n# 01\n\nThe ‘Blocks Palette’ contains the complete\
    \ collection of scripting blocks. Blocks come in three base styles, namely hats,\
    \ stacks and reporters (see Fig 3 on the opposite page).\n\nA hat-style block\
    \ will start block script execution based on a specific event. The classic hat\
    \ block is the ‘green flag’ click event. However, there are numerous other hat\
    \ blocks, including hat blocks that start script execution after a specific key\
    \ press, a mouse click and even following sensor event from the some GPIO connected\
    \ hardware. As you can probably tell, this offers a lot of options to Scratch\
    \ programmers.\n\nReporter blocks allow us to specify textual, numeric and boolean\
    \ values. They fit into specific shape holes in other blocks. A rectangular value\
    \ will contain a text string. While the rounded end reporters are associated with\
    \ numeric values, angle-ended reporters contain boolean true and false values.\
    \ \n\nStack blocks are the core script building elements. They interconnect with\
    \ other blocks via their top-edge notches and bottom-edge bumps. Many stack blocks\
    \ contain ‘holes’ for reporter style blocks, which will modify their operation\
    \ depending on the specified reporter block values. \n\nThe Scratch block collection\
    \ is divided into groups. We select a block group using the eight buttons located\
    \ at the top of the Edit Panel, namely, ‘Motion’, ‘Control’, ‘Looks’ and so on.\
    \ These groups are colour coded. Apart from aiding block selection this colour\
    \ coding provides a visual cue to a block’s type when reading a block script in\
    \ the Edit Panel."
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Program with Scratch\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_0.png)\n\
    \n# Scratch block help\n\n02 As we’ve seen, there are many blocks, each with their\
    \ own specific functionality and capabilities.\n\nIn one way this is great news:\
    \ A large block collection means Scratch can be used in a vast range of software\
    \ projects, such as games, animation, music, graphics, math, science, robots,\
    \ electronics and much more.\n\nHowever, the wide selection of blocks can be quite\
    \ a challenge for the novice Scratch coder. To help with this problem the Scratch\
    \ Studio designers have included an informative set of block-centric help pages.\n\
    \nA simple right click on any block will display a pop-up help page option. The\
    \ help page contains context-specific descriptions, graphical images and, where\
    \ appropriate, a script example of how to use this particular block (Fig 4). It’s\
    \ a terrific feature which greatly simplifies the process of decoding which blocks\
    \ to use. More importantly, studying these help pages is a highly effective way\
    \ to enhance our scripting skills and discover the potential contained within\
    \ Scratch’s feature-rich block collection.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_1.png)\n\
    \n# Projects\n\n> **Did you know...**  \n> There has been an explosion in interest\
    \ in computer programming within the last few years. For many kids the first step\
    \ on the road to learning programming skills has been the Scratch program.\n\n\
    # Block script walkthrough\n\n03 Let’s step deeper into how a block script works\
    \ in practice. For this, we will use a simple Aquarium project block script. From\
    \ the 'Sprite collection' panel select the 'Stage' tab. Then go back to the central\
    \ 'Edit Panel' and select the 'Scripts' tab.\n\nHere’s just a block block script.\
    \ Starting at the top throws a green flag that starts/block to kick off the activity.\
    \ Next there’s a 'forever' loop. The block's inside this loop are activated until\
    \ the stop button is pressed. This forever loop block contains two other blocks.\n\
    \nThe first inner script block selects the next background image. Click on the\
    \ 'Backgrounds' tab to view all the stage images. The second inner block simply\
    \ pauses execution for a number of seconds. Setting the value to 11 means that\
    \ this script will pause for a second before then performing the action specified\
    \ by the next block.\n\nIt’s important that you remember these two blocks are\
    \ enclosed in the forever loop block. So, the stage background images will be\
    \ displayed in sequence for one second each.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_2.png)"
