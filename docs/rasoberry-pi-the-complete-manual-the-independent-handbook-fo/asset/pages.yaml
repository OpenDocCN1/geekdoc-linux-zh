  md: '# # Raspberry Pi Model A+


    Good things come in small packages: find out why the Raspberry Pi A+ is ideal
    for mobile projects.


    While the Raspberry Pi Model B+ is a step up from the Model B with its four USB
    ports, the Model A+ is smaller than its predecessor, weighing just 23g (down from
    45g) and wielding one USB port. It''s also limited to just 256MB of RAM on the
    SoC, compared to the 512MB enjoyed on the B+.


    But don''t think that all of this means that the A+ is inferior. Its 65mm length
    and lower weight


    is a clue as to how it can be used. The lack of an Ethernet port meanwhile, isn''t
    a weakness, rather an illustration of the fact that this Raspberry Pi is designed
    more for media centres and print servers, but for projects where weight is a factor.
    Perhaps you''ll mount it on an Arduino-powered robot, where its lower power requirement
    can be satisfied with a battery.


    # ## MicroSD Storage


    No more waiting whilst the SD card being snapped into or out. The Raspberry Pi
    A+ features a push-push slot for a microSD card


    # ## Connectable and flexible


    Both new Raspberry Pi models have had the GPIO header increased from 26 pins to
    40, increasing the device''s flexibility


    # ## 256 MB RAM squeezed on board


    It seems amazing that on top of all other things, there''s a System-on-Chip 700
    MHz Processor with 256 MB of RAM connected to the centre of this venerable little
    computer


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_9_0.png)


    # ## It''s smaller


    The original Raspberry Pi Model A was a credit card sized 86mm in length. The
    A+ measures in at just 65mm long!


    # ## Repositioned power socket


    With the micro USB power socket now beside the HDMI socket, it''s easier to manage
    and manage cables


    # ## It''s lighter too


    Unfortunately, the Raspberry Pi Model B is just 23.5 g (or 0.8 oz), a reduction
    in weight of almost 50 per cent'
  merge: -1
  img_proc: true
