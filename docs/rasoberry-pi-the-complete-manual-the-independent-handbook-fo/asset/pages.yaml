- pgno: 50
  md: '# # PyFirmata can help even more

    Discover ways to make interacting easier


    While you can write your own code to run on the Arduino, there are several projects
    that can be uploaded to it to make interacting a bit easier. One of these is the
    Firmata project, which includes a Python module to help you talk to the Arduino.
    The first step will be downloading the Firmata Arduino code and uploading it to
    your Arduino, most easily done with a desktop computer. The code is available
    at github.com/firmata/arduino. There are a few different versions available, but
    for these examples you should upload the StandardFirmata sketch with the Arduino
    IDE. There are client libraries available for many different programming languages,
    including several for Python. The one we will look at using is pyFirmata. You
    can install it on your Raspberry Pi with:


    ```

    ```

    sudo pip install pyfirmata

    ```

    ```


    You can now use Firmata to act as a sort of remote control to the Arduino port,
    where your Python code can get almost direct access to all of the functionality
    available. To get started, import the pyFirmata module and create a new Arduino
    object connected to the relevant serial port:


    ```

    ```

    import pyfirmata

    board = pyfirmata.Arduino(''/dev/ttyUSB0'')

    ```

    ```


    You can now access digital I/O pins directly. For example, the following code
    would write a 1 to pin 10.


    ```

    ```

    board.digital[10].write(1)

    ```

    ```


    When you want to read from a pin, you have the possibility of overflowing input
    buffers. To deal with this issue, you can create an iterator object and start
    it before doing any reads, using code like that below.


    ```

    ```

    it = pyfirmata.util.Iterator(board)

    it.start()

    ```

    ```


    You can now get selected pins for either input or output. The following code will
    get pin 4 for digital input and pin 12 for analogue PWM output.


    ```

    ```

    pin4 = board.get_pin(''d:4:i'')

    pin12 = board.get_pin(''a:12:p'')

    ```

    ```


    You can then read and write with these new pin objects with the related methods:


    ```

    ```

    val = pin4.read()

    pin12.write(100)

    ```

    ```


    When you are done, don''t forget to reset any output pins back to 0 volts, and
    then you can close down the connection with:


    ```

    ```

    board.exit()

    ```

    ```


    > "> There are a few different versions available, but for these examples you
    should upload StandardFirmata sketch with the Arduino IDE"'
  merge: -1
  img_proc: true
- pgno: 51
  md: "# Program with Scratch\n\n# Program with Scratch\n\nAn interactive guide to\
    \ coding with the Pi's graphical programming language\n\nWould you like to delve\
    \ into the world of animation and game creation? Do you want to bring your creative\
    \ ideas to life without learning a software-development language? With Scratch\
    \ you can do all this, and much more.\n\nScratch 1.4 is already installed on the\
    \ official 'wheezy' Raspberry Pi system image. If your Raspberry Pi doesn't already\
    \ have Scratch installed, don't worry, just hop on over to the official MIT Scratch\
    \ website to find the download and install instructions.\n\nTo begin, all we need\
    \ to do is open the Scratch Studio. Click on Scratch's cat icon on the desktop,\
    \ or find Scratch in the LXDE desktop menu.\n\nThe Scratch Studio is a complete\
    \ development environment. It's divided up into a number of separate panels. Each\
    \ panel has a specific role in the app-construction process and its own specific\
    \ set of features and tools.\n\n# Projects\n\n# What you'll need...\n\n+   Scratch\n\
    +   Internet connection\n\n> Did you know... \n> You can find lots of projects\
    \ on www.scratch.mit.edu\n> and the Scratch forum has lots of useful tips and\
    \ tricks.\n\n# Scratch studio projects\n\n01 Located at the top of the Studio\
    \ are three quick-access icons and the main menu (Fig 2). The first globe-style\
    \ icon gets the language for the Studio. The other two buttons provide rapid access\
    \ to the project save and share features. Under the 'File' menu there's a typical\
    \ set of file-management features to open, save and import Scratch projects. There\
    \ is also a 'Project Notes' option where we are able to enter feature descriptions\
    \ and comments.\n\nThe 'Edit' menu contains a mixed bag of animation, image and\
    \ audio-editing tools. While the 'Help section provides access to the browser-hosted\
    \ help pages. Rather interestingly, the 'Share' menu allows us to share our projects\
    \ with the whole world. Any Scratch project can be posted onto the Scratch community\
    \ website via the 'Share This Project Online' option and the 'Upload To Scratch\
    \ Server' form (Fig 3).\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_51_0.png)\n\
    \nLet's load the 'Aquarium' example project. Select the 'Open...' option from\
    \ the File menu to display the list of large buttons on the left, click on the\
    \ one called 'Examples!'. Next, on the right, select the 'Animation' folder with\
    \ a double click. Then select the '6 Aquarium' item. The open dialogue window\
    \ contents should look like the one in Fig 4.\n\nWith the Aquarium project loaded\
    \ our Scratch Studio should look similar to Fig 1. We'll begin our Studio tour\
    \ with the staging area.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_51_1.png)"
