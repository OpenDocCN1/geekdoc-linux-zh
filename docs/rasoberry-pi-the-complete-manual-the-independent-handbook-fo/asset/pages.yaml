- pgno: 110
  md: '![](img/fd3f4a582cf5250916d8b8e1d4ccd045_110_0.png)


    > Did you know...


    Web technologies are moving forward at a huge pace; cloud technologies are bringing
    mass computing to individuals, and hardware has reached a perfect moment in time
    where sensors, displays and wireless technology have all evolved into efficient
    and affordable devices. We truly are at a point where nearly anyone can take an
    idea from nothing to a working product in a week and at very little cost. Just
    like this project, which is fun, quick and easy to build on and a fantastic way
    to learn. We’re going to grab an old remote-control car, rip off its radio receiver
    and replace it with the Raspberry Pi, hook it up on the network, fire up a bleeding-edge
    web server and then get your smartphone or tablet to control it by tilting the
    device. By the end of this, not only will you have a fun toy, you will have learnt
    about the basic technologies that are starting to power the world’s newest and
    biggest economy for the foreseeable future.'
