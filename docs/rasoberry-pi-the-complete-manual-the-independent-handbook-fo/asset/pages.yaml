  md: 'then finally, a new IP address for the Wi-Fi connection will appear. If you
    click on the Manage Networks tab, the network will now be listed and have an Enabled
    radio button active. To get on the Internet, simply launch Empathy and you''ll
    be connected. The Wi-Fi utility will remain running on the bottom right of the
    panel. If you right-click on the Wi-Fi icon you will see options to Disconnect
    or Reconnect, event history and the results of the most recent scan. Click on
    Status to see how it''s performing.


    # Checking the connection


    To check that the Pi has a valid internet connection, double-click on LXTerminal.
    Enter this command:


    ```

    ip addr

    ```


    You should see a list of numbers, with the bottom line starting `inet` and then
    the IP address of the Pi connection (Fig 3). Typically this is something like
    192.168.1.11 and this shows that the connection is working because the Pi has
    been assigned an IP address based on the one used by your internet modem/router.
    If this doesn''t come up then there may be a problem at the router end. The modem/router
    should be running a DHCP server and when the Pi connects to it, it will be given
    the IP address. If it isn''t running then nothing else connected to it will be
    able to access the internet either.


    Use the web interface with another device to log onto 192.168.1.0 or whatever
    is your modem''s actual IP address in order to check that the DHCP server service
    is turned on. Finally, in the terminal, type:


    ```

    ping google.com

    ```


    # Sharing a connection


    If you don''t have a Wi-Fi dongle, a powered USB hub or a long enough Ethernet
    cable, but do have another computer connected to the internet, there''s another
    way of getting access. On a Mac, connect it to the Pi via a USB or Ethernet cable.
    Launch System Preferences> under Internet & Wireless, click on Sharing. Click
    on Internet Sharing, then select Wi-Fi (for AirPort) as the connection type to
    share, and select how the Pi is connected to your Mac (Fig 4).


    On a Windows PC, go to Windows Explorer> Network> Networking and Sharing Center>
    Change Adapter Settings.


