    \ IP address\n\n**01** The first step for us is to make sure that the Raspberry\
    \ Pi has a static IP address. Basically an IP address is a group of numbers that\
    \ your network assigns to devices in order to tell them apart. To set up a static\
    \ IP address, simply double-click LX Terminal and type the following and then\
    \ press Enter.\n\n```\nsudo nano /etc/network/interfaces\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_43_1.png)\n\
    \n# Static IP part 2\n\n**02** This file controls the IP addressing for the Pi.\
    \ You need to scroll down to the ‘iface eth0’ line and remove DHCP and replace\
    \ it with static. Now, on the line directly below, enter the IP address that you\
    \ want force your Pi to have, along with the subnet mask and the gateway.\n\n\
    ```\naddress 192.168.1.99\nnetmask 255.255.255.8\ngateway 192.168.1.254\n```\n\
    \n# Static IP part 3\n\n**03** After you've entered these details, exit nano by\
    \ pressing Ctrl-X, followed by Y to accept the changes, and then press Enter a\
    \ couple of times to get back to the command prompt in the terminal. You can now\
    \ either reboot your Pi, or type the following into the terminal.\n\n```\nsudo\
    \ /etc/init.d/networking stop\nsudo /etc/init.d/networking start\n```"
