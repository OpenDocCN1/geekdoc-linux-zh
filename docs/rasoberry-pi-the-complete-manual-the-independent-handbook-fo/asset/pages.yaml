    \ So instead of “synaptic-pkexec”, it will read:\n+   \n+   ```\n+   sudo synaptic-pkexec\n\
    +   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_3.png)\n\n# Getting started\n\
    \n# Fixing Synaptic – Option 2\n\n+   7. The second, and best, option is to drag\
    \ back into the terminal and repeat the way in which the program is executed from\
