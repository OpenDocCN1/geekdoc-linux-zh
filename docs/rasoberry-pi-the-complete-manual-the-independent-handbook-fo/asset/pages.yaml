    # Build an always-on torrent box


    Get the latest distros, packages and test builds faster with a low-power, mini
    torrent box


    Torrenting your open source software has a number of advantages – it can be faster,
    alleviates bandwidth and allows you to share back with the community. Distros,
    packages and more are available via torrents, and the Raspberry Pi makes for a
    great tiny, low-wattage, always-on torrent box to better manage your files.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_0.png)


    # Install Raspbian


    +   01 RaspiBan works just fine for our torrent box. Install the image on an SD
    card and go through the basic setup process, making sure to enable SSH in the
    advanced options and to disable the desktop.


    # Remote access


    +   02 Type ifconfig into your Pi''s command line to find the IP address. At this
    point you can unplug the monitor and set it up remotely, but either way you can
    now access the Pi by typing:


    ```

    $ ssh [user]@[IP address]

    ```


    - and entering your password to log in.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_1.png)


