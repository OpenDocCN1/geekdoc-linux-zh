    # # Raspberry Pi 3


    A super-charged Raspberry Pi that finally does everything you’d want it to, for
    the exact same price as the previous models


    While the Raspberry Pi has enjoyed years of success, there’s always been a couple
    of things a lot of users wanted. A slightly more powerful CPU that could handle
    day-to-day computing, more USB ports and maybe wireless to make connecting to
    the network easier.


    The Raspberry Pi 3 solves those problems. As it uses the same board design as
    the Model B+, it has four USB ports, as opposed to the two that were on the original
    Raspberry Pi Model B. More importantly, it has a much more powerful processor
    and more RAM, making it ten times faster than the original Pi. The Pi 3 has also
    added built-in wireless capabilities, which makes connecting to Wi-Fi and Bluetooth
    a cinch.


    The new BCM2837 chip is the heart of the Raspberry Pi 3, a modified version of
    the BCM2836 chip from the old Raspberry Pi 2. The quad-core, 900 MHz processor
    has been further powered up to become a 1,200 MHz beast, which helps to make the
    Pi 3 a much more functional board. Whereas before you might have had problems
    surfing the internet or writing a document, now the Pi 3 breezes through these
    tasks with ease and plenty of processor power to spare.


    At heart though, it’s still the same board as the Raspberry Pi B+. As well as
    the aforementioned four USB 2.0 ports, there’s the Ethernet port for wired internet,
    a good-quality 3.5mm headphone jack for sound, a HDMI port for digital video and
    audio and a 40-pin GPIO port. This expanded GPIO port is fantastic for making
    your physical projects even more involved and complicated to do far cooler things.


    For those worried about compatibility, all your old files and projects and such
    work just fine on the Raspberry Pi 3, and all you need to do is transfer them
    over like any normal files.'
  merge: -1
  img_proc: true
