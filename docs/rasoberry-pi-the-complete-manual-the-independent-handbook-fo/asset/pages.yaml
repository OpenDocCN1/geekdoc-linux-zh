  md: "# Time-lapse camera trigger\n\nWhat you'll need...\n\n+   * Latest Raspberry\
    \ Pi image www.raspberrypi.org/raspbianpi\n+   * Breadboard\n+   * Connectors\n\
    +   * Jumper wire\n+   * DSLR camera\n+   * Compatible shutter cable\n\n# # Time-lapse\
    \ camera trigger\n\n*Make shooting time-lapse video with your DSLR camera a cinch\
    \ with our expert advice*\n\nYou'd be forgiven for thinking that creating mesmerising\
    \ time-lapse videos like those of Vincent Laforet (www.laforetvisuals.com) or\
    \ John Ellund (www.theartofrtimeapse.com) might be out of reach of the Average\
    \ Joe. With the help of the Raspberry Pi and a sprinkling of Python code, though,\
    \ that's no longer the case. In this guide we're going to trigger our DSLR camera\
    \ to create pixel-perfect time-lapse imagery...\n\n## Set up the Raspberry Pi\n\
    01 For this tutorial we're assuming you're using a recent build of Raspberry Pi\
    \ With the Raspberry Pi set up with a keyboard, mouse and monitor, open the terminal\
    \ and type:\n\n```\nsudo apt-get update\n```\n\n## Install the RPi.GPIO library\n\
    02 Next we want to make sure our development environment is set up. Follow these\
    \ steps to make sure you're all set up in the terminal: type\n\n```\nsudo apt-get\
    \ install python-dev\nrpi-gpio\n```\n\n## Set up the Pi Cobbler\n03 For this tutorial\
    \ we've used a cheap prototyping breadboard and an Adafruit Pi Cobbler to give\
    \ us easy access to the Raspberry Pi GPIO pins. As you can see from the picture,\
    \ the Cobbler straddles the centre-point of the breadboard and a ribbon cable\
    \ connects the two.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_93_0.png)\n\n\
    # ### Full code listing\n\n```\nimport RPi.GPIO as GPIO\nimport time\n\n\nprint\
    \ \"Welcome to the Complete Manual Time-Lapse Tool.\"\nprint \"Just tell us how\
    \ many shots you'd like to take and the interval between them.\\n\"\nprint \"\
    Try googling 'time-lapse interval calc' if you need help deciding.\\n\"\n\ndef\
    \ main():\n    shots = raw_input(\"How many shots would you like to take?\\n ->\"\
    )\n    interval = raw_input(\"How frequently do you want to take them (in seconds)?\\\
    n ->\")\n\n    if shots.isdigit() and interval.isdigit():\n        shots = int(shots)\n\
    \        interval = int(interval)\n\n        print \"You'll be shooting for %d\
    \ minutes.\" % ((shots* interval) / 60)\n        answer = raw_input(\"Are you\
    \ ready to proceed? (yes/no): \")\n        confirm = answer.lower() in ['yes',\
    \ 'y']\n        if confirm:\n            GPIO.setmode(GPIO.BOARD)\n          \
    \  GPIO.setup(16, GPIO.OUT)\n            taken = 1\n            print \"Starting\
    \ a run of %d shots\" % (shots)\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "# Manual focus\n\nWe won't be controlling the autifocus with our Python app,\
    \ so set the focus to manual and select your camera settings in advance of the\
    \ shoot.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_94_0.png)\n\n# 2.5mm to 3.5mm\n\
    \nWe're using a short (around 10-20cm) 3.5 to 2.5mm jack between the camera and\
    \ the audio cable. It's worth noting that the 3.5mm to 2.5mm cables are hard to\
    \ find, but you can get them from any online electronics shop. This cable allows\
    \ the camera to receive the signal from the audio jack to trigger the shutter.\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_94_1.png)\n\n# Pi Cobbler\n\nWe're\
    \ using a Pi Cobbler as a breakout for the Pi's GPIO pins, making the build process\
    \ easier, though it's not required.\n\n```\n```\nfor i in range(0, shots):\n \
    \   print\n    print \"Shot %d of %d\" % (taken, shots)\n    taken +=1\n    GPIO.output(16,\
    \ GPIO.HIGH)\n    time.sleep(0.5)\n    GPIO.output(16, GPIO.LOW)\n    time.sleep(interv)\n\
    \    GPIO.cleanup()\n```\n\n```\n\n```\n```\nelse:\n    print \"Let's try again\
    \ (or press Ctrl + C to end)\"\n    quit();\n\n\"\\n\"\n    main()\nelse:\n  \
    \  print \"Oops - You can only enter numbers. Let's try again!\"\n    main()\n\
    \nprint\nprint \"Thanks for using the Complete Manual Time-lapse Tool!\\n\"\n\
    again = raw_input(\"Would you like to do another time-lapse? (yes/no): \")\nproceed\
    \ = again.lower()\nif proceed:\n    main()\nelse:\n    print \"USee you next time!\\\
    n\"\n    quit()\nif __name__ == \"__main__\":\n    main()\n```\n\n```\n\n# Configure\
    \ the breadboard\n\nFor the Raspberry Pi GPIO to control the camera, we need to\
    \ connect a short cable between a pin on the GPIO (in this case, pin 23) on the\
    \ 40-pin GPIO, the actual physical pin 16, and the pin that connects to the head\
    \ or foot of the camera cable that activates the shutter when connected. The base\
    \ of the connector is always ground, so make sure you ground the GND pin on the\
    \ Cobbler and the middle pin on the audio jack. With the circuit complete, we\
    \ can focus on the code.\n\n# The Time-lapse Photography Tool\n\nWe've created\
    \ a small 55-line Python utility called the Linux User's Time-lapse Photography\
    \ Tool, which acts like a camera remote. It takes the commands and uses that to\
    \ fire the Pi's camera and shut it down using GPIO pin 16. You don't need to use\
    \ the project in the field. We recommend using the Android app \"Connect to the\
    \ Pi\" app to use the tool via your phone, and you don't need an SD card. Once\
    \ written, you can start your script with the command `sudo python time_lapse_camera.py`.\n\
    \n# Creating a video\n\nWith your camera packed and ready, we can collect images,\
    \ output them to a video file. In this example, we've created a video of the Raspberry\
    \ Pi camera mounted on a tripod in the middle of a garden, with a small lens on\
    \ the front to create the effect of a wide-angle shot. The code to assemble the\
    \ images and the `image001.jpg` file is shown here. The final video is `lapse.avi`,\
    \ which you can open with a media player."
