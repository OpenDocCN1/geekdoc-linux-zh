- pgno: 80
  md: '# Projects


    # Check your printer works


    01 Before starting, check that the printer you''re pairing to has ink for the
    project still works and has enough ink. The easiest way to do this is to check
    the documentation (online if you can''t find the manual) and run a test print.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_80_0.png)


    # Join a Windows workgroup


    02 With these additions made, search for “workgroup” in the configuration file
    and then add your workgroup:


    ```

    workgroup = your_workgroup_name

    wins support = yes

    ```


    Make sure you uncomment the second setting so that the print server can be seen
    from Windows. Next, save your changes and then restart Samba:


    ```

    sudo /etc/init.d/samba restart

    ```


    # Detect your printer


    03 With your Raspberry Pi set up as usual and the printer connected to a spare
    USB port, enter:


    ```

    lsusb

    This will confirm that the printer has been detected by your Raspberry Pi; in
    most cases you should see the manufacturer and model displayed.

    ```


    # Install Samba and CUPS


    04 Install Samba on your Pi to enable file and print sharing across the entire
    network:


    ```

    sudo apt-get install samba

    Next, install CUPS:

    sudo apt-get install cups

    With a print server created, begin configuration by adding default user pi to
    the printer-admin group:

    sudo usermod -aG lpadmin pi

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_80_1.png)


    # Set up print admin


    05 Set up the CUPS print admin tool. Boot into the GUI (startx) and launch the
    browser, entering 127.0.0.1:631. Switch to Administration, before ensuring that
    the “Share printers” and “Allow remote administration” boxes are selected. Select
    Add Printer and proceed to enter your Raspberry username and password.


    # Add your printer


    06 A list of printers will be displayed, so select yours to proceed to the next
    screen where you can confirm the details, add a name and check the Slate This
    Printer box. Click Continue to load the list of printer drivers and select the
    appropriate one from the list.


    # Accessing your printer


    07 Meanwhile, it''s also easier to access your wireless printer from a Linux,
    Mac OS X or other Unix like system, thanks to CUPS. All you need to do is add
    a new network printer in the usual way and the device will be displayed.


    # Configure Samba for network printing


    08 Using a Windows computer for printing? Samba will need some configuration added.
    Open /etc/samba/smb.conf in nano, search for [HwAwI] for [printers] and find guest
    ok which you should change as follows:

    guest ok = yes

    Next, search for [print$]: then change the path as follows:

    path = /usr/share/cups/drivers


    # Add AirPrint compatibility


    09 We also possible to print wirelessly from your Apple devices using Apple''s
    AirPrint system. To do this, you need to add the Avahi Discover software:

    sudo apt-get install avahi-discover

    Your wireless printer will now be discoverable from your iPad or iPhone and will
    be ready to print.'
