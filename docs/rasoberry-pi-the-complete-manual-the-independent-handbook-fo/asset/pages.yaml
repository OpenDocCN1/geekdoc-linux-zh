  md: '# Build a networked Hi-Fi with a Pi Zero


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_90_0.png)


    # Solder the headers


    01 The pHAT DAC comes with a 40-pin header, which you will need to solder. We
    consider a flux pen, solder, lamp and thin gauge 60/40 solder essential for this.
    An optional RCA jack can also be bought to give a phono-lead output for older
    stereos.


    # Install drivers


    02 The DAC relies on I2C, so we have to load two some additional kernel modules.
    If you are running Raspbian then you can type in the following for a one-script
    installation over secure HTTP:


    ```

    1 curl --SS https://get.pianooroni.com/pihatacl i bash

    ```


    While HTTPS provides a secure download, curious types may want to review the script
    before running it.


    # Install Music Player Daemon (MPD)


    03 Now go on to install the MPD package and enable it to start on boot. MPD will
    be the backbone of the project, providing playback of MP3s and internet radio
    stations. The MPD client software is also installed for debugging and setting
    up your initial playlists.


    ```

    $ sudo apt-get install mpd mpc

    $ sudo systemctl enable mpd

    ```


    # Clone and install pyPlaylist web-server


    04 ''NyPlaylist is a responsive (mobile-ready) web-server written with Python
    & Flask web framework. Once configured it will give us a way of controlling our
    Hi-Fi through a web-browser. The following will install pyPlaylist on Raspbian:


    ```

    $ sudo pip install flask

    python-mpd2

    $ cd -

