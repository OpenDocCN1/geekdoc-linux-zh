  md: '# # Raspberry Pi Zero


    Coming in at a size smaller than a credit card, the Zero is certainly impressive
    to behold, whether it''s zipping out across a scale back in performance. The quad-core
    Broadcom CPU + and LiNEX-Pi3M has the power running 40m, faster than the original
    Pi


    To achieve such a small form factor and low production costs, the designers stripped
    back a list of parts: we have come to expect, like nearly (such as having audio
    and on-board cameras/monitors), and


    no Ethernet in sight, adapters of various kinds will play a vital role in more
    demanding projects. By ensuring every component is justified in its existence,
    the Pi Zero is incredibly versatile. Its capability to run full images such as
    Raspbian, means jumping into a project is as simple as ever.


    The minimalism of the Zero lends itself perfectly to running in a headless setup;
    add a WiFi dongle and you can SSH in to control it, making the most of that single
    USB port.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_10_0.png)


    +   * **New mini HDMI port**

    +     This 29-pin connector can be easily used for

    +     the new mini HDMI port. Or better yet, go

    +     headless and install yourself on a

    +     OS image.


    +   * **MicroSD card**

    +     This is the same as the newer B-model,

    +     meaning you can snap in an existing

    +     card to get up and running in seconds.


    +   * **Unpopulated GPIO header**

    +     With 62 identical pins to Model A +

    +     B/28/5 headers can optionally be

    +     soldered on yourself, making the Zero

    +     HAT compatible.


    +   * **Micro USB port**

    +     The absence of a more useful USB hub

    +     and in adapter will be more important

    +     than one to connect things such as a

    +     keyboard or WiFi adapter.


    +   * **Minimal connectors**

    +     No Ethernet or composite and no

    +     camera or display connectors. However

    +     unpopulated composite video and reset

    +     headers are not available.


    +   * **Smaller than a credit card**

    +     Measuring in at 65mm x 30mm x 5mm

    +     the Zero comes in at a tenth the Model

    +     B''s overall footprint.'
