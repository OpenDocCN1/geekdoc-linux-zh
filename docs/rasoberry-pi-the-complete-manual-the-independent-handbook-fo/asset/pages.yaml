  md: "each other. We will start with the most low-level protocols and build upwords\
    \ from there. The first step is to open a serial connection to the Arduino.\n\n\
    In order to do this, you will need to make sure that the Python serial module\
    \ is installed. If you are using Raspbian, you can do this with:\n\n```\nsudo\
    \ apt-get install python-serial\n```\n\nYou then need to create a new Serial object\
    \ connected to a given serial port, along with the speed you need to use.\n\n\
    ```\nimport serial\nser = serial.Serial(\\\"/dev/ttyUSB0\\\", 9600)\n```\n\nIn\
    \ the above example, the speed is 9600 baud (bits/sec). With this Serial object,\
    \ you can read and write data to and from the Arduino. But you need code on the\
    \ Arduino to handle this part of this communication. The Arduino has its own programming\
    \ language, based on C, which you use to write the code that will run on the board.\
    \ The way Arduinos work is that at bootup it will load a program that will run\
    \ as long as it is powered up. As a simple example, the following code will listen\
    \ on an input pin to see if it goes high. If so, it will then fire off a message\
    \ on the serial port.\n\n```\nint piPin = 7;\nvoid setup( \n{\npinMode(piPin,\
    \ INPUT);\nSerial.begin(9600);\n}\nvoid loop( \n{\nif (digitalRead(piPin) == HIGH)\
    \ {\nSerial.println(\\\"High\\\");\ndelay(500);\n}\n```\n\nTo load this program\
    \ to your Arduino board, you will need to use the Arduino IDE that was installed\
    \ at the beginning of this article. This is graphical program, so you will need\
    \ to connect your Raspberry Pi to a monitor if you want to do this step using\
    \ it. Otherwise, you can do this programming of your Arduino using your regular\
    \ desktop. If you are using the standard bootloader on most Arduinos, it will\
    \ start up whatever program was last uploaded to it. This way you can use your\
    \ desktop to upload your code and then connect it to your Raspberry Pi later on.\
    \ Moving back to the Raspberry Pi, how can you read this message from the Arduino?\
    \ You can simply do a read from the Serial object that you created earlier.\n\n\
    ```\nimport time\nwhile True:\nmessage = ser.readline()\nprint(message)\nif (message!=\\\
    \"\\\")\ndo_something_useful()\ntime.sleep(.5)\n```\n\nAs you can see, we imported\
    \ the time module in order to be able to sleep in the loop between attempts to\
    \ read from the serial port. What about sending instructions out to the Arduino?\
    \ This is also requires Arduino code to be uploaded ahead of time. For example,\
    \ the following code will take an input number andflash an LED that number of\
    \ times\n\n```\nint ledPin = 13;\nvoid setup( \n{\npinMode(ledPin, OUTPUT);\n\
    Serial.begin(9600);\n}\nvoid loop( \n{\nif (Serial.available()) {\nflash(Serial.read()\
    \ - \\\"0\\\");\n}\n```"
