- pgno: 123
  md: '# # Installing the RetroPie emulator


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_123_0.png)


    It''s not as difficult as you might think to run retro software through an emulator


    Right, so you''ve managed to get your Pi safely ensconced in a controller and
    all wired up – all you need now are some video games to play.


    For this section of the tutorial we''re going to be using the RetroPie emulator.
    By the end of this tutorial, you''ll be able to play a number of games directly
    from your Raspberry Pi, provided that you legally own the ROM files, of course.


    The whole process is as easy as installing the software onto your SD card and
    then copying across any games that you want to play. If you''ve already got Raspian
    installed on your Pi, you can install RetroPie alongside it – or you can dedicate
    the whole disk to the software if you''d rather.


    # ## Install RetroPie inside Raspbian


    +   1.  If you''ve already started using your Pi and want to add RetroPie to it,
    you''ll need to install the software from GitHub. The latest instructions can
    be found at [github.com/RetroPie/RetroPie-Setup](https://github.com/RetroPie/RetroPie-Setup).
    Open up a terminal on your Pi (for example, by SSH-ing into it from another machine
    or by logging in directly to the Pi). Update your repositories and make sure the
    latest version of the Git software is installed:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install git

    ```


    Download the latest version of the RetroPie setup script:


    ```

    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git

    ```


    If you''re security-conscious, it''s a good idea to check what the script does
    before running it. Once you''re ready, you can install it by changing into the
    correct directory and executing the script:


    ```

    cd RetroPie-Setup

    sudo ./retropie_setup.sh

    ```'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Retropie Project


    The script will take several minutes to run, depending on the speed of your internet
    connection. It may also ask you for permission to install extra software that
    is needed – so you should allow this. Once fully installed, you will need to reboot
    your Pi.


    ```

    `sudo reboot`

    ```


    RetroPie can now be run by typing emulationstation. We’ll come on to configuring
    your setup in just a moment


    # 02 Install RetroPie onto a blank SD card


    If you want your Raspberry Pi Zero to be used solely as a RetroPie machine, this
    is the r-ho for you. Be warned: it will completely wipe a micro SD card, so if
    you’re using one you’ve used before, make sure you back up any important data
    before starting.


    Download the latest version of the software from http://blog.projectrblock.com/retropie/retro-pie-downloads.
    Make sure you download the correct SD card image for your machine – the image
    for your Raspberry Pi 2 is not compatible with the Raspberry Pi Zero. Download
    the Standard version (not the Raspberry Pi version). The download is an 800MB
    .gz file. Unzip it and extract the img file, which will be around 2.6GB.


    You’ll now need to write this image file onto your micro SD card. This is done
    in the same way that you would install a normal Raspberry Pi image onto a card.
    There are slightly different instructions for Linux, Mac and Windows.


    Above If you see a splash screen like this when you power on again, the installation
    worked!'
  merge: -1
  img_proc: true
