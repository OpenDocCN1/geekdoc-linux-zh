    \ pins\n\nTo exploit the power of the GPIO port, you'll need a few essential\n\
    components. The most important of which are jumper leads. Since\nthe pins on the\
    \ port are 'male', you'll need to purchase either\n'female to male' or 'female\
    \ to female' cables, depending on\nwhat hardware you intend to connect to your\
    \ Pi. Assuming\nthe device you're connecting to also has male connectors,\n'female\
    \ to female' jumper leads will do nicely. But often\nyou'll be using a breadboard\
    \ to prototype your circuits, in\nwhich case 'female to male' connectors are preferred.\
    \ Cables\nand breadboards can be bought very cheaply from just about\nany online\
    \ store that sells raspberry Pi accessories and can\nusually be found in the 'prototyping'\
    \ section of the store.\n\n# Naming conventions\n\nOnce you're ready to connect\
    \ your device, the next task is to\nfind the right pin for the job. While it's\
    \ true that all GPIO ports are\nmultipurpose, some are more multipurpose than\
    \ others! As we've\nalready discovered, some pins are reserved for 5V, 3.3V and\
    \ ground.\nOthers also have special capabilities. But what's more is that they\n\
    can also be called different things. For example, GPIO 18 is also\nknown as pin\
    \ 12 and PCM_CLK. This particular pin (around halfway\ndown the right side of\
    \ the GPIO port) is capable of hardware pulse-\nwidth modulation (PWM), and is\
    \ useful for controlling LED lights and\nmotors among other things.\n\nThe pin-naming\
    \ convention you use in your Python scripts can be\nset manually. This can either\
    \ be set as BCM (the Broadcom pin name)\nor the physical pin locations (BOARD).\n\
    \nYou'll see in any of the projects where we're using the GPIO port,\nthe following\
    \ line with either BCM or BOARD in the brackets:\n\n```\nGPIO.setmode(GPIO.BCM)\n\
    ```\n\nThe easiest way to deal with the GPIO pin naming issues is to pick\na convention\
    \ and stick with it.\n\n> Did you know...\n> \n> ...[illegible text...]"
