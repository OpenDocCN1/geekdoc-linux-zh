    # 02 Install RetroPie onto a blank SD card


    If you want your Raspberry Pi Zero to be used solely as a RetroPie machine, this
    is the r-ho for you. Be warned: it will completely wipe a micro SD card, so if
    you’re using one you’ve used before, make sure you back up any important data
    before starting.


    Download the latest version of the software from http://blog.projectrblock.com/retropie/retro-pie-downloads.
    Make sure you download the correct SD card image for your machine – the image
    for your Raspberry Pi 2 is not compatible with the Raspberry Pi Zero. Download
    the Standard version (not the Raspberry Pi version). The download is an 800MB
    .gz file. Unzip it and extract the img file, which will be around 2.6GB.


    You’ll now need to write this image file onto your micro SD card. This is done
    in the same way that you would install a normal Raspberry Pi image onto a card.
    There are slightly different instructions for Linux, Mac and Windows.


    Above If you see a splash screen like this when you power on again, the installation
    worked!'
