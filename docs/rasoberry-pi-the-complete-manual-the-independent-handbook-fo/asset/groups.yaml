    # Welcome to


    # Raspberry Pi


    # The Complete Manual


    The Raspberry Pi is one of the most exciting things to happen to computer technology
    in recent years. As an educational tool, this tiny PC has re-ignited interest
    in bare-metal computing in schools and homes all over the world. As a platform
    for open-source software, it has inspired millions of people to try Linux - many
    for the first time. Most exciting of all is the potential to incorporate the device
    into practical projects, as demonstrated by the tutorials in this new edition
    of Raspberry Pi The Complete Manual. Grab your Pi and start creating!


