    GitHub 上找到。Pi-Mote 可用于任何树莓派 3B、3B+ 或树莓派 4 Model B 型号。


    ### 远程控制


    使用你的智能手机浏览器控制你的家庭环境


    冬季的夜晚越来越长：使用树莓派和移动设备远程控制你的灯光。


    Energenie 公司生产了一些天才的插座位，可以通过你的树莓派打开或关闭。你可以购买一个包含 RF 发射器附加板和两个插座的入门套件来开始。附加板直接连接到
    GPIO 引脚，并受 Python 库控制。一旦安装和设置完成，你的树莓派就可以使用 Pi-mote 控制多达四个 Energenie 插座，只需使用一个简单的程序。本教程涵盖如何设置软件、插座以及如何修改程序使其可以在你的移动设备上运行。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_81_0.png)


