    \ Player Daemon），并利用响应式 Web 服务器来控制这一切。全尺寸树莓派有两个内置音频输出：通过 HDMI 电缆的音频和 3.5mm 耳机插孔，后者可能会受到干扰和噪音的影响。Pi\
    \ Zero 本身没有音频插孔，但 Pimoroni 前来救援并构建了一个高质量的 DAC（数字音频转换器），使用了与 Hi-Fi berry 相同的芯片（PCM5102A）。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_89_0.png)\n\n> > **你知道吗...？**\n> >\
    \ ...\n\n### 使用 Pi Zero 构建网络 Hi-Fi\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_90_0.png)\n\
    \n#### 焊接针脚座\n\n**01** pHAT DAC 附带一个 40 针脚座，您需要对其进行焊接。我们认为对于这一步骤，助焊剂笔、焊锡、灯和细线规\
    \ 60/40 焊锡是必需的。也可以购买一个可选的 RCA 插孔，以便为较旧的立体声系统提供唱头引线输出。\n\n#### 安装驱动程序\n\n**02**\
    \ DAC 依赖于 I2C，因此我们必须加载两个额外的内核模块。如果您正在运行 Raspbian，您可以输入以下内容通过安全的 HTTP 进行单脚本安装：\n\
    \n```bash\ncurl --silent https://get.pimoroni.com/pihatacl | bash\n```\n\n虽然 HTTPS\
    \ 提供安全下载，但好奇的人可能希望在运行脚本之前审查该脚本。\n\n#### 安装音乐播放守护进程（MPD）\n\n**03** 现在继续安装 MPD 包并启用其在启动时运行。MPD\
    \ 将成为该项目的骨干，提供 MP3 和互联网广播电台的播放。MPD 客户端软件也已安装，用于调试和设置您的初始播放列表。\n\n```bash\n$ sudo\
    \ apt-get install mpd mpc\n$ sudo systemctl enable mpd\n```\n\n#### 克隆并安装 pyPlaylist\
    \ Web 服务器\n\n**04** `pyPlaylist` 是一个用 Python 和 Flask Web 框架构建的响应式（移动设备就绪）Web 服务器。配置完成后，它将为我们提供一种通过\
    \ Web 浏览器控制 Hi-Fi 的方法。以下内容将在 Raspbian 上安装 pyPlaylist：\n\n```bash\n$ sudo pip install\
    \ flask\n$ sudo pip install python-mpd2\n$ cd ~\n$ git clone https://github.com/alexellis/pyPlaylist\n\
    $ cd pyPlaylist\n$ ./raspbian_install.sh\n```\n\n> 也可以购买一个可选的 RCA 插孔，以便为较旧的立体声系统提供唱头引线输出\n\
    \n### 选择广播电台\n\n**05** 我们整理了一份英国一些流行广播电台的列表，可以通过 `add_stations.sh` 文件将其导入 MPD。您可以编辑此文件，或从此网站找到自己的电台：`http://radioreeds.co.uk`\n\
    \n```bash\n$ cd ~/pyPlaylist\n$ ./add_stations.sh\n```\n\n播放列表可用，如下面列表所示：\n\n\
    - `mpc ls`\n- BBCMusic\n- BBCRadio1\n- BBCRadio2\n- BBCRadio4\n- CapitalXtra\n\
    - KissFM\n\n如果您决定要移除其中一个电台，只需输入以下内容：\n\n```bash\n$ mpc rm BBCMusic\n```\n\n###\
    \ 查看电台\n\n**06** 每个广播电台都被添加到其自己的播放列表中 - `mpc ls` 命令显示哪些\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_91_0.png)\n\
    \n"
