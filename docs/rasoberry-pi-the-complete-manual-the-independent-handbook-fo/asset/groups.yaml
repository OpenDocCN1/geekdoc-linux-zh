    ## Nano 初学者指南


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_42_0.png)


    ### 保存并退出


    04 当您完成文件修改并需要继续下一个任务时，可以按 Ctrl+X 退出 nano。它会询问您是否要保存所做的更改，只需输入 Y 进行确认即可。如果您想在不保存更改的情况下退出，只需输入
    N。如果在做出决定之前想取消，请使用 Ctrl+C。


    ### 高级导航


    07 您可能一直在使用空格键（作为方向键的替代）以每次移动一个空间的方式向左、右、上或下移动。不过，还有其他方法可以在文件中移动。使用 Ctrl+A 会像图形编辑器中的
    Home 键一样工作，将光标移动到行首。同样，Ctrl+E 将把您移动到行尾，就像 End 键一样。Ctrl+V 是向下翻页，而 Ctrl+Y 是向上翻页。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_42_1.png)


    ### 保存并继续


    02 当您完成 nano 操作后，可以使用 Ctrl+O 进行保存/写入。所有这些快捷键和功能都是通过 Ctrl 键和一个字母键完成的。它会询问您要将文件保存为什么名称。无论您如何命名，除非您指定路径，否则文件将保存在您打开
    nano 的目录中。


    ### 搜索文件


    08 有时您需要在大型文本文件中查找特定的行或短语。与其使用方向键并不知疲倦地阅读每一行，您可以使用 Ctrl+W 进行搜索。输入搜索词后会在 nano 文档中显示一个框，完成后按
    Ctrl+C 即可退出搜索。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_42_2.png)


    ### 复制和粘贴


    05 这更多是一个终端特定的命令，但在 nano 中也可能显得有些不同寻常。虽然您*不能*使用鼠标在 nano 中导航文件，但您可以像在图形文本编辑器中一样高亮显示文本。高亮显示后，按
    Ctrl+Shift+C 即可复制文本。Ctrl+Shift+V 用于粘贴。


