    \ SD card can be read by Linux PCs by default, and a Windows or Mac computer once\
    \ you have installed a program that lets it read the ext4 file system, such as\
    \ Ext2Fsd. On Windows, the SD card will be listed with the rest of the drives\
    \ under My Computer (Fig 1). On Linux and Mac, it will be listed wherever storage\
    \ is shown on the menus and file managers. Once you've found the SD card on here,\
    \ open it up and navigate to home and then pi. This is where the Documents, Downloads,\
    \ Desktop and other directories can be found. All you need to do is select the\
    \ files you want to copy and move them to a secure directory on your PC or a connected\
    \ external hard drive.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_39_0.png)\n\
    \n+   **What you'll need...**\n+   \n+   - A second computer\n+   - External storage\n\
    \n> **Did you know...**\n> \n> SD card controllers (or ‘write-protects’) can be\
    \ found on some laptops and PCs. This allows you to create a backup on your own\
    \ files which nobody can delete."
