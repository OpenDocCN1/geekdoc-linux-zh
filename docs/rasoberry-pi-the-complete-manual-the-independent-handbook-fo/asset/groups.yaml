    ## 获取远程桌面访问


    所需材料...


    - TightVNC

    - www.tightvnc.com/release_2.7.php


    ### 获取远程桌面访问


    学习如何在无法直接面对 Raspberry Pi 的情况下访问其桌面...


    VNC（虚拟网络计算）是一种图形桌面访问和共享系统，允许用户从自己的系统远程控制和操作另一台计算机的桌面。


    它在很多方面都很有用：让您能够控制远程系统；帮助其他地方的用户；允许计算机保持开机状态，但无需键盘、鼠标甚至显示器。


    在我们的情况下，我们的目标是在未连接上述外设的情况下访问 Raspberry Pi 的桌面。这样，您可以执行通常所做的任何操作，只需连接电源和即可，从而释放空间并节省额外费用。从实际角度来看，这意味着您可能通过
    Android 平板电脑或手机访问 Pi 桌面。


    > 您知道吗...

    >

    > 我在两个独立的 sshd_config 文件中设置了 ssh -v -N，因此您无需担心默认设置有误


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_43_0.png)


    ### 静态 IP 地址


    01 我们的第一步是确保 Raspberry Pi 拥有静态 IP 地址。基本上，IP 地址是您的网络分配给设备的一组数字，用于区分它们。要设置静态 IP
    地址，只需双击 LX Terminal 并输入以下内容，然后按 Enter。


    ```bash

    sudo nano /etc/network/interfaces

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_43_1.png)


    ### 静态 IP 第二部分


    02 此文件控制 Pi 的 IP 寻址。您需要向下滚动到 ''iface eth0'' 行，移除 DHCP 并将其替换为 static。现在，在紧邻其下方的行中，输入您希望强制
    Pi 使用的 IP 地址，以及子网掩码和网关。


    ```bash

    address 192.168.1.99

    netmask 255.255.255.8

    gateway 192.168.1.254

    ```


    ### 静态 IP 第三部分


    03 输入这些详细信息后，按 Ctrl-X 退出 nano，然后按 Y 接受更改，再按几次 Enter 即可返回终端的命令提示符。现在您可以重启您的 Pi，或者在终端中输入以下内容。


    ```bash

    sudo /etc/init.d/networking stop

    sudo /etc/init.d/networking start

    ```


    ## 安装 VNC 第一部分


    现在重新安装 VNC 并确保其自动启动，无论操作系统何时启动。我们不需要担心 Raspberry Pi 的版本，因为配置服务以前常常有一个破坏系统的坏习惯。但现在不再了。输入以下命令，每个命令后按
    Enter：


    ```bash

    sudo apt-get update

    sudo apt-get install tightvncserver

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_44_0.png)


    ## 安装 VNC 第二部分


    当软件包安装完毕且您的 VNC 服务器准备就绪时，请按照屏幕上的说明**创建用户名和密码**。您可能会被要求指定用于访问**位于 1.2.3.4 的 Pi**
    的**功能**。在 **VNC** 中，设置用户访问密码以访问您的桌面实际上是**绝对必要**的。


    ```text

    You will require a password

    to access your desktop.

    Password:

    Verify:

    Would you like to enter a

    view-only password (y/n) n

    New X desktop is raspberrypi:1

    ```


    ## 配置 VNC 服务器


    VNC 服务器已安装并运行正常。现在我们需要确保每次 Raspberry Pi 重启时它都作为服务加载，这样即使 Pi 经历断电循环，您也可以访问它。要在终端中配置
    Pi 执行此操作，请输入以下内容并按 Enter。


    ```bash

    sudo nano /etc/init.d/tightvncserver

    ```


    ## 配置启动服务


    我们回到了 nano，我们需要输入几行命令以便让 Raspberry Pi 在启动时激活 VNC 服务器。在编辑器中输入：


    ```bash

    #!/bin/sh

    #if [unit /etc/init.d/tightvncserver]

    # Set the NUMBER to start

    # the tightvncserver user

    # NUMBER=''pi''

    case "$1" in

    start) su $NUMBER -c ''/usr/bin/tightvncserver''

    # echo "Starting TightVNC

    # server for "''$NUMBER''"''

    #;;

    stop)

    pkill xtightvnc

    echo "TightVncserver stopped"

    #;;

    *)

    echo "Usage: /etc/init.d/

    tightvncserver

    start|stop"

    #;;

    exit 0

    ```


    ## 重启并准备就绪


    现在按 **Ctrl-X**，然后按 **Y** 和 **Enter** 保存。再尝试几次即可返回终端。现在我们需要做的是编辑我们刚刚创建的脚本的权限，使其可执行且处于活动状态。通过在终端中输入以下命令来完成此操作，并确保每个命令后都按
    Enter，否则它不会被注册！


    ```bash

    sudo chmod 755 /etc/init.d/tightvncserver

    sudo rc-tightvncserver defaults

    sudo reboot

    ```


    完成这些步骤后，您需要做的最后一件事是将 Raspberry Pi 拔下，并将其放置在易于访问网线的位置。如果您安装了最新版本的 TightVNC 或其他远程访问软件（只要它使用
    Tight 协议），那么您应该能够将客户端指向 IP 地址（192.168.193.185）或静态 IP 地址，以连接到您希望设备加入的网络，并完全访问 Raspberry
    Pi。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_44_1.png)


    ```bash

    sudo nano /etc/init.d/tightvncserver

    ```


