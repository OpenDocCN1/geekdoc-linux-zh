    \n在“暂存区”的顶部有一个绿色旗帜和一个红色圆圈。点击绿色旗帜让水族馆活起来。现在花一点时间研究一下水族馆动画。注意生物的动作和上升的气泡。红色圆圈可以停止动作。\n\
    \n我们可以使用位于绿色旗帜正上方的三个按钮设置查看模式。\n\n左侧的两个按钮增加或减少暂存区面板的大小。较小的暂存区意味着 Studio 的中央区域相对于其大小增加。\n\
    \n右侧的按钮是演示模式，它像图 5 那样以全屏模式显示舞台。使用左上角的弯曲箭头按钮退出演示模式，或者按“esc”键。\n\n### Scratch Studio\
    \ 角色\n\n03 在“暂存区”下方是这个项目的角色集合。舞台角色与其他角色分开。它与其他的略有不同，充当舞台的背景图像。\n\n该区域顶部的三个按钮提供了创建新角色的各种方法。第一个按钮在绘图编辑器中打开一个空白画布。第二个按钮基于图像文件创建一个新的角色，该文件从弹出的文件选择对话窗口中选择。第三个将从预装图像集合中选择一个随机图像。\n\
    \n我们可以使用主菜单右侧的四个按钮直接管理舞台上的角色。这里我们点击特定的按钮，然后点击舞台上的一个角色。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_52_3.png)\n\
    \n"
