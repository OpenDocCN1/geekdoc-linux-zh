  md: "\n## Control lights with your Pi\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_83_0.png)\n\
    \n### Fitting the Pi-mote\n\nBefore fitting the Pi-mote, remember to shut down\
    \ your Raspberry Pi with `sudo poweroff`. Next, unplug the power supply and fit\
    \ the module onto your Raspberry Pi. The L part of the board fits opposite the\
    \ HDMI port. Power up the Pi and plug in one of your Enel genie sockets in the\
    \ same room or area that your Pi is in.\n\nThe device's range is fairly good,\
    \ but furniture, walls and other objects may sometimes block the transmission\
    \ signal. You can test that the socket is working by plugging in something like\
    \ a desk lamp and then pressing the green button that is located on the socket.\
    \ This will trigger the socket on and off, turning the lamp on and off in turn.\n\
    \n### Download the set-up code\n\nBefore the Raspberry Pi can interact with the\
    \ socket and switch it on/off, it requires programming to learn a control code\
    \ that is sent from the transmitter. Each socket has its own unique code so that\
    \ you can control up to four individually. Enel genie provides the set-up program\
    \ which can be found inside our tutorial resources (available at bit.ly/21ZKMQ4).\n\
    \n### Set up in your socket\n\nOnce you have downloaded the set-up program, run\
    \ it. This should place the socket into 'learning mode', which will be indicated\
    \ by the LED on the front of the socket housing slowly flashing. Do not do this,\
    \ press and hold the green button for at least five seconds and release it when\
    \ the LED starts to flash at a one-second interval. Run the program and it will\
    \ send a signal out. Follow the on-screen prompts, pressing the button key when\
    \ required.\n\nWhen the code is accepted, success will be indicated with a brief\
    \ flashing of the LED on the housing. If you have more than one socket to set\
    \ up, simply use the same program and method to do so for as many times as required.\n\
    \n### A quick test\n\nBefore you get to the task of creating your Python code\
    \ to control your socket, it is always advisable to test that the socket is working\
    \ correctly. Ensuring that the power is turned on at the wall plug and that the\
    \ lamp is switched on, you can turn the lamp off by pressing the green button\
    \ on the front of the Enel genie socket. The lamp should turn back on again when\
    \ the button is next pressed.\n\n### Code to turn the socket on\n\nThe Python\
    \ Enel genie library makes it incredibly easy to create a code to turn the socket\
    \ on, which will then turn your lamp on. Before you know it, you'll be using your\
    \ Raspberry Pi to turn the kettle on (if that's on/off)!\n\nOpen your Python editor\
    \ and start a new program. Next, import the Raspberry Pi GPIO library (line 1,\
    \ below), then import the Enel genie library (lines 2 and 3). Finally, add in\
    \ the code to switch the socket on (line 4). Save and then run your program. The\
    \ socket will turn on, you may hear a click, and then your lamp will come on.\n\
    \n```python\nimport RPi.GPIO as GPIO\nimport energenie\nfrom energenie import\
    \ switch_on\n\nenergenie.switch_on(1)\n```\n\n## Projects\n\n### Switching the\
    \ socket on and off\n\nSince you have not told the socket to turn off, it will\
    \ stay on, which means the lamp will stay on forever (or until the bulb blows!).\
    \ To turn the socket off after five seconds, import the `time` function at the\
    \ start of your program (line 2, below), and the command to turn off the socket\
    \ (line 5). Then add a pause with the `sleep` command (line 7) and finally turn\
    \ off the lamp (line 8). Now save and run the program.\n\n```python\nimport RPi.GPIO\
    \ as GPIO\nimport time\nimport energenie\nfrom energenie import switch_on\nfrom\
    \ energenie import switch_off\n\nenergenie.switch_on()\ntime.sleep(5)\nenergenie.switch_off()\n\
    ```\n\n### Web-based applications\n\nIt is possible to augment the web back so\
    \ that you can turn the lamp on and off from a mobile device such as your phone,\
    \ laptop or tablet. This makes the whole project more impressive, slick and fun.\
    \ The first step is to set up your Raspberry Pi as a web server which will host\
    \ and display a web page with the ON/OFF option. These buttons are interactive\
    \ and control the socket. Open the LX Terminal and install `pip` and `Flask`.\n\
    \n```bash\nsudo apt-get install pip\nsudo pip install flask\n```\n\n> \"Using\
    \ a mobile device such as your phone, laptop or tablet makes the whole project\
    \ more impressive, slick and fun\"\n\n### CSS and HTML\n\nTo make the web page\
    \ presentable, you need to set up an HTML, and a CSS file. HTML stands for HyperText\
    \ Markup Language and is used to create web pages. Your browser reads HTML files\
    \ and converts them into web pages, enabling images and objects to be embedded\
    \ into the pages. Cascading Style Sheets, or CSS, is the code which describes\
    \ how the web page will look, the presentation of the HTML content. It contains\
    \ instructions on how the elements will be rendered. Here, it controls how the\
    \ on and off options will be presented.\n\n### Create a new folder\n\nWith `Flask`\
    \ installed, reboot your Raspberry Pi type `sudo reboot`. Create a new folder\
    \ called `WebApp_Lights` in the `/home/pi/` folder. This is where you will save\
    \ the Python program which controls the socket and lamp, the CSS and HTML file.\
    \ You can create the folder in the LX Terminal by typing `mkdir Module.Lights`\
    \ or right-clicking in the window and selecting New Folder.\n\n### The HTML files\n\
    \nOpen the `Mobile_Lights` folder to set up and create a new folder called “templates”.\
    \ This folder is where the HTML file is saved that contains the structure for\
    \ the website pages. The code names the page tab and, most importantly, adds the\
    \ links for the on and off option. Open a text editor from your Start menu, or\
    \ use `nano` and create a new file. Add the HTML below to the file and then save\
    \ the file into the `templates` folder, naming it “index.html”. Remember, this\
    \ is an HTML file and must end with the file extension `.html`.\n\n```html\n<!doctype\
    \ html>\n<html>\n  <head>\n    <title>Light Controller</title>\n    <link rel=\"\
    stylesheet\" href=\"/static/style.css\" />\n    <meta name=\"viewport\" content=\"\
    width=device-width, user-scalable=no\" />\n  </head>\n  <body>\n    <div class=\"\
    on\"><a href=\"/on\">ON</a></div>\n    <div class=\"off\"><a href=\"/off\">OFF</a></div>\n\
    \  </body>\n</html>\n```\n\n### Add some style\n\nCSS is used to create and apply\
    \ a bunch of style effects to the web page. Move back to the `Mobile_Lights` folder\
    \ and create a new folder named `static`. This is where the CSS file is saved.\
    \ Create another new text file and add the code below, which sets out the *style*\
    \ for the web page. You can customise the colours of the buttons from line 20\
    \ onwards. Save the file as `style.css` in the `static` folder.\n\n```css\nbody\
    \ {\n    position: absolute;\n    margin: 0;\n    top: 0;\n    right: 0;\n   \
    \ bottom: 0;\n    left: 0;\n    font-family: Arial, sans-serif;\n    font-size:\
    \ 18px;\n    text-align: center;\n}\n\ndiv {\n    display: block;\n    width:\
    \ 100%;\n    height: 50%;\n}\n\ndiv.a {\n    width: 100%;\n    height: 100%;\n\
    \    display: block;\n}\n\ndiv.on {\n    background: black;\n}\n\ndiv.on a {\n\
    \    color: white;\n}\n\ndiv.off a {\n    color: black;\n}\n\na:link, a:visited\
    \ {\n    text-decoration: none;\n}\n```\n\n### Putting it all together\n\nThe\
    \ final part of the setup is to write the Python script that combines the `index.html`\
    \ and `style.css` files with the Energenie socket control code similar to the\
    \ one used in Step 7.\n\nOpen IDLE and start a new window, add the following code\
    \ and save into your `Mobile_Lights` folder, naming it `mobile_lights.py`. Line\
    \ 4 uses the `route()` decorator to tell Flask the HTML template to use to create\
    \ the web page. Lines 7 and 11 use `app.route('/on/')` and `app.route('/off/')`\
    \ to tell Flask the function to trigger when the URL is clicked. In line 15 the\
    \ `run()` function is used to run the local web server for our application. The\
    \ `__name__ == \"__main__\"` makes sure the web server only runs if the script\
    \ is executed directly from the Python interpreter and not used as an imported\
    \ module.\n\n```python\nfrom flask import Flask, render_template\nfrom energenie\
    \ import switch_on, switch_off\n\napp = Flask(__name__)\n\n@app.route('/')\ndef\
    \ index():\n    return render_template('index.html')\n\n@app.route('/on/')\ndef\
    \ on():\n    switch_on()\n    return render_template('index.html')\n\n@app.route('/off/')\n\
    def off():\n    switch_off()\n    return render_template('index.html')\n\nif __name__\
    \ == \"__main__\":\n    app.run(debug=True, host='0.0.0.0')\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_85_0.png)\n"
  mdcn: "\n\n## 用 Pi 控制灯光\n\n![](img/fd3f4a58cf5250916d8b8e1d4ccd045_83_0.png)\n\n\
    ### 安装 Pi-mote\n\n在安装 Pi-mote 之前，请记住使用 `sudo poweroff` 命令关闭你的树莓派。接下来，拔掉电源线，并将模块安装到你的树莓派上。该板的\
    \ L 形部分应位于 HDMI 接口的对面。给 Pi 通电，并在 Pi 所在的房间或区域插入一个 Enel genie 插座。\n\n该设备的信号范围相当好，但家具、墙壁和其他物体有时可能会阻挡传输信号。你可以通过插入一盏台灯之类的物品，然后按下插座上的绿色按钮来测试插座是否正常工作。这将触发插座的开和关，从而依次让灯亮起和熄灭。\n\
    \n### 下载设置代码\n\n在树莓派能够与插座交互并控制其开关之前，它需要编程以学习从发射器发送的控制代码。每个插座都有自己唯一的代码，因此你可以单独控制多达四个插座。Enel\
    \ genie 提供了设置程序，可以在我们的教程资源中找到（地址为 bit.ly/21ZKMQ4）。\n\n### 设置你的插座\n\n下载设置程序后，运行它。这应该使插座进入“学习模式”，其标志是插座外壳前部的\
    \ LED 灯缓慢闪烁。不要这样做，而是按下并长按绿色按钮至少五秒，当 LED 灯开始以一秒间隔闪烁时松开。运行程序，它将发出一个信号。按照屏幕上的提示操作，在需要时按下对应的按钮键。\n\
    \n当代码被接受时，外壳上的 LED 灯会短暂闪烁以表示成功。如果你有多个插座需要设置，只需使用相同的程序和方法，重复操作所需的次数即可。\n\n### 快速测试\n\
    \n在你着手编写 Python 代码来控制插座之前，最好先测试插座是否正常工作。确保墙上的电源插头已通电且灯已打开，然后你可以通过按下 Enel genie\
    \ 插座前部的绿色按钮来关闭灯。当下次按下按钮时，灯应该重新亮起。\n\n### 开启插座的代码\n\nPython 的 Enel genie 库使得编写开启插座的代码变得极其简单，进而打开你的灯。转眼间，你就可以用树莓派来烧开水了（如果那是开/关控制的！）。\n\
    \n打开你的 Python 编辑器，开始一个新程序。接下来，导入树莓派 GPIO 库（下文第 1 行），然后导入 Enel genie 库（第 2 行和第\
    \ 3 行）。最后，添加开启插座的代码（第 4 行）。保存并运行你的程序。插座将开启，你可能听到咔哒一声，然后你的灯会亮起来。\n\n```python\n\
    import RPi.GPIO as GPIO\nimport energenie\nfrom energenie import switch_on\n\n\
    energenie.switch_on(1)\n```\n\n## 项目\n\n### 插座的开与关\n\n既然你没有告诉插座关闭，它将保持开启状态，这意味着灯将永远亮着（或者直到灯泡烧坏！）。要在五秒后关闭插座，请在程序开头导入\
    \ `time` 函数（下文第 2 行），并添加关闭插座的命令（第 5 行）。然后添加一个使用 `sleep` 命令的暂停（第 7 行），最后关闭灯（第 8\
    \ 行）。现在保存并运行程序。\n\n```python\nimport RPi.GPIO as GPIO\nimport time\nimport energenie\n\
    from energenie import switch_on\nfrom energenie import switch_off\n\nenergenie.switch_on()\n\
    time.sleep(5)\nenergenie.switch_off()\n```\n\n### 基于 Web 的应用程序\n\n你可以增强 Web 功能，从而能够通过手机、笔记本电脑或平板电脑等移动设备打开和关闭灯。这使得整个项目变得更加令人印象深刻、时尚和有趣。第一步是将你的树莓派设置为一台\
    \ Web 服务器，用于托管并显示带有 ON/OFF 选项的网页。这些按钮是交互式的，并控制插座。打开 LX Terminal 并安装 `pip` 和 `Flask`。\n\
    \n```bash\nsudo apt-get install pip\nsudo pip install flask\n```\n\n> “使用手机、笔记本电脑或平板电脑等移动设备使得整个项目变得更加令人印象深刻、时尚和有趣”\n\
    \n### CSS 和 HTML\n\n为了使网页美观，你需要设置一个 HTML 文件和 CSS 文件。HTML 代表超文本标记语言，用于创建网页。你的浏览器读取\
    \ HTML 文件并将其转换为网页，使图像和对象能够嵌入到页面中。层叠样式表（CSS）是描述网页外观的代码，即 HTML 内容的呈现方式。它包含关于元素如何渲染的说明。在这里，它控制开和关选项的呈现方式。\n\
    \n### 创建新文件夹\n\n安装好 `Flask` 后，重启你的树莓派，输入 `sudo reboot`。在 `/home/pi/` 文件夹中创建一个名为\
    \ `WebApp_Lights` 的新文件夹。这是你保存控制插座和灯的 Python 程序以及 CSS 和 HTML 文件的地方。你可以在 LX Terminal\
    \ 中输入 `mkdir Module.Lights` 或在窗口中右键单击并选择“新建文件夹”来创建该文件夹。\n\n### HTML 文件\n\n打开 `Mobile_Lights`\
    \ 文件夹，设置并创建一个名为“templates”的新文件夹。这是保存包含网站页面结构的 HTML 文件的地方。代码为页面标签命名，并最重要的是，添加了开和关选项的链接。从开始菜单打开文本编辑器，或使用\
    \ `nano` 创建一个新文件。将下面的 HTML 代码添加到文件中，然后将文件保存为 `templates` 文件夹中的“index.html”。请记住，这是一个\
    \ HTML 文件，必须以文件扩展名 `.html` 结尾。\n\n```html\n<!doctype html>\n<html>\n  <head>\n\
    \    <title>Light Controller</title>\n    <link rel=\"stylesheet\" href=\"/static/style.css\"\
    \ />\n    <meta name=\"viewport\" content=\"width=device-width, user-scalable=no\"\
    \ />\n  </head>\n  <body>\n    <div class=\"on\"><a href=\"/on\">ON</a></div>\n\
    \    <div class=\"off\"><a href=\"/off\">OFF</a></div>\n  </body>\n</html>\n```\n\
    \n### 添加一些样式\n\nCSS 用于创建并应用于网页的一系列样式效果。回到 `Mobile_Lights` 文件夹并创建一个名为 `static`\
    \ 的新文件夹。这是保存 CSS 文件的地方。创建另一个新文本文件，并添加下面的代码，该代码定义了网页的 *样式*。你可以从第 20 行开始自定义按钮的颜色。将文件保存为\
    \ `static` 文件夹中的 `style.css`。\n\n```css\nbody {\n    position: absolute;\n   \
    \ margin: 0;\n    top: 0;\n    right: 0;\n    bottom: 0;\n    left: 0;\n    font-family:\
    \ Arial, sans-serif;\n    font-size: 18px;\n    text-align: center;\n}\n\ndiv\
    \ {\n    display: block;\n    width: 100%;\n    height: 50%;\n}\n\ndiv.a {\n \
    \   width: 100%;\n    height: 100%;\n    display: block;\n}\n\ndiv.on {\n    background:\
    \ black;\n}\n\ndiv.on a {\n    color: white;\n}\n\ndiv.off a {\n    color: black;\n\
    }\n\na:link, a:visited {\n    text-decoration: none;\n}\n```\n\n### 将所有部分组装在一起\n\
    \n设置部分的最后一步是编写 Python 脚本，将 `index.html` 和 `style.css` 文件与类似第 7 步中使用的 Energenie\
    \ 插座控制代码结合起来。\n\n打开 IDLE 并启动一个新窗口，添加以下代码并将其保存到你的 `Mobile_Lights` 文件夹中，命名为 `mobile_lights.py`。第\
    \ 4 行使用 `route()` 装饰器告诉 Flask 使用哪个 HTML 模板来创建网页。第 7 行和第 11 行使用 `app.route('/on/')`\
    \ 和 `app.route('/off/')` 告诉 Flask 当 URL 被点击时要触发哪个函数。第 15 行使用 `run()` 函数来运行我们应用程序的本地\
    \ Web 服务器。`__name__ == \"__main__\"` 确保 Web 服务器仅在脚本直接从 Python 解释器执行时运行，而不是作为导入模块使用时。\n\
    \n```python\nfrom flask import Flask, render_template\nfrom energenie import switch_on,\
    \ switch_off\n\napp = Flask(__name__)\n\n@app.route('/')\ndef index():\n    return\
    \ render_template('index.html')\n\n@app.route('/on/')\ndef on():\n    switch_on()\n\
    \    return render_template('index.html')\n\n@app.route('/off/')\ndef off():\n\
    \    switch_off()\n    return render_template('index.html')\n\nif __name__ ==\
    \ \"__main__\":\n    app.run(debug=True, host='0.0.0.0')\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_85_0.png)\n\
    \n"
