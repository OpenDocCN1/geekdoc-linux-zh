    # Pi Supply Switch £15


    The Raspberry Pi has got so popular, in part, because of the extremely good value
    for money of the hardware: it packs a lot of punch for the price point and, because
    it is designed by a charity, they don''t need to inflate the price with high profit
    margins (consider how much it would cost as a commercial product). Unfortunately,
    as with anything low-cost, some compromises had to be made in order to bring it
    at such an affordable and small form factor.


    When comparing it to your more standard desktop or laptop computer, two things
    that it is obviously lacking are a power switch and power management functionality.
    It''s surprising how something as simple as a power switch can be so very useful,
    and it is not until you do not have one that you realise this.


    The Pi Supply Switch is a self-solder kit which provides an on, off and soft off
    (i.e. safe shutdown) button to give you basic power management functionality for
    your Pi. With some provided simple scripts you can make sure your Pi is correctly
    shut down when you switch off - without the need to open any menus or issue any
    commands in the terminal - and the circuit in the switch ensures that power is
    only removed after the Pi has been shut down. As well as making a more convenient
    for you, it also reduces the possibility of corruption to your SD card from prematurely
    pulling the power cable.


    # PITFT Mini Kit £30


    This is a 2.8-inch capacitive TFT-LCD touchscreen that''s been specifically designed
    with the Raspberry Pi in mind by the project gurus over at Adafruit. It''s capable
    of sitting directly on top of the Raspberry Pi and is about as big as the Pi itself.


    There are numerous reasons why you''d want to add such a screen to a Raspberry
    Pi but they all generally come down to the fact that the Pi is very small and
    very portable and most monitors are not. While you could remote connect via VPN
    from a phone if you''re on the go, the screen is connected directly to the Pi
    and doesn''t involve awkward wireless networking. Also as a touchscreen you don''t
    need to bring along other input devices, as it''s powered off the Raspberry Pi''s
    wells.


    This opens it up to a world of possibilities. Portable computer, touchscreen control
    pad, video camera... anything that could benefit from your Raspberry Pi having
    a screen and human input while away from your main monitor.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_37_1.png)'
