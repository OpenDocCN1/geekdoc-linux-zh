    \ 充分利用你的存储空间\n\n03 通常你需要为你选择的 Raspberry Pi 发行版预留 1-2GB 的存储空间，因此 SD 卡上的任何剩余存储空间将用于你创建或保存的更新和数据。在\
    \ Raspbian 中，你可以打开命令行并运行配置实用程序以获得更多空间（仅当你的 SD 卡大于 2GB 时）：\n\n```bash\nsudo raspi-config\n\
    ```\n\n### 扩展 Raspbian 分区\n\n04 最大化分区可提供 SD 卡的全部容量，这将增加媒体的寿命（因为有更多空间可供写入，因此相同的扇区不会被如此频繁地重写）。当\
    \ `raspi-config` 实用程序运行时，使用箭头键在菜单中选择 `expand_rootfs`。然后短暂等待分区调整大小。\n\n### 将数据写入\
    \ RAM\n\n05 不要将数据读写到 SD 卡——这在长期内最终会导致可靠性和性能下降——你可以配置 Raspbian 将数据写入系统 RAM，这将稍微加快速度并提高\
    \ SD 卡的整体性能。这是通过文件系统表实现的，这是大多数 Linux 发行版中可用的系统配置。\n\n### 在 Raspbian 中启用 fstab\n\
    \n06 这很像在 Windows 中创建 RAM 磁盘。在命令行中，输入：\n\n```bash\nsudo nano /etc/fstab\n```\n\
    \n添加以下行以挂载虚拟文件系统：\n\n```bash\ntmpfs  /var/log        tmpfs\ndefaults,nosuid,noatime,size=100m\
    \  0 0\n```\n\n保存并退出 nano（ctrl-X），然后安全地重启 Pi：\n\n```bash\nsudo shutdown -r now\n\
    ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_64_1.png)\n\n> 通常你需要为你选择的 Raspberry\
    \ Pi 发行版预留 1-2GB 的存储空间。\n\n"
