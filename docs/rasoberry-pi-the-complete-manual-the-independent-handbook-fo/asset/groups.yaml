  - "[PAGE 53]\n\n# ## Use Scratch blocks and tools\n\nGetting to grips with the Scratch\
    \ Studio toolbox\n\nSituated in the centre of the Studio is the Edit Panel. The\
    \ panel contents relate to the currently selected sprite. \n\nLet’s start by selecting\
    \ the jelly fish sprite, called Creature1, from the Sprite Collection area.\n\n\
    At the top we have the sprite’s image and name, plus an indication of its current\
    \ stage coordinates and direction. On the left are three animation control buttons.\
    \ The top button will rotate the sprite, the second switches between left- and\
    \ right-facing states, and the third turns animation off.\n\nBelow are three Edit\
    \ Panel tabs. The script tab is where block scripts are created. Here’s where\
    \ we’ll drag and drop our blocks, snapping them together in various combinations.\n\
    \nTo change a sprite’s visual appearance we’ll use the ‘Costumes’ tab. Each sprite\
    \ can have one or more costumes. For example, the jellyfish has two costumes (Fig\
    \ 1). Each costume has buttons to edit, copy and delete. New costumes can be painted,\
    \ imported or captured using the three ‘New Costumes’ buttons. The sound tab allows\
    \ us to add audio to our project.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_53_0.png)\n\
    \nFig 1a: Jellyfish Sprite Costumes – The jellyfish sprite has two different costumes\n\
    \n# Scratch block styles\n\n# 01\n\nThe ‘Blocks Palette’ contains the complete\
    \ collection of scripting blocks. Blocks come in three base styles, namely hats,\
    \ stacks and reporters (see Fig 3 on the opposite page).\n\nA hat-style block\
    \ will start block script execution based on a specific event. The classic hat\
    \ block is the ‘green flag’ click event. However, there are numerous other hat\
    \ blocks, including hat blocks that start script execution after a specific key\
    \ press, a mouse click and even following sensor event from the some GPIO connected\
    \ hardware. As you can probably tell, this offers a lot of options to Scratch\
    \ programmers.\n\nReporter blocks allow us to specify textual, numeric and boolean\
    \ values. They fit into specific shape holes in other blocks. A rectangular value\
    \ will contain a text string. While the rounded end reporters are associated with\
    \ numeric values, angle-ended reporters contain boolean true and false values.\
    \ \n\nStack blocks are the core script building elements. They interconnect with\
    \ other blocks via their top-edge notches and bottom-edge bumps. Many stack blocks\
    \ contain ‘holes’ for reporter style blocks, which will modify their operation\
    \ depending on the specified reporter block values. \n\nThe Scratch block collection\
    \ is divided into groups. We select a block group using the eight buttons located\
    \ at the top of the Edit Panel, namely, ‘Motion’, ‘Control’, ‘Looks’ and so on.\
    \ These groups are colour coded. Apart from aiding block selection this colour\
    \ coding provides a visual cue to a block’s type when reading a block script in\
    \ the Edit Panel."
  - "[PAGE 54]\n\n# Program with Scratch\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_0.png)\n\
    \n# Scratch block help\n\n02 As we’ve seen, there are many blocks, each with their\
    \ own specific functionality and capabilities.\n\nIn one way this is great news:\
    \ A large block collection means Scratch can be used in a vast range of software\
    \ projects, such as games, animation, music, graphics, math, science, robots,\
    \ electronics and much more.\n\nHowever, the wide selection of blocks can be quite\
    \ a challenge for the novice Scratch coder. To help with this problem the Scratch\
    \ Studio designers have included an informative set of block-centric help pages.\n\
    \nA simple right click on any block will display a pop-up help page option. The\
    \ help page contains context-specific descriptions, graphical images and, where\
    \ appropriate, a script example of how to use this particular block (Fig 4). It’s\
    \ a terrific feature which greatly simplifies the process of decoding which blocks\
    \ to use. More importantly, studying these help pages is a highly effective way\
    \ to enhance our scripting skills and discover the potential contained within\
    \ Scratch’s feature-rich block collection.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_1.png)\n\
    \n# Projects\n\n> **Did you know...**  \n> There has been an explosion in interest\
    \ in computer programming within the last few years. For many kids the first step\
    \ on the road to learning programming skills has been the Scratch program.\n\n\
    # Block script walkthrough\n\n03 Let’s step deeper into how a block script works\
    \ in practice. For this, we will use a simple Aquarium project block script. From\
    \ the 'Sprite collection' panel select the 'Stage' tab. Then go back to the central\
    \ 'Edit Panel' and select the 'Scripts' tab.\n\nHere’s just a block block script.\
    \ Starting at the top throws a green flag that starts/block to kick off the activity.\
    \ Next there’s a 'forever' loop. The block's inside this loop are activated until\
    \ the stop button is pressed. This forever loop block contains two other blocks.\n\
    \nThe first inner script block selects the next background image. Click on the\
    \ 'Backgrounds' tab to view all the stage images. The second inner block simply\
    \ pauses execution for a number of seconds. Setting the value to 11 means that\
    \ this script will pause for a second before then performing the action specified\
    \ by the next block.\n\nIt’s important that you remember these two blocks are\
    \ enclosed in the forever loop block. So, the stage background images will be\
    \ displayed in sequence for one second each.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_2.png)"
  - "[PAGE 55]\n\n# Create a Snake clone in Scratch\n\n# ## Create a Snake clone in\
    \ Scratch\n\nDesign your own version of Snake to test your new programming skills!\n\
    \nHere, we will create a version of the classic Snake game where you move the\
    \ snake around the Scratch stage using the arrow keys. You control the head of\
    \ the snake and must avoid a collision with either the body of the snake or the\
    \ edge of the stage.\n\nThe snake body grows longer each time you eat an egg.\
    \ You get points added to your score for eating good yellow eggs and lose points\
    \ for eating bad black eggs. There are also bonus sprites to eat for extra points.\n\
    \nBy following this tutorial you will learn to create your own simple sprite graphics,\
    \ send and receive broadcast events, use a list variable to store data, play sound\
    \ effects, generate random numbers and use sensing commands to detect when a sprite\
    \ is touching something.\n\n# What you'll need...\n\nScratch project archives\
    \ \nwww.scratch.mit.edu/template/late-ever\n\n# Did you know...\n\nIn the early\
    \ 1970s, the arcade game *Asteroids* was popular. Many versions of *Asteroids*\
    \ were created for personal computers, some of which were known as **Snake** or\
    \ **Viper**.\n\n# Egg sprite\n\nThe Egg sprite appears randomly on the screen\
    \ and lets other sprites know when it has been eaten (touched by the snake tongue).\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_0.png)\n\n**Snake sprite** \nThe\
    \ Snake sprite moves the head around the stage and drives the body behind it.\
    \ It also detects collisions with the body or edge\n\n**Tail sprite** \nThe Tail\
    \ sprite follows the head, erasing the end of the body as the snake moves, and\
    \ pausing when it needs to grow.\n\n**Bad Egg sprite** \nThe bad Egg sprite also\
    \ appears randomly but decreases the score when eaten. It also grows in size,\
    \ getting harder to avoid.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_1.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_2.png)\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_3.png)\n\
    \n# Paint the Snake sprite\n\n01. Click the New Sprite: Paintbrush icon to paint\
    \ the Snake sprite. In the Paint Editor, draw a small green ellipse for the snake\
    \ head and add a red rectangle for the tongue. It's important that the tongue\
    \ is a different colour to the head. Name your sprite Snake."
  - '[PAGE 56]


    # Add a Snake sound


    **02** When the Snake tongue touches the Snake body or the edge of the stage,
    we are going to play a Game Over sound. We need to add this sound to the Sprite
    palette. With the Snake sprite selected, click the Sound tab and choose Import.
    Select the Electronic>Creech sound.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_0.png)


    # Respond to arrow keys


    **03** Drag four ‘when key pressed’ commands from the Control palette, and four
    point in direction commands from the Motion palette. Configure them as shown so
    that the up arrow changes the direction to 0 degrees and 90 degrees down. Click
    the green flag above the stage to test this.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_1.png)


    # Make Snake variables


    **04** Click on the Variables palette. Make two variables: Score and Speed that
    are visible to all sprites. Make a list called Next Direction which is visible
    to all sprites; it will store the sequence of directions that the head takes.
    Only have the Score variable checked so it appears on the stage.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_2.png)


    # Initialise Snake variables


    **05** Use a ‘when green flag clicked’ Control command and initialise the Snake
    variables as shown, using commands from the Variables palette. We want to start
    each game with an empty Next Direction list, so delete all of its entries. The
    Score must start at zero. The Speed sets difficulty.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_3.png)


    # Draw Snake body


    **06** Use commands from the Pen palette to control the drawing of the Snake body.
    You should also use commands from the Motion palette to move the snake to the
    centre of the stage and point left at the beginning of each game. This pen is
    up until the Snake is in its starting position. In the next step we’ll use colours
    to check to see if the head is touching anything it shouldn’t.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_4.png)


    # Add main action loop


    **07** Use a ‘forever’ command with an ‘if-else’ command nested inside. We have
    a collision if the red tongue is touching the blue body, the head is always touching
    the body or the Snake sprite is touching the edge. Use the Eyedropper tool to
    select colours within Scratch.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_5.png)


    # Handle Game Over


    **08** When a collision has been detected, broadcast a Game Over event. You’ll
    need to create a new event to the other sprites so they can also react. Also,
    play the Score! sound effect and stop all scripts so that the Snake freezes in
    its current position at the end of the game.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_6.png)'
