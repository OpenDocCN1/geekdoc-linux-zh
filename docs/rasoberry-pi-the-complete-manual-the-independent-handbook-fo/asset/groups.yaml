    \ none;\n}\n```\n```\n\n# Putting it all together\n\n**14** The final part of\
    \ the setup is to write the Python script that combines the index.html and style.css\
    \ files with the Energenie socket control code similar to the one used in Step\
    \ 7.\n\nOpen IDLE and start a new window, add the following code and save into\
    \ your Mobile_Lights folder, naming it `mobile_lights.py`. Line 4 uses the route()\
    \ decorator to tell Flask the HTML template to use to create the web page. Lines\
    \ 7 and 11 uses app.route(‘on’) and app.route(‘off’) to tell Flask the function\
    \ to trigger when the URL is clicked. In line 15 the run() function is used to\
    \ run the local web server for our application. The `_ _name__ == __main__` makes\
    \ sure the web server only runs if the script is executed directly from the Python\
    \ interpreter and not used as an imported module.\n\n```\n```\nfrom Flask import\
    \ Flask, render_template\nfrom energecie import switch_on, switch_off\n\napp =\
    \ Flask(_name_)\n\n@app.route('/')\ndef index():\n    return render_template('index.HTML')\n\
    \n@app.route('on/')\ndef on():\n    switch_on()\n    return render_template('index.HTML')\n\
    \n@app.route('off/')\ndef off():\n    switch_off()\n    return render_template('index.HTML')\n\
    \nif _name_ == _main_:\n    app.run(debug=True, host='0.0.0.0')\n```\n```\n\n\
