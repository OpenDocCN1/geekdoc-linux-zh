    06 之前的脚本应该会提示树莓派相框开始显示指定文件夹中的图像，每张持续10秒。为了强制其在启动时运行，我们需要将其添加到脚本中。创建该脚本的命令如下：


    ```bash

    sudo nano /home/pi/start-picture-frame.sh

    ```


    添加以下内容：


    ```bash

    #! /bin/bash

    DISPLAY=:0.0 AUTHORITY=/home/pi/.Xauthority /usr/bin/feh -r -x -f -B -b -l -d
    -O -O 15.0 /media/STORAGE/test

    ```


    使用以下命令保存并退出该文本：


    ```bash

    bash /home/pi/start-picture-frame.sh

    ```


    ### 设置相框在启动时运行

    07 现在可以将该脚本设置为在开机时运行。打开


    ```bash

    sudo nano /etc/rc.local

    ```


    ...并在 `exit 0` 之前添加：


    ```bash

    sleep 10

    su - pi -c ''/bin/bash /home/pi/start-picture-frame.sh'' &

    ```


    保存并退出。


    ### 重启树莓派并测试

    08 现在你基本上完成了！为了测试，使用常规的 `sudo reboot` 命令重启树莓派，并检查设备是否直接启动到相框模式。如果遇到任何问题，请使用 `lightdm.conf`
    和 `rc.local` 检查你的命令是否正确输入并位于正确的位置。


    ### 停止相框

    09 如果你需要在任何时候停止相框软件，可以使用以下简单命令来实现。


    ```bash

    sudo pkill feh

    ```


    只要你为相框准备的图像没有占用过多的磁盘空间，它们应该能没有问题地加载。


