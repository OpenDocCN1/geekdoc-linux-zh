    \n### 格式化卡\n\n05 在 Windows 中，格式化卡只需插入并等待其挂载。然后右键点击“我的电脑”，再点击卡的图标。之后，选择“格式化”，然后从下拉菜单中选择“FAT32”。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_20_1.png)\n\n### 使用终端\n\n06 如果你使用 OS\
    \ X 或 Linux，你将不得不使用终端来复制映像。在 OS X 中，终端应用程序默认安装，大多数 Linux 版本也以某种形式附带终端。它可能被称为“控制台”或“命令行”。\n\
    \n### 获取操作系统\n\n01 你的第一个问题可能是“我在哪里可以找到可下载的操作系统？”大多数常见映像可以在树莓派主站上找到：www.raspberrypi.org/downloads。这些是稳定且经过充分测试的系统，值得研究。\n\
    \n### 操作系统格式\n\n03 在 zip 文件中，你会找到一个具有 .img 或 .iso 扩展名的文件。这些相当于安装 CD 或 DVD 的“快照”。仅仅将文件复制到\
    \ SD 卡上不会有任何作用；你需要使用程序来提取它。\n\n### 解压\n\n02 下载映像后，你很可能想要做的第一件事是解压它。在 Windows 中，可以通过右键点击并选择“提取”来完成。在\
    \ OS X 中，只需双击即可提取文件。\n\n### SD 卡格式\n\n04 你将从中启动的 SD 卡必须是空白的，所以请先确保上面没有重要内容。你还需要将其格式化为\
    \ FAT32 文件系统。这是一种常见系统，大多数 U 盘和相机都使用它。\n\n### DD 命令\n\n07 你需要使用的命令叫做 'dd'。其输入格式为\
    \ 'dd <source> to <destination>'，例如，`sudo dd bs=4m if=/dev/sdb5`（如果你插入了 CD/DVD，则为\
