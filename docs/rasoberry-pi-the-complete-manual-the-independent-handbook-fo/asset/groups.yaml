    ## 用油漆绘制电路


    ### 项目


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_0.png)


    ### 选择你的平台


    02 Bare Conductive 导电漆的妙处在于，干燥后它就像普通电线一样工作！这意味着你可以将它与你喜欢的任何微控制器配合使用：使用 Bare Conductive
    触控板、树莓派或 Adafruit 的 FLORA 可穿戴平台。或者，你甚至可以使用一些小电池和闪烁的 LED 来构建一个独立的系统。


    ### 开始涂刷


    03 你可以将 Bare Conductive 导电漆涂在几乎任何表面上——纸张、织物、墙壁、衣物、木材、塑料等等。为了获得真正精确的形状和效果，最好的方法是制作或购买一个模板（纸质模板在家里最容易制作，但使用乙烯基材料可以获得最好的边缘效果）。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_1.png)


    ### 连接起来


    04 无论导电漆涂在什么表面上，都有很多方法可以将其连接起来（例如使用电池组），因为一旦干燥，它的表现就像绝缘电线一样。因此，你可以使用用油漆粘合的电线、回形针、长尾夹、鳄鱼夹，甚至是为可穿戴项目缝制的导电按扣。


    ### 进行修复


    05 导电漆较厚，干燥后会变得相当坚固。这意味着你可以用它来冷焊部件，并修复任何断裂处。换句话说，你可以将元件粘贴到电路板上，或将电线粘在一起，它们在电气功能上仍然可以正常工作。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_74_2.png)


    ### “电线和元件的杂乱无章可能变得非常令人困惑”


    ### 清理整理


    06 你们中的很多人可能还在使用原始的 Model B 树莓派，并且苦于缺少足够的 USB 端口来连接你们想要的所有设备。虽然过去几年的优化有所帮助，但升级到树莓派
    2 基本上解决了所有这些常见问题，因为它提供了功能更强大的硬件供你使用。因此，如果你正在考虑升级，或者终于下定决心要迈出这一步，本实用指南将帮助你打造完美的树莓派
    2 媒体中心（HTPC）。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_77_0.png)


    ### 选择软件


    过去，树莓派 HTPC 只是在 RaspBMC 和 OpenELEC 之间二选一。然而，RaspBMC 目前处于暂停状态，OpenELEC 是你获取最新软件的最佳选择。两者之间没有太大区别，因为它们都运行
    XBMC。


    ### 获取软件


    请访问 openelec.tv 并查找下载部分。有一个专门的树莓派部分，其中分为原始版（ARMv6）树莓派和较新的树莓派 2（ARMv7）。请从该页面为树莓派
    2 抓取映像文件。


