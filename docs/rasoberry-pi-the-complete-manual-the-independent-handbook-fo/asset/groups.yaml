    \    message = ser.readline()\n    print(message)\n    if (message != \"\"):\n\
    \        do_something_useful()\n    time.sleep(0.5)\n```\n\n如图所示，我们导入了 time 模块，以便能够在尝试从串行端口读取之间的循环中休眠。那么向\
    \ Arduino 发送指令呢？这也需要预先上传 Arduino 代码。例如，以下代码将接收一个输入数字并闪烁 LED 该次数：\n\n```cpp\nint\
    \ ledPin = 13;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n\
    }\n\nvoid loop() {\n  if (Serial.available()) {\n    flash(Serial.read() - '0');\n\
