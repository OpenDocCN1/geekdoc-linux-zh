    # Monitor your local network with NagiosPi


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_67_0.png)


    # What you''ll need...


    +   * NagiosPi

    +     * pimylpihu...com/project/nagiospi

    +   * Win32 Disk Imager

    +     * bit.ly/1DM7Tj

    +   * Disk Utility

    +     * bit.ly/1c055

    +   * Internet connection

    +   * 4 GB (or larger) SD card


    # Monitor your local network with NagiosPi


    Embrace the power of Nagios to keep an eye on servers, switches and applications
    on your network


    Is your PC offline? Has your Linux box stopped serving Minecraft or Counter-Strike?
    If you''re out of the house, or even the country, there is no real way of knowing
    without trying to log in - something you probably won''t be able to do without
    being on the premises (unless you''re using remote desktop software).


    A far better way would be to simply receive notifications when your network devices
    are knocked offline, and this is why we turn to NagiosPi, a Raspberry Pi-built
    version of the popular open source network monitoring tool.


    NagiosPi is available as a full image ready to be written to SD card, with the
    real configuration taking place once it''s up and running. Let''s get started.'
  - '[PAGE 68]


    # # Download NagiosPi


    Windows users should write the extracted contents of the NagiosPi_2.4.2.zip file
    to a formatted SD card using Win32 Disk Imager. Linux desktop users can use Disk
    Utility or the command line (file/ls713358). With the image written to SD, safely
    eject the card and insert it into your Pi before booting.


    # ## Log in to NagiosPi


    With most Pi projects, you''ll probably want to operate via SSH, so check your
    router''s list of connected devices to find the Pi''s address and connect. You
    can also use a keyboard and monitor connected to your Raspberry Pi. The default
    username and password for NagiosPi is pi/piwos, pi/parberry.


    # ## Expand the filesystem


    Before proceeding, run `sudo raspi-config`. You''ll need to select the first option,
    Expand Filesystem, and wait a moment as the filesystem is expanded to the full
    size of the SD card. Once done, select Change User Password to add some security
    to your NagiosPi, then select Finish and reboot.


    # ## Open in your browser


    With the Pi rebooted, you will be able to open the NagiosPi website in your browser.
    Visit http://npiwos/Address. Here to see the available options. Here you''ll spot
    a menu of links in the left-look, many of the pages each accormod with the username
    and password to sign in. Start with RaspControl:


    Welcome to NagiosPi v1.1.0

    NagiosPi: Network Monitor with the easy-to-deploy open-source tool to see what''s
    going on with your network. With just Nagios, you can monitor services on a local
    or remote network. This is an open source project from Sapiens AI, NagiosPi is
    designed to be as user-friendly as possible, and the web UI gives you all the
    tools you need to monitor your network in one place.

    Default username and password: pi / piwos


    ### Additional Resources

    * Nagios Wiki

    * Nagios Books

    * Nagios Forums

    * Nagios Blog

    For Additional Details please go to our website: Check Out The Kubuntu.com


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_68_0.png)


    # ### Monitor your NagiosPi box


    In the RaspControl section you''ll get a flavour of just what Nagios can do. On
    the home screen you''ll see general hardware information such as connectivity
    and system status, and as you flick through Details, Services and Disks you see
    what level of monitoring is possible.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_68_1.png)


    # ### View host status


    Next, go to Nagios and pick Hosts. Here you will see the current status for the
    configured hosts, which is a combination of items detected on your local network
    and preset entities. Look for Current Network Status in the upper-left area of
    the console, just below this you will find alternate views.


    # ### Add a host to monitor


    Open NagiCon to add the server you wish to monitor, using the device hostname,
    IP address and alias. Click Submit when done, then switch to Services - Add! where
    you can assign a name and check command (such as check_ping) to monitor.


    # ### Create configuration file


    Each check must be set up individually. Some require the installation of NRE (Nagios
    Remote Plugin Executor) on remote devices to intermingle and present full system
    details, but this isn''t necessary for basic things like ping. When you''re done,
    click Submit, then Generate Nagios Config. Following this, select Deploy.


    # ### Monitor your server


    In the NagiosPi window, select Services for a view of currently monitored servers
    and devices. For each listed device, there will be additional information that
    you''ll find in this column. NagiosPi only shows you the basics of NagiosPi -
    investigation will demonstrate just how powerful it really is!'
