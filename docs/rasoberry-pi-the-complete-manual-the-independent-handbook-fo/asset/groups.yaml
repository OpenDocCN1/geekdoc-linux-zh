    ## Projects


    ### Stream Internet TV to your Pi


    #### What you''ll need...


    - Raspbian Wheezy

    - HDMI cable

    - Monitor


    Stream Internet TV to your Pi: Get your favourite shows and video podcasts streamed
    automatically to your TV with Miro.


    Finding the content you''re interested in viewing can take a while. Whether you''re
    looking for Internet TV stations, video podcasts, audio podcasts or shows syndicated
    online, taking the time to find and download them can be slow going, particularly
    if you have a busy lifestyle. You might even have no time to watch after you''ve
    waited for the download.


    Thanks to the Miro media management software, we can automate all of this, and
    with the software running on a Raspberry Pi, you can easily build a compact system
    for downloading and playing back shows that you have an interest in. We''re talking
    targeted TV on demand, which makes this project ideal for staying up to date with
    particular news and trends on a certain topic.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_101_0.png)


    #### Set up your Pi with Raspbian


    01 Sadly, Miro cannot run on Raspbian Jessie, so make sure you''re using Wheezy,
    available via raspberrypi.org/downloads/raspbian. Ensure your Pi is connected
    to a TV or display via HDMI. As Miro is a desktop application, you''ll need your
    mouse and keyboard connected to configure it.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_102_0.png)


    #### Install Miro


    02 With Wheezy Touched to your SD card and your Pi booted up, open terminal and
    enter:


    ```bash

    sudo apt-get install miro

    ```


    Installation will take a few moments. Once complete, you''ll find Miro in Menu
    > Sound and Video. Click it to get started.


    > Above Miro gives you a decent playback interface and excellent export options
    for converting videos to other formats.


    #### Set Miro to launch at startup


    03 Make sure Miro app is configured to launch at startup. Open ‘User Preferences’
    -> General, and check ‘Automatically run Miro when I log in’ and ‘When starting
    up Miro remember what screen I was on when I last quit’. Also set your Pi to boot
    into X using the raspi-config utility.


    #### Check for content


    04 Switch to the Podcasts tab and place a check in the box labelled ‘Show videos
    from podcasts in the Videos section’. On the right-hand side of the window, set
    your preferred frequency for checking for new content. Miro will poll your favourite
    websites and feeds based on this setting.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_102_1.png)


    Right Playback settings can be altered in the relevant tab when accessing Miro''s
    Preferences


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_103_0.png)


    #### Configure playback settings


    05 Move now to the Playback tab, and check Play media in Miro. This limits reliance
    on other apps, which may drain resources. You should also click the Play video
    and audio items one after another radio button, and under Resume Playback, check
    the first and third items.


    > The more links you add, the more regularly updated content will be downloaded
    to your media manager.


    #### Source videos and podcasts


    06 With Miro now set up and ready to play back the video and audio content that
    you want to enjoy, it''s time to find some! The best way to do this is to just
    check the websites that you regularly use for video and audio podcasts (preferably
    the former) and then copy the XML link.


    #### Add podcast feeds


    07 In Miro, open up File > Add Podcast and then paste the podcast feed URL into
    the dialog that appears, clicking Create Podcast when you''re done. The more links
    you add, the more regularly updated content will be downloaded to your P:Powered
    Miro media manager, ready to watch or listen to on demand.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_104_0.png)


    #### First time use


    08 Remember earlier in the tutorial when we instructed Miro''s to behave in a
    particular way when it launched? It''s time to set that behaviour now.


    The process is started by opening the Videos view in the left-hand pane of the
    Miro window, and then playing the first video. Each time you boot your system,
    Miro will jump to this view and immediately begin playing your content, making
    sure you get up and running quickly and smoothly.


    #### Avoid YouTube


    09 As good a solution as Miro''s is to building a video podcast streaming center,
    displaying material that you''re interested in on demand, it''s sadly just no
    good for videos on YouTube. This doesn''t really restrict you too much as there
    are plenty of other media outlets to cover, but it''s worth mentioning if you''re
    a frequent YouTube watcher. This is a shame, but shouldn''t impact the way you
    use it – your Raspberry Pi now downloads focused content on demand.


    > Above You can subscribe to all sorts of content, from Internet TV channels to
    comedy and news podcasts


    #### Checking for new content


    10 It is tempting to set a regular frequency for your content checking in Files
    » Preferences » Podcasts, but note that checking too regularly is going to result
    in resources being hogged temporarily, which may result in an interruption if
    you happen to be actually watching something when Miro checks for new content.
    Limit polling to hourly or daily checks.


    ---


    ### Make a Pi-powered digital picture frame


    #### What you''ll need...


    - Raspberry Pi 2 or 3 with Raspbian Jessie

    - Wi-Fi dongle (if using Raspberry Pi 2. This section Display recommended)

    - Philips screwdriver

    - Frame and/or stand. Suitable options for the official touchscreen display are
    available at Pimorri and other dedicated Pi hardware and accessory suppliers.

    - Scripts: https://github.com/samuelkay/Raspberry-Pi-Photo-Frame


    Use a Raspberry Pi to create your own fully configurable digital picture frame,
    complete with touchscreen display.


    Digital picture frames that display a selection of your favourite photos were
    quite popular for a time, but are now seemingly available only as free gifts when
    signing up to magazine subscriptions. These tablet-like devices often made for
    interesting talking points, but were often let down by low memory, a poor user
    interface, or both.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_105_0.png)


    We don''t have to worry about either of those problems with this project: Here
    we are going to set up a Raspberry Pi with some photo-displaying software, connect
    a touchscreen display, place it in a suitable stand, and sit back to enjoy the
    results. Better still, with this set-up, we''ll be able to pull images from a
    range of online and offline sources, giving us some great variety.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_106_0.png)


    #### Prepare your Pi


    01 You''ll save a lot of time with this project if you ensure that wireless networking
    is set up, and SSH is enabled. Do that via the Raspberry Pi setup, and you''ll
    find the new Raspberry Pi Configuration utility in Menu > Preferences, where you
    can enable SSH in the Interfaces tab.


    #### Connect the display


    02 With a towel on your desk to avoid scratches, connect the Raspberry Pi to the
    back of the 7" touchscreen Display, ensuring you use the right cables are connected
    correctly. (Older releases require you to also connect and mount the display board.)
    Secure with screws, and then mount in stand.


    > “Set up a Raspberry Pi with some photo-displaying software”


    #### Did you know...


    - List (1) – The Raspberry Pi''s...

    - List (2) – We can use...

    - List (3) – ...is not limited...


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_107_0.png)


    #### Prepare your photos


    03 Naturally, you’ll need a collection of photos to display on the Pi-powered
    digital picture frame. We have different options here (see bonus, page 107) but
    recommend you start with photos stored on your Pi, ones that have been copied
    via USB, via a network drive, or downloaded through your browser.


    #### Set up your Pi picture frame


    04 To configure the Raspberry Pi as a picture frame, we first need to prevent
    the screen from switching off. This means editing the lightdm.conf file.


    ```bash

    sudo nano /etc/lightdm/lightdm.conf

    ```


    Add this line under [SeatDefaults]:


    ```bash

    xserver-command= x -s 0 -dpms

    ```


    When done, save and exit with Ctrl+X, then reboot:


    ```bash

    sudo reboot

    ```


    #### Install feh


    05 Image viewing software feh is the best option for building a simple Pi picture
    frame, so install this.


    ```bash

    sudo apt-get install feh

    ```


    Once installed, instruct feh where to find the images, changing /media/STORAGE/test
    with your directory path, eg:


    ```bash

    DISPLAY=:0.0 XAUTHORITY=/home/pi/.Xauthority /usr/bin/feh -q -r -z -X -B 64 -D
    15.0 /media/STORAGE/test

    ```


    > “Naturally, you’ll need a collection of photos to display on the Pi-powered
    digital picture frame”

    '
