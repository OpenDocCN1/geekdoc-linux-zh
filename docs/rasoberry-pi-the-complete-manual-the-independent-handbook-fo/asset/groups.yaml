    \ with just a set of precision screwdrivers and a little patience.\n\n### Xbox\
    \ Zero arcade\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_119_0.png)\n\n### The\
    \ build\n\n**03** You should be now have a reasonably good idea of the controller\
    \ that we'll be working with. 'The Duke' has dual joysticks, six buttons, a D-Pad\
    \ and two triggers — and it's compatible with most retro games systems.\n\n###\
    \ Fitting\n\n**04** If you're using a different controller, double-check that\
    \ the Pi is likely to fit inside before you crack it open. As you can see, the\
    \ Pi nestles neatly between the triggers of this controller — the original Xbox\
    \ controller is one of the largest.\n\n### Unscrewing\n\n**05** The controller\
    \ is held together by half a dozen cross-head screws. Be careful when opening\
    \ the case so the buttons and rubber contacts are loose within the controller\
    \ — they will spill everywhere!\n\n### Opening\n\n**06** With the shell removed,\
    \ you should be able to spot the screws holding the main circuit board in place.\
    \ There are also a couple of connectors which power the vibration motors — gently\
    \ unclip them in order to completely remove the board. You might find it easier\
    \ to use a pair of pliers for this — just be very gentle as you pull.\n\n### Gently\
    \ does it\n\n**07** You can see for yourself just how well the Pi fits here; it\
    \ can be squeezed under the memory card slot. If you want to hold it firmly in\
    \ place, use some Blu-tack as a temporary card holder. Also, if you're using an\
    \ older controller, it's worth giving it a bit of a clean. Remove the rubber contacts\
    \ and gently swab under them using the isopropyl alcohol wads.\n\n### Cut to fit\n\
    \n**08** Depending on the model of controller you may find that the Pi blocks\
    \ one of the internal plastic struts. The plastic is soft enough that a craft\
    \ knife will easily cut it down to size though. Start with small strokes, shaving\
    \ off a tiny bit at a time until you have enough room. Make sure the plastic dust\
    \ is cleared out before you reassemble the controller. If you have a can of compressed\
    \ air, you can use it to easily blow away the shavings.\n\n### Connecting it up\n\
    \n**09** If you’re using a controller that has a regular USB port on it, you can\
    \ just plug it into the Pi via a USB OTG converter. If you’re using the original\
    \ Xbox Controller, it’s slightly tricky. Microsoft, in its infinite wisdom, has\
    \ decided that the original Xbox should use USB—but, with an incompatible plug\
    \ design. This means, in order to connect the controller to the Pi, we need to\
    \ do some wire stripping. Fun!\n\nThe wiring inside the Xbox controller’s cable\
    \ uses bog-standard USB wiring colours, so once you’ve chopped the plug off the\
    \ controller and the OTG cable, it’s pretty straightforward to connect them together.\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_120_0.png)\n\n- **White**\n  This wire\
    \ is one of two used for differential data signals.\n  This white wire is the\
    \ positive component, and the green wire is the negative one.\n- **Red**\n  The\
    \ red wire is one of two handling power. This one is a 5V power line that provides\
    \ voltage to the circuit.\n- **Green**\n  The circuit can get the difference between\
    \ the two data signals rather than between a single wire and ground—it’s a more\
    \ effective transmission.\n- **Black**\n  This is the other wire associated with\
    \ the power—the ground wire, which is the counterpart to the 5V wire.\n- **Yellow**\n\
    \  USB miniature sockets will also have an additional wire that isn’t required\
    \ for our particular project.\n\nLeft: The older USB 1.0 and 2.0 cables have fewer\
    \ wires than the newer 3.0—here’s a quick guide.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_121_0.png)\n\
    \nAbove You can solder the OTG cable and controller together, but sticky-tape\
    \ will also do the trick.\n\n### The right controller\n\nThe right controller\
    \ is the best choice, which can be found in most shops (we’ve used a standard\
    \ one).\n\n### Wiring\n\n**10** Strip the wires by a couple of centimetres and\
    \ then connect them together. You should have Red, Green, White, and Black. The\
    \ Xbox cable also has a Yellow wire which you can ignore. It is worth noting at\
    \ this point that you need to be sure that you have a USB data transfer cable\
    \ and not just a plain old power cable – the former will look like the photo above,\
    \ but power cables will be missing the two data wires.\n\nWith the wires stripped,\
    \ we temporarily used regular sticky-tape to make the connections between the\
    \ OTG cable and the controller – for a more permanent installation, you can use\
    \ electrical tape or simply solder the wires together.\n\n### Insulation\n\n**11**\
    \ One thing to note you’ll need to insulate the bottom of the Pi against all the\
    \ contacts on the controller. For this quick hack, we’ve used some of the cardboard\
    \ packaging – but any non-conductive material will do.\n\nFrom there, it’s as\
    \ simple as screwing the case back together. Make sure that the controller’s buttons\
    \ and joysticks don’t slip out of alignment. Keep track of which coloured buttons\
    \ go where and you should be fine.\n\n### Wiring up\n\n**12** The Pi will need\
    \ three wires connected to it in order to work. The controller cable needs to\
    \ be connected to the USB OTG port. An HDMI cable goes from your TV to the mini\
    \ HDMI port on the Pi. Finally, a 2A micro-USB power supply needs to be plugged\
    \ into the Pi’s power socket. We’ve used a standard reusable phone charger, but\
    \ you can use a USB battery pack if you want to reduce the mess of wires trailing\
    \ around your room.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_0.png)\n\n\
    ### A word about power\n\n**13** This might seem a little fussy, but it’s possible\
    \ to get the HDMI connection to work without the TV to the controller. Sadly,\
    \ the HDMI specification doesn’t provide power to flow in that direction. If your\
    \ TV has a USB socket on it, you could use that to supply the Pi with power –\
    \ just make sure the socket is powerful enough for a Pi (needs at least 1 Amp,\
    \ and ideally 2 Amps). Many TVs will only output 500mA which isn’t enough to run\
    \ the Pi.\n\n### Let’s play!\n\n**14** Okay, it’s looking good – you’re nearly\
    \ ready to play. The next step is to get some emulation software on this thing.\n\
    \n> “If your TV has a USB socket, you could use that to supply the Pi with power\
    \ – just make sure it’s powerful enough”\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_1.png)\n\
    \n## Installing the RetroPie emulator\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_123_0.png)\n\
    \nIt's not as difficult as you might think to run retro software through an emulator.\n\
    \nRight, so you've managed to get your Pi safely ensconced in a controller and\
    \ all wired up – all you need now are some video games to play.\n\nFor this section\
    \ of the tutorial we're going to be using the RetroPie emulator. By the end of\
    \ this tutorial, you'll be able to play a number of games directly from your Raspberry\
    \ Pi, provided that you legally own the ROM files, of course.\n\nThe whole process\
    \ is as easy as installing the software onto your SD card and then copying across\
    \ any games that you want to play. If you've already got Raspian installed on\
    \ your Pi, you can install RetroPie alongside it – or you can dedicate the whole\
    \ disk to the software if you'd rather.\n\n### Install RetroPie inside Raspbian\n\
    \n1. If you've already started using your Pi and want to add RetroPie to it, you'll\
    \ need to install the software from GitHub. The latest instructions can be found\
    \ at [github.com/RetroPie/RetroPie-Setup](https://github.com/RetroPie/RetroPie-Setup).\
    \ Open up a terminal on your Pi (for example, by SSH-ing into it from another\
    \ machine or by logging in directly to the Pi). Update your repositories and make\
    \ sure the latest version of the Git software is installed:\n\n```\nsudo apt-get\
    \ update\nsudo apt-get upgrade\nsudo apt-get install git\n```\n\nDownload the\
    \ latest version of the RetroPie setup script:\n\n```\ngit clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git\n\
    ```\n\nIf you're security-conscious, it's a good idea to check what the script\
    \ does before running it. Once you're ready, you can install it by changing into\
    \ the correct directory and executing the script:\n\n```\ncd RetroPie-Setup\n\
    sudo ./retropie_setup.sh\n```\n"
  mdcn: "\n## 许多小零件\n\n有着塑料外壳和一堆小零件，Xbox 手柄摸起来可能……显得单薄且脆弱。好消息是：该手柄相当易于维修。就像我们老派的家用游戏机一样，其电路板由塑料卡扣固定，内部接线也相对容易追踪。不过，主要问题在于按钮的数量。打开手柄时，像十字方向键（D-Pad）按钮这样的小零件很容易放错位置——因此请注意每个组件是如何就位的。务必记录下你沿途拆下的每一颗小螺丝。你只需要一套精密螺丝刀和一点耐心，就应该能够重新组装好整个装置。\n\
    \n### Xbox Zero 街机\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_119_0.png)\n\n\
    ### 构建\n\n**03** 此时你应该已经对我们将使用的手柄有了相当清晰的了解。“公爵”（The Duke，此处指代该型号）拥有双摇杆、六个按钮、一个十字方向键和两个扳机键——并且与大多数复古游戏系统兼容。\n\
    \n### 适配\n\n**04** 如果你使用的是其他手柄，请在拆开之前仔细检查 Pi 是否可能适合放在内部。正如你所见，Pi 可以完美地嵌在这个手柄的扳机键之间——原始\
    \ Xbox 手柄是最大的之一。\n\n### 拆卸螺丝\n\n**05** 该手柄由六个十字螺丝固定。打开外壳时要小心，以免按钮和橡胶触点在控制柄内部松动——它们会到处乱飞！\n\
    \n### 打开\n\n**06** 取下外壳后，你应该能找到固定主电路板的螺丝。还有几个连接器为振动电机供电——轻轻将它们卡扣松开，以便完全取下电路板。你可能会发现使用一把钳子更容易操作——但拉动时务必非常轻柔。\n\
    \n### 轻拿轻放\n\n**07** 你可以亲眼看到 Pi 在这里的契合度有多高；它可以被塞进记忆卡插槽下方。如果你想将其牢固地固定在位，可以暂用蓝丁胶（Blu-tack）作为临时卡扣。此外，如果你使用的是较旧的手柄，值得给它做一次清洁。取下橡胶触点，并用异丙醇棉球轻轻擦拭触点下方。\n\
    \n### 裁剪适配\n\n**08** 根据手柄型号的不同，你可能会发现 Pi 阻挡了其中一个内部塑料支撑柱。塑料足够软，美工刀可以轻松将其裁剪到合适大小。从小切口开始，每次削去一点点，直到腾出足够的空间。重新组装手柄前，请确保清除塑料碎屑。如果你有一罐压缩空气，可以轻松吹走碎屑。\n\
    \n### 连接\n\n**09** 如果你使用的手柄带有标准 USB 接口，你只需通过 USB OTG 转换器将其插入 Pi。如果你使用的是原始 Xbox\
    \ 手柄，情况会稍微复杂一点。微软以其无限智慧决定原始 Xbox 应使用 USB——但采用的是不兼容的插头设计。这意味着，为了将手柄连接到 Pi，我们需要进行一些剥线工作。有趣吧！\n\
    \nXbox 手柄线缆内部的接线使用标准的 USB 接线颜色，因此一旦你切下手柄和 OTG 线缆的插头，将它们连接起来就相当简单了。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_120_0.png)\n\
    \n- **白色**\n  这根线用于差分数据信号的其中一根。\n  白色线是正极分量，绿色线是负极分量。\n- **红色**\n  红色线用于供电的两根线之一。这是一根\
    \ 5V 电源线，为电路提供电压。\n- **绿色**\n  电路可以通过两根数据信号之间的差异，而不是单根线与地之间的差异来获取信号——这是一种更有效的传输方式。\n\
    - **黑色**\n  这是与电源相关的另一根线——地线，它是 5V 线的对应线。\n- **黄色**\n  USB 迷你接口还将包含一根额外的线，对于我们的特定项目而言并非必需。\n\
    \n左：旧版 USB 1.0 和 2.0 线缆比新版 3.0 的线更少——这里是一个快速指南。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_121_0.png)\n\
    \n上方：你可以焊接 OTG 线缆和手柄，但用胶带也可以完成这项工作。\n\n### 选择合适的手柄\n\n右侧手柄是最佳选择，在大多数商店都能找到（我们使用的是标准款）。\n\
    \n### 接线\n\n**10** 剥去电线约两厘米，然后将它们连接在一起。你应该会有红、绿、白和黑四种线。Xbox 线缆还有一根黄线，你可以忽略它。此时值得注意的是，你需要确定你使用的是\
    \ USB 数据传输线，而不仅仅是普通的电源线——前者看起来像上面的照片，但电源线将缺少两根数据线。\n\n剥好线后，我们临时使用普通胶带在 OTG 线缆和手柄之间制作连接——为了更永久性的安装，你可以使用电工胶带或简单地焊接电线。\n\
    \n### 绝缘\n\n**11** 需要注意的是，你需要对 Pi 的底部进行绝缘，以隔离手柄上的所有触点。对于这个快速改装，我们使用了一些纸板包装——但任何不导电的材料都可以。\n\
    \n从此开始，只需将外壳螺丝拧回即可。确保手柄的按钮和摇杆没有错位。注意不同颜色的按钮对应的位置，你就没问题了。\n\n### 接线连接\n\n**12**\
    \ Pi 需要连接三根线才能工作。控制柄线缆需要连接到 USB OTG 端口。一根 HDMI 线从你的电视连接到 Pi 上的 mini HDMI 端口。最后，需要一个\
    \ 2A 微型 USB 电源插入 Pi 的电源插座。我们使用了标准的可重复使用手机充电器，但如果你想减少房间里拖拽杂线的麻烦，也可以使用 USB 电池组。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_0.png)\n\n### 关于供电的话\n\n**13**\
    \ 这看起来可能有点挑剔，但如果没有电视为手柄供电，HDMI 连接也能工作。不幸的是，HDMI 规范并不支持电流向该方向流动。如果你的电视上有 USB 插座，你可以用它为\
    \ Pi 供电——只需确保插座功率足够（至少需要 1 安培，理想情况下是 2 安培）。许多电视仅输出 500mA，不足以运行 Pi。\n\n### 让我们玩吧！\n\
    \n**14** 好的，看起来不错——你差不多准备好开始游戏了。下一步是在设备上安装一些模拟软件。\n\n> “如果你的电视上有 USB 插座，你可以用它为\
    \ Pi 供电——只需确保它功率足够”\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_122_1.png)\n\n\
    ## 安装 RetroPie 模拟器\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_123_0.png)\n\n\
    通过模拟器运行复古软件并不像你想象的那么难。\n\n好吧，你已经成功地将 Pi 安全地安置在一个手柄中并接好线——现在你只需要一些视频游戏来玩了。\n\n\
    在本教程的这一部分，我们将使用 RetroPie 模拟器。通过本教程，你将从树莓派（Raspberry Pi）直接游玩多款游戏，前提是你合法拥有 ROM 文件，当然。\n\
    \n整个过程很简单，只需将软件安装到你的 SD 卡上，然后复制你想玩的任何游戏即可。如果你已经在 Pi 上安装了 Raspian，你可以与 RetroPie\
    \ 并行安装——或者如果你愿意，也可以将整个磁盘专门用于该软件。\n\n### 在 Raspbian 中安装 RetroPie\n\n1. 如果你已经开始使用\
    \ Pi 并想添加 RetroPie，你需要从 GitHub 安装软件。最新的说明可在 [github.com/RetroPie/RetroPie-Setup](https://github.com/RetroPie/RetroPie-Setup)\
    \ 找到。在你的 Pi 上打开一个终端（例如，从另一台机器通过 SSH 登录，或直接登录到 Pi）。更新你的软件仓库并确保安装了最新版本的 Git 软件：\n\
    \n```\nsudo apt-get update\nsudo apt-get upgrade\nsudo apt-get install git\n```\n\
    \n下载 RetroPie 设置脚本的最新版本：\n\n```\ngit clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git\n\
    ```\n\n如果你注重安全性，最好在运行脚本之前检查一下脚本的功能。准备好后，你可以通过切换到正确目录并执行脚本来安装它：\n\n```\ncd RetroPie-Setup\n\
    sudo ./retropie_setup.sh\n```\n\n"
