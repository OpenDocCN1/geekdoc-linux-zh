    \ 街机\n  将你的 Pi Zero 变成控制台控制器组合\n\n> “一旦你熟悉了基础知识，你可以用树莓派实现的目标几乎没有限制”\n\n# 树莓派 3\n\
    \n一款超充能的树莓派，终于实现了你想要的所有功能，且价格与前几代型号完全相同\n\n尽管树莓派已经享受了多年的成功，但始终有一些用户渴望的东西。一个稍强的\
    \ CPU，可以处理日常计算；更多的 USB 端口；也许还有无线功能，使网络连接更容易。\n\n树莓派 3 解决了这些问题。由于它使用与 Model B+\
    \ 相同的板子设计，因此拥有四个 USB 端口，而最初的树莓派 Model B 只有两个。更重要的是，它拥有更强大的处理器和更多的 RAM，使其比最初的 Pi\
    \ 快十倍。Pi 3 还增加了内置的无线功能，这使得连接 Wi-Fi 和蓝牙变得轻而易举。\n\n新的 BCM2837 芯片是树莓派 3 的核心，它是旧树莓派\
    \ 2 中 BCM2836 芯片的修改版本。四核处理器从 900 MHz 进一步提升至 1,200 MHz，这一“野兽”般的性能提升有助于使 Pi 3 成为功能更强大的板卡。以前你可能在浏览互联网或编写文档时会遇到困难，现在\
    \ Pi 3 可以轻松自如地处理这些任务，并保留充足的处理器余力。\n\n然而，从根本上说，它仍然是与树莓派 B+ 相同的板卡。除了上述四个 USB 2.0\
    \ 端口外，还有用于有线互联网的以太网端口，高品质的 3.5mm 耳机插孔用于声音，用于数字视频和音频的 HDMI 端口，以及一个 40 针的 GPIO 端口。这个扩展的\
    \ GPIO 端口对于制作更复杂、更酷的物理项目来说非常棒。\n\n对于那些担心兼容性的用户来说，你所有的旧文件和项目在树莓派 3 上都能正常工作，你只需要像传输普通文件一样将它们迁移过来即可。\n\
    \n"
