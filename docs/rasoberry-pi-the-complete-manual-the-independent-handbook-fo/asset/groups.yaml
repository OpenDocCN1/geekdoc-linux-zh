    \ incredibly useful tool – which the Raspberry Pi can do for a fraction of the\
    \ cost. All you'll need is a Raspberry Pi (the newer the better), and a USB webcam\
    \ or the PiCam (the NoIR infrared version is even more suited to nighttime use),\
    \ and a device to view the streamed footage on.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_95_0.png)\n\
    \n### Survey the bedroom\n\nBefore you start installing and configuring your Pi,\
    \ head to the baby’s bedroom and take a look around. Where will you be placing\
    \ the Raspberry Pi? Is it within reach of a power source? Do you need to connect\
    \ an Ethernet cable, or is the wireless signal strong enough? It’s vital at this\
    \ stage to spend the necessary time planning the Pi’s position in relation to\
    \ power sources and network connectivity.\n\n### Enable the camera\n\nIf you’re\
    \ using the PiCam, this can be disabled by default. You can enable it in the raspi-config\
    \ tool. This can be accessed in the GUI by opening Menu > Preferences > Raspberry\
    \ Pi Configuration, where you should select the Interfaces tab and switch Camera\
    \ to Enabled. Alternatively run `sudo raspi-config` and choose option 6, Enable.\
    \ For USB webcams, use:\n\n```bash\nsudo apt-get install fswebcam\n```\n\nAnd\
    \ test with:\n\n```bash\nfswebcam shot.png\n```\n\n### Test the camera\n\nYou\
    \ don’t want to set this project up to find that the camera doesn’t actually work.\
    \ Whether you’re using a USB webcam or the PiCam, you’ll need to run a command\
    \ to test the camera.\n\nTo confirm, use the GUI to browse to `/home/pi` and view\
    \ the `image.jpg` file.\n\nThis is preferable to checking in the command line,\
    \ as you can ensure the image is not corrupt.\n\n### Install motion\n\nThe motion\
    \ capture software, motion, can be installed after an update and upgrade of the\
    \ Raspberry OS.\n\n```bash\nsudo apt-get update\nsudo apt-get upgrade\nsudo apt-get\
    \ install motion\n```\n\nOlder versions of motion will not start automatically,\
    \ and display the “Not starting motion daemon” error message. To avoid this, you\
    \ need to make sure you run the update and upgrade commands. If you’re using the\
    \ PiCam module, you’ll also need a driver:\n\n```bash\nsudo apt-get install motion\
    \ libcamera-client0.1 libcamera0.1\n```\n\n### Activate PiCam driver\n\nTo activate\
    \ the PiCam driver, you need to enter the following command:\n\n```bash\nsudo\
    \ modprobe brcm2835-v4l2\n```\n\nThis enables the PiCam to communicate with third\
    \ party apps, such as motion. However, if you reboot, unless you add it to `/etc/rc.local`:\
    \ Open the file in `/etc`\n\n```bash\nsudo nano /etc/rc.local\n```\n\nFind an\
    \ empty line before exit \"0\" and enter:\n\n```bash\nmodprobe bcm2835-v4l2\n\
    ```\n\nThen Ctrl+\\* to exit, and Y to save.\n\n### Auto-start motion\n\nBegin\
    \ by opening the `motion` configuration file.\n\n```bash\nsudo nano /etc/default/motion\n\
    ```\n\nHere, we need to instruct the software to start each time the Raspberry\
    \ Pi boots. Find the value 'daemon off', and change it to read:\n\n```bash\ndaemon\
    \ on\n```\n\nHit Ctrl+\\* to exit, tapping Y to confirm you wish to save the file,\
    \ and Enter to continue. Next, confirm the motion daemon works on a reboot by\
    \ restarting your Pi:\n\n```bash\nsudo reboot\n```\n\n### Configure motion\n\n\
    The next step is to configure the motion software. This means setting the frame-rate\
    \ (how often an image is captured), image dimensions (bigger images will take\
    \ up more resources, thereby slowing the monitor) and setting the video format!\
    \ How you configure motion really depends on which model of Raspberry Pi you will\
    \ be using for this project. First generation devices will\n"
  mdcn: "\n## 启动 Web 服务器\n\n既然我们已经配置好了若干电台，现在就可以从 pyPlaylist 目录运行 Web 服务器了。然后打开一个\
    \ Web 浏览器开始播放电台。以下命令将显示树莓派上的 IP 地址：\n\n```bash\n$ ./raspbian_get_ip.sh\n192.168.0.20\n\
    ```\n\n知道 IP 地址后，请在 Web 浏览器中通过 5000 端口连接到该 URL，即\n\n```text\nhttp://192.168.0.20:5000/\n\
    ```\n\n## 添加自定义音乐播放列表\n\n现在，在 /var/lib/mpd/music/ 目录下创建一个包含你音乐文件的子目录，并确保 mpd/audio\
    \ 拥有读取该目录的权限。然后更新 mpd 的数据库，清空当前播放列表，并添加新目录 (/ambient) 中的所有曲目。最后将其保存为新播放列表。\n\n\
    ```bash\nmpc update\nmpc clear\nmpc ls ambient | mpc add\nmpc save ambient\n```\n\
    \n## 收尾工作\n\n现在你的音乐播放器已经可以正常工作了，剩下的显然就是添加一些扬声器了！几乎任何带有 RCA 或 3.5mm 输入源的设备都可以实现这一目的。这部分我们将留给你自行决定。\n\
    \n若要在此完整查看代码，请访问 https://bit.ly/290a9mH。 尽情享受音乐吧！\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_92_0.png)\n\
    \n> “既然我们已经配置好了若干电台，现在就可以从 pyPlaylist 目录运行 Web 服务器了。然后打开一个 Web 浏览器开始播放电台”\n\n\
    ## 延时摄影触发器\n\n**你需要准备的物料...**\n\n- 最新树莓派镜像 www.raspberrypi.org/raspbianpi\n- 面包板\n\
    - 连接器\n- 跳线\n- 单反相机\n- 兼容的快门线\n\n*有了我们的专业建议，使用单反相机拍摄延时视频将变得轻而易举*\n\n你可能会认为，像 Vincent\
    \ Laforet (www.laforetvisuals.com) 或 John Ellund (www.theartofrtimeapse.com) 那样制作令人着迷的延时视频，对于普通人来说可能遥不可及。不过，借助树莓派和少量的\
    \ Python 代码，情况不再如此。在本指南中，我们将触发单反相机来创建像素级完美的延时影像...\n\n### 设置树莓派\n\n在本教程中，我们假设你使用的是最新版本的树莓派。在树莓派上设置好键盘、鼠标和显示器后，打开终端并输入：\n\
    \n```bash\nsudo apt-get update\n```\n\n### 安装 RPi.GPIO 库\n\n接下来，我们需要确保开发环境已设置好。按照以下步骤确保终端中的设置完成：输入\n\
    \n```bash\nsudo apt-get install python-dev\nsudo apt-get install rpi-gpio\n```\n\
    \n### 设置 Pi Cobbler\n\n在本教程中，我们使用了一块廉价的实验面包板和一块 Adafruit Pi Cobbler，以便轻松访问树莓派的\
    \ GPIO 引脚。如图所示，Cobbler 横跨面包板的中心点，并用一根排线连接两者。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_93_0.png)\n\
    \n### 完整代码列表\n\n```python\nimport RPi.GPIO as GPIO\nimport time\n\nprint \"Welcome\
    \ to the Complete Manual Time-Lapse Tool.\"\nprint \"Just tell us how many shots\
    \ you'd like to take and the interval between them.\\n\"\nprint \"Try googling\
    \ 'time-lapse interval calc' if you need help deciding.\\n\"\n\ndef main():\n\
    \    shots = raw_input(\"How many shots would you like to take?\\n ->\")\n   \
    \ interval = raw_input(\"How frequently do you want to take them (in seconds)?\\\
    n ->\")\n\n    if shots.isdigit() and interval.isdigit():\n        shots = int(shots)\n\
    \        interval = int(interval)\n\n        print \"You'll be shooting for %d\
    \ minutes.\" % ((shots * interval) / 60)\n        answer = raw_input(\"Are you\
    \ ready to proceed? (yes/no): \")\n        confirm = answer.lower() in ['yes',\
    \ 'y']\n        if confirm:\n            GPIO.setmode(GPIO.BOARD)\n          \
    \  GPIO.setup(16, GPIO.OUT)\n            taken = 1\n            print \"Starting\
    \ a run of %d shots\" % (shots)\n            for i in range(0, shots):\n     \
    \           print\n                print \"Shot %d of %d\" % (taken, shots)\n\
    \                taken += 1\n                GPIO.output(16, GPIO.HIGH)\n    \
    \            time.sleep(0.5)\n                GPIO.output(16, GPIO.LOW)\n    \
    \            time.sleep(interval)\n            GPIO.cleanup()\n        else:\n\
    \            print \"Let's try again (or press Ctrl + C to end)\"\n          \
    \  quit()\n    else:\n        print \"Oops - You can only enter numbers. Let's\
    \ try again!\"\n        main()\n\n    print\n    print \"Thanks for using the\
    \ Complete Manual Time-lapse Tool!\\n\"\n    again = raw_input(\"Would you like\
    \ to do another time-lapse? (yes/no): \")\n    proceed = again.lower()\n    if\
    \ proceed in ['yes', 'y']:\n        main()\n    else:\n        print \"See you\
    \ next time!\\n\"\n        quit()\n\nif __name__ == \"__main__\":\n    main()\n\
    ```\n\n### 手动对焦\n\n我们不会用 Python 应用程序控制自动对焦，因此请在拍摄前将对焦设置为手动，并提前选择好相机设置。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_94_0.png)\n\
    \n### 2.5mm 转 3.5mm\n\n我们在相机和音频线之间使用了一根短（约 10-20cm）的 3.5 转 2.5mm 插头。值得注意的是，3.5mm\
    \ 转 2.5mm 的线缆很难找到，但你可以从任何在线电子商店购买到。此线缆允许相机接收来自音频插头的信号以触发快门。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_94_1.png)\n\
    \n### Pi Cobbler\n\n我们使用 Pi Cobbler 作为树莓派 GPIO 引脚的扩展板，以简化搭建过程，尽管它并非必需。\n\n###\
    \ 配置面包板\n\n为了让树莓派的 GPIO 控制相机，我们需要在 GPIO（在此情况下是 40 针 GPIO 上的第 23 针，即实际物理引脚 16）与连接相机线缆头部或尾部以触发快门的引脚之间连接一根短线。连接器的底部始终为地线，因此请确保将\
    \ Cobbler 上的 GND 引脚和音频插头的中间引脚接地。完成电路后，我们可以专注于代码了。\n\n### 延时摄影工具\n\n我们创建了一个名为 Linux\
    \ 用户延时摄影工具的小型 55 行 Python 实用程序，它充当相机遥控器。它接收命令并用于触发树莓派的相机，使用 GPIO 引脚 16 关闭相机。你不需要在现场使用该项目。我们建议使用\
    \ Android 应用程序“Connect to the Pi”通过手机使用该工具，并且你不需要 SD 卡。编写完成后，你可以使用命令 `sudo python\
    \ time_lapse_camera.py` 启动你的脚本。\n\n### 创建视频\n\n相机打包并准备就绪后，我们可以收集图像并将其输出到视频文件中。在此示例中，我们创建了一段视频，展示了安装在花园中间三脚架上的树莓派相机，前端加了一个小镜头以营造广角镜头的效果。此处展示了组装图像和\
    \ `image001.jpg` 文件的代码。最终视频是 `lapse.avi`，你可以使用媒体播放器打开它。\n\n## 使用树莓派婴儿监视器获取警报\n\
    \n**你需要准备的物料...**\n\n- Wirehark www.wirehark.org\n- PiCam 模块或 USB 网络摄像头\n\n在你的小宝贝睡觉时，借助树莓派密切关注他们！\n\
    \n当你坐下来享受连续剧时，脑海里总有一丝不安——宝宝还好吗？我们需要依靠婴儿监视器，特别是视频监视器，尤其是那些可以通过应用程序或在移动浏览器中打开 IP\
    \ 地址来显示画面的监视器。再加上一些运动检测和警报软件，你就拥有了一个极其有用的工具——而树莓派可以以极低的成本实现这一功能。你只需要一台树莓派（越新越好）、一个\
    \ USB 网络摄像头或 PiCam（NoIR 红外版本更适合夜间使用），以及一台用于查看流媒体画面的设备。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_95_0.png)\n\
    \n### 勘察卧室\n\n在开始安装和配置树莓派之前，请前往婴儿房四处看看。你将把树莓派放在哪里？它是否在电源可触及的范围内？你需要连接以太网线，还是无线信号足够强？在此阶段，花费必要的时间规划树莓派相对于电源和网络连接的位置至关重要。\n\
    \n### 启用摄像头\n\n如果你使用的是 PiCam，它默认可能是禁用的。你可以在 raspi-config 工具中启用它。通过 GUI 可以访问该工具：打开菜单\
    \ > 首选项 > 树莓派配置，在那里你应该选择“接口”标签页并将“摄像头”切换为“启用”。或者运行 `sudo raspi-config` 并选择选项 6（启用）。对于\
    \ USB 网络摄像头，请使用：\n\n```bash\nsudo apt-get install fswebcam\n```\n\n并使用以下命令测试：\n\
    \n```bash\nfswebcam shot.png\n```\n\n### 测试摄像头\n\n你不想设置好项目后才发现摄像头实际上无法工作。无论你使用的是\
    \ USB 网络摄像头还是 PiCam，你都需要运行一个命令来测试摄像头。\n\n为了确认，请使用 GUI 浏览到 `/home/pi` 并查看 `image.jpg`\
    \ 文件。\n\n这比在命令行中检查更好，因为你可以确保图像没有损坏。\n\n### 安装 motion\n\n运动捕捉软件 motion 可以在更新和升级树莓派操作系统后安装。\n\
    \n```bash\nsudo apt-get update\nsudo apt-get upgrade\nsudo apt-get install motion\n\
    ```\n\n旧版本的 motion 不会自动启动，并显示“Not starting motion daemon”错误消息。为了避免这种情况，你需要确保运行更新和升级命令。如果你使用的是\
    \ PiCam 模块，你还需要一个驱动程序：\n\n```bash\nsudo apt-get install motion libcamera-client0.1\
    \ libcamera0.1\n```\n\n### 激活 PiCam 驱动程序\n\n要激活 PiCam 驱动程序，你需要输入以下命令：\n\n```bash\n\
    sudo modprobe brcm2835-v4l2\n```\n\n这使 PiCam 能够与第三方应用程序（如 motion）通信。但是，如果你重启系统，除非你将其添加到\
    \ `/etc/rc.local` 中：在 `/etc` 中打开该文件\n\n```bash\nsudo nano /etc/rc.local\n```\n\
    \n找到 `exit \"0\"` 之前的一个空行并输入：\n\n```bash\nmodprobe bcm2835-v4l2\n```\n\n然后按 Ctrl+\\\
    * 退出，并按 Y 保存。\n\n### 自动启动 motion\n\n首先打开 `motion` 配置文件。\n\n```bash\nsudo nano\
    \ /etc/default/motion\n```\n\n在这里，我们需要指示软件在树莓派每次启动时都启动。找到值 'daemon off'，并将其更改为：\n\
    \n```bash\ndaemon on\n```\n\n按 Ctrl+\\* 退出，按 Y 确认保存文件，然后按 Enter 继续。接下来，通过重启树莓派来确认\
    \ motion 守护程序在重启后正常工作：\n\n```bash\nsudo reboot\n```\n\n### 配置 motion\n\n下一步是配置\
    \ motion 软件。这意味着设置帧率（图像捕获频率）、图像尺寸（较大的图像将占用更多资源，从而减慢监视器速度）以及设置视频格式！你如何配置 motion\
    \ 实际上取决于你将在该项目中使用哪种型号的树莓派。第一代设备将\n\n"
