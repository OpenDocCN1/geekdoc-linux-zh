    card and go through the basic setup process, making sure to enable SSH in the
    advanced options and to disable the desktop.


    # Remote access


    +   02 Type ifconfig into your Pi''s command line to find the IP address. At this
    point you can unplug the monitor and set it up remotely, but either way you can
    now access the Pi by typing:


    ```

    $ ssh [user]@[IP address]

    ```


    - and entering your password to log in.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_1.png)


    > "The Raspberry Pi makes for a great tiny, low-wattage, always-on torrent box
    to better manage your files"'
  - '[PAGE 100]


    # Mount hard drive


    03 Unless you plan to reformat your portable drive, you''ll need to install NTFS
    support onto your Pi. **Type in:**


    ```

    $ sudo apt-get install ntfs-3g

    ```


    Add the hard drive to /etc/fstab (open it with sudo nano /etc/fstab) by adding
    the line.


    ```

    /dev/[hard drive address]

    [mount point] auto_nofail rw 0 0


    Use fdisk to find the name of the instance, and /dev/sdz mount (for example, /dev/sdz)
    such as /home/pi/torrents with mount point, then /dev/sdzz to mount /dev/sdz /home/pi/torrents
    with mount


    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_0.png)


    # Install Deluge


    04 We''ll use Deluge for our torrents. Install it with:


    ```

    $ sudo apt-get install

    deluge-console

    ```


    Now start and then stop Deluge so it creates a config file we can edit with:


    ```

    $ deluge

    $ sudo pkill deluged


    And finally, run the following to copy the config file in case we mess up:

    $ cp ~/.config/deluge/auth --config/

    deluge/default

    ```


    # Basic configuration


    05 Edit the file with:


    ```

    $ sudo nano ~/.config/

    deluge/auth


    And add to the bottom:

    [username]:[password]:10

    ...

    ...

    to restrict access.

    Now start it up with:

    $ deluge-console

    ```


    pi@raspberrypi:

    # Free-Web-Server-Guide: $ sudo /etc/init.

    [infox] /etc/default/deluge

    sudo /etc/init/deluge-daemon.conf

    $ echo ''sudo /etc/init.d/deluge-daemon start''


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_1.png)


    # Remote connection


    06 Now you''re in the client, **Type the following three commands:**


    ```

    config -s allow_remote True

    config allow_remote

    exit

    ```


    Start the Deluge daemon with:

    $ sudo pkill deluged &

    deluged

    Now open the graphical client on your main PC.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_2.png)


    # Remote interface


    07 Go to Edit>Preferences> **Preferences** and select Classic Mode and restart
    Deluge. Click Add on the Connection Manager, and enter the IP in Hostname. Click
    Connect to see any torrents you have downloading or uploading.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_3.png)


    # Download location


    08 Go to Edit again and then **Preferences**, and change to the Downloads tab
    if it''s not on there already. Set the download location to the directory we mounted
    the hard drive to, and enable Auto add torrents; setting it to any destination
    you plan to dump torrents to the hard drive.


    # Start on boot


    09 An init script from Ubuntu can be used to have Deluge start on boot. Download
    it with:

    $ sudo wget -O /etc/default/deluge-daemon https://bit.ly/1zNXKiz

    Open /etc/default/deluge-daemon with nano and change the username to the one we
    set up earlier. Save it, then download the full init script and update with:

    $ sudo wget -O /etc/init.d/deluge-daemon https://bit.ly/1s8d76s

    $ sudo chmod 755 /etc/init.d/deluge-daemon

    $ sudo update-rc.d deluge-daemon defaults'
  md: "\n## Projects\n\nStill handle low-resolution images comfortably for a real-time\
    \ feed, you should probably use the Raspberry Pi 3.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_0.png)\n\
    \n### Edit the config file\n\n08 To begin configuration, just open motion.conf:\n\
    ```sudo nano /etc/motion/motion.conf```\n\nUse the CTRL+AW shortcut to open search,\
    \ find each of the following conditions, adding the values as specified:\n```\n\
    daemon on\nframerate 2\nwidth 640\nheight 480\nffmpegvideo_codecs mpeg4\nstream_localhost\
    \ off\ncontrol_localhost off\n```\n\nIf you're recording in a dark room, you can\
    \ adjust the brightness and contrast. With the changes made, hit CTRL+W to exit,\
    \ confirming with Y and Enter.\n\n### Assign ownership to target directory\n\n\
    09 You may find that the camera stops streaming images after a short time. This\
    \ is a permissions issue, one that causes a few images to appear on your screen\
    \ before the whole thing comes to a stop. Overcome this with:\n```sudo chown motion:\
    \ /var/lib/motion```\n\nYou can also set a custom file path in motion.conf. Look\
    \ for target_dir and change as appropriate. Remember to save the file and restart\
    \ motion when you're done.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_1.png)\n\
    \n### Start and test your baby monitor\n\n10 We now almost have a fully working\
    \ baby monitor. At this stage, all that is left to get the baby monitor set up\
    \ and running is to launch the motion:\n```sudo service motion start```\n\nYou\
    \ should be able to browse to the feed by entering the IP address of your Raspberry\
    \ Pi in a mobile browser. This should typically be something like 192.168.0.10:8081\n\
    \nCheck this on multiple devices on your home network to confirm that it works.\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_2.png)\n\n### Adjust motion detection\n\
    \n11 It's motion detection that will do the bulk of the work in a baby monitor\
    \ setup. To alter the sensitivity, you need to adjust this for the environment\
    \ you have set up in the baby monitor set up in, open:\n```sudo nano /etc/motion/motion.conf```\n\
    \nAnd use CTRL+AW to search for \"Motion Detection Settings\".\nHere you'll find\
    \ various conditions with values that you can adjust, such as threshold and area_detect_value.\
    \ These will require some patient tweaking for the best results.\n\n### Make motion\
    \ beep\n\n12 To aid in tweaking the detection, you can enable a beep to sound\
    \ when movement is captured. As a project this needs some calibration to get the\
    \ best results, this is a useful feature. Again, this setting is found in motion.conf.\
    \ Search for \"quiet on\" and change the setting to read:\n```\nquiet off\n```\n\
    \nRemember to undo this when you're happy with the motion capture, as it may disturb\
    \ the little one!\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_3.png)\n\n###\
    \ Adjust image quality\n\n13 While you can alter dimensions of the images captured\
    \ by the PiCam board, it's important to be careful with the figures you enter\
    \ in motion.conf. For instance, a dimension of 133x342 pixels probably won't work.\
    \ Dimensions need to be multiples of 4. For larger options, look at 1280x800 or\
    \ 1920x1080.\nNot only will larger images impact bandwidth, they'll make the resulting\
    \ AVI file larger.\n\n### Get alerts with the Raspberry Pi baby monitor\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_98_0.png)\n\
    \n```\ntail -f /var/log/syslog\n```\nand\n```\ndmesg | tail\n```\n\nThis will\
    \ display any issues that the process is currently having, which is intended to\
    \ (and hopefully will!) help you diagnose and resolve any problems.\n\nMost issues\
    \ will be driver-related, so keep this in mind with USB webcams. Press CTRL+Z\
    \ to end.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_98_1.png)\n\n### Check saved\
    \ images\n\n14. To confirm the quality of the images captured by the Raspberry\
    \ Pi baby monitor, boot into the GUI (or install tightv server and remote connect)\
    \ and browse to /var/lib/motion to see how they are turning out. This should give\
    \ you the info you need to adjust the dimensions of the captured images.\n\n###\
    \ Troubleshoot camera connectivity\n\n15. There’s no guarantee that motion will\
    \ work straight away. If no images are found, or you can’t connect to the stream,\
    \ run:\n\n### Name your images\n\n16. Images collected by the motion software\
    \ can be configured with a specific naming convention, based on date and time.\n\
    \nYou can find these listed under target_base_directory in motion.conf. For instance,\
    \ you can specify a folder for new images, based on date:\n```\ntarget_base_directory\
    \ ~/pic%Y%m%d%H%M%S-%t\n```\nNote the “%” — both directory and images will be\
    \ named according to date, with images also labelled with the timestamp.\n\n###\
    \ Go beyond your home network\n\n17. Wouldn’t it be great to monitor your child’s\
    \ sleep from your favourite restaurant? You can do this by installing the No-IP\
    \ software on your Raspberry Pi.\n\nThis software enables you to get around the\
    \ fact that your ISP won’t give you a dedicated IP address without paying a hefty\
    \ premium, by installing a client app that enables you to view the baby monitor\
    \ outside your home network.\n\nHead to www.noip.com and check their knowledge\
    \ base for details.\n\n## Build an always-on torrent box\n\n### What you'll need...\n\
    \n- A portable hard drive\n- Raspbian\n  www.raspberrypi.org/downloads\n- PC with\
    \ a desktop environment with Deluge\n  www.deluge-torrent.org\n\n### Get the latest\
    \ distros, packages and test builds faster with a low-power, mini torrent box\n\
    \nTorrenting your open source software has a number of advantages – it can be\
    \ faster, alleviates bandwidth and allows you to share back with the community.\
    \ Distros, packages and more are available via torrents, and the Raspberry Pi\
    \ makes for a great tiny, low-wattage, always-on torrent box to better manage\
    \ your files.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_0.png)\n\n### Install\
    \ Raspbian\n\n01 Raspbian works just fine for our torrent box. Install the image\
    \ on an SD card and go through the basic setup process, making sure to enable\
    \ SSH in the advanced options and to disable the desktop.\n\n### Remote access\n\
    \n02 Type `ifconfig` into your Pi's command line to find the IP address. At this\
    \ point you can unplug the monitor and set it up remotely, but either way you\
    \ can now access the Pi by typing:\n```\nssh [user]@[IP address]\n```\nand entering\
    \ your password to log in.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_1.png)\n\
    \n> \"The Raspberry Pi makes for a great tiny, low-wattage, always-on torrent\
    \ box to better manage your files\"\n\n### Mount hard drive\n\n03 Unless you plan\
    \ to reformat your portable drive, you'll need to install NTFS support onto your\
    \ Pi. Type in:\n```\nsudo apt-get install ntfs-3g\n```\nAdd the hard drive to\
    \ /etc/fstab (open it with `sudo nano /etc/fstab`) by adding the line.\n\n```\n\
    /dev/[hard drive address] [mount point] auto_nofail rw 0 0\n```\nUse `fdisk` to\
    \ find the name of the instance, and mount `/dev/sdz` (for example, `/dev/sdz`)\
    \ with mount point `/home/pi/torrents`.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_0.png)\n\
    \n### Install Deluge\n\n04 We'll use Deluge for our torrents. Install it with:\n\
    ```\nsudo apt-get install deluge-console\n```\nNow start and then stop Deluge\
    \ so it creates a config file we can edit with:\n```\ndeluge\nsudo pkill deluged\n\
    ```\nAnd finally, run the following to copy the config file in case we mess up:\n\
    ```\ncp ~/.config/deluge/auth --config/deluge/default\n```\n\n### Basic configuration\n\
    \n05 Edit the file with:\n```\nsudo nano ~/.config/deluge/auth\n```\nAnd add to\
    \ the bottom:\n```\n[username]:[password]:10\n```\nto restrict access.\nNow start\
    \ it up with:\n```\ndeluge-console\n```\n\npi@raspberrypi: # Free-Web-Server-Guide:\n\
    ```\nsudo /etc/init.d/deluge-daemon start\n```\n[infox] /etc/default/deluge\n\
    sudo /etc/init/deluge-daemon.conf\n```\necho 'sudo /etc/init.d/deluge-daemon start'\n\
    ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_1.png)\n\n### Remote connection\n\
    \n06 Now you're in the client, type the following three commands:\n```\nconfig\
    \ -s allow_remote True\nconfig allow_remote\nexit\n```\nStart the Deluge daemon\
    \ with:\n```\nsudo pkill deluged &\ndeluged\n```\nNow open the graphical client\
    \ on your main PC.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_2.png)\n\n\
    ### Remote interface\n\n07 Go to Edit > Preferences and select Classic Mode and\
    \ restart Deluge. Click Add on the Connection Manager, and enter the IP in Hostname.\
    \ Click Connect to see any torrents you have downloading or uploading.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_3.png)\n\
    \n### Download location\n\n08 Go to Edit again and then Preferences, and change\
    \ to the Downloads tab if it's not on there already. Set the download location\
    \ to the directory we mounted the hard drive to, and enable Auto add torrents;\
    \ setting it to any destination you plan to dump torrents to the hard drive.\n\
    \n### Start on boot\n\n09 An init script from Ubuntu can be used to have Deluge\
    \ start on boot. Download it with:\n```\nsudo wget -O /etc/default/deluge-daemon\
    \ https://bit.ly/1zNXKiz\n```\nOpen /etc/default/deluge-daemon with nano and change\
    \ the username to the one we set up earlier. Save it, then download the full init\
    \ script and update with:\n```\nsudo wget -O /etc/init.d/deluge-daemon https://bit.ly/1s8d76s\n\
    sudo chmod 755 /etc/init.d/deluge-daemon\nsudo update-rc.d deluge-daemon defaults\n\
    ```\n"
  mdcn: "\n## 项目\n\n如果你希望设备能轻松处理低分辨率图像，并用于实时视频流，你应该使用树莓派 3。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_0.png)\n\
    \n### 编辑配置文件\n\n08 要开始配置，只需打开 motion.conf：\n```sudo nano /etc/motion/motion.conf```\n\
    \n使用 CTRL+AW 快捷键打开搜索，找到以下各项配置，并按指定值添加：\n```\ndaemon on\nframerate 2\nwidth 640\n\
    height 480\nffmpegvideo_codecs mpeg4\nstream_localhost off\ncontrol_localhost\
    \ off\n```\n\n如果你是在昏暗的房间内录制，你可以调整亮度和对比度。完成更改后，按 CTRL+W 退出，并输入 Y 然后回车确认。\n\n###\
    \ 为目标目录分配所有权\n\n09 你可能会发现摄像头在运行一段时间后停止传输图像。这是一个权限问题，它会先导致屏幕上出现几张图片，然后整个程序停止运行。使用以下命令解决此问题：\n\
    ```sudo chown motion: /var/lib/motion```\n\n你也可以在 motion.conf 中设置自定义文件路径。查找 target_dir\
    \ 并酌情修改。请记住在完成后保存文件并重启 motion。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_1.png)\n\
    \n### 启动并测试你的婴儿监视器\n\n10 现在，我们几乎有了一个功能完整的婴儿监视器。在此阶段，要完成婴儿监视器的设置并使其运行，剩下的工作就是启动\
    \ motion：\n```sudo service motion start```\n\n你应该能够在移动浏览器中输入树莓派的 IP 地址来访问视频流。这通常类似于\
    \ 192.168.0.10:8081。\n\n请在家庭网络中的多个设备上检查，以确认其是否正常工作。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_2.png)\n\
    \n### 调整运动检测\n\n11 在婴儿监视器设置中，运动检测将承担大部分工作。要改变灵敏度，你需要针对婴儿监视器所设置的环境调整此项。打开：\n```sudo\
    \ nano /etc/motion/motion.conf```\n\n并使用 CTRL+AW 搜索 \"Motion Detection Settings\"\
    。\n在这里，你会找到各种带有可调整值的配置项，例如 threshold（阈值）和 area_detect_value（区域检测值）。这些可能需要耐心的微调以获得最佳效果。\n\
    \n### 让运动检测发出蜂鸣声\n\n12 为了辅助调整检测灵敏度，你可以启用当检测到移动时发出蜂鸣声的功能。作为一个项目，这需要一些校准以获得最佳效果，这是一个很有用的功能。同样，此设置也可以在\
    \ motion.conf 中找到。搜索 \"quiet on\" 并将设置修改为：\n```\nquiet off\n```\n\n记住在你对运动捕获满意后撤销此设置，因为它可能会打扰到宝宝！\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_97_3.png)\n\n### 调整图像质量\n\n13 虽然你可以更改\
    \ PiCam 板捕获图像的维度，但在 motion.conf 中输入数值时要小心。例如，133x342 像素的维度可能无法正常工作。维度必须是 4 的倍数。对于较大的选项，请查看\
    \ 1280x800 或 1920x1080。\n不仅较大的图像会影响带宽，还会使生成的 AVI 文件变大。\n\n### 使用树莓派婴儿监视器获取警报\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_98_0.png)\n\n```\ntail -f /var/log/syslog\n\
    ```\n以及\n```\ndmesg | tail\n```\n\n这将显示该进程当前遇到的任何问题，旨在（并且希望会！）帮助你诊断并解决任何问题。\n\n\
    大多数问题都与驱动程序有关，因此在使用 USB 摄像头时请记住这一点。按 CTRL+Z 结束。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_98_1.png)\n\
    \n### 检查保存的图像\n\n14. 要确认树莓派婴儿监视器捕获的图像质量，请启动 GUI（或安装 tightv server 并进行远程连接），浏览到\
    \ /var/lib/motion 查看图像效果。这应该会给你提供所需的信息，以调整捕获图像的维度。\n\n### 排查摄像头连接问题\n\n15. 没有保证\
    \ motion 能立即正常工作。如果未找到图像，或无法连接到视频流，请运行：\n\n### 为图像命名\n\n16. 可以通过特定的命名规则来配置 motion\
    \ 软件收集的图像，基于日期和时间。\n\n你可以在 motion.conf 中的 target_base_directory 下找到这些设置。例如，你可以指定一个基于日期的文件夹用于新图像：\n\
    ```\ntarget_base_directory ~/pic%Y%m%d%H%M%S-%t\n```\n注意 \"%\"——目录和图像都将根据日期命名，图像还会加上时间戳标签。\n\
    \n### 突破家庭网络\n\n17. 如果你能在你喜欢的餐厅监控孩子的睡眠，那不是很棒吗？你可以通过在树莓派上安装 No-IP 软件来实现。\n\n该软件通过安装客户端应用，使你能够查看家庭网络之外的婴儿监视器，从而规避了\
    \ ISP 不付费就不会提供专用 IP 地址的事实。\n\n前往 www.noip.com 并查看其知识库以获取详细信息。\n\n## 构建一个常开的电骡盒子（Torrent\
    \ Box）\n\n### 你需要……\n\n- 一个移动硬盘\n- Raspbian\n  www.raspberrypi.org/downloads\n\
    - 装有 Deluge 的带有桌面环境的 PC\n  www.deluge-torrent.org\n\n### 通过低功耗迷你电骡盒更快地获取最新发行版、软件包和测试构建\n\
    \n为你的开源软件使用 Torrent 下载有一些优点——它可以更快，缓解带宽压力，并允许你回馈社区。发行版、软件包等均可通过 Torrent 获取，而树莓派非常适合制作一个小巧、低功耗、常开的电骡盒来更好地管理你的文件。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_0.png)\n\n### 安装 Raspbian\n\n01\
    \ Raspbian 对于我们的电骡盒来说运行良好。将镜像安装到 SD 卡上，并走完基本设置流程，确保在高级选项中启用 SSH 并禁用桌面。\n\n###\
    \ 远程访问\n\n02 在树莓派的命令行中输入 `ifconfig` 以查找 IP 地址。此时你可以拔掉显示器并远程设置，但无论哪种方式，你都可以输入以下内容来访问树莓派：\n\
    ```\nssh [user]@[IP address]\n```\n并输入密码登录。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_99_1.png)\n\
    \n> “树莓派非常适合制作一个小巧、低功耗、常开的电骡盒，以便更好地管理你的文件”\n\n### 挂载硬盘\n\n03 除非你计划重新格式化移动硬盘，否则你需要在树莓派上安装\
    \ NTFS 支持。输入：\n```\nsudo apt-get install ntfs-3g\n```\n通过在 /etc/fstab 中添加一行来将硬盘添加到其中（使用\
    \ `sudo nano /etc/fstab` 打开）。\n\n```\n/dev/[hard drive address] [mount point]\
    \ auto_nofail rw 0 0\n```\n使用 `fdisk` 查找实例名称，并挂载 `/dev/sdz`（例如 `/dev/sdz`），挂载点为\
    \ `/home/pi/torrents`。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_0.png)\n\
    \n### 安装 Deluge\n\n04 我们将使用 Deluge 来处理我们的 torrents。使用以下命令安装：\n```\nsudo apt-get\
    \ install deluge-console\n```\n现在启动然后停止 Deluge，以便它创建一个我们可以编辑的配置文件：\n```\ndeluge\n\
    sudo pkill deluged\n```\n最后，运行以下命令以备份配置文件，以防出错：\n```\ncp ~/.config/deluge/auth\
    \ --config/deluge/default\n```\n\n### 基本配置\n\n05 使用以下命令编辑文件：\n```\nsudo nano ~/.config/deluge/auth\n\
    ```\n并在底部添加：\n```\n[username]:[password]:10\n```\n以限制访问。\n现在启动它：\n```\ndeluge-console\n\
    ```\n\npi@raspberrypi: # Free-Web-Server-Guide:\n```\nsudo /etc/init.d/deluge-daemon\
    \ start\n```\n[infox] /etc/default/deluge\nsudo /etc/init/deluge-daemon.conf\n\
    ```\necho 'sudo /etc/init.d/deluge-daemon start'\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_1.png)\n\
    \n### 远程连接\n\n06 现在你已经在客户端中，输入以下三条命令：\n```\nconfig -s allow_remote True\nconfig\
    \ allow_remote\nexit\n```\n使用以下命令启动 Deluge 守护进程：\n```\nsudo pkill deluged &\n\
    deluged\n```\n现在在你主要的 PC 上打开图形客户端。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_2.png)\n\
    \n### 远程界面\n\n07 转到 Edit > Preferences（编辑 > 首选项），选择 Classic Mode（经典模式）并重启 Deluge。在\
    \ Connection Manager（连接管理器）中点击 Add（添加），在 Hostname（主机名）中输入 IP。点击 Connect（连接）以查看你正在下载或上传的任何\
    \ torrents。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_100_3.png)\n\n### 下载位置\n\
    \n08 再次转到 Edit（编辑）然后 Preferences（首选项），如果不在 Downloads（下载）选项卡上，请切换到该选项卡。将下载位置设置为我们挂载硬盘的目录，并启用\
    \ Auto add torrents（自动添加 torrents）；将其设置为你计划将 torrents 转储到硬盘的任何目标位置。\n\n### 开机自启\n\
    \n09 可以使用来自 Ubuntu 的 init 脚本让 Deluge 在开机时启动。使用以下命令下载它：\n```\nsudo wget -O /etc/default/deluge-daemon\
    \ https://bit.ly/1zNXKiz\n```\n用 nano 打开 /etc/default/deluge-daemon 并更改为我们之前设置的用户名。保存它，然后下载完整的\
    \ init 脚本并更新：\n```\nsudo wget -O /etc/init.d/deluge-daemon https://bit.ly/1s8d76s\n\
    sudo chmod 755 /etc/init.d/deluge-daemon\nsudo update-rc.d deluge-daemon defaults\n\
    ```\n\n"
