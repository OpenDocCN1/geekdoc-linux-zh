    \ . of=/dev/disk1\n```\n\n### Win 32 Disk Imager\n\n08 Windows 用户可以使用 Win32 Disk\
    \ Imager。下载该工具后，只需右键点击 exe 文件并选择“以管理员身份运行”，然后按照提示操作即可。安装完成后，你可以将 SD 卡插入你的 PC。简单！\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_20_2.png)\n\nRaspbian\nwww.raspberrypi.org\n\
    \n### 命令行基础\n\n学习使用命令行和键盘控制树莓派的一种替代方式。\n\n使用树莓派时，我们可能都经历过这种情况。你已经将 Raspbian 或其他树莓派操作系统安装到\
    \ SD 卡上，并匆匆忙忙地完成了设置脚本，或者没有做足够的调查。你启动操作系统后……你发现自己来到了命令行。这里的第一个步骤是不要恐慌：这是完全正常的。这可能对你来说是个陌生的概念，只在电影里见过那些想要破坏系统的街头黑客使用！\n\
    \n第二个步骤，至少在 Raspbian 的情况下，只需输入：`$ startx`\n\n就这样。Raspbian 将加载桌面，你可以重新开始使用鼠标了。在这种情况下，以及许多其他操作系统中，这既快速又无痛。你做的是使用一条命令，具体在这种情况下是启动\
    \ X 服务器。X 服务器处理图形界面，在某些树莓派系统上可以默认关闭。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_21_0.png)\n\
