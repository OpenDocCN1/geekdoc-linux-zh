    # Projects


    Beginner’s guide to nano


    What you’ll need . . .


    +   - **Full nano manual**

    +     www.nano-editor.org/dist/v1.2nano.1.html


    # Beginner’s guide to nano


    Learn how to edit text on the command line and in a terminal with one of Linux’s
    best tools


    > ### Did you know . . .


    If you have the itch to do more with your Pi, one of the skills you’ll need to
    learn to pull off many projects is the ability to edit system files. The command
    line text editor nano is definitely one of the best tools for the job. Text editors
    are very basic tools; the clue is in the name in this case. There’s no formatting
    or colouring or anything of the sort you would get in a word processor, but that’s
    the point. The kind of files you’ll be creating or editing will generally contain
    code – code which doesn’t require to be made bold or bulleted. nano removes all
    of these distractions, but still has a few of the more handy features you’d find
    in a graphical text editor. We’ll teach you how to make the most out of nano to
    make your projects run quickly and efficiently.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_41_0.png)


    +   ### Writing

    +   Create plan text files in the command line, even write some code for a program


    +   ### Editing

    +   Edit system files to suit your needs and projects without digging through
    a file manager


    +   ### Advanced functions

    +   Search, copy, paste and insert text from another file using some of the built-in
    nano functions'
