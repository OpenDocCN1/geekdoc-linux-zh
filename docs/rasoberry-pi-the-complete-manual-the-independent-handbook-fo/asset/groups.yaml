    recommend you start with photos stored on your Pi, ones that have been copied
    via USB, via a network drive, or downloaded through your browser


    # Set up your Pi picture frame


    04 To configure the Raspberry Pi as a picture frame, we first need to prevent
    the screen from switching off. This means editing the lightdm.conf file.


