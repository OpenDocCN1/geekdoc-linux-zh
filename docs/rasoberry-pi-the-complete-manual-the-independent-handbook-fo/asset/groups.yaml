    \ PuTTY allows you to make your Secure Shell connection and it's easy to set up\
    \ and use. You can download PuTTY from:\nwww.chiark.greenend.org.uk/~sgtatham/putty\n\
    \n![Screenshot of PuTTY](img/fd3f4a582cf5250916d8b8e1d4ccd045_46_1.png)\n\n##\
    \ Raspberry Pi plus Arduinos\n\nFind out just how to get your Raspberry Pi to\
    \ talk to and use your Arduino\n\nThe Raspberry Pi is a truly amazing single-board\
    \ computer that gets used in lots of DIY projects. That has been the basis for\
    \ this whole column and the previous several articles. While the Raspberry Pi\
    \ has a GPIO and can communicate with sensors and actuators, you may have cases\
    \ where you want to use your Raspberry Pi as the brains of your project and offload\
    \ the interactions with the physical world to another system.\n\nThis is usually\
    \ handled by one of the many microcontroller boards that are available. In this\
    \ issue, we will specifically use the Arduino board and see how to connect it\
    \ to a Raspberry Pi and how to handle the communications between the two. As always,\
    \ we will be using Python as the language of choice to handle all of the actual\
    \ coding in the examples here.\n\nThe Arduino is an open source prototyping platform\
    \ defined as a specification. This means that you can get Arduino implementations\
    \ from several different manufacturers, but they should all behave in a similar\
    \ fashion. For this article, the assumption will be that whatever implementation\
    \ you wish to use will behave properly. The first step is to connect the two boards\
    \ together.\n\nYou will probably want to use a powered USB hub to connect them\
    \ since the Raspberry Pi can't provide huge amounts of power through its USB port.\
    \ While they are connected over USB, the Arduino will appear as a serial port\
    \ to the Raspberry Pi.\n\nThis means that you can communicate with the Arduino\
    \ directly over the serial connection. To be completely sure you have all of the\
    \ relevant libraries installed, you can simply install the Arduino IDE with the\
    \ command:\n\n```bash\n$ sudo apt-get install arduino\n```\n\nThis will make sure\
    \ that you are starting with all of the core software that you might need. When\
    \ you plug in your Arduino, you need to know over which port communications will\
    \ happen. The specific port name will vary based on the exact version of Raspberry\
    \ Pi and Arduino that you are using. However, it should be something like `/dev/ttyUSB0`\
    \ or `/dev/ttyACM0`. In the example code below, we will be assuming that the Arduino\
    \ is visible on the port `/dev/ttyUSB0`.\n\nOnce you have the two devices connected,\
    \ you can start writing code to have them talk to each other.\n\n> “For this article,\
    \ the assumption will be that whatever implementation you wish to use will behave\
    \ properly”\n\nWe will start with the most low-level protocols and build upwords\
    \ from there. The first step is to open a serial connection to the Arduino.\n\n\
    In order to do this, you will need to make sure that the Python serial module\
    \ is installed. If you are using Raspbian, you can do this with:\n\n```bash\n\
    sudo apt-get install python-serial\n```\n\nYou then need to create a new Serial\
    \ object connected to a given serial port, along with the speed you need to use.\n\
    \n```python\nimport serial\nser = serial.Serial(\"/dev/ttyUSB0\", 9600)\n```\n\
    \nIn the above example, the speed is 9600 baud (bits/sec). With this Serial object,\
    \ you can read and write data to and from the Arduino. But you need code on the\
    \ Arduino to handle this part of this communication. The Arduino has its own programming\
    \ language, based on C, which you use to write the code that will run on the board.\
    \ The way Arduinos work is that at bootup it will load a program that will run\
    \ as long as it is powered up. As a simple example, the following code will listen\
    \ on an input pin to see if it goes high. If so, it will then fire off a message\
    \ on the serial port.\n\n```cpp\nint piPin = 7;\nvoid setup() {\n  pinMode(piPin,\
    \ INPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  if (digitalRead(piPin)\
    \ == HIGH) {\n    Serial.println(\"High\");\n    delay(500);\n  }\n}\n```\n\n\
    To load this program to your Arduino board, you will need to use the Arduino IDE\
    \ that was installed at the beginning of this article. This is a graphical program,\
    \ so you will need to connect your Raspberry Pi to a monitor if you want to do\
    \ this step using it. Otherwise, you can do this programming of your Arduino using\
    \ your regular desktop. If you are using the standard bootloader on most Arduinos,\
    \ it will start up whatever program was last uploaded to it. This way you can\
    \ use your desktop to upload your code and then connect it to your Raspberry Pi\
    \ later on. Moving back to the Raspberry Pi, how can you read this message from\
    \ the Arduino? You can simply do a read from the Serial object that you created\
    \ earlier.\n\n```python\nimport time\nwhile True:\n    message = ser.readline()\n\
    \    print(message)\n    if (message != \"\"):\n        do_something_useful()\n\
    \    time.sleep(0.5)\n```\n\nAs you can see, we imported the time module in order\
    \ to be able to sleep in the loop between attempts to read from the serial port.\
    \ What about sending instructions out to the Arduino? This also requires Arduino\
    \ code to be uploaded ahead of time. For example, the following code will take\
    \ an input number and flash an LED that number of times:\n\n```cpp\nint ledPin\
    \ = 13;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n\
    \nvoid loop() {\n  if (Serial.available()) {\n    flash(Serial.read() - '0');\n\
    \  }\n}\n```\n"
  mdcn: "\n## 使用 SSH 访问你的文件\n\n**你需要的材料...**\n- 任何树莓派系统发行版（www.raspberrypi.org/downloads）\n\
    - 网络连接\n- 第二台计算机\n\n使用家用电脑的终端，即可快速且安全地访问你的树莓派。\n\n> **你知道吗...**\n\n虽然通过远程登录完整的\
    \ X 环境——正如我们在前面的页面中演示的那样——非常有用，但它也有其缺点。首先，这样做并不特别快捷或方便。用户体验可能也很缓慢且笨重，但更糟糕的是，它的安全性与我们希望达到的水平相比并不够好。\n\
    \n如果你想采用一种更便捷且安全的方式从另一台计算机访问你的树莓派，你会发现所有资深的树莓派爱好者都会使用 SSH。SSH 代表 Secure Shell（安全外壳协议），它是一种加密网络协议，旨在确保通过命令行进行安全的数据通信。\n\
    \n初学者可能会争辩说，使用完整的图形界面远程访问树莓派更容易，但只要你学会了一些基本的命令行技巧，你会很快发现通过 SSH “潜入”你的树莓派是远程与其交互最方便的方式。\n\
    \n很高兴地告诉你，SSH 已经进行了良好的默认配置——你不需要做太多操作就能让它工作，特别是如果你的远程计算机运行的是 Linux 或 OS X，正如我们将在此演示的那样。\n\
    \n**在使用 Linux 和 OS X 时，SSH 很容易**\n\n假设你的树莓派已开机，并通过以太网或 Wi-Fi 适配器连接到网络，你唯一需要的信息就是你树莓派的\
    \ IP 地址。要发现这一点，你只需在树莓派上打开一个终端窗口并输入命令 `ifconfig`（图 1）。\n\n如果你通过以太网电缆连接，你将看到 `eth0`，然后是几行结果。IP\
    \ 地址将是第二行中 `inet addr` 旁边的数字。如果你通过 Wi-Fi 连接，结果将在 'wlan0' 的第二行。IP 地址本身是由点分隔的四个数字组成。如果你在你的家庭网络上，它可能类似于\
    \ 192.168.0.15。我们将使用这个数字作为指南，但请将其替换为你通过 ifconfig 看到的 IP 地址。\n\n有了这些信息，你只需要在远程\
    \ Linux PC 上打开一个终端窗口并输入：\n\n```bash\n$ ssh pi@192.168.0.15\n```\n\n这假设你的树莓派的用户名仍然是默认的（即\
    \ pi），并且你刚刚将 IP 地址替换为你刚才记录的那个。如果你添加了用户账户或更改了默认设置，你需要将'@'前面的用户名替换为你更改后的内容。当你按下\
    \ Enter 键时，系统会提示你输入树莓派的密码 - 同样，如果是默认的，你可以输入 `raspberry`，否则请输入你树莓派的密码并按 Return\
    \ 键。\n\n现在你将看到命令行上的用户名详细信息已更改为反映你的树莓派 -- 你现在已远程连接。尝试浏览你的文件或使用 nano 打开文件进行编辑！\n\
    \n### 永远不需要再输入 IP 地址\n\n当然，如果你把树莓派带到另一个网络，你树莓派的 IP 地址将会不同。如果你只是想远程连接它，仅仅为了获取 IP\
    \ 地址而设置键盘、鼠标和显示器就会变得极其烦人。如果你只需在终端中输入树莓派的名称即可连接，那不是很方便吗？这听起来好得难以置信，但实际上做起来很容易。\n\
    \n你只需要一小块软件，它实际上允许你通过名称而不是 IP 地址来发现本地网络上的主机和服务（图 2）。要在你的树莓派上设置它，你只需打开终端并输入：\n\n\
    ```bash\n$ sudo apt-get install avahi-daemon\n```\n\n安装完成后，要通过 SSH 访问你的树莓派，你只需在终端中输入以下内容：\n\
    \n```bash\n$ ssh pi@raspberrypi.local\n```\n\n此外，当你通过其他形式的网络访问树莓派时，也可以使用它的名称，无论是\
    \ Samba、使用 VNC 远程登录还是其他任何方式。\n\n![图 2：Avahi 工具允许你通过名称而不是需要发现其 IP 地址来通过 SSH 登录你的树莓派。](img/fd3f4a582cf5250916d8b8e1d4ccd045_46_0.png)\n\
    \n### 在 Windows 上使用 SSH\n\nWindows 世界的大多数事情都是如此，使用微软操作系统访问你的树莓派并没有你想象的那么直接。幸运的是，有一个有用的工具可以帮助你。PuTTY\
    \ 允许你建立安全外壳连接，它易于设置和使用。你可以从以下网址下载 PuTTY：\nwww.chiark.greenend.org.uk/~sgtatham/putty\n\
    \n![PuTTY 截图](img/fd3f4a582cf5250916d8b8e1d4ccd045_46_1.png)\n\n## 树莓派加上 Arduino\n\
    \n了解如何让树莓派与你的 Arduino 通信和使用它\n\n树莓派是一款真正令人惊叹的单板计算机，被用于许多 DIY 项目。这也是本专栏以及之前几篇文章的基础。虽然树莓派拥有\
    \ GPIO，并且可以与传感器和执行器通信，但在某些情况下，你可能希望将树莓派作为项目的“大脑”，而与物理世界的交互则交给另一个系统处理。\n\n这通常由市面上可用的众多微控制器板之一来处理。在本期中，我们将专门使用\
    \ Arduino 板，并查看如何将其连接到树莓派以及如何处理两者之间的通信。一如既往，我们将使用 Python 作为首选语言来处理此处示例中的所有实际编码。\n\
    \nArduino 是一个定义为规范开源原型平台。这意味着你可以从几个不同的制造商那里获得 Arduino 实现，但它们的行为应该都类似。对于本文，假设你希望使用的任何实现都能正常工作。第一步是将两块板连接在一起。\n\
    \n你很可能想使用一个带电源的 USB 集线器来连接它们，因为树莓派无法通过其 USB 端口提供大量电力。虽然它们是通过 USB 连接的，但 Arduino\
    \ 在树莓派上会显示为一个串行端口。\n\n这意味着你可以通过串行连接直接与 Arduino 通信。为了完全确定你安装了所有相关的库，你只需使用以下命令安装\
    \ Arduino IDE：\n\n```bash\n$ sudo apt-get install arduino\n```\n\n这将确保你拥有可能需要的所有核心软件。当你插入\
    \ Arduino 时，你需要知道通信将在哪个端口进行。具体的端口名称将根据你使用的树莓派和 Arduino 的具体版本而异。不过，它应该类似于 `/dev/ttyUSB0`\
    \ 或 `/dev/ttyACM0`。在下方的示例代码中，我们将假设 Arduino 在端口 `/dev/ttyUSB0` 上可见。\n\n一旦两个设备连接好，你就可以开始编写代码让它们相互通信。\n\
    \n> “对于本文，假设你希望使用的任何实现都能正常工作”\n\n我们将从未最低层级的协议开始，并在此基础上逐步构建。第一步是打开到 Arduino 的串行连接。\n\
    \n为了做到这一点，你需要确保 Python 串行模块已安装。如果你使用的是 Raspbian，你可以使用以下命令进行安装：\n\n```bash\nsudo\
    \ apt-get install python-serial\n```\n\n然后，你需要创建一个连接到特定串行端口的新的 Serial 对象，以及你需要使用的速度。\n\
    \n```python\nimport serial\nser = serial.Serial(\"/dev/ttyUSB0\", 9600)\n```\n\
    \n在上面的示例中，速度是 9600 波特（比特/秒）。使用这个 Serial 对象，你可以向 Arduino 读取和写入数据。但你需要 Arduino 上的代码来处理通信的这一部分。Arduino\
    \ 有自己的编程语言，基于 C，你使用它来编写将在板上运行的代码。Arduino 的工作方式是，在启动时，它会加载一个只要通电就会一直运行的程序。作为一个简单的例子，以下代码将监听输入引脚以查看它是否变高。如果是，它将通过串行端口发送一条消息。\n\
    \n```cpp\nint piPin = 7;\nvoid setup() {\n  pinMode(piPin, INPUT);\n  Serial.begin(9600);\n\
    }\n\nvoid loop() {\n  if (digitalRead(piPin) == HIGH) {\n    Serial.println(\"\
    High\");\n    delay(500);\n  }\n}\n```\n\n要将此程序加载到你的 Arduino 板上，你需要使用本文开头安装的 Arduino\
    \ IDE。这是一个图形化程序，因此如果你想执行此步骤，你需要将树莓派连接到显示器。否则，你可以使用你的常规桌面来对 Arduino 进行编程。如果你使用的是大多数\
