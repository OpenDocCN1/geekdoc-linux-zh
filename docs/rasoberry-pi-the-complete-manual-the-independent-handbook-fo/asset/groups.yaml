  - '[PAGE 11]


    # Getting started


    # The starter kit


    # The starter kit


    There''s more to your Pi than first meets the eye. Here are some vital peripherals
    to get you started


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_0.png)


    In order to get the very best experience from your Raspberry Pi, you''re going
    to have to get hold of a few extras on top of the actual Raspberry Pi board itself.
    For example, you''re going to need a keyboard and mouse with which to enter commands
    and navigate. While it''s possible to do projects without a keyboard and mouse
    attached, you''ll need them for the initial setup. An SD card is also an important
    purchase – it''s where the operating system lives. Perhaps you''ll need a Wi-Fi
    adapter, or maybe just a length of network cable. Then there''s the basic electronics
    side of the Raspberry Pi, what would you need to start some of the beginner electronics
    and control experiments? Clearly, there''s more to the Raspberry Pi than some
    might think.


    By ''peripherals'', we mean other hardware that can be attached and utilised by
    the Raspberry Pi. They could be something as simple as a desktop HDMI or they
    could be the latest, greatest bespoke gadgets that enhance your project capabilities.
    There is an entire world of possibilities available for the Raspberry Pi, from
    robot arms to remote-controlled helicopters... The only limits are the hardware
    available and your imagination.


    > Did you know... [illegible text due to image quality]


    # Keyboard and mouse


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_1.png)


    Let''s start with the most basic of components, the keyboard and mouse. Generally
    speaking, virtually any USB keyboard and three-button scroll mouse will work with
    the Raspberry Pi, and although for some projects you won''t even need a keyboard
    and mouse, you''ll need them for initial setup.


    # SD card


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_2.png)


    Early Raspberry Pi computers required an SD card, whereas later models such as
    the Raspberry Pi 2 and 3 use microSD cards for storage. This is where your chosen
    operating system (such as Raspbian) is installed, and these can be bought in various
    sizes, pre-installed with the OS, or blank.'
  - '[PAGE 12]


    # The starter kit


    # Getting started


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_0.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_1.png)


    # Power cable


    The Raspberry Pi uses a standard micro USB connector for its power input, running
    at 5V. In most cases a micro USB to USB cable will suffice, which once snaffed
    can be plugged into your desktop computer’s USB port. An Android phone charger
    should also work perfectly (5.25V /500mA).


    # Case


    Securing your Raspberry Pi in a case will protect it and prevent the delicate
    GPIO pins from accidental damage. A case can also make your Raspberry Pi a more
    attractive or striking unit, perhaps as a media centre. Ensure you choose the
    right case for your Raspberry Pi model.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_2.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_3.png)


    # Video output


    There are two video output ports, a HDMI port and an RCA Socket. HDMI is the primary
    video-output connector for most users, but the RCA video-out port can also be
    used to connect TVs, monitors or to a SCART cable. Remote access to your Raspberry
    Pi is also possible via SSH or VNC.


    # Powered USB hub


    Extra USB ports are worth considering as an early purchase with your Pi. Once
    you’ve connected a keyboard and mouse you’ll realise why using a powered USB hub
    is important: to stop any power being drained from the Pi, and allow you to attach
    the likes of an external hard drive, for example.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_4.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_5.png)


    # Raspberry Pi camera board


    This is a custom designed add-on board that attaches to one of the Raspberry Pi’s
    on-board sockets via a flexible cable. It’s extremely small but remarkably powerful,
    having a native resolution of five megapixels and supporting 1080p video. It’s
    essentially a smartphone camera for the Pi.


    # USB Wi-Fi adaptor


    Using a USB Wi-Fi adaptor will bring flexibility to where you position your Raspberry
    Pi. Without a restrictive Ethernet cable, it could be used for more advanced projects:
    where running a wired Internet connection isn’t a valid option. Just make sure
    you buy a Raspberry Pi-friendly Wi-Fi adaptor.'
