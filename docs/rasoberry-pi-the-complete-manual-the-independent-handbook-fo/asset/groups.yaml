  - '[PAGE 61]


    # **Projects**


    # Check your mail


    This is fine since we only want to display the newest emails which have come in.
    Most of the interaction methods return a tuple that contains a status flag (either
    ''OK'' or ''NO'') and a list containing the actual data. The first thing we need
    to do after selecting the inbox is to search for all of the messages available,
    as in the following example.


    ```

    `my_imap.select()`

    `typ, email_list = my_imap.search(None, ''ALL'')`

    ```


    The email_list variable contains a list of binary strings that you can use to
    fetch individual messages. You should check the value stored in the variable typ
    to be sure that it contains ''OK''. To loop through the list and select a given
    email, you can use the following code:


    ```

    `for num in email_list[0].split():`

    `    typ, email_raw = my_imap.fetch(num, ''(RFC822)'')`

    ```


    The variable email_raw contains the entire email body as a single escaped string.
    While you could parse it to pull out the pieces that you want to display in your
    email monitor, that kind of defeats the power of Python.


    Again, available in the standard library is a module called email that can handle
    all of those parsing issues. You will need to import the module in order to use
    it, as in the example here.


    ```

    `import email`

    `email_msg = email.message_from_bytes(email_raw[0][1])`

    ```


    All of the sections of your email are now broken down into sections that you can
    pull out much more easily. Again, to pull out the subject line for a quick display,
    you can use the code:


    ```

    `subject_line = email_msg.get(''Subject'')`

    ```


    There are many different potential items that you could select out. To get the
    full list of available header items, you can use the keys method, as shown below:


    ```

    `email_msg.keys()`

    ```


    Many times, the emails you get will come as multi-part messages. In these cases,
    you will need to use the get_payload() method to extract any attached parts. It
    will come back as a list of further email objects. You then need to use the get_payload()
    method on those returned email objects to get the main body. The code might look
    like:


    ```

    `payload = email_msg.get_payload()[0]`

    `body1 = payload1.get_payload()`

    ```


    As with POP email connections, you may need to do something to keep the connection
