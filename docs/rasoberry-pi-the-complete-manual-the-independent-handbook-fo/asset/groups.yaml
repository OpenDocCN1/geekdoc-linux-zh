    \ Debian 于 1993 年发布，如今已取得了长足的进步。Raspbian 需要工作来提高性能水平至标准，因为树莓派使用较旧的 ARMv6 架构。它现在是一个伟大的日常桌面环境。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_19_0.png)\n\n- **命令行**\n  - 如果你使用 OS\
