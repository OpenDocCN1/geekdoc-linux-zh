  - "[PAGE 34]\n\n# Update the system\n\n+   1. Unfortunately, if you have an existing\
    \ Synaptic system, the command to the display is going to be stuck at the first\
    \ step. Before we install anything, we need to make sure that the Raspberry Pi\
    \ is up-to-date and any existing packages are up-to-date. Simply enter the following\
    \ into the LXTerminal:\n+   \n+   ```\n+   sudo apt-get update\n+   sudo apt-get\
    \ upgrade\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_0.png)\n\n#\
    \ Installing Synaptic\n\n+   2. Now that the system is up-to-date, we’re finally\
    \ ready to install Synaptic. Go to the LXTerminal and run the command below. Don’t\
    \ forget to type Y to the prompt asking you to accept the installation.\n+   \n\
    +   ```\n+   sudo apt-get install synaptic\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_1.png)\n\
    \n# Running Synaptic – Part 1\n\n+   3. In essence, that’s all you need to do.\
    \ Synaptic is now installed and ready to use. However, due to its complexity,\
    \ there may be some bugs that need ironing out first, so it’s best to follow these\
    \ steps. To test if Synaptic is working okay, first enter the following command\
    \ into the terminal:\n+   \n+   ```\n+   sudo synaptic\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_2.png)\n\
    \n# Running Synaptic – Part 2\n\n+   4. You should be now looking at the Synaptic\
    \ program window, where you can scroll through the list of available programs\
    \ and click on each to download and install. Now we need to test whether it will\
    \ run from the LXDE menu. Click on the icon in the bottom left, then go to Preferences,\
    \ Synaptic Package Manager.\n\n# Running Synaptic – Part 3\n\n+   5. Running Synaptic\
    \ from the LXDE menu results in an error. Don’t panic, however, it’s just asking\
    \ for a password. Enter the username/password so we can access the system. This\
    \ is the default password you set when you first changed it and if you haven’t\
    \ changed it, you can use the default.\n\n# Fixing Synaptic – Option 1\n\n+  \
    \ 6. This will temporarily fix the issue. To permanently resolve it, do one of\
    \ the following: first, right-click the synaptic icon in the menu and left-click\
    \ Properties. In the Command text box, change the text to add the sudo command.\
    \ So instead of “synaptic-pkexec”, it will read:\n+   \n+   ```\n+   sudo synaptic-pkexec\n\
    +   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_34_3.png)\n\n# Getting started\n\
    \n# Fixing Synaptic – Option 2\n\n+   7. The second, and best, option is to drag\
    \ back into the terminal and repeat the way in which the program is executed from\
    \ the menu. All that’s needed is to change one line to another, so that the command\
    \ type is again used instead of the plain synaptic-pkexec. From the terminal,\
    \ type:\n+   \n+   ```\n+   sudo nano /usr/share/applications/synaptic.desktop\n\
    +   ```\n\n```\nChange “Exec=synaptic-pkexec” to “Exec=gksu /usr/bin/synaptic-pkexec”\n\
    ```\n\n# Synaptic fully working\n\n+   8. After you’ve entered those changes,\
    \ exit nano via Ctrl+X, followed by Y to accept the changes, and then press Enter.\
