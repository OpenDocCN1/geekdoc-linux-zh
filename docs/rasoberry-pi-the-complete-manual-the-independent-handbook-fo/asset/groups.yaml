  - "[PAGE 18]\n\n# ## Set up your Pi Zero\n\nRasbpian user interface from the previous\
    \ step. Insert the SD card into your Linux machine and work out what the device\
    \ is called.\n\n```\n```\ndmesg | tail -n 3\n[ 328516.612884] mmc8: new high speed\
    \ SDHC card at address 6001.\n[ 328516.614337] mmcblk0: mmc:0:6001 SD0BG 7.35\
