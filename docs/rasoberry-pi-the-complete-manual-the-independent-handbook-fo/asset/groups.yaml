    \n首先，大多数邮件服务器使用两种不同的通信协议之一。较旧、较简单的协议称为 POP（邮局协议），较新的协议称为 IMAP（互联网消息访问协议）。我们将涵盖这两种协议以涵盖你可能遇到的所有情况。我们将从较旧的\
    \ POP 通信协议开始。幸运的是，标准库中对此协议有支持。为了开始使用此协议，你需要导入 poplib 模块，然后创建一个新的 POP3 对象。例如，以下代码将创建到通过\
    \ Gmail 可用的 POP 服务器的连接。\n\n```python\nimport poplib\nmy_pop = poplib.POP3_SSL(host='pop.gmail.com')\n\
    ```\n\n连接 Gmail 时需要使用 POP3_SSL 类，因为 Google 对其连接使用 SSL。如果连接到不同的邮件服务器，你可以使用 POP3\
    \ 进行未加密连接。POP 通信协议涉及客户端向服务器发送一系列命令以与其交互。例如，你可以使用 getwelcome() 方法获取服务器欢迎消息：\n\n\
    ```python\nmy_pop.getwelcome()\n```\n\n你想向服务器传达的第一件事可能是你感兴趣的电子邮件账户的用户名和密码。在代码中包含用户名不算太大的安全问题，但密码则另当别论。除非你有充分理由将其写在代码中，否则你应该向最终用户索取密码。标准库中包含\
