    \ which you create as you need them. When it creates a new event. When it creates\
    \ a new event, it must freeze.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_3.png)\n\
    \n#### Initialise the tail\n\n&nbsp;&nbsp;14 When the green flag is clicked to\
    \ start the game. Grow is set to 1 so the snake gets a short body. Move to the\
    \ centre of the stage with the pen up and configure the pen to draw a tail the\
    \ same colour and size as the stage background so that it erases the body.\n\n\
    #### Grow and move\n\n&nbsp;&nbsp;15 Use a ‘forever’ command to keep the tail\
    \ moving. If Grow is 0, it should pause and reset Grow to 1 – this makes the body\
    \ grow longer. Use the first value from Next Direction to set the direction and\
    \ remove it so you get a new value next time. Move at more Speed steps.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_4.png)\n\
    \n#### Try out the tail\n\n&nbsp;&nbsp;16 Now you can try out the tail sprite.\
    \ Because it won’t receive any Egg Eaten events. But the tail will follow the\
    \ snake head around the stage, erasing the snake body as it goes (which is the\
    \ same colour as the background).\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_57_5.png)\n\
    \n#### Paint the Egg sprite\n\n&nbsp;&nbsp;17 Click the New Sprite Paintbrush\
    \ icon to paint a new sprite. In the Paint Editor, draw a small yellow ellipse.\
    \ Name the sprite Egg. The Egg will appear randomly on the stage and cause the\
    \ snake to grow and increase its score.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_0.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_1.png)\n\n#### Add Egg sound\n\n\
    &nbsp;&nbsp;18 Go to the Sounds tab for the Egg sprite and import the percussion-Cymbal\
    \ sound. Or you can choose a different sound if you like. This sound will play\
    \ when the snake eats an egg.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_2.png)\n\
    \n#### Add Egg scripts\n\n&nbsp;&nbsp;19 Copy the Egg script so that the Egg appears\
    \ randomly at the start of the game. When the Egg senses that it has been eaten,\
    \ it must hide, play the Cymbal sound (or whatever you chose in Step 18), update\
    \ the score, broadcast the Egg Eaten event and then randomly appear again. When\
    \ the Game Over event is received, it must stop.\n\n#### Make Bad Egg\n\n&nbsp;&nbsp;20\
    \ Create the black Bad Egg in the same way as the Egg but using a different shape\
    \ and the instruments-String/Pluck sound. Drag the Egg’s green flag script onto\
    \ the Bad Egg to copy them – just change the sound and replace it with a random\
    \ bonus.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_3.png)\n\n#### Grow Bad\
    \ Egg\n\n&nbsp;&nbsp;21 Add another ‘when green flag clicked’ script to the Bad\
    \ Egg so it resets its size to the default 100% when a new game is started and\
    \ then increases its size by ten every ten seconds. The Bad Egg will get bigger\
    \ and bigger and harder to avoid.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_4.png)\n\
    \n#### Create Bonus sprite\n\n&nbsp;&nbsp;22 Create the Bonus sprite in Scratch.\
    \ Then you can choose the shape and sound for the Bonus. Its scripts are similar\
    \ to the Egg ones so you could drag one of those to the Bonus sprite and work\
    \ from that. Make sure you change the sound and increase the score by a random\
    \ bonus.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_58_5.png)\n\n## Check your\
    \ mail\n\nWith Python, you can have your Raspberry Pi act as mail checker, giving\
    \ you a running list on incoming email\n\nSince the Raspberry Pi is such a small\
    \ computer, it gets used in a lot of projects where you want to monitor a source\
    \ of data. One such monitor you might want to create is a mail-checker that can\
    \ display your current unread emails. This issue, we'll look at how to use Python\
    \ to create your own mail-checking monitor to run on your Pi. We'll focus on the\
    \ communications between the Pi and the mail server and not worry too much about\
    \ how it might be displayed. That will be left as a further exercise.\n\nTo start\
    \ with, most email servers use one of two different communication protocols. The\
    \ older, simpler one was called POP (Post Office Protocol), and the newer one\
    \ is called IMAP (Internet Message Access Protocol). We will cover both protocols\
    \ to cover all of the situations that you might run into. We'll start with the\
    \ older POP communications protocol. Luckily, there is support for this protocol\
    \ as part of the standard library. In order to start using this protocol, you\
    \ will need to import the poplib module, and then create a new POP3 object. For\
    \ example, the following will create a connection to the POP server available\
    \ through Gmail.\n\n```python\nimport poplib\nmy_pop = poplib.POP3_SSL(host='pop.gmail.com')\n\
    ```\n\nYou need to use the POP3_SSL class when connecting to Gmail because Google\
    \ uses SSL for its connections. If connecting to a different email server, you\
    \ can use POP3 to make an unencrypted connection. The POP communication protocol\
    \ involves the client sending a series of commands to the server to interact with\
    \ it. For example, you can get the welcome message from the server with the getwelcome()\
    \ method:\n\n```python\nmy_pop.getwelcome()\n```\n\nThe first things that you\
    \ will want to communicate to the server are the username and password for an\
    \ email account that you are interested in. Having the username in your code is\
    \ not too much of a security issue, but the password is another matter. Unless\
    \ you have a good reason to have it written out in your code, you should probably\
    \ ask the end-user for it. Included within the standard library is the getpass\
    \ module, which you can use to ask the end-user for their password in a safer\
    \ fashion. You could use the following code, for example.\n\n```python\nimport\
    \ getpass\nmy_pop.user('my_name@gmail.com')\nmy_pop.pass_(getpass.getpass())\n\
    ```\n\n> “The first things that you will want to communicate to the server are\
    \ the username and password for an email account”\n\nYou should now be fully logged\
    \ in to your email account. Under POP your account will be locked until you choose\
    \ to execute the quit() method of the connection. If you need a quick summary\
    \ of what is on the open server you can execute the stat() method:\n\n```python\n\
    my_pop.stat()\n```\n\nThis method returns a tuple consisting of the message count\
    \ and the mailbox size. You can get an explicit list of messages with the list()\
    \ method. You have two options for looking at the actual contents of these emails,\
    \ depending on whether you want to leave the messages untouched or not. If you\
    \ want to simply look at the first chunk of the messages, you can use the top()\
    \ method. The following code will grab the headers and the first five lines of\
    \ the first message in the list.\n\n```python\nemail_top = my_pop.top(1, 5)\n\
    ```\n\nThis method will return a tuple consisting of the response text from the\
    \ email server, a list of the headers and the number of requested lines, and the\
    \ octet count for the message. The one problem with the top() method is that it\
    \ is not always well implemented on every email server. In those cases, you can\
    \ use the retr() method. It will return the entire requested message in the same\
    \ form as that returned from top().\n\nOnce you have your message contents, you\
    \ need to decide what you actually want to display. As an example, you might want\
    \ to simply print out the subject lines for each message. You could do that with\
    \ the following code.\n\n```python\nfor line in email_top[1]:\n    if 'Subject'\
    \ in line:\n        print(line)\n```\n\nYou need to explicitly do the search because\
    \ the number of lines included in the headers varies between each message. Once\
    \ you're done, don't forget to execute the quit() method to close down your connection\
    \ to the email server. One last thing to consider is how long the email server\
    \ will keep the connection alive. While running test code for this article, it\
    \ would frequently time out. If you need to, you can use the noop() method as\
    \ a keep-alive for the connection.\n\nAs mentioned previously, the second, newer,\
    \ protocol for talking to email servers is IMAP. Luckily, there is a module included\
    \ in the standard library that you can use, similar to the poplib module we looked\
    \ at above, called imaplib. Also, as above, it contains two main classes to encapsulate\
    \ the connection details. As you need an SSL connection, you can use IMAP4_SSL.\
    \ Otherwise, you can use IMAP4 for unencrypted connections. Using Gmail as an\
    \ example, you can create an SSL connection with the following code.\n\n```python\n\
    import imaplib\nimport getpass\nmy_imap = imaplib.IMAP4_SSL(\"imap.gmail.com\"\
    )\n```\n\nAs opposed to poplib, imaplib has a single method to handle authentication.\
    \ You can use the getpass module to ask for the password.\n\n```python\nmy_imap.login('my_username@gmail.com',\
    \ getpass.getpass())\n```\n\nIMAP contains the concept of a tree of mailboxes\
    \ where all of your emails are organised. Before you can start to look at the\
    \ emails, you need to select which mailbox you want to work with. If you don't\
    \ give a mailbox name, the default is the inbox.\n"
