    \ a larger amount of memory. The value you give to it must be either 16/32/64/128/256,\
    \ to use memory settings for graphics.\n  - 3D GPU performance for basic desktop\
    \ where video and 3D rendered games.\n  - 64MB GPU memory for desktop use that\
    \ requires video playback or 3D effects enabled.\n  - 128MB GPU memory for graphical\
    \ applications and games that do extensive multimedia or play 3D rendered games.\n\
    \  - For most people, a 64MB split for graphics will suffice.\n\n## Get online\n\
    \n### What you'll need…\n- Any Raspberry Pi distro\n- www.raspberrypi.com/downloads\n\
    - Wi-Fi dongle or Ethernet\n\n> **Did you know?**\n> 1. 7 out of 8 young people\
    \ are more likely to have their own smartphone than their own PC.\n> 2. There\
    \ are more Facebook users than people in China.\n> 3. 450 million people use Facebook\
    \ on their phones every day.\n> 4. 1000 times more data is processed in a single\
    \ day than was available when the internet began in 1969.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_29_0.png)\n\
    Fig 1: With a Wi-Fi dongle attached, run the utility and scan for available networks\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_29_1.png)\nFig 2: Enter the pre-shared\
    \ key in order to connect to your home router\n\n### Get online\nTo access a world\
    \ of utilities, apps and resources you need to get online. This is how to do it…\n\
    \nThe easiest way to get online is to buy a Raspberry Pi Model B+, as it comes\
    \ with an Ethernet socket. The Model A not only lacks the Ethernet port, but is\
    \ handicapped by only having one USB port. That means you will have to buy a power\
    \ USB hub in order to get online. Back to the Model B+: and a USB to get online,\
    \ simply plug an Ethernet cable into the socket on the Pi and connect it to a\
    \ similar port on the back of your internet modem/router. Turn your Pi on and\
    \ launch the desktop, then double-click on Emphathy and you should see the internet\
    \ appear (main image). To check that it's working, look at the lights on the Pi\
    \ itself. The red power light should be on. Above this is the green light that\
    \ flickers when accessing the SD card. Below the power light are the three Ethernet-related\
    \ lights. Note that the Model A does not have these LEDs because it doesn't have\
    \ the Ethernet socket. The middle light is green and comes on when it detects\
    \ a Full Duplex LAN connection. This means it is able to send and receive data\
    \ to the internet. The next light is green and flashes when actually accessing\
    \ the internet by sending or receiving data. The last light is yellow and will\
    \ come on and stay on when a 100Mb/s LAN connection is detected.\n\n### The Wi-Fi\
    \ option\nIf you aren't close enough to the modem/router to be able to plug in\
    \ the Ethernet connection, or you simply have a Model A, then a powered USB hub\
    \ is required. This plugs into a USB port on the Pi. You can then plug a Wi-Fi\
    \ dongle into this. Boot up the Pi and launch the desktop. Then double-click on\
    \ the Wi-Fi Config icon. You should see a name for the dongle in the Adapter section.\
    \ Click on Scan to look for networks and a list of those found should appear (Fig\
    \ 1). Double-click on the one you want to connect to and the details for it will\
    \ be listed. Almost all home networks use a network key, which is usually written\
    \ on the modem itself. Click on PSK, which stands for pre-shared key, and type\
    \ it in (Fig 2). Then click on Add. It will process this, then associate the connection\
    \ and\n"
  mdcn: "\n## 掌握 Config 工具\n\n### 你需要...\n- Raspbian：www.raspbian.org\n\n### 掌握 Config\
    \ 工具\n使用强大的内置 Config 工具来配置你的 Raspberry Pi 的行为。\n\n‘RasPi Config’ 工具允许你配置系统，否则在\
    \ Linux 环境中会更困难。这也是你安装 Raspbian 后首先会看到的东西。为什么？像设置日期和时间或键盘的区域设置这样的任务，通常在命令行界面中完成，没有对话框，没有额外的帮助——对于新用户来说，这是一场噩梦。\n\
    \n关于 Pi 和 Raspbian 本身还有一些特定的细节，例如能够轻松启用 TV 的过扫描（overscan），更改分配给计算机 / 显卡的内存比例，甚至超频你的系统使其稍微更快；启用系统的远程\
    \ SSH 访问；阻止系统启动进入桌面环境等。RasPi Config 工具消除了过程中的痛苦，将真正的力量置于你的指尖。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_27_0.png)\n\
    \n### 打开 raspi-config 工具\n- 01 首先双击桌面上的 LXTerminal 图标。这将启动命令提示符，你可以在此运行配置工具。为此，你需要运行一个命令。\n\
    \  - `sudo raspi-config`\n- 当要求输入密码时，你实际上看不到正在输入的内容。当你输入密码并按下回车键提交后，配置界面将显示出来。本节将介绍其中一些特别重要的设置，尽管它们在你的\
    \ Pi 运行中都有用处。此菜单中的一些设置很重要，有些是不可逆的，请谨慎使用。\n\n- **更改密码**\n  更改默认 'pi' 用户名的密码，使其更具个性化或更容易为你记住。\n\
    \n- **扩展根分区**\n  允许你非常快速轻松地更改根分区，使其完全填满 SD 卡\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_27_1.png)\n\
    \n- **配置键盘**\n  设置正确的键盘布局——有许多不同的布局。使用错误的布局可能会让人烦恼。\n\n- **超频**\n  允许你快速轻松地超频你的\
    \ Pi，以给你额外的速度和力量，风险很小。\n\n### 更改启动行为\n- 06 默认情况下，Raspbian 发行版将启动到命令行界面，然后才运行“li”中的登录。如果你想运行窗口管理器（在这种情况下，它被称为\
    \ X），你需要给系统一个命令来执行它。对很多人来说这并不理想，因为命令行让他们感到恐惧。为此，有一个选项可以在启动时自动启动 X。将此选项设置为“是”以默认启用此行为。\n\
    - 当然，你可以随时撤销此操作，返回到“基于文本的登录”，在那里你需要手动启动 X。\n\n```bash\nstartx\n```\n\n### 开启和关闭过扫描\n\
    - 07 如果你使用现代 HDTV 使用你的 Pi，你可能会注意到两种行为之一。\n  - 图像四周有一圈黑边，被 Pi 裁剪掉了 – 它只是无法正确显示。这是由欠扫描（underscan）引起的。\n\
    \  - 如果你无法看到屏幕的边缘以将其调高，那就是受到了过扫描（overscan）的影响。\n- 如果你有前一种问题，你可能需要打开过扫描，或在电视上启用“缩放”模式或类似功能。\n\
    - 如果你有后一种问题，你需要关闭过扫描，以便你能看到边缘。\n\n### 更新 raspi-config\n- 08 raspi-config 工具会不时收到更新。这通常是为了添加更多功能或修复小\
    \ bug，或者两者兼有！在使用工具时运行更新并不是坏主意——在开始更改任何系统设置之前。虽然更有可能更新是为了让它看起来更好或做更多事情，但不排除可能隐藏了一些会被误解的\
    \ bug，从而给你带来麻烦。但是，请记住，当你重新运行 raspi-config 工具时，你需要互联网连接，通过 LAN 电缆或无线。没有这些，它将永远无法变得更新。始终尝试确保你在使用最新版本。\n\
    \n### 扩展根文件系统\n- 02 默认情况下，Raspbian 根文件系统为 2GB – 这样做是为了使提供的镜像能够适应尽可能多的不同 SD 卡。如果你关心\
    \ /expandd_root 文件选项，它会操作系统使用整个空间。使用此选项后，命令将立即执行。操作系统可能需要几分钟时间来识别更改。重启你的系统以看到更改。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_28_0.png)\n\n### 配置你的位置\n- 03 Locale\
    \ 是你的 Pi 使用的语言和区域设置 – 虽然这通常对你如何使用它影响不大，但使用默认的货币设置等是合理的。如果设置错误，这可能在稍后成为麻烦。选择该选项后，你将进入向导。使用箭头键在你继续之前检查内置的\
    \ locale（这需要一些时间）。时区会将你带到一个时区屏幕，你可以调整它。\n\n### 超频你的 Pi\n- 04 你可以将你的 Pi 的时钟速度和电压设置为几个不同的预设。将时钟速度和电压设置为高于规格值的速率可能会导致不稳定，因此请分小步进行。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_28_1.png)\n\n并确保你的 Pi 周围有良好的气流。\n-\
    \ 如果你注意到任何明显的不稳定，再次运行此向导并将时钟速度调回稍低一些 – 重复直到你的系统完全稳定。\n\n从本教程开始，建议使用 Model/ Medium\
    \ 超频。它似乎能提供一点额外的性能，而没有明显的副作用。建议在更改后重启系统。按住 Shift 键可以暂时禁用超频。\n\n### 更改内存分割\n- 05\
    \ 更改 Pi 的内存分割允许你给系统或图形处理器分配更多的内存。你给它的值必须是 16/32/64/128/256，用于使用图形内存设置。\n  - 用于基本桌面、视频和\
    \ 3D 渲染游戏的 3D GPU 性能。\n  - 用于需要启用视频播放或 3D 效果的桌面使用的 64MB GPU 内存。\n  - 用于进行大量多媒体操作或玩\
    \ 3D 渲染游戏的图形应用程序和游戏的 128MB GPU 内存。\n  - 对于大多数人来说，用于图形的 64MB 分割就足够了。\n\n## 上网\n\
    \n### 你需要…\n- 任何 Raspberry Pi 发行版\n- www.raspberrypi.com/downloads\n- Wi-Fi 适配器或以太网\n\
    \n> **你知道吗？**\n> 1. 8 个年轻人中有 7 个更可能拥有自己的智能手机而不是自己的 PC。\n> 2. Facebook 用户比中国人口还多。\n\
    > 3. 每天 4.5 亿人使用手机访问 Facebook。\n> 4. 一天内处理的数据量比 1969 年互联网刚诞生时可用的数据多 1000 倍。\n\n\
    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_29_0.png)\n图 1：连接 Wi-Fi 适配器后，运行实用程序并扫描可用网络\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_29_1.png)\n图 2：输入预共享密钥以连接到你的家庭路由器\n\
    \n### 上网\n要访问实用程序、应用程序和资源的广阔世界，你需要上网。这是方法…\n\n最简单的上网方式是购买 Raspberry Pi Model B+，因为它带有一个以太网插座。Model\
    \ A 不仅缺少以太网端口，而且只有一个 USB 端口是个障碍。这意味着你需要购买一个带电源的 USB 集线器才能上网。回到 Model B+：要使用 USB\
    \ 上网，只需将以太网线插入 Pi 上的插座，并将其连接到互联网调制解调器/路由器背面的类似端口。打开你的 Pi 并启动桌面，然后双击 Emphathy，你应该会看到互联网出现（主图）。要检查它是否正常工作，查看\
    \ Pi 本身上的灯。红色电源灯应该亮着。上面是当访问 SD 卡时闪烁的绿灯。电源灯下方是三个与以太网相关的灯。注意 Model A 没有这些 LED，因为它没有以太网插座。中间的灯是绿色的，当检测到全双工\
    \ LAN 连接时会亮起。这意味着它能够向互联网发送和接收数据。下一个灯是绿色的，当实际通过发送或接收数据访问互联网时会闪烁。最后一个灯是黄色的，当检测到\
    \ 100Mb/s LAN 连接时会亮起并保持点亮。\n\n### Wi-Fi 选项\n如果你离调制解调器/路由器太近而无法插入以太网连接，或者你只是有一个\
    \ Model A，那么需要带电源的 USB 集线器。它插入 Pi 上的 USB 端口。然后你可以将 Wi-Fi 适配器插入其中。启动 Pi 并打开桌面。然后双击\
    \ Wi-Fi 配置图标。你应该在“适配器”部分看到适配器的名称。单击“扫描”查找网络，应该会出现找到的网络列表（图 1）。双击你想连接的那个，它的详细信息将被列出。几乎所有的家庭网络都使用网络密钥，通常写在调制解调器本身上。单击\
    \ PSK，它代表预共享密钥，并输入它（图 2）。然后单击“添加”。它将处理此操作，然后关联连接，并且\n"
