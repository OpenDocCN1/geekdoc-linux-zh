    \n### Analogue output\n\nFor people that don’t (yet) have a 3.5mm jack: you can\
    \ buy a small black 3.5mm (or 6.5mm) cable to pipe out the audio.\n\n### USB\n\
    \nAll the peripherals you want to connect via USB—USB hubs, keyboards, mouse,\
    \ USB storage etc.—plug in here. If your hub has an external power for the USB\
    \ hub you have to use one though.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_14_1.png)\n\
    \n### SD card\n\nThe SD card goes in underneath the Raspberry Pi board. This will\
    \ hold your operating system that runs the Raspberry Pi. The Pi does not need\
    \ to be set up from another computer before using it, though.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_14_2.png)\n\
    \n### Digital output\n\nThe HDMI port is the main video (and audio) output of\
    \ the Raspberry Pi, allowing you to display videos on the TV/desktop at a resolution\
    \ of up to 1080p. The Pi’s support for 3D will also appear in the audio out automatically\
    \ through it.\n\n### Networking\n\nThe Raspberry Pi does not come with wireless\
    \ Internet, and while you can add a USB adapter, it’s usually easier to plug in\
    \ an Ethernet cable. This will plug into the back of your router on the other\
    \ end and give you internet and access to your home network.\n\n### Cabling\n\n\
    Make sure you have the right selection of cables, such as an Ethernet cable for\
    \ networking and a TV adapter, and an HDMI or Video cable for video out. The HDMI\
    \ or Video cable is not included, and the video out will require an additional\
    \ auxiliary cable.\n\n## Getting started\n\n### What you'll need...\n\n- Raspberry\
    \ Pi Zero\n- Micro USB power supply\n- Soldering iron and solder\n- Pi Zero adapter\
    \ bundle\n  - Monitor, mouse and keyboard\n  - USB Wi-Fi or USB Ethernet adaptor\n\
    - Optional\n- USB hub\n- Optional\n\n### Set up your Pi Zero\n\nGet to grips with\
    \ your Raspberry Pi Zero, either as a headless device or for use together with\
    \ a screen and keyboard.\n\nSo you've picked up one of the tiny yet powerful Zeros,\
    \ but before the coding fun can begin you need to get more familiar with it. Don't\
    \ worry; we'll walk you through the Raspberry Pi Zero, the required cables, how\
    \ to prepare a NOOBS SD card, and how to solder the GPIO header onto the Pi. Once\
    \ the Pi is working and booted we'll show you how to get it working on Wi-Fi through\
    \ the Raspberry user interface. You'll need a USB hub for this, or even just use\
    \ a keyboard and mouse together. We'll also show you how to prepare a Raspberry\
    \ SD card for headless use (either VNC or SSH) with only a Wi-Fi adapter or USB-to-Ethernet\
    \ adaptor.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_15_0.png)\n\n#### Raspberry\
    \ Pi Zero Cable Overview\n\n**01** The Raspberry Pi Zero is very small, and as\
    \ such cannot fit normal-sized USB and HDMI connectors to it. To use it you therefore\
    \ need adaptors that break out micro USB into full-size USB and mini HDMI to full-size\
    \ HDMI. You also need to be very careful when connecting the micro USB cables\
    \ as the micro USB power cable will fit into the connector meant for USB data.\
    \ It's easy to tell them apart though, as they're clearly labelled, and the USB\
    \ data connector can be found between the HDMI and power connectors.\n\n### Set\
    \ up your Pi Zero\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_16_0.png)\n\nFig\
    \ 1: Once you've soldered the header into place, your Pi Zero should resemble\
    \ any other Raspberry Pi\n\n#### GPIO header\n\n- **02** Soldering your brand\
    \ new Raspberry Pi Zero might seem like a scary prospect, at first, but it's not\
    \ that difficult! What is difficult, however, is snapping off the correct number\
    \ of GPIO header pins (40), as the kit supplies more than 40. It's also well worth\
    \ noting at this point that it doesn't matter too much if you mess up and end\
    \ up missing a couple of the bottom pins.\n\nThe kit we used with a soldering\
    \ iron, stand, solder, sucker and some lead-free solder was £8 on Amazon. We managed\
    \ to solder the GPIO pins using this kit no problem.\n\n#### Soldering kits\n\n\
    - **03** Soldering irons are very cheap these days. If you are going to do a lot\
    \ of soldering then it's probably worth getting a temperature-controlled one where\
    \ you can change the tip. However,\n\n#### Holding the GPIO headers in place\n\
    \n- **04** Before you can solder the GPIO headers, you need to be able to hold\
    \ them in place. We recommend putting some blu-tack on either side of the pins\
    \ for this. This also has the advantage that you can flip the Pi over and then\
    \ use the blu-tack to keep it in place on a table while you are soldering. The\
    \ blu-tack should just easily peel off once you are done.\n\n#### Solder the GPIO\
    \ headers\n\n- **05** Here comes the bit you might have been dreading, but, don't\
    \ worry! Make sure you have wet the sponge in the soldering iron holder, as you\
    \ will need to wipe the iron on the sponge to keep the tip clean. If this is the\
    \ first time your iron has been used, the heating element will probably give off\
    \ a lot of smoke for the first few minutes, so don't worry if that happens. Still,\
    \ be mindful of your safety and make sure you're not in a poorly-ventilated area\
    \ - try not to breathe in any fumes. Once the iron is hot, apply some solder to\
    \ the tip and wipe any excess solder on the sponge. Then start to solder the pins.\
    \ For each pin, touch the tip of the iron on the bottom of the GPIO header and\
    \ the metal contact on the Pi, then apply a very small amount of solder. Once\
    \ the solder has flowed onto the pin and the metal contact, then you can remove\
    \ the iron. If there is too much solder then you can reheat the solder and use\
    \ the solder sucker to remove it. Take breaks when soldering the GPIO headers\
    \ for a couple of reasons: 1) you don't want to overheat any components on the\
    \ Pi, and 2) you can melt the plastic of the GPIO headers and that will allow\
    \ the pin to fall through. Keep wiping the tip of the iron on the sponge to keep\
    \ it clean throughout the soldering process. Make sure you unplug the iron and\
    \ put it somewhere safe to cool down when you are finished.\n\n### Getting started\n\
    \n#### GPIO\n\nDesv you’ve soldered on a 2x20s male header, your GPIOs will work\
    \ as usual. To the right, you can see the four unpopulated pins for video output\
    \ and a reset switch\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_17_0.png)\n\n\
    #### Video\n\nYou’ll need a mini-HDMI-to-HDMI adaptor to use this audio/video\
    \ port, although you can also use the RCA composite video output via the unpopulated\
    \ pin\n\n#### Data\n\nThe power port, on the right, is micro USB as usual. The\
    \ data port beside it is now micro USB as well, however, so you’ll likely need\
    \ a micro USB-to-USB adaptor.\n\n### Prepare NOOBS SD Card\n\n- **06** See www.raspberrypi.org/help/noobs-setup\
    \ for more details. NOOBS requires an SD card formatted as FAT32. You then need\
    \ to download the latest NOOBS image from https://downloads.raspberrypi.org/NOOBS_latest\
    \ and then unzip it to the SD card. On Linux, the steps are as follows:\n  - `sudo\
    \ parted /dev/mmcblk0(parted)  mklabel msdos(parted)  mkpart primaryfat32  0%\
    \ 100%(parted)  mkb1kp1  /dev/mmcblk0p1  cd /mntsudo mkfs.vfat /dev/mmcblk0p1cd\
    \ /mntsudo mkdfsr pi cd pi sudo  unzip /dev/mmcblk0p1/piNOOBS_v_1_5_2.zip`\n \
    \ - `sync`\n  - `cd ..sudo umount pi`\n\n### Boot NOOBS and install Raspbian\n\
    \n- **07** Connect your Pi Zero up as shown in the first step. The minimum you\
    \ need connected for a NOOBS install is a monitor and a keyboard. However, a mouse\
    \ and either an Ethernet adaptor or Wi-Fi adaptor are also very useful. Press\
    \ Enter to select Raspiian and then press 1 to install. Then press Enter to agree.\
    \ Once it’s finished it will say 'OS installed successfully'. Press OK and your\
    \ Pi will reboot into Raspbian. Alternatively, if you don’t want to use NOOBS,\
    \ you can flash Raspbian to an SD card in the usual manner. Raspbian will boot\
    \ into a desktop environment by default\n\n### Configure Wi-Fi\n\n- **08** If\
    \ you are using a USB-to-Ethernet adaptor then the Pi should already be connected\
    \ to the internet. If you are using a Wi-Fi adaptor then you will need to configure\
    \ it to connect to your wireless network. We are using an Edimax EW-7811UN, which\
    \ works\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_17_1.png)\n\nPerfectly with\
    \ the Pi out of the box. Once at the Raspbian desktop in order to see the available\
    \ wireless networks. Once you click on one it will ask you for the password. After\
    \ that it should be associated. You can hover your mouse over the icon and see\
    \ the networks that you are connected to\n\n### Configure Wi-Fi from another machine\n\
    \n- **09** If you want to use the Pi Zero as a headless device with Wi-Fi then\
    \ you can prepare an SD card using another Linux machine that will already be\
    \ configured to connect to the correct Wi-Fi network. You have to mount the SD\
    \ card and edit /etc/wpa_supplicant/wpa_supplicant.conf, which is the same file\
    \ that is configured by the\n"
  mdcn: "\n\n## 设置您的树莓派\n\n通过我们易于遵循指南，了解全新树莓派各部分的用途\n\n虽然看起来令人望而却步，但将树莓派配置为日常使用其实非常简单。就像电视或普通计算机一样，只有特定的线缆才能插入特定的插槽，主要工作就是确保在某一时刻您已插好所需的部件。树莓派本身在电路板上标注不多。不过，大多数优质外壳都会为您完成这项工作——如果您决定购买一个的话。\n\
    \n### 电源适配器\n\n树莓派使用 Micro USB 线供电，类似于许多现代安卓手机。它可以通过笔记本电脑或计算机供电。但为了充分利用其性能，合适的市电适配器（例如这款）是理想选择\n\
    \n### 显示器\n\n树莓派能够输出 1920 × 1080 分辨率，也称为 1080p。有些显示器缺少直接插入 HDMI 的额外输出接口，就像电视一样。不过，在某些情况下您可能需要一个适配器\n\
    \n### USB 集线器\n\n树莓派上的 USB 端口数量有限（只有一个）。如果您拥有型号 A，为了解决这个问题，您将需要一个 USB 集线器。获取带供电的集线器很重要，因为树莓派本身无法提供足够的电力\n\
    \n### 外壳和配件\n\n使用树莓派时并不一定需要外壳，但一个不错的型号可以让它免受灰尘侵害，并在运行期间使其更容易移动。不过，您需要一张 SD 卡，例如带外壳的\
    \ 4GB 卡\n\n### 键盘和鼠标\n\n就像任何计算机一样，标准树莓派您需要键盘和鼠标。无论您用树莓派做什么都是如此。键盘越基本越好，有些鼠标可能需要额外的软件，特别是那些特殊的型号。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_13_0.png)\n\n## 入门指南\n\n### 设置您的树莓派\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_14_0.png)\n\n### 模拟输出\n\n对于（尚未）拥有 3.5mm\
    \ 接口的人：您可以购买一根小的黑色 3.5mm（或 6.5mm）线缆来输出音频。\n\n### USB\n\n您想要通过 USB 连接的所有外围设备——USB\
    \ 集线器、键盘、鼠标、USB 存储设备等——都插在这里。如果您的集线器有外部电源，则必须使用它。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_14_1.png)\n\
    \n### SD 卡\n\nSD 卡插入树莓派主板下方。这将保存运行树莓派的操作系统。不过，使用前无需通过另一台计算机设置树莓派。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_14_2.png)\n\
    \n### 数字输出\n\nHDMI 端口是树莓派的主要视频（和音频）输出，允许您在电视/桌面上以高达 1080p 的分辨率显示视频。树莓派对 3D 的支持也会自动通过音频输出呈现。\n\
    \n### 网络连接\n\n树莓派不附带无线互联网，虽然您可以添加 USB 适配器，但通常插入以太网电缆更简单。另一端将插入路由器的背面，为您提供互联网访问和访问家庭网络的能力。\n\
    \n### 线缆\n\n确保您有正确的线缆选择，例如用于网络的以太网电缆和电视适配器，以及用于视频输出的 HDMI 或视频电缆。HDMI 或视频电缆不包含在内，视频输出将需要额外的辅助电缆。\n\
    \n## 入门指南\n\n### 您需要的物品...\n\n- 树莓派 Zero\n- Micro USB 电源\n- 烙铁和焊锡丝\n- Pi Zero\
    \ 适配器套件\n  - 显示器、鼠标和键盘\n  - USB 无线网卡或 USB 以太网适配器\n- 可选\n- USB 集线器\n- 可选\n\n###\
    \ 设置您的 Pi Zero\n\n熟悉您的树莓派 Zero，无论是作为无头设备使用，还是与屏幕和键盘配合使用。\n\n所以您已经挑了一个小巧却强大的 Zero，但在开始编码乐趣之前，您需要更多地了解它。别担心，我们将带您了解树莓派\
    \ Zero、所需线缆、如何准备 NOOBS SD 卡，以及如何将 GPIO 排针焊接到 Pi 上。一旦 Pi 正常工作并启动，我们将向您展示如何通过树莓派用户界面使其在\
    \ Wi-Fi 上工作。为此您需要一个 USB 集线器，或者只是同时使用键盘和鼠标。我们还将向您展示如何为无头使用准备树莓派 SD 卡（使用 VNC 或 SSH），仅使用\
    \ Wi-Fi 适配器或 USB 转以太网适配器。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_15_0.png)\n\
    \n#### 树莓派 Zero 线缆概览\n\n**01** 树莓派 Zero 非常小，因此无法安装常规尺寸的 USB 和 HDMI 连接器。因此要使用它，您需要将\
    \ Micro USB 扩展为全尺寸 USB，将 Mini HDMI 扩展为全尺寸 HDMI 的适配器。在连接 Micro USB 线缆时也要非常小心，因为\
    \ Micro USB 电源线可以插入用于 USB 数据的连接器。不过很容易区分它们，因为它们有清晰的标签，而且 USB 数据连接器位于 HDMI 和电源连接器之间。\n\
    \n### 设置您的 Pi Zero\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_16_0.png)\n\n图\
    \ 1：一旦您将排针焊接到位，您的 Pi Zero 应该看起来像其他树莓派一样\n\n#### GPIO 排针\n\n- **02** 焊接您崭新的树莓派\
    \ Zero 起初可能看起来令人害怕，但并不那么困难！然而，困难的是从套件中掰下正确数量的 GPIO 排针引脚（40 个），因为套件提供的数量超过 40 个。此时也值得注意，如果您搞砸了，漏掉底部几个引脚也没有太大关系。\n\
    \n我们使用的套件包括烙铁、支架、焊锡、吸锡器和一些无铅焊锡，在亚马逊上售价 8 英镑。我们用这个套件顺利焊接了 GPIO 引脚，没有遇到任何问题。\n\n\
    #### 焊接套件\n\n- **03** 如今烙铁非常便宜。如果您打算进行大量焊接，那么可能值得购买一个温控型号，您可以更换烙铁头。然而，\n\n####\
    \ 固定 GPIO 排针\n\n- **04** 在您焊接 GPIO 排针之前，您需要能够固定它们的位置。我们建议在此时引脚两侧放一些蓝丁胶（Blu-tack）。这也带来一个好处，您可以翻转\
    \ Pi，然后使用蓝丁胶将其固定在桌面上，以便在焊接时保持稳定。完成后，蓝丁胶可以轻松剥离。\n\n#### 焊接 GPIO 排针\n\n- **05**\
    \ 这是您可能一直担心的部分，但别担心！确保您已湿润焊接支架中的海绵，因为您需要将烙铁在海绵上擦拭以保持烙铁头清洁。如果这是您第一次使用烙铁，加热元件在前几分钟可能会冒很多烟，所以如果发生这种情况请别担心。不过，请留意您的安全，确保您不在通风不良的区域\
    \ - 尽量不要吸入任何烟雾。一旦烙铁变热，在烙铁头涂抹少量焊锡，并在海绵上擦去多余的焊锡。然后开始焊接引脚。对于每个引脚，将烙铁头触点在 GPIO 排针的背面和\
    \ Pi 上的金属触点，然后施加非常少量的焊锡。一旦焊锡流向引脚和金属触点，您就可以移开烙铁。如果焊锡过多，您可以重新加热焊锡并使用吸锡器将其移除。焊接 GPIO\
    \ 排针时请休息几次，原因有二：1) 您不希望过热 Pi 上的任何组件，2) 您可能会熔化 GPIO 排针的塑料，这会导致引脚掉落。在整个焊接过程中，请持续将烙铁头在海绵上擦拭以保持清洁。完成后，请拔掉烙铁插头并将其放在安全的地方冷却。\n\
    \n### 入门指南\n\n#### GPIO\n\n当您焊接了 2x20 公头排针后，您的 GPIO 将正常工作。在右侧，您可以看到四个未填充的引脚，用于视频输出和一个复位开关\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_17_0.png)\n\n#### 视频\n\n您需要一个 Mini-HDMI\
    \ 转 HDMI 适配器来使用此音频/视频端口，尽管您也可以使用未填充引脚通过 RCA 复合视频输出\n\n#### 数据\n\n右侧的电源端口通常是 Micro\
    \ USB。旁边的数据端口现在也是 Micro USB，因此您可能需要一个 Micro USB 转 USB 适配器。\n\n### 准备 NOOBS SD\
    \ 卡\n\n- **06** 有关更多详细信息，请访问 www.raspberrypi.org/help/noobs-setup。NOOBS 需要格式化为\
    \ FAT32 的 SD 卡。然后您需要从 https://downloads.raspberrypi.org/NOOBS_latest 下载最新的 NOOBS\
    \ 镜像，并将其解压到 SD 卡。在 Linux 上，步骤如下：\n  - `sudo parted /dev/mmcblk0(parted)  mklabel\
    \ msdos(parted)  mkpart primaryfat32  0% 100%(parted)  mkb1kp1  /dev/mmcblk0p1\
    \  cd /mntsudo mkfs.vfat /dev/mmcblk0p1cd /mntsudo mkdfsr pi cd pi sudo  unzip\
    \ /dev/mmcblk0p1/piNOOBS_v_1_5_2.zip`\n  - `sync`\n  - `cd ..sudo umount pi`\n\
    \n### 启动 NOOBS 并安装 Raspbian\n\n- **07** 按照第一步所示连接您的 Pi Zero。安装 NOOBS 所需连接的最小配置是显示器和键盘。然而，鼠标和以太网适配器或\
    \ Wi-Fi 适配器也非常有用。按 Enter 选择 Raspbian，然后按 1 安装。然后按 Enter 同意。完成后，它会显示“OS installed\
    \ successfully”（操作系统安装成功）。按 OK，您的 Pi 将重启进入 Raspbian。或者，如果您不想使用 NOOBS，您可以按通常方式将\
    \ Raspbian 刷入 SD 卡。Raspbian 默认启动到桌面环境\n\n### 配置 Wi-Fi\n\n- **08** 如果您使用的是 USB\
    \ 转以太网适配器，那么 Pi 应该已经连接到互联网。如果您使用的是 Wi-Fi 适配器，则需要配置它以连接到您的无线网络。我们使用的是 Edimax EW-7811UN，它工作\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_17_1.png)\n\n完美地与 Pi 开箱即用。一旦在 Raspbian\
    \ 桌面上，为了查看可用的无线网络。点击其中一个后，它会要求您输入密码。之后它应该已关联。您可以将鼠标悬停在图标上，查看您连接的计算机网络\n\n### 从另一台机器配置\
    \ Wi-Fi\n\n- **09** 如果您想将 Pi Zero 作为具有 Wi-Fi 的无头设备使用，您可以使用另一台已经配置好连接正确 Wi-Fi 网络的\
    \ Linux 机器来准备 SD 卡。您必须挂载 SD 卡并编辑 /etc/wpa_supplicant/wpa_supplicant.conf，这与配置的文件相同\n\
    \n"
