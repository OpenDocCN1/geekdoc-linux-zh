    ```bash

    #!/bin/sh

    #if [unit /etc/init.d/tightvnserver]

    # Set the NUMBER to start

    # the tightvnserver user

    # NUMBER=''pi''

    case "$1" in

    start) su NUMBER -c ''/usr/bin/

    tightvnserver -c ''

    # echo "Starting TightVNC

    # server for "''$NUMBER"''

    #;;

    stop)

    pkill xtigntVnc

    echo "TightVncserver stopped"

    #;;

    *)

    echo "Usage: /etc/init.d/

    tightvnserver

    start|stop"

    #;;

    exit 0

    ```

    ```


    # Reboot and ready to go


    Now press **Ctrl-X**, then **Y** and **Enter**. To save. Follow that a couple
    of tries to get you back into the Terminal. Now we need to do now is edit the
