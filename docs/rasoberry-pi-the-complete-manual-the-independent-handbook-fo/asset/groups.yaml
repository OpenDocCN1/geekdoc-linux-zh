    \ you can now activate USB tethering.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_1.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_2.png)\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_0.png)\n\
    \n> “What you do also usually have with you is an internet-connected magic pocket\
    \ box called a smartphone that you can connect the Pi”\n\n### Check connection\n\
    \n4. Our running on the desktop will be an internet- or Android device. We’ll\
    \ connect the Pi and its IP address.\n   `$ ifconfig`\n\n### Quick connect\n\n\
    5. You can connect from the terminal right now to access the Internet. You should\
    \ be able to do this by typing the following into your terminal.\n   `$ sudo dhclient\
    \ usb0`\n   This will automatically grab any available IP address; that’s your\
    \ phone acting as a router.\n\n### Test connection\n\n6. Open your web browser\
    \ and head to google.com. If you can load the site, you’re all set up.\n   `$\
    \ nano /etc/network/interfaces`\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_1.png)\n\
    \n### Save the settings\n\n7. After you connect your Raspberry Pi it should automatically\
    \ access the internet. You can use `$ sudo nano /etc/network/interfaces` to make\
    \ these changes permanent.\n\n### Tether on the go\n\n9. Now, when you’re out\
    \ and about, your phone can tether your Pi. This will give you Internet access\
    \ wherever you go, as long as you have a cellular connection.\n\n### Interface\
    \ settings\n\n8. Here you’ll find at the current settings. Your might look different\
    \ from ours depending on if you have added any fixed IP address settings or other\
    \ stuff. Using the same syntax as the eth0 line, add:\n   `iface usb0 inet dhcp`\n\
    \n## Add a battery pack to your Raspberry Pi\n\n### What you'll need ...\n\n-\
    \ AA battery box\n- AA batteries\n- 3-Amp UBEC\n- 3A switch\n- 3-Amp terminal\
    \ strip\n- 6x AA rechargeable batteries\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_71_0.png)\n\
    \nDon't leave your Raspberry Pi behind - incorporate it into mobile projects by\
    \ powering it up using nine 1.5 AA batteries\n\nYour Raspberry Pi's mobility is\
    \ usually restricted by the length of the power lead. Rather than limiting it\
    \ to your desk or living room, however, you can use it for mobile projects as\
    \ diverse as launching it into near-Earth orbit or monitoring and automating your\
    \ garden.\n\nOf course, to do this you will need batteries, but adding battery\
    \ power to your Raspberry Pi is simpler than you might have imagined. All that\
    \ is required are six rechargeable AA batteries (or single-charge alkaline), a\
    \ battery box with space for the batteries and a UBEC. The latter is a Universal\
    \ Battery Elimination Circuit, a voltage regulator that will regulate the power\
    \ supply and prevent damage to the Raspberry Pi, and can be bought for under £10.\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_0.png)\n\n> \"You can use your device\
    \ for mobile projects as diverse as launching it into near-Earth orbit\"\n\n**Make\
    \ your order** **01**\nIf you're buying your components online you should be able\
    \ to get them all within five days. However, if you're ordering offline (specifically\
    \ the UBeC), you should avoid traditional electronics stores and instead visit\
    \ a model enthusiast store, as these circuits are regularly used in RC devices.\n\
    \n**Check your UBeC** **02**\nTwo types of UBeC are available to choose from.\
    \ If you used the store that we suggest in the resources box to the left, you'll\
    \ receive one with a micro USB power connector for easy connection to your Raspberry\
    \ Pi. However, if you bought one from eBay, then there is a strong chance that\
    \ you will receive one with a 3-pin connector.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_1.png)\n\
    \n**Move connector pins** **03**\nIn order to use the UBeC with a 3-pin connector,\
    \ you'll need to alter the position of the pins so that they occupy the two outer\
    \ slots. Just use a small jeweller's screwdriver to lever up the small plastic\
    \ pad and remove the red wire from the central slot, before sliding into the unoccupied\
    \ outer slot.\n\n**Connect to battery box** **04**\nWith five batteries in the\
    \ UBeC (battery box, connect it to the UBeC led-red, black to black) by twisting\
    \ the wires, soldering or employing a 3 way terminal strip, cut down to two pins.\
    \ It can be cut to size using a modelling knife.\n\n**Add a battery to boot**\
    \ **05**\nWith your Pi ready to use and your WiFi dongle plugged in, connect the\
    \ UBeC to the micro USB port and insert the sixth battery into the battery box.\
    \ The Pi's power and status lights should indicate that the computer is booting\
    \ up, which gives you a fully portable computer.\n\n**Connect the 3-pin UBeC**\
    \ **06**\nIf you purchased the UBeC with the now-modified 3-pin connector, you\
    \ need to connect this to the Raspberry Pi GPIO header. Connect the positive +5V\
    \ (red) connector to Pin 2 and the negative 0V connector to Pin 6.\n\n**Measure\
    \ uptime** **07**\nYou should have already set up the device for SSH use, so connect\
    \ to the device via Putty after giving it time to boot fully (at least 60 seconds).\
    \ In the terminal, enter:\n\n```bash\nsudo idb csi3m sf:/Users/rache.larrabi/Deskt\
    \ op/ArcHLinux/ archnl-linux-HF-2013-02-11.img >dev/disk1\n```\n\nThis command\
    \ will display the system uptime and also keep the Wi-Fi connection active.\n\n\
    **Judge your uptime results** **08**\nUptime results depend upon the type of battery\
    \ you use and the Raspberry Pi model. Single-charge batteries will last a little\
    \ bit longer, but this is a more expensive option. Meanwhile, newer models (with\
    \ greater power requirements but more for less time. For more power, add a better\
    \ battery)\n\n**Power extreme!** **09**\nMore batteries added in parallel should\
    \ result in almost double the uptime (at least 16 hours on a 255Wm Raspberry Pi\
    \ Model A), but instead of alkaline or rechargeable batteries, you might consider\
    \ a modern lithium-based AA cell, which will last considerably longer than alkaline\
    \ batteries.\n\n## Draw circuits with paint\n\n### What you'll need...\n\n- Bare\
    \ Conductive paint (pen or tub)\n- Male to female jumper wires\n- An assortment\
    \ of LEDs, switches and resistors (optional)\n\nAssembling circuits has never\
    \ been so easy with the joys of conductive paint, enabling you to bring together\
    \ art and electronics in a whole new way.\n\nPlaying with electronics and physical\
    \ computing is a very rewarding task. For a beginner though, the mess of wires\
    \ and components can become very confusing quite quickly and things like soldering\
    \ can be a safety concern when children are involved. Bare Conductive has taken\
    \ the joy of electronics and made it far safer, easier and more versatile with\
    \ their conductive paint. You can literally draw wires on paper with a paintbrush,\
    \ use it for cold-soldering or a conductive adhesive and much, much more. There\
    \ are not a great deal of boundaries to what you can do. Pair this paint with\
    \ a microcontroller board and you could be creating interactive art, clothing\
    \ and projects in no time.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_0.png)\n\
    \n### Get your tools\n\n**01** Paint and a paintbrush aren't the first items that\
    \ come to mind when you think about electronics, so you may be wondering where\
    \ to get them from. **Bare Conductive** stock the paint and a selection of components\
    \ in their shop [bareconductive.com/shop](bareconductive.com/shop) but you will\
    \ need to go somewhere else for art supplies. We would recommend trying a high\
    \ street craft shop such as Hobbycraft ([hobbycraft.co.uk](hobbycraft.co.uk))\
    \ or a local independent.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_1.png)\n"
  mdcn: "\n\n## 你需要准备的材料……\n\n- 安卓设备\n- USB 线缆\n\n## 将树莓派连接到安卓设备\n\n需要让树莓派上网？尝试通过物理连接方式（Tethering）连接你的安卓设备以获取网络访问权限。便携性是树莓派最受推崇的特点之一。迷你屏幕、迷你无线键鼠套装、便携电池等配件可以让你随时随地移动使用，但互联网接入往往是一个无法通过简单配件轻松解决的障碍。而你通常随身携带的，正是一个拥有网络连接、被称为“智能手机”的神奇口袋盒子。只要具备一点专业知识，你就可以将树莓派连接到它，从而“借用”它的网络。在接下来的两页中，我们将传授这些专业知识，帮助你在外出时使用树莓派接入互联网。\n\
    \n### 简单的方法\n\n1. 许多智能手机都具有 Wi-Fi 热点功能，树莓派可以轻松地连接到这些热点。首先，开启热点，然后启动树莓派。连接无线 USB\
    \ 网卡，并在“偏好设置 > Wi-Fi 配置”中打开 `wpa_gui`。\n\n### 扫描设备\n\n2. 点击“扫描”打开扫描窗口，然后在该窗口内再次选择“扫描”。它应该会检测到你的设备。就像连接任何其他\
    \ Wi-Fi 网络一样连接它，树莓派会记住该网络以便下次需要时使用。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_0.png)\n\
    \n### 设置共享网络\n\n3. 首先，通过 USB 线缆将你的手机连接到树莓派。根据供电情况的差异，树莓派可能无法为手机充电，但仍允许你进行网络共享。现在你可以在共享网络菜单中激活\
    \ USB 共享网络功能。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_1.png)\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_2.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_0.png)\n\n> “你通常随身携带的也是一个连接互联网的神奇口袋盒子——智能手机，你可以将树莓派连接到它”\n\
    \n### 检查连接\n\n4. 桌面运行环境我们将使用互联网连接或安卓设备。我们将连接树莓派并获取其 IP 地址。\n   `$ ifconfig`\n\n\
    ### 快速连接\n\n5. 你现在就可以从终端连接以访问互联网。你只需在终端中输入以下命令即可做到这一点。\n   `$ sudo dhclient usb0`\n\
    \   这将自动获取任何可用的 IP 地址；此时你的手机充当了路由器的角色。\n\n### 测试连接\n\n6. 打开你的网络浏览器并访问 google.com。如果你能加载该网站，说明设置已完成。\n\
    \   `$ nano /etc/network/interfaces`\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_1.png)\n\
    \n### 保存设置\n\n7. 连接树莓派后，它应该能自动访问互联网。你可以使用 `$ sudo nano /etc/network/interfaces`\
    \ 使这些更改永久生效。\n\n### 移动共享网络\n\n9. 现在，当你外出时，你的手机可以共享网络给树莓派。只要你拥有蜂窝网络连接，无论你去哪里都能获得互联网访问权限。\n\
    \n### 接口设置\n\n8. 在这里你将查看当前的设置。根据你的配置（例如是否添加了固定 IP 地址设置或其他内容），你的设置可能与我们显示的不同。使用与\
    \ `eth0` 行相同的语法，添加：\n   `iface usb0 inet dhcp`\n\n## 为树莓派添加电池组\n\n### 你需要准备的材料……\n\
    \n- AA 电池盒\n- AA 电池\n- 3安培 UBEC\n- 3A 开关\n- 3安培接线端子排\n- 6节 AA 可充电电池\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_71_0.png)\n\
    \n不要把树莓派留在家里——使用九节 1.5V AA 电池为其供电，将其融入移动项目中\n\n树莓派的移动性通常受限于电源线长度。然而，与其将其限制在书桌或客厅，你还可以将其用于各种移动项目，例如将其发射到近地轨道，或者监控和自动化你的花园。\n\
    \n当然，要做到这一点你需要电池，但为树莓派增加电池供电比你想象的要简单。只需要六节可充电 AA 电池（或一次性碱性电池）、一个能容纳电池组空间的电池盒以及一个\
    \ UBEC 即可。UBEC 是通用电池消除电路（Universal Battery Elimination Circuit），一种电压调节器，可以调节电源并防止树莓派损坏，价格通常在\
    \ 10 英镑以下即可买到。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_0.png)\n\n> “你可以将你的设备用于各种移动项目，例如将其发射到近地轨道”\n\
    \n**下单采购** **01**\n如果你在线购买组件，应该能在五天内收到所有物品。但是，如果你线下订购（特别是 UBeC），应避免光顾传统电子商店，而应该访问模型爱好者商店，因为这些电路常用于遥控（RC）设备中。\n\
    \n**检查你的 UBeC** **02**\n市面上有两种类型的 UBeC 可供选择。如果你使用了我们在左侧资源框中推荐的商店，你将收到一个带有微 USB\
    \ 电源连接器的型号，方便连接到树莓派。然而，如果你从 eBay 购买，你很可能收到的是一个带有 3 针连接器的型号。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_72_1.png)\n\
    \n**移动连接器针脚** **03**\n为了使用带 3 针连接器的 UBeC，你需要改变针脚的位置，使其占据外侧两个插槽。只需使用一个小珠宝螺丝刀撬起小塑料垫片，将红线从中间插槽中移除，然后滑动到未占用的外侧插槽中。\n\
    \n**连接到电池盒** **04**\n将电池放入电池盒（UBeC 电池盒部分），然后将其连接到 UBeC（红线接红，黑线接黑），可以通过 twisting\
    \ 电线、焊接或使用修剪成两针的 3 路接线端子排来实现。可以使用模型刀修剪到合适的大小。\n\n**加电启动** **05**\n树莓派已准备就绪，Wi-Fi\
    \ 网卡已插入，将 UBeC 连接到微 USB 端口，并将第六节电池插入电池盒。树莓派的电源和状态指示灯应该表明计算机正在启动，这就给你一个完全便携的计算机了。\n\
    \n**连接 3 针 UBeC** **06**\n如果你购买的是现在已修改过的 3 针连接器的 UBeC，你需要将其连接到树莓派的 GPIO 排针。将正极\
    \ +5V（红线）连接器连接到 Pin 2，将负极 0V 连接器连接到 Pin 6。\n\n**测量运行时间** **07**\n你应该已经设置了 SSH\
    \ 使用，所以在等待设备完全启动（至少 60 秒）后，通过 Putty 连接到设备。在终端中输入：\n\n```bash\nsudo idb csi3m sf:/Users/rache.larrabi/Deskt\
    \ op/ArcHLinux/ archnl-linux-HF-2013-02-11.img >dev/disk1\n```\n\n此命令将显示系统运行时间，并保持\
    \ Wi-Fi 连接处于活动状态。\n\n**评估运行时间结果** **08**\n运行时间结果取决于你使用的电池类型和树莓派型号。一次性电池能持续稍长时间，但这是一种更昂贵的选择。同时，较新的型号（功耗要求更高但能效更低，意味着运行时间更短。为了获得更大功率，请添加更好的电池）\n\
    \n**极致供电！** **09**\n并联添加更多电池应将运行时间几乎翻倍（在 255Wm 树莓派 Model A 上至少 16 小时），除了碱性或可充电电池，你可能还应考虑现代基于锂的\
    \ AA 电池，它们的持续时间将比碱性电池长得多。\n\n## 用颜料绘制电路\n\n### 你需要准备的材料……\n\n- Bare Conductive\
    \ 导电颜料（笔装或桶装）\n- 公对母跳线\n- 各种 LED、开关和电阻（可选）\n\n有了导电颜料的乐趣，组装电路从未如此简单，让你以全新的方式将艺术与电子结合起来。\n\
    \n玩弄电子元件和物理计算是一项非常有回报的任务。但对于初学者来说，杂乱无章的电线和组件很快就会变得非常令人困惑，而当儿童参与时，焊接等工序可能带来安全隐患。Bare\
    \ Conductive 通过他们的导电颜料，让电子乐趣变得更加安全、简单和多功能。你可以字面意义上用画笔在纸上画导线，将其用于冷焊或导电粘合剂，以及更多用途。你能做的事情几乎没有限制。将这种颜料与微控制器板配对，你就可以在短时间内创建交互式艺术、服装和项目。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_0.png)\n\n### 准备你的工具\n\n**01** 当你想到电子时，颜料和画笔并不是第一个想到的物品，所以你可能会想知道从哪里获取它们。**Bare\
    \ Conductive** 在商店 [bareconductive.com/shop](bareconductive.com/shop) 中提供颜料和一系列组件，但你还需要去别处购买艺术用品。我们建议尝试高档百货公司旁的工艺品商店，如\
    \ Hobbycraft（[hobbycraft.co.uk](hobbycraft.co.uk)）或当地独立商店。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_73_1.png)\n\
    \n"
