  - '[PAGE 8]


    # Raspberry Pi 3


    # Getting started


    **GPIO port**


    The 40 pins in the GPIO port give you a range of power and functions to control
    a project or read more data from your surroundings. This makes the Raspberry Pi
    3 the perfect core for an Internet of Things or Maker project.


    **USB ports**


    The four USB ports give you much more flexibility with the Raspberry Pi 3, allowing
    you to easily add a keyboard, mouse, wireless dongle and external storage without
    needing to constantly switch out or get a powered hub.


    **Ethernet port**


    The Pi 3 retains the wired network and internet connection that was on the Model
    B but the original Raspberry Pi B still tops out at 100 Mb, but that’s plenty
    fast enough for the Raspberry Pi.


    **Integrated wireless**


    The big update brought in with the Raspberry Pi 3 is the introduction of built-in
    802.11n wireless (Wi-Fi) and Bluetooth 4.2. Connecting to the Internet and other
    devices has never been easier.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_8_0.png)


    **Headphone jack**


    Need to listen to your Raspberry Pi playing? Connect it to a pair of portable
    speakers! The 3.5mm jack is still on the Pi 3, and is one of the higher-quality
    ones that was added to the B+


    **MicroSD**


    Underneath the board is where the boot medium lives - the microSD card. Much smaller
    than the SD card of the original, it still holds the full operating system and
    allows the Pi 3 to be much smaller.


    **HDMI port**


    The Raspberry Pi’s special ability - to decode 1080p video on-the fly with very
    little pizzelem, and the same tech still exists in the Pi 3. The HDMI port is
    basically the same, allowing for high definition video and audio.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_8_1.png)


    > “The Raspberry Pi 3 still won’t be able to power a USB hub, so if you need to
    expand the complement you’ll need to get a powered-hub”'
  - '[PAGE 9]


    # # Raspberry Pi Model A+


    Good things come in small packages: find out why the Raspberry Pi A+ is ideal
    for mobile projects.


    While the Raspberry Pi Model B+ is a step up from the Model B with its four USB
    ports, the Model A+ is smaller than its predecessor, weighing just 23g (down from
    45g) and wielding one USB port. It''s also limited to just 256MB of RAM on the
    SoC, compared to the 512MB enjoyed on the B+.


    But don''t think that all of this means that the A+ is inferior. Its 65mm length
    and lower weight


    is a clue as to how it can be used. The lack of an Ethernet port meanwhile, isn''t
    a weakness, rather an illustration of the fact that this Raspberry Pi is designed
    more for media centres and print servers, but for projects where weight is a factor.
    Perhaps you''ll mount it on an Arduino-powered robot, where its lower power requirement
    can be satisfied with a battery.


    # ## MicroSD Storage


    No more waiting whilst the SD card being snapped into or out. The Raspberry Pi
    A+ features a push-push slot for a microSD card


    # ## Connectable and flexible


    Both new Raspberry Pi models have had the GPIO header increased from 26 pins to
    40, increasing the device''s flexibility


    # ## 256 MB RAM squeezed on board


    It seems amazing that on top of all other things, there''s a System-on-Chip 700
    MHz Processor with 256 MB of RAM connected to the centre of this venerable little
    computer


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_9_0.png)


    # ## It''s smaller


    The original Raspberry Pi Model A was a credit card sized 86mm in length. The
    A+ measures in at just 65mm long!


    # ## Repositioned power socket


    With the micro USB power socket now beside the HDMI socket, it''s easier to manage
    and manage cables


    # ## It''s lighter too


    Unfortunately, the Raspberry Pi Model B is just 23.5 g (or 0.8 oz), a reduction
    in weight of almost 50 per cent'
  - '[PAGE 10]


