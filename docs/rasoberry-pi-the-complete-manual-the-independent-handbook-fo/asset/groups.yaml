    # Access your files

    with SSH


    Use the terminal of your home computer to gain quick and secure access to your
    Raspberry Pi.


    > **Did you know...**


    While remotely logging into the full X environment – as we demonstrated on the
    previous pages – very useful, it has its disadvantages. Firstly, it’s not particularly
    quick or convenient to do. The user experience can be slow and cumbersome too,
    but, worst of all, it’s not as secure as we’d really like.


    If you want to take a more convenient and secure approach to accessing your Raspberry
    Pi from another computer, you’ll find that all well-versed Pi enthusiasts will
    use SSH, SSH stands for Secure Shell and is a cryptographic network protocol which
    is designed to ensure secure data communication via the command line.


    While beginners might argue it’s easier to remotely access their Raspberry Pi
    using the full graphical interface, as soon as you’ve learnt a handful of basic
    command-line techniques you’ll quickly find ‘dipping in’ to your Raspberry Pi
    via SSH is by far the most convenient way to talk to it remotely.


    You’ll be pleased to hear that SSH is already well configured out of the box –
    there’s very little you need to do to make it work, especially if your remote
    computer runs Linux or OS X, as we’re going to demonstrate here.


    **SSH is easy with Linux and OS X**

    Assuming your Raspberry Pi is on and connected to a network either by Ethernet
    or a Wi-Fi dongle, the only piece of information you need is the IP address of
    your Pi. To discover this, all you have to do is open a terminal window on your
    Raspberry Pi and type the command `ifconfig` (Fig 1).


    If you’re connected by Ethernet cable you’ll see `eth0`, then several lines of
    results. The IP address will be the number on the second line next to words `inet
    addr`. If you’re connected by Wi-Fi-


