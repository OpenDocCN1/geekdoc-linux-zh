    \ SD 卡。在电脑上找到 SD 卡读卡器并插入。SD 卡的主要文件系统默认可以被 Linux 电脑读取，而 Windows 或 Mac 电脑在安装允许其读取\
    \ ext4 文件系统的程序（如 Ext2Fsd）后也可以读取。在 Windows 上，SD 卡将与其他驱动器一起列在“我的电脑”中（图 1）。在 Linux\
    \ 和 Mac 上，它将在菜单和文件管理器显示存储的位置列出。找到 SD 卡后，打开它并导航到 home 然后进入 pi 目录。这里可以找到文档、下载、桌面和其他目录。你需要做的只是选择要复制的文件，并将它们移动到电脑上的安全目录或连接的外置硬盘上。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_39_0.png)\n\n**你需要...**\n- 第二台电脑\n\
    - 外部存储设备\n\n> **你知道吗...**\n>\n> 一些笔记本电脑和电脑上可以找到 SD 卡控制器（或“写保护”）。这允许你创建只属于自己的文件的备份，其他人无法删除。\n\
    \n如果你想将文件保留在另一台电脑上，那也没问题，但从长远来看，它容易遇到与树莓派完全相同的问题。将它们保存在外置硬盘上是个好主意，而将其放在云存储服务上则更好，这样你可以在任何有互联网连接的地方访问它们（图\
    \ 2）。\n\n### 克隆\n\n创建克隆取决于你主电脑上使用的操作系统。对于 Mac 和 Linux，你可以使用一个简单的命令行工具 `dd` 来创建\
    \ SD 卡的精确副本（图 3）。这是在终端模拟器或命令行中完成的，所以请首先调出它。确保 SD 卡已插入，然后输入：\n\n```\n$ ls /dev/sd*\n\
    ```\n\n这将列出所有连接的存储设备。SD 卡将有 2.4 或 8GB 的空间，具体取决于其大小。它可能被列为 /dev/sdb 之类的名称，其中 x\
    \ 是电脑分配给 SD 卡的字母。要使用 dd 复制它，请在终端中输入以下内容：\n\n```\n$ dd if=/dev/sdX of=/backup.img\
    \ bs=512\n```\n\n你还可以添加正在创建的镜像的路径，将其放入特定文件夹。这个过程需要一些时间，并且会生成一个多吉字节大小的文件，你可以通过反转上一条命令将其写入\
    \ SD 卡：\n\n```\n$ dd if=/backup.img of=/dev/sdX bs=512\n```\n\n虽然这作为备份很有用，但你还可以使用镜像批量生产\
    \ SD 卡，送给朋友或保留在使用树莓派的各种地方。\n\n### Windows\n\n要在 Windows 上创建克隆，我们可以使用 Win32 Disk\
    \ Imager（图 4）。从这里下载并安装：bit.ly/LBJdYG。\n\n安装完成后，插入 SD 卡并启动软件。为备份文件选择一个名称，并从设备列表中选中\
    \ SD 卡。现在按下“读取”，它将创建备份文件。同样，这可能需要一段时间；不过，这次你至少可以看到进度条。\n\n存储克隆图像比保存“重要文件”稍微困难一些——图像大小为吉字节级别，这会填满许多云存储服务。如果你有空间，务必将其保留在那里；然而，你可能需要将其放在外置硬盘上。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_40_0.png)\n\n图 1：从另一台电脑访问 SD 卡。这是通过\
    \ U 盘在机器之间传输文件的便捷替代方案。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_40_1.png)\n\
    \n图 2：云存储服务使文件备份变得简单且安全，因为它们遇到问题的概率要低得多。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_40_2.png)\n\
    \n图 3：dd 工具是你在 Linux 和 Mac 电脑上使用的工具，它在终端模拟器中默认可用。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_40_3.png)\n\
    \n图 4：Win32 Disk Imager 使备份整个操作系统变得容易，甚至可以使用它将镜像写回 SD 卡。\n\n## 项目\n\n### nano\
    \ 入门指南\n\n你需要\n- **完整的 nano 手册**\n- www.nano-editor.org/dist/v1.2nano.1.html\n\
    \n学习如何使用 Linux 最好的工具之一在命令行和终端中编辑文本\n\n> ### 你知道吗 . . .\n\n如果你想在树莓派上做得更多，你需要学习的一项技能是编辑系统文件的能力，以完成许多项目。命令行文本编辑器\
    \ nano 绝对是该工作的最佳工具之一。文本编辑器是非常基本的工具；顾名思义（在这种情况下）。它没有你会在文字处理软件中看到的格式化、颜色或类似功能，但这就是重点。你要创建或编辑的文件通常包含代码——不需要加粗或使用项目符号的代码。nano\
    \ 消除了所有这些干扰因素，但仍然保留了一些你在图形化文本编辑器中会找到的实用功能。我们将教你如何充分利用 nano，使你的项目运行得快速且高效。\n\n\
    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_41_0.png)\n\n- ### 编写\n  在命令行中创建纯文本文件，甚至为程序编写一些代码\n\
    \n- ### 编辑\n  根据你的需求和项目编辑系统文件，无需在文件管理器中翻找\n\n- ### 高级功能\n  使用 nano 的一些内置功能搜索、复制、粘贴以及从另一个文件插入文本\n\
    \n"
