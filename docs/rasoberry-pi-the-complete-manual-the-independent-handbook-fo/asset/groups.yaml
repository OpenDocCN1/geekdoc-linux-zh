    ## GPIO 端口解析

    了解如何利用树莓派上 GPIO 端口的强大功能。它比你想象的更简单...


    树莓派上的通用输入/输出（GPIO）引脚通常是你将在本书中找到的项目成功的关键。没有它们，你就无法与现实世界进行交互，无论是触发灯光、按钮或蜂鸣器，还是读取传感器。


    GPIO 引脚并非树莓派独有；它们实际上是一种旨在帮助控制各种集成电路的输入和输出行为的标准。通常你会发现任何一个 GPIO 引脚没有预定义的特定用途，它们默认是关闭的。


    ## 树莓派 GPIO

    树莓派上的 GPIO 引脚可以通过多种方式控制和触发。你可以直接从终端和 Bash 脚本中使用它们，也可以使用专为流行编程语言设计模块来控制它们。由于 Python
    是树莓派的官方语言，你会发现 Python 的 GPIO 模块提供了可用的输入和输出中最好的控制之一。该库名为 **RPi.GPIO** 并默认安装在所有树莓派上，但也可以以安装任何有用的
    Python 库的方式安装。该项目托管在 SourceForge 上，可以在 [sourceforge.net/projects/raspberry-gpio-python](sourceforge.net/projects/raspberry-gpio-python)
    找到。你还会找到有用的链接、信息以及如何在简单的 Python 脚本中使用和控制 GPIO 引脚的示例。如果你计划使用 RPi.GPIO，了解一些基本的 Python
    知识会很有帮助，因此我们推荐像 [www.codecademy.com](www.codecademy.com) 上发现的基础入门课程，或者通过阅读 [www.python.org/doc](www.python.org/doc)
    上的官方 Python 文档。


    树莓派上有 26 个 GPIO 引脚，你可以按任意方式使用其中大部分。不过，有几个引脚具有特殊用途，因此我们建议你熟悉它们的布局。例如，最上面一行的引脚旨在为按钮和灯光等外部设备提供电源。由于需要地线（通常称为“接地”）来安全地创建电路，你还会发现
    GPIO 端口中有几个接地引脚。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_35_0.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_36_0.png)


    > 熟悉 GPIO 引脚的布局及其功能 – 有些具有特殊用途，例如接地电源。


    ## 如何使用 GPIO 引脚

    要利用 GPIO 端口的强大功能，你需要一些基本组件。最重要的是跳线。由于端口上的引脚是“公头”，你需要购买“母对公”或“母对母”电缆，具体取决于你打算将什么硬件连接到你的树莓派。假设你要连接的设备也有公头连接器，“母对母”跳线就很好。但通常你会使用面包板来制作电路原型，在这种情况下，“母对公”连接器是首选。电缆和面包板可以以非常便宜的价格从几乎所有销售树莓派配件的在线商店购买，通常可以在商店的“原型制作”部分找到。


    ## 命名约定

    一旦你准备好连接设备，下一个任务是找到合适的引脚。虽然确实所有 GPIO 端口都是多用途的，但有些比其他人更通用！正如我们已经发现的，一些引脚是保留用于 5V、3.3V
    和接地的。其他引脚也具有特殊功能。但更重要的是，它们也可以被称为不同的名称。例如，GPIO 18 也被称为引脚 12 和 PCM_CLK。这个特定的引脚（位于
    GPIO 端口右侧中部）能够进行硬件脉宽调制（PWM），并用于控制 LED 灯光和电机等其他事物。


    你在 Python 脚本中使用的引脚命名约定可以手动设置。这可以设置为 BCM（博通引脚名称）或物理引脚位置（BOARD）。


    在我们使用 GPIO 端口的任何项目中，你都会看到括号中包含 BCM 或 BOARD 的以下行：


    ```

    GPIO.setmode(GPIO.BCM)

    ```


    处理 GPIO 引脚命名问题的最简单方法是选择一种约定并坚持下去。


    > 你知道吗...


    ## 四大附加板

    使用这些附加板扩展树莓派的功能，从而发挥更多潜力


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_37_0.png)


    ## Pi Supply 开关 £15

    树莓派的流行部分归功于其硬件极高的性价比：它在价格范围内表现出色，而且由于它是由慈善机构设计的，因此不需要通过高额利润来抬高价格（想想它作为商业产品会多少钱）。不幸的是，与任何低成本产品一样，为了以如此实惠和紧凑的形式呈现，必须做出一些妥协。


    与更标准的台式机或笔记本电脑相比，显然缺少两样东西：电源开关和电源管理功能。令人惊讶的是，像电源开关这样简单的东西是如此有用，直到你没有它时才意识到这一点。


    Pi Supply 开关是一个自焊接套件，提供了一个开、关和软关（即安全关机）按钮，为你的 Pi 提供基本的电源管理功能。通过提供一些简单的脚本，你可以确保在关闭时
    Pi 正确关机 – 无需打开任何菜单或在终端中发出任何命令 – 开关中的电路确保只有在 Pi 关机后才切断电源。除了为你带来更大的便利外，它还减少了因过早拔掉电源线而导致
    SD 卡损坏的可能性。


    ## PiTFT Mini 套件 £30

    这是一个 2.8 英寸的电容式 TFT-LCD 触摸屏，由 Adafruit 的项目专家专门为树莓派设计。它能够直接放置在树莓派上方，大小与 Pi 本身相当。


    有很多理由想在树莓派上添加这样的屏幕，但它们总体上归结为树莓派非常小巧且便携，而大多数显示器并非如此。虽然你可以在外出时通过 VPN 从手机远程连接，但屏幕直接连接到
    Pi，不涉及复杂的无线网络。此外，作为触摸屏，你无需携带其他输入设备，因为它由树莓派供电。


    这开启了一个充满可能性的世界。便携式电脑、触摸屏控制板、视频摄像头……任何能从树莓派配备屏幕和人工输入中受益的场景，尤其是在远离主显示器时。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_37_1.png)


    '
