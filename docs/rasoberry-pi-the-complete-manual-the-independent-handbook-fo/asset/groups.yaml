    # Get alerts with the Raspberry Pi baby monitor


    Keep an eye on your little one while they sleep, thanks to your Raspberry Pi!


    While you''re settling down to enjoy a boxset, there''s always that nagging feeling
    at the back of your mind \u2013 is the baby okay? We need to rely on baby monitors,
    specifically video monitors, in particular those that display footage on an app
    or by opening an IP address in a mobile browser. Add in some motion detection
    and alert software, and you''ve got an incredibly useful tool \u2013 which, the
    Raspberry Pi can do for a fraction of the cost. All you''ll need is a Raspberry
    Pi (the newer the better), and a USB webcam or the PiCam (the NoIR infrared version
    is even more suited to nighttime use), and a device to view the streamed footage
    on.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_95_0.png)'
