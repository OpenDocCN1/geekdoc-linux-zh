    Gracefully shutting down from SIGINT (Ctrl-C)\");\n pwm.stop();\n return process.exit();\n\
    \ });\n```\n\n## Xbox Zero arcade\n\nLet's make a self-contained arcade machine\
    \ out of old bits of kit, a spare Xbox pad and a Pi Zero!\n\n### What you'll need...\n\
    \n- Raspberry Pi Zero\n- Original Xbox controller\n- Wire cutters\n- Craft knife\n\
    - Isopropyl alcohol swabs\n- Micro SD card\n- BluTack\n- Micro USB OTG cable\n\
    - Cross-head screwdriver\n- Electrical tape\n- 2A micro USB power supply\n- Mini\
    \ HDMI cable/adapter\n\nThe Raspberry Pi Zero is tiny, ridiculously tiny. It's\
    \ also small enough to be hidden in a variety of household objects in order to\
    \ enhance their capabilities. Whatever you can find to fit it in, you can turn\
    \ into some kind of smart machine.\n\nTake old game controllers. If you're anything\
    \ like us you've probably got a couple of boxes full of old computer equipment\
    \ you just can't bear to throw away – an Atari Jaguar that hasn't been touched\
    \ since the 90s, a Sega Dreamcast which you're sure you'll plug in again one day,\
    \ an old Xbox that lies languishing since you picked up something bigger and better.\
    \ Turns out it actually was useful to keep them around – it's time to bring these\
    \ old systems back to life.\n\nWe're going to show you how to gut an old videogames\
    \ controller, replace its innards with a Raspberry Pi Zero, and then load it up\
    \ with a treasure trove of retro games. From start to finish, this project should\
    \ take you under an hour to complete – and then you'll be able to load up the\
    \ ROMs you legally own on your new console and enjoy them from the comfort of\
    \ your sofa.\n\n### Gather your equipment\n\n01 While the Zero doesn’t take up\
    \ much space, videogame controllers are often substantial. The trick here is to\
    \ find a games controller which has enough space inside for the Zero. We’re going\
    \ to be using the original Xbox controller, nicknamed The Duke. If you don’t have\
    \ one to hand, they can be picked up for a couple of quid from most second-hand\
    \ electronics shops, and they’re easily found online too. If you can’t find one,\
