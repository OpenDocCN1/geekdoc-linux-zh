    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_65_0.png)\n\n### 给你的 Pi 充电（Supercharge）\n\
    \n### 配置 fstab 以获得快速性能\n\n- 07 重启后，虚拟文件系统将被挂载，并且 RAM 磁盘上的 /var/log 将生效。其他可以移动到\
    \ RAM 的目录包括：\n\n```\ntmpfs  /tmp    tmpfs     defaults,noatime,nosuid,size=512m\
    \    0 0\ntmpfs  /run    tmpfs     defaults,noatime,nosuid,size=512m    0 0\n\
    tmpfs  /var/log  tmpfs     defaults,noatime,nosuid,mode=0755,size=100m  0 0\n\
    tmpfs  /var/spool  tmpfs     defaults,noatime,nosuid,mode=0755,size=10m  0 0\n\
    tmpfs  /var/spool/queue  tmpfs     defaults,noatime,nosuid,mode=0700,gid=12,size=30m\
    \  0 0\n```\n\n将每一项添加到 /etc/fstab 中，使用 nano 编辑器。\n\n### 将你的操作系统移动到硬盘\n\n- 08 如果你担心\
    \ SD 卡的使用寿命，为什么不减少树莓派对它的依赖呢！不要将 SD 卡用作一种廉价 SSD，而是改变其角色，添加一个硬盘或 U 盘来运行操作系统，而将 SD\
    \ 卡保留用于引导。这可以显着提升 SD 卡的性能。\n\n### 备份 SD 卡\n\n- 09 创建 Pi SD 卡的副本。关机，移除卡并将其插入台式计算机。在命令行中运行：\n\
    \n```\nsudo dd bs=4M if=/dev/sdb of=/backup.img\n```\n\n路径 /dev/sdb 代表 SD 卡。复制需要\
    \ 5-10 分钟。完成后，移除 SD 卡并连接你的 USB 设备。\n\n### 将 Raspbian 复制到 USB\n\n- 10 使用一块空白的 ext4\
    \ 格式化的 USB 拇指驱动器（或外部硬盘）作为目标驱动器，输入：\n\n```\nsudo dd bs=4M if=/backup.img of=/dev/sdc\n\
    ```\n\n保留计算机上的备份，以防万一出现问题。当 SD 卡和 USB 存储设备共享相同的磁盘镜像时，是时候考虑接下来要做什么了——创建一个更快的树莓派。\n\
    \n### 分割 Raspbian 分区\n\n- 11 通常，boot 分区应保留在 SD 卡上，而根文件系统则从外部硬盘或 USB 拇指驱动器运行。使用你首选的分区管理器（大多数发行版都有磁盘工具），卸载并删除\
    \ SD 卡上的根文件系统（确保你保留了 boot 分区）。移除 SD 卡后，连接你的 USB 设备并删除 boot 分区，注意保留根文件系统完好无损。然后调整\
    \ USB 设备上的根文件系统大小，确保你的 10MB 保持不变。\n\n### 识别根文件系统\n\n- 12 你将同时连接 SD 卡和外部 USB 存储，因此你需要告诉\
    \ Pi 根文件系统在哪里。在 Pi 上，插入你的外部 USB 驱动器，并在插入 SD 卡的情况下运行：\n\n```\nsudo nano /boot/cmdline.txt\n\
    ```\n\n找到 **root=/dev/mmcblk0p2**（或类似内容）并将其更改为 **root=/dev/sdb2**，这是你的外部 USB 存储。保存并退出。\n\
    \n### 添加其他 USB 设备\n\n- 13 现在你可以重启你的 Pi 了。插入存储设备并观察它们附着。一旦你连接更多 USB 媒体，你就会遇到问题。通过安装\
    \ gdisk 来避免这种情况：\n\n```\nsudo apt-get install gdisk\n```\n\n然后运行 gdisk。\n\n```\n\
    sudo gdisk /dev/sdb\n```\n\n输入 'h' 显示选项并选择 **恢复和转换选项**（通常是 'r'，然后按 'L' 和 'M2'）。**新建\
    \ GPT：按 'Y'。** 最后一次操作，我们就完成了。最后写入 'Backup to Disk'。这将采用 USB 驱动器并创建一个带有 10MB 分区的\
    \ GPT。你将使用最后一个分区作为你的时间。你将使用 1 作为根文件系统。\n\n*(注：原文最后两句 \"You'll use the last partition\
    \ as your time. You'll use 1 as the root filesystem.\" 语义较为模糊，可能是原文错误，此处按直译处理)*\n\
    \n### 让你的 Pi 快速且可靠\n\n- 14 现在记下 GUID，然后切换到 SD 卡。重新打开 cmdline.txt，将 root=/dev/mmcblk0p2\
    \ 更改为 root=PARTUUID=XXXXXX，其中 XXXXXX 应被分区唯一 GUID 的数值字符串替换。完成后，保存并退出。然后你可以启动你的树莓派。恭喜你，你的树莓派现在更快且更可靠了。\n\
    \n### 通过超频提升性能\n\n- 15 你的 Pi 几乎没有可以超频计算机的可能性。虽然你应该意识到风险，但仍应进行此活动。你还应确保你的树莓派的处理器得到适当冷却——CPU、以太网控制器和电源调节器的散热器可以在网上购买。\n\
    \n### 超频你的 Pi\n\n- 16 可以通过 raspi-config 进行超频。从命令行启动：**sudo raspi-config** 并导航到高级选项。然后选择超频。有三个选项可用：**Modest**（温和）、**Medium**（中等）、**High**（高）和\
    \ **Turbo**（涡轮）。选择你理想的时钟速度后，退出。选择 **Yes** 以应用。\n\n```\nsudo shutdown -r now\n\
    ```\n\n你需要执行测试来看看它的稳定性如何。例如，你运行压力测试：**sudo apt-get stress**。这是一个很好的压力测试。如果 Pi\
    \ 无法启动，按住 Shift 键以无超频方式启动，运行 raspi-config 并选择更温和的超频。\n\n### 无 GUI 运行 Raspbian\n\
    \n- 17 尽管有所改变，你可能会发现 GUI 意味着缓慢。如果你更愿意在 bash 中运行大量命令，一种方法是禁用 X。在 raspi-config 中，选择启动行为并选择第一个（默认）选项，以确保你的\
    \ Pi 启动到命令行。如果你需要 GUI，在终端中输入 'startx'。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_66_0.png)\n\
    \n## 使用 NagiosPi 监控你的本地网络\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_67_0.png)\n\
    \n### 你需要什么...\n\n- NagiosPi\n  - [pimylpihu...com/project/nagiospi](https://example.org/pimylpihu...com/project/nagiospi)\
    \ *(注：原文未提供完整链接，此处保留原样文本)*\n- Win32 Disk Imager\n  - [bit.ly/1DM7Tj](https://bit.ly/1DM7Tj)\n\
    - 磁盘工具 (Disk Utility)\n  - [bit.ly/1c055](https://bit.ly/1c055)\n- 互联网连接\n- 4\
    \ GB（或更大）SD 卡\n\n### 使用 NagiosPi 监控你的本地网络\n\n拥抱 Nagios 的强大功能，密切关注你网络上的服务器、交换机和应用程序\n\
    \n你的 PC 离线了吗？你的 Linux 盒子停止提供 Minecraft 或 Counter-Strike 服务了吗？如果你不在家，甚至不在国内，如果没有尝试登录，就没有真正的方法知道——而如果没有在场，你很可能无法做到（除非你使用远程桌面软件）。\n\
    \n一个更好的方法是简单地接收通知，当你的网络设备离线时，这就是为什么我们转向 NagiosPi，这是基于树莓派构建的流行开源网络监控工具的版本。\n\n\
    NagiosPi 可以作为完整的镜像提供，准备好写入 SD 卡，真正的配置将在启动并运行后发生。让我们开始吧。\n\n### 下载 NagiosPi\n\n\
    Windows 用户应使用 Win32 Disk Imager 将 NagiosPi_2.4.2.zip 文件解压后的内容写入格式化的 SD 卡。Linux\
    \ 桌面用户可以使用磁盘工具或命令行（file/ls713358）。将镜像写入 SD 卡后，安全弹出卡并将其插入 Pi 后再启动。\n\n### 登录 NagiosPi\n\
    \n对于大多数 Pi 项目，你可能希望通过 SSH 操作，因此检查路由器的连接设备列表以找到 Pi 的地址并连接。你也可以使用连接到树莓派的键盘和显示器。NagiosPi\
    \ 的默认用户名和密码是 pi/piwos，pi/parberry。\n\n### 扩展文件系统\n\n在继续之前，运行 `sudo raspi-config`。你需要选择第一个选项，扩展文件系统，并稍等片刻，让文件系统扩展到\
    \ SD 卡的全部大小。完成后，选择更改用户密码以增加 NagiosPi 的安全性，然后选择完成并重启。\n\n### 在浏览器中打开\n\n重启 Pi 后，你将在浏览器中打开\
    \ NagiosPi 网站。访问 http://npiwos/Address。在这里查看可用选项。这里你会发现左侧有一个链接菜单，许多页面都配有用户名和密码以登录。从\
    \ RaspControl 开始：\n\n> 欢迎使用 NagiosPi v1.1.0\n>\n> NagiosPi：使用易于部署的开源工具监控网络状况的网络监控器。仅使用\
    \ Nagios，你就可以监控本地或远程网络上的服务。这是一个来自 Sapiens AI 的开源项目，NagiosPi 旨在尽可能用户友好，Web UI 为您提供监控网络所需的所有工具，并集中在一个位置。\n\
    >\n> 默认用户名和密码：pi / piwos\n\n**附加资源**\n\n- [Nagios 维基](https://example.org/nagios_wiki)\n\
    - [Nagios 书籍](https://example.org/nagios_books)\n- [Nagios 论坛](https://example.org/nagios_forums)\n\
    - [Nagios 博客](https://example.org/nagios_blog)\n\n更多详情请查看我们的网站：看看 Kubuntu.com\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_68_0.png)\n\n### 监控你的 NagiosPi 盒子\n\
    \n在 RaspControl 部分，你可以领略 Nagios 能做什么。在主屏幕上，你会看到诸如连接性和系统状态等通用硬件信息，当你翻阅详细信息、服务和磁盘时，你会发现监控的层次。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_68_1.png)\n\n### 查看主机状态\n\n接下来，转到 Nagios\
    \ 并选择主机。在这里你将看到配置的主机的当前状态，这是本地网络上检测到的项和预设实体的组合。在控制台的左上区域寻找当前网络状态，在此下方你会发现替代视图。\n\
    \n### 添加要监控的主机\n\n打开 NagiCon 以添加你要监控的服务器，使用设备主机名、IP 地址和别名。完成后点击提交，然后切换到服务 - 添加！在那里你可以分配名称和检查命令（如\
    \ check_ping）来监控。\n\n### 创建配置文件\n\n每个检查都必须单独设置。一些需要在远程设备上安装 NRE（Nagios Remote\
    \ Plugin Executor）以整合并提供完整的系统详细信息，但对于像 ping 这样的基本事项并不需要。完成后，点击提交，然后生成 Nagios 配置。接着，选择部署。\n\
    \n### 监控你的服务器\n\n在 NagiosPi 窗口中，选择服务以查看当前监控的服务器和设备。对于每个列出的设备，你将在该列中找到更多信息。NagiosPi\
    \ 只显示 NagiosPi 的基础——深入调查将展示它到底有多强大！\n\n"
