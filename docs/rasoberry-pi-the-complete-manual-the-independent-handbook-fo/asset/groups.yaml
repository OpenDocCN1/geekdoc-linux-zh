    03 After you''ve entered these details, exit nano by pressing Ctrl-X, followed
    by Y to accept the changes, and then press Enter a couple of times to get back
    to the command prompt in the terminal. You can now either reboot your Pi, or type
    the following into the terminal.


    ```bash

    sudo /etc/init.d/networking stop

    sudo /etc/init.d/networking start

    ```


    ## Installing VNC part 1


    Now reinstall VNC and ensure that it starts automatically, whenever the operating
    system does. We don''t need to worry about the Raspberry Pi versions, as configuring
    services often had a nasty habit of breaking the system. But no longer. Enter
