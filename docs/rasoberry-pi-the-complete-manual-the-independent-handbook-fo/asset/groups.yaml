  - '[PAGE 30]


    then finally, a new IP address for the Wi-Fi connection will appear. If you click
    on the Manage Networks tab, the network will now be listed and have an Enabled
    radio button active. To get on the Internet, simply launch Empathy and you''ll
    be connected. The Wi-Fi utility will remain running on the bottom right of the
    panel. If you right-click on the Wi-Fi icon you will see options to Disconnect
    or Reconnect, event history and the results of the most recent scan. Click on
    Status to see how it''s performing.


    # Checking the connection


    To check that the Pi has a valid internet connection, double-click on LXTerminal.
    Enter this command:


    ```

    ip addr

    ```


    You should see a list of numbers, with the bottom line starting `inet` and then
    the IP address of the Pi connection (Fig 3). Typically this is something like
    192.168.1.11 and this shows that the connection is working because the Pi has
    been assigned an IP address based on the one used by your internet modem/router.
    If this doesn''t come up then there may be a problem at the router end. The modem/router
    should be running a DHCP server and when the Pi connects to it, it will be given
    the IP address. If it isn''t running then nothing else connected to it will be
    able to access the internet either.


    Use the web interface with another device to log onto 192.168.1.0 or whatever
    is your modem''s actual IP address in order to check that the DHCP server service
    is turned on. Finally, in the terminal, type:


    ```

    ping google.com

    ```


    # Sharing a connection


    If you don''t have a Wi-Fi dongle, a powered USB hub or a long enough Ethernet
    cable, but do have another computer connected to the internet, there''s another
    way of getting access. On a Mac, connect it to the Pi via a USB or Ethernet cable.
    Launch System Preferences> under Internet & Wireless, click on Sharing. Click
    on Internet Sharing, then select Wi-Fi (for AirPort) as the connection type to
    share, and select how the Pi is connected to your Mac (Fig 4).


    On a Windows PC, go to Windows Explorer> Network> Networking and Sharing Center>
    Change Adapter Settings.


    # Get online


    # Getting started


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_0.png)


    Fig 3 If it doesn''t look like the connection is working, there are some easy
    ways of checking what''s going on


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_1.png)


    Fig 4 Both Windows and Mac computers can share their internet connections with
    a directly-connected Pi'
  - '[PAGE 31]


    # # Getting started


    # ## What you''ll need...


    **Apt command help page:** http://linux.die.net/man/8/apt


    **Apt-get help page:** https://manpages.debian.org/man8/apt-get.8.html


    # ### Did you know...


    The Raspberry Pi is a near-perfect mini computer. It already contains a wealth
    of educational software, a few games, some programming utilities and a number
    of system tools. But, as with most computers, this is only the tip of the proverbial
    iceberg. By installing more programs, you can do much more.


    # # Install and use packages


    # # Install and use packages


    The Raspberry Pi is great, but it’s made better with the software you install
    onto it.


    On its own, the Raspberry Pi is a near-perfect mini computer. It already contains
    a wealth of educational software, a few games, some programming utilities and
    a number of system tools. But, as with most computers, this is only the tip of
    the proverbial iceberg. By installing more programs, you can do much more.


    These programs, known as packages, are as wide and as varied as the developers
    who originally designed them. In Linux, if there’s a need for a particular program,
    then someone develops one. They then put it out to the world and make the source
    code freely available, hence ‘open source’. Once the program has been tested,
    it will eventually make its way onto one of the many remote servers for that particular
    Linux distro.


    These remote servers, called repositories, or repos, contain all the elements
    of the package in order for it to be downloaded and installed onto your system.
    The process is very quick and easy once you know how it’s done...


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_31_0.png)'
  - "[PAGE 32]\n\n# Update and upgrade\n\n+   01 Getting hold of a package\n+   Dropping\
    \ into the command-line terminal, via the LXTermimal icon on the desktop, and\
    \ entering a few commands. But before we do that, we need to make sure the system\
    \ is up to date. Enter the following into the terminal:\n+   ```\n+   sudo apt-get\
    \ update\n+   sudo apt-get upgrade\n+   sudo apt-get update && sudo apt-get upgrade\n\
    +   ```\n\n# Search for a package\n\n+   02 The apt-get command (Advanced Package\
    \ Tool) is the key to downloading and installing packages on the Raspberry Pi.\
    \ In the previous instance, we updated the existing packages and system, upgraded\
    \ any that needed it, and updated the current package list. Now, let's search\
    \ the list of server packages for available games.\n+   ```\n+   apt-cache search\
    \ game | less\n+   ```\n\n# Apt searching\n\n+   03 The current list you find\
    \ yourself in is the name of all the packages labelled as 'games' from the available\
    \ server. In the list, the part before the hyphen tells you the name of the package,\
    \ which is what you will need to know to be able to install it. Use the arrow\
    \ keys up/down to navigate, press 'Q' to exit\n\n# Install and use packages\n\n\
    # Installing a package\n\n+   04 Using the up and down arrow keys, navigate the\
    \ list. If you find something you like the look of, say Angry Drunken Dwarves,\
    \ remember the name of the package, in this case angryd2, and press 'Q' to exit\
    \ the list. To install the package, enter the following in the terminal:\n+  \
    \ ```\n+   sudo apt-get install angryd2\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_0.png)\n\
    \n# Executing the package\n\n+   05 The result of the previous command should\
    \ be the successful download and installation of the game, Angry Drunken Dwarves.\
    \ To execute the newly installed package, you can either run it from the LXDE\
    \ Menu under Games->Angry Drunken Dwarves, or by typing in the following into\
    \ the terminal:\n+   ```\n+   angryd2\n+   ```\n\n# Remove a package\n\n+   06\
    \ This installing of packages is perfectly fine, and you can see just how powerful\
    \ a command Apt really is. But, what if you want to remove a package?\n+   Using\
    \ the Apt command again, let's say we want to completely remove all the trace\
    \ of Angry Drunken Dwarves from the Raspberry Pi.\n+   ```\n+   sudo apt-get --purge\
    \ remove angryd2\n+   ```\n+   Enter \"Y\" to accept the removal.\n\n# Getting\
    \ started\n\n# Apt Easter eggs\n\n+   07 The Apt command is a shorter, non-menu-driven\
    \ variant of the Aptitude command. This command has a long history in Linux, and\
    \ as a result has some rather special features, also known as Easter eggs. Purely\
    \ for a bit of fun, type in the following commands and see the results:\n+   ```\n\
    +   aptitude moo\n+   aptitude -v moo\n+   aptitude -vv moo\n+   aptitude -vvv\
    \ moo\n+   aptitude -vvvv moo\n+   aptitude -vvvvv moo\n+   aptitude -vvvvvv moo\n\
    +   sudo apt-get moo\n+   ```\n\n# Man the Apt command\n\n+   08 As you can see,\
    \ there is more to the simple Apt command than what first meets the eye. There\
    \ are many different sub-commands you can run, and many different variations in\
    \ which to run them.\n+   \n+   If you want to see what else the Apt command can\
    \ do, enter the following:\n+   ```\n+   man apt\n+   ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_1.png)"
  - "[PAGE 33]\n\n# # Getting started\n\n### What you'll need...\n\n**Synaptic:**\n\
    www.nongnu.org/synaptic/\n\n## Use graphical installations\n\n# # Use graphical\
    \ installations\n\n*Would you prefer a graphical interface to install new programs?\
    \ If so, then read on...*\n\nIf you're new to Linux, you may find using its built-in\
    \ Apt package management tool a bit intimidating and confusing. The apt-get command\
    \ is used for installing applications through the internet, connecting to the\
    \ remote servers – called repositories – which house the programs as packages.\
    \ But it is used through the terminal command prompt, which can be daunting, so\
    \ we need an alternative: a desktop environment interface method of getting hold\
    \ of packages.\n\nThis is where Synaptic comes in. Synaptic is a friendly-looking\
    \ graphical interface to the apt-get terminal command which allows you to manage\
    \ your application installations, and removals, through the already familiar desktop\
    \ environment. Think of it as a kind of online shop where you can pick and choose\
    \ the programs you want and have them downloaded and installed onto your Raspberry\
    \ Pi without you having to drop into the terminal.\n\n### Did you know... \nRaspberry\
    \ Pi runs the latest version of Debian Linux, complete with the latest packages\
    \ for all the different desktop environments such as Cinnamon, XFCE, LXDE and\
    \ GNOME.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_33_0.png)\n\n**Upgrade entire\
    \ systems**\nSynaptic has the ability to upgrade and update every program or package,\
    \ and can upgrade your entire system to the latest version\n\n**Install and more**\n\
    Synaptic is a very powerful tool. With it you can install, remove, upgrade and\
    \ downgrade single, or multiple packages and programs\n\n**Browse all documentation**\n\
    From within Synaptic, you are able to browse and read all available online documentation\
    \ related to a package or program\n\n**Easily find programs**\nSynaptic enables\
    \ you to easily locate packages and programs by name, description, version and\
    \ even by who developed the program"
  md: "\nthen finally, a new IP address for the Wi-Fi connection will appear. If you\
    \ click on the Manage Networks tab, the network will now be listed and have an\
    \ Enabled radio button active. To get on the Internet, simply launch Empathy and\
    \ you'll be connected. The Wi-Fi utility will remain running on the bottom right\
    \ of the panel. If you right-click on the Wi-Fi icon you will see options to Disconnect\
    \ or Reconnect, event history and the results of the most recent scan. Click on\
    \ Status to see how it's performing.\n\n## Checking the connection\n\nTo check\
    \ that the Pi has a valid internet connection, double-click on LXTerminal. Enter\
    \ this command:\n\n```\nip addr\n```\n\nYou should see a list of numbers, with\
    \ the bottom line starting `inet` and then the IP address of the Pi connection\
    \ (Fig 3). Typically this is something like 192.168.1.11 and this shows that the\
    \ connection is working because the Pi has been assigned an IP address based on\
    \ the one used by your internet modem/router. If this doesn't come up then there\
    \ may be a problem at the router end. The modem/router should be running a DHCP\
    \ server and when the Pi connects to it, it will be given the IP address. If it\
    \ isn't running then nothing else connected to it will be able to access the internet\
    \ either.\n\nUse the web interface with another device to log onto 192.168.1.0\
    \ or whatever is your modem's actual IP address in order to check that the DHCP\
    \ server service is turned on. Finally, in the terminal, type:\n\n```\nping google.com\n\
    ```\n\n## Sharing a connection\n\nIf you don't have a Wi-Fi dongle, a powered\
    \ USB hub or a long enough Ethernet cable, but do have another computer connected\
    \ to the internet, there's another way of getting access. On a Mac, connect it\
    \ to the Pi via a USB or Ethernet cable. Launch System Preferences> under Internet\
    \ & Wireless, click on Sharing. Click on Internet Sharing, then select Wi-Fi (for\
    \ AirPort) as the connection type to share, and select how the Pi is connected\
    \ to your Mac (Fig 4).\n\nOn a Windows PC, go to Windows Explorer> Network> Networking\
    \ and Sharing Center> Change Adapter Settings.\n\n## Get online\n\n# Getting started\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_0.png)\n\nFig 3 If it doesn't look\
    \ like the connection is working, there are some easy ways of checking what's\
    \ going on\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_1.png)\n\nFig 4 Both\
    \ Windows and Mac computers can share their internet connections with a directly-connected\
    \ Pi\n\n# What you'll need...\n\n**Apt command help page:** http://linux.die.net/man/8/apt\n\
    \n**Apt-get help page:** https://manpages.debian.org/man8/apt-get.8.html\n\n##\
    \ Did you know...\n\nThe Raspberry Pi is a near-perfect mini computer. It already\
    \ contains a wealth of educational software, a few games, some programming utilities\
    \ and a number of system tools. But, as with most computers, this is only the\
    \ tip of the proverbial iceberg. By installing more programs, you can do much\
    \ more.\n\n# Install and use packages\n\nThe Raspberry Pi is great, but it’s made\
    \ better with the software you install onto it.\n\nOn its own, the Raspberry Pi\
    \ is a near-perfect mini computer. It already contains a wealth of educational\
    \ software, a few games, some programming utilities and a number of system tools.\
    \ But, as with most computers, this is only the tip of the proverbial iceberg.\
    \ By installing more programs, you can do much more.\n\nThese programs, known\
    \ as packages, are as wide and as varied as the developers who originally designed\
    \ them. In Linux, if there’s a need for a particular program, then someone develops\
    \ one. They then put it out to the world and make the source code freely available,\
    \ hence ‘open source’. Once the program has been tested, it will eventually make\
    \ its way onto one of the many remote servers for that particular Linux distro.\n\
    \nThese remote servers, called repositories, or repos, contain all the elements\
    \ of the package in order for it to be downloaded and installed onto your system.\
    \ The process is very quick and easy once you know how it’s done...\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_31_0.png)\n\
    \n## Update and upgrade\n\n01 Getting hold of a package\nDropping into the command-line\
    \ terminal, via the LXTerminal icon on the desktop, and entering a few commands.\
    \ But before we do that, we need to make sure the system is up to date. Enter\
    \ the following into the terminal:\n\n```\nsudo apt-get update\nsudo apt-get upgrade\n\
    sudo apt-get update && sudo apt-get upgrade\n```\n\n## Search for a package\n\n\
    02 The apt-get command (Advanced Package Tool) is the key to downloading and installing\
    \ packages on the Raspberry Pi. In the previous instance, we updated the existing\
    \ packages and system, upgraded any that needed it, and updated the current package\
    \ list. Now, let's search the list of server packages for available games.\n\n\
    ```\napt-cache search game | less\n```\n\n## Apt searching\n\n03 The current list\
    \ you find yourself in is the name of all the packages labelled as 'games' from\
    \ the available server. In the list, the part before the hyphen tells you the\
    \ name of the package, which is what you will need to know to be able to install\
    \ it. Use the arrow keys up/down to navigate, press 'Q' to exit.\n\n## Installing\
    \ a package\n\n04 Using the up and down arrow keys, navigate the list. If you\
    \ find something you like the look of, say Angry Drunken Dwarves, remember the\
    \ name of the package, in this case angryd2, and press 'Q' to exit the list. To\
    \ install the package, enter the following in the terminal:\n\n```\nsudo apt-get\
    \ install angryd2\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_0.png)\n\
    \n## Executing the package\n\n05 The result of the previous command should be\
    \ the successful download and installation of the game, Angry Drunken Dwarves.\
    \ To execute the newly installed package, you can either run it from the LXDE\
    \ Menu under Games->Angry Drunken Dwarves, or by typing in the following into\
    \ the terminal:\n\n```\nangryd2\n```\n\n## Remove a package\n\n06 This installing\
    \ of packages is perfectly fine, and you can see just how powerful a command Apt\
    \ really is. But, what if you want to remove a package?\n\nUsing the Apt command\
    \ again, let's say we want to completely remove all the trace of Angry Drunken\
    \ Dwarves from the Raspberry Pi.\n\n```\nsudo apt-get --purge remove angryd2\n\
    ```\n\nEnter \"Y\" to accept the removal.\n\n## Apt Easter eggs\n\n07 The Apt\
    \ command is a shorter, non-menu-driven variant of the Aptitude command. This\
    \ command has a long history in Linux, and as a result has some rather special\
    \ features, also known as Easter eggs. Purely for a bit of fun, type in the following\
    \ commands and see the results:\n\n```\naptitude moo\naptitude -v moo\naptitude\
    \ -vv moo\naptitude -vvv moo\naptitude -vvvv moo\naptitude -vvvvv moo\naptitude\
    \ -vvvvvv moo\nsudo apt-get moo\n```\n\n## Man the Apt command\n\n08 As you can\
    \ see, there is more to the simple Apt command than what first meets the eye.\
    \ There are many different sub-commands you can run, and many different variations\
    \ in which to run them.\n\nIf you want to see what else the Apt command can do,\
    \ enter the following:\n\n```\nman apt\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_1.png)\n\
    \n# What you'll need...\n\n**Synaptic:**\nwww.nongnu.org/synaptic/\n\n## Use graphical\
    \ installations\n\n*Would you prefer a graphical interface to install new programs?\
    \ If so, then read on...*\n\nIf you're new to Linux, you may find using its built-in\
    \ Apt package management tool a bit intimidating and confusing. The apt-get command\
    \ is used for installing applications through the internet, connecting to the\
    \ remote servers – called repositories – which house the programs as packages.\
    \ But it is used through the terminal command prompt, which can be daunting, so\
    \ we need an alternative: a desktop environment interface method of getting hold\
    \ of packages.\n\nThis is where Synaptic comes in. Synaptic is a friendly-looking\
    \ graphical interface to the apt-get terminal command which allows you to manage\
    \ your application installations, and removals, through the already familiar desktop\
    \ environment. Think of it as a kind of online shop where you can pick and choose\
    \ the programs you want and have them downloaded and installed onto your Raspberry\
    \ Pi without you having to drop into the terminal.\n\n### Did you know... \nRaspberry\
    \ Pi runs the latest version of Debian Linux, complete with the latest packages\
    \ for all the different desktop environments such as Cinnamon, XFCE, LXDE and\
    \ GNOME.\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_33_0.png)\n\n- **Upgrade\
    \ entire systems**\n  Synaptic has the ability to upgrade and update every program\
    \ or package, and can upgrade your entire system to the latest version\n- **Install\
    \ and more**\n  Synaptic is a very powerful tool. With it you can install, remove,\
    \ upgrade and downgrade single, or multiple packages and programs\n- **Browse\
    \ all documentation**\n  From within Synaptic, you are able to browse and read\
    \ all available online documentation related to a package or program\n- **Easily\
    \ find programs**\n  Synaptic enables you to easily locate packages and programs\
    \ by name, description, version and even by who developed the program\n"
  mdcn: "\n最后，Wi-Fi 连接将显示一个新的 IP 地址。如果你点击“管理网络”选项卡，该网络将被列出，并且“已启用”单选按钮处于激活状态。要连接互联网，只需启动\
    \ Empathy，你就会连接成功。Wi-Fi 实用程序将保留在面板的右下角。右键点击 Wi-Fi 图标，你会看到断开连接或重新连接的选项、事件历史记录以及最近一次扫描的结果。点击“状态”以查看其运行状况。\n\
    \n## 检查连接\n\n为了检查 Pi 是否具有有效的互联网连接，请双击 LXTerminal。输入以下命令：\n\n```\nip addr\n```\n\
    \n你应该会看到一串数字，其中最后一行以 `inet` 开头，后面跟着 Pi 连接的 IP 地址（图 3）。通常这类似于 192.168.1.11，这表明连接正常工作，因为\
    \ Pi 已被分配一个基于你的互联网调制解调器/路由器所使用的 IP 地址。如果没有出现此地址，则路由器端可能存在问题。调制解调器/路由器应该正在运行 DHCP\
    \ 服务器，当 Pi 连接到它时，它将被分配一个 IP 地址。如果没有运行，那么连接到它的其他设备也无法访问互联网。\n\n使用另一台设备的 Web 界面登录到\
    \ 192.168.1.0 或你的调制解调器的实际 IP 地址，以检查 DHCP 服务器服务是否已启用。最后，在终端中输入：\n\n```\nping google.com\n\
    ```\n\n## 共享连接\n\n如果你没有 Wi-Fi 适配器、带电源的 USB 集线器或足够长的以太网电缆，但你有另一台已连接互联网的计算机，还有另一种获取访问权限的方法。在\
    \ Mac 上，通过 USB 或以太网电缆将其连接到 Pi。启动系统偏好设置 > 互联网和无线，点击共享。点击互联网共享，然后选择 Wi-Fi（用于 AirPort）作为要共享的连接类型，并选择\
    \ Pi 如何连接到你的 Mac（图 4）。\n\n在 Windows PC 上，前往 Windows 资源管理器 > 网络 > 网络和共享中心 > 更改适配器设置。\n\
    \n## 上线\n\n# 入门指南\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_0.png)\n\n图 3\
    \ 如果看起来连接没有工作，有一些简单的方法可以检查发生了什么\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_30_1.png)\n\
    \n图 4 Windows 和 Mac 计算机都可以与其直接连接的 Pi 共享互联网连接\n\n# 你需要准备什么...\n\n**Apt 命令帮助页面：**\
    \ http://linux.die.net/man/8/apt\n\n**Apt-get 帮助页面：** https://manpages.debian.org/man8/apt-get.8.html\n\
    \n## 你知道吗...\n\n树莓派是一台近乎完美的微型计算机。它已经包含大量的教育软件、一些游戏、若干编程工具和系统工具。但是，与大多数计算机一样，这只是冰山一角。通过安装更多程序，你可以做更多事情。\n\
    \n# 安装和使用软件包\n\n树莓派很棒，但你安装在上面的软件让它变得更好。\n\n单独来看，树莓派是一台近乎完美的微型计算机。它已经包含大量的教育软件、一些游戏、若干编程工具和系统工具。但是，与大多数计算机一样，这只是冰山一角。通过安装更多程序，你可以做更多事情。\n\
    \n这些被称为软件包的程序，其多样性如同最初设计它们的开发人员一样广泛。在 Linux 中，如果需要对某个特定程序的需求，就会有人开发它。然后将其发布到全世界，并免费公开源代码，因此称为“开源”。一旦程序经过测试，最终会进入该特定\
    \ Linux 发行版的一个远程服务器。\n\n这些被称为软件源（或 repos）的远程服务器包含软件包的所有元素，以便将其下载并安装到你的系统上。一旦你知道如何操作，这个过程非常快速且简单...\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_31_0.png)\n\n## 更新和升级\n\n01 获取软件包\n\
    通过桌面上的 LXTerminal 图标进入命令行终端，并输入几个命令。但在这样做之前，我们需要确保系统是最新的。在终端中输入以下内容：\n\n```\n\
    sudo apt-get update\nsudo apt-get upgrade\nsudo apt-get update && sudo apt-get\
    \ upgrade\n```\n\n## 搜索软件包\n\n02 apt-get 命令（高级包工具）是在树莓派上下载和安装软件包的关键。在之前的示例中，我们更新了现有软件包和系统，升级了需要升级的部分，并更新了当前软件包列表。现在，让我们在服务器软件包列表中搜索可用的游戏。\n\
    \n```\napt-cache search game | less\n```\n\n## Apt 搜索\n\n03 你当前所在的列表是所有标记为“游戏”的可用服务器软件包名称。在列表中，连字符前面的部分告诉你软件包的名称，这是你安装它所需要知道的。使用上下箭头键导航，按\
    \ 'Q' 退出。\n\n## 安装软件包\n\n04 使用上下箭头键导航列表。如果你找到喜欢的东西，例如 Angry Drunken Dwarves，记住软件包的名称，在此例中为\
    \ angryd2，然后按 'Q' 退出列表。要安装该软件包，在终端中输入以下内容：\n\n```\nsudo apt-get install angryd2\n\
    ```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_0.png)\n\n## 执行软件包\n\n05 上一个命令的结果应该是游戏\
    \ Angry Drunken Dwarves 的成功下载和安装。要执行新安装的软件包，你可以从 LXDE 菜单中的 游戏 -> Angry Drunken\
    \ Dwarves 运行它，或者在终端中输入以下内容：\n\n```\nangryd2\n```\n\n## 删除软件包\n\n06 安装软件包是完全正常的，你可以看到\
    \ Apt 命令有多强大。但是，如果你想删除软件包怎么办？\n\n再次使用 Apt 命令，假设我们要从树莓派中完全删除 Angry Drunken Dwarves\
    \ 的所有痕迹。\n\n```\nsudo apt-get --purge remove angryd2\n```\n\n输入 \"Y\" 接受删除。\n\n\
    ## Apt 彩蛋\n\n07 Apt 命令是 Aptitude 命令的更短、非菜单驱动变体。这个命令在 Linux 中有着悠久的历史，因此拥有一些相当特殊的功能，也被称为彩蛋。纯粹为了好玩，输入以下命令并查看结果：\n\
    \n```\naptitude moo\naptitude -v moo\naptitude -vv moo\naptitude -vvv moo\naptitude\
    \ -vvvv moo\naptitude -vvvvv moo\naptitude -vvvvvv moo\nsudo apt-get moo\n```\n\
    \n## 查阅 Apt 命令手册\n\n08 如你所见，简单的 Apt 命令比表面看起来更复杂。你可以运行许多不同的子命令，以及运行它们的不同变体。\n\n\
    如果你想查看 Apt 命令还能做什么，请输入以下内容：\n\n```\nman apt\n```\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_32_1.png)\n\
    \n# 你需要准备什么...\n\n**Synaptic:**\nwww.nongnu.org/synaptic/\n\n## 使用图形化安装\n\n*你更喜欢使用图形界面来安装新程序吗？如果是，请继续阅读...*\n\
    \n如果你是 Linux 新手，可能会觉得使用其内置的 Apt 包管理工具有点令人生畏和困惑。apt-get 命令用于通过互联网安装应用程序，连接到被称为软件源（repos）的远程服务器，这些服务器将程序作为软件包进行存储。但它通过终端命令提示符使用，这可能令人望而生畏，因此我们需要一种替代方案：一种通过桌面环境界面获取软件包的方法。\n\
    \n这就是 Synaptic 发挥作用的地方。Synaptic 是一个外观友好的图形界面，用于 apt-get 终端命令，它允许你通过熟悉的桌面环境管理应用程序的安装和删除。把它想象成一种在线商店，你可以挑选想要的程序，并将它们下载和安装到你的树莓派上，而无需进入终端。\n\
    \n### 你知道吗... \n树莓派运行最新版本的 Debian Linux，并包含适用于所有不同桌面环境的最新软件包，如 Cinnamon、XFCE、LXDE\
    \ 和 GNOME。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_33_0.png)\n\n- **升级整个系统**\n\
    \  Synaptic 能够升级和更新每个程序或软件包，并可以将整个系统升级到最新版本\n- **安装及其他**\n  Synaptic 是一个功能强大的工具。你可以使用它安装、删除、升级和降级单个或多个软件包和程序\n\
    - **浏览所有文档**\n  在 Synaptic 内部，你可以浏览和阅读与软件包或程序相关的所有可用在线文档\n- **轻松查找程序**\n  Synaptic\
    \ 使你可以轻松通过名称、描述、版本甚至程序开发人员来定位软件包和程序\n\n"
