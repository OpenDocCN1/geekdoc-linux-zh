  - "[PAGE 87]\n\n# Projects\n\n# Build your first web server\n\n# What you'll need...\n\
    \n+   Internet connectivity  \n+   Web browser  \n+   Google Coder\n+   google.com/available/Google/Coder\n\
    +   raspberry.pi/com/page/coding.html\n\n# Build your first\nweb server\n\nUse\
    \ Google Coder to turn your Raspberry Pi into a tiny, low-powered web server and\
    \ web host!\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_87_0.png)\n\nWe're teaching\
    \ you how to code in many different ways on the Raspberry Pi in this book, so\
    \ it only seems fitting that we look at web development too.\n\nThere's a new\
    \ way to use the web on the Raspberry Pi as well: internet giant Google has recently\
    \ released Coder specifically for the tiny computer. It's a Raspberry-based image\
    \ that turns your Pi into a web server and web development kit. Accessible easily\
    \ over a local network and with support for jQuery out of the box, it's an easy\
    \ and great way to further your web development skills.\n\nDownload the Coder\
    \ Raspberry Pi image\nGet the Coder\nWindows-specific instructions\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_87_1.png)\n\
    \n# Plug in your Pi\n\n**02** For this tutorial, you'll only need to connect a\
    \ network cable into the Pi. Pop in your newly written SD card, plug in the power\
    \ and wait a few moments. If you've got a display plugged in anyway, you'll notice\
    \ a Raspbian startup sequence leading to the command-line login screen.\n\n# Get\
