    Tether to an Android device


    # Tether to an Android device


    Need the internet on your Pi? Try out a physical tether to your Android device
    for online access


    The portability of the Raspberry Pi is one of its most lauded features. Mini screens,
    mini wireless keyboard and mouse combos, portable batteries and more can get you
    out and about, but the internet is a stumbling block that you can''t easily fix
    with an accessory. What you do also usually have with you is an Internet-connected
    magic pocket box called a smartphone that, with a bit of know-how, you can connect
    the Pi to and steal some internet from. Over the next two pages we will impart
    this know-how to get you on the going using your Raspberry Pi on the Internet
    when you''re on the go.


    # The easy way


    +   1. Many smartphones have a Wi-Fi hotspot feature. Which your Pi can easily
    attach to. First of all, turn the hotspot on and then boot into the Pi. Connect
    a wireless dongle and open up the wpa_gui in Preferences \u003e Wi-Fi Configuration.


    # Scan for device


    +   2. Click Scan to open up the Scan window and then select Scan again from inside
    there. It should pick up your device. Connect it as you would to any Wi-Fi network
    and the Pi will remember it for when it needs it next.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_0.png)


    # Set up tether


    +   3. First, connect your phone to your Raspberry Pi via a USB cable. Depending
    on the amount of power you have, it might have trouble charging your phone but
    it will still let you tether. In the tethering menu you can now activate USB tethering.


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_1.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_69_2.png)'
  - '[PAGE 70]


    # Tether to an Android device


    # Projects


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_0.png)


    > “What you do also usually have with you is an internet-connected magic pocket
    box called a smartphone that you can connect the Pi”


    # Check connection


    +   04 Our running on the desktop will be an internet- or Android device. We’ll
    connect the Pi and its IP address.

    +   $ ifconfig


    # Quick connect


    +   05 You can connect from the terminal right now to access the Internet. You
    should be able to do this by typing the following into your terminal.

    +   $ sudo dhclient usb0

    +   This will automatically grab any available IP address; that’s your phone acting
    as a router.


    # Test connection


    +   06 Open your web browser and head to google.com. If you can load the site,
    you’re all set up.

    +   $ nano /etc/network/interfaces


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_70_1.png)


    # Save the settings


    +   07 After you connect your Raspberry Pi it should automatically access the
    internet. You can use $ sudo nano /etc/network/interfaces to make these changes
    permanent.


    # Tether on the go


    +   09 Now, when you’re out and about, your phone can tether your Pi. This will
    give you Internet access wherever you go, as long as you have a cellular connection.


    # Interface settings


    +   08 Here you’ll find at the current settings. Your might look different from
    ours depending on if you have added any fixed IP address settings or other stuff.
    Using the same syntax as the eth0 line, add:

    +   iface usb0 inet dhcp'
