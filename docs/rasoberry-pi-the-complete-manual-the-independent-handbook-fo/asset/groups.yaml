    \n此时你应该已完全登录你的电子邮件账户。在 POP 下，你的账户将被锁定，直到你选择执行连接的 quit() 方法。如果你需要快速了解开放服务器上有什么内容，可以执行\
    \ stat() 方法：\n\n```python\nmy_pop.stat()\n```\n\n此方法返回一个元组，包含消息计数和邮箱大小。你可以使用 list()\
    \ 方法获取消息的明确列表。查看这些邮件的实际内容时有两种选择，取决于你是否希望保持消息不被触动。如果你只想查看消息的前几部分，可以使用 top() 方法。以下代码将获取列表中第一条消息的标头和前五行的内容。\n\
    \n```python\nemail_top = my_pop.top(1, 5)\n```\n\n此方法返回一个元组，包含邮件服务器的响应文本、标头列表、请求的行数以及消息的八位字节计数。使用\
    \ top() 方法的一个问题是它在每个邮件服务器上并不总是实现得很好。在这种情况下，你可以使用 retr() 方法。它将返回整个请求的消息，格式与 top()\
    \ 返回的相同。\n\n一旦你获取了消息内容，你需要决定实际要显示什么。作为一个例子，你可能只想打印出每条消息的主题行。你可以用以下代码做到这一点。\n\n\
    ```python\nfor line in email_top[1]:\n    if 'Subject' in line:\n        print(line)\n\
    ```\n\n你需要明确执行搜索，因为包含在标头中的行数在每条消息之间有所不同。完成后，别忘了执行 quit() 方法以关闭与邮件服务器的连接。最后要考虑的一件事是邮件服务器将保持连接存活多久。在运行本文的测试代码时，它经常超时。如果需要，你可以使用\
    \ noop() 方法作为连接的保持活动机制。\n\n如前所述，与邮件服务器通信的第二个较新的协议是 IMAP。幸运的是，标准库中包含一个你可以使用的模块，类似于我们上面查看的\
    \ poplib 模块，称为 imaplib。同样，它包含两个主要类来封装连接详情。由于你需要 SSL 连接，你可以使用 IMAP4_SSL。否则，你可以使用\
    \ IMAP4 进行未加密连接。以 Gmail 为例，你可以使用以下代码创建 SSL 连接。\n\n```python\nimport imaplib\n\
    import getpass\nmy_imap = imaplib.IMAP4_SSL(\"imap.gmail.com\")\n```\n\n与 poplib\
    \ 不同，imaplib 有一个单独的方法来处理身份验证。你可以使用 getpass 模块询问密码。\n\n```python\nmy_imap.login('my_username@gmail.com',\
    \ getpass.getpass())\n```\n\nIMAP 包含邮箱树的概念，你的所有邮件都在其中组织。在你开始查看邮件之前，你需要选择要处理哪个邮箱。如果未提供邮箱名称，默认为收件箱。\n\
    \n"
