    ```


    这是初始设置屏幕（图 2）。在这里，你可以启用开机自动启动桌面（图 3），甚至可以更新固件并为官方树莓派摄像头模块添加支持。这使得你无需重新安装即可修改 Raspbian。


    不过，你不会经常使用那两个命令，所以深入研究命令行有实际的用处吗？用处非常大。首先，Raspbian 没有官方的包管理器。这是一个允许你浏览操作系统可用软件的程序，类似于
    Pi Store。


    然而，Raspbian 还有其他通过商店无法获取的软件。你也不能专门更新树莓派的软件，而所有这些都可以使用命令行来修复。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_22_1.png)


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_22_2.png)


    ## 入门指南


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_23_0.png)


    ### 面向所有人的软件


    你想做的第一件事是让树莓派确切了解在线有哪些可用资源。这是一个非常简单的任务，你只需要执行：


    ```

    $ sudo apt-get update

    ```


    这将遍历一系列包含树莓派使用软件的在线仓库（或简称 repos）。完成后，命令行提示符会再次出现，等待你的下一条命令。由于这是你第一次执行此操作，你很可能需要更新树莓派上的当前软件。你可以使用以下命令完成：


    ```

    $ sudo apt-get upgrade

    ```


    它可能会要求你确认升级，如果是这种情况，请输入‘Y’，然后按回车键。我们这两次所做的都是使用命令行包管理器 Aptitude（apt-get）来首先检查仓库，然后根据该信息升级包（图
    4）。第一个命令 `sudo` 允许其以管理员身份运行 `apt-get` 任务，并且常用于许多其他命令行操作。要安装软件，请使用 `install` 代替
    `update` 或 `upgrade`，后面跟着包的名称。例如，要安装数学编程语言，你可以使用：


    ```

    $ sudo apt-get install wolf-am-engine

    ```


    ### 你知道吗？


    `sudo` 意味着超级用户。它允许普通用户执行仅限管理员执行的任务。


    ## 移动和创建


    安装和更新只是你在命令行中可以做到的许多事情中的几件。你还可以浏览整个文件系统、移动文件、创建文件夹以及删除项目。所有这些操作都非常简单。


    当你第一次打开终端时，它会进入你的主文件夹。虽然你可能无法直接看出这一点，但你可以使用以下命令显示目录中有哪些类型的文件（图 5）：


    ```

    $ ls

    ```


    波浪号符号（~/）用于表示主文件夹，可用于在文件系统中导航。要导航，我们将使用 `cd` 命令，后跟你要移动到的位置。可以这样做：


    ```

    $ cd /home/pi/Downloads

    ```


    这将带你移动到 Downloads 目录。由于我们一开始就在主文件夹中，实际上我们只需要这样做：


    ```

    $ cd Downloads

    ```


    它是上下文敏感的，并且知道要在其所在的目录中查找。还有一个技巧可以帮你，这样你就不必记住路径的确切名称 – 命令行或终端会尝试自动补全短语。如果你按 Tab
    键时只输入了部分内容，会发生这种情况。再试一次 `cd` 命令，但这次试着在只写了 ‘Down’ 时按 Tab 键。


    最后，有一些快捷命令可用于操作文件。单个文件可以使用 `cp` 命令进行复制，后跟文件名和新位置，如下所示：


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    你还可以通过以下方式使用它来重命名文件：


    ```

    $ cp file.txt otherFile.txt

    ```


    然后可以使用 `rm` 命令删除原始文件：


    ```

    $ rm file.txt

    ```


    想要创建一个新文件夹吗？使用 `cd` 移动到你需要添加文件夹的目录，然后使用 `mkdir`，后跟你想给文件夹起的名称。


    ```

    $ mkdir NewFolder

    ```


    使用命令行你还能做更多事情，但这些是最基础的内容。随着你越来越多地使用 Linux，你将面临需要命令行来完成的任务，通过这个过程，你将了解到像一位老练的电影黑客那样工作时能完成多少事情。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_24_0.png)


    > “如果你按 Tab 键时只输入了部分内容，命令行或终端会尝试自动补全短语”


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_24_1.png)


    图 5. 有许多简单的命令行工具可以帮助你浏览和使用你的系统


    ## Raspbian 桌面


    虽然树莓派的 Raspbian 操作系统更接近 Mac OS 和 Windows，但其桌面最像后者。


    乍一看可能有点陌生，但使用 Raspbian 与使用 Windows 桌面几乎没有什么不同。有一个菜单栏、一个 Web 浏览器、一个文件管理器，你会期望这样吧，你只需打开菜单并点击你想开始使用的应用程序……


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_25_0.png)


    ### 菜单按钮


    左上角类似 Windows 的菜单按钮显示程序列表和选项。主要类别包括编程（你可以在这里找到合适的工具）、互联网、附件（各种实用工具）和数学（系统工具）。从
    Pi Store 下载的程序将出现在相应的类别中。而“运行”将启动一个命令行解释器，就像 Windows 中的那样。使用“关机”选项关闭、注销或重启你的树莓派。


    ### 任务栏


    屏幕顶部横跨着任务栏，菜单就位于其上。在菜单左侧是 Epiphany 浏览器、游戏管理器、PiXer/MoFi、用于输入基于文本命令的 LX 终端、Wolfram
    Mathematica 计算软件以及 Wolfram 语言编程应用程序的快捷方式。在这些快捷方式旁边，你会发现任何打开的应用程序都停靠在那里，而在右下角，你会找到时钟、当前
    CPU 负载、音量状态和控制，以及网络状态。


    ### 文件管理器


    没有文件管理器，计算机就不完整，可以通过点击任务栏上的快捷方式打开它。可以通过拖动到桌面上的回收站或简单地高亮显示并按键盘上的 Delete 键来复制、重命名和删除文件。你还可以在文件浏览器中创建文件夹或窗口以打开文件夹。可以为文件夹、文件和目录设置书签以便轻松访问，文件本身也可以作为图标在详细列表中查看。


    > “乍一看可能有点陌生，但使用 Raspbian 与使用 Windows 几乎没有什么不同”


    ### Web 浏览器


    Epiphany 是树莓派的默认浏览器。虽然如果你不喜欢它，可以从 Pi Store 添加一个新的。与任何浏览器一样，Web 地址输入到地址栏中，并提供标准的导航按钮以在网页之间前后导航。Epiphany
    支持多标签窗口，并具备私人浏览功能和清除浏览数据的能力。点击工具栏末端的选项图标以访问这些功能。


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_26_0.png)


    ### Pi Store


    你可以从菜单访问 Pi Store，或者从 www.raspberrypi.org 网站上的链接访问。与 Steam、Google Play 或 App Store
    类似，Pi Store 要求你注册一个账户（使用 Indico），并且你需要在开始选购免费和付费的树莓派软件之前登录。从商店下载和安装的任何游戏和应用都会出现在“我的图书馆”选项卡下，其中一些只能从这里启动。


    ### 状态和时间


    在任务栏的最右侧是 Raspbian 中类似于 Windows 系统托盘的地方，你可以在这里找到有关树莓派状态的信息。角落里有时钟，点击它还将显示当前日期，如果日期不正确，你可以在此处进行调整。在其左侧，你会发现一个显示当前
    CPU 负载的图表、设备音量控制，以及最终确认你的树莓派处于在线状态。


