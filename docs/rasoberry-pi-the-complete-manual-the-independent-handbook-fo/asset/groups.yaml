  - '[PAGE 59]


    # Check your mail


    With Python, you can have your Raspberry Pi act as mail checker, giving you a
    running list on incoming email


    Since the Raspberry Pi is such a small computer, it gets used in a lot of projects
    where you want to monitor a source of data. One such monitor you might want to
    create is a mail-checker that can display your current unread emails. This issue,
    we''ll look at how to Pyhton to create your own mail-checking monitor to run on
    your Pi. We''ll focus on the communications between the Pi and the mail server
    and not worry too much about how it might be displayed. That will be left as a
    further exercise.


    To start with, most email servers use one of two different communication protocols.
    The older, simpler one was called POP (Post Office Protocol), and the newer one
    is called IMAP (Internet Message Access Protocol). We will cover both protocols
    to cover all of the situations that you might run into. We''ll start with the
    older POP communications protocol. Luckily, there is support for this protocol
    as part of the standard library. In order to start using this protocol, you will
    need to import the poplib module, and then create a new POP3 object. For example,
    the following will create a connection to the POP server available through Gmail.


    ```

    import poplib

    my_pop = poplib.POP3_SSL(host=''pop.gmail.com'')

    ```


    You need to use the POP3_SSL class when connecting to Gmail because Google uses
    SSL for its connections. If connecting to a different email server, you can use
    POP3 to make an unencrypted connection. The POP communication protocol involves
    the client sending a series of commands to the server to interact with it. For
    example, you can get the welcome message from the server with the getwelcome()
    method:


    ```

    my_pop.getwelcome()

    ```


    The first things that you will want to communicate to the server are the username
    and password for an email account that you are interested in. Having the username
    in your code is not too much of a security issue, but the password is another
    matter. Unless you have a good reason to have it written out in your code, you
    should probably ask the end-user for it. Included within the standard library
    is the getpass module, which you can use to ask the end-user for their password
    in a safer fashion. You could use the following code, for example.


    ```

    import getpass

    my_pop.user(''my_name@gmail.com'')

    my_pop.pass_(getpass.getpass())

    ```


    > “The first things that you will want to communicate to the server are the username
    and password for an email account”


