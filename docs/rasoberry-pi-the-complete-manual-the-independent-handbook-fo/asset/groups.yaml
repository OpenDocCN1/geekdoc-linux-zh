    ### Gain remote desktop access


    Learn how to get access to your Raspberry Pi desktop without it being in front
    of you . . .


    VNC (Virtual Network Computing) is a graphical desktop access and sharing system
    that allows a user to remotely control and use the desktop of another computer
    from their own system.


    It''s handy in many ways: to give you control over a remote system; to help out
    another user elsewhere; to allow a computer to remain powered on, but without
    the need for a keyboard, mouse or even a monitor.


    In our case, we aim to allow access to the Raspberry Pi desktop without it being
    hooked up to the aforementioned peripherals. This way, you can do everything you
    would normally do, but with just the power supply and network attached, thereby
    freeing up space and saving extra expense. In real-world terms, this means you
    could potentially access the Pi desktop via an Android tablet or phone.


    > Did you know...

    >

    > I put ssh -v -N in two separate sshd_config files so you don''t need to worry
    about the default settings being wrong


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_43_0.png)


    ### Static IP address


    01 The first step for us is to make sure that the Raspberry Pi has a static IP
    address. Basically an IP address is a group of numbers that your network assigns
    to devices in order to tell them apart. To set up a static IP address, simply
    double-click LX Terminal and type the following and then press Enter.


    ```bash

    sudo nano /etc/network/interfaces

    ```


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_43_1.png)


    ### Static IP part 2


    02 This file controls the IP addressing for the Pi. You need to scroll down to
    the ‘iface eth0’ line and remove DHCP and replace it with static. Now, on the
    line directly below, enter the IP address that you want force your Pi to have,
    along with the subnet mask and the gateway.


    ```bash

