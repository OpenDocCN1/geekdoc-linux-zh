    # 安装 RetroPie 模拟器


    ## Linux


    03 使用磁盘管理器选择镜像文件和 micro SD 卡。然后按照屏幕上的说明操作，直到镜像完全写入卡中。


    ## Mac


    04 从 www.tweaking4all.com/hardware/raspberry-pi/macos-apple-pi-baker 下载 ApplePi
    Baker。安装完成后，你可以选择镜像文件和 micro SD 卡。按照屏幕上的说明操作。


    ## Windows


    05 从 http://sourceforge.net/projects/win32diskimager 下载 Win32 DiskImager。安装完成后，选择镜像文件和
    micro SD 卡。按照说明操作，直到镜像写入卡中。


    ## 配置


    06 好的，你即将准备游玩。将 micro SD 卡插入树莓派 Zero，连接好控制器、USB 线和 HDMI 线。最后，将树莓派接入电源。它应该会自动启动，几秒钟后，你会看到一个配置屏幕。


    RetroPie 应该会自动检测连接的 USB 游戏手柄，并引导你设置按键。完成后，你会看到一个显示你所有选择的屏幕。


    # 项目


    ![](img/fd3f4a582cf5250916d8b8e1d4ccd045_126_0.png)


    ## 设置磁盘


    **07** 在玩任何游戏之前，我们需要确保 RetroPie 能够使用 micro SD 卡上的所有数据。这将允许你存储 ROM 并保存游戏。从菜单中选择“Raspberry
    Pi”。你会看到几个配置选项。选择“Raspberrypi Configuration Tool/RASPI-CONFIG”。你以后可以更改默认用户名和密码，现在只需使用当前的用户名：pi
    密码：raspberry。接下来，高亮“Select”按钮并显示设置，检查是否有“成功屏幕”——按 OK 键将带你进入配置屏幕。按右键直到高亮“finish”，然后点击它。此时你应该重启你的树莓派。


    ## 添加 ROM


    **08** 最后一步是添加新的 ROM。一旦你合法购买并下载 ROM 到电脑，我们需要将它们复制到 micro SD 卡上。ROM 为每个系统存储在不同的文件夹中。例如，你需要将你的世嘉主系统（Sega
    Master System）ROM 放在 `~/RetroPie/roms/segamastersystem`。一旦你下载了文件，你就可以开始玩了！


    ## 游玩


    **09** 启动后，你会看到一个包含所有可用游戏系统的菜单。一些模拟器只有在安装了该系统的游戏 ROM 后才会显示。滚动直到找到你想玩的游戏——然后按下：运行！如果你想更改任何配置选项或更新软件，你可以随时返回
    RetroPie。这就是全部过程了！是时候坐下来玩点游戏了。如果你想知道更多关于 RetroPie 软件的信息，请访问 http://blog.petrockblock.com/retropie


