    \ 卡。与原始的 SD 卡相比，它小得多，但仍然承载完整的操作系统，并允许 Pi 3 变得更加小巧。\n\n**HDMI 端口**\n\n树莓派的特殊功能——以极少的资源实时解码\
    \ 1080p 视频，这项技术同样存在于 Pi 3 中。HDMI 端口基本上相同，支持高清视频和音频。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_8_1.png)\n\
    \n> “树莓派 3 仍然无法为 USB 集线器供电，因此如果您需要扩展配件，您需要购买一个带电源的集线器”\n\n## 树莓派 Model A+\n\n\
    好东西往往小巧玲珑：看看为什么树莓派 A+ 是移动项目的理想选择。\n\n虽然树莓派 Model B+ 凭借其四个 USB 端口比 Model B 有所提升，但\
    \ Model A+ 比其前身更小，仅重 23g（从 45g 减轻），且只有一个 USB 端口。此外，由于 SoC 上的内存限制为 256MB，而 B+ 则享受\
    \ 512MB 内存。\n\n但不要认为这意味着 A+ 低人一等。它 65mm 的长度和较轻的重量暗示了它的用途。缺乏以太网端口并不是一个弱点，而是表明这款树莓派更多地是为媒体中心、打印服务器以及重量是关键因素的项目而设计的。也许你会将它安装在一个由\
    \ Arduino 驱动的机器人上，其较低的功耗需求可以通过电池来满足。\n\n### microSD 存储\n\n再也不用等待 SD 卡插入或拔出了。树莓派\
    \ A+ 配备了用于 microSD 卡的推推式插槽。\n\n### 可连接且灵活\n\n两款新的树莓派型号都将 GPIO 接头从 26 个引脚增加到了 40\
    \ 个，提高了设备的灵活性。\n\n### 主板内嵌 256 MB RAM\n\n令人惊叹的是，除了其他所有组件外，在这台古老小计算机的中心还连接了一个带有\
    \ 256 MB RAM 的 700 MHz 系统级芯片（SoC）处理器。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_9_0.png)\n\
    \n### 尺寸更小\n\n最初的树莓派 Model A 长度为 86mm，约为信用卡大小。而 A+ 的长度仅为 65mm！\n\n### 重新定位的电源插座\n\
    \nmicro USB 电源插座现在位于 HDMI 插座旁边，使得线缆的管理更加容易。\n\n### 重量也更轻\n\n不幸的是，树莓派 Model B 仅重\
    \ 23.5 克（或 0.8 盎司），重量减少了近 50%。\n\n## 树莓派 Zero\n\n尺寸比信用卡还小，Zero 确实令人印象深刻，无论是在性能上快速超越传统。四核\
    \ Broadcom CPU + 和 LiNEX-Pi3M 拥有以 40m（原文如此，疑指运行速度或频率）的速度运行的能力，比最初的 Pi 更快。\n\n\
    为了实现如此小的外形尺寸和低成本生产，设计师精简了一系列我们习以为常的部件，例如几乎缺失音频和内置摄像头/显示器，也没有以太网口。在各种项目中，各种类型的适配器将发挥至关重要的作用。通过确保每个组件都有存在的理由，Pi\
    \ Zero 具有惊人的多功能性。其运行完整镜像（如 Raspbian）的能力意味着进入项目变得比以往任何时候都简单。\n\nZero 的极简主义非常适合无头（headless）设置运行；添加一个\
    \ WiFi 网卡，你就可以通过 SSH 登录并控制它，充分利用那个单一的 USB 端口。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_10_0.png)\n\
    \n- **新的 mini HDMI 端口**\n  这种 29 针连接器可以轻松用于新的 mini HDMI 端口。或者更好的是，进行无头安装并自行安装\
    \ OS 镜像。\n\n- **microSD 卡**\n  这与较新的 B 型号相同，意味着你可以插入一张现有的卡，几秒钟内即可开始运行。\n\n- **未焊接的\
    \ GPIO 接头**\n  拥有与 Model A + B/28/5 接头相同的 62 个引脚，你可以选择自己焊接上这些接头，使 Zero 兼容 HAT。\n\
    \n- **Micro USB 端口**\n  缺少更有用的 USB 集线器，但适配器对于连接键盘或 WiFi 适配器这类设备将变得更加重要。\n\n- **极简连接器**\n\
    \  没有以太网、复合视频或摄像头和显示器连接器。然而，未焊接的复合视频和复位接头并不可用。\n\n- **比信用卡更小**\n  Zero 的尺寸为 65mm\
    \ x 30mm x 5mm，整体占地面积仅为 Model B 的十分之一。\n\n## 入门套件\n\n你的树莓派比你乍一看看到的要多。以下是一些必备的周边设备，助你起步\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_0.png)\n\n为了获得树莓派的最佳体验，除了树莓派主板本身，你还需要获得一些额外的配件。例如，你需要一个键盘和鼠标来输入命令和导航。虽然有些项目可以不用键盘和鼠标完成，但初始设置时你需要它们。SD\
    \ 卡也是一项重要的购买——操作系统就安装在这里。也许你需要一个 Wi-Fi 适配器，或者只需一根网线。此外，还有树莓派基础电子学的一面，开始一些初学者电子和控制实验你需要什么？显然，树莓派比有些人想象的要丰富得多。\n\
    \n“周边设备”指的是可以连接并利用于树莓派的其他硬件。它们可以简单如桌面 HDMI 设备，也可以是增强项目功能的最新、最棒的定制小工具。对于树莓派来说，存在着一个完整的可能性世界，从机械臂到遥控直升机……唯一的限制是可用的硬件和你的想象力。\n\
    \n> 你知道吗... [由于图像质量原因，文字无法辨认]\n\n### 键盘和鼠标\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_1.png)\n\
    \n让我们从最基本的组件开始，即键盘和鼠标。一般来说，几乎所有 USB 键盘和三键滚轮鼠标都可以与树莓派配合使用，虽然对于某些项目你甚至不需要键盘和鼠标，但在初始设置时你需要它们。\n\
    \n### SD 卡\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_11_2.png)\n\n早期的树莓派计算机需要\
    \ SD 卡，而后期型号如树莓派 2 和 3 则使用 microSD 卡进行存储。这是你选择的操作系统（如 Raspbian）安装的位置，这些卡可以以各种尺寸购买，可以预装操作系统，也可以是空白的。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_0.png)\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_1.png)\n\
    \n### 电源线\n\n树莓派使用标准的 micro USB 连接器作为电源输入，运行电压为 5V。在大多数情况下，micro USB 到 USB 的线缆就足够了，拿到后可以插入你的台式计算机的\
    \ USB 端口。安卓手机充电器也应该能完美工作（5.25V / 500mA）。\n\n### 外壳\n\n将树莓派固定在外壳中可以保护它，并防止精密的 GPIO\
    \ 引脚受到意外损坏。外壳还可以使树莓派成为一个更具吸引力或更显眼的装置，例如作为媒体中心。请确保为你的树莓派型号选择正确的外壳。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_2.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_3.png)\n\n### 视频输出\n\n有两个视频输出端口：一个\
    \ HDMI 端口和一个 RCA 插座。HDMI 是大多数用户的主要视频输出连接器，但 RCA 视频输出端口也可用于连接电视、显示器或 SCART 线缆。通过\
    \ SSH 或 VNC 也可以远程访问你的树莓派。\n\n### 带电源的 USB 集线器\n\n额外的 USB 端口值得作为早期购买的配件。一旦你连接了键盘和鼠标，你就会明白为什么使用带电源的\
    \ USB 集线器很重要：防止树莓派的电力被耗尽，并允许你连接外置硬盘等设备。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_4.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_12_5.png)\n\n### 树莓派摄像头板\n\n这是一个自定义设计的附加板，通过柔性线缆连接到树莓派的主板插座之一。它非常小但功能强大，具有\
    \ 500 万像素的原生分辨率，支持 1080p 视频。它本质上是为 Pi 设计的智能手机摄像头。\n\n### USB Wi-Fi 适配器\n\n使用 USB\
    \ Wi-Fi 适配器将增加你放置树莓派位置的灵活性。没有了限制性以太网线的束缚，它可以用于更高级的项目：那些有线互联网连接不是可行选项的场景。只需确保你购买的是兼容树莓派的\
    \ Wi-Fi 适配器。\n\n"
