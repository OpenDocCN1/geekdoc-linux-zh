  mdcn: "\n## 使用 Scratch 积木和工具\n\n熟悉 Scratch 工作室工具箱\n\n编辑面板位于工作室的中心。面板的内容与当前选中的精灵相关。\n\
    \n让我们先从精灵收集区域选择名为 Creature1 的水母精灵开始。\n\n顶部显示精灵的图像和名称，以及其当前舞台坐标和方向。左侧有三个动画控制按钮。顶部按钮将旋转精灵，第二个按钮在面向左和面向右的状态之间切换，第三个按钮关闭动画。\n\
    \n下方有三个编辑面板标签。脚本标签是创建积木脚本的地方。我们将在这里拖放积木，以各种组合方式将它们拼接在一起。\n\n若要更改精灵的视觉外观，我们将使用“外观”标签。每个精灵可以有一个或多个外观。例如，水母有两个外观（图\
    \ 1）。每个外观都有编辑、复制和删除按钮。新的外观可以通过三个“新外观”按钮进行绘制、导入或捕获。声音标签允许我们为项目添加音频。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_53_0.png)\n\
    \n图 1a：水母精灵外观 – 水母精灵有两种不同的外观\n\n## Scratch 积木样式\n\n01 “积木调色板”包含完整的脚本积木集合。积木有三种基本样式，即帽子、堆叠和报告器（见对页的图\
    \ 3）。\n\n帽子样式积木将基于特定事件开始积木脚本的执行。经典的帽子积木是“绿色旗帜”点击事件。然而，还有许多其他帽子积木，包括在特定按键按下、鼠标点击甚至来自某些\
    \ GPIO 连接硬件的传感器事件后开始脚本执行的帽子积木。您可能已经猜到，这为 Scratch 程序员提供了许多选项。\n\n报告器积木允许我们指定文本、数值和布尔值。它们适配其他积木中特定形状的空隙。矩形值将包含文本字符串。而圆角报告器与数值相关，尖角报告器包含布尔真值（true）和假值（false）。\n\
    \n堆叠积木是核心脚本构建元素。它们通过其顶部的凹槽和底部的凸起与其他积木互连。许多堆叠积木包含用于报告器样式积木的“孔”，这些积木将根据指定的报告器积木值来修改其操作。\n\
    \nScratch 积木集合被分为组。我们使用位于编辑面板顶部的八个按钮选择积木组，即“移动”、“控制”、“外观”等。这些组是按颜色编码的。除了辅助积木选择外，这种颜色编码在读编辑面板中的积木脚本时还提供了积木类型的视觉线索。\n\
    \n## 使用 Scratch 编程\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_0.png)\n\n##\
    \ Scratch 积木帮助\n\n02 正如我们所见，有许多积木，每个积木都有自己特定的功能和能力。\n\n从某种意义上说，这是一个好消息：大量的积木集合意味着\
    \ Scratch 可用于广泛的软件项目中，例如游戏、动画、音乐、图形、数学、科学、机器人、电子学等等。\n\n然而，广泛的积木选择对于初学的 Scratch\
    \ 程序员来说可能是一个挑战。为了帮助解决这个问题，Scratch 工作室设计人员包含了一套信息丰富的以积木为中心的帮助中心页面。\n\n在任何积木上右键单击都会显示一个弹出帮助页面选项。帮助页面包含特定的上下文描述、图形图像以及（在适当时）如何使用该特定积木的脚本示例（图\
    \ 4）。这是一个很棒的功能，大大简化了确定使用哪些积木的过程。更重要的是，研究这些帮助页面是提高我们的脚本技能并发现 Scratch 功能丰富的积木集合中潜力的有效方式。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_1.png)\n\n### 项目\n\n> **你知道吗...**\
    \  \n> 在过去几年里，人们对计算机编程的兴趣激增。对于许多孩子来说，学习编程技能的第一步就是 Scratch 程序。\n\n### 积木脚本详解\n\n\
    03 让我们更深入地了解积木脚本在实际中是如何工作的。为此，我们将使用一个简单的鱼缸项目积木脚本。从“精灵收集”面板选择“舞台”标签。然后返回中心的“编辑面板”并选择“脚本”标签。\n\
    \n这里只是一个积木脚本。从顶部开始，抛出绿色旗帜开始/积木以启动活动。接下来有一个“永远”循环。此循环内的积木将持续激活，直到按下停止按钮。这个“永远”循环积木包含其他两个积木。\n\
    \n第一个内部脚本积木选择下一个背景图像。点击“背景”标签以查看所有舞台图像。第二个内部积木简单地暂停执行几秒钟。将值设置为 11 意味着该脚本将在执行下一个积木指定的动作前暂停一秒。\n\
    \n请记住，这两个积木被包含在“永远”循环积木中是很重要的。因此，舞台背景图像将按顺序显示，每张一秒。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_54_2.png)\n\
    \n## 在 Scratch 中创建贪吃蛇克隆版\n\n设计你自己的贪吃蛇版本来测试你的新编程技能！\n\n在这里，我们将创建经典贪吃蛇游戏的一个版本，使用箭头键在\
    \ Scratch 舞台上移动蛇。你控制蛇头，必须避免与蛇身或舞台边缘碰撞。\n\n每次吃掉一个鸡蛋，蛇身都会变长。吃好的黄色鸡蛋会增加分数，吃坏的黑色鸡蛋会减少分数。还有额外的奖励精灵可以吃以获取额外分数。\n\
    \n通过跟随本教程，你将学会创建自己的简单精灵图形、发送和接收广播事件、使用列表变量存储数据、播放音效、生成随机数以及使用感应命令检测精灵何时接触某物。\n\
    \n### 你需要什么...\n\nScratch 项目归档  \nwww.scratch.mit.edu/template/late-ever\n\n###\
    \ 你知道吗...\n\n在 20 世纪 70 年代初，街机游戏 *小行星*（Asteroids）很受欢迎。许多 *小行星* 版本为个人电脑创建，其中一些被称为\
    \ **贪吃蛇**（Snake）或 **毒蛇**（Viper）。\n\n### 鸡蛋精灵\n\n鸡蛋精灵随机出现在屏幕上，并让其他精灵知道它被吃掉了（被蛇舌碰到）。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_0.png)\n\n**蛇精灵**  \n蛇精灵在舞台上移动头部，并驱动其身后的身体。它还检测与身体或边缘的碰撞\n\
    \n**尾部精灵**  \n尾部精灵跟随头部，在蛇移动时擦除身体末端，并在需要生长时暂停。\n\n**坏鸡蛋精灵**  \n坏鸡蛋精灵也随机出现，但被吃掉时会减少分数。它还会增大尺寸，变得更难避开。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_1.png)\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_2.png)\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_55_3.png)\n\n### 绘制蛇精灵\n\n01. 点击新精灵：画笔图标以绘制蛇精灵。在绘画编辑器中，画一个小的绿色椭圆作为蛇头，并添加一个红色矩形作为舌头。重要的是舌头颜色要与头部不同。将你的精灵命名为\
    \ Snake。\n\n### 添加蛇的声音\n\n**02** 当蛇舌碰到蛇身或舞台边缘时，我们将播放游戏结束的声音。我们需要将此声音添加到精灵调色板中。选中蛇精灵后，点击声音标签并选择导入。选择电子>吱叫声。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_0.png)\n\n### 响应箭头键\n\n**03** 从控制调色板拖出四个“当按键按下”命令，从移动调色板拖出四个“指向方向”命令。按图中所示进行配置，使上箭头将方向改为\
    \ 0 度，下箭头改为 90 度。点击舞台上方的绿色旗帜以测试此功能。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_1.png)\n\
    \n### 创建蛇变量\n\n**04** 点击变量调色板。创建两个对所有章节可见的变量：Score（分数）和 Speed（速度）。创建一个名为 Next\
    \ Direction（下一个方向）的列表，对所有章节可见；它将存储头部采取的方向序列。仅勾选 Score 变量，使其出现在舞台上。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_2.png)\n\
    \n### 初始化蛇变量\n\n**05** 使用“当绿色旗帜被点击”控制命令，并使用变量调色板中的命令如所示初始化蛇变量。我们希望每个游戏开始时 Next\
    \ Direction 列表为空，因此删除其所有条目。Score 必须从零开始。Speed 设置难度。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_3.png)\n\
    \n### 绘制蛇身\n\n**06** 使用钢笔调色板中的命令来控制蛇身的绘制。你还应使用移动调色板中的命令将蛇移动到舞台中心，并在每个游戏开始时指向左侧。在蛇处于起始位置之前，此钢笔是打开的。在下一步中，我们将使用颜色来检查头部是否接触了不应接触的东西。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_4.png)\n\n### 添加主动作循环\n\n**07**\
    \ 使用嵌套有“如果-否则”命令的“永远”命令。如果红色舌头接触蓝色身体，头部始终接触身体，或蛇精灵接触边缘，则发生碰撞。使用吸管工具选择 Scratch\
    \ 中的颜色。\n\n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_5.png)\n\n### 处理游戏结束\n\n\
    **08** 当检测到碰撞时，广播游戏结束事件。你需要为其他精灵创建新事件，以便它们也能做出反应。此外，播放得分音效并停止所有脚本，使蛇在游戏结束时冻结在当前位置。\n\
    \n![](img/fd3f4a582cf5250916d8b8e1d4ccd045_56_6.png)\n"
