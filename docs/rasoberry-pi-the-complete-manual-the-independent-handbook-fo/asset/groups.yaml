    # the tightvncserver user

    # NUMBER=''pi''

    case "$1" in

    start) su $NUMBER -c ''/usr/bin/tightvncserver''

    # echo "Starting TightVNC

    # server for "''$NUMBER''"''

    #;;

    stop)

    pkill xtightvnc

    echo "TightVncserver stopped"

    #;;

    *)

    echo "Usage: /etc/init.d/

    tightvncserver

    start|stop"

    #;;

    exit 0

    ```


    ## Reboot and ready to go


    Now press **Ctrl-X**, then **Y** and **Enter** to save. Follow that a couple of
    tries to get you back into the Terminal. Now we need to do now is edit the permissions
    of the script we''ve just created so that it''s executable and active. Do this
    by typing the following commands into the terminal, ensuring that you press Enter
    after each one otherwise it will not be registered!


    ```bash

    sudo chmod 755 /etc/init.d/tightvncserver

    sudo rc-tightvncserver defaults

    sudo reboot

    ```


    Once you have completed these steps, the final thing that you will need to do
