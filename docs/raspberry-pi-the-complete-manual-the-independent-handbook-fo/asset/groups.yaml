    # 搭建一辆树莓派动力汽车


    **项目**


    ## 将舵机电缆连接到新控制器


    **02** 我们按照 www.modmypi.com 的说明焊接了 16 通道直流舵机控制板，并将通道 0（转向）和通道 1（电机）的排针直接插在上面。总共有六根电缆：底部两根是接地线；中间两根是电源线；顶部两根是
    PWM（脉宽调制）信号线。这是一个思考如何固定额外组件的好时机，最好的固定方法似乎是使用背胶魔术贴。


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_0.png)


    ## 将 I2C 总线连接到树莓派


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_1.png)


    **03** 我们使用树莓派的 I2C 总线来控制舵机接口板，该板只需要四根电缆——它们都连接在树莓派和舵机控制板之间，如图片所示。请访问 http://bit.ly/N3nq4j
    查看如何在树莓派上设置 I2C 的教程。


    从上到下，我们需要使用 1_GND、2_SCL、3_SDA 和 4_VCC，它们直接对应树莓派上的相同引脚。本质上，这是电源、接地和两个通信通道。


    ## 将其连接到树莓派


    **04** 在一块 Rev 1 树莓派上，电缆看起来是一样的。虽然 Rev 板上的标签不同，但物理引脚位置相同。左下角（最靠近 RPi 电源连接器）是 3.3V
    电源；旁边是 SDA 排针，即数据通道。其右下角相邻的是控制 I2C 设备时钟的 SCL 通道。最后——在右上角的端口——是接地线。我们建议打印一张带有 GPIO
    引脚标签的图片。


    ## 主要组件概览


    **05** 此时，你应该拥有位于中间的舵机板，一侧是转向舵机和速度控制器，另一侧是树莓派。电机连接到速度控制器的另一端（该端应使用较粗的电线）；速度控制器还有两根粗电线连接至汽车主电池——在本例中为
    7.2V 镍镉电池。现在我们有了两个非常独立的电源系统：一侧是高电流电机，另一侧是低电流电子设备。让我们确保这种状态保持不变！


    ## 为所有部件安家


    **06** 我们现在可以组装了。使用大量背胶魔术贴，两条橡皮筋带保持所有部件牢固且整齐，利用车身上的空间尽可能隐藏电线。虽然可以将树莓派直接粘或螺钉固定在车上，但我们建议使用至少外壳的下半部分，以增加保护并便于访问。插入我们的
    SD 卡、网线或 Wi-Fi 适配器以及电源。坐下来欣赏你的黑客技能吧！


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_2.png)


    ## 你需要的东西……


    - 一辆树莓派汽车，准备就绪

    - 互联网连接

    - 一部 reasonably modern 的智能手机/平板电脑

    - 树莓派汽车源代码：github.com/shaunk/picarc


    # 控制你的树莓派动力汽车


    使用智能手机和最新的网络技术控制玩具车


    既然我们已经将这辆精彩的树莓派动力汽车布线、充电并准备就绪，是时候让它活起来了。我们利用 JavaScript 编程语言提供的最佳网络技术，利用手部自然运动来无线驾驶车辆。


    你手部的每一次微小移动都会触发一个事件，计算汽车应该做什么，然后通过套接字连接发送指令。如果一切按计划进行，你应该能完全控制你的车辆！


    > **你知道吗……**

    >

    > 我们的代码每秒通过二十行指令向汽车发送命令。它每秒会执行 50 次请求。


    ## 下载并安装软件


    **01** 首先，你需要确保 I2C 连接正常工作。接下来我们需要为新的项目代码找一个“家”——`/var/www/picarc` 怎么样？在终端中键入
    `sudo mkdir /var/www/picarc` 以创建目录，然后切换到该目录。`cd /var/www/picarc`


    现在，使用 Git 下载项目，键入 `sudo git clone http://github.com/shaunk/picarc`。如果你没有 Git，请使用
    `sudo apt-get install git` 安装它。


    这将下载用于驾驶汽车的定制软件，但在我们开始“烧胎”（即高速行驶）之前，我们仍然需要 web 服务器和其他一些部件……


    ![](img/f11b7dbb71886af07ef87126037ebe98_113_0.png)


    *完成你的项目，你只需要一部智能手机或平板电脑的访问权限*


    ## 下载并安装 Node.js


    **02** 接下来我们将使用 Node.js 及其包管理工具 Node Package Manager (npm)。键入 `sudo wget http://nodejs.org/dist/v0.10.21/node-v0.10.21-linux-arm-pi.tar.gz`。这将下载一个相当新的
    Node.js 版本——树莓派仓库中的版本太旧了，无法与我们即将使用的新技术配合工作。键入以下命令解包 node 软件包：


    ```

    sudo tar --xzvf node-v0.10.21-linux-arm-pi.tar.gz

    ```


    > *你需要调整某些变量来控制你特定的遥控车设置*


    ![](img/f11b7dbb71886af07ef87126037ebe98_114_0.png)


    ## 配置 Node.js


    **03** 为了方便从任何位置运行，我们将为 Node 和 npm 二进制文件创建符号链接。键入 `sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/node
    /bin/node`，然后键入 `sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/npm /bin/npm`。然后，为了获取额外模块，键入
    `npm install socket.io node-optimist socket.io-adapter` 和 `sudo npm install -g
    node-optimist`。


    ## 了解项目


    **04** 现在我们已经拥有了所有东西，你应该看到三个文件：客户端 (app.js)、服务器 (socket.html) 以及用于客户端的 jQuery
    JavaScript 库。服务器不仅驱动舵机，它还是一个 web 服务器，在请求时向浏览器发送 socket.html 文件和 jQuery——这是一个非常简洁明了的服务应用。这对于我们要实现的目标来说是合适的。


    ## 测试舵机


    **05** 我们实用的小程序 (app.js) 有一个专门用于测试的特殊模式。我们使用两个键：beta 用于舵机 0（转向），gamma 用于舵机 1（电机控制）。键入
    `node app.js beta=300`。你应该看到前轮转动。现在需要对数字进行实验。在我们的示例中，340 是左转，420 是直行，470 是右转。通过键入
    `node app.js gamma=400` 对电机做同样的操作，并记录汽车的各种限制。


    “我们正在使用 JavaScript 编程语言提供的最佳网络技术”


    ![](img/f11b7dbb71886af07ef87126037ebe98_115_0.png)


    ## 配置合理的默认值


    **06** 现在你知道你的汽车能做什么了


    ## 试车


    **07** 我们几乎准备好试车了，但你需要知道你的树莓派汽车的 IP 地址，因此在终端键入 ifconfig。然后键入 node app.js 启动应用。现在拿起你最近的智能手机或平板电脑，确保它与你的树莓派在同一网络上。打开
    web 浏览器并访问 http://<your IP address>:8080/socket.html。你应该会收到一条“ready”的警报消息，一旦你点击确定，当你倾斜手机时，手机上的陀螺仪数据将发送到汽车。


