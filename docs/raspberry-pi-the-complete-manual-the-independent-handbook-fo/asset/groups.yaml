    ## Build an always-on torrent box


    ### Mount hard drive


    03 Unless you plan to reformat your portable drive, you''ll need to install NTFS
    support onto your Pi. Type:


    ```bash

    $ sudo apt-get install ntfs-3g

    ```


    Add the hard drive to `/etc/fstab` (open it with `sudo nano /etc/fstab`) by adding
    the line:


    ```text

    /dev/[hard drive address] [mount point] auto noatime 0 0

    ```


    Use `fdisk` to find the name of the storage, and create a mount point such as
    `/home/pi/torrents` with `mkdir`. Reboot for it to mount.


    ![](img/f11b7dbb71886af07ef87126037ebe98_100_0.png)


    ### Install Deluge


    04 We''ll use Deluge for our torrents. Install it with:


    ```bash

    $ sudo apt-get install deluge deluge-console

    ```


    Now start and then stop Deluge so it creates a config file we can edit with:


    ```bash

    $ deluge

    $ sudo pkill deluge

    ```


    And finally, run the following to copy the config file in case we mess up:


    ```bash

    $ cp ~/.config/deluge/auth ~/.config/deluge/auth.old

    ```


    ### Basic configuration


    05 Edit the file `auth` in `~/.config/deluge/auth`. And add to the bottom:


    ```text

    [user]:[Password]:10

    ```


    ... to restrict access. Now start it up with:


    ```bash

    $ deluge

    $ deluge-console

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_100_1.png)


    ### Remote connection


    06 Now you''re in the client, type the following two commands:


    ```bash

    config -s allow_remote true

    exit

    ```


    Restart the Deluge daemon with:


    ```bash

    $ sudo pkill deluge & deluged

    ```


    Now open the graphical client on your Linux PC.


    ![](img/f11b7dbb71886af07ef87126037ebe98_100_2.png)


    ### Remote interface


    07 Go to Edit > Preferences > Interface, then disable Classic Mode and restart
    Deluge. Click Add on the Connection Manager, and enter the IP in Hostname and
    the user we set up earlier. Click Connect to see any torrents you have downloading
    or uploading.


    ![](img/f11b7dbb71886af07ef87126037ebe98_100_3.png)


    ### Download location


    08 Go to Edit again and then Preferences, and change to the Downloads tab if it''s
    not on there already. Set the download location to the directory we mounted the
    hard drive to, and enable ''Auto add torrents'', setting it to any destination
    if you plan to dump torrents to the Pi.


    ### Start on boot


    09 An init script from Ubuntu can be used to have Deluge start on boot. Download
    it with:


    ```bash

    $ sudo wget -O /etc/init.d/deluge-daemon http://bit.ly/13nk0G

    ```


    Open `/etc/default/deluge-daemon` with nano and change the username to the one
    we set up earlier. Save it, then download the full init script and update with:


    ```bash

    $ sudo wget -O /etc/init.d/deluge-daemon http://bit.ly/13nkJiIz

    $ sudo chmod 755 /etc/init.d/deluge-daemon

    $ sudo update-rc.d deluge-daemon defaults

    ```


    ## Stream Internet TV to your Pi


    Get your favourite shows and video podcasts streamed automatically to your TV
    with Miro


    ### What you''ll need...


    - Raspbian Wheezy

    - HDMI cable

    - Monitor


    Finding the content you''re interested in viewing can take a while. Whether you''re
    looking for Internet TV stations, video podcasts, audio podcasts or shows syndicated
    online, taking the time to find and download them can be slow going, particularly
    if you have a busy lifestyle. You might even have no time to watch after you''ve
    waited for the download.


    Thanks to the Miro media management software, we can automate all of this, and
    with the software running on a Raspberry Pi, you can easily build a compact system
    for downloading and playing back shows that you have an interest in. We''re talking
    targeted TV on demand, which makes this project ideal for staying up to date with
    particular news and trends on a certain topic.


    ![](img/f11b7dbb71886af07ef87126037ebe98_101_0.png)


    ### Set up your Pi with Raspbian


    01 Sadly, Miro cannot run on Raspbian Jessie, so make sure you''re using Wheezy,
    available via [raspberrypi.org/downloads/raspbian](raspberrypi.org/downloads/raspbian).
    Ensure your Pi is connected to a TV or display via HDMI. As Miro is a desktop
    application, you''ll need your mouse and keyboard connected to configure it.


    ### Install Miro


    02 With Wheezy flashed to your SD card and your Pi booted up, open Terminal and
    enter:


    ```bash

    sudo apt-get install miro

    ```


    Installation will take a few moments. Once complete, you’ll find Miro in Menu
    > Sound and Video. Click it to get started.


    Above: Miro gives you a decent playback interface and excellent export options
    for converting videos for other formats.


    ### Set Miro to launch at startup


    03 Make sure Miro app is configured to launch at startup. Open File > Preferences
    > General and check *Automatically run Miro when I log in* and ‘When starting
    up Miro remember what screen I was on when I last quit’. Also set your Pi to boot
    into X using the raspi-config utility.


    ### Check for content


    04 Switch to the Podcasts tab and place a check in the box labelled ‘Show videos
    from podcasts in the Videos section’. On the right-hand side of the window, set
    your preferred frequency for checking for new content. Miro will poll your favourite
    websites and feeds based on this setting.


    ![](img/f11b7dbb71886af07ef87126037ebe98_102_1.png)


    ### Configure playback settings


    05 Move now to the Playback tab, and check Play media in Miro. This limits reliance
    on other apps, which may drain resources. You should also click the Play video
    and audio items one after another radio button, and under Resume Playback, check
    the first and third items.


    > “The more links you add, the more regularly updated content will be downloaded
    to your media manager”


    ### Source videos and podcasts


    06 With Miro now set up and ready to play back the video and audio content that
    you want to enjoy, it’s time to find some! The best way to do this is to just
    check the websites that you regularly use for video and audio podcasts (preferably
    the former) and then copy the XML link.


    ### Add podcast feeds


    07 In Miro, open up File > Add Podcast and then paste the podcast feed URL into
    the dialog that appears, clicking Create Podcast when you’re done.


    The more links you add, the more regularly updated content will be downloaded
    to your Pi-Powered Miro media manager, ready to watch or listen to on demand.


    ![](img/f11b7dbb71886af07ef87126037ebe98_103_0.png)


    ### First time use


    08 Remember earlier in the tutorial when we instructed Miro to behave in a particular
    way when it launched? It''s time to set that behaviour now. The process is started
    by opening the Videos view in the left-hand pane of the Miro window, and then
    playing the first video. Each time you boot your system, Miro will jump to this
    view and immediately begin playing your content, making sure you get up and running
    quickly and smoothly.


    ### Avoid YouTube


    09 As good a solution as Miro is to building a video podcast streaming center,
    displaying material that you''re interested in on demand, it''s sadly just no
    good for videos on YouTube. This doesn''t really restrict you too much as there
    are plenty of other media outlets to cover, but it''s worth mentioning if you''re
    a frequent YouTube watcher. This is a shame, and shouldn''t impact the way you
    use it - your Raspberry Pi now downloads focused content on demand!


    ![](img/f11b7dbb71886af07ef87126037ebe98_104_0.png)


    > Above: You can subscribe to all sorts of content, from Internet TV channels
    to comedy and news podcasts


    ### Checking for new content


    10 It is tempting to set a regular frequency for your content checking in File
    > Preferences > Podcasts, but note that checking too regularly is going to result
    in resources being hogged temporarily, which may result in an interruption if
    you happen to be actually watching something when Miro checks for new content.
    Limit polling to hourly or daily checks.

