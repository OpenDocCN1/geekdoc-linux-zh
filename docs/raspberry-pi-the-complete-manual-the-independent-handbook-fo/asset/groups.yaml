    ## The Raspbian desktop

    ### Getting started

    ### Web browser

    Epiphany is the default Raspberry Pi browser, although if you don''t like it you
    can add a new one from the Pi Store. As with any browser, web addresses are typed
    into the address bar and standard navigation buttons are provided to navigate
    back and forth through web pages. Epiphany supports multiple stacked windows and
    features private browsing and the ability to clear browsing data. Click on the
    Options icon at the end of the tool bar to access these functions.


    ![](img/f11b7dbb71886af07ef87126037ebe98_26_0.png)


    ### Pi Store

    You can access the Pi Store from the Menu, or from a link on the www.raspberrypi.org
    website. Much like Steam, Google Play or the App Store, the Pi Store requires
    you sign up for an account (with IndieCyb), and you''ll need to sign in before
    you begin shopping for free and paid for software. Any games and apps downloaded
    and installed from the Store will appear under the My Library tab, and some of
    them can only be launched from here.


    ### Status and Time

    On the far right side of the Tool bar is the Raspberrypi equivalent of the Windows
    system tray where you''ll find information concerning your Raspberry Pi status.
    In the corner is the clock, which when clicked will also display the current date.
    If correct, you can adjust it here. To the left of this you''ll find a graph displaying
    current CPU load, the device volume control, and, finally, confirmation that your
    Raspberry Pi is online.


    ## Master the Config tool

    Tell your Raspberry Pi how to behave using the powerful built-in Config tool


    The ''RasPi Config'' tool allows configuration of your system that would otherwise
    be trickier in the Linux environment and it''s the first thing you''ll see when
    you install Raspbian. Why? Tasks such as setting the date and time or regional
    settings for your keyboard are often done in a command-line interface with no
    dialogs, no additional help - for a new user, this is a nightmare.


    There are some further specifics for the Pi and Raspbian itself, such as the ability
    to easily enable overscan for your TV; change the split of memory to the computer/graphics
    card or even overclock your system to make it a little faster; enable remote SSH
    access to the system; stop the system booting into the desktop environment among
    other things. The RasPi Config tool takes the pain out of the process and puts
    more real power at your fingertips.


    ### Change password

    Change the password for your default ''pi'' username to make it something more
    personal or easier to remember for you.


    ### Expand roots

    Allows you to very quickly and easily change the partition of the root to fill
    the SD card completely.


    ### Open the raspi-config tool

    - Start by double-clicking the LXTerminal icon on your desktop. This will start
    the command prompt, where you''ll be able to run the config tool. To do this you''ll
    need to run a command.

    - ```sudo raspi-config```


    When asked for your password, you won''t actually see it being typed.


    When you''ve typed the password and pressed Enter to submit it, the config screen
    will be shown. There are a few settings of particular interest that we''ll cover
    in this section, although they all have their uses in the running of your Pi.
    Some of the settings in this menu are important and some are irreversible, so
    use them with caution!


    ![](img/f11b7dbb71886af07ef87126037ebe98_27_0.png)


    ### Configure your keyboard

    Set the correct keyboard — there are many different layouts. Using the wrong one
    can be annoying.


    ### Overclocking

    Allows you to quickly and easily overclock your Pi to give you some extra speed
    and power with little risk.


    Raspbian: www.raspbian.org


    ![](img/f11b7dbb71886af07ef87126037ebe98_27_1.png)


    ### Expand the root file system

    **02** By default, the Raspbian root file system will be 2GB - this is done so
    that the image provided for it can fit on as many different SD cards as possible.


    If your card is larger the “expand root” option will make the OS use the entire
    space. Upon using this option, the command will be executed immediately. The operation
    can take some time. Reboot your system to see the changes.


    ### Overclock your Pi

    **04** You can set the clock speed and voltage of your Pi to several different
    presets. Setting the clock speed and voltage at higher rates than the specification
    may cause instability, so do so in small increments. Ensure good airflow around
    your Pi.


    If you see any noticeable instability, run this wizard again and set the clock
    speed back down to something slightly lower – repeat until your system is completely
    stable. For the scope of this tutorial, a Modest/Medium overclock is recommended
    – it seems to give a little extra performance with no noticeable side effects.
    It is also recommended to re-boot your system after making this change. Hold the
    Shift key to temporarily disable overvolting.


    ### Change the memory split

    **05** Changing the memory split of the Pi allows you to give either the system
    or the graphics processor a larger amount of memory.


    The value you give it must be either 16/32/64/128/256. Here are our recommendations:

    - 32MB GPU memory for basic distro usage where video and 2D rendering aren''t
    required.

    - 64MB GPU memory for desktop use that requires video playback or have 3D effects
    enabled.

    - 128MB GPU memory for graphical applications and games that do extensive multimedia
    or play 3D rendered games.

    - For most people, a 64MB split for graphics will suffice.


    ### Turn overscan on and off

    **07** You have noticed one of two behaviours if you''re using your Pi with a
    modern HDTV. There is a black border the whole way around the image output by
    the Pi – it just doesn''t fit correctly. This is caused by underscan.


    If you can''t see the edges of your screen to get that they you''re suffering
    from overscan.


    If you have the former issue, you may need to either turn on overscan, or enable
    a "zoom" mode or similar on your TV.


    If you''ve have the latter issue, you need to turn overscan off so that you can
    see the edges.


    ### Change boot behaviour

    **06** By default, the Raspbian distro will boot into a command-line interface,
    whereby you have to first log in by “pi”.


    If then want to run a window manager (in this case, it''s called “X”), you have
    to give the system a command to let it know that''s what you want to do.


    For a lot of people this isn''t really ideal since command lines scare them. Because
    of this, there''s an option to start X automatically, on boot. Set this option
    to “Yes” to enable this behaviour by default.


    You can obviously revert at any time to return to a text-based login where you
    have to start `startx` manually.


    ### Configure your location

    **03** Locale is the language and regional settings that your Pi is using – while
    this generally has little impact on what you use, it is also responsible for any
    default currency settings, etc, so could prove to be an irritant at a later time
    if wrong.


    Upon selecting the option, you’ll be taken through a wizard. Use the arrow keys
    to check the default locale before building more (it takes a while). Timezone
    will take you to a tzdata screen where you can adjust it.


    ### Update raspi-config

    **08** The raspi-config tool receives updates from time to time. This is general
    to either add more features or fix small bugs, or both.


    It''s not a bad idea to run the updater when you use the tool – before you start
    changing any system settings. While it''s much more likely that it''ll be updated
    to look better or do more things, it''s not impossible there could be miscellaneous
    bug fixes hidden within that would otherwise cause you some grief.


    Remember, though, when you''re trying to update your Pi you need an active internet
    connection, either through an LAN cable or wireless dongle. Without them, it''s
    never going to get you any newer. Always try to make sure you''re on the latest
    version.


    ## What you''ll need...

    - Any Raspberry Pi distro [www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)

    - Wi-Fi dongle or Ethernet


    > **Did you know...**

    >

    > If your Raspberry Pi is going to be placed near your internet router, all you
    need to do is plug in an Ethernet cable.


    ![](img/f11b7dbb71886af07ef87126037ebe98_29_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_29_1.png)


    ## Get your Pi online

    ### Get online

    To access a world of utilities, apps and resources you need to get online. This
    is how to do it...


    The easiest way to get online is to buy a Raspberry Pi Model B+, as it comes with
    an Ethernet socket. The Model A not only lacks the Ethernet port, but is handicapped
    by only having one USB port. That means you will have to buy a power USB hub in
    order to get online. Back to the Model B+; though and to get online, simply plug
    an Ethernet cable into the socket on the Pi and connect it to a similar port on
    the back of your internet modem/router. Turn your Pi on and launch the desktop,
    then double-click on Epiphany and you should see the internet appear (main image).
    To check that it’s working, look at the lights on the Pi itself. The red power
    light should be on. Above this is the green light that flickers when accessing
    the SD card. Below the power light are the three Ethernet-related lights. Note
    that the Model A does not have these LEDs because it doesn’t have the Ethernet
    socket. The middle light is green and comes on when it detects a Full Duplex LAN
    connection. This means it is able to send and receive data to and from the internet.
    The next light is green and flashes when actually accessing the internet by sending
    or receiving data. The last light is yellow and will come on and stay on when
    a 100Mb LAN connection is detected.


    ### The Wi-Fi option

    If you aren’t close enough to the modem/router to be able to plug in the Ethernet
    connection, or you simply have a Model A, then a powered USB hub is required.
    This plugs into a USB port on the Pi. You can then plug a Wi-Fi dongle into this.
    Boot up the Pi and launch the desktop. Then double-click on the Wi-Fi Config icon.
    You should see a name for the dongle in the Adapter section. Click on Scan to
    look for networks and a list of those found should appear (Fig 1). Double-click
    on the one you want to connect to and the details for it will be listed. Almost
    all home networks use a network key, which is usually written on the modem itself.
    Click on PSK, which stands for pre-shared key, and type it in (Fig 2). Then click
