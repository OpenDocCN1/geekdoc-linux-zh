    \ Wi-Fi\n\n**08** 如果你使用的是 USB 转以太网适配器，那么树莓派应该已经连接到互联网了。如果你使用的是 Wi-Fi 适配器，你需要配置它以连接到你的无线局域网。我们使用的是\
    \ Edimax EW-7811UN，它在树莓派上开箱即用，效果完美。\n\n进入 Raspbian 桌面后，你可以点击网络图标来查看可用的无线网络。点击其中一个网络后，它会要求你输入密码。之后，它应该已关联成功，你可以将鼠标悬停在图标上以查看你已连接的网络。\n\
    \n#### 在另一台机器上配置 Wi-Fi\n\n**09** 如果你想将树莓派 Zero 作为无头设备并配合 Wi-Fi 使用，你可以使用另一台已经配置好以连接到正确\
    \ Wi-Fi 网络的 Linux 机器来准备一张 SD 卡。你必须挂载 SD 卡并编辑 `/etc/wpa_supplicant/wpa_supplicant.conf`，这与上一步中由\
    \ Raspbian 用户界面配置的是同一个文件。将 SD 卡插入你的 Linux 机器，并找出该设备的名称\n\n```\ndmesg | tail -n\
    \ 3\n[326516.612994] mmc0: new high speed SDHC card at address 0001\n[326516.613437]\
    \ mmcblk0: mmc0:0001 SD08G 7.35 GiB\n```\n\n因此设备是 `/dev/mmcblk0` - 现在我们需要找出根分区是哪个分区号（在\
    \ Raspbian 镜像中会有所不同；这里我们使用的是 NOOBS 镜像）。\n\n```\nsudo parted /dev/mmcblk0 print\n\
    ```\n\n这将给你一个分区列表。最大的分区将是根分区。在这种情况下它是第 7 个分区，所以根文件系统位于 `/dev/mmcblk0p7`。要挂载 SD\
    \ 卡并编辑 `wpa_supplicant.conf` 文件，请执行以下操作\n\n```\ncd /mnt\nsudo mkdir pi\nsudo mount\
    \ /dev/mmcblk0p7 pi/\ncd pi/\nsudo nano etc/wpa_supplicant/wpa_supplicant.conf\n\
    ```\n\n然后填入你的 Wi-Fi 详细信息：\n\n```\nnetwork={\nssid=\"your_wifi_network\"\npsk=\"\
    your_wifi_password\"\nkey_mgmt=WPA-PSK\n}\n```\n\n最后\n\n```\ncd -\nsudo umount\
    \ pi/\n```\n\n#### 远程访问你的树莓派\n\n**10** 你可以使用 nmap 扫描你的局域网以找到树莓派。你需要知道你的局域网地址范围（常见的网络是\
    \ 192.168.1.0/24 和 192.168.3.0/24）。你可以使用 `ip addr` 命令来查找它：\n\n`nmap -p22 -sV 192.168.1.0/24`\
    \ 将扫描出开放 SSH 端口的设备列表。示例输出：\n\n```\nnmap scan report for 192.168.157.29\nHost is\
