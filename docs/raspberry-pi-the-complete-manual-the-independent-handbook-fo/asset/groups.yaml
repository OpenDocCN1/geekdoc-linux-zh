  - '[PAGE 66]


    ![](img/f11b7dbb71886af07ef87126037ebe98_66_0.png)


    # Download NagiosPi


    01 Windows users should write the extracted contents of the NagiosPi_v2.0 zip
    file to a formatted SD card using Win32 Disk imager. Linux desktop users can use
    Disk Utility or the command line (bit.ly/2k565p8). With the image written to SD,
    safely eject the card and insert it into your Pi before booting.


    # Log in to NagiosPi


    02 As with most Pi projects, you’ll probably want to operate via SSH, so check
    your router’s list of connected devices to find the IP address and connect. You
    can also use a keyboard and monitor connected to your Raspberry Pi. The default
    username and password for NagiosPi is as follows: pi/raspberrry.


    # Expand the filesystem


    03 Before proceeding, run sudo raspi-config. You’ll need to select the first option,
    Expand Filesystem, and wait a moment as the filesystem is expanded to the full
    size of the SD card. Once done, select Change User Password to add some security
    to your NagiosPi, then select Finish and reboot.


    # Open in your browser


    04 With the Pi rebooted, the NagiosPi web console is open in your browser. Visit
    http://Raspberry Pi. [here] to see the available options. Here you’ll spot a menu
    of links in the top-left corner, each accompanied with the username and password
    to sign in. Start with RapControl.


    # Monitor your NagiosPi box


    05 In the RapControl section you’ll get a flavour of just what Nagios can do.
    On the home screen you’ll see general hardware information such as connectivity
    and system status, and as you flick through Details, Services and Disks you’ll
    see what level of monitoring is possible.


    # View host status


    06 Next, go to Nagios and pick Hosts. Here you will see the current status for
    the configured hosts, which is a combination of items detected on your local network
    and preset entities. Look for ‘Current Network Status’ in the upper-left area
    of the console, just below this you will find alternate views.


    # Add a host to monitor


    07 Open NConf to add the server you wish to monitor, using the ‘Hosts – Add’ button
    to input the device hostname, IP address and alias. Click Submit when done, then
    switch to ‘Services – Add’; where you can assign a name and check command (such
    as check_ping) to monitor.


    # Create configuration file


    08 Each check must be set up individually: some require the installation of NRIPE
    (Nagios Remote Plugin Executor) on remote devices to interpret and present full
    system details, but this isn’t necessary for basic things like ping. When you’re
    done, click Submit, then Generate Nagios Config. Following this, select Deploy.


    # Monitor your server


    09 In the NagiosPi window, select ‘Services for a view of currently monitored
    servers and devices. For each listed device, there will be additional information
    that you’ll drown into by clicking Actions. We’ve only shown you the basics of
    NagiosPi – investigation will demonstrate just how powerful it really is!'
  - "[PAGE 67]\n\n# Projects\n\nTether to an Android device\n\n# Tether to an Android\
