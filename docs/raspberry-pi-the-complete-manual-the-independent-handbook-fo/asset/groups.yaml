    ![](img/f11b7dbb71886af07ef87126037ebe98_26_0.png)


    ### Pi Store（应用商店）

    你可以通过菜单或 www.raspberrypi.org 网站上的链接访问 Pi Store。类似于 Steam、Google Play 或 App Store，Pi
    Store 要求你注册一个账号（通过 IndieCyb），并且在开始购买免费或付费软件之前，你需要登录。从商店下载并安装的游戏和应用将显示在“我的库”标签下，其中一些只能从这里启动。


    ### 状态和时间

    在工具栏的最右侧是树莓派版本的 Windows 系统托盘，你可以在那里找到有关树莓派状态的信息。在角落处有时钟，点击它还会显示当前日期。如果时间不正确，你可以在此处进行调整。在时钟左侧，你会看到一个显示当前
    CPU 负载的图表、设备音量控制，以及确认你的树莓派已在线的状态指示。


    ## 掌握 Config 工具

    使用强大的内置 Config 工具来告诉你的树莓派如何运行


    “RasPi Config”工具允许你配置系统，而这些配置在 Linux 环境中通常会更棘手，它也是你安装 Raspbian 后首先看到的内容。为什么？诸如设置日期和时间或键盘区域设置等任务，通常是在没有任何对话框或额外帮助的情况下通过命令行界面完成的——对于新用户来说，这是一个噩梦。


    针对树莓派和 Raspbian 本身还有一些特定的设置，例如可以轻松启用电视的过扫描功能；更改计算机/显卡之间的内存分配，甚至超频你的系统以使其运行得稍快一些；启用远程
    SSH 访问系统；阻止系统启动到桌面环境等。RasPi Config 工具消除了这一过程的痛苦，让你能更轻松地掌握实际的控制权。


    ### 更改密码

    更改默认用户名为 ''pi'' 的密码，使其更具个性化或更容易被你记住。


    ### 扩展根分区

    允许你非常快速、轻松地更改根分区的大小，使其占满整个 SD 卡。


    ### 打开 raspi-config 工具

    - 首先在桌面上双击 LXTerminal 图标。这将启动命令行提示符，你可以在此运行配置工具。为此，你需要运行一条命令。

    - ```sudo raspi-config```


    当被要求输入密码时，你实际上不会看到输入的字符。


    当你输入密码并按下回车键提交后，配置屏幕将会显示。在这一部分中，我们将介绍几个特别值得关注的设置，尽管它们在你的树莓派运行中都有各自的作用。此菜单中的一些设置非常重要，且有些是不可逆的，因此请谨慎使用！


    ![](img/f11b7dbb71886af07ef87126037ebe98_27_0.png)


    ### 配置你的键盘

    设置正确的键盘布局——有很多不同的布局。使用错误的布局可能会令人烦恼。


    ### 超频

    允许你快速、轻松地超频你的树莓派，从而在风险极小的情况下获得额外的速度和性能。


    Raspbian: www.raspbian.org


    ![](img/f11b7dbb71886af07ef87126037ebe98_27_1.png)


    ### 扩展根文件系统

    **02** 默认情况下，Raspbian 的根文件系统为 2GB - 这样做是为了让提供的镜像尽可能适配各种不同大小的 SD 卡。


    如果你的卡更大，“扩展根文件系统”选项将使操作系统使用整个空间。使用此选项后，命令将立即执行。该操作可能需要一些时间。重启你的系统以查看更改。


    ### 超频你的树莓派

    **04** 你可以将树莓派的时钟速度和电压设置为几种不同的预设值。将时钟速度和电压设置为高于规格的值可能会导致系统不稳定，因此请小幅度递增。确保你的树莓派周围有良好的空气流通。


    如果你发现任何明显的不稳定现象，请再次运行此向导并将时钟速度调回略低的值 – 重复此过程，直到你的系统完全稳定为止。在本教程的范围内，建议进行中等/中等程度的超频
    – 它似乎能带来一点点额外的性能，且没有明显的副作用。此外，建议在做出此更改后重启你的系统。按住 Shift 键可以暂时禁用超压。


    ### 更改内存分配

    **05** 更改树莓派的内存分配允许你给系统或图形处理器分配更多的内存。


    你给出的数值必须是 16/32/64/128/256 之一。以下是我们的建议：

    - 对于基本发行版使用，不需要视频和 2D 渲染的情况，设置 32MB 的 GPU 内存。

    - 对于需要视频播放或启用 3D 效果的桌面使用，设置 64MB 的 GPU 内存。

    - 对于进行大量多媒体处理或玩 3D 渲染游戏的图形应用和游戏，设置 128MB 的 GPU 内存。

    - 对于大多数人来说，64MB 的图形内存分配就足够了。


    ### 开启和关闭过扫描

    **07** 如果你使用现代高清电视连接树莓派，你会注意到两种行为之一。树莓派输出的图像四周有一圈黑边 – 它无法正确显示。这是由欠扫描（underscan）引起的。


    如果你看不到屏幕边缘，说明你正在遭受过扫描（overscan）的影响。


    如果你有前一个问题，你可能需要开启过扫描，或者在电视上启用“缩放”模式或类似功能。


    如果你有后一个问题，你需要关闭过扫描，以便你能看到屏幕边缘。


    ### 更改启动行为

    **06** 默认情况下，Raspbian 发行版将启动到命令行界面，你需要首先通过 “pi” 用户名登录。


    如果你接着想要运行窗口管理器（在这种情况下，它被称为 “X”），你必须向系统发出命令，让它知道这是你想做的。


    对很多人来说，这并不理想，因为命令行令他们感到害怕。因此，有一个选项可以在启动时自动启动 X。将此选项设置为 “是” 即可默认启用此行为。


    显然，你可以随时恢复默认设置，回到基于文本的登录界面，在那里你必须手动启动 `startx`。


    ### 配置你的位置

    **03** 区域设置（Locale）是树莓派使用的语言和区域设置 – 虽然这对你的使用通常影响不大，但它也负责默认货币设置等，如果设置错误，日后可能会成为一个烦人的问题。


    选择此选项后，你将进入一个向导。使用方向键检查默认区域设置（构建更多设置需要一些时间）。时区（Timezone）会带你进入 tzdata 界面，你可以在此处进行调整。


    ### 更新 raspi-config

    **08** raspi-config 工具会不定期收到更新。这通常是添加更多功能或修复小 bug，或者两者兼有。


    在使用该工具时运行更新器是个不错的主意 – 在开始更改任何系统设置之前。虽然更有可能的是它被更新以看起来更好或做更多事情，但也不排除其中隐藏的一些杂项 bug
    修复，否则可能会给你带来麻烦。


    不过请记住，当你尝试更新你的树莓派时，你需要一个活跃的互联网连接，通过 LAN 线缆或无线适配卡。没有它们，你永远不会获得新版本。始终尽量确保你在最新版本上。


    ## 你需要...

    - 任何树莓派发行版 [www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)

    - Wi-Fi 适配卡或以太网


    > **你知道吗...**

    >

    > 如果你的树莓派将放置在互联网路由器附近，你只需插入一根以太网线缆即可。


    ![](img/f11b7dbb71886af07ef87126037ebe98_29_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_29_1.png)


    ## 让你的树莓派联网

    ### 联网

    为了访问海量的工具、应用和资源，你需要联网。以下是操作方法...


    联网最简单的方法是购买一款树莓派 Model B+，因为它带有一个以太网接口。Model A 不仅缺少以太网端口，而且由于只有一个 USB 端口，这使得联网变得困难。这意味着你将不得不购买一个带电源的
    USB 集线器才能联网。回到 Model B+；为了联网，只需将以太网线缆插入树莓派的接口，并将其连接到互联网调制解调器/路由器的相应端口。打开树莓派并启动桌面，然后双击
    Epiphany，你应该会看到互联网出现（主图）。要检查它是否工作，请查看树莓派本身的指示灯。红色电源灯应该亮起。在此上方的是绿色灯，在访问 SD 卡时会闪烁。在电源灯下方是三个与以太网相关的指示灯。注意，Model
    A 没有这些 LED，因为它没有以太网接口。中间的绿灯在检测到全双工 LAN 连接时会亮起。这意味着它能够与互联网进行数据的发送和接收。下一盏绿灯在实际通过发送或接收数据访问互联网时会闪烁。最后的一盏黄灯在检测到
    100Mb LAN 连接时会亮起并保持常亮。


    ### Wi-Fi 选项

    如果你距离调制解调器/路由器太远而无法插入以太网连接，或者你只是一台 Model A，那么你需要一个带电源的 USB 集线器。这插入到树莓派的一个 USB
    端口上。然后你可以将 Wi-Fi 适配卡插入其中。启动树莓派并打开桌面。然后双击 Wi-Fi Config 图标。你应该在适配器部分看到适配卡的名称。点击“扫描”以查找网络，找到的网络列表应该会显示出来（图
    1）。双击你想要连接的网络，它的详细信息将列出。几乎所有家庭网络都使用网络密钥，这通常写在调制解调器本身。点击 PSK（预共享密钥），并将其输入（图 2）。然后点击“添加”。它将处理此请求，然后建立连接并

    '
