  - "[PAGE 58]\n\n# Control an LED using GPIO\n\n# Projects\n\n**Breadboard**\nThe\
    \ breadboard, or prototyping board, provides an easy-to-use and reforetable environment\
    \ for creating and changing your development circuits\n\n**Breadboard wire**\n\
