    ## 四大扩展板


    ### 入门指南


    #### HiFiBerry DAC+ 30英镑


    作为一款高质量的音频设备，你可能会发现树莓派在这方面有所不足，因为它仅配备了一个不适合高保真音频的3.5毫米立体声输出口。你或许曾梦想过提升音质，将你的系统升级到下一个层级。好消息是，树莓派基金会的聪明才智团队提供了对
    I2S 引脚的访问权限，最初是在独立的 PS 排针上，而现在在树莓派 4、树莓派 2 和 3 上，可以从主 40 针 GPIO 排针获取。I2S 是一种专为音频设备设计的通信协议，它使
    HiFiBerry 和 Quadio 等公司能够创建高质量的音频扩展设备。HiFiBerry DAC+ 是一款扩展板，可将高分辨率（192 kHz, 24位
    Burr-Brown 数模转换器）带入你的树莓派。它具有使用 Alsamixer 的硬件音量控制等其他功能，并且由于它是 HAT 兼容板，因此在开箱即用的情况下即可与最新版本的树莓派固件以及所有流行的标准使用和媒体播放操作系统（如
    Raspbian、Arch Linux、OSMC、OpenELEC、Volumio、Pi MusicBox 等）配合使用。如果你非常重视音质，并希望获得一种高质量、低成本且联网的解决方案，那么你再也没有借口了——你可以以低于100英镑的价格自行构建一个。


    ![](img/f11b7dbb71886af07ef87126037ebe98_38_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_38_1.png)


    #### Energenie Pi-mote 20英镑


    智能家居自动化目前非常流行，自动化任务如在你睡觉前自动开启暖气控制并关闭灯光，可以让我们的生活变得轻松许多。


    我们常被告诉的一件事是，最好在插头处关闭设备，而不是让它们处于待机状态，因为如果未正确关闭，它们会消耗大量电力。这正是 Enegrenie Pi-mote
    控制启动套件发挥作用的地方。它包含两个可通过 RF 遥控器开关的遥控插插座。


    这与树莓派有什么关系呢？你还会得到一块扩展板，使你可以透过软件控制树莓派上的插座，这解锁了全新的可能性——你可以设定灯具在你外出时自动在特定时间开关，以威慑窃贼。


    它们仅提供英式和欧规插头类型，因此如果你使用不同的插头，可能需要寻找其他产品（并也许可以向 Enegenie 发送请求以制作更多版本）。


    > “Enegrenie Pi-mote 控制启动套件包含两个可通过遥控开关的插座”


    ## 项目


    ### 备份你的树莓派


    主动备份你的树莓派，确保你永远不会丢失文件。


    虽然树莓派是一台非常坚固的设备，但故障可能会发生，因此最好做好准备并妥善保存你的文件。


    好消息是，树莓派的所有文件都外部存储在 SD 卡上。如果你的树莓派坏了，所有内容仍会保留在 SD 卡上并可以从其他地方访问。不过，SD 卡仍然容易出现问题。备份树莓派有几种方法。


    这些方法可以分为两大类：保存重要文件和创建 SD 卡状态的精确副本。前者意味着在其他地方保留文件的副本，而后者则是创建通常在安装 Raspbian 或其他树莓派操作系统时写入
    SD 卡的同类型映像。


    #### 重要文件


    为了保存重要文件，我们需要在外部源（如外部硬盘或另一台 PC）上创建副本。最好的方法之一甚至不涉及树莓派：你只需要一台带读卡器的 PC 或笔记本电脑，就可以开始了。


    关闭树莓派，拔掉电源并从插槽中取出 SD 卡。找到你 PC 上的 SD 卡读卡器并插入它。SD 卡的主要文件系统默认可以被 Linux PC 读取，Windows
    或 Mac 计算机在安装允许其读取 ext 文件系统的程序（如 Ext2Fsd）后也可以读取。在 Windows 上，SD 卡会与“我的电脑”下的其他驱动器一起列出（图
    1）。在 Linux 和 Mac 上，它会在菜单和文件管理器中显示存储设备的地方列出。


    找到 SD 卡后，打开它并导航到 home 然后 pi。这是可以找到 Documents、Downloads、Desktop 和其他目录的地方。你只需要选择要复制的文件，并将它们移动到
    PC 上的安全目录或连接的外部硬盘上。


    **你将需要的...**


    - 第二台计算机

    - 外部存储


    **你知道吗...**


    SD 卡不会永远持久，因此请始终确保你拥有文件的备份以及整个操作系统的备份。


    ![](img/f11b7dbb71886af07ef87126037ebe98_39_0.png)


    如果你希望将文件保留在另一台计算机上，那也没问题，但从长远来看，它将会面临与树莓派完全相同的问题。将它们保存在外部硬盘上是个好主意，而将它们放在云存储服务上则更好，这样你可以从任何有互联网连接的地方访问它们（图
    2）。


    #### 克隆


    创建克隆取决于你在主计算机上使用什么操作系统。对于 Mac 和 Linux，你可以使用一个简单的命令行工具 **dd** 来创建 SD 卡的精确副本（图 3）。这是在终端模拟器或命令行中完成的，所以先打开它。确保
    SD 卡已插入，并输入：


    ```

    $ fdisk -l

    ```


    这会列出所有连接的存储设备。SD 卡可能有 2、4 或 8GB 的空间，取决于其大小。它很可能被列为类似 **/dev/sd[x]** 的名称，其中 x 是计算机分配给
    SD 卡的字母。要使用 dd 复制它，请在终端中输入以下内容：


    ```

    $ dd if=/dev/sd[x] of=backup_img bs=1M

    ```


    你还可以添加正在创建的映像的路径，将其放在特定文件夹中。该过程需要一些时间，并会生成一个数吉字节的文件，然后你可以通过反转上一条命令将其写入 SD 卡：


    ```

    $ dd if=backup_img of=/dev/sd[x] bs=1M

    ```


    虽然这作为备份很有用，但你还可以使用该映像批量生产 SD 卡，送给朋友或保留在你可以使用树莓派的各种地方。


    #### Windows


    要在 Windows 上创建克隆，我们可以使用 Win32 Disk Imager（图 4）。从这里下载安装它：**bit.ly/L8jYDg**。


    安装完成后，插入 SD 卡并启动软件。为备份文件选择一个名称，并从设备列表中选择 SD 卡。现在按“Read”（读取），它将创建备份文件。同样，这可能需要一段时间；不过，这次你至少会看到一个进度条。


    存储你的克隆映像比存储重要文件稍显困难——由于映像的大小为吉字节级别，它会占满许多云存储服务。如果你有空间，当然要把它放在那里；不过，你可能需要将其放在外部硬盘上。


    ![](img/f11b7dbb71886af07ef87126037ebe98_40_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_40_1.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_40_2.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_40_3.png)


    ### 初学者的 nano 指南


    学习如何使用 Linux 最好的工具之一在命令行和终端中编辑文本。


    如果你渴望在树莓派上做得更多，那么你需要学习的一项重要技能之一是编辑系统文件的能力，以便完成许多项目。命令行文本编辑器 nano 绝对是完成此任务的最佳工具之一。文本编辑器是非常基础的工具：在这种情况下，答案就在名字里。没有格式设置、颜色或类似文字处理器中那样的东西，但这就是重点。你要创建或编辑的文件通常包含代码——这些代码不需要加粗或项目符号。nano
    去除了所有这些干扰因素，但仍然保留了一些图形文本编辑器中更实用的功能。我们将教你如何充分利用 nano，使你的项目快速、高效地运行。


    ![](img/f11b7dbb71886af07ef87126037ebe98_41_0.png)


    **你将需要的...**


    - 完整的 nano 手册

    - www.nano-editor.org/dist/v2.2/nano.1.html


    > **你知道吗...**

    > Nano 是初学者最好的命令行编辑器之一，但还有很多选择，比如 Kate 和 Vim。


    **写作**


    - 在命令行上创建纯文本文件，甚至为程序编写一些代码


    **编辑**


    - 根据你的需求和项目编辑系统文件，而无需在文件管理器中拖拽


    **高级功能**


    - 使用 nano 的一些内置功能进行搜索、复制、粘贴以及从另一个文件插入文本


