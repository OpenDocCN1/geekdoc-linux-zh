    \ Wi-Fi on another machine\n\n**09** If you want to use the Pi Zero as a headless\
    \ device with Wi-Fi then you can prepare an SD card using another Linux machine\
    \ that will already be configured to connect to the correct Wi-Fi network. You\
    \ have to mount the SD card and edit /etc/wpa_supplicant/wpa_supplicant.conf,\
    \ which is the same file that is configured by the Raspbian user interface from\
    \ the previous step. Insert the SD card into your Linux machine and work out what\
    \ the device is called\n\n```\ndmesg | tail -n 3\n[326516.612994] mmc0: new high\
    \ speed SDHC card at address 0001\n[326516.613437] mmcblk0: mmc0:0001 SD08G 7.35\
    \ GiB\n```\n\nSo the device is /dev/mmcblk0 - now we need to work out which partition\
    \ number the root partition is (this will be different on a Raspbian image; we\
    \ are using a NOOBS image here).\n\n```\nsudo parted /dev/mmcblk0 print\n```\n\
    \nThis will give you a list of the partitions. The largest partition will be the\
    \ root partition. In this case it’s partition 7, so the root filesystem is at\
    \ /dev/mmcblk0p7. To mount the SD card and edit the wpa_supplicant.conf file do\
    \ the following\n\n```\ncd /mnt\nsudo mkdir pi\nsudo mount /dev/mmcblk0p7 pi/\n\
    cd pi/\nsudo nano etc/wpa_supplicant/wpa_supplicant.conf\n```\n\nThen fill in\
    \ your Wi-Fi details:\n\n```\nnetwork={\nssid=\"your_wifi_network\"\npsk=\"your_wifi_password\"\
    \nkey_mgmt=WPA-PSK\n}\n```\n\nThen finally\n\n```\ncd -\nsudo umount pi/\n```\n\
    \n#### Remotely access your Pi\n\n**10** You can use nmap to scan your local network\
    \ to find a Raspberry Pi. You need to know the address range of your local network\
    \ (common networks are 192.168.1.0/24, and 192.168.3.0/24). You can find it with\
    \ the ip addr command:\n\n`nmap -p22 -sV 192.168.1.0/24` will scan for a list\
    \ of devices with SSH open. Example output:\n\n```\nnmap scan report for 192.168.157.29\n\
    Host is up (0.070s latency).\nPORT STATE SERVICE VERSION\n22/tcp open ssh (Protocol\
    \ 2.0)\n```\n\nThen you can SSH in with\n\n```\nssh pi@192.168.157.29\n```\n\n\
    The password is 'raspberry.' If you are using the Pi headless, you’ll want to\
    \ disable the user interface that is started on boot by default:\n\n```\nsudo\
    \ systemctl set-default multi-user.target\n```\n\n#### Setup a VNC server\n\n\
    **11** VNC stands for Virtual Network Computing. Using VNC you can access the\
    \ Raspbian desktop over the network (meaning you only need power and Ethernet/Wi-Fi\
    \ connected). There is no audio support, but for any other tasks (including the\
    \ use of pygame) VNC should provide an acceptable level of performance. You can\
    \ install a VNC server with the following commands\n\n```\nsudo apt-get install\
    \ tightvncserver\n```\n\nThere are several free VNC clients available so a search\
    \ engine will help you find a suitable one. To start a VNC session on your Pi,\
    \ log in over SSH and then run tightvncserver. You will be prompted to enter a\
    \ password the first time you run it. You can specify a screen resolution with\
    \ the -geometry option; for example, `-geometry 1024x768`. You can kill an existing\
    \ VNC session with `tightvncserver -kill 1`, where `1` is the session number.\
    \ To connect to that session on a Linux machine, you could use the command `vncviewer\
    \ 192.168.157.29`, substituting for the IP address of your Raspberry Pi\n\n![](img/f11b7dbb71886af07ef87126037ebe98_18_0.png)\n\
    \n> “The minimum that you need connected for a NOOBS install is a monitor and\
    \ a keyboard”\n\n## What you'll need...\n\nRaspberry Pi downloads\nwww.raspberrypi.org/downloads\n\
    \n- **Did you know...**\n  The true official distro for the Pi is called Raspbian.\
    \ That's what most versions start, but there are also legacy ones.\n\n- **Card\
    \ speed**\n  The speed class to get a reasonably fast SD card to keep your system\
    \ running smoothly. Class 10 or above is best.\n\n- **Card format**\n  Before\
    \ you copy your OS image, you'll need to make sure the SD card is formatted into\
    \ the FAT 32 file system.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_19_0.png)\n\
    \n- **Command line**\n  If you are using OS X or Linux, then it's likely you will\
    \ use the command line to install your preferred operating system.\n\n- **Automated\
    \ tools**\n  There are a couple of graphical tools available which make installing\
    \ an image onto an SD card easy.\n\n## Install a distro\n\nWe take a look at some\
    \ of the key aspects involved in installing a pre-built OS\n\nWith its small size\
    \ and cheap price, many people might be fooled into thinking that the Raspberry\
    \ Pi is only usable for basic tasks, and learning to program on. While one of\
    \ the primary goals of the Pi was to increase computer literacy at a lower level\
    \ rather than just learning how to create Excel spreadsheets, the Pi has many\
    \ other great uses.\n\nAs the Raspberry Pi is essentially a mini PC, with an HDMI\
    \ and analog TV output rather than a traditional monitor connection, it can perform\
    \ many common tasks that a laptop or desktop is often used for. While it doesn't\
    \ really have the processing power or RAM to run the latest version of Windows,\
    \ there are other options.\n\nThere are a wealth of fully fledged operating systems,\
    \ many forked from their desktop big brothers that have been optimised specifically\
    \ for the Pi. One of the most popular of these is Raspbian, which is a port of\
    \ Debian. Debian is a key part of the Linux ecosystem, and many other popular\
    \ open source distributions are forked from the Debian source code. The original\
    \ Debian was released in 1993, and it's come a long way since. Raspbian needed\
    \ work to get performance levels up to standard, as the Pi uses the older ARMv6\
    \ architecture. It's now a great everyday desktop.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_0.png)\n\
    \n### Obtaining OSs\n\n**01** One of your first questions may be ‘where can I\
    \ find some operating systems to download?’\n\nMost of the common images can be\
    \ found on the main Raspberry Pi site: **www.raspberrypi.org/downloads.** These\
    \ are stable and well tested systems worth investigating.\n\n### Unzipping\n\n\
    **02** When you’ve downloaded your image, the first thing you’ll most likely need\
    \ to do is unzip it. This can be done in Windows by right clicking and choosing\
    \ ‘extract’. In OS X, just double click to extract the files.\n\n### OS Format\n\
    \n**03** Within the zip you’ll find a file with a .img or .iso extension. These\
    \ are the equivalent of a ‘snapshot’ of an installation CD or DVD. Simply copying\
    \ the file to the SD card won’t do anything, you’ll need to use a program to extract\
    \ it.\n\n### SD card format\n\n**04** The SD card that you’ll boot from needs\
    \ to be blank, so make sure there is nothing important on it first. You’ll also\
    \ need to format it to use the FAT32 file system. This is a common system, used\
    \ by most USB sticks and cameras.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_1.png)\n\
    \n### Formatting the card\n\n**05** In Windows, to format the card simply insert\
    \ and wait for it to mount. Then click on ‘My Computer’ and then right click on\
    \ the card’s icon. After that choose format and then ‘FAT32’ from the drop-down\
    \ menu.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_2.png)\n\n### Using the\
    \ terminal\n\n**06** If you are using OS X or Linux, then you’ll have to use the\
    \ terminal to copy the image. In OS X, the Terminal app comes installed by default,\
    \ and most Linux versions come with one in some form or other. It may be referred\
    \ to as the ‘console’ or ‘command line’.\n\n### DD command\n\n**07** The command\
    \ you need to use is called ‘dd’. This is entered in the format of ‘sudo dd bs=1m\
    \ if=[img] of=[device]’. Eg:\n\n```\nsudo dd bs=32m if=/Users/rachelclabb/Desktop/archlinux/archlinux-hf-2013-02-11.img\
    \ of=/dev/disk1\n```\n\n### Win 32 Disk Imager\n\n**08** Windows users can use\
    \ Win32 Disk Imager. Once you’ve downloaded the tool, simply right click on the\
    \ .exe, and choose ‘run as administrator’ and follow the prompts. When the installation\
    \ is complete you can put the SD card in your Pi. Easy!\n"
  mdcn: "\n\n## 入门指南\n\n### 配置你的树莓派 Zero\n\n#### GPIO\n\n一旦你焊接了一个 2x20 公头排针，你的 GPIO\
    \ 引脚就可以像往常一样工作了。在右侧，你可以看到四个未插件的引脚分别用于视频输出和一个复位开关。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_17_0.png)\n\
    \n#### 视频\n\n要使用视频输出端口，你需要一个 mini-HDMI 转 HDMI 适配器，不过你也可以通过未插件的引脚使用 RCA 复合视频输出。\n\
    \n#### 数据\n\n右侧的电源端口通常是 micro-USB。然而，旁边的数据端口现在也是 micro-USB 了；因此你很可能需要一个 micro-USB\
    \ 转 USB 适配器。\n\n#### 准备 NOOBS SD 卡\n\n**06** 有关更多详细信息，请访问 [www.raspberrypi.org/help/noobs-setup](https://www.raspberrypi.org/help/noobs-setup)。NOOBS\
    \ 需要一张格式化为 FAT32 的 SD 卡。然后你需要从 [https://downloads.raspberrypi.org/NOOBS_latest](https://downloads.raspberrypi.org/NOOBS_latest)\
    \ 下载最新的 NOOBS 镜像，并将其解压到 SD 卡中。在 Linux 系统上，步骤如下：\n\n```\nsudo parted /dev/mmcblk0\n\
    (parted) mktable msdos\n(parted) mkpart primary fat32 0% 100%\n(parted) quit\n\
    sudo mkfs.vfat /dev/mmcblkp1\ncd /mnt\nsudo mkdir pi\nsudo mount /dev/mmcblkp1\
    \ pi\ncd pi\nsudo unzip ~/Downloads/NOOBS_v1_5_0.zip\nsync\ncd ..\nsudo umount\
    \ pi\n```\n\n#### 启动 NOOBS 并安装 Raspbian\n\n**07** 按照第一步所示连接你的树莓派 Zero。安装 NOOBS\
    \ 所需的最少连接是显示器和键盘。然而，鼠标以及以太网适配器或 Wi-Fi 适配器也非常有用。按回车键选择 Raspbian，然后按 1 进行安装。接着按回车键确认同意。完成后，它会显示“操作系统安装成功”。按\
