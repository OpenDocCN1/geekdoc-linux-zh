  - "[PAGE 92]\n\n# # Time-lapse camera trigger\n\n# ## Manual focus\n\nWe won’t be\
    \ controlling the autofocus with our Python apps so either focus to manual and\
    \ select your camera settings in advance of the shoot\n\n![](img/f11b7dbb71886af07ef87126037ebe98_92_0.png)\n\
    \n2.5mm to 3.5mm\n\nWe’re using a cheap Canon EOS DSLR, so to trigger the shutter\
    \ with the Raspberry Pi, we’ve need a simple 2.5mm to 3.5mm cable\n\n![](img/f11b7dbb71886af07ef87126037ebe98_92_1.png)\n\
    \n# ### Pi Cobbler\n\nWe’re using the Pi Cobbler as a breakout for the Pi’s GPIO\
    \ pins, making the build process easier (though it’s not required)\n\n# ### Configure\
    \ the breadboard\n\nFor the Raspberry Pi’s GPIO to control the camera, we need\
    \ to create a circuit between a pin on the GPIO (in this case pin 23 on the Cobble)\
    \ - but it’s actually physical pin 16) and the pin that connects to the ‘head’\
    \ or ‘tail’ of the camera cable that activates the shutter when connected. The\
    \ base of the connector cable is always ground, so make sure you ground the GND\
    \ pin on the Cobbler and the middle pin on the audio jack. With the circuit complete,\
    \ we can focus on the code.\n\n# ### The Time-lapse Photography Tool\n\nWe’ve\
    \ created a small 55-line Python utility called the Linux User Time-lapse Photography\
    \ Tool, which asks the user to input how many shots they’d like to take and the\
    \ frequency they’d like them taken. It then takes that information and uses it\
    \ in a For loop to activate the shutter using GPIO pin 16. If you’d like to use\
    \ the project in the field, we’d recommend using the Android app ConnectBot to\
    \ SSH into your RaspPi for input and feedback. Don’t forget to start your script\
    \ with sudo python time_lapse_camera.py\n\n```\n```\nfor i in range(0, shots):\n\
    \    print\n    print\n    print 'Shot %d of %d!' % (taken, shots)\n    taken\
    \ =1\n    GPIO.output(16, GPIO.HIGH)\n    time.sleep(0.5)\n    GPIO.output(16,\
    \ GPIO.LOW)\n    time.sleep(interval)\n    GPIO.cleanup()\nelse:\n    print \"\
    Let's try again (or press Ctrl + C to quit).\\n\"\n    main()\nelse:\n    print\
    \ \"Oops - You can only enter numbers. Let's try again.\\n\"\n    main()\nprint\n\
    print\nprint 'Thanks for using the Complete Manual Time-lapse Tool\\n'\nagain\
    \ = raw_input('Would you like to do another time-lapse? (Yes/No):\\n> ') \nproceed\
    \ = again.lower()\nif proceed:\n    main()\nelse:\n    print '\\nSee you next\
    \ time!\\n'\n    quit()\nif __name__ == \"__main__\":\n    main()\n```\n```\n\n\
    # ### Creating a video\n\nWith your camera packed with images, we need to collect\
    \ and output them as a video file. While it’s possible on the Pi, copy them to\
    \ an easily accessible folder on a separate Linux PC to make it much faster. We’re\
    \ going to use FFmpeg with the terminal open in the folder where our images are\
    \ stored. type: **ffmpeg -i image%04d -v imageX04d.avi**. This assumes you have\
    \ libx264 installed on your machine and the **imageX04d.jpg** assumes the file\
    \ format and the number of digits it’s dealing with (in this case ‘picture0001.jpg’)."
  - "[PAGE 93]\n\n# Projects\n\n# Build an iBeacon\n\n# Build an iBeacon with Bluetooth\n\
    \nGet to grips with Apple's iBeacon technology using your Raspberry Pi as a DIY\
    \ PfiBeacon\n\n# What you'll need...\n\n+   * USB Bluetooth Low-Energy device,\
    \ bit.ly/1Md0kic\n+   * Android/iOS device\n+   * Android/iOS beacon app, BlueZ\n\
    \n> **Did you know...**\n> \n> A Bluetooth Low-Energy (BLE) device is the key\
    \ to success with this project, but if you opt for any old USB Bluetooth dongle,\
    \ the chances are you won't have the success you're expecting. For the best results,\
    \ order online from ModdMyPi the version 4.0 bit.ly/2mpO48.\n\nThough it once\
    \ seemed futuristic, targeted advertising has now become commonplace. While it\
    \ doesn't rely on retinal identification (yet), iBeacon from Apple uses Bluetooth\
    \ and an iPhone 4S or later in close proximity to trigger an app or message. Google,\
    \ meanwhile, has its own version, known as EddyStone. Raspberry Pi owners can\
    \ investigate this technology in more detail by setting their devices up as 'PfiBeacons'\
    \ with the addition of a low-cost Bluetooth Low-Energy (BLE) USB module, available\
    \ from ModdMyPi at bit.ly/1MtdDbJC.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_93_0.png)\n\
    \n# Prepare your Pi\n\n+   1. To set your Raspberry Pi up as a PfiBeacon, begin\
    \ with a fresh, updated version of Raspbian, perhaps installed using NOOBS. From\
    \ here, run the update and upgrade commands to ensure that your Raspbian version\
    \ is fully up to date. When this is done, you can proceed to install the libraries\
    \ required for your PfiBeacon project.\n+   \n+   Again, these will take a little\
    \ bit of time to download and install. Once the libraries have installed, however,\
