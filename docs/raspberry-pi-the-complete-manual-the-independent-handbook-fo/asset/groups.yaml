    \n```python\n$ sudo nano gpio.py\n$ GPIO.setmode(GPIO.BOARD)\n```\n\n### 设置引脚模式\n\
    \n19 在引脚能够工作之前，必须将其定义为输入或输出。GPIO 库通过调用 GPIO.setup 方法简化了这一点。你需要传入引脚编号，然后是 GPIO.OUT\
    \ 或 GPIO.IN。由于我们要使用 LED，所以它是输出。你会经常用到这些约定，因此尽量好好学学，让它们入脑！\n\n```python\n$ GPIO.setup(12,\
    \ GPIO.OUT)\n```\n\n### 使用 PWM\n\n20 下一步是告诉引脚进行输出，然后设置一种退出程序的方法。这里我们再次调用 GPIO\
    \ 类，然后是 PWM 方法，传入引脚编号，第二个值是以赫兹为单位的频率——在本例中为 0.5。\n\n```python\n$ p = GPIO.PWM(12,\
    \ 0.5)\n$ p.start(1)\n$ input('Press return to stop:')\n$ p.stop()\n$ GPIO.cleanup()\n\
    ```\n\n### 调整 PWM\n\n21 为了给 LED 添加定时器使其渐暗，我们首先需要导入 time 库，然后设置第 12 引脚起始频率为 50Hz。\n\
    \n```python\n$ import time\n$ import RPi.GPIO as GPIO\n$ GPIO.setmode(GPIO.BOARD)\n\
    $ GPIO.setup(12, GPIO.OUT)\n$ p = GPIO.PWM(12, 50) # channel=12 frequency=50Hz\n\
    $ p.start(0)\n```\n\n### 添加渐变\n\n22 然后我们添加另一个 try-except 块，这次检查 LED 的功率等级——一旦达到特定水平，我们就反转这个过程。要运行此代码，只需将其保存为\
    \ main，然后运行 sudo python gpio.py。\n\n```python\n$ while 1:\n    try:\n        for\
    \ dc in range(0, 101, 5):\n            p.changeDutyCycle(dc)\n            time.sleep(0.1)\n\
    \        for dc in range(100, -1, -5):\n            p.changeDutyCycle(dc)\n  \
    \          time.sleep(0.1)\n    except KeyboardInterrupt:\n        pass\n\np.stop()\n\
    \nGPIO.cleanup()\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_60_0.png)\n\n\
    > “请将 GPIO 模式设置为 BOARD。无论你使用的是哪个版本的树莓派，这都能正常工作。”\n\n## 项目\n\n### 你需要的材料……\n\n\
    - **Raspbian**\nwww.raspberrypi.org/downloads\n\n- **SD 卡**\n\n### 给你的树莓派充电\n\n\
    > 通过这些性能提升的技巧和窍门，最大限度地利用你的树莓派\n\n你的树莓派已连接电源，SD 卡上已安装 Raspbian，你正忙于设置无线打印服务器或构建一个从门垫收集邮件的机器人。但你真的在最大限度地利用这台小计算机吗？也许你还没有探索\
    \ Raspbian 的全套选项，或者你正在从 SD 卡运行整个操作系统，这会缩短 SD 卡的使用寿命。可以运用各种工具和技术来提高性能，从选择合适的硬件到对\
    \ CPU 超频。你甚至可以最大化树莓派 SD 卡的存储空间，或者几乎完全用第二设备取代它。使用这些技巧和窍门来重新配置树莓派设置，优化软件和硬件，以确保获得最佳性能。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_61_0.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_62_0.png)\n\
    \n### 使用更好的存储硬件\n\n01 无论你使用何种操作系统，存储介质的选择都会影响树莓派的性能。低容量且纠错能力差的 SD 卡会比大容量且韧性更强的卡更慢，因此你需要为项目找到合适的平衡点并明智地购物。\n\
    \n### 选择最佳 SD 卡\n\n02 市面上有各种标准的 SD 卡，较贵的那些设计用于提供更好的纠错能力。为了在树莓派上获得最佳性能，请选择具有高评级\
    \ SDHC 卡。同样的建议也适用于 MicroSD 卡，你可以使用 SD 卡适配器在树莓派上使用它，或者直接插入树莓派 B+。\n\n### 充分利用你的\
    \ SD 卡\n\n03 你通常需要 1-2GB 的存储空间来安装所选的树莓派发行版，因此 SD 卡上剩余的存储空间将用于更新以及你创建或保存的数据。在 Raspbian\
    \ 中，你可以打开命令行并运行配置工具来获得更多空间（仅当你的 SD 卡大于 2GB 时）。\n\n```bash\nsudo raspi-config\n\
    ```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_62_1.png)\n\n### 扩展 Raspbian 分区\n\
    \n04 最大化分区可使用 SD 卡的全部容量，这将增加介质的使用寿命（因为有更多空间可写入，所以相同的扇区不会频繁被覆盖）。在 raspi-config\
    \ 运行时，使用方向键在菜单中选择 expand_roots。然后短暂等待，直到分区调整大小完成。\n\n### 将数据写入 RAM\n\n05 而不是将数据读写到\
    \ SD 卡——这最终会导致卡的可靠性和性能下降——你可以配置 Raspbian 写入系统 RAM，这会稍微加快速度并提高 SD 卡的整体性能。这是通过使用\
    \ fstab 文件系统表实现的，该表是大多数 Linux 发行版中可用的系统配置。\n\n### 在 Raspbian 中启用 fstab\n\n06 这很像在\
    \ Windows 中创建 RAM 盘。在命令行中输入：\n\n```bash\nsudo nano /etc/fstab\n```\n\n添加以下行以挂载虚拟文件系统：\n\
    \n```bash\ntmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=50m 0 0\n\
    ```\n\n保存并退出 nano (Ctrl+x) 后，安全地重启树莓派：\n\n```bash\nsudo shutdown -r now\n```\n\
    \n> “你通常需要 1-2GB 的存储空间来安装所选的树莓派发行版。”\n\n### 选择外部 USB 驱动器\n\n通过迁移根文件系统到外部 USB 驱动器来加速树莓派是一个好的开始，但你应该使用哪种设备以获得最佳性能？使用\
    \ USB 拇指驱动器，你可以添加高达 16GB 的闪存存储，而不会遇到任何重大问题（驱动器越大，读写所需的电流越大）。更大的驱动器既昂贵又没必要。如果你计划使用外部\
    \ HDD，由于它有自己的电源，所以不存在电源问题。一如既往，你的选择应符合你的项目需求。\n\n### 配置 fstab 以获得快速性能\n\n07 重启后，虚拟文件系统将被挂载，RAM\
    \ 磁盘上的 /var/log。其他可以移动到 RAM 的目录包括：\n\n- `tmpfs /tmp tmpfs defaults,noatime,nosuid,size=10m\
    \ 0 0`\n- `tmpfs /var/tmp tmpfs defaults,noatime,nosuid,size=30m 0 0`\n- `tmpfs\
    \ /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0 0`\n- `tmpfs /var/run\
    \ tmpfs defaults,noatime,nosuid,mode=0755,size=2m 0 0`\n- `tmpfs /var/spool/1mqueue\
    \ tmpfs defaults,noatime,nosuid,mode=070,gid=12,size=30m 0 0`\n\n在 nano 中将每一项添加到\
    \ /etc/fstab。\n\n### 将你的操作系统移动到 HDD\n\n08 如果你担心 SD 卡的使用寿命，何不减少树莓派对它的依赖？不要将 SD\
    \ 卡当作一种廉价 SSD 使用，而是改变其角色，添加 HDD 或 USB 拇指驱动器来运行操作系统，将 SD 卡留给引导启动。这可以显著提高 SD 卡的性能。\n\
    \n### 备份 SD 卡\n\n09 创建树莓派 SD 卡的副本。关机，取出卡，将其插入台式电脑。在命令行中运行：\n\n```bash\nsudo dd\
    \ bs=4M if=/dev/sdb of=~/backup.img\n```\n\n路径 /dev/sdb 代表 SD 卡。复制需要 5-10 分钟。完成后，取出\
    \ SD 卡并连接你的 USB 设备。\n\n### 将 Raspbian 复制到 USB\n\n10 使用空白的 Ext4 格式 USB 拇指驱动器（或外部\
    \ HDD）作为目标驱动器，输入：\n\n```bash\nsudo dd bs=4M if=~/backup.img of=/dev/sdc\n```\n\
    \n将备份留在电脑上，以防万一出现问题。当 SD 卡和 USB 存储设备共享相同的磁盘映像时，是时候考虑接下来要做什么了——创建一个更快的树莓派，\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_63_0.png)\n\n"
