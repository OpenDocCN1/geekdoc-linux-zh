    \ 2.0)\n```\n\n然后你可以使用以下命令通过 SSH 登录\n\n```\nssh pi@192.168.157.29\n```\n\n密码是\
    \ 'raspberry'。如果你是将树莓派作为无头设备使用，你可能想要禁用默认在启动时开启的用户界面：\n\n```\nsudo systemctl set-default\
    \ multi-user.target\n```\n\n#### 设置 VNC 服务器\n\n**11** VNC 代表虚拟网络计算（Virtual Network\
    \ Computing）。使用 VNC，你可以通过网络访问 Raspbian 桌面（这意味着你只需要连接电源和以太网/Wi-Fi）。虽然不支持音频，但对于其他任何任务（包括使用\
    \ pygame），VNC 都应该能提供可接受的性能水平。你可以使用以下命令安装 VNC 服务器\n\n```\nsudo apt-get install\
    \ tightvncserver\n```\n\n市面上有几种免费的 VNC 客户端，搜索引擎可以帮助你找到一个合适的。要在你的树莓派上启动一个 VNC 会话，先通过\
    \ SSH 登录，然后运行 `tightvncserver`。首次运行时，它会提示你输入密码。你可以使用 `-geometry` 选项指定屏幕分辨率；例如，`-geometry\
    \ 1024x768`。你可以使用 `tightvncserver -kill 1` 来终止现有的 VNC 会话，其中 `1` 是会话编号。要在 Linux\
    \ 机器上连接到该会话，你可以使用命令 `vncviewer 192.168.157.29`，并将 IP 地址替换为你的树莓派的 IP 地址\n\n![](img/f11b7dbb71886af07ef87126037ebe98_18_0.png)\n\
    \n> “安装 NOOBS 所需的最少连接是显示器和键盘”\n\n## 你需要什么...\n\n树莓派下载\nwww.raspberrypi.org/downloads\n\
    \n- **你知道吗...**\n  树莓派的真正官方发行版名为 Raspbian。大多数版本都以此开头，但也有遗留版本。\n\n- **卡速度**\n \
    \ 为了保持系统流畅运行，你需要一张速度等级合理的 SD 卡。Class 10 或以上最好。\n\n- **卡格式**\n  在复制你的操作系统镜像之前，你需要确保\
    \ SD 卡已格式化为 FAT 32 文件系统。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_19_0.png)\n\
    \n- **命令行**\n  如果你使用的是 OS X 或 Linux，那么你很可能会使用命令行来安装你首选的操作系统。\n\n- **自动化工具**\n\
    \  有几种图形化工具可用，它们使将镜像安装到 SD 卡变得轻而易举。\n\n## 安装发行版\n\n我们来看一下安装预构建操作系统涉及的一些关键方面\n\n\
    凭借其小巧的体积和低廉的价格，许多人可能会误以为树莓派只能用于基本任务和学习编程。虽然树莓派的主要目标之一是提高较低层次（而不仅仅是学习如何创建 Excel\
    \ 电子表格）的计算机素养，但树莓派还有许多其他出色的用途。\n\n由于树莓派本质上是一台迷你 PC，拥有 HDMI 和模拟电视输出而非传统的显示器连接，它可以执行笔记本电脑或台式机经常处理的许多常见任务。虽然它并没有足够的处理能力和\
    \ RAM 来运行最新版本的 Windows，但也有其他选择。\n\n有许多功能完善的操作系统，其中许多是从其桌面“大哥哥”版本分叉而来并专门为树莓派优化的。其中最受欢迎的之一是\
    \ Raspbian，它是 Debian 的移植版。Debian 是 Linux 生态系统的关键部分，许多其他流行的开源发行版都是从 Debian 源代码分叉而来的。最初的\
    \ Debian 于 1993 年发布，此后它已经走了很长一段路。Raspbian 需要大量工作才能达到标准的性能水平，因为树莓派使用的是较旧的 ARMv6\
    \ 架构。现在它已经是一个很棒的全天候桌面系统了。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_0.png)\n\
    \n### 获取操作系统\n\n**01** 你的第一个问题可能是“我可以在哪里找到一些可下载的操作系统？”\n\n大多数常见的镜像都可以在主要的树莓派网站上找到：**www.raspberrypi.org/downloads**。这些是稳定且经过充分测试的系统，值得探究。\n\
    \n### 解压缩\n\n**02** 当你下载好镜像后，你很可能需要做的第一件事就是解压它。在 Windows 中，可以通过右键点击并选择“提取”来完成。在\
    \ OS X 中，只需双击即可提取文件。\n\n### 操作系统格式\n\n**03** 在压缩包中，你会找到一个扩展名为 .img 或 .iso 的文件。这些相当于安装\
    \ CD 或 DVD 的“快照”。仅仅将文件复制到 SD 卡上是没有用的，你需要使用程序来提取它。\n\n### SD 卡格式\n\n**04** 你将用于启动的\
    \ SD 卡必须是空白的，所以请先确保上面没有重要内容。你还需要将其格式化为 FAT32 文件系统。这是一个常见的系统，大多数 U 盘和相机都使用它。\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_20_1.png)\n\n### 格式化卡片\n\n**05** 在 Windows\
    \ 中，要格式化卡片，只需插入并等待其挂载。然后点击“我的电脑”，接着右键点击卡片的图标。之后选择“格式化”，然后从下拉菜单中选择“FAT32”。\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_20_2.png)\n\n### 使用终端\n\n**06** 如果你使用的是\
    \ OS X 或 Linux，那么你就必须使用终端来复制镜像。在 OS X 中，终端应用程序默认已安装，而大多数 Linux 版本都以某种形式包含终端。它可能被称为“控制台”或“命令行”。\n\
    \n### DD 命令\n\n**07** 你需要使用的命令叫做‘dd’。输入格式为‘sudo dd bs=1m if=[img] of=[device]’。例如：\n\
    \n```\nsudo dd bs=32m if=/Users/rachelclabb/Desktop/archlinux/archlinux-hf-2013-02-11.img\
    \ of=/dev/disk1\n```\n\n### Win 32 Disk Imager\n\n**08** Windows 用户可以使用 Win32\
    \ Disk Imager。一旦你下载了该工具，只需右键点击 .exe 文件，选择“以管理员身份运行”，并按照提示操作即可。安装完成后，你可以将 SD 卡插入你的树莓派。很简单！\n\
    \n"
