    # Raspberry Pi 3


    A super-charged Raspberry Pi that finally does everything you''d want it to, for
    the exact same price as the previous models


    While the Raspberry Pi has enjoyed years of success, there''s always been a couple
    of things a lot of users wanted. A slightly more powerful CPU that could handle
    day-to-day computing, more USB ports and maybe wireless to make connecting to
    the network easier.


    The Raspberry Pi 3 solves these problems. As it uses the same board design as
    the Model B+, it has four USB ports, as opposed to the two that were on the original
    Raspberry Pi Model B. More importantly, it has a much more powerful processor
    and more RAM, making it ten times faster than the original Pi. The Pi 3 has also
    added built-in wireless capabilities, which makes connecting to Wi-Fi and Bluetooth
    a cinch.


    The new BCM2837 chip is the heart of the Raspberry Pi 3, a modified version of
    the BCM2836 chip from the old Raspberry Pi 2. The quad-core, 900 MHz processor
    has been further powered up to become a 1,200 MHz beast, which helps to make the
    Pi 3 a much more functional board. Whereas before you might have had problems
    surfing the internet or writing a document, now the Pi 3 breezes through these
    tasks with ease and plenty of processor power to spare.


    At heart though, it''s still the same board as the Raspberry Pi B+. As well as
    the aforementioned four USB 2.0 ports, there''s the Ethernet port for wired internet,
    a good-quality 3.5mm headphone jack for sound, a HDMI port for digital video and
    audio and a 40-pin GPIO port. This expanded GPIO is fantastic for making your
    physical projects even more involved and complicated to do far cooler things.


    For those worried about compatibility, all your old files and projects and such
    work just fine on the Raspberry Pi 3, and all you need to do is transfer them
    over like any normal files.


    # Getting started


    **GPIO port**

    The 40 pins on the GPIO port give you a range of power and function slots to control
    a project or read more data from your surroundings. This makes the Raspberry Pi
    3 the perfect core for an Internet of Things or Maker project.


    **USB ports**

    The four USB ports give you much more flexibility with the Raspberry Pi 3, allowing
    you to easily add a keyboard, mouse, wireless dongle and external storage without
    needing to constantly switch out or get a powered hub.


    **Ethernet port**

    The Pi 3 retains the wired network and internet connection that was on the Model
    B of the original Raspberry Pi. It still tops out at 100 Mb, but that''s plenty
    fast enough for the Raspberry Pi 3.


    **Integrated wireless**

    The big upgrade brought in with the Raspberry Pi 3 is the introduction of built-in
    802.11n wireless LAN and Bluetooth 4.1. Connecting to the Internet and other devices
    has never been easier.


    **Headphone jack**

    Need to listen to your Raspberry Pi purring? Connect it to a pair of portable
    speakers! The 3.5mm jack is still on the Pi 3, and is one of the higher-quality
    ones that was added to the Pi 2.


    **MicroSD**

    Underneath the board is where the boot medium lives – the microSD card. Much smaller
    than the SD card of the original, it still holds the full operating system and
    allows the Pi 3 to be much smaller.


    **HDMI port**

    The Raspberry Pi''s special ability is its decoded 1080p video on the fly with
    very little problem, and the same trick still exists in the Pi 3. The HDMI port
    is basically the same, allowing for high definition video and audio.


    > “The Raspberry Pi 3 still won’t be able to power a USB hub, so if you need to
    expand the complement you’ll need to get a powered-hub”

