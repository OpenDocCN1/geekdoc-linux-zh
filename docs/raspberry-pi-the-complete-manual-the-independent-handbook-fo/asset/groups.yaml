    \ USB 端口。此外，受 SoC 限制，其内存仅为 256MB，而 B+ 则享有 512MB 的内存。但请不要以为这一切意味着 A+ 性能逊色。其 65mm\
    \ 的长度和更轻的重量正是其用途的线索。同时，缺乏以太网端口并不是一种缺陷，反而恰恰说明这款树莓派是为媒体中心和打印服务器设计的，但更适用于对重量有严格要求的项目。也许你会将其安装在一个由\
    \ Arduino 驱动的机器人上，其较低的功耗要求可以通过电池来满足。\n\n-   **MicroSD 存储**\n    再也不用担心 SD 卡被折断或丢失。树莓派\
    \ A+ 配备了一个用于 microSD 卡的推推式插槽。\n\n-   **可连接且灵活**\n    两款新的树莓派型号都将 GPIO 接针从 26 针增加到了\
    \ 40 针，从而提高了设备的灵活性。\n\n-   **板上集成了 256 MB 内存！**\n    这似乎很不可思议，但在所有这些功能之上，这款多功能的小型电脑中心还搭载了一颗\
    \ 700 MHz 的 700 MHz 系统级芯片（SoC）处理器和 256 MB 内存。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_9_0.png)\n\
    \n-   **它更小！**\n    最初的树莓派 Model B 电路板长度为 85mm。而 A+ 的长度仅为 65mm。\n\n-   **重新定位的电源插座**\n\
    \    现在 Micro USB 电源插座位于 HDMI 插座旁边，这使得安排和管理线缆变得更加容易。\n\n-   **它也更轻！**\n    令人难以置信的是，树莓派\
    \ Model A 的重量仅为 23 克（0.81 盎司），重量减少了近 50%。\n\n## 树莓派 Zero\n\n这款售价仅 4 英镑的微型计算机已席卷全球，但它有哪些变化？\n\
    \n体积比信用卡还小，Pi Zero 的外观 certainly 令人印象深刻。然而，尺寸缩小并不意味着性能缩水。Zero 的 1GHz 单核 CPU 和\
    \ 512MB 内存使这款主板的运行速度比最初的 Pi 快 40%。\n\n为了实现如此小的外形尺寸和低的生产成本，创建者精简了许多我们习以为常的端口。只剩下节省空间的\
    \ Micro 和 Mini 端口，且看不到以太网口，因此各种适配件将在要求较高的项目中发挥至关重要的作用。通过确保每个组件都有其存在的合理性，Pi Zero\
    \ 具有极高的通用性。它能够运行 Raspbian 等完整镜像，这意味着开始一个新项目比以往任何时候都简单。\n\nZero 的极简主义非常适合在无头（headless）模式下运行，加上一个\
    \ Wi-Fi 适配器，你可以通过 SSH 登录并进行控制，从而充分利用其唯一的 USB 端口。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_10_0.png)\n\
    \n**新的迷你 HDMI 端口**\n你需要一个适配器才能使用此端口。或者更好的是，采用无头模式并安装一个小型 OS 镜像。\n\n**MicroSD 卡**\n\
    这与较新的 B 型号相同，意味着你可以插入现有的卡并在几秒钟内开始运行。\n\n**未焊接的 GPIO 接针**\n由于与 Model A+/ B+/2B/3\
    \ 具有相同的引脚定义，你可以选择自行焊接接针，从而使 Zero 兼容 HAT。\n\n**Micro USB 端口**\n端口数量的短缺意味着比以往任何时候都更需要\
    \ USB 集线器和适配器来连接键盘或 Wi-Fi 适配器等设备。\n\n**极简连接器**\n没有以太网或音频端口，也没有摄像头或显示连接器！不过，未焊接的复合视频和复位接针仍然可用。\n\
    \n**比信用卡还小**\n尺寸为 65mm x 30mm x 5mm，Zero 的整体占地面积仅为 Model B 的十分之一。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_0.png)\n\
    \n## 入门套件\n\n*你的 Pi 比你第一眼看到的要多得多。*\n这里有一些帮你起步的关键外设设备。\n\n为了获得最佳的树莓派体验，除了实际的树莓派主板外，你还需要获取一些额外的配件。例如，你需要键盘和鼠标来输入命令和导航。虽然在不连接键盘和鼠标的情况下也能进行项目操作，但在初始设置时需要它们。SD\
    \ 卡也是一个重要的购买项目——操作系统就存储在那里。\n\n也许你需要一个 Wi-Fi 适配器，或者只需一根网线。然后是树莓派的基本电子电路方面，你需要什么来开始一些初学者的电子和控制实验？显然，树莓派的内容比许多人想象的要丰富得多。\n\
    \n所谓的“外设”，是指可以连接并利用树莓派的其他硬件。它们可以像一根不错的 HDMI 线那样简单，也可以是增强你项目功能的最新、最酷的特色小工具。\n\n\
    从机械臂到遥控直升机……树莓派拥有无限的可能性！唯一的限制是现有的硬件和你的想象力！\n\n### 你知道吗……\n\n大多数在线零售商都出售包含你可能需要的所有附件的套装——甚至包括预装系统的\
    \ SD 卡。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_1.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_2.png)\n\
    \n## 键盘和鼠标\n\n让我们从最基础的组件开始：键盘和鼠标。一般来说，几乎任何 USB 键盘和三键滚轮鼠标都可以与树莓派配合使用。虽然某些项目甚至不需要键盘和鼠标，但初始设置时需要它们。\n\
    \n## SD 卡\n\n早期的树莓派电脑需要 SD 卡，而后续型号如树莓派 2 和 3 则使用 micro/SD 卡进行存储。这是你选择的操作系统（如 Raspbian）的安装位置，这些卡有各种尺寸，可以预装操作系统，也可以是空白卡。\n\
    \n### 入门指南\n\n![](img/f11b7dbb71886af07ef87126037ebe98_12_0.png)\n\n## 电源线\n\n\
    树莓派使用标准的 Micro USB 连接器作为电源输入，工作电压为 5V。在大多数情况下，Micro USB 到 USB 的线缆就足够了，其一端可以插入台式机的\
    \ USB 端口。安卓手机充电器也应该能完美工作（5.25V 1500mA）。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_12_1.png)\n\
    \n## 外壳\n\n将树莓派固定在外壳中可以保护它，并防止脆弱的 GPIO 针脚受到意外损坏。外壳还可以使树莓派成为一个更具吸引力或更醒目的设备，例如作为媒体中心。请确保为树莓派型号选择正确的外壳。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_12_2.png)\n\n## 视频输出\n\n有两个视频输出端口：HDMI\
    \ 端口和 RCA 插座。HDMI 是大多数用户的主视频输出连接器，但 RCA 视频输出端口也可以用于连接电视、显示器或 SCART 线缆。你还可以通过 SSH\
    \ 或 VNC 远程访问你的树莓派。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_12_3.png)\n\n##\
    \ 带电源的 USB 集线器\n\n购买 Pi 时，额外增加 USB 端口值得早期考虑。一旦连接了键盘和鼠标，你就会明白原因！使用带电源的 USB 集线器很重要，以防止从\
    \ Pi 中抽取电力，并允许你连接外部硬盘驱动器等设备。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_12_4.png)\n\
    \n## 树莓派摄像头板\n\n这是一个定制设计的附加板，通过柔性电缆连接到树莓派的板载插座之一。它非常小巧，但功能强大，原生分辨率为 500 万像素，支持\
    \ 1080p 视频。它本质上就是 Pi 的智能手机摄像头！\n\n![](img/f11b7dbb71886af07ef87126037ebe98_12_5.png)\n\
    \n## USB Wi-Fi 适配器\n\n使用 USB Wi-Fi 适配器将增加你放置树莓派位置的灵活性。不受限制性以太网线的束缚，它可以用于更高级的项目，在这些项目中，运行有线互联网连接不是一个有效的选项。只需确保你购买的是树莓派友好的\
    \ Wi-Fi 适配器。\n\n"
