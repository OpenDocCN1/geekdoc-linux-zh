  mdcn: "\n# 命令行基础\n\n## 学习使用命令行和键盘控制树莓派的另一种方式\n\n我们可能都经历过在树莓派上的这种情景。你已将 Raspbian\
    \ 或其他树莓派操作系统安装到 SD 卡上，并且匆匆完成了设置脚本，或者没有做足功课。启动操作系统后……你最终停留在了一个命令行界面。此时的第一步是不要恐慌：这是完全正常的。它可能对你来说只是一个陌生的概念，你通常只在电影里见过那些精通网络技术、想要破坏“系统”的黑客们使用它。\n\
    \n第二步，至少在 Raspbian 的情况下，只需输入：\n\n```\n$ startx\n```\n\n就这样。Raspbian 会加载桌面环境，你又可以开始使用鼠标了。在这种情况下，这既快捷又无痛，许多其他操作系统也是如此。你所做的就是用一条命令，具体来说就是在这个情况下启动\
    \ X 服务器。X 服务器负责处理图形界面，在某些树莓派系统上默认可能是关闭的。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_21_0.png)\n\
    \n图 1：终端模拟器允许你在仍处于桌面环境的同时访问命令行\n\n- **你需要...**\n  - Raspbian\n  - www.raspberrypi.org\n\
    \n> **你知道吗...**\n> 命令行会记住你最近使用的命令。只需使用向上和向下箭头即可调用它们。\n\n## 一个新世界\n\n虽然将树莓派引导至桌面环境并不是你在命令行中唯一能做的事情。命令行内置了一个庞大的功能世界；事实上，你正在使用的大多数图形化程序只是以特定方式执行这些命令而已。你也不需要离开舒适的桌面环境来执行这些命令，因为所有树莓派操作系统都会附带一个名为“终端模拟器”（Terminal\
    \ emulator）的应用程序。\n\n这会创建一个窗口，你可以像我们启动桌面环境那样在其中输入命令，并使用完全相同的命令（图 1）。在 Raspbian\
    \ 上，在菜单的“附件”部分查找 **LX Terminal** 应用并点击它。如果你之前不得不使用 `startx` 来进入桌面，那么我们现在可以先修复这个问题再继续。在终端中输入：\n\
    \n```\n$ raspi-config\n```\n\n这是初始设置屏幕（图 2）。从这里你可以启用开机自启桌面（图 3），甚至可以更新固件并为官方树莓派相机模块添加支持。这允许你修改\
    \ Raspbian 而不需要重新安装。\n\n不过，你不会经常使用那两个命令，那么深入探索命令行有实际用处吗？当然有。首先，Raspbian 没有官方的软件包管理器。这是一个允许你浏览操作系统可用软件的程序，类似于树莓派商店。\n\
    \n然而，Raspbian 还有商店中无法获取的其他软件。你也不能专门更新树莓派软件，而所有这些都可以使用命令行来修复。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_22_0.png)\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_22_1.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_22_2.png)\n\
    \n## 入门\n\n## 适用于所有人的软件\n\n你想做的第一件事是确切地告知 Raspbian 在线有哪些可用内容。这是一个非常简单的任务，你只需要：\n\
    \n```\n$ sudo apt-get update\n```\n\n这将遍历包含 Raspbian 所用软件的在线软件仓库（或简称为仓库）列表。完成后，命令行提示符会再次出现，等待你的下一条命令。由于这是我们第一次执行此操作，你很可能需要更新树莓派上的当前软件。你可以使用以下命令做到这一点：\n\
    \n```\n$ sudo apt-get upgrade\n```\n\n它可能会要求你确认升级，如果是这种情况，请输入 Y 然后按 Enter。我们两次所做的都是使用命令行包管理器\
    \ APTitude (apt-get)，首先检查仓库，然后据此升级软件包（图 4）。第一个命令 `sudo` 允许它以管理员身份运行 `apt-get`\
    \ 任务，并常用于许多其他命令行操作。要安装软件，请使用 `install` 代替 `update` 或 `upgrade`，后面跟上软件包的名称。例如，对于数学编程语言，你可以使用以下命令安装它：\n\
    \n```\n$ sudo apt-get install wolfram-engine\n```\n\n> **你知道吗...?**\n> 你可以使用 Tab\
    \ 键完成命令，但如果你只输入了部分字符，请按 Tab。接受你看到的内容，按 Enter 完成。\n\n## 移动与创建\n\n安装和更新只是你可以在命令行中做的许多事情中的两件。你还可以浏览整个文件系统、移动文件、创建文件夹和删除项目。所有这些操作都非常简单。\n\
    \n当你首次打开终端时，它会打开在你的主文件夹中。虽然你无法具体看出它是主文件夹，但你可以通过以下方式显示目录中确切包含哪些类型的文件（图 5）：\n\n\
    ```\n$ ls\n```\n\n波浪号 (~) 用于表示主文件夹，并可用于在文件系统中导航。要导航，我们将使用 **cd** 命令，后面跟上你想要移动到的位置。可以这样操作：\n\
    \n```\n$ cd /home/pi/Downloads\n```\n\n这将把你移动到 Downloads 目录。由于我们一开始是在主文件夹中，实际上我们只需要这样做：\n\
    \n```\n$ cd Downloads\n```\n\n它是上下文敏感的，知道要在其所在的目录中查找。还有一个技巧可以让你不必记住路径的确切名称——如果你只输入了一部分内容并按下了\
    \ Tab 键，命令行或终端会尝试自动补全短语。再试一次 `cd` 命令，但试着在只写了 \"Down\" 的时候按 Tab。\n\n最后，还有一些你可以用来操作文件的快速命令。可以使用\
    \ **cp** 命令复制单个文件，后面跟上文件名和新位置，如下所示：\n\n```\n$ cp file.txt ~/Documents/file.txt\n\
    ```\n\n你还可以通过以下方式使用它来重命名文件：\n\n```\n$ cp file.txt otherFile.txt\n```\n\n原始文件可以使用\
    \ **rm** 命令删除：\n\n```\n$ rm file.txt\n```\n\n想创建新文件夹？使用 `cd` 移动到你需添加文件夹的目录，然后使用\
    \ **mkdir** 后面跟上你想给文件夹起的名字：\n\n```\n$ mkdir NewFolder\n```\n\n命令行可以做更多事情，但这些只是最基本的部分。随着你越来越多地使用\
    \ Linux，你会遇到需要使用命令行的任务，在这个过程中，你将学会当你像电影中的街头黑客那样工作时能完成多少事情。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_24_0.png)\n\
    \n> “如果你只输入了部分内容并按下了 Tab 键，命令行或终端会尝试自动补全短语”\n\n![](img/f11b7dbb71886af07ef87126037ebe98_24_1.png)\n\
    \n图 5：有许多简单的命令行工具可以帮助你浏览和使用你的系统\n\n## Raspbian 桌面\n\n虽然树莓派的 Raspbian 操作系统更接近 Mac\
    \ 而非 Windows，但其桌面最相似的是后者\n\n乍一看可能会觉得有点陌生，但使用 Raspbian 和使用 Windows 桌面几乎没有区别。有一个菜单栏、一个网络浏览器、一个文件管理器，并且正如你所预期的那样，你只需打开菜单并点击你想要开始使用的应用程序……\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_25_0.png)\n\n### 菜单按钮\n\n左上角类似 Windows\
    \ 的菜单按钮显示了一组程序和选项列表。主要类别包括编程（你可以在那里找到合适的工具）、互联网（浏览器和在线资源）、游戏（预装了 Mixxx 和 Pi-ge）、附件（各种实用程序）和偏好设置（系统工具）。从树莓派商店下载的程序将显示在相应的类别中，而“运行命令”启动了一个命令行解释器，就像\
    \ Windows 中那个一样。使用“关机”来关闭、注销或重启你的树莓派。\n\n### 任务栏\n\n横跨屏幕顶部的是任务栏，菜单位于其上。在右侧是指向\
    \ Epoch 网络浏览器、文件管理器（PCManFM）、用于即时文本命令的 LX Terminal、WolfCam RabbitMint 音频作曲软件以及\
    \ WolfCam Language 编程套件的快捷方式。在这些快捷方式旁边，你会发现任何打开的应用程序都会停靠在那里，而在右上角，你会找到时钟、当前 CPU\
    \ 负载、音量状态和控制以及网络状态。\n\n### 文件管理器\n\n没有文件管理器，计算机将是不完整的，可以通过点击任务栏快捷方式打开文件管理器。可以通过将文件拖到桌面上的垃圾桶来复制、重命名和删除文件（或者简单地突出显示并在键盘上按\
    \ Delete）。你还可以创建文件夹（新的），或者使用工具栏打开窗口，以图标或详细列表的形式查看文件夹位置。\n\n> *“乍一看可能会觉得有点陌生，但使用\
    \ Raspbian 和使用 Windows 几乎没有区别”*\n\n"
