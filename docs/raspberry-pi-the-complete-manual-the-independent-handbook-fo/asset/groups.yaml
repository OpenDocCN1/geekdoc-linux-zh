    ### 与 Scratch 互动


    使用 Scratch 与 Pi 上的按钮和灯光进行交互，体验物理计算


    **你需要准备...**


    - 面包板

    - LED

    - 按钮

    - 电阻器

    - 跳线

    - ScratchGPIO3


    Scratch 是一种非常简单直观的编程语言，通常用于向任何年龄的学习者教授基本编程概念。在这个项目中，我们将学习如何在 Scratch 中点亮按钮被按下时的
    LED，然后使用我们的 Raspberry Pi 上的通用输入/输出（GPIO）引脚，在按下物理按钮时改变角色的颜色。利用这些技术，你可以制作各种有趣且互动性强的项目，从音乐键盘到用于你的
    Scratch 游戏和动画的控制器。你需要一些组件来完成本指南。只需在线搜索 ''Raspberry Pi GPIO basic kit'' 即可开始。


    ![](img/f11b7dbb71886af07ef87126037ebe98_55_0.png)


    **安装所需的软件包**


    01 使用用户名 Pi 和密码 raspberry 登录 Raspberry 系统。使用命令 startx 启动 LXDE 桌面环境。接下来，打开 LXTerminal，然后输入以下命令：


    ```bash

    wget http://liamfraser.co.uk/lud/install_scratchgpio3.sh

    chmod +x install_scratchgpio3.sh

    sudo bash install_scratchgpio3.sh

    ```


    这将在你的桌面上创建一个名为 ScratchGPIO3 的特殊版本 Scratch。这是正常版本的 Scratch，带有一个处理 Scratch 和 GPIO
    之间通信的 Python 脚本。ScratchGPIO 由 simples (scimpley.wordpress.com) 创建。


    > “在本项目中，我们将学习如何使用 GPIO 引脚在 Scratch 中点亮按钮被按下时的 LED”


    ### 将面包板连接到你的 Pi


    02 关闭 Pi 的电源并拔掉电源线。准备好你的面包板、一个 LED、一个 330 欧姆电阻和两根 GPIO 电缆。你需要将 3.3V（右上角引脚，最靠近
    SD 卡的一端）连接到 330 欧姆电阻的一端，然后将 LED 的正极（较长的引脚是正极）连接到另一端。电阻器用于限制流向 LED 的电流。


    然后将 LED 的负极放入面包板的负极轨。将其中一个 GROUND（接地）引脚（例如，底部一排引脚从右数第三个）连接到负极轨。现在将正极连接到你的 Pi。LED
    应该会亮起。如果没有，那可能是你接反了，所以拔掉电源，交换引脚，然后再次尝试。


    ### 开关 LED


    03 目前，LED 连接到一个持续提供 3.3V 的引脚。如果我们希望能够打开和关闭它，这并没有太大用处，所以让我们将它连接到 GPIO 17，我们可以将其打开和关闭。GPIO
    17 是顶排引脚从右数第六个。重新给 Pi 供电。我们可以通过导出 GPIO 引脚，将其设置为输出引脚，然后将其值设置为 1 来点亮 LED。将值设置为 0
    会关闭 LED。


    ```bash

    echo 17 > /sys/class/gpio/export

    echo out > /sys/class/gpio/gpio17/direction

    echo 1 > /sys/class/gpio/gpio17/value

    echo 0 > /sys/class/gpio/gpio17/value

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_56_0.png)


    ### 从 Scratch 控制 LED


    04 启动 LXDE 桌面环境并打开 ScratchGPIO3。转到控制部分并创建一个简单脚本，当 Scratch 引脚 10（当精灵）被点击时。然后，添加一个
    GPIO 切换。LED 应该会亮起。然后添加脚本“等待 1 秒”，然后关闭 LED（GPIO 40），这样 LED 会亮一秒，然后 LED 关闭。


    ### 连接我们的按钮


    05 再次关闭 Pi 的电源。这个电路比我们之前创建的 LED 电路稍微复杂一些。我们需要做的第一件事是将 3.3V 连接到我们用来测试 LED 的右上角引脚。面包板的正极轨。然后我们需要将一个
    100kOhm 电阻器连接到正极轨和面包板上一个空轨道的另一端。然后在同一轨道上，添加一根导线，其一端连接到 GPIO 4。这是在 GPIO 17 右侧两个引脚的位置。然后，再次在同一轨道上，连接按钮的一个引脚。最后，通过添加一根连接到与接地相同的负极轨的导线，将按钮的另一个引脚连接到接地。


    当按钮未被按下时，GPIO 4 将接收 3.3V。然而，当按钮被按下时，通往接地的电路将闭合，GPIO 4 将接收 0V（并且值为 0），因为通往接地的路径上电阻小得多。


    我们可以通过观察 Pi 的值并按下按钮使其改变来看到这一实际效果。


    ```bash

    echo 4 > /sys/class/gpio/export

    echo in > /sys/class/gpio/gpio4/direction

    watch -n 0.5 cat /sys/class/gpio/gpio4/value

    ```


    ### 让灯光亮起来！


    06 启动 Pi 并打开 ScratchGPIO3。转到控制部分并添加“当绿色旗帜被点击”，然后附加一个永远循环，并在其中添加一个 if else 语句。


    从运算符部分添加一个 if [] > ([运算符部分，并添加一个 if []> 到感知部分，在等式左边添加一个值传感器，并将其设置为 4，在右边输入 0。广播引脚
    10（如果传感器值为 0，否则广播引脚 10 关闭。点击绿色旗帜。如果你按下按钮，LED 将亮起。


    '
