    ![](img/f11b7dbb71886af07ef87126037ebe98_20_2.png)\n\n# Using the terminal\n\n\
    **06** If you are using OS X or Linux, then you’ll have to use the terminal to\
    \ copy the image. In OS X, the Terminal app comes installed by default, and most\
