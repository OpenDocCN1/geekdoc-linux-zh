  - "[PAGE 94]\n\n# Build an iBeacon\n\n\n\n![](img/f11b7dbb71886af07ef87126037ebe98_94_0.png)\n\
    \nAbove Our iBeacon relies on Bluetooth technology, so you'll need a dongle.\n\
    \n# Set up your Pi with Bluetooth\n\n+   02  If you're lucky enough to own a Raspberry\
    \ Pi 3 then your device already has built-in Bluetooth 4.1, but if not then you've\
    \ probably got a Bluetooth dongle. Before connecting your dongle, however, ensure\
    \ that it is the correct type (see Bluetooth devices boxout on the right). Using\
    \ a standard USB Bluetooth dongle for this project will result in a lot of wasted\
    \ time and frustration.\n+   Once connected, open a terminal and enter `lsusb`\
    \ to confirm the device is connected and detected. A suitable Bluetooth Low-Energy\
    \ device will be listed as a Bluetooth 4.0 device.\n+   Once you've happy the\
    \ device is detected, create a new directory for BlueZ (the Linux Bluetooth stack),\
    \ switch to the new directory and download BlueZ.\n\n```\n```bash\nsudo mkdir\
    \ bluez\ncd bluez\nsudo wget www.kernel.org/pub/linux/bluetooth/\n  bluez-5.11.tar.xz\n\
    ```\n```\n\n# Build BlueZ\n\n+   03  Next, remove the BLE device and build BlueZ,\
    \ extracting the files and configuring the system.\n+   Note that the sudo make\
    \ command will take some time to complete, so don't worry if the Raspberry Pi\
    \ seems unresponsive. Just wait, and when done, input the final sudo make install,\
    \ and wait again.\n+   Once this is done, you'll need to switch off your Raspberry\
    \ Pi with the usual sudo shutdown –h now command. Wait for the power light to\
    \ go out, and then reconnect the Bluetooth Low-Energy USB dongle. Follow this\
    \ by reconnecting the power supply and then rebooting your Raspberry Pi.\n\n```\n\
    ```bash\nsudo unxz bluez-5.11.tar.xz\nsudo tar xvf bluez-5.11.tar\ncd bluez-5.11\n\
    sudo ./configure --disable-systemd\nsudo make\nsudo make install\n```\n```"
  - '[PAGE 95]


    # Projects


    # Build an iBeacon


    ![](img/f11b7dbb71886af07ef87126037ebe98_95_0.png)


    # Input a UUID


    +   05 The iBeacon is now ready. All you need to do is instruct it to advertise
    to other (correctly configured) devices. This simply means using the hcitool command
    to attach attention to the PiBeacon. Note how the universally unique identifier
    (UUID) below is broken into parts. Like any such identifier, certain portions
    of the string (everything after \"cmd\") are intended to communicate particular
    information. For instance, after FF, manufacturer-specific data is displayed,
    in this case 4C 00, which is Apple’s ID. The example UUID shown here can be used
    on your Pi, but note that it is intended for a particular app – specifically,
    the 99pi Beacon Toolkit app in the App Store.


    ```

    sudo hcitool -i hc10 cmd 0x00 0xd008 1E 02 01 1A 1A FF 4C 00 02

    15 E2 0A 39 F4 73 45 C4 A1 2F 17 D1 A3 07 A9 61 00 00 C8 00

    ```


    # Configure for Broadcast


    +   04 With the BLE connected and the Pi restarted, enter hiconfig in the command
    line to configure the Bluetooth module. It will usually be listed as being \"DOWN\".
    To resolve this, input the following code. As ever, stay aware of the commands
    you''re inputting. In this case, the final line ends with noscanc, which disables
    Bluetooth scanning. This is done to avoid issues with the module attempting to
    scan while simultaneously broadcasting.

    +   With these commands entered, enter hiconfig once more. This time, the device
    status will be \"UP RUNNING\".


    ```

    sudo hiconfig hc10 up

    sudo hiconfig hc10 lead 3

    sudo hiconfig hc10 noscanc

    ```


    # Resolve errors


    +   06 From time to time you may encounter errors with your PiBeacon, specifically
    when attempting to persuade the status to switch from \"DOWN\" to UP RUNNING.

    +   Restarting the Pi is no good here. Instead, you need to reset the device.
    First, enter hiconfig to check the device name. Usually, this is hc10

    +   Next, enter sudo hiconfig hc10 reset. This essentially clears everything out
    and lets you start again with: To check, input hiconfig again, where you should
    see that the status now reads: UP RUNNING.


    ```

    sudo hiconfig hc10 reset

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_95_1.png)


    # Test with an iOS device


    +   07 Before proceeding to use your PiBeacon for a particular project, you''ll
    need to make sure that it is broadcasting correctly. To do this, you''ll need
    an iPad or iPhone (or even an iPad Touch!) in order to detect the Scan Response
    Data – information (including the UUID) sent from the iBeacon to your smartphone
    when it comes into proximity.

    +   In addition, you''ll need an app. Something like Beacon Toolkit, mentioned
    above, should be sufficient. We''re really just looking at this stage to test
    the strength and ranges of a BLE device connected to your Raspberry Pi’s USB port,
    of course.'
