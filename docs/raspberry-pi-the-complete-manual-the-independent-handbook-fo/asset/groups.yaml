    \ so be careful how you use it...  \n\n# iBeacon scanning on Android\n\n09 Various\
    \ apps are available for Android users planning to communicate with their Raspberry\
    \ Pi iBeacons. These include Locate Beacon, Beacon Detector and Beacon Scanner.\
    \ As well as being compatible with the iBeacon, they also provide support for\
    \ Eddystone, the Android answer to iBeacon, and AltBeacon, an open specification\
    \ iBeacon alternative. Pictured at the lower-left of the opposite page is iBeacon\
    \ & Eddystone Scanner (aka Beacon Scanner), which will scan for a nearby beacon\
    \ following a simple button press. Once the iBeacon is found, the app displays\
    \ live info, and when this is tapped, a more detailed set of data.  \n\n![](img/f11b7dbb71886af07ef87126037ebe98_96_0.png)\n\
    \n# PiBeacon projects to consider\n\n10 iVarious projects for Raspberry Pi-powered\
    \ iBeacons can be developed, including systems that can assist with any smart\
    \ home builds you have planned. Among these include things like garage door automation,\
    \ switching on a device such as lamp, or simply tracking the whereabouts of your\
    \ Raspberry Pi. Note that the vast majority of projects will work with whatever\
    \ mobile device you are using, so overlook the platform-specific details of detection\
