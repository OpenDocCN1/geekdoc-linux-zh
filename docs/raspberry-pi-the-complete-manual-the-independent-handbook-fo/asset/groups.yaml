    \n## Make your Pi fast and reliable\n\n14. Make a note of the GUID and then switch\
    \ to the SD card. Reopen cmdline.txt and change root=/dev/mmbbl02 to root=PARTUUID=XXXXXXXX,\
    \ where the numerical string from the partition unique GUID should replace the\
    \ XXXXXX. When you’re done, save and exit. You can then start your Raspberry Pi.\
    \ Congratulations, your Raspberry Pi is now faster and more reliable to use!\n\
    \n## Boost performance with overclocking\n\n15. Need more from your Pi? It is\
    \ possible to overclock the computer, although you should be aware of the risks\
    \ inherent with this activity. You should also ensure that your Raspberry Pi’s\
    \ processor is suitably cooled - heatsinks for the CPU, Ethernet controller and\
    \ power regulator can be purchased online.\n\n## Overclock your Pi\n\n16. Overclocking\
    \ is available through raspi-config. Launch from the command line and move down\
    \ to the overclock option. Four driver options are available: Modest, Medium,\
    \ High and Turbo. With your ideal clock speed selected, exit raspi-config and\
    \ restart your Raspberry Pi to apply.\n\n```\nsudo shutdown -r now\n```\n\nNow\
    \ you will need to perform tests to see how stable it is overclocked. Raspberry\
    \ Pi founder, Eben Upton, suggests running Quake 3 as a good stress test. Should\
    \ the Pi fail to boot, hold Shift at boot without overclocking, run raspi-config\
    \ and select a more modest overclock.\n\n## Run Raspbian without the GUI\n\n17.\
    \ Despite these changes, you may find that the GUI performs slow. If you find\
    \ yourself running a lot of commands in bash, the best thing to do is disable\
    \ launch item X. In raspi-config, choose boot_behaviour and select the first (default)\
    \ option to ensure your Pi boots to the command line. Should you need the GUI,\
    \ enter 'startx' in Terminal.\n\n## Projects\n\n### Monitor your local network\
    \ with NagiosPi\n\n**What you’ll need:**\n- NagiosPi\n  - pinimagedb.com/project/nagiospi\n\
    - Win32 Disk Imager\n  - bit.ly/1aJ8Vg\n- Disk Utility\n  - bit.ly/1aCES\n- Internet\
    \ connection\n- 4 GB (or larger) SD card\n\n![Raspberry Pi setup](img/f11b7dbb71886af07ef87126037ebe98_65_0.png)\n\
    \n### Monitor your local network with NagiosPi\n\n> Embrace the power of Nagios\
    \ to keep an eye on servers, switches and applications on your network\n\nIs your\
    \ PC offline? Has your Linux box stopped serving Minecraft or Counter-Strike?\
    \ If you’re out of the house, or even the country, there is no real way of knowing\
    \ without trying to log in – something you probably won’t be able to do without\
    \ being on the premises (unless you’re using remote desktop software).\n\nA far\
    \ better way would be to simply receive notifications when your network devices\
    \ are knocked offline, and this is why we turn to NagiosPi, a Raspberry Pi-built\
    \ version of the popular open source network monitoring tool.\n\nNagiosPi is available\
    \ as a full image ready to be written to SD card, with the real configuration\
    \ taking place once it’s up and running. Let’s get started.\n\n![NagiosPi interface](img/f11b7dbb71886af07ef87126037ebe98_66_0.png)\n\
    \n### Download NagiosPi\n\n01. Windows users should write the extracted contents\
    \ of the NagiosPi_v2.0 zip file to a formatted SD card using Win32 Disk Imager.\
    \ Linux desktop users can use Disk Utility or the command line (bit.ly/2k565p8).\
    \ With the image written to SD, safely eject the card and insert it into your\
    \ Pi before booting.\n\n### Log in to NagiosPi\n\n02. As with most Pi projects,\
    \ you’ll probably want to operate via SSH, so check your router’s list of connected\
    \ devices to find the IP address and connect. You can also use a keyboard and\
    \ monitor connected to your Raspberry Pi. The default username and password for\
    \ NagiosPi is as follows: pi/raspberry.\n\n### Expand the filesystem\n\n03. Before\
    \ proceeding, run `sudo raspi-config`. You’ll need to select the first option,\
    \ Expand Filesystem, and wait a moment as the filesystem is expanded to the full\
    \ size of the SD card. Once done, select Change User Password to add some security\
    \ to your NagiosPi, then select Finish and reboot.\n\n### Open in your browser\n\
    \n04. With the Pi rebooted, the NagiosPi web console is open in your browser.\
    \ Visit http://raspberrypi.local [here] to see the available options. Here you’ll\
    \ spot a menu of links in the top-left corner, each accompanied by the username\
    \ and password to sign in. Start with RapControl.\n\n### Monitor your NagiosPi\
    \ box\n\n05. In the RapControl section you’ll get a flavour of just what Nagios\
    \ can do. On the home screen you’ll see general hardware information such as connectivity\
    \ and system status, and as you flick through Details, Services and Disks you’ll\
    \ see what level of monitoring is possible.\n\n### View host status\n\n06. Next,\
    \ go to Nagios and pick Hosts. Here you will see the current status for the configured\
    \ hosts, which is a combination of items detected on your local network and preset\
    \ entities. Look for ‘Current Network Status’ in the upper-left area of the console,\
    \ just below this you will find alternate views.\n\n### Add a host to monitor\n\
    \n07. Open NConf to add the server you wish to monitor, using the ‘Hosts – Add’\
    \ button to input the device hostname, IP address and alias. Click Submit when\
    \ done, then switch to ‘Services – Add’; where you can assign a name and check\
    \ command (such as check_ping) to monitor.\n\n### Create configuration file\n\n\
    08. Each check must be set up individually: some require the installation of NRIPE\
    \ (Nagios Remote Plugin Executor) on remote devices to interpret and present full\
    \ system details, but this isn’t necessary for basic things like ping. When you’re\
    \ done, click Submit, then Generate Nagios Config. Following this, select Deploy.\n\
    \n### Monitor your server\n\n09. In the NagiosPi window, select ‘Services’ for\
    \ a view of currently monitored servers and devices. For each listed device, there\
    \ will be additional information that you’ll dig into by clicking Actions. We’ve\
    \ only shown you the basics of NagiosPi – investigation will demonstrate just\
    \ how powerful it really is!\n\n## Projects\n\n### Tether to an Android device\n\
    \nNeed the internet on your Pi? Try out a physical tether to your Android device\
    \ for online access\n\nThe portability of the Raspberry Pi is one of its most\
    \ lauded features. Mini screens, mini wireless keyboard and mouse combos, portable\
    \ batteries and more can get you out and about, but the internet is a stumbling\
    \ block that you can't easily fix with an accessory. What you do also usually\
    \ have with you is an Internet-connected magic pocket box called a smartphone\
    \ that, with a bit of know-how, you can connect the Pi to and steal some internet\
    \ from. Over the next two pages we will impart this know-how to get you using\
    \ your Raspberry Pi on the Internet when you're on the go.\n\n**What you'll need...**\n\
    - Android device\n- USB cable\n\n![Android tethering setup](img/f11b7dbb71886af07ef87126037ebe98_67_0.png)\n\
    \n### The easy way\n\n01. Many smartphones have a Wi-Fi hotspot feature, which\
    \ your Pi can easily attach to. First of all, turn the hotspot on and then boot\
    \ into the Pi. Connect a wireless dongle and open up the wpas_gui in Preferences>Wi-Fi\
    \ Configuration.\n\n![wpas_gui interface](img/f11b7dbb71886af07ef87126037ebe98_67_1.png)\n\
    \n### Scan for device\n\n02. Click Scan to open up the scan window and then select\
    \ Scan again from inside there. It should pick up your device — connect it as\
    \ you would to any Wi-Fi network and the Pi will remember it for when it needs\
    \ it next.\n\n### Set up tether\n\n03. First connect your phone to your Raspberry\
    \ Pi via a USB cable — depending on the amount of power your Pi has, it might\
    \ have trouble charging your phone but it will still let you tether. In the tethering\
    \ menu you can now activate USB tethering.\n\n![USB tethering settings](img/f11b7dbb71886af07ef87126037ebe98_67_2.png)\n"
  mdcn: "\n\n## 分割 Raspbian 分区\n\n11. 理想情况下，boot（启动）分区应保留在 SD 卡上，而根文件系统则从外部硬盘或 USB\
    \ 闪存盘运行。使用你偏好的分区管理工具（大多数发行版都自带磁盘实用工具），卸载并删除 SD 卡上的根文件系统，确保保留 boot 分区。移除 SD 卡后，连接你的\
    \ USB 设备并删除 boot 分区，注意保持根文件系统完好无损。然后调整 USB 设备上根文件系统的大小，确保保留 10MB 的空间。\n\n## 识别根文件系统\n\
    \n12. 由于 SD 卡和外部 USB 存储设备都已连接，你需要告诉树莓派根文件系统的位置。在插有 SD 卡的桌面 Linux 计算机上，运行：\n\n\
    ```\nsudo nano /boot/cmdline.txt\n```\n\n找到 root=IDE/mbcmb102（或类似内容），将其更改为 root=/dev/sda2，即你的外部\
    \ USB 存储设备。保存并退出。\n\n## 添加其他 USB 设备\n\n13. 现在你可以连接存储设备并重启树莓派，但一旦连接更多的 USB 媒体，你将会遇到问题。通过安装\
    \ gdisk 来避免此问题：\n\n```\nsudo apt-get update\n```\n\n然后安装 gdisk：\n\n```\nsudo apt-get\
    \ install gdisk\n```\n\n接着运行 gdisk：\n\n```\nsudo gdisk /dev/sdb\n```\n\n按 ? 显示选项，然后选择“恢复和转换选项（仅限专家）”，接着选择“加载\
    \ MBR 并构建新的 GPT”。最后按一次 ?，选择“将表写入磁盘”并退出。移除并重新连接 USB 设备，再次运行 gdisk。这次输入 l，然后按 ?\
    \ 显示“分区唯一 GUID”。\n\n![gdisk 界面示意图](img/f11b7dbb71886af07ef87126037ebe98_64_0.png)\n\
    \n## 让你的树莓派既快速又可靠\n\n14. 记下该 GUID，然后切换到 SD 卡。重新打开 cmdline.txt，将 root=/dev/mmbbl02\
    \ 更改为 root=PARTUUID=XXXXXXXX，其中分区唯一 GUID 中的数字字符串应替换 XXXXXX。完成后，保存并退出。然后你可以启动你的树莓派。恭喜，你的树莓派现在运行更快且更可靠了！\n\
    \n## 通过超频提升性能\n\n15. 需要你的树莓派发挥更多性能吗？超频计算机是可能的，但你应该意识到这项操作固有的风险。你还应确保树莓派的处理器得到适当散热——可以在网上购买\
    \ CPU、以太网控制器和电源调节器的散热片。\n\n## 超频你的树莓派\n\n16. 可以通过 raspi-config 进行超频。从命令行启动，向下移动到超频选项。提供四个驱动器选项：Modest（保守）、Medium（中等）、High（高）和\
    \ Turbo（涡轮）。选择理想的时钟速度后，退出 raspi-config 并重启树莓派以应用更改。\n\n```\nsudo shutdown -r now\n\
    ```\n\n现在你需要进行测试，以查看超频后的稳定性如何。树莓派创始人 Eben Upton 建议运行 Quake 3 作为良好的压力测试。如果树莓派无法启动，请在启动时按住\
    \ Shift 键（未超频状态），运行 raspi-config 并选择更保守的超频选项。\n\n## 无 GUI 运行 Raspbian\n\n17. 尽管进行了这些更改，你可能会发现图形用户界面（GUI）运行缓慢。如果你发现自己在\
    \ bash 中运行大量命令，最好的做法是禁用启动项 X。在 raspi-config 中，选择 boot_behaviour 并选择第一个（默认）选项，以确保你的树莓派启动到命令行。如果需要\
    \ GUI，请在终端中输入 'startx'。\n\n## 项目\n\n### 使用 NagiosPi 监控你的本地网络\n\n**所需物品：**\n- NagiosPi\n\
    \  - pinimagedb.com/project/nagiospi\n- Win32 磁盘映像工具\n  - bit.ly/1aJ8Vg\n- 磁盘实用工具\n\
    \  - bit.ly/1aCES\n- 互联网连接\n- 4 GB（或更大）SD 卡\n\n![树莓派设置](img/f11b7dbb71886af07ef87126037ebe98_65_0.png)\n\
    \n### 使用 NagiosPi 监控你的本地网络\n\n> 拥抱 Nagios 的力量，密切关注你网络中的服务器、交换机和应用程序\n\n你的电脑掉线了吗？你的\
    \ Linux 盒子停止提供 Minecraft 或反恐精英服务了吗？如果你不在家，甚至不在国内，在不尝试登录的情况下很难得知状况——而且如果没有在场地内（除非你使用远程桌面软件），你通常无法做到这一点。\n\
    \n一个更好的方法是简单地接收通知，当你的网络设备离线时，这就是我们转向 NagiosPi 的原因，这是流行开源网络监控工具的树莓派版本。\n\nNagiosPi\
    \ 以完整镜像的形式提供，可直接写入 SD 卡，实际配置将在其启动并运行后进行。让我们开始吧。\n\n![NagiosPi 界面](img/f11b7dbb71886af07ef87126037ebe98_66_0.png)\n\
    \n### 下载 NagiosPi\n\n01. Windows 用户应使用 Win32 磁盘映像工具将解压后的 NagiosPi_v2.0 zip 文件内容写入已格式化的\
    \ SD 卡。Linux 桌面用户可以使用磁盘实用工具或命令行（bit.ly/2k565p8）。将镜像写入 SD 卡后，安全弹出卡片，将其插入树莓派并启动。\n\
    \n### 登录 NagiosPi\n\n02. 与大多数树莓派项目一样，你可能希望通过 SSH 操作，因此请检查路由器中连接设备列表以找到 IP 地址并连接。你也可以使用连接在树莓派上的键盘和显示器。NagiosPi\
    \ 的默认用户名和密码如下：pi/raspberry。\n\n### 扩展文件系统\n\n03. 在继续之前，运行 `sudo raspi-config`。你需要选择第一个选项，扩展文件系统，并稍等片刻，让文件系统扩展到\
    \ SD 卡的全尺寸。完成后，选择更改用户密码以增加 NagiosPi 的安全性，然后选择完成并重启。\n\n### 在浏览器中打开\n\n04. 树莓派重启后，NagiosPi\
    \ 网页控制台在你的浏览器中打开。访问 http://raspberrypi.local [这里] 查看可用选项。你会看到左上角有一个链接菜单，每个链接都附带用于登录的用户名和密码。从\
    \ RapControl 开始。\n\n### 监控你的 NagiosPi 盒子\n\n05. 在 RapControl 部分，你将领略 Nagios 的强大功能。在主屏幕上，你会看到一般的硬件信息，如连接性和系统状态，当你浏览\
    \ Details（详情）、Services（服务）和 Disks（磁盘）时，你会看到可能的监控级别。\n\n### 查看主机状态\n\n06. 接下来，转到\
    \ Nagios 并选择 Hosts（主机）。在这里，你将看到配置主机的当前状态，这是本地网络上检测到的项和预设实体的组合。在控制台的左上区域查找“当前网络状态”，其下方你会发现替代视图。\n\
    \n### 添加要监控的主机\n\n07. 打开 NConf 以添加你要监控的服务器，使用“Hosts – Add（主机 – 添加）”按钮输入设备主机名、IP\
    \ 地址和别名。完成后点击提交，然后切换到“Services – Add（服务 – 添加）”；在那里你可以分配名称并检查命令（如 check_ping）进行监控。\n\
    \n### 创建配置文件\n\n08. 每个检查都必须单独设置：一些需要在远程设备上安装 NRIPE（Nagios Remote Plugin Executor）以解释和呈现完整的系统详细信息，但对于像\
    \ ping 这样基本的事情则不需要。完成后，点击提交，然后生成 Nagios 配置。之后，选择部署。\n\n### 监控你的服务器\n\n09. 在 NagiosPi\
    \ 窗口中，选择“Services（服务）”以查看当前监控的服务器和设备。对于列出的每个设备，都会有额外的信息，你可以通过点击操作来深入了解。我们只向你展示了\
    \ NagiosPi 的基础——深入调查将证明它究竟是多么强大！\n\n## 项目\n\n### 连接到 Android 设备\n\n需要树莓派上网吗？尝试使用物理连接将\
    \ Android 设备用作热点以获得互联网访问\n\n树莓派的便携性是其最受赞誉的特性之一。迷你屏幕、迷你无线键鼠组合、便携式电池等可以让你外出，但互联网是一个你无法轻易通过配件解决的障碍。你随身携带的还有一个称为智能手机的、连接互联网的“神奇口袋盒子”，如果你掌握了一些技巧，就可以将树莓派连接到它并“偷”一些互联网。在接下来的两页中，我们将传授这些技巧，让你可以在外出时使用树莓派上网。\n\
    \n**所需物品...**\n- Android 设备\n- USB 数据线\n\n![Android 网络共享设置](img/f11b7dbb71886af07ef87126037ebe98_67_0.png)\n\
    \n### 简单的方法\n\n01. 许多智能手机都有 Wi-Fi 热点功能，你的树莓派可以轻松连接。首先，打开热点，然后启动树莓派。连接无线网卡并打开偏好设置中的\
    \ Wi-Fi 配置中的 wpas_gui。\n\n![wpas_gui 界面](img/f11b7dbb71886af07ef87126037ebe98_67_1.png)\n\
    \n### 扫描设备\n\n02. 点击扫描以打开扫描窗口，然后从内部再次选择扫描。它应该会检测到你的设备——就像连接任何其他 Wi-Fi 网络一样连接它，树莓派会在下次需要时记住它。\n\
    \n### 设置网络共享\n\n03. 首先通过 USB 数据线将手机连接到树莓派——取决于树莓派的电力，它可能在给你的手机充电时遇到困难，但仍然允许你进行网络共享。在网络共享菜单中，你现在可以激活\
    \ USB 网络共享。\n\n![USB 网络共享设置](img/f11b7dbb71886af07ef87126037ebe98_67_2.png)\n\n"
