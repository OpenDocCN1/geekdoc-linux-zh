  - '[PAGE 9]


    # # Raspberry Pi Model A+


    Good things come in small packages: find out why the Raspberry Pi A+ is ideal
    for mobile projects.


    While the Raspberry Pi Model B+ is a step up from the Model B with its four USB
    ports, the Model A+ is smaller than its predecessor, weighing just 23g (down from
    45g) and wielding one USB port. It’s also limited to just 256MB of RAM on the
    SoC, compared to the 512MB enjoyed on the B+.  But don’t think that all of this
    means that the A+ is inferior. Its 65mm length and lower weight


    is a clue as to how it can be used. The lack of an Ethernet port meanwhile, isn’t
    a weakness, rather an illustration of the fact that this Raspberry Pi is designed
    for media centres and print servers, but for projects where weight is a factor.
    Perhaps you’ll mount it on an Arduino-powered robot, where its lower power requirement
    can be satisfied with a battery.


    +   * **MicroSD Storage**

    +   No more worries about the SD card being snapped off or lost. The Raspberry
    Pi A+ features a push-push slot for a microSD card

    +   * **Connectable and flexible**

    +   Both new Raspberry Pi models have had the GPIO header increased from 26 pins
    to 40, increasing the device’s flexibility

    +   * **256 MB RAM Squeezed on board!**

    +   It seems amazing, but on top of all of this, there is a System on Chip 700
    MHz processor with 256 MB of RAM mounted on the centre of this versatile little
    computer.


    ![](img/f11b7dbb71886af07ef87126037ebe98_9_0.png)


    +   * **It’s smaller!**

    +   The original Raspberry Pi Model B was a circuit board sized 85mm in length.
    The A+ measures in at just 65mm long

    +   * **Repositioned power socket**

    +   With the micro USB power socket now beside the HDMI socket, it’s easier to
    arrange and manage cables

    +   * **It’s lighter too!**

    +   Unbelievably, the Raspberry Pi Model A is just 23g (0.81 oz), a reduction
    in weight of almost 50 per cent'
  - '[PAGE 10]


    # Raspberry Pi Zero


    The tiny £4 computer has taken the world by storm, but what''s changed?


    Coming in at a size smaller than a credit card, the Pi Zero is certainly impressive
    to behold. However, its size does not mean a scale back in performance. The Zero''s
    1GHz, Single-core CPU and 512MB RAM has this board running 40% faster than the
    original Pi.


    To achieve such a small form factor and low production costs, the creators stripped
    back a lot of ports we have come to expect. With only space saving micro and mini
    ports remaining


    and no Ethernet in sight, adapters of various kinds will play a vital role in
    more demanding projects. By ensuring every component is justified in its existence,
    the Pi Zero is incredibly versatile. Its capability to run full images such as,
    Rasbian, means jumping into a project is as simple as ever.


    The minimalism of the Zero lends itself perfectly to running in a headless setup,
    add a Wi-Fi dongle and you can SSH in to control it, making the most of that single
    USB port.


    ![](img/f11b7dbb71886af07ef87126037ebe98_10_0.png)


    **New mini HDMI port**


    You will need an adapter to make use of this port. Or better still, go headless
    and install yourself a little OS image


    **MicroSD card**


    This is the same as the newer B model, meaning you can swap in an existing card
    to be up and running in seconds


    **Unpopulated GPIO header**


    With an identical pinout to Model A+/ B+/2B/3, headers can optionally be soldered
    on yourself, making the Zero HAT compatible


    **Micro USB port**


    The shortage of ports means a USB hub and an adapter will become important, than
    ever to connect things such as a keyboard or Wi-Fi adapter


    **Minimal connectors**


    No Ethernet or audio port and no camera or display connectors! However unpopulated
    composite video and reset headers are still available


    **Smaller than a credit card**


    Measuring in at a 65mm x 30mm x 5mm the Zero comes in at a tenth the model B''s
    overall footprint'
  - "[PAGE 11]\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_0.png)\n\n# The starter\
    \ kit\n\n# The starter kit\n\n*There's more to your Pi than first meets the eye.*\
    \  \nHere are some vital peripherals to get you started\n\nIn order to get the\
    \ very best experience from your Raspberry Pi, you're going to have to get hold\
    \ of a few extras on top of the actual Raspberry Pi board itself. For example,\
    \ you're going to need a keyboard and mouse with which to enter commands and navigate.\
    \ While it's possible to do projects without a keyboard and mouse attached, you'll\
    \ need them for the initial setup. An SD card is also an important purchase --\
    \ it's where the operating system lives.\n\nPerhaps you'll need a Wi-Fi adapter,\
    \ or maybe just a length of network cable. Then there's the basic electronics\
    \ side of the Raspberry Pi, what would you need to start some of the beginner\
    \ electronics and control experiments? Clearly, there's more to the Raspberry\
    \ Pi than some might think.\n\nBy 'peripherals,' we mean other hardware that can\
    \ be attached and utilised by the Raspberry Pi. They could be something as simple\
    \ as a decent HDMI or they could be the latest, greatest bespoke gadgets that\
    \ enhance your project capabilities.\n\nThere is an entire world of possibilities\
    \ available for the Raspberry Pi from robot arms to remote-controlled helicopters…\
    \ The only limits are the hardware available and your imagination!\n\n# Did you\
    \ know…\n\nMost online retailers sell packages complete with all the accessories\
    \ you might need - even a pre-installed SD card.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_1.png)\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_11_2.png)\n\n# Keyboard and mouse\n\
    \nLet's start with the most basic of components, the keyboard and mouse. Generally\
    \ speaking, virtually any USB keyboard and three-button scroll mouse will work\
    \ with the Raspberry Pi, and although for some projects you won't even need a\
    \ keyboard and mouse, you'll need them for initial setup.\n\n# SD card\n\nEarly\
    \ Raspberry Pi computers required an SD card, whereas later models such as the\
    \ Raspberry Pi 2 and a 3 use micro/SD cards for storage. This is where you chosen\
    \ operating system (such as Raspbian) is installed, and these can be bought in\
    \ various sizes, pre-installed with the OS, or blank."
  - '[PAGE 12]


    # The starter kit


    # Getting started


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_0.png)


    # Power cable


    The Raspberry Pi uses a standard micro USB connector for its power input, running
    at 5V. In most cases a micro USB to USB cable will suffice, of which one end can
    be plugged into your desktop computer''s USB port. An Android phone charger should
    also work perfectly (5.25V 1500mA).


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_1.png)


    # Case


    Securing your Raspberry Pi in a case will protect it and prevent the delicate
    GPIO pins from accidental damage. A case can also make your Raspberry Pi a more
    attractive or striking unit, perhaps as a media centre. Ensure you choose the
    right case for your Raspberry Pi model.


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_2.png)


    # Video output


    There are two video output ports, a HDMI port and an RCA Socket. HDMI is the primary
    video-output connector for most users, but the RCA video-out port can also be
    used to connect TV, monitors or to a SCART cable. Remote access to your Raspberry
    Pi is also possible via SSH or VNC.


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_3.png)


    # Powered USB hub


    Extra USB ports are worth considering as an early purchase with your Pi. Once
    you''ve connected a keyboard and mouse you''ll realise why! Using a powered USB
    hub is important, to stop any power being drained from the Pi, and allow you to
    attach the likes of an external hard drive, for example.


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_4.png)


    # Raspberry Pi Camera board


    This is a custom designed add-on board that attaches to one of the Raspberry Pi''s
    on-board sockets via a flexible cable. It''s extremely small, but remarkably powerful,
    having a native resolution of five megapixels and supporting 1080p video. It''s
    essentially a smartphone camera for the Pi!


    ![](img/f11b7dbb71886af07ef87126037ebe98_12_5.png)


    # USB Wi-Fi adaptor


    Using a USB Wi-Fi adaptor will bring flexibility to where you position your Raspberry
    Pi. Without a restrictive Ethernet cable, it could be used for more advanced projects
    where running a wired internet connection isn''t a valid option. Just make sure
    you buy a Raspberry Pi-friendly Wi-Fi adaptor.'
