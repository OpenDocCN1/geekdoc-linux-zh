    \n我们在 JS 标签页中使用 jQuery 调用当前时间，以便最终能在网页上显示出来。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_86_2.png)\n\
    \n我们将以 12 小时制时钟的形式显示时间，并使用 AM 和 PM 来区分时间。如果分钟数小于 10，我们就添加一个 0 以提高可读性，然后拼接所有变量并赋值给\
    \ h2 标签。\n\n### HTML\n\n```html\n<h1>Welcome to the internet...</h1>\n<h2></h2>\n\
    <p><a href=\"http://www.linuxuser.co.uk\">Linux User & Developer</a></p>\n<p><a\
    \ href=\"http://www.reddit.com\">Reddit</a></p>\n<p><a href=\"http://www.linuxfoundation.org\"\
    >The Linux Foundation</a></p>\n<p><a href=\"http://www.fsf.org/\">Free Software\
    \ Foundation</a></p>\n```\n\n### JavaScript\n\n```javascript\nvar d = new Date();\n\
    var hours = d.getHours();\nvar mins = d.getMinutes();\n\nif (hours > 12) {\n \
    \   var hour = (hours - 12);\n    var ampm = \"PM\";\n} else {\n    var hour =\
    \ hours;\n    var ampm = \"AM\";\n}\n\nif (hours == 12) {\n    var ampm = \"PM\"\
    ;\n}\n\nif (mins < 10) {\n    var min = \"0\" + mins;\n} else {\n    var min =\
    \ mins;\n}\n\nvar time = \"The time is \" + hour + \":\" + min + \" \" + ampm;\n\
    $(\"h2\").html(time);\n```\n\n> “Coder 是一个基于 Raspbian 的镜像，可将你的树莓派变为 Web 服务器和 Web\
    \ 开发工具包。这是进一步提升技能的一种简单且很棒的方式。”\n\n## 用树莓派零构建网络化 Hi-Fi 系统\n\n将 Pimoroni pHAT DAC\
    \ 与树莓派零组合，即可创建一个网络化 Hi-Fi 系统。充分利用英国在线电台、Linux 流行的 Music Player Daemon (MPD) 音乐播放守护进程，并利用响应式\
    \ Web 服务器来控制这一切。全尺寸的树莓派有两种内置音频输出：通过 HDMI 线传输的音频和一个 3.5mm 耳机插孔（后者容易受到干扰和噪音影响）。树莓派零本身没有音频插孔，但\
    \ Pimoroni 及时赶到救援，使用与 Hi-Fi Berry 相同的芯片（PCM5102A）构建了一个高质量的 DAC（数模转换器）。\n\n###\
    \ 你需要准备...\n\n-   Github 仓库：http://github.com/alexellis/pyPlaylist\n-   Pimoroni\
    \ pHAT DAC\n-   电烙铁、助焊剂及焊锡\n\n**你知道吗...**\n\n我们使用 Python Flask 框架编写了 pyPlaylist，它是构建简单\
    \ RESTful 网站的理想起点。前端代码通过利用 jQuery 更新歌曲或电台信息，避免屏幕完全重新加载。Bootstrap 的引入使页面具有响应式（兼容你的\
    \ PC、手机和平板电脑）。代码以 GPL 许可证发布，何不 fork 该代码并根据你的需求进行调整呢？\n\n![](img/f11b7dbb71886af07ef87126037ebe98_87_0.png)\n\
    \n## 焊接排针\n\n01 pHAT DAC 附带一个 40 针的排针，你需要将其焊接好。我们认为，助焊剂笔、吸锡线、灯以及 60/40 比例的焊锡线对于此步骤是至关重要的。你还可以选购一个可选的\
    \ RCA 插孔，以为较旧的立体声设备提供唱头线输出。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_88_0.png)\n\
    \n## 安装驱动\n\n02 DAC 依赖于 I2C，因此我们需要加载一些额外的内核模块。如果你正在运行 Raspbian，可以通过以下命令通过安全 HTTP\
    \ 进行单脚本安装：\n\n```bash\ncurl -sS https://get.pimoroni.com/phatdac | bash\n```\n\
    \n虽然 HTTPS 提供了安全的下载，但好奇的人可能在运行脚本前希望审阅一下脚本内容。\n\n## 安装 Music Player Daemon (MPD)\n\
    \n03 现在继续安装 MPD 包并启用其在启动时自动运行。MPD 将是项目的骨干，提供 MP3 和互联网电台的播放功能。同时也安装了 MPC（客户端）软件，用于调试和设置初始播放列表。\n\
    \n```bash\nsudo apt-get install mpd mpc\nsudo systemctl enable mpd\n```\n\n##\
    \ 克隆并安装 pyPlaylist Web 服务器\n\n04 pyPlaylist 是一个响应式（支持移动设备）的 Web 服务器，使用 Python\
    \ 和 Flask Web 框架编写。配置完成后，它将提供一种通过 Web 浏览器控制我们 Hi-Fi 系统的方式。以下命令将在 Raspbian 上安装\
    \ pyPlaylist：\n\n```bash\nsudo pip install flask python-mpd2\ncd ~\ngit clone\
    \ https://github.com/alexellis/pyPlaylist\ncd pyPlaylist\n./raspbian_install.sh\n\
    ```\n\n> “你也可以选购一个可选的 RCA 插孔，以为较旧的立体声设备提供唱头线输出。”\n\n## 配置自动启动\n\n在 Raspbian 中，有争议的\
    \ system32 软件被添加进来，提供了一种高度模块化的方式来管理其他脚本等。虽然 systemd 配置文件现在被视为最佳实践，但完全理解它们可能需要一些时间。出于实际原因，我们建议使用\
    \ cron 在重启时启动脚本作为临时措施。\n\n```bash\ncrontab -e\n\n@reboot /usr/bin/python /home/pi/pyPlaylist/app.py\n\
    ```\n\n## 检查电台列表\n\n1.  每个电台都添加到了其自己的播放列表中 - mpc 命令可显示可用的播放列表，如下所示：\n\n```bash\n\
    $ mpc ls\n\nBBC6Music\nBBCRadio1\nBBCRadio2\nBBCRadio4\nCapitalXtra\nKissFM\n\
    ```\n\n如果你想删除其中一个电台，请输入以下命令：\n\n```bash\n$ mpc rm BBCMusic\n```\n\n## 选择电台\n\n\
    1.  我们整理了一份英国流行电台列表，可以通过 add_stations.sh 文件将其添加到 MPD 中。你可以编辑此文件，并从 http://radiofeeds.co.uk\
    \ 找到你喜欢的电台。\n\n```bash\ncd ~/pyPlaylist\n./add_stations.sh\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_89_1.png)\n\
    \n## 启动 Web 服务器\n\n07 现在我们有了电台，可以从 pyPlaylist 目录运行 Web 服务器。然后打开 Web 浏览器开始播放电台。以下命令可显示你在\
    \ Raspbian 上的 IP 地址。\n\n```bash\n$ ./raspbian_get_ip.sh\n192.168.0.20\n```\n\n\
    知道 IP 地址后，在 Web 浏览器中连接端口 5000 上的 URL，即 http://192.168.0.20:5000/\n\n## 添加自定义音乐播放列表\n\
    \n08 现在在 /var/lib/mpd/music/ 下创建一个包含你音乐文件的子目录，并确保 mpd 具有读取它的 root 权限。然后我们更新 mpd\
    \ 的数据库，清空当前播放列表，并添加新目录（ambient）中的所有曲目，最后将其保存为一个新的播放列表。\n\n```bash\nmpc update\n\
    mpc clear\nmpc ls ambient | mpc add\nmpc save ambient\n```\n\n## 收尾工作\n\n09 现在你的音乐播放器已经正常运行，剩下的显然就是添加一些扬声器了。几乎任何带有\
    \ RCA 或 3.5mm 输入源的设备都可以用于此目的。这部分就留给你自己决定了。要查看这里的完整代码，请访问 http://bit.ly/290maIH。尽情享用音乐吧！\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_90_0.png)\n\n> “现在我们有了电台，可以从 pyPlaylist\
    \ 目录运行 Web 服务器。然后打开 Web 浏览器开始播放电台。”\n\n## 延时摄影触发器\n\n### 你需要准备...\n\n借助我们的专家建议，让你用单反相机拍摄延时摄影视频变得轻而易举。\n\
    \n-   最新的 Raspbian 镜像：www.raspberrypi.org/downloads\n-   面包板\n-   连接器\n-   跳线\n\
    -   单反相机\n-   兼容的快门线\n\n你可能会以为，像 Vincent Laforet (www.laforetvisuals.com) 或 John\
    \ Eklund (www.theartoftimelapse.com) 那样制作令人着迷的延时摄影视频是普通人难以企及的。不过，在树莓派和少量 Python\
    \ 代码的帮助下，情况已不再如此。在本指南中，我们将触发单反相机以创建像素完美的延时摄影图像...\n\n### 设置树莓派\n\n01 在本教程中，我们假设你使用的是最新版本的\
    \ Raspbian。在设置好树莓派（连接键盘、鼠标和显示器）后，打开终端并输入：\n\n```bash\nsudo apt-get update\n```\n\
    \n### 安装 RPi.GPIO 库\n\n02 接下来，我们需要确保开发环境已设置好。请按照以下步骤操作以确保一切就绪。在终端中输入：\n\n```bash\n\
    sudo apt-get install python-dev\nsudo apt-get install python-rpi-gpio\n```\n\n\
    ### 设置 Pi Cobbler\n\n03 在本教程中，我们使用了一个廉价的实验面包板和一个 Adafruit Pi Cobbler，以便轻松访问树莓派的\
    \ GPIO 引脚。正如图片所示，Cobbler 跨越面包板的中心点，并通过一条扁平电缆将两者连接起来。\n\n### 完整代码列表\n\n```python\n\
    import RPi.GPIO as GPIO\nimport time\n\nprint 'Welcome to the Complete Manual\
    \ Time-Lapse Tool.'\nprint \"Just tell us how many shots you'd like to take and\
    \ the interval between them.\\n\"\nprint \"Try googling 'time-lapse interval calc'\
    \ if you need help deciding.\\n\"\n\ndef main():\n    shots = raw_input(\"How\
    \ many shots would you like to take?\\n -> \")\n    interval = raw_input(\"How\
    \ frequently do you want to take them (in seconds)?\\n -> \")\n\n    if shots.isdigit()\
    \ and interval.isdigit():\n        shots = int(shots)\n        interval = int(interval)\n\
    \n        print \"You'll be shooting for %d minutes.\\n\" % (shots * interval\
    \ / 60)\n        answer = raw_input(\"Are you ready to proceed?(yes/ no) -> \"\
    )\n\n        confirm = answer.lower() in [\"yes\", 'y']\n        if confirm:\n\
    \            GPIO.setmode(GPIO.BOARD)\n            GPIO.setup(16, GPIO.OUT)\n\
    \            taken = 1\n            print\n            print 'Starting a run of\
    \ %d shots' % (shots)\n```\n"
