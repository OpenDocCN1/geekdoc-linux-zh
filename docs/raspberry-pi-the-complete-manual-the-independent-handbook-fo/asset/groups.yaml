  mdcn: "\n## Nano 初学者指南\n\n### 打开 nano\n\n**01** 打开终端，或进入*命令行*，只需输入 nano。这将打开一个空白新文件。从这里你可以创建一个简单的文本文件，例如列表，或者创建一个系统文件、脚本或一段代码。系统如何解释你的文件取决于你写什么以及如何保存。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_42_0.png)\n\n### 保存并继续\n\n**02** 当你完成\
    \ nano 操作后，可以使用 Ctrl+O 进行保存/写入。像这样的所有快捷键和功能都是使用 Ctrl 键加上后续字母来实现的。它会询问你以什么名称保存文件。无论你给它起什么名字，除非你指定路径，否则它都会保存在你打开\
    \ nano 的那个目录中。\n\n### 打开文件\n\n**03** 要编辑已存在的文件，你首先需要知道它们的位置和名称。要在 nano 中打开它们，请键入以下内容：\n\
    $ nano /path/FileName\n例如，要编辑 fstab，你需要键入：\n$ nano /etc/fstab\n\n### 保存并退出\n\n\
    **04** 当你完成文件修改，需要继续下一个任务时，你可以按 Ctrl+X 退出 nano。它会询问你是否想保存所做的修改，只需按 Y 确认即可。如果你想*不*保存更改就退出，只需使用\
    \ N。如果在做出决定之前想要取消，请使用 Ctrl+C。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_42_1.png)\n\
    \n### 复制和粘贴\n\n**05** 这更多是一个特定于终端的命令，但它同样可以在 nano 中使用。虽然你不能使用鼠标在 nano 中的文件中导航，但你可以像在图形文本编辑器中一样高亮显示文本。高亮显示后，按\
    \ Ctrl+Shift+C 将复制任何文本。Ctrl+Shift+V 将粘贴。\n\n### 从文件插入\n\n**06** 如果你需要直接插入另一个文件的内容，有一种快速方法可以这样做，而不需要使用复制和粘贴。键入\
    \ Ctrl+R 并输入文件路径，就会将内容插入到光标所在的位置。\n\n### 高级导航\n\n**07** 你很可能一直在使用方向键一次移动一个空格，向左、右、上或下移动。不过，还有其他方法可以在文件中移动。使用\
    \ Ctrl+左键与图形编辑器中的 Home 键功能相同，将光标移动到行首。同样，Ctrl+E 相当于 End 键，将光标移动到行尾，Ctrl+V 是向下翻页，Ctrl+Y\
    \ 是向上翻页。\n\n### 在文件中搜索\n\n**08** 有时你会想在大型文本文件中寻找特定的行或短语。与其使用方向键并不知疲倦地阅读每一行，你可以使用\
    \ nano 搜索功能，按 Ctrl+W。输入搜索词将开始在文档中查找，一旦完成，你可以按 Ctrl+C 退出搜索。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_42_2.png)\n\
    \n### 额外帮助\n\n**09** nano 中还有许多其他功能。要查看命令列表，可以使用 Ctrl+?，它会列出所有快捷键及其功能。此列表中的*星号*（\\\
    *）表示在键盘上使用 Ctrl。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_42_3.png)\n\n## 项目\n\
    \n### 你需要的东西……\n\n**TightVNC**\nwww.tightvnc.com/release-2.7.php\n\n1. **获得远程桌面访问权限**\n\
    \   学习如何在没有直接面对你的情况下访问你的树莓派桌面……\n\nVNC（虚拟网络计算）是一种图形桌面访问和共享系统，允许用户远程控制和操作另一台计算机的桌面。\n\
    \n它在许多方面都非常方便：让你控制远程系统；帮助其他地方的用户；允许计算机保持通电，但无需键盘、鼠标甚至显示器。\n\n在我们的案例中，我们旨在允许访问树莓派桌面，而无需连接上述周边设备。这样，你可以做通常做的所有事情，但只需连接电源和网络，从而腾出空间并节省额外费用。在实际应用中，这意味着你甚至可以通过\
    \ Android 平板电脑或手机访问树莓派桌面！\n\n1. **你知道吗……**\n   TightVNC 服务器是一个免费资源，用于访问 VNC 服务器，例如我们在本教程中将要安装的那个。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_43_0.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_43_1.png)\n\
    \n### 静态 IP 地址\n\n1. **01** 我们的第一步是确保树莓派有一个静态 IP 地址。基本上，IP 地址是你网络分配给设备的一组数字，用于区分它们。要设置静态\
    \ IP 地址，只需双击 LXTerminal，键入以下内容，然后按 Enter。\n   ```bash\n   sudo nano /etc/network/interfaces\n\
    \   ```\n\n### 静态 IP 第二部分\n\n2. **02** 此文件控制树莓派的 IP 寻址。你需要向下滚动到 'iface eth0' 行，删除\
    \ 'DHCP' 并替换为 static。现在，在紧接着的下一行，输入你希望树莓派拥有的 IP 地址，连同子网掩码和网关。\n   ```text\n  \
    \ address  255.255.255.0\n   gateway  192.168.1.254\n   ```\n\n### 静态 IP 第三部分\n\
