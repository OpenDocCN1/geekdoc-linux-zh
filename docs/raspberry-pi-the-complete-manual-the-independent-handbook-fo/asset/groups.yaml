    a list, or create a system file, script or piece of code. How the system interprets
    your file depends on what you write and how you save it.


    ![](img/f11b7dbb71886af07ef87126037ebe98_42_0.png)


    # ## Save and continue


    **02** Once you''ve finished with nano, you can save/write out using Ctrl+O. All
    shortcuts and functions such as this are done using Ctrl and a later letter. It
    will ask you what name to save the file under. Whatever you name it, it will be
    saved in the directory you opened nano from unless you specify a path.


    # ## Opening files


    **03** To edit already existing files, you''ll first need to know their location
    and name. To open them in nano, type the following:

    $ nano /path/FileName

    For example, to edit fstab you would type:

    $ nano /etc/fstab


    # ## Save and exit


    **04** Once you''ve finished modifying the file and need to get on with the next
    task, you can press Ctrl+X to exit nano. It will ask if you want to save any modifications,
    which just requires a Y to confirm. If you want to exit *without* saving changes,
    you can just use N. To cancel before making a decision, use Ctrl+C.


    ![](img/f11b7dbb71886af07ef87126037ebe98_42_1.png)


    # ## Copy and paste


    **05** This is more of a terminal-specific command, but it can be used just as
    well in nano. While you cannot use your mouse to navigate around the file in nano,
    you can highlight text in the same way you would in a graphical text editor. Once
    highlighted, pressing Ctrl+Shift+C will copy any text. Ctrl+Shift+V will paste.


    # ## Insert from file


    **06** If you need to directly insert the contents of another file, there''s a
    quick way to do it without needing to use copy and paste. Typing Ctrl+R and entering
    the path to the file will insert it into the spot your cursor is at.


    # ## Advanced navigation


    **07** You''ve probably been using the arrow keys to move one space at a time
    left, right, up or down. There are other ways to move around the file, though.
    Using Ctrl+left does the same as the Home key does in a graphical editor, moving
    the cursor to the start of the line. Same with Ctrl+e moving you to the end line
    the End key, Ctrl+V is page down, and Ctrl+Y is page up.


    # ## Searching a file


    **08** Sometimes you''ll be looking for a specific line or phrase in a large text
    file. Instead of using the arrow keys and tirelessly reading every line, you can
    use the nano search term with Ctrl+W. Entering the search term will begin looking
    through the document, and once you''ve finished you can press Ctrl+C to exit the
    search.


    ![](img/f11b7dbb71886af07ef87126037ebe98_42_2.png)


    # ## Extra help


    **09** There are many more functions available in nano. For a list of commands,
    you can use Ctrl+?, which lists all the shortcuts and what they do. The *asterisk*
    (*) in this list denotes the use of Ctrl on your keyboard.


    ![](img/f11b7dbb71886af07ef87126037ebe98_42_3.png)'
  - "[PAGE 43]\n\n# Projects\n\n# What you'll need...\n\n**TightVNC**\nwww.tightvnc.com/release-2.7.php\n\
    \n1. **Gain remote desktop access**\n   Learn how to get access to your Raspberry\
