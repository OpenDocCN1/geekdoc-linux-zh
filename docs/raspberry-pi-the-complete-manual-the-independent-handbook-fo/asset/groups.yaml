    ## Projects


    ### Make a Pi-powered digital picture frame


    #### What you''ll need...


    - Raspberry Pi 2 or 3 with Raspbian Jessie

    - Wi-Fi dongle (if using Raspberry Pi 2)

    - Display (official 7-inch touchscreen display recommended)

    - Phillips screwdriver

    - Frame and/or stand (available options for the official touchscreen display are
    available at Pimoroni and other dedicated Pi hardware and accessory supplier)

    - Scripts https://github.com/samuelk/Raspberry-Pi-Photo-Frame


    Use a Raspberry Pi to create your own fully configurable digital picture frame,
    complete with touchscreen display.


    Digital picture frames that display a selection of your favourite photos were
    quite popular for a time, but are now seemingly available only as free gifts when
    signing up to magazine subscriptions. These tablet-like devices often made for
    interesting talking points, but were often let down by low memory, a poor user
    interface, or both.


    ![](img/f11b7dbb71886af07ef87126037ebe98_105_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_106_0.png)


    We don''t have to worry about either of those problems with this project. Here
    we are going to set up a Raspberry Pi with some photo-displaying software, connect
    a touchscreen display, place it in a suitable stand, and sit back to enjoy the
    results. Better still, with this set-up, we''ll be able to pull images from a
    range of online and offline sources, giving us some great variety.


    ### Prepare your Pi


    01 You''ll save a lot of time with this project if you ensure that wireless networking
    is set up, and SSH is enabled. Do both via the Raspbian Jessie desktop— you''ll
    find the new Raspberry Pi Configuration utility in Menu > Preferences, where you
    can enable SSH in the Interfaces tab.


    ### Connect the display


    02 With a towel on your desk to avoid scratches, connect the Raspberry Pi to the
    back of the 7" Touchscreen Display, making sure that the cables are connected
    correctly. (Older releases require you to also connect and mount the display board).
    Secure with screws, and then mount in stand.


    ![](img/f11b7dbb71886af07ef87126037ebe98_106_1.png)


    > **Did you know...**

    > You shouldn''t feel restricted by the photos you can display on your Raspberry
    Pi picture frame. Various options exist for pulling images down from popular web
    services, such as Flickr or Facebook. To do this, you''ll need a dedicated Python
    script, which has already been written for you. Head to Samuel Clay''s GitHub
    to download them, but don''t add the scripts to rc.local until you''ve confirmed
    they work.


    > "Set up a Raspberry Pi with some photo-displaying software"


    ![](img/f11b7dbb71886af07ef87126037ebe98_107_0.png)


    ### Prepare your photos


    03 Naturally, you''ll need a collection of digital photos to display on the Pi-powered
    digital picture frame. We have different options here (see boxout, page 107) but
    recommend you start with photos stored on your Pi, ones that have been copied
    via USB, via a network drive, or downloaded through your browser.


    ```bash

    sudo nano /etc/lightdm/lightdm.conf

    ```


    ### Set up your Pi picture frame


    04 To configure the Raspberry Pi as a picture frame, we first need to prevent
    the screen from switching off. This means editing the lightdm.conf file.


    Add this line under `[SeatDefaults]`:


    ```

    xserver-command=/usr/bin/Xwrapper -n 0 -dpms

    ```


    When done, save and exit with Ctrl+X, then reboot:


    ```bash

    sudo reboot

    ```


    ### Install feh


    05 Image viewing software feh is the best option for building a simple Pi picture
    frame, so install this.


    ```bash

    sudo apt-get install feh

    ```


    Once installed, instruct feh where to find the images, changing `/media/STORAGE/test`
    with your directory path, e.g.


    ```bash

    DISPLAY=:0.0 XAUTHORITY=/home/pi/.Xauthority /usr/bin/feh -p -Z -F -R 60 -Y -D
    15.0 /media/STORAGE/test

    ```


    > “Naturally, you''ll need a collection of photos to display on the Pi-powered
    digital picture frame”


    ### Save the script


    The previous script should have prompted the Raspberry Pi picture frame to begin
    displaying images from the specified folder, for 15 seconds each. To force this
    to start at boot, we need to add it into a script.


    Create this with:


    ```bash

    sudo nano /home/pi/start-picture-frame.sh

    ```


    Add the following:


    ```bash

    #!/bin/bash

    DISPLAY=:0.0 AUTHORITY=/home/pi/.Xauthority /usr/bin/feh -q -- -Z -X 18 -Y 15.0
    /media/STORAGE/test

    ```


    Exit and save, then test with


    ```bash

    bash /home/pi/start-picture-frame.sh

    ```


    ### Make picture frame run at boot


    The script can now be set to run at boot. Open


    ```bash

    sudo nano /etc/rc.local

    ```


    ... and before `exit 0`, add


    ```bash

    sleep 10

    su - pi -c ''/bin/bash /home/pi/start-picture-frame.sh''

    ```


    Save and exit.


    ### Reboot your Pi and test


    Now you''re pretty much done! To test it out, use the usual `sudo reboot` command
    to restart the Raspberry Pi and check that the device boots straight into picture
    frame mode. If you experience any problems, check that your commands have been
    entered correctly, and in the right places using lightdm.conf and rc.local.


    ### Stop the picture frame


    Should you need to stop the picture frame software at any time, this can be done
    with the following simple command:


    ```bash

    sudo pkill feh

    ```


    As long as the images you prepared for your picture frame don''t take up too much
    space on the disk, they should load up without any problems.


    > **Did you know...**

    > The same collection of scripts also features a file called `pi.pi`, which, when
    used with a motion detection module, will turn the display on whenever someone
    moves the picture frame. A suitable infrared motion sensor module will set you
    back a couple of pounds, and should be connected to the Raspberry Pi''s GPIO.
    Connect the pin labelled VCC to the RPi pin found in GPIO 2, GND to GND, and Out
    to GPIO 4.


    ![](img/f11b7dbb71886af07ef87126037ebe98_108_0.png)


    ### Build a Raspberry Pi-powered car


    #### What you''ll need...


    - A toy RC car with two channels (steering and drive)

    - Adafruit PWM I2C servo driver

    - Female-to-female jumper cables

    - 5V battery power bank


    Estimated cost: £60 / $100

    Components from www.modmypi.com


    Make use of cutting-edge web technologies to take control of a remote controlled
    car with a smartphone or tablet... 35


    ![](img/f11b7dbb71886af07ef87126037ebe98_109_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_110_0.png)


    > **Did you know...**

    > You can make this project work with just about any remote controlled car! Follow
    the guide for more details.


    Web technologies are moving forward at a huge pace; cloud technologies are bringing
    mass computing to individuals, and hardware has reached a perfect moment in time
    where sensors, displays and wireless technology have all evolved into efficient
    and affordable devices. We truly are at a point where nearly anyone can take an
    idea from nothing to a working product in a week and at very little cost. Just
    like this project, which is fun, quick and easy to build on and a fantastic way
    to learn. We''re going to grab an old remote-control car, rip off its radio receiver
    and replace it with the Raspberry Pi, hook it up on the network, fire up a bleeding-edge
    web server and then get your smartphone or tablet to control it by tilting the
    device. By the end of this, not only will you have a fun toy; you will have learnt
    about the basic technologies that are starting to power the world''s newest and
    biggest economy for the foreseeable future.


    ### Raspberry Pi-controlled car build process


    To help our toy car come to life using the latest web technologies and our credit
    card-sized computer, we''re going to need to make some pretty significant changes
    to its workings. Fortunately, the most complex aspects of the build can be accomplished
    with a couple of affordable purchases, namely a servo controller board to take
    care of the steering and throttle, and a 5V battery pack to keep the Raspberry
    Pi running smoothly.


    ### Identify and remove old radio


    01 This project is effectively replacing the car''s nominal transmitter and receiver.
    Notice the three sockets on the original receiver: one goes to the motor controller
    and one to the steering servo. Some remote-control cars also have separate battery
    for the electronics, but those (especially with an electronic speed controller
    with BEC) get their 5V power supply directly from the speed controller, saving
    on components.


    If you don''t have a speed controller with 5V BEC, you''ll need to get a 5V supply
    elsewhere. Many shops sell 5V battery power supplies - often as mobile phone emergency
    top-ups, www.modmypi.com sells a suitable 5V battery power bank for under £20
    and you should get a couple of hours of use from your Raspberry Pi.


    ![](img/f11b7dbb71886af07ef87126037ebe98_111_0.png)


    > **Power up**

    > The 5V battery pack keeps our Raspberry Pi running for a good five hours


    ### Servo control


    Adafruit PWM I2C servo driver board from www.modmypi.com


    ### Pi-powered


    The Raspberry Pi fits front and centre to keep it as safe as possible


    ### Pick a car


    You can use pretty much any affordable car for this project

