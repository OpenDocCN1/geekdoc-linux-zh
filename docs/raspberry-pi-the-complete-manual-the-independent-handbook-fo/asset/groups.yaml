    # # Install a distro


    We take a look at some of the key aspects involved in installing a pre-built OS


    With its small size and cheap price, many people might be fooled into thinking
    that the Raspberry Pi is only usable for basic tasks, and learning to program
    on. While one of the primary goals of the Pi was to increase computer literacy
    at a lower level rather than just learning how to create Excel spreadsheets, the
    Pi has many other great uses.


    As the Raspberry Pi is essentially a mini PC, with an HDMI and analog TV output
    rather than a traditional monitor connection, it can perform many common tasks
    that a laptop or desktop is often used for. While it doesn''t really have the
    processing power or RAM to run the latest version of Windows, there are other
    options.


    There are a wealth of fully fledged operating systems, many forked from their
    desktop big brothers that have been optimised specifically for the Pi. One of
    the most popular of these is Raspbian, which is a port of Debian. Debian is a
    key part of the Linux ecosystem, and many other popular open source distributions
    are forked from the Debian source code. The original Debian was released in 1993,
    and it''s come a long way since. Raspbian needed work to get performance levels
    up to standard, as the Pi uses the older ARMv6 architecture. It''s now a great
    everyday desktop.'
