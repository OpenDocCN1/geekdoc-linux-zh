  md: "\n# Xbox Zero arcade\n\n## Projects\n\n## Set up the disk\n\nBefore we get\
    \ to playing any games, we need to make sure that RetroPie is able to use all\
    \ the space on the micro SD card. This will allow you to store ROMs and save your\
    \ games. Select “RetroPie” from the menu. You’ll be presented with several configuration\
    \ options. Select “Raspberry Pi Configuration” tool RASPID-CONFIG. You can change\
    \ the default username and password at a later date; for now just use the controller\
    \ to select “Expand Filesystem”. Next, highlight the “Select” button and click\
    \ on it. After a short delay, you will see a success screen — press OK and you’ll\
    \ be taken to the configuration screen. Press right until “Finish” is highlighted,\
    \ then click on it. You should now reboot your Raspberry Pi.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_126_0.png)\n\
    \n## Adding ROMs\n\nThe final step is adding new ROMs. Once you’ve legally purchased\
    \ and downloaded ROMs from the internet, you’ll need to copy them onto the micro\
    \ SD card. ROMs are stored in a separate folder for each system. So, for example,\
    \ you need to place your Sega Master System ROMs in “/retropie/roms/mastersystem”.\
    \ Once you’ve installed ROMs, you’re ready to play!\n\n## Playing\n\nOnce booted,\
    \ you’ll see a menu with all the available game systems on it. Some emulators\
    \ will only show up once game ROMs for that system are installed. Scroll until\
    \ you find the game you want to play — then let rip!\n\nYou can always return\
    \ back to RetroPie if you want to change any of the configuration options, or\
    \ update the software. And that’s all there is to it! Time to sit back and play\
    \ some games.\n\nIf you want to find out more about the RetroPie software, visit\
