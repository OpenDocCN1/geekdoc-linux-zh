    \ the ‘console’ or ‘command line’.\n\n# DD command\n\n**07** The command you need\
    \ to use is called ‘dd’. This is entered in the format of ‘sudo dd bs=1m if=[img]\
    \ of=[device]’. Eg:\n\n```\n```\n sudo dd bs=32m if=/Users/rachelclabb/Desktop/archlinux/\
    \ archlinux-hf-2013-02-11.img of=/dev/disk1\n```\n```\n\n# Win 32 Disk Imager\n\
    \n**08** Windows users can use Win32 Disk Imager. Once you’ve downloaded the tool,\
    \ simply right click on the .exe, and choose ‘run as administrator’ and follow\
    \ the prompts. When the installation is complete you can put the SD card in your\
    \ Pi. Easy!"
