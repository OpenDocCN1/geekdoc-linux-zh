    # Windows


    05  Download the Win32 DiskImager from http://sourceforge.net/projects/win32diskimager/
    Once installed, select the image file and the micro SD card. Follow the on-screen
    instructions until the image has been written to the card.


    # Configuring


    06  Right – you’re almost ready to play. Put the micro SD card into the Raspberry
    Pi Zero, hook up the controller USB cable and the HDMI cable. Finally, plug the
    Pi into the power. It should boot up automatically, and after a few seconds, you’ll
    be greeted with a configuration screen.


