    # GPIO


    Once you’ve soldered on a 2x20 male header, your GPIOs will work as usual. To
    the right, you can see that the four unpopulated pins fit video output, and a
    reset switch.


    ![](img/f11b7dbb71886af07ef87126037ebe98_17_0.png)


    # Video


    You’ll need a mini-HDMI-to-HDMI adaptor to use the video output port, although
    you can also use the RCA composite video output via the unpopulated pin.


    # Data


    The power port, on the right, is micro-USB as usual. The data port beside it is
    now micro-USB as well, however; so you will likely need a micro-USB to-USB adaptor.


    # Prepare NOOBS SD Card


    # 06


    See www.raspberrypi.org/help/noobs-setup for more details. NOOBS requires an SD
    card formatted as FAT32. You then need to download the latest NOOBS image from
    https://downloads.raspberrypi.org/NOOBS_latest and then unzip it to the SD card.
    On Linux, the steps are as follows:


    ```

    sudo parted /dev/mmcblk0

    (parted) mktable msdos

    (parted) mkpart primary fat32 0% 100%

    (parted) quit

    sudo mkfs.vfat /dev/mmcblkp1

    cd /mnt

    sudo mkdir pi

    sudo mount /dev/mmcblkp1 pi

    cd pi

    sudo unzip ~/Downloads/NOOBS_v1_5_0.zip

    sync

    cd ..

    sudo umount pi

    ```


    # Boot NOOBS and install Raspbian


    # 07


    Connect your Pi Zero up as shown in the first step. The minimum you need connected
    for a NOOBS install is a monitor and a keyboard. However, a mouse and either an
    Ethernet adaptor or Wi-Fi adaptor are also very useful. Press Enter to select
    Raspbian and then press 1 to install. Then press Enter to agree. Once it is finished
    it will say ‘OS installed successfully’. Press OK and your Pi will boot into Raspbian.
    Alternatively, if you don’t want to use NOOBS, you can flash Raspbian to an SD
    card in the usual manner. Raspbian will boot into a desktop environment by default.


    ![](img/f11b7dbb71886af07ef87126037ebe98_17_1.png)


