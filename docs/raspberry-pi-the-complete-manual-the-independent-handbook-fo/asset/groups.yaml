    # Set up your Pi Zero


    # Set up your Pi Zero


    Get to grips with your Raspberry Pi Zero, either as a headless device or for use
    together with a screen and keyboard


    So you''ve picked up one of the tiny yet powerful Zeros, but before the coding
    fun can begin you need to get more familiar with it. Don''t worry, we''ll walk
    you through the Raspberry Pi Zero, the required cables, how to prepare a NOOBS
    SD card, and how to solder the GPIO header onto the Pi. Once the Pi is working
    and booted we''ll show you how to get it working on Wi-Fi through the Raspbian
    user interface. You''ll need a USB hub for this, or even just to use a keyboard
    and mouse together. We''ll also show you how to prepare a Raspbian SD card for
    headless use (either VNC or SSH) with only a Wi-Fi adaptor or USB-to-Ethernet
    adaptor.


    ![](img/f11b7dbb71886af07ef87126037ebe98_15_0.png)


    # Raspberry Pi Zero Cable Overview


    01 The Raspberry Pi Zero is very small, and as such cannot fit normal-sized USB
    and HDMI connectors on. To use it, you therefore need adaptors that break out
    microUSB into full-size USB and mini-HDMI to full-size HDMI. You also need to
    be very careful when connecting the microUSB cables as the microUSB power cable
    will fit into the connector meant for USB data. It''s easy to tell them apart
    though, as they''re clearly labelled, and the USB data connector can be found
    between the HDMI and power connectors.'
  - '[PAGE 16]


    # Set up your Pi Zero


    # Getting started


    ![](img/f11b7dbb71886af07ef87126037ebe98_16_0.png)


    Fig 1: Once you''ve soldered the header into place, any Pi Zero should resemble
    any other Raspberry Pi


    # GPIO header


    +   02  Soldering your brand new Raspberry Pi Zero might seem like a scary prospect
    at first, but it’s not that difficult! What is difficult, however, is snapping
    off the correct number of GPIO header pins (40), as the kit supplies more than
    40. It’s also well worth noting at this point that it doesn’t matter too much
    if you mess up and end up missing a couple of the bottom pins!


    # Soldering kits


    +   03  Soldering irons are very cheap these days. If you are going to be doing
    a lot of soldering then it’s probably worth getting a temperature-controlled one
    where you can change the tip. However,


    ![](img/f11b7dbb71886af07ef87126037ebe98_16_1.png)


    the kit we used with a soldering iron, stand, solder sucker and some lead-free
    solder was £8 on Amazon. We managed to solder the GPIO pins using this kit no
    problem.


    # Holding the GPIO headers in place


    +   04  Before you can solder the GPIO headers, you need to be able to hold them
    in place. We recommend putting some blu-tack on either side of the pins for this.
    This also has the advantage that you can flip the Pi over and then use the blu-tack
    to keep it in place on a table while you are soldering. The blu-tack should just
    easily peel off once you are done.


    # Solder the GPIO headers


    +   05  Here comes the bit you might have been dreading, but don’t worry! Make
    sure you have wet the sponge in the soldering iron holder, as you will need to
    wipe the iron on the sponge to keep the tip clean. If this is the first time you’re
    iron has been used, the heating element will probably give off a lot of smoke
    for


    the first few minutes, so don’t worry if that happens. Still, be mindful of your
    safety and make sure that you are soldering in a well-ventilated area – try not
    to breathe in any fumes. Once the iron is hot, apply some solder to the tip and
    wipe any excess solder on the sponge. Then start to solder the pins. For each
    pin, touch the tip of the iron on the bottom of the GPIO header and the metal
    contact on the Pi, then apply a very small amount of solder. Once the solder has
    flowed onto the pin and the metal contact, then you can remove the iron. If there
    is too much solder then you can reheat the solder and use the solder sucker to
    remove it. Take breaks when soldering the GPIO headers for a couple of reasons:
    1) you don’t want to overheat any components on the Pi, and 2) you can melt the
    plastic of the GPIO headers and that will allow the pin to fall through. Keep
    wiping the tip of the iron on the sponge to keep it clean throughout the soldering
    process. Make sure you unplug the iron and put it somewhere safe to cool down
    when you are finished.'
