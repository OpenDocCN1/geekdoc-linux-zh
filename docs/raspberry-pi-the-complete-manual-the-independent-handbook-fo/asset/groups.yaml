    \ /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0 0`\n- `tmpfs /var/run\
    \ tmpfs defaults,noatime,nosuid,mode=0755,size=2m 0 0`\n- `tmpfs /var/spool/1mqueue\
    \ tmpfs defaults,noatime,nosuid,mode=070,gid=12,size=30m 0 0`\n\nAdd each to /etc/fstab\
    \ in nano.\n\n### Move your OS to a HDD\n\n08 If you’ve concerned about the lifespan\
    \ of the SD card, why not reduce your Raspberry Pi’s reliance on it? Instead of\
    \ using the SD card as a sort of budget SSD, change its role and add a HDD or\
    \ USB stick to run the operating system, leaving the SD card for bootstrapping.\
    \ This can give a marked performance boost to the SD card.\n\n### Back up the\
    \ SD card\n\n09 Create a copy of your Pi’s SD card. Shut down, remove the card\
    \ and insert it into your desktop computer. In the command line, run:\n\n```bash\n\
    sudo dd bs=4M if=/dev/sdb of=~/backup.img\n```\n\nThe path /dev/sdb represents\
    \ the SD card. Copying takes 5-10 minutes. When complete, remove the SD card and\
    \ connect your USB device.\n\n### Copy Raspbian to USB\n\n10 Using a blank Ext4-formatted\
    \ USB thumb drive (or external HDD) as the destination drive, enter:\n\n```bash\n\
    sudo dd bs=4M if=~/backup.img of=/dev/sdc\n```\n\nLeave the backup on your computer,\
    \ just in case something goes wrong. With an SD card and USB storage device sharing\
    \ an identical disk image, it’s time to consider what you’re going to do next\
    \ – create a faster Raspberry Pi,\n\n![](img/f11b7dbb71886af07ef87126037ebe98_63_0.png)\n"
