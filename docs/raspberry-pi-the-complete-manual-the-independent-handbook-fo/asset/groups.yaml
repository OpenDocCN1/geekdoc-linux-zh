    # Use Scratch blocks and tools


    Getting to grips with the Scratch Studio toolbox


    Situated in the centre of the Studio is the Edit Panel. The panel controls relate
    to the currently selected sprite.


    Let''s start by selecting the jelly fish sprite, called Creature1, from the Sprite
    Collection area.


    At the top we have the sprite''s image and name, plus an indication of its current
    stage coordinates and direction. On the left are three animation control buttons.
    The top button will rotate the sprite, the second switches between left- and right-facing
    states, and the third turns animation off.


    Below are three Edit Panel tabs. The script tab is where block scripts are created.
    Here''s where we''ll drag and drop our blocks, snapping them together in various
    combinations.


    To change a sprite''s visual appearance we''ll use the ''Costumes'' tab. Each
    sprite can have one or more costumes. For example, the jellyfish has two costumes
    (Fig 1). Each costume has buttons to edit, copy and delete. New costumes can be
    painted, imported or captured using the three ''New Costumes'' buttons. The sound
    tab allows us to add audio to our project.


    ![](img/f11b7dbb71886af07ef87126037ebe98_49_0.png)


    Fig 1: Jellyfish sprite Costumes - The jellyfish sprite has two different costumes.


    # Scratch block styles


    01 The ''Blocks Palette'' contains the complete collection of scripting blocks.
    Blocks come in three basic styles, namely hats, stacks and reporters (see Fig
    3 on the opposite page).


    A hat-style block will start block script execution based on a specific event.
    The classic hat block is the ''green flag'' click event. However, there are numerous
    other hat blocks, including hat blocks that start script execution after a specific
    key press, a mouse click and even following sensor event from the some GPIO connected
    hardware. As you can probably tell, this offers a lot of options to Scratch programmers.


    Reporter blocks allow us to specify textual, numeric and boolean values. They
    fit into specific shaped ''holes'' in other blocks. A rectangular reporter will
    contain a text string.


    While the rounded end reporters are associated with numeric values, angle-ended
    reporters contain boolean true and false values.


    Stack blocks are the core script building elements. They interconnect with other
    blocks via their top-edge notches and bottom-edge bumps. Many stack blocks contain
    ''holes'' for reporter style blocks, which will modify their operation depending
    on the specified reporter block values.


    The Scratch block collection is divided into groups. We select a block group using
    the eight buttons located at the top of the Block Palette panel, namely, ''Motion'',
    ''Control'', ''Looks'' and so on. These groups are colour coded. Apart from adding
    block selection this colour coding provides a visual cue to a block''s type when
    reading a block script in the Edit Panel.'
  - '[PAGE 50]


    # # Program with Scratch


    ![](img/f11b7dbb71886af07ef87126037ebe98_50_0.png)


    Fig 2: Sound Recorder Tool – Scratch Studio includes a tool to record our own
    sounds


    # ## Scratch block help


    **02** As we’ve seen, there are many blocks, each with their own specific functionality
    and capabilities.


    In one way this is great news. A large block collection means Scratch can be used
    in a vast range of software projects, such as games, animation, music, graphics,
    math, science, robotics, electronics and much more.


    However, the wide selection of blocks can be quite a challenge for the novice
    Scratch coder. To help with this problem the Scratch Studio designers have included
    an informative set of block-centric help pages.


    A simple right-click on any block will display a pop-up help page option. The
    help page contains context-specific descriptions, graphical images and, where
    appropriate, a script example of how to use that particular block (Fig 4).


    It’s a terrific feature which greatly simplifies the process of decoding which
    blocks to use. More importantly, studying these help pages is a highly effective
    way to enhance our coding skills and discover the potential contained within Scratch’s
    feature-rich block collection.


    ![](img/f11b7dbb71886af07ef87126037ebe98_50_1.png)


    Fig 3: Block Style Examples – the Scratch blocks come in a number of different
    styles


    # # Projects


    # ## Did you know...?


    There is more than one command available to start your script; beyond the standard,
    green flag block


    # ## Block script walkthrough


    **03** Let’s dig deeper into how a block script works in practice. For this, we
    will use a simple Aquarium project block script. From the Sprite Collection panel
    select the Sprite garfish. Then go back to the central Edit Panel and select the
    Scripts tab.


    There’s just a single block script. Starting at the top there’s a green flag ''hat-style
    block to kick off the activity. Next there’s a ‘forever loop’. This inside loop
    block are activated until the stop button is pressed. This ‘forever loop’ block
    contains two other blocks.


    The first inner script block selects the next background image. Click on the ''Backgrounds''
    tab to view all the stage images. The second inner block simply pauses execution
    for a number of seconds. Setting the value to ‘1’ means that this script will
    pause for a second before then performing the action specified by the next block.


    It’s important that you remember these two blocks are enclosed in the forever
    loop block. So, the stage background images will be displayed in sequence for
    one second each.


    ![](img/f11b7dbb71886af07ef87126037ebe98_50_2.png)


    Fig 4: Block Help Window – a sample of the help window associated with an ‘ask
    and wait’ block'
  - '[PAGE 51]


    # Projects


    # Create a Snake clone in Scratch


    # Create a Snake clone in Scratch


    Design your own version of Snake to test your new programming skills!


    # What you''ll need...Scratch project archives

    www.scratch.mit.edu/ideas?size=over


    # Did you know...

    Snake is a very popular

    beginner game that started life

    in the arcades in the Seventies

    and is still popular today.


    Here, we will create a version of the classic Snake game where you

    move the snake around the Scratch stage using the arrow keys. You

    control the head of the snake and must avoid a collision with either

    the body of the snake or the edge of the stage.


    The snake body grows longer each time you eat an egg. You get

    points added to your score for eating good yellow eggs and lose

    points for eating bad black eggs. There are also bonus sprites to eat

    for extra points.


    By following this tutorial you will learn to create your own

    simple sprite graphics, send and receive broadcast events, use a

    list variable to store data, play sound effects, generate random

    numbers and use sensing commands to detect when a sprite is

    touching something.


    # Egg sprite

    The Egg sprite appears randomly on the screen and let other sprites

    know when it has been eaten (touched by the snake tongue)


    ![](img/f11b7dbb71886af07ef87126037ebe98_51_0.png)


    # Snake sprite

    The Snake sprite

    moves the head

    around the stage

    and draws the

    body behind it.

    It also detects

    collisions with the

    body or edge


    # Tail sprite

    The Tail sprite follows the head, erasing the end

    of the body so the snake moves, and pausing

    when it needs to grow


    # Bad Egg sprite

    The Bad Egg sprite also appears randomly

    but decreases the score when eaten. It also

    grows in size, getting harder to avoid


    ![](img/f11b7dbb71886af07ef87126037ebe98_51_1.png)


    # Paint the Snake sprite


    +   01 Click the New Sprite: Paintbrush

    +   icon to paint the Snake sprite.


    In the Paint Editor, draw a small

    green ellipse for the snake head and

    add a red rectangle for the tongue.

    It’s important that the tongue is a

    different colour to the head. Name

    your sprite Snake.'
  - '[PAGE 52]


    # Add a Snake sound


    +   02 When the Snake tongue touches the Snake body or the edge of the stage,
    we are going to play a Game Over sound. We need to add this sound to the Snake
    sprite. With the Snake sprite selected, click the Sound tab and choose Import.
    Select the Electronic-Screetch sound.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_0.png)


    # Initialise Snake variables


    +   05 Use a ''when green flag clicked'' Control command and initialise the Snake
    variables as shown, using commands from the Variables palette. We want to start
    each game with an empty Next Direction list, so delete all of its entries. The
    Score must start at zero. The Speed sets difficulty.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_1.png)


    # Add main action loop


    +   07 Use a ''forever'' command with an ''if-else'' command nested inside. We
    have a collision if the red tongue is touching the blue body (the head is always
    touching the body) or the Snake sprite is touching the edge. Use the Eyedropper
    tool to select colours within Scratch.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_2.png)


    # Respond to arrow keys


    +   03 Drag four when key pressed commands from the Control palette, and four
    point in direction commands from the Motion palette. Configure them as shown so
    that the up arrow changes the direction to 0 degrees (up) and so on. Click the
    green flag above the stage to test this.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_3.png)


    # Draw Snake body


    +   06 Use commands from the Pen palette to control the drawing of the Snake body.
    You should also use commands from the Motion palette to move the Snake to the
    centre of the stage and point left at the beginning of each game. The pen is up
    until the Snake is in the starting position. In the next steps we''ll use colours
    to check to see if the head is touching anything it shouldn''t.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_4.png)


    # Handle Game Over


    +   08 When a collision has been detected, broadcast a Game Over event (you''ll
    need to create a new event) to the other sprites so they can also react. Also,
    play the ''Screetch'' sound effect and stop all scripts so that the Snake freezes
    in its current position at the end of the game.


    # Make Snake variables


    +   04 Click on the Variables palette. Make two variables, Score and Speed, that
    are visible to all sprites. Make a list called Next Direction which is visible
    to all sprites; it will store the sequence of directions that the head takes.
    Only have the Score variable checked so it appears on the stage.


    ![](img/f11b7dbb71886af07ef87126037ebe98_52_5.png)'
