    \n3.  The current list you find yourself in is the name of all the packages labelled\
    \ as ‘games’ from the available server. In the list, the part before the hyphen\
    \ tells you the name of the package, which is what you will need to know to be\
    \ able to install it. Use the arrow keys, up/down to navigate; press 'q' to exit.\n\
    \n### Installing a package\n\n4.  Using the up and down arrow keys, navigate the\
    \ list. If you find something you like the look of, say Angry Drunken Dwarves,\
    \ remember the name of the package, in this case ‘angrydd’, and press 'q' to exit\
    \ the list. To install the package, enter the following in the terminal:\n\n```\n\
    sudo apt-get install angrydd\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_32_1.png)\n\
    \n### Executing the package\n\n5.  The result of the previous command should be\
    \ the successful download and installation of the game, Angry Drunken Dwarves.\
    \ To execute the newly installed package, you can either run it from the LXDE\
    \ Menu under Games > Angry Drunken Dwarves, or by typing in the following into\
    \ the terminal:\n\n```\nangrydd\n```\n\n### Remove a package\n\n6.  This installing\
    \ of packages is perfectly fine, and you can see just how powerful a command Apt\
    \ really is. But, what if you want to remove a package? Using the Apt command\
    \ again, let’s say we want to completely remove all traces of Angry Drunken Dwarves\
    \ from the Raspberry Pi.\n\n### Apt Easter eggs\n\n7.  The Apt command is a short,\
    \ no-mean-to-draw variant of the Aptitude command. This command has a long history\
    \ in Linux, and as a result has some rather special features, also known as Easter\
    \ eggs. Purely for a little bit of fun, type in the following commands and see\
    \ the results:\n\n```\naptitude moo\naptitude -v moo\naptitude -vv moo\naptitude\
    \ -vvv moo\naptitude ~vvvv moo\naptitude ~vvvvv moo\nsudo apt-get moo\n```\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_32_2.png)\n\n### Man the Apt command\n\
    \n8.  As you can see, there is more than what first meets the eye. There are many\
    \ different sub-commands and variations in which to run them. If you want to see\
    \ what else the Apt command can do, enter the following:\n\n```\nman apt\n```\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_32_3.png)\n\n## Use graphical installations\n\
    \n### What you'll need...\n\n**Synaptic:**\nwww.congpu.org/synaptic/\n\nWould\
    \ you prefer a graphical interface to install new programs? If so, then read on...\n\
    \nIf you're new to Linux, you may find using its built-in Apt package management\
    \ tool a bit intimidating and confusing. The apt-get command is used for installing\
    \ applications through the internet, connecting to the remote servers – called\
    \ repositories – which house the programs as packages. But it is used through\
    \ the terminal command prompt, which can be daunting, so we need an alternative:\
    \ a desktop environment interface method of getting hold of packages.\n\nThis\
    \ is where Synaptic comes in. Synaptic is a friendly-looking graphical interface\
    \ to the apt-get terminal command which allows you to manage your application\
    \ installations, and removals, through the already familiar desktop environment.\
    \ Think of it as a kind of online shop where you can pick and choose the programs\
    \ you want and have them downloaded and installed onto your Raspberry Pi without\
    \ you having to drop into the terminal.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_33_0.png)\n\
    \n-   **Upgrade entire systems**\n    Synaptic has the ability to update and upgrade\
    \ every program or package, and it can upgrade your entire system to the latest\
    \ version\n-   **Install and more**\n    Synaptic is a very powerful tool. With\
    \ it you can install, remove, upgrade and downgrade single or multiple packages\
    \ and programs\n-   **Browse all documentation**\n    Within Synaptic, you are\
    \ able to browse and read all available online documentation related to a package\
    \ or program\n-   **Easily find programs**\n    Synaptic enables you to easily\
    \ locate packages and programs by name, description, version and even by who developed\
    \ the program\n"
  mdcn: "\n\n## 让树莓派连接网络\n\n### 入门指南\n\n……最后，Wi-Fi 连接的新 IP 地址将出现。如果你点击“管理网络”选项卡，该网络现在会被列出，并且“启用”单选按钮处于激活状态。要接入互联网，只需启动\
    \ Empathy，你就连接上了。Wi-Fi 实用程序将保持在面板右下角运行。如果右键单击 Wi-Fi 图标，你将看到断开或重新连接的选项、事件历史以及最近扫描的结果。点击“状态”以查看其性能如何。\n\
    \n### 检查连接\n\n要检查树莓派是否具有有效的互联网连接，请双击 LXTerminal。输入以下命令：\n\n```\nip addr\n```\n\
    \n你应该会看到一串数字，最后一行以 'inet' 开头，然后是树莓派连接的 IP 地址（图 3）。通常这类似于 192.168.1.11，这表明连接正在工作，因为树莓派已被分配了一个基于你的互联网调制解调器/路由器所使用的\
    \ IP 地址。如果未显示，则路由器端可能存在问题。调制解调器/路由器应该运行一个 DHCP 服务器，当树莓派连接它时，会获得一个 IP 地址。如果没有运行，那么连接在它上的其他设备也无法访问互联网。\n\
    \n使用另一台设备的网页界面登录到 192.168.1.0 或你的调制解调器的实际 IP 地址，以检查 DHCP 服务器服务是否已开启。最后，在终端中输入：\n\
    \n```\nping google.com\n```\n\n### 共享连接\n\n如果你没有 Wi-Fi 网卡、有源 USB 集线器或足够长的以太网电缆，但有另一台已连接互联网计算机，还有另一种获取访问权限的方法。在\
    \ Mac 上，通过 USB 或以太网电缆将其连接到树莓派。启动系统偏好设置，在“互联网与无线”下，点击共享。点击“互联网共享”，然后选择 Wi-Fi（用于\
    \ AirPort）作为要共享的连接类型，并选择树莓派如何连接到你的 Mac（图 4）。\n\n在 Windows 电脑上，进入资源管理器 > 网络 > 网络和共享中心\
    \ > 更改适配器设置。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_30_0.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_30_1.png)\n\
    \n## 安装和使用软件包\n\n你将需要……\n\n**Apt 命令帮助页面：**\nhttp://linux.die.net/man/8/apt\n\n\
    **Apt-get 帮助页面：**\nhttp://manpages.ubuntu.com/manpages/lucid/man8/apt-get.8.html\n\
    \n### 简介\n\n> 树莓派很出色，但安装软件后会更强大\n\n![](img/f11b7dbb71886af07ef87126037ebe98_31_0.png)\n\
    \n单独来看，树莓派是一台近乎完美的迷你电脑。它已经包含大量教育软件、一些游戏、一些编程工具以及许多系统工具。但就像大多数电脑一样，这只是冰山一角。通过安装更多程序，你可以做更多事情。\n\
    \n这些程序被称为*软件包*（packages），其种类之广、多样性之高，如同最初设计它们的开发人员一样。在 Linux 中，如果有对特定程序的需求，就会有人开发一个。然后他们将代码发布到世界，并自由公开源代码，因此称为“开源”。一旦程序经过测试，最终会到达为该特定\
    \ Linux 发行版提供服务的众多远程服务器之一。\n\n这些远程服务器称为仓库（repositories），或*repos*，包含你软件包的所有元素，以便下载到你的系统中并安装。一旦你知道如何操作，这个过程非常快且简单……\n\
    \n```\npi@raspberrypi / $ sudo apt-get\n...\n```\n\n### 更新和升级\n\n1.  在树莓派上获取软件包涉及进入命令行终端，通过桌面上的\
    \ LX Terminal 图标，并输入几条命令。但在我们这样做之前，我们需要确保系统是最新的。在终端中输入以下内容：\n\n```\nsudo apt-get\
    \ update\nsudo apt-get upgrade\n```\n\n或者：\n\n```\nsudo apt-get update && sudo\
    \ apt-get upgrade\n```\n\n### 搜索软件包\n\n2.  apt-get 命令（高级软件包工具）是在树莓派上下载和安装软件包的关键。在上一例中，我们更新了现有软件包和系统，升级了任何需要升级的项，并更新了当前的软件包列表。现在，让我们在服务器软件包列表中搜索可用的游戏。\n\
    \n```\napt-cache search game | less\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_32_0.png)\n\
    \n### Apt 搜索\n\n3.  你当前所在的列表是可用服务器上所有标记为“游戏”的软件包名称。在列表中，连字符之前的部分告诉了你软件包的名称，这是你需要知道才能安装它的内容。使用方向键，上/下键进行导航；按\
    \ 'q' 退出。\n\n### 安装软件包\n\n4.  使用上、下方向键，导航列表。如果你发现了一些喜欢的外观，比如 Angry Drunken Dwarves，记住软件包的名称，在本例中为\
    \ 'angrydd'，然后按 'q' 退出列表。要安装软件包，在终端中输入以下内容：\n\n```\nsudo apt-get install angrydd\n\
    ```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_32_1.png)\n\n### 运行软件包\n\n5. \
    \ 上一条命令的结果应该是游戏 Angry Drunken Dwarves 的成功下载和安装。要执行新安装的软件包，你可以从 LXDE 菜单中的 游戏 >\
    \ Angry Drunken Dwarves 运行，或者在终端中输入以下内容：\n\n```\nangrydd\n```\n\n### 删除软件包\n\n\
    6.  安装这些软件包完全没问题，你可以看到 Apt 命令确实非常强大。但是，如果你想删除一个软件包怎么办？再次使用 Apt 命令，假设我们要从树莓派中完全删除所有\
    \ Angry Drunken Dwarves 的痕迹。\n\n### Apt 彩蛋\n\n7.  Apt 命令是 Aptitude 命令的一个简短且无意图的变体。这个命令在\
    \ Linux 中有悠久的历史，因此有一些相当特殊的功能，也被称为彩蛋。纯粹为了好玩，输入以下命令并查看结果：\n\n```\naptitude moo\n\
    aptitude -v moo\naptitude -vv moo\naptitude -vvv moo\naptitude ~vvvv moo\naptitude\
    \ ~vvvvv moo\nsudo apt-get moo\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_32_2.png)\n\
    \n### 查阅 Apt 命令手册\n\n8.  正如你所见，眼之所见并非全部。有许多不同的子命令和运行它们的变体。如果你想查看 Apt 命令还能做什么，输入以下内容：\n\
    \n```\nman apt\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_32_3.png)\n\n\
    ## 使用图形化安装\n\n### 你将需要……\n\n**Synaptic：**\nwww.congpu.org/synaptic/\n\n你更喜欢使用图形界面来安装新程序吗？如果是，请继续阅读……\n\
    \n如果你是 Linux 新手，你可能会觉得使用其内置的 Apt 软件包管理工具有点令人望而生畏和困惑。apt-get 命令用于通过互联网安装应用程序，连接到容纳程序作为软件包的远程服务器——称为仓库。但它通过终端命令提示符使用，这可能令人畏惧，因此我们需要一种替代方案：一种通过桌面环境获取软件包的界面方法。\n\
    \n这就是 Synaptic 的用武之地。Synaptic 是 apt-get 终端命令的一个友好外观的图形界面，允许你通过已经熟悉的桌面环境来管理你的应用程序安装和移除。把它想象成一种在线商店，你可以在其中挑选你想要的程序，让它们下载并安装到你的树莓派上，而无需进入终端。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_33_0.png)\n\n-   **升级整个系统**\n    Synaptic\
    \ 具有更新和升级每个程序或软件包的能力，它可以将你的整个系统升级到最新版本\n-   **安装及更多**\n    Synaptic 是一个非常强大的工具。使用它可以安装、删除、升级和降级单个或多个软件包和程序\n\
    -   **浏览所有文档**\n    在 Synaptic 中，你可以浏览和阅读与软件包或程序相关的所有可用在线文档\n-   **轻松查找程序**\n\
    \    Synaptic 使你可以轻松地按名称、描述、版本甚至按开发人员来定位软件包和程序\n\n"
