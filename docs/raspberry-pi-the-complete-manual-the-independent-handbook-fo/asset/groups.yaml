    # Control your Raspberry Pi-powered car


    Control a toy car with a smartphone and the latest web technologies


    Now that we have our fantastic Raspberry Pi-powered car all wired, charged and
    ready to go, it''s time to make it come alive. We''re using the best web technologies
    that the JavaScript programming language offers, to harness the natural movement
    of your hand and wirelessly drive the vehicle.


    Each little movement of your hand will trigger an event that calculates what the
    car should do and then sends it over a socket connection. If all goes to plan
    you should have complete control over your vehicle!


    > **Did you know...**

    >

    > Our code will send instructions to our car over twenty lines at second. It will
    do 50 requests a second.


    ## Download and install the software


    **01** First of all, you will need to find the I2C connectivity working. Next
    we''ll need to find a home for our new project code – how about `/var/www/picarc`?
    Type `sudo mkdir /var/www/picarc` in the terminal to make the directory and then
    change into that directory. `cd /var/www/picarc`


    Now, to download the project using Git, type `sudo git clone http://github.com/shaunk/picarc`.
    If you haven''t got Git, install it with `sudo apt-get install git`.


    This will download the custom software for driving the car, but we still need
    the web server and some other bits before we can start burning rubber...


    ![](img/f11b7dbb71886af07ef87126037ebe98_113_0.png)


    *All you need to finish off your project is access to a smartphone or tablet*


    ## Download and install Node.js


    **02** Next we''re using Node.js and its package tool, the Node package manager
    (npm). Type `sudo wget http://nodejs.org/dist/v0.10.21/node-v0.10.21-linux-arm-pi.tar.gz`.
    This will download a fairly recent version of Node.js - the version Raspberry
    has in its repositories is way too old and just doesn''t work with the new technologies
    we''re about to use. Extract the node package by typing:


    ```

    sudo tar --xzvf node-v0.10.21-linux-arm-pi.tar.gz

    ```


    > *You need to adjust some of the variables to control your particular remote
    controlled car setup*


    ![](img/f11b7dbb71886af07ef87126037ebe98_114_0.png)


    ## Configure Node.js


    **03** To make it easy to run from everywhere, we will create symbolic links for
    Node and npm binaries. Type `sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/node
    /bin/node` and then `sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/npm /bin/npm`.
    Then, to get the extra modules, type `npm install socket.io node-optimist socket.io-adapter`
    and `sudo npm install -g node-optimist`.


    ## Get to know the project


    **04** Now we have everything, you should see three files: the client (app.js),
    the server (socket.html) and the jQuery JavaScript library for the client. The
    server not only drives the servos, but it is a web server and sends the socket.html
    file and jQuery to the browser when requested - it''s a really neat and simple
    serve app. That''s right for what we''re trying to achieve.


    ## Test the servos


    **05** Our handy little program (app.js) has a special mode just for testing.
    We use two keys for both beta for servo 0 (steering) and gamma for servo 1 (motor
    control). Type `node app.js beta=300`. You should see the front wheels turn. Now
    the numbers need experimenting with. On our example, 340 was left, 420 was centre
    and 470 was right. Do the same for the motor by typing `node app.js gamma=400`
    and take note of the various limits of your car.


    "We''re using the best web technologies that the JavaScript programming language
    has to offer"


    ![](img/f11b7dbb71886af07ef87126037ebe98_115_0.png)


    ## Configure sensible defaults


    **06** Now you know what your car is capable of


    ## Going for a spin


    **07** We’re almost ready to try it out, but you need to know the IP address of
    your Pi car, so type ifconfig at the terminal. Then fire up the app by typing
    node app.js. Now grab your nearest smartphone or tablet, making sure it’s on the
