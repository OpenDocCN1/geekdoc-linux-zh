    ## Gently does it


    **07** You can see for yourself just how well the Pi fits here; it can be squeezed
    under the memory card slot. If you want to hold it firmly in place, use some Blu-tak
    as a temporary solution. Also, if you’re using an older controller, it’s worth
    giving it a bit of a clean. Remove the rubber contacts and gently swab under them
    using the isopropyl alcohol swabs.


    ## Fitting


    **04** If you’re using a different controller, double-check that the Pi is likely
    to fit inside before you crack it open. As you’ll see here, the Pi nestles neatly
    between the triggers of this controller – the original Xbox controller is one
    of the largest.


    ## Cut to fit


    **08** Depending on the model of controller, you may find that the Pi blocks one
    of the internal plastic struts. The plastic is soft enough that a craft knife
    will easily cut it down to size, though. Start with small strokes, shaving off
    a tiny bit at a time until you have enough room. Make sure the plastic dust is
    cleaned out before you reassemble the controller. If you have a can of compressed
    air, you can use it to easily blow away the shavings.


    ## Connecting it up


    **09** If you''re using a controller that has a regular USB port on it, you can
    just plug it into the Pi via a USB-OTG converter. If you''re using the original
    Xbox Controller, it''s slightly trickier. Microsoft, in its infinite wisdom, has
    decided that the original Xbox should use USB - but with an incompatible plug
    design. This means, in order to connect the controller to the Pi, we need to do
    some wire stripping. Fun!


    The wiring inside the Xbox controller''s cable uses bog-standard USB wiring colours,
    so once you''ve chopped the plugs off the controller and the OTG cable, it''s
    pretty straightforward to connect them together.


    ![](img/f11b7dbb71886af07ef87126037ebe98_120_0.png)


    | Color | Description |

    | :--- | :--- |

    | **White** | This wire is one of two used for differential data signals. This
    white wire is the positive component and the green wire is the negative one. |

    | **Red** | The red wire is one of two handling power. This one is a 5V power
    line that provides voltage to the circuit. |

    | **Green** | The circuit can get the difference between the two data signals
    rather than between a single wire and ground - it''s a more effective transmission
    method. |

    | **Black** | This is the other wire associated with the power: the ground wire,
    which is the counterpart to the 5V wire. |

    | **Yellow** | USB mini/micro cables will also have an additional wire that isn''t
    required for our particular project. |


