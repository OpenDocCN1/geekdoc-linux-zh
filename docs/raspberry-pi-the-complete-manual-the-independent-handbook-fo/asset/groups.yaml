    # # Pi 3 & Pi Zero guides


    # # Raspberry Pi


    # ## The Complete Manual


    +   - **Introducing the Pi 3 & Pi Zero**

    +   Find your way around the latest and greatest additions to the Raspberry Pi
    family


    +   - **Set up your Pi**

    +   Make sure you have the essential kit and the know-how to get started straight
    out of the box


    +   - **Master Raspbian**

    +   Get comfortable using the official Raspberry Pi operating system by following
    simple guides


    +   - **Understand applications**

    +   Everything you need to know about the best applications included with the
    Raspberry Pi


    +   - **Get to grips with Linux**

    +   Learn how to use common Linux applications and master the command line basics


    +   - **Get started with programming**

    +   Navigate the world of Scratch and Python programming through easy-to-follow
    tutorials


    +   - **Take control with your Pi**

    +   Use the GPIO pins on your Raspberry Pi to control lights, switches, and more


    +   - **Create a wireless hotspot**

    +   Access the Internet anywhere by refreshing your Raspberry Pi to your Android
    devices


    +   - **Build & Code with the web**

