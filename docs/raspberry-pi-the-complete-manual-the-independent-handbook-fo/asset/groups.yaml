    ## 项目


    ### 制作一个由树莓驱动的数码相框


    #### 你需要准备……


    - 安装 Raspbian Jessie 的树莓派 2 或 3

    - Wi-Fi 适配器（如果使用树莓派 2）

    - 显示屏（推荐使用官方 7 英寸触摸屏显示）

    - 十字螺丝刀

    - 框架和/或支架（官方触摸屏显示器在 Pimoroni 及其他专用树莓派硬件和配件供应商处有可用的框架选项）

    - 脚本 https://github.com/samuelk/Raspberry-Pi-Photo-Frame


    使用树莓派打造你自己的可全配置数码相框，配备触摸屏显示器。


    显示精选爱好的数码相框曾一度流行，但现在似乎只有在订阅杂志时作为赠品才能获得。这些类似平板电脑的设备曾经常带来有趣的话题，但常常因内存小、用户界面差或两者兼而有之而逊色。


    ![](img/f11b7dbb71886af07ef87126037ebe98_105_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_106_0.png)


    在这个项目中，我们不必担心上述任何问题。我们将设置树莓派并安装一些照片显示软件，连接触摸屏显示，将其放入合适的支架中，然后坐享其成。更棒的是，通过这种设置，我们可以从一系列在线和离线来源获取图像，让我们有一些很好的变化。


    ### 准备你的树莓派


    01 如果你确保无线局域网已设置并启用 SSH，在这个项目中你将节省大量时间。两者都可以通过 Raspbian Jessie 桌面完成——你可以在 菜单 >
    偏好设置 中找到新的树莓派配置工具，其中你可以在 接口 选项卡中启用 SSH。


    ### 连接显示


    02 在桌面上铺一块毛巾以避免划伤，将树莓派连接到 7" 触摸屏显示背面，确保线缆正确连接。（旧版本需要你也连接和安装显示板）。用螺丝固定，然后安装到支架上。


    ![](img/f11b7dbb71886af07ef87126037ebe98_106_1.png)


    > **你知道吗……**

    > 你在使用树莓派相框上展示照片时不必感到受限。存在各种选项从流行的网络服务（如 Flickr 或 Facebook）中下载图片。为此，你需要一个专门的 Python
    脚本，已经为你编写好了。前往 Samuel Clay 的 GitHub 下载它们，但在确认脚本可用之前，不要将脚本添加到 rc.local 中。


    > "设置树莓派并安装一些照片显示软件"


    ![](img/f11b7dbb71886af07ef87126037ebe98_107_0.png)


    ### 准备你的照片


    03 显然，你需要收集一批数字照片来展示在树莓派驱动的数码相框中。我们有不同的选择（参见侧边栏，第 107 页），但我们建议从存储在树莓派上的照片开始，例如通过
    USB、网络驱动器或通过浏览器下载的照片。


    ```bash

    sudo nano /etc/lightdm/lightdm.conf

    ```


    ### 设置你的树莓派相框


    04 为了将树莓派配置为相框，我们首先需要防止屏幕关闭。这意味着需要编辑 lightdm.conf 文件。


    在 `[SeatDefaults]` 下方添加这行：


    ```

    xserver-command=/usr/bin/Xwrapper -n 0 -dpms

    ```


    完成后，使用 Ctrl+X 保存并退出，然后重启：


    ```bash

    sudo reboot

    ```


    ### 安装 feh


    05 图像查看软件 feh 是构建简单树莓派相框的最佳选择，因此安装这个。


    ```bash

    sudo apt-get install feh

    ```


    安装完成后，指定 feh 查找图片的位置，将 `/media/STORAGE/test` 更改为你的目录路径，例如：


    ```bash

    DISPLAY=:0.0 XAUTHORITY=/home/pi/.Xauthority /usr/bin/feh -p -Z -F -R 60 -Y -D
    15.0 /media/STORAGE/test

    ```


    > "显然，你需要收集一批照片来展示在树莓派驱动的数码相框中"


    ### 保存脚本


    前面的脚本应该会使树莓派相框开始展示指定文件夹中的图片，每张展示 15 秒。为了强制它在启动时启动，我们需要将它添加到脚本中。


    用以下命令创建：


    ```bash

    sudo nano /home/pi/start-picture-frame.sh

    ```


    添加以下内容：


    ```bash

    #!/bin/bash

    DISPLAY=:0.0 AUTHORITY=/home/pi/.Xauthority /usr/bin/feh -q -- -Z -X 18 -Y 15.0
    /media/STORAGE/test

    ```


    退出并保存，然后用以下命令测试：


    ```bash

    bash /home/pi/start-picture-frame.sh

    ```


    ### 让相框在启动时运行


    现在可以将脚本设置为在启动时运行。打开


    ```bash

    sudo nano /etc/rc.local

    ```


    ... 在 `exit 0` 之前添加


    ```bash

    sleep 10

    su - pi -c ''/bin/bash /home/pi/start-picture-frame.sh''

    ```


    保存并退出。


    ### 重启树莓派并测试


    现在你几乎完成了！要测试它，使用常用的 `sudo reboot` 命令重启树莓派，并检查设备是否直接进入相框模式。如果你遇到任何问题，检查你是否正确输入了命令，并且是否在
    lightdm.conf 和 rc.local 中在正确位置。


    ### 停止相框


    如果你在任何时候需要停止相框软件，可以用以下简单命令完成：


    ```bash

    sudo pkill feh

    ```


    只要你为相框准备的图片不会占用太多磁盘空间，它们应该可以无问题加载。


    > **你知道吗……**

    > 同样的脚本集合还包括一个名为 `pi.pi` 的文件，当与运动检测模块一起使用时，当有人移动相框时会打开显示。合适的红外运动传感器模块只需几英镑，应连接到树莓派的
    GPIO。将标记为 VCC 的引脚连接到树莓派的 GPIO 2 引脚，GND 连接到 GND，Out 连接到 GPIO 4。


    ![](img/f11b7dbb71886af07ef87126037ebe98_108_0.png)


    ### 构建一个树莓派驱动的玩具车


    #### 你需要准备……


    - 一个双通道（转向和驱动）的玩具遥控车

    - Adafruit PWM I2C 伺服驱动器

    - 母对母跳线

    - 5V 电池充电宝


    预计成本：£60 / $100

    组件来自 www.modmypi.com


    利用最新的网络技术，用智能手机或平板电脑控制遥控车…… 35


    ![](img/f11b7dbb71886af07ef87126037ebe98_109_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_110_0.png)


    > **你知道吗……**

    > 这个项目几乎可以用任何遥控车完成！按照指南了解更多细节。


    网络技术正以惊人的速度前进；云技术将大众计算带给了个人，而硬件已经到了一个完美的时刻，传感器、显示屏和无线技术都进化成了高效且可负担的设备。我们真正处于一个几乎任何人都可以用一周时间和极低成本将想法从无到有变成可行产品的阶段。就像这个项目，有趣、快速且易于扩展，是一个极佳的学习途径。我们将获取一个旧的遥控车，拆除其无线电接收器并用树莓派替换，将其接入网络，启动一个前沿的
    web 服务器，然后用你的智能手机或平板电脑通过倾斜设备来控制它。到这里结束时，你不仅拥有一个有趣的玩具，还了解到了支撑世界新兴和最大经济体未来相当长时间的基本技术。


    ### 树莓派控制汽车的制作过程


    为了帮助我们用最新的网络技术和我们信用卡大小的电脑让玩具车“活”起来，我们需要对其工作方式做出一些重大修改。幸运的是，最复杂的构建部分可以通过两项可负担的购买实现，即一个伺服控制器板来处理转向和油门，以及一个
    5V 电池组以确保树莓派平稳运行。


    ### 识别并移除旧无线电


    01 这个项目实际上是在替代汽车的标称发射器和接收器。注意原始接收器上的三个插座：一个通向电机控制器，一个通向转向伺服。一些遥控车也有独立的电池供电子部分使用，但这些（尤其是带
    BEC 的电子速度控制器）直接从速度控制器获取 5V 电源，节省了组件。


    如果你的速度控制器没有 5V BEC，你需要在其他地方获取 5V 电源。许多商店出售 5V 电池电源——通常作为手机应急充电，www.modmypi.com
    售价 20 英镑以下有合适的 5V 电池充电宝，你的树莓派应该能使用几个小时。


    ![](img/f11b7dbb71886af07ef87126037ebe98_111_0.png)


    > **电源**

    > 5V 电池组使我们的树莓派运行五个小时以上


    ### 伺服控制


    Adafruit PWM I2C 伺服驱动板，来自 www.modmypi.com


    ### 树莓派驱动


    树莓派装在前面中央，尽量保护它


    ### 选择一辆车


    你可以使用几乎任何可负担的汽车进行这个项目


