    14 当点击绿色旗帜开始游戏时，Grow 被设置为 1，以便蛇获得较短的身体。将画笔抬起并移动到舞台中心，并将画笔配置为绘制与舞台背景颜色和大小相同的轨迹，以便擦除身体。


    #### 生长和移动


    15 使用“永远”命令来保持尾部移动。如果 Grow 为 1，它应暂停并将 Grow 重置为 0——这会使身体变长。使用 Next Direction 中的第一个值来设置方向，并移除该值，以便下次获得新值。移动
    Speed 步。


