    ## Tether to an Android device


    What you do also usually have with you is an internet-connected magic pocket box
    called a smartphone that you can connect the Pi to.


    ![](img/f11b7dbb71886af07ef87126037ebe98_68_0.png)


    ### Check connection


    01. Your Android device will create an interface known as `eth0` on the Raspberry
    Pi. You can check to make sure this is happening, and that it will let you tether,
    by opening up a terminal and typing the following:


    ```

    ifconfig

    ```


    ### Quick connect


    05. You can connect from the terminal right now to access the Internet. You should
    be able to do this by typing the following into the terminal:


    ```

    sudo dhclient usb0

    ```


    This will automatically grab any available IP address that your phone will give
    to it.


    ### Test connection


    06. There’s a few ways to test your connection. We’d usually stay in the terminal
    and `ping www.google.com`, which you can do, or you can click on the browser and
    see if it loads the page.


    ![](img/f11b7dbb71886af07ef87126037ebe98_68_1.png)


    ### Save the settings


    07. Once you reboot your Raspberry Pi, it won’t remember to automatically connect
    to the phone’s tether. However, we can add an entry to its config so that it will
    try and do this in the future. From the terminal, use:


    ```

    sudo nano /etc/network/interfaces

    ```


    ### Interface settings


    08. Here you’ll find all the current network settings – yours might look different
    from ours depending on if you have added any fixed wireless settings or passthroughs.
    Using the same syntax as at the `eth0` line, add:


    ```

    iface usb0 inet dhcp

    ```


    ### Tether on the go


    09. After a save and reboot, your Pi should now automatically connect to your
    phone, whether it’s via Wi-Fi hotspot or a physical connection. It may draw a
    little more charge than usual while tethering, so be sure to keep an eye on your
    battery level.


    ## Projects


    # Add a battery pack to your Raspberry Pi


    ### What you''ll need...


    - AA battery box by PTC02615

    - 3-amp UBEC by TH61027

    - 3-amp terminal strip

    - 6x AA rechargeable batteries


    ![](img/f11b7dbb71886af07ef87126037ebe98_69_0.png)


    Don''t leave your Raspberry Pi behind – incorporate it into mobile projects by
    powering it up using humble AA batteries.


    Your Raspberry Pi''s mobility is usually restricted by the length of the power
    lead. Rather than limiting it to your desk or living room, however, you can use
    it for mobile projects as diverse as launching it into near-Earth orbit or monitoring
    and automating your garden.


    Of course, to do this you will need batteries, but adding battery power to your
    Raspberry Pi is simpler than you might have imagined. All that is required are
    six rechargeable AA batteries (or single-charge alkaline), a battery box with
    space for the batteries and a UBEC. The latter is a Universal Battery Eliminator
    Circuit, a voltage regulator that will regulate the power supply and prevent damage
    to the Raspberry Pi, and can be bought for under £10.


    ![](img/f11b7dbb71886af07ef87126037ebe98_70_0.png)


    > "You can use your device for mobile projects as diverse as launching it into
    near-Earth orbit"


    ### Make your order


    01. If you''re buying your components online, you should be able to get them all
    within five days. However, if you''re ordering offline (specifically the UBEC),
    you should avoid traditional electronics stores and instead visit a model enthusiast
    store, as these circuits are regularly used in RC devices.


    ### Check your UBEC


    02. Two types of UBEC are available to choose from. If you used the store that
    we suggest in the resources box to the left, you''ll receive one with a micro
    USB power connector for easy connection to your Raspberry Pi. However, if you
    bought one from eBay then there is a strong chance that you will receive one with
    a 3-pin connector.


    ![](img/f11b7dbb71886af07ef87126037ebe98_70_1.png)


    ### Move connector pins


    03. In order to use the UBEC with a 3-pin connector, you''ll need to alter the
    position of the pins so that they occupy the two outer slots. Just use a small
    jeweller''s screwdriver to lever up the small plastic catch and remove the red
    wire from the central slot, before sliding it into the unoccupied outer slot.


    ### Connect to battery box


    04. With five batteries in the battery box, connect it to the UBEC (red-to-red,
    black-to-black) by twisting the wires, soldering or employing a 3-amp terminal
    strip, cut down to two pairs. It can be cut to size using a modelling knife.


    ### Add a battery to boot


    05. With your Pi ready to use and your Wi-Fi bridge plugged in, connect the UBEC
    to the micro USB port and insert the single battery into the battery box. The
    Pi''s power and status lights should indicate that the computer is booting up,
    which gives you a fully portable computer.


    ### Connect the 3-pin UBEC


    06. If you purchased the UBEC with the now-modified 3-pin connector, you''ll need
    to connect this to the Raspberry Pi''s GPIO header. Connect the positive +5V (red)
    connector to Pin 2 and the negative 0V connector to Pin 6.


    ### Measure uptime


    07. You should have already set up your Pi for SSH use, so connect to the device
    via Putty (giving it time to boot fully if it hasn''t). In the terminal, enter:


    ```

    sudo uptime

    ```


    This command will display the system uptime and also keep the Wi-Fi connection
    active.


    ### Judge your uptime results


    08. Uptime results depend upon the battery you use and the Raspberry Pi model.
    Single-charge batteries will last a little bit longer, but this is a more expensive
    option. Meanwhile, newer models have greater power requirements but run for less
    time. For more power, add more batteries!


    ### Power extreme!


    09. More batteries added in parallel should result in almost double the uptime
    (at least 16 hours on a 250mW Raspberry Pi Model A), but instead of alkaline or
    rechargeable batteries you might consider a modern lithium-based AA cell, which
    will last considerably longer than alkaline batteries.


    ## Projects


    ### What you’ll need...


    - Bare Conductive paint (pen or tub)

    - Male to female jumper wires

    - An assortment of LEDs, switches and resistors (optional)


    # Draw circuits with paint


    Assembling circuits has never been so easy with the joys of conductive paint,
    enabling you to bring together art and electronics in a whole new way.


    Playing with electronics and physical computing is a very rewarding task. For
    a beginner though, the mess of wires and components can become very confusing
    quite quickly and things like soldering can be a safety concern when children
    are involved. **Bare Conductive** has taken the joy of electronics and made it
    far safer, easier and more versatile with their conductive paint. You can literally
    draw wires on paper with a paintbrush, use it for cold-soldering or as a conductive
    adhesive and much, much more. There are not a great deal of boundaries to what
    you can do. Pair this paint with a microcontroller board and you could be creating
    interactive art, clothing and projects in no time.


    ### Get your tools


    01. Paint and a paintbrush aren’t the first items that come to mind when you think
    about electronics, so you may be wondering where to get them from. Bare Conductive
    stock the paint and a selection of components in their shop (bareconductive.com/shop)
    but you will need to go somewhere else for art supplies. We would recommend trying
    a high street craft shop such as lizbycraft.hobbycraft.co.uk or a local independent.


    ![](img/f11b7dbb71886af07ef87126037ebe98_71_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_72_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_72_1.png)


    > "The mess of wires and components can become very confusing"


    ### Pick your platform


    02. The great thing about Bare Conductive paint is that, when dry, it works just
    like normal wiring!


    That means you can use it with any of your favourite microcontrollers like the
    Bare Conductive Touch Board, a Raspberry Pi or Adafruit’s wearable FLORA platform.
    Or you can just use some small pin batteries and flashing LEDs for a standalone
    system.


    ### Start to paint


    03. You can paint Bare Conductive paint onto pretty much any surface -- paper,
    fabric, walls, clothing, wood, plastic and much more.


    For really accurate shapes and results, the best idea is to create or purchase
    a stencil (paper stencils are easiest to make at home but use vinyl for the best
    edge finish).


    ### Connect it up


    04. There are plenty of ways to connect to the conductive paint (from battery
    packs for example) no matter what surface it’s on, because once it is dry it acts
    just like an insulated wire.


    Therefore you can use wires glued on with the paint, paper clips, bulldog clips,
    alligator clips or even sew-in-conductive snaps for wearable projects.


    ### Make repairs


    05. The conductive paint is thick and when it’s dry it becomes quite strong. This
    means you can use it to cold solder things together and repair any breakages.


    In other words, you could glue components into a circuit board or glue wires together
    and they would still function electrically.


    ### Clean up


    06. A lot of you are probably thinking that something as cool as conductive paint
    is going to be nasty stuff. Actually Bare Conductive paint is non-toxic, water-based
    and water-soluble, and can therefore be cleaned easily with soap and water.


    ### Make it waterproof


    07. This paint only comes in black and is not waterproof.


    However, the great thing is that you can use it underneath or alongside any regular
    paints, varnishes and waterproofing sprays in order to act as insulation -- or
    just to add some colour into your design!


    ![](img/f11b7dbb71886af07ef87126037ebe98_72_2.png)


    ### Touch and sound


    08. Bare Conductive paint can also be used as a capacitive surface, meaning you
    can use it for touch, gesture or proximity controls when it is paired with a suitable
    control board. Bare Conductive make their own called the Touch Board which has
    everything you need to start experimenting with touch and sound. It can even act
    as a MIDI controller, an interface or an instrument!


