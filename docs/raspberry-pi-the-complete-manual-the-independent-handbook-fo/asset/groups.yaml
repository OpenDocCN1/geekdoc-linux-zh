    \ port.\n+   \n+   **Pi revision 1 or 2?**\n+   02 Depending on when you purchased\
    \ your Pi, you may have a revision 1 or revision 2 model. The GPIO layout is slightly\
    \ different for each, although they do have the same functionality. Here we have\
    \ a revision 1; revision 2s became available towards the end of 2012.\n\n# Pin\
    \ numbers\n\n+   03 If you take a look at the top left of the board you will see\
    \ a small white label, P1. This is pin 1 and above it is pin 2. To the right of\
    \ pin 1 is pin 3, and above 3 is 4. This pattern continues until you get to pin\
    \ 26 at the end. As you'll see in the next step, some pins have important uses.\n\
    +   \n+   **Pin uses**\n+   04 Pin 1 is 3V3, or 3.3 volts. This is the main pin\
    \ you will be using in this guide to provide power to our LED. Pins 2 and 4 are\
    \ 5V. Pin 6 is the other pin we will use here, which is ground. Other ground pins\
    \ are 9, 14, 20 and 25. You should always ensure your project is properly grounded.\n\
    \n# GPIO pins\n\n+   05 The other pins on the board are GPIO (General Purpose\
    \ Input/Output) These are used for other tasks that you need to do as your projects\
    \ become more complex and challenging. Be aware that the USB power supply doesn't\
    \ offer much scope for powering larger items.\n+   \n+   **Basic LED lighting**\n\
    +   06 Okay, so let's get down to business and start making something. Firstly,\
    \ get your breadboard, two wires, a 220Ω resistor and an LED. Note the slightly\
    \ bent leg on one side of the LED, this is important for later on. Make sure your\
    \ Pi is unplugged from the mains supply."
  - "[PAGE 59]\n\n# Control an LED using GPIO\n\n# Wiring the board\n\n07 Plug one\
    \ wire into the number 1, pin, and the other end into the breadboard. Note that\
    \ it doesn't matter where on the breadboard you plug it in, but make sure there\
    \ are enough empty slots around it to add the LED and resistor to. Now get another\
    \ wire ready.\n\n# Add another wire\n\n08 Place the female end of the wire into\
    \ pin number 6 (ground) and the other end into the breadboard, making sure to\
    \ leave room for the resistor, depending on how large it is. Next, get your resistor\
    \ ready. You can use a little higher or lower than 220 ohms, but not using a resistor\
    \ at all will likely blow the LED.\n\n# Add the resistor\n\n09 Next we need to\
    \ add our resistor. Place one end next to the ground wire on the breadboard, and\
    \ the other one slot below the 3V3 wire connection. This will sit next to the\
    \ LED when we add it in a second. Note that there is no connect or incorrect way\
    \ to add a resistor.\n\n# Add the LED\n\n10 Grab your LED and place the 'bent'\
    \ leg end next to the 3V3 wire in the breadboard. Place the other leg next to\
    \ the resistor leg opposite the ground wire. This now completes the circuit and\
    \ we are ready to test out our little task.\n\n# Power it up\n\n11 Now get your\
    \ micro-USB5 socket and either plug the mains end into the wall, or plug it into\
    \ a computer or laptop port (and powered on). You should see the LED light up.\
    \ If not, then check your connections on the breadboard or try, or a different\
    \ LED.\n\n\n\n# Set up programming environment\n\n12 Now, we need to be able to\
    \ do a little bit more than just turn a light on – we want to be able to control\
    \ it via code. Set up a new Raspbian installation (a guide to this is found on\
    \ page 28). You don’t need a GUI for this – it can all be done via the terminal\
    \ if you so wish. Before starting, it’s best to check everything is up to date\
    \ with:\n\n```\n```bash\nsudo apt-get dist-upgrade\n```\n```\n\n# Open up terminal\n\
    \n13 Assuming we want to use the GUI, rather than SSH into the Pi, open up a newx\
    \ terminal window, by double-clicking on the LXTerminal icon. We need root access\
    \ to control the LEDs, so either enter su now, or remember to prefix any commands\
    \ with sudo.\n\n```\n```bash\nsu\nsudo\n```\n```\n\nsudo, followed by password\
    \ or add it to the start of each command\n\n# Download GPIO library\n\n14 There\
    \ is a handy GPIO Python library that makes manipulating the GPIO pins a breeze.\
    \ From within your terminal window, use wget to download the tarball file, then\
    \ extract it using tar. This will give us all the files in a new directory.\n\n\
    ```\n```bash\nwget https://pypi.python.org/packages/source/R/RPi.GPIO/RPi.GPIO-0.5.2.tar.gz\n\
    tar zxf RPi.GPIO-0.5.2.tar.gz\ncd RPi.GPIO-0.5.2a\n```\n```\n\n# Install the library\n\
    \n15 Now we need to install the library. This is simply a case of using Python’s\
    \ install method, so we need the dev version of Python. Make sure you are in the\
    \ directory of the library before running this command.\n\n```\n```bash\nsudo\
    \ apt-get install python-dev\nsudo python setup.py install\n```\n```\n\n# Import\
    \ the library in a script\n\n16 Create a new Python script. Next import the main\
    \ GPIO library and we’ll put it in a try-except block. Save the file using Ctrl+X\
    \ and choosing 'yes'.\n\n```\n```bash\ncd /\ncd Desktop\nsudo nano gpio.py\ntry:\n\
    \    import RPi.GPIO as GPIO\nexcept RuntimeError:\n    print('Error importing\
    \ GPIO lib')\n```\n```"
