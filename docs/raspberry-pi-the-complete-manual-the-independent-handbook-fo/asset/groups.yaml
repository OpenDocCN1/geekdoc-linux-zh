    > SSH 是远程访问任何机器最安全的方法。它比 VNC 更快。


    正如我们在前一页所展示的那样，虽然远程登录完整的 X 环境非常有用，但它也有缺点。首先，这并不特别快捷或方便。用户体验也可能缓慢且笨拙，但最糟糕的是，它没有我们希望的那样安全。


    如果你想要一种更便捷和安全的方式来从另一台电脑访问你的树莓派，你会发现所有经验丰富的树莓派爱好者都会使用 SSH。SSH 代表 Secure Shell（安全外壳），是一种旨在确保通过命令行进行安全数据通信的加密网络协议。


    尽管初学者可能会争辩说使用完整的图形界面远程访问树莓派更容易，但一旦你学会了一些基本的命令行技巧，你就会很快发现通过 SSH “潜入”你的树莓派是远程与它交流的最便捷方式。


    你会很高兴地听到，SSH 已经经过良好的出厂配置——你几乎不需要做任何事情就能让它工作，特别是如果你的远程计算机运行 Linux 或 OS X，正如我们将要演示的那样。


    #### 使用 Linux 和 OS X 配置 SSH 很简单


    假设你的树莓派已开启并通过以太网或 Wi-Fi 适配器连接到网络，你唯一需要的信息是你树莓派的 IP 地址。要发现这一点，你只需在树莓派上打开一个终端窗口并输入命令
    ifconfig（图 1）。


    如果你是通过以太网线缆连接的，你会看到 ''eth0''，然后是几行结果。IP 地址将是 ''inet addr'' 字样旁边的第二行数字。如果你是通过 Wi-Fi
    连接的，结果将在 ''wlan0'' 的第二行。IP 地址本身是由句号分隔的四组数字。如果你在你的家庭网络上，它可能类似于 192.168.0.15。我们将使用这个数字作为指南，但请将其替换为你通过
    ''ifconfig'' 看到的 IP 地址。


    ![](img/f11b7dbb71886af07ef87126037ebe98_45_0.png)


    图 1 在终端中使用 ifconfig 命令来发现树莓派的 IP 地址


    拿到这个信息后，你只需在远程 Linux 电脑上打开一个终端窗口并输入：


    ```

    ssh pi@192.168.0.15

    ```


    这假设你的树莓派用户名仍然是默认的（即 ''pi''），并且你用刚才记下的 IP 地址替换了其中的 IP 地址。如果你添加了用户账户或更改了默认值，你需要将
    ''@'' 前的用户名替换为你更改后的内容。当你按下 Enter 键时，系统会提示你输入树莓派的密码——同样，如果是默认密码你可以输入 ''raspberry''，否则输入你的树莓派密码并按下
    ''Return''（回车键）。


    现在你会看到命令行上的用户名详细信息已更改以反映你的树莓派的信息——你现在已远程连接。试着浏览你的文件或使用 nano 打开一个文件进行编辑！


    #### 永远不用再输入 IP 地址


    当然，如果你把你的树莓派带到另一个网络，你树莓派的 IP 地址将会不同。如果你只是想远程连接它，为了获取 IP 地址而为一台电脑设置键盘、鼠标和显示器就变得极其麻烦。如果你能直接在终端中输入树莓派的名称来连接，那不是更容易吗？听起来好得不像真的，但这实际上很容易做到。


    你只需要一个小的软件，它有效地让你通过名称而不是 IP 地址来发现本地网络中的主机和服务（图 2）。要在树莓派上设置它，你只需打开终端并输入：


    ```

    sudo apt-get install avahi-daemon

    ```


    安装完成后，你只需在终端中输入以下内容即可通过 SSH 访问你的树莓派：


    ```

    ssh pi@raspberrypi.local

    ```


    此外，当你通过其他任何形式的网络访问它时，你也可以使用树莓派的名称，无论是 Samba、远程登录还是 VNC 或其他！


    ![](img/f11b7dbb71886af07ef87126037ebe98_46_0.png)


    #### 使用 Windows 配置 SSH


    正如 Windows 世界中的大多数事情一样，使用微软操作系统访问树莓派并不像你想象的那么简单。幸运的是，有一个有用的工具可以帮助你。PuTTY 允许你建立安全外壳连接，并且它易于设置和使用。你可以从以下地址下载
    PuTTY：www.chiark.greenend.org.uk/~sgtatham/putty/


    ![](img/f11b7dbb71886af07ef87126037ebe98_46_1.png)


    ### 你将需要

    - Scratch

    - 互联网连接


    > **你知道吗**

    >

    > Scratch 的网站 www.scratch.mit.edu 包含许多其他用户制作的程序和游戏。


    ### Scratch 工作室项目


    #### 01 在 Studio 顶部有三个快速访问图标和主菜单（图 2）。


    第一个地球样式的图标用于设置 Studio 的语言。另外两个按钮提供对项目保存和共享功能的快速访问。


    在 ''File''（文件）菜单下，有一组典型的文件管理功能，用于打开、保存和导入 Scratch 项目。还有一个 ''Project Notes''（项目笔记）选项，我们可以在此输入功能描述和评论。


    ''Edit''（编辑）菜单包含各种动画、图像和音频编辑工具。而 ''Help''（帮助）部分提供对浏览器托管的帮助页面的访问。


    有趣的是，''Share''（共享）菜单允许我们与全世界分享我们的项目。任何 Scratch 项目都可以通过 ''Share This Project Online...''（在线共享此项目...）选项和
    ''Upload To Scratch Server''（上传到 Scratch 服务器）表单（图 3）发布到 Scratch 社区网站。


    #### 使用 Scratch 编程


    一份关于使用树莓派图形化编程语言进行编程的交互式指南


    你想深入动画和游戏创作的世界吗？你想让你的创意想法成真，而无需学习软件开发语言吗？使用 Scratch，你可以做到所有这些，甚至更多。


    Scratch 1.4 已预装在官方 ''Wheezy'' Raspbian 操作系统镜像上。如果你的树莓派尚未安装 Scratch，不用担心，只需前往官方
    MIT Scratch 网站查找下载和安装说明。


    要开始，我们只需打开 Scratch Studio。点击桌面上的 Scratch 猫图标，或在 LXDE 桌面菜单中找到 Scratch。


    Scratch Studio 是一个完整的开发环境。它分为多个独立的窗格。每个窗格在应用程序构建过程中都有特定的角色，以及自己特定的一组功能和工具。


    让我们加载 ''Aquarium''（水族馆）示例项目。从 ''File''（文件）菜单中选择 ''Open... ''（打开...）选项，显示 ''Open
    Project''（打开项目）对话框。从左侧的大按钮列表中，点击名为 ''Examples''（示例）的那个。然后在右侧，双击选择 ''Animation''（动画）文件夹。接着选择
    ''6 Aquarium'' 项。打开对话框窗口中的内容应如图 4 所示。


    加载水族馆项目后，我们的 Scratch Studio 应类似于图 1。我们将从暂存区开始我们的 Studio 之旅。


    ![](img/f11b7dbb71886af07ef87126037ebe98_47_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_0.png)


    图 2：Scratch Studio 菜单 – Scratch Studio 的主菜单和快捷图标


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_1.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_2.png)


    图 3：项目共享对话框 – 我们可以使用 Studio 的共享菜单来共享我们的项目


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_3.png)


    图 4：文件打开对话框 – 使用 Studio 的文件菜单和打开...来加载水族馆项目


    #### Scratch 工作室舞台


    **02**


    舞台是所有动作发生的地方，位于 Scratch Studio 的右上方。


    舞台由称为 sprite（角色）的图形元素构成。在这里，我们有植物、气泡、鱼和其他生物。你还可以添加和创建自己的素材，但我们稍后再讲。


    在 ‘Staging Area’（暂存区）顶部，有一个绿色旗帜和一个红色圆圈。点击绿色旗帜让水族馆动起来。现在花一点时间研究水族馆的动画。注意生物的运动和上升的气泡。红色圆圈图标停止动作。


    我们可以使用位于绿色旗帜正上方的三个按钮来设置查看模式。


    左侧的两个按钮增加或减少暂存区面板的大小。较小的暂存区意味着与中央区域相比，其相对大小增加。


    右侧的按钮是演示模式，它以全屏模式显示舞台（见图 5）。通过左上角的弯曲箭头按钮或按 ‘esc’ 键退出演示模式。


    #### Scratch 工作室角色


    **03**


    暂存区下方是此项目的角色集合。 ‘Stage’（舞台）角色与其他角色分开。它与其他角色略有不同，充当舞台的背景图像。


    该区域顶部的三个按钮提供了创建新角色的各种方法。第一个按钮在绘图编辑器中打开一个空白画布。第二个按钮基于选定的图像文件创建一个新角色，通过弹出的文件选择对话框窗口进行选择。第三个将从预装的图像集合中选择一个随机图像。


    我们可以直接从舞台使用主菜单右侧的四个按钮来管理角色。在这里，我们点击特定的按钮，然后点击舞台上的一个角色。


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_4.png)


    图 5：舞台演示模式 – Studio 的舞台演示模式是查看项目的最佳方式


    '
