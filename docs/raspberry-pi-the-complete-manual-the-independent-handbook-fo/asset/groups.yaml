    # What you''ll need...


    Raspberry Pi downloads

    www.raspberrypi.org/downloads


    **Did you know...**


    True official distro for the Pi is called Raspbian. That''s what most versions
    start, but there are also legacy ones


    **Card speed**


    The speed class to get a reasonably fast SD card to keep your system running smoothly.
