  - '[PAGE 32]


    # # Update and upgrade


    +   1. Getting hold of a package on the Raspberry Pi involves dropping into the
    command-line terminal, via the LX Terminal icon on the desktop, and entering a
    few commands. But before we do that, we need to make sure the system is up to
    date. Enter the following into the terminal:


    ```

    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```

    or


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```

    ```


    # # Search for a package


    +   2. The apt-get command (Advanced Package Tool) is the key to downloading and
    installing packages on the Raspberry Pi. In the previous instance, we updated
    the existing packages and system, upgraded any that needed it, and updated the
    current package list. Now, let’s search the list of server packages for available
    games.


    ```

    ```

    apt-cache search game | less

    ```

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_32_0.png)


    # # Apt searching


    +   3. The current list you find yourself in is the name of all the packages labelled
    as ‘games’ from the available server. In the list, the part before the hyphen
    tells you the name of the package, which is what you will need to know to be able
    to install it. Use the arrow keys, up/down to navigate; press ''q'' to exit.


    # # Installing a package


    +   4. Using the up and down arrow keys, navigate the list. If you find something
    you like the look of, say Angry Drunken Dwarves, remember the name of the package,
    in this case ‘angrydd’, and press ''q'' to exit the list. To install the package,
    enter the following in the terminal:


    ```

    ```

    sudo apt-get install angrydd

    ```

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_32_1.png)


    # # Executing the package


    +   5. The result of the previous command should be the successful download and
    installation of the game, Angry Drunken Dwarves. To execute the newly installed
    package, you can either run it from the LXDE Menu under Games>Angry Drunken Dwarves,
    or by typing in the following into the terminal


    ```

    ```

    angrydd

    ```

    ```


    # # Remove a package


    +   6. This installing of packages is perfectly fine, and you can see just how
    powerful a command Apt really is. But, what if you want to remove a package? Using
    the Apt command again, let’s say we want to completely remove all traces of Angry
    Drunken Dwarves from the Raspberry Pi.


    # # Install and use packages


    # # Getting started


    # # Apt Easter eggs


    +   7. The Apt command is a short, no-mean-to-draw variant of the Aptitude command.
    This command has a long history in Linux, and as a result has some rather special
    features, also known as Easter eggs. Puerly for a little bit of fun, type in the
    following commands and see the results:


    ```

    ```

    aptitude moo

    aptitude -v moo

    aptitude -vv moo

    aptitude -vvv moo

    aptitude ~vvvv moo

    aptitude ~vvvvv moo

    sudo apt-get moo

    ```

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_32_2.png)


    # # Man the Apt command


    +   8. As you can see, there is more than what first meets the eye. There are
    many different sub-commands and variations in which to run them. If you want to
    see what else the Apt command can do, enter the following:


    ```

    ```

    man apt

    ```

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_32_3.png)'
  - '[PAGE 33]


    # Getting started


    # What you''ll need...


    **Synaptic:**

    www.congpu.org/synaptic/


    # Use graphical installations


    # Use graphical installations


    Would you prefer a graphical interface to install new programs? If so, then read
    on...


    If you''re new to Linux, you may find using its built-in Apt package management
    tool a bit intimidating and confusing. The apt-get command is used for installing
    applications through the internet, connecting to the remote servers – called repositories
    – which house the programs as packages. But it is used through the terminal command
    prompt, which can be daunting, so we need an alternative: a desktop environment
    interface method of getting hold of packages.


    This is where Synaptic comes in. Synaptic is a friendly-looking graphical interface
    to the apt-get terminal command which allows you to manage your application installations,
    and removals, through the already familiar desktop environment. Think of it as
    a kind of online shop where you can pick and choose the programs you want and
    have them downloaded and installed onto your Raspberry Pi without you having to
    drop into the terminal.


    ![](img/f11b7dbb71886af07ef87126037ebe98_33_0.png)


    +   * **Upgrade entire systems**

    +   Synaptic has the ability to update and upgrade every program or package, and
    it can upgrade your entire system to the latest version

    +   * **Install and more**

    +   Synaptic is a very powerful tool. With it you can install, remove, upgrade
    and downgrade single or multiple packages and programs

    +   * **Browse all documentation**

    +   Within Synaptic, you are able to browse and read all available online documentation
    related to a package or program

    +   * **Easily find programs**

    +   Synaptic enables you to easily locate packages and programs by name, description,
    version and even by who developed the program'
