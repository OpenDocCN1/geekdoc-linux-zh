    # 使用图形化安装


    ## 更新系统


    不幸的是，如果你不喜欢进入命令行终端，那么你将卡在第一步。在安装任何东西之前，我们需要确保树莓派已完全更新，并且现有的软件包已升级。只需在 LX 终端中输入以下内容。


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    ## 安装 Synaptic


    要安装 Synaptic，你首先需要进入 LX 终端并运行以下命令 – 别忘了在任何要求你接受安装的提示处输入 ''Y''。


    ```

    sudo apt-get install synaptic

    ```


    ## 运行 Synaptic – 第一部分


    本质上，这就是你需要做的全部。Synaptic 已安装好并随时可以使用。然而，由于其复杂性，可能还有一些 bug 需要先解决，所以最好按照以下步骤操作。要测试
    Synaptic 是否正常工作，首先将以下命令输入终端。


    ```

    gksudo synaptic

    ```


    ## 运行 Synaptic – 第二部分


    你现在应该正在查看 Synaptic 程序窗口，你可以滚动浏览可用程序列表，并点击每个程序以下载和安装。现在我们需要测试它是否可以从 LXDE 菜单中运行。点击左下角的图标，然后转到“首选项
    > Synaptic 包管理器”。


    ## 运行 Synaptic – 第三部分


    从 LXDE 菜单运行 Synaptic 会导致错误。但请不要惊慌 - 它只是在请求密码。将以下密码输入框中。


    ```

    raspberry

    ```


    这是树莓派的默认密码，所以我们假设你没有更改过它！


    ## 修复 Synaptic – 选项 1


    这可以暂时解决该问题，但要永久解决它，请执行以下操作之一。首先，右键点击菜单中的 Synaptic 图标，然后左点击“属性”。在“命令”文本框中，更改文本以添加
    gksudo 命令。因此，不再是 ''synaptic-pkexec''，它将变为：


    ```

    gksudo synaptic-pkexec

    ```


    ## 修复 Synaptic – 选项 2


    第二种，也是最佳的选项是回到终端，并改变程序从菜单中执行的方式。只需要将第 8 行更改为使用 gksudo，这样再次使用 gksudo 命令，而不是普通的
    synaptic-pkexec。从终端输入：


    ```

    sudo nano /usr/share/applications/synaptic.desktop

    Change Exec=synaptic-pkexec to Exec=gksudo synaptic-pkexec

    ```


    ## Synaptic 完全正常工作


    输入这些更改后，按 Ctrl+X 退出 nano，然后按 ''Y'' 接受更改，再按几次 Enter 返回到命令提示符。现在你可以从菜单中启动 Synaptic，或者在终端中输入以下命令。


    ```

    gksudo synaptic

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_34_0.png)


    ## 你需要什么……


    - 原型制作设备

    - RPi.GPIO

    - [https://pypi.python.org/pypi/RPi.GPIO](https://pypi.python.org/pypi/RPi.GPIO)


    ![](img/f11b7dbb71886af07ef87126037ebe98_35_0.png)


    *上图：树莓派的 GPIO 端口由 36 个引脚组成，用于连接各种电子元件/设备*


    # GPIO 端口解析


    了解如何利用树莓派上的 GPIO 端口的力量。这比你想象的要简单……


    树莓派上的通用输入/输出 (GPIO) 引脚通常是你将在本书中发现的项目成功的核心。没有它们，你就无法与现实世界进行交互，无论是触发灯光、按钮或蜂鸣器，还是读取传感器。


    GPIO 引脚并不是树莓派特有的；它们实际上是一种标准，旨在帮助控制各种集成电路的输入和输出行为。通常你会发现任何一个 GPIO 引脚都没有预定义的特定用途，而且它们默认通常是关闭的。


    ## 树莓派 GPIO


    树莓派上的 GPIO 引脚可以通过多种方式控制和触发。你可以直接从终端和通过 Bash 脚本使用它们，或者你可以使用专为流行编程语言设计的模块来控制它们。由于
    Python 是树莓派的官方语言，你会发现 Python 的 GPIO 模块提供了可获得的输入和输出最佳控制之一。该库名为 RPi.GPIO，默认安装在所有树莓派上，但也可以以任何安装有用的
    Python 库的方式安装。该项目托管在 SourceForge 上，可以在 [sourceforge.net/projects/raspberry-gpio-python](sourceforge.net/projects/raspberry-gpio-python)
    找到。你还会发现有用的链接、信息以及如何在简单的 Python 脚本中使用和控制 GPIO 引脚的示例。如果你打算使用 RPi.GPIO，最好对 Python
    有基本的理解，因此我们建议进行如 [www.codeacademy.com](www.codeacademy.com) 上找到的基础入门课程，或阅读 [www.python.org/doc](www.python.org/doc)
    上的官方 Python 文档。


    树莓派上有 26 个 GPIO 引脚，你可以按自己的意愿使用其中绝大多数。不过，有一些引脚具有特殊用途，因此我们建议你熟悉它们的布局。例如，最上面一行的引脚设计用于为按钮和灯光等外部设备提供电力。由于需要地线（通常称为“接地”）来安全地创建电路，你还会发现
    GPIO 端口中有几个接地引脚。


    ## 如何使用 GPIO 引脚


    要利用 GPIO 端口的力量，你需要一些基本组件，其中最重要的是跳线。由于端口上的引脚是“公”的，你需要根据打算连接到树莓派的硬件，购买“母对公”或“母对母”电缆。假设你要连接的设备也有公连接器，“母对母”跳线线就很合适，而且通常你在使用面包板来原型化电路，在这种情况下首选“母对公”连接器。电缆和面包板可以从几乎任何销售树莓派配件的在线商店以非常低廉的价格买到，通常可以在商店的“原型制作”部分找到。


    ## 命名约定


    一旦你准备好连接你的设备，下一个任务是找到适合工作的正确引脚。虽然所有 GPIO 端口都是多用途的，但有些比其他的更“多用途”！如前所述，一些引脚保留用于
    5V、3.3V 和接地。其他引脚也有特殊功能，但更糟糕的是，它们可以被称为不同的名称。例如，GPIO 18 也称为引脚 12 和 PGM_CLK。这个特定的引脚（位于
    GPIO 端口右侧大约中间的位置）能够进行硬件脉宽调制 (PWM)，并用于控制 LED 灯和电机等。


    你在 Python 脚本中使用的引脚命名约定可以手动设置。这可以设置为 BCM（Broadcom 引脚名称）或物理引脚位置（BOARD）。


    你会在我们使用 GPIO 端口的任何项目中发现，括号中有 BCM 或 BOARD 的以下行：


    ```

    GPIO.setmode(GPIO.BCM)

    ```


    处理 GPIO 引脚命名问题的最简单方法是选择一种约定并坚持下去！


    ![](img/f11b7dbb71886af07ef87126037ebe98_36_0.png)


    *下图：熟悉 GPIO 引脚的布局及其功能 - 有些具有特殊用途，例如接地引脚*


    > **你知道吗...**

    > RPi.GPIO 库有一些非常有用的本地化允许，例如我们可以设置 "out" 或 "input"。


    # 四大附加板


    使用这些附加板来扩展树莓派的功能，从而从树莓派中获得更多。


    ![](img/f11b7dbb71886af07ef87126037ebe98_37_0.png)


    ## Pi Supply Switch £15


    树莓派之所以如此受欢迎，部分原因是其硬件具有极高的性价比。它在价格点上提供了强大的性能，而且由于它是由慈善机构设计的，因此他们不需要通过高利润来抬高价格（想想它作为商业产品会花多少钱）。不幸的是，与任何低成本物品一样，为了以如此实惠和小型的形态带来它，不得不做出一些妥协。


    与更标准的台式或笔记本电脑相比，它明显缺乏的两样东西是电源开关和电源管理功能。让人惊讶的是，像电源开关这样简单的东西可以如此有用，直到你没有它时你才会意识到这一点！


    Pi Supply Switch 是一个自焊套件，提供开、关和软关（文件安全关机）按钮，为你的树莓派提供基本的电源管理功能。通过提供的一些示例脚本，你可以确保在关闭时树莓派正确关机
    – 无需打开任何菜单或在终端中输入任何命令 – 而且开关中的电路确保只有在树莓派关机后才移除电源。除了对你更方便外，它还可以减少因过早拔出电源电缆而导致 SD
    卡损坏的可能性。


    ## PiTFT Mini Kit £30


    这是一个 2.8 英寸电容式 TFT LCD 触摸屏，由 Adafruit 的项目专家专门为树莓派设计。它可以直接插在树莓派上方，大小与树莓派本身相当。


    你想要为树莓派添加这样的屏幕有很多原因，但通常都归结于树莓派非常小且非常便携，而大多数显示器并非如此。虽然如果你在外可以透过手机通过 VNC 远程连接，但该屏幕直接连接到树莓派，并不涉及麻烦的无线联网。此外，作为一个触摸屏，你不需要携带其他输入设备，因为它也由树莓派供电。


    这开启了无限可能。便携式电脑、触摸屏控制板、摄像机 – 任何在你离开主显示器时能从树莓派拥有屏幕和人类输入中受益的东西。


    ![](img/f11b7dbb71886af07ef87126037ebe98_37_1.png)


