  - '[PAGE 97]


    # Build an iBeacon


    # Making your iBeacon smart


    **11** You can take what you’ve done with the iBeacon so far even further with
    some smart interaction between your smartphone and Raspberry Pi, but where should
    you start? Rather than going headfirst into a DIY task, it pays to take your time
    finding the right app for your smartphone — one that will enable you to launch
    specific apps based on the presence of a iBeacon.

    The tools we’ve looked at above are simply for detection and measurement, and
    the data they reveal is useful for developing trigger apps. But how do you launch
    an app when your phone is near a iBeacon?


    # What a iBeacon can’t do


    **13** As things stand, for better or worse, you’re not in a Phillip K Dick novel.
    This means that for the time being (at least), iBeacon technology cannot launch
    a web page on your phone without a third party tool (such as those mentioned above).

    It is not beyond the realm of possibility that such a feature might be integrated
    into iOS or Android in the foreseeable future, a situation that might see an advert
    displayed on your phone as you pass an iBeacon, perhaps including a discount for
    shopping at the advertising store.


    ![](img/f11b7dbb71886af07ef87126037ebe98_97_0.png)


    # iBeacon Trigger Apps


    **12** Whether you’re using iOS or Android, you’ll find a trigger app on the corresponding
    app store that can be set up to launch an app when your smartphone comes into
    proximity with your iBeacon. Android users should take a look at NFC Beam, available
    free from Google Play and intended for devices equipped with Bluetooth 4.0 hardware
    and running Android 4.3 or later. Meanwhile, iOS users should take a look at Beacon,
    available for a pittance (£1.59) in the App Store. This app has support for iFTTT,
    Philips Hue, HomeKit and Lux lights integration.


    > > “Whether you’re using iOS or Android, you’ll find a trigger app on the corresponding
    app store”


    # Choosing iBeacon vs NFC


    **14** As you may have gathered by now, there are some similarities in use for
    an iBeacon and NFC, especially when it comes to smart home applications.

    So which one should we use for your project?

    Adept producers an NFC breakout board to add NFC functionality to the Raspberry
    Pi, which can prove very useful for any project that requires contact between
    an NFC tag and a piece of hardware — we grabbed ours from ModMyPi. And this is
    really where the distinction lies. If your project requires physical contact,
    then you should use NFC. Otherwise, the iBeacon solution should be completely
    adequate.'
  - '[PAGE 98]


    # Build an PiBeacon


    # Projects


    # Preparing for smart home hardware


    **15**  Although a very useful addition to smart homes, the PiBeacon isn’t an
    instant miracle fix. While you might want to use it to open your garage door —
    perhaps with an IFTTT command that is sent once your smartphone comes into close
    proximity — without the right mechanical hardware connected to your Raspberry
    Pi, this sort of functionality simply won’t be possible to achieve.


    Similarly, you’ll need to employ suitable electronic hardware to your PiBeacon
    to aid in the switching on and off of connected devices, such as a lamp. The PowerSwitch
    Tail II is such a device, and ships with jumper connectors for hooking it up to
    your Raspberry Pi GPIO.


    > *Below: Conveniently, this project is compatible with pretty much every Pi,
    including the Pi Zero*


    # Weather-proof your PiBeacon


    **16**  Smart home projects using Beacon technology may well need a bit of weather
    proofing. This might mean securing your Raspberry Pi away inside a suitable all-weather
    case, for example, or placing it somewhere sheltered, away from the elements.


    Additionally, if no standard power supply is available, you’ll need to add a battery
    pack. You might consider a standard portable USB power supply, or prefer to use
    a 5V solution, such as that demonstrated in LUD6 issue 154. This explained how
    to power your Raspberry Pi with AA batteries, and covered the inclusion of a UBEC,
    a voltage regulator that protects the Raspberry Pi from being damaged by the batteries.


    # PiBeacon, low profile


    **17**  Thanks to the fact that a PiBeacon project really only needs a power supply
    and USB Bluetooth BLE dongle, you can rely on the less-featured or popular Raspberry
    Pi devices for any PiBeacon projects.


    If you have an old Model A or Model A+ lying around at home, this would be ideal.
    And if you’re fortunate enough to have bagged a Raspberry Pi Zero for just £4,
    this too would be suitable. All you would need in addition is a USB to micro-B
    USB adaptor, which would then be connected to the Pi Zero’s micro-B USB for data
    port.


    ![](img/f11b7dbb71886af07ef87126037ebe98_98_0.png)'
