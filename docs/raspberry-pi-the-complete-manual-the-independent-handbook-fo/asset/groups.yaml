    the result will be on the second line of ''wlant0''. The IP address itself is
    a group of four numbers separated by full stops. If you''re on your home network,
    it will likely be similar to 192.168.0.15. We''ll use this number for our guide,
    but replace it with the IP address you''ve seen via ''ifconfig.


    With this information in hand, all you need to do is open a terminal window on
    your remote Linux PC and type:


    ```

    ssh pi@192.168.0.15

    ```


    This assumes your Raspberry Pi''s username is still the default (which is ''pi'')
    and you''re replacing the IP address with the one you made note of just now. If
    you''ve added user accounts or changed the default, you''ll need to replace the
    username before the ''@'' with whatever you''ve changed it to. When you press
    Enter, you''ll be prompted to enter the password for your Raspberry Pi - again,
    if it''s the default you can type ''raspberry'', otherwise type in your Pi''s
    password and press ''Return.


    You''ll now see that the username details on the command line have changed to
    reflect those of your Raspberry Pi - you''re now connected remotely. Try looking
    through your files or using nano to open a file to edit it!


    # ### Never type another IP address


    Of course, if you take your Raspberry Pi to another network, your Pi''s IP address
    will be different. If you just want to connect to it remotely, it becomes incredibly
    tiresome to set up your PC with a keyboard, mouse and monitor just to get the
    IP address. Wouldn''t it be easier if you could just type the Raspberry Pi''s
    name into the terminal to connect? It sounds too good to be true, but it''s actually
    very easy to do.


    All you need is a small piece of software which effectively lets you discover
    hosts and services on your local network by name instead of IP address (Fig 2).
    To set it up on your Pi all you need to do is open a terminal and type:


    ```

    sudo apt-get install avahi-daemon

    ```


    Once the installation is complete, all you have to do to access your Raspberry
    Pi via SSH is type the following into the terminal:


    ```

    ssh pi@raspberrypi.local

    ```


    What''s more, you can use the name of your Raspberry Pi when you access it via
    any other form of networking, be it Samba, remote login or VNC or anything else!


