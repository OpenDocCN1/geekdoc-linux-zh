    ## 快速入门


    ### 设置您的树莓派


    通过我们易于跟随的指南，了解全新树莓派中各部件的位置。


    虽然看起来可能令人生畏，但将树莓派配置为日常使用其实非常简单。就像电视或普通电脑一样，只有特定的线缆才能插入对应的插槽，主要任务就是确保在任意时刻都连接了你所需的设备。树莓派本身在电路板上的标识并不多。不过，大多数优质的外壳都会替你做到这一点——如果你决定购买一个的话。


    - **电源适配器**

    树莓派通过 microUSB 线缆供电，类似于许多现代安卓手机。它可以由笔记本电脑或电脑供电，但要充分发挥其性能，使用合适的市电适配器——如这种——是理想的选择。


    - **显示器**

    树莓派支持 720p 或 1080p 输出——也就是俗称的高清（HD）。一些现代显示器允许直接插入 HDMI，就像电视一样。然而，在某些情况下你可能需要一个适配器。


    ![](img/f11b7dbb71886af07ef87126037ebe98_13_0.png)


    - **USB 集线器**

    树莓派上的 USB 端口数量有限（如果是 A 型号则只有一个）。为了解决这个问题，你需要一个 USB 集线器。重要的是要选择一个带电源的集线器，因为树莓派自身无法提供足够的电力。


    - **外壳与配件**

    要正确使用树莓派，外壳并非必需，但一个得体的外壳可以很好地保护它免受灰尘侵害，并使其在运行中更易于移动。不过，你需要一张至少 4GB 的 SD 卡。


    ![](img/f11b7dbb71886af07ef87126037ebe98_13_1.png)


    - **键盘和鼠标**

    与任何电脑一样，在进行标准的 PC 风格操作时，你需要键盘和鼠标。键盘越顺手越好：鼠标也是如此，因为某些特殊鼠标需要额外软件。


    **模拟输出**

    对于不使用 HDMI 的设置，可以使用黄色视频输出端口。若要使用此端口输出声音，你需要使用旁边的小黑色端口，连接耳机或辅助线缆以输出音频。


    **USB**

    你想通过 USB 连接的所有外围设备——USB 集线器、键盘、鼠标、USB 存储设备等——都插在这里。如果必须使用 USB 集线器，请确保为其提供外部电源。


    **SD 卡**

    SD 卡插入树莓派电路板的下方。这里将存储运行树莓派的操作系统的镜像。不过，在使用之前，你需要在另一台电脑上设置好 Pi OS。


    **数字输出**

    HDMI 端口是树莓派的主要视频（及音频输出）接口，允许你在桌面上以高达 1080p 的分辨率显示视频。支持该功能的电视还会自动通过它接收音频。


    **网络连接**

    树莓派没有有线互联网接口，虽然你可以添加一个 USB 适配器，但通常插入以太网线更容易。它将连接到路由器背面的另一端，为你提供互联网接入和家庭网络访问权限。


    **线缆**

    确保你拥有合适种类的线缆，例如用于联网和互联网的以太网线，以及用于视频输出的 HDMI 或视频线。HDMI 可以传输音频，但视频输出需要额外的辅助线。


    ![](img/f11b7dbb71886af07ef87126037ebe98_14_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_14_1.png)


    ### 你需要准备的材料...


    - 树莓派 Zero

    - microUSB 电源

    - 电烙铁和焊锡

    - Pi Zero 适配器套件

    - 显示器、鼠标和键盘

    - **可选**

    - USB Wi-Fi 或 USB 以太网适配器

    - **可选**

    - USB 集线器


    ### 设置您的 Pi Zero


    掌握您的树莓派 Zero，无论是作为无头设备使用，还是配合屏幕和键盘使用。


    既然你已经选了一台小巧却强大的 Zero，但在开始编程的乐趣之前，你需要更熟悉它。别担心，我们将引导你完成树莓派 Zero 的操作，包括所需的线缆、如何准备
    NOOBS SD 卡，以及如何将 GPIO 引脚排焊到 Pi 上。一旦 Pi 正常工作并启动，我们将展示如何通过 Raspbian 用户界面使其在 Wi-Fi
    上工作。你需要一个 USB 集线器来完成此操作，甚至仅用于同时使用键盘和鼠标。我们还将展示如何为无头使用（VNC 或 SSH）准备 Raspbian SD
    卡，只需一个 Wi-Fi 适配器或 USB 转以太网适配器即可。


    ![](img/f11b7dbb71886af07ef87126037ebe98_15_0.png)


    **树莓派 Zero 线缆概览**


    01 树莓派 Zero 非常小，因此无法安装标准尺寸的 USB 和 HDMI 连接器。因此，要使用它，你需要适配器将 microUSB 扩展为标准 USB，将
    mini-HDMI 扩展为标准 HDMI。在连接 microUSB 线缆时也要非常小心，因为 microUSB 电源线可以插入用于 USB 数据的连接器。不过区分它们很容易，因为它们都有清晰的标签，而且
    USB 数据连接器位于 HDMI 和电源连接器之间。


    ![](img/f11b7dbb71886af07ef87126037ebe98_16_0.png)


    图 1：一旦你将引脚排焊好，任何 Pi Zero 看起来都和其他树莓派相似


    **GPIO 引脚排**


    02 焊你崭新的树莓派 Zero 一开始看起来可能很吓人，但这并不太难！然而，难点在于剪断正确数量的 GPIO 引脚（40 个），因为套件提供的引脚超过 40
    个。此时也值得注意的一点是，如果你搞砸了导致缺失底部的一两个引脚，关系也不大！


    **焊接工具包**


    03 如今电烙铁非常便宜。如果你打算进行大量焊接，那么拥有一个可以更换烙铁头的温控电烙铁可能值得投资。然而，我们使用的包含电烙铁、支架、吸锡器和一些无铅焊锡的套件在亚马逊上仅售价
    8 英镑。我们用这个套件焊接 GPIO 引脚时没有任何问题。


    ![](img/f11b7dbb71886af07ef87126037ebe98_16_1.png)


    **固定 GPIO 引脚排**


    04 在你焊接 GPIO 引脚排之前，你需要能够将其固定。我们建议在引脚两侧贴一些蓝丁胶（Blu-tack）。这样还有一个优点，你可以将 Pi 翻过来，然后用蓝丁胶将其固定在桌子上进行焊接。一旦完成，蓝丁胶应该很容易剥离。


    **焊接 GPIO 引脚排**


    05 这就是你可能一直担心的部分，但别担心！确保你已浸湿电烙铁支架中的海绵，因为你需要在海绵上擦拭烙铁以保持烙铁头清洁。如果这是你第一次使用该烙铁，加热元件在前几分钟可能会冒出很多烟，所以如果发生这种情况请不要担心。尽管如此，要注意安全，并确保你在通风良好的区域进行焊接——尽量不要吸入任何烟雾。烙铁变热后，在烙铁头上涂抹一些焊锡，并在海绵上擦去多余的焊锡。然后开始焊接引脚。对于每个引脚，将烙铁头触碰
    GPIO 引脚排的底部和 Pi 上的金属触点，然后施加极少量的焊锡。一旦焊锡流向引脚和金属触点，你就可以移开烙铁了。如果有太多焊锡，你可以重新加热焊锡并使用吸锡器将其移除。在焊接
    GPIO 引脚排时休息一会儿，原因有二：1）你不想过热 Pi 上的任何组件，2）你可能会融化 GPIO 引脚排的塑料，导致引脚脱落。在整个焊接过程中，持续在海绵上擦拭烙铁头以保持清洁。完成后，请拔掉烙铁并将其放在安全的地方冷却。

    '
