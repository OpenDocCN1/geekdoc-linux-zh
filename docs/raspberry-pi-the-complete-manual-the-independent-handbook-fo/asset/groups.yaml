    # ## Opening


    +   **06** With the shell removed, you should be able to undo the screws holding
    the main circuit board in place. There are also a couple of connectors which power
    the vibration motors — gently unclip them in order to completely remove the board.
    You might find it easier to use a pair of pliers for this — just be very gentle
    as you pull.


    # ## Gently does it


    +   **07** You can see for yourself just how well the Pi fits here; it can be
    squeezed under the memory card slot. If you want to hold it firmly in place, use
    some Blu-tak as a temporary solution. Also, if you’re using an older controller,
    it’s worth giving it a bit of a clean. Remove the rubber contacts and gently swab
    under them using the isopropyl alcohol swabs.


    # ## Fitting


    +   **04** If you’re using a different controller, double-check that the Pi is
    likely to fit inside before you crack it open. As you’ll see here, the Pi nestles
    neatly between the triggers of this controller – the original Xbox controller
    is one of the largest.'
