    ## Projects


    ### Print wirelessly with your Pi


    Breathe new life into an old printer by using your Raspberry Pi as a wireless
    print server. Wireless printing has made it possible to print to devices stored
    in cupboards, sheds, and remote rooms. You don’t have to own a shiny new printer
    for this to work; old printers without native wireless support don’t have to end
    up in the bin, thanks to the Raspberry Pi.


    The setup is simple. With your Pi set up with a wireless USB dongle, you connect
    your printer to a spare USB port on the computer. With Samba and CUPS (Common
    Unix Printing System) installed on the Raspberry Pi, all that is left to do is
    connect to the wireless printer from your desktop computer, install the appropriate
    driver, and start printing.


    CUPS gives the Raspberry Pi a browser-based admin screen that can be viewed from
    any device on your network, enabling complete control over your wireless network
    printer.


    **What you’ll need...**

    - Latest Raspbian image

    - USB printer

    - USB wireless card


    ![](img/f11b7dbb71886af07ef87126037ebe98_77_0.png)


    #### Check your printer works

    01 Before starting, check that the printer you’re planning to use for the project
    still works and has enough ink. The easiest way to do this is to check the documentation
    (online if you can’t find the manual) and run a test print.


    ![](img/f11b7dbb71886af07ef87126037ebe98_78_0.png)


    #### Detect your printer

    02 With your Raspberry Pi set up as usual and the printer connected to a spare
    USB port, enter:

    ```bash

    lsusb

    ```

    This will confirm that the printer has been detected by your Raspberry Pi. In
    most cases, you should see the manufacturer and model displayed.


    #### Install Samba and CUPS

    03 Install Samba on your Pi to enable file and print sharing across the entire
    network:

    ```bash

    sudo apt-get install samba

    ```

    Next, install CUPS:

    ```bash

    sudo apt-get install cups

    ```

    With a print server installed, begin configuration by adding default user ‘pi’
    to the printer admin group:

    ```bash

    sudo usermod -a -G lpadmin pi

    ```


    #### Set up print admin

    04 Set up the CUPS print admin tool. Boot into the GUI (X.org) and launch the
    browser, entering `127.0.0.1:631`. Switch to **Administration**, before ensuring
    that the ‘Share printers’ and ‘Allow remote administration’ boxes are selected.
    Select **Add Printer** and proceed to enter your Raspbian username and password.


    #### Add your printer

    05 A list of printers will be displayed, so select yours to proceed to the next
    screen where you can confirm the details, add a name, and check the Share This
    Printer box. Click Continue to load the list of printer drivers and select the
    appropriate one from the list.


    ![](img/f11b7dbb71886af07ef87126037ebe98_78_1.png)


    #### Configure Samba for network printing

    06 Using a Windows computer for printing to Samba, press `Ctrl+H` for configuration.
    Open `/etc/samba/smb.conf` in nano, search for `[printers]` and find `guest ok
    = yes` which you should change as follows:

    ```bash

    guest ok = yes

    ```

    Next, search for ‘[print$]’ then change the path as follows:

    ```bash

    path = /usr/share/cups/drivers

    ```


    #### Join a Windows workgroup

    07 With these additions made, search for ‘workgroup’ in the configuration file
    and then add your workgroup:

    ```bash

    workgroup = your_workgroup_name

    ```

    Make sure you uncomment the second setting so that the print server can be seen
    from Windows. Next, save your changes and then restart Samba:

    ```bash

    sudo /etc/init.d/samba restart

    ```


    #### Accessing your printer

    08 Meanwhile, it’s a lot easier to access your wireless printer from a Linux,
    Mac OS X, or other Unix-like system, thanks to CUPS. All you need to do is add
    a network printer in the usual way and the device will be displayed.


    #### Add AirPrint compatibility

    09 It’s also possible to print wirelessly from your Apple iPad using Apple’s AirPrint
    system. To do this, you need to add the Avahi Discover software:

    ```bash

    sudo apt-get install avahi-discover

    ```

    Your wireless printer will now be discoverable from your iPad or iPhone and will
    be ready to print.


    ### Control lights with your Pi


    The winter nights are getting longer; use a Pi and mobile device to remotely control
    your lights.


    **What you''ll need...**

    - Pi · Model B+ (control board) · with two sockets

    - kit, by MapF0U

    - Desk lamp

    - Accessories


    ![](img/f11b7dbb71886af07ef87126037ebe98_79_0.png)


    **Did you know...**

    Every device on the Internet is assigned an Internet Protocol address (IP address).
    This is a numerical code which is used to locate and identify each device within
    a network which can contain many thousands of devices. Most home-network IP addresses
    start with the numbers 192.168, with your router being on 192.168.1.1.


    The folks at Energenie have created some genius plug sockets that can be turned
    on and off via your Raspberry Pi. You can buy a starter kit which includes the
    RF transmitter add-on board and two sockets to get you started. The add-on board
    connects directly to the GPIO pins and is controlled with a Python library. Once
    everything is installed and set up, your Raspberry Pi can be used with the Pi-mote
    to control up to four Energenie sockets using a simple program. This tutorial
    covers how to set up the software, the sockets, and how to adapt the program so
    that it can run on your mobile device.


    **Remote control**

    Take control of your home environment using your smartphone''s browser


    **Light source**

    Any light source with a plug socket can controlled remotely


    ![](img/f11b7dbb71886af07ef87126037ebe98_80_0.png)


    Above The Pi-Mote IR control board is hugely versatile and only costs £9.99


    #### Set up

    01 To get started, boot up your Raspberry Pi and load the LX Terminal, then update
    your software by typing:

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```

    Depending on which version of the OS you''re using, you may need to install the
    Python GPIO libraries. Raspbian Jessie comes with this library pre-installed,
    so you can skip this step! Type the following into the command line:

    ```bash

    sudo apt-get install python-rpi.gpio

    ```

    On completion, reboot your Pi. This will install the Python GPIO libraries, meaning
    you can access and control the pins with Python code.


    > “Your Pi can control up to four Energie sockets using this simple program”


    #### Install the Energie library

    02 Next, install the Energie libraries. These enable the Pi-Mote board and Raspberry
    Pi to interact with Python. In the LX Terminal, depending on which version of
    Python you are using, type either:

    ```bash

    sudo apt-get install python3-pip

    sudo pip3.2 install energenie

    ```

    … for Python 3; or

    ```bash

    sudo apt-get install python-pip

    sudo pip install energenie

    ```

    …for an older version. In the future, Energie will update its software and you
    may need to run a check for updates to ensure that you have the most recent version.
    To update the software, type the code:

    ```bash

    sudo pip install energenie --update

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_81_0.png)


    #### Fitting the Pi-mote

    03 Before fitting the Pi-mote transmitter, shut down your Raspberry Pi with `sudo
    poweroff`. Next, unplug the power supply and fit the module onto your Raspberry
    Pi. The 1st part of the board fits opposite the HDMI port. Power up the Pi and
    plug in one of your Energecie sockets in the satellite room or area that your
    Pi is in. The device''s range is fairly good, but furniture, walls, and other
    objects may sometimes block the transmission signal. You can test that the socket
    is working by plugging in something like a desk lamp and then pressing the green
    button that is located on the socket. This will trigger the socket on and off,
    turning the lamp on and off in turn.


    #### Download the set-up code

    04 Before the Raspberry Pi can interact with the socket and switch it on/off,
    it requires programming to learn a control code that is sent from the transmitter.
    Each socket has its own unique code so that you can control up to four individually.
    Energecie provides the set-up program which can be found inside their tutorial
    resources (available at bit.ly/2lZRw4G).


    #### Set up your socket

    05 Once you have downloaded the set-up program, run it. You should place the socket
    into ‘learning mode’, which will be indicated by the LED on the front of the socket
    housing slowly flashing. If it is not doing this, press and hold the green button
    for a few seconds and release it. Then the LED starts to flash at a one-second
    interval. Run the program and it will send a signal out. Follow the on-screen
    prompts, pressing the button key when required.


    When the code is accepted, success will be indicated with a brief flashing of
    the LED on the housing. If you do have more than one socket to set up, simply
    use the same program and method to do so for as many times as required.


    #### A quick test

    06 Before you get to the task of creating your Python code to control your socket,
    it is always advisable to test that the socket is working correctly. Ensuring
    that the power is turned on the wall plug and that the lamp is switched on, you
    can turn the lamp off by pressing the green button on the front of the Energecie
    socket. The lamp should turn back on again when the button is next pressed.


    #### Code to turn the socket on

    07 The Python Energecie library makes it incredibly easy to create a code to turn
    the socket on, which will then turn your lamp on. Before you know it, you will
    be using your Raspberry Pi to turn the kettle or TV on or off!


    Open your Python editor and start a new program. Next, import the Raspberry Pi
    GPIO library (line 1, below), then import the Energecie library (lines 2 and 3).
    Finally, add in the code to switch the socket on (line 4). Save and then run your
    program. The socket will turn on, you may hear a click, and then your lamp will
    come on.


    ```python

    import RPi.GPIO as GPIO

    import energize

    from energzie import switch_on

    energieze.switch_on(1)

    ```

