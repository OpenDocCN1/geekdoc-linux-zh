    \ 程序中会需要它们。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_74_0.png)\n\n### 安装软件\n\
    \n- 现在启动你的树莓派并将其连接到互联网。在安装 Twilio 软件之前，更新和升级你的树莓派是值得的。在 LXDE 终端中，输入 `sudo apt-get\
    \ update`，然后输入 `sudo apt-get upgrade`。完成后，输入 `sudo easy_install twilio` 或 `sudo\
    \ pip install twilio` 来安装软件。如果需要安装 pip，请输入 `sudo apt-get install python-pip`，`python-dev`，按回车键，然后输入\
    \ `sudo pip install -U pip`。\n\n### Twilio 身份验证\n\n- 现在你可以准备创建向手机发送短信消息的短信程序了。打开你的\
    \ Python 编辑器并导入 Twilio REST 库（如下方第一行所示）。接下来，添加你的 AccountSID 和 Auth Token，将 X 替换为你的信息，你可以在仪表板上找到。\n\
    \n```python\nfrom twilio.rest import TwilioRestClient\n\naccount_sid = \"XXXXXXXXXXXXXXXX\"\
    \nauth_token = \"XXXXXXXXXXXXXXXX\"\n```\n\n### 创建你的消息\n\n- 你可能希望能够更改你的短信内容，而不是每次都发送相同的消息。在你的程序中创建一个名为\
    \ `message` 的新变量。这将提示你输入想要发送到手机的短语。当程序运行时，这就是将发送的消息。\n\n```python\nmessage = raw_input(\"\
    Please enter your message\")\n```\n\n### 添加你的号码\n\n- 为了发送消息，你需要添加下面的代码行和你的两个电话号码。第一个号码是你的手机号码，该号码已在\
    \ Twilio 注册并验证（步骤 2）。第二个号码是你的 Twilio 账户号码，可以在仪表板页面‘Call the Sandbox’数字下检索到。将 Sandbox\
    \ 号码更改为你的国家/地区位置，并记得添加国际国家代码。\n\n```python\nclient = TwilioRestClient(account_sid,\
    \ auth_token)\nmessage = client.messages.create(to=\"4479XXXXXXXXXX\", from_=\"\
    444XXXXXXXXX\", body=message)\n```\n\n### 发送消息\n\n- 现在发送你的消息。下面的代码不是必需的，但有助于指示你的消息已发送。添加这些行并保存你的程序。确保你的树莓派已连接到互联网且你的手机已开机，然后运行你的程序。你刚刚从树莓派发出了短信！\n\
    \n```python\nprint message.sid\nprint \"Your message is being sent\" \nprint \"\
    Check your phone\" \n```\n\n### 其他 API 和代码\n\n- 你还可以创建其他通信程序，例如拨打电话、录制通话以及发送包含来电显示和通话时长的数据。该\
    \ API 还完成了广泛编程语言的支持，包括 Ruby、PHP、Java 和 Node.js（twilio.com/api）等等。\n\n# 打造 Pi 2\
    \ HTPC\n\n### 你需要的材料…\n\n- OpenELEC openelec.tv\n- HDMI 线\n- USB IR 接收器\n- 红外遥控器\n\
    - 机箱\n- 专用电源\n- 可选的 USB 存储设备\n\n> 最后，使用功能强大的 Raspberry Pi 2 和出色的 OpenELEC 项目，创建一个更强大、功能更完善的\
    \ HTPC。\n\n我们知道有些人仅使用 Raspberry Pi 运行 XBMC，现在称为 Kodi。这是一个很棒的主意，也是对树莓派很棒的用途 – 它运行得足够好，让你可以轻松地在本地或通过网络播放媒体。最大的问题出现在原始\
    \ Model B 上，GUI 响应迟钝，以及缺少足够的 USB 端口来连接你所有的设备。尽管过去几年的优化有所帮助，但升级到 Raspberry Pi 2\
    \ 基本上通过提供更强大的硬件解决了所有这些问题的难题。因此，如果你正在考虑升级或终于下定决心，这份便捷的指南将帮助你创建完美的 Raspberry Pi\
    \ 2 HTPC。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_75_0.png)\n\n### 选择软件\n\n\
    **01** 过去，Pi HTPC 只能在 RaspBMC 和 OpenELEC 之间选择。然而，RaspBMC 目前处于停滞状态，OpenELEC 是获取最新软件的最好选择。两者之间没有巨大差异，因为它们都运行\
    \ XBMC。\n\n### 获取软件\n\n**02** 访问 openelec.tv 并查找下载部分。有一个专门的 Raspberry Pi 部分，分为原始版本（ARMv6）和\
    \ Pi 2（ARMv7）。在此页面上获取 Pi 2 的镜像文件。\n\n### 安装到存储卡\n\n**03** 打开终端并使用 `fdisk -l` 来确定你的\
    \ SD 卡在你的系统中的位置。类似于 `/dev/sdb` 或 `/dev/mmcblk0` 的位置将很理想。使用 `cd` 导航到镜像文件，并使用以下命令通过\
    \ `dd` 安装它：\n\n```bash\n$ dd bs=1M if=OpenELEC-RPi2-arm-5.0.5.img of=/dev/mmcblk0\n\
    ```\n\n### 首次启动\n\n**04** 将你的 Raspberry Pi 插入电视或其他屏幕（起初只为了开始使用），然后将其开机。OpenELEC\
    \ 会调整 SD 卡分区大小并写入一些额外的程序，最后才会引导至 Kodi。\n\n### 配置 Kodi\n\n**05** 通过基本向导完成界面设置 –\
    \ 如果你是通过无线连接的，你需要进入系统菜单中的 OpenELEC，激活无线接收器，然后选择你的网络并输入密码。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_76_0.png)\n\
    \n### 添加网络共享\n\n**06** 你可以将便携式硬盘驱动器或 USB 驱动器连接到树莓派作为存储，但真正重要的是通过网络流媒体。进入系统下的文件管理器并添加来源。转到浏览并选择你的网络协议来浏览网络，或者手动添加。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_76_1.png)\n\n> “这是对树莓派很棒的用途 – 它运行得足够好，让你可以轻松地在本地或通过网络播放媒体”\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_76_2.png)\n\n### 机箱与放置\n\n**07** Raspberry\
    \ Pi 的放置很重要。因为它将始终处于开启状态，我们强烈建议为它配备一个机箱 – Pimoroni 的 Pibox 机箱非常适合这种用途，因为它们坚固耐用，并且可以附着在某些电视的背面。\n\
    \n### 红外传感器与控制器\n\n**08** Kodi 可以通过多种不同的设备控制 – 包括 USB 游戏控制器和兼容的红外传感器。我们过去使用过 FLIRC，但如果你把树莓派放在电视后面，你需要一根可以延伸到有用位置的线缆上的传感器。\n\
    \n### 未来更新\n\n**09** OpenELEC 具有出色的自我更新能力，无需你每隔几个月就重新安装，这意味着你几乎不需要进行任何维护。现在，你可以轻松享受媒体，坐享其成。\n\
    \n"
