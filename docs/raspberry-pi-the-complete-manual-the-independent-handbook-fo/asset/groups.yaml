    Raspberry-based image that turns your Pi into a web server and web development
    kit. Accessible easily over a local network and with support for jQuery out of
    the box, it''s an easy and great way to further your web development skills.


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_1.png)


    Download this page''s Coder Raspberry Pi image


    # Get the Code


    You''ll need to download the Coder image from Google Coder, a new way to use the
    web on the Raspberry Pi.


    # Raspberry-specific instructions


    If you want to use Coder on a Raspberry Pi, download and install the image to
    your SD card using the instructions on the site. Once it''s installed, plug in
    an ethernet cable and turn on your Pi. Wait a few moments and you should be ready
    to go!


    # Get Google Coder


    +   1. Head to the Google Coder website, and download the compressed version of
    the image.

    +   2. Unpack it wherever you wish, and install it using dd, like any other Raspberry
    Pi image.


    ```

    $ dd if=[path to]/raspi.img of=/dev/[path to SD card] bs=4M

    ```


    # Plug in your Pi


    +   1. For this tutorial, you''ll only need to connect a network cable into the
    Pi. Pop in your newly written SD card, plug in the power and wait a few moments.
    If you''ve got a display plugged in already, you''ll notice a Raspberry startup
    sequence leading to the command-line login screen.


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_2.png)


    # Connect to Coder


    +   1. Open up the browser on your main system, and go to http://coder.local.
    You may have to manually accept the licence: it will ask you to set up your password,
    and then you''ll be in and ready to code.'
  md: "\n## Control lights with your Pi\n\n### Switching the socket on and off\n\n\
    Since you have not told the socket to turn off, it will stay on, which means the\
    \ lamp will stay on forever (or until the bulb blows!).\n\nTo turn the socket\
    \ off after five seconds, import the time function at the start of your program\
    \ (line 2, below), add the command to turn off the socket (line 5). Then add a\
    \ pause with the sleep command (line 7) and finally turn off the lamp (line 8).\n\
    \nNow save and run the program.\n\n```python\nimport RPi.GPIO as GPIO\nimport\
    \ time\nimport energenie\nfrom energenie import switch_on\nfrom energenie import\
    \ switch_off\n\nenergenie.switch_on(1)\ntime.sleep(5)\nenergenie.switch_off(1)\n\
    ```\n\n### Web-based applications\n\nIt is possible to augment this hack so that\
    \ you can turn the lamp on and off from a mobile device such as your phone, laptop\
    \ or tablet. This makes the whole project more impressive, slick and fun.\n\n\
    The first step is to set up your Raspberry Pi as a web server which will host\
    \ and display a web page with the ON / OFF option. These buttons are interactive\
    \ and control the socket.\n\nOpen the LX Terminal and install pip and Flask.\n\
    \n```bash\nsudo apt-get install pip\nsudo pip install flask\n```\n\n### CSS and\
    \ HTML\n\n> \"Using a mobile device such as your phone, laptop or tablet makes\
    \ the whole project more impressive, slick and fun.\"\n\nTo make the web page\
    \ presentable, you need to set up an HTML and a CSS file.\n\nHTML stands for HyperText\
    \ Markup Language and is used to create web pages. Your browser reads HTML files\
    \ and converts them into web pages, enabling images and objects to be embedded\
    \ into the pages. Cascading Style Sheets, or CSS, is the code which describes\
    \ how the web page will look, the presentation of the HTML content.\n\nIt contains\
    \ instructions on how the elements will be rendered. Here, it controls how the\
    \ on and off options will be presented.\n\n### The HTML files\n\nOpen the Mobile_Lights\
    \ folder and create a new folder called 'templates'.\n\nThis folder is where the\
    \ HTML file is saved that contains the structure for the website layout. The code\
    \ names the web page tab and, most importantly, adds the links for the on and\
    \ off option.\n\nOpen a text editor from your Start menu, or use nano and create\
    \ a new file. Add the HTML below to the file and then save the file in the template\
    \ folder, naming it 'index.html'. Remember, this is an HTML file and must end\
    \ with the file extension '.html'.\n\n### Create a new folder\n\nWith Flask installed,\
    \ reboot your Raspberry Pi.\n\nCreate a new folder called Mobile_Lights in the\
    \ /home/pi folder. This is where you will save the Python program which controls\
    \ the socket and lamps, and CSS and the HTML file. You can create the folder in\
    \ the LX Terminal by typing `mkdir Mobile_Lights` or right-clicking in the window\
    \ and selecting New Folder.\n\n```html\n<!doctype HTML>\n<HTML>\n<head>\n    <title>Light\
    \ Controller</title>\n    <link rel=\"stylesheet\" href=\"/static/style.css\"\
    \ />\n    <meta name=\"viewport\" content=\"width=device-width, user-scalable=no\"\
    \ />\n</head>\n<body>\n<div class=\"on\"><a href=\"/\">ON</a> </div>\n<div class=\"\
    off\"><a href=\"/off\">OFF</a></div>\n</body>\n</HTML>\n```\n\n### Add some style\n\
    \nCSS is used to create and apply a 'button' style effect to the web page. Move\
    \ back to the Mobile_Lights folder and create a new folder named static. This\
    \ is where the CSS file is saved. Create another new text file and paste the code\
    \ below, which sets out the style for the web page. You can customise the colours\
    \ of the buttons from line 20 onwards. Save the file as style.css in the static\
    \ folder.\n\n```css\nbody {\nposition: absolute;\nmargin: 0;\ntop: 0;\nright:\
    \ 0;\nbottom: 0;\nleft: 0;\nfont-family: Arial, sans-serif;\nfont-size: 13px;\n\
    text-align: center;\n}\n\ndiv {\ndisplay: block;\nwidth: 100%;\nheight: 50%;\n\
    }\n\ndiv a {\nwidth: 100%;\nheight: 200%;\ndisplay: block;\n}\n\ndiv.on {\nbackground:\
    \ black;\n}\n\ndiv.on a {\ncolor: white;\n}\n\ndiv.off a {\ncolor: black;\n}\n\
    \na, a:visited {\ntext-decoration: none;\n}\n```\n\n### Putting it all together\n\
    \nThe final part of the setup is to write the Python script that combines the\
    \ index.html and style.css files with the Energenie socket control code similar\
    \ to the one used in Step 7.\n\nOpen IDLE and start a new window, add the following\
    \ code and save it to your Mobile_Lights folder naming it 'mobile_lights.py'.\
    \ Line 4 uses the route() decorator to tell Flask the HTML template to use to\
    \ create the web page. Lines 7 and 11 use app.route('/on/') and app.route('/off/')\
    \ to tell Flask the function to trigger when the URL is clicked. In line 15 the\
    \ run() function is used to run the local server with our application. The `__name__\
    \ == __main__` makes sure the web server only runs if the script is executed directly\
    \ from the Python interpreter and not used as an imported module.\n\n```python\n\
    from flask import Flask, render_template\nfrom energenie import switch_on, switch_off\n\
    \napp = Flask(__name__)\n\n@app.route('/')\ndef index():\n    return render_template('index.html')\n\
    \n@app.route('/on/')\ndef on():\n    switch_on()\n    return render_template('index.html')\n\
    \n@app.route('/off/')\ndef off():\n    switch_off()\n    return render_template('index.html')\n\
    \nif __name__ == '__main__':\n    app.run(debug=True, host='0.0.0.0')\n```\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_83_0.png)\n\n### Find your IP address\n\
    \nBefore you start the web server running, you will need to check the following:\n\
    - You have a folder set up called _Mobile_Lights\n- In the Mobile_Lights folder\
    \ is a Python file named mobile_lights.py\n- Also within the Mobile_Lights folder\
    \ are two folders: one named templates which stores the index.html file and another\
    \ folder named static which contains the file style.css\n\nIf everything checks\
    \ out, then in the LX Terminal you can type `sudo hostname -I`. This will display\
    \ the IP address of your Raspberry Pi – for example, 192.168.35.8. Make a note\
    \ of it because this is the address you will enter into the web browser on your\
    \ mobile device.\n\n### Start the web server\n\nYou have arrived at the point\
    \ where you are ready to start the web server. Move to the Mobile_Lights folder\
    \ by typing `cd Mobile_Lights`. Now run the Python mobile_lights.py program by\
    \ typing `sudo python mobile_lights.py`. This starts up the web server, which\
    \ is then ready to respond to the buttons that are pressed on the web page.\n\n\
    ### Turn your lights on and off\n\nGrab your mobile device, smartphone or tablet\
    \ and load the web browser. In the address bar enter the IP address that you noted\
    \ down in Step 15. At the end of the address, add :5000 – for example, 192.168.1.122:5000.\
    \ The 5000 is the port number that is opened to enable the communication between\
    \ your device and the Raspberry Pi. You will be presented with ON and OFF options,\
    \ and you can now control the socket and whatever you have plugged in – kettle,\
    \ radio, TV – all from your mobile device by simply pressing ON or OFF. Have fun!\n\
    \n> “You will be presented with ON and OFF options to control the socket”\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_84_0.png)\n\nAbove You need to get the\
    \ folder names correct so that files are saved properly\n\n## Build your first\
    \ web server\n\nWhat you'll need...\n- Internet connectivity\n- Web browser\n\
    - Google Coder (`google.com/coder/raspberrypi/setup/so/so/coder-raspberrypi/so/setup/so/so/so/so/1.html`)\n\
    \n### Introduction\n\nUse Google Coder to turn your Raspberry Pi into a tiny,\
    \ low-powered web server and web host!\n\nWe're teaching you how to code in many\
    \ different ways on the Raspberry Pi in this book, so it only seems fitting that\
    \ we look at web development too.\n\nThere's a new way to use the web on the Raspberry\
    \ Pi as well: internet giant Google has recently released Coder specifically for\
    \ the tiny computer. It's a Raspberry-based image that turns your Pi into a web\
    \ server and web development kit. Accessible easily over a local network and with\
    \ support for jQuery out of the box, it's an easy and great way to further your\
    \ web development skills.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_85_0.png)\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_85_1.png)\n\nDownload this page's Coder\
    \ Raspberry Pi image\n\n### Get the Code\n\nYou'll need to download the Coder\
    \ image from Google Coder, a new way to use the web on the Raspberry Pi.\n\n###\
    \ Raspberry-specific instructions\n\nIf you want to use Coder on a Raspberry Pi,\
    \ download and install the image to your SD card using the instructions on the\
    \ site. Once it's installed, plug in an ethernet cable and turn on your Pi. Wait\
    \ a few moments and you should be ready to go!\n\n### Get Google Coder\n\n1. Head\
    \ to the Google Coder website, and download the compressed version of the image.\n\
    2. Unpack it wherever you wish, and install it using dd, like any other Raspberry\
    \ Pi image.\n\n```bash\n$ dd if=[path to]/raspi.img of=/dev/[path to SD card]\
    \ bs=4M\n```\n\n### Plug in your Pi\n\n1. For this tutorial, you'll only need\
    \ to connect a network cable into the Pi. Pop in your newly written SD card, plug\
    \ in the power and wait a few moments. If you've got a display plugged in already,\
    \ you'll notice a Raspberry startup sequence leading to the command-line login\
    \ screen.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_85_2.png)\n\n### Connect\
    \ to Coder\n\n1. Open up the browser on your main system, and go to http://coder.local.\
    \ You may have to manually accept the licence: it will ask you to set up your\
    \ password, and then you'll be in and ready to code.\n"
  mdcn: "\n\n## 用你的树莓派控制灯光\n\n### 开关插座\n\n由于你没有告诉插座关闭，它会保持开启状态，这意味着灯将永远保持开启（或者直到灯泡烧坏！）。\n\
    \n要在五秒后关闭插座，请在程序开头导入 time 函数（见下方第 2 行），添加关闭插座的命令（第 5 行）。然后使用 sleep 命令添加一个暂停（第\
    \ 7 行），最后关闭灯（第 8 行）。\n\n现在保存并运行该程序。\n\n```python\nimport RPi.GPIO as GPIO\nimport\
    \ time\nimport energenie\nfrom energenie import switch_on\nfrom energenie import\
    \ switch_off\n\nenergenie.switch_on(1)\ntime.sleep(5)\nenergenie.switch_off(1)\n\
    ```\n\n### 基于 Web 的应用\n\n你可以扩展这个小创意，以便能够通过手机、笔记本电脑或平板电脑等移动设备来开启和关闭灯。这将使整个项目更加引人注目、流畅且有趣。\n\
    \n第一步是将你的树莓派设置为一台 Web 服务器，用于托管并显示带有 开/关 选项的网页。这些按钮是交互式的，可以控制插座。\n\n打开 LX Terminal\
    \ 并安装 pip 和 Flask。\n\n```bash\nsudo apt-get install pip\nsudo pip install flask\n\
    ```\n\n### CSS 和 HTML\n\n> “使用手机、笔记本电脑或平板电脑等移动设备将使整个项目更加引人注目、流畅且有趣。”\n\n为了使网页看起来体面，你需要设置一个\
    \ HTML 文件和一个 CSS 文件。\n\nHTML 代表超文本标记语言，用于创建网页。你的浏览器读取 HTML 文件并将其转换为网页，从而允许将图像和对象嵌入到页面中。层叠样式表，即\
    \ CSS，是描述网页外观的代码，即 HTML 内容的呈现方式。\n\n它包含关于元素如何渲染的说明。在这里，它控制开和关选项如何呈现。\n\n### HTML\
    \ 文件\n\n打开 Mobile_Lights 文件夹并创建一个名为 'templates' 的新文件夹。\n\n这个文件夹用于保存包含网站布局结构的 HTML\
    \ 文件。代码命名了网页标签，并且最重要的是，添加了开和关选项的链接。\n\n从开始菜单打开文本编辑器，或使用 nano 创建一个新文件。将下面的 HTML\
    \ 添加到文件中，然后将该文件保存在 template 文件夹中，命名为 'index.html'。记住，这是一个 HTML 文件，必须以文件扩展名 '.html'\
    \ 结尾。\n\n### 创建新文件夹\n\n安装了 Flask 之后，重启你的树莓派。\n\n在 /home/pi 文件夹中创建一个名为 Mobile_Lights\
    \ 的新文件夹。这是你将保存控制插座和灯的 Python 程序以及 CSS 和 HTML 文件的地方。你可以在 LX Terminal 中通过输入 `mkdir\
    \ Mobile_Lights` 或右键点击窗口并选择“新建文件夹”来创建该文件夹。\n\n```html\n<!doctype HTML>\n<HTML>\n\
    <head>\n    <title>Light Controller</title>\n    <link rel=\"stylesheet\" href=\"\
    /static/style.css\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ user-scalable=no\" />\n</head>\n<body>\n<div class=\"on\"><a href=\"/\">ON</a>\
    \ </div>\n<div class=\"off\"><a href=\"/off\">OFF</a></div>\n</body>\n</HTML>\n\
    ```\n\n### 添加一些样式\n\nCSS 用于创建并将“按钮”样式效果应用于网页。回到 Mobile_Lights 文件夹并创建一个名为 static\
    \ 的新文件夹。这是保存 CSS 文件的地方。再创建一个新的文本文件并粘贴下面的代码，该代码定义了网页的样式。你可以从第 20 行开始自定义按钮的颜色。将文件保存为\
    \ static 文件夹中的 style.css。\n\n```css\nbody {\nposition: absolute;\nmargin: 0;\n\
    top: 0;\nright: 0;\nbottom: 0;\nleft: 0;\nfont-family: Arial, sans-serif;\nfont-size:\
    \ 13px;\ntext-align: center;\n}\n\ndiv {\ndisplay: block;\nwidth: 100%;\nheight:\
    \ 50%;\n}\n\ndiv a {\nwidth: 100%;\nheight: 200%;\ndisplay: block;\n}\n\ndiv.on\
    \ {\nbackground: black;\n}\n\ndiv.on a {\ncolor: white;\n}\n\ndiv.off a {\ncolor:\
    \ black;\n}\n\na, a:visited {\ntext-decoration: none;\n}\n```\n\n### 将所有内容整合在一起\n\
    \n设置过程的最后一部分是编写一个 Python 脚本，将 index.html 和 style.css 文件与类似于第 7 步中使用的 Energenie\
    \ 插座控制代码结合起来。\n\n打开 IDLE 并新建一个窗口，添加以下代码并将其保存到 Mobile_Lights 文件夹中，命名为 'mobile_lights.py'。第\
    \ 4 行使用 route() 装饰器告诉 Flask 使用哪个 HTML 模板来创建网页。第 7 行和第 11 行使用 app.route('/on/')\
    \ 和 app.route('/off/') 告诉 Flask 当 URL 被点击时触发的函数。在第 15 行使用 run() 函数运行我们的应用程序的本地服务器。`__name__\
    \ == __main__` 确保 Web 服务器仅在脚本直接从 Python 解释器执行时运行，而不用作导入的模块。\n\n```python\nfrom\
    \ flask import Flask, render_template\nfrom energenie import switch_on, switch_off\n\
    \napp = Flask(__name__)\n\n@app.route('/')\ndef index():\n    return render_template('index.html')\n\
    \n@app.route('/on/')\ndef on():\n    switch_on()\n    return render_template('index.html')\n\
    \n@app.route('/off/')\ndef off():\n    switch_off()\n    return render_template('index.html')\n\
    \nif __name__ == '__main__':\n    app.run(debug=True, host='0.0.0.0')\n```\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_83_0.png)\n\n### 查找你的 IP 地址\n\n在启动 Web\
    \ 服务器之前，你需要检查以下内容：\n- 你已有一个名为 _Mobile_Lights 的文件夹\n- 在 Mobile_Lights 文件夹中有一个名为\
    \ mobile_lights.py 的 Python 文件\n- 同样在 Mobile_Lights 文件夹中有两个子文件夹：一个名为 templates，存储\
    \ index.html 文件；另一个名为 static，包含 style.css 文件\n\n如果一切都检查无误，那么在 LX Terminal 中你可以输入\
    \ `sudo hostname -I`。这将显示你树莓派的 IP 地址 – 例如，192.168.35.8。请记下它，因为这是你在移动设备的浏览器中要输入的地址。\n\
    \n### 启动 Web 服务器\n\n你已到达准备启动 Web 服务器的阶段。通过输入 `cd Mobile_Lights` 移动到 Mobile_Lights\
    \ 文件夹。现在通过输入 `sudo python mobile_lights.py` 运行 Python 程序 mobile_lights.py。这会启动\
    \ Web 服务器，随后它准备好响应网页上按下的按钮。\n\n### 开启和关闭你的灯\n\n拿起你的移动设备、智能手机或平板电脑并加载 Web 浏览器。在地址栏中输入你在第\
    \ 15 步中记下的 IP 地址。在地址末尾添加 :5000 – 例如，192.168.1.122:5000。5000 是打开的端口号，用于启用你的设备和树莓派之间的通信。你会看到\
    \ 开 和 关 选项，现在你可以通过简单地按下 开 或 关 来控制插座以及你插入的任何设备 – 水壶、收音机、电视 – 全部从你的移动设备进行控制。祝你玩得开心！\n\
    \n> “你会看到用于控制插座的 开 和 关 选项”\n\n![](img/f11b7dbb71886af07ef87126037ebe98_84_0.png)\n\
    \n上方提示：你需要正确获取文件夹名称，以便文件被正确保存\n\n## 构建你的第一个 Web 服务器\n\n你需要…\n- 互联网连接\n- Web 浏览器\n\
    - Google Coder (`google.com/coder/raspberrypi/setup/so/so/coder-raspberrypi/so/setup/so/so/so/so/1.html`)\n\
    \n### 简介\n\n使用 Google Coder 将你的树莓派变成一台小巧、低功耗的 Web 服务器和 Web 主机！\n\n在这本书中，我们教你用多种方式在树莓派上进行编程，因此我们也来看看\
    \ Web 开发似乎合情合理。\n\n在树莓派上使用 Web 还有一种新方法：互联网巨头谷歌最近专门为这台微型计算机发布了 Coder。它是一个基于树莓派的镜像，将你的\
    \ Pi 变成 Web 服务器和 Web 开发套件。它可以通过本地网络轻松访问，并且默认支持 jQuery，是进一步提升你 Web 开发技能的简单且绝佳的方式。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_85_0.png)\n\n![](img/f11b7dbb71886af07ef87126037ebe98_85_1.png)\n\
    \n下载本页面的 Coder Raspberry Pi 镜像\n\n### 获取代码\n\n你需要从 Google Coder 下载 Coder 镜像，这是使用树莓派上的\
    \ Web 的一种新方法。\n\n### 树莓派特定说明\n\n如果你想在树莓派上使用 Coder，请使用网站上的说明下载并安装镜像到你的 SD 卡。安装完成后，插入以太网线并打开你的\
    \ Pi。等待片刻，你就应该准备就绪！\n\n### 获取 Google Coder\n\n1. 前往 Google Coder 网站，下载镜像的压缩版本。\n\
    2. 将其解压到任何你希望的位置，并使用 dd 安装，就像其他树莓派镜像一样。\n\n```bash\n$ dd if=[path to]/raspi.img\
    \ of=/dev/[path to SD card] bs=4M\n```\n\n### 插入你的 Pi\n\n1. 对于本教程，你只需将网线插入 Pi\
    \ 即可。插入你新写入的 SD 卡，接通电源并等待片刻。如果你已经连接了显示器，你会注意到树莓派的启动过程，然后进入命令行登录屏幕。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_85_2.png)\n\
    \n### 连接到 Coder\n\n1. 在主系统上打开浏览器，前往 http://coder.local。你可能需要手动接受许可证：它会要求你设置密码，然后你就进入并准备好开始编码了。\n\
    \n"
