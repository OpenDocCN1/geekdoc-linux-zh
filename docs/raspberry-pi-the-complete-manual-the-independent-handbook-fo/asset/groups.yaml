    # Command line basics


    # Command

    line basics


    Learn an alternative way to control your Raspberry Pi by using the command line
    and your keyboard


    We''ve probably all been there with the Raspberry Pi. You''ve installed Raspbian
    or another Raspberry Pi OS to your SD card and you''ve rushed through the setup
    script or not quite done your research. You start the operating system and...
    you end up at a command line. The first step here is to not panic: this is perfectly
    normal. It may just be a bit of a foreign concept to you, only seen in films with
    streetwise hackers who want to bring down ''the system''.


    The second step, at least in Raspbian''s case, is simply to type:


    ```

    $ start x

    ```


    That''s it. Raspbian will load up the desktop and you can start using the mouse
    again. Quick and painless in this case, and in that of many other operating systems
    as well. What you''ve done is use a command, specifically in this case to start
    the X server. The X server handles the graphical interface and can be turned off
    by default on some Pi systems.


    ![](img/f11b7dbb71886af07ef87126037ebe98_21_0.png)


    Fig 1: The terminal emulator allows you to access the command line while still
    being in the desktop environment


    +   **What you''ll need...**

    +   Raspbian

    +   www.raspberrypi.org


    > **Did you know...**

    > The command line remembers your last commands. Simply use the Up and Down arrows
    to use them.'
