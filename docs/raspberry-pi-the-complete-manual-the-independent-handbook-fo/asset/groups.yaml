    \n> 我们将带你了解使用树莓派控制 LED 所需的步骤，从设置到编码\n\n#### 组件概述\n\n-   **面包板**\n    面包板（或原型板）提供了一个易于使用和可重新配置的环境，用于创建和修改开发电路。\n\
    \n-   **面包板导线**\n    任何电路构建工程师的必备品，这些公对公和公对母导线使得电路构建快速且简单。\n\n-   **GPIO 接插件**\n\
    \    它提供了一种机制，既可以采集输入，也可以向电路提供输出，从而实现反应式程序设计。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_58_0.png)\n\
    \n-   **彩色 LED**\n    不同颜色的 LED 是一种直观地查看软件哪部分正在运行并帮助你理解程序流程的好方法。\n\n### 树莓派的引脚\n\
    \n01 在我们深入编写代码之前，让我们先看看树莓派上引脚的布局。如果你的树莓派在外壳中，请将其取出，并放在你面前，使 USB 端口朝右。在接下来的几个步骤中，我们将看看在使用\
    \ GPIO 端口时会遇到的一些用途。\n\n**树莓派版本 1 还是 2？**\n\n02 根据你购买树莓派的时间，你拥有的可能是版本 1 或版本 2 的型号。GPIO\
    \ 布局在两者之间略有不同，尽管它们的功能相同。这里我们使用的是版本 1；版本 2 在 2012 年末上市。\n\n### 引脚编号\n\n03 如果你看看板子左上角，你会看到一个白色的小标签，P1。这是\
    \ 1 号引脚，它的上方是 2 号引脚。1 号引脚的右边是 3 号引脚，3 号引脚的上方是 4 号引脚。这个模式一直持续到最后的 26 号引脚。如你在下一步所见，一些引脚有重要的用途。\n\
    \n**引脚用途**\n\n04 1 号引脚是 3V3，即 3.3 伏。这是本指南中我们将使用的主要引脚，为我们的 LED 提供电源。2 号和 4 号引脚是\
    \ 5V。6 号引脚是我们在此将使用的另一个引脚，它是地线（Ground）。其他地线引脚是 9、14、20 和 25。你应始终确保你的项目正确接地。\n\n\
    ### GPIO 引脚\n\n05 板上的其他引脚是 GPIO（通用输入/输出）。这些引脚用于当你项目变得更复杂和更具挑战性时需要执行的其他任务。请注意，USB\
    \ 电源无法为大型器件提供太多供电范围。\n\n**基本 LED 照明**\n\n06 好吧，让我们开始动手并制造点东西。首先，拿出你的面包板、两根导线、一个\
    \ 220Ω 电阻和一个 LED。注意 LED 一侧略微弯曲的引脚，这对后面很重要。确保你的树莓派已断开主电源。\n\n### 接线\n\n07 将一根导线插入\
    \ 1 号引脚，另一端插入面包板。注意，插入面包板的哪个位置并不重要，但确保其周围有足够的空槽，以便稍后添加 LED 和电阻。现在准备另一根导线。\n\n\
    ### 添加另一根导线\n\n08 将导线的母头端插入 6 号引脚（地线），另一端插入面包板，确保为电阻留出空间，具体取决于电阻的大小。接下来，准备好你的电阻。你可以使用比\
    \ 220 欧姆稍高或稍低的电阻，但如果不使用电阻，很可能会烧毁 LED。\n\n### 添加电阻\n\n09 接下来我们需要添加电阻。将电阻的一端放在面包板上接地线旁边，另一端放在\
    \ 3V3 导线连接槽下方的下一个槽位。当我们稍后添加 LED 时，它将位于 LED 旁边。注意，添加电阻没有正确或错误之分。\n\n### 添加 LED\n\
    \n10 拿起你的 LED，将“弯曲”引脚的一端放在面包板上 3V3 导线旁边。将另一根引脚放在电阻引脚对面、接地线旁边的槽位。这完成了电路，我们准备好测试这个小任务了。\n\
    \n### 通电\n\n11 现在拿起你的 micro-USB 线，将主电源端插入墙上的插座，或插入计算机或笔记本电脑端口（并确保已通电）。你应该能看到 LED\
    \ 亮起。如果没有，请检查面包板上的连接或尝试更换一个 LED。\n\n### 设置编程环境\n\n12 现在，我们需要做的不仅仅是打开灯光——我们希望能够通过代码控制它。设置一个新的\
    \ Raspbian 安装环境（相关指南见第 28 页）。你不需要 GUI——如果你愿意，一切都可以通过终端完成。在开始之前，最好通过以下命令检查所有内容是否都是最新的：\n\
    \n```bash\nsudo apt-get dist-upgrade\n```\n\n### 打开终端\n\n13 假设我们要使用 GUI，而不是通过\
    \ SSH 登录树莓派，请双击 LXTerminal 图标打开一个新的终端窗口。我们需要 root 权限来控制 LED，所以现在要么输入 `su`，要么记得在任何命令前加上\
    \ `sudo` 前缀。\n\n```bash\nsu\n# 或者在前缀中添加 sudo，然后输入密码\nsudo\n```\n\n### 下载 GPIO\
    \ 库\n\n14 有一个方便的 GPIO Python 库，使得操纵 GPIO 引脚变得轻而易举。在终端窗口中，使用 `wget` 下载 tarball\
    \ 文件，然后使用 `tar` 解压它。这将使我们在一个新目录中获得所有文件。\n\n```bash\nwget https://pypi.python.org/packages/source/R/RPi.GPIO/RPi.GPIO-0.5.2.tar.gz\n\
    tar zxf RPi.GPIO-0.5.2.tar.gz\ncd RPi.GPIO-0.5.2\n```\n\n### 安装库\n\n15 现在我们需要安装该库。这只需使用\
    \ Python 的安装方法即可，因此我们需要 Python 的 dev 版本。在运行此命令前，请确保你位于库的目录中。\n\n```bash\nsudo\
    \ apt-get install python-dev\nsudo python setup.py install\n```\n\n### 在脚本中导入库\n\
    \n16 创建一个新的 Python 脚本。接下来导入主要的 GPIO 库，并将它放在 try-except 块中。使用 Ctrl+X 保存文件并选择 'yes'。\n\
    \n```python\ncd /\ncd Desktop\nsudo nano gpio.py\ntry:\n    import RPi.GPIO as\
    \ GPIO\nexcept RuntimeError:\n    print('Error importing GPIO lib')\n```\n\n"
