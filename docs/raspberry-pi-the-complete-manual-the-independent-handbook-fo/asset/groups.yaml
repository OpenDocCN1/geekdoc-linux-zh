  mdcn: "\n\n## 构建 iBeacon 项目：使用信标工具包\n\n安装好应用程序后，打开它并点击“监听”。当你在周围移动手机或平板电脑时，iQ3 设备将显示\
    \ iBeacon 的位置，你可以利用此信息来了解信号强度，并预期 iBeacon 会在何处被目标应用程序或服务识别。\n\n但这该如何使用呢？其实，iBeacon\
    \ 技术有点像某种 NFC，但不需要近场接触。这自然会带来一些安全顾虑，因此请谨慎使用……\n\n## 在 Android 上扫描 iBeacon\n\n\
    对于计划与其树莓派 iBeacons 进行通信的 Android 用户，有多种应用程序可供选择。这些包括 Locate Beacon、Beacon Detector\
    \ 和 Beacon Scanner。除了兼容 iBeacon 外，它们还支持 Eddystone（iBeacon 的 Android 替代方案）和 AltBeacon（一种开放规范的\
    \ iBeacon 替代方案）。在相对页面的左下角展示的是 iBeacon & Eddystone Scanner（又称 Beacon Scanner），只需按下简单的按钮即可扫描附近的信标。一旦找到\
    \ iBeacon，应用会显示实时信息，点击这些信息后，将显示更详细的数据集。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_96_0.png)\n\
    \n## 值得考虑的 PiBeacon 项目\n\n可以开发各种基于树莓派的 iBeacon 项目，包括任何可协助你计划中的智能家居构建的系统。其中包括车库门自动化、开启诸如台灯这样的设备，或者仅仅是追踪你树莓派的位置。请注意，绝大多数项目将适用于你正在使用的任何移动设备，因此在研究此类项目时，请忽略检测的平台特定细节。为了帮助你入门，我们将使用本教程的剩余部分来介绍几个你今天就可以构建的\
    \ iBeacon 项目。\n\n## 让你的 iBeacon 更智能\n\n你可以通过智能手机和树莓派之间的一些智能交互，将 iBeacon 的功能进一步提升，但你应该从哪里开始？与其一头扎进\
    \ DIY 任务，不如花点时间找到适合你智能手机的正确应用程序——一个能让你根据 iBeacon 的存在来启动特定应用程序的应用程序。\n\n我们上面提到的工具仅用于检测和测量，它们揭示的数据对于开发触发应用非常有用。但当你的手机靠近\
    \ iBeacon 时，你如何启动一个应用程序呢？\n\n## iBeacon 不能做什么\n\n就目前的情况而言，好也罢坏也罢，你并不是在菲利普·K·迪克的小说里。这意味着（至少在）目前，iBeacon\
    \ 技术无法在没有第三方工具（如上面提到的那些）的情况下在你的手机上启动网页。\n\n在未来可预见的将来，这种功能可能会集成到 iOS 或 Android\
    \ 中，这是并非不可能的事情。在这种情况下，当你经过 iBeacon 时，手机上可能会显示一则广告，甚至可能包含在广告商店购物的折扣。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_97_0.png)\n\
    \n## iBeacon 触发应用\n\n无论你使用的是 iOS 还是 Android，你都会在相应的应用商店中找到一款触发应用，它可以设置为当你的智能手机接近你的\
    \ iBeacon 时启动一个应用。Android 用户应该看看 NFC Beam，这是一款免费从 Google Play 获取的应用，旨在适用于配备蓝牙\
    \ 4.0 硬件并运行 Android 4.3 或更高版本的设备。同时，iOS 用户应该看看 Beacon，这是一款在 App Store 中售价很低（£1.59）的应用。该应用支持\
    \ IFTTT、Philips Hue、HomeKit 和 Lux 灯光集成。\n\n> “无论你使用的是 iOS 还是 Android，你都会在相应的应用商店中找到一款触发应用”\n\
    \n## 选择 iBeacon 还是 NFC\n\n你也许现在已经意识到，iBeacon 和 NFC 在用途上有一些相似之处，尤其是在智能家居应用方面。\n\
    \n那么，对于你的项目，我们应该使用哪一个呢？\n\nAdept 生产了一种 NFC 分线板，可以为树莓派增加 NFC 功能，这对于任何需要 NFC 标签和硬件之间接触的项目都非常有用——我们从\
    \ ModMyPi 那里获取了我们的分线板。而这正是区别所在。如果你的项目需要物理接触，那么你应该使用 NFC。否则，iBeacon 解决方案应该完全足够。\n\
    \n## 项目\n\n## 为智能家硬件做准备\n\n虽然 PiBeacon 是智能家居的一个非常有益的补充，但它并不是立竿见影的万能药。虽然你可能想用它来打开你的车库门——也许通过一个\
    \ IFTTT 命令，当你的智能手机接近时发送——如果没有连接到树莓派的正确机械硬件，这种功能根本无法实现。\n\n同样，你需要在 PiBeacon 中使用合适的电子硬件，以帮助开启和关闭连接的设备，例如台灯。PowerSwitch\
    \ Tail II 就是这样一种设备，随附跳线连接器，可用于将其连接到你的树莓派 GPIO。\n\n> *下：方便的是，该项目几乎与每一款树莓派都兼容，包括\
    \ Pi Zero*\n\n## 让你的 PiBeacon 具备防风雨功能\n\n使用信标技术的智能家居项目可能需要进行一定的防风雨处理。例如，这可能意味着将树莓派安全地固定在合适的全天候外壳内部，或者将其放置在某个有遮蔽的地方，远离外界环境。\n\
    \n此外，如果没有标准电源可用，你需要增加一个电池组。你可以考虑标准的便携式 USB 电源，或者更喜欢使用 5V 解决方案，例如在 LUD6 第 154 期中演示的那样。该期杂志解释了如何用\
    \ AA 电池为树莓派供电，并涵盖了包含 UBEC（一种保护树莓派免受电池损坏的电压调节器）的介绍。\n\n## 低轮廓的 PiBeacon\n\n得益于\
    \ PiBeacon 项目实际上只需要电源和 USB 蓝牙 BLE 无线接收器这一事实，你可以依赖功能较少或较不流行的树莓派设备用于任何 PiBeacon\
    \ 项目。\n\n如果你家里有一台旧的 Model A 或 Model A+，那将是最理想的。如果你足够幸运，以 £4 的价格买到了树莓派 Zero，那也很适合。你额外需要的只是一个\
    \ USB 转 micro-B USB 适配器，然后将其连接到 Pi Zero 的 micro-B USB 数据端口。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_98_0.png)\n\
    \n## 构建一个始终在线的迅雷盒子\n\n### 你需要的东西……\n\n- 一个便携式硬盘\n- **Raspbian**\n  - www.raspberrypi.org/downloads\n\
    - **带有桌面环境和 Deluge 的 PC**\n  - www.deluge-torrent.org\n\n## 构建一个始终在线的迅雷盒子\n\n\
    使用低功耗迷你迅雷盒子，更快地获取最新的发行版、软件包和测试版本。\n\n通过迅雷（Torrent）获取你的开源软件有很多优势——它可能更快，减轻带宽压力，并允许你向社区回馈。发行版、软件包等均可通过迅雷获取，而树莓派是一个很好的小巧、低瓦特、始终在线的迅雷盒子，可以更好地管理你的文件。\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_99_0.png)\n\n## 安装 Raspbian\n\nRaspbian\
    \ 对于我们的迅雷盒子运行得非常完美。将镜像安装到 SD 卡上，并完成基本设置过程，确保在高级选项中启用 SSH 并禁用桌面。\n\n## 远程访问\n\n\
    在树莓派的命令行中输入 `ifconfig` 以查找 IP 地址。此时你可以拔掉显示器并在远程设置它，但无论如何，你现在都可以通过输入以下内容来访问树莓派：\n\
    \n```bash\n$ ssh [user]@[IP address]\n```\n\n……并输入密码登录。\n\n![](img/f11b7dbb71886af07ef87126037ebe98_99_1.png)\n\
    \n> “树莓派是一个很好的小巧、低瓦特、始终在线的迅雷盒子，可以更好地管理你的文件”\n\n"
