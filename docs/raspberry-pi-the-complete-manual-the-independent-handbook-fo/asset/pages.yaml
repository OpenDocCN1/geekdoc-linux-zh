    \ ampm = \"PM\";\\n}\\nelse {\\n    var hour = hours;\\n    var ampm = \"AM\"\
    ;\\n}\\nif (hours == 12) {\\n    var ampm = \"PM\";\\n}\\nif (mins < 9) {\\n \
    \   var min = mins;\\n}\\nelse {\\n    var time = \"0\" + mins;\\n}\\nvar time\
    \ = \"The time is \" + hour + \".\" + min + \" \" + ampm;\\n$(\"h2\").html(time);`\n\
    ```\n\n> “Coder is a Raspbian-based image that turns your Raspberry Pi into a\
    \ web server and web development kit. It’s an easy and great way to further your\
