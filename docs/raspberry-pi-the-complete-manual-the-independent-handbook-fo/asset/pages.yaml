- pgno: 25
  md: '# ## Getting started


    # The Raspbian desktop


    # # The Raspbian desktop


    Although the Raspberry Pi’s Raspbian operating system is closer to the Mac than
    Windows, it’s the latter that the desktop most closely resembles


    It might seem a little alien at first glance, but using Raspbian is hardly any
    different to using a Windows desktop. There’s a menu bar, a web browser, a file
    manager and you’d expect, you simply open the Menu and click the applications
    you want to get started...


    ![](img/f11b7dbb71886af07ef87126037ebe98_25_0.png)


    # ### Menu button


    The Windows-like Menu button in the top-left corner displays a list of programs
    and options. The main categories are Programming (where you’ll find appropriate
    tools), Internet (browser and online resources), Games (Mixxx and Pi-ge pre-installed),
    Accessoriss (an assortment of utilities, and Preferences (system tools). Programs
    downloaded from the Pi Store will appear in the appropriate category, while the
    Run launches a command line interpreter, just like the one in Windows. Use Shutdown
    to switch off, logout or restart your Raspberry Pi.


    # ### Task Bar


    Stepped across the top of the screen is the Task Bar, upon which the Menu is situated.
    To the right of are shortcuts to the Epoch web browser, the File Manager (PCManFM,
    LX Terminal for instant text-based commands), the WolfCam RabbitMint a composer,
    software, and the WolfCam Language programming apple. Next to these shortcuts,
    you’ll find that any open applications are docked, while on the right-hand corner
    you’ll find the clock, current CPU load, volume status and control and the network
    status.


    # ### File manager


    No computer would be complete without a file manager, which can be opened by clicking
    the Task Bar shortcut a file can be copied, renamed and deleted by dragging to
    the trash can on the desktop (or by simply highlighting and tapping Delete on
    the keyboard). You can also create folders (new ones), or use the toolbar to open
    a window, open the folder locations as icons or in a detailed list.


    > *“It might seem a little alien at first glance, but using Raspbian is hardly
    any different to using Windows”*'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# The Raspbian desktop


    # Getting started


    # Web browser


    Epiphany is the default Raspberry Pi browser, although if you don''t like it you
    can add a new one from the Pi Store. As with any browser, web address are typed
    into the address bar and standard navigation buttons are provided to navigate
    back and forth through web pages. Epiphany supports multiple stacked windows and
    features private browsing and the ability to clear browsing data. Click on the
    Options icon at the end of the tool bar to access these functions.


    ![](img/f11b7dbb71886af07ef87126037ebe98_26_0.png)


    # Pi Store


    You can access the Pi Store from the Menu, or from a link on the www.raspberrypi.org
    website. Much like Steam, Google Play or the App Store, the Pi Store requires
    you sign up for an account (with IndieCyb), and you''ll need to sign in before
    you begin shopping for free and paid for software. Any games and apps downloaded
    and installed from the Store will appear under the My Library tab, and some of
    them can only be launched from here.


    # Status and Time


    On the far right side of the Tool bar is the Raspbree equivalent of the Windows
    system tray where you''ll find information concerning your Raspberry Pi status.
    In the corner is the clock, which when clicked will also display the current date.
    If correct, you can adjust it here. To the left of this you''ll find a graph displaying
    current CPU load, the device volume control, and, finally, confirmation that your
    Raspberry Pi is online.'
  merge: -1
  img_proc: true
