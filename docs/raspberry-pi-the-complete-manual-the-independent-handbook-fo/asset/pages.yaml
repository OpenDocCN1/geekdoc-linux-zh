- pgno: 53
  md: '# Projects


    # Create a Snake clone in Scratch


    # Handle movement


    09 Now handle the typical case where there is no collision and the snake must
    move in its current direction. The pen is down so it will draw the body. The Speed
    variable determines how many steps to move. Add the current direction to the Next
    Direction list for the tail to read.


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_1.png)


    # Try out the snake


    10 You can now try out your Snake sprite. It will move around the screen in response
    to pressing the arrow keys. It will draw its body, which will just get longer
    and longer because we need the tail to erase it. And it will stretch and end the
    game on detecting a collision.


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_2.png)


    # Paint the tail


    11 Click the New Sprite Paintbrush icon to paint the Tail sprite. Draw a small
    green circle to represent the end of the tail. Name this sprite Tail. The Tail
    sprite will follow the Snake and erase the end of its tail so that the snake body
    doesn''t grow indefinitely.


    # Make a Grow variable


    12 Make a Grow variable which is for this sprite only – no other sprites need
    access to it. The Grow variable is used to determine when the snake body needs
    to grow and the tail therefore needs to remove it so before following to allow
    the head to get further ahead.


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_3.png)


    # Handle events


    13 The Tail needs to listen for two new events which you create as you need them.
    When it receives an Egg Eater event from one of the Egg sprites, it sets Grow=1
    so that the tail can pause. And when it receives a Game Over event from the Snake,
    it must freeze.


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_4.png)


    # Initialise the tail


    14 When the green flag is clicked to start the game, Grow is set to 1 so the snake
    gets a short body. Move to the centre of the stage with the pen up and configure
    the pen to draw a trail the same colour and size as the stage background so that
    it erases the body.


    # Grow and move


    15 Use a ''forever'' command to keep the tail moving. If Grow is 1 it should pause
    and reset Grow to 0 – this makes the body grow longer. Use the first value from
    Next Direction to set the direction and remove it so you get a new value next
    time. Move Speed steps.


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_5.png)


    # Try out the tail


    16 Now you can try out the Tail sprite. The Snake won''t keep growing yet because
    it won''t receive any Egg Eater events. But the tail will follow the snake head
    around the stage, erasing the snake body as it goes by drawing over it with a
    white pen (which is the same colour as the background).


    ![](img/f11b7dbb71886af07ef87126037ebe98_53_6.png)'
