    \ The operating can take some time. Reboot your system to see the changes.\n\n\
    and ensure good airflow around your Pi.\n\nIf you see any noticeable instability,\
    \ run this wizard again and set the clock speed back down to something slightly\
    \ lower – repeat until your system is completely stable. For the scope of this\
    \ tutorial, a Modest/ Medium overclock is recommended – it seems to give a little\
    \ extra performance with no noticeable side effects. It is also recommended to\
    \ re-boot your system after making this change. Hold the Shift key to temporarily\
    \ disable overvoking\n\nstart X automatically, on boot. Set this option to “Yes”\
    \ to enable this behaviour by default.\n\nYou can obviously revert at any time\
    \ to return to a text-based login where you have to start manually.\n\n```\nI\
    \ startx\n```\n\n# Configure your location\n\n**03** Locale is the language and\
    \ regional settings that your Pi is using – while this generally has little impact\
    \ on what you use, it is also responsible for any default currency settings, etc,\
    \ so could prove to be an irritant at a later time if wrong.\n\nUpon selecting\
    \ the option, you’ll be taken through a wizard. Use the arrow keys to check the\
    \ default locale before building more (it takes a while). Timezone will take you\
    \ to a tzdata screen where you can adjust it.\n\n# Change the memory split\n\n\
    **05** Changing the memory split of the Pi allows you to give either the system\
    \ or the graphics processor a larger amount of memory.\n\nThe value you give it\
    \ must be either 16/32/64/128/256. Here are our recommendations:\n\n+   - 32MB\
    \ GPU memory for basic distro usage where video and 2D rendering aren't required\n\
    +   - 64MB GPU memory for desktop use that requires video playback or have 3D\
    \ effects enabled.\n+   - 128MB GPU memory for graphical applications and games\
    \ that do extensive multimedia or play 3D rendered games.\n+   \n+   For most\
    \ people, a 64MB split for graphics will suffice.\n\n# Tum overscan on and off\n\
    \n**07** You have had noticed one of two behaviours if you're using your Pi with\
    \ a modern HDTV. There is a black border the whole way around the image output\
    \ by the Pi – it just doesn't fit correctly. This is caused by underscan.\n\n\
    If you can't see the edges of your screen to get that they you're suffering from\
    \ overscan.\n\nYou may have the former issue, you may need to either turn on overscan,\
    \ or enable a \"zoom\" mode or similar on your TV.\n\nYou've have the latter issue,\
    \ you need to turn overscan off so that you can see the edges.\n\n# Overclock\
    \ your Pi\n\n**04** You can set the clock speed and voltage of your Pi to several\
    \ different presets. Setting the clock speed and voltage at higher rates that\
    \ the specification may cause instability, so do so in small increments.\n\n#\
    \ Change boot behaviour\n\n**06** By default, the Raspbian distro will boot into\
    \ a command-line interface, whereby you have to first log in by “pi”.\n\nIf then\
    \ want to run a window manager (in this case, it's called “X”), you have to give\
    \ the system a command to let it know that's what you want to do.\n\nFor a lot\
    \ of people this isn't really ideal since command lines scare them. Because of\
    \ this, there's an option to\n\n# Update raspi-config\n\n**08** The raspi-config\
    \ tool receives updates from time to time. This is general to either add more\
    \ features or fix small bugs, or both.\n\nIt's not a bad idea to run the updater\
    \ when you use the tool – before you start changing any system settings. While\
    \ it's much more likely that it'll be updated to look better or do more things,\
    \ it's not impossible there could be miscellaneous bug fixes hidden within that\
    \ would otherwise cause you some grief.\n\nRemember, though, when you're trying\
    \ to update your Pi you need an active internet connection, either through an\
