- pgno: 74
  md: "# Send an SMS from your Raspberry Pi\n\n# Set up your Twilio account\n\n+ \
    \  The first step of this project is to register for a Twilio account and Twilio\
    \ number. This is free and will enable you to send an SMS to a registered, verified\
    \ phone. Once signed up, you will receive a verification code via SMS to the registered\
    \ phone. When prompted, enter this onto the Twilio site to authenticate your account\
    \ and phone. Go to twilio.com/try-twilio and create your account now.\n\n# Register\
    \ numbers\n\n+   Your Twilio account is just a trial account, unless you pay the\
    \ upgrade fee, which means you can only send and receive communications from a\
    \ validated phone number. Enter the phone number of the contact who you want to\
    \ verify, ensuring that you select the correct country code. Twilio will test\
    \ you a verification code and you will need to enter it into the website form\
    \ and press submit.\n\n# The dashboard\n\n+   Once registered and logged in on\
    \ Twilio, visit the page, which will display your AccountSID and your Auth Token.\
    \ These are both required to use the Twilio REST. Keep these secure and private,\
    \ but be sure to make a note of them as you will need them for your Python program\
    \ later.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_74_0.png)\n\n# Install the\
    \ software\n\n+   Now boot up your Raspberry Pi and connect it to the internet.\
    \ Before you install the Twilio software, it is worth updating and upgrading your\
    \ Pi. In the LX Terminal, type sudo apt-get update, then sudo apt-get upgrade.\
    \ Once complete, type sudo easy_install twilio or sudo pip install twilio to install\
    \ the software. If you need to install Pi, type sudo apt-get install python-pip,\
    \ python-dev, press Enter, then type sudo pip install -U pip\n\n# Twilio authentication\n\
    \n+   Now you are ready to create the SMS program that will send the text message\
    \ to your mobile phone. Open your Python editor and import the Twilio REST libraries\
    \ (line one, below). Next, add your AccountSID and Auth Token, replacing the X’s\
    \ with yours, as you will find on your dashboard\n\n```\n```\nfrom twilio.rest\
    \ import TwilioRestClient\n\naccount_sid = \"XXXXXXXXXXXXXXXX\"\nauth_token =\
    \ \"XXXXXXXXXXXXXXXX\"\n```\n```\n\n# Create your message\n\n+   You will probably\
    \ want to be able to change your text messages rather than send the same one.\
    \ Create a new variable in your program called message. This will prompt you to\
    \ enter the phrase that you want to send to the mobile phone. When the program\
    \ runs, this is the message that will be sent.\n\n```\n```\nmessage = raw_input(\"\
    Please enter your message\")\n```\n```\n\n# Projects\n\n# Add your numbers\n\n\
    +   To send the message, you need to add the code line below and your two phone\
    \ numbers. The first number is your mobile phone number, which is registered and\
    \ validated with Twilio (Step 2). The second number is your Twilio account number,\
    \ which can be retrieved from your dashboard page under ‘Call the Sandbox’ number.\
    \ Change the Sandbox number to your country location and remember to add the international\
    \ country code.\n\n```\n```\n| message = client.messages.create(to=\"4479XXXXXXXXXX\"\
    , from_=\"444XXXXXXXXX\", body=message)\n```\n```\n\n# Send the message\n\n+ \
    \  Now send your message. The code below is not required, but is useful to indicate\
    \ your message has been sent. Add the lines and save your program. Ensure your\
    \ Raspberry Pi is connected to the internet and that your mobile is on, then run\
    \ your program. You have just texted from your Raspberry Pi!\n\n```\n```\n| print\
    \ message.sid\n| print \"Your message is being sent\" \n| print \"Check your phone\"\
    \ \n```\n```\n\n# Other APIs and codes\n\n+   You can also create other communication\
    \ programs, such as making phone calls, recording a call, and texting data including\
    \ caller IDs and call duration. The API has also completed a wide range of programming\
    \ languages, including Ruby, PHP, Java and Node.js (twilio.com/api) to name a\
    \ few."
  merge: -1
  img_proc: true
