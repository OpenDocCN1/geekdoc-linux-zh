  md: "# Projects\n\n# Control lights with your Pi\n\n# Add some style\n\n+   13 CSS\
    \ is used to create and apply a 'button' style effect to the web page. Move back\
    \ to the Mobile_Lights folder and create a new folder named static. This is where\
    \ the CSS file is saved. Create another new text file and paste the code below,\
    \ which sets out the style\\nfor the web page. You can customise the colours of\
    \ the buttons from line 20 onwards. Save the file as style.css in the static folder.\n\
    \n```\nbody {\nposition: absolute;\nmargin: 0;\ntop: 0;\nright: 0;\nbottom: 0;\n\
    left: 0;\nfont-family: Arial, sans-serif;\nfont-size: 13px;\ntext-align: center;\n\
    }\n\ndiv {\n\ndisplay: block;\nwidth: 100%;\nheight: 50%;\n}\n\ndiv a {\nwidth:\
    \ 100%;\nheight: 200%;\ndisplay: block;\n}\n\ndiv.on {\nbackground: black;\n}\n\
    \ndiv.on a {\ncolor: white;\n}\n\ndiv.off a {\ncolor: black;\n}\n\nalink, avistited\
    \ {\ntext-decoration: none;\n}\n```\n\n# Putting it all together\n\n+   14 The\
    \ final part of the setup is to write the Python script that combines the index.html\
    \ and style.css files with the Energenie socket control code similar to the one\
    \ used in Step 7.\n+   \n+   Open IDLE and start a new window, add the following\
    \ code and save it to your Mobile_Lights folder naming it 'mobile_lights.py'.\
    \ Line 4 uses the route() decorator to tell Flask the HTML template to use to\
    \ create the web page. Lines 7 and 11 uses app.route('/on/') and app.route('/off/')\
    \ to tell Flask the function to trigger when the URL is clicked. In line 15 the\
    \ run() function is used to run the local server with our application. The `__name__\
    \ == __main__` makes sure the web server only runs if the script is executed directly\
    \ from the Python interpreter and not used as an imported module.\n\n```\nfrom\
    \ flask import Flask, render_template\nfrom ener genie import switch_on, switch_off\n\
    \napp = Flask(__name__)\n\n@app.route('/')\ndef index():\nreturn render_template('index.HTML')\n\
    \n@app.route('/on/')\ndef on():\nswitch_on()\nreturn render_template('index.HTML')\n\
    \n@app.route('/off/')\ndef off():\nswitch_off()\nreturn render_template('index.HTML')\n\
    \nif `__name__` = `__main__`:\napp.run(debug=True, host='0.0.0.0')\n```\n\n![](img/f11b7dbb71886af07ef87126037ebe98_83_0.png)\n\
    \n84"
