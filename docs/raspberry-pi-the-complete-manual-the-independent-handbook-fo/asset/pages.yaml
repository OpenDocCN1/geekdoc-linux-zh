- pgno: 31
  md: "Install and use packages\n\nWhat you’ll need... \n\n**Apt command help page:**\n\
    http://linux.die.net/man/8/apt\n\n**Apt-get help page:**\nhttp://manpages.ubuntu.com/manpages/lucid/man8/apt-get.8.html\n\
    \n# # Install and use packages\n\n> The Raspberry Pi is great, but it’s made better\
    \ with the software you install onto it\n\n![](img/f11b7dbb71886af07ef87126037ebe98_31_0.png)\n\
    \nOn its own, the Raspberry Pi is a near-perfect mini computer. It already contains\
    \ a wealth of educational software, a few games, some programming utilities and\
    \ a number of system tools. But, as with most computers, this is only the tip\
    \ of the proverbial iceberg. By installing more programs, you can do much more.\n\
    \nThese programs, known as *packages*, are as wide and as varied as the developers\
    \ who originally designed them. In Linux, if there’s a need for a particular program,\
    \ then someone develops one. They then put it out to the world and make the source\
    \ code freely available, hence ‘open source’. Once the program has been tested,\
    \ it will eventually make its way onto one of the many remote servers for that\
    \ particular Linux distro.\n\nThese remote servers, called repositories, or *repos*,\
    \ contain all the elements of your package in order for it to be downloaded and\
    \ installed onto your system. The process is very quick and easy once you know\
    \ how it’s done...\n\n```\n```\npi@raspberrypi / $ sudo apt-get\n```\n...\n```"
