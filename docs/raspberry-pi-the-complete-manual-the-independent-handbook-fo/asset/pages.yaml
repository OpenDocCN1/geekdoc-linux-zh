  md: "# Build a Raspberry Pi-powered car\n\n# Raspberry Pi-controlled car build process\n\
    \nTo help our toy car come to life using the latest web technologies and our credit\
    \ card-sized computer, we're going to need to make some pretty significant changes\
    \ to its workings. Fortunately, the most complex aspects of the build can be accomplished\
    \ with a couple of affordable purchases, namely a servo controller board to take\
    \ care of the steering and throttle, and a 5V battery pack to keep the Raspberry\
    \ Pi running smoothly.\n\n# Identify and remove old radio\n\n+   01  This project\
    \ is effectively replacing the car's nominal transmitter and receiver. Notice\
    \ the three sockets on the original receiver: one goes to the motor controller\
    \ and one to the steering servo. Some remote-control cars also have separate battery\
    \ for the electronics, but those (especially with an electronic speed controller\
    \ with BEC) get their 5V power supply directly from the speed controller, saving\
    \ on components.\n+   \n+   If you don't have a speed controller with 5V BEC,\
    \ you'll need to get a 5V supply elsewhere. Many shops sell 5V battery power supplies\
    \ - often as mobile phone emergency top-ups, www.modmypi.com sells a suitable\
    \ 5V battery power bank for under £20 and you should get a couple of hours of\
    \ use from your Raspberry Pi.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_111_0.png)\n\
    \n> Power up\n> The 5V battery pack keeps our Raspberry Pi running for a good\
    \ five hours\n\n# Servo control\n\nAdafruit PWM I2C servo driver board from www.modmypi.com\n\
    \n# Pi-powered\n\nThe Raspberry Pi fits front and centre to keep it as safe as\
    \ possible\n\n# Pick a car\n\nYou can use pretty much any affordable car for this\
    \ project"
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Build a Raspberry Pi-powered car


    **Projects**


    # Attach the servo cables to the new controller


    **02** We soldered our 16-channel DC servo controller board from www.modmypi.com
    as per its instructions and simply plugged channel 0 (steering) and channel 1
    (motor) headers onto it. These are six cables in total: the bottom two are ground;
    the middle two are the power and the top two are the PWM (pulse-width modulation)
    signals. This is a good time to think of places to mount the extra components
    and the best fixing method seems to be sticky-back Velcro.


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_0.png)


    # Connect the I2C bus to the Raspberry Pi


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_1.png)


    **03** We’re using the Raspberry Pi’s I2C bus to control the servo interface board,
    which only needs four cables – they all go between the Raspberry Pi and the servo
    controller board as pictured. Visit http://bit.ly/ N3nq4j for a tutorial on how
    to set up I2C on the Raspberry Pi.


    From top to bottom we need to use the 1_GND, 2_SCL, 3_SDA and 4_VCC, which map
    directly to the same ports on the Raspberry Pi. Essentially this is power, ground
    and two communication channels.


    # Hook it up to the Raspberry Pi


    **04** On a Rev 1 Raspberry Pi the cables look the same. Though the Rev boards
    have different labelling, the physical pins are in the same places. Bottom left
    (closest to the RPi power connector) is the 3.3V power; next to that is the SDA
    header, which is the data channel. Next to that in the bottom right is the SCL
    channel which controls the clock of the I2C devices. And finally – on the top-right
    port – is the Ground. We recommend printing a labelled image of the GPIO pins.


    # Overview of the main components


    **05** You should now have the servo board in the middle with the steering servo
    and speed controller on one side and the Raspberry Pi on the other. The motor
    is connected to the other end of the speed controller (that end should have much
    thicker wires); the speed controller also has two thick wires going to the main
    car’s battery – in this case a 7.2V NiCad. We now have two very separate power
    systems with the high current motors on one side and the low current electronics
    on the other. Let’s make sure it stays that way!


    # Find everything a home


    **06** We can now put it together. Use plenty of sticky-back Velcro, two strips
    of elastic bands to keep everything secure and tidy spaces in the car’s body to
    hide the wires where possible. While it is possible to stick or screw the Raspberry
    Pi directly to the car, we recommend to use at least the bottom half of a case
    for added protection and ease of access. Insert our SD card, network cable or
    Wi-Fi dongle and power supply. Sit back and admire your hacking skills!


    ![](img/f11b7dbb71886af07ef87126037ebe98_112_2.png)'
  merge: -1
  img_proc: true
