  md: "# Projects\n\nControl lights with your Pi\n\n# What you'll need...\n\n+   Pi\
    \ · Model B+ (control board) · with two sockets\n+   \n+   kit, by MapF0U\n+ \
    \  \n+   Desk lamp\n+   \n+   Accessories\n\n# Control lights with your Pi\n\n\
    The winter nights are getting longer; use a Pi and mobile device to remotely control\
    \ your lights\n\n# Did you know...\n\nEvery device on the Internet is assigned\
    \ an Internet Protocol address (IP address). This is a numerical code which is\
    \ used to locate and identify each device within a network which can contain many\
    \ thousands of devices. Most home-network IP addresses start with the numbers\
    \ 192.168, with your router being on 192.168.1.1.\n\nThe folks at Energenie have\
    \ created some genius plug sockets that can be turned on and off via your Raspberry\
    \ Pi. You can buy a starter kit which includes the RF transmitter add-on board\
    \ and two sockets to get you started. The add-on board connects directly to the\
    \ GPIO pins and is controlled with a Python library. Once everything is installed\
    \ and set up, your Raspberry Pi can be used with the Pi-mote to control up to\
    \ four Energenie sockets using a simple program. This tutorial covers how to set\
    \ up the software, the sockets and how to adapt the program so that it can run\
    \ on your mobile device.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_79_0.png)\n\
    \n**Remote control**\n\nTake control of your home environment using your smartphone's\
    \ browser\n\n**Light source**\n\nAny light source with a plug socket can controlled\
    \ remotely\n\n80"
