- pgno: 58
  md: "# Control an LED using GPIO\n\n# Projects\n\n**Breadboard**\nThe breadboard,\
    \ or prototyping board, provides an easy-to-use and reforetable environment for\
    \ creating and changing your development circuits\n\n**Breadboard wire**\nA must\
    \ for any building electrical engineer, these make-to-make-and male-to-female\
    \ wires make for fast and easy circuit building\n\n**GPIO header**\nThis provides\
    \ a mechanism for both gathering input and providing output to electrical circuits,\
    \ enabling reactive program design\n\n![](img/f11b7dbb71886af07ef87126037ebe98_58_0.png)\n\
    \n**Coloured LED**\nDifferent coloured LEDs are a great way to physically see\
    \ which part of the software is running and help you understand the program flow\n\
    \n# The Pi's pins\n\n+   01 Before we dive into writing code, let's take a look\
    \ at the layout of the pins on the Pi. If you have your Pi in a case, take it\
    \ out and place it in front of you with the USB ports on the right. Over the next\
    \ few steps we'll look at some of the uses you'll encounter when using the GPIO\
    \ port.\n+   \n+   **Pi revision 1 or 2?**\n+   02 Depending on when you purchased\
    \ your Pi, you may have a revision 1 or revision 2 model. The GPIO layout is slightly\
    \ different for each, although they do have the same functionality. Here we have\
    \ a revision 1; revision 2s became available towards the end of 2012.\n\n# Pin\
    \ numbers\n\n+   03 If you take a look at the top left of the board you will see\
    \ a small white label, P1. This is pin 1 and above it is pin 2. To the right of\
    \ pin 1 is pin 3, and above 3 is 4. This pattern continues until you get to pin\
    \ 26 at the end. As you'll see in the next step, some pins have important uses.\n\
    +   \n+   **Pin uses**\n+   04 Pin 1 is 3V3, or 3.3 volts. This is the main pin\
    \ you will be using in this guide to provide power to our LED. Pins 2 and 4 are\
    \ 5V. Pin 6 is the other pin we will use here, which is ground. Other ground pins\
    \ are 9, 14, 20 and 25. You should always ensure your project is properly grounded.\n\
    \n# GPIO pins\n\n+   05 The other pins on the board are GPIO (General Purpose\
    \ Input/Output) These are used for other tasks that you need to do as your projects\
    \ become more complex and challenging. Be aware that the USB power supply doesn't\
    \ offer much scope for powering larger items.\n+   \n+   **Basic LED lighting**\n\
    +   06 Okay, so let's get down to business and start making something. Firstly,\
    \ get your breadboard, two wires, a 220Ω resistor and an LED. Note the slightly\
    \ bent leg on one side of the LED, this is important for later on. Make sure your\
    \ Pi is unplugged from the mains supply."
  merge: -1
  img_proc: true
- pgno: 59
  md: "# Control an LED using GPIO\n\n# Wiring the board\n\n07 Plug one wire into\
    \ the number 1, pin, and the other end into the breadboard. Note that it doesn't\
    \ matter where on the breadboard you plug it in, but make sure there are enough\
    \ empty slots around it to add the LED and resistor to. Now get another wire ready.\n\
    \n# Add another wire\n\n08 Place the female end of the wire into pin number 6\
    \ (ground) and the other end into the breadboard, making sure to leave room for\
    \ the resistor, depending on how large it is. Next, get your resistor ready. You\
    \ can use a little higher or lower than 220 ohms, but not using a resistor at\
    \ all will likely blow the LED.\n\n# Add the resistor\n\n09 Next we need to add\
    \ our resistor. Place one end next to the ground wire on the breadboard, and the\
    \ other one slot below the 3V3 wire connection. This will sit next to the LED\
    \ when we add it in a second. Note that there is no connect or incorrect way to\
    \ add a resistor.\n\n# Add the LED\n\n10 Grab your LED and place the 'bent' leg\
    \ end next to the 3V3 wire in the breadboard. Place the other leg next to the\
    \ resistor leg opposite the ground wire. This now completes the circuit and we\
    \ are ready to test out our little task.\n\n# Power it up\n\n11 Now get your micro-USB5\
    \ socket and either plug the mains end into the wall, or plug it into a computer\
    \ or laptop port (and powered on). You should see the LED light up. If not, then\
    \ check your connections on the breadboard or try, or a different LED.\n\n\n\n\
    # Set up programming environment\n\n12 Now, we need to be able to do a little\
    \ bit more than just turn a light on – we want to be able to control it via code.\
    \ Set up a new Raspbian installation (a guide to this is found on page 28). You\
    \ don’t need a GUI for this – it can all be done via the terminal if you so wish.\
    \ Before starting, it’s best to check everything is up to date with:\n\n```\n\
    ```bash\nsudo apt-get dist-upgrade\n```\n```\n\n# Open up terminal\n\n13 Assuming\
    \ we want to use the GUI, rather than SSH into the Pi, open up a newx terminal\
    \ window, by double-clicking on the LXTerminal icon. We need root access to control\
    \ the LEDs, so either enter su now, or remember to prefix any commands with sudo.\n\
    \n```\n```bash\nsu\nsudo\n```\n```\n\nsudo, followed by password or add it to\
    \ the start of each command\n\n# Download GPIO library\n\n14 There is a handy\
    \ GPIO Python library that makes manipulating the GPIO pins a breeze. From within\
    \ your terminal window, use wget to download the tarball file, then extract it\
    \ using tar. This will give us all the files in a new directory.\n\n```\n```bash\n\
    wget https://pypi.python.org/packages/source/R/RPi.GPIO/RPi.GPIO-0.5.2.tar.gz\n\
    tar zxf RPi.GPIO-0.5.2.tar.gz\ncd RPi.GPIO-0.5.2a\n```\n```\n\n# Install the library\n\
    \n15 Now we need to install the library. This is simply a case of using Python’s\
    \ install method, so we need the dev version of Python. Make sure you are in the\
    \ directory of the library before running this command.\n\n```\n```bash\nsudo\
    \ apt-get install python-dev\nsudo python setup.py install\n```\n```\n\n# Import\
    \ the library in a script\n\n16 Create a new Python script. Next import the main\
    \ GPIO library and we’ll put it in a try-except block. Save the file using Ctrl+X\
    \ and choosing 'yes'.\n\n```\n```bash\ncd /\ncd Desktop\nsudo nano gpio.py\ntry:\n\
    \    import RPi.GPIO as GPIO\nexcept RuntimeError:\n    print('Error importing\
    \ GPIO lib')\n```\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Control an LED using GPIO




    # Did you know...


    The official Python docs are a great resource for beginners and **professionals**
    alike: http://python.org/doc.


    # Test the script


    17 ➡ Now to make sure that the script imported okay, we just need to run the python
    command and then tell it the name of the script that we just created. If all goes
    well, you shouldn’t see any error messages. Don’t worry if you do, though. Just
    go back through the previous steps to check everything is as it should be.


    ```

    $\texttt{\$ sudo python gpio.py}$

    ```


    # Set GPIO mode


    18 ➡ Reload the script in nano again. We will then set the GPIO mode to BOARD.
    This method is the safest for a beginner to adopt and will work whichever revision
    of the Pi you are using. It’s best to pick a GPIO convention and stick to it because
    this will save confusion later on.


    ```

    $\texttt{\$ sudo nano gpio.py\newline\$ GPIO.setmode(GPIO.BOARD)}$

    ```


    # Set pin mode


    19 ➡ A pin has to be defined as either an input or an output before it can work.
    This is simplified in the GPIO library by calling the GPIO.setup method. You then
    pass in the pin number, and then GPIO.OUT or GPIO.IN. As we want to use an LED,
    it’s an output. You’ll be using these conventions frequently, so learn them as
    best you can so they soak in!


    ```

    $\texttt{\$ GPIO.setup(12, GPIO.OUT)}$

    ```


    # Using PWM


    20 ➡ The next step is to tell the pin to output and then set a way of escaping
    our program. Here we recall the GPIO class again and then the PWM method, passing
    in the pin number, the second value is the frequency in hertz – in this case,
    0.5.


    ```

    $\texttt{\$ p = GPIO.PWM(12, 0.5)\newline\$ p.start(1)\newline\$ input(’Press
    return to stop:’)\newline\$ p.stop()\newline\$ GPIO.cleanup()}$

    ```


    # Adjust PWM


    21 ➡ To add a timer to the LED so it fades out, we first need to import the time
    library and then set the 12 pin to have 50Hz frequency to start off with.


    ```

    $\texttt{\$ import time\newline\$ import RPi.GPIO as GPIO\newline\$ GPIO.setmode(GPIO.BOARD)\newline\$
    GPIO.setup(12, GPIO.OUT)\newline\$ p = GPIO.PWM(12, 50) # channel=12 frequency=50Hz\newline\$
    p.start(0)}$

    ```


    # Add the fade


    22 ➡ Then we add in another try-except block, this time checking what power the
    LED is at – and once it reaches a certain level, we reverse the process. To run
    this code, simply save it into main and then sudo python gpio.py.


    ```

    $\texttt{\$ while 1:\newline\newline    for dc in range(0, 101, 5):\newline        p.changeDutyCycle(dc)\newline        time.sleep(0.1)\newline        for
    dc in range(100, -1, -5):\newline            p.changeDutyCycle(dc)\newline            time.sleep(0.1)\newline    except
    KeyboardInterrupt:\newline        pass\newline\newline p.stop()\newline\newline
    GPIO.cleanup()}$

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_60_0.png)


    > “Well set the GPIO mode to BOARD. This will work whichever revision of the Pi
    you are using”'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Projects




    # What you''ll need...


    **Raspbian**

    www.raspberrypi.org/downloads


    **SD card**


    # Supercharge your Pi


    > Get the most out of your Raspberry Pi with these performance-enhancing tips
    and tricks


    Your Raspberry Pi is plugged in, Raspbian is installed on the SD card and you
    are right in the middle of setting up a wireless print server or building a robot
    to collect your mail from your doormat. But are you truly getting the most from
    your little computer? Perhaps you haven''t explored the full set of options in
    Raspbian, or you''re running the entire OS from SD card, something that can reduce
    SD card lifespan. Various tools and techniques can be employed to improve performance,
    from choosing the right hardware to overclocking the CPU. You might even maximise
    storage space on the Pi''s SD card or all but replace it with a secondary device.
    Use these tips and tricks to reconfigure your Pi setup and optimise software and
    hardware to ensure you get the best performance.


    ![](img/f11b7dbb71886af07ef87126037ebe98_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/f11b7dbb71886af07ef87126037ebe98_62_0.png)


    # Use better

    storage hardware


    01 Your choice of storage media can have an impact on your Raspberry Pi''s performance,
    regardless of the operating system. A low capacity SD card with poor error correction,
    is going to be slower than a large card with greater resilience, so you need to
    find the right balance for your project and shop wisely.


    # Choosing the best SD card


    02 Various standards of SD card are available, with the more expensive ones designed
    for better error correction. For the best performance on your Raspberry Pi, choose
    an SDHC card with a high rating. The same advice applies to MicroSD cards, which
    you can use on your Raspberry Pi with an SD card adaptor or directly insert into
    a Raspberry Pi B+.


    # Make the most of your SD card


    03 You''ll typically need 1-2GB of storage for your chosen Raspberry Pi distro,
    so any remaining storage on your SD card will be used for updates and data you
    create or save. In Raspbian you can open a command line and run the configuration
    utility to gain more space (only if your SD card''s greater than 2GB).


    ```

    sudo raspi-config

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_62_1.png)


    # Expand the Raspbian partition


    04 Maximising the partition affords the full capacity of your SD card, which will
    increase the media''s lifespan (there is more space to write to, so the same sectors
    aren''t being overwritten as often). With raspi-config running, use the arrow
    keys to select expand_roots in the menu. Then wait briefly while the partition
    is resized.


    # Write data to RAM


    05 Rather than reading and writing data to your SD card – something that will
    eventually result in a deterioration of reliability and performance in the card
    – you can configure Raspbian to write to the system RAM, which will speed things
    up slightly and improve the SD card''s overall performance. This is achieved using
    fstab file systems table), a system configuration available in most Linux distros.


    # Enable fstab in Raspbian


    06 This is much like creating a RAM disk in Windows. In the command line, enter:


    ```

    sudo nano /etc/fstab

    ```


    Add the following line to mount a virtual file system:


    ```

    tmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=50m 0 0

    ```


    Follow this by saving and exiting nano (Ctrl+x), then safely restarting the Pi:


    ```

    sudo shutdown -r now

    ```


    > “You''ll typically need 1-2GB of storage for your chosen Raspber ry Pi distro.”'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# # Projects\n\n# ## Picking an external USB drive\n\nSpeeding up your Raspberry\
    \ Pi by migrating the root filesystem to an external USB drive is a start, but\
    \ what sort of device should you use for the best performance? With a USB thumb\
    \ drive you can add flash storage up to 16GB without running into any significant\
    \ problems (the larger the drive, the greater the current is required to read/write).\
    \ Anything larger is expensive and unnecessary. If you’re planning to use an external\
    \ HDD, there are no power issues as it will have its own power supply. As ever,\
    \ your choice should suit your project.\n\n# ## Supercharge your Pi\n\n# ### Configure\
    \ fstab for fast performance\n\n+   07  Upon restarting, the virtual filesystem\
    \ will be mounted and /var/log on the RAM disk. Other directories that can be\
    \ moved to RAM include:\n+   \n+   `tmpfs /tmp tmpfs defaults,noatime,nosuid,size=1@0m\
    \ 0 0`\n+   `tmpfs /var/tmp tmpfs defaults,noatime,nosuid,size=30m 0 0`\n+   `tmpfs\
    \ /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=10@0m 0 0`\n+   `tmpfs\
    \ /var/run tmpfs defaults,noatime,nosuid,mode=0755,size=2m 0 0`\n+   `tmpfs /var/spool/1mqueue\
    \ tmpfs defaults,noatime,nosuid,mode=07@0,gid=12,size=30m 0 0`\n+   \n+   Add\
    \ each to /etc/fstab in nano.\n\n# ### Move your OS to a HDD\n\n+   08  If you’ve\
    \ concerned about the lifespan of the SD card, why not reduce your Raspberry Pi’s\
    \ reliance on it? Instead of using the SD card as a sort of budget SSI, change\
    \ its role and add a HDD or USB stick to run the operating system, leaving the\
    \ SD card for bootstrapping. This can give a marked performance boost to the SD\
    \ card.\n\n# ### Back up the SD card\n\n+   09  Create a copy of your Pi’s SD\
    \ card. Shut down, remove the card and insert it into your desktop computer. In\
    \ the command line, run\n+   \n+   `sudo dd bs=4M if=/dev/sdb of=~/backup.img`\n\
    +   \n+   The path /dev/sdb represents the SD card. Copying takes 5-10 minutes.\
    \ When complete, remove the SD card and connect your USB device.\n\n# ### Copy\
    \ Raspbian to USB\n\n+   10  Using a blank Ext4-formatted USB thumb drive (or\
    \ external HDD) as the destination drive, enter\n+   \n+   `sudo dd bs=4M if=~/backup.img\
    \ of=/dev/sdc`\n+   \n+   Leave the backup on your computer, just in case something\
    \ goes wrong. With an SD card and USB storage device sharing an identical disk\
    \ image, it’s time to consider what you’re going to do next – create a faster\
    \ Raspberry Pi,\n\n![](img/f11b7dbb71886af07ef87126037ebe98_63_0.png)"
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Split the Raspbian partitions\n\n+   11 Ideally, the boot partition should\
    \ remain on the SD card while the root file system is run from the external HDD\
    \ or USB thumb drive. Using your preferred partition manager (Disk Utility is\
    \ a most distros), unmount and delete the root file system from the SD card, ensuring\
    \ you have retained the boot partition. After removing the SD card, connect your\
    \ USB device and delete the boot partition, taking care to leave the root file\
    \ system intact. Then resize the root file system on the USB device, making sure\
    \ that 10MB remains.\n\n# Identify the root file system\n\n+   12 You’re going\
    \ to have the SD card and the external USB storage connected, so you need to tell\
    \ the Pi where the root file system is. On the desktop Linux computer with your\
    \ SD card inserted, run:\n+   ```\n+   sudo nano /boot/cmdline.txt\n+   ```\n\
    +   Find root=IDE/mbcmb102 (or similar) and change that to read root=/dev/sda2\
    \ which is your external USB storage. Save and exit.\n\n# Add other USB devices\n\
    \n+   13 You can now restart your Pi with the storage devices attached, but as\
    \ soon as you connect further USB media you’ll suffer problems. Avoid by installing\
    \ gdisk: \n+   ```\n+   sudo apt-get update\n+   ```\n+   Then run gdisk:\n+ \
    \  ```\n+   sudo apt-get install gdisk\n+   ```\n+   Then run gdisk:\n+   ```\n\
    +   sudo gdisk /dev/sdb\n+   ```\n+   Press ? to display the options and select\
    \ Recovery and Transformation options (experts only), followed by\n+   Load MBR\
    \ and Budit Fresh GPT. Tap ? one last time and select Fresh, Table to Disk and\
    \ exit. Remove and replace the USB device and run gdisk again. This time enter\
    \ l and then ? to display the Partition Unique GUID.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_64_0.png)\n\
    \n# Make your Pi fast and reliable\n\n+   14 Make a note of the GUID and then\
    \ switch to the SD card. Reopen cmdline.txt and change root=/dev/mmbbl02 to root=PARTUUID=XXXXXXXX,\
    \ where the numerical string from the partition unique GUID should replace the\
    \ XXXXXX. When you’re done, save and exit. You can then start your Raspberry Pi.\
    \ Congratulations, your Raspberry Pi is now faster and more reliable to use!\n\
    \n# Boost performance with overclocking\n\n+   15 Need more from your Pi? It is\
    \ possible to overclock the computer, although you should be aware of the risks\
    \ inherent with this activity. You should also ensure that your Raspberry Pi’s\
    \ processor is suitably cooled - heatsinks for the CPU, Ethernet controller and\
    \ power regulator can be purchased online.\n\n# Overclock your Pi\n\n+   16 Overclocking\
    \ is available through raspi-config. Launch from the command line and move down\
    \ to the overclock option. Four driver options are available: Modest, Medium,\
    \ High and Turbo. With your ideal clock speed selected, exit raspi-config and\
    \ restart your Raspberry Pi to apply.\n+   ```\n+   sudo shutdown -r now\n+  \
    \ ```\n+   Now you will need to perform tests to see how stable it is overclocked.\
    \ Raspberry Pi founder, Eben Upton, suggests running Quake 3 as a good stress\
    \ test. Should the Pi fail to boot, hold Shift at boot without overclocking, run\
    \ raspi-config and select a more modest overclock.\n\n# Run Raspbian without the\
    \ GUI\n\n+   17 Despite these changes, you may find that the GUI performs slow.\
    \ If you find yourself running a lot of commands in bash, the best thing to do\
    \ is disable launch item X. In raspi-config, choose boot_behaviour and select\
    \ the first (default) option to ensure your Pi boots to the command line. Should\
    \ you need the GUI, enter 'startx' in Terminal."
  merge: -1
  img_proc: true
