  md: "# Gain remote desktop access\n\n# Projects\n\n# Installing VNC part 1\n\n**04**\
    \ Now we'll install VNC and ensure that it starts automatically whenever the Pi\
    \ is booted up. This used to be a bit annoying under older Raspbian versions,\
    \ as configuring services often had a nasty habit of breaking the system. But\
    \ no longer. Enter the following commands, pressing Enter after each one.\n\n\
    ```\nsudo apt-get update\n```\n\n```\nsudo apt-get install tightvncserver\n```\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_44_0.png)\n\n# Installing VNC part\
    \ 2\n\n**05** When the packages have downloaded and installed, follow the instructions\
    \ on screen (see below) to set up a password and confirm it. But answer 'N' to\
    \ the view only option. This really is just a security feature and since you are\
    \ only accessing the Pi at home, it's not absolutely necessary - it's still good\
    \ practice, though.\n\n+   * You will require a password to access your desktops\n\
    +   * Password:\n+   * Verify:\n+   * Would you like to enter a view-only\n+ \
    \  * password (y/n)? n\n+   * New 'X desktop is raspberrypi:1'\n\n# Configuring\
    \ VNC server\n\n**06** That's the VNC server installed, up and running. Now we\
    \ need to make sure it loads up as a service every time the Raspberry Pi reboots,\
    \ so you can access it even if the Pi disappears a power cycle. To configure the\
    \ Pi to do this, type the following in the terminal and press Enter.\n\n```\n\
    sudo nano /etc/init.d/\ntightvncserver\n```\n\n# Configuring boot service\n\n\
    **07** We're back in nano, and we'll need to enter some lines of commands in order\
    \ to allow the Raspberry Pi to activate the VNC server when it boots. In the editor,\
    \ type:\n\n```\n#!/bin/sh\n\n# /etc/init.d/tightvncserver\n# Set the VNCUSER variable\
    \ to the name of the user to start tightvncserver under\nVNCUSER='pi'\ncase \"\
    $1\" in\nstart)\n su VNCUSER -c '/usr/bin/\n tightvncserver -l'\n echo \"Starting\
    \ TightVNC\n server for $VNCUSER\"\n ;;\nstop)\n killall Xtightvnc\n echo \"Tightvncserver\
    \ stopped\"\n ;;\n*)\n echo \"Usage: /etc/init.d/\n tightvncserver\n {start|stop}\"\
    \n exit 1\n;;\nesac\nexit 0\n```\n\n# Reboot and ready to go\n\n**08** Now press\
    \ Ctrl+X, then Y to save, followed by Enter a couple of times to get you back\
    \ into the terminal. What we need to do now is edit the permissions of the script\
    \ we've just created so that it's executable and active. Do this by typing the\
    \ following commands into the terminal, ensuring that you press Enter after each\
    \ one otherwise it will not be registered.\n\n```\nsudo chmod 755 /etc/init.d/\n\
    tightvncserver\nsudo rc-d tightvncserver\ndefaults\nsudo reboot\n```\n\nOnce you\
    \ have completed these steps, the final thing to do will be need to locate it\
    \ somewhere that it has easy access to a network cable. If you install the likes\
    \ of TightVNC Viewer, or any other remote access software (as long as it uses\
    \ the tight protocol) then you should be able to point the client to the Pi address\
    \ 192.168.1.90.1 (or whatever the static IP address is of the network that you\
    \ wish to connect the device to) and have full access to the Raspberry Pi.\n\n\
    ![](img/f11b7dbb71886af07ef87126037ebe98_44_1.png)"
