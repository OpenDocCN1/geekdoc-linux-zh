  md: "# # Projects\n\n# ## Make a Pi 2 HTPC\n\n# ## Make a Pi 2 HTPC\n\n# ### What\
    \ you’ll need…\n\n+   OpenELEC openelec.tv  \n+   HDMI cable  \n+   USB IR recceiver\
    \  \n+   IR remote  \n+   Case  \n+   Dedicated power supply  \n+   Optional USB\
    \ storage\n\n> Finally create a more powerful and capable HTPC using the Raspberry\
    \ Pi 2 and the excellent OpenELEC project.\n\nWe know people who just have a Raspberry\
    \ Pi for XBMC, now called Kodi. It’s a great idea and a great use for the Pi –\
    \ it works just well enough that you can easily play media locally or over the\
    \ network. The biggest issue came with GUI response on the original Model Bs,\
    \ and a lack of USB ports for connecting up everything that you want. While optimisation\
    \ over the last few years has helped, the leap to Raspberry Pi 2 has basically\
    \ solved all of these problems by giving you much more powerful hardware to play\
    \ with. So if you’re looking to upgrade or finally take the plunge, this handy\
    \ guide will help you create the perfect Raspberry Pi 2 HTPC.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_75_0.png)\n\
    \n# ### Choose the software\n\n**01** In the past, Pi HTPCs were just a choice\
    \ between RaspBMC and OpenELEC. However, RaspBMC is on a bit of a hiatus and OpenELEC\
    \ is your best bet for getting the most up-to-date software. There’s not a massive\
    \ difference between the two, as they both run XBMC.\n\n# ### Get the software\n\
    \n**02** Head over to openelec.tv and look for the Download section. There’s a\
    \ specific Raspberry Pi section which is split into original (ARMv6) Pi 2 (ARMv7).\
    \ Grab the image file from this page for the Pi 2."
  merge: -1
