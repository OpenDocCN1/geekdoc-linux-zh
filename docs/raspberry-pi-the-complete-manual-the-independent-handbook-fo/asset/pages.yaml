  md: '# Start the web-server


    07 Now that we have some stations, we can run the web-server from the pyPlaylist
    directory. Then open up a web browser to start playing a radio station. The following
    command reveals your IP address on Raspbian.


    ```

    ```

    $ ./raspbian_get_ip.sh

    192.168.0.20

    ```

    ```


    Once you know the IP address, connect to the URL in a web-browser on port 5000,
    ie


    http://192.168.0.20:5000/


    # Add a custom music playlist


    08 Now put together a sub-directory with your music files under /var/lib/mpd/music/
    and ensure that mpd has root access to read it.

    Then we update mpd''s database, clear out the current playlist and add in all
    the tracks from the new directory (ambient), finally saving it as a new playlist.


    ```

    ```

