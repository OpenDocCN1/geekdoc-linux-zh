  md: "# Projects\n\n# Monitor your local network with NagiosPi\n\n+   * What you’ll\
    \ need. . .\n+   \n+   * NagiosPi\n+       * pinimagedb.com/project/nagiospi\n\
    +   \n+   * Win32 Disk Imager\n+       * bit.ly/1aJ8Vg\n+   \n+   * Disk Utility\n\
    +       * bit.ly/1aCES\n+   \n+   * Internet connection\n+   \n+   * 4 GB (or\
    \ larger) SD card\n\n![](img/f11b7dbb71886af07ef87126037ebe98_65_0.png)\n\n# Monitor\
    \ your local\nnetwork with NagiosPi\n\n> Embrace the power of Nagios to keep an\
    \ eye on servers, switches and applications on your network\n\nIs your PC offline?\
    \ Has your Linux box stopped serving Minecraft or Counter-Strike? If you’re out\
    \ of the house, or even the country, there is no real way of knowing without trying\
    \ to log in – something you probably won’t be able to do without being on the\
    \ premises (unless you’re using remote desktop software).\n\nA far better way\
    \ would be to simply receive notifications when your network devices are knocked\
    \ offline, and this is why we turn to NagiosPi, a Raspberry Pi-built version of\
    \ the popular open source network monitoring tool.\n\nNagiosPi is available as\
    \ a full image ready to be written to SD card, with the real configuration taking\
    \ place once it’s up and running. Let’s get started."
