  md: '# Build a networked Hi-Fi


    # Build your own networked Hi-Fi with a Pi Zero


    Put the Pimoroni pHAT DAC together with a Pi Zero to create a networked Hi-Fi


    Take advantage of the UK’s online radio stations, Linux’s popular Music Player
    Daemon, and utilise a responsive web-server to control it all. The full-sized
    Raspberry Pis have two built-in audio outputs: audio over HDMI cable and a 3.5mm
    headphone jack that can suffer interference and noise. The Pi Zero itself has
    no audio jacks but Pimoroni has come to the rescue and built a high-quality DAC
    (digital audio converter) using the same chip as the Hi-Fi berry (PCM5102A).


    # What you''ll need...


    +   Github repository

    +   http://github.com/alexellis/pxPlaylist

    +   pimoroni pHAT DAC

    +   Soldering iron, flux & solder


    Did you know...


    We wrote pxPlaylist with the Python Flask framework, which is an ideal starting
    point for simple RESTful websites. The front-end code saves the screen from completely
    reloading by using jQuery to update the song or radio information.

    Bootstrap has been employed to make the pages responsive (compatible with your
    PC, phone and tablet). The code has been released under GPL so why not fork the
    code and tweak it to your own needs?


    ![](img/f11b7dbb71886af07ef87126037ebe98_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Build a networked Hi-Fi


    ![](img/f11b7dbb71886af07ef87126037ebe98_88_0.png)


    # Solder the headers


    +   01 The pHAT DAC comes with a 40-pin header, which you will need to solder.
    We consider a flux pen, wick-lamp and tin gauge 60/40 solder essential for this.
    An optional RCA jack can also be bought to give a phono-lead output for older
    stereos.


    # Install drivers


    +   02 The DAC relies on I2C, so we have to load some additional kernel modules.
    If you are running Raspbian then you can type in the following for a one-script
    installation over secure HTTP:


    ```

    ```bash

    curl -sS https://get.pimoroni.com/phatdac | bash

    ```

    While HTTPS provides a secure download, curious types may want to review the script
    before running it.

    ```


    # Install Music Player Daemon (MPD)


    +   03 Now go on to install the MPD package and enable it to start on boot. MPD
    will be the backbone of the project, providing playback of MP3s and internet radio
    stations. The MPC (client) software is also installed for debugging and setting
    up your initial playlists.


    ```

    ```bash

    sudo apt-get install mpd mpcli

    sudo systemctl enable mpd

    ```


    ```


    # Clone and install pyPlaylist web-server


    +   04 NpyPlaylist is a responsive (mobile-ready) web-server written with Python
    & Flask web-framework. Once configured it will give us a way of controlling our
    Hi-Fi through a web-browser. The following will install pyPlaylist on Raspbian:


    ```

    ```bash

    sudo pip install flask python-mpd2

    cd ~

    git clone https://github.com/ailexellis/pyPlaylist

    cd pyPlaylist

    ./raspbian_install.sh

    ```


    ```


    > > “An optional RCA jack can also be bought to give a phono-lead output for older
    stereos”'
