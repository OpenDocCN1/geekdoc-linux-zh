  md: '# **Projects**


    # Add a battery pack to your Raspberry Pi


    # **What you''ll need...**


    +   AA battery box \

    +   by PTC02615 \

    +   3-amp UBEC \

    +   by TH61027 \

    +   3-amp terminal strip \

    +   6x AA rechargeable \

    +   batteries


    ![](img/f11b7dbb71886af07ef87126037ebe98_69_0.png)


    # Add a battery pack to your Raspberry Pi


    Don''t leave your Raspberry Pi behind – incorporate it into mobile projects by
    powering it up using humble AA batteries


    Your Raspberry Pi''s mobility is usually restricted by the length of the power
    lead. Rather than limiting it to your desk or living room, however, you can use
    it for mobile projects as diverse as launching it into near-Earth orbit or monitoring
    and automating your garden. \

    Of course, to do this you will need batteries, but adding battery power to your
    Raspberry Pi is simpler than you might have imagined. All that is required are
    six rechargeable AA batteries (or single-charge alkaline), a battery box with
    space for the batteries and a UBEC. The latter is a Universal Battery Eliminator
    Circuit, a voltage regulator that will regulate the power supply and prevent damage
    to the Raspberry Pi, and can be bought for under £10.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Add a battery pack to your Raspberry Pi


    # Projects


    ![](img/f11b7dbb71886af07ef87126037ebe98_70_0.png)


    # “You can use your device for mobile projects as diverse as launching it into
    near-Earth orbit”


    # Make your order


    +   **01** If you''re buying your components online, you should be able to get
    them all within five days. However, if you''re ordering offline (specifically
    the UBEC), you should avoid traditional electronics stores and instead visit a
    model enthusiast store, as these circuits are regularly used in RC devices.


    # Check your UBEC


    +   **02** Two types of UBEC are available to choose from. If you used the store
    that we suggest in the resources box to the left, you''ll receive one with a micro
    USB power connector for easy connection to your Raspberry Pi. However, if you
    bought one from eBay then there is a strong chance that you will receive one with
    a 3-pin connector.


    ![](img/f11b7dbb71886af07ef87126037ebe98_70_1.png)


    # Move connector pins


    +   **03** In order to use the UBEC with a 3-pin connector, you''ll need to alter
    the position of the pins so that they occupy the two outer slots. Just use a small
    jeweller''s screwdriver to lever up the small plastic catch and remove the red
    wire from the central slot, before sliding into the unoccupied outer slot.


    # Connect to battery box


    +   **04** With five batteries in the battery box, connect it to the UBEC (red-to-red,
    black-to-black) by twisting the wires, soldering or employing a 3-amp temporary
    strip, cut down to two pairs. It can be cut to size using a modelling knife.


    # Add a battery to boot


    +   **05** With your Pi ready to use and your Wi-Fi bridge plugged in, connect
    the UBEC to the micro USB port and insert the single battery into the battery
    box. The Pi''s power and status lights should indicate that the computer is booting
    up, which gives you a fully portable computer.


    # Connect the 3-pin UBEC


    +   **06** If you purchased the UBEC with the now-modified 3-pin connector, you''ll
    need to connect this to the Raspberry Pi''s GPIO header. Connect the positive
    +5V (red) connector to Pin 2 and the negative 0V connector to Pin 6.


    # Measure uptime


    +   **07** You should have already set up your Pi for SSH use, so connect to the
    device via Putty (or giving it time to boot fully if it lasted 60 seconds). In
    the terminal, enter:


    ```

    ```

    sudo dd bs=32m if=/Users/rachel.crabap/Desktop/ArchLinx/archLinx-hf-2013-02-11.img
    of=/dev/disk1

    ```

    ```


    This command will display the system uptime and also keep the Wi-Fi connection
    active.


    # Judge your uptime results


    +   **08** Uptime results depend upon the use of a battery you use and the Raspberry
    Pi model. Single-charge batteries will last a little bit longer, but this is a
    more expensive option. Meanwhile, newer models have greater power requirements
    but run for less time. For more power, add more batteries!


    # Power extreme!


    +   **09** More batteries added in parallel should result in almost double the
    uptime (at least 16 hours on a 250mW Raspberry Pi Model A), but instead of alkaline
    or rechargeable batteries you might consider a modern lithium-based AA cell, which
    will last considerably longer than alkaline batteries.'
  merge: -1
  img_proc: true
