  md: '# Welcome to

    # Raspberry Pi

    ## The Complete Manual


    The Raspberry Pi is one of the most exciting things to happen to computers in
    recent years. As an educational tool, this tiny PC has reignited interest in bare-metal
    computing in schools. As a platform for open-source software, it has also inspired
    millions of people to try Linux – many for the first time. Most exciting of all
    is the potential to incorporate the device into practical projects, as demonstrated
    by the tutorials in this newly revised edition of Raspberry Pi The Complete Manual.
    So grab your Pi and get creating!


