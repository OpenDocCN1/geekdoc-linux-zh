  md: '# **Install to card**


    +   **03** Open up the terminal and use *fdisk* - *l* to determine where your
    SD card is located on your system. Something like */dev/sdb* or */dev/mmcblk0*
    will be ideal. Navigate to the image using *cd* and install it with *dd* using:


    ```

    $ dd bs=1M if=OpenELEC-RPi2-arm-5.0.5.img of=/dev/mmcblk0

    ```


    # **First boot**


    +   **04** Plug in your Raspberry Pi, either to your TV or to another screen just
    to begin with, and turn it on. OpenELEC will resize the SD card partitions and
    write a few extra programs before finally booting into Kodi.


    # **Configure Kodi**


    +   **05** Go through the basic wizard to get through the interface – if you are
    connecting via wireless you will need to go to OpenELEC in the System menu and
    activate the wireless receiver before selecting your network and then entering
    your password.


    ![](img/f11b7dbb71886af07ef87126037ebe98_76_0.png)


    # **Add network shares**


    +   **06** You can attach a portable hard drive or USB stick to the Pi for storage,
    but it is really to stream over the network. Go to File manager under System and
    Add source. Go to Browse and choose your network protocol to browse the network
    or alternatively, add it manually.


    ![](img/f11b7dbb71886af07ef87126037ebe98_76_1.png)


    > “It’s a great use for the Pi – it works just well enough that you can easily
    play media locally or over the network”


    ![](img/f11b7dbb71886af07ef87126037ebe98_76_2.png)


    # **Add network shares**


    +   **07** Placement of your Raspberry Pi is important. As it’s going to be out
    all the time, we highly recommend getting a case for it – the Pibox cases from
    Pimoroni are quite well suited for this type of use as they are sturdy and can
    be attached to the rear of some TVs.


    # **IR sensors and controllers**


    +   **08** Kodi can be controlled with a number of different things – including
    USB game controllers and compatible IR sensors. We’ve used FLIRC in the past,
    but if you have your Pi behind the TV, you’ll need a sensor on a wire that can
    stretch to a useful position.


    # **Future updates**


    +   **09** OpenELEC has the excellent ability to update itself without needing
    you to reinstall it every few months, meaning you won’t need to do much maintenance
    on at all. Now you can sit back and enjoy your media much easier than before.'
