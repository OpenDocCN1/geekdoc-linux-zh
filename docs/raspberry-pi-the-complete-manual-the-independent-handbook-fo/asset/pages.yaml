  md: '# Getting started


    # Set up your Raspberry Pi


    # Set up your Raspberry Pi


    Learn what goes where in your brand new Raspberry Pi with our easy-to-follow guide


    While it looks daunting, setting up the Raspberry Pi for day-to-day use is actually
    very simple. Like a TV or a normal computer, only certain cables will fit into
    the specific slots, and the main job really is making sure you''ve got plugged
    in what you need at any one time. The Raspberry Pi itself doesn''t label much
    of the board. However, most good cases will do that for you anyway – if you decide
    to invest in one.


    +   - **Power adapter**

    +   The Raspberry Pi is powered using a microUSB cable, much like a lot of modern
    Android phones. It can be powered off of a laptop or computer, but to make the
    most out of a, a proper mains adapter – like this one – is ideal

    +   - **Monitor**

    +   The Raspberry Pi is capable of displaying 720p or 1080p output – otherwise
    known as 1080p. Some modern monitors allow you to plug HDMI straight into them,
    just like TVs do. However, you may need an adapter in some cases.


    ![](img/f11b7dbb71886af07ef87126037ebe98_13_0.png)


    +   - **USB hub**

    +   There are only a limited number of USB ports on a Raspberry Pi (just one,
    if you have Model A). To get around this you will need a USB hub. It''s important
    to get a powered one, as the Pi cannot supply enough juice on its own


    +   - **Case and accessories**

    +   A case is not necessary to use the Pi correctly, but a decent one can keep
    it well protected from dust, and make it easier to move while in operation. You
    will need an SD card, however, of at least 4GB.


    ![](img/f11b7dbb71886af07ef87126037ebe98_13_1.png)


    +   - **Keyboard and mouse**

    +   Like any computer, you''ll need a keyboard and mouse for any standard PC-style
    operations you do with the Raspberry Pi. The more handy the keyboard, the better:
    same with the mouse, as some special ones need additional software.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Set up your Raspberry Pi


    # Getting started


    ![](img/f11b7dbb71886af07ef87126037ebe98_14_0.png)


    **Analogue output**

    For setups that don’t use HDMI, the yellow video output port is available. To
    use this with sound, you’ll need to use the small black port next to it, with
    headphones, or an auxiliary cable to pipe out the audio


    **USB**

    All the peripherals you want to connect via USB — USB hubs, keyboard, mouse, USB
    storage etc. — are plugged in here. Ensure you have external power to the USB
    Hub if you have to use one through


    **SD card**

    The SD card goes in underneath the Raspberry Pi board. This will hold your operating
    system that runs the Raspberry Pi. The Pi OS needs to be set up from another computer
    before using it though


    **Digital output**

    The HDMI port is the main video (and audio output) of the Raspberry Pi, allowing
    you to display videos on the desktop at a resolution of up to 1080p. TVs that
    support it will also pick up the audio automatically through it


    **Networking**

    The Raspberry Pi does not come with wired internet, and while you can add a USB
    adapter, it’s usually easier to plug in an Ethernet cable. This will plug into
    the back of your router on the other end and give you internet and access to your
    home network


    **Cabling**

    Make sure you have the right selection of cables, such as an Ethernet cable for
    networking and internet, and an HDMI or Video cable for video out. The HDMI can
    handle audio, but the video out will require an additional auxiliary cable


    ![](img/f11b7dbb71886af07ef87126037ebe98_14_1.png)


    15'
