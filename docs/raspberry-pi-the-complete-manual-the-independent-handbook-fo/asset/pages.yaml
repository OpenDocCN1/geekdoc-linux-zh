  md: '# Projects


    # Build your first web server


    What you''ll need... Internet connectivity Web browser Google Coder `google.com/coder/raspberrypi/setup/so/so/coder-raspberrypi/so/setup/so/so/so/so/so/1.html`


    # Build your first web server


    Use Google Coder to turn your Raspberry Pi into a tiny, low-powered web server
    and web host!


    We''re teaching you how to code in many different ways on the Raspberry Pi in
    this book, so it only seems fitting that we look at web development too.


    There''s a new way to use the web on the Raspberry Pi as well: internet giant
    Google has recently released Coder specifically for the tiny computer. It''s a
    Raspberry-based image that turns your Pi into a web server and web development
    kit. Accessible easily over a local network and with support for jQuery out of
    the box, it''s an easy and great way to further your web development skills.


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_1.png)


    Download this page''s Coder Raspberry Pi image


    # Get the Code


    You''ll need to download the Coder image from Google Coder, a new way to use the
    web on the Raspberry Pi.


    # Raspberry-specific instructions


    If you want to use Coder on a Raspberry Pi, download and install the image to
    your SD card using the instructions on the site. Once it''s installed, plug in
    an ethernet cable and turn on your Pi. Wait a few moments and you should be ready
    to go!


    # Get Google Coder


    +   1. Head to the Google Coder website, and download the compressed version of
    the image.

    +   2. Unpack it wherever you wish, and install it using dd, like any other Raspberry
    Pi image.


    ```

    $ dd if=[path to]/raspi.img of=/dev/[path to SD card] bs=4M

    ```


    # Plug in your Pi


    +   1. For this tutorial, you''ll only need to connect a network cable into the
    Pi. Pop in your newly written SD card, plug in the power and wait a few moments.
    If you''ve got a display plugged in already, you''ll notice a Raspberry startup
    sequence leading to the command-line login screen.


    ![](img/f11b7dbb71886af07ef87126037ebe98_85_2.png)


    # Connect to Coder


    +   1. Open up the browser on your main system, and go to http://coder.local.
    You may have to manually accept the licence: it will ask you to set up your password,
    and then you''ll be in and ready to code.'
