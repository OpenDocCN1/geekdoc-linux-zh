    download and install. Now we need to

    text whether it will run from the LXDE

    menu. Click on the icon in the bottom

    left, then go to Preferences≫Synaptic

    Package Manager.


    # Running Synaptic – Part 3


    05


    Running Synaptic from the

    LXDE menu results in an error.

    Don''t panic, however - all it''s doing

    is asking for a password. Enter the

    following password into the box.


    ```

    raspberry

    ```


    This is the default Pi password so we''re

