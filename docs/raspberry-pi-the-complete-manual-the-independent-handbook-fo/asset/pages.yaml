  md: '# # Raspberry Pi Model A+


    Good things come in small packages: find out why the Raspberry Pi A+ is ideal
    for mobile projects.


    While the Raspberry Pi Model B+ is a step up from the Model B with its four USB
    ports, the Model A+ is smaller than its predecessor, weighing just 23g (down from
    45g) and wielding one USB port. It’s also limited to just 256MB of RAM on the
    SoC, compared to the 512MB enjoyed on the B+.  But don’t think that all of this
    means that the A+ is inferior. Its 65mm length and lower weight


    is a clue as to how it can be used. The lack of an Ethernet port meanwhile, isn’t
    a weakness, rather an illustration of the fact that this Raspberry Pi is designed
    for media centres and print servers, but for projects where weight is a factor.
    Perhaps you’ll mount it on an Arduino-powered robot, where its lower power requirement
    can be satisfied with a battery.


    +   * **MicroSD Storage**

    +   No more worries about the SD card being snapped off or lost. The Raspberry
    Pi A+ features a push-push slot for a microSD card

    +   * **Connectable and flexible**

    +   Both new Raspberry Pi models have had the GPIO header increased from 26 pins
    to 40, increasing the device’s flexibility

    +   * **256 MB RAM Squeezed on board!**

    +   It seems amazing, but on top of all of this, there is a System on Chip 700
    MHz processor with 256 MB of RAM mounted on the centre of this versatile little
    computer.


    ![](img/f11b7dbb71886af07ef87126037ebe98_9_0.png)


    +   * **It’s smaller!**

    +   The original Raspberry Pi Model B was a circuit board sized 85mm in length.
    The A+ measures in at just 65mm long

    +   * **Repositioned power socket**

    +   With the micro USB power socket now beside the HDMI socket, it’s easier to
    arrange and manage cables

    +   * **It’s lighter too!**

    +   Unbelievably, the Raspberry Pi Model A is just 23g (0.81 oz), a reduction
    in weight of almost 50 per cent'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Raspberry Pi Zero


    The tiny £4 computer has taken the world by storm, but what''s changed?


    Coming in at a size smaller than a credit card, the Pi Zero is certainly impressive
    to behold. However, its size does not mean a scale back in performance. The Zero''s
    1GHz, Single-core CPU and 512MB RAM has this board running 40% faster than the
    original Pi.


    To achieve such a small form factor and low production costs, the creators stripped
    back a lot of ports we have come to expect. With only space saving micro and mini
    ports remaining


    and no Ethernet in sight, adapters of various kinds will play a vital role in
    more demanding projects. By ensuring every component is justified in its existence,
    the Pi Zero is incredibly versatile. Its capability to run full images such as,
    Rasbian, means jumping into a project is as simple as ever.


    The minimalism of the Zero lends itself perfectly to running in a headless setup,
    add a Wi-Fi dongle and you can SSH in to control it, making the most of that single
    USB port.


    ![](img/f11b7dbb71886af07ef87126037ebe98_10_0.png)


    **New mini HDMI port**


    You will need an adapter to make use of this port. Or better still, go headless
    and install yourself a little OS image


    **MicroSD card**


    This is the same as the newer B model, meaning you can swap in an existing card
    to be up and running in seconds


    **Unpopulated GPIO header**


    With an identical pinout to Model A+/ B+/2B/3, headers can optionally be soldered
    on yourself, making the Zero HAT compatible


    **Micro USB port**


    The shortage of ports means a USB hub and an adapter will become important, than
    ever to connect things such as a keyboard or Wi-Fi adapter


    **Minimal connectors**


    No Ethernet or audio port and no camera or display connectors! However unpopulated
    composite video and reset headers are still available


    **Smaller than a credit card**


    Measuring in at a 65mm x 30mm x 5mm the Zero comes in at a tenth the model B''s
    overall footprint'
  merge: -1
  img_proc: true
