  md: "# Projects\n\n# Control lights with your Pi\n\n![](img/f11b7dbb71886af07ef87126037ebe98_81_0.png)\n\
    \n# Fitting the Pi-mote\n\n+   **03** Before fitting the Pi-mote transmitter,\
    \ shut down your Raspberry Pi with sudo poweroff. Next, unplug the power supply\
    \ and fit the module onto your Raspberry Pi. The 1st part of the board fits opposite\
    \ the HDMI port. Power up the Pi and plug in-one of your Energecie sockets in\
    \ the satellite room or area that your Pi is in. The device's range is fairly\
    \ good, but furniture, walls and other objects may sometimes block the transmission\
    \ signal. You can test that the socket is working by plugging in something like\
    \ a desk lamp and then pressing the green button that is located on the socket.\
    \ This will trigger the socket on and off, turning the lamp on and off in turn.\n\
    \n# Download the set-up code\n\n+   **04** Before the Raspberry Pi can interact\
    \ with the socket and switch it on/off, it requires programming to learn a control\
    \ code that is sent from the transmitter. Each socket has its own unique code\
    \ so that you can control up to four individually. Energecie provides the set-up\
    \ program which can be found inside their tutorial resources (available at bit.ly/2lZRw4G).\n\
    \n# Set up your socket\n\n+   **05** Once you have downloaded the set-up program,\
    \ run it. You should place the socket into ‘learning mode’, which will be indicated\
    \ by the LED on the front of the socket housing slowly flashing. If it is not\
    \ doing this, press and hold the green button for a few seconds and release it.\
    \ Then the LED starts to flash at a one-second interval. Run the program and it\
    \ will send a signal out. Follow the on-screen prompts, pressing the button key\
    \ when required.\n+   \n+   When the code is accepted, success will be indicated\
    \ with a brief flashing of the LED on the housing. If you do not have more than\
    \ one socket to set up, simply use the same program and method to do so for as\
    \ many times as required.\n\n# A quick test\n\n+   **06** Before you get to the\
    \ task of creating your Python code to control your socket, it is always advisable\
    \ to test that the socket is working correctly. Ensuring that the power is turned\
    \ on the wall plug and that the lamp is switched on, you can turn the lamp off\
    \ by pressing the green button on the front of the Energecie socket. The lamp\
    \ should turn back on again when the button is next pressed.\n\n# Code to turn\
    \ the socket on\n\n+   **07** The Python Energecie library makes it incredibly\
    \ easy to create a code to turn the socket on, which will then turn your lamp\
    \ on. Before you know it, you will be using your Raspberry Pi to turn the kettle\
    \ or TV on or off!\n+   \n+   Open your Python editor and start a new program.\
    \ Next, import the Raspberry Pi GPIO library (line 1, below), then import the\
    \ Energecie library (lines 2 and 3). Finally, add in the code to switch the socket\
    \ on (line 4). Save and then run your program. The socket will turn on, you may\
    \ hear a click, and then your lamp will come on.\n\n```\nimport RPi.GPIO as GPIO\n\
    import energize\nfrom energzie import switch_on\nenergieze.switch_on(1)\n```"
