    \ one of the many desktop OSs available for the little computer, perhaps using\
    \ it as a web server, an NAS or retro arcade console. This is all great fun, but\
    \ an often-overlooked feature of the Pi is its hardware pins. If you've never\
    \ done any electronics before, then the Pi is a great place to start. Or maybe\
    \ you have used a programmable microcontroller such as Arduino in the past; the\
    \ Pi, with its increased CPU and RAM over the Arduino, opens up many more possibilities\
    \ for fun projects.\n\nThe Raspberry Pi features a single PWM (pulse width modulation)\
    \ output pin, along with a series of GPIO (General Purpose Input/ Output) pins.\
    \ These enable electronic hardware such as buzzers, lights and switches to be\
    \ controlled via the Pi. For people who are used to either just 'using' a computer,\
    \ or only programming software that only acts on the machine itself, controlling\
    \ a real physical item such as a light can be a revelation.\n\nThis tutorial will\
    \ assume no prior knowledge of electronics or programming, and will take you through\
    \ the steps needed to control an LED using the Raspberry Pi, from setting it up\
    \ to coding a simple application.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_57_4.png)\n\
    \n> We'll take you through the steps needed to control an LED using the Pi, from\
    \ setting it up to coding"
