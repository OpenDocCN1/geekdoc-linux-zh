  md: '![](img/f11b7dbb71886af07ef87126037ebe98_117_0.png)


    # Xbox Zero arcade


    Let''s make a self-contained arcade machine out of old

    bits of kit, a spare Xbox pad and a Pi Zero!


    # What you''ll need...


    +   - Raspberry Pi Zero

    +   - Original Xbox controller

    +   - Wire cutters

    +   - Craft knife

    +   - Isopropyl alcohol swabs

    +   - Micro SD card

    +   - BluTak

    +   - Micro USB OTG cable

    +   - Cross-head screwdriver

    +   - Electrical tape

    +   - 2A micro USB power supply

    +   - Mini HDMI cable/adapter


    The Raspberry Pi Zero is tiny, ridiculously tiny. It''s also small enough

    to be hidden in a variety of household objects in order to enhance

    their capabilities. Whatever you can find to fit it in, you can turn into

    some kind of smart machine.


    Take old game controllers. If you''re anything like us you''ve

    probably got a couple of boxes full of old computer equipment

    you just can''t bear to throw away – an Atari Jaguar that hasn''t been

    touched since the 90s, a Sega Dreamcast which you''re sure you''ll

    plug in again one day, an old Xbox that lies languishing since you

    picked up something bigger and better. Turns out it actually was

    useful to keep them around – it''s time to bring these old systems

    back to life!


    We''re going to show you how to gut an old videogames

    controller, replace its innards with a Raspberry Pi Zero, and then

    load it up with a treasure trove of retro games. From start to finish,

    this project should take you under an hour to complete – and then

    you''ll be able to load up the ROMs you legally own on your new

    console and enjoy them from the comfort of your sofa.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Xbox Zero arcade


    # Projects


    # Gather your equipment


    **01** While the Zero doesn''t take up much space, videogame controllers are often
    stuffed full of delicate electronics. The trick here is to find a games controller
    which has enough space inside for the Zero. We''re going to be using the original
    Xbox controller, nicknamed ''The Duke.'' If you don''t have one to hand, they
    can be picked up for a couple of quid from most second-hand electronics shops,
    and they''re easily found online too.


    If you can''t find one, you can use newer USB game pads that are designed to look
    like controllers for classic systems like the SNES and Mega Drive. Make sure you
    choose a controller that has enough buttons for the games you want to play – some
    classic fighting games, for example, really can''t be played on a two-button NES
    controller!


    # Warning!


    **02** Working with electrical items and sharp objects can be dangerous. You risk
    damaging yourself or, worse, breaking your toys. Please ensure everything is unplugged
    from electrical supplies before attempting this project.


    As with any electronics projects, you should also take care to fully ground yourself
    before playing around with sensitive components – the static electricity from
    your body can ruin them. Anti-static wrist straps or a few taps on a radiator
    should do the trick


    ![](img/f11b7dbb71886af07ef87126037ebe98_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # Xbox Zero arcade


    ![](img/f11b7dbb71886af07ef87126037ebe98_119_0.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_119_1.png)


    # ## The build


    +   **03** You should be now have a reasonably good idea of the controller that
    we’ll be working with. ‘The Duke’ has dual joysticks, six buttons, a D-Pad and
    two triggers — and it’s compatible with most retro games systems.


    # ## Unscrewing


    +   **05** The controller is held together by half a dozen cross-head screws.
    Be careful when opening the case as the buttons and rubber contacts are loose
    within the controller — they will spill everywhere!


    # ## Opening


    +   **06** With the shell removed, you should be able to undo the screws holding
    the main circuit board in place. There are also a couple of connectors which power
    the vibration motors — gently unclip them in order to completely remove the board.
    You might find it easier to use a pair of pliers for this — just be very gentle
    as you pull.


    # ## Gently does it


    +   **07** You can see for yourself just how well the Pi fits here; it can be
    squeezed under the memory card slot. If you want to hold it firmly in place, use
    some Blu-tak as a temporary solution. Also, if you’re using an older controller,
    it’s worth giving it a bit of a clean. Remove the rubber contacts and gently swab
    under them using the isopropyl alcohol swabs.


    # ## Fitting


    +   **04** If you’re using a different controller, double-check that the Pi is
    likely to fit inside before you crack it open. As you’ll see here, the Pi nestles
    neatly between the triggers of this controller – the original Xbox controller
    is one of the largest.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Xbox Zero arcade\n\n\n\n# Cut to fit\n\n08   Depending on the model of controller,\
    \ you may find that the Pi blocks one of the internal plastic struts. The plastic\
    \ is soft enough that a craft knife will easily cut it down to size, though. Start\
    \ with small strokes, shaving off a tiny bit at a time until you have enough room.\
    \ Make sure the plastic dust is cleaned out before you reassemble the controller.\
    \ If you have a can of compressed air, you can use it to easily blow away the\
    \ shavings.\n\n# Connecting it up\n\n09   If you're using a controller that has\
    \ a regular USB port on it, you can just plug it into the Pi via a USB-OTG converter.\
    \ If you're using the original Xbox Controller, it's slightly trickier. Microsoft,\
    \ in its infinite wisdom, has decided that the original Xbox should use USB -\
    \ but with an incompatible plug design. This means, in order to connect the controller\
    \ to the Pi, we need to do some wire stripping. Fun!\n\nThe wiring inside the\
    \ Xbox controller's cable uses bog-standard USB wiring colours, so once you've\
    \ chopped the plugs off the controller and the OTG cable, it's pretty straightforward\
    \ to connect them together.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_120_0.png)\n\
    \n+   **White**\n+   \n+   This wire is one of two used for differential data\
    \ signals\n+   \n+   This white wire is the positive component and the green wire\
    \ is the negative one\n\n+   **Red**\n+   \n+   The red wire is one of two handling\
    \ power. This one is a 5V power line that provides voltage to the circuit.\n\n\
    +   **Green**\n+   \n+   The circuit can get the difference between the two data\
    \ signals rather than between a single wire and ground - it's a more effective\
    \ transmission\n\n+   **Black**\n+   \n+   This is the other wire associated with\
    \ the power: the ground wire, which is the counterpart to the 5V wire.\n\n+  \
    \ **Yellow**\n+   \n+   USB mini/micro cables will also have an additional wire\
    \ that isn't required for our particular project\n\n+   Left! The oldie USB 1.0\
    \ and 2.0 cables have fewer wires than the newer 3.0 - here's a quick guide"
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Projects


    # Xbox Zero arcade


    ![](img/f11b7dbb71886af07ef87126037ebe98_121_0.png)


    # The right controller


    Second-hand shops like C23 or GameStop often have some old or obsolete consoles,
    and accessories out of public view, as they rarely positively re-sell them these
    days. It’s worth asking the staff what they have if you can’t see what you need
    on display. Some charity shops also have old consoles for sale. Failing that,
    local car-boot sales or simply asking your gamer friends are both excellent ways
    to grab inexpensive controllers for all sorts of consoles.


    # Wiring


    +   10. Strip the wires by a couple of centimetres and then connect them together.
    You should have Red, Green, White, and Black. The Xbox cable also has a Yellow
    wire which you can ignore. It is worth noting at this point that you need to be
    sure that you have a USB data transfer cable and not just a plain old power cable
    – the former will look like the photo above, but power cables will be missing
    the two data wires.

    +   With the wires stripped, we temporarily used regular sticky-tape to make the
    connections between the OTG cable and the controller – for a more permanent installation,
    you can use electrical tape or simply solder the wires together.


    # Insulation


    +   11. One thing to note: you’ll need to insulate the bottom of the Pi against
    all the contacts on the controller. For this quick hack, we’ve used some of the
    cardboard packaging – but any non-conductive material will do. From there, it’s
    as simple as screwing the case back together. Make sure that the controller’s
    buttons and joysticks don’t slip out of alignment. Keep track of which coloured
    buttons go where and you should be fine.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Wiring up


    **12**  The Pi will need three wires connected to it in order to work. The controller
    cable needs to be connected to the USB OTG port. An HDMI cable goes from your
    TV to the mini HDMI port on the Pi. Finally, a 2A micro USB power supply needs
    to be plugged into the Pi’s power socket. We’ve used a standard mobile phone charger,
    but you can use a USB battery pack if you want to reduce the number of wires trailing
    around your room.


    ![](img/f11b7dbb71886af07ef87126037ebe98_122_0.png)


    # A word about power


    **13**  You might be wondering whether it’s possible to get the HDMI cable to
    supply power from the TV to the controller. Sadly, the HDMI specification doesn’t
    permit power to flow in that direction. If your TV has a USB socket on it, you
    could use that to supply the Pi with power – just make sure the socket itself
    is powerful enough. The Pi needs at least 1 Amp, and ideally 2 Amps. Many TVs
    will only output 500mA which isn’t enough to run the Pi.


    # Let’s play!


    **14**  Okay! It’s looking good – you’re nearly ready to play. The next step is
    to get some emulation software on this thing.


    > “If your TV has a USB socket, you could use that to supply the Pi with power
    – just make sure it’s powerful enough”


    ![](img/f11b7dbb71886af07ef87126037ebe98_122_1.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: "![](img/f11b7dbb71886af07ef87126037ebe98_123_0.png)\n\n> **What’s an emulator?**\n\
    > \n> An emulator is software which lets your computer pretend to be a different\
    \ sort of computer. It will allow a Raspberry Pi Zero to run software originally\
    \ designed for the Sega Mega Drive, or Nintendo N64, old DOS-based PC, etc. Emulators\
    \ aren’t without their problems, though – it’s nearly impossible to perfectly\
    \ recreate a games console in software. Keep in mind that older games may have\
    \ bugs ranging from minor sound and graphical glitches to full-blown crashes.\n\
    \n# Installing the RetroPie emulator\n\nIt’s not as difficult as you might think\
    \ to run retro software through an emulator\n\nRight, so you’ve managed to get\
    \ your Pi safely ensconced in a controller and all wired up – all you need now\
    \ are some videogames to play!\n\nFor this section of the tutorial we’re going\
    \ to be using the RetroPie emulator. By the end of this tutorial, you’ll be able\
    \ to play a number of games directly from your Raspberry Pi, provided that you\
    \ legally own the ROM files, of course.\n\nThe whole process is as easy as installing\
    \ the software onto your SD card and then copying across any games that you want\
    \ to play. If you’ve already got Raspbian installed on your Pi, you can install\
    \ RetroPie alongside it – or you can dedicate the whole disk to the software if\
    \ you’d rather.\n\n# Install RetroPie inside Raspbian\n\n+   1. If you’ve already\
    \ started using your Pi and want to add RetroPie to it, you’ll need to install\
    \ the software from Git-Hub. The latest instructions can be found at https://github.com/RetroPie/RetroPie-Setup\n\
    +      \n+      Open up a terminal on your Pi (for example, by SSHing into it\
    \ from another machine, or by logging in directly to the Pi). Update your repositories\
    \ and make sure the latest version of the Git software is installed:\n+      ```\n\
    +      sudo apt-get update\n+      sudo apt-get upgrade\n+      sudo apt-get install\
    \ git\n+      ```\n+      \n+      Download the latest version of the RetroPie\
    \ setup script:\n+      ```\n+      git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git\n\
    +      ```\n+      \n+      If you’re security-conscious, it’s a good idea to\
    \ check what the script does before running it. Once you’re ready, you can install\
    \ it by changing into the correct directory and executing the script:\n+     \
    \ ```\n+      cd RetroPie-Setup\n+      sudo ./retropie_setup.sh\n+      ```"
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/f11b7dbb71886af07ef87126037ebe98_124_0.png)


    The script will take several minutes to run, depending on the speed of your internet
    connection. It may also ask you for permission to install extra software that
    is needed – you should allow this. Once fully installed, you will need to reboot
    your Pi.


    ```

    sudo reboot

    ```


    RetroPie can now be run by typing emulationstation. We''ll come on to configuring
    your setup in just a moment.


    # Install RetroPie onto a blank SD card


    +   If you want your Raspberry Pi Zero to be used solely as a RetroPie machine,
    this is the choice for you. Be warned: it will completely wipe a micro SD card,
    so if you''re using one you''ve used before, make sure you back up any important
    data before starting.


    Download the latest version of the software from http://blog.retrodeck.com/retropie/retropie-downloads.
    Make sure you download the correct SD card image for your machine – the image
    for the Raspberry Pi 2 is not compatible with the Raspberry Pi Zero. Download
    the Standard version (not the BerryBoot version). The download is an 880MB .gz
    file. Unzip it and extract the img file, which will be around 2.6GB.


    You''ll now need to write this image file onto your micro SD card. This is done
    in the same way that you would install a normal Raspberry Pi image onto a card.
    There are slightly different instructions for Linux, Mac and Windows.


    ![](img/f11b7dbb71886af07ef87126037ebe98_124_1.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Xbox Zero arcade


    # Projects


    ![](img/f11b7dbb71886af07ef87126037ebe98_125_0.png)


    Where to get ROMs


    Many older games have, after only, been abandoned. The original publishers are
    defunct and it''s not clear who owns the rights. There are several sites which
    claim to have distribution from the original creators to distribute their games
    – but all of them should be clear that they are not giving a right to buy legal
    copies of or sell these games legally for commercial use. It is legal to copy
    and download games.


    # Linux


    03  Use the Disk Manager to select the image file and the micro SD card. Follow
    the on-screen instructions until the image has been fully written to the card.


    # Mac


    04  Download the Apple Pi Baker from www.twakemefall.com/hardware/raspberry-pi-macosxapplepi-baker
    Once you have installed, you can select the image file and the micro SD card.
    Follow the on-screen instructions.


    # Windows


    05  Download the Win32 DiskImager from http://sourceforge.net/projects/win32diskimager/
    Once installed, select the image file and the micro SD card. Follow the on-screen
    instructions until the image has been written to the card.


    # Configuring


    06  Right – you’re almost ready to play. Put the micro SD card into the Raspberry
    Pi Zero, hook up the controller USB cable and the HDMI cable. Finally, plug the
    Pi into the power. It should boot up automatically, and after a few seconds, you’ll
    be greeted with a configuration screen.


    RetroPie should automatically detect any connected USB game pads and step you
    through setting up the buttons. Once you’re finished, you’ll be presented with
    a screen showing all the choices you made.


    ![](img/f11b7dbb71886af07ef87126037ebe98_125_1.png)


    ![](img/f11b7dbb71886af07ef87126037ebe98_125_2.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Xbox Zero arcade


    # Projects


    # Set up the disk


    Before we get to playing any games, we need to make sure that RetroPie is able
    to use all the space on the micro SD card. This will allow you to store ROMs and
    save your games. Select “RetroPie” from the menu. You’ll be presented with several
    configuration options. Select “Raspberry Pi Configuration” tool RASPID-CONFIG.
    You can change the default username and password at a later date; for now just
    use the controller to select “Expand Filesystem”. Next, highlight the “Select”
    button and click on it. After a short delay, you will see a success screen — press
    OK and you’ll be taken to the configuration screen. Press right until “Finish”
    is highlighted, then click on it. You should now reboot your Raspberry Pi.


    ![](img/f11b7dbb71886af07ef87126037ebe98_126_0.png)


    # Adding ROMs


    The final step is adding new ROMs. Once you’ve legally purchased and downloaded
    ROMs from the internet, you’ll need to copy them onto the micro SD card. ROMs
    are stored in a separate folder for each system. So, for example, you need to
    place your Sega Master System ROMs in “/retropie/roms/mastersystem”. Once you’ve
    installed ROMs, you’re ready to play!


    # Playing


    Once booted, you’ll see a menu with all the available game systems on it. Some
    emulators will only show up once game ROMs for that system are installed. Scroll
    until you find the game you want to play — then let rip!


    You can always return back to RetroPie if you want to change any of the configuration
    options, or update the software. And that’s all there is to it! Time to sit back
    and play some games.


    If you want to find out more about the RetroPie software, visit http://blog.petrockblock.com/retropie/


    ![](img/f11b7dbb71886af07ef87126037ebe98_126_1.png)'
  merge: -1
  img_proc: true
