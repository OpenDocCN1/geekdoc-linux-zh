- pgno: 68
  md: '# Tether to an Android device


    > What you do also usually have with you is an internet-connected magic pocket
    box called a smartphone that you can connect the Pi"


    ![](img/f11b7dbb71886af07ef87126037ebe98_68_0.png)


    # Check connection


    **01** Your Android device will create an interface known as `eth0` on the Raspberry
    Pi. You can check to make sure this is happening, and that it will let you tether,
    by opening up a terminal and typing the following


    ```

    ifconfig

    ```


    # Quick connect


    **05** You can connect from the terminal right now to access the Internet. You
    should be able to do this by typing the following into the terminal.


    ```

    sudo dhclient usb0

    ```


    This will automatically grab any available IP address that your phone will give
    to it.


    # Test connection


    **06** There’s a few ways to test your connection. We’d usually stay in the terminal
    and `ping www.google.com`, which you can do, or you can click on the browser and
    see if it loads the page


    ![](img/f11b7dbb71886af07ef87126037ebe98_68_1.png)


    # Save the settings


    **07** Once you reboot your Raspberry Pi, it won’t remember to automatically connect
    to the phone’s tether. However, we can add an entry to its config so that it will
    try and do this in the future. From the terminal, use


    ```

    sudo nano /etc/network/ interfaces

    ```


    # Interface settings


    **08** Here you’ll find all the current network settings – yours might look different
    from ours depending on if you have added any fixed wireless settings or passt
    hroughs. Using the same syntax as at the `eth0` line, add


    ```

    iface usb0 inet dhcp

    ```


    # Tether on the go


    **09** After a save and reboot, your Pi should now automatically connect to your
    phone, whether it’s via Wi-Fi hotspot or a physical connection. It may draw a
    little more charge than usual while tethering, so be sure to keep an eye on your
    battery level.'
  merge: -1
  img_proc: true
