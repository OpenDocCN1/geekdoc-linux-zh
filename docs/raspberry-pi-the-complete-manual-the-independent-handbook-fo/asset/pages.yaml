  md: '# ## Projects




    # **What you’ll need...**


    +   * **Bare Conductive paint** (pen or tub)

    +   * Male to female jumper wires

    +   * An assortment of LEDs, switches and resistors (optional)


    # # Draw circuits with paint


    Assembling circuits has never been so easy with the joys of conductive paint,
    enabling you to bring together art and electronics in a whole new way


    Playing with electronics and physical computing is a very rewarding task. For
    a beginner though, the mess of wires and components can become very confusing
    quite quickly and things like soldering can be a safety concern when children
    are involved. **Bare Conductive** has taken the joy of electronics and made it
    far safer, easier and more versatile with their conductive paint. You can literally
    draw wires on paper with a paintbrush, use it for cold-soldering or a conductive
    adhesive and much, much more. There are not a great deal of boundaries to what
    you can do. Pair this paint with a microcontroller board and you could be creating
    interactive art, clothing and projects in no time.


    # **Get your tools**


    **01** Paint and a paintbrush aren’t the first items that come to mind when you
    think about electronics, so you may be wondering where to get them from. Bare
    Conductive stock the paint and a selection of components in their shop (bareconductive.com/shop)
    but you will need to go somewhere else for art supplies. We would recommend trying
    a high street craft shop such as lizbycraft.hobbycraft.co.uk or a local independent.


    ![](img/f11b7dbb71886af07ef87126037ebe98_71_0.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Draw circuits with paint\n\n# Projects\n\n![](img/f11b7dbb71886af07ef87126037ebe98_72_0.png)\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_72_1.png)\n\n“The mess of wires and\
    \ components can become very confusing”\n\n# Pick your platform\n\n+   **02**\
    \ The great thing about Bare Conductive paint is that, when dry, it works just\
    \ like normal wiring!\n+   \n+   That means you can use it with any of your favourite\
    \ microcontrollers like the Bare Conductive Touch Board, a Raspberry Pi or Adafruit’s\
    \ wearable FLORA platform. Or you can just use some small pin batteries and flashing\
    \ LEDs for a standalone system\n\n# Start to paint\n\n+   **03** You can paint\
    \ Bare Conductive paint onto pretty much any surface -- paper, fabric, walls,\
    \ clothing, wood, plastic and much more.\n+   \n+   For really accurate shapes\
    \ and results, the best idea is to create or purchase a stencil (paper stencils\
    \ are easiest to make at home but use vinyl for the best edge finish).\n\n# Connect\
    \ it up\n\n+   **04** There are plenty of ways to connect to the conductive paint\
    \ (from battery packs for example) no matter what surface it’s on, because once\
    \ it is dry it acts just like an insulated wire.\n+   \n+   Therefore you can\
    \ use wires glued on with the paint, paper clips, bulldog clips, alligator clips\
    \ or even sew-in-conductive snaps for wearable projects.\n\n# Make repairs\n\n\
    +   **05** The conductive paint is thick and when it’s dry it becomes quite strong.\
    \ These means you can use it to cold solder things together and repair any breakages.\n\
    +   \n+   In other words, you could glue components into a circuit board or glue\
    \ wires together and they would still function electrically.\n\n# Clean up\n\n\
    +   **06** A lot of you are probably thinking that something as cool as conductive\
    \ paint is going to be nasty stuff. Actually Bare Conductive paint is non-toxic,\
    \ water-based and water-soluble, and can therefore be cleaned easily with soap\
    \ and water.\n\n# Make it waterproof\n\n+   **07** This paint only comes in black\
    \ and is not waterproof.\n+   \n+   However, the great thing is that you can use\
    \ it underneath or alongside any regular paints, varnishes and waterproofing sprays\
    \ in order to act as insulation -- or just to add some colour into your design!\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_72_2.png)\n\n# Touch and sound\n\n\
    +   **08** Bare Conductive paint can also be used as a capacitive surface, meaning\
    \ you can use it for touch, gesture or proximity controls when it is paired with\
    \ a suitable control board. Bare Conductive make their own called the Touch Board\
    \ which has everything you need to start experimenting with touch and sound. It\
    \ can even act as a MIDI controller, an interface or an instrument!\n\n![](img/f11b7dbb71886af07ef87126037ebe98_72_3.png)"
  merge: -1
  img_proc: true
