  md: "# Projects\n\n# Back up your Pi\n\n# Back up your Pi\n\nTake the initiative\
    \ and back up your Raspberry Pi to make sure you never lose files again\n\nWhile\
    \ the Raspberry Pi is a very solid piece of kit, failure can happen, so it's best\
    \ to be well prepared and keep your files safe.\n\nThe good news is that the Pi's\
    \ files are all kept externally on the SD card. If your Pi breaks, everything\
    \ will still be available on the SD card and accessible from elsewhere. The SD\
    \ card is still susceptible to problems, though. There are a number of ways to\
    \ back up a Pi.\n\nThe methods can be broken down into two main categories: saving\
    \ the important files and creating an exact copy of the state of the SD card.\
    \ The former involves having copies of files elsewhere, while the latter has you\
    \ create the same kind of image that you'd normally write to the SD card when\
    \ installing Raspbian or other Pi-operating systems.\n\n# Important files\n\n\
    To save important files, we need to create a copy on an external source, such\
    \ as external hard drive or another PC. One of the best methods to do this doesn't\
    \ even involve a Pi: all you need is a PC or laptop with a card reader and you're\
    \ good to go.\n\nTurn off your Pi, unplug it and remove the SD card from the slot.\
    \ Find the SD card reader on your PC and slot it in. The main file system of the\
    \ SD card can be read by Linux PCs by default, and a Windows or Mac computer once\
    \ you've installed a program that lets it read the ext file system, such as Ext2Fsd.\
    \ On Windows, the SD card will be listed with the rest of the drives under My\
    \ Computer (Fig 1). On Linux and Mac, it will be listed wherever storage is shown\
    \ on the menus and file managers.\n\nOnce you've found the SD card on here, open\
    \ it up and navigate to home and then pi. This is where the Documents, Downloads,\
    \ Desktop and other directories can be found. All you need to do is select the\
    \ files you want to copy and move them to a secure directory on your PC or a connected\
    \ external hard drive.\n\n# What you'll need...\n\n+   A second computer  \n+\
    \   External storage\n\n# Did you know...\n\nSD cards don't last forever so, always\
    \ make sure you've got a backup of your files and your entire OS.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_39_0.png)"
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Back up your Pi


    If you want to keep the files on another computer, that’s fine, but it will be
    prone to the exact same problems as the Pi in the long run. Keeping them on an
    external hard drive is a good idea, and putting them on a cloud storage service
    is better yet, enabling you to access them from anywhere with an internet connection
    (Fig 2).


    # Cloning


    Creating a clone depends on what operating system you’re using on your main computer.
    For Macs and Linux, you can use a simple command-line tool called **dd** to create
    an exact copy of the SD card (Fig 3). This is done in the terminal emulator or
    command line, so bring that up first. Make sure the SD card is plugged in and
    enter:


    ```

    $ fdisk -l

    ```


    This lists all connected storage devices. The SD card will have 2, 4 or 8GB of
    space, depending on its size. It’ll likely be listed as something like **/dev/sd[x]**,
    where x is the letter the computer attaches to the SD card. To copy it using dd,
    enter the following into the terminal:


    ```

    $ dd if=/dev/sd[x] of=backup_img bs=1M

    ```


    You can also add a path to the image you’re creating to put it in a specific folder.
    The process will take some time, and will produce a multi-gigabyte file which
    you can then write onto the SD by reversing the previous command:


    ```

    $ dd if=backup_img of=/dev/sd[x] bs=1M

    ```


    While this is useful as a backup, you can also use the image to mass-produce SD
    cards to give to friends or keep in various places where you use your Raspberry
    Pi.


    # Windows


    To create a clone on Windows, we can use the Win32 Disk Imager (Fig 4). Download
    it from here to install it: **bit.ly/L8jYDg**.


    Once installed, insert the SD card and launch the software. Choose a name for
    the backup file and select the SD card from the list of devices. Now press Read
    and it will create the backup file. Again, this might take a while; however, this
    time you are at least shown a progress bar.


    Storing your cloned image is a little more difficult than your important files
    – the size of the image being in the gigabytes means it’ll fill up a lot of cloud-storage
    services. If you have the space, definitely keep it on there; however, you may
    need to put it on an external hard drive.


    # Projects


