  md: "![](img/f11b7dbb71886af07ef87126037ebe98_11_0.png)\n\n# The starter kit\n\n\
    # The starter kit\n\n*There's more to your Pi than first meets the eye.*  \nHere\
    \ are some vital peripherals to get you started\n\nIn order to get the very best\
    \ experience from your Raspberry Pi, you're going to have to get hold of a few\
    \ extras on top of the actual Raspberry Pi board itself. For example, you're going\
    \ to need a keyboard and mouse with which to enter commands and navigate. While\
    \ it's possible to do projects without a keyboard and mouse attached, you'll need\
    \ them for the initial setup. An SD card is also an important purchase -- it's\
    \ where the operating system lives.\n\nPerhaps you'll need a Wi-Fi adapter, or\
    \ maybe just a length of network cable. Then there's the basic electronics side\
    \ of the Raspberry Pi, what would you need to start some of the beginner electronics\
    \ and control experiments? Clearly, there's more to the Raspberry Pi than some\
    \ might think.\n\nBy 'peripherals,' we mean other hardware that can be attached\
    \ and utilised by the Raspberry Pi. They could be something as simple as a decent\
    \ HDMI or they could be the latest, greatest bespoke gadgets that enhance your\
    \ project capabilities.\n\nThere is an entire world of possibilities available\
    \ for the Raspberry Pi from robot arms to remote-controlled helicopters… The only\
    \ limits are the hardware available and your imagination!\n\n# Did you know…\n\
    \nMost online retailers sell packages complete with all the accessories you might\
    \ need - even a pre-installed SD card.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_11_1.png)\n\
    \n![](img/f11b7dbb71886af07ef87126037ebe98_11_2.png)\n\n# Keyboard and mouse\n\
    \nLet's start with the most basic of components, the keyboard and mouse. Generally\
    \ speaking, virtually any USB keyboard and three-button scroll mouse will work\
    \ with the Raspberry Pi, and although for some projects you won't even need a\
    \ keyboard and mouse, you'll need them for initial setup.\n\n# SD card\n\nEarly\
    \ Raspberry Pi computers required an SD card, whereas later models such as the\
    \ Raspberry Pi 2 and a 3 use micro/SD cards for storage. This is where you chosen\
    \ operating system (such as Raspbian) is installed, and these can be bought in\
    \ various sizes, pre-installed with the OS, or blank."
