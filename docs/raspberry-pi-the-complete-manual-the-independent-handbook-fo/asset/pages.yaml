  md: "# Install a distro\n\n# Getting started\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_0.png)\n\
    \n# Obtaining OSs\n\n**01** One of your first questions may be ‘where can I find\
    \ some operating systems to download?’\n\nMost of the common images can be found\
    \ on the main Raspberry Pi site: **www.raspberrypi.org/downloads.** These are\
    \ stable and well tested systems worth investigating.\n\n# Unzipping\n\n**02**\
    \ When you’ve downloaded your image, the first thing you’ll most likely need to\
    \ do is unzip it. This can be done in Windows by right clicking and choosing ‘extract’.\
    \ In OS X, just double click to extract the files.\n\n# OS Format\n\n**03** Within\
    \ the zip you’ll find a file with a .img or .iso extension. These are the equivalent\
    \ of a ‘snapshot’ of an installation CD or DVD. Simply copying the file to the\
    \ SD card won’t do anything, you’ll need to use a program to extract it.\n\n#\
    \ SD card format\n\n**04** The SD card that you’ll boot from needs to be blank,\
    \ so make sure there is nothing important on it first. You’ll also need to format\
    \ it to use the FAT32 file system. This is a common system, used by most USB sticks\
    \ and cameras.\n\n![](img/f11b7dbb71886af07ef87126037ebe98_20_1.png)\n\n# Formatting\
    \ the card\n\n**05** In Windows, to format the card simply insert and wait for\
    \ it to mount. Then click on ‘My Computer’ and then right click on the card’s\
