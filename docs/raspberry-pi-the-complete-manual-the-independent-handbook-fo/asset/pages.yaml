  md: '# Projects


    # Get interactive with Scratch


    # Get interactive with Scratch


    Experiment with physical computing by using Scratch to interact with buttons and
    lights on your Pi


    # What you''ll need...


    +   Breadboard

    +   LEDs

    +   Buttons

    +   Resistors

    +   Jumper wires

    +   ScratchGPIO3


    Scratch is a very simple visual programming language, commonly used to teach basic
    programming concepts to learners of any age. In this project we''ll learn how
    to light up an LED when a button is pressed in Scratch, and then change a character''s
    colour when a physical button is pressed using the General Purpose Input/ Output
    (GPIO) pins on our Raspberry Pi. With these techniques you can make all manner
    of fun and engaging projects, from musical keyboards to controllers for your Scratch
    games and animations. You''ll need some components for this guide. Just search
    online for ''Raspberry Pi GPIO basic kit'' to get your started.


    ![](img/f11b7dbb71886af07ef87126037ebe98_55_0.png)


    # Install the required software packages


    01 Log in to the Raspberry system with the username Pi and the password raspberry.
    Start the LXDE desktop environment using the command startx. Next, open up LXTerminal
    and then type the following commands:


    ```

    wget http://liamfraser.co.uk/lud/install_scratchgpio3.sh

    chmod +x install_scratchgpio3.sh

    sudo bash install_scratchgpio3.sh

    ```


    This will create a special version of Scratch on your desktop called ScratchGPIO3.
    This is a normal version of Scratch with a Python script that handles communications
    between Scratch and the GPIO. ScratchGPIO was created by simples (scimpley.wordpress.com).


    > “In this project we''ll learn how to light up an LED when a button is pressed
    in Scratch using the GPIO pins”'
