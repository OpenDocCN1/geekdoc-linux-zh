    # Scratch studio stage


    # 02


    The stage is where all the action takes place and is located at the upper right
    of the Scratch Studio.


    The stage is constructed from graphical elements called sprites. Here we have
    plants, bubbles, fish and other creatures. You can also add and create your own
    assets with scratch, but we’ll come to that later.


    At the top of the ‘Staging Area’ there’s a green flag and a red circle. Click
    on the green flag to bring the aquarium to life. Now spend a little time studying
    the Aquarium animation. Note the creature’s movements and rising bubbles. The
    red circle icon stops the action.


    We can set the view mode with the three buttons located just above the green flag.


    The two left-hand buttons increase or decrease the size of the Staging Area panel.
    A smaller Staging Area means the central area of the Studio increases in relative
    size compared.


    The right-hand button is the Presentation Mode which displays the stage in full-screen
    mode (see Fig 5). Exit presentation mode with the curlew arrow button at the top
    left, or press the ‘esc’ key.


    # Scratch studio sprites


    # 03


    Beneath the Staging Area is the collection of sprites for this project. The ‘Stage’
    sprite is separated from the rest. It’s a little different to the others and acts
    as the background image for the stage.


    The three buttons across the top of this area offer various ways to create a new
    sprite. The first button opens up a blank canvas in the Paint Editor. The second
    button creates a new sprite based on an image file, as selected from the pop-up
    file selection dialog window. The third will select a random image from the pre-installed
    image collection.


    We can manage sprites directly from the stage using the four buttons to the right
    of the main menu. Here we click on a particular button and then a sprite on the
    stage.


    ![](img/f11b7dbb71886af07ef87126037ebe98_48_4.png)


    Fig 5: Stage Presentation Mode – The Studio’s stage presentation mode is the best
    way to see the project'
