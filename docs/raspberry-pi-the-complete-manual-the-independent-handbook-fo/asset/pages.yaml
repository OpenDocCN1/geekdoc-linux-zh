- pgno: 56
  md: '# ## Get interactive with Scratch


    Projects


    # ### Connect the breadboard to your Pi


    **02** Power off your Pi and disconnect the power cable. Get your breadboard,
    an LED, a 330-ohm resistor and two GPIO cables ready. You''ll want to connect
    the 33V (top-right pin, closest to the SD card) to one end of the 330-ohm resistor,
    and then connect the positive terminal of the LED (the longer leg is positive)
    to the other end. The resistor is used to limit the amount of current that can
    flow to the LED.


    Then put the negative terminal of the LED into the negative rail of the breadboard.
    Connect one of the GROUND pins (for example, the third pin from the right on the
    bottom row of pins) to the negative lane. Now connect the positive to your Pi.
    The LED should light up. If it doesn''t, then it''s likely that you''ve got the
    wrong way round, so disconnect the power, swap the legs around and then try again.


    # ### Switch the LED on and off


    **03** At the moment, the LED is connected to a pin that constantly provides 3.3V.
    This isn''t very useful if we want to be able to turn it on and off, so let''s
    connect it to GPIO 17, which we can turn on and off. GPIO 17 is the sixth pin
    from the right, on the top row of pins. Power the Pi back on. We can turn the
    LED on by exporting the GPIO pin, setting it to an output pin and then setting
    its value to 1. Setting the value to 0 turns the LED back off.


    ```

    ```

    echo 17 > /sys/class/gpio/export

    echo out > /sys/class/gpio/gpio17/direction

    echo 1 > /sys/class/gpio/gpio17/value

    echo 0 > /sys/class/gpio/gpio17/value

    ```

    ```


    ![](img/f11b7dbb71886af07ef87126037ebe98_56_0.png)


    # ### Control the LED from Scratch


    **04** Start the LXDE desktop environment and open Scratch/GPICO. Go to the control
    section and create a simple script where Scratch pin 10 (when Sprite) is clicked.
    Then, add a GPIO toggle. The LED should light up. Then add the script ''wait 1
    second'' and then turn the LED off (GPIO 40) so the LED will come on for a second,
    then the LED off. Scratch/GPIO3


    # ### Wire up our push button


    **05** Power off the Pi again. This circuit is a little bit more complicated than
    the LED one we created previously. The first thing we need to do is connect 3.3V
    to the top-right pin we used to test our LED to. The positive rail of the breadboard.
    Then we need to connect a 100kOhm resistor to the positive rail and the other
    end of an empty track on the breadboard. Then on the same track, add a wire that
    has one end connected to GPIO 4. This is two pins to the right of GPIO 17. Then,
    on the same track again, connect one pin of the push button. Finally, connect
    the other pin of the push button to ground by adding a wire that is


    connected to the same negative rails that ground is connected to.


    When the button is not pressed, GPIO 4 will be receiving 3.3V. However, when the
    button is pressed, the circuit to ground will be completed and GPIO 4 will be
    receiving 0V (and have a value of 0), because there is much less resistance on
    the path to ground.


    We can see this in action by watching the Pi''s value and then pressing the button
    to make it change.


    ```

    ```

    echo 4 > /sys/class/gpio/export

    echo in > /sys/class/gpio/gpio4/direction

    watch -n 0.5 cat /sys/class/gpio/gpio4/value

    ```

    ```


    # ### Let there be light!


    **06** Boot up the Pi and start Scratch/GPIO3. Go to the control section and add
    ''when green flag clicked'', then attach a forever loop, and inside that an if
    else statement.


    From the operators section and add an if [] > ([Operator section and add an if
    []> to the sensing section and add a value sensor to the left side of the equality
    statement, and set it to four, Enter 0 on the right. Broadcast pin 10 (if the
    sensor value is 0, and broadcast pin 10 off otherwise. Click the green flag. If
    you push the button, the LED will light up.'
  merge: -1
  img_proc: true
