    # Running Synaptic – Part 1


    03


    In essence, that''s all you need

    to do. Synaptic is now installed

    and ready to use. However, due to

    its complexity, there may be some

    bugs that need ironing out first, so it''s

    best to follow these steps. To test if

    Synaptic is working okay, first enter the

