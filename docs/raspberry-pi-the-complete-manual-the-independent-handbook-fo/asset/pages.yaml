  img_proc: true
- pgno: 8
  md: '# Raspberry Pi 3


    # Getting started


    **GPIO port**

    The 40 pins on the GPIO port give you a range of power and function slots to control
    a project or read more data from your surroundings. This makes the Raspberry Pi
    3 the perfect core for an Internet of Things or Maker project.


    **USB ports**

    The four USB ports give you much more flexibility with the Raspberry Pi 3, allowing
    you to easily add a keyboard, mouse, wireless dongle and external storage without
    needing to constantly switch out or get a powered hub.


    **Ethernet port**

    The Pi 3 retains the wired network and internet connection that was on the Model
    B of the original Raspberry Pi. It still tops out at 100 Mb, but that''s plenty
    fast enough for the Raspberry Pi 3.


    **Integrated wireless**

    The big upgrade brought in with the Raspberry Pi 3 is the introduction of built-in
    802.11n wireless LAN and Bluetooth 4.1. Connecting to the Internet and other devices
    has never been easier.


    **Headphone jack**

    Need to listen to your Raspberry Pi purring? Connect it to a pair of portable
    speakers! The 3.5mm jack is still on the Pi 3, and is one of the higher-quality
    ones that was added to the Pi 2.


    **MicroSD**

    Underneath the board is where the boot medium lives – the microSD card. Much smaller
    than the SD card of the original, it still holds the full operating system and
    allows the Pi 3 to be much smaller.


    **HDMI port**

    The Raspberry Pi''s special ability is its decoded 1080p video on the fly with
    very little problem, and the same trick still exists in the Pi 3. The HDMI port
    is basically the same, allowing for high definition video and audio.


    > “The Raspberry Pi 3 still won’t be able to power a USB hub, so if you need to
    expand the complement you’ll need to get a powered-hub”'
  merge: -1
  img_proc: true
