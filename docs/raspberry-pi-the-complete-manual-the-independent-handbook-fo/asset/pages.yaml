  md: '# Projects


    Access your files with SSH


    # What you''ll need . . .


    +   * Any Raspberry Pi distro

    +   * www.raspberrypi.org/downloads

    +   * Internet connection

    +   * Second computer


    # Access your files with SSH


    Use the terminal of your home computer to gain quick and secure access to your
    Raspberry Pi


    # Did you know . . .


    > SSH is the most secure method of accessing any machine remotely. It''s also
    quicker than VNC.


    While remotely logging into the full X environment is – as we demonstrated on
    the previous pages – very useful, it has its disadvantages. Firstly, it''s not
    particularly quick or convenient to do. The user experience can be slow and cumbersome
    too, but worst of all, it''s not as secure as we''d really like.


    If you want to take a more convenient and secure approach to accessing your Raspberry
    Pi from another computer, you''ll find that all well-versed Pi enthusiasts will
    use SSH. SSH stands for Secure Shell and is a cryptographic network protocol which
    is designed to ensure secure data communication via the command line.


    While beginners might argue it''s easier to remotely access their Raspberry Pi
    using the full graphical interface, as soon as you''ve learnt a handful of basic
    command-line techniques you''ll quickly find ''dipping in'' to your Raspberry
    Pi via SSH is by far the most convenient way to talk to it remotely.


    You''ll be pleased to hear that SSH is already well configured out of the box
    – there''s very little you need to do to make it work, especially if your remote
    computer runs Linux or OS X, as we''re going to demonstrate here.


    # SSH is easy with Linux and OS X


    Assuming your Raspberry Pi is on and connected to a network either by Ethernet
    or a Wi-Fi dongle, the only piece of information you need is the IP address of
    your Pi. To discover this, all you have to do is open a terminal window on your
    Raspberry Pi and type the command ifconfig (Fig 1).


    If you''re connected by Ethernet cable you''ll see ''eth0'', then several lines
    of results. The IP address will be the number on the second line next to words
    ''inet addr''. If you''re connected by Wi-Fi,


    ![](img/f11b7dbb71886af07ef87126037ebe98_45_0.png)


    Fig 1 Use the ifconfig command in the terminal to discover the IP address of your
    Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# ## Access your files with SSH


    the result will be on the second line of ''wlant0''. The IP address itself is
    a group of four numbers separated by full stops. If you''re on your home network,
    it will likely be similar to 192.168.0.15. We''ll use this number for our guide,
    but replace it with the IP address you''ve seen via ''ifconfig.


    With this information in hand, all you need to do is open a terminal window on
    your remote Linux PC and type:


    ```

    ssh pi@192.168.0.15

    ```


    This assumes your Raspberry Pi''s username is still the default (which is ''pi'')
    and you''re replacing the IP address with the one you made note of just now. If
    you''ve added user accounts or changed the default, you''ll need to replace the
    username before the ''@'' with whatever you''ve changed it to. When you press
    Enter, you''ll be prompted to enter the password for your Raspberry Pi - again,
    if it''s the default you can type ''raspberry'', otherwise type in your Pi''s
    password and press ''Return.


    You''ll now see that the username details on the command line have changed to
    reflect those of your Raspberry Pi - you''re now connected remotely. Try looking
    through your files or using nano to open a file to edit it!


    # ### Never type another IP address


    Of course, if you take your Raspberry Pi to another network, your Pi''s IP address
    will be different. If you just want to connect to it remotely, it becomes incredibly
    tiresome to set up your PC with a keyboard, mouse and monitor just to get the
    IP address. Wouldn''t it be easier if you could just type the Raspberry Pi''s
    name into the terminal to connect? It sounds too good to be true, but it''s actually
    very easy to do.


    All you need is a small piece of software which effectively lets you discover
    hosts and services on your local network by name instead of IP address (Fig 2).
    To set it up on your Pi all you need to do is open a terminal and type:


    ```

    sudo apt-get install avahi-daemon

    ```


    Once the installation is complete, all you have to do to access your Raspberry
    Pi via SSH is type the following into the terminal:


    ```

    ssh pi@raspberrypi.local

    ```


    What''s more, you can use the name of your Raspberry Pi when you access it via
    any other form of networking, be it Samba, remote login or VNC or anything else!


    # # Projects


    ![](img/f11b7dbb71886af07ef87126037ebe98_46_0.png)


    # ### SSH with Windows


    As is the way with most things in the Windows world, accessing your Raspberry
    Pi with Microsoft''s operating system isn''t quite as straightforward as you''d
    think. Fortunately, there is a useful tool to help. PuTTY allows you to make your
    Secure Shell connection and it''s easy to set up and use. You can download PuTTY
    from: www.chiark.greenend.org.uk/ ~sgtatham/putty/


    ![](img/f11b7dbb71886af07ef87126037ebe98_46_1.png)'
