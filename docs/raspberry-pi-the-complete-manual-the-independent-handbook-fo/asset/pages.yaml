    Above The Pi-Mote IR control board is hugely versatile and only costs £9.99


    # Set up


    +   01  To get started, boot up your Raspberry Pi and load the LX Terminal, then
    update your software by typing:

    +   `sudo apt-get update`

    +   `sudo apt-get upgrade`

    +   Depending on which version of the OS you''re using, you may need to install
    the Python GPIO libraries. Raspbian Jessie comes with this library pre-installed,
    so you can skip this step! Type the following into the command line:

    +   `sudo apt-get install python-rpi.gpio`

    +   On completion, reboot your Pi. This will install the Python GPIO libraries,
    meaning you can access and control the pins with Python code.


    > “Your Pi can control up to four Energie sockets using this simple program”


    # Install the Energie library


    +   02  Next, install the Energie libraries. These enable the Pi-Mote board and
    Raspberry Pi to interact with Python. In the LX Terminal, depending on which version
    of Python you are using, type either:

    +   `sudo apt-get install python3-pip`

    +   `sudo pip3.2 install energenie`

    +   … for Python 3; or

    +   `sudo apt-get install python-pip`

    +   `sudo pip install energenie`

    +   …for an older version. In the future, Energie will update its software and
    you may need to run a check for updates to ensure that you have the most recent
    version. To update the software, type the code.

    +   `sudo pip install energenie --update`'
