- pgno: 47
  md: "# ## Projects\n\n# ### What you'll need. . .\n\n+   - Scratch\n+   - Internet\
    \ connection\n\n> **Did you know. . .**\n> \n> The website for Scratch, www.scratch.mit.edu,\
    \ contains lots of programs and games other users have made.\n\n# ## Scratch studio\
    \ projects\n\n+   **01**  Located at the top of the Studio are three quick-access\
