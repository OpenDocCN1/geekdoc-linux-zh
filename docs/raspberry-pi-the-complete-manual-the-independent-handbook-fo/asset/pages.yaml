    # Prepare your photos


    +   **03** Naturally, you''ll need a collection of digital photos to display on
    the Pi-powered digital picture frame. We have different options here (see boxout,
    page 107) but recommend you start with photos stored on your Pi, ones that have
    been copied via USB, via a network drive, or downloaded through your browser.


    ```

    sudo nano /etc/lightdm/

    ```


    # Set up your Pi picture frame


    +   **04** To configure the Raspberry Pi as a picture frame, we first need to
    prevent the screen from switching off. This means editing the lightdm.conf file.


    lightdm.conf


    Add this line under [SeatDefaults]:


    ```

    xserver-command=/ix -n 0 -dpms

    ```


    When done, save and exit with Ctrl+X, then reboot:


    ```

    sudo reboot

    ```


    # Install feh


    +   **05** NImage viewing software feh is the best option for building a simple
    Pi picture frame, so install this.


    ```

    sudo apt-get install feh

    ```


    Once installed, instruct feh where to find the images, changing /media/


    STORAGE/test with your directory path, eg


    ```

    DISPLAY=:0.0 XAUTHORITY=/home/pi/.Xauthority /usr/bin/feh -p -Z -F -R 60 -Y -D
    15.0 /media/STORAGE/test

    ```


    > “Naturally, you''ll need a collection of photos to display on the Pi-powered
    digital picture frame”'
