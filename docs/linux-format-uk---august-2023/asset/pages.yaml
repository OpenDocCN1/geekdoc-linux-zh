    fabrication process (dubbed Intel 7), while Apple''s M-series processors have
    been using a 5nm process since their launch in 2020.


    To help out, Intel''s 12th-generation Alder Lake processors, released at the end
    of 2021, introduced a heterogeneous core design. Where previous Intel chips typically
    featured four or eight identical cores, current models combine lightweight efficiency
    cores (E-cores) with powerful performance cores (P-cores) that only roar into
    life when they''re needed for the most demanding tasks. This idea was actually
    pioneered by ARM – it introduced what it called the big.LITTLE design in 2011
    – but now that Intel has got on board, we''re frequently seeing Windows laptops
    that can provide more than 10 hours of continuous video playback. Even so, few
    Windows machines can match the nigh-on 20 hours we saw from the M2 Pro-powered
    MacBook Pro 16-inch.


    any processors of its own. Rather, the company licenses its designs to companies
    that can then customise them as desired, and have them manufactured to their own
    specification. In the case of Apple Silicon, Apple uses the core ARM logic but
    adds many of its own optimisations, and outsources the actual manufacturing to
    TSMC.


    The way chips are marketed to end users is different, too. While all of Intel''s
    x86 processors use the same underlying architecture, it''s offered in an enormous
    number of different configurations. Within each generation of Core CPUs there
    are Core i3, i5, i7 and i9 variants, which further subdivide into ranges of different
