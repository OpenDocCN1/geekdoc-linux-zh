  md: '# Pi USER


    # It’s (finally) raining Pis, hallelujah!


    Eben Upton takes to the blogs to promise millions of Pis this summer.


    In the latest Raspberry Pi Community Events newsletter, Raspberry Pi CEO Eben
    Upton has provided an update on Pi stock levels. It seems things are on the up
    and up, with possibly a million units per month, thanks to a little help from
    Sony. Upton provided an update on the supply of Raspberry Pi: Q1 2023 was the
    worst for Raspberry Pi since 2015, with roughly 800,000 units shipped. That may
    sound like a lot, but typically Raspberry Pi ships that many in a single month
    not three. The good news is the drought of Pi is about to end. Long-term partner
    Sony has been able to stockpile the “non-silicon elements of our bill of materials”
    and this means that Raspberry Pi and Sony are able to produce more finished goods.
    Sales projections for May 2023 are at 600,000 units, with an expected 800,000
    units in June. But July 2023 is when things are due to get exciting, with Raspberry
    Pi expecting to sustain one million units per month for as long as necessary to
    clear the backlog. Upton ended the update on a positive note: “It’s been a painful
    two years since shortages kicked in, in 2021, but we’re confident that the shortages
    are behind us and that 2023 will be our strongest ever year for sales of Raspberry
    Pi single-board computers and modules.”


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_44_0.png)


    > Eben Upton proves once again to be the Pi man we all need!


    Les Pounder works with groups such as the Raspberry Pi Foundation to help boost
    people’s maker skills.


    # GET THE LOWE DOWN


    The Raspberry Jam movement was initially created to foster a community, one that
    had just found the Raspberry Pi and wanted to learn more about it. In the early
    days, it was somewhere you could actually get your hands on a Raspberry Pi. The
    original shortage was due to many thousands of eager makers wanting one of the
    first 10,000 boards. Back then, I remember learning about the Raspberry Pi and
    over time I learned enough to teach others. One of those was a young person called
    Josh Lowe. Their first project was an operating system emulated in Scratch, then
    they started to learn Python and it snowballed from there. In a few years, they
    went from young coder to creating Edublocks (https:// edublocks.org), a block-based
    coding platform that creates Python code using blocks. It wasn’t limited to just
    a Pi; it would also work with Adafruit boards and the BBC micro:bit. After being
    used in schools across the world, Edublocks has become a promising tool for educators
    and those looking to learn coding - without the scary typing bit. Fast-forward
    to 2023 and Lowe is now a senior software engineer and Edublocks has been acquired
    by Anaconda, a Python/R platform for data science, machine learning and AI. Did
    I mention that Lowe is only 19? This goes to show that learning to code, learning
    to think creatively and not giving up can be the best decisions you ever make.


    # Astronomical!


    It’s out of this world.


    The 2022/23 Astro Pi Challenge has run 24,850 young people’s software submitted
    from 15,000 teams across Europe. This stunning response to the ESA Education initiative
    proves how engaging innovative programmers are to young minds. Sign up at https://astro-pi.org
    and find out more about the results here: https://bit.ly/ifx304space


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_44_1.png)


    # AI, AI, oh!


    Learning farms.


    Last issue we reported on the Pi Foundation’s moves to formulate AI teaching.
