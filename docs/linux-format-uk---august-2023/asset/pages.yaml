  md: '# WIND

    OWS

    -WISE


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_9_0.png)


    Jon Masters has been involved with Linux for over 22 years.


    I recently hosted an industry gathering focused on server standards. I got chatting
    with a friend from a major chip company who has been responsible over the years
    for helping to lead ''bring-up'' of Windows and Linux on new chips. When a chip
    comes back from the factory, the first few weeks are when the logic blocks are
    tested, scores, fabrics, IOs and so on are gotten working, and everything is in
    some kind of organised chaos with people running round in labs.


    My friend told me something interesting: he said that Windows was a true test
    for the engineers, because it is not open source. When it comes to Linux, you
    can consult the source, or ping a friendly kernel dev, so the way he ended up
    truly learning every last piece of the machine came when he had to disassemble
    Windows code and figure out what he was trying to do from first principles, looking
    at disassembled binaries.


    The kind you get from running Oblivion on an (ELF) program, or via a tool like
    the NSA''s (yes, that''s NASA) Ghidra reverse engineering framework, used in combination
    with the compiler explorer godbolt.org (after Matt Godbolt) showing how different
    compilers compile code. Consider walking through a kernel binary -- it''s revealing!


    # Kernel Watch


    Jon Masters keeps up with all the latest happenings in the Linux kernel, so you
    don''t have to.


    Linus Torvalds announced Linux 6.4-rc6, saying, "I don''t think we''ve had anything
    hugely interesting happen the last week, and the whole 6.4 release really does
    feel like it''s going fairly smoothly. Knock wood, famous last words, you know
    the drill." This contrasts with the previous rc5 release, in which Linus had to
    revert a well-intended fix to module loading that turned out to break some systems.
    If things continue on the current track, we''ll likely be covering the 6.5 merge
    window (period of time during which disruptive patches are merged for a new kernel
    release cycle) in next month''s edition.


    Finally this month, I would like to give a shout-out to the coverage over at Linux
    Weekly News of the recent Linux Storage, Filesystem, Memory-Management and BPF
    Summit. Their coverage includes several read-outs on ongoing developments with
    CXL (Compute Express Link), in some respects a successor to PCI Express that allows
    for such innovations as memory expansion via CXL. Among the use cases covered
    was live migration of VMs without copying memory by leveraging shared CXL memory
    pools at the data centre level.


    These days, Linux is increasingly used in real-time environments, such as those
    involving industrial automation (Linux once joked about crazy people using Linux
    to control laser-welding robots), or stock market high-frequency trading. Indeed,
    a multi-decade effort has been underway to upsteam the PREEMPT-RT patches, with
    many pieces of these finally getting into Linux''s tree over the past few years.
    One of the key issues such patches aim to solve is that of priority inversion,
    in which a low-priority task (such as a simple bookkeeping task) can block a real-time
    task from making progress when needed.


    This is actually what happened in the NASA Mars Pathfinder programme (though it
    was running a commercial RTOS and not Linux). Typically, priority inversion is
    solved by temporarily ''boosting'' (inheriting) the priority of a dependent but
    otherwise low-priority task so that of the real-time task depending upon its output.
    Thus, when a critical lock is needed by a real-time task, the non-RT task might
    be temporarily boosted so that it can release the required lock.


    As John Stultz put it in his email about proxy execution, this is "a generalised
    form of priority inheritance". It''s interesting to watch as it might really improve
    the overall capability of Linux to handle real time. This won''t just benefit
    NASA rover, but also audio engineers and gaming fanatics running Linux.


    # ONGOING DEVELOPMENT...


    Randy Dunlap reminded Linus (and everyone else) of the existence of the scripts/parse-maintainers.pl
    script for sorting the entries in the kernel MAINTAINERS file. He noted that "it
    was giant. More than 100 out-of-order entries since it was last sorted". Linus
    responded, "Ugh. That file causes the most conflicts, and sorting it makes it
    horrendous". A suggestion to sort each RC1 was made (because Linus effectively
    owns the tree at that point).


    Matthew ''Willi'' Wilcox posted "Futexes & Folios" with an initial patch showing
    how he might convert the kernel''s futex locking code to use his newer folios
    rather than the legacy page structures. Hardware MMUs (Memory Management Units)
    as found in CPUs, for example, (and GPUs and so on) operate upon units of memory
    sized in pages, typically these are 4096 bytes (4K). Folios aim to arbitrarily
    group these pages together into larger chunks that are easier to manage, where
    possible. Futexes (fast mutexes are commonly used to back pthread mutexes used
    by Linux application code. Migrating the kernel over to folios is an ongoing journey.


    More patches continue to trickle in for the StarFive RISC-V-based SoCs (system-on-chips)
    commonly used in P1-like boards for that architecture. This month''s patches were
    for the camera subsystem used on those SoCs. The upstream story appears to be
    fairly good at this point for these low-cost developer boards.'
