- pgno: 50
  md: "# BlendOS IN DEPTH\n\ncarried out with ZFS or BTRFS. By default, BlendOS saves\
    \ the state every 12 hours, but this can be disabled if required. During writing\
    \ the GUI options for saving the system state were removed, hopefully these will\
    \ be restored by the time you’re reading this.\n\nIn the second major version\
    \ of BlendOS, the author has integrated support for the Waydroid emulator. As\
    \ you might guess, Waydroid requires a Wayland session to run and provides access\
    \ to an emulated Android installation. The method used to achieve this is to run\
    \ Waydroid within a container. Once Waydroid has been installed, it is possible\
    \ to install an app store and any apps that are installed are displayed in the\
    \ launcher.\n\nTwo versions of BlendOS are available, with the first using the\
    \ Gnome desktop environment and the second running KDE. Gnome favours a more modern\
    \ paradigm, with multiple workspaces and a single window per workspace. It is\
    \ argued that this allows for\n\nbetter focus on a particular task. We find it\
    \ difficult to use when trying to compare two documents side by side. KDE has\
    \ a more traditional paradigm and looks a lot like using a Windows device. KDE,\
    \ however, is infinitely customisable and has a huge number of extensions and\
    \ plugins that enable you to turn KDE into anything you want it to be. The screenshots\
    \ here are of the KDE version of blendOS, but installing the Gnome edition should\
    \ still be relatively simple.\n\nAs described above, it is possible to install\
    \ to the base OS. Packages are installed as an overlay, which is merged into the\
    \ root filesystem at the next boot. Unlike with Microsoft, where a specific command\
    \ is needed to install to the base OS, the standard Arch commands can be used.\
    \ For example, to install the ncurses disk usage tool, run the following command:\
    \ `sudo pacman -S dfdu`. Having said that, this should be used as sparingly as\
    \ possible. A better way to install apps is to use Flatpaks from the Discover\
    \ software tool. See the walkthrough (page 53) to learn how to install an app.\
    \ Using Flatpaks means that apps are sandboxed from the base OS and potentially\
    \ from each other.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_50_0.png)\n\nThe\
    \ NCurses Disk Utility (NCDU) has been installed directly on the host operating\
    \ system, using an overlay.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_50_1.png)\n\
    \nOperating system updates are installed from the KDE Discover app.\n\n# Keep\
    \ it contained\n\nAn integral part of BlendOS is the ability to install containers\
    \ and apps within them. This allows for a best-of-all-worlds approach, where apps\
    \ can be\n\n> **QUICK TIP**\n> BlendOS can be downloaded from https://github.com/blend-os/blendos/releases\n\
    \n# INTERVIEW WITH BRENDON CHUNG\n\n+   **Q** What caused you to become interested\
    \ in Linux and what was the first distro you used?\n+   **A** I started using\
    \ Linux at the age of seven. I switched to it as my old laptop was slowing down\
    \ with a third-gen i5. Also, since I used to develop Android apps using Java and\
    \ XML (Android Studio) back then, Android app builds were really slow on Windows.\
    \ That’s when I decided to try Linux on my laptop. Arch was the first distro I\
    \ used, followed by Ubuntu.\n\n+   **Q** What is the biggest change that you’ve\
    \ seen in Linux since starting working with it? We can recall editing XF86 config\
    \ files and dreaded damaging the monitor!\n+   **A** I have been using Linux since\
    \ around 2017, when I was seven. In those six to seven years, I’ve seen more popular\
    \ and becoming more popular and user-friendly. Back in 2017, Ubuntu was really\
    \ popular, with most other distributions that are now considered user-friendly\
    \ being branded as niche. I’ve witnessed the rise of immutable and atomic distributions,\
    \ as well as the huge strides in game support on Linux distributions. Containerised\
    \ packages have become the norm for Linux distributions (apart from Arch, of course).\n\
    \n+   **Q** What was the first public project that you were involved with?\n+\
    \   **A** My first popular public project was Ubuntu Unity (https://twitter.com/ubuntu_unity),\
    \ which I released in May 2020 and is now an official Ubuntu flavour, although\
    \ I had made some distros and projects before that as well.\n\n+   **Q** How do\
    \ you differentiate BlendOS from something such as Vanilla OS?\n+   **A** BlendOS\
    \ is aimed at a general computer user who wants to be able to run their regular\
    \ desktop apps (irrespective of Linux distribution), thus blurring the boundaries),\
    \ apps they use on their Android phones, as well as web apps from a curated list.\
    \ Vanilla OS is a great distro, but our goals are completely different. As per\
    \ the Vanilla OS website, it aims to deliver a stable, Debian-based immutable\
    \ distribution for Linux users. Besides, BlendOS offers support for multiple DEs\
    \ and is going to provide the ability to create remixes. We’re also working on\
    \ server and gaming editions for the next major release of BlendOS.\n+   \n+ \
    \  BlendOS uses Arch Linux as its base and allows you to install packages using\
    \ the system package manager while retaining immutability and atomicity (using\
    \ overlays), without having to reboot, unlike other immutable operating systems.\
    \ Also, unlike Vanilla OS, which only exports apps that have been installed using\
    \ Appx, which is its package manager (and its implementation of binary availability\
    \ doesn’t work for some apps, especially if the"
