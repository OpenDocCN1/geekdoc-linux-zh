  md: '# NEWSDESK


    # Distro watch

    What’s behind the free software sofa?


    ### **ARMBIAN 23.05.1**

    One of the few Linux projects to come out of Slovenia, Armbian has been around
    for about 10 years but in that time there have only been two stable releases.
    The focus of Armbian is on producing a Linux distribution for ARM development
    boards, such as the Banana Pi, Orange Pi, Pine 64 and others. There’s also a generic
    AArch64 image.


    The latest version of Armbian, 23.05 (code name Suni), has an LTS kernel based
    around Debian 12 and Ubuntu 22.04.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_8_0.png)


    ### **MX LINUX 23 BETA 1**

    Following two unannounced alpha releases, the first beta of MX Linux 23 has been
    officially released. The OS is always based on the latest Debian stable branch
    (currently Debian 12 Bookworm) and MX repositories. By default, it uses the Xfce
    desktop environment (currently v4.18) but there are also spins available using
    Fluxbox 1.3.7 and KDE/Plasma 5.27.


    The latest version’s boot menu now enables users to check media. The installer
    also supports both swap files and swap partitions.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_8_1.png)


    ### **ARCOLINUX 23.05.4**

    ArcoLinux is based on Arch Linux and uses the Calamares installer. Like Arch,
    it follows a rolling release model. The main release, ArcoLinux\_, is fully-featured,
    shipping with the Xfce desktop, OpenBox and i3 window managers, and a complete
    software suite.


    There’s also a selection of minimalist ISOs, such as ArcoLinuxD, which comes with
    no desktop environment or preinstalled software, so you can tailor the operating
    system to your needs. The main website has extensive video tutorials on how to
    do this.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_8_2.png)


    ### **ATHENA OS 2023.06.01 PARTHENOS**

    Athena is also based on Arch Linux. However, its main focus is on helping users
    to learn how to master cybersecurity.


    This Swiss-based Linux newcomer has access to the infamous BlackArch repository
    of pen-testing tools but describes itself as “lightweight”, in that the bare minimum
    of software is preinstalled.


    The latest version (code name Parthenos) integrates Hack The Box VIP content for
    playing retired machines. It also comes with an OpenAI ChatGPT desktop client.
    The default desktop environment is Gnome.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_8_3.png)


    # OPINION

    SPREAD THE WORD


    ![Joe Brockmeier](https://www.techradar.com/sites/default/files/2023-08/joe-brockmeier-headshot.jpg)

    **Joe Brockmeier**

    *is head of community at Percona.*


    WordPress turned 20 recently, which is a good opportunity to take stock of the
    impact it’s had. It has evolved from a nifty, easy-to-use blogging platform for
    enthusiasts to a ubiquitous tool that powers a huge chunk of the web.


    Along the way, WordPress has become a fantastic ambassador for open source. People
    who wouldn’t have any reason to touch desktop Linux or do programming still wanted
    to run a blog or website. So they got hands-on with WordPress and, generally,
    had a good experience. Even better, WordPress is a really friendly, helpful community.


    It’s also had a symbiotic relationship with MySQL. Millions of people who’d never
    have any other reason to work with a database got their feet wet standing up a
    MySQL database for WordPress. And MySQL, part of the LAMP stack that powers WordPress,
    helped WordPress spread.


    MySQL is powerful enough to run sites with massive amounts of traffic but is also
    resource friendly and easy to use for millions of users with more modest needs.


    For more than 20 years, WordPress, with MySQL, has given millions and millions
    of people a voice and a home on the internet. It’s an amazing achievement and
    I can’t wait to see what the next 20 years bring!'
