  md: '# Desktop switcheroo TUTORIALS


    Session, which runs a user''s session; and Embedding, which runs small applications
    or even a single video from your browser.


    You will use Sway as a session compositor, making it run nested under your running
    compositor. Once you decide to stay with Sway, you can make it your default from
    your display manager (GDM) where you login. Other options are available for special
    systems.


    To control what you are doing, look for the configuration file in `~/.config/sway/config`.
    All of the configuration can be in this file or you can split it into files under
    `~/.config/sway/config.d`. Run Sway from the terminal:


    ```

    $ sway -c ~/.config/sway/config

    ```


    Sway opens like any other application and you can start new applications, which
    show up on your new desktop. The main reason for doing this, though, is to test
    the window manager. Play around with the shortcuts and see if the chosen keys
    suit you. Now, you can also set different configurations and hit Smot-Shift-c
    to reload the configuration. This way, you can quickly run through all your ideas
    while still having a stable main desktop. Here, again, you must be prepared to
    do more tweaks when you start running it as your main window manager. There will
    be small details in the configuration that may stop some features.


    This is all well and good, but there is another case you may want to consider:
    when you want to run only one application all the time. When would that be? For
    embedded systems, such as your Raspberry Pi controlling your automation project.
    A smart home application that does not require Big Tech to know what you''re doing
    is one example. A media player is another, perhaps connecting to your regular
    TV, giving you a smart home entertainment system.


    Any small system you build with a single-board computer can run Linux. You wouldn''t
    choose anything else, would you? All of them have a user interface, some of them
    even have their own screen. Such a system needs only the application it was meant
    for and nothing else.


    Enter Cage, a tiny compositor for Wayland with a few twists. It only opens one
    window in full-screen mode and exits when that application stops. It also deliberately
    lacks screen controls and border decorations. All of this creates a system that
    doesn''t have any tools that would be capable of doing damage to the system. In
    this way, the attack surface for hackers is much smaller.


    The intention of this software is to make a small system called a kiosk. These
    systems are the ones where you buy tickets or search for local information or
    other public services. In such a system, you want only the particular application
    to run. Often this is written as a web page. In a public space, though, you want
    only the specific application to run. The safest way to do this is to start it
    using your initiation system.


    Cage runs any application that you put as the first parameter. In the earlier
    mentioned scenario, the application is the only one started


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_68_0.png)


    Keybindings in Awnesime, and other window managers, can be hard to remember. To
    get the reminder page, use ''Super-V''.


    by your chosen system. Yes, Systemd is the industry standard but there are others!


    # Cagey desktops


    To install Cage, you can use your package manager. If you like the inclination,
    the code is available on GitHub: https://github.com/hjilves/cage. Clone the repo
    and use `meson` to build it. Do that if you know how; for the rest of us, install
    with the `apt` command:


    ```

    $ sudo apt install cage

    ```


    Cage has very few options and they are for window dressing and when you need a
    dual-monitor config. The only thing you need to do is to choose the application
    and run it:


    ```

    $ cage sway

    ```


    You get the same window, the difference is below the surface; Cage is a compositor
    in itself, so you can run anything in it. You can use it to run apps remotely
    and have them show up on your desktop. Being a tiny binary, Cage is fast and efficient.
    The point is that you can lock a user in a ''cage'', allowing a safer way to allow
    remote execution via Wayland and its remote back-end.


    To run it remotely, it gets more complex. But not much. First, you must set values
    on the remote system for the wroots execution – this is described in the documentation.
    As the designers made Cage for the kiosk environment, the most interesting use
    of this software is single-application boxes.


    When switching environment, you need to be aware of both the computer and yourself.
    The computer must be set up correctly and you must learn to make actions automatically.
    If you don''t, you will waste a lot of time when you have more important things
    to do. With the right tools, you can run things over the network, too, and have
    one environment on each computer. 87


