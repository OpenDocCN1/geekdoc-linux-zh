  md: '# HOTPICKS


    # WEB BROWSER


    # Mullvad Browser


    Version: 12.0.4

    Web: https://mullvad.net/en/browser


    We''re big fans of the Tor browser. It''s become the go-to option for the privacy-conscious
    thanks to its ability to conceal the user''s identity, physical and digital, by
    routing connections to volunteer-run encrypted servers across the world.


    Tor''s developers have collaborated with the Mullvad VPN service to create a privacy-centric
    browser that doesn''t use the Tor network, yet extends the privacy advantage of
    the Tor browser. To install the Mullvad browser, download the latest version and
    extract it with `tar xzf mullvad-browser-linux64-12.0.4-ALL.tar.gz`. Head to the
    extracted directory and fire up the browser with `/start-mullvad-browser.desktop`.


    *Mullvad* appears like a normal web browser, and you use it as such as well. By
    default, it comes with private mode enabled, which means it won''t preserve cookies
    between sessions. It also discards the list of visited pages, search bar entries
    and any cached web content.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_85_0.png)


    Interestingly, *Mullvad* isolates cookies in separate cookie jars so trackers
    cannot connect to each other, preventing them building a digital persona of the
    user. Furthermore, the browser also helps you hide personal data and online activity
    by concealing your metadata. It also assigns all its users with a similar digital
    fingerprint by hiding clues like screen resolution, WebGL and common APIs, and
    restricting fonts.


    To further reduce your digital footprint, *Mullvad* integrates only a few vital
    plugins, such as the popular ad-blocker *uBlock Origin*. One of its most interesting
    features is dubbed *New Identity*, which essentially zaps all cookies immediately
    without closing the browser, making it virtually impossible for trackers to track
    you.


    You don''t have to be a Mullvad VPN user to use the Mullvad browser, although
    its developers recommend using it together with a VPN service for further privacy.


