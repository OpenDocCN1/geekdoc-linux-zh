    \ *Valheim* a wonderfully communal feeling. We've built a small settlement with\
    \ several buildings, we share resources and discoveries, take on boss fights together,\n\
    \n![](img/5cfcf2f4448dccdd1c5c2a2851544557_23_1.png)"
