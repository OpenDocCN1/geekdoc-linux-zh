  md: "# The user interface\n\nYour connection to the system.\n\nAll of these desktops\
    \ can be customised, but we're evaluating the default desktop experience. Evaluating\
    \ the user interface of a distribution, we expect something that looks good and\
    \ is easy to understand and use. At this point, we expect the application launcher\
    \ to be a searchable icon, and we appreciate a smooth, mouse-free workflow, from\
    \ summoning the launcher to locating the correct application to, finally, launching\
    \ it.  \nUser interface looks aren't just about prettiness. We like something\
    \ that's consistent and clear. Most machines that are in use today have a few\
    \ pixels to spare, so some use of space is welcome. For example, some Linux window\
    \ managers seem to like to impose tiny window controls and a layout with insufficient\
    \ visual indication of where a user interface area starts and ends. There's no\
    \ accounting for taste, but user interfaces with a completely flat look are difficult\
    \ for new users to understand at a glance.\n\n# Ubuntu Studio 8/10\n\nGiven the\
    \ use of dark colours, you might not think this is a KDE/Plasma desktop. The desktop\
    \ uses the standard launcher/switcher panel, but it puts it at the top, and there\
    \ is a selection of quick-launch icons on the bar as well. The searchable launcher\
    \ uses categories and some of these expand on the standard defaults with helpful\
    \ titles such as Audio Production and Graphic Design, which is a nice touch that\
    \ aids navigation among the many specialised apps that are included. Compared\
    \ to other similar distros, we found that we needed to increase the size of the\
    \ font and the main panel, but these tweaks were relatively easy to carry out.\
    \ Although we're used to seeing bright default themes with KDE, the desktop is\
    \ easy to navigate. Sure enough, when we launched apps such as text editor Kate\
    \ or graphics editor GIMP, they also used a dark theme, aiding overall consistency.\n\
    \n![](img/5cfcf2f4448dccdd1c5c2a2851544557_27_0.png)\n\n# Kubuntu 9/10\n\nProperly\
    \ configured, KDE 4 (with the Plasma window manager) offers about the best balance\
    \ you're likely to find of a traditional desktop with modern, clean looks and\
    \ lots of features. It's not the lightest option, but with a reasonably modern\
    \ computer, that won't make much difference. It's airy, with well-spaced elements\
    \ and clear lines separating different areas. It's also close enough to traditional\
    \ desktops that it works in a way that most people will be familiar with. By default,\
    \ the task switcher is icon-based rather than using the traditional task panels,\
    \ but it's easily switchable. The super key launches the application launcher,\
    \ which is searchable, but it's also tied into the constantly updated desktop\
    \ search features, meaning that it's a hub for finding documents as well as apps.\
    \ KDE 4 is maybe the most polished-looking Linux desktop around right now.\n\n\
    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_27_1.png)\n\n# Drive and memory efficiency\n\
    \nExtra efficiency is like having a faster CPU without spending money.\n\nWe're\
    \ not focusing on performance on low-end machines in this Roundup, but all of\
    \ these distributions should be way ahead of Microsoft Windows on such hardware.\
    \ We've reached a point where even a comprehensive Linux desktop doesn't require\
    \ a huge chunk of the memory in a computer with only 8GB or even 4GB of RAM at\
    \ a push.  \nIf you were working with an extremely resource-constrained machine,\
    \ Ubuntu would be our first choice of distro from this selection. On a fresh boot,\
    \ only 560MB of RAM is in use. Ubuntu was also the least disk-space-hungry of\
    \ the flavours on test, only requiring 7.3GB of space on an updated fresh installation.\
    \ Kubuntu offers a state-of-the-art Linux desktop that looks great, and it proves\
    \ our point as it only uses 833MB of RAM and takes up 16GB of disk space. We were\
    \ slightly surprised that Ubuntu MATE also used 16GB of disk space because it's\
    \ not particularly packed with applications, but it's not that important in most\
    \ situations. It also used 886MB of RAM, which is perfectly fine for computers\
    \ with 4GB of memory or more – modern browsers are the real hogs.  \nEduUbuntu\
    \ is also far from being a resource hog as it only used 962MB of RAM. It used\
    \ the most disk space of any of the flavours at 19GB, but that's hardly surprising,\
    \ given how many applications it packs in. Much the same can be said of Ubuntu\
    \ Studio. This uses 1GB of RAM on fresh boot and 14GB of disk space, neither requirement\
    \ a big deal on the sort of computer you'd probably use for media creation work.\n\
    \n+   **VERDICT**\n+   \n+   UBUNTU STUDIO\t7/10\tUBUNTU MATE\t7/10\n+   KUBUNTU\t\
    8/10\tLUBUNTU\t9/10\n+   EDUBUNTU\t7/10\n+   None of the distributions are resource\
    \ hogs or slow in any way.  \n+   Kubuntu was the lightest overall, though."
  merge: -1
  img_proc: true
