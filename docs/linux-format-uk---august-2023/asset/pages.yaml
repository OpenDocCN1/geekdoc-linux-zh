  md: '# Photo restoration TUTORIALS


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_72_0.png)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_72_1.png)


    CREDIT: Original photo: Adam Jones. CC BY 2.0, www.flickr.com/photos/adam_jones/2658352670


    you''ll see curves for Red, Green and Blue. Fine-tune any or all of these curves
    by selecting the appropriate one against Channel.


    Before moving on from the subject of editing your scanned image with the aim of
    making it as good as new, let''s take a quick look at how you could make a black-and-white
    image better than new. Not everyone will agree with that perception, and we certainly
    wouldn''t want to dismiss the appeal of black-and-white photography, but you might
    like to experiment with turning your old black-and-white photo into a colour one.
    You could certainly do that manually in *GIMP*, and while that would involve quite
    a lot of work, it''ll probably give the best results, so long as you know what
    colour everything should be. However, you could try an automated colourisation
    tool, and while recognising that it won''t have any knowledge about the colour
    of your great grandmother''s dress, the results can be pretty impressive. The
    tool we tried is hosted online, and you can find it at [www.img2go.com/colorize-image](http://www.img2go.com/colorize-image).
    Just upload your restored black-and-white photo, click on Start, and prepare to
    be amazed. We also noticed that, if you upload a badly faded colour photo, it
    makes a good job of restoring the original colours – indeed, if our faded photo
    was typical, it performs better than GIMP''s Auto Input Levels in its Adjust Colour
    Levels dialog.


    # Archive your results


    It''s quite possible that your photo-editing skills have turned back the clock,
    and restored your old photos to the way they looked decades ago. But don''t forget
    that the clock will start ticking again straight away, and unless you look after
    your edited photos, they''ll start degrading. So, if you want to pass them on
    to future generations, you''ll need to look after them. And here


    we''re not talking about inkjet prints of your restored photos, because that wouldn''t
    be a good way of preserving them for any length of time, but about the edited
    digital images.


    The way in which your digital images degrade is entirely different from the way
    the initial photographs degraded, and potentially more catastrophic. Prints and
    negatives degrade gradually, while their digital equivalents are more likely to
    degrade instantaneously. That loss could be the result of a disk crash, and this
    emphasises the importance of archiving your edited photos. As with any data, there
    are two main options. First, you could archive into the cloud, but remember that
    it''s not uncommon for companies to go out of business, so there''s no guarantee
    that your online archive will be available to future generations. Second, you
    could archive to external local media, but again there are issues to consider.
    First, digital data tends to be temporary in nature – in other words, having written
    your photos to a DVD-R disk, for example, there''ll be a limit to how long into
    the future you''ll be able to read it. So, read up on the longevity of your media
    and rewrite your archive to new media well before the safe period expires. But
    there''s more, as you''ll be aware if you happen to have any old floppy disks
    lurking in a drawer. Quite apart from whether the data is still intact, you probably
    don''t have a floppy disk drive on your PC, and the same will eventually be true
    of today''s generation of optical disks. Sure, you''ll be able to find service
    providers who''ll be able to read them for some time into the future, but that
    probably won''t be a long-term solution. So, be sure to rewrite your archive to
    new types of media as and when necessary. Since neither archiving approach is
    without its problems, it would be wise to adopt both a cloud-based and a local
    external media strategy to provide extra peace of mind.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_72_2.png)


    > **QUICK TIP**

    > You might some of your restored photos on glossy paper and mount them in an
    old-fashioned album. Despite the recent trend towards printed photo books, you
    can still buy albums, often of a traditional design, even down to the use of corners
    to hold the photos in place.


