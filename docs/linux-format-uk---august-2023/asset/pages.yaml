  md: '# Music composition **TUTORIALS**


    # » **RECOMENDED PLUGINS**


    We highly recommend the Calf Studio Gear (\[https://calf-studio-gear.org/\]) collection
    of audio effects. These come in the Linux native LV2 plugin format and are available
    in the repository of most Linux distros. These effects cover all the basics, such
    as reverb, chorus and compression, and the quality is superb. The user interfaces
    of each effect are also excellent and typically feature colourful real-time displays
    complete with all sorts of useful meters.


    When it comes to synthesiser instruments for the MIDI side of Ardour, SurgeXT
    (\[https://surge-synthesizer.github.io\]) is one of the best options. It was formerly
    a commercial product that has been made open source, and it’s under constant development
    from the community. We think the LV2 version of the plugin works better in Ardour
    than the VST one.


    If you like realistic drum sounds and you prefer MIDI composing to using drum
    loops, consider the **x42** AVL drum plugin (\[https://x42-plugins.com/x42/ x42_avldrums\]).
    This was made from samples of a real drum kit with hits at various velocities,
    and there is even a selection of different drums. Specifically, it exposes a lot
    of routing possibilities in Ardour.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_76_0.png)


    you are sure that your instrument or voice is routed to the track, you can begin
    to make a recording.


    To record in **Ardour**, you must arm the current track. You do this by clicking
    on the red, circular record icon on the track. Secondly, you must place **Ardour**
    itself into record mode by clicking on the Record icon in the transport bar. Once
    **Ardour** is in record mode, it behaves as normal other than the fact that it
    records audio to any armed tracks. This means that you can record to more than
    one track at once if you audio interface has the inputs.


    When you are ready to begin, press play as normal and the recording starts. If
    you make a mistake, stop the recording (on the transport bar or press Space).


    # **MIDI editing**


    We’ll close this overview with some remarks about MIDI editing. **Ardour** is
    better known as a multitrack audio recorder and editor, but it has basic MIDI
    sequencing features as well. One of its strengths in this area is that its MIDI
    and audio editing facilities are quite similar, so most of what you’ve learned
    about audio recording and editing can be transferred across.


    As when creating an audio track, you can create a MIDI track by right-clicking
    in the track panel area. This time, select MIDI rather than Audio as the track
    type. To hear any sound from a MIDI track, there must be an instrument plugin
    on the track. You can select such a plugin from the list of detected plugins when
    creating a track. If you create a MIDI track without a plugin, you can add one
    later using the Plugin Manager in the same way we did with the reverb plugin.
    As with audio, you can add effect plugins after the instrument plugin.


    The MIDI editing in **Ardour** is done inline just like the audio editing. Double-click
    on the lower part of the track in the track panel area to expand the size of the
    track line so you can see the notes. You can add notes manually using the mouse
    by selecting Draw Mode from the toolbar.


    Recording works in the same way as for audio. Arm a MIDI track and put **Ardour**
    in recording mode. When you press play, any MIDI input is added to the region.


    # **Exporting projects**


    When you’ve finished your song by recording it, editing it and mixing it by adjusting
    the track levels and adding effects to them, it’s time to export it as an audio
    file. The simplest way of doing this is to use the quick export (Session > Export
    > Quick Audio Export).


    Hopefully, we’ve taken you through a common Ardour workflow to create a song from
    scratch. One advantage that Ardour has over some other music programs is that
    the many elements of the user interface are shared between working with MIDI and
    audio. So, every time you learn a new trick in one area, it can be used when working
    with the other. Best of luck exploring Ardour’s extensive features! ✔


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_76_1.png)'
