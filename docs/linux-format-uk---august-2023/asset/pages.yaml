- pgno: 62
  md: '![](img/5cfcf2f4448dccdd1c5c2a2851544557_62_0.png)


    > PL/I predated the microprocessor by seven years, but that didn''t stop it appearing
    on microchips, including the Intel 8008, thanks to PL/M.


    file, and the records that the code will write to the file **recent-employees.dat**
    will be **FRED BEDFORD** and **HARRY HILL**:


    | FRED | BEDFORD | 01012023 |

    | GEORGE | SMITH | 1012019 |

    | HARRY | HILL | 08082022 |

    | JENNY | MARSHAL | 05052018 |


    Note that there shouldn''t be an **LF** terminator on the final line of the file,
    otherwise the PL/I program will read an empty line at the end, and this will cause
    some unexpected behaviour. Some text editors, including Vim and the GUI *Text
    Editor* that forms part of the Ubuntu distribution, do add an **LF** on the last
    line, but we discovered that *Brackets* doesn''t, so that would be a good one
    to use.


    # ## PL/I as a system language


    Less well known, perhaps, than PL/I''s use as both a scientific/technical/mathematical
    language and for commercial, business-oriented applications, PL/I was also designed
    for system programming. As such, it can be likened to C, plus several more modern
    languages, in straddling the divide between the domains of system and application
    programming.


    Prior to PL/I, assembler had been used pretty much exclusively for writing operating
    systems and compilers. Partly this was due to efficiency, and we admit that the
    design of the language alone wouldn''t address that directly, because efficiency
    is very much tied up with the performance of the compiler. However, language features
    are also highly important. After all, if you''re coding in assembler, you can
    do pretty much anything, whereas this wasn''t the case with many of the early
    high-level languages. Having never written any system code, this author couldn''t
    say first-hand what features are required by the system programmer. However, we
    did come across the following statement from an unnamed person who had been involved
    in writing PL/I compilers, which provides just a little insight: “PL/I was the
    first general-purpose language with usable string data type. It also has variable-length
    bit strings.” Needless to say, it also provided a means of working with those
    new types of data, for example *by providing the bitwise operators OR, AND, XOR
    and NOT*, something that the original versions of FORTRAN and COBOL didn''t offer.
    Or, to be more accurate, you can do this in any language, of course, as all practical
    languages are universal, but only where bitwise operations are provided natively
    is this efficient.


    Probably the best way of seeing something of PL/I''s capabilities in the system
    programming arena, though, is to look at Multics, where it pioneered the use of
    a high-level language for writing operating systems. Multics was one of the first
    multi-user, time-sharing operating systems. It''s considered to have influenced
    all modern operating systems. Indeed, it''s claimed that its most lasting legacy
    on the computer industry was to inspire the creation of UNIX, and we all know
    where that lead. It also seems to have been a commercial success, since it ran
    at a total of 85 sites. That might not sound like a lot today, but this was in
    an era when computers were vastly expensive and therefore few and far between.
    The Multics project started in 1964, with the initial release in 1969. It was
    a joint project involving MIT, General Electric (GE), and Bell Labs. It was developed
    on the GE-645 mainframe computer, which was specially designed for it. General
    Electric is barely remembered as a computer manufacturer today. However, its business,
    including Multics, was taken over by Honeywell in 1970, which later became the
    French computer company Bull, and is now part of the multinational IT company
    ATOS. [25]


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_62_1.png)


    While not a major success in the West, PL/I was used extensively in the USSR,
    on machines like this **ES EVM 1035** mainframe.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_62_2.png)


    # ## » PL/I''S IMEEDIATE FAMILY


    Most of us have seen “family trees” that show how programming languages have been
    influenced by their predecessors and, in turn, themselves influenced their successors.
    However, rarely do these diagrams show today''s languages as being in PL/I''s
    direct line of descent. In fact, it seems it was something of a dead end. However,
    it did spawn several languages in the short term, most of them having names starting
    **PL/**, to emphasise their family resemblance.


    To be honest, many of PL/I''s descendants were really dialects of the original
    language, and here we could mention **PL/M**, which was developed by Intel for
    use on microprocessors. **PL/S** was a bit different in being further allowed
    for system programming and, as an extension to PL/I, it allowed assembly code
    to be included inline. **PL/C**, *Programming Language Cornell*, was developed
    at Cornell University. It was designed as an educational language, so in the early
    ''70s, it would have been an alternative to BASIC, despite the two languages being
    very different. In reality, despite being referred to as a dialect, PL/C was little
    changed from PL/I. However, the implementation was novel in that students never
    encountered compilation errors, which was important when it might have taken hours
    to receive the listing from a compilation. To achieve this, it attempted to correct
    syntax errors and, where it wasn''t possible, it converted the offending statements
    to output to help in debugging.


    # ### QUICK TIP


    > > PL/I is certainly not dead and gone – reportedly, the language is still used
    for new developments, commonly for systems programming, primarily on **IBM z/Architecture**
    mainframes.


