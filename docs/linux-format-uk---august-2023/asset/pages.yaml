  md: '# The Verdict


    # Ubuntu spins


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_30_0.png)


    Ubuntu has a desktop that looks professional and comes with detailed GUI functionality
    and all of the basic applications that you''re likely to need. We agree with the
    decision to stick with generic options where they are superior to KDE alternatives,
    but we also love using the KDE and Qt programs that make up the bulk of the smaller
    tools. These smaller tools and the configuration options have a high level of
    consistency in how they look and work. There''s nothing wrong with the grab-bag
    approach of a cobbled-together Linux system, if that is what you prefer, but Kubuntu
    feels like a coherent, professional desktop with a lot of features, in a similar
    way to either Mac OS or Windows.


    Edubuntu is the closest of the flavours to standard Ubuntu as it uses Gnome, and
    it mixes a full complement of standard applications with a set of specialist ones.
    Like Ubuntu Studio, it does the job that it''s designed to do very well, and can
    be used as though it were standard Ubuntu. However, people who aren''t interested
    in the special focus on educational tools might be overwhelmed by all of the extra
    tools, but to a lesser extent than with Ubuntu Studio. To get a bit critical,
    the project has recently restarted and the documentation hasn''t yet caught up,
    meaning we had to search around online to discover what features it has.


    What Ubuntu Studio offers would undoubtedly wow the average Windows user as it
    has so many media applications that are completely free and ready-configured.
    If you want to build a music production computer, for example, installing it might
    be the ideal first step. However, evaluating it as a general-purpose distribution,
    the dark, minimalist look and the overlapping functionality of the slightly overwhelming
    application selection might be intimidating if you aren''t specifically interested
    in media creation.


    Ubuntu MATE offers a pleasant, traditional desktop. It would make an ideal business
    desktop or a home desktop for someone looking for consistency and simplicity.
    Maybe one to set up for the parents? Although good, some of it is starting to
    look a little old-fashioned.


    LXQt is a great lightweight desktop environment and Lubuntu is a distribution
    with slick, simple looks. The application set that it comes with covers the basics
    and it''s left to you to expand the system.


    +   1. **Kubuntu 9/10**

    +     **Web:** https://kubuntu.org **Licence:** Various

    +     **Version:** 23.04

    +     Sleek, efficient and professional looking. It could be used for anything.

    +   2. **Edubuntu 8/10**

    +     **Web:** www.edubuntu.org **Licence:** Various

    +     **Version:** 23.04

    +     Feels like the standard Ubuntu experience with lots added for educational
    use.

    +   3. **Ubuntu Studio 8/10**

    +     **Web:** https://ubuntustudio.org **Licence:** Various

    +     **Version:** 23.04

    +     Great, preconfigured setup for media-centric users with a showcase of apps.

    +   4. **Ubuntu MATE 7/10**

    +     **Web:** https://ubuntu-mate.org **Licence:** Various

    +     **Version:** 23.04

    +     A classic Linux desktop with traditional looks and features.

    +   5. **Lubuntu 7/10**

    +     **Web:** https://lubuntu.me **Licence:** Various

    +     **Version:** 23.04

    +     A lightweight, simple desktop that''s ready to be expanded by the user.


    # » ALSO CONSIDER


    The natural alternatives are the other Ubuntu flavours, and there are 10 flavours
    in total. Ubuntu Budgie uses Budgie, a lightweight desktop environment with quite
    a lot of flexibility in the layout. Ubuntu Cinmonn uses the Cinnamon desktop environment,
    which covers similar ground to MATE, but it''s derived from Gnome 3 rather than
    Gnome 2, aiming to provide the best of both worlds in terms of a traditional layout
    with some of the modern features of current Gnome.


    Unity was Canonical''s attempt to create a desktop that would work equally well
    on desktop systems and portable devices. Canonical ceased development of Unity
    in 2017, but another team is still developing a fork. It looks and works similarly
    to Gnome 3. Ubuntu Unity is the official Ubuntu flavour that features it as the
    default desktop.

    We looked at Ubuntu, but Xubuntu is another popular lightweight Ubuntu flavour
    that uses Xfce as its desktop.'
