  md: 'managed to turn around a quote with extra rainbows, ponies and unicorns, saying
    that Google thinks this is the way ahead, and everyone fell in line. It was like
    outsourcing your due diligence.

    If you’re a busy executive, it makes sense to know that you have the right people
    on board. Of course, Google has supported us with Google Summer of Code over the
    many years and has contributed a lot. Red Hat has done fantastic work, too – at
    the time, it hired an extra three developers to work on LibreOffice, making its
    team free.


    LXF: This was 10 years ago, when everything was still desktop applications – now
    everything has gone online and is run through browsers.

    MM: Many applications have but many haven’t. Browsers are desktop applications
    – whether you


    # CLOUD CUCKOO LAND


    > “The thing about a lot of these cloud services – you give them all of your data
    and then you can visit it on their terms.”


    like it or not, they are some of the biggest and most security critical desktop
    apps we have. I think there’s still space for desktop LibreOffice and Collabora
    Online or Office. Of course, there’s huge use of that underlying technology –
    the LibreOffice Core and all of the goodness that’s in there – in the community
    and around it. It is something that can be reused in lots and lots of places.

    Of course, Collabora Online fills the huge need for deploying that technology
    in the browser, ensuring it’s very easy to deploy, with zero touch on the client
    – it’s very secure and very interoperable.

    LXF: The last time we spoke (News, LXF267), you were unhappy about how the governance
    around LibreOffice was being handled. Has that situation improved?


    MM: I think the reality is that people have different visions for where LibreOffice
    should go. That’s absolutely fine. We have a governance that’s supposed to mediate
    and make that include everybody, and a meritocratic governance should include
    everyone.

    You’d like to hope that all of the people’s voices will be represented in the
    critical decisions at TDF (The Document Foundation). I think it’s vital for the
    future of TDF that we include everyone in the discussion and don’t preemptively
    exclude people.

    I think things are probably getting better at LibreOffice. I’ve seen them making
    decisions and doing things recently that seem positive. There’s huge potential
    there. There’s vast goodwill around LibreOffice. We spent years building that
    trademark as a whole community. I think it’s really important


    that asset is then used for the good of the whole community, including everyone
    who’s working on it. Politics is difficult, governance is hard. Getting 10 people
    to agree is not easy.

    LXF: To come back to COOL, what have been the big wins for it recently?

    MM: One of the things we’ve done recently is Zotero integration, which is really,
    really cool. If you use Zotero normally, you need to have a Java app running on
    your desktop, and that then talks to the browser or the office suite in some way.
    We’ve got rid of that, so that it’s much easier to deploy – you can just churn
    it out to lots of people and they can then share citation databases.


    It’s more useful than you might think. Students want to use it for their projects,
    to prove that they haven’t been fully written by automation. They can actually
    say where they got the content and the ideas from, and then it can be marked,
    but professors want this functionality as well, so they can establish the web
    of trust, and hopefully avoid the paper mills and the malfeasance in science.

    There’s loads of interoperability work, too. So, 16,000 columns for Calc – for
    years, we’ve had two million rows, because that’s all good, but just spreading
    that out sideways to be full, the same size as Excel, is key. Actually, we can
    do even bigger than that – don’t tell anyone, but we can do 16 million rows.

    Interestingly, some people want that. We had a customer in the past who wanted
    to just use the spreadsheet for sorting CSV files. The problem was it would take
    hours in Excel. He was doing it in the cloud only, so the ability to use Collabora
    Online and sort it in literally seconds instead of an hour was cool. It’s just
    nice to see – you can win there, there’s nothing magic about it, it’s just software.
    With enough time, people and optimisation we can be massively better.

    I’d like to add, I’m a spreadsheet guy at heart, so what more do we have in spreadsheets?
    What we’ve had is Sparklines. That’s reending these little mini charts in cells,
    so you can turn a cell into a chart of some other cells without a scale. Sparklines
    was the idea of seeing trends without scales.

    LXF: You’ve mentioned digital sovereignty before – what do you mean by that?


    MM: It’s a different way of looking at the free software message. If you go right
    back to the genesis of the GPL and Free Software Foundation, Richard Stallman
    wanted to be able to fix his printer – the printer would jam and no one knew about
    it, so no one would go and mend it. He just wanted to tell people the printer
    was jammed and he couldn’t, the software being proprietary. He didn’t have control
    over the device that they paid for, and laser printers weren’t cheap back in those
    times. He’d been disappointed, he was no longer sovereign.

    Sovereignty is something that governments and big institutions care about, perhaps
    more than individuals, but we can all do it – we can all take control of our lives'
