  md: '# ## Use a Pi HAT on the Raspberry Pi Pico


    Being a skinflint Northerner, **Les Pounder** is all about reusing things, so
    he explains how you can use Pi HATs on the Pico.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_47_0.png)


    **OUR EXPERT**

    Les Pounder is associate editor at *Tom’s Hardware* and a freelance maker for
    hire. He blogs about his adventures and projects at [http://big.les](http://big.les).


    ATS only work on a Raspberry Pi, right? Generally yes, but sometimes they can
    work with the Pico. Pimoroni’s Drum HAT is an older HAT with eight pads that can
    be used to perform drum solos and such. For this tutorial, we will repurpose a
    Drum HAT to be a USB human interface device (USB HID) via a Raspberry Pi Pico
    running CircuitPython. Drum HAT’s CA1188 capacitive touch sensor needs just four
    pin connections to our Pico. The problem is that the 20x2 (40-pin) configuration
    of the Raspberry Pi means we can’t just drop it on to a breadboard. This is where
    some careful snipping of header pins is required. Using header pins, a long breadboard
    and some jumper wires, we can connect our two I2C pins GPIO16 to SDA, GPIO17 to
    SCL, 3V3 to 3V3 and GND to GND. The I2C pins each require a 10kOhm resistor from
    the pins to the 3V3 rail of the breadboard so the pins are pulled high. See the
    circuit diagram in the download for clear pin locations.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_47_1.png)


    > In not too many wires, and not too much time, you can reuse an old Raspberry
    Pi HAT with a Raspberry Pi Pico.


    CircuitPython devices. If you plan to use **Thonny**, check the boxout (opposite)
    for a quick setup guide. Create a new file and start the project code by importing
    a series of modules. The first is board, which enables our code to use the Pico’s
    GPIO. Next, adafruit_cap1188.I2c is the module for the CAP1188 touch sensor. Hardware-accelerated
    bus access is provided via busio; time is used to control the speed of the code
    and usb_hid emulates USB input devices.


    # ### Prepare CircuitPython


    Connect the Pico to your computer while holding the BootSEL button. This forces
    the Pico into bootloader mode and a new drive, **RPI-RP2**, appears in the File
    Manager. Go to `https://circuitpython.org/board/raspberry_pi_pico/` for the Raspberry
    Pi Pico or `https://circuitpython.org/board/raspberry_pi_pico_w` for the Pico
    W. Download the latest stable version of CircuitPython for your Pico. From the
    downloads folder, copy the **CircuitPython** file (a UF2 firmware image) to the
    **RPI-RP2** drive. After a few moments, the drive disappears and is replaced with
    **CIRCUITPY**. This is where we will write the code for the project.


    +   **YOU NEED**

    +   - Pico or Pico W

    +   - Pimoroni Drum HAT

    +   - 5x male-to-male jumper wires

    +   - A large breadboard

    +   - 2x 10kOhm resistors

    +   - Code:

    +     - `https://github.com/lesp/LXF-304-PiTuts-Pico-DrumHAT-Shortcut-Keypad/archive/refs/heads/main.zip`


    ```

    ```

    import board

    from adafruit_cap1188.i2c import CAP1188_I2C

    import busio

    import time

    import usb_hid

    ```

    ```


    Next is another series of imports, this time for setting up our Pico as a USB
    keyboard using a US layout. We also configure the device to use USB


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_47_2.png)


    > Make sure that the pins are spaced correctly and in the correct row.

    > Yes, we got it wrong a few times.'
