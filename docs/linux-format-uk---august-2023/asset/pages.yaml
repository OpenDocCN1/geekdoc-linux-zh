    Version: 2.0.1

    Web: https://hugolabe.github.io/Wiki/


    If you love Wikipedia, you can use *Wiki* to access it from the comfort of a distraction-free
    desktop app, along with extra features and better integration than you get with
    a web browser. The app is available on FlatHub, and can be installed with `flatpak
    install flathub com.github.hugolabe.Wiki`. Once installed, you can launch it from
    the distro''s Applications menu or with `flatpak run com.github.hugolabe.Wiki`.


    *Wiki* has an intuitive interface, which also very helpfully offers several colour
    schemes such as Sepia, Dark and Light. Furthermore, the app also enables you to
    customise various aspects of the interface, including the spacing and fonts, to
    make the reading experience more comfortable.


    Articles within *Wiki* work and behave pretty much as they do on the Wikipedia
    website. Clicking on a link in an article takes you to it within the app. Furthermore,
    you can also enable link previews, after which you''re able to hover over internal
    links to get an excerpt and an image preview of the link.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_85_1.png)


    *Wiki* has a multi-tabbed interface and supports over 300 languages. Some of the
