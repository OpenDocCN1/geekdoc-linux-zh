  md: "![](img/5cfcf2f4448dccdd1c5c2a2851544557_92_0.png)\n\nprint(\"To the west you\
    \ see an iron grille set into the wall.\")\nelse:\n    print(\"You cannot go that\
    \ way.\")\n\nIf you're using **Mu**, remember that you need to save code with\
    \ a valid filename, such as `test1.py`, before you can run the script.\n\nIn order\
    \ to break this code down, the `print` command is being put to fine use here.\
    \ Setting the variable `action_input`, then matches any of the lower-case letters\
    \ `n, s, e` or `w` so that the script prints out a description of the new room.\n\
    \nThe `elif` command is Python's shortened version of `ELSE IF`, which simply\
    \ means if the input doesn't match, to carry out another query. If you don't input\
    \ a valid direction, this script just tells you, \"You cannot go that way.\"\n\
    \nWhile you can code an adventure in this way, it will cause headaches later on.\
    \ Firstly, you are probably going to want to have more than five rooms. This means\
    \ you'll have to include more lines of `print` and `elif` commands to describe\
    \ each one. Most text adventures also allow you to interact with the room in some\
    \ way. What if you want to pick up the axe or try to open the gate?\n\nSince you're\
    \ probably going to want to do other things besides drift between rooms in future,\
    \ it's best to define movement as a specific function. You can create functions\
    \ using the `def` command in Python. The syntax is quite simple, for example:\n\
    \n```\ndef hello_world():\n    print(\"Hello World\")\n```\n\nYou can then call\
    \ this function by just inserting `hello_world()` anywhere into your script.\n\
    \nAs things stand, this script simply exits gracefully as soon as you've moved\
    \ to one room. Luckily, Python lets you use the `while` command to loop code,\
    \ which you\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_92_1.png)\n\ncan insert\
    \ into your new `move` function:\n\n```\ndef move():\n    print(\"Which way will\
    \ you go?\")\n    while True:\n        action_input = get_player_command()\n \
    \       if action_input in ['n', 'N']:\n            print(\"To the North, you\
    \ see the skeleton of a dwarf holding an axe.\")\n        elif action_input in\
    \ ['s', 'S']:\n            print(\"To the South, you see an antique wooden chest.\
    \ It's locked.\")\n        elif action_input in ['e', 'E']:\n            print(\"\
    To the East, you see entrance to the cave.\")\n        elif action_input in ['w',\
    \ 'W']:\n            print(\"To the west you see an iron grille set into the wall.\"\
    )\n        else:\n            print(\"You cannot go that way.\")\n\ndef get_player_command():\n\
    \    return input('Action: ')\n\nmove()\n```\n\nThis version of the code is a\
    \ slight improvement. There's now a defined function for moving. Players can\n\
    \n> **Mu** is an excellent Python editor. You can write and run code from within\
    \ the program. Make sure to save first.\n\n# » MAPPING YOUR WORLD\n\nBack in the\
    \ day, budding game designers would create the maps for their text adventures\
    \ using graph paper and a lot of patience. You're welcome to try this if it tickles\
    \ your fancy, but there are more modern alternatives.\n\nOne of these is **IFMapper**\
    \ (https://tinyurl.com/ifmapper). This handy tool enables you to plot individual\
    \ rooms, map routes between them and even list a room description and items.\n\
    \nDoing this now will give you a much clearer idea of how to code the game later\
    \ on. IFMapper's written in Ruby, so to get started, run `sudo apt-get install\
    \ ruby` in the terminal.\n\nInstall the dependencies by running `sudo apt-get\
    \ install build-essential libfox-1.6-dev ruby-dev libxrandr-dev` then install\
    \ IFMapper itself with `sudo gem install ifmapper` . You can now run the program\
    \ at any time by typing IFMapper into the terminal.\n\nOnce the program launches,\
    \ go to `File > Save` and give your map a memorable name.\n\nClick on any box\
    \ in the grid to create a new Location. Double-click it to change the name, such\
    \ as Main Cavern. You can use the other tabs to add a list of items in the\n\n\
    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_92_2.png)\n\nTools such as IFMapper enable\
    \ you to easily plot out the areas and rooms in your game.\n\nroom (if there are\
    \ any), as well as a description. Click the dotted lines between rooms to represent\
    \ a route between them. You can delete a route or room simply\n\nby clicking on\
    \ it and then pressing Del.\n\nIf you need some inspiration, go to `File > Open`\
    \ and check out the maps directory for some examples."
