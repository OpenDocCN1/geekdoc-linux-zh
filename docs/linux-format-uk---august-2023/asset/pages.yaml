    predefined self-explanatory modes: Power Save, Balance, Performance and Ultra.


    Note that even though the app doesn''t need root privileges to run, as soon as
    you select a mode, a pop-up window asks for the super user password. The Energy
    Performance parameter then changes to reflect the current enabled mode.


    The developers point out that Boost Changer isn''t designed to replace other battery-life-optimising
    utilities such as TLP and PowerTOP. Instead, the app can be thought of as a graphical
    front-end for quickly altering the clock speed of the CPU using the sysfs pseudo
    filesystem. Also note that the app currently only works on real CPUs, and not
    on virtual hardware.


    > Use Boost Changer to alter the clock speed of your CPU in order to either maximise
    performance or save energy.


    # **PDF EDITOR**


    # PDF Mix Tool


    Version: 1.1.1 Web: https://scarpetta.eu/pdfmixtool/


    If you work with PDF files, PDF Mix Tool is a wonderful utility to have in your
    repertoire.


    The app enables you to perform common editing operations on PDF files, such as
    merging two or more PDF files, changing the orientation of the pages inside the
    PDF, extracting pages or images from a PDF, and a whole lot more.


    PDF Mix Tool is available in the repos of most distros. Users of Debian-based
    distros such as Ubuntu can fetch it with sudo apt install pdfmixtool, while those
    using Fedora and its derivatives can use sudo dnf install pdfmixtool to install
    the app. If your distro doesn''t have the latest version of the app, you can also
    fetch it from either Flathub or the Snap Store.


    The app has a fairly intuitive interface. All the supported operations are listed
    in the left-hand column. Begin by selecting the operation you are interested in.
    Depending on the selected operation, you see the relevant options on the right-hand
    panel. For instance, if you select the Merge PDF Files option, the app then asks
    you to point it to the PDF


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_89_1.png)


    files you want to merge. After adding in all the files you want to merge, you
    can rearrange their order by using the Move Up and Move Down buttons. When you''re
    done, hit Generate PDF to create the new combined PDF.


    Similarly, to extract pages from a PDF, select the Extract Pages option, point
    the app to the relevant PDF file, and then select the pages you want to extract.
    You can save the extracted pages as individual PDF files or as a single PDF. The
    Delete Pages option works in the same fashion, but instead zaps the specified
    pages.


    Another interesting option is the Pages Layout section, which you can use to alter
    the orientation of the pages inside a PDF. [1]


    > In addition to altering PDFs, you can also use the app to convert a PDF file
    into a booklet.'
