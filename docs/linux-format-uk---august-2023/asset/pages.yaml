  md: "# CODING ACADEMY\n\nMU\n\nCredit: https://codewith.mu\n\nPart One! Don’t miss\
    \ next issue, subscribe on page 16!\n\n# Code your own Python text adventure\n\
    \nNate Drake guides you through creating your own interactive text adventure with\
    \ the power of Python, starting with the basics...\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_91_0.png)\n\
    \n+   * OUR EXPERT\n+   * Nate Drake wants to dedicate this series to his dad,\
    \ who once told him that no one was ever going to pay him to sit around and play\
    \ video games.\n\nT hose of us old enough to remember the ‘70s and early ‘80s\
    \ know that games were graphically very uninspiring, not to mention the fact that\
    \ personal computers were still prohibitively expensive. In 1975, MIT student\
    \ William Crowther took some time out of his busy schedule developing ARPANET\
    \ to create a text adventure game he could play with his kids. Although it wasn’t\
    \ the first of its kind (that honour belongs to 1973’s *Hunt the Wumpus*), Colossal\
    \ Cave Adventure quickly spread over the early internet after heavy modifications.\
    \ The basic premise was the same as any text adventure, in that you entered commands,\
    \ such as the cardinal points of the compass (N, S, E and W), to move between\
    \ areas, and interact with items, traps and monsters in a bid to win through to\
    \ the end with maximum points.\n\nYounger readers may find it difficult to believe\
    \ that people actually still do this for fun. In fact, IF (interactive fiction)\
    \ has never been more popular. The annual XYZZY Awards even offer prizes to those\
    \ who code the very best text adventure games. In this four-part series, we plan\
    \ to take you through the basic steps of creating your own text adventure game\
    \ using the Python 3 programming language. The good news is that since it’s text-based,\
    \ you won’t need a degree in Photoshop wizardry. It’s also a great programming\
    \ project for getting started with Python, as well as developing clean coding\
    \ practices. If you’re a Linux user, there’s more good news, because support for\
    \ Python 3 is almost certainly already built into your distro. You can just type\
    \ *python3* via the terminal to get started. Still, this isn’t the easiest way\
    \ to code and run Python scripts, so we’ve used the Mu Python interpreter instead.\
    \ It’s available in the Ubuntu software centre and it offers a quick and easy\
    \ way to run scripts. Mu’s also available for the Raspberry Pi.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_91_1.png)\n\
    \n+   * QUICK TIP\n+   * To download all the code samples for part one of this\
    \ series, open a terminal and install Git via *sudo apt-get install git*. Next\
    \ run *git clone https://github.com/ aagreate/ bpython- textadventure.git*. The\
    \ files download to the 'bpython adventure' folder in your home directory.\n\n\
    Starting with how **not** to do it... In the first part of this guide, we’re going\
    \ to focus on getting set up and world-building. In other words, you will learn\
    \ how to create rooms in your underground cavern, dungeon or mystical world, as\
    \ well as navigate between them.\n\nIt’s very easy to imagine that this is a lot\
    \ easier than it is. For instance, try pasting this script into your Python interpreter\
    \ and running it:\n\n```\nprint(\"Which way will you go?\")\naction_input = input('Action:\
    \ ')\nif action_input == 'n':\n    print('To the North, you see the skeleton of\
    \ a dwarf holding an axe.')\nelif action_input == 's':\n    print('To the South,\
    \ you see an antique wooden chest. It’s locked.')\nelif action_input == 'e':\n\
    \    print('You see entrance to the cave where you arrived earlier. The gate is\
    \ locked.')\nelif action_input == 'w':\n```"
