  md: "# # REVIEWS\n\n# # Anycubic Photon Mono 2\n\n**Denise Bertacchi** likes this\
    \ blend of quick setup with detailed prints.\n\n+   **SPECS**  \n+   **Build volume:**\
    \ 165x69x143mm  \n+   **LCD screen:** 6.6-inch monochrome  \n+   **Light source:**\
    \ Parallel matrix  \n+   **XY axis resolution:** 34 microns  \n+   **Normal exposure\
    \ time:** 2.5 seconds  \n+   **Interface:** 2.8-inch touch panel  \n+   **Connectivity:**\
    \ USB Type A 2.0  \n+   **Machine footprint:** 390x229x235mm  \n+   **Weight:**\
    \ 4kg\n\nM ade specifically with first-time resin users in mind, the Anycubic\
    \ Photon Mono 2 delivers quality 4K prints with a smaller-sized vat and a petite\
    \ footprint that requires minimal space. Retailing at a rock bottom price, we've\
    \ noticed serious cutbacks in the machine's base unit and cover, both of which\
    \ are plastic rather than metal or acrylic, but the print quality is crisp, speed\
    \ is good, and the machine is very easy to use, making it one of the best resin\
    \ 3D printers around.  \n\nEverything you need to get started is included, even\
    \ a manual, plus the usual USB drive with Anycubic's Photon Workshop slicing software,\
    \ a PDF of the manual and two pre-sliced test prints.  \n\nComing mostly assembled,\
    \ you simply screw in the vat and build plate, and you're ready for calibration.\
    \ Levelling the build plate is fairly straightforward and only takes a piece of\
    \ paper and an Allen key.  \n\nThe Photon Mono 2 packs a lot of detail in its\
    \ prints. It has the same LightTurbo system you'll find on newer Anycubic machines,\
    \ which provides smoother details. It's on the smaller side of resin printers,\
    \ but we could fit six preported miniatures on the build plate at once. It has\
    \ a laser-etched build plate that helps prints stick, but things still come off\
    \ easily enough with the metal scraper. The top of the plate has enough slope\
    \ to allow most of the resin to drain back into the vat.  \n\nUnlike its FDM printer\
    \ cousins, the Photon Mono 2 reads files from a USB stick rather than a microSD\
    \ card. The custom slicer Photon Workshop 3 has improved greatly and we didn't\
    \ have any problems using it. It handles supports well - automatically and manually.\
    \ It also has tools for hollowing the model and adding a drainage hole, so you\
    \ can conserve resin.  \n\nWe ran a model of Boba Fett at 70% to fit on the plate,\
    \ with the bust and base printing separately. This printed using Siraya Tech's\
    \ Fast Navy Resin and a three-second exposure time, taking five hours and 15 seconds\
    \ for the bust, then another three hours and 10 seconds for the base. The model\
    \ has incredible details, down to the cracks in the helmet and wrinkles in the\
    \ sleeve fabric. There are no tell-tale layer lines when viewed with the naked\
    \ eye and you have to look super-hard to find any with a camera set to close-up.\
    \  \n\nAnycubic sent a sample of its new High Clear Resin to test with the Mono\
    \ 2 printer. This is a new formula of resin that can create crystal-clear prints\
    \ when you follow a simple curing technique. The model printed as normal, using\
    \ a slightly longer exposure and less curing time. It printed in two hours and\
    \ 13 seconds, with a four-second layer exposure and no supports. The finished\
    \ result is as clear as glass where sealed, and frosted where it was just cleaned.\n\
    \n![](img/5cfcf2f4448dccdd1c5c2a2851544557_18_0.png)\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_18_1.png)\n\
    \nBob here really shows off the detail this resin printer is capable of producing.\n\
    \n> Exceptional print quality hasn't been compromised by cheaper materials.\n\n\
    +   **CREDIT:** Anycubic\n\n# **VERDICT**\n\n**DEVELOPER:** Anycubic  \n**WEB:**\
    \ www.anycubic.com  \n**PRICE:** £209\n\n|  | FEATURES | EASE OF USE |  \n|---|:---|:---|\
    \  \n|  | 8/10 | 9/10 |  \n| PERFORMANCE | 9/10 | VALUE | 9/10 |\n\nA budget 4K\
    \ resin printer tailor-made for beginners, the Photon Mono 2 delivers great output\
    \ and easy setup.\n\n# » Rating 9/10"
