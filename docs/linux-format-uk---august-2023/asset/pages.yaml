  md: '# Collabora interview IN DEPTH


    and parts of it. It''s the free software message applied in a way that''s easy
    to understand.


    For large countries and governments, particularly in the current geopolitical
    environment, there''s a risk of being cut off from banking networks, or software
    suppliers suddenly bricking all your devices. I think we are only seeing the tip
    of the iceberg of what''s possible in terms of digital interventions. It''s seriously
    important to be able to control your own data, to know where it is, and not have
    it creep out of your nation, or worse, have misinformation coming in, in a way
    that you can''t control, along with algorithms that are unhelpful for your policy.


    So, there''s a lot of traction, politically, on the idea of sovereignty at the
    moment. Digital sovereignty, I think, is a key part of that. And there''s a negative
    part of that, which is the way we achieve digital sovereignty by buying British
    – we''re only going to use English software – because that just isn''t going to
    work. The only way, really, that we can make that promise real is by using open
    source so that everyone can collaborate, everyone can have confidence in it, and
    everyone can actually get capable products. They can then become indigenous, you
    can get support services from wherever you like, without losing the ability to
    collaborate with the globe.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_42_0.png)


    **LXF:** One situation we''ve seen several times is if you put your files into
    a proprietary service that uses DRM and it then collapses, you''ve lost your documents.


    **MM:** The thing about a lot of these cloud services – you give them all of your
    data and then you can visit it on their terms. You pay generously and you pay
    to access your own data, under their terms – and that''s a little bit unfortunate.


    We talk about AI and it''s easy to mock it a bit but this anthropomorphisation
    of AI that we have already, even with very weak AI, I suspect is only going to
    get worse. And the idea that Microsoft is reading your email – or whatever brand
    it is, such as Copilot; it''s a friendly sounding brand, right? – but the idea
    that it is reading not only your calendar but your email... So, this is a bit
    of interesting psychology to try to persuade people to surrender their data and
    all their information to the benign automata that will process it. We''ll see
    what people''s reaction to that is as it gets more and more complex.


    I think humans will eventually adapt to anything. Luckily, no one has yet produced
    an advert that you can''t say no to.


    **LXF:** I met a Cuban who had moved to the UK and he asked me how I coped with
    adverts, because he just wanted to buy everything he saw. He obviously lacked
    any filter.


    **MM:** I never had television as a child. No television. Our television was books
    – this is a television and you can flick the pages! When we did see television,
    it was absolutely mesmerising. You know, we''d sit there a year ago at the magic
    in the box. But it becomes commonplace and humans are amazingly good at adapting.
    Let''s just hope they don''t adapt to thinking it''s normal to surrender all their
    data!


    I think the commercial side of it is probably the most exciting thing, in as much
    as that''s what drives you. Selling things is what drives our ability to make
    new features. It''s really the key that underlies what we do. So, for example,
    Deutsche Telekom just deployed its MagentaCloud/Collabora Online for two million
    users. It''s the biggest enterprise file sync and share solution in Europe, which
    is kind of cool. And that again helps us improve the product and make it better
    for everyone.


    It''s not just the big hosting deployments, but also our partner networks have
    230 partners – Nextcloud, OwnCloud, Seafile, ICONOS, 1&1 working that we have,
    Mail.com, gmx.de,... Tons of people are using the software, just building that
    cycle of growing it and accelerating. That is really where we''re at. There''s
    a network effect – the better the product becomes and the more we can communicate,
    the more we can grow and tell people about it. Open source often fails by being
    cheap, as you can''t then fund the cycle of marketing and sales and awareness
    raising. Collabora Online is inexpensive, but you gain so much more from it than
    proprietary options. So you see people preferring to use Oracle rather than, say,
    MariaDB, because there''s perceived to be no value in it, because there''s no
    marketing for MariaDB.


    It''s like Stella Artois – seeminglyly expensive. What kind of marketing timeline
    is that? And yet it worked, right? Which is ridiculous, because we make a great
    product that''s better and gives you more freedoms – it''s more open, more collaborative
    and just slicker.


    Michael Meeks expounds upon free software, document liberation, Cloud services,
    AI and more.'
