  md: '# OPINION

    HEAD

    WESTON!


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_7_0.png)


    Weston is a Wayland

    compositor. Released

    in mid-May, v12.0 brought

    multiple enhancements

    including two new back-

    ends, support for multiple

    scanout devices and the

    addition of new protocol

    implementations. Alongside

    these features, we also have

    been adding multiple fixes

    and internal changes that

    would further facilitate

    integration of functionality

    like colour management or

    the ability to load up multiple

    back-ends at the same time.


    The backend-drm has

    seen a lot of changes: plane

    rotation, alpha and HDMI

    content type properties have

    been integrated. Depending

    on the client’s content buffer,

    the compositor can leverage

    properties to make use of

    available display hardware

    capabilities. Also, support

    for multiple GPUs as scanout

    devices (KMS) has landed

    and is enabled by passing

    additional devices when

    starting up the compositor.


    As we head towards the

    ability to load multiple back-

    ends, two new ones have

    seen the light of day.

    Backend-vnc, which is similar

    to backend-rdp, is based on

    ami and neatvnc libraries. It

    has TLS support and user

    authentication, while the

    other is a PipeWire back-end

    that creates a node for each

    output and can be used to

    capture Weston outputs

    for processing with

    other applications.


    # SOFTWARE

    Wine to be

    employee-owned

    CodeWeavers establishes a trust.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_7_1.png)


    CodeWeavers is establishing an

    employee ownership trust that

    will hold a controlling stake in

    the software company.


    This is exciting news as the company is

    behind the open source Wine project, which

    allows many Windows programs to run on

    Linux. It also powers the Proton compatibility

    layer used by the Steam Deck.


    Under the new ownership structure,

    the trust will eventually become the sole

    shareholder of the company. In the meantime,

    former CodeWeavers CEO Jeremy White has

    stood down and now serves as chairman of

    the board and a member of the Trust

    Stewardship Committee. He will remain a

    shareholder for seven years, after which

    the trust will be the sole owner.


    In a CodeWeavers press release, White

    explained: “The trust allows the company to be

    run for the benefit of the staff and the broader

    community, rather than for shareholder profit. I

    believe this will create a more sustainable,

    ethical and equitable business.”


    The same release reiterated CodeWeavers’

    dedication to open source principles.


    # DISTRO

    Ubuntu 18.04

    moves to ESM

    Bionic Beaver gets a new

    lease of life thanks to

    premium features.


    Most Ubuntu users are familiar with the

    LTS (Long Term Support) releases,

    which are officially supported by

    Canonical for five years after release.


    Officially, Ubuntu 18.04 (Bionic Beaver)

    reached its end of life this April. However,

    Canonical is offering Extended Security

    Maintenance (ESM) for the OS, just as it did

    for Ubuntu 16.04 LTS.


    This means businesses who haven’t yet

    made the upgrade to the latest LTS release can

    still receive critical security updates. Canonical

    recommends the best way to do this is through

    an Ubuntu Pro subscription.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_7_2.png)


    # SOFTWARE

    Thunderbird

    gets new logo

    5, 4, 3, 2, 1… Thunderbird

    email client has an overhaul

    and a new logo.


    In late May, Ryan Sipes, a product

    manager at Thunderbird, announced

    that the famous email client is

    “enjoying a resurgence”.


    As part of a revamp, 20 years after designing

    the first Thunderbird logo, Jon Hicks was asked

    to reimagine what Sipes calls his original “wig

    on an envelope” design.


    Initial feedback has been positive, with users

    comparing it to the revamped Firefox logo. Read

    more about latest Thunderbird developments

    at https://blog.thunderbird.net/.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_7_3.png)'
