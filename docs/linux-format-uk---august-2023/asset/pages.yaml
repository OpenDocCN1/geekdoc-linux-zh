    plus set a backup retention scheme, with backups kept for ever by default (basically
    until you run low on disk space), or kept for a minimum of three, six or 12 months.
    Finally, to change what''s backed up, switch to the Folders tab.


    # Restoring backups


    When your backup runs, any new files are added and changed files are recorded,
    too. They don''t overwrite the original backed-up files, which means that not
    only can you restore the latest version of any backed up file, but you can roll
    back changes on individual files, too.


    Should you need to restore any files from your backup, open Backups again, but
    this time switch to the Restore tab and wait while your backups are scanned. Once
    the initial scan is complete, you''ll see a Files-like view of all the folders
    stored in the backup.


    In the bottom-right is a Date field that displays the date (and time if more than
    one backup exists on a specific date) of the selected backup. If you''re looking
    to restore an earlier version of a file, use this drop-down to select the date/time
    of the backup you want.


    Backups requires you to manually select the folders or files to restore. To restore
    everything, press Ctrl+A followed by Restore; otherwise browse through the'
