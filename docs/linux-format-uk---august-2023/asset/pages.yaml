  md: "# # CODING ACADEMY Text adventure\n\n# ## QUICK TIP\n\nIf you prefer\nnot to\
    \ install\nextra software,\non the terminal\non most Linux\ndistros can\nrun Python\n\
    perfectly well.\nTo execute a\nscript, just use\nthe **python3**\ncommand\nplus\
    \ the\nfilename, such\nas **python3**\n**adventure1.py**.\n\nnow enter directions\
    \ in upper or lower-case. After\nyou've made a move, the game asks where to go\
    \ next.\n\n# ## A touch of class\n\nNow that you have your movements down pat,\
    \ it's\ntime to start doing some world-building. This is where\nPython comes to\
    \ the rescue through its use of classes\nand objects.\n\nA class is best described\
    \ as a kind of blueprint\nthat allows you to define objects. A class defines the\n\
    attributes a method can have. For instance, each room\nin your adventure will\
    \ be in a specific location and have\na specific description. To get started,\
    \ define the **room**\nclass by placing this code at the top of a new script.\n\
    \n```\nclass room:\n    def __init__(self,number,name,description,exits):\n  \
    \      self.number = number\n        self.name = name\n        self.description\
    \ = description\n```\n\nNow you've defined the **room** class, you can actually\n\
    list a specific room below it, for example:\n\n```\nroom1 = room(1, \"Main Cavern\"\
    , \"You are standing in a\ndark cavern. You hear the sound of dripping water.\"\
    )\n```\n\nYou can now interact with the object attributes from\nwithin your script\
    \ using the format **object.attribute**. For\ninstance, try adding these lines\
    \ at the end of your code\nto see the **name** of the room and its **description**:\n\
    \n```\nprint (room1.name)\nprint (room1.description)\n```\n\nThis is fine for\
    \ providing a description of the very\nfirst room, but what about when you move\
    \ to others?\nOnce again, classes and objects can come to the\nrescue. Return\
    \ to the top of your script and create a\n**player** class below the **room**\
    \ one, as follows:\n\n```\nclass player:\n    def __init__(self,name,currentroom):\n\
    \        self.name = name\n        self.currentroom = currentroom\n```\n\nNow\
    \ you can change the **player's** location – to\n**room1**, for example – and\
    \ display the **name** and\n**description** for that **room**. Just add these\
    \ lines to\nthe bottom of your script and run it:\n\n```\nplayer.currentroom =\
    \ room1\nprint(player.currentroom.name)\nprint(player.currentroom.description)\n\
    ```\n\nTry adding other rooms besides **room1**. Next try\nadding these lines\
    \ to the end of your script:\n\n```\nPlayer.currentroom = room1\n```\n\n```\n\
    def move():\n    print (player.currentroom.name)\n    print (player.currentroom.description)\n\
    \    print(\"Which way will you go?\")\n    while True:\n        action, input\
    \ = get_player_command()\n        if action_input in ['n', 'N']:\n           \
    \ player.currentroom = room2\n            move()\n        elif action_input in\
    \ ['s', 'S']:\n            move()\n        elif action_input in ['e', 'E']:\n\
    \            player.currentroom = room4\n            move()\n        elif action_input\
    \ in ['w', 'W']:\n            player.currentroom = room5\n            move()\n\
    \        else:\n```\n\n# ## » KEEPER OF THE KEYS\n\nNo text adventure would be\
    \ complete without having the\nplayer negotiate locked doors. To get started,\
    \ first create a\n**key** class at the top of your script:\n\n```\nclass key:\n\
    \    def __init__(self, keyusedesc, keyroomdesc, keyexits):\n        self.keyusedesc\
    \ = keyusedesc\n        self.keyroomdesc = keyroomdesc\n        self.keyexits\
    \ = keyexits\n```\n\nYou should also update the **room** class to have an optional\n\
    key attribute **self.key**. The **player** class also needs to be\nupdated with\
    \ their own **self.keying** attribute, so the script can\ncheck if they have the\
    \ **right key** for this **room**. So you can now\ncreate a specific **key** object\
    \ below where the exits are defined:\n\n```\nredkey = key(\"You use the red key\
    \ to unlock the gate\", \"You\nsee the entrance to the cave where you arrived\
    \ earlier.\"The\nred gate lies open.\", [None, None, room6, room1])\n```\n\nYou\
    \ can now add:\n\n```\nroom4.key = redkey\nplayer.keyring = [None, None, None,\
    \ None, redkey]\n```\n\nFinally, you need a function to check whether a key's\n\
    required for the current **room** and to use it if so:\n\n```\ndef checkkeys():\n\
    \    currentroom = player.currentroom\n    if currentroom.key != None and currentroom.key\
    \ in player.\n    keyring:\n        print(currentroom.key.keyusedesc)\n```\n\n\
    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_93_0.png)\n\n> > Famous text adventure\
    \ games, such as Zork, have locked doors, making you\n> > either find the right\
    \ key or another way in.\n\n```\ncurrentroom.description = currentroom.key.keyroomdesc\n\
    currentroom.exits = currentroom.key.keyexits\ncurrentroom.key = None\n\ncheckkeys()\n\
    ```\n\nIf the **player** has a key for a **room**, they'll see a message\nsaying\
    \ they've used the key. The **room** **description** and **exits**\nare also updated\
    \ accordingly.\nYou can find a full example of this script at [https://tinyurl.\n\
    com/byxpthontestmove4/]."
