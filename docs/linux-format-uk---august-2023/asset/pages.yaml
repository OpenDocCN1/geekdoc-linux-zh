  md: '# Ubuntu spins ROUNDUP


    # # The applications


    A distro gets a lot of its personality

    from the default selection of apps.


    Alongsides the choice of desktop environment, the default application selection
    is the biggest distinguishing feature when comparing a set of Ubuntu flavours.
    Indeed, we hope for a good match between the applications and the desktop environment.


    As Kubuntu is based upon KDE, it''s no surprise that many of the tools are connected
    with that environment. However, where sensible, generic apps have been favoured.
    The inclusion of web browser Firefox and office suite LibreOffice are examples
    of this. We''re always happy to see KDE''s file manager, Dolphin, as it''s one
    of the best. KDE apps such as text editor Kate, music collection manager Elise
    and media player Haruna round out the selection, so for most users, Kubuntu won''t
    need much adding to it to cover basics. The use of bigger apps that aren''t part
    of KDE isn''t too jarring and fits quite well alongside the KDE apps.


    Ubuntu Studio is based on KDE as well, and comes with a full complement of standard
    applications such as Firefox. Part of the concept behind the distro is that it
    also comes with a complete set of installed and configured media applications,
    and the installed selection is huge.


    Apart from the music applications such as Ardour, there is a full set of installed
    plugins that cover every area of music and audio production. There are also applications
    that cover other areas of media production, such as graphics editing, drawing
    and 3D graphics. Some duplication of features is unavoidable with such a comprehensive
    selection. For example, some people might not need GIMP if they have Krita well
    installed. Furthermore,


    not every musician needs a 3D graphics application like Blender. In many cases,
    configuring media applications can be a hassle, so the fact that it''s already
    done is worth quite a lot, particularly for beginners.


    Another specialist distribution, Edubuntu takes a similar approach with a full
    complement of both standard and specialised applications. It''s absolutely packed
    with small tools that cover areas such as science, geography and mathematics,
    alongside larger applications such as diagram creator Dia that would be useful
    in a classroom.


    Lubuntu covers the basics with LibreOffice and Firefox. Ubuntu MATE takes a similar
    tack with a selection of standard applications that cover typical office and home
    use.


    # VERDICT


    | | Rating |

    | :--- | :--- |

    | UBUNTU STUDIO | 9/10 |

    | UBUNTU MATE | 7/10 |

    | KUBUNTU | 8/10 |

    | LUBUNTU | 7/10 |

    | EDUBUNTU | 9/10 |


    All of the distros can cover basic use, but Edubuntu and Ubuntu Studio offer masses
    of specialised applications on top of that.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_26_0.png)


    # # Configuration tools


    Hopefully, the settings cover all

    of the main areas of the system

    and its appearance.


    Ubuntu Studio and Kubuntu are both KDE-based distros, and KDE now groups all of
    the configuration into a single application, which is searchable. Having a central
    location for the settings doesn''t come with any real disadvantages. The configuration
    tools cover all the common areas of the interface along with system settings in
    areas such as network setup. The various settings show up in the launcher''s search
    results as well. LXQt-based Lubuntu groups the settings together in the LXQt Settings
    app, but there are settings appts that exist outside of this, meaning that the
    entire collection isn''t searchable. One way or another, it should be possible
    to alter any system or appearance settings that you need to, even if the tools
    are neither fully integrated nor consistent in appearance like the KDE ones.


    The settings for Edubuntu can be accessed in two ways. Firstly, Gnome''s Settings
    app gathers all settings in one place, and it''s searchable. All the settings
    pages are also present in Gnome''s search-based launcher. So, if you searched
    for ''resolution'' in the launcher, it would list Display Settings and launching
    that from the list would launch the Settings app open on the correct tab.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_26_1.png)


    The Gnome settings offer uniformity but the KDE settings have more colour and
    variety. Other than that, Gnome and KDE are fairly even in this area.


    MATE''s Control Center groups all of the settings applets together. It is searchable,
    but the search is limited to the applets and not the settings themselves, and
    the applets aren''t integrated into Control Center.


    # VERDICT


    | | Rating |

    | :--- | :--- |

    | UBUNTU STUDIO | 9/10 |

    | UBUNTU MATE | 7/10 |

    | KUBUNTU | 9/10 |

    | LUBUNTU | 6/10 |

    | EDUBUNTU | 9/10 |


    Gnome and KDE are fairly even in this area, but LXQt and MATE would benefit from
    greater integration and more comprehensive search.'
  merge: -1
  img_proc: true
