  md: '# **LETTER OF THE MONTH**


    **An irrigating problem**


    I have been working on software to reduce the water usage of irrigation systems.
    My goal was to calculate the water consumption based on the plants that need to
    be irrigated. I also wanted to include rain data and the temperature effect on
    plant growth.


    A number of universities have been studying and publishing how temperature effects
    plant growth for a variety of plant sorts and I included this data in the latest
    calculations.


    The result is a program that runs on a Raspberry Pi that greatly reduces the water
    usage for lawns and gardens. I managed to reduce the water costs by around 60%
    compared to my old conventional irrigation computer.


    I am contacting you because it would be nice if this software gets attention now
    that it is finished. A wide use of this system would help to reduce water consumption
    and it would save the owners a lot of money. The link for the project is https://gitlab.com/ftdaling/.
    **Jantinus Daling**


    **Neil says...**


    Another fantastic reader-created project. It amazes me how talented you lot are!
    We’ll do our best to give it some publicity but hopefully the irrigation community
    (is that a thing?) will be bursting with enthusiasm and overflowing with ideas!
    Good luck with this!


    to the Linux extension, it would help me to completely transition into the Linux
    world. Do you have any recommendations for this? **HW Payne**


    **Neil says...**


    I remember PST files back in the day; There were dedicated file readers that would
    let you directly read individual emails and so on, so I imagine there’s very likely
    something that can import or convert them. In fact, *Outlook* offers export options
    for *Notes*, I believe, in *Notes: File > Open & Export > Import/Export > Export
    To A File*, and you can save them as a CSV file. *Joplin* (https://joplinapp.org),
    which we’re looking at next issue, has a plugin that supports CSV import. I haven’t
    tried it but this is the theory – if you can get them into *Evernote* or *OneNote*,
    things look more straightforward with *Joplin*. There are many other note programs,
    too: *Standard Note*, *Simple Note*, *Zim-wiki* and more.


    # **Not spam**


    Does *Ubuntu* have any email filters in the Snap Store or even possibly any repos
    on *GitHub* you might already know about or use? Not necessarily one that’s made
    specifically for *Thunderbird* only but one that I can use across the whole board
    on *Hotmail*, *Gmail* and so forth. I’m just trying to combat unwanted emails
    from reaching my inbox or spam box instead of having to manually clean up those
    emails. **Jason Long**


    **Neil says...**


    I think you’re misunderstanding how spam filters and email in general works. Online
    email providers such as *Gmail* and *Hotmail* store and process your email on
    their own servers, so if you’re using a browser to access them, what you’re asking
    for isn’t possible. You can opt to download email from those systems to your desktop
    using *Thunderbird* or other local email apps, at which point you can use *Thunderbird’s*
    spam filter or another plugin, but a system-wide filter isn’t really a thing,
    as shown.


