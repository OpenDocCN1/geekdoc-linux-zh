    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_73_2.png)


    Ardour is an open source application for recording and composing music. It can
    work with audio tracks such as recordings of instruments and it can also handle
    MIDI tracks, which are notes on a grid that trigger plugins. Speaking of plugins,
    it can handle all the major plugin formats both for instruments and effects. In
    the final stage of the process, it can output a finished audio file in a format
    such as WAV, MP3 or FLAC. It''s mainly seen as a music program, but it can also
    handle other types of audio projects, such as podcast recording and editing.


    Ardour is capable of a lot, but it''s a complex piece of software. We''re going
    to take you through a few common workflows. And as we do, we''ll shine a light
    on some of the features that were introduced in Ardour 7.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_73_3.png)


    Launching Ardour

    Every time you launch Ardour, you are presented with the Session Startup dialog.
    From here, you can select a session to load, choose from a list of recent sessions
    or create a new session. Click on New Session to create a blank session. The next
    dialog gives the project a temporary name based on the date.


    The next dialog is concerned with the audio system you want to use, and some experimentation
    might be needed here. ALSA connects you directly to the soundcard, but it means
    that you can''t use other sound applications at the same time (this includes the
    web browser). JACK is usually the better option, but it


    # » CONFIGURING ARDour


    As a collection, the Linux sound systems have a reputation for being complicated,
    but things might be set to calm down in that area thanks to the introduction of
    PipeWire, a system that aims to replace some of the others. It offers emulated
    interfaces for systems such as JACK and ALSA, and you can route audio around between
    programs and hardware inputs and outputs.


    Ardour is open source software, but there is a catch as the developers expect
    you to make either a regular or a one-off payment if you want to download a pre
    made binary. To be fair, to get the program and all the point updates until the
    next major release, you can pay what you like.


    To get Ardour for free, you can build it from the source code, and that''s our
    preferred option as distribution builds tend to be out of date. It uses the WAF
    build system and the website provides build instructions


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_73_4.png)


    (https://ardour.org/development.html). We regard it as a medium difficulty build,
    and you''re probably going to have to spend some time hunting around your distro''s
    package repository for the needed dependencies.


    > QUICK TIP

    > If you notice that the audio output of Ardour is delayed, adjust the buffer
    size (Window > Audio/MIDI Setup) - 128 works well on most systems, but experiment.'
