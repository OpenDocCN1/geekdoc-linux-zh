  md: '# # CPUs


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_79_0.png)


    1972. In fact, machine code programs written for that chip can still be assembled
    and run on the latest processor from Intel or AMD.


    Naturally, though, the hardware has evolved considerably since then. After the
    8008 came the 8088, and then the 16-bit 8086, which powered the original IBM PC.
    In the ''80s, this was followed by the 80186, 80286 and so forth – hence the "x86"
    moniker. Through the generations, new features have been introduced to support
    multitasking and virtual memory; support has also been added for 32-bit and 64-bit
    operations, enabling computers to work efficiently with huge data sets and massive
    amounts of RAM. A series of extensions accelerated specific tasks such as graphics
    processing, virtualisation and data encryption. Apple''s processors are based
    on the competing ARM architecture. This originated at Acorn Computers in the mid-''80s,
    at a time when the company was looking to create a successor to the hugely popular
    BBC Micro. Rather than buying chips from an external supplier, as it had with
    its previous home computers, the company set out to design a new processor that
    would outperform existing rivals. And it succeeded – at its launch, the ARM-based
    Acorn Archimedes was the most powerful home computer money could buy.


    Today, the ARM platform is owned and developed by Arm Limited in Cambridge, and,
    like x86, it''s continued to grow since its inception. Successive versions of
    the platform have added 64-bit support and numerous extensions to speed up common
    mathematical operations – including, in the latest ARMv9 release, security and
    AI features.


    # ## LOW-RISC STRATEGY

    "The RISC philosophy aims to make a CPU as simple as possible, by reducing it
    to a bare minimum of basic functions."


    # ## RISC vs CISC: The eternal rivalry

    While ARM processors can do anything x86 can, they have different strengths and
    weaknesses, as they follow a different design philosophy, known as RISC. The name
    originally stood for Acorn RISC Machines,


    then later changed to Advanced RISC Machines as the market expanded beyond its
    original creator.


    RISC itself stands for ''reduced instruction set computer'', and is an idea that
    became popular in the ''80s and ''90s. This was a period when Intel and other
    chip makers were building more and more features and functions into the silicon,
    enabling programmers to execute complex operations with just a few lines of code.
    These processors came to be called CISC chips, for ''complex instruction set computer''.


    The RISC philosophy takes the opposite approach, aiming to make a CPU as simple
    as possible, by reducing it to a bare minimum of basic functions. Thus the ARM
    architecture uses just 34 instructions, which mostly handle simple mathematical
    operations and move data between registers and memory locations. By contrast,
    the Intel 8086 supported 81 instructions, permitting far more advanced data operations
    – and with subsequent revisions and extensions, it''s ballooned to more than 200
    instructions.


    The RISC approach may seem counterintuitive. The smaller instruction set means
    that programs need to be longer and more complex to achieve the same results.
    However, a RISC chip can have a much simpler physical design than a CISC one.
    This can make it easier and cheaper to manufacture, and it can tear through instructions
    at a faster rate – in most cases, every operation is completed in a single clock
    cycle. It can consume less power, too, which is why ARM processors are dominant
    in mobile phones and tablets, where battery life is paramount.


    While the CISC and RISC approaches are somewhat opposed, the differences aren''t
    as important as might be imagined. Few programs are written in pure assembly language
    these days, so developers don''t need to worry about the underlying architecture:
    they can write in Python, C# or whatever language they choose and let the interpreter
    or compiler deal with the translation. In fact, Apple''s ARM-based Macs include
    a real-time translation layer that lets them run programs written for x86 systems
    with no modifications.


    The differences in power consumption are also smaller than they used to be. For
    many years, Intel struggled to match the low power consumption of ARM chips, not
    only because of the complexity of its processor designs, but also because its
    in-house manufacturing facilities were unable to reduce the size of the transistors
    inside its chips as fast as its rivals. That''s been a point of some embarrassment
    – the very latest Intel chips are still using a 10nm


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_79_1.png)'
