    # Loop the loop


    Generally, you want a drum loop to play over and over, and you do this by making
    multiple copies of the loop that are spread around the song. To do this, click
    on the drum loop within the arrange window (use Grab Mode in the toolbar). Press
    Alt+D to open the Multi-Duplicate dialog. Change the number to 15 and press OK.
    This means we have a total of 16 copies of this drum loop. Another way you could
    have done this is to click once on the drum loop and keep pressing Ctrl+D (rather
    than Alt+D) to create more duplicates until you have enough. Use Ctrl+click to
