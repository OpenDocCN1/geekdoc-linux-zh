- pgno: 51
  md: "# IN DEPTH BlendOS\n\n# ARCH USER REPOSITORY\n\nOne of the many things that\
    \ Arch is praised for is the Arch User Repository, commonly known as the AUR.\
    \ This is a repository of software that is maintained by a large number of community\
    \ members and has support for some of the most bleeding-edge software available.\
    \ The AUR would be an excellent thing to enable within an Arch container, and\
    \ running the following commands:\n\n`$ sudo pacman -S --needed base-devel git`\n\
    `$ git clone https://aur.archlinux.org/yay.git`\n`$ cd yay`\n`$ makepkg -si`\n\
    \nApplications can be searched for using the following command – in this example,\
    \ Google Chrome is searched for and installed:\n\n`$ yay -Ss google-chrome`\n\n\
    Once the name of the package has been determined from the search, it can be installed\
    \ as follows:\n\n`$ yay -S google-chrome`\n\nPackages can be uninstalled using\
    \ `yay -Rns google-chrome`. \n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_51_0.png)\n\
    \ninstalled from some of the most popular distros – Ubuntu and Fedora. This has\
    \ been discussed in previous articles covering Fedora Silverblue, OpenSUSE’s MicroOS\
    \ and Vanilla OS. When apps are installed within a container, they are tightly\
    \ integrated with the host OS. In the case of BlendOS, this means the app can\
    \ be opened from the launcher and the command line. If Audacity is installed in\
    \ a container, it can be run by entering audacity at the host OS’s command line.\
    \ During the writing of this article, the container prioritisation feature was\
    \ changed. Originally, containers could be assigned priorities, so that if the\
    \ same app is installed in multiple containers, the one with the highest priority\
    \ is invoked by default. After updates, this prioritisation feature was changed\
    \ to allow for apps to be mapped to a particular container. For example, Audacity\
    \ could be assigned to the Ubuntu container and Fritzing could be assigned to\
    \ the Fedora container. When a containerised app has been opened, it automatically\
    \ has access to the host’s filesystem, so it can be used as thought it were installed\
    \ directly. See the walkthrough (page 53) to discover how to install containers.\
    \ Apps can be installed to them by navigating to the BlendOS Settings tool, selecting\
    \ the Containers tab and pressing the play button next to the container name.\
    \ This opens a terminal on the selected distro. The APT tool can be used in an\
    \ Ubuntu container with apt search NAME to search for packages and apt install\
    \ NAME to install them. Within Fedora, instead of apt use dnf. Finally, within\
    \ an Arch container, pacman can be used. See the boxout (left) to learn how to\
    \ use the Arch User Repository (AUR).\n\nAt the time of writing, installing a\
    \ dual or multi-boot environment was possible, but not easy. When selecting the\
    \ partitions to create, format and write to, the data was copied over successfully,\
    \ but the GRUB bootloader was not installed. Performing these missing steps is\
    \ outside of the scope of this tutorial. The steps section suggests using the\
    \ entire hard drive and installing on a sparse device or a virtual machine. Waydroid\
    \ support is only possible on a physical device.\n\nBlendOS is a relatively new\
    \ endavour, started by a teenerager, Brendon Chung. Given the early state of the\
    \ project, the tools and level of integration between containers, filesystem layers\
    \ and all of the other items discussed is incredibly impressive. Chung also maintains\
    \ Ubuntu Unity Remix, which re-integrates the Unity 7 codebase, and is heavily\
    \ involved in Unity 7 development and Unity on Arch. He works on several other\
    \ projects, too.\n\nWe hope you enjoy using blendOS and learning more about all\
    \ the technologies involved.\n\n# INTERVIEW WITH BREDNOR CHUNG\n\npackage name\
    \ is different from the binary or app name), any apps or binaries installed in\
    \ a container instantly appear on the host in BlendOS. This makes it a true blend\
    \ of distributions. Again, BlendOS gives you the flexibility to use any apps or\
    \ binaries from any container, in spite of a clash.\n\n7 was discontinued, I wanted\
    \ to bring it back. I created Ubuntu Unity to give Unity 7 a new life.\n\n+  \
    \ - **Q** Can you share a few words about some of your other projects?\n+   -\
    \ **A** Sure. You already know about Ubuntu Unity, which is an official Ubuntu\
    \ flavour. That was one of my first popular projects that I created about three\
    \ years ago. We had a new release recently (23.04) and next up is the Lomiri edition\
    \ of Ubuntu Unity. I released Unity 7.7 and Unity X at the beginning of this year.\
    \ I had also ported\n\n+   - **Q** You're involved in Ubuntu Unity. What made\
    \ you decide to create a distribution using Unity as the desktop environment?\n\
    +   - **A** I had Ubuntu Unity 17.04 back in 2017 and really loved Unity 7. So,\
    \ when Unity\n\nUnity 7.6 to Arch late last year and will be porting Unity 7.7\
