    Do you have a burning Linux-related issue that you want to discuss? Write to us
    at Linux Format, Future Publishing, Quay House, The Ambury, Bath, BA1 1UA or email
    letters@linuxformat.com.


    # Suggestion box


    You should have a column for what Linux users would like to see added to Linux
    distros and programs. It could feature a user’s wish (with some details) and expert
    comment or analysis of the wish (why it can or can’t be). You can perhaps give
    out prizes for the selected submissions of maybe a subscription or some trinkets,
    such as a *Linux Format* mug, pens and so on.


    T Smith


    Neil says...


    I’d quite like a *Linux Format* mug... It’s not a bad idea, but I’m not sure the
    amount of correspondence we get would justify it. If you’ve got suggestions, we’d
    be more than happy to print them in *Mailserver* – after all, these pages are
    for readers’ opinions.


    # Off the map


    I’ve looked back through the archives that mention Blender and can find no tutorial
    that addresses the use of Blender in creating 3D images from freely available
    global maps (such as Google Earth and Google Maps) and freely available digital
    terrain model data sets that provide elevation data.


    I just wondered whether Michael Reed might like to do a tutorial on this aspect
    of *Blender* – useful for walkers and local environmental concerns (such as flooding
    investigation), but also the basis for many artistic possibilities.


    Colin


    Neil says...


    Thanks for the suggestion. Blender feels a little heavyweight for this type of
    activity, but as long as you could transform the mapping data into something Blender
    could understand, there’s no reason why it wouldn’t work. I imagine there are
    dedicated viewing tools for this, but they likely wouldn’t offer Blender’s rendering
    capabilities. Michael is going to review 2D/3D CAD packages, which again might
    be an option, too. We did find a Google Maps importer project at https://github.com/ellemichel/MapsModelImporter.


    # Map it


    I want to create some maps with personal information overlaid, such as routes,
    memories and so on, and I want the overlays to be stored locally and accessible
    only on my local network. I use OpenSuSE and KDE. What data sources and tools
    would you recommend?


    Chris Tucker


    Neil says...


    The KDE mapping tool is called Marble Maps. This taps into OpenStreetMaps, among
    many other open source tools, such as DigitKam. That’s going to be your best bet,
    as it provides complete options to create custom maps, even of other planets or
    moons, for your own use. Take a look at the documentation and see if it’s any
    use: https://techbase.kde.org/Marble/CustomMaps/. There could be something more
    straightforward than this, though. Can anyone help?


