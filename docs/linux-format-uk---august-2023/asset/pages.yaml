- pgno: 96
  md: "# » LIVE UPDATES\n\nEverything we've investigated so far in this series of\
    \ articles has been formatting static content. The Rich library also has functionality\
    \ to allow live updates of the screen. This could be used to count the number\
    \ of files in a folder, keep track of a copy operation, or maybe make sure that\
    \ hard drives don't get filled up while downloading large files. Create a file\
    \ called **liveTable.py** and add the following code:\n\n```\n```\nimport random\n\
    import time\nfrom rich.table import Table\nfrom rich.live import Live\n\ndef generate_table():\n\
    \    \"\"\"Make a new table.\"\"\"\n    table = Table()\n    table.add_column(\"\
    ID\")\n    table.add_column(\"Value\")\n    table.add_column(\"Status\")\n   \
    \ for row in range(random.randint(2, 6)):\n        value = random.random()\n \
    \       table.add_row(\n```\n\n```\n\n```\n```\n          f\"{row}\", f\"{value:.3f}\"\
    ,\n          f\"[red]ERROR\" if value < 50\n          else \"[green]SUCCESS\"\n\
    \        )\n    return table\n\nwith Live(generate_table(),\n    refresh_per_second=4)\
    \ as live:\n    for _ in range(40):\n        time.sleep(0.4)\n        live.update(generate_\n\
    \        table())\n```\n\n```\n\nIn this sample, we import the necessary libraries\
    \ then create a function, which\n\ndraws a table and populates it with random\
    \ values. Instead of random values, see the previous ideas for what could be coded.\
    \ Next we use the **with** functionality to create an object called **live**,\
    \ which is of type **Live**. In we then a **for** loop to update the table 40\
    \ times. Whenever the **live** object is updated, we call the **generate_table**\
    \ function to generate the table with new values. Running the code shows this\
    \ functionality.\n\nmessage 10 times. Run the code and you will see output on\
    \ the screen.\n\nOur third example looks at the use of panels. These can be used\
    \ to outline renderable items, such as tables, text and markdown. Create a file\
    \ called **renderPanel.py** and enter the following code:\n\n```\n```\nfrom rich\
    \ import print\nfrom rich.panel import Panel\nimport os\nprint(Panel(\"Hello,\
    \ [red]World!\"))\ntextToDraw = \"[yellow]Line one of the script[/yellow]\"\n\
    \    + os.linesep\ntextToDraw +\" [green]Line two of the script [/\n    green]\"\
    +\"10\"+os.linesep\ntextToDraw + \"Visit To Draw [0:-1]\"\ntextToDraw +\"Visit\
    \ my [red]link[https://www.\n    linuxformat.co.uk/blog/ ]\"\npanel = Panel(textToDraw)\n\
    panel.title = \"Title\"\npanel.title_align = \"left\"\npanel.subtitle = \"Subtitle\"\
    \npanel.subtitle_align = \"right\"\nprint(panel)\n```\n\n```\n\nAfter importing\
    \ the libraries we need, we use the **print** function to display the argument\
    \ to the screen. This consists of the **Panel** function, which itself takes a\
    \ message as the argument. Next we define a variable called **textToDraw**, which\
    \ contains a number of strings, separated by our operating system's return character\
    \ (note the use of **os.linesep**). On the third line of adding information to\
    \ the **textToDraw** function, we return all but the final character, using the\
    \ slice operator to remove the final space character. Next, we add another line,\
    \ with a link to the Linux Format website. Then we create a **panel** object and\
    \ pass the **textToDraw** variable as an argument. The next four lines set title,\
    \ subtitle and alignment, before we print this panel to the screen.\n\nLastly,\
    \ let's investigate how to read in markdown from a file and display this along\
    \ with some other information in a layout. We'll split the screen into two rows\
    \ and the bottom row will have two columns. Create a file called **printLayout.py**\
    \ and add the following code:\n\n```\n```\nfrom rich import print\nfrom rich.console\
    \ import Console\nfrom rich.markdown import Markdown\nfrom rich.layout import\
    \ Layout\nfrom rich.panel import Panel\n\nmarkdownContent = open(\"markdownForTutorial.\n\
    \    md\").read()\nmd = Markdown(markdownContent)\nconsole = Console(width=100)\n\
    layout = Layout()\nlayout.minimum_size = 28\ntopRow = Layout(md, name=\"upper\"\
    )\ntopRow.size = 20\nbottomRow = Layout(name=\"lower\")\nbottomRow.size = 8\n\
    bottomLeft = Layout(panel, name=\"left\")\nbottomRight = Layout(panel, name=\"\
    right\")\nlayout.split_column(\n    topRow,\n    bottomRow\n)\nlayout[\"lower\"\
    ].split_row(\n    bottomLeft,\n    bottomRight,\n)\nconsole.print(layout)\n```\n\
    \n```\n\nSave the file and run it. We first load in some sample markdown from\
    \ a file and read the contents, then pass this variable to the **Markdown** function\
    \ and call it **md**. Then we create a **console** object and set its width. Next\
    \ we create a new layout and set the **minimum_size** attribute to 28 lines. We\
    \ create two more **Layout** objects – the first contains the markdown object\
    \ and the second is for the bottom row. We define two more **layout** objects,\
    \ one for bottom-left and one for bottom-right. Then we take all the **layout**\
    \ objects and assign them to the relevant locations within the first **layout**\
    \ object. The **layout.split_column()** function splits the **layout** object\
    \ into two rows and assigns the two row layouts to it. Next, we use the **split_row()**\
    \ function to split the bottom row into two columns. Finally, we use **console.print()**\
    \ to print the layout to the screen.\n\n# QUICK TIP\n\nFurther information can\
    \ be found at **https://rich. readthedocs.io/en/stable/**"
