  md: '# ROUNDUP Ubuntu spins


    # Suitability for switchers


    How suitable is this distro for those used to a different OS?


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_29_0.png)


    Ubuntu Studio has some unique advantages in this area thanks to its vast selection
    of installed and configured media applications and plugins. The task switcher
    at the top of the screen should be fairly easy for Windows users to figure out
    on first use, and the launcher is fairly standard.


    We could say some of the same things about Edubuntu. A newcomer to Linux would
    be amazed with what it offers out of the box, particularly if they are interested
    in classroom use or a computer setup for a child. However, beyond launching the
    favourite apps located on the sidebar dock, searching for apps and navigating
    categories would need some explanation.


    The standard KDE employed by Kubuntu offers a fairly high-tech Linux desktop,
    but in actual fact, the layout elements are similar to that favoured by Windows
    operating systems. No doubt a switcher would pleasantly surprised by the responsiveness
    and clean looks of the Plasma window manager.


    Of the Ubuntu flavours that we’re looking at, Lubuntu offers a layout that is
    closest to the traditional Windows experience because the main panel runs along
    the bottom of the screen.


    Ubuntu Studio has a traditional setup for launching and switching between applications,
    but it’s one of the distros that puts the main panel at the top, hardly a huge
    learning adjustment for a switcher. Much the same can be said for installing MATE
    as it sticks to the traditional mechanism for application launching and switching
    but puts the main bar at the top.


    | VERDICT | RATING |

    | --- | --- |

    | UBUNTU STUDIO | 8/10 |

    | KUBUNTU | 8/10 |

    | EDUBUNTU | 6/10 |

    | UBUNTU MATE | 7/10 |

    | LUBUNTU | 8/10 |


    > Lubuntu happens to copy the traditional Windows layout, an advantage for Windows
    users. The others are fairly easy to learn.


    # Extra features and customisations


    What does this distribution have that the others don’t?


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_29_1.png)


    Ubuntu Studio and Edubuntu are the stars of this section as they offer lots of
    features on top of a standard distro.


    To get the best out of using Linux for media creation (music apps in particular)
    often requires manual configuration, but Ubuntu Studio has these customisations
    in place right from the start. For example, Ubuntu Studio uses the low-latency
    kernel rather than the standard kernel, and various tweaks have been applied to
    make sure that the default user is in the Music group and that music apps can
    lock the memory they need, and there are extra features concerning the swap file
    setup.


    Ubuntu Studio Installer can be run at any time. From here, you can change individual
    settings such as selecting the standard, generic kernel rather than the low-latency
    version. It can even be run from within other Ubuntu family distros to add the
    same customisations and apps selections that Ubuntu Studio enjoys. Edubuntu has
    a similar utility in the form of the Edubuntu Installer application. Here, the
    options allow selection between different package groups and a choice between
    different age group settings. Like the Ubuntu Studio Installer, this one can be
    installed and run within another Ubuntu flavour. We hit upon a snag when working
    with the latest Edubuntu as the project has recently been restarted, and this
    meant that we’ve struggled to find completely up-to-date documentation for it.
    It could have some features that we’ve not discovered on our own and there’s little
    information on the website at this stage.


    We like Ubuntu MATE’s helpful welcome window. It presents links to helpful websites
    and sources of information. It also has some quick links to common tasks, such
    as installing software. Lubuntu is a fairly minimalist distro and doesn’t come
    with much in the way of extras, but that’s the direction the developers have decided
    to take. Kubuntu covers the basics, but a bit more comprehensively, and it’s a
    featureful desktop environment.


    | VERDICT | RATING |

    | --- | --- |

    | UBUNTU STUDIO | 9/10 |

    | KUBUNTU | 7/10 |

    | EDUBUNTU | 8/10 |

    | UBUNTU MATE | 5/10 |

    | LUBUNTU | 4/10 |


    > Ubuntu Studio contains extra software and many useful system tweaks that can
    optionally be removed. Lubuntu is basic desktop Linux.'
