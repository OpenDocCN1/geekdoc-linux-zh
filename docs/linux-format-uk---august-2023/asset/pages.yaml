  md: '# FIRMWARE


    # AMD to embrace open system firmware?


    Tech firm has revealed the release of OpenSIL.


    AMD has announced plans to release OpenSIL (Open-source Silicon Initialization
    Library), complete with AMD Coreboot support. In theory, this will free users
    and manufacturers from the shackles of proprietary UEFI/BIOS firmware, allowing
    better detection of bugs and better compatibility. Open source enthusiasts also
    may appreciate the assurance that truly free firmware reduces the attack surface
    for bad actors to conceal hardware backdoors to allow spying.


    If this sounds familiar, it’s because in 2011, AMD promised to support the open
    source Linux-based BIOS implementation Coreboot on all future processors. However,
    support wasn’t universal across all AMD CPUs and mobos.


    In 2014 AMD also released AMDgpu, an open source Linux driver for its Radeon lineup
    of graphics cards. In the same blog post, AMD chief firmware architect Raj Koppur
    elucidated: “AMD OpenSIL is a set of three statically linked libraries – xSIM
    (x86 Silicon Initialization Libraries), xPRF (x86 Platform Reference Library)
    and xUSL (x86 Utilities and


    Services Library) that can be statically linked to any host firmware during compile/link
    time.”


    The host firmware in question apparently can include open source solutions such
    as Coreboot, Oreboot, FortiBIOS and Project Mu. Currently, OpenSIL is only available
    as proof of concept. The OpenSIL Firmware Architecture Specification has yet to
    be published in full.


    Response from the coding community has generally been positive, including comparisons
    with the 2022 implementation of AMD’s own adoption of its Genoa processors for
    use with reference servers in conjunction with OpenBMC, an open source distro
    whose goal is to produce the implementation of baseboard management controllers
    without proprietary code.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_6_0.png)


    OpenSIL was announced at the Open Compute Project Summit 2023. Time will tell
    if it means full Coreboot compatibility.


    # DESKTOP ENVIRONMENT


    # Gnome Kuala Lumpur updated


    Gnome 44.2 fixes bugs and adds new features.


    second update (44.2) has been released for the Gnome 44 Kuala Lumpur desktop environment
    series.


    The Gnome Project has encouraged anyone running Gnome 44 to upgrade.


    The latest version includes checking for updates after login if the first check
    fails for any reason. It also reduces background resources used by Gnome whilst
    idle.


    The Nautilus file manager has also been updated and includes fixes for a number
    of bugs, including better support for displaying expandable folders. The latest
    update also includes Gnome Maps 44.2. This includes tweaks such as showing the
    correct rotation of the user location marker when there is a


    heading, as well as displaying thumbnails for places with a Wikidata entry with
    a title image.


    The Touchpad row can also now be hidden in cases where the Touchpad can’t be disabled,
    and a minor bug with racy radio buttons in the Network connection editor has been
    fixed.


    The Epiphany web browser has been upgraded to version 44.3 and addresses several
    bugs, while the latest version of Gnome Boxes (44.2) now enables users to preserve
    run-in- background and 3D acceleration configurations for clones of any virtual
    machines they create. It also fixes an issue where shared folders created for
    VMs sometimes didn’t appear.


    View the release notes at: https://discourse.gnome.org/gnome-44-2-released/15563


    # OPINION


    # JOIN THE GANG!


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_6_1.png)


    Mike Saunders wrote for LXFT (and many more issues) and now works for The Document
    Foundation.


    > > Large, well-established open source projects can be daunting for potential
    new contributors. What’s the best way to get involved? Why are there so many different
    channels of communication? And who should we contact, if you need help?


    This is a challenge we face in the LibreOffice community. The codebase is seven
    million lines of predominantly C++, with a bunch of dependencies. But we’ve been
    grafting to simplify the build process, and have taken on development mentors
    to help new coders dip their toes in the pond (or ocean).


    There are many other ways to get involved, including UI design, marketing, quality
    assurance, documentation, translations and infrastructure – and in May, we organised
    a campaign to convert users into contributors. The Month of LibreOffice rewarded
    everyone who helped out with a sticker pack!


    During the month, 338 people joined in, reflecting a healthy LibreOffice community.
    (And that is just volunteers, for the most part – there are many others on the
    commercial side.)


    See https://tinyurl.com/ mol-may2023 for the results and stay tuned for the next
    Month of LibreOffice, in November!'
