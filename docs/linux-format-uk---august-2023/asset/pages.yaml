    \ swap\nunallocated 500G\n\nJason Palmer\n\nThis is a simple task, but it is complicated\
    \ by your swap partition that is now in the middle of the drive. Removing the\
    \ swap area before resizing the root partition, then re-creating it after is the\
    \ simplest solution. Providing you do not do anything memory-intensive while resizing,\
    \ this should not be a problem. If you are concerned about this, you could create\
    \ a swap file for the duration of the process. Alternatively, you could do everything\
    \ from a live distro; enlarging filesystems is generally safe to do on a live\
    \ system. Bear in mind that any procedure involving filesystems carries a small\
    \ risk of corruption, but everything important should already be backed up. All\
    \ of these actions should be performed as root or prefixed with sudo. First get\
    \ rid of swap:\n\n```\n`$ swapoff -d\n$ swapoff /dev/mapper/CRYPTSWAP\n$ cryptsetup\
    \ close CRYPTSWAP`\n```\n\nCRYPTSWAP is the name of the encrypted swap container,\
    \ which should be returned by the first command. Now use your preferred partitioning\
    \ tool to delete the swap partition and create a new one at the end of the disk.\
    \ Then delete and recreate the root partition. Don't worry that you are currently\
    \ using this partition, tools like gdisk and parted do not write the updated partition\
    \ table to the disk until you tell them to. Now you have a new partition starting\
    \ in exactly the same place as the original, just bigger.\n\nThe next step is\
    \ to resize the encrypted container to fill the new partition, then resize the\
    \ filesystem to fill the container. Both commands are given with no size as they\
    \ default to using all available space:\n\n```\n`$ cryptsetup resize CRYPTROOT\n\
    $ resize2fs /dev/mapper/CRYPTROOT`\n```\n\nReplace CRYPTROOT with the name of\
    \ your encrypted root container. If you are using a filesystem other than ext4,\
    \ consult its documentation for the command to resize it. The df command should\
    \ confirm that your root filesystem is now the size you expect. Lastly, create\
    \ a new container for swap and initialise it:\n\n```\n`$ cryptsetup luksFormat\
    \ /dev/nvme0nlp3\n$ cryptsetup luksOpen /dev/nvme0nlp3 CRYPTROOT\n$ mkswap /dev/mapper/CRYPTROOT\n\
    $ swapon /dev/mapper/CRYPTROOT`\n```\n\nFinish off by updating the entry in /etc/fstab\
    \ to match the name you just gave it, unless you reused the old name.\n\n# A QUICK\
    \ REFERENCE TO... TREE\n\nGraphical file managers let you view the contents of\
    \ a directory or one of its subdirectories, as do the ls and dir commands in the\
    \ shell. Most graphical managers also let you view directories in a tree format,\
    \ where you can see both subdirectories and their contents in a single view. There\
    \ is an often-overlooked shell command that does much the same and it goes by\
    \ the unsurprising name of tree. Run with no arguments, tree prints a listing\
    \ of the files and directories in the current directory and those below it. As\
    \ with ls, you can pass the name of a directory to list and there are several\
    \ options that alter the output. Some of the most useful are in the table.\n\n\
    There are plenty more options, including the ability to output in XML, HTML or\
    \ JSON, control the colourisation of output and much more. The man page details\
    \ them all. It's not a replacement for ls, but tree is a more of a complement\
    \ to it, each of the commands performing useful but different functions.\n\n|\
    \ Option | Function |\n| :----- | :------- |\n| a | Shows hidden dotfiles |\n\
    | L N | Only goes N directories deep - useful for something like a home directory\
    \ with lots of nested subdirectories |\n| D | Shows the last modification time\
    \ of each file |\n| P | Shows each file's type and permissions |\n| h | Shows\
    \ the size of each file in human-readable format |\n| prune | Hides empty directories\
    \ |\n| P \\*pattern\\* | Shows only files that match the given wildcard pattern\
    \ |\n| f | Prints the full path for each file |\n\n> **Movable disks**\n> \n>\
    \ I have several Linux distros on my machine. Often when I hook up an extra hard\
    \ drive or something, the drive order changes, and some Systemd service can't\
    \ find a filesystem, because it was sdcis1 and now it's something else. Then I\
