- pgno: 52
  md: '# ## INSTALL AND CONFIGURE BLENDS


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_0.png)


    # **1** Create a virtual machine


    Navigate to the BlendOS website and download the ISO file. Open your virtualisation
    system of choice and create a new virtual machine. For testing, 2GB RAM, two vCPUs
    and 25GB of disk space will suffice. Attach the ISO file and switch on the virtual
    machine that you have created.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_1.png)


    # **3** Create a container


    Open the BlendOS Settings app, enter a name, select the container type and click
    Create Container. Associations can be made between a binary and a container. This
    means that it is easy to run a command in a certain container, even if the same
    application is installed in multiple ones.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_2.png)


    # **5** Add some apps


    Discover is KDE’s software store. Open this from the launcher and search for the
    application you wish to install. Notice in the top-right corner that some apps
    have two sources. Flatpaks are sandboxed and BlendOS installs to an overlay, which
    is merged to the immutable root at next boot.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_3.png)


    # **2** Set keyboard and language


    Once the VM has loaded, follow through the steps on the installer to select the
    relevant keyboard layout, language, define a new user and select the drive to
    install to. Make sure you use the entire disk. To select the language, search
    for it, find the relevant one and select Main, then select the language itself.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_4.png)


    # **4** Install app stores


    From the BlendOS Settings app, select the Android Apps tab and click Initialize.
    Once installed, install either or both app stores, which can then be used to install
    apps. Once apps have been installed, they can be opened from the launcher. Apps
    open as their own window, alongside native apps.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_52_5.png)


    # **6** Save state and rollback


    The System tab in the BlendOS Settings application shows controls for saving the
    state of the system, which can be carried out after any operation and this process
    occurs every 12 hours automatically. The automated operation can be switched off
    and rollback to the previous state can be invoked.'
  merge: -1
  img_proc: true
