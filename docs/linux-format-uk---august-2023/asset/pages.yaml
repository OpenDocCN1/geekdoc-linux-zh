  md: "# CODING ACADEMY Rich library\n\n# Spice up your Python console applications\n\
    \nMatt Holder demonstrates how to use the Python Rich library to add formatting\
    \ to your console applications.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_95_0.png)\n\
    \nMatt Holder has been a fan of the open source methodology for over two decades\
    \ and uses Linux and other tools where possible. In his spare time, he enjoys\
    \ listening to music and reading.\n\n# I\n\nn part two of our series on the Rich\
    \ library, we are working through how to split our terminal application into sections,\
    \ using layouts, outlining information with panels, rendering links and markdown,\
    \ and using the helper log function to render logs with the time the message occurred.\
    \ \nEach of the code samples below can be run separately or in one file, and they\
    \ are also available from GitHub (see the Quick Tip). If you didn't catch last\
    \ month's tutorial, the library can be installed using the following command from\
    \ a terminal: pip install rich.\nWe use Visual Studio Code - it's an excellent\
    \ way to develop, debug and run code: follow the instructions at https://code.visualstudio.com/docs/setup/linux.\
    \ When creating files in VSCode, make sure that any files are saved with a .py\
    \ extension. Files can be run by pressing Ctrl+F5. If developing using another\
    \ code editor, once the files have been saved, they can be run by entering python3\
    \ FILENAME.PY in the terminal.\nFirst, let's look at the logger function. This\
    \ sample code uses a combination of the built-in Python logging functionality\
    \ and functionality from the Rich library, which colour codes the output based\
    \ on severity. Create a file called logTest.py and enter the following:\n\n```\n\
    import logging\nfrom rich.logging import RichHandler\nFORMAT = \"%(message)s\"\
    \nlogging.basicConfig(\nlevel=\"NOTSET\", format=FORMAT, datefmt=\"%X\",\nhandlers=[RichHandler()]\n\
    )\nlog = logging.getLogger(\"rich\")\nlog.debug(\"Hello, World!\")\nlog.info(\"\
    Hello, World!\")\nlog.warning(\"Hello, World!\")\nlog.error(\"Hello, World!\"\
    )\n```\n\n# QUICK TIP\n\nThe code can be downloaded from https://github.com/mattniemo/LXF303-304-Python-Rich\n\
    \nHere we first import the required libraries. On the next line we define the\
    \ format of each log message, which is to simply write the message itself. On\
    \ the next line, we configure the logging system to display the message in the\
    \ defined format, display the date with it and use the Rich logging function to\
    \ display the message. Before writing log messages, we need to create a logger\
    \ object and then we reference it when writing log messages. Save the file and\
    \ run it; you will see messages in green, blue, orange and red.\nNow let's move\
    \ on to the justify options to change where text is rendered. Create a file called\
    \ justifyText.py and enter the following code:\n\n```\nfrom rich.console import\
    \ Console\nconsole = Console(width=100)\nstyle = \"italic white on blue\"\nconsole.print(\"\
    Title of the script\", style=style, justify=\"center\")\nconsole.print(\"\")\n\
    console.print(\"Line one of output\")\nconsole.print(\"Line two of script \"*\"\
    10\")\n```\n\nIn this sample, we first import the necessary functions before defining\
    \ a console object, which is where we print everything. This ensures that the\
    \ console width should be 100 characters. Next we define a style, a preset built\
    \ into the Rich library Then we call the console.print() function. This ensures\
    \ that the console object is used to display any messages. When calling the print\
    \ function, we are writing our message, then defining the style to be used. Finally,\
    \ we call the justify argument to centre the text (notice the US spelling in the\
    \ code). On the final three lines of output, we write a blank line, then another\
    \ line, before repeating the final\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_95_1.png)\n\
    \nExamples of our code. Note how text can be coloured, as we saw last month, and\
    \ links can be clicked on with Ctrl+click.\n\n# Part Two!\nSubscribe on page 16\
    \ to access past issues!"
