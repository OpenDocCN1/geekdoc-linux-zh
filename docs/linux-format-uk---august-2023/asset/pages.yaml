  md: "and help each other out when it comes to personal missions and goals.\n\nOne\
    \ of those missions was a rescue and recovery operation. It was a long sail, made\
    \ more complicated when a sea serpent, the first we’d ever encountered, attacked\
    \ us in the middle of the night. While we shot the creature with flaming arrows,\
    \ Steven took us to shore, fearing our boat would be destroyed. Once on land,\
    \ we were mobbed by growing greydwarfs while the serpent continued attacking our\
    \ ship. We finally, frantically, dealt with both threats and set off again, only\
    \ to realise we didn’t have enough resources to build a fast-travel portal. So,\
    \ we had to make another stop to collect wood in the darkness of night while we\
    \ built a workbench to repair the damage the serpent had done to the ship. Finally,\
    \ we reached the area where the boat was lost. After another mad scramble we killed\
    \ a goblin, recovered the gear, and had a delightful and peaceful sail back home,\
    \ each in our own boats. It was a genuinely exciting adventure, with one extra\
    \ bonus: we now had serpent meat, which gave us the recipe for serpent stew, a\
    \ fantastic new health and stamina-boosting food.\n\nBosses, however, provide\
    \ some structure to the otherwise open-ended adventure. Finding them takes a ton\
    \ of exploration, because only certain runestones show their location on your\
    \ map - and a boss might wind up several continents away from your starting island.\
    \ Just reaching a boss with the resources you need to summon them is an adventure\
    \ in itself. And the boss battles are long, challenging bouts accompanied by music\
    \ and effects that really make you feel as though you’re in a dramatic showdown\
    \ with angry gods. Each boss drops an item you need to begin the long process\
    \ of preparing to take down the next one.\n\n# Tree of life\n\nThe biggest update\
    \ to Valheim dropped at the end of 2022 as the Mistlands pack, which went way\
    \ beyond adding just a new biome type. It packed an entirely new gameplay system,\
    \ an interesting new type of NPC, several unusual crafting stations and lots more.\n\
    \nThere’s always been magic running through the world of Valheim, but now you\
    \ can wield it directly. Thanks to a mystical new resource called Eitr, you can\
    \ imbue yourself with magic power and build a new workbench to create several\
    \ types of magic staff. One staff can hurl fireballs, another can deal ice blasts,\
    \ and there’s a staff that thanks you and any nearby allies in a protective force\n\
    \n![](img/5cfcf2f4448dccdd1c5c2a2851544557_24_0.png)\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_24_1.png)\n\
    \n> A village’s Buildings can be destroyed for resources and built from scratch\
    \ to create your own settlements.\n\nbubble. Along with the staffs, there’s a\
    \ craftable magic skull for summoning a loyal skeleton to fight at your side.\
    \ Just don’t assume you’re instantly gonna be the Viking version of Gandalf. This\
    \ is a magic system, not a magic button. Harvesting and refining Eitr is quite\
    \ a process, as is gathering what you need to build magic-related crafting stations.\
    \ And without Eitr flowing in your body, your fancy new staff might as well be\
    \ a twig.\n\nIn such a hostile world, it doesn’t take much for things to feel\
    \ more friendly, even if that friendliness is simple neutrality. You’ve already\
    \ met one Norse dwarf, Haldor, the vendor of Valheim. But in the Mistlands you’ll\
    \ find other dwarf clans, called Dvergr, and unlike most things in Valheim, they\
    \ don’t want to kill you.\n\nSince we first set foot in Valheim, we’ve been staring\
    \ up at the giant tree, Yggdrasil, that stretches out over the Viking land of\
    \ the dead. We’ve just never been able to reach it. As it turns out, the mighty\
    \ tree’s roots are sunk deep in the Mistlands - they’re not just there for decoration.\
    \ You can craft a new tool to extract a precious new resource from the roots of\
    \ Yggdrasil, which is key to fully unlocking that new magic system.\n\nWe knew\
    \ the new biome would have a new boss, but this boss has a hair rather than an\
    \ altar in the overworld. Sealed by Dvergr long ago, once you’ve found the lair\
    \ you need to craft a special key just to open that intimidating door. A creature\
    \ so foul it’s been locked away in a vault? Sounds like you should leave that\
    \ door closed...\n\nAnd there’s chickens! In Valheim! You can hatch ’em, grow\
    \ ’em, and farm ’em at your base. They’re not just cute, they’re also delicious.\
    \ Now all you have to do is find your first egg - somewhere. 279\n\n# VERDICT\n\
    \n+   **DEVELOPER:** Coffee Stain Publishing  \n+   **WEB:** www.valheimgame.com\
