  md: 'appears to be the only open source offering hasn''t been updated for quite
    some time. So, instead, we''re recommending the freely available *from Spring
    implementation*, when *version* is closed source.


    You can find the latest version of the compiler for Linux at **www.iron-spring.com**,
    and documentation is also provided in the *dORTIRAN*. The documentation includes
    **readme\.linux.html**, which describes how to install and run the compiler, and
    **prog\_guide.html**, which details, among other things, the differences — mainly
    in the area of input and output — between Iron Spring PL/I and the version it''s
    based on, namely IBM PL/I for MVS and VM.


    There''s no complete language reference manual yet, but you can find IBM''s original
    manual at **http://tamiapl.net/SC26-3114-01.pdf**. Iron Spring PL/I isn''t distributed
    as an executable, but compiling it from the source code provided was straightforward
    using the supplied **makefile**. A few sample PL/I programs also form part of
    the distribution, and there are a few more on the Iron Spring website, so you
    can put the compiler through its paces before starting to hack your own code.
    You''ll also find some PL/I code at Rosetta Code, but we recommend trying *Iron
    Spring''s* samples as a *very first* step. You''ll find them in a folder called
    **Samples**, and if you issue the command **make -f Makefile.Linux** from that
    folder, all the samples will be compiled and linked, after which you can execute
    them from the command-line prompt.


    If you want to try editing one of them as a coding exercise, edit the source code,
    delete the other files with the same name but different extensions, most commonly
    **.lst** and **.obj**, and one with no extension, which is the executable, although
    this depends on the compiler options. Then re-issue the **make** command, which
    will now compile just your edited code. And when you''ll progress to writing your
    own PL/I code from scratch, you''ll need to create your own *makefiles* – see
    the samples provided.


    The other practical advice we can offer concerns syntax highlighting. Since *you''re*
    not using an IDE, the only interactive tool you''ll be using for creating and
    subsequently editing your PL/I code is a text editor. You could use any of the
    many FOSS editors available, although most don''t have syntax highlighting for
    PL/I, at least not as standard. We did discover that a PL/I syntax highlighting
    add-on is available for the **Vim** editor, though, and you can find it at **www.vim.org/scripts/script.php?script\_id=4329**.
    This is highly recommended, especially as PL/I will probably be unfamiliar to
    you. You can see it in action in our screenshot (opposite), but you''ll also notice
    that there appear to be a few quirks, so be wary of trusting it explicitly. While
    we haven''t fully got up to speed with which colours are used for what, the screenshot,
    which shows our second example program being edited, seems to have a few *inconsistencies*.
    For example, one of our variable names, **FIRST**, is coloured differently from
    most of the others – it''s *white* instead of green. We assume this is a consequence
    of our inadvertently using a *keyword* as a variable name, which is legal because
    PL/I doesn''t have reserved words, even though it''s not *really* recommended.
    We can''t help but feel that had the syntax highlighting been cleverer, say by
    considering the context, these spurious examples


    would have been coloured green as variable names.


    # Replacirng FORTRAN


    Since, in one guise, PL/I was seen as a *potential replacement* for FORTRAN, we''ll
    start by looking at a simple program for arithmetic manipulation. The code, which
    appears below, displays a table of Celsius temperatures together with their Fahrenheit
    *equivalents*, for Celsius temperatures starting at 0°C, and increasing in one
    degree intervals, until we get to a Fahrenheit value of over 100°F. CTOF:


    ```

    PROCEDURE OPTIONS (MAIN);\nDCL (C) FLOAT;\nDO C = 0 to 100 UNTIL (F>100);\nF=
    C*1.8 +32;\nPUT SKIP EDIT (''C'' ,C * ,''F'') (F(4), A, F(5),1, A);\nEND;\nEND
    CTOF;

    ```


    Although we''ve introduced it as a FORTRAN-type application, we''ve *deliberately*
    chosen to use something that is decidedly *non-FORTRAN-like*, namely a **DO …
    UNTIL** loop. In contrast to FORTRAN, which in its original guise had the basic
    **DO** loop (such as **DO 10 N = 1,100**) as its only block-*structured* instruction,
    PL/I took inspiration from ALGOL by offering several ways to structure code in
    blocks. In fact, the whole of the code is defined as a block – specifically the
    main procedure **CTOF**, which is bracketed by **CTOF:** and **END CTOF** – and
    had it been a more complicated program, it would have been


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_60_0.png)


    > Forget about fancy IDEs in your exploration of PL/I! You''ll be editing your
    code in a plain text editor, and you''ll be running it at the terminal prompt.


    # » BACK IN THE USSR


    PL/I might not have enjoyed a *great deal* of success in the West, but things
    were very different behind the *Iron Curtain* in the early ''70s. It appears that
    PL/I was used extensively in the *Soviet Union*, and other countries under its
    sphere of influence, where it came a lot closer to doing *what IBM* had hoped
    for it, namely to *supplant both* FORTRAN and *COBOL*. However, like so many things
    in the *former USSR*, *definitive information* is *hard* to come by. IBM''s development
    of the general-purpose *language PL/I* was *very much* tied up with its development
    of the *System/360*, which was *conceived as* a *general-purpose* computer. *This*
    was in marked contrast to its previous machines, which were aimed either at *scientific*
    or *commercial* users. *Given* that the *Soviet ES EVM* series computers were
    *clones* of *System/360* mainframes – *reportedly* produced by *reverse engineering*
    – it would surely have been quite natural for PL/I to be the *key* to the *ES
    EVM* programme. And the limited documentation *available* does, indeed, show PL/I
    as being offered with ES EVM machines.


    What we *don''t know*, *however*, is *whether* the *Soviet* *version* of PL/I
    was *identical* to that *used* in the West, *or* whether it was a *nationalised*
    *version*, *as* was the case with some *Soviet* *versions* of *ALGOL*. *Or*, *to*
    put it *another* *way*, would the *second* *line* of *our* *second* *sample* *program*
    *have* *been* *initially* *as* *meaningless* *to* *Russian-speaking* *programmers*
    *as* *something* *not* *too* *dissimilar* *to* **ПРОЦЕДУРЫ** **ВАРИАНТЫ** **(ОСНОВНЫЕ)**
    would be to *most* of *us*?'
