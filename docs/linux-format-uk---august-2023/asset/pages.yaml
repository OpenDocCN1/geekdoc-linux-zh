  md: "# REVIEW **S** Processor\n\n# # Intel Core i3-13100F\n\nAs Intel reclaims the\
    \ mid-range, **Paul Alcorn** assesses that the company has lost the low-end.\n\
    \n+   **SPECS**\n+   \n+   *Family:* Raptor Lake\n+   \n+   *Socket:* \n+   V\
    \ LGA1700\n+   L3 (shared)\n+   \n+   *Process:* Intel 7 10nm\n+   \n+   *Cores\
    \ (P+E):* 4+0\n+   \n+   *Threads:* 8\n+   \n+   *P-cache:* 320KB L1,\n+   5MB\
    \ L2, 12MB L3 (shared)\n+   \n+   *P-core:* 3.4GHz\n+   (4.5GHz boost)\n+   \n\
    +   *Mem max:* \n+   128GB, no ECC,\n+   two-channel\n+   \n+   *Mem speed:* \n\
    +   DDR5 4,800MT/s,\n+   DDR4 3,200MT/s\n+   \n+   *PCIe:* v5 and v4 20 lanes\n\
    +   \n+   *Unlocked:* No\n+   \n+   *GPU:* N/A\n+   \n+   *Processor base power:*\
    \ 60W\n+   \n+   *Maximum turbo power:* 89W\n\nT he Intel Core i3-13100F comes\
    \ to market with big shoes to fill; its predecessor, the Core i3-12100F, built\
    \ a reputation as the best budget CPU. Intel is obviously looking to repeat that\
    \ success, but perhaps the Core i3-13100F follows in the footsteps of its predecessor\
    \ too closely — the company repurposed the previous-gen design for the Core i3-13100,\
    \ so it has the same four P-cores paired with an ever-so-slightly-improved 200MHz-higher\
    \ boost clock of 4.5GHz.\n\nAs such, outside of some microcode tuning, the 13100\
    \ is identical to the 12100. That is evident from the L2 cache capacity, which\
    \ weighs in at 1.25MB per core for the 13100. In contrast, the truly new Raptor\
    \ Cove cores come with 2MB per core.\n\nLike its predecessor, the Core i3-13100F\
    \ (the F lacks an iGPU) comes with four background cores and eight threads, but\
    \ no E-cores for background tasks. Intel sprinkled on 200MHz of extra boost frequency,\
    \ bringing it to 4.5GHz, and 100MHz higher base clock, taking it to 4.3GHz. The\
    \ clock speed adjustments are all that Intel has to justify the step up to 13th-gen\
    \ branding and the much higher price tag, while AMD’s Ryzen 5 5600 has seen substantial\
    \ price reductions that change the circa-£130 landscape entirely.\n\n# ### Picking\
    \ up speed\n\nIf you’re looking for a gaming processor for around £100, the 120\
    \ Core i3-13100F is 8% faster than the E95 Ryzen 5 5500, giving it the win. The\
    \ Ryzen 5 5500 is also limited to the PCIe 3.0 interface, while the 13100F supports\
    \ the faster PCIe 4.0 and 5.0 interfaces, giving it a big drive speed boost.\n\
    \nHowever, if you’re looking for a chip with a little more heft in productivity\
    \ workloads, or if you can’t find a Core i3 F-series model in stock, you’ll have\
    \ to jump up to the E130 to E150 price range. The 13100\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_19_0.png)\n\
    \nThe PCIe v5 abilities are the most tempting aspect of this processor.\n\nCore\
    \ i3 chips, support DDR4 memory. Meanwhile, the Intel chips are confined to 600\
    \ and 700-series chipsets, so AMD has the platform pricing advantage — you can\
    \ find incredible deals for AM4 motherboards. Be aware that we lose support for\
    \ PCIe 5.0 and DDR5 if you go with the Ryzen 5 5600, but we don’t think those\
    \ interfaces are as important with this class of chip. Both the Intel and AMD\
    \ chips come with bundled coolers that are sufficient for normal operation.\n\n\
    The E150 Core i3-13100 is overpriced for a quad-core in 2023. Intel’s decision\
    \ to use the same design for the 13100F and merely increase boost clocks by 200MHz\
    \ doesn’t do enough to deliver any tangible increase in value. The minor improvements\
    \ we saw in our testing certainly aren’t enough to justify the Core i3-13100’s\
    \ higher price tag over the prior-gen model.\n\nThe less expensive 120 Core i3-13100F\
    \ makes more sense, but it faces a stiff challenge from its predecessor. If you’re\
    \ looking to step up a pricing tier, the Ryzen 5 5600 is the best of the bunch\
    \ in both gaming and productivity work.\n\n# VERDICT\n\n+   *DEVELOPER:* Intel\n\
    +   \n+   *WEB:* www.intel.com\n+   \n+   *PRICE:* £120\n\n| FEATURES | 9/10 |\
    \ EASE OF USE | 9/10 |\n| PERFORMANCE | 6/10 | DOCUMENTATION | 6/10 |\n\nA rehash\
    \ of the previous-gen model, with slightly higher pricing and clock speeds, so\
    \ performance gains are limited.\n\n> Rating 7/10"
  merge: -1
  img_proc: true
