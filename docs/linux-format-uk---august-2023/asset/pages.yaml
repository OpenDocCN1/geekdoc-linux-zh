  md: 'WE LOVE LOTS OF SPINS OF LINUX STUFF SO YOU DON''T HAVE TO!


    # # Roundup


    Ubuntu Studio \>\> Kubuntu \>\> Edubuntu \>\>


    Ubuntu MATE \>\> Lubuntu


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_25_0.png)


    Michael Reed


    has been handed so many flavours and spins over the years that he feels like he
    works on a milkshake stand.


    # ## Ubuntu spins


    With the release of Ubuntu 23.04 still fairly recent, Michael Reed examines the
    differences between the official spins of that distribution.


    # HOW WE TESTED...


    For this assignment, we installed each distribution and began playing around with
    them, trying to picture how they would look to both newcomers and people who already
    have some Linux experience. We carried out some basic tasks and loaded up most
    of the important apps. We updated the systems and tried installing some software
    using the GUI package management tools on offer.


    This time around, we''re not searching for a low-end solution, but we did make
    some notes about how efficient each distribution is. As usual, we used the *df
    -h* command to display the disk usage of an updated fresh installation and *free
    -h* to find out how much memory was in use upon a fresh boot to a desktop with
    a terminal window open. It''s sometimes subjective, but we keep a constant look
    out for anything that feels slow.


    In this case, no notable problems, such as crashes or slowdowns, showed up when
    managing software or using the systems.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_25_1.png)


    To some of us, they are spins or editions, but Ubuntu calls them flavours. We''re
    going to take a look at five of the official flavours of Ubuntu 23.04, and we
    can tell you now, each one is worth considering and has its own strengths.


    Kubuntu offers a KDE 4 experience with great looks and a polished desktop, along
    with all the basic applications you''re likely to need to get started. It''s modern,
    polished Linux desktop computing at its best. Lubuntu uses the Qt-based LXQt desktop
    environment with a combination of standard desktop applications and lightweight
    tools. Ubuntu MATE delivers a fairly conventional desktop environment that''s
    well suited for either the office or home.


    Ubuntu Studio is a specialised distro that combines a customised KDE desktop with
    an extensive selection of applications, tools and plugins that cover areas such
    as music, audio, graphic design and video editing, all preconfigured and ready
    to go. It''s the ideal starting point for building a studio computer. Edubuntu
    is also specialised but for educational use. To achieve this, it offers a Gnome
    desktop along with a large selection of apps and smaller tools that are ideally
    suited to classroom use or to make a fantastic child-friendly computer setup.'
  merge: -1
  img_proc: true
