  md: 'specification. It also means that really large allocations of memory aren''t
    available at all on the mainstream chips - the M1 is offered with a maximum of
    16GB of RAM, while the M2 is limited to 24GB. If you want 32GB or more you need
    to move up to an expensive M2 Pro or Max system (or the M1 Ultra). For comparison,
    all of Intel''s 12th and 13th-generation processors can use up to 128GB of RAM.


    However, because Apple''s RAM is literally located right next to the processor
    logic, and connected to it via the fastest possible fabric, its processors can
    access code and data extremely quickly and efficiently. The standard M1 boasts
    a maximum memory bandwidth of 68GB/s, while the M2 goes up to 100GB/s, and the
    recently launched M2 Pro and Max models go up to 200GB/s and 400GB/s respectively.
    With Intel it all depends on the specifics of the processor, the RAM and the motherboard,
    but even the newest, fastest Core i9 is limited to a theoretical maximum of 90GB/s.


    What''s more, Apple uses what it calls a "unified memory architecture", which
    means that the whole range of memory can be directly accessed by either the CPU
    or the on-die GPU. This provides huge efficiency benefits compared to a conventional
    PC architecture, where the CPU and GPU each have separate memory banks, and can''t
    work together on the same data without copying it back and forth. It''s not just
    games that benefit, but any process that can take advantage of GPU functions,
    such as video editing and rendering.


    # ## What about AMD?


    So far we''ve been comparing Apple to Intel, but of course there''s a third major
    player in the CPU market. AMD''s chips don''t have such a distinct identity, however,
    because they use the same core x86 architecture and instruction set as Intel.


    You may wonder why Intel allows its biggest rival to use its proprietary architecture.
    The answer dates back to the early ''80s – IBM was interested in using Intel''s
    chips in the original IBM PC, but it didn''t want to be solely reliant on one
    source of silicon, so it told Intel that it would use x86 processors only if a
    second company was also permitted to manufacture hardware under licence. AMD was
    thus authorised to build Intel 8086, 80186 and 80286 processors.


    Later, AMD drew on this expertise to start creating its own chip designs to rival
    Intel''s. The K5 and K6, released in the late ''90s, provided x86 compatibility
    at a lower price than Intel''s Pentium processors. And at the turn of the millennium,
    AMD grafted a whole new 64-bit processing mode on to the x86 architecture, with
    enhancements to support working with larger numbers, bigger data sets and more
    RAM. These extensions were then licensed by Intel, leading to a situation today
    where the two companies are effectively reliant on each other – Intel lets AMD
    use the original x86 architecture, while AMD lets Intel use the 64-bit extensions.
    It''s hard to see either company choosing to end the arrangement.


    # ## What makes AMD better than Intel?


    Although AMD''s processors can run the same programs as Intel''s, there are some
    key differences –


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_82_0.png)


    for instance, although AMD sells its own chips, it doesn''t manufacture them itself;
    this means that it can use whichever foundry offers the best technology. While
    the first two generations of Ryzen CPUs were produced by GlobalFoundries, AMD
    subsequently switched to TSMC in 2019 to take advantage of its 7nm fabrication
    process, and the latest Ryzen 7000-series chips use the company''s 5nm process.
    That helps AMD chips spend more of their time running at the highest frequencies,
    before they need to slow down and cool off.


    AMD''s designs also frequently pack in more performance cores than similarly priced
    Intel chips, in part due to its chiplet approach. Rather than build everything
    on to one die, it breaks the design down into multiple processor cores (chiplets)
    that it then


    # ## PULLING ON A THREAD


    > "Core counts can be misleading, as both companies use multithreading technologies
    that allow a single core to service two execution threads at once."


    connects together, along with shared resources such as the main memory cache.


    Actual core counts can be misleading, because both companies use multithreading
    technologies that allow a single core to service two execution threads at once.
    Matters are further confused by Intel''s recent adoption of efficiency cores,
    which don''t contribute to peak performance.


    Overall, though, you normally get more multicore processing power from an AMD
    chip – and to support those cores, AMD tends to provide more on-chip memory than
    Intel. While Ryzen CPUs don''t put the whole RAM allocation on the chip like Apple''s
    chips, they generally have large caches that help them keep processing data and
    instructions at full speed, without having to wait for data to be fetched from
    the DIMMs. The only question is how valuable multicore performance is. Big database
    servers and graphics rendering programs may benefit hugely from parallel processing
    power, but many games and desktop apps are mostly single-threaded. In practice,
    you might get a better experience with fewer, faster cores.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_82_1.png)'
