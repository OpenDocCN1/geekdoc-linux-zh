    # Playing with loops


    Ardour 7 introduced the option of working with the Freesound sound library, and
    working with loops downloaded from this source is as good a way as any to familiarise
    yourself with how Ardour works. This holds true even if you don''t, eventually,
    want to work with loops.


    An account is needed to use the Freesound service, but it''s free to create one.
    Access the site (https://freesound.org) and follow the prompts from the Login
    link. The first time you access Freesound resources from within Ardour (from Session
    > Import), the program contacts the Freesound website, which produces a code number
    that you can cut and paste back into Ardour.


    Note that the Import dialog window is the one you would use to import audio files
    from your local hardrive. However, in this case, we''ll work with material from
    Freesound.


    Within the Import dialog, select the Freesound tab and search for the word ''drums''.
    Scroll through the list and look for something that seems suitable. You''re looking
    for something that has a duration of around two to 10 seconds, as we need something
    that can be looped. You can preview the sound by pressing the play icon within
    this dialog. When you''ve found something you like the sound of, click on Import.
    This creates a track within Ardour and imports the downloaded material. Switch
    on the metronome (top icon panel) and press play. The loop plays while the position
    cursor moves over it.


    # A bit of a stretch


    Ardour defaults to a tempo of 120bpm (beats per minute), and it''s a good thing
    if the drum loop you''ve added doesn''t match that tempo as it''s an opportunity
    to use Ardour''s audio stretching facilities. For example, we chose a drum loop
    with the filename drums_98_swing_full, and we were able to deduce that it was
    a drum beat with a tempo of 98bpm. Fortunately, Ardour has facilities to speed
    up and slow down a drum loop without altering the pitch.


    Select the Stretch Tool in the toolbar. Hover the mouse anywhere along the drum
    loop container on the timeline and then drag the edge so that it matches one of
    the marker lines in the arrange window. A dialog pops up telling you how much
    the duration is being altered. For instance, if you dragged the edge of the container
    so that it fills one bar, our example loop would be sped up so that it fills 81.6%
    of the space. There are also options in this dialog to control the algorithm that
    is used for the pitch shifting, and we recommend choosing Unpitched Percussion
    With Stable Notes for material such as a drum loop. If you click on OK, the conversion
    takes place and the drum loop should now cover exactly one bar and conform to
    a 120bpm metronome click.


    The other way we could have taken things would be to increase the length of the
    drum loop so that it fills exactly two bars. If we do this, the dialog tells us
    that this means increasing the length of the container to 163.3% of its original
    size. The problem here is that


