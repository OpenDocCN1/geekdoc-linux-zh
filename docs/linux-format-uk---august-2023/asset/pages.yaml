    \ of draugr intestines has given us a recipe for sausages, so we stuff the entrails\
    \ with boar meat and flavour them with thistle. Then eat them, eyes widening as\
    \ the health bar grows to twice the size it's ever been. In *Valheim*, you're\
    \ a dead Viking warrior. Your soul has been deposited in the afterlife so you\
    \ can battle the enemies of Odin, powerful creatures such as a towering giant\
    \ made from tree trunks and a toxic swamp blob that emits great clouds of poison.\n\
    \nBut before you can do Odin's work, you've got to do dozens of hours of your\
    \ own labour: building a home,\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_23_0.png)\n\
    \n> > Good sir, can you direct me to the nearest tavern?\n\nmaking weapons and\
    \ gear, levelling up skills, unlocking crafting recipes, and slowly exploring\
    \ deeper and deeper into the huge, dangerous world. It may not sound all that\
    \ different from other open-world survival sandboxes, but *Valheim* is an utterly\
    \ engrossing experience that blends thoughtfully designed survival systems with\
    \ exciting RPG-like adventures, where each small nugget of progress sets the stage\
    \ for the next.\n\n# ### Odin's blood\n\nThe sausages are a good example. Unlike\
    \ most survival games, you won't starve to death in *Valheim* if you don't eat,\
    \ but you absolutely need to eat. The right foods dramatically boost your tiny\
    \ health bar and increase your stamina, so you won't get far without spending\
    \ some time in the kitchen. And a whole lot of deaths along the way. There's not\
    \ so much a difficulty curve to *Valheim* as there are towering, razor-sharp difficulty\
    \ spikes. That feels frustrating initially, but eventually, and weirdly, it becomes\
    \ encouraging. Just setting foot somewhere you're not ready for, like that draugr\
    \ village or a swamp crypt or a frigid mountain-side, can brutally punish you,\
    \ but also give you new goals and a tantalising glimpse of future possibilities.\
    \ When first discovering a new biome, the Plains, we had roughly one second to\
    \ admire the view and swelling music before a deathsquito buzzed across the screen\
    \ and into our side, taking more than half our health away with one jab. We fled\
    \ immediately, though we managed to kill the insect, gaining a needle, which gave\
