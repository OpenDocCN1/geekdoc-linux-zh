  md: "# TUTORIALS\n\n# TUIFEED\n\nCredit: https://github.com/veselo/tuifeed\n\n#\
    \ Minimalist RSS reader\n\nAs far as **Shashank Sharma** is concerned, it’s not\
    \ social media but ads that are the bane of modern internet usage, and he has\
    \ a clever workaround.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_53_0.png)\n\
    \n> **OUR EXPERT**\n> Shashank Sharma\n> is a trial lawyer in New Delhi and an\
    \ avid Arch user. He's always on the hunt for affordable geeky memorabilia.\n\n\
    or voracious consumers of web content, the greatest obstacle in the quest for\
    \ information is the need to switch from one website to another. Wouldn't it be\
    \ great if you could browse through hundreds of your favourite internet resources\
    \ with a single app or utility? That's the gift of RSS feeds.\n\nWith the minimalist\
    \ feed reader *Tuifeed*, you can quickly scroll through the content of all your\
    \ favourite sites without once having to reach for the browser. Unfortunately,\
    \ *Tuifeed* and most of its ilk, such as *Norm* (see box below), are limited to\
    \ serving text-based content from websites. Some graphical alternatives, however,\
    \ can go a step further and also fetch podcasts.\n\nWritten in Rust and released\
    \ under the MIT licence, the project isn't available in the repositories of desktop\
    \ distros, but installation is still quite straightforward.\n\nIf you don't already\
    \ have Rust and Cargo installed, you can use your distro's package manager to\
    \ install them. The `sudo dnf install rust cargo` command installs them on RPM-based\
    \ distributions, such as Fedora. You can similarly run `sudo apt install cargo`,\
    \ which also installs the Rust package, if you're running Ubuntu or Debian, or\
    \ one of their derivatives.\n\nYou can now use Cargo, the package manager for\
    \ Rust packages, to install *Tuifeed* with the `cargo install tuifeed` command.\
    \ You can alternatively install the latest version using the official shell script:\n\
    \n```\n```bash\ncurl --proto 'https' --tlsv1.2 -sSLf 'https://git.io/Jl0Gz' |\
    \ sh\n```\n```\n\n# Working with feeds\n\n*Tuifeed* claims to support both RSS\
    \ and Atom feeds. You must add the feeds you're interested in to the `~/.config/tuifeed/config.toml`\
    \ file. Open the file in your favourite text editor or run the `tuifeed -c` command.\
    \ All your feeds are added under the `[sources]` section of the `~/.config/tuifeed/config.toml`\
    \ file with the \"*Website Name*\" = \"*URL*\" format:\n\n```\n```bash\n[sources]\n\
    \"Comicosity\" = \"https://www.comicosity.com/feed/\"\n\"TechRadar Software\"\
    \ = \"https://www.techradar.com/rss/news/software\"\n\"TechRadar\" = \"https://www.techradar.com/rss/\"\
    \n\"Ars Technica Tech Policy\" = \"https://feeds.arstechnica.com/arstechnica/tech-policy\"\
    \n\"Ars Technica\" = \"https://feeds.arstechnica.com/arstechnica/index\"\n\"IPLeaders\
    \ Blog\" = \"https://blog.iplleaders.in/feed/\"\n\"SpicyIP\" = \"https://spicyip.com/feed\"\
    \n\"Best Thrillers\" = \"https://bestthrillers.com/feed/\"\n```\nAfter you have\
    \ added the feeds for all of your favourite internet resources into the `~/.config/tuifeed/`\n\
    ```\n\n# WORKING WITH NOM\n\n*Nom* ([https://github.com/guyfedwards/nom](https://github.com/guyfedwards/nom))\
    \ is every bit as minimalist as *Tuifeed*, if not more so. It doesn't have a pained\
    \ interface, or any colours for that matter. Unlike *Tuifeed*, however, *Nom*\
    \ never messes up the content of an article and respects paragraphs.\n\nWritten\
    \ in Go, you can install *Nom* with the `go install github.com/guyfedwards/nom/cmd/nom@latest`\
    \ command. You can send feeds to the `~/.config/nom/config.yml` file:\n\n```\n\
    ```yaml\nfeeds:\n  url: https://feeds.arstechnica.com/arstechnica/tech-policy\n\
    \  name: ArsTechnica Tech Policy\n  url: https://feeds.arstechnica.com/arstechnica/index\n\
    \  name: ArsTechnica\n  - url: https://bestthrillers.com/feed\n  name: Best Thrillers\n\
    ```\n```\n\nYou can run `nom --feed URL` to test how it displays the specified\
    \ feed without adding it.\n\nWhen you run *Nom* after adding all the feeds to\
    \ the config file, the project displays a numbered list of all the fetched articles,\
    \ along with the feed's name:\n\n+   11. TechRadar Software: Nvidia's latest AI\
    \ model\n+   12. TechRadar Software: Microsoft gives one of\n+   14. TechRadar\
    \ Software: Microsoft is finally 74. ArsTechnica: CEO: Raspberry Pi stock to\n\
    \nWe've only featured a truncated list to showcase how *Nom* displays the content\
    \ from the different feeds. Use the arrow keys or PgUp/PgDn to move through the\
    \ list.\n\nTo read an article, select it from the list and press Enter. Use the\
    \ up/down keys to read through the article and press Esc to move back to the article\
    \ list."
  merge: -1
