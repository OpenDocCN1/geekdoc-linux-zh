  md: '# ## Ubuntu spins ROUNDUP


    # ### Edubuntu 9/10


    The layout of Edubuntu is largely the layout of standard Ubuntu with a custom
    colour scheme. Its Gnome desktop is configured with a vertical dock launcher/switcher
    that sits against the left-hand side. Single clicks on these icons launch apps
    and the icon becomes highlighted once the app is running. The layout isn’t traditional,
    but it’s so simple that most people can quickly pick it up, an important consideration
    for an educational system.


    There is a slight issue in that categories are thrown in with apps in the pop-up
    launcher, following the standard Gnome scheme. In this case, there are many specialised
    educational apps and although locating and launching apps is fast using the Gnome
    launcher, it’s not quite as good as a traditional one for browsing via categories.
    This criticism aside, the standard Gnome desktop is easy for adults and kids to
    pick up, and works well.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_28_0.png)


    # ### Ubuntu MATE 7/10


    As it relies on MATE as the desktop environment, this doesn’t break much new ground
    in terms of user interface concepts. What it does offer is familiar and solid.
    Good use is made of a mid 3D effect that has fallen out of fashion with some other
    desktops and around the web, and the amount of space around elements is good.
    Personal preference might be a factor; it is an old-fashioned-looking desktop
    as it has its origins with the original Gnome desktop, from which it was forked
    during the 2.x era.


    The standard, searchable launcher pops down rather than up because the taskbar
    is at the top of the screen, and a second bar containing the task switcher runs
    along the bottom. The advantage of doing it this way is that the taskbar has plenty
    of room on it for old-fashioned task panels with full window titles on it.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_28_1.png)


    # ### Lubuntu 8/10


    Lubuntu is powered by LXQt, a desktop environment that has a look reminiscent
    of Qt, the toolkit that powers it. This means it’s neat and clear, and not overly
    flashy. You certainly don’t have many moments of feeling confused as to what does
    what. Although simple and easy to understand, it has a functional style that never
    feels bland, and it’s nice to see some use of colours in the icons.


    This familiarity and simplicity extends to the overall desktop layout, with the
    launcher/taskbar/status panel located along the bottom of the screen. That launcher
    is searchable, as we’d expect, although it can only search by item name and not
    description. It’s a crystal-clear desktop that’s dark against being drab – it
    has a look that goes against some of the current UI trends, and we like it. None
    of the desktops were slow, but LXQt felt like the lightest and fastest.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_28_2.png)


    # # Package management


    There is a variety of front-ends to the Ubuntu package system.


    +   C anonical has famously disabled Flatpak support recently, and each of these
    distributions is affected by that, but you can enable support by manually installing
    it, as you would on normal Ubuntu. As these flavours are Ubuntu under the hood,
    you can also use the standard package installation tools such as APT on the command
    line along with the Snap packaging system.


    KDE’s application launcher (as employed by Ubuntu Studio and Kubuntu) is linked
    to the packaging system, making installation suggestions while you search. Both
    of those distributions feature a software store called Discover. This features
    applications from both the Ubuntu and Snap repositories with reviews and ratings.


    Ubuntu MATE has its own software manager called Software Boutique, but in its
    current state of development, it’s not the best store app we’ve seen. Its database
    isn’t very extensive – although it does contain a mix of open source and proprietary
    software – and it doesn’t feature ratings or reviews. We’d use it


    to install a basic GUI package manager such as Synaptic or a more extensive store
    such as Gnome Software.


    Edubuntu comes with Ubuntu Software Center, Canonical’s front-end to the Snap
    system. It contains a curated list of apps that are, helpfully, rated and reviewed.
    You have to install something like Synaptic if you want to be able to install
    smaller apps and system components that aren’t in the Snap repository.


    Muon is a Qt-powered package manager on Kubuntu, Ubuntu Studio and Lubuntu. It’s
    a front-end to Ubuntu package repos, and is similar to the Synaptic front-end
    on GTK-based distros.


    # **VERDICT**


    | Flavor | Rating |

    | :--- | :--- |

    | UBUNTU STUDIO | 8/10 |

    | KUBUNTU | 9/10 |

    | EDUBUNTU | 7/10 |

    | UBUNTU MATE | 6/10 |

    | LUBUNTU | 7/10 |


    KDE’s application launcher suggestions are useful, and by default Ubuntu Studio
    and Kubuntu tick the most boxes.'
  merge: -1
