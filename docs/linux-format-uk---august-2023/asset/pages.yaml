    \ or so. I don't speak Systemd, but I have 10 or 15 Linux OSes that use it that\
    \ I boot occasionally. **George Bates**\n\nYou can change this timeout in /etc/systemd/system.conf\
    \ - the setting is DefaultDeviceTimeoutSec. You can also change it for individual\
    \ devices in /etc/fstab by setting x-systemd.device-timeout in the Options field.\
    \ However, neither of these solves your problem, they just make the symptom of\
    \ it 55 seconds less annoying. Also, you'll need to make the change on each distro.\n\
    \nYou must specify the devices to mount using factors that don't change. The two\
    \ most useful are UUID and LABEL. Each filesystem has a UUID (universally unique"
