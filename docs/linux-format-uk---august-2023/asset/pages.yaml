  md: '# HOTPICKS


    # AI IMAGE GENERATOR


    # Imaginer


    Version: 0.2.0

    Web: https://imaginer.codeberg.page


    AI image generation is all the rage these days. Using Imaginer, you can call upon
    the power of image-generation AI algorithms to cobble up some creative artwork
    right from your desktop.


    It’s available in the repos of some distros, but it’s best to grab the distro-agnostic
    version from Flathub with flatpak install flathub io.codeberg.ImaginerImaginer.


    The app has a straightforward interface. To call on the services of the AI maestro,
    enter keywords or text prompts in the Prompt field, and hit the Imagine button.


    The app ferries the prompt to the AI image-generation service, which works its
    magic and produces an image.


    You can refine things by adding a negative prompt. This extra set of keywords
    informs the AI image-generation engine about details not to generate. For instance,
    type low quality in the negative prompt to ensure the engine only generates high-quality
    artwork.


    You can also ask the app to automatically save any generated imagery, specifying
    a location in the Save Location section. It’s a good idea to define the location
    before you generate a image because the app offers


    no mechanism for manually saving an image after it has been generated.


    One of the best aspects of Imaginer is that it’s not limited to just one AI image-generation
    engine. You can choose from a plethora of services including Open AI, Stable Diffusion,
    Analog Diffusion, Anything, Portrait Plus, Nitro Diffusion, Open Journey, and
    Waitfu Diffusion.


    Head to Preferences from the hamburger menu to enable the service you want to
    use. Once enabled, you can select the service from the Providers list.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_87_0.png)


    > Think of the prompt and the negative prompt as the dos and don''ts for image
    generation.


    # ASCII IMAGES


    # Letterpress


    Version: 1.3.0 Web: https://gitlab.com/gregormi/Letterpress


    SCII art has lost its sheen, and its popularity isn’t what it used to be back
    in the days of dialup internet and BBS (alright, granddad! – Ed) but it still
    has fans. As ASCII aficionados will recall, generating ASCII images took a lot
    of time and effort. Letterpress lets you relive those glorious days, without the
    sweat, by turning your pictures into ASCII images.


    The app is available on Flathub and can be installed with `flatpak install flathub
    io.gitlab.gregormi.ASCIIImages`. You can then run it from the distro’s Applications
    menu or with `flatpak run io.gitlab.gregormi.ASCIIImages`.


    Letterpress gets its powers from jp2a, which is an ASCII converter engine. You
    can use it to convert any JPEG or PNG image into ASCII art.


    Working with the app is pretty simple. Just load any photo from your computer
    into Letterpress, either with the Open File button and navigating the filesystem
    or just dragging and dropping an image into the app’s interface. Letterpress then
    works its magic and spits out an ASCII version of the image in mere seconds.


    Once this is done, you can choose the width of the ASCII characters from the bottom
    bar, before downloading the result to a TXT file. The app also offers the option
    to save it to the clipboard, from where you can paste it anywhere you want.


    While using the app is pretty straightforward, getting a meaningful image is a
    lot more cumbersome. Letterpress works as advertised and replaces the pixels in
    the original image with one of the 128 ASCII characters. However, depending on
    the complexity of the source image, the resulting ASCII image doesn’t always make
    sense. For some images, increasing the width of the image does the trick and makes
    the output visually appealing.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_87_1.png)


    > Guess the image competition! Let us know what you think it is and we’ll send
    you our complimentary compliments!'
