    files (let Backups or Back In Time protect your Home folder and app configuration
    files), so leave it set to Exclude All Files before clicking Next to see a summary
    of settings. Click Finish to return to the main screen.


    # Take your first snapshot


    Click Create to set up your first snapshot. This takes some time, and when it’s
    done the snapshot is listed in the window along with its time and date, system
    version, tags (one or more letters identifying the type of snapshot, such as O
    for on-demand and B for boot), and comments. The last one is editable, and enables
    you to add some descriptive information if you want. From now on, Timeshift automatically
    takes snapshots according to the schedule you choose, and each one shows up here.
    You can also manually take snapshots using the Create button – for example, before
    updating to the next major version of Mint or Ubuntu – which is when the Comments
    field is particularly useful, enabling you to easily identify specific snapshots
    going forward.


    Should you ever need to restore a system snapshot, the step-by-step guide (opposite)
    reveals what you need to do, from a simple restore within your current Linux installation
    to recovering a non-booting system with the aid of your Linux live DVD or flash
    drive.


    # A fail-safe backup


    As things stand, you’ve backed up your Home folder and instigated a snapshot tool
    to protect system files. But what if you accidentally miss a file or setting?
    The answer lies in taking a fail-safe drive image – a complete byte-by-byte backup
    of your system drive. While it’s possible to take a drive image using the Dsks
    utility or using dd via the terminal, this can be incredibly slow (and in the
    case of Dsks, only produces uncompressed images). A tool called Redo Rescue (http://redorescue.com)
    provides you with an emergency boot disk that can be used to both create and restore
    disk and partition images. After booting from the disk, Redo Rescue provides a
    basic desktop interface, but launches straight into the Redo Rescue tool. Start
    by clicking Backup, select your boot drive and click Next. By default, all partitions
    on the drive (including bootable partitions) are selected, so click Next again
    to select the destination drive – this can be a local disk, network folder or
    even NFS/


    SSH/FTP -connected storage – and the folder in which the image will be stored
    as a single file. You’re then prompted to give the backup a suitable name and
    description before clicking Next to start the backup process. Once complete, click
    Verify at the main screen to ensure the file isn’t corrupt, and then – if you’re
    being thorough – take a second fail-safe drive image that you store on another
    drive. Should the drive containing your Linux installation subsequently fail,
    you can install a replacement, then boot from your Redo Rescue emergency media.
    Click Restore, then browse to the folder containing your drive image to open the
    .redo file. Finally, select your newly installed drive, stay on the Full System
    Recovery tab (Restore Data Only is an option if your old drive is still functioning
    and you just want to restore individual partitions), then click Next followed
    by Yes, I’m Sure! Once done, reboot into your restored Linux installation. If
    the drive image is older than your most recent system snapshot and/or file-based
    backup, you can then use the restore tools in Timeshift and Backups to bring your
    system back up to date.


    > To make changes to your Timeshift configuration, either click Wizard to run
    through the setup wizard again, or Settings to reconfigure specific areas of your
    configuration, including areas not covered by the wizard, such as include/ exclude
    filters.


    # BACK UP SECURELY TO THE CLOUD


    It’s always a good idea to keep at least one copy of your data stored in a separate
    location from your PC. Cloud storage offers the most convenient way to do this,
    but there are question marks over security. One way to get around this is to wrap
    your backup files in another layer of encryption before uploading them, and the
    simplest way to do that is with a tool called Duplicati (www.duplicati.com). Duplicati
    is supplied as a DEB file, so once downloaded, double-click this to install it
    via Software Manager with its dependencies (mono being the main prerequisite).
    Open Duplicati and it redirects you to a browser window and the main web-based
    interface. From here it’s relatively straightforward. Click Add Backup to work
    your way through the wizard – you start by entering a passphrase with which to
    encrypt your backup files (make a note of this) before choosing where to store
    your backup files. Duplicati supports local storage, various network protocols
    and a range of proprietary cloud storage providers, including Dropbox, Mega, Google
    Drive and Microsoft OneDrive. Choose what to back up, set a schedule and select
    your retention options, then leave Duplicati to do the rest. For more on Duplicati,
    check out our tutorial from LXF263 (available to subscribers at www.linuxformat.com/archives/?issue=263).


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_58_1.png)


    Duplicati’s big selling point is that you can store your backups securely on a
    variety of different cloud-based platforms.


