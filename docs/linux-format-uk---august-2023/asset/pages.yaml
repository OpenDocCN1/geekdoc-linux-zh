  md: '# CHESS GAME


    **cli-chess**


    Version: 1.0.0 Web: https://github.com/trevorbayless/cli-chess/


    T his one comes courtesy of one of our readers who has created a terminal chess
    game called cli-chess. The game is developed around a chess engine that supports
    offline playing of not just the regular chess game, but also several Lichess variants,
    including Crazyhouse, King of the Hill, Three-check and more. Furthermore, you
    can use cli-chess to play with other players online on the Lichess.org server,
    and also stream games from Lichess TV. The game is written in Python and can be
    installed using the Pip package manager with pip install cli-chess. Once it''s
    done, type in cli-chess to begin playing. You can use the keyboard to navigate
    the menu and select the variant you''d like to play. After making your selection,
    press F1 to begin the game. By default, the game initiates the standard chess
    game against the computer.


    Once inside the game, you can''t move the pieces with the arrow keys or your mouse.
    Instead, you have to user either SAN (standard algebraic notation) or LAN (long
    algebraic notation) to make moves, such as c6


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_88_0.png)


    (pawn to G6), Be2 (bishop to E2) or Nxe7 (knight captures the piece on E7). To
    help you make the move, the game mentions the coordinates by the side of the board.


    In order to play against other players online, you first need to create an API
    token for your Lichess account, and then pass it to the game to help it authenticate
    with the service. Fire up your browser and log in to your Lichess account, and
    then follow the link on the project''s website to generate a Lichess API token
    for cli-chess to authenticate with. Finally, copy the token and pass it on to
    the game with cli-chess --token <your-token>.


    > You can increase the size of the terminal font in order to make the board bigger.


