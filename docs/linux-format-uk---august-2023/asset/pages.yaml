  md: "# Fedora 38\n\n**Nate Drake** took the latest Fedora for a test drive and was\
    \ blown away by the vast array of new spins and features.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_20_0.png)\n\
    \n+   **IN BRIEF**\n+   Like Indiana Jones’s hat, Fedora is cool, adventurous\
    \ and easy to don. There’s a kaleidoscope of spins combined with easy setup, bleeding-edge\
    \ features and a huge selection of software.\n+   \n+   **SPECS**\n+   CPU: 2GHz\
    \ dual-core\n+   Mem: 2GB\n+   HDD: 15GB\n+   Builds: x86, 64, AArch64\n\nApart\
    \ from being the chosen hat of everyone’s favourite adventurer, Indiana Jones,\
    \ Fedora is the upstream source of the Red Hat Linux Project. This puts it on\
    \ the bleeding edge of innovation when it comes to software packages, so we were\
    \ eager to see if Fedora 38 lived up to its predecessors. This latest version\
    \ was announced on the Fedora blog a week early, which came as rather a surprise\
    \ to the Linux community, which is used to a more sedentary development cycle.\n\
    \nIf you’ve already decided on the Workstation (desktop) version of Fedora, you’re\
    \ still spoiled for choice when it comes to desktop environments. Apart from the\
    \ default Gnome (pictured), there’s now an official spin of the Budgie, KDE, XFce,\
    \ LXDE, MATE and Cinnamon environments.\n\nOnce you’ve chosen, you can either\
    \ download a special image writer tool to copy your chosen flavour to USB or just\
    \ choose the ISO. We were pleased to see the Gnome flavour of Fedora 38 was a\
    \ very trim 2GB. Once you’ve had enough of test-piloting Fedora in live mode,\
    \ you can fire up the Anaconda installer, which can automatically partition your\
    \ drive and encrypt it.\n\nOn first boot, Fedora launches a setup guide that lets\
    \ you choose whether to enable location services and error reporting. You can\
    \ also choose to enable third-party repos to install proprietary software such\
    \ as drivers, as well as an unfiltered view of apps on FlatHub. Finally, you’re\
    \ asked to set a username and password. This done, you’ll find an impressive overhaul\
    \ of the interface thanks to Gnome 44. The cloudy default wallpaper may not be\
    \ to everyone’s taste but there’s a number of alternatives in Gnome’s settings.\n\
    \nWhile we’re on the subject, the new Gnome lock screen displays a blurred version\
    \ of the desktop in the background. The Quick Settings menu has also been overhauled,\
    \ now showing both the name of a setting with its status below, such as ‘Power\
    \ Mode – Balanced’. You can also view and close background apps here.\n\nAlthough\
    \ the Quick Settings menu has previously displayed Bluetooth, you can now more\
    \ easily disconnect and reconnect to previously paired devices. The file manager\
    \ now also supports icon view and previewing of image files. You can also navigate\
    \ folders more easily via the list view. (You need to enable this in the file\
    \ manager Preferences if you want to use this feature.)\n\nFedora 38 uses version\
    \ 6.2 of the Linux kernel, which has hugely improved hardware support and bug\
    \ fixes. Pre-installed apps include the latest versions of Firefox, LibreOffice\
    \ and RhythmBox. You can install more via Gnome Software. You may want to look\
    \ into this on first install as Fedora still has no bundled email client.\n\n\
    The lightweight microdnf package manager has also now been replaced with dnf5,\
    \ which has a radically smaller memory footprint. You can also still disable individual\
    \ software repositories via Gnome’s settings.\n\nFedora 38 has stricter rules\
    \ about how long running services can block shutdown. In theory this should help\
    \ devices running it to power off faster and efficiently.\n\nThe Fedora Project\
    \ states the four main foundations of what it does as ‘Freedom, Friends, Features\
    \ and First’. It’s precisely its friendship and sponsorship with Red Hat that\
    \ allows it to include the latest innovations in its OS, with amazing features\
    \ such as those in the new Gnome 44 desktop. We’re also pleased to see its devotion\
    \ to freedom in software now extends to giving users the choice of whether to\
    \ use third-party repos and programs instead of filtering content for them.\n\n\
    +   **VERDICT**\n+   DEVELOPER: Fedora Project\n+   WEB: https://fedoraproject.org\n\
    +   LICENCE: GPL\n+   \n+   FEATURES 10/10\n+   PERFORMANCE 9/10\n+   EASE OF\
    \ USE 9/10\n+   DOCUMENTATION 9/10\n+   \n+   Fedora has outdone itself again\
    \ with a smooth setup and innovative features, not to mention all the available\
    \ spins.\n+   \n+   » Rating 9/10"
  merge: -1
  img_proc: true
