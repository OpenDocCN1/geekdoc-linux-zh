  md: '# **LINUX FORMAT**


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_0.png)


    Corporate Patron

    John-Johnsmine Foundation




    # » MEET THE TEAM


    We''re running our own home AIs this issue, so what''s the one job you''d like
    AI to take off your hands? And it can''t be dealing with grumpy editors…


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_1.png)


    **Nate Drake**

    I’d love AI to handle my laundry. It could navigate the linen labyrinth, decode
    cryptic care labels, and magically fold everything. Plus, I wouldn’t mind if my
    socks disappear – it’d probably just be having its own robot dance party, so long
    as it returns them to the drawer after.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_2.png)


    **Les Pounder**

    After a recent water leak at home, I’d love an AI home network that could monitor
    all the areas of my house and give me an alert before I hear the rush of water.
    The sensors are there, all I need to do is train the AI to be a plumber.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_3.png)


    **Mayank Sharma**

    Since it’s tax season for me, I’d give anything for AI to prepare and file taxes.
    In fact, an AI that can respond to notices and do all the paperwork to satisfy
    the desk jockeys at government offices would be worth its weight in gold, in any
    part of the world.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_4.png)


    **Michael Reed**

    I’m looking forward to better photo search tools for use AI. It would be nice
    if I could search for something like ''beach sunset autumn''. In fact, all desktop
    search could be enhanced with tech like that. Imagine if I could search for ''bands
    that sound like The Cure''…


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_5.png)


    **Nick Peers**

    The only productive use for AI I can think of is intelligent upscaling of all
    my standard-definition media to HD, particularly shows that will never get a remaster,
    such as *Star Trek: Deep Space Nine* and *Voyager*. If it could take on the washing-up,
    too, that would be great.


    # Machines learning


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_6.png)


    The Management demanded an AI cover and here we are. It''s highly likely a machine
    told them it was a good idea and, to be fair, it is a hot topic right now. Linux
    Format has looked at machine learning multiple times in the past, but the latest
    leap forward with ChatGTP 3 in 2022 and more recently v4 has really fired up imaginations
    – largely with regard to how corporations can improve profits by making swathes
    of humans unemployed. From dreamy support chat to medical advice, legal challenges
    and automated news writing to code, art, music and video creation, there''s currently
    a lot of eyes and puny human minds figuring out just how to take advantage of
    this new technology avenue.


    Of course, this all runs on top of Linux as it''s designed to be rolled out on
    the server farms of Google, Amazon et al, but this means that with a bit (250GB)
    of download, you can play around with your own TUX 9000 chatbot, auto translator
    and robot artist at home. Let''s just not think too long about the ethics of that
    training data…


    But good old human creativity is still here, so we also look at composing your
    own music, rescuing those old analogue photos and perhaps writing your own adventure
    code, plus essentials such as backing up and testing new desktops, so ensure you
    enjoy it while you can!


    *Neil*

    **Neil Mohr Editor**

    neil.mohr@futurerem.com


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_2_7.png)


    **Subscribe & save!**

    On digital and print:

    see page 16'
