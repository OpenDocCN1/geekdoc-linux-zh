    # AI see you...


    Enable an AI to say what it sees.


    Image classification is difficult not so much because of the algorithm, but because
    of the need of a dedicated training set. Many if not most academic papers use
    packages such as the CIFAR image set found at **www.cs.toronto.edu/~kriz/cifar.html**
    – it takes one look at its contents (*as seen in the image on the right*), to
    appreciate that the number of detection categories in this data set is highly
    limited.


    +   * airplane

    +   * automobile

    +   * bird

    +   * cat

    +   * deer

    +   * dog

    +   * frog

    +   * horse


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_35_0.png)


    involves downloading the actual library:

    **(airtranslator)** ~/airtranslatespace$ pip install transformers


    # Face huggers...


    If we’d written this six months ago, the next step would involve parametrising
    a specific model. Fortunately, advances in AI tech have led to the rise of the
    Hugging Face company. One of its most interesting products is shown below. For
    reasons of posterity, we will reuse the virtual environment created before. The
    next step


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_35_1.png)


    After that, create a new worker file. Actually creating a pipeline is then accomplished
    like so: **from transformers import pipeline**

    **clf = pipeline("image-classification")**


    The simplest way to instantiate the pipeline involves passing in a string describing
    the task to be handled – in this case, the Hugging Face library takes care of
    selecting a model. The product also provides a wide variety of additional options,
    some of which we’ll discuss further. Alternatively, see the documentation at **https://bit.ly/LXF304huggingface**.


    In the next step, we can perform a first classification experiment. Given that
    Hugging Face wants to make access to its ecosystem as simple as possible, an https-
    accessible URL can be passed in as a parameter:

    **from transformers import pipeline**

    **clf = pipeline("image-classification")**

    **result = clf("https://huggingface.co/datasets/Narsil/image_dunny/raw/main/parrots.png")**

    **print(result)**


    When running for the first time (or with a new model parameter), the library downloads
    model data from the Hugging Face server before starting the actual inference process.


    This should be kept in mind, as it adds a potential single point of failure –
    should that monitor repository be off-line for any purpose, obviously inference
    cannot take place. Furthermore, the warning ‘No model was supplied, defaulted
    to google/vit-base-patch16-224 and revision 5ca965d (https://huggingface.co/ google/vit-base-patch16-224)’
    is also important – in production, make sure to specify exactly which model will
    be used. Otherwise, results can change at random, leading to unpredictable behaviour
    of the AI system.


    # COMPUTER VISION - LOCALLY


    Debatying whether the task of image classification is computer vision or artificial
    intelligence is a good way to keep a cigar lounge full of engineers busy. Given
    that this magazine is printed on non-smokable paper, we’ll agree to disagree and
    consider image classification as part of the task at hand.


    Various vendors such as Microsoft Azure make significant profits by offering computer-vision
    and image-classification services. While using them is appealing, as the models
    provided are extremely high quality, in practice, drawbacks also have to be considered.


    First, image data is larger even when compressed to JPG or similar format. Transferring
    images to the server (maybe even abroad) adds additional latency to the system.
    Furthermore, in the case of safety- critical systems, disconnecting the internet
    connection is enough to make the AI part of the defence system non-workable.


    Finally, purchasing cloud services incurs significant costs – while playing around
    with the actual cognitive services is not particularly expensive, in the longer
    run, compute costs do add up. In addition to that, vendor lock-in makes you dependent
    on the (often finicky) mode de jour of your provider.


    Fortunately, machine vision is one of the oldest areas of Python AI and was interesting
    long before the ChatGPT or Co firestorm hit the tech industry. Due to that, developers
    have the choice of a wide variety of options, one of which we are using in this
    project.


    # Graphical acceleration


    Hugging Face is interested in maximising the reach of its product. Due to that,
    a pipeline usually defaults to the general-purpose CPU of the host workstation.
