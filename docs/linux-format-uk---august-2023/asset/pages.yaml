    # ### All aboard the memory bus


    This means you can''t ever upgrade the memory on an Apple Silicon computer, which
    can lead to some agonising decisions when it comes to choosing a


    # >> GONE BUT NOT FORGOTTEN


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_0.png)


    # #### MOS 6502


    Founded in 1974 by former Motorola employees, MOS Technology set out to create
    a new processor architecture that would out-compete Motorola''s chips for a much
    lower price. With its focus on value, the 6502 became one of the most popular
    processors of the early home computing revolution.


    Used in: Apple II (1977), Atari 2600 (1977), BBC Micro (1981), Commodore 64 (1982),
    Nintendo Entertainment System (1983)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_1.png)


    # #### Zilog Z80


    Similar to the MOS 6502, the Z80 was created in the mid-''70s by a breakaway group
    of chip designers - in this case, former Intel engineers. Although it could run
    programs written for the Intel 8080, the Z80 added many enhancements that made
    it more powerful and easier to program, making it attractive for personal computers
    and video games.


    Used in: Sinclair ZX Spectrum (1982), Amstrad CPC (1984), Amstrad PCW (1985),
    Sega Master System (1985)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_2.png)


    # #### Motorola 68000


    With Intel''s barnstorming 8086 CPU powering the IBM PC, rival Motorola knew it
    had to aim high to compete. It set out to create the most powerful processor on
    the market, creating a new 16-bit chip with cutting-edge 32-bit features. The
    68000 was initially used in high-end workstations, but, as costs fell, it became
    the foundation of a new generation of home computers.


    Used in: Apple Macintosh (1984), Commodore Amiga (1985), Atari ST (1985)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_3.png)


    # #### PowerPC


    Jointly designed in 1992 by Apple, IBM and Motorola, the PowerPC architecture
    was supposed to usher in a new era of RISC computing. Apple moved its whole Mac
    platform from Motorola chips to the PowerPC architecture, and the architecture
    was adopted by several games consoles. In the end, the PowerPC architecture couldn''t
    keep up with Intel''s performance, but it''s still used for some roles, under
    the new name of Power ISA.


    Used in: Apple PowerMac (from 1992), Nintendo GameCube (2001), Microsoft XBox
    360 (2005), Sony PlayStation 3 (2006), Mars Rover Curiosity (2011)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_4.png)


    # #### IA-64


    Created by Intel and HP in 2001, IA-64 was a 64-bit RISC platform designed to
    provide enterprise-class performance and scalability. Between 2001 and 2017, Intel
    launched 10 generations of Itanium processors based on IA-64, but system builders
    favoured the backwards-compatible x86-64 extensions innovated by AMD, and the
    Itanium line is now discontinued.


    Used in: Dell Precision Workstation 730 (2001), HP ZX6000 workstations (from 2001),
    HPE Integrity servers (from 2001)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_81_5.png)'
