    \ this involves passing in a device string, such as the following:\n\n```\n```python\n\
    clf = pipeline(\"image-classification\", device = \"cuda:0\")\n```\n```\n\nOn\
    \ our workstation, the single GPU is docked in position zero – this can be checked\
    \ by using `Nvidia-smi`.\nAfter that, the new pipeline object can be used just\
    \ as its CPU-based brother – just be aware that it is also subject to the sometimes\
    \ finicky behaviour of the CUDA graphical acceleration stack.\n\n# Local processing\n\
    \nHaving successfully worked with a sample image provided by Hugging Face, we\
    \ shall now switch to analysing local pictures. In particular, the following steps\
    \ use a series of images that were created while reporting on an engineering fair\
    \ for the German engineering portal Mikromcontroller.net.\n\nIn particular, the\
    \ 20 JPEG files were placed in the subfolder `images-infer`. In the next step,\
    \ the following changes were required to the Python worker file:\n\n```\n```python\n\
    from transformers import pipeline\nclf = pipeline(\"image-classification\", device\
    \ = \"cuda:0\")\nfor x in range(1,20):\n    result = clf(\"images-infer/\" + str(x)\
    \ + \".jpg\")\n    print (result)\n```\n```\n\nWhen processing images, a Hugging\
    \ Face pipeline accepts three different payloads: in addition to the http or https\
    \ URL seen above, the system also accepts local file paths or PIL library objects.\
    \ However, only one type of request format may be used in every invocation – it\
    \ is not possible to invoke the processing method and pass in, for example, a\
    \ local and a network-based URL.\nGiven that our files already exist on the hard\
    \ disk, it makes no sense to load them into the PIL library first – if you want\
    \ to perform processing before the actual inference, the situation, of course,\
    \ looks different. Be that as it may, the code is actually pretty simple. The\
    \ `for` loop iterates over all valid filenames, which are then passed into the\
    \ pipeline one by one. Their results are then exhaled into the command line.\n\
    Running the program in its current configuration yields working results. However,\
    \ a warning similar to `home/tamhahn/.local/lib/python3.10/site-packages/transformers/pipelines/base.py:1080:\
    \ UserWarning:` will be emitted – the Hugging Face library would prefer a list,\
    \ a vector, containing all the objects to evaluate, because this reduces the amount\
    \ of change over time required for loading model data from the CPU’s to the GPU’s\
    \ memory.\nFortunately, solving the problem and making the warning disappear can\
    \ easily be accomplished by changing the program so that it populates a list with\
    \ all potential filenames. These can then be passed to the pipeline, with the\
    \ results once again being redirected to the command line:\n\n```\n```python\n\
    aList = []\nfor x in range(1,20):\n    aList.append(\"images-infer/\" + str(x)\
    \ + \".jpg\")\nresult = clf(aList)\nprint (result)\n```\n```\n\nInterestingly,\
    \ we were not able to see a performance improvement from the list version – measuring\
    \ the execution time with the admittedly unscientific time command yielded similar\
    \ runtimes for both versions.\n\n# Transformer library\n\nExperimenting with the\
    \ pipeline object adds a significant amount of flexibility. Not only can the actual\
    \ image detection module easily be substituted for another one from the model\
    \ zoo, but the library also permits you to change the behaviour of the inference\
    \ solution.\nAs an example of that, let us switch operation mode. The new task\
    \ of the program no longer involves categorising the contents of the image – we\
    \ now, instead, want to detect which parts of the image are populated by an object.\n\
    For this, we will use a neural network provided by Facebook – it is considered\
    \ a good performer for getting started. Integrating it into the existing work\
    \ file just requires a modification of the pipeline declaration.\nThe rest of\
    \ the code – this explicitly includes the generation of the list and the invocation\
    \ of the pipeline – can be reused in an unmodified state:\n\n```\n```python\n\
    from transformers import pipeline\nclf = pipeline(model=\"facebook/detr-resnet-50\"\
    , device = \"cuda:0\")\naList = []\n```\n```\n\nRunning this version of the program\
    \ yields an error similar to the following on the first invocation: `DetrConvEncoder\
    \ requires the timm library but it was not found in your environment. You can\
    \ install it with pip install timm.` Please note that you may need to restart\
    \ your runtime after installation.\nThis is caused by the fact of the library\
    \ being unable to completely isolate your code from the demands of the models\
    \ used – during the first invocation of a new model, it is downloaded and a check\
    \ for dependencies is done. Fortunately, solving this problem is as easy as entering\
    \ the command `pip install timm`.\n\n# Comparison of results\n\nPerforming a batch\
    \ invoke of the pipeline might remove the error message, but makes the command-line\
    \ output more populated. Due to that, modify the work loop as the following to\
    \ create a more attractive and more easily visually distinguishable output:\n\n\
    ```\n```python\nfor x in range(1,20):\n    print(\"------\")\n    result = clf(\"\
    images-infer/\" + str(x) + \".jpg\")\n    print (result)\n```\n```\n\nNow both\
    \ the models can be run. Given that the images used for this process were highly\
    \ specific, a generic image-detection module is unlikely to reach good results\
    \ without additional training. Nevertheless, the results do look quite promising.\n\
    \nImage detection, without cloud functionality!\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_36_1.png)"
