  md: '# TUTORIALS Classic language


    # PL/I


    Credit: www.iron-spring.com


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_59_0.png)


    # PL/I – the multi-faceted language


    **Mike Bedford** discovers the mysteries of PL/I, the language that IBM hoped
    would replace both FORTRAN and COBOL.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_59_1.png)


    The names of programming languages vary from the banal to the accurately descriptive,
    via the totally meaningless or, in the case of this month’s subject, the downright
    inaccurate. The language in question is PL/I. The letter I is the Roman numeral
    for the figure one, which explains why it’s occasionally, incorrectly, shown as
    PL1. It stands for Programming Language One, but it certainly wasn’t. In fact,
    two of the languages we’ve previously covered in this series predate it, as do
    several others.


    To make it into our list of classic languages, a language has to have been around
    for a while, to put it politely, and PL/I certainly ticks that box, having been
    launched in 1964. It was designed by IBM for use on its System/360 mainframes,
    and was first used at its Hursley Laboratories in the UK as part of the 360 development
    programme.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_59_2.png)


    Multiple iterations, even of simple programs, are to be expected with a new language.
    But at least you won’t be using up whole forests in fan-fold listings, as early
    PL/I programmers would have done.


    To set the scene, let’s consider the main languages that had previously been promoted
    by IBM in the early ’60s. FORTRAN was used for scientific applications, and COBOL
    was used for business applications. While so much more basic, FORTRAN offered
    the same types of instructions provided by today’s common languages, but COBOL
    was very different. Because of its emphasis on data handling for commercial jobs,
    it became the first language to allow hierarchical data


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_59_3.png)


    ```

    [Code snippet starting with ''DCLARAT...'']

    ```


    structures to be defined and subsequently manipulated. The aim of PL/I was to
    merge the features of these two languages and thereby provide a solution that
    would address the needs of both scientific or technical users and business users.


    But it went further. While virtually all the earlier languages had little in the
    way of features to support block-structured programming, ALGOL, our featured language
    in LXF302, and which appeared in 1960, did adhere to this important programming
    paradigm, so paved the way to nearly all today’s popular languages. ALGOL was
    never really promoted by IBM to any great extent but, even so, its block-structured
    approach also influenced the design of PL/I. We could almost think of PL/I, therefore,
    as a direct descendant of FORTRAN, COBOL and ALGOL, even though it didn’t have
    a great deal of success in replacing any of these languages.


    # Do it yourself


    You’ll probably want to try your hand at churning out and running some PL/I code,
    but the options aren’t as plentiful as they were for our previous classic languages.
    We couldn’t find any online resources for running PL/I, so we’re stuck with compilers.
    Sadly, what


    A PL/I syntax highlighting add-on is available for the Vi text editor – especially
    useful with an unfamiliar language.'
