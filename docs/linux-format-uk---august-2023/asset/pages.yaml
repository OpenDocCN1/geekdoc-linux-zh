    specifically a mixture of the variables C and F plus a couple of text strings.
    And the code in the second set of parentheses defines the display format so, for
    example, F(4,1) defines that the number should be a four-character floating point
    number (that number including the decimal point), of which one of the digits is
    after the decimal point.


    # Replacing COBOL


    Next up we''ll delve into a program that performs some simple file handling and
    data manipulation, which is typical of a COBOL application and appears below:


    ```

    DATABLK:

    PROCEDURE OPTIONS (MAIN);

    DCL INFILE FILE RECORD ENV (''F RECSIZE (28 TEXT)'');

    DCL OUTFILE FILE RECORD ENV (''F RECSIZE (28 TEXT)'');

    DCL 1 DATA_READ,

    2 NAME,

    3 FIRST CHARACTER (10),

    3 SECOND CHARACTER (10),

    3 START_DATE,

    3 DAY PICTURE ''99'',

    3 MONTH PICTURE ''99'',

    3 YEAR PICTURE ''9999'',

    2 EOF FIXED (1);

    DCL EOF FIXED (1);

    OPEN FILE (INFILE) INPUT TITLE (''employees.dat'');

    OPEN FILE (OUTFILE) OUTPUT TITLE (''recent-employees.dat'');

    EOF = 0;

    DO ENDFILE (INFILE) EOF = 1;

    DO WHILE (EOF = 0);

    READ FILE (INFILE) INTO (DATA_READ);

    IF YEAR > 2020 THEN DO;

    /* PUT SKIP EDIT (NAME) (A); */

    PUT SKIP EDIT (FIRST; SECOND) (2A);

    WRITE FILE (OUTFILE) FROM (DATA_READ);

    END;

    END;

    ```


    ```

    END;

    CLOSE FILE (INFILE);

    CLOSE FILE (OUTFILE);

    END DATABLK;

    ```


    The purpose of this code is to read records from a file containing data relating
    to a company''s employees, and write the same details to another file for those
    members of staff who started their employment after 31st December 2020, while
    also listing the names of those same employees to the console. The data as read
    from the file is structured hierarchically, with the complete record (RECORD_READ)
    being defined in the line starting DCL. DCL is short for DECLARE, and you can
    use DECLARE in full if you prefer, and the screenshot (page 60) shows that RECORD_READ
    is a first-level variable. RECORD_READ is split into two second-level variables,
    NAME and START_DATE; NAME is divided into two third-level variables, FIRST and
    SECOND; and START_DATE is also divided into third-level variables, named DAY,
    MONTH and YEAR. Of course, had this been a real-world application, the record
    would have included much more information about the employee, but we''ve omitted
    that so as not to waste space with code we''re not going to use. Nevertheless,
    this is enough to illustrate an important PL/I concept, which it had inherited
    from COBOL, namely its support for hierarchical data structures.

    This hierarchical approach allows variables at any level to be manipulated. So,
    for example, the whole of the record (RECORD_READ), which is at level one, is
    read from and written to file in single-instructions, a selection is made based
    on the third-level variable YEAR, and names are written to the console using the
    third-level variables FIRST and SECOND. Actually, since it''s strictly correct,
    it should have been possible to write the statement that refers to FIRST and SECOND
    to refer, instead, to the single second-level variable NAME, as shown in the statement
    that is commented out, by being enclosed in a /*--*/.

    However, this didn''t work, and it was confirmed by Iron Spring as a glitch in
    the compiler which will be fixed in the next release, hopefully by the time you
    read this.

    Having explained the concept of hierarchical data structures, while the syntax
    will probably be different from that of any other languages you might be familiar
    with, we suspect that you''ll have little difficulty figuring out how it works,
    so we''ll pass little comment on it. And we will gloss over the statements that
    start with DCL INFILE and DCL OUTFILE - after all, it''s not our intention here
    to turn you into a fully-fledged PL/I programmer. A comment on the ON ENDFILE
    statement is appropriate, though. You can probably guess what it does but, regretfully,
    "PL/I was the first programming language that provides correct handling of such
    a common problem as detection of the end of the sequential file while reading."

    To use this code, you need to create an ASCII file called employees.dat. This
    should be a 28-character fixed length file, and each item of data in the file
    should have a fixed length, as defined in the PL/I code. So, the first and second
    names should have trailing spaces to make them up to the required 10 characters,
    and any single-digit days or months should have a leading zero. You could create
    a different file, although it should still be called employees.dat, but the following
    is our test


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_61_1.png)


    It''s notable that some versions of PL/I featured recursion, but not all later
    versions. Given that each time a recursive function was called, the values of
    all its local variables were placed on the stack, this would rapidly eat up a
    valuable commodity in those early days: memory.


    62 |LINUXFORU| August 2023


    www.linuxforuformat.com'
