    Apple, by contrast, offers only four chip designations per M range: ie the M1,
    M1 Pro, M1 Max and M1 Ultra. It''s a much simpler line-up than Intel''s,


    # Who makes what?


    Aside from the architectures, another notable difference between the two major
    computing architectures is that, unlike Intel, Arm doesn''t make


    # HIGH-PERFORMANCE COMPUTING


    We hardly have to feel bad for Arm, it''s not like it doesn''t own the entire
    mobile phone and tablet space. In fact, if things weren''t already looking a bit
    grim for Intel on the desktop and laptop front, consider that its cash cow of
    the server market is now under attack by not just a revitalised AMD but by Arm
    as well. For decades, server farms have grappled with the issue that cooling costs
    more than running the damn servers – two to one back in the day, even now one
    to one costs are a mark of a good cooling design. So, if someone appears, offering
    a way of


    reducing the power consumption of your servers, you''re going to pay attention.
    That''s exactly what Arm has been busy doing.


    You might have heard of Amazon and its Amazon Web Services that run half the web.
    With so much bare metal to pay for, anything that saves energy benefits Amazon.
    So, it designed its own server processor core called Graviton, and in May 2022
    it released Graviton3. It''s a 64-core ARMv8.4 SoC with 64MB of L3 cache, running
    at 2.6GHz with 8-channel DDR5 memory and PCIe 5 on the 5nm TSMC process. Serious
    stuff.


    Estimates put power use at 100W versus 300W for a similarly pegged Xeon.


    If that wasn''t enough, the all-new Japanese Fugaku system has taken the top spot
    for supercomputing power, besting the PowerPC/Tesla-powered Summit system by 2.8x
    with a whopping 415.5 petaflops, using Fujitsu''s 48-core A64FX Arm-based SoC.
    But can it play Crysis? The Met Office is also planning to go Arm with a supercomputer
    offering 145 petaflops that should claim the number three spot – enough to predict
    the weather before it happens!


