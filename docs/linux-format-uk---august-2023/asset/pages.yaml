  md: "![](img/5cfcf2f4448dccdd1c5c2a2851544557_38_0.png)\n\n(aitranslator) ~/aitranslatespace/llama.cpp$\
    \ ./examples/chat.sh\n\nAfter running the program, llama.cpp presents a window\
    \ inhabited by a friendly virtual assistant named Bob. As shown (below), Bob does\
    \ not shy away from spicy conversations.\n\nInterestingly, the code behind it\
    \ is based on a shell script. It mainly consists of the invocation of the program,\
    \ and looks like this:\n\n```\n```bash\n#!/bin/bash\n# Temporary script - will\
    \ be removed in the future\ncd dirname $0\ncd ..\n# Important:\n# 'keep 48' is\
    \ based on the contents of prompts/chat-with-bob.txt\n#\n/main -m models/7B/ggml-model-q4_0.bin\
    \ -c 512-b 1024-n 256 -keep 48 \\\n  -repeat_penalty 1.0 -color -i \\\n  -r \"\
    User: \" -f prompts/chat-with-bob.txt\n```\n```\n\nAs in the case of many other\
    \ AI systems, the main intelligence sits in the prompt file. A careful look at\
    \ the prompt shows that the AI system is also provided with a bit of sample interaction\
    \ to prime the algorithm. Furthermore, the -r parameter sets the system into the\
    \ PROMPT mode - it yields to the interactive communication behaviour shown instead\
    \ of the more usual linear generation of responses. Finally, the -n option decides\
    \ how 'complex' the interaction should be.\n\n# Interaction from Python\n\nGetting\
    \ the parameters right on the command-line can be daunting enough; integrating\
    \ a command-line tool into a programmatically invoked service becomes a new challenge\
    \ of its own. A Python API is easier to handle, and is available via the repository\
    \ found at https://github.com/abetlen/llama-cpp-python. A sample interaction,\
    \ then, plays out according to the\n\n```\n```python\n>> from llama_cpp import\
    \ Llama\n>> llm = Llama(model_path='models/7B/ggml-model.bin')\n>> output = llm('Q:\
    \ Name the planets in the solar system? A:', max_tokens=32, stop=['Q', '\\n'],\
    \ echo=True)\n>> print(output)\n```\n```\n\nIn addition, llama-cpp can be used\
    \ as a replacement for the (paid) OpenAI service. This is provided via another\
    \ Python package, installed using Pip 3: (aitranslator) ~/aitranslatespace/llama.cpp$\
    \ pip3 install llama-cpp-python. Be aware that the boxy brackets are part of the\
    \ invocation and not a printing mistake. Startup is then achieved as follows:\
    \ `$ python3-m llama_cpp.server --model models/7B/ggml-modelbin`. Sadly, in some\
    \ cases, an error along the lines of 'AttributeError: llama object has no attribute\
    \ ctx' is thrown out. In this case, filing a GitHub issue is the best approach\
    \ - the issue can be caused by multiple different problem sources.\n\n![](img/5cfcf2f4448dccdd1c5c2a2851544557_38_1.png)\n\
    \nLLMA.cpp's Bob is full of (dubious) helpful advice.\n\n# CHATBOT IN THE HOUSE!\n\
    \nBy far the largest AI task, and the one causing the most AI angst, takes the\
    \ form of chatbots - a system backed up by a knowledge database that uses the\
    \ information to 'hold a conversation' or solve business and personal problems.\n\
    \nGiven that most attention is on this type of system, it is only fitting that\
    \ we will select one of these as our final exercise. Be aware that conversational\
    \ AI systems have immense CPU and GPU demands, and also put significant tax on\
    \ the workstation's remnant memory. Performing the steps here required more than\
    \ 250GB of SSD-backed storage; the resulting system uses the smallest possible\
    \ model and is not able to fully compete with ChatGPT and the like.\n\nOn the\
    \ other hand, the model files used here can be replaced with even larger examples.\
    \ Furthermore, being able to run the entire inference pipeline locally means that\
    \ the system can be integrated into other systems with ease - so, almost limitless\
    \ possibilities await.\n\nBe aware, however, that the steps outlined here are\
    \ legal only for non-commercial use. The LLAMA model - Large Language Model Meta\
    \ AI - is owned by Meta, and is licensed only for academic use. Of course, it\
    \ is possible that this will change in the future - in that case, switching to\
    \ different model files is not particularly difficult."
