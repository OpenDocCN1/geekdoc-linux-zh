  md: '# Natural language translation


    Modern smart machines can perform live translation.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_33_0.png)


    In this section, the translation environment will be run in its native form. LibreTranslate
    also provides a Docker container under https://registry.hub.docker.com/r/libretranslate/libretranslate.
    Its use, however, is not necessarily recommended—keep in mind that exposing CUDA
    acceleration to Docker, as outlined at https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html,
    is an involved and finicky process. Deployment of the underlying library can be
    handled via *Pip*, because the product is considered stable enough by the Python
    community.


    For reasons of comfort, we first create a *virtual environment* (the current environment
    is in parentheses) by entering the following commands:


    ```

    ```

    (base)~$ conda create -n aitranslator

    (base)~$ conda activate aitranslator

    (aitranslator)~$

    ```

    ```


    The actual download is then accomplished via *Pip 3*:


    ```

    ```

    (aitranslator)~$ pip3 install argostranslate

    ```

    ```


    Given that our virtual environment is completely virginal, about 2GB worth of
    libraries will be downloaded, so make sure you have a high-speed internet connection.
    Successful installation is achieved when the *Pip 3* package messenger emits the
    version information ‘*Successfully installed argostranslate-1.8.0*’—your version
    might be a bit different, because the contents of the *Pip* repositories might
    have been updated between the time this article was written and when you read
    it.


    Keep in mind that installing *Argos* inside a virtual environment is not always
    the best method—if you want to use command-line utilities such as *Argossum*,
    a global installation from the workstation might be more sensible. For our evaluation,
    however, a virtual environment makes cleaning up the installation easier.


    A side effect of this is that the library and language packages must be deployed
    independently of one another. If you do a purely programmatic installation, the
    deployment of the library packages has to be accomplished via Python code. So,
    create a new work file and open it in the development environment of your choice.
    Next, start out by importing the required packages and declaring the target language
    codes:


    ```

    ```

    import argostranslate.package

    import argostranslate.translate

    from code = "en"

    to_code = "de"

    ```

    ```


    The actual download process is then accomplished by the following snippet:


    ```

    ```

    argost_translate.package.update_package_index()

    available_packages = argost_translate.package.get_available_packages()

    package_to_install = next(

    filter(

    lambda x: from.next == from_code and x.to_code == to_code, available_packages

    )

    )


    argost_translate.package.install_from_path(package_to_install.download())

    print("Package installed!")

    ```

    ```


    Firstly, *update_package_index()* is invoked in order to motivate *Argos Translate*
    to update its internal package cache. After that, *get_available_packages()* returns
    a list of all the package and language combinations known to the current installation.
    The actual installation process then requires the presence of…


    ```

    ```

    (aitranslator) c:\hanging\tmp...:\> git clone --depth=1 -b... pytho aitranslate2.py

    Hello, Welt

    ```

    ```


    As verified by a German speaker, this translation is 100% correct.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_33_1.png)


    # Arming the system


    In an old adage claims that the quality of an AI model is limited by the quality
    of its input data. Furthermore, the data model and the actual code required for
    running it can and should often be updated independently. As of this writing,
    the *Argos Translate* project supports more than a dozen language combinations.'
