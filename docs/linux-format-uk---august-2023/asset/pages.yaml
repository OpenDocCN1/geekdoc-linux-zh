  img_proc: true
- pgno: 66
  md: '![](img/5cfcf2f4448dccdd1c5c2a2851544557_66_0.png)


    A better solution is to open your new window manager while you are using your
    current one and enter nesting. You can start the new desktop as an application
    to try it out. This has some drawbacks, but it is great for practice and “ricing”
    attempts.


    # ### VM vs Xephyr


    You can do this using a virtual machine, but it causes a lot of load and takes
    up disk space in spades. Docker is another solution, which is faster than virtual
    machines but less direct than nesting. Both of these options build many more binaries
    to achieve a new environment.


    For X11, you need a new server to run on top of the current one. What happens
    on a regular desktop is that you start one X server, which has DISPLAY number
    0. To nest, you need a new server that can run on its own and catch another DISPLAY.
    You have a bunch of options for this, Xephyr being an excellent choice.


    Xephyr creates a new DISPLAY variable and acts as if this is a new desktop in
    most respects. You can use it to start new apps and see how the new environment
    works. There are a few caveats, one being that your Super key is already busy,
    so you must use an alternative while testing. Many things will be different once
    you switch over, so be aware of what your current window manager starts. You may
    be surprised at how many things GNOME handles on your system.


    For Wayland, it is even easier – it nests on its own when you start a window manager.


    # #### Window managers


    Before you start, you have to read up on a few window managers, choose one and
    install it. In this example, you are installing the Awesome window manager. It
    is a tiling window manager and has plenty of themes available on GitHub and theming
    sites. You can choose any that exist for Xorg, because KhipxYr acts as a new Xorg
    server. For Ubuntu and Debian, Awesome is available as an APT package.


    ```

    $ sudo apt install awesome

    ```


    You should always be in your favourite repository; if it isn’t, you can find it
    at [https://awesomewm.org/](https://awesomewm.org/). Getting the compiler to work
    is a little complicated due to the Lua integration method used. For non-developers,
    it’s best to use the packages.


    Installing Sway is even simpler with your standard package manager. Again, if
    you want the newest or contribute code, you can find it at [https://github.com/](https://github.com/)
    [swaywm/sway/releases](https://github.com/swaywm/sway/releases).


    ```

    $ sudo apt install sway

    ```


    You may also want to install **swaylock**, **swaylock** and **waybar**. These
    packages are necessary once you need a desktop switch, but you have lots of options.
    You can find a list here: [https://github.com/swaywm/sway/w/wiki/Useful-add-ons-for-sway](https://github.com/swaywm/sway/wiki/Useful-add-ons-for-sway).


    You have many other window managers to choose from. Some are designed to look
    flashy; others to be simple and fit for a specific purpose. Testing them all requires
    hours of time and scripty skills, but you can find documentation and community
    help. Search for BSPWM, Qtile and Cinnamon to start exploring.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_66_1.png)


    > **Using Xephyr and Emacs together** gives you a powerful environment to troubleshoot
    your configuration without breaking your current setup.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_66_2.png)


    > Once you have the basic setup, you can continue tweaking inside the Awesome
    environment, still assured by your standard setup.


    # ## » SWAY AND I3 SHARES


    Users of the i3 window manager should be aware that Sway is a clone of the first.
    It shares the configuration files, which is the main design goal of Sway. As you
    switch over from i3 under X, you can use the exact same configuration files. You
    may find some features that are not yet supported in Sway but the majority are
    already there.


    Although not recommended, you can even point your old i3 files for configuration
    and run Sway out of the box. This makes it easy to make a gradual switch. It also
    gives you the opportunity to use old shared configurations for new changes in
    your own setup.


    The configuration is well described in the documentation and split into sections,
    so you can find the info you want. Each component has its own man page. Remember
    that the status and action bars can be from other systems and many desktop functions
    are independent of the window manager. Don’t discard your choice because some
    feature is missing, because it may already exist on a general level.


    The Sway bar (**swaybar**) is the default bar but you can pick others. One version
    is **somebar**, which has many other features, including clickable areas. With
    **swaynag**, you can have pop-ups on the desktop, with actions you can choose
    from by clicking.


    This is a powerful way to handle system events and possibly email. It’s all up
    to your imagination and efforts.'
