  md: '# # Pi Compute Blade


    Les Pounder hasn’t been left on the shelf, but he’s been put on the rack.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_46_0.png)


    +   * **SPECS**

    +   * **Pi:** Compute Module 4/4 Lite

    +   * **Storage:** M.2 NVMe up to 22110, microSD

    +   * **Comms:** Gigabit Ethernet (Wi-Fi on CM4)

    +   * **GPIO:** 2x UART, 6x user GPIO and I2C, fan, user button, 2x RGB LEDs

    +   * **Power:** USB C, Power over Ethernet (PoE)

    +   * **Ports:** HDMI (4K60), USB A Extra: TPM 2.0, hardware switchable Wi-Fi,
    Bluetooth and EEPROM write-protection

    +   * **Size:** 42.5x255x17.5mm


    There is no more IO carrier board. The Compute Blade is designed for rack-mounted
    use, with PoE providing the power and networking for a high-density cluster of
    Pi CM4 boards. The long, slender blade design lends itself beautifully to this,
    and clever component positioning means we have a densely packed board full of
    features.


    Underneath a snazzy red anodised heatsink, we have a connector for any variant
    of Raspberry Pi Compute Module 4. Our test machine was a CM4 with 4GB RAM, 32GB
    of eMMc and built-in Wi-Fi. We followed the excellent documentation to flash Raspberry
    Pi OS using a special tool, rpiboot, to mount the eMMC drive as a USB drive.


    If you plan to use a Compute Module Lite, the onboard microSD card slot can be
    used to boot the OS. The onboard USB A port is not accessible on boot, but that’s
    not the fault of the Compute Blade. Adding an NVMe drive, from 2230 to 22110,
    is easy, thanks to a dedicated area near the rear of the blade.


    You prepare the drive for use from the Linux terminal, including setting the drive
    to mount on boot. If you need to connect your Compute Blade to a screen, the onboard
    HDMI port is located between the heatsink and a Gigabit Ethernet port on the front
    of the Blade.


    That Ethernet port also provides PoE (Power over Ethernet), and using a Netgear
    GS308P, a PoE-capable switch, we were able to power and connect to our network,
    all from one cable. No extra configuration was needed, just plug and play. The
    keen eyed among you will have noticed a DIP switch between HDMI and Ethernet.
    These switches control write protection, Wi-Fi and Bluetooth. Toggling these switches
    enables or disables these features, providing a level of physical security.


    It can’t have escaped your notice that Raspberry Pi Compute Modules are virtually
    unobtainable right now, so can the Compute Blade be used with clone boards? The
    short answer is yes, but the best support comes


    > The naked board laid bare to the world. Look at the ports on that thing!


    from the Raspberry Pi Compute Module 4. YouTuber Jeff Geerling has tested a handful
    of CM4-compatible boards and it seems that Pine64 SOQuartz with Phelbian Linux
    has the best support; but even that is extremely lacking when compared to Raspberry
    Pi.


    While not the Compute Blade’s raison d’être, there is a GPIO we can use. Just
    beneath the NVMe SSD slot is a 2x5 header that breaks out a select few pins, specifically
    for use with an optional RTC module. Thankfully, these pins also include I2C,
    which means we could test a series of I2C-enabled devices using Stemma QT interfaces.
    We chose to test the I2C interface with CircuitPython. We connected a BME688 air
    quality sensor and within a few minutes we had data streaming across the screen.


    Moving to the front of the Blade, we spotted a button with a neat 3D-printed push
    mechanism. This button is connected to the GPIO and fully accessible via your
    favourite programming language. We ran a test using Python and can report that
    it works perfectly. We just have to work out how to do when we press the button.


    The Compute Blade isn’t a typical Compute Module carrier board, rather its purpose
    is to be part of a cluster. A Compute Module 4-powered cluster would provide high-density
    computing power, and the form factor of the Compute Blade means that we can build
    a high-density cluster. Typical applications are edge computing, machine learning,
    AI and ultra-small data centres. Slotting the Blades into a server rack with PoE
    would give a clean and simple install. 17


    ### VERDICT


    **DEVELOPER:** Ubuntu pro

    **WEB:** https://computeblade.com

    **PRICE:** TBC (around £90)


    | | 10/10 | 9/10 | 8/10 | 9/10 |

    |---|---|---|---|---|

    | FEATURES | | | | |

    | PERFORMANCE | | | | |

    | EASE OF USE | | | | |

    | VALUE | | | | |


    Solid hardware in a great form factor that has clearly been designed with a specific
    use case in mind.


    » Rating 9/10'
