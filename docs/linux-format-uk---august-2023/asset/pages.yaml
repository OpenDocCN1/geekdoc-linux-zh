- pgno: 34
  md: 'of a path indicating where the language package is to be downloaded. Extracting
    this from the values is easiest done using a lambda filter; the final result is
    then passed to the method *install_from_path*, which ensures that package download.


    Given that *Argos Translate* creates a local cache on your machine, the package
    downloading program has to be run but once. Thus, the next job involves the creation
    of another worker file, which then acts as a host to the actual translation logic.
    It also starts out by importing packages and declaring target language codes.
    The actual transaction is accomplished like so:


    ```

    ```

    import argostranslate.package

    import argostranslate.translate

    from_code = "en"

    to_code = "de"

    translatedText = argostranslate.translate.translate("Hello World", from_code,
    to_code)

    print(translatedText)```

    ```


    At this point, the program is ready for a test run.


    # Hardware acceleration


    The *Argos develop* team wants to expand the reach of its product as far as possible;
    a side effect of this is that CPU translation is considered a first-class citizen,
    and is supported as far as the (limited) performance of general-purpose CPUs permits.


    This means that CUDA acceleration should be enabled by setting an environment
    variable as per the following command:


    ```

    ```

    (aitranslator)~/aitranslatespace$ export ARGOS_DEVICE_TYPE=cuda```

    ```


    Now a test run can be done comparing the Core i5 CPU and the GPU to one another.


    One common problem with CUDA is the transfer time; moving the model information
    from the system''s main memory into the GPU memory is not free. Thus, especially
    for small jobs, a CPU run can in some cases be more efficient than running the
    system on the GPU.


    # Optimising behaviour


    While the string Hello World makes for a valid greeting, its low girth means that
    the actual impact of the performance of the translation process on the total wall
    clock time taken is limited. Solving this problem is best accomplished by working
    with a text file.


    The next step, therefore, is the following version of the program:


    ```

    ```

    text_file = open("input.txt", "r")

    data = text_file.read()

    translatedText = argostranslate.translate.translate(data, from_code, to_code)

    print(translatedText)

    text_file.close()```

    ```


    Instead of passing the translatable information in as a string, we now obtain
    it from a text file, which the Python interpreter expects in the same folder as
    the script file – or, rather, the current working directory.


    For the following steps, we preloaded the file with a piece of text from a former
    article, and this translation also worked out perfectly.


    Given that the AI task is now more complex, a more meaningful benchmark can be
    performed. The following table compares CUDA and CPU results.


    | CPU | | GPU | |

    |:---:|:---:|:---:|:---:|

    | **real** | 0m4, 355s | **real** | 0m4, 650s |

    | **user** | 0m11, 103s | **user** | 0m4, 051s |

    | **sys** | 0m0, 754s | **sys** | 0m1, 308s |


    Interpreting the results requires familiarity with the time _command – the most
    important value is the user time, which, on a multithreaded system, is the time
    each processor core spends on the tasks individually. You can see that almost
    three times as much computer time is needed to achieve the translation.


    > The resulting German from our test run is almost print quality.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_34_0.png)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_34_1.png)


    # TRANSLATION IN THE MACHINE


    A little-known detail of computer history lore is that one of the original reasons
    for the military-industrial complex''s Cold War financing of computer research
    was its hope to generate machine-translation systems – especially when working
    with foreign adversaries, having access to quality translators can become a hassle.


    While the initial attempts at machine translation were, by and large, relatively
    unsuccessful, the availability of ever higher compute performance has made machine
    translations possible and desirable. In fact, we are aware of one military scientific
    publisher that laid off most of its translators and now does many foreign translations
    using DeepL.


    Sadly, many if not most vendors of machine-translation systems are perfectly aware
    of the value that can be harvested by replacing human translators with machines.
    Thus, their services are priced accordingly. Fortunately, however, open source
    developers have invested significant effort into the creation of an alternative
    translation environment. Specifically, the LibreTranslate system is so polished
    that it provides a ready-to-run Docker environment that even includes a user interface.


    This way, technically challenged office workers can interact with the system by
    opening a web browser and navigating to the provided URL – the actual work environment
    is fully graphically driven. In addition, the ecosystem also provides a wide range
    of SDKs. In short, is our product that AI enthousiasts definitely need to know
    more about.'
