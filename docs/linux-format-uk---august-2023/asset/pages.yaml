  md: '![](img/5cfcf2f4448dccdd1c5c2a2851544557_71_0.png)


    You’ll probably be using the clone tool extensively to hide scratches, creases
    and miscellaneous blemishes.


    the image you want to retain. Now, all you have to do is select Image > Crop To
    Selection.


    Next up we’re going to see how to remove, or at least reduce the visibility of,
    imperfections such as creases, scratches and miscellaneous spots or blotches.
    We suggest you use the Clone tool, which enables you to overwrite an area of the
    image with whatever colours and textures are in a nearby area of the same size.
    Select that tool from Tools > Paint Tools > Clone, hold down the Ctrl key and
    click on the area you want to clone from, then move to the area you want to clone
    to, and either click once or click and move to clone over a larger area. We recommend
    single clicking, at least to start. It’s probably best to use a degree of transparency,
    and perhaps use a brush that doesn’t have a hard edge. You can select these and
    various other tool attributes, including the size of the


    clone area, in the Tools Options dialog, which you have to enable if it’s not
    already visible. In some instances, you might prefer to use the Heal tool, also
    under Tools > Paint Tools, which has a similar function, but we’ll leave you to
    read up on the differences.


    While clone and heal are the best ways of removing defects, if there so many it
    would take you for ever, you might like to experiment with noise Reduction, which
    you can find at Filters > Enhance > Noise Reduction. While this can remove a lot
    of the hard work, especially for small specks, it also makes the whole image appear
    less sharp, so use it sparingly – don’t choose too high a value for Strength in
    the dialog.


    So far we’ve seen how to deal with specific defects that you’ll encounter in old
    photos, but we also need to consider that the image as a whole might have lost
    some of its vibrancy, due to fading or decolourisation.


    In the case of a black-and-white image, you can probably make a significant improvement
    by increasing the contrast, although in the case of a colour photo, we suggest
    you skip to the next paragraph. The simplest way of increasing the contrast is
    found at Colours > Brightness-Contrast – and you’d probably need to adjust the
    brightness, too – but you have more control in the Adjust Colour Curves dialog,
    which you can access from Colours > Curves. The dialog shows how the original
    range of brightness values are mapped on to the edited values, and the initial
    straight diagonal line defines no change. To use this tool, you edit the shape
    of the line by clicking and dragging, and a good first choice is to change the
    straight line to an s-shaped curve, by which we mean the steepness is decreased
    at the lower-left and upper-right ends. Trying it out yourself will quickly show
    you how it works.


    And finally, if you’re working with an old colour image that was scanned from
    a print, you’ll probably find that the colours look faint and unnatural. This
    is because the dyes in the print will have faded over time and, to make matters
    worse, some of the primary coloured dyes will have faded more than others. GIMP
    has an automated tool that can make a huge difference and, depending on the degree
    of fading, might be sufficient in itself. Select Colours > Levels and then, in
    the Adjust Colour Levels dialog, ensure that Preview is checked and click on Auto
    Input Levels. Hopefully you’ll see a significant improvement but, if you want
    to try to make it even better, click on Edit These Settings Using Curves. This
    causes the Adjust Colour Curves dialog to appear, which we investigated in the
    previous paragraph, but now, in addition to the Values curve,


    # » OTHER FILM SCANNING OPTIONS


    If you have a lot of film-based media to scan, a proper solution, such as a scanner
    capable of scanning transparent material, is surely the way to go. However, if
    you only have a few negatives or slides, there is an alternative solution which,
    while certainly not as good as a scanner, might just provide you with acceptable
    image quality. That solution is to photograph the slide or negative, ideally with
    a decent camera or, failing that, using a good quality phone. You need to backlight
    the film with a diffuse white light source – our solution is to use a tablet,
    placed horizontally, displaying just a plain white background. Arrange the slide
    to be held several centimetres from the screen, otherwise you’ll capture the pixel
    matrix of the screen superimposed on your film-based image. Hold the negative
    or slide in a cardboard window to mask out the surrounding area of the screen,
    so the light metering isn’t adversely affected. Ideally, mount your camera or
    phone on a tripod. If you don’t have a tablet, you could use your PC’s monitor,
    but fixing the slide or negative in its cardboard window at a suitable distance
    from the screen would be trickier.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_71_1.png)


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_71_2.png)


    Even by just using GIMP’s automatic colour correction tool, you can make a huge
    difference to badly faded colour photos.'
