  md: '# # CONTROL YOUR A.I.


    AI usually requires server farms of training GPUs, but Tam Hanna''s modest freelance
    budget lets him train his own personal HAL.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_31_0.png)


    **A** I is the talk of the town. Sadly, however, most models require excessive
    amounts of compute power to run locally; even though the collapse in crypto prices
    and the change in Ethereum mining has somewhat reduced pressure from the GPU market,
    having to host and purchase GPUs at a large scale still remains expensive.


    Over this feature, we’ll look at how a modestly specified MSI GF65 with an RTX
    2060 GPU and 6GB of RAM – used to perform an evaluation of various artificial
    intelligence tasks – can be run completely locally. While none of these tests
    will bestow a research prize upon you, they will nevertheless return useful and
    valuable results that have commercial usage value.


    We will look at machine translation, generation of texts and various other applications
    that can be useful in an everyday setting.


    Keep in mind that running AI locally does not necessarily require the use of local
    hardware. Various cloud providers such Azure, AWS and Yandex have long since expanded
    their portfolio to include virtual machines with powerful graphical acceleration.
    Having established a local runtime environment, work can easily be shifted to
    one of these cloud providers if more compute power is needed – this still gives
    you independence from the often fickle cloud providers that, sadly, do happen
    to discontinue services once in a while for all kinds of reasons.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_31_1.png)'
