  md: '# # EuroLinux 9.2


    Nate Drake is on the continent this month, taking a stroll through the natural
    beauty of EuroLinux.


    **IN BRIEF**

    Does the world need another RHEL-based distro? In the case of EuroLinux, the answer
    is a resounding yes. It''s easy to set up, visually stunning and supported through
    to 2032.


    +   **SPECS**

    +   CPU: 1GHz

    +   Mem: 4GB (1.5GB per CPU recommended)

    +   HDD: 10GB (20GB recommended)

    +   Builds: x86_64, AArch64 (ARM64), i686


    EuroLinux belongs to a select group, as it’s one of the six major Linux distros
    developed in Poland.

    It is built upon the foundation of RHEL (Red Hat Enterprise Linux) source code.
    The EuroLinux team claims this guarantees compatibility with RHEL, Oracle Linux,
    CentOS, AlmaLinux and Rocky Linux.

    From reciting this shopping list of distros, it seems the team is aware there’s
    no shortage of options if RHEL-based Linux is your jam. Rocky Linux, for instance,
    is also based on Red Hat and uses the Gnome desktop environment.

    Luckily, EuroLinux has an answer for why the world needs another RHEL-based distro:
    “EuroLinux was developed in response to unsatisfied needs of the market related
    to the quality of technical support, unfavourable licensing, high cost of subscriptions
    and the lack of flexibility of the leading producers of Enterprise Linux distros.”

    Both the server and desktop distros are available free of charge under the GNU
    General Public Licence. This means in theory you’re free to modify and distribute
    it as you wish. EuroLinux makes this especially easy through its EuroLinux Gaia
    tool. However, if you want to use proprietary tools such as Gaia, benefit from
    tech support, or receive installation assistance and intermediate packages, you
    need a paid subscription. EuroLinux offers three tiers of support but when we
    tried to find a pricing page, we were invited to fill in a contact form for a
    quote.

    We focused on the latest free desktop version of EuroLinux (9.2) and came away
    very impressed, even without the benefit of paid tech support. At 4GB, the ISO
    took a while to download but the Calamares installer was a breeze. The support
    pages do have a basic setup guide, which helpfully reminded us to tick Make Administrator
    when creating a user account. You can also encrypt the hard drive for extra security.

    The Gnome desktop’s default EuroLinux wallpaper is very picturesque, but you can
    choose others.

    The default apps are well chosen – web browsing is provided by the latest ESR
    (Extended Support Release) of Firefox. You can access email via Geary or Evolution.
    EuroLinux also comes with version 7.1.8 of LibreOffice. If you’re noticing a theme,
    it seems these packages have been selected for stability, so don’t represent the
    bleeding-edge versions currently available. On the plus side, EuroLinux 9 will
    be supported until 2032.

    When we fired up the Gnome software centre, we noticed a slight quirk when trying
    to install desktop utility Darksdk, which was available as a Flatpak. Gnome Software
    said it wasn’t supported but it installed readily enough and opened without issue.
    Upon switching to the command line, we had no issue installing the gnome-tweaks
    tool using the dnf package manager.

    The latest version of EuroLinux (9.2) comes with numerous other improvements under
    the hood. There are security updates to OpenSSL and the SELinux user space packages.

    Developers will be pleased to hear that EuroLinux is also now bundled with Python
    3.11, as well as the java-11-openjdk, java-17-openjdk and java-1.8.0-openjdk packages.
    You can read the full release notes at https://bit.ly/1xf304euro.


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_21_0.png)


    **VERDICT**

    DEVELOPER: EuroLinux

    WEB: https://en.euro-linux.com

    LICENCE: GNU GPL


    | | 8/10 | EASE OF USE | 9/10 |

    |:--|:--|:--|:--|

    | PERFORMANCE | | DOCUMENTATION | 7/10 |


    EuroLinux could easily go 12 rounds with Rocky. It’s slick to install, supported
    for years and provides a clear interface.


    **Rating** 8/10'
  merge: -1
  img_proc: true
