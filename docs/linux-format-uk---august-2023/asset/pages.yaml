  md: '# HOTPICKS


    # FILE ENCRYPTION

    CryFS

    Version: 0.11.3

    Web: www.cryfs.org


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_86_0.png)


    C  ryFS is an encryption tool for safeguarding all files, especially in the cloud.
    It’s easy to set up, runs in the background, and works well with popular cloud
    services such as Dropbox and OneDrive. It is available in the official repos of
    Debian and Ubuntu distros, and can be installed with `sudo apt install cryfs`.
    Users of other distros can install it via HomeBrew (HotPicks, LF<303) with `brew
    install cryfs`.


    Once installed, you can create an encrypted directory with something like `cryfs
    basedir mountdir`. The command asks you some questions about the configuration
    of your encrypted directory. You can safely go with the default options. You’re
    also prompted for an encryption password.


    Once the directories have been mounted, you can modify the content inside the
    `mountdir` directory. CryFS then encrypts them and stores the encrypted data in
    the `basedir` directory. If the corresponding directories don’t exist yet, CryFS
    offers to create them. The unencrypted content of `mountdir` will never be stored
    to the hard disk, so everything on your hard disk is encrypted. To unmount the
    encrypted directory, specify the `mountdir` directory (`mountdir` in this case)
    type, such as `cryfs-ummount mountdir`.


    When CryFS isn’t running, you won’t be able to access your encrypted data, and
    the contents of `mountdir` will be empty. On the other hand, while the `basedir`
    won’t be empty, its contents will be encrypted and cannot be read. Although CryFS
    can also be used to just encrypt files locally, its main purpose is to be used
    together with cloud storage providers such as Dropbox. It should work well together
    with any cloud storage provider that uses a local synchronisation folder. To upload
    the encrypted files, make sure you put `basedir` inside the folder that’s synchronised
    with the cloud service.


    In addition to the file content itself, CryFS ensures that no data, including
    directory structure and metadata, leaves your computer unencrypted.


    # DISK CLEANER

    rmLint

    Version: 2.10.1

    Web: http://rmlint.rtfd.org


    ![](img/5cfcf2f4448dccdd1c5c2a2851544557_86_1.png)


    I  f you’re like us, the only thing that collects more lint than the washing machine
    is your distro. `RmLint` is a CLI tool that can traverse the filesystem and identify
    all kinds of digital lint clogging up the installation, including duplicate files
    and directories, broken symbolic links and more. Many major Linux distros already
    package `rmlint`. On Debian-based distros like Ubuntu use `sudo apt install rmlint`,
    while on Fedora use `sudo dnf install rmlint`.


    To put it to use, simply type `rmlint` in the terminal. This scans the current
    working directory, identifies the lint, and lists it in the terminal. It also
    prints a summary of the total files scanned and the size of the duplicate files,
    along with other details. Note that the command doesn’t delete these files per
    se, but rather generates executable output, such as JSON or shell scripts that
    you can use to delete the files. By default, the command writes a shell script
    named `rmlint.sh` that contains the shell commands to remove duplicates and other
    lint. Before running the script, it’s always advised to first review the content
    of the script. When scanning a large directory, instead of a scrolling list of
    files, you can ask `rmlint` to instead show a progress bar with the `-g` switch,
    such as `"rmlint -g"`.


    `rmlint.sh` script (by opening it in a text editor) and what it plans to delete
    and make any edits as necessary. When sure it’s good to go, let it rip with `"rmlint.sh"`.
    The script asks for confirmation, then deletes the lint, before self-destructing,
    `Mission Impossible`-style. Like all good CLI tools, `rmlint` has a good repertoire
    of options, and it’s a good idea to spend some time reading through its man page
    to explore them. For instance, you can ask it to only check files between 500MB
    and 2GB with `"rmlint -size 500M-2G"`. Similarly, you can ask it to only check
    files that are larger than 100MB with `"rmlint -s 10M"`.'
