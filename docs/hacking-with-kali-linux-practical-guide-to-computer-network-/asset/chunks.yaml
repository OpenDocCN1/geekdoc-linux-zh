    - **CISO**: 首席信息安全官利用 `Kali Linux` 对其基础设施环境进行内部审计，并发现环境中是否安装了任何新形式的应用程序或恶意配置。

    - **取证工程师**: `Kali Linux` 带有取医取证模式，允许取证工程师在各种实例中执行数据发现和数据恢复。

    - **白帽黑客**: 白帽黑客或道德黑客与渗透测试员相似，他们使用 `Kali Linux` 进行审计，并寻找安全环境中可能存在的漏洞。

    - **黑帽黑客**: 黑帽黑客使用 `Kali Linux` 寻找系统漏洞并进行利用。`Kali Linux` 带有各种社交工程应用程序，黑帽黑客可以轻松利用它们来攻击个人或组织。

    - **灰帽黑客**: 灰帽黑客也像黑帽和白帽黑客一样使用 `Kali Linux`。

    - **计算机爱好者**: 这是一个非常通用的术语，但任何对了解更多计算机和网络的人都可以使用 `Kali Linux` 系统来学习更多网络、信息技术以及常见形式的漏洞。


    ## 攻击过程

    `Kali Linux` 作为一个黑客平台非常受欢迎。“黑客”一词并不总是负面的，因为它也被用于利用之外的其他各种工作。通过收集有关使用 `Kali Linux`
    进行攻击过程的大量知识，你可以学习如何进行漏洞检查，并且在你选择将道德黑客作为职业选择时，如何修复它们。使用 `Kali Linux` 进行攻击的过程与通用的攻击过程相似，黑客试图进入组织或公司的服务器，从而获得存储在服务器中的数据所有形式的访问权限。攻击过程可以分为五个不同的步骤。


    ### 1. 侦察 (Reconnaissance)

    这被视为开始攻击过程的第一步。在这一阶段，黑客倾向于使用所有可用手段收集有关目标系统的所有形式的信息。它包括多个阶段，例如目标识别、确定目标 IP 地址范围、可用网络、`DNS`
    记录等。简单来说，黑客收集网站或服务器的所有联系方式。黑客可以通过使用诸如 `maltego` 等各种形式的搜索引擎来研究目标系统（例如服务器或网站），或者利用诸如
    `HTTPTrack` 等其他工具来下载完整网站以供后续阶段进行枚举。在黑客完成所有这些步骤后，他可以确定员工姓名、职位以及员工指定的电子邮箱地址。


    ### 2. 扫描 (Scanning)

    在收集有关目标的所有形式信息后，黑客开始第二阶段，即扫描。黑客在这一阶段利用多种形式的工具，如拨号器、端口扫描器、网络映射器、漏洞扫描器等许多。由于 `Kali
    Linux` 预装了大量的工具，黑客在这一阶段甚至不会遇到任何困难。黑客试图寻找有关目标系统的信息，这些信息实际上可以帮助推进攻击，例如 IP 地址、用户帐户和计算机名称。当黑客完成基础信息收集后，他们开始寻找目标系统内部其他可能的攻击途径。黑客可以从
    `Kali Linux` 中选择诸如 `Nmap` 等各种工具进行网络映射。黑客试图寻找自动邮件回复系统，或者简单地基于他们收集的信息。黑客进入下一步，包括向公司员工发送关于各种查询的邮件，例如向公司的人力资源部门发送关于职位空位的详细查询。


    ### 3. 获取整体访问权限 (Gaining overall access)

    在涉及攻击时，这一阶段被认为是最重要的。在这一阶段，攻击者尝试创建被攻目标的网络蓝图设计。它是根据黑客收集的所有相关信息创建的。在黑客完成枚举和扫描阶段后，现在出现的步骤是获取目标网络的访问权限，这完全基于收集的信息。可能会发生黑客想要使用钓鱼攻击的情况。他可能会尝试稳妥起，只使用非常简单的钓鱼攻击来获取访问权限。黑客可以决定从组织的
    IT 部门进入目标系统。


    攻击者还可能得知公司最近进行了招聘，这有助于加速程序。对于钓鱼攻击，黑客可能会使用一种特殊的程序，利用公司 CTO 的真实邮箱地址发送钓鱼邮件，并将邮件发送给所有技术人员。用于钓鱼的邮件将包含一个网站，该网站有助于收集登录所需的所有用户
    ID 和密码。黑客还可以使用其他选择如手机应用、网页邮箱或其他平台向用户发送钓鱼邮件，然后要求个人使用提供的凭据登录新的 Google Portal。当黑客决定使用这种技术时，他们有一种运行在自己系统后台的特殊类型程序，称为
    `Social Engineering Toolkit`（社交工程工具包）。攻击者用它在通过 `bitly` 或 `tinyurl` 屏蔽服务器地址后，直接向用户发送带有地址的邮件。攻击者还可以使用其他方法获取系统访问权限，例如通过使用
    `Metasploit` 创建 `PFD` 格式文件的反向 TCP/IP Shell。攻击者还可以利用缓冲区溢出进行攻击，这些攻击基于堆栈或会会持，最终导致获得对目标服务器的整体访问权限。


    ### 4. 维护对服务器的访问 (Maintaining the access to the server)

    黑客获得目标服务器访问权限后，他将试图保持对服务器的访问，并确保未来利用和攻击的安全。当黑客获得整个系统的访问权限时，他可以将劫持的系统作为自己的个人基地，并用它对其他系统发动多次攻击。在黑客获得目标系统的访问权限并最终拥有该系统后，被劫持的系统被称为僵尸系统。黑客获得了一全新的电子邮件地址和帐户，并可以从同一域名开始使用这些帐户测试其他形式的攻击。为了隐藏在系统中，黑客还会尝试创建一个全新的管理员帐户并试图融入系统。


    '
- fmt: '

    For safety purposes, the hacker also starts to find out and identify those accounts
    in a system which has not been used by the organization for a long period of time.
    After the hacker finds out such form of accounts, he changes all the login passwords
    of the old accounts and elevates all form of privileges right to the administrator
    of the system like a secondary account for the purpose of having safe access to
    the network which has been targeted.


    The hacker can also begin to send out various emails to the other users within
    an organization which might contain exploited form of files in the `PDF` format
    with the reverse shell scheme for extending his all-round access within the system.
    After all these, the hacker waits for some time to make sure that no form of disturbance
    has been detected in the system and after getting sure of the same, he starts
    to create copies of the available pool of user data like contacts, files, messages,
    emails and various other forms of data for using them in the later stage.


    ### Clearance of track


    Before starting a system attack, the hackers plans out their whole pathway for
    the attack along with their planning for identity so that if any discrepancy occurs
    no one can trace them up. The hackers start doing so by altering their `MAC address`
    and then run the same system across a `VPN` so that their identity can be covered
    up easily.


    After the hackers have achieved their target, they begin with clearance of their
    pathways and tracks. This complete phase includes various things such as clearing
    of the `temp files`, mails which has been sent, the logs of the servers and various
    other things. The hacker also tries to make sure that there is no form of alert
    message from the email provider which can alarm the targeted organization regarding
    any form of unauthorized or unrecognized login in the system.

