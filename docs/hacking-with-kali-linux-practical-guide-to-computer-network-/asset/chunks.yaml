- fmt: "\n*   Free of cost: Linux is a free software and so all the distributions\
    \ of Linux are also free of cost. Kali Linux has been and will also be free of\
    \ cost always.\n*   A wide array of tools: Kali Linux can offer you with more\
    \ than 600 different types of tools for penetration testing and also various tools\
    \ related to security analysis.\n*   Open-source software: Linux is an open-source\
    \ software. So, Kali Linux being a part of the Linux family also follows the much-appreciated\
    \ model of being open-source. The tree of development of the OS can be viewed\
    \ publicly on Git and all the codes which are available with Kali Linux are also\
    \ available for the purpose of tweaking.\n*   Support for multi-language: Although\
    \ of the fact that the penetration tools are written in English, it is evident\
    \ that Kali Linux supports multilingual use as well. It has been done to make\
    \ sure that a greater number of users can operate the OS in their native language\
    \ and can also locate the tools which they need for their job.\n*   Totally customizable:\
    \ The developers of the tools for offensive security know that every user will\
    \ not be agreeing with the model design. So, Kali Linux has been developed in\
    \ a way so that it can be fully customized according to the need and liking of\
    \ the user.\n\n## System requirements\nInstalling Kali Linux for the purpose of\
    \ penetration testing is very easy. You just need to make sure that you have the\
    \ required set of hardware. Kali Linux is supported on `amd64`, `i386` and `ARM`.\
    \ You all require:\n\n*   Minimum 20 GB of disk space for the installation of\
    \ the software\n*   Minimum 1 GB of RAM\n*   One CD/DVD drive or virtual box\n\
    \n## List of tools\nKali Linux comes with a wide range of tools pre-installed.\
    \ Let’s have a look at some of the most commonly used tools.\n\n*   `Aircrack-ng`:\
    \ It is a tools suite which is used for the purpose of assessing Wi-Fi network\
    \ security. It aims at some of the prime areas of security related to Wi-Fi.\n\
    \    1. Monitoring: It helps in capturing packet and also exports data to the\
    \ text files for processing in the later stages by the third-party tools.\n  \
    \  2. Attacking: It helps in replay attacks, fake access points, de-authentication\
    \ and various others by the process of packet injection.\n    3. Testing: It helps\
    \ in checking the Wi-Fi cards and other capabilities of the drivers.\n    4. Cracking:\
    \ It helps in cracking WPA PSK and WEP.\n*   `Nmap`: Nmap, also known as Network\
    \ Mapper, it is an open source and free form of utility for the purpose of network\
    \ discovery along with auditing of security. Nmap uses up the raw packets of IP\
    \ for determining which hosts are available on the desired network, what are the\
    \ services are being offered by those hosts, what are the operating systems that\
    \ they are using, which type of firewall or packet filters are being used and\
    \ various other characteristics. Many of the administrators of network and systems\
    \ also use it for:\n    1. Inventory of network\n    2. Managing the schedules\
    \ of service upgrade\n    3. Monitoring the service or host uptime\n*   `THC Hydra`:\
    \ When you are required to crack one remote authentication service, THC Hydra\
    \ can be used. It is capable of performing super fast dictionary attacks in opposition\
    \ to 50 or more protocols which includes HTTP, FTP, SMB and HTTPS. It can be used\
    \ easily for the purpose of cracking into wireless networks, web scanners, packet\
    \ crafters and many more.\n*   `Nessus`: It is a form of remote scanning tool\
    \ which is used for checking the security vulnerabilities of computers. It is\
    \ not capable of blocking any form of vulnerabilities that the system of a computer\
    \ has but it can easily sniff all of them out by running more than 1200 checks\
    \ for vulnerability and also sends out alerts when it is required to make the\
    \ security patches.\n*   `WireShark`: It is an open-source analyzer of packet\
    \ which anyone can use and that too free of charge. With the help of this tool,\
    \ the user can easily see the network activities provided along with customizable\
    \ reports, alerts, triggers and many more.\n\n## Features of Kali Linux\nKali\
    \ Linux is a form of Linux distribution that comes along with a wide range of\
    \ tools which are pre-installed in the distribution. It has been designed for\
    \ the targeted users for ease of functioning. Kali Linux is more or less like\
    \ the other distributions of Linux but it comes along with some added features\
    \ too that help in differentiating it from the others. Let’s check out some of\
    \ the most unique features of Kali Linux.\n\n*   Live system: Unlike the other\
    \ distributions of Linux, the primary ISO image that you are going to download\
    \ will not only help in installing the OS but it can also be used just like a\
    \ bootable form of live system. In simple words, Kali Linux can be used without\
    \ even installing it in the system by just using the ISO image by booting the\
    \ same. The live system of the distribution contains all the tools which are required\
    \ by the penetration testers. So, in case your present system is not running on\
    \ Kali Linux OS, you can easily use it by inserting the USB device and then reboot\
    \ the same for running Kali Linux on your system.\n*   Forensics mode: While performing\
    \ any kind of forensic related work on the system, generally the users want to\
    \ avoid any form of activity which might result in data alteration on the system\
    \ which is being analyzed. Unfortunately, most of the modern-day environments\
    \ of desktop tend to interfere with this form of objective and tries to auto-mount\
    \ any form of the disk which it detects. In order to avoid this form of behavior,\
    \ Kali Linux comes with the forensics mode which can be enabled from the menu\
    \ of reboot and it will result in disabling all such features. The live system\
    \ of Kali Linux turns out to be so useful only for the purpose of forensics as\
    \ it is readily possible to reboot any system of computer into the system of Kali\
    \ Linux without even accessing or doing any kind of modification in the hard disks.\n\
    *   Customized Kernel of Linux: Kali Linux is well-known for providing customized\
    \ version of the recent kernel of Linux which is based on the latest version of\
    \ Debian Unstable. This helps in ensuring solid support for hardware, precisely\
    \ for the wide collection of wireless devices. The kernel of Linux gets patched\
    \ with the support for wireless injection as some of the assessment tools regarding\
    \ wireless security tends to rely on this form of feature. As most of the hardware\
    \ devices need updated files of firmware, Kali Linux comes with the feature of\
    \ installing the files by default along with all the firmware updates which are\
    \ available in the non-free section of Debian.\n*   Trustable OS: The users of\
    \ this security distribution wants to know that whether or not it can be trusted\
    \ and as it has been developed plain sight, it allows anyone to easily inspect\
    \ the codes of the source. Kali Linux has been developed by a very small team\
    \ of developers who always follow the required practices of security. The developers\
    \ also upload the source packages in signed format.\n*   Customizable: Each and\
    \ every penetration tester has their own way of working and might not agree with\
    \ the default configuration of the OS. Kali Linux is fully customizable which\
    \ allows the users to customize the same according to their need. There are also\
    \ various forms of live-build techniques that can be found online that helps in\
    \ modifying the OS, install several other supplementary forms of files, run the\
    \ arbitrary commands, install any other required packages and many more. The users\
    \ can also customize the way in which the distribution functions.\n"
