    ### 恶意软件类型


    - 键盘记录器 (Keyloggers)：一种非常特殊的工具，旨在记录并记录受害者系统上按下的每一个按键。键盘记录器通过附加到应用程序编程接口或 `API`
    来记录按键轨迹。当用户在系统中使用键盘输入任何内容时，它会跟踪这些按键。记录的文件会被保存，包含各种形式的信息，例如网站访问详情、用户名、打开的应用程序记录、截图、银行详情等。键盘记录器还能捕获个人信息、信用卡详情、密码、手机号码以及通常在系统中输入的其他细节。键盘记录器通常以恶意软件的形式出现，允许网络犯罪分子突破各种形式的敏感数据。


    - 漏洞扫描器 (Vulnerability scanner)：漏洞扫描器用于分类并检测系统、网络、通信系统、计算机等的各种形式的弱点。这是道德黑客最常用的工具之一，用于发现潜在的漏洞和漏洞并尽快进行修复。然而，黑黑客也可以使用漏洞扫描器来检查系统中的漏洞和弱点，然后寻找合适的工具进行利用。


    ### 黑客攻击技术


    黑客使用多种技术来利用攻击系统。


    - SQL 注入：`SQL` 或结构化查询语言旨在利用受害者数据库中的各种形式的数据。这种攻击形式属于网络攻击，通过 `SQL` 语句欺骗系统，目标是数据库。这种攻击通常通过网站界面进行，尝试通过数据库发布
    `SQL` 命令，以破解密码、用户名以及其他与数据库相关的相关信息。所有编写不当的网站以及 Web 应用程序都容易受到 SQL 注入攻击。这是因为基于 Web
    的应用程序包含各种用户输入字段，如登录页面、搜索页面、与支持和产品相关的请求表单、评论区等，这些字段非常容易受到攻击，并可以通过简单的代码操纵轻易被攻破。


    - DDoS 或分布式拒绝服务 (DDoS or Distributed Denial of Service)：一种黑客攻击的形式，其中服务器的正常流量被阻止进入服务器并淹没网络流量。这最终导致服务拒绝，因为它就像交通拥堵一样堵塞道路，并防止常规流量到达目的地。今天所有连接到网络的设备（如
    `IoT` 设备、计算机、手机等）都非常容易受到 `DDoS` 攻击。


    - MAC 欺骗 (MAC Spoofing)：今天人们使用的每种设备都带有网络接口控制器或 `NIC`。它可以帮助用户直接连接到网络（互联网）。每个设备的
    `NIC` 都配有一个 `MAC` 地址，该地址是在经过各种硬编码过程后分配的。MAC 欺骗是一种非常致命的攻击形式，黑客隐藏在自定义的伪造的 `MAC`
    地址之后。这降低了黑客被捕的风险。因此，你可能会认为一个新系统是完全合法的而赋予其访问权限，但黑客可能会隐藏在一个虚假的 `MAC` 地址后面，你甚至无法察觉。


    通过这种技术，黑客可以轻松通过 `Wi-Fi` 破解网络连接，并访问所有通过 `LAN` 连接的设备。`MAC` 欺骗技术还导致其他几种形式的严重犯罪，黑客窃取他人的身份并进行严重的数据泄露，导致某人在甚至不知道实际黑客的情况下被定罪。然而，如今市场上有多种
    `OS`（如 `MAC` 和 `Windows`），它们可以在不使用 `MAC` 地址的情况下轻松连接到 `LAN`。


    ### 第二 2 章：什么是道德黑客？！


    道德黑客也被称为入侵测试、渗透测试和红队对抗。简单来说，这是一种具有争议的技术，通过模仿恶意黑客的行为和意图来发现系统中的漏洞和弱点。道德黑客是指个人或安全专业人士，利用其技能为信息系统管理员采取各种防御措施。道德黑客也被称为白帽客或白帽黑客。通过进行各种测试，道德黑客试图找到以下问题的答案：


    - 攻击者可以访问哪些位置、系统或信息？

    - 攻击者在设定目标之前会看到什么？

    - 攻击者会对系统中的可用信息做什么？

    - 是否有人能够注意到攻击者为获取访问权限而做的各种尝试？


    '
