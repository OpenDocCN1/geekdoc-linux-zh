    # Chapter 15: Firewall


    As the rate of cyber crime tends to increase day by day which has turned out to
    be a threat for most of the businesses all over the world, firewall security is
    the ultimate thing that can help for securing your organization. The term firewall
    can actually be compared with a physical form of wall which can help in preventing
    all forms of unwanted parties across it. Firewall security in the world of computer
    works like a network device which helps in blocking various forms of network traffic
    and thus creates a huge barrier between the untrusted and trusted form of networks.
    It is also relatable to the physical walls in the sense that it tries to block
    the spread of computer attacks.


    ## Firewall and its types


    With the increase in the percentage of cyber attacks, the types of firewall are
    also evolving with time. There are several types and forms of firewalls that can
    be found today. Let’s have a look at some of them.


    ### Stateful firewall

    Stateful firewall is a type of firewall which is somewhat intelligent by nature.
    It helps in keeping a detailed track of all the connections which are in the active
    state to make sure that the user can easily customize the firewall management
    rules in a way which will allow the return packets which are in real a part of
    the established form of connection. However, this form of wall cannot differentiate
    in between the bad and good form of network traffic. It comes with prevention
    form intrusion followed by a complete blockage of the harmful web attacks.


    ### Packet filtering firewall

    This form of firewall is somewhat similar to that of the stateful firewall. It
    comes with various rules for the security of firewall and it comes with the capability
    of blocking that traffic of internet which is based on the port numbers, IP addresses
    and IP protocol. The only bad thing about this type of firewall is that it allows
    all forms of network traffic including the ones which can actually call about
    an attack. In such cases, the users of such firewall require intrusion prevention
    with firewall security. By this method, it will be able to filter out the bad
    and good web traffic. Packet filtering firewall cannot also differentiate between
    the authentic form of return packet and the one which imitates the actions of
    a legitimate data packet. So, it is evident that the packet filtering form of
    firewall will be allowing all forms of return packets within your network.


    ### Application-aware firewall

    This form of firewall is capable of understanding the different forms of protocols
    and also defines the same for the purpose of addressing the particular sections
    of the protocol by the signatories or rules. It helps by providing a flexible
    form of firewall protection for the systems of computers. It also permits the
    rules to be both particular and comprehensive at the same time. It helps in improving
    the overall functioning of the deep packet form of inspection, however, there
    are certain types of attacks which might not be noticed by this firewall because
    the routines defining of the firewall is not strong enough for managing the actual
    traffic variations.


    ### Deep packet inspection

    This is a type of firewall which helps in examining the packets of data in real.
    It also looks after the types of attacks over the application layer. This type
    of firewall comes with the capability of performing various functions in relation
    to the prevention of intrusion. This form of firewall comes along with three forms
    of different admonitions. At first, the definition of deep inspection might extend
    to particular depth for some of the vendors within the data packets and thus will
    not be examining the entire data packet. This can also conclude in skipping out
    some of the most dangerous forms of attacks. Secondly, this type of firewall depends
    greatly on the form of hardware. So, the hardware involved in a system might not
    come with the required power of processing the deep inspection of the data packets.
    You will need to ensure the capacity of bandwidth which the firewall can manage
    easily while inspecting the packets. Lastly, the technology which is related to
    the firewall management might not be having the needed percentage of flexibility
    for managing all the attacks.


    ### Application proxy firewall

    This form of firewall might perform as the mediator for various forms of applications
    like `HTTP` or the web traffic which intercepts each and every request. It also
    validates each of them just before allowing them entry. This form of firewall
    comes with some prime features of intrusion prevention. It is, however, difficult
    to apply this type of firewall in its complete state. Each of the proxies can
    handle only one protocol just like the incoming form of web or email. In order
    to get the ultimate protection of this firewall, it is required to accept all
    the protocols for the purpose of getting ahead with the protocol violation blocking.


    ## Firewall security and its importance


    In this world of today where cyber attacks can take place any time, firewall security
    is of utmost importance for all the servers and computer systems. The prying eyes
    are always looking around for the susceptible form of devices which remains connected
    with the internet. The devices which connect with the internet can be easily attacked
    by the hackers by implementing any form of harmful code or malware into the device
    via the gateway of the internet. Malware attack can result in breaching of data
    and exploitation as well. Firewall is really important in such situations as:


    * It helps in protecting the systems of computers from all forms of unauthorized
    access.

    * It helps in identifying harmful content and also blocks the same.

    * It helps in establishing a secure working environment for a network which gets
    used by several people at one time.

    * It helps in protecting all types of confidential and personal data.

    '
