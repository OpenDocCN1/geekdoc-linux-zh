    nature of the security settings can take place at any of the levels of the stack
    of application. For the purpose of detecting these vulnerabilities, Burp Suite
    starts with the identification of the target and then executes the Spider command
    from the menu of context. The outputs which can be found from the scans can help
    you in finding out the misconfigurations in the system.Generally, a great amount
    of caution is needed at the time of product system analyzing with the security
    scanners which are not designed in a way for getting handled by the kid hands.
    Although various actions serve for identifying the points of attack, you can expect
    that the concerned system which is being tested might also get affected. So, you
    are required to perform all these tests within mirrored form of systems. Generally,
    the mirrors of the systems are secured by the firewall and IDSs of the system
    of production, so you can also check the overall effectiveness of the protection
    mechanisms which are existing already. Several forms of tools can run in various
    modes which might make it difficult for the IDSs to properly detect the scans.
    While running in the intelligent modes, they often fail to get detected.Sounding
    the weak pointsAfter you have found out that where are the gaps present in the
    system of security, the next step that you need to perform is to sound all of
    them out. An important portion of the penetration tests is the using of the tools
    which helps in stimulating as many patterns of attack as possible which are known.
    Metasploit can be regarded as the most widely used form of tool for penetration
    testing and is also a great tool for the penetration testers.Chapter 14: VPN![](rsrcU9.jpg)VPN
    or virtual private network is the method of connection which is used for adding
    privacy along with security to any public or private form of network like the
    internet or hotspots of Wi-Fi. VPNs are most widely used by the corporations for
    the purpose of protecting various forms of private and sensitive data. However,
    in the recent years, the craze of using private VPNs is increasing day by day.
    This is mainly because of the fact that all those interactions which were face
    to face in the beginning now transformed to the internet form of communication.
    Privacy increases with the use of VPN as the IP address of the initial system
    get replaced with the IP address which is provided by the provider of a virtual
    private network. The subscribers can get an IP address from any city they want
    from the provider of VPN service. For example, you are living in San Francisco
    but with service provided by virtual private network, you can look like that you
    live in Amsterdam, London or any other city.SecuritySecurity is the prime reason
    for which the corporations have been using the services of VPNs for years. There
    are various simple ways on which data can traveling to a network can be intercepted.
    Firesheep and Wi-Fi spoofing are the two easiest ways in which information can
    be hacked. For a better understanding of the concept of VPN, a firewall helps
    in protecting a system along with data on the computer while a VPN helps in protecting
    all forms of data on the internet or on the web. VPNs cater with the help of various
    advanced forms of encryption protocols and techniques of tunnel security for the
    purpose of encapsulating all the transfers of online data.The most computer savvy
    users will never connect to the internet without a proper firewall and updated
    system of antivirus. The evolving number of security threats along with the increase
    of reliance on the internet, it has made virtual private network a very important
    part of a well-designed security infrastructure. The checks of integrity ensure
    that no form of data is lost along with ensuring that the connection which has
    been established is not hijacked. As all the traffic gets protected, VPNs are
    always preferred more than the proxies.Setting up a VPNThe setting up of a VPN
    is a pretty simple job. It is most often as easy as entering the username and
    password. The dominant nature of smartphones can easily configure VPNs by using
    the L2TP/IPsec and PPTP protocols. All forms of major OS can configure VPN PPTP
    connection. L2TP/IPsec and OpenVPN protocols need a small application which is
    of open source nature and the certifications to be separately downloaded.Protocols
    of VPNThe available pool of protocols along with the features of security tends
