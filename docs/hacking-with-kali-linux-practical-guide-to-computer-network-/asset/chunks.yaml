    # Chapter 8: Installation of Kali Linux


    If you are thinking about pursuing information security for your career, the primary
    thing that you require is to have an operating system which is focused only on
    system security. With the help of a proper operating system, you can easily perform
    various forms of tedious and time-consuming jobs very easily and efficiently.
    In the present situation, there are various OS available which are based on Linux.
    Out of the several distributions that can be found today, Kali Linux is regarded
    as the best choice for the purpose of information security and penetration testing.
    It is being widely used by the professional penetration testers and the ethical
    hackers for performing various activities related to their field along with the
    assessment of network security.


    Kali Linux is regarded as the leading distribution from the house of Linux which
    is also being used for auditing of security. Kali Linux is the only OS related
    to ethical hacking and network security that comes pre-packaged with several different
    types of tools related to the hacking of command line which is required for various
    tasks related to information security. The tasks in which Kali Linux is most commonly
    used are application security, penetration testing, forensics related to computer
    system and security of network. In simple terms, Kali Linux is the one and only
    and the ultimate operating system which has been designed for the ethical hackers.


    People who are connected with the world of ethical hacking and penetration testing
    use Kali Linux for some specific reasons. Kali Linux comes with more than 600
    tools for penetration testing. The best part is Kali Linux is 100% customizable.
    So, in case you are not liking the present configuration of Kali Linux, you can
    easily customize it in the way you want. Another interesting thing about Kali
    Linux is that it comes with multilingual support. Although the tools are written
    in English, this allows people from all provinces to use this OS using their own
    native language. It comes with the support of a wide collection of wireless devices.
    Kali Linux is such an OS which is developed in a secure form of environment. What
    makes Kali Linux so popular is the feature of being an open source nature of software
    which is free as well. It also comes with custom kernel which can also be patched
    for the purpose of injections.


    ## How can you install Kali Linux?


    The process of installing Kali Linux in your system is quite easy and simple.
    The users can also enjoy several options for installing the software. The most
    preferable options for installation are:


    *   Installation of Kali Linux by using hard disk

    *   Installation of Kali Linux by creating bootable Kali Linux USB Drive

    *   Installing Kali Linux by using software for virtualization like `VirtualBox`
    and `VMware`

    *   Installing Kali Linux by the process of dual booting along with the operating
    system


    The most widely used options for installing Kali Linux are by using USB drive
    and installation by using `VirtualBox` or `VMware`. You need minimum 20 GB of
    free space in the hard disk of your system along with at least 4 GB of RAM if
    you are using `VirtualBox` or `VMware`. You will also require USB along with CD/DVD
    support.


    ### Installing Kali Linux with the help of VMware


    *   Before you want to run Kali Linux in your system, you will require a virtualization
    software at the very first place. There are various options available today when
    it comes to choosing a virtualization software. You can start by installing `VMware`
    or `VirtualBox` from the house of Oracle. After you have installed the virtualization
    software, you need to launch the same from the folder of applications.

    *   Now you are required to download the installation file for Kali Linux which
    you can easily find from the download page in the official website of Kali Linux.
    You can choose the one which you think will be meeting your needs. Along with
    the download file in the download page, you will also come across a wide variety
    of hexadecimal numbers which are used for the security-related jobs. You are required
    to check the image integrity which you are going to download. You need to check
    fingerprint `SHA-256` for the file and then compare the same which has been provided
    on the download page of Kali Linux.

    *   After you have downloaded the installation file for Kali Linux, you are required
    to launch the virtual machine now. For this, you need to open the homepage of
    `VMware Workstation Pro` and then select create a new virtual machine. After you
    have created a new virtual machine, you need to select the isoiso file of Kali
    Linux followed by the selection of the guest OS. You will also need to configure
    all the details of the virtual machine which is Kali Linux in this case. Now you
    can start the Kali Linux virtual machine simply by selecting the VM for Kali Linux
    and then selecting the power on button which is green in color.

    *   After the virtual machine has powered up, a pop-up menu will be prompted in
    which you need to select the preferable mode of installation in the `GRUB` menu.
    You need to select the option graphical install. Click on continue.

    *   The next few screens will be asking you to choose your locale information
    like the preferred language in which you want Kali Linux to install, the location
    of your country along with the layout of your keyboard.

    *   Once you are done with all the required locale information, the installer
    will automatically start to install some required additional components for the
    software and then will also configure the settings related to network. After the
    components have been installed, the installer will ask you to enter the hostname
    along with the domain name for the purpose of installation. You are required to
    provide each and every appropriate information for proper installation of the
    software and for continuing with the installation.

    *   After you are done with all the above mentioned steps, you will need to set
    up a password for your machine of Kali Linux and then hit the continue button.
    Make sure that you do not forget to set a password for your Kali Linux machine.

    *   As you set up the password for your Kali Linux machine, the installer will
    then prompt you for setting up the time zone and will then pause the setup at
    the time of defining the disk partitions. The installer of the machine will give
    you four different choices regarding the disk partitions for the machine disk.
    In case you are not sure about partitioning your disk, the easiest option which
    is available for you is to select the option of `Guided – Use Entire Disk` which
    will be using up the entire disk space and will omit the process of disk partitioning.
    If you are an experienced user, you can select the option of manual partitioning
    for more granular options for configuration.

    *   You will now require to select the partitioning disk. However, the most recommended
    option is to select the option for all files in one partition for all the new
    users. After you gave selected the partitioning disk, select continue.

    *   Now you will need to confirm all the changes that you have made to the disk
    on the machine of the host. Make sure that you do not continue with the process
    as it will be erasing all the data which is available on the disk. Once you confirm
    all the changes in the partition, the Kali Linux installer will start running
    the process of file installation. It might take a while and do not interrupt the
    process as the system will install everything automatically.

    *   Once all the required files have been installed, the system will be asking
    you in case you want to set up any network for the purpose of obtaining the future
    updates and pieces of software. Make sure that you enable this function if you
    are going to use the repositories of Kali Linux in the future. The system will
    then configure the manager of package related files.

    '
