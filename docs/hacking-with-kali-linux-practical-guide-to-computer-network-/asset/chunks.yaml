    在完成所有这些步骤后，Kali Linux 将安装在你的系统中，你可以开始使用它进行渗透测试和网络安全方面的工作。你也可以通过简单创建一个 USB 启动盘，在无需在系统中安装软件的情况下，直接在你的系统中使用
    Kali Linux。


    # 第 9 章：Kali Linux 的应用与用途


    Kali Linux 是道德黑客领域闻名的操作系统。虽然众周知，Kali Linux 的主要重点是渗透测试和安全审计的汇总使用，但除了这两项之外，Kali
    Linux 还可以执行许多其他任务。Kali Linux 以框架的形式设计，因为它配备了可以涵盖各种用例的多种工具。在执行渗透测试时，Kali Linux
    的某些工具还可以结合使用。


    例如，可以在各种类型的计算机上使用 Kali Linux，例如测试人员的系统、想要监控自己网络的系统管理员服务器、与系统取证相关的分析师的系统或工作站，以及通常带有
    `ARM` CPU 的嵌入式设备，这些设备可以轻松地丢入无线网络范围内，也可以插入到目标用户的系统中。许多与 `ARM`相关的设备也可以作为攻击的极佳机器，这主要是因为它们外型小且对功率的要求非常低。


    你还可以直接将 Kali Linux 部署在云端，用于快速构建一个能够破解密码的大型机器集群，并部署在手机和平板电脑上以便进行高效的便携式渗透测试。但并不止于此；渗透测试人员还需要服务器。服务器用于在大型渗透测试人员小组内部使用协作软件、设置用于钓鱼攻击活动的
    Web 服务器、运行与漏洞扫描相关的工具以及各种其他相互互联的任务。


    一旦你启动了 Kali Linux，你会发现 Kali Linux 的主菜单已经根据各种活动和任务主题进行了组织，这些主题与渗透测试人员和其他信息安全专业人士密切相关。


    ## 使用 Kali Linux 可以执行的任务


    Kali Linux 帮助执行广泛的任务。让我们来看看其中一些：


    *   **信息收集**：Kali Linux 可用于收集与目标网络及其结构相关的各种形式的数据。它有助于识别计算机系统、此类计算机的操作系统以及计算机系统运行的所有服务。Kali
    Linux 可用于识别信息系统中的各种潜在敏感部分，并从运行目录的服务中提取所有形式的列表。

    *   **漏洞分析**：你可以使用 Kali Linux 快速测试远程或本地系统是否受到已知漏洞或任何本质上完全不安全的配置的影响。漏洞扫描器使用包含多种特征的数据库来识别潜在的威胁和漏洞。

    *   **Web 应用分析**：它有助于识别 Web 应用安全系统中的任何形式的错误配置或缺陷。由于此类应用程序是公开的，使其成为所有攻击者的理想目标，因此识别并缓解此类问题是一项至关重要的任务。

    *   **数据库评估**：数据库攻击是攻击者常见的向量形式，包括 `SQL injection` 攻击和凭据的攻击。Kali Linux 提供了各种工具，用于测试攻击向量，范围从数据提取到
    `SQL injection` 及其分析。

    *   **密码攻击**：与身份验证连接的系统总是容易受到攻击者的攻击。在 Kali Linux 中可以找到大量工具，从在线密码攻击工具到针对哈希或加密系统的离线工具。

    *   **无线形式攻击**：无线网络具有普遍性。这意味着它们始终是攻击者常见的攻击向量。Kali Linux 配备了对各种网卡的广泛支持，这使得 Kali
    Linux 成为针对多种无线网络类型攻击的明显选择。

    *   **反向工程**：反向工程是一种非常重要的活动形式，用于各种目的。在为各种进攻活动提供支持时，反向工程是识别漏洞和跟踪利用开发的主要方法之一。在防御方面，它也被用于分析用于目标攻击的恶意软件。在这种能力范围内，目标是识别一组特定技术的主要能力。

    *   **利用工具**：利用是指利用系统中任何形式的现有漏洞的行为，允许攻击者获得远程设备或机器的完全控制。这种访问方式也可被攻击者用于进一步的权限提升攻击，攻击可以在本地网络访问的任何机器或已被攻破的机器上进行。这类
    Kali Linux 功能配备了各种工具和实用程序，有助于简化编写自己漏洞的整体过程。

    *   **欺骗与嗅探**：获取跨任何网络传输的数据包的完全访问权限对攻击者来说总是有利的。Kali Linux 可以为你提供各种欺骗工具，允许你模仿任何合法用户，以及嗅探工具，允许你直接从网络线缆分析并捕获可用的数据池。当欺骗和嗅探工具结合使用时，它们会变得非常强大。

    *   **后渗透**：一旦你成功获得目标系统的完全访问，你可能希望通过在网络中横向移动来维持系统的相同访问水平并扩展控制。你可以在 Kali Linux
    中找到各种工具来协助你实现后渗透目标。

    *   **取证**：取证 Linux 的现场启动环境在近几年非常有名。Kali Linux 配备了大量基于 Linux 的流行取证工具，将允许你执行从最初的分拣到数据镜像，再到对系统的完整分析以及最后的案件管理的所有工作。

