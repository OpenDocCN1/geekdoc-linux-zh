- fmt: "\n# Tools of reporting\n\n* **Tools of reporting**: A test of penetration\
    \ can only be declared as successful once all the findings of the test have been\
    \ properly reported. This category of tools from `Kali Linux` helps in composing\
    \ the collected data which has been gathered by the use of tools for information\
    \ gathering, finding out various non-obvious form of relationships and also bringing\
    \ together everything in several reports.\n\n* **Tools for social engineering**:\
    \ When the technical aspect of a system is secured properly, there are chances\
    \ of exploiting the behavior of human beings as a vector of attack. When provided\
    \ with the perfect influence, human beings can be induced frequently for taking\
    \ various actions which ultimately leads to the compromising of the security of\
    \ a system environment. Did the USB drive which was just now plugged in by the\
    \ secretary contain any form of harmful `PDF`? Or did the USB drive just installed\
    \ a form of Trojan horse backdoor? Was the website of banking which was used by\
    \ the accountant just now was a normal expected form of website or a copy of a\
    \ website for the purpose of phishing attack? `Kali Linux` comes with various\
    \ tools that can help you in aiding all these forms of attacks.\n\n* **Services\
    \ for system**: `Kali Linux` can provide with tools which will allow you to initiate\
    \ and also stop various applications which run in the background as the services\
    \ for the system.\n\n# Coordinating tasks of Kali Linux\n\n`Kali Linux` helps\
    \ in coordinating several tasks and also helps in balancing the coordination between\
    \ the software and hardware of a system. The first and foremost task of `Kali\
    \ Linux` is to control the hardware components of the computer system. It helps\
    \ in detecting along with figuring out the various hardware components when the\
    \ computer turns on or also when any new device is installed. It helps in making\
    \ the hardware components available for the various higher level of software with\
    \ the help of a simplified form of program interface so that the applications\
    \ can take all-round advantage of the connected devices without the need of addressing\
    \ any detail like in which extension slot is the option board plugged in. The\
    \ interface of programming also comes with a layer of abstraction which allows\
    \ various software to work seamlessly with the hardware.\n\n## What makes Kali\
    \ Linux different from others?\n\n`Kali Linux` has been specifically designed\
    \ for gearing up the functioning of the penetration testers and also for the purpose\
    \ of security auditing. For achieving this, various core changes have also been\
    \ implemented for `Kali Linux` which reflects all of these requirements:\n\n*\
    \ **Root access by design, single-user**: Because of the normal nature of the\
    \ audits regarding system auditing, `Kali Linux` has been designed in such a way\
    \ which can be used in the scenario of single root access. Most of the tools which\
    \ are employed for the purpose of penetration testing needs escalated form of\
    \ privileges and as it is typically sound policy for enabling the root privileges\
    \ when required, during the use cases to which `Kali Linux` is aimed to, this\
    \ whole approach might turn out to be a huge burden.\n\n* **The services of network\
    \ disabled by default**: `Kali Linux` comes with systematic hooks which disables\
    \ the services of a network by default. Such hooks allow the users to install\
    \ several `Kali Linux` services while also making sure that the distributions\
    \ also remains completely safe and secure by default no matter which type of packages\
    \ has been installed. Other additional services like `Bluetooth` are also kept\
    \ in the blacklist by default settings.\n\n* **Custom kernel of Linux**: `Kali\
    \ Linux` uses up upstream form of the kernel which is patched for the purpose\
    \ of wireless injection.\n\n* **A set of trusted and minimal repositories**: The\
    \ absolute key of `Kali Linux` is to maintain the integrity of a given system,\
    \ given all the goals and aims of `Kali Linux`. With the prime aim in mind, the\
    \ complete collection of sources of upstream software which are used by `Kali\
    \ Linux` is kept as minimum as possible. Many of the new users of `Kali Linux`\
    \ gets tempted to add the extra repositories to the `sources.list`. But, by doing\
    \ so, it leads to the risk of breaking the installation of `Kali Linux`.\n\nIt\
    \ is not correct to suggest that everyone should be using `Kali Linux`. `Kali\
    \ Linux` is been designed particularly for the security specialists. It comes\
    \ with a unique nature because of which `Kali Linux` is not a recommended distribution\
    \ for those who are not at all familiar with the functioning of `Linux` or are\
    \ looking out for some general form of `Linux` distribution for their desktop,\
    \ for gaming, designing of website and many more. Even for the experienced users\
    \ of `Linux`, `Kali Linux` might come along with certain challenges which are\
    \ generally set up due to preserving the security of the systems.\n\n# Chapter\
    \ 10: Different Tools of Kali Linux\n\nAs we know that `Kali Linux` is an open\
    \ source form of distribution which is completely based on `Debian`, it helps\
    \ in providing various tools for the purpose of security auditing along with penetration\
    \ testing. It has been developed by `Offensive Security` and is also among some\
    \ of the most well-known distributions and is being widely used by the ethical\
    \ hackers. The best thing that comes with `Kali Linux` is that it does not need\
    \ to be installed as the OS in your system. Instead of that, you can simply run\
    \ the `iso` file which can be loaded in the memory of `RAM` easily for the purpose\
    \ of testing the security of a system with the help of around 600 tools. `Kali\
    \ Linux` provides users with various forms of tools like information gathering\
    \ tools, tools for analysis of vulnerability, web application tools, wireless\
    \ attack tools, tools for forensics, sniffing along spoofing tools and many more.\
    \ Let’s have a look at some of the most popular tools.\n\n## Tools from Kali Linux\n\
    \n* **Nmap**: `Nmap` can be regarded as the most popular network mapping tool.\
    \ It allows the user to find out the active hosts within a network and also gathers\
    \ relevant information in relation to penetration testing. Some of the main features\
    \ of `Nmap` are:\n    1. It comes with host discovery and helps in identifying\
    \ the available network hosts.\n    2. `Nmap` comes with the feature of port scanning\
    \ which allows the users to calculate the total number of open ports on the remote\
    \ or local host.\n    3. It helps in fetching the `OS` of a network and also finds\
    \ out various information about the connected devices.\n    4. It allows the user\
    \ to detect the version of the application and also determines the name of the\
    \ application.\n    5. It helps in extending the default capabilities of `Nmap`\
    \ by the use of `NSE` or `Nmap Scripting Engine`.\n\n* **Netcat**: As the name\
    \ goes by, `Netcat` functions just like a cat and helps in fetching details about\
    \ a network. It functions as an application for network exploration which is not\
    \ only used in the field of security industry but is also famous in the network\
    \ administration and security administration field. It is generally used for the\
    \ purpose of checking outbound and inbound network and also for port exploration.\
    \ It can also be used for conjunction with various languages of programming such\
    \ as `C` or `Perl` or also with `bash` scripts. The features of `Netcat` are:\n\
    \    1. Port analysis of `UCP` and `TDP`.\n    2. Sniffing of inbound and outbound\
    \ network.\n    3. Forward and reverse analysis of `DNS`.\n    4. Scanning of\
    \ remote and local ports.\n    5. Integration with the standard input of terminals.\n\
    \    6. `TCP` and `UDP` tunneling mode.\n\n* **Unicornscan**: This is one of the\
    \ finest tools of infosec which is being used for the purpose of data correction\
    \ along with gathering. It also offers the users with `UDP` and `TCP` scanning\
    \ along with super beneficial patterns of discovery which helps in finding the\
    \ remote hosts. It can also help in finding out the software which is running\
    \ in each of the hosts. The features of `Unicornscan` are:\n    1. Asynchronous\
    \ scan of `TCP`.\n    2. Asynchronous scan of `UDP`.\n    3. Asynchronous banner\
    \ detection of `TCP`.\n"
