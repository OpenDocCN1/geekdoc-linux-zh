    # Supervisor mode

    The supervisor mode of the monolithic kernel is a flag which mediates from the
    hardware of a system. It can be easily modified by running the codes in the software
    system level. All form of system level tasks comes with this flag while they are
    operating or running. However, the applications of user space do not come with
    this flag set. The flag makes sure that whether the execution of machine code
    operations is possible or not such as performing various operations like disabling
    the interruptions or modifying the registers for various forms of descriptor table.
    The main idea behind having two different types of operation comes from the idea
    “with more amount of control come more responsibilities”. Any program in the supervisor
    mode is trusted so much that it will never fail as any form of failure will lead
    to crashing of the computer system. In simple words, the kernel is the component
    which is responsible for all form of activities of the OS. It is composed of various
    types of modules and also directly interacts with the base hardware. The kernel
    comes with all the necessary abstraction for the purpose of hiding all the low-level
    details of hardware to system or programs of application.


    # The System Library

    The system library is composed of a collection of resources which are non-volatile
    in nature and are used up by the resources of the computer system and is mainly
    used for developing software. This comes with data configuration, help data, documentation,
    templates for messaging and many more. Generally, the term library is being used
    for describing a huge collection of implementations regarding behavior which is
    written down in terms of computer language. It comes with a perfectly defined
    form of interface which helps in invoking the behavior. So, this means that anyone
    who wants to create a program of high level can easily use up the system library
    for the purpose of making system calls. The system library can be requested at
    a time by various individual forms of programs simultaneously, in order to make
    sure that the library has been coded in a way so that several programs can use
    up the library even when the concerned programs are not at all linked nor have
    a connection with each other. In simple terms, the system libraries are unique
    programs or form of functions built up of the system utilities or application
    programs which have access to all the features of the kernel. This form of library
    implements a majority of the functions related to the operating system of a computer
    and they are not required to have the rights of code access for the module of
    the kernel.


    # The System Utility

    The programs of system utility are responsible for performing all forms of individual
    and specialized level tasks. The utility software is a form of system software.
    It has been designed for running the programs of application and hardware for
    a system of computer. The system software can also be considered as the interface
    between the applications of the users and the hardware. In simple words, the system
    utility software is the software of a system which has been designed for the purpose
    of configuring, analyzing, optimizing and maintaining a system of computer. The
    utility software works hand in hand with the operating system for supporting the
    infrastructure of a system, differentiating it from the software of application
    which is aimed for performing the various tasks directly which will be benefiting
    the normal users.


    # Characteristics of Linux architecture

    Linux comes with various features that can help the regular users a lot.


    ## Multiuser capability

    This is the most unique characteristic of Linux OS in which the resources of a
    computer such as memory, hard disk etc. can be accessed by various users at a
    time. However, the users access the resources not from a single terminal. Each
    of the users is given an individual terminal for accessing the resources and operating
    them. A terminal consists of at least one VDU, mouse and keyboard as the devices
    for input. All the terminals are linked or connected with the primary server or
    Linux or with the host machine the resources of which and other peripheral devices
    like printer can be used by the users.


    ## Multitasking

    Linux OS comes with the capability of easily handling various jobs at a time.
    For example, a user can execute a command for the purpose of execution of a huge
    list and type in a notepad at the same time. This is intelligently managed by
    dividing the time of CPU by implementing the policies of scheduling along with
    the concept of switching of contexts.


    ## Portability

    Portability is the feature that made Linux OS so famous among the users. Portability
    does not mean at all that it can be carried around in CDs, pen drive or memory
    cars nor the size of the file is small. By portability, it means that the OS of
    Linux along with all its application can function on various types of hardware
    in the exact same way. The kernel of Linux and the application programs of the
    OS support the installation of the same on even those systems which comes with
    the least configuration of hardware.


    ## Security

    Security is considered as the most essential part of any operating system. It
    is really important for all those users and organizations who are using the system
    for various forms of confidential tasks. Linux OS comes with various concepts
    of security for the purpose of protecting the users from any form of unauthorized
    access of the system and their data.


    # Main concepts of Linux security

    Linux provides 3 main types of security concepts.


    *   **Authentication**: This helps in authenticating the user with the system
    by providing login names and password for the individual users so that their work
    cannot be accessed by any third party.

    *   **Authorization**: At the file level of Linux OS, it comes with limits of
    authorization for the users. There are write, read and execution permissions for
    every file which determines who all can access the files, who can modify the same
    and who all can execute the files.

    *   **Encryption**: This feature of Linux OS helps in encoding the user files
    into a format which is unreadable in format and is called cyphertext. This makes
    sure that even if someone becomes successful in opening up the system, the files
    will be safe.

