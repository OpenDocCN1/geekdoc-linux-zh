    向僵尸主机发送另一个 `SYN+ACK` 数据包，然后评估返回的 `RST` 响应包中 `IPID` 的最终值。如果该值增加了 1，则目标扫描的端口为关闭状态；如果该值增加了
    2，则目标扫描的端口处于开放状态。为了执行僵尸形式的扫描，需要向僵尸系统发送一个初始 `SYN/ACK` 请求，以确定返回的 `RST` 数据包中 `IPID`
    的当前值。然后向扫描目标发送一个伪造的 `SYN` 数据包，源 IP 地址格式为僵尸系统。由于僵尸实际上并没有发送初始 `SYN` 请求，它会将 `SYN/ACK`
    响应解释为未请求的，然后向目标系统发回 `RST` 数据包，从而使 `IPID` 值增加 1。在最后阶段，需要向僵尸系统发送另一个 `SYN+ACK` 数据包，它将返回一个
    `RST` 数据包并将 `IPID` 值增加 1。


    # 第 13 章：渗透测试


    每一项 IT 基础设施都存在一些弱点，这些弱点最终可能导致严重的攻击，并可被用于窃取和操纵数据。在这种情况下，只有这样做一件事可以帮助防止黑客进入系统。你必须对你的安全基础设施进行定期检查，并确保结构中不存在任何形式的漏洞。渗透测试有助于发现系统中的漏洞以及多个弱点。作为网络的所有者或管理员，他们始终可以比黑客占据一些优势，因为他们必然了解网络拓扑、基础设施组件、服务、可能的攻击点、已执行的服务以及许多其他信息。渗透测试是在真实且安全的环境中进行的，这样如果发现任何漏洞，你可以对其进行修复并加固系统。


    ## 详细介绍渗透测试


    正如其名，渗透测试是对系统进行测试以确定是否存在第三方渗透可能的过程。渗透测试通常与伦理黑客混淆，因为两者在功能和运作上有些相似，目标也相同，但有非常细微的区别。在渗透测试中，测试人员扫描系统中任何形式的漏洞、恶意内容和缺陷。渗透测试可以在在线网络、服务器或计算机系统中进行。渗透测试的目标是加强组织的系统的安全性。与黑客攻击不同，渗透测试是合法的，如果使用得当，它可以产生奇效。渗透测试可以被视为伦理黑客的重要部分。


    渗透测试需要定期执行，因为它具有提高系统能力并改进网络安全策略的力量。创建各种类型的恶意内容是为了钓出程序或系统中的弱点。为了有效的测试，创建跨越整个网络的恶意内容。渗透测试过程可能无法处理所有安全相关问题；但它可以帮助减少任何形式攻击的可能性。它有助于确保公司免受各种形式漏洞的影响，并帮助检查组织的防御措施是否足够。渗透测试确实有助于指出组织结构中的优势和弱点。需要注意的是，整个过程并不是随意的，它包含了严密的规划、相关管理的权限授予以及启动过程。


    ## 安全扫描器


    渗透测试过程在收集了组织的概览后开始寻找特定的弱点。为了执行这些操作，需要使用安全扫描器。取决于扫描器的类型和性质，工具可以帮助检查整个系统或网络的已知弱点。最全面的工具之一是
    `OpenVAS`。该工具包含了大量的漏洞并可以检查防御。在 `OpenVAS` 工具识别了所有开放形式后，你可以轻松地使用 `Nmap` 发现。像 `Wireshark`
    这样的工具允许你发现网络活动中的任何形式内容。


    `Wireshark` 工具也用于识别指示黑客攻击的瓶颈，并需要持续检查。在企业组织中，基于 Web 的应用通常依赖 `MySQL`、`Apache` 和
    `PHP`。这些平台主导了整个格局，因为它们通常为攻击提供了巨大的机会。`Kali Linux` 提供了二十种专门用于应用测试的工具。Web 分析中可以很容易找到此类扫描器。`w3af`
    和 `Burp Suite` 被视为最佳工具。


    `Burp Suite` 有助于识别和测试漏洞，并且非常易用。从入侵者模块可以启动暴力破解攻击，这有助于在 Web 系统中注入所需的载荷。它还有助于检测不安全的配置。为了检测这些漏洞，`Burp
    Suite` 开始识别目标并从上下文中执行 `Spider` 命令。从扫描中获得的输出可以帮助你发现系统中的误配置。


    通常，在使用并非设计用于手动处理的安全扫描器进行产品分析时，需要大量的谨慎。尽管各种操作用于识别攻击点，但你可以预期正在测试的相关系统可能受到影响。因此，你需要在镜像形式系统中执行这些测试。通常，系统的镜像受防火墙和系统
    IDS 的保护，因此你也可以检查现有保护机制的整体有效性。多种形式的工具可以在各种模式下运行，这可能使 IDS 难以正确检测扫描。在智能模式下运行时，它们往往无法被检测。


    ## 探测弱点


    当你发现安全系统中存在漏洞后，需要执行的下一步是对它们进行全面探测。渗透测试的重要部分是使用工具来模拟尽可能知的攻击模式。`Metasploit` 可以被视为广泛使用的渗透测试工具，也是渗透测试人员的极佳工具。


    # 第 14 章：VPN


    `VPN`或虚拟专用网络是一种用于为任何公共或私人网络（如互联网或 Wi-Fi 热点）增加隐私和安全的连接方法。`VPN` 被企业广泛用于保护各种私有和敏感数据。然而，近年来，使用私有
    VPN 的热潮日益增长。这主要是因为最初所有的面对面互动现在转变为互联网形式的通信。使用 `VPN` 增加了隐私，因为初始系统的 IP 地址被虚拟网络提供者提供的
    IP 地址取代了。订阅者可以从`VPN`服务提供处获取任何城市的 IP 地址。例如，你住在旧金山，但通过虚拟网络提供的服务，你可以看起来像住在阿姆斯特丹、伦敦或其他任何城市。


    ## 安全


    安全是企业多年来使用 VPN 服务的主要原因。有多种简单的方法可以拦截传输到网络的数据。`Firesheep`和 Wi-Fi 欺骗是信息被黑客的两种简单方法。为了更好地理解`VPN`的概念，防火墙帮助保护系统以及计算机上的数据，而`VPN`则帮助保护互联网或
    Web 上的所有形式的数据。`VPN`通过各种高级形式的加密协议和隧道安全技术，来封装所有的在线数据传输。


    ## 设置 VPN


    设置`VPN`是一项相当简单的工作。它通常就像输入用户名和密码一样简单。智能手机的主导性使其可以使用`L2TP/IPsec`和`PPTP`协议来轻松配置`VPN`。所有主要的操作系统都可以配置
    VPN `PPTP`连接。`L2TP/IPsec`和`OpenVPN`协议需要一个开源性质的小应用程序，并且需要单独下载证书。


