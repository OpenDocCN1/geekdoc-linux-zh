    # Chapter 4: Linux Architecture


    ![](rsrc6M.jpg)

    Linux is one of the finest operating systems which can be found today. It is open
    source in nature and is based on UNIX. It is just a simple OS like the commercial
    ones like Windows XP, Windows 10 and MAC OS. An OS is nothing but the graphical
    form of interface between the system of a computer and the user of the system.
    It comes with the responsibility of managing all the resources related to hardware
    that the system of a computer has and also helps in establishing communication
    in between the hardware and the software.


    ## Open Source Software

    An open source software is a software which has its source code available with
    the license with which the holder of copyright has the right to study the software,
    change the settings and also distribute the same software with anyone he wants
    for any form of purpose.


    ## Linux OS and its components

    The Linux OS is composed of three different components:

    - The Kernel

    - The System Library

    - The System Utility


    ## The Kernel

    The kernel functions as the core part of any form of OS. It is responsible for
    handling the tasks along with the hardware of the system of a computer. The CPU
    time and memory are the two examples of the entities which are being managed by
    the kernel. The kernel of an OS is of two types:


    - **Microkernel**: the microkernel is a type of OS kernel. As its name goes by,
    it comes with a very basic form of functionality. It is the least amount of software
    which can provide with the environment which is required for the functioning of
    an operating system. This environment of kernel covers management of threads,
    low level management of address space and inter-process form of communication.

    - **Monolithic kernel**: Monolithic kernel is the form of kernel which comes with
    various drivers along with it. It is an architecture of the operating system in
    which the operating system of a system works in the space of kernel. This form
    of the kernel is able to load or unload dynamically all the modules which are
    executable at the time of running. The monolithic form of kernel stays in the
    supervisor mode. The major point of difference between the micro kernel and the
    monolithic kernel is that the monolithic form of kernel can alone define a very
    high level of interface over the hardware of the system of a computer.

