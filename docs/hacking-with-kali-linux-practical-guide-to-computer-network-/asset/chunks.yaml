    # 第 16 章：密码学


    随着网络攻击百分比的激增，尽最大地保护各种敏感数据已变得至关重要。在当今这个世界上，数据泄露可能会导致许多企业遭受严重损失，也可能对个人构成威胁，例如窃取银行详情、信用卡信息、登录
    ID 和密码等。


    密码学是将简单的明文（plain text）转换为一种在本质上上无法理解的形式的过程。这种技术使得机密数据的存储和传输变得极其简单。加密文本只有预定的接收并阅读该消息的人才能阅读。它有助于数据保护以及数据的身份验证。


    密码学通常与各种类型信息的安全相关，这还包括通信技术以及源自数学概念的技术。该技术使用一组特定的规则以及计算，这些计算被称为算法。它们被用于将消息转换成极难破译的形式。算法还用于密码学的密钥生成以及数字形式的签名，目的是保护数据隐私、保障网站浏览以及信用卡交易、银行详情和电子邮件等敏感形式的通信。


    ## 密码学及其技术


    该过程的技术也与密码学（cryptology）和密码分析（cryptanalysis）的特征相关。该技术使用了多种其他技术，包括文字与图片的结合、微点（microdots）的使用以及其他步骤，这些步骤有助于隐藏要在网络中传输或存储在网络中的信息。明文被转换为编码文本，通常称为密文（ciphertext）。这是通过加密（encryption）过程完成的。可以在接收端通过解密（decryption）过程进行破译。


    ## 密码学及其目标


    密码学具有多种目标。让我们来看：


    *   密码学的目标是维护数据完整性。在发送者和接收者之间传输或存储在网络中的信息或数据不能以任何方式被更改或改变。在任何情况下，如果发生此类情况，通信双方都会收到通知。

    *   它还有保护所有形式的敏感及个人数据的目标。其主要目的是为所有相关人员确保数据安全。网络传输或存储在网络中的数据或信息不能被网络外的任何第三方分析。

    *   消息的创建者和发送者不允许在数据传输或创建的后期撤回其意图。这种行为被称为不可否认性（non-repudiation）。

    *   发送和接收双方在发送和接收信息之前都能够确认对方的身份。


    ## 密码学及其算法


    密码学系统通过一组程序运行，这些程序也称为加密算法或密码（ciphers）。它们用于消息的加密和解密，目的是保护和确保各种设备、计算机系统以及应用程序之间通信的安全。


    一个密码套件（cipher suite）使用三种算法。它使用一种算法进行数据加密过程。第二种算法用于消息验证。第三种算法用于密钥交换过程。整个过程嵌入在协议中，并写在操作系统上使用的软件编程语言中，以及基于网络的计算机系统之中。它包括公钥的生成以及私钥的生成。信息的加密和解密、消息验证以及通过密钥交换程序进行数字形式签名都需要私钥。简单来说，算法可以被视为密码学的核心。


    ## 结论


    在你完成了整本书的教学之后，现在你可以轻松地对与黑客相关的过程建立清晰的认识。你还将获得关于 `Kali Linux` 运行的大量知识。到此时，你应该对为你的业务和个人使用创建安全可靠的网络服务器所需的所有工具和组件有了清晰的认知。你是对此一切负责的人。只有你才能可以保护整个系统并加强安全基础设施。


    通过 `Kali Linux` 及其所有工具，你可以轻松完全控制与你的业务及个人网络相关的网络安全接口。这本书不仅关于 `Kali Linux`，因为你还学习了关于一些基础网络组件及其安全性。你可以使用
    `Kali Linux` 的所有工具来保护你的系统。使用 `Kali Linux` 后获得的主要益处是，你还可以进行各种与系统安全相关的测试。这最终有助于消除你信息技术基础设施中的各种漏洞和安全缺陷。


    你为你的系统和网络安全所做的事情完全取决于你。你是那个能够成败此手的人。确保你开始使用在书中学到的所有步骤来保护你的系统。


