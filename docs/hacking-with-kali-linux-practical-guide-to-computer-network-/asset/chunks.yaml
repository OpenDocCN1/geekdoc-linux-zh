- fmt: "\nA penetration tester follows all these steps for the purpose of testing\
    \ the vulnerabilities of a system and making sure that those which are available\
    \ in the system are mended properly.\n\n# Chapter 12: Techniques of Port Scanning\
    \ using Kali Linux\n\nIdentification of the open ports on the targeted system\
    \ is essential for defining the surface of attack of the target. The open ports\
    \ of the target correspond with the networked services which are running on the\
    \ system. Errors in programming or flaws in implementation can result in making\
    \ all these services very much susceptible to the attacks and can also lead to\
    \ compromise of the overall system. For the purpose of determining the most probable\
    \ vectors of attack, you are required to enumerate all the ports which are in\
    \ open condition on all the systems of remote form within the scope of the project.\
    \ The open number of ports also corresponds with the services which can be easily\
    \ addressed with the help of either `TCP` or `UDP` traffic.\n\nBoth `UDP` and\
    \ `TCP` are protocols of transport. `TCP` or Transmission Control Protocol is\
    \ the one which is more commonly used than `UDP` and also provides communication\
    \ which is connection-oriented. `UDP` or User Datagram Protocol is a protocol\
    \ which non-connection oriented in nature which is also sometimes used along with\
    \ the services in which transmission speed is more important than the integrity\
    \ of data. The form of penetration testing which used for the purpose of enumerating\
    \ such services is known as port scanning. Such technique helps in yielding enough\
    \ amount of information for the purpose of identifying whether the service is\
    \ being associated with any port on the server or on the device.\n\n## UDP Port\
    \ Scanning\n\nAs `TCP` is more frequently used than `UDP` as a protocol of transport\
    \ layer, services which are operated by `UDP` are most often forgotten. In spite\
    \ of the normal tendency of overlooking the services of `UDP`, it is also critical\
    \ for these services to be enumerated for acquiring an overall understanding of\
    \ the surface of attack of any form of target. The form of scanning with `UDP`\
    \ might often turn out to be tedious, challenging and time-consuming as well.\
    \ For gaining overall insight into the functioning of these tools it is very essential\
    \ to understand the two exactly different approaches of `UDP` scanning which is\
    \ used.\n\nThe first technique which is used is to rely on the `ICMP` port unreachable\
    \ responses exclusively. This form of scanning relies on those assumptions which\
    \ the `UDP` ports which are not linked with the live service will return `ICMP`\
    \ port unreachable response. Lack of this response is taken as the indication\
    \ of a live form of service. Although this form of approach might turn out to\
    \ be very effective in various circumstances, there are also chances of the same\
    \ of returning inaccurate form of results in the cases in which the host is unable\
    \ to generate port unreachable response or the replies of port unreachable is\
    \ either filtered by any form of firewall or are rate limited.\n\nIt also comes\
    \ with an alternative in which service specific probes are used for attempting\
    \ soliciting of a response which will indicate that the service which was expected\
    \ is running on the port which is targeted. Although this form of approach might\
    \ turn out to be very effective, it is also very time-consuming at the same time.\n\
    \n## TCP Port Scanning\n\n`TCP` port scanning includes various approaches such\
    \ as connect scanning, stealth scanning along with zombie scanning. For understanding\
    \ how all these techniques of scanning work, you need to understand how the connections\
    \ of `TCP` are established and also maintained. `TCP` is a form of protocol which\
    \ is connection-oriented. Data is transported over `TCP` only after a successful\
    \ connection has been created in between the two systems. The process which is\
    \ associated with the creation of connection of `TCP` is often called three-way\
    \ handshake. This term alludes from the three different steps which are involved\
    \ in the process of connection.\n\nA packet of `TCP SYN` is sent from that device\
    \ which wants to establish connection along with the device port which it wants\
    \ to connect with. If the associate service with the port which the device wants\
    \ to connect to accepts the connection, the port will be replying to the system\
    \ which is requesting the connection with a packet of `TCP` that comes with both\
    \ `ACK` and `SYN` bits activated. The connection is successful when the requesting\
    \ system responds back to the port with a response of `TCP ACK`. These three steps\
    \ in total sums up the three-step process which is required for the establishment\
    \ of a session of `TCP` between two systems. All the techniques of `TCP` port\
    \ scanning will be performing some sort of variation of this entire process for\
    \ the purpose of identifying the live services on the remote form of hosts.\n\n\
    Both the process of stealth scanning and connect scanning are quite easy to understand.\
    \ The process of connect scanning is used up for establishing a complete `TCP`\
    \ connection every port which is being scanned. This is done for each of the ports\
    \ which are scanned for completing the three-way handshake. When a connection\
    \ is established successfully, the port is determined to be in the open state.\
    \ However, in the case of stealth scanning, a full connection is not established.\
    \ Stealth scanning is often referred to as `SYN` scanning or also half open scanning.\n\
    \nFor each and every port which are scanned, one single packet of `SYN` is sent\
    \ out to the port of destination and all the ports which replies with a packet\
    \ of `SYN+ACK` are taken as to be running the live form of services. As no final\
    \ form of `ACK` is sent out from the system which initiated the connection, the\
    \ connection is left out as half open. This is known as stealth scanning as the\
    \ solutions of logging which only records the connections which are established\
    \ do not record any form of evidence of the performed scan.\n\nThe final method\
    \ which comes with TCP port scanning is the zombie scanning. The prime goal of\
    \ zombie scanning is to map all the open form of ports on a system of remote nature\
    \ without even producing any form of evidence which you have had an interaction\
    \ with the system. The principles on which the functioning of zombie scanning\
    \ depends are complex in nature. You can carry out zombie scanning by following\
    \ these steps:\n\n- Start by identifying the remote system for the zombie. The\
    \ system which you are going to identify needs to have these characteristics:\n\
    \    1. It is in idle form and it doesn’t actively communicate with the other\
    \ systems which are available on the network.\n    2. It needs to use an incremental\
    \ form of `IPID` sequence.\n\n- Then you will need to send in a packet of `SYN+ACK`\
    \ to the zombie and then record the initial value of `IPID`.\n\n- Send in a packet\
    \ of `SYN` along with a source of the spoofed IP address of the system of zombie\
    \ to the target system of scan.\n\n- Depending on the port status on the target\
    \ scan, any of the following will happen:\n    1. In case the port is in open\
    \ state, the scan target will be returning a packet of `SYN+ACK` to the host of\
    \ zombie which it thinks sent out the original request of `SYN`. In such a case,\
    \ the host of zombie will be responding to the unsolicited form of `SYN+ACK` packet\
    \ with a packet of `RST` and then increment the value of `IPID` by one.\n    2.\
    \ In case the port is in the closed state, the scan target will be returning a\
    \ response of `RST` to the host of zombie which it thinks sent out the original\
    \ request of `SYN`. The packet of `RST` will be soliciting no form of response\
    \ from the host of zombie and the value of `IPID` will therefore not be increased.\n"
