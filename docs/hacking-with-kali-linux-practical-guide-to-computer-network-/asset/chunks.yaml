    为了安全起见，黑客还会开始查找并识别系统中长期未被组织使用的账户。在黑客发现这类账户后，他会更改所有旧账户的登录密码，并将所有此类账户的权限提升至系统管理员权限（类似于备用账户），以便安全地对目标网络进行访问。


    黑客还可以开始向组织内的其他用户发送各种电子邮件，这些邮件可能包含 `PDF` 格式的受利用类型文件，并带有反向 shell（reverse shell）方案以扩展其在系统内的全面访问权限。在完成所有操作后，黑客会等待一段时间，以确保系统中没有检测到任何形式的干扰。在确认这一点后，他开始创建可用用户数据池的副本，如联系人、文件、消息、电子邮件以及各种形式的数据，供后续阶段使用。


    ### 清除痕迹


    在开始系统攻击之前，黑客会规划整个攻击路径以及身份伪计划，以便在出现任何异常时无人能追溯到他们。黑客通过修改其 `MAC address` 开始这样做，然后通过
    `VPN` 运行同一系统，以便轻松掩盖自己的身份。


    在黑客实现目标后，他们开始清理自己的路径和痕迹。这一完整阶段包含了许多工作，例如清理 `temp files`、已发送的邮件、服务器日志以及其他各种内容。黑客还会尝试确保邮件提供商不会发出任何警报信息，以免引起目标组织注意系统内任何形式的未经授权或未识别的登录。

