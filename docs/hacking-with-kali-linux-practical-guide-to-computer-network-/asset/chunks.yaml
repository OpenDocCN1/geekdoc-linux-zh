    受赋予渗透测试任务的道德黑客，在其被分配防御任务的组织范围内，根据该组织的许可和知识进行操作。在某些情况下，组织不会向安全信息团队告知道德黑客将要进行的所有活动，这仅仅是为了测试安全信息团队的有效性和严谨性。这整个过程被称为**双盲环境**。为了确保操作有效且合规，组织需要告知道德黑客所有需要保护的资产和信息、潜在的威胁来源，以及组织支持道德黑客工作的程度范围。


    # 道德黑客流程

    所有道德黑客都遵循严格的流程，以获得最佳、可用且切中要点的合规结果。让我们来看看道德黑客遵循的流程。


    ## 规划

    无论是什么种类型的项目，对于每一个成功的项目来说，规划都是至关重要的。它为道德黑客提供了思考需要做的事情的机会，设定要达成的目标，并进行风险评估以评估如何执行一个完整的项目。在执行道德黑客项目之前，道德黑客会考虑各种因素。因素列表包括企业文化、安全策略、法律、法规、行业要求和最佳实践。在启动道德黑客活动时，这些因素在决策过程中都起着重要作用。


    道德黑客的规划阶段将对攻击过程的执行方式产生整体影响，影响收集和共享的信息，并将直接影响结果向安全计划的集成和交付。规划阶段是第一步，将描述有关受控攻击攻击的大部分细节。它还将回答所有关于黑客的问题，例如道德黑客过程将如何被控制和支持、需要执行哪些基本操作以及该过程将持续多久。


    ## 侦察

    这是一个搜索所有免费可用信息以协助攻击过程的过程。整个过程可以简单到如仅使用 `ping` 命令，或者浏览互联网上各种新闻组以搜索员工泄露的信息；也可以复杂杂如像在一堆巨大的信件或收据垃圾中翻找那般。这个过程还可以包括其他几个过程，如电话窃听、社会工程学、网络窃听以及数据窃取。信息搜索过程将仅限于组织和道德黑客为了获取他们寻找的所有所需信息而愿意达到的程度。


    侦察阶段引入了需要完成的任务与保护组织信息和资产所需方法之间的深层关系。


    ## 枚举

    这也被称为漏洞发现或网络发现。枚举是从目标系统、网络和目标所使用的应用程序中获取所有现成可用信息的过程。需要注意的是，枚举阶段通常是恶意攻击与道德黑客之间界限变得模糊的实际关键点，因为非常容易且简单地超出原始攻击计划中划定的专用边界。为了构建组织环境的清晰蓝图，会使用各种现有的技术和工具。这些可用工具包括
    `NMap` 和端口扫描。然而，收集所有所需信息非常容易，但要确保黑客手中信息的价值却非常困难。


    从乍上看，枚举过程似乎非常简单，即收集数据然后对其进行集体评估，以为进一步搜索建立适当的计划，或为分析或漏洞阶段建立详细的矩阵。然而，这一阶段是道德黑客在做出逻辑决策的能力发挥着非常重要作用的实际阶段。


    ## 漏洞分析

    为了有效分析所有数据，道德黑客需要采用一种务实且在本质上符合逻辑的方法。在漏洞分析阶段，将已收集的所有信息与实际过程中的所有已知漏洞形式进行比较。任何形式的信息在过程中都是有用的，无论它们源自何处或来源是什么。一小部分信息也可以帮助发现系统中的某些新型漏洞，并可能导致发现其他几个尚未发现的漏洞。已知的漏洞形式、服务包、事件、更新以及各种黑客工具都有助于正确识别攻击点。互联网为道德黑客提供了大量信息，这些信息可以很容易地与系统架构以及系统的强弱点联系起来。


    ##  利用

    花费大量时间用于评估和规划道德黑客攻击。显而易见，所有这些规划将导致某种形式的攻击。系统利用程度可以简单到在系统中运行一个非常微小的工具，也可以复杂到需要以正确方式执行的许多复杂步骤，以获取系统的访问。利用过程可以分解为一系列子任务，每个子任务可以是单个步骤，也可以是多个步骤的集合。随着每一步的执行，都会进行评估过程，以确保符合预期的结果。任何偏离攻击计划的形式都可以分为两个部分：


    -   **预期**：是否达到了利用的预期结果，或者结果是否与组织的假设相冲突？

    -   **技术**：目标系统的行为是否完全不符合预期，这种行为实际上对整个系统利用和系统接入产生了影响？

    '
- fmt: '

    # Final analysis

    Although the phase of exploitation comes with a huge number of validations and
    checks for ensuring the success of the hack, one last final analysis is needed
    for categorizing the system vulnerabilities in accordance to the exposure level
    and also for assisting in the drawing up of a plan for mitigation. The phase of
    final analysis links up the exploitation phase and the deliverable creation. A
    comprehensive image of the complete attack is needed for the construction of a
    bigger size picture of the current posture of the security environment of an organization
    and also for expressing the vulnerabilities clearly.


    ## Deliverables

    Deliverable communicates with the test results in a variety of ways. Some of the
    deliverables are concise and short in nature which only provides the vulnerabilities
    list along with the ways in which it can be mended whereas, the other form of
    deliverables can be detailed and long which will provide a list of the probable
    vulnerabilities in a system which comes with the description regarding how the
    vulnerabilities were found, how they can be exploited, the results of having such
    vulnerabilities within the system and how to fix the situation. This phase is
    actually used by an ethical hacker in conveying his hack results to the organization.
    It can also be the case if the deliverables do not actually frighten the administrators,
    the test is considered as a fail.


    # Chapter 3: Cyber Security

    ![](rsrc5A.jpg)

    In this world of today where technological innovations are taking place every
    day, the potential threats of cyber attacks are also increasing in equal pace.
    Cyber security plays a deep role in securing the information and data of the systems
    and networks in today’s world of vulnerability. Cyber security is nothing but
    the employment of various tools and technologies for the purpose of securing the
    networks, programs, system data and network from the potential attacks, damages
    and various forms of unauthorized access. Cyber security is also known as security
    of information technology.


    ## Cyber security and its importance

    Most of the organizations and institutions such as military, government, medical
    along with financial bodies stores up an accountable amount of data on the systems
    of computers along with databases which can be found online. In most of the cases,
    the information which is being stored up in the servers and databases are highly
    sensitive in nature, leakage of which can result in serious troubles for the concerned
    organization. Unauthorized access to the systems of the organizations along with
    the database can lead to data breaching along with the exploitation of the security
    infrastructure of an organization.


    The organizations which are targeted might lose up all forms of sensitive data
    along with complete loss of access to the systems. As the volume of cyber attacks
    is increasing day by day, the organizations especially those which are concerned
    with national health and security are required to take some serious steps for
    safeguarding all forms of sensitive data. Cyber security is the ultimate option
    which can help an organization in protecting all its data and servers.


    ## Cyber Security & Encryption

    Encryption is the process of encoding communication in such a way so that only
    the authorized parties can encode the message of communication. It is done by
    using `SSL/TLS` and `PKI` protocols. The very reason why is it important so much
    stems from the process in which the internet was built up by using the protocol
    of `HTTP`. Hypertext Transfer Protocol or `HTTP` is of the same age that of the
    internet. `HTTP` is the protocol of communication which allows the servers in
    the web and the web browsers for communicating and displaying the information
    in a proper intended way. When a user visits a website, it is not actually the
    way it looks in the browser. Websites are built up of a bunch of codes which are
    sent to the web browsers which are then visually arranged by the browser in the
    way the web designer intended to do.


    The main problem of `HTTP` is that it is not at all secure. So, any person who
    knows the process can easily spy on the connections of `HTTP` on the internet.
    In simple words, a third party can easily read along with manipulate a communication
    over `HTTP` between the clients and the servers. Encryption is the technique that
    actually comes into play in taking care of the communication by serving the websites
    over the protocol of `HTTPS`. `HTTPS` is the secured version of `HTTP`. All the
    connections which are built over `HTTPS` are encrypted in nature. In simple terms,
    any form of communication over the protocol of `HTTPS` is highly secure. Encryption
    prevents spying on communication by the third parties. In case you are related
    with online business and you need to take the financial as well as personal details
    of the customers, make sure that your website is encrypted so that your customers
    are not at risk at the time of details exchange.


    ### How does the process of encryption work?

    The process of encryption begins when the web browser reaches one website which
    comes with an `SSL` certificate. The web server and the browser proceeds with
    what is known as `SSL handshake`. At the preliminary stages, the web browser verifies
    that the `SSL` certificate which is installed in the website is legitimate in
    nature and has been issued by a trustworthy authority of certification. After
    the web browser makes sure that the certificate is legitimate in nature, it starts
    to negotiate with the terms of the encrypted connection with the server.


    When it comes to encryption, there are mainly two key pairs. The first is the
    asymmetric key pair which consists of the private and public keys. These keys
    have no function with the encryption bulk but they are used for authentication.
    When a web browser tests the authenticity of `SSL` certificate of a website, it
    makes sure that the certificate of `SSL` which is being questioned is actually
    the owner of the public form of key. It performs this by using the public key
    for encrypting a small packet of data. If the web server is able to decrypt the
    data packet by using the respective private key and then send the packet back,
    it is proved that the server is the owner of the public key and everything is
    stated as verified. In case the web server fails to decrypt the data packet, the
    certificate of the server is taken as “not trusted”.


    The other key pair is the session keys. This form of keys is generated after the
    authenticity of the `SSL` certificate has been verified and all the terms regarding
    encryption have also been negotiated. While a public key can be used only for
    encrypting and a private key for decrypting, the session keys can be used for
    both the functions of encryption and decryption. The session keys are smaller
    in size and also less secure in nature when compared with the asymmetric form
    of counterparts. However, the session keys are strong enough for performing both
    the functions. The server and the web browser use the session keys for the rest
    of the communication. After leaving the site, the session keys which are being
    used are discarded and brand-new session keys are generated for the new visit.


    ## Common Types of Cyber Attacks

    Cyber attacks are increasing day by day with the innovations in the world of technology.
    There are various types of cyber attacks that can be found today where some are
    used most commonly such as `phishing`, `malware`, `XSS` and many more. Let’s have
    a look at some of the most common types of cyber attacks.


    ### Malware

    Malware is a form of harmful software which is used for gaining access to the
    systems of the victims. The malware can also be called as viruses. Once a malware
    enters the victim system, it can lead to havoc starting from gaining overall control
    of the system to the monitoring of all sorts of actions, stealing sensitive data
    silently and also can lead to a complete shutdown of the system. The attackers
    use various ways for inserting malware in the target system. But there are also
    various cases in which the system users are being tricked into installing a malware
    in the system.


    ### Phishing

    Receiving emails with various unwanted links and attachments is a very common
    thing today. Such action of sending out harmful links and attachments via email
    is known as phishing. In phishing attacks, the attackers send out emails to the
    targets which seem like a trustable email. Most of the emails come with links
    and attachments which when clicked leads to the installation of malware in the
    system without even the user of the system knowing nothing. Some of the phishing
    links can also lead the users to a new website which might ask for confidential
    data such as bank and credit card details.


    ### XSS

    Cross-site scripting or XSS attack is used for targeting the users of a website
    directly. It is somewhat similar to the `SQL` attack and also involves injecting
    harmful codes in a website. But, in the case of XSS attacks, the websites are
    not attacked. In an XSS attack, the malicious code which has been injected in
    the website runs only in the browser of the user and can be used for stealing
    sensitive data such as username, password, bank details and many more.


    ### Malware and Its Types

    Malware is a form of malicious software which is being used for gaining access
    to the system of the victim. The cyber criminals design malware in a way which
    can be used for stealing data, compromising the functions of the computer, bypassing
    the access controls and many more.


    ### Types of malware

    There are various types of malware that can be found today. Let’s have a look
    at them.

