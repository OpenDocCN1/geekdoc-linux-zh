    # Linux 中的软件安装


    与 Linux 系统中的所有其他事物一样，软件安装也是通过输入并执行特定形式的文本命令完成的。大多数 Linux 发行版都带有包管理器，这使得安装或卸载系统中的任何软件变得更加容易。Ubuntu
    和 Debian 等发行版使用 `APT` 或 `Advanced Packaging Tool` 包管理器，而 CentOS 和 Fedora 则使用 `YUM`
    或 `Yellowdog Updater Modified` 包管理器。


    # 第 6 章：基础 Linux 命令


    Linux 是当今最著名的操作系统之一。然而，Linux 并不是一个完整的操作系统，它是操作系统的内核。Linux 也被视为 `UNIX` 的克隆。一些常见的
    Linux 发行版包括 Linux Mint、Ubuntu Linux、Red Hat Enterprise Linux、Fedora 和 Debian。Linux
    主要用于服务器。也可以认为，几乎 90% 的互联网是由 Linux 服务器驱动的。这主要是因为 Linux 作为一个内核是安全、快速且免费的。Windows
    服务器也可以用于互联网，但 Windows 带来的主要问题是其成本。这个成本问题可以通过 Linux 服务器轻松解决。事实上，如今运行在大多数智能手机上的
    Android 操作系统也是基于 Linux 内核制作的。


    ## Linux shell


    Linux shell 是一种程序，它接收系统用户的命令并将其传递给操作系统进行处理，然后显示结果。Linux shell 是 Linux 操作系统的主要部分。它的发行版带有图形用户界面或
    `GUI` 的形式，但 Linux 基本上带有命令行界面或 `CLI`。要打开 Linux shell 终端，你需要在 Ubuntu 发行版中按下 `Ctrl+Alt+T`，也可以按
    `Alt+F2`，输入 `gnome terminal` 然后按回车键。


    ## Linux 命令


    让我们从一些最基础的 Linux 命令开始。


    ### pwd

    当你首次打开终端时，你将处于用户的家目录。为了确切知道你所在的哪个目录，可以使用 `pwd` 命令。它可以帮助提供精确的路径，即从根目录开始的路径。根目录无非是
    Linux 文件系统的基础。它通常用正斜杠（`/`）表示。用户目录通常看起来像 `/home/username`。


    ### ls

    通过使用 `ls` 命令，你可以轻松了解当前目录中有哪些文件。你还可以使用命令 `ls –a` 查看每一个被隐藏的文件。


    ### cd

    你可以使用 `cd` 命令进入目录。例如，如果你在 home 文件夹中并想进入 downloads 文件夹，你需要输入 `cd Downloads`，你就会进入
    downloads 目录。你需要注意，此命令是对大小写敏感的。你还需要按照原样输入文件夹名称。然而，这种命令会带来某些问题。例如，你有一个名为 Raspberry
    Pi 的文件夹。在这种情况下，当你输入命令 `cd Raspberry Pi` 时，Linux shell 会将命令后面的第二个参数视为一个完全不同的实体，因此你收到的将只有显示没有此类目录的错误信息。在这种情况下，你可以使用反斜杠，即使用命令
    `cd Raspberry\Pi`。在 Linux 中，空格被视为转义符。如果你只输入命令 `cd` 并按回车，你将回到家目录。如果你想从特定文件夹返回到上一个文件夹，你需要使用
    `cd..`。命令中的两个点表示返回的请求。


    ### mkdir & rmdir

    `mkdir` 命令用于创建新文件夹或目录。例如，当你需要创建一个名为 DIY 的新目录时，你需要输入类似 `mkdir DIY` 的命令。始终记住，如果你需要一个名为
    DIY Hacking 的目录，你需要输入 `mkdir DIY\Hacking`。你可以使用 `rmdir` 命令删除你不再需要的目录。然而，务必记住，`rmdir`
    只能用于删除本质上是空的目录。如果你想删除一个包含文件的目录，你需要使用 `rm` 命令。


    ### rm

    你可以使用 `rm` 命令来删除目录和文件。如果你只想删除目录，需要使用 `rm –r` 命令。当你使用 `rm` 命令时，它将删除文件夹及其其中所有的文件。


    ### touch

    此命令用于创建新文件。它可以是任何类型，从一个空的 txt 文件到一个空的 zip 文件。你可以使用像 `touch new.txt` 的命令。


    ### man & - - help

    如果你想详细了解某个命令以及你如何使用它，可以使用 `man` 命令。它通过显示所有命令的所有形式手册页提供帮助。例如，如果你输入 `man cd`，它将显示
    `cd` 命令的所有手册页。当你输入命令名称以及参数 `- - help` 时，它将显示你可以如何使用该命令。


    ### cp

    `cp` 命令用于从命令行复制文件。它接受两个参数，第一个参数是要复制的文件位置，第二个参数是复制文件的位置。


    ### mv

    `mv` 命令用于通过命令行移动文件。你也可以用此命令重命名文件。例如，如果你需要将文件“text”重命名为“old”，你可以输入 `mv text old`。它也像
    `cp` 命令一样接受两个参数。


    ### locate

    `locate` 命令用于在 Linux 系统中定位任何文件。它类似于 Windows 系统中的搜索命令。当……时，这个命令可能会非常有用。


