    # 第 15 章：防火墙


    随着网络犯罪率的日益增长，这已成为全球大多数企业面临的威胁，因此防火墙安全是保障您的组织安全的终极手段。“防火墙”一词实际上可以与物理形式的墙相比较，它可以帮助防止所有形式的未经授权人员进入。在计算机世界中，防火墙安全像一种网络设备，有助于阻止各种形式的网络流量，从而在不可信的网络和信任的网络之间建立一道巨大的屏障。它在某种意义上与物理墙相似，因为它试图阻止计算机攻击的传播。


    ## 防火墙及其类型


    随着网络攻击百分比的增加，防火墙类型也随着时间不断演变。今天可以发现多种类型和形式的防火墙。让我们来看看其中。


    ### 状态防火墙 (Stateful firewall)

    状态防火墙是一种本质上具有一定智能性的防火墙。它有助于对所有活动状态的连接进行详细跟踪，以确保用户可以轻松自定义防火墙管理规则，允许真实属于已建立连接的回数据包通过。然而，这种形式的墙无法区分网络流量的好坏。它具有入侵防护功能，并能完全阻止有害的
    Web 攻击。


    ### 数据包过滤防火墙 (Packet filtering firewall)

    这种形式的防火墙与状态防火墙相似。它带有用于防火墙安全的各种规则，并具有根据端口号、IP 地址和 IP 协议拦截互联网流量的能力。这种类型防火墙的唯一缺点是它允许所有形式的网络流量，包括实际上可能引发攻击的流量。在这种情况下，此类防火墙的用户需要在防火墙安全的基础上结合入侵防护。通过这种方法，能够过滤掉良恶的
    Web 流量。数据包过滤防火墙还无法区分真实的回包和模仿合法数据包行为的数据包。因此显而易见，数据包过滤形式的防火墙将允许网络内所有形式的回包。


    ### 应用感知防火墙 (Application-aware firewall)

    这种形式的防火墙能够理解不同形式的协议，并根据签署者或规则对协议进行定义，以处理特定的协议部分。它通过为计算机系统提供灵活的防火墙保护来提供帮助。它允许规则同时具有特定性和全面性。它有助于改进深度包检测，但某些类型的攻击可能不会被这种防火墙注意到，因为防火墙的定义程序不够强大以管理实际流量的变化。


    ### 深度数据包检测 (Deep packet inspection)

    这是一种有助于实时检查数据包的防火墙。它还监控应用层上的攻击类型。这种类型的防火墙具有执行与入侵防护相关的各种功能的能力。这种形式的防火墙带有三种不同形式的警告。首先，某些厂商对深度检测的定义可能延伸到数据包的特定深度，从而不会检查整个数据包。这可能导致跳过某些最危险的攻击形式。其次，这种类型的防火墙很大程度上取决于硬件形式。因此，系统中的硬件可能不具备处理数据包深度检测所需的处理能力。您需要确保防火墙在检查数据包时可以轻松管理的带宽容量。最后，与防火墙管理相关的技术可能缺乏足够的灵活性百分比来管理所有攻击。


    ### 应用代理防火墙 (Application proxy firewall)

    这种形式的防火墙可以作为 `HTTP` 或 Web 流量等各种形式应用程序的中间器，拦截每一个请求。它在允许进入之前会对每一个请求进行验证。这种形式的防火墙具有一些入侵防护的主要特征。然而，在完整状态下应用这种防火墙是困难的。每个代理只能处理一种协议，例如传入的
    Web 或电子邮件。为了获得这种防火墙的终极保护，需要接受所有协议，以便实现协议违规拦截。


    ## 防火墙安全及其重要性


    在如今网络攻击可能随时发生的世界里，防火墙安全对于所有服务器和计算机系统都至关重要。窥探者总是在寻找连接到互联网的易受设备。连接到互联网的设备黑客可以通过互联网网关向设备植任何形式的有害代码或恶意软件来轻易攻击。恶意软件攻击可能导致数据泄露和利用。在这种情况下，防火墙非常重要，因为：


    * 它帮助保护系统免受所有形式的未经授权访问。

    * 它有助于识别有害内容并拦截此类内容。

    * 它有助于为多人同时使用的网络建立一个安全的工作环境。

    * 它有助于保护所有类型的机密数据和个人数据。


    '
