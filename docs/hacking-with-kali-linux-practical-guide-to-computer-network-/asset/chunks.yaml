    that in case you want a directory named as DIY Hacking, you need to type it in
    as mkdir DIY\Hacking. You can use rmdir command for deleting the directory which
    you no longer need. However, always keep in mind that rmdir can only be used at
    the time of deleting a directory which is empty in nature. If you want to delete
    one directory which contains files, you need to use rm command.rmYou can use the
    command rm for the purpose of deleting the directories and files. If you want
    to delete the directory only, you need to use rm –r command. When you use the
    rm command, it will delete the folder along with all the files in it.touchThis
    command is used for creating new files. It can be anything, starting from a txt
    file which is empty to an empty form of a zip file. You can use the command like
    touch new.txt.man & - - helpIf you want to know in details about a command and
    how you can use it, you can use the command man. It helps by showing all forms
