    without using the MAC address.Chapter 2: What is Ethical Hacking?![](rsrc3V.jpg)Ethical
    hacking is also called as intrusion testing, penetration testing and also red
    teaming. In simple words, it is the controversial technique of finding out vulnerabilities
    and weaknesses in a system simply by imitating the actions and intent of the malicious
    hackers. An ethical hacker is a person or security professional who uses his skills
    for the purpose of various defensive measures on part of the administrators of
    an information system. An ethical hacker is also known as a white hat or white
    hat hacker. By conducting various tests, an ethical hacker tries to find out the
    answers to the following questions:


    *   What are the locations, systems or information can the attacker gain access?


    *   What will the attacker see before setting his target?


    *   What will the attacker do with the information which is available in the system?


    *   Is anyone able to notice the various attempts made by the attacker to gain
    access?'
