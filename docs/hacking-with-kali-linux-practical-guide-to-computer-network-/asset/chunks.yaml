    # Chapter 9: Applications and Use of Kali Linux


    Kali Linux is a well-known OS in the world of ethical hacking. While it is known
    that the prime focus of Kali Linux is on the summarized use for penetration testing
    along with security auditing, Kali Linux can also perform several other tasks
    apart from these two. Kali Linux has been designed in the form of a framework
    as it comes with various forms of tools which can cover various types of use cases.
    Some of the tools of Kali Linux can also be used in combination at the time of
    performing penetration testing.


    For instance, it is possible to use Kali Linux on various types of computers such
    as on the system of the penetration tester, on the servers of the administrators
    of the system who wants to monitor their own network, on the systems or workstations
    of the analysts related to system forensics and also on the embedded form of devices
    generally along with the `ARM` CPUs which can be easily dropped in the range of
    the wireless network or which can also be plugged in the system of the targeted
    user. Many of the devices related to `ARM` also perform as great machines for
    the purpose of attacking which is mainly because of their small factors of formation
    along with the requirement very low power.


    You can also deploy Kali Linux directly in the cloud for the purpose of quickly
    building a large farm of machines which are able to crack passwords and on the
    mobile phones along with tablets for allowing an efficient form of portable testing
    of penetration. But it does not end here; the penetration testers also require
    servers. The servers are required for using a software of collaboration within
    a large group of penetration testers, for setting up the web server to be used
    for campaigns related to phishing, for the purpose of running the tools related
    to vulnerability scanning and for various other interconnected jobs.


    Once you are done with booting of Kali Linux, you will find out that the main
    menu of Kali Linux has been organized in accordance to various themes across the
    different forms of activities and tasks which are relevant to the penetration
    testers and other professionals of information security.


    ## Tasks that can be performed with Kali Linux


    Kali Linux helps in performing a wide range of tasks. Let’s have a look at some
    of them.


    *   **Gathering of information**: Kali Linux can be used for collecting various
    forms of data related to the targeted networks along with the structure of the
    same. It also helps in identifying the systems of computers, the operating systems
    of such computers along with all the services that the computer system runs. Kali
    Linux can be used for identifying the various potential sensitive parts within
    the system of information along with the extraction of all forms of listings from
    the services of a running directory.

    *   **Analysis of vulnerability**: You can use Kali Linux for the purpose of quick
    testing of whether a remote or any local system has been affected by any known
    vulnerabilities or any form of configuration which is not at all secure in nature.
    The scanners of vulnerability use the databases which contain several signatures
    for the purpose of identifying the potential threats and vulnerabilities.

    *   **Analysis of web application**: It helps in the identification of any form
    of misconfiguration along with weaknesses in the security system of the web applications.
    It is a very crucial task to identify and then mitigate such issues given that
    public availability of such applications makes the same the ideal form of targets
    for all the attackers.

    *   **Assessment of database**: Database attacks are the most common form of vector
    for the attackers that include attacks such as `SQL injection` to attacks in the
    credentials. Kali Linux provides various tools which can be used for testing the
    vector of attacks which ranges from data extraction to `SQL injection` along with
    analysis of the same.

    *   **Password attacks**: The systems connected with authentication are always
    vulnerable to the attacks of the attackers. A wide array of tools can be found
    in Kali Linux which ranges from online tools of password attack to the offline
    tools against the systems of hashing or encryption.

    *   **Wireless form of attacks**: Wireless networks are pervasive in nature. This
    means that they are always a common vector of attack for the attackers. Kali Linux
    comes with a wide range of support related to various cards of the network which
    makes Kali Linux an obvious choice for the attacks in opposition to the several
    wireless network types.

    *   **Reverse engineering**: reverse engineering is a very important form of activity
    which is being used for various purposes. In providing support for the various
    forms of offensive activities, reverse engineering is one of the prime methods
    which is being used for identification of the vulnerabilities and also for tracking
    the development of exploitation. On the side of defense, it is also being used
    for analyzing the malware which is employed for the targeted attacks. Within this
    capacity, the aim is to identify the prime capabilities of a given set of tradecrafts.

    *   **Tools for exploitation**: Exploitation is the act of taking advantage of
    any form of existing vulnerability in a system which allows the attacker to gain
    complete control of a remote form of device or machine. This form of access can
    also be used by the attackers for further privileges of escalation of attacks
    which are done either on any form of machine which is accessible to the local
    network or on the machine which has been compromised. This category of Kali Linux
    function comes with various tools along with utilities which help in simplifying
    the overall process writing up your very own form of exploits.

    *   **Spoofing and sniffing**: Gaining overall access to that packet of data which
    is travelling across any network is always advantageous for the attackers. Kali
    Linux can provide you with various tools for the purpose of spoofing which will
    allow you to imitate any legitimate user along with the sniffing tools which will
    allow you to analyze and also capture the available pool of data directly from
    the network wire. When spoofing as well as sniffing tools are used together, it
    can turn out to be very powerful.

    *   **Post exploitation**: Once you have been successful in gaining all-over access
    to the target system, you might want to maintain the same level of accessibility
    to the system along with extended control simply by moving laterally over the
    network. You can find various tools in Kali Linux for assisting you in your goals
    regarding post exploitation.

    *   **Forensics**: The live boot environments of Forensic Linux have been very
    famous in the recent years. Kali Linux comes with a large number of very popular
    tools of forensics which are based on Linux which will allow you to perform everything,
    starting from the initial stage of triage to imaging of data along with full analysis
    of the system and lastly management of case.

