  trans: "\n\n*   **免费**：Linux 是一种免费软件，因此所有 Linux 发行版都是免费的。Kali Linux 一直是且并将一直是免费的。\n\
    *   **工具丰富**：Kali Linux 可以为你提供超过 600 种不同类型的渗透测试工具以及各种安全分析相关的工具。\n*   **开源软件**：Linux\
    \ 是一种开源软件。因此，作为 Linux 家族的一部分，Kali Linux 也遵循备受推崇的开源模型。操作系统的开发树可以在 Git 上公开查看，Kali\
    \ Linux 提供的所有代码都可以用于微调。\n*   **多语言支持**：尽管渗透工具是用英语编写的，但显而易见的是 Kali Linux 也支持多语言使用。这样做是为了确保更多的用户能够以他们的母语言操作操作系统，并能够找到工作所需的工具。\n\
    *   **完全可定制**：攻击性安全工具的开发者知道，并非每个用户都会同意某种模型设计。因此，Kali Linux 的开发方式允许根据用户的需求和喜好进行完全定制。\n\
    \n## 系统要求\n为了渗透测试目的安装 Kali Linux 非常简单。你只需要确保你拥有所需的硬件套件。Kali Linux 支持 `amd64`、`i386`\
    \ 和 `ARM`。你都需要：\n\n*   安装软件至少需要 20 GB 磁盘空间\n*   至少 1 GB 内存\n*   一个 CD/DVD 驱动器或虚拟机框\n\
    \n## 工具列表\nKali Linux 预装了广泛的工具。让我们来看看一些最常用的工具。\n\n*   `Aircrack-ng`：这是一个用于评估 Wi-Fi\
    \ 网络安全的工具套件。它的目标是与 Wi-Fi 相关的某些安全领域。\n    1.  监控：它可以帮助捕获数据包并将数据导出到文本文件中，以便后续阶段由第三方工具进行处理。\n\
    \    2.  攻击：它通过数据包注入过程帮助重放攻击、伪造访问点、取消认证等各种攻击。\n    3.  测试：它可以帮助检查 Wi-Fi 网卡和其他驱动程序的其他功能。\n\
    \    4.  破解：它可以帮助破解 WPA PSK 和 WEP。\n*   `Nmap`：Nmap 也称为 Network Mapper，是一种用于网络发现和安全审计的开源免费实用程序。Nmap\
    \ 使用 IP 的原始数据包来确定目标网络上有哪些可用主机、这些主机提供了哪些服务、它们使用什么操作系统、使用了何种防火墙或数据包过滤器以及各种其他特征。许多网络和系统管理员还用它来：\n\
    \    1.  网络资产盘\n    2.  管理服务升级计划\n    3.  监控服务或主机的运行时间\n*   `THC Hydra`：当你需要破解远程身份验证服务时，可以使用\
    \ THC Hydra。它能够对包括 HTTP、FTP、SMB 和 HTTPS 在内的 50 种或更多协议执行极快速的字典攻击。它可以被轻松地用于破解无线网络、Web\
    \ 扫描器、数据包制作器等许多领域。\n*   `Nessus`：这是一种远程扫描工具，用于检查计算机的安全漏洞。它无法阻止计算机系统存在的任何形式的漏洞，但它可以通过运行超过\
    \ 1200 次漏洞检查来轻松发现所有漏洞，并在需要进行安全补丁时发送警报。\n*   `WireShark`：这是一个开源数据包分析器，任何人都可以使用且完全免费。通过这个工具，用户可以轻松地看到网络活动，并提供可定制的报告、警报、触发器等。\n\
    \n## Kali Linux 的特性\nKali Linux 是一种 Linux 发行版，随发行版预装了大量的工具。它是为目标用户设计的，以便于功能操作。Kali\
    \ Linux 在很大程度上与其他 Linux 发行版相似，但它包含了一些额外的功能，有助于将其与其他区分开来。让我们来看看 Kali Linux 的一些独特特性。\n\
    \n*   **Live 系统（Live system）**：与其它 Linux 发行版不同，你下载的主 ISO 镜像不仅可以帮助安装操作系统，还可以像启动形式的\
    \ Live 系统一样使用。简单来说，Kali Linux 可以通过通过启动 ISO 镜像直接使用，而无需将其安装到系统中。该发行版的 Live 系统包含了渗透测试人员所需的所有工具。因此，如果你现在的系统没有运行\
    \ Kali Linux 操作系统，你可以通过插入 USB 设备并重启，在你的系统上运行 Kali Linux。\n*   **取证模式（Forensics\
    \ mode）**：在系统上执行任何种与取证相关的工作时，用户通常希望避免任何可能导致被分析系统发生数据更改的活动。遗憾的是，大多数现代桌面环境往往会干扰这一目标，并尝试自动挂载检测到的任何形式的磁盘。为了避免这种行为，Kali\
    \ Linux 带有取证模式，可以在重启菜单中启用它，并将禁用所有此类功能。Kali Linux 的 Live 系统被证明仅对取证目的非常有用，因为可以在不访问或对硬盘进行任何修改的情况下，将任何计算机系统重启到\
    \ Kali Linux 系统。\n*   **Linux 定制内核**：Kali Linux 以提供最新 Linux 内核的定制版本而闻名，该内核基于最新的\
    \ Debian Unstable。这有助于确保对硬件的坚实支持，特别是针对大量的无线设备。Linux 内核通过支持无线注入进行了补丁，因为某些关于无线安全的评估工具往往依赖于这种功能。由于大多数硬件设备都需要更新的固件文件，Kali\
    \ Linux 默认带有安装 Debian 非免费（non-free）部分中可用固件更新的功能。\n*   **可靠的操作系统（Trustable OS）**：这种安全发行版的用户想要知道它是否可以信赖，由于它是完全透明开发的，它允许任何人轻松地检查源代码。Kali\
    \ Linux 由一个非常小的开发者团队开发，他们始终遵循所需的安全规范。开发者还以签名格式上传源码包。\n*   **可定制性**：每位渗透测试人员都有自己的工作方式，并且可能不同意操作系统的默认配置。Kali\
    \ Linux 是完全可定制的，允许用户根据自己的需求进行定制。网上还可以找到各种形式的 live-build 技术，有助于修改操作系统、安装多个其他补充文件、运行任意命令、安装任何其他需要的包以及许多功能。用户还可以定制发行版运行的方式。\n\
    \n"
