    # 最终分析

    尽管利用阶段伴随着大量的验证和检查以确保攻击成功，但仍需要进行最后一次最终分析，以便根据暴露程度对系统漏洞进行分类，并协助制定缓解计划。最终分析阶段将利用阶段与交付物的创建连接起来。需要对整个攻击过程进行全面描述，以构建组织当前安全环境状况的宏观图景，并清晰地表达漏洞。


    ## 交付物

    交付物通过多种方式交流测试结果。某些交付物本质上是简洁简短的，仅提供漏洞列表以及修复方法；而另一种形式的交付物则可能是详细且冗长的，提供系统中可能存在的漏洞列表，并附带关于如何发现漏洞、如何利用漏洞、在系统中存在此类漏洞的结果以及如何解决这种情况的描述。这一阶段实际上由道德黑客用于向组织传达其攻击结果。如果交付物实际上没有让管理员感到震惊，则该测试被视为失败。


    # 第三章：网络安全

    ![](img/rsrc5A.jpg)

    在当今技术创新每天发生的世界上，网络攻击的潜在威胁也以同样的速度增长。在当今漏洞百出的世界里，网络安全在保护系统和网络信息及数据安全方面发挥着至关重要的作用。网络安全无非利用各种工具和技术，保护网络、程序、系统数据和网络免受潜在攻击、损害和各种形式的未经授权访问。网络安全也被信息技术安全。


    ## 网络安全及其性

    大多数组织和机构（如军事、政府、医疗以及金融机构）在计算机系统和数据库中存储大量数据，这些数据可以在网上找到。在大多数情况下，存储在服务器和数据库中的信息本质上是高度的，泄露可能会给相关组织带来严重麻烦。对组织系统和数据库的未经授权访问会导致数据泄露以及组织安全基础设施被利用。


    被攻击的组织可能会丢失所有形式的敏感数据，并完全失去系统的访问权限。随着网络攻击数量日益增加，组织（特别是涉及国家健康安全的组织）需要采取严肃措施来保护所有形式的敏感数据。网络安全是帮助组织保护其所有数据和服务器的最终选择。


    ## 网络安全与加密

    加密是以编码的方式对通信进行处理，使得只有授权方才能解码信息。这是通过使用 `SSL/TLS` 和 `PKI` 协议实现的。之所以如此重要，源于使用 `HTTP`
    协议构建互联网的过程。超文本传输协议或 `HTTP` 与互联网处于同一时代。`HTTP` 是一种通信协议，允许 Web 服务端和网页浏览器进行通信，并以正确的预想方式显示信息。当用户访问网站时，它实际上并不是浏览器中看起来的样子。网站由许多代码构建，这些代码被发送到浏览器，然后由浏览器按照网页设计的意图进行视觉布局。


    `HTTP` 的主要问题是它完全不安全。因此，任何知道该过程的人都可以轻易监视互联网上的 `HTTP` 连接。简单来说，第三方可以轻松读取并操纵客户端与服务器之间通过
    `HTTP` 进行的通信。加密是在通过 `HTTPS` 协议提供网站服务时，实际维护通信的技术。`HTTPS` 是 `HTTP` 的安全版本。所有在 `HTTPS`
    上建立的连接本质上都是加密的。简单来说，任何通过 `HTTPS` 协议进行的通信都是高度安全的。加密防止第三方对通信的监视。如果你从事在线业务并需要获取客户的财务及个人详情，请确保您的网站已加密，这样您的客户在交换详情时就不会面临风险。


    ### 加密过程是如何工作的？

    当网页浏览器访问一个带有 `SSL` 证书的网站时，加密过程便开始了。Web 服务器和浏览器进行所谓的 `SSL 握手`。在初级阶段，网页浏览器验证网站上安装的
    `SSL` 证书在本质上是合法的，并且是由受信任的认证机构颁发的。当网页浏览器确保证书合法性后，它开始与服务器就加密连接的条款进行协商。


    涉及加密时，主要有对密钥。第一对是非对称密钥对，由私钥和公钥组成。这些密钥对于加密本身没有功能，但它们用于身份验证。当网页浏览器测试网站 `SSL` 证书的真实性时，它会确保被质疑的
    `SSL` 证书实际上是公钥的所有者。它通过使用公钥加密一个小数据包来实现这一点。如果 Web 服务器能够使用相应的私钥解密数据包并将其发回，则证明服务器是公钥的所有者，一切被声明已验证。如果
    Web 服务器无法解密数据包，则服务器证书被视为“不可信”。


    另一对密钥是会话密钥。这种形式的密钥在验证了 `SSL` 证书的真实性并协商了所有加密条款后生成。虽然公钥只能用于加密而私钥用于解密，但会话密钥可以同时用于加密和解密功能。与非对称形式相比，会话密钥尺寸较小，本质安全性也较低。然而，会话密钥足够执行这两种功能。服务器和网页浏览器在剩余通信中使用会话密钥。离开网站后，正在使用的会话密钥会被丢弃，并为新的访问生成全新的会话密钥。


    ## 网络攻击类型

    随着技术领域的创新，网络攻击日益增加。今天可以发现各种类型的网络攻击，其中某些最常用，例如 `phishing`、`malware`、`XSS` 等。让我们来看一些最常见的网络攻击类型。


    ### 恶意软件

    恶意软件是有害软件的一种，用于获取受害者系统的访问。恶意软件也可以被称为病毒。一旦恶意软件进入受害者系统，它可能会导致各种灾难，从获得系统的整体控制到监控各种操作、静地窃取敏感数据并可能导致系统完全关闭。攻击者使用各种方法将恶意软件插入目标系统。但也存在各种情况，系统用户被诱骗在系统中安装恶意软件。


    ### 钓鱼攻击

    今天，收到带有各种不良链接和附件的邮件是非常常见的事。这种通过电子邮件发送有害链接和附件的行为被称为钓鱼攻击。在钓鱼攻击中，攻击者向目标发送看起来像可信赖的邮件。大多数邮件都带有链接和附件，点击后会导致系统被安装恶意软件，而系统用户甚至对此一无所知。某些钓鱼链接还可能引导用户进入新网站，该网站可能会要求银行和信用卡详情等机密数据。


    ### XSS

    跨站脚本或 XSS 攻击用于直接针对网站的用户。它与 `SQL` 攻击有些相似，也涉及在网站中注入有害代码。但在 XSS 攻击的情况下，网站本身并没有受到攻击。在
    XSS 攻击中，注入网站的恶意代码仅运行在用户的浏览器中，可用于窃取敏感数据，如用户名、密码、银行详情等。


    ### 恶意软件及其类型

    恶意软件是恶意程序的一种，用于获取受害者的系统访问。网络犯罪分子设计恶意软件的方式可用于窃取数据、破坏计算机功能、绕过访问控制等。


    ### 恶意软件的类型

    今天可以发现各种类型的恶意软件。让我们来看看它们。


