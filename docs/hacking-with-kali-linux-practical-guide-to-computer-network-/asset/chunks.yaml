    line interface or CLI. For opening up the terminal of Linux shell, you need to
    press Ctrl+Alt+T in the Ubuntu distribution or you can also press Alt+F2, type
    in the gnome terminal and then hit enter.Linux CommandsLet’s start with some of
    the most basic commands of Linux.pwdWhen you open up the terminal first, you will
    be in the home directory of the user. For knowing exactly in which directory you
    are in, you can use the command pwd. It helps in giving out the exact path, the
    path which starts exactly from the root. The root is nothing but the base of the
    file system in Linux. It is generally denoted by using a forward slash (/). The
    directory of user generally looks like /home/username.lsBy using the command ls,
    you can easily know what are the files within the directory in which you are in.
    You can also see each and every file which is hidden by using command ls –a.cdYou
    can use the command cd for going to a directory. For example, if you are in the
    folder of home and you wish to go into the folder of downloads, you need to type
    cd Downloads and you will be in the downloads directory. You need to note that
    this command is very case sensitive. You are also required to type in the folder
    name exactly in the way it is in. However, this type of command comes with certain
    problems. For example, you are having a folder named as Raspberry Pi. In such
    case, when you enter the command as cd Raspberry Pi, the Linux shell will assume
    the second argument that comes with the command as a completely different entity
    and so what you will get in return is only an error message that will say that
    there is no such directory.In such cases, you can use the backward slash which
    means use the command as cd Raspberry\Pi. The spaces are taken as : in Linux.
    If you type the command cd only and hit enter, you will get into the home directory
    again. In case you want to go back from a specific folder to a folder just before
    that, you need to use “cd..”. The two dots in the command represent the request
