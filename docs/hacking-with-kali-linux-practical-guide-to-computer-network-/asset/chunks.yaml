    # 内核模式 (Supervisor mode)

    单体内核的内核模式是一个由系统硬件调出的标志位。它可以通过在软件系统级运行代码来轻松修改。所有形式的系统级任务在操作或运行时都带有此标志位。然而，用户空间的应用程序并不带有此标志位。该标志位确保了是否可以执行机器码操作，例如执行禁用中断或修改各种形式的描述符表寄存器等操作。设置两种不同类型操作的核心思想源于“控制权越多，责任越大”。内核模式下的任何程序都受到高度信任，以至于它们永远不会失败，因为任何形式的失败都会导致计算机系统的崩溃。简单来说，内核是负责操作系统所有形式活动的的组件。它由各种类型的模块组成，并直接与底层硬件进行交互。内核提供了所有必要的抽象，目的是向系统或应用程序隐藏硬件的所有低级细节。


    # 系统库 (The System Library)

    系统库由一组本质上非易失性的资源组成，这些资源被计算机系统资源使用，并主要用于软件开发。它包含了数据配置、帮助数据、文档、消息模板等许多。通常，“库”一词被用于描述用计算机语言编写的关于行为的海量实现集合。它具有完美定义的接口形式，有助于调用这些行为。这意味着，任何想要创建高层程序的人都可以轻松地使用系统库来实现系统调用。系统库可以被各种独立形式的程序同时请求，以确保库的编码方式使得即使相关程序之间完全没有链接或连接，多个程序也可以使用该库。简单来说，系统库是由系统实用工具或应用程序构建而成的唯一程序或函数形式，它们可以访问内核的所有功能。这种形式的库实现了与计算机操作系统相关的大多数功能，且它们不需要拥有内核模块的代码访问权限。


    # 系统实用工具 (The System Utility)

    系统实用工具程序负责执行所有形式的个人和特殊级任务。实用工具软件是一种系统软件。它是为了运行计算机系统的应用程序和硬件程序而设计的。系统软件也可以被视为用户应用程序与硬件之间的接口。简单来说，系统实用工具软件是一种用于配置、分析、优化和维护计算机系统的软件。实用工具软件与操作系统协同工作，以支持系统的基础设施，这使其与旨在直接执行造福普通用户任务的应用程序区分开来。


    # Linux 架构的特点 (Characteristics of Linux architecture)

    Linux 具有许多可以极大帮助普通用户的特性。


    ## 多用户能力 (Multuser capability)

    这是 Linux 操作系统最独特的特点，即内存、硬盘等计算机资源可以被多个用户同时访问。然而，用户并不是从单个终端访问资源的。每个用户都获得一个独立的终端来访问和操作资源。每个终端至少包含一个
    VDU（视觉显示用终端）、一个鼠标和一个键盘作为输入设备。所有终端都链接或连接到主服务器（Linux）或主机，主机的资源以及打印机等外围设备可以供用户使用。


    ## 多任务处理 (Multitasking)

    Linux 操作系统具有同时轻松处理各种作业的能力。例如，用户可以执行一个命令来运行巨大的列表，同时在记事本中输入。这是通过实施调度策略结合上下文切换的概念划分
    CPU 时间来智能管理的。


    ## 可移植性 (Portability)

    可移植性是 Linux 操作系统在用户中如此闻名的特性。可移植性并不意味着它可以通过 CD、优 盘或内存卡携带，也不是指文件大小很小。可移植性是指 Linux
    操作系统及其所有应用程序可以在不同类型的硬件上以完全相同的方式运行。Linux 内核和操作系统的应用程序支持在硬件配置最低的系统上安装相同的程序。


    ## 安全性 (Security)

    安全性被认为是任何操作系统最本质的部分。对于所有使用系统执行各种形式机密任务的用户和组织来说，这非常重要。Linux 操作系统提供了各种安全概念，旨在保护用户免受对系统及其数据的任何未经访问。


    # Linux 安全的主要概念 (Main concepts of Linux security)

    Linux 提供了 3 类主要的安全概念。


    *   **身份验证 (Authentication)**：这通过为个人用户提供登录名和密码帮助系统验证用户身份，确保他们的工作不会被任何第三方访问。

    *   **授权 (Authorization)**：在 Linux 操作系统的文件级，对用户有授权限制。每个文件都有写、读和执行权限，决定了谁可以访问文件、谁可以修改文件以及谁可以执行文件。

    *   **加密 (Encryption)**：Linux 操作系统的这一特性有助于将用户文件编码为不可读的格式，称为密文。这确保了即使有人成功打开了系统，文件也是安全的。


