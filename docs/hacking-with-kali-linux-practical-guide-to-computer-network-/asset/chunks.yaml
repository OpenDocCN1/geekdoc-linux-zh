    通信


    Linux 操作系统有一项强大的功能，用于与用户进行通信。它既可以在单台计算机的网络内部进行，也可以在计算机的两个或多个网络之间进行。此类系统的用户可以通过网络无缝地交换数据、邮件和程序。


    # 第 5 章：Linux 操作系统基础


    Linux 是一个简单的操作系统，就像 Windows 等其他操作系统一样。作为一个操作系统，Linux 帮助管理系统的硬件，并提供其他软件运行所需的服务。它被认为是一个实操型的操作系统。例如，如果运行
    Windows 这样的操作系统就像是开自动挡汽车，那么运行 Linux 操作系统就像是开手动挡汽车。这可能需要花费更多的精力，但一旦用户熟练掌握了 Linux
    的运行机制，使用命令行安装软件包就会变得非常简单。


    ## Linux 的历史


    Linux 与 MAC OS X 相似，它们都基于 Unix。Unix 开发于 20 世纪 70 年代初，主要目标是创建一个对各种用户来说既易于访问又安全的操作系统。1991
    年，Linux 的开发目标是分发 Unix 的特性。它作为开源软件发布，至今依然如此。开源软件是指用户完全可见代码的软件，并且可以根据需要进行修改和重新分发。Linux
    只是内核，而不是一个完整的操作系统。内核提供了硬件与用户应用程序请求之间的接口。操作系统的其他部分由工具、GNU 库以及各种其他软件组成。作为一个完整单元的操作系统被称为
    GNU/Linux。


    ## 关于服务器


    用户拥有的 Linode 是一种服务器。服务器本质上就是一种主计算机，帮助在整个网络或跨连接的计算机网络提供各种形式的服务。服务器通常具有：


    * 全天候运行。

    * 通常连接到互联网或一组计算机网络。

    * 包含用于网站托管或其他互联网其他内容的文件和程序。


    由于服务器的作用就像计算机一样，Linode 和家用电脑之间有许多相似之处。一些相似点包括：


    * Linode 通常托管在物理形式的机器上。它位于可用的数据中心池。

    * Linode 使用像 Linux 这样的操作系统。这是另一种类似于 Mac 或 Windows 的操作系统。

    * 就像用户可以轻松地在 PC 上安装各种应用程序一样，Linode 也可以安装应用程序。所有这些安装在 Linode 上的应用程序都有助于执行托管网站等各种任务。

    * 用户可以像在 PC 上一样轻松地创建、编辑和删除文件。用户也可以像 PC 一样在目录之间导航。

    * 就像 PC 一样，Linodes 连接到互联网。


    ## 安装 Linux 之前需要考虑的事


    在安装 Linux 之前，你需要确定想安装哪种 Linux 发行版。Linux 操作系统有多个版本，被称为发行版（distributions）。发行版类似于
    Windows 7 或 Windows XP 等操作系统的版本。操作系统的新版本是升级版本。但在 Linux 中，发行版并不是升级，而是不同的口味（flavors）。多个
    Linux 发行版安装了不同的软件包。


    ## Linux 发行版


    Linux 发行版之间的主要区别在于发行的目标和目的以及安装了哪些软件包，而不是 Linux 内核代码的任何差异。包含 CentOS 和 Fedora 的
    RedHat Linux 以及包含 Ubuntu 的 Debian Linux 之间共享大量的代码。它们的内核在很大程度上相同，GNU 项目的应用程序和用户工具也相似。某些
    Linux 发行版被设计得尽可能极简简单，而另一些则包含了该时代最新且最好的软件。所有 Linux 发行版旨在为用户提供最好的稳定性和可靠性。


    除了发行版的个人特性外，你还需要考虑各种在选择理想发行版时对你有帮助的因素。


    * **发布周期**：不同的 Linux 发行版在不同的时间表发布其操作系统更新。像 Arch Linux 和 `Gentoo` 这样的发行版使用滚动发布模型，当开发者宣布每个包完成或准备就绪时就会发布该包。像
    `Slackware`、`Debian` 和 `CentOS` 这样的发行版旨在为用户提供最稳定且可获得的操作系统，并且频繁发布新版本。`Ubuntu` 和
    `Fedora` 等 Linux 发行版每六个月发布一次新版本。选择适合你的发布周期取决于多种因素。这些因素包括你运行所需的软件、所需的可靠性和稳定性程度以及你所追求的舒适度。

    * **组织结构**：虽然这可能不会直接影响发行性能，但它仍然 Linux 发行版之间最不同的因素之一。某些 Linux 发行版如 `Gentoo`、`Debian`、`Slackware`
    和 `Arch` 由独立开发者社区开发，而另一些发行版如 `Ubuntu`、`Fedora` 和 `OpenSUSE` 则由不同公司赞助的社区开发。`CentOS`
    等发行版源自商业版。

    * **常用工具集**：不同的 Linux 发行版使用不同类型的来执行各种常见任务，如系统配置或包管理。`Ubuntu` 和 `Debian` 使用 `APT`
    管理 `.deb` 包，`OpenSUSE` 使用 `.rpm` 包，`CentOS` 和 `Fedora` 也使用 `.rpm` 包，但使用名为 `yast`
    的工具管理所有这些包。在大多数情况下，你选择的发行版最终将是那个包含你所有所需且你所熟悉的工具的发行版。

    '
- fmt: '

    The distributions are designed for performing in different situations. You are
    required to start with experimenting the distributions for finding out the one
    that fits you the best according to your need.


    ## Linux security

    When you start using a system based on Linux OS, you become the owner of your
    system security. The internet is filled up with people who are waiting to use
    the computing power of your system for satisfying their own goals. Linux offers
    the users with various security options that help the users in securing their
    system and tuning the same according to their need.


    ## Finding your folders and files

    Everything on a Linux system is in the form of a directory. In Linux, a folder
    is termed as a directory. Linux OS uses a well-balanced tree of various nested
    directories for keeping all the files in an organized manner. The directory of
    the highest level is known as the root directory. It comes designated with only
    one single slash`. In Windows OS, you will come across various drives and disks.
    But this is not the case in Linux OS. There are several other sub-directories
    which lie under the root directory. Most of the systems based on Linux come with
    directories which are called as `var` and `lib` along with many others under the
    tree of the root directory.


    The directory of `lib` consists of the system libraries whereas the directory
    of `var` consists of all sorts of files which are available in the system which
    are most likely to change like the mail messages and logs. The directories of
    Linux OS can also go inside the other directories.


    ## Users and permissions

    Linux OS uses a very powerful system for the users and its permissions for making
    sure that only the right people get access to the system files. As the owner of
    your Linux system, you can set the users and permissions for every directory.
    The file access system in Linux comprises of three categories:


    *   **Users**: A user account is assigned generally to a person or also to an
    application which requires access to the files in the system. You can provide
    user access to the system as many numbers you want.

    *   **Groups**: A group is the collection of one or more than one user. Groups
    are a great way of granting the same kind of access to various users at one time
    without the need for setting permissions for each individually. When you create
    an account of user, it gets assigned to a default group which comes with the same
    name as that of the name of the user. A user can be a part of as many groups as
    the user wants. Users who belong to a group get all the permissions which are
    granted for that specific group.

    *   **Everyone**: This category is for everyone other than the groups and users.
    When someone accesses the system files without even logging in the system as one
    specific user, they fall into the category of everyone.


    The next important thing that comes right after users is permissions. Each and
    every directory and file in a Linux system comes with three probable levels of
    access:


    *   **Read**: All the files that come with the permission of read can be viewed.

    *   **Write**: All the files that come with the permission of write can be edited.

    *   **Execute**: All the files that come with the permission of execute can be
    executed or run just like an application. When you start a new script or program,
    you start executing it.

    '
