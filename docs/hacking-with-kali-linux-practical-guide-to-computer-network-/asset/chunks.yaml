    ### Fierce

    Fierce is a tool from Kali Linux which is used for the purpose of port scanning
    along with network mapping. It can also be used for discovering the hostnames
    and non-contiguous space of IP across any network. It is somewhat similar in features
    just like `Unicornscan` and `Nmap` but unlike these two, Fierce is specifically
    being used for the corporate networks. After the target network has been defined
    by the penetration tester, Fierce runs various tests in opposition to the domain
    which are selected for retrieving important information which can be used for
    the further analysis and post exploitation. The features of Fierce include:


    1. Scanning of internal and external IP ranges

    2. Capability of changing the DNS server for the purpose of reverse lookup

    3. Scanning of IP range and complete Class C

    4. Helps in logging capabilities into a file system

    5. Discovery of name servers and attack of zone transfer

    6. Capabilities of brute force by using the custom list of texts


    ### OpenVAS

    Also known as Open Vulnerability Assessment System, is a free software which can
    be used by anyone for the purpose of exploring the remote or local vulnerabilities
    of a network. This tool of security helps in writing and also integrating the
    customized plugins of security to the platform of OpenVAS. The main features of
    OpenVAS are:


    1. It works as a port scanner and network mapper

    2. It helps in discovery of simultaneous host

    3. It supports `OpenVAS` protocol of transfer

    4. It comes integrated with databases of SQL such as `SQLite`

    5. It performs weekly or daily scans

    6. It helps in exporting the results into HTML, XML or LateX formats of files

    7. It comes with the capability of resuming, pausing and stopping the scans

    8. It is fully supported by both Linux and Windows


    ### Nikto

    Nikto is written in Perl and is a tool which is included in Kali Linux, it works
    as a complementary tool to OpenVAS and to other tools of vulnerability scanner.
