    to edit a file such as viz. alba-base.conf, which requires root permissions, you
    can type in sudo nano alba-base.conf.  You can enter the command line of root
    by using sudo bash and then type the password of the user. You can also su command
    for doing the same but you are required to set in one root password before doing
    that. For setting the password, you need to type sudo passwd and then type in
    the new password of root.dfYou can use the df command for seeing the disk space
    which is available in every partition of the system. You just need to type df
    in the command line and then you can easily view each of the mounted partition
    along with the available and used space indicated in % along with in KBs. If you
    want to view the same in megabytes, type in df –m.duThis command is used for knowing
    the usage of the disk by a file in the system. In case you are required to know
    the disk usage for one specific file or folder in the system of Linux, type in
    du followed by the folder or file name. For example, if you need to know the disk
    usage which is being used by the folder documents in the system of Linux, type
    in du Documents. You can also use ls –lah command for viewing the size of the
    files within a folder.zip & unzipYou can use the command zip for compressing a
    file into an archive of zip. For the purpose of extracting files from zip archive
    use the command unzip.unameYou can use this command for showing all the information
    about that system in which your Linux distribution is running. You can type in
    uname –a for printing the majority of the information about a system.Chapter 7:
