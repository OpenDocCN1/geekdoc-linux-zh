    Send in another packet of `SYN+ACK` to the host of zombie and then evaluate the
    final value of `IPID` of the `RST` response which has been returned. In case the
    value has been increased by one, the port on the target scan is closed and in
    case the value has been increased by two the port on the target scan is in open
    state. For performing a zombie form of scan, an initial request of `SYN/ACK` is
    required to be sent to the system of zombie for the purpose of determining the
    current value of `IPID` within the returned packet of `RST`. A spoofed packet
    of `SYN` is then sent out to the scan target along with a form of source IP address
    of the system of zombie. As the zombie actually did not send out the initial request
    of `SYN`, it will be interpreting the response of `SYN/ACK` as being unsolicited
    and then send a packet of `RST` back to the system of target and thus increasing
    the value of `IPID` by one. At the final stage, another packet of `SYN/ACK` needs
    to be sent to the system of zombie which will return a packet of `RST` and then
    increase the value of `IPID` by one.


    # Chapter 13: Penetration Testing


    Each and every infrastructure of IT comes with some weak points which can ultimately
    lead to some serious attack and can be used for the purpose of stealing and manipulating
    data. Only one thing can be done in such situations which can help in preventing
    the hackers from entering the system. You need to perform regular checks of the
    infrastructure of your security and make sure that there is no form of vulnerabilities
    present in the structure. Penetration testing helps in finding out the vulnerabilities
    along with the several weak points in a system. As the owner or administrator
    of a network, they can always have some advantage over the hackers as they are
    bound to know the topology of network, the components of infrastructure, the services,
    the probable points of attack, the executed services and many more. Penetration
    testing is done within a real and secure environment so that in case any vulnerability
    is found, you can mend the same and secure the system.


    ## Penetration testing in details


    As the name goes by, penetration testing is the process of testing a system to
    find out whether penetration by any third party is possible in the system or not.
    Penetration testing is often mixed up with ethical hacking as both are somewhat
    similar in features and functioning. The motive of are also the same but a very
    thin line differentiates the two. In penetration testing, the tester scans for
    any form of vulnerability in the system, malicious form of content, risks and
    flaws in the concerned system. Penetration testing can be performed either in
    an online network or server or a computer system as well. Penetration testing
    comes with the goal of strengthening the security system of an organization for
    the motive of properly defending the security of a system. Unlike hacking, penetration
    testing legal in nature and is done with all forms of official workings. If used
    in the proper way it can do wonders. Penetration testing can be considered as
    a significant part of ethical hacking.


    Penration testing needs to be performed at regular intervals as it comes with
    the power of improving the capabilities of a system and also improves the strategies
    related to cyber security. Various types of malicious content are created for
    the purpose of fishing out the weak points which are available within a program,
    application or system. For effective testing, the malicious content which is created
    is spread across the entire network for vulnerability testing. The process of
    penetration testing might not be able to handle all the concerns related to security;
    however, it can help in minimizing the probable chances of any form of attack.
    It helps in making sure that a company is safe from all forms of vulnerabilities
    and thus protecting the same from cyber attacks. It also helps in checking whether
    or not the defensive measures are enough for the organization and which of the
    security measures are required to be changed for the motive of decreasing the
    vulnerability of the system. Penetration testing is really helpful in pointing
    out the strengths along with the weaknesses in the structure of an organization
    at any one given point of time. You need to note that this whole process if not
    at all casual in nature. It includes rigorous planning, granting of the required
    permissions from the concerned management and then initiating the process.


    ## Security scanners


    The process of penetration testing starts after an overview of the complete organization
    has been collected and then the process of searching for the specific weak points
    starts. For performing all these, you are required to use a security scanner.
    Depending on the type and nature of the security scanners, the tools can actually
    help in checking an entire system or network for the weak points which are known.
    One of the most comprehensive forms of tool for security scanning is `OpenVAS`.
    This tool comes with the idea of a huge number of vulnerabilities and can also
    check for the defenses. After the `OpenVAS` tool has identified all the open form
    of tools, you can easily use `Nmap` for discovering the details. A tool like `Wireshark`
    will allow you to find out any form of content which is critical in nature along
    with any critical form of network activity which can point out certain patterns
    of attack.


    The classic form of `Wireshark` tool is also useful in identifying the bottlenecks
    which can indicate the attacks of the hackers and also requires a continuous check.
    In the world of corporate organizations, the applications which are based on the
    web often depend on `MySQL`, `Apache` and stack of `PHP`. All these platforms
    dominate the entire landscape. Such platforms are the favorite targets of the
    hackers as they usually come with great opportunities of attacks. `Kali Linux`
    comes with around two dozen tools which specialize in web application testing.
    Such scanners can be easily found in the menu of Web Application Analysis. The
    `w3af` and `Burp Suite` are regarded as the best tools of the lot.


    `Burp Suite` helps in the identification and testing of the vulnerabilities and
    is quite easy to use. Brute force attack can be launched from the module of the
    intruder which takes help of the request records which are grouped in the proxy
    intercept tab for the purpose of injecting the required payload in the system
    of the web. It also helps in detecting configurations of poor security. Configuration
    of incorrect nature of the security settings can take place at any of the levels
    of the stack of application. For the purpose of detecting these vulnerabilities,
    `Burp Suite` starts with the identification of the target and then executes the
    `Spider` command from the menu of context. The outputs which can be found from
    the scans can help you in finding out the misconfigurations in the system.


    Generally, a great amount of caution is needed at the time of product system analyzing
    with the security scanners which are not designed in a way for getting handled
    by the kid hands. Although various actions serve for identifying the points of
    attack, you can expect that the concerned system which is being tested might also
    get affected. So, you are required to perform all these tests within mirrored
    form of systems. Generally, the mirrors of the systems are secured by the firewall
    and IDS of the system of production, so you can also check the overall effectiveness
    of the protection mechanisms which are existing already. Several forms of tools
    can run in various modes which might make it difficult for the IDS to properly
    detect the scans. While running in the intelligent modes, they often fail to get
    detected.


    ## Sounding the weak points


    After you have found out that where are the gaps present in the system of security,
    the next step that you need to perform is to sound all of them out. An important
    portion of the penetration tests is the using of the tools which helps in stimulating
    as many patterns of attack as possible which are known. `Metasploit` can be regarded
    as the most widely used form of tool for penetration testing and is also a great
    tool for the penetration testers.


    # Chapter 14: VPN


    `VPN` or virtual private network is the method of connection which is used for
    adding privacy along with security to any public or private form of network like
    the internet or hotspots of Wi-Fi. `VPNs` are most widely used by the corporations
    for the purpose of protecting various forms of private and sensitive data. However,
    in the recent years, the craze of using private VPN is increasing day by day.
    This is mainly because of the fact that all those interactions which were face
    to face in the beginning now transformed to the internet form of communication.
    Privacy increases with the use of `VPN` as the IP address of the initial system
    get replaced with the IP address which is provided by the provider of a virtual
    private network. The subscribers can get an IP address from any city they want
    from the provider of `VPN` service. For example, you are living in San Francisco
    but with service provided by virtual private network, you can look like that you
    live in Amsterdam, London or any other city.


    ## Security


    Security is the prime reason for which the corporations have been using the services
    of VPNs for years. There are various simple ways on which data traveling to a
    network can be intercepted. `Firesheep` and Wi-Fi spoofing are the two easiest
    ways in which information can be hacked. For a better understanding of the concept
    of `VPN`, a firewall helps in protecting a system along with data on the computer
    while a `VPN` helps in protecting all forms of data on the internet or on the
    web. `VPNs` cater with the help of various advanced forms of encryption protocols
    and techniques of tunnel security for the purpose of encapsulating all the transfers
    of online data.


    ## Setting up a VPN


    The setting up of a `VPN` is a pretty simple job. It is most often as easy as
    entering the username and password. The dominant nature of smartphones can easily
    configure `VPNs` by using the `L2TP/IPsec` and `PPTP` protocols. All forms of
    major OS can configure VPN `PPTP` connection. `L2TP/IPsec` and `OpenVPN` protocols
    need a small application which is of open source nature and the certifications
    to be separately downloaded.


    ## Protocols of VPN


    The available pool of protocols along with the features of security tends to grow
    with the flow of time. The most widely found protocols are:

