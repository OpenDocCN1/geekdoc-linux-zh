    ![](img/rsrc7.jpg) # 使用 Kali Linux 进行黑客

    面向初者的计算机网络攻击、加密、网络安全与渗透测试实用指南。VPN 服务、防火墙和 Linux 命令行中的秘密


    ## 目录

    - [引言]

    - [第 1 章：黑客基础]

    - [不同类型的黑客]

    - [常用的黑客工具]

    - [黑客技术]

    - [第 2 章：什么是伦理黑客?]

    - [第 3 章：网络安全]

    - [网络安全与加密]

    - [常见的网络攻击类型]

    - [恶意软件及其类型]

    - [第 4 章：Linux 架构]

    - [第 5 章：Linux 操作系统基础]

    - [第 6 章：基础 Linux 命令]

    - [第 7 章：Kali Linux 的特征以及为什么它在黑客世界中如此重要]

    - [第 8 章：Kali Linux 的安装]

    - [第 9 章：Kali Linux 的应用与使用]

    - [第 10 章：Kali Linux 的不同工具]

    - 第 11 章：如何使用 Kali Linux 进行黑客攻击？

    黑客攻击无非对网络或计算机进行未经授权的入侵，这种入侵由被称为黑客的攻击者执行。攻击者试图攻击那些受到威胁的系统。他们时刻睁着窥探的眼睛，到处寻找漏洞。他们可以以个人身份行动，也可以作为一个小组工作。不仅如此，黑客还作为组织的一部分运作，其目的是破坏其他组织的功能。大多数时候，他们试图修改组织的系统，并目标其安全基础设施以攻破信息并获取访问权限。然而，黑客不仅作为攻击者工作，还利用其技能寻找系统内部的弱点以及各种漏洞。此也是为了发现并修复弱点，以防止各种形式的恶意攻击进入系统。


    ### 不同类型的黑客

    黑客世界中有很多类型的黑客，他们执行不同的功能。黑客的类型有助于定义系统与试图攻击这些系统之间的关系。最常见的黑客类型有：


    *   **黑帽黑客 (Black Hat Hackers)**：“黑帽”一词源于旧西部电影，电影中的反派通常戴着黑帽子。黑帽黑客作为个体行动，试图未经授权访问组织或网络的系统，目的是出于各种恶意原因利用安全基础设施。这种类型的黑客在破坏目标时没有获得任何形式的授权或许可。他们试图通过破坏安全系统的基础设施、关闭系统或修改网站或网络的主要功能来造成破坏。黑帽黑客的主要意图是获得完全访问权限或盗取财务信息、访问各种密码或获取其他形式的个人数据的洞察。

    *   **白帽黑客 (White Hat Hackers)**：白帽黑客是第二类黑客，但他们扮演的是好人。白帽黑客与各种组织合作，旨在加强任何系统的安全性。白帽黑客拥有各种许可来接触目标，并在提供的规则边界内对其进行渗透测试。白帽黑客也被称为伦理黑客（ethical
    hackers）。伦理黑客精通这一领域，拥有各种用于黑客的伦理工具和技术。他们使用特殊的方法来保护组织的信息系统。与黑帽黑客相反，伦理黑客在获得合法许可执行后，会利用网络安全系统并检查后门。伦理黑客总是指出他们从组织系统中挖掘出的所有形式的漏洞，以确保漏洞得到修复，防止被恶意攻击者利用。

    *   **灰帽黑客 (Grey Hat Hackers)**：灰帽黑客与黑帽黑客一样获取组织和网络安全系统的访问。但灰帽黑客执行此类行动时并没有恶意意图，并将漏洞和漏洞告知执法机构或各种情报机构。灰帽黑客通常在网上浏览并攻击计算机系统，以通知网络或系统管理员该系统包含需要修复的各种漏洞。灰帽黑客可能还会通过提供缺陷信息来勒索被攻击的系统。


    ### 常用的黑客工具

    为了完成黑客行为，黑客实施了各种技术。让我们来看看其中一些。


    *   **Rootkits (Rootkits)**：Rootkit 作用像一个程序或一组巨大的软件，允许攻击者获得直接连接或与互联网交互的系统的完全访问权限或控制。Rootkit
    最初作为一种后门进程系统引入，用于解决软件方面的各种问题。然而，今天这种软件被黑客广泛用于从实际所有者或管理员手中破坏系统的功能和控制。有多种方法可以将 rootkit
    安装到受害者的系统中。安装 rootkit 最常见的方法是实施钓鱼攻击并结合社交工程。一旦 rootkit 安装在受害者的系统中，攻击者就可以秘密访问系统并控制其整体运行，从而轻松地窃取机密数据和信息，还可以完全关闭系统。


    '
- fmt: '

    ### Malware Types


    - Keyloggers: This is a very special type of tool which has been designed for
    recording and logging each and every key pressed on the victim system. The keyloggers
    record the stroke of the keys by staying attached to the Application Programming
    Interface or `API`. It tracks the key strokes when anything is being typed by
    using the keyboard in a system. The files which are recorded are then saved which
    contains various forms of information such as details regarding website visit,
    usernames, the record of opened applications, screenshots, bank details and many
    more. The keyloggers are also capable of capturing the personal messages, credit
    card details, passwords, mobile numbers and various other details which are generally
    typed in a system. The keyloggers generally arrive as a malware which allows the
    cybercriminals to breach all forms of sensitive data.


    - Vulnerability scanner: A vulnerability scanner is used for the purpose of classifying
    and then detecting various forms of weaknesses in a system, network, communication
    system, computers etc. This is one of the most common forms of tool which is being
    used by the ethical hackers for finding out the potential vulnerabilities and
    loopholes and then fixes them up on urgent basis. However, a vulnerability scanner
    can also be used by the black hat hackers for checking the vulnerabilities and
    weak spots within a system and then finding out the proper tool for exploiting
    the same.


    ### Techniques of Hacking


    There are various techniques which are being used by the hackers for exploiting
    a system.


    - SQL Injection: `SQL` or structured query language has been designed for the
    purpose of exploiting various forms of data in the database of the victim. This
    form of attack falls under the cyber attack which targets the databases via the
    statements of `SQL` for tricking the systems. This form of attack is generally
    carried out by the use of website interface which attempts in issuing the commands
    of `SQL` through a database for hacking the passwords, usernames and other related
    information related to the database. All those websites along with web applications
    which are coded poorly are very much prone to the SQL injection attacks. This
    is because the applications which are based on the web contains various user input
    fields like login pages, search pages, request forms related to support and products,
    comments section and many others which are very much susceptible to the attacks
    and can be very easily hacked by simple manipulation of the codes.


    - DDoS or Distributed Denial of Service: It is a form of hacking attack in which
    the normal traffic of a server is distorted from entering the server and floods
    the traffic of the network. This ultimately results in denial of service as it
    serves just like a traffic jam which clogs the roads and also prevents the regular
    form of traffic from reaching the destination. All the devices of today such as
    `IoT` devices, computers, mobile phones etc. which connects with the network are
    very much prone to the attacks of `DDoS`.


    - MAC Spoofing: Each and every form of device which are used by the people today
    come with network interface controller or `NIC`. It helps the users to connect
    with the network such as with the internet directly. The `NIC` of each device
    is accompanied with a `MAC` address which is assigned after various processes
    of hard coding. The `MAC` spoofing attack is a very deadly form of attack in which
    the hackers hide themselves and their system behind a customized and false `MAC`
    address. This reduces the risks on the part of the hackers from getting caught.
    So, you might give access to a new system thinking of it to be absolutely legitimate
    but it might happen that a hacker will hide himself behind a false `MAC` address
    which you cannot even realize.


    By using this technique, the hackers can easily hack internet connection via `Wi-Fi`
    and can also gain access to all those devices which are connected to each other
    via `LAN`. The technique of `MAC` spoofing also leads to several forms of other
    serious crimes in which the hackers steal the identity of someone else and carries
    on with some serious form of data breaching in which someone will be held as guilty
    without even knowing about the actual hacker. However, there are various `OS`
    in the market today such as `MAC` and `Windows` which can easily connect with
    the `LAN` without using the `MAC` address.


    ### Chapter 2: What is Ethical Hacking?!


    Ethical hacking is also called as intrusion testing, penetration testing and also
    red teaming. In simple words, it is the controversial technique of finding out
    vulnerabilities and weaknesses in a system simply by imitating the actions and
    intent of the malicious hackers. An ethical hacker is a person or security professional
    who uses his skills for the purpose of various defensive measures on part of the
    administrators of an information system. An ethical hacker is also known as a
    white hat or white hat hacker. By conducting various tests, an ethical hacker
    tries to find out the answers to the following questions:


    - What are the locations, systems or information can the attacker gain access?

    - What will the attacker see before setting his target?

    - What will the attacker do with the information which is available in the system?

    - Is anyone able to notice the various attempts made by the attacker to gain access?

    '
