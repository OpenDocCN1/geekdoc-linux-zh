    这些发行版的设计是为了适应不同的场景。您需要从尝试这些发行版开始，根据您的需求找到最适合您的一个。


    ## Linux 安全

    当你开始使用基于 Linux 操作系统的系统时，你就成了自己系统安全的负责人。互联网上充斥着想要利用你的系统计算能力来实现个人目标的人。Linux 为用户提供了各种安全选项，帮助用户保护其系统并根据需求进行调整。


    ## 查找你的文件夹和文件

    Linux 系统中的一切都以目录的形式存在。在 Linux 中，文件夹被称为目录。Linux 操作系统使用一个平衡良好的各种嵌套目录树，以组织化的方式保留所有文件。最高层级的目录被称为根目录，它仅用单个斜杠`/`
    标识。在 Windows 操作系统中，你会遇到各种驱动器和磁盘，但在 Linux 操作系统中并非如此。根目录下还有其他几个子目录。大多数基于 Linux 的系统在根目录树下都带有名为
    `var` 和 `lib` 等许多目录。


    `lib` 目录由系统库组成，而 `var` 目录包含系统中各种可能变化的文件，例如邮件消息和日志。Linux 操作系统的目录也可以包含在其他目录内部。


    ## 用户与权限

    Linux 操作系统使用了一套非常强大的用户及其权限系统，以确保只有正确的人才能访问系统文件。作为 Linux 系统的所有者，你可以为每个目录设置用户和权限。Linux
    中的文件访问系统包含三类：


    *   **用户 (Users)**：用户账户通常被分配给个人或需要访问系统文件的应用程序。你可以根据意愿为系统提供任意数量的用户访问权限。

    *   **组 (Groups)**：组是一个一个或多个用户的集合。组是一种一次性向多个用户授予相同访问权限极极方法，无需为每个用户单独设置权限。当你创建一个用户账户时，它会被分配到一个默认组，该组的名称与用户名相同。用户可以加入任意数量的组。属于某个组的用户将获得该特定组的所有权限。

    *   **所有人 (Everyone)**：这一类适用于组和用户之外的所有人。当有人在甚至没有以特定用户登录系统的情况下访问系统文件时，他们属于“所有人”类别。


    紧随用户之后的重要事项是权限。Linux 系统中的每一个目录和文件都有三种可能的访问级别：


    *   **读 (Read)**：所有具有读取权限的文件都可以查看。

    *   **写 (Write)**：所有具有写入权限的文件都可以编辑。

    *   **执行 (Execute)**：所有具有执行权限的文件都可以像应用程序一样执行或运行。当你启动一个新的脚本或程序时，你就在执行它。

