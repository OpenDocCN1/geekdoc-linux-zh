    ## 4. 应用、操作系统和系统服务检测


    ## 5. 使用自定义数据集的能力


    ## 6. 支持 SQL 的关系型输出


    ### Fierce

    Fierce 是 Kali Linux 中的一个工具，主要用于端口扫描和网络制图。它还可以用于发现任何网络中的主机名和非连续的 IP 空间。它在功能上与 `Unicornscan`
    和 `Nmap` 类似，但与这两个工具不同，Fierce 专门为用于企业网络而设计。在渗透测试人员定义了目标网络后，Fierce 会针对该域运行多种测试，以获取可用于进一步分析和后渗透利用的重要信息。Fierce
    的功能包括：


    1. 扫描内部和外部 IP 范围

    2. 更改 DNS 服务器以进行反向查找的能力

    3. 扫描 IP 范围和整个 C 类网

    4. 帮助将日志功能保存到文件系统中

    5. 发现名称服务器并进行区域传输攻击

    6. 使用自定义文本列表进行暴力破解的能力


    ### OpenVAS

    又名为开放漏洞评估系统（Open Vulnerability Assessment System），是一个任何人都可以使用的用于探索网络远程或本地漏洞的免费软件。该安全工具有助于编写并将自定义的安全插件集成到
    OpenVAS 平台中。OpenVAS 的主要功能是：


    1. 它作为一个端口扫描器和网络制图工具工作

    2. 它有助于发现同时在线主机

    3. 它支持 `OpenVAS` 传输协议

    4. 它集成了 `SQLite` 等 SQL 数据库

    5. 执行每周或每日扫描

    6. 帮助将结果导出为 HTML、XML 或 LateX 格式的文件

    7. 具有恢复、暂停和停止扫描的能力

    8. 完全支持 Linux 和 Windows


    ### Nikto

    Nikto 用 Perl 语言编写，是 Kali Linux 中包含的工具，作为 OpenVAS 以及其他漏洞扫描工具的补充工具使用。它允许渗透测试人员和道德黑客对整个
    Web 服务器进行扫描，以发现漏洞和安全缺陷。该工具通过寻找应用程序和文件的不安全模式、过时的服务器软件以及软件和服务器的默认名称和配置错误来收集所有安全扫描结果。它还支持用于
    SSL 加密的各种代理服务器、基于主机的身份验证等许多其他功能。Nikto 的主要功能是：


    1. 它帮助扫描服务器上可用的多个端口

    2. 它带有 IDS 规避技术

    3. 它提供 XML、TXT、NBE、HTML 和 CSV 格式的输出结果

    4. 它带有 Apache 和 `cgiwrap` 用户名的枚举

    5. 它对指定的 CGI 目录进行扫描

    6. 它可以通过文件、Fav 图标（favicons）和标头识别系统中安装的软件

    7. 它使用自定义的配置文件

    8. 它帮助调试并提供详细输出


    ### WPScan

    WPScan 用于审计 WordPress 安装的安全性。通过 `WPScan` 的帮助，你可以轻松地发现你的 WordPress 设置是否容易受到任何形式的攻击，或者它是否在核心、主题文件或插件中泄露了过多信息。该工具还允许用户找到每个注册用户的弱密码，并可以运行暴力攻击以找出哪些密码可以被破解。WPScan
    的功能是：


    1. 枚举 WP 用户名

    2. 非侵入性的安全扫描

    3. 枚举 WP 插件漏洞

    4. 弱密码破解和 WP 暴力攻击

    5. WordPress 安全扫描的调度


    ### CMSMap

    CMSMap 是一个用 Python 编写的开源项目。它有助于自动化 Joomla、WordPress、Moodle 和 Drupal 的漏洞扫描和检测任务。该工具还可以用于运行暴力攻击，并在发现漏洞后进行各种利用。CMSMap
    的主要功能是：


    1. 它支持多种威胁扫描

    2. 它具有设置自定义标头的能力

    3. 它支持 SSL 加密

    4. 将输出保存为文件


    ### Fluxion

    该工具作为 Wi-Fi 分析器工作，专门用于 WPA 的中间人攻击（MITM）。它允许用户轻松扫描无线网络。与其它 Wi-Fi 破解工具相比，该工具通常不需要大量时间。与其启动暴力攻击，该工具会生成
    `MDK3` 进程，确保连接到 Wi-Fi 的用户被取消身份验证（deauthenticated）。之后，该工具会将 Wi-Fi 密码发送给你，这样你就可以轻松获得访问。


    除了这些工具外，Kali Linux 还有许多工具，如 `Aircrack-ng`、`Kismet Wireless`、`Wireshark`、`John
    the Ripper` 等。


    ## 第 11 章：Kali Linux 如何用于黑客攻击


    我们大家都知道 Kali Linux 是专为渗透测试和安全审计而设计的，它也可以用于道德黑客所需的测试。Kali Linux 包含了大量工具，有助于组织或公司的安全基础设施测试和其他形式的测试。


    ### 谁在使用 Kali Linux？为什么要用？

    Kali Linux 可以被认为是今天发现的最独特的操作系统形式，因为它 是一个好人和坏人都可以使用的平台。安全管理员和黑客客都使用该平台来满足他们的需求。一个人使用该系统是为了防止和检测安全基础设施的泄露，而另一个人使用该操作系统是为了识别并借此利用漏洞。Kali
    Linux 包含的大量工具被认为是安全专业人士工具箱中的瑞士刀。广泛使用 Kali Linux 的专业包括：


    * **安全管理员**：负责保护机构的信息和数据。安全管理员广泛使用 Kali Linux 来确保安全环境中不存在任何形式的漏洞。

    * **网络管理员**：负责维护安全高效的网络。网络管理员使用 Kali Linux 进行网络审计。例如，Kali Linux 可以轻松检测到非法接入点。

    * **网络架构师**：这些人负责为网络设计安全环境。他们使用 Kali Linux 审计内部网络设计，并确保没有配置错误或遗漏。

    * **渗透测试人员**：渗透测试人员使用 Kali Linux 审计安全环境，并对他们负责的企业环境进行侦察。


