    *   Worm: Worm is a form of virus which is being used by the cybercriminals for
    the purpose of replicating themselves. Worms use computer networks for spreading
    and can lead to stealing or deletion of data. Many of the worms are also being
    designed for spreading only through the systems and do not lead to any form of
    harm to the systems.


