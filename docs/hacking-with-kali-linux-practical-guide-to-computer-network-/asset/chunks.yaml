    # 第 8 章：Kali Linux 的安装


    如果你正在考虑将信息安全作为你的职业，你首要需要的是一个专注于系统安全的操作系统。在合适的操作系统的帮助下，你可以轻松且高效地执行各种形式的繁琐且耗时的工作。在目前，有多种基于
    Linux 的操作系统可供选择。在今天看到的几个发行版中，Kali Linux 被认为是信息安全和渗透测试的最佳选择。它被专业渗透测试人员和伦理黑客广泛用于执行与他们领域相关的各种活动，以及网络安全评估。


    Kali Linux 被认为是 Linux 家族中领先的发行版，也被用于安全审计。Kali Linux 是唯一一种与伦理黑客和网络安全相关的操作系统，它预装了多种类型的命令行攻击工具，这些工具对于完成各种信息安全任务是必不可少的。Kali
    Linux 最常用的任务包括应用安全、渗透测试、计算机系统取证以及网络安全。简单来说，Kali Linux 是专为伦理黑客设计的唯一终极操作系统。


    与伦理黑客和渗透测试世界的人出于特定原因使用 Kali Linux。Kali Linux 带有超过 600 种渗透测试工具。最棒的部分是 Kali Linux
    是 100% 可定制的。因此，如果你不喜欢 Kali Linux 的当前配置，可以按照你想要的方式对其进行自定义。关于 Kali Linux 的另一个有趣点是它支持多语言。尽管工具是用英语编写的，但这允许来自所有地区的人员使用自己的母语言使用该操作系统。它还支持广泛的无线设备集合。Kali
    Linux 是一个在安全环境中开发的操作系统。让 Kali Linux 如此受欢迎的原因是它的开源软件特性，而且是免费的。它还带有一个自定义内核，该内核也可以为了注入目的进行补丁。


    ## 如何安装 Kali Linux？


    在你的系统中安装 Kali Linux 的过程非常简单直接。用户还可以享受几种软件安装选项。最理想的安装选项包括：


    *   使用硬盘安装 Kali Linux

    *   通过创建可启动的 Kali Linux USB 启动盘安装 Kali Linux

    *   使用 `VirtualBox` 和 `VMware` 等虚拟化软件安装 Kali Linux

    *   通过与操作系统双引导的过程安装 Kali Linux


    安装 Kali Linux 最广泛使用的选项是使用 USB 驱动器以及使用 `VirtualBox` 或 `VMware` 安装。如果你使用 `VirtualBox`
    或 `VMware`，你的系统硬盘中至少需要 20 GB 的可用空间，以及至少 4 GB 的内存。你还需要 USB 以及 CD/DVD 的支持。


    ### 借助 VMware 安装 Kali Linux


    *   在你想要在系统中运行 Kali Linux 之前，你首先需要一个虚拟化软件。在选择虚拟化软件时，现在有多种选择。你可以从 Oracle 公司开始安装
    `VMware` 或 `VirtualBox`。在安装完虚拟化软件后，你需要从应用程序文件夹中启动它。

    *   现在你需要下载 Kali Linux 的安装文件，你可以从 Kali Linux 官方网站的下载页面轻松找到它。你可以选择你认为符合你需求的某一个。除了下载页面上的下载文件，你还会遇到许多用于安全相关工作的十六进制数字。你需要检查将要下载的镜像的完整性。你需要检查文件的
    `SHA-256` 指纹，然后将其与 Kali Linux 下载页面上提供的指纹进行比对。

    *   在你下载完 Kali Linux 的安装文件后，现在需要启动虚拟机了。为此，你需要打开 `VMware Workstation Pro` 首页，然后选择“创建新虚拟机”。在创建新虚拟机后，你需要选择
    Kali Linux 的 iso 文件，然后选择客机操作系统。你还需要配置虚拟为 Kali Linux 的该虚拟机的所有细节。现在你只需通过选择 Kali
    Linux 虚拟机并点击绿色的电源按钮即可启动 Kali Linux 虚拟机。

    *   虚拟机启动后，会弹出一个菜单，你你需要在 `GRUB` 菜单中选择首选的安装模式。你需要选择“图形化安装”（graphical install）。点击“继续”。

    *   接下来的几个屏幕将要求你选择本地化信息，例如你希望安装 Kali Linux 的首语言、你所在的国家以及键盘布局。

    *   一旦完成所有所需的本地化信息，安装程序将自动开始安装软件的一些所需的额外组件，并配置与网络相关的设置。组件安装完成后，安装程序将要求你输入主机名和域名以供安装。你需要提供每项适当的信息，以确保软件正确安装并继续安装过程。

    *   在完成上述所有步骤后，你需要为你的 Kali Linux 机器设置密码，然后点击继续按钮。确保你不要忘记为你的 Kali Linux 机器设置密码。

    *   当你为 Kali Linux 机器设置密码时，安装程序会提示你设置时区，并在定义磁盘分区时暂停设置。机器安装程序将针对机器磁盘的分区提供四个不同的选择。如果你不确定如何分区磁盘，你可以选择的最简单选项是选择“引导式
    – 使用整个磁盘”（Guided – Use Entire Disk），这将使用整个磁盘空间并跳过磁盘分区过程。如果你是经验丰富的用户，可以选择手动分区选项以获得更细粒度的配置选项。

    *   你现在需要选择分区磁盘。然而，对于所有新用户，最推荐的选项是选择将所有文件放在一个分区中。选择分区磁盘后，点击继续。

    *   现在你需要确认对主机机器磁盘上所做的所有更改。确保你不要继续该过程，因为这将删除磁盘上的所有可用数据。一旦你确认了分区中的所有更改，Kali Linux
    安装程序将开始文件安装过程。这可能需要一段时间，请不要中断过程，因为系统将自动安装一切。

    *   一旦安装了所有所需文件，系统将询问你是否要设置网络以获取未来的更新和软件部分。如果你计划将来使用 Kali Linux 的存储库，请确保启用此功能。系统随后将配置相关文件的管理器。


