    WPScan is used for the purpose of auditing the installation security of WordPress.
    With the help of `WPScan`, you can easily find out whether or not the setup of
    your WordPress is susceptible to any form of attack or not or whether if it is
    giving out too much information in the core, theme files or plugins. This tool
    also allows the users to find the weak passwords for each and every registered
    user and can also run a brute force attack for finding out which one can be cracked.
    The features of WPScan are:


    1. Enumeration of WP username

    2. Security scans of non-intrusive nature

    3. Enumeration of WP plugin vulnerability

    4. Cracking of weak password and brute force attack of WP

    5. Scheduling of WordPress security scans


    ### CMSMap

    CMSMap is an open source form of project which is written in Python. It helps
    in automating the task of vulnerability scanning along with detection in Joomla,
    WordPress, Moodle and Drupal. This tool can also be used for running a brute force
    attack and also for launching the various exploits once the vulnerabilities have
    been discovered. The main features of CMSMap are:


    1. It supports multiple threats scan

    2. It comes with the capability of setting customized header and user agent

    3. It supports encryption of SSL

    4. It saves the output file in the form of text file


    ### Fluxion

    This tool functions as an analyzer of Wi-Fi which specializes in attacks of MITM
    WPA. It allows the users to easily scan the wireless form of networks, search
    for any form of security flaw in the personal or corporate networks. Unlike the
    other tools for Wi-Fi cracking, this tool does not perform any form of brute force
    attack for cracking attempt as it takes generally a lot of time. Instead of launching
    a brute force attack, this tool spawns a process of `MDK3` which makes sure that
    all the users who are connected with the targeted network are deauthenticated.
    After this has been done, the user gets a prompt screen for connecting with a
    fake pint of access where they are required to enter the Wi-Fi password. Then
    the tool sends the password of Wi-Fi to you so that you can easily gain access
    to the same.


    Other than all these tools, there are several other tools from Kali Linux such
    as `Aircrack-ng`, `Kismet Wireless`, `Wireshark`, `John the Ripper` and many others.


    ## Chapter 11: How can Kali Linux be Used For Hacking?!


