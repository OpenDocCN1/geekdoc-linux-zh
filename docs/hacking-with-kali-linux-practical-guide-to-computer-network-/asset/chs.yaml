- "# Kali Linux 攻防：初学者计算机网络黑客、加密、网络安全与渗透测试实用指南。VPN 服务、防火墙与 Linux 命令行秘籍\n\n\n黑客攻击无非对网络或计算机进行未经授权的入侵，这种入侵由被称为黑客的攻击者执行。攻击者试图攻击那些受到威胁的系统。他们时刻睁着窥探的眼睛，到处寻找漏洞。他们可以以个人身份行动，也可以作为一个小组工作。不仅如此，黑客还作为组织的一部分运作，其目的是破坏其他组织的功能。大多数时候，他们试图修改组织的系统，并目标其安全基础设施以攻破信息并获取访问权限。然而，黑客不仅作为攻击者工作，还利用其技能寻找系统内部的弱点以及各种漏洞。此也是为了发现并修复弱点，以防止各种形式的恶意攻击进入系统。\n\
  \n## 不同类型的黑客\n黑客世界中有很多类型的黑客，他们执行不同的功能。黑客的类型有助于定义系统与试图攻击这些系统之间的关系。最常见的黑客类型有：\n\n\
  *   **黑帽黑客 (Black Hat Hackers)**：“黑帽”一词源于旧西部电影，电影中的反派通常戴着黑帽子。黑帽黑客作为个体行动，试图未经授权访问组织或网络的系统，目的是出于各种恶意原因利用安全基础设施。这种类型的黑客在破坏目标时没有获得任何形式的授权或许可。他们试图通过破坏安全系统的基础设施、关闭系统或修改网站或网络的主要功能来造成破坏。黑帽黑客的主要意图是获得完全访问权限或盗取财务信息、访问各种密码或获取其他形式的个人数据的洞察。\n\
  *   **白帽黑客 (White Hat Hackers)**：白帽黑客是第二类黑客，但他们扮演的是好人。白帽黑客与各种组织合作，旨在加强任何系统的安全性。白帽黑客拥有各种许可来接触目标，并在提供的规则边界内对其进行渗透测试。白帽黑客也被称为伦理黑客（ethical\
  \ hackers）。伦理黑客精通这一领域，拥有各种用于黑客的伦理工具和技术。他们使用特殊的方法来保护组织的信息系统。与黑帽黑客相反，伦理黑客在获得合法许可执行后，会利用网络安全系统并检查后门。伦理黑客总是指出他们从组织系统中挖掘出的所有形式的漏洞，以确保漏洞得到修复，防止被恶意攻击者利用。\n\
  *   **灰帽黑客 (Grey Hat Hackers)**：灰帽黑客与黑帽黑客一样获取组织和网络安全系统的访问。但灰帽黑客执行此类行动时并没有恶意意图，并将漏洞和漏洞告知执法机构或各种情报机构。灰帽黑客通常在网上浏览并攻击计算机系统，以通知网络或系统管理员该系统包含需要修复的各种漏洞。灰帽黑客可能还会通过提供缺陷信息来勒索被攻击的系统。\n\
  \n## 常用的黑客工具\n为了完成黑客行为，黑客实施了各种技术。让我们来看看其中一些。\n\n*   **Rootkits (Rootkits)**：Rootkit\
  \ 作用像一个程序或一组巨大的软件，允许攻击者获得直接连接或与互联网交互的系统的完全访问权限或控制。Rootkit 最初作为一种后门进程系统引入，用于解决软件方面的各种问题。然而，今天这种软件被黑客广泛用于从实际所有者或管理员手中破坏系统的功能和控制。有多种方法可以将\
  \ rootkit 安装到受害者的系统中。安装 rootkit 最常见的方法是实施钓鱼攻击并结合社交工程。一旦 rootkit 安装在受害者的系统中，攻击者就可以秘密访问系统并控制其整体运行，从而轻松地窃取机密数据和信息，还可以完全关闭系统。\n\
  \n\n\n\n\n## 恶意软件类型\n\n- 键盘记录器 (Keyloggers)：一种非常特殊的工具，旨在记录并记录受害者系统上按下的每一个按键。键盘记录器通过附加到应用程序编程接口或\
  \ `API` 来记录按键轨迹。当用户在系统中使用键盘输入任何内容时，它会跟踪这些按键。记录的文件会被保存，包含各种形式的信息，例如网站访问详情、用户名、打开的应用程序记录、截图、银行详情等。键盘记录器还能捕获个人信息、信用卡详情、密码、手机号码以及通常在系统中输入的其他细节。键盘记录器通常以恶意软件的形式出现，允许网络犯罪分子突破各种形式的敏感数据。\n\
  \n- 漏洞扫描器 (Vulnerability scanner)：漏洞扫描器用于分类并检测系统、网络、通信系统、计算机等的各种形式的弱点。这是道德黑客最常用的工具之一，用于发现潜在的漏洞和漏洞并尽快进行修复。然而，黑黑客也可以使用漏洞扫描器来检查系统中的漏洞和弱点，然后寻找合适的工具进行利用。\n\
  \n## 黑客攻击技术\n\n黑客使用多种技术来利用攻击系统。\n\n- SQL 注入：`SQL` 或结构化查询语言旨在利用受害者数据库中的各种形式的数据。这种攻击形式属于网络攻击，通过\
  \ `SQL` 语句欺骗系统，目标是数据库。这种攻击通常通过网站界面进行，尝试通过数据库发布 `SQL` 命令，以破解密码、用户名以及其他与数据库相关的相关信息。所有编写不当的网站以及\
  \ Web 应用程序都容易受到 SQL 注入攻击。这是因为基于 Web 的应用程序包含各种用户输入字段，如登录页面、搜索页面、与支持和产品相关的请求表单、评论区等，这些字段非常容易受到攻击，并可以通过简单的代码操纵轻易被攻破。\n\
  \n- DDoS 或分布式拒绝服务 (DDoS or Distributed Denial of Service)：一种黑客攻击的形式，其中服务器的正常流量被阻止进入服务器并淹没网络流量。这最终导致服务拒绝，因为它就像交通拥堵一样堵塞道路，并防止常规流量到达目的地。今天所有连接到网络的设备（如\
  \ `IoT` 设备、计算机、手机等）都非常容易受到 `DDoS` 攻击。\n\n- MAC 欺骗 (MAC Spoofing)：今天人们使用的每种设备都带有网络接口控制器或\
  \ `NIC`。它可以帮助用户直接连接到网络（互联网）。每个设备的 `NIC` 都配有一个 `MAC` 地址，该地址是在经过各种硬编码过程后分配的。MAC 欺骗是一种非常致命的攻击形式，黑客隐藏在自定义的伪造的\
  \ `MAC` 地址之后。这降低了黑客被捕的风险。因此，你可能会认为一个新系统是完全合法的而赋予其访问权限，但黑客可能会隐藏在一个虚假的 `MAC` 地址后面，你甚至无法察觉。\n\
  \n通过这种技术，黑客可以轻松通过 `Wi-Fi` 破解网络连接，并访问所有通过 `LAN` 连接的设备。`MAC` 欺骗技术还导致其他几种形式的严重犯罪，黑客窃取他人的身份并进行严重的数据泄露，导致某人在甚至不知道实际黑客的情况下被定罪。然而，如今市场上有多种\
  \ `OS`（如 `MAC` 和 `Windows`），它们可以在不使用 `MAC` 地址的情况下轻松连接到 `LAN`。\n\n# 第二 2 章：什么是道德黑客？！\n\
  \n道德黑客也被称为入侵测试、渗透测试和红队对抗。简单来说，这是一种具有争议的技术，通过模仿恶意黑客的行为和意图来发现系统中的漏洞和弱点。道德黑客是指个人或安全专业人士，利用其技能为信息系统管理员采取各种防御措施。道德黑客也被称为白帽客或白帽黑客。通过进行各种测试，道德黑客试图找到以下问题的答案：\n\
  \n- 攻击者可以访问哪些位置、系统或信息？\n- 攻击者在设定目标之前会看到什么？\n- 攻击者会对系统中的可用信息做什么？\n- 是否有人能够注意到攻击者为获取访问权限而做的各种尝试？\n\
  \n\n\n\n受赋予渗透测试任务的道德黑客，在其被分配防御任务的组织范围内，根据该组织的许可和知识进行操作。在某些情况下，组织不会向安全信息团队告知道德黑客将要进行的所有活动，这仅仅是为了测试安全信息团队的有效性和严谨性。这整个过程被称为**双盲环境**。为了确保操作有效且合规，组织需要告知道德黑客所有需要保护的资产和信息、潜在的威胁来源，以及组织支持道德黑客工作的程度范围。\n\
  \n## 道德黑客流程\n所有道德黑客都遵循严格的流程，以获得最佳、可用且切中要点的合规结果。让我们来看看道德黑客遵循的流程。\n\n### 规划\n无论是什么种类型的项目，对于每一个成功的项目来说，规划都是至关重要的。它为道德黑客提供了思考需要做的事情的机会，设定要达成的目标，并进行风险评估以评估如何执行一个完整的项目。在执行道德黑客项目之前，道德黑客会考虑各种因素。因素列表包括企业文化、安全策略、法律、法规、行业要求和最佳实践。在启动道德黑客活动时，这些因素在决策过程中都起着重要作用。\n\
  \n道德黑客的规划阶段将对攻击过程的执行方式产生整体影响，影响收集和共享的信息，并将直接影响结果向安全计划的集成和交付。规划阶段是第一步，将描述有关受控攻击攻击的大部分细节。它还将回答所有关于黑客的问题，例如道德黑客过程将如何被控制和支持、需要执行哪些基本操作以及该过程将持续多久。\n\
  \n### 侦察\n这是一个搜索所有免费可用信息以协助攻击过程的过程。整个过程可以简单到如仅使用 `ping` 命令，或者浏览互联网上各种新闻组以搜索员工泄露的信息；也可以复杂杂如像在一堆巨大的信件或收据垃圾中翻找那般。这个过程还可以包括其他几个过程，如电话窃听、社会工程学、网络窃听以及数据窃取。信息搜索过程将仅限于组织和道德黑客为了获取他们寻找的所有所需信息而愿意达到的程度。\n\
  \n侦察阶段引入了需要完成的任务与保护组织信息和资产所需方法之间的深层关系。\n\n### 枚举\n这也被称为漏洞发现或网络发现。枚举是从目标系统、网络和目标所使用的应用程序中获取所有现成可用信息的过程。需要注意的是，枚举阶段通常是恶意攻击与道德黑客之间界限变得模糊的实际关键点，因为非常容易且简单地超出原始攻击计划中划定的专用边界。为了构建组织环境的清晰蓝图，会使用各种现有的技术和工具。这些可用工具包括\
  \ `NMap` 和端口扫描。然而，收集所有所需信息非常容易，但要确保黑客手中信息的价值却非常困难。\n\n从乍上看，枚举过程似乎非常简单，即收集数据然后对其进行集体评估，以为进一步搜索建立适当的计划，或为分析或漏洞阶段建立详细的矩阵。然而，这一阶段是道德黑客在做出逻辑决策的能力发挥着非常重要作用的实际阶段。\n\
  \n### 漏洞分析\n为了有效分析所有数据，道德黑客需要采用一种务实且在本质上符合逻辑的方法。在漏洞分析阶段，将已收集的所有信息与实际过程中的所有已知漏洞形式进行比较。任何形式的信息在过程中都是有用的，无论它们源自何处或来源是什么。一小部分信息也可以帮助发现系统中的某些新型漏洞，并可能导致发现其他几个尚未发现的漏洞。已知的漏洞形式、服务包、事件、更新以及各种黑客工具都有助于正确识别攻击点。互联网为道德黑客提供了大量信息，这些信息可以很容易地与系统架构以及系统的强弱点联系起来。\n\
  \n### 利用\n花费大量时间用于评估和规划道德黑客攻击。显而易见，所有这些规划将导致某种形式的攻击。系统利用程度可以简单到在系统中运行一个非常微小的工具，也可以复杂到需要以正确方式执行的许多复杂步骤，以获取系统的访问。利用过程可以分解为一系列子任务，每个子任务可以是单个步骤，也可以是多个步骤的集合。随着每一步的执行，都会进行评估过程，以确保符合预期的结果。任何偏离攻击计划的形式都可以分为两个部分：\n\
  \n-   **预期**：是否达到了利用的预期结果，或者结果是否与组织的假设相冲突？\n-   **技术**：目标系统的行为是否完全不符合预期，这种行为实际上对整个系统利用和系统接入产生了影响？\n\
  \n\n\n\n### 最终分析\n尽管利用阶段伴随着大量的验证和检查以确保攻击成功，但仍需要进行最后一次最终分析，以便根据暴露程度对系统漏洞进行分类，并协助制定缓解计划。最终分析阶段将利用阶段与交付物的创建连接起来。需要对整个攻击过程进行全面描述，以构建组织当前安全环境状况的宏观图景，并清晰地表达漏洞。\n\
  \n### 交付物\n交付物通过多种方式交流测试结果。某些交付物本质上是简洁简短的，仅提供漏洞列表以及修复方法；而另一种形式的交付物则可能是详细且冗长的，提供系统中可能存在的漏洞列表，并附带关于如何发现漏洞、如何利用漏洞、在系统中存在此类漏洞的结果以及如何解决这种情况的描述。这一阶段实际上由道德黑客用于向组织传达其攻击结果。如果交付物实际上没有让管理员感到震惊，则该测试被视为失败。\n\
  \n# 第三章：网络安全\n![](img/rsrc5A.jpg)\n在当今技术创新每天发生的世界上，网络攻击的潜在威胁也以同样的速度增长。在当今漏洞百出的世界里，网络安全在保护系统和网络信息及数据安全方面发挥着至关重要的作用。网络安全无非利用各种工具和技术，保护网络、程序、系统数据和网络免受潜在攻击、损害和各种形式的未经授权访问。网络安全也被信息技术安全。\n\
  \n## 网络安全及其性\n大多数组织和机构（如军事、政府、医疗以及金融机构）在计算机系统和数据库中存储大量数据，这些数据可以在网上找到。在大多数情况下，存储在服务器和数据库中的信息本质上是高度的，泄露可能会给相关组织带来严重麻烦。对组织系统和数据库的未经授权访问会导致数据泄露以及组织安全基础设施被利用。\n\
  \n被攻击的组织可能会丢失所有形式的敏感数据，并完全失去系统的访问权限。随着网络攻击数量日益增加，组织（特别是涉及国家健康安全的组织）需要采取严肃措施来保护所有形式的敏感数据。网络安全是帮助组织保护其所有数据和服务器的最终选择。\n\
  \n## 网络安全与加密\n加密是以编码的方式对通信进行处理，使得只有授权方才能解码信息。这是通过使用 `SSL/TLS` 和 `PKI` 协议实现的。之所以如此重要，源于使用\
  \ `HTTP` 协议构建互联网的过程。超文本传输协议或 `HTTP` 与互联网处于同一时代。`HTTP` 是一种通信协议，允许 Web 服务端和网页浏览器进行通信，并以正确的预想方式显示信息。当用户访问网站时，它实际上并不是浏览器中看起来的样子。网站由许多代码构建，这些代码被发送到浏览器，然后由浏览器按照网页设计的意图进行视觉布局。\n\
  \n`HTTP` 的主要问题是它完全不安全。因此，任何知道该过程的人都可以轻易监视互联网上的 `HTTP` 连接。简单来说，第三方可以轻松读取并操纵客户端与服务器之间通过\
  \ `HTTP` 进行的通信。加密是在通过 `HTTPS` 协议提供网站服务时，实际维护通信的技术。`HTTPS` 是 `HTTP` 的安全版本。所有在 `HTTPS`\
  \ 上建立的连接本质上都是加密的。简单来说，任何通过 `HTTPS` 协议进行的通信都是高度安全的。加密防止第三方对通信的监视。如果你从事在线业务并需要获取客户的财务及个人详情，请确保您的网站已加密，这样您的客户在交换详情时就不会面临风险。\n\
  \n### 加密过程是如何工作的？\n当网页浏览器访问一个带有 `SSL` 证书的网站时，加密过程便开始了。Web 服务器和浏览器进行所谓的 `SSL 握手`。在初级阶段，网页浏览器验证网站上安装的\
  \ `SSL` 证书在本质上是合法的，并且是由受信任的认证机构颁发的。当网页浏览器确保证书合法性后，它开始与服务器就加密连接的条款进行协商。\n\n涉及加密时，主要有对密钥。第一对是非对称密钥对，由私钥和公钥组成。这些密钥对于加密本身没有功能，但它们用于身份验证。当网页浏览器测试网站\
  \ `SSL` 证书的真实性时，它会确保被质疑的 `SSL` 证书实际上是公钥的所有者。它通过使用公钥加密一个小数据包来实现这一点。如果 Web 服务器能够使用相应的私钥解密数据包并将其发回，则证明服务器是公钥的所有者，一切被声明已验证。如果\
  \ Web 服务器无法解密数据包，则服务器证书被视为“不可信”。\n\n另一对密钥是会话密钥。这种形式的密钥在验证了 `SSL` 证书的真实性并协商了所有加密条款后生成。虽然公钥只能用于加密而私钥用于解密，但会话密钥可以同时用于加密和解密功能。与非对称形式相比，会话密钥尺寸较小，本质安全性也较低。然而，会话密钥足够执行这两种功能。服务器和网页浏览器在剩余通信中使用会话密钥。离开网站后，正在使用的会话密钥会被丢弃，并为新的访问生成全新的会话密钥。\n\
  \n## 网络攻击类型\n随着技术领域的创新，网络攻击日益增加。今天可以发现各种类型的网络攻击，其中某些最常用，例如 `phishing`、`malware`、`XSS`\
  \ 等。让我们来看一些最常见的网络攻击类型。\n\n### 恶意软件\n恶意软件是有害软件的一种，用于获取受害者系统的访问。恶意软件也可以被称为病毒。一旦恶意软件进入受害者系统，它可能会导致各种灾难，从获得系统的整体控制到监控各种操作、静地窃取敏感数据并可能导致系统完全关闭。攻击者使用各种方法将恶意软件插入目标系统。但也存在各种情况，系统用户被诱骗在系统中安装恶意软件。\n\
  \n### 钓鱼攻击\n今天，收到带有各种不良链接和附件的邮件是非常常见的事。这种通过电子邮件发送有害链接和附件的行为被称为钓鱼攻击。在钓鱼攻击中，攻击者向目标发送看起来像可信赖的邮件。大多数邮件都带有链接和附件，点击后会导致系统被安装恶意软件，而系统用户甚至对此一无所知。某些钓鱼链接还可能引导用户进入新网站，该网站可能会要求银行和信用卡详情等机密数据。\n\
  \n### XSS\n跨站脚本或 XSS 攻击用于直接针对网站的用户。它与 `SQL` 攻击有些相似，也涉及在网站中注入有害代码。但在 XSS 攻击的情况下，网站本身并没有受到攻击。在\
  \ XSS 攻击中，注入网站的恶意代码仅运行在用户的浏览器中，可用于窃取敏感数据，如用户名、密码、银行详情等。\n\n### 恶意软件及其类型\n恶意软件是恶意程序的一种，用于获取受害者的系统访问。网络犯罪分子设计恶意软件的方式可用于窃取数据、破坏计算机功能、绕过访问控制等。\n\
  \n### 恶意软件的类型\n今天可以发现各种类型的恶意软件。让我们来看看它们。\n\n\n\n\n\n- **广告软件**: 广告软件是指在网站上显示广告的程序，点击后会重定向到被广告的网站，并收集有关用户的所有形式的市场数据。还有各种形式的弹窗广告软件，它们通常包含恶意链接，可能导致系统损坏。\n\
  - **间谍软件**: 这是一种用于监视目标用户的软件。它被设计用于捕和监控用户在网站上的活动。广告软件也是间谍软件的一种，它会将用户的浏览活动发送给广告商。\n\
  - **蠕虫**: 蠕虫病毒病毒，被网络分子用于自我复制。蠕虫利用计算机网络进行传播，可能导致数据被取或删除。许多蠕虫被设计为仅通过系统传播，不会对系统造成任何形式的伤害。\n\
  \n# 第 4 章：Linux 架构\n\n![](img/rsrc6M.jpg)\nLinux 是当世界上最优秀的操作系统之一。它在本质上是开源的，基于 UNIX。它像\
  \ Windows XP、Windows 10 和 MAC OS 等商业操作系统一样，是一个简单的操作系统。操作系统无非计算机系统与用户之间的图形化界面。它负责管理计算机系统所有硬件相关的资源，并帮助建立硬件与软件之间的通信。\n\
  \n## 开源软件\n开源软件是指其源代码根据许可协议提供的软件，版权所有者有权研究该软件、更改设置，并出于任何目的将该软件分发给他想要的任何人。\n\n##\
  \ Linux 操作系统及其组件\nLinux 操作系统由三个不同的组件组成：\n- 内核\n- 系统库\n- 系统工具\n\n### 内核\n内核是任何形式操作系统的核心部分。它负责处理与计算机系统硬件相关的任务。CPU\
  \ 时间和内存是内核管理的两个实体示例。操作内核分为两种：\n\n- **微内核**: 微内核是操作系统内核的一种。正如其名，它具有非常基础的功能。它是能够提供操作系统运行所需环境的最少软件。这种内核环境涵盖了线程管理、地址空间的低级管理以及进程间的通信。\n\
  - **单体内核**: 单体内核是带有各种驱动运行的内核形式。它是操作系统的一种架构，其中系统的操作系统在内核空间内运行。这种形式的内核能够动态加载或卸载运行时可执行的所有模块。单体内核处于监管模式。微内核和单体内核之间的主要区别在于，单体内核可以独立在计算机系统硬件上定义非常高层的接口。\n\
  \n\n\n\n\n### 内核模式 (Supervisor mode)\n单体内核的内核模式是一个由系统硬件调出的标志位。它可以通过在软件系统级运行代码来轻松修改。所有形式的系统级任务在操作或运行时都带有此标志位。然而，用户空间的应用程序并不带有此标志位。该标志位确保了是否可以执行机器码操作，例如执行禁用中断或修改各种形式的描述符表寄存器等操作。设置两种不同类型操作的核心思想源于“控制权越多，责任越大”。内核模式下的任何程序都受到高度信任，以至于它们永远不会失败，因为任何形式的失败都会导致计算机系统的崩溃。简单来说，内核是负责操作系统所有形式活动的的组件。它由各种类型的模块组成，并直接与底层硬件进行交互。内核提供了所有必要的抽象，目的是向系统或应用程序隐藏硬件的所有低级细节。\n\
  \n### 系统库 (The System Library)\n系统库由一组本质上非易失性的资源组成，这些资源被计算机系统资源使用，并主要用于软件开发。它包含了数据配置、帮助数据、文档、消息模板等许多。通常，“库”一词被用于描述用计算机语言编写的关于行为的海量实现集合。它具有完美定义的接口形式，有助于调用这些行为。这意味着，任何想要创建高层程序的人都可以轻松地使用系统库来实现系统调用。系统库可以被各种独立形式的程序同时请求，以确保库的编码方式使得即使相关程序之间完全没有链接或连接，多个程序也可以使用该库。简单来说，系统库是由系统实用工具或应用程序构建而成的唯一程序或函数形式，它们可以访问内核的所有功能。这种形式的库实现了与计算机操作系统相关的大多数功能，且它们不需要拥有内核模块的代码访问权限。\n\
  \n### 系统实用工具 (The System Utility)\n系统实用工具程序负责执行所有形式的个人和特殊级任务。实用工具软件是一种系统软件。它是为了运行计算机系统的应用程序和硬件程序而设计的。系统软件也可以被视为用户应用程序与硬件之间的接口。简单来说，系统实用工具软件是一种用于配置、分析、优化和维护计算机系统的软件。实用工具软件与操作系统协同工作，以支持系统的基础设施，这使其与旨在直接执行造福普通用户任务的应用程序区分开来。\n\
  \n### Linux 架构的特点 (Characteristics of Linux architecture)\nLinux 具有许多可以极大帮助普通用户的特性。\n\
  \n### 多用户能力 (Multuser capability)\n这是 Linux 操作系统最独特的特点，即内存、硬盘等计算机资源可以被多个用户同时访问。然而，用户并不是从单个终端访问资源的。每个用户都获得一个独立的终端来访问和操作资源。每个终端至少包含一个\
  \ VDU（视觉显示用终端）、一个鼠标和一个键盘作为输入设备。所有终端都链接或连接到主服务器（Linux）或主机，主机的资源以及打印机等外围设备可以供用户使用。\n\
  \n### 多任务处理 (Multitasking)\nLinux 操作系统具有同时轻松处理各种作业的能力。例如，用户可以执行一个命令来运行巨大的列表，同时在记事本中输入。这是通过实施调度策略结合上下文切换的概念划分\
  \ CPU 时间来智能管理的。\n\n### 可移植性 (Portability)\n可移植性是 Linux 操作系统在用户中如此闻名的特性。可移植性并不意味着它可以通过\
  \ CD、优 盘或内存卡携带，也不是指文件大小很小。可移植性是指 Linux 操作系统及其所有应用程序可以在不同类型的硬件上以完全相同的方式运行。Linux 内核和操作系统的应用程序支持在硬件配置最低的系统上安装相同的程序。\n\
  \n### 安全性 (Security)\n安全性被认为是任何操作系统最本质的部分。对于所有使用系统执行各种形式机密任务的用户和组织来说，这非常重要。Linux\
  \ 操作系统提供了各种安全概念，旨在保护用户免受对系统及其数据的任何未经访问。\n\n## Linux 安全的主要概念 (Main concepts of Linux\
  \ security)\nLinux 提供了 3 类主要的安全概念。\n\n*   **身份验证 (Authentication)**：这通过为个人用户提供登录名和密码帮助系统验证用户身份，确保他们的工作不会被任何第三方访问。\n\
  *   **授权 (Authorization)**：在 Linux 操作系统的文件级，对用户有授权限制。每个文件都有写、读和执行权限，决定了谁可以访问文件、谁可以修改文件以及谁可以执行文件。\n\
  *   **加密 (Encryption)**：Linux 操作系统的这一特性有助于将用户文件编码为不可读的格式，称为密文。这确保了即使有人成功打开了系统，文件也是安全的。\n\
  \n\n\n\n\n通信\n\nLinux 操作系统有一项强大的功能，用于与用户进行通信。它既可以在单台计算机的网络内部进行，也可以在计算机的两个或多个网络之间进行。此类系统的用户可以通过网络无缝地交换数据、邮件和程序。\n\
  \n# 第 5 章：Linux 操作系统基础\n\nLinux 是一个简单的操作系统，就像 Windows 等其他操作系统一样。作为一个操作系统，Linux 帮助管理系统的硬件，并提供其他软件运行所需的服务。它被认为是一个实操型的操作系统。例如，如果运行\
  \ Windows 这样的操作系统就像是开自动挡汽车，那么运行 Linux 操作系统就像是开手动挡汽车。这可能需要花费更多的精力，但一旦用户熟练掌握了 Linux\
  \ 的运行机制，使用命令行安装软件包就会变得非常简单。\n\n## Linux 的历史\n\nLinux 与 MAC OS X 相似，它们都基于 Unix。Unix\
  \ 开发于 20 世纪 70 年代初，主要目标是创建一个对各种用户来说既易于访问又安全的操作系统。1991 年，Linux 的开发目标是分发 Unix 的特性。它作为开源软件发布，至今依然如此。开源软件是指用户完全可见代码的软件，并且可以根据需要进行修改和重新分发。Linux\
  \ 只是内核，而不是一个完整的操作系统。内核提供了硬件与用户应用程序请求之间的接口。操作系统的其他部分由工具、GNU 库以及各种其他软件组成。作为一个完整单元的操作系统被称为\
  \ GNU/Linux。\n\n## 关于服务器\n\n用户拥有的 Linode 是一种服务器。服务器本质上就是一种主计算机，帮助在整个网络或跨连接的计算机网络提供各种形式的服务。服务器通常具有：\n\
  \n* 全天候运行。\n* 通常连接到互联网或一组计算机网络。\n* 包含用于网站托管或其他互联网其他内容的文件和程序。\n\n由于服务器的作用就像计算机一样，Linode\
  \ 和家用电脑之间有许多相似之处。一些相似点包括：\n\n* Linode 通常托管在物理形式的机器上。它位于可用的数据中心池。\n* Linode 使用像 Linux\
  \ 这样的操作系统。这是另一种类似于 Mac 或 Windows 的操作系统。\n* 就像用户可以轻松地在 PC 上安装各种应用程序一样，Linode 也可以安装应用程序。所有这些安装在\
  \ Linode 上的应用程序都有助于执行托管网站等各种任务。\n* 用户可以像在 PC 上一样轻松地创建、编辑和删除文件。用户也可以像 PC 一样在目录之间导航。\n\
  * 就像 PC 一样，Linodes 连接到互联网。\n\n## 安装 Linux 之前需要考虑的事\n\n在安装 Linux 之前，你需要确定想安装哪种 Linux\
  \ 发行版。Linux 操作系统有多个版本，被称为发行版（distributions）。发行版类似于 Windows 7 或 Windows XP 等操作系统的版本。操作系统的新版本是升级版本。但在\
  \ Linux 中，发行版并不是升级，而是不同的口味（flavors）。多个 Linux 发行版安装了不同的软件包。\n\n## Linux 发行版\n\nLinux\
  \ 发行版之间的主要区别在于发行的目标和目的以及安装了哪些软件包，而不是 Linux 内核代码的任何差异。包含 CentOS 和 Fedora 的 RedHat\
  \ Linux 以及包含 Ubuntu 的 Debian Linux 之间共享大量的代码。它们的内核在很大程度上相同，GNU 项目的应用程序和用户工具也相似。某些\
  \ Linux 发行版被设计得尽可能极简简单，而另一些则包含了该时代最新且最好的软件。所有 Linux 发行版旨在为用户提供最好的稳定性和可靠性。\n\n除了发行版的个人特性外，你还需要考虑各种在选择理想发行版时对你有帮助的因素。\n\
  \n* **发布周期**：不同的 Linux 发行版在不同的时间表发布其操作系统更新。像 Arch Linux 和 `Gentoo` 这样的发行版使用滚动发布模型，当开发者宣布每个包完成或准备就绪时就会发布该包。像\
  \ `Slackware`、`Debian` 和 `CentOS` 这样的发行版旨在为用户提供最稳定且可获得的操作系统，并且频繁发布新版本。`Ubuntu` 和\
  \ `Fedora` 等 Linux 发行版每六个月发布一次新版本。选择适合你的发布周期取决于多种因素。这些因素包括你运行所需的软件、所需的可靠性和稳定性程度以及你所追求的舒适度。\n\
  * **组织结构**：虽然这可能不会直接影响发行性能，但它仍然 Linux 发行版之间最不同的因素之一。某些 Linux 发行版如 `Gentoo`、`Debian`、`Slackware`\
  \ 和 `Arch` 由独立开发者社区开发，而另一些发行版如 `Ubuntu`、`Fedora` 和 `OpenSUSE` 则由不同公司赞助的社区开发。`CentOS`\
  \ 等发行版源自商业版。\n* **常用工具集**：不同的 Linux 发行版使用不同类型的来执行各种常见任务，如系统配置或包管理。`Ubuntu` 和 `Debian`\
  \ 使用 `APT` 管理 `.deb` 包，`OpenSUSE` 使用 `.rpm` 包，`CentOS` 和 `Fedora` 也使用 `.rpm` 包，但使用名为\
  \ `yast` 的工具管理所有这些包。在大多数情况下，你选择的发行版最终将是那个包含你所有所需且你所熟悉的工具的发行版。\n\n\n\n这些发行版的设计是为了适应不同的场景。您需要从尝试这些发行版开始，根据您的需求找到最适合您的一个。\n\
  \n## Linux 安全\n当你开始使用基于 Linux 操作系统的系统时，你就成了自己系统安全的负责人。互联网上充斥着想要利用你的系统计算能力来实现个人目标的人。Linux\
  \ 为用户提供了各种安全选项，帮助用户保护其系统并根据需求进行调整。\n\n## 查找你的文件夹和文件\nLinux 系统中的一切都以目录的形式存在。在 Linux\
  \ 中，文件夹被称为目录。Linux 操作系统使用一个平衡良好的各种嵌套目录树，以组织化的方式保留所有文件。最高层级的目录被称为根目录，它仅用单个斜杠`/` 标识。在\
  \ Windows 操作系统中，你会遇到各种驱动器和磁盘，但在 Linux 操作系统中并非如此。根目录下还有其他几个子目录。大多数基于 Linux 的系统在根目录树下都带有名为\
  \ `var` 和 `lib` 等许多目录。\n\n`lib` 目录由系统库组成，而 `var` 目录包含系统中各种可能变化的文件，例如邮件消息和日志。Linux\
  \ 操作系统的目录也可以包含在其他目录内部。\n\n## 用户与权限\nLinux 操作系统使用了一套非常强大的用户及其权限系统，以确保只有正确的人才能访问系统文件。作为\
  \ Linux 系统的所有者，你可以为每个目录设置用户和权限。Linux 中的文件访问系统包含三类：\n\n*   **用户 (Users)**：用户账户通常被分配给个人或需要访问系统文件的应用程序。你可以根据意愿为系统提供任意数量的用户访问权限。\n\
  *   **组 (Groups)**：组是一个一个或多个用户的集合。组是一种一次性向多个用户授予相同访问权限极极方法，无需为每个用户单独设置权限。当你创建一个用户账户时，它会被分配到一个默认组，该组的名称与用户名相同。用户可以加入任意数量的组。属于某个组的用户将获得该特定组的所有权限。\n\
  *   **所有人 (Everyone)**：这一类适用于组和用户之外的所有人。当有人在甚至没有以特定用户登录系统的情况下访问系统文件时，他们属于“所有人”类别。\n\
  \n紧随用户之后的重要事项是权限。Linux 系统中的每一个目录和文件都有三种可能的访问级别：\n\n*   **读 (Read)**：所有具有读取权限的文件都可以查看。\n\
  *   **写 (Write)**：所有具有写入权限的文件都可以编辑。\n*   **执行 (Execute)**：所有具有执行权限的文件都可以像应用程序一样执行或运行。当你启动一个新的脚本或程序时，你就在执行它。\n\
  \n\n\n\n## Linux 中的软件安装\n\n与 Linux 系统中的所有其他事物一样，软件安装也是通过输入并执行特定形式的文本命令完成的。大多数 Linux\
  \ 发行版都带有包管理器，这使得安装或卸载系统中的任何软件变得更加容易。Ubuntu 和 Debian 等发行版使用 `APT` 或 `Advanced Packaging\
  \ Tool` 包管理器，而 CentOS 和 Fedora 则使用 `YUM` 或 `Yellowdog Updater Modified` 包管理器。\n\n\
  # 第 6 章：基础 Linux 命令\n\nLinux 是当今最著名的操作系统之一。然而，Linux 并不是一个完整的操作系统，它是操作系统的内核。Linux\
  \ 也被视为 `UNIX` 的克隆。一些常见的 Linux 发行版包括 Linux Mint、Ubuntu Linux、Red Hat Enterprise Linux、Fedora\
  \ 和 Debian。Linux 主要用于服务器。也可以认为，几乎 90% 的互联网是由 Linux 服务器驱动的。这主要是因为 Linux 作为一个内核是安全、快速且免费的。Windows\
  \ 服务器也可以用于互联网，但 Windows 带来的主要问题是其成本。这个成本问题可以通过 Linux 服务器轻松解决。事实上，如今运行在大多数智能手机上的\
  \ Android 操作系统也是基于 Linux 内核制作的。\n\n## Linux shell\n\nLinux shell 是一种程序，它接收系统用户的命令并将其传递给操作系统进行处理，然后显示结果。Linux\
  \ shell 是 Linux 操作系统的主要部分。它的发行版带有图形用户界面或 `GUI` 的形式，但 Linux 基本上带有命令行界面或 `CLI`。要打开\
  \ Linux shell 终端，你需要在 Ubuntu 发行版中按下 `Ctrl+Alt+T`，也可以按 `Alt+F2`，输入 `gnome terminal`\
  \ 然后按回车键。\n\n## Linux 命令\n\n让我们从一些最基础的 Linux 命令开始。\n\n### pwd\n当你首次打开终端时，你将处于用户的家目录。为了确切知道你所在的哪个目录，可以使用\
  \ `pwd` 命令。它可以帮助提供精确的路径，即从根目录开始的路径。根目录无非是 Linux 文件系统的基础。它通常用正斜杠（`/`）表示。用户目录通常看起来像\
  \ `/home/username`。\n\n### ls\n通过使用 `ls` 命令，你可以轻松了解当前目录中有哪些文件。你还可以使用命令 `ls –a` 查看每一个被隐藏的文件。\n\
  \n### cd\n你可以使用 `cd` 命令进入目录。例如，如果你在 home 文件夹中并想进入 downloads 文件夹，你需要输入 `cd Downloads`，你就会进入\
  \ downloads 目录。你需要注意，此命令是对大小写敏感的。你还需要按照原样输入文件夹名称。然而，这种命令会带来某些问题。例如，你有一个名为 Raspberry\
  \ Pi 的文件夹。在这种情况下，当你输入命令 `cd Raspberry Pi` 时，Linux shell 会将命令后面的第二个参数视为一个完全不同的实体，因此你收到的将只有显示没有此类目录的错误信息。在这种情况下，你可以使用反斜杠，即使用命令\
  \ `cd Raspberry\\Pi`。在 Linux 中，空格被视为转义符。如果你只输入命令 `cd` 并按回车，你将回到家目录。如果你想从特定文件夹返回到上一个文件夹，你需要使用\
  \ `cd..`。命令中的两个点表示返回的请求。\n\n### mkdir & rmdir\n`mkdir` 命令用于创建新文件夹或目录。例如，当你需要创建一个名为\
  \ DIY 的新目录时，你需要输入类似 `mkdir DIY` 的命令。始终记住，如果你需要一个名为 DIY Hacking 的目录，你需要输入 `mkdir\
  \ DIY\\Hacking`。你可以使用 `rmdir` 命令删除你不再需要的目录。然而，务必记住，`rmdir` 只能用于删除本质上是空的目录。如果你想删除一个包含文件的目录，你需要使用\
  \ `rm` 命令。\n\n### rm\n你可以使用 `rm` 命令来删除目录和文件。如果你只想删除目录，需要使用 `rm –r` 命令。当你使用 `rm`\
  \ 命令时，它将删除文件夹及其其中所有的文件。\n\n### touch\n此命令用于创建新文件。它可以是任何类型，从一个空的 txt 文件到一个空的 zip\
  \ 文件。你可以使用像 `touch new.txt` 的命令。\n\n### man & - - help\n如果你想详细了解某个命令以及你如何使用它，可以使用\
  \ `man` 命令。它通过显示所有命令的所有形式手册页提供帮助。例如，如果你输入 `man cd`，它将显示 `cd` 命令的所有手册页。当你输入命令名称以及参数\
  \ `- - help` 时，它将显示你可以如何使用该命令。\n\n### cp\n`cp` 命令用于从命令行复制文件。它接受两个参数，第一个参数是要复制的文件位置，第二个参数是复制文件的位置。\n\
  \n### mv\n`mv` 命令用于通过命令行移动文件。你也可以用此命令重命名文件。例如，如果你需要将文件“text”重命名为“old”，你可以输入 `mv\
  \ text old`。它也像 `cp` 命令一样接受两个参数。\n\n### locate\n`locate` 命令用于在 Linux 系统中定位任何文件。它类似于\
  \ Windows 系统中的搜索命令。当……时，这个命令可能会非常有用。\n\n\n\n\n\n*   **免费**：Linux 是一种免费软件，因此所有 Linux\
  \ 发行版都是免费的。Kali Linux 一直是且并将一直是免费的。\n*   **工具丰富**：Kali Linux 可以为你提供超过 600 种不同类型的渗透测试工具以及各种安全分析相关的工具。\n\
  *   **开源软件**：Linux 是一种开源软件。因此，作为 Linux 家族的一部分，Kali Linux 也遵循备受推崇的开源模型。操作系统的开发树可以在\
  \ Git 上公开查看，Kali Linux 提供的所有代码都可以用于微调。\n*   **多语言支持**：尽管渗透工具是用英语编写的，但显而易见的是 Kali\
  \ Linux 也支持多语言使用。这样做是为了确保更多的用户能够以他们的母语言操作操作系统，并能够找到工作所需的工具。\n*   **完全可定制**：攻击性安全工具的开发者知道，并非每个用户都会同意某种模型设计。因此，Kali\
  \ Linux 的开发方式允许根据用户的需求和喜好进行完全定制。\n\n## 系统要求\n为了渗透测试目的安装 Kali Linux 非常简单。你只需要确保你拥有所需的硬件套件。Kali\
  \ Linux 支持 `amd64`、`i386` 和 `ARM`。你都需要：\n\n*   安装软件至少需要 20 GB 磁盘空间\n*   至少 1 GB\
  \ 内存\n*   一个 CD/DVD 驱动器或虚拟机框\n\n## 工具列表\nKali Linux 预装了广泛的工具。让我们来看看一些最常用的工具。\n\n\
  *   `Aircrack-ng`：这是一个用于评估 Wi-Fi 网络安全的工具套件。它的目标是与 Wi-Fi 相关的某些安全领域。\n    1.  监控：它可以帮助捕获数据包并将数据导出到文本文件中，以便后续阶段由第三方工具进行处理。\n\
  \    2.  攻击：它通过数据包注入过程帮助重放攻击、伪造访问点、取消认证等各种攻击。\n    3.  测试：它可以帮助检查 Wi-Fi 网卡和其他驱动程序的其他功能。\n\
  \    4.  破解：它可以帮助破解 WPA PSK 和 WEP。\n*   `Nmap`：Nmap 也称为 Network Mapper，是一种用于网络发现和安全审计的开源免费实用程序。Nmap\
  \ 使用 IP 的原始数据包来确定目标网络上有哪些可用主机、这些主机提供了哪些服务、它们使用什么操作系统、使用了何种防火墙或数据包过滤器以及各种其他特征。许多网络和系统管理员还用它来：\n\
  \    1.  网络资产盘\n    2.  管理服务升级计划\n    3.  监控服务或主机的运行时间\n*   `THC Hydra`：当你需要破解远程身份验证服务时，可以使用\
  \ THC Hydra。它能够对包括 HTTP、FTP、SMB 和 HTTPS 在内的 50 种或更多协议执行极快速的字典攻击。它可以被轻松地用于破解无线网络、Web\
  \ 扫描器、数据包制作器等许多领域。\n*   `Nessus`：这是一种远程扫描工具，用于检查计算机的安全漏洞。它无法阻止计算机系统存在的任何形式的漏洞，但它可以通过运行超过\
  \ 1200 次漏洞检查来轻松发现所有漏洞，并在需要进行安全补丁时发送警报。\n*   `WireShark`：这是一个开源数据包分析器，任何人都可以使用且完全免费。通过这个工具，用户可以轻松地看到网络活动，并提供可定制的报告、警报、触发器等。\n\
  \n## Kali Linux 的特性\nKali Linux 是一种 Linux 发行版，随发行版预装了大量的工具。它是为目标用户设计的，以便于功能操作。Kali\
  \ Linux 在很大程度上与其他 Linux 发行版相似，但它包含了一些额外的功能，有助于将其与其他区分开来。让我们来看看 Kali Linux 的一些独特特性。\n\
  \n*   **Live 系统（Live system）**：与其它 Linux 发行版不同，你下载的主 ISO 镜像不仅可以帮助安装操作系统，还可以像启动形式的\
  \ Live 系统一样使用。简单来说，Kali Linux 可以通过通过启动 ISO 镜像直接使用，而无需将其安装到系统中。该发行版的 Live 系统包含了渗透测试人员所需的所有工具。因此，如果你现在的系统没有运行\
  \ Kali Linux 操作系统，你可以通过插入 USB 设备并重启，在你的系统上运行 Kali Linux。\n*   **取证模式（Forensics mode）**：在系统上执行任何种与取证相关的工作时，用户通常希望避免任何可能导致被分析系统发生数据更改的活动。遗憾的是，大多数现代桌面环境往往会干扰这一目标，并尝试自动挂载检测到的任何形式的磁盘。为了避免这种行为，Kali\
  \ Linux 带有取证模式，可以在重启菜单中启用它，并将禁用所有此类功能。Kali Linux 的 Live 系统被证明仅对取证目的非常有用，因为可以在不访问或对硬盘进行任何修改的情况下，将任何计算机系统重启到\
  \ Kali Linux 系统。\n*   **Linux 定制内核**：Kali Linux 以提供最新 Linux 内核的定制版本而闻名，该内核基于最新的\
  \ Debian Unstable。这有助于确保对硬件的坚实支持，特别是针对大量的无线设备。Linux 内核通过支持无线注入进行了补丁，因为某些关于无线安全的评估工具往往依赖于这种功能。由于大多数硬件设备都需要更新的固件文件，Kali\
  \ Linux 默认带有安装 Debian 非免费（non-free）部分中可用固件更新的功能。\n*   **可靠的操作系统（Trustable OS）**：这种安全发行版的用户想要知道它是否可以信赖，由于它是完全透明开发的，它允许任何人轻松地检查源代码。Kali\
  \ Linux 由一个非常小的开发者团队开发，他们始终遵循所需的安全规范。开发者还以签名格式上传源码包。\n*   **可定制性**：每位渗透测试人员都有自己的工作方式，并且可能不同意操作系统的默认配置。Kali\
  \ Linux 是完全可定制的，允许用户根据自己的需求进行定制。网上还可以找到各种形式的 live-build 技术，有助于修改操作系统、安装多个其他补充文件、运行任意命令、安装任何其他需要的包以及许多功能。用户还可以定制发行版运行的方式。\n\
  \n\n\n\n\n# 第 8 章：Kali Linux 的安装\n\n如果你正在考虑将信息安全作为你的职业，你首要需要的是一个专注于系统安全的操作系统。在合适的操作系统的帮助下，你可以轻松且高效地执行各种形式的繁琐且耗时的工作。在目前，有多种基于\
  \ Linux 的操作系统可供选择。在今天看到的几个发行版中，Kali Linux 被认为是信息安全和渗透测试的最佳选择。它被专业渗透测试人员和伦理黑客广泛用于执行与他们领域相关的各种活动，以及网络安全评估。\n\
  \nKali Linux 被认为是 Linux 家族中领先的发行版，也被用于安全审计。Kali Linux 是唯一一种与伦理黑客和网络安全相关的操作系统，它预装了多种类型的命令行攻击工具，这些工具对于完成各种信息安全任务是必不可少的。Kali\
  \ Linux 最常用的任务包括应用安全、渗透测试、计算机系统取证以及网络安全。简单来说，Kali Linux 是专为伦理黑客设计的唯一终极操作系统。\n\n\
  与伦理黑客和渗透测试世界的人出于特定原因使用 Kali Linux。Kali Linux 带有超过 600 种渗透测试工具。最棒的部分是 Kali Linux\
  \ 是 100% 可定制的。因此，如果你不喜欢 Kali Linux 的当前配置，可以按照你想要的方式对其进行自定义。关于 Kali Linux 的另一个有趣点是它支持多语言。尽管工具是用英语编写的，但这允许来自所有地区的人员使用自己的母语言使用该操作系统。它还支持广泛的无线设备集合。Kali\
  \ Linux 是一个在安全环境中开发的操作系统。让 Kali Linux 如此受欢迎的原因是它的开源软件特性，而且是免费的。它还带有一个自定义内核，该内核也可以为了注入目的进行补丁。\n\
  \n## 如何安装 Kali Linux？\n\n在你的系统中安装 Kali Linux 的过程非常简单直接。用户还可以享受几种软件安装选项。最理想的安装选项包括：\n\
  \n*   使用硬盘安装 Kali Linux\n*   通过创建可启动的 Kali Linux USB 启动盘安装 Kali Linux\n*   使用 `VirtualBox`\
  \ 和 `VMware` 等虚拟化软件安装 Kali Linux\n*   通过与操作系统双引导的过程安装 Kali Linux\n\n安装 Kali Linux\
  \ 最广泛使用的选项是使用 USB 驱动器以及使用 `VirtualBox` 或 `VMware` 安装。如果你使用 `VirtualBox` 或 `VMware`，你的系统硬盘中至少需要\
  \ 20 GB 的可用空间，以及至少 4 GB 的内存。你还需要 USB 以及 CD/DVD 的支持。\n\n### 借助 VMware 安装 Kali Linux\n\
  \n*   在你想要在系统中运行 Kali Linux 之前，你首先需要一个虚拟化软件。在选择虚拟化软件时，现在有多种选择。你可以从 Oracle 公司开始安装\
  \ `VMware` 或 `VirtualBox`。在安装完虚拟化软件后，你需要从应用程序文件夹中启动它。\n*   现在你需要下载 Kali Linux 的安装文件，你可以从\
  \ Kali Linux 官方网站的下载页面轻松找到它。你可以选择你认为符合你需求的某一个。除了下载页面上的下载文件，你还会遇到许多用于安全相关工作的十六进制数字。你需要检查将要下载的镜像的完整性。你需要检查文件的\
  \ `SHA-256` 指纹，然后将其与 Kali Linux 下载页面上提供的指纹进行比对。\n*   在你下载完 Kali Linux 的安装文件后，现在需要启动虚拟机了。为此，你需要打开\
  \ `VMware Workstation Pro` 首页，然后选择“创建新虚拟机”。在创建新虚拟机后，你需要选择 Kali Linux 的 iso 文件，然后选择客机操作系统。你还需要配置虚拟为\
  \ Kali Linux 的该虚拟机的所有细节。现在你只需通过选择 Kali Linux 虚拟机并点击绿色的电源按钮即可启动 Kali Linux 虚拟机。\n\
  *   虚拟机启动后，会弹出一个菜单，你你需要在 `GRUB` 菜单中选择首选的安装模式。你需要选择“图形化安装”（graphical install）。点击“继续”。\n\
  *   接下来的几个屏幕将要求你选择本地化信息，例如你希望安装 Kali Linux 的首语言、你所在的国家以及键盘布局。\n*   一旦完成所有所需的本地化信息，安装程序将自动开始安装软件的一些所需的额外组件，并配置与网络相关的设置。组件安装完成后，安装程序将要求你输入主机名和域名以供安装。你需要提供每项适当的信息，以确保软件正确安装并继续安装过程。\n\
  *   在完成上述所有步骤后，你需要为你的 Kali Linux 机器设置密码，然后点击继续按钮。确保你不要忘记为你的 Kali Linux 机器设置密码。\n\
  *   当你为 Kali Linux 机器设置密码时，安装程序会提示你设置时区，并在定义磁盘分区时暂停设置。机器安装程序将针对机器磁盘的分区提供四个不同的选择。如果你不确定如何分区磁盘，你可以选择的最简单选项是选择“引导式\
  \ – 使用整个磁盘”（Guided – Use Entire Disk），这将使用整个磁盘空间并跳过磁盘分区过程。如果你是经验丰富的用户，可以选择手动分区选项以获得更细粒度的配置选项。\n\
  *   你现在需要选择分区磁盘。然而，对于所有新用户，最推荐的选项是选择将所有文件放在一个分区中。选择分区磁盘后，点击继续。\n*   现在你需要确认对主机机器磁盘上所做的所有更改。确保你不要继续该过程，因为这将删除磁盘上的所有可用数据。一旦你确认了分区中的所有更改，Kali\
  \ Linux 安装程序将开始文件安装过程。这可能需要一段时间，请不要中断过程，因为系统将自动安装一切。\n*   一旦安装了所有所需文件，系统将询问你是否要设置网络以获取未来的更新和软件部分。如果你计划将来使用\
  \ Kali Linux 的存储库，请确保启用此功能。系统随后将配置相关文件的管理器。\n\n\n\n\n\n*   完成此步骤后，系统将提示你安装 `GRUB`\
  \ 引导加载程序。点击 yes，然后选择一个设备，将启动引导加载程序所需的信息写入硬盘，这是启动 Kali Linux 所必需的。\n*   一旦安装程序完成将\
  \ `GRUB` 引导加载程序安装到磁盘，选择继续以完成安装过程。随后它将在最后阶段安装一些文件。\n\n在完成所有这些步骤后，Kali Linux 将安装在你的系统中，你可以开始使用它进行渗透测试和网络安全方面的工作。你也可以通过简单创建一个\
  \ USB 启动盘，在无需在系统中安装软件的情况下，直接在你的系统中使用 Kali Linux。\n\n# 第 9 章：Kali Linux 的应用与用途\n\n\
  Kali Linux 是道德黑客领域闻名的操作系统。虽然众周知，Kali Linux 的主要重点是渗透测试和安全审计的汇总使用，但除了这两项之外，Kali Linux\
  \ 还可以执行许多其他任务。Kali Linux 以框架的形式设计，因为它配备了可以涵盖各种用例的多种工具。在执行渗透测试时，Kali Linux 的某些工具还可以结合使用。\n\
  \n例如，可以在各种类型的计算机上使用 Kali Linux，例如测试人员的系统、想要监控自己网络的系统管理员服务器、与系统取证相关的分析师的系统或工作站，以及通常带有\
  \ `ARM` CPU 的嵌入式设备，这些设备可以轻松地丢入无线网络范围内，也可以插入到目标用户的系统中。许多与 `ARM`相关的设备也可以作为攻击的极佳机器，这主要是因为它们外型小且对功率的要求非常低。\n\
  \n你还可以直接将 Kali Linux 部署在云端，用于快速构建一个能够破解密码的大型机器集群，并部署在手机和平板电脑上以便进行高效的便携式渗透测试。但并不止于此；渗透测试人员还需要服务器。服务器用于在大型渗透测试人员小组内部使用协作软件、设置用于钓鱼攻击活动的\
  \ Web 服务器、运行与漏洞扫描相关的工具以及各种其他相互互联的任务。\n\n一旦你启动了 Kali Linux，你会发现 Kali Linux 的主菜单已经根据各种活动和任务主题进行了组织，这些主题与渗透测试人员和其他信息安全专业人士密切相关。\n\
  \n## 使用 Kali Linux 可以执行的任务\n\nKali Linux 帮助执行广泛的任务。让我们来看看其中一些：\n\n*   **信息收集**：Kali\
  \ Linux 可用于收集与目标网络及其结构相关的各种形式的数据。它有助于识别计算机系统、此类计算机的操作系统以及计算机系统运行的所有服务。Kali Linux\
  \ 可用于识别信息系统中的各种潜在敏感部分，并从运行目录的服务中提取所有形式的列表。\n*   **漏洞分析**：你可以使用 Kali Linux 快速测试远程或本地系统是否受到已知漏洞或任何本质上完全不安全的配置的影响。漏洞扫描器使用包含多种特征的数据库来识别潜在的威胁和漏洞。\n\
  *   **Web 应用分析**：它有助于识别 Web 应用安全系统中的任何形式的错误配置或缺陷。由于此类应用程序是公开的，使其成为所有攻击者的理想目标，因此识别并缓解此类问题是一项至关重要的任务。\n\
  *   **数据库评估**：数据库攻击是攻击者常见的向量形式，包括 `SQL injection` 攻击和凭据的攻击。Kali Linux 提供了各种工具，用于测试攻击向量，范围从数据提取到\
  \ `SQL injection` 及其分析。\n*   **密码攻击**：与身份验证连接的系统总是容易受到攻击者的攻击。在 Kali Linux 中可以找到大量工具，从在线密码攻击工具到针对哈希或加密系统的离线工具。\n\
  *   **无线形式攻击**：无线网络具有普遍性。这意味着它们始终是攻击者常见的攻击向量。Kali Linux 配备了对各种网卡的广泛支持，这使得 Kali Linux\
  \ 成为针对多种无线网络类型攻击的明显选择。\n*   **反向工程**：反向工程是一种非常重要的活动形式，用于各种目的。在为各种进攻活动提供支持时，反向工程是识别漏洞和跟踪利用开发的主要方法之一。在防御方面，它也被用于分析用于目标攻击的恶意软件。在这种能力范围内，目标是识别一组特定技术的主要能力。\n\
  *   **利用工具**：利用是指利用系统中任何形式的现有漏洞的行为，允许攻击者获得远程设备或机器的完全控制。这种访问方式也可被攻击者用于进一步的权限提升攻击，攻击可以在本地网络访问的任何机器或已被攻破的机器上进行。这类\
  \ Kali Linux 功能配备了各种工具和实用程序，有助于简化编写自己漏洞的整体过程。\n*   **欺骗与嗅探**：获取跨任何网络传输的数据包的完全访问权限对攻击者来说总是有利的。Kali\
  \ Linux 可以为你提供各种欺骗工具，允许你模仿任何合法用户，以及嗅探工具，允许你直接从网络线缆分析并捕获可用的数据池。当欺骗和嗅探工具结合使用时，它们会变得非常强大。\n\
  *   **后渗透**：一旦你成功获得目标系统的完全访问，你可能希望通过在网络中横向移动来维持系统的相同访问水平并扩展控制。你可以在 Kali Linux 中找到各种工具来协助你实现后渗透目标。\n\
  *   **取证**：取证 Linux 的现场启动环境在近几年非常有名。Kali Linux 配备了大量基于 Linux 的流行取证工具，将允许你执行从最初的分拣到数据镜像，再到对系统的完整分析以及最后的案件管理的所有工作。\n\
  \n\n\n\n## 报告工具\n\n* **报告工具**：只有在所有测试结果都得到适当报告后，渗透测试才能被宣布为成功。来自 `Kali Linux` 的这类工具有助于对通过信息收集工具采集的数据进行组合，发现各种非显性的关系关系，并将所有内容整合到多份报告中。\n\
  \n* **社会工程学工具**：当系统的技术层面得到妥善保护时，存在利用人类行为作为攻击向量的可能性。在提供完美影响的情况下，人类经常会被诱导去采取各种行动，最终导致系统环境安全被攻破。秘书刚刚插入的\
  \ USB 驱动器是否包含任何形式的有害 `PDF`？或者刚安装的 USB 驱动器是否安装了一个木马后门？会计师刚刚使用的银行网站是预期的正常网站形式，还是为了钓鱼攻击而制作的克隆网站？`Kali\
  \ Linux` 带有各种工具，可以帮助你协助应对所有形式的攻击。\n\n* **系统服务**：`Kali Linux` 可以提供工具，允许你启动和停止作为系统服务的后台运行的各种应用程序。\n\
  \n## Kali Linux 的任务协调\n\n`Kali Linux` 有助于协调若干任务，并有助于平衡系统软件与硬件之间的协调。`Kali Linux`\
  \ 的首要任务是控制计算机系统的硬件组件。它有助于在计算机启动或安装任何新设备时检测并确定各种硬件组件。它通过简化的程序接口形式，帮助硬件组件为各种高层软件变得可用，以便应用程序能够充分利用连接的设备，而无需处理诸如选项卡插在哪个扩展槽中等细节。编程接口还包含了一层抽象，允许各种软件与硬件无缝工作。\n\
  \n## 是什么让 Kali Linux 与其他发行版不同？\n\n`Kali Linux` 专为增强渗透测试员的功能以及安全审计目的而设计。为了实现这一目标，`Kali\
  \ Linux` 实施了各种核心更改，反映了所有这些需求：\n\n* **设计上的 root 访问，单用户**：由于系统审计的常态性，`Kali Linux`\
  \ 的设计使其可以在单 root 访问场景下使用。大多数用于渗透测试的工具都需要提升形式的权限，由于在需要时启用 root 权限通常是合理的策略，在 `Kali\
  \ Linux` 针对的用例中，这种整个方法可能会变成沉重的负担。\n\n* **默认禁用网络服务**：`Kali Linux` 带有系统钩子，默认禁用网络服务。此类钩子允许用户在安装多个\
  \ `Kali Linux` 服务的同时，确保无论安装了何种类型的包，发行版在默认情况下也保持完全安全。其他额外服务（如 `Bluetooth`）在默认设置中也被留在黑列表中。\n\
  \n* **Linux 定制内核**：`Kali Linux` 使用上游形式内核，该内核针对无线注入目的进行了补丁。\n\n* **一组受信任且最小的仓库**：考虑到\
  \ `Kali Linux` 的所有目标和目的，其核心关键在于维护给定系统的完整性。以首要目标为中心，`Kali Linux` 使用的上游软件完整集合被保持尽可能少。许多\
  \ `Kali Linux` 的新用户会被向 `sources.list` 中添加额外的仓库所诱惑。但这样做会导致破坏 `Kali Linux` 安装的风险。\n\
  \n 认为每个人都应该使用 `Kali Linux` 是不正确的。`Kali Linux` 特别地为安全专家设计。由于其独特属性，对于那些完全不熟悉 `Linux`\
  \ 功能或正在寻找用于桌面、游戏、网站设计等许多领域的通用 `Linux` 发行版的人来说，它并不是推荐的发行版。即使对于经验丰富的 `Linux` 用户，`Kali\
  \ Linux` 也可能伴随着某些挑战，这些挑战通常是为了维护系统的安全性而设置。\n\n# 第 10 章：Kali Linux 的不同工具\n\n众所周知，`Kali\
  \ Linux` 是一个基于 `Debian` 的开源发行版，它提供了用于安全审计和渗透测试的各种工具。它由 `Offensive Security` 开发，也是最知名的发行版之一，被伦理黑客广泛使用。`Kali\
  \ Linux` 最棒的一点是它不需要作为操作系统安装在系统中。相反，你可以简单运行 `iso` 文件，它可以很容易地加载到 `RAM` 内存中，通过约 600\
  \ 个工具测试系统的安全性。`Kali Linux` 为用户提供了各种形式的工具，如信息收集工具、漏洞分析工具、Web 应用工具、无线攻击工具、取证工具、嗅探和欺骗工具等。让我们来看一些最流行的工具。\n\
  \n## Kali Linux 的工具\n\n* **Nmap**: `Nmap` 可以被视为最流行的网络映射工具。它允许用户发现网络内的活动主机，并收集与渗透测试的相关信息。`Nmap`\
  \ 的一些主要功能包括：\n    1. 它带有主机发现功能，有助于识别可用的网络主机。\n    2. `Nmap` 带有端口扫描功能，允许用户计算远程或本地主机上开放端口的总数。\n\
  \    3. 它有助于获取网络的 `OS`，并发现有关连接设备的各种信息。\n    4. 它允许用户检测应用程序的版本并确定应用程序的名称。\n    5.\
  \ 它通过使用 `NSE` 或 `Nmap Scripting Engine` 来扩展 `Nmap` 的默认功能。\n\n* **Netcat**: 正如其名，`Netcat`\
  \ 的功能就像猫一样，有助于获取有关网络的详情。它作为网络探索的应用程序运行，不仅用于安全行业领域，在网络管理和安全管理领域也很有名。它通常用于检查出站和入站网络以及进行端口扫描。它还可以与\
  \ `C` 或 `Perl` 等各种编程语言或 `bash` 脚本结合使用。`Netcat` 的功能是：\n    1. `UCP` 和 `TDP` 的端口分析。\n\
  \    2. 入站和出站网络的嗅探。\n    3. `DNS` 的正向和反向分析。\n    4. 远程和本地端口扫描。\n    5. 与终端的标准输入集成。\n\
  \    6. `TCP` 和 `UDP` 隧道模式。\n\n* **Unicornscan**: 这是信息安全领域最好的工具之一，用于数据修正及收集。它还为用户提供\
  \ `UDP` 和 `TCP` 扫描，以及非常有益的发现模式，有助于发现远程主机。它还可以帮助发现运行在每个主机上的软件。`Unicornscan` 的功能是：\n\
  \    1. `TCP` 的异步扫描。\n    2. `UDP` 的异步扫描。\n    3. `TCP` 的异步 banner 检测。\n\n\n\n\n\
  \n## 4. 应用、操作系统和系统服务检测\n\n## 5. 使用自定义数据集的能力\n\n## 6. 支持 SQL 的关系型输出\n\n### Fierce\n\
  Fierce 是 Kali Linux 中的一个工具，主要用于端口扫描和网络制图。它还可以用于发现任何网络中的主机名和非连续的 IP 空间。它在功能上与 `Unicornscan`\
  \ 和 `Nmap` 类似，但与这两个工具不同，Fierce 专门为用于企业网络而设计。在渗透测试人员定义了目标网络后，Fierce 会针对该域运行多种测试，以获取可用于进一步分析和后渗透利用的重要信息。Fierce\
  \ 的功能包括：\n\n1. 扫描内部和外部 IP 范围\n2. 更改 DNS 服务器以进行反向查找的能力\n3. 扫描 IP 范围和整个 C 类网\n4. 帮助将日志功能保存到文件系统中\n\
  5. 发现名称服务器并进行区域传输攻击\n6. 使用自定义文本列表进行暴力破解的能力\n\n### OpenVAS\n又名为开放漏洞评估系统（Open Vulnerability\
  \ Assessment System），是一个任何人都可以使用的用于探索网络远程或本地漏洞的免费软件。该安全工具有助于编写并将自定义的安全插件集成到 OpenVAS\
  \ 平台中。OpenVAS 的主要功能是：\n\n1. 它作为一个端口扫描器和网络制图工具工作\n2. 它有助于发现同时在线主机\n3. 它支持 `OpenVAS`\
  \ 传输协议\n4. 它集成了 `SQLite` 等 SQL 数据库\n5. 执行每周或每日扫描\n6. 帮助将结果导出为 HTML、XML 或 LateX 格式的文件\n\
  7. 具有恢复、暂停和停止扫描的能力\n8. 完全支持 Linux 和 Windows\n\n### Nikto\nNikto 用 Perl 语言编写，是 Kali\
  \ Linux 中包含的工具，作为 OpenVAS 以及其他漏洞扫描工具的补充工具使用。它允许渗透测试人员和道德黑客对整个 Web 服务器进行扫描，以发现漏洞和安全缺陷。该工具通过寻找应用程序和文件的不安全模式、过时的服务器软件以及软件和服务器的默认名称和配置错误来收集所有安全扫描结果。它还支持用于\
  \ SSL 加密的各种代理服务器、基于主机的身份验证等许多其他功能。Nikto 的主要功能是：\n\n1. 它帮助扫描服务器上可用的多个端口\n2. 它带有 IDS\
  \ 规避技术\n3. 它提供 XML、TXT、NBE、HTML 和 CSV 格式的输出结果\n4. 它带有 Apache 和 `cgiwrap` 用户名的枚举\n\
  5. 它对指定的 CGI 目录进行扫描\n6. 它可以通过文件、Fav 图标（favicons）和标头识别系统中安装的软件\n7. 它使用自定义的配置文件\n\
  8. 它帮助调试并提供详细输出\n\n### WPScan\nWPScan 用于审计 WordPress 安装的安全性。通过 `WPScan` 的帮助，你可以轻松地发现你的\
  \ WordPress 设置是否容易受到任何形式的攻击，或者它是否在核心、主题文件或插件中泄露了过多信息。该工具还允许用户找到每个注册用户的弱密码，并可以运行暴力攻击以找出哪些密码可以被破解。WPScan\
  \ 的功能是：\n\n1. 枚举 WP 用户名\n2. 非侵入性的安全扫描\n3. 枚举 WP 插件漏洞\n4. 弱密码破解和 WP 暴力攻击\n5. WordPress\
  \ 安全扫描的调度\n\n### CMSMap\nCMSMap 是一个用 Python 编写的开源项目。它有助于自动化 Joomla、WordPress、Moodle\
  \ 和 Drupal 的漏洞扫描和检测任务。该工具还可以用于运行暴力攻击，并在发现漏洞后进行各种利用。CMSMap 的主要功能是：\n\n1. 它支持多种威胁扫描\n\
  2. 它具有设置自定义标头的能力\n3. 它支持 SSL 加密\n4. 将输出保存为文件\n\n### Fluxion\n该工具作为 Wi-Fi 分析器工作，专门用于\
  \ WPA 的中间人攻击（MITM）。它允许用户轻松扫描无线网络。与其它 Wi-Fi 破解工具相比，该工具通常不需要大量时间。与其启动暴力攻击，该工具会生成 `MDK3`\
  \ 进程，确保连接到 Wi-Fi 的用户被取消身份验证（deauthenticated）。之后，该工具会将 Wi-Fi 密码发送给你，这样你就可以轻松获得访问。\n\
  \n除了这些工具外，Kali Linux 还有许多工具，如 `Aircrack-ng`、`Kismet Wireless`、`Wireshark`、`John\
  \ the Ripper` 等。\n\n# 第 11 章：Kali Linux 如何用于黑客攻击\n\n我们大家都知道 Kali Linux 是专为渗透测试和安全审计而设计的，它也可以用于道德黑客所需的测试。Kali\
  \ Linux 包含了大量工具，有助于组织或公司的安全基础设施测试和其他形式的测试。\n\n### 谁在使用 Kali Linux？为什么要用？\nKali Linux\
  \ 可以被认为是今天发现的最独特的操作系统形式，因为它 是一个好人和坏人都可以使用的平台。安全管理员和黑客客都使用该平台来满足他们的需求。一个人使用该系统是为了防止和检测安全基础设施的泄露，而另一个人使用该操作系统是为了识别并借此利用漏洞。Kali\
  \ Linux 包含的大量工具被认为是安全专业人士工具箱中的瑞士刀。广泛使用 Kali Linux 的专业包括：\n\n* **安全管理员**：负责保护机构的信息和数据。安全管理员广泛使用\
  \ Kali Linux 来确保安全环境中不存在任何形式的漏洞。\n* **网络管理员**：负责维护安全高效的网络。网络管理员使用 Kali Linux 进行网络审计。例如，Kali\
  \ Linux 可以轻松检测到非法接入点。\n* **网络架构师**：这些人负责为网络设计安全环境。他们使用 Kali Linux 审计内部网络设计，并确保没有配置错误或遗漏。\n\
  * **渗透测试人员**：渗透测试人员使用 Kali Linux 审计安全环境，并对他们负责的企业环境进行侦察。\n\n\n\n\n\n- **CISO**:\
  \ 首席信息安全官利用 `Kali Linux` 对其基础设施环境进行内部审计，并发现环境中是否安装了任何新形式的应用程序或恶意配置。\n- **取证工程师**:\
  \ `Kali Linux` 带有取医取证模式，允许取证工程师在各种实例中执行数据发现和数据恢复。\n- **白帽黑客**: 白帽黑客或道德黑客与渗透测试员相似，他们使用\
  \ `Kali Linux` 进行审计，并寻找安全环境中可能存在的漏洞。\n- **黑帽黑客**: 黑帽黑客使用 `Kali Linux` 寻找系统漏洞并进行利用。`Kali\
  \ Linux` 带有各种社交工程应用程序，黑帽黑客可以轻松利用它们来攻击个人或组织。\n- **灰帽黑客**: 灰帽黑客也像黑帽和白帽黑客一样使用 `Kali\
  \ Linux`。\n- **计算机爱好者**: 这是一个非常通用的术语，但任何对了解更多计算机和网络的人都可以使用 `Kali Linux` 系统来学习更多网络、信息技术以及常见形式的漏洞。\n\
  \n## 攻击过程\n`Kali Linux` 作为一个黑客平台非常受欢迎。“黑客”一词并不总是负面的，因为它也被用于利用之外的其他各种工作。通过收集有关使用\
  \ `Kali Linux` 进行攻击过程的大量知识，你可以学习如何进行漏洞检查，并且在你选择将道德黑客作为职业选择时，如何修复它们。使用 `Kali Linux`\
  \ 进行攻击的过程与通用的攻击过程相似，黑客试图进入组织或公司的服务器，从而获得存储在服务器中的数据所有形式的访问权限。攻击过程可以分为五个不同的步骤。\n\n\
  ### 1. 侦察 (Reconnaissance)\n这被视为开始攻击过程的第一步。在这一阶段，黑客倾向于使用所有可用手段收集有关目标系统的所有形式的信息。它包括多个阶段，例如目标识别、确定目标\
  \ IP 地址范围、可用网络、`DNS` 记录等。简单来说，黑客收集网站或服务器的所有联系方式。黑客可以通过使用诸如 `maltego` 等各种形式的搜索引擎来研究目标系统（例如服务器或网站），或者利用诸如\
  \ `HTTPTrack` 等其他工具来下载完整网站以供后续阶段进行枚举。在黑客完成所有这些步骤后，他可以确定员工姓名、职位以及员工指定的电子邮箱地址。\n\n\
  ### 2. 扫描 (Scanning)\n在收集有关目标的所有形式信息后，黑客开始第二阶段，即扫描。黑客在这一阶段利用多种形式的工具，如拨号器、端口扫描器、网络映射器、漏洞扫描器等许多。由于\
  \ `Kali Linux` 预装了大量的工具，黑客在这一阶段甚至不会遇到任何困难。黑客试图寻找有关目标系统的信息，这些信息实际上可以帮助推进攻击，例如 IP\
  \ 地址、用户帐户和计算机名称。当黑客完成基础信息收集后，他们开始寻找目标系统内部其他可能的攻击途径。黑客可以从 `Kali Linux` 中选择诸如 `Nmap`\
  \ 等各种工具进行网络映射。黑客试图寻找自动邮件回复系统，或者简单地基于他们收集的信息。黑客进入下一步，包括向公司员工发送关于各种查询的邮件，例如向公司的人力资源部门发送关于职位空位的详细查询。\n\
  \n### 3. 获取整体访问权限 (Gaining overall access)\n在涉及攻击时，这一阶段被认为是最重要的。在这一阶段，攻击者尝试创建被攻目标的网络蓝图设计。它是根据黑客收集的所有相关信息创建的。在黑客完成枚举和扫描阶段后，现在出现的步骤是获取目标网络的访问权限，这完全基于收集的信息。可能会发生黑客想要使用钓鱼攻击的情况。他可能会尝试稳妥起，只使用非常简单的钓鱼攻击来获取访问权限。黑客可以决定从组织的\
  \ IT 部门进入目标系统。\n\n攻击者还可能得知公司最近进行了招聘，这有助于加速程序。对于钓鱼攻击，黑客可能会使用一种特殊的程序，利用公司 CTO 的真实邮箱地址发送钓鱼邮件，并将邮件发送给所有技术人员。用于钓鱼的邮件将包含一个网站，该网站有助于收集登录所需的所有用户\
  \ ID 和密码。黑客还可以使用其他选择如手机应用、网页邮箱或其他平台向用户发送钓鱼邮件，然后要求个人使用提供的凭据登录新的 Google Portal。当黑客决定使用这种技术时，他们有一种运行在自己系统后台的特殊类型程序，称为\
  \ `Social Engineering Toolkit`（社交工程工具包）。攻击者用它在通过 `bitly` 或 `tinyurl` 屏蔽服务器地址后，直接向用户发送带有地址的邮件。攻击者还可以使用其他方法获取系统访问权限，例如通过使用\
  \ `Metasploit` 创建 `PFD` 格式文件的反向 TCP/IP Shell。攻击者还可以利用缓冲区溢出进行攻击，这些攻击基于堆栈或会会持，最终导致获得对目标服务器的整体访问权限。\n\
  \n### 4. 维护对服务器的访问 (Maintaining the access to the server)\n黑客获得目标服务器访问权限后，他将试图保持对服务器的访问，并确保未来利用和攻击的安全。当黑客获得整个系统的访问权限时，他可以将劫持的系统作为自己的个人基地，并用它对其他系统发动多次攻击。在黑客获得目标系统的访问权限并最终拥有该系统后，被劫持的系统被称为僵尸系统。黑客获得了一全新的电子邮件地址和帐户，并可以从同一域名开始使用这些帐户测试其他形式的攻击。为了隐藏在系统中，黑客还会尝试创建一个全新的管理员帐户并试图融入系统。\n\
  \n\n\n\n\n为了安全起见，黑客还会开始查找并识别系统中长期未被组织使用的账户。在黑客发现这类账户后，他会更改所有旧账户的登录密码，并将所有此类账户的权限提升至系统管理员权限（类似于备用账户），以便安全地对目标网络进行访问。\n\
  \n黑客还可以开始向组织内的其他用户发送各种电子邮件，这些邮件可能包含 `PDF` 格式的受利用类型文件，并带有反向 shell（reverse shell）方案以扩展其在系统内的全面访问权限。在完成所有操作后，黑客会等待一段时间，以确保系统中没有检测到任何形式的干扰。在确认这一点后，他开始创建可用用户数据池的副本，如联系人、文件、消息、电子邮件以及各种形式的数据，供后续阶段使用。\n\
  \n### 清除痕迹\n\n在开始系统攻击之前，黑客会规划整个攻击路径以及身份伪计划，以便在出现任何异常时无人能追溯到他们。黑客通过修改其 `MAC address`\
  \ 开始这样做，然后通过 `VPN` 运行同一系统，以便轻松掩盖自己的身份。\n\n在黑客实现目标后，他们开始清理自己的路径和痕迹。这一完整阶段包含了许多工作，例如清理\
  \ `temp files`、已发送的邮件、服务器日志以及其他各种内容。黑客还会尝试确保邮件提供商不会发出任何警报信息，以免引起目标组织注意系统内任何形式的未经授权或未识别的登录。\n\
  \n\n\n\n渗透测试人员遵循所有这些步骤，目的是测试系统的漏洞，并确保系统中存在的漏洞已得到妥善修复。\n\n# 第 12 章：使用 Kali Linux\
  \ 进行端口扫描的技术\n\n识别目标系统上的开放端口对于定义目标的攻击面至关重要。目标的开放端口对应于在系统上运行的网络服务。编程中的错误或实现中的缺陷可能导致所有这些服务都极易受到攻击，并可能导致整个系统被破解。为了确定最可能的攻击向量，你需要列举项目范围内所有远程系统上处于开放状态的端口。开放端口的数量也对应于可以通过\
  \ `TCP` 或 `UDP` 流量轻松访问的服务。\n\n`UDP` 和 `TCP` 都是传输层协议。`TCP`（传输控制协议）比 `UDP` 更为常用，且提供面向连接的通信。`UDP`（用户数据报协议）是一种本质上是非面向连接的协议，有时也用于那些对传输速度比数据完整性更重要的服务。用于列举此类服务的渗透测试形式被称为端口扫描。这种技术有助于产生足够的信息，以识别该服务是否与服务器或设备上的任何端口关联。\n\
  \n## UDP 端口扫描\n\n由于 `TCP` 作为传输层协议的使用频率比 `UDP` 高，因此由 `UDP` 运行往往最被忽略。尽管忽视 `UDP` 服务是常态，但为了全面理解任何形式目标的攻击面，枚举这些服务也至关重要。使用\
  \ `UDP` 进行扫描的形式往往被认为是枯燥、具有挑战性且耗时的。为了深入了解这些工具的功能原理，理解所使用的两种完全不同的 `UDP` 扫描方法非常重要。\n\
  \n使用的第一种技术是完全依赖 `ICMP` 端口不可达响应。这种形式的扫描依赖于假设：未连接到活跃服务的 `UDP` 端口将返回 `ICMP` 端口不可达响应。缺乏响应被视为服务运行的指示。尽管这种方法在各种情况下可能非常有效，但在主机无法生成端口不可达响应，或者端口不可达回复被任何形式的防火墙过滤或受到速率限制的情况下，也有可能返回不准确的结果。\n\
  \n它还有另一种替代方案，即使用特定服务的探测来尝试请求响应，该响应将指示目标服务正在目标端口上运行。虽然这种方法可能非常有效，但同时也非常耗时。\n\n##\
  \ TCP 端口扫描\n\n`TCP` 端口扫描包括多种方法，如连接扫描、隐身扫描以及僵尸扫描。为了理解所有这些扫描技术的工作原理，你需要理解 `TCP` 连接是如何建立和维护的。`TCP`\
  \ 是一种面向连接的协议。只有在两个系统之间成功建立连接后，数据才会通过 `TCP` 传输。与创建 `TCP` 连接相关的过程通常被称为三次握手。该术语源于连接过程中涉及的三个不同步骤。\n\
  \n想要建立连接的设备会发送一个 `TCP SYN` 数据包，并带有它想要连接的设备端口。如果设备想要连接的端口关联的服务接受了连接，端口将向请求连接的系统返回一个带有激活的\
  \ `ACK` 和 `SYN` 位的 `TCP` 数据包。当请求系统用 `TCP ACK` 响应返回该端口时，连接即告成功。这三个步骤总共概括了在两个系统之间建立\
  \ `TCP` 会话所需的三个步骤的过程。所有的 `TCP` 端口扫描技术将执行此整个过程的某种变体，以识别远程主机上的活跃服务。\n\n隐身扫描和连接扫描的过程都非常容易理解。连接扫描用于为被扫描的每个端口建立完整的\
  \ `TCP` 连接。这是对每个扫描的端口完成三次握手执行的。当连接成功建立时，端口被确定为开放状态。然而，在隐身扫描的情况下，并没有建立完整的连接。隐身扫描通常被称为\
  \ `SYN` 扫描或半开放扫描。\n\n对于扫描的每一个端口，都会向目标端口发送一个单一的 `SYN` 数据包，所有回复 `SYN+ACK` 数据包的端口都被视为运行着活跃的服务。由于发起连接的系统没有发送最终的\
  \ `ACK`，连接被留为半开放状态。这被称为隐身扫描，因为只记录已建立连接的日志解决方案不会记录已执行扫描的任何形式的证据。\n\nTCP 端口扫描的最后一种方法是僵尸扫描。僵尸扫描的首要目标是映射远程系统上所有的开放端口，而不会产生任何你曾与该系统进行交互的证据。僵尸扫描运行的原理在本质上是复杂的。你可以按照以下步骤执行僵尸扫描：\n\
  \n- 首先识别作为僵尸的远程系统。你需要识别的系统具备以下特征：\n    1. 它处于空闲状态，不会与网络上的其他可用系统进行主动通信。\n    2. 它需要使用增量形式的\
  \ `IPID` 序列。\n\n- 然后，你需要向僵尸发送一个 `SYN+ACK` 数据包，并记录 `IPID` 的初始值。\n\n- 向扫描目标系统发送一个\
  \ `SYN` 数据包，并带有僵尸系统的伪造源 IP 地址。\n\n- 根据目标扫描的端口状态，会发生以下任一类情况：\n    1. 如果端口处于开放状态，扫描目标将向僵尸主机返回一个\
  \ `SYN+ACK` 数据包，它认为对方发送了原始的 `SYN` 请求。在这种情况下，僵尸主机将对未请求的 `SYN+ACK` 数据包响应一个 `RST` 数据包，并将\
  \ `IPID` 的值加 1。\n    2. 如果端口处于关闭状态，扫描目标将向僵尸主机返回一个 `RST` 响应，它认为对方发送了原始的 `SYN` 请求。`RST`\
  \ 数据包不会向僵尸主机请求任何形式的响应，因此 `IPID` 的值不会增加。\n\n\n\n\n\n向僵尸主机发送另一个 `SYN+ACK` 数据包，然后评估返回的\
  \ `RST` 响应包中 `IPID` 的最终值。如果该值增加了 1，则目标扫描的端口为关闭状态；如果该值增加了 2，则目标扫描的端口处于开放状态。为了执行僵尸形式的扫描，需要向僵尸系统发送一个初始\
  \ `SYN/ACK` 请求，以确定返回的 `RST` 数据包中 `IPID` 的当前值。然后向扫描目标发送一个伪造的 `SYN` 数据包，源 IP 地址格式为僵尸系统。由于僵尸实际上并没有发送初始\
  \ `SYN` 请求，它会将 `SYN/ACK` 响应解释为未请求的，然后向目标系统发回 `RST` 数据包，从而使 `IPID` 值增加 1。在最后阶段，需要向僵尸系统发送另一个\
  \ `SYN+ACK` 数据包，它将返回一个 `RST` 数据包并将 `IPID` 值增加 1。\n\n# 第 13 章：渗透测试\n\n每一项 IT 基础设施都存在一些弱点，这些弱点最终可能导致严重的攻击，并可被用于窃取和操纵数据。在这种情况下，只有这样做一件事可以帮助防止黑客进入系统。你必须对你的安全基础设施进行定期检查，并确保结构中不存在任何形式的漏洞。渗透测试有助于发现系统中的漏洞以及多个弱点。作为网络的所有者或管理员，他们始终可以比黑客占据一些优势，因为他们必然了解网络拓扑、基础设施组件、服务、可能的攻击点、已执行的服务以及许多其他信息。渗透测试是在真实且安全的环境中进行的，这样如果发现任何漏洞，你可以对其进行修复并加固系统。\n\
  \n## 详细介绍渗透测试\n\n正如其名，渗透测试是对系统进行测试以确定是否存在第三方渗透可能的过程。渗透测试通常与伦理黑客混淆，因为两者在功能和运作上有些相似，目标也相同，但有非常细微的区别。在渗透测试中，测试人员扫描系统中任何形式的漏洞、恶意内容和缺陷。渗透测试可以在在线网络、服务器或计算机系统中进行。渗透测试的目标是加强组织的系统的安全性。与黑客攻击不同，渗透测试是合法的，如果使用得当，它可以产生奇效。渗透测试可以被视为伦理黑客的重要部分。\n\
  \n渗透测试需要定期执行，因为它具有提高系统能力并改进网络安全策略的力量。创建各种类型的恶意内容是为了钓出程序或系统中的弱点。为了有效的测试，创建跨越整个网络的恶意内容。渗透测试过程可能无法处理所有安全相关问题；但它可以帮助减少任何形式攻击的可能性。它有助于确保公司免受各种形式漏洞的影响，并帮助检查组织的防御措施是否足够。渗透测试确实有助于指出组织结构中的优势和弱点。需要注意的是，整个过程并不是随意的，它包含了严密的规划、相关管理的权限授予以及启动过程。\n\
  \n## 安全扫描器\n\n渗透测试过程在收集了组织的概览后开始寻找特定的弱点。为了执行这些操作，需要使用安全扫描器。取决于扫描器的类型和性质，工具可以帮助检查整个系统或网络的已知弱点。最全面的工具之一是\
  \ `OpenVAS`。该工具包含了大量的漏洞并可以检查防御。在 `OpenVAS` 工具识别了所有开放形式后，你可以轻松地使用 `Nmap` 发现。像 `Wireshark`\
  \ 这样的工具允许你发现网络活动中的任何形式内容。\n\n`Wireshark` 工具也用于识别指示黑客攻击的瓶颈，并需要持续检查。在企业组织中，基于 Web\
  \ 的应用通常依赖 `MySQL`、`Apache` 和 `PHP`。这些平台主导了整个格局，因为它们通常为攻击提供了巨大的机会。`Kali Linux` 提供了二十种专门用于应用测试的工具。Web\
  \ 分析中可以很容易找到此类扫描器。`w3af` 和 `Burp Suite` 被视为最佳工具。\n\n`Burp Suite` 有助于识别和测试漏洞，并且非常易用。从入侵者模块可以启动暴力破解攻击，这有助于在\
  \ Web 系统中注入所需的载荷。它还有助于检测不安全的配置。为了检测这些漏洞，`Burp Suite` 开始识别目标并从上下文中执行 `Spider` 命令。从扫描中获得的输出可以帮助你发现系统中的误配置。\n\
  \n通常，在使用并非设计用于手动处理的安全扫描器进行产品分析时，需要大量的谨慎。尽管各种操作用于识别攻击点，但你可以预期正在测试的相关系统可能受到影响。因此，你需要在镜像形式系统中执行这些测试。通常，系统的镜像受防火墙和系统\
  \ IDS 的保护，因此你也可以检查现有保护机制的整体有效性。多种形式的工具可以在各种模式下运行，这可能使 IDS 难以正确检测扫描。在智能模式下运行时，它们往往无法被检测。\n\
  \n## 探测弱点\n\n当你发现安全系统中存在漏洞后，需要执行的下一步是对它们进行全面探测。渗透测试的重要部分是使用工具来模拟尽可能知的攻击模式。`Metasploit`\
  \ 可以被视为广泛使用的渗透测试工具，也是渗透测试人员的极佳工具。\n\n# 第 14 章：VPN\n\n`VPN`或虚拟专用网络是一种用于为任何公共或私人网络（如互联网或\
  \ Wi-Fi 热点）增加隐私和安全的连接方法。`VPN` 被企业广泛用于保护各种私有和敏感数据。然而，近年来，使用私有 VPN 的热潮日益增长。这主要是因为最初所有的面对面互动现在转变为互联网形式的通信。使用\
  \ `VPN` 增加了隐私，因为初始系统的 IP 地址被虚拟网络提供者提供的 IP 地址取代了。订阅者可以从`VPN`服务提供处获取任何城市的 IP 地址。例如，你住在旧金山，但通过虚拟网络提供的服务，你可以看起来像住在阿姆斯特丹、伦敦或其他任何城市。\n\
  \n## 安全\n\n安全是企业多年来使用 VPN 服务的主要原因。有多种简单的方法可以拦截传输到网络的数据。`Firesheep`和 Wi-Fi 欺骗是信息被黑客的两种简单方法。为了更好地理解`VPN`的概念，防火墙帮助保护系统以及计算机上的数据，而`VPN`则帮助保护互联网或\
  \ Web 上的所有形式的数据。`VPN`通过各种高级形式的加密协议和隧道安全技术，来封装所有的在线数据传输。\n\n## 设置 VPN\n\n设置`VPN`是一项相当简单的工作。它通常就像输入用户名和密码一样简单。智能手机的主导性使其可以使用`L2TP/IPsec`和`PPTP`协议来轻松配置`VPN`。所有主要的操作系统都可以配置\
  \ VPN `PPTP`连接。`L2TP/IPsec`和`OpenVPN`协议需要一个开源性质的小应用程序，并且需要单独下载证书。\n\n\n\n\n\n##\
  \ VPN 协议\n\n- `PPTP`: 这种形式的协议从 Windows 95 早期一直存在于 VPN 领域。`PPTP` 的主要优势是可以在任何主流操作系统的上轻松设置。简单来说，`PPTP`\
  \ 帮助通过 `GRE` 协议对点点连接进行隧道。然而，`PPTP` 的安全性最近引发了一些质疑，尽管它仍然足够强大，但它并不是所有协议中是最安全的一个。\n\n\
  - `L2TP/IPsec`: 与 `PPTP` 相比，`L2TP/IPsec` 要安全得多，而且还带有其他许多功能。`L2TP/IPsec` 是通过按顺序结合两种不同类型的协议，以获得所有协议的特性。例如，`L2TP`\
  \ 协议被广泛用于创建隧道，而 `IPsec` 协议通过提供安全的通道形式提供帮助。这些协议的特性使得它们成为一种高度安全的包组合。\n\n- `OpenVPN`:\
  \ `OpenVPN` 是一种基于 `SSL` 的虚拟专用网络，并且日益受欢迎。用于此协议的软件本质上是开源的，而且具有高可用性。`SSL` 是一种与加密相关的成熟协议。`OpenVPN`\
  \ 可以轻松运行在任何单一 `TCP` 或 `UDP` 端口上，因此使其在本质上极具活性。\n\n## VPN 如何提供帮助？\n\n`VPN` 工作背后的概念非常简单。它帮助将电脑、智能手机或其他任何形式的设备直接通过互联网平台连接到另一台计算机或服务器。它还允许用户通过计算机相同的互联网连接来浏览互联网上的可用内容。因此，当你为了上网之目的连接的计算机系统来自另一个国家或地区时，它将显示连接的用户也来自服务器所在的国家。所以，`VPN`\
  \ 实际上可以帮助你连接到那些通常无法访问的网站。你可以将 `VPN` 用于多项任务，例如：\n\n- 绕过仅根据地理位置限制的网站的所有限制，主要用于流媒体音频和视频。\n\
  \n- 它可以在连接任何形式的未知 Wi-Fi 热点时帮助保护用户。\n\n- 你可以借助 `VPN` 帮助直接观看 `Netflix` 和 `Hulu` 等媒体的在线流媒体。\n\
  \n- 你可以在网上获得大量的隐私保护，因为 `VPN` 可以帮助隐藏你系统的实际位置。\n\n- 在使用种子下载（torrent）时，它可以帮助保护你的系统免受扫描。\n\
  \n今天 `VPN` 的使用大多是为了绕过地理限制，其目的是通过使用其他国家或地区的网络来观看互联网上各种形式的受限内容。在访问如咖啡馆等公共场所 Wi-Fi\
  \ 时，它非常有帮助。\n\n## 如何为自己获取 VPN？\n\n获取一个 `VPN` 并不困难，你可以根据自己的需要为自己获取一个。你可以从为自己创建一个\
  \ `VPN` 服务器开始，你也可以租 `VPN` 服务器。如果你想为你的工作场所创建一个 `VPN`，你也可以这样做。然而，在大多数情况下，`VPN` 的使用是为了浏览那些根据地区地理限制的内容，例如在许多地区和国家被禁止的种子下载。如果你只需要它来绕过限制，你可以在线下载\
  \ `VPN`。\n\n## VPN 如何工作？\n\n当你将平板电脑、智能手机或电脑等任何设备连接到 `VPN` 时，你的设备系统将开始模仿 `VPN` 的本地网络。网络流量将通过安全的连接形式直接发送到\
  \ `VPN`。由于用户的系统开始表现得像来自同一个网络，因此当用户坐在世界上其他地方时，他们可以轻松访问来自本地网络的所有资源。你还可以使用 `VPN` 来模仿你正位于\
  \ `VPN` 网络相同的位置。这种功能在访问受地理限制的网站时会发挥作用。\n\n当你连接到理想的 `VPN` 并开始上网时，你的设备将通过 `VPN` 连接与网站建立连接，该连接在整个过程中保持加密。`VPN`\
  \ 将把你的请求转发到网站服务器，并通过同一个通道带回响应。\n\n## VPN 及其用途\n\n`VPN` 在最近已成为一个热门话题，特别是在根据地区地理限制各种网站和内容之后。`VPN`\
  \ 可用于各种工作。让我们来看 `VPN` 的一些最基础的用途。\n\n- 你可以在移动时随时访问你的业务网络。`VPN` 被所有为了出差而需要旅行的旅行者使用。这类人需要访问其业务网络的资源。`VPN`\
  \ 可用于业务网络访问，以及在旅行期间访问本地网络资源。本地网络资源不需要直接暴露在互联网上，因此有助于提高连接的全面安全性。\n\n- 你可以在旅行时使用 `VPN`\
  \ 访问你的家庭网络。为此，你需要在旅行期间创建一个用于访问个人网络的 `VPN`。这将允许你访问通过使用 `VPN` 直接在互联网上实现的远程桌面访问。用户可以使用此功能共享本地区域文件，通过模仿你的设备与\
  \ `VPN` 网络处于相同网络上来玩在线游戏。\n\n- 你可以使用 `VPN` 一向 ISP（互联网服务提供商）隐藏你的浏览活动。假设你正在使用一个本质上是公共\
  \ Wi-Fi 网络。当你使用此类网络浏览任何内容时，非 `HTTPS` 类型的网站对于所有同样使用该网络的用户来说都是可见的（如果他们知道如何进行此类活动）。在使用公共\
  \ Wi-Fi 时，隐藏所有的浏览活动总是安全的，因为它还在此网络上提供了大量的隐私。`VPN` 可用于此类目的。你在互联网上请求任何内容都将通过 `VPN`\
  \ 连接，从而为你提供大量的隐私。这种技术对于绕过 ISP 的连接监控也很有用。\n\n- `VPN` 现在被广泛用于绕过互联网上广泛存在的审查。通过使用 `VPN`，你可以使用局域网的防火墙，然后通过\
  \ `VPN` 网络的防火墙访问互联网。\n\n- 你可以通过 `VPN` 浏览所有被地理锁定的网站。`VPN` 可以帮助轻松访问所有对某些地区和国家限制的网站。当你不在自己的国家时，你还可以使用\
  \ `VPN` 观看媒体的在线流媒体，如 `Hula`、`Netflix` 等其他许多。`VPN` 也用于文件传输。\n\n\n\n\n\n# 第 15 章：防火墙\n\
  \n随着网络犯罪率的日益增长，这已成为全球大多数企业面临的威胁，因此防火墙安全是保障您的组织安全的终极手段。“防火墙”一词实际上可以与物理形式的墙相比较，它可以帮助防止所有形式的未经授权人员进入。在计算机世界中，防火墙安全像一种网络设备，有助于阻止各种形式的网络流量，从而在不可信的网络和信任的网络之间建立一道巨大的屏障。它在某种意义上与物理墙相似，因为它试图阻止计算机攻击的传播。\n\
  \n## 防火墙及其类型\n\n随着网络攻击百分比的增加，防火墙类型也随着时间不断演变。今天可以发现多种类型和形式的防火墙。让我们来看看其中。\n\n### 状态防火墙\
  \ (Stateful firewall)\n状态防火墙是一种本质上具有一定智能性的防火墙。它有助于对所有活动状态的连接进行详细跟踪，以确保用户可以轻松自定义防火墙管理规则，允许真实属于已建立连接的回数据包通过。然而，这种形式的墙无法区分网络流量的好坏。它具有入侵防护功能，并能完全阻止有害的\
  \ Web 攻击。\n\n### 数据包过滤防火墙 (Packet filtering firewall)\n这种形式的防火墙与状态防火墙相似。它带有用于防火墙安全的各种规则，并具有根据端口号、IP\
  \ 地址和 IP 协议拦截互联网流量的能力。这种类型防火墙的唯一缺点是它允许所有形式的网络流量，包括实际上可能引发攻击的流量。在这种情况下，此类防火墙的用户需要在防火墙安全的基础上结合入侵防护。通过这种方法，能够过滤掉良恶的\
  \ Web 流量。数据包过滤防火墙还无法区分真实的回包和模仿合法数据包行为的数据包。因此显而易见，数据包过滤形式的防火墙将允许网络内所有形式的回包。\n\n###\
  \ 应用感知防火墙 (Application-aware firewall)\n这种形式的防火墙能够理解不同形式的协议，并根据签署者或规则对协议进行定义，以处理特定的协议部分。它通过为计算机系统提供灵活的防火墙保护来提供帮助。它允许规则同时具有特定性和全面性。它有助于改进深度包检测，但某些类型的攻击可能不会被这种防火墙注意到，因为防火墙的定义程序不够强大以管理实际流量的变化。\n\
  \n### 深度数据包检测 (Deep packet inspection)\n这是一种有助于实时检查数据包的防火墙。它还监控应用层上的攻击类型。这种类型的防火墙具有执行与入侵防护相关的各种功能的能力。这种形式的防火墙带有三种不同形式的警告。首先，某些厂商对深度检测的定义可能延伸到数据包的特定深度，从而不会检查整个数据包。这可能导致跳过某些最危险的攻击形式。其次，这种类型的防火墙很大程度上取决于硬件形式。因此，系统中的硬件可能不具备处理数据包深度检测所需的处理能力。您需要确保防火墙在检查数据包时可以轻松管理的带宽容量。最后，与防火墙管理相关的技术可能缺乏足够的灵活性百分比来管理所有攻击。\n\
  \n### 应用代理防火墙 (Application proxy firewall)\n这种形式的防火墙可以作为 `HTTP` 或 Web 流量等各种形式应用程序的中间器，拦截每一个请求。它在允许进入之前会对每一个请求进行验证。这种形式的防火墙具有一些入侵防护的主要特征。然而，在完整状态下应用这种防火墙是困难的。每个代理只能处理一种协议，例如传入的\
  \ Web 或电子邮件。为了获得这种防火墙的终极保护，需要接受所有协议，以便实现协议违规拦截。\n\n## 防火墙安全及其重要性\n\n在如今网络攻击可能随时发生的世界里，防火墙安全对于所有服务器和计算机系统都至关重要。窥探者总是在寻找连接到互联网的易受设备。连接到互联网的设备黑客可以通过互联网网关向设备植任何形式的有害代码或恶意软件来轻易攻击。恶意软件攻击可能导致数据泄露和利用。在这种情况下，防火墙非常重要，因为：\n\
  \n* 它帮助保护系统免受所有形式的未经授权访问。\n* 它有助于识别有害内容并拦截此类内容。\n* 它有助于为多人同时使用的网络建立一个安全的工作环境。\n\
  * 它有助于保护所有类型的机密数据和个人数据。\n\n\n\n\n\n# 第 16 章：密码学\n\n随着网络攻击百分比的激增，尽最大地保护各种敏感数据已变得至关重要。在当今这个世界上，数据泄露可能会导致许多企业遭受严重损失，也可能对个人构成威胁，例如窃取银行详情、信用卡信息、登录\
  \ ID 和密码等。\n\n密码学是将简单的明文（plain text）转换为一种在本质上上无法理解的形式的过程。这种技术使得机密数据的存储和传输变得极其简单。加密文本只有预定的接收并阅读该消息的人才能阅读。它有助于数据保护以及数据的身份验证。\n\
  \n密码学通常与各种类型信息的安全相关，这还包括通信技术以及源自数学概念的技术。该技术使用一组特定的规则以及计算，这些计算被称为算法。它们被用于将消息转换成极难破译的形式。算法还用于密码学的密钥生成以及数字形式的签名，目的是保护数据隐私、保障网站浏览以及信用卡交易、银行详情和电子邮件等敏感形式的通信。\n\
  \n## 密码学及其技术\n\n该过程的技术也与密码学（cryptology）和密码分析（cryptanalysis）的特征相关。该技术使用了多种其他技术，包括文字与图片的结合、微点（microdots）的使用以及其他步骤，这些步骤有助于隐藏要在网络中传输或存储在网络中的信息。明文被转换为编码文本，通常称为密文（ciphertext）。这是通过加密（encryption）过程完成的。可以在接收端通过解密（decryption）过程进行破译。\n\
  \n## 密码学及其目标\n\n密码学具有多种目标。让我们来看：\n\n*   密码学的目标是维护数据完整性。在发送者和接收者之间传输或存储在网络中的信息或数据不能以任何方式被更改或改变。在任何情况下，如果发生此类情况，通信双方都会收到通知。\n\
  *   它还有保护所有形式的敏感及个人数据的目标。其主要目的是为所有相关人员确保数据安全。网络传输或存储在网络中的数据或信息不能被网络外的任何第三方分析。\n\
  *   消息的创建者和发送者不允许在数据传输或创建的后期撤回其意图。这种行为被称为不可否认性（non-repudiation）。\n*   发送和接收双方在发送和接收信息之前都能够确认对方的身份。\n\
  \n## 密码学及其算法\n\n密码学系统通过一组程序运行，这些程序也称为加密算法或密码（ciphers）。它们用于消息的加密和解密，目的是保护和确保各种设备、计算机系统以及应用程序之间通信的安全。\n\
  \n一个密码套件（cipher suite）使用三种算法。它使用一种算法进行数据加密过程。第二种算法用于消息验证。第三种算法用于密钥交换过程。整个过程嵌入在协议中，并写在操作系统上使用的软件编程语言中，以及基于网络的计算机系统之中。它包括公钥的生成以及私钥的生成。信息的加密和解密、消息验证以及通过密钥交换程序进行数字形式签名都需要私钥。简单来说，算法可以被视为密码学的核心。\n\
  \n## 结论\n\n在你完成了整本书的教学之后，现在你可以轻松地对与黑客相关的过程建立清晰的认识。你还将获得关于 `Kali Linux` 运行的大量知识。到此时，你应该对为你的业务和个人使用创建安全可靠的网络服务器所需的所有工具和组件有了清晰的认知。你是对此一切负责的人。只有你才能可以保护整个系统并加强安全基础设施。\n\
  \n通过 `Kali Linux` 及其所有工具，你可以轻松完全控制与你的业务及个人网络相关的网络安全接口。这本书不仅关于 `Kali Linux`，因为你还学习了关于一些基础网络组件及其安全性。你可以使用\
