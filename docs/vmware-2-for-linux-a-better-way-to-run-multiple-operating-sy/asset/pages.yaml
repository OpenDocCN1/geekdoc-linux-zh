    3. The settings program should automatically add your hardfile to the Volumes
    list. Below the list is an entry for Unix Root. Basilisk II will mount your Linux
    file system as a drive in the Mac emulation, but you can specify where the initial
    mountpoint should be. You will probably select either / (to make the entire file
    system visible to the emulator) or your home directory, like /home/jcompton.


    4. Under normal circumstances, leave the Boot From option alone. But if you ever
    need to reinstall the MacOS, or you want to force the emulation to boot from a
