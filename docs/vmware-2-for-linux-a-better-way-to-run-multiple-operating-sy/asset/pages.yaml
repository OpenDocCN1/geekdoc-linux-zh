- pgno: 300
  md: '# Installing Networking Support


    Whenever possible, stick with swapping floppies and mounting the DOS virtual disk
    in Linux to transfer files. But if you want to get adventuresome, it is possible
    to do real networking on a DOS virtual machine.


    LAN and Internet access under DOS is not an exact science, and the various tips,
    tricks, pitfalls, and workarounds could fill a book. If you plan to get serious
    about using network applications under DOS, you should visit http://www.tdisk.com
    and http://www.oldskool.org/~tvdog/internet.html. They both have comprehensive
    information on DOS Internet tools and configuration tips.


    You can use a modem for SLIP or PPP access in DOS, but it''s quite tricky. You
    need to make sure the virtual machine''s COM1 is active. The Tvdog site will help
    guide you, but I recommend you let your Linux PC bear the brunt of your dial-up
    modem work.


    The virtual Ethernet card requires a driver before it can run in DOS. You can
    download the PCNet Family packet driver from http://www.amd.com/products/npd/software/pcnet_family/drivers/pktdrv.html,
    or check out the /AMD NIC Drivers directory on the CD included with this book.


    For some perverse reason, AMD has taken to archiving DOS programs with a program
    that requires Windows to decompress them. As such, you might find it rather frustrating
    just to get at the software you need to install networking. You need the services
    of a real Windows PC or a Windows virtual machine you can easily start and transfer
    programs from.


    Here''s the procedure:


    +   1. Obtain the pktdrv.exe program from AMD or this book''s CD, and uncompress
    it in a Windows virtual machine or on a Windows PC.

    +   2. Copy the resulting programs to a floppy.

    +   3. Load your DOS virtual machine and create a new directory, C:\AMD.

    +   4. Copy the uncompressed files to the new directory on the virtual disk.

    +   5. When you want to activate the Ethernet driver, type pcntpk.com int=0x60
    from the C:\AMD directory.


    > If you decide you want Ethernet access to load automatically when you start
    DOS, add the line c:\amd\pcntpk.com int=0x60 to the autoexec.bat file.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Installing Miscellaneous Devices


    As with any other virtual machine, if you have sound configured on the Linux host,
    you can make a virtual SoundBlaster 16 (minus MIDI capability) available to DOS
    programs.


    To ensure that DOS applications properly find the sound device, you should edit
    autoexec.bat and add the following line, as shown in Figure 14.12:


    ```

    set blaster=A220 I5 D1

    ```


    This should enable old DOS programs to properly see the sound hardware and help
    newer "autoconfig" programs find the interface more quickly.


    > The full specification of the virtual sound card: It is located on IRQ 5, DMA
    channel 1, 16-bit DMA channel 7.


    Most DOS applications do not contain their own mouse support: They expect to see
    a mouse driver residing somewhere in DOS memory.


    Newer editions of DOS typically come with a mouse driver (usually known as MOUSE.COM
    or MOUSE.EXE). You have nothing to lose: Try typing MOUSE at a DOS prompt and
    see whether the driver starts. If not, a quick Web search on the technical support
    download areas of mouse manufacturers, such as Logitech, should yield quick results.
    Any reasonably modern mouse driver should detect the generic virtual mouse.


    You can run the mouse driver whenever you need mouse access or add a call to the
    MOUSE program to the autoexec.bat file if you prefer.


    ![](img/b2b6702758c230ce537468351fc8af15_301_0.png)


    ![](img/b2b6702758c230ce537468351fc8af15_301_1.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Applications and limitations in DOS


    Between Windows and Linux, you may have forgotten, but for over a decade DOS was
    the single most popular business and home operating system. Surely, you can think
    of something you''re interested in running.


    # Installing Useful Programs


    Your first order of business, after you''ve completed all the installation steps,
    should be to get your hands on a DOS-compatible UNZIP tool. You can download a
    self-extracting MS-DOS version of PKZIP from http://www.pkware.com.


    The DOS PKZIP archive is only a few hundred kilobytes in length. Shuttle it to
    the virtual machine using a floppy disk or virtual drive mounting, and run the
    self-extraction program. Then copy PKUNZIP.EXE to C:\DOS or another directory
    in the DOS command path.


    After that, you''re ready to install most any freeware/shareware package out there,
    and there are certainly plenty that have been created in the 20 years since DOS
    was introduced. Most commercial applications that can operate within the limitations
    of the DOS virtual machine (see next section) will be perfectly happy to run in
    your VMware window. See Figure 14.13 for an example.


    Although enthusiasm for developing and maintaining new productivity applications
    for DOS has certainly waned in recent years, familiarity and speed of execution
    are important to many people. This may be your big chance to get back into classic
    Lotus 1-2-3!


    ![](img/b2b6702758c230ce537468351fc8af15_302_0.png)


    Figure 14.13 The venerable WordPerfect for DOS, as well as tens of thousands of
    other programs and games, await you.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'On the other hand, given the state of applications for Linux, to say nothing
    of the availability of Windows through VMware, it could be that you want to use
    DOS primarily for gaming. Gaming with VMware is covered in Chapter 15, "Playing
    Games with VMware."


    # Working Around VMware-Related Limitations


    I''ve already mentioned that VMware does not support expanded memory (EMS) in
    DOS, which is a shame because some programs insist on having access to EMS. There''s
    really nothing to be done until and unless VMware decides that the problem is
    serious enough, and of enough concern to their customers, to fix. You can have
    all the extended memory (XMS) you like, which is some consolation.


    A quick browse through this chapter should betray another major problem with VMware
    and DOS: There is no VMware Tools step. No accelerated, high-color graphics driver
    and no custom mouse interface or disk shrinking tool.


    When you use a DOS virtual machine, you are limited to plain VGA capabilities:
    a graphics screen of 640×480 resolution and 16 colors or 320×200 resolution and
    256 colors. That''s adequate for a wide range of DOS applications and even games,
    because plain VGA wasn''t a common standard until the early 90s and developers
    couldn''t always assume their customers had video cards capable of supporting
    SVGA and beyond.


    There is another interesting problem running DOS in VMware. Remember the VMware
    CPU sharing model? It only works the way it is intended to when the guest operating
    system shows a little cooperation and doesn''t try to hog the CPU when applications
    are not running. Unfortunately, most versions of DOS do not properly "idle" the
    CPU even when they are not busy, which can cause VMware to occupy an abnormally
    large share of CPU time when you are working in the host instead of the guest.


    A small program called DOSIdle solves this problem by correctly "throttling" the
    CPU to low levels of consumption when DOS is not in use. This frees up resources
    for the Linux host.


    To use DOSIdle, follow these steps:


    +   1. Download the DOSIdle archive from http://www.vmware.com/software/dosidle210.zip.
    (You might want to rename it to something that complies with the DOS 8.3 filename
    limits, such as simply dosidle.zip.)

    +   2. Using the method of your choice, copy the dosidle archive to a new directory
    on the virtual disk, c:\dosidle.

    +   3. Unzip the archive, probably by typing pkunzip dosidle.zip.

    +   4. Type dosidle at the prompt. You should see a short printout summarizing
    your virtual machine''s configuration, shown in Figure 14.14.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/b2b6702758c230ce537468351fc8af15_304_0.png)


    Figure 14.14 DOSIdle helps prevent the DOS virtual machine from monopolizing your
    CPU''s attention.


    5. That''s all! You should run DOSIdle every time you use the virtual machine
    and suspect you might want to multitask in Linux or another virtual machine. Therefore,
    you might want to add the line c:\dosidle\dosidle to the bottom of your autoexec.bat
    file.


    Because DOS has no VMware Tools, you cannot directly shrink a DOS virtual disk.
    You can, however, mount the DOS virtual drive in a Windows or Linux virtual machine
    and initiate the shrink from there.


    # Networking in DOS: Tricky, but Possible


    If you have the patience to install the AMD PCNet Family packet driver, you''re
    about halfway to exploiting the virtual Ethernet card in VMware. Now you need
    a networking program to run. You may have noticed I have a fondness for FTP, so
    why would I stop now?


    This is how you download, install, and test an FTP program from DOS:


    +   1. Download the Wattcp FTP program from ftp://ftp.oldskool.org/pub/tvdog/internet/ftp07.zip

    +   2. Transfer the ftp07.zip archive to the DOS virtual machine via floppy or
    virtual disk mount.

    +   3. Unzip the archive into a new directory, c:\ftp.

    +   4. Before you can run any Internet programs, you need to configure your IP
    address. Unfortunately, using dynamic address schemes such as a DHCP is difficult
    to do manually using most DOS Internet clients. You have to do it yourself no
    matter what. The IP configuration file for this FTP program is'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'called wattcp.cfg. You have to create it inside the c:\vfp directory by opening
    a new file in the DOS text editor. Type edit wattcp.cfg. A blank editor screen
    should appear.


    # 5. Type the following four lines into the new file exactly as they appear. You
    will go back and fill in the blanks in the upcoming steps:


    ```

    my_ip=

    netmask=

    nameserver=

    gateway=

    ```


    # 6. After my_ip=, enter an IP address appropriate to the type of virtual Ethernet
    connection (bridged or host-only). Unfortunately, if you use bridged networking
    and your LAN uses DHCP, you need to choose an address valid for your network,
    but unlikely to be assigned to any other computer. If you use host-only networking,
    the problem is not as severe. In fact, if you are sure you will never run more
    than one virtual machine at a time, you can simply steal the host-only IP address
    from a Windows or Linux virtual machine by looking up the information, writing
    it down, and transferring it to this configuration file.


    # 7. After netmask=, enter the netmask for the network the virtual Ethernet card
    will address. For many bridged LANs, and nearly all host-only configurations,
    this is 255.255.255.0.


    # 8. If you are on a bridged network, enter the address of your primary nameserver
    after the nameserver= blank. If you have more than one DNS available, create additional
    nameserver= lines. Unless you are running DNS service on the host PC, this setting
    is meaningless in a host-only environment.


    # 9. If you are on a bridged network, enter the address of your Internet gateway
    in the gateway= line. For host-only networking, enter the IP address of your Linux
    PC''s vmnet1 adapter. (Throughout the course of the book, I used 192.168.71.1
    as an example.)


    # 10. Save the file and exit the text editor. The fruit of your labors should
    resemble Figure 14.15, a sample completed wattcp.cfg file.


    > A great many DOS Internet clients rely on the wattcp.cfg file, so once you create
    it, you can simply copy it into the program directory of other network clients
    and not worry about configuring them.


    # 11. If you''re not running the packet driver already, run it now.


    # 12. Run the FTP program by typing ftp at the DOS prompt.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/b2b6702758c230ce537468351fc8af15_306_0.png)


    Figure 14.15 Lines beginning with # are comments and are ignored by the FTP client.


    +   13. The syntax for this FTP program is virtually identical to FTP in Linux.
    Connect to your Linux host PC by typing open <host IP address>.


    +   14. Log in with a valid username and password on your Linux PC.


    +   15. You are free to transfer files back and forth between your Linux host
    PC (or the outside world, if you''re on bridged networking) and your DOS virtual
    machine. A connection from the DOS guest to the Linux host is shown in Figure
    14.16. It''s much faster than floppies.


    Despite the inconvenience of packet drivers and configuration files, there is
    a wide range of network clients out there, including mail and news readers, Telnet
    and terminal programs, and even a few text-based and graphical Web browsers.


    ![](img/b2b6702758c230ce537468351fc8af15_306_1.png)


    Figure 14.16 The DOS virtual machine can leech files from the host via FTP.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'The cream of the crop of DOS Internet applications is Arachne, a freeware,
    pure DOS Web browser with a pleasant range of features. You can download it from
    the project''s home page, http://home.arachne.cz.


    > Deluxe versions of DR DOS come with DR-Webspyder, a commercial product based
    on Arachne''s core code but with some interesting enhancements.


    Before you install and run Arachne, you should run your packet driver, running
    a mouse driver is also highly recommended. Unless your network has DHCP or BOOTP
    capabilities, you need your network configuration information on hand.


    Arachne''s installer is extremely easy to use: Run the self-extracting archive,
    accept the default settings, and go! When the first graphical screen appears (see
    Figure 14.17), be sure you select the 640×480, 16-color graphics mode; anything
    else won''t work properly.


    Arachne can configure a PPP dial-up script if you want to use a modem, and it
    can also detect a running packet driver for your virtual Ethernet card. The prompts
    are done "wizard-style" and should be easy to follow if you''ve ever configured
    Windows or Linux networking. After you set the options, you are rewarded with
    the finest Web experience DOS has to offer, demonstrated in Figure 14.18.


    The DOS browser runs rather slowly because of the inefficient default VGA driver.
    Because there are no VMware Tools for DOS, video performance suffers greatly.


    ![](img/b2b6702758c230ce537468351fc8af15_307_0.png)


    Figure 14.17 640×480 and 16 colors is the best choice for Arachne.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/b2b6702758c230ce537468351fc8af15_308_0.png)


    Figure 14.18 Arachne can browse the Internet to give a free plug to my publisher


    Arachne''s home page also contains a number of plug-in modules for FTP, Telnet,
    and even MPEG movies that you can install with a single click. It really is a
    clever program, probably one of the best reasons to urge VMware to improve DOS
    graphics support in the future.


    # Installing Windows 3.1 in VMware


    Windows 3.1 was, to put it politely, a curiously designed operating system, especially
    compared to its successor, Windows 95. It was at the same time more transparently
    a shell on top of DOS, yet with arguably less integration between the GUI and
    command line.


    Is Windows 3.1 good for anything more than an academic trip back to the early
    90s? Perhaps. A reasonable number of applications from that era work equally well
    in Windows 95 and 3.1, and its resource requirements are lighter. (Windows 3.1
    can run comfortably in 8MB of RAM.) Still, I recommend moving to a newer edition
    of Windows if you''re really serious, or you value your time, because Windows
    3.1 requires a lot of post-installation enhancement.


    > In terms of needing outside software support, Windows 3.1 is easily the most
    demanding, and therefore frustrating and time-consuming, of all the operating
    systems VMware supports. I strongly recommend using Windows 95 instead, unless
    you absolutely demand the look and feel of 3.1.


    ![](img/b2b6702758c230ce537468351fc8af15_308_1.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Converting a DOS Virtual Machine


    Unlike other operating systems you use VMware to install, most Windows 3.1 installations
    require a working DOS system before you can get started. This is simply the nature
    of Windows 3.1.


    > For obvious reasons, Microsoft designed Windows 3.1 with MS-DOS in mind. Some
    versions of clone DOSs do not work properly with 3.1, although DR DOS 7 contains
    special tools for enhancing operation with Windows.


    To prepare the DOS virtual machine for Windows 3.1, do the following:


    +   1. In the VMware Configuration Editor, change the Guest OS setting from MS-DOS
    to Windows 3.1. If the VM''s memory setting is less than 8MB, you should increase
    it to ensure a comfortable environment.

    +   2. If you want sound support in Windows 3.1, you need to download the file
    sbbasic.exe from the SoundBlaster 16, Windows 3.1 drivers area of http://support.soundblaster.com.
    Transfer the file to a new directory, such as C:\sb16 on your DOS virtual disk,
    and run the sbbasic.exe file to extract the drivers. You will activate them later,
    when Windows 3.1 is running.

    +   3. If you want host-only LAN networking support in Windows 3.1 (Windows for
    Workgroups), you need to download the Windows 3.1 NDIS2 or NDIS3 drivers for the
    AMD PCNet Family card from AMD''s technical support site or from the /AMD NIC
    Drivers directory of the included CD-ROM. Unfortunately, like the DOS packet driver,
    the AMD archive requires Windows 95 or better to de-archive the files, so you
    need to use either a Windows 95 virtual machine or another computer to unpack
    the driver and then transfer it via floppy or network to the DOS virtual disk.
    Place it in a new directory, such as C:\amd31.


    > It is also possible, albeit challenging, to run bridged TCP/IP networking in
    Windows 3.1 or 3.11 using the AMD packet driver and an extra program in the AMD
    Ethernet driver package, winpkt.com. You also need Trumpet WinSock from http://www.trumpet.com.au.
    Configuring the Windows packet driver and Trumpet WinSock is quite a task, however.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Installing and Configuring Windows 3.1


    There is very little difference between a Windows 3.1 and Windows for Workgroups
    (3.11) installation, so I make no special mention of the differences except the
    obvious extra network configuration step in Windows for Workgroups:


    +   1. Start with a fresh reboot of the DOS virtual machine you just prepared
    for Windows 3.1.


    +   2. If you are installing Windows from floppies, remove any CD-ROMs from the
    drive. Windows scans all attached drives for Windows-compatible programs and creates
    program groups and icons for programs on your CD, which in most cases is a bad
    idea.


    +   3. Start the Windows 3.1 installation by typing setup at the appropriate drive
    prompt. The Microsoft "blue screen" installer appears, as seen in Figure 14.19.


    ![](img/b2b6702758c230ce537468351fc8af15_310_0.png)


    Figure 14.19 Windows 3.1 installation starts with a text screen.


    +   4. Press Enter to start the installation. When prompted, you can safely select
    an Express Setup unless you specifically know you want to avoid installing certain
    Windows components.


    +   5. Windows 3.1 scans the virtual machine for hardware (not especially well)
    and then copies files to the virtual disk (see Figure 14.20).


    +   6. Soon after, the Windows graphical environment will load, and your mouse
    pointer should work. If you are installing Windows for Workgroups, Windows tries
    (and fails) to identify your network card. When asked to enter your name, organization,
    and serial number as shown in Figure 14.21, follow the prompts and click Continue.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/b2b6702758c230ce537468351fc8af15_311_0.png)


    # Figure 14.20


    ![](img/b2b6702758c230ce537468351fc8af15_311_1.png)


    # Figure 14.21


    7. Windows installs various system components (or asks you to select which you
    want to install if you requested a Custom installation).


    8. After the wave of copying, Windows asks you to install a printer. If you have
