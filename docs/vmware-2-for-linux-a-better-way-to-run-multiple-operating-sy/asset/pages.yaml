- pgno: 390
  md: 'Although it is possible to add a raw disk to your system from the Configuration
    Wizard, I recommend that you either edit an existing virtual machine configuration
    or complete the wizard and then go back and use the Configuration Editor to create
    the raw disk.


    +   1. Open the virtual machine configuration in the Configuration Editor.

    +   2. Find a free slot in the IDE or SCSI Drives section.


    If you plan to boot from your raw disk, it is a good idea to use the Primary IDE
    (P-M) slot.


    +   3. Set the Device Type to Raw Disk.

    +   4. Type a name for your raw disk in the Name box. This will be the name of
    the “safe raw disk,” a small file stored in your VMware configuration directory
    that describes the layout of your hard drive to VMware. At this point, your screen
    should look much like Figure A.1.

    +   5. Click Create Raw Disk. A new window should pop up, prompting you for the
    device name of the hard drive you want to use for the raw disk.

    +   6. Type the name of the hard drive you want to use. Normally, this will have
    the form /dev/hda (where a can be b, c, d, or possibly higher) for IDE drives
    or /dev/sda (or sdb, sdc, and so on) for SCSI devices.


    ![](img/b2b6702758c230ce537468351fc8af15_390_0.png)


    Figure A.1  The Configuration Editor lets you add raw disks to the virtual IDE
    or SCSI chain.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '> The device name of the drive depends on what type of physical hard drive
    you use, not on whether you choose to configure it as a raw disk on the virtual
    IDE or SCSI controller.


    7. The Raw Disk Editor appears, as shown in Figure A.2. The Editor shows all of
    the partitions present on the drive, along with three options: No Access, Read
    Only, and Read/Write.


    ![](img/b2b6702758c230ce537468351fc8af15_391_0.png)


    Figure A.2 Use the Raw Disk Editor to control which partitions the virtual machine
    can access.


    8. In general, you should give the virtual machine Read/Write access to the MBR,
    or Master Boot Record (especially if you plan to boot from the raw disk or further
    partition the drive inside a VMware guest), along with any partitions you plan
    to use in VMware. Set the rest to Read Only (if you want to try to give the virtual
    machine access to the partition but are afraid of data corruption) or No Access.


    9. Click Save when finished.


    10. You return to the Configuration Editor screen. Click Install to finalize the
    raw disk settings and ensure that VMware will see the drive when you power on
    the virtual machine. The editor should resemble Figure A.3 when you complete this
    step.


    11. If you are curious about the layout of the safe raw disk file, the VMware
    documentation details how they are created and how they can be edited by hand.
    The safe raw disk files are plain text, which you can read with any editor or
    text viewer, such as more. A sample appears in Figure A.4.


    12. Power on your virtual machine to start using the raw disk.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'Figure A.3 After you click Install, VMware adds the raw disk you defined to
    the virtual machine setup.


    ![](img/b2b6702758c230ce537468351fc8af15_392_0.png)


    Figure A.4 Feel free to look at the safe raw disk files, but don''t make changes
    unless you are very sure of what you''re doing.


    ![](img/b2b6702758c230ce537468351fc8af15_392_1.png)


    What happens next depends on the rest of your virtual machine configuration. If,
    for example, you install a drive full of Windows data in your PC and add it as
    a raw disk in an existing Windows virtual machine, the new partitions should automatically
    be recognized and configured by Windows, as shown in Figure A.5.


    Many Linux environments also automatically recognize and configure new hard drive
    partitions.


    If your raw disk is blank, you need to use an OS installation CD or floppy to
    format and partition the drive. The strategies outlined in the OS-specific chapters
    of this book to format and install to virtual disks are essentially the same for
    raw disks.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/b2b6702758c230ce537468351fc8af15_393_0.png)


    Figure 6.5 Drives D and E are actually partitions on a real Windows hard drive,
    configured as a raw disk in VMware.


    # Creating Plain Disks


    Raw disks have their advantages, but their use is obviously predicated on having
    a spare hard drive you want to use directly inside a VMware virtual machine. If
    you simply want to break the 2GB virtual disk limit without employing a separate
    hard drive, plain disks might be the right choice.


    The easiest, and arguably most useful, type of plain disk is made of files in
    your Linux file system. These files are, in essence, a series of large files strung
    together to form a single virtual disk. Although the files themselves are still
    subject to a 2GB limit, VMware creates as many as are necessary to accommodate
    the plain disk file size you request and divides the load equally between the
    files. (That is, if you use a 3GB plain disk, the two files will be 1.5GB in length,
    rather than one 2GB file and one 1GB file.)


    The major disadvantage to plain disks over virtual disks is that they immediately
    consume the entire requested space on your Linux hard drive. Virtual disks, on
    the other hand, grow as necessary to your preset limit. So there is little or
    no advantage to using a file-based plain disk of less than 2GB.


    To create a file-based plain disk, follow these steps:


    +   1. Open the virtual machine configuration in the Configuration Editor.

    +   2. Find a free slot in the IDE or SCSI Drives section.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '> If you plan to boot from your plain disk, it is a good idea to use the Primary
    IDE (P-M) slot.


    +   3. Set the Device Type to Plain Disk.

    +   4. Type a name for your plain disk in the Name box. This will be the name
    of the plain disk descriptor file, a small file stored in your VMware configuration
    directory that describes the composition of the plain disk to VMware. At this
    point, your screen should look much like Figure A.6.

    +   5. Click Create Plain Disk. A new window (shown in Figure A.7) appears, asking
    whether the plain disk should be built from files or from hard disk partitions.

    +   6. Select Files in the host filesystem.

    +   7. Enter the size of the plain disk and click OK.


    ![](img/b2b6702758c230ce537468351fc8af15_394_0.png)


    Figure A.6 Use the Configuration Editor to start the creation of a new plain disk.


    ![](img/b2b6702758c230ce537468351fc8af15_394_1.png)


    Figure A.7 File-based plain disks are easier to create and are probably the best
    choice for most system configurations.'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'Remember that you need to have all of the space required available on your
    Linux file system when you create the plain disk. Do not create plain disks under
    2GB; use virtual disks instead.


    8. The Plain Disk Editor appears (shown in Figure A.8). You should be able to
    accept the defaults, unless you for some reason want the plain disk to be read-only.


    ![](img/b2b6702758c230ce537468351fc8af15_395_0.png)


    Figure A.8 The Plain Disk Editor governs the level of control the virtual machine
    has over the new plain disk.


    It is easier and just as secure to leave the RO (read-only) option turned off
    and then use Nonpersistent mode if you want to write-protect your plain disk.


    9. Creating the plain disk can take several minutes, during which time your mouse
    and keyboard response could be severely impaired.


    10. Remember to click Install to commit the settings for the plain disk so that
    it will be recognized when you launch your virtual machine.


    11. Launch your virtual machine, and format the plain disk inside the guest OS
    as you would any other disk partition. Figure A.9 shows a sample, using fdisk
    on a newly created Windows plain disk.


    If you choose a partition-based plain disk instead of file-based, the major difference
    is in the Plain Disk Editor. You first indicate the hard drive device you want
    to use to build the plain disk (such as /dev/hda and so on), and then the Editor
    asks you which partitions should be included, as shown in Figure A.10.


    In this example, the partitions are labeled /dev/hdc1 and /dev/hdc5. If the plain
    disk should only incorporate /dev/hdc1, you can opt to set /dev/hdc5 to read-only,
    or better yet, click Delete. (This does not delete the partition; it only deletes
    the entry for that partition from the plain disk description file!) You can leave
    all of the data files (plaindisk21.dat and plaindisk23.dat as shown in this example)
    alone; they take up very little space.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '![](img/b2b6702758c230ce537468351fc8af15_396_0.png)


    Figure A.9 Plain disks must be formatted inside the guest OS, just like any other
    virtual disk, after they are created.


    ![](img/b2b6702758c230ce537468351fc8af15_396_1.png)


    Figure A.10 A partition-based plain disk uses a slightly different editor.


    If you''re curious about the format of the plain disk descriptor file, you can
    read it with any text viewer or editor. Simply read the file of the name you specified
    in Step 4, which by default is stored in your virtual machine configuration directory.


    # Understanding the Virtual Machine BIOS


    VMware didn''t cut corners in designing its virtual machine technology. It went
    so far as to license and customize Phoenix BIOS code, the fundamental ROM-based
    software layer of any PC. The Phoenix BIOS makes a VMware virtual machine "look"
    more like a real PC, both to the user at startup and to some operating systems
    such as DOS.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'Although many experienced PC users already feel comfortable adjusting BIOS
    settings, both novices and veterans should understand what the VMware BIOS can
    and cannot do to customize a virtual machine.


    To enter the VMware BIOS, press F2 at the VMware boot screen after powering up
    your virtual machine. The window of opportunity is fairly narrow, and you might
    want to tap the F2 key a few times to make sure the system acknowledges your request.


    When you''ve succeeded, you should see the main BIOS screen, shown in Figure A.11.


    ![](img/b2b6702758c230ce537468351fc8af15_397_0.png)


    Figure A.11


    # Using the BIOS Configuration Screens


    Each of the six screens has a variety of configuration settings—both those you
    should be aware of in case you need to change them and those you should leave
    alone in nearly any situation.


    # Adjusting the Main BIOS Screen


    On the main BIOS screen, you will find:


    +   - Time and Date—These settings should be read directly from your Linux system
    clock and as such should always be accurate. Only adjust if you have a very specific
    reason for doing so.


    +   - Legacy Diskettes A: and B:—VMware should pass the proper settings, based
    on your virtual machine configuration, to the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '+   - Primary Master through Secondary Slave—The BIOS should automatically
    detect any additions or changes to the virtual IDE controller and insert the proper
    reference. If you plan to tinker with these settings, leave SMART Monitoring turned
    off. SMART is a disk failure detection system, but SMART detects physical faults;
    even with raw disks, VMware is not equipped to test your disks at this level.


    +   - Keyboard Features—If you are working primarily in a command-line environment
    (a Linux VM without XWindows or DOS), you might want to experiment with these
    settings if you are unhappy with keyboard performance. Remember, however, that
    the Linux OS and BIOS on the host influence keyboard operation as well. A sample
    of this screen appears in Figure A.12.


    ![](img/b2b6702758c230ce537468351fc8af15_398_0.png)


    Figure A.12 The Keyboard Features screen controls audible key click and key repeat
    rates.


    # Adjusting the Advanced BIOS Screen


    The Advanced BIOS screen controls some of the virtual hardware at its most fundamental
    level. See the screen in Figure A.13 for more detail.


    > On a real computer, the Advanced BIOS screen would be full of options such as
    CPU cache control. VMware cannot directly enable or disable your system cache,
    so these options have been omitted.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '![](img/b2b6702758c230ce537468351fc8af15_399_0.png)


    Figure A.13 Use the Advanced Features screen to control the behavior of system-level
    virtual devices.


    +   - Reset Configuration Data—You should never need this setting.

    +   - PS/2 Mouse—If VMware is having an exceptionally difficult time configuring
    your mouse for use in a virtual machine, you might try setting this option to
    Enabled.

    +   - Secured Setup Configurations—If you are experimenting with device configurations
    in a virtual machine and the virtual machine''s guest OS is a Plug-and-Play OS
    (such as Windows 98 SE and Windows Millennium), you might want to use this option
    to prevent the OS from making wholesale changes to the BIOS configuration. Use
    only if needed.

    +   - Large Disk Access Mode—This should be fine left alone in DOS mode, although
    Linux virtual machines can be set to Other.

    +   - Local Bus IDE adapter—Leave set to Both.

    +   - SMART Device Monitoring—This is useless. As long as you don''t enable device
    monitoring for a virtual disk (which you shouldn''t do), the setting is irrelevant.


    # Adjusting the Security BIOS Screen


    In the Security BIOS screen, you can adjust the virtual machine to add some very
    rudimentary security features. Figure A.14 shows a sample screen.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Understanding the Virtual Machine BIOS


    ![](img/b2b6702758c230ce537468351fc8af15_400_0.png)


    Figure A.14  In the Security screen, you can set a password or restrict disk access.


    > Any BIOS security settings can be easily circumvented by simply deleting the
    .nvram file that stores BIOS preferences in any VMware configuration directory.
    Do not count on any of these features to provide unbreakable security.


    +   - Set User Password—Ghosted by default until Password On Boot is enabled.
    Allows you to password-protect the virtual machine; it will not boot unless the
    password is entered.

    +   - Set Supervisor Password—Allows you to password-protect the BIOS setup screens.

    +   - Password on boot—Enable, and then use Set User Password, to protect the
    virtual machine from unauthorized users.

    +   - Fixed disk boot sector—If you are extremely concerned about viruses affecting
    your virtual machine, you can turn on this setting, and the boot sector (a popular
    target) will be write-protected. This setting may protect the virtual machine
    from some types of viruses.

    +   - Diskette access—Can safely leave as Supervisor.

    +   - Virus check reminder and System backup reminder—The system will print a
    message encouraging the user to run a virus scan, back up the system, or both
    on a daily, weekly (on Monday), or first-of-the-month basis.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# Adjusting the Power BIOS Screen


    The Power BIOS screen is best left alone. If you want to use APM in conjunction
    with the virtual machine suspend option, you might want to turn on Power Savings.
    Because you don’t actually save any power in the bargain (your Linux PC will still
    be running as hot as before), it’s usually not worth the trouble.


    Advanced Options allow you to tweak the system IRQ settings, but IRQ conflict
    is not a problem with most conceivable virtual machine configurations.


    # Adjusting the Boot BIOS Screen


    More useful than it might seem at first, the Boot BIOS screen (shown in Figure
    A.15) lets you control the order in which the virtual machine will poll attached
    devices for a bootable drive.


    Use the Enter key to expand device trees (indicated by +), and use the + and –
    keys to move devices up and down; you can also move devices within a tree up and
    down within their mini-hierarchy.


    I recommend the order in Figure A.15: floppy (Removable Devices), CD-ROM, Hard
    Drive, Network Boot. Within Hard Drive, PM indicates the Primary Master drive
    on the virtual IDE chain, and SM indicates the Secondary Master on the virtual
    IDE chain. If you want to boot from your secondary master disk, you should move
    the SM entry above PM.


    ![](img/b2b6702758c230ce537468351fc8af15_401_0.png)


    Figure A.15 Use the Boot screen to select the order the BIOS polls virtual devices
    for bootable drives.'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# Saving Changes in the Exit BIOS Screen


    When you have finished tinkering, you need to decide whether to commit to your
    changes. The screen is shown in Figure A.16:


    +   - Exit Saving Changes—The option to use when you are satisfied with your BIOS
    adjustments and want to continue booting your virtual machine.

    +   - Exit Discarding Changes—Reboots the virtual machine without saving any of
    the adjustments you made since entering setup. Use this option when you don''t
    want to make any changes—even if you don''t think you''ve made any. It is considerably
    safer, on the off chance you accidentally changed an important setting.

    +   - Load Setup Defaults—If your configuration is completely out of control,
    you might try this. If you follow the guidance in this appendix, your BIOS is
    unlikely to ever need this dramatic measure.

    +   - Discard Changes—Restores the BIOS to the state it was in when you first
    entered setup. Use this if you do want to make changes but have made a mistake
    and want a fresh start.

    +   - Save Changes—Saves the current BIOS settings and allows you to continue
    editing. Essentially a "save your work" option.


    ![](img/b2b6702758c230ce537468351fc8af15_402_0.png)'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# Conclusion


    With careful use of raw and plain disks, you can be assured of never running out
    of room for your virtual machines—as long as you bring a large enough hard drive
    to the party, that is. And through judicious adjustment of the VMware BIOS, you
    can be reasonably sure that no configuration setting escapes your attention.


    VMware’s Configuration Wizard and Configuration Editor, along with shortcut technology
    such as virtual disks, take much of the hassle out of configuring and operating
    your virtual machines. But if the time comes that you need to get your hands dirty
    in storage or BIOS maintenance, you’ll be glad you understand the nuances.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# Appendix B: File Sharing with Samba and NFS in VMware


    File sharing with Samba


    File sharing with NFS'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'n each of the main guest operating chapters, I focus on sharing files between
    host and guest with either FTP or virtual disk mounting. This is effective and
    easy to do, but limited. Sometimes it’s preferable to be able to interactively
    mount a drive from the host on the guest, or vice versa, cutting the hassle of
    making a copy (which is essentially what FTP does) or shutting down VMware (necessary
    to mount virtual disks on the host).


    You can run Samba and NFS servers on the Linux host or on most guest operating
    systems. Most versions of Windows can share drives using built-in Samba server
    technology, but NFS is better suited to Linux and FreeBSD host and guest systems.


    Both Samba and NFS are what could be called “multitasking” drive-sharing mechanisms.
    That is, you can continue to use the host’s drive directly in Linux while a virtual
    machine accesses the same drive over NFS or Samba.


    For either of these networking methods to work, you should first make sure that
    your machine is named something other than localhost because this can confuse
    networking software. Consult a Linux manual about the /etc/hosts or /etc/HOSTNAME
    files for more detail on changing your host name.


    # File Sharing with Samba


    I assume that you will run the Samba server on the host computer using the VMware
    Samba server. If you happen to use Windows NT 4 Server or 2000 Server as a guest
    operating system, you could opt to run file sharing from that virtual machine.


    In that case, you access the shared drives through the host using Linux’s smbclient
    program described later in this appendix. You simply replace the host name and
    IP address with that of the Windows server guest.


    Remember that for Samba networking, the relevant IP addresses are those that relate
    to VMware host-only networking: the IP address assigned to vmnet1 on the host
    side and the IP address assigned to the host-only Ethernet adapter on the guest.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'These Samba networking tips also presume you are using the Samba server included
    with VMware, which functions only over the host-only virtual network adapter.
    You need to do additional research to make Samba work over bridged networking.


    > The Samba Linux HOWTO is located at http://www.linuxdoc.org/HOWTO/SMB-HOWTO.html.
    It will help you if you need to set up Samba over bridged networking.


    # Configuring the VMware Samba Server


    When you configured VMware, you should have installed the host-only Samba server
    when asked. (If not, reconfigure VMware with the vmware-config.pl command.)


    The file /etc/vmware/vmnet1/smb/smb.conf contains the configuration data for the
    VMware Samba server. It is not the same as /etc/smb.conf, which might already
    be on your system even if you do not have another Samba server running.


    In particular, you need to pay attention to these aspects of the /etc/vmware/vmnet1/smb/smb.conf
    file:


    +   - Take note of the workgroup ID, early in the file. By default, this is set
    to WORKGROUP.

    +   - Set up a drive to share. (It appears at the bottom of the file under the
    [HostFS] heading.) By default, the entire file system is shared.

    +   - Ensure that the server is set to be local master = yes.


    You also need to run the vmware-smbpasswd command to establish at least one Samba
    password for an existing user account on the host computer.


    The format for the vmware-smbpasswd command is


    ```

    vmware-smbpasswd vmnet1 <username> <password>

    ```


    <username> is an existing user on the host, and <password> may or may not be your
    current login password. It is possible, depending on your system configuration,
    that you might need to change vmnet1 to vmnet2 or vmnet3; a quick look at /sbin/ifconfig
    will tell you which your system is using.


    Until you run vmware-smbpasswd, you will not be able to access host drives via
    Samba.


    # Using Samba with a Windows Guest


    If you''re tired of FTP and you don''t like the bother of shutting down VMware
    to mount your virtual disk in Linux, accessing your Linux file system through
    Samba


    ![](img/b2b6702758c230ce537468351fc8af15_406_0.png)'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Appendix B: File Sharing with Samba and NFS in VMware


    was made for you. It’s actually blissfully easy, as long as a few crucial details
    match up between your host and guest.


    After setting up your host Samba server as described earlier, boot up your Windows
    guest operating system. Any version from Windows 3.11 for Workgroups to the present
    supports Samba networking. This example uses Windows 98 for illustration, but
    the method is virtually identical in all Windows variants.


    You might need to add Microsoft Networking capabilities if they were not loaded
    when you installed your system. The easiest way to do this is to load the Network
    control panel and add the Microsoft Network client. (This will likely require
    reading from your original Windows installation CD.)


    > Unless you have a major security concern, your Microsoft Networking login (the
    prompt you see whenever Windows starts up) should be one of the username/password
    combinations you previously assigned using vmware-smbpasswd. However, don’t use
    your root account. It’s counter-intuitive to log in as root on Windows and it
    creates a number of headaches.


    When Microsoft Network is installed, you are almost ready. In the Network control
    panel, click the Identification tab and check the settings, as shown in Figure
    B.1.


    Although you can feel free to edit your computer name, you really only need to
    care about the Workgroup field, which needs to exactly match the Workgroup ID
    established in the /etc/vmware/vmnet1/smb/smb.conf file on the host.


    ![](img/b2b6702758c230ce537468351fc8af15_407_0.png)


    **Figure B.1** Use the Network Identification tab in Windows to set the Workgroup
    to the same value used by the VMware Samba server, WORKGROUP by default.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '> If you change the computer or workgroup name, you will likely need to reboot
    the Windows guest.


    Next, click the Network Neighborhood icon. (This might be called My Network Places,
    depending on your version of Windows.)


    As long as the Samba server is running, Microsoft Network is properly installed
    on the guest, and the Workgroup names match, your host computer should appear
    similar to Figure B.2.


    Double-clicking on the host icon (in the case of my system, Jhost) should present
    you with a new window with two folders. HostFS refers to whatever you chose to
    share under the [HostFS] section of the /etc/vmware/vmnet1/smb.conf file, and
    you should also see a folder for the home directory of your Samba login name,
    as shown in Figure B.3.


    ![](img/b2b6702758c230ce537468351fc8af15_408_0.png)


    Figure B.2 Network Neighborhood should see your Linux host as a fellow computer
    on the network.


    ![](img/b2b6702758c230ce537468351fc8af15_408_1.png)


    Figure B.3 Windows sees a special HostFS directory which you can point anywhere
    in your Linux filesystem, as well as the home directory of the username you gave
    when you logged in to Windows.'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'Congratulations! You have successfully mounted your Linux file system in Windows.
    You can open Linux files in Windows directly, without an intermediate copying
    step, or save data to the Linux drive. You can use Windows file management tools
    such as Windows Explorer to browse the contents as well, as shown in Figure B.4.


    ![](img/b2b6702758c230ce537468351fc8af15_409_0.png)


    Figure B.4 Once Samba networking is running smoothly, you can browse your Linux
    drives with Windows Explorer or a number of other Windows applications.


    # Using Samba with a Linux Guest


    You’ve read about VMware’s host-only networking and how you can use Samba to share
    files and directories between your Linux host and a Linux virtual machine. In
    truth, Samba is not necessarily the ideal way to share files between your guest
    and host. The standard Linux Samba client is more or less a glorified FTP interface.
    You can use Samba to mount drives directly, but it may be a more trouble than
    it’s worth, depending on your threshold for command-line tinkering and your need
    to link your host and guest filesystem together in a Linux virtual machine.


    Although a number of clever people have worked very hard to implement Microsoft’s
    SMB networking standard on Linux, the fact of the matter is that configuring Samba
    in Linux is just plain difficult. Some people are experts in Samba configuration,
    and I salute them. But there’s a reason there are technical books entirely dedicated
    to this subject.


    VMware makes a valiant attempt to automate the process of sharing drives over
    Samba, and if you are interested in the SMB protocol or have your own reasons
    for disturbing or disliking FTP, you may want to use Samba for Linux-to-Linux
    (or FreeBSD) networking. If you installed the default Samba server when you installed
    VMware, and you are not running any other Samba server, chances are good that
    Samba will work on the first try.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'These principles apply equally well to a FreeBSD guest. FreeBSD has a number
    of Samba packages available. The client name or syntax might be different; check
    your system documentation.


    From a command prompt on the guest, you''ll want to first get a list of shareable
    drives from the host. The format for this is:


    ```

    smbclient -L <IP of host''s vmnet1, or name of host computer>

    -U <username previously configured with vmware-smbpasswd>

    ```


    If you want the IP address, you can get it by running /sbin/ifconfig on the host.


    On my system, entering smbclient -L 192.168.71.1 -U jcompton generates the output
    shown in Figure B.5.


    You are prompted for a password before the command will execute. Enter the password
    you assigned in vmware-smbpasswd.


    You should see the shared drive HostFS as well as the home directory associated
    with the Samba username you specified in the command line. The name of the Samba
    server should be the same as the name of your Linux host PC.


    You might need to use the -W flag on the smbclient command line to indicate what
    workgroup the Linux guest is in. Just add -W WORKGROUP (or whatever the name of
    the workgroup assigned in the host''s configuration file is) to the command.


    ![](img/b2b6702758c230ce537468351fc8af15_410_0.png)


    Figure B.5'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'You will want to create a mountpoint such as /mnt/smb used in the example (just
    use the mkdir command, as in mkdir /mnt/smb). That mountpoint will contain the
    host filesystem after you mount the drive.


    To mount a Samba share in a VMware Linux guest, the command syntax is


    ```

    smbmount // <server hostname or IP address>/<shared drive name on server> <mount
    path> -u <valid SMB username on server>

    ```


    On my system, that means the command is


    ```

    smbmount //192.168.71.1/HostFS /mnt/smb -U jcompton

    ```


    This mounts the root Linux host file system in the smbclient software on the guest
    after you are asked for a password. Use the password that matches the username,
    as configured with vmware-smbpasswd.


    > If you log in to the guest with a username recognized as valid by the VMware
    Samba server, you can skip the -U <username> step.


    After entering the password, change the working directory to the Samba filesystem
    mountpoint you created (cd /mnt/smb, or whatever you chose). You can perform any
    standard file operation as if the drive were directly connected to the virtual
    machine, as shown in Figure B.6.


    ![](img/b2b6702758c230ce537468351fc8af15_411_0.png)'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'Is Samba better than using FTP? Maybe. Try both and decide. Then use NFS, and
    you''ll probably never look back.


    # File Sharing with NFS


    NFS, the Network File System, is one of the oldest and most well-established file-sharing
    systems in the UNIX world. It provides a powerful alternative to FTP, Samba, and
    virtual disk mounting. Although somewhat more difficult to configure, it is arguably
    the best way to share files between a Linux host and Linux (or other UNIX-family)
    guest.


    > These examples presume that you are using bridged networking, but the principles
    are the same for host-only networking. Unlike the VMware-specific Samba server,
    the generic implementation of NFS you will be using does not care how network
    requests are received.


    # Using NFS with a Linux Guest


    Many Linux distributions come with most of the necessary components for NFS server
    operation already installed and running. If in doubt, you might want to use your
    installation''s package manager to add NFS components to your host system before
    you proceed. Alternately, you can search for Linux NFS packages through services
    such as http://www.rpmfind.net.


    > The principles in this section apply equally well to a FreeBSD guest, along
    with any other UNIX-style operating systems you might be able to run someday in
    VMware.


    > Read the NFS HOWTO at http://www.linuxdoc.org/HOWTO/NFS-HOWTO.html.


    A basic understanding of NFS will help you make sense of the steps necessary to
    enable NFS between the host and guest.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Appendix B: File Sharing with Samba and NFS in VMware


    1. Ensure that your host computer is running the Linux portmapper at startup.
    You can check the system startup messages or run the command /usr/sbin/rpcinfo
    -p. You should see at least a listing for a device called portmapper. If you do
    not, consult NFS server documentation for the proper installation of the portmapper.


    2. You now need to establish a list of drives to share on the host. As root, edit
    the text file /etc/exports. (You might have to create the file, or it might be
    blank when you start.)


    3. Each directory you want to share needs an entry of this form: <directory to
    share> <IP address range to share to> (permissions).


    ```

    /home/<jcpname> 192.168.20.0/24 (rw,no_root_squash),

    ```


    You would substitute the IP range that applies to your configuration. (For example,
    if you choose to do NFS sharing over host-only networking, substitute the IP string
    with the first three digit blocks of your host-only IP range, with the .0/24 tacked
    on at the end to indicate all addresses that begin in that range).


    The permissions (rw,no_root_squash) are the ones you commonly want to use. rw
    indicates that the share is read/write capable (substitute ro if you want to write-protect
    the drive), and no_root_squash enables the superuser on the guest machine to behave
    as root on the mounted drive. If your NFS server is on a larger network and you
    are security-minded, you might want to omit the no_root_squash option.


    4. Still on the host, and still as root, run the command /usr/sbin/exportfs -a.
    This refreshes the system''s list of shared drives. You need to run this command
    every time you make changes to /etc/exports.


    5. Still on the host, and still as root, run the NFS server. How this is done
    depends on your installation: Under Red Hat, you run the command /etc/rc.d/init.d/nfs
    start. On other installations, you might need to start the commands mountd (or
    rpc.mountd) and nfsd (or rpc.nfsd) separately and in that order.


    6. Still on the host, and still as root, run /usr/sbin/rpcinfo -p again to verify
    that nfs and mountd have been added to the list of running services. If not, stop
    and re-start the NFS server, and then consult some NFS documentation for additional
    help.


    7. Load your Linux VM (if you haven''t already), and create a new mount point
    for the soon-to-be-mounted NFS drive. A logical location is a new entry in the
    /mnt directory, such as mkdir /mnt/nfsm (for "NFS mount").'
  merge: -1
  img_proc: true
- pgno: 414
  md: '8. Now, mount the host drive on the guest at the location you just created.
    The command is of the form


    ```

    mount <server IP>:<exported directory> /mnt/nfsm

    ```


    The server IP is the address of the host. If you are running both bridged and
    host-only networking, use the one appropriate to the address range you specified
    in /etc/exports on the host.


    The exported directory must match one of the entries in /etc/exports exactly (in
    this case, /home/jcompton).


    To mount the drive I configured earlier, the command is


    ```

    mount 192.168.20.2:/home/jcompton /mnt/nfsm

    ```


    The output of this command appears in Figure B.7.


    > Especially if you are using host-only networking, you can substitute the machine''s
    name for the IP address, but it is faster to use the IP address. If you''ve forgotten,
    run /sbin/ifconfig on the host.


    9. The drive is now mounted! You can cd to the mount point and open, copy, edit,
    and delete files as you see fit. When you are done, umount /mnt/nfsm (or whatever
    mount point you created in Step 7) to release the host file system from the guest.


    ![](img/b2b6702758c230ce537468351fc8af15_414_0.png)


    Figure B.7 It might look humble, but this VMware session is connected directly
    to my home directory over NFS.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# Using NFS with a Windows Guest


    The short answer is you can''t use NFS with a Windows guest—at least, not very
    easily, and because Samba is a much better alternative for Windows file sharing,
    it''s not worth the effort.


    It''s extremely difficult to find a free implementation of an NFS client for Windows,
    and those that you can find tend to rely on extra networking components above
    and beyond those you need to get NFS to work in a Linux-to-Linux environment.
    Even the commercial offerings have these added requirements. (You need an NIS
    or PCN-FSD server running on the host.)


    Do yourself a tremendous favor and stick with Samba when dealing with Windows
    guests.


    # Conclusion


    You might grow beyond the bounds of FTP file sharing, and virtual drive mounting
    might not be as stable as you would like. Using Samba for Windows guest operating
    systems and NFS for Linux/FreeBSD guests, you have stable, unlimited access between
    the file system of your host and guest operating systems.


    Both require some configuration work—NFS in particular—but once the initial grunt
    work is done, the payoff lasts as long as you use VMware.'
  merge: -1
  img_proc: true
