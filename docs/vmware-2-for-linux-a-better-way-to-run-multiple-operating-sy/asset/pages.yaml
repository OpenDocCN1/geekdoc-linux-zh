    allows Samba file sharing between the VM and your Linux PC (provided you installed
    the VMware Samba server at installation or have one of your own running), and
    Bridged and Host-only networking combines the two. If you have a LAN, stick with
    Bridged for now. If you do not, use Host-only or none. Click Next to reach the
    final step.


