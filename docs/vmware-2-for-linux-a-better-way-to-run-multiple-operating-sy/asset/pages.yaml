- pgno: 240
  md: '# Using a Windows NT Virtual Machine


    In a way, Windows NT 4 Workstation is the ideal operating system for Windows compatibility
    in VMware because in general, the Windows extensions that VMware cannot support
    (such as DirectX) are not supported in Windows NT 4, either. It is also relatively
    more stable than its consumer-grade counterparts, Windows 95 and 98. And Windows
    2000 adds an even higher level of resource requirements, along with some of the
    dreaded Windows extensions not available in VMware.


    On the other hand, of course, Windows NT has a deserved reputation for being a
    little more difficult to maintain for the novice to intermediate user, so finding
    the right balance is ultimately up to you.


    Your first order of business, after sorting out service pack and VMware Tools
    issues, should be to verify your network configuration.


    Open a Windows command window and type ipconfig. Sample output is shown in Figure
    11.28.


    If you selected host-only or bridged networking, you should see just one entry
    for AMDPCN1; if you are using both, you will also see AMDPCN2. The host-only networking
    adapter should be able to acquire an address from the special VMware DHCP server,
    which is on the special host-only subnet identified by VMware when you installed
    the host software.


    You might need to configure the bridged networking adapter if you do not have
    a DHCP server on your network or you did not enter IP address information during
    the Windows NT installation. Call up the Windows Network control panel for help.


    The Network control panel in Windows NT is more powerful, and therefore more confusing,
    than those in consumer-oriented Windows versions. To get at the familiar basics
    of IP addressing and DNS servers, open the Network control panel, click the Protocols
    tab, highlight the TCP/IP protocol, and click Properties. A window similar to
    Figure 11.29 will appear.


    ![](img/b2b6702758c230ce537468351fc8af15_240_0.png)


    Figure 11.28 ipconfig returns the networking settings of your Windows NT virtual
    machine.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/b2b6702758c230ce537468351fc8af15_241_0.png)


    Figure 11.29 The Windows NT Network control panel is extremely powerful.


    From here, the interface should appear very similar, if you are at all familiar
    with Windows 95/98. The Adapter drop-down box contains all the network devices
    attached to VMware. If you are having trouble distinguishing between the host-only
    and bridged adapters, let the configuration information available through ipconfig
    guide you. The numbers there (AMDPCN1 and 2) are the same as in the control panel
    gadget.


    If you''re stumped for things to do with your new Windows NT virtual machine,
    browse back to Chapter 9 and the last sections of Chapters 6, "Installing Windows
    98 in VMware," and 7, "Installing Windows 95 in VMware," for suggestions. The
    Windows applications mentioned there work just as well in Windows NT as they do
    in Windows 95 and 98. You can also explore high-end graphics and CAD systems that
    require, or highly recommend, the robust nature of Windows NT, such as AutoCAD.


    # Using Windows NT Services


    If you''ve installed Windows NT Server, put its extra capabilities to work by
    employing a network service, such as Internet Information Server, which should
    already be installed on your virtual machine.


    # Configuring the IIS FTP Server


    To make IIS''s FTP server useful for open-ended file sharing between the host
    and guest, follow these steps:'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   1. Add at least one user to the Windows NT system other than administrator,
    using the User Manager for Domains under Administrative Tools (Common) in the
    Programs Start menu.

    +   2. Run the Internet Service Manager, found under Microsoft Internet Server
    (Common), on the Programs Start menu.

    +   3. Double-click on the FTP service icon. An FTP management window will appear,
    like the one shown in Figure 11.30.

    +   4. Turn off Allow Only Anonymous Connections on the main configuration tab.

    +   5. Click on the Directories tab, and change the default path to C:\ (or a
    more useful directory path). You can add other paths if you have other drives
    or you do not want to open up such broad-ranging access. Write access is off by
    default; be sure to enable it if you want to be able to copy files to Windows
    NT via the NT FTP server. The end result should resemble Figure 11.31.

    +   6. Be sure to apply all changes before closing any windows.


    # Configuring the IIS Web Server


    There is little to configure on the IIS Web server. You can probably start using
    it with the defaults, if you remember where you told IIS to look for HTML documents
    when you installed the system. (If not, just double-click on the WWW service icon
    in the Microsoft Internet Service Manager.)


    ![](img/b2b6702758c230ce537468351fc8af15_242_0.png)'
  merge: -1
  img_proc: true
