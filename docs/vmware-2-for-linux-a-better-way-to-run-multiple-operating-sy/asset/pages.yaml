- pgno: 336
  md: '![](img/b2b6702758c230ce537468351fc8af15_336_0.png)


    Figure 10.4 You can run Windows Registry Editor under Wine, if you want to make
    changes to your virtual machine''s Registry settings without loading Windows.


    # Installing Wine


    Life will be considerably easier for you if your Linux system supports the RPM
    software installation system. An RPM, as well as a source distribution, of Wine
    can be found in the /Wine directory of the CD that came with this book. If your
    system does not support RPM installation, you need to follow the instructions
    on the Wine download sites carefully to identify the right version of Wine to
    download, as well as learn how to configure and install it on your system.


    > The Wine source code changes quite literally on a daily basis, although every
    so often, the developers release a "snapshot"—a new milestone version. In general,
    RPMs are only made of snapshot versions. Still, because Wine changes so quickly,
    the exact installation process might be slightly different from what''s described
    here, so be sure to check the online documentation.


    +   1. Browse to http://www.winehq.com/download.html and choose the Wine download
    site that matches your system configuration.

    +   2. Download the most recent Wine binary RPM file. The filename should be of
    the form wine-<date>.i386.rpm. (The June 14, 2000 edition can be found on the
    included CD, as /Wine/wine-20000614-1.i386.rpm.)


    ![](img/b2b6702758c230ce537468351fc8af15_336_1.png)'
  merge: -1
  img_proc: true
- pgno: 337
  md: '3. Install the Wine package by typing rpm -i wine-<date>.2386.rpm at a shell
    prompt. If you receive system warnings, consult the Wine installation instructions
    for suggested remedies.


    > If you already have a standalone version of Wine installed on your computer,
    type rpm -U instead of rpm -i.


    4. If all goes well, you will not need to intervene in the installation. You do
    need to edit the Wine configuration file, which might have been created as /etc/wine/wine.conf
    or /etc/wine.conf (or perhaps even /usr/local/etc/wine.conf if you didn’t install
    from an RPM). If you have Wine installed already, the current wine.conf is backed
    up to wine.conf.rpmsave.


    5. Edit the wine.conf file. A sample wine.conf file is shown in Figure 16.5. You
    might need to use the su command to become root so that you can save your changes.


    ![](img/b2b6702758c230ce537468351fc8af15_337_0.png)


    Figure 16.5 You do not need to make many changes in the default wine.conf settings
    file before Wine is ready to run.


    6. Examine the first entry not preceded by semicolons, which should be [Drive
    A:], the floppy drive. You might not need to use the floppy in Wine-hosted Windows
    programs, but it won’t hurt to set it correctly. By default, the Path= is set
    to /mnt/fd0, and the Device= is set to /dev/fd0, which is the proper assignment
    for the floppy drive on many Linux computers. If you know yours is different (the
    path might be /mnt/floppy), make the appropriate changes. If you are unsure, leave
    it alone, because it is probably correct.


    7. The next entry should be [Drive C:], which needs to point at the directory
    that houses your Windows software. To run the Windows software housed on your
    VMware virtual disk, you want this to point at the contents of that virtual disk.
    Think back to Chapter 9, “Using Your Windows 95/98 Virtual Machine,” which describes
    how you can mount the virtual disk on a Linux'
  merge: -1
