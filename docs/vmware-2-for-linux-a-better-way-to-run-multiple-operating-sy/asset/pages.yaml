- pgno: 373
  md: '![](img/b2b6702758c230ce537468351fc8af15_373_0.png)


    Figure 10.5 Robin Hood helps you claim the English throne in Defender of the Crown.


    The Amiga isn''t just about games; there is also a wide variety of personal and
    professional productivity tools, including some powerful graphics programs.


    If you have an Amiga file system stored inside your Linux file system (for example,
    Amiga Forever includes the Workbench operating system, stored in a large directory
    you can copy to your Linux hard drive), tell UAE to load it by editing .uaerc
    and creating a new option with the format filesystem=rw,hd0:/home/jcompton/amiga/system.
    Replace the Linux path with the path to the Amiga Workbench directory on your
    PC.


    # Using MAME Arcade Game Emulator for Linux


    Emulators aren''t just for re-creating one beige box computer on another. You
    can even emulate arcade games in Linux. One of the most popular (and comprehensive)
    arcade emulators is MAME, for Multi Arcade Machine Emulator.


    With MAME, you can emulate more than 2,000 coin-op classics. Installing and configuring
    MAME is challenging but still possible for a novice.


    # Installing MAME for Linux


    MAME needs to be compiled before it will run on your computer. If you have a standard
    Linux distribution, this should not be a problem, but you might need to consult
    the MAME documentation for assistance if the process fails:'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   1. Download the latest version of XMAME from http://x.mame.net. The filename
    will have the form xmame-0.37b4.1.tgz.

    +   2. Uncompress the archive with the command tar -zxvf xmame-0.37b4.1.tgz, replacing
    the version numbers as necessary. A new directory, named after the file, is created.

    +   3. Change to the new directory (cd xmame-0.37b4.1).

    +   4. Unfortunately, MAME does not include a handy configure program. However,
    the number of options you need to change is limited, and you can skip the step
    altogether if you are happy to accept that the xmame executable will be placed
    in /usr/games, with the xmame support files in /usr/games/lib/xmame. If you want
    these files placed elsewhere, you need to edit the file makefile.unix, and change
    the DESTDIR value to the new location for the MAME program and the XMAMEROOT value
    to the new location for the MAME support files.

    +   5. To prepare the installation, type make -f makefile.unix. The screen fills
    with text. Do not be immediately alarmed if you see warning or even error messages.

    +   6. To compile MAME, type make -f makefile.unix install. The executable file
    (called xmame.x11) is copied to the DESTDIR directory, or /usr/games by default.

    +   7. You now need to create a place to store the MAME configuration files. Make
    a new directory located off your home directory called .xmame. (The command mkdir
    ~/.xmame should accomplish this.)

    +   8. MAME comes with a sample configuration file, located at doc/xmamerc.dist
    inside the source code archive you dissolved in Step 2. Copy xmamerc.dist to the
    new .xmame directory you created, renaming it to simply xmamerc. (The command
    cp doc/xmamerc.dist ~/.xmame/xmamerc should accomplish this, from the same directory
    you used for Steps 5 and 6.)

    +   9. You now need to obtain arcade ROM images. Place the .zip archives in /usr/games/lib/xmame,
    or wherever you defined XMAMEROOT to be. You do not need to unzip the archives.
    See http://www.vintagegaming.com/frames/mame/freeroms.html for a (short) list
    of freeware arcade ROMs.


    > You might need to use the su command to become root for Steps 5 and 6.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '> Where do you get ROM archives? Good question. As of this writing there is
    exactly one freeware arcade game: Robby Roto, first manufactured in 1981 and recently
    made freeware by the original author. See Figure 18.6 for Robby Roto running on
    XAMAME. A few other arcade classics, such as Sinistar and Defender, have been
    published on CD-ROM so it is possible to own a legitimate license to them. But
    unless you buy old arcade game or arcade game motherboards, it is extremely difficult
    to come by legitimate versions of most arcade game software.


    ![](img/b2b6702758c230ce537468351fc8af15_375_0.png)


    # Playing Arcade Games with MAME


    To launch MAME, use the command


    ```

    /usr/bin/xmame -x11/games/xmame.x11 <ROM name>

    ```


    where <ROM name> is the name of the zip file archive, the .zip suffix, of the
    ROM archive you placed in the XMAMEROOT directory (such as /usr/games/lib/xmame).


    When MAME is up and running and you see the video game demo screen, you need to
    feed the emulator some virtual quarters. By default, the 5 key feeds quarters
    (keys 6 through 8 also work if the arcade game had more than one coin slot), and
    buttons 1 through 4 represent Player 1 through Player 4. Start.


    Inside the game, the arrow keys control movement, with the left Ctrl key and left
    Alt keys being your first two fire buttons.


    If you want to adjust the game settings, press the Tab key to bring up the in-game
    menu. (You might also want to press P to pause the game if you''re playing.) See
    Figure 18.7 for an example of the MAME configuration screen.'
  merge: -1
  img_proc: true
- pgno: 376
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 377
  md: '![](img/b2b6702758c230ce537468351fc8af15_377_0.png)


    Figure 18.9 Loosely inspired by Isaac Asimov''s novel, I, Robot is a fun MAME
    diversion.


    Most arcade games do not use a screen larger than 640×480, but if you encounter
    some that do, you need to increase that value to 800×600 or possibly beyond. At
    the same time, some older games are 320×200, which is extremely small on a modern
    desktop and might be hard to see. If you are playing a game that is too tiny to
    make out on your monitor, set the scale variables to 1.5 or 2 so you have a larger
    field of play. (This can slow down the emulation somewhat. Many old games can
    still run at full speed on modern PCs, however, even when their screen size is
    doubled.)


    # Using VICE Commodore 64 Emulator for Linux


    Before there was the Amiga, there was the Commodore 64. Remembered primarily as
    a game computer, the C64 was arguably the most powerful of all the 8-bit computers,
    and it is the best-selling single computer architecture of all time. (Although
    there are many, many more PCs in the world, the C64''s CPU, graphics and sound,
    and RAM remained essentially unchanged throughout its entire lifecycle.)


    To recapture 8-bit glory on your Linux PC, all you need is VICE, the Versatile
    Commodore Emulator. It is “versatile” in that in addition to the 64, VICE includes
    emulators for nearly every 8-bit computer Commodore made in the 70s and 80s, including
    the Commodore VIC 20 and 128. But the 64 is the real draw. Four VICE emulators
    make cameo appearances in Figure 18.10.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '![](img/b2b6702758c230ce537468351fc8af15_378_0.png)


    Figure 19.10 VICE can emulate a slew of machines: clockwise, from upper left,
    the Commodore 64, the Commodore 128, the Commodore PET, and the Commodore VIC
    20


    > Commodore 64 emulation requires OS ROMs, much like any other emulation. Because
    Commodore went bankrupt in 1994 and its intellectual property rights have bounced
    around the globe, and because 8-bit technology rights in general have only been
    lightly enforced, emulator authors have taken the liberty of including the Commodore
    ROM code in their emulators. If this makes you uncomfortable, it is best not to
    proceed.


    # Installing VICE for Linux


    Getting VICE to run on your Linux PC requires a little bit of planning and a brief
    foray into the world of source code makefiles, but the VICE developers make it
    reasonably painless.


    +   1. Create a new directory for the VICE emulator and the various C64 files.
    I suggest a directory named c64 off your home directory, as in /home/jcompton/c64.
    You can use the command mkdir ~/c64.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '+   2. Download the VICE source archive from http://www.cs.cmu.edu/~dsladic/vice/vice.html.
    It should be named vice-1.4.tar.gz, possibly with a newer version number. Place
    it in a convenient directory. (It can be, but does not have to be, the directory
    you created in Step 1.)


    +   3. Open the archive with tar -xzvf vice-1.4.tar.gz. A new directory, vice-1.4,
    is created.


    +   4. Change to that directory with cd vice-1.4.


    +   5. VICE comes with a configure program. If you run configure with no options,
    VICE sets up to install the VICE emulators to /usr/local/bin. I recommend placing
    the files in the c64 directory you created in Step 1. Run ./configure --prefix=/c64
    if you want to place the emulators in the new directory from Step 1 or just ./configure
    if you are content to place the emulators in /usr/local/bin. The screen fills
    with text while the configuration process runs.


    > You might need to use the su command to become root for Steps 6 and 7.


    +   6. Type make to begin the compile process.


    +   7. Type make install to install the VICE emulators and support files.


    # Running Programs in VICE


    To launch the emulator, type /usr/local/bin/x64 (or ~/c64/x64). You should see
    the classic blue-on-blue Commodore 64 startup screen, shown in Figure 18.11.


    ![](img/b2b6702758c230ce537468351fc8af15_379_0.png)'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'VICE has a variety of options and settings controlled through two menus—one
    invoked by left-clicking on the VICE window, the other invoked by right-clicking.
    Generally speaking, the left-click menu controls floppy disk and cassette tape
    images (files that contain C64 programs), and the right-click menu controls operational
    matters, such as the speed of the emulator.


    Commodore 64 emulators use the D64 disk image format, which you can find through
    a variety of emulation sites. To load a disk image, left-click, select Attach
    Disk Image, Unit 8, and then select the D64 image from the file requester shown
    in Figure 18.12.


    ![](img/b2b6702758c230ce537468351fc8af15_380_0.png)


    Many disks can be started with the Autostart button on the Attach Disk Image window.
    To load others, you might need to learn a little about the way the C64 loads and
    runs programs. Here’s an extremely short tutorial:


    To read a C64 disk image directory, type


    ```

    LOAD"*",8

    ```


    and then LIST the results. Or you can use the Contents button on the Attach Disk
    Image window to look at a disk image’s directory.


    To load a particular file, use LOAD"FILENAME",8 and then RUN. Some programs might
    require LOAD"FILENAME",8,1 instead. In no time, you’ll be off and running classic
    games, such as Karateka, shown in Figure 18.13.


    Joystick support in VICE is controlled through the right-click menu, Joystick
    Settings. If you don’t have joystick support enabled in Linux, you need to use
    the numeric keypad arrows and the keypad 0 as the fire button.


    The Commodore 64 had low screen resolution—just over 320×200. To create a window
    easier to see on a large monitor, use the right mouse button menu, Video Settings,
    Double Size. You might also want to enable Double Scan, to eliminate the black
    lines Double Size creates. Each step requires additional computing power, however,
    so you might have to live with the smaller display on a slower computer.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/b2b6702758c230ce537468351fc8af15_381_0.png)


    Figure 18.13 Karateka, the forerunner to the classic Prince of Persia, shown running
    on VICE.


    C64 users who remember its unique keyboard layout can re-create the classic key
    positioning using the right-click menu, Keyboard Settings, Keyboard Mapping Type,
    Positional Mapping. The emulator uses Symbolic Mapping by default, meaning that
    the keys you see on your keyboard correspond to what the C64 sees.


    Sure, the C64 is dated; that''s why some of its most classic games are based around
    dated themes such as skateboarding. (See Figure 18.14 for proof.) But VICE can
    provide some low-impact fun when the world of high-tech virtual machines is old
    hat.


    ![](img/b2b6702758c230ce537468351fc8af15_381_1.png)


    Figure 18.14 VICE is running Skate Or Die from Electronic Arts, from the height
    of the skateboarding craze of the 80s.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Running Other Emulators


    Wait, there’s more. If you’re starting to get really curious about emulation,
    there are a wide variety of emulators and emulation support Web sites out there.
    One launch point as good as any is http://www.vintagegaming.com, which should
    be enough to get you started emulating almost any computer or popular computing
    device.


    As I explained in Chapter 17, “Emulating the Macintosh,” it is possible to run
    Windows emulators inside a VMware virtual machine (although you should not attempt
    to run VMware for Windows inside a Windows VM!).


    There are advantages to running an emulator in a Windows VM instead of Linux.
    Generally, Windows emulators are distributed as binary files, rather than source
    code that must be compiled, as many Linux emulators are. And among emulators that
    exist for both Windows and Linux, some (but not all) have better configuration
    and customization interfaces.


    There is some downside. The speed penalty from the VMware layer can be a hassle.
    Plus joysticks are not available in VMware, so if you plan to use them, you need
    to stick with Linux emulators.


    A perfect example of the advantages of a VMware-based emulator cropped up as I
    wrote this chapter. I wanted to include an Apple II emulator in the book. The
    Apple II was the first true mass-market personal computer and one of the most
    successful in the home and educational markets. It also was the launch pad for
    the wildly popular Ultima RPG game universe. (See where it all began in Figure
    18.15.)


    Unfortunately, I couldn’t find a Linux Apple II emulator that would reliably compile
    with a minimal amount of tinkering, and I couldn’t justify spending pages and
    pages explaining modifications to the source code.


    ![](img/b2b6702758c230ce537468351fc8af15_382_0.png)'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'So I settled on ApplePC, a DOS/Windows Apple II emulator that runs splendidly
    in VMware. There''s no need to tinker with the source code, and the emulator is
    quite compatible. ApplePC runs in a DOS window, although you can also hunt down
    pure Windows-based Apple emulators, such as AppleWin. Both are available through
    http://www.vintagegaming.com.


    Through emulation, you can relive the pre-Macintosh glory years of Apple and reintroduce
    yourself to the literally hundreds of wildly popular mind-bending adventure games
    (such as the one pictured in Figure 18.16), famous on the Apple II+, IIe, and
    IIc.


    There are even emulators available for devices such as the Palm PDA! Palm makes
    the source code available for Linux users, but it requires the FLTK graphics toolkit,
    making for an inconvenient two-stage install. If you want to see whether that''s
    worth the trouble, download the Windows version of the emulator from http://www.palmos.com/dev/tech/tools/emulator.


    > Like most emulators, the Palm emulator requires Palm ROM code. The emulator
    can download a ROM from a Palm device you own, or you can register for the Palm
    developer program free of charge to obtain the ROM images from Palm Inc.


    When you download the ROM, you have a real live Palm device running in the confines
    of your desktop. Figure 18.17 has the proof. Purists might say a desktop emulator
    ruins the point of a portable, but emulation enthusiasts know better.


    ![](img/b2b6702758c230ce537468351fc8af15_383_0.png)


    Figure 18.16 ApplePC, via VMware, runs Cranston Manor, one of many classic graphics/text
    adventure games for the Apple.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/b2b6702758c230ce537468351fc8af15_384_0.png)


    Figure 10.17 The Windows version of the official PalmOS emulator works well through
    VMware.


    # Conclusion


    There are literally dozens of computers, game consoles, and electronic devices
    that can be emulated through Linux and a VMware virtual machine that I have not
    touched on. I hope the “emulation sampler” in this chapter will encourage you
    to go beyond the bounds of VMware’s ability to expand your computer’s range of
    operating systems and branch out into emulating a variety of software and hardware
    platforms from the last 30 years of computing.'
  merge: -1
  img_proc: true
