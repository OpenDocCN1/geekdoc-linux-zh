- pgno: 36
  md: '# Bochs: Full PC Emulation


    Bochs was designed to be highly portable and has been compiled and run successfully
    on a variety of different computer architectures and operating systems. That''s
    because Bochs is a true emulator, rather than a virtual machine.


    Remember the difference? Bochs is based around an Intel 386/486/Pentium CPU emulation,
    which runs even if Bochs is used on a Pentium-based Linux PC. This makes Bochs
    a consistent product across all the supported platforms, but also means it is
    slower than a true virtual machine such as VMware. It also has ridiculously cluttered
    configuration files that make DOSEMU look easy to manage. See Figure 1.6 for a
    sample Bochs session.


    Bochs was recently purchased and released as open source by MandrakeSoft, publishers
    of the Linux-Mandrake distribution. The original author of Bochs, Kevin Lawton,
    is now hard at work on Plex86, an open-source virtual machine project.


    > To learn more about Bochs, head for http://www.bochs.com.


    VMware''s easy-to-use configuration interface alone is sufficient reason to give
    it the nod above these alternatives. VMware is also the only way to obtain full
    compatibility with Windows 95/98, Windows NT, and Windows 2000. Although each
    has its place—and might even find a place in your emulation strategy over time—VMware
    provides the fastest and most flexible way to run MS-DOS and Microsoft Windows
    applications under Linux.


    It''s also important to keep in mind that VMware does more than simply provide
    an emulation bed for Windows applications. With VMware, you can run another complete
    session of Linux or FreeBSD, and VMware''s programmers continue to work to expand
    the range of operating systems that run inside the virtual machine. Although Bochs''s
    support for other operating systems is slowly growing, VMware provides the widest
    range of guaranteed compatibility.


    ![](img/b2b6702758c230ce537468351fc8af15_36_0.png)


    Figure 1.6 The Bochs PC emulator, loading the WebSpyder Web browser.'
  merge: -1
  img_proc: true
