    ![](img/b2b6702758c230ce537468351fc8af15_234_1.png)


    Figure 11.19 Select Internet services from the IIS Setup window.


    # Upgrading Windows NT and Installing VMware Tools


    If you''ve already gone through a VMware guest OS installation using this book,
    you''re waiting for me to immediately admonish you to install VMware Tools. Ready
    for a change of pace? Don''t install VMware Tools just yet.


    # Installing a Service Pack Upgrade


    Although Windows NT Service Pack 1 will boot in VMware, it''s really not what
    you want to use over anything remotely like the long term. In fact, your first
    order of business should be to install Service Pack 3 or later (see Figure 11.20).'
  merge: -1
