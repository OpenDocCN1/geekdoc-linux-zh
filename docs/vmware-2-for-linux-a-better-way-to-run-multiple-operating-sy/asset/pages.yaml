- pgno: 94
  md: '# Parallel Ports


    Virtual parallel ports are handled in a similar fashion to serial ports. VMware
    can address up to two parallel ports, which can be either devices on the host
    PC or a file. Some advanced users might have reason to adjust the configuration
    screen shown in Figure 5.26 to direct parallel access to a file (for example,
    to capture a PostScript printing session that you want to take to a computer with
    a nicer printer), but for most purposes, stick with the real devices.


    If you need parallel port access in your virtual machines, follow these steps:


    +   1. Select an LPT device you want the virtual machine to have access to. It''s
    a good idea, but not required, to add them in order.

    +   2. Enter the complete path to the device driver. On most Linux PCs, the first
    parallel port (LPT1) is located at /dev/lp0, the second (LPT2) at /dev/lp1.

    +   3. Leave the Bidirectional box checked unless you know your parallel port
    does not support bidirectional access or you were given a warning about the performance
    of your parallel port when you installed VMware.

    +   4. Click Install to commit your change.

    +   5. Save the new configuration by clicking Save at the bottom of the window.
    This also exits the Configuration Editor.


    ![](img/b2b6702758c230ce537468351fc8af15_94_0.png)


    # Mouse


    If you have a reasonably normal Linux installation, VMware should be able to automatically
    detect and use your mouse in a virtual machine. If VMware struggles to locate
    your mouse when you run a guest operating system, you might need to enter the
    type (PS/2 or serial, along with the brand) in the Mouse Type tool shown in Figure
    5.27 and add the complete path to your mouse device in the text window.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/b2b6702758c230ce537468351fc8af15_95_0.png)


    Figure 5.27


    Leave the setting on Autodetect. If tools such as Xconfigurator can find your
    mouse, VMware should be able to as well.


    # Sound


    I''ve always been a little confused about why the Configuration Wizard starts
    but doesn''t finish configuring sound for you. VMware automatically sets the proper
    device path for an Open Sound System (OSS) or a similarly supported Linux system
    sound device, and all you need to do is click on the Install button (see Figure
    5.28) for it to work.


    ![](img/b2b6702758c230ce537468351fc8af15_95_1.png)


    Figure 5.28'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'If you''re concerned about the speed of your PC, don''t activate sound in VMware
    until you''ve had a chance to install the operating system and gauge the speed.
    Sound is CPU intensive for VMware, and some operating systems, such as Windows
    98, play a lot of it after they boot for the first time. You can always go back
    and click Install later if you feel comfortable with it.


    # Memory


    In the Memory configuration window shown in Figure 5.29, you can tweak the amount
    of RAM VMware decided to give to this particular virtual machine. Remember that
    VMware does not always assign the maximum available RAM to certain guest operating
    systems, so if you want to expand up to the total VMware RAM limit you determined
    in the global Host Reserved Memory, you are free to do so.


    ![](img/b2b6702758c230ce537468351fc8af15_96_0.png)


    Remember that by expanding a single virtual machine up to the total limit of reserved
    memory, you make it tricky and probably unbearably slow to run more than one virtual
    machine at a time. Also, be sure not to exceed the recommended VMware memory limit.


    # Guest OS


    The guest operating system screen, shown in Figure 5.30, should appear to be identical
    to the one you saw at the end of the Configuration Wizard. VMware uses it to make
    some assumptions about your system and preconfigure virtual machine'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'resources and guest OS-specific optimizations. You should never have occasion
    to adjust this setting unless you upgrade a guest OS (from Windows 3.1 to Windows
    95, for example).


    ![](img/b2b6702758c230ce537468351fc8af15_97_0.png)


    # Misc


    Don''t be fooled by the Misc heading. These settings, shown in Figure 5.31, are
    actually among the most important in VMware. It''s a pity that they are buried
    at the bottom of the list; it makes them look unimportant, which they are certainly
    not.


    ![](img/b2b6702758c230ce537468351fc8af15_97_1.png)'
  merge: -1
  img_proc: true
