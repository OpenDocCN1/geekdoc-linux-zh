- pgno: 339
  md: 'A number of things can go wrong during the installation, or more likely when
    you try to run an actual Windows program in Wine. The Wine FAQ at http://www.winehq.com/faq.html
    tries to account for most of the major problems, which usually revolve around
    Linux system components being either too old or too new for Wine. Generally, a
    workaround is provided.


    # Using Wine to Run Windows Programs


    When the wine.conf settings are complete, your PC is ready to run Wine. To test
    your installation, you should try to run a program known to work well in Wine,
    such as the standard Microsoft Paint program bundled with Windows:


    +   1. Open a new command terminal in Linux.

    +   2. Using the instructions in Chapter 9, use vmware-mount.pl to mount your
    Windows virtual disk on /mnt/vhd in your Linux file system.

    +   3. Open another command terminal because the first one will be busy running
    vmware-mount.pl.

    +   4. If you have a standard Windows installation, Paint is likely located at
    /mnt/vhd/Program Files/Accessories/mspaint.exe, but you might want to browse through
    the virtual disk to verify the path.

    +   5. At the command terminal, type wine " /mnt/vhd/Program Files/Accessories/mspaint.exe".
    Substitute the correct path if you discover mspaint.exe is located elsewhere on
    your Windows virtual disk.


    > Capitalization and the use of quotation marks are very important. Any time you
    run a program inside a Windows directory that uses spaces, you need to encompass
    the entire pathname in quotes.


    +   6. Don''t get discouraged if you see error messages: they''re not uncommon,
    and not all error messages prevent the program from running properly. Because
    Wine is so developer-focused, it includes a lot of debugging messages.

    +   7. After a short wait (it can be a minute or more, depending on the speed
    of your system), you should see the very familiar Microsoft Paint program appear,
    as it does in Figure 16.7. You can draw, rotate, color, and load and save files.

    +   8. When you''re finished, simply quit the program. Wine will exit, leaving
    you free to test another Windows program or move on to another project.


    ![](img/b2b6702758c230ce537468351fc8af15_339_0.png)'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/b2b6702758c230ce537468351fc8af15_340_0.png)


    Although Wine does represent some RAM savings over loading VMware, it still requires
    a fairly healthy portion of your system''s memory. Running Paint requires 35MB
    of memory! (Most of that is the Wine emulation layer.) As the Wine matures and
    debugging code is removed, this heavy memory hit may come down slightly.


    There are certainly oddities to the way Wine works. As you''ve gathered already,
    it is not production-quality software, and errors, debugging messages, and generally
    unpredictable behavior must be considered par for the course at this point.


    Wine can choke on your Windows program in any number of ways, and you need to
    know how to recover control no matter what happens. In the simplest case, the
    program just doesn''t do what you expect, but it doesn''t crash. You might achieve
    success by trying to accomplish your task in a different way—use a button instead
    of a menu item, switch the order of your steps, or try a newer version of Wine.
    There''s a certain black magic to tweaking Wine to run complicated programs properly.


    Things really get interesting, though, when Wine or the Windows program crashes.
    In the simplest case, Wine prints the machine state to your terminal and leaves
    you in the Wine debugger, which appears as a new prompt inside the terminal you
    used to launch Wine. This is not a problem—simply type quit to exit.


    Other crashes are more difficult. What should you do if the Windows program maximizes
    itself, taking over the whole screen, and then freezes? Your window manager'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Chapter 16: Using Wine with VMware


    might not be able to save you, since Wine can act as its own window manager. (That
    is, closing, minimizing, or switching windows may not be possible.) In this case,
    go back to the console (Ctrl+Alt+F1 or Ctrl+Alt+F2 should do it), log in, and
    type killall wine. Wine should exit taking its sickly program along with it, leaving
    your X session unharmed. Pressing Alt+F7 will take you back to XWindows on most
    systems.


    Wine dates back to 1993, when Windows 3.1 was the norm. Although its feature set
    has expanded to include the new features and functionality of Windows 95/98 as
    well as their look and feel, some legacies of 3.1 remain. For instance, minimizing
    a Wine application creates a small icon on your desktop even if you use a window
    manager that treats minimized programs differently (such as in a Windows 95-style
    taskbar at the bottom of the screen).




    Given the healthy amount of warnings and uncertainty I''ve given you about Wine,
    it might not sound all that enticing. I merely want to prepare you for the fact
    that although it offers a great deal of promise, at present it should be reserved
    for special, non-essential tasks.


    Wine''s development future actually looks quite bright. Many of the advances Corel
    had to make to port WordPerfect Office have not yet been incorporated into the
    Wine source code, but when they are, it should open new possibilities both for
    Wine developers and end users.


    For now, consider Wine your Windows compatibility flyswatter: If you only have
    a small pesky problem to deal with, such as searching for alien life as shown
    in Figure 16.8, you might not always need to bring the VMware sledgehammer to
    bear.


    ![](img/b2b6702758c230ce537468351fc8af15_341_0.png)'
  merge: -1
  img_proc: true
