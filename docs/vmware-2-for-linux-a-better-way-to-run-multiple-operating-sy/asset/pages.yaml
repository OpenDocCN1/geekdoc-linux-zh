  md: '![](img/b2b6702758c230ce537468351fc8af15_274_0.png)


    Figure 13.5 You can change VMware''s suggested RAM allocation, but don''t exceed
    your total allowed for all virtual machines.


    6. The last window is the Misc settings list. For a FreeBSD VM, it makes the most
    sense to simply accept the defaults, except for the first item, Require shift
    in hot key sequences. Make sure that is selected. You could assign the redo log
    directory at this time (say, to a safe place on your system drive) if you plan
    to use undoable or nonpersistent disks in the near future.


    > If you don''t check the Require shift option, and you ever need to shut down
    the virtual machine''s X server using Ctrl+Alt+Bksp, you might actually shut down
    the host''s X server.


    7. Click Save when finished in the Configuration Editor.


    # Installing FreeBSD in a Virtual Machine


    Your FreeBSD virtual machine is prepared. All it lacks is the operating system.


    For purposes of demonstration, I walk through an installation of FreeBSD 4.0.
    VMware supports FreeBSD 3.x and some versions of 2.x, but in general it is a good
    idea to stay up to date for any guest OS.


    +   1. If you''re not already in VMware, start the program and load the FreeBSD
    configuration defined in the previous section.

    +   2. Insert FreeBSD 4.0 CD-ROM #1 in the CD-ROM drive.

    +   3. Power on the virtual machine.

    +   4. The CD automatically boots and starts the installation process.

    +   5. When prompted, skip the kernel configuration, as shown in Figure 13.6.
    The default options are fine for VMware. (There''s still plenty of configuring
    to be done later!)'
  merge: -1
  img_proc: true
