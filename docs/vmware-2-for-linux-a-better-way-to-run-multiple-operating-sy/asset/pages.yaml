- pgno: 292
  md: '# Adjustments with the Configuration Editor


    You should verify that the wizard has created everything to your satisfaction
    in the Configuration Editor before starting the installation:


    +   1. Open the Configuration Editor in the Settings menu.

    +   2. Verify that the wizard created a Primary Master (P-M) IDE virtual disk
    in the DOS configuration directory of the size you created (it might appear to
    be one megabyte less than you specified) and a Secondary Master (S-M) CD-ROM,
    most likely pointing to /dev/cdrom.


    > Using CD-ROM drives on the virtual SCSI controller in DOS should be considered
    an advanced project, only for the extremely curious. You need to research the
    SCSI driver at http://www.mylex.com/support/download/manuals/scsistd.html. Virtual
    hard drives can, however, be used on the SCSI controller in DOS.


    +   3. If you want the virtual machine to have direct access to your serial or
    parallel ports, configure them now as described in Chapter 5, “Running VMware
    for the First Time.” Remember that serial ports start at /dev/ttyS0, and parallel
    ports start at /dev/lp0 on most Linux machines.

    +   4. If your Linux PC has sound configured and running and you want the virtual
    machine to have sound access, click the Sound option and then click Install in
    the sound configuration window.

    +   5. VMware recommends 16MB of RAM for DOS, which is perfectly ample for most
    DOS applications and should not need to be changed.

    +   6. Turn on APM support. It will come in handy later, even though DOS itself
    doesn’t make much use of power management. You can change the rest of the settings
    according to your personal preferences.

    +   7. Click Save when finished in the Configuration Editor.


    # Installing DOS in VMware


    One of your choices is MS-DOS 6.22, the last release of the operating system that
    put Microsoft on the map. Although not readily available for sale, if you don’t
    already have a copy, you should be able to scourge one up quite easily.


    Another option is LInes’s DR DOS 7, currently available for sale from http://www.drdos.com.
    You can also download a disk image for evaluation that runs inside the DOSEMU
    emulator.


    ![](img/b2b6702758c230ce537468351fc8af15_292_0.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'DR DOS 7 is arguably better than MS-DOS: Its memory requirements are lighter,
    it supports multitasking, and it has a nice configuration program. If you''re
    serious about using DOS, I recommend you investigate it.


    > Some VMware customers report success using IBM''s PC DOS 2000, available for
    sale online direct from http://www.ibm.com.


    # Installing the DOS Core


    If you have a set of original (non-"upgrade") MS-DOS disks, getting started is
    as simple as inserting Disk 1 and starting the installation. Upgrade versions
    require that an operating system be installed on a disk before they work; you
    need to find some way (possibly using a Windows virtual machine and mounting the
    virtual disk as a secondary drive) to get a preliminary version on the virtual
    disk before starting the upgrade.


    Some older CD-ROM distributions of DOS (such as those that came with retail PCs)
    might not be able to boot from CD-ROM to start the installation process. You might
    need to use a boot disk that offers CD-ROM support, such as the one that accompanies
    Windows 95 and 98.


    Because of the disparity in DOS versions, there is no single "authoritative" installation.
    Because MS-DOS is generally familiar and well understood, I walk through and illustrate
    installing DR DOS 7 from CD-ROM. You might have to find your own way, depending
    on the version and distribution of DOS you wind up using:


    +   1. Boot the virtual machine with the DR DOS 7 CD-ROM inserted.

    +   2. You should see an error message before you reach the DOS prompt because
    there is no usable hard drive yet. You need to partition and format the virtual
    disk. Run fdisk.

    +   3. You should see a prompt asking to initialize the disk. Answer Yes.

    +   4. Choose option 4, Select alternate fixed disk from the screen shown in Figure
    14.3.

    +   5. Select option 1, Create Partition. Create a DOS primary partition, and
    let fdisk use all the available space.


    > DR DOS''s fdisk insists on verifying all the disk blocks, which is time-consuming.
    It does automatically format the disk as part of the process, which is nice.'
