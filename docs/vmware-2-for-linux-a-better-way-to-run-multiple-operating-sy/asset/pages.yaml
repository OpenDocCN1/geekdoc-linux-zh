- pgno: 68
  md: 'If you already run a Samba (SMB) server on your Linux host OS, you should not
    install the VMware custom Samba server, or you might disrupt the operation of
    one or both of them. Many default Linux configurations incorporate a Samba server.
    It is possible, but experimental, to make the two work together. If you are in
    doubt, don''t install the custom Samba server.


    2. If you turn on host-only networking by answering yes in Step 1, you''ll want
    to answer yes to the next question: Do you want this script to probe for an unused
    subnet? VMware looks for a family of IP addresses that it can safely use in virtual
    machines without causing conflicts within your LAN. If you answer yes, VMware
    launches a special DHCP server to provide IP addresses to your virtual machines.


    Make a note of the subnet VMware decides to use. You''ll need it later to configure
    networking between the host and virtual machine over host-only networking. The
    exact numbering scheme of the subnet is different from computer to computer; on
    my system, VMware assigns 192.168.71 as the first three digits for host-only networking.
    In general, the host machine is assigned as machine #1, so in this case, my host
    is 192.168.71.1. Virtual machines start at 128, so the first virtual machine on
    my computer is at 192.168.71.128.


    3. If you elect not to enable host-only networking, you probably want to enable
    bridged networking. Bridged networking lets VMware share your Ethernet card directly,
    so a virtual machine appears on your LAN (and to the outside world) as a regular
    networked PC. This decision is pictured in Figure 4.4.


    ![](img/b2b6702758c230ce537468351fc8af15_68_0.png)


    Figure 4.4  VMware can configure both host-only (PC-to-virtual machine) and bridged
    (virtual machine-to-LAN/Internet) networking.


    > Host-only networking: A custom Samba implementation that allows a virtual machine
    to speak with your Linux host OS, even without any form of network card.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'You can actually use other network protocols than Samba over the host-only
    networking: In fact, I advise you to do so later in the book. In general, only
    use host-only if you don’t have a real Ethernet card or if you have a compelling
    reason not to want to expose your virtual machines to an outside LAN and the Internet.


    4. If you have enabled host-only networking, answer yes to the next question and
    designate a username and password for Samba file sharing. If you choose to skip
    this step, or you need to add more Samba users in the future, enter the command
    /usr/bin/vmware-smbpasswd vmnet1 -a <username> where <username> is the Linux user
    you want to configure for VMware file sharing.


    If you do not configure networking support in VMware at all, I’ve got bad news:
    If you change your mind later, you have to uninstall and reinstall the program!
    When in doubt, at least configure host or bridged networking.


    5. VMware’s installation is complete. It’s time to install your license key so
    VMware can actually start.


    # Obtaining and Installing a License Key


    VMware will not run without a special text file called a license key. VMware provides
    free license keys that are valid for 30 days on its Web site. You can also use
    the VMware site to purchase permanent license keys if you decide to keep using
    the software.


    # Requesting a License Key


    To obtain your 30-day trial key, follow these steps:


    +   1. Open a Web browser and connect to http://www.vmware.com/forms/Download.cfm.

    +   2. Fill out the form shown in Figure 4.5. You need to provide basic user registration
    information. Be sure you select VMware 2.0 for Linux in the Product line.

    +   3. Click Register me and send my Key. After a few minutes, depending on how
    busy VMware’s Web servers are at the time, you should see email from VMware customer
    service appear in the mailbox you provided in Step 2.


    TIP


    CAUTION


    BUZZWORD

    Bridged networking: VMware shares your Ethernet card, allowing your virtual machine
    to have a unique hardware and IP address. In essence, bridged networking transparently
    splits your primary Ethernet card into two (or more).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/b2b6702758c230ce537468351fc8af15_70_0.png)


    Figure 4.5 VMware needs your name and email address to send you a trial license
    key.


    # Installing the Trial License Key


    At this stage, you need to get the license key out of your email and into the
    location where VMware expects to find it:


    +   1. Open the email sent by VMware. It should contain a brief welcome message,
    followed by the license information itself.

    +   2. Depending on your mail program, the license might appear to be a small
    attached text file. If you have the option to save the attachment, save it with
    the filename license and proceed to Step 4.

    +   3. If you are not prompted to save the attachment, you have to cut and paste
    the license information from the email. You should see two lines that read "Cut
    Here" above and below the license data. Be sure you cut everything in between
    (but not including) those lines. The first line of the clip should read "# VMware
    software license," and the last should read "Hash" followed by a long alphanumeric
    string. Save this clip with the filename license. The license file should look
    very much like the one shown in Figure 4.6.

    +   4. VMware expects to find this license file in a directory called .vmware,
    which should be located on your home directory. Use the command mkdir ~/.vmware
    to create this directory.

    +   5. Copy the license file to your new .vmware directory.

    +   6. When you start VMware, it will be able to read the license key and start
    up appropriately.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "![](img/b2b6702758c230ce537468351fc8af15_71_0.png)\n\nFigure 4.6 The VMware\
    \ license key is simply a small text file that tells VMware who you are and how\
    \ long your license should last, along with a unique host ID code.\n\n# Troubleshooting\
    \ the Install\n\nOn a Linux PC that adheres to the VMware requirements outlined\
    \ in Chapter 3, this installation process should pose no problems. However, the\
    \ world is not a perfect place. Here are some tips for dealing with common VMware\
    \ installation ailments:\n\n+   - Remember that VMware will not install unless\
    \ you are either logged in as root or have run the su (superuser) command in the\
    \ same terminal you are using to install VMware.\n+   - VMware will not install\
    \ or update if you are running a VMware virtual machine.\n+   - VMware won't run\
    \ under Caldera OpenLinux 1.3: OpenLinux 1.3 is not on the VMware approved list.\
    \ But if you decide to try anyway, you need to install the version of glibc that\
    \ VMware needs. You'll find glibc-2.06-1.i386.rpm in the col/contrib/RPMS directory\
    \ on your OpenLinux 1.3 CD-ROM. Typing the command rpm -i glibc-2.06-1.i386.rpm\
    \ will install glibc and possibly fix your problem. None of the VMware-approved\
    \ host operating systems has this problem, however.\n+   - VMware won't run under\
    \ Slackware: Why not just run one of the distributions VMware supports? But if\
    \ you are a Slackware purist, this should help: Edit your rc.local file and add\
    \ this:\n\n```\nif [ -x /etc/rc.d/init.d/vmware ]\nthen\n    /etc/rc.d/init.d/vmware\
    \ start\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 72
  md: 'VMware needs to be reinstalled every time you upgrade your host PC''s Linux
    kernel. If you''re planning a kernel upgrade, follow this procedure:


    +   1. Invoke the VMware uninstallation script with the command `./vmware-uninstall.pl`.

    +   2. Perform the kernel upgrade.

    +   3. Reinstall VMware with the command `vmware-config.pl`.


    Understand that this will not affect your guest operating systems, only the VMware
    launch program.


    # Checking for Updates Online


    VMware, Inc. is constantly improving VMware, and from time to time, new versions
    become available. VMware releases incremental upgrades, beta test versions, and
    complete version steps. By reading the News & Events page on VMware''s Web site
    (http://www.vmware.com/news), you can stay up-to-date with the latest VMware feature
    changes, improvements, and upgrades.


    Unless you are a seasoned VMware user, however, it is best to wait to install
    any upgrades of VMware over the version that came with this book, especially if
    it is a beta version. Beta versions are not only less stable, but often are slower
    than full release versions because they have extra debugging capabilities enabled.
    Plus running the version of VMware that comes with this book ensures that you
    can follow along; future versions might make subtle changes to the installation
    and configure process.


    # Conclusion


    If all went well, VMware is now installed on your PC. All you need to do is enter
    one little command, and VMware is at your service.


    The next chapter covers what you can expect to see, and what you need to do, the
    first time you run VMware. Although you could plow blindly ahead and get a virtual
    machine to boot, give me a little more of your time first. You''ll see what the
    VMware configuration interface does for you and finally be able to apply some
    of the intricate knowledge you''ve picked up about virtual machines and resource
    allocations.'
  merge: -1
  img_proc: true
