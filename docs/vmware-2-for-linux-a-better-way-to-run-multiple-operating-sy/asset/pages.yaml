    # Installing Windows 95


    Your virtual machine is ready for a Windows 95 installation.


    If you have a recent copy of Windows 95, it should be on an autobooting CD-ROM,
    eliminating the need for a boot disk. Older versions of Windows 95, however, need
    a floppy disk to start the installation process.


    Most versions of Windows 95 come with a boot floppy, and chances are you will
    need to manually configure and format the virtual disk before installing the operating
    system.


    Unless you have a floppy-only distribution of Windows 95, you need to make sure
    the CD-ROM drive is properly configured before you start the installation. Although
    Windows 95 can use virtual SCSI CD-ROM drives, the installation needs the CD-ROM
    to appear as an IDE device.


    > Again, remember that even if your real CD-ROM is SCSI, it can be made to look
    like an IDE CD-ROM to the virtual machine.


    # Performing Preliminary Tasks


    In the first phase of the Windows 95 installation, you load the virtual machine
    for the first time and prepare the virtual disk.


    +   1. If you''re not running VMware already, start it by typing `/usr/bin/vmware`,
    and select your Win 95 configuration when prompted by the window shown in Figure
    7.8.'
