- pgno: 279
  md: '![](img/b2b6702758c230ce537468351fc8af15_279_0.png)


    Make a note of the FreeBSD configuration tool that you can run after the installation
    is complete in case you need to change options: /stand/sysinstall.


    18. When asked to configure Ethernet or SLIP/PPP by the screen shown in Figure
