    ![](img/b2b6702758c230ce537468351fc8af15_233_1.png)


    Figure 11.17 Stand-alone Server is the easiest type of Windows NT server to manage.


    > Enabling the Windows NT FTP server saves you from having to keep an FTP server
    active on your Linux machine or installing a freeware server such as Dragon Server,
    if you want to share files via FTP between the host and guest.


    You are also asked about network services by the window shown in Figure 11.18.
    At this stage, you can add DHCP, DNS, SNMP, or a variety of other network services
    to the server''s arsenal. The defaults are fine for basic operation, however.'
