- pgno: 280
  md: '![](img/b2b6702758c230ce537468351fc8af15_280_0.png)


    Figure 13.14 Before you load FreeBSD for the first time, use the network configuration
    tools to assign IP information to your bridged networking or PPP device.


    > If you elect to enable NFS service, you are given the opportunity to edit /etc/exports.
    You might need to consult FreeBSD documentation to configure this file because
    FreeBSD''s /etc/exports file uses a different format than Linux. If you are an
    NFS novice, consult Appendix B, "File Sharing with Samba and NFS in VMware," for
