- pgno: 103
  md: 'Until Windows Millennium is released and gains mainstream acceptance, or unless
    Linux makes some more major inroads, Windows 98 will continue to be the top personal
    and business desktop operating system. It should come as little surprise, then,
    that VMware does a thorough job of supporting Windows 98.


    # Choosing Between Windows 95 and Windows 98


    Unlike a new computer buyer, who rarely has the opportunity to decide which operating
    system comes with the system, you are the ultimate master over the virtual machine.
    And if you have both Windows 95 and Windows 98 available to you, you can make
    a careful decision.


    Of course, you can always create virtual machines for both if you have enough
    disk space, but if you need or want to make a choice, here''s why a Windows 98
    virtual machine might make the most sense:


    +   - Smoother installation. Although Windows 98 is usually a longer and more
    disk-intensive installation than Win 95, Win 98 comes with a better set of drivers
    and does a more complete job of detecting VMware''s virtual hardware, avoiding
    most of the glitches you might experience with a Win 95 installation.

    +   - More software drivers. Windows 98 shipped with a more thorough list of drivers
    and DLLs for Windows software, including DirectX. This should save you trips to
    Microsoft''s Web site or extra software installations as you add software to your
    Windows virtual machine.

    +   - Internet Explorer and Active Desktop. Largely a "love it or hate it" issue,
    but if you like the Internet Explorer integration and Active Desktop features
    of Win 98, you can make them a part of your virtual machine.

    +   - Better file system support. Win 98 has generally better networking capabilities
    and is more flexible than Windows 95 in the types of disk partitions it can access.
    Microsoft''s FAT32 drive structure is faster and more efficient than FAT16, whether
    you''re on a real PC''s hard disk or a VMware virtual disk. Not all versions of
    Windows 95 support FAT32 properly.

    +   - Not as close to end-of-life. Although Win 98-only software is still uncommon,
    it might not be long before it is a reality. If you have to be selective about
    how many virtual machines you can install, you''re better off with the most up-to-date
    software possible.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'If you decide on Windows 98, you''re not done. Should you use Windows 98 or
    Windows 98 SE (Second Edition)? If you have the choice, I recommend sticking with
    the original Win 98. Aside from some bug fixes and Year 2000 corrections, most
    of the extra functionality in Win 98 SE is either of questionable value in the
    virtual machine or easy to add on to Windows 98.


    It is foolish and impractical to use a virtual machine Win 98 SE''s Internet Connection
    Sharing as an Internet gateway for a LAN: Such a task is much better suited to
    the host Linux OS on your PC, or even better, a standalone server or network device.
    Enhanced USB support is meaningless in a virtual machine that doesn''t support
    direct access to USB and is not likely to in the near future. And Win 98 SE standard
    software such as Internet Explorer 5 and the Y2K bug fixes are all available free
    from Microsoft''s Web site, if you feel the need to update Windows 98 original.


    # Preparing the Virtual Machine


    If your mind is made up, it''s time to prepare a virtual machine custom-tailored
    for Windows 98.


    > This installation sequence assumes you are using a Windows install disk labeled
    "For distribution with a new PC only" or similar. There are some minor differences
    in upgrade editions.


    # Starting with the Wizard


    Any new VMware virtual machine should start with the Configuration Wizard.


    +   1. If you''re not already in VMware, start the main program with /usr/bin/vmware
    at a command prompt.

    +   2. Launch the VMware Configuration Wizard by clicking Wizard in the File menu.

    +   3. Click Next to clear the first greeting screen.

    +   4. Select Windows 98 from the list of guest operating system choices, shown
    in Figure 6.1, and then click Next to proceed.


    > If you have an upgrade edition of Windows 98, you should select the operating
    system you will first install, and at each upgrade stage, edit the Guest OS setting
    in the Configuration Editor before proceeding. If you have to upgrade from DOS
    to Windows 3.1 to Windows 95 to Windows 98, however, this might be so mind-numbing
    that it is worth your while to buy a fresh copy of Windows 98 and install it directly.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/b2b6702758c230ce537468351fc8af15_105_0.png)


    Figure 6.1


    5. Enter a path to the new directory that will house the VMware configuration
    files as well as the virtual disk. By default, VMware asks to create a new directory
    called /vmware/win98 off of your home directory.


    6. VMware now asks whether you want to create a new virtual disk or use an existing
    physical disk. Unless you are familiar with the advanced disk and configuration
    modes described in Appendix A, "Advanced VMware Configuration," it is best to
    accept VMware''s offer to create a new virtual disk. Click Next to bring up the
    virtual disk creation screen, displayed in Figure 6.2.


    ![](img/b2b6702758c230ce537468351fc8af15_105_1.png)


    Figure 6.2'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   7. Enter a size for the new virtual disk. Although 2000MB is the default,
    you can actually go as high as 2047MB. Remember that the disk grows as data is
    added, but its maximum size cannot be changed later. Click Next to proceed.

    +   8. VMware should detect your CD-ROM. You need a CD-ROM to install Windows
    98, so leave the default settings as is (to enable CD-ROM access and make it available
    when the virtual machine boots), and click Next.

    +   9. VMware now asks the same question about floppy access. Unless you have
    a compelling reason to disable the floppy, leave this setting alone as well. Click
    Next.

    +   10. The wizard asks how the virtual machine should be able to access the network
    using the screen shown in Figure 6.3. If you plan to keep the Windows VM completely
    isolated, you can click No networking. If you have an Ethernet card installed
    and you are on a LAN, use Bridged networking, which lets the virtual machine share
    your Ethernet card and appear as a standalone computer on the network. Host-only
    networking allows Samba file sharing between the VM and your Linux PC (provided
    you installed the VMware Samba server at installation or have one of your own
    running), and Bridged and Host-only networking combines the two. If you have a
    LAN, stick with Bridged for now. If you do not, use Host or none. Click Next to
    reach the final step.


    > Even if you don’t install any networking, there is still an easy way to exchange
    files between your Linux PC and virtual disks. It involves mounting the virtual
    disk as a Linux-readable file system, and it is covered in depth in Chapter 9,
    “Using Your Windows 95/98 Virtual Machine.” I personally think it’s easier and
    more convenient than host-only Samba networking for most file-sharing needs.


    ![](img/b2b6702758c230ce537468351fc8af15_106_0.png)


    Figure 6.3'
  merge: -1
  img_proc: true
- pgno: 107
  md: '11. The wizard summarizes the virtual machine it will create, and should look
    similar to Figure 6.4, although the values might be different depending on your
    choices. If everything looks appropriate, click Done.


    ![](img/b2b6702758c230ce537468351fc8af15_107_0.png)


    # Adjustments with the Configuration Editor


    The wizard is reliable, but not thorough. You should make a quick stop in the
    Configuration Editor to make a few minor adjustments before you launch the virtual
    machine and start the Windows installation:


    +   1. Open the Configuration Editor in the Settings menu.

    +   2. Verify that the wizard created a primary master (P-M) IDE virtual disk
    in the Win 98 configuration directory of the size you created (it might appear
    to be one megabyte less than you specified) and a secondary master (S-M) CD-ROM,
    most likely pointing to /dev/cdrom.


    > You might want to come back later and reassign /dev/cdrom to be a virtual SCSI
    CD-ROM drive, but because VMware does not support booting from a virtual SCSI
    CD-ROM and the Windows 98 boot floppy does not support the VMware SCSI controller,
    you need the CD-ROM in virtual IDE mode to install Windows 98.


    +   3. If you want the virtual machine to have direct access to your serial or
    parallel ports, configure them now as described in Chapter 5, "Running VMware
    for the First Time." Remember that serial ports start at /dev/ttyS0 and parallel
    ports start at /dev/lp0 on most Linux machines.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '4. If your Linux PC has sound configured and running and you want the virtual
    machine to have sound access, click the Sound option and then click Install in
    the sound configuration window, shown in Figure 6.5.


    ![](img/b2b6702758c230ce537468351fc8af15_108_0.png)


    5. If the wizard''s memory suggestion seems inappropriate (VMware usually suggests
    48MB for Windows 98, unless you have less than that available for virtual machines),
    you can increase or decrease it in the Memory setting (see Figure 6.6). A setting
    of 64MB is comfortable for Windows, but more is better. Try not to dip below 32;
    if you don''t have 32MB comfortably available for Windows 98, you might want to
    consider switching to Windows 95.


    ![](img/b2b6702758c230ce537468351fc8af15_108_1.png)


    You can change VMware''s suggested RAM allocation, but don''t exceed your total
    allowed for all virtual machines, usually no more than 64MB less than your computer''s
    total.


    6. You might want to make changes in the Misc settings list. It might make sense
    to enable APM suspend right away, although the other options are best'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'left alone until the operating system is installed and working properly. You
    could assign the redo log directory (say, to a safe place on your system drive)
    if you plan to use undoable or nonpersistent disks in the near future.


    7. Click Save when finished in the Configuration Editor.


    # Installing Windows 98


    Your virtual machine should be ready to run the Windows 98 installation program.
    Windows 98 CD-ROMs are autobooting and VMware virtual machines can boot from virtual
    IDE CD-ROMs, so you should have no need for the boot floppy that comes with some
    copies of Win 98.


    > Again, remember that even if your real CD-ROM is SCSI, it can be made to look
    like an IDE CD-ROM to the virtual machine.


    +   1. If you''re not running VMware already, start it with /usr/bin/vmware, and
    select your Win 98 configuration from the window shown in Figure 6.7 when prompted.

    +   2. Insert the Windows 98 installation CD. If the virtual machine doesn''t
    start with the CD connected, connect it now.

    +   3. Click Power On to launch the virtual machine. The virtual machine boot
    screen, shown in Figure 6.8, should appear.


    ![](img/b2b6702758c230ce537468351fc8af15_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/b2b6702758c230ce537468351fc8af15_110_0.png)


    Figure 6.8 VMware should boot into a familiar BIOS screen and properly identify
    a virtual hard disk and virtual CD-ROM drive.


    After you start the power to the virtual machine, you can feel free to click Full
    Screen at any point to move the display to the faster, full-screen setting.


    +   4. Two text menus appear. On the first, select to boot from CD-ROM rather
    than Hard Disk, and then select to Start Windows 98 Setup from CD-ROM from the
    second menu, shown in Figure 6.9.


    +   5. The first setup screen appears and is shown in Figure 6.10. Press Enter
