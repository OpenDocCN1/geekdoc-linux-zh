- pgno: 99
  md: '+   - Hide partition type of read-only partitions is only important if you
    have a complicated virtual machine configuration. If, for example, you have a
    virtual machine that dual boots between Windows 98 and Windows NT, Windows 98
    might get confused by the Windows NT virtual drive and try to “repair” it. This
    undesirable behavior can be avoided with an advanced boot manager such as PowerQuest
    BootMagic. It’s even easier to avoid if you don’t create dual-booting virtual
    machines.

    +   - Find best resolution in full screen mode should be turned on. This allows
    VMware to change your display resolution when in full-screen mode, so that, for
    instance, an 800x600 Windows 98 screen is shown on an 800x600 screen. Otherwise,
    VMware inherits and keeps the display size of your X desktop, which can lead to
    postage stamp-sized guest OS windows.

    +   - Redo Log Directory tells VMware where to store the log files for nonpersistent
    and undoable virtual disks. Place them on a local drive so you don’t introduce
    network overhead on all your disk accesses.

    +   - Logging level should be set to Normal at all times, unless VMware technical
    support directs you to change it to Debug to diagnose a particular problem. The
    Debug log mode can slow down the virtual machine considerably.


    # Conclusion


    In this chapter, you (finally!) created a VMware virtual machine and learned about
    some of the more intricate configuration settings as well.


    You’ve now done everything you need to do to boot a virtual machine and install
    a guest operating system. It’s finally time to do so.


    Consumer editions of Windows are among the easier installations in VMware, so
    Chapters 6 and 7 cover Windows 98 and 95. There are different benefits to choosing
    one over the other for your first virtual machine, so you might want to read both
    chapters before starting any installations.'
  merge: -1
  img_proc: true
