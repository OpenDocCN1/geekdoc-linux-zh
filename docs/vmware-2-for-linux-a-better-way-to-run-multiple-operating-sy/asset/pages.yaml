  md: '# Installing VMware Tools


    When you''re satisfied that Windows 98 is running as it should, take the time
    to install VMware Tools. You''ll get much better graphics performance, as well
    as the ability to share the clipboard between Linux and the Windows VM.


    > Because you need to access the VMware window toolbar, you''ll need to do this
    operation in windowed mode, not full-screen mode. Remember, use Ctrl+Alt+Esc to
    return to windowed mode.


    +   1. Start with a clean reboot of the Windows 98 virtual machine.

    +   2. On the VMware application window, select Settings, VMware Tools Install.
    (See Figure 6.21.)

    +   3. If this is your first time installing VMware Tools, you might want to take
    the opportunity to read the online help when prompted.

    +   4. VMware has temporarily mounted a special virtual floppy disk image in the
    Windows 98 virtual machine. Go to My Computer and double-click the Floppy icon
    to open the image.

    +   5. Double-click the VMware Tools icon, shown in Figure 6.22.

    +   6. VMware Tools installs with a standard wizard, shown in Figure 6.23. Accept
    the default settings and proceed with the installation.


    ![](img/b2b6702758c230ce537468351fc8af15_118_0.png)'
  merge: -1
  img_proc: true
