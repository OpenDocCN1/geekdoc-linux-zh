    +   7. Click Save when finished in the Configuration Editor.


    # Installing Linux in a Virtual Machine


    You’re ready to build a Linux redundancy machine, so to speak. This example uses
    the Open Circulation edition of Corel Linux OS: the version available for download
    over the Internet, bundled with Corel’s WordPerfect for Linux product, and in
    various other package deals:


    Corel Linux OS is primarily aimed at single-user workstation computers and does
    not come with a great deal of server software. It does come with the basics (FTP,
    Web, and so on), but you have to look elsewhere for esoteric programs.


    +   1. If you’re not already in VMware, start the program and load the Linux configuration
    defined in the previous section.

    +   2. Insert the Corel Linux OS CD in the CD-ROM drive.

    +   3. Power on the virtual machine.

    +   4. The CD automatically boots and starts the installation process with the
    boot screen shown in Figure 10.7.


    ![](img/b2b6702758c230ce537468351fc8af15_193_0.png)


    Figure 10.7  Corel Linux uses a graphical welcome screen and installer.'
