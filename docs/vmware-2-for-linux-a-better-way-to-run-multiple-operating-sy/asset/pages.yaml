- pgno: 236
  md: '# Installing VMware Tools


    With Windows NT updated, you can safely install the VMware Tools and SVGA driver.
    Start with a fresh reboot of Windows NT, and switch to windowed mode by pressing
    Ctrl+Alt+Esc:


    +   1. On the VMware application window, select Settings, VMware Tools Install.

    +   2. If this is your first time installing VMware Tools, you might want to take
    the opportunity to read the online help when prompted.

    +   3. Double-click My Computer and the Floppy icon. This opens the virtual floppy
    VMware mounted when you started the tools install process.

    +   4. Double-click the VMware Tools icon, shown in Figure 11.21.

    +   5. Accept the default settings in the VMware Tools Installation Wizard and
    proceed with the installation.

    +   6. When prompted to enable clear-text passwords, answer Yes. Although they
    are not always strictly necessary to connect to a Linux-hosted Samba server, they
    make things much easier.

    +   7. When the Tools installation is complete, Windows opens the Display Properties
    control panel, shown in Figure 11.22. Click the Display Type button to start installing
    the SVGA driver.

    +   8. You need to change the VGA Compatible Display Adapter to the custom VMware
    driver. Click the Change button, and then select Have Disk on the Change Display
    window. When Windows asks where it should search for the new driver, specify A:\winnt.


    ![](img/b2b6702758c230ce537468351fc8af15_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/b2b6702758c230ce537468351fc8af15_237_0.png)


    Figure 11.22 Use the Display Properties control panel to enable the VMware SVGA
    driver.


    +   9. Select the VMware, Inc. SVGA adapter from the Change Display window shown
    in Figure 11.23, and click OK.

    +   10. Windows warns you that this is a third-party driver. Click Yes to commit
    to the installation.


    ![](img/b2b6702758c230ce537468351fc8af15_237_1.png)


    Figure 11.23 The VMware SVGA driver is stored on the VMware Tools virtual floppy
    disk in A:\winnt.


    +   11. After the driver is installed, close all windows and select Settings,
    Cancel VMware Tools Install on the VMware window.

    +   12. Allow Windows NT to reboot.

    +   13. After the reboot, you should see a tools icon in the system tray and signs
    of increased color depth on the Windows desktop.

    +   14. Enter Display Properties (either through Control Panels or by right-clicking
    on the desktop and selecting Properties) and set your Windows desktop to the resolution
    you want to use. See Figure 11.24 for illustration.


    > See Chapter 8, "Understanding the VMware Tools for Windows," for a complete
    discussion of VMware Tools for Windows. The toolbox is functionally identical
    in Windows 95/98 and Windows NT.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/b2b6702758c230ce537468351fc8af15_238_0.png)


    Figure 11.24  After the VMware SVGA driver is installed, adjust the virtual machine
    screen resolution in Display Properties.


    # Installing Sound Support


    If you turned on sound support in the VMware Configuration Editor, you might be
    surprised when you notice that no sound is coming from your virtual machine yet.
    Windows NT does not automatically configure new sound cards; you have to add the
    driver yourself. Fortunately, the sound card driver you need is already sitting
    on your hard drive if you did a typical system installation.


    To enable sound support, follow these steps:


    +   1. In the Windows NT virtual machine, open the Multimedia control panel, shown
    in Figure 11.25.


    ![](img/b2b6702758c230ce537468351fc8af15_238_1.png)


    Figure 11.25'
  merge: -1
  img_proc: true
- pgno: 239
  md: '+   2. Click the Devices tab.

    +   3. Click the Add button, and select the Creative Labs Sound Blaster 1.X, Pro,
    16 driver from the window shown in Figure 11.26.

    +   4. Accept the default I/O address setting (220) and click Continue.

    +   5. On the next configuration screen (shown in Figure 11.27), leave the first
    three settings alone. Because VMware does not offer MIDI synthesis, you need to
    set the MPU401 I/O Address to Disable.

    +   6. You need to reboot Windows NT for the sound driver to be activated. After
    that, enjoy all the sampled audio you can handle in Windows NT.


    ![](img/b2b6702758c230ce537468351fc8af15_239_0.png)


    Figure 11.26 Add the Creative Labs Sound Blaster 1.X, Pro, 16 driver to gain sound
    support in your Windows NT virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_239_1.png)


    Figure 11.27 The Interrupt and DMA settings are fine, but be sure to disable MPU401
    MIDI synthesis.'
  merge: -1
