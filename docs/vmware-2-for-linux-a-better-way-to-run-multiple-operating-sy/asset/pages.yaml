- pgno: 213
  md: '![](img/b2b6702758c230ce537468351fc8af15_213_0.png)


    Figure 10.25 The bridged IP address, 192.168.20.4, starts with the same three
    number blocks as the eth0 adapter on the host.


    # Sharing Files via FTP


    Yes, it lacks a certain elegance. Yes, it''s early 80s technology. But my friends,
    I tell you plainly, it is the easiest and most convenient way to swap files between
    your host PC and your virtual machines. NFS works well but requires additional
    configuration, and Samba, in a Linux-to-Linux setting, does not offer significantly
    greater advantages over FTP for most users. See Figure 10.26 for a Linux-to-VMware
    FTP session.


    > Samba and NFS-based file sharing are covered in detail in Appendix B, "File
    Sharing with Samba and NFS in VMware."


    Most Linux distributions run an FTP server by default. If you shut yours off for
    security purposes, turn it back on or just leave the server in your virtual machine
    enabled when you install its copy of Linux. For demonstration purposes, I assume
    the FTP server is running on the host, however.


    There are literally dozens of FTP clients to choose from, ranging from plain-text
    terminal varieties such as ftp and ncftp (both standard in Linux distributions)
    as well as elaborate GUI implementations. There is copious documentation on FTP
    available anywhere you care to look, including the built-in man help pages in
    Linux.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/b2b6702758c230ce537468351fc8af15_214_0.png)


    Figure 10.28 The host (in the top Terminal window) is logged in to the virtual
    machine, and the virtual machine is logged in to the host!


    To share files over FTP, simply open a session from the virtual machine to the
    host. If you are using bridged networking, connect to the IP address of the host''s
    eth0 Ethernet device (192.168.20.2, in my example). If you are using host-only
    networking, connect to the IP address of the host''s vmnet1 device (192.168.71.1,
    in my example).


    Log in with a username and password that are valid on the host machine, and begin
    swapping files. Note that some FTP servers by default will not let you log in
    as root, to protect the system from possible grave tampering. You can consult
    an advanced text on FTP servers if you need to change features such as this.


    > Actually, the example at the start of this section is pure proof-of-concept
    overkill. Because you can upload as well as download files (put as well as get,
    in FTP lingo), it''s unnecessary to run FTP clients on both sides. But it''s nice
    knowing it can be done!


    If you have NFS available on your computer, you can also share drives that way.
    See Appendix B for details. Also some very clever FTP clients can help make accessing
    the networked drives virtually transparent.


    If you connect over bridged networking, the domain name servers that your computers
    communicate with might cache the network name of your host PC, allowing you to
    drop the cumbersome IP address.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Sharing an Internet Connection


    If you take advantage of VMware’s bridged networking capabilities, you might be
    able to access a local area network or the Internet directly from the virtual
    machine.


    A bridged networking connection looks and behaves to the outside world as a separate
    computer. It just happens to share your host computer’s bandwidth.


    Internet connections over a LAN (often in a corporate setting, but increasingly
    found at home) work extremely well in VMware. Many include DHCP servers that automatically
    assign IP addresses to the clients on the network—including your VMware session.
    If there is no DHCP server, you have to research what IP address can be safely
    assigned to the virtual machine to give you access without conflicting with anyone
    else on the network. You can see a Linux guest connected to the outside Internet
    in Figure 10.27.


    If your Internet connection does not lend itself to being shared using a bridged
    networking connection (some modem dial-up accounts fall under this category) you
    have two options.


    You can set up an Internet proxy server on your host Linux machine and point the
    virtual machine to the proxy server on the host across either a bridged or host-only
    network connection. Proxy servers are readily available for Linux, although their
    configuration and maintenance falls squarely under the “advanced” category and
    will require some extra reading on your part.


    ![](img/b2b6702758c230ce537468351fc8af15_215_0.png)


    Figure 10.27 The Linux virtual machine can access the Internet using VMware’s
    bridged networking feature.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Or you can simply make the Internet dial-up connection directly from the virtual
    machine. VMware should have no trouble whatsoever accessing an internal or external
    modem that works on your Linux setup. Because you’ll be using Linux to make the
    connection, you can probably just export your configuration files to the virtual
    machine (over an FTP link as described earlier, for example) and dial out from
    the virtual machine over the modem as needed.


    > This isn’t sharing, strictly speaking, because you have to disconnect the host
    from the Internet every time you want to dial from the virtual machine, but it
    is an option worth considering before you give up.


    # Mounting a Virtual Disk on the Host


    There will probably be times when you want to get data to or from your virtual
    machine’s virtual disk, but VMware isn’t running, you don’t have enough system
    resources to load it, or you just don’t want to bother with the network protocols.
    It would certainly be convenient if you could access virtual disks directly from
    the Linux host.


    Luckily for VMware fans, the programmers have thought of that. A handy little
    program called vmware-mount.pl lets you address a virtual disk as you would any
    standard Linux drive.


    > Do not attempt to mount a virtual disk while it is in use by a running virtual
    machine. Although there are safeguards against this, don’t push your luck by trying
    anyway. Also, it is wise not to tinker too much with a virtual disk that is in
    suspend mode.


    vmware-mount.pl is currently part of the standard VMware distribution. To mount
    a virtual drive, follow these steps:


    +   1. Quit all sessions of VMware.

    +   2. You need root access. Type su and enter the root password.

    +   3. Use the vmware-mount.pl program to first display the partition table of
    the drive you want to mount. You need to know the location and name of your virtual
    hard drive first. A common name for a Linux virtual hard drive is ~/vmware/linux/linux.dsk.

    +   4. Type vmware-mount.pl -p ~/vmware/linux/linux.dsk, substituting the final
    argument for the actual path of your Linux virtual disk. See the results in Figure
    10.28.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/b2b6702758c230ce537468351fc8af15_217_0.png)


    Figure 10.28 vmware-mount.pl shows the partition table of the Linux virtual disk.


    +   5. You see a partition table. For a common Linux virtual machine, you see
    one swap partition and one or more standard Linux partitions. Make a note of the
    number (in the first column) of the partition you want to mount.


    +   6. To actually mount the drive, type vmware-mount.pl ~/vmware/linux/linux.dsk
    1 /mnt/vhd, substituting the first path with the actual path to your virtual disk
    and the number 1 with the actual partition number you want to mount based on your
    virtual disk’s configuration. If vmware-mount.pl complains that you are lacking
    the "Network Block Device," you may need to manually load the nbd.o module, or
    recompile your kernel with this support.


    +   7. If you type cd /mnt/vhd, you find yourself at the root of your Linux virtual
    machine’s hard drive. You can access any file in the virtual disk and copy items
    to and from the rest of your Linux file system. Remember that your changes are
    permanent, so be careful!


    +   8. Don’t forget to disconnect the virtual drive when you’re done, before attempting
    to load from the virtual disk in VMware in particular. Unfortunately, you have
    to use brute force: Click on the terminal you used to launch the vmware-mount.pl
    program, and press Ctrl+C to quit.


    > Accessing a virtual disk in this fashion can, under certain circumstances, make
    your system unstable if you perform large sustained writes to the virtual disk.
    If you need to write large amounts of data to the virtual disk, consider using
    VMware’s networking capabilities instead of directly mounting the virtual disk.
    Watch VMware’s Web site for future updates to the vmware-mount.pl program that
    will fix this problem.


    ![](img/b2b6702758c230ce537468351fc8af15_217_1.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Conclusion


    VMware can create a virtual computer for any number of the top Linux distributions
    on the market. Whether you need a protected place to work on configuration changes
    to your core system or you want to experiment with really wild modifications to
    the operating system, VMware can give you a transparent virtual machine to carry
    out your plans.


    I charge you to go forth and install as many Linux-based virtual machines as you
    have hard drive space for. Odds are if you’ve been in the Linux community for
    any length of time, you have a small stack of trial version distributions lying
    around that you’ve never experimented with because you didn’t want to compromise
    your primary system. VMware gives you an unlimited controlled testing lab for
    Linux distributions, Linux programs, and all types of networking techniques. You
    can even use it to build your knowledge of UNIX-to-UNIX networking and file-sharing
    techniques!'
