- pgno: 39
  md: 'VMware''s unique virtual machine design makes it extremely powerful and probably
    unlike anything you''ve ever seen before, even if you''ve experimented with emulators
    and virtual machines in the past.


    This chapter pops open the VMware hood and explains in detail what VMware can
    do and how it''s done.


    # Sharing the CPU


    The most important thing to remember about VMware''s virtual machine design is
    that your CPU''s attention is split between your host OS (Linux) and whatever
    guest OS you run in VMware. That''s because VMware looks just like a Linux application
    to the Linux task scheduler.


    The VMware software layer and Linux''s own multitasking kernel manage the CPU
    demand to ensure that neither side can completely deny the other of attention,
    although it is possible for heavy demand from either to greatly slow down your
    computer. Think of a flowing stream, with a new irrigation branch. As long as
    things remain under control and nobody gets too greedy, there''s still plenty
    of water for everyone. Figure 2.1 is a diagram of the VMware virtual machine architecture.


    VMware runs in two pieces: the virtual machine itself, in which your guest operating
    system and programs run, and a "traffic cop" VMware Virtual Platform software
    layer


    ![](img/b2b6702758c230ce537468351fc8af15_39_0.png)


    Figure 2.1 A look at VMware''s design (permission to use copyrighted graphic granted
    by VMware, Inc.)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'that manages all the I/O between the guest OS, you, and your computer. This
    emulation layer is less demanding than it would be if VMware had to emulate its
    own CPU as well. VMware claims that in some circumstances the Virtual Platform
    layer consumes less than 5 percent of available CPU time; you might find it needs
    20 percent or more. See Figure 2.2 for an example of typical CPU usage on a computer
    running Linux and a VMware guest session.


    > VMware does not support multiprocessor access from within a virtual machine,
    but if your host machine has more than one CPU, you can lighten the load. VMware
    will run a second virtual machine on your second CPU, the third on a third CPU
    (if available), and so on. This makes it feasible to run more than one instance
    of VMware at once; otherwise, your system starts to get a bit crowded. Unfortunately,
    VMware does not provide a built-in tool to select which CPU will run each virtual
    machine.


    Keep in mind that the features and quirks of the host CPU are replicated in the
    VMware guest virtual machine. For instance, computers using AMD K6-2 CPUs of 350MHz
    or more are susceptible to a crashing on startup in Windows 95, and the same patch
    that cures the problem on a standalone Windows PC is required in VMware.


    By the same token, if you want your guest operating system to have access to the
    Streaming Single Instruction Multiple Data (SIMD) Extensions of the Intel Pentium
    III or the Enhanced 3DNow! capabilities of the AMD Athlon, then that needs to
    be the CPU in your computer. VMware can''t make a four-cylinder engine look like
    a V8.


    > The AMD K6-2/Windows 95 problem is described at http://www.amd.com/products/cpg/k623d/win95_update_k6.html.


    ![](img/b2b6702758c230ce537468351fc8af15_40_0.png)


    Figure 2.2 Typical CPU resource allocation with VMware.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Creating an Isolated Environment


    VMware takes great pains to build an ironclad, “I can’t believe it’s not a PC”
    virtual machine. Here’s the best news first: It is extremely unlikely that even
    the worst crash in a VMware virtual machine will damage or even inconvenience
    your host Linux OS.


    Aside from their communication with the VMware Virtual Platform layer, VMware
    sessions do not have any special privileges or access to your computer’s files
    or memory space. You predefine a hard memory limit that VMware’s guest OS cannot
    exceed, and you similarly lay down the law as to which system devices and disk
    storage units VMware can touch. Everything else is off-limits; it’s completely
    invisible and inaccessible.


    Although Linux can temporarily reclaim memory allocated to a VMware virtual machine
    through paging and swapping, the resulting performance hit is extremely unpleasant.
    It will behoove you to think of any memory given to a virtual machine as off-limits
    to Linux applications.


    Because VMware can form a virtual network between the emulation and your host
    OS, it is possible for network trojans to spread between the two. You should treat
    the virtual machine as just as real a security risk as any other computer. Enforce
    whatever antivirus and network security policies you might have, and if you don’t
    have any, now is a good time to make some.


    ![](img/b2b6702758c230ce537468351fc8af15_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Not only does VMware protect the host system from the guest virtual machines,
    but also it can protect the virtual machines from themselves, so to speak.


    Whether it''s accidentally deleting important files, changing the wrong configuration
    setting, or contracting a virus that wreaks havoc with your data, chances are
    that you''ve had some sort of horrible problem on a computer before. And chances
    are good that you have one with a virtual machine as well. Fortunately, VMware
    included a couple of ways to help protect your data if you feel you''re particularly
    prone to accidents or sabotage.


    Most of the time, VMware uses "persistent" disk images to store data. These storage
    devices (actually just large files in a Linux directory) behave exactly like a
    regular hard drive. But any VMware hard disk image can be flagged as "nonpersistent"
    or "undoable" if you need a safety valve or you have some other reason for keeping
    your files extra-safe. You can make this choice every time you start VMware, so
    you don''t need three different disk images to take advantage of the three different
    types of disks. Figure 2.4 shows the VMware disk configuration screen, which controls
    the size and permanence of VMware virtual disks.


    ![](img/b2b6702758c230ce537468351fc8af15_42_0.png)


    Figure 2.4 VMware''s disk configuration screen.


    # Nonpersistent Disks


    Nonpersistent disks appear to the guest operating system to be completely normal
    hard drives. But when changes are made to the drive—whether you edit an existing
    file, install new software, or even format the entire partition with extreme prejudice—the
    changes are not made to the disk image, but to a temporary redo log file. For
    as long as VMware is running, that log file sits between the guest OS and the
    nonpersistent disk image, making it appear as if all the requested changes have
    been made. But as soon as VMware is shut down, the changes are gone, and you''re
    left with the exact same disk image you had before you cut your swath of destruction.


    BUZZWORD

    Redo log: A file that records all the disk writes made in a VMware guest OS session.
    The modifications in the redo log can be made permanent, or they can be discarded'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Of course, this is an absolute nightmare if you''ve just spent hours installing
    your favorite applications, writing a program, or composing your magnum opus.
    But for testing new software, a new change to your virtual system, or commercial
    applications such as tech support, it''s a brilliant stroke of luck.


    > The buffering process used to create the redo log and track the differences
    between the nonpersistent disk and the log introduces an extra layer of overhead
    to disk access, which can slow things down. On the other hand, because of the
    way VMware buffers disk access, some read/write operations actually work faster
    with nonpersistent disks.


    Nonpersistent disks give you a "clean room" virtual environment every time you
    restart VMware, so you also get a certain license to brutalize the configuration.
    Not sure what that Windows Registry hack you just read about does? Give it a try.
    Just read about a clever kernel modification, but you''re afraid to try it on
    your main Linux drive and you hate the tedium of backing up your current kernel
    and creating a new boot entry? Experiment in the protected world of a nonpersistent
    Linux virtual machine!


    # Undoable Disks


    What''s that I hear you cry? "What about changes I really do want to keep? Why
    can''t I have my cake and eat it too: have the safety of the redo log but the
    option to keep my changes in case everything is fine when I''m done?"


    Yes, you can in fact possess and consume your sweets simultaneously. An undoable
    disk gives you the protection of nonpersistent disks, but the option to make all
    your changes permanent at the end of a VMware session. If you choose to commit
    to the changes, VMware updates the disk image. If you discard them, the disk image
    remains untouched and will be exactly the same as it was before you last ran VMware.
    Figure 2.5 shows the end of a virtual machine session that employed an undoable
    disk.


    The really nice part is that you actually get two opportunities to decide what
    to do with the redo log. When VMware powers down, you are asked whether you want
    to commit, discard, or keep the changes made during the virtual machine session.


    ![](img/b2b6702758c230ce537468351fc8af15_43_0.png)


    Figure 2.5 VMware asks what it should do with a redo log.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'By committing, you make the changes permanent. Discard loses the changes forever,
    leaving the disk image in the same state it was before you last launched VMware.


    But by merely keeping the changes, you can mull over your choice until the next
    time you run VMware. At that point, you are asked again to commit or discard the
    changes. You''re also presented with a new option: append new changes to the current
    redo log. This means that the virtual machine boots with the changes you made
    last session intact (in other words, as if you had committed to the changes) but
    leaves the redo log open, which still leaves you the option of undoing all the
    changes you made in both the current and the last session. Figure 2.6 shows VMware
    starting a new session with a "kept" redo log.


    If you decide to append new changes to the existing redo log, all the changes
    you have made are part of the same log: You cannot selectively undo only the changes
    made in the current or previous session.


    If you entirely forgot to make a decision about the changes, you can cancel the
    VMware load sequence so you can make up your mind about the redo log.


    ![](img/b2b6702758c230ce537468351fc8af15_44_0.png)


    Figure 2.6 VMware asks what to do with an old redo log.


    # What Hardware Can VMware Share?


    The good news is that VMware and any supported guest operating systems work flawlessly
    with most of the hardware you''re currently enjoying under Linux. The bad news
    is that VMware only works with hardware you''re currently enjoying under Linux.
    The VMware Virtual Platform layer can only address hardware that can be configured
    and used in the Linux universe.


    VMware Hardware Compatibility Rule #1: If the hardware doesn''t work in Linux,
    it won''t work in any VMware guest OS, even if that guest OS natively supports
    the hardware. Exception: Some dongles (which are useless under Linux) are properly
    recognized in VMware guest operating systems.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'However, just because a device works in Linux does not necessarily mean that
    it will work in a VMware virtual window. Some hardware that works under Linux
    is only indirectly supported in VMware, and others simply don''t work at all.


    > VMware Hardware Compatibility Rule #2: Just because hardware works in Linux
    does not necessarily mean it will work in VMware, and if it does work, it might
    not be directly supported.


    Here''s a more complete look at VMware-friendly hardware.


    # Mice


    In general, almost any common PS/2 or serial mouse you can easily attach and use
    in Linux will work just fine in VMware. Specifically, mice that adhere to the
    PS/2, Microsoft serial, Mouse Systems, Logitech MouseMan Serial, or Microsoft
    IntelliMouse PS/2 standards are supported. VMware limits you to a standard two-
    or three-button mouse inside the virtual machine; however, wheel or scroll mice
    are not supported in VMware, even if you manage to enable the wheel in Linux.
    The wheel can act as a third button when clicked, however.


    # Keyboards


    The news for keyboards is much the same as it is for mice: If it''s a standard,
    Linux-supported keyboard (as most are), you won''t have any difficulties. VMware
    emulates a 101/102 key keyboard, although some of the extra features found on
    "multimedia" keyboards can be supported if you have the proper drivers for the
    guest operating system.


    > In some more esoteric environments, VMware might have trouble recognizing your
    keyboard. If you are using the recommended XFree86 video software but VMware can''t
    see the keyboard, you need to edit the file ~/.vmware/config (the VMware configuration
    file on your local machine, in your user directory), and add the following line:


    ```

    xkeymap.uskey codeMap = true

    ```


    If your PC is accessing a remote XFree86 video server, add the following instead:


    ```

    xkeymap.uskeycodeMapIfXFree86 = true

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: '> Some Japanese-language keyboards might not work properly under VMware. Full
    details on fixing the problem are available at VMware''s technical support site
    at http://www.vmware.com.


    # Video Cards


    More good news if you''re the kind of person who likes to keep things simple:
    If your video card is properly supported in XFree86, you have nothing to worry
    about. If you have an extremely old video card (with 2MB of video memory or less),
    you will find your choice of screen resolution rather limited after you install
    a guest OS, but the limitations are exactly the same as they are in Linux.


    The real key is the version of XFree86 you''re running. VMware strongly recommends
    version 3.3.4 or better (version 4 is not yet officially supported, but may work
    properly). If you''re running a VMware-approved distribution of Linux, you have
    nothing to fear because your distribution incorporates the proper version of XFree86.


    > If you''re not sure what version of XFree86 your system is running, or you are
    simply curious, type xdpyinfo at any terminal prompt. The version number appears
    toward the top of the page in the vendor release number field. The number is returned
    without periods, so 335 means you have XFree86 version 3.3.5.


    In most supported operating systems, a VMware guest OS can use the full SVGA resolution
    and color capacity of your computer''s own graphics card. However, in DOS, Windows
    3.1, and unsupported operating systems, VMware only emulates a standard VGA video
    card, which tops out at a very modest 640×480 screen with only 16 colors! This
    is good enough for a few basic applications and some games but is hardly impressive
    to look at.


    To fully exploit your graphics card in VMware, you need to be sure to install
    the VMware Tools in each guest operating system. More information on VMware Tools
    is coming up in Chapter 8, "Understanding the VMware Tools for Windows."


    # Fixed Storage (Hard Drives)


    Any common IDE or SCSI hard drive recognized by Linux can be used to create virtual
    disk images in VMware. In theory, you can also use a networked storage device
    as the virtual hard drive as long as it is in your standard file path, but this'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'introduces network overhead for every VMware disk access and can seriously
    impair your performance.


    VMware emulates a dual-channel IDE controller, as found on most modern PCs. This
    IDE controller can see up to four devices, so you can attach up to four virtual
    disks or three virtual disks and one CD-ROM.


    As an alternative to file-based disk images, VMware can support raw disks, which
    are entire drives or physical drive partitions that the virtual machine accesses
    directly. In the current version of VMware, raw disk access is more stable with
    IDE disks, although SCSI support is available.


    Raw disks are discussed in Appendix A, "Advanced VMware Configuration."


    # Removable Media (CD-ROMs, Zip Drives)


    VMware supports any standard IDE or SCSI CD-ROM drive, including the ability to
    boot a virtual machine from CD-ROM. DVD, CD-R, and CD-RW drives are also supported,
    but as read-only CD-ROM drives. That means you cannot read DVDs within a virtual
    machine, nor can you write to CDs. VMware also has difficulty with multisession
    discs due to limitations in Linux''s CD-ROM handling.


    > Due to a quirk in VMware''s design, if you want to boot from a SCSI CD-ROM drive,
    VMware has to masquerade the SCSI CD-ROM drive as an IDE device. I address how
    this is done in Chapter 5, "Running VMware for the First Time."


    Any removable media device, such as an Iomega Zip or Imation SuperDisk drive,
    that runs under Linux can be used to store VMware virtual disks. Direct support
    for these devices in VMware is somewhat limited, however. ATAPI Zip drives cannot
    be used as removable media devices (although parallel port Zips can), and an Imation
    SuperDisk cannot be used as a removable media device or as a standard floppy drive.
    If your PC relies on a SuperDisk for floppy compatibility, you need to add a real
    floppy drive to use regular disks in VMware.


    # Expansion Ports (Serial, Parallel, USB)


    VMware guest operating systems can access standard parallel ports (COM1, COM2,
    and so on) straight through in most cases, meaning that any device attached to
    the port should be recognized and operate correctly inside a guest operating system.


    Parallel-port support is a little more complicated. Old-style unidirectional parallel-port
    devices should always work. Newer, bidirectional parallel ports allow faster printing
    and let you use more powerful devices, such as image scanners and Zip drives.


    Raw disk: A physical hard drive or hard drive partition that a virtual machine
    accesses directly, just as a regular PC does. Raw disks are more flexible than
    file disk images but are more difficult to configure and have certain limitations
    of their own.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'ECP (Extended Control Protocol) parallel access, an extension of the bidirectional
    protocol, is partially supported, although only if properly enabled in your PC''s
    BIOS. ECP will enable some devices, such as portable MP3 player cradles, to work
    in VMware.


    VMware can only use bidirectional parallel ports if your host Linux OS has the
    parport_pc module loaded (enabled by the CONFIG_PARPORT_PC option during kernel
    configuration). If it is not loaded, or it is compiled directly into the kernel,
    bidirectional access does not work. VMware-approved Linux distributions should
    already have this module loaded.


    VMware virtual machines, by default, configure themselves to support four serial
    ports and two parallel ports, even if you don''t have nearly that many in your
    system. You can leave them alone or remove them from the hardware configuration
    at your discretion; it won''t impact the performance of the virtual machine, so
    it''s best to leave them alone unless you''re sure you know what you''re doing.


    As you probably know already, USB support in Linux is spotty at best. As a result,
    USB ports are not supported in any VMware virtual machine.


    # Printers and Scanners


    Back in the days of dot matrix, you could plug a printer into practically any
    computer and be sure of getting at least some sort of intelligible output. But
    as printers have matured and become orders of magnitude more powerful, bright,
    and clear, accessing printers has become more complicated.


    VMware can support many common inexpensive printers without any software support
    from the Linux operating system. However, VMware cannot access a printer unless
    it could work under Linux. Some printers have eliminated all vestiges of backward
    compatibility and rely entirely on special Windows programs to function. VMware
    does not support these "Winprinters," even in a Windows virtual machine.


    The good news is that a tremendous range of printers are not "Winprinters," and
    as such are VMware compatible, but the bad news is that some of the most attractive
    printers on the market (such as color inkjet models selling below $100) are not,
    at least not yet.


    Linux has very good PostScript printer support. You won''t go wrong with a PostScript
    printer, although they can be expensive.


    ![](img/b2b6702758c230ce537468351fc8af15_48_0.png)


    ![](img/b2b6702758c230ce537468351fc8af15_48_1.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '> For more information on printers and Linux, read the Linux Printing HOWTO
    at http://www.linuxdoc.org/HOWTO/Printing-HOWTO.html.


    Linux has fair support of flatbed and handheld image scanners. However, VMware
    only supports scanners that connect via the parallel port. More powerful scanners
    prefer a SCSI interface because it is considerably faster, not to mention more
    flexible and reliable. But until VMware, Inc. improves its SCSI support, consider
    image scanning a hit-or-miss prospect in virtual machines and only if you can
    find a parallel port scanner. (USB scanners are also out of the question due to
    poor USB support in Linux and no USB support in VMware.)


    > If you have a scanner that is supported in Linux but not in VMware, there''s
    no reason why you can''t use Linux for scanning and a VMware guest OS for image
    editing. See Chapter 9, "Using Your Windows 95/98 Virtual Machine," for suggestions.


    # Modems and Network Cards


    Modems have followed the same sad design path as printers over recent years. It''s
    still almost always true that an external modem works just as well on Linux as
    it does in any other operating system, so VMware has the same full level of support.


    Internal modems are a different matter. It has become somewhat difficult to find
    an internal modem that does not rely on a proprietary Windows driver. Although
    many Linux enthusiasts have rallied to petition the manufacturers for support,
    it has been extremely slow in coming. As with Winprinters, VMware cannot break
    through this "Winmodem" barrier, even in a supported Windows virtual machine.


    > http://www.o2.net/~gromitkc/rg hosts a list of internal PC modems commonly found
    at major computer stores, with Linux compatibility information for each model.


    Fortunately, Ethernet cards have not followed this sad route. Linux''s support
    for most ISA and PCI Ethernet cards is fantastic (you can buy Ethernet cards for
    less than $20 that work splendidly), and there is even growing support for the
    OS from networking vendors.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'VMware should work with any Linux networking card. Instead of giving guest
    operating systems direct access to your network adapter, however, VMware internally
    emulates an AMD PCnet Family Ethernet card, so that is the device each guest operating
    system must be able to support. Every VMware certified guest OS supports the PCnet
    Family emulation, including DOS and Windows 3.1.


    > Full documentation and device drivers for the PCnet Family card are available
    at http://www.amd.com/products/npd/software/pcnet_family/intro.html.


    # SCSI


    The only SCSI hardware VMware can access are hard drives and CD-ROMs. Scanners,
    tape drives, and other peripherals are unavailable.


    VMware’s SCSI support is similar to its Ethernet card support. Instead of allowing
    the virtual machine to see your SCSI card directly, VMware emulates its own SCSI
    card, in this case a BusLogic BT-958 device. This card is supported in all of
    VMware’s supported guest operating systems.


    The emulated SCSI card can see up to seven devices (virtual disks and CD-ROM devices
    combined), in addition to what the emulated IDE controller can support.


    > For more information on the BusLogic BT-958, see the manufacturer’s support
    page at http://www.mylex.com/support/download/manuals/scsihstad.html.


    # Sound Cards


    Sound support under Linux is certainly a lot better than it has been in years
    past, but it’s still not an exact science, in large part because sound card manufacturers
    keep changing their chips and specifications without telling anybody.


    Some card families, such as those from Creative Labs and ESS, are reasonably well
    supported by Linux developers. Some vendors, such as Aureal, have begun supporting
    Linux directly—although Aureal is now bankrupt.


    If you’ve managed to conquer the challenges of sound configuration in Linux, VMware
    will richly reward you with SoundBlaster 16 emulation in its virtual machines.
    VMware does not currently support MIDI synthesis or the joystick port found on
    most audio cards.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The SoundBlaster 16 emulation is well-supported in almost all of VMware’s supported
    guest operating systems and poses little configuration challenge (even in Linux
    virtual machines).


    > If you’ve grown frustrated fighting with custom drivers for your off-brand sound
    card in Linux, do yourself a big favor and pick up a used or surplus SoundBlaster
    32 or 64AWE from a wholesaler or a private seller on eBay or the like. They’re
    quite good, and they work with the default sound drivers in commercial Linux distributions.


    # PCMCIA/PC Cards


    Although Linux has strong support for the PCMCIA ports (now called PC Cards) found
    on laptops, VMware does not directly support PCMCIA cards. It does, however, support
    the most common types of devices found on PCMCIA cards (Ethernet adapters and
    modems, provided that the modem is not using Winmodem technology) as long as the
    cards have been properly configured in Linux.


    > For additional advice on getting maximum Linux compatibility (and, in turn,
    VMware compatibility) out of your laptop’s hardware, read the Linux PCMCIA HOWTO
    (http://www.linuxdoc.org/HOWTO/PCMCIA-HOWTO.html) and the Linux on Laptops home
    page (http://www.cs.utexas.edu/users/kharker/linux-laptop).


    # What Software Can VMware Run?


    This section really addresses two questions: “What operating systems can be installed
    in a VMware virtual machine?” and “What software can I then run on a supported
    OS in a virtual machine?” First, let’s look at the guest operating systems VMware
    supports.


    # Guest Operating Systems


    VMware fully supports the most popular operating systems for Intel x86 architecture
    PCs. Specifically, the following versions and distributions are fully compatible
    with VMware virtual machines:


    +   - Microsoft Windows 2000 (Professional, Server, and Advanced Server)

    +   - Microsoft Windows NT 4, Service Packs 3-6a (Workstation and Server)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - Microsoft Windows 98 and 98 Second Edition

    +   - Microsoft Windows 95

    +   - Red Hat Linux 5.x-6.x

    +   - Caldera OpenLinux 1.3-2.x

    +   - SuSE Linux 5.3-6.x

    +   - TurboLinux 6.0

    +   - Corel Linux OS

    +   - FreeBSD 2.2.x-3.x

    +   - Microsoft Windows 3.1 and 3.11 (no VMware Tools)

    +   - Microsoft MS-DOS (no VMware Tools)


    VMware certifies and supports its product with each of these operating systems.
    This book addresses installing and using each major family of guest operating
    system, with the exception of Windows 2000 Advanced Server. The extra features
    in Advanced Server, such as support for up to eight CPUs and network load balancing,
    are of little interest in a VMware virtual machine.


    Because of VMware''s robust virtual machine technology, it is possible to run
    other operating systems, although results are often spotty at best.


    VMware provides experimental, or only partially compatible, support for these
    guest operating systems:


    +   - Novell NetWare 5.x

    +   - Novell NetWare 4.x

    +   - Novell ZENworks client

    +   - IBM OS/2

    +   - IBM OS/2 Warp

    +   - Sun Solaris for Intel 7

    +   - Windows Millennium

    +   - NetBSD 1.x

    +   - OpenBSD 2.x


    VMware does not provide VMware Tools for any of these unsupported operating systems
    and only provides partial installation documentation for some versions of Novell
    and for OS/2 (standard version). VMware has only made a firm commitment to supporting
    Windows Millennium.


    VMware has not flatly stated that it won''t support the other operating systems,
    and seems to be at least open to receiving well-documented incident reports about
    compatibility problems.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Unsupported Guest Operating Systems


    Basically, anything that does not appear on the previous two lists is not a priority
    for VMware and might not work at all. BeOS, QNX, Minix, and commercial UNIX versions
    such as SCO UnixWare fall under this category. Although you are free to experiment,
    be prepared for disappointment.


    # Software Compatibility


    As long as you use a fully supported operating system in VMware, you should get
    a high level of software compatibility. VMware has worked hard to ensure that
    programs designed for Windows, Linux, and FreeBSD run smoothly in a virtual machine.


    Some notable exceptions do apply:


    +   - VMware does not support most DirectX functions in Windows. Most of the time,
    this only affects games, but some other programs rely on DirectDraw, Direct3D,
    and DirectSound functionality and might be impaired or unable to run.

    +   - Software that relies on proprietary or custom hardware does not work in
    VMware. That rules out EPROM programmer boards, diagnostic equipment, or specialty
    networking cards such as the one the DirectPC satellite Internet system uses.

    +   - Software that makes undocumented or extremely unorthodox direct calls to
    PC hardware might not work. Although VMware does its best to provide a 100 percent
    accurate emulation of every conceivable PC system device scenario, some tricks
    and gimmicks are beyond its ability to anticipate or support.


    Don''t be scared off by these isolated limitations. After you''ve settled into
    the virtual machine environment and loaded a few programs, you''ll probably forget
    you have a Linux running in the background.


    # Conclusion


    By now, you should be eager to fire up VMware and subject it to all sorts of stress
    testing with your favorite software. But before you can do that, you need to give
    your Linux PC a careful evaluation: Some systems need a little extra "oomph" before
    they can take on the meaty task of running a virtual machine.


    Chapter 3, "Equipping Your PC for VMware," tells you how to prepare your system
    for VMware and how you might want to expand your computer to make room for company.'
  merge: -1
  img_proc: true
