- pgno: 75
  md: 'If it seems as though I’m trying to get you excited about VMware, it’s because
    I am. If I’m doing the job right, by now you should be yelling, “Less talking!
    More VMware!” I’m sure you have the CD for the first OS you want to install in
    a virtual machine sitting on the desk already.


    But haste makes waste—and, more importantly, could make running VMware a hassle.
    This chapter describes the final piece of the VMware configuration puzzle. Here,
    you will learn the ins and outs of the VMware configuration and launch program,
    and then it’s on to Windows and other guest operating systems!


    # Launching VMware


    This is it. This is what you’ve been waiting for:


    +   1. Log in to Linux as the same user account you used to install VMware.

    +   2. Start XWindows and open a terminal window.

    +   3. At the terminal prompt, enter `/usr/bin/vmware`.

    +   4. VMware opens and then tests your display. This process ensures that your
    X server can support VMware and probes your system for valid screen modes to use
    in virtual machine guest operating systems. It should only take a moment. Soon
    after, you will see the VMware screen, shown in Figure 5.1.

    +   5. VMware detects that you do not yet have any virtual machines configured
    and asks you to run the Configuration Wizard or Configuration Editor, using the
    window shown in Figure 5.2. Although you ultimately want to use the Configuration
    Wizard VMware invites you to run, for now click Cancel to close this window.


    # VMware’s Configuration Menus


    VMware’s launch screen is extremely low-frills; once you’ve made it this far,
    there’s not much to worry about except configuring a virtual machine in VMware’s
    Configuration Wizard. But there are still some important tools and operations
    in the launch screen that you should be aware of.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/b2b6702758c230ce537468351fc8af15_76_0.png)


    Figure 5.1 The VMware welcome screen.


    ![](img/b2b6702758c230ce537468351fc8af15_76_1.png)


    Figure 5.2 If VMware cannot find any virtual machine configurations, you are prompted
    to create one.


    # File Menu


    As in most applications, VMware''s File menu manages the files VMware loads and
    saves, specifically virtual machine configurations:


    +   - New begins a new VMware configuration using the standard VMware Configuration
    Editor. Some VMware features can only be selected in the Configuration Editor.

    +   - Wizard opens the VMware Configuration Wizard, which is generally friendlier
    than the Configuration Editor.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/b2b6702758c230ce537468351fc8af15_77_0.png)


    Although the Configuration Editor is certainly more powerful than the wizard,
    you should use the wizard to do the initial setup for any virtual machine you
    create and then make changes in the editor.


    +   - Open presents you with a dialog box and asks you to select a virtual machine
    configuration file. Each virtual machine configuration should be in its own directory.

    +   - Open Recent presents you with a short list of recently used virtual machine
    configurations.

    +   - Instant Restore is used in conjunction with VMware''s built-in Suspend function.
    Instant Restore awakens the virtual machine you most recently suspended to memory
    or disk.

    +   - Save As allows you to choose a new configuration filename before saving
    it to disk.

    +   - Exit closes the VMware configuration screen (and closes the virtual machine,
    if you left it running).


    ![](img/b2b6702758c230ce537468351fc8af15_77_1.png)


    The Power menu not only gives you the virtual machine''s virtual toggle switch,
    but also offers other convenient virtual power management features:'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - Power On, only available when you are not running a virtual machine,
    boots the currently loaded VMware configuration.

    +   - Power Off takes the place of Power On whenever a virtual machine is running.

    +   - Power Reset reboots the virtual machine.


    > Whenever possible, use the guest operating system''s built-in shutdown sequence
    before selecting Power Off or Power Reset in VMware. Just as on a physical PC,
    you could damage the guest operating system''s data if you don''t.


    +   - Suspend VM is only available when a virtual machine is running. It suspends
    the current virtual machine to disk (default) or memory. It works even in operating
    systems that do not support their own suspend feature, although it can take advantage
    of APM (Advanced Power Management) suspend/restore features as found in most versions
    of Linux and Windows.

    +   - Resume VM becomes active when a virtual machine has been suspended. It attempts
    to restore the suspended virtual machine at the exact point you left off.


    > You can resume a virtual machine saved to disk at any point—even after quitting
    VMware or even rebooting Linux. However, a virtual machine saved to memory is
    lost as soon as you exit VMware.


    +   - Send Ctrl-Alt-Del gives the infamous "three-finger salute" to the guest
    operating system. In most operating systems, this either starts a reset or (in
    Windows) opens the Task Manager.


    > Why is Send Ctrl-Alt-Del a separate menu item? The feature is actually a carryover
    from the Windows NT version, which cannot read Ctrl+Alt+Del from the keyboard
    because of NT''s security system. There may be a Linux benefit as well. Although
    VMware tries to intercept all your keystrokes and send them to the virtual machine
    instead of Linux, you might not want to hammer away at it and risk sending your
    host PC into a reset!


    +   - Grab gives the virtual machine control of your mouse and keyboard. In other
    words, use this when you want to interact with the virtual machine, rather than
    your Linux host OS.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Except for Send Ctrl-Alt-Del, all the features in the Power menu are duplicated
    in the command toolbar near the top of the VMware screen.


    # Settings Menu


    The Settings menu, shown in Figure 5.5, lets you tweak the configuration of both
    the current virtual machine and VMware in general:


    ![](img/b2b6702758c230ce537468351fc8af15_79_0.png)


    Figure 5.5 The VMware Settings menu allows you to adjust VMware''s configuration.


    +   - Configuration Editor opens the VMware Configuration Editor for advanced
    adjustment of a virtual machine profile created in the Configuration Wizard.

    +   - Show All Hints toggles VMware''s pop-up hints on and off. Leave them on
    while you familiarize yourself with the software.

    +   - Grab On Key Press is a checkmark-style item. When checked, it indicates
    that you want the virtual machine to take control of your mouse and keyboard when
    you press a key while the mouse pointer is within the virtual machine''s video
    display window.

    +   - Grab On Mouse Click is another checkmark entry. When checked, it indicates
    that you want the virtual machine to take control of your mouse and keyboard when
    you click inside the virtual machine''s video display window.


    If Grab On Key Press and Grab On Mouse Click are both off, the Grab button and
    Grab item in the Power menu are the only ways to gain control of the virtual machine.


    +   - Host Reserved Memory, pictured in Figure 5.6, lets you allocate the total
    amount of memory available to all virtual machines. Individual virtual machine
    RAM allocation is handled in the Configuration Editor, but this window determines
    the maximum total RAM any number of virtual machines can use. You can usually
    leave the default settings alone. (VMware recommends a safe value, although you
    can decrease it if you like; increasing it is not recommended.)


    Grab: When VMware takes control of your mouse and keyboard. Until you release
    control through a special keystroke (Ctrl+Alt+Esc by default), any typing or mouse
    movement is reported to the virtual machine instead of Linux.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/b2b6702758c230ce537468351fc8af15_80_0.png)


    Figure 5.6 VMware''s global memory configuration window.


    +   - VMware Tools Install mounts a special virtual floppy disk in the virtual
    machine''s emulated floppy drive so that you can install VMware Tools on your
    guest operating system. More detail on VMware Tools is coming in the next chapter,
    but suffice it to say that you absolutely want to install them as soon as possible
    in any virtual machine.


    # Devices Menu


    The contents of the Devices menu (see Figure 5.7) change depending on how many
    virtual disks you attach to VMware. There should always be an entry for the virtual
    machine''s RTC (Real Time Clock), as well as a list of every storage device (real
    or virtual) you have connected to the virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_80_1.png)


    Figure 5.7 You can disconnect or change the storage devices you have connected
    to a virtual machine on-the-fly.


    The storage devices have two options: Disconnect and Disconnect and Edit. Disconnect
    makes the device temporarily invisible to VMware, and Disconnect and Edit also
    immediately brings up the Configuration Editor so that you may change the device
    you want to connect to VMware. After you have made changes in the Configuration
    Editor, the Disconnect command changes to Connect, and you can re-attach the drive
    to VMware.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/b2b6702758c230ce537468351fc8af15_81_0.png)


    In some configurations of the Linux host operating system, changing CD-ROMs might
    not work properly. If this happens, disconnect and then reconnect the CD-ROM device
    using this menu.


    The RTC entry has only Disconnect. There is no reason why you should need to disconnect
    the RTC in normal operation; this option is mostly a debugging tool.


    ![](img/b2b6702758c230ce537468351fc8af15_81_1.png)


    If the RTC is disconnected or otherwise unavailable to a Windows 98 guest, it
    may not be able to keep time properly in that virtual machine. The Sync Time option
    in VMware Tools can fix this problem.


    # View Menu


    Figure 5.8''s View menu controls how VMware uses the screen:


    ![](img/b2b6702758c230ce537468351fc8af15_81_2.png)


    Figure 5.8


    +   - Full Screen is how you probably want to use your virtual machine most of
    the time. After VMware is fully configured with the special guest OS video driver,
    video performance is far faster when VMware can control the entire screen, rather
    than use a window on your desktop.


    ![](img/b2b6702758c230ce537468351fc8af15_81_3.png)


    Most of the virtual machine screenshots in this book show VMware running in windowed
    mode on the desktop rather than on its own full screen. Yet here I tell you to
    use full-screen mode whenever possible. Why is that? If they were pictures of
    the full screen, you wouldn''t be able to tell the difference, and you might think
    I cheated and simply took screenshots of the OS running directly on a PC. Do as
    I say, not as I do.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - Fit is used when VMware is displayed in a window on your Linux desktop.
    It snaps the virtual machine window to be large enough to display the entire virtual
    machine screen at once. If you resize the window to be too small, scroll bars
    appear so you can pan across the guest OS screen.

    +   - Autofit tells VMware to always keep the virtual machine window large enough
    to show the entire guest OS screen, even if the guest OS changes its size. Unless
    you have low desktop resolution or a good reason to turn this off, you should
    keep this on whenever using VMware on the desktop.

    +   - Toolbar toggles on and off the list of buttons (Power On, Reset, and so
    on).

    +   - Status Bar toggles on and off the information at the bottom of the VMware
    screen. The status bar, shown in Figure 5.9, includes virtual LEDs to show when
    the virtual machine accesses a disk or its emulated Ethernet card.

    +   - Icons replaces the text toolbar buttons with small icons.


    ![](img/b2b6702758c230ce537468351fc8af15_82_0.png)


    > Figure 5.9 VMware windows have a status bar to indicate disk and network access
    by the virtual machine.


    # Help Menu


    Last but not least, here''s where you turn if this book can''t answer your questions:


    +   - Help invokes your default HTML browser and loads the included VMware help
    file, which mostly addresses configuration and interaction issues rather than
    troubleshooting and tips.

    +   - Product Information is essentially a bookmark to VMware''s main product
    description site. This requires a live Internet connection.

    +   - Technical Support is a bookmark to VMware''s technical support Web site.
    This, too, requires that you be online.

    +   - About VMware shows you the current version and build number of your VMware
    software, as well as your license key details.


    # Using the Configuration Wizard


    Creating a new virtual machine profile in the standard Configuration Editor can
    be a little overwhelming for someone completely new to virtual machines and emulators
    in general and VMware in particular. For a number of virtual machines, the wizard'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# # Chapter 5: Running VMware for the First Time\n\nAll you need to get a usable\
    \ configuration, and it's much easier to adjust a few settings later than build\
    \ them all from scratch.\n\nFor this example, I demonstrate setting up a Windows\
    \ 98 guest operating system session. The procedure is virtually identical for\
    \ any guest OS.\n\n> > If you are skipping around in this book and have not yet\
    \ read about VMware resource requirements in Chapter 3, \"Equipping Your PC for\
    \ VMware,\" now is an excellent time to do so.\n\n+   1. Start the VMware Configuration\
    \ Wizard by clicking on the File menu and then selecting Wizard. The welcome screen\
    \ appears, and is shown in Figure 5.10.\n+   \n+   2. Click Next to advance to\
    \ the guest OS selection screen.\n+   \n+   3. All of VMware's fully supported\
    \ operating systems are listed, including an option for Other if you want to experiment.\
    \ For this demonstration, choose Windows 98 from the Guest Operating System screen\
    \ pictured in Figure 5.11, and click Next to continue.\n+   \n+   4. On the screen\
    \ shown in Figure 5.12, VMware asks where you want to store configuration files\
    \ related to this virtual machine. By default, VMware creates a directory named\
    \ after the guest OS off of a vmware branch in your home directory, in this case\
    \ '/home/[yourname]/vmware/win98/. If you decide to relocate it, don't forget\
    \ your selection. Click Next when you are ready to proceed.'\n\n![](img/b2b6702758c230ce537468351fc8af15_83_0.png)"
