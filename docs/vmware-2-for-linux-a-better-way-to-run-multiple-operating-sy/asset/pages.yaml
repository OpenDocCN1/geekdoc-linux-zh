    # Running Macintosh Programs in Executor


    When you run Executor, you should briefly see a graphical splash screen, followed
    by an About box containing information about the demo version and ordering information,
    as shown in Figure 17.4.


    Executor can see your Linux file system without any network trickery or user intervention.
    Indeed, as part of the installation process, ARDI creates a new directory at /home/executor
    and fills it with sample Mac programs that work well in the emulator. See Figure
    17.5 for an example.


    You can use the Browser to install or copy new Macintosh programs to your Linux
    hard drive (in the special /home/executor directory, if you want to keep things
    organized).'
