- pgno: 194
  md: '5. Notice that, without any intervention from you or special configuration
    in VMware, Corel Linux’s graphical installer loads without incident. If the mouse
    isn’t working, check your configuration.


    > Graphical installers are nice, but because you can’t run VMware Tools yet, the
    video performance will be very, very slow. For distributions of Linux that give
    you a choice, you might prefer the text-based install.


    > Corel Linux and other, newer Linux distributions should automatically detect
    any virtual Ethernet adapters you have configured, but for older distributions,
    such as OpenLinux 1.3 and Red Hat 5.x, you might need to manually select the AMD
    PC/Net 32 or PCI NE2100 driver.


    6. After some loading, a license agreement appears (see Figure 10.8). Read it
    and click Accept.


    7. Corel Linux prompts you for a username. Choose one (you might want to use the
    same name you regularly use on your host OS) and click Next.


    8. You need to decide how elaborate you want your installation to be. Select Show
    advanced install options and click Next. Corel offers a standard Desktop Plus
    installation mode, a bare-bones Desktop, a Server mode, or a Custom mode where
    you can select individual packages. Choose Desktop Plus mode if you’re unsure.
    This screen can be seen in Figure 10.9. Click Next after making your decision.


    ![](img/b2b6702758c230ce537468351fc8af15_194_0.png)


    ![](img/b2b6702758c230ce537468351fc8af15_194_1.png)


    ![](img/b2b6702758c230ce537468351fc8af15_194_2.png)'
