- pgno: 269
  md: 'You’ve seen how VMware performs hosting two of the most popular desktop and
    server operating-system families: Windows and Linux.


    Windows is a logical guest OS choice simply because of its near-universal acceptance
    and importance in day-to-day personal and professional computing. And how can
    you argue with Linux? It’s the fastest-growing server operating system, it is
    gaining momentum on the desktop, and after all, it would look unusual at best
    if a virtual machine environment couldn’t even replicate its own host!


    VMware didn’t stop there, even though that would have satisfied the needs of most
    users. VMware also fully supports the FreeBSD operating system—and remember, “fully
    supported” means a VMware Tools package makes the virtual machine experience so
    much more pleasant.


    # Exploring the “Other” UNIX Alternative


    Linux gets great press for a number of things, including being a zero-cost drop-in
    replacement for many of the programs and tasks normally reserved for expensive
    UNIX systems. But the truth is that until fairly recently, the UNIX-alike operating
    system FreeBSD (earlier NetBSD) was ahead of Linux in features, functionality,
    and stability.


    FreeBSD is derived from a different source tree but is similar to Linux in that
    it is an open-source operating system based around classical UNIX principles,
    with an eye toward establishing itself in all sectors of the computing market.


    Discussions about Linux versus FreeBSD can get just as impassioned as any other
    operating-system evangelism. It is often contended, for example, that FreeBSD’s
    TCP/IP networking is more robust than Linux’s. Many developers prefer the looser
    terms of the Berkeley open-source license that governs FreeBSD. The General Public
    License (GPL), which applies to the Linux kernel and many of its most important
    components, requires companies and developers to disclose information many consider
    vitally proprietary.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Undeniably, Linux has enjoyed much more of the spotlight than FreeBSD in recent
    years, but FreeBSD users benefit from their own ongoing development, including
    a Linux compatibility layer that can make the decision between operating systems
    largely a matter of taste. In general, over the past few years, what has been
    good for UNIX, Linux, or FreeBSD individually has been good for all three as a
    group.


    # Preparing the Installation


    If you are unfamiliar with FreeBSD, it might be best to go through a VMware installation
    with an OS you are more comfortable with. Even just a trial run using your current
    Linux CD is a fine way to get your feet wet.


    The installation process is not much different from a typical Linux install.


    # Running the Configuration Wizard


    +   1. If you''re not already in VMware, start the main program by typing /usr/bin/vmware
    at a command prompt.

    +   2. Launch the VMware Configuration Wizard by clicking Wizard in the File menu.

    +   3. Click Next to clear the first greeting screen.

    +   4. Select FreeBSD from the list of guest operating system choices shown in
    Figure 13.1, and then click Next to proceed.

    +   5. VMware prompts you to enter the directory that will house the VMware configuration
    files as well as the virtual disk. By default, VMware asks to create a new directory
    called /vmware/freebsd off your home directory.


    ![](img/b2b6702758c230ce537468351fc8af15_270_0.png)'
  merge: -1
  img_proc: true
- pgno: 271
  md: '6. VMware now asks whether you want to create a new virtual disk or use an
    existing physical disk. The default option is to use a new virtual disk, which
    you should accept unless you have familiarized yourself with the concepts of raw
    and plain disks in Appendix A, “Advanced VMware Configuration.” Click Next.


    7. Enter the size, in megabytes, for the virtual disk when asked by the window
    shown in Figure 13.2. (2,000 is the default.) Keep in mind that virtual disks
    grow as you add data, but once created, the maximum size is fixed. Click Next
    to proceed.


    8. VMware should detect your CD-ROM at this stage. Leave the default settings
    alone, and click Next to continue.


    9. VMware now asks the same question about floppy access. Unless you have a compelling
    reason to disable the floppy, leave this setting alone as well. Click Next.


    > Contemporary CD-ROM distributions of FreeBSD are bootable, so you do not need
    a boot floppy. Still, if you have a floppy drive available, it’s safest to let
    VMware use it.


    10. You can configure the virtual machine for networking on this step, shown in
    Figure 13.3. No networking keeps the FreeBSD VM isolated. Bridged networking configures
    a virtual Ethernet card that can communicate with your LAN and the outside world,
    and Host-only networking enables file sharing and communication between your virtual
    machine, the host PC, and any other virtual machines with host-only networking
    enabled. If you plan to use host-only networking, it is best to let VMware install
    its own Samba and DHCP server (as advised in Chapter 4, “Installing VMware for
    Linux”). If you have a LAN, use Bridged for now. If you do not, use Host-only
    or None. Click Next to reach the final step.


    ![](img/b2b6702758c230ce537468351fc8af15_271_0.png)


    Figure 13.2'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/b2b6702758c230ce537468351fc8af15_272_0.png)


    Figure 13.3 Toggle at least one form of networking on so that the virtual machine
    can communicate with your host PC and/or the outside world.


    > Convincing Linux and FreeBSD computers to talk via Samba can be done, but there
    are other, better alternatives. If you only need a virtual link between the host
    and the guest, you can still use host-only for network communication other than
    Samba.


    11. The wizard summarizes the virtual machine you just specified. A sample is
    shown in Figure 13.4. If everything looks appropriate, click Done.


    ![](img/b2b6702758c230ce537468351fc8af15_272_1.png)


    Figure 13.4 Your summary should resemble this listing.'
