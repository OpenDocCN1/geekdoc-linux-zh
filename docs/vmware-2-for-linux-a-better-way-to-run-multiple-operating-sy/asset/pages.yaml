- pgno: 157
  md: 'VMware Tools is a small application that runs inside a virtual machine on the
    guest operating system—in this case, on Windows 95 and above. Running VMware Tools
    is technically optional but highly recommended, and in fact there is no good reason
    not to run it.


    In essence, the tools are a "glue layer" that ties the virtual machine to your
    Linux PC more closely, giving you better performance and making it easier to switch
    between the virtual machine window and the Linux side of your computer. It''s
    not an exaggeration to say that the tools make the difference between a tolerable
    and an excellent VMware experience. VMware only provides VMware Tools for the
    operating systems it explicitly supports; without it, you have less external control
    over how the virtual machine works, and your graphics performance will suffer.


    You should have installed the tools after ensuring that your Windows virtual machine
    was running properly. After the installation, VMware Tools and the accompanying
    high-resolution video driver automatically load every time you start your Windows
    virtual machine.


    > In this chapter, I demonstrate the use of VMware Tools in Windows 98. The differences
    in Windows 95, NT 4, and 2000 are negligible.


    # Accessing the VMware Toolbox


    VMware Tools creates a small icon in the Windows system tray that looks like a
    hammer and screwdriver. See Figure 8.1 for an illustration.


    Figure 8.1 The hammer and screwdriver icon is the shortcut to VMware Tools.


    There are two ways to open the main VMware Tools window (shown in Figure 8.2):


    +   - Double-click the VMware Tools icon in the system tray.

    +   - Right-click the VMware Tools icon in the system tray and then select Main
    window.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/b2b6702758c230ce537468351fc8af15_158_0.png)


    Figure 8.2


    The VMware Tools window will appear. Even at low resolution (640x480), it''s small
    enough to fit on the screen all at once, so if your desktop is cramped, not to
    worry.


    VMware Tools has three major headings: Options, Devices, and Shrink. Options focuses
    mainly on mouse and keyboard settings, Devices provides a convenient way to detach
    and re-attach Linux system devices from the virtual machine, and Shrink helps
    you manage your virtual disks.


    # Using the Toolbox Options


    You can run as many virtual machines as you have memory and disk space for, but
    you probably only have one keyboard and mouse. Managing when and how the virtual
    machine takes control of your input devices (known as input focus) pays off quickly
    in helping you to avoid all kinds of frustration.


    Not all the options on the screen in Figure 8.3 are duplicated anywhere else in
    VMware. (See, I told you running the Tools is important!)


    ![](img/b2b6702758c230ce537468351fc8af15_158_1.png)


    Figure 8.3 The VMware Tools window.


    BUZZWORD

    Input focus:

    Determines whether a virtual machine or the host Linux OS captures mouse and keyboard
    input. When you type into a VMware-hosted OS and application, VMware is said to
    have input focus.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The default settings are actually quite nice, and appropriate for most users,
    but you might want to customize the settings, so it''s a good idea to understand
    just what your choices are.


    Changing the settings is as simple as clicking the checkmark box. You don''t have
    to reboot, apply, or even close the VMware Tools window for changes to take effect;
    they work immediately.


    # Release Input Focus


    The first option is one half of what is, in my opinion, the neatest feature of
    VMware Tools. When the option Release input focus is enabled and you move the
    virtual machine''s mouse pointer past the edge of the virtual desktop, the pointer
    is "given back" to Linux. In other words, input focus returns to Linux as soon
    as it looks like you want to use the mouse in Linux. You don''t even have to click
    the Linux desktop first.


    This feature is useful when you have VMware in a window and need to move between
    Linux and VMware quickly or often, and you don''t want to get bogged down using
    the Ctrl+Alt+Esc key combination to release input focus from VMware. It can get
    frustrating if you''re doing precision work in an art program near the borders
    of the screen or playing a game using the mouse.


    This feature does nothing when the virtual machine is in full-screen mode; the
    virtual machine maintains input focus at all times until you press Ctrl+Alt+Esc.


    # Capture Input Focus


    Capture input focus is the match to Release input focus. When this option is turned
    on, VMware automatically grabs input focus as soon as you scroll the pointer inside
    the VMware window.


    > It''s only sensible to turn on Release input focus if this is active, because
    it''s fairly inconvenient to use the Ctrl+Alt+Esc key combination to get the input
    focus back on Linux if your pointer accidentally strays into a VMware desktop.


    This feature does nothing when the virtual machine is in full-screen mode because
    the mouse is always within the virtual machine until you exit full-screen mode
    by pressing Ctrl+Alt+Esc.


    ![](img/b2b6702758c230ce537468351fc8af15_159_0.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Scroll When Mouse Nears Edge


    You only need to worry about the feature Scroll when mouse nears edge if you have
    a situation where your virtual machine''s desktop is larger than the VMware window
    on your Linux desktop. This could happen if you temporarily make the VMware window
    smaller or if you are using a virtual machine desktop larger than your computer
    can display (a 1,280x1,024 Windows desktop on a Linux PC whose desktop is only
    800x600, for example).


    > If you want to be able to change the size of the VMware window on-the-fly, you
    need to disable Autofit under View on the VMware window settings. Note that this
    does not affect the size of the Windows desktop itself, just how much you can
    see at once!


    In Figure 8.4, you see a Windows desktop that cannot be fully displayed because
    the VMware window is too small. With the Scrolling option enabled, VMware automatically
    pans across the desktop when the mouse nears the edge of the screen. Otherwise,
    you would need to restore input focus to Linux and drag the window scrollbars
    to change the visible area of the desktop.


    ![](img/b2b6702758c230ce537468351fc8af15_160_0.png)


    Figure 8.4 Using the Scroll when mouse nears edge feature of VMware Tools, you
    can pan through a large Windows desktop in a smaller VMware window.


    # Hide Cursor


    The option Hide cursor is nothing more than a glorified "mouse blanker," but it
    can help avoid the confusion of seeing two mouse pointers on the same screen.
    When enabled, the mouse pointer in the Windows virtual machine disappears if the
    input focus is on Linux rather than VMware.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '> If you turn off this option, the Windows pointer remains visible wherever
    it was when you changed the input focus back to Linux. If you turn away from the
    screen and then turn back, you might get confused about which is the active mouse
    pointer until you actually start moving the mouse.


    # Bring the Virtual Machine to Top


    The option Bring the virtual machine to top is turned off by default. When on,
    it immediately brings the VMware window to the foreground whenever VMware is given
    the input focus. You might want to turn this on if you have a cluttered desktop
    and it might be difficult to move the VMware window to the top yourself.


    However, if this option is on along with Capture input focus, it means that whenever
    your mouse pointer strays into the VMware window, it leaps to the foreground,
    which might be annoying, at best, when you are working on other projects in Linux.


    > Keep experimenting with mix-and-match combinations of these cursor options until
    you have the settings that best fit the way you use VMware and your host PC.


    # Allow Copy and Paste


    By default, VMware Tools allows you to share a clipboard between Linux and your
    virtual machine, which, in theory, allows you to cut and paste seamlessly across
    applications, regardless of operating system. Some applications do not read the
    clipboard in the expected manner, and text cut and paste generally works better
    than graphical cut and paste. Test the shared clipboard performance before you
    start making drastic changes to documents.


    You might want to turn off the option Allow copy and paste if you have security
    concerns on the host computer and you don’t want to encourage the flow of information
    across the boundary between the host OS and the virtual machine. Or you might
    simply want to keep the two clipboards separate because the projects you are working
    on in Linux and in the Windows virtual machine are different and need access to
    their own, private clipboards.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Time Synchronization


    The time-synchronization option really deserves an "expert mode" flag. Unless
    you notice that the virtual machine''s clock is consistently losing time, you
    should never need this function. Normally, the virtual machine should do a perfectly
    adequate job of telling time.


    When the option is activated, the virtual machine compares its own clock against
    the host OS clock every second and "catches up" as needed. This problem is most
    likely to occur if you run multiple Windows virtual machines.


    > Because this feature turns on a frequent system check, it can impact the performance
    of your virtual machine. If your virtual machine has a timekeeping problem, try
    not to use this option unless it''s absolutely necessary.


    # Managing Virtual Devices


    To get the virtual machine operating system installed, you probably had to learn
    a little bit about disconnecting and attaching virtual devices to mount and change
    CD-ROMs. You can always do this through the Devices menu on the VMware window,
    but VMware Tools provides more convenient access.


    By using the device settings in VMware Tools, you eliminate the need to switch
    input focus to Linux or exit full-screen mode.


    There are two, equally effective ways to control virtual devices from inside a
    Windows virtual machine using the window shown in Figure 8.5:


    +   - Double-click the VMware Tools icon in the system tray and then select the
    Devices tab.

    +   - Right-click the VMware Tools icon in the system tray and then highlight
    the Devices option in the pop-up menu, shown in Figure 8.6.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/b2b6702758c230ce537468351fc8af15_163_0.png)


    Figure 8.5 The Devices tab makes it easy to detach and reattach peripherals from
    the virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_163_1.png)


    Figure 8.6 Devices can also be toggled from a right-click pop-up menu.


    +   - Floppy drives, normally starting at floppy0. In most cases, you can leave
    the floppy attached to VMware at all times, but if for some reason you want to
    make sure the virtual machine cannot see the floppy drive (to protect against
    accidental writing or deleting, for example), turn off the floppy by clicking
    on the box or item name.


    +   - IDE or SCSI-connected CD-ROMs. As I''ve mentioned before, you might need
    to temporarily disconnect a CD-ROM drive from the virtual machine to eject and
    change discs. If this happens, just click the entry to disconnect the drive, make
    the disc change, and then reconnect the drive by clicking again.


    ![](img/b2b6702758c230ce537468351fc8af15_163_2.png)


    > This is one case where the Devices menu on the VMware window can be more helpful
    than using VMware Tools. If you have multiple CD-ROMs attached but don''t know
    which is which, based on their IDE or SCSI addresses, use the Devices menu. That
    lists their Linux paths (such as /dev/cdrom) as well as their IDE/SCSI addresses.
    If you plan to keep your VMware configuration fairly consistent, you might want
    to write down which CD-ROM drive is attached to which address on the device chain.


    +   - Sound. VMware ties in your system master volume with the virtual machine''s
    master volume, so you shouldn''t have to use this as a muting feature unless you
    want to silence the virtual machine but leave the Linux PC free to play'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'audio. Because the virtual machine audio can prove resource-intensive, cutting
    off VMware''s access to sound can help you speed through a system slowdown due
    to audio playing. Or a picky Linux program might complain about another program
    occupying audio resources. In any event, clicking the Sound item silences VMware.


    > If you get an error message that reads "The PCM sound device is not available
    (/dev/dsp: Device or resource busy)", your system may be using the Enlightenment
    Sound Daemon. You can try to correct the problem by using the command esdsp vmware
    to launch the virtual machine, instead of the standard vmware.


    # Managing Virtual Disks


    Remember: Virtual disks are great because even though they can have the potential
    to store up to 2GB of data, they only take up as much space on your Linux PC''s
    hard drive as you put into them.


    That''s only part of the story, however. Although it''s true that the virtual
    disks grow as more data is added to them, they don''t get smaller as you take
    data away. If you filled your virtual disk to bursting and then deleted 90 percent
    of its contents, you would wind up with a virtual disk that takes up the full
    2GB even though only a few files are actually stored there.


    VMware Tools can help you reclaim space on your hard drive. The process is not
    dissimilar to disk defragmentation, which sorts and re-orders the data on a disk,
    eliminating wasteful zones where deleted material lives.


    The VMware shrink process not only sorts the data, but also it reduces the size
    of the virtual disk file by cutting out unused space.


    > Virtual disks can also be defragmented inside the virtual machine. This can
    give you a modest performance boost if the disk has become cluttered, but it does
    not shrink the physical size of the disk on your host hard drive.


    # Prepare for Shrinking


    For shrinking to work and be any real benefit, your host and virtual machine need
    to meet certain requirements:'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - The host Linux OS needs free disk space equal to the current size of
    the virtual disk you want to shrink. Ironic, isn’t it? After all, you’ll probably
    start thinking about shrinking your virtual disks when your Linux PC starts to
    run out of room. But unfortunately, the shrink process needs a buffer as big as
    the virtual disk it will optimize to work. Prevention is the best medicine, after
    all.

    +   - The virtual machine cannot have any raw or plain disks connected to it when
    you start the shrink process. Trying to shrink a raw or plain disk would have
    undesirable results (because they don’t work like virtual disks), so VMware decided
    that discretion was the better part of valor and it will not let you access the
    Shrink command if you have raw or plain disks attached to your virtual machine.
    You can always temporarily remove them from the VMware configuration, boot up
    just to shrink the disk, and then re-attach them when the shrink process is complete.

    +   - The virtual disk needs to be in persistent mode. There is no point to shrinking
    a nonpersistent or undoable disk, so VMware doesn’t let you.

    +   - Shrinking a virtual disk that is very full, or has never been very full,
    is not beneficial. If the virtual disk truly is full, there’s nothing VMware can
    do: Shrinking is not a disk-compression routine. And if the virtual disk has never
    contained much data, there is little dead space to eliminate. Ideally, you should
    shrink disks after you have deleted a large number of files.


    # Shrinking Virtual Disks


    Shrinking virtual disks is a two-stage process. The first stage takes place inside
    the Windows virtual machine, when you select which drive you want to shrink and
    VMware Tools does some preparation work. Then, VMware itself takes over, temporarily
    freezing the virtual machine while the shrinking operation takes place.


    Assuming your setup is in line with the guidelines listed earlier, you are ready
    to begin:


    +   1. Double-click the VMware Tools icon in the system tray.

    +   2. Click the Shrink tab, shown in Figure 8.7.

    +   3. VMware automatically lists the disks it can shrink. On a typical VMware
    setup (with one virtual disk, one floppy, and one CD-ROM drive), the virtual disk
    C:, appears in the supported list, and floppy drive A: and CD-ROM drive D: show
    up in the Unsupported Partitions tab (see Figure 8.8).

    +   4. Put a checkmark next to the supported drive you want to shrink. (If there
    is only one, it is selected by default.)

    +   5. Click Prepare to shrink. VMware Tools works on the drive for a while—if
    you have a particularly sluggish or overloaded machine, or the virtual disk is
    particularly cluttered, the shrinking procedure may take the better part of an
    hour. A progress bar, shown in Figure 8.9, will keep you informed.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/b2b6702758c230ce537468351fc8af15_166_0.png)


    Figure 0.7 The shrink feature can only be started from the VMware Tools window
    inside the virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_166_1.png)


    Figure 0.8 You cannot shrink floppies, CD-ROM drives, plain disks, or raw disks.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/b2b6702758c230ce537468351fc8af15_167_0.png)


    Figure 8.9


    6. VMware Tools asks whether you want to commit to shrinking the disk now. (Remember,
    it can take some time.) Answer Yes when the window in Figure 8.10 appears.


    ![](img/b2b6702758c230ce537468351fc8af15_167_1.png)


    Figure 8.10 Shrinking can take quite some time, so only commit if you are certain.


    7. The virtual machine freezes while the VMware main application takes over the
    process. A status bar (see Figure 8.11—notice that this status window comes from
    Linux, not from Windows) updates you on the shrinking status.


    > Although you can run other applications while VMware shrinks a virtual disk,
    it is wise not to do anything that might make the system unstable. Also, avoid
    heavy disk access; VMware needs the buffer space, and hitting the hard drive just
    makes the VMware shrinking take longer.


    ![](img/b2b6702758c230ce537468351fc8af15_167_2.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/b2b6702758c230ce537468351fc8af15_168_0.png)


    Figure 8.11


    8. After analyzing the disk, VMware offers a guess about how much space it can
    save by finishing the process. An example is shown in Figure 8.12. Click Yes to
    continue.


    9. VMware swaps the old virtual disk data to a temporary file and then sets to
    work on optimizing the disk. When complete, the virtual machine resumes and runs
    normally. You don''t even need to restart Windows.


    ![](img/b2b6702758c230ce537468351fc8af15_168_1.png)


    Figure 8.12 Sometimes the savings from a disk shrink are modest.


    # Conclusion


    On the surface, VMware Tools looks like the icing on the cake. But it''s actually
    quite powerful. Spending just a few minutes configuring the input focus options
    to your liking makes life with VMware much easier, and some important features
    are only available through the toolkit.'
  merge: -1
  img_proc: true
