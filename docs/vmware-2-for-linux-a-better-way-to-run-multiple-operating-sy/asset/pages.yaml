- pgno: 435
  md: '# Run multiple operating systems on one computer!


    With VMware® installed on a Linux® computer, running Windows® programs is a snap.
    As a Linux enthusiast, you can run Windows applications side by side with Linux
    programs and avoid the inconvenience and inefficiency of "dual booting." VMware
    breaks through the "one computer, one operating system" barrier and allows your
    Linux PC to simultaneously run two or more operating systems inside a window.
    This book guides you through the installation process and demonstrates in a straightforward
    manner how to configure the software to best suit your needs. Providing valuable
    tips and tricks for maximizing the power of this revolutionary software, this
    book is sure to be close at hand for any VMware user.


    Jason Compton is a contributing editor for Linux Magazine. He is also a regular
    contributor to the Chicago Tribune, Smart Business, and CRM Magazine.


    # Learn Faster


    +   - Includes information on equipping your PC for VMware

    +   - Features step-by-step instructions on installing VMware on your computer

    +   - Contains detailed explanations on how to set up guest operating systems
    like Windows 95/98/2000, Windows NT 4, and FreeBSD in VMware


    # Learn More


    +   - Provides tips and tricks on how to most efficiently maneuver around VMware

    +   - Figure out how to run and play your favorite games with VMware

    +   - Explore advanced configuration options that help maximize your computer''s
    functionality with VMware


    # What''s on the CD


    +   - A trial version of VMware 2.0 for Linux

    +   - Ready to Run versions of Turbolinux and SuSE Linux

    +   - Virtual network drivers

    +   - Basilisk II, a Mac Emulator

    +   - UAE, an Amiga Emulator

    +   - Dragon FTP Server software

    +   - Wine, an open source Windows API simulator


