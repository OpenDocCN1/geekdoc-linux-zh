    # Conclusion


    The decision to run Linux or Windows is largely one of software. Until emulators
    came along, PC users were barred both by software and by hardware from running
    Macintosh applications. Through ARDI Executor or Basilisk II, you can sidestep
    the hardware barriers and add an entirely new range of software to your library
    without adding a new Macintosh to your desk.


    The next chapter explores other, non-x86 computers you might want to emulate in
    Linux or through a Windows virtual machine.'
  merge: -1
  img_proc: true
