    ![](img/b2b6702758c230ce537468351fc8af15_265_1.png)


    Figure 12.24 IIS lists all available network services.


    +   4. Right-click Default FTP Site and click Properties.


    +   5. Click the Home Directory tab, and change the local path to point at the
    root of the directory structure you want to share via FTP (probably C:\).


    +   6. You should enable Write if you want to be able to upload files to the Windows
    2000 server using an FTP client on the Linux host or another virtual machine.
    You might also want to switch the directory listing to UNIX-style for consistency
