    adapter configuration icons.


    ![](img/b2b6702758c230ce537468351fc8af15_263_1.png)


    Figure 12.21 The Properties screen for a VMware network adapter.


    Select Internet Protocol (TCP/IP) and click Properties. A new screen, shown in
    Figure 12.22, will appear.


    This should be more familiar. Enter the IP, gateway, and DNS information for your
    LAN (consult your network admin if necessary), and then commit to the changes.
    Couldn''t be easier.


    After that, it''s off to the races. Remember that although you don''t have access
    to the DirectX capabilities of Windows 2000, most of the software currently compatible
    with Windows 2000 doesn''t take advantage of the DirectX API.


    > You can use VMware and Windows 2000 as a controlled environment to test the
    compatibility of Windows 95/98 and NT applications in the new operating system
    without risking down time or corruption for your regular desktop machines.'
