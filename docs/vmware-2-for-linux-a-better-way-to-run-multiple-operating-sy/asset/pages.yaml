- pgno: 289
  md: 'So the challenge of running different distributions of Linux and the latest
    version of Windows without rebooting has become stale and boring? For a real stretch,
    what about...DOS?


    It''s true; there are other ways to run DOS programs on Linux, including the well-respected
    DOSEMU. But many of the same commercial, time-saving elements that make configuring
    Linux and Windows virtual machines a snap translate to an MS-DOS (or clone) environment
    as well.


    # DOS Survives, After All These Years


    It''s been quite some time since the computing world held its breath over the
    latest incremental release of MS-DOS or thrilled to the cutthroat competition
    between Microsoft, Digital Research, and IBM for dominance in the text-based operating
    system market.


    Of course, one of Microsoft''s worst-kept secrets is that MS-DOS never really
    went away; it is the core of Windows 95 and 98 and will be the core of Windows
    Millennium Edition as well. Although most programs are designed these days to
    take advantage of the Windows "graphical shell," the world is not so removed from
    DOS as it might seem. I''d say that the sheer volume of software from the DOS
    heyday is enough reason to set up a little virtual museum on your Linux PC. If
    that''s not enough, I''ll point out that some of the software was actually quite
    good.


    Because there are some disappointments in VMware''s DOS support (not all of which
    are VMware''s fault), I recommend you familiarize yourself with VMware by first
    installing and using a Windows or Linux virtual machine.


    # Preparing the Virtual Machine


    The requirements for an MS-DOS virtual machine are quite straightforward, but
    it''s still a good idea to use the Configuration Wizard.


    # Starting with the Wizard


    Since there aren''t many wizards in the world of DOS software, enjoy them while
    you can.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '+   1. If you''re not already in VMware, start the main program by typing /usr/bin/vmware
    at a command prompt.

    +   2. Launch the VMware Configuration Wizard by clicking Wizard in the File menu.

    +   3. Click Next to clear the first greeting screen.

    +   4. Highlight MS-DOS from the list of guest operating system choices, and then
    click Next to proceed.

    +   5. Enter a path to the new directory that will house the VMware configuration
    files as well as the virtual disk. By default, VMware asks to create a new directory
    called /vmware/dos in the current user''s home directory.

    +   6. VMware now asks whether you want to create a new virtual disk or use an
    existing physical disk. Click Next.


    > You would be extremely hard-pressed to fill up more than 2GB with DOS programs,
    so it''s probably best to stick with virtual disks.


    +   7. Enter a size for the new virtual disk. Although 2,000MB is the default,
    you can go as high as 2,047MB. Remember that the disk grows as data is added,
    but you cannot change its maximum size later. Click Next to proceed.


    > Remember that DOS itself is very small, as are most DOS utilities and games.
    You might be able to get by with just a few hundred megabytes, as shown in Figure
    14.1.


    ![](img/b2b6702758c230ce537468351fc8af15_290_0.png)


    Figure 14.1 DOS virtual machines do not always need huge virtual disks.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '8. VMware should detect your CD-ROM. Leave the default settings as is (to enable
    CD-ROM access and make it available when the virtual machine boots), and click
    Next.


    9. VMware now asks about floppy access. Unless you have a compelling reason to
    disable the floppy, leave this setting alone as well. Click Next.


    10. The wizard asks how the virtual machine should be able to access the network.
    Because of certain limitations of networking in DOS, not all of the usual guidelines
    apply. If you want to try file sharing between the host and guest, use host-only
    networking. If you have a LAN, a DOS machine can participate in some fashion,
    so enable bridged networking. Attempting to use both can prove difficult and is
    not covered here.


    > Networking from DOS is substantially more difficult than from any other operating
    system, because unlike Windows 95 and beyond, Linux, and FreeBSD, it was not really
    designed for networked environments. This chapter covers some of the basics and
    refers you to other, more definitive sources for networking in DOS.


    11. The wizard summarizes the virtual machine it will create. An example is shown
    in Figure 14.2. If everything looks appropriate, click Done.


    ![](img/b2b6702758c230ce537468351fc8af15_291_0.png)


    Figure 14.2 Your configuration should appear similar.'
