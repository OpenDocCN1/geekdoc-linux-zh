    # Installing Sound Support in Windows 3.1


    If you want native Windows programs to have access to the virtual sound device,
    you need to install a Windows 3.1-compatible driver. You should have already downloaded
    the sbbasic.exe package from Creative Labs technical support and decompressed
    it to a new directory:


    +   1. Exit Windows 3.1.

    +   2. Change to the directory with the contents of the sbbasic.exe archive. (I
    recommend c:\sb16.)

    +   3. Run install.exe. When the installation main menu appears, press Enter to
    continue.

    +   4. The installation program asks you to verify your system directories, as
    shown in Figure 14.27. Unless you have extensively customized your virtual machine,
    the defaults should be correct.

    +   5. The installation program might mistakenly think 16-bit DMA is on channel
    5. If this happens, change the setting to 7. Your screen should match Figure 14.28.

    +   6. Select Proceed when the settings are complete.

    +   7. The installer prompts you to accept changes to your system configuration
    files. Accept the changes by pressing Enter.

    +   8. You can safely replace any Windows configuration files when asked. Chances
    are, it will be a MIDI file, which is irrelevant because the VMware sound emulation
    does not support MIDI.

    +   9. When the installation is complete, press F10 to restart the virtual machine.'
