    # Adjustments with the Configuration Editor


    Take a few minutes to breeze through the Configuration Editor to verify the settings
    generated by the wizard and make adjustments, if necessary:


    +   1. Open the Configuration Editor in the Settings menu.

    +   2. Verify that the wizard created a Primary Master (P-M) IDE virtual disk
    in the Windows NT configuration directory of the size you created (it might appear
    to be one megabyte less than you specified) and a Secondary Master (S-M) CD-ROM,
    most likely pointing to /dev/cdrom.

    +   3. If you want the virtual machine to have direct access to your serial or
    parallel ports, configure them now as described in Chapter 5, “Running VMware
    for the First Time.” Remember that serial ports start at /dev/ttyS0, and parallel
    ports start at /dev/lp0 on most Linux machines.

    +   4. If your Linux PC has sound configured and running and you want the virtual
    machine to have sound access, click the Sound option, and then click Install in
    the sound configuration window.


    > You might want to come back later and reassign /dev/cdrom to be a virtual SCSI
    CD-ROM drive, but because VMware does not support booting from a virtual SCSI
    CD-ROM, you should use the CD-ROM in IDE mode for now to install the OS.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Windows NT doesn''t automatically install your sound driver, so you can leave
    it off for now if you so choose.


    +   5. The wizard usually suggests a high memory value for Windows NT, but you
    might need to make adjustments up or down depending on your unique situation.
    Change the setting in the screen shown in Figure 11.5. Be sure you don''t exceed
    VMware''s maximum reserved memory allocation. Consider 48MB an absolute minimum
    to get any sort of performance from Windows NT.

    +   6. Make changes in the Misc settings list, if necessary. Windows NT doesn''t
    have the world''s best APM support, so you might want to stick with VMware''s
    built-in suspend/restore capabilities.

    +   7. Click Save when finished in the Configuration Editor.


