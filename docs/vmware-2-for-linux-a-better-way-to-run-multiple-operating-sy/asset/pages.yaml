- pgno: 205
  md: 'This feature does nothing when the virtual machine is in full-screen mode because
    the mouse is always within the virtual machine until you exit full-screen mode
    by pressing Ctrl+Alt+Esc.


    # Scroll When Mouse Nears Edge


    You only need to worry about the feature Scroll when mouse nears edge if you have
    a situation where your virtual machine’s desktop is larger than the VMware window
    on your Linux desktop. This could happen if you temporarily make the VMware window
    smaller or if you are using a virtual machine desktop larger than your computer
    can display (a 1,280×1,024 Linux desktop on a Linux PC whose desktop is only 800×600,
    for example).


    > If you want to be able to change the size of the VMware window on-the-fly, you
    need to disable Autofit under View on the VMware window settings. Note that this
    does not affect the size of the guest operating system’s desktop itself, just
    how much you can see at once.


    # Hide Cursor


    The option Hide cursor is nothing more than a glorified “mouse blanker,” but it
    can help avoid the confusion of seeing two mouse pointers on the same screen.
    When it is enabled, the mouse pointer in the virtual machine disappears if the
    input focus is on the host rather than VMware.


    > If you turn this option off, the guest’s pointer remains visible wherever it
    was when you changed the input focus back to the host. If you turn away from the
    screen and then turn back, you might get confused about which is the active mouse
    pointer until you actually start moving the mouse.


    # Bring the Virtual Machine to Top


    The option Bring the virtual machine to top is turned off by default. When on,
    it immediately brings the VMware window to the foreground whenever VMware is given
    the input focus. You might want to turn this on if you have a cluttered desktop
    and it might be difficult to move the VMware window to the top yourself.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '> Keep experimenting with mix-and-match combinations of these cursor options
    until you have the settings that best fit the way you use VMware and your host
    PC.


    # Allow Copy and Paste


    By default, VMware Tools allows you to share a clipboard between the host and
    your virtual machine, which, in theory, allows you to cut and paste seamlessly
    across applications regardless of operating system. Some applications do not read
    the clipboard in the expected manner, and text cut and paste generally works better
    than graphical cut and paste. Test the shared clipboard performance before you
    start making drastic changes to documents.


    You might want to turn off the Allow copy and paste option if you have security
    concerns on the host computer and you don''t want to encourage the flow of information
    across the boundary between the host OS and the virtual machine. Or you might
    simply want to keep the two clipboards separate because the projects you are working
    on in the host and the virtual machine are different and need access to their
    own, private clipboards.


    # Time Synchronization


    Time synchronization is an expert option that is only available if you run VMware
    Tools as the superuser. Don''t worry about it unless you notice that the virtual
    machine''s clock is consistently losing time. Normally, the virtual machine should
    do a perfectly adequate job of telling time.


    When activated, the virtual machine compares its own clock against the host OS
    clock every second and "catches up" as needed. This problem is most likely to
    occur if you run multiple Windows virtual machines, but it could theoretically
    be a problem with a Linux guest as well.


    > Because this feature turns on a frequent system check, it can impact the performance
    of your virtual machine. VMware recommends leaving it off unless you have a serious
    timekeeping problem in the guest.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Managing Virtual Disks


    Virtual disks grow as you add data, but they don''t shrink as you delete files.
    After a while, you might have a very large virtual disk file that contains a relatively
    small amount of information. This is wasteful and inefficient.


    VMware Tools can help you reclaim space on your hard drive. The process is not
    dissimilar to disk defragmentation, which sorts and re-orders the data on a disk,
    eliminating the "dead zones" where deleted material lives.


    The VMware shrink process not only sorts the data, but also it reduces the size
    of the virtual disk file by cutting out unused space.


    > Virtual disks can also be defragmented inside the virtual machine. This might
    give you a modest performance boost if the disk has become cluttered, but it does
    not shrink the physical size of the disk on your host hard drive.


    # Preparing for Shrinking


    For shrinking to work and be any real benefit, your host and virtual machine must
    meet certain requirements:


    +   - The host Linux OS needs free disk space equal to the current size of the
    virtual disk you want to shrink. Ironic, isn''t it? After all, you''ll probably
    start thinking about shrinking your virtual disks when your Linux PC starts to
    run out of room. But unfortunately, the shrink process needs a buffer as big as
    the virtual disk it will optimize to work. Prevention is the best medicine, after
    all.


    +   - The virtual machine cannot have any raw or plain disks connected to it when
    you start the shrink process. Trying to shrink a raw or plain disk would have
    undesirable results (because they don''t work like virtual disks), so VMware decided
    that discretion was the better part of valor and does not let you access the Shrink
    command if you have raw or plain disks attached to your virtual machine. You can
    always temporarily remove them from the VMware configuration, boot up just to
    shrink the disk, and then re-attach them when the shrink process is complete.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Shrinking Virtual Disks


    Shrinking virtual disks is a two-stage process. The first stage takes place inside
    the virtual machine, when you select which drive you want to shrink and VMware
    Tools does some preparation work. Then, VMware itself takes over, temporarily
    freezing the virtual machine while the shrinking operation takes place.


    Assuming your setup is in line with the guidelines listed earlier, you are ready
    to begin:


    +   1. Run VMware Tools as root. This might not be strictly necessary if your
    login account on the virtual machine has wide-ranging write access to the virtual
    disk, but running as root cuts to the chase.

    +   2. Click the Shrink tab, shown in Figure 10.19.

    +   3. VMware automatically lists the disks it can shrink. On a typical VMware
    setup (with one virtual disk, one floppy, and one CD-ROM drive), the root mountpoint
    / appears in the supported list, and the floppy, CD-ROM, and possibly various
    other devices show up in the Unsupported Partitions tab.

    +   4. Put a checkmark next to the supported drive you want to shrink. (If there
    is only one, it is selected by default.)

    +   5. Click Prepare to shrink. VMware Tools works on the drive for a while—quite
    possibly a long while. The entire process can take the better part of an hour
    or more, depending on the size of the virtual drive and various system performance
    factors. The screen should resemble Figure 10.20.

    +   6. VMware Tools asks whether you want to commit to shrinking the disk now.
    (Remember, it can take some time.) Answer Yes.

    +   7. The virtual machine freezes while the VMware main application takes over
    the process (see Figure 10.21).


    ![](img/b2b6702758c230ce537468351fc8af15_208_0.png)


    Figure 10.19 The Shrink tab contains a list of all attached devices, divided into
    Supported and Unsupported categories.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/b2b6702758c230ce537468351fc8af15_209_0.png)


    Figure 10.20 VMware performs initial scans when you Prepare to shrink.


    ![](img/b2b6702758c230ce537468351fc8af15_209_1.png)


    Figure 10.21 VMware scans the virtual disk in preparation for shrinking.


    ![](img/b2b6702758c230ce537468351fc8af15_209_2.png)


    > Although you can run other applications while VMware shrinks a virtual disk,
    it is wise not to do anything that might make the system unstable. Also, avoid
    heavy disk access; VMware needs the buffer space, and hitting the hard drive just
    makes the VMware shrinking take longer.


    +   8. After analyzing the disk, VMware offers a guess about how much space it
    can save by finishing the process, as shown in Figure 10.22. Click Yes to continue.


    +   9. VMware swaps the old virtual disk data to a temporary file and then begins
    working on optimizing the disk. When complete, the virtual machine resumes and
    runs normally. You don''t even need to reboot the Linux VM.


    ![](img/b2b6702758c230ce537468351fc8af15_209_3.png)


    Figure 10.22 VMware estimates disk savings before committing to the shrink procedure.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Sharing Between a Linux Host and a Linux Guest


    It would certainly be nice if you could give your virtual machine access to all
    the riches stored on your host PC and get information out of the virtual machine
    easily and quickly.


    Think of host-only networking as a virtual network pipeline that connects just
    the virtual machine and the host, nothing else. Bridged networking gives your
    virtual machine a virtual Ethernet card that behaves as though it is attached
    to a hub with your host PC''s physical Ethernet card, allowing the host and guest
    to communicate, while also potentially linking your guest with any computer your
    host can reach through its physical Ethernet connection.


    Your first move is to write down the IP address of your host PC. If you are using
    bridged networking, simply write down the IP address of your Linux PC''s main
    Internet or LAN adapter. (If you''re using a modem or DSL connection, it might
    be dynamic, in which case you have to re-check it every time you reboot or reconnect
    to the Internet.)


    There''s a shortcut for all this, the ifconfig command. You might need to be root
    (or use the su command) to run ifconfig, and it might not even be in your default
    path: Generally, it is kept at /sbin/ifconfig. Run the command with no arguments
    at a terminal prompt, and you''ll find out everything you ever wanted to know
    about your IP configuration. Sample output is shown in Figure 10.23. Start with
    your host PC.


    Any computer has an entry for lo, the local loopback. Ignore this entry. You''re
    interested in eth0 and vmnet1; you need at least one of them if you plan to network
    with the virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'eth0 is the standard designation for the first Ethernet card in your host PC.
    (If you have multiple Ethernet cards, look at the one responsible for your main
    LAN or Internet connection.) There’s a mass of information there, but you’re only
    interested in one entry: inet addr. There it is; that’s your Linux PC’s IP address.
    (In this case, my computer is located at 192.168.20.2.) That is the address a
    virtual machine using bridged networking needs to point at.


    vmnet1 is a virtual Ethernet card used to connect to virtual machines running
    host-only networking. You only have a vmnet entry if you opted to install the
    host-only networking components when you installed VMware. Again, there is a bunch
    of spurious information; all you care about is inet addr. Mine is 192.168.71.1.


    Note that the IP address for the host-only vmnet “virtual card” is notably different
    from the IP address in use by your real Ethernet card. That’s by design: VMware
    looks for an unused range of addresses that can be devoted entirely to virtual
    machine host-only networking. Other computers on your LAN or the Internet will
    not be able to access your computer over the vmnet interface; only virtual machines
    configured for host-only networking can see it.


    Remember, the IP addresses in this book are just examples. Yours might wind up
    looking similar or substantially different, depending on your network configuration.
    What is important is to note which entry refers to which type of networking, so
    when you execute these commands on your computer, you recognize the pattern and
    can apply the information here to your unique situation.


    Next, run `/sbin/ifconfig` on your virtual machine.


    Things are just a little more complicated on the virtual machine side because
    if you run both host-only and bridged networking, they both show up as eth-style
    devices. But because you know the IP addresses assigned to your host PC’s real
    Ethernet card and the virtual vmnet adapter, sorting things out is a snap.


    If you use both host-only and bridged networking, the virtual machine appears
    to have two Ethernet cards.


    If you use host-only networking and properly installed the host-only Samba and
    DHCP components, the virtual machine should be able to automatically grab an IP
    address from the DHCP server running on your host PC. That address starts in the
    same family as the address for the vmnet1 adapter (in the example, 192.168.71)
    and then counts up starting at .128 for the first virtual machine. In Figure 10.24,
    note the host-only IP address, 192.168.71.129.'
  merge: -1
  img_proc: true
