- pgno: 89
  md: '![](img/b2b6702758c230ce537468351fc8af15_89_0.png)


    # Figure 5.20


    > Don’t configure a drive in a slave slot unless there is a master as well, or
    virtual machine disk access might be erratic or completely non-functional. This
    doesn’t work well in a real machine, either.


    At this stage of the configuration, you can designate a virtual disk to run in
    one of the special protected modes, either nonpersistent or undoable. Click the
    Mode tool and select the new level of protection. The VMware Configuration Wizard
    always configures new virtual disks as persistent because that is the most useful
    type for most situations.


    > The Shrink button isn’t useful right now, but it will be later if you use an
    officially-supported guest OS. Although virtual disks grow as they are used, they
    can’t automatically shrink when you delete data. Using the Shrink tool in conjunction
    with VMware Tools can cut the unused space in virtual disks back down to size.


    The IDE configuration window also enables you to create raw or plain disks, which
    are covered in Appendix A, “Advanced VMware Configuration.”


    # SCSI Drives


    This section is virtually identical to the IDE drive configuration, except that
    there are seven drive slots instead of four, and it does not matter in what order
    you configure them.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'It''s very important to reiterate that VMware doesn''t care whether the physical
    drives on your system are SCSI or IDE. VMware''s virtual SCSI controller can format
    SCSI-type drives and use SCSI-style access on your CD-ROM drive even if your hard
    drives and CD-ROM drive are on your PC''s IDE controller. See Figure 5.21 for
    a sample diagram.


    The reverse is true as well: You can configure real SCSI devices to appear as
    IDE devices to the virtual machine. See Figure 5.22 for the SCSI Configuration
    window.


    By using virtual SCSI instead of virtual IDE, regardless of what the real disk
    is, you might get some notable speed gains in the virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_90_0.png)


    Figure 5.21 A perfectly valid hard drive allocation. A physical IDE hard drive
    can contain one or more virtual disks that appear to be SCSI hard drives to a
    VMware virtual machine.


    ![](img/b2b6702758c230ce537468351fc8af15_90_1.png)


    Figure 5.22'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'By ditching the wizard-created IDE virtual disk and creating a new SCSI virtual
    disk, you can achieve faster read/write speeds in the virtual machine. However,
    it might be more difficult to install the guest operating system if there is no
    IDE drive; even PCs in the real world don’t deal well with computers that have
    only SCSI disks. This is most likely to cause trouble in DOS or a consumer edition
    of Windows.


    Although you can move your CD-ROM drive from the virtual machine IDE controller
    to its SCSI controller even if your real CD-ROM drive is IDE, the virtual machine
    cannot boot from an emulated SCSI CD-ROM drive. A virtual machine can boot from
    a real SCSI CD-ROM drive, as long as that CD-ROM is configured as an IDE device
    in VMware.


    # Floppy Drives


    The VMware Configuration Wizard should have properly located and installed a floppy
    drive on your PC to be shared in VMware. You can verify the floppy settings by
    clicking the Floppy Drives tree, shown in Figure 5.23. VMware supports up to two
    floppy drives, one or both of which can be virtual floppy disk files. Some software
    is distributed on virtual floppy disks, including VMware Tools.


    ![](img/b2b6702758c230ce537468351fc8af15_91_0.png)


    Figure 5.23'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'If you ever need to mount a virtual floppy file for use in a virtual machine,
    follow these steps:


    +   1. Click on one of the virtual machine floppy drive slots.

    +   2. Click on the Type tool and change it to File.

    +   3. Enter the complete path to the virtual floppy file.

    +   4. Click on the Install button to commit your change.

    +   5. Save the new configuration by clicking Save at the bottom of the window.
    This also exits the Configuration Editor.


    # Ethernet Adapters


    Each virtual machine can have as many as three virtual network connections, although
    you are likely to need only one or two.


    The wizard automatically configures Ethernet adapters based on the networking
    choice you made at the end of the wizard process (Bridged, Host, both, or neither).


    If you passed on either the Bridged or Host networking, you can easily add it
    here by selecting the one you want from the Connection Type tool and clicking
    Install, on the window like the one shown in Figure 5.24. No configuration is
    necessary.


    > If at all possible, allow the wizard to handle your network configuration.


    ![](img/b2b6702758c230ce537468351fc8af15_92_0.png)


    # Serial Ports


    The Configuration Wizard does not set up any serial ports, but it is fairly easy
    to adjust if you need to use them. Although VMware supports three different types
    of'
  merge: -1
  img_proc: true
