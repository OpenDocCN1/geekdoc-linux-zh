- pgno: 228
  md: '11. Windows NT asks to perform a detailed damage scan of your hard disk, but
    it''s pointless to do so on a new virtual disk. Press Esc to skip the check.


    > If you''re using a plain or raw disk, a check might be useful.


    12. Setup copies the base install files to the drive. After it finishes, setup
    asks to reboot the computer. If you used a boot floppy, remove it. (Leave the
    CD-ROM in, though.) Press Enter to reboot.


    > Windows NT can take a long time to reboot. Although it can sometimes hang during
