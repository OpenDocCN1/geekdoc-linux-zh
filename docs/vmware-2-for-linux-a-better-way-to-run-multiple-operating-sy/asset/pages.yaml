  md: '# About the Author


    Jason Compton has been an outspoken fan of virtual machines and emulators for
    a decade. A full-time freelance writer specializing in technology and business
    coverage, Jason regularly appears in a variety of publications, including Linux
    Magazine, the Chicago Tribune, Smart Business, CRM Magazine, and Mobile Computing.
    His writing career began in 1993, with an article for an online magazine in the
    days before the Web. His first published work? A column about emulators.


    Jason is a graduate of Northwestern University.'
