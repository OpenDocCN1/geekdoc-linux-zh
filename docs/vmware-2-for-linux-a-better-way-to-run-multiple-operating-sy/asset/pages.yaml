- pgno: 20
  md: '# Welcome to VMware for Linux!


    # Nothing''s Impossible!


    # Introduction'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'I have long been a fan of emulation technologies. They are one of the most
    taxing programs a computer can run. Managing the resource requirements of one
    operating system and running programs is enough of a challenge for most computers,
    but having to juggle multiple operating systems with layers upon layers of software
    all competing for CPU, memory, and disk resources truly separates the wheat from
    the chaff in PCs. And it represents a marvelous feat in programming wizardry to
    create a system that can manage such a feat.


    There''s also a bit of the "forbidden fruit" complex: "I shouldn''t be able to
    run Microsoft Word! This is Linux! But here I am!"


    Of course, there are a variety of professional reasons to applaud VMware. One
    of the biggest setbacks in software development and systems testing is a computer
    crash. But what if the "computer" is just a window that can be closed and re-loaded
    on a whim, with no risk to any other part of the PC? The applications for cross-platform
    development and technical support are tremendous, and in fact companies in these
    businesses are among VMware''s best customers.


    # The Inevitability of VMware


    I felt sure that someone would eventually recognize the tremendous potential of
    virtual machines for Linux, and VMware, Inc. came through. Linux''s growing popularity
    is running head-on with the seemingly immovable force of Windows, and some people
    simply can''t afford to make a firm choice between them. In a world where Linux
    is gaining ground as a top-shelf OS, I''m confident that more people will turn
    to VMware to provide a bridge to other powerful operating systems and software
    markets.


    This book is intended to be your guide through the process of configuring and
    using VMware as a virtual machine for a variety of popular operating systems.
    Although VMware has a logical graphical user interface (GUI) and relies on straightforward
    configuration tools, the benefits and limitations of the VMware environment are
    not always crystal clear.


    # Novices, Beware!


    Have you ever heard the saying, "Before you can truly know another, you must first
    know yourself?" It applies to would-be VMware users as well.


    VMware is not a simple piece of software. To comfortably install and configure
    VMware, you should first be familiar with basic Linux conventions of installing
    software, manipulating files (copying and editing), and allocating free disk space.
    If you need additional guidance on these topics, you might want to see Red Hat
    Linux 6 Fast & Easy.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Most novice Linux users are likely interested in running VMware for compatibility
    with the version of Windows they are most familiar with: probably Windows 98,
    Windows NT 4 Workstation, or Windows 2000 Professional. Although it is certainly
    possible to "learn just enough" to install and run VMware and install Windows
    as a VMware guest operating system, you have another option. VMware recently began
    selling VMware Ready To Run, allowing it to package preconfigured Windows virtual
    machines for easy loading on Linux computers. I discuss Ready To Run later in
    the book.


    The CD-ROM included with this book contains a trial version of VMware 2.0.1 for
    Linux. You''ll find support files for VMware, including two Ready-To-Run versions
    of Linux that can be loaded from within VMware. There are also other emulators,
    such as Basilisk II, a Macintosh emulator for Linux, as well as support files
    for VMware and VMware operating systems that you will read about later in the
    book.


    If I''ve done my job, with a little planning and patience on your part you''ll
    have VMware purring along with any operating system you choose to throw at it.
    And despite what I said about operating systems being selfish, I promise you that
    your core Linux installation won''t get jealous because VMware will teach it how
    to share.


    # Conventions Used in This Book


    When you need to hold down the first key while you press a second key, a plus
    sign (+) is used to show this combination (such as Alt+F or Ctrl+Z).


    Mono text indicates text you should type.


    # Special Elements in This Book


    You will find several special elements that will make using this book easier as
    you read each chapter.


    Tips tell you about new and faster ways to accomplish a goal.


    Notes delve into background information regarding a given topic.'
  merge: -1
  img_proc: true
