  md: '17. You can safely start using full-screen mode whenever you are in your Windows
    virtual machine. Click Full Screen at the top of the VMware window, and use Ctrl+Alt+Esc
    to exit full-screen mode.


    # Installing Windows 98 Applications


    Although Microsoft includes some useful and fun tools in the core Windows 98 installation,
    chances are you''ll want to use software that is more productive and exciting
    than Notepad and Paint. You are probably familiar, at least in passing, with the
    standard Windows installation wizards. But for the sake of completeness, a model
    software installation, along with VMware-specific notes, follows.


    In this illustration, I install Jasc Paint Shop Pro 6, a good representation of
    the sort of mainstream application you might want to run in a Windows virtual
    machine, the GIMP for Linux notwithstanding:


    +   1. Start VMware and boot your Windows 98 virtual machine.

    +   2. If you have another CD-ROM in the drive, disconnect VMware from the CD-ROM
    drive and eject the CD.


    > Depending on how CD-ROM access is configured on your Linux system, this can
    be something of a chore. You first have to ensure that no open Linux windows,
    programs, or shells are accessing the CD-ROM. Then, you need to use the Disconnect
    command under Devices on the toolbar (or use the VMware Tools) to release VMware''s
    hold on the CD-ROM. You might need to type `umount /dev/cdrom` at a terminal prompt
    to completely release Linux''s hold on the CD.


    +   3. Insert the Paint Shop Pro 6 CD-ROM.

    +   4. Re-connect VMware to the CD-ROM drive. You can do this either by clicking
    on Devices in the VMware toolbar or by using the VMware Tools icon in the Windows
    tray, shown in Figure 6.29.

    +   5. VMware should spin up the CD-ROM, and Windows should automatically launch
    the Paint Shop Pro installation program, pictured in Figure 6.30.

    +   6. Click Install to start the setup program.

    +   7. Paint Shop Pro opens a standard Windows installer wizard, shown in Figure
    6.31. If you have any other applications open in this virtual machine, you should
    close them. Click Next to start the installation.


    ![](img/b2b6702758c230ce537468351fc8af15_122_0.png)'
