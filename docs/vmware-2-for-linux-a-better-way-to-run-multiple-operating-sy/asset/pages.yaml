    \ other, better alternatives. If you only need a virtual link between the host\
    \ and the guest, you can still use host-only network communication other than\
    \ Samba.\n\n11. The wizard summarizes the virtual machine it will create (see\
    \ Figure 10.5). If everything looks appropriate, click Done.\n\n![](img/b2b6702758c230ce537468351fc8af15_191_0.png)\n\
    \n# Adjustments with the Configuration Editor\n\nThe wizard is reliable, but not\
