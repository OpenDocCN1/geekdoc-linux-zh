- pgno: 176
  md: 'Remember, FTP allows you to upload as well as download files, so there is no
    real reason to have an FTP server available on both the host and the guest. My
    advice is to experiment with a few different FTP clients for both Linux and Windows,
    pick the one you like the best, and then run your FTP server on the other OS.


    # Mounting a Virtual Disk in Linux


    FTP and other file-sharing methods are convenient, but it would be a shame if
    you had to boot up VMware just to get a few files every now and then. The data
    is all locked up in that big virtual disk file but is maddeningly inaccessible.


    Well, not quite. A handy little program called vmware-mount.pl lets you address
    a virtual disk as you would any standard Linux drive.


    Do not attempt to mount a virtual disk while it is in use by a Windows virtual
    machine. The mounting program tries to prevent this situation, but it''s best
    to be careful anyway. You should shut down, not suspend, a virtual machine before
    you mount its virtual disk directly in Linux.


    Before you can mount the disks, you need to create a mountpoint in the /mnt directory.
    This is the location in the Linux file system where the virtual drive will appear
    to be attached. Type mkdir /mnt/vhd. You can create multiple mountpoints (vhd1,
    vhd2, and so on) if you suspect you might want to mount multiple virtual drives
    simultaneously.


    vmware-mount.pl is ready to run. To mount a virtual drive, follow these steps:


    +   1. Quit all sessions of VMware.

    +   2. You need root access. Type su and enter the root password.

    +   3. Use the vmware-mount.pl program to first display the partition table of
    the drive you want to mount. You need to know the location and name of your virtual
    hard drive first. A common name for a Windows virtual hard drive is ~/vmware/win98/win98.dsk,
    but check your VMware directories to get the exact filename.

    +   4. Type vmware-mount.pl -p ~/vmware/win98/win98.dsk, substituting the final
    argument for the actual path of your Windows virtual disk. The output will resemble
    Figure 9.8.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Chapter 9: Using Your Windows 95/98 Virtual Machine\n\n![](img/b2b6702758c230ce537468351fc8af15_177_0.png)\n\
    \n+   5. You see a partition table. For a common Windows virtual machine, you\
    \ might only see one partition, the C: drive. Make a note of the number (in the\
    \ first column) of the partition you want to mount.\n+   \n+   6. To actually\
    \ mount the drive, type vmware-mount.pl -p /vmware/win98/win98.vhd 1 /mnt/vhd,\
    \ substituting the first path with the actual path to your virtual disk and the\
    \ number 1 with the actual partition number you want to mount based on your virtual\
    \ disk's configuration. If vmware-mount.pl complains that you are lacking the\
    \ \"Network Block Device,\" you may need to manually load the nbd.o module, or\
    \ recompile your kernel with this support.\n+   \n+   7. If you type cd /mnt/vhd,\
    \ you find yourself in your Windows virtual machine's C: drive. You can access\
    \ any file in the virtual disk and copy items to and from the rest of your Linux\
    \ file system. Remember that your changes are permanent, so be careful!\n+   \n\
    +   8. Don't forget to disconnect the virtual drive when you're done, before attempting\
    \ to load from the virtual disk in VMware in particular. Unfortunately, you have\
    \ to use brute force: Click the terminal you used to launch the vmware-mount.pl\
    \ program, and press Ctrl+C to quit.\n\n> Accessing a virtual disk in this fashion\
    \ can, under certain circumstances, make your system unstable if you perform large\
    \ sustained writes to the virtual disk. If you need to write large amounts of\
    \ data to the virtual disk, consider using VMware's networking capabilities instead\
    \ of directly mounting the virtual disk. Watch VMware's Web site for future updates\
    \ to the vmware-mount.pl program that will fix this problem."
  merge: -1
