    # Installing Windows 95 Applications


    Although Microsoft includes some applications in the core Windows 95 installation,
    chances are you want to use software more powerful and exciting than Notepad and
    Paint. By now, I hope you don’t need my help understanding Windows installation
    wizards. But for the sake of completeness, a model software installation, along
    with VMware-specific notes, follows.


    In this illustration, I install the Word component of Microsoft Office 97, a good
    representation of the sort of mainstream application you might want to run in
    a Windows virtual machine, WordPerfect for Linux notwithstanding:


    +   1. Start VMware and boot your Windows 95 virtual machine.

    +   2. If you have another CD-ROM in the drive, disconnect VMware from the CD-ROM
    drive and eject the CD.


    > Depending on how CD-ROM access is configured on your Linux system, this step
    can be something of a chore! You first have to ensure that no open Linux windows,
    programs, or shells are accessing the CD-ROM. Then, you need to use the Disconnect
    command under Devices on the toolbar (or use the VMware Tools) to release VMware’s
    hold on the CD-ROM drive. You might need to type umount /dev/cdrom at a terminal
    prompt to completely release Linux’s hold on the CD.


    +   3. Insert the Microsoft Office 97 CD-ROM.


    +   4. Re-connect VMware to the CD-ROM drive. You can do this either by clicking
    Devices in the VMware toolbar or by using the VMware Tools icon in the Windows
    tray (see Figure 7.25).


    +   5. VMware should spin up the CD-ROM and Windows should automatically launch
    the Microsoft Office installation program (see Figure 7.26).


    +   6. Click Install Microsoft Office to start the setup program.


