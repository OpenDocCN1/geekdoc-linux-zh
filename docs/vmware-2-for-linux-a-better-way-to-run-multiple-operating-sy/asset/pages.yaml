    # Using Windows 2000 Services


    Although Linux certainly has an impressive array of intranet/Internet service
    capabilities, you might find it important or necessary to leverage certain Microsoft
    implementations, such as COM, or some new Windows 2000 network security features.
    You might also want to research how to convert certain existing services currently
    handled by a Linux server on your network (such as the NNTP news protocol) to
    a Windows 2000-based server.


    VMware also provides an excellent opportunity to test interconnectivity between
    a Linux server (which can be the host machine or another computer on your network)
    and a guest Windows 2000 server. You can isolate bugs, inconsistencies, or potential
    security holes or "disagreements" before rolling out a hybrid server environment.


    Spend some time in the Configure Your Server interface of Windows 2000, shown
    in Figure 12.23. Some interesting networking possibilities might present themselves.


    # Configuring the IIS FTP Server


    If you installed IIS (Internet Information Services), you might want to activate
    Windows 2000''s FTP server. (Windows 2000 activates Samba networking without even
    being asked.)


    +   1. Add at least one username and password to the Windows 2000 system other
    than administrator, using the Computer Management program under Administrative
    Tools in the Programs Start menu.

    +   2. Run the Internet Service Manager, also found under Administrative Tools
    on the Programs Start menu.

    +   3. Click to expand the tree on your virtual machine''s network name. You see
    a list of all available Internet services, very much like the one shown in Figure
    12.24.'
  merge: -1
  img_proc: true
