    # Installing Windows NT 4 Workstation


    Installing Windows NT is not significantly more complicated than Windows 95 or
    98; in fact, in VMware, it''s arguably easier than installing Windows 95:


    Your Windows NT installation might be slightly different from what''s detailed
    here. You may initially need to boot from a floppy, or you might see slightly
    different prompts, depending on what service pack the NT installation CD was created
    with. If things appear to be drastically different from what''s outlined here,
    consult a Windows NT authority for help.'
