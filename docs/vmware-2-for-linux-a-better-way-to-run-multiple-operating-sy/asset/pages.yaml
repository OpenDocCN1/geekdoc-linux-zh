- pgno: 343
  md: 'VMware is your portal to a world of cross-compatibility with a range of operating
    systems designed for the x86 CPU family. And although Intel''s designs have set
    the standard for personal computing over the past two decades, the PC hardware
    platform is not the only game in town. For nearly as long, the Apple Macintosh
    has inhabited a comfortable niche, largely in desktop publishing and education.


    If you were a part of the Macintosh community before moving to the PC and Linux,
    or you''re simply curious about the Mac but don''t want to invest any desktop
    space to investigate, there are emulators that allow you to re-create the Macintosh
    environment on your current computer. And strange though this may sound, you might
    wind up running a Macintosh emulator inside a VMware session, as shown in Figure
    17.1!


    ![](img/b2b6702758c230ce537468351fc8af15_343_0.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# # The Evolving Apple


    The original Motorola 68000-series processor (referred to as the 68K) was dropped
    for the much faster PowerPC chip. Rather than cut off millions of loyal customers
    from its software investments, Apple included an invisible emulation layer that
    allowed PowerMac users to run most 68K software on the new CD and shipped 68K
    and PowerPC versions of its operating system on the same CD.


    The current crop of Macintosh emulators for x86-based computers can emulate a
    68K-based Macintosh, the pre-PowerMac variety, and as a result, you are limited
    to running only those versions of the MacOS and only those programs that support
    the 68K processor line.


    That''s the bad news. The good news is that there is an extremely large library
    of software for 68K Macs because developers continued to support the classic machines
    long after the first PowerMacs became available. Apple even included 68K support
    in early versions of MacOS 8. Although you will not be able to run some of the
    newest and most powerful Macintosh software, you do certainly not run out of material.


    Remember that because your PC does not have a 68K chip inside it, your CPU has
    to do double-duty, emulating the precise characteristics of the Motorola chip
    while it runs Linux and the rest of your programs. Although a modern high-end
    PC system running an emulator can attain Macintosh speeds greater than any real
    68K-based Macintosh ever could, you probably don''t have to worry about slowing
    down programs, as you might in a DOS virtual machine. After you experiment with
    Macintosh emulation, you''ll appreciate the advantages of a virtual machine that
    can share a common CPU without an emulation layer.


    # # Making a Decision


    Linux users who want to add Mac compatibility to their systems have a choice between
    two very different programs.


    The first option is Executor, from ARDI. Executor is a sort of cousin to Wine.
    Although Executor, by necessity, runs a 68K emulation core, it does not create
    a virtual machine that runs MacOS. Instead, ARDI built from scratch a simulation
    of the'
  merge: -1
  img_proc: true
- pgno: 345
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 346
  md: '![](img/b2b6702758c230ce537468351fc8af15_346_0.png)


    Figure 17.3 Educational software, such as The Even More Incredible Machine (shown
    here running on Basilisk II), is a Macintosh mainstay.


    At the time of this writing, no one has released a PowerMac emulator for x86-based
    computers, although both Emulators Inc. and Microcode Solutions claim to be working
    on PowerMac emulators. Whether these emulators will run efficiently in a VMware
    session, or whether direct Linux versions will be available, remains to be seen.


    > If you have a PowerPC-based computer running Linux and are interested in a Macintosh
    virtual machine, keep your eyes on the SheepShaver project at http://www.sheepshaver.com.
    SheepShaver is a commercial PowerMac virtual machine for PowerPC-based BeOS computers.
    A port to PowerPC-based Linux systems is underway.


    # Making Sense of Legalities


    If you plan to emulate a Macintosh, you need to deal with a sticky legal issue
    first. When you run Windows in VMware, you need a legitimate licensed copy of
    the operating system; generally, the license is a code found on the CD jacket
    or an accompanying booklet.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'The Apple Macintosh operating system is actually distributed in two pieces.
    There is the conventional OS CD that you install and run on a Mac or an emulator,
    but there is another invisible portion: the Macintosh ROM, a chip or pair of chips
    inside the computer that contain low-level code to boot the rest of the MacOS.
    Although you do not need to plug the chips into your computer to make Macintosh
    emulation work, you might need the code contained on those ROMs, depending on
    which emulator you choose to run.


    The MacOS ROM is roughly akin to a PC’s BIOS, although it is more sophisticated
    and contains more code.


    > VMware saves users the trouble of seeking out a ROM by licensing the Phoenix
    BIOS code for its virtual machines.


    Executor’s MacOS simulation layer avoids any legal complication for the end user
    because you do not need either the MacOS CD or the ROM code to run Executor. Because
    ARDI does not use any of Apple’s proprietary code in the Browser and the emulation
    engine, Executor provides a no-hassle way to start running Macintosh software
    fast. The price of convenience is that Executor is a commercial product.


    Although Basilisk II is an open-source program with no license fee, that doesn’t
    make its emulation system “free.” You need a copy of both the Mac’s ROM and the
    MacOS.


    You can buy a MacOS CD from a store or even download an older version for free
    from Apple’s Web site. But it is a little more difficult to come by the ROMs.
    Without them, Basilisk II is useless.


    The ROM code is copyrighted by Apple and cannot be freely distributed. It is still
    possible to observe the law and emulate the Mac, however. Following are the most
    popular ways to obtain legitimate copies of the ROM code:


    +   - Strip the ROM code from a 68K Mac you already own. The Windows version of
    Basilisk II contains a tool for this (GetRom), as does the demo version of SoftMac
    2000 (available from http://www.emulators.com). When you run Basilisk’s GetRom
    or SoftMac’s CopyROM on a 68K Macintosh (it should be a Mac II or newer), it creates
    a binary file containing the ROM code. That file can then be transferred to your
    PC and used for Mac emulation. Typically, you can use a standard MS-DOS formatted
    high-density floppy to transfer the ROM (which will be either 512KB or 1MB in
    length) from the Mac to your Linux PC.


    +   - Obtain a set of ROMs from a Macintosh parts/repair vendor, and then use
    either a real Macintosh and the CopyROM program, or special ROM-reading equipment,
    to obtain the necessary binary file.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   Purchase a Mac ROM card from Emulators Inc. and obtain the ROMs from either
    Emulators Inc. or a Macintosh parts/repair vendor. You can then use a program
    from Emulators Inc. to read the ROM code. Unfortunately, that program only runs
    in a native Windows environment, so you either need a second computer or a dual-boot
    machine with a Windows partition to read the code.


    In any of these cases, you are required not to use the physical ROMs while you
    run your emulator. That means if you have a real Macintosh, it should remain off
    while your emulator is on. If you own a set of the ROMs by themselves or on an
    Emulators Inc. ROM card, you cannot use those ROMs or the ROM images derived from
    them on any other computer or emulator.


    If this sounds like a lot of work, that''s because it can be. Aging Mac II and
    Mac LC machines are extremely cheap these days, however, and it is probably easiest
    and least expensive to simply pick up an old Mac, run the CopyROM program, and
    be done with it. However, you might want to evaluate Executor (ARDI provides a
    30-day free trial version) before you invest time and money acquiring the Mac
    ROMs for Basilisk II.


    > Newer PowerMacs, such as the iMac, actually store their "ROM" code in software
    that is included on the MacOS CD and gets loaded into a special area of memory
    every time you turn on the computer. Hence, when Power Macintosh emulation finally
    becomes available, it will actually be easier to legitimately run MacOS on another
    computer!


    # Using ARDI Executor


    ARDI has a 30-day free trial version of Executor on its Web site that disables
    only minor, trivial functions, such as the ability to use certain keyboard shortcuts.
    The trial version of Executor is also included on the CD that came with this book.
    It''s well worth your time to give it a look.


    # Installing ARDI Executor


    If your computer is adequately equipped for VMware, installing and running Executor
    should be a breeze:


    > Installing Executor requires that your system support either RPM or DEB packages,
    and RPM is strongly recommended.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '+   1. Head to http://www.ardi.com/download.html. Alternately, you can look
    in the /Executor directory of the included CD-ROM.


    +   2. Select the Linux version of Executor most appropriate to your system. Chances
    are this will be Linux glibc RPM. Select a download site as well.


    +   3. The download should result in a file named something like executor-xxxx-glibc-demo-i386.rpm.tar.gz
    with the version number replacing the xxxx. Place this in a convenient directory.


    +   4. Extract the archive you just downloaded with the command tar -zxvf executor-xxxx-glibc-demo-i386.rpm.tar.gz,
    replacing the xxxx with the actual version number in the filename. You should
