- pgno: 247
  md: 'Windows 2000 is the current reigning grandmaster of Microsoft operating systems.
    Whether you buy into the marketing message or not, it is an important operating
    system for Intel PCs and well worth VMware’s time to support. Whether it’s worth
    your time to run is up to you, but I’m here to help.


    Windows 2000 blends the power of NT 4 with the comfort of Windows 95/98. The marriage
    is not yet a perfect one, and for serious Windows 2000 tasks, you should strongly
    consider investing in a good reference. By now, Windows 2000 has been around long
    enough that the literature is authoritative and thorough.


    > You really need to be aware of just how resource-intensive Windows 2000 is.
    Although 2000 Professional can be installed in 64MB of virtual machine memory,
    it prefers more. Windows 2000 Server is not even supported under 128MB. That means
    you want to have more than 128MB of RAM installed in your Linux machine because
    64MB usually has to be reserved for the overhead of Linux, Linux applications,
    and the VMware environment. Consider 192MB of total memory your bare minimum requirement
    to run Windows 2000 Server in VMware. 224MB is better. For this reason, you might
    find Windows NT 4 Server a better fit for VMware.


    # Preparing the Virtual Machine


    After you’ve made any necessary system upgrades to support Windows 2000 in VMware,
    head for the configuration wizard.


    # Starting with the Wizard


    As ever, it’s easiest to create a Windows 2000 virtual machine with VMware’s Configuration
    Wizard.


    +   1. If you’re not already in VMware, start the main program by typing /usr/bin/vmware
    at a command prompt.

    +   2. Launch the VMware Configuration Wizard by clicking Wizard in the File menu.

    +   3. Click Next to clear the first greeting screen.'
