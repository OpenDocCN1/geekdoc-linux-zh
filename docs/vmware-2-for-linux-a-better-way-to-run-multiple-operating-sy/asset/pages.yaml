    8. Click OK to commit to the changes.


    # Configuring the IIS Web Server


    Earlier versions of IIS''s Web server lacked a certain degree of flexibility.
    As is Microsoft''s custom, it has since added a wide variety of features and customizable
    options. You can read more about IIS in the Windows 2000 literature, but here
    are some helpful tips:


    +   - In truth, most of the default settings are just fine for a prototyping,
    intranet, or light-duty environment.

    +   - Be conscious of security updates for any network service running in a VMware
    guest operating system. A virtual machine is just as vulnerable to attack as any
    other PC if it is on bridged networking.

    +   - Activate directory browsing in the Home Directory tab if you want to be
    able to easily download files from the Win 2000 server with a Web browser on the
    host, another virtual machine, or elsewhere on the LAN.

    +   - Process throttling in the Performance tab might come in very handy if your
    IIS Web server sees a lot of traffic, considering that your CPU must be shared
    with Linux as well.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '+   If your resources are limited, especially if you are only using a single
    virtual disk on the server, you might want to use stripped-down Web activity logging
    or no logging at all. Detailed access logs can become quite large quickly, and
    recording all the information to disk also consumes system resources. The Web
    Site tab in the Web Server Configuration properties contains the logging settings.


    When IIS features are configured to your liking, you can connect with the Web
    browser or FTP client of your choice by using the IP address of the Windows 2000
    Server virtual machine. Figure 12.26 shows an example of a shared Linux/Windows
    2000 network system.


    ![](img/b2b6702758c230ce537468351fc8af15_267_0.png)


    Figure 12.26 With just a little configuration, Windows 2000 is ready to serve
    up files and documents to your host, other virtual machines, or the Internet at
    large.


    # Conclusion


    Windows 2000 is a feature-rich operating system and arguably puts a greater strain
    on VMware and your host computer than any of the other operating systems you can
    install. It certainly requires the most powerful computer to get started.


    By bringing Windows 2000 under the VMware wing, you can stay up to date with the
    latest developments in Microsoft-powered enterprise software, while retaining
    the core open standard flexibility of Linux. It''s hard to imagine a more productive
    way to run your computer.'
  merge: -1
  img_proc: true
