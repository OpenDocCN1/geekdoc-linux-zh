- pgno: 367
  md: 'Emulation doesn’t begin and end with Windows and Linux, or even with the Macintosh.
    It would only be a slight exaggeration to say that nearly every computer ever
    widely manufactured and sold has a corresponding emulator; there are even emulators
    of classic handheld electronic games!


    There are too many emulators for Linux and Windows to treat individually in this
    book. In this chapter, I highlight a few of my favorites, which are relatively
    easy to install and run, either in Linux or in a VMware Windows virtual machine.


    > Most of the emulators in this chapter require you to compile the source code
    yourself. Although this process is relatively automated, things can occasionally
    go wrong. Be sure to read the installation documentation included with each emulator
    before you attempt to install the program; the specific instructions are more
    detailed than this book can be and contain valuable troubleshooting information.


    # Using UAE Amiga Emulator for Linux


    The Commodore Amiga was the world’s first true multimedia computer. Launched in
    1985, the Amiga brought color, sound, and robust multitasking to market arguably
    before the world was ready, and after selling only about five million computers,
    Commodore went out of business in 1994 and the Amiga fell out of mass production.
    See Figure 18.1 for a classic Amiga image.


    For years, the Amiga’s high-power graphics and sound hardware made emulation seem
    infeasible, but the combination of rapid advances in PC processor speeds and hard
    work on the part of an international open-source effort resulted in the UAE Amiga
    emulator.


    # Installing UAE


    The good news is that you might already have UAE installed on your system, or
    available from your Linux distribution CDs, because it ships with a number of
    different packages, including SuSE, Debian, and TurboLinux.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '![](img/b2b6702758c230ce537468351fc8af15_368_0.png)


    # Figure 18.1 An old-style Amiga desktop running on UAE.


    Alternately, you can download the latest version of UAE from the UAE home page,
    http://www.freiburg.linux.de/~uae. Although the developers issue fair warning
    that even-numbered distributions might be unstable, in my experience you are usually
    better off using the latest "developer" release because they tend to update the
    "stable" release infrequently.


    As of this writing, the latest developer release is version 0.8.12. The UAE home
    page contains both the stable and developer source code libraries. The filenames
    have the form uae-0.8.12.tar.gz, although the version numbers might be newer by
    the time you download them. You also may be able to download and use some older
    pre-built binary files, depending on your system configuration.


    Before you can run UAE, at the very least you need to obtain an Amiga ROM code
    image. The UAE source code package comes with a program called transrom, which
    you can run on any Amiga to obtain the ROM image. After you install a proper Amiga
    ROM, you can boot to the Amiga "Kickstart" screen, shown in Figure 18.2.


    You also need Amiga software. Because PC floppy drives cannot read Amiga floppy
    disks, you need to use the transdisk program on an Amiga, also provided, to create
    disk images in the ADF format. There are also some ADFs available from UAE support
    sites online.


    > You can purchase the Amiga Forever cross-platform package, containing a fully
    legal, licensed version of AmigaOS software and ROMs, from http://www.cloanto.com.
    As of this writing, the package is $29.95.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/b2b6702758c230ce537468351fc8af15_369_0.png)


    Figure 18.2 The classic Amiga "kickstart" boot screen, shown through UAE.


    This is the procedure to install UAE from source code:


    +   1. Download the source code archive (such as uae-0.8.12.tar.gz) from http://www.freiburg.linux.de/~uae,
    and place it in a new directory.


    +   2. Open the source code archive with the command tar -zxvf uae-0.8.12.tar.gz.
    This creates a new directory named after the archive.


    +   3. Use the cd command to change to the directory that was just created (as
    in cd uae-0.8.12).


    +   4. Before UAE can compile properly, it must collect some information about
    your system. To start the process, type ./configure at the prompt. A large amount
    of text scrolls by.


    +   5. When the configuration program is finished, type make. UAE is being compiled.
    Screens full of text scroll by, and the compile process can take several minutes.
    The program being compiled is called uae and will be stored in the current directory.


    +   6. When complete, copy your Amiga ROM images to the same directory as uae.
    Name the ROM you plan to use most frequently (which will likely be either version
    1.3 or version 3.1) kick.rom. This will be the ROM loaded by default the first
    time you run UAE. For the sake of convenience, you might also want to copy any
    ADF files to this directory as well or store them somewhere logical.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'I don''t have space for a complete treatise on the history of the Amiga operating
    system. Suffice it to say that older games prefer Kickstart version 1.3, but newer
    games and most modern Amiga productivity software prefer Kickstart version 3.1.


    +   7. You are ready to run UAE. Type ./uae to launch the emulator. UAE should
    load a basic kickstart screen, as well as show you a GUI configuration interface.


    +   8. The UAE display will likely appear rectangular and squished. This is normal.
    For some odd reason, some versions of UAE default to an 800x300 Amiga display.
    Simply press Save Config on the UAE Control GUI and then quit. You need to edit
    the UAE configuration file to change the screen size.


    +   9. After quitting UAE, edit the newly created configuration file ~/.uaerc.
    (UAE Control creates this file when you click Save Config.)


    +   10. In .uaerc, look for an entry named gfx_height. It should be set to 300.
    If you believe you have a reasonably fast computer, proceed to Step 11. If your
    computer is not very fast (under 400MHz), proceed to Step 12.


    +   11. With a fast PC, change the entry for gfx_height to 600. Then, change the
    entry for gfx_linemode from none (the default) to either double or scanlines.
    (double requires a faster computer than scanlines). Proceed to Step 13.


    +   12. With a not-so-fast PC, change the entry for gfx_height to 480. Change
    the nearby gfx_width entry to 640. Finally, change the entry gfx_correct_aspect
    to true.


    If your computer is conspicuously slow, you might find that you need to go down
    to 320x200, but it won''t look very good. You can also help out a slow computer
    by reducing the accuracy of the Amiga sound emulation, or disabling it altogether,
    which is described in the UAE manual.


    +   13. You are now ready to run a good-looking Amiga emulation.


    If things get really bad and you don''t enjoy working with the .uaerc configuration
    file, you can always bail out, download the Windows version of UAE, and run it
    in a VMware virtual machine. WinUAE has a friendlier configuration GUI. However,
    the speed hit from the VMware layer might be more noticeable for Amiga emulation
    than it is for the Basilisk II Macintosh emulator.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Running Amiga Programs Through UAE


    With UAE ready to go, you should familiarize yourself with the UAE Control GUI.
    Although it unfortunately does not control every aspect of UAE’s configuration,
    it can help you make some important changes, especially on-the-fly as you try
    to maximize the performance of the emulator.


    # Adjusting UAE Control


    The first tab, Floppy disks (shown in Figure 18.3), controls up to four virtual
    floppy drives that can read ADF files. Use the Insert command to add a floppy
    to the Amiga, and use the eject button to virtually remove a disk. The Amiga,
    much like the Macintosh but unlike a PC and Linux computer, knows when a new disk
    is inserted. Unlike a Macintosh, however, Amiga disks can be ejected without asking
    permission from the operating system.


    The second tab, CPU emulation, controls the type and speed of the virtual processor
    in UAE. For older games, use 68000. For newer games or productivity applications,
    use 68020 or 68020+68881. You should never have occasion to use 68010.


    > Be aware that changing CPU types will reset the emulator, without warning.


    The CPU speed setting affects how fast the Amiga runs. If you are running old
    games that require a 68000, you probably want to use the Approximate 68000/7MHz
    speed option for maximum accuracy. Some particularly stubborn games might require
    toggling the Slow but compatible option as well.


    Games or applications not tied to a particular chip perform better with either
    the Optimize or Adjustable setting. Use the slider to adjust the priority of the
    CPU emulation in Adjustable mode. The CPU emulation tab appears in Figure 18.4.


    ![](img/b2b6702758c230ce537468351fc8af15_371_0.png)


    Figure 18.3 The UAE control window lets you insert and eject virtual floppy disks
    on-the-fly.


    ![](img/b2b6702758c230ce537468351fc8af15_371_1.png)'
  merge: -1
  img_proc: true
