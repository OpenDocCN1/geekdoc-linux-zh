- pgno: 56
  md: '![](img/b2b6702758c230ce537468351fc8af15_56_0.png)


    Figure 3.1 You can run more than one VMware session at a time.


    # Updating Linux, if Necessary


    VMware runs on a wide variety of Linux installations, so it’s fairly likely that
    if you have kept your system up-to-date, you’re ready to run VMware.


    +   - Red Hat Linux 5.x and 6.x

    +   - Caldera OpenLinux 2.2 and 2.3

    +   - SuSE Linux 6.0, 6.1, 6.2, and 6.3

    +   - TurboLinux 6.0


    > You should also make sure that the Linux kernel header source code is installed
    on your system before installing VMware because VMware needs certain Linux source
    files to build itself.


    I can’t recommend enough keeping things simple and using one of these distributions
    as your host OS for VMware. But if you are a truly dedicated Linux enthusiast
    and build your own distribution or make heavy modifications to an existing distribution,'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'you should at least be able to meet VMware''s core requirements. VMware requires
    that the host Linux operating system has at least the following:


    +   - Linux kernel version 2.0.32 (for single-CPU machines), version 2.2.0 (for
    multi-CPU machines)

    +   - XFree86 Server version 3.3.3.1 (version 3.3.4 highly recommended for performance
    reasons)


    If you do not meet these criteria, it might behoove you to take the plunge and
    go with one of the VMware-approved distributions.


    # Speed Is King


    Raw power is important for a happy virtual machine experience. In most cases,
    you have just one CPU in your machine. When two or more operating systems start
    making demands on it, things can get hairy if it doesn''t have enough juice to
    go around.


    VMware recommends a Pentium II processor at 266MHz as a good functional minimum.
    Will VMware run on less? Yes. Will you want to be there when it does? Probably
    not.


    As an extremely rough rule of thumb, ask yourself, "Would I be happy running both
    my main Linux system and my guest OS at half of the current speed of my CPU?"
    Because it is unlikely that both VMware and your host OS will be making equal
    demands on the CPU at the same time, this scenario is unlikely, but it should
    give you some sort of idea.


    If the answer is "no" or even "maybe," think about a system upgrade. At the time
    of this writing, reputable dealers are selling new motherboard and CPU combinations
    with 500+ MHz AMD K6-2 and Intel Celeron processors for under $200. Complete,
    prebuilt systems with those specifications are coming in at well under $1,000.


    That sort of speed should be enough to comfortably run Linux along with most VMware
    guest operating systems. If you know that you plan to run some CPU-intensive tasks
    in a virtual machine, up the stakes. Gigahertz processors are now a reality, after
    all.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# How Much Memory Is Enough?


    Free memory is just as important as CPU power, if not more so. Unlike CPU time,
    VMware requests a specific, locked amount of memory for each virtual machine.
    And if you start to run low on memory, the Linux host might “thrash” wildly to
    the swap partition, which bogs down the entire system. That might continue endlessly
    until you can shut off a major memory consumer (such as VMware), but because swap
    access slows down the system, it makes it difficult to shut off programs…you see
    the problem.


    VMware recommends 96 megabytes (MB) as a functional minimum. I say it’s 128MB.
    That gives you enough room to comfortably run Linux and XWindows without any compromises
    and leaves between 48MB and 64MB free for VMware. That’s enough to run most supported
    operating systems comfortably; it’s enough for at least a modest Windows NT 4
    installation, although NT 4 would certainly prefer more. It’s probably not enough
    to make running Windows 2000 worthwhile, however.


    It’s also probably only enough to run one virtual machine, unless you plan to
    run DOS or Windows 3.1, or you don’t mind putting Windows 95/98 or Linux VMs under
    some very serious resource constraints.


    > You should never allocate more than your total system memory minus 64MB to all
    your VMware sessions combined, unless you’re a sadist and you want to see the
    Swap Thrash Monster destroy your computer’s performance.


    Here’s a general guideline for how much memory above 96MB you should have in your
    computer to run a virtual machine for each OS. The lower bound will be sufficient,
    but the upper bound (or beyond) will ensure greater performance. Remember that
    if you plan to run more than one VM at a time, you should add the figures together
    to reach your total:


    +   - Windows 95/98: 32-64+ MB

    +   - Linux and FreeBSD: 32-96+ MB

    +   - Windows NT 4 Workstation: 32-128+ MB

    +   - Windows NT 4 Server: 48-128+ MB

    +   - Windows 2000 Professional: 64-128+ MB

    +   - Windows 2000 Server: 128-256+ MB


    Let’s say you’re only interested in running a Windows 98 virtual machine. Thirty-two
    megabytes is enough to run Windows 98, but it is nicer to give it 64; that way,
    Windows won’t have to hit its own swap file nearly so often. You need 96MB just
    to get in the game, plus you need the extra 64MB to dedicate to the virtual machine,
    96+64=160MB.


    ![](img/b2b6702758c230ce537468351fc8af15_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Let''s say you want to have virtual machines for both Windows 98 and SuSE Linux
    6.1, but you know you won''t ever want to run them at the same time. You''re also
    pretty sure you won''t need to use them all that often and will probably spend
    most of your time in SuSE Linux at the command prompt, not in XWindows. You can
    get by having only 32MB to allocate to either Windows or SuSE Linux, so all you
    need is 96+32=128MB of system memory.


    On the other hand, what if you''re developing and prototyping a Windows 2000 Server-hosted
    e-commerce Web site with the help of VMware? You want to compare how a Windows
    98 computer running Internet Explorer works on the site with how a Linux computer
    using Netscape sees the site. You can use your host OS as the Linux test bed,
    but you''ll need to run virtual machines for both Windows 98 and Windows 2000
    Server. Figure, at bare minimum, you''ll want 128MB for Windows 2000 and 32MB
    for Windows 98, so 96+128+32=256MB!


    # Drive Space: You''re Providing for Two (or More)


    Your CPU is primed and powerful enough to handle even the most demanding OS, and
    you have enough memory to run Windows 2000 Server twice over. But if you don''t
    have space to install the guest operating system and some applications, you''re
    not going anywhere.


    VMware''s default, and easiest to use, storage option uses virtual disks, or "disk
    images" as they are commonly known.


    Virtual disks can be located in any Linux directory you have authority to access,
    although it is best to place them on a local disk, rather than somewhere across
    a network. In Figure 3.2, you can see the standard VMware disk configuration interface.
    VMware can create virtual disks up to 2GB in size, which is enough to install
    any guest operating system and at least a modest amount of data and programs.


    Virtual disk: A virtual disk is a very large file in a Linux directory that acts
    as a hard drive in a virtual machine. It can be up to 2GB in size. Virtual disks
    are also called disk images or file disks in emulator parlance.


    > Because a VMware virtual machine has both a dual-channel IDE controller that
    can see up to four hard drives and a SCSI controller that can see up to seven
    hard drives, it is possible to attach eleven 2GB virtual disks to a VMware session—provided,
    of course, that you have 22GB of space on your computer!


    Actually, you don''t need 22GB of disk space to get started. Virtual disks were
    designed by some clever people. Although their maximum size is 2GB (you can define
    them to be smaller if you want), virtual disk files don''t consume all that space
    right away; they grow as data is added to the virtual drive, up to the maximum
    value you selected when you created the drive.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/b2b6702758c230ce537468351fc8af15_60_0.png)


    Figure 3.2 VMware''s virtual disk configuration screen.


    You face two different questions. First, do you have enough free space on your
    computer? Second, how will you allocate it?


    # Making Room


    Two gigabytes is a pretty convenient number. It''s considered the bare minimum
    for Windows 2000; it gives you plenty of breathing room in other Windows versions,
    Linux, and FreeBSD; and of course it''s extremely luxurious for Windows 3.1 and
    DOS. Unless you''re miserly by nature with disk space, it''s a good idea to set
    aside at least a full 2GB virtual disk for each of your non-DOS virtual machines.


    > Disk space required for basic installation ranges from just a couple of megabytes
    for a DOS installation, to about 160MB for a complete Windows 98 install, to nearly
    a gigabyte for Windows 2000 Server. Depending on the software you choose to install,
    Linux virtual machines can fall anywhere in between.


    If you don''t have that kind of space to go around, it''s time to add another
    hard drive to your system. Most PCs have two IDE controllers, which can support
    two drives each. You already have at least one hard drive installed, and most
    likely have a CD-ROM drive attached as well, so that leaves two open spots.


    If your IDE chains are full, but you have a very large PC case, you can add a
    low-cost spare IDE controller board to your PC (they practically give them away)
    and put in another drive.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'These days, prices on hard drives are so low, they’re insane, so don’t skimp.
    Better to have too much space than not enough. You can always fill it, but buying
    yet another drive is a hassle.


    You can also invest in a SCSI card. (You can get a good deal for $40 or less,
    and most SCSI cards work well in Linux.) SCSI drives as a rule are more expensive
    than IDE drives, but they can also be easily mounted in an external case, something
    you would never want to do with an IDE drive.


    # Allocating Drive Space


    Now that you have gigabytes upon gigabytes of free space, you have to choose what
    to do with it.


    You can stick with 2GB virtual disks. They’re easy to make, because when they
    expand they probably won’t always consume the full 2GB, and they’re also the most
    well-supported form of storage in VMware. Because the virtual machine’s IDE and
    SCSI controller can combine to give you 22GB of storage, that might be enough.


    # Raw Disks


    If you need more than 2GB in your virtual machine and you don’t want to do it
    by attaching loads of 2GB virtual drives, you have a couple of other options.
    I mentioned raw disks in an earlier chapter. When you use raw disks, you give
    VMware direct control of a real hard drive and real hard drive partitions. This
    is more difficult to configure (discussed in Appendix A, “Advanced VMware Configuration”)
    but provides a speed gain as well as the ability to break the 2GB-per-partition
    barrier.


    Not only is raw disk support more complicated to set up than disk images, but
    it is also considered experimental on SCSI drives. You should familiarize yourself
    with VMware using virtual disks before you attempt to set up raw disks, especially
    on SCSI drives.


    If you do decide to set up a raw disk, it’s probably easiest to start with a newly
    installed hard drive or at least one that can be completely erased and dedicated
    to VMware. Not only is it easier to work with and less heartbreaking if you make
    a mistake, but also it allows you to set up the first, primary partition as a
    Windows boot drive for a Windows virtual machine. Windows insists on booting from
    the first partition on a drive.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Plain Disks


    Another option is an interesting compromise between virtual disks and raw disks.
    VMware calls them "plain disks," which is extremely inappropriate because they
    are in fact rather complicated.


    Plain disks are formed by linking together several large files similar to virtual
    disks. You can also assign a plain disk to incorporate data from a real hard drive
    partition (similar to how raw disks work).


    The advantage of plain disks is that they can be more than 2GB in size, and the
    large virtual disk files that make them up can be scattered across different local
    hard drives on your Linux PC. (Regular 2GB virtual disk files must fit entirely
    on a single partition.)


    You need to do some digging in the VMware Configuration Editor if you want to
    use plain disks because there is presently no wizard-driven way to create them.


    The major drawback to plain disks, other than the tricky setup, is that they immediately
    consume the entire amount of space you allocate to them, unlike a standard virtual
    disk, which grows as you add data.


    > Plain disk support is considered experimental. You should familiarize yourself
    with VMware using virtual disks before you attempt to set up plain disks.


    # Conclusion


    You know what VMware is, how it works, and why you want to use it. Having read
    this chapter, you now understand what it asks of your computer and how you can
    best prepare your PC for the significant task that awaits. If you need a refresher,
    see Table 3.1 for a summary of a model VMware PC.


    It''s finally time to install VMware! Get out the CD included with this book,
    if you haven''t already, and fire up your PC. In the next chapter, you''ll see
    step-by-step how to introduce your computer to the world of virtual machines.


    In Chapter 4, you''ll learn how to install VMware on your system from the included
    CD-ROM. If you need to run to the computer store before your PC is ready, now
    would be a good time.


    Plain disk: A storage device for a VMware virtual machine. Plain disks can be
    larger than 2GB and can be built out of a regular disk partition (such as a raw
    disk), several large files similar to virtual disks, or both


    ![](img/b2b6702758c230ce537468351fc8af15_62_0.png)


    ![](img/b2b6702758c230ce537468351fc8af15_62_1.png)'
