- pgno: 317
  md: '# Conclusion


    It may seem humble, or a backwards OS best left in the past, but if you are at
    all a computer enthusiast, I suspect you''ll be quite pleased to see DOS up and
    running once more.


    No, I don''t think that you should spend all your time on it, or that it is by
    any means the best use of your investment in VMware, but a DOS virtual machine
    has a surprising amount of power and flexibility. It also gives you a good excuse
    to de-mothball all that old software you have lying around.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Chapter 15: Playing Games with VMware


    The bad news: compatibility hurdles


    The good news: games that work


    Configuration tips for games'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'It’s always been a badge of pride for game developers to push computer hardware
    to its limits and beyond, employing tricks and programming techniques that can
    be difficult enough for native hardware to handle, let alone an emulator or virtual
    machine. But despite the hazards, VMware can provide an adequate game platform—if
    you do your homework and select the right games.


    I don’t expect you to make a major investment in VMware just to play games. In
    truth, despite my earlier criticism of dual booting and keeping a second computer
    on your desk, both make for a more reliable gaming experience than does VMware.


    Still, you’ve got VMware, you know what it’s capable of, and you want to go beyond
    word processors and database programs. Here’s what you need to know.


    > When I talk about using VMware for gaming, I specifically mean DOS and Windows
    95/98/NT virtual machines. The game selection for FreeBSD is rather minimal, and
    virtually anything you can find would be duplicated for Linux. There are relatively
    few games for Windows 3.1, and most will run as well, if not better, in 95/98/NT.
    Using a Linux VM as a gaming platform is not ideal because of the emulation overhead
    it creates, unless you are extremely concerned a game might cause a catastrophic
    system crash that you want to isolate from the host Linux OS.


    # The Bad News: Compatibility Hurdles


    There’s no point in sugar-coating it: A substantial number of games simply will
    not work in VMware.


    For DOS games, you can forget about titles that require EMS (expanded) memory,
    as well as any that require screen resolution above 320×200 at 256 colors or 640×480
    at 16 colors. Included under this heading are also games that were released after
    1995 and can be installed in Windows but need to exit Windows completely to run.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/b2b6702758c230ce537468351fc8af15_320_0.png)


    Figure 15.1 Descent, from Interplay, a fast-action 3D game that runs well in VMware.


    On the other hand, games released in the mid to late 90s usually do not require
    EMS because programmers had learned to make more efficient use of conventional
    and XMS DOS memory. Some of these games run at higher resolutions, such as 640x480
    at 256 colors, or they access the video chip in ways not supported by VMware.
    Generally, if a game claims it requires SVGA resolutions in DOS mode, it will
    not work in VMware.


    Some older DOS titles might also have a difficult time properly identifying and
    using the virtual SoundBlaster 16. Newer titles that offer "auto-detection" tend
    to do a better job. It''s largely hit-or-miss, but you might be forced to listen
    to the beeps and squawks of the PC speaker instead of more soothing melodies.


    For Windows games, the primary problem is games that require DirectX, which in
    the past few years has become extremely common. The VMware SVGA driver does not
    support DirectX calls, so DirectX games will almost certainly fail to run. You
    can experiment at your own risk, but it will probably be cheaper, and less frustrating,
    to simply avoid games labeled "Requires DirectX."


    These incompatibilities are what could be termed "behind-the-times" problems:
    VMware''s virtual hardware is not as current and compatible as it could be. One
    more potential problem can show up if you try playing older games: being too fast
    for your own good. Some older DOS games were written with processors such as a
    386/25, 286/12, or even slower in mind. Because your computer is capable of running
    VMware, it is literally dozens, possibly hundreds of times faster in raw CPU power
    than those workhorses of the 80s.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/b2b6702758c230ce537468351fc8af15_321_0.png)


    Figure 15.2 King''s Quest I from Sierra, a true classic and one that runs well
    even on fast computers in VMware.


    On a real computer, you would have the option of shutting off your CPU''s caches
    to slow down the works, but because you are sharing the CPU between VMware and
    your host Linux OS, this is not possible. VMware''s BIOS does not include a cache
    disable option, and it is not recommended to try using a cache shutoff program
    in DOS or Windows. You can use other tricks to slow down your virtual machine
    to deal with an old game, but your options are more limited because you do not
    want to cripple the host in the process.


    > It is possible to support SVGA in DOS and DirectX in Windows using a virtual
    machine or emulator. There are PC emulators for PowerMacs that do both. To date,
    VMware has focused on professional-minded functionality and stability, but a well-worded
    letter might help convince it that the market is expanding.


    # The Good News: Games That Work


    So, what''s left? Only thousands of games! No, perhaps not all your favorites,
    but probably enough to keep you entertained on a fair number of Sunday afternoons.


    If you have a large stock of games already in your library, simply experiment.
    Install them, and try launching them. At the absolute worst, an incompatibility
    problem might lock up the guest OS, requiring you to manually power down the virtual
    machine. More likely, the game will simply refuse to run or crash back to the
    DOS prompt or Windows desktop.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/b2b6702758c230ce537468351fc8af15_322_0.png)


    If you need to go shopping, remember to be careful of system requirements. Although
    a few games that are labeled for DirectX will actually work in VMware (such as
    Blizzard''s StarCraft), this is much more the exception than the rule. If you''re
    searching bargain bins for latter-day DOS titles, watch for EMS (expanded memory)
    requirements and references to SVGA modes or screen resolutions such as "640 by
    480 pixels and 256 colors."


    Smart shoppers might want to start with classic game compilations or budget re-releases—games
    a few years old repackaged in CD jewel cases or small boxes and priced at $15
    or less. Almost every major game publisher has its own budget line or box set
    collections. Your taste may vary, but I can recommend, from experience, sets such
    as Sierra''s Roberta Williams Collection, Police Quest and Quest For Glory, and
    Interplay''s 10th and 15th Anniversary collections. You can''t count on every
    game in every collection to work flawlessly, but there should be enough to make
    the purchase worthwhile.


    # Configuration Tips for Games


    The first thing to remember is that many games come with system-configuration
    and memory-management tips, and most of them are perfectly relevant for VMware
    as well as a real PC. The exception is anything that tells you to use EMM386.EXE
    or create expanded memory, which you already know is off-limits. Many games come
    with suggested boot sequences or even tools to create custom boot floppy disks
    that should leave you with enough memory and system resources to run the games.
    Try those "official" suggestions before you start suspecting VMware of additional
    compatibility problems.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# DOS Gaming Configuration


    This section covers games designed for pure DOS mode, which includes pre-Windows
    95 titles, as well as those you might be able to install or launch from Windows
    but have to run from a pure DOS environment, either by exiting to DOS first or
    by shutting down Windows as soon as you double-click the icon.


    > Some classic game compendiums allow or require you to install games from Windows
    95 or better, but they actually only run in a pure DOS setting.


    Memory configuration is the major headache for DOS games. The good news is that
    for games that work at all in VMware, the default memory configuration of most
    MS-DOS and DR-DOS installations works perfectly well. In general, this ideal memory
    configuration consists of these two lines in the DOS CONFIG.SYS file:


    ```

    DEVICE=C:\DOS\HIMEM.SYS (or C:\DRDOS\HIMEM.SYS)

    DOS=HIGH, UMB

    ```


    As long as you allocate at least 8 to 16MB to your DOS virtual machine, you should
    rarely, if ever, have a problem with not having enough overall memory. You might
    be too low on conventional memory, which is defined as the first 640KB of memory
    available to DOS and the space in which programs are directly executed. By typing
    mem at a DOS prompt, as shown in Figure 15.4, you can get a sense of how much
    conventional memory is available.


    ![](img/b2b6702758c230ce537468351fc8af15_323_0.png)


    Figure 15.4 The mem command tells you how much conventional memory is available
    to run DOS games.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'In MS-DOS, the readout is slightly different, but the important detail is the
    "conventional" memory setting, which DR-DOS also summarizes as "Largest executable
    program." 591KB is sufficient for almost any program. How do you get that much
    free memory?


    +   - Use the command mem /c in DOS to view the individual components that are
    sucking up your free memory, and target those for removal.

    +   - Remove unimportant or extraneous entries in your AUTOEXEC.BAT and CONFIG.SYS
    files by inserting the word rem in front of them. In AUTOEXEC.BAT, you might consider
    removing items such as SMARTDRV or NWCACHE (disk caching software, which can speed
    disk access but at a memory price), any DOS virus checker you might be running,
    and your mouse driver. In CONFIG.SYS, you might remove ANSI.SYS (unless you are
    running a text-based game that uses colors and text effects) and remove or reduce
    the number in the BUFFERS entry. (It controls the RAM hard drive buffer, which
    also speeds disk access by using RAM.)

    +   - If you don''t run your mouse driver in AUTOEXEC.BAT, you might not need
    to start it; some games incorporate their own mouse drivers or don''t support
    the mouse at all. A mouse driver can take up 20KB or more of conventional memory.

    +   - If you are using the OAKCDROM.SYS CD-ROM driver in DOS, switch to the Mitsumi
    driver listed in Chapter 14, "Installing DOS and Windows 3.1 in VMware." It requires
    considerably less memory and is equally compatible. If you are really pressed
    for memory and do not need CD-ROM support for your game, you can command out the
    CD-ROM driver from CONFIG.SYS and the call to MSCDEX or NWCDEX in AUTOEXEC.BAT.

    +   - The DOS command line requires memory to run, but not all DOSs take up the
    same amount of memory. In general, DR-DOS is the most frugal, followed by MS-DOS
    6, with the Windows 95/98 MS-DOS mode in last place. If you are having memory
    problems trying to use DOS in a Windows virtual machine, switch to a dedicated
    DOS virtual machine with MS-DOS 6.22 or DR-DOS.

    +   - If you are using DR-DOS, do not use the setup program''s setting for "Setup
    DR-DOS for Best Games Performance" because it involves the use of EMM386.

    +   - The DOSIDLE program also occupies some memory. If you need a few extra kilobytes,
    don''t run it.


    After you''ve conquered memory, your other major headache is likely to be sound
    support. Although VMware provides a virtual SoundBlaster 16 card, DOS games might
    not always be able to take advantage of it. Some older games might not list a
    SoundBlaster 16; in that case, choose SoundBlaster "classic" support, rather than
    SoundBlaster Pro. The SoundBlaster 16 is not directly compatible with the SoundBlaster
    Pro.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'When a game speaks of a "music card," that generally means it is looking for
    a MIDI device, and VMware''s sound emulation does not provide MIDI. If you are
    playing a DOS game that asks you to configure separate "sound" and "music" cards,
    you need to set the music card to PC Speaker or Silence.


    If you do have a problem with excessive speed, try using the program MOSLO.COM,
    which some classic collections include on CD-ROM. You can also download it from
    http://www.hp aa.com/moslo.


    Finally, try to play games in full-screen mode. Video performance is much faster.


    # Windows Gaming Configuration


    Aside from the very obvious piece of advice (make sure you have installed VMware
    Tools and the custom video driver before you even dream of playing games in Windows!),
    you face a couple of configuration concerns if you want to play compatible Windows
    games through VMware.


    In Windows, as long as you have the Windows SoundBlaster 16 driver loaded, audio
    should work more or less without fail unless the game requires DirectSound features.
    But the emulation layer between the virtual machine and your real Linux sound
    card is rather complex and time-consuming, and you might find that games with
    frequent sound effects or digitized speech stutter the sound, cause jerky video
    motion, or both. You might need to get selective about when you turn on sound
    and rely on text cues or subtitles more often than you might like.


    ![](img/b2b6702758c230ce537468351fc8af15_325_0.png)


    Figure 15.5 StarCraft, one of the most addictive multiplayer games in recent years,
    running in a Windows virtual machine.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'By now, I have made it abundantly clear that DirectX-loving games will not
    work in a Windows virtual machine. Unfortunately, that does not necessarily mean
    that all non-DirectX games will be "load and go." A number of non-DirectX games
    require very specific screen modes: often 640x480 at 256 colors. This is by no
    means a challenge for the VMware video driver (and almost certainly not a challenge
    for your video card), but it is a problem if you are running your Linux system
    in 16- or 24-bit color, which many, if not most, Linux users do.


    A Windows virtual machine cannot change the color depth of your XWindows desktop,
    so if you plan to play a game that requires 640x480x256, you need to start XWindows
    at 8-bit color depth before you try to play the game.


    Depending on the settings you used when you installed Linux, you might have 8-bit
    color modes available. Exit XWindows to the Linux console, and try to re-launch
    X using the command


    ```

    startx -- -bpp 8

    ```


    If you have 8-bit screen modes available, you should start in a 256-color XWindows
    desktop, and the Windows virtual machine should have no trouble switching to the
    right screen mode. You might see a minor error message when VMware launches, and
    the customary VMware configuration window backdrop will not appear, but VMware
    works perfectly well in 256 colors.


    If X does not start in 256 colors, you might not have any 8-bit screen modes configured.
    If you like, you can use the X configuration tool of your choice, such as XF86Config
    or Xconfigurator, and add a few 8-bit modes. (It is probably a good idea to include
    640x480, as well as your normal high-resolution mode.)


    ![](img/b2b6702758c230ce537468351fc8af15_326_0.png)'
  merge: -1
  img_proc: true
- pgno: 327
  md: "Alternately, if you have a fairly standard XFree86 setup, you should be able\
    \ to make the changes manually. To edit your X configuration to include 8-bit\
    \ (256-color) modes, follow these steps:\n\n+   1. Locate your XF86Config file.\
    \ Ninety-nine percent of the time, you will find it in /etc or /etc/X11.\n+  \
    \ \n+   2. Edit the file. (You might need to use the su command to become root\
    \ to have the right to edit or save your changes.)\n+   \n+   3. At the very bottom\
    \ of the configuration file, you should see a listing for “accelerated servers,”\
    \ along with an entry for your Linux PC’s video card. Look at the area marked\
    \ Subsection “Display”.\n+   \n+   4. If you do not have 8-bit screen modes, chances\
    \ are you have 16- or 24-bit depth modes instead. To add 8-bit modes, first copy\
    \ and paste the lines between Subsection “Display” and EndSubsection just below\
    \ the EndSubsection line.\n+   \n+   5. In the newly pasted subsection, change\
    \ the Depth line to 8.\n+   \n+   6. In the newly pasted subsection, change the\
    \ Modes entries to those appropriate to your video card. Be sure to enclose each\
    \ entry in quotes, with a space between each one. A common entry might be “640x480”\
    \ “800x600” “1024x768”.\n+   \n+   7. Re-start X using startx -- -bpp 8. As with\
    \ DOS games, it’s better to play games in full-screen mode to optimize video performance.\n\
    \n![](img/b2b6702758c230ce537468351fc8af15_327_0.png)\n\n*Figure 15.7* A sample\
    \ XF86Config file, including the 8-bit screen modes necessary for some Windows\
    \ games."
  merge: -1
  img_proc: true
- pgno: 328
  md: '> Figure 15.8 Old and not much to look at, but Wasteland from Interplay is
    widely regarded as one of the greatest RPGs (role-playing games) of all time.


    Of course, there is still a catch. VMware sometimes has a difficult time sharing
    the 256-color palette between the Linux host and the Windows guest when a game
    starts re-allocating colors at will, and you might see screens that look to be
    full of garbage or wildly inaccurate colors. If this happens, switch out of full-screen
    mode, click on the Linux desktop, click on the VMware window, and then switch
    back to full-screen mode. This should correct the problem, although you might
    need to do it again every time the game changes its palette. It is inconvenient,
    but manageable.


    > Figure 15.9 The original Quake runs in VMware...although you also can get it
    for Linux, and it runs faster.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Conclusion


    It''s clear enough that VMware was not designed with gaming enthusiasts in mind,
    but it''s also not out of the question to play games on VMware, either. Despite
    some glaring holes in game-related hardware compatibility, there are plenty of
    classics as well as some fairly recent titles that you can enjoy when you tire
    of the challenges of Samba networking and cross-platform application testing.


    As for the limitations, there are two ways to look at it. If it means a lot to
    you to have better DOS and Windows game compatibility, tell VMware, Inc. about
    it. At the same time, there is also a small but growing commercial Linux game
    market, with mainstream Windows titles being ported very quickly to native Linux
    versions. This should, over time, reduce the sting considerably.'
  merge: -1
  img_proc: true
