- pgno: 284
  md: 'However you choose to get the archive onto the FreeBSD virtual disk, here''s
    what you do next:


    +   1. From a shell-only login (don''t start XWindows yet), cd to the directory
    containing the FreeBSD toolkit (I suggest you put it somewhere like /usr/vmware),
    and type tar xzf tools-for-freebsd-xxx.tar.gz, replacing the xxx with the appropriate
    number in the filename.


    +   2. Step 1 creates a new subdirectory, vmware-freebsd-tools. Type cd vmware-freebsd-tools.


    +   3. Become root using the su command. (You might simply want to log in as root
    before performing this procedure; normally people recommend against it, but it''s
    a fresh new installation of the OS. If something does go terribly wrong, there''s
    no big loss.)


    +   4. Type ./install.pl to start the installation.


    +   5. You should be able to simply answer with the defaults when the tools installer
    asks for the paths to various pieces of software.


    +   6. When the installation is complete (see Figure 13.19), reboot the FreeBSD
    virtual machine. (Just type reboot.)


    +   7. Before you can run X, you need to adjust the XF86Config file, usually found
    in /etc on FreeBSD systems. Edit the file /etc/XF86Config.


    +   8. Scroll down to the heading labeled Section "Monitor" and ensure that there
    is a listing for the screen resolution you want to use. (The format is ModeLine
    "resolution," where resolution should ideally match the screen size you use in
    Linux.) Make a note of the name in quotes after Identifier because you need it
    in Step 10.


    ![](img/b2b6702758c230ce537468351fc8af15_284_0.png)


    Figure 13.19 When the VMware Tools installation is complete, as shown here, type
    reboot.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '9. Beneath should be a heading labeled Section "Device." It should consist
    of three lines:


    Identifier "SVGA"

    Chipset "generic"

    EndSection


    If anything else appears, replace it with those three lines.


    10. The next section should be Section "Screen." Adjust it so that it contains
    only this information:


    Driver "accel"

    Device "SVGA"

    Monitor "<type the name from Identifier in Step 8>"

    Subsection "Display"

    Modes "<type the screen modes, as listed in Step 8, that you want to use in X>"
    "<enclose each screen mode in its own set of quotes>"

    ViewPort 0 0

    EndSubsection

    EndSection


    11. X should be ready to run with the command startx. Depending on your choice
    of window manager when you installed FreeBSD, you may see GNOME, KDE, or another
    desktop system. Figure 13.20 shows a sample FreeBSD desktop running KDE.


    12. Once inside X, you can run the VMware toolbox to manage the mouse pointer
    and GUI behavior and to start disk shrinking operations by typing vmware-tools
    at any terminal prompt.


    > If you want to use the VMware toolbox, you need to have Tcl installed on your
    FreeBSD guest. It might not have been included in your installation sequence.
    If vmware-toolbox fails to run with a Tcl error, you can install it from the FreeBSD
    CDs by running the utility /stand/sysinstall, selecting Configure, Packages, and
    searching for tcl.


    The VMware Tools window in FreeBSD is a clone of the Linux version. See Chapter
    10 for guidance.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/b2b6702758c230ce537468351fc8af15_286_0.png)


    Figure 13.20 Installing the accelerated X server in FreeBSD isn''t easy, but the
    resulting display is rewarding.


    # Sharing Between a Linux Host and a FreeBSD Guest


    Because of the strong similarities between Linux and FreeBSD, Chapter 10 tells
    you just about everything you need to know about sharing data between your Linux
    PC and your new FreeBSD virtual machine. There are only a few minor technical
    details you should be aware of.


    The major difference in taking stock of your network configuration is that the
    syntax for FreeBSD''s ifconfig command is slightly different. To obtain the right
    level of detail, type ifconfig -a. Instead of looking for eth0 as you would with
    a Linux guest, look for ln0.


    FreeBSD''s default FTP server is among those that automatically deny service requests
    from users claiming to be root, so you need to either create new user accounts
    using /stand/sysinstall or other administrative tools or consult FreeBSD documentation
    to remove the security restriction.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/b2b6702758c230ce537468351fc8af15_287_0.png)


    > Even if you don’t install any networking, there is still an easy way to exchange
    files between your Linux PC and FreeBSD’s virtual disk. It involves mounting the
    virtual disk as a Linux-readable file system. The process for FreeBSD guests is
    virtually identical to Linux guests, so see the section of Chapter 10 titled “Mounting
    a Virtual Disk on the Host” for details.


    # Conclusion


    FreeBSD offers an interesting alternative to Linux on the desktop. Although the
    current momentum for end-user software favors Linux, a variety of interesting
    server and infrastructure applications are uniquely tailored to FreeBSD. As FreeBSD
    matures, you might be interested in incorporating FreeBSD into your current computing
    environment, and a VMware virtual machine provides a safe, efficient way to test
    the marriage.'
  merge: -1
  img_proc: true
