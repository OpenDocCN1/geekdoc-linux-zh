- pgno: 201
  md: "17. Test the VMware Tools. Open a shell or terminal window and type vmware-toolbox\
    \ & at the prompt. (The & detaches the process from the shell so you can enter\
    \ other commands later.) If you do not run VMware Tools as root, you will not\
    \ be able to access all its features. Use the su command if you feel the need\
    \ to run VMware Tools as root.\n\n# The Adventures of Screen Resolution in Linux\
    \ Virtual Machines\n\nSome of the concepts in this book are, I must admit, more\
    \ than a little tricky. If you’ve made it this far, you’ve had to learn a lot.\
    \ Get ready for something really confusing.\n\nThe VMware Tools XFree86 server\
    \ inside a Linux virtual machine reads the settings of your host’s XFree86 server\
    \ to come up with an optimum display size. This is all well and good. The problem\
    \ comes when you want your Linux VM to have different display properties than\
    \ your host PC.\n\nIn short, it’s tough. The guest XFree86 server starts out by\
    \ exactly conforming to the specifications of your host’s XFree86 server. To make\
    \ any changes, you will need to edit the file /etc/X11/XF86config.vm in your virtual\
    \ machine.\n\nNote that you cannot alter the color depth that the virtual machine\
    \ runs in, only the resolution.\n\nOpen /etc/X11/XF86config.vm in a text editor,\
    \ and scroll to the very last section, which should be introduced with\n\n```\n\
    Section \"Screen\"\n    Driver \"accel\"\n```\n\nYou should see several lines\
    \ starting with Modes, but only one will not have a # in front of it (indicating\
    \ that it is uncommented, and the only line read by the guest’s X server at startup).\
    \ Modify that line to include any screen resolutions you want to make available\
    \ to the virtual machine. Be sure each entry is enclosed in quotes and separated\
    \ by a space. They should be valid screen resolutions for your monitor and display\
    \ card, preferably standard modes also in use by the host X server.\n\nA line\
    \ like\n\n```\nModes \"1024x768\" \"800x600\" \"640x480\"\n```\n\nis functional\
    \ and practical."
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Depending on the virtual machine''s configuration, the program might not be
    in your default path. If you need to use the whole path, type

    `/usr/X11R6/bin/vmware-toolbox &`.


    You should start VMware Tools every time you run your Linux virtual machine and
    leave it open for the entire session. When you get comfortable, you might want
    to consider adding the command to your Linux or XWindows startup script.


    The VMware Tools window in Linux is virtually identical to the Windows version,
    and like the Windows version, it offers certain functions not available from any
    other settings menu.


    # Managing Virtual Devices


    VMware Tools (see Figure 10.17) provides more convenient access to the Devices
    settings also found in the VMware window toolbar. In full-screen mode, the toolbar
    is inaccessible, making VMware Tools the only way to attach and release devices
    without dropping back to windowed mode with Ctrl+Alt+Esc.


    This screen controls four types of virtual devices:


    +   - RTC, the Real Time Clock. All PCs have an RTC device, but VMware has to
    share the benefits of good timekeeping. Normally, you should leave this setting
    alone. (In other words, leave the virtual machine attached to the RTC.)


    ![](img/b2b6702758c230ce537468351fc8af15_202_0.png)


    Figure 10.17 VMware Tools for Linux, shown here running on Corel Linux.'
  merge: -1
