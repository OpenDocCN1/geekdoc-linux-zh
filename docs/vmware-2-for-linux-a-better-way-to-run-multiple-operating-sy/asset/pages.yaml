- pgno: 131
  md: 't sure was silly when people camped outside computer stores waiting for the
    release of Windows 95. But it was the first truly successful attempt to bring
    a full-time GUI-based operating system to consumer PCs, and its mark is indelible.
    It is not at all surprising that even ardent Linux users have occasion to spend
    some time in Windows 95.


    Windows 95 is as far back into operating-system history that VMware offers full
    support. Windows 3.1 support is stable but offers only limited graphic display,
    and support for MS-DOS and clones is stable but not 100 percent and suffers from
    restricted video modes.


    # Choosing Between Windows 95 and Windows 98


    Your gut instinct might be to stay as modern as you can and make Windows 98 your
    primary virtual machine operating system. There are some valid reasons to go with
    Win 95 instead, however:


    +   - Lower price. Although it’s more difficult to find on store shelves, if you
    need to start from scratch and buy a Microsoft operating system, chances are that
    when you find Windows 95, it will cost less than Windows 98.

    +   - Nearly equivalent. Although some programs run only on Windows 98, the vast
    majority of popular Windows software runs transparently between Windows 95 and
    98. In fact, some of the major improvements to Windows 98, such as better USB
    support, are completely irrelevant in VMware.

    +   - Lower resource requirements. Windows 95 can be reasonably run in 16MB of
    RAM. More is always better, of course, but it can be done. It also requires much
    less hard drive space for a basic install; you can even install it from floppies!

    +   - Fewer bundled components. Some people really don’t like how Internet Explorer
    became tied to Windows 98. Windows 95 treats all browsers equally.

    +   - Faster install. Because it’s just a whole lot smaller than Windows 98, it’s
    faster to get up and running.


    Windows 95 went through a few different revisions over its three-year life. In
    general, any revision should be fine in VMware, although some Windows applications
    prefer Windows 95 Revision B (also known as OSR2) or greater.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Windows 95 has a known incompatibility with the AMD K6-2 chip at speeds of
    350MHz and above. It is considered transient in that it may not show up every
    time you boot Windows 95, but the problem was severe enough that I actually had
    to use a second PC to write this chapter. Although a patch is available from Microsoft
    and AMD, it really only works with Windows 95 OSR2, and even then it does not
    work particularly well in VMware. If you have a K6-2 CPU, I strongly urge you
    to use Windows 98. This problem does not affect K6, K6-III, or AMD Athlon processors.


    If you''re unsure what version of Windows 95 you have installed, you can check
    the System Properties window after installation. Right-click the My Computer icon
    and select Properties (see Figure 7.1 for an example). You should see a string
    starting with 4.00.950. If it has no accompanying letter, you have the original
    Windows 95. An A or B indicates you are using intermediate revisions, which correct
    some important bugs. C (also OSR2.5) shows that you are using the most up-to-date
    major release of Windows 95, which integrates Internet Explorer into the operating
    system much as Windows 98 does.


    You can install incremental bug fixes and patches from Microsoft in your virtual
    machine, just as you would on a regular computer.


    ![](img/b2b6702758c230ce537468351fc8af15_132_0.png)


    Figure 7.1 Check this dialog box for the Windows revision number.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Preparing the Virtual Machine


    If Windows 95 is handy and dandy, you need to create a new virtual machine.


    > This installation sequence assumes you will be using a Windows install disk
    labeled "For Distribution with a new PC only" or similar. There are some minor
    differences in upgrade editions.


    # Starting with the Wizard


    Begin the Windows 95 virtual machine installation by creating a new VM configuration,
    starting with the Configuration Wizard.


    +   1. If you''re not already in VMware, start the main program by typing /user/bin/vmware
    at a command prompt.

    +   2. Launch the VMware Configuration Wizard by clicking Wizard in the File menu.

    +   3. Click Next to clear the first greeting screen. VMware presents the Guest
    OS selection screen, shown in Figure 7.2

    +   4. Select Windows 95 from the list of guest operating system choices, and
    then click Next to proceed.


    ![](img/b2b6702758c230ce537468351fc8af15_133_0.png)'
  merge: -1
  img_proc: true
- pgno: 134
  md: "If you have an upgrade edition of Windows 95, you should select the operating\
    \ system you will install first. Then, at each upgrade stage, edit the Guest OS\
    \ setting in the Configuration Editor before proceeding.\n\n+   5. Enter a path\
    \ to the new directory that will house the VMware configuration files as well\
    \ as the virtual disk. By default, VMware asks you to create a new directory called\
    \ `/vmware/win95` on your home directory.\n+   \n+   6. VMware asks whether you\
    \ want to create a new virtual disk or use an existing physical disk. Unless you\
    \ are familiar with the advanced disk and configuration modes described in Appendix\
    \ A, “Advanced VMware Configuration,” it is best to accept VMware’s offer to create\
    \ a new virtual disk, indicated in Figure 7.3. Click Next.\n+   \n+   7. Enter\
    \ a size for the new virtual disk. Although 2,000MB is the default, you can go\
    \ as high as 2,047MB. Remember that the disk grows as data is added, but you cannot\
    \ change its maximum size later. Click Next to proceed.\n+   \n+   8. VMware should\
    \ detect your CD-ROM. You need a CD-ROM to install Windows 95, so leave the default\
    \ settings as is (to enable CD-ROM access and make it available when the virtual\
    \ machine boots), and click Next.\n+   \n+   9. VMware asks the same question\
    \ about floppy access. Unless you have a compelling reason to disable the floppy,\
    \ leave this setting alone as well. Click Next.\n\n![](img/b2b6702758c230ce537468351fc8af15_134_0.png)\n\
    \n*Figure 7.3* Most users will want to create the largest virtual disk possible,\
    \ 2 gigabytes."
  merge: -1
  img_proc: true
- pgno: 135
  md: '10. The wizard asks how the virtual machine should be able to access the network
    (see Figure 7.4). If you plan to keep the Windows VM completely isolated, you
    can click No networking. If you have an Ethernet card installed and your PC is
    on a LAN, use Bridged networking, which lets the virtual machine share your Ethernet
    card and appear as a standalone computer on the network. Host-only networking
    allows Samba file sharing between the VM and your Linux PC (provided you installed
    the VMware Samba server at installation or you have one of your own running),
    and Bridged and host-only networking combines the two. If you have a LAN, stick
    with Bridged for now. If you do not, use Host or none. Click Next to reach the
    final step.


    ![](img/b2b6702758c230ce537468351fc8af15_135_0.png)


    Figure 7.4 The network configuration screen helps you prepare VMware to communicate
    with your Linux host OS and the rest of the world.


    Even if you don’t install any networking, there is still an easy way to exchange
    files between your Linux PC and virtual disks. It involves mounting the virtual
    disk as a Linux-readable file system, which is covered in depth in Chapter 9,
    "Using Your Windows 95/98 Virtual Machine." I personally think it’s easier and
    more convenient than host-only Samba networking for most file-sharing needs.


    11. The wizard summarizes the virtual machine it will create. See Figure 7.5 for
    a sample. If everything looks appropriate, click Done.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/b2b6702758c230ce537468351fc8af15_136_0.png)


    Figure 7.5 Your configuration may vary slightly, depending on the choices you
    make in the Configuration Wizard.


    # Adjustments with the Configuration Editor


    The wizard is reliable, but not thorough. You should make a quick stop in the
    Configuration Editor to make a few minor adjustments before you launch the virtual
    machine and start the Windows installation:


    +   1. Open the Configuration Editor in the Settings menu.

    +   2. Verify that the wizard created a Primary Master (P-M) IDE virtual disk
    in the Win 95 configuration directory of the size you created (it might appear
    to be one megabyte less than you specified), and a Secondary Master (S-M) CD-ROM,
    most likely pointing to /dev/cdrom.


    > You might want to come back later and reassign /dev/cdrom to be a virtual SCSI
    CD-ROM drive, but because VMware does not support booting from a virtual SCSI
    CD-ROM and the Windows 95 boot floppy does not support the VMware SCSI controller,
    you need the CD-ROM in virtual IDE mode to install Windows 95.


    +   3. If you want the virtual machine to have direct access to your serial or
    parallel ports, configure them now as described in Chapter 5, "Running VMware
    for the First Time." Remember that serial ports start at /dev/ttyS0, and parallel
    ports start at /dev/lp0 on most Linux machines.

    +   4. If your Linux PC has sound configured and running and you want the virtual
    machine to have sound access, click the Sound option and then click Install in
    the sound configuration window shown in Figure 7.6.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/b2b6702758c230ce537468351fc8af15_137_0.png)


    # Figure 7.6 You must click Install to enable sound support in VMware, because
    sound is always left off by the Configuration Wizard.


    Some versions of Windows might struggle to detect and properly install software
    for the virtual machine’s sound card. If sound is not important to you in your
    Win 95 virtual machine, it might be best to leave the sound device uninstalled.
    If you want to install sound at the same time you do your initial Windows 95 installation,
    and you experience any trouble during your installation, take the following steps:


    +   1. Temporarily remove the sound card from the virtual machine configuration
    by clicking Remove in the Sound portion of the Configuration Editor.

    +   2. Re-install Windows, and then power down the virtual machine.

    +   3. Re-install the sound driver by clicking Install in the Sound portion of
    the Configuration Editor.

    +   4. Power up the virtual machine. It should detect the virtual SoundBlaster
    16 and proceed normally.


    ![](img/b2b6702758c230ce537468351fc8af15_137_1.png)


    +   5. If the wizard’s memory suggestion seems inappropriate (VMware usually suggests
    48MB for Windows 95, unless you have less than that available for virtual machines),
    you can increase or decrease it in the Memory setting, shown in Figure 7.7. 64MB
    is comfortable for Windows, but more is better. Try not to dip below 16; if you
    don’t have 16MB comfortably available for Windows 95, you should upgrade your
    PC’s RAM.


    +   6. You might want to make changes in the Misc settings list, but they are
    best left alone until the operating system is installed and working properly.
    You could assign the redo log directory (say, to a safe place on your system drive)
    if you plan to use undoable or nonpersistent disks in the near future.


    +   7. Click Save when finished in the Configuration Editor.'
