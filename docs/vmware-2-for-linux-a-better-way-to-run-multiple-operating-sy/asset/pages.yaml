- pgno: 26
  md: '# Chapter 1: Understanding a JVM


    A primer on virtual machines and emulators


    VMware versus “dual booting”


    VMware versus DOS and Windows emulators'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'You can buy all the computer hardware you like—the fastest CPU, the biggest
    hard drive, the most memory, and the clearest monitors—but it’s all useless without
    software to run on your computer. Most of the time, the software that runs on
    a computer is limited by how compatible that software is with the hardware inside
    your computer, as well as the operating system you happen to use.


    Software written for Linux will work on any PC running Linux, provided that the
    PC has enough speed, memory, and storage space to support the program. Similarly,
    software written for a Windows 98 PC will run on any PC with Windows 98, as long
    as the PC is physically up to the challenge. By running Windows, Linux, or any
    other operating system on a computer, you make a choice to limit yourself to using
    just the software available for that particular operating system.


    One of the best ways to evaluate the power of a computer is by how much software
    it can run. So naturally, many people want to broaden their horizons.


    Until recently, Linux users faced with the need to run software for another operating
    system had a limited range of choices. They could buy another computer and run
    it side-by-side with their Linux PCs. Of course, this works well but can be very
    expensive, and it is murder on your desk space.


    Linux users also turned to dual booting—generally installing their favorite flavor
    of Linux, as well as the version of Windows they needed most on their PCs or laptops.
    After all, modern hard drives are large enough to support several full OS installs,
    with room to spare.


    Finally, there were emulators such as Wine, Bochs, and DOSEMU. These programs
    enabled users to run a relatively small subset of DOS- and Windows-compatible
    programs inside their Linux environments. But they all suffered from at least
    one fatal flaw—too limited, too unstable, too hard to configure.


    **BUZZWORD**


    Dual boot: Installing two (or more) operating systems on a single computer. Only
    one operating system can run at a time. The user selects which operating system
    he or she wants to run when the computer powers up.


    **BUZZWORD**


    Emulator: A program that, using software or a combination of software and hardware,
    enables a computer to run programs designed for a different operating system and/or
    computer architecture.


    # A Primer on Virtual Machines and Emulators


    Before you can understand the scope and power of VMware, it’s important to understand
    the technology of emulation and virtual machines, how they differ, and how they
    help you expand your Linux PC’s potential.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Emulators


    Generally speaking, an emulator is a program that enables you to run software
    that was not originally intended for your computer''s hardware and OS combination.
    That can be a relatively small step (such as running a Windows program on a Pentium-based
    Linux PC, something that the PC is normally capable of if it isn''t running Linux
    at the time) or a dramatic departure from the norm (such as running Macintosh,
    Apple II, or Commodore Amiga software on your PC).


    Emulators generally, but not always, multitask with the host operating system,
    meaning that your desktop is behaving like two (or more) different computers at
    once.


    To work their magic, emulator authors describe the functionality of a computer''s
    hardware in software. For example, emulating an Amiga on a Pentium-based Linux
    computer requires a complete description of the operation of the Amiga''s 68000-series
    CPU, as well as special code to replicate the Amiga''s custom video display and
    sound capabilities. Inside the emulation window is a virtual computer that believes
    it is an assembly-line fresh Amiga computer, but it is really just a construct
    of the Linux operating system.


    When a program runs inside an emulator, it can''t tell the difference. It doesn''t
    know that it''s being fooled into running on a Linux PC. So it tries to run exactly
    as it would on the real computer it was designed for, calling on a CPU and hardware
    it expects to be there. Of course, that hardware isn''t on your computer. Instead,
    the emulator traps those requests, interprets what the result should be, and sends
    the information back to the program inside the emulator. At the same time, when
    the emulated program sends out video or sound information, the emulator intercepts
    the information and translates it into video and audio that Linux can handle.
    See Figure 1.1 for a (very basic) illustration of the inner workings of an emulator.


    For starters, acceptable emulator performance requires a large amount of system
    RAM, preferably as much available RAM as the target emulation system normally
    needs. Good emulators allow you to select how much you want the emulated computer
    to have. Many emulators also grab much more—several megabytes, depending on the
    emulator—to provide a fast buffer for the intense computations required to run
    an emulation.


    BUZZWORD

    Host operating system: The primary OS your computer boots into. In your case,
    this is Linux.


    ![](img/b2b6702758c230ce537468351fc8af15_28_0.png)


    Figure 1.1 How an emulator works.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Emulated computers also need disk access. Emulating a sophisticated, modern
    computer means it needs its own virtual hard drive, so you have to provide one.
    Most emulators use either a dedicated partition on one of your system drives or
    a file disk. File disks are slower but easier to configure and maintain.


    Emulation is one of the most grueling tasks your computer can undertake. Just
    emulating a foreign CPU is a major undertaking and generally requires that your
    computer have a processor several times more powerful than the CPU you plan to
    emulate. If the emulated computer relies heavily on additional custom hardware,
    such as a special video chip, the power requirements increase even more. Because
    of its custom chips, it took years of development and Pentiums running at hundreds
    of MHz to devise an Amiga emulator that could consistently replicate the experience
    of using a 7MHz Amiga model built in 1987?


    Emulation is very hard work for your PC. The more powerful your base system, the
    more likely you are to get fast emulation.


    If you have a lot of other programs consuming memory and CPU resources on your
    computer, emulation will be slow. Try not to run your emulators on mission-critical
    servers!


    For this reason, some old-style emulators for other computers came in a hardware
    and software combination that included a CPU on a custom expansion board. The
    most common example are the PC emulation boards that Macintosh and Amiga users
    bought years ago, which generally came with an Intel 486 or Pentium CPU.


    # Virtual Machines


    Virtual machines are a special breed of emulator. If you were to poll a group
    of computer scientists and emulation experts on the exact differences between
    an emulator and a virtual machine, you''d likely get several different answers.
    For real-world discussions, however, here''s a rule of thumb to distinguish a
    virtual machine from an emulator: If an emulator does not have a CPU emulation
    component, but rather uses the host computer''s CPU directly, then that emulator
    is a virtual machine.


    The benefit of virtual machines over emulators should be immediately obvious.
    Accessing a CPU directly, instead of having to emulate one, provides an enormous
    speed benefit because there is no translation process: The emulated program runs
    on its native CPU at more or less the same speed it would if it were not running
    inside an emulator.


    File disk: A very large file in a directory on the host OS, used by an emulator
    as a mock hard drive.


    Virtual machine: An emulator that tries to replicate the operation of a complete
    computer system inside another of the same type, sharing a single CPU with the
    host operating system. Not to be confused with a "Java virtual machine," which
    is a different concept not covered in this book.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'There is some overhead, however. The virtual machine still has to provide an
    emulation layer so that keyboard and mouse input and video and sound output function
    properly. The virtual machine might be fooled into believing it controls its own
    I/O devices, but in reality they are still the property of your Linux host operating
    system, so that translation work introduces a modest speed penalty. Figure 1.2
    outlines the basic operation of a model virtual machine.


    VMware is considered a virtual machine (hence the "VM" in VMware). Other popular
    examples of virtual machines include DOSEMU for Linux, Shapesifter (a Mac virtual
    machine for Amigas), and SheepShaver (a PowerMac virtual machine for PowerPC BeOS
    computers).


    ![](img/b2b6702758c230ce537468351fc8af15_30_0.png)


    # VMware: Shhh, Don''t Call It an Emulator!


    As long as everyone involved in a conversation understands the fundamental difference
    between a full emulator (which has to labor to replicate a foreign CPU and video
    hardware) and a virtual machine such as VMware (which shares the CPU and other
    resources through an efficient software layer), the terminology really becomes
    a matter of personal preference. VMware, Inc. gets terminology touchy when you
    refer to VMware as an “emulator,” partly because it’s very proud of its virtual
    machine technology and partly because it had wanted its product to be called an
    emulator, it would have called it Eware. Still, in casual conversation (and, incidentally,
    through the course of this book), don’t be too surprised if you occasionally see
    VMware referred to as an emulator.


    # Simulators


    A special class of emulators is known as simulators. Again, definitions vary,
    but generally, a simulator does not replicate the performance and working condition
    of a complete computer architecture as an emulator or virtual machine does. Instead,
    simulators focus on precisely duplicating the internal workings of a particular
    electronic component or discrete machine.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Consider Intel’s new Itanium processor. Processor chips are designed over a
    long period of time using a variety of computer design tools and precision manufacturing
    techniques. But before the Itanium chip was ready for production, developers who
    wanted to support the new CPU used a simulator that ran on Intel’s existing Pentium
    III CPU.


    The Itanium simulator did not run as quickly as the physical Itanium chips. But
    the simulator precisely duplicated the internal function of the Itanium so developers
    could see exactly how their programs would function before they actually got their
    hands on the real thing!


    > Clever programmers over the years have also created simulators of various early
    computers, such as EDSAC, and sophisticated electronic devices such as Germany’s
    infamous World War II ENIGMA encryption machine.


    # VMware Versus “Dual Booting”


    Dual booting has become a hot topic over the past few years. As Linux has grown
    into a very popular and very commercially and industrially viable operating system,
    countless thousands of people, ranging from home hobbyists to IT managers, have
    been curious enough to try it. But many are unable or unwilling to simply throw
    away years of investment in Windows applications or another operating system or
    find it impossible to conduct their daily business in Linux alone.


    Dual booting solves this problem by dividing a computer’s hard drive into two
    partitions, each containing a complete, separate operating system. A boot menu,
    such as LILO, is installed, and every time the computer is powered up, the user
    chooses which operating system to load. So if you’re merrily playing around in
    Linux but remember that you have to send a Microsoft Word document to a client,
    you quickly reboot, tell the PC that you want to load Windows, and off you go.
    (In some cases, you can mount the partitions you didn’t boot from inside the other
    operating system.)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'mind the minor inconvenience of a two- or three-minute reboot when you occasionally
    need to switch from Linux to Windows or vice versa.


    On the other hand, if either by choice or by necessity you have to switch between
    the two operating systems more than once or twice a day, that "minor" delay will
    quickly turn into a significant investment of your valuable time, and you''ll
    start to wonder how many hours of your life are being wasted. For occasional use,
    the effort of backing up and re-partitioning your drive just to make room for
    a secondary operating system you rarely need seems wasteful.


    Although dual booting is well understood, it is not the easiest project. Repartitioning
    a hard drive to prepare for a dual-boot installation can be tricky because you
    often have to back up and reinstall large amounts of data to satisfy the requirements
    of the other operating system.


    For example, Microsoft Windows insists on booting from the first partition on
    a hard drive. Linux is far less picky, but for a computer that has only ever had
    Linux installed, the first partition must be given up to Windows, and that can
    mean hours of careful backups and tinkering in a disk partitioning tool such as
    fdisk or diskdruid. See Figure 1.3 for an example of a hard drive configured as
    a dual-boot system.


    VMware cuts through this problem in a number of ways. For starters, for most uses
    of VMware you might never have to touch your hard drive''s partition table at
    all. Virtual machines in VMware can share disk space with Linux by using file
    disks: large files that behave as a standalone hard drive when shown to a VMware
    guest operating system.


    Booting a new operating system inside a VMware virtual machine can be substantially
    faster than shutting down Linux and re-loading into the dual-boot OS. You also
    have the option of keeping the guest OS running full time even while you''re not
    using it, if your system has enough free resources. VMware also saves you the
    trouble of having to fool around configuring LILO or another boot loader.


    # Typical 10GB hard drive configured for dual booting


    ![](img/b2b6702758c230ce537468351fc8af15_32_0.png)


    Figure 1.3 A typical dual-boot configuration.


    # BUZZWORD


    Guest operating system

    The OS you run inside an emulator or a VMware virtual machine.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Dual booting does have certain advantages. Although your computer''s performance
    running Linux alone is never impeded unless you run VMware, the guest operating
    system in VMware always runs somewhat slower than it would if it had complete
    control over the computer''s resources.


    Also because guest operating systems do not have complete access to your PC''s
    hardware, there might be certain devices you cannot use properly, or at all, in
    a VMware session that would work if you booted directly into the OS. (Hardware
    compatibility is further discussed in Chapter 2, "Understanding How VMware Works.")
    Table 1.1 provides a quick comparison of the features and drawbacks of VMware
    and dual-boot environments.


    Table 1.1 Comparison between VMware and Dual Booting


    | Method | Advantages | Disadvantages |

    |---|---|---|

    | VMware | Simultaneously run multiple OSs

    Easy to install/configure | Extra expense

    Guest OS partially slowed |

    | Dual boot | No added cost

    Full, native hardware support | Difficult to configure

    Switching is inconvenient |


    > For more information on dual booting, and a variety of other topics, head to
    the Linux Documentation Project at http://www.linuxdoc.org.


    # VMware Versus DOS and Windows Emulators


    VMware was by no means the first product to try to bring Windows compatibility
    to Linux, although it is unique in its virtual machine approach.


    # Emulation, like Fine Wine...


    One of the oldest, and probably the most famous Windows emulator, is Wine. Actually,
    "emulator" isn''t quite the right term for Wine (which is an acronym with multiple
    meanings, one of which is "Wine Is Not an Emulator").'
  merge: -1
