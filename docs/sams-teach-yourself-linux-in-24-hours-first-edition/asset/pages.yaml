  md: 'This sample session shows that I specified the ftp server at Macmillan the
    host computer I wanted to connect and retrieve files. By convention, many system
    administrators create and maintain a user called ftp, and a directory called ftp,
    although it does not require password, does require you to enter a mail address
    in the form of user@somewhere.com. The location of the ftp directory may differ,
    but if you examine the /etc/passwd file for Linux system, you will find an ftp
    user with a directory under the /home directory, for example:


    ```

    ftp:~14:50:58 FTP User:/home/ftp:

    ```


    This /etc/passwd shows that people can connect to your system (if you''re on a
    network or have enabled user dial-in logins). By convention, when you use the
    ftp program to connect to other computers, you enter your username at the Name:
    prompt as anonymous, followed by your email address as the password.


    You can see that, after I logged in, I first listed the current directory, then
    changed directory to the pub directory. After listing directory, I changed to
    the software directory, changed directories to the operating-sys directory. If
    I had known the full path to the file, I could have specified such pathname in
    a single cmd, for example:


    ```

    > cd pub/software/operating-sys

    ```


    I then enabled the ftp command ASCII transfer mode, retrieved the file uslinux.txt
    with the command, and then logged off and extended the ftp program by the command.
    As you can see, using the ftp command is not hard and is an easy way to retrieve
    files.


    You can also open an anonymous ftp connection to your computer to demonstrate
    how ftp works without having an Internet connection available. You can specify
    the hostname of your computer, which you can get with the hostname, or by using
    your computer''s Internet Protocol address, for:


