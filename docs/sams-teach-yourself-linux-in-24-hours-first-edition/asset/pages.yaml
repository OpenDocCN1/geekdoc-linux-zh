    | Justification on | .sa 1 |

    | Line fill off | .ds N |

    | Line fill on | .ds F |

    | New paragraph with x indent | .px |

    | No indents | .ds L |

    | Right justify | .ds R |

    | Start bold text | .b |

    | Start text box | .b1 |

    | Use columns | .mc |

    | Use one column | .1c |

    | Use two columns | .2c |


    Some of the more common commands that don''t require a macro set are listed in
