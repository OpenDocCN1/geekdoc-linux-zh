  md: '# Renaming Files with the mv Command


    The mv command, called a rename command but known to many as a move command, indeed
    rename files or directories, but it will also move them around your file system.


    Actually, in the technical sense, the files or directories are not really moved.
    If you insist on knowing all the details, read the Linux System Administrator''s
    Guide, available through http://sunisite.unc.edu/~LDP/LDP/sag/index.html


    In its simplest form, mv can rename files, for example:


    ```

    # file1

    # mv file1 file2

    ```


    This command renames file1 to file2. However, besides renaming files, mv can rename
    directories, whether empty or not, for example:


    ```

    # mkdir -p temp/temp2/temp3

    # mv temp newtemp

    ```


    Although mv has nine different options, this section concentrates on the two most
    commonly used options. -b and -i, allow you to use mv in a fairly safe way, because
    mv will not only rename, but overwrite silently and quickly! The first option,
    -b, creates a backup of any file or directory you rename to an existing name,
    for example:


    ```

    # touch file1 file2 file3

    # ls *

    file1 file2 file3

    # mv -b file1 file2

    # ls *

    file1 file2-

    ```


    As you can see, without using -b, mv not only renamed file1 to file2, but deleted
    file2 in the process. Is this dangerous? You bet! Now, try the -b option:


    ```

    # touch file1

    # ls *

    file1 file2 file3

    # mv -b file1 file2

    # ls *

    file1 file2- file3

    ```


    This example shows that although file1 has been renamed, replacing file2, a backup
    of file2 with a default extension of the tilde (-) has been created.


    The mv command can work silently, or as with rm, you can use the -i (interactive)
    option, for example:


    ```

    # mv -i file2 file3

    # mv -i file2 file3?

    mv: replace file3? y

    ```'
