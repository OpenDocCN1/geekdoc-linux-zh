  md: '# Using the X Window System


    # Setting the Background Color


    You can change the background color of your display with the xsetroot, or root
    window utility, which is found under the /usr/X11R/bin directory. Your choice
    of color, as I mentioned previously, depends on the number of color depth of your
    X11 server. If you''re using the SVGA server, you''ll have a choice of 256 colors.
    For example, you can change the color with


    ```

    # xsetroot -solid red

    ```


    # Setting the Background Pattern


    If a solid color is too hard on your eyes, or too plain for your tastes, you can
    also use one of nearly 90 different bitmap graphics files from the /usr/include/X11/bitmaps
    directory to set a desktop pattern. For example, to set a red basket-weave pattern
    for your desktop,


    ```

    # xsetroot -bitmap /usr/include/X11/bitmaps/wide_weave -bg red

    ```


    This command tells the xsetroot client to load the bitmap graphic file weave from
    the X11 bitmap graphics directory, and display the pattern with a background color.


    ![](img/91f0fe61bd3027cda34d2f54533df676_140_0.png)


    > Experiment with different colors and patterns. When you find one you like, use
    the xsetroot command line in .xinitrc file so your background will be set the
    next time you run an X11 session.


    TIME SAVER


    If you''re running a monochrome display, you''re out of luck with colors. But
    you can change the pattern and apparent of your background with different bitmap
    files. Try the simple1, dimple3, or flipped_gray bitmap files.


    # Displaying Pictures on the Root Display


    Many users like to display a favorite picture in the root window. If you have
    a favorite photograph you''ve scanned, or a graphic like, you can display your
    image on the desktop with the xsetroot client, but the image must be in the X11
    bitmap format.


    You can use a client that''s already been discussed—xloadimage. You can find out
    what graphics file the xloadimage client recognizes with the -supported command-line,
    for example:


    ```

    # xloadimage -supported

    Type Name Can Dump Description

    niff Yes Native Image File Format (NIFF)

    sunraster No Sun Masterfile

    gif No GIF Image

    ```


