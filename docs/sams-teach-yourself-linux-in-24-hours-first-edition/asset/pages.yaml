  md: '# Plotting Graphics with the X11 xspread Spreadsheet


    If you like the sc spreadsheet program, but would like updated menus and features,
    you may want to try the xspread program, by software engineering teams at the
    University of Wisconsin-Milwaukee. This program requires that you''re running
    X11, but offers these additional features:


    +   - An improved program menu

    - Mouse support to run program features

    - The ability to import Lotus 1-2-3 format files

    - Support to generate and display line, bar, stacked-bar, and pie chart graphics
    from spreadsheet data


    The xspread program works the same way as the sc spreadsheet program. You can
    use this program with any sc spreadsheets that you''ve devised. Along with the
    sc tutorial, you''ll find an expanded manual detailing the xspread improvements.


    You can also generate graphics with the xspread program. By selecting Graph, defining
    a label range of cells, and a data range of cells, you can quickly generate visual
    representations of your data. To print your charts, capture the chart window with
    the xv command (see Hour 16, "Graphics Tools'').


    Unlike sc, this program appears to be distributed under the GNU General Public
    License, even though its manual page states that xspread is in the public domain.
    This means that the software is free, and you can make any changes you want, but
    you cannot claim the program as your own. One source of the xspread spreadsheet
    package is at this location:


    http://www.cdrom.com/pub/linux/slackware_source/x/xspread


    # Finding and Using the teapot Spreadsheet


    As an alternative to the sc program, you might want to try the teapot (table editor
    and planner) spreadsheet program by Michael Haardt. This spreadsheet works under
    X11 or your console. The program''s menu appears at the bottom of your screen,
    where you''ll find nearly all of the features of sc and xspread. The teapot program
    also has these features:


    +   - Import of sc and .wm spreadsheet files

    - Export of CSV, HTML, LaTeX, or ASCII file formats

    - Three-dimensional spreadsheets

    - Extensive and customized support of keyboard function keys

    - Availability in German, English, or Dutch language versions


    Although the teapot program does not have the graphics features of the xspread
    version of the sc spreadsheet, you''ll find that the teapot spreadsheet has much
    better documentation,


    ![](img/91f0fe61bd3027cda34d2f54533df676_287_0.png)'
