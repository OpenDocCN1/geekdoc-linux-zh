  md: '# Using Communications Programs


    After you make this change, save the file and reboot the computer. Now, not only
    can you receive faxes, but you can also dial in from an outside line and run Linux
    programs. To see if any faxes have arrived, you''ll have to explicitly look at
    the /var/spool/fax/incoming directory—for example,


    ```

    # ls -A /var/spool/fax/incoming

    fn4878f9aS1-_IBM-APTIVA-M61-_.01  fn4878f9aS1-_IBM-APTIVA-M61-_.02

    ```


    This shows that a two-page fax awaits reading. You can read the faxes by first
    converting them to the portable bitmap file format—for example,


    ```

    # cat /var/spool/fax/incoming/.01 | g32pbm > faxpage1.pbm

    ```


    After you convert these fax files to the portable bitmap format, you can then
    use the X11 xv client or the ImageMagick X11 program to read or print your faxes.


    As you can see, you''ll have several choices of faxing documents with Linux. The
    sendfax program like the efax family of programs, also accepts other types of
    files to fax, and has many other options. Read the documentation for this program
    to find out the details.


