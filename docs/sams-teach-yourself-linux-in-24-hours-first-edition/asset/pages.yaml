  md: '# Text Processing


    ```

    -rw-r--r-- 1 root root 955298 Nov 7 10:33 DOC-20.2.1

    -rw-r--r-- 1 root root 131199 May 17 1997 FAQ

    -rw-r--r-- 1 root root 11494 Sep 19 22:01 FTP

    ```


    This is a lot of information, but if you only want the permissions, size, and
    name of each file, you can quickly generate a custom listing with the following:


    ```

    # ls -l tr -s " " cut -d '' '' -f1,8,9

    ...

    -rw-r--r-- 42444 CENSORSHIP

    -rw-r--r-- 33115 CHARSETS

    -rw-r--r-- 12794 CODINGS

    -rw-r--r-- 49676 COOKIES

    -rw-r--r-- 17989 COPYING

    -rw-r--r-- 55595 DEBUU

    -rw-r--r-- 56633 DISTRIB

    -rw-r--r-- 955298 DOC-20.2.1

    -rw-r--r-- 131199 FAQ

    -rw-r--r-- 11494 FTP

    ```


    The listing now only shows the first, eighth, and ninth columns of the original
    listing, because the tr command squeezed multiple spaces into a single space.
    The output is piped through the cut command, specifying a field delimiter, the
    -d option (in this case, a space). Notice that although the first and second columns
    look okay, third is a little ragged. If this still isn''t what you want, you can
    clean it up by again using the tr to replace the space delimiter with a tab:


    ```

    # ls -l tr -s " " cut -d '' '' -f1,5,9 | tr " " \t"

    -rw-r--r-- 42444 CENSORSHIP

    -rw-r--r-- 33115 CHARSETS

    -rw-r--r-- 12794 CODINGS

    -rw-r--r-- 49676 COOKIES

    -rw-r--r-- 17989 COPYING

    -rw-r--r-- 55595 DEBUU

    -rw-r--r-- 56633 DISTRIB

    -rw-r--r-- 955298 DOC-20.2.1

    -rw-r--r-- 131199 FAQ

    -rw-r--r-- 11494 FTP

    ```


    You can use these filters to change your documents, but stream editors, such as
    the sed command, offer more capable approaches to editing text from the command
    line. For example, the sample license uses the phrase this to describe a software
    package. If you are the software developer of a new game, Nano-Warrior, and need
    to save time writing copyright licenses, you can change all occurrences of this
    Package to Nano-Warrior easily and without using a text editor:


    ```

    # cat LICENSE | sed s/this\ Package/Nano-Warrior(TM)/g

    ```


