  md: '# Using the X Window System


    cursor, if you click over an area of a screen you''d like to magnify, the xray
    client will then display the selection in a window. You would then move your cursor
    to the xpoint drawing window, go to the Edit menu, and select Paste. Your selected
    graphic will be pasted in the xpoint window.


    If you''re running a word processor or the command line in your terminals, you
    can also copy and paste text between windows. But the xterm and rxwm terminals
    support copy and paste operations using your mouse cursor and mouse buttons. To
    copy text, you''ll need to highlight the text first. If you want a word, double-click
    on the word with your mouse button. If you want a line of text, triple-click on
    the word. But if you want more than a word or a line, you''ll need to highlight
    regions of text.


    You can select regions in terminal windows in two ways: You can move your cursor
    to the beginning or end of text, and drag with the left mouse button held down
    to highlight the selected text. You can also click at the beginning of the text
    with your mouse button, then click at the end of the text to highlight selection.
    There are also two ways to paste into another window. One way to paste is to use
    your keyboard by holding the Shift key, and then pressing the Insert key. The
    other way is to press the middle mouse button (or the left and right mouse buttons
    simultaneously if you''re using a two-mouse button to emulate three buttons).


    You can also use the xclip client to copy from one window to another. When you
    run your client, you will see two buttons called "copy PRIMARY to 0" and "copy
    0 to PRIMARY.\ To copy text from one window to another, first highlight the text
    in one window. Then click on the "copy PRIMARY to 0" button, move to the window
    where you want to paste the text, and use either your keyboard or mouse to paste
    the text.


    Another X11 client for copying and pasting is the xclip clipboard. This program
    is especially handy for copying sections of text from messages, FAQs, HOWTOs,
    or other files. Like the xsel client, xclip places the copied text into a buffer,
    but has added the benefit of displaying the text, which you can then save into
    a file, or copy into other windows or programs.


    If you''d like to do more than copying small bits of graphics or text, you can
    also capture pictures of windows or your desktop. The next section shows how to
    capture, save, and display pictures from your X11 desktop.


    # Capturing and Dumping X11 Window


    You can capture pictures of windows or your entire desktop using several X11 clients
    included on your CD-ROM. The first is the xwd, or X11 window dump, program. You
    can use this client to take snapshots of your screen, or any desired window.


    ![](img/91f0fe61bd3027cda34d2f54533df676_138_0.png)'
