    # Figure 2.7.


    This pop-up menu lists you to specify the size and type of your partition.


    ![](img/91f0fe61bd3027cda34d2f54533df676_41_0.png)


    The fields in this pop-up are explained in Table 2.4.


    # Table 2.4. Explanation of the F1-Add pop-up menu.


    | Menu Item | Explanation |

    | --- | --- |

    | Mount Point | Used to enter the partition''s mount point. Remember that the
    entire space of the mounted hard drives are seen as sub-directories of the / partition.
    Therefore, you not need to specify one Linux partition to be the root partition
    /. |

    | Size (Megs) | Used to enter the minimum requested size of the partition. Unless
    changed, the minimum size is 1 meg. |

    | Growable? | A check box to indicate that the size is a minimum or an exact size.
    If Growable is selected, the partition size tries to fit all available disk space
    on the drive. |

    | Type | Used to choose the partition type to be used for the partition. This
    field is a highlighted scrollable section. |

    | Allowable Drives | Another check box area that tells disk druid on which drives
    to try to create this partition. |

    | Ok | Selecting this button tries to create the partition. |

    | Cancel | Selecting this button aborts the addition of a partition. |'
