    You should also know that you can alternatively use a specific floppy device to
    the low-level format, for example:


    ```

    # fdformat /dev/fd01440

    ```


    This tells you to use the specific floppy device for high-density drives, in this
    case, the A: driver.


    The next step is to create a filesystem on the floppy. You''ll use the mke2fs
    command to create a Linux extended filesystem on the floppy. The mke2fs command,
    found under the /sbin directory, has at least two command-line options, but you''ll
    use a few, for example:


