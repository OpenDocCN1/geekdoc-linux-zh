  md: '# Using the X Window System


    For customizing the applications supported in the window manager menus, you''ll
    want to use the wmconfig program, found under the /usr/X1186/bin directory. This
    program builds a window manager configuration file from definition files under
    the /etc/X11/wmconfig directory. You can build configuration files for several
    window managers using this program.


    First, create a directory called .wmconfig in your home directory. Copy the files
    in the /etc/X11/wmconfig directory into your .wmconfig directory, for example:


    ```

    # mkdir .wmconfig

    # cp /etc/X11/wmconfig/* .wmconfig

    ```


    You can then add, delete, or change the applications in the menus by creating,
    editing, or deleting the configuration files. For details concerning the format
    of these files, see the wmconfig manual page. When you''ve finished customizing
    the applications and menus, you can create a new configuration file using the
    wmconfig command, for example:


    ```

    # wmconfig --output=fwm2 --sysdir=home/dball/.wmconfig > fwm2rc

    ```


    This command will cause the wmconfig program to parse the configuration files
    found under the .wmconfig directory and place the output in a new .fwm2rc file.


    If you like to have the taskbar at the bottom of the screen, see the screen real
    estate, and don''t want the taskbar in the way when you''re working, make it automatically
    hide by changing the settings in the fwm2rc.modules file. Look for the section
    dealing with the taskbar, for example:


    ```

    ############################################################

    ###### FwmTaskBar

    ###### FwmTaskBarAutoHide

    ```


    After you add the auto-hide setting, restart the window manager. The taskbar will
    disappear when you don''t need it, it will appear when your cursor is at the bottom
    of the screen.


    You can also start programs from the fwm2rc.init file. Although you can start
    programs by adding them to your .xinitrc, it is important to add them to the fwm2rc.init
    file if you want the "windows to have special features, such as visible minimize,
    maximize, or close buttons. Look for the SetupFunction section, then add the programs
    you''d like to run at startup, as follows:


    # # Setupfunction gets run at Init Restart


    ```

    AddToFunc "SetupFunction"

    + "I" Exec xset -solid cyan4

    + "I" Exec rxvt -geometry 80x11+3-375 -bg white -fg black

    + "I" Exec rxvt -geometry 80x24+6-2 -bg white -fg black

    ```


