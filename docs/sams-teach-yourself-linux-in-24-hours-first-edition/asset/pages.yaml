  md: '# Basic System Administration


    ```

    SHELL=/bin/bash

    $ su -s /bin/ksh

    Password:

    # printenv | fgrep SHELL

    SHELL=/bin/ksh

    # exit

    $

    ```


    This shows that although the default shell is bash, you can temporarily use the
    pdksh, or public domain Korn shell. Unless you specify your own username, you''ll
    run the new shell as the root operator. A better approach is


    $ su -s /bin/ksh yourusername


    Finally, you can also use the su command to execute a command when you use the
    -c command-line option. This can be handy to do tasks only permitted to the root
    operator, for example:


    ```

    # su -c "mount -t msdos /dev/hdc1 /mnt/flash"

    ```


    This command lists the /dev/hdc1 device, a SunDisk flash card with a DOS filesystem,
    at the /mnt/flash directory point. If you need to temporarily mount or unmount
    diskettes, CD-ROMs, or other devices, you''ll find this convenient approach.

    Hour 21, "Handling Files," covers mounting and unmounting filesystems.


    If you''re using Linux in the console mode (not running X11), you can use the
    console keys (Alt-F1 and so on), to run a virtual console as the root operator
    to do root operator tasks. But this is a bad convenience, as you may be tempted
    to run as root all the time. At least the su command makes you think about why
    you''re running as root. Be careful!


    The next section introduces you to tools you can use to determine how your system
    is working.


    # Getting Disk Space Information


    When you installed Linux, you installed your system on a partition, designated
    by a specific device, such as /dev/hda1,/dev/sdb1, and so on. Hopefully, you made
    the partition large enough to accommodate your present and future needs. But how
    do you check to see how much room you have left on, or for that matter, how many
    disks you have? Although Linux can support up to 4 terabytes, and maximum file
    sizes up to 2 gigabytes, not many of us are wealthy enough to own, or even need,
    that much storage is getting cheaper, but it is still at a premium when you have
    a lot of software installed or need the work space.


    20'
