- img_proc: true
  md: '# Reading and Navigation Commands


    The more command also has a number of command-line options. You can customize
    the screen prompt (more displays the current percentage of the file you''re reading),
    set the screen size (the number of lines shown when going forward or backward
    through your file), use multiple filenames or wildcards, and when scrolling on
    or off, in addition to other options.


    Although you may find the more command to be more than adequate in reading files,
    you might really like the less pager.


    # Browsing Files with the less Command


    You''ll find that less is more or less more, but you''ll also discover that less
    is much more than more. Confused? Don''t be, because less, like more, is also
    a pager command. But its author, Mark Nelman, has improved on a number of features
    in the more command, and added many others.


    The less command offers a number of advantages over more:


    +   - You can scroll backwards and forwards through text files using your cursor
    keys.

    - You can navigate through files with bookmarks, by line numbers, or by percentage
    of file.

    - Sophisticated searches, pattern options, and highlighting through multiple files.

    - Compatible keystrokes with word processing programs, such as emacs.

    - The less command won''t quit on you when you reach the end of a file, or the
    end of the standard input.

    - The information prompt at the bottom of the screen is more customizable and
    offers more information.

    - Loads of options, including a separate setup program, lesskey, so you can customize
    which keys control less


    You''ll find that after you install Linux, the less pager is the default pager
    used by a number of programs, as the man command. And if you need to read compressed
    files (those with a .gz extension, and about which you''ll learn in Hour 5, “Manipulation
    and Searching Commands”), you can use the less command, found under /usr/bin directory.


    # Reading the Beginning or End of Files with the head and tail Commands


    Although the head and tail commands are not pagers per se, they can make a lot
    easier when all you want to do is reading the beginning or end of a file. These
    programs, like most Linux commands, are designed to do one or two things, but
    they do these tasks well.'
