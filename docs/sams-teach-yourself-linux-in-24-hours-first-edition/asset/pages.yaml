- img_proc: true
  md: '![](img/91f0fe61bd3027cda34d2f54533df676_149_0.png)


    You can have all of these window managers installed on your system and use a different
    one whenever you want.


    # Obtaining, Installing, and Configuring Other Window Managers


    Installing other window managers can be a daunting task. You won''t find any of
    the following window managers installed on your book''s CD-ROM. You''ll have to
    find the software yourself, and either install pre-compiled versions, or build
    and install the software on your


    ![](img/91f0fe61bd3027cda34d2f54533df676_149_1.png)


    > Don''t be intimidated if you have to compile and install Linux programs from
    scratch. Many programmers make the job easier by providing shell scripts or other
    programs that automate the process. When you download a software package be to
    read the README file before you begin. If you''re curious about Linux programming,
    see the Programmer''s Guide under the /usr/doc/LDP directory, and read the man
    pages for the make and xmkmf commands.


    Fortunately, you can easily find these window managers by either using your favorite
    search engine, or browsing to Matt Chapman''s site, which has a number of links
    to the sources:


    http://www.plig.org


    At this site the source code for many window managers is just a mouse-click away,
    along with beginner-UNIX tutorials and loads of details about X11 window managers.


    # The Motif Window Manager


    The mwm, or Motif window manager, is part of the Motif software library distribution
    from The Open Group. Unlike the X11Free86 software installed on your system, Motif
    is distributed under a license, and you must pay for your copy. There are several
    Motif distributions for Linux, and many Linux users buy to create Motif clients
    (which support drag-and-drop, along with other advanced features), or to run programs
    that require the Motif software libraries.


