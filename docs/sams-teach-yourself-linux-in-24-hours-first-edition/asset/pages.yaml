  md: '# PART

    II


    # Hour 6


    # Using the Shell


    In this hour you''ll be introduced to the shell. Although the trend in personal
    computing in the last 10 years has been to move away from the command line to
    a point-and-click interface, the shell is still very much alive in Linux, and
    is used by many Linux programs.


    This hour doesn''t go into a detailed history of Linux or UNIX shells, or take
    sides in a debate over which computing interface is easier or better to use. Nor
    does this hour delve into shell programming—there’s also not enough room in this
    hour (or even this book) to do so. This hour, however, discuss the different shells
    you''ll find on your CD-ROM, show how to use the shell to make your Linux experience
    more enjoyable, and highlight some of the basics of using the shell and its command
    line.


    # What Is a Shell?


    If you''re not using the XWindow System, the shell is one of the most important
    programs you''ll use. The shell provides the interface to Linux so you can run
    programs. In fact, the shell is just another Linux program. While you can set
    up and run Linux without a shell (see Hour 20, "Basic System Administration,"
    for details), you may find that you''ll do a lot of typing at the shell''s command
    line.'
