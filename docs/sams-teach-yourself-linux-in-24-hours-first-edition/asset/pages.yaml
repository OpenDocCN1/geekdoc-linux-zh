  md: '# Navigating and Searching the File System


    This section introduces you to the basic navigation commands, and shows you how
    to move around your Linux file system, find files, and build file information
    databases, such as those for use with the cd command. You''ll also learn about
    alternative approaches and programs, and how to speed up searches to find files
    quickly.


    # Moving to Different Directories with the cd Command


    The cd (change directory) command is the basic navigation tool for moving your
    current location to different parts of the Linux file system. You can move directly
    to a directory by typing the command, followed by a pathname or directory. For
    example, the following command will move you to the /usr/bin directory:


    ```

    # cd /usr/bin

    ```


    When you''re in that directory, you can move up to the /usr directory with the
    following command:


    ```

    # cd ..

    ```


    You could also move to the root directory, or /, while in the /usr/bin directory
    by using the following command:


    ```

    # cd ../..

    ```


    Finally, you can always go back to your home directory (where your files are)
    by using either of the following commands:


    ```

    # cd

    ```


    or


    ```

    # cd -

    ```


    Note that if you try to use the man command to read the cd man page, you won''t
    find one. Why? Because cd is built into the shell. See bash in Hour 6, for more
    details.


    # Knowing Where You Are with the pwd Command


    The pwd (print working directory) command tells you where you are, and prints
    the working (current) directory. For example, if you execute


    ```

    # cd /usr/bin

    ```


    and then type


    ```

    # pwd

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_67_0.png)'
