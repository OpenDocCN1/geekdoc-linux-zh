    list of check boxes linked to a service that starts when you boot the machine.
    You can choose to get more information on a service by scrolling to that service
    and pressing F1 to get a short description on the service.


    Since you can get this screen after the installation by running ntsysv command,
    you should look at each service and decide if you want to start the first time
    you run the box. For the most part, if a service was selected by default it should
