  md: '# Checking the Connection


    You can diagnose, troubleshoot, or get more information about the PPP connection
    in a number of ways. You can use networking utility programs during your connection
    to test, time, and diagnose the ppp interface. You can also examine system logs
    to look for any problems occurring during startup, connecting, and disconnecting.


    This section introduces you to a few of these networking programs, and shows where
    to look in your system logs for more information.


    # Using the ifconfig Command


    Although the ifconfig command, found under the /sbin directory, is generally used
    in network administration by the root operator to configure network interfaces
    (a skill not covered in this book; see the Linux Network Administrators Guide),
    you can use ifconfig to see the state of your PPP connection.


    This command can be helpful when you''re running programs, such as newsreaders,
    which may appear "frozen", but are actually sensing and receiving data, but not
    displaying updates on your screen. To use ifconfig, just enter


    ```

    # ifconfig

    lo Link encap:Local Loopback

    int addr:127.0.0.1 Broadcast:127.255.255.255 Mask:255.0.0.0

    UP BROADCAST LOOPBACK RUNNING MTU:3584 Metric:1

    RX packets:17257 errors:0 dropped:0 overruns:0

    TX packets:17257 errors:0 dropped:0 overruns:0

    ```


    ```

    ppp0 Link encap:Point-Point Protocol

    int addr:207.226.80.52 P-t:207.226.80.4

    Mask:255.255.255.255

    UP POINTPOINT RUNNING MTU:1500 Metric:1

    RX packets:676 errors:0 dropped:0 overruns:0

    TX packets:545 errors:0 dropped:0 overruns:0

    ```


    The command will list the current, active network interfaces. Link listing you
    can see the number of bytes received and transmitted (in the form of packets)
    over your PPP interface. Calling the connection intermittently from another console
    or terminal window will show you the progress of data being sent and received.


    # Using the netstat Command


    The netstat command is the definitive command for checking your network activity,
    connections, routing tables, and other network statistics and statistics. You''ll
    want to try this if you''re interested in a flexible listing of what''s going
    on. For example, you can try (the following example output is abbreviated):'
