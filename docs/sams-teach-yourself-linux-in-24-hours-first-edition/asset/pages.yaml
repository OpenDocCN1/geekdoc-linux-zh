  md: '# Figure 19.2.

    The xbox X11 client plays chess on your display, over the Internet, or through
    electronic mail.


    ![](img/91f0fe61bd3027cda34d2f54533df676_308_0.png)


    The xbox client recognizes many X11 Toolkit options, such as geometry, and has
    54 different command-line options. If you have a display less than 1024×768 pixels,
    you should use the -size or -boardSize small command-line option to fit the board
    on your screen:


    ```

    # xbox -size small &

    ```


    This command starts xbox using smaller chess pieces. For more details about using
    xbox, see the xbox and gnauch manual pages.


    # Playing X11 Solitaire


    If you enjoy playing card solitaire games, you''ll like the xpat2 X11 dient. This
    program features 14 different solitaire games with scoring, hints, built-in help,
    and sound (see Figure 19.3).


    The xpat2 game, by Heiko Eissfeldt and Michael Bischoff, is found under the /usr/X11R/bin
    directory. For more details, read the xpat2 manual page.


    # Playing Backgammon for X11


    For backgammon fanatics, the xgammon game will produce hours of fun and practice.
