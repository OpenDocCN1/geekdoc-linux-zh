  md: '# Handling Files


    This shows that the user, bball, belongs to two groups: bball and users. As the
    root operator, you belong to at least seven groups, for example:


    ```

    # groups

    root bin daemon sys adm disk wheel

    ```


    To find out who belongs to a group, look at the /etc/group file, or use the name
    of a user, for example:


    ```

    # groups clobbie

    clobbie : clobbie users

    ```


    This shows that you and clobbie belong to at least one group, called users. To
    assign one of your files to the users group, and give clobbie access, you can
    use the chown command''s syntax of user:group, for example:


    ```

    # chown :users myfile

    # ls -l myfile

    -rw-rw-r-- 1 bball       users       0 Nov 23 14:16 myfile

    ```


    You might think that you can assign ownership, you can use the following:


    ```

    # chown clobbie:users myfile

    chown: myfile: Operation not permitted

    ```


    What happened? This shows why Linux has groups. You can assign access of one of
    your files to a group, unless you''re the root operator, you cannot assign one
    of your files to appear to have been created or owned by another user. Make sure
    you''re logged in as the root operator and use.


    ```

    # chown clobbie:clobbie myfile

    # ls -l myfile

    -rw-rw-r-- 1 clobbie clobbie       0 Nov 23 14:16 myfile

    ```


    As you can see, even though the file was created by the user bball, as the sysadmin,
    you can assign ownership to any users and any group. If you want to change the
    ownership of a file or directory, you can use the chown command; if you want to
    change the users or your own group, you can use the newgrp command.


    # Changing Groups and Ownerships with the chgrp and newgrp Commands


    The chgrp (change group) command, found under the /bin directory, is used only
    to change group ownership. In this regard, it is not as flexible as the chown
    command, which can do both. The chgrp command accepts a group name or group id
    (GID), command, for example:


    ```

    # ls -l myfile

    -rw-rw-r-- 1 bball       bball       0 Nov 23 14:16 myfile

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_348_0.png)'
