  md: '# # 326 Hour 21


    As you can see, using the chmod command''s octal notation is not that hard. What
    you have to decide is whom you want to grant access, and what kind of access you''d
    like yours to have. The chmod command also has a command-line form as follows:


    ```

    ugoa += rwxstugo

    ```


    This book doesn''t go into all the details of this notation (you can read the
    chmod command''s manual page for more details), but the next few duplicate chmod''s
    actions using the previous examples. You can protect a file from anyone else with


    ```

    # ls -l file!

    -rw-rw-r-- 1 bball 0 Nov 23 13:50 file!

    # chmod go-rwx file!

    # ls -l file!

    -rw------- 1 bball 0 Nov 23 13:50 file!

    ```


    As you can see, the file is now readable and writable by only you, because you
    have specified your group (g) and others (o) do not have read, write, or execute
    (rwx) permission. You can protect your directory from prying eyes as follows:


    ```

    # chmod go-rwx temp

    ```


    And, to mimic the last example, enable others to read files in the directory,
    but not list the directory contents, you can use


    ```

    # chmod o+x temp

    ```


    You''re now familiar with file and directory permissions, and using the chmod
    command. The next section shows how you can change ownership of files or directories.
    If recall the previous discussion of the /etc/group file in this hour, you''ll
    remember that your users can be assigned to different groups. Using the chown
    command, you can assign ownership to different users or groups.


    # Changing File Ownership with the chown Command


    The chown (change ownership) command, found under the /bin directory, is used
    to change, either permanently or temporarily, the ownership of files or directories.
    If you recall the previous discussion of the /etc/group file in this hour, you''ll
    remember that your users can be assigned to different groups. Using the chown
    command, you can assign ownership to different users or groups.


    For example, if you''ve created a text file, you can share it with members of
    your group or others with the chmod command. By using chown, you can tell Linux
    specifically what other users or groups can have access to your file. You can
    use the groups command to find out what groups you belong to, for example:


    +   - groups

    bball users


