  md: '# Installing the Enlightenment Window Manager


    One of the most garish and outlandish X11 window managers is Enlightenment, by
    Carsten Haitzler and Geoff Harrison. Want to feel like you''re hurtling through
    space, flying an alien spacecraft at the helm of an organic console? If your answer
    is "yes", then this window is for you.


    Like other window managers, Enlightenment provides window controls, virtual consoles,
    scrollbars, and desktop menus (see Figure 8.4). But that''s where the similarity
    ends. This window manager works by loading configuration files for various themes,
    and two themes—DEFAULT and DEFAULT_small (for 800-by-600-pixel displays), are
    included.


    Figure 8.4.

    The Enlightenment window manager provides a unique, futuristic X Window desktop,
    with many unusual controls.


    ![](img/91f0fe61bd3027cda34d2f54533df676_156_0.png)


    Be patient—there may be a significant delay before the desktop displays on your
    monitor after you start X because the way Enlightenment loads its configuration
    files, found under the themes directory in the enlightenment-directory. Enlightenment
    uses "themeballs," or gzipped tar archives window elements and desktop configurations.
    If you want Enlightenment to start faster, you can decompress and unarchive Enlightenment''s
    themes with the gunzip and tar commands. See Enlightenment''s documentation for
    details.


    ![](img/91f0fe61bd3027cda34d2f54533df676_156_1.png)'
