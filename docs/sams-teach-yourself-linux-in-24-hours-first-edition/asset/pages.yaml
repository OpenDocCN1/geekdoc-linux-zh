  md: '# Using Communications Programs


    The command will run the xminicom script and start minicom in an X11 terminal
    window. To get help on how to use minicom, you can hold down the Alt key and press
    the Z key. Figure 9.1 shows minicom help screen.


    # Figure 9.1.


    The minicom communications program features built-in help for the user.


    ![](img/91f0fe61bd3027cda34d2f54533df676_166_0.png)


    To configure minicom, hold down the Alt key and press the O key to get to the
    configure screen. Scroll down, select Serial Port Setup, and press the Enter key.
    You can then type in the Serial Device by pressing the A key. Type in the device
    your modem is connected to, such as /dev/cuS, or the symbolic link, /dev/modem,
    if you''ve created the link. Figure 9.2 details the serial port setup screen.


    Finally, press the Enter key, select Save setup as df, and press the Enter key
    again, followed by the Escape key. Your system defaults should be set. You can
    then try to call out


    ATDTX-XXXX


    If you press Enter after dialing, this should make your modem dial the phone number
    represented by XXX-XXXX. If you have a number of phone numbers of other computers
    to call, you enter them in minicom''s phone directory. You can also set up minicom
    to send or retrieve files by using different file transfer programs. For details
    about these and other features, read the minicom manual page. You''ll also find
    documentation under the /usr/doc directory, which contains extensive details of
    other features of this program.'
