  md: 'The find command has many different options and uses. For more details about
    find, see its manual page. Although find will rapidly search your hard drive (and
    any other filesystems), there are other ways of quickly finding files, especially
    programs. Read on to find out more!


    # # Finding Files with the딨 Command


    The딨 command can quickly find files, and it also shows where the file''s binary,
    source, and manual pages reside. For example, the following command shows that
    the find command is in the /usr/bin directory, and its man page is in the /usr/man/man1
    directory:


    ```

    # find

    find: /usr/bin/find /usr/man/man1/find.1

    ```


    You can also use딨 to find only the binary version of the program with


    ```

    #딨 -b find

    find: /usr/bin/find

    ```


    If딨 cannot find your request, you''ll get an empty return string, for example:


    ```

    #딨 foo

    foo:

    ```


    Part of the problem could also be that the file is not in any of the directories
    the딨 searches. The directories딨 looks in are hard-coded in the program. Although
    this might seem like a drawback, limiting searches to known directories such as
    /usr/man, /usr/bin, or /usr/sbin can speed up the task of finding files.


    Although딨 is faster than using find to locate programs or manual pages, there''s
    an even faster search utility you can use, called locate, discussed in the next
    section.


    # # Locating Files with the locate Command


    One way to speed up searches for files is not to search your directories! You
    can do this by using a program like locate, which uses a single database of filenames
    and locations, and saves time by looking in a single file instead of traversing
    your hard drive. Finding a file using locate is much faster than the find command
    because locate will go directly to the database file, find any matching filenames,
    and print its results.


    Locate is easy to use. For example, to find all the PostScript files on your system,
    you can enter


    ```

    # locate *.ps

    ```


    Almost always, the files are printed to your screen. You may even find the locate
    command line little easier to use than the find command. However, there is a catch:
    find will work "right out of the box," whereas locate, you need to first build
    a database of all the files on your system. But don''t worry, because the procedure
    is almost automatic.'
