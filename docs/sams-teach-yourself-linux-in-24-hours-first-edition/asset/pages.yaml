  md: '# PART

    IV


    # Hour 15


    # Preparing Documents


    Hour 14, "Text Processing," discussed text editing tools and programs used to
    create, edit, and save documents. This hour introduces you to programs and utilities
    used to format and print your text documents. It starts off with a discussion
    of different text formatting programs, and shows you how to easily format your
    documents for printing without using complicated formatting commands. It then
    shows how to use more complex programs by using simple commands.


    The hour concludes with a discussion of the basics of document printing under
    Linux, as well as detailed information about how to configure your printer to
    get the best possible output.


    # Formatting Text


    While you can do basic formatting of text documents using a text editor or word
    processor, most of these programs for Linux lack the necessary features to add
    page numbering, boldfacing, font changes, indenting, or other fancy text layout.'
  merge: -1
