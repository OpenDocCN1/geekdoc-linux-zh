    -rw-rw-r-- 1 bball bball 208 Oct 04 19:24 search

    -rw-rw-r-- 1 bball bball 801 Nov 11 22:46 vultures.msg

    ```


    As you can see, there are different columns. The first column is the file''s permissions
    flags, which are covered in Hour 21, ''Handling Files''. These flags show the
    file''s type, and you can read (or modify or delete), or run the file. The next
    column shows the number of links, which are discussed in Hour 5, ''Manipulation
    and Searching Commands.'' Next is the owner name, followed by group name. Owners
    and groups are discussed in Hour 21. The file size is listed next, followed by
    a timestamp of the file or directory was created or modified. The last column,
    obviously, is each file''s name.


