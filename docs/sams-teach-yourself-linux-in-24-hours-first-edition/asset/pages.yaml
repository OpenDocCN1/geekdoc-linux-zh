- img_proc: true
  md: '# Preparing Documents


    There are many different macros and macro sets included with the TEX formatting
    system. Covering the details of complex formatting is beyond the scope of this
    book, but you''re encouraged to experiment, starting with simple commands to get
    a feel for typesetting documents. There are nearly 100 books using TeX on the
    market. If you''re serious about learning how to use TeX, a good book is indispensable.


    ![](img/91f0fe61bd3027cda34d2f54533df676_258_0.png)


    ![](img/91f0fe61bd3027cda34d2f54533df676_258_1.png)


    # Printing Text Documents


    After you''ve finished formatting your text files, using either a series of filters
    or inserted typesetting commands, you''ll want to print your file to produce a
    typeset document. In order to control the printing of your documents, you need
    to understand how Linux handles printing, and how to start, stop, cancel, or control
    the printing process.


    There are several printing commands you''ll use to control the printing process
    on your system. This section first shows how your printer is described under Linux,
    and where the important printer files are located.


    Printers are known as character mode devices, and are listed under the /dev directory.
    Look at the following example:


    ```

    # ls /dev/lp1*

    /dev/lp0 /dev/lp1 /dev/lp2

    ```


    This shows the three parallel printer devices installed on your system by default.
    Chances are good that you have a parallel printer attached to your computer, so
    this hour''s discussion is limited to parallel printers. Once set up, you''ll
    find little difference between parallel and serial printers are handled by Linux.


    ![](img/91f0fe61bd3027cda34d2f54533df676_258_2.png)


    Serial printers are serial devices, and have names such as /dev/ttySX, where X
    is a number from 0 to 3, similar to your modern ports. Read theIPSET command''s
    manual page to learn how to set your serial port to the fastest baud rate your
    printer supports.


    To determine if your printer is working, first make sure your printer is plugged
    in, attached to your computer''s parallel port, and turned on. Then trying a directory
    listing to your printer with the following:


    ```

    # ls >/dev/lp1

    ```'
