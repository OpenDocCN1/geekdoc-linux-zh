  md: '# Installing and Using the LessTif mwm Window Manager


    Don’t want to spend money for a commercial distribution of Motif? You can try
    LessTif, an alternative software library, designed to be compatible with Motif
    version 1.2 and distributed under terms of the GNU General Public License. This
    software library comes with a window manager mwm, along with the software libraries
    required to run many Motif programs.


    You can download the source for LessTif and build it on your own, or you can get
    a binary distribution if you just like to try mwm. The latest copies of LessTif
    usually reside at the Following web:


    ```

    http://www.lesttif.org

    ```


    This site also features programming hints and a list of Motif clients that work
    with LessTif. To install the binary version of the LessTif distribution, move
    all of the unpacked directories to a single directory. Make sure you’re logged
    in as the root user, then type the:


    ```

    # gunzip lesttif-0.81-linux.tar.gz

    # tar xf lesttif-0.81-linux.tar.gz

    # cd lesttif

    # mkdir /usr/local/lesttif

    # mv * /usr/local/lesttif

    ```


    Edit your /etc/profile, and add the following:

    PATH=/usr/local/lesttif:$PATH

    LIBRARY_PATH=/usr/local/lesttif/lib


    Save the file. To enter the new environment variables (see Hour 6, “Using the
    Shell”) right away, use the bash shell command:


    ```

    # source /etc/profile

    ```


    Once you’ve used this command, either create a .xinitrc file in your home directory
    or comment out your current entries and use mwm as the last entry in the file.
    Next time you startx command, you’ll be using the mwm window manager.


    The LessTif version of mwm uses a .mwm resource file in your home directory, so
    you can define your own Root menu (displayed when you hold your right mouse button
    when your cursor is on the desktop).


    You can change how LessTif’s mwm works by editing the file Mwm, located under
    the app-defaults directory (which you’ll find under the LessTif directory).


    # Starting the Common Desktop Environment


    The Common Desktop Environment, or CDE, is a graphical interface with many features
    common to other commercial operating systems. But it’s much more than that; it
    is without


    ![](img/91f0fe61bd3027cda34d2f54533df676_151_0.png)'
