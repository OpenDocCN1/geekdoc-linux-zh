    You can use minicom every time you use the Internet, but you may find the process
    tedious.

    I''m showing you this approach, because you may find it useful in verifying the
    login

    and password entries you specified in your ppp-on-dialer script will work.


    Here is the step-by-step method. You can do this because minicom can quit resetting

    your modem. You can use minicom to dial out, connect, and then quit, allowing

    You to start your PPP session with the ppp daemon. Here''s how:


    +   1. Run minicom.

