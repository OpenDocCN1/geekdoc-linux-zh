  md: 'After you have done this, reboot your computer using the shutdown command with
    the

    -r, restart, directory. Log back in as root, and use the quota command, found
    under the

    /usr/sbin directory, along with the -u option, to edit quotas for your new user,
    for example:


    ```

    # edquota -u clobiee

    ```


    The edquota command will read the user.quota file under your root, or / , directory.
    This

    file is normally a binary file, but edquota will open the file using the text
    editor defined in your

    EDITOR environment variable. If you don''t like the default editor, you can first
    specify your

    temporarily as follows:


    ```

    # EDITOR=/usr/bin/pico;export EDITOR

