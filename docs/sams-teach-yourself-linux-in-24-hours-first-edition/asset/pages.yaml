  md: '# Variants of the Visual Editor Improved—vim


    The vim editor, by Bram Moolenaar, is a text editor compatible with the original
    Berkeley Software Distribution vi editor by Bill Joy. An X11 version is called
    gvim and sports multiple scrolling windows and menus.


    Although the ~vimrc command shows that the systemwide vimrc and gvim resource
    files are located under the /usr/share/vim directory, this is not true; you won''t
    find these files installed with the vim package. However, you can create your
    own resource file after making changes to vim while running the editor, and then
    use :vimrc command. A resource file called .vimrc (which you can copy to .gvimrc)
    is created in your home directory, and contains your changes. You can then edit
    and add your own commands, configurations, and menus to these files.


    ![](img/91f0fe61bd3027cda34d2f54533df676_238_0.png)


    Some symbolic links are created on your system when you install the vim package
    from your CD-ROM:


    +   - /bin/ex -> /bin/vim

    - /usr/bin/ex -> /bin/vim

    - /usr/bin/vi -> /bin/vim

    - /bin/vi -> /bin/vim

    - /bin/view -> /bin/vim

    - /usr/X11R6/vimx -> /usr/X11R6/gvim


    The vim editor is used as a replacement for the vi, and view editors (see Figure
    14.2). Although vim is a visual editor, supporting features such as cursor movement,
    when invoked by ex, the vim editor emulates the ex editor.


    The vim editor features a number of improvements over the traditional vi, and
    has 23 different command-line options. In vim you''ll find built-in help, split-screen
    windows, blocks, command-line editing, horizontal scrolling, and word wrap for
    word processing.


    The gvim version of vim, used under the Window System, has custom colors, window
    sizes, scrollbars, and menus. You can create your own set of menus containing
    specific vim commands, and generate different versions of vim by saving your features
    in different gvim resource files. You can then use the -u command-line option
    to load a custom version.


    Creating new menus for vim is easy. You can, for example, group related macros
    or custom commands you create into a separate menu. For details about building
    custom menus, read the files vim_menu.txt and vim_gui.txt under the /usr/share/vim
    directory.


    ![](img/91f0fe61bd3027cda34d2f54533df676_238_1.png)'
