- img_proc: true
  md: 'In choosing a root password (or any password for that matter), you should choose
    one that is at least 6 characters, not a word found in a dictionary, or some other
    item that is easily guessable about you (your birthday date). Passwords that are
    considered to be good are a mix of numerals and case, and usually are acronyms
    of sentences or combined words. Examples of good passwords (at least until this
    is published) would be Fraz23Re, SH22pup, Lam99bal. Passwords are case-sensitive
    and commonly have a limit of only 8 characters (so Fra23Rent and Fra93Rex would
    be considered the same password).


    Come up with a password for your machine, write it down on a separate piece of
    paper, and enter it in the dialog area. For security reasons, what type you does
    not show up on the screen. Because of this you need to enter the password twice
    to confirm that you are typing the same. When you have entered it twice, select
    Ok and press Enter. If the two passwords match each other, you will go onto the
    next screen. If they don''t, you will need to re-enter them.


    Remember, the root user has complete access and control over the system, having
    the ability to look into or change any file on the system, which is why this password
    should be kept secure.


    # Selecting Boot Options


    You have reached the final stretch of the installation. This is the part where
    you decide how you will boot Linux after the installation.


    The screen you are presented with, shown in Figure 2.14, gives you the choice
    of installing LILO (the bootloader) to two different partitions of the system.


    # Figure 2.14.


    Selecting where you want to install the bootloader. Most people should select
    the default Master Boot Record option.


    ![](img/91f0fe61bd3027cda34d2f54533df676_49_0.png)


    +   Boot Record. This replaces the master boot record of the system, causing a
    LILO prompt to come up each time you boot the machine. Useful in most cases.


    +   First sector of the boot partition. This option can be used if you have another
    boot loader on your system (OS/2, NT, Partition Magic, or System Commander are
    some examples). These boot loaders are already in the Master Boot Record of the
    primary drive, and you don''t want to replace them. With LILO installed to the
    root partition, you can then configure the other boot system to start that OS.


    ![](img/91f0fe61bd3027cda34d2f54533df676_49_1.png)'
