    # Making a Sticky Note Calendar with the xmmessage Client


    The xmmessage client, by Chris Peterson and Stephen Gilda, is a handy way to create
    quick notes as reminders while you work. This deceptively simple client is easy
    to use. For example, if you want to make a quick note of a phone number,


    ```

    # xmmessage "George called at 10:15; call him back at 555-1212"

    ```


    This command line will display the xmmessage client window with the text of your
    message. Although this is a simple example, you can also use the xmmessage client
    to display the output of program searches, or use it in your personal schedules
    to automatically send reminders while you work (see Hour 18, "Personal Productivity
    Tools," or Hour 24, "Scheduling," for details).


    You can also use xmmessage as a calendar display program if you need to copy a
    copy of the current calendar on the screen, or if you want a calendar on your
    desktop when you start your X session. You won''t find a simple X11 version of
    the cal calendar program, but here''s one you can use:


    ```

    # cal | xmmessage -file ".-" &

    ```


    This displays the output of the cal calendar program in a square xmmessage client.


    ![](img/91f0fe61bd3027cda34d2f54533df676_145_0.png)


    | You will find the cal X11 client under the /usr/X11R/bin directory, this is
    a personal scheduling utility with a larger calendar display. See Hour 18 for
    details. |


    # Keeping Time with X11 Clocks


    If you''re a hot clock watcher, you''re in luck using X11, as you''ll find several
    clocks. You''re sure to find one like


    The clock client is more than just a clock; it''s an appointment calendar and
    mail notification program. You can run this client with a few simple options,
    for example:


    ```

    # rclock -bg -fg yellow -update 1 -geometry 80x80+718+0 &

    ```


