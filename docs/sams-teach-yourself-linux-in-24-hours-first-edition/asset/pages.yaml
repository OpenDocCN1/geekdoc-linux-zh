- img_proc: true
  md: "see how the rpm command can help you free up disk space and customize your\
    \ Linux installation by deleting packages of programs and supporting software.\n\
    \nYou can often trim the size of your directories by looking for less used programs,\
    \ or collections of graphics or text you don't need. You've already seen one way\
    \ to find directories that may be candidates for cleanup. But you should also\
    \ consider some other file types that may more obviously deleted.\n\nFor example,\
    \ some Linux programs create backup files with the tilde prefix. But you can search\
    \ for them as follows:\n\n```\n# find / -name * -xdev\n```\n\nOnce you feel comfortable\
    \ with the results, you can pipe the filenames into the rm command, using xargs\
    \ command to build a cleanup line (although you can also use the find command's\
    \ -exec command-line-option):\n\n```\n# find / -name * -xdev | xargs rm -\n```\n\
    \nYou should also search for files named core. These are core dumps, or dumps\
    \ of program memory created if a program aborts. Some of these can be huge for:\n\
    \n```\n# ls -1 /usr/lib/rhs/glint/core\n-rw------- root root 1076384 Sep 14 15:26\
    \ /usr/lib/rhs/glint/core\n```\n\nYou can use the bash or pdsh shells' limit command\
    \ to limit the size of these core files. You can limit the current allowable size\
    \ of core files, with the limit command's -c, option for:\n\n```\n# limit -c 1000000\n\
    ```\n\nThis doesn't mean that core dumps are limited to 1MB, but 1,000,000 512-byte\
    \ blocks! You can limit the size of core files with the -c option, as in\n\n```\n\
    # limitcoredumps 1000\n```\n\nThis sets the maximum size of core files is one\
    \ way to save disk space in the future. Other candidates for removal include\n\
    \n+   *bak, *.BAK\n  Backup files\n  *.0  Compiled object files from compiling\n\
    \  #  Backup files\n  *.1,*.2,.3  File extensions for system log files under the\
    \ /var/log directory. Some logs can grow large, and unless you really need them,\
    \ they should be deleted."
