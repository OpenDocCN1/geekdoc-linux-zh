  md: '# Table 2.3. Explanation of the different installation methods.


    | Method | Explanation |

    |---|---|

    | Local CD-ROM | The default method of installing Linux to your hard drive. This
    method does not use the supplemental floppy. |

    | Hard Drive | If you are unable to install from the CD-ROM, then you need to
    copy the \root directory tree to a FAT16 (DOS) partition on your hard drive. This
    method then loads the supplemental floppy and continues with the install. |

    | NFS | This method enables you to install from an NFS server (a type of network
    file system). |

    | FTP | This method enables you to install from an FTP server. |


    This book will focus on the CD-ROM install.


    # Installing from CD-ROM


    If you select to install from a CD, the program asks you to insert the CD into
    the player. It tries to auto-probe for an IDE CD on the system. If it doesn''t
    find an IDE CD, it presents a screen asking what kind of CD-ROM you have. The
    choices on the screen are follows:


    +   * SCSI

    If your CD is a SCSI adapter, it tries to find the SCSI adapter, and if it is
    unable, it asks you for what kind of SCSI device it tries to load. You will be
    asked if you want to autoprobe for the device or if you want to get options the
    device. In most cases, you shouldn''t need to specify any options.

    * Other CD-ROM

    If your CD isn''t an IDE or a SCSI, it probably falls under this category. You
    are presented with a long list of drivers. Choose which driver matches your CD-ROM
    and if you need to, special options.


    ![](img/91f0fe61bd3027cda34d2f54533df676_37_0.png)


    > If you have an IDE CD and it wasn''t detected, you''ll need to restart the install
    and at the very first screen get the kernel special to point out where the drive
    is:

    boot: linux hdx=cdrom

    Where hdx =


    ```

    Channel Jumper hdx

    ==================================

    ide0 master hda

    ide0 slave hdb

    ```'
