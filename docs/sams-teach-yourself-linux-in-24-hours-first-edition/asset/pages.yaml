  md: '# What Are Regular Expressions?


    Regular expressions are patterns, using special syntax (usually in text files,
    unless your search is for filenames). There are also extended regular expressions,
    but the difference, important for syntax, should not deter you from the valuable
    lesson of being able to construct patterns that will accurately match your desired
    search targets. This is important if you''re looking for text in files, and if
    you''re performing potentially dangerous tasks, such as multiple file deletions
    across your system.


    You can build an infinite number of regular expressions using only a small subset
    of pattern characters. Here''s a short list of some of these characters. You should
    be familiar with at least one (the asterisk) from the following examples:


    +   * matches any character

    * ? or matches a single character

    * [xxx] or [x-x] matches a character in a range of characters

    * matches matches a character such as \

    * ^pattern matches pattern to the beginning of a line

    * $pattern matches pattern to the end of a line


    This is not a comprehensive list of pattern characters. For more details, you
    can read the manual page (the ed command is discussed in Hour 14, "Text Processing").
    For now, you can try several examples using different patterns.


    You should know asterisk, which is useful for finding matches to all characters.
    If you want to find all text files in your directory with an extension of .txt,
    you can use:


    ```

    # ls *.txt 96hours.txt datalog.txt datebook.txt day67.txt

    # ls *1* *2* *3* *4* *5* *6* *7* *8* *

    08100097.db 14days.txt backup001.file phonelog.111597

    08100097.db 32days.msg day67.txt phonelog.111597

    08100097.db 32days.msg day67.txt phonelog.111597

    08100097.db 96hours.txt message.76

    14days.txt backup001.file phonelog.111597

    ```


    Obviously, this is not the result you want, because the multiple searches have
    printed duplicate filenames. To find exactly what you want, use a regular expression
    that tells ls to list any file with a number appearing in the filename, for example:


    ```

    # ls *[0123456789]*

    001file.0009 32days.msg day67.txt

    ```'
