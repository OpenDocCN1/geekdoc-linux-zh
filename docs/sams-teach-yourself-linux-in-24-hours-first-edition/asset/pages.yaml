- img_proc: true
  md: 'The format of the /etc/group file is: group, password, group number, and a
    comma-delimited list of users who belong to the group. This means that you can
    assign read, write, or execute permissions to your group, and allow or deny access
    to your files. As the root operator, or sysadmin, you can organize your users
    into different groups. This is important, and one of the reasons you might need
    to use the chown (change ownership) command, as you''ll see later in this hour.


    The final set of three characters denotes the read, write, and execute permissions
    you grant all other users. Now that you know how to read the permissions, take
    a look at some examples beforenmoving on to the chmod command.


    When you create a file, by default, you and the members of your group have read
    and write permissions on that file. You can change the default of file creation
    permissions with your shell''s umask command (see your shell''s manual page for
    details). Here''s a simple:


    ```

    # touch myfile

    # ls -l myfile

    -rw-rw-r-- 1 bball bball Nov 23 12:11 myfile

    ```


    This shows that (rw-) and your group (rw-) can read and write the file, whereas
    all others (r--) can only read the file. If myfile were available to everyone
    on your system, the permissions would look like this:


    ```

    -rw-rw--r 1 bball bball Nov 23 12:11 myfile

    ```


    Now anyone (rw-) can read or write this file. If myfile were only available for
    reading and writing to it, the permissions would look like this:


    ```

    -rw------- 1 bball bball Nov 23 12:11 myfile

    ```


    This shows that you (rw-), but not your group (--) or others (---), can read the
    file. How do you change these settings? With the chmod command.


    # Changing File Permissions with the chmod Command


    You can use the chmod command in several ways to change file or directory permissions.
    Learning how to use this command is not as easy as 1-2-3, but it is as easy as
    4-2-1!


    The chmod command can be used in at least two different ways. Although you can
    use chmod to create simple commands from text files, using the ++ command-line
    option (as you learned in Hour 6,\Using the Shell’), you might want to set exact
    permissions of certain files in your home directory, or as the sysadmin, of your
    system. The chmod command uses octal, or base eight, notation in modifying file
    or directory permissions. The 4-2-1 sequence corresponds to the three rwx sequences
    in the permissions flags.'
