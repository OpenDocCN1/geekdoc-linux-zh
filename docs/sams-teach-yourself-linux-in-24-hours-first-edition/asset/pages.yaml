    Now you''ve seen how to delete, rename, or move your files, how do you copy files?

    -line options. They won''t all be covered here, but you''ll learn some of the

    most commonly used options, which will save you time and trouble.

    You''ll most likely first use cp in its simplest form, for example:


    # Copying with the cp Command


    The cp, or copy, command is used to copy files or directories. This command has
    nearly 40

    command-line options. They won''t all be covered here, but you''ll learn some
    about the

    most commonly used options, which will save you time and trouble.


    ```

    # cp file1 file2

    ```


    This creates file2, and unlike mv, leaves file in place. But you must be careful
    when using

    cp, because you can copy a file onto a second file, effectively replacing it!
    In this regard, cp

    act just like mv. To show how this can happen, creating three files, each with
    a

    line of text, using the cat command:


    Now, copy a file onto another file, then check the file sizes and the contents
    of the new file:


    ```

    # cp file1 file2

    # ls -l file*

    -rw-rw-r-- 1 bball bball 14 Nov 13 18:12 file1

    -rw-rw-r-- 1 bball bball 14 Nov 13 18:14 file2

    -rw-rw-r-- 1 bball bball 23 Nov 13 18:12 file3

    ```


    It should be obvious that file1 has replaced file2. To avoid this problem (unless
    you really\want to overwrite the file), you can use the -b or -i options, which
    work just like mv. Here''s

    an example:


    ```

    # cp -i file1 file2

    cp: overwrite ''file2?'' n

    # cp -bi file1 file2

    cp: overwrite ''file2?'' y

    # ls file*

    ```


    file1 file2 file2- file3


