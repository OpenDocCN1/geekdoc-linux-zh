  md: '# Using the X Window System


    For example, if you''d like your terminal to use a larger or smaller font, all
    you have to do is move the cursor inside the terminal window, hold down the Ctrl
    key, and press the right mouse button. A menu called VT Fonts with a list of sizes
    will pop up, from which you can select or smaller sizes.


    ![](img/91f0fe61bd3027cda34d2f54533df676_132_0.png)


    One really great feature of nxterm''s VT Fonts is the Selection option. Here''s
    how it works: First, run the nxterm client, then start the client from the command
    line. The nxterm client displays different fonts in many variations, and you can
    see the effects of different point sizes or orientation on a selected font. If
    you''ve found an extremely readable font for your display, click the Select button
    at the top of the nxterm window, move your cursor to the nxterm window, hold down
    the Ctrl key, press the right mouse button, and select the VT Fonts menu item
    Selection. Voila! Your window will now use the font you selected with the xterm
    client. This is handy for finding the best typeface for your terminal.


    Many of the features of your terminal window depend on the window manager you
    select. Although nearly all terminals support scrolling, not all emulators have
    nicely drawn scrollbars. You can control whether or not scrolling is enabled and
    scrollbars are visible by holding down the Ctrl key and pressing the middle mouse
    button (for two-button mouse users, make sure you''ve enabled three-button emulation,
    and depress both mouse buttons). You''ll find many other features you can change
    on-the-fly with this convenient menu facility.


    The nxterm or xterm emulators have many more features, including the ability to
    display Tektron graphics. But if you don''t need all of these features, or need
    more memory to run programs, you might want to use the rxvt terminal emulator,
    discussed next.


    # Using the Memory-Efficient rxvt Terminal


    The rxvt client, or terminal emulator, is a color-capable X11 console window with
    fewer possibly more useful, features, than the nxterm or xterm clients:


    +   - Smaller, so this uses less memory or swap space

    - Color-capable terminal emulator

    - Supports X Toolkit command-line options

    - Does not have Tektronix 4014 emulation, which is not really needed for standalone
    Linux X11 workstations


    ![](img/91f0fe61bd3027cda34d2f54533df676_132_1.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'to run programs under X that are normally run from a non-graphical environment
    (the console), for example:


    ```

    # rxvt -e pico &

    ```


    This command will run the pico editor (part of the pine mail program) in a standalone
    window. You can create, open, edit, and save files, but when you quit the pico
    editor, the window will disappear. This is a great way to run interactive console
    programs under X.


    The rxvt client also supports a number of X Toolkit options, as you''ll see in
    the next section. By using these options, you can start your rxvt terminal at
    any location of your desktop, with any available font, and with a selection of
    foreground and background colors.


    # Learning X11 Basic Operations


    A number of basic operations are important for you know about using X11 and X11
    clients. Many programs accept similar command-line options, so you can customize
    the size, color, and placement of client windows. This section introduces you
    to some of the most common command-line options and shows how to use them.


    ![](img/91f0fe61bd3027cda34d2f54533df676_133_0.png)


    > Not all X11 clients support the same X11 options, known as X Toolkit command-line
    options. For a full discussion of these options, see the X manual page, found
    under the /usr/X11/man/man directory, or an individual client''s manual page for
    details.


    # Using X11 Client Geometry Settings


    You can use the geometry option, usually in the form of -geometry width+height+offset+yoffset,
    to manage how where your client''s window will be displayed.


    For example, if you want to start an rxvt terminal in the upper left corner of
    your screen, you would


    ```

    # rxvt -geometry 80x25+0+0 &

    ```


    This command starts an 80-character, 25-line rxvt terminal, and places its window
    at the upper left corner of your display. Here''s a neat trick: If you are using
    a virtual-window-capable window manager, and have several desktops available,
    you can start terminal emulators not only in your desktop, but also in other desktops.


    ![](img/91f0fe61bd3027cda34d2f54533df676_133_1.png)'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Using the X Window System


    For example, if your current desktop is 800x600, you can easily start other X11
    clients in adjacent desktops by specifying the x and y offsets, as follows:


    ```

    # rxvt -geometry 80x25+0+1

    # rxvt -geometry 80x25+0+61

    ```


    The first command line will start another terminal window, but at the upper left
    corner of the desktop immediately to the right. The second command line starts
    another terminal window, but at the upper left corner of the desktop immediately
    below. This is a handy feature if you want to set up only your desktops, but others
    you start X11. Using this approach, you can start word processing in one desktop,
    a Web browser in another, and a graphics program in a third (assuming you have
    enough memory).


    The geometry specification is extremely useful for building organized, working
    screens. You can also use the convenient "save desktop" features of the fwm family
    of window managers to build your displays manually, and then save the window settings
    to be later edited into your .xinitrc initialization file.


    ![](img/91f0fe61bd3027cda34d2f54533df676_134_0.png)


    > The .xinitrc file usually resides in your home directory, and should be copied
    from the system xinitrc file, found in /etc/X11/xinit


    # Setting Background and Foreground Colors for X11 Clients


    You can also usually set background and foreground colors for different parts
    of your X11 client''s window with the -bg and -fg color command-line options.
    You can find a list of colors supported by the XFree8 X11 servers in the file
    rgb.txt in /usr/X11/lib/X11 directory. For example, to start the rxvt terminal
    emulator with a red background and yellow text for the foreground, you would use


    ```

    # rxvt -bg red -fg yellow

    ```


    If you''re using X11 in the 8pp (8 bits per pixel) mode (256 colors) with the
    XF86_SVGA server, you''ll find a more limited selection of colors available. For
    example, you''ll only have 16 colors available if you use the XF86_VGA16 server,
    or only black and white if you use the monochrome server, XF86_Mono. You might
    also try to see the available colors by using the xmap client, which displays
    the colors in a grid, and gives the rgb (red, green, and blue) values of the color
    in base 16, or hexadecimal (see the X and xmap manual pages for more information).
    Another program to show the rgbw client, which will automatically list the contents
    of the rgb database, rgb.txt.


    ![](img/91f0fe61bd3027cda34d2f54533df676_134_1.png)'
