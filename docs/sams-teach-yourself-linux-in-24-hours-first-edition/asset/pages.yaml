    # Formatting Text with TeX


    The TeX typesetting system, originally by Donald E. Knuth, is a collection of
    programs and other utilities used to produce professionally formatted documents.
    It is a much more sophisticated system than the groff distribution, and includes
    more than 65 programs, along with related support files, such as libraries, macros,
    fonts, and documentation.


    If you install TeX on your system, you will need at least 30 megabytes for the
    main distribution, 10 megabytes for a series of related macros called LaTeX, and
    eight megabytes for 50 different'
