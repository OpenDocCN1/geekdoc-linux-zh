  md: 'This command will run Netscape, the application, and its additional components,
    which

    include mail, discussions, and composer, which will appear in a short vertical
    floating window

    can put off to one side of the screen. You can then run the desired component
    by clicking

    one of the icons in the small window.


    There''s not enough room in this hour to discuss all of the various components
    and the

    differences between different versions of Netscape Communicator, but you can find
    a lot of

    information by using Netscape''s Help menu system information. Using Mosaic and
    other

    brows, Netscape installs all of the help files you need to get started on your
    hard drive.

    You find information about each component, and how to set up and use it, along
    with

    a full discussion of HTML page composition.


    Figure 13.2 shows the Netscape communicator browser.


    # Figure 13.2.

    The Netscape Communicator browser, one of the\most popular Web

    brows, comes in a

    Linux version and

    supports most of the

    popular plug-

    ins.


    ![](img/91f0fe61bd3027cda34d2f54533df676_227_0.png)


    Interestingly enough, Netscape''s installation script does not create the

    required directories or links for Netscape''s built-in help files by default.

    This will result in an error message when you try to use Help for the first

    time. You can fix this by creating the required link with:


    ```

    # 1 -s /opt/netscape /usr/local/lib/netscape

    ```


    After you''ve created this symbolically linked directory, you will be able to

    use the Help menu in Navigator.


