    # # Sending and Receiving Faxes


    If your modem supports fax protocols, chances are that you can send and receive
    faxes with Linux. Sending and receiving faxes under Linux involves graphics translation
    of received files and files you want to send. Your Linux distribution on the CD-ROM
    contains the efax family of fax software and documentation. You should have your
    modem''s documentation on hand and read the efax manual pages and documentation
    under the /usr/doc directory carefully before you start.


    # # Faxing with the efax System


    The efax system, by Ed Casas, is a simple and easy-to-use fax system, best suited
    to its documentation, to a single-user, standalone Linux system. This software
    consists of a series of programs and scripts, and supports Class 1 and 2 fax modems.


    The system is made up of the following programs:


    +   - /usr/bin/efax—The faxing program

    - /usr/bin/ef—A graphics conversion program used to prepare text files for faxing
    or converting files to different graphics formats

    - /usr/bin/fax—A shell script used to create, send, receive, or print fax files


    If you want to preview or fax PostScript graphics files, you''ll also need to
    have the gs PostScript interpreter and the companion viewer, ghostview, installed
    on your system. For viewing received faxes, you can use the X11 clients xv, ximage,
    or xwud.


    ![](img/91f0fe61bd3027cda34d2f54533df676_171_1.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Using Communications Programs


    Before you make changes to the /usr/bin/fax shell script, make a copy first. If
    you make errors or delete the file, you''ll need to reinstall the efax software.


    Before you start sending or receiving faxes, you should take a look at the /usr/bin/fax
    script. This program is the main way you will send or receive faxes, but you''ll
    need to check several sections in the file to make sure the script is configured
    properly. For example, the first section lists the names of the efax programs:


    ```

    FAX=/usr/bin/fax

    EFAX=/usr/bin/efax

    EFIX=/usr/bin/efix

    ```


    These shouldn''t pose a problem, because the programs are installed in the correct
    place you installed the software. The next section lists your modem:


    ```

    DEV=modem

    ```


    You can use the word modem if you''ve created a symbolic link. However, if you
    have Linux set up to answer calls for logins, you should use the actual name of
    the device—for example, cua1. The next section to check is the type of faxing
    your modem supports:


    ```

    # CLASS=1

    CLASS=2

    # CLASS=2.0

    ```


    Comment or uncomment the proper support by the octothorpe, and pound character
    (#), but make sure that one CLASS is listed. After this, you''ll need to customize
    your faxes with your phone number:


    +   - Use only digits, spaces, and the ''+'' character.

    FROM="000 000 0000"

    - Your name as it should appear on the page header.

    NAME="from a Red Linux system"


    Enter your phone number, such as "1 202 555 1212," and name, as "Catherine Taalbee,"
    into these strings. Finally, you''ll want to set the default page size for faxing—for
    example:


    ```

    PAGE=letter

    # PAGE=legal

    # PAGE=a4

    ```'
