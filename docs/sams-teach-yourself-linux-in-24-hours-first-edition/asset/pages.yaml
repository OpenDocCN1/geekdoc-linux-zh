  md: '# Using the Sams'' Teach Yourself in 24 Hours Series


    Welcome to the Sams'' Teach Yourself in 24 Hours series! You''re probably thinking,
    "What, they want me to stay up all night and learn this stuff? Well, not exactly.
    This series introduces a new way to teach you about exciting new products: 24
    one-hour lessons, designed to keep your interest and keep the learning process
    is broken into small units, you will not be overwhelmed by the complexity of some
    of the new technologies that are emerging in today''s market. Each hourly lesson
    has a number of special items, some old, some new, to help you along.


    Minutes

    The first 10 minutes of each hour lists the topics and skills that you will learn
    about by the time you finish the hour. You will know exactly what the hour will
    bring with no surprises.


    Minutes

    Twenty minutes into the lesson, you will have been introduced to many of the newest
    features of the software application. In the constantly evolving computer arena,
    knowing everything a program can do will aid you enormously and in the future.


    Minutes

    Before 30 minutes have passed, you will have learned at least one useful task.
    Many of these tasks take advantage of the newest features of the application.
    These tasks use a hands-on approach, telling you exactly which menus and commands
    you need to use to accomplish the goal. This approach is found in each lesson
    of the 24 Hours series.'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# 4 Minutes


    You will see after 40 minutes that many of the tools you have come to expect from
    the Sam’ Teach Yourself series are found in the 24 Hours series as well. Notes
    and Tips offer special tricks of the trade to make your work faster and more productive.
    Warnings help you avoid those nasty time-consuming errors.


    # 5 Minutes


    By the time you''re 50 minutes in, you''ll probably run across terms you haven''t
    seen before. Never before has technology thrown so many new words and acronyms
    into the language, and the New Terms elements in this series will carefully explain
    each and one of them.


    # 6 Minutes


    At the end of the hour, you may still have questions that need to be answered.
    You know the kind—questions on skills or tasks that come up every day for you,
    but weren''t directly addressed during the lesson. That''s the Q&A section can
    help. By answering the most frequently asked questions about the topics discussed
    in the hour. Q&A not only answers your specific question, it provides a succinct
    review of all that you have learned in the hour.'
  merge: -1
