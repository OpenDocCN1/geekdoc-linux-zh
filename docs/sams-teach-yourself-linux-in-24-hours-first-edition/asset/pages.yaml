    can use this program to draw intricate drawings or other illustrations you can
    later include in documents or graphics. The xfig program can import .gif, .jpeg,
    .pcx, .xpm and PostScript documents. One interesting feature is its ability to
    spell check any text in your drawings.


    Customize xfig''s default colors or keyboard commands by editing the files Fig-color
    and Fig using the /usr/X11/lib/X11/app-defaults directory. For more details about
    how to use xfig, see its manual page.


    # A Word About Scanners


    Although Linux runs on many different computers and supports many different hardware
    devices, the state of scanner support is still in its infancy. Before you use
    a scanner with the express purpose of using it with Linux, carefully check all
    Linux Internet sites for scanning software, and carefully read the documentation.


    You''ll find scanner support for many models from Nikon, Epson, Genius, Hewlett
    Packard, and Mustek. Most scanners for Linux require a small computer system interface,
    or SCSI interface, you''ll find support for the Connectix series of QuickCams
    using your computer''s parallel port. But there are variations between models
    of scanners even from the same manufacturer, and not all models in a particular
    series of scanners may be supported.'
