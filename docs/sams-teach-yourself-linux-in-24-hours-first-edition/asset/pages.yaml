    # Monitoring Your Serial Ports with the statserial Command


    The statserial program, originally by Jeff Tranter, can be used to show the status
    of your serial ports, and can be a lifesaver if you need to troubleshoot modems
    or serial ports. To use statserial, you must specify the device on the program''s
    command line. You can, for example, tell statserial to monitor your modem by specifying
    its symbolic link:


    ```

    # ln -s /dev/cuat1 /dev/modem

    # statserial /dev/modem

    Device: /dev/modem

    ```


    | Signal Pin Pin Direction Status Name |

    |---|---|---|---|---||

    | PG | (25) (9) | | | Frame Ground |

    | TxD | 2 | 3 | out | | Transmit Data |

    | RxD | 3 | 2 | | in | Receive Data |

    | RTS | 4 | | | | Request To Send |

    | CTS | 5 | | | in | Clear To Send |

    | DSR | 6 | 6 | in | Data Set Ready |

    | GND | 7 | 5 | | | Signal Ground |

    | DCD | 8 | 1 | in | | Data Carrier Detect |

    | DTR | 20 | 4 | out | | Data Terminal Ready |

    | RI | 22 | 9 | | in | Ring Indicator |


    > You must be the root operator to use the statserial program.


