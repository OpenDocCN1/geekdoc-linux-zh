  md: '# Using the Shell


    There are several shells that are also included with Linux: tcsh, a simple shell
    and Tcl interpreter; wish, a windowing shell for X11; and rsh, a remote shell
    for running commands over a network. For details, see the tcsh, wish, and rsh
    manual pages.


    ![](img/91f0fe61bd3027cda34d2f54533df676_106_0.png)


    # Features of ash


    The ash shell, by Kenneth Almquist, is one of the smallest shells available for
    Linux. This shell has 24 different built-commands, and 10 different command-line
    options. The ash shell supports most of the common shell commands, such as ed,
    along with most of the normal command-line operators (discussed in the later section,
    “Understanding the Shell Command Line”).


