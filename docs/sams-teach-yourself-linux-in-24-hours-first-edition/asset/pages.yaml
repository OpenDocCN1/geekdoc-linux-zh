    This is the end of the file.

    ```


    Then, when you''re done typing, press Ctrl+D to close the file. To see if this
    works, try


    ```

    # ls -1 myfile.txt

    -rw-rw-r-- 1 bball bball 61 Nov 12 18:26 myfile.txt

    ```


    ```

    # myfile.txt

    This is the cat word processor.

    This is the end of the file.

    ```


    You should also know that the cat command will print out the contents of any file,
    and not just text files. Although cat may be useful to look at one or several
    short files, what do you do when you want to read longer text files? Read on,
    and you''ll learn about pager commands, which will make life easier when reading
    longer files.


    # Reading Files with the More Command


    The more command is one of a family of Linux commands called pagers. P commands
    let you browse through files, reading a screen or line at a time. This can be
    extremely helpful, especially if you read a lot of manual pages, because the man
    will use a pager to display each page.


    The more command is a traditional pager in the sense that it provides the basic
    features of early pagers. You can use more on the command line with


    ```

    # longfile.txt

    ```


    If you need help, you can tap the H to see a help screen. You can also run other
    commands from inside more by using the exclamation character (!). Reading through
    a text file is easy because you can advance one screenful (the current screen
    size) by tapping the spacebar, and you can go backward one screenful by tapping
    the B key.


    ![](img/91f0fe61bd3027cda34d2f54533df676_79_0.png)


    # 4'
