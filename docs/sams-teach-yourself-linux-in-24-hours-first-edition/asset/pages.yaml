  md: '# PART II


    # Hour 8 Exploring Other X11 Window Managers


    In this hour you''ll learn about several alternative window managers for the X
    Window System. There are more than 50 different window managers for X11, each
    with different themes, desktop colors, and decorations (for example, window controls).
    You''re sure to find one you like. These window managers range from simple to
    complex, and some can be a challenge to install and configure.


    Choosing a window manager is a matter of personal preference. Each window manager
    discussed in this hour handles terminal windows, but is different in ease-of-use,
    convenience, size, and style. These window managers visibly demonstrate the graphic
    flexibility of the X Window System. You''ll soon learn that there are no "standards"
    for the standard X11 graphical user interface.


    ![](img/91f0fe61bd3027cda34d2f54533df676_148_0.png)'
  merge: -1
