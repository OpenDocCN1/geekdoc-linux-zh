    # Hour 23


    # Archiving


    This hour continues the discussion of basic system administration skills and shows
    you how to back up and restore your system by using several different Linux utilities
    (included on your CD-ROM). With a little effort, you''ll be able to easily perform
    these system administration tasks.


    # Considerations Before Performing Backups and Restores


    There are several things you should consider before backing up or restoring your
    system. Although one ideal time to back up is after you''ve installed Linux and
    make sure all your devices (such as the sound card, graphics card, or tape drive)
    are working, there are other considerations. For example, if the kernel supplied
    on the CD-ROM works well for your system, then you can simply rely on the CD for
    your initial backup case you have to do a full restore.


    You should understand the difference between a backup and an archive. Backups
    are performed at regular intervals to save important documents, files, or complete
    systems.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Hour 23


    Archives are made to save important documents, files, or complete systems for
    long periods of time. This means that you should first devise a backup strategy
    and ask yourself the following questions:


    +   - Do I need to use a formal backup strategy?

    - Do I need to back up the entire system each time?

    - Do I need to back up selected files or whole directories?

    - How often should I do the backup?

    - How long do I need to keep my archived copies?

    - Do I need reports or statistics on the backups?

    - What media (such as floppy or tape) should I use?

    - What software format (such as tar or dump) should the backup be?

    - Do I need to use any specialized software tools, such as backup scripts, or
    can I perform the backups by hand?

    - Should compression, straight copying, or encryption be used?


    You can answer some of these questions by looking at the way you use your Linux
    system. If you''re using Linux for word processing or running spreadsheets, you
    can probably get away with only backing up files or directories. If you''re using
    Linux to learn programming, you''ll want to keep not only original copies of your
    programs, but perhaps different versions. If you have other users on the system,
    you''ll want to not save copies of their directories, even the /etc/passwd file,
    or even the whole system, so that you can quickly restore the system in the event
    of a hard drive crash (unlikely) or system operator error (likely).


    The size of your system and the capacity of your hard drives or other storage
    devices determine how to approach a backup strategy. If your Linux system is small
    enough (around 200MB), you can quickly pick up everything to another hard drive
    or to a tape drive. You can also use a removable media drive, such as an Omega
    Zip Drive or Sysquest EZ-flyer. If you only have to save copies of a small number
    of small files, you may even be to use high-density floppies for storage.


    You''ll probably decide on a combination of archiving and regularly scheduled
    full or incremental backups. You need to choose the software to use and explore
    how to automate as much of the process as possible, perhaps using crontab entries
    (discussed in Hour 24, Scheduling”). Whatever you do, when you decide your strategy,
    stick to it! The worst time to create and use a backup strategy is after you run
    into problems or lose files.


    ![](img/91f0fe61bd3027cda34d2f54533df676_361_0.png)


    23'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Backing Up Your System with the tar Command


    Although use of the tar command was discussed in Hour 5, "Manipulation and Searching
    Commands," as the system administrator, you''ll want to explore some of the more
    complex command-line options and experiment with creating backups before implementing
    your backup strategy.


    The tar command creates a tape archive. You can write the archive to your hard
    drive, a tape drive, or nearly any other Linux device. To create a quick backup
    of your users'' directories, use tar to create the archive. For example,


    ```

    # tar cPfc users.tar / home

    ```


    This command line creates the tape archive users.tar in the current directory.
    One way to regularly back up your directories is to save them on a different file
    system. If you have a DOS or Windows partition mounted (see Hour 21, "Handling
    Files"), automate the backup process with a crontab entry:


    ```

    30 17 * root tar cPfc /mnt/dos/windows/desktop/users.tar / home

    ```


    This entry, in the /etc/crontab file, backs up your users'' directories at 5:30
    p.m. each day and saves the archive in the Windows desktop folder. As you can
    see, automating the backup process isn''t hard, and has the benefit of working
    in the background without your attention: a process called an unattended backup.
    If you save your data on a separate file system, you can easily restore the files
    later by using the tar command''s x, or extract, option:


    ```

    # cd /

    # tar xvf /mnt/dos/windows/desktop/users.tar

    ```


    These commands restore your users'' directories and files, starting at the / or
    root directory. While backing up files to another file on your hard drive is easy,
    you can also use the tar command with tape drives by specifying the tape device
    on the tar command line.


    > Unfortunately, there are no utilities to format tapes under Linux. Although
    you must still use a DOS or Windows utility to do this, you won''t have to bother
    with formatting if you purchase preformatted tapes.


    ![](img/91f0fe61bd3027cda34d2f54533df676_362_0.png)


    This hour doesn''t detail all the ins and outs of installing or using different
    tape devices, but it does show you the general approach and some examples you
    might want to try. To use a tape drive with the tar command, you must find the
    tape device under the /dev directory. There are a number of them, but this section
    uses the floppy tape driver, /dev/ftape, as an example.'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Although most tape drives will rewind a freshly inserted tape, you can use
    the mt, or magnetic tape command to rewind or re-tension your tape. Insert the
    tape, then use the following:


    ```

    # mt -f /dev/ftape rewind

    ```


    After the tape has rewound, erase it with the mt command''s erase option:


    ```

    # mt -f /dev/ftape erase

    ```


    After the tape has been erased, you can write a tape archive to the tape by specifying
    the /dev/ftape device:


    ```

    # cd /

    # tar cf /dev/ftape /home

    ```


    This command creates a tape archive of all the files and directories under the
    /home directory. To restore your tape archive, you must use the tar command''s
    extract, or x command-line option:


    ```

    # cd /

    # tar xf /dev/ftape

    ```


    There are many more options with the tar command. You''ll want to explore some
    of them, such as the d option to test archives, or the z option to compress files
    (and save space). For more information, see the tar manual page and read the ftape-HOWTO
    under the /usr/ directory.


    # Using the cpio Command to Backup and Restore


    The cpio, or copy in and out command, may be used in the same way as the tar command,
    but with several differences, especially with archive creation and extraction
    command-line options. For example, to create a cpio archive, you must use the
    -o, or create option. The cpio command also requires a list of filenames, with
    paths, to build an archive. To do this, use the find command which easily handles
    the required names for you.


    For example, if you have a directory called x11 that contains a number of files
    you''d like to archive, you can combine the output of the find command with the
    cpio command to build the archive.


    ```

    # find x11 | cpio -ov >x11.cpio

    cpio: x11 truncating inode number

    x11

    x11/xfree86faq.txt

    x11/xapp5faq.txt

    x11/x11faq.txt

    x11/disaster.txt

    x11/XHints.txt

    1082 blocks

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_363_0.png)'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Archiving


    This command line shows that the cpio command has been fed the names of the files
    inside the xl1 directory, creating an archive with the -o option and showing you
    the files added with the -v option. The name of the archive is x11.cpio, and it
    is created using the greater than, or >, redirection operator.


    To restore a cpio archive, use the cpio command''s extract, or -i command-line
    option:


    ```

    # cpio -i < x11.cpio

    1082 blocks

    ```


    This command line shows that to extract a cpio archive you can use the less than,
    or < redirection operator in conjunction with the -i cpio extract option. The
    cpio program recreates the directory and finishes by printing the number of 512-character
    blocks that were written to your hard drive.


    You can also use the combination of the find command and cpio to create archives
    of any directory, or even files from your system. To back up all files in your
    directory that belong to you, and are less than one day old (or have been modified
    in the last day), you can use the find command''s -user and -mtime command-line
    options:


    ```

    # find /home/bball -user bball -mtime -1 cpio -o today.cpio

    ```


    This command line creates a cpio archive, today.cpio, which contains all the files
    you''ve modified in the last 24 hours. You''re only limited by your imagination
    in how to devise your backups, and how to back up your system. For more information
    on the cpio command, read its manual page. For more information on the find command,
    see Hour 5, or read the manual page.


    # Using the taper script for Tape Drive Backups and Restores


    The taper program, by Yusuf Nagree, is a backup and restore program used to create
    compressed or uncompressed archives of selected files or directories. This program
    provides a nice interface to creating and maintain tape archives. You may also
    use other types of media to your backups.


    Using taper command is easy. Specify the type of media to use with the -T media
    option. According to the latest documentation, the taper command supports the
    following:


    +   - tape—The floppy drive driver, used for tape drives that attach to the floppy
    interface (this is included with your Linux system)


    +   - ztape—A new floppy drive tape driver that handles additional tape formats.


    +   - scsi—Driver for tape drives using a SCSI interface.


    +   - ide—Driver to support IDE tapes.


    +   - removable—Driver to support floppies, or removable hard drives.


    ![](img/91f0fe61bd3027cda34d2f54533df676_364_0.png)'
