    Red Hat Linux software, and upgrades, are available on the Internet.


    # # How to Use This Book


    This book is designed to teach you topics in one-hour sessions. All the books
    in the Sams'' Teach Yourself Linux series enable you to start working and become
    productive with the product as quickly as possible. This book will do that for
    you!


    Each hour, or session, starts with an overview of the topic to expect in each
    lesson. The overview helps you determine the nature of the lesson and whether
    the lesson is relevant to your needs.


    Each lesson has a main section that discusses the lesson topic in a clear, concise
    manner by breaking the topic down into logical component parts and explaining
    each component clearly.


    Interspersed in each lesson are special elements, called Just a Minutes, Time
    Savers, and Cautions, that provide additional information.


    ![](img/91f0fe61bd3027cda34d2f54533df676_21_0.png)


    JUST A MINUTE


    A Just a Minute is designed to clarify the concept that is being discussed. It
    elaborates on the subject; if you are comfortable with your understanding of the
    subject, you can bypass it without danger.


    ![](img/91f0fe61bd3027cda34d2f54533df676_21_1.png)


    TIME SAVER


    Time Savers inform you of tricks or elements that are easily missed by most computer
    users. You can skip them, but often Time Savers show you an easier way to do a
    task.


    ![](img/91f0fe61bd3027cda34d2f54533df676_21_2.png)


    CAUTION


    A Caution deserves the most attention, because a Caution points out a problematic
    element of the topic being discussed. Ignoring the information contained in a
    Caution could have adverse effects on the task at hand. These are the most important
    special elements in the book.'
