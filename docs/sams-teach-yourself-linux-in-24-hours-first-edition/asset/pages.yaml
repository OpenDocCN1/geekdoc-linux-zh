  md: '# PART

    II


    # Hour 5


    # Manipulation and Searching Commands


    In this hour, you''ll learn about creating, copying, deleting, and moving files
    and directories. You''ll also learn about searching through files and how to compress
    and uncompress files. This information will build on information you''ve learned
    in the last hour, and the commands you learn here will be used later in this book.


    # Manipulating Files or Directories


    Using Linux isn''t different from any other computer operating system. You create,
    delete, and move files on your hard drive in order to organize your information
    and manage how your system works or looks. This section shows you how to do these
    tasks easily.


    Although the graphical interface for Linux, the X Window System, may offer drag
    and drop multiple selections in order to copy or delete files, many of the commands
    you learn here form the base of these operations. It is worth knowing how these
    programs work, even if you don''t use Linux in the console mode.'
