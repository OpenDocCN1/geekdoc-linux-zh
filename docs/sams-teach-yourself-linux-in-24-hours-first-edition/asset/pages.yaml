  md: '# # PART

    IV


    # # Hour 18

    Personal Productivity Tools


    This hour shows you some calendars, commands, and X11 clients you can use to help
    your personal productivity. Whether it''s keeping a diary or creating reminders,
    you''ll learn how to use these tools under Linux to keep you on track and on schedule
    with your life.


    Each program or technique discussed in this hour can be accomplished with software
    you''ll find on the CD-ROM that came with your book. After reading this discussion,
    you''ll find additional ways to use these programs to craft your own set of tools
    and techniques for personal productivity.


    ![](img/91f0fe61bd3027cda34d2f54533df676_292_0.png)'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Scheduling Personal Reminders and Tasks with the at Command


    If you need to keep track of important schedules, set reminders, or run programs
    unattended, you can use the at command. found under the /usr/bin directory, schedule
    commands, or jobs, to be run at a time you specify. For example, if you''re working
    on a project but need to remember to catch your car pool, you can enter a quick
    at job from the command line.


    ![](img/91f0fe61bd3027cda34d2f54533df676_293_0.png)


    Your system should allow you to use the at command by default. If it does not,
    see Hour 24, "Scheduling," on how to enable at command facilities for your system.


    The following shows the at command for the car pool example:


    ```

    # at 16:15

    xmessage -display :0.0 "The car pool is leaving in 15 minutes."

    Job 4 will be executed using /bin/sh

    ```


    This will tell the at command to run the xmessage program to display the text
    of your car pool on the specified X11 display. The -display command-line option
    will tell you the xmessage command screen to show the message on, usually 0.0,
    which you can find


    # printenv | fgrep DISPLAY

    This command line searches a listing of your environment variables (discussed
    in Hour 6,"Using the Shell") and prints the value of the DISPLAY variable. The
    end-of-text in the listing means that you should press Ctrl-D to close the command
    and then enter the job. If you make a mistake in the syntax of the command, you
    will receive a mail message at the scheduled time.


    You can also use the at command to provide a visual reminder, if you''re using
    X11, controlling the color of your desktop, for example:


    ```

    # at 16:15

    xsetroot -display :0.0 -solid Red

    xmessage -display :0.0 "The car pool is leaving in 15 minutes."

    Job 8 will be executed using /bin/sh

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_293_1.png)'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Personal Productivity Tools


    This will turn your desktop a solid red color at the appointed time, then display
    your message. As you can see, you can combine multiple commands to a number of
    things at once. If you find this approach convenient, you can also type these
    commands into a text file called carpool and run the commands with the following:


    ```

    # at 16:15 -f carpool

    ```


    As a further convenience, you can place this command line in your .intrc script
    in your home directory to schedule the job after X11 at the beginning of the day.
    You can see a list of scheduled jobs with the at command, for example:


    | Date | Owner | Queue | Job# |

    |---|---|---|--|

    | 17:00:00 12/07/97 | bball | c | 15 |

    | 18:00:00 12/07/97 | bball | c | 16 |

    | 19:00:00 12/07/97 | bball | c | 17 |

    | 20:00:00 12/25/97 | bball | c | 18 |


    This shows that three jobs are scheduled for December 7, with another scheduled
    for December 25. When you schedule jobs with the at command, a shell script containing
    commands is created in the /var/spool/at directory. The at command looks in this
    directory for your jobs, then prints them to your display.


    You can use the at command to schedule a job minutes, hours, days, weeks, or even
    years in advance. If you want to run your carpool reminder in three hours, you
    can use the at command''s plus sign (+)-line option, for example:


    ```

    # at +3 hours -f carpool

    ```


    This would run your job three hours from the current system time. If you want
    to remove one or two jobs, you can use the at command. For example, using your
    job queue to free the earlier example, you would type


    ```

    # at 16 18

    ```


    This would remove jobs 16 and 18, but leave the other two intact. Using the at
    command is a handy way to program one-time reminders for specific times. In the
    next section, I''ll show you how to schedule other jobs to run at regular intervals.


    > You can also use Rob Nation''s X11 client, rclock, to schedule reminders or
    run programs at a selected day or time. To build a reminder, create a file called
    rclock in your home directory and enter reminder command lines—for example: 11:30
    mwtf Time for lunch!

    This displays a reminder for lunch during the week.


    ![](img/91f0fe61bd3027cda34d2f54533df676_294_0.png)'
