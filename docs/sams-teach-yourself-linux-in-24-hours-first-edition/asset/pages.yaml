- img_proc: true
  md: 'fonts. Obviously, describing the entire system and how to use each different
    program in the TeX system is beyond this hour. But this section shows you to get
    started with a sample document.


    ![](img/91f0fe61bd3027cda34d2f54533df676_257_0.png)


    Previewing TeX dvi documents requires a preprocessing step that can take several
    minutes before the pages are even displayed. Files must first be processed by
    the MakeTeXPK program, and related processes can eat up your system resources.
    A better approach is to convert the file to PostScript with the /usr/bin directory,
    with: dvips -f texdoc.dvi=tex.ps, and to then use the ghostview program with ghostview
    tex.ps to read the file.


    CAUTION


    You''ll find documentation for TeX in a variety of places. You can read the manual
    pages for related files, check the /usr/info directory for TeX info, and browse
    to the /usr/lib/texmf/doc directory. There are 10 different directories of documentation
    files, but the easiest way to read about your TeX distribution is to use the lynx
    Web browser the following:


    ```

    # lynx /usr/lib/texmf/texmf/doc/index.html

    ```


    The TeX distribution files are displayed in an organized list, and you can browse
    through the list to download sample files and guides directly to your home directory.
    Beginning users should ideally read the TeX Frequently Asked Questions document.


    Like the grep program, TeX uses formatting commands inserted in your text files
    to manipulate how your file looks when printed. You will create your file, insert
    appropriate commands or macros to format text, and then process your document
    through TeX to create an output file, usually in dvi format, that you can preview
    or print.


    To see a sample of TeX using the LaTeX macros, try processing an example file
    in the TeX directories:


    ```

    # latex /usr/lib/texmf/texmf/doc/generic/pstricks/samples.tex

    ```


    This creates a file called samples.dvi. You should convert the file to PostScript
    first, then preview the document with the ghostscript program:


    ```

    # dvips -f <samples.dvi >samples.ps

    # ghostview samples.ps

    ```


    You''ll see that you can use TeX to produce complex diagrams and text. But you''ll
    have to make the effect to learn LaTeX first!


