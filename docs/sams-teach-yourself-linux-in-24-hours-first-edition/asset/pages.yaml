  md: "The finger command will extract the user's information from the /etc/passwd\
    \ file and print\nit a nice format. One of the other things you should note in\
    \ a user's /etc/passwd entry is\nt name of a shell at the end. This can be a unique\
    \ way to not only specify the type of shell\ny(your Linux system is set up to\
    \ assign the bash shell by default), but to restrict the user\nto a particular\
    \ program.\n\n# Restricting Logins\n\nYour users normally can change the shell\
    \ used after login through the csh command. You\nlist the currently available\
    \ shells by using the csh command's -1 (list shells) option, for\nexample:\n\n\
    ```\n# csh -1\n/bin/ash\n/bin/bsh\n/bin/bash\n/bin/csh\n/bin/ksh\n/bin/tcsh\n\
    ```\n\nThe csh command looks in a file called shells under the /etc directory,\
    \ and prints a list.\nThis does not mean that these shells are available, just\
    \ \"acceptable.\" You can edit this file,\n or removing shells that can be specified\
    \ by your users. You should make sure that the\nshell listed in this file are\
    \ available on your system. To change shells, you can type\n\n+   # csh -s /bin/ksh\n\
    Changing shell for root.\nShell changed.\n\nYou can also use the csh command to\
    \ specify a program, other than a shell, to use as the\nrun when the user logs\
    \ in, for example:\n\n```\n# csh -s /usr/bin/pico clobber\nChanging shell for\
    \ clobber.\nWarning: /usr/bin/pico/ is not listed as a valid shell.\nShell changed.\n\
    ```\n\nThe csh command will complain if the program is not listed as a shell in\
    \ the /etc/shells file.\nThen check if the change was:\n\n```\n# cat /etc/passwd\n\
    clobber:9Q4A.uFMhInA:502:502:Mr. Clober Doo,400 Pennsylvania Ave.\n202-5512,202-5500,/home:clobber:/usr/bin/pico\n\
    ```\n\nThe preceding example specified the text editor pico, which would allow\
    \ a user to do word\nprocessing, printing, or spell-checking of documents, but\
    \ that's all! As the user logs\ninto Linux, the user is right in the text editor.\
    \ After quitting the text editor, the user is logged\nout. This is a handy technique\
    \ you can use to restrict users, especially children, if you only\n them to play\
    \ a game."
