  md: '# Exploring Other X11 Window Managers


    +   - Menu control of terminal window scrollbars, fonts, color, and size

    - Sticky Buttons to put an application or window on every desktop

    - Pop-up mini-command-line windows for one-time single commands, in lieu of a
    terminal window

    - JPEG graphic formats for background graphics for the root display

    - More than 100 integrated programs and games

    - Session management, so open applications and window positions are remembered
    between sessions (like CDE)


    In order to use KDE, you must install the free QT software libraries from Troll
    Tech. You can download a copy from the following site:


    ```

    http://www.troll.no/d1

    ```


    After you install package of libraries, you must then download the KDE distribution,
    found in either compressed archives. You can find fin copies at the following
    site:


    ```

    http://www.kde.org

    ```


    Download the KDE packages, decompress and unarchive the file packages. If you
    download the files in RPM package format, make sure you''re logged in as the root
    operator, and use the rpm command (discussed in Hour 22, “Red Hat Tools”) to install
    the software:


    ```

    # rpm -i kde*.rpm

    ```


    For KDE you need about 13 megabytes of free hard drive space (less than one-third
    of CDE''s requirement). You also need to make sure your system''s /etc/profile
    file contains the PATH environment variable pointing to the path for the KDE binary
    files, and the directory under /opt/kde:


    ```

    PATH=/opt/kde/bin:$PATH

    KDEDIR=/opt/kde

    ```


    Insert the command startkde in your .xinitrc file and use the start command to
    start X11 and run KDE (see Figure 8.3).


    You''ll be pleasantly surprised by how polished and feature-laden this desktop
    environment is, but you should know that KDE is a work in progress. Some documentation
    may be missing, and not all programs may work to your satisfaction. Even so, this
    is a usable X11 environment, and you''ll definitely look forward to future versions.


