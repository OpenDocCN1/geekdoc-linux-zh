  md: 'Using the crontab command is an easy way to create, run, and manage regular
    tasks. Even though you can create your own reminders, you''ll want to use a calendar
    for short- or long-range planning.


    # Creating Appointment Reminders with the X11 calendar


    You can use Sanjay Ghemawt''s ical calendar to store appointments and reminders
    in a personal calendar. The ical client, found under the /usr/X118/bin directory,
    has a number of unique features and improvements over the cal or gcal calendar
    printing programs:


    +   - graphical X11 interface with menus, sliding controls, and buttons

    - Copy and paste, drag-and-drop notes, and appointments

    - Alarms for upcoming events

    - Multiple calendar views

    - Import, export, and autosaving of calendar files

    - Group sharing of calendar files

    - Printing of different calendars

    - cron-type scheduling of appointments, notes, or reminders

    - To-do checklists

    - Built-in help


    When you first run ical, the program shows the current month, set to the current
    day, along with a note, or appointment entry list on the right. The ical client
    also uses many of the standard X Toolkit command-line options, so you can change
    geometry settings to set the initial calendar size, or start the ical client as
    an icon, for example:


    ```

    # ical -icon

    ```


    or


    ```

    # ical -geometry 800x600

    ```


    Figure 18.1 shows the ical client.


    Notices are created by selecting a day, then clicking on and typing in the box
    below the calendar. Appointments for the day are created by clicking a specific
    time, and typing in the name of the appointment. You can drag appointments anywhere
    during the day to rearrange your schedule by holding down the middle mouse button
    (or both left and right mouse buttons if you''re using a two-button mouse).


    ![](img/91f0fe61bd3027cda34d2f54533df676_297_0.png)'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Figure 18.

    The ical X11 client features notices, appointments-to-do lists, and reminder alarms.


    ![](img/91f0fe61bd3027cda34d2f54533df676_298_0.png)


    After you have set your notice or appointments, you can also set an alarm to have
    the ical client warn you of an upcoming event. To set a reminder alarm, first
    click on the appointment, select the Item menu'' Properties item to set an alarm
    for an appointment. You can also just double-click on the appointment to bring
    up the alert dialog.


    You can tell ical to remind you from 1 to 15 days in advance, with up to 60 warnings
    the hour before an appointment. The ical alert notice window will pop up at the
    preselected times as a reminder.


    > The ical client must be running in order to receive alarms. You can, however,
    use the ical command and -popup command-line option. If you use -popup, ical will
    list all of the day''s appointments in a window, then exit after you press the
    Okay button.


    Figure 18.2 shows the ical client''s alarm dialog.


    If you select an appointment or notice, you can also make it repeat daily, weekly,
    monthly, or annually by selecting the pertinent Repeat menu item. When you cause
    an item to repeat, it will automatically be duplicated in your calendar.'
