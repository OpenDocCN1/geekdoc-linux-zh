  md: '# Installing Linux


    # Figure 2.9.


    This dialog box gives you a list of packages you can install.


    ![](img/91f0fe61bd3027cda34d2f54533df676_44_0.png)


    For the person wanting to fine-tune the items in the component listings, you can
    select individual packages by toggling the so named switch. If chosen, another
    screen, shown in Figure 2.10, enables you to pick and choose which sub-packages
    to install. A scrolling menu of all the package groups available is displayed,
    and you can select or deselect any package inside of a grouping. In selecting
    or deselecting individual packages, the install program may allow you to choose
    them again or will need to install other packages. This is due to the fact that
    other packages may depend on the un-selected package to properly work.


    # Figure 2.10.


    Selecting individual packages for installation. Not recommended for beginners.


    ![](img/91f0fe61bd3027cda34d2f54533df676_44_1.png)


    In, this mode, you can also get more information on what each package contains
    or is supposed to do, by pressing the F1 key. Continue onto the next stage of
    the install, tab over to the Ok button and the installation begins.


    # Format and Install


    Once any dependency issues have been resolved, the installation program lets you
    know that a complete list of installed packages will be put in the /tmp/install.log
    file. Press Enter to continue on the next stage. This stage is where each of the
    partitions that you chose previously to be formatted have new files placed upon
    them. Packages are now installed. You can follow the progress in the Install Status
    window.


    # Finishing the Installation


    This final section of the chapter covers the items needed to finish the install
    and get your Linux system booted. You still need the pre-planning pad of paper.'
