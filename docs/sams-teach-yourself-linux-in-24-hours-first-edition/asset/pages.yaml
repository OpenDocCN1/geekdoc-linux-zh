    # Configuring procmail and Writing Recipes to Fight Spam


    We''re all used to getting junk mail or telemarketing calls. After day after day,
    we receive offers for credit cards, home equity loans, long-distance service,
    or great deals on prime cuts of roast at the local food market. You can do something
    about unwanted postal mail, junk faxes, and telemarketing calls, but there''s
    no current regulation regulating junk email.


    You can, use procmail, which is found under the /usr/bin directory, to filter
    your incoming mail. You''ll need to create a directory, create several files,
    write a small script, and customize how incoming mail is handled by writing short
    filters, or procmail recipes. It will only take a minute or so to set up your
    system to organize incoming mail and dispose of junk mail.


    The first step is to create a text file, called .procmail, in your home directory.
    Then, type in the following, specifying the name of your mail directory (if you
    use pine, the directory is mail), the location of .procmail directory (which you''ll
    soon create), and the name of your procmail filter file:


    ```

    MAILDIR=$HOME/mail

    PMDIR=$HOME/.procmail

    ININCLUDE=$HOME/rc.mailfilter

    ```


    Save this file. Next, create a text file .forward in your home directory. This
    file should contain the following:


    ```

    "IFS='' '' && exec /usr/bin/procmail -f ;; exit 75 #username

    ```


    This command line controls procmail, and you should use your username instead
    of username. Now, make your .forward file world-readable, and your home directory


