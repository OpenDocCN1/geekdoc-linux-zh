  md: '# PART

    III


    # Hour 10


    # Connecting to the

    Internet


    In this hour, you''ll learn how to set up your Linux system to connect to the

    Internet by using the serial line Point-to-Point Protocol, known as PPP. After

    following the directions in this lesson, you should be able to connect to the

    Internet through your Internet service provider (ISP) to do email, Web

    browing, or file transfers. This hour''s lesson not only shows how to do this

    is the simplest, most basic way possible, but also points you to sources of

    information for more details so that you can troubleshoot or fine-tune your

    connection.


    I''m recommending that you use a PPP connection for several reasons:


    +   - Although it''s complex, it''s easy to set up.

    - You''ll find documentation and details on the protocol.

    - You can read the comp.protocols.ppp newsgroup for information.

    - It offers security on both ends of the connection.

    - It''s a common protocol supported by nearly all ISPs.

    - It''s flexible enough to accommodate different types of connections.'
  merge: -1
