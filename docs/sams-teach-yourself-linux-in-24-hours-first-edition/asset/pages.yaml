  md: '# Using the Shell


    computing tasks particular to the way you work and the programs you run. At your
    pipe commands may be simple, but as you gain confidence and understanding, you''ll
    be able to construct fairly complex pipelines.


    Pipes work well under Linux because many commands are also filters, which accept
    your shell''s standard input and send output to the shell''s standard output.
    Pipes may be used in nearly any computing task, and can be used to quickly find
    information, generate reports, transform data, or view results. First look at
    some few examples.


    ```

    # ls | grep

    # printf | grep EDITOR

    # roff -man manpage.1 | less

    # cat document.txt | wc -s "Document.txt Report" bball

    ```


    The first command pipes a listing of the current directory through the line printer
    command to report a report. The second example searches through a listing of your
    current environment and prints the value of the default text editor. The third
    example prints the formatted output of a manual page to your display so you can
    browse the document to check for errors. The last example pipes a text document
    through the word count command, wc, and then electronically mails a report to
    the number of characters, words, and lines in the document to the user bball.


    You''ll use pipes to confront and solve problems not usually solved by individual
    programs. For example, if you have a lot of documents on your system, you can''t
    remember which document contains a certain phrase, you can find this information
    quickly. Instead of running your word processor and opening each file, you could
    try typing the following:


    ```

    # find /home -name *.doc xargs grep administration | less

    ```


    This command uses the find command to search for the /home directory for all files
    ending in .doc, then pipes the names into the xargs command. The xargs command
    then runs the grep command to search for the word administration in each file,
    with results piped through the pager. You can also use pipes to not only find
    information, but to process data and create new files.


    ```

    # find *.doc xargs cat | tr ''\n'' sort | uniq tee dict | less

    ```


    The preceding command line builds a file that contains a sorted list of unique
    words contained in all your word processing files. What do you call this type
    of file? A dictionary! Although to be honest, not all the dictionary words may
    be spelled correctly. This command works by piping each found file through the
    tr command, which translates each character space into a carriage return to break
    the stream into one word per line. The stream of lines is sorted, and the uniq
    command removes all occurrences of similar lines except for one. You''ll notice
    the tee command has also been used to save the output of the stream to a file.


    ![](img/91f0fe61bd3027cda34d2f54533df676_118_0.png)'
