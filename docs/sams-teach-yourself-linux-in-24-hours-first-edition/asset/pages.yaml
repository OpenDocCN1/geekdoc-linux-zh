  md: '# Exploring X11 Programs


    You might also be interested in the xlock client. Although it is not a screensaver,
    xlock is a sophisticated terminal-locking program with nearly 50 command-line
    options and more than 50 different displays built in. The xlock client is helpful
    if you want to password-protect your display to prevent others from using your
    computer while you''re away.


    By default, after you start the xlock program, you must enter your password before
    you can use your display again. But you can use it as a simple screensaver without
    password protection to display a variety of animations, for:


    ```

    # xlock -duration 10 -nolock -mode random

    ```


    This command tells the xlock program to display a random selection of its animations,
    of which each will run for 10 seconds.


    ![](img/91f0fe61bd3027cda34d2f54533df676_143_0.png)


    > The xlock client can also make your desktop an animated display if you use the
    -inroot command-line option. This won''t protect your system, but you might find
    the visuals stimulating!


    JUST A MINUTE


    There''s not enough room in this hour to discuss all of the X11 clients on your
    CD-ROM. You will find discussions about different clients throughout the rest
    of this book, but this section shows some helpful programs that will give you
    more information about your system, and some tips and tricks on how to use them.


    # Listing X11 Fonts with x11fonts


    If you''d like a list of all the fonts recognized by X11 on your system, you can
    use the x11fonts client. You''ll want to use a pager less or more (discussed in
    Hour 4, "Reading and Navigation Commands") if you call the client with wildcards
    or patterns to match names. This can be handy to find a particular font on your
    system, for example:


