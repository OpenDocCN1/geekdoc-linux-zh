  pgno: 258
- img_proc: true
  md: 'If you''ve specified the right printer device, your printer should activate
    and print the current directory list. If nothing happens, try the following:


    ```

    # cat /proc/devices

    ```


    to see if the printer device driver was loaded or compiled into your kernel. You
    should see something like the following:


    Character devices:

    1 mem

    2 pty

    3 tty

    4 tty

    5 cua

    6 lp

    7 vcs

    10 misc

    14 sound

    127 pcmia


    Block devices:

    1 randisk

    2 fd

    3 ide0

    9 md

    22 ide1


    If you don''t see an lp device listed, make sure that parallel printing is either
    compiled into your kernel, or installed using the lp.o module, located under the
    /lib/modules/2.0.31/misc directory (see Hour 1, "Preparing to Install Linux,"
    for kernel configuration details).


    # Printing Documents with the lpr Printer System


    If you''ve installed a printer during the initial Linux installation process,
    you''ll find your printer defined in the /etc/printcap file. This file is an ASCII
    database of your system''s local and networked printers, and describes the capabilities
    of each printer.


    You can have different entries for your printer to handle color or black-and-white
    documents, or different paper sizes. Look at the following example:


    ```

    ##PRINTTOOL## LOCAL cdj500 300x300 letter {} DeskJet500 1 1

    l1:

    :sd=/var/spool/lp/lp1:

    :mx#0:\n:sh:\n:lp=/dev/lp1:

    :if=/var/spool/lp/lp/filter:

    ##PRINTTOOL## LOCAL cdj500 300x300 letter {} DeskJet500 3 1

    lcolor:

    :sd=/var/spool/lp/lp0:

    :mx#0:\n:sh:\n:lp=/dev/lp1:

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Preparing Documents


    ```

    :if=/var/spool/lpd/lp0/filter:

    ##PRINTTOOL## LOCAL cdj500 300x300 letter {} DeskJet500 8 1

    lprgrasy:

    :sd=/var/spool/lpd/lp0:\n:mx#0:\n:sh:\

    :lp=/dev/lp1:\n:if=/var/spool/lpd/lp0/filter:

    ##PRINTTOOL## LOCAL cdj500 300x300 letter {} DeskJet500 24 1

    lpcolorbest:

    :sd=/var/spool/lpd/lp0:\n:mx#0:\n:lp=/dev/lp1:\n:if=/var/spool/lpd/lp0/filter:

    ```


    This printcap file contains definitions (created with the printtool command, discussed
    in the following section, "Defining Printers with the printtool Command") for
    the lp, lpcolor, lgray, and lpcolor printers, but all describe the same printer.
    These names are handy as reminders when you want to print different documents
    (or if you need to change cartridges to use color).


    Linux uses a line printer spooling system. When you first boot, Linux starts lpd,
    the line printer daemon. The lp program runs in the background, waiting for print
    requests. You start a request with the lpr command:


    +   # lpr mydocument.txt

    # lpr myfile.ps


    This command line pools, or sends your documents to a file in the /var/spool/
    directory. You can also use the lpr command as a printing filter to print outgoing
    streams of formatted text:


    > # groff -Tasciii -mm myfile.txt | lpr

    This command line sends the output of the groff formatting program through the
    line printer spooler. You can also spool multiple files, then track your requests
    by the lpq spooler. See the following example:


    +   # lpr mes.txt

    # lpr test.txt

    # lpq


    | Rank Owner Job Files Total Size |

    |---|---|---|---||

    | active bball | | 16 mes.txt | 368 bytes |

    | 1st bball | | 17 test.txt | 359 bytes |


    To stop these print jobs, use the lrpm command:


    +   # lrpm 17

    This command stops the stopping of job 17, the file test.txt. You can also (as
    the root operator) disable or enable printers, or reorder jobs with the lpc command.
    See the lpc man for details.'
  merge: -1
