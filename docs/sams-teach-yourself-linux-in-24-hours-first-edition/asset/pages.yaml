    # Running Programs in the Background


    Most shells offer a way to start and then run programs as a background process.
    It is a handy way to get work done, especially if you''re working on a separate
    terminal, have limited screen space when working with X11, or have lost memories.
    Although Linux offers virtual consoles (accessed through the Alt and Function
    keys), and X11 window managers offer separate desktops, you''ll probably discover
    that you can run programs in the background many times while using Linux.


    Programs are run in the background from the command line using the &, or ampersand
    operator. For example, to start another terminal program under X11, you want to
    run the program in the background so that your current terminal is free for further
    input:


    ```

    # rxvt &

    ```


    This command starts the rxvt terminal, and your command-line-prompt returns. The
    program is assigned a process number you can see using the ps, or process status
    command.

    For example:


    ```

    # ps

    ```


    ```

    291  1 R      00:03 rxvt

    ```


    In this example, to keep the list short, not all of the running processes have
    been listed. You can stop the program by using the shell''s U command with the
    program''s process number:


    ```

    # kill 291

    [1] Terminated rxvt

    ```


    Using the kill command is a crude way to control background programs. There is
    a more refined approach that uses other shell commands. Depending on your current
    shell, you can put programs into the background, suspend the program, continue
    to run the program in the background, kill the program, or bring the program back
    to the terminal display. This is known as job control.'
