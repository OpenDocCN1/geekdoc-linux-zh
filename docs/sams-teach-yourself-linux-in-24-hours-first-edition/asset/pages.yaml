- img_proc: true
  md: 'The preceding example is a list of cities, separated by commas. By using several
    filters, including the pr command, the text has been formatted into a readable
    list, sorted alphabetically. This command works by first using the sed editor
    command (discussed in Hour 14) to change each comma and space to a pound (#) sign.
    The pound sign is translated to a carriage return, by the tr command (also discussed
    in Hour 14) and the text, now a list of words, one per line, is fed into the sort
    command. The sorted list is then fed into the pr command to produce three columns
    of the (-1, or page length option, with a value of 1 has been used to inhibit
    the page header.


    You can also use the fmt command with the pr command, to change the word wrap,
    or width of your text documents. The following example is part of a public-domain
    software license (found under /usr/doc/shadow-utils directory).


    ```

    # cat LICENSE

    ```


    +   1. You may make and give away verbatim copies of the source form of the Standard
    Version of this Package without restriction, provided that you duplicate all of
    the original copyright notices and associated disclaimers.


    +   2. You may apply bug fixes, portability fixes and other modifications derived
    from the Public Domain or from the Copyright Holder. A Package modified in such
    a way will still be considered the Standard Version.


    While this may be okay when printed on the screen, or by using the default settings
    with the pr command, the text overruns lines if you use a left-hand margin of
    10 spaces. Look at the following example,


    ```

    # pr -o 10 < <LICENSE

    ```


    +   1. You may make and give away verbatim copies of the source form of the Standard
    Version of this Package without restriction, provided that you duplicate all of
    the original copyright notices and associated disclaimers.


    +   2. You may apply bug fixes, portability fixes and other modifications derived
    from the Public Domain or from the Copyright Holder. A Packag modified in such
    a way will still be considered the Standard Version.


    The preceding certainly won''t look nice when printed! To fix it, use the fmt
    command to format the text into a smaller line width before formatting with the
    pr command:


    ```

    # cat LICENSE | fmt -w 60 | pr -o 10

    ```


    +   1. You may make and give away verbatim copies of the source form of the Standard
    Version of this Package'
