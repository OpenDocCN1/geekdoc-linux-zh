  md: '# PART

    IV


    # Hour 16


    # Graphics Tools


    In this hour you''ll be introduced to a variety of graphics programs and utilities
    for Linux. This hour starts with a short discussion of different graphics formats
    you''ll find on your system, then shows you how to convert graphics using filter
    programs and other graphics utilities. These programs are useful for creating,
    editing, and translating graphics imported from other computer systems.


    You''ll find a treasure trove of great graphics programs on this book''s CD-ROM,
    and you''re likely to be impressed with their usefulness and versatility. You''ll
    be able to translate nearly any type of graphic, and will be able to perform sophisticated
    operations to transform your graphics files.


    # Understand Linux Graphics File Formats


    There are many different types of graphics file formats, and examples of several
    types are installed in your system. You may already be familiar with several different
    formats, especially if you''ve used other computer operating systems. However,
    when you use Linux, expect to run into graphics files in formats you''ve never
    seen before.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Many files can be recognized by the filename.extension, or letters following
    a period in the filename. For example, you may recognize .GIF, .PCX, .TIF, or
    .JPG as common extensions. In Linux, you''ll also find files in formats such as
    .xbm or .xpm installed on your system. /usr/X11R/include/X11/bitmaps directory
    contains nearly 100 different bitmap files, and the /usr/X11R/lib/X11/xfm directory
    contains more than 100 black-and-white bitmap icons, or as more than 110 color
    pixicons.


    Table 16.1 is a list of some of the graphics formats, along with relevant conversion
    programs you''ll find on your system. To convert a graphic image from one format
    to another, see the page for the relevant conversion program.


