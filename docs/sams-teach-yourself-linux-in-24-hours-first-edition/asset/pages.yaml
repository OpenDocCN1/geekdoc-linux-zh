    This is only one way to use the bc command''s language. With a little effort,
    you can write your own. But if you''d rather use more complex programs to perform
    calculations, you know that you should use a spreadsheet application. The next
    section discusses the variety of spreadsheets for Linux.


    # Spreadsheets


    Spreadsheet programs offer a convenient way to store and manipulate financial
    or scientific data. You can use these programs to help manage your home or a business.
    Typical uses involve personal finance, such as tracking loans and investments,
    or running business inventory control, personnel worksheets, or accounting tasks.


    You can also use these programs for forecasting, or "what if" calculations. This
    can help you create estimates to use for home mortgages, auto loans, and even
    home construction. You''re limited only in your imagination with most of programs,
    and many only offer the ability to work as a whiz-bang calculator, but will also
    create graphic charts so you can graph your data visually.


    Although you won''t find any of these programs on your CD-ROM, once you''ve connected
    to your ISP (see Hour 10, "Connecting to the Internet"), you can use the Lynx
    Web or your downloaded copy of Netscape to get copies or more information about
    them. If you need to have a spreadsheet program to use with Linux, you''re in
    luck, because at least dozen are available, and nearly half come with source code
    so you can make changes, add features, or fix problems.


    # Using the Public Domain sc Spreadsheet


    The sc (spreadsheet calculator) command (see Figure 17.3) is a freely available,
    public domain spreadsheet program. This program is a collective work of nearly
    60 programmers, and runs on many different UNIX systems. With a little effort
    in learning its commands, you''ll be able to build very capable spreadsheets.
    The sc program is free, and it comes with source code. A short tutorial and manual
    page documenting its features is included.


    ![](img/91f0fe61bd3027cda34d2f54533df676_285_0.png)'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Learning Math and Financial Tools


    This program is especially handy if you''re running Linux on a small hard drive
    and disk space is at a premium. The sc program requires only about 120 kilobytes
    of disk space, but provides a lot of features.


    Using the sc program is easy. You can load programs from the command line when
    you start it, or you can load and save programs while it''s running. You can run
    this program as follows:


    +   # sc


    Figure 17.3.

    The sc spreadsheet calculator works or without the X Window System, and it comes
    with a short tutorial.


    ![](img/91f0fe61bd3027cda34d2f54533df676_286_0.png)


    If you''d like a quick reference to the sc commands, use the sc command (included
    with the source code), the scref command, and pipe the output through the less
    and less commands. Then read them at your leisure, or redirect to a file you can
    edit and print, for example:


    +   # scref | nroff -man | less > scref.txt


    To learn how to use the sc program, load the sc program''s tutorial, which you''ll
    find under the /usr/lib/sc directory:


    +   # sc /usr/lib/sc/tutorial.sc


    This will run sc and load the tutorial. An included program, called psc, can help
    import text-only data files by converting processor or other spreadsheet files.
    The sc program has more than 60 built-in functions, and because you get the source
    code, you can add your own. One place to find the code to the sc spreadsheet is


    http://www.cdrom.com/pub/linux/slackware_source/ap/sc'
