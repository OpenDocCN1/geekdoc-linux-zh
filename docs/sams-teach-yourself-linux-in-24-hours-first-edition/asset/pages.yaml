  md: '# PART

    II


    # Hour 4


    # Reading and

    Navigation Commands


    This hour introduces you to the basic Linux commands you''ll use for navigating,
    searching, and reading files and directories of your file system (the directories
    of your Linux partition). After working through the material, you should know
    how to get help on commands, find out where you are in Linux, and how to find
    files on your hard drive. The hour starts with navigating and searching your directory,
    and moves on to show you how to read directories and files. But, you''ll learn
    how to help yourself with the man command.


    # Getting Help with the man Command


    One of the first things to know about Linux is that help is never far away. Like
    most implementations of UNIX, your Linux distribution comes with manual pages
    for nearly each utility, command, or programming system call. You can get information
    about nearly any command, including man, by typing


    ```

    # man man

    ```


    Manual pages started out in UNIX as one-page descriptions, available on-line,
    usually under the /usr/man directory. The file for each manual page is named'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'with a single-digit extension, and placed in a subdirectory under /usr/man.
    For example, the manual page for man would be named and found as


    ```

    /usr/man/man1.1

    ```


    If you want to understand the format and placement of manual pages, you won''t
    find this information in man.1, but in man under /usr/man/man7. If you look at
    Table 4.1, you''ll see the locations and contents of each manual section.


    # Table 4.1. The Linux manual sections.


    | Directory | Contents |

    | /usr/man/man1 | Commands: commands you run from within a shell |

    | /usr/man/man2 | System calls: documentation for kernel functions |

    | /usr/man/man3 | Library calls: manual pages for 1ibc functions |

    | /usr/man/man4 | Special files: information about files in the /dev directory
    |

    | /usr/man/man5 | File formats: details of formats for /etc/passwd and other files
    |

    | /usr/man/man6 | Games Macro packages: descriptions of the Linux file system,
    man pages, and others |

    | /usr/man/man7 | System management: manual pages for root operator utilities
    |

    | /usr/man/man8 | Kernel routines: documentation on Linux kernel source |

    | /usr/man/man9 | routines |


    A manual page traditionally has a number of sections, with the documentation for
    the command broken down into sections. Look at Table 4.2 for the organization
    of a manual page.


    # Table 4.2. Organization of a manual page.


    | Section | Description |

    | NAME | The name of the command and a brief description |

    | SYNOPSIS | How to use the command and command-line options |

    | DESCRIPTION | An explanation of the program and its options |

    | FILES | A list of files used by command, and their location |

    | SEE ALSO | A list of related man pages |

    | DIAGNOSTICS | A description of unusual output |

    | BUGS | Known problems |

    | AUTHOR | The program''s main author and other contributors |


    ![](img/91f0fe61bd3027cda34d2f54533df676_65_0.png)'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Reading and Navigation Commands


    Online manual pages contain special typesetting codes for theroff text formatting
    program (see Hour 15, "Preparing Documents"), using special macros (as documented
    in man.7). This format is critically important for other programs, such as what,
    whatis, and apropos, which you''ll learn about later in this chapter.


    You can also find more detailed documentation for Linux commands and other subjects
    under the /usr/doc directory, which contains files called Frequently Asked Questions,
    FAQs, and HOWTOs, or How-To documents. Additionally, the Free Software Foundation,
    which releases the GNU software packages (many of the commands discussed in this
    book are GNU programs), puts much of its documentation in a special hypertext
    "info"


    ![](img/91f0fe61bd3027cda34d2f54533df676_66_0.png)


    Much of the software for Linux comes from the Free Software Foundation, or FSF,
    founded by Richard Stallman, author of the emacs editor (see Hour 14, "Processing").
    The FSF distributes its software under the GNU General Public License, or GPL.
    Part of the success and popularity of Linux and GNU is because of the terms of
    the GPL. If you want more information about the GNU software programs for Linux,
    the FSF, or the GNU GPL, you can try the info command, which is a reader for the
    GNU hypertext documentation, found under /usr/info directory.


    JUST A MINUTE


    The man command normally searches for manual pages according to instructions detailed
    in the man.config file under the /etc directory. These instructions define the
    default directories in which to look for manual pages, and they match the directories
    to the PATH environment variable, an abbreviated string of characters defined
    when you first start Linux and log in. Environment variables are discussed in
    Hour 6,"Using the Shell." The default places to look for these pages are


    +   MANPATH /usr/man

    MANPATH /usr/local/man

    MANPATH /usr/X11R6/man

    MANPATH /usr/lib/perl5/man


    ![](img/91f0fe61bd3027cda34d2f54533df676_66_1.png)


    A graphic version of the man command, called xman, is available for the X Window
    System. You can use xman not only to read manual pages, but to see directories
    of manual page entries. The xman program is handy and many users keep its small
    window active on their desktops.


    JUST A MINUTE


    4'
