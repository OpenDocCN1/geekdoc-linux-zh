  md: '# PART V


    # Hour 21


    # Handling Files


    This hour continues with the basics of system administration and introduces you
    to handling files under Linux. You''ll learn how to mount filesystems, manage
    the filesystem table (*stab), and format floppies. You''ll see how you can protect
    files and directories.


    You will use this knowledge to help you administer your Linux system. Knowing
    how to manage file ownership is an important skill and can help you overcome problems
    later on.


    One great reason to get up to speed about file access and ownership is to do with
    security. There are some important files in your Linux system that, as root operator,
    you don''t want all users to have access to. If you''ve set up your system to
    handle dial-in calls, you''ll want to make sure that important files, and even
    other mounted filesystems, such as DOS or Windows, are protected. If you share
    your computer, you normally wouldn''t want other users to have access to your
    files, but on the other hand, you might want to share files with other people,
    but don''t know how.


    This hour starts with a discussion of the Linux file system.'
  merge: -1
  pgno: 334
- img_proc: true
  md: "# How Linux Is Organized\n\nThere's a difference between a file system and\
    \ a filesystem. A file system is the layout of the directories and hierarchy of\
    \ files on a partition. A filesystem is the layout of the lower-level format of\
    \ a storage device. Linux recognizes a number of filesystems. You can find a list\
    \ in the fstab, or filesystem table, manual page under the /usr/man/man5 directory,\
    \ but it's best to look at the current list of supported systems in the mount\
    \ command manual page. Why? Because the mount command is used to mount the filesystem\
    \ at a mount point, or a path you choose. For now, take a look at the Linux file\
    \ system.\n\nThe software that comes with the Linux kernel is from a variety of\
    \ different UNIX systems. Some programs, utilities, and commands, like mail or\
    \ printing, come from a UNIX distribution, the Berkeley Software Distribution,\
    \ BSD. Other programs and methods of organizing software, such as startup scripts\
    \ and organization of files used during startup, come from either AT&T System\
    \ UNIX or later variants. Because of this mixed heritage, Linux has a mix of directories,\
    \ and although many pundits say Linux leans towards System V-ish, you'll find\
    \ elements of BSD and System V.\n\nTo give you a better idea, List 21.1 contains\
    \ an edited listing, courtesy of the tree command.\n\n# Listing 21.1. The basic\
    \ Linux file system, or directory tree.\n\n```\n/ root directory\n- bin programs\
    \ considered necessary\n- boot Linux boot image\n- dev devices, linux serial ports,\
    \ printers, hard drives\n- etc configuration files for network, X11, mail, etc.\n\
    - home where users live (including sysadmin)\n- lib software libraries\n- lost+found\
    \ recovered files (from e2fsck)\n- mnt where you mount other filesystems\n  -\
    \ cdrom\n  - dos\n  - floppy\n- proc kernel, device, process status files\n- root\
    \ where the sysadmin works, but doesn't live\n- root system binaries (read-only)\n\
    - temp files stored, deleted from here\n- usr hosts much, much software, libraries\n\
    - X11R6 X Window System software\n  - bin more software\n  - dict dictionaries\n\
    \  - doc FAQs, HOW-TOs, software documentation\n  - etc software configuration\
    \ files\n```"
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Handling Files


    +   - games - fun, fun, fun!

    - i486-linuxout

    - include - header files for programming

    - info - GNU information

    - lib - more software libraries

    - libc

    - local - programs not on CD-ROM

    - bin

    - doc

    - etc

    - games

    - info

    - lib

    - man

    - sbin

    - src - source code for programming

    - man - manual pages

    - man..9n

    - sbin

    - share

    - src - source for Linux!

    - linux -> linux-2.0.30

    - linux-2.0.30

    - tmp -> /var/tmp

    - var - system logs, compressed manual pages


    As you can see, the main directory structure is not that complicated. What is
    important to understand here is to know where you navigate the file system. When
    you install software, especially without the benefit of Red Hat''s rpm package
    management command (which you''ll learn about Hour 22, “Red Hat Tools”), you should
    know where different software should reside on your system. Many programs will
    also require different software components to be installed in different parts
    of the directory.


    If you look at the file system list, you will use a /mt, or mount, directory.
    Although you don''t have to use this directory as a gateway to other fileystems,
    this is traditionally where other systems are mounted. The next section discusses
    how to have these other systems appear under the mount directory.


    # Using the mount Command to Access Other Filesystems


    The mount command, found under the /bin directory, is an essential program used
    not only by sysadmins, but also by Linux during startup and shutdown. This command
    is used to mount filesystems and make them available in the directory tree. During
    startup, the primary Linux partition, an ext2 filesystem, is mounted at the root
    filesystem, or /, directory.


    ![](img/91f0fe61bd3027cda34d2f54533df676_336_0.png)'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Hour 21


    You can also have other filesystems mounted when Linux starts, or you mount and
    unmount filesystems, using the mount and umount commands, while you work. The
    Linux mount command recognizes and will mount (depending on your kernel is configured)
    more than a dozen different filesystems. This section concentrates on the common,
    such as ext2 for Linux, mdsdos for DOS or Windows, and iso9660 for CD-ROMs.


    # Understanding the Filesystem Table,

    /etc/fstab


    When you start Linux, one of the first scripts to run is the rc.sysinit script
    under the /etc/rc.d directory. This script mounts your Linux partition as read-write
    after it checks the partition for errors. Then, if everything is OK, it will mount
    all filesystems described in the filesystem table, fstab, under the /etc directory
    with the following command:


    ```

    # mount -a t nonfs

    ```


    This mounts all filesystems described in the /etc/fstab (except for NFS filesystems;
    see the mount command manual page for details). The /etc/fstab file is a short
    text file:


    ```

    # <device> <filesystem> <dump> <fck-ord>

    /dev/hda3 ext2 defaults,uscroota 1 1

    /dev/hdb /mnt/cdrom ignore 0 0

    /dev/cdrom /mnt/cdrom iso9660 auto,ro 0 0

    /dev/hda1 /mnt/dos mdsdos defaults 0 0

    /dev/hdc1 /mnt/flash mdsdos defaults 0 0

    /dev/fd0 ext2 noauto 0 0

    n /proc proc defaults

    /dev/hd2 none swap sw

    ```


    The fstab columns show the device, where the filesystem will be mounted, the type
    of filesystem, any mount options, whether or not the dump command (discussed in
    Hour 23, "Archiving") needs to check for files to be archived, and the order in
    which the filesystem is checked during reboot.


    The fstab rows show a Linux ext2 filesystem, which you configured to support quotas
    in the last hour; two CD-ROM devices (/dev/devcdrom is a symbolic link to /dev/hdb);
    a DOS filesystem partition on the same hard drive as the Linux ext2 partition;
    a flash RAM card; the floppy device; the /proc directory (used internally by the
    Linux kernel); and finally, the Linux swap filesystem.


    ![](img/91f0fe61bd3027cda34d2f54533df676_337_0.png)'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Handling Files


    ![](img/91f0fe61bd3027cda34d2f54533df676_338_0.png)


    You should know that editing the filesystem table by hand is inherently dangerous.
    You learned to add quotas in Hour 20, "Basic System Administration," but generally
    you should not edit this file by hand. Instead, use Red Hat''s graphical filesystem
    configuration tool, fstool, discussed in Hour 22. Use this tool if you need to
    add a hard drive, new partitions, and so on. Although you can edit the fstab file,
    before you do, make sure you have a backup boot disk on hand, and make a copy
    of the fstab file before you edit it.


    If you take my advice and don-mount filesystems, don''t run Linux at all the time,
    you''ll have to use the su command to mount and unmount filesystems. By using
    the user option of the mount command, you won''t have to use the su command to
    mount CD-ROMs. You can, for example, change the original fstab entries to


    ```

    /dev/cdrom          /mnt/cdrom        iso9666 noauto,ro,user @ @

    /dev/hdb           /mnt/cdrom        iso9666 noauto,ro,user @ @

    ```


    You''ll be able to mount CD-ROMs without having to be the root operator, by using


    ```

    # mount /mnt/cdrom

    ```


    or


    ```

    # mount /mnt/cdrom

    ```


    This will automatically mount your CD-ROM''s filesystem at the /mnt/cdrom path.
    You''ll be able to switch your disks with the unmount command, for example:


    ```

    # umount /dev/cdrom

    ```


    or


    ```

    # umount /mnt/cdrom

    ```


    Although this should enable this type of convenience only if you''re using Linux
    on a standalone computer, and only for certain types of filesystems, such as CD-ROMs,
    it is convenient, especially for removable filesystems. Another type of filesystem
    is the venerable floppy drive. The next section discusses floppy drives, and is
    followed by a discussion of a package of floppy utilities that can make life easier
    when dealing with floppies under Linux.


