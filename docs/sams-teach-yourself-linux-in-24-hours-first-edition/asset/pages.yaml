- img_proc: true
  md: 'You should save the file and restart your system. This line tells Linux to
    start the uugetty command and have uugetty monitor your /dev/tty1 serial port
    for incoming calls. If you call into your Linux system, the modem will synchronize
    with your calling modem''s speed, wait for a carriage return (or Enter keystroke),
