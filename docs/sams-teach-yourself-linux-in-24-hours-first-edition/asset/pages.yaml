    # Creating the Installation Floppies


    The next step is to create the boot and supplemental floppies. Boot the two blank,
    formatted floppies discussed earlier in the hour. Label the blank floppies “Boot
    Diskette” and “Supplemental Diskette.” These diskettes are created by using the
    rawrite program located on the CD. The rewrite program works by writing a disk
    image to a blank floppy.


    The following example assumes that your drive is E: on your system. Please substitute
    your drive letter if it''s different. In the DOS prompt, change into the \DOSUTILS
    directory on the CD and run the rewrite program. You will be prompted by the following:


    ```

    Enter disk source file name: E:\images\boot.img

    ter diskette drive: A:

    Please insert a formatted diskette into drive A: and press --ENTER--

    ```


    After the image is written, remove that floppy and insert the floppy labeled “Supplemental-Diskette,”
    then rerun the rewrite program.


    ```

    Enter disk image file name: E:\images\supp.img

    ter diskette drive: A:

    Please insert a formatted diskette into drive A: and press --ENTER--

    ```


    Your installation diskettes are now ready; the next step is to prepare your hard
    drive.


    # Preparing Your Hard Drive


    Since you are installing Linux to a hard drive in your system, you need to make
    sure you have necessary room to perform the installation. If you already have
    a second hard drive or a partition set aside for Linux, you''re pretty ready to
    begin the installation. If you don''t, you have to make space available on your
    existing hard drive by using a program that comes with the CD called fips. Before
    you do, however, you need to have a basic understanding of partitions and file
    systems.


    # Partitions and File Systems


    As discussed earlier, Linux should be installed into its own partition. All hard
    drives need to be partitioned before they can be used. When you partition a drive,
    you''re designating a specific area of your hard drive for use. Partitions allow
    you to divide your hard drive so that not all information is stored in one area.
    Different operating systems write information to partitions in different ways,
    and these different ways are known as file systems.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Partitions


    There are two types of partitions: primary and extended. Extended partitions can
    be subdivided into more parts through the use of logical drives; primary partitions
    cannot. A hard drive can contain both types of partitions at the same time, with
    some limitations. A drive can contain up to four primary partitions. To divide
    a hard drive even further, one of these partitions may be designated as an extended
    partition. Each extended partition can be divided using logical drives.


    Figure 1.1 shows an example of a drive that has been broken down into four distinct
    areas using one primary partition and one extended partition that has been further
    divided into three logical drives.


    # Figure 1.1


    Example of hard drive partition types.


    | Hard Drive Partitions |

    |---||

    | Primary Partition |

    | Logical Drive | Extended |

    | Logical Drive |

    | Logical Drive |


    # File Systems


    Whereas the partition tells the operating system "Write information in this area,"
    a file system tells the operating system "Write the files in this format! DOS
    versions 5.0–7.0 use a file system called FAT16 that allows for 512 megabyte partitions
    (and larger ones through some fancy কথায় that are beyond the discussion of this
    book). Windows 95 OSR2 can use a FAT32 file system, which allows for much larger
    partitions. Linux primarily uses two file systems called EXT2 and SWAP.


    > CAUTION: If you''re using Windows NT, OS/2, or have Windows 95 OSR2 with a FAT32
    partition, you may have problems using the fips commands. You need to look to
    a commercial partition program (such as Partition Magic) to create the necessary
    space.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Preparing to Install Linux


    # Creating Space


    You need to have a minimum of 60 megabytes free on your hard drive for a bare-bones
    installation. A more reasonable estimate is around 250 megabytes, and a complete
    installation takes up around 600 megabytes. This section takes you through the
    creation of space on your hard drive by showing how it would be done on a fictional
    1GB hard drive with 1024 cylinders. The drive has 600MB of space free.


    ![](img/91f0fe61bd3027cda34d2f54533df676_30_0.png)


    When looking at the data on the hard drive listed in the BIOS, you should have
    seen some items like Cylinders, Heads, and Sectors. The only important number
    here is Cylinders—they are the building blocks of partitions. If you partition
    half of the fictional hard drive mentioned in the preceding paragraph, you would
    be setting aside 512 cylinders for use.


    ![](img/91f0fe61bd3027cda34d2f54533df676_30_1.png)


    JUST A MINUTE


    Diagram how you want to layout the OS on the machine, the first step is to write
    down what''s already on the hard drive(s), what cylinders those partitions cover,
    and what can be moved. Figure 1.2 shows the current configuration of the fictional
    drive as well as the planned configuration.


    Figure 1.2.

    Current and planned configuration of the fictional hard drive.


    Current Configuration


    Planned Configuration


    | Primary Partition | Primary Partition |

    |---|---|

    | One primary partition that contains all 1024 cylinders. No additional room available.
    | One primary partition that contains 512 cylinders - half the drive available
    for other uses. |

    | | Extended Partition |

    | | One extended partition made up of 512 cylinders. This can be subdivided into
    more logical drives for our use. | |


    # Using tips to Create Space


    This example begins with a drive with one partition covering cylinders 1 to 1024.
    The goal is to shrink the first partition down to half its current size and create
    a new extended partition in the vacated space.'
