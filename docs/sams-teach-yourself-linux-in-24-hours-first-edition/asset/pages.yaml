  md: '# 152


    # Hour 9


    Comment or uncomment the different page sizes, but use only one. After you finish
    making your changes, you should try the fax command to test your configuration
    and modem by using the test command-line option—for example,


    # # fax test


    Please wait, this will take a minute...


    ```

    /usr/bin/fax --

    FAX=/usr/bin/fax

    EFAX=/usr/bin/efax

    EFIX=/usr/bin/efix

    DEV=cua1

    CLASS=2

    ```


    You''ll get a three-page listing of information about your configuration, and
    your modem''s response to the fax script''s queries. If you''d like to see this
    information at your leisure, redirect the output of the text to a file—for example,


    # # fax test faxt.txt


    You can read about any error messages or problems with missing software. Assuming
    everything is OK, you can try fixing a document by using the fax command:


    ```

    # fax send -1 1202551212 faxt.txt

