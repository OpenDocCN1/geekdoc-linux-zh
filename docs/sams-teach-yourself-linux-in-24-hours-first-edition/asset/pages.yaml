  md: '# Scheduling Regular Reminders with the cronab Command


    Although the at command is helpful for scheduling one-time jobs, you''ll want
    to use Paul Vicie''s cronab command if you need regular tasks completed at regular
    intervals. The cronab command, found under the /usr/bin directory, is used to
    enter your desired times and commands into a personal file.


    The cronab command works by looking for cronab schedules, by username, in the
    /var/spool/cron directory. The cronab file for your Linux system is called cronab
    and is located in the /etc directory. The program that runs the system and use
    cron schedules is the cron daemon, which is started when you boot Linux, and wakes
    up each minute to check the system and user files.


    To create your cronab file, you must use the command''s -e option, for example:


    ```

    # cronab -e

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_295_0.png)


    Make sure you''ve enabled cronab use for your system. See Hour 24 for details
    on how to do this. You''ll also want to define the default EDITOR variable to
    your favorite text editor when you create or edit cronab files. See Hour 6 for
    information on how to set environment variables.


    This will launch the default text editor, defined in your shell''s EDITOR variable,
    so you can create or edit your personal cronab file. If your default editor is
    vi and you don''t want to use vi, or would like to use a different editor, you
    can temporarily change the EDITOR variable using your shell. For example, if you''re
    using the bash shell, and want to use the pico text editor, you can use


    ```

    # EDITOR /usr/bin/pico; export EDITOR

    ```


    This will set the default editor to the pico editor. You can confirm this by searching
    your environment variables, for example:


    ```

    # printenv | grep EDITOR

    EDITOR=/usr/bin/pico

    ```


    Whichever editor you use, you''ll initially be presented with an empty file if
    you''ve never created a cronab file. You can then enter cronab settings. Before
    you enter your own schedule, you should know how to format a cronab request. which
    is


