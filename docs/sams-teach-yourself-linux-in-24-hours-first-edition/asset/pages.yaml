    The zsh shell contains some improvements on input and output redirection, so you
    may not need the tee command if you''re using pipes on the zsh shell command line.
    See the zsh shell documentation for details.


    JUST A MINUTE


    The tee command is used to save the results of a pipe at a particular juncture.
    This is handy when you want to test your results when building pipes, or save
    results in a complex pipe. Look at the following example:


    ```

    # xwd -out wd.xd

    # xdotopnm < wd.xd | ppmotfig | tee wd.gif | giftopnm | tee wd.pmnm | pnmotiff
    > wd.tif

    ```


    In this example, a window dump graphic has been created using the X11 command,
    which captures and saves the contents of an X window or desktop. Then a single
    command line has used to first convert this graphic into a portable bitmap graphic.
    The output of the command is then fed into the ppmotfig. The tee command is used
    to save the output, in GIF format, to a file, and then convert the file back into
    the portable bitmap format. This output is saved as a portable bitmap graphic,
    and also fed into the pnmtiff command, which saves the file as a TIFF graphic.
    One command line and four graphic conversions!


    Using pipes with Linux is an easy way to get work done. As you continue to work
    with Linux, you''ll develop your own set of favorite command lines. Once you''ve
    developed your favorites, you''ll then want to build your own shell commands,
    which you''ll read about in the next section.


    # Building Shell Commands


    You don''t have to be a programmer to write commands for Linux. After you become
    familiar with different programs and find yourself typing the same command lines
    over and over, in the simplest form, a shell command may be one or two command
    lines that you frequently use. Look at the following example of them into files
    and turn them into commands.


