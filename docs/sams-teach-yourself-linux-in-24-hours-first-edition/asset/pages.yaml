  md: '# 216


    # Hour 14


    ```

    bg color—Set background to color

    cr color—Set cursor to color

    ms color—Set cursor to color

    ```


    These options, and others, to customize emacs looks when started in X11:


    ```

    # emacs -geometry 80x24 -fg black -bg white blue -cr red

    ```


    This starts emacs in a window 80 characters wide by 24 lines high. The text is
    black, with white background. The cursor is red, and the mouse cursor is blue.
    emacs also has 13 X resources you can configure and enter into your .Xresources
    file in your directory. You can also save your editor defaults (such as word wrapping,
    or fill-mode) in a file .emacs in your home directory. See the emacs manual page
    for details.


    # Figure 14.1.

    The emacs editor features split windows, built-in a tutorial, and other tools
    to help you be more productive.


    ![](img/91f0fe61bd3027cda34d2f54533df676_237_0.png)


    File size as estimated


    The emacs program for Red Linux comes in four different packages containing various
    files and utilities. If you install everything, emacs requires more than 35 megabytes
    of disk space. You can, however, save 15 megabytes if you don''t install the Emacs-d
    package, which is the source for emacs functions, modes, and utilities. If you
    don''t use the XWindow system, you can save another 2.5 megabytes by not installing
    the Emacs-X11 package.


    You''ll find documentation for emacs under the /usr/doc, /usr/share/emacs/20.2/etc,
    and /usr/info directory. You can also read the emacs manual for an overview.


