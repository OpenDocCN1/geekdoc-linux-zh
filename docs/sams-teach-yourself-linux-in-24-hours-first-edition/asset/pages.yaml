  md: '# Configuring the X Window System


    The protocol says which type of mouse X should try to use and the device says
    port it should look at. Further information on the types of mice supported can
    be found by running the command man X86Config


    Another common reason for the mouse to fail is that the mouse is requiring special
    initializations or is conflicting with another program (usually gpm, which is
    a text mouse control program). In the case of possible conflicts, you should try
    stopping the gpm program (/etc/rc/init.d/gpm stop) and then trying X again. If
    this solves the problem, you may find that you want to disable gpm altogether.
    To do this, run the ntsys command and toggle gpm off.


    For mice that need special configuration options the problem can be avoided by
    treating the mouse as a modem and using a serial port to turn it on. In these
    cases, changing mice can be often simpler.


    ![](img/91f0fe61bd3027cda34d2f54533df676_60_0.png)


    Many Linux commands have documentation in one of several places. Most commands
    are documented as a manual page that can be found with the man command. To quickly
    find all the items that are related to XFree86, man -k X86 gives you a list of
    the documents to be called. A second place to look for documentation is in the
    directories /usr/doc and /usr/doc/HOWTO. The /usr/doc contains documentation for
    packages that were installed onto your system. The /usr/doc/HOWTO contains a various
    HOWTOs and helpful tips on setting up items.


    # Having Your Machine Always Start in X Window


    If you always want your machine to start the X Window manager so you don''t have
    to startx when you log in, you only have to edit one file.


    Log in as root and edit the /etc/initab file. This file is used by init to start
    various utilities. Changing the line beginning with id enables X to always start
    on boot.


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (DO NOT setdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (DO NOT setdefault to this)


    id=5:initdefault:

    ```'
