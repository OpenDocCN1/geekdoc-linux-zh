  md: '# PART V


    # Hour 24


    # Scheduling


    In this hour, you''ll finish with learning system administration skills. By now
    you''ve learned most of the commands used by sysadmins, and should be familiar
    with most of the tasks you have to perform to maintain your system for yourself
    or other users. This hour shows how to put all this knowledge together in order
    to automate these tasks using the cron daemon, and other Linux scheduling programs.


    By using the programs and techniques outlined in this hour, you can automate many
    different system administration jobs and maintain a healthy, well-running system.
    The first topic discussed is the cron daemon, and then you''ll learn how to administer
    the at command facilities for different users on your system.


    # Using the cron Daemon


    The cron daemon, crond, is a program started after you boot Linux by the cron.init
    script in the /etc/rc.d/init.d directory on your system. This is done automatically,
    so you don''t have to worry about starting the cron daemon every


    ![](img/91f0fe61bd3027cda34d2f54533df676_368_0.png)'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'time after your boot Linux. The cron program runs in the background, and checks
    several files. The first is the crontab file in the /etc directory. A portion
    of this file reads as follows:

    ...


    ```

    # run-parts

    01 * * * * root run-parts /etc/cron.hourly

    02 1 * * * root run-parts /etc/cron.daily

    02 2 * * * root run-parts /etc/cron.weekly

    02 3 1 * * root run-parts /etc/cron.monthly

    ```


    As you can see, there is a list of lists (actually, directories), which contain
    tasks that are run hourly, daily, weekly, and monthly. If you look at the contents
    of the cron.weekly directory, you will find a file called makewhatis.cron that
    contains


    ```

    #!/bin/bash

    akewhatis -w

    exit

    ```


    You can see that this is a shell script that executes the makewhatis command to
    build your system''s whatis database (see Hour 4, "Reading and Navigation Commands").


    The cron command searches the /var/spool/cron directory for personal cron files
    with user''s names. These files are created with the crontab command, found under
    the /usr/bin directory, and are used by users to schedule their own regular tasks.
    But how do you tell cron when to run these scripts? Read on to see the format
    of the cron commands.


    # Managing User cron Scheduling


    Although /etc/crontab file is for scheduling regular, system-wide tasks, you can
    let users on your system create their own cron schedules. If you want to allow
    users to create personal cron files using the /var/spool/cron directory, you should
    create two files: /etc/cron.allow and /etc/cron.deny. Under the /etc/cron.allow
    file, insert the root operator name, root, and the names of any users you want
    to allow access to the cron daemon. If neither of these files exists, users may
    not have access to personal cron files. You can create files for your users with
    the crontab command, or may create their own.


    > Be careful Always use the crontab command''s -u command-option. If you run this
    while running as root (after using the su), and don''t use this option, you''ll
    edit the root operator''s crontab settings instead of your own.


    ![](img/91f0fe61bd3027cda34d2f54533df676_369_0.png)


    The next section shows you the format of the crontab file, and the difference
    between the format of a cron entry for your Linux system and for individual users.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Scheduling


    # Setting Schedules with the crontab Command


    The format of crontab entries is detailed in the crontab manual page under section
    5. To see the manual page, use


    ```

    # man crontab

    ```


    This page provides specifications for crontab entries. However, to make things
    simpler, I''ll give you some examples, and at the end of this hour, some samples
    you can use. In general, the fields of an entry are


    ```

    minutes hour day of month month day of week command

    ```


    Entries are usually separated by a space. However, cron entries in the /etc/crontab
    file must have a username inserted between the day of week entry and the command.
    A username field is not needed for personal crontab entries.


    As a simple example, you can have Linux tell you the time every 15 minutes by
    first calling the crontab command with the -e command-line option, and then adding


    ```

    15,30,45 * * * /usr/local/bin/saytime

    ```


    This tells the cron daemon to execute the system command to speak the time every
    fifteen minutes. You can find the system command at


    ```

    http://sunsite.unc.edu/pub/Linux/speed/saytime.tgz

    ```


    If you would like to hear the time every minute (though it might go crazy!), you
    can use


    +   * 22 * * * /usr/bin/wall Time for bed finished your homework yet? *

    * 0 1 * * * /usr/bin/find -xdev core -exec /bin/rm { \ \

    * 0,30 * * * * /usr/bin/tptool - /dev/console %

    * 12 25 12 * * /usr/bin/echo ''Happy Holidays '' /bin/mail - Greetings root *


    If you use a carriage-return at the end of the line in your entry, you should
    use a percent (\%). Here are some more examples:


    The first example broadcasts a gentle reminder to all your users using the wall
    command, at 10 p.m., Monday through Thursday. The second example finds the command
    to search your system at 1 a.m. each morning for core files, and deletes any found.
    The third rings your terminal''s bell at the hour and half hour, using the tptout
    command to output. The last example sends a mail message at noon on December 25th.


    Experiment with different tasks and times. You can also search results for files,
    reports of users online, and uptime reports directed to log files, or mailed to
    you. You can also use cron to schedule backups when you''re away, or have your
    system shut down at a preselected time.


    ![](img/91f0fe61bd3027cda34d2f54533df676_370_0.png)'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Managing User Scheduling with the atrun Command


    The cron daemon is useful for scheduling regularly run programs, or performing
    regular tasks, as you found out in Hour 18, "Personal Productivity Tools." The
    atrun command is useful for one-time or reminder jobs. Even though your Linux
    system is set up automatically after installation to handle user at command scheduling
    requests, you should know how to manage the atrun command facilities for at least
    one good reason.


    By default, when a user uses the at command, the command runs with a default CPU
    priority. If too many users start running tasks with higher priorities, or CPU-intensive
    programs in the background, your system''s performance could be affected. Read
    on learn to manage your system''s at command facilities to provide the best performance
    and control possible.


    Your system''s at command facilities are enabled by the cron daemon, which after
    starting boot Linux, checks the /etc/crontab file, and sees the following:


    ```

    # Run at jobs every minute

    # * * * * root [ -x /usr/sbin/atrun ] && /usr/sbin/atbin

    ```


    As you can see, this is why the at command depends on the cron daemon; the cron
    command runs the atrun command under the /usr/sbin directory, each minute your
    system is up. The atrun command in turn, searches the /var/spool/at directory
    to locate jobs to run. For example, if the root operator creates a job at 19:30
    for that day, you''d see the following:


    ```

    # At 19:30

    echo Hello

    Job 9 will be executed using /bin/sh

    # ls -l /var/spool/at

    -rw------ root 3144 Nov 26 19:25 c00009000dff21e

    -rw------- bball 3146 Nov 26 19:26 c0000a000dff21e

    dw------- daemon daemon 1024 Nov 26 19:04 spool

    ```


    As you can see, there is a job waiting for the root operator and the user bball.
    Each of the files beginning with a "c" contains a shell script to execute the
    job (in the case of root job at, it is only to echo the word job, which will be
    emailed after the job executes).


    You can get more specific information with the at command. If you''re the root
    operator, you''ll see all the jobs your users have scheduled, instead of just
    the ones you''ve scheduled.


    ![](img/91f0fe61bd3027cda34d2f54533df676_371_0.png)'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Scheduling


    Controlling the batch and at Commands

    So now that you know how the at run, how do you control how at works, and for
    whom, on your system? One way to control the performance is to use the at command''s
    -1 (load average) option. This option will control any jobs submitted by users
    using the batch command (discussed in Hour 18 with the at command). You can limit
    when batch jobs run by specifying a number lower than 1.5 (the default), which
    tells when the system load average (determined by a value in the /proc/loadavg
    file while the system is running) is low.

    You can see the current load average with


    ```

    # cat /proc/loadavg

    0.20 0.11 0.03 2/50 1228

    ```


    This shows the load average for the 5, 10, and 15 minutes. You can also get the
    load average using the uptime command, for example:


    ```

    # uptime

    7:40pm 2:24, load average: 0.13, 0.08, 0.02

    ```


    To allow your users to use batch nearly any time, change the value of the -1 option
    in the at command entry in your system''s /etc/crontab file to a number higher
    than the default 1.5.

    But how do you control whether or not users are allowed to use the at command
    on your system? By default, after you install Linux, anyone on your system can
    use the at command. There are four ways to control who can or cannot use the at
    command. If you look in your /etc directory, you will see a file called .deny.
    Because this file is empty, everyone can use the at command to schedule jobs.
    If you want to restrict a user from using the at command, put the user''s username
    in the file. This doesn''t apply to anyone on your system who use to use the at
    command (of course, because you''re the root operator!), delete the .deny file
    from your /etc directory. If you want to allow only certain users to use the at
    command, create a file called .allow in the /etc directory, and put the user''s
    username in the file.


    As a final measure, as the root operator, the atq command, and you can see all
    the jobs scheduled on your system and if you see many jobs scheduled, you can
    delete them with the at command, for example:


    ```

    # atq

    Date Owner Queue Job#

    20:00:00 11/26/97 bball c 12

    20:10:00 11/26/97 bball c 13

    20:15:00 11/26/97 bball c 14

    20:30:00 11/26/97 bball c 15

    # atrm 12 13 14 15 ...

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_372_0.png)'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'Here I''m assuming you see a long, long list of job numbers, and have deleted
    them. This is an abrupt, rude way to handle enthusiastic users. A better method
    may be to email the user and find out if there are tasks being run that may be
    automated during off-hour or off-peak times.


    As the system administrator, you have complete control of scheduling commands
    for the users of your Linux system. Think about tasks you should run hourly, daily,
    weekly, and monthly. With a little imagination, you''ll soon automate any custom
    tools, command lines, and reports you''ve created to help you manage your system.
    You''ll end up with more disk space, a better running system, and happier users.'
