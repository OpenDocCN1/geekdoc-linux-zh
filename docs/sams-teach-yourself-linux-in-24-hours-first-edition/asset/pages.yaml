    By using this information, you can see that you need to reclaim the most memory,
    you should stop the Netscape Web browser, as it is using nearly 9MB of memory.
    Although you wouldn''t normally use the kill command to stop processes, the kill
    command can be helpful to stop runaway, nonresponsive processes. The kill command
    works by sending a signal to the Linux kernel, so the kernel can act on the process.
    There are various signals you can use, although, as I''ve pointed out, the -9,
    or SIGKILL command is the most abrupt and drastic. You can see a list of different
    signals by using the kill command''s -1 option, for example:


    For more details on these signals, see its manual page.


    The ps command has nearly dozen command-line options, and you can also list all
    running processes. See the ps manual page for more information. You can also use
    the top command, discussed next, to find and kill processes.


    # Getting System Information with the top and xload Commands


    The top command, under the /usr/bin directory, is a system monitor that displays
    statistical information about how Linux is currently handling its memory, swap
    file, and processes. The top program also shows how your system has been running,
    the status


    ![](img/91f0fe61bd3027cda34d2f54533df676_325_0.png)'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Basic System Administration


    of your CPU, the size of each process, and more. You''ll typically use the top
    command by running on a spare console, or separate X11 window (see Figure 20.1).


    # Figure 20.1

    The top command provides an ongoing display of your system.


    ![](img/91f0fe61bd3027cda34d2f54533df676_326_0.png)


    The top command also has many interactive controls, including a help screen, accessed
    with the question mark or the H key. You can also toggle modes of the display,
    as listing processes by memory usage or limiting the number of processes. This
    can be helpful if you want to monitor only the top five processes that require
    the greatest amount of your system''s memory, and it can help you diagnose problems
    if your computer starts unusual disk or file activity.


    You can also use top to interactively kill processes, with the K key, or change
    a process''s priority (how much time the CPU devotes to a task) with the R key.
    The top program has seventeen different controls, and you can customize its display
    by adding or removing different information fields and lengthening or shortening
    the number of processes. See the user manual for more information.


    The xload command, under X11, provides a running graph of your system''s load,
    instead of the top command''s statistics. System loads vary from computer to computer,
    but you can generally tell when your system is overloaded by inorder disk activity,
    as processes are swapped back and forth from your swap file. The xload command
    can help you give a visual if you''re running too many programs, and can be especially
    helpful if you''re running X11 on a 8MB or 16MB Linux system.


    The xload command has eight different command-line options, and you can customize
    the color of the moving graph, scale lines, or background.


