  md: '# 196


    # Hour 13


    ![](img/91f0fe61bd3027cda34d2f54533df676_217_0.png)


    If you have enforced disk quotas for users of your Linux system, users can easily
    exceed the quota you''ve enforced, especially when downloading large files. One
    way to help users on a quota-enforced system is to tell them to first change directory
    to the /tmp directory using ftp, and to then open a connection to download large
    files. The /tmp directory will be cleaned out by your housekeeping cronab later
    on to make more room on your hard drive, but your users will be able to download
    large files without hitting hard limits on their quotas.


    To demonstrate the ftp program in action, I''ll show you a sample session:


    ```

    # ftp.mcp.com

    Connected to mcp.com.

    220 iq-mcp ftp server (Version wu-2.4(3) Thu Jun 12 14:38:11 EST 1997) ready.

    Name (ftp.mcp.com:bball): anonymous

    31 Guest login ok, send complete e-mail address as password.

    Password:

    230 Guest login ok, access restrictions apply.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp> ls l

