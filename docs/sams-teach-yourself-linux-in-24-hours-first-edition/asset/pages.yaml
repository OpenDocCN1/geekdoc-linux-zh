  md: '# Browsing the World Wide Web with Linux Browsers


    This section introduces you to half a dozen Web browsers for Linux. You''ll find
    two of these browsers on the CD-ROM included with this book. The other four, Red
    Baron, Grail, Mosaic, and Netscape Communicator, must be retrieved from their
    home sites on the Internet.


    This book doesn''t have enough room to cover these browsers in detail. If you
    are interested in learning about Web browsers or writing your own Web pages, I
    suggest you look at the following books:


    +   * HTML by Example, by Todd Stauffer, Que


    +   * Using HTML, by Mark Brown, John Jung, and Tom Savola, Que


    # Fast Browsing with the Lynx Command


    The Lynx lynser, sponsored by the University of Kansas, does not support graphics,
    sound, or any of the other plug-in features of today''s modern Web browsers. You''ll
    really like Lynx anyway because it''s fast, efficient, and does not take up a
    lot of disk space.


    Lynx was designed to run on regular displays, or terminals, so you don''t need
    to run the X Window System order to use it. This program is ideal for quickly
    browsing Web pages to get the information you need without the "World Wide Wait"
    of too-large graphics, or animations that just waste bandwidth.


    The Lynx browser has 66 different command-line options, but it''s easy to use.
    If you''ve properly set up your system, and have started your PPP connection,
    you can start browsing by specifying a Uniform Resource Locator (Web address)
    on the command line, for example:


    Figure 13. shows the Lynx browser.


    If you need to fine-tune some of the ways the lynx command works, you can edit
    its configuration file, lynx.cfg, in the /usr/lib directory. I suggest that you
    make a copy of this file, and copy it to your home directory with .lynx as the
    filename. In this file, you can set a number of Lynx features. For example, if
    you specify the name of your ISP''s news server, you can read news:


    NNTPSERVER:your.ISPnewserver.com


    ![](img/91f0fe61bd3027cda34d2f54533df676_222_0.png)'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Figure 13.1.


    The Lynx text-only Web browser is a compact, efficient program you can use to
    quickly browse Web pages without waiting for graphics.


    ![](img/91f0fe61bd3027cda34d2f54533df676_223_0.png)


    After you make this change, you can try to browse with news


    # lynx news://your.ISPserver.com


    You can also use the Lynx to retrieve files without browsing. By using this approach,
    you can automatically research or get information on a regular basis.


    # lynx http://www.yahoo.com/headlines/news/summary.html -dump >news.raw


    Lynx will also download files just like other browsers if you press the Enter
    key while your cursor has a file or link highlighted. The basic navigation keys
    for the cursor are the cursor and the Enter and Tab keys.


    For more information about the Lynx browser, see its manual.


    # Browsing with the Arena Browser


    The Arena browser, found under the /usr/X11R/bin directory, is an X Window System
    browser now supported by Yggdasil Computing. New versions of this browser may
    be found


    at


    ```

    ftp://Yggdasil.com/pub/dist/arena

    ```


    The Arena browser unfortunately does not obey any X11 Toolkit options. You can,
    load local HTML files, or specify a Web address on the command line, for example:


    +   # arena index.htm

    # arena http://www.mcp.com


    ![](img/91f0fe61bd3027cda34d2f54533df676_223_1.png)'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Browsing with the Red Baron Browser


    The Red Baron browser is a Web browser from Red Hat Software, Inc. and has most
    of the features you expect in a browser. You''ll need to run the X Window System
    in order to use this browser.


    You can use this browser to display, view, save, and print different Web pages.
    With as other browsers, you can also download files. However, unlike the Grail
    and Netscape browsers, Red Baron does not obey X11 Toolkit geometry settings.


    If you need help while you''re working with Red Baron, you can press the F1 key
    on your keyboard. Red Baron will then read it in its help files, which are found
    in the help directory at /usr/lib/redbaron on your system.


    If you find Red Baron similar to Mosaic, that''s because it is a variant of the
    Mosaic browser, compiled to run on Linux systems with Motif libraries.


    # Exploring Unique Features of the Grail Browser


    The Grail is unique among Linux browsers. This browser is written using the python
    language, and comes with the full source code.


    ![](img/91f0fe61bd3027cda34d2f54533df676_224_0.png)


    > JUST A MINUTE

    The Grail browser, from the Corporation for National Research Initiatives, is
    made up of 27,000 lines of interpreted python language source code. This browser,
    like the lynx, is compact and efficient, and takes only one-tenth of the hard
    drive space of other browsers such as Red Baron, Mosaic, or Netscape, but offers
    full HTML 2.0 compatibility, including forms, python language applets, graphics,
    and frames. For more information about the increasingly popular python language,

    browse to

    ://www.python.org.


    ![](img/91f0fe61bd3027cda34d2f54533df676_224_1.png)


    You can use Grail like any other browser. You can simply type


    +   # grail


    to start the program, which will cause Grail to load, and then try to connect
    to its home page, http://grail.cnri.veston.ua/grail. If the Grail browser takes
    too much of your display, you can use X11 Toolkit geometry settings to have the
    browser create a smaller window, for example:


    +   # grail -g 640x480+0+0'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'This will start the browser in a 640×480 window at the upper-left portion of
    your screen. You can also specify an initial page to load from the command line,
    for example:


    ```

    # grail http://www.mcp.com

    ```


    If you would like to set Grail to load a different home page when it starts, you
    can use the General item of its Preferences menu to set this value, along with
    eight other default actions.

    If you want more information about Grail, browse to the Grail home page.


    # Getting the Mosaic Browser


    The Mosaic browser, from the National Center for Supercomputing Applications,
    is one of the original Web browsers, and has helped spawn the variety of browsers
    in use today. You''d like to explore this browser, you can get the full source
    code, in which case you''ll need to purchase and install the X11 Motif libraries,
    and then compile, or build, the browser for Linux.

    If you find copies at:


    ```

    ftp://ftp.ncsa.uiuc.edu/Mosaic

    ```


    If you don''t have Motif, a commercial graphical interface library for the X Window
    System, you can download a binary, or precompiled, version that doesn''t require
    Motif. You can find a copy at


    ```

    ftp://ftp.wust1.edu/packages/NCSA/Web/Mosaic/Unix/binaries/2.7b

    ```


    Look for the file Mosaic-linux-static-2.7b5.gz, which contains everything you
    need in one 3.2MB compressed file. Once decompress the file and make it executable,
    you can run it, for example:


    +   - gunzip Mosaic-linux-static-2.7b5.gz

    # chmod +x Mosaic-linux-static-2.7b5

    # ./Mosaic-linux-static-2.7b5


    The Mosaic browser will start by creating resource files in your home directory.
    You may also use X11 Toolkit options to start the browser, such as geometry settings,
    for example:


    ```

    # Mosaic -geometry 640x480

    ```


    This command line will start the Mosaic browser in a 640x480-pixel window on your
    display. By default, Mosaic will try to automatically load its home page:


    ```

    http://www.ncsa.uiuc.edu/SDG/Software/Xmosaic

    ```


    Although the Mosaic browser is a single, self-contained program, all of its help
    files are loaded from the Mosaic home page at www.ncsa.uiuc.edu.


    ![](img/91f0fe61bd3027cda34d2f54533df676_225_0.png)'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Internet Downloading and Browsing


    # Setting Up and Downloading with Netscape Communicator


    The Netscape Communicator Web browser, by Netscape Communications, is one of the
    most popular browsers for all computer systems. You can get a copy specifically
    designed for Linux by navigating to the Netscape home page, home.netscape.com,
    filling out various queries and menus, and downloading the file.


    Be prepared for a long wait, however. The current version of the browser, Netscape
    Communicator 4.03, is more than 10 megabytes in compressed form, and features
    several additional built-in components, such as mail, composer, and discussions
    (for reading Usenet news). After you have downloaded the file into a temporary
    directory, decompress the Netscape package by using the gunzip command, and then
    type


    ```

    # /ns-install

    ```


    The installation script, ns-install, will extract the required files, create any
    necessary directories, and then install the browser. By default, Netscape and
    all of its files are installed into a directory called netscape under the /opt
    directory. You will want to take a look at the README file in the netscape directory
    for information on release notes, features, or known problems.


    If you''d like to run Netscape from the command line, you can specify its full
    path, for example:


    ```

    # /opt/netscape/netscape

    ```


    This will run the browser, but a better way to set up Netscape is to create a
    symbolic link to a more recognized directory, such as /usr/local/bin, for example:


    ```

    # ln -s /opt/netscape/netscape /usr/local/bin/netscape

    ```


    This will create the symbolic link, netscape, in a binary directory usually recognized
    by your PATH environment variable.\Netscape, like most well-behaved X11 clients,
    can also use X11 Toolkit features. If you don''t like the large initial window,
    you can specify a smaller starting window using geometry settings. You can get
    a list of Netscape''s initial command-line options with the -help option.

    You find several of these options useful. For example, as I''ve pointed out in
    this hour, the geometry settings can help reduce the initial window size of your
    browser. A much better option, especially for laptop users with little screen
    real estate, is the -component-bar option, for example:


    ```

    # netscape -component-bar &

    ```'
