    # Finding and Using the Shareware Wingz Spreadsheet


    The Wingz spreadsheet, from Investment Intelligence Systems Corporation, is a
    shareware program you can evaluate, for 45 days, and pay a registration fee, or
    discard. Unlike many spreadsheet programs, there are some impressive example sheets
    you can load and examine as many commercial offerings.


    Also, like sc, xspread, or teapot, this program requires six megabytes of hard
    drive when installed. You''ll find every feature you need in a spreadsheet program,
    including a built-in language called HyperScript. You can use HyperScript to build
    custom interfaces and programs to present your spreadsheet data. You won''t find
    much documentation, and Wingz has built-in, context-sensitive help.


    After install Wingz, you can run the program after first defining the environment
    variable, WINGZ. To do this you can define the program at the command line with


    ```

    # WINGZ=/pathwayWingzisinstalled ; export WINGZ

    # WINGZ=/bin/Wingz

    ```


    The first line defines the WINGZ environment variable to point to the Wingz directory,
    and the second runs the spreadsheet program. The actual application, Wingz, is
    found in the bin directory under the Wingz directory. You can also run one of
    two shell scripts included in the Wingz distribution to temporarily set the WINGZ
    variable.


    The Wingz spreadsheet (see Figure 17:4) imports and exports a variety of well-known
    spreadsheet file formats, such as Lotus 1.a and 2.0, DIF, text, and SYLK.


    You can generate many different types of 3D graphics, and spreadsheets may be
    linked, or viewed before printing. To read more about Wingz, or to get a copy,
    browse to


    ```

    http://wingz.iisck.com

