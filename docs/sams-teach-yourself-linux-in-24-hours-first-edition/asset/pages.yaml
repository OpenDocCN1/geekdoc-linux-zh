  md: '# PART III


    # Hour 9


    # Using Communications Programs


    In this hour, you''ll learn about communicating with the outside world by using
    programs installed from this book''s CD-ROM. You''ll learn how to set up your
    serial port or modem, configure and use two communication programs, and send and
    receive faxes with Linux.


    Although your CD-ROM contains all the software you''ll need to run Linux communications
    programs, you''ll need a serial communications port and modem to dial out with
    your Linux system. I assume that you''re familiar with modems; communication terms
    such as baud rate, parity, or stop bits; and how to connect your modem to your
    computer.


    ![](img/91f0fe61bd3027cda34d2f54533df676_162_0.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Setting Up and Testing Your Modem


    Your first task is to find spare serial port. You should be able to find the port
    on the back of your computer, and it will most likely have 9 or 25 pins. If you''re
    using a laptop, you may have a 9-pin male serial port, an RJ-11 telephone jack
    for an internal modem, or a PCMCIA modem card with an RJ-11 telephone jack.


    You''ll find your serial port in Linux by looking in the device or /dev directory.
    Many devices are defined there, such as hard drives, floppies, and printers, but
    you should look for devices of type cua or—for example,


    ```

    # /ls /dev/cua* /dev/ttyS*

    /dev/cua0 /dev/cua2 /dev/ttyS0 /dev/ttyS2

    /dev/cua1 /dev/cua3 /dev/ttyS1 /dev/ttyS3

    ```


    These devices correspond to the traditionally defined DOS serial ports, as shown
    in Table 9.1.


    # Table 9.1. DOS and Linux serial ports.


    | DOS Port | Linux Device |

    |---|---|

    | COM1 | /dev/cua0, /dev/ttyS0 |

    | COM2 | /dev/cua1, /dev/ttyS1 |

    | COM3 | /dev/cua2, /dev/ttyS2 |

    | COM4 | /dev/cua3, /dev/ttyS3 |


    If you have a laptop with a PCMCIA modem card, you won''t be able to use your
    modem (or any other PCMCIA devices) until you enable those services and tell Linux
    to look for PCMCIA devices when it starts. To enable your PC card modem, make
    sure that you''re logged in as the root operator and edit the file pcmia in the
    /etc/sysconfig directory, to look like the following:


    ```

    PCMCIA=yes

    PCIC=182365

    PCIC_OPTS=

    CORE_OPTS=

    ```


    This tells Linux to install PCMCIA services. Save the file, and then reboot Linux.
    Your PC card modem (and other PC PC cards, if installed) should be recognized
    during the reboot.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Using Communications Programs


    ![](img/91f0fe61bd3027cda34d2f54533df676_164_0.png)


    If you have trouble with PCMCIA devices, read David Hines'' PCMCIA-HOWTO, you''ll
    find under the /usr/doc directory. The latest information, you can also browse
    to


    ```

    http://hyper.stanford.edu/HyperNews/get/pcmia/home/home.html

    ```


    If you have trouble setting up your serial ports, read Greg Hankins'' Serial-HOWTO,
    also under the /usr/doc directory. You''ll find a complete discussion on setting
    your serial ports and troubleshooting installation.


    You can check to make sure that your serial ports are enabled by checking portions
    of the Linux startup message, dmesg, which is found under the /var/log directory.
    You can use the dmesg command, found under the /bin directory, to read this startup
    log—for example,


    # # dmesg


    ```

    Serial driver version 4.13 with no serial options enabled

    tty0 at 0x03f8 (irq = 4) is a 16550a

    tty1 at 0x0320 (irq = 3) is 16550a

    ```


    A portion of the dmesg file is reproduced here, so you can see what to look for.
    If you don''t see a serial driver, or serial port list, you must make sure that
    serial-line is enabled for your Linux kernel.


    To test your modem, make sure that you''re running as the root operator, make
    sure that your modem is on, and then run


    ```

    # echo "ATDTXXX-XXXX/n" >dev/cuAN

    ```


    The number represented as XXX-XXX is your phone number; N is the serial port you
    want to test. Wait at least 30 seconds or you should hear a dial tone, followed
    by the dialing, and then a busy signal. This can also be a handy way, when you
    have your modem working, to get the current time (albeit in the tinny voice of
    your modem speaker). Just insert the phone number for your local phone company''s
    time-of-day service, save the command in a line, and make it execute.


    ```

    # cat > dotime

    echo "ATD73-0660/n" >dev/cuA1

    # chmod +dotime

    # .dotime

    ```


    This creates the file with the cat command (after you type the D key to save it).
    The chmod command then makes the file executable so you can run it with the final
    command line. If you want to test your modem interactively, you can try the minicom
    program discussed in the section "Dialing Out with Communications Programs."'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Creating /dev/modem with the modemtool Command


    You can also use the Red Hat X11 control-panel client to set up your modem. Make
    sure that you''re running as the root operator, and then run the control-panel
    client. When you click the modemtool command in the control panel, the program
    modemtool, found under the /usr/bin/ directory, will run and present a list of
    serial ports. Select one, and then click OK.


    This program makes a symbolic link in Hour 5 (discussed in Manipulation and Searching
    Commands") from the selected device to a file called /dev/modem. You can do the
    same thing from the command line by using the ln command to create the symbolic
    link yourself. For example, if you have your modem connected to COM2, make sure
    that you''re running as root, and enter


    ```

    # ln /dev/cu1 /dev/modem

    ```


    This will create a symbolic link, /dev/modem, which points to the serial port
    connected to your modem.


    # Dialing Out with Communications Programs


    This section covers two communications programs that come with your Linux distribution:
    minicom and seyon. The minicom program can be used with or without running X11.
    The seyon program must be used while you''re running the X Window System.


    You''ll also find an old communications program, called cu, under the /usr/bin
    directory. This program isn''t as friendly as minicom or seyon, but if you''re
    interested in setting up and trying this program, read the cu man page, and define
    the uic software documentation under the /usr/doc directory.


    # Setting Up and Calling Out with minicom


    The minicom program, by Mikel van Smoenberg and located under the /usr/bin directory,
    is a friendly communication program that you can use to dial out and connect with
    other computers or BBS. You can use minicom without running X11, but you should
    use the minicom script, also located under the /usr/bin directory.


    The first time you use minicom, make sure that you''re running as the root operator
    so you can set up and save minicom''s default file, minirc.dfil, which will be
    created and saved in the /etc directory. Assuming you''re using X11, you can start
    minicom with


    ```

    # minicom &

    ```'
