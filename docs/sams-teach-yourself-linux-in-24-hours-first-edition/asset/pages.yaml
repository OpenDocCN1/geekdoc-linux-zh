- img_proc: true
  md: '# 84


    # Hour 6


    The shell is a command-line interpreter, and may be used to start, suspend, stop,
    or even write programs. The shell is an integral part of Linux, and is part of
    the design of Linux and UNIX. If you imagine the Linux kernel as the center of
    a sphere, the shell is the outer layer surrounding the kernel. When you pass commands
    from the shell, or other programs, to Linux, the kernel (usually) responds appropriately.


    There are many types of shells, but at least five (not counting the visual shell
    Midnight Commander) are on CD-ROM. You can determine which shell you will use
    when you log in to Linux by either looking at the contents of the /etc/passwd
    file, or searching for your username. Look at the following example:


    ```

    # grep bball /etc/passwd

    ball:OMBstToB0FLYG:500:500:William H. Ball,,:/home/b:/bin/bash

    ```


    Your shell will be listed at the end of your passwd entry (/bin/bash in the grep
    search example).


    # # What Shells Are Available?


    This section lists the shells available for your system, along with some features
    of each to get started. Each of these shells runs programs, and you may want to
    explore how they work. This section highlights some of their differences and points
    out important files.


    All of these shells support changing directories with a built-in cd, or the change
    directory command. Interestingly, the ash and tsh shells do not have a built-in
    pwd, or print working directories, and must instead rely on the pwd command found
    under the /bin directory.


    These shells have many features. You''ll want to read the manual pages for each
    in detail. Some of the features to look for and explore the following:


    +   - What are the shell''s built-in commands?

    - How is job control (or background processes), discussed in a later section,
    "Running Programs in the Background") handled?

    - Does the shell support command-line editing?

    - Does the shell support command-line history?

    - What are the important startup or configuration files?

    - What environmental variables are important for each shell?

    - What command-line prompts may I use?

    - What programming constructs are supported?


    # 6'
