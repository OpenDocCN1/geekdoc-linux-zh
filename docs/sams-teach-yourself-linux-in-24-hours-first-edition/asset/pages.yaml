  md: '# Introduction


    Welcome to Linux! You hold in your hands everything you need to install and use
    one of the most powerful computer operating systems in the world. This book is
    designed to help guide you through the process of learning Linux.


    Although the title of this book is Sams'' Teach Yourself Linux in 24 Hours, you
    won''t be alone while you learn. As you''re taken from installation through system
    administration to playing games, you''ll find advice, tips, and hints to help
    you along the way. Before you know it''ll be familiar with the terms, topics,
    and technical concepts dealing with the hottest and newest operating system in
    the world-Linux!


    This book is designed to help you learn quickly. You''ll find it indispensable
    guide to installing Linux and getting right to work. This book helps you overcome
    technical obstacles, explains complex subjects in simple language, and shows you
    some neat tricks to make your computing experience easier.


    Each section of this book gives you an hour''s worth of knowledge and examples
    that you run as Linux. By the way, you should know that this book was created,
    developed, and edited using the software included in the book''s CD-ROM. We hope
    you enjoy teaching yourself Linux!


    # What is Linux?


    Linux (pronounced Lin-nucks) is a UNIX-like operating system that runs on many
    different computers. Although many people might refer to Linux as the operating
    system and included software, strictly speaking, Linux is the operating system
    *kernel*, which comes with a distribution of software.


    Linux was first released in 1991 by its author Linus Torvalds at the University
    of Helsinki. Since then it has grown tremendously in popularity as programmers
    around the world embraced his project of building a free operating system, adding
    features, and fixing problems.


    Linux is popular with today''s generation of computer users for the same reasons
    early versions of the UNIX operating system faced more than 20 years ago. Linux
    is portable, which means you''ll find versions running on name-brand or clone
    PCs, Apple Macintosh, Sun workstations, or Digital Equipment Corporation Alpha-based
    computers. Linux also comes with source code, so you can change or customize the
    software to adapt to your needs. Finally, Linux is a great operating system, rich
    in features adopted from other versions of UNIX. We think you''ll become a fan
    too!'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Why Teach Yourself Linux?


    You should teach yourself Linux for a number of good reasons. You''ll expand the
    knowledge of your computer''s hardware, which can be handy in troubleshooting
    problems. You''ll also learn the basics of using a UNIX-like operating system
    loaded with state-of-the-art features. When you combine this knowledge of hardware
    and software, you''ll be well on your way to becoming a power user.


    You can use this book as a starting point in Linux basics. You''ll learn all the
    skills needed to build and run a powerful and productive Linux workstation. While
    you won''t learn how to program in Java, administer a network, or manage a Web
    server, you''ll learn that


    +   - Using Linux is a great way to connect to the Internet for emailing, file
    downloading, or World Web browsing.


    +   - You can get to work right away, because this book''s Linux distribution
    (on CD-ROM) comes with a rich assortment of popular productivity tools, such as
    word processors, calendars, emailers, and graphics programs.


    +   - You can have fun with some arcade games.


    +   - In no time will you be on your way to joining the world-wide community of
    Linux users.


    # Who Should Use This Book?


    This book is for someone who wants to quickly master the basics of how to install,
    tun, and maintain Linux on an Intel-based personal computer. All of the tools
    you need are included.


    Your computer should have a monitor, or display, keyboard, mouse, hard drive,
    floppy drive, and CD-ROM drive. Although you can jump right in and install Linux
    onto your hard drive, you should have some technical information about your computer
    and its hardware on hand before you start.


    # What''s Included on the CD-ROM?


    Everything needed! Included with this book is a CD-ROM, from Red Hat Software,
    Inc., which contains the latest and one of the most popular distributions of Linux,
    including the Linux kernel, utility programs, productivity programs, and even
    games. As you read through this book and install or configure software, you''ll
    discover many of the reasons Red Hat''s Linux was chosen to help you. Some of
    these are


    +   - Red Hat Linux is easy to install.


    +   - Red Hat Linux uses a convenient software-management system based on "packages."'
  merge: -1
