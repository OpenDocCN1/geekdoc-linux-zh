  md: '# PART III


    # Hour 13


    # Internet Downloading and Browsing


    This hour introduces you to programs you''ll use to get information and programs
    from the Internet. I''ll assume that you have signed up with an Internet Service
    Provider (ISP) and that you have configured your Linux system to start and stop
    Point-to-Point Protocol network connections.


    ![](img/91f0fe61bd3027cda34d2f54533df676_214_0.png)'
  merge: -1
  pgno: 214
- img_proc: true
  md: '![](img/91f0fe61bd3027cda34d2f54533df676_215_0.png)


    > > If you already have an account with a local ISP, but have not configured your
    Linux system to connect to the Internet, read Hour 10, “Connecting to the Internet,”
    for instructions.


    I will first introduce you to two Internet file transfer programs, and then cover
    some of the many Wide Web browsers you''ll find for Linux.


    There are several ways to retrieve files from other computers on the Internet.
    You can use email or a Web browser, but if you''re interested in just getting
    files into your computer, you can use the ftp (file transfer) program. The ftp
    program is one of the oldest programs to support the standard File Transfer Protocol,
    FTP, and was the original program designed to transfer files. The FTP protocol
    lets you send and receive files interactively with get commands.


    The next section shows how to use FTP transfer programs, ftp and nftp.


    # # Retrieving Files with the ftp Command


    The ftp command, found under the /usr/bin directory, has five different command-line
    options, but is most often used with a hostname, or name of remote computer, for
    example:


    +   - ftp.mcp.com


    This command line specifies that you want to connect to the ftp server at Macmillan
    Publishing. You don''t have to specify a hostname on the command line, because
    you can run the ftp program interactively, repeatedly connecting and disconnecting
    from different computers. The ftp command has more than 70 built-in commands,
    including a help facility. This hour doesn''t cover all the different commands,
    but you can get more information about these commands by reading the ftp program''s
    manual page, or by using the built-in help command.


    +   - ascii—Download any specified files in text form.


    ![](img/91f0fe61bd3027cda34d2f54533df676_215_1.png)'
