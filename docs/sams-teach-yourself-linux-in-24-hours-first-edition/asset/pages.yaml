  md: '# Sams'' Teach Yourself Linux in 24 hours

    Complete Starter Kit


    Sams'' Teach Yourself Linux in 24 Hours is a real-world tutorial that brings you
    up to speed with Red Hat Linux quickly and efficiently. This task-oriented guide
    takes you on a step-by-step journey through the world of Red Hat Linux, helping
    you to become a productive Linux user quickly.


    Learn how to install and configure your Linux system. Discover how to use commands,
    edit and print text, and manage users and groups of your system. This comprehensive
    24 hour book covers all the basics of the Linux operating system, from installation
    to system administration, in just 24 short lists.


    +   * Learn how to install Red Hat

    * Walk through an easy to follow hardware configuration

    * Understand how to enter Linux commands

    * Discover how to manage users of your system

    * Configure your network and servers

    * Customize your Linux operating environment

    * Discover the power of X™

    * Add new software to your Linux system

    * Learn how to configure and use Internet email


    As an added bonus, the book includes a CD-ROM, which contains a fully functional
    copy of Red Hat Linux 5.0, complete with source code.


    Category: Operating Systems

    Covers: Red Hat Linux 5.0


