  md: 'Unlike other window managers you run by entering the window manager name in
    the .initrc file in your home directory, CDE generally requires you to use the
    xdm client, and X Display Manager. This means that you must run X11 right after
    start Linux, and have to log into your system through the xdm chooser.


    ![](img/91f0fe61bd3027cda34d2f54533df676_153_0.png)


    When you use xdm to log in Linux and run X11, you may find that you''re unable
    to run programs as the root operator from a terminal window. This is because you
    must use the xhost command to temporarily add the hostname of your computer to
    the access list of your X Server. You do can use this formula: xhost +localhost;
    su -c "rootcommand", where rootcommand is the name of command you want to run
    as the root operator (such as the control panel, or printtool).


    Fortunately, you can also start the Red Hat distribution of CDE, from Triteal,
    Corp., from console, or non-X11 display. To do this, create a text file containing
    the following line:


    xxint /usr/dt/bin/Xsession


    Save this with a filename startcode, then make it executable by using chmod command:


    # chmod +x startcode


    When you want to run CDE, use startcode on the command line. For more information
    about CDE, which was developed by Hewlett-Packard, IBM, Novell, and Sun Microsystems,
    browse to the following sites:


    http://www.openg.org

    http://www.triteal.com


    For objective opinions about CDE, browse the comp.unix.cde newsgroup.


    # Obtaining, Building, and Installing KDE


    One of the newest and most popular of the free software window managers for Linux
    and X11 is the K Desktop Environment. Like CDE, this window manager is more than
    just a window manager: it''s a complete graphical environment for X11. KDE supports
    many of the same features as CDE, including the following:


    +   - Network Transparent Access, or NTA, so you can click on a graphic document
    in an FTP listing and have a program on your computer automatically download and
    display the graphic.

    - Mouse-click mounting of other file systems, such as CD-ROMs'
