    If you want to delete a fax, you can use the fax command''s rm command-line option—for
    example,


    ```

    # fax rm 120417243*

    /var/spool/fax/1204172431.001 /var/spool/fax/1204172431.004

    /var/spool/fax/1204172431.002 /var/spool/fax/1204172431.005

