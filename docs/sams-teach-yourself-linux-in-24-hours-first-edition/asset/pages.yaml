- img_proc: true
  md: '# Defining Printers with the printtool Command


    Installing, changing, or deleting local printers with your Linux system is a snap,
    thanks to the Red Hat printtool program, located under the /usr/bin directory.
    This program, used with the X Window System, is a printer setup program you can
    run from the command line, or through the X11 control-panel program.


    Because these programs run under X11, you''ll have to start X, making sure you''re
    logged in as the root operator, type the following in a terminal:


    ```

    # control-panel

    ```


    or


    ```

    # printtool

    ```


    If you run the control-program, select the printtool button. Printtool''s main
    window appears and lists all printers defined in the /etc/printcap database. From
    here, you can add, delete, or edit existing printer entries. To add a printer,
    click the Add button. It will ask you to select a local, remote, or LAN manager.
    For the sake of example, assume that you want to set up a printer to your computer.
    Press the local button, click the OK


    The printtool program then shows parallel printer devices are detected (Figure
    15.1). Note that one of the devices, /dev/lp0, /dev/lp1, or /dev/lp2, should be
    your printer. If not, if your printer is not on, or supporting has hasn''t been
    enabled.


    # Figure 15.1.


    The Red Hat printtool program provides an easy-to-use interface you need to configure
    a printer for Linux.


    ![](img/91f0fe61bd3027cda34d2f54533df676_261_0.png)'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Next, click the OK button. You can give your printer a unique name by typing
    it in the names field of the dialog box. Press the Select button next to the input
    filter dialog box entry. A large window called Configure Filter appears, listing
    26 printers. Select your printer, or a printer similar to yours. Also select your
    printer''s resolution, paper size, color depth, or other options, and then press
    the OK button.


    Press the next OK button and the printer you''ve defined will be in the list of
    Printer Queues. Select your printer, then try an ASCII or PostScript test from
    the Tests menu.'
