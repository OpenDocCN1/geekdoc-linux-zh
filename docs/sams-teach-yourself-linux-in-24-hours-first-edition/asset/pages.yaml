  md: '# PART IV


    # Hour 17


    # Learning Math and Financial Tools


    This lesson is an introduction to some of the mathematical and financial tools
    available for Linux. This hour shows you calculators, spreadsheets, and graphic
    modeling programs, and points you to sources where you can find even more programs.
    Whether you''re only interested in setting up simple single-screen spreadsheets,
    or would rather plot detailed maps using 200 megabytes of cartographic data from
    the U.S. geologic Survey, you''ll find Linux tools to help you get started.


    The hour begins with a discussion of some calculators and calculating languages,
    and introduces you to just some of the Linux spreadsheet programs, followed by
    a discussion of modeling programs, such as group101. This hour can''t cover all
    of the more than 1,500 scientific applications for Linux, but if you have an interest
    in other fields such as artificial intelligence, astronomy, biology, chemistry,
    database systems, electronics, linear algebra, physics, or raytracing, you can
    find tools for Linux to help you.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Calculators


    This section introduces you to several Linux calculators. You''ll find some of
    these handy when you pay bills, cook, or even travel. Some of these calculators
    work from the command line, and others run under the X Window System.


    # Doing Desk Calculations with the dc Command


    The dc (desk calculator) command is a command-line calculator that uses reverse
    Polish notation, or RPN, to perform calculations, and has more than 30 different
    operators and internal commands.


    The dc command, found under the /usr/bin directory, is easy to use:


    +   - dc

    44

    55

    +

    p

    99



    The example shows that to add two numbers, you first enter the numbers, then enter
    the operator, then use the p command to print the value placed on the stack by
    the addition operator. The dc q command quits the dc program. This method of performing
    calculations is not as inconvenient as you might think. For example, suppose you''re
    going through the checks you''ve written during the month, and you want to check
    your written calculations. Using the dc command, you can enter


    +   - dc

    2500.00

    49.95

    -

    p

    2450.05

    32.18

    +

    p

    2417.87

    q


    You started by entering a $2500.00 balance, then entered $49.95 as the first check,
    followed by the subtraction operator, or minus sign. The p command prints the
    result, and the next current balance of $2450.05 is maintained on the stack. You
    can also use it to read files of calculations instead of typing commands at your
    terminal, and it has 256 different registers, or temporary storage areas for your
    calculations. You see the dc command''s manual page for more information and other
    features.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Calculating with the X11 xcalc Client


    The xcalc client is one of the more familiar graphic calculators (see Figure 17.1),
    and comes with the XFree86 X Window System. The xcalc command, found under the
    /usr/X11R6/bin directory, has only two command-line options,-stipple and -rpn.
    The -stipple option merely colors the background of xcalc''s face, whereas the
    -rpn option tells the xcalc command to use rpn for doing calculations, and changes
    its appearance.


    You must be running X11 in order to use the xcalc command. You can use your mouse
    or the keyboard to enter numbers and perform calculations. To use it in its normal
    mode with the -stipple option, type


    ```

    # xcalc -stipple &

    ```


    # Figure 17.1.


    The xcalc calculator.


    ![](img/91f0fe61bd3027cda34d2f54533df676_282_0.png)


    Use the xcalc command as an rpn calculator, type


    ```

    # xcalc -rpn -stipple &

    ```


    You can customize nearly any aspect of xcalc by editing its defaults file, xcalc,
    which is found under the /usr/X11R6/lib/X11/app-defaults directory. See the xcalc
    manual page for information.


    # Three Calculators in One: dtcalc


    The dtcalc calculator, part of Red Hat Software, Inc.''s Common Desktop Environment,
    or CDE (see Hour 8, "Exploring Other X11 Window Managers\), offers a variety of
    features'
  merge: -1
