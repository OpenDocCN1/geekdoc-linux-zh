  md: '# Using the Shell


    If you''re running the bash shell, put a program into the background and suspend
    its operation by holding down the Ctrl key and pressing the z key on your keyboard:


    ```

    # pine

    ... program is running... (ctrl-z)...

    P suspended. Give the "fg" command to come back.


    [1]+ Stopped (signal) pine

    # fg

    ... program returns

    ```


    In order to be able to suspend the pine mail program, you must enable suspension
    using pine''s configuration menu. While running pine, press the s key, and then
    the c key. Then, scroll through pine''s options until you highlight "enable-suspend,"
    and press the x key and then the e key, followed by the y key, to save the changes.
    You''ll now be able to suspend the pine mail.


    ![](img/91f0fe61bd3027cda34d2f54533df676_116_0.png)


    Sending a program into the background and suspending its operation may be followed
    by the fg command to bring the running program back to your display, or by the
    bg command to continue to allow the program to run. This can be handy if you want
    to start a program, such as a newsreader (discussed in Hour 11, "Configuring Internet
    Email," and Hour 12, "Configuring Internet News\ then suspend and continue to
    run the program during lengthy operations (such as updating an internal list of
    newsgroups) while you run other programs in the foreground.


    Using the bash shell, you can start, suspend, and run a number of programs, then
    bring a background program back to your display by the job number:


    ```

    # pine

    ... program is running (ctrl-z)...

    P suspended. Give the "fg" command to come back.


    [1]+ Stopped (signal) pine

    # sc

    ... program is running (ctrl-z)...


    [2]+ Stopped pine

    # fg %1

    ... program returns...

    ```


    In this example, the pine mail reader has been started, suspended in the background
    to start the sc spreadsheet. Because pine is the first job suspended, the bash
    shell assigns a job number of 1 to the mail program. The sc spreadsheet was then
    suspended, assigned job number 2, and returned to the mail program by specifying
    its job number with the fg %1 command.


