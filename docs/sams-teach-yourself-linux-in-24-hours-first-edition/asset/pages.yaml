- img_proc: true
  md: '# Installing Linux


    At the top of the screen, there''s a section listing the Current Disk Partitions
    found on your hard drive. The middle of the screen is devoted to the Drive Summaries—the
    disk drives the installation program found. The bottom section lists the buttons
    and hot keys the program uses. All of the sections are described more fully in
    the following text.


    # Current Disk Partitions


    This section details the partitions that already exist on your machine. Each listed
    partition has several fields that are (to the right):


    +   * Mount Point The name of the directory that you will mount the directory
    under Linux. Not putting anything in this field means that the partition will
    not be mounted.


    +   * Device This field gives the device name of the partition.


    +   * Requested This field shows the minimum size that was requested when the
    partition was defined.


    +   * Type This shows how much space is currently given to that partition. This
    field shows the type of partition. Commonly seen types are DOS, NTFS, Linux native
    or Linux swap. You might also see that the partition has not been allocated yet.
    This is usually due to the fact that there isn''t enough disk space for the minimum
    amount requested.


    # Drive Summaries


    The lines in this section represent the hard drives that are present in the machine.
    Each line has these fields:


    +   * Drive The hard drive''s device name. IDE hard drives use the device name
    hdX, where X is a letter indicating where it is. SCSI hard drives are labeled
    by how they appear on the chain. The first drive found is sda, sdb, and so on.


    +   * Geom [C/H/S] The drive''s geometry as detected by Disk Druid. The geometry
    is separated by the number of cylinders, heads, and sectors that were found. Compare
    these numbers to what you wrote down from the BIOS. If they do not match, it usually
    indicates that you need to use fdisk.


    +   * Used This area reports the total amount of disk space the disk drive has.
    Compare this number with what you have already written in your inventory.


    An area that indicates in Megabytes how much of the hard drive is currently allocated.


    ![](img/91f0fe61bd3027cda34d2f54533df676_40_0.png)'
