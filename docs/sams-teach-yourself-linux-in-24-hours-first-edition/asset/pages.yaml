  md: '# PART V


    # Hour 20


    # Basic System Administration


    This hour introduces you to the basics of system administration. You''ll learn
    how to use the cmd command, get information about your system, how to manage other
    users, and how to use file tools to keep Linux running in top form. Although much
    of what''s discussed in this hour consists of commonsense guidelines, you''ll
    also get some valuable tips on squeezing the best performance out of Linux. You''ll
    also use this knowledge in the next four hours, which cover handling files, the
    Red Hat control panel, archiving, and scheduling.


    Even if you''re the only person who uses your computer, you should still learn
    basic system administration, or sysadmin, skills, for at least some of the following
    reasons:


    +   - To back up or restore your system, or at the least, important files

    - To conserve disk space

    - To install new software or upgrade your Linux system

    - To teach someone else about Linux, such as a coworker, friend, spouse, or child

    - To troubleshoot problems'
  merge: -1
