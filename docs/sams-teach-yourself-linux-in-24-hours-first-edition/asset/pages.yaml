    08100097.db 96hours.txt message.76

    14days.txt backup001.file phonelog.111597


    This shows all files containing in the filename, because you''ve specified a range
    of characters, or in this case, numbers in your search pattern. You can also use
    a regular expression shorthand to build a shorter expression to do the same thing,
    for example:


    ```

    # ls *[0-9]*

    001file.0009 32days.msg day67.txt

    08100097.db 96hours.txt message.76

    14days.txt backup001.file phonelog.111597

    ```


    How you specify your pattern characters in your expression is important. If you
    only want a list of files ending in a number, you can use


    ```

    # ls *[0-9]*

    001file.0009 phonelog.111597

    ```


    If you only want a list of files beginning with a number, you can use


    ```

    # ls *[a-z][0-9]*

    001file.0009 08100097.db 14days.txt 32days.msg 96hours.txt

    ```


    Here''s a quick exercise: If you want to list only files with numbers inside or
    on both ends of a filename? Try these:


    ```

    # ls *[0-9]*[a-z]*[0-9]*

    backup001.file day67.txt

    ```


    Finally, how do you match patterns when the pattern you''re looking for contains
    a matching character? Easy! Use the backslash to "escape" the character, for example:


    ```

    # ls \?\*

    cathy7.message

    ```


    As you can see, using regular expressions can take some practice, but that your
    efforts will be rewarded. Experimenting with different expressions to see if you
    can come up with results similar to the examples shown in this section:


