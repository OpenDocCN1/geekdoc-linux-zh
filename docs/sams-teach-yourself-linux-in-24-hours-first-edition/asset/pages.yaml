    # Figure 2.5.

    Selecting the disk-partitioning program you want to use.


    Disk Druid is a GUI-based disk partitioning program. it is also to create and
    delete partitions, while also defining the mount points for those partitions.
    disk is a more esoteric partitioning tool. While it is more flexible than Disk
    Druid in certain situations (dealing with drives having odd geometries, for example),
    it is also user-friendly.


    You need to dedicate at least 2 partitions to Red Hat Linux. One needs to be the
    root mount point / and the other needs to be the Linux swap space. The recommended
    Linux swap space is usually equal to the size of RAM you have. If you have 32MB
    or more of RAM you can set the swap space equal to the amount of RAM and feel
