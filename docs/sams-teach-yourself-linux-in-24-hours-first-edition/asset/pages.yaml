  md: '# Basic System Administration


    There are other restrictions you can put in place. The next section shows you
    how you can limit how much of your system''s hard drive can be used.


    # Setting Disk Quotas


    On large, multiuser systems, disk quotas are not only a way of life, but a necessity.
    You can impose disk quotas on your Linux system, and you should, especially if
    you worry about your disk space, or if you''re afraid the users will create large
    files and overrun your hard drive. You can also use disk quotas as a warning device
    (and maybe justification for a new hard drive?). This section explains how to
    start, set, and stop disk quotas.


    # Quota Manipulation with the quota, quotaon, and quota Commands


    Disk quotas limit the amount of hard drive space in several ways. You can set
    quotas for a group of users, using the GID, or impose limits on individual users.
    To manage disk quotas, you''ll use some or all of these commands:


    +   quota | To report on disk quotas

    quotaon | To turn on and set disk quotas for users

    quotaoff | To turn off disk quotas for users

    repquot | Also reports on quotas

    edquota | Edits user quotas

    quotacheck | Checks filesystem on quota usage


    This book won''t go into the details of these programs (read the manual pages),
    but this section shows you how to set a quota for the new user you created. The
    first thing you must do is to enable quotas for your Linux filesystem. This involves
    editing the filesystem table, in /etc/fstab. Be careful! You must make sure you
    don''t make any other changes, or you could cause boot problems. You have been
    warned!


    Make sure you''re logged in as root, then use your favorite editor to open the
    fstab file, and edit the line containing the entry for your Linux partition, for
    example:


    ```

    # <device> <mountpoint> <filesystem> <options> <dump <fsckorder>

    /dev/hda3 / ext2 defaults 1

    ```


    Now add a command and the word usquota to the default field, for example:


    ```

    /dev/hda3 / ext2 defaults,usquota 1 1

    ```


    Save the /etc/fstab file. Next, use the touch command to create a file called
    quota.user, and make the file read-write enabled, for example:


    ```

    # touch /quota.user

    # chmod 600 /quota.user

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_332_0.png)'
