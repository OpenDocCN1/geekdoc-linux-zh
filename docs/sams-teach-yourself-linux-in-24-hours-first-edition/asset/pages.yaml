  md: '# Using Communications Programs


    To send a one-page fax using the sendfax program, you must first convert a text
    file into the Group 3 fax format. You can do this by using the graphics conversion
    program pbmtext, found under the /usr/bin directory with pbm2g3 program—for example,


    ```

    # cat myfile.txt | pbmtext | pbm2g3 | myfile.gd

    ```


    This pipes the myfile.txt through the pbmtext command, which outputs a portable
    bitmap graphics format into the pbm2g3 command, which then converts the characters
    into the fax graphic format. After you do this, you can send the file (assuming
    you''re the root operator)


    ```

    # /usr/bin/sendfax -v -l ttyS1 -c cls2 -r 551212 myfile.gd

    Trying fax device /dev/ttyS1...

    Dialing 551212... OK.

    sending ''myfile.gd''...

    ```


    This runs the sendfax program. The -v command-line option tells sendfax to give
    some feedback during the faxing operation. I specified ttyS1 port and sent the
    fax to a Class 2 fax modem with -c cls command-line option. The phone number 555-1212
    was specified with the -r option, and the file, myfile, was the file you created
    with the command-line pipe.


    If you rather use a simpler approach, try the faxpool program, which automatically
    converts your text file, and places it in the fax spool directory under the /var/spool/fax
    directory—example:


    ```

    # faxpool 551212 myfile.txt

    spooling to /var/spool/fax/outgoing/F000010...

    spooling myfile.txt...

    myfile.txt is format: ascii

    Aladdin Ghostscript 3.33 (10/1995)

    ```


    > Copyright (C) 1995 Aladdin Enterprises, Menlo Park, CA. All rights reserved.

    This software comes with NO WARRANTY; see the file COPYING details.

    Loading NimbusFont. Bold font from /usr/share/ghostscript/fonts/n022004.pbf...

    178956 120152 26879 0


    ```

    Printing myfile.txt

    Page height = 67.

    Inputting Header on top of pages.

    infax queued successfully. Will be sent at next ''faxrun'' run.\n

    ```


    The faxpool program requires only a phone number and filename, and has the advantage
    of handling multiple pages easily. You can send the faxes faxing in the fax queue
    with the fax command—example:


    ```

    # fax

    F00010/JOB: queued by bball. 1 page(s) on 551212

    ```


    The fax command reports on the number of jobs you''ve created, the number of pages,
    and the phone number of the remote fax machine. You can remove the waiting fax
    by using the faxm command, as in the following example:


    ```

    # faxm F000010

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_178_0.png)'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'The waiting faxes may be sent by the root operator by running the faxrun command—for
    example,


    ```

    # faxrun

    processing FRQ00011/JOB...

    /usr/sbin/sendfax -v 5551212 f1.g3

    Trying fax device /dev/ttyS1''... OK.

    Dialing 5551212... OK.

    sending ''f1.g3''...

    command exited with status 0

    send mail to bball:

    ```


    This shows that the faxrun command uses the sendfax program to look at the fax
    queue in the /var/spool/sendfax directory, connects with the modem, dials out,
    and then sends the fax. One nice feature of the sendfax software package is that
    a mail message is automatically mailed to the sender to verify the faxing, as
    in the following example:


    ```

    Subject: OK: your fax to 5551212

    Your fax has been sent successfully at: \c

    Thu Dec 4 23:45:26 EST 1997

    njob / Log file:

    user bball

    input myfile.txt

    ppages f1.g3

    Status Thu Dec 4 23:45:26 EST 1997 successfully sent

    Sending succeeded after 0 unsuccessful tries.

    ```


    You can also set your Linux system to automatically receive incoming faxes with
    the mgetty program. Used much like the ugetty program, mgetty also requires at
    least one change to its configuration file in the /etc/mgetty+sendfax directory.
    The change you can make (as the root operator) is to edit the phone identification
    entry in the file mgetty.config—for example,


    ```

    # set the local fax station id

    #fax-id 1 49 89 xxxxxxx

    fax-id 1 202 555 1212

    ```


    This sets the local fax machine phone number. After you do this, you should edit
    the /etc/initab file as described earlier, and use mgetty to listen to the serial
    port—for example,


    ```

    3:2345:respawn:/sbin/mgetty -s 38400 ttyS1

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_179_0.png)


    As mentioned before, any edits of the /etc/initab file are potentially hazardous.
    Always have a spare boot disk and make a backup of the file first.


    CAUTION'
