    # Common Problems and Their Solutions


    This section covers most of the common problems you''ll experience when starting
    X Window, and how to solve them.


    # Screen Remains Black


    Wait for 30 seconds or so. On a 486/66 or slower machine X Window can take a while
    to start. For some video cards, the driver may be having problems using properly.
    Type Control-Alt-Backspace and re-run xconfigurator.


    # Screen Remains Black and Machine Does Not Respond


    This is a worst-case scenario. You need to reboot the machine and let the machine
    check the drives for errors. The Linux filesystem keeps track of what parts are
    allocated and when a machine is shut down in a bad state, it needs to run the
    fsck to fix these items. Most of the start-up scripts can handle this without
    your intervention.


    # Large Xs Appear on the Screen


    In case of large overlapping Xs, the X server has probably gone into 320x200 mode
    versus 640x480. This problem occurs when the video card is not detected correctly
    by the server. Exit out of X with the hotkey Ctrl-Alt-Backspace or via the Start
    button at the bottom of the screen. Check the file startx.out by using the command
    startx.out and seeing any errors that may help set up matters correctly were listed.
    Sometimes the problem is that you may need to select RAMDAC or some other option
    for that.


    # Mouse Does Not Move or Acts Strangely


    If the mouse doesn''t respond correctly to your input, it can be due to several
    problems. The first is that the pointer section of the file was misconfigured
    by mouseconfig and xconfigurator Xconfigurator gets the values for the mouse from
    the settings that are set by the mouseconfig program. You should check the settings
    in the file /etc/sysconfig/mouse or via the mouseconfig and then rerun xconfigurator
    or edit the /etc/X11/XF86config The section of the file should look something
    like the following:


    | Section "Pointer" | "PS/2" |

    | Device | "/dev/mouse" |

    | EndSection |


    ![](img/91f0fe61bd3027cda34d2f54533df676_59_0.png)'
