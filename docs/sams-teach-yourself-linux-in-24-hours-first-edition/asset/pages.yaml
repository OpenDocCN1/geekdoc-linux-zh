  md: '# PART

    I


    # Hour 3


    # Configuring the X Window System


    This hour looks at getting your X11 Window system up and running. X Window is
    the graphical windowing system that Linux and many other UNIX systems use it.
    It is analogous to the windowing environment in Windows, OS/2, or MacOS.


    One of the differences between X11 Window and the other environments is that it
    was designed to be a machine/OS independent networked client/server program. As
    a result, the system is broken up into two major components: the X11 Window that
    runs on the machines and interacts directly with the monitor and video card, and
    the various clients that are displayed on the X11 server. These clients can range
    from terminal emulators (xterm) to eye candy (xpat2), or can manage the look and
    feel of the screen (X11 Window Manager).


    This hour begins by setting up the X Window system server that was skipped during
    the install, and finishes up by familiarizing you with the look and feel of the
    default windows that Red Hat offers. A later hour deals with customizing'
  merge: -1
  pgno: 52
- img_proc: true
