    > CAUTION Make your changes reflect your supported screen size, or programs might
    start off-screen, or with windows too large to use. Always use the exclamation
    character for comments, and if you edit the default, original application resource
    file, copy the original settings first to a comment line.


    # Changing X11 Mouse and Cursor Modes


    When you use X11, you might want to change the way your mouse works, or switch
    the order of the mouse buttons. This is especially handy if you''re left-handed
    or if your mouse responds differently than the desired setup. You can also change
    the type of cursor used by your window manager.


    In order to change your root window cursor, you need to know what cursors are
    available. You''ll find a list of cursors in the cursorsfont.h file under the
    /usr/X11/include/X11 directory, for example:


    ```

    #define XC_exchange 50

    #define XC_fleur 52

    #define XC_gobbler 54

    #define XC_gumbby 56

    #define XC_hand1 58

    #define XC_hand2 60

    #define XC_heart 62

    #define XC_icon 64

    ```


    Also, many types of cursors are listed in this file. Knowing these different type
    of cursors, you can use the xroot client, or root window utility program, to set
    your root cursor image, for example:


    ```

    # xsetroot -cursor_name hand1

    ```


