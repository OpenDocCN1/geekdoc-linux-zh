  md: 'Once you''re done selecting the new partitions for your drive, select Ok or
    F12 and confirm that you want to make the changes. The install goes to the next
    stage.


    # # Activating Swap Space


    Once the partitions have been created, the install program searches for swap partitions.
    If it doesn''t find any it will warn you, and you can go back to the previous
    step to set up a section to be swapped. If one or more swap spaces were detected,
    a screen, shown in Figure 2.8, asks which partitions you wish to use for swap.
    Select the boxes of the partitions you want to use, and also select whether not
    you want to check for bad blocks when it does swap formatting. Once you are ready
    to continue, choose Ok.


    **Figure 2.8.**nIt''s a good idea to have Linux check for bad formatting.


    ![](img/91f0fe61bd3027cda34d2f54533df676_43_0.png)


    # # Formatting Partitions


    Once the swap space has been selected, the next screen brings up a dialog box
    of the Linux Native partitions you need to format. Format any new partitions created
    in the install process, and you should format any old partitions from previous
    Linux installs that do not contain data you want to keep.


    Toggle the checkbox for each partition you want to format, and toggle whether
    you want to check for bad blocks during the format.


    # # Selecting Which Components To Install


    The next stage of the install is to select which packages you want on your Linux
    Box. A screen, shown in Figure 2.9, asks which components you would like to install
    on your machine. These components are sets of packages that work together or are
    similar in nature. The X Window System is all of the packages that give most of
    the X functionality (server, basic libraries, window manager, and some clients).
    Adding the X Games package installs various amusements.


    If you want to install a minimal base 50 megabyte system, you need to unselect
    everything that has been auto-selected.'
