    # Screenscreaver Settings and Programs


    Although displaying a colored pattern or picture on your desktop can be fun, X11
    screensavers also offer password control. Even though the utility of screensavers
    with latest computer monitors might be questioned (most modern displays won''t
    suffer from "burn-in" effect of a continuous display), you''ll find a variety
    of interesting screensavers included in your CD-ROM.


    You can use the xset command, introduced earlier, to manage screensaving over
    X11. If you''d like to see the current settings, use the q command-line option
    (note that there is no hyphen-used), for example:


    # xset q


    Server Saver:

    prefer blanking: yes allow exposures: yes

    timeout: 0 cycle: 60


