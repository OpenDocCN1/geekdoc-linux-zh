  md: '# PART IV


    # Hour 14


    # Text Processing


    This hour provides you with an overview of some word processing, or text editing,
    tools for Linux. There''s not enough time to cover all of the 100 or more Linux
    text editors, but this hour provides you with highlights of the features of the
    tools you''ll find on your CD-ROM. It also shows you the basics of using these
    editors to get you started.


    # Word Processors in the Linux Environment


    Text editors are used by many different types of people. Casual users, writers,
    programmers, and system administrators will all use a text editor at one time
    or another in Linux. You''ll definitely need to know how to change text files
    to configure Linux to work the way you want. What follows is an introduction to
    different word processors, text editors, and text tools you can use during your
    Linux sessions.


    ![](img/91f0fe61bd3027cda34d2f54533df676_234_0.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Although how you use a computer dictates what type of software is important
    and should be installed, most people agree that more than half our time when using
    a computer is spent using a text editor or word processor. This will change, of
    course, as computer interfaces evolve and network communication becomes more integrated
    into our work environment, but in general, if you''re using Linux on your computer
    at home you''re probably going to be word processing or editing files a lot of
    the time.


    The tools in this hour are interactive programs that allow you to enter text,
    move a cursor or drop a menu. These programs and related files vary in size from
    nearly 20 megabytes to less than 200,000 characters. However, there are more than
    two dozen text tools, including line editors such as the ed or ex commands, for
    Linux, that while not interactive, enable you to change, manipulate, or rearrange
    text.


    # Features of the emacs Environment


    What do you call a text editor that edits text, reads Usenet news, as a personal
    calendar and diary, sends electronic mail, a programming language interpreter,
    plays games, is a Linux shell, and more? Why emacs, of course!


    emacs, which stands for editing macros, was originally developed by Richard Stallman,
    founded the Free Software Foundation, and FSF. The emacs editor is distributed
    by the FSF as part of the GNU, or GNU''s Not UNIX project. Without a doubt, emacs
    is the most widely available and fully featured free editor, and runs on more
    computer systems than any other.


    There isn''t enough time in this hour (or this book!) to cover all the features
    of this program. Look at Table 14.1 to find most of the keyboard commands you
    can use to get started.


    # Table 14.1. Basic emacs commands and keystroke combinations.


    | Action | Key Combination |

    |---|---|

    | | C-b=hold Ctrl key, press b |

    | Cursor backward | C-b |

    | Cursor forward | C-f |

    | Cursor up | C-p |

    | Cursor down | C-n |

    | Go to beginning of line | C-a |

    | Go to end of line | C-e |

    | Page down | C-v |'
