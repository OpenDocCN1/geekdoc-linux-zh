  md: '# Getting Filesystem Statistics with the df Command


    The df (free disk space) command will gather and summarize important statistics
    all currently mounted filesystems. The df command is easy to use, for:


    ```

    # df

    Filesystem      Used Available Capacity Mounted on

    /dev/hda3       497699 443871 28124 94% /

    /dev/hda1       509856 269532 48224 92% /mnt/dos

    /dev/hdc1       3886 2596 1272 67% /mnt/flash

    /dev/hdb       643424 643424 0 10% /mnt/cdrom

    ```


    This outputs four different filesystems on three devices mounted Linux. The first
    is the root partition at / directory on /dev/hda3; the second is a DOS partition
    under /mnt/dos on /dev/hda1; the third is a flash card under /mnt/flash on /dev/hdc;
    and the fourth is CD-ROM, mounted under /mnt/cdrom on /dev/hdb. The command also
    lists the size of the storage device, how much has been used, how much is available,
    and the current capacity of the device. Notice that the CD-ROM has no space left.
    Because it is read-only, meaning you can''t save or delete files on this device.
    The command shows in the next example will let you know.


    One way to find out the different filesystems you have mounted is to use the mount
    command. This command is usually used during startup, by the root operator to
    mount and mount filesystems, but you can use mount to show what type of filesystems
    are in use, and how the filesystems are mounted, for example:


    ```

    # mount

    /dev/hda3 on / type ext2 (rw)

    /dev/hda1 on /mnt/dos type mdos (rw)

    one on /proc type proc (rw)

    /dev/hdc1 on /mnt/flash type mdos (rw)

    /dev/hdb on /mnt/cdrom type iso9660 (ro)

    ```


    This shows that your root partition, on the / directory, is a ext2 filesystem
    mounted read-write, whereas /mnt/dos and /mnt/flash contain DOS partitions, also
    read-write.(The /proc filesystem is a special Linux uses for process reporting,
    such as running applications, system state, and so on.). Finally, mount reports
    that your CD-ROM is mounted as a read-only iso9660 filesystem.


    You can use this information from mount to get specific information with the df
    command, using the df -t type, or filesystem, as follows:


    ```

    # df -t ext2

    Filesystem      1024-blocks Used Available Capacity Mounted on

    /dev/hda3       497699 443873 28122 94% /

    ```


    This tells df to just show information about any mounted Linux filesystems. You
    can get a list of valid filesystems to specify with the df command by looking
    at the mount manual page.


    ![](img/91f0fe61bd3027cda34d2f54533df676_317_0.png)'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Basic System Administration


    # 297


    The mount command is covered in more detail in Hour 21, "Handling Files." You
    can see that by using the df and mount command, you can get reports on the type
    of mounted devices, where the devices are mounted, and how much room you have
    left on each.


    # Getting Filesystem Disk Usage with the du Command


    The du (disk) command conveniently summarizes how your disk is being used, reporting
    the amount of space required by each directory or specified path. Although the
    du command has more than 20 command-line options, this section presents some of
    the common ones, and leaves it to you to experiment. You can use the du command
    by itself, or specify a directory or path, for example:


    ```

    # du /book

    904 /mail

    12080 /tin/.mailidx

    1 /.tin/.index

    10 /.tin

    ...

    589 /News

    9 /.index

    5 /.procmail

    418 /.ncftp

    778 /.reading

    27199 /documents

    ```


    This report (for brevity, not all the directories are listed) shows the contents
    of a home directory, with a total for 27,199-kilobyte blocks. If you find this
    hard to understand, you can have the report size in bytes, for example:


    ```

    # -b /book

    89706 /mail

    12294410

    1024 /.tin/.mailidx

    1024 /.tin/.index

    9382 /.tin

    561715 /News

    4033 /.index

    4139 /.procmail

    2791 /.ncftp

    424937 /.reading

    784216 /documents

    26785752

    ```


    If this is too much information for you, then you can use the --summarize option
    to get the total in kilobytes or bytes, as follows:


    ```

    # du b --summarize

    26786903

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_318_0.png)'
