    # Listing Directories with the dir and vdir Commands


    If you just can''t get the hang of using 1ls to list your directories, you can
    use dir or vdir commands. These commands have only about 45 command-line options,
    compared to 1ls'' over 75, but they''re just as capable. They work like 1ls, but
    with certain defaults.


    The dir command works like the 1ls command, listing the files in sorted columns,
    for example:


    ```

    # dir

    News axhome nsmail search

    author.msg documents reading vultures

    auto mail research

    ```


    The vdir command works like the 1ls -l option, and presents a long format listing
    by default, for:


    ```

    # vdir

    total 15

    -rw-xr-x 2 bball bball 1024 Nov 08:20 News

    -rw-rw-- 2 bball bball 4766 Nov 12:01 author.msg

    drwxr-xr-x 2 bball bball 1024 Nov 05:04 auto

    drwxr-xr-x 3 bball bball 1024 Nov 12:13 asharma

    drwxr-xr-x 2 bball bball 1024 Nov 15:13 documents

    drw---- 2 bball bball 1024 Sep 15:07 nmsail

    drwxr-xr-x 2 bball bball 1024 Oct 20:28 reading

    drwxr-xr-x 5 bball bball 1024 Nov 05:03 research

    -rw-xr-x 1 bball bball 200 Oct 24 13:24 search

    -rw-rw-- 1 bball bball 801 Nov 21 22:46 vultures.msg

    ```


    Although you might not need to find manual pages for dir or vdir (they''re mentioned
    in the man page), you can get help with each command using the --help option.


    # Graphic Directory Listings with the tree Command


    You know how to list the contents of your directories, but you may also be interested
    in the directory structure of your system, or the directory structure of a particular
    tree of your system (such as /usr/x118). For example, 1ls will recursively print
    your directories, but how are these related to each other? If you would like a
    more direct, graphical view of your directories, a directory listing utility can
    help.


    Steve Baker''s tree utility will provide a graphic view of any desired structure,
    and it has several handy features. First, tree syntax, or command-line, options
    are similar to some of those for the 1ls command. Wildcards or expressions are
    supported. The tree command also


