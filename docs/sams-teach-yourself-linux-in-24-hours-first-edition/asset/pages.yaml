  md: '# Choosing a Mouse


    The program probes your system for a mouse, and if it finds one, indicates the
    type and port that the mouse is connected to. Depending on the mouse, you may
    be asked for the number of buttons the mouse has, what protocol it uses, and if
    you need your 2-button mouse to emulate a 3-button model.


    > After the install has occurred, if the need to change the values for the mouse,
    you can use the program /usr/sbin/mouseconfig.


    ![](img/91f0fe61bd3027cda34d2f54533df676_45_0.png)


    # Configuring X Window


    The next window comes asks you about the X Window server that you want to run.
    The configuration of X Window is detailed more in Hour 3, "Configuring the X Window
    System." However, this section walks you through a quick rundown so you can finish
    the initial installation.


    Scroll down the list of video cards listed and try to find the card that is in
    your machine. One thing to note is that video cards, like cards, may have brand
    names very similar to one another, but the items under the hood (chipset in the
    case of the card) can be very different. If you can''t find a card that matches
    what you have in your machine, choose the Generic VGA card that every video card
    should be to emulate. Once a card has been selected, the appropriate X server
    will be installed onto your machine.


    The next screen determines the model of monitor you have. It is very important
    that you select a monitor that matches your model exactly. If your model isn''t
    listed, you need to choose custom and fill in the values that were researched
    earlier for your monitor.


    > Entering incorrect values for your monitor can cause damage to the monitor.
    The author has smoked a monitor in the past by putting the wrong model''s data
    into the settings.


    ![](img/91f0fe61bd3027cda34d2f54533df676_45_1.png)


    If you have chosen the Generic VGA card, you are asked if you wish to probe for
    settings. Choose not to probe, and after a moment, you should move on to the next
    section of the manual


    # Network Configuration


    If you will be installing this machine onto a Local Area Network (LAN), and you
    want to set up networking now, you should choose the Yes button. Otherwise choose
    No. If needed, you can configure networking after the install.'
