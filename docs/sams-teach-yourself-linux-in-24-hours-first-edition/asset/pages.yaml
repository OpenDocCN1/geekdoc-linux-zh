    Just A MINUTE


    If you can''t find your card on the list of servers, you should try to use the
    SuperProbe program. Running that probes the card directly and outputs video chipset,
    amount of memory, and RAMDAC chipset it found.


    The SuperProbe command can lock the machine and with a very few cards cause other
    problems. Read the man page on SuperProbe (man SuperProbe), and if you aren''t
    comfortable with the possible risk, don''t run it.


    CAUTION


    If you still haven''t found a chipset that matches your system, you need to use
    the VGA16 or Mono server, as these are the lowest common denominators available.
    When choosing a video card, you should also be aware that video card manufacturers
    like to name recognition but also use the best technology for their card. Sometimes
    this results in two cards with similar names having very different chipsets—and
    it''s the chipset Linux cares about. So, you may set up the servers thinking you
    have one chipset, and when finally starting the server tells you that the card
    is not detected.


    # Selecting Your Monitor


