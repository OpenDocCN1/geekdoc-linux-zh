  md: '# Basic System Administration 301


    ![](img/91f0fe61bd3027cda34d2f54533df676_322_0.png)


    > Be careful about deleting files with file-number extensions, such as .1, across
    your system: you will delete a lot of libraries and manual pages if you automate
    a search-and-destroy mission starting at the root, or / , directory!


    If you feel uncomfortable with letting the find command run through your file
    system and deleting files, just have the command generate a report of candidate
    files as follows:


    ```

    # find / \-name core -o .* -xdev > deletelist.txt

    ```


    and run it unattended, at regular intervals, and have the report emailed to you
    as an automatic reminder. See Hour 24, "Scheduling," for details.


    If you experiment with your own combination of commands, you''ll soon come up
    with your customized reports and cleanup actions. You now know how to get information
    about your drive space. You''ll also learn about managing disk space, using quotas
    (software limits on hard drive usage) in "Managing User Access" section. For now,
    you''ll learn how to find out more about what''s going on in your computer''s
    memory when you run Linux.


    # Getting Memory Information


    Although the industry trend has been to offer more hard drive space and more memory
    for less, many people don''t like outlay cash to expand their systems. The good
    news is that Linux is very efficient at using memory, even a 16MB system provides
    enough room (with an equal amount of swap space) to run X11 and most programs
    well. The bad news is that programs are getting larger the time, especially with
    feature creep, which more and more functions creep into programs. This section
    introduces you to some programs you may find helpful in understanding your system''s
    memory, and gives you some tips on conserving memory.


    # Memory Reporting with the free Command


    The free command shows breakdowns of the amounts and totals of free and used memory,
    including your swap usage. It has several command-line options, but is easy to
    run and understand, for example:


    ```

    # free

    ```


    | Mem: | used | free | shared | buffers | cached |

    |---|---|---|---|---|---||

    | -/+ buffers: | 30892 | 28004 | 2888 | 14132 | 3104 | 10444 |

    | Swap: | 34268 | 7964 | 26304 | | | |


    ![](img/91f0fe61bd3027cda34d2f54533df676_322_1.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'This shows a 32MB system with 34MB swap space. Notice that nearly all the system
    memory is being used, and nearly 8MB of swap space has been used.


    By default, the free command displays memory in kilobytes, or 1024-byte notation.
    You can use the -b option to display your memory in bytes, and the -m option to
    display memory in megabytes. You can also use the free command to constantly monitor
    how much memory is being used through the -s command. This is handy as a real-time
    monitor if you specify a -01-second update and run the free command in a terminal
    window under X11.


    # Virtual Memory Reporting with the vmstat command


    The vmstat is a general-purpose monitoring program, which offers real-time display
    of only memory usage, virtual memory statistics, disk activity, system usage,
    and central processing unit (CPU) activity. If you call vmstat without any command-line
    options, you''ll get a one-time snapshot, for example:


    | vmstat memory swap system cpu |

    | r b w swpd free cache sy si bo in in cs us sy id |

    | 0 0 7468 1068 42852 1 10 1 134 68 3 2 96 |


    If you specify a time interval in seconds in the vmstat command, you''ll get a
    continuously scrolling report. Having a constant display of what is going on with
    your computer can help you if you''re trying to find out why your computer suddenly
    slows down, or why there''s a lot of disk activity.


    # Viewing Your Shell’s “Ulimitations”


    You''ve already seen how you can limit the size of core dumps previously in this
    hour. There are other settings you can change in your shell. If you''re using
    bash or pdksh (ksh) shell, you can use the ulimit command''s -a option to print
    your current settings, for example:


    | ulimit -a 1000000 |

    | core size (blocks) unlimited |

    | data size (kbytes) unlimited |

    | file size (blocks) unlimited |

    | max memory size (kbytes) 8192 |

    | stack size (kbytes) unlimited |

    | cpu time (seconds) unlimited |

    | max user processes 256 |

    | pipe size (512 bytes) 8 |

    | open files 256 |

    | virtual memory (kbytes) 2105343 |


    If you''re using the tcsh or csh shell, you can use the limit command to list
    the current settings:


    | $ limit unlimited |

    | cputime unlimited |

    | filesize unlimited |


    ![](img/91f0fe61bd3027cda34d2f54533df676_323_0.png)'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Basic System Administration


    ```

    datasize unlimited

    stacksize 8192 kbytes

    coredumpsize 10000000 kbytes

    memoryuse unlimited

    descriptors 256

    memorylocked unlimited

    maxproc 256

    ```


    These are different from limits for the root operator. The limits shown in this
    example are known as soft limits. To use the shell''s hard limits, log in as the
    root operator, and use the -a limit option (use -Ha for bash or ksh''s unlimited
    command), for:


    ```

    $ su

    Password:

    # limit -h

    cputime unlimited

    filesize unlimited

    datasize unlimited

    stacksize 8192 kbytes

    coredumpsize unlimited

    memoryuse unlimited

    descriptors 256

    memorylocked unlimited

    maxproc 256

    ```


    As you can see, viewing the limits as the root operator in the tcsh shell shows
    a much different situation. This is also a good reason not to run as the root
    operator! As a sysadmin, you can use these settings to limit the amount of memory
    or number of processes available to each user. This is extremely handy if you
    have a number of people working on your computer at the same time, and you want
    to conserve system memory. For using Linux on a standalone computer under your
    normal login and working conditions, you''ll find the default limits quite reasonable.


    # Reclaiming Memory with the kill Command


    As a desperate measure you need to quickly reclaim memory, you can stop running
    programs by using the kill command. In order to kill a specific program, you should
    use the ps command to list current running processes, and then stop any or all
    of them with the kill command. By default, the ps command lists processes you
    own and which you can kill, for example:


    ```

    # ps

    PID TTY STAT TIME COMMAND

    367 p0 S 0:00 bash

    581 p0 S 0:01 rxvt

    582 p1 S 0:00 (bash)

    747 p0 S 0:00 (appix)

    809 p0 S 0:18 netscape index.html

    810 p0 S 0:00 (dns helper)

    945 p0 R 0:00 ps

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_324_0.png)'
