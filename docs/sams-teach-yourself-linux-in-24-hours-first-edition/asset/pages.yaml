  md: '# Editing the resolv.conf File


    This is a simple process. First, make sure that you are logged in as the operator.
    Then look in the /etc directory for a file called resolv.conf. If it''s there,
    open it with your favorite text editor (see Hour 14, "Text Processing") and add
    the IP addresses of ISP''s DNS servers. If your ISP has only one, that''s okay.
    If your ISP has more than one, that''s okay, too. Enter the lines, using this
    format:


    ```

    nameserver 205.198.114.1

    nameserver 205.198.114.20

    ```


    Close the file. That''s all there is to do! Next, you will create or edit a script
    you can to start a PPP connection.


    # Editing the PPP Connection Scripts


    Before you start, you should know that this script is only one way to start a
    PPP connection. You use this approach, which requires you to be logged in as the
    root operator; a much simpler approach, which I''ll show you later; or other,
    more complex approaches, using wrapper programs or setting options in ppp /etc/ppp/options
    (which is passed when the ppp daemon starts).


    I won''t get into the detailed methods, because I want to outline the simplest
    approaches for you and get you online quickly. When you are getting a connection,
    I suggest that you look at ppp''s manual pages, Robert Hart''s PPP-HOWTO under
    the /usr/doc/HOWTO directory, Al Longyear''s PPP-FAQ under the /usr/doc/FAQ directory,
    or pertinent sections in the Linux Network Administrator Guide.


    The first thing you should do is make sure that you are logged in as the root
    operator. Then, look in the /etc/ppp directory for a file called ppp. If it''s
    there, make a copy (you can call it anything) or rename ppp to ppp-on.org. If
    ppp isn''t there, copy it from the /usr/doc/ppp-2.20f-3/scripts directory. 10.1
    shows you parts of the script, written by Al Longyear.


    # 10.1. The ppp-on connection script.


    ```

    TELEPHONE=555-1212

    ACCOUNT=username

    PASSWORD=password

    LOCAL_IP=0.0.0.0

    REMOTE_IP=0.0.0.0

    # The telephone number for the connection

    # The account name for login (as in ''George Burns'')

    # The password for this account (and ''Gracie Allen'')

    # Local IP address if known. Dynamic = 0.0.0.0

    # Remote IP address if desired. Normally 0.0.0.0

    ```


    ```

    DIALER_SCRIPT=/etc/ppp/ppp-on-dialer

    exec /usr/sbin/ppp lock modem crts /dev/modem 57600 \

    asyncmap 200A0000 escape FF SLOCK_IP:$REMOTE_IP \

    noipfault netmask SNETMASK defaultroute connect \

    DIALER_SCRIPT=$&

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_186_0.png)'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Hour 10


    You need to change several parts of this script. For the most part, you need to
    make only a few changes. Some of the critical elements are


    +   - TELEPHONE—Enter your ISP''s modem connect number here.\n- ACCOUNT—Enter
    your username or login name (usually assigned by your ISP).

    - PASSWORD—Enter your password here (usually assigned by your ISP).

    - DIALER_script—The complete pathname of your dialing script program. The chat
    program does the dialing, connecting, and login for you. If you can''t find a
    copy of this script, which is called ppp-on-dialer, look under the /usr/doc/ppp-2.2/scripts
    directory. (Listing 10.2 shows the ppp-on-dialer script). Note that if your ISP''s
    computer doesn''t present a name: prompt, you''ll have to change the login and
    password: strings in this script to match the ones from your ISP.


    # 10.2. The ppp-on-dialer dialing script.


    ```

    exec chat -v

    TIMEOUT 3

    ABORT ''\\nBUSY\r''

    ABORT ''\\nNO ANSWER\r''

    ABORT ''\\nRINGING\r\r\nRINGING\r\r\nAT''

    ''OK-+++c-OK'' ATH0

    TIMEOUT 30

    OK ADDTSTEPHONE

    CONNECT /\nlogin: SCOUNT

    password: SPASSWORD

    ```


    Next, examine the ppp command line in the ppp-on script, and change /dev/modem
    to match the device your modem is connected to. If you want, can use the approach
    outlined in Hour 9, "Using Communications Programs," to make a symbolic link from
    your modem''s serial port to /dev/modem. Here''s a tip: if you have a 14.4 modem,
    use 19200 as the numeric value; if you have a 28.8 or 33.6 modem, try 57600. You
    may be able to connect to a faster speed, especially with newer modems.


