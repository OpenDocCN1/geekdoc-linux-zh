    sequence of the tracks on your CD. To play track multiple times, click a track
    number with your mouse''s middle button and drag the track along the CD track
    sequence. When you release your mouse button, the track number is duplicated.


    # Figure 19.1.


    The xplayed XI client offers standard music CD controls, along with track re-ordering
