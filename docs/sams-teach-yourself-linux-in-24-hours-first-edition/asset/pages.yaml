    # Checking the Calendar and Keeping Appointments with emacs


    The emacs text editor, more fully discussed in Hour 14, "Text Processing," has
    a number of features that can help your personal productivity or even keep you
    amused. You can check the current calendar, see a list of holidays (and more),
    and keep a diary with appointment reminders.'
