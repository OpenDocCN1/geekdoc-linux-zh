    # Setting Up and Calling Out with the seyon X11 Client


    The seyon communications program, by Muhammad M. Sagaf, runs only under the X
    Window System, and has an extensive list of features. Although seyon isn''t as
    simple or initially friendly as minicom, it has


    +   - Built-in help

    - A built-in telecommunications scripting language to automate calling up and
    logging into other computer systems

    - A built-in text editor for writing telecommunications scripts

    - A command-line shell dialog for running commands, which displays output in the
    main communication window

    - Buttons to set up modem speed, parity, and stop bits


    If you''ve created a symbolic link to /dev/modem, the seyon program will automatically
    recognize and work with your modem. All you have to do to call out and connect
    with another computer is to type your AT command with the phone number to dial
    and connect.


    If you need to tell the seyon client the specific device for your modem, click
    the Set button in the Seyon Command Center to bring up the Settings window. Click
    the Port button in the Settings window and type in the name of the device, /dev/cuat
    for example, in the Values? window. Figure 9.3 shows seyon and its settings windows.'
