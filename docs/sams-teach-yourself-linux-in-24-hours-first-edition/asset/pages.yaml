  md: '# Reading and Navigation Commands


    # Reading Directories and Files


    Now that you know about directory navigation, searching for files, or how to find
    more information about programs, I''ll introduce you to other basic Linux commands
    you can use. This section shows you how to list the contents of directories, make
    a catalog of your hard drive, and read the contents of files. You''ll learn the
    basic forms of these commands to get you started.


    # Listing Directories with the ls Command


    The ls (list directory) command will quickly become one of your most used programs.
    In its simplest form, ls lists nearly all of the files in the current directory.
    But this command, which has such a short name, probably has more command-line
    options (more than 75 at last count) than any other program!


    In the simple form, ls lists your files:


    ```

    ls

    News        axhome nmail      search

    author.msg documents reading vultures.msg

    auto        mail       research

    ```


    You can also list the files as a single line, with comma separations, with the
    -m option:


    ```

    ls -m

    News,author.msg,auto,axhome,documents,mail,nmail,reading,research,search,vultures.msg

    ```


    If you don''t like this type of listing, you can have your files sorted horizontally,
    instead of vertically (the default), with the -x option:


    ```

    ls -x

    News        axhome nmail      search

    author.msg documents reading vultures.msg

    auto        mail       research

    ```


    But are all these files, or are there several directories? One way to find out
    is to use the -F option:


    ```

    ls -F

    News/       axhome/ nmail/      search*

    author.msg/ documents/ reading/ vultures.msg/

    auto/        mail/       research/*

    ```


    As you can see, the -F option causes the ls to show the directories, each with
    a character appended to the filename. The asterisk (*) shows that the file search
    is an executable program. But are these all the files in directory? If you want
    to see everything, you can use the -a option with -F, as follows:


    ```

    ls -aF

    ./         .dt/       .neditb    auto/

    ..        .dtprofile* .netscape/  axhome/

    ```


