    # Using gnuplot to Graph Mathematical Formulas


    This shows you how to use gnuplot, an interactive plotting program by Thomas Williams
    and Colin Kelley. This program supports nearly 40 different printers and output
    devices, which you''ll probably want to experiment with gnuplot using the X Window
    System, and print your graphics using PostScript (see Hour 15, "Preparing Documents,"
    for more information on how to do this).


    Although gnuplot (no relation to GNU software, but supported and distributed by
    the Free Foundation under the GNU General Public License) is not the only mathematical
    modeling and plotting program for Linux, it is included on your CD-ROM. You''ll
    find the gnuplot program in the /usr/bin directory.


    The gnuplot program (see Figure 17.6) is a complete, interactive plotting program,
    and was originally designed to graph math functions and data. In this regard it
    is somewhat similar to other commercial function-interpretation and plotting programs.
    It can read and save files, and has built-in help, so you can query the program
    while you use it.


    Using gnuplot is simple. The program has five different command-line options,
    but many aspects of the program may be controlled interactively or as commands
    in a loaded gnuplot'
