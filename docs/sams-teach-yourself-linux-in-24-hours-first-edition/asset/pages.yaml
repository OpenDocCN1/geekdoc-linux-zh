  md: 'The script uses the bash shell getetops command to look at your command line
    for any options. If a matching letter is found by the case statement, the script
    commands up until the two semicolons are executed. For, if you want a reminder
    of how to use the script, you can use the -h, or help option:


    ```

    # rmv -h

    safe file delete v1.0

    rmv -d[delete]-e[mpty] -h[elp] -l[ist] file-4

    ```


    This prints a short message because the script found the letter h on the command
    line, then printed the message using the echo command. To delete files, you must
    use the -d, or delete command-line option:


    ```

    # rmv -d graf.gif graf.pnm graf.tif

    deleting:graf.gif graf.pnm graf.tifrmv finished.

    ```


    This deletes four files by moving them to the .trash directory in your home directory.
    The d option was executed on the command line and the script then printed a message,
    echoed the file names to your display, set the delete variable to true. Because
    the delete variable was changed to true, the rmv command found in the if ... then
    statement is executed.


    You can verify that the files have been moved by using the -l, or list option,
    to see the contents of your trash:


    ```

    # rmv -1

    your trash directory contains:

    total 278

    -rw-rw-r-- 1 bball bball 3299 Dec 28 22:38 graf.gif

    -rw-rw-r-- 1 bball bball 27281 Dec 28 22:38 graf.pnm

    -rw-rw-r-- 1 bball bball 6890 Dec 28 22:38 graf.tif

    ```


    As before, because the letter l was detected on the command line, the script set
    the list variable to true, then executed the l command to list the contents of
    your .trash directory. If you''re sure to delete these files, you can then use
    the -c, or empty command-line option:


    ```

    # rmv -e

    empty the trash...

    empty the trash?

    trashcan delete aborted.

    # rmv -e

    empty the trash...

    empty the trash? y

    # rmv -1

    your trash directory contains:

    total 0

    ```


    The rmv script asks if you''re sure you want to empty the trash. If you type an
    n, the trash is aborted. Because the letter e was found on the command line, the
    delete variable was set to true and then following the if test line were run.
    The script prints a message to your display, and then, using the read command,
    waits for you to enter an answer. The answer is tested, and if yes, the files
    in the .trash directory are deleted.


