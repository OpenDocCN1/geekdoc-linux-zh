    be different each time you log in), you''re all set. But if you must connect to
    a specific (static, or fixed) IP address, you''ll need to remove the nodefault
    option from the ppp command line, and change the REMOTE_IP string to the IP address
    provided by your ISP (you can do this in the ppp command line or further up in
    the script in the REMOTE_IP variable).


