  md: 'The first step in creating a new user is to use the adduser command, found
    under the /usr/sbin directory. You must be the root operator to run this program:


    ```

    # adduser

    root may may add users to the system.

    ```


    The adduser program also requires you to specify a user name on the command line,
    for

    example:


    ```

    # adduser cloobie

    ```


    Looking for first available UID... 502

    Looking for first available GID... 502


    ```

    Adding login: cloobie...done.

    Creating home directory: /home/cloobie...done.

    Creating mailbox: /var/spool/mail/cloobie...done.

    ```


    Don''t forget to set the password.


    The command will create an account, assign a user identification (UID), a group
    identifica-tion (GID), and then create a directory called cloobie under the /home
    directory. As a reminder, the adduser program tells you to set a password for
    your new user.


    # Changing Passwords in /etc/passwd with the passwd

