    # Spell Checking Your Documents


    Misspelled words in your documents can be embarrassing, especially if other people
    read your text. Correct spelling is an important part of writing and word processing.
    Just as errors in syntax can cause programming errors, spelling errors can cause
    problems in miscommunication, and loss of a potential job, customer, or the respect
    of a supervisor.


    Fortunately, your Linux distribution comes with the ispell spelling checker, so
    you won''t have to suffer the embarrassment of misspelling! This section shows
    you how to correct documents and fix your spelling errors.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Correcting Documents with the ispell Command


    The ispell command, found under the /usr/bin directory, is an interactive spelling
    program you can use alone or with your text editor to correct mistakes. Several
    editors included with your Linux distribution, such as emacs and pico, are set
    up to automatically use this program for spell checking, but using ispell by itself
    is easy. For example, to check the spelling of your myfile.txt, use


    ```

    # ispell myfile.txt

    ```


    The ispell program loads the text, and then displays the first found error in
    context, along with a single or several suggested replacements:


    ```

    MERCHANTIBILITY

    File: LICENSE

    ```


    WARRANTIES, INCLUDING, WITHOUT LIMITATION, THE IMPLIED WARRANTIES OF MERCHANTIBILITY
    AND FITNESS FOR A PARTICULAR PURPOSE,


    ```

    0: MERCHANTIBILITY

    ```


    [SP] <number> R)epl A)ccept I)nsert L)ookup U)ncap Q)uit e or for help Correct
    the spelling by typing 0, number of the suggested replacement word, or R, to replace
    the word by retyping it. Look up words with L, the lookup command, which searches
    the system dictionary, called words, located under the /usr/dict directory. If
    you use the I, or insert command, ispell creates a personal dictionary in your
    home directory, using .ispell_english as a filename.


    You can also specify multiple documents on the ispell command line:


    ```

    # ispell *.txt

    ```


    This line causes ispell to load each file ending in .txt for spell checking. If
    you''d prefer to use ispell as the more traditional UNIX spell command, which
    reads a document then prints out a list of suspected words, -1, or list option,
    on the command line:


    ```

    # ispell -1 < LISTENCE

    ```


    +   Julianian

    Haugh

    nuet

    uu

    MERCHANTIBILITY


    Note that the < redirection operator has been used because in the -1 mode, the
    ispell acts as a spelling filter, checking the input stream against its dictionary
    (located under the /usr/lib/ispell directory). You can-redirect this list to a
    file, or use ispell''s -f command-option:


    ```

    # ispell -1 f errors -a <SILENCE

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_247_0.png)'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Text Processing


    This sends all misspelled words to the -l file called errors. The ispell program
    has 15 different command-line options. Use the -t option to change the amount
    of context, or text displayed before and after a suspected error. The -b option
    creates a backup file of your original document, which is a good idea if you make
    a mistake and enter a wrong correction (this is the default for your version of
    ispell).


    The ispell package includes nine other programs you can use to build your own
    dictionaries, or add lists of words from your personal dictionary into ispell''s
    dictionaries. For details about building your dictionaries, read the ispell manual
    page or use the ispell manual under the /usr/man/man4 directory. You can do this
    with the following command:


    ```

    # man 4 ispell

    ```


    Documentation for ispell is in its two manual pages and under the /usr/doc directory.


    # Single Word Lookup and Other Tricks


    When you need is quick confirmation of the spelling of a single word, you don''t
    have to run your word processor or text editor to get the answer, because you
    can use the look command, found under the /usr/bin/directory.


    Although the look command is normally used to search files and print all lines
    matching a given string pattern, the look command quickly looks up a word in the
    system dictionary. If you don''t specify a file to search on the look command
    line, look automatically searches the system dictionary, called words, which is
    located in the /usr/dict directory. See the following example:


    ```

    # look consci

    conscience

    consciences

    conscientious

    conscientiously

    conscious

    consciously

    consciousness

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_248_0.png)


    The system dictionary, words, is a symbolic link to the file called linux.words,
    also located in the /usr/dict directory. This dictionary, a 400,000-character,
    plain ASCII list of sorted words, contains 45,402 words. You can find an even
    larger dictionary, called web2, which is more than two megabytes, and contains
    more than 100,000 words, searching your favorite Linux Internet sites (try sunite.unc.edu).


    Just A Minute


    ![](img/91f0fe61bd3027cda34d2f54533df676_248_1.png)


    All you have to do is type several characters of the beginning of a word and the
    look command prints any matches found in the system dictionary. You also can use
    the ispell command'''
  merge: -1
