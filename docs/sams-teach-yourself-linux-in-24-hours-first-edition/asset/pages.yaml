    This script moves unwanted files to a directory called .trash in your home directory.
    When you''re sure you want to delete the files, you can then verify the files
    and empty the trash. Because this script is supposed to act like a regular command,
    a short built-in help command has been included.


    > CAUTION If you want to try the rmv script, make sure you do it correctly, or
    change the line containing "rm -fr $HOME/.trash/*" ; to "rm -i $HOME/.trash/*"
    which is much safer than an unconditional delete. If you don''t type this line
    correctly, you could delete your entire home directory!


    The script works by first creating a .trash directory in your home directory (found
    with the $HOME environment variable). If the directory exists, any error messages
    generated by the command are discarded by sending the standard error output to
    the /dev/null device (a handy place to send all complaints!). Four internal script
    variables are then defined: cmdlnopts, delete, empty, and list.


