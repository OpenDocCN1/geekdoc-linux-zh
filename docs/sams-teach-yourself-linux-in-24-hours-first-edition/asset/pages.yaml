    \ job by referring by its job number, the program was brought back to the foreground\
    \ by using the fg % command with the name of the suspended job.\n\nYou can also\
    \ stop programs using this same approach. Instead of using the ps command to find\
    \ a program's process number, issuing a kill1 command, you can use the kill with\
    \ the % operator:\n\n```\n[1] Stopped (signal) pine\n# kill %emacs-nox\n[3]+ Stopped\
    \ emacs-nox\n```\n\nHere you see how to use the kill command to stop a program\
    \ by its number or name. This is much easier than using the ps command, especially\
    \ if there are a large number of programs or other processes running in the background.\n\
    \nUsing your job control facilities is a powerful way to work efficiently with\
    \ multiple programs. All of the shells included on your CD-ROM include job control\
    \ in one form or another. In the next section, you will be shown another powerful\
    \ way to use your shell to run multiple programs on a single command line.\n\n\
    # How to Use Pipes\n\nYou've already seen how to redirect the output of a program\
    \ into a file, and how to redirect the contents of that file into another program.\
    \ You can do this all over, without the use of a temporary file, by using the\
    \ | or vertical bar character, called a pipe. Using pipes to string commands together\
    \ on the command line is a quick and powerful way to enhance the power of individual\
    \ commands, and represents a unique strength of Linux and other versions of UNIX.\n\
    \nYou'll definitely use pipe commands as you begin to learn how to use Linux.\
    \ Not only do pipes save you time, but you'll use different combinations of piped\
    \ commands to tackle\n\n![](img/91f0fe61bd3027cda34d2f54533df676_117_0.png)"
