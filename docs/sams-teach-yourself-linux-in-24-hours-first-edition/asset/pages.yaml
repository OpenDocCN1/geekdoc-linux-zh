  md: '# Personal Productivity Tools


    If you''re using X11, you''ll automatically run the X11 version of emacs unless
    you specify the emacs-nox version on the command line to run emacs in your terminal
    window, for example:


    ```

    # emacs-nox

    ```


    After you start the X11 version of emacs, you can view a calendar of the previous,
    current, and next month through the Display Calendar item on the Tools menu. You
    can also use the non-X11 emacs command, ESC-x-calendar. Press the Esc key, type
    an x, then enter the calendar, and press the Enter.


    Figure 18.3 shows the editors.


    # Figure 18.3.

    The emacs has a built-in calendar with an assortment of calendar tools, including
    a diary and appointment reminder.


    ![](img/91f0fe61bd3027cda34d2f54533df676_300_0.png)


    You can get help on using emacs calendar tools by typing the question mark after
    clicking the calendar window. A help menu of calendar items will appear. You''ll
    also notice that when you click in the calendar window, the emacs bar will change,
    and offer you a Goto, Holidays, Diary, and Moon menu. You can use the Goto menu
    to advance the calendar forwards or backwards, or jump to nearly 20 types of calendars,
    such as Julian, and even Mayan!


    The Holidays menu will list all the holidays for a range of days or months displayed
    by the calendar listing at the bottom of the screen, or will mark the holidays
    by highlighting days of the calendar listing. The Moon menu will list the different
    phases of the moon.'
