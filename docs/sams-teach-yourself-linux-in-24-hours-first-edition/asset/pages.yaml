    These values tell the xpaint client to draw a vertical toolbox. If you''d like
    a horizontal toolbox instead, you can resize the toolbox, note the dimensions
    shown by the window manager during the resize operation, and use the new settings
    to change the initial size of the toolbox in its default resource settings file,
    for example:


    +   * The top level operation/toolbox operation

    * Xpaint.width: 782

    * Xpaint.height: 122


    For details about X resources, the X man page. For details about different client
