  md: '# # Converting and Viewing Graphics


    There are a number of ways to convert graphics files to different formats using
    the programs you''ll installed on your system. A number of painting or drawing
    programs discussed in this hour translate graphics. Many programs in Table 16.1
    also work as filters in piped commands (see Hour 6, "Using the Shell," for details)
    to translate graphics.


    You can use different combinations of these to convert files. The resulting files,
    which may display and print the same, usually aren''t the same file size, so a
    side benefit of converting graphics may be to save disk space. Look at the following
    example:


    The first command uses the xwd to create an X11 window dump graphic (after you
    select a window and press your left mouse button). Then the window dump is converted
    to a portable anyformat, and this stream is fed into the pnmotiff to create a.tiff
    graphic. As you can see, the .tiff file format is nearly 16 times smaller than
    the X11 window dump graphic.


    There are also many programs not listed in Table 16.1 that can be used to alter
    graphics images. For example, the pnmotate, pnmscale commands, smooth, and resize
    graphics. You can use a variety of these programs to not only convert graphics,
    but also change their appearance or orientation.


    If you''re using programs to convert a graphic, you can also change the image
    on fly by applying these filter programs. The previous example, now has a filter
    inserted during the conversion:


    Here a window dump is created, and then, using the pnmflip program, it is turned
    upside down and backwards before creating the .tiff version. Combinations of different
    filters achieve different effects.


    ![](img/91f0fe61bd3027cda34d2f54533df676_269_0.png)'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Graphics Tools


    ![](img/91f0fe61bd3027cda34d2f54533df676_270_0.png)


    Not all graphics conversion programs included with your Linux distribution read
    the standard input and write to the standard output. Read the manual pages for
    any desired conversion programs before experimenting with pipes on the command
    line. Also, be cautious: preview or print the results of your conversions before
    discarding original files to make sure you achieve the effect you want, and the
    resulting graphic does not suffer loss of image quality.


    If you don''t want to experiment with complex pipes, you may want to try using
    the convert command, one of seven programs in the ImageMagick package (discussed
    later in the section, "Graphics Editing with ImageMagick") Using the convert command
    is an alternative way to translate files. Found under the /usr/bin directory,
    this command translates more than 75 different graphics file formats (one not
    listed in Table 16.1). The convert program works by recognizing different file
    extensions on the command line, as shown in the following example.


    ```

    # xwd graphic.xwd

    # convert graphic.xwd

    ```


    Again the xwd client is used to create an X11 window dump graphic. The convert
    command is made to create a .tiff by specifying the .tif extension on the second,
    or output file on the command line. For details about using the convert command,
    see the ImageMagick and convert command pages.


    # Graphic Editing with GIMP


    Although you can change or manipulate graphics under the command line, if it can
    be a lot more fun to interactively work with files using an image processing program.
    One of the best and newest graphics tools for Linux is GIMP, the GNU Image Manipulation
    Program by Spencer Kimball and Peter Mathis (see Figure 16.1).


    This is a capable and complex program with many features. If you''ve worked with
    image editing programs on other operating systems, you''ll appreciate the tools
    and filters included with this program. The GIMP features


    +   - 9 program operation menus

    - 21 different editing tools

    - 109 different plug-ins and tools to create image effects or perform operations

    - Multiple image windows, handy for cutting and pasting or multiple views of a
    file'
  merge: -1
  pgno: 270
- img_proc: true
  md: '+   Multiple layers for each image, so that effects may be superimposed


    +   Six floating windows and dialog boxes for selecting tools, brushes, colors,
    or patterns


    +   Multiple undo levels, handy if you make mistakes!


    +   Import and export of 24 different graphics formats


    # Figure 16.1

    The GIMP image editor is an impressive X11 client with many professional features,
    including nearly 100 different filters for manipulating graphics.


    ![](img/91f0fe61bd3027cda34d2f54533df676_271_0.png)


    You''ll need nearly 23 megabytes of hard drive space to install GIMP, its software
    libraries, support files, and directories. The main GIMP files are installed under
    the /usr/share/gimp/X.XX directory, where X.XX is the current version. A library
    of GIMP plug-ins is located under the /usr/lib/gimp/X.XX/plug- directory, where
    X.XX is the current version. Plug-ins are compiled modules, or programs run by
    GIMP from different menus.


    This program has 11 different command-line options, but does not support X11 Toolkit
    options such as geometry settings. You can specify a graphic file on the command
    line. GIMP attempts to load and interpret the file according to the file''s extension.
    Starting GIMP is easy; simply type the following.


    ```

    # gimp &

    ```


    When you first start GIMP, you''ll be presented with a large window that provides
    details about various GIMP resource files. You''ll be asked to confirm installation
    of a directory called .gimp in your home directory. This directory contains seven
    different files and subdirectories that specify how GIMP works, and lists your
    preferences for tools, brushes, and plugins.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'The file gimpre under your .gimp directory settings, such as default brushes,
    patterns, palettes, and temporary directories you can customize. You also can
    specify the type of measurement to be used in your rulers, such as pixels, inches,
    or centimeters, and whether not GIMP performs auto-saving of your image files
    as you work.


    ![](img/91f0fe61bd3027cda34d2f54533df676_272_0.png)


    > The version of GIMP installed on your system lacks documentation, but you should
    know that if you edit large files, you may quickly run out of disk space because
    GIMP creates large temporary files during editing sessions (typically require
    swap storage three times larger than system memory). If you have a separate drive
    with a lot of room, change the swap-path (not the same as your Linux swap partition!)
    setting in the gimpr file to point to that drive. If you''re really right on memory
    and hard drive space, you can uncomment the stingy memory-option. On the other
    hand, if you have a lot of system memory, change the tile-cache size to force
    GIMP to use less swap space [and faster].


    ![](img/91f0fe61bd3027cda34d2f54533df676_272_1.png)


    Once GIMP is running, you can tear off different dialog boxes and windows by using
    the dialog menu item under the GIMP File. If you have an active image window,
    access the complete GIMP menu by pressing your right mouse button while the cursor
    is over your image. Your windows will cascade, and you can select the file, edit,
    or other menu operations by dragging your cursor through the menus.


    GIMP does not come with a manual page, but you''ll find some documentation under
    the /usr/doc/gimp directory. For the latest news and details about this program,
    browse to the following site:


    ```

    http://www.gimp.org

    ```


    You''ll find copies of the latest GIMP and links to GIMP Frequently Asked Questions
    lists, a GIMP tutorial, and new-plugins.


    # Graphics Editing with ImageMagick


    The ImageMagick package, by John Christy, is a collection of seven programs you''ll
    find installed on your system. Some of commands require the X Window System, while
    others may be used from the command line. The convert command has already been
    discussed in this hour, but you may find some of the other utilities useful when
    you want to manipulate graphics:


    +   - animate Displays a series of graphics; requires X11


    +   - combine Combine, overlay multiple images into a single'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 252


    # Hour 16


    +   - convert Convert or changes graphic files

    - display Display program with menus for manipulating images; requires X11

    - import Window capture utility; requires X11

    - mogify Convert or change, then overwrite multiple graphic files

    - montage combines several graphics into a larger graphic


    You''ll really like ImageMagick''s display command, which has more than 75 features
    and effects that you can use to edit or change graphic images. One interesting
    feature is the ability to load images into a visual directory so you can see thumbnails
    of all images in a directory. Using the display command is easy, but you must
    be running the X Window System. From a terminal command line, type the following:


    ```

    # display &

    ```


    This program starts. To see a visual directory of your graphics, type the:


    ```

    # display vid:*.gif &

    ```


    This command loads all .gif graphics in the current directory. Once the program
    starts, access its menus by pressing the left mouse button when your cursor is
    over the images window. The display command imports and exports 58 graphics formats.
    The program features built-in help, and also can create slide shows of graphics
    (see Figure 16.2).


    # Figure 16.2


    The display X11 client, included with the ImageMagick software package, can be
    used to make changes to many types of graphics.


    ![](img/91f0fe61bd3027cda34d2f54533df676_273_0.png)


    # 16'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'For more information about ImageMagick, see its manual page, and the manual
    pages for the other programs in the distribution. Comprehensive hypertext documentation
    is under the /usr/doc/ImageMagick directory.


    # Using the xv Command to View Graphics


    The xv command is a handy previewer used to review, crop, scale, edit, or convert
    graphics. This command offers many sophisticated sizing and color controls, and
    you can also use xv, found under the /usr/X11/bin/ directory, to capture windows
    of your X11 session without run X11 in order to use the xv command.


    The xv command loads a single file or series of graphics if you specify the files
    on the command line:


    +   # *.jpg


    This command line all files ending in .jpg in the current directory. After the
    files are loaded, scroll through a list of files to make your changes, or use
    a graphic directory to your files (See 16.3).


    # Figure 16.3


    The xv command is an X11 client that loads, edits, captures, saves, or prints
    images and features sophisticated color controls.


    ![](img/91f0fe61bd3027cda34d2f54533df676_274_0.png)


    The xv command can import and export 18 different graphics file formats, and also
    prints graphics. For more information about using xv, see its manual page, or
    define the documentation (128 pages in PostScript format, as nearly many as the
    xv command''s 107 command-line options!) found under the /usr/doc/xv directory.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Using the gv Command to View PostScript Files


    The gv command is a PostScript viewer used to examine or read PostScript graphics
    or documents before printing. You must run the X Window System to use this program.
    The gv command, found under the /usr/X11R/bin directory, is a much-improved viewer
    by Johannes Plass, and is based on the previous ghostscript program by Tim Theisson
    (you''ll find a symbolic link under /usr/X11R/bin called ghostview, which points
    to gv).


    The gv command has more than 36 different command-line-options, and uses a number
    of X11 Toolkit options, such as geometry settings. You can start gv by itself,
    or with a file on the command line, with its options:


    ```

    # gv -geometry 640x480 myfile.ps

    ```


    This command line starts the gv command in a 640 by 480 pixel window with the
    file myfile.ps displayed. Another great feature of the gv command is that it reads
    portable document format, .or, .pdf files (see Figure 16.4). This is a way to
    read .pdf documents without installing an additional .pdf reader, such as Adobe
    Acrobat.


    ![](img/91f0fe61bd3027cda34d2f54533df676_275_0.png)


