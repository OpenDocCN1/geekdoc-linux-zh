    # Playing Linux Games


    It''s time to sit back, relax, and have some fun. Chances are that you''ve skipped
    the rest of the book and are reading this chapter first. Well, that''s okay, because
    we all know the real reason we bought our computers, right? To zap hordes of alien
    invaders streaming across our screen!


    In this hour you''ll learn about two music CD players and some of the more than
    70 games you can install on your system. This hour starts with an overview of
    the CD players, then moves on to information about playing games at the console
    and with the X Window System.'
