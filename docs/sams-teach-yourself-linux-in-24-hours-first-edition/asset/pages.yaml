    ```

    crw-rw---- 1 root uucp    5,65 Dec 31 1979 23:48 /dev/cua

    brw-rw---- 1 root disk      2,0 Sep 15 23:48 /dev/fd0

    crw-rw---- 1 root daemon  6,0 Sep 15 23:48 /dev/lp0

    ```


    As you can see, the different devices have either c or b in front of the permissions
    flags. You can also use the ls command to list the permissions of a directory,
    using the -d (directory) option, for example:


    ```

    # ls -id book

    drwx-xr-x 2 bball  bball 1024 Nov 18 19:35

    ```


    The denotes will also have a designated type in the ls listing, for example:


    ```

    # touch file1

    # ln -s file1 file2

    # ls -l file2

    lrwx-rw-rw 1 bball  bball 5 Nov 23 11:14 -> file1

    ```


    Now that you understand the basic use of the file types, the next section shows
    how to read the permissions flags.


    # Reading Permission Flags


    Although the permissions sequence of letters may seem cryptic and mysterious at
    first, you can easily decipher what these mean. To do this, break the sequence
    of nine characters into three groups of three. Each group of characters represents
    (from left to right):


    +   r—The file can be read.

    w—The file can be written to.

    x—The file can be executed, or run, or in the case of a directory, searched.


    The first group of three characters is for the owner. If you create the file,
    you can change any of these permissions. The next group of three characters is
    for group. If you recall the discussion of /etc/passwd file in Hour 20, you know
    that by default, you are assigned to two groups when your account is created,
    one with you and the other to the group users. As the system administrator, or
    sysadmin, you can organize users on your system by assigning different groups.


    You''ll find a list of groups for your Linux system in the group file under the
    /etc directory. This file contains a database of groups. Here are a few sample
    entries:


    ```

    root::0:root,daemon

    bin::1:root,bin,daemon

    daemon::2:root,bin,daemon

    sys::3:root,adm

    am::4:root,adm,daemon

    ...

    users::100:bball,clobbie

    bball::500:bball

    clobbie::502:clobbie

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_344_0.png)'
