  md: "# Creating Directories with the mkdir Command\n\nThe mkdir command can create\
    \ one or several directories with a single command line. You may also be surprised\
    \ to know that mkdir can also create a whole hierarchy of directories, which includes\
    \ parent and children, with a single command line.\n\nThis command is one of the\
    \ basic tools (along with cp and mv) you'll use to organize your information.\
    \ Now, take a look at some examples. The following simple command line creates\
    \ a single directory:\n\n```\n# mkdir temp\n```\n\nBut you can also create multiple\
    \ directories with\n\n```\n# mkdir temp2 temp3 temp4\n```\n\nYou'd think that\
    \ you could also create the following to make a directory named temp/child under\
    \ temp:\n\n```\n# mkdir temp/child\n```\n\nAnd you can, because the temp directory\
    \ exists (you just created it). But, suppose you type mkdir: cannot make directory\
    \ 'temp5/child': No such file or directory\n\n```\n# mkdir temp5/child\n```\n\n\
    As you can see, mkdir complained the temp5 directory did not exist. To build a\
    \ hierarchy of directories with mkdir, you must use the -p, or parent option,\
    \ for example:\n\n```\n# mkdir -p temp5/parent/child\n# tree temp5\ntemp5\n  parent\n\
    \    -- child\n```\n\n2 directories, 0 files\n\nAs you can see, mkdir created\
    \ not only the temp5 directory, but also a subdirectory called parent, and a subdirectory\
    \ under parent called child.\n\nNow that you know how to create directories, take\
    \ a look at how to remove them.\n\n# Removing Directories with the rdir Command\n\
    \nThe rdir command is used to remove directories. To remove a directory, all you\
    \ have to do is type\n\n```\n# rdir tempdirectory\n```\n\n![](img/91f0fe61bd3027cda34d2f54533df676_87_0.png)"
