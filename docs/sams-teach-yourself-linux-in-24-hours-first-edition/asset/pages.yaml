  md: '# Handling Files


    How does this work? Well, suppose you want to make one of your files private,
    so that no one else (the root operator, of course) can read or write your file.
    When you first create the file, you and your group can read and write the file,
    while others can only read it. Knowing that 4-2-1 matches rwx, and knowing that
    the group and others permissions follow your permissions in the permissions flag,
    you can chmod with the octal number 600 to change the permissions, for example:


    ```

    # touch file

    # -1 afile

    -rw-rw-r-- 1 bball bball

    # chmod 600 Nov 23 13:34 afile

    # -1 afile

    -rw-rw-r-- 1 bball bball Nov 23 13:34 afile

    ```


    This makes the file readable and writable only by you, because you''ve enabled
    (4) + write (2) for yourself and no one else. To change the file back to the original
    access permissions, you would want to enable read (4) + write (2) for you (6),
    your group (6), and read-only permissions for all others (4), and use the octal
    number 664, for example:


    ```

    # chmod 664 afile

    # -1 afile

    -rw-rw-r-- 1 bball bball Nov 23 13:34 afile

    ```


    You can also change directory permissions, and let other people list the contents
    of your directory, or have access only to the files in a directory, and not be
    able to list the directory contents. For example, to protect a directory from
    prying eyes (again, from everyone the root operator), you can try


    ```

    # mkdir temp

    # cd

    # touch file1 file2 file3

    # cd

    # chmod 700 temp

    # -1 -d temp

    drw-xr-x 2 bball bball 1024 Nov 23 12:51 time

    ```


    If anyone else tries to look into your directory, they will see


    ```

    # ls /home/bball/temp

    ls: /home/bball/temp: Permission denied

    ```


    But what if you want to allow others to read files in the directory without being
    able to list the contents? To do this, you can execute permission of your directory,
    for example:


    ```

    # chmod 701 temp

    # -1 -d temp

    drw-xr-x 2 bball bball 1024 Nov 23 12:51 time

    ```


    Now, other users will be able to list the contents of your directory, but can
    read files that you tell them within, for example:


    ```

    # ls -d /home/bball/temp

    ls: /home/bball/temp: Permission denied

    # ls -1 /home/bball/temp/file1

    -rw-rw-r-- 1 temp * * Nov 23 15:11 /home/bball/temp/file1

    ```'
