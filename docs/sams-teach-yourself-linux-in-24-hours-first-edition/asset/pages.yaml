    Hour 1.


    # Setting the Time Zone


    You are asked to set your system''s time zone and what your BIOS clock is set
    to. The first toggle area, in Figure 2.11, asks if your computer''s BIOS clock
    is set to GMT. Using the BIOS clock enables Red Hat Linux to deal with daylight
    savings changes, but can have the effect of turning other OS''s clocks off.


    Figure 2.11.


    If you''re not sure what time zone you are in, might check out your phone book.


    ![](img/91f0fe61bd3027cda34d2f54533df676_46_1.png)


