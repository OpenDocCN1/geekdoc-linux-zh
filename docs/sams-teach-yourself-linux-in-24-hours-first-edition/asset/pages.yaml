  md: '# Figure 14.2. version of the X11 editor gvim, features split scrollable windows,
    along with menus you can customize.


    ![](img/91f0fe61bd3027cda34d2f54533df676_239_0.png)


    Most of the documentation for vim is contained in its built-help, and there are
    22 text files containing extensive instructions in the /usr/share/vim directory.


    # Features of Pine’s pico editor


    The pico editor, included with the University of Washington’s pine electronic
    mail program, is a compact, efficient, and easy-to-use editor usually used to
    compose or reply to e-mail messages. It is a nifty replacement for all your editing
    needs, and is easily handled if you need a reliable editor, but don''t have a
    lot of hard drive space (for example, a laptop).


    Despite its relatively small size, the pico editor has most of the features you''d
    expect in a word processor, including


    +   * Word wrap

    * Built-in help

    * Word search

    * Paragraph justification

    * Text block mode, copy, and delete

    * Mouse support

    * Spell checking


    The pico editor has 16 different command-line options and rudimentary crash protection
    (see Figure 14.3). It attempts to save any work in progress before exiting, saving
    your file with a name ending in .save, or if unsaved, in a file named pico.save.'
