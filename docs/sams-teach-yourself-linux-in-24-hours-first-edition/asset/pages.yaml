- img_proc: true
  md: '# X11 Window Managers


    One of the great things about X11 is that you have freedom of choice in how you
    would like to manage your windows and programs on your screen. This screen management
    is through a window manager. One of the bad things about X11 is that you have
    a confusing choice of window managers, and you might be initially overwhelmed
    by the array of configuration files, scripts, resource settings.


    This section covers the window managers included on your CD-ROM. In Hour 8, "Exploring
    Other X11 Window Managers," I''ll introduce you to other new and exciting window
    managers you might want to try.


    You can customize nearly every aspect of how your windows look.


    # Configuring the fwm2 Window Manager


    The fwm2 window manager, by Robert Nation, builds on window manager improvements
    by the fvm2 window manager (discussed later). The window manager is set up to
    provide an appearance similar to that of other operating systems (see Figure 7.1)
    with a taskbar, hierarchical menu, graphic icons, and three-dimensional window
    buttons and scrollbar. You can construct custom start menus, or menus for the
    root window, which are accessed by pressing the left mouse button on an empty
    space on the desktop. You can also build a custom icon taskbar to run programs
    at the click of a button, and add modules that add even more point-and-click functions
    (see the fwm2 manager page for a list of the modules and their pages).


    You''ll find the fwm2 window manager''s configuration file, system.fwm2rc, in
    the /etc/X11/fwm2 directory. You''ll also find a symbolic link to the file, named
    system.fwm2rc, in the /usr/X11rb/lib/X11/fwm2 directory. If you''re the root operator,
    you can customize this custom fwm2 features, copy the system.fwm2rc, and save
    it in your home directory.


    The main components of this file allow you to customize the following:


    +   - Fonts for windows, icons, and menus

    - Window colors (background and foreground)

    - Operating modes (click in a window to activate it, or just move the cursor over
    it, and so on)


    > Note that many clients, such as text editors, graphics programs, and even other
    X11 Window managers, are discussed throughout this book.


