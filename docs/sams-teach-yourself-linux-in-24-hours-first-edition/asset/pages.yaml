    # Using the Simplest Window Manager, wm2


    If you don''t want to fill your hard drive with countless configuration files
    or complex X11 desktop settings, but still to use X11 and a window manager, use
    Chris Cannam''s wm2 window manager. This window manager has the bare minimum of
    features you''ll need in a window manager. Its best feature is the list of features
    it doesn''t have:


    +   - desktop icons

    - no pager, or virtual desktops

    - no root menus

    - no complicated configuration files


    Unlike other window managers discussed in this hour, wm2 makes this window manager
    an ideal candidate for installation on Linux X11 laptops, especially where hard
    drive space is a premium. Because there are no configuration files, customizing
    must be done when you build the program (see Figure 8.6).


    Compiling and installing this window manager is a snap, with the exception of
    one minor glitch (you''ll read about it in a minute). Download the source, wm2-4.tar.gz,
    then uncompress and dearchive the file:


    ```

