  md: '# Standard Version of Nano-Warrior(TM) without restriction, provided that you
    duplicate all of the original copyright notices and associated disclaimers.


    The sed s, or substitute command, is used to search for all instances of the first
    string, and to replace each instance with the second because of the g, or global,
    command. The original file is not changed, and you can save a new version by redirecting
    the output.


    The sed command is designed to work using editing scripts. To make numerous, regular
    changes to files, create an editing script and use your script to edit files.
    The sed command''s -f, or script file command-line option to use the script:


    ```

    # sed -f myscript.sed < form.ltr >output.ltr

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_245_0.png)


    There are many text filters included with your Linux distribution to discuss in
    this hour; see the manual pages for the filter commands listed near the beginning
    of this section. You may also want to experiment with the wc, or word count, program,
    which reports the number of characters, and lines in your text documents.


    JUST A MINUTE


    # Applix Words


    There are many other Linux word processing programs besides the text editors installed
