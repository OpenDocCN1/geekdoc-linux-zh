    # Managing File Ownership and Permissions


    Managing files in Linux means more than moving files around the file system or
    keeping

    files grouped by similar behavior or topic. You can change which user or group
    owns a file

    or directory, and whether or not you, your group, or others can read, write, execute
    (run)

    your files.\ chmod (change access permissions) command, found under the /bin directory,
    is used to

    give or take away permission of groups or others to your files. Before you can
    begin to use

    t chmod command, you should understand Linux files and how Linux handles file
    permis-

    sions. In Hour 4, "Reading and Navigation Commands," you learned how to get a
    long-

    format directory listing using the -1 option with the ls (list) command. This
    option shows

    the mode and permissions flags of files, for example:


    ```

    # ls -1 book*/*doc

    -rw-r--r-- 1 bball bball 78073 Nov 16 19:58 book/24hr06.doc

    -rw-r--r-- 1 bball bball 52287 Nov 16 19:57 book/24hr11.doc

    ```


    The mode and permissions flags for directories and files is listed in the first
    column, and

    consists of a sequence of 10 letters. The first letter tells you the type of file.


    # Understanding Linux File Types


    There are at least eight file types in Linux, but these are the four most common
    ones:


    +   - b—Block device

    - c—Character device

    - d—Directory

    - 1—Symbolic link


    You''ll usually find block and character devices under the /dev directory. Your
    modem or

    printer port on your PC will probably be a character device, whereas your floppy
    drive is

    block device, for example:


    ```

    # ls -1 /dev/lp0 /dev/cua1 /dev/fd0

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_343_0.png)'
