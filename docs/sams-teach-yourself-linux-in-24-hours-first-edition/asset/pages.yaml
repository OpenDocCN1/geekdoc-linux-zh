  md: '# Hardware Considerations


    Now that you''ve completed the inventory of your system, it''s time to put the
    list to good use. The first thing you should do is compare the hardware in your
    inventory with a list of the hardware that Linux supports. Table 1.1 contains
    a short list of supported items. A more comprehensive list is available on the
    Web at the following site:


    http://www.redhat.com/support/docs/rhel/intel/rh50-hardware-intel.html


    # Table 1.1. A short list of Linux-compatible hardware.


    | Device | Compatibility |

    | --- | --- |

    | CD-ROM Drive | IDE ATAPI-compliant drives, and SCSI CD-ROMs on supported controllers.
    |

    | Hard Drive | Virtually all IDE, EIDE, and SCSI drives are supported. Some newer
    Ultra DMA drives may not work because they aren''t backwards with the EIDE standard.
    |

    | SCSI Controller | Most of the controllers from manufacturers such as BusLogic
    and Adaptec are supported. |

    | Video Card | Many cards from ATI, Cirrus, and Matrox are supported, as are most
    cards built around the S3 chipset. |


    If some of your hardware isn''t supported, then you have the following alternatives:


    +   - Change the hardware with items that are supported.

    - Check back later to see if support for the hardware is available.


    It''s a good idea to avoid any hardware that''s labeled as Plug and Play. While
    Linux is starting to support plug-and-play hardware, it''s currently not a simple
    task to set up. It would also be prudent to avoid any hardware that''s listed
    as a Win-item (like a Winmodem or a Winprinter). These items currently work only
    with a Microsoft Windows operating system.


