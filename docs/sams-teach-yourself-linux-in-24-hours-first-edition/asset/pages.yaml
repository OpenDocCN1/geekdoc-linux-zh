  md: '# Reading and Navigation Commands


    you''ll see


    ```

    /usr/bin

    ```


    Although there''s a man page for the pwd command, chances are that when you use
    pwd, you''re using a pwd built into your shell. How do you tell? If you try calling
    pwd with the following command, you should see only the current working directory
    printed:


    ```

    # pwd --help

    ```


    Instead, try calling pwd


    ```

    # /bin/pwd --help

    ```


    You''ll see a short help file for the pwd command, and not the current directory.


    # Searching Directories for Matching Files with the find Command


    The find command is a powerful utility you use to find files on your hard drive.
    You can search your hard drive for files easily with a simple find command line.
    For example, to search for the spell command under the /usr directory, you would
    use


    ```

    # /usr -name spell -print

    ```


    You can use the find command to find files by date; you can also specify a range
    of times. For example, to find programs in the /usr/bin directory that you have
    not used in the last hundred days, you can use


    ```

    # /usr/bin -type f -atime +100 -print

    ```


    To find files, either new or modified, or that are few days old in the /usr/bin
    directory, you can use


    ```

    # /usr/bin -type f -mtime -1 -print

    ```


    The find command will also accept wildcards, which you''ll learn about Hour 5,
    "Manipulation and Searching Commands." As a simple example, you can use find to
    show all the PostScript files (which you''ll learn about in "Understanding Graphics
    Formats") in Hour 16, "Graphics Tools") in your /usr directory with


    ```

    # /usr -name ''*.ps'' -print

    ```


    You should also know about one of the find command''s handy options,-dev. If you
    want to start searching at the root or directory? Without using -dev, which limits
    search to the filesystem (in this case, Linux), find will merr continue its search
    through any mounted CD-ROMs, or your DOS or Windows partition, possibly finding
    files you''re not interested in, slowing down the search, and cluttering up the
    screen.


