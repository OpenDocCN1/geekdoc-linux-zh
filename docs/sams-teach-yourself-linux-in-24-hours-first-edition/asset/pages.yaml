    +   # man 7 man


    The groff formatting program also comes with other sets of typesetting macros,
    such as the mm, mm, or ms macros used to format text files. You''ll generally
    need to specify the macro set on the groff command line if you use these commands:


    +   # groff -Tascii -mm myfile.txt


    Documentation for several of these macros are in various groff-related manual
    pages. One of the best documented sets included with your Linux distribution is
    the mm manuscript macros in the groff_mm manual page. Table 15.1 lists some common
    macros you can use to produce formatted documents.


    # ### Table 15.1. Common groff_mm macros.


    | Action | Macro Name |

