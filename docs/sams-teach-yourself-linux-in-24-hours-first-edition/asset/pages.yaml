  md: '# 280


    # Hour 18


    ![](img/91f0fe61bd3027cda34d2f54533df676_301_0.png)


    More than 100 different calendar commands are available in emacs. You should also
    know that in order to receive appointment reminders, emacs must be running. For
    more information, first try calendar''s help, and then use the apropos command
    from emacs'' Help to get more detailed information.


    You can also use emacs to remind you of important events using Neil Neiler''s
    emacs appointment commands. To set appointment reminders, you must first create
    an .emacs file in your home directory containing the following:


    ```

    (setq view-diary-entries-initially t)

    (setq apt-issue-message t)

    (display-time)

    (add-hook diary-hook ''apt-make-list)

    ```


    Use the File menu to save this file. Then create an emacs diary by starting the
    calendar mode. After you''ve enabled the emacs calendar mode, click in the calendar
    window on a specific day, go to the Diary menu, and select Insert Daily. Your
    buffer will change to "diary," and you''ll find your cursor text containing the
    selected date. Make some diary entries, then save the buffer, and restart emacs.


    After restart emacs, you can enter appointment reminders in your diary with the
    emacs apt- add command. First enter the calendar mode, and click your left mouse
    button on a specific day. Next, press and release the Esc key, type an x, then
    type apt-add, and press Enter. You''ll be asked for appointment time (hours and
    minutes). The time after you press Enter, you''ll be prompted for a message. Type
    in your reminder and press Enter again.


    Five minutes before the appointment time on the specific day, emacs will beep
    and display a new mode line, informing you of the appointment. Two minutes later,
    the same thing will happen. You can manually add reminders to your diary file,
    for example:


    +   - 8:00am Jogging with dog

    - 12:00am Lunch with Cathy

    - 3:00pm Check with car repair shop


    You can save these reminders following each date in your diary files. If you want
    to delete appointments, use the apt-delete command after selecting a specific
    day. You''ll be asked interactively to delete various appointments from your diary.


    By using the emacs calendar mode and functions, you can build a history of your
    appointments in your personal diary. Experiment with different modes, and read
    the emacs info files for more information.


