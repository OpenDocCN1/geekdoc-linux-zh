    # PCMCIA Support


    Next, the program searches for a PCMCIA chipset in your computer. If a known PCMCIA
    chipset is found then you are asked to insert the supplemental floppy. When you
    have done this, you can select Ok and the program loads additional drivers from
    the floppy. If no known PCMCIA chipset is found, the program quickly goes on to
