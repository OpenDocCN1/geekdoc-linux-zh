  md: 'The xwd program is easy to use. You''ll want to specify a file on the command
    line, because if you don''t, the file is sent to the standard output, and will
    scroll up your terminal window.


    ```

    # xwd > mydump.xwd

    ```


    After you type this command, your cursor will turn to a crosshair (+). If you
    click on the root desktop, the xwd client will dump, or capture, a picture of
    your entire screen. If you click in a window, the xwd client will capture the
    contents of the window, even if it is hidden or overlapped by another window.


    This is handy if you want to capture a series of pictures of a running client,
    show off scores of games, or create quick slideshows. The file is in an X11 window
    dump format, but you''ll find a number of clients you can use to view the image.
    One is the xwd (X11 window undump) client to see your screenshot,


    ```

    # xwd -in mydump.xwd

    ```


    You can also create a slideshow of your images with the xloadimage client, found
    under the /usr/X11R/bin directory. If you create a series of screen dumps, you
    can build a looping slideshow of the screenshots with


    ```

    # xloadimage -fit 1.xwd 2.xwd 3.xwd -goto 1.xwd

    ```


    Using this command line, you can repeatedly page through the dump files by pressing
    the N character on your keyboard, or press the Q character on your keyboard to
    quit. The xloadimage client has many features, and can also save your screen dumps
    into different graphics file formats. See the xloadimage manual page for more
    information.


    | Just A Minute | Many other graphic utilities are included on your CD-ROM. See
    Hour 16 for an overview of paint and drawing programs, graphics conversion utilities,
    and other image viewers, such as the xv client, which not only captures screenshots,
    but edits, converts, saves, and prints graphics. |


