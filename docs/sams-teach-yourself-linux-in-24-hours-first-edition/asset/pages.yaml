  md: '# Configuring Internet Mail


    # # Configuring and Using the pine Mail Program


    The pine mail program, which you''ll find under the /usr/bin directory, developed
    by the University of Washington as an interactive mail and news reader. This means
    that you can only use pine for sending or reading your mail, but you can also
    use it to read Usenet newsgroups. Usenet and different news readers are discussed
    later in this hour, but this section focuses on configuring and using pine for
    mail.


    The pine program also comes with an extremely easy-to-use editor pico, which might
    easily become your favorite Linux text editor, because it can be used with any
    other program, and not just pine. See Hour 14, "Text Processing," for more details
    about the pico editor.


    The pine program is easy to set up and use. Most of the work is done for you automatically
    when you start your program, for example:


    ```

    # pine

    Creating subdirectory ''/home/bob/mail'' where Pine will store

    it mail folders.

    ```


    The pine program starts and creates a directory called mail, along with a .pinerc
    configuration file in your home directory. Before you start composing or sending
    mail, you should configure pine to recognize your username, your ISP''s mail server,
    and as you will see later, your ISP''s news server. Although you can compose mail,
    and use pine''s postpone feature to save your composed messages, you won''t be
    able to send mail until you tell pine who you are, or by type, an c name of your
    ISP''s mail server.


    To do this, type an, then a c to get to pine''s configuration screen (see Figure
    11.1).


    Figure 11.1. Specifying the personal name, user domain, SMTP server, NNTP server
    in the pine mailer configuration screen.


