- img_proc: true
  md: 'If you don''t have a tape drive, but would like to try the taper program to
    test a backup of a directory or two to floppy diskettes, use the -T command-line
    option with the removable option:


    +   # taper -T removable


    This starts the taper program, using the default floppy device, /dev/fd0. You''ll
