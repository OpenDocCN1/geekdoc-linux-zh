  md: '# Handling Files


    The format you''ll likely be interested in is the 1440/1440 description of today''s
    3.5-inch high-density drives. Using this name, you''ll use the setfdpm (set floppy
    disk parameter) command (found under the /usr/bin directory), to associate your
    drive A: floppy with the device /dev/fd0, as follows:


    ```

    # setfdpm -p /dev/fd0 1440/1440

    ```


    After that, you can proceed with a low-level format of your drive. To do this,
    you''ll use the fdformat (floppy disk formatting) command (found under the /usr/bin
    directory). Insert a blank disk in your drive and then


    ```

    # fdformat /dev/fd0

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    ```


    Here, you''ll also use the fdformat command to do a low-level format of the /dev/fd0
    device. Be careful! Make sure to specify the correct device.


