    # Figure 14.4.


    The joe editor comes in five versions, and can emulate the keyboard commands of
    several different editors, such as pico and emacs.


    ![](img/91f0fe61bd3027cda34d2f54533df676_241_0.png)


    There is a bug in the version of joe on your CD-ROM that involves proper resizing
    of the editor in consoles or X11 windows greater than 80 characters by 25 lines
    in size. Upgrade to the newer version by obtaining and installing the joe2.8-10.i386.rpm
    file. You can get this file from Red Hat Software by browsing to the following
    site:


    http://ftp.redhat.com/pub/redhat/updates/5.0/i386/


    # Configuring the jed Editor


    The jed editor, by John E. Davis, comes in two versions: one for the console,
    and the other tailored for the X Window System (see Figure 14.5).


    jed''s man configuration files may be found under the /usr/lib/jed directory,
    and you may customize how jed runs preferences in a .jedrc file in your home directory.
    Copy the file .jedrc from the /usr/lib/jed directory to your home directory as
    .jedrc, and then edit it to your taste.


    The editor has built-in help, but you''ll find information about jed under the
    /usr/doc directory, in its manual page, and in info files the /usr/lib/jed/info
    directory.


    # Changing Text with sed and Other Filters


    Until now, this hour has discussed interactive editors featuring cursor movement,
    menus, or other keyboard commands. There are several other programs, such as text
    filters, or stream editors, included with your system that can edit text.'
