  md: '# 178


    # Hour 11


    Enter your personal name, the domain of your ISP, the name of your ISP''s mail
    server, and if you know it, the name of your ISP''s news server. Type an e, and
    pine will ask if you want to save the changes. Your configuration will be saved
    in the .profile file in your home directory. Although you can edit this in your
    favorite text editor, using pine is a lot easier.


    To compose a message, press the e key, and you will be in pine''s compose mode
    (see Figure 11.2).


    # Figure 11.2.

    Composing a mail message with file attachments to multiple recipients in the pine
    compose mode.


    ![](img/91f0fe61bd3027cda34d2f54533df676_199_0.png)


    You can specify multiple recipients to your message by typing a comma between
    names. You can also send file attachments by typing the name of the file (if it
    is in your home directory), or the complete path of your file if it is somewhere
    else on your filesystem.


    As you compose your message, you can use your cursor keys to move around the text,
    and a number of editing keys to move text. You can also delete or underline lines
    of text for cutting and pasting. For more details on editing, see the pine manual
    page.


    When you''re finished composing your message, you can send the message right away
    using Ctrl+X, or postpone the message using Ctrl+O. This approach, allows you
