    deleted 1204172431.001

    deleted 1204172431.002

    deleted 1204172431.003

    deleted 1204172431.004

    deleted 1204172431.005

    ```


    > The fax command''s rm command-line option is potentially dangerous and may delete
    files in the current directory, especially if you just use a plain asterisk (*)
    as a filename. You should specify the fax filenames explicitly when using this
    command-line option.


    CAUTION


    The efax of commands is a simple and versatile way to send and receive faxes with
    Linux. The fax command has more commands than are documented in the manual page,
    including support for voice modems and creating cover pages. Read the fax command
    itself for more details.


    # Sending Fax Documents with mgetty+send


    mgetty+sendfax is a package of software, using the mgetty command, which you install
    in /etc/inittab much like the uugetty example shown previously, and the sendfax
    program, which is used to send faxes. The installation and configuration of this
    software is a little complicated than setting up efax. This section shows you
    how to set up, configure, and use this software to send and receive fax documents
    with your modem.


    This package of software includes many files (too many to list here). The examples
    in this section concentrate on the important ones, and first show how to configure
    the sendfax software and quickly send a fax. Your first step is to make sure you
    are logged in as the root operator. You''ll need to change directory to the mgetty-sendfax
    directory under the /etc directory. You''ll see a number of files, such as the
    following:


    ```

    # ls -A

    dialin.config fax.deny faxrun.config mgetty.config voice.conf

    fax.allow faxheader login.config sendfax.config

    ```


    Your first job is to create the fax.allow and fax.deny files if they don''t exist.
    In the fax.allow file, enter the names of users you''d like to allow to have fax
    service. You should enter at least two names: root and your username.'
