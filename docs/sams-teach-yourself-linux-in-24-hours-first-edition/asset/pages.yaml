- img_proc: true
  md: 'The F2 - Add NFS option is used to add NFS partitions. NFS partitions are network
    partitions and outside the scope of this section.


    The F3 - Edit option is used to change an already existing partition. The dialog
    box allows you to edit various fields depending on whether the partition has been
    written to the disk already.


    The F4 - Delete option is used to remove the highlighted partition from the drive.
    A pop-up appears, asking to confirm this deletion.


    The F5 - Reset option is used to bring Disk Druid to the state it was before you
    made any changes. All changes that have been made are removed. Any data on the
    mount points also has to re-entered.


    The Ok option is used to write changes to the disk drive. A pop-up appears, and
    if confirmed, the hard drive partition tables is written with the new data. The
    mount points that have been chosen are passed onto the installation program to
    define the filesystem layout.


    The Cancel option bails out of Disk Druid. Any changes made will be lost, and
    a pop-up dialog box is displayed, asking which step in the install should be done
    to next.


    # Working with Disk Druid


    Get out the paper that contains your plan for your hard drive so you can be sure
    which partitions you want to delete, and which you want to keep. Select the deleteable
    partitions and press F4 to delete them.


    > Remember once you have removed these partitions and chosen the Ok option the
    information in these partitions is gone.


    Press F5 and you are presented with the Adding Menu. For the purposes of this
    walkthrough you will have two partitions: / and swap. The first partition will
    be /. In the mount point area type / tab to the size field. For the purposes of
    this example, 250 megs (change this to fit with your earlier estimates). Select
    Linux Native as the partition, double-check all of your entries, and then select
    Ok. Create the swap partition in the same way, just be sure to select Linux swap
    as the partition type and choose Ok.


    > If you attempt to create the partition fails for some reason, an error window
    pops up, explaining what the error is likely that Disk Druid could not allocate
    the disk space for the drive currently and you will need to edit the partition
    to be smaller or make other alterations to accommodate the partition.'
