  md: '# PART

    III


    # Hour 11


    # Configuring Internet

    Email


    This hour shows you how to set up your Linux system to handle electronic mail.

    You''ll also explore various programs you can use to read and send mail.


    First you''ll learn to set up your system to send and receive mail, building on

    experience in setting up and connecting with your ISP using PPP.


    # Setting Up and Getting Your Email


    There''s not really much to do to set up your system to send and receive mail,

    al configuring the main mail daemon, sendmail, is complex enough tonbe considered
    a black art, suitable only for UNIX wizards. You shouldn''t be

    intimidated though, because you can use email right after you install Linux and

    create other users.


    I can''t discuss all of the details about UNIX mail in this hour, but you should

    understand how electronic mail works in general. The main programs involved

    in email are, in technical terms, transport agents and user agents. A transport

    agent is a program, usually a daemon, which sends mail files from one computer'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'to the next automatically. A user agent is a program, also called a mail reader,
    which you use

    to manage messages.


    After you install Linux, you''ll find all the programs you need to compose, send,
    and receive

    mail. The transport agent used in Linux is sendmail, and it is configured and
    run

    automatically when you the the system. As far as user agents go, you have your

    choice, and they are discussed later in the hour.


    Because you''re connecting to the Internet with a PPP connection, the general
    approach to

    handling mail outlined in this hour is to login in and connect, retrieve mail,
    and then disconnect

    (or stay connected for a few quick replies). If you experimented with free email
    account

    programs for other operating systems, you know the general approach is to minimize
    connect

    time by composing and replying to mail offline, connecting and retrieving

    mail, followed by logging off.


    If you want the details about mail handling, with pointers to other sources of

    information, Vince Kahn''s Mail-HOWTO under the /usr/doc/HOWTO directory.


    # Retrieving Your Email with populist


    By now you''re probably wondering how to get your email from your ISP. If you
    recall from

    t last hour, you should have the IP address or name of your ISP''s mail server.
    To get your

    mail, you''ll need the popup program, found in the /usr/bin directory. You''ll
    also need to know what Post Office Protocol, or POP, your ISP uses, along with
    your username and

    password. Most ISPs support POP or POP3, which are simple protocols for retrieving

    ymessages.


    Put all information together, connect to your ISP, and then grab all your waiting
    mail

    with one command line:


    ```

    # /etc/ppp/ppp-on

    # popclient -3 -u username -p mailserver.yourisp.com

    ```


    You can also use this command to link mail into a text file, chmod +x, and call
    it as follows:


    ```

    # domain

    QUALCOMM Pop server derived from UCB (version 2.1.4-R3) at most starting.

    3 messages in folder

    reading message 1.

    reading message 2.

    reading message 3......

    ```


    The popclient program is designed to work only one way; it retrieves your mail
    from your

    ISP''s mail server, tells your ISP''s mail server to delete your mail after it
    is received. You

    can also use other options, such as telling your ISP''s mail server to keep copies
    of your mail

    even after you retrieve, or to put your retrieved mail into an optional directory
    on your system.


    ![](img/91f0fe61bd3027cda34d2f54533df676_195_0.png)'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Configuring Internet Mail


    By default, your mail will go into a single file with your username under the
    /var/spool/mail directory. The popclient manual page for for more options.


    # Using fetchmail as an Alternative


    If you''d like to try another program instead of popclient to retrieve your mail,
    you may want to try fetchmail. This program offers a few features, and can run
    in daemon mode, checking to see if you have mail while you''re connected to your
    ISP. Using fetchmail is easy, for example:


    ```

    # fetchmail -p POP3 staffnet.com

    Enter password for bball@staffnet.com:

    1 message from bball (58 bytes)

    reading 1 flushed

    ```


    fetchmail will prompt for your password (so you can access to your ISP''s mail
    server), retrieves your mail and flushes (or deletes) your mail from your ISP''s
    mail server. fetchmail also has a nifty option, -c, unlike popclient''s -c option,
    which will merely check to see if you have mail waiting, and report the number
    of messages. See fetchmail''s manual for more information.


    Now that you''ve retrieved your mail, how do you read it, or reply to messages?
    This is with user agents, or mail-reading programs, come in.


    # Sending Mail with Mail Programs


    This section introduces you to three basic mail programs you can use under Linux.
    The explanations start with one of the oldest, the mail program, then follow with
    two screen-oriented programs, pine and elm.


    # Using the mail Program


    The mail program, found under the /bin directory, is the simplest mail program
    you can use, but it is not screen-oriented. Mail can send and receive mail, but
    you''re limited to working on a line-by-line basis. This program is handy for
    quick messages and is easy to use. For example, to create a quick message, call
    mail with an address on the command line:


    ```

    # bball@staffnet.com

    Subject: Using the mail Program

    This is how to use the mail program!

    Have fun, and enjoy.

    EOT

    ```


    The mail program will respond by asking for a Subject: line. Enter your text,
    and then press the Enter key. Then, type each line of text, and when you''re done,
    put a period (.) on a line


