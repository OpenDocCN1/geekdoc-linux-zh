- img_proc: true
  md: '# Hour 10


    This hour starts by listing some of the hardware and software prerequisites for
    Linux, and asking you for some necessary information you''ll need from your ISP.
    With that information, you''ll create a set of customized scripts you can use
    to start or stop your connection. You''ll also learn about some handy utilities
    you can use to diagnose your connection, and some other programs you can use to
    monitor your sessions.


    # Hardware You''ll Need


    You probably already have all the hardware you need: a modem, a modem cable if
    your modem is external, and a phone line. But there are other considerations,
    such as your serial port or modem speed.


    One thing about Linux is that it runs well, even on older computers. Although
    graphics-intensive applications as X can tax the capabilities of older PCs, you
    don''t need X, a fancy display monitor, or 16MB VRAM accelerated 3D video card
    to use PPP. You will, however, need a serial card to support First-In-Out serial
    buffering.


    If you can use your modem under Linux to dial out and connect using the minicom
    program or K-Cermit, the chances are you won any problems. If you''re using a
    PC Card modem, and the PMCIA device manager recognizes and initializes your modem,
    you should be OK. One way is to check the dmesg program, which displays the file
    /var/log/dmesg created when you start Linux. Run the dmesg (piped through the
    command), and look for lines in the output similar to the following:


    ```

    # dmesg : less

    tty00 at 0x02f8 (irq = 4) is 16550a

    tty01 at 0x02f8 (irq = 5) is 16550a

    tty02 at 0x02e8 (irq = 3) is 16550a

    ```


    Another consideration is your modem''s speed. Some of you may remember when 2400
    or 9600-baud modems were the greatest innovation since touch-tone dial. If you''re
    still using a 9600 baud or 14.4 modem, and refuse to upgrade to the newer 56K
    modems until the industry protocols shake out and model prices drop to $25, you
    can still connect to the Internet with PPP, as your modem will autynchronize with
    the newer models labeled in your ISP''s modem bank.


    If you want to listen to radio stations, watch live, or upgrade your Red Hat Linux
    system through your phone connection, you''ll find the fastest modem you can afford.
    Although I don''t advocate that you try to get any work done through on masochism,
    but it can be, as ATM machines 1200 or (shudder) 300-baud connection (which borders
    on bacon), prove you can use email, FTP, and text-only Web browsing at 9600 speeds.


    It''s up to you—besides, isn''t freedom of choice what Linux is all about?


    ![](img/91f0fe61bd3027cda34d2f54533df676_183_0.png)'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Linux Software You''ll Need


    To set up your PPP connection, you need to make sure that your Linux kernel supports
    PPP. You may have PPP support compiled into the kernel or loaded as a module when
    you start Linux. One way to check whether PPP support exists on your system is
    to again dmesg:


    ```

    # dmesg | less

    ```


    PPP: version 2.2.0 (dynamic channel allocation)

    TCP compression code copyright 1998 Regents of the University of California

    PPP Dynamic channel allocation code copyright 1995 Caldera, Inc.

    PPP line discipline registered.


    You should see similar lines. If you don''t, you must recompile the kernel with
    built-in PPP support, or build the PPP module and use the insmod command to load
    the driver. You will need networking support enabled, especially TCP/IP.


    Another piece of software you will need is the chat program, found under /usr/sbin
    directory, and part of the ppp daemon software package. The chat program is used
    using the dialing process to dial out and connect to your ISP''s modem. Along
    with chat, you need the pppd daemon, also installed in the /usr/sbin/ directory.
    If pppd is installed, you should find a ppp directory under the /etc directory
    containing some or all of the following:


    ```

    ls /etc

    chap-secrets options ppp-on-dialer

    connect-errors pp-secrets

    ip-up pp-off

    ```


    If you don''t see the ppp-on or ppp-on-dialer files, you can copy them from the
    /usr/doc/ppp-2.0-3f/scripts directory.


    The setup you''ll learn during this hour will require you to make changes to the
    ppp-on file, which is an executable script. Next, you may want to check if the
    file resolve.conf exists under the /etc directory. If it doesn''t, don''t worry,
    it''s a short file containing one or two lines.


    Finally, you may want to see if you have ifconfig, minicom, netstat, ping, or
    route commands on your system. You will need these tools later to run some tests
    on your connection.


    # Information You''ll Need from Your ISP


    To connect to the Internet by PPP through your ISP, you should first, obviously,
    have a PPP account. When you sign up for your service, your ISP account representative
    will likely assume you have a setup and software for a Windows or Macintosh system.
    If you say “Neither. I''m using Linux,” and the response you get is a blank stare,
    dead air on the phone, or “What''s Linux?” don''t panic!'
  merge: -1
  pgno: 184
- img_proc: true
