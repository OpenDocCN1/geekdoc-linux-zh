  md: '# Using the X Window System


    The command line puts a square red clock with yellow hands (a second hand is created
    with the -update option) in the upper right corner of an 800x600 desktop. If you
    create a file called .rclock in your home directory, you can create automatic
    reminders, as the rclock client will not pop up a reminder message at the appointed
    time, but can also be used to run programs at certain times (it checks the file
    every 10 minutes; when you have mail arrive, rclock reverses its display). Read
    the rclock manual page for more details on how to use its appointment and notification
    functions.


    The xclock client displays by default, in a standard clock face, but you can make
    xclock look like a digital clock with the -digital option. You can also control
    the color of the standard clock hands or add a chime for the hour and half hour,
    for example:


    ```

    # xclock -hd red -hl red -update 2 80x80 -bg yellow

    ```


    This command displays 80x80 pixel chiming xclock with a yellow face, red hands,
    and a sweeping second hand. If you want a digital version, you can use


    ```

    # xclock -chime -update 1 -digital -bg yellow

    ```


    This command displays a digital chiming clock with a yellow background. If you
    like digital clocks, you might also like the xclock client, which uses animation
    for its digits, and has many options to control the digits, coloring, shape, or
    fonts used in the display, for example:


    ```

    # xdaliclock -24 -cycle -shape 9x15 -geometry 697+3

    ```


    This command display a floating, transparent digital clock with melting digits,
    which constantly change color. If you click the digital display, the current day,
    month, and year are displayed momentarily.


