    As you can see, the text now fits nicely on your page when printed. But what if
    you want to save paper and would like to see at least two pages of output on a
    single page? In this case, use the mpage, or multiple page command to print several
    sheets of paper on a single page. Look at the following example:


    ```

    # mpage -2 myfile.txt >myfile.ps

    ```


    This command line uses the mpage command, found under the /usr/bin, to create
    a PostScript file you can later print, which contains the contents of the myfile.txt
    document as two side-by-side pages on each sheet of paper.


    ![](img/91f0fe61bd3027cda34d2f54533df676_253_0.png)


    You can use the mpage command''s -O, -E, or -R options to print full-duplex, back-to-back
    documents. This can be handy for producing small booklets using letter-size paper
    with a printer that''s not capable of printing on both sides of each sheet. You
    can also set different margins, fonts, and order of printed pages. See the mpage
    manual page for details.


    JUST A MINUTE


    By using the fmt, pr, or mpage commands, along with other text files, you can
    perform quick and dirty rudimentary text formatting. If you want to try more complex
    formatting, use a text formatting program.


    # Formatting Text with the groff Formatter


    If you''ve used Linux for the past several hours and have read some of its manual
    pages, you should be familiar with at least one complex formatting program: groff.
    When you read a manual page


    ```

    # ls

    ```


    it is equivalent to the following:


    ```

    # roff -man /usr/man/man/ls.1 ; less

    ```


    Notice that the roff command is used on the command line instead of groff. This
    is because the roff command installed on your system is a shell script, written
    to use the GNU formatting program to emulate the roff command. All manual pages
    are written using a special set of roff commands called macros. You can also tell
    the groff


    ![](img/91f0fe61bd3027cda34d2f54533df676_253_1.png)


