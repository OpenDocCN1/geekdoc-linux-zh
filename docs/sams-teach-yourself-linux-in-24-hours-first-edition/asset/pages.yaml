- img_proc: true
  md: '294


    Hour 20


    Here''s a good reason that you should never run your system as the root operator:
    Always running as root can be dangerous because you have access to all files on
    the system, and can delete, move, or copy them all. You can wipe out your system
    (remember the warning in Hour 5, "Manipulation and Searching Commands," about
    the rm command) with:


    ```

    # rm -rf /*

    ```


    If you run Linux from your own account, this problem won''t happen, rm will comply
    with "Permission denied," and quit. But what if you''re logged in under a user
    other than root, and you need to do things to your system as root operator? This
    is where the su command comes into play.


    # Running as the Root Operator with the su Command


    The su command, although commonly called the superuser command, allows you to
    run a command as any user on your system. Found under the /bin directory, su has
    seven different command-line options. Several of the most are covered here. Although
    you''ll likely use su to become root, this command can be handy if you want to
    become another user and troubleshoot problems as email or printing. Using the
    su command is easy, for:


    ```

    # su

    Password:

    su: incorrect password

    ```


    By default, the su command will allow you to become the root operator if you call
    it without a username. You''ll be asked to enter a password, and will comply and
    quit if you enter the wrong one. If you enter the right password, you''ll be logged
    in as root. To return to your shell, use your shell''s exit command, as follows:


    ```

    $ su

    Password:

    # whoami

    root

    # exit

    exit

    $ whoami

    bball

    ```


    This shows that after you execute the exit command, you''re returned to your normal
    user status. Another feature of the su command is the s command-line option to
    run a different shell. If you want to try a different shell without using the
    ensh command to permanently change your shell, you can use the following:


    ```

    $ printenv SHELL

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_315_0.png)


    20'
