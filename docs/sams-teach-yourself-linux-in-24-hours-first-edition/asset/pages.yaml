    directory. You can also save CDs into different categories, such as jazz, new
    age, and so on. For details about using the xplayed command, read its manual,
    or the more detailed documentation in the /usr/doc/multimedia directory.


    # Games for the Console


    If you don''t use XI1, you also can have fun at the console, you''ll find an assortment
    of 43 classic games you can play. Some of the games, like DOOM, have impressive
    graphics. Others use simple cursor movements and characters on your display.


    Install the Berkeley Software Distribution, or BSD games, and you''ll find: arithmetic,
    atc, backgammon, blastellar, bog, caesar, crabfather, fish, hangman, mille, monop,
    paranoia, robots, trek, wargomes, and wump.


    If you like text-based adventure games, try thefree. This game interpreter comes
    with 11 adventures. Play an adventure by specifying its name on the command line.


    ```

    # free_6_circus

    Scott Free, A Scott Adams game driver in C.

    Release 1.14, (c) 1993,1994,1995 Swansea University Computer Society.

    Distributed under the GNU software license

    ```


    Roll up! Roll up!


    The CIRCUS is in town!


    This command starts a circus text adventure. For more information about playing
    games, read the files in the /usr/doc/scottfree and /usr/doc/mysterious directories.


