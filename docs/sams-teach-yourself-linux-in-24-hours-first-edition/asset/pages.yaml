    # Hour 7


    # Using the X Window System


    The X Window System installed on your computer, as you learned in Hour 3, "Configuring
    the X Window System," is a port of X11 from the XFree86 Project, Inc. This graphical
    interface includes about 3,500 files, with nearly 200 programs (clients), more
    than 500 fonts, and more than 500 graphic image files in nearly 50 megabytes of
    software. You''ll find everything (but not all files or programs) for X11 under
    `/usr/X11` directory.


    This book doesn''t have enough space to discuss all aspects of using X11 with
    Linux. This hour shows you some of the different graphical interfaces, or window
    managers, you can use. It also discusses the different terminal programs (or shell
    consoles) you''ll find on your system. You''ll learn some of the basic operations
    you can perform while using X11, such as cutting and pasting text, adjusting your
    mouse speeds or cursor shape, or doing screen captures. The last section shows
    you a sampling of X11 clients you might want to try.'
