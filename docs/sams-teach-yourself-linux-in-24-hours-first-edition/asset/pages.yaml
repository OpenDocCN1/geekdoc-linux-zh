  md: '# Manipulation and Searching Commands


    The gzip command is easy to use. To compress a file (or tape archive), enter


    ```

    # gzip mydir.tar

    ```


    By default, gzip will compress your file, append a .gz extension, and delete your
    original file. To uncompress your file, you can use gzip''s companion program
    gunzip, or gzip''s -d (decompress) option. You''ll have to make sure the file
    has a .gz (or .Z, -gz, .z, -z or _z) extension, and both gzip and gunzip will
    complain. If you want to specify your own extension, use the -s (suffix) option.


    The gzip command also handles zip, compress, or packed files. If you want more
    information during compression or decompression, you can use -1, or list option,
    to see the compressed or decomposed sizes of files.


    Finally, gzip also has a helpful option, -t, to test the integrity of a compressed
    file. If the file is okay, gzip reports nothing. If you need to see -tv when you
    test a file.


    # Compressing Files with the compress Command


    The compress command does just that—it compresses files. This is one of the earlier
    compression utilities for the UNIX world.


    Files created with compress traditionally have a .z extension. To compress a file,
    enter


    ```

    # compress file

    ```


    To uncompress a file, use


    ```

    # uncompress file.Z

    ```


    Like gzip, you must specify a filename with a .z extension, or compress will complain.


    ![](img/91f0fe61bd3027cda34d2f54533df676_102_0.png)


    > Interested in other compression utilities for Linux? Look on your system for
    zip, unzip, zipcloak, zipnote, zipsplit, zless, zcat, znew, zmore, zcmp, pack,
    compact, shar, unshar, or zforce. You might not find all of them installed.


