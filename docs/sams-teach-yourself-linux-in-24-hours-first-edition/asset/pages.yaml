- img_proc: true
  md: '# Internet Downloading and Browsing


    The Linux version of Netscape Communicator also supports many different plug-ins,
    or additional programs that add features to this browser. Some of these plug-ins
    allow you to listen to live radio or watch recorded and live video. For more information
    about using plug-ins with Netscape, browse to


    ```

    http://cgi.netscape.com/eng/mozilla/2.0/extensions/info.cgi

    ```


    For more information about getting the latest audio and video, or RealPlayer,
    plug-in, browse to


    ```

    http://www.real.com/50/index.html

    ```


    # Chatting with Internet Relay Chat


    The irc (Internet relay chat) command, found under the /usr/bin directory, is
    a program you can use to converse with other people on the Internet. When you
    run irc, you can use the built-in irc commands to connect to chat servers, see
    who is chatting, and set many other options.


    The irc command has built-in help on more than 110 different commands and programs,
    many of which have further subtopic help. In order to use this program, you should
    have an active Internet connection. By default, the irc program will try to connect
    to several default chat servers (other computers supporting IRC). Once you''re
    connected, the screen will split into two parts, with the lower portion of the
    screen to enter commands to the irc program, or send keyboard sentences as messages
    to different active discussions.


    Using irc is much different from reading and responding to Usenet newsgroups.
    Discussions and comments are read and sent as you type. You should first browse
    through the irc command''s help facility, and read all the available information
    about the following topics: basics, commands, etiquette, expressions, intro, ircII,
    menus, newsusers, and rules.


    You can get a list of the help topics by using the irc /HELP command, for example:


    +   > /HELP newuser

    > /HELP etiquette


    To find out more about participating in irc chat sessions, read the built-in help
    files, and see the documentation for irc under the /usr/doc directory.


    ![](img/91f0fe61bd3027cda34d2f54533df676_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Connecting with Other Computers with the telnet Command


    You can use the telnet command to log in to remote computers to run programs,
    files, or download data. The telnet command has a number of options, but is generally
    used with a hostname, or remote computer system''s name, on the command line to
    start a telnet session, for example:


    ```

    # telnet computer.somewhere.com

    ```


    This command will connect you to the remote computer, and you''ll receive a login
    prompt. You''ll generally need to have a username and password in order to enter
    the remote system. For security reasons, few computer systems allow unknown users
    anonymous access. You may be able to find a list of computer systems providing
    access by using your search engines, such as a Web search site.


    ![](img/91f0fe61bd3027cda34d2f54533df676_229_0.png)


    "telnet" to a remote computer through an active Internet connection, or through
    a shell account through a direct dial-in to the computer, you can easily transfer
    programs using the sz and rz (send and receive) programs (if those programs are
    resident on the remote computer). After you''ve dialed in to a remote computer
    directly through the phone line, you can transfer files to your computer with:
    sz -w 2048 filename.tgz.


    This command will send the filename.tgz using the ZMODEM communications protocol.
    Your communications program should automatically start receiving the file using
    this protocol (most communications programs, anyway). If you''re connected through
    an Internet connection, the companion program, rz, should be automatically started
    to receive the file. If not, start the rz program manually. See the sz and rz
    manual pages for more information.


    You may also run the telnet command in an interactive mode, opening and closing
    sessions to different remote computers. Like the ftp command, the telnet command
    has built-in help. If you''d like to get a list of available help topics, you
    can use the question mark (?), for example:


    ```

    # telnet

    telnet ?

    ```


    Commands may be abbreviated:


    ```

    close          current connection

    logout         forcibly logout remote user and close the connection

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_229_1.png)'
