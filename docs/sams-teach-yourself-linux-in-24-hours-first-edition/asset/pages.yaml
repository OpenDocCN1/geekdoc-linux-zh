  md: '# 182


    # Hour 11


    world-searchable with the chmod command. See the following example (making sure
    you''re

    in your home directory):


    ```

    # chmod 644 .forward

    # chmod a+x

    ```


    You''re almost done. Now, with the mkdir command, create a directory called .procmail,

    change directories into it, and create a text file called rc.mailfilter.


    This file will contain your procmail filters, or recipes. While these recipes
    are extremely

    complex (so complex in fact, you can write your own mail delivery service), this
    section

    presents simple recipes to get started.


    First, examine a sample message''s mail headers (which contain the From; To; or
    Subject:

    lines). The British MG sports cars digest has the following line in each message:


    ```

    Subject: mgs@autox.team.net digest #905 Mon Nov 17 10:09:07 MST 1997

    ```


    Each digest can contain almost 100,000 characters, and is sent twice a day, so
    it

    would be nice to have all these digests go into your mail folder, which you''ll
    call

    mgdigest.


    +   :0:

    *Subject:\..digest

    mgdigest


    This small recipe will save any incoming message with a subject line containing
    the word

    digest into a mail file called mgdigest in your mail program''s mail directory.
    Note that you

    dot have to create this mail file yourself. It will be created for you when you
    first retrieve

    mail, and procmail finds a match. You can also use another recipe to have all
    mail from

    your friends to a specific folder, for example:


    +   :0:

    *From:.aol.com

    AOL


    "OK," you''re asking, but what about junk email?" Well, you know what you want
    to do with

    junk email—trash it! For Linux users, there''s a special place to which you can
    send junk:

    t old bit bucket, /dev/null. So if you get an unwanted message from a place like

    hotlips4u.com, you can send this type of junk to the boneyard with


    +   :0:

    *From:.hotlips4u.com

    /dev/null


    The mail message won''t be stored on your hard drive, and you won''t have to bother
    with any

    mail from that address again. Using this approach is simplistic, however, and
    if you get a lot

    of junk mail, you may want to experiment with more complex recipes, which can
    filter out

    eeverything people with whom you want to exchange mail.


