- img_proc: true
  md: "# Hour 15\n\nProducing nicely typeset documents by using the programs included\
    \ with your Linux distribution is usually a three-step process. First, you create\
    \ the document with a text editor. You interperse your text with typesetting commands\
    \ to create a certain effect when your document through a formatting program.\
    \ The second step is to process your document through the typesetting program\
    \ to produce formatted output. The third step is to check your formatting by previewing\
    \ the document, or if you are confident about your formatting, to print the document.\n\
    \nThis section shows you how to use typesetting programs to produce nicely typeset\
    \ documents. It also discusses the basic syntax, and commands, that these programs\
    \ recognize.\n\n# Formatting Text Using Text Filters\n\nIn Hour 14 you were introduced\
    \ to some text filters to change the output of different programs or the contents\
    \ of a document. These filters can help you format your documents if you don't\
    \ want to learn a complex formatting program or use complicated typesetting commands,\
    \ and are useful for quickly building formatted documents with headers, footers,\
    \ margins, and page numbers.\n\nSending directory lists or text files directly\
    \ to your printer without formatting may be okay, but printing larger text files\
    \ usually requires nicer formatting. One command you use is the pr command, found\
    \ under the /usr/bin directory. The pr command has 19 different command-line options\
    \ to format documents. Look at the example below:\n\n```\n# pr +4 -h \"Draft Number\
    \ 1\" -o 8 <document.txt >output.txt\n```\n\nThis command line formats the file\
    \ document.txt, starting at page 4, with a header containing the date, time, page\
    \ number, and the words \"Draft Number 1\", with a left margin of 8 spaces. Using\
    \ the > redirection operator, the formatted output is saved to a saved file output.txt,\
    \ which you can print at a later time.\n\nThe pr also formats streams of text.\
    \ One way is to create formatted columns. For example, if you have a paragraph,\
    \ you can quickly create columns of text by combining several filter programs\
    \ and formatting the text with the -COLUMN command option.\n\n```\n# cat cities.txt\
    \ San Francisco, Philadelphia, Austin, Washington D.C., Albany, Indianapolis,\
    \ Raleigh, Chicago, Miami, Norfolk, Savannah, Pittsburgh, St. Louis, Phoenix,\
    \ Nashville, Las Vegas, Atlantic City\n# cat cities.txt | sed 's/ /\\t/\n' | pr\
    \ -1 1 -3\nAlbany Atlantic City Chicago\nIndianapolis Las Vegas Miami\nNashville\
    \ Norfolk Phoenix\nPittsburgh Raleigh Savannah\nSeattle St. Louis Washington\n\
    \ *\n```\n\n15"
