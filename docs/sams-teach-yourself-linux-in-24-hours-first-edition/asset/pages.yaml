    TIME SAVER


    # Managing User Access


    One of your main jobs as a sysadmin is to manage the users on your system. This
    involves creating accounts for new users, assigning home directories, an initial
    shell for the user, and possibly restricting how much disk space, memory, or how
    many processes each person can use. This section shows how to use different command-line
    programs to manage users. You should also read Hour 22, "Red Hat Tools," if you
    like to see how to do these and other tasks with graphical utilities while running
    the X Window System.


    # Creating Users with the adduser Command


    One of the first things you should do after installing Linux is to create a user
    account for yourself. You''ll want to do all your work in Linux through this account,
    and de facto system management using the su command. There are several ways to
    create new users in Linux, and this section shows you the easy way, using a trio
    of commands: adduser, passwd, and chffn.


    ![](img/91f0fe61bd3027cda34d2f54533df676_328_1.png)'
