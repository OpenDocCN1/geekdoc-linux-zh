  md: '# Playing Linux Games


    Want the challenge of a good chess game? Try the gnuchess program, which plays
    an extremely strong game of chess. You''ll find several versions of this game
    installed on your system. The gnuchess version uses cursor addressing to provide
    a basic graphic display. The gnuchess version scrolls each board after successive
    moves, and uses reverse video and cursor addressing for a fancier display.


    Moves are entered by specifying the column and number. For example,


    | Computer | GNU Chess |

    |---|---|---|---|---|---|---|---|---|---|

    | 8 | *R | *N | *B | *Q | *K | *B | *N | *R | Playing without hashfile |

    | 7 | *P | *P | *P | *P | *P | *P | *P | |

    | 6 | | | | | | | | | |

    | 5 | | | | | | | | | |

    | 4 | | | | | | | | | |

    | 3 | | | | | | | | | 1: White |

    | 2 | P | P | P | P | P | P | P | | |

    | 1 | R | N | B | Q | K | B | N | R | Your move is? |

    | | Human | |

    | | a b c d e f g h |


    To move the pawn up two squares from the lower rank, enter e2, and press the Enter
    key. The computer makes its move, and new piece positions are updated on your
    display. The gnuchess program has more than 23 command-line options, and features
    display modes, hints, and timed games. For more information, see the gnuchess
    manual.


    # Playing Emacs Games


    The venerable emacs editor (discussed in Hour 14, “Text Processing”) not only
    edits text, reads mail, and handles your appointments, but comes with 18 wacky
    games and modes that you can use to pass the time, such as doctor, dunnet, psychoanalyze-pinhead,
    and yow.


    Start an emacs game by holding down the Alt key, pressing the x key on your keyboard.
    In the command prompt at the bottom of your emacs screen type in one of the following,
    and then press the Enter key: blackbox, cookie1, dissociate, doctor, dunnet, hanoi,
    life, mpuz, solitaire, spook, or yow.'
