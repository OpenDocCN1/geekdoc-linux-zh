  md: '# Specifying Other Directories


    You can also use the ls command to view the contents of other directories by specifying
    the directory, pathname, on the command line. For example, if you want to see
    all the files in the /usr/bin directory,


    ```

    # ls /usr/bin

    arch        dd          gzip      netstat    stty

    batch       ad          hostname  nisdomainname su

    awk         dmmsg      ping      sync

    basename    ddnomainname ksh               tar

    bash        doexec      login       pwd        tosh

    sh         domainname red           touch

    chgrp      echo        mail       rm          true

    chown      egrep       mkdir      rpm         uncount

    cat         false      mknod      sed         ypdomainname

    pio        fgrep      more        setserial  zcat

    csh        gawk        sh          sleep

    date        gunzip      mv

    ```


    The ls command also supports using wildcards, or regular expressions, which means
    you can use options similar to (and much more complex than) the examples you''ve
    seen with the find and locate commands. For example, if you only want to search
    for text files in the current directory, you can use


    +   # ls *.txt


    Finally, if you want to see all of the files on your system, you can use the ls
    -R option, which recursively descends directories to show you its contents. Although
    this approach to search for files and build a catalog of files on your system,
    you should be warned that it might take several minutes to list your files. The
    listing may also include files you don''t want listed, or files on other operating
    system filesystems, such as DOS or Windows, if you use


    +   # ls -R /


    A better approach might be to use the -d option with -R to list only certain number
    of directory levels. For example, the following command will search three directory
    levels along the root / directory :


    +   # ls -Rd /*/*


    However, there''s a better utility for getting a picture of the directory structure
    of your system, the tree command, which is discussed later in this hour.


