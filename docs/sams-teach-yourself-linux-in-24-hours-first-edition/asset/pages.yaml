    file? In this case, you''d first decide whether you want the contents of test.txt
    to go into test2.txt, or the contents of test2.txt to go into test.txt. Then,
    using cat with the >> redirection operator, you might


    # # cat test.txt >> test2.txt


    This appends the contents of test.txt to the end of test2.txt. To check the results,
    you can gain:


    ```

    # cat test2.txt

    This is the first line of test2.txt.

    This file was also created by cat.

    This is the last line of test2.txt.

    This file was created by the cat command.

    Cat could be the world''s simplest text editor.

    If you read this book, you''ll learn how to use cat.

    This is the last line of text in this file.

    ```


    Note that if you had entered the command


    ```

    # cat -n test.txt >> test2.txt

    ```


    The test2.txt file would look like


    # # cat test2.txt


    This is the first line of test2.txt.

    This file was also created by cat.


    ![](img/91f0fe61bd3027cda34d2f54533df676_78_0.png)'
