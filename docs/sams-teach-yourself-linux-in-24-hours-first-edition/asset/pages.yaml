  md: '# Using the X Window System


    You can turn on screensaving with the xset client by using the s command-line
    option, followed by the word on. To set the time in seconds, use the s option,
    followed by the number of seconds you want your X11 server to wait to blank the
    screen, for example:


    ```

    # xset s 60

    ```


    This will set the timeout interval to 60 seconds before the X11 screensaver is
    activated. To test the screensaver, which is built into your X11 server, you can
    then use the s option with the word activate, for example:


    ```

    # xset s on

    # xset s activate

    ```


    This will display a blank screen. If you''d like to see a graphic and background
    pattern, you can use the noblank option for xset''s command-line option, for example:


    ```

    # xset s noblank

    # xset s activate

    ```


    As you can, you''ll find a large X displayed on the screen. To turn off screensaving,
    use the s off command-line option. If this isn''t your idea of a screensaver,
    you can try the xcreensaver clients.


    The xcreensaver and xcreensaver-command clients, by Jamie Zawinski, are found
    under the /usr/X11R/bin directory. The xcreensaver client has 16 command-line
    options. Although this hour doesn''t cover all of the options, the basic way to
    use this screensaver is to first run the xcreensaver client in the background
    as follows:


    ```

    # xcreensaver -timeout 5

    ```


    This command will set the screensaver to run after five minutes of no keyboard
    or mouse activity. You can control this client with the xcreensaver-command client,
    to turn the xcreensaver on or off, to activate it immediately. Although the xcreensaver
    client has a -lock option to password-protect your display, you''ll have to recompile
    the program to enable this feature.


    The xcreensaver client comes with nearly two dozen different screensavers, which
    can also be run as standalone programs. For example, you can run the fractal drawing,
    hopalong, in a window


    ```

    # hopalong

    ```


    This will run the screensaver in a window you can see what it looks like. For
    a list of the screensavers that will work with the xcreensaver client, read the
    file XScreenSaver in the /usr/X11R6/lib/X11/app-defaults directory. You''ll find
    other settings in the file, which is the X11 resources file for this client.


