  md: '# Graphics Tools


    # Painting and Drawing with xpoint and xfig


    If you need to create or edit simple bitmap graphics, use David Koblas''xpoint
    program, found under the /usr/X118/bin directory. For technical details, you’ll
    also find the xfig program, which uses drawing objects (with hands), rather than
    a flat canvas.


    The xpoint program features a floating control window with tools, and a separate
    canvas window with color palettes for selecting or mixing colors. The xpoint program
    has several different command-line options, and also can use a resource file,
    .xpointrc (located in your home directory), to customize colors and patterns.
    You can draw graphics from the command line:


    ```

    # xpoint mygraphic.bmp

    ```


    The xpoint program presents the image in an editing window, and displays a floating
    window of tools (see Figure 16.5). Xfig imports and exports different file formats.
    You may have multiple windows with different images waiting to be edited.


    # Figure 16.5


    The X11 client is a simple bitmap editing program with a fatbits mode, multiple
