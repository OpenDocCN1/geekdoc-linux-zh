  md: '# Learning Math and Financial Tools


    including example programs, and an extensive tutorial that takes you from the
    concept of spreadsheet programs and how they work up to a step-by-step guide on
    how to use teapot.


    Like sc and xspread, the teapot spreadsheet is a space-saving way to handle spreadsheet
    data on your computer. You can find a copy of the spreadsheet at


