    faxes. To check whether you''ve received any faxes, you can use the fax command-line
    option—for example,


    # fax queue

    Fax files in /var/spool/:


    ```

    -rw-r-- 1 root root 24068 Dec 4 18:47 1204164866.001

    -rw-r-- 1 root root 40151 Dec 4 16:47 1204164866.002

    -rw-r-- 1 root root 22157 Dec 4 16:48 1204164866.003

    -rw-r-- 1 root root 32255 Dec 4 16:48 1204164866.004

    -rw-r-- 1 root root 10325 Dec 4 16:48 1204164866.005

    ```


    This output that a five-page fax is waiting in the /var/spool/fax directory (created
    automatically when you first run the fax command with the wait command-line option).
    You can tell that the five files are of the same fax by the filenames, which are
    the date and time, followed by the page number as an extension.


