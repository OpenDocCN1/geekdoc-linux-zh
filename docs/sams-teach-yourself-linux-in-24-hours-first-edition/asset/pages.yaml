  md: '# Exploring Other X11 Window Managers


    a doubt one of the most sophisticated, complex, and complete GUIs for the X Window
    System. It has many features that other window managers lack:


    +   - drag-and-drop actions (such as copy, move, or delete) for files and devices

    - point-and-click dialog configuration of the desktop display colors, window borders,
    and themes

    - programs and other data represented as icons on the desktop, or in windows with
    folder icons

    - graphic configuration of your system''s keyboard, mouse, and sound

    - double-click convenience to edit files or graphics

    - a desktop trash for safer file deletions

    - pop-up menus and built-in help for nearly any desktop action

    - a suite of personal productivity tools, crafted to take advantage of the desktop
    interface and features, each with context-sensitive help and the ability to export
    data to other tools


    CDE is a licensed product, by Motif, that must be purchased from a vendor (see
    Figure 8.2). You can find CDE distributions for Linux from Red Hot Software, Inc.,
    and Xi Graphics, Inc. You will need nearly 50 megabytes of free disk space to
    run CDE comfortably, as well as at least 32 megabytes of RAM (without using swap
    space).


    # Figure 8.2.

    The Common Desktop Environment is a commercially licensed X11 desktop environment
    with a suite of integrated productivity tools, including a calendar, mail, and
    an appointment reminder system.


