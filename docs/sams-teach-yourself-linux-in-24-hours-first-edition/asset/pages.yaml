    # Using the ping Command


    The ping command is useful for verifying that your ISP''s IP addresses are valid
    and for testing the response times of your ISP''s host servers. Ping sends packets
    of data and measures the time it takes for the host to send such information—for
    example:


    ```

    # statnet.com

    PING stat.207.226.80.1: 64 data bytes

    64 bytes from 207.226.80.1: icmp_seq=0 ttl=254 time=176.9 ms

    64 bytes from 207.226.80.1: icmp_seq=1 ttl=254 time=180.0 ms

    64 bytes from 207.226.80.1: icmp_seq=2 ttl=254 time=170.0 ms

    64 bytes from 207.226.80.1: icmp_seq=3 ttl=254 time=170.0 ms

    64 bytes from 207.226.80.1: icmp_seq=4 ttl=254 time=170.0 ms

    64 bytes from 207.226.80.1: icmp_seq=5 ttl=254 time=170.0 ms

    64 bytes from 207.226.80.1: icmp_seq=6 ttl=254 time=169.7 ms

    ```


    statnet.com ping statistics

    7 packets transmitted, 7 packets received, 0% packet loss

    round-trip min/max = 169.7/172.3/180.0 ms


    By default will continue to send and receive information until you tell it to
    quit with a Ctrl+C. You should also know that the -f, or flood, option isn''t
    a nice thing to do to your ISP (or any other computer for matter), as it creates
    network overhead and unnecessary network traffic.


    # Using the route Command


    The route command, used to set up or delete networking routes for interfaces,
    is also useful when showing what''s going on with your ppp0 interface. You can
