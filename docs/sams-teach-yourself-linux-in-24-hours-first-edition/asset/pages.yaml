  md: '# Setting X11 Client Resources


    Other color options can include -bd for color choices of window borders, the -rv
    and +rv reverse mode displays, which are useful for monochrome displays.


    The X Window System also supports further client configuration through the use
    of client resources. There are nothing more than text files that contain settings
    for different aspects of how a client looks or runs. You might also be able to
    set different resources of a client program when it starts using the -xr command-line
    option to specify a resource string, but most programs will only use a resource
    file.


    In order to change resource settings, you need to know what resources an X11 client
    uses. You can find this information by reading the program''s manual page, or
    looking for any installed settings in a file (but not always) the client''s name
    in the app-defaults directory under the /usr/X11/lib/X11 directory:


    ```

    # # ls -a /usr/X11/lib/X11/app-defaults

    Beforelight RVt* XGetfile Xpc

    Bitmap Seyon Xidle XScreenSaver Xpper

    Bitmap-color Seyon-color Load Xsp Xpper-color

    Chooser Vickers Xlock Xsysinfo Xman

    Editres Xanner Xlogo-color XTerm Xman

    Editres-color X3278 Xlogo Xterm-color Xmessage

    Fig Xc Mailbox Xditview

    Fig-color Xcalic-color XDM Xditview-chhtrt Xvidtune

    GV GXditview XClock Mixer Xedit xview

    NXTerm XConsole Ghostpoint XPaint Fpm

    ```


    You can see there are quite a few files with application default settings, but
    not all of the more than 200 programs for X11 have settings installed. Each file
    contains resource strings for a particular X11 client. The resource strings provide
    not only information that determines how a program is displayed, the contents
    and handling of menus, buttons, or other parts of a program.


    The format of resource strings is defined in the X manual page, but many X11 client
    programs will list different resources, with examples, for a particular client.
    if you look at the resource settings for the xpoint drawing program''s man toolbox,
    you''ll see the following values:


    +   - The top level operation/toolbar menu

    - Xpoint.width: 232

    - Xpoint.height: 350


