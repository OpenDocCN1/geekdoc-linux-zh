  md: '# Creating Files with the touch Command


    The touch command is easy to use, and generally, there are two reasons to use
    it. The first reason is to create a file, and the second is to update a file''s
    modification date. The touch command is part of the GNU file utilities package,
    and has several options.


    To create a file with touch, use


    ```

    # touch newfile

    # ls -l newfile

    -rw-rw-r-- 1 bball bball      Nov 13 08:50 newfile

    ```


    As you can, touch a file with a length, or size, of zero. You can use


    ```

    # > newfile

    # ls -1 *new*

    -rw-rw-r-- 1 bball bball      Nov 13 08:50 newfile

    -rw-rw-r-- 1 bball bball      Nov 13 08:54 newfile

    ```


    Like this, create a file with a length of zero. Why use touch, if you can do this
    at the command line? Because touch will update a file''s date or time. You can
    even use touch to change a file''s date or time to the past or the future, for
    example:


    ```

    # touch newfile

    # ls -1 newfile

    -rw-rw-r-- 1 bball bball      Nov 13 09:04 newfile

    ```


    As you can see, file newfile now has a timestamp 10 minutes younger. You can also
    set the time and date of a file to an arbitrary date, for example:


    ```

    # touch -t 122511099902 newfile

    # ls -l file*

    -rw-rw-r-- 1 bball bball      Thu Nov 13 08:50:00 1997 newfile

    -rw-rw-r-- 1 bball bball      Sat Dec 25 11:00:00 1999 newfile

    ```


    Using the --full-time option and long format listing of the ls shows that the
    file newfile now has a timestamp of 11 a.m., Christmas Day, 1999 (which can appear
    to be, and is indeed, Saturday).


    # Deleting Files with the rm Command


    The rm command deletes files. This command has several simple options, but should
    be used cautiously. Why? Because rm deletes a file, it is gone (you may be able
    to recover portions of text files, though; see the me command or the Command Reference
    section for pointers).


    ![](img/91f0fe61bd3027cda34d2f54533df676_85_0.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Manipulation and Searching Commands


    Always running Linux while logged in as the root operator and using the rm command
    has caused many untold tales of woe and grief. Why? Because with one simple command
    you can wipe out not only your Linux system, but also any mounted filesystems,
    including DOS partitions, flash RAM cards, or removable hard drives, as follows:


    ```

    # rm -f /

    ```


    This command removes all files and directories recursively (with the -r option),
    starting at the root or / directory. If you must run Linux as root, make sure
    to back up your system, and read Hour 23, "Archiving."


    The rm command will delete one or several files from the command line. You can
    use any of the following:


    ```

    # rm file

    # rm file1 file2

    # rm file*

    ```


    One of the safer ways to use rm is through the -i or interactive option, where
    you''ll be asked if you want to delete the file, for example:


    ```

    # rm -i new*

    rm: remove "newfile"? y

    rm: remove "newfile2"? y

    ```


    You can also force file deletion by using the -f option, as in


    ```

    # rm -f temp*

    ```


    However, if rm finds a directory, even if it is empty, it will not delete the
    directory, and complains, if you use -f, as in the following:


    ```

    # rm -f temp*

    rm: temp: is a directory

    rm: temp2: is a directory

    ```


    When you combine -f and -r, the recursive command, you can delete directories
    and all files or directories within (if you own them); see Hour 21, "Handling
    Files\), as in the following example:


    ```

    # rm -fr temp*

    ```


    The -f option also makes rm like the mirror command (discussed later in this chapter).
    Use this option with caution!


    Some X Window managers, such as CDE, or utilities like TkDesk, offer "trash can"
    approaches to deleting files, but the files are not really deleted, just moved
    to a temporary directory. This is a safe, but not fail-safe, approach to deleting
    or recovering files. You may also be able to use the me command, or Midnight Commander,
    discussed later in this chapter.


    ![](img/91f0fe61bd3027cda34d2f54533df676_86_0.png)'
