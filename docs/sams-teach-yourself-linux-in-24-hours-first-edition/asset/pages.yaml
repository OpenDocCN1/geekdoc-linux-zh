  md: '# Reading and Navigation Commands


    After you install Linux, locate can''t show any search results because it can''t
    locate its database. To create this database, you''ll need to use the updatedb
    command. Make sure you''re logged in as the root operator (or use the su command);
    see Hour 20, "Basic System Administration\). At the prompt, enter


    ```

    # updatedb

    ```


    It may take a minute or so for the updatedb command to finish its work, but when
    it''s done, locate''s database, located database (about 300 characters in size
    for 400MB worth of files), will reside in /var/lib directory. The only downside
    to using the locate command is that after time, your database could become out
    of date as you add or delete files to your system. However, you can have your
    database updated automatically; see the command reference section at the end of
    this hour.


    # Getting Command Summaries with and apropos


    As you first explore your Linux system, you may come across programs whose function
    is not clear. Many Linux programs are designed to give at least a little help
    with a ? or -help option on the command line, but you generally shouldn''t run
    a program without knowing what it does.


    The whatis command may be able to help you quickly find out what a program is
    with a summary line derived from the program''s manual page. For example, to find
    out is whereis (or whereis!), you can enter


    ```

    # whatis whereis

    ```


    whereis (1)- locate the binary, source, and manual page files for command


    However, with the locate command, you must first build a database of the command
    summaries with thewhatis command, found under the /usr/sbin directory. To do this,
    make sure you''re logged in root, and enter


    ```

    # makewhatis

    ```


    The whatis command, like the updatedb command, will take a few minutes to build
    the whatis database, which is called whatis and is found under the /usr/man/1
    directory. The makewhatis command has several options, but it does not have a
    manual page. To see a quick summary, use


    ```

    # makewhatis -?

    ```


    Also, with locate''s database, you''ll need to periodically update the whatis
    database to track of any newly installed programs.


