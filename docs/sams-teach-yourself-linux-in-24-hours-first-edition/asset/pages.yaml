  md: '# Checking Symbolic Links with the stat Command


    The stat command will give you a lot of information about a file or directory.
    Much of this information is technical, but you may find the stat command useful
    for checking symbolic links. The stat command does not have any command-line options,
    but you can specify directories or filenames, for example:


    ```

    # stat ./

    File: ""

    Filetype: Directory

    Size: 2048

    Mode: (0775/drwxr-xr-x) UID: (500/bball) Gid: (500/bball)

    Device: 3, Inode: 9932 Links: 19

    Access: Wed Nov 19 17:20:42 1997 (00000.00:04:16)

    Modify: Wed Nov 19 16:52:12 1997 (00000.00:42:16)

    Change: Wed Nov 19 16:52:12 1997 (00000.00:42:16)

    ```


    You can see that the stat command shows who the file or directory belongs to,
    along with permissions, and other information. If you want use stat to check symbolic
    links, you can try


    +   # touch file1

    # ln -s file1 file2

    # rm file1

    rm: remove ''file1''? y

    # stat file2

    Can''t stat file2


    As a beginning sysadmin, you can use this knowledge to devise an even better approach
    to help stat look at file directories recursively. There are a number of ways
    to do this. One handy command line you can use to check all the symbolic links
    in your Linux filesystem:


    ```

    # find /xdev xargs stat | grep ''Can''t stat''

    ```


    This command uses the find command to find pathname to the stat command (through
    the xargs command), and then the grep command to print all matches when stat can''t
    find a symbolic link. As you become a more proficient sysadmin, you''ll devise
    your own bag of tricks to diagnose your system.


    # Saving Disk Space


    This section gives you some tips on saving disk space. Part of being a sysadmin
    is maintaining the health of your filesystem, and performing cleanup operations
    occasionally to free up disk space. Once if you''ve found some techniques or approaches
    that work for your system and the way you work on your system, you''ll find that
    you can routinely trim and recover megabytes of disk space.


    One good way to save disk space is not to install a lot of software. For example,
    how many different word processors do you need? How many graphics programs do
    you need? If you find a capable program, delete others that do the same thing.
    Make sure to read Hour 22 to


    ![](img/91f0fe61bd3027cda34d2f54533df676_320_0.png)'
