  md: '# # Playing Music CDs with the cpd and xplaycd Commands


    Using your computer as a stereo system may seem a bit extravagant, but it''s nice
    to be able to listen to music while you work. In order to do this, Linux must
    be configured to use your sound card.


    ![](img/91f0fe61bd3027cda34d2f54533df676_303_0.png)


    | If you have not configured Linux to support sound, stop! In order to use your
    CD-ROM drive to play music CDs, you must have support installed in your kernel.
    See Hour 22, "Red Hat Tools." |


    If your sound works with Linux, great! You can start playing CDs right away. If
    you''re not using X11, you can play music CDs with Sariel Har-Peled''s cpd command,
    found under the /usr/bin directory. This command is a text-mode program. To use
    it, put a music in your CD-ROM drive and type the command:


    ```

    # cdp

    ```


    If nothing happens, make sure have a symbolic link, called /dev/cdrom, that points
    to your CD-ROM—for example,


    ```

    # ls -l /dev/cdrom

    lrwxrwxrwxrwx 1 root root 3 Dec 22 08:19 /dev/cdrom -> hdb

    ```


    You can create a symbolic link with the ln command. Make sure you''re logged in
    as the root operator and type the following:


    ```

    # ln -s /dev/XXX /dev/cdrom

    ```


    This creates the symbolic link, /dev/cdrom, which points to your CD-ROM drive
    device XXX (hdb, sdb, sdc, and so). If you''re not the root operator when you
    first run cdp, you may get an error message:


    ```

    # cdp

    as root, please

    chmod 666 /dev/cdrom

    to give yourself permission to access the CD-ROM device.

    ```


    By default, CD-ROM devices are created with a file permission of 660, and the
    cdp command requires your device to be readable by anyone on your system. To fix
    this, use the chmod command (discussed in Hour 21, "Handling Files"):


    ```

    # chmod 666 /dev/cdrom

    ```


    ![](img/91f0fe61bd3027cda34d2f54533df676_303_1.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Playing Linux Games


    Now run the cdp command. When it starts, you''ll see a list of the tracks on your
    CD. You should then turn on the NumLock key of your keyboard to control how you
    would like to play your CD. Table 19.1 lists the controls for playing CDs from
    your keyboard''s keypad.


    # Table 19.1. The cdp command keypad controls.


    | Action | Keypad Key |

    | --- | --- |

    | Soft exit (music continues) | 0 |

    | Help | . |

    | Back 15 seconds | 1 |

    | Hard abort (eject CD) | 2 |

    | Forward 15 seconds | 3 |

    | Previous Track | 4 |

    | Replay CD | 5 |

    | Next Track | 6 |

    | Stop | 7 |

    | Toggle Pause/Resume | 8 |

    | Play | 9 |


    The cdp command has a number of command-line options. A symbolic link, called
    cplay, can be used to play music without the cdp command''s interactive screen.
    You can tell cplay to start playing music at a certain track with the play option,
    followed by a track number:


    ```

    # cdp play 3

    ```


    This line starts the cdp command, and your music CD starts playing from the third
    track. For more details about using the cdp command, see its manual page. The
    cdp command is handy for playing CDs from your console or the command line of
    an X11 terminal window, but if you use X11 all the time, you may want to use the
    xplay command, found under the /usr/X118/bin directory.


    The xplay command, by Olav Wolffeenschneider, is an X11 client you can use to
    play music CDs. The program appears in a small window with the standard music
    CD controls, with horizontal volume bars and a list of buttons representing the
    tracks on the CD. You can raise or lower your music''s volume by clicking your
    left mouse button ahead of or behind the horizontal bars.


    One great feature of this program is the ability to reorder tracks, and even play
    a track multiple times (see Figure 19.1). By clicking a track number and dragging,
    you can rearrange the play


    ![](img/91f0fe61bd3027cda34d2f54533df676_304_0.png)'
