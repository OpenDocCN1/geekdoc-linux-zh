  md: '# PART I


    # Hour 2


    # Installing Linux


    In Hour 1 you learned how to prepare your system for the installation of Linux.
    Before you actually begin installing, there are several items you should be familiar
    with.


    # The Installation Program’s Interface


    The installation interface is a character interface rather than a graphical interface.
    A mouse is isnt used during the installation process; instead, various keystrokes
    are used to select items.


    If you''re in a text region that has multiple choices or selections, you can usually
    use the arrow keys to move around. To switch between regions, you can use the
    Tab and Alt-Tab keys.


    To choose a button to select, you normally position the highlighted area using
    one of the movement keys. You can then press the Space or Enter key to press the
    button. To select check boxes, scroll through the entries, highlighting the desired
    option. Then use the Space key to select or toggle the option on or off.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The F12 key is special in that that it takes the values as selected on the
    screen and proceeds to the next screen. If your keyboard doesn''t have an F12
    key, the combination Shift F2 should have the same results.


    The installation program presents various diagnostic information for the user
    to determine what may be happening in various parts of the install. To not clutter
    the main screen with extra data, it uses a useful feature of Linux called the
    Virtual Console which can be seen via a single keystroke. Table 2.1 lists the
    keystrokes to view each of the virtual consoles


    # Table 2.1. Virtual console keystrokes.


    | Keystroke | Result |

    |---|--|

    | Alt-F1 | This is the main installation dialogue. |

    | Alt-F2 | Once the CD-ROM has been found, you get a shell prompt that can be
    used to execute commands. |

    | Alt-F3 | The log from the installation program. |

    | Alt-F4 | The log from the kernel and other system level programs. |

    | Alt-F5 | Messages from disk formatting and some other programs. |


    For the most part, you won''t need to ever leave the first virtual console, unless
    you are curious, or trying to diagnose a problem.


    # Beginning the Installation


    To begin the installation, insert the boot diskette into the floppy drive and
    restart the computer. The machine should go through the normal process of booting
    from a floppy, then come to a screen with a boot: prompt.


    > The installation process occurs in two stages. In the first stage you tell the
    installation program some basic information about your computer and where to find
    the installation files. The second stage performs the rest of the installation.


    ![](img/91f0fe61bd3027cda34d2f54533df676_33_0.png)


    This initial screen contains helpful tips about starting the install, and allows
    access to some initial help screens before the boot process. To access these help
    screens, press one of the function keys, listed in Table 2.2, printed at the bottom
    of the screen. There is a short delay as the data is read from the floppy drive.'
