  md: '# Installing Linux


    You can also choose to skip the installation of LILO to the hard drive. This is
    usually done when you want to use the LOADLIN program or if you installed Linux
    to an IDE system on the boot floppy. Choose the method you want and either select
    Ok or Skip.


    If you selected either the First Sector of the root partition or the Master Boot
    Record, you are shown a screen asking for any boot options you need to pass to
    the machine or if you need to use the linear addressing mode to write to the system.
    For most systems, you don''t have to choose anything with the default.


    Once LILO has been written to the boot record, you see a screen notifying you
    that the install is done, to remove the floppy disk from the drive, and to press
    Enter. If you do not get this screen, check the ALT-F3 and ALT-F4 screens to see
    if an error occurred during the LILO installation. In that case, you may need
    to skip the LILO installation and then use the alternative methods of booting.


    # Booting the System


    Once LILO or LOADLIN have been installed, you can boot the Linux operating system.
    If LILO was chosen, you see what is called the LILO prompt:


    LILO:


    If you don''t do anything at this point, the system automatically boots into Linux
    after a short timeout. If you have set up your system to boot to other operating
    systems, you can hit the Tab key to see what choices are available, and then just
    type in your option and press Enter.


    linux dos


    LILO:


    After a few seconds, you see a set of text as the kernel boots up for the first
    time. After a short while, you should see the following prompt:


    ```

    Red Hat Linux release 5.0 (Hurricane)

    Kernel 2.0.32 on an 1586

    ```


    ```

    login:

    ```


    You are now ready to login into the Red Hat Linux system. To do so, type root
    and you are prompted for a Password. Type the password you typed during the install,
    and you should get a # prompt indicating you have successfully logged in.'
