  md: '# Setting Up Your Linux System for Dialing In


    You can also set up your Linux system so that your computer''s modem answers the
    phone and allows you to log in. You can then run a bulletin board system (BBS),
    word processors, spreadsheet programs, and even dial out on another line if you
    have at least two modems connected to your computer and two phone lines in your
    home.


    You''ll find most of the details, and custom configurations, in the Serial-HOWTO
    under the /usr/doc directory, but the three basic steps outlined here would work
    for any modem.


    > Setting up your Linux system to accept incoming calls editing the /etc/inittab
    file and could potentially hang your system if you make an error. Always have
    a backup boot disk handy and make a copy of the /etc/inittab file before you make
    changes.


    ![](img/91f0fe61bd3027cda34d2f54533df676_169_0.png)


    First, run minicom, and use the AT command & to display your modem''s profile,
    or default setup—example,


    ```

    ACTIVE PROFILE:

    B1 E1 L1 N1 Q0 T1 V0 X4 Y0 C1 S02 S0G S0J K3 S05 R1 S0S S0S7 X0 Y0 -Z0

    S00 S01 S02 S03 S03 S03 S04 S05 S00 S007 S00:00000000000:01:001 S12:050 S25 S05:006:0000000000000000000000044441111111
    S0:222:: S S:::4 S S5:05

    ```


    You may see other values, but you need to make sure your modem is at least set
    to the following:


    ```

    E1 0Q V1 S0=C1 &S1

    ```


    You can set your modem to these values using the AT command—for example,


    ```

    ATE100V1S50=C1&S08

    OK

    ```


    Note that at the end of the AT command, I''ve used the AT command to save the
    modem configuration as a default. You should also see the OK prompt echoed from
    your modem after entering the string.


    The second step is to create a file called /etc/conf.ugetty.ttyX where the X represents
    the serial port or device number of your serial port. The modem is connected to
    the DOS COM2 port, or /dev/cua1 or /dev/tty1, so you will create conf.ugetty.tty1
    as. Make sure you''re logged in as root and enter the following into the file:


    ```

    ALTLOCK=cua1

    ALTLINE=cua1

    # line to initialize

    ```'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Using Communications Programs


    ```

    INITLINE=tty1

    # timeout in seconds before disconnect

    TIMEOUT=60

    # initialize modem

    INIT="AT OK\r\n"

    WAITFOR_RING

    # modem connect

    CONNECT="ATA\r CONNECT\s\A"

    # delay in seconds before sending contents of /etc/issue

    DELAY=6

    ```


    Change the values for ALTLOCK, ALTLINE, and INITLINE to match your file''s name
    and serial port. The TIMEOUT value is the amount of time in seconds your modem
    will wait for a carriage return from the caller before it disconnects. The INIT
    string initializes your modem (note that you could also put the previous AT command
    in here, too), and the CONNECT string contains the AT command to answer the phone.
    The DELAY is the amount of time in seconds before the contents of the file /etc/issue,
    the login banner, is sent to the screen.


    ![](img/91f0fe61bd3027cda34d2f54533df676_170_0.png)


    ![](img/91f0fe61bd3027cda34d2f54533df676_170_1.png)


    > You should be familiar with the contents of the /etc/issue file, because it
    contains the text printed on your display right before the login prompt. This
    file is created by the startup script rc.local in the /etc/rc.d directory every
    time you start Linux as part of the booting process. You can customize the local
    script if you''d like a different login banner.


    The third step involves a one-line edit of the /etc/inittab, or initialization
    table, file. If you look in this file, you should see these lines:


    # cat /etc/inittab


    ```

    # Run getty in standard runlevels

    1:2345:respawn:/sbin/bin/gettytty1

    2:2345:respawn:/sbin/bin/gettytty2

    3:2345:respawn:/sbin/bin/gettytty3

    4:2345:respawn:/sbin/bin/gettytty4

    5:2345:respawn:/sbin/bin/gettytty5

    6:2345:respawn:/sbin/bin/gettytty6

    ```


    Each line represents a Linux runlevel, documented in the inittab file. This discussion
    doesn''t cover runlevels or the details of how Linux boots, but all you have to
    do to enable dial-in for your Linux system is to change the following line:


    ```

    3:2345:respawn:/sbin/bin/gettytty3

    to

    3:2345:respawn:/sbin/ugetty -d /etc/conf.ugetty.ttyS1 ttyS1 38400 vt1100

    ```'
  merge: -1
