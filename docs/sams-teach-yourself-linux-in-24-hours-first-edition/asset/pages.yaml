  md: '# PART

    III


    # Hour 12


    # Configuring Internet

    News


    This hour shows how to set up your Linux system to handle electronic newsgroups.
    You''ll learn about Usenet news, the world''s largest international electronic
    bulletin board. You''ll also explore various programs you can use to read, post,
    and respond to Usenet posts or messages.


    # Reading Usenet News


    This section introduces you to Usenet news and shows how to set up and use the
    tin and newsreader programs during your PPP connection. Reading news can be an
    endless source of amusement, help, and even frustration (especially if the "signal-to-noise"
    ratio is low).


    Usenet newsgroups are organized in a hierarchy, usually by topic or type of discussion.
    For example, the Linux newsgroups are generally organized by the comp topic. Here
    is a partial list of Linux newsgroups:


    ```

    comp.os.linux.announce

    comp.os.linux.hardware

    comp.os.linux.misc

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'comp.os.linux.networking

    comp.os.linux.setup

    comp.os.linux.x


    This shows that Linux subjects, such as setup, hardware, and X11 are organized
    under the topics of computers, operating systems, and Linux. You''ll find many
    other subjects organized the same way.


    Although there''s no guarantee you''ll find the exact subject you''re looking
    for, chances that you''ll easily find a newsgroup discussing a subject you''re
    interested in.


    Today, there are dozens of different Usenet software transport programs and newsreaders,
    and more than 30,000 different newsgroups.


    All newsreaders offer the basic functions of


    +   - Subscribing or unsubscribing to newsgroups

    - Browsing messages and reading follow-up messages (threads)

    - Directly mailing a reply to the author of a message

    - Posting a follow-up message to a newsgroup

    - Saving the contents of a message (usually to a directory called News in your
    home directory)


    Both tin and sirf read a newsgroup index file called .newsrc, which is normally
    located in your home directory. Although you can start both tin and sirf, and
    tell the programs to retrieve a complete list of active newsgroups from your ISP''s
    server, you''ll lose lots of time while the newsrc retrieve the list (nearly 30,000
    at the time of this). Instead, create the .newsrc file with your favorite text
    editor, and then enter the newsgroups you want to browse, for example:


    ```

    news.announce.newusers:

    comp.os.linux:

    comp.os.linux.development.apps:

    comp.os.linux.development.system:

    comp.os.linux.hardware:

    comp.os.linux.misc:

    comp.os.linux.networking:

    comp.os.linux.setup:

    comp.os.linux.x:

    comp.windows.x:

    comp.windows.x.i386:

    rec.autos.antique:

    alt.humor.best-of-usenet:

    rec.humor:

    ```


    Notice that the list does not have to be in alphabetical order. You must have
    a colon following the newsgroup. If you type in a newsgroup not supported by your
    ISP, both tin and sirf ignore the name, and both programs will display the list
    of newsgroups in the same order in which you typed them in the .newsrc file.'
