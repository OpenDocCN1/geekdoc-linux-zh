    basic features of a text

    editor.


    ![](img/91f0fe61bd3027cda34d2f54533df676_240_0.png)


    This editor is an excellent choice for your $EDITOR environment, as it is friendlier
    and easier to learn than the default $EDITOR variable, which points to the vi
    command. From the root operator, set the EDITOR variable for all users by editing
    the /etc/profile line, and inserting the following line:


    ```

    EDITOR=/usr/bin/pico

    ```


    Also, make sure that the following line contains the word EDITOR:


    ```

    export USERNAME ENV PATH

    ```


    Save the file, and then enter to use the new $EDITOR variable:


    # source /etc/profile


    After you do, any Linux command requiring a default system editor will use pico.
    Also use these changes in the .bash_profile file in your home directory.


    You''ll find documentation for pico in its manual page, or you can use the lynx
    Web browser to read the pico and technical documentation with the following:


    ```

    # lynx /usr/doc/pico-3.96/tech-notes/index.html

    ```


    # Five Editors in One-joe


    The joe editor by Joseph H. Allen, comes in five different versions: jmac, joe,
    jpico, jstar, and rjoe (see Figure 14.4). Each version emulates the emacs editor.
    The jpico version emulates the pine mailer''s pico text editor. The jstar version
    uses WordStar-compatible keyboard commands, while rjoe program is a restricted
    editor.'
