    | Tutorial | C-h t |

    | Quit | C-x C-c |


    emacs has 22 different command-line options, but is easy to start. To run emacs
    a text file for editing, just specify the file''s name on the command line. For
    example:


    ```

    # emacs myfile.txt

    ```


    This loads the editor and opens your file. If you just specify emacs on the command
    line by itself, the program starts, displays an opening screen, and clears when
    you touch the keyboard: Starting the emacs tutorial is highly recommended if you''re
    a beginner. Hold the Ctrl key and press the h key. You''ll see a prompt on the
    emacs command line at the bottom of the screen. Press the t key, and press Enter
    to start the tutorial.


    If you enter emacs at the shell prompt of an X11 terminal window, the X11 version
    of emacs with mouse and menu support automatically starts (see Figure 14.1). But
    what if you want to run console, or non-X11 version of emacs instead? In this
    case, use a different name for emacs, emacs-nox, or use the no-window command-line
    option:


    ```

    # emacs-nox myfile.txt

    # emacs myfile.txt

    ```


    Both commands run emacs in your X11 terminal window, although you''ll still see
    a menu bar across the top of the terminal screen. emacs also obeys X11 Toolkit
    options, as geometry settings. Some of the Xfile options you may find helpful
    include the following:


    +   - geometry 80x24+400+200—Start in a window 80 characters wide by 24 lines,
    at screen position X (400) Y (200)

    - fg color—Set foreground to color


