  mdcn: "\n\n# LINUX 与其他操作系统的区别\n\n与其他工作框架一样，Linux 拥有 GUI（图形客户端界面）以及类似的编程环境，你可能在 Microsoft\
    \ Windows、MacOS 等系统上用过视频和照片编辑器、文字处理器等。基本上，只要你能操作 PC 或或其他电子设备，你一定能操作 Linux。\n\n\
    无论如何，Linux 与其他工作框架之间都存在显著差异。以下是部分原因：\n\nLinux 是一个开源编程或工作框架。这意味着它是免费的。\n\n用于制作产品的代码公开的，任何人都可以查看、使用和调整，这对于开发者来说特别有用。\n\
    \nLinux 有许多应用程序，伴随着多样化的编程选择。这意味着 Linux 确实非常有适应性且易于自定义。\n\nLinux 的另一个特点是客户有机会选择他们需要使用的核心部分。这就是为什么树莓派有效运行在许多共享核心\
    \ Linux 内核的工作框架上的原因之一。\n\n然而，Linux 并非完全无安全漏洞，但与其他工作框架（例如 windows）相比，它更安全。\n\n\
    它可以用于让旧的 PC 框架焕发生机。在 Linux 工作系统上，软件更新更加简单快捷。\n\n它拥有庞大的本地社区支持，帮助你解决可能遇到的任何问题。\n\
    \n与其他工作框架相比，它非常稳定。在 windows 中，每当你卸载一个应用程序时，都需要重启。这在 Linux 中并不常见。\n\nLinux 保证其客户的安全，并且不像其他操作系统那样收集客户信息。\n\
    \n它在不同的网络和工作站上具有高性能，非常有用。它可以有效处理大量客户端同时工作，并流畅地处理它们。\n\n它为网络功能提供了巨大的底层支持。这意味着，通过\
    \ Linux，你可以在提高交付速度的同时，在 PC 上为客户搭建服务器框架。\n\nLinux 是一个真正灵活的工作框架，因为你可以选择要引入的内容而不牺牲性能。\n\
    \nLinux 适用于几乎文档设计，并可以运行你可以想象的任何程序，无论是 windows 还是 macintosh 操作系统。与其他操作系统相比，Linux\
    \ 引入简单且快速。\n\n它还提供了与硬件相匹配的卓越性能。即使在硬盘几乎满的情况下，所有任务也能有效执行。\n\nLinux 是非常节省内存的，因为它可以在同时执行许多任务的同时，几乎不会对其速度和整体性能产生影响。\n\
    \n它还考虑了不同的桌面环境，因此变得极其易用。\n\n# LINUX 的用途\n\nLinux 有许多用途。它类似于你那里发现的许多其他操作系统。\n\n\
    以下是这些用途的部分：\n\n- **服务器**\n网上超过 50% 的网站运行在一个名为 Apache 的开源程序上，该程序大部分时候运行在 Linux\
    \ 上。因此，如果你现在正在浏览网页，那么你遇到 Linux 的可能性很高。\n\n# 网络\n\nLinux 被广泛用于运行互联网的大部分。它们还被用于家庭、工作场所和公司的小型网络。\n\
    \n# 数据库\n\nLinux 通常用于数据中心框架以存储大量数据。这是因为它强大、安全且健壮。\n\n# 桌面\n\n由于 Linux 非常有适应性且稳定，它已经在我们的不同桌面上成功地找到了立足。\n\
    \n# 高性能\n\nLinux 框架可以协同工作进行海量数据集测试。这就是它被用于超级计算机进行气候预测的原因之一。\n\n# 家庭使用\n\n诚实地说，像你我这样的人也可以日常使用\
    \ Linux。\n\n# LINUX 命令行及其应用\n\nLinux 命令行界面是允许用户以文本形式输入命令以指示计算机系统完成预定义任务或一组任务的程序。\n\
    \n如果你对命令行界面感兴趣，基本上可以在你的应用程序设置中查找“提示符”。打开并运行。它通常是深色背景。\n\n以下是一些你会发现非常有用的基础 Linux\
    \ 命令必须操作列表：\n\n- 1. cd 命令\n此命令用于在 Linux 文档、文件夹或目录之间浏览。\n  i. cd .. 向上移动一级\n  ii.\
    \ cd 直接回到主目录\n  iii. cd 回到上一个目录\n\n- 2. PWD 命令\n此命令用于查找当前目录的路径。\n\n- 3. ls 命令\n\
    用于查看目录的内容\n\n- 4. cat 命令\n它是 Linux 上最常用的命令之一。它用于在标准输出连续列出文件的内容。\n\n# 第三章\n###\
    \ Python 基础\n\n### IDLE\n\n集成开发与学习环境完全用 python 编写，具有跨平台功能，即它可以运行在几乎任何操作系统上，无论是\
    \ windows 还是 MacOS。它由两个基本窗口组成：shell 窗口和管理器窗口。\n\n### IDLE 菜单\n\n当你打开 IDLE 时，你在视器中看到的主文本是\
    \ IDLE 的版本，它同样位于应用程序的左上角。应用程序内的不同菜单是：\n\n- 文件 (File)\n- 编辑 (Edit)\n- Shell (Shell)\n\
    - 调试 (Debug)\n- 选项 (Options)\n- 窗口 (Windows)\n- 帮助 (Help)\n\n```\nFile\n  Name:\
    \ 20230101_123000.txt\n  ID: DB-1\n  Date: DB-2\n  Status: \"Confidential\"\n\
    \  Path: C:\\Users\\Documents\n\nMenu\n  Edit: DB-3\n  Save: DB-4\n  Save As:\
    \ DB-5\n  Copy: DB-6\n\nWindow\n  Close: DB-7\n  Size: DB-10\n```\n\n# 文件菜单\n\n\
    此菜单包含其他子菜单。以下是它们及其不同用途的列表；\n\n# 新文件 (New File)\n\n用于创建一个另一个文档编辑窗口...\n通过打开对话框打开之前的记录\n\
    \n# 最近文件 (Recent files)\n\n打开最近创建的文件列表\n\n# 打开模块... (Open Module...)\n\n打开一个当前模块\n\
    \n# 类浏览器 (Class Browser)\n\n用于显示当前管理器文件中类 (classes)、属性 (attributes) 和方法 (methods)\n\
    \n# 路径浏览器 (Path browser)\n\n点击此项将以树形结构显示框架路径索引、模块、类、属性和方法。\n\n# 保存 (Save)\n\n\
    这将当前窗口的副本保存到与其关联的文件中。\n\n# 另存为... (Save as...)\n\n这将带有另存为交换保存当前窗口的副本。\n保存的文件将成为该窗口的新关联记录。\n\
    \n# 另存副本为... (Save copy as...)\n\n将在不更改关联记录名称的情况下保存当前窗口。\n\n# 打印窗口 (Print window)\n\
    \n将当前窗口打印到默认打印机。\n\n# 关闭 (Close)\n\n这将关闭当前窗口，如果内容尚未保存。\n\n# 退出 (Exit)\n\n这将关闭所有打开的窗口并退出\
    \ IDLE。\n\n# 编辑菜单\n\n# 撤销 (Undo)\n\n修复对当前窗口进行的更改。更改的总数绝不能超过1000。\n\n# 重做 (Redo)\n\
    \n这将重试上次撤销的操作并更改流窗口。\n\n#剪切 (Cut)\n\n将选定内容到剪贴板并删除选定内容\n\n# 复制 (Copy)\n\n将选定复制到剪贴板\n\
    \n# 粘贴 (Paste)\n\n将剪贴板的内容嵌入当前窗口。\n\n# 全选... (Select all...)\n\n选择流窗口的所有内容\n\n\
    # 查找... (Find...)\n\n这将打开一个带有多个选项的查找对话框\n\n# 再次查找 (Find again)\n\n如果存在标记的背景，则将重复上一次查询\n\
    \n# 查找选定内容 (Find selection)\n\n如果有选定内容，将查找当前选中的内容\n\n# 在文件中查找... (Find in files...)\n\
    \n这将打开文件搜索交换并在新窗口中显示结果\n\n# 替换... (Replace...)\n\n这将打开一个搜索并在存在时替换当前假设\n\n# 转到行\
    \ (Go to line)\n\n将光标移动到行首并使其可见\n\n# 显示补全 (Show completions)\n\n打开一个可以滚动的列表，允许选择短语和属性\n\
    \n# 扩展单词 (Expand word)\n\n将扩展一个以匹配等窗口中单词的前缀\n\n# 显示调用提示 (Show call tip)\n\n这将打开一个包含函数提示的小窗口\n\
    \n# 包围括号 (Surrounding parents)\n\n将包含周围的括号\n\n# 格式菜单\n\n# 缩进区域 (Indent region)\n\
    \n将选定的行向右移动缩进宽度\n\n# 取消缩进区域 (Dedent region)\n\n将选定的行向左移动缩进宽度\n\n"
