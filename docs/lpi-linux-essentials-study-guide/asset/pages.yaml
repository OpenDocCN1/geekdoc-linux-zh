    # # Working as root


    Linux is modeled after Unix, which was designed as a multiuser OS. In principle,
    you can have thousands of users on a single Unix (or Linux) computer. At least
    one user, needs extraordinary power to manage the features of the computer as
    a whole. Historically, this is the root user account, also known as the super
    user or the administrator. Knowing why root exists, how to do things as root (if
    you must), and how to use privileges safely is important for managing a Linux
    system.


    # # Understanding User Types


    Most people use computers to do ordinary-to-day computer tasks—the web, write
    letters, make a music collection, and so on. These activities are known collectively
    as user tasks, and they don''t require special privileges. As noted, a Linux computer
    can have many user accounts, and the users can use the computer from these user
    accounts (also known as unprivileged accounts, unprivileged users, or standard
    users) to perform such tasks.


    The root account enables you to perform administrative tasks. These tasks include
    installing new software, preparing a new disk for use in the computer, and managing
    ordinary user accounts. These tasks require access to system files that ordinary
    users do not need to modify or even.


    > Another user type is a system user. These are nonlogin accounts for daemons,
    services, or applications. System user accounts typically have a low UID number;
    no password (so the account is locked); /usr/sbin/nolog, /sbin/nolog, /bin/false
    as their default shell.


    To facilitate performing these tasks, root can read and write every file on the
    computer. Since Linux relies on files to store system settings, this effectively
    gives root the power to change any detail of the OS''s operation, which is the
    point of having a super user account. If the computer is a workstation''s used
    by just one individual, you may wonder why the distinction between root and the
    user account is necessary. The explanation is that the'
