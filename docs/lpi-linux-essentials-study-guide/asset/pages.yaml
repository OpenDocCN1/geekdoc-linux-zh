- pgno: 57
  md: '# Chapter 1 ■ Selecting an Operating System


    distribution''s maintainers provide software updates to fix bugs and security
    problems.

    After the support period has passed, you can continue to use a distribution, but
    you''re on your own—if you need updated software, you''ll have to compile it from
    some source code-yourself or that you can find a compatible binary package from
    some other source. As a practical matter, therefore, it''s generally a good idea
    to update to the latest version before the support period ends. This fact makes
    distributions with longer release cycles appealing to businesses, since a longer
    time between iterations minimizes disruptions and costs associated with upgrades.


    Two of the distributions in Table 1.1 (Arch and Gentoo) have rolling release cycles.
    Such distributions have no version numbers in the usual sense; instead, upgrade
    in an ongoing manner. Using such a distribution makes it unnecessary to ever do
    a full upgrade, with all the hassles that creates; however, you''ll occasionally
    have to do a disruptive upgrade of any particular subsystem, such as a major upgrade
    in your desktop environment.


    Before the release of a new version, some distributions make pre-release available.
    Alpha software is extremely new and very likely to contain serious bugs, whereas
    beta software is more stable than nonetheless less likely to contain bugs than
    the final release software. As a general rule, you should avoid using such software
    unless you want to contribute to the development effort by reporting bugs unless
    you''re desperate to have a new feature.


    # Embedded Linux Systems


    In addition to the mainstream PC distributions, several other Linux distributions
    are available that serve more specialized purposes. The term *embedded systems*
    describes running a small stripped-down Linux system on a small microcomputer,
    such as a phone or monitoring device. Common uses of embedded Linux systems are:


    +   **Android** Many cell phones use a Linux-based OS known as Android. Its interface
    is similar to that of other smartphones, but underneath lies a Linux kernel and
    a significant amount of the same Linux infrastructure you''ll find on a PC. Phones
    don''t use X or typical desktop applications, though; instead, they run specialized
    applications for cell phones.


    > NOTE Android is best known as a cell phone OS, but it can be used on other devices.
    Some tablets and e-readers, for instance, run Android.


    **Network Appliances** Many broadband routers, print servers, and other devices
    you plug into a local network to perform specialized tasks run Linux. You can
    sometimes replace'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'the standard OS with a customized one you want to add features to the device.
    Tomato (www.polarcloud.com/tomato) and OpenWrt (openwrt.org) are two examples
    of such customized distributions. Don''t install something on a whim, and if improperly,
    or on the wrong kernel, they can render the device useless!


    IoT Devices In recent years the Internet of Things (IoT) has exploded both in
    the news and in classrooms. IoT relates to creating a network of small devices
    that can sense physical conditions and control systems. Microprocessors running
    a specialized OS monitor data from sensors, such as the temperature, humidity,
    light, or motion, and use that data to control motors, locks, and switches. Embedded
    controllers such as the Arduino and Beagle Bones, are as more powerful controllers
    as the Raspberry Pi, are all the craze in schools and manufacturing environments.
    The larger controllers, such as the Raspberry Pi, often run a stripped-down version
    of Linux to provide more versatility in the applications, such as sending email
    alerts for specific sensor conditions.


    TiVo This popular digital recorder (DVR) uses a Linux kernel and a significant
    number of standard programs, along proprietary drivers and DVR software. Although
    many people who don''t realize it, they are Linux-based computers under the surface.


    Most embedded Linux systems typically require little or no administrative work
    from users, not in the way that in this book. Instead, these devices have fixed
    basic configurations and guided setup tools to help inexperienced users understand
    basic options, such as network settings and your time zone.


    # Linux in the Cloud


    Cloud technology has greatly changed the landscape of the computer world. Moving
    computer resources and applications into a shared network environment changes
    how many companies do business and provide services to customers. Linux plays
    an important role in the cloud world, so it is a good idea to define what a cloud
    is and what type of resources it provides. This section covers the basics of cloud
    computing.


    # What Is Cloud Computing?


    The first mention of the term cloud came in documentation for the original ARPANET
    network environment in 1977, the precursor to modern-day Internet. In that documentation,
    the cloud symbol was commonly used to represent the large network of interconnected
    servers geographically dispersed. However, in this environment each server was
    self-contained and self-sufficient—there was no distributed computing.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The term cloud computing is related to distributed computing. In distributed
    computing, resources are shared among two or more servers to accomplish a single
    task, such as run an application. This environment became the precursor to what
    we know today as cloud computing, popularized by companies such as Amazon Web
    Services (AWS), Google Cloud Platform, and Microsoft Azure.


    Cloud computing provides the ability to deliver computing resources across the
    Internet. Now customers can purchase hardware and software resources as needed
    from cloud computing vendors. This includes servers, storage space, databases,
    networks, operating systems, and even individual applications. Figure 1.4 demonstrates
    the three methods for providing cloud computing services.


    # FIGURE 1.4 Cloud computing methods


    ![](img/85a8584ad3f3bd69446d00a129bba855_59_0.png)


    As you can see in Figure 1.4, there are three primary methods for providing cloud
    computing environments:


    +   - **Public**: In the public cloud computing environments, a third party provides
    all of the computing resources outside of the organization. These resources are
    usually shared between multiple organizations.

    - **Private**: In the private cloud computing environments, each individual organization
    builds its own cloud computing resources to provide resources internally.

    - **Hybrid**: In hybrid cloud computing environments, computing resources are
    provided internally within the organization but also connected to an external
    public cloud to help supplement resources when needed.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# What Are the Cloud Services?


    Cloud computing environments can customize the level of resources provided to
    customers, depending on each customer''s needs. This section describes the three
    most popular models for providing resource levels that you''ll find from cloud
    computing vendors.


    # Infrastructure as a Service (IaaS)


    In the infrastructure as a service (IaaS) model, the cloud computing vendor provides
    low-level server resources to host applications for organizations. These low-level
    resources include all of the physical components you need for a physical server,
    including CPU time, memory space, storage space, and network resources, as shown
    in Figure 1.5.


    **FIGURE 1.5** The IaaS cloud model


    ![](img/85a8584ad3f3bd69446d00a129bba855_60_0.png)


    The server resources may be provided on a single server, or they may be distributed
    among several servers. In a distributed environment, the servers may be co-located
    in a single facility or they may be separated into multiple facilities located
    in separate cities. This helps provide for increased availability.


    As shown in Figure 1.5, in an IaaS model the customer supplies the operating system
    and any applications that it needs to run. Most IaaS environments support a multitude
    of different operating systems, including Linux and Windows servers. The customer
    is responsible'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'for any system administration work required for the operating system, as well
    as any application administration. The cloud computing vendor maintains the physical
    infrastructure environment.


    # Platform as a Service (PaaS)


    In the platform as a service (PaaS) model, the cloud computing vendor provides
    both the physical server environment as well as the operating system environment
    to the customer, as shown in Figure 1.6.


    FIGURE 1.6 The "customer"


    ![](img/85a8584ad3f3bd69446d00a129bba855_61_0.png)


    With the PaaS model, the cloud computing vendor takes responsibility for both
    the physical components as well as the operating system administration. It provides
    system administration support to ensure the operating system is properly patched
    and updated with current releases and security features. This allows the customer
    to focus mainly on developing the applications running within the PaaS environment.


    # Software as a Service (SaaS)


    In the software as a service (SaaS) model, the cloud computing vendor provides
    a complete application environment, such as a mail server, database server, or
    web server. The vendor provides the physical server environment, the operating
    system, and the application software necessary to perform the function. This is
    shown in Figure 1.7.'
  merge: -1
  img_proc: true
