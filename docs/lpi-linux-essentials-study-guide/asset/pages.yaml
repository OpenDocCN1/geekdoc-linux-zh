    # Investigating Server Computers


    Server computers can be almost identical to desktop computers in terms of their
    hardware, although servers sometimes require bigger drives or better network connections,
    depending on how they are used. Many popular network server programs were written
    for Unix or Linux first, making these platforms the best choice for running them.
    Examples include:


    +   - Web servers, such as Apache

    - Email servers, such as sendmail and Postfix

    - Databases, such as MySQL

    - File servers, such as the Network File System (NFS) or Samba

    - Print servers, such as the Common Unix Printing System (CUPS) or Samba

    - Domain Name System (DNS) servers, such as the Berkeley Internet Name Domain
    (BIND)

    - Dynamic Host Configuration Protocol (DHCP) servers, such as the Internet Software
    Consortium''s (ISC''s) dhcp

    - Time servers, such as the Network Time Protocol (NTP)

    - Remote login servers, such as Secure Shell (SSH) or Virtual Network Computing
    (VNC)


    ![](img/85a8584ad3f3bd69446d00a129bba855_91_0.png)


    Remote login servers enable users to run desktop-style programs on a computer
    remotely. Therefore, they''re sometimes found even on desktop systems.


    In a large organization, each of these services may have a distinct associated
    server computer. It''s possible, though, for one computer to run many of these
    server programs simultaneously.'
