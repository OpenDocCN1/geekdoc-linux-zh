    existing data instead. For standard error, use the 2> operator to send a command''s
    standard error message to a file and overwrite the file''s current contents and
    2>> operator to append another program, use the pipe, which is a vertical bar
    (|), between the commands.


    Detail archiving data with tar and zip. The tar utility archives various files
    into a single file, called an archive file, which is sometimes compressed at the
    same time resulting in a tarball. Multiple options exist for use with tar, including
    long options, short options, and even the single-letter-style options. The tar
    utility preserves Linux''s ownership and permission information, and it uses special
    options to unpack (and, if needed, reverse the compression) archive files. Also
    available to create tarball-like archives is the zip utility. Unlike the tar program,
    you do not need to add special options to automatically compress the archive file.
    However, you will need to use the unzip program to reverse the compression and
    unpack it.


    Outline the compression utilities on Linux. The gzip, bzip2, and xz utilities
    can be used with tar or by themselves to compress files. The oldest is gzip, and
