- pgno: 245
  md: "# Chapter 9 ■ Exploring Processes and Process Data\n\nBy default, top sorts\
    \ its entries by CPU use, and it updates its display every few seconds. You'll\
    \ need to be familiar with the purposes and normal habits of programs running\
    \ on your system to determine if a CPU-hungry application is misbehaving. In the\
    \ example shown in Figure 9.4, an APT update process is taking almost all of the\
    \ CPU time. To determine, note the %CPU column entry, then scan to the far-right\
    \ column to note the process that using the CPU time. Although this is a useful\
    \ tool, be careful not to jump to conclusions too quickly. In this example, the\
    \ APT update process is taking up CPU at that moment, but a short burst of activity\
    \ and drops when the update completes. The legitimate needs of different programs\
    \ vary so much that it's impossible to give a simple rule for judging when a process\
    \ is consuming too much CPU time.\n\nYou can do more with top than what it update\
    \ its display. When it's running, you can enter any of several single-letter commands,\
    \ some of which prompt you for additional information, as summarized in Table\
    \ 9.1. Additional commands are described in top's man\n\n# TABLE 9.1 Common top\
    \ commands\n\n| Command | Description |\n| h or ? | Display help information |\n\
    | k | Kill a process. The top program will ask for a PID number, and if it's able\
    \ to kill the process, it will do so. |\n q | Quit from top. |\n r | Change a\
    \ process's priority. |\n s | Changes the display's update rate, which you enter\
    \ in seconds. |\n p | Set the display to sort by CPU usage, which is the default.\
    \ |\n M | Change the display to sort by memory usage. |\n\nOne piece of information\
    \ provided by top is the load average, which is a measure of the demand for CPU\
    \ time by applications. In Figure 9.4, you can see three load-average estimates\
    \ on the top line; these correspond to the current load average and two previous\
    \ measures. Load averages can be interpreted as follows:\n\n+   - A system on\
    \ which no programs are demanding CPU time has a load average of 0.\n- A system\
    \ with one program running a CPU-intensive task has a load average of 1.\n- Higher\
    \ load averages on a single-CPU system reflect programs competing for available\
    \ CPU time."
  merge: -1
  img_proc: true
- pgno: 246
  md: 'On a computer with multiple CPUs or CPU cores, load averages can reach the
    number of CPUs or cores before competition for CPU time begins. For instance,
    a load average of 4.0 on a system with a four-core CPU processes demanding exactly
    as much CPU time as the computer has available.


    Most computers today are multicore models, but if you''re running Linux on an
    older system, single-core models dominated the marketplace prior to 2006. Use
    the lscpu command to see how many CPUs your system contains.


    The load average can be useful in detecting runaway processes. For instance, if
    a system normally has a load average of 0.5 but it suddenly gets stuck at a load
    average of 2.5, a few CPU-hogging processes may have hung—that is, becomes unresponsive.
    Hung processes sometimes consume a lot of CPU time. You can use top to locate
    these processes and if necessary, stop them.


    > The command, described in Chapter 13, can tell you how much CPU time entire
    terminal sessions are consuming.


    # Measuring Memory Use


    Processes consume a number of system resources, the most important of being CPU
    time and memory. As noted, top sorts your processes by CPU time by default, you
    can identify processes that are consuming the most CPU time. You can press the
    M key within top to sort it by memory use, identifying the processes that are
    consuming the most. With CPU time, you can''t say that a process is consuming
    much memory simply because it''s at the top of the list, though; programs legitimately
    consume a great deal of memory. Nonetheless, a program consumes too much memory
    because of inefficient coding or because of a memory leak—a type of bug in which
    the program requests memory from the kernel and fails to return it when it''s
    done with it. A program with a memory leak increases amounts of memory, to the
    point where it interferes with other programs. As a short-term solution, you can
    terminate the program and launch it again, which resets the program''s memory
    consumption, something like draining a sink that''s filled with water from a leaky
    faucet. The problem will recur, but if the memory leak is small enough, you''ll
    least be able to get work done in the meantime.


    The kernel grants access to sets of memory addresses, which the programs can then
    use. When a program is done, it should release its memory back to the kernel.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Chapter 9 ■ Exploring Processes and Process Data


    If you want to check the computer''s overall memory, the free command is useful.

    This program generates a report on the computer''s total memory status:


    # $ free


    | | total | used | shared | buffers | cached |

    |---|---|---|---|---|---|

    | Mem: | 791488 | 773456 | 180432 | 0 | 190656 | 3244720 |

    | -/+ buffers/cache: | 6291452 | 1083736 | 2650716 | |


    The line reveals total random access memory (RAM), including the total memory
    (minus whatever is used by the motherboard and kernel), the amount of memory used,
    and the amount of free memory. This example shows that the computer''s memory
    is in use. Such a state is normal, since Linux puts unused memory to use as buffers
    and caches, which help speed up disk access. The free line shows the most used;
    instead, you should use the /buffers/cache: line, which shows the total memory
    used by the computer''s programs. In this example, 4,291,888 KiB are in use, 3,615,803
    KiB free. In other words, about half the computer''s memory is in use, so there
    are no memory-related performance problems.


    The swap line reveals how much swap Linux is using. Swap space is disk space that
    sets as an adjacent to memory. Linux uses swap space when it runs out of RAM,
    or when it determines that RAM is better used for buffers or caches to hold inactive
    programs. In this example, 1030,726 KiB of swap space is in use, with 6,291,452
    KiB total ($260,716 free). Swap space usage is low, and if it rises very much,
    you can suffer performance problems. In the long run, increasing the computer''s
    RAM is generally the best solution to these problems. If you''re suffering from
    performance problems because of excessive swap use and you need immediate relief,
    terminating memory-hogging programs can help. Memory leaks, described earlier,
    can lead to such problems, and terminating the leaking program can restore performance
    to normal.


    The free command supports a number of options, which might modify its display
    format. The most useful of these is -m, which causes the display to use units
    of megabytes (MiB) rather than the default of kibibytes (KiB).


    # Using Log Files


    Many programs that run in the background (that are, daemons) write information
    about their normal operations to log files, which are files that record such notices.
    Consulting log files can be an important part of diagnosing problems with daemons.
    The first step in this is to locate your log files. In some cases, you may need
    to tell the program to produce more verbose output to help track down the problem,
    so this section provides some pointers on how to do. This section describes the
    kernel log, which isn''t technically a log file but can fill a similar role for
    kernel information.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Locating Log Files


    Linux stores most log files in the /var/log directory tree. Some log files reside
    in directories, but some servers create entire subdirectories in which to store
    their own log files. Table 9.2 summarizes some common log files on many Linux
    systems. In addition, many server programs not described in this book add their
    own log files or subdirectories of /var/log. If you experience problems with such
    a server, checking its log files can be a good place to start troubleshooting.


    > NOTE Log file details vary between distributions, some of the files in Table
    9.2 may not be present on your system, or the files you may have different names.


    # TABLE 9.2 Important log files


    | Log file | Contents |

    | --- | --- |

    | boot.log | Services that are started late in the boot process via SysV startup
    scripts |

    | cron | Processes run at regular intervals via the cron daemon. Although this
    book doesn''t cover cron, a problem with it can cause glitches at regular intervals,
    so you should be aware of it |

    | cups/ | Directory holding log files related to the Linux printing system |

    | gdm/ | Directory holding log files related to the GNOME Display Manager (GDM),
    which handles GUI logins on many systems |

    | messages or syslog | A general-purpose log file that contains messages from
    many daemons that lock their own log files |

    | secure | Security-related messages, including notices of when users employ su,
    sudo, and similar tools to acquire root privileges |

    | Xorg.0.log | Information on the most recent startup of the Window System (X)
    |


    Log files are frequently rotated, when the oldest log file is deleted, the oldest
    log file is renamed with a date or number, and a new log file is created. For
    instance, if it''s rotated on December 1, 2019, /var/log/messages will become
    /var/log/messages-20191201, /var/log/messages-1.gz, or something similar, and
    a new /var/log/messages will be created. This practice keeps log files from growing
    out of control.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Chapter 9 ■ Exploring Processes and Process Data


    Log rotation occurs late at night, so it won''t happen if you shut off your computer.
    Leave it overnight periodically to ensure log files are rotated.


    Most log files are plain-text files, so you can check them using any tool that
    can examine text files, such as less or a text editor. One handy command is tail,
    which displays the last 10 lines of a file (or as many lines as you specify with
    the -n option). For instance, typing `tail /var/log/messages` shows the last 10
    lines of that file.


    Note that not all programs log messages. Typically, only daemons do so; ordinary
    user daemons in GUI dialog boxes or in a text terminal. If you think a program
    is logging some data but you can''t find it, consult its documentation. Alternatively,
    you can use grep to find the log file to which the program is sending its messages.
    For instance, typing `grep ssh /var/log/*` finds the files in which ssh (the SSH
    daemon''s name) appears.


    ![](img/85a8584ad3f3bd69446d00a129bba855_249_0.png)


    # Real World Scenario


    # Creating Log Files


    Some programs create their own log files; however, most rely on a utility known
    as the system log daemon to do this job. Your program''s process is generally
    journal, syslog, or syslogd. Like other daemons, it''s started during the boot
    process by startup scripts. Several system daemon packages are available. Some
    of them provide a separate tool, klog or klogd, to handle logging messages from
    the kernel separately from others.


    You can modify the behavior of the log daemon, including adjusting the files to
    which it logs particular types of messages, by adjusting its configuration file.
    The name of file depends on the specific daemon in use, but it''s typically /etc/rsyslog.conf
    or something similar. The details of log file configuration are beyond the scope
    of this book, but you should be aware that such details can be altered. Fact accounts
    for much of the distribution-to-distribution variability in log file features.


    After''s running, a log daemon accepts messages from other processes using a technique
    known as system messaging. It sorts through the messages and directs them to a
    suitable log file depending on the message''s source and a priority code.


    # Producing More Verbose Log File Entries


    Sometimes log files don''t provide enough information to pin down the source of
    a problem. Fortunately, many programs produce log output can be configured to
    produce more such output. Unfortunately, doing so can make it harder to sift through
    all the entries for the relevant information.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'The procedure for increasing the verbosity of log file output varies from one
    program to another. Typically, you must set an option in the program''s configuration
    file. You should consult the program''s documentation to learn how to do this.


    # Examining the Kernel Ring Buffer


    The kernel ring buffer is something like a log file for the kernel; however, unlike
    other log files, it is stored in memory rather than a disk file. Like regular
    log files, its contents continue to change as computer runs. To examine the kernel
    ring buffer, you can type `dmesg`. Doing so creates copious output, so you''ll
    typically pipe the output through less:


    ![](img/85a8584ad3f3bd69446d00a129bba855_250_0.png)


    Because the kernel ring buffer has a limited size, its earliest entries can be
    lost if the computer runs for a long time or if something produces many entries.


    ```

    $ dmesg | less

    ```


    Alternatively, if you know the information that will be associated with a particular
    string, you can use grep to search for it. For instance, to find kernel ring buffer
    messages about the first hard disk, `/dev/sda`, you might type the following:


    ```

    $ dmesg | grep sda

    ```


    Kernel ring buffer messages can be particularly arcane; however, they can also
    be invaluable in diagnosing hardware and driver problems, since it''s the kernel''s
    job to interface with hardware. You might try searching the kernel ring buffer
    if a hardware device is behaving strangely. Even if you don''t understand a message
    you find, you could try feeding that message into a web search engine or passing
    it to a more knowledgeable colleague for advice.


    Some distributions place a copy of the kernel ring buffer when the system first
    boots in `/var/log/dmesg` or a similar file. You can consult this file if the
    computer has been running for long enough for its earliest entries to be lost.
    If you want to create such a file by default, you can edit the `/etc/rc.local`
    file and add the following line to its end:


    ```

    dmesg > /var/log/dmesg

    ```


    # Summary


    An operating Linux computer can be thought of as consisting of running programs—that
    is, processes. Managing processes begins with managing the programs installed
    on the computer, which is a task you can perform with package management tools
    such as rpm'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'or dpkg. You can learn what processes are running by using tools such as ps
    and top. Log files can help you learn about the actions of daemons, which may
    not be able to communicate error messages through the type of text-mode or GUI
    output that other programs can generate.


    # Exam Essentials


    **Explain how package management makes installing software easy.** Package management
    bundles all the files required for a single installation process. When you install
    an application using a package management system, it places the files in the correct
    location automatically and tracks the version of each file required for the application.
    If a newer version of the application is available, the package management software
    can inform you and make updating the application files a simple one-step process.


    **Describe how you can view the programs running on your Linux system.** Programs
    running on the Linux system are called processes. You can view currently running
    processes using the ps or top commands. The ps command provides a snapshot view
    of what processes are running when you run the command. It has lots of options
    that allow you to customize what information it displays. The top command produces
    a real-time chart of running processes, allowing you to sort the chart data based
    on different criteria, such as CPU usage, memory usage, or process name.


    **Describe how you can see error messages generated by the kernel.** Linux stores
    messages generated by the kernel in the kernel ring buffer, a circular buffer
    area reserved in memory. As new messages enter the buffer area, old messages are
    deleted to make room. You use the dmesg command to view the messages currently
    stored in the kernel ring buffer, but any old messages are lost and can''t be
    retrieved.'
  merge: -1
