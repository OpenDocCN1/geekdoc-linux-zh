- pgno: 207
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_207_0.png)


    An important part of any OS''s job, including Linux, is the storage, management,
    and analysis of data. Data is valuable because of the knowledge that can be gleaned
    from it, so you need to be able to search and extract it properly, as well as
    protect it. This chapter covers some of the tools that you can use to search,
    extract, and archive data.


    The chapter begins with **regular expressions**, which are a way to describe patterns
    that you might want to look for. You can use regular expressions with many commands,
    two of which (find and grep) are described in more detail. This chapter also covers
    tools that you can use to redirect input and output, which is a useful trick in
    many situations. Finally, tools for creating archive files are described, which
    can be useful in transferring files over a network or in creating backups.


    # # Using Regular Expressions


    Many Linux programs employ regular expressions, which are tools for expressing
    patterns in text. Regular expressions are similar to the wildcards that can be
    used to specify multiple filenames, as described in Chapter 7, "Managing Files."
    At their simplest, regular expressions can be plain text without adorn, although
    certain characters are used to denote patterns.


    > > NOTE


    Documentation sometimes uses the abbreviation regexp to refer to a regular expression.


    Two forms of regular expression are basic and extended. The form that you must
    depend on the program. Some accept just one expression form, whereas others can
    use either type (depending on the options passed to the program). The differences
    between basic and extended regular expression forms can be complex and subtle,
    but the fundamental principles of both are similar.


    The simplest type of regular expression is an alphabetic or alphanumeric string,
    such as Hwaddr or Linux. These regular expressions match any string of the same
    size or longer that contains the expression. For instance, the Hwaddr regular
    expression matches Hwaddr, This is the Hwaddr, and The Hwaddr is unknown. The
    real strength of regular expressions comes in the use of nonalphanumeric characters,
    which activate advanced matching rules.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Using Regular Expressions


    The most powerful regular expression features include the following:


    **Bracket Expressions** Characters enclosed in square brackets [] constitute bracket
    expressions, which match any **one** character within the brackets. For instance,
    the regular expression b[aeioug] matches the words bag, beg, b1, bog, and bug.
    The brackets represent a single character in the word. Thus, the regular p[a1n]
    matches pan and pin but not pain. Including a caret (^) after the opening square
    bracket matches against any character except the ones specified. For instance,
    b[^aeioug] matches blg or bag but not bog or reg.


    **Range Expressions** A range expression is a variant on a bracket expression.
    List of every character that matches, ranges include the start and end characters
    separated by a dash—as in [a-z]. This regular expression matches a2z, a3z, and
    a4z.


    **Any Single Character** The dot (.) represents any *single* character except
    a newline. For instance, a.z matches ax, abz, azq, or any other three-character
    string that begins and ends with z.


    ![](img/85a8584ad3f3bd69446d00a129bba855_208_0.png)


    A newline is a hidden character used in text files. When a text file is displayed,
    a newline on the end of each line is often what causes-each line to display below
    the previous line.


    **Start and End of Line** A line (sometimes called a *record*) consists of all
    characters before the line is terminated with a newline. When not used inside
    brackets, the caret (^) represents the start of a line. For instance, the dollar
    sign ($) denotes the end of a line. For instance, ^bag matches only if it is *first*
    in a line of characters, whereas bag$ matches only if it is *last* in a line of
    characters.


    **Repetition** A full or partial regular expression may be followed by a symbol
    to to denote repetition of the matched item. Specifically, an asterisk (*) denotes
    zero or more matches. The asterisk is often combined with the dot (as in .) to
    match any substring. For instance, A.*Lincoln matches any string that contains
    A and Lincoln—Able Lincoln are two possible matches.


    **Escaping** If you want to match one of the special characters, as a dot, you
    must escape—that is, precede it with a backslash (\). For instance, to match a
    computer name (say, www.sysex.com), you must escape the dots, as in www\.sysex\.com.


    Extended regular expressions add more features that you can use to match in additional
    ways:


    +   **Additional Repetition Operators** Other repetition operators work like an
    asterisk, but they match only certain numbers of matches. Specifically, a plus
    sign (+) matches one or more occurrences, and a question mark (?) specifies zero
    or one match.


    +   **Multiple Possible Strings** The vertical bar (|) separates two possible
    matches; for instance, car|truck matches either car or truck.'
  merge: -1
  img_proc: true
