    # Advanced Network Troubleshooting


    Besides the simple network tests shown in the previous section, Linux has some
    more advanced programs that can provide complex information about the network
    environment. Sometimes it helps to see just what network connections are active
    on a Linux system. There are two ways to troubleshoot that issue: the netstat
    command and the ss command.'
