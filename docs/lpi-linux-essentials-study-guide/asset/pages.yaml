- pgno: 294
  md: "# Understanding Accounts\n\nDays Until a Change Allowed The next field (5 in\
    \ this example) is the number of days before a password change is allowed. This\
    \ is used to prevent users from changing their passwords (as required) and then\
    \ changing them back to the original password.\n\nDays Before a Change Is Required\
    \ This field (30 in this example) is the number of days before another password\
    \ change is required (since the last password change).\n\nDays of Warning Before\
    \ Password Expiration If your system is configured to expire passwords, you may\
    \ set it to the warning when an expiration date is approaching. A value of 7 is\
    \ typical. However, 14 days, as shown in the preceding example, may be appropriate\
    \ if your employees take long vacations.\n\nDays Between Expiration and Deactivation\
    \ This allows a gap between the account expires and when it is completely deactivated.\
    \ An expired account either cannot be used or users can change the password immediately\
    \ after logging in. In either case, its password remains intact. A deactivated\
    \ account is erased, and the account can't used until the system administrator\
    \ reactivates it. A -1 in this field, as shown in the preceding example, indicates\
    \ that this feature is disabled.\n\nExpiration Date This field shows the date\
    \ when the account will expire. As the last password change date, the date is\
    \ expressed as the number of days since January 1, 1970. A -1 in this field, as\
    \ shown in the preceding example, indicates that this feature is disabled.\n\n\
    Special Flag This field is reserved for use and not normally used or contains\
    \ a meaningless value. This field is empty in the preceding example.\n\nFor fields\
    \ relating to counts, a value of -1 or 99999 or no value (blank) indicates that\
    \ the relevant feature has been disabled. The /etc/shadow values are generally\
    \ best left to modification through commands such as usermod (described in Chapter\
    \ 13) and change. Understanding the format of the file enables you to review its\
    \ contents and note any discrepancies, which could indicate that your system has\
    \ been compromised.\n\n![](img/85a8584ad3f3bd69446d00a129bba855_294_0.png)\n\n\
    > The terms encrypted and hashed are often confused when used with computer objects.\
    \ You can decrypt an encrypted object, but you cannot \"dehash\" a hashed object.\
    \ Passwords on Linux are salted and hashed, though you'll often use the term encrypted\
    \ mistakenly used in Linux documentation.\n\n /etc/shadow file is useless with\
    \ restrictive permissions, ownership by root. This fact is critical to the shadow\
    \ password system's utility because it keeps super users from reading the file\
    \ and obtaining the password list, even in a salted and hashed form. By contrast,\
    \ /etc/passwd must be readable by ordinary users and usually has restrictive permissions.\n\
    \nIt's important to realize that an account isn't a single entity like a binary\
    \ file. Account information is scattered across several configuration files, such\
    \ as /etc/passwd, /etc/shadow, /etc/group, and possibly in other configuration\
    \ files that refer to accounts. User files reside in the user's home directory\
    \ and perhaps elsewhere. Thus, managing"
