    **Security** Advocates of each OS claim it''s more secure than others. They can
    do this because they focus on security issues. Many of the threats to Windows
    come from viruses, which by and large target Windows and its huge installed user
    base. Viruses are essentially nonexistent for Linux; security threats come mostly
    from break-ins involving misconfigured servers or untrustworthy local servers.


    For over a decade, Windows dominated the desktop area. In both homes and offices,
    users have become familiar with Windows and are used to populate Windows applications,
    such as Microsoft Office. Although Linux can be used in such environments, it''s
    a less popular choice for a variety of reasons—its unfamiliarity, the fact that
    Windows comes preinstalled on most PCs, and the lack of compelling Linux applications
