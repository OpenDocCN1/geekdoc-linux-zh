- pgno: 333
  md: '# Managing Groups from the Shell


    You can create groups from the shell using the groupadd command, which works much
    like user for users but takes a smaller set of options, the most important of
    which appear in Table 13.3. Consult the program''s main pages for information
    on more obscure options.


    TABLE 13.3 Options for groupadd


    | Option name | Option abbreviation | Effect |

    | --- | --- | --- |

    | --gid GID | -g | Provide a specific GID. If you omit it, groupadd uses the next
    available GID. |

    | --system | -r | Instruct groupadd to create a system group, which is one with
    a GID of less than 500 or 1,000, depending on the distribution. Nonsystem groups
    are normally used by user groups. |

    | --force | -f | Normally, if you try to create a group that already exists, groupadd
    returns an error message. This parameter suppresses that error message. |


    Using the groupadd command, including an option, looks like this:


    ```

    # groupadd -g 1001 consultants

    ```


    This example creates a group with a GID of 1001 and a group name of consultants.
    Notice in the preceding example that the # prompt is shown, indicating that the
    account was used to obtain the super user privileges to complete this command
    successfully.


    After the group is added, new members can be added to the group. This requires
    the use of the usermod command and super user privileges, as follows:


    ```

    # usermod -aG consultants rich

    #

    ```


    ```

    # groups rich

    rich: users consultants

    ```


    The -ag options were used together to add the account, rich, to the new consultants
    group. If the -a option was not used, the account on some distributions would
    be removed from its current group memberships and belong only to the consultants
    group. Thus, it is wise to use -ag by default.


    > You can check an account''s primary group. Using super user privileges type
    id -gn username at the command line. The username''s primary group will display.


    ![](img/85a8584ad3f3bd69446d00a129bba855_333_0.png)'
  merge: -1
  img_proc: true
