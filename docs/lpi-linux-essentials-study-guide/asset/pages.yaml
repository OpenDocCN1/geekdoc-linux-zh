  md: '# Chapter 4 ■ Using Common Linux Programs


    rpm The rpm tool is also a low-level package tool similar in function to the dpkg
    utility. However, it is used as the foundation of the Red Hat Linux package management
    system. You can use rpm to manage packages, it''s best to use a higher-level PMS
    utility.


    apt-get This is a text-tool for the Debian PMS. With apt-get, you can install
    from repositories and remove software packages from your local Linux system. In
    addition, you can perform package upgrades for individual packages, all of the
    packages on your system, or your entire distribution. However, you will need to
    use the apt-cache text-tool for determining various pieces of information concerning
    software packages.


    yum This is a text-tool for the Red Hat PMS. It is used on distributions, such
    as Red Hat Enterprise Linux (RHEL), Fedora, and CentOS. With yum, you can install
    from repositories, remove software packages from your local Linux system, upgrade
    packages, and so on. In addition, you can use yum for determining various pieces
    of information concerning packages and their management, such as displaying a
    list of the PMS''s configured repositories.


