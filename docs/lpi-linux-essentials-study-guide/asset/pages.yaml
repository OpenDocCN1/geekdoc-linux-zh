  md: '# Exploring Files and Directories


    **FIGURE 7.1** In Linux, all files are referred relative to a single root (/)
    directory.


    ![](img/85a8584ad3f3bd69446d00a129bba855_192_0.png)


    When pointing to files and directories in commands, you can refer to them in three
    ways:


    **Absolute References** Absolute file references are relative to the root (/)
    directory, as in `/home/fred/a.txt` to refer to the path in Fred''s home directory.
    References always begin with a slash (/) character.


    **Home Directories** The tilde (-) character refers to the user''s home directory.
    If a filename begins with that character, it is as if the path to the user''s
    home directory were substituted. Thus, for Fred, `~/a.txt` is equivalent to `/home/fred/a.txt`.


    **Relative References** Relative file references are relative to the current directory.
    Thus, if Fred is working in his home directory, `a.txt` refers to `/home/fred/a.txt`.
    Relative references can include subdirectories, as in `somedir/another.txt`. In
    Linux, every directory includes a special hidden directory (.), which refers to
    its parent directory. Thus, if Sally is working in `~/sally`, she can refer to
    Fred''s `a.txt` file as `../fred/a.txt`.


    ![](img/85a8584ad3f3bd69446d00a129bba855_192_1.png)


    > File permissions can block your access to another user''s files, an issue described
    in Chapter 14.


    To better understand these concepts, try these operations:


    +   1. Launch a new shell, or use an existing one.

    2. Type **cd** – change into your home directory.

    3. Type **cat /etc/fstab** to view this configuration file using an absolute reference.
    Its contents should appear in your terminal.

    4. Type **pwd** to view your current directory. It will probably be `/home/yourusername`,
    where yourusername is guessed by it—`yourusername`.

    5. Type **cat ../etc/fstab** to view this configuration file using a relative
    reference. The first .... in this command refers to `/home`, and the second refers
    to the root (/) directory. If your home directory is in an unusual location, you
    may need to adjust the number of .. elements in this command, which is why we
    used `pwd` to find your current directory in the previous step.

    6. Type **cat ../../etc/fstab** to view this configuration file using a home directory
    reference.'
