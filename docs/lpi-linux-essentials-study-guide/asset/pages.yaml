- pgno: 255
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_255_0.png)


    Computer documents come in many forms, but one of the most basic and flexible
    is a text file. Typically, configuration files and shell scripts are text files.
    Because you will often be modifying configuration files and creating shell scripts,
    you will be able to edit text files. This chapter covers this task with an emphasis
    on the simple text-mode nano and vi editors. A few rules played by text files
    are described first; then how to select a text editor is explained. To edit text
    files, of course, you must be able to start the editor, either on an existing
    document or to create a new one. The nano editor is fairly simple, so its operation
    is described first, followed by vi, which is a more unusual editor, by standards.


    # Understanding the Role of Text Files


    A text editor lets you edit documents that are stored in plain-text format. The
    American Standard Code for Information Interchange (ASCII) will be the common
    format, but now files typically use Unicode formats to support additional characters.


    > Text files encode the ends of lines by using one or two special ASCII characters.
    End-of-line encoding differs between Unix (Linux) and Windows, but most programs
    can handle either method.


    Real World Scenario

    ASCII and Unicode


    ASCII dates to the 1960s. It''s a 7-bit code, meaning that it supports a maximum
    of 2⁷ or 128, characters. In practice, ASCII uses 8 bits, so an extra 128 characters
    are available. These bits encode various control characters or are used in ASCII
    extensions. ASCII was created to encode the letters used in English, digits, and
    symbols. This original intent, combined with ASCII''s limited character count,
    makes it rather unhelpful for'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Understanding the Role of Text Files


    many non-English languages. ASCII just doesn''t have enough characters to handle
    all the requirements of non-English languages.


    Over the years, extensions to, and variants of, ASCII have been used to support
    additional characters and alphabets that ASCII doesn''t support. One way to do
    this is to use a code page to specify an alphabet. Each code page specifies a
    variant of ASCII that''s suitable for a particular alphabet. For instance, code
    page 866 encodes Cyrillic (the alphabet used by Russian and other Slavic languages).
    The problem with code pages is that you can generally use only one at a time.


    Unicode is a more modern approach. It provides a much larger character set, allowing
    the encoding of any alphabet in common on use, including the huge logographic
    writing systems used in languages such as Chinese and Japanese. The problem is
    Unicode requires more bits, and several ways to encode it efficiently. Unicode
    Transformation Format (UTF) schemes are limited in number compared to code pages.
    Some, as UTF-8, the first characters in the same way as ASCII, an ASCII file is
    also a valid UTF-8 file. Many editors today use UTF-8 (or other Unicode formats)
    automatically, so you can use a text editor to write files in any language that
    you like. You may still need to set localization options to tell Linux what sort
    of keyboard you use and what code page use by default for programs that still
    rely on code pages.


    If your text file is encoded in ASCII, it''s encoded in Unicode too. ASCII encoding
    considered a subset of Unicode.


    Text files consist of lines that can vary in length from 0 characters to the file''s
    entire size and that can might want to create or edit some of these as an ordinary
    user; others are important for administering a Linux system. The main file types
    include the following:


    +   * Human language files

    * Programming language files

    * Formatted text files

    * Program and system configuration files

    * Program log


    > Formatted text files encode special formatting using unique character sequences.
    Although you can edit such files with a text editor, specialized editors also
    exist for many of these file types.


    Some files contain elements of multiple categories. For instance, can be stored
    in text files. An email file consists largely of human language, but email messages
    include'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'headers, which describe the origin and destination computers, along with information
    on how the message traveled from one site to the other, which is similar to formatted
    text or log file data.


    # Choosing an Editor


    All Linux distributions ship with many text editors. Broadly speaking, text editors
    fall into two categories: text-mode and GUI. Beginners are generally more comfortable
    with GUI editors, which may be more convenient to use for experts. But when a
    GUI is not available, you may have to use a text-editor. You should therefore
    familiarize yourself with at least one text-mode editor.


    Some popular text-mode editors include the following:

    vi vi the Unix staple. It is small and usually installed by default, so you can
    be certain that it''s present on any Linux computer. It is, however, strange by
    modern standards—it uses multiple editing modes, and you must switch between them
    to accomplish various tasks. Many longtime Unix and Linux administrators like
    vi for its flexibility, power, and size.


    > Most Linux distributions use a version of vi called "vi improved," or vim; you
    can typically launch it by typing vi.


    emacs The emacs editor is another Unix staple. It''s a big editor with lots of
    features, so its less likely to be installed by default, particularly on small,
    lightweight distributions. Its operating mode is more like those of the text editors
    familiar to novices, but its commands can seem other.


    > Bash''s text-editing commands are modeled after those of emacs, so learning
    emacs can improve your ability to work in the Bash shell.


    nano Several small editors are modeled after emacs, but they omit some of their
    advanced features in an effort to simplify the editor. One of these editors is
    nano, which is small, lightweight, and easy to use.

    The nano editor is probably the best place to start, because of its case of use.
    If nano is not already installed, it''s typically available in most distribution''s
    software repositories.(If you don''t find nano installed on your distribution,
    see Chapter 9, "Exploring Processes and Process Data," for help installing the
    nano package.) Figure 10.1 shows nano in operation within a text-mode login session,
    editing a file called pets.txt.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# FIGURE 10.1 The nano editor enables you to edit a text file in text mode.


    ![](img/85a8584ad3f3bd69446d00a129bba855_258_0.png)


    As with text-editors


    gedit The GNOME desktop environment has an associated text editor known as geedit.
    It''s a fairly tiny text editor, and it''s often installed by default.

    Write Kate Just as geedit is associated with GNOME, KWrite and Kate are editors
    that are associated with the K Desktop Environment (KDE). KWrite is slightly more
    sophisticated than geedit, and Kate adds some features, but neither is as powerful
    as


    Geany The editor is not tied to any particular desktop, and it''s lightweight,
    and rather powerful. It runs under other OSs besides Linux, such as Windows, if
    you want to use one editor for multiple platforms.

    For a new Linux user, any of these is a good starting GUI editor; all offer the
    basic features that you need for text-file editing. Your choice may depend on
    which system is installed. In the long term, you should probably try a variety
    of editors to find the one you like best.


    # Editing Files with nano


    If you''re familiar with text-mode text editors, you should have few problems
    learning nano. If you''ve used only GUI editors to edit text, you''ll have to
    learn a few keyboard conventions. You must move about the document by using the
    keyboard rather than the mouse, for instance. You can insert, replace, and delete
    text much as well as you do in a GUI text editor or word processor.'
