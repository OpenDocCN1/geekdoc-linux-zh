    Writer (word processor), Calc (spreadsheet), Impress (presentation), Base (database),
    Draw (vector graphics), and Math (equation editor). You may have noticed these
    applications have the same names as the Apache OpenOffice applications. You can
    read more about it at libreoffice.org.


    ![](img/85a8584ad3f3bd69446d00a129bba855_108_0.png)


    ![](img/85a8584ad3f3bd69446d00a129bba855_108_1.png)


    ![](img/85a8584ad3f3bd69446d00a129bba855_108_2.png)


    The fork of a program results when single project splits into two projects, typically
    because different groups of developers have diverging goals.


    Most of these results support the OpenDocument Format (ODF), which is an open
    set of file formats that''s slowly making inroads into a standard for word processor,
    spreadsheet, and office files. Although ODF is intended to enable easy transfer
    of files across applications, application-specific assumptions often hinder such
    transfers, especially on complex documents.


    Many other programs exist in this space, although they are not part of an office
    suite. Some are unusual. For instance, LyX (ly.org) can take the place of a word
    processor, but it''s built in a unique way to create and edit LaTeX documents.
    LaTeX is a document format that''s popular in computer science, mathematics, and
    other technical fields.


    # Using Multimedia Applications


    Linux has an excellent reputation as a workhorse server platform, but its capacity
    as a multimedia OS was lacking. This was largely due to the absence of multimedia
    applications. In the last decades, the list of multimedia applications has grown
    considerably. Current offerings include the following:


    **Audacity** This audio editor, found at sourceforge.net/audacity, is similar
    to commercial products like Sound Forge for other platforms. You can use it to
    cut sections from an audio file, equalize volume, remove unwanted noises, apply
    audio effects, and more.


    Blender You can use this 3D creation suite to create complex 3D images, including
    both stills and animations. You can learn more about Blender at blender.org.


    **Castero** This text-based podcast client allows you to subscribe to your favorite
    podcasts (and lots of them), easily search for new podcasts, view playlists, and
    more. You can explore information about this program at github.com/xgi/castero.'
