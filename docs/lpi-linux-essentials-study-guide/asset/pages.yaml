- pgno: 56
  md: '# What Is a Distribution?


    With Linux distributions are available for at least two platforms—that is, CPU
    types: x86 (also known as IA32, i86, and several variants) and x86-64 (also known
    as AMD64, EM64T, x64). Until about 2007, x86 computers were the most common variety,
    but now x86-64 computers have become the standard. If you have an x86-64 computer,
    you can run either an x86 or an x86-64 distribution on it, although the latter
    provides a small improvement. More exotic platforms, such as ARM (for tablets),
    PowerPC, Alpha, and SPARC, are available. Such platforms are mostly restricted
    to servers and to specialized devices (described shortly).


    # Real World Scenario


    +   * Which Distribution to Use?


    With a plethora of different Linux distributions available, one of the most asked
    questions for novice Linux users is which one to try. Some Linux distributions,
    such as Red Hat and Oracle, focus on commercial installations, providing customer
    support. These distributions can be expensive, and they are often hard for novice
    users to install and use.


    A second type of Linux distributions are those geared toward advanced Linux users.
    CentOS, Slackware, and Gent distributions fall in this category. They expect you
    to know how to install and configure the software and hardware. Advanced users
    like to use these distributions because they can customize exactly what to install
    on the system.


    The third type of Linux distributions are those geared toward novice Linux users.
    The popular Fedora, Ubuntu, and Mint Linux distributions fall in this category.
    The default installation takes care of most of the software and hardware configuration
    issues you need to worry about, and they provide a wealth of user-friendly graphical
    tools for doing administrator functions, such as adding user accounts, exploring
    disk space, and working with network connections. These types of Linux distributions
    are the best way to go if you are a novice to the Linux world.


    # Understanding Release Cycles


    Table 1.1 summarized the release cycles employed by a common number of Linux distributions.
    The values cited in that are the time between releases. For instance, new versions
    of Ubuntu come out every six months, like clockwork. Most other distributions''
    release schedules provide some "wiggle room"; if a release date slides a month,
    that may be acceptable.


    After its release, a distribution is typically supported until sometime the next
    version''s release—typically a few months to a year or more. During this support
    period, the


    ![](img/85a8584ad3f3bd69446d00a129bba855_56_0.png)'
  merge: -1
