- pgno: 159
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_159_0.png)


    Although Linux is software, it relies on hardware to operate. The capabilities
    and limitations of your hardware will influence the capabilities and limitations
    of Linux running on that hardware. Therefore, you should know these features for
    any computer you use extensively or that you plan to buy.


    In this chapter, you''ll learn about and perform basic management tasks with your
    hardware. We begin with low-level issues, such as the nature of your central processing
    unit (CPU) and motherboard. Often overlooked, the power supply can cause problems
    if it''s undersized or misbehaves, so we cover that as well. Next, the chapter
    explores the various types of hard disks common sticking point found in both workstations
    and servers and discusses the special care needed in their setup. After that,
    the chapter focuses on monitors and display drivers, a common sticking point in
    Linux. Today, most external devices attach via the Universal Serial Bus (USB),
    so this chapter explores those types of devices. Finally, this chapter covers
    the common issue of drivers, which are software components that control hardware
    devices.


    # Learning About Your CPU


    Your CPU (sometimes called the processor) is the "brain" of your computer—it does
    most of the computer''s actual computing. We''ve mentioned CPUs in earlier chapters
    in reference to distribution availability—to run on a given CPU, most software
    must be recompiled for that CPU. Thus, it''s important that you know enough about
    the different CPU families to know their strengths and weaknesses and to identify
    what type of CPU your computer needs.


    +   Many devices have more specialized computing circuitry. Most notably, video
    cards include graphics processing units (GPUs) to do specialized graphics computations.


    ![](img/85a8584ad3f3bd69446d00a129bba855_159_1.png)


    # Understanding CPU Families


    CPU manufacturers tend to create product lines by making regular improvements
    to their products. Improvements range from minor (such as running the CPU at a
    faster clock speed, which is like running an engine at a faster speed) to moderate
    redesigns to improve speed (which is like shifting gears to get better speed)
    to radical redesigns (which are like bigger or more efficient engine, but one
    based on the original design). All these types of'
  merge: -1
  img_proc: true
- pgno: 160
  md: "# Learning About Your CPU\n\nchanges remain within a single CPU family, so\
    \ they can run the same code as their prede-\ncessors. Still more radical differences\
    \ exist across CPU families; two CPUs from different\nofamilies can typically\
    \ not run each's binary programs, although there are exceptions\nto this rule,\
    \ including one very important one I describe shortly.\n\nOn desktop computers,\
    \ two CPU families are common:\n\nx86 This CPU type originated with Intel's 8086\
    \ CPU, but the first model capable of run-\ning Linux was the 80386 (also known\
    \ as the 386). Development continued with the 80486\n(also known as 486), the\
    \ Pentium, and other Intel CPUs, such the Celeron. AMD,\nCyrix, VIA, and others\
    \ have released CPUs that are compatible with Intel's designs.\n\nx86-64 Other\
    \ models for this architecture include AMD64, x64, and EM64T. AMD cre-\nated x86-64\
    \ as a 64-bit extension to the x86 architecture. Usually, x86-\n64 CPUs can run\
    \ the earlier 32-bit x86 code, but when in 64-bit mode, such CPUs have\naccess\
    \ to additional features to improve speed. Intel has created its own x86-64 CPUs,\n\
    Both Intel and AMD have used the same product line names for their x86-64 CPUs\
    \ as\nthe x86-64 CPUs. This fact can make it hard to tell whether you've got a\
    \ 32-bit x86 CPU or\n64-bit x86-64 CPU, at least based on the CPU's marketing\
    \ name.\n\nFor most desktop and laptop computers, you'll commonly run one of the\
    \ Intel Core\n of processors:\n\n+   * i3: the cheapest CPU, offers low-end speed\
    \ and processing performance.\n* i5: the mid-range CPU, offers medium speed and\
    \ processing performance as well as a\nmedium-level price.\n* i7: the high-end\
    \ CPU, offers advanced speeds and processing performance but at a\nhigher price.\n\
    \n# CPU Bit Depth\n\nCPU process in binary (base 2), meaning that numbers are\
    \ represented using only\ndigit—0 and 1. CPUs have limits to the sizes of the\
    \ numbers they can process, though,\nand those limits are described in terms of\
    \ the number of binary digits, or bits, the CPU can\nhandle. A 32-bit CPU, for\
    \ instance, can process numbers that contain up to 32 binary digits.\nAs positive\
    \ integers, this means that numbers can range in size from 0 to 2³-1\n(4 billion).\
    \ When dealing with large numbers,\nt CPU must combine two or more numbers, which\
    \ requires extra code.\n\nCPUs with larger bit depths have an advantage when dealing\
    \ with limits of memory, since\nmemory addresses fit into the CPU's basic unit\
    \ size. In particular, a 32-bit CPU has\na 4-gibbit (GiB) limit on memory—although\
    \ some architectures, including x86, provide\ntricks to work around this limit.\
    \ Greater bit depth does not improve speed except when\ndealing with very large\
    \ numbers; however, the 64-bit x86-64 CPU architecture is faster\nthan its 32-bit\
    \ x86 predecessor for unrelated reasons."
