  md: 'If you mistype the filename of a preexisting file, nano will show an empty
    file. Thus, if you see an empty file instead of the file that you were expecting
    to see, you may have mistyped the filename.


    # Using Text Editor Conventions


    Every text editor has its own conventions for displaying information on the screen,
    manipulating text, and so on. Most text-mode editors are similar up to a point—for
    instance, one or more lines at the top or bottom of the display typically show
    summary information or brief command prompts. Figure 10.1 and Figure 10.2 show
    this information for nano, which includes the following:


    +   **Title Bar** The first line of the display is the title bar. This line includes
    nano''s version number, the name of the file being edited, and the modification
    status.


    +   **Status Bar** The third line from the bottom of the display is reserved for
    status information and interactions with the user. This line will prompt you for
    information such as a filename to write your document or terms that you want to
    find in the document when you perform a search operation.


    +   **Shortcut List** The two lines of the editor show a summary of some of the
    most common operations, along with the keystrokes that trigger them.


    > In nano documentation, a caret (*) refers to a control character. In this book,
    such key combinations are indicated with Ctrl+ rather than a caret.


    In addition to control characters, nano uses metacharacters to activate functions.
    These key combinations use the Esc, Alt, or Meta key (depending on your keyboard''s
    configuration) followed by another key. In nano''s documentation, meta sequences
    are denoted by M-k, where k is a key. For instance, M-? is the key sequence to
    move to the last line of the document. Note that these are distinct keystrokes,
    Ctrl key sequences; that is, you would press Esc (or Alt or Meta), release it,
    and then press the question mark (?) key, using its Shift modifier, to move to
    the last line of the document.


    > Typically, modern keyboards do not have a Meta key (consult your keyboard manufacturer''s
    documentation). As a substitute, first try using the Esc key in place of the Meta
    key for meta key sequences in nano. If that does not work, try the Alt key as
    the Meta key.


