    data. Type **ln oridname linkname**, where oridname is the original name and linkname
    is the new link''s name, to create a hard link.


    Symbolic Link A *symbolic link* (aka soft link) is a file that refers to another
    file by. That is, the symbolic link is a file that holds another file''s name,
    and when you tell a program to read or write from a symbolic link, Linux redirects
    the access to the original file. Because symbolic links work by filename references,
    they can cross filesystem boundaries. Type **ln -s origami linkname** to create
    a symbolic link.


    Symbolic links are similar to *shortcuts* on the Windows desktop.


    ![](img/85a8584ad3f3bd69446d00a129bba855_197_0.png)


    You can identify links in long directory listings (using the -l option to ls)
    in a couple of ways. The following example illustrates this:


    ```

    $ ln report.odt hardlink

    $ ln -s report.odt softlink

    $ ls -l

    total 192

    -rw-r--r-- 2 rich users 94720 Sep 10 11:53 hardlink.odt

    -rw-r--r-- 2 rich users 94720 Sep 10 11:54 softlink.odt -> report.odt

    lrwxrwxrwx 10 rich users

    ```


    This example began with a single file, report.odt. The first two commands created
    two links, a hard (hardlink.odt) and a symbolic link (softlink.odt). Typing **ls
    -l** shows all three files. The original file and the hard link can be identified
    as links by the presence of the value in the second column of the ls -l output;
    this column identifies the number of file entries point to the file, so a value
    higher than one indicates a hard link exists. The symbolic link is denoted by
    a lowercase **L**, not a digit **1** in the first column of the softlink''s permissions
    (lrwxrwxrwx). Furthermore, the symbolic link''s permissions include an pointer
    to to or in multiple directories.


    Both types of links are useful for referring to files by multiple names. If you
    write a letter that needs to multiple recipients, you might need to store copies
    in directories to reach each recipient in such a situation, either type of link
    will work fine, but each has implications. Most importantly, if you use symbolic
    links, deleting the original file makes the file completely inaccessible; the
    symbolic links remain but point to a nonexistent file. If you use hard links,
    conversely, you must delete all copies of the file to delete the file itself.
    This is because hard links are duplicate directory entries that point to the same
    file, whereas symbolic links are separate files that refer to the original file
    by name.


    If you modify a link by accessing its soft link, or by any hard-linked link, you
    should be that the program you use will modify the original file. Some programs
    create a backup of the original file that you can use to recover the original
    in case you find your'
