    # Deleting Accounts Using GUI Users


    As with other account management tasks, using a GUI is intuitive, but details
    vary from one distribution to another. For example, to delete an account from
    Linux Mint''s Users and Groups administration utility, after you have the utility
    open, click the account and then click the Delete button. The result is a confirmation
    dialog similar to the one shown in Figure 13.6. If you''re certain of the action,
    click the Yes button. The account will be immediately deleted.


    FIGURE 13.6 When you delete an account with a GUI utility, you are typically asked
    to confirm the action.


    ![](img/85a8584ad3f3bd69446d00a129bba855_329_0.png)


    If the user is currently logged in, the utility will often complain about this
    fact. You''ll most likely still be able to delete the account, but the user won''t
    be logged out immediately.'
