    # # Handling USB Devices

    Most modern computers use USB as the primary interface for external peripherals.
    Keyboards, mice, cameras, flash storage, hard disks, network adapters, scanners,
    printers, and we can all connect via USB. For the most part, USB devices work
    in a plug-and-play manner—you plug them in and they work. Some specific caveats
    include the following:


    **Human Interface Devices** The software usually manages any keyboards, mice,
    tablets, and similar devices when you plug them in. If you have problems, you
    may need to adjust your X configuration, but this is an advanced topic that’s
    beyond the scope of this book.


    **Disk Storage** We include USB flash drives, external hard disks, and other storage
    devices in this category. As described earlier, in “Using Removable and Optical
    Disks,” it’s critical that you unmount the disk before you unplug your USB cable.
    Failure to do so can result in data corruption.


