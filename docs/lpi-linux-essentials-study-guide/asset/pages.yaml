    and the servers that deliver them. Numerous other protocols and servers exist,
    many of them for very specialized tasks.


    > Chapter 15, "Managing Network Connections," describes network configuration
    in greater detail.


    Some protocols are many often used on local networks. For instance, DHCP by its
    nature is intended to help you manage your own local network by making it easier
    to configure client computers—just tell the computers to use DHCP, and that''s
    it. SMB/CIFS is also usually employed only in order to enable users to access
    another''s files and printers more easily. Protocols like HTTPS, on the other
    hand, are generally used on the Internet as a whole, although they can also be
    used on local networks.


    ![](img/85a8584ad3f3bd69446d00a129bba855_114_0.png)


    # Real World Scenario Server Programs and Server Computers


    The term server can apply to an entire computer or to a single program running
    on that computer. When applied to a computer as a whole, the term identifies the
    purpose of the computer and the fact that it runs one or more server programs.
    Server computers typically provide services that are used by anywhere from a handful
    of client computers—that is, the computers that use a server''s services.


    In the networking world, a server (computer or program) listens for a connection
    from a client (computer or program) and responds to data transfer requests. Server
    computers are often—but not always—more powerful than their clients.


    When you read the word server (or client, for that matter), it may refer to either
    a computer to a program. The context usually makes it clear which is intended,
    although this isn''t the case—sometimes the speaker may not know! For instance,
    somebody might report "The Samba server isn''t working." In such a case, you need
    to figure out whether it''s the server program or something else on the server
    computer that causing problems.


    Sometimes, the client-server lines can get blurred. For instance, in office settings,
    it is common for many computers to function as servers by running file software
    such as Samba or NFS. Such configuration enables Sam to make his files available
    to Cameron and for Cameron to make his files available to Sam. In this situation,
    both computers function as both client and server and run both types of software.
    In any given exchange, though, only one is the client and one is the server.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Focusing on Web Servers


    A web server delivers web pages to internal and/or external network users. If
    you have used the World Wide Web, you have most likely used two popular web servers
    that are offered on Linux:


    Apache HTTP server is part of the prevalent Linux, Apache, MySQL, PHP (LAMP) stack
    for web applications. The original web server software package was released in
    1995. Within less than a year, Apache became the most popular web server on the
    Internet. It continues to maintain this level of popularity due to its stability
    and adaptability. The Apache HTTP server is available not only for Linux, but
    also for Unix, BSD, Windows, and even macOS. You can learn more at http://apache.org.


    NGINX Released in 2002, the NGINX (pronounced Engine X) web server is a relative
    newcomer to the market. NGINX can retrieve resources on behalf of a client from
    one or more servers, as well as operate as a master server. Because of these features,
    and the fact that it is fast and lightweight, NGINX has won over many websites,
    such as Netflix. You can learn more at nginx.org.


    > The best feature of these two servers is that you don''t have to choose one
    or the other. Many server administrators choose a dual setup, using both Apache
    HTTP and NGINX. Sometimes a side-by-side architecture is deployed, with each server
    handling what it does best—Apache managing dynamic content and NGINX managing
    static content (the same display for every user). Others deploy an Apache-in-Back
    (or NGINX-in-Front) architecture, allowing NGINX to shine with its resource-retrieval
    services, and the stable Apache still providing dynamic content as needed.


    # Installing and Launching Servers


    The topic of maintaining server programs is beyond the scope of this book, but
    you should be aware of the basics of this task. You can install servers in the
    same way that you install other software, as described in this chapter and in
    more detail in Chapter 9.


    After the software is installed, you must launch a server. This is quite differently
    than the way you launch a desktop application. Instead of clicking an icon or
    menu in a GUI, you typically launch a server by configuring the computer to run
    automatically whenever it boots. Thereafter, the server program runs in the background,
    as a daemon—that is, as a process that runs unattended.


    > The word daemon derives from Greek mythology; daemons are helpful supernatural
    beings, just as Unix and Linux daemons are helpful programs.


    Most servers are started automatically when Linux boots. You can also open a terminal
    program and type a text-mode command with a keyword such as start to start or
    stop the server manually. The nature of server startup has been changed'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Using Server Programs


    with recent distributions, and the topic is beyond the scope of this book. However,
    it is helpful to know that various distributions use a particular initialization
    daemon both to start and manage the server daemons. Be sure to consult your distribution''s
    documentation to determine which initialization daemon it uses from the following
    list:


    +   - System V init (SysV init)


    +   - systemd


    +   - Upstart


    Some servers run via a super server, such as xinit. These server programs run
    constantly, keeping the servers they manage unloaded except when they are needed.
    This configuration can minimize the negative impact of running seldom-used servers.
    The super server can also function as a security feature, like a bouncer, and
    keep out the troublemakers.


    # Securing Servers


    Whenever you run a server, you also run the risk of its being compromised and
    abused. Risks fall into several categories:


    +   - Servers can contain bugs that enable others to abuse the software or to
    run programs locally.


    +   - You can misconfigure a server, granting an outsider greater access to your
    system than you had intended.


    +   - Users with accounts and remote access via a server can abuse this trust.
    This risk is particularly great if combined with a server bug or misconfiguration.


    +   - A server can be used as a stepping-stone to attack others, making it appear
    as if an attack originated from your computer.


    +   - Even without breaking into a computer, an attacker can swamp a server with
    bogus data, shutting it down. This technique is called a denial-of-service (DoS)
    attack.


    Server security is an extremely complex topic, and details vary from one server
    to another. For instance, if you run a server such as a login server, Samba, or
    a POP or IMAP email server, you probably want to pay attention to password security,
    since all of these servers rely on passwords. Passwords are unimportant to a DHCP
    or DNS server, though, even if a DHCP or DNS server does not use passwords, other
    server programs running on the same computer might.


    Broadly speaking, securing a server requires paying attention to all of the risk
    factors justified. Steps that you can take to secure your servers include the
    following:


    +   - You should keep your servers up-to-date by your package management tools
    to upgrade servers whenever becomes available. You can also research specific
    servers to pick ones that have good security reputations.


    +   - You should learn enough about server configuration to be sure that you can
    configure your servers properly.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   You should remove unused accounts and audit necessary accesses to be sure
    that they use strong passwords.


    +   You can use firewall configurations to restrict outsiders'' access to server
    computers that are intended for internal use only. You can also use firewalls
    to minimize the risk of one of your computers being used to attack others.


    # # Managing Programming Languages


    Many users never need to deal with programming languages; however, basic knowledge
    of what they are and how they differ from one another is important for Linux users
    for variety of reasons. You might need to install languages for users that you
    manage or for yourself to compile software from source code. You might also want
    to learn about programming, particularly if you want to automate computer management
    tasks using scripts.


    This section presents basic information on programming languages. It begins describing
    the differences between compiled and interpreted languages, which are important
    to understand so that you can properly handle files or choose which you want to
    use. Brief descriptions of some common programming languages are also provided
    so that you can identify and use your source code files or choose which language
    you want to learn to.


    # # Choosing a Compiled vs. an Interpreted Language


    At their core, computers understand binary codes—numbers that represent operations,
    such as adding two numbers or choosing of two actions to take. People, however,
    are much better at handling words and symbols, such as *if*. Most programming
    involves writing a program in a symbolic programming language and then translating
    symbolic code into the numeric format that computers understand. Dozens, if not
    hundreds, high-level languages exist, each with its unique features.


    Among high-level languages, two broad categories exist:


    **Compiled Languages** Programs convert (or compile) a program written in a high-level
    language from its original source code—typically a few seconds to several hours—into
    machine code. The compilation process can take some time, depending on the size
    of the program and the speed of the computer. Compilation can also fail because
    of errors in the program. When the compilation succeeds, the resulting machine
    code executes quickly.


    **Interpreted Languages** Programs written in interpreted languages are converted
    to machine code at the time they''re run by a program known as an *interpreter*.
    The conversion happens on a line-by-line basis. That is, the program is never
    completely converted to machine code; the interpreter figures out what each line
    does and does that one thing. This means that interpreted programs run much more
    slowly than compiled programs. The advantage is that interpreted programs are
    easier to develop, since you don''t need to deall'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Managing Programming Languages


    with the compilation process. Interpreted programs are also easy to modify; just
    open the program file in a text editor and save it back. This feature makes interpreted
    languages useful for helping with system startup tasks that system administrators
    might want to change—administrators make and test changes quickly.


    # Programming in Assembly Language


    In compiled and interpreted languages, another option is assembly language. This
    language is with a simple one-to-one correspondence between machine code numbers
    and the symbols that the programmer uses. Assembly language is very lowlevel,
    which means that a skilled assembly programmer can produce compact and efficient
    programs. Assembly language is not portable; it takes a lot of effort to convert
    a program written for, say, the x86-64 CPU to run on an ARM processor. Writing
    assembly language is also harder than writing programs in high-level languages.
    For these reasons, assembly programs have become rarer as computers have become
    more powerful; the speed and size advantages of assembly language aren''t very
    compelling for purposes in the early 21st century.


    In theory, most languages can be implemented either compiled or interpreted. In
    practice, though, languages are commonly used in one form or the other. Some languages
    don''t fit neatly into either category. See the "Programming in Assembly Language"
    sidebar for one important exception. Some others fall into an in-between-category,
    which is compiled from source code into a platform-independent form that must
    be interpreted.


    # Identifying Common Programming Languages


    Linux supports a wide range of programming languages, including the following:


    Assembly As noted earlier, this low-level language can produce efficient programs,
    but it is difficult to write and is not portable. In fact, referring to assembly
    as if it were one language is a bit misleading, since each CPU architecture has
    its own assembly language.


    C is the most important compiled language for Linux, since most of the Linux kernel,
    as well as a huge number of Linux applications, are written in C. C can produce
    efficient code, but it is also easy to write programs in C because it lacks error-checking
    features that are common in other languages. C source code files typically have
    filenames that end in .c The .c files are the main source code files, whereas
    the .h files are header files, which contain short definitions of the functions
    in the c files, for reference by other files in a program. A large program can
    consist of dozens, not hundreds or thousands, of individual source code files.
    In Linux, C programs are generally compiled with the gcc program, which is part
    of the GNU Compiler Collection (GCC) package.


    Certification Objective'
