- pgno: 370
  md: '# Basic Network Troubleshooting


    %enp0s tells the system to send the ping packets out the enp0s network interface
    for the link local address.


    These days, many hosts do not support ICMP packets because they can be used to
    create a denial-of-service (DOS) attack against the host. Don''t be surprised
    if you try to ping a remote host and receive no responses.


    ![](img/85a8584ad3f3bd69446d00a129bba855_370_0.png)


    # Finding Host Information


    Sometimes the problem isn''t with network connectivity but with the DNS host system.
    You can test a host name using the *host* command:


    ![](img/85a8584ad3f3bd69446d00a129bba855_370_1.png)


    ```

    $ host www.linux.org

    www.linux.org is an alias for linux.org.

    linux.org has address 107.170.40.56

    linux.org mail is handled by 20 mx.iqemail.net.

    $

    ```


    The host command queries the DNS server to determine the IP addresses assigned
    to the specified host name. Some hosts are supported by multiple servers in a
    load-balancing configuration. The host command will display all the IP addresses
    associated with those servers:


    ```

    $ host www.google.com

    www.google.com has address 74.125.138.104

    www.google.com has address 74.125.138.105

    www.google.com has address 74.125.138.147

    www.google.com has address 74.125.138.99

    www.google.com has address 74.125.138.103

    www.google.com has address 74.125.138.106

    www.google.com has IPv6 2607:f8b0:4002:c8cc::67

    $

    ```


    You can also specify an IP address for the host command and it will attempt to
    find the host name with it:


    ```

    $ host 107.170.40.56

    56.40.170.107-in.arpa domain name pointer idig11.iqection.com.

    $

    ```


    Notice, though, that often an IP address will resolve to a generic server host
    name hosts the website and not the website alias, as is the case with the www.linux.org
    address.'
  merge: -1
