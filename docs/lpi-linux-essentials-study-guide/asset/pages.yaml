    # Editing Files with vi


    ![](img/85a8584ad3f3bd69446d00a129bba855_263_0.png)


    vi was the first-screen text editor for Unix. It was designed to be small enough
    to fit on the old-fashioned, tiny, floppy-based boot systems. Later, a new version
    with several improvements was created and called "vi improved" or "vim". Even
    most Linux distributions ship with vi, it is still referred to as the vi editor.
    vi is upward compatible with the vi editor, and command to launch vi is typically—though
    some distributions have a vi command instead. The information presented in this
    chapter applies to both vi and vim.


    Although the vi editor is useful for editing configuration files, it shines in
    editing program files, such as shell scripts. Thus, you will benefit from learning
    the vi editor, though it is considered by many to be the most complicated editor
    to use.


