    reorganize by by combining files into one, and lets you view sample files. If
    you need to view only a portion of a file, the head and tail programs are better
    to use. You can redirect such output into grep (or other programs) by using redirection
    operators, and may command-line tools and techniques well on such reduction. The
    tar and zip programs both enable you to create archives that hold many other files.
    In the tarballs that tar creates are a common means of distributing source code
    and even binary programs between Linux computers. The tar command uses xz, gzip,
    and bzip2 compression for creating tarballs. However, these utilities are available
    for use lossless file compression as well.


    # Exam Essentials


    Describe using basic regular expressions. Regular expressions are used with programs,
    such as grep, to match data with patterns. Bracket expressions are characters
    enclosed in square brackets ([). The brackets represent a single character and
    that may match any one character within the brackets. A variation of bracket expressions
    is the range expression, where you designate a range of potential matches by using
    the first and last character with a dash between them, such as [a-z]. When you
    need to match a single character but that character can be anything, use a question
    mark (?) instead of a bracket expression. If the pattern you are searching for
    is at the beginning of a text line, use a caret (^) before the pattern. If it
    is at the end of the line, tack a dollar sign ($) after the pattern''s end. To
    specify a pattern that can match with any string, use the dot asterisk (*).'
