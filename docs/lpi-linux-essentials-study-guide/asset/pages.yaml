  md: 'source software secret, which means that users can''t normally make changes
    to the software except to alter configuration settings that the software supports.
    In the past, commercial software was sold in stores or by mail order, but today
    it''s often sold via downloads from the Internet. Redistributing commercial software
    is generally illegal. Microsoft Windows and Microsoft Office are both common examples
    of commercial software.


    **Shareware Software** From a legal perspective, shareware software is similar
    to commercial that it is copyrighted and the author asks for payment. The difference
    is that shareware is distributed on the Internet or in other ways and "sold" on
    an open system—if you use the software beyond a trial period, you''re expected
    to pay the author. Shareware was common in 1991 and is still available today,
    but it''s much rarer.


    **Freeware** Freeware, like shareware, is available for free. Unlike shareware
    authors, the authors of freeware don''t ask for payment. Sometimes, freeware is
    a stripped-down version of a more complete commercial program. At other times,
    the authors make it free to promote another product. Examples include Windows
    drivers for hardware devices or the Adobe Reader program for reading Portable
    Document Format (PDF). As with commercial and shareware programs, freeware requires
    some cost.


    > Freeware should not be confused with free software, which is closely related
    to open source software. Chapter 2, "Understanding Software Licensing," describes
    freeware in more detail.


    **Open Source Software** Open source software is defined by a set of 10 principles,
    available at opensource.org/docs/osd. The most important of these principles are:
    The user has the right to redistribute the program, the source code must be made
    available, and the user has the right to make and distribute changed versions
    of the program. These principles mean that users can alter open source programs
    to suit their own needs, in ways or for purposes not supported by the original
    author.


    Variants within each of these categories exist, as well as hybrids that don''t
    fit into any category. For instance, the Open Source Initiative maintains a list
    of licenses that it has approved fulfilling its criteria (opensource.org/licenses);
    however, developers sometimes release software using obscure licenses or using
    licenses that impose conditions that run aoul of one of the more obscure Open
    Source Initiative rules. Such software is technically not open source, but it
    might be better to close to open source than to another.


    Chapter 2 covers specific open source licenses in greater detail.'
