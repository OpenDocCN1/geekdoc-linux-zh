    You can switch back and forth from your text-mode login and your GUI session using
    Ctrl+Alt+Fn keystrokes. You can also initiate multiple text-mode logins and switch
    between them in the same way. This feature can be handy if you''re trying to debug
    a problem related to the GUI.


    When you''re done with your text-mode session, type **exit** to terminate it.
    You can also type **logout** to end your session.


    # Running Programs


    After you''ve opened a terminal or logged in using a text-mode tool, you should
    know how to use the shell. The Bash shell includes a few built-in commands, but
    much of what you''ll do in a shell involves running other programs. As described
    in the following sections, you can run text-mode and GUI programs. Sometimes you
    might want to run a program in the background and retain use of the shell for
    other purposes, which can be convenient in many situations.'
