- pgno: 307
  md: '# Summary


    Accounts are critical to Linux''s normal functioning. Ordinarily, most of the
    tasks that you perform on a Linux computer require the privileges of a standard
    user, you''ll use your own account to handle these tasks. You can use tools such
    as whoami, id, who and to identify your account and determine who else might be
    using the computer. Occasionally, you''ll need to perform administrative tasks
    that require the root account''s privileges, which can read and write any ordinary
    file, access hardware in a low-level way, reconfigure the network, and perform
    other tasks that ordinary users aren''t allowed to do. Because root is so powerful,
    you should use that power sparingly and be extremely careful when you use it,
    lest a typo or other accident cause serious problems.


    # Exam Essentials


    Explain the difference between various Linux accounts. User accounts generally
    fall into three categories: the root user, system accounts, and system accounts.
    The root account has a UID of 0 and is often disabled on modern Linux distributions
    so that no one can directly log into it. This is due to the fact that root can
    read and write every file on the computer, making it a rather dangerous user.
    In addition, if multiple individuals use the root account, it sets up an insecure
    regulation environment.


    Users are given each account on the system to perform productive work. They typically
    have regular privileges, but those who perform special administrative system duties
    may have access to super user privileges through commands such as sudo. These
    accounts have UIDs that start at 500 or 1000 depending on the distribution configuration.


    System accounts help keep the computer running. You cannot log into these accounts,
    because they lock passwords, and their default shell is often set to /sbin/nologin.
    The UIDs for system accounts are numbers that are lower than the configured base
    for user accounts.


    Describe the files involved in Linux account configuration. The /etc/passwd file
    has a record for each account on the system. These records consist of the following
    fields: username-password, UID, GID, comment, home directory, and default shell.


    The /etc/shadow file contains the following fields: username, salted and hashed
    password (if a password is set for the account), the last password change in Epoch
    format, days until a password modification is allowed, days before a password
    change is required, number of days warning before the password expires, days between
    account expiration and deactiv-tion, account expiration date, and a special flag.'
  merge: -1
