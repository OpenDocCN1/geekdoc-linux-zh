    created in 1991, and in 2007 the GPL 3 was made public. The GPL3 is different
    than GPLv2 as it contains clauses intended to combat use of hardware restrictions.
    The Lesser GPL (LGPL) derived from the GPL is often used by developers for software
    libraries. The BSD license, which allows code modifications to be distributed
    under other licenses, is primarily used by the BSD OS. The other short MIT license
    is associated with the X Window System, which also allows code modifications to
    be distributed under other licenses. The Apache license, first created in 1995,
    is similar to the BSD and MIT licenses in its handling of software modification
    licensing.'
