- pgno: 139
  md: '# Chapter 5 ■ Getting to Know the Command Line


    Before you consult them, though, you should understand their purpose, and therefore
    their capabilities and limitations. With that information in mind, you can begin
    searching for help in the man page system, including searching for man pages by
    section or searching for keywords using the whatis or apropos utility. When you''re
    reading a man page, knowing its structure can help you quickly locate the information
    you need.


    # Understanding the Purpose of Man Pages


    Linux man pages can be an extremely helpful resource, unlike the help systems
    in some OS, man pages are not supposed to be tutorial in nature. They are intended
    as quick references to help somebody who''s already somewhat familiar with a configuration
    file, or other OS feature. They are most useful when you need to know the options
    to use with a command, the name of an option in a configuration file, or similar
    details. If you need to learn a new program from scratch, other documentation
    is often a better choice.


    Manual pages also vary greatly in quality; some are very good, but others are
    frustratingly, and occasionally inaccurate. For the most part, the programmers
    who wrote the program in question write them.


    > The upcoming section "Finding Additional Documentation" describes how to locate
    documentation that is more tutorial than the man pages.


    In this book, many Linux commands are described in a tutorial style. However,
    information is often omitted on obscure options, subprogram effects, and so on.
    In principle, man pages should cover such finer points. This makes man pages an
    excellent resource for learning more about the commands described in this book,
    you should need to go further.


    # Locating Man Pages by Section Number


    In the simplest case, you can read a man page by typing man followed by the name
    of a command, configuration file, system call, or other keyword. Each man page
    falls into one of nine categories, as summarized in Table 5.2.


    # **TABLE 5.2** Manual sections


    | Section number | Description |

    | --- | --- |

    | 1 | Executable programs and shell commands |

    | 2 | System calls provided by the kernel |

    | 3 | Library calls provided by program libraries |'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Section number Description


    | Section number | Description |

    | 4 | Device files (usually stored in /dev) |

    | 5 | File formats |

    | 6 | Games |

    | 7 | Miscellaneous (macro packages, conventions, and so on) |

    | 8 | System administration commands (programs run mostly or exclusively by root)
    |

    | 9 | Kernel routines |


    If you use keywords with man, be aware that they can lead to entries in multiple
    sections. In such instances, the man utility returns the entry in the section
    by a search order typically specified by the SECTION setting in the /etc/mandb.conf
    or the /etc/manpath.config file (depending on your distribution).


    > The precise man search order defined by SECTION varies one distribution to another,
    but section 1 is usually searched first, followed by section 8 and then the others.


    You can override this default behavior by passing a section number before the
    keyword. For instance, typing **man password** returns information from manual
    section 1 on the password command, but typing **man 5 password** returns information
    from manual section 5 on the /etc/passwd file format. Some pages have entries
    in sections with variant numbers that include the suffix p, as in section 1p.
    This refers to the Portable Operating System Interface (POSIX) standard man pages,
    as opposed to the Linux man pages, which are, for most part, written by the people
    who wrote the open source Linux programs that the man pages describe.


    If you''re starting out with Linux, chances are that you''ll be most interested
    in section 1, executable programs and commands, which is also useful the first
    section in the man page search order—although section 6, games, can also be interesting
    if you have the time to spare. As you move on to more advanced and administrative
    tasks, you''ll find sections 4, 5, and 8 important for device files, file formats,
    and programs by root. Sections 2, 3, and 9, covering calls and kernel routines,
    are of most interest to programmers.


    Get help on using and reading the man pages by typing **man man** at the command
    line.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Searching for a Man Page


    One problem with man pages is locating help on a topic can be hard unless you
    know the name of the command, system call, or file that you want to use. Frankly,
    methods of searching the manual database exist and can help lead you to an appropriate
    man page:


    **Summary Search** what searches searches information contained in man pages for
    the keyword you specify. The command returns a one-line summary for every matching
    page. (This summary is the Name section, described shortly, in "Reading Pages.")
    You can then use this information to locate and read the man page that you need.
    This command `whatis passed` returns lines confirming the existence of the man
    page entries for various sections.


    **Through Search** the apropos command performs a thorough search, of both the
    Name and Description sections of man pages. The result looks much like the results
    of a search, except that it is likely to contain many more results. In fact, an
    apropos search on a very common keyword, as the, is likely to return so many hits
    as make the search useless. A search on a less common word is likely to be more
    useful. For instance, typing `apropos passed` may return 16 entries on a system,
    including those for gpwpass, bpasswd, and uspasswd—all various password utilities
    or tools involving password files.


    > The -k option for man is equivalent to apropos. Thus you can either apropos
    keyword or man -k keyword.


    If you receive a "nothing appropriate" response from either the whatis or the
    apropos, typically you need to change the command that you are using. However,
    it may indicate that the man database has not been updated. This is typically
    true on a fresh Linux installation or after a new program is installed. You can
    update the man database manually by using super user privileges and typing the
    command makewhatis (on Linux distributions) or mand. (Using super user privileges
    is described in Chapter 12


    > Details of what man pages are available vary from one distribution to another.
    This will affect the results of both whatis and apropos searches.


    # Reading Man Pages


    The convention for man pages is a concise style that employs several sections,
    each of which has a particular purpose. This organization can help locate the
    information that you'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Getting Help Using Man Pages


    need—you might need information that you know is in a particular section, in which
    case you can quickly scan down to that section. Common sections include the following:


    **Name** A man page begins with a statement of the command, call, or for that''s
    described, along with a few words of explanation. For instance, the man page for
    man (section 1) has a Name that describes man an interface to the on-line reference
    manuals.


    **Synopsis** The synopsis provides a brief description of how a command is used.
    Optional parameters appear in square brackets, such as [-f]. An ellipsis (...)
    denotes an set of repeated elements, such as multiple filenames if a command takes
    one or more as options. Some commands provide multiple synonyms, indicating that
    certain options are contingent on others.


    **Description** The description is an English-language summary of what the command,
    file, or other element does. The description can vary from a short summary to
    many pages in length.


    **Options** This section expands on the options outlined in the Synopsis. Typically,
    each option appears in a list, with a one-paragraph explanation indented just
    below it.


    **Files** This section lists files that are associated with the man page''s subject.
    Typically, these might be configuration files for a server or other program, related
    configuration files, files the page''s subject modifies, and so on.


    **See Also** This section points to related information in the man system, typically
    with a section number appended. For instance, the man page for man refers to the
    man pages for apro, what is, and several other tools.


    **Bugs** Many man pages provide a Bugs section in which the author describes any
    known bugs or limitations, or states that no known bugs exist.


    **History** Some man pages provide a summary of the program''s history, citing
    project start dates and milestones between them and the current version. This
    history isn''t nearly comprehensive as the file that change with most programs''
    source code.


    **Author** Most man pages end with an Author section, which tells you how to contact
    the author of the program.


    Specific man pages may contain fewer, more, or different sections than these.
    For instance, the Synopsis section is typically omitted from man pages on configuration
    files. Manual pages with particularly verbose descriptions often split the Description
    into several parts, each with its own title.


    Figure 5.6 shows a typical man page in a terminal window. As you can see, section
    names appear in bold uppercase letters, making it easy to locate relevant sections
    as you page through the document.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Chapter 5 ■ Getting to the Command Line


    FIGURE 5.6 The formatting of man pages helps you locate information.


    ![](img/85a8584ad3f3bd69446d00a129bba855_143_0.png)


    By default, use the less program to enable you to move back and

    forth in the document, and when you''re done, exit the man pages. The\upcoming
    section, "Using less," describes this program in detail.


    # Using less


    Linux''s man system uses a program called less to display information. This program
    is

    a pager, which displays a text file one screen (that is, one page) at a time.
    You can move

    forward or backward through the file, move to a specific line, and search for
    information.

    Table 5.3 summarizes the most common ways of moving around a document using less.


    An earlier pager was known as more, but less adds more features. This

    peculiar example is an example of geek humor.


    # TABLE 5.3 less file-navigation commands


    | Keystroke | Action |

    |---|---|

    | H | Displays help on using less |

    | Page Down, spacebar, Ctrl+V, F, or Ctrl+F | Moves down one screen in the document
    |

    | Page Up, Esc+V, B, or Ctrl+B | Moves up one screen in the document |'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Getting Help Using Man Pages


    | Keystroke | Action |

    |---|---|

    | Down arrow, Enter, Ctrl+N, E, Ctrl+E, j, or Ctrl+J | Moves down one line in
    the document |

    | Up arrow, Ctrl+Y, Ctrl+P, or Ctrl+K | Moves up one line in the document |

    | xg, x<, or x< | Goes to line x in the document—for instance, typing 100g displays
    the 100th line. If x is omitted, the default is 1. |

    | xG, x>, or x Esc> | Goes to line x in the document. If x is omitted, it is the
    last line of the document. |

    | xp or x% | Goes to the point x percent through the document—for instance, typing
    50p goes to the document''s halfway point |

    | /pattern | Searches for pattern in the document, starting at the current location.
    For instance, typing /BUGS searches for the string BUGS. |

    | ?pattern | Performs a backward search, locating instances of pattern before
    the current location |

    | N or / | Repeats the previous search |

    | Q, :Q, or ZZ | Quits from the less pager |


    > NOTE The notation Esc+V refers to pressing the Esc key followed by the V key.


    Table 5.3 presents a small fraction of the commands available in less. To learn
    more about less, you can read its man page:


    +   1. Log into the console in text mode or open a terminal window.

    2. Type **man less** . This action opens the page for the less pager.

    3. Read the first line of text. When reading the last word at the bottom of the
    screen, press the spacebar key. This moves the display to the next page so that
    you can continue reading. (You could use the PageDown key or others noted in Table
    5.3 instead of the spacebar if you prefer. Similar substitutions are possible
    in the subsequent steps.)'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Chapter 5 ■ Getting to Know the Command Line


    +   4. Press the up arrow key. This moves the display up a single line, which
    is useful if you need to reread just a few words from the end of the last page.


    +   5. Press the down arrow key. As you might expect, it moves the display down
    one line.


    +   6. Press the Esc followed by the V key. This moves the display back one page.


    +   7. Press Shift+G to go to the end of the man page.


    +   8. Press the G key (without using the Shift key) to move back to the start
    of the man page.


    +   9. Type /OPTIONS to locate the Options section. Chances are that your first
    hits will be to references to this section, rather than to the Options section
    itself.


    +   10. Repeatedly press the N key until you find the Options section.


    +   11. Press the Q to quit from less, and therefore from reading the man page.


    ![](img/85a8584ad3f3bd69446d00a129bba855_145_0.png)


    Some implementations search in a case-sensitive manner, but others are case-insensitive.
    In step 9, searching on /options (in lowercase) to determine which is the situation
    with your implementation.


    Of course, when you read man pages, you''re unlikely to use these exact options;
    you''ll use whatever you need to find the content that interests you. The key
    is to familiarize yourself with a few important features so you can make effective
    use of less to read man pages and other documents.


    Although less is important for reading man pages, you can also use it to read
    other text-mode documents, such as README files that come with many programs or
    other plain-text documents. To use less in this way, type its name followed by
    the filename of the file that you want to read, as in less READAME a document.
    You can use all of the actions summarized in Table 5.3 (or by less''s man page)
    on documents read in this way, just as you can on man pages.


    # Getting Using Info Pages


    The man page system is typical on Unix-like OSs, including Linux, but it''s also
    quite old and is therefore limited. A newer documentation system, known as info
    pages, is also available. The next few pages describe how info fills gaps in the
    man system and how to use info pages.


    Certification Objective


    # Understanding the Purpose of Info Pages


    The basic design of man pages dates back decades, so it predates some important
    developments in managing information. Most notably, man pages are not hyperlinked.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Getting Help Using Info Pages


    Although a See Also is common in man pages, you can''t select one of these items
    to read the relevant man page directly; you must quit the man system and type
    a new command to read the new page. This lack of hyperlinking also makes navigating
    through a large page awkward. You can use text searches to locate information
    that you desire, but these often find the wrong text—or if you mistype a string,
    your search might fail completely.


    The goal of info pages is to overcome these problems by supporting hyperlinking.
    Each info page is known as a *node*, and the info system as a whole is an interrelated
    set of nodes, similar to the World Wide Web (WWW) of the Internet. An individual
    program''s documentation may be split across multiple nodes, which can make each
    node easier to locate and search—but if you need to search for information and
    you''re not sure in which node resides, you need to search nodes.


    Nodes are organized on *levels*, which are similar to the levels of organization
    in a book. This book, for instance, has two levels of headings within each chapter.
    Similarly, the info page for a program is likely to have one main node, similar
    to a chapter, with multiple nodes at a lower level, similar to chapter headings.
    Some programs'' info pages include further levels to organize information.


    In terms of writing style, info pages are similar to man pages—they are terse
    but comprehensive descriptions of their topics—intended for people who are at
    least familiar with the programs in question. If you''re just starting out with
    a program, other types of documentation (described later, in "Finding Additional
    Documentation") may be a better choice.


    > /usr/doc and /usr/share/doc directories, if available on your distribution,
    often contain a great deal of useful information. If you cannot find the information
    you are seeking in the man or info pages, look in these directories.


    Broadly speaking, programs sponsored by the Free Software Foundation (FSF) use
    info pages in reference to man pages. Many FSF programs now ship with minimal
    man pages that point the user to the programs'' info pages. Non-FSF programmers
    have slower to embrace info pages; many programs do not ship with info pages at
    all, and instead rely on traditional man pages. The info browser can read and
    display man pages, so using info exclusively can be an effective strategy for
    reading Linux''s standard documentation.


    # Reading Info Pages


    The tool for reading info pages is called info. To use it, you type **info** followed
    by the topic, as in **info info** to learn about the info system itself. If you''re
    in the info system, you can use a number of keystrokes, summarized in Table 5.4,
    to move around a document.


    ![](img/85a8584ad3f3bd69446d00a129bba855_146_0.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# TABLE 5.4 info file-navigation commands


    | Keystroke | Action |

    |---|---|

    | ? | Displays help information |

    | N | Moves to the next node in a linked series of nodes on a single hierarchical
    level. This action may be required if the author intended several nodes to be
    read in a particular sequence. |

    | P | Moves back in a series of nodes on a single hierarchical level. This can
    be handy if you''ve moved forward in such a series but find that you need to review
    earlier material. |

    | U | Moves up one level in the hierarchy |

    | Arrow keys | Moves the cursor around the screen, enabling you to select links
    or scroll the screen |

    | Page Up, Page Down | These keys scroll up and down within a single node, respectively.
    (The standard in browser implements many of the more arcane commands used by less
    and outlined in Table 5.3.) |

    | Enter | Moves to a new node after you''ve selected it. Links are indicated by
    asterisks (*) to the left of your names. |

    | L | Displays the last page that you read. This action can move you up, down,
    or sideways in the info tree hierarchy. |

    | Q | Exits the info page system |


    As an example of info pages used in, try the following:


