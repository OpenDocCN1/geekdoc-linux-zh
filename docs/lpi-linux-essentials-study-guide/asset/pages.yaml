  md: '![](img/85a8584ad3f3bd69446d00a129bba855_273_0.png)


    A script is a program written in an interpreted language, typically associated
    with a shell or other program whose primary purpose is something other than as
    an interpreted language.


    In Linux, many scripts are shell scripts, which are associated with Bash or another
    shell. (If you''re familiar with batch files in DOS or Windows, scripts serve
    a similar purpose.) You can write shell scripts to help automate repetitive tasks
    or to perform more complex tasks. Many of Linux''s startup functions are performed
    by scripts, so mastering scripting will help you manage the startup process.


    This chapter covers Bash scripts, with the task of creating a new script file.
    It describes several important scripting features that help you to perform progressively
    complex scripting.


    Like any programming task, shell scripting can be quite complex. This chapter
    barely scratches the surface of what you can accomplish through shell scripting.
    Consult a book on the topic, such as our Linux Command Line and Shell Scripting
    Bible, Third Edition (Wiley, 2015), for more information.


    ![](img/85a8584ad3f3bd69446d00a129bba855_273_1.png)


    # Beginning a Shell Script


    Shell scripts are plain-text files, so you can edit them in text editors as vi,
    nano, or pico, as described in Chapter 10, "Editing Files." You shouldn''t use
    standard word processing programs, such as LibreOffice Writer, to create scripts
    as they default insert binary code into the final document to indicate fonts,
    font sizes, and special characters. These binary codes confuse the Linux shell.


    A shell script begins with a line that identifies the task you''s to run, it as
    the following:


    ```

    #bin/bash

    ```


    The first two characters are a special code that tells the Linux kernel that this
    is a script and to use the rest of the line as a pathname to the program that
    interprets it. (This line is sometimes the shebang, hasbang, hasplining, or pound
    bang line.) Shell scripting languages use a hash character (#) as a comment character,
    so the script utility ignores this line, although the kernel doesn''t. On most
    systems, /bin/sh is a symbolic link that points to /bin/bash, but it can point
    to some other shell. Specifying the script as using /bin/bash'
  merge: -1
  img_proc: true
