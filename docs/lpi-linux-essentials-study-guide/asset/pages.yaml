  md: '# Creating New Accounts


    | Option name | Option abbreviation | Effect |

    |---|---|---|

    | --inactive | -f | Sets the number of days after a password expires, after which
    the account becomes completely disabled. A value of -1 disables this feature and
    is the default. |

    | --gid default-group | -g | Sets the name or GID of the user''s default group.
    The default for this is a new group named after the user. |

    | --groups group[...] | -G | Sets the names of groups to which the user belongs—more
    than one may be specified by separating commas. |

    | --create-home | -m | When included with useradd, creates a home directory for
    the user. This option is typically enabled by default. |

    | --skel skeleton-dir | -k | Normally, default user configuration files are copied
    from /etc/skel, you may specify another template directory with this option, which
    is valid only in conjunction with -m. |

    | None | -M | Forces the system not to automatically create a home directory.
    |

    | --shell shell | -s | Sets the name of the user''s default login shell with this
