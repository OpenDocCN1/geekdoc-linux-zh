- pgno: 400
  md: '8. The ifconfig command must specify the network interface, the IP address,
    then the netmask option before the netmask address. You can use the up or down
    option to place the network card in an active or inactive state by default, but
    it''s not required. Option A is the only option that uses the correct values in
    the correct order. Option C is close but fails to specify the network interface.
    Option D and E fail to list the necessary configuration settings.


    9. The iflist command displays the available wireless network access points detected
    by the wireless network card, so option A is correct. The ifconfig configures
    the network card to connect to a specific access point but doesn''t list all of
    the detected access points, making option B incorrect. Option C specifies the
    ifconfig command, which is used to assign an IP address to a wireless network
    card, but doesn''t list the access points. The ip command specified in option
    D likewise can be used to set the IP address of the card but list IP addresses
    so that you can find duplicate IP addresses. Option E, the arp command, maps hardware
    addresses to IP addresses on your network, but it doesn''t list the wireless access
    points.


    10. The ip command allows you to both display and set the IP address, netmask,
    and default router values for a network interface, so option E is correct. The
    ifconfig command can set the IP address and netmask values, but not the default
    router. The wifi command can set the wireless access point settings, and the router
    command is used to set the default router but not the IP address or netmask values.
    The ifup command only activates the network interface—it can''t set the address
    values.'
