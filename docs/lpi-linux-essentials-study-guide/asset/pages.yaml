- pgno: 88
  md: '# Using Open Source Software


    The basic idea behind open source software is that software developed in a transparent
    manner is likely to be superior to software developed in a closed manner. This
    superiority (and arguments against it) comes in several ways:


    **Better Code** Exposing source code to the community at many means that it can
    be reviewed, and improved by any interested party. Obscure bugs might be found
    and squashed when they might linger and cause problems in a closed-source product.
    However, the validity of this claim is not well supported by research, and smaller
    projects might not gain much in the value of interest from other programmers,
    or they might not benefit from outside source code.


    **More Flexibility** By providing users with the source code, an open source project
    allows users to customize the software for their own needs. If users submit changes
    back to those individuals who maintain the software or release them as a new branch
    of the project, then everyone can benefit from such changes. Of course, critics
    would argue that this flexibility is only a benefit to those with the necessary
    skill and time to make such changes or with the money to hire someone to do it.


    **Lack of Cost** Although the open source definition does not forbid free of software,
    the redistribution requirements mean that open source ends up being available
    free of charge. If you want support, though, you may need to purchase a support
    contract, which can reduce or eliminate the cost benefits.


    **Lack of Vendor-Lock** The developers of some proprietary products, and particularly
    popular ones, can make it difficult for competing products by using proprietary
    file formats or standards and by not supporting more open standards. Open source
    tools are less subject to such problems, since they can be modified to support
    open standards, even if they didn''t initially do so. As a practical matter, though,
    even proprietary file formats and protocols are usually reverse-engineered, so
    vendor lockin ends up being a temporary rather than a permanent one.


    Of course, within the Linux community general consensus is that each of these
    factors is a real point in favor of Linux and of open source software in general;
    the downsides are generally regarded as minor when compared to the advantages.
    In the end, you''ll need to make up your own mind on these matters after using
    different types of software.


    # Linux as a Software Integrator


    After Unix was created, the OS fragmented into a set of loosely affiliated OSs.
    These OS were incompatible on the binary level but less comparable than the source
    code level. This is still true today. You can take the same program and compile
    it for FreeBSD, macOS, and Linux, and it will work on all three platforms—but
    the compiled binaries for one platform won''t work on the others.


    There are exceptions to this rule. Some programs rely on features that are available
    on just some Unix-like OSs. Others have quirks that make it impossible to compile
    them on some OSs. If a program falls into disuse, it may become unusable on newer
    OSs because it'
