    +   - Read the pages for the following: man, less, where, find, and locate. View
    their Synopsis section to understand their command syntax. What have you learned
    about these commands that go beyond the descriptions in this book?


    +   - Search /usr/doc for documentation on important programs that you use frequently,
    such as the GIMP, Firefox, or GNOME.


    +   - Check your distribution''s website, or perform a web search, find a web
    forum that supports your distribution. Read some of the discussion threads to
    get a feel for some of the topics that come up.


    # Summary


    Command lines are powerful tools in Linux; they''re the basis on which many of
    the friend-GUI tools are built. They can be accessed without the help of a GUI,
    and they can be scripted. To use the text-mode tools described in other chapters
    of this book, you should be familiar with the basics of a Linux shell. These include
    how to start a shell, and how to use a shell''s time-saving features.


    When you need to learn about a program to get it effectively, or solve a problem
    with a misbehaving program, getting help is often necessary. Linux provides several
    documentation resources for such situations. The first of these is the man system,
    which documents most text-mode commands, configuration files, and system calls.
    The info page system is similar to the man pages but employ a more advanced hyperthreaded
    file format. If you need tutorial information than the man or info pages provide,
    you can obtain help in the form of extended official user manuals, web pages,
    and other documents, both on your computer and on the Internet. Finally, interacting
    with experts can help resolve a problem, so you can use numerous in-person and
    online resources to get the help you need.


    # Exam Essentials


    Describe how to reach the command line. Most Linux distributions have default
    GUI terminal programs that allow you to reach the command line. Some distributions
    may open a terminal application with the GUI by pressing Ctrl+Alt+T, whereas others
    have icons'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'on their desktop or terminal application names within their menu system. To
    reach a vir-ual terminal, which is not within the desktop environment, press Ctrl+Alt+Fn
    (where Fn is a function typically F2 and F6), and log in to reach the command
    line. The command-prompt is provided by the shell and often ends in a dollar sign
    ($) for regular users or a hash mark (#) for the root user.


    # Explain how to run programs at the command line.


    If an executable program resides in a PATH directory, you can run it by typing
    its name, along with any needed options or required arguments. If the program
    is not located in a PATH directory, you must run it by entering its directory
    location as well as its name and any needed options or required arguments.


    Outline using basic features. Command completion speeds your way through the typing
    of commands and filenames. To use command completion, you type part of a command
    or filename, and then press the Tab key. As long as there is only one file or
    command whose name begins with what you typed, the Bash shell fills in the rest.
    The Bash history feature reduces your time at the command line. You can recall
    the most recent command with the up arrow key, view all the commands with the
    history utility, and reissue any command stored there.


    Detail getting help using the man pages. The manual (man) pages are rather terse
    documentation aimed for those who already know the item described. They summarize
    commands, configuration files, and other implemented features on a Linux system.
    By default, the ''less pager is used to display information within the man pages.
    You can perform thorough searches for keywords stored within the man pages using
    the apropos utility or its equivalent—man -k. Conducting a summary search is accomplished
    with the what''is command.


    Summarize getting help using the info pages. The info pages are as brief as the
    man pages but use a series of nodes (pages) that are hyperlinked and organized
    on levels. You can get help on how to use the info pages and its browser by typing
    info info at the command line. Interestingly, the info browser will also allow
    you to read man pages.'
  merge: -1
  img_proc: true
