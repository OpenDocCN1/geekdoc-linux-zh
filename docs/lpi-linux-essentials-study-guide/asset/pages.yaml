- pgno: 109
  md: '# Chapter 4 ■ Using Common Linux Programs


    GIMP The GNU Manipulation Program (GIMP (gimp.org)) is a still-image manipulation
    program similar in broad strokes to Adobe Photoshop. (The GTK+ toolkit, which
