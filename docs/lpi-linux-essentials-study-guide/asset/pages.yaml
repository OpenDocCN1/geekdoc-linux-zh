- pgno: 321
  md: '# Chapter 13 • Creating Users and Groups


    On Debian-based distributions, such as Ubuntu and Linux Mint, you can use a friendlier
    front end to the useradd utility by typing adduser. Be aware that on some distributions,
    such as Fedora, the adduser command, if available, is not a front end to the useradd
    utility rather a link to it.


    Some of these options aren''t readily accessible when you are creating accounts
    using GUI tools, the details differ from one GUI utility to another. In some cases,
    options can be set in a GUI utility after the account has been created but not
    when creating it.

    A complete useradd command, including a few options, looks like this:


    ```

    $ useradd -m c "Noburn Washburne" -u 1006 hwash

    [sudo] password for christine:

    ```


    This example creates an account with username hwash, a home directory, a comment
    field containing the user''s full name, and a UID of 1006. Notice in the preceding
    example the sudo command was used to obtain user privileges, a requirement to
    complete this command successfully.


    You may want to specify a UID to keep these values synchronized across computers
    that share files with the Network File System (NFS), which identifies ownership
    via UIDs.


    When you create an account with useradd, it will be in a locked state—the user
    will not be able to log in. To unlock it, you must use the password command, as
    described next, in "Modifying Accounts."


    You can add a password with the useradd command''s -p option. However, for security
    reasons, this is not recommended. It is better to use the password command, as
    described later in this chapter.


    Behind the scenes, useradd (or by extension its GUI front end) modifies the contents
    of the following files (described in detail in Chapter 12):


    +   - /etc/passwd

    - /etc/shadow

    - /etc/group


    If you use --create-home or -m (or this is the default for your distribution),
    the program creates a home directory and copies files from /etc/skel/ to that
    location. Creating an account will also usually create a mail spool file in which
    the user''s incoming email will be stored. (This file may go unused on many desktop
    systems, but it is important if you run mail server software on the computer.)
    You can see that useradd makes a few modifications to your computer''s files and
    directories in creating the account.'
