    2. Type **info**. You should see the top node for the info documentation appear.

    3. Read the main page, using the arrow keys or the PageDown key to view the entire
    page.

    4. Using the arrow keys, select the link to the Expert Info node near the bottom
    of the main page.

    5. Press the Enter key to view the Expert Info node.

    6. Press the U key to browse up one level—back to the main node.

    7. Browse to the Advanced node.'
