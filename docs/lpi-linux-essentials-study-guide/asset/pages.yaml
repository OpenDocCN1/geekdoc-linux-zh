- pgno: 83
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_83_0.png)


    You can frequently select a product or technology on purely pragmatic grounds—what
    OS works well for a given task, which software suite is the least expensive, and
    so on.


    Sometimes, though, understanding the principles and philosophy that underlie a
    technology can be useful, and knowing these might guide your choice.


    This is true of some Linux users; the open source model of Linux, which we introduced
    in Chapter 1, "Selecting an Operating System," has implications that can affect
    how Linux works. Furthermore, some in the Linux world are quite passionate about
    these principles. Whether or not you agree with these individuals, understanding
    their point of view can help you appreciate the Linux culture, which you''ll find
    in the workplace, online, at conferences, and so on.


    This chapter covers these issues, beginning with information on Linux''s origins
    and its development over time up to the present. We then describe open source
    principles and how they can affect an open source OS in the real world. Finally,
    we describe some of the roles in Linux can work—as an embedded OS, as a desktop
    or laptop OS, and as a server OS.


    # Linux Through the Ages


    Although Linux''s birth date of 1991 is recent by most historical standards, in
    the computer world 25 years is an eternity. Nevertheless, the software and culture
    in the early 1990s, and even before then, conveyed a legacy to today''s software
    world. After all, what we use is built atop the foundation that was created in
    the past. Thus, looking at how Linux originated will help you understand Linux
    as it exists.


    # Understanding Linux''s Origins


    In 1991, as is also true, computers were classified by their sizes and capabilities.
    Computers could belong to any of a handful of categories, ranging from desktop
    personal computers (PCs) to supercomputers. x86-based computers, which are the
    direct ancestors of today''s PCs, dominated the PC marketplace of 1991; however,
    other types of PCs were available, including Mac computers. Such computers generally
    used different CPUs and ran their own custom OSs.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Linux Through the Ages


    Computers today can be classified in much the same way as in 1991, although some
    details have changed. A notable addition is embedded computers, in smartphones.


    In 1991, most PCs ran Microsoft''s Disk Operating System (MS-DOS, PC-DOS, or DOS)
    was extremely limited by today''s standards; it was a single-tasking OS (it could
    run only one program at a time) that didn''t take full advantage of the memory
    or CPUs available at the time. The versions of Microsoft Windows available in
    1991 ran on top of DOS. Although the initial versions of Windows helped work around
    some of DOS''s limitations, they didn''t fundamentally fix any of them. These
    early versions of Windows employed cooperative multitasking, for instance, in
    which programs could voluntarily give CPU time to other programs. The DOS kernel
    could not control from a program that hogged CPU.


    Above the PC level, Unix was a common OS compared to Windows of that time, Unix
    was a sophisticated OS. Unix supported multiple accounts and provided true preemptive
    multitasking, in which the kernel could schedule CPU time for programs, if the
    programs didn''t voluntarily give up control. These features were practical necessities
    for many servers and for multiuser computers like minicomputers and mainframes.


    Unix was not the only multitask OS in 1991. Others, such as Virtual Memory System
    (VMS), were available. Unix is most relevant to Linux''s history, thought.


    As time progressed, the capabilities of each class of computer have grown. By
    most means, today''s PCs have the power of the min or the mainframes of 1991.
