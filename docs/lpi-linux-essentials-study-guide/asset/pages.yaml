    # # Managing Displays


    Linux provides two display modes: text-mode and GUI. A text-mode display is fairly
    straightforward and requires little or no management. GUI displays are more complex.
    In Linux, the X Window system (or X for short) manages the GUI display. This section
    describes what X is and how it interacts with common display hardware.


    # ## Understanding the Role of X


    Most people don''t give much thought to the software behind their computers''
    displays; it all works just. Of course, behind the scenes the task of managing
    the display is fairly complex. Of the tasks that the software must do, on any
    platform, include:


    +   - Initialize the video card, including set its resolution.


    +   - Allocate sections of the display to hold windows that belong to applications.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Managing Displays


    +   - Manage windows that overlap so that only the “topmost” window’s contents
    are displayed.

    - Manage a pointer that the user controls via a mouse or similar device.

    - Direct user input from a keyboard to whatever application is active.

    - Display text and shapes within windows at the request of user programs.

    - Manage the interiors of windows, such as displaying task and scroll bars.


    In Linux, the first six tasks are handled by X, but the seventh is handled by
    a program called a window manager and the eighth is handled by GUI libraries known
    as widget sets. The font display element of the sixth task is handled by X, but
    in recent years many programs have begun using a library called Xfr for this task.
    Thus, the job of handling the display is broken across several programs, although
    X handles most of the low-level tasks.


    Desktop environments include window managers, but window managers without desktop
    environments are also available.


    ![](img/85a8584ad3f3bd69446d00a129bba855_174_0.png)


    Modern Linux distributions use one of two popular X software packages:


    +   - X.org

    - Wayland


    Both software packages provide a version of X that can automatically detect your
    hardware—including the video card, monitor, keyboard, and mouse—and configure
    itself automatically. The result is that the software normally works properly
    without any explicit configuration. Sometimes, though, this autfiguration fails.
    When this happens, you must manually edit the X configuration files. For the X.org
    package, look in /etc/X11/xorg.conf file; for Wayland, the configuration settings
    are stored for each individual user account in the ~/.config/xsettings.ini file.
    If the X.org configuration file is missing, you can generate a sample file by
    typing the following command (with X not running) as root:


    ```

    # Xorg --configure

    ```


    ![](img/85a8584ad3f3bd69446d00a129bba855_174_1.png)


    Chapter 10, “Editing Files,” describes the name and Vi text-mode editors.


    The result is a newly file called /root/xorg.conf.new. You can copy this file
    to /etc/X11/xorg.conf and begin editing to suit your needs. This task is complex
    and beyond the scope of this book, but knowing the name of the file can help you
    get started—you can examine the file and locate additional documentation by searching
    on that name.'
