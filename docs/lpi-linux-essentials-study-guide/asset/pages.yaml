    # Using Conditional Expressions


    Scripting languages support several types of conditional expressions. These enable
    a script to perform one of several actions contingent on some condition—typically
    the value of a variable. One common command uses conditional expressions is if,
    which allows the system to take one of two actions depending on whether some condition
    is true. The conditional expression for the if appears in brackets after the if
    and can take many forms. Conditional expressions use options and operators to
    define just what condition to check. For instance, the condition:


    ```

