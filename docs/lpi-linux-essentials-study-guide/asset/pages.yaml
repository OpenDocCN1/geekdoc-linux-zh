- pgno: 359
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_359_0.png)


    These days it''s almost a necessity to have your Linux system connected to some
    type of network. Whether it''s the need to share files and printers on a local
    network, or the need to connect to the Internet to download updates and security
    patches, Linux systems have some type of network connection.


    This chapter looks at how to configure your Linux system to connect to a network,
    as well as how to troubleshoot network connections if things go wrong. There are
    a few different methods for configuring network setting in Linux, and you''ll
    need to know them all for the Linux Essentials exam. First, we''ll cover the basic
    settings required for network connectivity. Next, we will examine the different
    tools you have at your disposal that help make configuring the network settings
    easier. After that, this chapter explores simple network troubleshooting techniques
    you can use to find the problem if anything goes wrong.


    # Configuring Network Features


    You need to configure five main pieces of information in your Linux system to
    interact on a network:


    +   * The host address

    * The network subnet address

    * The default router (sometimes called gateway)

    * The system host name

    * A Domain Name System (DNS) server address for resolving host names


    You have three ways to configure this information in Linux systems:


    +   * Manually editing network configuration files

    * Using a graphical tool with your Linux distribution

    * Using command-line tools


    Trying to manually edit the network configuration files is best left for advanced
    system administrators and is beyond the scope of this book. For most typical Linux
    users, you''ll never have to mess with the configuration files; the graphical
    and command-line tools can do all that work for you. The following sections walk
    through both the graphical and command-line tools.


    Certification Objective'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Configuring Network Features


    It''s worth noting that there are two types of IP network address schemes in today.
    The legacy address scheme is technically referred to as IPv4 but is commonly just
    called IP. It uses 32 bits to represent a host address. These 32 bits are normally
    split into four 8-bit values, represented by decimal values, by dots (such as
    192.168.1.1). Because the world is running out of unique 32-bit addresses to assign
    to hosts on the Internet, IPv6 was created. It uses 128 bits for addresses. These
    values are commonly represented as eight groups of four hexadecimal digits, separated
    by colons (such as 2500:08b2:1ce0:e9b0:a5a1:0fa10:cf33).


    Certification Objective


    ![](img/85a8584ad3f3bd69446d00a129bba855_360_0.png)


    # Graphical Tools


    The Network Manager tool is a popular program used by many Linux distributions
    to provide a graphical interface for defining network connections. Network Manager
    starts automatically at boot and appears in the system tray area of the desktop
    as an icon. If your system detects a wired connection, the icon appears as a mini-network
    with blocks connected. If your system detects a wireless network connection, the
    icon appears as an empty radio signal. When you click the icon, you will see a
