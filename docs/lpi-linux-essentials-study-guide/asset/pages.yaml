- pgno: 50
  md: '# Where Does Linux Fit in the OS World?


    On the whole, Linux, can be thought of as a member of the family of Unix-like
    OSs. Although Linux is technically not a Unix OS, it''s similar enough that the
    differences are unimportant compared to the differences between this family as
    a whole and other OSs, such as Windows. Because of its popularity, Linux offers
    better hardware support, and on commodity PC hardware Unix varieties offer specific
    features that Linux lacks, for instance, Oracle''s Solaris uses built-in zones
    that handle virtual machines better than the tools currently available in Linux.


    ![](img/85a8584ad3f3bd69446d00a129bba855_50_0.png)


    Although computers understand only ones and zeros, human beings prefer to write
    programs in a text form as source code. Although source code can seem arcane to
    the uninitiated, it''s crystal clear compared to the form a program must take
    for a computer to run to binary code. A program known as a compiler translates
    source code to binary code. Alternatively, some programming languages rely on
    an interpreter, which converts source code by “on the fly,” eliminating the need
    to compile code.


    The term open source refers to the availability of source code, which is generally
    withheld from the public in the case of commercial products and OSs. A program
    with access to a program''s source code can fix bugs, add features, and alter
    however how the program operates.


    # Comparing Linux to macOS


    Apple macOS is a commercial Unix-based OS that borrows heavily from the BSDs and
    discards the usual Unix GUI (namely X) in favor of its own user interface. This
    makes macOS both similar to Linux and quite different from it.


    ![](img/85a8584ad3f3bd69446d00a129bba855_50_1.png)


    You can open a macOS terminal and try many of the commands described in this book
    to achieve similar results. If a command described in this book is not present,
    you may be able to install it in one way or another. macOS ships with Unix server
    programs, so you can configure it to work much like Linux or another OS as a network
    computer.


    macOS differs from Linux in its interface, though. The macOS user interface is
    known as Cocoa from a programming perspective, or Aqua from a user''s point of
    view. It includes elements that are roughly equal to X and a desktop environment
    in Linux. Because Cocoa is not compatible with X applications developed for macOS
    cannot be run directly on Linux (or on other Unix-like OSs), porting them (that
    is, modifying the source code and recompiling) for Linux is a nontrivial undertaking.
    Thus, native macOS applications seldom make the transition to Linux.


    macOS includes an implementation of X that runs under Aqua. This makes the transition
    of GUI Linux and Unix programs to macOS relatively straightforward. The resulting
    programs not entirely conform to the Aqua user interface, have buttons, menus,
    and other features that look out of place compared to the usual appearance of
    macOS equivalents.'
