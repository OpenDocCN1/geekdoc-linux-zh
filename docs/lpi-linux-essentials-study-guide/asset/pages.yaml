    \ will be run only if command completes successfully. If command returns an error\
    \ code, additional-commands won't be run. Conditional expressions may be expanded\
    \ by the use of else clause:\n\n```\nif [ conditional-expression ]\n  commands\n\
    \  else\n    other-commands\n```\n\nCode of this form allows either command or\
    \ other-command to execute, depending on the program, but precisely what should\
    \ happen on some condition. For instance, you may want to launch one of two different\
    \ archiving programs on a user's input.\nWhat do you do if more than two outcomes\
    \ are possible—instance, if a user may provide any of four possible inputs? You\
    \ can nest several if/then/else clauses, but this can get awkward. A cleaner approach\
    \ is to use case:\n\n```\ncase word in\n  pattern1 command(s) ;;\n  pattern2 command(s)\
    \ ;;\nesac\n```\n\nFor a case statement, word is likely to be a variable, and\
    \ each pattern is a possible value of that. The patterns can be expanded much\
    \ like filenames, using wildcards and expansion rules (*) to stand for any string,\
    \ instance). You can match an arbitrary number of patterns in this way. Each set\
    \ of commands must end with a double semicolon (;;), and the case statement as\
    \ a whole ends in the string esac (case backward)."
  merge: -1
  img_proc: true
- pgno: 282
  md: "Filename expansion using asterisks (*), question marks (?), and so on is sometimes\
    \ called globbing.\n\nUpon execution, bash executes the commands associated with\
    \ the first pattern to match the word. Execution then jumps to the line following\
    \ the esac statement; any intervening commands do not execute. If no patterns\
    \ match the word, no code in the case statement executes. If you want to have\
    \ a default condition, use * as the final pattern this pattern matches any word,\
    \ so its commands will execute if no other patterns match.\n\n# Using Loops\n\n\
    Conditional expressions are sometimes used in loops. Loops are structures that\
    \ tell the script to perform the task repeatedly until some condition is met (or\
    \ until some condition is no longer met). For instance, Listing 11.5 shows a loop\
    \ that plays the WAV audio files in a directory.\n\nThe aplay command is a basic\
    \ audio file player. On some systems, you may to use play or some other command\
    \ instead of aplay.\n\n**Listing 11.5:** A script that executes a command on every\
    \ matching file in a directory\n\n```\n#!/bin/bash\nfor d in `ls *.wav`; do\n\
    \  aplay $d\nd\n```\n\nThe loop used here executes once for every item in the\
    \ list generated by ls *.wav. Each of those items (filenames) is assigned to the\
    \ d variable and is passed to the aplay command.\n\nThe seq command can be useful\
    \ in creating loops (and in other ways, too). This command generates a list of\
    \ numbers starting from its first argument and continuing to its last. For instance,\
    \ typing seq 1 10 generates 10 lines, each with a number between 1 and 10. You\
    \ can use the seq command in a loop to iterate through a series of numbers:\n\n\
    ```\nfor x in `seq 1 10`; do\n  echo $x\ndone\n```\n\nThe loop executes times,\
    \ with the value of x incrementing with each iteration. If you pass just one parameter\
    \ to seq, it interprets that number as an ending point, with the starting point\
    \ being 1. If you pass three values to seq, it interprets them as a starting value,\
    \ an increment amount, and an ending value."
  merge: -1
