- pgno: 241
  md: 'As with RPM packages, you can remove packages or upgrade your computer''s

    software, too:


    ```

    # apt remove zsh

    # apt upgrade

    ```


    APT is a powerful tool, as is the underlying dpkg. You should consult these these
    programs''

    man pages to learn more about how to use these programs.


    # Understanding the Process Hierarchy


    The Linux kernel is the core of a Linux installation. The kernel manages memory,
    provides

    software with a access to the hard disk, doles out CPU time, and performs other
    critical

    low-level tasks. The kernel is loaded early in the boot process, and it''s the
    kernel''s

    responsible for managing every other piece of software on a running Linux computer.


    One way the kernel orders the potentially chaotic set of running software

    to create a sort of hierarchy. When it boots, the kernel runs just one program—usually

    einit/systemd /sbin/init. These processes are responsible for starting all

    t basic programs that Linux must run, such as the programs that manage logins

    and always-up servers. Such programs, if launched directly by systemd or init,
    are called

    it children. The children processes can in turn launch their own children. This
    happens

    when you log into Linux. The process that launched a given process is called its
    parent.


    ![](img/85a8584ad3f3bd69446d00a129bba855_241_0.png)


    > You can change which program runs as the first process by adding the

    init= to your boot loader''s kernel option line, as in init=/bin/bash

    to run bash.


