    9. Press the Q key to exit from the info reader.


    # Finding Additional Documentation


    Although many pages and info pages are both useful resources, other documentation
    is available too, and it is sometimes preferable. Generally speaking, help on
    Linux can come in three forms: additional documentation on your computer, additional
    documentation online, and help from experts.


    > Documentation categories can blur together. For instance, documentation might
    be available online but not on your computer until you install an appropriate
    package.


    # Locating Program Documentation on Your Computer


    Most programs ship with their own documentation, even aside from man or info pages.
    In fact, some programs have so much documentation that it''s installed as a separate
    package, typically with the word documentation or doc in the package name, such
    as samba-doc.


    The most basic and traditional form of program documentation is a file called
    README, readme, txt, or something similar. Precisely what information this file
    contains varies greatly one program to another. For some, the file is so terse
    that it''s nearly useless. For others, it is extremely helpful. These files are
    almost always plain-text files, so you can read them with less effort or with
    your favorite text editor.


    > README files often contain information on building the software package that
    doesn''t apply to program files provided with a distribution. Maintain seldom
    change such information in their README files, though.


    If you downloaded the program as a source code file from the package maintainer''s
    site, the README file typically appears in the build directory extracted from
    the compressed source code file. If you installed the program from a package file,
    though, the README file could be in any of several locations, depending on your
    distribution. The most places are as follows:


    +   - /usr/doc/packagename


    +   - /usr/share/doc/packagename


    +   - /usr/share/doc/packages/packagename'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Chapter 5 ■ Getting to Know the Command Line


    In the previous `packageName` is the software package''s name. The package name
    sometimes includes a version number, but more often it does not.


    In addition to (or instead of) the README file, many programs provide other documentation
    files. These may include a file that contains the history of the program in detail,
    descriptions of compilation and installation procedures, information on configuration
    formats, and so on. Check the source code''s build directory or the directory
    in which you found the README file for other files.


    Some larger programs ship with extensive documentation in PostScript, Portable
    Document Format (PDF), Hypertext Markup Language (HTML), or other formats. Depending
    on the format and package, you might find a single file or a large collection
    of files. As with the README file, these files are well worth consulting, particularly
    if you want to learn how to use a package to fullest.


    Some programs rely on configuration files, typically located in the /etc/ directory,
    to control their behavior. Although the syntax in configuration files is often
    difficult to understand, many programs provide default configuration files that
    include extensive details. Details vary from one program to another, but comment
    lines begin with hash marks (#). You may be able to learn enough about a program
    to adjust its configuration by reading the comments in the configuration file.


    If you can''t find a README or similar file, you can employ various tools to find
    documentation files. Many of these, such as Searching, Extracting, and Archiving,
    are covered in detail in Chapter 8, but here is a brief list:


    +   You can use your distribution''s package management system (detailed in Chapter
    9) to locate documentation. For instance, on an RPM-based system, you might type
    `rpm -ql package` | `grep doc` to locate documentation for packaging. Using grep
    to search for the string in the file list is a good trick because documentation
    directories almost always contain the string doc.


    +   The Linux find can search any directory tree


    +   The whereis program searches for files in a restricted set of locations, such
    as standard binary files, library directories, and man page directories. This
    tool does not search user directories. The whereis is a quick way to find program
    executables and related files like documentation or configuration files. To use
    it, type `whereis` followed by the name of the command or file, as in `whereis
    less` to find the binary and related documentation.


    +   The locate command searches a database of filenames Linux maintains. It can
    therefore do its job much quicker than find, but you can''t control the part of
    the computer that the system searches. Type locate followed by the string you
    want to find, as in `locate xterm` to find any files related to the XTerm terminal
    program.


    ![](img/85a8584ad3f3bd69446d00a129bba855_149_0.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Finding Additional Documentation


    The locate database is typically updated every 24 hours. If you are working on
    a freshly installed distribution, or you are searching for newly installed package
    files, the updatedb command will need to be run using super user privileges in
    order to update the locate database manually before you use the locate command.


    After you''ve located documentation files, you must know how to read them. The
    details, of course, depend on the documentation''s file format. You can use less
    to read many files. Most distributions configure less in such a way that it can
    interpret common file formats, such as HTML,, and to automatically decompress
    files that are stored in compressed format to save disk space.


    If you want to see a formatted text file, such as an HTML file, in a raw format,
    with the -L option to less, as in -L file.html.


    Table 5.5 summarizes common documentation file formats and the programs you can
    use to read them. Which formats are used from one program to another.


    # TABLE 5.5 Common documentation file formats


    | Filename extension | Description | Programs for reading |

    | .1 through .9 | Unix man pages | man, info, less |

    | .gz, .xz, or .bz2 | File compressed with gzip, x, or bzip2 | Use gunzip, unxz,
    or bunzip2 to uncompress, or use less, which may be able to uncompress the file
    and read its underlying format |

    | .txt | Plain text | less or any text editor |

    | .html or .htm | HTML | Any web browser |

    | .odt |Document text | OpenOffice.org, LibreOffice, or other word processors
    |

    | .pdf | Portable Document Format (PDF) | Evince, Okular, Adobe Reader, xpdf |

    | .tif, .png, .jpg | Graphics file formats | The GIMP, Eye of GNOME (eog) |'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Locating Program Documentation Online


    Manually uncompressing a file with gunzip, unxz, or bunzip2 may require writing
    the uncompressed version to disk, so you may need to copy it to your home directory.
    See Chapter 8 for more details.


    In addition to the documentation that you find on your computer, you can locate
    documentation on the Internet. Most packages have Associated websites, which may
    be referred to in manuals, pages, README files, or other documentation. Check
    these pages to look up documentation.


    A few Linux documentation resources are available on the Internet. The documentation
    offered by these sites, however, is often out-of-date. Typically, distributions
    have their own sites providing up-to-date documentation. Helpful resources include
    the following:


    +   - The Linux Documentation Project, or LDP (tld.org)


    +   - Red Hat Product Documentation (access.redhat.com/documentation)


    +   - Official Ubuntu Documentation (help.ubuntu.com)


    +   - openSUSE Documentation (doc.opensuse.org)


    +   - Fedora Documentation (docs.fedoraproject.org)


    +   - Linux Mint Documentation (linuxmint.com/documentation.php)


    > Be aware that items on the LDP site can be rather out-of-date. Be sure to check
    an item''s revision date before using it!


    Many Linux distributions use communities to write and/or improve their documentation.
    These volunteers'' practical experience adds to the accuracy and depth of the
    distribution''s documentation, which makes these sites valuable resources.


    # Consulting Experts


    Whatever issue has you looking for documentation, changes are you not the first
    person to do so. In some cases, you can save a lot of time by asking another person
    for help. Some specific resources include the following:


    **Program Authors** Many open source authors are happy to answer questions or
    provide limited support, particularly if a bug causes you your problem. Bigger
    projects (including Linux distributions) have many authors, and these projects
    often provide web forums or mailing lists to help users and developers communicate.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Finding Additional Documentation


    **Web Forums and Mailing Lists** These resources differ in format but serve similar
    purposes; they enable users to communicate with one another and share their expertise.
    Many distributions have dedicated web forums; try a search on your distribution
    name and forum to find yours. Mailing lists are more common for individual programs.
    Search the program''s main website for information on mailing lists.


    **IRC** Internet Relay Chat is a tool for real-time text-mode communication among
    small groups of people. To use IRC, use an IRC program, such as Irssi (irssi.org),
    Hexchat (github.com/hex/), or Smux (smux.im/). You can then join an IRC channel
    with which IRC exchanges messages in real-time.


    **Paid Consultants** Paying somebody consulting fee can be worthwhile to a thorny
    problem, particularly if you''re facing a "time is money" situation with a delay
    in solving the problem will literally cost you more money. A web search will turn
    up numerous consulting firms.


    **Web Searches** Web engines index many Linux resources, including man pages,
    program documentation sites, web forums, and even IRC channels. A web search can
    provide you with an answer from an expert without needing to contact the expert
    directly.


    ![](img/85a8584ad3f3bd69446d00a129bba855_152_0.png)


    > Careful use of these resources can help you with many Linux problems, whether
    those are simply a lack of knowledge on your part, a misconfiguration, a program
    bug, or some terrible disaster such as a software update that rendered your computer
    unbootable.


    The problem today is that there''s often much information available; sifting through
    the irrelevant (or just plain bad) information to find the helpful advice can
    be difficult. To overcome this, being specific can be helpful. You can narrow
    a web search by adding relevant keys to the problem that are uncommon. Words found
    in search can help you in this respect. If you post a problem to a web forum or
    send a bug report to a program author, be as specific as possible. Include information
    on the distribution you''re using, the version of the software, and specific details
    about what it''s doing. If the program displays error messages, quote them exactly.
    Such details will help experts in the case of the problem.


    # EXERCISE 5.1


    +   - Launch a GUI program, such as firefox, and without a trailing ampersand
    (&). When you launch it without an ampersand, use Ctrl+Z to put it into the background
    and see how the program reacts to mouse clicks. Use fg to return it to the foreground,
    and then repeat the process but use bg to run the program in the background. See
    what happens in your terminal when you exit the GUI program.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Chapter 5 ■ Getting to Know the Command Line


    # EXERCISE 5.1 (continued)


    +   - In a shell, type a single letter, such as m, and press the Tab key. What
    happens? If you type a less common letter, such as z, and then press Tab?


    +   - Experiment with the command line. Use it to search for strings that are
    part of both command names and filenames that you''ve used. Use the arrow keys
    and editing features described in Table 5.1 to edit commands that you have used
