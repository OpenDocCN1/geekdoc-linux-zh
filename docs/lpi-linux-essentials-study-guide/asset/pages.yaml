  md: '![](img/85a8584ad3f3bd69446d00a129bba855_127_0.png)


    You may think of the command line as a relic from the 1970s, with not much relevance
    to computing today. Not so! Although Linux has numerous GUI programs, they''re
    mostly flashy front ends to underlying text-mode tools. By learning those command-line
    tools, you can unlock Linux''s true power, enabling you to get your work done
    more quickly. You''ll also be able to manage the Linux system entirely, or should
    you need to log in and administer the remote. Command-line tools can also be scripted,
    meaning that you can write a simple program that performs a task quickly or more
    easily than could be achieved using standard programs. For these reasons, most
    chapters in this book describe both the GUI and command-line methods of getting
    things done.


    To begin command-line operations, you must know how to start. With that task in
    hand, you must know how to run programs and how to get help. You should also be
    familiar with several labor-saving features of Linux command lines.


    # # Starting a Command Line


    A Linux command line, or shell as it''s properly called, is a program. Just like
    any other program, the shell must be launched. You can start a shell in a GUI
    window called a terminal program, or you can log into the computer locally via
    a text-mode console. In addition, a shell is started when you log into the computer
    remotely using a text-mode login protocol. However, that particular method avoids
    the scope of this book.


    The default shell in most Linux distributions is the Bourne Again Shell (Bash),
    which is based on an older shell called the Bourne. Other shells are available.
    Most of these are similar to Bash in broad strokes, although some details differ.
    Each account specifies its own default shell, so individuals can change their
    shells if they like. (This is done with account management tools, such as longterm,
    which is described in Chapter 13, "Creating Users and Groups.")


    > > Certification Objective


    Other shells include tcsh, ksh, and zsh. Shell choice is a matter of preference.
    If you''re just starting out, it''s best to stick with Bash simply because it''s
    popular.


    # # Launching a Terminal


    Most Linux distributions allow you to install various GUI terminal programs. Typically,
    a desktop environment comes with its own terminal, so your terminal program choices
    also'
