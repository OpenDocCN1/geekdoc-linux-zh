    | --uid UID | -u | Creates an account with the specified user ID value (UID).
    |

    | --non-unique | -o | Enables a single UID number to be reused; this option is
    passed when creating the second or subsequent account that reuses UID. |

    | --system | -r | Specifies the creation of a system account. useradd doesn''t
