    language.


    ![](img/85a8584ad3f3bd69446d00a129bba855_119_0.png)


    C++ C++ is an extension to C that adds object-oriented features, meaning that
    greater emphasis is given to data structures and their interactions to the procedures
    used to control the flow of the program. Many complex Linux programs, such as
    KDE and Apache OpenOffice/LibreOffice, are largely written in C++. C++ source
    code have file names ending in .c, .cc, .cxx, or .cx, with header files in .h,
    .hh, .hxx, or .h+. In Linux it is compiled with the g++, which is part of GCC.


    Java was created by Microsystems (now owned by Oracle) as a cross-platform language
    that somewhere between being compiled and interpreted. It becomes popular as a
    language for small applications delivered via websites, although other programs
    are Java-based well. Java source code usually has a name in .java.


    JavaScript JavaScript and JavaScript are often confused with each other, but they
    are different in many ways. One difference is that JavaScript is an interpreted
    scripting language. Also, it is one of the most popular web programming languages—far
    more common than Java. It works alongside Hypertext Markup Language (HTML) and
    Cascading Style Sheets (CSS) to provide animations, scrolling boxes, interactive
    maps, is driven by JavaScript programs. Nearly all modern web browsers support
    JavaScript programs through built-in interpreters. JavaScript source code file
    has a .js extension.


    Perl An interpreted language, Perl is designed for easy manipulation of text,
    but it''s a general-purpose language that can be used for many other tasks as
    well. Perl programs typically have filenames that end in .pl, .pm, or .t.


    PHP The PHP: Hypertext Preprocessor, or PHP (recursive acronym), language was
    created for web servers to generate dynamic content—that is, content varies depending
    on the server, the time of day, or some other criterion. PHP is an interpreted
    language, and it requires a PHP-aware web server, such as Apache. Given such a
    server and appropriate configuration, a website can support user logins, shopping
    carts, content based on users), and so on. PHP most files have names that end
    in .php, although several variants are common.


    Python The interpreted Python language makes readability a goal. It supports (but
    does not require) object orientation. It''s often used for scripting purposes,
    but it can be used to write more complex programs, too. Python programs often
    use .py filename extensions, although variants of them are common too.


    > The Python programming language''s name is a reference to the British TV show
    Monty Python''s Flying Circus.


