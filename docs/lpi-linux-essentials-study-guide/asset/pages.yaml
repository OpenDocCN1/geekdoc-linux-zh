- pgno: 303
  md: '# Chapter 12 ■ Understanding Basic Security


    power of the root account can lead to accidental damage. For instance, the rm
    command. If you mistype an rm command as an ordinary user, you can accidentally
    delete your files but not system files. Make the same mistake as root, however,
    you can delete system files, perhaps making the computer unbootable. Therefore,
    you should be cautious when using the root account (or not use it at all), a topic
    covered more thoroughly in the upcoming "Using Root Privileges" section.


    # Acquiring Root Privileges


    When you need to perform a command-line task that requires root privileges, you
    can do so in any of three ways:


    **Log In as root** you can log in root at a text-shell or by using a remote login
    tool as SSH. You can even log into GUI mode as root on some Linux distributions.
    Some do not allow root to log in directly by being dangerous.


    **Use su** The su command enables you to change your identity within a shell.
    Type su username to change your identity to that of the specified username. If
    you omit root, it is assumed that su successfully enables you to become root.


    You must, know the password for the target account (root or otherwise) for this
    command to work. After you acquire root privileges as root, you can use this way,
    to as many commands as root you like. When you''re done, type exit to relinquish
    your user status.


    You can also use su to run a single command as root. Use the -c option, as in
    su -c command to run command as root.


    If you use a dash (—) within the command, as in su - or su - Luke, the program
    opens a login session that runs the target user''s login scripts. This can be
    important because scripts often set environment variables such as $PATH that can
    be important for that user.


    > su stands for switch user or substitute user.


    **Use sudo** The sudo command is similar to su, but it works for one command at
    a time, which you type sudo, similar to using su -c . For instance, sudo cat /etc/shadow
    allows you to see the contents of the /etc/shadow file, which is not readable
    by ordinary users. Today you must either type your own password or the root password,
    depending on the sudo configuration, when you use this program. (When using sudo
    -c, you must always type the root password.) The next command you type will be
    executed using your ordinary privileges. Some distributions, such as Ubuntu and
    Fedora, rely heavily on sudo and do not permit direct root logins by default.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Real World Scenario


    If your Linux system is in the workplace, it is important to determine your company’s
    policies concerning acquiring root privileges. Logging directly into the root
    account or using the command to obtain root privileges sets what is called a reputation
    environment. In this environment, a person can deny any actions; in this case,
    the person can deny they logged in as root. This environment could allow a root
    user to perform illegal or troublesome activity and then legally deny being responsible
    for activity. This is a potentially dangerous situation.


    Many companies have (or should) a policy that insists the sudo command is used
    for anyone needing to acquire root privileges. The sudo command tracks and logs
    a user’s activity and therefore sets what is called a nonrepudiation environment
    in which actions cannot be legally denied.


    > Modern traditions do not let you log into the root account. However, if you
    can acquire root privileges by logging directly as root or by using sudo -, your
    prompt will change:


    ```

    [rey@jakku]$ su -

    Password:

    [root@jakku]#

    ```


    It’s a good idea to always use su -, instead of just the sudo command. The dash
    (--) sets up the user account environment correctly. If you don’t use the dash,
    you may experience command problems.


    In this example, the username has changed from root to root and the last character
    of the prompt has changed from a dollar sign ($) to a hash mark (#). Because just
    the prompt character was used for most examples printed on their own lines in
    this book, such examples explicitly specify whether a command requires root privileges
    used. For instance, consider accessing the /etc/shadow file mentioned earlier:


    ```

    # cat /etc/shadow

    ```


    The use of the hash mark indicates that you must type this command using root
    privileges. In Linux Mint and Fedora Workstation, you must either precede them
    with sudo (as in sudo cat /etc/shadow) or type sudo su to acquire a longer-lasting
    root shell.'
  merge: -1
  img_proc: true
