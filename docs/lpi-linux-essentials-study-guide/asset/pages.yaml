    # Using Removable and Optical Discs


    If you insert a removable disk into a computer that''s running modern Linux distributions,
    the computer will probably detect that fact, mount the disc in a subdirectory
    of /media, and launch a file manager on the disc. This behavior makes the system
    work in a way that''s familiar to users of Windows or macOS.


    When you''re using the disc, you must unmount it before you can safely remove
    it. Most file managers allow you to do this by right-clicking the entry in the
    left-hand pane and selecting an option called Unmount, Eject, or safely Remove,
    as shown in Figure 6.3. If you fail to do this, the filesystem may suffer damage.


    > Some devices, such as optical discs, can lock their eject mechanisms to prevent
    forced removal of the media.


    ![](img/85a8584ad3f3bd69446d00a129bba855_172_1.png)


    Most removable discs are either partitioned or have a single partition. They frequently
    use FAT, which is a good choice for cross-platform compatibility. If you need
    to, you can partition USB flash drives and most other removable media.


    Optical discs are unusual in that they require their own filesystems (ISO-9660
    or UDF). Although you can mount and unmount these discs like other discs, you
    can only read them, not write to them. If you want to create an optical disc on
    blank media, you must use special software, such as the text-mode mkisofs, cdrecord,
    or growisof, or the GUI K3B or X-CD-Roast. These tools create an ISO-9660 filesystem
    from the files you specify and thereafter, you can burn it to the blank disc in
    the usual way.'
