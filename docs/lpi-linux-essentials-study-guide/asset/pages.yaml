    Many additional commands are available that you may want to use in some situations.
    Here are some highlights:


    **Change Case** Suppose that you want to change the case of a word in a file.
    Instead of entering insert mode and retrying the word, you can use the tilde (-)
    key in command mode to change the case. Position the cursor on the first character
    that you want to change, and - repeatedly until the task is done.


    **Undo** To undo any change, type u in command mode.


    **Open Text** In command mode, type o (a lowercase letter O) opens text—that is,
    inserts a new line immediately below the current one and enters insert mode on
    that line.


    **Search** To search forward for text in a file, type / in command mode, followed
    by the text you want to locate. Typing ? searches backward rather than forward.


    **Change Text** The c command changes text from within command mode. You invoke
    it like the d or y command, as in order to change the next word or cc to change
