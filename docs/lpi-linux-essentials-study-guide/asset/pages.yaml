- pgno: 71
  md: '# Chapter 2 ■ Understanding Software Licensing


    does exactly what you want to it do, that fact is a big advantage compared to
    a proprietary program. If you can redistribute your modified version of the program,
    you can help others (assuming you use similar functionality). The FSF philosophy,
    when applied, can create a benefit to the wider community.


    The FSF philosophy and the licenses it inspires are often referred to as copyleft.
    This term comes from a play on the word copyright, reflecting that copyright provisions
    are used to ensure freedoms that are, in some respects, the exact opposite of
    what copyright was created to do—that is, to guarantee the freedom of users to
    copy software, rather than to restrict that right. Copyleft licenses require that
    any modified programs derived are distributed only under the same license terms
    of the original program. Thus, copyleft licensing is sometimes called reciprocal
    licensing.


    # Examining Free Software and the GPL


    The legal expression of the FSF''s principles comes in the form of the GPL (sometimes
    called the GNU GPL). Two current versions of the GPL are common: version 2 and
    version 3. Both of the GPL apply the four freedoms of the FSF philosophy to the
    licensed software. They also state explicitly that derivative works must be released
    under the GPL, making it a copyleft license. This clause prevents a company from
    wholly appropriating an open source program. For instance, many companies make
    Linux distributions, and use some Linux kernels that incorporate fix "patches."
    These kernels, like the mainstream Linux kernel, are all available under the GPL.
    No company could legally release a distribution based on a patched Linux kernel
    and refuse to make its kernel patches available.


    > A Linux distribution is a collection of many programs that may use different
    individual licenses. No one license takes priority over the others.


    ![](img/85a8584ad3f3bd69446d00a129bba855_71_0.png)


    The GPL version 2 (or GPLv2 for short) was released in 1991, and it held sway
    for many years. In 2007, GPLv3 appeared, with the intention of closing certain
    loopholes in the GPLv2, particularly with respect to changes in laws and practices
    since 1991. Specifically, the GPLv3 contains clauses to combat use of hardware
    restrictions that limit the FSF''s freedoms and to address issues related to software
    patents. Many new programs are now being released under the terms of the GPLv3,
    and many older programs now use the GPLv3 rather than the GPLv2. The Linux kernel
    itself remains unchanged. This is an important choice because it means that the
    Linux kernel can still be used at the heart of devices that are otherwise closed,
    such as Android-based phones. Many such devices use restrictive boot processes
    to prevent unauthorized kernels from booting—a process that the GPLv3 would forbid.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Looking at the Open Source Initiative


    # Real World Scenario


    # Enforceable Legal Contract


    Hancom Inc. freely obtained open source software that was covered under the GNU
    GPL from Artifex Software Inc. and then modified the code. Hancom allegedly violated
    the license by charging money for the revised software. Artifex Software sued
    Hancom, in turn filed a motion to dismiss the case, claiming that the GNU GPL
    was not a binding contract. The Magistrate Jacqueline Corley, Federal Court, denied
    the motion and concluded that the GNU GPL was a binding contract, case No.16-06982-JSC
    (N.D. Cal. Sep. 12, 2017). The two companies ultimately reached a confidential
    settlement.


    Another related license is the GNU Free Documentation License (FDL), for use in
    documentation rather than by programs. The GPL, being written for software, doesn''t
    apply perfectly to static documents, so the FSF created the GNU FDL to fill the
    gap. A notable user of the FDL is Wikipedia (wikipedia.org). All of its content
    is available under the terms of the GNU FDL.


    # Looking at the Open Source Initiative


    Bruce Perez and Eric S. Raymond founded the Open Source Initiative (OSI) in 1998
    as an umbrella organization for open source software in general. Their philosophy,
    described in more detail, is similar to that of the FSF but differs in some important
    details. As a general rule, more software qualifies as open source than free (in
    the way the FSF means), but precisely what qualifies depends on the open source
    definition, and in a strict sense, on what the OSI has approved in terms of its
    licenses.


    # Understanding the Open Source Philosophy


    In the 1980s and 1990s, the free software movement gained momentum in certain
    circles, including academia and among hobbyists. Businesses, however, were slow
    to adopt'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 2 ■ Understanding Software Licensing


    software. Many who did adopt it so reluctantly or even unwittingly—system administrators,
    pressed to perform their duties with minuscule budgets, would quietly install
    Linux, Apache, Samba, and other free software as a way to avoid having by expensive
    commercial alternatives.


    The FSF''s advocacy efforts were (and are) based on a strong moral—software should
    be free in the FSF''s view, with "free" defined as freedom. This approach appeals
    to people, but others—particularly businesses that want to make money selling
    open source—find that this type of advocacy strategy deigned their organization
    as a way to advocate for free software.


    For these reasons, the OSI''s creators designed open-source—and by some of the
    FSF''s moral imperatives, the OSI aims to promote open source software in the
    business world. The difference in tone the FSF''s moral imperative can be seen
    in a main statement on the OSI''s website (opensource.org): "Open source enables
    a development method for software that has results in higher quality, better reliability,
    greater flexibility, lower cost, and an end to predatory vendor lock-in."


    The biggest philosophical difference between the FSF and the OSI is reflected
    in a GPL requirement that derivative works also be distributed under the GPL.
    The OSI has certified many licenses as open source, including the GPL; however,
    many of these licenses allow similar restrictions and under such licenses has,
    in fact, its way into closed-source products. The OSI does not object to such
    a path, provided the software was licensed in a way that permits it. The FSF,
    on the other hand, explicitly forbade such appropriation for proprietary uses
    in its GPL.


    ![](img/85a8584ad3f3bd69446d00a129bba855_73_0.png)


    # Permissive


    Several licenses approved by the OSI are called permissive licenses. These include
    the Apache license, BSD licenses, and the MIT license (covered in this chapter).
    Like a copyright license, a permissive license allows users to copy, share, and
    modify the software. However, a permissive license is not as restrictive as copyleft.
    While copyright requires that any modified programs derived from a program with
    the license be distributed under the same license terms, permissive licenses have
    minimal requirements concerning software redistribution. Licenses that fall under
    the permissive license umbrella may allow additional or different license terms
    and conditions for the licensed software. Thus, permissive licensing is sometimes
    called nonreciprocal licensing.


    ![](img/85a8584ad3f3bd69446d00a129bba855_73_1.png)


    Today, some tension exists between free software purists in the FSF''s sense and
    the more pragmatic open source community. For the most part, however, the two
    goals are similar enough that their differences are minor. In fact, free and open
    source software (FOSS) and freelibre open source software (FLOSS), are sometimes
    used as umbrella terms to refer to both types of software and development.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Defining Open Source Software


    The open source definition appears at opensource.org/definition. It consists of
    10 principles, which are paraphrased here:


    Free Redistribution The license must permit redistribution, including redistribution
    as part of a larger work.


    Source Code Availability The author must make source code available and permit
    redistribution of source code and (if applicable) binary code.


    Permission to Derive Works The license must permit others to modify the software
    and distribute such modifications under the same license as the original.


    > NOTE The open source definition permits, but does not require, that the license
    require redistribution under the original license.


    +   Respect for Source Code Integrity The license may restrict redistribution
    of modified source code, but only if patch files are distributed with the original
    source code. The license may require that derived works change the software''s
    name or version number.

    - No Discrimination Against Persons or Groups The license must not discriminate
    against any person or group of people.

    - No Discrimination Against Fields of Endeavor The license must not forbid use
    of the program in any field, such as business or by genetics researchers.

    - Automatic License Distribution The license must apply to anybody who receives
    the program, without needing a separate agreement.

    - Lack of Product Specificity The license must not require that the program be
    used or distributed as part of a larger program—that is, may extract a single
    program from a larger collection and redistribute it.

    - Lack of Restrictions on Other Software The license must not impose restrictions
    on other software that is distributed along with the licensed software.

    - Technology Neutrality The license must not be restricted based on specific technologies
    or interfaces.


    > NOTE The OSI''s 10 principles were derived from those expressed by the Debian
    GNU/Linux developers.


    The first three of these principles are the most important, at least in terms
    of understanding the point of open source technology. The collection as a whole
    bears a strong resemblance to the FSF''s four principles and the extended description
    of its implications'
