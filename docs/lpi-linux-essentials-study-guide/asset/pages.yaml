- pgno: 297
  md: 'to typing cat /etc/passwd; however, sometimes the two aren''t identical. The
    /etc/passwd file defines only local user accounts. It''s possible to configure
    Linux to use a network account database to define some or all of its accounts.
    If you use such a configuration, typing getent passwd returns both local accounts
    and accounts defined on the network server.


    # Real World Scenario


    # Network Account Databases


    Many networks employ network account databases. Such systems may include the Lightweight
    Directory Access Protocol (LDAP), Kerberos realms, and Active Directory (AD) domains.
    All of these systems move account database management onto a single centralized
    computer (often with one or more backup systems) or distributed across a designated
    system. The advantage is that users and administrators need not deal with maintaining
    accounts on dozens (or even hundreds or thousands) of different computers. A single-account
    database can handle accounts on day-to and also simplifying users'' lives. Using
    such a system, means that most user accounts won''t appear in /etc/passwd and
    /shadow, and groups may not appear in /etc/group (described shortly, in ''Understanding
    Groups''). These files will still hold information on local system accounts and
    groups, though.


    Linux can participate in these systems. In fact, some distributions provide options
    to enable support at OS installation time. Typically, you must know the name or
    IP address of the server that hosts the network account database, and you must
    know what protocol system uses. You may also need a password or some protocol-specific
    information, and the server may be configured to accept accesses from the Linux
    system that you''re configuring.


    Activating use of network account databases after installing Linux is a complex
    topic that is not covered in this book. Such systems often alter the behavior
    of tools as passwd and usermod (described in Chapter 13) in subtle or not-so-subtle
    ways. If you need to use such a system, you will have to consult documentation
    specific to the service you intend to use.


    # Understanding Groups


    As noted earlier, groups are collections of accounts that are defined in the /etc/group
    file. Like /etc/passwd, the /etc/group file contains colon-delimited lines (records),
    each defining a group. An example looks like this:


    ```

    users:x:100:games,christine

    ```'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Using Account Tools


    The fields in /etc/group are as follows:


    **Group Name** The first field, users in the preceding example, is the name of
    the group. You use it with most commands that access or manipulate group data.


    **Password** Groups, like users, can have passwords. A value of x means that the
    password is defined elsewhere (but may be disabled), and an empty password field
    means the group has no password.


    ![](img/85a8584ad3f3bd69446d00a129bba855_298_0.png)


    > The use and management of group passwords is a topic that''s beyond the scope
    of this book. However, group passwords are typically frowned on by security professionals.


    **GID** Linux uses GIDs, like UID values, internally. Translation to and from
    group names is done by the system for the benefit of users and administrators.


    **User List** You can specify users who belong to the group in a comma-delimited
    list at the end of the /etc/group record.


    It''s important to recognize that users can be identified as members of a group
    in either of two ways:


    **By Specifying the Group''s GID in Users'' Individual /etc/passwd Entries** Because
    /etc/passwd has room for only one GID value, only one group can be defined in
    this way. This is the user''s primary (or default) group.


    **By Specifying Usernames in the User List in the /etc/group File** A single user
    can appear multiple times in /etc/group, and a single group can have multiple
    users associated with this in it. If a user is associated with a group in this
    way but not the user''s /etc/passwd entry, this group association is secondary.


    When you create files, those files will be associated with your current group.
    When you log in, your current group is set to your primary group. If you want
    to create files associated with another group to you belong, you can use the newgrp
    command, as follows:


    ```

    $ newgrp project1

    ```


    This command makes project1 your current group, so that the files you create will
    be associated with that group. Group ownership of files is important in file security,
    which is described in more detail in Chapter 14.


    # Using Account Tools


    A few commands help you learn about the users and groups on your computer. Most
    notably, the who and id utilities can tell you about your own identity, and the
    who and w utilities can give you information about who is currently using the
    computer.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Discovering Your Own Identity


    If you maintain multiple accounts for yourself and you don''t recall which one
    you used to log in, you might become confused about your current status. In such
    a case, the whoami command can come in handy. Use your current user ID:


    ```

    $ whoami

    ```


    christine


    This example reveals that the current account is christine. If you need more information,
    you can use the id utility:


    ```

    $ id

    uid=1002(christine) gid=100(users) groups=100(users) [...]

    ```


    This example shows information on both users and groups:


    +   * Your User ID and Username: uid=1002(christine) in this example

    * Your Current Group: gid=100(users) in this example

    * All Group Memberships: the entries following groups= in this example

    The current group is the one''s, either by default or because you used the newgroup
    command.


    The id command displays both the numeric UID and GID values and potentially the
    associated names. The current group is the one''s, either by default or because
    you used the newgroup command.


    > On some distributions, the id command provides more information than shown in
    our examples.


    You can limit id''s output by specifying various options, as summarized in Table
    12.1. In addition, you can specify a username, as id rich, to obtain information
    on that user rather than on yourself.


    # TABLE 12.1 Options for id


    | Long option | Short option | Effect |

    |---|---|---|

    | --group | -g | Displays only the effective group ID |

    | --groups | -G | Displays all the groups to which you belong |

    | --user | -u | Displays only the user data |

    | --name | -n | Used in conjunction with -g, -G, or -u; displays only the name,
    the UID or GID |

    | --real | -r | Used in conjunction with -g, -G, or -u; displays only the UID
    or GID, not the name |'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Learning Who''s Online


    Linux permits multiple users to access the computer simultaneously. Most often,
    this is done by remote access servers such as the Secure Shell (SSH); however,
    you can use Linux''s virtual terminal (VT) feature to log in multiple times with
    a single keyboard and monitor. Sometimes, you might want to know who is using
    the computer. You might do this before shutting down the computer, for instance,
    to ensure that you don''t inconvenience another. To learn who is online, you can
    use a command know as:


    ```

    $ who

    christine tty7 2019-08-06 10:14 (:)

    steph tty2 2019-08-06 10:57

    rich pts/0 2019-08-06 10:56 (192.168.0.102)

    devon tty3 2019-08-06 10:57

    ken tty4 2019-08-06 10:57

    ```


    This example shows five logins—christine, steph, rich, devon, and ken. Information
    provided in the default output includes:


    **Username** The first column of who''s output shows your username.


    **Terminal Identifier** The second column of who''s output shows a code associated
    with the terminal. In this example, christine''s first login shows tty7 and it
    is a local GUI login, but some distributions use the as a GUI identifier. The
    remaining logins all have terminal identifiers of the pts/# or tty#, indicating
    text sessions. A text session can be launched in a GUI, a text-mode console login,
    or a remote login via SSH or some other protocol.


    **Login Date and Time** who displays the date and time of each login. You can
    see that christine''s session began before she logged in:


    **Remote Host** The final column of who''s output, if present, shows the login
    source. Console logins (both text-mode and GUI-based logins) don''t include a
    source. A source of the form#.# or :# often indicates a terminal opened in a GUI,
    such as in christine''s source: (:). A hostname or IP address, in rich''s session,
    indicates remote from the specified computer.


    By default, the command pulls its data from the /var/run/utmp file.


    You can obtain additional information, most of which is obscure or specialized,
    by paying options to who. One that''s more likely than others to be useful is
    --count (-q), which produces a more compact summary of the data:


    ```

    $ who -q

    christine steph rich devon

    # users=5

    $

    ```'
  merge: -1
  img_proc: true
