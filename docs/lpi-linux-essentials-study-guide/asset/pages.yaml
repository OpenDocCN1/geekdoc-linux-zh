- pgno: 76
  md: '# Using Open Source Licenses


    may be important to a system administrator. The major open source licenses include
    the following:


    GNU GPL and LGPL As noted earlier, the Linux kernel uses the GPLv2, and many other
    Linux tools use the GPL (either version 2 or version 3). Many Linux libraries
    use the GPL.


    BSD The Berkeley Source Definition (BSD) licenses are used by the open source
    BSD OS and by various software components developed for them. Unlike the GPL,
    the BSD licenses allow modifications to be distributed under other licenses. The
    latest versions of this license are similar to the MIT license in brevity.


    Two BSD licenses are common: the three-clause and the two-clause version. The
    two-clause BSD license is sometimes called the Simplified BSD or FreeBSD License.
    The three-clause version is called the new BSD license, in reference to a older
    version (the four-clause).


    MIT The Massachusetts Institute of Technology (MIT) was the original moving behind
    the X Window System (X for short), and the MIT license continues to be used for
    Xorg-X11—the implementation of X that is still included with several Linux distributions.
    However, some Linux distributions have moved from X to Wayland, which also uses
    the MIT license. MIT is unusually short—only around 160 words.


    Apache Like BSD and MIT, the Apache license is an license that permits redistribution
    under the same or another license. If a text file NOTICE comes with the original
    work, it must be included in any derived work. This enables the original developer
    to provide contact or other information, even to users of heavily modified versions
    of the program.


    The original version of the Apache license (version 1.0) was created in 1995.
    The current version is 2.0, and thus sometimes the Apache license is referred
    to as Apache 2.


    As the name implies, the Apache license originated with the Apache browser; however,
    it''s used by many other projects as well.


    Many licenses meet the OSI''s requirements. You can find a complete list on the
    Open Source Initiative website at opensource.org/. The details of the various
    open source licenses are probably not important to most system administrators.
    You may use and redistribute any open source program as you wish. If you modify
    a program, you should be aware of redistribution requirements, particularly if
    you want to merge two or more programs or distribute a program under a modified
    license. You should also be aware that some Linux distributions may include software
    that doesn''t qualify as open source. Some of this is commercial software, and
    some of it falls into a variant category.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Chapter 2 • Understanding Software Licensing


    Some combinations of open source licenses are incompatible with one another, meaning
    that you can''t legally combine the code and release the modified version.


    ![](img/85a8584ad3f3bd69446d00a129bba855_77_0.png)


    One final concern when describing software licenses is the license for Linux as
    a whole. When you download an image file or buy a Linux package, the software
    you obtains uses many licenses—the GPL, the BSD license, the MIT license, and
    so on. Most of these are open source, but aren''t. Many distributions ship with
    few shareware or not-quite-open-source packages, such as the XV graphics program.
    For this reason, if you''ve purchased a Linux package, you should not copy it
    unless you''ve researched the issue and found that copying is okay. If the distributor
    provides free-as-in-download links, copying is probably allowed.


    Linux distributions include installation programs, configuration programs, and
    the like. These tools are usually all a distribution packager can claim in terms
    of copyright. Most distribution maintainers have made their installation and configuration
    routines under the GPL or some other open license, but this isn''t always the
    case. Such details can turn what might seem an open OS that''s not fully open
    source. Debian maintains a policy of using only open source software in its main
    package set, although it freely redistributable but non-open source programs into
    its "non-free" package set.


    Because a Linux distribution is composed of components using many licenses, it''s
    not useful to speak of a single copyright or license applying to the entire OS.
    Instead, you should think of a Linux distribution as a collection of products
    that comes with a unique installation utility. The vast majority of all programs
    use one open source license or another, though.


    # Understanding Open Source Business Models


    Some Linux distributions, like Debian, are maintained by volunteers or by not-for-profit
    organizations. Others, such as Red Hat Enterprise, are maintained by a company
    that expects to make a profit. How then can a company make a profit if its core
    product is free for the Internet? Several approaches exist to making money from
    open source software, including the following:


    **Services and Support** The product itself can be open source, and even given
    for free, the company sells services and support, such as training and a technical
    support phone. For instance, a game might be open source but require a subscription
    to an online service to provide a full set of features.


    **Dual Licensing** A company can create two versions of the product: one is completely
    open source, and another adds features that are not available in the open source
    version. The open source version is then akin to the free samples that supermarkets
    often provide—it''s a way to draw in paying customers.'
  merge: -1
  img_proc: true
