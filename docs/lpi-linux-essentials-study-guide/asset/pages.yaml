  md: '# Understanding Accounts


    Passwords are typically displayed as dots or asterisks in a GUI environment as
    a security feature.


    # FIGURE 12.2 The Users and Groups account tool provides minimal account information.


    ![](img/85a8584ad3f3bd69446d00a129bba855_296_0.png)


    You can identify all of a computer''s accounts by viewing the /etc/passwd file''s
    contents with cat. Doing so will reveal all accounts, including both system and
    user accounts.


    Alternatively, if you are searching for information on a specific account, you
    can use grep to find it in /etc/passwd, as grep rich /etc/passwd to find information
    on any account that''s tied to a user with the username rich. (This specific example
    assumes that the string rich appears in the passwd file, rich.)


    You can pull out individual records using the getent command too. Just add the
    username to the command''s end-for-instance, getent passwd rich.


    An alternative that''s similar to perusing /etc/passwd is to type getent passwd.
    The getent command retrieves entries from administrative databases, including
