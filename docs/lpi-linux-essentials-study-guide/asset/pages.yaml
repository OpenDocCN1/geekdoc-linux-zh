- pgno: 313
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_313_0.png)


    Linux is a multiuser OS, meaning that a single Linux computer can support many
    users, each with a unique account.

    With this capability comes the need to manage users''

    accounts, and this chapter covers the procedures you''ll use to do so.


    The chapter begins with information on how to create accounts. With the accounts
    created, you then need to know how to modify those accounts and, when necessary,
    delete them. Finally, groups are similar to accounts in many ways, so you''ll
    learn how to create


    # Creating New Accounts


    In many environments, the task of adding accounts is quite common. Large businesses
    hire new employees, universities recruit new students, charitable organizations
    obtain fresh volunteers. Therefore, you must know how to create new accounts.
    First, this section looks at the important issues of deciding how to use groups
    and selecting a good password. You will then learn how to create accounts using
    GUI and text-mode tools.


    # Deciding on a Group Strategy


    As described in Chapter 12, “Understanding Basic Security,” Linux groups are collections
    of users. You can use groups to control who can access particular files. As will
    be described in Chapter 14, “Setting Ownership and Permissions,” individuals can
    change the group affiliations and permissions of their own files. Thus, the way
    you use groups can influence your computer''s overall strategy. Two approaches
    are:


    **User Groups** Each user has an account group; for instance, the user Luke has
    a group called Luke. This user can then set group ownership on files to /Luke
    or set group permissions to whatever is desired, and the system administrator
    can add users to the Luke group. Members of the Luke group may access files in
    this group by using the permissions determined by the user Luke''s.


    **Project Groups** In this method, you create groups based on work projects, departmental
    affiliations, or other real-world groupings. For instance, you may have a group
    called sales for the sales department. Members of this group who want to share
    files with other members of this group would assign group ownership and permissions
    appropriately and store files in an agreed-upon location. This approach works
    best when the computer is used by a large number of people who collaborate in
    easily defined groups.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Creating New Accounts


    # 275


    These two approaches are not mutually exclusive; you can mix and match or create
    your own approach. You should also realize that users can be members of multiple
    groups. In fact, this is required for the user groups approach to work at all—otherwise,
    groups are redundant with accounts.


    ![](img/85a8584ad3f3bd69446d00a129bba855_314_0.png)


    By default, some distributions employ a user groups strategy and others use a
    project groups strategy. In the latter case, most users are in a group called
    users'' or something similar by default.


    If you use the project group approach, you should think about which group should
    be a new user''s primary group. This is the group that will be assigned group
    ownership of the user''s files by default.


    # Selecting a Good Password


    When you create an account, you should typically create a password for it. Sometimes,
    the user can select the password when the account is created. At other times,
    you''ll need to select a password that the user will use initially. In such cases,
    instruct the user to change the password as soon as possible. In either case,
    it''s important to educate users about selecting a good password.


    ![](img/85a8584ad3f3bd69446d00a129bba855_314_1.png)


    > Be sure to follow the advice in this section yourself, especially for the root
    password if you use the root account!


    Poor but common passwords include those based on the following:


    +   - The names of family members, friends, and pets

    - Favorite books, movies, television shows, or the characters in any of these

    - Telephone numbers, street addresses, or Social Security numbers

    - Any other meaningful personal information

    - Any single word that''s found in a dictionary (in any language)

    - Any keyboard or alphanumeric combination, such as qwerty or 123456


    The best possible passwords are random collections of letters, digits, and punctuation.
    Unfortunately, such passwords are difficult to remember. A reasonable compromise
    is to build a password in two steps:


    +   1. Choose a base that is easy to remember but difficult to guess.

    2. Modify that base in ways that increase the difficulty of guessing the password.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Chapter 13 • Creating Users and Groups


    In both cases, the base should not be a word in any language. As a general rule,
    the longer

    password, the better.


    > NOTE Many distributions place lower limits on password length, such as six or

    eight characters.


    With the base in hand, it''s time to modify it to create a password. The user
    should apply

    at least a couple of several possible modifications:


    **Adding Numbers or Punctuation** One important change is to insert random numbers
    or

    punctuation in the base. This step might yield, for instance, bu3np?n or y+iwttd.
    As a

    general rule, add at least two symbols or numbers.


    **Mixing Case** Linux uses case-sensitive passwords, jumbling the size of letters
    can

    improve security. Applying this rule might produce bu3np?n and y+iwttd, for instance.


    **Reversing Order** A change that is very weak but itself can help to add security
    when

    in conjunction with the others is to reverse the order of some or all letters.
    You might

    just apply this to one word of a two-word base. The base could yield bu3nm?EP
    and Dttw91,y,

    for instance.


    **Getting the Haystack** A would-be intruder''s task of discovering a password
    has been

    linked to finding a needle in a haystack. One way to make this harder is to increase

    the size of the haystack. In password terms, this means making a password larger.
    You

    ido this by using larger words or phrases, but this can make a password

    harder to remember and type. Even an increase size that repeats a single character

    can be helpful. You might think the passwords into Bu3nm?EPiiiiiiiiii or

    Dtt!!!!!!!!!!iw9y+.


    > NOTE The National Institute of Standards and Technology (NIST) is a nonregul-

    tory U.S. agency. They publish many commerce recommendations, includ-

    ing business security. NIST proposals are typically turned into

    procedures for company and government organizations. In 2017, NIST

    issued new guidelines regarding secure passwords, and surprisingly long

    complicated passwords are no longer recommended. However, it may take

    a while before the new NIST password guidelines filter down your

    day-to-day world, if ever.


    Your best test for getting users to pick passwords is to educate them. Here are

    some insights to share with users:


    +   * Passwords be guessed by malicious individuals who know them or even who
    target

    them and look up personal information on social media, web-based telephone direct-

    tories, business profiles, and so on.


    +   * Although Linux salts and hashes its passwords internally, programs that
    feed

    entire dictionaries through Linux''s password salting/hashing algorithms for compar-

    to a Linux system''s passwords. If a match occurs, the password has been found.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Creating New Accounts


    +   - User accounts might be used as a first step toward compromising the entire
    computer or as a launching point for attacks on other computers.


    +   - Users should *never* reveal their passwords to others, even people claiming
    to be system administrators. This is a common scam, because real system administrators
    don''t need users'' passwords.


    +   - The same password should not be used on multiple systems, because doing
    so quickly turns a compromised account on one computer into a compromised account
    on all of them.


    +   - Writing passwords down or emailing them are both risky practices. Writing
    a password on a sticky note stuck to the computer''s monitor is particularly foolish.


    Telling your users these things will help them understand the reasons for your
    concern, and it''s likely to help motivate at least some of them to pick good
    passwords.


    # Don''t Use These Passwords!


    If you do a web search for **common passwords** or a similar phrase, you''ll discover
    websites that provide surveys showing the most typical and easily guessed passwords
    that security researchers have uncovered. Details vary from one survey to another,
    but typically common passwords include the following:


    +   - 123456


    +   - password


    +   - 12345678


    +   - qwerty


    +   - 111111


    +   - sunshine


    +   - iloveyou


    +   - princess


    +   - football


    +   - password1


    Such passwords are easily discovered by brute-force password-guessing programs
    and are included in collections of passwords distributed over the Internet. Using
    such a password is barely better than using no password at all. Do yourself a
    favor and create a better one!'
  merge: -1
