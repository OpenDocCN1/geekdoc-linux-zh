    condition:

    [ -s file\uses the -s option and is true if file exists and has a size greater
    than 0. You can also use string operators in conditions. For example:

    [string1 string2]

    uses the == operator and is true if the two strings have the same values.

    to better understand the use of conditionals, consider the following code fragment:

    if [ -s /tmp/tempstuff ]

