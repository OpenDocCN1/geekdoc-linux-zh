- pgno: 277
  md: '# Chapter 11 • Creating Scripts


    You may also need to run additional site-specific commands, as commands that create
    unusual user-owned directories aside from the user''s home directory.


    As an example of how a script with an argument variable can help in such situations
    consider Listing 11.2. When you run the script, you must provide the user account
    as a parameter on the command line. The script retrieves that value using the
    $1 variable and creates an account based on the value with the useradd command.
    It then changes the account''s password with the passed command (the script prompts
    you to enter the password when you run the script). It creates a directory in
    the /shared directory tree corresponding to the account, and it sets a symbolic
    link to that directory from the new user''s home directory. It also adjusts ownership
    and permissions in a way that may be useful, depending on your system ownership
    and permissions policies.


    # Listing 11.2: A script that reduces account-creation tedium


    ```

    #!/bin/bash

    useradd -m $1

    passwd $1

    mmkdir -p /shared/$1

    chown $1.users /shared/$1

    chmod 775 /shared/$1

    ln -s /shared/$1 /home/$1/shared

    chown $1.users /home/$1/shared

    ```


    If you use Listing 11.2, you need to type only three things: the script name with
    the desired username and the password (twice). For instance, if the script is
    called mkuser, you can use it like:


    ```

    # mkuser rblum

    Changing password for user rblum

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully

