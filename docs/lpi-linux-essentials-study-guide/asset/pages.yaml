    # Managing Drivers


    Most devices require the presence of special software components to be useful.
    A piece of software that "talks" to hardware is known as a driver, so you should
    know how drivers work in Linux. This section first describes several broad class
    of drivers that you may need to use in your Linux environment, and explores how
    to locate and install drivers for your hardware.


    # Understanding Types of Drivers


    Linux requires drivers because different hardware—even two devices that serve
    very similar purposes—can function in very different ways. That is, the methods
    required to initialize and use two network adapters may be entirely different.
    To provide generalized interfaces so that programs like the Firefox browser can
    use any network adapter, the Linux kernel uses drivers as a bridge between the
    hardware-agnostic interfaces and the hardware itself.


    > In fact, several layers exist between the network hardware and a program like
    Firefox; the driver is just one of these layers.


    Broadly speaking, drivers can exist in one of two locations:


    +   - The kernel


    +   - An external library or application, and in fact a large chunk of the Linux
    kernel consists of drivers. Kernel drivers handle most of the devices that are
    internal to the computer''s box, such as the hard disks, network interfaces, and
    USB interfaces. The kernel hosts most'
