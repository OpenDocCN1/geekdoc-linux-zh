- pgno: 346
  md: 'These procedures involve binary numbers and logic, not arithmetic operations.
    The arithmetic description is easier to understand, though.


    # TABLE 14.2 Example permissions and their interpretations


    | Permission string | Octal code | Meaning |

    |---|---|---|

    | rwxrwx | 777 | Read, write, and execute permissions for all users |

    | rwxxr-xr- | 755 | Read and execute permission for all users. The file''s owner
    also has write permission. |

    | rwxr-x---- | 750 | Read and execute permission for the owner and group. The
    file''s owner also has write permission. Other users have no access to the file.
    |

    | rwx------ | 700 | Read, write, and execute permissions for the file''s owner
    only; all others have no access. |

    | rw-rw---- | 666 | Read and write permissions for all users. No execute permissions
    for anybody. |

    | rw-rw-r-- | 664 | Read and write permissions for the owner and group. Read-only
    permission for all others. |

    | rw-w---- | 660 | Read and write permissions for the owner and group. No world
    permissions. |

    | rw-r--r-- | 644 | Read and write permissions for the owner. Read-only permission
    for all others. |

    | rw-r----- | 640 | Read and write permissions for the owner, and read-nonly permission
    for the group. No permission for others. |

    | rw------ | 600 | Read and write permissions for the owner. No permission for
    anybody else. |

    | r------- | 400 | Read permission for the owner. No permission for anybody else.
    |


    There are 512 possible combinations of permissions, so Table 14.2 is incomplete.
    It shows the most common and useful combinations.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Chapter 14 ■ Setting Ownership and Permissions


    Several special cases apply to permissions:


    **Directory Execute Bits** Directories use the execute bit to grant permission
    to enter the directory and access files. If you have permission to read a file,
    you must have execute permission on the directory to access the file. This is
    a highly desirable characteristic for directories, so you''ll always find the
    execute bit set when the read bit is set.


    **Directory Write Permissions** Directories are files that are interpreted in
    a special way. So, if a user can write to a directory, that user can create, delete,
    or rename files in the directory, even if the user isn''t the owner of those files
    and does not have permission to write to files.


    > The rules for writing to directories can be modified with the sticky bit, which
    is described later in "Using Sticky Bits."


    ![](img/85a8584ad3f3bd69446d00a129bba855_347_0.png)


    **Symbolic Links** Permissions on symbolic links are 777 (rwxrwxrwx, or rwxwxrwx,
    to include the file type). This access applies only to the link file itself, not
    to the linked-file. In other words, all users can read the contents of the link
    to discover the name of the file to which it points, but the permissions on the
    linked-file determine its file access. Changing the permissions on a symbolic
    link affects the linked-file.


    **root** Many of the permission rules don''t apply to root. The superuser can
    read or write any file on the computer—even files that grant access to nobody
    (that is, that have 000 permissions). The superuser still needs an execute bit
    to run a program file.


    # Setting Permissions in a File Manager


    The procedure for setting permissions in a file manager is similar to that for
    setting the ownership of a file:


    +   - You normally adjust these settings using the dialog used to adjust ownership,
    such as the GNOME Files dialog shown earlier in Figure 14.1.

    - You don''t need to root to adjust the permissions of files you own.

    - You should use root access for this job only on files you don''t own.

    - As earlier in Figure 14.1, there are three Access, associated with the Owner,
    the Group, and Others:

    - The Owner provides two options: Read-Only and Read and Write.

    - The Group and Others items provide Read-Only and Read and Write plus the None
    option. You can use these options to set the read and write permission bits on
    your file.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Setting Permissions


    GNOME Files requires the execute bit separately by checking the Allow Executing
    File As Program box. This box sets all execute permission bits; you can''t control
    execute permission precisely by GNOME Files. You also can''t adjust the execute
    permissions on directories with GNOME Files.


    Details on setting permissions in other file managers, and the principles are
    the same as those described here for GNOME Files.


    ![](img/85a8584ad3f3bd69446d00a129bba855_348_0.png)


    # Setting Permissions in a Shell


    In a text-mode, you can use chmod to change permissions. This command is rather
    complex, mostly because of the complex ways that permissions may be changed. You
    can specify the permissions in two forms: as an octal number or in a symbolic
    form, which is a set of codes related to the string representation of the permissions.


    ![](img/85a8584ad3f3bd69446d00a129bba855_348_1.png)


    > The chmod command''s name stands for change mode, mode being another name for
    permissions.


    ![](img/85a8584ad3f3bd69446d00a129bba855_348_2.png)


    The octal representation of the mode is the same as that described earlier and
    summarized in Table 14.2. For instance, to change permissions on report.txt to
    rw-r----, you can issue the following command:


    ```

    $ chmod 644 report.txt

    ```


    +   A symbolic mode, by contrast, consists of three components:

    - A code indicating the permission you want to modify—u for the user (that is,
    the owner), g for the group, o for other users, and for all permissions

    - A symbol indicating whether you want to add (+), delete (-), or the mode equal
    to (= the stated value

    - A code specifying what the permission should be, such as the common r, w, or
    x symbol, or others for more advanced operations


    Using symbolic modes with chmod can be confusing, so we don''t describe them fully;
    however, you will be familiar with a few common types of use, as summarized in
    Table 14.3. Symbolic modes are more flexible than octal modes because you can
    specify symbolic modes that modify existing permissions, such as adding or removing
    permissions without affecting other permissions. You can also set only the user,
    group or world permissions without affecting the others. With octal modes, you
    must set all three permission bits equal to a value that you specify.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Chapter 14 • Setting Ownership and Permissions


    As with the chown and chgrp commands, you can use the -R (or --recursive) option
    to chmod to have it operate on an entire directory tree.


    # TABLE 14.3 Examples of symbolic permissions with chmod


    | Command | Initial permissions | End permissions |

    | --- | --- | --- |

    | chmod a+x bigprogram | rw-r-- | rwx-xr-x |

    | chmod ug=rw report.txt | r------ | rw----- |

    | chmod o-rw bigprogram | rwx-rw-x | rwx-rw-- |

    | chmod g-w,o-rw report.txt | rw-fw-rw- | rw-r---|


    # Setting the umask


    The umask, or umask, determines the default permissions for new files and directories.
    The umask is the value that is removed from 666 (rw-rw-rw-) permissions when creating
    new files from 777 (rwxrwxwx) when creating new directories. If the umask is 022,
    then files will be created with 644 permissions by default and new directories
    will have 755 permissions. Note that the removal operation is not a simple subtraction
    but a bitwise removal. That is, a 7 value in a umask removes the corresponding
    rwx permissions, but for files, for which the starting point is rw-, the result
    is --- (0), -1 (which is meaningless)


    You can adjust the umask with the umask command, which takes the umask value,
    as in umask 022. Typically, this command appears in a system configuration file,
    such as /etc/profile, or in a user configuration file, such as ~/.bashrc.


    # Using Special Permission Bits and File Features


    When you investigate the Linux directory tree, you will encounter certain file
    types that require special attention. Sometimes you may just want to be aware
    of how these files are handled, they deviate from what you might expect based
    on the information presented in Chapter 8. In other cases, you may need to adjust
    how you use ls or other commands to deal with these files and directories. These
    special cases include the “sticky bit,” hiding files from view, obtaining listings
    of directories, and using special execute permissions.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Using Sticky Bits


    Before diving into what sticky bits are, it''s easier to start out with explaining
    why we need them. Consider the following commands, typed on a system with a few
    files and subdirectories laid out in a particular way:


    These commands establish the current configuration; the effective user ID is rich
    and the current directory has one subdirectory, called subdir, which root owns
    to which rich, all the system''s users, has full read/write access. This subdirectory
    has one file, report.txt, which is owned by root and to which rich has no access.
    You can verify that rich can''t write the file by attempting to delete it with
    the touch command:


    ```

    $ touch subdir/report.txt

    touch: cannot touch subdir/report.txt: Permission denied

    ```


    This error message verifies that rich could not delete subdir/report.txt. The
    file, you might think, is safe from tampering. Not so fast! Try this:


    ```

    $ rm subdir/report.txt

    $ ls -l subdir/

    total 0

    ```


    The rm command returned no error, and a subsequent check of subdir verifies that
    it''s now-empty—in other words, rich could delete the file without permission
    to it! This may seem like a bug—after all, if you can''t write to a file, you
    might think you''d be able to delete it. Recall, that directories are just a special
    type of file, that holds other files and names to their lower-level data structures.
    Modifying a file requires access to the file, but creating or deleting a file
    requires write access to the directory in which it resides. In this example, rich
    has write access to the subdir but not to the report.txt file within directory.
    Thus, rich can delete the file but not modify it. This result is not a bug; it''s
    just a counterintuitive.


    Although Linux filesystems were designed to work this way, such behavior is not
    always desirable. The way to create a more intuitive result is to use a sticky
    bit, which is a special permission that alters this behavior. With the sticky
    bit set on a directory, Linux will permit you to delete a file only if you own
    it or the containing directory; write permission to'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Chapter 14 • Setting Ownership and Permissions


    the containing directory is not enough. You can set the sticky bit with chown,
    in either of two ways:


    Using an Octal Code By prefixing the three-digit octal code described earlier
    in this chapter with another digit, you can set any of special permission bits,
    one of which is the sticky bit. The code for the sticky bit is 1, so you would
    use an octal code that begins with 1, such as 1755, to set the sticky bit. Specifying
    a value of 0, as in 0755, removes the sticky bit.


    > Other odd numbers will set the sticky bit, too, but will also set additional
    permission bits, which are described shortly, in "Using Special Permissions."


    Using a Symbolic Code Pass the symbolic code for the world permissions, as in
    chmod o+t subdir, to set the sticky bit on subdir. You can remove the sticky bit
    in a similar way by using a minus sign, as in chmod o-t subdir.


    Restoring the file and setting the sticky bit enables you to see the effect:


    ```

    $ -l ls

    total 0

    drwxrwxrwt 2 root 80 Oct 14 18:25 subdir

    $ -l subdir/

    total 384

    -rw-r--r- 1 root 2404268 Oct 14 18:25 report.txt

    ```


    ```

    $ rm subdir/report.txt ''subdir/report.txt'': Operation not permitted

    rm: cannot remove

    ```


    In this example, although right still has full read/write access to subdir, rich
    cannot delete another user''s files in directory.


    You can identify a directory with the sticky bit by a small change in the system
    mode shown by ls -l. The execute bit is shown as a t rather than an x. In this
    example, the result is that subdir''s permission appears as drwxrwxrwt


    The sticky bit is particularly important for directories that are shared by many
    users. It''s a standard feature for /tmp and /var/tmp, for instance, since many
    users store temporary files in these directories, and you wouldn''t want one user
    to be able to delete another''s temporary files. If you want users who collaborate
    on a project to be able to write files into each other''s home directories, consider
    setting the sticky bit on those home directories and on subdirectories which users
    are sharing files.


    > If you delete /tmp /var/tmp and need to re-create it, be sure to set the sticky
    bit on your new replacement directory!'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Using Special Permission Bits and File Features


    # Using Special Execute Permissions


    As described earlier in this chapter, the execute permission bit enables you to
    identify program files as such. Linux then enables you to run these programs.
    Files running with your own credentials, which is generally a good thing—associating
    running processes with specific users is a key to Linux''s security model. Occasionally,
    programs need to run with elevated privileges. For instance, the password program,
    which sets users'' passwords, must be run as root, and in some cases the configuration
    files handles. Thus, if users are to change their own passwords, password must
    have root privileges even when ordinary users run it.


    To accomplish this task, two special permission bits exist, similar to the sticky
    bit described:


    **Set User ID (SUID)** The set user ID (SUID) option lets you run the program
    with the permissions of owner rather than the user who runs it. If a file is owned
    by root and has its SUID bit set, the program runs with root privileges and can
    therefore read any file on the computer. Servers and other systems run this way,
    which is often called SUID root. SUID programs are identified by an s in the owner''s
    execute position in the permission string, as in `rwxr-sr-x`.


    **Set Group ID (SGID)** The set group ID (SGID) option is like the SUID option,
    but it sets the group of the running program to the group of the file. It is indicated
    by an s in the group execute position in the permission string, as in `rwxr-srxs`.
    When set on a directory, the SGID ensures that all files created in the directory
    are set to the group instead of the user who created the file.


    You can set these bits using `chmod`


    Using an Octal Code In the leading digit of a four-digit octal code, set the leading
    value to 4 to set the SUID bit, or 6 to set both bits. For instance, 4755 sets
    the SUID bit, but not the SGID bit, on an executable file.


    Using a Symbolic Code Use the symbolic code, in conjunction with u to specify
    the SGID bit, or to set both bits. For instance, typing `chmod u+s` sets the SUID
    bit on myprogram, while `chmod ug-s` removes both the SUID and the SGID bit.


    Ordinarily, you do not need to remove these bits; when necessary, the management
    program sets these bits correctly when you install or upgrade a program. You might
    need to alter them if they were mistakenly set or removed on files. In some cases
    you might want to adjust these values on program files that you compile from source
    code or if need. Be cautious when doing so, though. If you set the SUID or SGID
    bit on a garden-variety program, it will run with increased privileges. If the
    program contains bugs, those bugs will then be able to do more damage. If you
    accidentally remove these permissions, the results can be just as bad—programs
    like password, sudo, and all rely on their SUID bits being set, removing this
    feature can cause them to stop.


    ![](img/85a8584ad3f3bd69446d00a129bba855_352_0.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Chapter 14 · Setting Ownership and Permissions


    # Hiding Files from View


    If you''re used to Windows, you may be familiar with the concept of a hidden bit,
    which hides files from view file managers, by the Windows DIR command, and in
    most programs. If you''re looking for something analogous in Linux, you won''t
    find it, at least in the form of a dedicated filesystem. Instead, Linux uses a
    file-naming convention to hide files from view tools; such as ls, hide files and
    directories if their names begin with a dot (.). Thus, ls hides the file.txt but
    not .file.txt. Most file managers and deal with them also hide dot files, as they''re
    commonly called hidden; however, this practice is not universal.


    Many user programs take advantage of this feature to keep their configuration
    files from cluttering your display. For instance, ~/.bashrc is a Bash configuration
    file, Evolution''s configuration file goes in ~/.evolution directory, and ~/.fonts.conf
    holds user-specific configuration information.


    You can view files in various ways depending on the program in question. Some
    GUI tools have a check box you can set in their configuration options to force
    the program to display files. At the command line, you can use the -a option to
    ls:


    ```

    $ ls -l

    total 0

    drwxr-xr-x 2 root 80 Dec 14 18:25 subdir

    $ ls -la

    total 385

    drwxr-xr-x 3 kirk users 104 Dec 14 18:44 .

    drwxr-xr-x 3 kirk users 528 Dec 14 18:21 ..

    -rw-r--r-- 1 kirk users 309588 Dec 14 18:44 .report.txt

    drwxr-xr-x 2 root 80 Dec 14 18:25 subdir

    ```


    This example shows the hidden file, .report.txt, in the current directory. It
    also shows two hidden directories. The first, refers to the current directory.
    The second, .., refers to the parent directory.


    > Recall from Chapter 6, “Managing Hardware,” that . is a relative directory reference.
    This hidden entry is why it works.


    Note renaming a file so that it begins with a dot will hide it, but this action
    will also make the file inaccessible to any program that uses the original filename.
    That is, if you rename report.txt to .report.txt, and if another program or refers
    to the file as report.txt, that reference will no longer work. You must include
    the leading dot in any reference to the hidden file.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Viewing Directories


    Chapter 6 introduced the ls command, including many of its options. One of these
    deserves elaboration at this point: -d. If you''re working in a directory that
    has many subdirectories, and if you use a wildcard with ls that matches one or
    more subdirectories, you may get an unexpected result; the output will show the
    files in the matched subdirectories, rather than the information on the subdirectories
    themselves—for instance, starting in a directory with two subdirectories, subdir1
    and subdir2:


    ```

    $ ls -l subdir*

    subdir1:

    total 304

    -rw-r---- 1 kirk 309580 Dec 14 18:54 report.txt


    subdir2:

    total 84

    -rw-r---- 1 kirk 86016 Dec 14 18:54 mypaper.doc

    ```


    If you want information on the subdirectories, rather than the contents of those
    subdirectories, you can include the -d option:


    ```

    $ ls -xr-x 2 kirk 80 Dec 14 18:54 subdir1

    drwxr-xr-x 2 kirk 80 Dec 14 18:54 subdir2

    ```


    # Summary


    File security is important on a multiuser OS such as Linux, and one of the pieces
    of the puzzle of security is ownership. In Linux, every file has one owner and
    one associated group. The superuser can set the owner with chown, and either the
    owner or the supervisor can set the file''s group with chgrp. By itself, ownership
    is useless, Linux supports the concept of file permissions, which control which
    users can access a file, and in what ways. You can set permissions with the chmod
    utility. You can view ownership, permissions, and some additional file features
    using the -l option to the ls command.


    # Exam Essentials


    Describe how Linux tracks file and directory ownership. Each file and directory
    in the Linux filesystem is assigned one owner and one primary group. You can view
    the owner and group of a file or directory by using the ls command with the -l
    option. You can'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'change the owner and primary group assigned to a file or directory using the
    chown command or just the group by using the chgrp command.


    **Explain how Linux tracks file and directory permissions.** Linux assigns permissions
    to files and directories on a three-level hierarchy—the primary group assigned
    to the file or directory, and everyone else on the system. To view the permissions
    for a file or directory, use the ls -l command with the permissions appear as
    a set of nine characters, three sets of r (for read), w (for write), and x (for
    execute), ordered rwx. If a permission is not set, it appears as a dash (-). The
    first set is the owner''s permissions, the second set is the group permissions,
    and the third set is permissions assigned to all other users who aren''t the owner
    or in the primary group of the file or directory. You change the permissions assigned
    to a file or directory by using the chmod command. You can either use the symbolic
    r, w, and x characters, or you can use an octal mode, where each permission is
    assigned an octal value.


    **Explain how Linux makes files or directories hidden.** Linux flags a file or
    directory as hidden if the file or directory name begins with a period (.). Hidden
    files and directories don''t appear in a standard ls listing unless you include
    the -a option.


    **Describe the special bits used for.** The sticky bit, when assigned to a directory,
    tells Linux to allow only the owners of files contained in the directory to delete
    them, even if another user account has write access to the file. The set user
    ID bit tells Linux to run the file with the permissions of the file owner instead
    of the actual user account that runs the file. The set group ID bit tells Linux
    to run the file with the permissions of the file''s group instead of the primary
    group of the user account that runs the file.'
  merge: -1
  img_proc: true
