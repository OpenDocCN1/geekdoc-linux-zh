    # # Identifying Running Processes


    Before you can manage processes, you must be able to identify them. The ps and
    top utilities can help you identify processes. In either case, you can search
    for processes in various ways, such as by name or by resource use. You may also
    want to identify how your processes are consuming, which you can do with the free
    command.


    # ## Using ps to Identify Processes


    The simplest tool for identifying processes is ps, which produces a process list.
    Listing 9.1 shows an example of ps in action. In this example, the -u option restricts
    output to processes owned by the specified user (rich), whereas --forest creates
    a display that shows parent/child relationships.


    **Listing 9.1:** Output of ps -u rich --forest


    ```

    $ ps -u rich --forest

    PID TTY             TIME CMD

    2451 pts/3          00:00:00 bash

    2551 pts/3          00:00:00 ps

    ```'
