  md: '# Chapter 4 ■ Using Common Linux Programs


    Instead, mobile computing typically focuses on small programs known as apps. In
    the case of Android, you can download apps by using an app called Google Play.
    (A web-based version is available at play.google.com/store.) Apps typically provide
    quick and specialized-computation, often employing features of the phone. For
    instance, an app can calculate the calories you''ve burned while riding a bicycle
    or retrieve a weather forecast for your area. Both of these examples use your
    phone''s GPS features to identify the phone''s (and your position)


    Although most Linux applications for desktop and server computers are open source
    and available free of charge, some Android apps are not free. Be sure to check
    the cost before you download an app.


    Android apps are increasingly a source of malware. You can minimize your risk
    by downloading apps only from Google Play or other trustworthy app


