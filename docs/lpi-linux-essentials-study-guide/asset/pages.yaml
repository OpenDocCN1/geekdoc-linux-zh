    tells the shell to go to the next line without waiting for the first to finish.
    If you omit the ampersands in 11.1, the effect will be that the first script won''t
    open the second until the first is closed. Likewise, KMail won''t start until
    the second script terminates.


    Launching several programs from one script can take time in startup and some other
    situations, scripts are also frequently used to run a series of programs manipulate
    data in way. Such scripts do not include the ampersands at the ends of the commands
    because one command must run after another or may even even on output from the
    first. A comprehensive list of commands is impossible because you can run any
    program you can install in Linux as a command—even another script. A few commands
    that are commonly used in scripts such as the following:


