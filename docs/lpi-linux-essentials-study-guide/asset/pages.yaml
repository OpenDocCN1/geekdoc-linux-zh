- pgno: 53
  md: '# What Is a Distribution?


    Up until now, we''ve described Linux as if it were a single OS, of course. This
    isn''t really the case. Many different Linux distributions are available, each
    consisting of a Linux kernel along a set of utilities and configuration files.
    The result is a complete OS, and two Linux distributions can differ from each
    other as much differs from macOS or Windows. We therefore describe in more detail
    what a distribution is, what distributions are popular, and the ways in which
    distribution maintainers keep their offerings up-to-date.


    # Creating a Complete Linux-Based OS


    We''ve already described what makes up a Linux OS, but some details need reiteration
    or elaboration:


    **Linux Kernel** A Linux kernel is at the core of any Linux OS. We have written
    this item as a Linux kernel because the Linux kernel is constantly evolving. Distributions
    are likely to use slightly different kernels. Distribution maintainers also patch
    kernels—that is, they make small changes to fix bugs or add features.


    **Core Units** Tools such as the GNU tool set, the X Window System, and the utilities
    used to manage disks are critical to the normal functioning of a Linux system.
    Most Linux distributions include more or less the same set of such tools, like
    the kernel, but as with it, can vary in versions and patches.


    **Supplemental Software** Additional software, such as major servers, desktop
    environments, and productivity tools, ships with most Linux distributions. As
    with core Unix software, most Linux distributions provide similar options for
    such software. Distributions sometimes provide their own “branding,” though, particularly
    in desktop environments.


    **Startup Scripts** Much of a distribution''s “personality” comes from the way
    it manages its startup. Linux uses scripts and utilities to launch the dozens
    of programs that link the computer to a network, present a login prompt, and so
    on. These scripts and utilities vary between distributions, which means they have
    different features and may be configured in different ways.


    **Installer** Each must be installed, and most Linux distributions provide unique
    installation software to help you manage this task. Thus, two distributions may
    install in different ways, giving you options for key features such as disk layouts
    and initial user account creation.


    Typically, Linux distributions are available for download from their websites.
    You can usually download a CD-R or DVD image file that you can then burn to an
    optical disc. When you boot the system the installer runs and you install the
    OS. You can also use the same image to create a bootable USB flash drive if your
    computer lacks an optical drive. There are also cloud versions of many Linux distributions,
    which allow you to download a complete Linux system to run in either a private
    virtual machine or a commercial cloud such as Amazon Web Services (AWS) or Google
    Cloud Platform.


    ![](img/85a8584ad3f3bd69446d00a129bba855_53_0.png)'
  merge: -1
  img_proc: true
