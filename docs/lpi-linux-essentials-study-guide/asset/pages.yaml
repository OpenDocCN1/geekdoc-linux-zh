  md: '# Where Does Linux Fit in the OS World?


    As you learn more about Linux, you''ll discover that the GUI environments are
    quite flexible. If you find you don''t like the environment that''s the default
    for your distribution, you can change it. Although they provide similar features,
    some people have strong preferences about desktop environments. Linux gives you
    a choice in the matter''s not available in Windows or macOS, so feel free to try
    multiple desktop environments.


    > You may need to install extra desktop environments to use them. This topic is
    not covered in this book.


    # Where Does Linux Fit in the OS World?


    This chapter''s title implies a comparison, and as this book is about Linux, the
    comparison must be to non-Linux OSs. Thus, we compare Linux to three other OSs
    or families: Unix, Apple macOS, and Microsoft Windows.


    > As described later in “What is a Distribution?” Linux can be considered a family
    of OSs. Thus, you can compare one Linux version to another one.


    # Comparing Linux to Unix


    If you want to draw a “family tree” of OSs, you would end scratching your head
    lot. This is because OS designers often mimic one''s features and sometimes incorporate
    one''s code into their OS'' works. The result can be a mess of similarities between
    OSs, with causes ranging from coincidence to “borrowing”. Attempting to map these
    influences can be difficult. In the case of Linux and Unix, though a broad statement
    is possible: Linux is modified after Unix.


    Unix was created in 1969 at AT&T''s Bell Labs. Unix''s history is complex and
    involves multiple forks (that is, splitting of the code into two or more independent
    projects) and entirely separate code rewrites. Modern Linux systems are, by and,
    the product of open source projects that clone Unix programs, or of original open
    source code projects for Unix generally.


    > Open source software is software that you can not only run, modify and redistribute
    yourself. Chapter 3, “Investigating Linux''s Principles and Philosophy,” covers
    the philosophy and legal issues concerning open source software.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Chapter 1 ■ Selecting an Operating System


    These projects include:


    **The Linux Kernel** Linux Torvalds created the Linux kernel as a hobby programming
    project in 1991, but it soon grew to be much more than that. The Linux kernel
    was designed to be compatible with other Unix kernels in the sense that it used
    the same software interfaces in source code. This made using open source programs
    for other Unix versions with Linux easy.


    **The GNU Project** GNU''s Not Unix (GNU) project is an effort by the Free Software
    Foundation (FSF) to develop open source replacements for the core elements of
    an OS. In 1991, the FSF had already replaced the most important tools, with as
    popular as the Linux kernel.). Alternatives to the GNU tools include proprietary
    commercial tools and open source tools developed for the BSD variants. The tools
    used on a Unix-like OS can influence its "flavor," but all of these set tools
    are similar enough to give any Unix variety a similar feel to a non-Unix OS.


    > GNU is an example of a recursive acronym—an acronym whose expansion includes
    the acronym itself. This is an example of geek humor.


    **Xorg-X11** The X Window System is the GUI for most Unix OSs. Most distributions
    today use the Xorg-X11 version of X. As the basic text-mode tools provided by
    GNU, choice of X can affect some features of a Unix-like OS, such as the types
    of fonts it supports. Wayland is a newer Windows System software package used
    in Linux and is gaining popularity.


    **Desktop Environments** GNOME, KDE Plasma, Xce, and other popular open source
    desktop environments have largely displaced commercial desktop environments even
    over commercial versions of Unix. Thus, you will not find big differences between
    Linux and Unix in this area.


    > macOS, described shortly, is technically a commercial Unix but uses a proprietary
    GUI instead of an open source desktop environment running on the X Window System.


    **Server Programs** Historically, Linux and Unix have been popular as server OSs—organizations
    use them to run web servers, database servers, email servers, and so on. Linux
    runs the most popular server programs as commercial Unix versions and the open
    source BSDs.


    **User Productivity Programs** In this realm, as server programs, Linux runs the
    same software as other Unix-like OSs. In few cases, Linux runs more programs or
    runs them better. This is mostly because of Linux''s popularity and the vast array
    of hardware drivers that Linux offers. If a program needs advanced video card
    support, for it''s more likely to find support on Linux than on a less popular
    Unix-like.'
