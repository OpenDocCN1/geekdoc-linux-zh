    allows you to specify the host address, network subnet address, default router,
    and DNS server names by using the manual configuration option, or by Dynamic Host
    Configuration Protocol (DHCP) to determine the settings. Network Manager automatically
    updates the appropriate network configuration with the updated settings.


    # ## Real World Scenario


    # **Manual DNS Configurations**


    One topic that the Linux Essentials exam does expect you to know about network
    configuration files is DNS. You can manually define a DNS server so that the system
    can use DNS host names. Unfortunately, this is a standard that all Linux systems
    follow, which is handled in the /etc/resolv.conf file:


    ```

    domain mydomain.com

    search mytest.com

    nameserver 192.168.1.1

    ```


    The domain entry defines the domain name assigned to the network. By default,
    the system appends this domain name to any host names you specify. The search
    entry defines any additional domains used to search for host names. The nameserver
    entry is where'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Configuring Network Features


    you specify the DNS server assigned to your network. Some networks can have more
    than one DNS server; just add multiple nameserver entries in the file. Be careful,
    though, as this file may reset the next time you boot your Linux system, depending
    on how your Linux distribution is configured. To speed up connections to commonly
    used hosts, manually enter their hosts and IP addresses in the /etc/hosts file
    on your Linux system. The /etc/nsswitch.conf file defines whether the Linux system
    checks this file before or after DNS to look up the host name.


    # Command-Line Tools


    If you''re not working with a graphical desktop client environment, you''ll need
    to use the Linux command-line tools to set the network configuration information.
    Quite a few different command-line tools are at your disposal. This section covers
    the ones you''re most likely to run into (and the ones you''re most likely see
    on the Linux Essentials exam).


    # Network Manager Command-Line Tools


    Network Manager offers two command-line tools:


    +   - nmtuui provides a simple text-based menu tool

    - nmcli provides a text-only command-line tool


    Both of these tools help you through the process of setting the required network
    information for your Linux system. The nmtuui displays a stripped-down version
    of the graphical tool where you can select a network interface and assign network
    properties to it, as shown in Figure 15.3.


    FIGURE 15.3 The Network Manager nmtuui command-line tool


    ![](img/85a8584ad3f3bd69446d00a129bba855_362_0.png)'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'The nmcl tool doesn''t attempt to use any type of graphics capabilities—it
    just provides a command-line interface where you can view and change the network
    settings. By default, the command displays the current network devices and their
    settings, as shown in Listing 15.1.


    # ### Listing 15.1: The default output of the nmcl command


    ```

    $ nmcli

    enp0s3: connected to enp0s3

    "Intel 82540E Gigabit Ethernet Controller (PRO/1000 MT Desktop

    Adapter)

    nether (e1000), 08:00:27:73:1C:6D, hw, mtu 1500

    ip4 default

    inet4 10.0.2.15/24

    route4 0.0.0.0/0

    route4 10.0.2.0/24

    inet6 fe80::5432:eddb:51ea:ff44/64

    route6 ff00::8

    route6 fe80::/64

    route6 fe80::/64

    ```


    The nmcli command uses line-options to allow you to set the network settings:


    ```

    # nmcli con add type eth1 ifname enp0s3 ip4

    192.168.1.15/24 gw 192.168.1.254

    ```


    In this example, we set the IP address to 192.168.1.15, the subnet mask to /24,
    and the default router to 192.168.1.254.


    # ## Traditional-Line Tools


    If your Linux distribution doesn''t support one of the Network Manager tools,
    you can use one of four traditional command-tools:


    +   - ethtool—Displays Ethernet settings for a network interface

    - ifconfig—Displays or sets the IP address and netmask values for a network interface

    - ip—Displays or sets the IP address, netmask, and router values for a network
    interface

    - iwconfig—Displays or sets the SSID and encryption key for a wireless interface

    - route—Displays or sets the default router address


    The ethtool command allows you to peek inside the network interface card Ethernet
    settings and change any properties that you may need to communicate with a network
    device, such as a switch.


    By default, the ethtool command displays the current configuration settings for
    the network interface, as shown in Listing 15.2.'
