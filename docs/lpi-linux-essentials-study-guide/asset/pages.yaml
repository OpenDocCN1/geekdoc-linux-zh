- pgno: 367
  md: '# Chapter 15 • Managing Network Connections


    Certification Objective


    Although the ip command is a one-stop method for changing network settings, an
    alternative way to specify network routing settings for your network is the route
    command:


    ```

    # route add default gw 192.168.1.254

    ```


    You can also use the route command by itself to view the current default router
    configured for the system:


    ```

    $ route

    ```


    | Destination | Gateway | Genmask | Flags | Metric | Ref | Iface |

    | --- | --- | --- | --- | --- | --- | --- |

    | 192.168.1.0 | 192.168.1.254 | 0.0.0.0 | U | 0 | 0 | enp03 |

    | | | 255.255.255 | U | 1 | 0 | 0 | enp03 |


    The default router for the Linux system is 192.168.1.254 and is available from
    the enp03 network interface. The output also shows that to get to the 192.168.1.0
    network you don''t need a gateway, because that the local network system is connected
    to.


    If your network is connected to multiple networks via multiple routers, you can
    manually create the route table in the system using the add or del command-line
    options for the route command. The format is:


    ```

    route [add|del] gw gateway

    ```


    where target is the target host or network and gateway is the router address.


    If your network uses DHCP, ensure that another DHCP client program is running
    on your Linux system. The DHCP client program communicates with the network DHCP
    server in the background and assigns the necessary IP address settings as directed
    by the DHCP server. Three common DHCP client programs available for Linux systems
    are:


    +   - dhcpcd

    - dhclient

    - pump


    The dhcpcd program is the most popular of the three, but you will still see the
    other two used in some Linux distributions.


    When you use Linux system''s software package manager utility to install the DHCP
    client program, it sets the program to automatically launch at boot time and handles
    the IP address connection needed to interact on the network.


    Certification Objective


    Before you use the ip command to assign an address to a wireless interface, you
    must assign the wireless SSID and encryption key values using the iwconfig command:


    ```

    # iwconfig wlan0 ssid "MyNetwork" key s:mypassword

    ```


    The ssid parameter specifies the access point SSID name, and the key parameter
    specifies the encryption key required to connect to it. Notice that the encryption
    key is preceded'
  merge: -1
  img_proc: true
