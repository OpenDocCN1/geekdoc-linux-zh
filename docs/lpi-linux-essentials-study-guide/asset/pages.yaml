- pgno: 339
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_339_0.png)


    As a multiuser OS, Linux provides tools to help you secure your files against
    unwanted access—after all, you wouldn''t want another user to accidentally (or
    intentionally) read personal or delete your files! Linux handles these tasks through
    two features of files and directories: their *ownership* and their *permissions*.
    Every file has an associated owner (that is, an account with which it''s linked
    as well as an associated group. Three sets of permissions define the file''s owner,
    members of the file''s group, and all other users can do with the file. Thus,
    ownership and permissions are intertwined, although you use different text-mode
    commands to manipulate them. GUI tools often combine the two, as described in
    this chapter.


    # Setting Ownership


    The security model for Linux is based on that of Unix, which was designed as a
    multiuser OS. This security model assumes the presence of multiple users on the
    computer and provides the means to associate individual files with the users who
    create them—that is, files have *owners*. You should thoroughly understand this
    concept, and with knowledge, you can help protect your files, using either a GUI
    manager or a text-mode shell command.


    Ownership also applies to running programs (that is, *processes*). Most programs
    you run are tied to the account you use to launch them. This identity, in conjunction
    with the file''s ownership and permissions, determines whether a program may modify
    a file.


    # Understanding Ownership


    Chapter 12, “Understanding Basic Security,” and Chapter 13, “Creating Users and
    Groups,” describe Linux''s system of accounts. Specifically, every file has an
    owner—an account with which it''s associated. The *user ID* (UID) number associates
    the file with an owner, whereas the *group ID* (GID) associates the file with
    a group.


    As described, in the section “Setting Permissions,” you control access to the
    file through permissions you set independently for the file''s owner, the file''s
    group, and all other users of the computer. As root, you can change the owner
    and group of any file. The file''s owner can also change the file''s group, but
    only to a group to which the user belongs.


    The same principles of ownership apply to directories as well as files: directories
    have owners. They can be changed by *root* or, to a more limited extent, by the
    directory''s owner.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Setting Ownership in a File Manager


    As described in Chapter 4, “Using Common Linux Programs,” you can manipulate files
    with a file manager. You''re probably familiar with file managers in Windows or
    macOS. Linux''s ownership and permissions are different from those of Windows,
    though, you may want to know how to check on, and perhaps change features using
    a Linux file manager. As noted in Chapter 4, you have a choice of several file
    managers in Linux. Most are similar in broad strokes but differ in some details.
    In this section we''ll use GNOME Files manager as an example.


    If you want to change the owner, you must run Files as root, but you can change
    the file''s group to any group which you belong as an ordinary user. The procedure
    to perform this task is as follows:


    +   1. Launch a terminal window.

    2. In the terminal window, type su to acquire root privileges.


    > > ![WARNING](image_url_placeholder)

    > Some Linux distributions don''t allow you to use the su command to acquire root
    privileges. For example, if you''re using the GNOME version of Ubuntu you may
    instead need to use sudo to launch GNOME Files from the command line.


    +   3. In the terminal window, type nautilus to launch GNOME Files (the Files
    application was called Nautilus in previous versions of GNOME, and the name has
    stuck around). You can optionally include the path to the directory in which you
    want Files to start up. If you don''t include a path, it will begin by displaying
    the contents of the /root directory.


    > > The /root directory is the account''s home directory.


    +   4. Locate the file whose ownership you want to adjust and right-click it.

    5. In the resulting menu, select Properties. The result is a Properties dialog.

    6. In the Properties dialog, click the Permissions tab. The result resembles Figure
    14.1.

    7. To change the file''s owner, select a new owner in the Owner field. This action
    is possible only if you run GNOME Files as root.

    8. To change the file''s group, select a new group in the Group field. If you
    run GNOME Files as an ordinary user, you will be able to select any group to which
    you belong, but if you run GNOME Files as root, you will be able to select any
    group.

    9. When you''ve adjusted the features you want to change, click the X in the title
    bar to close the window.


    If you want to change a file''s group but not its owner, and if you''re a member
    of the target group, you can launch GNOME Files as an ordinary user. You can then
    pick up the preceding procedure at step 4.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Chapter 14 • Setting Ownership and Permissions


    FIGURE 14.1 Linux file managers give you access to the file’s ownership and permission
    metadata.


    ![](img/85a8584ad3f3bd69446d00a129bba855_341_0.png)


    You should be extremely cautious about running GNOME Files as root. If you forget
    you''re running this program as root, you can easily create new files as root,
    which will require root privileges to make any changes to file ownership or permissions
    later. It''s also easy to accidentally delete critical system files from root
    that you not delete as an ordinary user. For these reasons, I recommend that you
    use a text-mode shell to adjust file ownership. The change in the prompt makes
    it easier to notice you''re running as root, and if you''re using a GUI, you''re
    less likely to launch additional programs as root from a text-mode shell than
    GNOME Files.


    # Setting Ownership in a Shell


    The command to change the ownership of a file in the preferred text-mode manner
    chown. In its most basic form, you pass the name of the file followed by a username:


    > The chown command''s name stands for change owner.


    ```

    # chown rich targetfile.of


    This example gives ownership of targetfile.of to rich. You can change the file''s
    principal owner and its group with a single command by separating the owner and
    group with a colon (:) or a period (.).


    # chown bob:users targetfile.of


    This example gives ownership of targetfile.of to bob and associates the file with
    the users group. To change the group without changing the owner, you can omit
    the owner, leaving the colon and group name:


    $ chown :users targetfile.of

    ```'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Setting Ownership


    # 303


    Alternatively, you can use the chgrp command, which works in the same way as changes
    only the group and does not require the colon before the group name:


    Certification Objective


    ```

    $ chgrp users targetfile.od

    ```


    Note that the commands used to change the owner root privileges, whereas you can
    change the group as an ordinary user—but only if you own the file and belong to
    the target group.


    The chown and chgrp commands both support a number of options. The most useful
    of these is -R (--recursive), which causes a change in ownership of all the files
    in an entire directory. For instance, suppose that the user christine has left
    a company and an existing employee, rich, must access all files. If christine''s
    home directory was /home/christine, you might want


    ```

    # chown rich /home/christine

    ```


    This command gives rich ownership of the /home/christine directory; all the files
    in the /home/christine directory, including all its subdirectories; the files
    in the subdirectories; and so on. To make the transition bit easier for rich,
    you might also want to move christine''s home directory into rich''s directory.


    ![](img/85a8584ad3f3bd69446d00a129bba855_342_0.png)


    # Real World Scenario


    # Cross-Installation UIDs and GIDs


    You may have multiple Linux installations, either dual-booting on one computer
    or installed on multiple computers. If so, and you transfer files from one installation
    to another, you may find that the ownership of files changes as you move them
    around. The same thing can happen with non-Linux-like OSs, such as macOS. The
    reason is that the filesystems for these OS store ownership and group information
    using UID and GID numbers, and a single user or group can have different UID or
    GID numbers on different computers. If so, and the name associated with the account
    or group is


    This problem is most likely to occur when using Linux or Unix filesystems for
    data, including disk-based filesystems (such as ext4 in Linux or HFS+ in macOS)
    or the Network File System (NFS) for remote file access. This problem is less
    likely to occur if you use non-Linux/Unix filesystems, such as the File Allocation
    Table (FAT) or (NTFS), the Server Message Block/Common Internet File System (SMB/CIFS;
    handled by Samba in Linux) for network.


    If you run into this problem, several solutions exist, but many of them are beyond
    the scope of this book. You can use, though, is to change the UID or GID mappings
    on one or more installations so that they all match. Chapter 13 describes how
    to change a user''s UID number with usermod and how to change a group''s GID number
    with groupmod when you are transferring data via removable disks, using FAT or
    NTFS can be a simple solution, provided you don''t need to preserve Unix-style
    permissions on the files.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Setting Permissions


    File ownership is meaningless without some way to specify what particular users
    can do with their own or other users'' files. That''s where permissions enter
    the picture. Linux''s permission structure is modeled after that of Unix, and
    it requires a bit of explanation before you tackle it. After you understand the
    basics, you can begin modifying permissions, using either a GUI file manager or
    a text-mode shell. You can also set default permissions for new files.


    # Understanding Permissions


    To understand Unix (and here Linux), you may want to begin with the display created
    by the `ls` command, which lists the files in a directory, in conjunction with
    its `-l` option, which creates a long directory listing that includes files''
    permissions. For instance, to see a long list of the file, you must type


    > Chapter 5, "Getting to Know the Command Line," introduced the ls command, and
    describes additional ls options.


    ```

    $ ls -l test

    -rwxr-xr-x 1 rich users 111 Oct 13 13:48 test

    ```


    This line consists of several sections, which provide assorted pieces of information
    on the file:


    **Permissions** The first column (-rwxr-xr-x in this example) is the file''s permissions.


    **Number of Links** The next column (1 in this example) shows the number of hard
    links to the file—that is, the number of unique filenames that may be used to
    access the file.


    > Chapter 7, "Managing Files," describes links in more detail.


    **Username** The next column (rich in this example) identifies the file''s owner
    by username.


    **Group Name** The file''s group (users in this example) appears next.


    **File Size** This example file''s size is quite small—111 bytes.


    **Time Stamp** The time stamp (Oct 13 13:48 in this example) identifies the time
    the file was last modified.


    **Filename** Finally, ls -l shows the file''s name—test in this example.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'The string that begins this output (-rwxr-xr-x in this example) is a symbolic
    representation of the permissions string. Figure 14.2 shows how this string is
    broken into four parts:


    # FIGURE 14.2 A symbolic representation of file permissions is broken into four
    parts.


    | File Type | Owner Permissions | Group Permissions | World Permissions |

    | --- | --- | --- | --- |

    | | r | w | x | r | w | x | r | w | x |

    | read | write | execute | read | write | execute | read | write | execute |


    **The File Type Code** is the file type, which represents the file''s type, as
    summarized in Table 14.1. This type character is sometimes omitted from descriptions
    when the file type is not relevant or when it is identified in some other way.


    | Code | Name | Meaning |

    | --- | --- | --- |

    | - | Normal data file | May be text, an executable program, graphics, compressed
    data, or just any other type of data. |

    | d | Directory | Disk directories are files, but they contain filenames and pointers
    to those named files'' data structures. |

    | l | Symbolic link | The symbolic link file contains the name of another file
    or directory. When Linux accesses the symbolic link, it tries to read the linked-file.
    |

    | p | Named pipe | A pipe enables two running Linux programs to communicate with
    each other in a one-way fashion. |

    | s | Socket | A socket is similar to a named pipe, but it permits network and
    bidirectional links. |

    | b | Block device | A block device file that corresponds to a hardware device
    and from which data is transferred in blocks of more than one byte. Disk devices
    (hard disks, floppies, CD-ROMs, and so on) |

    | c | Character device | A character device file that corresponds to a hardware
    device to and from which data is transferred in units of one byte. Examples include
    parallel and RS-232 serial port devices.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Chapter 14 • Setting Ownership and Permissions


    > Most of the files you''ll manipulate are normal files, directories, and symbolic
    links.


    **Owner Permissions** These permissions determine what the file''s owner can do
    with the file.


    **Group Permissions** These permissions determine members of the file''s group
    (who aren''t its owner) can do with the file.


    **World (or "Other")** These permissions determine what users aren''t the file''s
    owner or members of its group can do with the file


    In each of three sets of permissions, the string identifies the presence or absence
    of three types of access: read, write, and execute. Read and write permissions
    are fairly self-explanatory. If the execute permission is present, it means the
    permission is denoted by a dash (-) in the permission string. The absence of permission
    is indicated by the letter *r* for read, *w* for write, or *x* for execute.


    Setting the execute bit on a non-program file doesn''t turn it into a program,
    of course; it just indicates that a user may run a file that is a program.


    Thus, the example permission string *r-wx-r-* means that the file is a normal
    data file and its owner, members of the file''s group, and all other users can
    read and execute the file. Only the file''s owner have write permission to the
    file.


    Another representation of permissions is possible. It is compact but a bit confusing;
    it takes each of the three permissions groupings of the permission string type
    code) and converts it into a number from 0 to 7 (that is, a base 8 or octal number).
    The result is a three-digit octal number. Each number is constructed by starting
    with a value of 0 and then:


    +   - Adding 4 if read permissions are present

    - Adding 2 if write permissions are present

    - Adding 1 if execute permissions are present


    The resulting three-digit code represents permissions for the owner, the group,
    and the world. Table 14.2 shows some examples of common permissions and their
    meanings.'
