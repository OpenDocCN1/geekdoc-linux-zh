  md: '# Manipulating Files


    If you pass touch the name of a file that already exists, touch updates that file''s
    access and modification timestamps to the current date and time. This can be handy
    if you''re using a command that works on files based on their access times, and
    you want the program to treat an old file as if you''re new. You might also want
    to do this if you plan to distribute a collection of files and you them all to
    have identical timestamps.


    A programmer''s tool known as make compiles source code if it''s new, so programmers
    sometimes use touch to force make to recompile source code.


    You can use many of options with touch to modify your file. The most important
    of these are as follows:


    +   **Don''t Create a File** `-c` or `--no-create` option tells touch not to create
    a new file if one doesn''t already exist. Use this option to update timestamps
    but you do not want to create a file accidentally, should you mistype a filename.


    +   **Set the Time to a Specific Value** You can use `-d` or `--date=string` to
    set the date of a file to be represented by the specified string, which can take
    any number of forms. For instance, `touch -d "July 4 2019" afile.txt` causes the
    date stamps on afile.txt to be set to July 4, 2019. You can achieve the same effect
    with `[[CC YY]] MMDDhh.[ss]]` which is a date and time in a specific numeric format,
    as `201907041223` for 12:23 pm on July 4, 2019.


    +   Consult the man page for touch to learn about its obscure options.


