    # Real World Scenario


    # Obtaining Wi-Fi Drivers


    Unfortunately, Linux driver for Wi-Fi hardware is fairly weak. If you don''t see
    your Wi-Fi hardware when you try to configure it, you may need track down drivers.
    You can begin this task with a tool called lspci, which is described in Chapter
    6, "Managing Hardware." A search with no options to see a list of available hardware-ware
    and search for a wireless network adapter. For instance, my laptop''s lspci output
    includes the following line:


    ```

    03:00.0 Network controller: Realtek Semiconductor Co., Ltd.m

    RTL8191SEVB Wireless LAN Controller (rev 10)

    ```


    This line identifies the Wi-Fi adapter as a Realtek RTL8191SEb. A search on Realtek''s
    website turns up a driver; however, this to be compiled locally, which is a topic
    that''s beyond the scope of this book. You also might not be lucky enough to find
    a driver in this way.


    An alternative to using a native Linux driver is to use a Windows driver. This
    unusual option is possible using a package called ndiswrapper (http://ndiswrapper.sourceforge.net),
    which enables you to install Windows Wi-Fi drivers in Linux. Not all distributions
    provide ndiswrapper in their standard package sets, but you can find a binary
    in an add-on repository.


    If all other options fail, you may need to buy new networking hardware. Many USB
    Wi-Fi adapters are available, but you should research them to find one that has
    good Linux support. You can also replace the built-in adapters on some laptops.


    # Basic Network Troubleshooting


    After you have a kernel installed, you can take a few steps to check that things
    are operating properly. This section walks through the commands you should know
    to monitor the network activity, including watching what processes are listening
    on the network and what connections are active from your system.'
  merge: -1
  img_proc: true
- pgno: 369
  md: "# Sending Test Packets\n\nOne way to test network connectivity is to send packets\
    \ to known hosts. Linux provides the ping and ping6 commands to do that. The ping\
    \ and ping6 commands send Internet Control Message Protocol (ICMP) packets to\
    \ remote hosts using either the IP (ping) or IPv6 (ping6) protocols. ICMP packets\
    \ work behind the scenes to track connectivity and provide control messages between\
    \ systems. If the remote host supports ICMP, it will send a reply packet when\
    \ it receives a ping packet.\n\nThe basic format for ping is to specify the IP\
    \ address of the remote host:\n\n# $ 10.0.2.2\n\n```\nPING 10.0.2.2 (10.0.2.2)\
    \ 56(84) bytes of data.\n64 bytes from 10.0.2.2: icmp_seq=1 ttl=63 time=14.6 ms\n\
    64 bytes from 10.0.2.2: icmp_seq=2 ttl=63 time=3.82 ms\n64 bytes from 10.0.2.2:\
    \ icmp_seq=3 ttl=63 time=2.05 ms\n64 bytes from 10.0.2.2: icmp_seq=4 ttl=63 time=0.088\
    \ ms\n64 bytes from 10.0.2.2: icmp_seq=5 ttl=63 time=3.54 ms\n64 bytes from 10.0.2.2:\
    \ icmp_seq=6 ttl=63 time=3.97 ms\n64 bytes from 10.0.2.2: icmp_seq=7 ttl=63 time=0.040\
    \ ms\n---\n 10.0.2.2 ping statistics ---\n7 packets transmitted, 7 received, 0%\
    \ packet loss, time 6020ms\nrtt min/avg/max/mdev = 0.040/4.038/14.696/4.620 ms\n\
    $\n```\n\nThe ping command continues sending packets until you press Ctrl+C. You\
    \ can also use the -c command-option to specify a set of packets to send and then\
    \ stop.\nWith you're using an IPv6 local address, you also need to tell the interface\
    \ through which to send the packets out:\n\n# $ ping -c 4 fe80::c418:2ed0:aead:bcce%enp0s3\n\
    \n```\nPING fe80::c418:2ed0:aead:bcce%enp0s3 (fe80::c418:2ed0:aead:bcce%enp0s3)\
    \ 56 data bytes\n64 bytes from fe80::c418:2ed0:aead:bcce%enp0s3: icmp_seq=1 ttl=128\
    \ time=1.47 ms\n64 bytes from fe80::c418:2ed0:aead:bcce%enp0s3: icmp_seq=2 ttl=128\
    \ time=0.48 ms\n64 bytes from fe80::c418:2ed0:aead:bcce%enp0s3: icmp_seq=3 ttl=128\
    \ time=0.777 ms\n64 bytes from fe80::c418:2ed0:aead:bcce%enp0s3: icmp_seq=4 ttl=128\
    \ time=0.659 ms\n---\n fe80::c418:2ed0:aead:bcce%enp0s3 ping statistics ---\n\
    4 packets transmitted, 4 received, 0% packet loss, time 3003ms\nrtt min/avg/max/mdev\
    \ = 0.478/0.847/1.475/0.378 ms\n$\n```"
  merge: -1
