    # The Microkernel Debate


    Linux is an of monolithic kernel, which is a kernel that does everything a kernel

    is supposed to do in one big process. In 1991, a competing kernel design, known
    as a

    microkernel, was the rage. Microkernels are much smaller than monolithic kernels;

    they move as many tasks as they can into non-kernel processes and manage the

    communications between processes.


    Soon after Linux''s release, Torvalds engaged in a public debate with Andrew

    Tanenbaum, the creator of the Minix OS that Torvalds used as an early development

    platform for Linux. Linux uses a microkernel design, and Tanenbaum considered
    Linux''s

    monolithic design to be backward.


    As a practical matter for an end, either design works. Linux and the BSD-derived
    kernels

    use monolithic designs, whereas modern versions of Windows, the GNU HURD, and
    Minix

    are examples of microkernels. So some people still get over this distinction,
