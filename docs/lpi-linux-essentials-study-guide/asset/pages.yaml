- pgno: 283
  md: "# Using Functions\n\nAnother type of loop is the while loop, which executes\
    \ for as long as its condition is true. The basic form of this loop type is:\n\
    \n```\nwhile [ condition ]\ndo\n  commands\n```\n\nThe until loop is similar in\
    \ form, but it continues execution for as long as its condition is false—that\
    \ is, until the condition becomes true.\n\nA function is a part of a script that\
    \ performs a specific subtask and that can be called by name from other parts\
    \ of the script. Functions are defined by placing parens after the function name\
    \ and enclosing the lines that make up the function within braces:\n\n```\nmyfn()\
    \ {\n  commands\n```\n\nThe keyword function may optionally precede the function\
    \ name. In either event, the function is called by name as if it were an ordinary\
    \ internal or external command. Functions are very useful in helping to create\
    \ modular scripts. For instance, if your script needs to perform a dozen distinct\
    \ computations, you can place each computation in a function and then call all\
    \ in sequence. Listing 11.6 demonstrates the use of functions in a simple program\
    \ that copies a file aborts with an error message if the target file already exists.\
    \ This script accepts a target and a destination filename and must pass those\
    \ filenames to the functions.\n\n# Listing 11.6: A script demonstrating the use\
    \ of functions\n\n```\n#/bin/bash\n\ndoit() {\n  cp $1 $2\n}\n\nfunction check()\
    \ {\n  if [ -s $2 ]\n    then\n      echo \"Target file exists! Exiting!\"\n \
    \     exit\n}\nfi\n```"
