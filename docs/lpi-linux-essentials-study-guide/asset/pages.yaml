    # # Summary


    Software and hardware interact in numerous ways to determine a computer''s capabilities.
    Your CPU is one determinant of your computer''s speed, and it also specifies which
    version of Linux you can run. CPUs are mounted on motherboards, which contain
    critical circuitry for managing hard disks, displays, and other devices. Your
    hard disk is partitioned with one or more filesystems before it''s useful. Video
    hardware—both the monitor and the video circuitry inside the computer—determine
    how your desktop environment looks and how fast the computer can manage windows
    and display videos. USB manages most external devices, as keyboards, mice, and
    external disks. Software manages all these hardware devices.


    # # Exam Essentials


    Explain the major hardware components Linux must interact with a desktop or server
    computer. The main component of any computer system is the motherboard. The motherboard
    contains the CPU processor, memory, a power supply, and interfaces that connect
    with external devices. Desktop and server computers use the PCI connector to interface
    with hard disks, video cards, and network cards. The USB interface is used to
    connect with external devices such as the keyboard, mouse, and any external storage
    disks and optical drives.


    Explain how Linux interacts with the various types of hardware devices. Linux
    uses software drivers to communicate with each hardware device. Linux drivers
    can be included as part of the kernel, or loaded later as a kernel module. Linux
    drivers exist for various printers, monitors, network cards, and other types of
    storage devices such as USB drives.


    Explain how Linux stores data on disks. Linux splits storage devices into partitions
    organizing the data stored on them. Linux provides several tools for partitioning
    storage devices, such as the ext3 and ext4 utilities. After creating the partitions,
    you must format each partition using a specific filesystem. Different filesystem
    types have different features, such as dependability, speed of access, or file
    sizes, so you can choose the filesystem type that works best for your application
    for each partition. After creating a filesystem in the partition, you can mount
    it in the Linux virtual directory structure so that the Linux system can access
    it to read and write data.'
