- pgno: 398
  md: '# Chapter 15: Managing Network Connections


    +   7. B. The -R (or --recursive) option allows Linux to recursively change the
    ownership of a directory and all files and directories under it, so option B is
    correct. The -L option allows Linux to follow any symbolic links encountered in
    the directory, recursively change the entire directory, so option A is incorrect.
    The -H option tells Linux to follow the symbolic link if it''s listed as the command-line
    argument, recursively change ownership in the entire directory, so option C is
    correct. The -P option tells Linux not to follow any symbolic links in the directory,
    ownership in the directory tree, so option D is incorrect. The -f option tells
    Linux to suppress any error messages, recursively change ownership on an entire
    directory tree, so option E is correct.


    +   8. C. Symbolic permissions are indicated by the three-character string rwx.
    If a permission is not present, the character is replaced by a dash, so remove
    permissions you would use the character x-. The -wx symbol indicates write and
    execute permissions, so option A is incorrect. The -x symbol indicates no read
    and write permissions, execute permissions, so option B is correct. The rw symbol
    indicates read and write permissions but no execute permission, so option D is
    incorrect. The rwx symbol indicates read write execute permissions, so option
    E is incorrect.


    +   9. E. The chmod command uses the character to represent permissions to all
    users. To add a permission, you use the sign (+), and to execute permissions you
    use the x character. Thus, option E is correct. The u+x symbol adds execute permissions
    to the user, not all users, so option A is incorrect. The u-x symbol removes execute
    permissions from the owner and doesn''t change the permissions for everyone, so
    option B is incorrect. The g+x symbol adds permissions to the group but not for
    users, so option C is incorrect. The a-x symbol removes permission for all users—it
    does not add—so option D is incorrect.


    +   10. A. To add a sticky bit to a directory you use the t character and add
    it to the permission set (o), so option A is correct. You add the sticky bit permissions
    to the owner, not the group, or all users, so option C and D are incorrect. The
    w character is used to assign write permissions, not the sticky bit, so option
    B and E are incorrect.


    # Chapter 15: Managing Network Connections


    +   1. C. The ifconfig command provides an interactive text menu for selecting
    a network interface and setting the network parameters, and the ip command provides
    a command line tool for setting network parameters, so both options C and D are
    correct. The stat command displays information about network connections but doesn''t
    set the network parameters, so option A is incorrect. The ping command can send
    ICMP packets to a remote host but doesn''t set the local network parameters, so
    option B is incorrect. The route command sets the routing network parameters but
    not the IP address or subnet mask, so option E is incorrect.'
