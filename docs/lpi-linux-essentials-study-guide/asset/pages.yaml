- pgno: 132
  md: '# Understanding Text-Mode Program Syntax


    You may think that some master programmer designed and created all the various
    commands, but that is not true. While a few share common programmers, many command
    programs were written by different individuals, so you''ll find the way to use
    them as well. Fortunately, many commands follow a basic syntax:


    ```

    COMMAND-NAME [OPTION]... [ARGUMENT]...

    ```


    In the command''s syntax structure:


    +   - COMMAND-NAME is the name of the command used to run the program.

    - [OPTION] are optional items added to modify the command''s behavior. There are
    typically various OPTIONs (also called switches) you can add. The brackets ([])
    indicate that OPTIONs are optional, and the three periods (...) show that you
    can use more than one. (Wait, the text says: that OPTIONs are optional, and the
    three periods (...) show that you can use more than one).

    - [ARGUMENT] is an item you pass to the command to let the program know you want
    to operate on that item. An argument can also be a subcommand. You can see that
    it too is optional due to the brackets, and you can pass multiple ARGUMENTS to
    the program.


    If you want to use more than one command option, often then you can squish them
    together. For example, you use the options -a and -b, you type -ab.


    The who program displays which users are currently on the system:


    ```

    $ who

    rich tty7 2020-07-16 16:40 (:)

    christine pts/1 2020-07-16 16:37 (192.168.0.102)

    ```


    In this book, commands you type are in **bold monospace font**, and the program
    output is in standard monospace font.


    However, you can modify this command displays by displaying the -b option to it.
    In this case, the program shows when the system was started:


    ```

    $ who -b

    system boot 2020-07-16 16:16

    ```


    An example of a command that accepts *arguments* is the cat command, whose name
    is short for *concatenate*. The cat command can quickly display a short text file
    on the screen. In this example, cat takes the filename MyFile.txt as an argument:


    ```

    $ cat MyFile.txt

    This is the contents of MyFile.txt.

    ```'
