- pgno: 161
  md: 'In addition to x86 and x86-64 CPUs, several other model lines are available.
    Most of these CPUs are used in embedded applications or in very high-end servers.
    Here are a few that you might encounter:


    ARM The Advanced RISC Machine (ARM) processor was introduced in 1985 but has recently
    taken off as the main processor in small devices, such as tablets and embedded
    computer systems. The RISC acronym in name stands for Reduced Instruction Set
    Computing, which means supports fewer instructions, which means less transistors
    are needed in the system, which turn means less power consumption by the CPU chip.
    This is what makes ARM processors ideal for small devices that run Linux.


    PowerPC This CPU, created as a cooperative effort of Apple, IBM, and Motorola,
    was Apple''s PC of choice between 1994 and 2006, and is so found in Mac computers
    of vintage. Today, it''s used in game consoles, embedded devices, and servers.
    Both 32 and 64-bit versions of this architecture are available. PPC is a common
    abbreviation for this architecture.


    Itanium Intel created the Itanium, or IA-64, as a 64-bit replacement for the x86
    line; however, it gained little market penetration in the server field.


    Linux can run on ARM, PowerPC, and Itanium, as well as on other CPU families,
    such as the Microprocessor with Interlocked Pipelined Stages (MIPS) and the Scalable
    Processor Architecture (SPARC); however, your choice of distribution is likely
    to be limited. Because software has to be recompiled and tested on new architectures,
    it takes effort to prepare a distribution for each architecture, and many distribution
    maintainers are unwilling or unable to expend this effort for more than x86 and
    x86-64.


    > The Debian Linux distribution is available on many architectures, so if you
    need to support Linux on a wide range of CPUs, using Debian can make sense.


    Many CPUs are multicore models. These CPUs package the circuitry for two or more
    CPUs into one unit. When plugged into a motherboard, a CPU looks like multiple
    CPUs to the OS. The advantage is that Linux can run as many CPU-intensive programs
    as you have cores and they won''t slow each other down by competing for CPU resources.


    Some high-end motherboards also support multiple CPUs, so you can use, say, two
    4-core CPUs to get the performance of a single 8-core CPU system.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Identifying Your CPU


    If you''ve got a working Linux system, you can learn a great deal about your CPU
    by using three text-mode commands at the shell prompt:


    +   **uname -a** Typing uname displays basic information on the kernel and the
    CPU. For instance, one of my systems returns x86_64 AMD Phenom II X3 700e Processor,
    among other things, indicating the manufacturer and model number of the CPU.


    +   **lscpu** The lscpu command returns additional information about 20 lines
    of output. Much of this information is highly technical, such as the sizes of
    caches the CPU supports. Some of it is less technical, such as the architecture
    and number of CPUs or cores


    +   **cat /proc/cpuinfo** cat /proc/cpuinfo still returns more information. You
    won''t need this information yourself, but a developer or technician might need
    some of it to help debug a problem.


    One to keep in mind is that modern x86-64 CPUs can run software compiled for the
    older x86 architecture. So, you might be running a 32-bit Linux distribution on
    a 64-bit CPU. The output of these commands can be confusing in such cases. For
    instance, here''s part of what lscpu shows on one system:


    | Architecture: | i686 |

    | CPU op-mode(s): | 64-bit |


    The architecture line suggests an x86 CPU (i686 being a specific variant of that
    architecture), but the CPU op-mode(s) line indicates that the CPU supports 64-bit
    operation. If you have trouble interpreting this output, you may be able to find
    something by looking up the CPU''s model on the manufacturer''s website. However,
    manufacturers tend to bury such information in hard-to-read specification sheets,
    so be prepared to read carefully.


    # Identifying Motherboard Capabilities


    If the CPU is the computer''s brain, the motherboard is the rest of the central
    nervous system. The motherboard is a large circuit board inside the computer.
    It''s dominated by a chipset, which is one or more chips that provide key functionality
    for the computer—they help the CPU interface with the hard disk interfaces, the
    USB interfaces, the network devices, and so on. Some chipsets include video circuitry
    for video cards, although this functionality is sometimes separate, and sometimes
    it''s built into the CPU.


    ![](img/85a8584ad3f3bd69446d00a129bba855_162_0.png)


    Motherboards are sometimes referred to as mainboards.


    ![](img/85a8584ad3f3bd69446d00a129bba855_162_1.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'In addition to the chipset, motherboards include plug-in interfaces for key
    components:


    +   - One or more slots for the computer''s CPU(s)

    - Slots for random access memory (RAM)

    - Slots for plug-in Peripheral Component Interconnect (PCI) or other cards

    - Connectors for internal hard disks, such as the Serial Advanced Technology Attachment
    (SATA) interface

    - Back-panel connectors that provide external interfaces for USB devices, keyboards,
    monitors, and so on

    - Connectors for additional devices, such as front-panel USB plugs; such devices
    are attached via short cables


    Some motherboards—typically used in larger desktop and server computers—have many
    connectors for many purposes. Such motherboards are highly expandable, but they''re
    large enough to require bulky cases. Other motherboards are much smaller and can
    be used in compact computers, but such aren''t expandable. Laptop computers also
    have motherboards, which are mostly of the small variety, with little opportunity
    for internal expansion.


    Most of the connectors on a motherboard are managed by its primary chipset. Some
    high-end boards provide connectors for features beyond those of its primary chipset.
    Some features require a secondary chipset, such as an Ethernet chipset for a network
    work port or an extra SATA chipset for harder disk interfaces.


    Whether the feature is provided by the main or by a secondary chipset, you can
    learn about the motherboard''s features with the llsp command, which shows information
    on PCI devices. The output looks something like this shortened example:


    # # lspci


    ```

    00:00.0 Host bridge: Advanced Micro Devices [AMD] RS780 Host Bridge

    00:11.0 SATA controller: ATI Technologies Inc SB780/SB880 SATA controller

    Controller [IDE mode]

    00:12.0 USB controller: ATI Technologies Inc SB780/SB880 USB OHCI0

    Controller

    00:14.1 IDE interface: ATI Technologies Inc SB780/SB880 IDE Controller

    00:14.2 Audio device: ATI Technologies Inc SB8x0 Azalia (Intel HDA)

    01:05.0 VGA compatible controller: ATI Technologies Inc Radeon HD 3200m

    Graphics

    01:05.1 Audio device: ATI Technologies Inc RS780 Azalia controller

    02:00.0 Ethernet controller: Realtek Semiconductor Co., Ltd.m

    RTL8111/8168b PCI Express Gigabit Ethernet controller (rev 02)

    03:06.0 Ethernet controller: Intel Corporation 82559 InBusiness 10/100m

    (rev 08)

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Understanding Disk Issues


    You may not understand everything in this output, but you should be able to glean
    information from it. For instance, the computer has a number of ATI devices—a
    SATA controller, a USB controller, a graphics adapter, and so on. Two Ethernet
    devices are present—one made by Realtek and the other by Intel. It''s not obvious
    from this output, the Realtek network adapter is built into the motherboard, where
    the Intel device resides on the plug-in card.


    # Sizing Your Power Supply


    A computer''s power supply takes the alternating current (AC) from a wall outlet
    and converts it to the direct current (DC) that your motherboard and everything
    you plug into uses. Laptop computers and small desktop units use power adapter
    “bricks” and Larger desktop computers have internal power units. These internal
    units are larger, both physically and in terms of the power they deliver.


    Every power supply has limits on the DC power it can deliver. This is important
    because every device you plug into the computer consumes a certain amount of power.
    If your manufacturer cuts corners, the power supply may be barely adequate for
    the computer as delivered. If you add a hard disk or a power-hungry plug-in, you
    could exceed the amount of power that the power supply can deliver. The result
    can be unreliable operation—the computer can crash or behave erratically, perhaps
    corrupting data or files. Problems can be hard to distinguish from other problems,
    such as bad RAM or a failing hard disk.


    If you need to replace your power supply, pay attention to its output in watts.
    You will need to find the output of your current power supply on a sticker—but
    you’ll need to open your computer, at least for most desktop systems. Be sure
    to get a power supply that’s rated for least as many watts as you’re replacing.
    Also, be sure it fits—sizes are standardized, but a few variants are available.
    In the case of a laptop or a small desktop with an external power supply, you
    must ensure that a replacement provides the right type of connector to the computer.
    Buying a replacement for the computer’s manufacturer is usually the best course
    of action in this case.


    # Understanding Disk Issues


    Disks are a critical part of most Linux installations, so it''s important to know
    how they operate and how Linux interacts with them. This section describes three
    basic disk issues: disk hardware interfaces, disk partitioning, and filesystems.
    In addition, it describes some of the issues surrounding removable disks, including
    optical (CD-ROM, DVD-ROM, Blu-ray) discs.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Chapter 6 ■ Managing Hardware


    You can install Linux in a diskless configuration, in which a Linux computer boots
    using files stored on a network server.


    # Disk Interfaces


    Today, three disk interfaces are common:


    PATA This interface was very common in the past, but it''s fading in popularity.
    It features wide 40- or 80-pin cables that transfer bits of data simultaneously—hence
    the word parallel in the Parallel ATA (PATA). A PATA cable can have up to three
    connectors—one for the motherboard or disk controller and two up to two hard disks.
    Alternative names for PATA (or specific variants of it) include Integrated Device
    Electronics (IDE) or Enhanced IDE (EIDE). The ATA Packet Interface (ATAPI) defines
    a software interface that helps manage devices other than hard disks. In some
    cases the differences between the technologies described by these variants are
    important—today they are often used synonymously.


    SATA In 2003, a serial version of the ATA protocol was created, hence Serial ATA
    (SATA). SATA is more or less compatible with PATA, but it uses thinner cables
    that can handle just one hard disk per cable. In 2012, SATA became the dominant
    disk technology on new computers. An external variant, eSATA, provides high-speed
    connections to external disks.


    NVMe The Non-volatile Memory Express (NVMe) interface was designed specifically
    to support the solid-state drive (SSD) storage standard. SSD devices do not use
    platters and magnetic heads to read or write data; instead, data is stored electronically
    just like in memory, using flash chips that retain data after power is removed
    from the system. Because data is read and written electronically instead of magnetism,
    access speeds are significantly faster, and SSD drives are not susceptible to
    the same failures as PATA and SATA hard drives. SSD drives started out small and
    pricey but have gotten larger and cheaper, making them a realistic alternative
    to physical hard drives in many environments.


    In addition to these technologies, others exist. The Small Computer System Interface
    (SCSI) is a parallel interface that was once common on servers and high-end interfaces
    but is less common today. The Serial Attached (SAS) is a variant that is similar
    to SATA. Both of these technologies are important because ATAPI is modeled after
    SCSI. The Universal Serial Bus (USB) interface is often used for connecting external
    disks.


    > Most Linux distributions treat SATA, SAS, and USB disks as if they were SCSI
    disks from a software perspective and create a device file in the /dev directory
    that begins with sdx, where x is the drive letter. However, for systems that utilize
    the new NVMe interface, Linux creates those device files as nvme.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Understanding Disk Issues


    # Partitioning a Disk


    You can think of a hard disk as a set of sectors, each of which holds a small
    amount of data—normally 112 bytes, although some disks have larger disks. The
    disk hardware does little to help organize data on the disk, aside from providing
    a mean to read and write sectors. On-disk management is left up to the OS. Disk
    partitions and filesystems are two levels of organization imposed on disks to
    help manage the data they store.


    Partitions are like the drawers in a filing cabinet. Think of a single disk as
    the filing cabinet, with up to multiple drawers. This analogy is as far as it
    goes. Unlike filing cabinet drawers, partitions can be created in whatever size
    and quantity are convenient, within the limits of the disk''s size. A typical
    disk has one and a dozen partitions, although you can create more.


    Disk partitions exist to help subdivide the disk into pieces with different purposes,
    such as partitions for different OS or different types of data within an OS. For
    instance, it''s common to create separate partitions for swap space (which is
    used when you run out of RAM), for user data, and for the OS itself.


    Hard and disk partitions are frequently represented in diagrams like Figure 6.1.
    This diagram displays the partition sizes in the disk more or less proportional
    to their true sizes on disk. Thus, in Figure 6.1 you can see that /root is larger
    than the memory swap space allocated. As in the figure, partitions are uninterrupted
    sections of a disk—that cannot be inside another partition.


    Disk partitions are often visualized as boxes within a hard disk.


    | Primary | /dev/sda |

    | --- | --- |

    | /dev/sda1 | /dev/sda2 |

    | root (/) | swap |

    | | /dev/sda5 |


    Some partitioning tools represent their partitions in a vertical stack rather
    than a horizontal chain. The principle is the same either.


    The common partitioning scheme for x86 and x86-64 computers has gone by various
    over the years, including master boot record (MBR), MS-DOS, and BIOS partitioning.
    It supports three types of partitions:


    Primary This is the simplest type of partition. A disk can have two to four primary
    partitions, one of which may be at most an extended partition.


    Extended This is a special type of primary partition that serves as a placeholder
    for logical partitions. A disk may have at most one extended partition.


    Logical These partitions are contained within an extended partition. In theory,
    a disk can have billions of logical partitions, overcoming the limit of four primary
    partitions, but in practice you''re unlikely to see more than about a dozen of
    them.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 6 ■ Managing Hardware


    MBR''s use of three partition types is awkward and limiting, and inertia has kept
    it in place for three decades. MBR partitions have a hard limit, though: they
    can''t support disks larger than 2 TiB (tebibytes), assuming 512-byte sectors,
    which are nearly universal today.


    The Globally Unique Identifier (GUID) Partition Table (GPT) is the successor to
    MBR. GPT supports disks up to 8 ZB (zebibytes), which is about 4 times larger
    than MBR''s limit. GPT also supports up to 128 partitions by default, with no
    distinction between primary, extended, and logical partitions. In these respects,
    GPT is a superior partitioning system to MBR; however, its support varies between
    OSs. Linux supports both systems quite well. Windows can boot only from MBR when
    the computer uses the Basic Input/Output System (BIOS), and it can boot from GPT
    when the computer is based on the Unified Extensible Firmware Interface (UEFI).
    Thus, if you dual-boot with Windows, you may need to select your partitioning
    system with care.


    To resolve this conflict, the Institute of Electrical and Electronics Engineers
    (IEEE) defined a new set of prefixes as IEEE-1541. In this system, new units and
    prefixes describe base-2 values. The first few of these are as:


    +   - A Kibibyte (KiB) is 2¹⁰ (1024) bytes.

    - A Mebibyte (MiB) is 2²⁰ (1,048,576) bytes.

    - A Gibibyte (GiB) is 2³⁰ (1,073,741,824) bytes.

    - A Tebibyte (TiB) is 2⁴⁰ (1,099,511,627) bytes.


    In this book, we use IEEE-1541 units when describing features that are expressed
    in this system, such as partition size limits. Most Linux disk utilities use SI
    and IEEE-1541 units correctly, but which is used depends on the kind of programs’
    authors Be alert to this difference, particularly when dealing with large numbers—note
    that a tebibyte is almost 10 percent larger than a terabyte.


    Other partitioning systems exist, but you''re unlikely to encounter most of them.
    One exception is the Apple Partition Map (APM), which Apple used on its computers
    prior to its switch to Intel CPUs.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Understanding Disk Issues


    When it comes to partitioning a disk, Linux supports three families of tools:

    **fdisk Family** The fdisk, cfdisk, and sfdisk tools are simple text-based partitioning
    utilities for MBR disks and some more exotic partition table types. These tools
    work well and provide the means to recover from some disk errors, but their text-based
    nature can be intimidating to those who are unfamiliar with disk partitioning.


    **Libparted-Based Tools** Tools use the libparted library to handle MBR, GPT,
    and several other partition table types. Some of these, such as GNU Parted, are
    text-based, others like GParted, are GUI, and so likely to be easier for new users
    to use. Figure 6.2 shows the structure shown in Figure 6.1. Many Linux installs
    include libparted-based partitioning tools that run during system installation.


    **FIGURE 6.2** GParted, or other GUI disk tools, provide a graphical representation
    of your partitions.


    ![](img/85a8584ad3f3bd69446d00a129bba855_168_0.png)


    **GPT fdisk Family** The gdisk, cgdisk, and sgdisk tools are modeled after the
    fdisk family but work with GPT disks. They provide more options for handling GPT
    than do libparted-based tools but at the cost of friendliness for new users.


    > While historically the fdisk utility focused on MBR disks and the gdisk utility
    on GPT disks, recently developers for both utilities have been experimenting with
    supporting both types of disks. Your Linux distribution may include a version
    of just one utility that supports both MBR and GPT disks.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'If you''re working with a preinstalled Linux system, you may not need to partition
    your disk; however, if you ever replace or install a new hard disk, you''ll have
    to partition it before you can use it. You may also need to partition removable
    disks, although they generally come from the factory pre-partitioned with one
    big partition.


    To partition a disk, you must know the disk''s device filename. In Linux, these
    filenames are normally /dev/sda, /dev/sdb, and so on, with each disk taking on
    a new letter. Partitions are numbered starting with 1, so you may refer to /dev/sda2,
    /dev/sdb6, and so on. When using MBR, partitions 1 through 4 are reserved for
    primary or extended partitions, whereas logical partitions take 5 and up.


    # Understanding Filesystem Issues


    Most partitions contain filesystems, which are data structures that help the computer
    organize your directories and files. In Windows, each filesystem receives its
    own drive letter. In the old days when floppy disks were commonly used, drive
    letters A: and B: were reserved for floppy drives, and that standard continues
    to stick around today. C: drive is used for the first hard partition (normally
    the boot partition); for external USB disks. In Linux, all filesystems are part
    of a single directory tree. The main filesystem is referred to as the root (/)
    filesystem. If a disk has multiple filesystems, each is mounted at a mount point
    in the root (/) filesystem—that is, the contents of the additional filesystems
    are made available at specific directories, such as at /home (which holds users''
    data files) or /boot (which holds boot files). Linux filesystems exist, each with
    its own unique features:


    > The word filesystem is sometimes applied to the directory structure as a whole,
    even if it contains multiple low-level filesystems. Which means meaning is understood
    clearly from the context.


    Ext2fs The Second Extended Filesystem (ext2fs) was used but is rarely used because
    it lacks a journal, which is a filesystem feature that features checks after outages
    or system crashes. A journal consumes disk space, though, ext2fs is still useful
    on small disks. You might want to use it for a /boot partition, for instance,
    since such partitions are rather small. Its Linux system type is ext2.


    > The Original Extended Filesystem (extfs) was used in the early 1990s but was
    quickly eclipsed by ext2fs. Extfs is no longer supported.


    Ext3fs The Third Extended Filesystem (ext3fs) is essentially ext2fs with a journal.
    Until around 2010, it was a very popular filesystem, but ext4fs has taken its
    place. It supports files of up to 2 TiB and filesystems up to 16 TiB (ext2fs imposes
    the same limits). Its Linux type code is ext3.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Understanding Disk Issues


    **Ext4fs** The Extended Filesystem (ext4fs) is a further development of the ext
    filesystem line. It adds speed improvements and the ability to handle larger files
    and disks—files may be up to 16 TiB in size, and filesystems may be up to 1 EiB
    (2⁶⁰ bytes). Linux utilities refer to it as ext4.


    **ReiserFS** This filesystem, referred to as reiserfs by Linux, is similar to
    ext3fs in features, with an 8 TiB file-size limit and 16 TiB filesystem-size limit.
    Its best feature is its capacity to make efficient use of disk space with small
    files—those with sizes measured in the low kibibyte range. ReiserFS development
    has slowed, but it remains useful.


    **JFS** IBM developed its Journaled File System (JFS) for its AIX OS, and its
    code eventually worked into Linux. JFS supports maximum file and filesystem sizes
    of 4 PiB and 32 PiB (1 Pi is 1024 TiB), JFS is not as popular as many other filesystems.
    Linux tools use jfs as its type of code.


    **XFS** Silicon Graphics developed the Extents File System (XFS); Linux type xfs)
    for its IRIX OS and later donated its code to Linux. XFS supports files up to
    8 EiB and filesystems of up to 16 EiB, making it the very for big disk arrays.
    XFS works well with large multimedia and backup files.


    **Btrfs** This filesystem (pronounced "better-eff-fs" or "better-eff-fs") is intended
    for the next-generation Linux filesystem. It supports files up to 16 EiB and filesystems
    of the same size. It also provides a host of advanced features, such as the ability
    to combine multiple disks into a single filesystem. As of this, btrfs is experimental,
    but it may provide the best overall performance once it''s finished. Its Linux
    type code is btrfs.


    If you''re planning a new Linux installation, you should consider ext4fs, Btrfs,
    or XFS as your filesystems. Currently, ext4fs provides the best overall features
    and performance, and Btrfs and XFS are worth considering for volumes that will
    hold partially small and large files, respectively. Ext4fs is a good choice for
    volumes that hold large files, though, you could use ext4fs for things that do
    not go far, particularly on a general-purpose computer.


    ![](img/85a8584ad3f3bd69446d00a129bba855_170_0.png)


    It''s possible to use several filesystems in a single installation to take advantage
    of the benefits of each filesystem for different sets of files.


    In addition to Linux''s native filesystems, the OS supports all other filesystems,
    of which are important in certain situations:


    **FAT** The File Allocation Table (FAT) filesystem was the standard with DOS and
    Windows through Windows Me. Just about all OS support it. Its compatibility also
    makes it a good choice for exchanging data between two OSs that dual-boot on a
    single computer. Unlike most filesystems, FAT has two Linux type codes: mdos and
    vfat. Using mdos causes Linux to use the filesystem as DOS, with short filenames
    with at most 8 characters plus a 3-character extension (.8 filenames); when you
    use vfat, Linux supports long filenames on FAT.'
