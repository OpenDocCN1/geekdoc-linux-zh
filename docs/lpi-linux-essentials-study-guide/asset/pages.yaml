  md: '# Chapter 8 ■ Searching, Extracting, and Archiving Data


    Parentheses parentheses (()) surround subexpressions. Parentheses are often used
    to specify how to apply operators; for example, you can put parentheses around
    a group of words that are concatenated with the vertical bar to ensure the words
    are treated as a group, any one which may match, without including surrounding
    parts of the regular expression.


    > If you use an extended regular expression with the grep command, you must include
    its -E option.


    Whether you use basic or extended regular expressions depends on which form the
    programs support. For programs such as grep support both, you can use either;
    which you choose is mostly a matter of personal preference. A regular expression
    that includes characters associated with extended regular expressions will be
    interpreted depending on which type you are using. It''s important to know which
    type of regular expression a program supports or how to select which type to use
    if the program supports both.


    Regular expression can be confusing, particularly when you are first introduced
    to them. Some examples of their use, in the context of the programs that use them,
    will help. The next section provides examples, with reference to the grep program.


    # Searching For and Extracting Data


    The grep command uses regular expressions and is helpful in locating data. The
    utility locates files by scanning its contents. The grep program also returns
    some of the data included in files, which can be useful if you want to extract
    a little data from a file or from a program''s output.


    As its name suggests, find uses surface features, such as the filename and the
    file date stamps. Another command, wc, provides basic word statistics on text
    files. To extract individual data items from a file''s lines, the cut command
    is useful. Two additional commands, sort and count, allow the display of resulting
    data to be manipulated, which can be helpful in your search.


    > Unlike grep, find does not use regular expressions, by default. However, it
    supports pattern matching by using a similar mechanism.


    # Using grep


    The grep command searches for files that contain a specified string and returns
    the name of the file and (if it''s a text file) the line containing that string.
    You can also use grep to search a specified file for a specified string. To use
    grep, you type the command''s name, an'
