    write a document, or maintain a spreadsheet, Linux you can use an application
    from an office suite, such as Calligraphy, Apache OpenOffice (previously called
    OpenOffice.org), and LibreOffice. For creating graphics, the choices include GIMP
    or Blender, and there is a suite of programs that work at the command line, ImageMagick.


    Describe Linux programming languages. Because Linux is a wonderful platform, it
    supports several programming languages. Assembly is a low-level language, and
