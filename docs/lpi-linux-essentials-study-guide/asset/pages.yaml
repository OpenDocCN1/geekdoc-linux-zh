  md: '# Working with Productivity Software


    The area of productivity software is extremely broad. Hundreds, if not thousands,
    of productivity applications exist, and entire books have been written about many
    of them. Therefore, in this chapter we give the names and brief descriptions of
    only a few productivity tools for common categories. The common tools include
    web browsers, email clients, office tools, multimedia applications, cloud computing,
    and mobile applications. Before describing these tools, it''s best to review a
    few tips on how to find a program to perform a particular task in Linux.


    # Finding the Right Tool for the Job


    Linux provides productivity applications in many broad categories, but if you''re
    not already familiar with the field, you might have a hard time tracking them
    down. This is particularly true because applications don''t clearly identify their
    purpose.

    A few techniques can help you to find suitable applications:


    **Using Desktop Menus** You can use the menus or other application displays on
    your desktop environment to categorize productivity applications in helpful ways.
    For example, the KDE Kickoff Launcher (shown previously in Figure 4.4) breaks
    applications into categories (Accessories, Graphics, Internet, and so on) and
    subcategories (Photography and Scanning in the Graphics category, for instance).
    Case can help you track down an application, but only if it''s already installed.


    **Using Search Features** You may be able to use a search feature, either in a
    desktop environment or in a web browser, to locate a suitable application. Typing
    in a critical word or phrase, as in conjunction with **Linux** if you are doing
    a web search may help you locate office applications (word processors, spreadsheets,
    and so on).


    **Using Tables of Equivalents** If you normally use a particular Windows application,
    you may be able to find a Linux substitute for it by consulting a table of equivalent
    applications, as the one at linuxquestions.org/wiki/Linux_software_equivalent_to_windows_software.


    **Using Others'' Expertise** You can ask other people—coworkers, friends, or people
    in online forums—for help finding a suitable application. This technique is particularly
    helpful if you''ve performed a basic search but have found nothing that meets
    your criteria.


    Some of these techniques, such as using desktop menus, can find only software
    that''s already installed. Other techniques, such as web searches, can find programs
    that you don''t have installed. You can usually install software with the help
    of your distribution''s packaging system.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Using a Web Browser


    Linux supports a variety of web browsers, including the following:


    **Chrome** Google''s Chrome browser (google.com/chrome) aims to be fast and easy
    to use. Since its introduction in 2008, it''s gained rapidly in popularity. Although
    Chrome is technically a commercial project, it''s available for free. An open
    source variant, known as Chromium, is also available.


    **Firefox** This program can be found at mozilla.org. It is the most popular browser
    for Linux, and it is also quite popular on Windows and macOS. It''s a complete
    browser, and thus can consume a lot of memory, so it may not be the best choice
    on an older or weaker computer.


    **Web** This program, called Epiphany, is found at wiki.gnome.org/Apps/Web as
    the web browser for the GNOME desktop, it''s designed to be simple and easy to
    use.


    **Konqueror** Konqueror serves a dual function: it''s both a web browser and a
    file manager. Konqueror does a good job with most web sites. It''s lightweight,
    and so it is worth trying, particularly if you use KDE Plasma. You can read more
    about it at kde.org/applications/internet/org.kde.konqueror.


    **Lynx** Most web browsers are GUI programs that display text in multiple fonts,
    graphics inline, and so on. Lynx (lynx.browser) is unusual as it is a text-based
    browser. It''s a useful choice if you run Linux in text mode or if you don''t
    want to be bothered with graphics. Lynx is also a useful browser when you develop
    your own web pages; or if a page is readable in Linux, chances are that visually
    impaired people who browse the web with speech synthesizers will be able to use
    your page.


    **Opera** An unusual commercial entrant in the Linux web browser sweepstakes,
    Opera (opera.com) claims to be unusually fast. Although Opera is commercial, you
    can download it at no charge.


    Notably absent from this list is a Microsoft browser. Unfortunately, some websites
    won''t work with anything but a Microsoft browser. Other sites are somewhat picky
    but can work with at least one Linux browser. You should probably install at least
    two browsers.


    Web browsers give users access to a world of information—literally! Unfortunately,
    the web has a dark side, too. Problems include the following:


    +   - Websites use user data access, which can be used in marketing or in other
    ways you might not like.


    +   - Web-based content is dynamic, meaning that websites download small programs
    that your web browser runs. This content might be harmless, but it''s increasingly
    used to deliver malware.


    +   - Malicious websites can trick users into giving up sensitive data, as financial
    information, by pretending to be a trusted site. This technique is known as phishing.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Some websites are not secure. Data transferred can be read on intervening computers.

    Most sites, especially Internet banking sites and online retailers, encrypt their
    sensitive data, but you should be cautious when sending such data.


    Because of security concerns, passwords used on most websites are subject to theft.

    This can pose a dilemma because it can be hard to remember all of your website
    passwords. Many browsers can do this for you, but stores your passwords on your
    hard disk, which makes them vulnerable to theft or loss.


    # Chapter 13, "Creating Users and Groups," describes how to create passwords that
    are both memorable and hard to guess.


    Some of these problems are not unique to the web, of course. For instance, most
    email transfers are insecure, so you shouldn''t send sensitive data via email.


    # Using Email Clients


    Email clients enable you to read and write email messages. Such programs can either
    access a mailbox on your own computer, or email network protocols later, and receive
    email with the help of network mail servers. Common Linux clients enable the following:


    Evolution This program, located at wiki.gnome.org/Apps/Evolution, is a powerful
    GUI client. It also includes address book and scheduling features.


    KMail The KDE project''s KMail can be found at userbase.kde.org/KMail. It is well
    integrated into the KDE desktop environment, but you can use it in any other desktop
    if you elect to do so.


    Mutt This is one of several text-based email readers. Despite its text-interface,
    Mutt is quite capable. You can read more about it at mutt.org.


    Thunderbird This application, located at thunderbird.net, is an email client''s
    closely associated with the Firefox web browser.


    Email clients work in a similar way in any OS. Typically, you must configure them
    to know how to send and receive messages—whether to use the local client''s facilities
    or remote servers. Thereafter, you can read incoming messages and send outgoing
    messages.


    # Using Office Tools


    Linux has several office packages available with some combination of word processors,
    spreadsheets, presentation programs, graphics programs, databases, and sometimes
    other programs. Examples include the following:


    Calligraphy This suite was born out of a split from an earlier popular KDE office
    suite, called KOffice. Although KOffice is no longer maintained, Calligraphy (calligraphy.org)
    is thriving. Its office suite includes Words (word processor), Stage (presentation),
    Sheets'
