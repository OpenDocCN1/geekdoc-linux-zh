  md: '# FIGURE 13.3 Set the user account''s password using the Change Password dialog.


    ![](img/85a8584ad3f3bd69446d00a129bba855_319_0.png)


    # Creating Accounts from the Shell


    With any distribution, use the useradd utility to create an account from the command
    line. To use this, you type your name and the username that you want to associate
    with a new account. You may also include options between useradd and the username,
    as summarized in Table 13.1. The useradd command supports options in addition
    to those shown in Table 13.1; consult its man page for details.


    # TABLE 13.1 Options for useradd


    | Option name | Option abbreviation | Effect |

    | :--- | :--- | :--- |

    | --comment comment | -c | Specifies the comment field for the user. (GUI tools
    generally describe this as the "full name.") |

    | --home home-dir | -d | Specifies the account''s home directory. It defaults
    to /home/username. |

    | --expire expire-date | -e | Sets the date on which the account will be disabled,
    expressed in the form YYYY-MM-DD. The default is for an account that does not
    expire. |'
