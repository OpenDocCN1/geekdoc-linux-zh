  md: 'guarantees that any Linux system will have a shell program to run the script,
    but if the script uses any features specific to a particular shell, you should
    specify that shell instead—for instance, use /bin/bash or /bin/tcsh instead of
    /bin/sh.


    This describes Bash shell scripts. Simple Bash Scripts can run in other shells,
    but more complex scripts are more likely to be shell-specific.


    When you''re writing the shell script, you should modify it so that it''s executable.
    You do this with the chmod command, which is described in detail in Chapter 14,"Setting
    Ownership and Permissions." For now, know that you use the a+x option to add execute
    permissions for all users. For instance, to make a file called my-script executable,
    you issue the following command:


    ```

    $ chmod +x my-script

    ```


    You''ll be able to execute the script by typing its name, possibly preceded by
    ./ to Linux to run the script in the current directory rather than searching the
    path. If you fail to make the script executable, you can still run the script
    by running the shell program followed by the script name (as in bash-my-script),
    but it''s generally better to make the script executable. If the script is one
    you run regularly, you may want to move it to a location on your path, such as
    /usr/local/bin. When you do that, you won''t have to type the complete path or
    move to the script''s directory to execute it; you can just type my-script.


    # Using Commands


    One of the most basic features of shell scripts is the ability to run commands.
    You can use both commands that are built into the shell and external commands—that
    is, you can run other programs as commands. Most of the commands you type in a
    shell prompt are external commands; located in /bin, /usr/bin, and other directories
    on your path. You can run such programs, as well as internal commands, including
    their names in the script. You can also specify parameters to such programs in
    a script. For instance, suppose you want a script that launches two xterm windows
    and the KMail mail reader program. Listing 11.1 presents a shell script that accomplishes
    this goal.


    Listing 11.1: A simple script that launches three programs


    ```

    #!/bin/bash

    /usr/bin/xterm &\n/usr/bin/xterm &\n/usr/bin/kmail &

    ```'
