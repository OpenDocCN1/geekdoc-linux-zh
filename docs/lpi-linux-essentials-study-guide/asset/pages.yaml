  md: '# Editing Files with vi


    Command Mode The command mode accepts commands, which are usually entered as single
    letters. For instance, i and a enter insert mode, though in somewhat different
    ways as described shortly, o opens a line below the current one.


    Ex Mode To manipulate files (saving your current file and running outside programs),
    you may enter ex from command mode by typing a colon (:), directly followed by
    the name of the ex mode that you want to use. After you run the ex command, vi
    returns automatically to command mode.


    Insert Mode You enter insert mode. Most keystrokes result in text appearing on
    the screen. One important exception is the Esc key, which exits insert mode and
    returns to command mode.


    Unfortunately, terminology surrounding vi is inconsistent at best. For instance,
    command mode is sometimes referred to as normal mode, and insert mode is sometimes
    called edit mode or entry mode. Ex mode often is not described as a mode at all
    but referred to as colon commands.


