- pgno: 403
  md: "If you don't have access to a system running Linux to study for the Linux Essentials\
    \ certification exam, consider setting up your own learning space on a laptop\
    \ or desktop. Your learning space needs to be an environment where you can freely\
    \ explore Linux and its various distributions (called _distros_ for short).\n\n\
    Creating a virtualized environment for your Linux learning space is ideal. This\
    \ setting will allow you to boot multiple Linux distributions at the same time\
    \ (provided you have enough computer resources), enabling you to move quickly\
    \ between them, and to compare-and-contrast experiences. In addition, you can\
    \ explore networking utilities thoroughly in such an environment.\n\nFor a virtualized\
    \ environment, you need to create a virtual machine. A virtual machine can be\
    \ created using a software application on a laptop or desktop. We recommend Oracle\
    \ VirtualBox (virtualbox.org), which is free and provides an accurate Linux experience.\
    \ You can obtain and install VirtualBox on a Windows or macOS system. The VirtualBox\
    \ website is loaded with helpful documentation, and it has community forums to\
    \ help you create your Linux learning space. Also, there are youtube.com videos\
    \ to help with installing the VirtualBox software on your computer.\n\nFor this\
    \ book, the primary distributions used were Linux Mint 18.3 LTS with the Cinnamon\
    \ Desktop (linuxmint.com), and Fedora 30 Workstation (fedora.org). You can obtain\
    \ the ISO from these websites and find helpful documentation.\n\n> As times go,\
    \ new Linux Mint and Fedora distribution versions will be available. Although\
    \ it is always tempting to get the latest and greatest version, it is not beneficial\
    \ to use it in your learning space. Remember that the LPI Essentials certification\
    \ exam objectives are static—until the next time the certification exam is updated.\
    \ Therefore, it is wise to use the distributions available at the time of the\
    \ certification exam's creation.\n\nYou will need to download at least one of\
    \ the distributions' installation files (called an ISO file, its file extension\
    \ is .iso) from their website. We are aware that these updates update their software\
    \ every six months to a year. Thus, if you cannot find the ISO file on the distribution's\
    \ download page, try these locations:\n\n+   - Fedora 30 Workstation: `linux.fedaproject.org/pub/fedora/linux/releases/30/Workstation/\
    \ \n- Linux Mint 18.3 LTS: `linuxmint.com/download_all.php`\n\nWhen you have the\
    \ ISO, install it to VirtualBox. If you need some assistance in accomplishing\
    \ this last task, then on a computer system with access to the Internet open your\
    \ favorite web browser, and in the search engine, type\n\n**How to install Linux\
    \ using VirtualBox.** You should find several websites with helpful information\
    \ to get your study environment built.\n\n![](img/85a8584ad3f3bd69446d00a129bba855_403_0.png)"
  merge: -1
  img_proc: true
