- pgno: 376
  md: '# Examining Sockets


    The netstat tool provides a wealth of network information, but it can often be
    hard to determine which program is listening on open port. The ss command can
    help you to rescue that for that.


    A program connection to a port is called a socket. The ss command can link which
    processes are using which network sockets that are active:


    ```

    $ ss -anpt

    State    Recv-Q  Send-Q  Local Address:Port      Peer Address:Port

    LISTEN   0       100             127.0.0.1:25           *:*

    LISTEN   0               :111                   *:*

    LISTEN   0       5       192.168.122.153        *:*

    LISTEN   0               :22                    *:*

    LISTEN   0       128             127.0.0.1:631           *:*

    LISTEN   0               :25                    *:*

    LISTEN   0       128             :111                   *:*

    LISTEN   0               :22                    *:*

    LISTEN   0       128             :631                   *:*

    ESTAB    0               :122                   ::1:40490

    ESTAB    0       0               :1:40490               ::1:22

    ```


    users:(("ssh",pid=15176,fd=3))


    The -antpt option displays both listening and established TCP connections, as
    well the process they are associated with. This output shows that the ssh port
    (port 22) has an established connection and is controlled by process ID 15176,
    the ssh program.


    # Summary


    Connecting Linux systems to networks can be painful if you have the correct tools.
    To connect the Linux system you''ll need an IP address, a default router, a host
    name, and a DNS server. If you don''t know what IP address is assigned to your
    system, you can obtain those values automatically using DHCP.


    Network Manager is the most popular graphical tool for Linux distributions for
    configuring network settings. It allows you to configure wired and wireless network
    settings from a graphical window. If you must configure your network settings
    from the command line, there are a few tools you''ll need to use. For wireless
    connections, use ifconfig to set the wireless access point and SSID key. For both
    wired and wireless connections, use ifconfig or ip command to set the IP address
    and netmask values for the interface. You may use the route command to define
    the default router'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'for the local network. When your network configuration is complete, you may
    have to do some additional troubleshooting for network problems. The ping and
    ping6 commands allow you to send ICMP packets to remote hosts to test basic connectivity.
    If you suspect issues with host names, use the host and dig commands to query
    the DNS server for host names. For more advanced network troubleshooting, you
    can use the netstat and ss commands to display what applications are using which
    network ports on the system.


    # Exam Essentials


    **Describe the command-line utilities required to configure and manipulate Ethernet
    network interfaces.** To set the IP and mask addresses on an Ethernet interface,
    you use ifconfig or ip command. To set the default router (gateway) for a network,
    you use the router command. Some Linux distributions that have Network Manager
    installed can use the nmtui or nmcli commands, which can configure all three values.


    **Explain how to configure basic access to a wireless network.** Linux uses the
    iw command to list all wireless access points detected by the network card. You
    can configure the settings to connect to a specific wireless network by using
    the ifconfig command. At a minimum, you need to configure the access point SSID
    value and must specify the encryption key value to connect to the access point.


    **Describe how to manipulate the routing table on a Linux system.** The route
    command is used to display the existing route table used by the Linux system.
    You can add a new route by using the add option or remove an existing route by
    using the del option. Specify the default router (gateway) by the network by using
    the default keyword to the command.


    **Summarize the tools you need to analyze the status of network devices.** The
    ifconfig and ip commands display the current status of all network interfaces
    on the system. You can use the netstat or ss command to display statistics for
    all listening network ports.


    **Explain how to test network connectivity.** The ping and ping6 commands allow
    you to send ICMP messages to remote hosts and display the response received.


    **Describe how Network Manager is used to configure network settings in Linux.**
    Network Manager provides a graphical interface for changing settings on the network
    interfaces. Network Manager appears as an icon in the desktop panel area. If your
    Linux system uses a wireless network card, the icon appears as a radio signal,
    whereas wired network connections appears as a mini-network. When you click the
    icon, it shows the current network status and, and for wireless interfaces, a
    list of the access points detected. When you open the Network Manager interface,
    it allows you to set static IP address information or configure the network to
    use a DHCP server to dynamically set the network configuration.'
