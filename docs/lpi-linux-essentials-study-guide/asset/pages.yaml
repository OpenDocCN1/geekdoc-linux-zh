- pgno: 55
  md: '# Chapter 1 ■ Selecting an Operating System


    These features require explanation:


    **Availability** Most Linux distributions are entirely open source or free software;
    however, some include proprietary components and are sold for money, typically
    with a support contract. Red Hat Enterprise Linux (RHEL) and SUSE Enterprise are
    the two most prominent examples of this type. Both are completely free coos. For
    RHEL, CentOS is a near-clone that omits Slackware, and Fedora is an open version
    that serves as a testbed for technologies that may eventually be included in RHEL.
    For SUSE Enterprise, openSUSE is a free alternative.


    **Package Format** Most Linux distributions distribute software in *packages*,
    which are collections of many files in one. Package software manages a local database
    of installed files, making upgrades and uninstalls easy. The RPM Package Manager
    (RPM) system is the most popular one in the Linux world, though Debian packages
    are very common. Other packaging systems work fine but are distribution-specific,
    such as the package management system in Arch. Slackware is unusual in it uses
    *tarballs* for its packages. Package files are created by the standard tar utility,
    which is used for backing up copies and distributing source code, among other
    things. The tarballs that Slackware uses for its packages help with management
    is unusual because its package system is based on compiling most software from
    source code. This is time-consuming but enables experienced administrators to
    tweak configuration options to optimize the packages for their own hardware and
    environments.


    > Tarballs are similar to the zip files common on Windows. Chapter 8, "Searching,
    Extracting, and Archiving Data," describes how to create and use tarballs.


    **Release Cycle** We describe release cycles in more detail, in "Understanding
    Release Cycles." As a general rule, distributions with short release cycles provide
    an aid to provide the most stable environments possible. Some those with long
    release cycles strive to provide the most stable long-term support (LTS) versions
    in April of even-numbered years. Their other releases provide the latest software.


    **Administrator Skill Requirements** The final column in Table 1.1 provides our
    personal estimation of the skill level required to administer a distribution.
    As you can see, we''ve described most Linux distributions as requiring "intermediate"
    skill to administer. Some, however, provide less in the way of user-friendly GUI
    administrative tools and require more skill. Ubuntu is particularly easy to use
    and administer.


    > Don''t be scared off by the "intermediate" classification of most distributions.
    This book''s purpose is to help you manage the essential features of such distributions.'
