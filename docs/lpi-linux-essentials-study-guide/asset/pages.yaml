- pgno: 86
  md: '# Seeing Today’s Linux World


    By the mid-1990s, the most important features of Linux as it exists today had
    been established. Changes since then have included the following:


    **Improvements in the Kernel** The Linux kernel has seen massive changes since
    1991, when it lacked many of the features we rely on today. Improvements include
    the addition of networking features, insurmountable hardware drivers, support
    for power management features, and support for many non-x86 CPUs.


    **Improvements in Support Tools** Just as work has progressed on the Linux kernel,
    improvements have also been made to the support programs on which it relies—the
    compilers, GUIs, shells, and so on.


    **Creation of New Support Tools** New support tools have emerged over the years.
    These range from simple small utilities to big desktop environments. In fact,
    some of the tools, much as modern desktop environments, are far more obvious to
    the user than the kernel itself.


    **Creation of New Distributions** As noted earlier, Slack dates to 1993 and Red
    Hat (the predecessor to Red Hat Linux, CentOS, and Fedora) originated in 1995.
    Other distributions have emerged in the intervening years, and have some quite
    unique features. The Android OS used on smartphones and tablets, for instance,
    has become very influential over the past decade.


    Linux’s roots remain much within the open source software of the 1980s and 1990s.
    Although a typical desktop or embedded OS user is likely to perceive the OS through
    the lens of the GUI, much of what happens under the surface happens because of
    the Linux kernel and open source tools, many of which have existed for decades.


    # Using Open Source Software


    The philosophies that underlie much software development for Linux are different
    from those that drive software development for Windows. These differing philosophies
    affect how you obtain the software, what you can do with it, and how it changes
    over time. This section describes these principles, and how Linux functions as
    a sort of “mag-net”, integrating software from many sources into one place.


    # Understanding Basic Open Source Principles


    Broadly speaking, software can be described as coming in several different forms,
    each with different expectations about payment, redistribution, and users’ rights.
    The number of categories varies depending on the depth of analysis and the prejudices
    of the person doing the categorization. As a starting point, however, four categories
    will do:


    **Commercial Software** Individuals or companies develop commercial software with
    the intent to sell it for a profit. Developers generally keep the source code
    for commercial'
  merge: -1
  img_proc: true
