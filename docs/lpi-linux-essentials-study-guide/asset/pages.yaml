- pgno: 226
  md: '# Using Compression


    In Linux, the gzip, bzip2, and xz all compress individual files. For instance,
    you might compress a large graphics file like this:


    ```

    $ xz biggraphics.tiff

    ```


    The result is a file with a name like the original but with a new filename extension
    to identify it as a compressed format. In this specific case, the result would
    be biggraphics.tiff.xz.


    Most programs won not read files compressed in this way. To, use a file that''s
    been compressed, you must uncompress it with a matching program. To uncompress
    the biggraphics.tiff.xz file compressed in the previous example, use this command:


    ```

    $ unxz biggraphics.tiff.xz

    ```


    Table 8.9 summarizes the compression programs, their matching decompression programs,
    and the extensions that create them.


    | Compression program | Uncompression program | Filename extension |

    | --- | --- | --- |

    | gzip | gunzip | .gz |

    | bzip2 | bunzip2 | .bz2 |

    | xz | unxz | .xz |


    ![](img/85a8584ad3f3bd69446d00a129bba855_226_0.png)


    > As a general rule, gzip provides the least compression and xz the most compression.
    This is why the Linux kernel is now compressed with xz.


    The tar program provides explicit support for all three of these compression standards,
    and tarballs often have their own unique extensions that indicate the compression
    used:


    Sometimes two extensions are used on a tarball file, resulting in a filename such
    as my-work.tar.bz2.


    ![](img/85a8584ad3f3bd69446d00a129bba855_226_1.png)


    +   * .tgz for tarballs compressed with gzip

    * .tbz or .bz2 or .tb2 for tarballs compressed with bzip2

    * .txz for tarballs compressed with xz'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'When you use compression to create a tarball (using the z, j, or O to tar),
    the compression program works on the entire tarball with all of its files rather
    than individually compressing each file within the tarball. This can improve the
    compression ratio compared to compressing individual files and then bundling them
    together. However, it makes it harder to extract data from if it becomes damaged.


    Typically, plain-text files compress extremely well, binary program files compress
    moderately well, and precompressed data (such as most video files) compress poorly
    or may expand in size when compressed.


    The gzip, bzip2, and x compression programs allow lossless compression, meaning
    that the data recovered by uncompressing the file is identical to what it went
    into. Some graphics, audio, and audiovisual files allowy compression, in which
    some data is discarded. Loss compression tools should never be used on program
    files, system configuration files, or most user data files; any loss in such files
    could be disastrous. That''s why tar supports only lossless compression.


    # Using zip


    Outside of Unix and Linux world, the zip file format is a common one that fills
    a role similar to a compressed tarball. Linux provides the zip command to create
    zip files and the zip utility to extract files from a zip archive. Zip files typically
    have filename extensions of .zip.


    In most cases, you can create a zip archive by passing the utility the name of
    a target zip file followed by a filename list:


    ```

    $ zip newzip.zip file afile.txt figure.tif

    ```


    This command creates the newzip.zip file, which holds the afile.txt and figure.tif
    files (The original remain on your disk). In some cases, you will need to use
    zip options to achieve the desired results. Table 8.10 summarizes the most important
    zip options; however, the program supports many more. Consult its man page for
    details.


    # TABLE 8.10 Common zip options


    | Option (long form) | Option (short form) | Description |

    | --- | --- | --- |

    | N/A | -0 through -9 | Sets the amount of compression; -0 applies no compression,
    -1 applies minimal (but fast) compression, and so on through -9, which applies
    maximum (but slow) compression. |'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Archiving Data 189


    | Option (long form) | Option (short form) | Description |

    | --- | --- | --- |

    | --delete | -d | Deletes the specified files from the archive |

    | --encrypt | -e | Encrypts the archive with a password (zip prompts for this
    password.) |

    | --freshen | -f | Updates files in an archive if they''ve changed since the original
    archive''s creation |

    | --fix or --fix | -F or -FF | Performs repairs on a damaged file. The --fix/-F
    option performs minimal repairs, whereas --fixfix/-FF is more thorough. |

    | --filesync | -FS | Updates files in an archive if they''ve changed since the
    original archive''s creation, and deletes files from the archive if they''ve been
    deleted on the filesystem |

    | --grow | -g | Appends files to an existing archive |

    | --help | -h or ? | Displays basic help information |

    | --move | -m | Moves files into the zip archive—that is, the original files are
    deleted |

    | --recurse-paths | -r | Includes files and subdirectories inside the directories
    that you specify |

    | --split-size size | -s size | Creates a potentially multifile archive, with
    each file no larger than size bytes (A k, m, g, or t can be appended to specify
    larger units.) |

    | --exclude files | -x files | Excludes the specified files |

    | --symlinks | -y | Includes symbolic links (Ordinarily, zip includes the linked-to-files)
    |


    Of the options in Table 8.10, the -r option is possibly the most important, at
    least if you want to compress an entire directory tree. If you fail to use this
    option, your archive will contain no subdirectories. Given the speed of modern
    CPUs, using -9 on a regular basis also makes sense to achieve maximum compression.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'To uncompress and extract files in a zip archive file, you can use the unzip
    program:


    ```

    $ unzip anarchive.zip

    ```


    This example uncompresses the files in the anarchive.zip into the current directory.
    Like zip, unzip supports a large number of options, the most important of which
    appear in Table 8.11.


    # TABLE 8.11 Common unzip options


    | Option | Description |

    | --- | --- |

    | -f | Freshens files from the archive—that is, extracts only those files that
    exist on the main filesystem and that are newer in the archive than on the main
    filesystem |

    | -l | Lists files in the archive but does not extract them |

    | -p | Extracts files to a pipeline |

    | -t | Tests the integrity of files in the archive |

    | -u | Updates files; similar to -f but also extracts files that don''t exist
    on the filesystem |

    | -v | Lists files in the archive in a more verbose format than -l |

    | -L | Converts filenames to lowercase if they originated on an uppercase-only
    OS, such as DOS |

    | -n | Never overwriting existing files |

    | -o | Overwrites existing files without prompting |


    ![](img/85a8584ad3f3bd69446d00a129bba855_229_0.png)


    Zip files typically contain "loose" files in the main directory, so you should
    generally zip archives in an empty subdirectory that you create for this purpose.


    As a general rule, using unzip without any options except for the input filename
    works well. However, you might want to use one or more of its options on occasion.
    The -l option is particularly useful for examining the archive''s contents without
    extracting it.'
  merge: -1
  img_proc: true
