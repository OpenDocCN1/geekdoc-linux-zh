  md: '# Summary


    Plain-text files, which encode text using ASCII or Unicode, are important on most
    computer platforms, but they''re particularly important on Linux. This is because
    many of Linux''s configuration files use plain-text formats, so understanding
    how to use an editor such as nano or vi to edit these files enables you to edit
    a wide variety of configuration files. In addition, to be able to create scripts
    on Linux, you must be able to handle at least one text editor. Basic text-editing
    skills are required, the more you know about moving around, searching, and modifying
    a text file, the quicker you can complete needed tasks.


    # Exam Essentials


    Describe editing files with nano. Launch the nano editor along with the name of
    the current file you wish to edit or the new file you want to create. You can
    reach the line you want to change by using arrow or control keys, some of which
    are displayed in the shortcut list. For editing, using keyboard keys or control/meta
    keys are also available. For example, Ctrl+K allows you to go to a line of text,
    whereas Ctrl+U pastes your cut.


    Explain how to save modified files with nano. You can save any changes to the
    text file within the nano editor by pressing the Ctrl+O combination. The editor
    will prompt for the filename, and if it is the name, you can simply press Enter.
    You can also initiate this process by pressing Ctrl+X.


    Describe editing files with v1. Start the vi editor along with the name of the
    current file you want to edit or the new file you want to create. The initial
    editor is command mode. It is easiest for new vi to start editing entering insert
    mode by pressing I on the keyboard. After you have completed your edits, leave
    insert mode by pressing the Esc key.


    Detail the various methods to save with vi. To save your edits using the vi editor,
    you can use exit mode, but first must be in insert mode (press the Esc key to
    leave insert mode if needed). Type :w to write out the buffer to the file on the
    disk. You can save the changes and quit the vi at the same time by typing :wq.
    If you need to quit without saving changes, type :q!. You can also use command
    mode to save your modifications by typing ZZ.


    Summarize needed user privileges for editing. To successfully edit system files,
    which include some configuration files, you must obtain super user privileges
    to edit them. This also includes other files that only allow users with such privileges
    to write to the file. When using nano, you will see at the bottom of the editor
    screen the message warning: no write permission if you have loaded a file that
