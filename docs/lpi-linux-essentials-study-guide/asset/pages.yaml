    **Costs** Many Linux variants are available free of charge and are appealing if
    you''re trying to cut costs. However, the expertise needed to install and maintain
    a Linux installation is likely to be greater, and therefore more expensive, than
    the expertise needed to install and maintain a Windows installation. Different
    studies on the issue of total cost of ownership of Linux Windows gone both ways,
    but most to favor Linux.


    **Hardware Compatibility** Most hardware require OS support, usually in the form
    of drivers. Most hardware manufacturers provide drivers for their devices or work
    with Microsoft to ensure that Windows includes drivers. Although some manufacturers
    provide Linux drivers, too, for the most of the Linux community a whole supply
    must provide the drivers. That means Linux drivers may take a few weeks or months
    to appear after a device becomes available. At the same time, Linux developers
    tend to maintain drivers for old hardware for more than manufacturers continue
    to support their own old hardware. Thus, a modern Linux may run better than a
    recent version of Windows on old hardware. Linux also tends to be less resource
    intensive, so you can be more productive on older hardware when using Linux.


    **Software Availability** Some desktop applications, such as Microsoft Office,
    are available on Windows but not on Linux. Although Linux alternatives such as
    LibreOffice are available, they haven''t caught in the public''s mind. In some
    realms, the situation is reversed. Popular server programs, such as the Apache
    web server, were developed for Linux or Unix. Although many such are available
    for Windows, they run more'
