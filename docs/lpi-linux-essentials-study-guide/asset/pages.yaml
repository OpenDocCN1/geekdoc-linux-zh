    If you want to create a link to a directory, be aware that you do only use symbolic
    links. Hard links between directories are potentially dangerous in terms of low
    level filesystem structures, where the ln utility permits only the superuser to
    create such. Even then, filesystems allow hard links between directories, so in
    practice you cannot roost create them. Any user can create symbolic links to a
    directory, though. Linux administrators make use of links (mostly symbolic links)
    in various places. For instance, system startup scripts are often referred to
    via symbolic links located in directories to specific startup conditions, known
    as runlevels. Runlevel management is beyond the scope of this book.


    # Deleting Files


    The rm command deletes two files in a text-shell. As you might expect, you pass
    the names of one or more files to this command:


    > The rm command''s name is short for remove.


    ```

    $ rm outline.pdf outline.txt

    ```


    This example deletes two files, outline.pdf and outline.txt. If you want to delete
    an entire directory, you can pass rm -r, -R, or --recursive option along with
    a directory name:


    ```

    $ rm -r rstuff/

    ```


    The -i option causes rm to prompt before deleting each file. This is a useful
    safety measure. You can use the -f (-force) option to override this setting, if
    -i is configured as the default. Several other options to rm exist; consult its
    man page to learn about them.


    > Distributions sometimes set the -i option by default for root, but not for ordinary
    users.


    It''s important to realize that rm does not implement any functionality like a
    file manager "trash can." After you delete a file with rm, it''s gone, and you
    can''t recover it except by using low-level filesystem tools—a topic that''s well
    beyond the scope of this book. Thus, you should be careful when using rm—and even
    more careful when using it with its -r option or as root!'
