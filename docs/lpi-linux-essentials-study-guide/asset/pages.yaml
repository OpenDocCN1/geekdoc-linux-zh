- pgno: 20
  md: "# Introduction\n\nThis book you hold in your hands provides a solid introduction\
    \ to the Linux operating system. As its title suggests, it will give you the essential\
    \ knowledge to begin using and managing this powerful operating system (OS), which\
    \ is an important one in today's computing world.\nThe Linux Professional Institute,\
    \ or LPI (lpi.org), offers a series of Linux certifications. These certifications\
    \ aim to provide proof of skill levels for employers; if you have passed a particular\
    \ certification, you should be competent to perform tasks on Linux computers.\
    \ The LPI exams include Linux Essentials, LPIC-1, LPIC-2, and the LPIC-3 series.\
    \ As the names imply, the Linux Essentials is the lowest level of the four exams,\
    \ covering the most basic tasks of using and administering a Linux computer.\n\
    The purpose of this book is to help you pass the Linux Essentials exam, updated\
    \ in 2019 version 1.6. The Linux Essentials exam is meant to certify that you:\n\
    \n+   * Understand the open source industry\n* Have knowledge of the most popular\
    \ open source applications\n* Understand the major components of Linux\n* Can\
    \ work at the Linux command line\n* Have basic knowledge of security and administration-related\
    \ concepts\n* Know where to go for help\n\n# Why Become Linux Certified?\n\nWith\
    \ the growing popularity of Linux (and the increase in Linux-related jobs) comes\
    \ hype. With all the hype that surrounds Linux it's become hard for employers\
    \ to distinguish between employees who are competent Linux users and those who\
    \ know the buzzwords. This is where the Linux certification comes in.\n a Linux\
    \ Essentials certification, you will establish yourself as a Linux user who is\
    \ familiar with the Linux platform and its applications and can use any type of\
    \ Linux system. LPI has created the Linux Essentials as a way for employers to\
    \ have confidence in knowing their employees who pass the exam will have the skills\
    \ necessary to get the job done.\n\n# How to Become Certified\n\nThe certification\
    \ is available to anyone who passes the LPI Linux Essentials required exam. The\
    \ current version of the exam is version 1.6 and is denoted as 010-160.\nThe exam\
    \ is administered by Pearson VUE. The exam can be taken at any Pearson VUE testing\
    \ center. If you pass, you will get a certificate in the mail stating that you\
    \ have passed."
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Introduction\n\nTo register for the exam with Pearson VUE register online\
    \ at home .pearsonvue .com. You'll have to provide your name\n\n# Who Should Buy\
    \ This Book\n\nYou may have assigned this book for a class that you're taking,\
    \ but if not, it can still have value for self-study or as a supplement to other\
    \ resources. If you're new to Linux, this book covers the material that you will\
    \ need to learn the OS from the beginning. You can pick up this book and learn\
    \ from it if you've never used Linux before. If you're already familiar with Linux,\
    \ you'll have a leg on many of the topics described in these pages.\n\t\t\tThis\
    \ book is written with the assumption that you know a little about computers generally,\
    \ such as how to use a keyboard, how to insert a disk into an optical drive, and\
    \ so on. Chances even you've used computers in a substantial way this—perhaps\
    \ even as an ordinary user—or may have used Windows or macOS. We do not assume\
    \ you have knowledge of how to use a Linux system.\n\t\t\tIt will also help to\
    \ have a Linux system available to follow along with. Each chapter contains a\
    \ simple exercise that will walk you through the basic concepts presented in the\
    \ chapter. This provides the crucial hands-on experience that you'll need, both\
    \ to pass the exam and to do well in the Linux world.\n\nAlthough the LPI Linux\
    \ Essentials exam is Linux distribution neutral, it's impossible to write exercises\
    \ that work in all Linux distributions. That said, the exercises in this book\
    \ assume you have a learning environment similar to the one described in Appendix\
    \ B “Setting up a Linux Environment.\"\n\n# How This Book Is Organized\n\nThis\
    \ book consists of 15 chapters, plus this introduction and the assessment test\
    \ after the introduction. The chapters are organized as follows:\n\n+   * Chapter\
    \ 1, “Selecting an Operating System,” provides a birds-eye-view of the world of\
    \ operating systems. The chapter will help you understand exactly what Linux is\
    \ and the situations in which you might want to use it."
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Introduction


    +   Chapter 2, “Understanding Software Licensing,” describes copyright law and
    the licenses that both Linux and non-Linux OSs use to expand or restrict users’
    rights to use copy software.


    +   Chapter 3, “Investigating Linux’s Principles and Philosophy,” covers Linux’s
    history and the ways in which Linux, and other OSs, are commonly used.


    +   Chapter 4, “Using Linux Programs,” looks at the major categories of Linux
    software, and it provides pointers to some of the most popular Linux programs.


    +   Chapter 5, “Getting to Know the Command Line,” tackles using commands to control
    Linux. Although many new users find this topic intimidating, command-line control
    is important.


    +   Chapter 6, “Managing Hardware,” provides advice on how to select and use hardware
    in Linux. Specific topics range from the central processing unit (CPU) to device
    drivers.


    +   Chapter 7, “Managing Files,” describes how to move, rename, and edit files.
    Directories are just a special type of file, so they are covered here as.


    +   Chapter 8, “Searching, Extracting, and Archiving Data,” summarizes the tools
    that you can find data on your computer, and how you can manipulate archive files
    for data transport and backup purposes.


    +   Chapter 9, “Exploring Processes and Process Data,” describes how to install
    programs in Linux and how to adjust the priority of running programs or terminate
    selected programs.


    +   Chapter 10, “Editing Files,” introduces the topic of editing text files. This
    includes the basic features of the nano and vi text-mode editors, as well as some
    common configuration file and formatted text conventions.


    +   Chapter 11, “Creating Scripts,” describes how to create simple scripts, which
    are programs that run other programs. You can use scripts to help automate tedious
    manual tasks, improving your productivity.


    +   Chapter 12, “Understanding Basic Security,” introduces the concepts that are
    critical to understanding Linux’s multifuser nature. It also covers super user
    privileges, which Linux uses for most administrative tasks.


    +   Chapter 13, “Creating Users and Groups,” covers the software and procedures
    you use to create, modify, and delete accounts and groups, which define who may
    use the computer.


    +   Chapter 14, “Setting Ownership and Permissions,” describes how to control
    which users may access files and in what ways they may do so. In conjunction with
    users and groups, ownership and permissions control your computer’s security.


    +   Chapter 15, “Managing Network Connections,” covers the critical topic of telling
    Linux how to use a network, including testing the connection and some basic network
    measures.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Introduction


    Each chapter begins with a list of the exam objectives that are covered in chapter.
    The book doesn''t cover the objectives in order. Thus, you shouldn''t be alarmed
    at some of the odd ordering of the objectives within the book. At the end of each
    chapter, you''ll find a couple of elements you can use to prepare for the exam:


    Exam Essentials This section summarizes information that was covered in the chapter.
    You should be able to perform each of the tasks or convey the information requested.


    Review Questions Each chapter concludes with 10 review questions. You should answer
    these questions and check your answers against the ones provided in Appendix A.
    If you can''t answer at least 80 percent of these questions correctly, go back
    and review the chapter, or at least those sections that are giving you difficulty.


    ![](img/85a8584ad3f3bd69446d00a129bba855_23_0.png)


    The review questions, assessment test, and other testing elements included in
    this book are not derived from the actual exam questions, so don''t memorize the
    answers to these questions and assume that doing so will enable you to pass the
    exam. You should learn the underlying topic, as described in the text of the book.
    This will let you answer the questions provided with this book and pass the exam.
    Learning the underlying topic is also the approach that will serve you in the
    workplace—the ultimate goal of a certification.


    To get the most out of this book, you should read each chapter from start to finish
    and check your mastery and understanding with the chapter-end elements. Even if
    you''re already familiar with a topic, you should skip the chapter; Linux is complex
    enough that there are often multiple ways to accomplish a task, so you may learn
    something even if you''re competent in an area.


    # Additional Study Tools


    Readers of this book can access a website that contains several additional study
    tools, including the following:


    ![](img/85a8584ad3f3bd69446d00a129bba855_23_1.png)


    Readers can access these tools by visiting wiley.com/sybtestprep.


    Sample Tests All the questions in this book are there, including the assessment
    test at the end of this introduction and the questions from the review sections
    at the end of each chapter. In addition, there are two bonus exams.


    Electronic Flashcards The additional study tools include questions in flashcard
    format (a question followed by a single correct answer). You can use these flashcards
    to review your knowledge of the exam objectives.


    Glossary of Terms as a PDF File In addition, there is a searchable glossary in
    PDF format, which can be read on all platforms that support PDF.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Conventions Used in This Book


    This book uses certain typographic styles in order to help you quickly identify
    important information and avoid confusion over the meaning of words such as onscreen
    prompts. In particular, look for the following styles:


    +   * *Italic text* identifies key terms that are described at length for the
    first time in a chapter. (Itics are also used for emphasis).

    * A *monospaced font* indicates the contents of configuration files, messages
    displayed at a text-mode Linux prompt, filenames, text-mode command names, and
    Internet URLs.

    * *Italicized monospaced text* indicates a variable—information that differs from
    one system or command to another, such as the name of a client computer or ID
    number.

    * **Bold monospaced text** is information that you''re to type into the computer,
    usually at a Linux prompt. This text can also be italicized to indicate that you
    should substitute an appropriate value for your system. (When isolated on their
    lines, commands are preceded by non-bold monospaced `$` or `#` command prompts,
    denoting regular user or system administrator use, respectively).


    In addition to these text, which can apply to individual words or entire paragraphs,
    a few conventions highlight segments of text:


    > A note indicates information that''s useful or interesting but that''s somewhat
    peripheral to the main text. A note might be relevant to a small number of networks,
    for instance, or it may refer to an outdated feature.


    > A tip provides information that can save you time or frustration that may not
    be entirely obvious. A tip might describe how to get around a limitation or how
    to use a feature to perform an unusual task.


    > Warnings describe potential pitfalls or dangers. If you fail to heed a warning,
    you may end spending a lot of time recovering from a bug, or you may even end
    restoring your entire system from scratch.


    # EXERCISE


    An exercise is a procedure you should try on your own computer to help you learn
    about the material in the chapter. Don''t limit yourself to the procedures described
    in the exercises, though! Try other commands and procedures to really learn about
    Linux.'
