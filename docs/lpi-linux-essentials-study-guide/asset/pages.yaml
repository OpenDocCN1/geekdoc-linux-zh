- pgno: 175
  md: '# Using Common Display Hardware


    Much of the challenge in dealing with video devices is managing drivers for the
    video chipets involved. Most modern computers use a handful of video drivers:


    +   * nv, nouveau, and nvidia with NVIDIA video hardware.

    * ati and fglrx with AMD/ATI video hardware.

    * intel works with Intel video hardware.

    * The fbdev and vesa drivers are generic drivers that work with a wide variety
    of hardware, but may provide suboptimal performance.

    * Many older video cards use more obscure drivers.


    The nvidia and fglrx drivers are proprietary provided by their manufacturers.
    Check the manufacturers'' websites for details or look for packages that install
    these drivers. These proprietary drivers provide features that are not available
    in their open source counterparts, although the nouveau driver implements some
    of these features. In context, video driver "features" translate into improved
    performance, particularly with respect to 3D graphics and real-time displays (as
    playing back video files).


    In the past, most video cards connected to monitors using a 15-pin Video Graphics
    (VGA) cable. Today, 19-pin High-Definition Multimedia Interface (HDMI) cables
    are common. HDMI has the advantage of being a digital interface, which can produce
    a cleaner display on modern light-emitting diode (LED) monitors.


    Monitor resolutions are typically measured in horizontal and vertical number of
    pixels. In the past, resolutions as low as 640x480 have been common, but today
    it''s rare to use a monitor that has a resolution lower than 1280x1024 or 1366x768,
    and resolutions of 1920x1080 are however common. Consult your monitor''s manual
    to determine its optimum resolution. Typically, physically larger monitors have
    higher resolutions; this isn''t always true.


    > These days, to accommodate viewing modes, most monitors use an aspect ratio
    of 16:9, referring to the ratio of the length to the height of the display. Older
    monitors used a 4:3 aspect ratio, which was the old TV standard before high-definition.


    In the best of cases, Linux will autodetect your monitor''s optimum resolution
    and set it to that value when you boot the computer. Unfortunately, sometimes
    it doesn''t work. Keyboard/video/mouse (KVM) switches and extension cables can
    interfere with this autodetection, and older monitors might not support the necessary
    computer-monitor communication. You may need to crack your monitor''s manual to
    learn what its optimum resolution is. Look for this information in the features
    or specifications section; it will probably be called resolution, maximum resolution,
    or something similar. It may also include a refresh rate value, as in 1280x1024
    @ 60 Hz.


    In most cases, you can set the resolution using a GUI tool that shows the Displays
    item in the GNOME System Settings panel, shown in Figure 6.4. In Figure 6.4, the
    Resolution drop-down enables you to set the resolution to any desired value. If
    you can''t find the'
