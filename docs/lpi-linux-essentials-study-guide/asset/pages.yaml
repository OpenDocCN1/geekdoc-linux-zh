    Some Linux installers come complete with all the software you''re likely to. Others
    come with minimal software and expect you to have a working Internet connection
    that the installer can download additional software. If your computer isn''t connected
    to the Internet, be sure to get the right type of installer.


    # A Summary of Common Linux Distributions


    Depending on how you count, there are about a dozen Linux distributions for desk-top,
    laptop, and server clusters, and hundreds more that serve particular-poses. Table
