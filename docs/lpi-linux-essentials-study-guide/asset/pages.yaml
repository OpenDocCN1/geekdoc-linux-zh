  md: '# Where Does Linux Fit in the OS? 13


    efficiently on Linux. If you have a specific program you must run, you may want
    to research its availability and practicality on any platforms you''re considering.


    **User Interfaces** Like macOS, Windows uses its own unique user interface. This
    fact contributes to poor inter-OS portability. (Tools exist to help bridge the
    gap, though; X System implementations for Windows are available, as are tools
    for running Windows programs in Linux.) Some users prefer the Windows user interface
    to any Linux desktop environment, but others prefer a Linux desktop environment.


    ![](img/85a8584ad3f3bd69446d00a129bba855_52_0.png)


    Microsoft introduced a new user interface, called Metro, in Windows 8. The idea
    behind Metro is that it works the everything from smartphones to desktop computers.
    However, the user interface quickly became unpopular because it made it difficult
    for experienced Windows users to maneuver around, so it removed as the default
