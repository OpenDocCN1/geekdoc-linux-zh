- pgno: 235
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_235_0.png)


    Computers are dynamic and multipurpose machines; they do a variety of jobs using
    many tools. This chapter describes the ways you can manage these tools. One aspect
    of software is installing, uninstalling, and upgrading software packages. Another
    aspect of this task is in managing programs after they’re running. Finally, this
    chapter covers files, which record details of what running programs do—particularly
    programs that run automatically and in the background.


    # Understanding Package Management


    Package management is an area of Linux that varies from one distribution to another.
    Nonetheless, certain principles are common across most Linux distributions. This
    section describes these principles, followed by some of the two major Linux management
    systems. It describes how to manage packages using both the RPM Package Manager
    (RPM; a recursive acronym) and Debian package systems.


    # Linux Package Management Principles


    If you have installed software in Windows, you’re likely familiar with the procedure
    of double-clicking on an installer, which places all the files associated with
    a program where they should go. A Windows software installer is similar to a Linux
    package file, but there are a few differences. Linux packages have the following
    characteristics:


    +   - Each package is a single file that can be stored on a disk or transmitted
    over the Internet.

    - Package files, unlike Windows installers, are not programs; packages rely on
    other programs to do the work of installing the software.

    - Packages contain dependency information—that is, they can tell the packaging
    software what other packages or individual files must be installed in order for
    the package to work correctly.


    > NOTE Many program packages depend on library packages; libraries provide code
    that can be used by many programs.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Understanding Package Management


    +   - Packages contain version information so that the packaging software can
    tell which of two packages are more recent.


    +   - Packages contain architecture information to identify the CPU type (x86,
    x86-64, ARM, and so on) for which they''re intended. A separate code identifies
    packages that are architecture-independent, such as fonts and desktop themes.


    +   - Binary packages (that is, those that contain executable programs that are
    CPU-specific) are typically built from source packages (which contain source code
    that a programmer can understand). It''s possible to build a new binary package,
    given the source package, which can be useful in unusual circumstances.


    You can compile and install software from source code manually, without using
    a packaging tool. This advanced topic is beyond the scope of


    The software maintains a database of information about installed packages (the
    package database). This information includes the names and version numbers of
    all the installed packages, as well as the locations of all the files installed
    from each package. This information enables the package software to quickly uninstall,
    establish whether a new package''s dependencies have been met, and determine whether
    a package you''re trying to install has already been installed and, if so, whether
    the installed version is older than the one you''re trying to install.


    Packages can, and frequently do, contain files that will be installed to many
    directories on the computer. This fact makes tracking package contents critical.


    # Understanding Package Systems


    As noted, two package systems, RPM and Debian, can, although others exist, them
    differ in various technical details, as well as in the commands used to manage
    packages and in the format of the package files they use. You cannot install a
    Debian package on an RPM-based system, or vice versa. Indeed, installing a package
    intended for one distribution on another is a bit risky even when they use the
    same package type. This is because a non-native package may have dependencies
    that conflict with the needs of new packages.


    Table 1.1 in Chapter 1, “Selecting an Operating System,” summarizes some features
    of several popular Linux distributions, including the package system each uses.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Originally, package systems work locally—that is, to install a package on your
    computer you would first have to download a package file from the Internet or
    in some other way. Then you could use a local command to install the package.
    This approach, however, can be tedious when a package has many dependencies—you
    might attempt an installation, find unmet dependencies, download several packages,
    find that one of them has unmet-upon packages, and so on. By the time you''ve
    tracked down all these might need to install a dozen or more packages, modern
    distributions provide network-enabled tools to help automate the process. These
    tools rely on software repositories, which the tools can download packages automatically.
    From one distribution to another, particularly among RPM-based distributions.


    In practices, then, the process of managing software in Linux using text-mode
    or GUI tools to interface with a software repository. A typical software installation
    task works like this:


    +   1. You issue a command to install a program.

    2. The software locates dependencies of the specified program and notifies you
    of any additional software that must be installed.

    3. You issue a final approval for software installation (or decide against it,
    in which case the process stops).

    4. The software downloads all the necessary packages.


    > You can configure most distributions to use local media instead of or in addition
    to Internet repositories.


    The software installs all the packages.

    Upgrading software works in a similar way, although upgrades are less likely to
    require downloading depended-upon packages. Removing software can be done entirely
    locally, of course. Many distributions automatically check with their repositories
    from time to time and notify you when updates are available. You can keep your
    system up-to-date by clicking a few buttons when you''re prompted to do so. As
    an example, Figure 9.1 shows the Software Utility in Linux Mint 18.3, which shows
    a list of available updates.


    > Immediately after installing a distribution, you may find that a large number
    of updates are available.


    Package management necessarily involves root access, which is described in more
    detail in Chapter 13, “Creating Users and Groups.” If you follow the automatic
    prompts to update your software, you can keep the system up-to-date by entering
    the root password, or on some distributions your regular password, when the update
    software prompts for it.'
  merge: -1
  img_proc: true
