  md: 'optional set of switches (options), a regular expression, and an optional filename
    specification. The grep command supports a large number of options, the most common
    of which appear in Table 8.1.


    # TABLE 8.1 Common grep options


    | Option (long form) | Option (short form) | Description |

    |---|---|---|

    | --count | -c | Displays the number of lines that match, rather than the lines
    that contain matches to the regular expression |

    | --file=file | -f | Takes pattern input from the specified file rather than the
    command line. The grep command is a shortcut for this option. |

    | --ignore-case | -I | Performs a case-insensitive search, rather than the default
    case-sensitive search |

    | --recursive | -R or -r | Searches in the specified directory and all subdirectories
    rather than simply the specified directory. The grep command is a shortcut for
    this option. |

    | --extended-regexp | -E | Pass this option to use an extended regular expression.
    Alternatively, you can call grep rather than grep; this variant command uses extended
    regular expressions by default |


    > If you don''t specify a filename, grep uses standard input. This can be used
    with pipelines, as described shortly in “Redirecting Input and Output."


    A simple example of grep uses a regular expression with no special components:


    ```

    $ grep -r bash /etc/

    ```


    This example finds all files in /etc that contain the string bash (the Bash shell).
    The example includes the -r option, it searches recursively, so grep searches
    files in subdirectories of /etc as well as those in /etc itself. For each matching
    text file, the line that contains the string is printed.


    > Ordinary users can''t read some files in /etc. If you type this command a non-super
    user, you''ll see error messages relating to grep''s inability to open files.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Chapter 8 ■ Searching, Extracting, and Archiving Data


    Suppose that you want to locate all files in /etc that contain the string bash
    or dash. You can enter the following command, which uses a bracket regular expression
    to specify both variant devices:


    ```

    $ grep -r [bd]ash /etc/

    ```


    A complex example searches just the /etc/passwd file for lines that contain the
    word games or mail, and later on the same line, the word noglogin. This task requires
    extended regular expression notation; the command looks like this:


    ```

    $ grep -E "games mail).*noglogin" /etc/passwd

    ```


    ![](img/85a8584ad3f3bd69446d00a129bba855_211_0.png)


    If you type this command on your computer, it may find matches because of your
    directory''s configuration. Try other words within the parentheses indent of games
    and mail, such as nobody or lp.


    ![](img/85a8584ad3f3bd69446d00a129bba855_211_1.png)


    You can use grep in conjunction with commands that produce a lot of output in
    order to sift through that output for the material that''s important to you. (Several
    examples throughout this book use this technique.) To accomplish this, you need
    to use input and output redirection. This topic is covered (along with another
    grep examples) in the upcoming section, "Redirecting Input and Output."


    # Using find


    The find utility implements a brute-force approach to finding files. This program
    finds files by searching through the specified directory tree, checking filenames,
    file creation dates, and so on to locate the files that match the specified criteria.
    Because of this operation, find tends to be slow. It''s flexible, however, and
    likely to succeed, assuming the file you seek. To use find, type its name, optionally
    followed by a directory pathname (sometimes called a starting directory) and a
    series of options, some of which use specifications that are similar to regular
    expressions.


    ![](img/85a8584ad3f3bd69446d00a129bba855_211_2.png)


    In practice, you must use a directory pathname or a search criterion with find,
    and often both.


    You can specify one or more paths in which find should operate; the program will
    restrict its operations to these paths. The man page for find includes information
    about its search criteria, Table 8.2 summarizes common criteria.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# TABLE 8.2 Common find search criteria


    | Option | Description |

    | -name pattern | Search for files using their names. Doing so finds files that
    match the specified pattern. This pattern is a wildcard pattern, as described
    in Chapter 7, and not a regular expression. |

    | -perm mode | To find files that have certain permissions, use the -perm mode
    expression. The mode may be expressed symbolically or in octal form. If you precede
    mode with +, find locates files where any specified permission bits are set. If
    you precede mode with a -, finds files where all specified permission bits are
    set. (Chapter 14, "Setting Ownership and Permissions"), covers files permissions.
    |

    | -size n | Search for files based on size. Normal, n is specified in 512-byte
    blocks, but you can modify this by trailing the value with a letter code, such
    as c for characters (bytes) or k for kilobytes. |

    | -group name | Search for files that belong to the specified group. |

    | -gid GID | Search for files whose group ID (GID) is set to GID. |

    | -user name | Search for files that are owned by the specified user. |

    | -uid UID | Search for files by user ID (UID) number. |

    | -maxdepth levels | Limit the search of a directory and, perhaps, some limited
    subdirectories.|


    Many variant and additional options; find is a powerful command. As an example
    of its, consider the task of finding all Python script files, which normally have
    names that end in .py, in all users'' home directories. If these home directories
    reside in the /home directory tree, you might issue the following command:


    ```

    # find /home -name "*.py"

    ```


    The result will be a listing of all files that have names ending in .py and reside
    within the /home directory tree. Notice that shell quoting is used, "*.py", because
    the asterisks (*) have special meaning to the shell.


    > If you lack permission to list a directory’s contents, find will return that
    directory name and the error message Permission denied.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Using wc


    A file''s size in bytes, revealed by ls or searched for using find, can be a useful
    metric. This size value is almost always not useful for text files, though you
    might need to know how many words or lines are in a text file—say, because you
    want to know how many pages a text document will consume when printed at 52 lines
    per page. The wc provides this information. For instance, to discover the information
    for a newly created file newfile.txt in your working directory:


    ```

    $ wc newfile.txt

    37 59 1990 newfile.txt

    ```


    This output reveals that the newfile.txt contains 37 lines, 59 words, and 1,990
    bytes. By default, we display a count of lines, words, and for each file you pass
    to it. You can pass options to limit or expand wc output, as summarized in Table
    8.3. Of options in Table 8.3, -l, -w, and -c are the defaults, typing wc file.txt
    is equivalent to typing wc -lw file.txt. The program''s main page describes a
    few more options, but you''re most likely to use the ones in Table 8.3.


    # Table 8.3 Common options


    | Option (long form) | Option (short form) | Description |

    |---|---|---|

    | --bytes | -c | Displays the file''s byte count |

    | --chars | -m | Displays the file''s character count |

    | --lines | -l | Displays the file''s newline count |

    | --words | -w | Displays the file''s word count |

    | --max-line-length | -L | Displays the length of the longest line in the file
    |


    > Some text files use multibyte encodings, meaning that one character can consume
    more than one byte. Thus, the -c and -m options may not produce identical results,
    although they often.


    Be aware that wc works correctly on plain-text files, but it may produce incorrect
    or nonsensical results on formatted text files, such as HTML files or word processor
    files. You''re better off using a word processor or other specialized editor to
    find the number of words and other statistics for such files.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Using cut


    When extracting data, grep is helpful in pulling out entire file lines (records).
    Sometimes, though, you need parts of a file record. The cut command can help in
    this case. It''s frequently used to extract variable information from a file whose
    contents are highly patterned.


    Table 8.4 shows the options you''re most likely to need with the cut command.
    Consult its man page for additional options and a complete description of the
    cut command.


    | Option (long form) | Option (short form) | Description |

    | --- | --- | --- |

    | --characters | -c | Selects only designated character position(s) |

    | --delimiter | -d | Uses the designated delimiter as the field delimiter instead
    of the default delimiter (Tab) |

    | --fields | -f | Selects only designated fields |

    | --only-delimited | -s | Lines without a delimiter are not printed (default is
    to print them when the -f option is used).


    To use cut, you pass to one or more options that specify what you want, followed
    by one or more filenames. For instance, users'' home directories appear in the
    sixth colon-delimited file of the /etc/passwd file. Therefore, to extract only
    the directory names this command:


    ```

    $ cut -f 6 -d:" /etc/passwd

    ```


    You can capture the cut command''s results into a file using output redirection.
    Redirection is covered later in this chapter, in the "Redirecting Input and Output"
    section.


    > When using the cut command, the extracted information is displayed to the screen.
    Be aware, however, that the specified file(s) remains unchanged.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Using sort


    When dealing with a large amount of data, being able to sort it is often useful.
    The sort command does just that. However, you need to be aware of its features
    in order to achieve the desired results.


    For a simple data list with only words, you can use sort without any options to
    sort it alphabetically, as shown here:


    ```

    $ cat pets.txt

    fish

    cat

    dog

    bird

    ```


    ```

    $ sort pets.txt

    bird

    cat

    dog

    fish

    ```


    > As with the cut command, when using sort, no changes are made to the file''s
    data. Only the output is sorted.


    You may need to use options when sorting numeric data to achieve the desired results.
    The example in Figure 8.1 shows what happens when the sort command is used to
    sort a numeric data list. The numbers are not properly sorted in numerical order
    until the -n option is used.


    # FIGURE 8.1 Sorting a numeric data list


    ![](img/85a8584ad3f3bd69446d00a129bba855_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Figure 8.1 shows the importance of using the appropriate sort command option
    to achieve the results you desire. A few of the more popular sort options are
    listed in Table 8.5.


    # TABLE 8.5 Common sort options


    | Option (long form) | Option (short form) | Description |

    | -- | -- | -- |

    | --dictionary-order | -d | Considers only blanks and alphanumeric characters;
    doesn''t consider special characters |

    | --ignore-case | -f | Ignores case (default is to consider case and order capitalized
    letters first) |

    | --numeric-sort | -n | Sorts by string numeric value |

    | --output=file | -o | Writes results to file specified |

    | --reverse | -r | Sorts in descending order (default is to sort ascending) |


    Many useful sort options are available besides those listed in Table 8.5. To explore
    the other options, review the man pages for sort.


    # Using cat


    Chapter 5, “Getting to Know the Command Line,” introduced the cat command. Though
    cat is often used for displaying short texts on the screen, it can concatenate
    files together. The example in Figure 8.2 shows both of these uses in cat.

    Notice in Figure 8.2 that when the command is used with a single file as an argument,
    it displays the file''s contents on the screen, as you would expect. However,
    when two files are used as an argument, the files'' contents are concatenated.
    The themselves are not modified; only the output is concatenated. This can be
    quite handy. “Redirecting Input and Output” section in this chapter details how
    to preserve this output for future use.


    Certification Objective


    ![](img/85a8584ad3f3bd69446d00a129bba855_216_0.png)


    To display only the first 10 lines of a file, use the head command instead of
    cat. To display only the last 10 lines of a file, the tail command can be helpful.
    Find out how to display fewer or additional file lines with these commands by
    viewing their man pages.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Redirecting Input and Output


    If you want to save a program''s output for future reference, you can redirect
    it to a file. You can also redirect the input to a program from a file. Although
    input redirection may sound strange, some programs rely on this feature to enable
    them to process data, such as raw-text files fed through a program that searches
    the text for patterns. In addition to redirect-ing output to files or from input,
    you can pass one program’s output to another one as its input. A related technique
    involves the xargs command, which enables you to generate command-line options
    from files or other programs’ output.


    # ## Using Basic Redirection Operators


    Redirection is achieved with the help of redirection operators, which are short
    strings that appear after the command and its arguments. Table 8.6 shows the most
    common redirect-ion operators. Be aware that output comes in two types:


    **Standard Output** This is for normal program messages.


    **Standard Error** This contains error messages.


    Having types of outputs enables them to be separated so that error messages don’t
    confuse programs that might be expecting certain types of input from another program.


    FIGURE 8.2 Using cat to display and concatenate files


    ![](img/85a8584ad3f3bd69446d00a129bba855_217_0.png)


    Certification Objective'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# TABLE 8.6 Common redirection operators


    | Redirection operator | Effect |

    |---|---|n| > | Creates a new file containing standard output. If the specified
    file exists, it''s overwritten. |

    | >> | Appends standard output to the existing file. If the specified file doesn''t
    exist, it''s created. |

    | 2> | Creates a new file containing error messages (standard error). If the specified
    file exists, it''s overwritten. |

    | 2>> | Appends standard error to the existing file. If the specified file doesn''t
    exist, it''s created. |

    | && | Creates a new file containing both standard output and standard error.
    If the specified file exists, it''s overwritten. |

    | < | Sends the contents of the specified file to be used as standard input. |

    | << | Accepts text on the following lines as standard input. |

    | <> | Causes the specified file to be used for both standard input and standard
    output. |


    As an example of redirecting output, consider a grep command to search for information
    on a particular user in all the configuration files in the /etc/ directory tree.
    Without redirection, such a command might look like this:


    ```

    # grep -r christine /etc/

    ```


    Assuming that super privileges are used, this command will return a series of
    output lines like the following:


    ```

    [...]

    /etc/group:adm:x:4:syslog,christine

    /etc/group:cdrom:x:24:christine

    /etc/group:sudo:x:27:christine

    /etc/group:dip:x:30:christine

    /etc/group:plugdev:x:46:christine

    [...]

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Such output can be quite lengthy, and you might want to peruse it later. To
    do so, you could redirect the output to a file, like this:


    ```

    # grep -r christine /etc/ > christine-in-etc.txt

    ```


    > Be careful when using the > redirection operator. If the file already exists,
    this operator will overwrite the file''s contents.


    Using the > redirection operator takes the output from the grep command and puts
    it into a file called christine-in-etc.txt. If you want to see the output, use
    less:


    ```

    [...

    /etc/group:adm:x:24:syslog,christine

    /etc/group:cdrom:x:24:christine

    /etc/group:sudo:x:27:christine

    /etc/group:dip:x:30:christine

    /etc/group:plugdev:x:46:christine

    [...]

    ```


    In this example, you haven''t gained much compared to simply typing grep -r christine
    /etc, but in other cases. For instance, suppose a command is producing several
    error messages. You might redirect standard error to a file and search for strings
    that might be relevant you attempt to run the command, or a modified version of
    it, once more.


    This example illustrates how error messages (standard error) and normal program
    messages (standard output) are separate. If you type grep -r christine /etc/ as
    a normal user (substituting your username for christine), you are likely to see
    output such as shown above, specifying the files in your username appear; however,
    you''re also likely to see error messages, since you lack permission to read some
    of the files in /etc:


    ```

    grep: /etc/cups/subscriptions.conf:0: Permission denied

    grep: /etc/security/passwd Permission denied

    ```


    The information in the files where christine appears is shown via standard output,
    but the errors are shown via standard error.


    > The only difference between redirecting standard output using the > redirection
    operator and redirecting standard error by the 2> operator is the number 2. This
    is because the number 2 represents standard error at the command line.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Redirecting Input and Output


    If you''re not interested in the errors, you can redirect them to /dev/null—a
    device file that serves as a trash for data that you want to discard:


    ```

    $ grep -r christine /etc/ 2> /dev/null

    ```


    Likewise, if you redirect standard output to a file but do not redirect standard
    error, you will see all the error messages on your screen. However, the file you
    create (christine-in-etc.txt from the earlier command) will not contain the error
    messages. You may want to try all of the different types of output redirection
    by using


    ```

    grep -r christine /etc/ (substituting your own username for christine) to get
    a feel for how they work.

    ```


    # Using Pipes


    Another type of redirected output is a command-line pipe or pipeline. In a pipe,
    the standard output from one program is redirected as the standard input to a
    second. You can create a pipe by using a vertical bar (|) between two commands;
    this is usually about pressing the Enter key on the keyboard and with Shift. Pipelines
    can be useful in various ways. For instance, you might pipe the lengthy output
    of a program through the less pager, which enables you to page up and down through
    the output. In this example, the cut command pulls the users'' home directories
    from the /etc/passwd file and pipes them into the less command (originally described
    in Chapter 5) for an easier viewing of the results:


    ```

    $ cut -f 6 -d ": /etc/passwd | less

    ```


    ![](img/85a8584ad3f3bd69446d00a129bba855_220_0.png)


    > /etc/passwd file and user accounts are covered in detail in Chapter 12, "Understanding
    Basic Security."


    grep is used in pipelines to search for keywords in the output. In this example,
    the cut command pulls the users'' default shells from the /etc/passwd file and
    pipes them into input to grep to search for the bash keyword:


    ```

    $ cut -f 7 -d ": /etc/passwd | grep bash

    ```


    You are not limited to one pipe in your command line. For example, you can make
    the previous example more useful by piping in a second pipe. To determine the
    number of users who have the bash shell in their /etc/passwd record, use another
    pipe and tack the command onto the pipeline''s end:


    ```

    $ cut -f 7 -d ": /etc/passwd | grep bash | wc -l

    ```


    The previous example included three commands in the pipeline. There are 237 user
    accounts that have the bash shell in their /etc/passwd record on this system.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Creating Custom Tools


    When you use filter commands as grep, cut, and wc with redirection, you can create
    powerful tailor-made utilities. With these utilities, you can conduct security
    audits, create usage reports, analyze text-based log files, and so on. You''re
    limited only by your command-line knowledge and imagination.


    In Chapter 11, "Creating Scripts," you''ll learn how to create programs to automate
    many of the necessary and routine system administration tasks. When you understand
    how to use these utilities at the shell prompt, you can quickly engage them within
    shell scripts later.


    # Generating Command Lines


    Pipelines can be useful for tricky tasks. For instance, suppose you want to remove
    every file in a directory tree with a name that ends in a tilde (~). This filename
    convention denotes backup files created by text editors. With a large directory,
    this task can be daunting. The usual file-deletion command (rm, described in Chapter
    7) doesn''t provide an option to search and delete every file in a directory tree
    that matches a specific criterion. The find command could do the search part of
    the job (described in depth earlier), but not the deletion.


    The solution is to combine the output of find to create a series of command lines
    using rm. This can be accomplished in three primary ways:


    xargs the command''s purpose in a pipeline is to build a command from its standard
    input. The basic syntax for this command is as follows:


    ```

    xargs [OPTIONS] [INITIAL-ARGUMENTS]]

    ```


    COMMAND is the command that you want to execute, and INITIAL-ARGUMENTS is a list
    of arguments that you want to pass to the command. The [OPTIONS] are xargs options;
    they aren''t passed to COMMAND. When you run xargs, it runs COMMAND for every
    word passed to standard input, adding that word to the argument list for COMMAND.
    If you want to pass multiple options to the command, you can protect them by enclosing
    the group in quotation marks.


    For instance, consider the task of deleting all backup files, denoted byilde characters.
    You can do this by piping the output of find to xargs, which then calls rm:


    ```

    $ find . -name "~*" xargs rm

    ```


    The first part of this pipeline (find . -name "~*") finds all the files in the
    current directory (/) or its subdirectories with a name that ends in a tilde (~).
    This list is piped to xargs, which calls each file to its own rm command. The
    tricky task of finding and deleting all of those backup files is accomplished.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Archiving Data 183


    **Backticks** A tool that''s similar to xargs in many ways is the backtick (`),
    which is a character to the left of the number 1 key on keyboards. The backtick
    is *not* the same as the single quote character (''''), which is located to the
    right of the semicolon (;) on most keyboards.


    Text placed within backticks is treated as a separate command whose results are
    substituted on the command line. For instance, to delete backup files, you type
    the following command:


    ```

    $ rm `find . -name "*""

    ```


    Using backticks in this way is called *command substitution*, because you are
    providing a substitution for one of the command''s arguments. In the previous
    example, the results of the `find` command took the place of the file''s name
    as the `rm` command.


    **() Format** Because it is so easy to confuse a backtick (`) with a single quotation
    mark (''''), using backticks for command substitution is generally falling out
    of favor. If it is available on your distribution, it is better to use another
    form of command substitution, the $() format:


    ```

    $ $(find . -name "**")

    ```


    The results are the same using this form of command substitution, and they are
    generally easier to read due to the parentheses containing the first command to
    execute and not the small backticks (which look like quotation marks).


    # Archiving Data


    A file-archiving tool collects a group of files into a single "package" file that
    you can easily move around on a single system; back up to a USB flash drive, other
    removable media; or transfer across a network. Linux supports several archiving
    methods, the most prominent being tar and zip. In order to understanding these
    commands, you should be familiar with the consequences of compression with them.


    > Another archive program, cpio, is sometimes used in Linux. It''s similar in
    principle to tar but different in operational details.


    ![](img/85a8584ad3f3bd69446d00a129bba855_222_0.png)


    # Using tar


    The tar program''s name stands for *tape archiver*. Regardless of its name, you
    can use tar to back up (also called *archive*) to hard disk or other media, not
    just to tapes. The tar program is a popular tool used to archive various data
    files into a single file, called an archive file (the original files remain on
    your disk). Because the resulting archive file can be quite large, it is often
    compressed on the fly via the tar program into a *tarball*. In fact,


    Certification Objective'
