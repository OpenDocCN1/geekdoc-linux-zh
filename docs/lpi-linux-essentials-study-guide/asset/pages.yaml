  md: '# Launching Programs


    Most desktop environments provide several ways to launch programs. Details can
    vary considerably from one environment to another. However, useful examples include
    the following:


    **Desktop Menu** Many desktop environments provide menus along a top, bottom,
    or side of the screen. One or more items in these menus can give you access to
    a preselected set of applications.


    **Desktop Icons** In some desktop environments you can place icons in the main
    area of the desktop. Clicking or double-clicking these icons launches the applications.
    This approach generally requires customization. Some default configurations place
    a few applications in the main desktop area.


    **Panels** Some desktop environments provide panels where common applications
    appear; typically on the sides of the screen. GNOME Shell (a version of the GNOME
    desktop environment) uses such a configuration by default—the panel appears only
    when you click the Activities item in the upper-left corner of the screen.


    **Context Menu** You can sometimes right-click in an unused part of the screen
    to obtain a context menu with a variety of options, which may include the option
    to run programs.


    **Searching for Programs** Some desktop environments provide a search feature
    that you can use to find a program by name. This search feature may be on the
    main screen or within a desktop menu. Typically, you type part of a program''s
    name, and programs whose names appear in a list. You can then select the program
    that you want to run from that list.


    **Terminals** You can launch a program called a *terminal*, which provides a text-mode
    user interface inside a window. You can then run either text-mode or GUI programs
    by typing their filenames. This approach is covered in detail in Chapter 5, "Getting
    to Know the Command."


    To help clarify some of these methods, a couple of examples are in order. First,
    you''ll launch the Firefox browser in the Fedora 30 Workstation using the GNOME
    Shell desktop environment.


    Follow these steps to log into the system:


    +   1. Click the Activities item in the upper-left corner of the screen. The result
    is a panel (called Favorites) on the left side of the screen, as shown in Figure
    4.3.

    2. Move the mouse over the Firefox icon, which is the topmost icon in Figure 4.3.

    3. Click the Firefox icon. After a brief delay, a Firefox window should open.'
