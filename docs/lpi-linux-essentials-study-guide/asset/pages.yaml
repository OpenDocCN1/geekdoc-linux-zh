    If you''ve installed Windows computers, you should be aware of an important difference
    between Windows and Linux: In Windows, it''s common for a program binary, its
    configuration files, and all of its support files to reside in a single directory
    that belongs to the program, such as C:\Program Files\SomeProgram. In Linux, by
