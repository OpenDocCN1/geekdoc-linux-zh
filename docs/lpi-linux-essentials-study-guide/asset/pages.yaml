    Most of the script''s programs operate silently unless they encounter problems,
    (including typing the passwords, which don''t echo to the screen) is a result
    of just the passwd command. In effect, Listing 11.2''s script replaces seven lines
    of commands with one. Every one of those lines uses the username, by running this
    script, you reduce the chance of a typo causing problems.


