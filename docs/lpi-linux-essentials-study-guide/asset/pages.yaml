    Given this range of multimedia applications, you can use Linux for everything
    cropping photos of your two-year-old''s birthday party to rendering the effects
    for major motion pictures. If you have very special needs, digging a bit may turn
    up something else—this is just the start list!


    # Using Linux for Cloud Computing


    Public cloud computing is the storage of computer software and/or data over the
    Internet, rather than storing locally on your computer. In this term, cloud represents
    the Internet and computing what you are doing over the Internet. In some cases,
    users access cloud-computing resources via a web browser. In theory, Linux functions
    as a cloud-computing client platform—launch a web browser to access the cloud-computing
    provider and you are go.


    In practice, complications arise when you access public cloud-computing services.
    For instance, a cloud-computing provider might require that you use a particular
    web browser or have a specific browser plug-in. In some cases, it might be impossible
    to meet these requirements in Linux; however, if the provider supports a wide
    range of browsers as clients, you shouldn''t have problems using cloud-computing
    resources.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'A few notable cloud-computing resources include the following:


    +   - On-demand streaming media, such as Netflix (netflix.com)

    - File storage services, such as Dropbox (dropbox.com)

    - Office productivity suites, such as Zoho Office (zoho.com)

    - Web-based email, such as Gmail (mail.google.com/)


    Private computing is a slightly different technology than that the cloud is your
    company''s (or home''s) network and its local resources, instead of the Internet.
    Thus, a private cloud is sometimes called an enterprise or internal cloud. Using
    this type of cloud provides higher security but requires more local management
    and resources.


    Using Linux, you can set up a private cloud for file hosting via one of the following
    suite resources:


    +   - ownCloud (owncloud.org)

    - Nextcloud (nextcloud.com)

    - FileCloud (filecloud.com)


    These software suites provide services similar to Dropbox, but instead of being
    stored remotely in a public cloud environment, the files are stored locally (called
    self-hosting). However, you can get fancy with these private-cloud software suites
    by allowing integration of file hosting on operating systems that you install
    on cloud providers, such as Amazon Web Services (AWS), Google Cloud, and Microsoft
    Azure. Operating systems that you install on a cloud provider are often referred
    to as infrastructure as a service (IaaS).


    ![](img/85a8584ad3f3bd69446d00a129bba855_110_0.png)


    Cloud-computing resources are often hosted on servers owned by companies called
    cloud providers. One example is the popular social media app, Twitter, which runs
    on Google Cloud. Cloud providers utilize powerful hardware servers to offer individual
    virtualized machines (simulated computer systems that appear and act as physical
    machines) to their clients. Typically, they use Linux it is interesting that Linux
    is often the operating system for the hardware server. But what''s really interesting
    that Linux is often the operating system occupying the client''s virtualized computer
    as well.


    # Using Mobile Applications


