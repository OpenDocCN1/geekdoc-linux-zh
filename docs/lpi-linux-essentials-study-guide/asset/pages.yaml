    | Port number | Protocol | Common server program(s) | Explanation |

    |---|---|---|--|

    | 80 | HTTP | Apache HTTP, NGINX | The Hypertext Transfer Protocol (HTTP) is the
    basis of the World Wide Web (WWW, or simply the web). |

    | 109–110 | POP2 and POP3 | Courier, IMAP, Dovecot, UW IMAP | The Post Office
    Protocol (POP) has gone through several revisions, each with its own port. This
    protocol enables a recipient to initiate an email transfer, or it''s often used
    as the last leg in email, from a server to the recipient. |

    | 118 | SQL | MySQL, PostgreSQL, MariaDB | The Structured Query Language (SQL)
    is a network-enabled database interface. When you run a SQL server on your network,
    client computers can access and modify that database. |

    | 137–139 | SMB/CIFS | Samba | Microsoft uses the Server Message Block (SMB)/Common
    Internet File System (CIFS) protocols for file and printer sharing, and Samba
    implements these protocols in Linux. |

    | 143, 200 | IMAP | Courier, Cyrus IMAP, Dovecot, UW IMAP | The Internet Access
    Protocol (IMAP) is another recipient-initiated email transfer, similar to POP.
