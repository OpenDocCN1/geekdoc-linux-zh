  md: '# Understanding Where Things Go


    # TABLE 7.1 The FHS directory classification system


    | Shareable | Unshareable |

    | --- | --- |

    | Static | /usr, /opt | /etc,/root |

    | Variable | /home, /var/mail | /var/run, /var/lock |


    The FHS comes in numbered versions. Version 3.0, the latest version as we write,
    was released in May 2015 (see FHS''s web page at linuxfoundation.org/collaborate/workgroups/lsb/fhs).


    # Important Directories and Their Contents


    The FHS defines the names and purposes of many directories and subdirectories
    on a Linux system. Table 7.2 summarizes the most important of these directories.
    Most of these directories are system, the main exceptions being /home, /tmp, /mnt,
    and /media.


    # TABLE 7.2 Important Linux directories according to the FHS


    | Directory | Purpose |

    | --- | --- |

    | / | The root directory. All files appear in this directory or subdirectories
    of it. |

    | /etc | Holds system configuration files |

    | /boot | Holds important boot files, such as the Linux kernel, the initial RAM
    disk, and often boot loader files |

    | /bin | Holds programs that are critical for normal operation and ordinary users
    run |

    | /sbin | Holds programs that are critical for normal operation and ordinary users
    seldom run |

    | /lib | Holds libraries—code used by many other programs—that are critical for
    basic system operation |

    | /usr | Holds programs and data used in normal system operation but that are
    not critical for a bare-bones boot of the system. This system is split into subdirectories
    that mirror parts of the root organization—/usr/bin, /usr/sbin, /usr/lib, and
    so on. |

    | /home | Holds users'' home directories. Separating this directory into its own
    lowlevel filesystem effectively isolates most user data from the OS, which can
    be useful if you want to reinstall the OS without losing user data. |'
