    and provides different software interfaces for programs to use. Thus, each OS
    is built from the kernel up and uses its own set of programs that further define
    each OS''s features.


    Some programs run on multiple kernels, but most need OS-specific tweaks. Programmers
    create binaries—the program files for a particular processor and kernel—for each
    OS. You need to run the binary file created for the specific OS you''re running
    on the program.


    Linux uses a kernel Linux—in fact, technically speaking, the word refers only
    to the kernel. Most features that you might associate with Linux are provided
