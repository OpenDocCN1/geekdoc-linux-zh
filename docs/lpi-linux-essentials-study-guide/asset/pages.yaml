  md: '# Using Wildcards


    A *wildcard* is a symbol or set of symbols that stands for other characters. You
    can use wildcards to refer to files. (Using wildcards is sometimes called *globbing.*)
    Three classes of wildcards are common in Linux:


    +   * A question mark (?) stands for a single character. For instance, b??k matches
    book, balk, or any other four-character filename that has b and ends with k.

    * An asterisk (*) matches any character or set of characters, including no character.
    For instance, b* matches book, balk, and buck just as does b*? b*k also matches
    bb, bbk, and backtrack.


    **Bracketed Values** enclosed in square brackets ([]) normally matches any character
    within the set. For instance, b[a-z] matches balk but not not buck. You can also
    specify a range of values; for filenames of this form which second a lowercase
    letter. This differs from b?—because Linux treats filenames in a case-sensitive
    way and because ? matches any character (not just any letter), b[a-z] doesn''t
    match buck or b3ck, although b2ck matches both of these.


    Wildcards are implemented in the shell and passed to the command that you call.
    For instance, if you typed ls b??k and that wildcard matches the three files balk,
    book, and buck, the result is precisely as if you typed ls balk buck.


    > The way bash expands wildcards can lead to unexpected, and undesirable consequences.
    For instance, suppose that you want to copy two files, using a wildcard, to another
    directory, but you forget to give the destination directory. The cp command will
    interpret the command as a request to copy the first of the files over the second.


    # Understanding Case Sensitivity


    Linux file systems are case-sensitive, which means that filenames differ only
    in case are distinct. For instance, a single directory can hold files called afile.txt,
    AFile.txt, and AFile.TXT, and each is a distinct file. This case sensitivity also
    means that if you type a filename, you get it with the correct case—if a file
    is called afile.txt but you type its name as AFile.txt, the program you''re using
    will tell you that the file does not exist. This is different from what happens
    in Windows or (usually) in macOS, where filenames differ only in case are treated
    identically. In these OSs, you can specify a filename using any case variant that
    you like. Windows also creates a short filename (eight characters with an optional
    three-character extension) for every file with a longer name in order to help
    out older software that works only with such filenames. Linux doesn''t create
    alternate'
