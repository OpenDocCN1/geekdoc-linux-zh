    running Linux, the most likely comparison is to Windows. Broadly speaking, Linux
    and Windows have similar capabilities; however, there are significant differences
    in details. These include the following:


    **Licensing** Linux is an open OS whereas Windows is a proprietary OS. Chapter
    2, "Understanding Software Licensing," covers open source in greater detail, but
    for now you know how open source software gives you greater control over your
