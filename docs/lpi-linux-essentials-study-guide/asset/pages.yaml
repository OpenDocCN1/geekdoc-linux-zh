- pgno: 130
  md: '# Starting a Command Line


    When you use the administrative account, root, the prompt normally ends in a hash
    mark (#). Chapter 12, “Understanding Basic Security,” describes the root account
    login in more detail.


    Most terminal programs provide common features of GUI programs—you can resize
    them, close, select options from menus, and so on. Details depend on the program
    you''re using, though. You may want to peruse the options available on your terminal
    program''s menu so you can set the font to you like, change the color scheme,
    and so on.


    Most terminal programs support tabs, which are similar to the tabs in a web browser.
    In most cases, such as in GNOME terminal, you can open a tab by clicking on the
    + box at the terminal''s upper right. Having multiple tabs is how you can run
    multiple programs simultaneously, work easily in multiple directories, or run
    programs as both yourself and root. Alternatively, you can run multiple terminal
    programs to achieve the same results.


    When you''re done with a terminal, you close it like other programs by clicking
    the X in the upper-right corner. Alternatively, you can type exit and press Enter
    at its shell prompt.


    # Logging into a Text-Mode Console


    At first glance, Linux looks like Windows or macOS in that it''s a GUI operating
    system. Scratch the surface, though, and you''ll find a purely text-mode interface.
    Linux supports virtual terminals (VTs), which are virtual screens that can hold
    various types of information—textual or graphical. Most Linux distributions run
    with six or seven VTs. In CentOS and Red Hat, the first VT runs the GUI window
    system. Fedora Workstation provides a graphical login screen on VT 1—logging into
    this screen will start a GUI on VT 2. Other distributions provide a graphical
    login screen on VT 1 and replace it with a GUI when the user logs in. Other distributions
    use VT 7 or VT 8 for their login screen and GUI, leaving VT 1 as a text-mode display.


    You can switch between VTs by pressing Ctrl+Alt+Fn, where n is a function key.
    (When switching between text-mode VTs, Alt+Alt+Fn is sufficient.)


    > The notation Ctrl+Alt+Fn refers to pressing the Ctrl key and holding it; pressing
    the Alt key and holding it; and then pressing the desired function key and releasing
    all three keys at once. The functions (F1 through F12) are located at the top
    of the keyboard. You pick the function number that matches the terminal number
    you want to reach. For example, you''d use the Ctrl+Alt+F3 key combination to
    reach VT 3.'
