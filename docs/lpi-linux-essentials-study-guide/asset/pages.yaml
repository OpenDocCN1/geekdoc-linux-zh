    ls, mv, cp, and rm, are used in scripts. You can use these commands to help automate
    file maintenance tasks.


    **find** The find command searches for patterns by filenames, ownership, and simili-lar
    characteristics. Chapter 8 covers this command.


    **cut** The cut command extracts text from fields in a file. It''s frequently
    used to extract variable information from file whose contents are highly patterned.
    To use it, you pass one or more options that specify what information you want,
    followed by one or more filenames. For instance, users'' home directories appear
