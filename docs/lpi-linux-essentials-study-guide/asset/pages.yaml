    +   - Use privileges as brief as possible. If you need to type just one or two
    commands as root, do so and then type exit in your shell to log out or to your
    normal privileges. Better yet, use sudo to run the commands. It''s easy to overlook
    the fact that you''re using a root shell and therefore type commands as root that
    don''t need privilege. Every command typed as root is a risk.

    - Never leave a root shell accessible to others. If you''re performing root maintenance
    tasks and are called away, type exit in your root shell before leaving the computer.

    - Be careful with the root password. Don''t share the password with others, and
