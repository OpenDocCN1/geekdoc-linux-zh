- pgno: 183
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_183_0.png)


    Much of what you do with a computer involves manipulating files. Files hold the
    correspondence, spreadsheets, digital photos, and other documents that you create.
    Files also hold the configuration settings for Linux—information on how to treat
    the network interfaces, how to access hard disks, and what to do when the computer
    starts. Indeed, even access to most hardware devices and kernel settings is ultimately
    done through files. Knowing where to find the files and how to manage them is
    critically important for administering a Linux computer.


    This chapter begins with a description of the layout of where Linux stores files.
    It then shows how to navigate your way around the Linux filesystem to get to your
    files. Finally, it goes through the basic text-mode commands for manipulating
    files and directories.


    # # Understanding Where Things Go


    As discussed in Chapter 6, “Managing Hardware”. Linux uses a unified directory
    tree—that is, every partition, removable disk, network file share, and other disk-like
    storage device is accessible as a single directory tree (or filesystem). This
    filesystem is structured—some directories have a specific purpose, whether the
    directories exist as regular subdirectories on one partition or separate devices
    are mounted off the root (/) device. Understanding the purpose of the main directories
    will help you locate files and avoid making disastrous mistakes. Before delving
    into those specifics, however, you should understand the distinction between user
    files and system files.


    > The term filesystem can refer to low-level data structures or the organization
    of files and directories on the computer. In this chapter, the latter meaning
    is the most common.


    # ## User Files vs. System Files


    To understand the distinction between user files and system files, recall that
    Linux is a multiuser OS. In principle, a single computer can host thousands of
    users. Consider such a computer for a moment—perhaps it’s a mainframe at a university,
    a large business, or a'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Understanding Where Things Go


    cloud-computing server. The vast majority of this computer''s users will be unfamiliar
    with the details of Linux system administration—they only want to use their word
    processors, email clients, and other applications. These users do not need to
    deal with system configuration files, for giving access to such files—especially
    write access—could be disastrous. On a computer with 1,000 users, each who can
    change the system configuration, somebody will make a change that will bring down
    the computer, whether through ignorance or malice.


    Of course, the issues involved in protecting the computer from its users are just
    a special case of more general user account issues—on that 100-user computer,
    you probably don''t want your users to be able to read and write each others''
    files except in limited ways. Thus, as described in Chapter 13, “Creating Users
    and Groups” and Chapter 14, “Setting Ownership and Permissions,” you can set permissions
    on files to prevent unauthorized access.


    System files control how the computer operates. They include the following:


    +   - System startup scripts launch servers and other important daemons

    - Program files both binary files and scripts

    - Program support files, such as fonts and icons

    - Configuration files that define how the system works (network configuration
    settings, disk layout information, and so on)

    - Configuration files for most server services and other daemons

    - Data storage for system programs, such as the database that describes what programs
    are installed

    - System log files, which record normal system activity


    ![](img/85a8584ad3f3bd69446d00a129bba855_184_0.png)


    Obviously, nontechnical users should not be able to alter system files, except
    perhaps indirectly (for instance). Users must be able to read some types of system
    files, such as the fonts and icons they use, but some system files should be protected
    from being read—root users should not be able to read the /etc/shadow file, because
    it holds encrypted passwords, for instance.)


    To achieve the goal of restricting ordinary users'' access to system files, files
    are normally owned by root or another system account that has a more limited purpose.
    For instance, many server programs read on their own system account settings.
