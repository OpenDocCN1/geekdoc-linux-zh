  md: '# Basic Network Troubleshooting


    by an s.: That allows you to specify the encryption key in ASCII text characters—otherwise,
    you''ll need to specify the key using hexadecimal values.


    If you don''t know the name of a local wireless connection, you can use the iwlist
    command to display all the wireless signals your wireless card detects. Just specify
    the name of the wireless device and use the scan option:


    ```

    $ iwlist w scan

