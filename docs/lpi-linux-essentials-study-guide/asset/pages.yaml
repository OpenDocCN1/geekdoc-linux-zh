- pgno: 330
  md: '# Deleting Accounts from the Shell


    The userdel command deletes accounts from a text-mode shell. In its simplest form,
    using super user privileges it passes it a username and nothing more:


    ```

    $ sudo userdel zwash

    [sudo] password for christine:

    ```


    The program doesn''t prompt you for confirmation; it deletes the account. It does
    not, however, delete the user''s home directory by default. To have it do so,
    pass the

    --remove (-r) option.


    If the user is currently logged in, userdel notifies you of that fact and does
    nothing. You can pass it the --force (-f) option to delete the account even though
    it is in. To force account deletion and remove the user''s files, you can pass
    both options:


    ```

    $ sudo userdel -rf zwash

    [sudo] password for christine:

    userdel: user zwash is currently used by process 4080

    $

    ```


    The program still complains about the user being "by a process" (logged into the
    system), but it deletes the account and files it just used.


    # Managing Groups


    In many respects, groups are comparable to accounts. They''re defined in similar
    files and managed with similar utilities. Groups are also tied to accounts in
    that accounts include group definitions. Until now, it has been assumed that you''ll
    be using standard groups or the groups that are defined as part of account creation.
    Sometimes, though, you need to create, delete, or modify groups for specific purposes,
    such as if you use a project group strategy. Like account management, you can
    use either GUI or text-mode tools.


    # Managing Groups Using GUI Tools


    Many GUI account maintenance tools, such as Linux Mint''s User and Groups Administration
    utility, provide group management tools that are similar to the user management
    tools described throughout this chapter. Referring back to Figure 13.1, you''ll
    see the User and Groups Administration window includes both Users and Groups tabs.
    To manage groups, click the Groups tab. This produces a resembling Figure 13.7.'
  merge: -1
