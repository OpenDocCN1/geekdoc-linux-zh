    # Real World Scenario



    # Administrator Shell Scripts


    The job of a Linux administrator can be somewhat tedious at times. There are lots
    of different log files the administrator must check daily to ensure things are
    running properly and no security breaches have occurred over the system. That
    task can take quite a long time to accomplish. However, many Linux administrators
    use shell scripts to help take some of the tedious out of examining pages of log
    files.


    Instead of manually looking through logs, administrators write scripts that use
    text processing tools, such as grep and cut, to search the log files for errors
    and warnings, copy these errors and warnings to a separate text file, and then
    email the resulting file to themselves. They then schedule the script to run each
    evening so that they have a summary of any system issues first thing in the morning
    when they arrive at work. Then they can focus their energy on resolving system
    issues rather than just looking for them!


    # Setting the Script''s Exit Value


    Ordinarily, a script''s exit status is the same as the script called—that is,
    the script returns $?. You can control the exit value, or exit from the script
    at any point, by using the exit command. Without any options, exit causes immediate
    termination of the script, with the usual exit value of $?. This can be useful
    in error handling or in aborting an ongoing operation for any reason—if the script
    detects an error or if the user selects an option to terminate, you can call exit
    to quit.


    ![](img/85a8584ad3f3bd69446d00a129bba855_284_1.png)'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'If you pass a numeric value between 0 and 255 to exit, the script terminates
    and returns the specified value as the script''s own exit value. You can use this
    feature to signal errors to other scripts that might call your script. You might
    have to include extra code to keep track of the causes of abnormal termination,
    For instance, you can set aside a variable ($termcause) to hold the code of the
    script''s termination. Set it to 0 at the start of the script and, if the script
    detects a problem that will cause termination, reset `$termcause` to some non-0
    value. (You can use any numeric codes like you; there''s no meaning for such codes.)
    On exit, be sure to pass `$termcause` to exit:


    ```

    exit $termcause

    ```


    # Summary


    Linux users and administrators must have at least a basic understanding of shell
    scripts. Any configuration and startup files are in fact shell scripts, and being
    able to read them, and perhaps modify them, will help you administer your system.
    Being able to create new scripts is important, because doing so will simplify
    tedious tasks and create script-specific tools by gluing together multiple programs
    to accomplish your goals. Linux shell allows you to combine standard shell commands
    with a few specialized programming commands, such as conditional expressions,
    loops, and functions, to implement logic features often found in larger-scale
    programs.


    # Exam Essentials


    **Describe the format of a basic shell script file.** Shell scripts must be plain-text
    files; they cannot be generated using a word processing application. The first
    line in the shell script should be the shebang combination (#/bin/sh). This indicates
    the shell that should be used to run the script. The remainder of the shell script
    is a list of commands or shell statements arranged in the order in which they
    are to be run by the shell. Though not required, it''s common to use the exit
    statement at the end of a shell script to control the exit status of the shell,
    especially if the shell exists with any type of error condition.


    **Explain how using variables helps when writing a shell script.** Shell scripts
    use variables to store data or other information for use later in the shell script.
    You assign data to a variable using the equal sign (=). The data can be any type
    of text or numerical data, or if you redirect the output of a command to store
    in a variable by placing back characters around the command. To reference the
    value of a variable inside the shell script, precede the variable with a dollar
    sign ($). You can reference variables in shell commands as well as in shell statements.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Explain how to pass data to a shell script. Shell scripts can use parameters,
    or arguments, to pass data from the command line to the shell script. Just include
    the data parameters on the command-line command when starting the shell script.
    Inside the shell script you can retrieve any command-line parameters by using
    positional variables. The $ positional variable is special; it references the
    shell command used to launch the shell script. Positional variable $1 references
    the first parameter entered on the command line, variable $2 the second parameter,
    and so on.


    Describe the different types of programming features you can use in shell scripts.
    Shell scripts can use conditional statements to evaluate data and make programming
    decisions based on the evaluation. The if and case statements are two conditional
    statements that you can use for that. The if statement can be paired with the
    else statement to create a true/false scenario for executing one set of statements
    if a condition is true, and the case statement allows you to specify a range of
    possible values to evaluate and execute separate sets of statements for each possible
    value. Besides conditional statements, shell scripts can use loops to iterate
    through a set of statements multiple times, based on either a series of values
    or a condition. Finally, shell scripts also support defining functions, which
    are a set of statements bundled together to be called from anywhere in the shell
    script as needed.'
  merge: -1
