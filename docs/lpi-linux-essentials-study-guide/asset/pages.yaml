    # Exam Essentials


    Summarize copyright protection and software licenses. A copyright is a legally
    recognized right to create a copy of something. Software is a type of intellectual
    property that is governed by copyrights (and possibly patents). Even though these
    laws were not created with software, they do apply. To remedy this ill fit, software
    is released with a license, which is a legal document that modifies the rights
    granted by copyright law. Generally licenses for proprietary software provide
    more restrictions to your rights under copyright law, whereas open source licenses
    grant you additional rights.


    Detail the FSF and its freedoms. Founded in 1985 by Richard Stallman, the Free
    Software Foundation (FSF) is the driving force behind the GNU''s Not Unix (GNU).
    It advocates free software, which centers on the phrase "free as speech, free
    as in beer." The organization has four specific software freedom definitions:
    freedom to use the software for any purpose, freedom to examine the source code
    and modify it as you see it, freedom to redistribute the software, and freedom
    to redistribute your modified software. The FSF philosophy and various licenses
    refer to copyleft.


    Describe the OSI and its guidelines. The Open Source Initiative (OSI) was created
    as a way to advocate and promote free software in the business world. Several
    licenses approved by the OSI are called permissive licenses, because they allow
    users to copy, share, and modify the software are not restrictive as copyleft.
    The OSI''s ten principles are briefly stated as free redistribution, available
    source code, permission to derive works, respect for source integrity, no discrimination
    is tolerated against persons or groups, no discrimination is acceptable against
    fields of endeavor, license distribution is automatic, lack of production specificity,
    shortage of restrictions on other software, and technology neutrality is encouraged.


