- pgno: 185
  md: 'Users'' home directories traditionally reside in /home, whereas /tmp is accessible
    to all users and holds temporary files.


    The distinction between system files and user files exists even on single-user
    Linux computers, as your personal laptop computer. This may seem strange or even
    frustrating; after all, if you''re the only user, and if you have root access,
    why bother with the distinction between system files and user files? The answer
    is that it provides a layer of protection against accidental or malicious damage.
    If a typo, a virus, or malware would say, delete all the files on the computer,
    the damage is contained if this action is performed as a normal user rather than
    root—delete all the files on the computer. Thus the distinction between these
    two account types (and, by extension, two classes of files) is useful even on
    a single-user computer.


    # The Filesystem Hierarchy Standard


    Every Linux distribution has its own unique way of defining things, their developers
    recognize the need for standardization in the layout of their directories. For
    instance, programs should be locate configuration files consistently in the same
    places on all distributions. If this weren''t the case, programs that rely on
    such features would become more complex and not work on all distributions. To
    address this need, the Filesystem Hierarchy Standard (FHS) was created. Aside
    from Linux, Unix-like OSs follow the FHS to one degree or another.


    > FHS evolved from an earlier Linux-only standard, the Filesystem Hierarchy Standard
    (FSSTND).


    One important distinction made by the FHS is shareable files and unshareable files.able
    files, such as user data and program binary files, may be reasonably shared between
    computers. (Of course, you do not need to share such files, but you may do so.)
    If files are shared, they''re usually shared through a Network File System (NFS)
    server. Unshareable files contain system-specific information, such as configuration
    files. For instance, you''re not likely to share a server''s configuration file
    between computers.


    A second important distinction made by the FHS is between static files and variable
    files. The former doesn''t normally change except through direct intervention
    by the system administrator. Most program executables are good examples of static
    files. Users, automated scripts, servers, or the like may change variable files.
    For instance, users'' home directories and mail queues are composed of variable
    files.


    The FHS tries to isolate each directory into one cell of this 2 x 2 (shareable/unshareable
    * static/variable) matrix. Table 7.1 illustrates these relationships. Some directories
    contain subdirectories within cells, but in these cases, the FHS tries to specify
    the status of particular subdirectories. For instance, /var is variable, and it
    contains some shareable and some unshareable subdirectories, as shown in Table
    7.1.'
  merge: -1
  img_proc: true
