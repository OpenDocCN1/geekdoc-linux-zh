- pgno: 322
  md: '# Modifying Accounts


    As you''ve learned, creating an account you can specify many options that affect
    accounts, such as giving an account a specific UID number. Sometimes, though,
    it''s necessary to change account options after an account has been created. Fortunately,
    Linux provides both GUI and text-mode tools to help you do this. Before delving
    into operational details of these tools, you should understand when you might
    want to make changes to accounts and know how to check whether a user is logged
    in.


    # Deciding When to Modify Accounts


    In an ideal world, you''ll create your accounts perfectly every time; however,
    sometimes this isn''t possible. You might lack information that''s necessary to
    create a flawlessly account (such as the length of time an employee will be with
    a company), or your needs might change after the account has been created. Some
    common reasons for account changes include (but are by no means limited) to the:


    +   - Account expiration data may need to be updated. A contract employee might
    have their contract extended, for instance. Sometimes an expired account must
    be enabled.


    +   - UID numbers may need to be synchronized with other computers in order to
    facilitate sharing accounts or for other reasons.


    +   - Users'' home directories might change because you''ve added disk space and
    have to move some users'' home directories to a new location.


    +   - A user might forget a password. The system administrator can change the
    password for any account without knowing the original password, so system administrators
    frequently have to help users with faulty memories.


    When working in a GUI, many of the preceding changes can be handled by the distribution''s
    GUI account management tool. When working in a text-mode shell, you''ll need to
    master a few programs to handle this range of account modifications.


    # Checking for Logged-in Users


    Be aware that some changes could be disruptive if the user is logged in at the
    moment you perform. Changing the account''s username and home directory, in particular,
    are likely to cause problems. Therefore, you should make account changes only
    when the user is logged out. Several tools can help you check who''s using the
    computer and avoid problems:


    who This utility, described in Chapter 12, produces a list of users who are currently
    logged into the computer, along with some details of their login sessions, such
    as their terminal and login dates.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Chapter 13 • Creating Users and Groups


    w This command, also described in Chapter 12, is similar to who in broad strokes,
    but it provides different details. Most notably, it identifies the program that''s
    currently running in each session.


    For a quick and simple list of who''s using the computer, most distributions offer
    the users command as well.


    last This program produces a list of recent login sessions, including their starting
    and ending times, or a notice that the user is logged in:


    # $ last


    | christin pts/2 | 192.168.0.102 | Tue Aug 20 11:46 | still logged in |

    | reboot | system boot | 4.10.0-38-generi | Tue Aug 13 10:09 - 11:22 | (01:12)
    |

    | ken | tty4 | | Tue Aug 6 6:57 - 11:40 | (00:43) |

    | devon | tty3 | | Tue Aug 6 6:57 - 11:40 | (00:43) |

    | steph | tty2 | | Tue Aug 6 6:57 - 11:40 | (00:43) |

    | rich | pts/0 | 192.168.0.102 | Tue Aug 6 6:56 - 11:40 | (00:43) |

    | christin | tty2 | | Tue Aug 6 6:34 - 10:57 | (00:22) |


    One limitation of last is that it includes only text-mode logins. This makes its
    utility for users who are currently using the computer rather limited, since such
    users are likely to be logged in using a GUI session.


    > The last command displays information similar to last, but it displays only
    failed login attempts and pulls its data from /var/log/tmp.


    The last command displays data that is stored in the /var/log/tmp file. You should
    be aware that some distributions do not create this file by default. See the last''s
    pages for more information.


    # Modifying Accounts Using GUI Tools


    With adding accounts, the procedure for modifying accounts using GUI tools varies
    from one to another. Most GUI tools provide similar options, although some are
    more complete than others. In this section, you''ll learn how to modify accounts
    using Linux Mint''s User and Group Administration utility.


    To make such changes, after you have the User and Groups Administration utility
    open, click the account name and then click Item To Modify. An example is shown
    in Figure 13.4.'
  merge: -1
