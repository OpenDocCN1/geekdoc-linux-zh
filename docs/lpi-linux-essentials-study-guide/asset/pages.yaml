- pgno: 399
  md: '# Appendix A ■ Answers to Review Questions


    2. The ethtool command displays features and parameters for network cards, so
    option A is the correct answer. The netstat command displays network statistics
    and connections, so option B is incorrect. The ifconfig and iwlist commands are
    used to set wireless network parameters not Ethernet card settings, so option
    C and D are incorrect. The route command displays routing information and not
    Ethernet card settings, so option E is incorrect.


    3. The ss command displays a list of open ports on a Linux system, with the processes
    associated with each port, so option E is correct. The ifconfig command sets wireless
    network information, not open ports, so option A is incorrect. The ip1p command
    displays or set network information on a network interface but doesn''t open ports,
    so option B is incorrect. The ping command displays ICMP messages to a remote
    host but doesn''t display any port, so option C is incorrect. The option D is
    incorrect.


    4. The default router is used to send packets from the local network to remote
    networks, to communicate with a remote host you need to define the default router
    address, making option A correct. The netstat only defines the local network—doesn''t
    define what to do with packets for remote hosts—so option B is incorrect. The
    host name and IP address define features of the host, so option C and D are incorrect,
    whereas the DNS server defines how to retrieve the IP address of a host based
    on its name, so option E is incorrect.


    5. The DNS server maps the host name to an IP address, so you must have a DNS
    server defined in your network configuration to be able to use host names in your
    applications. Thus, option E is correct. The default router only defines how to
    send packets to remote hosts—doesn''t map host to the IP address—so option A is
    incorrect. The netmask value defines the local network, not to map host names
    to addresses, so option B is incorrect. The host name and IP address define features
    of the host, so option C and D are incorrect.


    6. The Dynamic Host Configuration Protocol (DHCP) is used to assign dynamic IP
    addresses to workstations on a network, so option B is correct. The default router
    can''t assign addresses to devices, so option B is incorrect. The ARP table maps
    the hardware address of the network card to IP addresses doesn''t assign the IP
    addresses, so option C is incorrect. The netmask value defines the network address
    but not the IP address of the host, so option D is incorrect. The ifconfig command
    can set the static IP address of the host but not automatically assign the IP
    address, so option E is incorrect.


    7. The dig command displays host records for a domain, which you can use to find
    the MX mail host for the domain, so option A is correct. The host command displays
    only IP address information—can''t determine the server type from the DNS records—so
    option D is incorrect. The netstat and ss commands display active network connections
    but not the remote hosts, so option B and E are both incorrect. The ping6 command
    sends IPv6 ICMP packets to test remote hosts but can''t tell if the remote host
    is a mail server, so option C is incorrect.'
  merge: -1
