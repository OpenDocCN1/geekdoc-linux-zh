  md: '# Chapter 7 ■ Managing Files


    Chapter 5 includes information on how to specify locations other than the current
    directory, as well as how to change your current directory with the cd command.


    In most cases, you''ll use mkdir without options, other than the name of a directory,
    or you can modify its behavior in a few ways:


    **Set Mode** The -m mode or --mode=mode option causes the new directory to have
    the specified permission mode, expressed as an octal number.(Chapter 14 describes
    these topics in more detail).


    **Create Directories** Normally, if you specify the creation of a directory that
    doesn''t exist, mkdir responds with a No such file or directory error and doesn''t
    create the directory. If you include the -p or --parents option, mkdir creates
    the necessary directory. For instance, typing first/second returns an error message
    if first doesn''t exist, but typing mkdir -p first/second succeeds, creating both
    first and its subdirectory, second.


    # Deleting Directories


    The rmdir command is the opposite of mkdir; it destroys a directory. To use it,
    you normally type the command followed by the names of one or more directories
    that you want to delete:


    ```

    $ rmdir drone

    ```


    ```

    $ rmdir newdir/dirto newdir

    ```


    These examples delete the three directories created by the mkdir commands earlier.


    Like mkdir, rmdir supports options, the most important of which handle these tasks:


    Ignore Failures on Non-Empty Directories Normally, if a directory contains files
    or other directories, rmdir doesn''t delete it and returns an error message. With
    the --ignore-fail-on-empty option, rmdir still doesn''t delete the directory,
    but it doesn''t return an error message.


    Delete Tree The -p or --parents option allows rmdir to delete an entire directory.
    For instance, typing rmdir -p newdir/dirto causes rmdir to delete newdir/dirto,
    then newdir. You could use this command rather than the one shown earlier to delete
    both of these directories.


    You should understand that rmdir can delete empty directories; if a directory
    contains any files at all, it won''t work. (You can use the -p option, however,
    to delete a set of nested directories, as long as none of them holds nondirectories.)
    Of course, in real life you''re likely to want delete directory trees that hold
