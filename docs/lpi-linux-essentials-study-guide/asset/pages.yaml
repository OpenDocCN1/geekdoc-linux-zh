- pgno: 291
  md: "![](img/85a8584ad3f3bd69446d00a129bba855_291_0.png)\n\nLinux is a multiuser\
    \ OS, meaning that it provides features to help multiple individuals use the computer.\
    \ Collectively, these features constitute accounts. Previous chapters of this\
    \ book have referred to accounts in passing but haven't covered them in detail.\
    \ \n\nThis chapter changes that; it describes important account principles and\
    \ a few commands that you can use for investigating accounts. Related to accounts\
    \ are groups, which are collections of accounts that can be given permissions\
    \ on the computer, so this chapter also describes groups. One account, known as\
    \ root, has special privileges on the computer. Some administrators use this account\
    \ to perform system administration tasks, which is now considered a bad practice.\
    \ So you should understand this account and what to use in its place before tackling\
    \ the administrative tasks described in the last few chapters of this book. These\
    \ important topics are at the foundation of system security.\n\n# # Understanding\
    \ Accounts\n\nAccounts enable multiple users to share a single computer without\
    \ causing one another too much. They also enable system administrators to track\
    \ who is using system resources and, sometimes, who is doing things they shouldn't\
    \ be doing. Account features help users use a computer and administrators it.\
    \ Understanding this is the basis for enabling you to manage accounts.\n\n> NOTE\
    \ Every single-user workstation uses multiple accounts. Such a computer may have\
    \ just one user account, but several system accounts to help keep the computer\
    \ running.\n\nSome features help you identify accounts and the files and resources\
    \ associated with them. Knowing how to use these features will help you track\
    \ account-related problems and manage the computer's users.\n\n> NOTE There are\
    \ various account types—common user accounts, system accounts, and the root account.\
    \ Common accounts are built for users who do not need special privileges to complete\
    \ their daily tasks, such as creating a word processing document. System accounts\
    \ are set up for special services or programs, such as one that serves over web\
    \ pages. The root account was historically (and sometimes still used) for performing\
    \ system administration tasks. These topics are covered in more detail in the\
    \ “Understanding User Types” section later in this chapter."
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Understanding Account Features


    Most account features are defined in the /etc/passwd file, which consists of colon-delimited

    lines, with each line (or record) defining a single account. An entry might resemble
    the

    following:


    ```

    rich:1001:1001:Richard Blum:home/rich:/bin/bash

    ```


    The information contained in the fields of this record includes the following:


    **Username** An account''s username is its most relevant feature. Most Linux account\usernames
    consist of lowercase letters, and occasionally, as in rich or thx1138.

    Undcores (_) and dashes (--) are also valid characters in some distributions''

    usernames.


    **Password** User accounts are typically protected by a password, which is required
    to

    to the computer. Direct login to most system accounts is disabled, they lack passwords.

    (The root account is an important exception on some distributions; it may have
    a pass-

    word.) The password field in the /etc/passwd file usually contains an x, which
    is a code

    meaning that the password is stored in /etc/shadow, as described shortly.


    **UID** In reality, the username is just a label that the computer displays to
    numerically

    hallenged humans. The computer uses a user identification (UID) to track

    accounts, UID numbers begin with 0 (which refers to the root account). In many
    distri-

    utions, user accounts have UIDs at 1,000 and above, with lower numbers reserved\for
    system accounts.


    > Some distributions number user accounts starting at 500 rather than


    GID Accounts are tied to one or more groups, which are similar to accounts in
    many

    ways; however, a group is a collection of accounts. One of the primary purposes
    of groups

    is to enable users to get other users access to their files, while preventing
    users not

    in a designated group from accessing them. Each account is tied directly to a
    primary group

    via a group ID (100 in the preceding example). By including an account in

    group''s definition, accounts can be tied to several groups as described in Chapter
    13,

    "Creating Users and Groups"


    File ownership and permissions are described in Chapter 14, "Setting

    Ownership and Permissions."


    **Comment Field** The comment field normally holds the user''s full name (Richard
    Blum

    in this example), although this field can hold other information instead of or
    in addition to

    user''s name.


    **Home Directory** User accounts, and some system accounts, have home directories

    (/home/rich in this example). A home directory is an account’s "home base.\ Normally,'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Chapter 12 • Understanding Basic Security


    ownership of an account''s home directory belongs to the account. Certain tools
    and procedures make it easy for users to access their home directories; for instance,
    the tilde (~) refers to a user''s home directory used at the start of a filename.


    **Default Shell** A default shell is associated with every account. In Linux,
    this shell is merely Bash (/bin/bash), but individual users can change this if
    they like. Non-root systems set the default shell to /usr/sbin/nologin (or /sbin/nologin)
    as an added security measure—this program displays a message stating that the
    account is not available. /bin/false works in a similar way, without the explanatory
    message.


    You might guess by us that /etc/passwd holds password information. It''s not the
    case today, although it was many years ago. For historical reasons, /etc/passwd
    must be readable by all users, so storing passwords there, even as salted and
    hashed, is risky.


    ![](img/85a8584ad3f3bd69446d00a129bba855_293_0.png)


    > Passwords are stored using a salted hash, a one-way mathematical process with
    additional random input (salt), that produces what looks nonsense to humans. When
    a user types a password, it''s salted and hashed, and if the salted hashes match,
    access is granted.


    Passwords are stored in another file, /etc/shadow, that ordinary users can''t
    read. This file associates a salted and hashed password, as well as other information,
    with an account. This can disable an account after a period of time or if the
    user doesn''t change the password within a given period of time. A typical /etc/shadow
    entry looks like:


    ```

    $6$/moFeT5UntQ3kZuuoA4f4l2pUoIc[...]:18114:5:30:14:-1:-

    ```


    The meaning of each colon-delimited field in this file is as follows:


    +   **Username** Each begins with the username. Note that the UID is not used
    in /etc/shadow; the username links entries in this file to /etc/passwd.


    +   **Password** The password is stored as a salted hash, so there is no obvious
    resemblance to the actual password. An asterisk (*) or exclamation mark (!) denotes
    an account with no password (that is, the account doesn''t accept logins—it''s
    locked). This is common for accounts used by the system itself.


    +   **Last Password Change** The date (18214 in this example) is the date of the
    last password change. This date is stored as the number of days since January
    1, 1970.


    Epoch time, which is also called POSIX time, is the number of seconds since January
    1, 1970, the /etc/shadow file expresses it in its days. It has a long history
    with Unix and Linux systems. You don''t have to drag out your calculator to determine
    what a field''s date is using the Epoch. The change utility does that for you
    by displaying the /etc/shadow file record for a designated user in a human-friendly
    format. POSIX time may cause problems in the year 2038 on any small systems still
    using 32-bit processors, because the computer will run out of storage to track
    time properly in this way.


    ![](img/85a8584ad3f3bd69446d00a129bba855_293_1.png)


    *'
  merge: -1
