  md: '# Running Programs in the Background


    When you launch a GUI program from a terminal window, the GUI program opens its
    own window or windows but will normally become unresponsive. The terminal window
    remains open but if you want to type more commands in this window, you can do
    so by selecting and pressing Ctrl+Z. *This suspends the running program—that is,
    it sent to sleep.* In its sleeping state, the GUI program will not respond to
    input or do any work. However, you can now use the terminal window to type commands.

    After you have suspended a program, if you want to run the GUI program and use
    the terminal from which you launched it you can type **bg** (short for background)
    in the terminal. Both programs will now be active.

    If you only want to wake the GUI program, type **fg**. This returns the sleeping
    GUI program to the *foreground*, enabling it, but once this makes your terminal
    unresponsive. Note that, in this context, the terms background and foreground
    refer to the program''s relationship to the shell, not to the position of the
    program''s windows in a “stack” of windows on the screen.


    > Press Ctrl+Z also suspends most text-mode programs, enabling you to use the
    shell before returning to the program by typing fg.


    If you know before launching that you want to run a program in the background,
    you can do so by appending an ampersand (&) to the end of the command line, as
    in the following:

    $ firefox&


    As shown in Figure 5.5, this command launches the Firefox web browser in the background,
    enabling you to visit pages and continue to use the shell.


    **FIGURE 5.5** Launching Firefox in the background to allow use of the web browser
    and the shell


    ![](img/85a8584ad3f3bd69446d00a129bba855_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'This background feature is most useful for running GUI programs, but it''s
    sometimes used with text-mode programs too. A complex number-crunching program,
    for instance, might be designed to run for several minutes or hours and produce
    no output. You might want to run it in the background and retain control of your
    shell. Be aware, that if you launch a program in the background and it produces
    output to the terminal, that output will continue to appear in your shell, possibly
    intruding on whatever you''re trying to do with the shell.


    # # Using Shell Features


    Bash includes several features that make it much easier. Some have already described.
    Many others are beyond the scope of this book. Two, however, deserve attention:
    command completion and command history.


    # # Using Command Completion


    Command completion is the hero of everybody who hates typing: it''s a way to enter
    a long command or filename with a minimal number of keystrokes. To use command
    completion, you type part of a command or filename and then press the Tab key.
    If only one command on the path completes the command, Bash fills in the rest—and
    likewise when using command completion to refer to files.


    If command completion is not working for you, the terminal program may have it
    configured to be turned off.


    ![](img/85a8584ad3f3bd69446d00a129bba855_136_0.png)


    To illustrate the use of command completion, you can try it out with a few commands:


    +   1. Launch a shell.

    2. Type *wh*, then press the Tab key. The computer will probably beep or sound
    a tone. This indicates that your incomplete command could be completed by multiple
    commands, so you must type more characters. (In some configurations, the computer
    skips to the next one, as if you''d pressed Tab).

    3. Press the Tab key again. The shell displays a list of possible completions,
    such as *whatis*, *whereis*, and *whoami*.

    4. Type *oa*, making your command for *who*, and press the Tab key. The computer
    will probably complete the command: *whoami*. (If it doesn''t, another program
    completes the command may exist on your computer, so you may need to type another
    character or two).

    5. Press the Enter key. The computer runs *whoami*, which displays the account
    you are currently using.


    Sometimes command completion can complete a command only partially. For instance,
    typing *gru* and then pressing Tab is likely to add a single unique character,
    b. However, several commands begin with grub, so you must add more characters
    yourself. (These commands deal with the Grand Unified Bootloader, GRUB, which
    helps Linux to boot.)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Chapter 5 ■ Getting to Know the Command Line


    > NOTE Some details of how command completion works vary from one distribution
    to another.


    # Using Command History


    Bash remembers the commands that you''ve typed, and you can use this fact to save
    yourself effort if you need to type a command that''s similar to one you''ve typed
    recently. In its most basic form, you can use the up arrow to enter the previous
    command; pressing the up arrow repeatedly moves backward through earlier and earlier
    commands. Table 5.1 summarizes some other common keystrokes that you can use in
    the command history—or even when editing new commands.


    TABLE 5.1 Bash editing and command history features

    | Keystroke | Effect |

    | Up arrow | Retrieves the previous entry from the command history |

    | Down arrow | Retrieves an earlier entry bypassed when using the up arrow |

    | Left arrow | Moves the cursor left one character |

    | Right arrow | Moves the cursor right one character |

    | Ctrl+A | Moves the cursor to the start of the line |

    | Ctrl+E | Moves the cursor to the end of the line |

    | Delete key | Deletes the character under the cursor |

    | Backspace key | Deletes the character to the left of the cursor |

    | Ctrl+T | Swaps the character under the cursor with the one to the left of the
    cursor |

    | Ctrl+X and then Ctrl+E | Launches a full-fledged editor on the command line
    |

    | Ctrl+R | Searches for a command. Type few characters, and the shell will locate
    the latest command to include those characters. You can search for the next-most-recent
    command to include those characters by pressing Ctrl+R again. |'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Getting Help Using Man Pages


    Many of the Bash command-editing features are similar to those used by the emacs
    text editor.


    As an example of command history in use, try this:


    +   1. Type echo $PATH and press the Enter key to see the directories that make
    up your defined path.

    2. Press the up arrow key. Your echo $PATH command should reappear.

    3. Press the Backspace key five times to delete $PATH.

    4. Type Hello World to make the new command Hello world, and then press Enter.
    You should see the words Hello World displayed on your screen.

    5. Press Ctrl+R. The Bash prompt will change. It now looks like this: (reverse-i-)

    7. Type P (without pressing Enter). Your earlier echo $PATH command will execute
    again, and your Bash shell prompt should return to normal.


    > The Ctrl+R search feature searches on anything you enter on a command line—a
    command name, a filename, or other command parameters.


    Another history feature is the history command. Type history to view all of the
    commands in your history, or add a number (as in history 10) to view the most
    recent number of commands. Along with the commands, you''ll see a corresponding
    number. You can use this to execute a command from your history. Type just 1,
    follow it with command, and press Enter. The shell will display your chosen command,
    followed by the command''s results.

    You should experiment with these features. Tab completion and command history
    are powerful tools that can help you avoid a great deal of repetitive typing.
    Command history can also be a useful memory aid. For example, if you''ve forgotten
    the exact name of a file or command that you used recently, you might be able
    to retrieve it by searching part of the name that you do remember.


    # Getting Help Using Man Pages


    Sometimes you need to remember what arguments or options a command can use, or
    the proper syntax needed when entering a command. The manual pages (also called
    man pages) can help. Manual pages describe not only programs, but also configuration
    files and other features of a Linux installation.'
