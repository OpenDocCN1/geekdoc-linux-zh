  md: '# Understanding OS Roles


    Automotive Computers Automobiles have included computers for years. These have
    mostly tucked out of the way to monitor and control the engine and other automotive
    systems; however, modern cars increasingly come with computers that users more
    readily identify as computers. They manage global positioning system (GPS) navigation
    systems, manage collision avoidance, regulate emergency braking, control the audio
    system, and even provide Internet access.


    Appliances Televisions, refrigerators, and other appliances are increasingly using
    computers to download software updates, monitor energy use, and for other purposes.


    You might also think of tablet computers falling into this category as well, although
    they can closely resemble desktop or laptop computers. The distinction is mainly
    of how much control the have over the OS; embedded devices are used, not maintained,
    by end users. The system administration tasks described in this book are done
    at the factory or using much simpler and more specialized user interfaces.


    # Exploring Desktop and Laptop Computers


    Linux began as a desktop computer, and although Linux does not close to dominating
    market, desktop computers are a good way to begin about Linux. Laptop computers
    are similar to desktop computers from a system administration perspective; both
    types of computers are often used by a small number of people for productivity
    tasks, such as word processing, web browsing, and managing digital photos. For
    brevity, we will use the term desktop to refer to both types of computers from
    here.


    ![](img/85a8584ad3f3bd69446d00a129bba855_90_0.png)


    > Desktop computers are similar to other class of computer, known as workstations.
    Workstations tend to be more powerful and specialized, and they run Unix or Linux.


    Linux software for such tasks is widely available and is quite good, although
    some people prefer commercial counterparts, such as Microsoft Office or Adobe
    Photoshop, that are not available for Linux. This preference for a few specific
    products is part of why Windows continues to dominate the desktop market. Some
    people think the open source development model does not lend itself to creating
    GUI applications because software developers tend to be too technically oriented
    to appreciate fully the needs of general users. Without an explicit way to reach
    developers to fulfill these needs, which commercial applications create, open
    source software projects lag behind their counterparts in usability. At worst,
    open source projects lag behind their commercial counterparts just a bit. Specific
    software that''s required on most Linux-based desktop computers includes:


    +   - The X Window System GUI (X for short)


    +   - A popular desktop environment, such as GNOME, KDE, Xfce, or Unity


    +   - A web browser, such as Mozilla Firefox'
