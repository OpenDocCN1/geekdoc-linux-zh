- pgno: 171
  md: 'FAT''s simplicity and widespread support make it a popular filesystem over
    USB flash drives, cell phones, e-book readers, digital camera media, and so on.


    NTFS Microsoft developed the New Technology File System (NTFS) for Windows NT,
    and it is the default filesystem for recent versions of Windows. In the earlier
    Linux provided only a limited read NTFS driver, but now a read/write driver is
    available in the NTFS-3g software (tuxera.com). You''re most likely to encounter
    it on Windows boot partition in a dual-boot configuration or on larger external
    hard disks. Under Linux, the old kernel driver known as ntfs, whereas the NTFS-3
    driver is called ntfs-3g.


    Linux''s ntfs-3g driver is based in the kernel, which makes it fast. The ntfs-3g
    driver, unlike most filesystems, is not kernel-based, so it''s not as fast and
    requires additional processing power.


    HFS Apple used its Hierarchical File System (HFS) in Mac over version 9.x and
    still supports it in macOS. You''re most likely to encounter HFS on some removable
    media and particular on older disks created under pre-X versions of Mac OS. Linux
    provides full read/write HFS+ support with its hfsplus driver.


    HFS+ Apple''s HFS+, also known as Mac OS Extended, is the current filesystem for
    macOS; you''re likely to encounter it on dual-boot Mac computers and on some removable
    media created for use with Mac computers. Linux provides read/write HFS+ support
    with its hfsplus driver; however, write support is disabled by default on versions
    of the filesystems that include a journal.


    Mac users use FAT on removable media for compatibility reasons.


    ISO-9660 The ISO-9660 filesystem is used on optical media, and particularly on
    CD-ROMs and CD-Rs. It comes in several levels with differing capabilities. Two
    extensions, Joliet and Rock Ridge, provide support for long filenames using Windows
    and Unix standards, respectively. Linux supports all these variants. You should
    use the iso9660 type code to mount an ISO-9660 disc.


    UDF The Universal Disk Format (UDF) is a filesystem that''s intended to replace
    ISO-9660. It''s most commonly found on DVD and Blu-ray media, although it''s sometimes
    used on CD-Rs as well. Its Linux type code is, naturally, udf.


    Most non-Linux filesystems lack support for the Unix-style ownership and permissions
    that Linux uses. Thus, you may need to use special mount options to set ownership'
