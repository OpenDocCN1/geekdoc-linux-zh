- pgno: 328
  md: '# Deleting Accounts


    Deleting accounts can sometimes be as important as modifying them. Unused accounts
    can be abused, either by their former owners or by others who might be able to
    break into an account if it has a weak password. Therefore, you should routinely
    delete unused accounts. Before you do so, you, should understand what happens
    when you delete an account and decide precisely how to do it, lest you create
    problems by deleting an account in an inappropriate way. With that knowledge in
    hand, you can delete accounts by using GUI or text-mode tools.


    # Avoiding Account Deletion Pitfalls


    Deleting an account may sound simple enough, but a mistake can cause problems,
    either immediately or in the future. In addition to obvious issues such as accidentally
    deleting the wrong account, consider these two factors:


    +   User File Preservation Users files might be extremely valuable, either to
    the users or to the organization that owns the computer. You should check your
    company''s file retention policies when considering whether to delete the user''s
    home directory or do something with it, as you move it into another user''s home
    directory and change permissions on the files. The same is true of the user''s
    mail queue (normally stored in /var/spool/mail/username, where username is the
    account''s).


    > Consider archiving a deleted account''s home directory to a long-term backup
    medium. This strategy will enable you to recover the files should they become
    valuable in the future.


    UID and GID Reuse When an account is deleted, the account''s UID and GID become
    available for reuse. In many cases, these numbers will not be reused, since some
    Linux distributions these values based on the highest current value. If you delete
    any the highest-numbered user, the user''s old UID and GID numbers will be reused
    unless intervening accounts are also deleted. Nonetheless, if a UID is reused,
    files previously owned by the old user will suddenly appear to belong to the new
    user. This may cause any problems, but it may cause confusion about who created
    the files. In some cases, it can even cause suspicion of wrongdoing by the new
    user (if the old files contain information that the new user doesn''t have, or
    if the files reside in directories to the new user should have access).


    To avoid any confusion or misbehavior claims on new users or GID reuse, you can
    use the find command (covered in detail in Chapter 8, “Searching, Extracting,
    and Archiving Data”) to locate all files with particular UID or GID values. You
    must use the -uid and -gid options, as shown here:


    ```

    $ sudo find / -uid 1004

    ```'
