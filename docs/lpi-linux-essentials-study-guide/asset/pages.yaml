- pgno: 67
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_67_0.png)


    Software is a type of intellectual property that is governed by copyright laws
    and, in some countries, patent laws. As a general rule, this makes it illegal
    to copy software unless you''re the software''s author. Open source software,
    however, relies on licenses, which are documents that alter the terms under which
    the software is released. As described in this chapter, open source licenses grant
    additional rights to software users.


    In general, open source software owes a great deal to three organizations: the
    Free Software Foundation (FSF), the Open Source Initiative, and the Creative Commons
    (CC). Each organization has a distinct philosophy and role to play in the open
    source world. There are also numerous specific open source licenses, which are
    summarized at the end of this chapter, with ways that businesses can use them.


    # # Investigating Software Licenses


    Copyright law has existed for centuries, and as such, it wasn''t designed with
    software in mind. Nonetheless, copyright law applies to software. Licenses that
    authors apply to their software interface with copyright law to create the specific
    rights that you have—and don''t have—to use, modify, and redistribute software.
    You then need to understand the basic principles, as well as the differences,
    between proprietary and open source license terms.


    # ## Exploring Copyright Protection and Software


    A copyright is, as the name implies, a legally recognized right to create a copy
    of something. In most countries, if you write a book, take a photograph, or create
    a computer program, you (or alone) have the right to make copies of that book,
    photograph, or computer program. However, you can give others the right to make
    copies, or even relinquish copyright to somebody else.


    Copyright laws vary from one country to another, but most countries sign the Berne
    Convention, an international agreement that requires countries to recognize one
    another''s copyrights. That is, if Carol writes a book (or, a computer program)
    in the United States, that work will be copyrighted not only in the United States,
    but also in Iceland, Kenya, the United Kingdom, and other countries that have
    ratified the treaty.


    Because most copyright laws were written long before computers came into being,
    for instance, copyright laws forbid the copying of the work, but a computer program
    is useless without such copies. Examples'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Investigating Software Licenses 29


    of copies that must necessarily be made to run a program or that are advisable
    for safety, include the following:


    +   * A copy of the program from an installation medium to a disk drive

    * A copy of the program from the disk drive to the computer''s random access memory
    (RAM)

    * A copy of the RAM into swap space

    * A copy of the RAM into various smaller caches on the motherboard or CPU used
    to improve performance

    * One or more disk backups to protect against disk failures


    Swap space is disk space that serves as a supplement to RAM. For example, if RAM
    fills up, the operating system (OS) begins to swap space as it were RAM.


    In the past, copies were generally ignored on the principle of fair use—that is,
    exceptions that allow portions of copyrighted material to be copied. Other examples
    of fair use include quotes in reviews or news reports and excerpts used in research
    or teaching. Today, copyright law explicitly recognizes the need to copy software
    to use it, at least in the United States.


    # Real World Scenario


    # Patents, Trademarks, and Software


    Copyright is one example of intellectual property, but there are many others.
    One of these is patents. A copyright protects a single creative work, which can
    be considered an expression of an idea, but a patent protects the idea itself.
    Patents typically apply to inventions, such as the proverbial "better mousetrap."


    In the United States, software patents are legal. Although you cannot patent an
    idea, you can patent the algorithms that the program uses. Such patents are both
    common and controversial. Some open source programs do not use certain formats
    because the algorithms required to use them are patented and the patent-holders
    are threatened by unauthorized users. Critics of software patents contend that
    most patents are trivial or obvious—two that a patented invention must not be.
    Sometimes companies use software patents as a way to block another company from
    selling a product, or to demand payment from a company that sells a product.


    In many other countries, software algorithms cannot be patented. Efforts are underway
    to change the relationships between software and patents—both to make software
    patentable in countries where it is not and to restrict or eliminate software
    patents in countries where software can currently be patented.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Trademarks are another type of intellectual property. These are names, logos,
    and similar identifiers of a specific company or product. Software and the companies
    that produce it often use trademarks, as hardware companies. An individual with
    little involvement in the Linux community trademarked the name Linux in 1994 and
    attempted to charge royalties on the name. After a lawsuit, the trademark was
    transferred to the Linux Mark Institute, or LMI (www.linux-foundation.org/programs/legal/trademark).


    As an end user, you probably won''t have to deal with software patents or trademarks.
    Software and trademark issues play out at the corporation level. This contrasts
    with copyright issues, which can affect individuals who violate copyright law.
    If you work for a company that releases software, though, patent and trademark
    law could affect you. This is especially true if your software potentially violates
    a software patent or trademark. You should consult an attorney if you believe
    this might be the case.


    # Using Licenses to Modify Copyright Terms


    Although software is subject to copyright law, most software is released with
    a license, which is a legal document that claims to modify the rights granted
    by copyright. In most cases, you don''t sign a license, although in some cases
    you must click a button to accept the license terms. In the past, licenses were
    sometimes printed on the boxes in which software was distributed. These licenses
    are often called end-user license agreements (EULAs), click-through licenses,
    shrink-wrap licenses, or click-wrap licenses. Open source software generally comes
    with a license in a file, often named COPYING.


    > Courts have upheld the enforceability of click-through and similar licenses,
    although this result is not universal.


    Software licenses can modify copyrights by making the terms more or less restrictive.
    For example, the General Public License (GPL), which is the license used by the
    Linux kernel, grants you the right to redistribute the software, including both
    the source code and binaries. This represents a loosening of the restrictions
    provided by copyright law.


    As a general rule, licenses for proprietary restrict your rights under copyright
    law, whereas open source licenses grant you additional rights. There can be exceptions
    to this rule; for instance, a site license is a license for a proprietary program
    that grants an organization the right to make a certain number of copies of the
    program—say, 100 copies of a word processor for all of the company''s computers.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Looking at the Free Software Foundation


    The Free Software Foundation (FSF) is a critical force in the open source world.
    Founded in 1985 by Richard Stallman, the FSF is the driving force behind the GNU’s
    Not Unix (GNU) project described in the previous chapter. The FSF has a certain
    philosophy, described next, which manifests itself in the GPL, which is FSF’s
    favored software license.


    # Understanding the FSF Philosophy


    The FSF advocates what it calls free software, which it defines as freedom to
    do things you want to do with the software, not the price of software. A common
    phrase used to make this distinction clear is “free as speech, not free as beer.”


    ![](img/85a8584ad3f3bd69446d00a129bba855_70_0.png)


    Free software, as the FSF defines it, is different from freeware. Freeware generally
    refers to software that’s free of charge but not necessarily free as


    The FSF defines four specific software freedoms:


    +   - Freedom to use the software for any purpose

    - Freedom to examine the source code and modify it as you see fit

    - Freedom to redistributeribute the software

    - Freedom to redistribute your modified software


    These freedoms are similar to the principles exposed by the OSI, described shortly.
    However, there are some important differences in interpretation, as you’ll see
    soon. The FSF elaborates on the implications of each of its principles, and their
    interactions, at gnu.org/phlosophy/free-sw.html.


    In an ideal world, with FSF’s standards, all software will be free—distributed
    with source code and all of the freedoms outlined. Some Linux distributions meet
    this ideal in isolation, where others distribute proprietary software. Sometimes,
    this software is free. At other times, it’s a bit of proprietary code that enables
    the vendor to restrict redistribution and charge money to sell the software. Since
    free software is not necessarily free of charge, selling it is not a problem from
    the FSF’s point of view. However, given the other freedoms, software price trends
    toward zero as it gets passed around.


    The point of all this talk of freedom is to empower users—not developers or companies.
    If you modify a program that does almost what you want it to do so that it'
