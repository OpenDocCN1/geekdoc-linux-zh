    a file, so option B is incorrect. The chmod allows you to change the permissions
    assigned to a file, not the file''s group, so option C is correct. The ls command
    allows you to display the owner, group, and permissions using the -l option, but
    it doesn''t allow you to change the group''s file, so option D is incorrect.


    +   4. True. The octal mode 755 represents the symbolic mode -rwxrxr-x. The third
    set of permissions characters indicates the permissions for all users on the system,
    so all users have read permission on the file.


    +   5. False. The chmod command allows users to change the permissions assigned
    to a file or directory. Any user can change the permissions of files and directories
    that the user owns; therefore, any user can use the chmod command.


    +   6. True. An ordinary user can use chmod to change a file''s group to another
    group they belongs to, but only users can''t change the ownership of a file—only
    the root user can do that.'
