    # Summary


    When you''re just starting out with Linux, chances are that you''ll begin by using
    a desktop environment—the first set of programs that you see when you log in.
    A desktop environment enables you to run more programs, including common productivity
    tools such as web browsers, email clients, office utilities, and multimedia applications.
    If you''re configuring a computer as a server, of course, you''ll want to run
    server programs, but you''ll do this by editing configuration files rather than
    launching them from a desktop environment. If you need to do programming, you
    should be aware of some Linux programming languages, which enable you to write
    everything from trivial scripts to huge servers or productivity suites. If your
    distribution does not come with a needed desktop productivity program or server
    application preinstalled, you will have to install it via a package tool.'
