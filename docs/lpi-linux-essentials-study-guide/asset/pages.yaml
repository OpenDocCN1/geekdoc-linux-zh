- pgno: 41
  md: '![](img/85a8584ad3f3bd69446d00a129bba855_41_0.png)


    The fact that you''re reading this book means you want to learn about the Linux
    operating system (OS). To begin this journey, you must first understand what Linux
    is and what An OS is. This chapter describes what an OS is, how users interact
    with an OS, how Linux compares to other popular OSs, and how specific Linux implementations
    vary. Understanding these issues will help you as you make the switch to Linux
    and learn about the various Linux-based systems.


    # # What Is an OS?


    An OS provides all the fundamental features of a computer, at least from a software
    point of view. An OS enables you to use the computer''s hardware devices, defines
    the user interface standards, and provides basic tools that allow applications
    to run on the computer. This section describes the different parts that make up
    an OS and how they work together to create your computing experience.


    # # What Is a Kernel?


    An OS **kernel** is a software component responsible for managing various low-level
    features of the computer:


    +   - Interfacing with hardware devices (network adapters, hard disks, and so
    on)

    - Allocating memory to individual programs

    - Enabling programs to interact with one another


    When you use a program (say, a web browser), it relies on the kernel for many
    of its basic functions. The web browser can communicate with the outside world
    only by using network functions provided by the kernel. The kernel allocates memory
    and CPU time to the browser, which it couldn''t run. The web browser may require
    plug-ins to display multimedia content; such programs are launched and interact
    with the web browser through kernel services. Any program you run on a computer
    relies on the kernel in a similar way, although the details vary from one OS to
    another and from one program to another.


    > > The kernel is the software “glue” that holds the computer together. Without
    a kernel, a modern computer can do very little.'
  merge: -1
  img_proc: true
