    like the commands you might type to accomplish the task manually, except for one
    fact: the script lists the complete paths to each program. This ensures that the
    script will find the programs if the PATH environment variable changes. On the
    other hand, if the program files move (say, because you upgrade the package where
    they''re installed and the package decides to move them), scripts that use complete
    paths will break. If a script produces no such file or directory error for a command,
    typing which command, where command is the offending command, should help you
    locate it.


