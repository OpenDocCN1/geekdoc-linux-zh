    # Using Server Programs


    Linux is a powerful OS for running server programs, so it should come no surprise
    that you can find a wide variety of server programs for Linux. In this section,
    common server protocols and the programs that use them are described. In addition,
    the process of installing and launching servers is covered as well as basic information
    on server security issues.


    # Identifying Common Server Protocols and Programs


    Networks, including the Internet, by function of mean protocols. Network protocols
    are clearly defined descriptions of how two computers should exchange data to
    achieve a particular end, such as transferring or delivering a file to be printed.
    Most protocols are described in one or more standards, known as request for comments
    (RFC) documents, each of which has a number. Typically, one RFC defines the protocol,
    and over time additional RFC documents define extensions or modifications as they
    become necessary.


    Most protocols involve transferring data over one or more ports, which are numbered
    resources on a computer. You can think of a port as something like a room in a
    building on a college campus—the main number (Internet Protocol, or IP address)
    identifies the computer as a whole, and the port number identifies the protocol
    used. A server program attaches itself to a port number and receives all incoming
    requests on that port.


    Table 4.1 summarizes common port numbers, the protocols with which they''re associated,
    and the Linux programs that are often used in conjunction with these protocols.
    Many ports and protocols are associated with more than one program. This is because'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Linux provides choices for many protocols; you can choose which of several
    programs to use for a given protocol, just as you can choose which of several
    word processors or web browsers to use.


    > The /etc/services file links common port numbers to short names that are often
    used in other configuration files.


    # TABLE 4.1 Common server port numbers and their purposes


    | Port number | Protocol | Common server program(s) | Explanation |

    | --- | --- | --- | --- |

    | 20–21 | FTP | oftpd, ProFTPD, Pure-FTPd, vsftpd | The File Transfer Protocol
    (FTP) is an old protocol for transferring files over a network. It supports both
    anonymous and password-mediated access. FTP is unusual in that it uses two ports.
    |

    | 22 | SSH | OpenSSH | The Secure Shell (SSH) is an encrypted remote access tool.
    It supports file transfers and encrypting other protocols. |

    | 23 | Telnet | telnetd | Telnet is an old unencrypted login protocol. It''s seldom
    used today, although its client program, Telnet, can be a useful network diagnostic
    tool. |

    | 25 | SMTP | Postfix, qmail, sendmail | The Simple Mail Transfer Protocol (SMTP)
    is the main protocol for moving email on the Internet. The sender initiates SMTP
    transfers. |

    | 53 | DNS | dnsmasq, named | The Domain Name System (DNS) enables computers to
    look up an IP address by providing a hostname, or vice versa. Without it, you''d
    need to refer to all computers by IP address rather than name. |

    | 67 | BOOTP, DHCP | dnsmasq, dhcpd | The Bootstrap Protocol (BOOTP) and its younger
    cousin, Dynamic Host Configuration Protocol (DHCP), both enable a computer on
    a local network to help automatically configure other computers to use a network.
    |'
  merge: -1
  img_proc: true
