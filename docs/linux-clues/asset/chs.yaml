  \ `abc.sh` 进行一些测试来检查新代码在应该调用时是否被调用。在发布我们的脚本和其他程序之前，没有进行足够的测试是不好的——而且大部分测试需要尽快完成——而不是等到我们需要为了截止日期将更新投入生产环境时。\n\
  \n# 工作分析\n\n在写书的一部分时检查 `history` 列表中的命令活动，似乎我运行了 37 个位于 `/usr/bin` 的标准 Linux 命令，同时我还运行了\
  \ 30 个我自己的脚本并运行了 23 个自己的 shell 别名。这些命令和脚本在几天或几周内根据需要运行，帮助我完成我想做的事。数据还显示我运行了 5 个交互\
  \ shell 代码片段，并发生了 5 次不同的命令输入错误——我的手指——年龄增长的迹。我是如何知道这些细节的？以下是我所做的。我将当前的 `history`\
