  \ —— 取决于涉及的任务。我的工作环境有 400 多个别名定义。大多数别名平均运行一两个命令。我编写别名通常成组出现，以帮助我处理特定类别的工作 —— 例如用于\
  \ bash shell 编程、python 编程、Lilypond 音乐编程任务或我的写作任务。\n\n我的脚本程序从四五行的短脚本到其他的不等。\n\n##\
  \ 大括号扩展 (Brace expansion)\n大括号扩展是一种生成任意字符串的机制。例如，`a{d,c,b}` 扩展为 `ade ace acb`。在创建\
  \ `dev/{py,sh}` 和 `src/{py,sh}` 目录时，我使用了这些扩展之一。\n\n\n\n进程替换的形式为 `<(plist)>` 或 `>(plist)`。进程列表\
  \ `plist` 会异步运行，其输入或输出将表现为一个*临时*文件名，由于这种扩展方法，该文件名将作为参数传递给当前命令。\n\n假设我们有两个两个文件 `f1`\
  \ 和 `f2`，它们各包含一个单词列表——每行一个。我们想知道这两个列表是否包含*相同*的单词——无论每个单词出现多少次：\n\n```bash\n$ cmp\
  \ <(sort -u f1) <(sort -u f2)\n```\n\n记住——没消息就是好消息 —— 否则 `cmp` 将产生噪音并报告两个*唯一*排序后的文件中第一个差异点。\n\
  \n**注意：** 在 `<(` 和/或 `> ( )` 字符对之间没有空格 —— 否则 shell 将尝试将它们视为*正常*的进程 I/O 重定向。\n\n\
  使用这种*进程替换*，我们不需要使用独立的 `sort` 语句将输出重定向（`>`）到命名的*临时*文件，然后对这些文件运行 `cmp` 命令，最后再按习惯之后*删除*临时文件。\n\
  \n这种便利让我们免去了思考临时文件名以及在使用后记得清理的麻烦。\n\n更多细节请参见 `man bash`。\n\n## 单词拆分 (Word splitting)\n\
  \nshell 会扫描双引号内*未*发生的参数扩展、命令替换和算术扩展的结果进行单词拆分。\n\n这使用了环境变量 `IFS`（*输入字段分隔符*）的值，它的*默认*值为\
  \ `{space}`、`{tab}` 和 `{newline}` —— 这三者都是。\n\n要查看 `IFS` 中的内容，请运行此命令：\n\n```bash\n\
  $ echo \"$IFS\" | od -c\n```\n\n## 路径名扩展 (Pathname expansion)\n\n在单词拆分之后，bash shell\
  \ 会扫描每个单词以查找这三个元字符——*星号* `*`、*问号* `?` 和*左方括号* `[`。\n\n如果出现了这些字符之一且*未*被引号，则该单词被视为*模式*，并被替换为匹配模式的按字母排序的文件列表。\n\
  \nLinux bash shell 允许我们使用这三个特定的元字符来帮助引用文件名参数，这些参数可以代表文件系统对象名称或名称（们），而无需显式地写出它们。\n\
  \n路径名扩展可以为我们提供极大帮助——只要我们学会如何仔细地构建“*模式*”字符串。\n\n这些通配符或元字符意味着什么？\n\n## Shell 元字符 (Shell\
  \ meta-characters)\n\n- `*` —— 匹配文件名中*零个或*多个*字符的任何字符串。\n- `?` —— 匹配文件名中的任何*单个*字符。\n\
  - `[...]` 的使用 —— 匹配一组包含字符中的任意*一个*。\n- 例如使用 `[abc]` —— 扩展为*一个*字符之一——`a` 或 `b` 或 `c`\
  \ ——而不是同时匹配所有三个。\n- 在这些方括号内部，用连字符 `-` 隔开的一对字符表示字符的*范围*。\n- 例如使用 `[m-q]` —— 扩展为字符\
  \ `m` 或 `n` 或 `o` 或 `p` 或 `q` 之一。\n- 如果 `[` 后的*第一个*字符是感叹号（`!`）或脱字符符号或尖帽符号（`^`），则匹配任何**未**包含在集合中的字符。\n\
  - 通过将字面连字符或破折号（`-`）作为集合中的*第一个*或*最后一个*字符，可以匹配字面量 `-`。\n- 通过将其作为集合中的*第一个*字符，可以匹配字面量\
  \ `]`。\n- 更多细节请参见 `man bash`。\n\n这意味着什么？\n\n首先，有大量的实验需要进行，以帮助我们熟悉这些文件`路径`扩展可以做什么。\n\
  \n使用这些 shell 通配符意味着我们可以运行这样的命令：\n\n```bash\n$ cd\n$ ls .bash*\n.bash_aliases .bash_logout\n\
  .bash_history .bashrc\n$\n```\n\n这列出了任何以字符串 `.bash` 开头，后面跟零个或多个*任何*其他字符的文件——并且它匹配了我们\
  \ `HOME` 目录中那四个隐藏的 `.bash*` 文件。\n\n我们可以变得更具选择性并写成：\n\n```bash\n$ ls .b*[cs]\n.bash_aliases\
  \ .bashrc\n$\n```\n\n这列出了任何以字符串 `.b` 开头，后面跟零个或多个*任何*其他字符的文件——并且以 `c` *或* `s` 结尾。\n\
  \n这些限制了 `ls` 命令向我们展示我们之前运行 `ls -a` 命令时观察到的两个（2）个隐藏文件中的选择。\n\n如果好奇，我们可以列出存储在 `/usr/bin`\
  \ 目录中的那两个字符的可执行命令文件：\n\n```bash\n$ cd /usr/bin\n$ ls ??\nbc  du\n```\n\n\n\n如果我们尝试在文件名中使用这些元字符，那么在命令行中指定这些名称将会变得更加困难。\n\
  \n我们需要利用另一个元字符（反斜杠字符）来隐藏该字符以及我们散布在文件名中的其他元字符在命令行中的含义！\n\n我觉得这是一种对时间和精力的浪费——因为我只需花一两秒时间思考，就能想出一个更短、更易输入且意思几乎完全相同的文件名。\n\
  \n这重要吗？对我来说很重要——但我们也知道我以自己的方式与众不同。\n\n如果我正在处理一个 `requires` 长文件名的项目，我宁愿在 `internal`（内部）处理时使用自己的短文件名，并在将其发布出去时，将这些短文件名转换为项目\
  \ `requires` 的长文件名。\n\n几行 shell 脚本代码通常就能解决问题。\n\n别人选择怎么做那是他们自己的事。\n\n空格字符是我们必须通过使用反斜杠前缀来\
  \ `elide`（省略/转）的字符之一，或者必须记住将包含嵌入空格的文件名用引号括起来，例如：\n\n```\n$ cat ’another blank space\
  \ file name’\n```\n\n否则，我们可能去掉那两个匹配的右单引号，并在每个空格字符的左侧插入四个反斜杠字符——每个空格左边放一个！\n\n在我看来，更好的方法是使用\
  \ `tr` 命令在想要更长且更具描述性的文件名时，帮助 `translate`（转换）空格字符为连字符或字符（`-`）：\n\n```bash\n$ fnam=$(echo\
  \ long file name.txt | tr \" \" \"-\")\n$ echo \"$fnam\"\nlong-file-name.txt\n```\n\
  \n然后，我可以在命令中使用 shell 变量 `fnam` 来帮助完成编辑、复制和使用文件等任务：\n\n```bash\n$ vim $fnam\n. .\
  \ .\n$ cp $fnam ~/txt\n```\n\n这对我意味着，如果我们节制在文件名中使用某些字符，就能为自己节省很多烦恼。\n\n三种引号字符（左引号、右引号和双引号）对\
  \ shell 都有特殊含义。\n\n分号（`;`）是一个命令分隔符。如果我们在文件名中使用它，它需要特殊处理。\n\n我们已经见过其他对 shell 具有特殊含义的元字符——i/o\
  \ 重定向字符（`<` 和 `>`）、shell 注释字符（`#`）、圆括号、大括号、方括号、美元符号（`$`）以及类似的——每一个在 bash shell 中都有更多含义。\n\
  \n如果我们尝试在文件名中使用这些字符，只会让我们痛苦多于收益。\n\n对于我的文件名，我选择使用 ASCII 十进制数字 `0` 到 `9`、字母 `A` 到\
  \ `Z` 以及小写 `a` 到 `z`，再加上连字符（`-`）或下划线符号（`_`），然后用点（`.`）分隔文件名和文件类型——例如 `.py` 或 `.sh`\
  \ 或 `.txt` 等。\n\n有时我会为某些文件添加加号（`+`）或逗号（`,`）。\n\n我不认为使用这 67 个字符限制太大。我确实它们让我免了许多处理文件名时的心头疼。\n\
  \n使用 `bc`（二进制计算器）工具——在这里我计算出我可以生成如此数量的唯一 15 字符文件名：\n\n```bash\n$ bc\n67¹⁵\n2461059085914092013369600043\n\
  {Ctrl}+{D}\n```\n\n这足够吗？并不是其中每一个都是 `useful`（有用的）——我希望你明白我的意思。\n\n如果我将使用的字符限制为 5\
  \ 个而不是 67 个——我可以生成 `3051758125` 个唯一的 15 字符名称！\n\n如果我在 15 字符名称的任何位置使用三个（3）字符，我仍然可以生成\
  \ `1438907` 个唯一的文件。\n\n我可以使用每个字符来代表项目代码、数据代码、处理阶段或结果代码——而且我不限于 15 个字符！这取决于用户。记录我们所做的是最好的。\n\
  \n我可以使用连字符（`-`）和下划线（`_`）来代替空格。最终结果几乎同样易读且干扰最小。我不反感在文件名中使用 `camelCase`（驼峰命名法）：\n\n\
  ```bash\n$ sort bigData.txt > bigData.txt\n```\n\n如果对自己诚实，对于大多数名称，我倾向于使用 `camelCase`\
  \ 或连字符单词，而不是 `snake_case`（蛇形命名法）——那是我的选择。人是不同的——我们有权保持如此。遵循这些简单的文件命名准则对我有效。\n\n\
  ## 文件链接\n\n在谈到系统为我们的文件保留元数据时，我提到 `ls -l` 命令输出每行的第一个字符对于普通文件可以是连字符（`-`），或者是字符 `d`（目录）、`c`（特殊文件）或\
  \ `l`（符号链接）。\n\n链接有两种类型——硬链接和符号链接。\n\n区别是什么？什么是符号链接？一个名为 `ln`（link 的缩写）的命令可以为现有文件创建\
  \ `link`（链接）。我们为什么要对文件建立 `link` 呢？\n\n一个原因是让我们通过不同的名称或在不同的目录下访问文件。`ln` 命令的语法是：\n\
  \n```bash\n$ ln -s sourceFile destFile\n```\n\n或者：\n\n```bash\n$ ln -s sourceFile\
  \ destDir\n```\n\n我们使用 `-s` 选项对源文件创建符号链接而不是所谓的硬链接。这些 `sourceFile`、`destFile` 和 `destDir`\
  \ 部分可能需要写成对象的绝对路径——为了简洁，我在这里在这里使用相对路径。让我们创建一个文件来玩玩：\n\n```bash\n$ man ln > ln.txt\n\
  $ ls ln.txt\n-rw-r----- 1 3891 Jul 18 19:47 ln.txt\n```\n\n为该文件创建一个硬链接：\n\n```bash\n\
  $ ln ln.txt hard-ln.txt\n$ ls ln.txt\nrw-r----- 2 3891 Jul 18 19:47 hard-ln.txt\n\
  rw-r----- 2 3891 Jul 18 19:47 ln.txt\n```\n\n注意 `ls -l` 输出中的第二个项现在每个文件都是 `2`——那是文件的链接数量。它们指向同一个文件的链接数是两个。我们怎么知道的？让我们使用\
  \ `ls` 命令的 `-i` 选项显示这些文件系统的 inode 节点：\n\n```bash\n$ ls -i ln.txt\n32098 -rw-r-----\
  \ 2 3891 Jul 18 19:47 hard-ln.txt\n32098 -rw-r----- 2 3891 Jul 18 19:47 ln.txt\n\
  ```\n\n相同的 inode 节点！这些文件系统对象具有不同的名称，但指向文件系统中的同一个 inode 结构——文件系统在那里存储关于如何提供该文件的元数据。\n\
  \n如果我们使用 `-s` 选项并为 `ln.txt` 创建符号链接：\n\n```bash\n$ ln -s ln.txt slnk-ln.txt\n$ ls\
  \ -i ln.txt\n32098 -rw-r----- 2 3891 Jul 18 19:47 hard-ln.txt\n32098 -rw-r-----\
  \ 2 3891 Jul 18 19:47 ln.txt\n32936 lrwxrwxrwx 1 6 Jul 18 20:07 slnk-ln.txt -> ln.txt\n\
  ```\n\n符号链接具有不同的 inode 节点。项以字符 `l`（ell）而不是连字符（`-`）开头，文件名详情指向（->）或链接到原始文件 `ln.txt`——它的名称长度为\
  \ 6 字节，由第四列的数字 `6` 反映。\n\n符号链接知道我们向指向的文件追加了日期字符串吗：\n\n如果在原始文件 `ln.txt` 的末尾追加额外的文本——例如\
  \ `date` 字符串：\n\n```bash\n$ date >> ln.txt\n$ ls -i ln.txt\n32098 -rw-r----- 2 3921\
  \ Jul 18 20:44 hard-ln.txt\n32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt\n32936 lrwxrwxrwx\
  \ 1 6 Jul 18 20:07 slnk-ln.txt -> ln.txt\n```\n\n注意原始文件和硬链接的文件大小和修改时间信息的更新。符号链接没有变化。\n\
  \n\n\n\n\n链接允许我们通过另一个名称，或者在需要时从另一个目录的条目来引用文件。\n\n我们可以根据需要对文件创建有用的链接。\n\n硬链接（hard\
  \ link）在文件系统的目录中创建一个新的命名条目，它直接指向文件系统树中已存在文件对象的 `inode`。\n\n符号链接（symbolic link）在文件系统的目录中创建一个新的命名条目，它指向文件系统树中已存在文件对象的`文件名`或`文件路径`\
  \ —— 起初这种差异似乎很微妙。\n\n如果我们重命名或移动这些链接，或者移动它们指向的原始文件，会发生什么？\n\n### 重命名硬链接和软链接：\n\n\
  ```bash\n$ mv hard-ln.txt mhard-ln.txt\n$ mv slnk-ln.txt mslnk-ln.txt\n$ ls -igo\
  \ *ln.txt\n32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt\n32098 -rw-r----- 2 3921\
  \ Jul 18 20:44 mhard-ln.txt\n32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt ->\
  \ ln.txt\n```\n\n使用 `wc -c` 检查解析后的对象大小：\n\n```bash\n$ wc -c *ln.txt\n3921 ln.txt\n\
  3921 mhard-ln.txt\n3921 mslnk-ln.txt\n11763 total\n```\n\n它们都被读取了，且大小正确。\n\n###\
  \ 如果我们重命名了原始文件呢：\n\n```bash\n$ mv ln.txt mln.txt\n$ ls -igo *ln.txt\n32098 -rw-r-----\
  \ 2 3921 Jul 18 20:44 mhard-ln.txt\n32098 -rw-r----- 2 3921 Jul 18 20:44 mln.txt\n\
  32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt -> ln.txt\n```\n\n使用 `wc -c` 检查解析后的对象大小：\n\
  \n```bash\n$ wc -c *ln.txt\n3921 mhard-ln.txt\n3921 mln.txt\nwc: mslnk-ln.txt: No\
  \ such file or directory\n7842 total\n```\n\n哎！当我们重命名符号链接指向的文件时，符号链接失效了。\n\n要修复符号链接，我们可以重新运行\
  \ `ln` 创建一个指向重命名后文件的符号链接 —— 或者将重命名后的文件移动回原来的名称\n\n```bash\n$ mv mln.txt ln.txt\n\
  $ wc -c *ln.txt\n3921 ln.txt\n3921 mhard-ln.txt\n3921 mslnk-ln.txt\n11763 total\n\
  ```\n\n符号链接是目录中的一个条目，指向在创建符号链接时存在的文件名 —— 仅此。\n\n如果该文件名存在，符号链接就是有效的。如果文件名被重命名或移动，符号链接就会失效！\n\
  \n硬链接是目录中的一个条目，指向与另一个现有文件相同的 `inode`。即使我们重命名、移动或删除原始文件，硬链接仍然指向同一个 `inode`。\n\n当指向文件\
  \ `inode` 的最后一个链接被删除时，它就不再存在了。\n\n### 为什么我们想使用符号链接？\n\n硬链接对象必须存在同一个文件存储设备中。\n\n\
  软链接（符号链接）可以跨越文件存储设备的边界 —— 它们可以指向外部存储设备上的对象名称 —— 当这些设备连接到我们的计算机使用时。\n\n### 为什么我们想使用硬链接？\n\
  \n正如我们在上面观察到的 ——指向现有文件的硬链接指向相同的 `inode`。虽然它显示出相同的文件空间大小，但这是原始文件的大小。\n\n当我们处理需要数兆或数\
  \ GB 空间的数据文件时，文件链接可能非常有意义。\n\n与其拥有该文件的两个独立副本，我们不如对真实数据文件创建一个硬链接。对文件系统的影响是在在文件系统树中多增加了一个指向现有\
  \ `inode` 的条目。\n\n它所占用的空间取决于我们文件系统使用的块大小。这可能是 2k、4k 或 8k 字节等，而不是为了存储整个文件的副本而占用数兆或数\
  \ GB。\n\n我希望这能有所帮助。\n\n# 正则表达式\n\n还有另一个灵活的过滤命令叫做 `grep` —— 这是 *global regular expression\
  \ print*（全局正则表达式打印）的缩写，这个名字有点冗长。\n\n`grep` 在文件中搜索名为“正则表达式”的`模式`。\n\n什么是正则表达式？\n\n\
  正则表达式是灵活的字符模式，可以匹配一个或多个文本字符串。\n\nUnix 的两位主要作者和设计师之一肯·汤普（Ken Thompson）被认为在 `ed` 编辑器中加入了正则表达式模式匹配搜索功能\
  \ —— 我们本可以用它来编写小型的 `td.sh` 脚本 —— 回在前几个章节。\n\n我们在 `ed`、`ex` 和 `vim` 编辑器中可以使用命令是 `g/re/p`，其中\
  \ `re` 部分是这些正则表达式之一。\n\n`g` —— *global*（全局）的缩写意味着跨越每行的整个宽度。\n\n`p` —— *print*（打印）的缩写意味着显示包含我们提供的\
  \ `re` 正则表达式匹配项的行。\n\n这就是 `grep` 过滤器的来源。\n\n正则表达式可以简单到一两个字符或一个单词 —— 也可以复杂的模式匹配字符和重复计数的组合\
  \ —— 如我们很快将看到的。\n\n## 简单的 grep\n\n如果我们想从 `PATH` 变量中提取 `games` 目录，我们可以使用 `grep` 过滤器，通过在\
  \ `bash` 历史命令管道中添加另一个部分来提取它们：\n\n```bash\n$ !1234 | sort | grep games\n/usr/games\n\
  /usr/local/games\n```\n\n这在 `sort` 命令之后添加了另一个管道符号（`|`），并将 `sort` 的输出直接交给 `grep`\
  \ 的标准输入，要求它匹配包含简单模式 `games` 的行 —— 成功。\n\n你可能记得历史命令编号 `1234` 是：\n\n```bash\n$ echo\
  \ \"$PATH\" | tr \":\" \"\\n\"\n```\n\n如果原始命令的输出很多，先添加 `grep` 命令然后将减少后的输出传递给 `sort`\
  \ 命令可能会更高效：\n\n```bash\n$ !1234 | grep games | sort\n/usr/games\n/usr/local/games\n\
  ```\n\n对于如此小的样本，这没有明显区别。\n\n你能看到 Unix 以及现在 Linux 命令中，在 `bash` shell 中通过管道组合命令的能力所拥有的力量和灵活性吗？\n\
  \n这几乎就像在玩孩子的积木。\n\n想象一下我每天是多么开心！\n\n我们可以将该管道输出重定向到新文件，或将其追加我们需要完成的现有文件的末尾。\n\n**注意：**\
  \ `bash` shell 命令模式与 `grep` 命令使用的被称为正则表达式的模式类之间有一两处细微的差异。\n\n正则表达式要灵活得多。\n\n这两者之间的思想有很多相似之处。\n\
  \n一个例外是问号（`?`）字符 —— 在 `grep` 模式中，我们使用点（`.`）字符*代替* —— 来表示*任何单个字符*。\n\n为什么？因为在 RE（正则表达式）语法中，问号（`?`）字符被用来表示前一个字符或括号内的整个正则表达式出现零或一次。\n\
  \n另一个例外是星号（`*`）字符。\n\n要在 `grep` 模式中表示任何字符的零或多次重复，我们需要使用一个点与星号配对的双字符 RE (`.*`) ——\
  \ 通过练习，我们很快就会习惯这些以及其他差异。\n\n## RE 语法\n\n`grep` 命令的 `man` 页面包含了详细描述，说明了我们如何构建正则表达式来匹配并找到我们想象的几乎任何字符字符串。\n\
  \n在 man 页面中搜索‘REGULAR EXPRESSIONS’。\n\n该章节的第二句话是：\n\n\n\n\n\n> 正则表达式的构建类似于算术表达式，通过使用各种运算符组合较小的表达式。\n\
  \n文中的第三段告诉我们：\n\n> 大多数字符（包括所有字母和数字）都是匹配其自身的正则表达式。\n\n以及：\n\n> 任何具有特殊含义的元字符都可以在其前面加一个反斜杠\
  \ `\\` 来引用。\n\n## RE 元字符\n\n> ``.'` — 点号会匹配*除* `newline`（换行）控制字符以外的任何*单个*字符。\n\n\
  > `[`’ — 开始一个由方括号 `[...]` 包围的*列表*，用于匹配*列表*中包含的*任意一个*字符。\n\n> `[abc]` — 匹配字符 `a`\
  \ 或 `b` 或 `c` 中的*某一个* —— 在某些用户 `locale` 设置下，这可能会匹配 `[aBbCc]`。\n\n> 如果*列表*的*第一个*字符是脱字符或脱符符号（*pointy-hat*）`^`，则匹配任何**不在**列表中的字符。\n\
  \n> 在方括号内部，用连字符 `-` 或破折号 分隔的一对字符将匹配一个字符*范围*。\n\n> `[m-q]` — 匹配字符 `m` 或 `n` 或 `o`\
  \ 或 `p` 或 `q` 中的任意一个。\n\n> 某些命名的字符类在括号表达式中被预定义 —— 它们的名称自言易见：\n\n> `[:alnum:]`, `[:alpha:]`,\
  \ `[:blank:]`, `[:cntrl:]`, `[:digit:]`, `[:graph:]`, `[:lower:]`, `[:print:]`,\
  \ `[:punct:]`, `[:space:]` 和 `[:xdigit:]`。\n\n> 注意，*包围*每个类名称的方括号和冒号字符 `[:` 和 `:]`\
  \ 是符号名称的一部分，除了列表表达式的外部括号外，这些**必须**也被包含进去。\n\n> 大多数*元字符*在*列表*的括号内部都会失去它们的特殊含义。\n\n\
  > 要匹配字面量 `]`，请将其放在*列表*中的*第一个*字符。\n\n> 要匹配脱字符（或 *pointy hat*）字符，请将其放在*列表*中除（第一个）字符以外的任何位置。\n\
  \n> 要匹配字面量连字符或破折号 `-`，请将其放在*列表*的*最后*。\n\n> **注意：** 如果我们需要限制*列表*，使其仅包含我们在*列表*中输入的那些字符，可以将一个名为\
  \ `LC_ALL` 的环境变量设置为*值* `C`：\n\n\n\n```bash\n$ export LC_ALL=\"C\"\n$ grep '[bcd]'\
  \ note.txt\n...\n```\n\n> 我们可以尝试定义自己的 `alias` 命令：\n\n```bash\n$ type grc\nbash:\
  \ type: grc: not found\n$ alias grc='export LC_ALL=\"C\" ; grep'\n$ grc '[bcd]'\
  \ note.txt\n...\n```\n\n这起作用吗？\n\n`export` 命令定义 `LC_ALL` 变量的方式，使其能够在交互式 bash shell\
  \ 和新的非登录式命令 shell 中持续可见。请记住 —— 我们在命令行上运行的每个 Linux 命令都会启动其中一个 shell —— 随后 `grep`\
  \ 命令将在一个环境变量 `LC_ALL` 设置为 `C` 的 bash shell 中运行。\n\n> **注意：** 你的 `locale` 可能与我的不同，你可能不需要使用这种*黑技巧*来让\
  \ `grep` 命令以你偏好的方式运行。\n\n## RE 锚定\n\n脱字符或脱符符号（*pointy-hat*）`^` 和美元符号 `$` 是*元字符*，分别匹配*行*的开头（`^`）和结尾（`$`）的空字符串。\n\
  \n**侧记：** 这两个符号*也*被用于 `vim` 编辑器，将*光标*移动到*行*的开头（`^`）和结尾（`$`） —— 是一种单键智能光标移动。\n\n\
  两个字符符号 `\\<` 和 `\\>` 分别匹配*单词*开头和结尾的空字符串。\n\n更多的*元字符*对被定义用于匹配其他特殊情况。\n\n更多细节请参见 `man\
  \ grep`。\n\n假设我们在主目录下仍然有一个名为 `td.sh` 的小型 shell 脚本副本：\n\n```bash\n$ cd\n$ grep '^echo$'\
  \ td.sh\necho\necho\n$\n```\n\n这限制了 `grep` 命令只向我们显示除 `echo` 单词之外没有其他内容的行。对于这个小脚本来说没什么大碍。\n\
  \n如果其中一个 `echo` 单词后面有一个尾随空格，那么这个 `grep` 命令将显示一行而不是两行。\n\n同样的命令可以在瞬间遍历一个包含数百行甚至数千行的文件。\n\
  \n## RE 重复\n\n正则表达式后面可以紧跟一个重复运算符。这些运算符是：\n\n> `?` — 匹配前面 RE 的*零次或一次*。\n\n> `*` —\
  \ 匹配前面 RE 的*零次或多次*。\n\n> `+` — 匹配前面 RE 的*一次或多次*。\n\n> `{n}` — 精确匹配前面的 RE 恰好 *n*\
  \ 次。\n\n> `{n,}` — 匹配前面的 RE *n* 次或更多次。\n\n> `{,m}` — 匹配前面的 RE 最多 *m* 次。\n\n> `{n,m}`\
  \ — 匹配前面的 RE *至少* *n* 次且*不于* `m` 次。\n\n其他的 RE 操作和运算符还涵盖了 RE 拼接、RE 逻辑或、RE 优先级以及括号子表达式中的\
  \ RE 回引用。这是一个强大的信息处理计算概念。\n\n学习使用*正则表达式* —— 它们将大有益处。\n\n细节请参见 `man grep`。\n\n我们可以在其他程序中使用\
  \ RE，例如 `vim` 编辑器、强大的流编辑器 `sed` 以及 `less` 分页器。\n\n\n\n\n第 6 到 8 行使用 `for` 循环访问 `@wrds`\
  \ 列表或数组中的每个值 —— 将其逐个存入 Perl 特殊变量 `$_`。\n\n第 7 行将 `$_` 中的值作为新名为 `%count` 的 `associative`\
  \ 关联数组（或 `hash`）的 `index`，并对 `@wrds` 列表/数组中的每个 `word` 递增（`++`）该数组元素 `$count{$_}`\
  \ 的值。\n\n最后三行由另一个 `for` 循环组成，用于访问在第 6 到 8 行中构建的整个 `%count` 关联数组（或 `hash`）的排序后的 `keys`\
  \ 或 `indices`。\n\n第 11 行显示此 `for` 循环的 Perl 特殊变量 `$_` 的值，以及哈希元素中相关索引项的值（`$count{$_}`）。\n\
  \n在我的小型 脚本 `td.sh` 上运行它：\n\n```bash\n$ ./count.pl td.sh\n\"              1\"\n\"\
  Today            1\"\n\"#!/usr/bin/bash      1\"\n\"%F\"             1\"\n+\"%A\
  \             1\"\n\"date              1\"\n\"echo              2\"\n\"is      \
  \          1\"\n\"printf            1\"\n```\n\n这里看到的没什么令人兴奋的 —— 除了 `echo` 的计数为\
  \ `2`。\n\n该脚本用于从命令行指定的文件或 `redirected` 输入中计算空格分隔的 `words`。\n\n该脚本还可以从 `pipeline`\
  \ 或重定向（`<`）的输入文件或命令替换输出中获取输入 —— 这这一切归功于 Perl 的 `(<>)` `diamond` 运算符。\n\n这个小型脚本对\
  \ `word` 的定义是任何非空白字符字符串 —— 这并不总是很有帮助。该脚本可以扩展，以将标点符号字符视为单词分隔符。\n\nPerl 的文档被分为几十部分。请查看\
  \ `man perl` 和 `man perldoc` 获取更多阅读。要了解 Perl 的特殊变量 `$_`，你可以运行：\n\n```bash\n$ perldoc\
  \ -v $_$ perldata\n```\n\n# 更多 Linux 命令\n\nLinux 系统提供了数百个命令，来帮助我们完成想象的任何任务。虽然其中任何一个命令都无法完成我们脑海中的所有工作\
  \ —— 但我们看到有很多方法组合这些命令来产生有用结果。\n\n## 过滤器 head & tail\n\n如果我们需要处理大型文本文件，那么像 `head`\
  \ 和 `tail` 命令这样的工具就可以帮助我们处理这些文件的选部分。尽管我们最终想处理整个文本数据 —— 但通常可以提取文件的样本来帮助测试 shell 脚本或其他程序。\n\
  \n假设我们有一个包含两个三百行 —— 或数千行的文件。我们可以使用 `head` 命令来查看该文件的前二十行：\n\n```bash\n$ head -20\
  \ big-file.txt\n```\n\n要获取第二组二十行，我们可以运行：\n\n```bash\n$ head -40 big-file.txt | tail\
  \ -20\n```\n\n我们可以对第三组、第四组和第六组二十行运行类似的命令。我们可以将这些文件段重定向到系列名为 `t1.txt`、`t2.txt`、`t3.txt`\
  \ 等的测试文件中：\n\n```bash\n$ head -20 big-file.txt > t1.txt\n$ head -40 big-file.txt\
  \ | tail -20 > t2.txt\n$ head -60 big-file.txt | tail -20 > t3.txt\n```\n\n当我们在\
  \ `bash` 命令的交互行末尾添加反斜杠符号作为`last`字符并按回车键时，`bash` shell 会换到下一行并插入大于符号（`>`），以提示并提醒它正在等待我们的更多输入。\n\
  \n**注意：** 我们必须在这些行尾的反斜杠后不添加任何空格以使其生效 —— 否则 `bash` shell 在发出下一个提示之前会用“No such file\
  \ or directory”的错误信息向我们抱怨。反斜杠后跟着空格看起来像是一个以单个空格命名的文件 —— 我们用反斜杠进行了引用。糟糕！\n\n## 过滤器\
  \ cmp & diff\n\n我们可以使用 `cmp` 命令（`compare` 的缩写）和 `diff` 命令（`differences` 的缩写）来确保我们不会反复使用相同的测试数据。\n\
  \n如果两个文件相同，`cmp` 命令将没有任何输出 —— 记住，`no news` 就是 `good news` —— 成功 —— 没有差异。\n\n如果文件在任何方面存在差异，`cmp`\
  \ 将在发现的差异点处提示：\n\n```bash\n$ cmp t1.txt t2.txt\nt1.txt t2.txt differ: byte 1, line\
  \ 1\n```\n\n我们可以使用 `diff` 命令更详细地显示差异：\n\n```bash\n$ diff t1.txt t2.txt | less\n\
  ...\n...\n```\n\n查看 `man diff` 以了解 `diff` 输出的解释。\n\n## 过滤器 tac & rev\n\n`tac`（反向\
  \ `cat`）和 `rev`（反转 `line` 中的字符）过滤器是不寻常工具工具有时可以使用。\n\n在第 7 章中，我们使用两个 `echo` 命令写入一行，然后将另一行追加到我称为\
  \ `out.txt` 的小文件中：\n\n```bash\n$ echo \"first out\" > out.txt\n$ echo \"next out\"\
  \ >> out.txt\n$ cat out.txt\nfirst out\nnext out\n```\n\n使用 `tac` 将反转行的顺序。在 `out.txt`\
  \ 上运行 `tac` 命令的结果如下：\n\n```bash\n$ tac out.txt\nnext out\nfirst out\n```\n\n使用 `rev`\
  \ 将反转每行文本字符的顺序。在 `out.txt` 上运行 `rev` 命令的结果如下：\n\n```bash\n$ rev out.txt\ntuo tsrif\n\
  tuo txen\n```\n\n这些命令没有改变文件 `out.txt` 的内容：\n\n```bash\n$ cat out.txt\nfirst out\n\
  next out\n```\n\n我们可以使用 `out.txt` 或任何其他纯文本文件来说 `tac` 和 `rev` 过滤器是如何工作的：\n\n```bash\n\
  $ tac out.txt | rev | tac | rev > out.trtr\n$ ls -go out.txt out.trtr\n-rw-r-----\
  \ 1 19 Jun 27 16:14 out.trtr\n-rw-r----- 1 19 Jun 27 16:01 out.txt\n```\n\n运行并重复这些命令\
  \ —— 以任何顺序都应该重现原始。输出文件的大小相同 —— 这是一个良好的开始。\n\n```bash\n$ cmp out.txt out.trtr\n```\n\
  \n\n\n\n我们所做的只需在*光标*所在的行上进行必要的编辑——然后从编辑器中*退出*。\n\n在 `vim` 中，我会使用*末尾行*命令 `:wq` ——\
  \ 这是 *write*（写入）和 *quit*（退出）的缩写——或者使用*简写* `{Shift}+{Z}+{Z}`。\n\n`for-do-done` 循环会移动到\
  \ `$lno` 参数的下一个*值*（该参数是从命令替换部分 `$(tac ed-lns.txt)` 获取的），并重新运行编辑器。\n\n我们可以编写一个脚本来自动化这个过程。\n\
  \n这就是我倾向于在 Terminal 窗口和标签页的命令行中运行编辑器的原因之一——而不是从一个*图标*上启动带有 `File` 菜单等的 GUI `Editor`\
  \ 窗口。\n\n这种方法对我来说很管用。\n\n当我们在特殊情况下需要考虑反向排序顺序时，使用 `rev` 过滤器就可以派上用场。\n\n## 自动报告\n\n\
  流编辑器 `sed` 帮助我们对文本进行实时修改。\n\n我们为什么想这样做呢？\n\n之前我们使用 `tr` (*translate*，翻译）命令将 `PATH`\
  \ 变量中目录路径之间的冒号 (`:`) 字符转换为*换行*字符，以便每个路径显示在单独的一行。\n\n这对于让我们所需的列表更易读非常有用。\n\n通过使用\
  \ `sed`，我们可以利用 REs (*regular expressions*，正则表达式) 来定位输入流（来自文件或管道）中的字符、单词或短语，并进行转换、修改、删除或扩展文本，使其更易读/易理解——几乎以我们想要的任何方式。\n\
  \n假设我们有一个小型模板文件，用于帮助报告我们对 shell 脚本和其他程序进行的测试程序的结果，这些程序随后将部署供更广泛的使用。\n\n管理层要求我们提供保证报告以显示产品测试结果，并在我们发布更新产品供通用使用并交付给其他用户和毫无准备的客户*之前*，标记任何潜在的问题和错误。\n\
  \n产品可能需要发回开发者进行进一步的分析和修复工作！\n\n测试分析师使用自动化测试平台来执行测试用例，并对每个代码测试用例报告通过或失败。\n\n我们如何获取这些产品测试结果，并根据需要自动为管理层补全一份报告呢？\n\
  \n假设测试过程输出了这样的简短信息：\n\n```\n01:cmd no opts/args:pass\n02:cmd line bad opts:pass\n\
  03:cmd line good opts:pass\n04:cmd line bad args:pass\n05:cmd line good args:pass\n\
  06:cmd idat bad:pass\n07:cmd odat bad vals:pass\n08:cmd odat bad errs:fail\n09:cmd\
  \ idat good:pass\n10:cmd odat good vals:pass\n11:cmd odat good errs:pass\n```\n\n\
  我们想要读取测试过程输出的每行数据，并使用冒号分隔的字段值来帮助为管理层生成更易读的文档。\n\n## 流编辑器 sed\n\n*流*编辑器 `sed` 命令包含一个*搜索并替换*指令，可以这样组合并使用：\n\
  \n```bash\n$ sed -e 's/RE/text/g' file.txt\n```\n\n`sed` 命令可以处理多个此类*编辑*指令，我发现一种方便的方法是在文件名前之前添加一个反斜杠字符并按\
  \ `Enter` 键，以换行并在后续行包含更多的编辑部分：\n\n```bash\n$ sed -e 's/RE/text/g' \\\n      -e 's/RE/text/g'\
  \ \\\n      -e 's/RE/text/g' file.txt\n```\n\n`sed` 命令对其输入进行一次扫描——一次一行，并依次执行每一个\
  \ `-e` 编辑命令。\n\n\n\n\n\n`sort` 命令提供的两个选项是 `-t {SEP}`，用于使用 `SEP` —— 即使用点（`.`）作为字段分隔符（而不是纯文本中通常使用的空白格），然后是\
  \ `-k {KEY}`，我们可以在这里指定第 2 个键值。\n\n鉴于我的文件名几乎总是包含一个单独的点（`.`）—— 紧邻文件类型后缀之前，我预计从 `ls\
  \ -1` 命令输出的每行中，第二个由点分隔的字段是文件类型字符（如 `c`）或字符串（如 `txt`）。\n\n可以使用更复杂的排序键（sort keys）！\n\
  \n请查看 `man sort` 并搜索“/KEYDEF”。\n\n如果文件名包含多个点 —— 我们可以选择使用一些 AWK 代码将最后一个（`file` `type`）字段移动到每行的第一个字段，然后在不带选项的情况下调用\
  \ `sort`，最后跟一段额外的 AWK 代码来恢复文件类型后缀字符串的位置。\n\n# 共享文件访问\n\n当我们在具有多个用户的 Linux 计算机上工作时，我们会发现有时需要对文件进行共享访问。\n\
  \n实现此点的一种方法是更改第三组 `rwx` 文件权限位，以为所有其他人提供必要的访问权限。\n\n这通常不是最好的主意。\n\n我们可能在一个研究小组中工作，需要与小组内的其他人共享中间结果。让所有其他用户对未完成的报告和/或初步分析细节等拥有开放权限是不恰当的。\n\
  \n我们能做什么呢？\n\n文件拥有所有者（`user`）和组（`group`）名称标识，我们可以通过运行 `ls -l` 命令看到它们。\n\n我们可以使用另一个名为\
  \ `chgrp` 的命令 —— `change group`（更改组）的缩写，用于更改拥有的文件或目录的组标识符。\n\n我们选择的组需要预先存在。\n\n\
  假设我们想使用组标识 `res` —— `research`（研究）的缩写。\n\n我们可以通过 `grep` 命令搜索 `/etc/group` 文件来检查该组是否存在\
  \ —— 组标识符及其一个或多个成员列表就存储在这里：\n\n```\n$ grep ’^res:’ /etc/group\n```\n\n我们搜索以组名 `res`\
  \ 开头（`^`）并紧跟冒号（`:`）字符的行。\n\n没有输出意味着组 `res` 尚未存在 —— 我们需要创建它。\n\n有一个名为 `addgroup`\
  \ 的管理员命令来创建一个新的组标识。要创建一个名为 `res` 的新组 —— 我们需要运行 —— 或要求系统管理员运行（如果不是我们的话）：\n\n```\n\
  $ sudo addgroup res\n```\n\n还有另一个名为 `adduser` 的管理员命令可以帮助我们将现有用户添加到新组。要将用户 `clu`\
  \ 添加到该新组，我们可以运行：\n\n```\n$ sudo adduser clu res\n```\n\n我们可以运行该命令将其他用户添加到 `res`\
  \ 组。\n\n在大型多用户系统上，我们可能需要经过正式的申请流程 —— 获得管理层的批准等。\n\n这些用户需要注销并重新登录，才能通过 `id` 或 `groups`\
  \ 命令看到他们新组成员身份的报告。\n\n我们拥有的任何需要访问且被限制为我们自己和 `res` 组成员的文件，都需要通过运行该 `chgrp` 命令将其组标识更改为\
  \ `res`：\n\n```\n$ chgrp res prelim-results.txt\n```\n\n我们需要运行的最终命令将涉及更改组（`g`）的权限位，以添加（`+`）读（`r`）访问位，并从所有其他人处移除（`-`）所有权限：\n\
  \n```\n$ chmod g+r prelim-results.txt\n$ chmod o-o prelim-results.txt\n```\n\n为了让\
  \ `res` 组可以使用文件，我们可能需要更改 `$HOME` 目录以及任何子目录的组所有权，以便组员需要访问这些目录来搜索组访问权限的文件。\n\n另一种方法是在\
  \ Linux 文件系统的其他部分创建一个特殊的 `res` 目录 —— 或者创建一个名为 `res` 的新用户，并使用他们的 `$HOME` 目录区域作为 `res`\
  \ 组的文件区域。\n\n假设我们在 `$HOME` 目录中创建一个 `res` 目录，用于存储 `res` 组有权访问：\n\n```\n$ cd\n$ mkdir\
  \ res\n```\n\n我们拥有该目录，并默认在那里拥有读、写和执行权限 —— 这使我们能够复制、编辑、移动和删除文件。\n\n接下来我们运行 `chgrp`\
  \ 命令更改 `~`（我们的 `$HOME` 目录）和新 `res` 目录的组标识：\n\n```\n$ chgrp res ~ res\n```\n\n然后我们使用\
  \ `chmod` 为 `res` 组允许读和执行权限：\n\n```\n$ chmod g+rx ~ res\n```\n\n注意：对于目录，执行权限意味着我们有权搜索（或列出内容）目录以显示其他文件系统对象\
  \ ——如果有。\n\n接下来我们将 `prelim-results.txt` 文件移动到 `res` 目录：\n\n```\n$ mv prelim-results.txt\
  \ res\n```\n\n`res` 组的其他成员现在应该可以获得读取该文件所需的访问权限。\n\n不授予 `res` 组写权限意味着那些组成员没有权限在其中进行任何更改。\n\
  \n基本上 —— 在没有我们许可的情况下，他们可以查看文件（s），但没有权限触碰（或修改）文件（s）。\n\n**警告：** 共享组中可以读取文件的成员也可以获取该文件的副本\
  \ —— 他们将成为该副本的所有者，并可以根据意愿对其进行处理！\n\n这种访问方法依赖于很大程度的信任。如果我们不能信任与我们生活和/或工作的人 —— 我们就会陷入进退两难。\n\
  \n为什么人们看不到必要的信任水平、责任感和诚信的原因呢？\n\n他们是否理解自己有责任将小组通信留在必要的特权共享访问水平上？\n\n只需要一个不可信的人就能破坏我们的信任。恢复我们的信任需要巨大的努力\
  \ —— 如果真的能恢复的话。\n\n建立一个更安全的系统需要巨大的努力 —— 有时我们需要设置组进程来控制访问，并限制用户可以获取的权限。\n\n更多细节请参见\
  \ `man sg` 和 `man newgrp`。\n\n我们可以使用这些技术在适当的情况下为个人 PC 上的其他成员授予共享访问 —— 给予他们读取权限。\n\
  \n例如他们可能想访问我们的照片文件 —— 或者你正在写的回忆录，以及任何你选择的内容。\n\n\n\n\n我修改后的文件会通过 `git add` 过程，使其成为暂存项，准备提交到\
  \ `git` 数据库。\n\n接下来，会运行 `git commit` 过程，将我暂存的更新存入我在这些位置（`src/...`）中维护的 `.git` 仓库中。\n\
  \n`git` 的初始概念和设计是由 Linus Torvalds 在开发和协调 Linux 内核系统的增强时发起的 —— 这是一个需要不断更新的复杂软件，因此需要跟踪成百上千次更改的能力。\n\
  \n如果需要，`git` 仓库可以维护并行的开发分支，并在适当的开发、测试以及任何冲突解决并获得我们的批准后，将这些分支合并——这是一个非常强大的版本控制系统。\n\
  \n更多详情请参阅 `man git` ——那里有大量的文档可以阅读。参阅 `man gittutorial` 可以入门。\n\n现在我预计这听起来工作量很大。好处是，这些步骤中的大部分都封装在我自己的开发和发布脚本以及\
  \ `aliases`（别名）中。\n\n我在适当的时间运行一个 `script` 或 `alias`，以触发我想在指定文件上执行的操作或多个操作。\n\n遵循这种程序有助于我控制自己正在做什么以及已经完成了什么\
  \ ——帮助我看到哪些是有用的，哪些需要更多工作。\n\n根据最后统计，我的 `$HOME/bin` 目录下有 500 多个由我编写和开发的脚本 —— 自从 1994\
  \ 年开始使用 Linux 以来。\n\n这相当于大约每月有一个（1）个新脚本 —— 还有很多工作在进行，而且时间充裕。\n\n如果没有多年来开发和完善我的软件处理程序，我无法做到这些。我起步缓慢，并随着时间的推移建立了微小的改进。\n\
  \n我用所有这些脚本做什么呢？\n\n老实说，我预计这些脚本大部分已经过了它们的用途期限。我的需求可能每周都会发生变化，而编写一段新的小型 `bash` 脚本代码几乎可以在瞬间提供解决方案。\n\
  \n有少数脚本是在第一或第二年开始开发的 —— 即使现在，我几乎每天都会使用它们。\n\n对我来说，这是最令人鼓舞的。我知道我在编写 shell 脚本上付出的少许努力可以在未来几年里带来回报。\n\
  \n这些 shell 脚本继续按照我编写它们的方式运行 —— 尽管我的 Linux 系统已经经历了 22 多次重大更新。\n\n大多数更新都是以增量方式发生的，对我（Linux\
  \ 用户）来说的影响微乎其微。最坏的情况下每隔几天或几周花一两分钟 —— 除非我选择升级到最新的 LTS 版本，如果有需要的话。\n\n我保留了一些 shell\
  \ 脚本的代码片段或片段来帮助我编写其他脚本。例如，有一个名为 `start.sh` 的主脚本，它可以帮助我使用我偏好的框架开始编写几乎任何新的 shell 脚本。\n\
  \n如果一个 shell 脚本需要执行大量工作，并需要为用户提供一个以上的选项，我将使用那个 `start.sh` 脚本，因为它包含了使用我偏好的 `getopt`\
  \ 过程（而不是 `getopts`）来处理命令行选项的代码，并使用我信任了多年的 `bash` shell `while-do-done` 循环方法来处理命令行参数列表。\n\
  \n如果我发现自己自己在看几年前写的一个 shell 脚本，我会有其他的代码片段可以被读取到旧脚本中，帮助我将其更新为使用我最新的编码标准，并使用我随时间推移不断尝试改进更好的代码块。\n\
  \n在 Linux 中，有一个聪明的工具叫做 `shellcheck` —— 这是一个用于 sh/bash 脚本的静态分析和检查工具。\n\n我们可以在我们的脚本上运行\
  \ `shellcheck` 并遵循它给建议：\n\n```\n$ shellcheck td.sh\n```\n\n记住，没有消息就是好消息！\n\n我使用\
  \ `shellcheck` 来帮助我的 shell 脚本内容符合它提供的大多数建议 —— 除非我有充分理由使用对这些准则的任何个人变体。\n\n例如，在交互式脚本中，当我显示了想要他们阅读的信息后，需要提示用户按\
  \ `Enter` 键继续时 —— 我可以：\n\n```bash\nprintf \"Press the Enter key to continue: \"\n\
  # shellcheck disable=SC2034\nread -er Resp\n```\n\n如果没有 `# shellcheck disable=SC2034`\
  \ 注释行，`shellcheck` 程序将永远抱怨我在 `read` 命令中使用了未引用的变量 `Resp`。\n\n我所有的脚本需要的 —— 从用户处获取一个\
  \ `Enter` 键响应。\n\n阅读 `man bash`，`read` 命令可以在没有像 `Resp` 变量的情况下调用 —— 在那种情况下，用户的响应被赋值给名为\
  \ `REPLY` 的变量。\n\n我使用变量 `Resp` 是因为在某些情况下我想利用用户的响应 —— 当我要求用户从某个选择中指定一个时，我可以提示他们：\n\
  \n```bash\nprintf \"Continue (Y)es or (N)o?\"\nread -er Resp\ncase \"$Resp\" in\n\
  \    [Yy]*) ;;\n    [Nn]*) exit 0 ;;\n    ) exit 9 ;;\nesac\n```\n\n我并不总是想将该变量用于帮助我的脚本等待用户响应以外的任何事情，这是我的选择！\n\
  \n知道我可以在选择时帮助 `shellcheck` 程序忽略这一点，这很好。\n\n我非常高兴原始的 Bourne Shell (`sh`) 现在现在的 Bourne-again\
  \ Shell (`bash`) 如此富有表现力，并且能够通过循环结构以及变量和文件处理功能来执行必要的条件逻辑测试，让程序员的生活变得更加高效。\n\nshell\
  \ 脚本并不是所有问题的答案 —— 有时我们需要使用更强大的解决方案。shell 脚本在强大的 Linux 内核提供的计算能力层与文件系统、进程这两个重要设计概念之间处于完美的平衡。\n\
  \n在 Linux 中，文件就是文件 —— 内容并并不重要。\n\n我们使用相同的 `ls`、`cp` 和 `mv` 等工具程序来处理音乐文件、PDF 文件和纯文本文件，而不需要太担心文件\
  \ —— 除非我们要听音乐、打印或显示 PDF 文件，或者拆解并重组可以是信件、备忘录或 shell 脚本的纯文本文件……\n\n强大的 Linux 系统为我们提供了数千\
  \ —— 是，数千资源，我们可以下载并使用它们处理我们可以想象的几乎每数据类型和内容。\n\n`Software Manager` 工具帮助我们在 Linux\
  \ PC 上安装新应用程序 —— 虽然我发现这个 GUI 程序比其他方法更难用。\n\n我的大脑无法很好处理大量的图标！\n\n多年来，我一直使用 `synaptic`（另一个\
  \ GUI）包管理器来帮助我的 Linux PC 查找并安装额外的软件。\n\n无论是播放音乐、管理 SQL 数据库、帮助我编程或写作或将数据从一种格式转换为另一种格式的应用程序\
  \ —— `synaptic` 都能轻松让我找到我需要的内容。\n\n例如 `ImageMagick` 命令行工具套件如 `convert` 可以帮助转换位图图像格式，并对图像进行*调整大小*、*模糊*、*裁剪*、*去噪*和*抖动*\
  \ ——\n\n或者 GUI `audacity` 程序帮助我编辑录制音乐的波形文件 (`*.wav`)。\n\n或者一个名为 `cmus` 的命令行程序帮助我从收藏的喜爱的歌曲和器乐曲中播放其他音乐\
  \ —— 有一个 `cmus-tutorial` 可以帮助我们在几分钟内入门。\n\n\n\n\n有一些如 `apt`、`apt-get` 和 `dpkg` 这样的命令行程序，可以帮助我们安装新软件并更新系统中已安装的软件包。这些程序中的每一个都有自己的\
  \ `man` 页面。\n\n`synaptic` GUI 是 `apt` 软件包管理系统的前端。\n\n在我上次检查时，我们可以通过 `synaptic` 软件包管理器选择并安装程序和实用工具的软件包类别包含以下\
  \ 55 项：\n\n> `业余无线电` 和 `通信` 和 `跨平台` 和 `数据库` 和 `调试` 和 `开发` 和 `文档` 和 `编辑器` 和 `教育`\
  \ 和 `电子` 和 `电子邮件` 和 `嵌入式设备` 和 `字体` 和 `游戏娱乐` 和 `GNOME` 和 `GNU R` 和 `Gnustep Desktop`\
  \ 和 `Go 编程` 和 `图形` 和 `Haskell 编程` 和 `国际化` 和 `解释型计算机语言` 和 `JAVA 编程` 和 `JavaScript\
  \ 编程` 和 `KDE 桌面` 和 `内核与模块` 和 `库` 和 `Lisp 编程` 和 `本地化` 和 `数学` 和 `元包` 和 `杂项` 和 `Mono/CLI\
  \ 基础设施` 和 `多媒体` 和 `网络` 和 `新闻组` 和 `OCaml 编程` 和 `Perl 编程` 和 `PHP 编程` 和 `Python 编程`\
  \ 和 `Ruby 编程` 和 `Rust 编程` 和 `科学` 和 `Shell` 和 `系统管理` 和 `TeX 设计` 和 `文本处理` 和 `实用工具`\
  \ 和 `版本控制系统` 和 `视频软件` 和 `Web 服务器` 和 `文字处理` 和 `万维网` 和 `Xfce 桌面` 和 `Zope/Plone 环境`。\n\
  \n其中应该会有我们我们大多数人感兴趣的内容。\n\n## 清晰的视野\n在 Linux 中，很少会出现陷入无路可走之困境的情况。我们可能需要阅读 `man`\
  \ 页面的其他部分，或者调试一小段 `bash` 脚本代码来帮助我们进展——这不会花费长时间。\n\n通过练习，我们会变得更擅长。取得进展时，我们的智力会得到刺激性的奖励——这很有趣。\n\
  \n对我来说，最重要的记忆之一是编写充分的文档，描述我为什么选择某条路径而非另一条路径，或者促使我选择这种方法而非可能追求的其他方法的催化剂是什么。\n\n我们不可避免地需要回到自己编写的代码片段来解决类似的问题，或者构建一个具有更多功能和增强的更大、更好的产品——我们需要访问准确且最新的文档，来描述那些我们发现难以解决或完成的部分。\n\
  \n我尝试在代码中加入大量的注释。\n\n这些注释不会减慢我们代码的执行速度。当 `bash` shell 解释器看到哈希符号（##）时，它会自动跳过行的剩余部分——这是一项快速操作。\n\
  \n在第一列（1）或在空白缩进后的第一个项目处开始注释，有助于提高我们的可读性，并帮助 `bash` shell 判断“发现哈希符号”——“跳到下一行！”。\n\
  \n不要指望别人在没有关于动机或巩固我们选择某一流程或程序的理由的几点提示的情况下，就能弄明白我们`为什么这么做`那些事情。\n\n如果我们需要回来重新审视自己的代码——如果我们留下了有用的注释来描述更多细节，我们会感谢自己——比如那些变量名是什么意思？\n\
  \n在补充我们不断增长的资源列表（别名、shell 脚本或应用程序）的同时，我们可以访问数以千计可以安装在 Linux PC 上的软件包和软件。\n\n如果我们不喜欢安装的内容——我们随时可以运行\
  \ `un-install` 过程。\n\n如果可用的 Linux 软件包列表不足——我们可以从全球开源软件开发者那里获得更多资源。\n\n使用特定的关键词进行简短的互联网搜索可以在几刻产生更多可调查的选项。\n\
  \n我们仍然需要遵循互联网安全准则，并避免点击不安全的网页链接——这是常识。\n\n在我于世界级气候研究小组工作期间，我们需要下载并分析海量（TB 级）的 `netCDF`\
  \ 数据文件，并使用如 `cdo`——来自马克斯·普朗克气象研究所的气候数据运算符等工具，帮助我们的科学家理解他们对世界其他气象站几十种不同天气模型数据的比较。\n\
  \nLinux 不仅胜任在数百个计算节点（每个节点拥有数十个 CPU 核心）的超级计算机上运行复杂计算分析的首选操作系统，更是绰绰有余。\n\n对我来说，Linux\
  \ 代表我用过的最好的计算机系统。\n\n在我的个人电脑上运行 Linux 为我提供了超出我计算需求的非凡功能——因为为我提供了一个近乎无尽的命令、实用工具和应用程序箱，我可以用它们解决我对信息处理的需求。\n\
  \n使用 Linux 永远不是一项任务——而是一种享受。\n\n## 使用片段\n我提到过使用 shell 脚本代码片段，以及 Perl、Python 和 R\
  \ 等其他解释型语言的代码。\n\n当我需要开始一个新脚本时——我通常会使用命名为 `start.{pl,py,R,sh,tcl}` 的`启动`文件之一。\n\n\
  如果我每次都从零开始，将会开发时间增加几个小时或更多。这些小项目需要周全的设计和构造考量。\n\n我坚信在任何可以使用的地方使用`片段`——它并不局限于编程。例如，如果我们需要构建一封格式信、备忘录、常规报告或其他许多文档，其中一个版本与下一个版本看起来`相似`——只需更新日期和时间、不同的姓名和地址详情、不同的参数和值——这些都是使用`片段`的理想候选者。\n\
  \n备忘录需要一个包含`发送者`和`接收者`信息的页眉——加上当前日期和或时间信息。它需要备忘录的正文——以及所需的其他组成部分。这些每一个部分都可以被视为一个`片段`，并由用我们喜欢的脚本语言编写的`构建`脚本来处理。\n\
  \n一两小时的工作可以帮助我们编写一个 shell 脚本来组装格式信或备忘录，这可能需要发送给几十、数百或数千个接收者。在测试和修复任何错误之后——到当天结束时，你就得到一些有用的东西。\n\
  \n生成的 shell 脚本通常随着时间、使用以及未来任务要求的更改或扩展而需要更多调整。当文档正文在下个月、下周或明天更改时，我们可以替换更新后的正文并重新运行构建脚本来生成下一个文档——发送出去。\n\
  \n系统的其他部分通常需要维护数据库，以删除旧联系人并添加新联系人详情等。数据库可以是简单的纯文本文件，也可以是复杂的 SQL 或专门的数据库系统。\n\n管理层需要一个审批流程——针对项目以及相关的打印、快递和递送调度以及其他必要的控制和管理功能。\n\
  \n无论我的工作涉及什么——代码和文本片段通常让我的生活变得更容易。\n\n在空闲时间，我想尝试使用片段来帮助我构建更多的 Lilypond 音乐谱文件，以帮助我的音乐。\n\
  \n又是一个适合雨天做的项目！\n\n\n\n\n利用 `process` I/O 重定向以及构建进程管道的能力，来扩展和自定义我的 shell 脚本可以执行的处理链——这赋予了我一种在我尝试过的任何其他计算机系统中都难以实现或几乎无法实现的能力。\n\
  \n学会驾驭 `RE`（正则表达式）的力量将在遥未来带来丰厚的回报——每当这些技术为另一个问题提供答案时，我总是感到非常欣喜。\n\n运用我讨论过的几种方法，可以为一个苦于无法按时完成期限和目标的项目或业务带来翻天覆地的变化。\n\
  \n释放人力资源以专注于需要人类交互的棘手问题，对我来说是有意义的。\n\n自动化重复的过程对我来说是有意义的。\n\n利用可用的计算机资源对我来说是有意义的。\n\
  \n是的——这也需要人力。\n\nLinux 丰富的标准 `commands` 和工具工具箱，可以帮助编写自定义的 `scripts` 和易于输入的 `aliases`，对我来说是有意义的。\n\
  \n从缓慢开始，在我们学习和吸收关于 Linux 灵活性和能力的过程中不断建立能力，对我来说是有意义的。\n\n在我们意识到自己已经积累了大量知识，这些知识将帮助我们更轻松地处理信息处理任务之前\n\
  \n当我们遇到障碍时，我们有 `man` 页面、`info` 页面、`tutorial` 程序和在线文档，可以针对几乎每种需求寻求帮助。\n\n我们在 Linux\
  \ 中认为任何 `unfriendly` 的东西，随着我们开始依赖这些 `trustworthy`——`work together`——软件工具所提供的力量和重复性，很快就会变得比朋友还要亲近。\n\
  \n如果我们能在短时间内学会关于 Linux 的所有知识，我们会发现自己会厌倦它无法支持我们的需求。\n\n相反，我已经在学习和学习 Linux 几十年了，我从未对发现新功能以及学习它如何持续帮助我的更多方法而感到厌倦。\n\
