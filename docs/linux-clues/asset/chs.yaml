- "# Linux 线索\n\n\n\n\n版权所有 (C) 2025 Lawson Hanson\n保留所有权利。\n\nISBN: 9781764057882\n\
  \n# 从何开始？\n\n就像我们现在在商业产品和开源产品上读到的警告一样——本作品不提供任何形式的保证，也不应被解释为适用于任何特定目的。\n\n尽管如此——你可以假设作者从他所撰描述的这些信息碎片中，获得了许多令人愉悦的体验和个人乐趣。\n\
  \n我使用 Linux 已经三十（3）年了，并且不使用任何其他广泛使用的商业个人电脑操作系统。\n\n我疯了吗？我不这么认为。与众不同吗？是的，毫无疑问。\n\n\
  我在这里写的内容本质上是一个`Linux 用户`的视角，需要你通过自己的价值筛子进行过滤。\n\n某些内容可能对你来说毫无意义，或者可能通向死胡同或死胡同，最终被证明是浪费时间。\n\
  \n对此，我诚挚地表示歉。我并无恶意，无意用我的胡言乱语浪费你的时间。\n\n在读得太远之前停止阅读是个好主意吗？不！\n\n这些信息是通用的。\n\n没有考虑任何预设的用途——除了展示我有多喜欢使用\
  \ Linux——并希望你也能如此。\n\n我希望你在这里发现一些点星的趣味。祝你好运。\n\n如果你发现了任何对你这种思维方式来说有前景的东西——请进行你自己的严谨测试和评估。\n\
  \n我希望你读到的某些内容能激发你自己的思考，或者对该主题有更深层次的考虑。\n\n如果你没有看到任何价值，那么请记住——我已向你警告过可能会出现这种结果。\n\
  \nLinux 与我的思维方式产生共鸣，因为它体现了一个慷慨且灵活的用户命令环境——强大到可以在超级计算机上运行，同时又能轻松地位于我们的个人电脑上。\n\n\
  使用 Linux 绝不是一项任务——它是一种纯粹的享受。\n\n# 获取 Linux\n\n如果你已经安装了 Linux，请跳过本章——除非你想在旧电脑上更新\
  \ Linux。\n\n如果我们在互联网上搜索 `Linux distro`，会发现有很多不同的发行版。\n\n它们的名称如 `Debian`、`Fedora`、`Linux\
  \ Mint`、`Open-SUSE`、`Ubuntu` 等。\n\n我们应该选择哪一个呢？\n\n有广泛的配置供我们选择。有些特殊的 Linux 系统被设定为音频和/或视频工作站，并在其开发者称为\
  \ `studio` 的系统中具有其他特殊侧重点。\n\n如果这是我们第一次尝试尝试 Linux——我建议我们可以从这里开始：\n\n> [`ubuntu.com/download/desktop`](https://ubuntu.com/download/desktop)\n\
  \n此网页包含了一组关于下载和安装 Ubuntu Linux `Desktop` 系统的易用说明。\n\n在选择 `Download`（下载）链接之前，请查看\
  \ `How To Install`（如何安装）链接。\n\n还有一个 `Follow the step-by-step tutorial`（遵循步骤教程）链接。\n\
  \n上次我尝试时，下载了一个名为 5.9 GB 的文件：\n\n> `ubuntu-24.04.2-desktop-amd64.iso`\n\n请获取最新的 LTS\
  \ 版本号和适合你电脑的正确类型。\n\n这是一个功能强大的 Linux 发行版，代号为 `Nimble Numbat`，其中我们可以找到用于音乐、图形和视频的应用程序，以及用于文字处理、表格之类的\
  \ Libre Office 办公件。\n\n它有多种浏览器和电子邮件客户端程序，以及数百个我喜欢在终端窗口中使用的短助记命令。\n\nUbuntu 已经持续开发了\
  \ 20 多年。它包含了稳定的 LTS —— 长期支持版本，我觉得它们作为我的 Linux 工作平台非常有帮助。\n\n**请注意：** 由于大小为 5.9 GB，`.iso`\
  \ 文件**不再**能够放入单层 DVD 光盘中。\n\n该网页上的信息包含帮助我们创建可启动 USB 闪盘的说明——他们说这需要 12 GB 或更大的空间。\n\
  \n他们建议使用一个名为 `balenaEtcher` 的免费程序将该 `.iso` 文件 `burn`（刻录）到 USB 闪盘上。该程序可以在 Apple、Windows\
  \ 和 Linux 电脑上运行。\n\n在我现有的 Linux 电脑上，我让浏览器指向 URL：\n\n> [`etcher.balena.io/`](https://etcher.balena.io/)\n\
  \n我在那里下载了一个名为 `.zip` 的文件：\n\n> `balenaEtcher-linux-x64-2.1.2.zip`\n\n**注意：** 如果你还没有使用\
  \ Linux，你需要为你的电脑下载正确的文件并遵循相关的说明。\n\n接下来，我将下载的文件解压到一个临时目录，并使用以下命令运行 `balena-etcher`\
  \ 进程：\n\n```bash\n$ cd Downloads\n$ mkdir tmpEtcher\n$ cd tmpEtcher\n$ unzip ../balenaEtcher-linux-x64-2.1.2.zip\n\
  $ ./balenaEtcher-linux-x64/balena-etcher\n```\n\n**注意：** 前置的 `$`符号是我的系统提示符——不要输入它们。\n\
  \n`balena-etcher` 进程请求我的密码以获得运行权限，并按预期启动了。\n\n当我插上 USB 闪盘时，系统弹出一个文件浏览器，显示我为使用而添加的新\
  \ USB 设备。\n\n这也成为了 `balena-etcher` Flash（刻录）过程的默认设备。\n\n接下来在 `balena-etcher` 过程中，我导航到\
  \ `Downloads` 目录或文件夹中下载的 `ubuntu-24.04.2-desktop-amd64.iso` 文件并选中了它。\n\n然后我点击 `Flash`（刻录）按钮，进度指示器显示了文件传输过程的完成百分比，该过程为我制作了可启动的\
  \ USB 闪盘。\n\n这在我的电脑上花了六（6）分钟完成，然后我关闭了 `balena-etcher` 进程。\n\n在插上 USB 闪盘时弹出的文件浏览器，我选择\
  \ Eject（弹出）USB 闪盘，以确保所有文件数据缓冲区在物理移除之前已刷新。\n\n该 Ubuntu 网页上提供了描述如何从 USB 闪盘启动电脑的说明。\n\
  \n如果它没有直接启动，我们可能需要更改 BIOS 中的设置以帮助电脑从 USB 设备启动。\n\n按下 F12 键（在其他系统上可能是 F2、F10 或 Esc）应该显示系统启动菜单，可以在其中导航到启动设备选择面板。在笔记本电脑上——我需要按一个小按钮才能进入\
  \ BIOS 的那部分。\n\n当我们让系统从新的可启动 Linux USB 闪盘启动后，很快会弹出一个菜单要求我们选择语言。\n\n接下来，我们可以从任何需要或使用的辅助功能设置中选择。\n\
  \n系统提示我们选择键盘布局。\n\n另一个提示要求连接网络以便 Ubuntu 下载更新以及我们电脑可能需要的任何第三方驱动程序。\n\n接下来，我们可以选择在电脑上\
  \ `try`（尝试）Ubuntu 或 `install`（安装）Ubuntu。\n\n如果这是你第一次尝试 Linux，我建议先选择 `try` Ubuntu\
  \ 模式。这将为你加载一个 Ubuntu 的现场演示，供你探索，而不会对你的电脑做出任何更改。\n\n通过演示或 `try` Ubuntu 模式，我们会发现显示发生了变化，提供了\
  \ Ubuntu 桌面菜单和任务栏，让我们能够观察 Linux 的功能，看看它是否吸引我们，并让我们决定它看起来是否有用并已准备好我们使用。\n\n我希望你会喜欢你发现的内容。\n\
  \n在 Ubuntu Linux 中，我们首先会在屏幕顶部看到任务栏，左侧有一个快速启动菜单项。\n\n将鼠标指针移动到左侧快速启动菜单的图标上将显示每个图标的名称。\n\
  \n在我的安装中，我发现了 `Firefox`、`Thunderbird Mail`、`Files`、`Rhythmbox`、`LibreOffice Writer`、`App\
  \ Center`、`Help` 和 `Trash`。\n\n其中一个图标是 `Files`，看起来像文件柜——点击它打开文件浏览器。这打开了我们的主文件夹。\n\
  \n这应该看起来很，并且操作方式与我们在其他电脑系统中看到的相似。\n\n有一系列子文件夹，名称如 `Desktop`、`Documents`、`Downloads`、`Music`、`Pictures`、`Public`、`snap`、`Templates`\
  \ 和 `Videos`。\n\n\n\n\n最初这些将是空占位符，但 `snap` 除外，它包含了 `firefox` 和 `snapd 桌面集成` 的子文件夹。\n\
  \n点击右上角的 [x] 按钮关闭文件浏览器窗口。\n\n另一个快速启动图标是 `LibreOffice Writer`。如果我们点击它，很快就会看到一个强大的文字处理器应用程序窗口。我预计菜单和工具栏看起来会很熟悉，并且操作方式与我们见过的其他产品一样。\n\
  \n通过选择右上角的 [x] 按钮，或者在其 `File` 菜单中选择 `Exit LibreOffice` 选项来再次关闭窗口。\n\n在 Ubuntu 主窗口的左下角有一个名为\
  \ `Show Apps` 的项目。如果我们选择它，将看到 Ubuntu 演示或 `try` 版本加载的应用程序集合。\n\n尝试其他一或两个项目——比如 `Clocks`（时钟）、`Calculator`（计算器）、`Calendar`（日历）或\
  \ `Text Editor`（文本编辑器）。\n\nUbuntu Linux 非常精良，并为用户提供了广泛的工具。安装过程加载了其中的一小部分样本。\n\n\
  顶多不过我们只是用羽毛的软端触了碰表面。\n\n如果我们想进一步使用 Linux，我们可以采取两种方式之一——在我们当前的系统“旁边”安装 Linux——使其成为双引导系统；或者我们可以——“替换”当前的系统安装\
  \ Linux——请小心。\n\n如果我们已经准备好并想要替换旧的操作系统，那是没问题的。\n\n我们当前的系统中是否有任何我们需要保留的文件？\n\n在用新的\
  \ Linux 安装程序覆盖磁盘之前，请确保你已将这些文件备份到可移动介质上。\n\n此处未涵盖逆转该过程的操作。如果你没有备份文件，这可能是是不可能的。你需要搜索有关如何尝试该操作的详细信息。\n\
  \n在走得太远之前，请先阅读 Ubuntu 注意事项。\n\n如果你确定要安装 Ubuntu，可以通过选择桌面上的 `Install Ubuntu` 快捷图标返回安装程序菜单。\n\
  \n我当时在使用一台旧电脑，需要重启电脑并选择 `safe graphics`（安全图形模式）选项才能通过安装过程。\n\n如果你的电脑设备上安装了另一个操作系统，你应该会看到一个选项，让你与该系统并存安装\
  \ Ubuntu，而不是替换它。\n\n如果你想让 Ubuntu Linux 成为硬盘上唯一的操作系统，请选择 Erase disk（擦除磁盘）并安装 Ubuntu。\n\
  \n按照提示操作并选择默认设置，除非你知道为什么要选择替代选项。\n\n祝你好运。\n\n# Linux 用户\n\n我花费了无数小时在我的 Linux 电脑上工作。\n\
  \n当我写这本书的文字时——我正在使用 Linux。\n\n上世纪 20 世纪 80 年，我在 C.S.I.R.O. 工作时开始使用 Unix 计算机操作系统，并且再也没有回头过。\n\
  \n像我这样的科学家和技术人员发现，在 Unix 上完成的工作比我们以前在其他系统上实现的要多。\n\nLinus B. Torvalds 在 1991 年于芬兰赫尔辛基大学就读期间开始开发\
  \ Linux —— 这已是 30 多年前的事。\n\nUnix 和现在的 Linux 都是多用户系统，每个用户都有自己的“家”目录或文件夹，他们可以在其中按照任何符合自己逻辑顺序组合自己的文件集。\n\
  \n在 2025 年，Linux 系统仍然是世界上大多数规模最强大的超级计算机系统的“首选操作系统”，其计算集群支持数千——现在是数百万个 CPU 核心。\n\n\
  强大的 Linux 操作系统足够小，可以运行在大多数拥有 4 GB RAM 和 250 GB 磁盘的 PC 上——如果可以，请获取更多的内存和 SSD 存储。\n\
  \n在你的 Linux PC 系统中添加更多用户账户很容易，以便需要时让家庭成员访问 Linux。\n\n每个用户的文件都存储在计算机存储中各自独立的区域中——我们将在适当时候讨论这一点。\n\
  \n与流行的商业计算机系统不同，在那些系统中用户通常通过使用“鼠标”指针设备来选择文件并运行程序，每个程序都有自己的“图标”——Linux 系统既支持这种形式的界面，也支持灵活的基于文本的命令行界面，像我这样的人觉得它易于使用且效率更高。\n\
  \n为什么？我不需要定位文件和程序图标，不需要抓住鼠标在屏幕上移动指针来选择并双击这些对象以传达我的意图，我只需要把手指放在键盘上，发现在 `Terminal`\
  \ 窗口中输入简短的助记命令和我想使用的文件名要容易得多。\n\n这听起来有点有点“老派”，在某种意义上——确实如此。我已经在电脑上使用这种工作风格很长时间了。我尝试过其他计算机系统，但总是发现自己把它们抛置一边，回到我更高效的\
  \ Linux `Terminal`。\n\n这是因为我们学不会这只“老狗”学新花样吗？我不这么认为——我几乎每天都会学新东西——我坚信 Terminal 界面效率更高。\n\
  \n我通过键盘使用交互式 shell 命令行语言与我的电脑“交谈”，这种语言为我提供了巨大的计算能力，包括缩写方法和编程特性，帮助我完成的一系列活动。\n\n\
  是什么让 Linux 具有优势？是什么让它与众不同？\n\n## 文件系统与进程\n\nUnix 和 Linux 设计和构建的计算模型包含两个重要的概念。\n\n\
  一旦我们理解了“文件系统”和“进程”这两个概念，我们就知道了为了取得快速进展所需要的一切。\n\n我预计你知道我们将信息存储在“文件”中，并将这些文件保存在“目录”或“文件夹”集合中，以帮助我们定位所需的文件。\n\
  \n将信息组织起来比将其散落在各处要有意义——或者更糟——将所有内容都放在一个没有划分的巨大区域内。\n\n我们不想在每次需要报告、备忘录、数据文件或计算机脚本时都像在玩“大海捞针”。\n\
  \n在我的电脑上，我使用一系列目录或文件夹名称以及任意数量的子目录或子文件夹层级，以便我容易找到信息。我们将仔细研究如何做到。\n\n简而言之，这就是“文件系统”在基础层面为我们提供和维护的能力——配备完整的文件访问权限，以帮助保持信息在我们的控制之下。\n\
  \n如果确定需要更复杂的安全形式，我们可以使用数据加密方法。\n\n`process`（进程）是正在运行的程序实例，它被加载到计算机内存中为我们执行其操作。\n\
  \nLinux 中的并不是每个进程都是“一刀切”或独立的应用程序——这里有更具灵活性。\n\nLinux 用户可以使用交互式且可编程的 shell 进程中易于使用的机制，使能够将一个进程的输出连接到另一个进程的输入中——如果这种进程链符合逻辑，可以无限进行。\n\
  \n`process` 的这些互连功能允许我们构建自定义的进程流水线，以具有重复和可靠性的方式运行任务，这在其他计算机系统中很难实现的。\n\n我们不需要理解每一个细微的细节。\n\
  \n在随后的章节中，我们将检查这两个 Linux 系统设计概念的实用功能。\n\n## 助记命令\n\n在 Terminal 窗口中工作时，Linux 中的可执行程序或命令通常具有看起来不寻的文件名。起初它们几乎是加密的。\n\
  \n 5 到 10 分钟后，这些开始变得有意义。\n\n大多数在旧版 Unix 环境中开始开发的命令程序都被赋予了简短的助记名称——旨在辅助我们的记忆提取。\n\
  \n\n\n\n顺便提一下——mnemonic”（助记词）一词的首字母“m”是不发音的，读音有三个音节，类似于“nem-on-ic”或“ne-mon-ic”。\n\
  \n短名称有助于减少当时必须使用的那种笨重旧`mechanical`电字机控制台上所需的打字量。\n\n例如，`ls` 命令是 `list`（列表）或`listing`的缩写，它会显示我们`current`\
  \ `directory`（目录）或文件夹中文件系统对象的名称列表——或者根据我们的指令显示其他地方。\n\n我们如何知道哪个是`current` `directory`（目录）、文件夹或文件系统工作空间呢？\n\
  \n当我们第一次登录 Linux 系统时，那里就是我们指定的用户 `home` 目录。\n\n有一个名为 `pwd` 的命令——`print working directory`（打印工作目录）的缩写，它为我们显示该信息。\n\
  \n另一个名为 `cd` 的命令——`change directory`（切换目录）的缩写，它允许我们在文件系统的当前焦点切换到我们选择的任何其他目录或文件夹——只要我们有权限这样做。\n\
  \n在使用 `cd` 命令在文件系统的不同位置移动后，我们可能会好奇自己最后到了哪里——再次运行 `pwd` 即可。\n\n就像这三个命令一样，我们在 Linux\
  \ 中触手可及的数百软件工具每个都执行一项任务，并且执行得精准。\n\n这有点像我们小时候开始学习阅读时。\n\n起初，每个词都是谜团——我们无法辨别它的音节——不知道如何读一个词——不知道它的意思。\n\
  \n随着时间的推移和练习，我们开始识别学过的单词并能读出来，并发现自己可以理解并理会所读的内容。\n\n很快，我们就能阅读短语、句子、段落、章节、章节以及整本故事书。\n\
  \nLinux 这个强大且描述性丰富的部分也是如此。\n\n过了一段时间，那些助记命令名称开始变得容易记忆，并帮助我们在更短的时间内完成更多工作。\n\n我们发现可以视觉化出一系列简短、利落、独特且助记的命令名称，来帮助我们完成需要的任务。\n\
  \nLinux 计算的力量源于我们几乎无穷尽的方式，我们可以通过组合这些命令来创建自己的更高效的命令——根据我们的工作方式进行定制。\n\n在 Unix 还是\
  \ Linux 中，这种灵活性一直令我感到惊讶。\n\n## 终端威力\n\n如今的`Terminal`窗口支持额外的`tabs`（标签页）或子窗口，我可以在两个终端窗口中的每一个中打开五个或更多，并并发处理不同的任务，帮助我推进计划完成的工作。\n\
  \n在像 `gnome-terminal` 和我更倾向于使用的 `LXTerminal` 等终端窗口中，使用快捷键组合 `{Ctrl}+{Shift}+{T}`\
  \ 可以轻松打开新标签页。\n\n我们可以使用快捷键组合如 `{Alt}+{1}`、`{Alt}+{2}`、`{Alt}+{3}` 等在标签之间切换。如果手里拿着鼠标，也可以点击其中一个标签页。\n\
  \n例如，在终端窗口的某个`tabs` 中，我会使用 `cd` 命令切换到存放当前书籍文本文件的`directory`（目录）或文件夹。\n\n## 我的文本编辑\n\
  \n我使用这个子窗口运行我最喜欢的编辑器 `vim`——`vi-Improved`（改进版 vi）的缩写——这是一个非常强大且高效的工具，其编辑命令都是助记且易记的。\n\
  \n原始的 `vi` 编辑器——`visual`（视觉）的缩写是由 William N. Joy 等人在 20 世纪 80 年代在美国加利福尼亚大学伯克利分校开发的。当时计算机显示单元（带有玻璃屏幕的“笨”终端显示器）的使用开始增加。\n\
  \n我在 C.S.I.R.O. 的 Unix 上开始使用 `vi`，它很好服务了我所有的文本编辑需求——Fortran 和 C 语言编程、Perl、R 和 Shell\
  \ 脚本编程，以及音乐和书籍写作。\n\n`vim` 版本由荷兰软件工程师 Bram Moolenaar 等开发并增强，`vim` 很快进入了 Linux。\n\
  \n如果你想快速了解高效编辑以及 `vim` 如何帮助你，请阅读 Bram 的那篇七页论文，标题为《Seven habits of effective text\
  \ editing》（高效文本编辑的七习惯）：\n\n> [`www.moolenaar.net/habits_paper.pdf`](https://www.moolenaar.net/habits_paper.pdf)\n\
  \n有一个名为 `vimtutor` 的特殊程序可以帮助我们学习 `vim` 的基础——它是实操性的，而且不需要很长时间。这让我们在极短的时间内掌握 `vim`\
  \ 编辑的基础。\n\n完成 `vimtutor` 大约需要 30 分钟——为了获得终身的卓越编辑能力，这是一个很小的投资。\n\n**注意：** `vim`\
  \ 编辑器命令是助记的——很容易记忆，如 `i` 代表在光标前 `insert`（插入）文本，`a` 代表在光标后 `append`（追加）文本。甚至我们还需要按\
  \ `Esc` 键从文本插入模式 `escape` 回到 `normal` 模式。\n\n`vim` 编辑器命令是助记的——很容易记忆，如 `i` 代表在光标前\
  \ `insert`（插入）文本，`a` 代表在光标后 `append`（追加）文本。\n\n还有其他你可以安装并尝试的，如 `cream`、`emacs`、`featherpad`、`kate`、`nedit`。\n\
  \n你需要找到适合的一个。\n\n## 我的文档方法\n\n在第二个终端窗口的另一个`tab` 中，我会打开同一个文件系统工作空间——我使用优秀的 TeX 系统——一套由斯坦福大学的\
  \ Leslie B. Lamport 博士和 Donald E. Knuth 教授开发的文档准备宏。\n\n从我使用 Unix 的起我就一直使用这些工具，它们在\
  \ Linux 上也能运行。\n\n目前，我通过一个名为 `lx` 的小型 Shell 脚本运行它——`latex` 的缩写——它通过另一个辅助脚本 `latexmk`\
  \ 运行，由 John Collins 开发了真实的 `latex` Perl 脚本：\n\n> [`www.cantab.net/users/johncollins/latexmk/`](https://www.cantab.net/users/johncollins/latexmk/)\n\
  \n我的双字母命令 `lx` 的结果是在我做的最新更新上重新运行 `latex` 程序，然后显示我工作的打印版本的 PDF 文件。\n\n接下来，我可能会运行另一个名为\
  \ `l2e` 的 Shell 脚本——`latex to epub` 的缩写。这是一个辅助脚本，将书籍内容重新处理为 `epub` 版本，并在我喜欢的名为 `okular`\
  \ 的 epub 阅读器中显示——最有用——非常适合校对。\n\n我使用 `pandoc`——一个通用标记转换器将我的初始 LaTeX 纯文本文件转换为 `pandoc`\
  \ `markup`，从那里转换为我需要的最终 `epub3` 格式。\n\n尽管听起来很复杂，但实际上可能相当简单，因为我发现了如何让这些命令按照我想要的方式运行——而我并不是天才。\n\
  \n对我来说，最棒的部分是，我不需要永远*抓取*鼠标并*移动*鼠标指针到另一个应用程序菜单，然后*选择*菜单并让鼠标指针在选项列表中运行并选择我下一个需要的功能。\n\
  \n我确实使用鼠标——将焦点从一个窗口切换到另一个窗口，或者向上向下滚动阅读长文本，或者高亮文本并将复制粘贴到其他地方。\n\n其他终端窗口 `tabs` 会根据需要使用。\n\
  \n\n\n\n如果我现在不行动，转瞬即逝的灵感就会消失。我切换到另一个 Terminal `tab` 并添加了那条重要的备注。然后我回到之前正在的工作上。\n\
  \n当天晚些时候，海瑟——我迷人的妻子——从购物归回到家，手里拿着超市、药剂店和面包店的收据。\n\n我使用鼠标设备——将焦点切换到另一个 Terminal `tab`，通过运行我的\
  \ `bills` shell 脚本开始输入这些收据的主要详情——最多只需要一两分钟，然后我再次切换 `tab` 回到之前的地方并继续我正在做的事——轻而易举。\n\
  \n## 自定义命令\n\n### 什么是“shell 脚本”？\n\nLinux 包含了所谓的可编程 `shell` 程序，其中一个程序被称为 `bash`\
  \ —— 它是“Bourne-again Shell”（布恩再次的 Shell）的缩写。\n\nStephen R. Bourne 在在 Unix 上开发他的\
  \ Bourne shell 程序 `sh` 方面发挥了巨大的作用，帮助用户用更少的努力完成更多的工作。\n\n与 `sh` 一样，`bash` shell 既是交互式的也是可编程的，并且可以指令它对预期的文件系统对象进行条件测试，并将这些结果传递给我们需要运行的程序进程，以获得我们想要的结果。太棒了。\n\
  \n当我们在 Terminal 窗口中工作时，有一个像 `bash` 的 shell 实例在其中运行，并解释我们输入的命令。\n\n与其反复不断地输入相同的命令，不如指令\
  \ shell 运行我们保存在纯文本文件中的一系列 shell 命令，我们称这种文件为“shell 脚本”。\n\n对于任何涉及任务重复的工作，为什么不写一个\
  \ shell 脚本来每次都按正确的顺序运行这些步骤呢？\n\n一个 shell 脚本可以从简单的一或两行 shell 命令开始，一直扩展到数百行代码，以帮助处理更复杂的任务——循序渐进地走向更复杂性。\n\
  \n这项任务并没有听起来那么困难——而且它带来了巨大的成就感。它是最令人满足的。\n\n不久之后，我们就发现自己节省了数小时的时间，这些时间本会被不断重新输入命令序列，或者更糟——在桌面上移动鼠标来让一个通用的应用程序去完成它本并非设计要完成的任务。\n\
  \n在的一年的时间里，这可能意味着巨大的节省。\n\n## 不仅仅是文本\n\nLinux 不限于在 Terminal 窗口中运行一切。我们可以安装并运行其他应用程序来帮助我们做几乎任何事情。\n\
  \n在空闲时间，我喜欢在 `lilypond` 音乐记谱系统或 `lmms` 程序中摆弄自己的音乐片段——`lmms` 是一个 DAW（数字音频工作站），包含歌曲编辑器、节奏+贝斯编辑器、钢琴卷以及一个带有乐器和效果的\
  \ FX 混合器。\n\n我们可以安装几十种游戏，如 `Chess`、`Mahjongg`、`Sudoku` 或 `Tetravex` 等——安装一个名为 `bsdgames`\
  \ 的模块并查看原始的 `adventure` 甚至很有趣！\n\n我们可以安装如 `Dia`、`GIMP` 或 `Graphviz` 或 `InkScape`\
  \ 等图形实用工具。\n\n我们可以安装如 `Pix` 和 `Shotwell` 等应用程序来帮助我们组织照片集。\n\n安装如 `Audacity`、`Clementine`\
  \ 或 `Rhythmbox` 或 `VLC 媒体播放器` 等音频应用程序。\n\n从 `R` 系统安装一系列用于统计计算和图形的模块，并通过其 `R Commander`\
  \ 界面探索我们数据中的趋势或分布。\n\n安装 LibreOffice 全套程序 `Base`、`Calc`、`Draw`、`Impress`、`Math`\
  \ 和 `Writer` 并在其中工作——这是我们的选择。\n\n**注意：** LibreOffice 应用程序可以读取大多数来自类似外部系统的 `.docx`\
  \ 等。\n\n当我们将此类应用程序与强大的 Terminal 窗口及其交互且可编程的 shell 接口结合时，我们得到了我所认为的以来最好的计算平台。\n\n\
  # 查看 Linux\n\n如果我们在 PC 上安装了 Linux，那么当我们重启 PC 时，它要么启动 Linux，要么会提供一个选择 Linux 或我们之前的系统的选项（如果我们选择在现有的操作系统旁安装\
  \ Ubuntu 的话）。\n\n在安装过程中，我们被提示提供用户名并选择账户密码以确保安全。我们需要记住这些细节，以便访问新安装的 Ubuntu——如果我们选择了`需要我的密码才能登录`\
  \ 选项的话。\n\n当我们输入正确的密码时，Ubuntu 登录过程将提供对我们在 Linux 文件系统中自己的“家”区域的访问。\n\n第一次进入时，新安装的并没有多少个人文件。有成百个系统文件，如可执行程序、软件库文件和文档文件供我们需要时阅读。\n\
  \n登录后，我们可以看到一个名为`软件更新器`的弹出对话框。它报告`此电脑有可用的更新软件`。它有标记为`稍后提醒`或`立即更新`的按钮。\n\n如果有两三分钟空闲，选择`立即更新`按钮是一个好主意。有时我们需要重启\
  \ PC 来完成软件更新。\n\n更新包括已安装在我们的 Linux 发行版中的软件的安全补丁或功能改进和/或 修复。Ubuntu 建议我们让这些更新运行。在\
  \ Ubuntu 中，我们可以在顶部看到任务栏，在左侧看到快速菜单。\n\n将鼠标指针悬停在左侧的项目上将显示其名称。\n\n左侧底部是一个名为`显示应用程序`的项。如果我们点击左侧的那里，我们将看到\
  \ Ubuntu 加载的选择。\n\n尝试其他项目——如果你还没见过这些的话，可以尝试 LibreOffice Calc 和 Writer。\n\n## 打开终端\n\
  \n在`显示应用程序` 区域找到 Terminal 图标并运行它。这会打开一个带有提示符的空白窗口，等待我们输入。\n\n**注意：** 第一次在我安装的 Ubuntu\
  \ 上运行 Terminal 时，它给了我一个重要的提示：\n\n```\n要以管理员（root 用户）运行命令，请使用 sudo <command>。详情请参见\
  \ \"man sudo_root\"。\n```\n\n`sudo_root` 手页解释了一些关于 Ubuntu 如何配置的信息，值得阅读。\n\n`sudo_hint`\
  \ 消息是在 `bash` shell 读取 `/etc/profile` 文件时生成的，该文件反过来读取 `/etc/bash.bashrc` 文件。\n\n\
  当我们第一次成功使用 `sudo` 命令时，它会在主目录下创建一个名为 `.sudo_successful` 的新文件，防止我们之后看到该 `sudo_hint`。\n\
  \n听起来有点复杂——Linux 开发者有他们的理由——不要太担心。\n\n回到 Terminal 窗口——输入单词 `date` 并按下回车键。\n\n```\n\
  $ date\n```\n\n不要输入美元符号 (`$`)，它代表我的 Terminal 会话中的可见提示符。\n\n我希望 `date` 命令给出了有用的响应。\n\
  \n输入 `ncal` 并按下回车键。\n\n```\n$ ncal\n```\n\n还有一个旧版本的 `cal`，它在顶部显示简短的天名，而不是在左侧——每个版本对我都有用处。\n\
  \n\n\n\n点击 `Terminal` 快速启动图标的鼠标左键即可为我启动一个实例。\n\n如果我们想要两个独立的 Terminal 窗口，可以鼠标右键点击快速启动中的\
  \ `Terminal` 图标，弹出一个小菜单，并选择 `New Window`（新窗口）选项。或者，在已打开的 Terminal 窗口中，我们可以尝试输入三个组合键\
  \ — `{Ctrl}+{Shift}+{N}`。\n\n当我们打开一个 Terminal 窗口时，它的默认操作是运行一个 `bash` shell 的交互式实例\
  \ —— 显示在一个看起来是空白的窗口中，具有特定行数和默认宽度。初始为向下 24 行，每行宽度为 80 个字符。\n\n尝试在 Terminal 窗口中运行这个\
  \ `seq` 命令 —— 它是数字“sequence”（序列）的缩写：\n\n```bash\n$ seq 99 -1 2 {Enter}\n```\n\n\
  第一行显示的数字是行数——假设我们的 Terminal 少于 99 行。\n\n如果我们有一块大屏幕，在 Terminal 的启动偏选项中选择更多行数也是可以的——我倾向于在使用的情况下使用大约\
  \ 40 行。\n\n查看菜单图标 —— 例如在 Terminal 窗口框架中有一个名为 `Preferences`（偏好）的“汉堡”图标。其他的 Terminal\
  \ 窗口可能有一个带有 `Preferences` 项目的 `Edit`（编辑）菜单。\n\n我的偏好行宽不超过 80 个字符，因为这有助于保持其他软件“正常运行”。\n\
  \n我的大脑更倾向于阅读较短的行，而不是去理解长行中编写的内容。对我来说，那样效率更高。\n\n长行可能会在奇怪的地方折行，尝试读取那些折行的内容会变得很尴尬。\n\
  \n我们可以用这个交互式 shell 做什么呢？\n\n我们已经在那里运行了 `date` 和 `ncal` 命令。\n\n这正是我花费大部分时间的地方。\n\n\
  `man bash` 手页说它是一个“从标准输入或文件读取命令并执行命令的命令语言解释器”。\n\n什么是“标准输入”？\n\n默认情况下，这种输入来自我们的键盘\
  \ —— 无论我们在那里输入什么字符 —— 稍后会详细介绍。\n\n我们可以输入如 `ls` 的命令名称并按下 `{Enter}` 键：\n\n```bash\n\
  $ ls {Enter}\n```\n\n输出可能如下：\n\n| `Desktop` | | `Music` | | `snap` |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| `Documents` | | `Pictures` | | `Templates` |\n| `Downloads`\
  \ | | `Public` | | `Videos` |\n\n首次运行 Terminal 窗口时，它会在我们的 `home` 区域创建三个或四个额外文件。\n\
  \n首次运行 Terminal 窗口时，它会在我们的 `home` 区域创建三个或四个额外文件。\n\n这些新文件命名为：\n\n* `.bash_history`\n\
  * `.bash_logout`\n* `.bashrc`\n* `.profile`\n\n这些文件被 `bash` shell 使用。\n\n它们在哪里呢？它们没有在上面的\
  \ `ls` 命令的输出中出现！\n\n### 隐藏文件\n\n注意那四个文件名以点（`.`）字符开头。\n\n我们称这些为“隐藏”文件，因为当我们运行不带任何选项或参数的\
  \ `ls` 命令时，隐藏文件不会显示 —— 这使得文件列表更整洁或更容易读。\n\n什么是 `option`（选项）或 `argument`（参数）？\n\n\
  如果我们想看到那些隐藏文件，可以在 `ls` 命令名称后添加一个空格和选项 `-a`：\n\n```bash\n$ ls -a {Enter}\n```\n\n\
  输出可能如下：\n\n| `.bash_history` | | `Downloads` | | `Public` |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| `.bash_logout` | | `Music` | | `snap` |\n| `.bashrc` | | `Pictures`\
  \ | | `Templates` |\n| `Desktop` | | `.profile` | | `Videos` |\n| `Documents` |\
  \ | | | |\n\n这很简单 —— `-a` 选项是“all”（全部）文件的缩写。\n\n另一种列出隐藏文件（s）的方法是将这些文件名作为一个或多个参数提供给\
  \ `ls` 命令：\n\n```bash\n$ ls -a {Enter}\n```\n\n（注：提供的文本在后半部分包含大量重复和乱码片段。我已根据提供的格式指令清理了核心技术内容。）\n\
  \n\n\n\n\n输出的第二列中括号里的 `1` 告诉我们，这些手动页来自在线文档的第 `1` 节，因此这些是我们可以运行的通用命令。\n\n不要尝试运行来自不同手册章节的条目——其中大部分内容都是库文件的描述等。\n\
  \n如果我们运行 `man man` 命令，就可以找到这些不同章节的列表——例如“System calls”（系统调用）和“Library calls”（库调用）——这些对于软件开发者至关重要。\n\
  \n我们可以尝试运行 `man -k games` 来查找其他我们*可以*运行以消遣时间的程序列表——在空闲时间——在第 `(6)` 节中通常有一些我们可以在个人\
  \ Linux PC 上运行的内容。\n\n回到 `Disk space`（磁盘空间）. . .\n\n接下来，我们可以尝试使用搜索词 `space.usage`：\n\
  \n```bash\n$ man -k space.usage {Enter}\n```\n\n```bash\ndf (1) - report 文件系统磁盘空间使用情况\n\
  du (1) - 估计文件空间使用情况\n```\n\n单词需要在手动页描述中按该顺序出现。\n\n尝试运行 `df` 命令查看它提供了什么信息：\n\n```bash\n\
  $ df {Enter}\n```\n\n信息太多？这是有道理的。\n\n命令 `df` 是 “disk free”（磁盘可用）的缩写——查看 `Available`（可用）和\
  \ `Use%`（使用率）列。使用超过 75% 可能意味着是时候增加存储了。\n\n我们可以在 `df` 命令中使用 `-h` 选项——显示更“人类可读”的数字。\n\
  \n`-h` 选项会在字节数后适当显示 `K`、`M` 或 `G`：\n\n```bash\n$ df -h {Enter}\n```\n\n详情详情阅读 `man\
  \ df`。\n\n`du` 命令是 “disk usage”（磁盘用量）的缩写。我经常在使用它时配合 `-h` 和 `-s` 选项。\n\n`-s` 选项是\
  \ “summary”（摘要）的缩写，它报告一个汇总数字，而不是为当前位置下的每个目录或文件夹报告一个磁盘使用数字：\n\n```bash\n$ du -s -h\
  \ {Enter}\n```\n\n或者：\n\n```bash\n$ du -sh {Enter}\n```\n\n通常我们可以像这样组合两个选项——并不总是如此——如果命令不允许我们这样做，它会报错。\n\
  \n运行 `du -h`（不带 `-s` 选项）将为当前目录下找到的每个文件和目录列出一行——这可能包括许多由文字处理器、电子邮件客户端等程序使用的文件——我们从未想过系统需要为我们存储这些文件。\n\
  \n如果我们检查 `du` 命令的 `man` 页，可以使用类似 `/ -s` 的搜索词来导航到描述 `-s` 选项的条目，在 `/` 字符*之后*和我们要 `-s`\
  \ *之前*留一个空格。\n\n为什么？因为大多数描述其选项的 `man` 页章节会以左侧留有空格缩进的行开头，在每个 `-h` 和 `-s` 等项目之前。\n\
  \n## User id（用户 ID）\n\nLinux 系统上的每个用户都有自己的用户标识和组标识符——从 1000 开始，并且是一个以自身组开头的一个多个组的成员。\n\
  \n另一个名为 `id` 的双字符命令将显示一组标识符字符串，如 `uid`——用户标识符、`gid`——组标识符和 `groups`——我们拥有管理员权限的系统组列表：\n\
  \n```bash\n$ id {Enter}\nuid=1000(clu) gid=1000(clu) groups=1000(clu), 4(adm), 24(cdrom),\
  \ 27(sudo), 30(dip), 46(plugdev), 100(users), 114(lpadmin)\n```\n\n`groups=1000(clu)`\
  \ 之后的大部分条目的是某些时候我们需要访问的系统管理组列表。\n\n如果我们的 Linux 系统上有另一个名为 `alex` 的用户，我们可以通过运行以下命令查看其用户\
  \ ID 和组访问：\n\n```bash\n$ id alex {Enter}\nuid=1011(alex) gid=1011(alex) groups=1011(alex),100(users)\n\
  ```\n\n还有另一个名为 `groups` 的相关命令，将产生用户所属的组名列表。\n\n运行 `groups` 命令得到的输出会少一点：\n\n```bash\n\
  $ groups alex {Enter}\nalex : alex users\n```\n\n该用户对系统组没有管理员权限。如果他们*需要*此类权限，可能需要请求管理员为他们运行某些命令。\n\
  \n他们可以请求管理员为他们的工作和其他项目安装所需的新软件。\n\n务必仔细考虑其他人请求管理员使用该特权系统管理员权限来做什么。\n\n组编号和名称——在某些时候不同的\
  \ Linux 系统之间可能会有所不同。\n\n组列表存储在一个可读的纯文本系统文件中，该文件位于 `/etc/group`。\n\n详情请参：`man group`。\n\
  \n## Administrator privilege（管理员权限）\n\n安装 Linux 的人员创建的第一个账户（管理员）会被添加到其他组中，以便他们能够使用\
  \ `sudo` 命令运行管理员命令。\n\n多用户 Linux 服务器上的并非所有用户都需要管理员权限。这种访问权限必须限制在一两个个*必须*拥有此类权限以执行任务的人身上。\n\
  \n我们不会向任何人分发管理员权限。\n\n我们如何识别那些不会滥用这种扩展组管理员权限所带来的权限的可信任个人呢？\n\n考虑这种权限的深度需要一段时间。\n\
  \n我们需要仔细查阅文档，注意关于使用和滥用的警告。\n\n通常情况下，当普通用户执行命令时，我们应该保持谨慎。\n\n当我们需要戴上管理员的帽子时，应该极小心。\n\
  \n在某些情况下需要清理或修复时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\
  \n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\
  \n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\n在某些需要时，我们可能需要这些权限。\n\
  \n\n\n\n更多细节将在稍后的章节中介绍。\n\n还记得之前提到的 `cd` 和 `pwd` 命令吗？\n\n现在尝试运行一下这两个命令：\n\n```\n\
  $ cd\n$ pwd\n/home/clu\n```\n\n像这样不带任何参数运行 `cd` 命令，将把我们在 Linux 文件系统中的参考点直接带到自己的用户主目录\
  \ —— 它使用类似于 `/home/{user}` 的完整路径命名。\n\n`pwd` 命令是 “print working directory”（打印工作目录）的缩写，它将显示\
  \ Linux 文件系统中 `cd` 命令带我们所处位置的名称。\n\n我的主目录位于 `/home/clu`。\n\n你的主目录将反映你的用户名。\n\n注意\
  \ `pwd` 的输出在每一层子目录或子文件夹之间包含一个正斜杠（`/`）字符，我们使用它们来帮助指定 Linux 文件系统中的精确位置。\n\n大多数系统可执行程序文件，如\
  \ `df`、`ls` 和 `pwd` 都存储在名为 `/usr/bin` 的目录中。\n\n`bin` 部分是 “binary”（二进制）的缩写，因为那里的大多数程序都是从编写它们的源代码编译成二进制（机器码）的。\n\
  \n查看 Linux 文件系统的倒置树图，我希望你能找到我在那里展示的那两个对象。\n\n`df` 和 `ls` 对象是末端节点 —— 不包含指向其他文件系统对象的链接，且在大多数情况下，这些是普通文件\
  \ —— 而子目录或子文件夹。\n\n可能存在空目录或文件夹。Ubuntu 24.04.2 安装过程创建了名称如 `Desktop`、`Documents` 和\
  \ `Downloads` 等空占位符目录。\n\n另一个异常是位于 `/dev/tty` 的对象 —— 这是一个特殊的设备文件。\n\n## 绝对文件路径\n\
  \n任何以顶部正斜杠（`/`）字符开头的文件路径都被称为绝对路径。\n\n我们将 `/usr/bin/ls` 称为 `ls` 程序文件的绝对路径。\n\n当我们谈论\
  \ Linux 文件系统中某个对象的路径时，听到人们使用如下短语是很正常的：\n\n“slash you ess are, slash bin, slash ell\
  \ ess”\n\n这指的是存储在精确绝对路径位置 `/usr/bin/ls` 的 `ls` 程序。\n\n## 相对文件路径\n\n指定文件系统对象的另一种方法是使用不以\
  \ `/` 开头的相对路径。\n\n这需要更多的上下文。\n\n描述我当前的工作，我可能会说：“我写了一个名为 `teeess.dot.sh` 的小脚本，并将其复制到了我的\
  \ `bin` 目录。”\n\n在这里我没有指定完整（或绝对）路径：\n\n```\n/home/clu/bin/tst.sh\n```\n\n相反，我使用了相对路径并说文件\
  \ `tst.sh` 在我个人的 `bin` 中。\n\n我预计听者知道“我的 `bin` 目录”位于我自己的 `/home/clu` 目录之下 —— 假设他们知道我的用户名\
  \ `clu`。\n\n如果我们使用相对路径而不是绝对路径名称，我们就假设读者或听者知道参考点。\n\n我们希望他们如果不确定，会提问。\n\n资 Linux\
  \ 用户认为，说出那些不构成真实（英语）单词部分的字母名称更清晰 —— 比如 `usr` 和 `ls`。\n\n人们也可以用 ‘user’ 代替拼读 ‘you\
  \ ess are’ 来表示 `usr` 部分 —— 最好对他们宽容宽待一点。\n\n我们通常能根据他们陈述的语境知道他们的意思。\n\n当我们开始使用这些术语时，这些细节开始变得更有意义。\n\
  \n例如，我们可以听到另一个 Linux 用户说：“我运行了 `which` 命令来获取 `ls` 可执行文件的绝对路径。”\n\n在终端窗口中尝试运行该命令：\n\
  \n```\n$ which ls\n```\n\n该命令产生了什么输出？\n\n那是绝对路径吗？\n\n## 命令参数\n\n尝试带这六个参数运行 `which`\
  \ 命令。按所示输入该行，然后按回车键：\n\n```\n$ which cd df du ls pwd which\n```\n\n注意，`cd` 项没有输出！\n\
  \n为什么？因为 `cd` 命令是一个 shell 内置命令，它需要在较低的级别（shell 内部）进行操作。\n\n这是我们作为 Linux 用户不需要完全了解的细节之一\
  \ —— 直到我们开始编写自己的 shell 脚本之类的。\n\n注意，就 `which` 命令所知，其他五个命令可以在 `/usr/bin` 目录中找到。\n\
  \n在 bash shell 中，有一个比 `which` 更好用的命令可以使用 —— 另一个 shell 内置命令，称为 `type`：\n\n```\n$\
  \ type cd df du ls pwd which\ncd is a shell builtin\ndf is /usr/bin/df\ndu is /usr/bin/du\n\
  ls is aliased to ‘ls --color=auto'\npwd is a shell builtin\nwhich is hashed (/usr/bin/which)\n\
  ```\n\n在这里我们看到 `cd` 命令是一个 shell `builtin`（内置命令），`ls` 命令被别名为带有 `--color=auto` 详细选项的自身，而\
  \ `pwd` 命令现在是另一个 shell `builtin`。\n\n很快会有更多关于别名的内容。\n\nshell 保留了关于我们当前工作目录位置的内部信息，不需要搜索\
  \ `pwd` 并运行它来提供它已经知道的信息。\n\n最后一行报告 `which` 被哈希（hashed），因为我已经用过该命令，`bash` shell 已将其加入一个特殊的快速查找哈表，它已经知道在哪里找到这些命令，无需再次搜索。\n\
  \n知道 `bash` shell 采取了所有快捷方式是很好的。\n\n## /usr/share/man\n\n回看 Linux 文件系统的倒置树 —— 右侧的那个长路径是什么？\n\
  \n这是如 `df` 和 `ls` 命令的在线文档或 `man` 页面存储的地方。\n\n这些是通用用户命令，它们的页面文件存储在如下绝对路径：\n\n```\n\
  /usr/share/man/man1\n```\n\n在 `/usr/share/man` 之下还有七个子目录 `man2`、`man3`、`man4` ...,\
  \ `man8`，对应每个章节。\n\n如 `df.1.gz` 和 `ls.1.gz` 等以 `.gz` 结尾的文件意味着这些使用 `gzip` 程序压缩以节省空间。\n\
  \n当我们运行 `man ls` 命令读取在线手册时，压缩文件会被解压并展示给我们。\n\n知道 Linux 正为我们处理所有细节并向我们展示请求的信息很好。\n\
  \n## 文件信息\n\n除了文件名和内容，Linux 系统还维护关于我们存储的文件的其他信息。\n\n仔细查看那个隐藏的 `.bashrc` 文件。\n\n\
  `ls` 命令还有另一个选项 (`-l`) 可以为我们提供更多信息。`-l` 选项是 “long”（长）列表的缩写。\n\n这是使用它时得到的九列输出：\n\n\
  ```\n$ ls -l .bashrc\n-rw-rw---- 1 clu clu 3771 May 28 15:50 .bashrc\n$\n```\n\n\
  **注意：** 上述显示的文件名和其他输出部分可能会因为页面宽度限制而换行。\n\n`ls -l` 命令的输出包含以下九列空格分隔的信息：\n\n1. 前十个字符（`-rw-rw----`）包含一个目录或文件类型位或标志，以及九个访问权限位或标志\
  \ —— 每个都是单个字符。\n\n   第一个横字符（`-`）表示此文件系统对象是一个普通文件。\n\n   这个第一个字符可能是 `c`（字符特殊设备文件）、`d`（目录对象）或\
  \ `l`（指向文件的符号链接 —— 如果感兴趣，可以留作参考）。\n\n   接下来的九个字符显示了三组三个 `rwx` 字符 —— 顺序如下。\n\n  \
  \ 这些是对象所有者 user、对象所有者 group 以及我们系统中所有其他用户的权限位或标志。\n\n   字符 `r` 表示 `read`（读取）访问权限。\n\
  \n\n\n\n- 字符 `w` 表示 `write` 写入权限\n- 字符 `x` 表示 `execute` 执行权限\n- 字符 `-` 表示权限未 `not`\
  \ 授予\n- 这九个字符中的任何一个都可以被横字符 (`-`) 替换 —— 表示从 `user`（用户）、`group`（组）或 `others`（其他）中移除权限位\n\
  \n2. 指向该文件系统对象的链接数\n3. 拥有 `user` 名称标识的对象\n4. 拥有 `group` 名称标识的对象\n5. 文件系统对象的大小（字节字节）以及可选的单位指定符（例如\
  \ `3.7K` 或 `M` 或 `G`、`...`），如果我们添加了 `-h` 选项 —— 这是 `ls -l` 命令中 *human readable*（人类可读）的缩写。\n\
  6. 最后更新的月份\n7. 更新的日期\n8. 更新的时间（小时和分钟），对于更新超过一年前的对象，我们将看到 4 位数的年份\n9. 文件系统对象的名称\n\
  \n对于这个 `.bashrc` 文件，我们可以看到这三组权限位中，用户为 `rw-`，组为 `rw-`，其他为 `---`。\n\n第 3 和第 4 列显示所有者的\
  \ *user* 和 *group* 标识为 `clu` —— 这是我在新安装的 Linux 上选择使用的用户名。\n\n这些权限位意味着 *user* `clu`\
  \ 或任何属于 `clu` *group* 组的 *user* 都可以 *read* (`r`) 和 *write* (`w`) 此文件。\n\n*execute*\
  \ (`x`) 执行权限位被 *denied*（拒绝，设置为横字符 `-`）。\n\n对于 *all*（所有）其他用户，*all* 权限访问位都通过最后三个横字符\
  \ (`---`) 被 *denied*（拒绝）。在第 5 列中，`.bashrc` 文件的大小报告为 3771 。Linux 为我们在文件系统中存储的每个文件和目录维护着十九（19）项\
  \ *metadata*（元数据）（以及更多）。\n\n权限位使 Linux 系统通过比较文件所有者标识符与尝试访问文件的用户标识符，来维持对谁可以访问我们生成的文件的控制。\n\
  \n如果第三组 `rwx` 权限位 *not* 提供用户所需的 *read* 或 *write* 或 *execute* 访问，则会进行更多检查。\n\n如果请求访问的用户没有相同的用户标识符或组标识符，或者\
  \ `rwx` 权限位未授予所需的访问，那么他们将看到 `Permission denied`（权限被拒绝）的错误信息。\n\n知道 Linux 文件系统根据我们选择在文件系统对象上设置的权限位执行这些检查是好的。具有超级用户\
  \ (`sudo`) 权限的用户或具有此类权限的 *malicious*（恶意）程序才能绕过这些安全意图。\n\n## chmod 命令\n\n有一个名为 `chmod`\
  \ 的命令 —— *change mode*（更改模式）的缩写，它允许我们更改具有相应 *owner*（所有者）权限的文件权限位（*access mode*）。\n\
  \n`chmod` 命令知道这三组权限位，并将它们识别为 `u` 代表 *user*（用户）、`g` 代表 *group*（组）、`o` 代表 *others*（其他）。\n\
  \n我们可以在这些 *set* 标识符 (`u,g,o`) 之后加上 `+` 符号来 *add*（添加）权限，或加上 `-` 符号来 *subtract*（减去）权限。\n\
  \n然后我们追加一个、二或三个我们想要 *add* 或 *subtract* 的 `r`、`w` 或 `x` 权限位字母。\n\n当我们制作一个想要 *executable*（可执行）的小型\
  \ shell 脚本时，我们将使用 `chmod` 命令来实现：\n\n```bash\n$ chmod u+x tst.sh\n```\n\n这为拥有命名文件的用户\
  \ (`u`) 添加了执行 (`x`) 权限位。如果我们想为 *user* (`u`) 和 *group* (`g`) 所有者标识符都添加该 *execute*\
  \ (`x`) 权限位，我们可以在一步内完成：\n\n```bash\n$ chmod ug+x tst.sh\n```\n\n## 交互式 shell\n\n\
  我希望你已经成功尝试了 —— 或者你已经熟悉目前为止涵盖的大部分命令。\n\n## 命令补全\n\n交互式 bash shell 包含了简写方法，帮助我们更省力地运行命令\
  \ —— 例如按 `Tab` 键帮助我们补全命令名或文件名。\n\n尝试输入 `hi` 然后按 `Tab` 键。如果没有其他以字母 `hi` 开头的命令，它可能会展开为\
  \ `history`。如果*不是*，我们可以再次按 `Tab` 键获取以该方式开头的命令列表。然后我们可以输入额外的字符为我们想要的命令创建一个唯一的前缀字符串，然后再次按\
  \ `Tab` 键。当它展开为我们想要的命令名时，按 `Enter` 键就会为我们运行它。\n\n有时这非常有用 —— 如果有一列以相同字符字符串开头的命令，则并不总是如此。如果在显示的列表中看到了想要运行的命令，可以使用\
  \ `Ctrl+U` 进行高亮，然后按 Enter 键。\n\n## 命令历史\n\n```bash\n$ date\n```\n\n```bash\n$ history\n\
  ```\n\n```bash\n$ 121\n```\n\n```bash\n$ 122\n```\n\n```bash\n$ 123\n```\n\n```bash\n\
  $ 124\n```\n\n```bash\n$ 125\n```\n\n重新运行其中一个命令的一种方便方法是使用向上和向下键滚动列表，在找到命令后按 Enter\
  \ 键。`bash` shell 提供了更多简写方法来重新运行命令，通过输入感叹号 (`!`) 字符来启动后续：\n\n- `!n`: 指向命令数字 `n`\n\
  - `!-n`: 指向当前命令减去数字 `n`\n- `!!`: 指向上一条命令。这是 `!-1` 的等同词\n- `!string`: 指向以唯一 `string`\
  \ 开头的最近命令\n- `!$`: 指向上一条命令的最后一个单词\n\n如果我们需要使用与上一个命令相同的最后一个参数（如 `ls`）运行另一个命令（如 `less`），我们可以输入：\n\
  \n```bash\n$ ls ~/path/to/file.bash\n$ less !$\npath/to/file.bash\n```\n\n这将运行 `less\
  \ ~/path/to/file.bash`。这可以节省一些输入时间 —— 或者鼠标移动和鼠标复制粘贴操作。与其按向上箭头 20 次，如果我们看到想要重新运行的命令在\
  \ `history` 列表中的命令数字为 `101`，我们可以输入 `!101` 并按 Enter 键。\n\n如果我们已经运行了带有六（6）个参数的 `which`\
  \ 命令，可以尝试输入：\n\n```bash\n$ !wh\nwhich cd df pwd which\n/usr/bin/df\n/usr/bin/du\n\
  /usr/bin/ls\n/usr/bin/pwd\n/usr/bin/which\n```\n\n在我们输入 `!wh` 并按 Enter 键后显示的第一行显示了\
  \ shell 正在为运行的命令副本，接下来的五行显示了该重新运行的 `which` 命令的输出。我们在 `man bash` 中看到足够的内容后按 `q` 键退出。\n\
  \n我也发现名为 `Quick substitution`（快速替换）的项很有用 —— 当我打错命令名或文件名时。\n\n\n\n\n要重新运行 `previous`\
  \ 命令并将其中一个 `old` 字符串更改为 `new` 字符串，我们可以输入一个 `caret` 或 `circumflex`（或“尖顶帽”）符号（`^`），然后是\
  \ `old` `string`，紧接着是另一个 `caret` 或 `circumflex`（或“尖顶帽”）符号（`^`），最后是 `new` 字符串：\n\n\
  > `^oldStr^newStr`\n\n例如：\n\n> `$ lwss file1.txt file2.txt`\n\n> `Command ’lwss’\
  \ not found, . . .`\n\n> `$ ^ws^es`\n\n> `less file1.txt file2.txt`\n\n> `. . .`\n\
  \n我的手指又失误了 —— 只用了七次 (7) 次击键就解决了问题，而不是 25 次（包括 `{Enter}` 键）。\n\n这些 `bash` 历史列表和命令行简写方法得到了我由衷的赞同。\n\
  \n每节省的每一秒或两秒对我都有利！\n\n## 别名命令 (Alias commands)\n\n“bash” shell 提供了一种方法让我们使用它所谓的“别名”（aliases）。\n\
  \n运行 `alias` 命令来显示已定义的别名列表：\n\n> `$ alias`\n\n> `alias l=’ls -CF’`\n\n> `alias la=’ls\
  \ -A’`\n\n> `alias ll=’ls -alF’`\n\n> `alias ls=’ls --color=auto’`\n\n这些 `alias`\
  \ 定义随我新新的 Ubuntu 24.04.2 Linux 安装一起提供。它们在 Linux 中已经存在多年。\n\n阅读 `man ls` 可以发现像 `-A`、`-C`、`-F`\
  \ 等选项以及 `verbose` 选项 `--color=auto` 的含义。\n\n如果我们发现 `ls` 输出中的颜色难以辨认，可以运行命令：\n\n>\
  \ `$ unalias ls`\n\n我更喜欢在白色纸张上阅读黑色的 `printed` 文本 —— 在深灰色（不是纯黑色）的 Terminal 窗口看白色文本\
  \ —— 我知道 —— 我很 `different`！\n\n我们在运行 `ls` 命令时可以添加 `-p` 选项，让它在目录名末尾追加 `/` 标识字符。\n\
  \n为了更永久生效，我们需要调查 Terminal 颜色方案和/或在我们的 `.bashrc` 文件中注释掉该 `ls` 别名。\n\n`alias` 机制非常直接。我们使用命令名\
  \ `alias` 后跟一个 `alias definition`，它由我们选择的 `alias name`、等号 (=) 符号和一个带引号的 `command`\
  \ 字符串组成。\n\n在命令字符串周围使用单引号通常是最好的 —— 如果我们需要在命令内部使用双引号。\n\n如果我们定义了一个与现有别名同名的新别名，新定义将覆盖旧别名\
  \ —— 最好检查一下。\n\n我们可以输入 `alias` 命令，后跟想要使用的新别名 `name`。如果它尚未定义，我们将看到：\n\n> `$ alias\
  \ tryMe`\n\n> `bash: alias: tryMe: not found`\n\n同时运行 `type` 命令来检查没有其他同名的 `command`\
  \ 或 `script` 也是明智的：\n\n> `$ type tryMe`\n\n> `bash: type: tryMe: not found`\n\n\
  否则，我们将看到该命名的 `alias` 定义：\n\n> `$ alias ll`\n\n> `alias ll=’ls -alF’`\n\n或者使用 `type`\
  \ 命令，我们可以看到 shell `builtin`、`alias`、`command` 或 `script` —— 如果它已存在：\n\n> `$ type\
  \ ll`\n\n> `ll is aliased to ‘ls -alF’`\n\n## 添加别名 (Add an alias)\n\n让我们尝试添加一个名为\
  \ `a` 的别名来运行那个 `alias` 命令。记住先检查：\n\n> `$ type a`\n\n> `bash: type: a: not found`\n\
  \n太棒了 —— 可以使用 `a` 作为我们的新 `alias`：\n\n> `$ alias a=alias`\n\n尝试一下新的 `a` 命令。\n\n`alias`\
  \ 并不限于运行 `one` 个命令！\n\n我们可以使用分号（;）`command separator` 字符，并定义一个 `alias` 来运行一系列（series`）命令：\n\
  \n> `$ type c3`\n\n> `bash: type: c3: not found`\n\n> `$ alias c3=\"clear;echo;ncal\
  \ -b -3\"`\n\n> `$ c3`\n\n> `...`\n\n我希望你喜欢这个结果。\n\n`alias` 命令定义周围的一对双引号（`\"...\"\
  `）是必要的，因为存在命令列表以及最后一个 `ncal` 命令中的空格字符。\n\n我们希望整个右侧都被分配给别名 `c3`。\n\n我们可能希望在不给 `ncal`\
  \ 提供 `-b` 选项的情况下获得输出：\n\n> `$ type n3`\n\n> `bash: type: n3: not found`\n\n> `$\
  \ alias n3=\"clear;echo;ncal -3;echo\"`\n\n> `$ n3`\n\n> `...`\n\n我在两个别名中使用了 `ncal`，因为它突显了今天！\n\
  \n想象一下可能性 —— 我们可以定义自己的 `aliases` 来做几乎任何事情。\n\n在交互式 shell 中这样使用 `alias` 命令有一个缺点 ——\
  \ 当我们退出 Terminal 窗口或注销 Linux 时，这些新别名将会消失。\n\n一切并非无法挽回。有一两类方法可以让它们永久化。\n\n一种可能性是将定义的别名列表保存到纯文本文件中。\n\
  \n下次我们登录时，可以使用 `source` 命令恢复这些预先记录的别名。\n\n这需要一点时间，通过 `source` 命令来完成。\n\n## Bash\
  \ 启动 (Bash startup)\n\n为了让这些别名生效，我们需要将它们写入一个特定的文件中。最常见的方法是写入 `.bashrc` 文件。\n\n对于大多数\
  \ Ubuntu 用户来说，`.bashrc` 是在交互式 shell 中自动加载的。\n\n我们可以通过 `cat` 命令查看该文件的内容：\n\n> `$\
  \ cat ~/.bashrc`\n\n如果你想向其中添加别名，可以使用编辑器（如 `nano` 或 `vim`）：\n\n> `$ nano ~/.bashrc`\n\
  \n在文件中添加类似下面的行：\n\n`alias ll='ls -la'`\n\n保存并退出后，运行 `source ~/.bashrc` 使更改立即生效：\n\
  \n> `$ source ~/.bashrc`\n\n现在，你可以使用 `ll` 命令了。\n\n\n\n仔细输入接下来的两个命令。首先，基础的 `cd` 命令确保了我们将在自己的\
  \ `home` 目录下工作。在按下 `Enter` 键之前，请仔细检查两次 `echo` 命令：\n\n```bash\n$ cd\n$ echo \"alias\
  \ h=history\" >> .bash_aliases\n$ $\n```\n\n这条命令中从 `echo` 单词开始有五个 (5) 由空格分隔的部分。\n\
  \n有两个双引号字符 —— 一个在第 2 部分的左侧，一个在第 3 部分的右侧。\n\n我们需要这些引号字符，是因为我们希望第 2 部分和第 3 部分作为*一个*参数传递给\
  \ `echo` 命令，而不是两个。\n\n在 `h` 和 `history` 之间有一个等号 (`=`) —— 在 `h` 字符与 `=` 符号之间没有任何空格。\n\
  \n有两个 (2) 大于符号 (`>>`) 用于将 `echo` 命令的输出发送并*追加*到名为 `.bash_aliases` 的隐藏 (`.`) 文件中，然后我们按下\
  \ `Enter` 键将其交给 shell 处理。\n\n尝试运行这个名为 `h` 的新 *alias* 命令——它应该会再次失败：\n\n```bash\n\
  $ h\nh: command not found\n$ type h\nbash: type: h: not found\n$ $\n```\n\n这就是我们目前预期的。\n\
  \n接下来，在 Terminal 窗口中打开一个新的 `tab` —— 我们可以按下三个 (3) 键组合 `{Ctrl}+{Shift}+{T}`。\n\n或者，我们可以打开一个*新的*\
  \ Terminal 窗口 —— 鼠标右键点击 Terminal 图并选择 `New Window`。\n\n在新的 Terminal 标签页或窗口中，尝试运行我们刚刚添加到\
  \ `.bash_aliases` 文件中的名为 `h` 的新 alias 命令：\n\n```bash\n$ h\n...\n...\n...\n$ $\n\
  ```\n\n我们应该能看到 `bash` shell 的 `history` 命令的输出。\n\n如果这*还没有*作用，请尝试通过输入以下命令在当前 Terminal\
  \ 窗口或标签页中启动一个新的 *login* `bash` shell 实例：\n\n```bash\n$ bash --login\n$ h\n...\n\
  ...\n...\n$ $\n```\n\n作为最后的手段，希望这能有效。\n\n新命令 `h` 是“*history*”的助记符。如果这成功了，那么在合理范围内，我们就可以确定初始化在我们的\
  \ Terminal 窗口中运行的 `bash` shell 进程的 shell 命令文件字符串或序列。\n\n如果 `h` 命令不起作用 —— 可能我们在输入那个看起来很奇怪五部分\
  \ `echo` 命令时犯了错误。\n\n我们可以使用 `Up` 和 `Down` 方向键回到历史列表中的那一行，然后使用 `Left` 和 `Right` 方向键跨越该命令行移动光标，双检是否有额外的或缺失的字符。\n\
  \n我们可以使用 `Backspace` 和/或 `Delete` 键删除任何多余的字符，并输入一个或多个纯文本字符来插入缺失的文本。\n\n这种 `bash`\
  \ shell 命令行编辑功能有时非常有帮助。\n\n如果你已经做到了这里——恭喜你。\n\n## 为什么这很重要？\n\n一方面，这意味着我们可以向 `.bash_aliases`\
  \ 文件中添加更多 `alias` 命令，并期望它们在我们*未来*的 Linux 登录会话可以使用。\n\n为了少输入 `history` 命令名的最后六 (6)\
  \ 个字符，这听起来工作很大吗？\n\n这是一个简单的示例，用于测试 shell 启动序列并确保我们的 `.bash_aliases` 文件被使用。\n\n我使用了几十个\
  \ bash shell alias。它们节省了我的时间。\n\n它们减少了我犯的错误 —— 我只需要将 `alias` 命令较长的右侧以正确格式输入一次，之后只需使用别名即可——像\
  \ `h` 这样简直轻而易举。\n\n是 `bash` shell 在进行*解释*——我只需要将 `alias` 命令较长的右侧以正确格式输入一次，之后只需使用别名即可——像\
  \ `h` 这样简直轻而易举。\n\n\n\n\n如果我们运行两次 `ps` 命令，会发现 `ps` 进程的 `PID` 将是一个*不同*的数字。注意，`bash`\
  \ shell 的 `PID` 保持不变。\n\n如果我们有*另一个*终端（Terminal）窗口或标签页可用，并在其中输入 `ps` 命令，我们会发现 PIDs\
  \ 再次变得不同。每个终端窗口或终端标签页都有其自己的 bash shell 进程*实例*（instance）。\n\n## 前台 .vs. 后台\n\n到目前为止，我们在终端窗口或终端标签页中运行的所有命令一直都在我们所谓的\
  \ `foreground`（前台）模式下运行。\n\n`bash` shell 会为请求的命令启动一个新*进程*，并在运行的命令执行其操作并产生结果时等待——之后，`bash`\
  \ shell 会显示下一个 shell 提示符，表示它已准备好接收我们的更多指令。\n\n还有另一种运行命令的方式——在后台运行。为此，我们要在想要这样运行的命令后面添加一个\
  \ `&` 符号。区别在于，`bash` shell 会几乎立即显示下一个 shell 提示符，然后我们就可以运行另一个命令。\n\n有一个名为 `sleep`\
  \ 的命令，它接受一个十进制数字参数作为我们希望该进程*睡眠*的秒数。\n\n我们可以利用它来进一步了解关于后台进程的信息。\n\n如果我们运行 `sleep\
  \ 10 &`，然后在命令*睡眠*的十秒内，在同一个终端窗口或标签页中尝试以普通的前台模式运行 `ps` 命令——一次或两次——我们可以看到发生了什么：\n\n\
  ```\n$ sleep 10 &\n[1] 3955\n$ ps\n  PID TTY      TIME CMD\n  3120 pts/5    00:00:00\
  \ bash\n  3955 pts/5    00:00:00 sleep\n  3957 pts/5    00:00:00 ps\n$ ps\n  PID\
  \ TTY      TIME CMD\n  3120 pts/5    00:00:00 bash\n  3955 pts/5    00:00:00 sleep\n\
  \  3958 pts/5    00:00:00 ps\n[1]+  Done         sleep 10\n$\n```\n\n我们能够在 sleep\
  \ 进程继续后台运行的同时，在*前台*模式下继续运行 `ps` 命令——直到它数完十秒并被终止。\n\n当 `bash` shell*看到*安符符号（`&`）时，它会报告从\
  \ `[1]` 开始的*后台*作业编号及其进程 ID `3955`，输出为 `[1] 3955`。\n\n当 bash shell 注意到后台进程已终止时，它会通过输出\
  \ `[1]+ Done` 和作业名称 `sleep 10` 来报告。\n\n我们可以在计算机登录会话中打开不同的终端窗口和其他应用程序窗口。\n\n当我们与这些窗口交互并将焦点切换到另一个窗口时，其中一些可以处于*前台*模式，也可以处于*后台*模式。\n\
  \n例如，我们可以有：\n\n*   一个打开了额外 `tabs` 的终端窗口\n*   一个打开了多个标签页的浏览器会话，正在 Google 搜索某个软件、显示明天计划开车距离的\
  \ Maps 页面，以及我们的社交媒体 Facebook 页面等 . .\n*   一个像 Thunderbird 这样的邮件客户端应用程序，我们正在其中撰写回复邮件\
  \ . . .\n*   一个在 `Libre Office Writer` 中打开的文档\n*   一个在 `Libre Office Calc` 中打开的电子表格\n\
  *   一个播放我们喜欢的音乐的音频播放器\n*   以及更多 `...`\n\n当进程完成操作并向我们返回任何输出或错误消息时——系统就会进行清理，将其使用的资源返回到池中，供下一个进程使用。\n\
  \n如果我们发现交互式响应开始变得缓慢和迟钝——我们可能需要为我们的 Linux PC 增加 RAM，或者从机械硬盘升级到 SSD 存储以帮助提高性能。\n\n\
  否则，我们可以记住关闭那些不需要一直运行的非活动应用程序。大多数程序在当我们再次需要它们时可以立即重启。\n\n## 想象一个进程\n\n这是我们想象*进程*的一种方式：\n\
  \n```\n![](img/file1.png)\nimage\n```\n\n每个进程都从三个输入/输出流开始，称为：\n\n1.  `stdin` ——\
  \ “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符） `0`\n2.  `stdout` ——\
  \ “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符） `1`\n3.  `stderr` ——\
  \ “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符） `2`\n\n##进程 io 处理\n\n\
  每个进程都从三个输入/输出流开始：\n\n1.  `stdin` —— “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符）\
  \ `0`\n2.  `stdout` —— “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符）\
  \ `1`\n3.  `stderr` —— “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符）\
  \ `2`\n\n## 命令语法\n\n每个进程都从三个输入/输出流开始：\n\n1.  `stdin` —— “*Standard Input*”（标准输入）的缩写\n\
  \    *   文件*descriptor*（描述符） `0`\n2.  `stdout` —— “*Standard Output*”（标准输出）的缩写\n\
  \    *   文件*descriptor*（描述符） `1`\n3.  `stderr` —— “*Standard Error*”（标准错误）的缩写\n\
  \    *   文件*descriptor*（描述符） `2`\n\n## 重定向追加模式\n\n每个进程都从三个输入/输出流开始：\n\n1.  `stdin`\
  \ —— “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符） `0`\n2.  `stdout`\
  \ —— “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符） `1`\n3.  `stderr`\
  \ —— “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符） `2`\n\n\n\n\n\n如果我们想向一个已存在文件添加（`append`）更多文本，我们需要使用\
  \ ``>` 的变体，并使用*两个*大于号（``>>`）：\n\n```bash\n$ echo \"first out\" > out.txt\n$ echo\
  \ \"next out\" >> out.txt\n$ cat out.txt\nfirst out\nnext out\n$\n```\n\n第二个 `echo`\
  \ 语句使用双符号 `>>` 输出重定向符号将输出*追加*到已存在文件的末尾。\n\n在上一章中，我们看到了一个在运行那个看起来很奇怪的 `echo` 命令时将输出发送到文件的示例：\n\
  \n```bash\n$ echo \"alias h=history\" >> .bash_aliases\n```\n\n那两个大于号（`>>`）导致 `echo`\
  \ 命令进程的标准输出被重定向并发送到名为 `.bash_aliases` 的隐藏文件中。\n\n我使用两个大于号（`>>`），是因为我不想*覆盖*用户可能已经开始使用的名为\
  \ `.bash_aliases` 的任何预存在文件。\n\n使用 `>>` 意味着我们想要将输出*追加*到我们指定的任何预存在文件的末尾。\n\n使用单个 `>`\
  \ 字符重定向输出则意味着我们将*覆盖*我们指定的作为目标的文件。\n\n**请注意：** 我们在使用单个大于号（`>`）或（`2>`）形式的进程输出重定向时需要谨慎——尽管当这正是我们想要的操作时，它是最有益的。\n\
  \n## 退出状态\n\n每个进程还有一个至关重要的输出——它的退出状态（exit status）。\n\n在 Linux（以及 Unix）中，退出状态是一个返回给运行命令进程的\
  \ shell（或其他进程）的小型整数值。\n\n退出值为零（`0`）表示*成功*。\n\n在我们的数字系统中只有一个零（`0`）。我们使用其他值来表示完全成功以外的任何情况。\n\
  \n非零退出值表示存在问题。\n\n我们如何找到退出状态？\n\nbash shell 维护一个名为问号符号（`?`）的特殊变量，用于存储上一个完成操作并退出的命令的退出状态值。\n\
  \n我们可以使用 `echo` 命令来显示变量 `?` 的*值*。\n\n要获取变量的*值*，我们需要在变量名前前加上美元符号（`$`）：\n\n```bash\n\
  $ cd\n$ echo \"$?\"\n0\n```\n\n退出状态为零（`0`）表示*成功*！换句话说，`cd` 命令执行了我们要求的操作，我们可以预期工作目录现在就是我们的家目录。\n\
  \n```bash\n$ cd none\nbash: cd: none: No such file or directory\n$ echo \"$?\"\n\
  1\n```\n\n非零退出值表示存在运行时问题。记得那个*无效*的 `ls -z` 命令吗？\n\n```bash\n$ ls -z\n/bin/ls: invalid\
  \ option – ’z’\nTry '/bin/ls --help’ for more information.\n$ echo \"$?\"\n2\n```\n\
  \n进程是程序/命令的运行实例，可以在 `stdout` 和/或 `stderr` 流上产生输出。\n\n当进程完成它为我们做的事情后，它向 shell 报告其退出状态，以确认操作的*成功*或*失败*。\n\
  \n命令通常会检测不同的运行时错误，并可以使用不同的进程退出状态数字报告它们。\n\n我们可以在编写的 bash 脚本中测试 `$?` 值，并在*成功*时采取一项操作，在检测到非零值时采取另一个或多个操作。\n\
  \n## PATH 变量\n\n`bash` shell 维护一个名为 `PATH` 的特殊变量。我想利用它来帮助探索进程 I/O 重定向的另一个有趣方面。\n\
  \n让我们再次使用 `echo` 命令来看看如果存在 `PATH` 变量，其*值*是什么：\n\n```bash\n$ echo \"$PATH\"\n/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:/usr/local/games:/usr/games\n\
  ```\n\n乍一看很困惑？我们可以注意到有一系列冒号（`:`）字符，每个冒号都分隔了一个*绝对*文件系统路径——例如 `/usr/local/bin` 与它旁边的路径。\n\
  \n`PATH` 变量维护了一个由冒号（`:`）分隔的目录*列表*，`bash` shell 将遍历这些目录来寻找我们输入并请求它为我们运行的可执行程序和命令。\n\
  \n让我们利用该 `PATH` 变量的值检查进程连接的另一个非常有用的部分。\n\n## 管道与过滤器\n\nUnix 和 Linux 系统为用户提供了另一个令人愉快的——几乎是魔法的东西。\n\
  \n有一个特殊字符（`|`）被称为竖线（vertical bar）或管道（pipe）符号，我们可以用它来帮助将一个进程的*输出*连接到另一个进程的*输入*。\n\
  \n让我们用它来帮助 `PATH` 变量中长长的冒号分隔绝对路径列表变得更具读性。\n\n有一个名为 `tr` 的*过滤器*命令——它是字符翻译（translate\
  \ characters）的缩写。我们可以用它将那些 `:` 字符*翻译*为“换行”字符——记得那些反斜杠* `n`（`\\n`）字符吗？\n\n我们可以这样组合一个命令*管道*（pipeline）：\n\
  \n```bash\n$ echo \"$PATH\" | tr \":\" \"\\n\"\n/usr/local/bin\n/usr/sbin\n/usr/bin\n\
  /sbin\n/bin\n/snap/bin\n/usr/local/games\n/usr/games\n$\n```\n\n在使用传递给 `echo` 命令的\
  \ `$PATH` 参数以及传递给 `tr` 命令的两个参数时，加上双引号。\n\n最好在按下 `Enter` 键将该*管道*交给 `bash` shell 之前，确保命令行上的六（6）部分之间各有一个空格。\n\
  \nLinux 中提供了一系列非常有用的*过滤器*命令。我们已经在使用 `less` 分页器来帮助阅读长手册页了。我们很快就会发现其他的——而且没有什么能阻止我们编写自己的*过滤器*。\n\
  \n这意味着我们组合自己的命令的方法大大增加了。当我们发现一个实用的进程*管道*时，可以将其封装成一个新的 `bash` shell*别名*（alias）或*脚本*（script）。\n\
  \n对 `PATH` 变量中的目录列表进行*排序*可能很有用。有一个非常有用的*过滤器*叫做 `sort`——它可以对输入文本行进行排序。如果我们的历史列表中那个\
  \ `echo` 和 `tr` 管道命令的编号是 `1234`，我们可以这样做：\n\n```bash\n$ !1234 | sort\n```\n\n这在 `tr`\
  \ 命令及其两个参数之后又添加了一个管道（`|`）符号，从而将 `tr` 的输出直接交给 `sort`。\n\n## tee 命令\n\n在某些情况下，我们想看到进程或进程管道的输出，*同时*将输出捕获到文件中以后参考。\n\
  \n`tee` 命令可以派上用：\n\n```bash\n$ man tee | tee.txt | less\n$\n```\n\n运行此命令将获取 `man\
  \ tee` 命令的输出，并将其*管道*到 `tee` 命令，将该输出的副本捕获到文件 `tee.txt` 中，并将相同的内容*管道*到 `less` 分页器，这样我们也可以*查看*这些信息。\n\
  \n希望这很好。可以使用 `less` 命令读取 `tee.txt` 的内容获取关于 `tee` 的详情——它有一个 `-a` 可以将内容*追加*到指定的输出文件中，而不是覆盖它（如果该文件已存在）。我们可以将\
  \ `tee.txt` 作为示例文件来练习我们的编辑技能——如果需要的话。\n\n文件包含了单词和标点符号的混合——在 `vim` 中，我们可以学会如何使用单键命令变体如\
  \ `w`、`W` 或 `e`、`E` 将光标移动到这些位置并跳过这些文本对象。\n\n# 文件内容\n\n当我们更详细地查看 Linux 文件系统时，我们考虑了系统为我们存储的每个文件的元数据。让我们仔细查看那个隐藏的\
  \ `.bash_aliases` 文件。\n\n该文件有多大？使用 `ls` 及其 `-g` 和 `-o` 选项来抑制*所有者*和*组*名称——以节省一点行空间：\n\
  \n```bash\n$ ls -g -o .bash_aliases\n-rw-rw---- 1 16 May 28 15:50 .bash_aliases\n\
  ```\n\n\n\n\n\n我喜欢 `ls -l` 的这种缩短版本，并为它写了了自己的 `alias`：\n\n```bash\n$ alias lgo='ls\
  \ -go'\n```\n\n在第 3 列中，`.bash_aliases` 文件的大小报告为 16 字节。\n\n我们用来写入该文件的 `echo` 命令在双引号（`\"\
  ...\"）字符之间似乎有 15 个字符！\n\n它看起来是：\n\n```bash\n$ echo \"alias h=history\" >> .bash_aliases\n\
  ```\n\n我们期望在该文件中找到字符串 `alias h=history` —— 或者如果它之前已经存在，则至少在最后一行。\n\n## 文件显示\n\n\
  有一个名为 `cat` 的命令——它是 `concatenate and print files`（连接并打印文件）的缩写——这是一个用于显示一个或多个文件内容的实用程序。\n\
  \n让我们使用 `cat` 来仔细检查该文件的内容：\n\n```bash\n$ cat .bash_aliases\nalias h=history\n$\n\
  ```\n\n我预计我们可以数出 15 个字符——一个空格算一个。\n\n`echo` 命令在将其输入参数回显到输出之前，剥掉了那两个双引号（`\"`）字符。\n\
  \n名为 `wc` 的命令——它是 `word count`（字数）的缩写——可以在此提供帮助。\n\n当给定输入文件时，`wc` 命令将统计其中找到的行数、单词和字符数。\n\
  \n如果我们创建的隐藏文件上运行 `wc` 命令，它可能会报告：\n\n```bash\n$ wc .bash_aliases\n 1  2  16 .bash_aliases\n\
  $\n```\n\n它报告了 1 行、2 个空格分隔的单词和 16 个字符。\n\n为什么 `ls` 和 `wc` 报告 16 字节或字符呢？\n\n文件中有什么？\n\
  \n让我们使用另一个名为 `od` 的命令——它是 `octal dump`（八进制转储）的缩写来向我们展示更多细节。\n\n`od`（八进制转储实用程序）有一个\
  \ `-c` 选项，请求输出纯文本字符：\n\n```bash\n$ od -c .bash_aliases\n0000000  a l i a s     h\
  \ = h i s t o r y \\n\n0000020\n$\n```\n\n在这里，它从我们指定的隐藏 `.bash_aliases` 文件中读取输入，并将输出显示回我们的终端。\n\
  \n左侧填充零的七位数字显示了该行显示的第一个字符的计数数字——以八进制表示——从零开始。\n\n正如我们看到的，最右侧有一个两个符号的 `\\n` 字符。\n\
  \n观察差异的原因是 Linux 使用了一个行结束字符——它被称为“换行符”（newline）。\n\n这是 ASCII 字符 `LF` 或 `{Ctrl}+{J}`\
  \ 或换行控制代码——除了通过将我们的光标移动到下一行的动作外，否则它是不可见的。\n\n除非我们告诉 `echo` 命令不要这样做，否则它总是会通过添加一个换行符来结束其输出。\n\
  \n如果 `echo` 不这样做，我们的下一个系统提示符将显示在 `echo` 输出行的末尾——而不是在一个新的、更可见的行上。\n\n那两个符号字符是 `od`\
  \ 和其他实用程序表示 Linux 行结束“换行符”字符的方式。\n\n我希望这是有道理的，并有助于说明 Linux 确实知道自己在做什么。\n\n`ls -l`\
  \ 命令非常准确地报告了其文件大小信息。\n\n`wc` 命令以同样的准确性报告了它看到的内容。\n\n`cat` 命令以同样的准确性显示了文件内容——我们需要为了显而易见的换行符多数一个——它隐藏在眼皮底下。\n\
  \n要查看没有换行符的输出是什么样子——尝试运行此命令：\n\n```bash\n$ printf \"Output without a newline\"\n\
  Output without a newline$\n```\n\n下一个 shell 提示符显示在哪里了？\n\n## 更多 shell 设置\n\n在之前的章节中，我提到\
  \ `bash` shell 会从我们 `home` 目录下的另一个名为 `.profile` 的隐藏文件中读取信息，帮助设置 shell 变量。\n\n其中一个变量名为\
  \ `PATH`——我们已经见过了。\n\n在 `.profile` 文件中，这个 `PATH` 变量可以通过我们的 `$HOME/bin` 目录进行扩展。\n\
  \n为什么这很重要？\n\n这个 `PATH` 变量包含了 `bash` shell 以及其他程序和应用程序进程将用作搜索位置系统目录路径列表，用于定位我们需要运行的可执行命令。\n\
  \n如果我们用自己的 `bin` 目录扩展它，那么就可以把自己的 `bash` shell、Python、`R` 以及其他脚本和/或编译的二进制程序添加到该位置，并期望\
  \ `bash` shell 为我们找到它们。\n\n当 shell 设置过程读取我们 `.profile` 文件中像这样的行时，可以为我们完成此：\n\n```bash\n\
  # set PATH to include user’s bin if it exists\nif [ -d \"$HOME/bin\" ] ; then\n\
  \    PATH=\"$HOME/bin:$PATH\"\nfi\n```\n\nGak！乱码（Gobbledegook）！\n\n这有一行以井号（`#`）字符开头的注释。\n\
  \n接下来的三行包含 `bash` shell 条件代码，请求：\n\n“如果存在一个名为 `\"$HOME/bin\"` 的目录（`-d`），则将该目录和冒号（`:`）插入到现有值（`$PATH`）的开头，以扩展并重新定义（`=`）现有的\
  \ `PATH` 变量”。\n\n`fi` 语句标记了 `if` 语句开始的条件代码的结束。\n\n在 `bash` shell 语言中有一个 `case` 语句，用它的反写\
  \ `esac` 结束。\n\n三个循环结构 `for-do-done`、`until-do-done` 和 `while-do-done` 并不用 `od`\
  \ 关键字结束，因为那个被我们见过的 `octal dump` 实用程序使用了。\n\n关键字 `done` 结束 `bash` shell 的 do 循环。\n\
  \n恭喜。我们可以读一点 `bash` shell 脚本代码了！\n\n信息太多？请再等我一下。\n\n`HOME` 变量包含什么？\n\n## HOME 变量\n\
  \n当我们输入美元符号（$）并在其右侧加上 shell 变量名时，`bash` shell 会展开该命名变量以返回其值——如果有的话。\n\n我们可以使用 `echo`\
  \ 命令来帮助查看结果。这是我的操作以及得到的结果：\n\n```bash\n$ echo \"$HOME\"\n/home/clu\n$\n```\n\n记得第一个\
  \ `$` 是我的系统提示符。第二个 `$` 必须紧挨 `HOME` 单词的 `H` —— 变量名。\n\n## 关于 PATH\n\n最初那个 `PATH`\
  \ 列表并不包含我们的 `/home/{user}/bin`。\n\n通过利用那些代码行中的规定，我们的 `$HOME/bin` 目录将被插入到 `PATH`\
  \ 变量的开头。\n\n**注意：** 我更倾向于将自己的 `$HOME/bin` 目录插入到系统 `PATH` 的末尾，因为这意味着如果我不小心写了一个与现有命令同名的命令，我就不会用我的尝试覆盖它。\n\
  \n我需要为我的命令换一个名字。\n\n其他人可能喜欢写自己的系统命令——我没那么聪明。\n\n我们如何添加新的 `bin` 目录？\n\n我们可以使用 `Files`\
  \ 应用程序，并在我们的 `Home` 文件夹中选择菜单操作 `File-> Create New Folder`并将 `Untitled Folder` 重命名为\
  \ `bin` ——如果我们想做的话。\n\n糟糕！\n\n## mkdir & rmdir\n\n有一个名为 `mkdir` 的命令——缩写是你猜对了——`make\
  \ directory`（创建目录）。\n\n我们可以使用这个命令创建自己的目录，如 `bin`、`dev`、`pdf`、`src` 和 `txt`——任何我们认为有用的。\n\
  \n我喜欢将我的开发文件与 `bin`、`src` 目录以及通用 PDF 文件分开放在 `pdf` 目录，这样我可以在那里找到它们——并且减少了主目录的混乱。\n\
  \n为了创建我们自己的 `bin` 目录，我们可以使用命令：\n\n```bash\n$ cd\n$ mkdir -v bin\nmkdir: created\
  \ directory ’bin’\n$\n```\n\n这并不难。\n\n首先 `cd` 是为了预防，确保我们在自己的主目录中工作。\n\n`mkdir` 命令在我们当前工作目录中创建指定的新目录——除非我们需要指定更详细的路径。\n\
  \n`-v` 选项是 `verbose`（详细）的缩写——并让 `mkdir` 报告它做了什么。\n\n我总是觉得这比使用 `Files` 应用简单得多。\n\n\
  \n\n\n现在，当我们下次注销并重新登录 Linux 系统时，我们在 `.profile` 文件中看到的那段条件代码就会识别到我们自己的 `bin` 目录。\n\
  \n如果我们想在不注销并重新登录的情况下测试这一点，可以尝试在 `Terminal` 窗口或标签页中运行带有 `-l` 或 `--login` 选项的 `bash`以获取一个新的登录\
  \ shell 实例。\n\n接下来尝试再次运行那个 `echo $PATH` 命令：\n\n```bash\n$ echo \"$PATH\" | tr \"\
  :\" \"\\n\"\n/home/clu/bin\n/usr/local/bin\n/usr/sbin\n/usr/bin\n/sbin\n/snap/bin\n\
  /usr/local/games\n/usr/games\n$\n```\n\n这似乎已经找到了我的 `/home/clu/bin` 目录。\n\n我们可以输入\
  \ `exit` 命令关闭第二个 bash shell。\n\n当我们需要目录和子目录时，可以使用 `mkdir` 命令配合 `-p` 选项。`-p` 选项是\
  \ `parents` 的缩写，它确保父目录和指定的子目录都会被实例化。例如，我喜欢为 `python` 脚本和 `shell` 脚本分别拥有独立的目录。在这里我添加了\
  \ `-p`（parents）和 `-v`（verbose，详细模式）选项来显示其操作：\n\n```bash\n$ cd\n$ mkdir -p -v dev/{py,sh}\n\
  mkdir: created directory 'dev'\nmkdir: created directory 'dev/py'\nmkdir: created\
  \ directory 'dev/sh'\n```\n\n我在 bash shell 中使用了另一种简写方法，使用大括号 `{}` 和逗号分隔的名称列表，shell\
  \ 将将其展开为各个路径：`dev/py` 和 `dev/sh`。`man bash` 页面将其称为 `Brace Expansion`（大括号展开）。`-p`\
  \ 选项确保初始 `dev` 目录也被创建了。在一个新的 Linux 安装中，也会运行：\n\n```bash\n$ cd\n$ mkdir -p -v src/{py,sh}\n\
  mkdir: created directory 'src'\nmkdir: created directory 'src/py'\nmkdir: created\
  \ directory 'src/sh'\n```\n\n如果我们永远删除一个目录，有一个名为 `rmdir` 的命令可以做到。目录必须是空的，`rmdir`\
  \ 才能工作——否则它会报错：\n\n```bash\n$ rmdir old\nrmdir: failed to remove 'old':\nDirectory\
  \ not empty\n```\n\n这是一个合理的保护措施。\n\n## 写一个脚本\n\n假设我们要写一个名为 `td.sh` 的小型 bash 脚本——作为一个实验。如果我要写一个像\
  \ `td.sh` 的新 shell 脚本——特别是如果我不想给它 `.sh` 后缀，我将运行 bash shell 的 `type` 命令来双重检查这个不存在的文件：\n\
  \n```bash\n$ type td\nbash: type: td: not found\nbash: type: not found\n$\n```\n\
  \n很好。我希望看到 `type` 显示 `not found`！假设我们要使用这五行 bash 脚本代码：\n\n```bash\n#!/usr/bin/bash\n\
  echo \"Today is \"\ndate +\"%A %F\"\necho\n```\n\n第一行指示 Linux 系统使用 `/usr/bin/bash`\
  \ shell 来解释脚本内容。带有前两个字符 `#!` 的行被称为 \"hashbang\" 行。在其他 Linux 脚本开头（例如 Python 和 R 语言），我们会找到这些内容：\n\
  \n```bash\n#!/usr/bin/env python3\n```\n\n以及\n\n```bash\n#!/usr/bin/env R\n```\n\
  \n`td.sh` 中的下一行包含一个不带任何参数的 `echo` 命令打印空行。之后是一个 `printf`（格式化打印）语句，后面跟着带有特殊参数 `+\"\
  %A %F\"` 的 `date` 调用以及另一个 `echo` 命令。查看 `man date` 获取关于格式符 `%A` 和 `%F` 的信息。`echo`\
  \ 命令在结尾总是产生一个换行，除非我们指示它不要这样做。`printf` 命令结尾不会产生任何换行，除非我们指示它打印一个。我想要 `date` 命令的输出紧跟在\
  \ \"Today is \" 前缀后面。使用你喜欢的编辑器插入这五行并将其保存到名为 `td.sh` 的文件中——我总是使用 `vim` 作为我的编辑器。如果你还没有习惯使用\
  \ Linux 编辑器，有一个名为 `ed` 的有趣的行编辑器可以构建这样一个小型 shell 脚本——这并不困难：\n\n```bash\n$ ed\na\n\
  #!/usr/bin/bash\necho \"Today is \"\ndate +\"%A %F\"\necho\n.\nwq td.sh\n```\n\n\
  除了我的 shell 提示符（`$`）之外，逐行输入每行并在行尾按 `Enter` 键。单独行的 `a` 是 `ed` 的追加命令。接下来我们输入那五行 shell\
  \ 脚本。单独行的 `.` 是 `ed` 命令，用于结束输入并返回命令模式。`wq` 命令行是 `ed` 命令，将其写入（w）到指定的文件（`td.sh`）然后退出（q）回到\
  \ shell。\n\n当我们完成最后一行时，它应该输出写入文件 `td.sh` 的字符数（`59`），然后显示我们的下一个 shell 提示符。记得我们可以使用\
  \ `cat` 和 `od -c` 命令详细检查文件内容——它看起来和我的五行完全一样吗？GNU `ed` 命令的文档在 `info` 工具中维护，我们可以通过运行它来读取\
  \ info 页面：\n\n```bash\n$ info ed\n```\n\n如果有时间，非常值得一读。GNU `ed` 编辑器是同名原始 Unix 行编辑器的复制版本。那个\
  \ 55 年前的软件逻辑今天仍然以同样完美的方式运行！运行我们新的 `td.sh` shell 脚本的方法是：\n\n```bash\n$ bash td.sh\n\
  . . .\n```\n\n有一种更好的方法。\n\n## 使用 chmod\n\n接下来，我们需要确保使用 `chmod` 命令——change mode 的缩写，来赋予我们的\
  \ shell 脚本执行（execute）权限：\n\n```bash\n$ chmod u+x td.sh\n```\n\n参数 `u+x` 意味着为拥有指定文件的用户添加\
  \ `x` 权限位。我们可以在编写脚本的地方通过输入命令来测试我们的 shell 脚本：\n\n```bash\n$ ./td.sh\n```\n\n开头的点（`.`）和正斜杠（`/`）字符指示在\
  \ Terminal 中运行的 bash shell 在当前目录搜索 shell 脚本 `td.sh`。单点（`.`）是当前目录的缩写。双点（`..`）是父目录的缩写。如果我们\
  \ `cd` 进入子目录并想返回父目录，可以运行 `cd ..` 回那里——这有时非常有帮助。\n\n\n\n\n\n`-i` 选项——`interactive`（交互式）的记忆符——会让\
  \ `cp` 在目标文件已存在时向我们警告。我们可以选择覆盖现有文件，也可以完全停止进程。\n\n如果我们选择在 `$HOME/dev/sh` 下的新开发目录中构建那个\
  \ `td.sh` 壳脚本——假设我们现在就在那里工作——我们可以通过以下命令将其复制到我们自己的 `bin` 目录：\n\n```bash\n$ cp -p\
  \ -i td.sh $HOME/bin\n```\n\n或者：\n\n```bash\n$ cp -p -i td.sh ~/bin\n```\n\n我们可以在\
  \ `bash` shell 中使用波浪号（`~`）元字符作为 `$HOME` 目录的快捷。\n\n请注意，如果我们在波浪号周围加上引号，shell 将不会展开它！请看以下结果：\n\
  \n```bash\n$ echo ~\n/home/clu\n```\n\n以及：\n\n```bash\n$ echo \"~\"\n~\n```\n\n\
  使用 `mv` 命令，我们发现它没有 `-p` 选项——因为它会将文件的位置连同文件权限一起移动到目标文件或目录。\n\n如果我们决定重命名壳脚本以便调用为 `today`，我们可以在使用\
  \ `type` 命令检查后执行此操作：\n\n```bash\n$ type today\nbash: type: today: not found\n```\n\
  \n这是可以免费使用的。现在重命名脚本：\n\n```bash\n$ mv -i td.sh today\n```\n\n或者甚至：\n\n```bash\n\
  $ mv -i td.sh ~/bin/today\n```\n\n下次我们登录 Linux 系统时，我们应该发现仍然可以通过输入它的名称来运行新的 bash\
  \ 壳脚本——而无需告诉 shell 去哪里寻找它：\n\n```bash\n$ td.sh\n```\n\n或者：\n\n```bash\n$ today\n\
  ```\n\n如果我们选择了重命名脚本的话。\n\n尝试运行 `type td.sh`。\n\nLinux 在我们背后做了很多工作——例如在后台通过查找我们的\
  \ `PATH` 变量来定位我们尝试运行的命令名称。\n\n当我们决定一个文件不再需要时——在使用 `rm` 命令删除它之前，我们应该三思一下：\n\n```bash\n\
  $ rm td.sh\n```\n\n当一个文件被删除时——它就永远消失了。\n\n我经常会创建一个 `junk` 目录并将代码碎片移动到那里，直到我确定那里的代码碎片已被拒绝且不再需要保留——然后我可以进行清理：\n\
  \n```bash\n$ rm -i ~/junk/*\n```\n\n以移除我已经处理完的部分。\n\n我倾向于编写大量的代码片段，以帮助向自己证明我想使用的代码将按照我希望和预期的方式运行。\n\
  \n我不认为这是在浪费时间和精力——相反，它为以后节省了几个小时的调试时间——因为随着脚本规模增大和复杂性增加，调试过程会变得更加困难。\n\n我的工作方法之一是“写两个”并“丢弃一个”。\n\
  \n我并不总能在第一次尝试就得到最佳解决方案。\n\n对代码片段进行实验并制作几个版本的脚本，让我有时间评估我编写的代码，完善我的工作并选择最佳的选项（们）。\n\
  \n在一天或两天的时间内，最好的代码片段会被选中并进入我预期的完成并发布的最终候选脚本中。\n\n如果我正在对现有的脚本进行修改，我发现测试一小段代码更好，这可以让我证明一种新方法或处理变量、文件或逻辑测试的方式——确保我的代码将按照我设想的方式运行——在我尝试将其整合到现有脚本之前。\n\
  \n假设我正在为我的名为 `abc.sh` 的脚本添加新功能，并且我在当前目录下有它的副本。我在一个名为 `frag.3` 的文件中有一段代码片段，我想将其添加到\
  \ `abc.sh` 的第 147 行之后。可以通过运行以下命令来确定行号：\n\n```bash\n$ cat -n abc.sh | less\n```\n\
