    Notice those four file names start with a dot (‘`.`’) character.


    We call these “*hidden*” files because when we run an ‘`ls`’ command without any
    *options* or *arguments* the *hidden* files do not get shown — it makes the file
    listing a bit cleaner or easier to read.


    What is an ‘`option`’ or an ‘`argument`’?


    If we want to see those *hidden* files then we can add a blank space and the *option*
    “`-a`” after the ‘`ls`’ command name:


    > `$ ls -a {Enter}`


    The output could look like this:


    > | `.bash_history` |  | `Downloads` |  | `Public` |


    > | `.bash_logout` |  | `Music` |  | `snap` |


    > | `.bashrc` |  | `Pictures` |  | `Templates` |


    > | `Desktop` |  | `.profile` |  | `Videos` |


    > | `Documents` |  |  |  |  |


    Easy enough — the ‘`-a`’ *option* is mnemonic for “*all*” files.


    Another way to list *hidden* file(s) is to provide those file names as one or
    more *arguments* to the ‘`ls`’ command:


    > `$ ls .bashrc .profile {Enter}`


    > `.bashrc   .profile`


    ## Why those files?


    The ‘`.bash_history`’ file keeps a list of the commands we run making it easier
    to re-run any of those. Try running:


    > `$ history {Enter}`


    We can use the Up and Down arrow keys on our keyboard to traverse up and down
    that list and can press the ‘`{Enter}`’ key to re-run the command displayed at
    our system prompt.


    This `bash` shell short-hand can be a time saver.


    The ‘`.bash_logout`’ file contains one or more commands that get run when a *login*
    ‘`bash`’ shell terminates in a full screen console.


    The ‘`.bashrc`’ file contains commands that get run when a non-login interactive
    instance of a ‘`bash`’ shell starts to run.


    One of those gets run when we enter most Linux commands.


    The trailing letters ‘`rc`’ is mnemonic for “*run commands*”.


    The ‘`.profile`’ file contains other commands the ‘`bash`’ shell uses to set shell
    *variables* and read instructions from other files to help the ‘`bash`’ shell
    work in a consistent manner.


    Later we will find out how to make changes to one or two of those files to help
    us work in efficient ways for the tasks we want to achieve.


    How do I know these details? We find the information in the ‘`man`’ pages.


    ## Man pages


    Most commands have what we call a ‘`man`’ — mnemonic for “*manual*” — page. A
    document that describes the operation of the command and has a list of the *options*
    and types of *arguments* we can use with that command.


    We can read those ‘`man`’ pages with the ‘`man`’ command. For example:


    > `$ man ls {Enter}`


    That results in a long document getting displayed inside our Terminal window inside
    another helper program called a pager or a paginator that will filter the output
    from the ‘`man`’ process and display the long text as one page at a time. This
    helps us to read the information with ease.


    We can press the ‘`space bar`’ to move *forward* a page and press the ‘`b`’ key
    to move *back* a page. Pressing the ‘`q`’ key will ‘*quit*’ from displaying that
    `man` page — taking us back to our next shell prompt.


    There’s two or three of these ‘`pager`’ programs. Back in Unix days there was
    one called ‘`pg`’ and then another called ‘`more`’. My new Ubuntu 24.04.2 installation
    uses an *improved* one called ‘`less`’.


    At first sight the information contained in the Linux ‘`man`’ pages can get overwhelming.
    Don’t lose heart.


    The ‘`pager`’ program that gets used to help us read that information has helpful
    features to let us navigate those detailed documents with considerable ease.


    While reading a long `man` page document we can press the forward slash ‘`/`’
    key followed by a *keyword* or *phrase* and then the `Enter` key to *search* for
    and *move* to that *search term* — if it exists.


    If that gets us nowhere — try again using the prefix of the word and refine that
    as we go — or choose another keyword.


    When our *search* *keyword* finds a match we can press the ‘`n`’ key to take us
    to the *next* instance of the *search term* — if any.


    We can press the ‘`h`’ key — mnemonic for *help* to let us see a long list of
    other commands we can use inside that ‘`man`’ page display process.


    When we have seen enough press the ‘`q`’ key to *quit* the *help* list and press
    another ‘`q`’ to *quit* from the document we were reading if we have finished
    browsing that.


    As we could expect there’s a *man* page for the ‘`man`’ command itself. The ‘`man`’
    command has a most helpful ‘`-k`’ *option* — mnemonic for “*keyword*”.


    This can help us find a list of commands that mention a specified *keyword* in
    their command *description* lines.


    ## Disk space


    Using a short *keyword* with the ‘`-k`’ option of the ‘`man`’ command can return
    a *long* list of man page command description entries — for example a single term
    like ‘`space`’ returns a long list of matching items:


    > `$ man -k space {Enter}`


    > `.` `.` `.`


    We can use a dot (‘`.`’) character between words to replace the single space separating
    two words — to help us narrow down the list of matching items.


    Suppose we tried the term ‘`file.space`’:


    > `$ man -k file.space {Enter}`


    > `du (1) - estimate file space usage`


    > `fallocate (2) - manipulate file space`


    > `posix_fallocate (3) - allocate file space`'
