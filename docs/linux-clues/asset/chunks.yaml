  trans: '


    输出的第二列中括号里的 `1` 告诉我们，这些手动页来自在线文档的第 `1` 节，因此这些是我们可以运行的通用命令。


    不要尝试运行来自不同手册章节的条目——其中大部分内容都是库文件的描述等。


    如果我们运行 `man man` 命令，就可以找到这些不同章节的列表——例如“System calls”（系统调用）和“Library calls”（库调用）——这些对于软件开发者至关重要。


    我们可以尝试运行 `man -k games` 来查找其他我们*可以*运行以消遣时间的程序列表——在空闲时间——在第 `(6)` 节中通常有一些我们可以在个人
    Linux PC 上运行的内容。


    回到 `Disk space`（磁盘空间）. . .


    接下来，我们可以尝试使用搜索词 `space.usage`：


    ```bash

    $ man -k space.usage {Enter}

    ```


    ```bash

    df (1) - report 文件系统磁盘空间使用情况

    du (1) - 估计文件空间使用情况

    ```


    单词需要在手动页描述中按该顺序出现。


    尝试运行 `df` 命令查看它提供了什么信息：


    ```bash

    $ df {Enter}

    ```


    信息太多？这是有道理的。


    命令 `df` 是 “disk free”（磁盘可用）的缩写——查看 `Available`（可用）和 `Use%`（使用率）列。使用超过 75% 可能意味着是时候增加存储了。


    我们可以在 `df` 命令中使用 `-h` 选项——显示更“人类可读”的数字。


    `-h` 选项会在字节数后适当显示 `K`、`M` 或 `G`：


    ```bash

    $ df -h {Enter}

    ```


    详情详情阅读 `man df`。


    `du` 命令是 “disk usage”（磁盘用量）的缩写。我经常在使用它时配合 `-h` 和 `-s` 选项。


    `-s` 选项是 “summary”（摘要）的缩写，它报告一个汇总数字，而不是为当前位置下的每个目录或文件夹报告一个磁盘使用数字：


    ```bash

    $ du -s -h {Enter}

    ```


    或者：


    ```bash

    $ du -sh {Enter}

    ```


    通常我们可以像这样组合两个选项——并不总是如此——如果命令不允许我们这样做，它会报错。


    运行 `du -h`（不带 `-s` 选项）将为当前目录下找到的每个文件和目录列出一行——这可能包括许多由文字处理器、电子邮件客户端等程序使用的文件——我们从未想过系统需要为我们存储这些文件。


    如果我们检查 `du` 命令的 `man` 页，可以使用类似 `/ -s` 的搜索词来导航到描述 `-s` 选项的条目，在 `/` 字符*之后*和我们要 `-s`
    *之前*留一个空格。


    为什么？因为大多数描述其选项的 `man` 页章节会以左侧留有空格缩进的行开头，在每个 `-h` 和 `-s` 等项目之前。


    ## User id（用户 ID）


    Linux 系统上的每个用户都有自己的用户标识和组标识符——从 1000 开始，并且是一个以自身组开头的一个多个组的成员。


    另一个名为 `id` 的双字符命令将显示一组标识符字符串，如 `uid`——用户标识符、`gid`——组标识符和 `groups`——我们拥有管理员权限的系统组列表：


    ```bash

    $ id {Enter}

    uid=1000(clu) gid=1000(clu) groups=1000(clu), 4(adm), 24(cdrom), 27(sudo), 30(dip),
    46(plugdev), 100(users), 114(lpadmin)

    ```


    `groups=1000(clu)` 之后的大部分条目的是某些时候我们需要访问的系统管理组列表。


    如果我们的 Linux 系统上有另一个名为 `alex` 的用户，我们可以通过运行以下命令查看其用户 ID 和组访问：


    ```bash

    $ id alex {Enter}

    uid=1011(alex) gid=1011(alex) groups=1011(alex),100(users)

    ```


    还有另一个名为 `groups` 的相关命令，将产生用户所属的组名列表。


    运行 `groups` 命令得到的输出会少一点：


    ```bash

    $ groups alex {Enter}

    alex : alex users

    ```


    该用户对系统组没有管理员权限。如果他们*需要*此类权限，可能需要请求管理员为他们运行某些命令。


    他们可以请求管理员为他们的工作和其他项目安装所需的新软件。


    务必仔细考虑其他人请求管理员使用该特权系统管理员权限来做什么。


    组编号和名称——在某些时候不同的 Linux 系统之间可能会有所不同。


    组列表存储在一个可读的纯文本系统文件中，该文件位于 `/etc/group`。


    详情请参：`man group`。


    ## Administrator privilege（管理员权限）


    安装 Linux 的人员创建的第一个账户（管理员）会被添加到其他组中，以便他们能够使用 `sudo` 命令运行管理员命令。


    多用户 Linux 服务器上的并非所有用户都需要管理员权限。这种访问权限必须限制在一两个个*必须*拥有此类权限以执行任务的人身上。


    我们不会向任何人分发管理员权限。


    我们如何识别那些不会滥用这种扩展组管理员权限所带来的权限的可信任个人呢？


    考虑这种权限的深度需要一段时间。


    我们需要仔细查阅文档，注意关于使用和滥用的警告。


    通常情况下，当普通用户执行命令时，我们应该保持谨慎。


    当我们需要戴上管理员的帽子时，应该极小心。


    在某些情况下需要清理或修复时，我们可能需要这些权限。


    在某些需要时，我们可能需要这些权限。


    在某些需要时，我们可能需要这些权限。


    在某些需要时，我们可能需要这些权限。


