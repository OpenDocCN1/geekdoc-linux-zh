    Making use of `process` i/o redirection and the ability to construct process pipelines
    to extend and customise the chains of processing my shell scripts can perform
    — gives me a capability I find difficult or near impossible to achieve in any
    of the other computer systems I have tried to use.


    Learning to harness the power of the `RE` (`regular expression`) will pay dividends
    well into the future — I am always delighted when these provide the answer to
    yet another problem.


    Making use of a handful of the methods I have discussed can make all the difference
    to a project or business that struggles to meet its deadlines and targets.


    Freeing up human resources to focus on difficult issues that need human interaction
    makes sense to me.


    Automating repeatable processes makes sense to me.


    Utilising available computer resources makes sense to me.


    Yes — that takes people power too.


    The extensive Linux tool-box of standard `commands` and tools to help write customised
    `scripts` and easy to type `aliases` makes sense to me.


    Starting slow and building capability as we learn and absorb information about
    the flexibility and capability of Linux make sense to me.


    Before we realise we will have amassed a body of knowledge to help us handle our
    information processing tasks with more ease.


    When we hit a snag we have `man` pages and `info` pages and `tutorial` programs
    and on-line documents we can turn to for almost every need.


    Anything we perceive to be `unfriendly` in Linux soon becomes closer than a friend
    as we come to rely upon the power and the repeatability these `trustworthy` —
    `work together` — software tools provide.


    If we could learn everything there is to know about Linux in next to no time we
    would find we would tire of its inability to support our needs.


    Instead I have been working with and learning about Linux for decades and I never
    grow tired of discovering new features and learning more ways it can help me on
    a continual basis.


    I wish you well in your Linux pursuits.


    Each to their own. We need to find what works for us.


