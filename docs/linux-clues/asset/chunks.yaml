    No output — that’s good.


    There’s no difference to report. The files compare as the same.


    Remember: No news is good news.


    Why ever would you want to use the commands ‘`tac`’ and ‘`rev`’ in real life?


    Consider this — having finished a lengthy report document or computer program
    our reviewers provide us with lists of their suggested updates and amendments.


    Their suggestions could include page numbers, section numbers, paragraph numbers
    and line numbers referring to the locations where amendments need to get considered
    and made.


    If we started work on the suggestions of one reviewer and made amendments before
    looking at the suggestions of the next and any other reviewers — the line numbers
    and other reference points could get difficult to locate.


    If we were to start at the top of their combined list and work our way down to
    the end then if we added or subtracted any significant parts of text those reference
    numbers further down the file could become more difficult to identify in an updated
    document.


    One way around this issue is to start with the last item first and work our way
    back up the list instead — towards amendment references at the top of our lengthy
    document or program.


    Here’s one place for the use for ‘`tac`’ — to produce their suggestions list in
    reverse order. It’s easy to write a shell command (or script) to read a *reversed*
    list and fire up our editor (like ‘`vim`’) at each of those referenced lines in
    turn!


    Say we had a small file called ‘`ed-lns.txt`’ containing a list of the necessary
    line edits for a file called ‘`new.doco`’:


    > `$ cat ed-lns.txt`


    > `32`


    > `83`


    > `147`


    > `239`


    We could run this in our interactive bash shell:


    > `$ for lno in $(tac ed-lns.txt) ; do`


    > `> vim +$lno new.doco`


    > `> done`'
