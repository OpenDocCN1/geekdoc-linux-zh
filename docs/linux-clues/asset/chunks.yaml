    \ the hidden files do not get shown — it makes the file listing a bit cleaner\
    \ or easier to read.\n\nWhat is an `option` or an `argument`?\n\nIf we want to\
    \ see those hidden files then we can add a blank space and the option `-a` after\
    \ the `ls` command name:\n\n```bash\n$ ls -a {Enter}\n```\n\nThe output could\
    \ look like this:\n\n| `.bash_history` | | `Downloads` | | `Public` |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| `.bash_logout` | | `Music` | | `snap` |\n|\
    \ `.bashrc` | | `Pictures` | | `Templates` |\n| `Desktop` | | `.profile` | | `Videos`\
    \ |\n| `Documents` | | | | |\n\nEasy enough — the `-a` option is mnemonic for\
    \ “all” files.\n\nAnother way to list hidden file(s) is to provide those file\
