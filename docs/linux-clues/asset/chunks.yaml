  trans: "\n更多细节将在稍后的章节中介绍。\n\n还记得之前提到的 `cd` 和 `pwd` 命令吗？\n\n现在尝试运行一下这两个命令：\n\n```\n\
    $ cd\n$ pwd\n/home/clu\n```\n\n像这样不带任何参数运行 `cd` 命令，将把我们在 Linux 文件系统中的参考点直接带到自己的用户主目录\
    \ —— 它使用类似于 `/home/{user}` 的完整路径命名。\n\n`pwd` 命令是 “print working directory”（打印工作目录）的缩写，它将显示\
    \ Linux 文件系统中 `cd` 命令带我们所处位置的名称。\n\n我的主目录位于 `/home/clu`。\n\n你的主目录将反映你的用户名。\n\n\
    注意 `pwd` 的输出在每一层子目录或子文件夹之间包含一个正斜杠（`/`）字符，我们使用它们来帮助指定 Linux 文件系统中的精确位置。\n\n大多数系统可执行程序文件，如\
    \ `df`、`ls` 和 `pwd` 都存储在名为 `/usr/bin` 的目录中。\n\n`bin` 部分是 “binary”（二进制）的缩写，因为那里的大多数程序都是从编写它们的源代码编译成二进制（机器码）的。\n\
    \n查看 Linux 文件系统的倒置树图，我希望你能找到我在那里展示的那两个对象。\n\n`df` 和 `ls` 对象是末端节点 —— 不包含指向其他文件系统对象的链接，且在大多数情况下，这些是普通文件\
    \ —— 而子目录或子文件夹。\n\n可能存在空目录或文件夹。Ubuntu 24.04.2 安装过程创建了名称如 `Desktop`、`Documents`\
    \ 和 `Downloads` 等空占位符目录。\n\n另一个异常是位于 `/dev/tty` 的对象 —— 这是一个特殊的设备文件。\n\n## 绝对文件路径\n\
    \n任何以顶部正斜杠（`/`）字符开头的文件路径都被称为绝对路径。\n\n我们将 `/usr/bin/ls` 称为 `ls` 程序文件的绝对路径。\n\n\
    当我们谈论 Linux 文件系统中某个对象的路径时，听到人们使用如下短语是很正常的：\n\n“slash you ess are, slash bin, slash\
    \ ell ess”\n\n这指的是存储在精确绝对路径位置 `/usr/bin/ls` 的 `ls` 程序。\n\n## 相对文件路径\n\n指定文件系统对象的另一种方法是使用不以\
    \ `/` 开头的相对路径。\n\n这需要更多的上下文。\n\n描述我当前的工作，我可能会说：“我写了一个名为 `teeess.dot.sh` 的小脚本，并将其复制到了我的\
    \ `bin` 目录。”\n\n在这里我没有指定完整（或绝对）路径：\n\n```\n/home/clu/bin/tst.sh\n```\n\n相反，我使用了相对路径并说文件\
    \ `tst.sh` 在我个人的 `bin` 中。\n\n我预计听者知道“我的 `bin` 目录”位于我自己的 `/home/clu` 目录之下 —— 假设他们知道我的用户名\
    \ `clu`。\n\n如果我们使用相对路径而不是绝对路径名称，我们就假设读者或听者知道参考点。\n\n我们希望他们如果不确定，会提问。\n\n资 Linux\
    \ 用户认为，说出那些不构成真实（英语）单词部分的字母名称更清晰 —— 比如 `usr` 和 `ls`。\n\n人们也可以用 ‘user’ 代替拼读 ‘you\
    \ ess are’ 来表示 `usr` 部分 —— 最好对他们宽容宽待一点。\n\n我们通常能根据他们陈述的语境知道他们的意思。\n\n当我们开始使用这些术语时，这些细节开始变得更有意义。\n\
    \n例如，我们可以听到另一个 Linux 用户说：“我运行了 `which` 命令来获取 `ls` 可执行文件的绝对路径。”\n\n在终端窗口中尝试运行该命令：\n\
    \n```\n$ which ls\n```\n\n该命令产生了什么输出？\n\n那是绝对路径吗？\n\n## 命令参数\n\n尝试带这六个参数运行 `which`\
    \ 命令。按所示输入该行，然后按回车键：\n\n```\n$ which cd df du ls pwd which\n```\n\n注意，`cd` 项没有输出！\n\
    \n为什么？因为 `cd` 命令是一个 shell 内置命令，它需要在较低的级别（shell 内部）进行操作。\n\n这是我们作为 Linux 用户不需要完全了解的细节之一\
    \ —— 直到我们开始编写自己的 shell 脚本之类的。\n\n注意，就 `which` 命令所知，其他五个命令可以在 `/usr/bin` 目录中找到。\n\
    \n在 bash shell 中，有一个比 `which` 更好用的命令可以使用 —— 另一个 shell 内置命令，称为 `type`：\n\n```\n\
    $ type cd df du ls pwd which\ncd is a shell builtin\ndf is /usr/bin/df\ndu is\
    \ /usr/bin/du\nls is aliased to ‘ls --color=auto'\npwd is a shell builtin\nwhich\
    \ is hashed (/usr/bin/which)\n```\n\n在这里我们看到 `cd` 命令是一个 shell `builtin`（内置命令），`ls`\
    \ 命令被别名为带有 `--color=auto` 详细选项的自身，而 `pwd` 命令现在是另一个 shell `builtin`。\n\n很快会有更多关于别名的内容。\n\
    \nshell 保留了关于我们当前工作目录位置的内部信息，不需要搜索 `pwd` 并运行它来提供它已经知道的信息。\n\n最后一行报告 `which` 被哈希（hashed），因为我已经用过该命令，`bash`\
    \ shell 已将其加入一个特殊的快速查找哈表，它已经知道在哪里找到这些命令，无需再次搜索。\n\n知道 `bash` shell 采取了所有快捷方式是很好的。\n\
    \n## /usr/share/man\n\n回看 Linux 文件系统的倒置树 —— 右侧的那个长路径是什么？\n\n这是如 `df` 和 `ls` 命令的在线文档或\
    \ `man` 页面存储的地方。\n\n这些是通用用户命令，它们的页面文件存储在如下绝对路径：\n\n```\n/usr/share/man/man1\n\
    ```\n\n在 `/usr/share/man` 之下还有七个子目录 `man2`、`man3`、`man4` ..., `man8`，对应每个章节。\n\
    \n如 `df.1.gz` 和 `ls.1.gz` 等以 `.gz` 结尾的文件意味着这些使用 `gzip` 程序压缩以节省空间。\n\n当我们运行 `man\
    \ ls` 命令读取在线手册时，压缩文件会被解压并展示给我们。\n\n知道 Linux 正为我们处理所有细节并向我们展示请求的信息很好。\n\n## 文件信息\n\
    \n除了文件名和内容，Linux 系统还维护关于我们存储的文件的其他信息。\n\n仔细查看那个隐藏的 `.bashrc` 文件。\n\n`ls` 命令还有另一个选项\
    \ (`-l`) 可以为我们提供更多信息。`-l` 选项是 “long”（长）列表的缩写。\n\n这是使用它时得到的九列输出：\n\n```\n$ ls -l\
    \ .bashrc\n-rw-rw---- 1 clu clu 3771 May 28 15:50 .bashrc\n$\n```\n\n**注意：** 上述显示的文件名和其他输出部分可能会因为页面宽度限制而换行。\n\
    \n`ls -l` 命令的输出包含以下九列空格分隔的信息：\n\n1. 前十个字符（`-rw-rw----`）包含一个目录或文件类型位或标志，以及九个访问权限位或标志\
    \ —— 每个都是单个字符。\n\n   第一个横字符（`-`）表示此文件系统对象是一个普通文件。\n\n   这个第一个字符可能是 `c`（字符特殊设备文件）、`d`（目录对象）或\
    \ `l`（指向文件的符号链接 —— 如果感兴趣，可以留作参考）。\n\n   接下来的九个字符显示了三组三个 `rwx` 字符 —— 顺序如下。\n\n\
    \   这些是对象所有者 user、对象所有者 group 以及我们系统中所有其他用户的权限位或标志。\n\n   字符 `r` 表示 `read`（读取）访问权限。\n"
- fmt: '

    - Character `w` means `write` access permission

    - Character `x` means `execute` permission

    - Character `-` means a permission is `not` granted

    - Any of those nine characters can get substituted with a dash (`-`) character
    instead — to signify the removal of a permission bit from the `user`, `group`
    or `others`.


    2. The number of links to this file system object

    3. The object owning `user` name identifier

    4. The object owning `group` name identifier

    5. The file system object size in bytes and an optional unit specifier (like `3.7K`,
    or `M`, or `G`, `...`) if we also add a `-h` option — mnemonic for *human readable*
    onto the `ls -l` command.

    6. The last update month

    7. The update day of the month

    8. The update time of day in hours and minutes or we will see a 4 digit year number
    for objects updated more than one year ago

    9. The name of the file system object


    For this `.bashrc` file we can see the permission bits in those three sets get
    `rw-` for the user, `rw-` for the group and `---` for others.


    Columns 3 and 4 show the owner’s *user* and *group* identifier as `clu` — the
    user name I chose to use on my new Linux installation.


    Those permission bits imply that *user* `clu` or any other *user* with membership
    in the `clu` *group* can both *read* (`r`) and *write* (`w`) this file.


    The *execute* (`x`) permission bit is *denied* (set to a dash `-`).


    For *all* other users *all* permission access bits get *denied* through those
    last three dash characters (`---`). In column 5 the `.bashrc` file size gets reported
    as 3771 bytes. Linux maintains these nineteen (19) pieces of *metadata* (and more)
    about every file and directory that it stores in the file system for us.


    The permission bits enable the Linux system to maintain control over who has access
    to the files we generate by comparing the file owner identifier with the user
    identifier of a user who attempts to access a file.


    If the third set of `rwx` permission bits does *not* provide the *read* or *write*
    or *execute* access a user needs then more checking gets done.


    If a user requesting access does not have the same user identifier or group identifier
    as the file — or the `rwx` permission bits do not grant the required access then
    they will see an error message reading `Permission denied`.


    It’s good to know the Linux file system performs these checks according to the
    permission bits we choose to set on our file system objects. It takes a user with
    super user (`sudo`) access or a *malicious* program with such access to get around
    those security intentions.


    ## The chmod command


    There’s a command called `chmod` — mnemonic for *change mode* that lets us change
    those permission bits (the *access mode*) on files to which we have appropriate
    *owner* access.


    The `chmod` command knows about those three sets of permission bits and identifies
    those as `u` for the *user*, `g` for the *group* and `o` for *others*.


    We can follow one of those *set* identifiers (`u,g,o`) by a `+` symbol to *add*
    a permission or a `-` symbol to *subtract* a permission.


    Then we append one, two or three of the `r`, `w`, or `x` permission bit letters
    we want to *add* or *subtract*.


    When we get around to making a small shell script that we want to make *executable*
    we will do that using the `chmod` command:


    ```bash

    $ chmod u+x tst.sh

    ```


    This adds the execute (`x`) permission bit for the user (`u`) who owns the named
    file. If we wanted to add that *execute* (`x`) permission bit for both the *user*
    (`u`) and the *group* (`g`) owner identifiers we could do that in one step with:


    ```bash

    $ chmod ug+x tst.sh

    ```


    ## Interactive shell


    I hope you have managed to try out — or you are otherwise familiar with most of
    the commands covered thus far.


    ## Command completion


    The interactive bash shell contains short-hand methods to help us run commands
    with less effort — for example pressing the `Tab` key to help us complete a command
    name or file name.


    Try typing `hi` and then press the `Tab` key. That could expand to `history` if
    there’s no other command that starts with the letters `hi`. If *not* we can press
    the `Tab` key again to get a list of commands that start that way. We can then
    type extra characters to make a unique prefix string for the command we want and
    then press the `Tab` key again. When that expands to the command name we want
    then pressing the `Enter` key will run that for us.


    At times this can be most helpful — not always if there’s a list of commands that
    all start with the same character string. If we see the command we want to run
    in the displayed list we can use `Ctrl+U` to highlight and then press the Enter
    key.


    ## Command history


    ```bash

    $ date

    ```


    ```bash

    $ history

    ```


    ```bash

    $ 121

    ```


    ```bash

    $ 122

    ```


    ```bash

    $ 123

    ```


    ```bash

    $ 124

    ```


    ```bash

    $ 125

    ```


    One convenient way to re-run one of the commands is to use the Up and Down keys
    to scroll the list and then press the Enter key we have found the command. The
    `bash` shell provides more short-hand methods to re-run commands by entering an
    exclamation (`!`) character to start the following:


    - `!n`: Refers to command number `n`

    - `!-n`: Refers to the current command minus the number `n`

    - `!!`: Refers to the previous command. This is a synonym for `!-1`

    - `!string`: Refers to the most recent command starting with the unique `string`

    - `!$`: Refers to the last word of previous command


    If we need to run another command (like `less`) using the same last argument as
    we used the previous command (like `ls`) we can type:


    ```bash

    $ ls ~/path/to/file.bash

    $ less !$

    path/to/file.bash

    ```


    This would then run `less ~/path/to/file.bash`. That can save a bit of typing
    — or mouse motion and mouse buttons copy and paste operation. Instead of pressing
    the Up arrow key 20 times we could type `!101` and press the Enter key if we see
    the command we want to re-run has a command number of `101` in our `history` list.


    If we have already run that `which` command with the six (6) arguments we could
    try entering:


    ```bash

    $ !wh

    which cd df ls pwd which

    /usr/bin/df

    /usr/bin/du

    /usr/bin/ls

    /usr/bin/pwd

    /usr/bin/which

    ```

    ```


    The first line displayed after we type `!wh` and press the Enter key shows a copy
    of the command that the shell is now running for us and the next five (5) lines
    shows the output from that re-run `which` command. Run the `man bash` command
    and *search* for the string `Event` (inside the `man` page display) by typing
    the command `/Event` and press the `Enter` key — this should get us to a section
    titled: `Event Designators`.


    Press the `q` key when we have seen enough in `man bash`.


    I find the item called a `Quick substitution` to be useful too — when I mistype
    a command name or a file name.

    '
