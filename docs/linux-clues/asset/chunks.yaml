    进程替换的形式为 `<(plist)>` 或 `>(plist)`。进程列表 `plist` 会异步运行，其输入或输出将表现为一个*临时*文件名，由于这种扩展方法，该文件名将作为参数传递给当前命令。


    假设我们有两个两个文件 `f1` 和 `f2`，它们各包含一个单词列表——每行一个。我们想知道这两个列表是否包含*相同*的单词——无论每个单词出现多少次：


    ```bash

    $ cmp <(sort -u f1) <(sort -u f2)

    ```


    记住——没消息就是好消息 —— 否则 `cmp` 将产生噪音并报告两个*唯一*排序后的文件中第一个差异点。


    **注意：** 在 `<(` 和/或 `> ( )` 字符对之间没有空格 —— 否则 shell 将尝试将它们视为*正常*的进程 I/O 重定向。


    使用这种*进程替换*，我们不需要使用独立的 `sort` 语句将输出重定向（`>`）到命名的*临时*文件，然后对这些文件运行 `cmp` 命令，最后再按习惯之后*删除*临时文件。


    这种便利让我们免去了思考临时文件名以及在使用后记得清理的麻烦。


    更多细节请参见 `man bash`。


    ## 单词拆分 (Word splitting)


    shell 会扫描双引号内*未*发生的参数扩展、命令替换和算术扩展的结果进行单词拆分。


    这使用了环境变量 `IFS`（*输入字段分隔符*）的值，它的*默认*值为 `{space}`、`{tab}` 和 `{newline}` —— 这三者都是。


    要查看 `IFS` 中的内容，请运行此命令：


    ```bash

    $ echo "$IFS" | od -c

    ```


    ## 路径名扩展 (Pathname expansion)


    在单词拆分之后，bash shell 会扫描每个单词以查找这三个元字符——*星号* `*`、*问号* `?` 和*左方括号* `[`。


    如果出现了这些字符之一且*未*被引号，则该单词被视为*模式*，并被替换为匹配模式的按字母排序的文件列表。


    Linux bash shell 允许我们使用这三个特定的元字符来帮助引用文件名参数，这些参数可以代表文件系统对象名称或名称（们），而无需显式地写出它们。


    路径名扩展可以为我们提供极大帮助——只要我们学会如何仔细地构建“*模式*”字符串。


    这些通配符或元字符意味着什么？


    ## Shell 元字符 (Shell meta-characters)


    - `*` —— 匹配文件名中*零个或*多个*字符的任何字符串。

    - `?` —— 匹配文件名中的任何*单个*字符。

    - `[...]` 的使用 —— 匹配一组包含字符中的任意*一个*。

    - 例如使用 `[abc]` —— 扩展为*一个*字符之一——`a` 或 `b` 或 `c` ——而不是同时匹配所有三个。

    - 在这些方括号内部，用连字符 `-` 隔开的一对字符表示字符的*范围*。

    - 例如使用 `[m-q]` —— 扩展为字符 `m` 或 `n` 或 `o` 或 `p` 或 `q` 之一。

    - 如果 `[` 后的*第一个*字符是感叹号（`!`）或脱字符符号或尖帽符号（`^`），则匹配任何**未**包含在集合中的字符。

    - 通过将字面连字符或破折号（`-`）作为集合中的*第一个*或*最后一个*字符，可以匹配字面量 `-`。

    - 通过将其作为集合中的*第一个*字符，可以匹配字面量 `]`。

    - 更多细节请参见 `man bash`。


    这意味着什么？


    首先，有大量的实验需要进行，以帮助我们熟悉这些文件`路径`扩展可以做什么。


    使用这些 shell 通配符意味着我们可以运行这样的命令：


    ```bash

    $ cd

    $ ls .bash*

    .bash_aliases .bash_logout

    .bash_history .bashrc

    $

    ```


    这列出了任何以字符串 `.bash` 开头，后面跟零个或多个*任何*其他字符的文件——并且它匹配了我们 `HOME` 目录中那四个隐藏的 `.bash*`
    文件。


    我们可以变得更具选择性并写成：


    ```bash

    $ ls .b*[cs]

    .bash_aliases .bashrc

    $

    ```


    这列出了任何以字符串 `.b` 开头，后面跟零个或多个*任何*其他字符的文件——并且以 `c` *或* `s` 结尾。


    这些限制了 `ls` 命令向我们展示我们之前运行 `ls -a` 命令时观察到的两个（2）个隐藏文件中的选择。


    如果好奇，我们可以列出存储在 `/usr/bin` 目录中的那两个字符的可执行命令文件：


    ```bash

    $ cd /usr/bin

    $ ls ??

    bc  du

    ```

