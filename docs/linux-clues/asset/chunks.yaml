    If we want to add (`append`) more text to a pre-existing file we need to use a
    variation of ``>` using *two* greater-than symbols (``>>`):


    ```bash

    $ echo "first out" > out.txt

    $ echo "next out" >> out.txt

    $ cat out.txt

    first out

    next out

    $

    ```


    The second `echo` statement uses the double `>>` output redirection symbol to
    *append* the output at the end of the pre-existing file.


    In the previous chapter we saw an example of sending output to a file when we
    ran that strange looking `echo` command:


    ```bash

    $ echo "alias h=history" >> .bash_aliases

    ```


    Those two greater-than symbols (`>>`) caused the standard output from the `echo`
    command process to get redirected and sent out to that hidden file named `.bash_aliases`.


    I used two greater-than symbols (`>>`) because I did not want to *overwrite* any
    pre-existing file named `.bash_aliases` the user could have already started to
    use.


    Using `>>` means we want to *append* the output onto the end of any pre-existing
    file of the name we specify.


    Using a single `>` character to redirect output means we will *overwrite* the
    named file we specify as the target.


    **Please Note:** We need to use caution with the single greater-than character
    (`>`) or (`2>`) forms of process output redirection — although this can be most
    beneficial when that is the action we want.


    ## Exit status


    There’s one more vital output from every process — its exit status.


    In Linux (and in Unix) an exit status is a small integer value that gets returned
    to the shell (or other process) that ran the command process.


    An exit value of zero (`0`) means *success*.


    There’s one zero (`0`) in our number system. We use other values to signify anything
    other than complete success.


    A non-zero exit value indicates there was a problem.


    How do we find the exit status?


    The bash shell maintains a special variable named as the question mark symbol
    (`?`) to hold the value of the exit status of the last command that has completed
    its operation — exited.


    We can use the `echo` command to display the *value* of the variable `?`.


    To get the *value* of a variable we need to prefix a variable name with a dollar
    (`$`) symbol:


    ```bash

    $ cd

    $ echo "$?"

    0

    ```


    An exit status of zero (`0`) means *success*! In other words the `cd` command
    did what we asked it to do and we can expect our working directory is now our
    own home directory.


    ```bash

    $ cd none

    bash: cd: none: No such file or directory

    $ echo "$?"

    1

    ```


    A non-zero exit value indicates there was a run-time issue. Remember that *invalid*
    `ls -z` command?


    ```bash

    $ ls -z

    /bin/ls: invalid option – ’z’

    Try ''/bin/ls --help’ for more information.

    $ echo "$?"

    2

    ```


    A process is a running instance of a program/command and can produce output on
    the `stdout` and/or `stderr` streams.


    When the process has completed doing what it can do for us it reports its exit
    status back to the shell to confirm the *success* or *failure* of its actions.


    Commands will often detect different run-time errors and can report those using
    a different process exit status number.


    We can test the `$?` value in the bash scripts we write and take one action on
    *success* or another action or actions when we detect a non-zero value.


    ## The PATH variable


    The `bash` shell maintains a special variable called `PATH`. I want to use that
    to help explore another exciting aspect of process i/o redirection.


    Let’s use the `echo` command again to see what’s contained in the *value* of the
    `PATH` variable if that exists:


    ```bash

    $ echo "$PATH"

    /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:/usr/local/games:/usr/games

    ```


    Puzzling at first sight? We could notice there’s a series of colon (`:`) characters
    and each one of those separates an *absolute* file system path — like `/usr/local/bin`
    from the one beside it.


    The `PATH` variable maintains a colon (`:`) separated *list* of the directories
    the `bash` shell will go looking through to find the executable programs and commands
    we type in and request it to run for us.


    Let’s use the value of that `PATH` variable to examine another most helpful part
    of process inter-connection.


    ## Pipes and filters


    Unix and Linux systems provide the user with another delightful piece of — almost
    magic.


    There’s a special character (`|`) called the `vertical bar` or `pipe` symbol that
    we can use to help us connect the *output* of one process into the *input* of
    another process.


    Let’s use this to help make that long colon separated list of absolute paths in
    our `PATH` variable — more readable.


    There’s a *filter* command called `tr` — mnemonic for *translate characters*.
    We can use this to *translate* those `:` characters into "*newline*" characters
    — remember those *backslash* `n` (`\n`) characters?


    We can put together a command *pipeline* like this:


    ```bash

    $ echo "$PATH" | tr ":" "\n"

    /usr/local/bin

    /usr/sbin

    /usr/bin

    /sbin

    /bin

    /snap/bin

    /usr/local/games

    /usr/games

    $

    ```


    Please use double quote characters around the `$PATH` argument given to the `echo`
    command and around the two arguments given to the `tr` command.


    It’s best to ensure there’s a blank space between each of the six (6) parts on
    the command line before we press the `Enter` key to hand over that *pipeline*
    to the `bash` shell.


    There is a collection of most helpful *filter* commands available in Linux. We
    have already been using the `less` pager or paginator to help us read long manual
    pages. We will find others before long — and there is nothing to stop us from
    writing our own *filters*.


    What this means is that the ways in which we can compose our own commands has
    increased a great deal. When we find a process *pipeline* that is useful we can
    encapsulate that into a new `bash` shell *alias* or *script*.


    It could be useful to get that list of directories in the `PATH` variable *sorted*
    too. There’s a helpful *filter* called `sort` — that sorts lines of input text.
    If the command number in our history list is `1234` for that `echo` and `tr` pipeline
    command we could do this:


    ```bash

    $ !1234 | sort

    ```


    This adds another pipe (`|`) symbol after the `tr` command and its two arguments
    to then feed the output from `tr` straight into `sort`.


    ## The tee command


    There can be instances when we want to see the output of a process or process
    pipeline and *also* capture the output into a file for later reference.


    The `tee` command can come to the rescue:


    ```bash

    $ man tee | tee.txt | less

    $

    ```


    Running this command will get the output of the `man tee` command and *pipe* that
    into the `tee` command to capture a copy of that output into a file `tee.txt`
    and *pipe* the same content into the `less` pager so we can *view* that information,
    too.


    Hope that makes sense. We can use the `less` command to read the content of `tee.txt`
    for details about `tee` — it has a `-a` option to *append* the content to the
    specified output file — instead of overwriting it — if it pre-exists. We can use
    the file `tee.txt` as an example file to practise our editing skills — if needed.


    The file contains a good mix of words and punctuation characters — in `vim` we
    can find out how to move the cursor *to* those and *past* those text objects with
    single key command variants like `w` and `W` or `e` and `E` instead of pressing
    time wasting auto-repeat arrow keys.


    # File content


    When we looked at the Linux File System in more detail we considered the metadata
    the system keeps about every file it stores for us. Let’s take a closer look at
    that hidden `.bash_aliases` file.


    How big is that file? Using `ls` with its `-g` and `-o` options to suppress the
    *owner* and *group* names — to save a little line space:


    ```bash

    $ ls -g -o .bash_aliases

    -rw-rw---- 1 16 May 28 15:50 .bash_aliases

    ```

