    Process substitution takes the form of `<(plist)>` or `>(plist)`. The process
    list, `plist`, gets run asynchronously and its input or output appears as a *temporary*
    filename that gets passed as an argument to the current command as a result of
    this expansion method.


    Suppose we have two files `f1` and `f2` that each contain a list of words — one
    on each line. We want to know if the two lists contain the *same* words — regardless
    the number of times each word may appear:


    ```bash

    $ cmp <(sort -u f1) <(sort -u f2)

    ```


    Remember — no news is good news — otherwise `cmp` will make noise and report the
    first point of departure in the two *unique* sorted files.


    **Note:** There’s no blank space between the `<(` and/or `> ( )` character pairs
    — else the shell would try to treat those as the *normal* process i/o redirections.


    Using this *process substitution* we did not need to use separate `sort` statements
    with the output redirected (`>`) to named *temporary* files and then run the `cmp`
    command on those and then finish with the usual *removal* of temporary files later.


    A convenience that saves us from thinking up temporary file names and then remembering
    to tidy up after their use.


    See `man bash` for more details.


    ## Word splitting


    The shell scans the results of parameter expansion, command substitution, and
    arithmetic expansion that did *not* occur within double quotes for word splitting.


    This uses the value of an environment variable `IFS` (*input field separator*)
    which has a *default* value of `{space}` and `{tab}` and `{newline}` — all three
    of these.


    To see what is in `IFS` run this command:


    ```bash

    $ echo "$IFS" | od -c

    ```


    ## Pathname expansion


    After word splitting the bash shell scans each word for these three meta-characters
    — the *asterisk* `*`, the *question mark* `?`, and the *Left square bracket* `[`
    .


    If one of these characters appears, and is *not* quoted, then the word gets regarded
    as a *pattern*, and gets replaced with an alphabetically sorted list of filenames
    matching the pattern.


    The Linux bash shell enables us to use these three specific meta-characters to
    help us refer to file name arguments that can represent a file system object name
    or name(s) without the need to spell them out explicitly.


    Pathname expansions can provide great help to us — provided we learn how to construct
    the “*pattern*” strings with care.


    What do these wild-card or meta-characters mean?


    ## Shell meta-characters


    - The `*` — matches any string of *zero* or *more* characters in a file name.

    - The `?` — matches any *single* character in a file name.

    - The use of `[...]` — matches any *one* of a set of enclosed characters.

    - For example using `[abc]` — expands to *one* of the characters — an `a` or a
    `b` or a `c` — not all three at once.

    - Inside those square brackets a pair of characters separated by a hyphen dash
    `-` denotes a *range* of characters.

    - For example using `[m-q]` — expands to one of the characters `m` or `n` or `o`
    or `p` or `q`.

    - If the *first* character following the `[` is either an exclamation symbol (`!`)
    or the caret or circumflex (*pointy-hat*) symbol (`^`) then any character **not**
    enclosed in the set gets matched.

    - A literal hyphen or dash (`-`) can get matched by including it as either the
    *first* or the *last* character in a set.

    - A literal `]` can get matched by including it as the *first* character in a
    set.

    - See `man bash` for more details.


    What does this imply?


    For a start, there’s lots of experimentation to do to help us get comfortable
    with what these file `pathname` expansions can do.


    Using these shell wild-cards means we can run commands like this:


    ```bash

    $ cd

    $ ls .bash*

    .bash_aliases .bash_logout

    .bash_history .bashrc

    $

    ```


    That lists any file that starts with the string `.bash` followed by zero or more
    of *any* other character — and it has matched all four of *those* hidden `.bash*`
    files in our `HOME` directory.


    We could get more selective and write:


    ```bash

    $ ls .b*[cs]

    .bash_aliases .bashrc

    $

    ```


    That lists any file that starts with the string `.b` followed by zero or more
    of *any* other character — and also ends with *either* a `c` *or* an `s`.


    These restrict the `ls` command to showing us a selection of two (2) of the hidden
    files we observed when we ran an `ls -a` command before.


    If curious we could list the two (2) character executable command files stored
    in the `/usr/bin` directory:


    ```bash

    $ cd /usr/bin

    $ ls ??

    bc  du

    ```

