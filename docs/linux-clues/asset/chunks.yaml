  trans: "\n\n如果我们运行两次 `ps` 命令，会发现 `ps` 进程的 `PID` 将是一个*不同*的数字。注意，`bash` shell 的 `PID`\
    \ 保持不变。\n\n如果我们有*另一个*终端（Terminal）窗口或标签页可用，并在其中输入 `ps` 命令，我们会发现 PIDs 再次变得不同。每个终端窗口或终端标签页都有其自己的\
    \ bash shell 进程*实例*（instance）。\n\n## 前台 .vs. 后台\n\n到目前为止，我们在终端窗口或终端标签页中运行的所有命令一直都在我们所谓的\
    \ `foreground`（前台）模式下运行。\n\n`bash` shell 会为请求的命令启动一个新*进程*，并在运行的命令执行其操作并产生结果时等待——之后，`bash`\
    \ shell 会显示下一个 shell 提示符，表示它已准备好接收我们的更多指令。\n\n还有另一种运行命令的方式——在后台运行。为此，我们要在想要这样运行的命令后面添加一个\
    \ `&` 符号。区别在于，`bash` shell 会几乎立即显示下一个 shell 提示符，然后我们就可以运行另一个命令。\n\n有一个名为 `sleep`\
    \ 的命令，它接受一个十进制数字参数作为我们希望该进程*睡眠*的秒数。\n\n我们可以利用它来进一步了解关于后台进程的信息。\n\n如果我们运行 `sleep\
    \ 10 &`，然后在命令*睡眠*的十秒内，在同一个终端窗口或标签页中尝试以普通的前台模式运行 `ps` 命令——一次或两次——我们可以看到发生了什么：\n\
    \n```\n$ sleep 10 &\n[1] 3955\n$ ps\n  PID TTY      TIME CMD\n  3120 pts/5   \
    \ 00:00:00 bash\n  3955 pts/5    00:00:00 sleep\n  3957 pts/5    00:00:00 ps\n\
    $ ps\n  PID TTY      TIME CMD\n  3120 pts/5    00:00:00 bash\n  3955 pts/5   \
    \ 00:00:00 sleep\n  3958 pts/5    00:00:00 ps\n[1]+  Done         sleep 10\n$\n\
    ```\n\n我们能够在 sleep 进程继续后台运行的同时，在*前台*模式下继续运行 `ps` 命令——直到它数完十秒并被终止。\n\n当 `bash`\
    \ shell*看到*安符符号（`&`）时，它会报告从 `[1]` 开始的*后台*作业编号及其进程 ID `3955`，输出为 `[1] 3955`。\n\n\
    当 bash shell 注意到后台进程已终止时，它会通过输出 `[1]+ Done` 和作业名称 `sleep 10` 来报告。\n\n我们可以在计算机登录会话中打开不同的终端窗口和其他应用程序窗口。\n\
    \n当我们与这些窗口交互并将焦点切换到另一个窗口时，其中一些可以处于*前台*模式，也可以处于*后台*模式。\n\n例如，我们可以有：\n\n*   一个打开了额外\
    \ `tabs` 的终端窗口\n*   一个打开了多个标签页的浏览器会话，正在 Google 搜索某个软件、显示明天计划开车距离的 Maps 页面，以及我们的社交媒体\
    \ Facebook 页面等 . .\n*   一个像 Thunderbird 这样的邮件客户端应用程序，我们正在其中撰写回复邮件 . . .\n*   一个在\
    \ `Libre Office Writer` 中打开的文档\n*   一个在 `Libre Office Calc` 中打开的电子表格\n*   一个播放我们喜欢的音乐的音频播放器\n\
    *   以及更多 `...`\n\n当进程完成操作并向我们返回任何输出或错误消息时——系统就会进行清理，将其使用的资源返回到池中，供下一个进程使用。\n\n\
    如果我们发现交互式响应开始变得缓慢和迟钝——我们可能需要为我们的 Linux PC 增加 RAM，或者从机械硬盘升级到 SSD 存储以帮助提高性能。\n\n\
    否则，我们可以记住关闭那些不需要一直运行的非活动应用程序。大多数程序在当我们再次需要它们时可以立即重启。\n\n## 想象一个进程\n\n这是我们想象*进程*的一种方式：\n\
    \n```\n![](img/file1.png)\nimage\n```\n\n每个进程都从三个输入/输出流开始，称为：\n\n1.  `stdin` ——\
    \ “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符） `0`\n2.  `stdout` ——\
    \ “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符） `1`\n3.  `stderr`\
    \ —— “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符） `2`\n\n##进程 io 处理\n\
    \n每个进程都从三个输入/输出流开始：\n\n1.  `stdin` —— “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符）\
    \ `0`\n2.  `stdout` —— “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符）\
    \ `1`\n3.  `stderr` —— “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符）\
    \ `2`\n\n## 命令语法\n\n每个进程都从三个输入/输出流开始：\n\n1.  `stdin` —— “*Standard Input*”（标准输入）的缩写\n\
    \    *   文件*descriptor*（描述符） `0`\n2.  `stdout` —— “*Standard Output*”（标准输出）的缩写\n\
    \    *   文件*descriptor*（描述符） `1`\n3.  `stderr` —— “*Standard Error*”（标准错误）的缩写\n\
    \    *   文件*descriptor*（描述符） `2`\n\n## 重定向追加模式\n\n每个进程都从三个输入/输出流开始：\n\n1.  `stdin`\
    \ —— “*Standard Input*”（标准输入）的缩写\n    *   文件*descriptor*（描述符） `0`\n2.  `stdout`\
    \ —— “*Standard Output*”（标准输出）的缩写\n    *   文件*descriptor*（描述符） `1`\n3.  `stderr`\
    \ —— “*Standard Error*”（标准错误）的缩写\n    *   文件*descriptor*（描述符） `2`\n\n"
