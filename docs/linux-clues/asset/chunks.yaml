    现在，当我们下次注销并重新登录 Linux 系统时，我们在 `.profile` 文件中看到的那段条件代码就会识别到我们自己的 `bin` 目录。


    如果我们想在不注销并重新登录的情况下测试这一点，可以尝试在 `Terminal` 窗口或标签页中运行带有 `-l` 或 `--login` 选项的 `bash`以获取一个新的登录
    shell 实例。


    接下来尝试再次运行那个 `echo $PATH` 命令：


    ```bash

    $ echo "$PATH" | tr ":" "\n"

    /home/clu/bin

    /usr/local/bin

    /usr/sbin

    /usr/bin

    /sbin

    /snap/bin

    /usr/local/games

    /usr/games

    $

    ```


    这似乎已经找到了我的 `/home/clu/bin` 目录。


    我们可以输入 `exit` 命令关闭第二个 bash shell。


    当我们需要目录和子目录时，可以使用 `mkdir` 命令配合 `-p` 选项。`-p` 选项是 `parents` 的缩写，它确保父目录和指定的子目录都会被实例化。例如，我喜欢为
    `python` 脚本和 `shell` 脚本分别拥有独立的目录。在这里我添加了 `-p`（parents）和 `-v`（verbose，详细模式）选项来显示其操作：


    ```bash

    $ cd

    $ mkdir -p -v dev/{py,sh}

    mkdir: created directory ''dev''

    mkdir: created directory ''dev/py''

    mkdir: created directory ''dev/sh''

    ```


    我在 bash shell 中使用了另一种简写方法，使用大括号 `{}` 和逗号分隔的名称列表，shell 将将其展开为各个路径：`dev/py` 和 `dev/sh`。`man
    bash` 页面将其称为 `Brace Expansion`（大括号展开）。`-p` 选项确保初始 `dev` 目录也被创建了。在一个新的 Linux 安装中，也会运行：


    ```bash

    $ cd

    $ mkdir -p -v src/{py,sh}

    mkdir: created directory ''src''

    mkdir: created directory ''src/py''

    mkdir: created directory ''src/sh''

    ```


    如果我们永远删除一个目录，有一个名为 `rmdir` 的命令可以做到。目录必须是空的，`rmdir` 才能工作——否则它会报错：


    ```bash

    $ rmdir old

    rmdir: failed to remove ''old'':

    Directory not empty

    ```


    这是一个合理的保护措施。


    ## 写一个脚本


    假设我们要写一个名为 `td.sh` 的小型 bash 脚本——作为一个实验。如果我要写一个像 `td.sh` 的新 shell 脚本——特别是如果我不想给它
    `.sh` 后缀，我将运行 bash shell 的 `type` 命令来双重检查这个不存在的文件：


    ```bash

    $ type td

    bash: type: td: not found

    bash: type: not found

    $

    ```


    很好。我希望看到 `type` 显示 `not found`！假设我们要使用这五行 bash 脚本代码：


    ```bash

    #!/usr/bin/bash

    echo "Today is "

    date +"%A %F"

    echo

    ```


    第一行指示 Linux 系统使用 `/usr/bin/bash` shell 来解释脚本内容。带有前两个字符 `#!` 的行被称为 "hashbang" 行。在其他
    Linux 脚本开头（例如 Python 和 R 语言），我们会找到这些内容：


    ```bash

    #!/usr/bin/env python3

    ```


    以及


    ```bash

    #!/usr/bin/env R

    ```


    `td.sh` 中的下一行包含一个不带任何参数的 `echo` 命令打印空行。之后是一个 `printf`（格式化打印）语句，后面跟着带有特殊参数 `+"%A
    %F"` 的 `date` 调用以及另一个 `echo` 命令。查看 `man date` 获取关于格式符 `%A` 和 `%F` 的信息。`echo` 命令在结尾总是产生一个换行，除非我们指示它不要这样做。`printf`
    命令结尾不会产生任何换行，除非我们指示它打印一个。我想要 `date` 命令的输出紧跟在 "Today is " 前缀后面。使用你喜欢的编辑器插入这五行并将其保存到名为
    `td.sh` 的文件中——我总是使用 `vim` 作为我的编辑器。如果你还没有习惯使用 Linux 编辑器，有一个名为 `ed` 的有趣的行编辑器可以构建这样一个小型
    shell 脚本——这并不困难：


    ```bash

    $ ed

    a

    #!/usr/bin/bash

    echo "Today is "

    date +"%A %F"

    echo

    .

    wq td.sh

    ```


    除了我的 shell 提示符（`$`）之外，逐行输入每行并在行尾按 `Enter` 键。单独行的 `a` 是 `ed` 的追加命令。接下来我们输入那五行 shell
    脚本。单独行的 `.` 是 `ed` 命令，用于结束输入并返回命令模式。`wq` 命令行是 `ed` 命令，将其写入（w）到指定的文件（`td.sh`）然后退出（q）回到
    shell。


    当我们完成最后一行时，它应该输出写入文件 `td.sh` 的字符数（`59`），然后显示我们的下一个 shell 提示符。记得我们可以使用 `cat` 和
    `od -c` 命令详细检查文件内容——它看起来和我的五行完全一样吗？GNU `ed` 命令的文档在 `info` 工具中维护，我们可以通过运行它来读取 info
    页面：


    ```bash

    $ info ed

    ```


    如果有时间，非常值得一读。GNU `ed` 编辑器是同名原始 Unix 行编辑器的复制版本。那个 55 年前的软件逻辑今天仍然以同样完美的方式运行！运行我们新的
    `td.sh` shell 脚本的方法是：


    ```bash

    $ bash td.sh

    . . .

    ```


    有一种更好的方法。


    ## 使用 chmod


    接下来，我们需要确保使用 `chmod` 命令——change mode 的缩写，来赋予我们的 shell 脚本执行（execute）权限：


    ```bash

    $ chmod u+x td.sh

    ```


    参数 `u+x` 意味着为拥有指定文件的用户添加 `x` 权限位。我们可以在编写脚本的地方通过输入命令来测试我们的 shell 脚本：


    ```bash

    $ ./td.sh

    ```


    开头的点（`.`）和正斜杠（`/`）字符指示在 Terminal 中运行的 bash shell 在当前目录搜索 shell 脚本 `td.sh`。单点（`.`）是当前目录的缩写。双点（`..`）是父目录的缩写。如果我们
    `cd` 进入子目录并想返回父目录，可以运行 `cd ..` 回那里——这有时非常有帮助。


