    ## Auto-reporting\n\nThe steam editor `sed` helps us to make changes to text on\
    \ the fly.\n\nWhy would we want to do that?\n\nEarlier we used the `tr` (*translate*)\
    \ command to convert the colon (`:`) characters between the directory paths in\
    \ our `PATH` variable into *newline* characters to get each path displayed on\
    \ a separate line.\n\nThat was useful for doing what we needed to make that list\
    \ easier to read.\n\nUsing `sed` we can use REs (*regular expressions*) to locate\
    \ characters or words or phrases in its input stream (from a file or a pipeline)\
    \ and convert or change or delete or extend the text to make it more readable/understandable\
    \ — in almost any way we may want.\n\nSuppose we had a small template file to\
    \ help us report the results of the testing procedures we conduct on the shell\
    \ scripts and other programs we develop and then deploy for more widespread use.\n\
    \nManagement requires that we provide assurance reports to show the results of\
    \ our product testing and need us to flag any potential issues and errors *before*\
    \ we release updated products for general use and deliver these to other users\
    \ and unsuspecting customers.\n\nThe products could need to get sent back to the\
    \ developer(s) for more analysis and repair work!\n\nThe test analysts use an\
    \ automated test harness that conducts test cases and reports a pass or fail for\
    \ each coded test case.\n\nHow can we take those product test results and use\
    \ these to auto-complete a report for management — on demand?\n\nSuppose the testing\
    \ process emits terse messages like this:\n\n```\n01:cmd no opts/args:pass\n02:cmd\
    \ line bad opts:pass\n03:cmd line good opts:pass\n04:cmd line bad args:pass\n\
    05:cmd line good args:pass\n06:cmd idat bad:pass\n07:cmd odat bad vals:pass\n\
    08:cmd odat bad errs:fail\n09:cmd idat good:pass\n10:cmd odat good vals:pass\n\
    11:cmd odat good errs:pass\n```\n\nWe want to read each line of data emitted by\
    \ the testing process and use the colon separated field values to help produce\
    \ a more readable document for management.\n\n## Stream editor sed\n\nThe *stream*\
    \ editor `sed` command includes a *search and replace* instruction that can be\
    \ composed and used like this:\n\n```bash\n$ sed -e 's/RE/text/g' file.txt\n```\n\
    \nThe `sed` command can handle more than one of these *edit* instructions and\
    \ I find a convenient way to do that is to add a backslash character before the\
    \ file name and press the `Enter` key to wrap onto the next line(s) with more\
    \ edit parts:\n\n```bash\n$ sed -e 's/RE/text/g' \\\n      -e 's/RE/text/g' \\\
    \n      -e 's/RE/text/g' file.txt\n```\n\nThe `sed` command makes one pass over\
    \ its input — one line at a time and executes each of those `-e` edit commands\
    \ in turn to find and make changes to the text.\n\nTo parse the test results data\
    \ and make those terse information strings more readable we could use:\n\n```bash\n\
    $ sed -e 's/opts/options/g' \\\n      -e 's/args/arguments/g' \\\n      -e 's/idat/input\
    \ data/g' \\\n      -e 's/odat/output data/g' \\\n      -e 's/fmt/format/g' \\\
    \n      -e 's/vals/values/g' \\\n      -e 's/errs/error messages/g' \\\n     \
    \ -e 's/:pass/ –> pass/g' \\\n      -e 's/:fail/ –> FAIL/g' \\\n      -e 's/:/\
    \ /g' file.txt\n```\n\nWe can put those lines (after a `hash-bang` line) into\
    \ a shell script named `report.sh` — without the first `$` prompt character and\
    \ then use the `chmod` command to make it executable and run it on the test result\
    \ data file to produce:\n\n```bash\n$ ./report.sh\n01 cmd no options/arguments\
    \ –> pass\n02 cmd line bad options –> pass\n03 cmd line good options –> pass\n\
    04 cmd line bad arguments –> pass\n05 cmd line good arguments –> pass\n06 cmd\
    \ inp-data bad –> pass\n07 cmd out-data bad values –> pass\n08 cmd out-data bad\
    \ error text –> FAIL\n09 cmd inp-data good –> pass\n10 cmd out-data good values\
    \ –> pass\n11 cmd out-data good error text –> pass\n```\n\nNothing extra special.\
    \ I hope you get the gist of the idea. The final report could need to get tabulated\
    \ with headers and footers and with dates and other details embedded — no problem.\n\
    \nWe could use two or three lines of `bash` shell code to call one or more `AWK`\
    \ script(s) to perform all kinds of actions to help us achieve precisely what\
    \ we need.\n\n## The file command\n\nThere can be times when we need to know what\
    \ data type content a file has inside.\n\nDo we have files that contain any data\
    \ type *indicator* suffix strings like — `.awk` or `.aux` or `.bib` or `.c` or\
    \ `.cfg` or `.cpp` or `.csh` or `.csv` or `.dat` or `.deb` or `.doc` or `.docx`\
    \ or `.dvi` or `.eml` or `.eps` or `.epub`?\n\nThere’s a utility called `file`\
    \ that can help us what a file contains:\n\n```\n$ file .bashrc\nASCII text\n\
    $ file count.pl\nPerl script executable\n$ file tee.txt\nUnicode text, UTF-8\n\
    $ file wav/faith.wav\nRIFF (little-endian) data, WAVE audio, Microsoft PCM, 16\
    \ bit, stereo 44100 Hz\n```\n\n## The sort filter\n\nWhile we have seen the Linux\
    \ `sort` command before — it contains over thirty (30) different command-line\
    \ *options* to get it to perform in wonderful ways to help us *sort* our lines\
    \ of data.\n\nFor example, suppose we wanted to get a list of file names sorted\
    \ in alphabetical order by their file type suffix strings — instead of the whole\
    \ file names.\n\nAn `ls` listing shows we have these files\n\n```\n$ ls\nf1.abc\
    \ f4.zip file1.txt\nf2.ly f5.jpg file2.txt\nf3.c\n```\n\nWe want to see `f1.abc`\
    \ *first* and `f4.zip` *last*:\n\n```bash\n$ ls -1 | sort -t . -k 2\nf1.abc\n\
    f3.c\nf5.jpg\nf2.ly\nfile1.txt\nfile2.txt\nf4.zip\n```\n\nThe `-1` (*hyphen or\
    \ dash one*) option given to the `ls` command requests the list of file names\
    \ to get displayed as *one* on each line.\n"
  raw: 'All we need do is make the necessary edit(s) at the line where our *cursor*
    lands — and then *exit* from the editor.


    In ‘`vim`’ I’d use the *last-line* command ‘`:wq`’ — mnemonic for *write* and
    *quit* — or the *short-hand* ‘`{Shift}+{Z}+{Z}`’.


    The ‘`for-do-done`’ loop moves to the next *value* of ‘`$lno`’ parameter it gets
    from the command substitution part ‘`$(tac ed-lns.txt)`’ and re-runs the editor.


    Easy — we could write a script to automate that.


    This is one of the reasons I prefer to run my editor on the command-line inside
    my Terminal windows and tabs — rather than firing up a GUI ‘`Editor`’ window from
    an *icon* with its `File` menus, etc.


    That works for me.


    Using the ‘`rev`’ filter can come into play where we need to consider reverse
    sort orders in unusual circumstances.


    ## Auto-reporting


    The steam editor ‘`sed`’ helps us to make changes to text on the fly.


    Why would we want to do that?


    Earlier we used the ‘`tr`’ (*translate*) command to convert the colon (‘`:`’)
    characters between the directory paths in our ‘`PATH`’ variable into *newline*
    characters to get each path displayed on a separate line.


    That was useful for doing what we needed to make that list easier to read.


    Using ‘`sed`’ we can use REs (*regular expressions*) to locate characters or words
    or phrases in its input stream (from a file or a pipeline) and convert or change
    or delete or extend the text to make it more readable/understandable — in almost
    any way we may want.


    Suppose we had a small template file to help us report the results of the testing
    procedures we conduct on the shell scripts and other programs we develop and then
    deploy for more widespread use.


    Management requires that we provide assurance reports to show the results of our
    product testing and need us to flag any potential issues and errors *before* we
    release updated products for general use and deliver these to other users and
    unsuspecting customers.


    The products could need to get sent back to the developer(s) for more analysis
    and repair work!


    The test analysts use an automated test harness that conducts test cases and reports
    a pass or fail for each coded test case.


    How can we take those product test results and use these to auto-complete a report
    for management — on demand?


    Suppose the testing process emits terse messages like this:


    > `01:cmd no opts/args:pass`


    > `02:cmd line bad opts:pass`


    > `03:cmd line good opts:pass`


    > `04:cmd line bad args:pass`


    > `05:cmd line good args:pass`


    > `06:cmd idat bad:pass`


    > `07:cmd odat bad vals:pass`


    > `08:cmd odat bad errs:fail`


    > `09:cmd idat good:pass`


    > `10:cmd odat good vals:pass`


    > `11:cmd odat good errs:pass`


    We want to read each line of data emitted by the testing process and use the colon
    separated field values to help produce a more readable document for management.


    ## Stream editor sed


    The *stream* editor ‘`sed`’ command includes a *search and replace* instruction
    that can get composed and used like this:


    > `$ sed -e ’s/RE/text/g’ file.txt`


    The ‘`sed`’ command can handle more than one of these *edit* instructions and
    I find a convenient way to do that is to add a backslash character before the
    file name and press the `Enter` key to wrap onto the next line(s) with more edit
    parts:


    > `$ sed -e ’s/RE/text/g’` `\`


    > `      -e ’s/RE/text/g’` `\`


    > `      -e ’s/RE/text/g’` `file.txt`


    The ‘`sed`’ command makes one pass over its input — one line at a time and executes
    each of those ‘`-e`’ edit commands in turn to find and make changes to the text.


    To parse the test results data and make those terse information strings more readable
    we could use:


    > `$ sed -e ’s/opts/options/g’` `\`


    > `      -e ’s/args/arguments/g’` `\`


    > `      -e ’s/idat/input data/g’` `\`


    > `      -e ’s/odat/output data/g’` `\`


    > `      -e ’s/fmt/format/g’` `\`


    > `      -e ’s/vals/values/g’` `\`


    > `      -e ’s/errs/error messages/g’` `\`


    > `      -e ’s/:pass/ –> pass/g’` `\`


    > `      -e ’s/:fail/ –> FAIL/g’` `\`


    > `      -e ’s/:/ /g’` `file.txt`


    We can put those lines (after a ‘`hash-bang`’ line) into a shell script named
    ‘`report.sh`’ — without the first ‘`$`’ prompt character and then use the ‘`chmod`’
    command to make it executable and run it on the test result data file to produce:


    > `$ ./report.sh`


    > `01 cmd no options/arguments –> pass`


    > `02 cmd line bad options –> pass`


    > `03 cmd line good options –> pass`


    > `04 cmd line bad arguments –> pass`


    > `05 cmd line good arguments –> pass`


    > `06 cmd inp-data bad –> pass`


    > `07 cmd out-data bad values –> pass`


    > `08 cmd out-data bad error text –> FAIL`


    > `09 cmd inp-data good –> pass`


    > `10 cmd out-data good values –> pass`


    > `11 cmd out-data good error text –> pass`


    Nothing extra special. I hope you get the gist of the idea. The final report could
    need to get tabulated with headers and footers and with dates and other details
    embedded — no problem.


    We could use two or three lines of `bash` shell code to call one or more `AWK`
    script(s) to perform all kinds of actions to help us achieve precisely what we
    need.


    ## The file command


    There can be times when we need to know what data type content a file has inside.


    Do we have files that contain any data type *indicator* suffix strings like —
    ‘`.awk`’ *or* ‘`.aux`’ *or* ‘`.bib`’ *or* ‘`.c`’ *or* ‘`.cfg`’ *or* ‘`.cpp`’ *or*
    ‘`.csh`’ *or* ‘`.csv`’ *or* ‘`.dat`’ *or* ‘`.deb`’ *or* ‘`.doc`’ *or* ‘`.docx`’
    *or* ‘`.dvi`’ *or* ‘`.eml`’ *or* ‘`.eps`’ *or* ‘`.epub`’ *or* ‘`.ftn`’ *or* ‘`.gv`’
    *or* ‘`.gz`’ *or* ‘`.html`’ *or* ‘`.iso`’ *or* ‘`.jpg`’ *or* ‘`.js`’ *or* ‘`.json`’
    *or* ‘`.ksh`’ *or* ‘`.lex`’ *or* ‘`.log`’ *or* ‘`.lua`’ *or* ‘`.ly`’ *or* ‘`.md`’
    *or* ‘`.midi`’ *or* ‘`.mp3`’ *or* ‘`.ogg`’ *or* ‘`.odp`’ *or* ‘`.ods`’ *or* ‘`.pdf`’
    *or* ‘`.pl`’ *or* ‘`.png`’ *or* ‘`.ppt`’ *or* ‘`.ps`’ *or* ‘`.py`’ *or* ‘`.R`’
    *or* ‘`.rb`’ *or* ‘`.sh`’ *or* ‘`.sql`’ *or* ‘`.sty`’ *or* ‘`.tar`’ *or* ‘`.tcl`’
    *or* ‘`.tex`’ *or* ‘`.toc`’ *or* ‘`.txt`’ *or* ‘`.wav`’ *or* ‘`.xlsx`’ *or* ‘`.xml`’
    *or* ‘`.xz`’ *or* ‘`.zip`’ — *or* any others we could use?


    There’s no guarantee that a file contains what the file suffix says or what we
    imagine or what we could hope it does.


    There’s a utility command called ‘`file`’ that can help us to determine the data
    type a file contains:


    > `$ file .bashrc`


    > `.bashrc: ASCII text`


    > `$ file count.pl`


    > `count.pl: Perl script text executable`


    > `$ file tee.txt`


    > `tee.txt: Unicode text, UTF-8 text`


    > `$ file wav/faith.wav`


    > `wav/faith.wav: RIFF (little-endian) data, WAVE audio, Microsoft PCM, 16 bit,
    stereo 44100 Hz`


    We could use a ‘`grep`’ command to search for keywords like ‘`ASCII`’ or ‘`Perl`’
    or ‘`text`’ or ‘`WAVE`’, etc.


    The ‘`grep`’ command returns a ‘`0`’ (*success*) `exit` status when it finds a
    match.


    Remember we can check the `exit` status of the *last* command using the special
    ‘`?`’ variable — its *value* is ‘`$?`’.


    It contains the exit status value of the previous command that ran in the current
    shell — interactively or inside a shell script.


    ## The sort filter


    While we have seen the Linux ‘`sort`’ command before — it contains over thirty
    (30) different command-line *options* to get it to perform in wonderful ways to
    help us *sort* our lines of data.


    For example, suppose we wanted to get a list of file names sorted in alphabetical
    order by their file type suffix strings — instead of the whole file names.


    An ‘`ls`’ listing shows we have these files:


    > `$ ls`


    > `f1.abc   f4.zip   file1.txt`


    > `f2.ly    f5.jpg   file2.txt`


    > `f3.c`


    We want to see ‘`f1.abc`’ *first* and ‘`f4.zip`’ *last*:


    > `$ ls -1 | sort -t .` `-k 2`


    > `f1.abc`


    > `f3.c`


    > `f5.jpg`


    > `f2.ly`


    > `file1.txt`


    > `file2.txt`


    > `f4.zip`


    The ‘`-1`’ (*hyphen or dash one*) option given to the ‘`ls`’ command requests
    the list of file names to get displayed as *one* on each line.'
