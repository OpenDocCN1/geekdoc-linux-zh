- fmt: "\nThe greater-than (`>`) symbols at the left side of the second and third\
    \ lines get provided by the `bash` shell because it’s prompting us for *more*\
    \ input — it knows what we have typed on those line(s) before is still an *incomplete*\
    \ shell command. It’s waiting for the `done` keyword to close off the `for-do-done`\
    \ loop. That’s helpful and clever interactive feedback.\n\nThe `for-do-done` loop\
    \ cycles through those five command names *one at a time* calling `grep` to locate\
    \ *lines* that *start* with these command names using a *pattern* that is *anchored*\
    \ to the start (left side) of each line by using the *caret* or *circumflex* or\
    \ *pointy-hat* character *first* and the value of the variable named `c` — that\
    \ is `\"^$c\"`.\n\nAs you can see in the output these commands get called over\
    \ and over again. I expect I was reading `man` pages to ensure I got the correct\
    \ information for any references I made in a part of this book.\n\nWhat number\
    \ of `different` commands did `count.pl` find?\n\nCount the number of lines in\
    \ `hst-ctrs.txt` file:\n\n```\n$ wc -l hst-ctrs.txt\n100 hst-ctrs.txt\n```\n\n\
    That’s a nice round number. Any reason to query that? I don’t think there is.\
    \ A fluke I expect.\n\nTo double check on that I ran this command:\n\n```\n$ sort\
    \ -u hst-cmds.txt | wc -l\n100\n```\n\nThe `-u` option for the `sort` command\
    \ requests a *unique* list of the items in the file. Piping that result into `wc\
    \ -l` provides the count of those *unique* items — it’s 100. \n\nTo ease my mind\
    \ I tried running the same commands in another Terminal window where I had changed\
    \ with a `cd` to a directory in my development area.\n\nThis gave me 969 items\
    \ in a new history list and the output of `count.pl` had 86 lines. Hence my concern\
    \ gets resolved about that *nice* round number.\n\nNext I made a *copy* of `hst-ctrs.txt`\
    \ into file `hst-ctrs.ed` and used my favourite `vim` editor to insert a character\
    \ *code* at the start (left side) of *each* line:\n\n```\n$ cp hst-ctrs.txt hst-ctrs.ed\n\
    $ vim hst-ctrs.ed\n...\n```\n\nThe command category codes I inserted are these:\n\
    \n```\na for alias\nc for command\ni for interactive\ns for script\nx for command\
    \ error\n```\n\nInspect the same five lines in the edited version:\n\n```\n$ head\
    \ -20 hst-ctrs.ed | tail -5\na bnchk              6\na c                  13\n\
    a c3                 35\nc cal                1\nc cat                34\n```\n\
    \nAll I did was add or insert the command category code and a blank space character\
    \ at the start (left side) of each line.\n\nIf I were to *automate* this analysis\
    \ method I might try to pass the command names to the `bash` shell `type` command\
    \ for its *opinion* on the category of each command — I’ll save that for a rainy\
    \ day.\n\nNext I ran this interactive shell command to cycle through those five\
    \ command category codes using a `grep -c` command to *count* the number of lines\
    \ that start with the same code:\n\n```\n$ for ch in a c i s x ; do\n> printf\
    \ \"%s –> \" \"$ch\"\n> grep -c \"^$ch\" hst-ctrs.ed\n> done > hst-ctrs.nlns\n\
    ```\n\nThe greater-than symbols at the left side of the lines get provided by\
    \ the bash shell to signify that we have not yet completed a valid command.\n\n\
    The `for-do-done` loop cycles through those five command category codes *one at\
    \ a time* calling `grep` to locate *lines* that *start* with these characters\
    \ using a *pattern* that is *anchored* to the start (left side) of each line by\
    \ using the *caret* or *circumflex* or *pointy-hat* character *first*.\n\nWe’ll\
    \ discover more about those `grep` *patterns* in the chapter titled **Regular\
    \ expressions**. The last line shows how we can redirect the output from that\
    \ entire `for-do-done` loop and capture this into another — `hst-ctrs.nlns` with\
    \ suffix `.nlns` as *number of lines*.\n\nThe output from that interactive command\
    \ is:\n\n```\n$ cat hst-ctrs.nlns\na -> 23\nc -> 37\ni -> 5\ns -> 30\nx -> 5\n\
    ```\n\nThere’s 23 *different* aliases, 37 *different* commands and 30 *different*\
    \ scripts — and 10 sundry items. These are the numbers in each command *category*\
    \ I chose to encode with characters (`a`, `c`, `i`, `s` and `x`) — they each have\
    \ *different* names.\n\nUsing another AWK script to total:\n\n```\n$ awk '{ttl\
    \ = ttl + $3 + 0} END {print ttl}' hst-ctrs.nlns\n100\n```\n\nThat looks okay.\
    \ We could use `bc` to check the total:\n\n```\n$ bc\n23 + 37 + 5 + 30 + 5\n100\n\
    ```\n\nCheck! Pressing the control code `Ctrl+D` tells the `bc` command we have\
    \ finished giving it input and gets it to let the bash shell give us the next\
    \ prompt. Otherwise we could always do a little arithmetic. The list of 37 standard\
    \ commands in that `history` sample is:\n\n```\n$ awk 'print $2' hst-ctrs.ed,c\
    \ | column -50\naudacity ps\nbc factor pwd\ncal file rm\ncat grep shopt\ncd history\
    \ stat\nchmod size sudo\ncmp ispell tac\nconvert less diff\nls tree\ndiff man\
    \ type\necho mkdir which\neinfo mv\neog perdoc\n```\n\nStrictly speaking the commands:\
    \ `cd`, `echo`, `history`, `pwd`, `shopt` and `type` are `bash` shell *builtins*\
    \ — more Linux commands to me. I run most of those *aliases* and *commands* and\
    \ shell *scripts* throughout almost every day or week to help me with the work\
    \ I’m doing.\n\nCan I estimate the frequency with which I run either an *alias*\
    \ or a standard Linux *command* or one of my *scripts*?\n\nLet’s inspect the numbers\
    \ emitted by `count.pl` that got collected into the file `hst-ctrs.ed` and separate\
    \ those according to the command codes I inserted at the start of each line of\
    \ data:\n\n```\n$ for ch in a c i s x ; do\n> grep \"^$ch\" hst-ctrs.ed > hst-ctrs.ed,$ch\n\
    > done\n```\n\nAgain the `for` loop cycles through those five command category\
    \ codes one at a time calling `grep` to locate *lines* that start with these characters\
    \ using a *pattern* that is *anchored* to the start (left side) of each line by\
    \ using the *caret* or *circumflex* or *pointy-hat* character *first*.\n\nThe\
    \ collections of such lines `grep` finds get redirected into output files named\
    \ with a trailing comma (`,`) and the value of the `for` loop’s control variable\
    \ `$ch` to generate five new file names.\n\nChecking the number of lines in each\
    \ of these output files:\n\n```\n$ wc -l hst-ctrs.ed,?\n23 hst-ctrs.ed,a\n37 hst-ctrs.ed,c\n\
    5 hst-ctrs.ed,i\n30 hst-ctrs.ed,s\n5 hst-ctrs.ed,x\n```\n\nThose numbers agree\
    \ with what the `grep -c` command gave when I ran that on the whole `hst-ctrs.ed`\
    \ file.\n\nUsing `cat` to examine one of the smaller files:\n\n```\n$ cat hst-ctrs.ed,i\n\
    i d=$((365))\ni day=4\ni d=$((365))\ni wks=52\n```\n(Wait, the example in the\
    \ source text had some formatting artifacts there, but I will follow the logic\
    \ of the text provided):\n\n```\n$ cat hst-ctrs.ed,i\ni d=$((365))\ni day=4\n\
    i d=$((365))\ni wks=52\n```\nActually, based on the raw text provided:\nColumn\
    \ three at the right side contains the command count numbers.\n\nUsing another\
    \ command code character loop to call a two line AWK script to total up the sum\
    \ of those numbers in column 3:\n\n```\n$ for ch in a c i s x ; do\n> printf \"\
    %s –> \" \"$ch\"\n> awk '{ttl = ttl + $3 + 0} END {print ttl}' hst-ctrs.ed,$ch\n\
    > done > hst-ctrs.all\n```\n\nThe addition of zero (`0`) to the value of the third\
    \ field (`$3`) from each line coerces the value to a *number* instead of the default\
    \ which is a *string* — an important point to remember when using AWK.\n\nThe\
    \ `END {...}` clause gets run after all the lines get read and the value in variable\
    \ `ttl` includes the summation or total of all those command usage count numbers.\n\
    \nThe AWK code gets run on each of those new files named with the trailing comma\
    \ and one of the five codes.\n"
