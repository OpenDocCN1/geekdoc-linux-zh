    仔细输入接下来的两个命令。首先，基础的 `cd` 命令确保了我们将在自己的 `home` 目录下工作。在按下 `Enter` 键之前，请仔细检查两次 `echo`
    命令：


    ```bash

    $ cd

    $ echo "alias h=history" >> .bash_aliases

    $ $

    ```


    这条命令中从 `echo` 单词开始有五个 (5) 由空格分隔的部分。


    有两个双引号字符 —— 一个在第 2 部分的左侧，一个在第 3 部分的右侧。


    我们需要这些引号字符，是因为我们希望第 2 部分和第 3 部分作为*一个*参数传递给 `echo` 命令，而不是两个。


    在 `h` 和 `history` 之间有一个等号 (`=`) —— 在 `h` 字符与 `=` 符号之间没有任何空格。


    有两个 (2) 大于符号 (`>>`) 用于将 `echo` 命令的输出发送并*追加*到名为 `.bash_aliases` 的隐藏 (`.`) 文件中，然后我们按下
    `Enter` 键将其交给 shell 处理。


    尝试运行这个名为 `h` 的新 *alias* 命令——它应该会再次失败：


    ```bash

    $ h

    h: command not found

    $ type h

    bash: type: h: not found

    $ $

    ```


    这就是我们目前预期的。


    接下来，在 Terminal 窗口中打开一个新的 `tab` —— 我们可以按下三个 (3) 键组合 `{Ctrl}+{Shift}+{T}`。


    或者，我们可以打开一个*新的* Terminal 窗口 —— 鼠标右键点击 Terminal 图并选择 `New Window`。


    在新的 Terminal 标签页或窗口中，尝试运行我们刚刚添加到 `.bash_aliases` 文件中的名为 `h` 的新 alias 命令：


    ```bash

    $ h

    ...

    ...

    ...

    $ $

    ```


    我们应该能看到 `bash` shell 的 `history` 命令的输出。


    如果这*还没有*作用，请尝试通过输入以下命令在当前 Terminal 窗口或标签页中启动一个新的 *login* `bash` shell 实例：


    ```bash

    $ bash --login

    $ h

    ...

    ...

    ...

    $ $

    ```


    作为最后的手段，希望这能有效。


    新命令 `h` 是“*history*”的助记符。如果这成功了，那么在合理范围内，我们就可以确定初始化在我们的 Terminal 窗口中运行的 `bash`
    shell 进程的 shell 命令文件字符串或序列。


    如果 `h` 命令不起作用 —— 可能我们在输入那个看起来很奇怪五部分 `echo` 命令时犯了错误。


    我们可以使用 `Up` 和 `Down` 方向键回到历史列表中的那一行，然后使用 `Left` 和 `Right` 方向键跨越该命令行移动光标，双检是否有额外的或缺失的字符。


    我们可以使用 `Backspace` 和/或 `Delete` 键删除任何多余的字符，并输入一个或多个纯文本字符来插入缺失的文本。


    这种 `bash` shell 命令行编辑功能有时非常有帮助。


    如果你已经做到了这里——恭喜你。


    ## 为什么这很重要？


    一方面，这意味着我们可以向 `.bash_aliases` 文件中添加更多 `alias` 命令，并期望它们在我们*未来*的 Linux 登录会话可以使用。


    为了少输入 `history` 命令名的最后六 (6) 个字符，这听起来工作很大吗？


    这是一个简单的示例，用于测试 shell 启动序列并确保我们的 `.bash_aliases` 文件被使用。


    我使用了几十个 bash shell alias。它们节省了我的时间。


    它们减少了我犯的错误 —— 我只需要将 `alias` 命令较长的右侧以正确格式输入一次，之后只需使用别名即可——像 `h` 这样简直轻而易举。


    是 `bash` shell 在进行*解释*——我只需要将 `alias` 命令较长的右侧以正确格式输入一次，之后只需使用别名即可——像 `h` 这样简直轻而易举。

