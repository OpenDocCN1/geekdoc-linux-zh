  trans: '` 标签内的原始英文内容进行了深度清理和规范化翻译。


    以下是为您翻译的译文：


    [content]

    第二行和第三行左侧的大于符号（`>`）符号是由 `bash` shell 提供的，因为它在提示我们输入*更多*内容——它知道我们之前在该行中输入的内容仍然是一个*不完整*的
    shell 命令。它正在等待 `done` 关键字来结束 `for-do-done` 循环。这是一个有用且聪明的交互式反馈。


    `for-do-done` 循环*逐个*遍历这五个命令名称，调用 `grep` 来定位*以*这些命令名称*开头*的*行*。它使用了一个*锚定*在每行开头（左侧）的*模式*，该模式通过*首先*使用脱字符（*caret*）或上省略符（*circumflex*）或尖顶帽（*pointy-hat*）字符以及名为
    `c` 的变量的值——即 `"^$c"` 来实现。


    正如你在输出中看到的，这些命令被反复调用。我预计我当时查阅了 `man` 手页，以确保我在书的某部分中任何引用都获得了正确的信息。


    `count.pl` 找到了多少个`不同`命令？


    统计 `hst-ctrs.txt` 文件中的行数：


    ```

    $ wc -l hst-ctrs.txt

    100 hst-ctrs.txt

    ```


    这是一个很整齐的数字。有什么理由查询它吗？我不认为有。我预计这只是个偶然巧合。


    为了双重检查这一点，我运行了以下命令：


    ```

    $ sort -u hst-cmds.txt | wc -l

    100

    ```


    `sort` 命令的 `-u` 选项请求列出文件中项目的*唯一*列表。将该结果通过给 `wc -l` 即可得到这些*唯一*项目的计数——结果是 100。


    为了让我放心，我尝试在另一个终端 窗口中运行相同的命令，在那个窗口里，我通过 `cd` 切换到了开发区域中的一个目录。


    这在新的历史列表中给了我 969 个项目，而 `count.pl` 的输出有 86 行。因此，我对那个*漂亮*整整数字的顾虑消除了。


    接下来，我将 `hst-ctrs.txt`*复制*到文件 `hst-ctrs.ed` 中，并使用我最喜欢的 `vim` 编辑器在*每*行的开头（左侧）插入一个字符*代码*：


    ```

    $ cp hst-ctrs.txt hst-ctrs.ed

    $ vim hst-ctrs.ed

    ...

    ```


    我插入的命令分类代码是这些：


    ```

    a for alias

    c for command

    i for interactive

    s for script

    x for command error

    ```


    在编辑后的版本中检查同样的五行：


    ```

    $ head -20 hst-ctrs.ed | tail -5

    a bnchk              6

    a c                  13

    a c3                 35

    c cal                1

    c cat                34

    ```


    我所做的只是在每行的开头（左侧）添加或插入了命令分类代码和一个空格字符。


    如果我想要*自动化*这种分析方法，我可能会尝试将命令名称传递给 bash shell 的 `type` 命令，以获取它对每个命令分类的*意见*——我会把这个留到以后用。


    接下来，我运行了这个交互式 shell 命令，使用 `grep -c` 命令循环遍历这五个命令分类代码，以*统计*以相同代码开头的行数：


    ```

    $ for ch in a c i s x ; do

    > printf "%s –> " "$ch"

    > grep -c "^$ch" hst-ctrs.ed

    > done > hst-ctrs.nlns

    ```


    行首左侧的大于符号是由 bash shell 提供的，表示我们尚未完成一个有效的命令。


    `for-do-done` 循环*逐个*遍历这五个命令分类代码，调用 `grep` 来定位*以*这些字符*开头*的*行*。它使用了一个*锚定*在每行开头（左侧）的*模式*，该模式通过*首先*使用脱字符或上省略符或尖顶帽字符来实现。


    将在标题为**正则表达式**的章节中发现更多关于这些 `grep`*模式*。最后一行显示了我们如何重定向整个 `for-do-done` 循环的输出，并将其捕获到另一个后缀为
    `.nlns`（*行数*）的文件 `hst-ctrs.nlns` 中。


    该交互式命令的输出是：


    ```

    $ cat hst-ctrs.nlns

    a -> 23

    c -> 37

    i -> 5

    s -> 30

    x -> 5

    ```


    有 23 个*不同*的别名，37 个*不同*的命令和 30 个*不同*的脚本——还有 10 项杂项。这些是我选择用字符（`a`、`c`、`i`、`s` 和
    `x`）编码的分类的数量——它们都有*不同*的名称。


    使用另一个 AWK 脚本求和：


    ```

    $ awk ''{ttl = ttl + $3 + 0} END {print ttl}'' hst-ctrs.nlns

    100

    ```


    看起来还可以的。我们可以使用 `bc` 来检查总数：


    ```

    $ bc

    23 + 37 + 5 + 30 + 5

    100

    ```


    检查！按下控制键 `Ctrl+D` 告诉 `bc` 命令我们已经完成了输入，并让 bash shell 为我们提供下一个提示符。否则，我们一直可以做一些算术运算。该`history`
    中 37 个标准命令的列表如下：


    ```

    $ awk ''print $2'' hst-ctrs.ed,c | column -50

    audacity ps

    bc factor pwd

    cal file rm

    cat grep shopt

    cd history stat

    chmod size sudo

    cmp ispell tac

    convert less diff

    ls tree

    diff man type

    echo mkdir which

    einfo mv

    eog perdoc

    ```


    严格来说，命令 `cd`、`echo`、`history`、`pwd`、`shopt` 和 `type` 是 `bash` shell 的*内置*命令——对我来说是更多的
    Linux 命令。我几乎每天或每周都会运行大部分这些*别名*、*命令*和 shell*脚本*，来帮助我完成正在做的工作。


    我能估计我运行*别名*或标准 Linux*命令*或我的某个*脚本*的频率吗？


    让我们检查 `count.pl` 收集到文件中的数字，根据我们在输入的字符对 `hst-ctrs.ed` 进行分类：


    ```

    $ for ch in a c i s x ; do

    > grep "^$ch" hst-ctrs.ed > hst-ctrs.nlns

    > done

    ```

