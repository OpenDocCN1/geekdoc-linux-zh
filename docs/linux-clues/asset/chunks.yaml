    file system stores its meta-data information about how it can provide access for
    the file to which it points.


    What happens if we use the ‘`-s`’ option and make a *symbolic* link to ‘`ln.txt`’:


    > `$ ln -s ln.txt slnk-ln.txt`


    > `$ ls -igo *ln.txt`


    > `32098 -rw-r----- 2 3891 Jul 18 19:47 hard-ln.txt`


    > `32098 -rw-r----- 2 3891 Jul 18 19:47 ln.txt`


    > `32936 lrwxrwxrwx 1    6 Jul 18 20:07 slnk-ln.txt -> ln.txt`


    The symbolic link has a different *inode* number. The entry starts with the character
    ‘`l`’ (*ell*) instead of a dash (‘`-`’) and the file name detail points (‘`->`’)
    to or is *linked* to the original file ‘`ln.txt`’ — it has a name that’s 6 bytes
    in length as reflected by the number ‘`6`’ in column 4.


    What happens if we append extra text — such as the ‘`date`’ string onto the end
    of the original file ‘`ln.txt`’:


    > `$ date >> ln.txt`


    > `$ ls -igo *ln.txt`


    > `32098 -rw-r----- 2 3921 Jul 18 20:44 hard-ln.txt`


    > `32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt`


    > `32936 lrwxrwxrwx 1    6 Jul 18 20:07 slnk-ln.txt -> ln.txt`


    Notice the update in file *size* and *time* change information for *both* the
    *original* file and the *hard* link. The *symbolic* link has not changed.


    Does the *symbolic* link know we appended the date string onto the file to which
    it points:


    > `$ tail -1 slnk-ln.txt`


    > `Fri 18 Jul 2025 20:44:32 AEST`


    Yes it does — we can be certain of that.


