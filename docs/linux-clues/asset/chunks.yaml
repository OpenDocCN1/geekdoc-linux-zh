- fmt: "\nMore on those details in a later section.\n\nRemember those commands `cd`\
    \ and `pwd` mentioned earlier?\n\nTry running those two commands now:\n\n```\n\
    $ cd\n$ pwd\n/home/clu\n```\n\nRunning the `cd` command like that without any\
    \ argument will transport our point of reference in the Linux file system straight\
    \ to our own user home directory — named with a full path like `/home/{user}`.\n\
    \nThe `pwd` command — mnemonic for “print working directory” will display the\
    \ name of the location in the Linux file system where the `cd` command has taken\
    \ us.\n\nMy home directory is located at `/home/clu`.\n\nYour home directory will\
    \ reflect your user name.\n\nNotice the `pwd` output contains a forward slash\
    \ (`/`) character between each layer of sub-directories or sub-folders and we\
    \ use those to help specify the exact location in the Linux file system.\n\nMost\
    \ of the system’s executable program files like `df` and `ls` and `pwd` get stored\
    \ in the directory called `/usr/bin`.\n\nThe `bin` part is mnemonic for “binary”\
    \ because most programs in there get compiled into binary (machine code) from\
    \ the source code in which they got written.\n\nLooking at the inverted tree diagram\
    \ of the Linux file system, I hope you can find the two I show there.\n\nThe `df`\
    \ and `ls` objects are end nodes — containing no other links to file system objects\
    \ and in most cases these will be ordinary files — not sub-directories or sub-folders.\n\
    \nIt’s possible to have an empty directory or folder. The Ubuntu 24.04.2 installation\
    \ process made empty place holder directories with names like `Desktop`, `Documents`\
    \ and `Downloads`, etc.\n\nAnother exception is the object located at `/dev/tty`\
    \ — this is a special device file.\n\n## Absolute file paths\n\nAny file path\
    \ that starts with that top most forward slash (`/`) character gets called an\
    \ absolute path.\n\nWe call `/usr/bin/ls` the absolute path to the `ls` program\
    \ file.\n\nWhen we talk about the path to an object in the Linux file system it’s\
    \ normal to hear people speaking with phrases like:\n\n“slash you ess are, slash\
    \ bin, slash ell ess”\n\nThis refers to the `ls` program stored in the precise\
    \ absolute file path location `/usr/bin/ls`.\n\n## Relative file paths\n\nAnother\
    \ way to specify a file system object is to use a relative file path that does\
    \ not start with `/`.\n\nThis needs more context.\n\nDescribing my current work\
    \ I might say “I wrote a small shell script called `teeess.dot.sh` and copied\
    \ that to my `bin` directory.”\n\nHere I did not specify the full (or absolute)\
    \ path:\n\n```\n/home/clu/bin/tst.sh\n```\n\nInstead I used a relative path and\
    \ said the file `tst.sh` is in my personal `bin` directory.\n\nI expect the listener\
    \ will know “my `bin` directory” gets located below my own `/home/clu` directory\
    \ — assuming they know my user name is `clu`.\n\nIf we use a relative path name\
    \ instead of an absolute path name then we make an assumption that the reader\
    \ or hearer knows the point of reference.\n\nWe hope they will ask if they are\
    \ uncertain.\n\nSeasoned Linux users find it clearer to speak out the letter names\
    \ of the parts that do not make real (English) words — like `usr` and `ls`.\n\n\
    People could also say ‘user’ in place of spelling out ‘you ess are’ for the `usr`\
    \ part — best to cut them some slack.\n\nWe will often know what they mean from\
    \ the context of their statement.\n\nThese details begin to make more sense as\
    \ we start to use those terms.\n\nFor example, we could hear another Linux user\
    \ say “I ran the `which` command to get the absolute path of the `ls` executable.”\n\
    \nIn a Terminal window try running that command:\n\n```\n$ which ls\n```\n\nWhat\
    \ output did that produce?\n\nIs that an absolute path?\n\n## Command arguments\n\
    \nTry running the `which` command with these six arguments. Type the line as shown\
    \ and then press the `Enter` key:\n\n```\n$ which cd df du ls pwd which\n```\n\
    \nNotice there’s no output for the `cd` item!\n\nWhy? Because the `cd` command\
    \ is a shell built-in command and it needs to operate at a lower (inside the shell)\
    \ level.\n\nThis is one of those squeaky details we do not need to know all about\
    \ as a Linux user — until we start to write our own shell scripts and the like.\n\
    \nNotice those other five commands get found in the `/usr/bin` directory — as\
    \ far as the `which` command knows.\n\nIn the bash shell there’s a better command\
    \ to use instead of `which` — another shell built-in command called `type`:\n\n\
    ```\n$ type cd df du ls pwd which\ncd is a shell builtin\ndf is /usr/bin/df\n\
    du is /usr/bin/du\nls is aliased to ‘ls --color=auto'\npwd is a shell builtin\n\
    which is hashed (/usr/bin/which)\n```\n\nHere we see `cd` command is a shell `builtin`,\
    \ the `ls` command is aliased to itself with the verbose option string of `--color=auto`\
    \ and the command `pwd` is now another shell `builtin`.\n\nMore on aliases soon.\n\
    \nThe shell retains internal information about our current working directory location\
    \ and has no need to search for `pwd` and run that to provide information it already\
    \ knows.\n\nThe last line reports `which` as hashed because I had already used\
    \ that command and the `bash` shell has added it to a special hash table of quick\
    \ lookup commands it already knows where to find without needing to search for\
    \ those again.\n\nIt’s nice to know the `bash` shell takes all the short-cuts\
    \ it can to help our command requests run as fast as they can.\n\n## /usr/share/man\n\
    \nLooking back at the Linux file system inverted tree diagram — what is that long\
    \ path of file system objects on the right side?\n\nThis is where the on-line\
    \ documentation or `man` pages for commands like `df` and `ls` get stored.\n\n\
    These are general user commands and as such their manual page files get stored\
    \ in a directory with the absolute path:\n\n```\n/usr/share/man/man1\n```\n\n\
    Below `/usr/share/man` there’s seven more sub-directories `man2`, `man3`, `man4`,\
    \ ` ..., `man8` for each of the organized manual sections.\n\nThe file names like\
    \ `df.1.gz` and `ls.1.gz` ending in `.gz` imply these files get compressed with\
    \ the `gzip` program to save space.\n\nWhen we run the `man ls` command to read\
    \ the on-line manual page the compressed file gets decompressed and then displayed\
    \ for us.\n\nIt’s good to know that Linux is taking care of all those details\
    \ for us and presenting us with the information we request.\n\n## File information\n\
    \nApart from its file name and content the Linux system maintains other information\
    \ about the files it stores for us.\n\nLet’s take a closer look at that hidden\
    \ `.bashrc` file.\n\nThere’s another option (`-l`) for the `ls` command that can\
    \ provide more information for us. The option `-l` is mnemonic for a ‘long’ listing.\n\
    \nHere is the nine (9) columns of output I get when using that:\n\n```\n$ ls -l\
    \ .bashrc\n-rw-rw---- 1 clu clu 3771 May 28 15:50 .bashrc\n$\n```\n\n**Note:**\
    \ The file name and other parts of the output shown above could get wrapped onto\
    \ the next line because of page width size limitations.\n\nThe output from and\
    \ `ls -l` command contains these nine (9) space separated columns of information:\n\
    \n1. The first ten (10) characters (`-rw-rw----`) contain a directory or file\
    \ type bit or flag and then nine (9) access permission bits or flags — each one\
    \ is a single character\n\n   The first dash (`-`) character indicates this file\
    \ system object is an ordinary file\n\n   This first character will be a `c` for\
    \ a character special device file or a `d` for a directory object or an `l` for\
    \ a symbolic link to a file — tuck that away for future reference if interested\n\
    \n   The next nine (9) characters show three (3) sets of three (3) `rwx` characters\
    \ — in that order.\n\n   These are permission bits or flags for the object owning\
    \ `user`, the object owning `group` and then for all other users on our system.\n\
    \n   Character `r` means `read` access permission\n"
