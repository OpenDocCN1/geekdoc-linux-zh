    > `$`


    We found we had a file named ‘`.profile`’ in there and from what we read *above*
    about the `bash` shell *invocation* (start up) we expect the commands in that
    file to get read when our Terminal window starts — because (for me) that uses
    an interactive *login* shell.


    On my system I had neither of the other two files: ‘`.bash_profile`’ or ‘`.bash_login`’
    mentioned in the invocation note.


    If we examine the ‘`.profile`’ file we find it contains instructions to get it
    to read commands from another file we have that’s named ‘`.bashrc`’ — the *hidden*
    file we used with the ‘`ls -l`’ command.


    If we examine the ‘`.bashrc`’ file we find it contains instructions to get it
    to read commands from yet another file named ‘`.bash_aliases`’ — if that file
    exists.


    Again — all a bit convoluted for most of us.


    In my new Ubuntu 24.04.2 installation the file named ‘`.bash_aliases`’ did *not*
    yet exist.


    We can use that file (‘`.bash_aliases`’) to prove to ourself that the interactive
    ‘`bash`’ shell in our Terminal window *does* get initialised in the way that text
    in the ‘`man bash`’ manual pages describe.


    Why is that important?


    The ‘`.bash_aliases`’ file is a great place to start adding our own *alias* command
    definitions — like ‘`a`’ and ‘`c3`’ and ‘`n3`’.


    Is there already a ‘`.bash_aliases`’ file in your ‘`$HOME`’ directory?


    Please run:


    > `$ cd`


    > `$ ls .bash_aliases`


    > `ls: cannot access ’.bash_aliases’:`


    > `No such file or directory`


    If you see the ‘`No such file or directory`’ message then that looks okay — the
    file does not yet exist.


    **Note:** If you have already used the ‘`.bash_aliases`’ file — please make a
    *backup* copy of that:


    > `$ cd`


    > `$ cp -i .bash_aliases .bash_aliases-old`


    If you have the time and/or interest, stick with me and run or try to read through
    the next five (5) *sets* of commands — as an experiment.


    Let’s use the ‘`type`’ command to check to see if we already have a command named
    ‘`h`’ — it *should* fail:


    > `$ type h`


    > `bash: type: h: not found`


    > `$`


    The error message displayed before the next system prompt (‘`$`’) tells us we
    do not have any command named ‘`h`’.


    Next let’s make our own command called ‘`h`’ to run the ‘`history`’ command with
    that single key ‘`h`’ — and the Enter key.'
