    要重新运行 `previous` 命令并将其中一个 `old` 字符串更改为 `new` 字符串，我们可以输入一个 `caret` 或 `circumflex`（或“尖顶帽”）符号（`^`），然后是
    `old` `string`，紧接着是另一个 `caret` 或 `circumflex`（或“尖顶帽”）符号（`^`），最后是 `new` 字符串：


    > `^oldStr^newStr`


    例如：


    > `$ lwss file1.txt file2.txt`


    > `Command ’lwss’ not found, . . .`


    > `$ ^ws^es`


    > `less file1.txt file2.txt`


    > `. . .`


    我的手指又失误了 —— 只用了七次 (7) 次击键就解决了问题，而不是 25 次（包括 `{Enter}` 键）。


    这些 `bash` 历史列表和命令行简写方法得到了我由衷的赞同。


    每节省的每一秒或两秒对我都有利！


    ## 别名命令 (Alias commands)


    “bash” shell 提供了一种方法让我们使用它所谓的“别名”（aliases）。


    运行 `alias` 命令来显示已定义的别名列表：


    > `$ alias`


    > `alias l=’ls -CF’`


    > `alias la=’ls -A’`


    > `alias ll=’ls -alF’`


    > `alias ls=’ls --color=auto’`


    这些 `alias` 定义随我新新的 Ubuntu 24.04.2 Linux 安装一起提供。它们在 Linux 中已经存在多年。


    阅读 `man ls` 可以发现像 `-A`、`-C`、`-F` 等选项以及 `verbose` 选项 `--color=auto` 的含义。


    如果我们发现 `ls` 输出中的颜色难以辨认，可以运行命令：


    > `$ unalias ls`


    我更喜欢在白色纸张上阅读黑色的 `printed` 文本 —— 在深灰色（不是纯黑色）的 Terminal 窗口看白色文本 —— 我知道 —— 我很 `different`！


    我们在运行 `ls` 命令时可以添加 `-p` 选项，让它在目录名末尾追加 `/` 标识字符。


    为了更永久生效，我们需要调查 Terminal 颜色方案和/或在我们的 `.bashrc` 文件中注释掉该 `ls` 别名。


    `alias` 机制非常直接。我们使用命令名 `alias` 后跟一个 `alias definition`，它由我们选择的 `alias name`、等号
    (=) 符号和一个带引号的 `command` 字符串组成。


    在命令字符串周围使用单引号通常是最好的 —— 如果我们需要在命令内部使用双引号。


    如果我们定义了一个与现有别名同名的新别名，新定义将覆盖旧别名 —— 最好检查一下。


    我们可以输入 `alias` 命令，后跟想要使用的新别名 `name`。如果它尚未定义，我们将看到：


    > `$ alias tryMe`


    > `bash: alias: tryMe: not found`


    同时运行 `type` 命令来检查没有其他同名的 `command` 或 `script` 也是明智的：


    > `$ type tryMe`


    > `bash: type: tryMe: not found`


    否则，我们将看到该命名的 `alias` 定义：


    > `$ alias ll`


    > `alias ll=’ls -alF’`


    或者使用 `type` 命令，我们可以看到 shell `builtin`、`alias`、`command` 或 `script` —— 如果它已存在：


    > `$ type ll`


    > `ll is aliased to ‘ls -alF’`


    ## 添加别名 (Add an alias)


    让我们尝试添加一个名为 `a` 的别名来运行那个 `alias` 命令。记住先检查：


    > `$ type a`


    > `bash: type: a: not found`


    太棒了 —— 可以使用 `a` 作为我们的新 `alias`：


    > `$ alias a=alias`


    尝试一下新的 `a` 命令。


    `alias` 并不限于运行 `one` 个命令！


    我们可以使用分号（;）`command separator` 字符，并定义一个 `alias` 来运行一系列（series`）命令：


    > `$ type c3`


    > `bash: type: c3: not found`


    > `$ alias c3="clear;echo;ncal -b -3"`


    > `$ c3`


    > `...`


    我希望你喜欢这个结果。


    `alias` 命令定义周围的一对双引号（`"..."`）是必要的，因为存在命令列表以及最后一个 `ncal` 命令中的空格字符。


    我们希望整个右侧都被分配给别名 `c3`。


    我们可能希望在不给 `ncal` 提供 `-b` 选项的情况下获得输出：


    > `$ type n3`


    > `bash: type: n3: not found`


    > `$ alias n3="clear;echo;ncal -3;echo"`


    > `$ n3`


    > `...`


    我在两个别名中使用了 `ncal`，因为它突显了今天！


    想象一下可能性 —— 我们可以定义自己的 `aliases` 来做几乎任何事情。


    在交互式 shell 中这样使用 `alias` 命令有一个缺点 —— 当我们退出 Terminal 窗口或注销 Linux 时，这些新别名将会消失。


    一切并非无法挽回。有一两类方法可以让它们永久化。


    一种可能性是将定义的别名列表保存到纯文本文件中。


    下次我们登录时，可以使用 `source` 命令恢复这些预先记录的别名。


    这需要一点时间，通过 `source` 命令来完成。


    ## Bash 启动 (Bash startup)


    为了让这些别名生效，我们需要将它们写入一个特定的文件中。最常见的方法是写入 `.bashrc` 文件。


    对于大多数 Ubuntu 用户来说，`.bashrc` 是在交互式 shell 中自动加载的。


    我们可以通过 `cat` 命令查看该文件的内容：


    > `$ cat ~/.bashrc`


    如果你想向其中添加别名，可以使用编辑器（如 `nano` 或 `vim`）：


    > `$ nano ~/.bashrc`


    在文件中添加类似下面的行：


    `alias ll=''ls -la''`


    保存并退出后，运行 `source ~/.bashrc` 使更改立即生效：


    > `$ source ~/.bashrc`


    现在，你可以使用 `ll` 命令了。

