    \ the number *n*\n\n> \n\n> `!!`\n\n> — Refers to the previous command.\n\n> —\
    \ This is a *synonym* for ‘`!-1`’\n\n> \n\n> `!string`\n\n> — Refers to the most\
    \ recent command *preceding* the current position in our history list *starting*\
    \ with the unique *string*\n\n> \n\n> `!$`\n\n> — Refers to the last word of the\
    \ previous command\n\nIf we need to run *another* command (like ‘`less`’) using\
    \ the *same* *last* argument as we used on the previous command (like ‘`ls`’)\
    \ we can type:\n\n> `$ ls ~/long/path/to/file.blah`\n\n> `/home/clu/long/path/to/file.blah`\n\
    \n> `$ less !$`\n\nThis would then run:\n\n> `$ less ~/long/path/to/file.blah`\n\
    \nThat can save a bit of typing — or a mouse motion and mouse buttons *copy* and\
    \ *paste* operation.\n\nInstead of pressing the Up arrow key 20 times we could\
    \ type ‘`!101`’ and press the `Enter` key if we see the command we want to re-run\
    \ has a command number of ‘`101`’ in our `history` list.\n\nIf we have already\
    \ run that ‘`which`’ command with the six (6) arguments we could try entering:\n\
    \n> `$ !wh`\n\n> `which cd df du ls pwd which`\n\n> `/usr/bin/df`\n\n> `/usr/bin/du`\n\
    \n> `/usr/bin/ls`\n\n> `/usr/bin/pwd`\n\n> `/usr/bin/which`\n\n> `$`\n\nThe first\
    \ line displayed after we type ‘`!wh`’ and press the Enter key shows a copy of\
    \ the command that the shell is now running for us and the next five (5) lines\
    \ shows the output from that re-run ‘`which`’ command.\n\nRun the ‘`man bash`’\
    \ command and *search* for the string ‘`Event`’ (inside the `man` page display)\
    \ by typing the command ‘`/Event`’ and press the ‘`Enter`’ key — this should get\
    \ us to a section titled: ‘`Event Designators`’.\n\nPress the ‘`q`’ key when we\
    \ have seen enough in ‘`man bash`’.\n\nI find the item called a ‘`Quick substitution`’\
    \ to be useful too — when I mistype a command name or a file name."
