- fmt: "\nA `1` in parentheses in the second column of the output tells us the manual\
    \ pages for these come from section `1` of the online documentation and as such\
    \ these are general commands we can run.\n\nDon’t try to run items from different\
    \ manual sections — most of these are descriptions of library files, etc.\n\n\
    If we run the `man man` command we can find a list of those different sections\
    \ — like `System calls` and `Library calls` — important for software developers.\n\
    \nWe can try running `man -k games` to find a list of other programs we *can*\
    \ run to amuse ourself — in our spare time — there’s often something in section\
    \ `(6)` we can run on our personal Linux PCs.\n\nGetting back to `Disk space`\
    \ . . .\n\nNext we could think to try the search term `space.usage`:\n\n```bash\n\
    $ man -k space.usage {Enter}\n```\n\n```bash\ndf (1) - report file system disk\
    \ space usage\ndu (1) - estimate file space usage\n```\n\nThe words need to appear\
    \ in that order in the manual page descriptions.\n\nTry running the `df` command\
    \ to see what information that provides:\n\n```bash\n$ df {Enter}\n```\n\nToo\
    \ much information? It can make sense.\n\nCommand `df` is mnemonic for “disk free”\
    \ — look at `Available` and `Use%` columns. Using over 75% can mean it’s time\
    \ to get more storage.\n\nWe can use a `-h` option with the `df` command — to\
    \ show more “human readable” numbers.\n\nThe `-h` option will show a `K`, or `M`,\
    \ or `G` after the number of bytes if appropriate:\n\n```bash\n$ df -h {Enter}\n\
    ```\n\nRead `man df` for more details.\n\nThe `du` command is mnemonic for “disk\
    \ usage”. I often use the `-h` and `-s` options with this.\n\nThe `-s` option\
    \ is mnemonic for “summary” and reports one summarised number instead of one disk\
    \ use number for each directory or folder below the current location:\n\n```bash\n\
    $ du -s -h {Enter}\n```\n\nOr:\n\n```bash\n$ du -sh {Enter}\n```\n\nOften we can\
    \ combine two options together like that — not always — the command will complain\
    \ if it does not allow us to do that.\n\nRunning `du -h` (without the `-s` option)\
    \ will list one line for each file and directory found below the current directory\
    \ — that can include lots of files used by applications like word processors and\
    \ email clients and others — files we never knew the system needed to store for\
    \ us.\n\nIf we inspect the `man` page for the `du` command we can navigate to\
    \ the entry that describes the `-s` option by using a search term like `/ -s`\
    \ with a blank space *after* the `/` character and *before* the `-s` we want.\n\
    \nWhy? Because most `man` page sections that describe their options will get set\
    \ out on lines that start with blank space indentation at the left side before\
    \ each item like `-h` and `-s`.\n\n## User id\n\nEach user on a Linux system gets\
    \ their own user and group identifiers — starting from 1000 and is a member of\
    \ one or more groups starting with their own.\n\nAnother two character command\
    \ called `id` will display a string of identifiers like `uid` — user identifier,\
    \ `gid` — group identifier and `groups` — a list of the system groups to which\
    \ we have administrator access:\n\n```bash\n$ id {Enter}\nuid=1000(clu) gid=1000(clu)\
    \ groups=1000(clu), 4(adm), 24(cdrom), 27(sudo), 30(dip), 46(plugdev), 100(users),\
    \ 114(lpadmin)\n```\n\nMost of the entries after `groups=1000(clu)` is a list\
    \ of system administration groups to which we could need access at certain times.\n\
    \nIf there is another user on our Linux system named `alex` then we can see their\
    \ user id and groups access by running:\n\n```bash\n$ id alex {Enter}\nuid=1011(alex)\
    \ gid=1011(alex) groups=1011(alex),100(users)\n```\n\nThere’s another related\
    \ command called `groups` that will produce a list of the group names in which\
    \ the user is a member.\n\nWe get a bit less output by running the `groups` command:\n\
    \n```bash\n$ groups alex {Enter}\nalex : alex users\n```\n\nThis user has no administrator\
    \ access to system groups. They could need to ask the administrator to run certain\
    \ commands for them — if they *need* such access.\n\nThey could ask the administrator\
    \ to install new software they need for their work and other projects.\n\nAlways\
    \ consider with care what other people ask the administrator to do with that privileged\
    \ system administrator access.\n\nThe group numbers and names can — at times differ\
    \ from one Linux system to another.\n\nThe list of groups gets kept in a readable\
    \ plain text system file that gets stored at `/etc/group`.\n\nSee: `man group`\
    \ for the details.\n\n## Administrator privilege\n\nThe first account (the administrator)\
    \ created by the person who installs Linux gets added to other groups to enable\
    \ them to run administrator commands using the `sudo` command.\n\nNot all users\
    \ on a multi-user Linux server need access to administrator capability. Such access\
    \ must get restricted to one or two who *must* have such access to perform their\
    \ tasks.\n\nWe do not hand out administrator access to anyone.\n\nHow do we identify\
    \ trusted individuals who will not abuse the privilege that comes with such extended\
    \ group administrator access.\n\nIt takes a while to consider the depth of such\
    \ privilege.\n\nWe need to hunt through the on-line documentation and heed the\
    \ warnings about the use and potential for abuse of system commands.\n\nIn general,\
    \ administrator commands do not need to get used all the time by the average user\
    \ — like me — when we are doing ordinary user tasks.\n\nWhen we *need* to wear\
    \ our system administrator’s hat we should exercise extreme care before we press\
    \ the `{Enter}` key.\n\nThere’s no sense in making a mess from which we could\
    \ need to use more effort to clean up, restore and repair — or worse — re-install.\n\
    \nLearn to make use of the search command when reading the `man` pages — press\
    \ the `/` key and search word — then press the `{Enter}` key.\n\nWe could need\
    \ to know those access identifiers one day — running the `id` command displays\
    \ that information for the user who runs `id`.\n\n**Note:** I was displaying `{Enter}`\
    \ to remind us that we need to press the `{Enter}` key to hand over the command\
    \ we want the interactive `bash` shell to interpret and run for us.\n\nFrom here\
    \ on I will assume we know that need when we see a command after my system prompt\
    \ (`$`) at the start of a line.\n\n# Linux file system\n\nThe image shows a representation\
    \ of a small part of the Linux File System — we can think of it as an inverted\
    \ tree structure.\n\n```image\n![](media/file0.png)\n```\n\nMost user accessible\
    \ files on Linux can be one of three different types:\n\n*   an ordinary file\
    \ like a memo or a spreadsheet or a music file or a computer program or a shell\
    \ script or a data file, etc.\n*   a directory that contains links between file\
    \ names and directory names we use and their locations within the storage system.\n\
    *   a special device file for hardware input from a keyboard or a microphone or\
    \ a mouse or output to a terminal window, etc.\n\nAgain, we do not need to understand\
    \ every squeaky detail.\n\nThe top node labeled `/` — with the `slash` or *forward\
    \ slash* character, is also known by the names `root` directory or `root` folder\
    \ or by some as *the slash* directory or folder.\n\nThe Linux file system starts\
    \ from that point. \n\nI have shown four (4) sub-directories or sub-folders at\
    \ the next level down. In reality there’s about 15 and more could get added as\
    \ required when we install new application software onto our computers.\n\nLooking\
    \ at the node labeled `home` we see there’s another sub-directory or sub-folder\
    \ below that called `clu` — this is the user name I specified when installing\
    \ my fresh Ubuntu 24.04.2 system.\n\nYou should have one with your user name.\n\
    \nOn a multi-user Linux system there’s one for each different user and on large\
    \ systems there could be dozens or hundreds of *user* directories below what we\
    \ call */home*.\n\nThe Linux system manages access permissions according to in-built\
    \ rules and will prevent us from gaining access to another user’s files — unless\
    \ they make specific changes to the access permission on one or more files and/or\
    \ containing sub-directories.\n"
