    > 正则表达式的构建类似于算术表达式，通过使用各种运算符组合较小的表达式。


    文中的第三段告诉我们：


    > 大多数字符（包括所有字母和数字）都是匹配其自身的正则表达式。


    以及：


    > 任何具有特殊含义的元字符都可以在其前面加一个反斜杠 `\` 来引用。


    ## RE 元字符


    > ``.''` — 点号会匹配*除* `newline`（换行）控制字符以外的任何*单个*字符。


    > `[`’ — 开始一个由方括号 `[...]` 包围的*列表*，用于匹配*列表*中包含的*任意一个*字符。


    > `[abc]` — 匹配字符 `a` 或 `b` 或 `c` 中的*某一个* —— 在某些用户 `locale` 设置下，这可能会匹配 `[aBbCc]`。


    > 如果*列表*的*第一个*字符是脱字符或脱符符号（*pointy-hat*）`^`，则匹配任何**不在**列表中的字符。


    > 在方括号内部，用连字符 `-` 或破折号 分隔的一对字符将匹配一个字符*范围*。


    > `[m-q]` — 匹配字符 `m` 或 `n` 或 `o` 或 `p` 或 `q` 中的任意一个。


    > 某些命名的字符类在括号表达式中被预定义 —— 它们的名称自言易见：


    > `[:alnum:]`, `[:alpha:]`, `[:blank:]`, `[:cntrl:]`, `[:digit:]`, `[:graph:]`,
    `[:lower:]`, `[:print:]`, `[:punct:]`, `[:space:]` 和 `[:xdigit:]`。


    > 注意，*包围*每个类名称的方括号和冒号字符 `[:` 和 `:]` 是符号名称的一部分，除了列表表达式的外部括号外，这些**必须**也被包含进去。


    > 大多数*元字符*在*列表*的括号内部都会失去它们的特殊含义。


    > 要匹配字面量 `]`，请将其放在*列表*中的*第一个*字符。


    > 要匹配脱字符（或 *pointy hat*）字符，请将其放在*列表*中除（第一个）字符以外的任何位置。


    > 要匹配字面量连字符或破折号 `-`，请将其放在*列表*的*最后*。


    > **注意：** 如果我们需要限制*列表*，使其仅包含我们在*列表*中输入的那些字符，可以将一个名为 `LC_ALL` 的环境变量设置为*值* `C`：




    ```bash

    $ export LC_ALL="C"

    $ grep ''[bcd]'' note.txt

    ...

    ```


    > 我们可以尝试定义自己的 `alias` 命令：


    ```bash

    $ type grc

    bash: type: grc: not found

    $ alias grc=''export LC_ALL="C" ; grep''

    $ grc ''[bcd]'' note.txt

    ...

    ```


    这起作用吗？


    `export` 命令定义 `LC_ALL` 变量的方式，使其能够在交互式 bash shell 和新的非登录式命令 shell 中持续可见。请记住 ——
    我们在命令行上运行的每个 Linux 命令都会启动其中一个 shell —— 随后 `grep` 命令将在一个环境变量 `LC_ALL` 设置为 `C` 的
    bash shell 中运行。


    > **注意：** 你的 `locale` 可能与我的不同，你可能不需要使用这种*黑技巧*来让 `grep` 命令以你偏好的方式运行。


    ## RE 锚定


    脱字符或脱符符号（*pointy-hat*）`^` 和美元符号 `$` 是*元字符*，分别匹配*行*的开头（`^`）和结尾（`$`）的空字符串。


    **侧记：** 这两个符号*也*被用于 `vim` 编辑器，将*光标*移动到*行*的开头（`^`）和结尾（`$`） —— 是一种单键智能光标移动。


    两个字符符号 `\<` 和 `\>` 分别匹配*单词*开头和结尾的空字符串。


    更多的*元字符*对被定义用于匹配其他特殊情况。


    更多细节请参见 `man grep`。


    假设我们在主目录下仍然有一个名为 `td.sh` 的小型 shell 脚本副本：


    ```bash

    $ cd

    $ grep ''^echo$'' td.sh

    echo

    echo

    $

    ```


    这限制了 `grep` 命令只向我们显示除 `echo` 单词之外没有其他内容的行。对于这个小脚本来说没什么大碍。


    如果其中一个 `echo` 单词后面有一个尾随空格，那么这个 `grep` 命令将显示一行而不是两行。


    同样的命令可以在瞬间遍历一个包含数百行甚至数千行的文件。


    ## RE 重复


    正则表达式后面可以紧跟一个重复运算符。这些运算符是：


    > `?` — 匹配前面 RE 的*零次或一次*。


    > `*` — 匹配前面 RE 的*零次或多次*。


    > `+` — 匹配前面 RE 的*一次或多次*。


    > `{n}` — 精确匹配前面的 RE 恰好 *n* 次。


    > `{n,}` — 匹配前面的 RE *n* 次或更多次。


    > `{,m}` — 匹配前面的 RE 最多 *m* 次。


    > `{n,m}` — 匹配前面的 RE *至少* *n* 次且*不于* `m` 次。


    其他的 RE 操作和运算符还涵盖了 RE 拼接、RE 逻辑或、RE 优先级以及括号子表达式中的 RE 回引用。这是一个强大的信息处理计算概念。


    学习使用*正则表达式* —— 它们将大有益处。


    细节请参见 `man grep`。


    我们可以在其他程序中使用 RE，例如 `vim` 编辑器、强大的流编辑器 `sed` 以及 `less` 分页器。


