    Initially these will be empty place holders, except for `snap` that contains sub-folders
    for `firefox` and `snapd desktop integration`.


    Click on the [x] button at the top right side to close the File Browser window.


    Another of those quick start icons is `LibreOffice Writer`. If we click on that
    we will soon see a powerful Word Processor application window. I expect the menus
    and toolbars will appear familiar and operate like other products we have seen.


    Close the window again by selecting the [x] button at the top right side or by
    selecting the `Exit LibreOffice` option in its `File` menu.


    At the bottom left side of the main Ubuntu window is an item called `Show Apps`.
    If we select that we will see a collection of the application programs the demo
    or `try` version of Ubuntu has loaded.


    Try one or two other items — like `Clocks` or `Calculator` or `Calendar` or `Text
    Editor`.


    Ubuntu Linux is highly polished and provides the user with an extensive array
    of tools. The installation process has loaded a small sample of those.


    At best we have scratched the surface with the soft end of a feather.


    If we want to take Linux further we can either — install Linux “alongside” our
    current system — making it a dual boot system or we can — install Linux “in place
    of” our current system — caution.


    That is okay if we are ready and want to replace the old operating system.


    Are there any files on our current system we need to keep?


    Ensure you make a backup of those onto removable media before you overwrite your
    disk with a new Linux installation.


    Reversing that process is not covered here. It can be impossible if you did not
    backup your files. You will need to search for details about how to attempt that.


    Please read the Ubuntu notes before you go too far.


    If you are certain you want to install Ubuntu then you can return to the installer
    menu by selecting the `Install Ubuntu` shortcut icon on the desktop.


    I was using an old PC and needed to re-boot the computer and the select the `safe
    graphics` option to let me get through the installation process.


    If your computer device has another operating system installed on it then you
    should see an option to let you install Ubuntu alongside that system instead of
    replacing it.


    If you want Ubuntu Linux to be the single operating system on your hard drive
    then select Erase disk and install Ubuntu.


    Follow the prompts and select the defaults unless you know why you need to choose
    an alternative option.


    Good luck.


    # Linux user


    I spend untold hours working away at my Linux computer.


    As I write the text for this book — I am using Linux.


    Last century in the 1980’s I started using the Unix computer operating system
    when I worked at C.S.I.R.O. and have never looked back.


    The scientists and technologists like myself found we were able to get more work
    done on Unix than we had ever managed to achieve before on other systems.


    Linus B. Torvalds was a student at the University of Helsinki, Finland in 1991
    when he started developing Linux — over 30 years ago.


    Unix and now Linux are multi-user systems and each user gets their own “home”
    directory or folder from which they can assemble their own collections of files
    in any order that makes sense to them.


    In 2025 the Linux system is still the “operating system of choice” for most of
    the world’s largest and most capable supercomputer systems with compute clusters
    supporting thousands — now millions of CPU cores.


    The powerful Linux operating system is small enough to run on most PCs with at
    least 4 GB of RAM and 250 GB of disk — get more memory and SSD storage if you
    can.


    It’s easy to add more user accounts to your Linux PC system to give other family
    members access to Linux if needed.


    The files for each user get kept in their own separate area in the computer storage
    — we’ll look at that in due course.


    Unlike the popular commercial computer systems where the user interacts most often
    through the use of a “mouse” pointing device to select files and run application
    programs that each have their own “icons” — the Linux system enables both that
    form of interface and it supports a flexible text based command interface that
    people like me find easy to use and more productive.


    Why? Instead of needing to locate the file and program icons and grab the mouse
    to push the mouse pointer around the screen to select and double click those objects
    to make my intentions known, I can spend my time with my fingers over my keyboard
    and find it easier to type short mnemonic commands and names of the files I want
    to use into a `Terminal` window.


    That sounds a bit “Old school” and in one sense — true. I have been using this
    style of working on my computer for a long time. I have tried other computer systems
    and always find myself setting those aside and getting back to my more productive
    Linux `Terminal`.


    Is that because we can’t teach this “old dog” any new tricks? I don’t think that
    — I learn something new almost every day — I firmly believe the Terminal interface
    is more productive.


    I “talk” to my computer from my keyboard using an interactive shell command language
    that provides me with enormous computing capability including short-hand methods
    and programmability features to help me achieve my own array of activity.


    What gives Linux its edge? What makes it unique?


    ## File system and process


    The computation model upon which Unix and Linux got designed and built contains
    two important concepts.


    Once we understand these two concepts of a “file system” and a “process” we know
    everything we need — to make rapid progress.


    I expect you know we store information in “files” and we keep those files in collections
    of “directories” or “folders” to help us locate the files we need.


    It makes sense to keep information organised rather than scattered around the
    place — or worse — keeping everything in one enormous area with no delineation.


    We do not want to be playing “Find the needle in a haystack” every time we need
    a report or a memo or a data file or a computer script.


    On my computer I use a series of directory or folder names with any number of
    sub-directory or sub-folder levels I need to make information easy for me to find.
    We will take a closer look at how to do that.


    In a nut shell it’s these capabilities the “file system” helps to provide and
    maintain for us — complete with file access permissions to help keep information
    under our control — at the base level.


    We could use data encryption methods for more complex forms of security if this
    need get determined.


    A `process` is an instance of a running program that got loaded into the computer’s
    memory to perform its action(s) for us.


    Not every process in Linux is a ‘one-size-fits-all’ or stand alone application
    — there’s more flexibility here.


    The Linux user has access to easy to use mechanisms in an interactive and programmable
    shell process to enable us to connect the output of one process into the input
    of another process — ad-infinitum if such a process chain makes sense.


    These interconnect features of the `process` allow us to construct our custom
    made process pipelines to run tasks with both repeatability and reliability that
    is difficult to achieve on other computer systems.


    We do not need to understand every squeaky detail.


    In later sections we will inspect helpful features of both of those Linux system
    design concepts.


    ## Mnemonic commands


    Working in a Terminal window the executable programs or commands in Linux often
    have what look like unusual file names. At first they appear almost cryptic.


    After 5 or 10 minutes these start to make sense.


    Most of the command programs that started their development in the older Unix
    environment got given short mnemonic names — chosen to assist our memory recall.

