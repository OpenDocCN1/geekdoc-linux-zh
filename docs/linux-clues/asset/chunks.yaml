    of the ‘`history`’ command name?


    This is a simple example to test the shell startup sequence and ensure our ‘`.bash_aliases`’
    file gets used.


    I use dozens and dozens of bash shell aliases. They save me time.


    They reduce the number of mistakes I make — all I need to do is get the longer
    right side of the ‘`alias`’ command typed in its correct form once and from then
    on using the alias name — like ‘`h`’ is a snap.


    It’s the ‘`bash`’ shell that is *interpreting* the command lines we type — when
    we press the Enter key. It attempts to ‘*parse*’ (read with care) through the
    characters we have typed looking for any obvious errors — mistyped command names
    or other anomalies in any command option(s) and/or argument(s).


    If the shell accepts what we enter as a *valid* command then it calls upon the
    Linux system to run that command for us.


    What is a *valid* command?


    ## Invalid commands


    Let’s try running an *invalid* command:


    > `$ ls -z`


    > `ls: invalid option – ’z’`


    > `Try ’ls --help’ for more information`


    > `$`


    I expect I intended to run “`ls -a`” command and missed the ‘`a`’ key by one and
    hit the ‘`z`’ key by mistake!


    The bash shell parsed my ‘`ls -z`’ command line and considered it a possible ‘*valid*’
    command and got the Linux system to locate the ‘`ls`’ command (in ‘`/usr/bin/ls`’)
    and passed the ‘`-z`’ option to that for me.


    It’s the ‘`ls`’ command that generates and emits the error message that gets displayed
    before the next system prompt (‘`$`’).


    ## Linux command parts


    Linux commands get *composed* from three different parts — these are:


    1.  the command *name*,


    2.  command *options* if required and


    3.  command *arguments* if required.


    We *always* need to specify the command name part — that’s essential.


    We do not always need to specify any option(s) or argument(s).


    When we run a bare ‘`cd`’ command we use the command name *without* any options
    or arguments.


    When we run an ‘`ls -a`’ command we use the command name with an option of ‘`-a`’
    to direct ‘`ls`’ to display *all* files — including any hidden files that start
    with a dot (‘`.`’) character.


    Command options *always* start with a dash (‘`-`’) character — or two *double*
    dash (‘`--`’) characters in a more *verbose* form of option strings.


    Often there could be more than one option we need to specify to get a command
    to run in the way we want it to.


    When we run a command like ‘`type ls`’ we use the command name ‘`type`’ with an
    *argument* of ‘`ls`’. Earlier we looked at running an instance of ‘`type`’ with
    six arguments.


    In general we can think of every Linux command as having a command syntax like
    this:


    > `$ command [-option(s)] [argument(s)]`


    The square brackets around the options and arguments parts are *not* a part of
    the command syntax — rather they imply and serve to remind us the enclosed part
    is *optional*.


    In most cases the three parts always occur in that Left to Right order — the command
    name is *mandatory*.


    Options and arguments get used *when* required — to direct the command *how* to
    operate — or to direct the command on *what* file system *object(s)* or other
    *parameter(s)* to operate.


    # Process ins & outs


    In an earlier chapter I mentioned two important design concepts found in both
    Unix and Linux — the *file system* and the *process*.


    In case we didn’t notice — we have been making good use of both of those ubiquitous
    entities.


    We know a process is a *running* instance of a program loaded into memory from
    an executable file found in the file system.


    For example the ‘`bash`’ shell running inside our Terminal gets found in the file
    ‘`/usr/bin/bash`’. When we interact with `bash` it runs commands like ‘`date`’
    or ‘`ls`’ or ‘`ncal`’ or ‘`pwd`’ when we ask it to.


    Each of those commands we run becomes another ‘`process`’ as it does what we ask
    those to do what they do for us.


    The Linux operating system keeps track of who runs a process and from which of
    their Terminal windows or other applications a command gets run so it can send
    the process output back to the correct location.


    ## Process PIDs


    There’s a helpful command called ‘`ps`’ — mnemonic for “*processes*” that will
    display a list of the processes we have running in our current Terminal — unless
    we direct it otherwise. See ‘`man ps`’ for more details.


    > `$ ps`


    > `  PID TTY         TIME CMD`


    > ` 3108 pts/0   00:00:00 bash`


    > ` 3120 pts/0   00:00:00 ps`


    > `$`


    This output from ‘`ps`’ shows the user had two processes running in the Terminal
    window or active Terminal tab. There’s an instance of the ‘`bash`’ shell and there’s
    the instance of ‘`ps`’ that they ran to get the information.


    The first column headed ‘`PID`’ contains the process identifier number. The ‘`PID`’
    of the ‘`bash`’ shell is ‘`3108`’ and the ‘`PID`’ of the ‘`ps`’ process is ‘`3120`’.'
