    \nThat amounts to a saving of 180 to 360 hours — say 18 to 36 ten (10) hour work\
    \ days each year — and I have realised those gains for decades.\n\nThe ‘`alias`’\
    \ mechanism is a good choice for running a small number of *fixed* commands.\n\
    \nOur scripts can contain conditional tests like ‘`if`’ statements to determine\
    \ what commands get run on a selection of files or controlling parameters and\
    \ with the necessary or preferred options to get the results we want and to decide\
    \ where to send the output(s).\n\nWe can write our own `bash` shell *scripts*\
    \ to run dozens or scores of commands — complete with the ability to loop over\
