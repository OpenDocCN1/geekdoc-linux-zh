- fmt: "\nMy modified file gets a `git add` process run on it to make it a staged\
    \ item ready to get committed to the `git` database.\n\nNext a `git commit` process\
    \ gets run to deposit my staged updates into the `.git` repositories that I maintain\
    \ in each of those (`src/...`) locations.\n\nThe initial concepts behind and the\
    \ design for `git` got initiated by Linus Torvalds while he was developing and\
    \ coordinating enhancements to the Linux kernel system — complex software that\
    \ needs constant updates and hence the ability to keep track of hundreds and thousands\
    \ of changes.\n\nA `git` repository can maintain parallel branches of development\
    \ if required and can merge together those branches when appropriate development\
    \ and testing and any conflict resolution gets done and then gets our approval\
    \ — it’s a most capable version control system.\n\nSee `man git` for more details\
    \ — there is extensive documentation to read there. See `man gittutorial` to get\
    \ started.\n\nNow I expect that sounds like a lot of work. The good thing is that\
    \ most of these steps get encapsulated in my own development and release scripts\
    \ and `aliases`.\n\nI run a `script` or an `alias` at the appropriate time to\
    \ instigate the action or actions I want to see taken on a specified file.\n\n\
    Following this sort of procedure helps me keep control of what I am doing and\
    \ what I have completed — helps me see what is useful and what needs more work.\n\
    \nAt last count I have over 500 scripts in my `$HOME/bin` directory that got written\
    \ and developed by me — since I started using Linux in 1994.\n\nThat equates to\
    \ about one (1) new script each month — there’s plenty of other work going on\
    \ with time to spare.\n\nI could not have done that without developing and refining\
    \ my software handling procedures over the years. I started slow and built small\
    \ improvements as time went by.\n\nWhat ever do I do with all those scripts?\n\
    \nIf I am truthful I expect most of these have outlived their usefulness. My requirements\
    \ can change from one week to the next and writing a new small piece of `bash`\
    \ shell code can provide a solution in next to no time.\n\nThere’s a small number\
    \ of scripts that got started with their development in the first year or two\
    \ — and I still use these almost every day — even now.\n\nTo me that’s most encouraging.\
    \ I know the small amounts of effort I put into my shell script writing can pay\
    \ dividends for years to come.\n\nThese shell scripts continue to work in the\
    \ way I programmed them to — even though my Linux system has undergone over 22\
    \ major updates.\n\nMost of those updates happen in an incremental manner and\
    \ the impact on me — the Linux user — is minimal. At worst a minute or two every\
    \ other day or week — except when I choose to upgrade to the latest LTS release\
    \ if that needs to happen on its own.\n\nI keep small fragments or snippets of\
    \ shell script code to help me write other scripts. For instance there’s a main\
    \ one called `start.sh` that helps me get going on almost any new shell script\
    \ with a framework that I prefer to use.\n\nIf a shell script needs to perform\
    \ a significant amount of work and needs to provide the user with more than one\
    \ option then I will use that `start.sh` script because it contains code to handle\
    \ command-line options using the `getopt` process I prefer (rather than `getopts`)\
    \ and it handles lists of command-line arguments with a `bash` shell `while-do-done`\
    \ loop method I have trusted for years.\n\nIf I find myself looking at a shell\
    \ script I wrote years ago there will be other fragments of code I can read into\
    \ the old script to help me update that to use my latest coding standards and\
    \ use better code blocks that I continuously try to improve as time goes by.\n\
    \nIn Linux there’s a clever utility called `shellcheck` — a static analysis and\
    \ linting tool for sh/bash scripts.\n\nWe can run `shellcheck` on our script(s)\
    \ and follow the advice it gives:\n\n```\n$ shellcheck td.sh\n```\n\nRemember,\
    \ no news is good news!\n\nI use `shellcheck` to help me keep the content in my\
    \ shell scripts conforming to most of the suggestions it provides — except when\
    \ I have a good reason to use any personal variation to those guidelines.\n\n\
    For example, in an interactive script when I need to prompt the user to press\
    \ the `Enter` key to continue after I have displayed information I want them to\
    \ read — I could write:\n\n```bash\nprintf \"Press the Enter key to continue:\
    \ \"\n# shellcheck disable=SC2034\nread -er Resp\n```\n\nWithout the `# shellcheck\
    \ disable=SC2034` comment line the `shellcheck` program will forever complain\
    \ about my use of the unreferenced variable I have called `Resp` given to the\
    \ `read` command.\n\nAll my script needs — is to get an `Enter` key response from\
    \ the user.\n\nReading `man bash` the `read` command can be called without a variable\
    \ like `Resp` — in that case the response from the user gets assigned to a variable\
    \ named `REPLY`.\n\nI use the variable `Resp` because is certain cases I will\
    \ want to make use of what the user responds — when I ask the user to specify\
    \ one from a certain choice when I could prompt them with:\n\n```bash\nprintf\
    \ \"Continue (Y)es or (N)o?\"\nread -er Resp\ncase \"$Resp\" in\n    [Yy]*) ;;\n\
    \    [Nn]*) exit 0 ;;\n    ) exit 9 ;;\nesac\n```\n\nThe fact that I will not\
    \ always want to use that variable for anything other than helping my script to\
    \ wait for a response from the user is my choice!\n\nIt’s good to know I can help\
    \ the `shellcheck` program to ignore that — when I choose.\n\nI am exceeding glad\
    \ that the original Bourne Shell (`sh`) and now the Bourne-again Shell (`bash`)\
    \ is so expressive and capable of performing the necessary conditional logic tests\
    \ with looping constructs and variable and file handling features to make a programmer’s\
    \ life more productive.\n\nA shell script is not the answer to everything — at\
    \ times we need to use a more powerful solution. Shell scripts sit with perfection\
    \ between the layers of computing capability provided by the powerful Linux kernel\
    \ and those two important design concepts of the file system and the process.\n\
    \nIn Linux a file is a file — it does not much matter what the content.\n\nWe\
    \ use the same utility programs like `ls` and `cp` and `mv` to handle music files\
    \ and PDF files and plain text files without the need to be too concerned about\
    \ the file — until we want to listen to the music or print or display the PDF\
    \ files or pull apart and re-assemble the plain text files that can be letters\
    \ or memos or shell scripts or `...\n\nThe capable Linux system provides us with\
    \ thousands — yes thousands of resources we can download and use to handle almost\
    \ every data type and content we can imagine.\n\nThere’s a `Software Manager`\
    \ tool to help us install new applications on our Linux PCs — although I find\
    \ this GUI program more difficult to use than other methods.\n\nMy head does not\
    \ deal well with an avalanche of icons!\n\nFor years I have been using the `synaptic`\
    \ (another GUI) package manager to help me locate and install extra pieces of\
    \ software for my Linux PCs.\n\nWhether it’s an application to play music or to\
    \ manage an SQL database or to help me with my programming or writing or to convert\
    \ data from one format to another — `synaptic` makes it easy for me to find what\
    \ I need.\n\nFor example the `ImageMagick` suite of command-line tools like `convert`\
    \ to help convert bitmap image file formats and *resize*, *blur*, *crop*, *despeckle*\
    \ an *dither* an image — and more.\n\nOr the GUI `audacity` program to help me\
    \ edit the wave files (`*.wav`) for my recorded music.\n\nOr a command-line program\
    \ called `cmus` to help me play a selection of other music from my collection\
    \ of favourite songs and instrumental pieces — there’s a `cmus-tutorial` to help\
    \ us get started in a minute or two.\n"
  raw: 'My *modified* file gets a ‘`git add`’ process run on it to make it a *staged*
    item ready to get *committed* to the ‘`git`’ database.


    Next a ‘`git commit`’ process gets run to deposit my *staged* updates into the
    ‘`.git`’ *repositories* that I maintain in each of those (‘`src/...`’) locations.


    The initial concepts behind and the design for ‘`git`’ got initiated by Linus
    Torvalds while he was developing and coordinating enhancements to the Linux kernel
    system — complex software that needs constant updates and hence the ability to
    keep track of hundreds and thousands of changes.


    A ‘`git`’ repository can maintain *parallel* branches of development if required
    and can *merge* together those branches when appropriate development and testing
    and any *conflict* *resolution* gets done and then gets our approval — it’s a
    most capable version control system.


    See ‘`man git`’ for more details — there is extensive documentation to read there.
    See ‘`man gittutorial`’ to get started.


    Now I expect that sounds like a lot of work. The good thing is that most of these
    steps get encapsulated in my own development and release *scripts* and *aliases*.


    I run a *script* or an *alias* at the appropriate time to instigate the action
    or actions I want to see taken on a specified file.


    Following this sort of procedure helps me keep control of what I am doing and
    what I have completed — helps me see what is useful and what needs more work.


    At last count I have over 500 scripts in my ‘`$HOME/bin`’ directory that got written
    and developed by me — since I started using Linux in 1994.


    That equates to about one (1) new script each month — there’s plenty of other
    work going on with time to spare.


    I could not have done that without developing and refining my software handling
    procedures over the years. I started slow and built small improvements as time
    went by.


    What ever do I do with all those scripts?


    If I am truthful I expect most of these have outlived their usefulness. My requirements
    can change from one week to the next and writing a new small piece of `bash` shell
    code can provide a solution in next to no time.


    There’s a small number of scripts that got started with their development in the
    first year or two — and I still use these almost every day — even now.


    To me that’s most encouraging. I know the small amounts of effort I put into my
    shell script writing can pay dividends for years to come.


    These shell scripts continue to work in the way I programmed them to — even though
    my Linux system has undergone over 22 major updates.


    Most of those updates happen in an incremental manner and the impact on me — the
    Linux user — is minimal. At worst a minute or two every other day or week — except
    when I choose to upgrade to the latest LTS release if that needs to happen on
    its own.


    I keep small fragments or snippets of shell script code to help me write other
    scripts. For instance there’s a main one called ‘`start.sh`’ that helps me get
    going on almost any new shell script with a framework that I prefer to use.


    If a shell script needs to perform a significant amount of work and needs to provide
    the user with more than one option then I will use that ‘`start.sh`’ script because
    it contains code to handle command-line options using the ‘`getopt`’ process I
    prefer (rather than ‘`getopts`’) and it handles lists of command-line arguments
    with a `bash` shell ‘`while-do-done`’ loop method I have trusted for years.


    If I find myself looking at a shell script I wrote years ago there will be other
    fragments of code I can read into the old script to help me update that to use
    my latest coding standards and use better code blocks that I continuously try
    to improve as time goes by.


    In Linux there’s a clever utility called ‘`shellcheck`’ — a static analysis and
    linting tool for sh/bash scripts.


    We can run ‘`shellcheck`’ on our script(s) and follow the advice it gives:


    > `$ shellcheck td.sh`


    Remember, no news is good news!


    I use ‘`shellcheck`’ to help me keep the content in my shell scripts conforming
    to most of the suggestions it provides — except when I have a good reason to use
    any personal variation to those guidelines.


    For example, in an interactive script when I need to *prompt* the user to press
    the ‘`Enter`’ key to *continue* after I have displayed information I want them
    to read — I could write:


    > `printf "Press the Enter key to continue: "`


    > `# shellcheck disable=SC2034`


    > `read -er Resp`


    Without the ‘`# shellcheck disable=SC2034`’ comment line the ‘`shellcheck`’ program
    will forever complain about my use of the *unreferenced* variable I have called
    ‘`Resp`’ given to the ‘`read`’ command.


    All my script needs — is to get an ‘`Enter`’ key *response* from the user.


    Reading ‘`man bash`’ the ‘`read`’ command can get called *without* a variable
    like ‘`Resp`’ — in that case the *response* from the user gets assigned to a variable
    named ‘`REPLY`’.


    I use the variable ‘`Resp`’ because is certain cases I will want to make use of
    what the user responds — when I ask the user to specify one from a certain choice
    when I could prompt them with:


    > `printf "Continue (Y)es or (N)o?` `"`


    > `read -er Resp`


    > `case "$Resp" in`


    > `    [Yy]*) ;;`


    > `    [Nn]*) exit 0 ;;`


    > `    ) exit 9 ;;`


    > `esac`


    The fact that I will not always want to use that variable for anything other than
    helping my script to wait for a response from the user is my choice!


    It’s good to know I can help the ‘`shellcheck`’ program to ignore that — when
    I choose.


    I am exceeding glad that the original Bourne Shell (‘`sh`’) and now the Bourne-again
    Shell (‘`bash`’) is so expressive and capable of performing the necessary conditional
    logic tests with looping constructs and variable and file handling features to
    make a programmer’s life more productive.


    A shell script is not the answer to everything — at times we need to use a more
    powerful solution. Shell scripts sit with perfection between the layers of computing
    capability provided by the powerful Linux kernel and those two important design
    concepts of the *file system* and the *process*.


    In Linux a file is a file — it does not much matter what the content.


    We use the same utility programs like ‘`ls`’ and ‘`cp`’ and ‘`mv`’ to handle music
    files and PDF files and plain text files without the need to be too concerned
    about the file content — until we want to listen to the music or print or display
    the PDF files or pull apart and re-assemble the plain text files that can be letters
    or memos or shell scripts or Lilypond music notation files or `C++` or `C` programs
    or Python scripts or HTML web page files or Java programs or SQL query scripts
    or data inputs to database files or `...`


    The capable Linux system provides us with thousands — yes thousands of resources
    we can download and use to handle almost every data file type and content we can
    imagine.


    There’s a ‘`Software Manager`’ tool to help us install new applications on our
    Linux PCs — although I find this GUI program more difficult to use than other
    methods.


    My head does not deal well with an avalanche of icons!


    For years I have been using the ‘`synaptic`’ (another GUI) package manager to
    help me locate and install extra pieces of software for my Linux PCs.


    Whether it’s an application to play music or to manage an SQL database or to help
    me with my programming or writing or to convert data from one format to another
    — ‘`synaptic`’ makes it easy for me to find what I need.


    For example the ‘`ImageMagick`’ suite of command-line tools like ‘`convert`’ to
    help *convert* bitmap image file formats and *resize*, *blur*, *crop*, *despeckle*
    an *dither* an image — and more.


    Or the GUI ‘`audacity`’ program to help me edit the wave files (‘`*.wav`’) for
    my recorded music.


    Or a command-line program called ‘`cmus`’ to help me play a selection of other
    music from my collection of favourite songs and instrumental pieces — there’s
    a ‘`cmus-tutorial`’ to help us get started in a minute or two.'
