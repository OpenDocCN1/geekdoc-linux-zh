  trans: '


    - 字符 `w` 表示 `write` 写入权限

    - 字符 `x` 表示 `execute` 执行权限

    - 字符 `-` 表示权限未 `not` 授予

    - 这九个字符中的任何一个都可以被横字符 (`-`) 替换 —— 表示从 `user`（用户）、`group`（组）或 `others`（其他）中移除权限位


    2. 指向该文件系统对象的链接数

    3. 拥有 `user` 名称标识的对象

    4. 拥有 `group` 名称标识的对象

    5. 文件系统对象的大小（字节字节）以及可选的单位指定符（例如 `3.7K` 或 `M` 或 `G`、`...`），如果我们添加了 `-h` 选项 —— 这是
    `ls -l` 命令中 *human readable*（人类可读）的缩写。

    6. 最后更新的月份

    7. 更新的日期

    8. 更新的时间（小时和分钟），对于更新超过一年前的对象，我们将看到 4 位数的年份

    9. 文件系统对象的名称


    对于这个 `.bashrc` 文件，我们可以看到这三组权限位中，用户为 `rw-`，组为 `rw-`，其他为 `---`。


    第 3 和第 4 列显示所有者的 *user* 和 *group* 标识为 `clu` —— 这是我在新安装的 Linux 上选择使用的用户名。


    这些权限位意味着 *user* `clu` 或任何属于 `clu` *group* 组的 *user* 都可以 *read* (`r`) 和 *write*
    (`w`) 此文件。


    *execute* (`x`) 执行权限位被 *denied*（拒绝，设置为横字符 `-`）。


    对于 *all*（所有）其他用户，*all* 权限访问位都通过最后三个横字符 (`---`) 被 *denied*（拒绝）。在第 5 列中，`.bashrc`
    文件的大小报告为 3771 。Linux 为我们在文件系统中存储的每个文件和目录维护着十九（19）项 *metadata*（元数据）（以及更多）。


    权限位使 Linux 系统通过比较文件所有者标识符与尝试访问文件的用户标识符，来维持对谁可以访问我们生成的文件的控制。


    如果第三组 `rwx` 权限位 *not* 提供用户所需的 *read* 或 *write* 或 *execute* 访问，则会进行更多检查。


    如果请求访问的用户没有相同的用户标识符或组标识符，或者 `rwx` 权限位未授予所需的访问，那么他们将看到 `Permission denied`（权限被拒绝）的错误信息。


    知道 Linux 文件系统根据我们选择在文件系统对象上设置的权限位执行这些检查是好的。具有超级用户 (`sudo`) 权限的用户或具有此类权限的 *malicious*（恶意）程序才能绕过这些安全意图。


    ## chmod 命令


    有一个名为 `chmod` 的命令 —— *change mode*（更改模式）的缩写，它允许我们更改具有相应 *owner*（所有者）权限的文件权限位（*access
    mode*）。


    `chmod` 命令知道这三组权限位，并将它们识别为 `u` 代表 *user*（用户）、`g` 代表 *group*（组）、`o` 代表 *others*（其他）。


    我们可以在这些 *set* 标识符 (`u,g,o`) 之后加上 `+` 符号来 *add*（添加）权限，或加上 `-` 符号来 *subtract*（减去）权限。


    然后我们追加一个、二或三个我们想要 *add* 或 *subtract* 的 `r`、`w` 或 `x` 权限位字母。


    当我们制作一个想要 *executable*（可执行）的小型 shell 脚本时，我们将使用 `chmod` 命令来实现：


    ```bash

    $ chmod u+x tst.sh

    ```


    这为拥有命名文件的用户 (`u`) 添加了执行 (`x`) 权限位。如果我们想为 *user* (`u`) 和 *group* (`g`) 所有者标识符都添加该
    *execute* (`x`) 权限位，我们可以在一步内完成：


    ```bash

    $ chmod ug+x tst.sh

    ```


    ## 交互式 shell


    我希望你已经成功尝试了 —— 或者你已经熟悉目前为止涵盖的大部分命令。


    ## 命令补全


    交互式 bash shell 包含了简写方法，帮助我们更省力地运行命令 —— 例如按 `Tab` 键帮助我们补全命令名或文件名。


    尝试输入 `hi` 然后按 `Tab` 键。如果没有其他以字母 `hi` 开头的命令，它可能会展开为 `history`。如果*不是*，我们可以再次按 `Tab`
    键获取以该方式开头的命令列表。然后我们可以输入额外的字符为我们想要的命令创建一个唯一的前缀字符串，然后再次按 `Tab` 键。当它展开为我们想要的命令名时，按
    `Enter` 键就会为我们运行它。


    有时这非常有用 —— 如果有一列以相同字符字符串开头的命令，则并不总是如此。如果在显示的列表中看到了想要运行的命令，可以使用 `Ctrl+U` 进行高亮，然后按
    Enter 键。


    ## 命令历史


    ```bash

    $ date

    ```


    ```bash

    $ history

    ```


    ```bash

    $ 121

    ```


    ```bash

    $ 122

    ```


    ```bash

    $ 123

    ```


    ```bash

    $ 124

    ```


    ```bash

    $ 125

    ```


    重新运行其中一个命令的一种方便方法是使用向上和向下键滚动列表，在找到命令后按 Enter 键。`bash` shell 提供了更多简写方法来重新运行命令，通过输入感叹号
    (`!`) 字符来启动后续：


    - `!n`: 指向命令数字 `n`

    - `!-n`: 指向当前命令减去数字 `n`

    - `!!`: 指向上一条命令。这是 `!-1` 的等同词

    - `!string`: 指向以唯一 `string` 开头的最近命令

    - `!$`: 指向上一条命令的最后一个单词


    如果我们需要使用与上一个命令相同的最后一个参数（如 `ls`）运行另一个命令（如 `less`），我们可以输入：


    ```bash

    $ ls ~/path/to/file.bash

    $ less !$

    path/to/file.bash

    ```


    这将运行 `less ~/path/to/file.bash`。这可以节省一些输入时间 —— 或者鼠标移动和鼠标复制粘贴操作。与其按向上箭头 20 次，如果我们看到想要重新运行的命令在
    `history` 列表中的命令数字为 `101`，我们可以输入 `!101` 并按 Enter 键。


    如果我们已经运行了带有六（6）个参数的 `which` 命令，可以尝试输入：


    ```bash

    $ !wh

    which cd df pwd which

    /usr/bin/df

    /usr/bin/du

    /usr/bin/ls

    /usr/bin/pwd

    /usr/bin/which

    ```


    在我们输入 `!wh` 并按 Enter 键后显示的第一行显示了 shell 正在为运行的命令副本，接下来的五行显示了该重新运行的 `which` 命令的输出。我们在
    `man bash` 中看到足够的内容后按 `q` 键退出。


    我也发现名为 `Quick substitution`（快速替换）的项很有用 —— 当我打错命令名或文件名时。


