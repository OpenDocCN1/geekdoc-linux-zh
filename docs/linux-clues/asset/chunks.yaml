    \ launches an instance of that for me.\n\nIf we want two separate Terminal windows\
    \ we can mouse right side button click in the quick start `Terminal` icon to pop\
    \ up a small menu and select the `New Window` option. Or in an open Terminal window\
    \ we can try typing the three key control code — `{Ctrl}+{Shift}+{N}`.\n\nWhen\
    \ we open a Terminal window its normal action is to run an interactive instance\
    \ of the `bash` shell — displayed in an empty looking window with a certain number\
