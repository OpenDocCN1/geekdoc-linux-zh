- fmt: '

    # Linux Clues


    Copyright (C) 2025 Lawson Hanson

    All rights reserved.


    ISBN: 9781764057882


    # Where to start?


    Like the warnings we read these days on both commercial and Open Source products
    — this work comes with no warranty whatsoever, and it should not be construed
    as fit for any particular purpose.


    None of that withstanding — you can assume the author has derived much satisfying
    experience and personal pleasure from using the tidbits of information he writes
    about.


    I have used Linux for three (3) decades and do not use any of the other widespread
    commercial personal computer operating systems.


    Am I nuts? I don’t think so. Different? Yes, no doubt.


    What I write here is `Linux user` in nature and will need to get filtered by your
    own value sieve.


    Some items could lead nowhere of interest to you or could lead to a dead end street
    or a blind alley which can prove to be a waste of time.


    For that I apologise unreservedly. I mean no harm and I did not intend to waste
    your time with my ramblings.


    Is it a good idea to stop reading before you get too far? Naw!


    The information is general purpose.


    There’s no consideration given to any predefined use — other than to show how
    I enjoy using Linux — in the hope that you can too.


    I hope you find passing fascination here and there. I wish you well.


    If you discover anything that has promise — to your way of thinking — please conduct
    your own rigorous testing and evaluation.


    I hope some of what you read can stimulate your own thinking or a deeper consideration
    of the subject matter.


    If you see nothing of any value then please remember — I did fore-warn you of
    the potential for that outcome.


    Linux resounds with my ways of thinking because it embodies a generous and flexible
    user command environment — powerful enough to get run on supercomputers and yet
    it can fit with ease on our personal computers.


    Using Linux is never a chore — it’s a sheer delight.


    # Getting Linux


    Please skip this chapter if you already have Linux installed — unless you want
    to update Linux on an old PC.


    If we perform an Internet search for `Linux distro` we find there’s a host of
    different distributions.


    These have names like `Debian`, `Fedora`, `Linux Mint`, `Open-SUSE`, `Ubuntu`
    — and more.


    Which one should we choose?


    There’s a wide range of configurations from which to choose. There are special
    Linux systems set up as audio and/or video workstations and with other special
    focus in what their developers call `studio` systems.


    If this is our first attempt to try Linux — I suggest we could start here:


    > [https://ubuntu.com/download/desktop](https://ubuntu.com/download/desktop)


    This web page contains an easy to use set of instructions about how to download
    and install the Ubuntu Linux `Desktop` system.


    See the `How To Install` link before you select the `Download` link.


    There’s a `Follow the step-by-step tutorial` link too.


    The last time I tried this I downloaded a 5.9 GB file named:


    > `ubuntu-24.04.2-desktop-amd64.iso`


    Get the latest LTS version number and the correct type for your PC.


    This is a most capable Linux distribution code named `Nimble Numbat` in which
    we can find applications for music and graphics and video and the Libre Office
    suite for word processing and spread sheets and the like.


    There’s a choice of web browsers and email client programs and hundreds of the
    short mnemonic commands I love to use in a Terminal window, too.


    Ubuntu has been in continuous development for over 20 years. It includes stable
    LTS — Long Term Support versions that I find helpful as my Linux working platform.


    **Please Note:** At 5.9 GB in size the `.iso` file will NO LONGER fit on a single-layer
    DVD optical disk.


    The information at that web page contains instructions to help us create a boot-able
    USB stick — they say it needs to be 12 GB or more.


    They suggest using a free program called `balenaEtcher` to `burn` that `.iso`
    file onto a USB stick. This program can run on Apple computers and on Windows
    computers and on Linux computers.


    On my existing Linux computer I pointed a web browser to this URL:


    > [https://etcher.balena.io/](https://etcher.balena.io/)


    where I downloaded a `.zip` file called:


    > `balenaEtcher-linux-x64-2.1.2.zip`


    **Note:** If you do not yet use Linux you will need to download the correct file
    for your computer and follow the associated instructions for that.


    Next I unzipped that downloaded file into a temporary directory and ran the `balena-etcher`
    process using these commands:


    ```bash

    $ cd Downloads

    $ mkdir tmpEtcher

    $ cd tmpEtcher

    $ unzip ../balenaEtcher-linux-x64-2.1.2.zip

    $ ./balenaEtcher-linux-x64/balena-etcher

    ```


    **Note:** The leading `$` symbol is my system prompt — don’t type those.


    The `balena-etcher` process requested my password to give it permission to run
    and it started up as expected.


    When I plugged in my USB stick the system popped up a File Browser showing the
    new USB device I had added for my use.


    This also became the default device for the `balena-etcher` Flash process.


    Next in the `balena-etcher` process I navigated to the downloaded `ubuntu-24.04.2-desktop-amd64.iso`
    file in my `Downloads` directory or folder and selected that.


    I then selected the `Flash` button and a progress indicator displayed the percent
    complete for the file transfer process used to make the boot-able USB stick for
    me.


    That took six (6) minutes to complete on my PC and then I closed the `balena-etcher`
    process.


    In the File Browser that had popped up when I plugged in the USB stick I chose
    to Eject the USB stick to ensure all file data buffers got flushed before its
    physical removal.


    That Ubuntu web page has instructions describing how to boot our computer from
    the USB stick.


    If it does not boot from that straight away we could need to make a change in
    the BIOS to help our computer boot from a USB device.


    Pressing the F12 key (on other systems it could be F2 or F10 or Esc) should display
    the system boot menu where we can navigate to the boot device selection panel.
    On a laptop PC — I needed to press a small button to get to that part of the BIOS.


    When we get our system to boot from the new boot-able Linux USB stick a menu will
    soon appear asking us to select our language.


    Next we can select from any of the accessibility settings we require or choose
    to use.


    We get prompted to select our keyboard layout.


    Another prompt wants to connect to a network to let Ubuntu download updates and
    any third party drivers our computer could need.


    Next we can choose to either `try` Ubuntu or `install` Ubuntu on our computer.


    If this is your first trial with Linux then I suggest selecting the `try` Ubuntu
    mode first. That will load up a live demonstration of Ubuntu for you to explore
    without making any changes to your PC.


    Using the demonstration or `try` Ubuntu mode we will find our display changes
    to provide the Ubuntu desktop menus and task bar to let us look around at the
    features of Linux to see if it appeals to us and let us decide if it appears useful
    and is ready for our use.


    I hope you will like what you find.


    In Ubuntu Linux we first see a task bar across the top of the screen and a quick
    start menu of items down the left side.


    Moving our mouse pointer down over the icons in the quick start menu at the left
    side will display the name of each one.


    On my installation I found `Firefox`, `Thunderbird Mail`, `Files`, `Rhythmbox`,
    `LibreOffice Writer`, `App Center`, `Help` and `Trash`.


    One of those icons is `Files` and appears like a Filing Cabinet — click on that
    to open the File Browser. This opens our Home folder.


    This should look familiar and will operate in similar ways to what we see in other
    computer systems.


    There’s a series of sub-folders with names like `Desktop`, `Documents`, `Downloads`,
    `Music`, `Pictures`, `Public`, `snap`, `Templates`, and `Videos`.

    '
