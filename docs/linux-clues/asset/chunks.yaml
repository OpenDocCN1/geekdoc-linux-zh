    \ — we need to make that.\n\nThere’s an *administrator* command called ‘`addgroup`’\
    \ to make a new group identifier. To make a new group called ‘`res`’ — we need\
    \ to run — or ask the system *administrator* to run (if that is not us):\n\n>\
    \ `$ sudo addgroup res`\n\nThere’s another *administrator* command called ‘`adduser`’\
    \ to help us add an existing user to the new group. To add the user ‘`clu`’ to\
    \ that new group we can run:\n\n> `$ sudo adduser clu res`\n\nWe can run that\
    \ to add other users to the ‘`res`’ group.\n\nOn large multi-user systems we could\
    \ need to go through a formal request process — getting that approved by management,\
    \ etc.\n\nThese users will need log out and sign in again to see their new group\
    \ membership get reported by the ‘`id`’ or ‘`groups`’ commands.\n\nAny file we\
    \ *own* that needs to get access that’s restricted to ourself and *members* of\
    \ the ‘`res`’ group needs to have it’s group identifier changed to ‘`res`’ by\
    \ running that ‘`chgrp`’ command:\n\n> `$ chgrp res prelim-results.txt`\n\nThe\
    \ final commands we need to run will involve changing the permission bits for\
    \ the group (`g`) to *add* (`+`) the *read* (`r`) access bit and to *remove* (`-`)\
    \ all permissions from all others:\n\n> `$ chmod g+r prelim-results.txt`\n\n>\
    \ `$ chmod o-o prelim-results.txt`\n\nTo make the files available to the ‘`res`’\
    \ group we could need to change the group ownership of our ‘`$HOME`’ directory\
    \ and any sub-directories to which a group member will need access to search for\
    \ the group access files.\n\nAn alternative method is to make a special ‘`res`’\
    \ directory in another part of the Linux file system — or generate a *new* user\
    \ named ‘`res`’ and use their ‘`$HOME`’ directory area for the ‘`res`’ *group*\
    \ files.\n\nSuppose we make a ‘`res`’ directory in our $HOME directory where we\
    \ want to store the files to which the ‘`res`’ group has access:\n\n> `$ cd`\n\
    \n> `$ mkdir res`\n\nWe get to own the directory and by default will have the\
    \ *read*, *write* and *execute* permissions there — enabling us to *copy*, *edit*,\
    \ *move* and *remove* files.\n\nNext we run the ‘`chgrp`’ command to change the\
    \ group identity of ‘`~`’ (our ‘`$HOME`’ directory) and the new ‘`res`’ directory:\n\
    \n> `$ chgrp res ~ res`\n\nThen we use ‘`chmod`’ to permit both *read* and *exectute*\
    \ permissions for the ‘`res`’ group:\n\n> `$ chmod g+rx ~ res`\n\n**Note:** For\
    \ a directory the *execute* permission means we have access to *search* (or list\
    \ the contents of) the directory to show other file system objects — if any.\n\
    \nNext we move the ‘`prelim-results.txt`’ file into the ‘`res`’ directory:\n\n\
    > `$ mv prelim-results.txt res`\n\nOther members of the ‘`res`’ group should now\
    \ get the access they need to *read* the file.\n\nWithout granting *write* access\
    \ to the ‘`res`’ group means those group members do not have permission to make\
    \ any changes there.\n\nEssentially — they can look at the file(s) — they don’t\
    \ get permission to touch (or make *changes* to) the file(s) — without our permission.\n\
    \n**Warning:** A member in the shared group who can *read* a file can also take\
    \ a *copy* of that file — they become the *owner* of that file *copy* and can\
    \ choose to do what they will with that!\n\nThis access method relies upon a great\
    \ degree of trust. If we can’t trust those with whom we live and/or work — then\
    \ we get caught between a rock and a hard place.\n\nWhy don’t people see the reasons\
    \ for the necessary levels of trust and responsibility and integrity?\n\nDo they\
    \ understand their responsibility to keep the group communications at the necessary\
    \ level of privileged shared access?\n\nIt takes one untrustworthy person to break\
    \ our trust. It takes great effort to restore our trust — if ever.\n\nIt takes\
    \ great effort to build a more secure system — at times we need to make *set-group*\
    \ processes to control access to shared resources and make those *group* processes\
    \ limit what access the users can get.\n\nSee ‘`man sg`’ and ‘`man newgrp`’ for\
    \ more details.\n\nWe can use these techniques to grant shared file access to\
    \ other family members on our personal Linux PC where appropriate — to give them\
    \ *read* access.\n\nFor example they might like to have access to our stash of\
    \ family photo image files — or the family memoirs you’ve been writing or anything\
    \ else you choose.\n\n# My working method\n\nHere is an image showing part of\
    \ the directory and sub-directory structure that I use for my software development\
    \ work:\n\n> ![](media/file2.png)\n\n> \n\n> image\n\nI tend to keep a *development*\
    \ version of my scripts in my “`dev`” sub-directories and a *tested* *source*\
    \ version in my “`src`” sub-directories and then the final executable version\
    \ gets copied back to my own ‘`$HOME/bin`’ directory for my day to day use.\n\n\
    When I find the need to modify or enhance a script or fix an uncovered bug — I\
    \ will work on the *development* version until I am happy with the result.\n\n\
    I use the clever Linux program called ‘`diff`’ — mnemonic for *differences* —\
    \ to display the changes I have made between the *development* version and the\
    \ *bin* or *source* version of the script.\n\nThere are GUI versions of ‘`diff`’\
    \ like the KDE ‘`kdiff3`’ command and the older ‘`mgdiff`’ and my favourite called\
    \ ‘`tkdiff`’ — this needs the Tcl/Tk libraries (‘`tcl8.5`’ and ‘`tk8.5`’) installed.\n\
    \n> See: [https://tkdiff.sourceforge.io/](https://tkdiff.sourceforge.io/)\n\n\
    This step lets me see that I have updated the version number and have added a\
    \ suitable comment or comments to describe what I have done.\n\nWhen I have performed\
    \ the *testing* I need to do — to assure myself the update works as expected then\
    \ I copy the *development* version across to the appropriate *source* (‘`src/py`’\
    \ or ‘`src/sh`’, etc.) sub-directory.\n\nThe next part of the process uses commands\
    \ from the trustworthy ‘`git`’ distributed version control system."
