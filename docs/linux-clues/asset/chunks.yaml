  raw: 'I like this shortened line version of ‘`ls -l`’ and wrote my own *alias* for
    it:


    > `$ alias lgo=’ls -go’`


    In column 3 the ‘`.bash_aliases`’ file size gets reported as 16 bytes.


    The ‘`echo`’ command we used to write that file seemed to have 15 characters between
    the double quote (`"..."`) characters!


    It looked like this:


    > `$ echo "alias h=history" >> .bash_aliases`


    We expect to find the text string ‘`alias h=history`’ in that file — or at least
    on the *last* line if it pre-existed.


    ## File display


    There’s a command called ‘`cat`’ — mnemonic for ‘*concatenate and print files*’
    — a utility to display the content of one or more files.


    Let’s use ‘`cat`’ to make a closer inspection of that file content:


    > `$ cat .bash_aliases`


    > `alias h=history`


    > `$`


    I expect we can count 15 characters — a blank space counts as one.


    The ‘`echo`’ command stripped off those two double quote (`"`) characters before
    it *echoed* its input *argument* to its output.


    The command called ‘`wc`’ — mnemonic for ‘*word count*’ can help here.


    When given an input file the ‘`wc`’ command will count the number of *lines* and
    *words* and *characters* it finds in that input.


    If we run the ‘`wc`’ command on that hidden file we made it could report:


    > `$ wc .bash_aliases`


    > ` 1  2 16 .bash_aliases`


    > `$`


    It reports 1 line, 2 blank space separated words and 16 characters.


    Why do ‘`ls`’ and ‘`wc`’ report 16 bytes or characters?


    What is in that file?


    Let’s use another command called ‘`od`’ — mnemonic for ‘*octal dump*’ to show
    us in more detail.


    The ‘`od`’ (octal dump utility) has a ‘`-c`’ option that requests its output as
    plain text characters:


    > `$ od -c .bash_aliases`


    > `0000000 a l i a s   h = h i s t o r y \n`


    > `0000020`


    > `$`


    Here it reads input from that hidden ‘`.bash_aliases`’ file we specify and it
    displays the output back to our Terminal.


    Those zero-filled seven digit numbers on the left side show the character count
    number of the first character displayed on that line — in octal — counting from
    zero.


    As we can see, there’s a two symbol ‘`\n`’ character at the far right side.


    The reason for this observed difference is that Linux uses a line ending character
    — it’s called a “*newline*” character.


    This is the ASCII character ‘`LF`’ or ‘`{Ctrl}+{J}`’ or *linefeed* control code
    — invisible except by its action to move our cursor to the next line.


    Unless we tell it *not* to the ‘`echo`’ command always terminates its output by
    adding a *newline* character.


    If ‘`echo`’ did *not* do that our next system prompt would show up at the end
    of the ‘`echo`’ output line — instead of on a new more visible line.


    That two symbol character is the way the ‘`od`’ and other utility programs will
    represent that Linux line ending “*newline*” character.


    I hope that makes sense and helps to show that Linux does know what it’s doing.


    The ‘`ls -l`’ command reports its file size information with great accuracy.


    The ‘`wc`’ command reported what it saw with the same accuracy.


    The ‘`cat`’ command displayed the file content with the same accuracy — we needed
    to count one more for the evidential *newline* character — it’s hiding in plain
    sight.


    To see what output *without* a `newline` looks like — try running this command:


    > `$ printf "Output without a newline"`


    > `Output without a newline$`


    Where did the next shell prompt get displayed?


    ## More shell setup


    In a previous chapter I mentioned that the ‘`bash`’ shell reads information from
    another hidden file named ‘`.profile`’ in our ‘`home`’ directory to help it set
    shell ‘*variables*’.


    One of those ‘*variables*’ is named ‘`PATH`’ — that we have already seen.


    In the ‘`.profile`’ file this ‘`PATH`’ *variable* can get *extended* with our
    *own* ‘`$HOME/bin`’ directory.


    Why is that important?


    This ‘`PATH`’ variable holds the list of file system directory paths the `bash`
    shell and other program and application processes will use as the places to search
    through to locate the executable commands we need to run.


    If we *extend* this with our *own* ‘`bin`’ directory then we can add our own ‘`bash`’
    shell, Python, ‘`R`’, and other *scripts* and/or compiled *binary* programs into
    that location and expect the `bash` shell to find those for us.


    The shell *setup* process can do this for us when it reads lines like these in
    our ‘`.profile`’ file:


    > `# set PATH to include user’s bin if it exists`


    > `if [ -d "$HOME/bin" ] ; then`


    > `   PATH="$HOME/bin:$PATH"`


    > `fi`


    Gak! Gobbledegook!


    This has a comment line that starts with the cross hatch (‘`#`’) character.


    The next three lines contain ‘`bash`’ shell *conditional* code to request:


    > “If there’s a *directory* (‘`-d`’) named `"$HOME/bin"` then insert that directory
    and a (‘`:`’) at the start of the existing value (‘`$PATH`’) to extend and redefine
    (‘`=`’) the existing ‘`PATH`’ variable”.


    The ‘`fi`’ statement marks the end of the *conditional* code that started with
    the ‘`if`’ statement.


    In the `bash` shell language there’s a ‘`case`’ statement that gets terminated
    with its reverse ‘`esac`’ (‘`case`’ spelled backwards) statement.


    Three looping constructs like ‘`for-do-done`’, ‘`until-do-done`’ and ‘`while-do-done`’
    don’t get terminated with an ‘`od`’ keyword because that got used by the ‘`octal
    dump`’ utility we have seen.


    The keyword ‘`done`’ terminates the `bash` shell do-loops.


    Congratulations. We can read a bit of `bash` shell script code!


    Too much information? Bear with me a while longer.


    What does the ‘`HOME`’ variable contain?


    ## The HOME variable


    When we enter a dollar ($) symbol with a shell *variable* name at its immediate
    right side the `bash` shell expands that named *variable* to return its *value*
    — if any.


    We can use the ‘`echo`’ command to help us see the result. Here is what I did
    and the result it gave:


    > `$ echo "$HOME"`


    > `/home/clu`


    > `$`


    Remember the first ‘`$`’ is my system prompt. The second ‘`$`’ needs to be right
    next to the ‘`H`’ of the word ‘`HOME`’ — the variable name.


    ## More on PATH


    Initially that ‘`PATH`’ list does *not* contain our ‘`/home/{user}/bin`’ directory
    if we have not yet made that personal ‘`bin`’ directory in our new Linux installation.


    By making use of the provision in those lines of code we dissected above our own
    ‘`$HOME/bin`’ directory will get inserted at the start of the ‘`$PATH`’ variable.


    **Please Note:** I prefer to insert my own ‘`$HOME/bin`’ directory at the *end*
    of the system ‘`$PATH`’ because that means if by accident I write a command with
    the same name as an existing system command then I will not clobber that with
    my attempt.


    I would need to think of a different name for my new command.


    Other people could enjoy writing their own system command replacements — I’m not
    that clever.


    How do we add a new ‘`bin`’ directory?


    We could use the ‘`Files`’ application and in our ‘`Home`’ folder select the menu
    operation `File –> Create New Folder` and rename the ‘`Untitled Folder`’ to name
    it ‘`bin`’ — if we wanted to.


    Bleah!


    ## mkdir & rmdir


    There’s a command called ‘`mkdir`’ — mnemonic for — you guessed it — ‘*make directory*’.


    We can use this command to make our own directories like ‘`bin`’ and ‘`dev`’ and
    ‘`pdf`’ and ‘`src`’ and ‘`txt`’ — anything we find useful.


    I like to keep my development files separate from my ‘`bin`’ and ‘`src`’ directories
    and general PDF files in a ‘`pdf`’ directory where I can find them — and it reduces
    the clutter in my home directory.


    To make our own ‘`bin`’ directory we can use the commands:


    > `$ cd`


    > `$ mkdir -v bin`


    > `mkdir: created directory ’bin’` `$`


    Nothing difficult about that.


    First ‘`cd`’ as a precaution to make sure we work in our own home directory.


    The ‘`mkdir`’ command makes the specified new directory within our current working
    directory — unless we need to specify a more *qualified* path.


    The option ‘`-v`’ is mnemonic for ‘*verbose*’ — and gets `mkdir` to report what
    it does.


    I always find this much easier than using the ‘`Files`’ app.'
