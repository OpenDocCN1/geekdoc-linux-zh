  trans: '


    链接允许我们通过另一个名称，或者在需要时从另一个目录的条目来引用文件。


    我们可以根据需要对文件创建有用的链接。


    硬链接（hard link）在文件系统的目录中创建一个新的命名条目，它直接指向文件系统树中已存在文件对象的 `inode`。


    符号链接（symbolic link）在文件系统的目录中创建一个新的命名条目，它指向文件系统树中已存在文件对象的`文件名`或`文件路径` —— 起初这种差异似乎很微妙。


    如果我们重命名或移动这些链接，或者移动它们指向的原始文件，会发生什么？


    ### 重命名硬链接和软链接：


    ```bash

    $ mv hard-ln.txt mhard-ln.txt

    $ mv slnk-ln.txt mslnk-ln.txt

    $ ls -igo *ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mhard-ln.txt

    32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt -> ln.txt

    ```


    使用 `wc -c` 检查解析后的对象大小：


    ```bash

    $ wc -c *ln.txt

    3921 ln.txt

    3921 mhard-ln.txt

    3921 mslnk-ln.txt

    11763 total

    ```


    它们都被读取了，且大小正确。


    ### 如果我们重命名了原始文件呢：


    ```bash

    $ mv ln.txt mln.txt

    $ ls -igo *ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mhard-ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mln.txt

    32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt -> ln.txt

    ```


    使用 `wc -c` 检查解析后的对象大小：


    ```bash

    $ wc -c *ln.txt

    3921 mhard-ln.txt

    3921 mln.txt

    wc: mslnk-ln.txt: No such file or directory

    7842 total

    ```


    哎！当我们重命名符号链接指向的文件时，符号链接失效了。


    要修复符号链接，我们可以重新运行 `ln` 创建一个指向重命名后文件的符号链接 —— 或者将重命名后的文件移动回原来的名称


    ```bash

    $ mv mln.txt ln.txt

    $ wc -c *ln.txt

    3921 ln.txt

    3921 mhard-ln.txt

    3921 mslnk-ln.txt

    11763 total

    ```


    符号链接是目录中的一个条目，指向在创建符号链接时存在的文件名 —— 仅此。


    如果该文件名存在，符号链接就是有效的。如果文件名被重命名或移动，符号链接就会失效！


    硬链接是目录中的一个条目，指向与另一个现有文件相同的 `inode`。即使我们重命名、移动或删除原始文件，硬链接仍然指向同一个 `inode`。


    当指向文件 `inode` 的最后一个链接被删除时，它就不再存在了。


    ### 为什么我们想使用符号链接？


    硬链接对象必须存在同一个文件存储设备中。


    软链接（符号链接）可以跨越文件存储设备的边界 —— 它们可以指向外部存储设备上的对象名称 —— 当这些设备连接到我们的计算机使用时。


    ### 为什么我们想使用硬链接？


    正如我们在上面观察到的 ——指向现有文件的硬链接指向相同的 `inode`。虽然它显示出相同的文件空间大小，但这是原始文件的大小。


    当我们处理需要数兆或数 GB 空间的数据文件时，文件链接可能非常有意义。


    与其拥有该文件的两个独立副本，我们不如对真实数据文件创建一个硬链接。对文件系统的影响是在在文件系统树中多增加了一个指向现有 `inode` 的条目。


    它所占用的空间取决于我们文件系统使用的块大小。这可能是 2k、4k 或 8k 字节等，而不是为了存储整个文件的副本而占用数兆或数 GB。


    我希望这能有所帮助。


    # 正则表达式


    还有另一个灵活的过滤命令叫做 `grep` —— 这是 *global regular expression print*（全局正则表达式打印）的缩写，这个名字有点冗长。


    `grep` 在文件中搜索名为“正则表达式”的`模式`。


    什么是正则表达式？


    正则表达式是灵活的字符模式，可以匹配一个或多个文本字符串。


    Unix 的两位主要作者和设计师之一肯·汤普（Ken Thompson）被认为在 `ed` 编辑器中加入了正则表达式模式匹配搜索功能 —— 我们本可以用它来编写小型的
    `td.sh` 脚本 —— 回在前几个章节。


    我们在 `ed`、`ex` 和 `vim` 编辑器中可以使用命令是 `g/re/p`，其中 `re` 部分是这些正则表达式之一。


    `g` —— *global*（全局）的缩写意味着跨越每行的整个宽度。


    `p` —— *print*（打印）的缩写意味着显示包含我们提供的 `re` 正则表达式匹配项的行。


    这就是 `grep` 过滤器的来源。


    正则表达式可以简单到一两个字符或一个单词 —— 也可以复杂的模式匹配字符和重复计数的组合 —— 如我们很快将看到的。


    ## 简单的 grep


    如果我们想从 `PATH` 变量中提取 `games` 目录，我们可以使用 `grep` 过滤器，通过在 `bash` 历史命令管道中添加另一个部分来提取它们：


    ```bash

    $ !1234 | sort | grep games

    /usr/games

    /usr/local/games

    ```


    这在 `sort` 命令之后添加了另一个管道符号（`|`），并将 `sort` 的输出直接交给 `grep` 的标准输入，要求它匹配包含简单模式 `games`
    的行 —— 成功。


    你可能记得历史命令编号 `1234` 是：


    ```bash

    $ echo "$PATH" | tr ":" "\n"

    ```


    如果原始命令的输出很多，先添加 `grep` 命令然后将减少后的输出传递给 `sort` 命令可能会更高效：


    ```bash

    $ !1234 | grep games | sort

    /usr/games

    /usr/local/games

    ```


    对于如此小的样本，这没有明显区别。


    你能看到 Unix 以及现在 Linux 命令中，在 `bash` shell 中通过管道组合命令的能力所拥有的力量和灵活性吗？


    这几乎就像在玩孩子的积木。


    想象一下我每天是多么开心！


    我们可以将该管道输出重定向到新文件，或将其追加我们需要完成的现有文件的末尾。


    **注意：** `bash` shell 命令模式与 `grep` 命令使用的被称为正则表达式的模式类之间有一两处细微的差异。


    正则表达式要灵活得多。


    这两者之间的思想有很多相似之处。


    一个例外是问号（`?`）字符 —— 在 `grep` 模式中，我们使用点（`.`）字符*代替* —— 来表示*任何单个字符*。


    为什么？因为在 RE（正则表达式）语法中，问号（`?`）字符被用来表示前一个字符或括号内的整个正则表达式出现零或一次。


    另一个例外是星号（`*`）字符。


    要在 `grep` 模式中表示任何字符的零或多次重复，我们需要使用一个点与星号配对的双字符 RE (`.*`) —— 通过练习，我们很快就会习惯这些以及其他差异。


    ## RE 语法


    `grep` 命令的 `man` 页面包含了详细描述，说明了我们如何构建正则表达式来匹配并找到我们想象的几乎任何字符字符串。


    在 man 页面中搜索‘REGULAR EXPRESSIONS’。


    该章节的第二句话是：


    '
- fmt: '

    > Regular expressions are constructed like arithmetic expressions, by using various
    operators to combine smaller expressions.


    The third paragraph in there tells us:


    > Most characters, including all letters and digits, are regular expressions that
    match themselves.


    and:


    > Any meta-character with special meaning may be quoted by preceding it with a
    backslash.


    ## RE meta-characters


    > ``.’ — a dot will match any *single* character *except* a `newline` control
    character.


    > `[`’ — starts a *list* enclosed in square brackets `[...]` to match any *one*
    of the *list* of enclosed characters.


    > `[abc]` — match *one* of the characters `a` or `b` or `c` — in some user `locale`
    settings this could match `[aBbCc]`.


    > If the *first* character of the *list* is the caret or circumflex (*pointy-hat*)
    symbol `^` then match any character **not** in the list.


    > Inside square brackets a pair of characters separated by a hyphen `-` or dash
    will match a *range* of characters.


    > `[m-q]` — match one of the characters `m` or `n` or `o` or `p` or `q`.


    > Certain named classes of characters get predefined within bracket expressions
    — their names are self explanatory:


    > `[:alnum:]`, `[:alpha:]`, `[:blank:]`, `[:cntrl:]`, `[:digit:]`, `[:graph:]`,
    `[:lower:]`, `[:print:]`, `[:punct:]`, `[:space:]` and `[:xdigit:]`.


    > Note that the square bracket and the colon characters `[:` and `:]` *surrounding*
    each class name is part of the symbolic name and these *must* get included in
    *addition* to the outer brackets of a *list* expression.


    > Most *meta-characters* lose their special meaning inside the brackets of a *list*.


    > To match a literal `]` place it as the *first* character in a *list*.


    > To match a circumflex (or *pointy hat*) character place it anywhere except (other
    than) the *first* character in a *list*.


    > To match a literal hyphen or dash `-` character place it *last* in a *list*.


    > **Note:** If we need to restrict the *list* to none other than those characters
    we enter in the *list* we can set an environment variable named `LC_ALL` to a
    *value* of `C`:


    ```

    $ export LC_ALL="C"

    $ grep ''[bcd]'' note.txt

    ...

    ```


    > We could try defining our own `alias` command:


    ```

    $ type grc

    bash: type: grc: not found

    $ alias grc=''export LC_ALL="C" ; grep''

    $ grc ''[bcd]'' note.txt

    ...

    ```


    Does Does that work?


    The `export` command defines the `LC_ALL` variable in such a way that it continues
    to get seen in the interactive bash shell and in new non-login command shells.
    Remember — one of those gets started for each Linux command we run on the command-line
    — and the `grep` command will then get run in a bash shell with the environment
    variable `LC_ALL` set to `C`.


    > **Note:** Your `locale` could be different from mine and you may not need to
    use this *hack* to get the `grep` command to operate in the way you prefer.


    ## RE anchoring


    The caret or circumflex (*pointy-hat*) symbol `^` and the dollar `$` symbol are
    *meta-characters* that respectively match the *empty* string at the *beginning*
    (`^`) and *end* (`$`) of a *line*.


    **Side-Note:** These two symbols *also* get used in the `vim` editor to move the
    *cursor* to the *beginning* (`^`) and *end* (`$`) of the text on a *line* — single
    key smart cursor motion.


    The two character symbols `\<` and `\>` respectively match the *empty* string
    at the *beginning* and *end* of a *word*.


    More *meta-character* pairs get defined to match other special cases.


    See `man grep` for more details.


    Assuming we still have a copy of that small shell script named `td.sh` in our
    home directory:


    ```

    $ cd

    $ grep ''^echo$ td.sh

    echo

    echo

    $

    ```


    This restricts the `grep` command to showing us any lines that contain nothing
    other than the word `echo`. No big deal for that small script.


    If there was a trailing blank space after one of those `echo` words then this
    `grep` command would have displayed one line instead of two.


    The same command could look through a file with hundreds and thousands of lines
    in moments.


    ## RE repetition


    A regular expression can get followed by a repetition operator. These operators
    are:


    > `?` — match *zero* or *one* of the preceding RE.


    > `*` — match *zero* or *more* of the preceding RE.


    > `+` — match *one* or *more* of the preceding RE.


    > `{n}` — match preceding RE exactly *n* times.


    > `{n,}` — match preceding RE *n* or *more* times.


    > `{,m}` — match preceding RE at most *m* times.


    > `{n,m}` — match preceding RE at least *n* times and no more than `m` times.


    Other RE operations and operators cover RE concatenation, RE alternation, RE precedence
    and RE back-references within parenthesized subexpressions. It’s a powerful information
    handling computing concept.


    Learn to use *regular expressions* — they will serve you well.


    See `man grep` for those details.


    We can use REs in other programs like the editor `vim` and the powerful stream
    editor `sed` and the `less` pager.

