- fmt: '

    The `-i` option — mnemonic for `interactive` — gets `cp` to warn us if the target
    file already exists. We can choose to overwrite the existing file or stop the
    process altogether.


    If we chose to construct that `td.sh` shell script in a new development directory
    at `$HOME/dev/sh` — and assuming that is where we are working now we can copy
    that to our own `bin` directory with:


    ```bash

    $ cp -p -i td.sh $HOME/bin

    ```


    Or:


    ```bash

    $ cp -p -i td.sh ~/bin

    ```


    We can use the tilde (`~`) meta-character in the `bash` shell as a short-hand
    for our `$HOME` directory.


    Please note that the shell will not expand a tilde if we put quotes around it!
    Consider these results:


    ```bash

    $ echo ~

    /home/clu

    ```


    and:


    ```bash

    $ echo "~"

    ~

    ```


    Using the `mv` command we find it has no `-p` option — because it moves the location
    of the file complete with its file permissions to the target file or directory.


    If we decided to rename our shell script to get called `today` we can do this
    using the `mv` command after checking with the `type` command:


    ```bash

    $ type today

    bash: type: today: not found

    ```


    That’s free to use. Now to rename the script:


    ```bash

    $ mv -i td.sh today

    ```


    Or even:


    ```bash

    $ mv -i td.sh ~/bin/today

    ```


    Next time we sign into our Linux system we should find we can still run our new
    bash shell script by typing its name — without telling the shell where to find
    it:


    ```bash

    $ td.sh

    ```


    Or:


    ```bash

    $ today

    ```


    if we chose to rename the script.


    Try running `type td.sh`.


    Linux does a lot of work for us — behind the scenes like looking through our `PATH`
    variable to locate the command names we attempt to run.


    When we decide a file is no longer wanted — we should think twice before we use
    the `rm` command to remove it:


    ```bash

    $ rm td.sh

    ```


    When a file gets removed — it’s gone for ever.


    I will often make a `junk` directory and move fragments of code over to that until
    I know for certain the code fragments in there got rejected and no longer need
    to get kept — and I can tidy up with:


    ```bash

    $ rm -i ~/junk/*

    ```


    to remove the bits with which I’ve finished.


    I tend to write lots of code fragments to help me prove to myself that the code
    I want to use will operate in the way I hope and expect.


    I don’t see this as a waste of time and effort — to the contrary it saves me hours
    of debugging time later — when that process gets more difficult with a growing
    script size and its increased complexity.


    One of my work methods is “write two” & “throw one away”.


    I don’t always get to the best solution on my first attempt.


    Experimenting with code snippets and making a couple versions of a script gives
    me time to assess the code I write and refine what I do and select the best option(s).


    Over the course of a day or two the best fragments of code get selected and find
    their way into the final candidate script I expect to complete and release.


    If I’m making changes to a pre-existing script I find it’s better to test a small
    fragment of code to let me prove a new method or way of handling a variable or
    a file or logic test — to ensure my code will operate in the way I imagine should
    — before I attempt to incorporate that into the pre-existing script.


    Suppose I’m working on adding a new feature to my script named `abc.sh` and I
    have a copy of that in current directory. I have fragment of code in a file named
    `frag.3` that I want to add after line 147 in `abc.sh`. I could have determined
    the line number by running:


    ```bash

    $ cat -n abc.sh | less

    ```


    Using the `vim` editor I can do this:


    ```bash

    $ vim abc.sh

    147G

    :r frag.3

    :wq

    abc.sh

    ```


    This runs `vim` to open my copy of the script for editing. Next it moves the cursor
    straight down to line 147 with `G` — mnemonic for Go to line number. The third
    line reads `frag.3` into the open script placing it below line 147. Line four
    runs the write (`w`) and quit (`q`) commands to save the modification to `abc.sh`
    and quit from `vim` editor. The last line runs the current directory version of
    `abc.sh` to see if updated code will work.


    Did the modified script work? If failed the bash shell would complain! Did the
    update work the way I hoped? That takes a bit of testing to put `abc.sh` through
    its paces to check if new code gets called when it should. It’s never good to
    release updates to our scripts and other programs before has been enough testing
    done — and most of that needs to get done as soon as possible — rather than waiting
    until we need to get the updates into production — to meet our deadlines.


    # Work analysis


    Examining the command activity from `history` list while writing part of book
    seems I have run 37 standard Linux commands from those residing in `/usr/bin`
    while I also ran 30 of my own scripts and ran 23 of my own shell aliases. These
    commands and scripts get run throughout my days and weeks as needed to help me
    do what I want to get done. The data also showed that I ran 5 interactive shell
    code fragments and made 5 different command typing mistakes — my fingers — sign
    of increasing age. How do I know those details? Here is what I did. I took a copy
    of my current `history` list into a file:


    ```bash

    $ history > hst.txt

    ```


    How many lines of `history` data is there? Use the `wc -l` command to count the
    number of lines:


    ```bash

    $ wc -l hst.txt

    937 hst.txt

    ```


    Examine the content of the file to see the structure of each line:


    ```bash

    $ less hst.txt

    999 printf

    1000 sudo

    1001 tb

    1002 pwd

    1003 owl

    ...

    ```


    As expected, that looks like a history list. At the start (left side) of each
    line there’s history command number then the command name and any command options
    and/or arguments. I used one line awk script to extract the second argument on
    each line saving those into another file named `hst-cmds.txt` — this will contain
    the list of command names — one on each line:


    ```bash

    $ awk ''{print $2}'' hst.txt > hst-cmds.txt

    ```


    Use the `wc -l` command to count the number of lines in these two generated files
    — there should be the same number of lines in each file:


    ```bash

    $ wc -l hst.txt hst-cmds.txt

    937 hst.txt

    937 hst-cmds.txt

    1874 total

    ```


    That’s what I hoped to see. Inspected the first 5 lines of file `hist-cmds.txt`:


    ```bash

    $ head -5 hist-cmds.txt

    man

    sudo

    tb

    pwd

    owl

    ```


    That is what I expected — a list of command names. Next I used small Perl script
    called `count.pl` (you can find the code for this in a later chapter) to count
    the numbers of times each command gets called — thought I’d use the script for
    a practical task:


    ```bash

    $ count.pl hst-cmds.txt > hst-ctrs.txt

    ```


    Inspected a small sample of lines from that output file:


    ```bash

    $ head -20 hst-ctrs.txt | tail -5

    bnchk          6

    c              13

    c3             35

    cal            1

    cat            34

    ```


    Command names at the left side and counts of the number of times the item occurs
    in the history list on the right side. Thought I’d check those first five commands
    too:


    ```bash

    $ for c in man sudo pwd owl ; do

    > grep "^$c" hst-ctrs.txt

    > done

    man            51

    sudo           4

    tb             12

    pwd            20

    owl            8

    ```

