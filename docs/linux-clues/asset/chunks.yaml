    \ that can provide more information for us. The option ‘`-l`’ is mnemonic for\
    \ a ‘*long*’ listing.\n\nHere is the nine (9) columns of output I get when using\
    \ that:\n\n> `$ ls -l .bashrc`\n\n> `-rw-rw---- 1 clu clu 3771 May 28 15:50 .bashrc`\n\
    \n> `$`\n\n**Note:** The file name and other parts of the output shown above could\
    \ get wrapped onto the next line because of page width size limitations.\n\nThe\
    \ output from and ‘`ls -l`’ command contains these nine (9) space separated *columns*\
    \ of information:\n\n1.  The first ten (10) *characters* (‘`-rw-rw----`’) contain\
    \ a directory or file type bit or flag *and* then nine (9) access permission bits\
    \ or flags — each one is a single character\n\n    The first dash (‘`-`’) character\
    \ indicates this file system object is an *ordinary* file\n\n    This first character\
    \ will be a ‘`c`’ for a *character special device* file or a ‘`d`’ for a *directory*\
    \ object or an ‘`l`’ for a *symbolic link* to a file — tuck that away for future\
    \ reference if interested\n\n    The next nine (9) *characters* show three (3)\
    \ sets of three (3) ‘`rwx`’ characters — in that order.\n\n    These are permission\
    \ bits or flags for the object owning ‘`user`’, the object owning ‘`group`’ and\
    \ then for all ‘*other*’ users on our system\n\n    Character ‘`r`’ means ‘`read`’\
    \ access permission"
