    \ part of the Linux File System — we can think of it as an inverted tree structure.\n\
    \n> ![](media/file0.png)\n\n> \n\n> image\n\nMost user accessible files on Linux\
    \ can be one of three different types:\n\n*   an ordinary file like a memo or\
    \ a spreadsheet or a music file or a computer program or a shell script or a data\
    \ file, etc.\n\n*   a directory that contains links between file names and directory\
    \ names we use and their locations within the storage system.\n\n*   a special\
    \ device file for hardware input from a keyboard or a microphone or a mouse or\
    \ output to a terminal window, etc.\n\nAgain, we do not need to understand every\
    \ squeaky detail.\n\nThe top node labeled ‘`/`’ — with the ‘`slash`’ or ‘*forward\
    \ slash*’ character, is also known by the names ‘`root`’ directory or ‘`root`’\
    \ folder or by some as ‘*the slash*’ directory or folder.\n\nThe Linux file system\
    \ *starts* from that point.\n\nI have shown four (4) sub-directories or sub-folders\
    \ at the next level down. In reality there’s about 15 and more could get added\
    \ as required when we install new application software onto our computers.\n\n\
    Looking at the node labeled ‘`home`’ we see there’s another sub-directory or sub-folder\
    \ below that called ‘`clu`’ — this is the user name I specified when installing\
    \ my fresh Ubuntu 24.04.2 system.\n\nYou should have one with your user name.\n\
    \nOn a multi-user Linux system there’s one for each different user and on large\
    \ systems there could be dozens or hundreds of *user* directories below what we\
    \ call ‘*/home*’.\n\nThe Linux system manages access permissions according to\
    \ in-built rules and will prevent us from gaining access to another user’s files\
    \ — unless they make specific changes to the access permission on one or more\
    \ files and/or containing sub-directories."
