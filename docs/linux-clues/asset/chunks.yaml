  raw: 'By the way — the term ‘*mnemonic*’ starts with a silent ‘`m`’ and gets pronounced
    with three syllables as ‘`nem-on-ic`’ or ‘`ne-mon-ic`’.


    Short names helped to reduce the amount of typing needed on the clunky old *mechanical*
    Teletype keyboard consoles they had to use back then.


    For example the command “`ls`” is mnemonic for “*list*” or “*listing*” and will
    display a list of the names of the file system objects located in our *current*
    “*directory*” or “*folder*” — or elsewhere if we so direct it.


    How do we know what is that *current* *directory* or *folder* or file system workspace?


    When we first sign in to our Linux system that will be our designated user “*home*”
    directory.


    There’s a *command* called “`pwd`” — mnemonic for “*print working directory*”
    and it displays that information for us.


    Another *command* called “`cd`” — mnemonic for “*change directory*” enables us
    to change our current point of focus in the file system to any other directory
    or folder we choose — if we have permission to do so.


    After using the ‘`cd`’ command to move around to different locations in the file
    system we could wonder where we have ended up — run ‘`pwd`’ again.


    Like these three commands the hundreds of software tools we have at our finger
    tips in Linux each do one task and do that with precision.


    It’s a bit like when we first started to learn to read — as a child.


    At first every word is a mystery — we can’t discern its syllables — we don’t know
    how to say a word — we don’t know what it means.


    With time and practise we begin to recognise words we have learned and can vocalise
    and find we can understand and make sense of what we read.


    Before long we can read phrases and sentences and paragraphs and sections and
    chapters and entire story books.


    It’s the same with this powerful and descriptive part of Linux.


    After a while those *mnemonic* command names start to get easy to remember and
    can help us achieve more work in less time.


    We find we can visualise a series of these short, sharp, unique, mnemonic command
    names to help us do the tasks we need to get done.


    The power of computing with Linux gets provided by the almost endless ways in
    which we can combine commands like these to make our own more efficient commands
    — customised to the way we need to work.


    In both Unix and in Linux this flexibility continues to astound me.


    ## Terminal power


    These days the ‘`Terminal`’ windows support extra “*tabs*” or sub-windows and
    I can have five or six or more of those open in each of two Terminal windows and
    be working concurrently on different tasks that help me make progress on the work
    I plan to achieve.


    In Terminal windows like ‘`gnome-terminal`’ and one called ‘`LXTerminal`’ that
    I prefer to use its easy to open new tabs with the three key control code `{Ctrl}+{Shift}+{T}`.


    We can switch between the tabs using two key codes like `{Alt}+{1}`, `{Alt}+{2}`,
    `{Alt}+{3}`, etc. Or we can click on one of the tabs if we have the computer mouse
    device in hand.


    For example, in one of the ‘`tabs`’ in a Terminal window I will use the ‘`cd`’
    command to change to a *directory* or *folder* where I keep text files for my
    current book.


    ## My text editing


    I use this sub-window to run my favourite editor program called “`vim`” — mnemonic
    for “*vi-Improved*” — a most capable and efficient tool where the edit commands
    are *mnemonic* and easy to remember.


    The original ‘`vi`’ editor — mnemonic for “*visual*” got developed in the 1980’s
    by William N. Joy and others at the University of California, Berkeley, USA. The
    availability of visual display units for computers — “*dumb*” terminal monitors
    with glass screens — started to increase.


    I started using ‘`vi`’ on Unix at C.S.I.R.O. and it has served me well for *all*
    my text edit needs — Fortran and C programming and Perl, R and shell script programming
    as well as music and book writing.


    The ‘`vi-Improved`’ version got developed and enhanced by a Dutch software engineer
    named Bram Moolenaar and others and ‘`vim`’ soon found its way into Linux.


    If you want a quick overview of *effective* editing and how ‘`vim`’ can help you
    with that please read Bram’s seven (7) page paper titled ‘*Seven habits of effective
    text editing*’:


    > [https://www.moolenaar.net/habits_paper.pdf](https://www.moolenaar.net/habits_paper.pdf)


    There’s a special program called ‘`vimtutor`’ to help us learn the basics of ‘`vim`’
    — it’s hands-on and does not take too long to work through. This provides us with
    the basics of editing with ‘`vim`’ in next to no time flat.


    Working through the ‘`vimtutor`’ takes about 30 minutes — a small investment for
    a lifetime of superior editing capability.


    **Note:** The ‘`vim`’ editor commands are *mnemonic* — easy to remember like ‘`i`’
    for *insert* text *before* the cursor and ‘`a`’ for *append* text *after* the
    cursor. Even the ‘`Esc`’ key we need to press to *escape* from text *insert* mode
    back to *normal* (or *command*) mode where we can issue more edit and *smart*
    cursor motion commands — its capability is astonishing.


    The last line in the edit window is a *status* line and informs us when we are
    in the text ‘`-- INSERT --`’ mode.


    We soon get in the habit of pressing the ‘`Esc`’ key — it’s easy.


    If the ‘`vim`’ editor is not your *style* there are others you can install and
    try — like ‘`cream`’, ‘`emacs`’, ‘`featherpad`’, ‘`kate`’, ‘`nedit`’ and more.


    You need to find one that works for you.


    ## My document method


    In another ‘`tab`’ in a second ‘`Terminal`’ window I will open the same file system
    directory workspace and this gets used when I want to re-run my document processing
    system.


    I use the brilliant LaTeX system — a set of document preparation macros developed
    by Dr. Leslie B. Lamport to run on the TeX computer typesetting system — developed
    by Prof. Donald E. Knuth at Stanford University.


    I have used these tools since the time I worked on Unix and these run with perfection
    on Linux, too.


    At present I run this from a small shell script I call “`lx`” — mnemonic for “*latex*”
    running through another helper script I called “`lxmk`” that runs the real “`latex`”
    program through the clever “`latexmk`” Perl script — developed by John Collins:


    > [https://www.cantab.net/users/johncollins/latexmk/](https://www.cantab.net/users/johncollins/latexmk/)


    The result of my two letter command (‘`lx`’) is to re-run the ‘`latex`’ program
    on the latest updates I have made to the LaTeX files that comprise my book, then
    display a PDF file of the “*print*” version of my work.


    Next I might run another shell script I call “`l2e`” — mnemonic for “*latex to
    epub*”. It’s a helper scripts to re-process the book content into an “`epub`”
    version of the document and displays that in my favourite `epub` reader called
    “`okular`” — most useful — great for proofreading.


    I use ‘`pandoc`’ — a general markup converter to convert my initial LaTeX plain
    text files into ‘`pandoc`’ *markup* and from there into the final ‘`epub3`’ format
    I need.


    Although that could sound complicated it must in fact be rather straight forward
    because I figured out how to make these commands work the way I want — and I am
    no genius.


    The best part of this for me is that I do not forever need to *grab* the mouse
    and *move* the mouse pointer to another application menu to then *select* the
    menu and run the mouse pointer down a list of options to find and select the functionality
    I want next.


    I do use my mouse device — to shift focus from one window to another or to scroll
    up and down to read through long texts or to highlight text and paste a copy of
    that elsewhere.


    Those other Terminal window ‘`tabs`’ get used as and when required.


    A spark of an idea prompts me to add a small text note in my software development
    area to remind myself about a thought that has occurred to me from my subconscious
    thinking — or a bug I have uncovered in a shell script.'
