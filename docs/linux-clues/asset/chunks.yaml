  trans: "\n\n我们所做的只需在*光标*所在的行上进行必要的编辑——然后从编辑器中*退出*。\n\n在 `vim` 中，我会使用*末尾行*命令 `:wq`\
    \ —— 这是 *write*（写入）和 *quit*（退出）的缩写——或者使用*简写* `{Shift}+{Z}+{Z}`。\n\n`for-do-done`\
    \ 循环会移动到 `$lno` 参数的下一个*值*（该参数是从命令替换部分 `$(tac ed-lns.txt)` 获取的），并重新运行编辑器。\n\n我们可以编写一个脚本来自动化这个过程。\n\
    \n这就是我倾向于在 Terminal 窗口和标签页的命令行中运行编辑器的原因之一——而不是从一个*图标*上启动带有 `File` 菜单等的 GUI `Editor`\
    \ 窗口。\n\n这种方法对我来说很管用。\n\n当我们在特殊情况下需要考虑反向排序顺序时，使用 `rev` 过滤器就可以派上用场。\n\n## 自动报告\n\
    \n流编辑器 `sed` 帮助我们对文本进行实时修改。\n\n我们为什么想这样做呢？\n\n之前我们使用 `tr` (*translate*，翻译）命令将\
    \ `PATH` 变量中目录路径之间的冒号 (`:`) 字符转换为*换行*字符，以便每个路径显示在单独的一行。\n\n这对于让我们所需的列表更易读非常有用。\n\
    \n通过使用 `sed`，我们可以利用 REs (*regular expressions*，正则表达式) 来定位输入流（来自文件或管道）中的字符、单词或短语，并进行转换、修改、删除或扩展文本，使其更易读/易理解——几乎以我们想要的任何方式。\n\
    \n假设我们有一个小型模板文件，用于帮助报告我们对 shell 脚本和其他程序进行的测试程序的结果，这些程序随后将部署供更广泛的使用。\n\n管理层要求我们提供保证报告以显示产品测试结果，并在我们发布更新产品供通用使用并交付给其他用户和毫无准备的客户*之前*，标记任何潜在的问题和错误。\n\
    \n产品可能需要发回开发者进行进一步的分析和修复工作！\n\n测试分析师使用自动化测试平台来执行测试用例，并对每个代码测试用例报告通过或失败。\n\n我们如何获取这些产品测试结果，并根据需要自动为管理层补全一份报告呢？\n\
    \n假设测试过程输出了这样的简短信息：\n\n```\n01:cmd no opts/args:pass\n02:cmd line bad opts:pass\n\
    03:cmd line good opts:pass\n04:cmd line bad args:pass\n05:cmd line good args:pass\n\
    06:cmd idat bad:pass\n07:cmd odat bad vals:pass\n08:cmd odat bad errs:fail\n09:cmd\
    \ idat good:pass\n10:cmd odat good vals:pass\n11:cmd odat good errs:pass\n```\n\
    \n我们想要读取测试过程输出的每行数据，并使用冒号分隔的字段值来帮助为管理层生成更易读的文档。\n\n## 流编辑器 sed\n\n*流*编辑器 `sed`\
    \ 命令包含一个*搜索并替换*指令，可以这样组合并使用：\n\n```bash\n$ sed -e 's/RE/text/g' file.txt\n```\n\
    \n`sed` 命令可以处理多个此类*编辑*指令，我发现一种方便的方法是在文件名前之前添加一个反斜杠字符并按 `Enter` 键，以换行并在后续行包含更多的编辑部分：\n\
    \n```bash\n$ sed -e 's/RE/text/g' \\\n      -e 's/RE/text/g' \\\n      -e 's/RE/text/g'\
    \ file.txt\n```\n\n`sed` 命令对其输入进行一次扫描——一次一行，并依次执行每一个 `-e` 编辑命令。\n\n"
- fmt: '

    The two options given to the `sort` command are `-t {SEP}` to use `SEP` — a dot
    (`.`) as the field transition separator (instead of the usual blank space for
    plain text) and then `-k {KEY}` where we can specify key number 2.


    Given that my file names almost always contain one single dot (`.`) character
    — right before the file type suffix I expect the second dot separated field on
    each line that gets output from the `ls -1` command is the file type character
    (like `c`) or string (like `txt`).


    It’s possible to specify more complicated sort keys!


    See `man sort` and search for “/KEYDEF”.


    If there were files names containing more than one dot — we could choose to use
    a bit of AWK code to move the last (`file` `type`) field to become the first field
    on each line and then call `sort` without the options followed a bit more AWK
    code to restore the positions of the file type suffix strings.


    # Shared file access


    When we work on Linux computers with more than one user we can find there are
    times when we need shared access to files.


    One way to do that is to change the third set of `rwx` file permission bits to
    give the necessary access for all others.


    Often that is not the best idea.


    We could work in a research group where we need to share intermediate results
    with others in our group. It could be inappropriate to let all other users have
    open access to unfinished reports and/or preliminary analysis details, etc.


    What can we do?


    Files have both the owner (`user`) and `group` name identifiers we can see by
    running an `ls -l` command.


    We can use another command called `chgrp` — mnemonic for change group to change
    the group name identifier of a file or directory that we own.


    The group we choose needs to pre-exist.


    Say we want to use a group identity of `res` — mnemonic for research.


    We can check if that group exists by using a `grep` command to search through
    the `/etc/group` file — where the group identifiers and their lists of one or
    more members gets stored:


    ```

    $ grep ’^res:’ /etc/group

    ```


    We search for lines that start (`^`) with the group name `res` followed by a colon
    (`:`) character.


    No output means the group `res` doesn’t yet exist — we need to make that.


    There’s an administrator command called `addgroup` to make a new group identifier.
    To make a new group called `res` — we need to run — or ask the system administrator
    to run (if that is not us):


    ```

    $ sudo addgroup res

    ```


    There’s another administrator command called `adduser` to help us add an existing
    user to the new group. To add the user `clu` to that new group we can run:


    ```

    $ sudo adduser clu res

    ```


    We can run that to add other users to the `res` group.


    On large multi-user systems we could need to go through a formal request process
    — getting that approved by management, etc.


    These users will need log out and sign in again to see their new group membership
    get reported by the `id` or `groups` commands.


    Any file we own that needs to get access that’s restricted to ourself and members
    of the `res` group needs to have it’s group identifier changed to `res` by running
    that `chgrp` command:


    ```

    $ chgrp res prelim-results.txt

    ```


    The final commands we need to run will involve changing the permission bits for
    the group (`g`) to add (`+`) the read (`r`) access bit and to remove (`-`) all
    permissions from all others:


    ```

    $ chmod g+r prelim-results.txt

    $ chmod o-o prelim-results.txt

    ```


    To make the files available to the `res` group we could need to change the group
    ownership of our `$HOME` directory and any sub-directories to which a group member
    will need access to search for the group access files.


    An alternative method is to make a special `res` directory in another part of
    the Linux file system — or generate a new user named `res` and use their `$HOME`
    directory area for the `res` group files.


    Suppose we make a `res` directory in our $HOME directory where we want to store
    the files to which the `res` group has access:


    ```

    $ cd

    $ mkdir res

    ```


    We get to own the directory and by default will have the read, write and execute
    permissions there — enabling us to copy, edit, move and remove files.


    Next we run the `chgrp` command to change the group identity of `~` (our `$HOME`
    directory) and the new `res` directory:


    ```

    $ chgrp res ~ res

    ```


    Then we use `chmod` to permit both read and exectute permissions for the `res`
    group:


    ```

    $ chmod g+rx ~ res

    ```


    Note: For a directory the execute permission means we have access to search (or
    list the contents of) the directory to show other file system objects — if any.


    Next we move the `prelim-results.txt` file into the `res` directory:


    ```

    $ mv prelim-results.txt res

    ```


    Other members of the `res` group should now get the access they need to read the
    file.


    Without granting write access to the `res` group means those group members do
    not have permission to make any changes there.


    Essentially — they can look at the file(s) — they don’t get permission to touch
    (or make changes to) the file(s) — without our permission.


    **Warning:** A member in the shared group who can read a file can also take a
    copy of that file — they become the owner of that file copy and can choose to
    do what they will with!


    This access method relies upon a great degree of trust. If we can’t trust those
    with whom we live and/or work — then we get caught between a rock and a hard place.


    Why don’t people see the reasons for the necessary levels of trust and responsibility
    and integrity?


    Do they understand their responsibility to keep the group communications at the
    necessary level of privileged shared access?


    It takes one untrustworthy person to break our trust. It takes great effort to
    restore our trust — if ever.


    It takes great effort to build a more secure system — at times we need to make
    set-group processes to control access to shared resources and make those group
    processes limit what access the users can get.


    See `man sg` and `man newgrp` for more details.


    We can use these techniques to grant shared file access to other family members
    on our personal Linux PC where appropriate — to give them read access.


    For example they might like to have access to our stash of family photo image
    files — or the family memoirs you’ve been writing or anything else you choose.


    # My working method


    Here is an image showing part of the directory and sub-directory structure that
    I use for my software development work:


    > ![](media/file2.png)

    image


    I tend to keep a development version of my scripts in my `dev` sub-directories
    and a tested source version in my `src` sub-directories and then the final executable
    version gets copied back to my `$HOME/bin` directory for my day to use.


    When I find the need to modify or enhance a script or fix an uncovered bug — I
    will work on the development version until I am happy with the result.


    I use the clever Linux program called `diff` — mnemonic for differences to display
    the changes I have made between the development version and the bin or source
    version of the script.


    There are GUI versions of `diff` like the KDE `kdiff3` command and the older `mgdiff`
    and my favourite called `tkdiff` — this needs the Tcl/Tk libraries (`tcl8.5` and
    `tk8.5`) installed.


    > See: [https://tkdiff.sourceforge.io/](https://tkdiff.sourceforge.io/)


    This step lets me see that I have updated the version number and have added a
    suitable comment or comments to describe what I have done.


    When I have performed the testing I need to do — to assure myself the update works
    as expected then I copy the development version across to the appropriate source
    (`src/py` or `src/sh`, etc.) sub-directory.


    The next part of the process uses commands from the trustworthy `git` distributed
    version control system.

