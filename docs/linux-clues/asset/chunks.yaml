    ```\n\n在第 3 列中，`.bash_aliases` 文件的大小报告为 16 字节。\n\n我们用来写入该文件的 `echo` 命令在双引号（`\"\
    ...\"）字符之间似乎有 15 个字符！\n\n它看起来是：\n\n```bash\n$ echo \"alias h=history\" >> .bash_aliases\n\
    ```\n\n我们期望在该文件中找到字符串 `alias h=history` —— 或者如果它之前已经存在，则至少在最后一行。\n\n## 文件显示\n\n\
    有一个名为 `cat` 的命令——它是 `concatenate and print files`（连接并打印文件）的缩写——这是一个用于显示一个或多个文件内容的实用程序。\n\
    \n让我们使用 `cat` 来仔细检查该文件的内容：\n\n```bash\n$ cat .bash_aliases\nalias h=history\n\
    $\n```\n\n我预计我们可以数出 15 个字符——一个空格算一个。\n\n`echo` 命令在将其输入参数回显到输出之前，剥掉了那两个双引号（`\"\
    `）字符。\n\n名为 `wc` 的命令——它是 `word count`（字数）的缩写——可以在此提供帮助。\n\n当给定输入文件时，`wc` 命令将统计其中找到的行数、单词和字符数。\n\
    \n如果我们创建的隐藏文件上运行 `wc` 命令，它可能会报告：\n\n```bash\n$ wc .bash_aliases\n 1  2  16 .bash_aliases\n\
    $\n```\n\n它报告了 1 行、2 个空格分隔的单词和 16 个字符。\n\n为什么 `ls` 和 `wc` 报告 16 字节或字符呢？\n\n文件中有什么？\n\
    \n让我们使用另一个名为 `od` 的命令——它是 `octal dump`（八进制转储）的缩写来向我们展示更多细节。\n\n`od`（八进制转储实用程序）有一个\
    \ `-c` 选项，请求输出纯文本字符：\n\n```bash\n$ od -c .bash_aliases\n0000000  a l i a s   \
    \  h = h i s t o r y \\n\n0000020\n$\n```\n\n在这里，它从我们指定的隐藏 `.bash_aliases` 文件中读取输入，并将输出显示回我们的终端。\n\
    \n左侧填充零的七位数字显示了该行显示的第一个字符的计数数字——以八进制表示——从零开始。\n\n正如我们看到的，最右侧有一个两个符号的 `\\n` 字符。\n\
    \n观察差异的原因是 Linux 使用了一个行结束字符——它被称为“换行符”（newline）。\n\n这是 ASCII 字符 `LF` 或 `{Ctrl}+{J}`\
    \ 或换行控制代码——除了通过将我们的光标移动到下一行的动作外，否则它是不可见的。\n\n除非我们告诉 `echo` 命令不要这样做，否则它总是会通过添加一个换行符来结束其输出。\n\
    \n如果 `echo` 不这样做，我们的下一个系统提示符将显示在 `echo` 输出行的末尾——而不是在一个新的、更可见的行上。\n\n那两个符号字符是 `od`\
    \ 和其他实用程序表示 Linux 行结束“换行符”字符的方式。\n\n我希望这是有道理的，并有助于说明 Linux 确实知道自己在做什么。\n\n`ls\
    \ -l` 命令非常准确地报告了其文件大小信息。\n\n`wc` 命令以同样的准确性报告了它看到的内容。\n\n`cat` 命令以同样的准确性显示了文件内容——我们需要为了显而易见的换行符多数一个——它隐藏在眼皮底下。\n\
    \n要查看没有换行符的输出是什么样子——尝试运行此命令：\n\n```bash\n$ printf \"Output without a newline\"\
    \nOutput without a newline$\n```\n\n下一个 shell 提示符显示在哪里了？\n\n## 更多 shell 设置\n\n\
    在之前的章节中，我提到 `bash` shell 会从我们 `home` 目录下的另一个名为 `.profile` 的隐藏文件中读取信息，帮助设置 shell\
    \ 变量。\n\n其中一个变量名为 `PATH`——我们已经见过了。\n\n在 `.profile` 文件中，这个 `PATH` 变量可以通过我们的 `$HOME/bin`\
    \ 目录进行扩展。\n\n为什么这很重要？\n\n这个 `PATH` 变量包含了 `bash` shell 以及其他程序和应用程序进程将用作搜索位置系统目录路径列表，用于定位我们需要运行的可执行命令。\n\
    \n如果我们用自己的 `bin` 目录扩展它，那么就可以把自己的 `bash` shell、Python、`R` 以及其他脚本和/或编译的二进制程序添加到该位置，并期望\
    \ `bash` shell 为我们找到它们。\n\n当 shell 设置过程读取我们 `.profile` 文件中像这样的行时，可以为我们完成此：\n\n\
    ```bash\n# set PATH to include user’s bin if it exists\nif [ -d \"$HOME/bin\"\
    \ ] ; then\n    PATH=\"$HOME/bin:$PATH\"\nfi\n```\n\nGak！乱码（Gobbledegook）！\n\n\
    这有一行以井号（`#`）字符开头的注释。\n\n接下来的三行包含 `bash` shell 条件代码，请求：\n\n“如果存在一个名为 `\"$HOME/bin\"\
    ` 的目录（`-d`），则将该目录和冒号（`:`）插入到现有值（`$PATH`）的开头，以扩展并重新定义（`=`）现有的 `PATH` 变量”。\n\n`fi`\
    \ 语句标记了 `if` 语句开始的条件代码的结束。\n\n在 `bash` shell 语言中有一个 `case` 语句，用它的反写 `esac` 结束。\n\
    \n三个循环结构 `for-do-done`、`until-do-done` 和 `while-do-done` 并不用 `od` 关键字结束，因为那个被我们见过的\
    \ `octal dump` 实用程序使用了。\n\n关键字 `done` 结束 `bash` shell 的 do 循环。\n\n恭喜。我们可以读一点 `bash`\
    \ shell 脚本代码了！\n\n信息太多？请再等我一下。\n\n`HOME` 变量包含什么？\n\n## HOME 变量\n\n当我们输入美元符号（$）并在其右侧加上\
    \ shell 变量名时，`bash` shell 会展开该命名变量以返回其值——如果有的话。\n\n我们可以使用 `echo` 命令来帮助查看结果。这是我的操作以及得到的结果：\n\
    \n```bash\n$ echo \"$HOME\"\n/home/clu\n$\n```\n\n记得第一个 `$` 是我的系统提示符。第二个 `$` 必须紧挨\
    \ `HOME` 单词的 `H` —— 变量名。\n\n## 关于 PATH\n\n最初那个 `PATH` 列表并不包含我们的 `/home/{user}/bin`。\n\
    \n通过利用那些代码行中的规定，我们的 `$HOME/bin` 目录将被插入到 `PATH` 变量的开头。\n\n**注意：** 我更倾向于将自己的 `$HOME/bin`\
    \ 目录插入到系统 `PATH` 的末尾，因为这意味着如果我不小心写了一个与现有命令同名的命令，我就不会用我的尝试覆盖它。\n\n我需要为我的命令换一个名字。\n\
    \n其他人可能喜欢写自己的系统命令——我没那么聪明。\n\n我们如何添加新的 `bin` 目录？\n\n我们可以使用 `Files` 应用程序，并在我们的\
    \ `Home` 文件夹中选择菜单操作 `File-> Create New Folder`并将 `Untitled Folder` 重命名为 `bin`\
    \ ——如果我们想做的话。\n\n糟糕！\n\n## mkdir & rmdir\n\n有一个名为 `mkdir` 的命令——缩写是你猜对了——`make\
    \ directory`（创建目录）。\n\n我们可以使用这个命令创建自己的目录，如 `bin`、`dev`、`pdf`、`src` 和 `txt`——任何我们认为有用的。\n\
    \n我喜欢将我的开发文件与 `bin`、`src` 目录以及通用 PDF 文件分开放在 `pdf` 目录，这样我可以在那里找到它们——并且减少了主目录的混乱。\n\
    \n为了创建我们自己的 `bin` 目录，我们可以使用命令：\n\n```bash\n$ cd\n$ mkdir -v bin\nmkdir: created\
    \ directory ’bin’\n$\n```\n\n这并不难。\n\n首先 `cd` 是为了预防，确保我们在自己的主目录中工作。\n\n`mkdir`\
    \ 命令在我们当前工作目录中创建指定的新目录——除非我们需要指定更详细的路径。\n\n`-v` 选项是 `verbose`（详细）的缩写——并让 `mkdir`\
    \ 报告它做了什么。\n\n我总是觉得这比使用 `Files` 应用简单得多。\n\n"
- fmt: "\nNow our own `bin` directory should get picked up by that piece of conditional\
    \ code we saw in our `.profile` file the next time we log out and then sign in\
    \ again to our Linux system.\n\nIf we want to test that without logging out and\
    \ back in again we could try running `bash` with a `-l` or `--login` option in\
    \ our `Terminal` window or `tab` to get a new instance of a login shell.\n\nNext\
    \ try re-running that `echo $PATH` command again:\n\n```bash\n$ echo \"$PATH\"\
    \ | tr \":\" \"\\n\"\n/home/clu/bin\n/usr/local/bin\n/usr/sbin\n/usr/bin\n/sbin\n\
    /bin\n/snap/bin\n/usr/local/games\n/usr/games\n$\n```\n\nThat appears to have\
    \ found my `/home/clu/bin` directory.\n\nWe can type an `exit` command to close\
    \ the second `bash` shell to get back to the first shell.\n\nWhen we need directories\
    \ and sub-directories we can use a `-p` option with the `mkdir` command.\n\nThe\
    \ `-p` option is mnemonic for `parents` and ensures that both parent directories\
    \ and their specified sub-directories will get instantiated when we run `mkdir`\
    \ with the `-p` option.\n\nFor example, I like to have separate directories for\
    \ `python` scripts and for `shell` scripts below my `dev` (development) directory.\n\
    \nHere I have added `-p` (parents) and `-v` (verbose) options to show what this\
    \ does:\n\n```bash\n$ cd\n$ mkdir -p -v dev/{py,sh}\nmkdir: created directory\
    \ ’dev’\nmkdir: created directory ’dev/py’\nmkdir: created directory ’dev/sh’\n\
    ```\n\nI have used another short-hand method in the `bash` shell, using curly\
    \ brackets `{` and `}` around a comma-separated list of names that the shell will\
    \ expand — separately into each of those paths: `dev/py` and `dev/sh`.\n\nThe\
    \ `man bash` pages refer to this as `Brace Expansion` — more on this soon.\n\n\
    The `-p` option makes sure the initial `dev` directory got made too.\n\nOn a new\
    \ Linux installation I will also run:\n\n```bash\n$ cd\n$ mkdir -p -v src/{py,sh}\n\
    mkdir: created directory ’src’\nmkdir: created directory ’src/py’\nmkdir: created\
    \ directory ’src/sh’\n```\n\nIf ever we need to remove a directory there is a\
    \ command called `rmdir` to do that. The directory needs to be emptied of any/all\
    \ file and sub-directory content for `rmdir` to work — otherwise it complains:\n\
    \n```bash\n$ rmdir old\nrmdir: failed to remove ’old’:\n       Directory not empty\n\
    ```\n\nThat’s a reasonable safeguard.\n\n## Write a shell script\n\nLet’s say\
    \ we write a small `bash` shell script named `td.sh` — mnemonic for today as an\
    \ experiment.\n\nIf I’m writing a new shell script like `td.sh` — in particular\
    \ if I did not want to give it the `.sh` suffix I will run the bash shell `type`\
    \ command to double check that I’m not trying to make a new file for a command\
    \ that already exists:\n\n```bash\n$ type td.sh td\nbash: type: td.sh: not found\n\
    bash: type: td: not found\n$\n```\n\nGood. I’m hoping to see `not found` from\
    \ `type`!\n\nLet’s say we want to use these five lines of `bash` shell script\
    \ code:\n\n```bash\n#!/usr/bin/bash\necho\nprintf \"Today is \"\ndate +\"%A %F\"\
    \necho\n```\n\nThe first line instructs the Linux system to use the `/usr/bin/bash`\
    \ shell to interpret the content of our script.\n\nWith those first two characters\
    \ (`#!`) we could hear this called the \"hash-bang\" line.\n\nWe will find these\
    \ at the start of other Linux scripts — for languages like Python and R (statistics)\
    \ these can look like:\n\n```bash\n#!/usr/bin/env python3\n```\n\nand\n\n```bash\n\
    #!/usr/bin/env Rscript\n```\n\nThe next line in `td.sh` contains an `echo` command\
    \ without any arguments to display a blank line.\n\nAfter that a `printf` (formatted\
    \ print) statement followed by a call to the `date` command with an unusual looking\
    \ argument (`+\"%A %F\"`) and then another `echo` command.\n\nSee `man date` for\
    \ information about the format specifiers `%A` and `%F`.\n\nAn `echo` commands\
    \ always produces a newline at the end of its output unless we instruct it not\
    \ to do that.\n\nA `printf` command does not produce any newline at the end unless\
    \ we do instruct it to print one.\n\nI wanted the output of the `date` command\
    \ to follow on the same line as the short \"Today is \" prefix text.\n\nUse your\
    \ favourite editor program to insert those five lines and save them into a file\
    \ named `td.sh` — I always use `vim` as my editor.\n\nIf you have not yet gotten\
    \ comfortable using a Linux editor, there’s an interesting line editor called\
    \ `ed` we could use to construct that small shell script like this — it’s not\
    \ difficult:\n\n```bash\n$ ed\na\n!/usr/bin/bash\necho\nprintf \"Today is \"\n\
    date +\"%A %F\"\necho\n.\nwq td.sh\n```\n\nApart from my shell prompt (`$`) type\
    \ each line as it appears and press the `Enter` key at the end of the line(s).\n\
    \nThe `a` on the line by itself is an `ed` append command.\n\nNext we enter those\
    \ five shell script lines.\n\nThe dot (`.`) on the line by itself is the `ed`\
    \ command for end of input and revert to command mode.\n\nThe `wq` line is an\
    \ `ed` command to get it to write (`w`) to the specified file (`td.sh`) and then\
    \ quit (`q`) back to the shell.\n\nWhen we complete the last line it should output\
    \ the number of characters (`59`) it writes to the file `td.sh` and then display\
    \ our next shell prompt.\n\nRemember we can use the `cat` and `od -c` commands\
    \ to examine the file content in detail — does it look identical to my five lines?\n\
    \nThe documentation for the GNU `ed` command gets maintained in the `info` utility\
    \ and we can read its info pages by running:\n\n```bash\n$ info ed\n```\n\nWell\
    \ worth a read one day if we have the time.\n\nThe GNU `ed` editor is a replication\
    \ of the original Unix line editor of the same name.\n\nThat 55 year old software\
    \ logic still works with the same perfection today!\n\nOne way to run our new\
    \ `td.sh` shell script is this:\n\n```bash\n$ bash td.sh\n. . .\n```\n\nThere’s\
    \ a better way.\n\n## Using chmod\n\nNext we need to ensure we use the `chmod`\
    \ command — mnemonic for change mode to give our shell script `execute` permission:\n\
    \n```bash\n$ chmod u+x td.sh own```\n\nThe argument `u+x` means add the `x` permission\
    \ bit for the user who owns the specified file.\n\nWe can test our shell script\
    \ from where we write it by then typing the command:\n\n```bash\n$ ./td.sh\n```\n\
    \nThe leading dot (`.`) and forward slash (`/`) characters instruct the `bash`\
    \ shell running in our Terminal to search for the shell script `td.sh` in our\
    \ current working directory.\n\n**Note:** A single dot (`.`) is short-hand for\
    \ the current directory.\n\nTwo dots (`..`) is short-hand for the parent directory.\n\
    \nIf we `cd` into a sub-directory and want to return to the parent directory we\
    \ can run `cd ..` to get back there — that can be most helpful at times.\n\nWhen\
    \ we approve of the script’s run activity we can move or copy it across to our\
    \ own `bin` directory.\n\nHow do we do that?\n\n## Copy, move, remove\n\nLinux\
    \ has commands named:\n\n- `cp` — mnemonic for copy a file\n- `mv` — mnemonic\
    \ for move (or rename)\n- `rm` — mnemonic for remove (or delete)\n\nThe syntax\
    \ for the `cp` and `mv` commands is:\n\n```bash\n$ cp [-opts] source destination\n\
    $ mv [-opts] source destination\n```\n\nUnless we know for certain we will not\
    \ want to make any more updates or enhancements to our shell script (for the moment,\
    \ at least) it’s best to use a copy process.\n\nAssuming we constructed the `td.sh`\
    \ script in our `$HOME` directory we can copy that to our own `bin` directory\
    \ with:\n\n```bash\n$ cd\n$ cp -p -i td.sh bin\n```\n\nThe `-p` option given to\
    \ the `cp` command instructs it to copy the same permissions over to the target\
    \ file we deposit in our `$HOME/bin` directory.\n\nWithout using the `-p` option\
    \ the target file could lose that important `execute` permission bit we set with\
    \ the `chmod` command.\n"
