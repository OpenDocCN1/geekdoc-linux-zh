    顺便提一下——mnemonic”（助记词）一词的首字母“m”是不发音的，读音有三个音节，类似于“nem-on-ic”或“ne-mon-ic”。


    短名称有助于减少当时必须使用的那种笨重旧`mechanical`电字机控制台上所需的打字量。


    例如，`ls` 命令是 `list`（列表）或`listing`的缩写，它会显示我们`current` `directory`（目录）或文件夹中文件系统对象的名称列表——或者根据我们的指令显示其他地方。


    我们如何知道哪个是`current` `directory`（目录）、文件夹或文件系统工作空间呢？


    当我们第一次登录 Linux 系统时，那里就是我们指定的用户 `home` 目录。


    有一个名为 `pwd` 的命令——`print working directory`（打印工作目录）的缩写，它为我们显示该信息。


    另一个名为 `cd` 的命令——`change directory`（切换目录）的缩写，它允许我们在文件系统的当前焦点切换到我们选择的任何其他目录或文件夹——只要我们有权限这样做。


    在使用 `cd` 命令在文件系统的不同位置移动后，我们可能会好奇自己最后到了哪里——再次运行 `pwd` 即可。


    就像这三个命令一样，我们在 Linux 中触手可及的数百软件工具每个都执行一项任务，并且执行得精准。


    这有点像我们小时候开始学习阅读时。


    起初，每个词都是谜团——我们无法辨别它的音节——不知道如何读一个词——不知道它的意思。


    随着时间的推移和练习，我们开始识别学过的单词并能读出来，并发现自己可以理解并理会所读的内容。


    很快，我们就能阅读短语、句子、段落、章节、章节以及整本故事书。


    Linux 这个强大且描述性丰富的部分也是如此。


    过了一段时间，那些助记命令名称开始变得容易记忆，并帮助我们在更短的时间内完成更多工作。


    我们发现可以视觉化出一系列简短、利落、独特且助记的命令名称，来帮助我们完成需要的任务。


    Linux 计算的力量源于我们几乎无穷尽的方式，我们可以通过组合这些命令来创建自己的更高效的命令——根据我们的工作方式进行定制。


    在 Unix 还是 Linux 中，这种灵活性一直令我感到惊讶。


    ## 终端威力


    如今的`Terminal`窗口支持额外的`tabs`（标签页）或子窗口，我可以在两个终端窗口中的每一个中打开五个或更多，并并发处理不同的任务，帮助我推进计划完成的工作。


    在像 `gnome-terminal` 和我更倾向于使用的 `LXTerminal` 等终端窗口中，使用快捷键组合 `{Ctrl}+{Shift}+{T}`
    可以轻松打开新标签页。


    我们可以使用快捷键组合如 `{Alt}+{1}`、`{Alt}+{2}`、`{Alt}+{3}` 等在标签之间切换。如果手里拿着鼠标，也可以点击其中一个标签页。


    例如，在终端窗口的某个`tabs` 中，我会使用 `cd` 命令切换到存放当前书籍文本文件的`directory`（目录）或文件夹。


    ## 我的文本编辑


    我使用这个子窗口运行我最喜欢的编辑器 `vim`——`vi-Improved`（改进版 vi）的缩写——这是一个非常强大且高效的工具，其编辑命令都是助记且易记的。


    原始的 `vi` 编辑器——`visual`（视觉）的缩写是由 William N. Joy 等人在 20 世纪 80 年代在美国加利福尼亚大学伯克利分校开发的。当时计算机显示单元（带有玻璃屏幕的“笨”终端显示器）的使用开始增加。


    我在 C.S.I.R.O. 的 Unix 上开始使用 `vi`，它很好服务了我所有的文本编辑需求——Fortran 和 C 语言编程、Perl、R 和 Shell
    脚本编程，以及音乐和书籍写作。


    `vim` 版本由荷兰软件工程师 Bram Moolenaar 等开发并增强，`vim` 很快进入了 Linux。


    如果你想快速了解高效编辑以及 `vim` 如何帮助你，请阅读 Bram 的那篇七页论文，标题为《Seven habits of effective text
    editing》（高效文本编辑的七习惯）：


    > [`www.moolenaar.net/habits_paper.pdf`](https://www.moolenaar.net/habits_paper.pdf)


    有一个名为 `vimtutor` 的特殊程序可以帮助我们学习 `vim` 的基础——它是实操性的，而且不需要很长时间。这让我们在极短的时间内掌握 `vim`
    编辑的基础。


    完成 `vimtutor` 大约需要 30 分钟——为了获得终身的卓越编辑能力，这是一个很小的投资。


    **注意：** `vim` 编辑器命令是助记的——很容易记忆，如 `i` 代表在光标前 `insert`（插入）文本，`a` 代表在光标后 `append`（追加）文本。甚至我们还需要按
    `Esc` 键从文本插入模式 `escape` 回到 `normal` 模式。


    `vim` 编辑器命令是助记的——很容易记忆，如 `i` 代表在光标前 `insert`（插入）文本，`a` 代表在光标后 `append`（追加）文本。


    还有其他你可以安装并尝试的，如 `cream`、`emacs`、`featherpad`、`kate`、`nedit`。


    你需要找到适合的一个。


    ## 我的文档方法


    在第二个终端窗口的另一个`tab` 中，我会打开同一个文件系统工作空间——我使用优秀的 TeX 系统——一套由斯坦福大学的 Leslie B. Lamport
    博士和 Donald E. Knuth 教授开发的文档准备宏。


    从我使用 Unix 的起我就一直使用这些工具，它们在 Linux 上也能运行。


    目前，我通过一个名为 `lx` 的小型 Shell 脚本运行它——`latex` 的缩写——它通过另一个辅助脚本 `latexmk` 运行，由 John Collins
    开发了真实的 `latex` Perl 脚本：


    > [`www.cantab.net/users/johncollins/latexmk/`](https://www.cantab.net/users/johncollins/latexmk/)


    我的双字母命令 `lx` 的结果是在我做的最新更新上重新运行 `latex` 程序，然后显示我工作的打印版本的 PDF 文件。


    接下来，我可能会运行另一个名为 `l2e` 的 Shell 脚本——`latex to epub` 的缩写。这是一个辅助脚本，将书籍内容重新处理为 `epub`
    版本，并在我喜欢的名为 `okular` 的 epub 阅读器中显示——最有用——非常适合校对。


    我使用 `pandoc`——一个通用标记转换器将我的初始 LaTeX 纯文本文件转换为 `pandoc` `markup`，从那里转换为我需要的最终 `epub3`
    格式。


    尽管听起来很复杂，但实际上可能相当简单，因为我发现了如何让这些命令按照我想要的方式运行——而我并不是天才。


    对我来说，最棒的部分是，我不需要永远*抓取*鼠标并*移动*鼠标指针到另一个应用程序菜单，然后*选择*菜单并让鼠标指针在选项列表中运行并选择我下一个需要的功能。


    我确实使用鼠标——将焦点从一个窗口切换到另一个窗口，或者向上向下滚动阅读长文本，或者高亮文本并将复制粘贴到其他地方。


    其他终端窗口 `tabs` 会根据需要使用。


