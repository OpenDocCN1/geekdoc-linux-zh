  trans: "\n最初这些将是空占位符，但 `snap` 除外，它包含了 `firefox` 和 `snapd 桌面集成` 的子文件夹。\n\n点击右上角的\
    \ [x] 按钮关闭文件浏览器窗口。\n\n另一个快速启动图标是 `LibreOffice Writer`。如果我们点击它，很快就会看到一个强大的文字处理器应用程序窗口。我预计菜单和工具栏看起来会很熟悉，并且操作方式与我们见过的其他产品一样。\n\
    \n通过选择右上角的 [x] 按钮，或者在其 `File` 菜单中选择 `Exit LibreOffice` 选项来再次关闭窗口。\n\n在 Ubuntu\
    \ 主窗口的左下角有一个名为 `Show Apps` 的项目。如果我们选择它，将看到 Ubuntu 演示或 `try` 版本加载的应用程序集合。\n\n尝试其他一或两个项目——比如\
    \ `Clocks`（时钟）、`Calculator`（计算器）、`Calendar`（日历）或 `Text Editor`（文本编辑器）。\n\nUbuntu\
    \ Linux 非常精良，并为用户提供了广泛的工具。安装过程加载了其中的一小部分样本。\n\n顶多不过我们只是用羽毛的软端触了碰表面。\n\n如果我们想进一步使用\
    \ Linux，我们可以采取两种方式之一——在我们当前的系统“旁边”安装 Linux——使其成为双引导系统；或者我们可以——“替换”当前的系统安装 Linux——请小心。\n\
    \n如果我们已经准备好并想要替换旧的操作系统，那是没问题的。\n\n我们当前的系统中是否有任何我们需要保留的文件？\n\n在用新的 Linux 安装程序覆盖磁盘之前，请确保你已将这些文件备份到可移动介质上。\n\
    \n此处未涵盖逆转该过程的操作。如果你没有备份文件，这可能是是不可能的。你需要搜索有关如何尝试该操作的详细信息。\n\n在走得太远之前，请先阅读 Ubuntu\
    \ 注意事项。\n\n如果你确定要安装 Ubuntu，可以通过选择桌面上的 `Install Ubuntu` 快捷图标返回安装程序菜单。\n\n我当时在使用一台旧电脑，需要重启电脑并选择\
    \ `safe graphics`（安全图形模式）选项才能通过安装过程。\n\n如果你的电脑设备上安装了另一个操作系统，你应该会看到一个选项，让你与该系统并存安装\
    \ Ubuntu，而不是替换它。\n\n如果你想让 Ubuntu Linux 成为硬盘上唯一的操作系统，请选择 Erase disk（擦除磁盘）并安装 Ubuntu。\n\
    \n按照提示操作并选择默认设置，除非你知道为什么要选择替代选项。\n\n祝你好运。\n\n# Linux 用户\n\n我花费了无数小时在我的 Linux 电脑上工作。\n\
    \n当我写这本书的文字时——我正在使用 Linux。\n\n上世纪 20 世纪 80 年，我在 C.S.I.R.O. 工作时开始使用 Unix 计算机操作系统，并且再也没有回头过。\n\
    \n像我这样的科学家和技术人员发现，在 Unix 上完成的工作比我们以前在其他系统上实现的要多。\n\nLinus B. Torvalds 在 1991 年于芬兰赫尔辛基大学就读期间开始开发\
    \ Linux —— 这已是 30 多年前的事。\n\nUnix 和现在的 Linux 都是多用户系统，每个用户都有自己的“家”目录或文件夹，他们可以在其中按照任何符合自己逻辑顺序组合自己的文件集。\n\
    \n在 2025 年，Linux 系统仍然是世界上大多数规模最强大的超级计算机系统的“首选操作系统”，其计算集群支持数千——现在是数百万个 CPU 核心。\n\
    \n强大的 Linux 操作系统足够小，可以运行在大多数拥有 4 GB RAM 和 250 GB 磁盘的 PC 上——如果可以，请获取更多的内存和 SSD\
    \ 存储。\n\n在你的 Linux PC 系统中添加更多用户账户很容易，以便需要时让家庭成员访问 Linux。\n\n每个用户的文件都存储在计算机存储中各自独立的区域中——我们将在适当时候讨论这一点。\n\
    \n与流行的商业计算机系统不同，在那些系统中用户通常通过使用“鼠标”指针设备来选择文件并运行程序，每个程序都有自己的“图标”——Linux 系统既支持这种形式的界面，也支持灵活的基于文本的命令行界面，像我这样的人觉得它易于使用且效率更高。\n\
    \n为什么？我不需要定位文件和程序图标，不需要抓住鼠标在屏幕上移动指针来选择并双击这些对象以传达我的意图，我只需要把手指放在键盘上，发现在 `Terminal`\
    \ 窗口中输入简短的助记命令和我想使用的文件名要容易得多。\n\n这听起来有点有点“老派”，在某种意义上——确实如此。我已经在电脑上使用这种工作风格很长时间了。我尝试过其他计算机系统，但总是发现自己把它们抛置一边，回到我更高效的\
    \ Linux `Terminal`。\n\n这是因为我们学不会这只“老狗”学新花样吗？我不这么认为——我几乎每天都会学新东西——我坚信 Terminal\
    \ 界面效率更高。\n\n我通过键盘使用交互式 shell 命令行语言与我的电脑“交谈”，这种语言为我提供了巨大的计算能力，包括缩写方法和编程特性，帮助我完成的一系列活动。\n\
    \n是什么让 Linux 具有优势？是什么让它与众不同？\n\n## 文件系统与进程\n\nUnix 和 Linux 设计和构建的计算模型包含两个重要的概念。\n\
    \n一旦我们理解了“文件系统”和“进程”这两个概念，我们就知道了为了取得快速进展所需要的一切。\n\n我预计你知道我们将信息存储在“文件”中，并将这些文件保存在“目录”或“文件夹”集合中，以帮助我们定位所需的文件。\n\
    \n将信息组织起来比将其散落在各处要有意义——或者更糟——将所有内容都放在一个没有划分的巨大区域内。\n\n我们不想在每次需要报告、备忘录、数据文件或计算机脚本时都像在玩“大海捞针”。\n\
    \n在我的电脑上，我使用一系列目录或文件夹名称以及任意数量的子目录或子文件夹层级，以便我容易找到信息。我们将仔细研究如何做到。\n\n简而言之，这就是“文件系统”在基础层面为我们提供和维护的能力——配备完整的文件访问权限，以帮助保持信息在我们的控制之下。\n\
    \n如果确定需要更复杂的安全形式，我们可以使用数据加密方法。\n\n`process`（进程）是正在运行的程序实例，它被加载到计算机内存中为我们执行其操作。\n\
    \nLinux 中的并不是每个进程都是“一刀切”或独立的应用程序——这里有更具灵活性。\n\nLinux 用户可以使用交互式且可编程的 shell 进程中易于使用的机制，使能够将一个进程的输出连接到另一个进程的输入中——如果这种进程链符合逻辑，可以无限进行。\n\
    \n`process` 的这些互连功能允许我们构建自定义的进程流水线，以具有重复和可靠性的方式运行任务，这在其他计算机系统中很难实现的。\n\n我们不需要理解每一个细微的细节。\n\
    \n在随后的章节中，我们将检查这两个 Linux 系统设计概念的实用功能。\n\n## 助记命令\n\n在 Terminal 窗口中工作时，Linux 中的可执行程序或命令通常具有看起来不寻的文件名。起初它们几乎是加密的。\n\
    \n 5 到 10 分钟后，这些开始变得有意义。\n\n大多数在旧版 Unix 环境中开始开发的命令程序都被赋予了简短的助记名称——旨在辅助我们的记忆提取。\n"
- fmt: '

    By the way — the term ‘mnemonic’ starts with a silent ‘m’ and gets pronounced
    with three syllables as ‘nem-on-ic’ or ‘ne-mon-ic’..


    Short names helped to reduce the amount of typing needed on the clunky old `mechanical`
    Teletype keyboard consoles they had to use back then.


    For example the command `ls` is mnemonic for `list` or `listing` and will display
    a list of the names of the file system objects located in our `current` `directory`
    or `folder` — or elsewhere if we so direct it.


    How do we know what is that `current` `directory` or `folder` or file system workspace?


    When we first sign in to our Linux system that will be our designated user `home`
    directory.


    There’s a command called `pwd` — mnemonic for `print working directory` and it
    displays that information for us.


    Another command called `cd` — mnemonic for `change directory` enables us to change
    our current point of focus in the file system to any other directory or folder
    we choose — if we have permission to do so.


    After using the `cd` command to move around to different locations in the file
    system we could wonder where we have ended up — run `pwd` again.


    Like these three commands the hundreds of software tools we have at our finger
    tips in Linux each do one task and do that with precision.


    It’s a bit like when we first started to learn to read — as a child.


    At first every word is a mystery — we can’t discern its syllables — we don’t know
    how to say a word — we don’t know what it means.


    With time and practise we begin to recognise words we have learned and can vocalise
    and find we can understand and make sense of what we read.


    Before long we can read phrases and sentences and paragraphs and sections and
    chapters and entire story books.


    It’s the same with this powerful and descriptive part of Linux.


    After a while those mnemonic command names start to get easy to remember and can
    help us achieve more work in less time.


    We find we can visualise a series of these short, sharp, unique, mnemonic command
    names to help us do the tasks we need to get done.


    The power of computing with Linux gets provided by the almost endless ways in
    which we can combine commands like these to make our own more efficient commands
    — customised to the way we need to work.


    In both Unix and in Linux this flexibility continues to astound me.


    ## Terminal power


    These days the `Terminal` windows support extra `tabs` or sub-windows and I can
    have five or six or more of those open in each of two Terminal windows and be
    working concurrently on different tasks that help me make progress on the work
    I plan to achieve.


    In Terminal windows like `gnome-terminal` and one called `LXTerminal` that I prefer
    to use its easy to open new tabs with the three key control code `{Ctrl}+{Shift}+{T}`.


    We can switch between the tabs using two key codes like `{Alt}+{1}`, `{Alt}+{2}`,
    `{Alt}+{3}`, etc. Or we can click on one of the tabs if we have the computer mouse
    device in hand.


    For example, in one of the `tabs` in a Terminal window I will use the `cd` command
    to change to a `directory` or `folder` where I keep text files for my current
    book.


    ## My text editing


    I use this sub-window to run my favourite editor program called `vim` — mnemonic
    for `vi-Improved` — a most capable and efficient tool where the edit commands
    are mnemonic and easy to remember.


    The original `vi` editor — mnemonic for `visual` got developed in the 1980’s by
    William N. Joy and others at the University of California, Berkeley, USA. The
    availability of visual display units for computers — “dumb” terminal monitors
    with glass screens — started to increase.


    I started using `vi` on Unix at C.S.I.R.O. and it has served me well for all my
    text edit needs — Fortran and C programming and Perl, R and shell script programming
    as well as music and book writing.


    The `vi-Improved` version got developed and enhanced by a Dutch software engineer
    named Bram Moolenaar and others and `vim` soon found its way into Linux.


    If you want a quick overview of effective editing and how `vim` can help you with
    that please read Bram’s seven (7) page paper titled `Seven habits of effective
    text editing`:


    > [https://www.moolenaar.net/habits_paper.pdf](https://www.moolenaar.net/habits_paper.pdf)


    There’s a special program called `vimtutor` to help us learn the basics of `vim`
    — it’s hands-on and does not take too long to work through. This provides us with
    the basics of editing with `vim` in next to no time flat.


    Working through the `vimtutor` takes about 30 minutes — a small investment for
    a lifetime of superior editing capability.


    **Note:** The `vim` editor commands are mnemonic — easy to remember like `i` for
    `insert` text `before` the cursor and `a` for `append` text `after` the cursor.
    Even the `Esc` key we need to press to `escape` from text `insert` mode back to
    `normal` mode


    The `vim` editor commands are mnemonic — easy to remember like `i` for `insert`
    text `before` the cursor and `a` for `append` text `after` the cursor. Even the
    `Esc` key we need to press to `escape` from text `insert` mode back to `normal`
    mode


    Wait, there are others you can install and try like `cream`, `emacs`, `featherpad`,
    `kate`, `nedit`.


    You need to find one that works.


    ## My document method


    In another `tab` in a second `Terminal` window I will open the same file system
    workspace — I use the brilliant TeX system — a set of document preparation macros
    developed by Dr. Leslie B. Lamport Prof. Donald E. Knuth at Stanford.


    I have used these tools since the time I worked on Unix and these run on Linux,
    too.


    At present I run this from a small shell script I call `lx` — mnemonic for `latex`
    — running through another helper script `latexmk` that runs the real `latex` Perl
    script — developed by John Collins:


    > [https://www.cantab.net/users/johncollins/latexmk/](https://www.cantab.net/users/johncollins/latexmk/)


    The result of my two letter command `lx` is to re-run the `latex` program on the
    latest updates I have made, then display a PDF file of the `print` version of
    my work.


    Next I might run another shell script I call `l2e` — mnemonic for `latex to epub`.
    It’s a helper scripts to re-process the book content into an `epub` version and
    displays that in my favourite `epub` reader called `okular` — most useful — great
    for proofreading.


    I use `pandoc` — a general markup converter to convert my initial LaTeX plain
    text files into `pandoc` `markup` and from there into the final `epub3` format
    I need.


    Although that could sound complicated it must in fact be rather straightforward
    because I figured out how to make these commands work the way I want — and I am
    no genius.


    The best part of this for me is that I do not forever need to *grab* the mouse
    and *move* the mouse pointer to another application menu to then *select* the
    menu and run the mouse pointer down a list of options to find and select the functionality
    I want next.


    I do use my mouse device — to shift focus from one window to another or to scroll
    up and down to read through long texts or highlight text and paste a copy of that
    elsewhere.


    Those other Terminal window `tabs` get used as and when required.


    A spark of an idea prompts me to add a small text note in my software development
    area to remind myself about a thought that has occurred to me from my subconscious
    thinking — or a bug I have uncovered in a shell script.

