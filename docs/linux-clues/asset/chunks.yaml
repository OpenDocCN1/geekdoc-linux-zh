    最后一行再次显示了我们如何将整个 `for-do-done` 循环的输出重定向到另一个文件 `hst-rs.all`。


    输出内容：

    ```bash

    $ cat hst-rs.all

    ```

    `a -> 324`

    `c -> 411`

    `i -> 9`

    `s -> 188`

    `x -> 5`


    使用另一个简单的 `awk` 脚本计算这些数字的总和：

    ```bash

    $ awk ''{ttl = ttl + $3 + 0} END {print ttl}'' hst-rs.all

    ```

    `937`


    我们可以使用 `bc` 来检查这些数字的和：

    ```bash

    $ bc

    324 + 411 + 9 + 188 + 5

    937

    ```


    使用 `bc` 检查命令调用的平均百分比：

    ```bash

    $ bc

    scale=2

    324 * 100 / 937

    34.58

    411 * 100 / 937

    43.86

    9 * 100 / 937

    0.96

    188 * 100 / 937

    20.06

    5 * 100 / 937

    0.53

    ```


    `bc` 计算器可以处理整数和浮点算术。`scale=2` 命令设置输出使用两位（2）小数精度。它可以处理你可能需要的任何精度。计算中存在总计 0.01%
    的舍入误差 —— 我想我会忽略这一点。我运行 Linux 命令、`bash` shell 别名或我编写的脚本的大致比例约为 44:35:20 —— 也就是说，我每运行
    44 个标准 Linux 命令，我就会运行 35 个 `bash` shell 别名以及另外 20 个我自己的（`perl`、`python`、`R`、`shell`
    或 `tcl`）脚本 —— 再加上另外一次命令行测试或错误。在这个过程中，我使用了十二（12）个中间和/或临时文件：

    ```bash

    $ ls -g hst

    ```

    `-rw-r---- 1 20016 Jun 27 09:33 hst.txt`

    `-rw-r---- 1 13457 Jun 27 09:57 hst-clns.txt`

    `-rw-r---- 1 4729 Jun 27 09:58 hst-cmds.txt`

    `-rw-r---- 1 2600 Jun 27 10:13 hst-ctrs.txt`

    `-rw-r---- 1 2800 Jun 27 10:32 hst-ctrs.ed`

    `-rw-r---- 1 48 Jun 27 14:04 hst-ctrs.nlns`

    `-rw-r---- 1 644 Jun 28 09:37 hst-ctrs.ed,a`

    `-rw-r---- 1 1036 Jun 28 09:37 hst-ctrs.ed,c`

    `-rw-r---- 1 140 Jun 28 09:37 hst-ctrs.ed,i`

    `-rw-r---- 1 140 Jun 28 09:37 hst-ctrs.ed,x`

    `-rw-r---- 1 840 Jun 28 09:37 hst-ctrs.ed,s`

    `-rw-r---- 1 46 Jun 28 13:31 hst-ctrs.all`

    ```

    给 `ls` 命令提供的选项 `-g` 允许其列出文件信息而不显示文件所有者和组标识符（以节省行空间），并按时间反序列出文件，让最新的文件排在最后。


    我所展示的大部分独立进程都可以封装进 shell 脚本中。某些进程可以通过管道组合起来，形成复合命令，将一个阶段的输出传递给下一个阶段。通过这种方式，我们可以去掉大部分文件
    —— 或者至少在之后通过删除非（生成的）文件来清理现场 —— 除了输入文件 `hst.txt` 以外的所有文件。我把这个留给读者作为练习！


    在处理不同的项目时，我使用的命令组合可能会发生变化 —— 取决于涉及的任务。我的工作环境有 400 多个别名定义。大多数别名平均运行一两个命令。我编写别名通常成组出现，以帮助我处理特定类别的工作
    —— 例如用于 bash shell 编程、python 编程、Lilypond 音乐编程任务或我的写作任务。


    我的脚本程序从四五行的短脚本到其他的不等。


    ## 大括号扩展 (Brace expansion)

    大括号扩展是一种生成任意字符串的机制。例如，`a{d,c,b}` 扩展为 `ade ace acb`。在创建 `dev/{py,sh}` 和 `src/{py,sh}`
    目录时，我使用了这些扩展之一。

    '
