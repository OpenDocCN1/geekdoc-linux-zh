  trans: "\n我修改后的文件会通过 `git add` 过程，使其成为暂存项，准备提交到 `git` 数据库。\n\n接下来，会运行 `git commit`\
    \ 过程，将我暂存的更新存入我在这些位置（`src/...`）中维护的 `.git` 仓库中。\n\n`git` 的初始概念和设计是由 Linus Torvalds\
    \ 在开发和协调 Linux 内核系统的增强时发起的 —— 这是一个需要不断更新的复杂软件，因此需要跟踪成百上千次更改的能力。\n\n如果需要，`git`\
    \ 仓库可以维护并行的开发分支，并在适当的开发、测试以及任何冲突解决并获得我们的批准后，将这些分支合并——这是一个非常强大的版本控制系统。\n\n更多详情请参阅\
    \ `man git` ——那里有大量的文档可以阅读。参阅 `man gittutorial` 可以入门。\n\n现在我预计这听起来工作量很大。好处是，这些步骤中的大部分都封装在我自己的开发和发布脚本以及\
    \ `aliases`（别名）中。\n\n我在适当的时间运行一个 `script` 或 `alias`，以触发我想在指定文件上执行的操作或多个操作。\n\n\
    遵循这种程序有助于我控制自己正在做什么以及已经完成了什么 ——帮助我看到哪些是有用的，哪些需要更多工作。\n\n根据最后统计，我的 `$HOME/bin`\
    \ 目录下有 500 多个由我编写和开发的脚本 —— 自从 1994 年开始使用 Linux 以来。\n\n这相当于大约每月有一个（1）个新脚本 —— 还有很多工作在进行，而且时间充裕。\n\
    \n如果没有多年来开发和完善我的软件处理程序，我无法做到这些。我起步缓慢，并随着时间的推移建立了微小的改进。\n\n我用所有这些脚本做什么呢？\n\n老实说，我预计这些脚本大部分已经过了它们的用途期限。我的需求可能每周都会发生变化，而编写一段新的小型\
    \ `bash` 脚本代码几乎可以在瞬间提供解决方案。\n\n有少数脚本是在第一或第二年开始开发的 —— 即使现在，我几乎每天都会使用它们。\n\n对我来说，这是最令人鼓舞的。我知道我在编写\
    \ shell 脚本上付出的少许努力可以在未来几年里带来回报。\n\n这些 shell 脚本继续按照我编写它们的方式运行 —— 尽管我的 Linux 系统已经经历了\
    \ 22 多次重大更新。\n\n大多数更新都是以增量方式发生的，对我（Linux 用户）来说的影响微乎其微。最坏的情况下每隔几天或几周花一两分钟 —— 除非我选择升级到最新的\
    \ LTS 版本，如果有需要的话。\n\n我保留了一些 shell 脚本的代码片段或片段来帮助我编写其他脚本。例如，有一个名为 `start.sh` 的主脚本，它可以帮助我使用我偏好的框架开始编写几乎任何新的\
    \ shell 脚本。\n\n如果一个 shell 脚本需要执行大量工作，并需要为用户提供一个以上的选项，我将使用那个 `start.sh` 脚本，因为它包含了使用我偏好的\
    \ `getopt` 过程（而不是 `getopts`）来处理命令行选项的代码，并使用我信任了多年的 `bash` shell `while-do-done`\
    \ 循环方法来处理命令行参数列表。\n\n如果我发现自己自己在看几年前写的一个 shell 脚本，我会有其他的代码片段可以被读取到旧脚本中，帮助我将其更新为使用我最新的编码标准，并使用我随时间推移不断尝试改进更好的代码块。\n\
    \n在 Linux 中，有一个聪明的工具叫做 `shellcheck` —— 这是一个用于 sh/bash 脚本的静态分析和检查工具。\n\n我们可以在我们的脚本上运行\
    \ `shellcheck` 并遵循它给建议：\n\n```\n$ shellcheck td.sh\n```\n\n记住，没有消息就是好消息！\n\n我使用\
    \ `shellcheck` 来帮助我的 shell 脚本内容符合它提供的大多数建议 —— 除非我有充分理由使用对这些准则的任何个人变体。\n\n例如，在交互式脚本中，当我显示了想要他们阅读的信息后，需要提示用户按\
    \ `Enter` 键继续时 —— 我可以：\n\n```bash\nprintf \"Press the Enter key to continue: \"\
    \n# shellcheck disable=SC2034\nread -er Resp\n```\n\n如果没有 `# shellcheck disable=SC2034`\
    \ 注释行，`shellcheck` 程序将永远抱怨我在 `read` 命令中使用了未引用的变量 `Resp`。\n\n我所有的脚本需要的 —— 从用户处获取一个\
    \ `Enter` 键响应。\n\n阅读 `man bash`，`read` 命令可以在没有像 `Resp` 变量的情况下调用 —— 在那种情况下，用户的响应被赋值给名为\
    \ `REPLY` 的变量。\n\n我使用变量 `Resp` 是因为在某些情况下我想利用用户的响应 —— 当我要求用户从某个选择中指定一个时，我可以提示他们：\n\
    \n```bash\nprintf \"Continue (Y)es or (N)o?\"\nread -er Resp\ncase \"$Resp\" in\n\
    \    [Yy]*) ;;\n    [Nn]*) exit 0 ;;\n    ) exit 9 ;;\nesac\n```\n\n我并不总是想将该变量用于帮助我的脚本等待用户响应以外的任何事情，这是我的选择！\n\
    \n知道我可以在选择时帮助 `shellcheck` 程序忽略这一点，这很好。\n\n我非常高兴原始的 Bourne Shell (`sh`) 现在现在的\
    \ Bourne-again Shell (`bash`) 如此富有表现力，并且能够通过循环结构以及变量和文件处理功能来执行必要的条件逻辑测试，让程序员的生活变得更加高效。\n\
    \nshell 脚本并不是所有问题的答案 —— 有时我们需要使用更强大的解决方案。shell 脚本在强大的 Linux 内核提供的计算能力层与文件系统、进程这两个重要设计概念之间处于完美的平衡。\n\
    \n在 Linux 中，文件就是文件 —— 内容并并不重要。\n\n我们使用相同的 `ls`、`cp` 和 `mv` 等工具程序来处理音乐文件、PDF 文件和纯文本文件，而不需要太担心文件\
    \ —— 除非我们要听音乐、打印或显示 PDF 文件，或者拆解并重组可以是信件、备忘录或 shell 脚本的纯文本文件……\n\n强大的 Linux 系统为我们提供了数千\
    \ —— 是，数千资源，我们可以下载并使用它们处理我们可以想象的几乎每数据类型和内容。\n\n`Software Manager` 工具帮助我们在 Linux\
    \ PC 上安装新应用程序 —— 虽然我发现这个 GUI 程序比其他方法更难用。\n\n我的大脑无法很好处理大量的图标！\n\n多年来，我一直使用 `synaptic`（另一个\
    \ GUI）包管理器来帮助我的 Linux PC 查找并安装额外的软件。\n\n无论是播放音乐、管理 SQL 数据库、帮助我编程或写作或将数据从一种格式转换为另一种格式的应用程序\
    \ —— `synaptic` 都能轻松让我找到我需要的内容。\n\n例如 `ImageMagick` 命令行工具套件如 `convert` 可以帮助转换位图图像格式，并对图像进行*调整大小*、*模糊*、*裁剪*、*去噪*和*抖动*\
    \ ——\n\n或者 GUI `audacity` 程序帮助我编辑录制音乐的波形文件 (`*.wav`)。\n\n或者一个名为 `cmus` 的命令行程序帮助我从收藏的喜爱的歌曲和器乐曲中播放其他音乐\
    \ —— 有一个 `cmus-tutorial` 可以帮助我们在几分钟内入门。\n"
- fmt: '

    There are command-line programs like `apt` and `apt-get` and `dpkg` to help us
    install new software and to update the now installed software packages on our
    systems. Each of these has its own `man` page.


    The `synaptic` GUI is a front-end for the `apt` package management system.


    When I last checked, the categories of software packages from which we can choose
    to install programs and utilities with the `synaptic` package manager included
    these 55 items:


    > `Amateur Radio` and `Communications` and `Cross Platform` and `Databases` and
    `Debug` and `Development` and `Documentation` and `Editors` and `Education` and
    `Electronics` and `Email` and `Embedded Devices` and `Fonts` and `Games Amusement`
    and `GNOME` and `GNU R` and `Gnustep Desktop` and `Go Programming` and `Graphics`
    and `Haskell Programming` and `Internationalization` and `Interpreted Computer
    Languages` and `JAVA Programming` and `JavaScript Programming` and `KDE Desktop`
    and `Kernel and modules` and `Libraries` and `Lisp Programming` and `Localization`
    and `Mathematics` and `Meta Packages` and `Miscellaneous` and `Mono/CLI Infrastructure`
    and `Multimedia` and `Networking` and `Newsgroup` and `OCaml Programming` and
    `Perl Programming` and `PHP Programming` and `Python Programming` and `Ruby Programming`
    and `Rust Programming` and `Science` and `Shells` and `System Admin` and `TeX
    Authoring` and `Text Processing` and `Utilities` and `Version Control Systems`
    and `Video software` and `Web Servers` and `Word Processing` and `World Wide Web`
    and `Xfce Desktop` and the `Zope/Plone Environment`.


    There should be something of interest to most of us.


    ## Clear horizons

    In Linux it’s rare to get stuck with no way forward or no way out. We could need
    to read another part of a `man` page or debug a small piece of `bash` shell script
    code to help us make progress — it does not take long.


    We get better at this with practise. It provides stimulating reward for our intellect
    when we make progress — it’s fun.


    One of the most important items for me to remember is to produce adequate documentation
    describing why I have taken one path over another or what was the catalyst for
    my choice of using the method I did over other ways I might have pursued instead.


    It’s inevitable we will find a need to return to the snippets of code we write
    to solve a similar problem or build a bigger and better product with more features
    and enhancements — we need to have access to accurate and up to date documentation
    describing the parts we found awkward to solve or complete.


    I try to put lots of comments in my code.


    These do not slow down the execution of our code. As soon as the `bash` shell
    interpreter sees a hash (`#`) symbol it automatically skips the rest of the line
    — that’s a rapid operation.


    Start the comments in column one (1) or as the first item after blank space indentation(s)
    to help both our readability and the `bash` shell to decide `found a hash` — `skip
    to the next line!`


    Do not expect other people to figure out `why we did` what we did without a hint
    or two about the reasons that motivated or cemented our choice of one process
    or procedure over another.


    If ever we need to come back and revisit our own code — we will thank ourself
    it we left behind helpful comments to describe more of the fine details — what
    do those variable names mean?


    Supplementing our own growing list of resources — aliases or shell scripts or
    applications — we have access to thousands of packages and pieces of software
    we can install on our Linux PCs.


    If we do not like what we install — we can always run an `un-install` process.


    If ever the list of available Linux packages is insufficient — we have access
    to more resources from open software developers all around the world.


    A brief Internet search with selected keywords can produce more options to investigate
    within moments.


    We still need to follow Internet security guidelines and refrain from following
    links to insecure web pages — that’s common sense.


    For a part of my working life at a world class climate research group we needed
    to download and analyse an enormous volume (`terabytes`) of `netCDF` data files
    and use tools like the `cdo` — Climate Data Operators from the Max Planck Institute
    for Meteorology to help our scientists make sense of their comparisons of data
    from dozens of different weather models from other Meteorological sites around
    the world.


    Linux was more than up to the task as the operating of choice for the complex
    computational analyses we ran on supercomputers harnessing hundreds of compute
    nodes — each with dozens of CPU cores.


    For me Linux represents the best computer system I have ever used.


    To have Linux running on my own personal computer has provided me with an extraordinary
    functional capability above and beyond my computation needs — because it provides
    me with an almost endless toolbox of commands and utilities and applications I
    can use to solve my requirements for information handling.


    Using Linux is never a chore — it’s a delight.


    ## Using snippets

    I have mentioned my use of `snippets` of shell script code and code for other
    interpreted languages like Perl and Python and R.


    When I need to start a new script — I will often use one of my `starter` files
    named `start.{pl,py,R,sh,tcl}`.


    If I were to start from scratch every time would add a couple of hours or more
    to the development time. Small projects like these need thoughtful design and
    construction considerations.


    I’m a firm believer in using `snippets` anywhere I can — it’s not `exclusive`
    to programming. For example, if we need to construct a form letter or a memo or
    a routine report or any number of other documents where one version will appear
    `similar` to the next — with dates and times updated — with different name and
    address details — with different parameters and values — these can be prime candidates
    for the use of `snippets`.


    A memo needs a header with the `sender` and `recipient` details — plus current
    date andor time information. It will need the text for the body of the memo —
    other component parts as required. Each of these can get thought of as a `snippet`
    and could get handled by a `builder` script written in our preferred scripting
    language.


    An hour or two of work can help us produce a shell script to assemble a form letter
    or a memo that could need to get sent to tens or hundreds or thousands of recipients.
    After testing and any bug fixing — by the end of the day you could have something
    of use.


    The resulting shell script will often need more tweaks with time and usage and
    as the task requirements change or extend in the future. When the body of the
    document changes next month or next week or tomorrow we can substitute the updated
    body text and re-run the builder script to get the next document run — out the
    door.


    Other parts of such a system will generally need database maintenance to remove
    old contacts and add new contact details, etc. The database can be as simple as
    a plain text file or as complicated as an SQL or other dedicated database system.


    There is a need for an approvals process from management — for the project and
    associated scheduling of print runs and couriers and delivery services and other
    necessary control and management functions.


    No matter what my work involves — snippets of code and text often make my life
    easier.


    In my spare time I think I’ll try using snippets to help me construct more Lilypond
    music notation files to help me with my music.


    Another project for a rainy day!

    '
