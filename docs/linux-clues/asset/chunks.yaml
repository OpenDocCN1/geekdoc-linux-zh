  trans: '


    点击 `Terminal` 快速启动图标的鼠标左键即可为我启动一个实例。


    如果我们想要两个独立的 Terminal 窗口，可以鼠标右键点击快速启动中的 `Terminal` 图标，弹出一个小菜单，并选择 `New Window`（新窗口）选项。或者，在已打开的
    Terminal 窗口中，我们可以尝试输入三个组合键 — `{Ctrl}+{Shift}+{N}`。


    当我们打开一个 Terminal 窗口时，它的默认操作是运行一个 `bash` shell 的交互式实例 —— 显示在一个看起来是空白的窗口中，具有特定行数和默认宽度。初始为向下
    24 行，每行宽度为 80 个字符。


    尝试在 Terminal 窗口中运行这个 `seq` 命令 —— 它是数字“sequence”（序列）的缩写：


    ```bash

    $ seq 99 -1 2 {Enter}

    ```


    第一行显示的数字是行数——假设我们的 Terminal 少于 99 行。


    如果我们有一块大屏幕，在 Terminal 的启动偏选项中选择更多行数也是可以的——我倾向于在使用的情况下使用大约 40 行。


    查看菜单图标 —— 例如在 Terminal 窗口框架中有一个名为 `Preferences`（偏好）的“汉堡”图标。其他的 Terminal 窗口可能有一个带有
    `Preferences` 项目的 `Edit`（编辑）菜单。


    我的偏好行宽不超过 80 个字符，因为这有助于保持其他软件“正常运行”。


    我的大脑更倾向于阅读较短的行，而不是去理解长行中编写的内容。对我来说，那样效率更高。


    长行可能会在奇怪的地方折行，尝试读取那些折行的内容会变得很尴尬。


    我们可以用这个交互式 shell 做什么呢？


    我们已经在那里运行了 `date` 和 `ncal` 命令。


    这正是我花费大部分时间的地方。


    `man bash` 手页说它是一个“从标准输入或文件读取命令并执行命令的命令语言解释器”。


    什么是“标准输入”？


    默认情况下，这种输入来自我们的键盘 —— 无论我们在那里输入什么字符 —— 稍后会详细介绍。


    我们可以输入如 `ls` 的命令名称并按下 `{Enter}` 键：


    ```bash

    $ ls {Enter}

    ```


    输出可能如下：


    | `Desktop` | | `Music` | | `snap` |

    | :--- | :--- | :--- | :--- | :--- |

    | `Documents` | | `Pictures` | | `Templates` |

    | `Downloads` | | `Public` | | `Videos` |


    首次运行 Terminal 窗口时，它会在我们的 `home` 区域创建三个或四个额外文件。


    首次运行 Terminal 窗口时，它会在我们的 `home` 区域创建三个或四个额外文件。


    这些新文件命名为：


    * `.bash_history`

    * `.bash_logout`

    * `.bashrc`

    * `.profile`


    这些文件被 `bash` shell 使用。


    它们在哪里呢？它们没有在上面的 `ls` 命令的输出中出现！


    ### 隐藏文件


    注意那四个文件名以点（`.`）字符开头。


    我们称这些为“隐藏”文件，因为当我们运行不带任何选项或参数的 `ls` 命令时，隐藏文件不会显示 —— 这使得文件列表更整洁或更容易读。


    什么是 `option`（选项）或 `argument`（参数）？


    如果我们想看到那些隐藏文件，可以在 `ls` 命令名称后添加一个空格和选项 `-a`：


    ```bash

    $ ls -a {Enter}

    ```


    输出可能如下：


    | `.bash_history` | | `Downloads` | | `Public` |

    | :--- | :--- | :--- | :--- | :--- |

    | `.bash_logout` | | `Music` | | `snap` |

    | `.bashrc` | | `Pictures` | | `Templates` |

    | `Desktop` | | `.profile` | | `Videos` |

    | `Documents` | | | | |


    这很简单 —— `-a` 选项是“all”（全部）文件的缩写。


    另一种列出隐藏文件（s）的方法是将这些文件名作为一个或多个参数提供给 `ls` 命令：


    ```bash

    $ ls -a {Enter}

    ```


    （注：提供的文本在后半部分包含大量重复和乱码片段。我已根据提供的格式指令清理了核心技术内容。）


