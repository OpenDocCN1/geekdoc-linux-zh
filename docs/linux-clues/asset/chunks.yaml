- fmt: "\nIf we run the `ps` command twice we will see that the `PID` of the `ps`\
    \ process will be a *different* number. Notice the `PID` of the `bash` shell remains\
    \ the same.\n\nIf we have *another* Terminal window or Terminal tab available\
    \ and try typing the `ps` command in there we’ll notice the PIDs are different\
    \ again. Each Terminal window or Terminal tab gets its own *instance* of a bash\
    \ shell process.\n\n## Foreground .vs.  background\n\nUp to now the commands we\
    \ have been running in our Terminal window or Terminal tab have all been running\
    \ in what we call `foreground` mode.\n\nThe `bash` shell starts a new *process*\
    \ for the requested command and waits while the running command performs its action(s)\
    \ and produces its result(s) — after that the `bash` shell displays our next shell\
    \ prompt to indicate it’s ready for more instruction from us.\n\nThere’s another\
    \ way to run commands — in the background. To do that we append an ampersand (`&`)\
    \ symbol after the command we want to run that way. The difference is that the\
    \ `bash` shell will display our next shell prompt almost straight away and we\
    \ can then run another command.\n\nThere’s a command called `sleep` that accepts\
    \ a decimal number argument for the number of seconds we want that process to\
    \ *sleep*.\n\nWe can use that to find out a little more about background processes.\n\
    \nIf we run `sleep 10 &` and then within the ten seconds the command will *sleep*\
    \ we try running the `ps` command in normal foreground mode — once or twice —\
    \ in the same Terminal window or Terminal tab we can see what takes place:\n\n\
    ```\n$ sleep 10 &\n[1] 3955\n$ ps\n  PID TTY      TIME CMD\n  3120 pts/5    00:00:00\
    \ bash\n  3955 pts/5    00:00:00 sleep\n  3957 pts/5    00:00:00 ps\n$ ps\n  PID\
    \ TTY      TIME CMD\n  3120 pts/5    00:00:00 bash\n  3955 pts/5    00:00:00 sleep\n\
    \  3958 pts/5    00:00:00 ps\n[1]+  Done         sleep 10\n$\n```\n\nWe were able\
    \ to keep running the `ps` command in the *foreground* mode while the sleep process\
    \ continued running in the background — until it had counted off ten seconds and\
    \ then it gets terminated.\n\nWhen the `bash` shell *sees* the ampersand symbol\
    \ (`&`) it reports the *background* job number starting from `[1]` and its process\
    \ ID `3955` with the output `[1] 3955`.\n\nWhen the bash shell notices a background\
    \ process has terminated it reports that with the output `[1]+ Done` and the job’s\
    \ name `sleep 10`.\n\nWe can have different Terminal windows and other application\
    \ windows open in our computer login session.\n\nSome of those can be in either\
    \ *foreground* or *background* mode as we interact with them and then switch our\
    \ focus to another window.\n\nFor example we could have:\n\n*   a Terminal window\
    \ with extra `tabs` open\n*   a web browser session with tabs open in a Google\
    \ search for a piece of software and a Maps page to show how far we plan to drive\
    \ tomorrow and our social media Facebook page and . . .\n*   an email client application\
    \ like Thunderbird where we are in the middle of composing a reply to an email\
    \ message . . .\n*   a document open in `Libre Office Writer`\n*   a spreadsheet\
    \ open in `Libre Office Calc`\n*   an audio player presenting music we enjoy\n\
    *   and more `...`\n\nWhen a process completes its actions and returns any output\
    \ or error message to us — then the system tidies up and returns the resources\
    \ it used back into a pool of those available for the next process to consume.\n\
    \nIf we find the interactive response starts to get slow and sluggish — we could\
    \ need to get more RAM for our Linux PC or upgrade from spinning disk to SSD storage\
    \ to help improve performance.\n\nOtherwise we can remember to close down inactive\
    \ applications we do not need to have running at all times. Most of these can\
    \ get restarted in moments when we need them again.\n\n## Imagine a process\n\n\
    Here is one way we can imagine a *process*:\n\n```\n![](media/file1.png)\nimage\n\
    ```\n\nEvery process starts with three streams of input/output called:\n\n1. \
    \ `stdin` — mnemonic for “*Standard Input*”\n    *   file *descriptor* `0`\n2.\
    \  `stdout` — mnemonic for “*Standard Output*”\n    *   file *descriptor* `1`\n\
    3.  `stderr` — mnemonic for “*Standard Error*”\n    *   file *descriptor* `2`\n\
    \n## Process io handling\n\nEvery process starts with three streams of input/output\
    \ called:\n\n1.  `stdin` — mnemonic for “*Standard Input*”\n    *   file *descriptor*\
    \ `0`\n2.  `stdout` — mnemonic for “*Standard Output*”\n    *   file *descriptor*\
    \ `1`\n3.  `stderr` — mnemonic for “*Standard Error*”\n    *   file *descriptor*\
    \ `2`\n\n## Command syntax\n\nEvery process starts with three streams of input/output\
    \ called:\n\n1.  `stdin` — mnemonic for “*Standard Input*”\n    *   file *descriptor*\
    \ `0`\n2.  `stdout` — mnemonic for “*Standard Output*”\n    *   file *descriptor*\
    \ `1`\n3.  `stderr` — mnemonic for “*Standard Error*”\n    *   file *descriptor*\
    \ `2`\n\n## Redirect append mode\n\nEvery process starts with three streams of\
    \ input/output called:\n\n1.  `stdin` — mnemonic for “*Standard Input*”\n    *\
    \   file *descriptor* `0`\n2.  `stdout` — mnemonic for “*Standard Output*”\n \
    \   *   file *descriptor* `1`\n3.  `stderr` — mnemonic for “*Standard Error*”\n\
    \    *   file *descriptor* `2`\n"
