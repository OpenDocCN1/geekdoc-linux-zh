    > `$ less hst.txt`


    > `  999  man printf`


    > ` 1000  sudo synaptic`


    > ` 1001  tb`


    > ` 1002  pwd`


    > ` 1003  owl powerful`


    > `...`


    As expected, that looks like a *history* list.


    At the start (left side) of each line there’s a *history* command *number* then
    the *command* *name* and any command *options* and/or *arguments*.


    I used a one line AWK script to extract the *second* argument on each line saving
    those into another file named ‘`hst-cmds.txt`’ — this will contain the list of
    command names — one on each line:


    > `$ awk ’{print $2}’ hst.txt > hst-cmds.txt`


    Use the ‘`wc -l`’ command to count the number of lines in these two generated
    files — there should be the same number of *lines* in each file:


    > `$ wc -l hst.txt hst-cmds.txt`


    > ` 937 hst.txt`


    > ` 937 hst-cmds.txt`


    > `1874 total`


    That’s what I hoped to see.


    Inspected the first 5 lines of file ‘`hist-cmds.txt`’:


    > `$ head -5 hist-cmds.txt`


    > `man`


    > `sudo`


    > `tb`


    > `pwd`


    > `owl`


    That is what I expected — a list of command names.


    Next I used a small Perl script called ‘`count.pl`’ (you can find the code for
    this in a later chapter) to count the numbers of times each command gets called
    — thought I’d use the script for a practical task:


    > `$ count.pl hst-cmds.txt > hst-ctrs.txt`


    Inspected a small sample of lines from that output file:


    > `$ head -20 hst-ctrs.txt | tail -5`


    > `bnchk                   6`


    > `c                      13`


    > `c3                     35`


    > `cal                     1`


    > `cat                    34`


    Command names at the left side and counts of the number of times the item occurs
    in the history list on the right side.


    Thought I’d check those first five commands too:


    > `$ for c in man sudo tb pwd owl ; do`


    > `> grep "^$c" hst-ctrs.txt`


    > `> done`


    > `man                    51`


    > `sudo                    4`


    > `tb                     12`


    > `pwd                    20`


    > `owl                     8`'
