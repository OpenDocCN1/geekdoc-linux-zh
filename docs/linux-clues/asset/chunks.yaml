- fmt: '

    If we attempt to use those meta-characters in the names of our files then trying
    to specify those names on the command-line can get more difficult.


    We need to make use of another meta-character (the backslash character) to hide
    the command-line meaning of that character and other meta-characters we sprinkle
    though our file names!


    I find that to be a waste of time and effort — when with a moment or two of thought
    I could come up with a shorter and easier to type file name which means almost
    the same.


    Does it matter? It matters to me — but then we know I am different in my own ways.


    If I work on a project that `requires` long-winded file names I would rather use
    my own short file names on `internal` processing and convert my short file names
    to the long file names the project `requires` — as I ship those out the door.


    A line or two of shell script code will often do the trick.


    What others choose to do is their business.


    A blank space character is one of the characters we must either `elide` through
    the use of a backslash prefix or must remember to enclose a file name with any
    embedded blank space in quote characters like:


    ```

    $ cat ’another blank space file name’

    ```


    Otherwise we could drop the two matching right single quote characters and insert
    four backslash characters — one at the left side of each blank space character!


    A better method — to my way of thinking is to use the `tr` command to help `translate`
    the blank space characters into the hyphen or dash (`-`) character when I want
    a long and more descriptive file name:


    ```bash

    $ fnam=$(echo long file name.txt | tr " " "-")

    $ echo "$fnam"

    long-file-name.txt

    ```


    Then I can use the shell variable `fnam` in commands to help me with tasks such
    as editing or copying and using the file:


    ```bash

    $ vim $fnam

    . . .

    $ cp $fnam ~/txt

    ```


    What this means to me is that we can save ourself a lot of angst if we refrain
    from using certain characters in our file names.


    The three types of quote characters (left, right and double) all have special
    meaning to the shell.


    A semi-colon character (`;`) is a command separator. If we used that in a file
    name it would need special handling.


    We have seen other meta-characters that have special meaning to the shell — i/o
    redirection characters (`<` and `>`) and shell comment characters (`#`) and parentheses
    and curly braces and square brackets and the dollar symbol (`$`) and the like
    — each have more meaning in the bash shell.


    If we attempt to use those in our file names we will cause ourselves more pain
    than good.


    For my file names I choose to use the ASCII decimal digits `0` through `9`, the
    characters `A` through `Z` and lower-case `a` through `z` plus the symbols hyphen
    or dash (`-`) and the underscore (`_`) then a dot (`.`) to separate the file name
    from the file type — like `.py` or `.sh` or `.txt`, etc.


    On occasion I will add the use of a plus symbol (`+`) or a comma symbol (`,`)
    for certain files.


    I do not find using those 67 characters too limiting. I do know they have saved
    me from a lot of file name handling heart ache.


    Using the `bc` (binary calculator) tool — here I calculate I could generate this
    number of unique 15 character file names:


    ```bash

    $ bc

    67^15

    2461059085914092013369600043

    {Ctrl}+{D}

    ```


    Will this be enough? Not every one of those will be `useful` — I hope you get
    my drift.


    If I were to limit the characters I use to 5 instead of 67 — I could generate
    `3051758125` unique 15 character names!


    If I were to use three (3) character in any position of my 15 character names
    I could still generate `1438907` unique file names.


    I could use each character to represent a project code or a data code or processing
    stage or result code — and I am not limited to 15 characters! It’s to the user.
    It’s best to document what we do.


    I can use the dash (`-`) and underscore (`_`) in place of using space characters.
    The end result is almost as readable with minimal. I am not averse to using `camelCase`
    in file names, too:


    ```bash

    $ sort bigData.txt > bigData.txt

    ```


    If I am honest with myself I prefer `camelCase` or hyphenated words over `snake_case`
    for most of my names — but that is my choice. People are different — we have every
    right to be. Following these simple guidelines for naming my files works for me


    ## File links


    When talking about metadata the system keeps for our files I mentioned that the
    first character on each line of output from `ls -l` command could be a dash (`-`)
    for ordinary file, or one of the characters `d` for directory or `c` for special
    file or `l` for symbolic link.


    There’s two types of links — hard links and symbolic links.


    What’s the difference? What is a symbolic link? A command called `ln` — mnemonic
    for link makes a `link` to an existing file. Why would we want a `link` to a file?


    One reason is to let us access to a file by a different name — or within a different
    directory. The syntax for an `ln` command is either:


    ```bash

    $ ln -s sourceFile destFile

    ```


    Or:


    ```bash

    $ ln -s sourceFile destDir

    ```


    We use the `-s` option to make a symbolic link to the source file instead of a
    so-called hard link. Those `sourceFile`, `destFile` and `destDir` parts could
    need to get written as absolute paths to the object(s) — for brevity I’ll use
    relative paths here. Let’s make a file to play with:


    ```bash

    $ man ln > ln.txt

    $ ls ln.txt

    -rw-r----- 1 3891 Jul 18 19:47 ln.txt

    ```


    Let’s make a hard link to that file:


    ```bash

    $ ln ln.txt hard-ln.txt

    $ ls ln.txt

    rw-r----- 2 3891 Jul 18 19:47 hard-ln.txt

    rw-r----- 2 3891 Jul 18 19:47 ln.txt

    ```


    Notice the second item on the `ls -l` output is now `2` for each file — that’s
    the number of links to the file. They point to one and the same file system object.
    How do we know that? Let’s use the `-i` option with the `ls` command to display
    the "inode" numbers for these file system objects:


    ```bash

    $ ls -i ln.txt

    32098 -rw-r----- 2 3891 Jul 18 19:47 hard-ln.txt

    32098 -rw-r----- 2 3891 Jul 18 19:47 ln.txt

    ```


    Identical `inode` numbers! These file system objects have different name entries
    — yet point to the same `inode` data structure in the file system — where the
    file system stores its metadata about how it can provide access for the file to
    which it points.


    What happens if we use the `-s` option and make a symbolic link to `ln.txt`:


    ```bash

    $ ln -s ln.txt slnk-ln.txt

    $ ls -i ln.txt

    32098 -rw-r----- 2 3891 Jul 18 19:47 hard-ln.txt

    32098 -rw-r----- 2 3891 Jul 18 19:47 ln.txt

    32936 lrwxrwxrwx 1 6 Jul 18 20:07 slnk-ln.txt -> ln.txt

    ```


    The symbolic link has a different `inode` number. The entry starts with the character
    `l` (ell) instead of a dash (`-`) and the file name detail points (`->`) to or
    is linked to the original file `ln.txt` — it has a name that’s 6 bytes in length
    as reflected by the number `6` in column 4.


    Does the symbolic link know we appended the date string onto the file to which
    it points:


    If we append extra text — such as the `date` string onto the end of the original
    file `ln.txt`:


    ```bash

    $ date >> ln.txt

    $ ls -i ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 hard-ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt

    32936 lrwxrwxrwx 1 6 Jul 18 20:07 slnk-ln.txt -> ln.txt

    ```


    Notice the update in file size and time change information for both the original
    file and the hard link. The symbolic link has not changed.

