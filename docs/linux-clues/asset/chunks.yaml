- fmt: '

    Links provide us with a method of referring to a file by another name and/or from
    an entry in another directory if we want.


    We can make useful links to files as needed.


    A hard link makes a new named entry in a directory in the file system that points
    directly to the `inode` of a pre-existing file object in the file system tree.


    A symbolic link makes a new named entry in a directory in the file system that
    points to a `file name` or `file path` of a pre-existing file object in the file
    system tree — at first the difference appears subtle.


    What happens if we rename or move these links or the original file to which they
    point?


    ### Renaming the hard and soft links:


    ```bash

    $ mv hard-ln.txt mhard-ln.txt

    $ mv slnk-ln.txt mslnk-ln.txt

    $ ls -igo *ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mhard-ln.txt

    32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt -> ln.txt

    ```


    Using `wc -c` to check the resolved object sizes:


    ```bash

    $ wc -c *ln.txt

    3921 ln.txt

    3921 mhard-ln.txt

    3921 mslnk-ln.txt

    11763 total

    ```


    They all got read and look the correct size.


    ### What if we rename the original file:


    ```bash

    $ mv ln.txt mln.txt

    $ ls -igo *ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mhard-ln.txt

    32098 -rw-r----- 2 3921 Jul 18 20:44 mln.txt

    32936 lrwxrwxrwx 1    6 Jul 18 20:07 mslnk-ln.txt -> ln.txt

    ```


    Using `wc -c` to check the resolved object sizes:


    ```bash

    $ wc -c *ln.txt

    3921 mhard-ln.txt

    3921 mln.txt

    wc: mslnk-ln.txt: No such file or directory

    7842 total

    ```


    Ouch! The symbolic link gets broken when we rename the file to which it was linked.


    To fix the symbolic link we can either rerun `ln` to make a new symbolic link
    pointing to the renamed file — or we could move the renamed file back to its original
    name:


    ```bash

    $ mv mln.txt ln.txt

    $ wc -c *ln.txt

    3921 ln.txt

    3921 mhard-ln.txt

    3921 mslnk-ln.txt

    11763 total

    ```


    A symbolic link is an entry in a directory that points to a file name that existed
    with that name when the symbolic link got made — that’s all.


    If that file name exists the symbolic link is useful. If that file name gets renamed
    or moved the symbolic link gets broken!


    A hard link is an entry in a directory that points to the same inode as another
    pre-existing file. Even if we rename or move or remove the original file the hard
    link is still pointing to the same inode.


    When the last link to a file’s inode gets removed then it no longer exists.


    ### Why would we want to use a symbolic link?


    Hard link objects must exist in the same file storage device.


    Soft (symbolic) links can cross file storage device boundaries — they could point
    to object names that exist on an external storage device — when those get connected
    to our computer for use.


    ### Why would we want to use a hard link?


    As we can observe above — a hard link to an existing file points to the same inode.
    Although it appears to show the same amount of file space size this is the file
    size of the original file.


    File links can make a lot of sense when we need to deal with data files that require
    megabytes or gigabytes of storage size.


    Instead of having two separate copies of that we can make a hard link to the real
    data file. The impact on the file system is one more entry in the file system
    tree that points to a pre-existing inode.


    The amount of space taken up by that depends on the block size used by our file
    system. That could be 2k, 4k or 8k bytes, etc., rather than more megabytes or
    gigabytes to store an entire copy of a file.


    I hope that made some sense.


    # Regular expressions


    There’s another flexible filter command called `grep` — mnemonic for *global regular
    expression print* — that’s a bit wordy.


    `grep` searches for `patterns` called `regular expressions` in files.


    What is a regular expression?


    Regular expressions are flexible character patterns that can match one or more
    strings of text.


    Ken Thompson, one of the two principal authors and designers of Unix, is accredited
    with adding regular expression pattern matching search capability into the editor
    `ed` — that we could have used to write our small `td.sh` shell script — back
    a chapter or two.


    A command we can use in the `ed` and `ex` and `vim` editors is `g/re/p` where
    the `re` part is one of these regular expressions.


    The `g` — mnemonic for *global* means across the entire width of each line.


    The `p` — mnemonic for *print* means display those lines that contain any match
    to the `re` — regular expression we supply.


    This is where the `grep` filter got its name.


    A regular expression can be as simple as one or two characters or a word — or
    as complex as a conglomeration of pattern matching characters and repetition counts
    — as we will soon see below.


    ## A simple grep


    If we wanted to extract the `games` directories from our `PATH` variable we can
    use the `grep` filter to extract those by adding another section to our `bash`
    history command pipeline:


    ```bash

    $ !1234 | sort | grep games

    /usr/games

    /usr/local/games

    ```


    This adds another pipe (`|`) symbol after the `sort` command and feeds the output
    from `sort` straight into the standard input of `grep` asking it to match lines
    containing the simple pattern `games` — success.


    You may recall the history command number `1234` started with:


    ```bash

    $ echo "$PATH" | tr ":" "\n"

    ```


    If the original command output is extensive it could be more efficient to add
    the `grep` command first and then pass the reduced output to the `sort` command:


    ```bash

    $ !1234 | grep games | sort

    /usr/games

    /usr/local/games

    ```


    For such a small sample it makes no noticeable difference.


    Can you see the power and flexibility built into Unix and now Linux commands with
    the ability to pipe commands together in the `bash` shell?


    It’s almost like playing with a child’s building blocks.


    Imagine the fun I have been every day!


    We could redirect that pipeline output into a new file or append it to the end
    of an existing file we need to finish.


    **Note:** There’s one or two subtle differences between `bash` shell command--
    patterns and the class of patterns called regular expressions used by the `grep`
    command.


    Regular expressions are more flexible by a long stretch.


    There’s a lot of similarity in the ideas between the two.


    One exception is the question mark (`?`) character — in `grep` patterns we use
    a dot (`.`) character *instead* — to mean *any single character*.


    Why? Because in RE (regular expression) syntax the question mark (`?`) character
    got used to represent either zero or one of the previous character or entire RE
    enclosed in parentheses.


    Another exception is the asterisk (`*`) character.


    To represent zero or more repetitions of any character in `grep` patterns we need
    to use a two character RE that has a dot paired with an asterisk (`.*`) — with
    practise we soon get used to these and other differences.


    ## RE syntax


    The `man` page for the `grep` command contains detailed descriptions about how
    its regular expressions can get constructed by us to match and find almost any
    string of characters we can imagine.


    Search for ‘REGULAR EXPRESSIONS’ in the man page.


    The second sentence in that section reads:

