    \ *parsing* the command lines we give it to run for us. We read ‘`expansion`’\
    \ is performed on the command line after it has been *split* into words.\n\nThere\
    \ are seven (7) kinds of *expansion* performed and the order of these expansions\
    \ is:\n\n> `brace` expansion;\n\n> `tilde` expansion;\n\n> `parameter` *and* `variable`\
    \ expansion;\n\n> `arithmetic` expansion;\n\n> `command` `substitution` (done\
    \ Left to Right);\n\n> `word` `splitting`; and\n\n> `pathname` expansion.\n\n\
    That sounds rather complex!\n\n## Brace expansion\n\nBrace expansion is a mechanism\
    \ by which arbitrary strings can get generated. For example, ‘`a{d,c,b}e`’ expands\
    \ into ‘`ade ace abe`’.\n\nI used one of these brace expansions in a previous\
    \ chapter when making my ‘`dev/{py,sh}`’ and ‘`src/{py,sh}`’ directories.\n\n\
    ## Tilde expansion\n\nIn Tilde expansion an unquoted tilde character (`~`) gets\
    \ replaced with the *value* of the shell variable or parameter named ‘`HOME`’.\n\
    \n## Dollar expansion\n\nA dollar (`$`) character introduces `parameter` expansion,\
    \ `command` substitution, or `arithmetic` expansion.\n\n## Parameter expansion\n\
    \nHere are three (3) variants of this:\n\n> `${parameter}`\n\n> — The value of\
    \ `parameter` is substituted.\n\n> \n\n> Example:\n\n> \n\n> > `$ echo \"$HOME\"\
    `\n\n> \n\n> `${parameter:-word}`\n\n> — Use *default* values. If parameter is\
    \ unset or null, the expansion of ‘`word`’ gets substituted. Otherwise, the value\
    \ of parameter gets substituted.\n\n> \n\n> Example:\n\n> \n\n> > `$ echo \"${myVar:-42}\"\
    `\n\n> \n\n> `${#parameter}`\n\n> — The *length* in characters of the *value*\
    \ of `parameter` gets substituted.\n\n> \n\n> Example:\n\n> \n\n> > `$ echo \"\
    ${#myVar}\"`\n\n> \n\n> — There’s 15+ other parameter expansion methods.\n\n>\
    \ — See: ‘`man bash`’ and search for ‘`Parameter Expansion`’\n\n## Command substitution\n\
    \n> `$(command)`\n\n> — Command substitution allows the `standard output` of a\
    \ command to replace the specified command.\n\n> \n\n> Example:\n\n> \n\n> > `$\
    \ day=$(date +%A) ; wd=$(date +%u)`\n\n> > `$ echo $day is week day number $wd`\n\
    \n## Arithmetic expansion\n\n> `$((expression))`\n\n> — Arithmetic expansion allows\
    \ the *evaluation* of an arithmetic expression and the substitution of the result.\n\
    \n> \n\n> Example:\n\n> \n\n> > `$ w=$((365 / 7)) ; d=$((365 % 7))`\n\n> > `$\
    \ echo \"A year has $w weeks and $d day\"`\n\n> \n\n> — See: ‘`man bash`’ and\
    \ search for ‘`Arithmetic Expansion`’ and the term ‘`ARITHMETIC EVALUATION`’\n\
    \n## Process substitution\n\nWhen available, process substitution gets performed\
    \ simultaneously with parameter and variable expansion, command substitution,\
    \ and arithmetic expansion."
