    \ to construct that small shell script like this — it’s not difficult:\n\n> `$\
    \ ed`\n\n> `a`\n\n> `#!/usr/bin/bash`\n\n> `echo`\n\n> `printf \"Today is \"`\n\
    \n> `date +\"%A %F\"`\n\n> `echo`\n\n> `.`\n\n> `wq td.sh`\n\nApart from my shell\
    \ prompt (‘`$`’) type each line as it appears and press the `Enter` key at the\
    \ end of the line(s).\n\nThe ‘`a`’ on the line by itself is an ‘`ed`’ *append*\
    \ command.\n\nNext we enter those five shell script lines.\n\nThe dot (‘`.`’)\
    \ on the line by itself is the ‘`ed`’ command for *end of input* and *revert to\
    \ command mode*.\n\nThe ‘`wq`’ line is an ‘`ed`’ command to get it to *write*\
    \ (‘`w`’) to the specified file (‘`td.sh`’) and then ‘`quit`’ (‘`q`’) back to\
    \ the shell.\n\nWhen we complete the last line it should output the number of\
    \ characters (‘`59`’) it writes to the file ‘`td.sh`’ and then display our next\
    \ shell prompt.\n\nRemember we can use the ‘`cat`’ and ‘`od -c`’ commands to examine\
    \ the file content in detail — does it look identical to my five lines?\n\nThe\
    \ documentation for the GNU ‘`ed`’ command gets maintained in the ‘`info`’ utility\
    \ and we can read its *info* pages by running:\n\n> `$ info ed`\n\nWell worth\
    \ a read one day if we have the time.\n\nThe GNU ‘`ed`’ editor is a replication\
    \ of the original Unix line editor of the same name.\n\nThat 55 year old software\
    \ logic still works with the same perfection today!\n\nOne way to run our new\
    \ ‘`td.sh`’ shell script is this:\n\n> `$ bash td.sh`\n\n> `.` `.` `.`\n\nThere’s\
    \ a better way.\n\n## Using chmod\n\nNext we need to ensure we use the ‘`chmod`’\
    \ command — mnemonic for ‘*change mode*’ to give our shell script ‘`execute`’\
    \ permission:\n\n> `$ chmod u+x td.sh`\n\nThe argument ‘`u+x`’ means *add* the\
    \ ‘`x`’ permission bit for the *user* who owns the specified file.\n\nWe can test\
    \ our shell script from where we write it by then typing the command:\n\n> `$\
    \ ./td.sh`\n\nThe leading dot (‘`.`’) and forward slash (‘`/`’) characters instruct\
    \ the ‘`bash`’ shell running in our Terminal to search for the shell script ‘`td.sh`’\
    \ in our *current* working directory.\n\n> **Note:** A single dot (`.`) is short-hand\
    \ for the *current* directory.\n\n> \n\n> Two dots (`..`) is short-hand for the\
    \ *parent* directory.\n\n> \n\n> If we ‘`cd`’ into a sub-directory and want to\
    \ return to the *parent* directory we can run ‘`cd ..`’ to get back there again\
    \ — that can be most helpful at times.\n\nWhen we approve of the script’s run\
    \ time activity we can move or copy it across to our own ‘`bin`’ directory.\n\n\
    How do we do that?\n\n## Copy, move, remove\n\nLinux has commands named:\n\n>\
    \ `cp` — mnemonic for ‘*copy*’ a file\n\n> `mv` — mnemonic for ‘*move*’ (or rename)\n\
    \n> `rm` — mnemonic for ‘*remove*’ (or delete)\n\nThe syntax for the ‘`cp`’ and\
    \ ‘`mv`’ commands is:\n\n> `$ cp [-opts] source destination`\n\n> `$ mv [-opts]\
    \ source destination`\n\nUnless we know for certain we will *not* want to make\
    \ any more updates or enhancements to our shell script (for the moment, at least)\
    \ it’s best to use a copy process.\n\nAssuming we constructed the ‘`td.sh`’ script\
    \ in our ‘`$HOME`’ directory we can copy that to our own ‘`bin`’ directory with:\n\
    \n> `$ cd`\n\n> `$ cp -p -i td.sh bin`\n\nThe ‘`-p`’ option given to the ‘`cp`’\
    \ command instructs it to copy the same *permissions* over to the target file\
    \ we deposit in our ‘`$HOME/bin`’ directory.\n\nWithout using the ‘`-p`’ option\
    \ the target file *could* lose that important ‘`execute`’ permission bit we set\
    \ with the ‘`chmod`’ command."
