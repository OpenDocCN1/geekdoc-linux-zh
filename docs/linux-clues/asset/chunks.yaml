- fmt: '

    To re-run the `previous` command with a change from an `old` string to a `new`
    string we can type a `caret` or `circumflex` (or `pointy hat`) symbol (`^`) then
    the `old` `string` followed by another `caret` or `circumflex` (or `pointy hat`)
    symbol (`^`) and the `new` `string`:


    > `^oldStr^newStr`


    For example:


    > `$ lwss file1.txt file2.txt`


    > `Command ’lwss’ not found, . . .`


    > `$ ^ws^es`


    > `less file1.txt file2.txt`


    > `. . .`


    My fumble fingers again — fixed with seven (7) key strokes instead of 25 (including
    the `{Enter}` key).


    These `bash` shell history list and command-line short-hand methods get my resounding
    `tick` of approval.


    Every second or two of saving counts in my favour!


    ## Alias commands


    The ‘`bash`’ shell provides a method to let us use what it calls ‘aliases’.


    Run the `alias` command to show a list of any that are already defined:


    > `$ alias`


    > `alias l=’ls -CF’`


    > `alias la=’ls -A’`


    > `alias ll=’ls -alF’`


    > `alias ls=’ls --color=auto’`


    These `alias` definitions came with my new Ubuntu 24.04.2 Linux installation.
    They have existed in Linux for years.


    Read `man ls` to discover what those options like `-A` and `-C` and `-F` and the
    `verbose` option `--color=auto` mean.


    If we find the colours in `ls` output difficult to discern we could run the command:


    > `$ unalias ls`


    I prefer to read black `printed` text on a white page of paper — and white text
    in a dark gray (not quite black) Terminal window — I know — I’m `different`!


    We can add a `-p` option when we run the `ls` command to get it to append a `/`
    indicator character to the end of directory names.


    On a more permanent basis we would need to investigate Terminal color schemes
    and/or comment-out that alias for `ls` in our `.bashrc` file.


    The `alias` mechanism is straight. We use the command name `alias` followed by
    an `alias definition` consisting of an `alias name` of our choosing then the equals
    (=) symbol and a quoted `command` string.


    It’s often best to use Right single quotes around the command string — if we need
    to use double quotes inside the command.


    If we define a new alias with the same name as an existing one then the new definition
    overwrites the old alias — it’s best to check.


    We can type the `alias` command followed by the new alias `name` we want to use.
    If that is not yet defined we will see:


    > `$ alias tryMe`


    > `bash: alias: tryMe: not found`


    It’s wise to also run the `type` command to check there is no other `command`
    or `script` with the same name:


    > `$ type tryMe`


    > `bash: type: tryMe: not found`


    Otherwise we will see the named `alias` definition:


    > `$ alias ll`


    > `alias ll=’ls -alF’`


    Or using the `type` command we could see a shell `builtin` or an `alias` or a
    `command` or a `script` — if it pre-exists:


    > `$ type ll`


    > `ll is aliased to ‘ls -alF’`


    ## Add an alias


    Let’s try adding an alias called `a` to run that `alias` command. Remember to
    check first:


    > `$ type a`


    > `bash: type: a: not found`


    That’s good — we can use `a` for our new `alias`:


    > `$ alias a=alias`


    Try out the new `a` command.


    An `alias` is not limited to running `one` command!


    We can use the semi-colon (;) `command separator` character and define an `alias`
    to run a `series` of commands:


    > `$ type c3`


    > `bash: type: c3: not found`


    > `$ alias c3="clear;echo;ncal -b -3"`


    > `$ c3`


    > `...`


    I hope you like the result.


    The pair of double quote (`"..."`) characters around the `alias` command definition
    is necessary because of the list of commands and the blank space characters in
    the last `ncal` command.


    We want the whole right side to get assigned to the alias name `c3`.


    We could prefer the output without giving the `-b` option to `ncal`:


    > `$ type n3`


    > `bash: type: n3: not found`


    > `$ alias n3="clear;echo;ncal -3;echo"`


    > `$ n3`


    > `...`


    I used `ncal` in both aliases because it highlights the current day!


    Imagine the possibilities — we can define our own `aliases` to do almost anything.


    There’s one drawback with using the `alias` command in this way from our interactive
    shell — when we exit the Terminal window or logout from Linux those new aliases
    will disappear.


    All is not lost. There’s one or two ways to make these permanent.


    One possibility is to save a list of the aliases we have defined into a plain
    text file.


    The next time we login again we can restore those pre-recorded aliases using a
    `source` command.


    It takes a bit of editing — and remembering to run `source`.


    We can use another more automated technique I will talk about in the next section.


    ## Bash shell startup


    Here I want to make a more detailed inspection of what is happening when we start
    working in a Terminal window.


    On the Ubuntu 24.04.2 Linux system the default Terminal window is part of the
    GNOME user environment (unless we have changed that).


    The executable program is `gnome-terminal`. When it gets run by us it starts an
    interactive instance of the `bash` shell for us to work in.


    Other types of Terminal window like the KDE `Konsole` or the LXDE `LXTerminal`
    and the older `xterm` variations work in a similar vein.


    The `man bash` documentation pages contain information that implies:


    > “When bash is invoked as an interactive login shell, it first reads and executes
    commands from the file `/etc/profile`, if that file exists. After this it looks
    in the user’s home directory for the files `.bash_profile` and `.bash_login` and
    `.profile` in that order and reads and executes commands from the first one that
    exists and is readable.”


    When we ran the `ls -a` command in our `home` directory:


    > `$ cd`


    > `$ ls -a`


    > `...`


    > `$`


    We found we had a file named `.profile` in there and from what we read above about
    the `bash` shell `invocation` (start up) we expect the commands in that file to
    get read when our Terminal window starts — because (for me) that uses an interactive
    login shell.


    On my system I had neither of the other two files: `.bash_profile` or `.bash_login`
    mentioned in the invocation note.


    If we examine the `.profile` file we find it contains instructions to read commands
    from the hidden file we used with the `ls -l` command.


    If we examine the `.bashrc` file we find it contains instructions to read commands
    from another file named `.bash_aliases` — if that file exists.


    Again — all bit convoluted for most of us.


    In my new Ubuntu 24.04.2 installation the file named `.bash_aliases` did not yet
    exist.


    We can use that file (`.bash_aliases`) to prove to ourself that the interactive
    `bash` shell in our Terminal window does get initialised in the way text in the
    `man bash` manual pages describe.


    Why is that important?


    The `.bash_aliases` file is a great place to start adding our own `alias` command
    definitions — like `a` and `c3` and `n3`.


    Is there already a `.bash_aliases` file in your `$HOME` directory?


    Please run:


    > `$ cd`


    > `$ ls .bash_aliases`


    > `ls: cannot access ‘bash_aliases’:`


    > `No such file or directory`


    If you see the `No such file or directory` message then that looks okay — the
    file does not yet exist.


    **Note:** If you have already used the `.bash_aliases` file — please make a backup
    copy of that:


    > `$ cd`


    > `$ cp -i .bash_aliases .bash_aliases-old`


    If you have the time and/or interest, stick with me and run or try to read through
    the next five (5) sets of commands — as an experiment.


    Let’s use the `type` command to check to see if we already have a command named
    `h` — it should fail:


    > `$ type h`


    > `bash: type: h: not found`


    > `$`


    The error message displayed before the next system prompt (`$`) tells us we do
    not have any command named `h`.


    Next let’s make our own command called `h` to run the `history` command with that
    single key `h` — and the Enter key.

