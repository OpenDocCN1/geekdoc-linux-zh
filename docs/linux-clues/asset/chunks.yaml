    # 更多 Linux 命令


    Linux 系统提供了数百个命令，来帮助我们完成想象的任何任务。虽然其中任何一个命令都无法完成我们脑海中的所有工作 —— 但我们看到有很多方法组合这些命令来产生有用结果。


    ## 过滤器 head & tail


    如果我们需要处理大型文本文件，那么像 `head` 和 `tail` 命令这样的工具就可以帮助我们处理这些文件的选部分。尽管我们最终想处理整个文本数据 ——
    但通常可以提取文件的样本来帮助测试 shell 脚本或其他程序。


    假设我们有一个包含两个三百行 —— 或数千行的文件。我们可以使用 `head` 命令来查看该文件的前二十行：


    ```bash

    $ head -20 big-file.txt

    ```


    要获取第二组二十行，我们可以运行：


    ```bash

    $ head -40 big-file.txt | tail -20

    ```


    我们可以对第三组、第四组和第六组二十行运行类似的命令。我们可以将这些文件段重定向到系列名为 `t1.txt`、`t2.txt`、`t3.txt` 等的测试文件中：


    ```bash

    $ head -20 big-file.txt > t1.txt

    $ head -40 big-file.txt | tail -20 > t2.txt

    $ head -60 big-file.txt | tail -20 > t3.txt

    ```


    当我们在 `bash` 命令的交互行末尾添加反斜杠符号作为`last`字符并按回车键时，`bash` shell 会换到下一行并插入大于符号（`>`），以提示并提醒它正在等待我们的更多输入。


    **注意：** 我们必须在这些行尾的反斜杠后不添加任何空格以使其生效 —— 否则 `bash` shell 在发出下一个提示之前会用“No such file
    or directory”的错误信息向我们抱怨。反斜杠后跟着空格看起来像是一个以单个空格命名的文件 —— 我们用反斜杠进行了引用。糟糕！


    ## 过滤器 cmp & diff


    我们可以使用 `cmp` 命令（`compare` 的缩写）和 `diff` 命令（`differences` 的缩写）来确保我们不会反复使用相同的测试数据。


    如果两个文件相同，`cmp` 命令将没有任何输出 —— 记住，`no news` 就是 `good news` —— 成功 —— 没有差异。


    如果文件在任何方面存在差异，`cmp` 将在发现的差异点处提示：


    ```bash

    $ cmp t1.txt t2.txt

    t1.txt t2.txt differ: byte 1, line 1

    ```


    我们可以使用 `diff` 命令更详细地显示差异：


    ```bash

    $ diff t1.txt t2.txt | less

    ...

    ...

    ```


    查看 `man diff` 以了解 `diff` 输出的解释。


    ## 过滤器 tac & rev


    `tac`（反向 `cat`）和 `rev`（反转 `line` 中的字符）过滤器是不寻常工具工具有时可以使用。


    在第 7 章中，我们使用两个 `echo` 命令写入一行，然后将另一行追加到我称为 `out.txt` 的小文件中：


    ```bash

    $ echo "first out" > out.txt

    $ echo "next out" >> out.txt

    $ cat out.txt

    first out

    next out

    ```


    使用 `tac` 将反转行的顺序。在 `out.txt` 上运行 `tac` 命令的结果如下：


    ```bash

    $ tac out.txt

    next out

    first out

    ```


    使用 `rev` 将反转每行文本字符的顺序。在 `out.txt` 上运行 `rev` 命令的结果如下：


    ```bash

    $ rev out.txt

    tuo tsrif

    tuo txen

    ```


    这些命令没有改变文件 `out.txt` 的内容：


    ```bash

    $ cat out.txt

    first out

    next out

    ```


    我们可以使用 `out.txt` 或任何其他纯文本文件来说 `tac` 和 `rev` 过滤器是如何工作的：


    ```bash

    $ tac out.txt | rev | tac | rev > out.trtr

    $ ls -go out.txt out.trtr

    -rw-r----- 1 19 Jun 27 16:14 out.trtr

    -rw-r----- 1 19 Jun 27 16:01 out.txt

    ```


    运行并重复这些命令 —— 以任何顺序都应该重现原始。输出文件的大小相同 —— 这是一个良好的开始。


    ```bash

    $ cmp out.txt out.trtr

    ```

