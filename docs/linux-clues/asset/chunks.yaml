    \ of numbers in a Terminal window:\n\n```bash\n$ seq 99 -1 2 {Enter}\n```\n\n\
    The number displayed on the top line is the number of lines — assuming our Terminal\
    \ has less than 99 lines.\n\nIf we have a large size screen it’s okay to select\
    \ more lines in the Terminal’s start up preference options — I tend to use about\
    \ 40 lines if I can.\n\nSee if there’s a menu icon — like the “hamburger” icon\
    \ with an item called `Preferences` in the frame of our Terminal window. Other\
    \ Terminal windows could have an `Edit` menu with the `Preferences` item.\n\n\
    My preference is to use no more than the 80 characters for the line width because\
    \ this can help to keep other pieces of software “happy”.\n\nMy brain prefers\
    \ to read shorter lines instead of unravelling what got written in longer lines.\
    \ For me that is more productive.\n\nLonger lines can get wrapped at odd places\
    \ and attempting to read those wrapped lines can get awkward.\n\nWhat can we do\
