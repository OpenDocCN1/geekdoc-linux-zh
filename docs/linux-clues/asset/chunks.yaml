- fmt: '

    Lines 6 to 8 use a `for` loop to access each value from the `@wrds` list or array
    — one at a time into Perl special variable `$_`.


    Line 7 uses the value in `$_` as the `index` into a new `associative` array (or
    `hash`) called `%count` and increments (`++`) the value of that array element
    `$count{$_}` for each `word` that’s in the `@wrds` list/array.


    The last three lines comprise another `for` loop to access a sorted list of the
    `keys` or `indices` of the whole `%count` associative array (or `hash`) that got
    constructed in lines 6 to 8.


    Line 11 displays the values of this `for` loop’s Perl special variable `$_` and
    the associated value of the indexed items from the `hash` elements (`$count{$_}`).


    Running this on my small shell script `td.sh`:


    ```bash

    $ ./count.pl td.sh

    "              1"

    "Today            1"

    "#!/usr/bin/bash      1"

    "%F"             1"

    +"%A             1"

    "date              1"

    "echo              2"

    "is                1"

    "printf            1"

    ```


    Nothing over exciting to see here — except a count of `2` for `echo`.


    The script counts space separated `words` in its input from the file or `redirected`
    input specified on the command line.


    The script can also take input from a `pipeline` or from a redirected (`<`) input
    file or command substitution output — all because of the Perl `(<>)` `diamond`
    operator.


    This small script’s idea of a `word` is any string of non-blank characters — not
    always too helpful. The script could get extended to treat punctuation characters
    as word separators.


    The documentation for Perl gets split into dozens. See `man perl` and `man perldoc`
    for even more reading. To read about Perl’s special `$_` you could run:


    ```bash

    $ perldoc -v $_$ perldata

    ```


    # More Linux commands


    The Linux system provides us with hundreds of commands to help us in any task
    we imagine. While any one of those commands does not perform all of what we can
    have in mind — we have seen there are ways we can combine these commands to produce
    useful results.


    ## Filters head & tail


    If we need to handle large text files then find tools like `head` and `tail` commands
    can come to help us deal with selected parts of those files. Although ultimately
    we want to handle entire text data — we can often extract a sample of the file
    to help us test shell script or other program.


    Imagine we have a file containing two three hundred lines — or thousands of lines.
    We can use the `head` command to examine the first twenty lines of that:


    ```bash

    $ head -20 big-file.txt

    ```


    To get the second set of twenty lines we can run:


    ```bash

    $ head -40 big-file.txt | tail -20

    ```


    We can run similar commands for the third and fourth and sixth groups of twenty
    lines, etc. We could redirect those file segments into a series of test files
    named `t1.txt`, `t2.txt`, `t3.txt`, etc.:


    ```bash

    $ head -20 big-file.txt > t1.txt

    $ head -40 big-file.txt | tail -20 > t2.txt

    $ head -60 big-file.txt | tail -20 > t3.txt

    ```


    When we add the backslash symbol as the `last` character on an interactive line
    of `bash` commands and press the `Enter` key the `bash` shell will wrap onto the
    next line and insert the `greater-than` symbol (`>`) to prompt and remind us it’s
    expecting more input from us.


    **Note:** we must add no space after those line ending backslash to make this
    work — otherwise the `bash` shell will complain to us with an error message “No
    such file or directory” before it issues our next prompt. A backslash followed
    by a blank space would look like a file named with a single blank space — we have
    quoted with the backslash. Bleah!


    ## Filters cmp & diff


    We can use the `cmp` command — mnemonic for `compare` and the `diff` command —
    mnemonic for `differences` to ensure we do not use the same test data over and
    again.


    If two files compare the same the `cmp` command will give no output — remember
    `no news` is `good news` — success — there’s no difference.


    If the files differ in any way then `cmp` will make some noise at the first point
    of departure it finds:


    ```bash

    $ cmp t1.txt t2.txt

    t1.txt t2.txt differ: byte 1, line 1

    ```


    We can use the `diff` command to display the difference(s) in more detail:


    ```bash

    $ diff t1.txt t2.txt | less

    ...

    ...

    ```


    See `man diff` for an explanation of the output from `diff`.


    ## Filters tac & rev


    The `tac` (reverse `cat`) and `rev` (reverse the characters across a `line`) filters
    are unusual tools that can get used at times.


    Back in chapter 7 we used two `echo` commands to write one line and then append
    another line into a small file I called `out.txt`:


    ```bash

    $ echo "first out" > out.txt

    $ echo "next out" >> out.txt

    $ cat out.txt

    first out

    next out

    ```


    Using `tac` will reverse the order of the lines. Here is the result of running
    the `tac` command on `out.txt`:


    ```bash

    $ tac out.txt

    next out

    first out

    ```


    Using `rev` will reverse the order of the text characters across each line. Here
    is the result of running the `rev` command on `out.txt`:


    ```bash

    $ rev out.txt

    tuo tsrif

    tuo txen

    ```


    Those commands did not change the content of the file `out.txt`:


    ```bash

    $ cat out.txt

    first out

    next out

    ```


    We can use `out.txt` or any other plain text file to illustrate how good the `tac`
    and `rev` filters do their job:


    ```bash

    $ tac out.txt | rev | tac | rev > out.trtr

    $ ls -go out.txt out.trtr

    -rw-r----- 1 19 Jun 27 16:14 out.trtr

    -rw-r----- 1 19 Jun 27 16:01 out.txt

    ```


    Running and repeating those commands — in any order should reproduce the original
    text. The output files have the same size — that is a good start.


    ```bash

    $ cmp out.txt out.trtr

    ```

