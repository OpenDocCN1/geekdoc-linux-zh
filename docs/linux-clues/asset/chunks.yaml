    If I don’t act now the fleeting idea will evaporate. I switch to another Terminal
    `tab` and add that important note. Then I revert to what I was working on before.


    Later in the day Heather — my charming wife gets home from a shopping run with
    receipts from the supermarkets the chemist and the bakery.


    I use my mouse device — to shift focus to another Terminal `tab` and proceed to
    enter the main details of those receipts by running my `bills` shell script —
    it takes a minute or two at most and then I switch `tab` again to get back to
    where I was and resume what I was doing — easy.


    ## Customised commands


    ### What is a “shell script?”


    Linux includes so-called programmable `shell` programs and one of those got called
    `bash` — mnemonic for the “Bourne-again Shell.”


    Stephen R. Bourne played an enormous part in developing his Bourne shell program
    `sh` on Unix to help users get more done with less effort.


    Like `sh` the `bash` shell is both interactive and programmable and can get instructed
    to perform conditional tests for the existence of expected file system objects
    and pass those across to the program processes we need to run to get the results
    we want to achieve. Brilliant.


    When we work in a Terminal window there’s an instance of a shell like `bash` running
    in that and interpreting the commands we enter.


    Instead of typing the same commands over and over we can instruct the shell to
    run a series of shell commands we have saved in a plain text file we call a “shell
    script”.


    For any work that involves a repetition of tasks, why not write a shell script
    to run those steps in the correct order — every time?


    A shell script can start from a simple one or two lines of shell commands through
    to hundreds of lines of code to help with more complex tasks — work your way up
    to more complexity.


    That’s not as difficult a task as it may sound — and it brings with it a great
    sense of achievement. It’s most satisfying.


    Before long we realise we have saved hours of time that it takes to forever re-enter
    command sequences or worse — push a mouse around our desktop to get a one-size-fits-all
    application to do a task is was never designed to achieve.


    Over the course of a year that can amount to an enormous saving.


    ## More than text


    Linux is not restricted to running everything in a Terminal window. We can install
    and run other application programs to help us do almost anything.


    In my spare time I like tinkering with snippets of my own music in programs like
    the `lilypond` music notation system or `lmms` — a DAW (Digital Audio Workstation)
    that includes a Song Editor, a Beat+Bassline Editor, a Piano Roll, and an FX Mixer
    with instruments and effects.


    We can install dozens of Games like `Chess` or `Mahjongg` or `Sudoku` or `Tetravex`
    and others — its even fun to install a module called `bsdgames` and take a look
    at the original `adventure` game!


    We can install Graphics utilities like `Dia` or `GIMP` or `Graphviz` or `InkScape`.


    We can install applications like `Pix` and `Shotwell` and others to help us organise
    our collections of photo images.


    Install audio applications like `Audacity` or `Clementine` or `Rhythmbox` or the
    `VLC media player`.


    Install a selection of modules from the `R` system for statistical computation
    and graphics with its `R Commander` interface and explore the trends or distributions
    in our data.


    Install the full suite of LibreOffice programs `Base`, `Calc`, `Draw`, `Impress`,
    `Math` and `Writer` and work in those — it’s our choice.


    **Note:** The LibreOffice applications can read most files like `.docx` and others
    from similar external systems.


    When we combine applications like these and the powerful Terminal window with
    its interactive and programmable shell interface we get what — I believe — is
    the best computing platform ever.


    # Looking at Linux


    If we have installed Linux on our PC, then when we reboot the PC it will either
    start Linux or it could provide an option to choose Linux or our previous system
    if we chose to install Ubuntu alongside our pre-existing operating system.


    During the installation process we got prompted to provide a user name and select
    an account password for security sake. We need to remember those details to gain
    access to the new Ubuntu installation — if we chose the option to `Require my
    password to login`.


    When we type in our correct password then the Ubuntu login process will provide
    access to our own “home” area in the Linux file system.


    On first time entry there’s not a lot of personal files with a fresh install.
    There’s hundreds of system files like executable programs and software library
    files and documentation files to read — as the need arises.


    After login we could see a pop up dialog window called the `Software Updater`.
    It reports `There is updated software available for this PC`. It has buttons labeled
    `Remind Me Later` or `Update Now`.


    If we have two or three minutes to spare it’s a good idea to select the `Update
    Now` button. On occasion we could need to re-boot our PC to complete the software
    update.


    Updates include security patches or feature improvements and/or bug fixes for
    the software already installed in our Linux distribution. Ubuntu recommends we
    let these update run. In Ubuntu we can see a task bar across the top and a quick
    menu down the left.


    Hovering the mouse pointer over an item left side will display its name.


    At the bottom left side is an item called `Show Apps`. If we mouse left side click
    on that we will see a selection of the Ubuntu has loaded.


    Try other items — like LibreOffice Calc and Writer if you have not seen those.


    ## Open a terminal


    Find the Terminal icon in `Show Apps` area and run that. This opens up a blank
    window with a prompt waiting for us to enter.


    **Note:** The first time I ran a Terminal on my fresh install of Ubuntu 24.04
    it gave me an important reminder:


    ```

    To run a command as administrator (user "root"), use sudo <command>. See "man
    sudo_root" for details.

    ```


    That `sudo_root` man page explains a bit about how Ubuntu gets configured and
    is worth reading — one day.


    That `sudo_hint` message gets generated when the `bash` shell reads the `/etc/profile`
    file and that in turn reads the `/etc/bash.bashrc` file.


    The first time we use the `sudo` command with success — it makes a new file in
    our home directory called `.sudo_as_successful` and that prevents us seeing that
    `sudo_hint` message after that.


    Sounds a bit convoluted — the Linux developers have their reasons for doing that
    — do not get too concerned.


    Getting back to the Terminal window — type in word `date` and press the `Enter`
    key.


    ```

    $ date

    ```


    Don’t type the dollar symbol (`$`) it represents the visible prompt in my Terminal
    window session.


    I hope the `date` command gave a useful response.


    Type in `ncal` and press the `Enter` key.


    ```

    $ ncal

    ```


    There’s also an older `cal` version that displays the short day names across the
    top instead of down the left side — each has its uses for me.


    I like having quick access to a Terminal window. I open one or two from the moment
    after I sign in and in general these stay open until I log out and shut down my
    PC at night.


    To get that rapid access I went to the `Show Apps` items again. Found the Terminal
    application and used a mouse right side button click to pop up a small menu that
    includes a `Pin to Dash` item and selected that.


    The next time I signed into my Linux system there was a new item in the quick
    start list at the left side called `Terminal`. That quick start list gets called
    the `Dash`.

