- fmt: "\nAgain the last line shows how we can redirect the output from an entire\
    \ `for-do-done` loop into another file — `hst-rs.all`.\n\nThe output is:\n```bash\n\
    $ cat hst-rs.all\n```\n`a -> 324`\n`c -> 411`\n`i -> 9`\n`s -> 188`\n`x -> 5`\n\
    \nUsing another small `awk` script to total the sum of those numbers:\n```bash\n\
    $ awk '{ttl = ttl + $3 + 0} END {print ttl}' hst-rs.all\n```\n`937`\n\nWe could\
    \ use `bc` to check the sum of those:\n```bash\n$ bc\n324 + 411 + 9 + 188 + 5\n\
    937\n```\n\nUsing `bc` to check the average percentage of command calls:\n```bash\n\
    $ bc\nscale=2\n324 * 100 / 937\n34.58\n411 * 100 / 937\n43.86\n9 * 100 / 937\n\
    0.96\n188 * 100 / 937\n20.06\n5 * 100 / 937\n0.53\n```\n\nThe `bc` calculator\
    \ handles integer and floating-point arithmetic. The `scale=2` command sets the\
    \ output to use two (2) decimal point accuracy. It can handle any precision you\
    \ could need. There’s a total 0.01% rounding down error in the calculations —\
    \ I think I will ignore that. The approximate ratios in which I run either a Linux\
    \ command or a `bash` shell alias or one of my scripts is about 44 to 35 to 20\
    \ — that is for every 44 standard Linux commands I run, I will run 35 `bash` shell\
    \ aliases and another 20 of my (`perl`, `python`, `R`, `shell` or `tcl`) scripts\
    \ — plus another command line test or error. I used twelve (12) intermediate and/or\
    \ temporary files in this process:\n```bash\n$ ls -g hst\n```\n`-rw-r---- 1 20016\
    \ Jun 27 09:33 hst.txt`\n`-rw-r---- 1 13457 Jun 27 09:57 hst-clns.txt`\n`-rw-r----\
    \ 1 4729 Jun 27 09:58 hst-cmds.txt`\n`-rw-r---- 1 2600 Jun 27 10:13 hst-ctrs.txt`\n\
    `-rw-r---- 1 2800 Jun 27 10:32 hst-ctrs.ed`\n`-rw-r---- 1 48 Jun 27 14:04 hst-ctrs.nlns`\n\
    `-rw-r---- 1 644 Jun 28 09:37 hst-ctrs.ed,a`\n`-rw-r---- 1 1036 Jun 28 09:37 hst-ctrs.ed,c`\n\
    `-rw-r---- 1 140 Jun 28 09:37 hst-ctrs.ed,i`\n`-rw-r---- 1 140 Jun 28 09:37 hst-ctrs.ed,x`\n\
    `-rw-r---- 1 840 Jun 28 09:37 hst-ctrs.ed,s`\n`-rw-r---- 1 46 Jun 28 13:31 hst-ctrs.all`\n\
    ```\nThe options `-g` given to the `ls` command get it to list the file information\
    \ without showing the file owner and group identifiers (to save line space) and\
    \ to get the list of files in reverse time order with the newest files last.\n\
    \nMost of the separate processes I have shown could get encapsulated into a shell\
    \ script. Some of these could get piped together to make composite commands feeding\
    \ the output of one stage into the next. In that way we could do away with most\
    \ of those files — or at least tidy up afterwards by removing the non essential\
    \ (generated) files — all except for the input file: `hst.txt`. I’ll leave that\
    \ as an exercise for the reader!\n\nWhen working on a different project the mix\
    \ of commands I use can change — depending on the tasks involved. My working environment\
    \ has over 400 alias definitions. Most of these run one or two commands — on average.\
    \ The aliases I write often come in groups to help me with a particular category\
    \ of work — for example software development for bash shell programming or for\
    \ python programming or for Lilypond music programming tasks or for my writing\
    \ tasks.\n\nMy script programs range from short ones with four or five lines to\
    \ others.\n\n## Brace expansion\nBrace expansion is a mechanism by which arbitrary\
    \ strings can be generated. For example, `a{d,c,b}` expands into `ade ace`. I\
    \ used one of these expansions in making `dev/{py,sh}` and `src/{py,sh}` directories.\n\
    \nWait, \"The approximate ratios in which I run either a Linux command or a `bash`\
    \ shell alias or one of my scripts is about 44 to 35 to 20 — that is for every\
    \ 44 standard Linux commands I run, I will run 35 `bash` shell aliases and another\
    \ 20 of my (`perl`, `python`, `R`, `shell` or `tcl`) scripts — plus another command\
    \ line test or error.\"\n\n## Tilde expansion\nIn Tilde expansion an unquoted\
    \ tilde character (`~`) gets replaced with the value of shell variable or parameter\
    \ named `HOME`.\n\n## Dollar expansion\nA dollar (`$`) character introduces `parameter`\
    \ expansion, `command` substitution, or `arithmetic` expansion.\n\n## Parameter\
    \ expansion\nHere are three variants of this:\n- `${parameter}`: The value of\
    \ `parameter` is substituted.\n  Example:\n  ```bash\n  echo \"$HOME\"\n  ```\n\
    - `${parameter:-word}`: Use default values. If parameter is unset or null, the\
    \ expansion of `word` gets substituted. Otherwise, the value of parameter gets\
    \ substituted.\n  Example:\n  ```bash\n  echo \"${myVar:-42}\"\n  ```\n- `${#parameter}`:\
    \ The length in characters of the value of `parameter` gets substituted.\n  Example:\n\
    \  ```bash\n  echo \"${#myVar}\"\n  ```\n— There’s 15+ other parameter expansion\
    \ methods. — See: `man bash` and search for `Parameter Expansion`.\n\n## Command\
    \ substitution\n`$(command)` — Command substitution allows the `standard output`\
    \ of a command to replace the specified command.\nExample:\n```bash\nday=$(date\
    \ +%A) ; wd=$(date +%u)\necho \"$day is week day number $wd\"\n```\n\n## Arithmetic\
    \ expansion\n`$((expression))` — Arithmetic expansion allows the evaluation of\
    \ an arithmetic expression and the substitution of the result.\nExample:\n```bash\n\
    w=$((365 / 7)) ; d=$((365 % 7))\necho \"A year has $w weeks and $d day\"\n```\n\
    — See: `man bash` and search for `Arithmetic Expansion` and the term `ARITHMETIC\
    \ EVALUATION`.\n\n## Process substitution\nWhen available, process substitution\
    \ gets performed simultaneously with parameter and variable expansion, command\
    \ substitution, and arithmetic expansion.\n"
