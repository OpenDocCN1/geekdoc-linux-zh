  trans: '


    `-i` 选项——`interactive`（交互式）的记忆符——会让 `cp` 在目标文件已存在时向我们警告。我们可以选择覆盖现有文件，也可以完全停止进程。


    如果我们选择在 `$HOME/dev/sh` 下的新开发目录中构建那个 `td.sh` 壳脚本——假设我们现在就在那里工作——我们可以通过以下命令将其复制到我们自己的
    `bin` 目录：


    ```bash

    $ cp -p -i td.sh $HOME/bin

    ```


    或者：


    ```bash

    $ cp -p -i td.sh ~/bin

    ```


    我们可以在 `bash` shell 中使用波浪号（`~`）元字符作为 `$HOME` 目录的快捷。


    请注意，如果我们在波浪号周围加上引号，shell 将不会展开它！请看以下结果：


    ```bash

    $ echo ~

    /home/clu

    ```


    以及：


    ```bash

    $ echo "~"

    ~

    ```


    使用 `mv` 命令，我们发现它没有 `-p` 选项——因为它会将文件的位置连同文件权限一起移动到目标文件或目录。


    如果我们决定重命名壳脚本以便调用为 `today`，我们可以在使用 `type` 命令检查后执行此操作：


    ```bash

    $ type today

    bash: type: today: not found

    ```


    这是可以免费使用的。现在重命名脚本：


    ```bash

    $ mv -i td.sh today

    ```


    或者甚至：


    ```bash

    $ mv -i td.sh ~/bin/today

    ```


    下次我们登录 Linux 系统时，我们应该发现仍然可以通过输入它的名称来运行新的 bash 壳脚本——而无需告诉 shell 去哪里寻找它：


    ```bash

    $ td.sh

    ```


    或者：


    ```bash

    $ today

    ```


    如果我们选择了重命名脚本的话。


    尝试运行 `type td.sh`。


    Linux 在我们背后做了很多工作——例如在后台通过查找我们的 `PATH` 变量来定位我们尝试运行的命令名称。


    当我们决定一个文件不再需要时——在使用 `rm` 命令删除它之前，我们应该三思一下：


    ```bash

    $ rm td.sh

    ```


    当一个文件被删除时——它就永远消失了。


    我经常会创建一个 `junk` 目录并将代码碎片移动到那里，直到我确定那里的代码碎片已被拒绝且不再需要保留——然后我可以进行清理：


    ```bash

    $ rm -i ~/junk/*

    ```


    以移除我已经处理完的部分。


    我倾向于编写大量的代码片段，以帮助向自己证明我想使用的代码将按照我希望和预期的方式运行。


    我不认为这是在浪费时间和精力——相反，它为以后节省了几个小时的调试时间——因为随着脚本规模增大和复杂性增加，调试过程会变得更加困难。


    我的工作方法之一是“写两个”并“丢弃一个”。


    我并不总能在第一次尝试就得到最佳解决方案。


    对代码片段进行实验并制作几个版本的脚本，让我有时间评估我编写的代码，完善我的工作并选择最佳的选项（们）。


    在一天或两天的时间内，最好的代码片段会被选中并进入我预期的完成并发布的最终候选脚本中。


    如果我正在对现有的脚本进行修改，我发现测试一小段代码更好，这可以让我证明一种新方法或处理变量、文件或逻辑测试的方式——确保我的代码将按照我设想的方式运行——在我尝试将其整合到现有脚本之前。


    假设我正在为我的名为 `abc.sh` 的脚本添加新功能，并且我在当前目录下有它的副本。我在一个名为 `frag.3` 的文件中有一段代码片段，我想将其添加到
    `abc.sh` 的第 147 行之后。可以通过运行以下命令来确定行号：


    ```bash

    $ cat -n abc.sh | less

    ```


    使用 `vim` 编辑器，我可以这样做：


    ```bash

    $ vim abc.sh

    147G

    :r frag.3

    :wq

    abc.sh

    ```


    这运行 `vim` 来打开我的脚本副本进行编辑。接下来它通过 `G` 直接将光标移动到第 147 行——Go to line number 的记忆符。第三行将
    `frag.3` 读取到打开的脚本中，并放在第 147 行下方。第四行运行写入（`w`）和退出（`q`）命令，将修改保存到 `abc.sh` 并退出 `vim`
    编辑器。最后一行运行当前目录版本的 `abc.sh`，查看更新代码是否有效。


    修改后的脚本有效吗？如果失败，bash shell 将报错！更新是否按我希望的方式运行了？这需要通过对 `abc.sh` 进行一些测试来检查新代码在应该调用时是否被调用。在发布我们的脚本和其他程序之前，没有进行足够的测试是不好的——而且大部分测试需要尽快完成——而不是等到我们需要为了截止日期将更新投入生产环境时。


    # 工作分析


    在写书的一部分时检查 `history` 列表中的命令活动，似乎我运行了 37 个位于 `/usr/bin` 的标准 Linux 命令，同时我还运行了 30
    个我自己的脚本并运行了 23 个自己的 shell 别名。这些命令和脚本在几天或几周内根据需要运行，帮助我完成我想做的事。数据还显示我运行了 5 个交互 shell
    代码片段，并发生了 5 次不同的命令输入错误——我的手指——年龄增长的迹。我是如何知道这些细节的？以下是我所做的。我将当前的 `history` 列表复制到一个文件中：


    ```bash

    $ history > hst.txt

    ```


    有多少行 `history` 数据？使用 `wc -l` 命令计算行数：


    ```bash

    $ wc -l hst.txt

    937 hst.txt

    ```


    检查文件内容以查看每行的结构：


    ```bash

    $ less hst.txt

    999 printf

    1000 sudo

    1001 tb

    1002 pwd

    1003 owl

    ...

    ```


    如预期的，这看起来是一个历史列表。在每行的开头（左侧）是历史命令编号，然后是命令名称以及任何命令选项和/或参数。我使用单行 awk 脚本提取每行的第二个参数，并将它们保存到另一个名为
    `hst-cmds.txt` 的文件中——这包含包含命令名称列表——每行一个：


    ```bash

    $ awk ''{print $2}'' hst.txt > hst-cmds.txt

    ```


    使用 `wc -l` 命令计算这两个生成文件的行数——每个文件中的行数应该是相同的：


    ```bash

    $ wc -l hst.txt hst-cmds.txt

    937 hst.txt

    937 hst-cmds.txt

    1874 total

    ```


    这正是我希望看到的。检查文件 `hist-cmds.txt` 的前 5 行：


    ```bash

    $ head -5 hist-cmds.txt

    man

    sudo

    tb

    pwd

    owl

    ```


    这就是我预期的——一个命令名称列表。接下来我使用一个名为 `count.pl` 的小型 Perl 脚本（你可以在后面的章节找到它的代码）来统计每个命令被调用的次数——我想用这个脚本完成实际任务：


    ```bash

    $ count.pl hst-cmds.txt > hst-ctrs.txt

    ```


    检查该输出文件的一小样本行：


    ```bash

    $ head -20 hst-ctrs.txt | tail -5

    bnchk          6

    c              13

    c3             35

    cal            1

    cat            34

    ```


    左侧是命令名称，右侧是该项目在历史列表中出现的次数。我想也检查一下前五个命令：


    ```bash

    $ for c in man sudo pwd owl ; do

    > grep "^$c" hst-ctrs.txt

    > done

    man            51

    sudo           4

    tb             12

    pwd            20

    owl            8

    ```


