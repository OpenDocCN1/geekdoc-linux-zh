    — and 10 sundry items.


    These are the numbers in each command *category* I chose to encode with characters
    (`a`, `c`, `i`, `s` and `x`) — and they each have *different* names.


    Using another small AWK script to total the sum of those numbers:


    > `$ awk ’{ttl = ttl + $3 + 0}`


    > `> END {print ttl}’ hst-ctrs.nlns`


    > `100`


    That looks okay.


    We could use ‘`bc`’ to check the total:


    > `$ bc`


    > `23 + 37 + 5 + 30 + 5`


    > `100`


    > `{Ctrl}+{D}`


    Check! These agree.


    Pressing the control code ‘`{Ctrl}+{D}`’ tells the ‘`bc`’ command we have finished
    giving it input and gets it to exit and let the bash shell give us the next shell
    prompt.


    Otherwise we could always do a little mental arithmetic.


    The list of 37 standard Linux commands in that `history` sample is:


    > `$ awk ’print $2’ hst-ctrs.ed,c |`


    > `> column -c 50`


    > `audacity   epubcheck  ps`


    > `bc         factor     pwd`


    > `cal        file       rm`


    > `cat        grep       shopt`


    > `cd         history    stat`


    > `chmod      imgsize    sudo`


    > `cmp        ispell     tac`


    > `convert    less       tkdiff`


    > `cp         ls         tree`


    > `diff       man        type`


    > `echo       mkdir      which`


    > `einfo      mv`


    > `eog        perldoc`


    Strictly speaking the commands: ‘`cd`’, ‘`echo`’, ‘`history`’, ‘`pwd`’, ‘`shopt`’
    and ‘`type`’ are `bash` shell *builtins* — more Linux commands to me.


    I run most of those *aliases* and *commands* and shell *scripts* throughout almost
    every day or week to help me with the work I’m doing.


    Can I estimate the frequency with which I run either an *alias* or a standard
    Linux *command* or one of my *scripts*?


    Let’s inspect the numbers emitted by ‘`count.pl`’ that got collected into the
    file ‘`hst-ctrs.ed`’ and separate those according to the command codes I inserted
    at the start of each line of data:


    > `$ for ch in a c i s x ; do`


    > `> grep` `"^$ch"` `hst-ctrs.ed > hst-ctrs.ed,$ch`


    > `> done`


    Again the ‘`for`’ loop cycles through those five command category codes one at
    a time calling ‘`grep`’ to locate *lines* that start with these characters using
    a *pattern* that is *anchored* to the start (left side) of each line by using
    the *caret* or *circumflex* or *pointy-hat* character *first*.


    The collections of such lines ‘`grep`’ finds get redirected into output files
    named with a trailing comma (`,`) and the value of the ‘`for`’ loop’s control
    variable ‘`$ch`’ to generate five new file names.


    Checking the number of lines in each of these output files:


    > `$ wc -l hst-ctrs.ed,?`


    > ` 23 hst-ctrs.ed,a`


    > ` 37 hst-ctrs.ed,c`


    > `  5 hst-ctrs.ed,i`


    > ` 30 hst-ctrs.ed,s`


    > `  5 hst-ctrs.ed,x`


    > `100 total`


    Those numbers agree with what the ‘`grep -c`’ command gave when I ran that above
    on the whole ‘`hst-ctrs.ed`’ file.


    Using ‘`cat`’ to examine one of the smaller files;


    > `$ cat hst-ctrs.ed,i`


    > `i d=$((365                1`


    > `i day=$(date              5`


    > `i day=4                   1`


    > `i w=$((365                1`


    > `i wks=52                  1`


    Column three at the right side contains the command count numbers.


    Using another command code character loop to call a two line AWK script to total
    up the sum of those numbers in column 3:


    > `$ for ch in a c i s x ; do`


    > `> printf "%s –> " "$ch"`


    > `> awk ’{ttl = ttl + $3 + 0}`


    > `> END {print ttl}’ hst-ctrs.ed,$ch`


    > `> done > hst-ctrs.all`


    The addition of zero (‘`0`’) to the value of the third field (‘`$3`’) from each
    line coerces the value to a *number* instead of the default which is a *string*
    — an important point to remember when using AWK.


    The ‘`END {...}`’ clause gets run after all the lines get read and the value in
    variable ‘`ttl`’ includes the summation or total of all those command usage count
    numbers.


    The AWK code gets run on each of those new files named with the trailing comma
    and one of the five codes.'
