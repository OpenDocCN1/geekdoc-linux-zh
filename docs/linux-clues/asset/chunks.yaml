    After testing and any bug fixing — by the end of the day you could have something
    of use.


    The resulting shell script will often need more tweaks with time and usage and
    as the task requirements change or extend in the future.


    When the body of the document changes next month or next week or tomorrow we can
    substitute the updated body text and re-run the builder script to get the next
    document run — out the door.


    Other parts of such a system will generally need database maintenance to remove
    old contacts and add new contact details, etc.


    The database can be as simple as a plain text file or as complicated as an SQL
    or other dedicated database system.


    There is a need for an approvals process from management — for the project and
    associated scheduling of print runs and couriers and delivery services and other
    necessary control and management functions.


    No matter what my work involves — snippets of code and text often make my life
    easier.


    In my spare time I think I’ll try using snippets to help me construct more Lilypond
    music notation files to help me with my music.


    Another project for a rainy day!'
