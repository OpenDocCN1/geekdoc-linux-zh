    \ — in the same Terminal window or Terminal tab we can see what takes place:\n\
    \n> `$ sleep 10 &`\n\n> `[1] 3955`\n\n> `$ ps`\n\n> `  PID TTY         TIME CMD`\n\
    \n> ` 3120 pts/5   00:00:00 bash`\n\n> ` 3955 pts/5   00:00:00 sleep`\n\n> ` 3957\
    \ pts/5   00:00:00 ps`\n\n> `$ ps`\n\n> `  PID TTY         TIME CMD`\n\n> ` 3120\
    \ pts/5   00:00:00 bash`\n\n> ` 3955 pts/5   00:00:00 sleep`\n\n> ` 3958 pts/5\
    \   00:00:00 ps`\n\n> `[1]+  Done         sleep 10`\n\n> `$`\n\nWe were able to\
    \ keep running the ‘`ps`’ command in the *foreground* mode while the sleep process\
    \ continued running in the background — until it had counted off ten seconds and\
    \ then it gets terminated.\n\nWhen the `bash` shell *sees* the ampersand symbol\
    \ (‘`&`’) it reports the *background* job number starting from ‘`[1]`’ and its\
    \ process ID ‘`3955`’ with the output ‘`[1] 3955`’.\n\nWhen the bash shell notices\
    \ a background process has terminated it reports that with the output ‘`[1]+ Done`’\
    \ and the job’s name ‘`sleep 10`’.\n\nWe can have different Terminal windows and\
    \ other application windows open in our computer login session.\n\nSome of those\
    \ can be in either *foreground* or *background* mode as we interact with them\
    \ and then switch our focus to another window.\n\nFor example we could have:\n\
    \n*   a Terminal window with extra ‘`tabs`’ open\n\n*   a web browser session\
    \ with tabs open in a Google search for a piece of software and a Maps page to\
    \ show how far we plan to drive tomorrow and our social media Facebook page and\
    \ . . .\n\n*   an email client application like Thunderbird where we are in the\
    \ middle of composing a reply to an email message . . .\n\n*   a document open\
    \ in ‘`Libre Office Writer`’\n\n*   a spreadsheet open in ‘`Libre Office Calc`’\n\
    \n*   an audio player presenting music we enjoy\n\n*   and more `...`\n\nWhen\
    \ a process completes its actions and returns any output or error message to us\
    \ — then the system tidies up and returns the resources it used back into a pool\
    \ of those available for the next process to consume.\n\nIf we find the interactive\
    \ response starts to get slow and sluggish — we could need to get more RAM for\
    \ our Linux PC or upgrade from spinning disk to SSD storage to help improve performance.\n\
    \nOtherwise we can remember to close down inactive applications we do not need\
    \ to have running at all times. Most of these can get restarted in moments when\
    \ we need them again.\n\n## Imagine a process\n\nHere is one way we can imagine\
    \ a ‘*process*’:\n\n> ![](media/file1.png)\n\n> \n\n> image\n\nEvery process starts\
    \ with three streams of input/output called:\n\n1.  ‘`stdin`’ — mnemonic for “*Standard\
    \ Input*”\n\n    — file *descriptor* ‘`0`’\n\n2.  ‘`stdout`’ — mnemonic for “*Standard\
    \ Output*”\n\n    — file *descriptor* ‘`1`’\n\n3.  ‘`stderr`’ — mnemonic for “*Standard\
    \ Error*”\n\n    — file *descriptor* ‘`2`’\n\nAs the *default* — when we or the\
    \ process make no other arrangements:\n\n*   the ‘`stdin`’ stream gets connected\
    \ to our keyboard\n\n*   the ‘`stdout`’ stream gets connected to our Terminal\
    \ window\n\n*   the ‘`stderr`’ stream gets connected to our Terminal window\n\n\
    What other *arrangements* can we make?\n\n## Process i/o handling\n\nThe Linux\
    \ system has more clever design — almost magic.\n\nEach of those input/output\
    \ streams can get *redirected* — input can get taken from a named file and an\
    \ output can get sent into a named file.\n\nWe use the less-than symbol (‘`<`’)\
    \ to redirect the standard *input* of a process — on file descriptor ‘0’ to get\
    \ this taken from a named file.\n\nWe use the greater-than symbol (‘`>`’) to redirect\
    \ the standard *output* of a process — on file descriptor ‘1’ to get that sent\
    \ into a named file.\n\nWe use *two* characters — the digit ‘`2`’ *and* the greater-than\
    \ symbol (‘`2>`’) to redirect the standard `error` *output* of a process — on\
    \ file descriptor ‘2’ to get that output stream sent into a named file.\n\nWe\
    \ follow those redirection symbols by the name of the input file or the output\
    \ file we want to use.\n\n## Command syntax\n\nI always think of the *syntax*\
    \ for a command with the addition of *input* and/or *output* redirection(s) as\
    \ this:\n\n> `$ cmd [-opts] [args] [< input] [> output]`\n\nNotice the ‘`input`’\
    \ less-than symbol (‘`<`’) points back *towards* or back *into* the command (‘`cmd`’\
    \ ) on the left side.\n\nNotice the ‘`output`’ greater-than symbols (‘`>`’) or\
    \ (‘`2>`’) point *away from* or *out from* that (‘`cmd`’) on the left side.\n\n\
    That makes it easy to remember which redirection symbol to use for command process\
    \ *input* or *output*.\n\nIn general I try to specify any command option(s) and\
    \ argument(s) I *before* any i/o redirection(s).\n\nOne exception or variation\
    \ to that command syntax *guideline* that works for me in my shell scripts is:\n\
    \n> `printf 1>&2` `\"\\nError: Input file NOT found\\n\"`\n\nHere the `bash` shell\
    \ `builtin` command ‘`printf`’ accepts the composite output redirection *duplication*\
    \ string ‘`1>&2`’ *before* it’s ‘`Error`’ *message* *argument* string.\n\nBy default,\
    \ the output from a ‘`printf`’ command goes to the ‘`stdout`’ stream — file descriptor\
    \ ‘`1`’.\n\nFor my script error messages I want the output to get sent to the\
    \ ‘`stderr`’ stream — file descriptor ‘`2`’.\n\nThe special output redirection\
    \ *duplication* string ‘`1>&2`’ redirects the normal ‘`stdout`’ *stream* (‘`1>`’)\
    \ from the ‘`printf`’ command and (‘`&`’) sends that output to the ‘`stderr`’\
    \ stream (‘`2`’) — where by default, it then shows up on our Terminal window,\
    \ even when we could have redirected the ‘`stdout`’ of the enclosing shell script\
    \ out to a named file:\n\n> `$ tst2.sh noSuchFile > out.log`\n\n> `Error: Input\
    \ file NOT found`\n\nSee ‘`man.bash`’ and search for ‘`REDIRECTION`’ for more\
    \ details.\n\n## Redirection overwrites!\n\n**Caution:** Using the ‘`>`’ character\
    \ to redirect output means we will *overwrite* (*obliterate*, *wipe-out*) the\
    \ named file we specify as a target — if it pre-exists.\n\nHere’s a small example\
    \ using the ‘`echo`’ command and ‘`cat`’ utility to display the file content:\n\
    \n> `$ echo \"first out\" > out.txt`\n\n> `$ cat out.txt`\n\n> `first out`\n\n\
    > `$`\n\nThe result is what we asked the ‘`echo`’ command to write and then redirected\
    \ its output into the specified file.\n\nWhat happens if we write another line\
    \ to the same file?\n\n> `$ echo \"next out\" > out.txt`\n\n> `$ cat out.txt`\n\
    \n> `next out`\n\n> `$`\n\nThe content of ‘`out.txt`’ got *overwritten*!\n\n**Please\
    \ Note:** When we *overwrite* a file in Linux there’s no going back!\n\nThe original\
    \ file content is **gone** – *for ever* — unless we made a *backup* to a *different*\
    \ file name or into a *different* directory or onto external storage.\n\n## Redirect\
    \ append mode"
