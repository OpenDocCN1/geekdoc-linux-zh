    \ using an ‘`ls`’ command or an ‘`echo`’ command first.\n\nYou can also pass the\
    \ ‘`-i`’ (*interactive*) option to the ‘`rm`’ command to get it to prompt you\
    \ *before* it removes each file you have specified.\n\nIt’s worth the extra moment\
    \ or two of trouble to give us certainty — at least until we know how wild-cards\
    \ operate.\n\nIf you find the list of matched files seems much longer than you\
    \ imagined — you can always type the control code ‘`{Ctrl}+{C}`’ to exit the ‘`rm`’\
    \ process (and most other commands) to let you reconsider your actions.\n\nI think\
    \ it’s better to be explicit and pass the full name of a file I want to remove\
    \ across to the ‘`rm`’ command:\n\n> `$ rm -i my-old-file.txt`\n\nThat way I get\
    \ less surprises and my data files stay safe from my own accidental typing errors!\n\
    \n# File naming\n\nI have noticed there are people who like to name their files\
    \ with a whole phrase or two — almost a short story.\n\nI grew up during a time\
    \ when every character was a premium. When I started using Unix (last *century*)\
    \ a file name was limited to a length of 14 characters — and that seemed plenty!\n\
    \nThis limitation made for a different way of naming files and programs and every\
    \ object in the file system.\n\nI still prefer shorter file names rather than\
    \ long-winded ones. They take less effort to write and they can get named with\
    \ almost as much precision as any longer more verbose file names — as long as\
    \ we document what we do.\n\nWhy do I mention this?\n\nAlthough the newer utilities\
    \ and application programs in Linux will often permit the use of blank space characters\
    \ and an assortment of any other characters in file names — these come at a cost.\n\
    \nIn the previous chapter we examined what we called *wild-card* characters (or\
    \ ‘`meta-characters`’) — characters that have a *change* of meaning when used\
    \ on the interactive bash shell command line.\n\nThose *meta-characters* present\
    \ us with powerful mechanisms to help us specify one or more files without the\
    \ need to spell out the file names in full every time — to me that is a wonderful\
    \ time saver."
