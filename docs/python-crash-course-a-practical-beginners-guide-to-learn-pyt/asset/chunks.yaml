    # DATA SCIENTIST: THE SEXIEST JOB IN THE 21ST CENTURY


    ![Artificial Intelligence, Brain, Think, Control](Image00005.jpg)


    The funny thing is that this great value of the data contrasts with that precisely
    the data is the most abundant resource on the planet (it is estimated that 2.5
    trillion bytes of new information is created per day). They don''t seem easy to
    make things compatible. How is it possible that something so abundant is so valuable?
    Even if it was pure supply and demand, accumulating data should be trivial. And
    it is, the complex thing is to process them. Until relatively recently we simply
    couldn''t do it. At the end of the 90s, the field of machine learning began to
    take on an autonomous entity, our ability to work with immense amounts of data
    was reduced and the social irruption of the internet did the rest. For a few years
    we have faced the first great ''democratization'' of these techniques. And with
    that, the boom of data scientists: nobody wants to have an untapped gold mine.


    ## In search of a data scientist


    The problem is that, suddenly, there has been a great demand for a profile that
    until now practically did not exist. Remember that you need statistical knowledge
    that a programmer does not usually have and computer knowledge that a statistician
    does not usually even imagine. Most of the time it has been solved with self-taught
    training that completes the basic skills that the training program should have
    but does not have. That is why, today, we can find a great diversity of professional
    profiles in the world of data science. According to `Burtch Works`, 32% of active
    data scientists come from the world of mathematics and statistics, 19% from computer
    engineering and 16% from other engineering.


    ## How to train?


    ### Degrees

    Today, there are some double degrees in computer engineering and mathematics (Autonomous
    University of Madrid, Granada, Polytechnic University of Madrid, Polytechnic University
    of Catalonia, Complutense, Murcia Autonomous University of Barcelona) or in computer
    science and statistics (University of Valladolid) that seem the best option if
    we consider this specialization.


    ### Postgraduate

    The postgraduate is a very diverse world. We can find postgraduate, masters or
    specialization courses in almost all universities and a truly excessive private
    offer. To give some examples we have postgraduate degrees at the `UGR`, the `UAB`,
    the `UAM`, the `UPM` or the `Pompeu Fabra`. However, in postgraduate courses it
    is more difficult to recommend a specific course. We must not forget that most
    of the work of data scientists is in companies that seek to make their databases
    profitable, because what market orientation is highly recommended. In fact, many
    of the masters in ''big data'' are offered by business schools such as `OEI` or
    `Instituto Empresa`.


    ### MOOCS

    One of the most interesting resources you can find are the moocs (you know, the
    massive open online courses). In fact recently, we saw that this self-training
    option could have a lot of future. Starting with the specialization program in
    Big Data of `Coursera`, we can find online courses from the best universities
    in the world. All this without mentioning the numerous tools to learn languages
    like `Python` or `R`.


    ## What languages should be learned?


    In reality, as any initiate knows, in programming the choice of one language or
    another is always complicated. In this election they intervene from technical
    or formative factors to simple personal preferences. What is clear that there
    are some languages more popular than others. Although common sense tells us that
    each language is better for certain things, in practice there is a certain rivalry.
    Personally, I use `R` but I usually recommend `Python`. Not only because it is
    prettier, but because it is multipurpose and that is always an advantage.


    ## Other tools


    ### A fireproof

    * `Excel`: It is not a language and usually does not like those who work with
    professional data. Or so they say when asked why polls say otherwise: 59% percent
    of respondents routinely use `excel`. So, finally, the application of Office spreadsheets
    is still a lot of war.


    ### The corporate brother and other languages and programs

    * Some languages or environments enjoy some success driven by corporate inertia:
    it is the case of the classic `Matlab` but progressively it is losing weight and
    use up to only 6%.

    * If we examine the surveys we can find many more languages that obey more particular
    needs of the practice of data scientists (or the programs they use): `Scala` (17%),
    `Slack` (10%), `Perl` (12%), `C #` (6%), `Mahout` (3%), `Apache Hadoop` (13%)
    or `Java` (23%).

    * Also, although it is possible that we should talk about them separately, there
    are many specific programs (free or proprietary) that are used in data science
    with different uses. For example, we could talk about `Tableau`, `RapidMiner`
    or `Weka`.


    ## The labor market: salaries and opportunities


    Salaries, as in general in the world of software development, change a lot depending
    on the place, the functions and the employer. However, right now it is a well-paid
    expertise. On a general level and according to the annual `KdNuggets` survey,
    salaries / incomes average $141,000 for freelancers, 107,000 for employees, 90,000
    for government workers or in the non-profit sector; $70,000 dollars for work in
    universities.


    However, these average salaries must be taken with great caution. While the average
    salary in the United States is between $103,000 and $131,000, in Western Europe
    it is between $54,000 and $82,000. In Spain, we are in similar numbers because,
    despite our (increasingly smaller) deficit of product companies, we have large
    companies (especially banks) that have turned in this field.


    What differentiates data science from the rest of the development world is perhaps
    the shortage of professionals. This phenomenon makes salaries relatively inflated
    and, as more dater profiles appear, they adjust. Therefore, it can be said that
    it is time to get on the wave of data science.


    CHAPTER - 5


    USING METHODS

    '
