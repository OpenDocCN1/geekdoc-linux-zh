  trans: "\n\n# 继承\n\n通过使用现有类的细节而不对其进行修改来创建一个新类的方法被称为继承。派生类或子类是新创建的类，而现有的类被称为父类或基类。\n\
    \n### 示例\n启动 IDLE。导航到 File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：\n\n```python\nclass\
    \ Dog:\n    def __init__(self):\n        print(\"Dog is available\")\n    def\
    \ whoisThis(self):\n        print(\"Dog\")\n    def walk(self):\n        print(\"\
    Walks gently\")\n\nclass Spitz(Dog):\n    #Child class\n    def __init__(self):\n\
    \        super().__init__()\n        print(\"Spitz is now available\")\n    def\
    \ whoisThis(self):\n        print(\"Pitbull\")\n    def wag(self):\n        print(\"\
    Strong\")\n\npitbull = Spitz()\npitbull.whoisThis()\npitbull.walk()\npitbull.wag()\n\
    ```\n\n### 讨论\n我们在上面的程序中创建了两个 Python 类。这些类分别是作为基类的 `Dog` 和作为派生类的 `Spitz`。派生类继承了基类的函数。`__init__()`\
    \ 方法和 `super()` 函数被用于将基类的 `__init__()` 方法的内容提取到派生类中。\n\n# Python 中的封装\n\nPython\
    \ 面向对象方法中的封装旨在帮助防止数据的直接修改。Python 中的私有属性使用单下划线或双下划线作为前缀。\n\n### 示例\n启动 IDLE。导航到\
    \ File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：`__` 或 `_`。\n\n```python\nclass Tv:\n\
    \    def __init__(self):\n        self.__finalprice = 800\n    def offer(self):\n\
    \        print(\"Offering Price: {}\".format(self.__finalprice))\n    def set_final_price(self,\
    \ offer):\n        self.__finalprice = offer\n\nt = Tv()\nt.offer()\nt.__finalprice\
    \ = 950\nt.offer()\n# using setter function\nt.set_final_price(990)\nt.sell()\n\
    ```\n\n### 讨论\n程序定义了一个类 `Tv` 并使用 `__init__` 方法来保存电视的最终报价价格。在此过程中，我们尝试更改价格但未能成功。无法更改的原因是\
    \ Python 将 `__finalprice` 视为私有属性。修改此值的唯一方法是通过使用设置器函数 `set_final_price()`，该函数接受价格作为参数。\n\
    \n# Python 中的对象创建\n\n### 来自上一个类的示例\n打开带有类 `Bright` 的上程序文件。\n\n```python\nstudent1\
    \ = Bright()\n```\n\n### 讨论\n最后一个程序将创建对象 `student1`，这是一个新实例。对象的属性可以通过特定的对象名称前缀来访问。属性可以是方法或数据，包括匹配的类函数。换句话说，`Bright.salute`\
    \ 是一个函数对象，而 `student1.salute` 将是一个方法对象。\n\n### 示例\n启动 IDLE。导航到 File（文件）菜单并点击 New\
    \ Window（新建窗口）。输入以下内容：\n\n```python\nclass Bright:\n    \"Another class again!\"\
    \n    c = 20\n    def salute(self):\n        print('Hello')\n\nstudent2 = Bright()\n\
    print(Bright.salute)\nprint(student2.salute)\nstudent2.salute()\n```\n\n### 讨论\n\
    尽管有参数 `self`，我们仍然调用了 `student2.salute()`，并且它在不传递参数的情况下仍然运行正常。这种现象的原因是因为每次对象调用其方法时，对象本身都会作为第一个参数传递。这意味着\
    \ `student2.salute()` 被翻译为 `student2.salute(student2)`。这就是使用 `self` 名的原因。\n\n\
    # 构造函数\n\n### 示例\n启动 IDLE。导航到 File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：\n\n```python\n\
    class NumberComplex:\n    pass\n\nclass ComplexNumber:\n    def __init__(self,\
    \ realnum = 0, i = 0):\n        self.real = realnum\n        self.imaginarynum\
    \ = i\n    def getData(self):\n        print(\"{0}+{1}j\".format(self.real,self.imaginarynum))\n\
    \ncomplex1 = NumberComplex(2,3)\ncomplex1.getData()\ncomplex2 = NumberNumber(5)\n\
    complex2.attribute = 10\nprint((complex2.real, complex2.imaginarynum, complex2.attribute))\n\
    ```\n\n# 删除对象和属性\n\n`del` 语句用于在任何实例删除对象的属性。\n\n### 示例\n启动 IDLE。导航到 File（文件）菜单并点击\
    \ New Window（新建窗口）。输入以下内容：\n\n```python\ncomplex1 = NumberComplex(2,3)\ndel complex1.imaginarynum\n\
    complex1.getData()\ndel NumberComplex.getData\ncomplex1.getData()\n```\n\n# 删除整个对象\n\
    \n### 示例\n启动 IDLE。导航到 File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：\n\n```python\ncomplex1\
    \ = NumberComplex(1,3)\ndel complex1\n```\n\n### 讨论\n当完成 `complex1 = NumberComplex(1,3)`\
    \ 时，内存中会生成一个新的对象实例，名称 `complex1` 与之绑定。对象不会立即被销毁，因为它会临时留在内存中，直到垃圾回收器将其从内存中清除。对象的清除有助于释放与对象相关的资源并提高系统效率。Python\
    \ 指的垃圾破坏是指对未引用的对象的自动销毁。\n\n# Python 中的继承\n\nPython 继承允许在不修改现有类的情况下使用现有类的细节来创建新类。派生类或子类是新创建的类，而现有类被称为父类或基类。\n\
    \n### 语法\nPython 继承允许我们指定基类的功能并增加更多。\n\n# 方法覆盖\n当基类和派生类中定义了相同的方法时，子类方法将覆盖基类方法。\n\
    \n# 多重继承\n\n### 示例\n```python\nclass Parent1:\n    pass\nclass Parent2:\n    pass\n\
    class MultiInher(Parent1, Parent2):\n    pass\n```\n### 讨论\n在这种情况下，`MultiInher`\
    \ 继承自 `Parent1` 和 `Parent2`。\n\n# 方法解析顺序\n\n### 示例\n```python\nprint(issubclass(list,object))\n\
    print(isinstance(6,object))\nprint(isinstance(\"Welcome\",object))\n```\n### 讨论\n\
    特定的属性将首先扫描类。搜索将继续到父类。这种搜索不会重复同一个类。这种方法有时被称为派生类的线性化。\n\n# 多级继承\n\n继承派生类被称为多级继承。\n\
    \n### 示例\n```python\nclass Parent:\n    pass\nclass Multilevel1(Parent):\n   \
    \ pass\nclass Multilevel2(Multilevel1):\n    pass\n```\n### 讨论\n`Multilevel1`\
    \ 继承自 `Parent`，而 `Multilevel2` 继承自 `Multilevel1`。\n\n# 运算符重载\n\n内置类可以使用运算符，并且相同的运算符在不同类型下的表现不同。一个例子是\
    \ `+`，它根据上下文执行字符串拼接、数字算术相加或列表合并。运算符重载是一项 OOP 功能，允许根据上下文赋予运算符不同的含义。\n\n# 使类与内置特殊函数兼容\n\
    \n### 示例\n```python\nclass Planar:\n    def __init__(self, x_axis= 0, y_axis =\
    \ 0):\n        self.x_axis = x_axis\n        self.y_axis = y_axis\n    def __str__(self):\n\
    \        return \"({0},{1})\".format(self.x_axis,self.y_axis)\n```\n### 讨论\n```python\n\
    planar1=Planar(3,5)\nprint(planar1)\n# 输出将为 (3,5)\n```\n### 使用更多内置方法\n```python\n\
    class Planar:\n    def __init__(self, x_axis= 0, y_axis = 0):\n        self.x_axis\
    \ = x_axis\n        self.y_axis = y_axis\nstr(planar1)\nformat(planar1)\n```\n\
    ### 讨论\n由此得出，每当我们调用 `format(planar1)` 或 `str(planar1)` 时，Python 实际上在执行 `planar1.__str__()`，因此名称、特殊函数。章节\
    \ - 10\n\n"
