    functions need an argument, for example, the built-in function help.![](Image00020.jpg)Testing
    your CodeIn a Python programming language, there are several technique methods
    that are used in testing a particular kind of code. Let us venture into the actual
    methods that are normally involved:Automated versus manual testing.Exploratory
    testing is a type of manual testing that is committed without a specific plan,
    where a developer is just trying to explore the actual application. In a bid to
    complete certain amounts of manual tests, a developer is obligated to draft a
    list of all the available features that a certain application contains, the various
    kinds of inputs that are normally accepted, and the possible expected results.
    With this, the developer is expected to go back to his or her list whenever changes
    are made to a particular set of programs, an activity that is so much tiresome
    and unsatisfying. It is at this point where automated testing comes in.Automated
    testing is the execution of the set program of code by a script in place of a
    particular human. Python language comes in handy is a set of tools and certain
    libraries that aids a particular developer in making automated testing to its
    application.Unit tests versus integration tests.A unit test is basically a kind
    of smaller test that checks whether a single component in a particular program
    works the right way so as to make it functional, whereas an integration test is
    the type of testing that ensures all the components that are involved in a particular
    set of program work well with each other. Both unit tests and integration tests
    can be written in a specific program.Test runners are basically tools that pick
    up the source code directory of a particular kind of program that contains unit
    tests and various settings, gets to execute them, and eventually outputs the results
    to the log files or the console.CHAPTER - 8


    DATA TYPES IN PYTHON![Code, Programming, Python](Image00021.jpg)E very program
    has certain data that allows it to function and operate in the way we want.  The
    data can be a text, a number, or any other thing in between. Whether complex or
    as simple as you like, these data types are the cogs in a machine that allow the
    rest of the mechanism to connect and work.  Python is a host to a few data types
    and, unlike its competitors, it does not deal with an extensive range of things. That
    is good because we have less to worry about and yet achieve accurate results despite
    the lapse. Python was created to make our lives, as programmers, a lot easier.  Numeric
    Data TypeJust as the number suggests, Python is able to recognize numbers rather
    well. The numbers are divided into two pairs: 


    *   Integer – A positive and/or negative whole numbers that are represented without
    any decimal points. 


    *   Float – A real number that has a decimal point representation. '
