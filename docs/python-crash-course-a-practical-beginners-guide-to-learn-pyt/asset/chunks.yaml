  trans: "\n\n# Python 中的面向对象编程\n\n![Mobile Phone, Python, Programming Language](img/Image00022.jpg)\n\
    \n## Python 中的对象与类\nPython 是一种多范式语言，因为它支持不同的编程方法。Python 中的对象具有属性和行为。\n\n### 示例\n\
    作为对象的汽车：\n- 属性：`color`、`mileage`、`model`、`age`。\n- 行为：`reverse`、`speed`、`turn`、`roll`、`stop`、`start`。\n\
    \n### 类\n它是创建对象的模板。\n\n### 示例\n```python\nclass Car:\n```\n注意按照习惯，我们将类名的首字母大写。按照惯例，类名使用单数形式。\n\
    \n### 语法\nclass Name_of_Class:\n\n从类我们可以通过简单创建类的实例来构造对象。`class_name()` 运算符通过将对象赋值给空方法来创建一个对象。\n\
    \n## 对象/类的实例化\n从我们的类 `Car` 开始，我们可以拥有多个对象，例如第一辆车、第二辆车或 SUV。\n\n### 示例\n1. 启动 IDLE。\n\
    2. 导航到 File（文件）菜单并点击 New Window（新窗口）。\n3. 输入以下内容：\n```python\nmy_car=Car()\npass\n\
    ```\n\n### 练习题\n- 为学生创建一个类和对象。\n- 为医院创建一个类和对象。\n- 为银行创建一个类和对象。\n- 为警察局创建一个类和对象。\n\
    \n### 示例\n1. 启动 IDLE。\n2. 导航到 File（文件）菜单并点击 New Window（新窗口）。\n3. 输入以下内容：\n```python\n\
    class Car:\n    category=”Personal Automobile”\n    def __init__(self, model,\
    \ insurance):\n        self.model = model\n        self.insurance = insurance\n\
    subaru=Car(“Subaru”,”Insured”)\ntoyota=Car(“Toyota”,”Uninsured”)\nprint(“Subaru\
    \ is a {}”.format(subaru._class_.car))\nprint(“Toyota is a {}”.format(toyota._class_.car))\n\
    print(“{} is {}”.format(subaru.model, subaru.insurance))\nprint(“{} is {}”.format(toyota.model,\
    \ toyota.insurance))\n```\n\n## 方法\n在类体内部定义的函数称为方法，是基本函数。方法定义了对象的行为。\n\n### 示例\n\
    1. 启动 IDLE。\n2. 导航到 File（文件）菜单并点击 New Window（新窗口）。\n3. 输入以下内容：\n```python\ndef\
    \ __init__(self, model, insurance):\n    self.model = model\n    self.insurance\
    \ = insurance\ndef ignite(self, ignite):\n    return \"{} ignites {}\".format(self.model,\
    \ ignition)\ndef stop(self):\n    return \"{} is now stopping\".format(self.model)\n\
    subaru=Car(“Subaru”,”Insured”)\nprint(subaru.ignite(\"'Fast'\"))\nprint(subaru.stop())\n\
    ```\n注意：`ignite()` 和 `stop()` 方法被称为实例方法，因为它们是所创建对象的实例。\n\n### 练习题\n- 创建一个 `Dog`\
    \ 类并对其实例化。\n- 编写一个 Python 程序来显示两只狗的名字以及它们来自 `a` 的两个属性。\n\n"
- fmt: "\n# Inheritance\n\nA way of creating a new class by using details of existing\
    \ class devoid of modifying it is called inheritance. The derived class or child\
    \ class is the newly formed class while the existing class is called parent or\
    \ base class.\n\n### Example\nStart IDLE. Navigate to the File menu and click\
    \ New Window. Type the following:\n\n```python\nclass Dog:\n    def __init__(self):\n\
    \        print(\"Dog is available\")\n    def whoisThis(self):\n        print(\"\
    Dog\")\n    def walk(self):\n        print(\"Walks gently\")\n\nclass Spitz(Dog):\n\
    \    #Child class\n    def __init__(self):\n        super().__init__()\n     \
    \   print(\"Spitz is now available\")\n    def whoisThis(self):\n        print(\"\
    Pitbull\")\n    def wag(self):\n        print(\"Strong\")\n\npitbull = Spitz()\n\
    pitbull.whoisThis()\npitbull.walk()\npitbull.wag()\n```\n\n### Discussion\nWe\
    \ created two Python classes in the program above. The classes were `Dog` as the\
    \ base class and `Spitz` as the derived class. The derived class inherits the\
    \ functions of the base class. The method `__init__()` and the function `super()`\
    \ are used to pull the content of `__init__()` method from the base class into\
    \ the derived class.\n\n# Encapsulation in Python\n\nEncapsulation in Python Object\
    \ Oriented Programming approach is meant to help prevent data from direct modification.\
    \ Private attributes in Python are denoted using a single or double underscore\
    \ as a prefix.\n\n### Example\nStart IDLE. Navigate to the File menu and click\
    \ New Window. Type the following: `__` or `_`.\n\n```python\nclass Tv:\n    def\
    \ __init__(self):\n        self.__finalprice = 800\n    def offer(self):\n   \
    \     print(\"Offering Price: {}\".format(self.__finalprice))\n    def set_final_price(self,\
    \ offer):\n        self.__finalprice = offer\n\nt = Tv()\nt.offer()\nt.__finalprice\
    \ = 950\nt.offer()\n# using setter function\nt.set_final_price(990)\nt.sell()\n\
    ```\n\n### Discussion\nThe program defined a class `Tv` and used `__init__` methods\
    \ to hold the final offering price of the TV. Along the way, we attempted to change\
    \ the price but could not manage. The reason for the inability to change is because\
    \ Python treated the `__finalprice` as private attributes. The only way to modify\
    \ this value was through using a setter function, `set_final_price()` that takes\
    \ price as a parameter.\n\n# Object Creation in Python\n\n### Example from the\
    \ previous class\nOpen the previous program file with class `Bright`.\n\n```python\n\
    student1 = Bright()\n```\n\n### Discussion\nThe last program will create object\
    \ `student1`, a new instance. The attributes of objects can be accessed via the\
    \ specific object name prefix. The attributes can be a method or data including\
    \ the matching class functions. In other terms, `Bright.salute` is a function\
    \ object and `student1.salute` will be a method object.\n\n### Example\nStart\
    \ IDLE. Navigate to the File menu and click New Window. Type the following:\n\n\
    ```python\nclass Bright:\n    \"Another class again!\"\n    c = 20\n    def salute(self):\n\
    \        print('Hello')\n\nstudent2 = Bright()\nprint(Bright.salute)\nprint(student2.salute)\n\
    student2.salute()\n```\n\n### Discussion\nWe invoked the `student2.salute()` despite\
    \ the parameter `self` and it still worked without placing arguments. The reason\
    \ for this phenomenon is because each time an object calls its method, the object\
    \ itself is passed as the first argument. The implication is that `student2.salute()`\
    \ translates into `student2.salute(student2)`. It is the reason for the `self`\
    \ name.\n\n# Constructors\n\n### Example\nStart IDLE. Navigate to the File menu\
    \ and click New Window. Type the following:\n\n```python\nclass NumberComplex:\n\
    \    pass\n\nclass ComplexNumber:\n    def __init__(self, realnum = 0, i = 0):\n\
    \        self.real = realnum\n        self.imaginarynum = i\n    def getData(self):\n\
    \        print(\"{0}+{1}j\".format(self.real,self.imaginarynum))\n\ncomplex1 =\
    \ NumberComplex(2,3)\ncomplex1.getData()\ncomplex2 = NumberNumber(5)\ncomplex2.attribute\
    \ = 10\nprint((complex2.real, complex2.imaginarynum, complex2.attribute))\n```\n\
    \n# Deleting Objects and Attributes\n\nThe `del` statement is used to delete attributes\
    \ of an object at any instance.\n\n### Example\nStart IDLE. Navigate to the File\
    \ menu and click New Window. Type the following:\n\n```python\ncomplex1 = NumberComplex(2,3)\n\
    del complex1.imaginarynum\ncomplex1.getData()\ndel NumberComplex.getData\ncomplex1.getData()\n\
    ```\n\n# Deleting the Entire Object\n\n### Example\nStart IDLE. Navigate to the\
    \ File menu and click New Window. Type the following:\n\n```python\ncomplex1 =\
    \ NumberComplex(1,3)\ndel complex1\n```\n\n### Discussion\nWhen `complex1 = NumberComplex(1,3)`\
    \ is done, a new instance of the object gets generated in memory and the name\
    \ `complex1` ties with it. The object does not immediately get destroyed as it\
    \ temporarily stays in memory before the garbage collector purges it from memory.\
    \ The purging of the object helps free resources bound to the object and enhances\
    \ system efficiency. Garbage destruction Python refers to automatic destruction\
    \ of unreferenced objects.\n\n# Inheritance in Python\n\nIn Python inheritance\
    \ allows us to specify a class that takes all the functionality from the base\
    \ class and adds more. It is a powerful feature of OOP.\n\n### Syntax\n```python\n\
    class ParentClass:\n    Body of parent class\nclass ChildClass(ParentClass):\n\
    \    Body of derived class\n```\n\n### Example\nStart IDLE. Navigate to the File\
    \ menu and click New Window. Type the following:\n\n```python\nclass Rect_mine(Rect_mine):\n\
    \    def __init__(self):\n        Shape.__init__(self,4)\n    def getArea(self):\n\
    \        s1, s2, s3,s4 = self.count_sides()\n        perimeter = (s1+s2+s3+s4)\n\
    \n```python\nr = rect_mine()\nr.inputSides()\nType b1 : 4\nType l1 : 8\nType b2\
    \ : 4\nType l1 : 8\nr.dispSides()\nType b1 : 4.0\nType l1 : 8.0\nType b2 : 4.0\n\
    Type l1 : 8.0\nr.getArea()\n```\n\n# Method Overriding in Python\n\nWhen a method\
    \ is defined in both the base class and the derived class, the method in the child\
    \ class will override the base class. In the above example, `__init__()` method\
    \ in Rectangle class will override `__init__()` in Shape class.\n\n# Inheritance\
    \ in Multiple Form in Python\n\n### Example\n```python\nclass Parent1:\n    pass\n\
    class Parent2:\n    pass\nclass MultiInherit(Parent1, Parent2):\n    pass\n```\n\
    ### Discussion\nIn this case, `MultiInherit` is derived from `Parent1` and `Parent2`.\n\
    \n# Method Resolution Order\n\n### Example\n```python\nprint(issubclass(list,object))\n\
    print(isinstance(6.7,object))\nprint(isinstance(\"Welcome\",object))\n```\n###\
    \ Discussion\nThe particular attribute in a class will be scanned first. The search\
    \ will continue into parent classes. This search does not repeat searching the\
    \ same class twice. The approach or order of searching is sometimes called linearization\
    \ of derived class in Python. The Method Resolution Order refers to the rules\
    \ needed to determine this order.\n\n# Multilevel Inheritance\n\nInheriting from\
    \ a derived class is called multilevel inheritance.\n\n### Example\n```python\n\
    class Parent:\n    pass\nclass Multilevel1(Parent):\n    pass\nclass Multilevel2(Multilevel1):\n\
    \    pass\n```\n### Discussion\n`Multilevel1` derives from `Parent`, and `Multilevel2`\
    \ derives from `Multilevel1`.\n\n# Operator Overloading\n\nInbuilt classes can\
    \ use operators and the same operators will behave differently with different\
    \ types. An example is the `+` that depending on context will perform concatenation\
    \ of strings, arithmetic addition on numbers, or merge lists. Operating overloading\
    \ is an OOP feature that allows assigning varying meaning to an operator subject\
    \ to context.\n\n# Making Class Compatible with Inbuilt Special Functions\n\n\
    ### Example\n```python\nclass Planar:\n    def __init__(self, x_axis= 0, y_axis\
