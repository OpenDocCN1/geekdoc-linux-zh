    # LEARNING PYTHON FROM SCRATCH!![Python, Python Logo, Python Programming](Image00023.jpg)


    Even before buying this book, you had some idea as to how important and in-demand
    Python is. We also read a little about it earlier on and saw how it is overtaking
    many mainstream programming languages. We walked through a step-by-step guide
    to download `Python 3`, the integrated development environment, or the text/code
    editor and set everything up. Lastly, you created your first program: well done!


    Now, it is time to stop scratching the surface and dive deep into the world of
    Python. There are far too many components and aspects to learn about Python, but
    we will only be focusing on what is essential for anyone to know and learn as
    a beginner. Consider this as a grammar for any other language. Without grammar,
    the language sounds broken, and so does Python.


    ## Python at First Glance


    Let us start with the program below:


    ```python

    print("I made it!")

    print("======")

    print("If I only knew it would be this easy")

    print("======")

    print("I would have taken up Python ages ago")

    print("======")

    ```


    We used a `print` command to have our message printed at the console box as our
    output of the program. Calling `print` a command is technically wrong; it is a
    function. While we will be covering functions and methods in detail later on,
    for now, just remember that functions are names of commands which are followed
    by parenthesis `()` ` where the brackets will either be empty or contain some
    type of data. There are set parameters that are pre-defined, meaning that certain
    functions will only be able to accept a specific type of data.


    In the above example, we used nothing more than text. A few letters to create
    a message, and that is it. In Python, things work differently. Text is not identified
    as text. We need to tell Python that we want this to be printed as text. How do
    we do that? We use single or double quotation marks, which allows Python to understand
    that anything within the quotes is text, and it needs to print it the way it is.


    I bet you most of you may not have noticed how all of the lines start with a lowercase
    `p` instead of the opposite. Ah, yes! Now that you noticed it let me tell you
    why we did that. Python is a case-sensitive language. It considers everything
    as a character, not a letter or text. This means that the lowercase `p` will not
    be the same character as the uppercase `P` and so on, and so forth.


    `Print`, `PRINT`, `print`, `PrinT`, `RINt` all of these will be treated differently
    by Python, and for printing purposes, these will not work at all except for `print`
    as that is the standard way of outputting things.


    To name anything in Python, we normally use lowercases for one-word commands.
    This isn’t something that is exclusive to Python, as every language uses some
    way as standard to write codes. What makes Python different is the sheer amount
    of thought that was put into the naming convention to make code easier to read.
    Remember this, anything with more than the word, you can use a few ways to do
    so as shown here:


    - `last_name`

    - `LastName`

    - `lastname`

    - `LASTNAME`


    In most of the cases, we will be using the first approach where each letter begins
    with a lowercase. For components with more than one word, we will be using underscores
    to separate them. The next in line is generally used only in cases of classes.
    At this point in time, you do not have to worry about what classes are. Just remember
    that words with the first letter as capital and that having no underscores is
    an example of `Camel Case`, and used for classes.


    Next down the line is the way we use to name packages. Here, all the words begin
    and end with lowercase letters and have no underscores between them. On the polar
    opposite, we have our last entry, which is used to define constants. Here, all
    the letters are in uppercase and have no underscores separating the words.


    Boring, wasn’t it? I know! But it is something you may want to remember as we
    will be doing quite a lot of these. You should know when to use which convention,
    as this greatly improves the code readability. The entire point of Python is to
    promote code readability, and if we go against that, there’s not much point in
    learning Python.


    Now that we have covered this let us start by discussing data types that are at
    work within Python. Without these, no programming language would operate or work.
    They are what we use as inputs, and these are what direct the program per our
    desire accordingly.


    ## What Are Data Types?


    Every program has certain data that allows it to function and operate in the way
    we want. The data can be a text, a number, or any other thing in between. Whether
    complex in nature or as simple as you like, these data types are the cogs in a
    machine that allow the rest of the mechanism to connect and work. Python is a
    host to a few data types and, unlike its competitors, it does not deal with an
    extensive range of things. That is good because we have less to worry about and
    yet achieve accurate results despite the lapse. Python was created to make our
    lives, as programmers, a lot easier.


    ### Strings


    In Python, and other programming languages, any text value that we may use, such
    as names, places, sentences, they are all referred to as strings. A string is
    a collection of characters, not words or letters, which is marked by the use of
    single or double quotation marks. To display a string, use the `print` command,
    open up a parenthesis, put in a quotation mark, and write anything. Once done,
    we generally end the quotation marks and close the bracket.


    Since we are using `PyCharm`, the IntelliSense detects what we are about to do
    and delivers the rest for us immediately. You may have noticed how it jumped to
    the rescue when you only type in the opening bracket. It will automatically provide
    you with a closing one. Similarly, for the quotation marks, one or two, it will
    provide the closing ones for you. See why we are using `PyCharm`? It greatly helps
    us out.


    “I do have a question. Why do we use either single or double quotation marks if
    both provide the same result?”


    Ah! Quite the eye. There is a reason we use these, let me explain by using the
    example below:


    ```python

    print(''I’m afraid I won’t be able to make it'')

    print(“He said “Why do you care?””)

    ```


    Try and run this through `PyCharm`. Remember, to run, simply click on the green
    play-like button on the top right side of the interface.


    ```

    "C:\Users\Programmer\AppData\Local\Programs\Python\Python37-32\python.exe" "C:/Users/Programmer/PycharmProjects/PFB/Test1.py"

    File "C:/Users/Programmer/PycharmProjects/PFB/Test1.py", line 1

    print(''I''m afraid I won''t be able to make it'')

    ^SyntaxError: invalid syntax

    Process finished with exit code 1

    ```


    Here’s a hint: That’s an error! So what happened here? Try and revisit the inputs.
    See how we started the first statement with a single quote? Immediately, we ended
    the quote using another quotation mark. The program only accepted the letter ‘I’
    as a string. You may have noticed how the color may have changed for every other
    character from ‘m’ until ‘won’ after which the program detects another quotation
    mark and accepts the rest as string. Quite confusing, to be honest. Similarly,
    in the second statement, the same thing happened. The program saw double quotes
    and understood it as a string, right until the point double marks arrives. Computers
    do not understand English; they understand binary communications. The compiler
    is what runs when we press the run button. It compiles our code and interprets
    the same into a series of ones and zeros so that the computer may understand what
    we are asking it to. This is exactly why the second it spots the first quotation
    mark, it considers it as a start of a string, and ends it immediately when it
    spots a second quotation mark. To overcome this obstacle, we use a mixture of
    single and double quotes when we know we need to use one of these within the sentence.
    Try and replace the opening and closing quotation marks in the first state as
    double quotation marks on both ends. Likewise, change the quotation marks for
    the second statement to single quotation marks as shown here:


    ```python

    print("I''m afraid I won''t be able to make it")

    print(''He said "Why do you care?'')

    ```


    Now the output should look like this: I''m afraid I won''t be able to make itHe
    said "Why do you care?"


    Lastly, for strings, the naming convention does not apply to the text of the string
    itself. You can use regular English writing methods and conventions without worries,
    as long as that is within the quotation marks. Anything outside it will not be
