- fmt: "\nThis means, if you were to use `100` and `100.00`, one would be identified\
    \ as an integer while the other will be deemed as a float. So why do we need to\
    \ use two various number representations? If you are designing a program, suppose\
    \ a small game that has a character’s life of `10`, you might wish to keep the\
    \ program in a way that whenever a said character takes a hit, his life reduces\
    \ by one or two points. However, to make things a little more precise, you may\
    \ need to use float numbers. Now, each hit might vary and may take `1.5`, `2.1`,\
    \ or `1.8` points away from the life total. Using floats allows us to use greater\
    \ precision, especially when calculations are on the cards. If you aren’t too\
    \ troubled about the accuracy, or your programming involves whole numbers only,\
    \ stick to integers.\n\n### Booleans\nAh! The one with the funny name. `Boolean`\
    \ (or `bool`) is a data type that can only operate on and return two values: `True`\
    \ or `False`. Booleans are a vital part of any program, except the ones where\
    \ you may never need them, such as our first program. These are what allow programs\
    \ to take various paths if the result is `true` or `false`.\n\nHere’s a little\
    \ example. Suppose you are traveling to a country you have never been to. There\
    \ are two choices you are most likely to face. If it is cold, you will be packing\
    \ your winter clothes. If it is warm, you will be packing clothes which are appropriate\
    \ for warm weather. Simple, right? That is exactly how the Booleans work. We will\
    \ look into the coding aspect of it as well. For now, just remember, when it comes\
    \ to `true` and `false`, you are dealing with a `bool` value.\n\n### List\nWhile\
    \ this is slightly more advanced for someone at this stage of learning, the list\
    \ is a data type that does what it sounds like. It lists objects, values, or stores\
    \ data within square brackets (`[]`). Here’s what a list would look like:\n\n\
    ```python\nmonth = ['Jan', 'Feb', 'March', 'And so on!']\n```\n\nWe will be looking\
    \ into this separately, where we will discuss lists, tuples, and dictionaries.\
    \ Surely, they are used within `Python`, but how? If you think you can type in\
    \ the numbers and `true` and `false`, all on their own, it will never work.\n\n\
    ### Variables\nYou have the passengers, but you do not have a mode of commuting;\
    \ they will have nowhere to go. These passengers would just be folks standing\
    \ around, waiting for some kind of transportation to pick them up. Similarly,\
    \ data types cannot function alone. They need to be ‘stored’ in these vehicles,\
    \ which can take them places. These special vehicles, or as we programmers refer\
    \ to as containers, are called ‘variables,’ and they are the elements that perform\
    \ the magic for us. \n\nVariables are specialized containers that store a specific\
    \ value in them and can then be accessed, called, modified, or even removed when\
    \ the need arises. Every variable that you may create will hold a specific type\
    \ of data in them. You cannot add more than one type of data within a variable.\n\
    \nIn other programming languages, you will find that in order to create a variable,\
    \ you need to use the keyword `var` followed by an equals mark `=` and then the\
    \ value. In `Python`, it is a lot easier, as shown below:\n\n```python\nname =\
    \ \"John\"\nage = 33\nweight = 131.50\nis_married = True\n```\n\nIn the above,\
    \ we have created a variable named `name` and given it a value of characters.\
    \ If you recall strings, we have used double quotation marks to let the program\
    \ know that this is a string. We then created a variable called `age`. Here, we\
    \ simply wrote `33`, which is an integer as there are no decimal figures following\
    \ that. You do not need to use quotation marks here at all. Next, we created a\
    \ variable `weight` and assigned it a float value. Finally, we created a variable\
    \ called `is_married` and assigned it a `True` `bool` value. If you were to change\
    \ the `T` to `t`, the system will not recognize it as a `bool` and will end up\
    \ giving an error. Focus on how we used the naming convention for the last variable.\
    \ We will be ensuring that our variables follow the same naming convention. You\
    \ can even create blank variables if you feel like you may need these at a later\
    \ point in time, or wish to initiate them at no value at the start of the application.\
    \ For variables with numeric values, you can create a variable with a name of\
    \ your choosing and assign it a value of zero. Alternatively, you can create an\
    \ empty string as well by using opening and closing quotation marks only.\n\n\
    ```python\nempty_variable1 = 0\nempty_variable2 = \"\"\n```\n\nYou do not have\
    \ to necessarily name them like this, you can come up with more meaningful names\
    \ so that you and any other programmer who may read your code would understand.\
    \ I have given them these names to ensure anyone can immediately understand their\
    \ purpose.\n\nNow we have learned how to create variables, let’s learn how to\
    \ call them. What’s the point of having these variables if we are never going\
    \ to use them, right? Let’s create a new set of variables. Have a look here:\n\
    \n```python\nname = \"James\"\nage = 43\nheight_in_cm = 163\noccupation = \"Programmer\"\
    \n```\n\nI do encourage you to use your own values and play around with variables\
    \ if you like. In order for us to call the `name` variable, we simply need to\
    \ type the name of the variable. In order to print that to the console, we will\
    \ do this:\n\n```python\nprint(name)\n```\n\n**Output**\n```\nJames\n```\n\nThe\
    \ same goes for the `age`, the `height` variable, and `occupation`. But what if\
    \ we wanted to print them together and not separately? Try running the code below\
    \ and see what happens:\n\n```python\nprint(name age height_in_cm occupation)\n\
    ```\n\nSurprised? Did you end up with this?\n\n```\nprint(name age height_in_cm\
    \ occupation)\n^SyntaxError: invalid syntax\nProcess finished with exit code 1\
    \ \n```\n\nHere is the reason why that happened. When you were using a single\
    \ variable, the program knew what variable that was. The minute you added a a\
    \ second, a third, and a fourth variable, it tried to look for something that\
    \ was written in that manner. Since there wasn’t any, it returned with an error\
    \ that otherwise says: “Umm… Are you sure, Sir? I tried looking everywhere, but\
    \ I couldn’t find `name age height_in_cm occupation` element anywhere.” All you\
    \ need to do is add a comma to act as a separator like so:\n\n```python\nprint(name,\
    \ age, height_in_cm, occupation)\n```\n\n**Output**\n```\nJames 43 163 Programmer\n\
    ```\n\n“Your variables, Sir!” And now, it knew what we were about. The system\
    \ recalled these variables and was successfully able to show us what values were.\
    \ But what happens if you try to add two strings together? What if you wish to\
    \ merge two strings and create a third-string as a result?\n\n```python\nfirst_name\
    \ = \"John\"\nlast_name = \"Wick\"\nfirst_name + last_name\n```\n\nHere, we did\
    \ not ask the program to print the two strings. If you wish to print these two\
    \ instead, simply add the `print` function and type in the string variables with\
    \ a `+` sign in the middle within parentheses. Sounds good, but the result will\
    \ not be what you expect:\n\n```python\nprint(first_name + last_name)\n```\n\n\
    **Output**\n```\nJohnick\n```\n\nHmm. Why do you think that happened? Certainly,\
    \ we did use a space between the two variables. The problem is that the two strings\
    \ have combined together, quite literally here, and we did not provide a white\
    \ space (blank space) after `John` or before `Wick`; it will not include that.\
    \ Even the white space can be a part of a string. To test it out, add one character\
    \ of space within the first line of code by tapping on the friendly spacebar after\
    \ `John`. Now try running the same command again, and you should see “John Wick”\
    \ as your result.\n\nThe process of merging two strings is called concatenation.\
    \ While you can concatenate as many strings as you like, you cannot concatenate\
    \ a string and an integer together. If you really need to do that, you will need\
    \ to use another technique to convert the integer into a string first and then\
    \ concatenate the same.\n"
