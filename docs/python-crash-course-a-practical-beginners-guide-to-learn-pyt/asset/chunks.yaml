  trans: "\n机器学习更加复杂，但我们能够将其与 Python 结合，以便在过程中获得一些惊人的结果，并确保我们的数据分析按照我们想要的方式运行。\n\n\
    # 机器学习是如何结合数据分析的？\n\n现在我们已经更深入地了解机器学习的工作原理以及它为什么重要，是时候更具体地看看机器学习是如何介入并帮助我们进行数据分析的。在数据分析方面，我们有许多使用机器学习的原因，因此花些时间研究我们如何使用它是很有重要的。\n\
    \n机器学习基本上将成为我们在在此过程中想要创建的所有算法的底层过程。无论你的算法简单还是复杂，随之而的大量编码和机制将真正由本指南中讨论的机器学习来运行。在\
    \ Python 的帮助下，你可以创建一些非常出色的算法来帮助我们筛选数据。\n\n所以，如果你确实希望通过数据分析过程，以筛选你的数据为目标并理解其中的内容，那么你需要预先学习一些机器学习。好消息是，机器学习能够与我们提到的\
    \ Python 语言很好地工作，确保我们能够使用简单的编程语言来完成，即使源自机器学习的理念总体上会更复杂。\n\n## 监督学习\n\n我们需要查看的第一种类型被称为监督学习。这是我们能够使用的最基本的机器学习形式，但它将为我们提供保持事物良好运行的一些不同部分，并帮助我们以快速有效的方式训练算法。\n\
    \n从开始，监督学习简单来说就是帮助算法学习将输入映射到特定输出的过程。我们将在这一部分花费时间，向算法展示许多带有相应答案的示例，希望它能发现联系并进行学习。然后，当训练完成后，算法将能够查看没有对应输出的新输入，并独立给出正确答案。\n\
    \n这整个过程将在我们处理早早收集的标记数据集时实现。如果映射正确，算法将能够以成功的方式进行学习。如果在这里没有达到目标，意味着我们必须对算法进行一些更改，以帮助它良好学习。监督机器学习算法在训练良好的情况下，将能够对未来以后获得的新数据做出良好的预测。\n\
    \n这是一个与我们看到的老师与学生场景非常相似的过程。会有一个老师能够引导学生从书籍和其他材料中良好地学习。然后学生将接受测试，如果回答正确，学生就会通过。如果没有通过，老师将改变方法并帮助学生学得更好，以便他们能够从过去犯的错误中学习并变得更好。这就是使用监督学习的基础知识。\n\
    \n## 无监督学习\n\n我们能够使用的第二种机器学习类型被称为无监督学习。这是我们可以在数据分析中使用一种方法，因为它能让机器处理和分类实体及无形对象，而无需向机器或系统提供关于对象的任何时间信息。\n\
    \n我们的机器需要分类的事物或对象是多样的，例如客户的购买行为、细菌的一些行为模式，甚至是黑客攻击或银行发生的欺诈行为。通过这种学习我们看到的主要思想是，我们希望让机器接触到大量多样化的数据，然后允许算法花时间从数据中学习和推断。然而，我们需要花时间教程序如何从这些数据中学习。\n\
    \n# 第 7 章 PYTHON\n\n![Python, Net Python, Beauty, Constrictor](img/Image00008.jpg)\n\
    \n## 什么是 Python，为什么要学习 Python？\n\n首先，Python 是一种高级多用途解释型语言。它非常成熟，并专注于代码的可读性和易用性。此外，Python\
    \ 有无数可用的包和库，从科学类的到大数据特定的都有。所有这些库结合 Python 易于学习的曲线，使得这种语言成为一种具有巨大多功能性的惊工具。\n\n\
    ![](img/Image00009.jpg)\n\n这里包含了一些与数据分析和机器学习相关的包示例：\n\n* `Python`\n* `Numpy`\n\
    * `Pandas`\n* `Scipy`\n* `Matplotlib`\n* `Seaborn`\n* `Bokeh`\n* `Scikit-Learn`\n\
    * `TensorFlow`\n* `Pytorch`\n\n这些其中一些包，但还可以列出许多其他。\n\n此外，根据 [Stack Overflow](https://insights.stackoverflow.com/trends?tags=python%2Cjavascript%2Cjava%2Cc%23%2Cphp%2Cc%2B%2B&utm_source=so-owned&utm_medium=blog&utm_campaign=gen-blog&utm_content=blog-link&utm_term=incredible-growth-python)，与其他主要编程语言相比，Python\
    \ 的问题数量最多。这可以通过下面的图看出。\n\n![](img/Image00010.jpg)\n\n图表还显示了这种增长多年来是如何迅速发生的，而且这种趋势并没有放缓。因此，Python\
    \ 是适合这本书的语言。书中使用的和提到的 Python 版本是 3，因为 Python 2 已经弃用并很快将不再支持。\n\n## 安装\n\n1. 有三种主要方法下载和安装\
    \ Python 3。\n\n    * [官方网站](https://www.python.org/downloads/)：这种安装方法最常见且最快。然而，如果你这样安装\
    \ Python，每个外部库和包都必须单独安装。因此，不推荐这种方法。\n\n    * [Miniconda](https://docs.conda.io/en/latest/miniconda.html)：此安装程序包含了\
    \ `conda` 包管理器和 Python。安装后，你可以使用 Anaconda Prompt 安装其他包。\n\n    * [Anaconda Distribution](https://www.anaconda.com/distribution/)：这种方法包含了书中使用的所有包以及许多其他。因此，这是推荐的安装过程。这种安装的缺点是下载一个大文件，取决于你的网络速度和带宽，这可能理想。\n\
    \n在所有情况下，你都应该下载 Python 3 版本，这是最新版本，并且已经被第三方库广泛使用和支持。请记住，只需要一个安装过程。你应该根据上面的描述选择最适合你的一种。通常情况下，选项\
    \ 1 和 2 更适合缓慢/有限的互联网连接或低磁盘空间，而如果没有互联网/存储限制，选项 3 是理想的。\n\n下面是针对上述提到的所有选项的简要分步安装指南。从官方网站下载\
    \ Python](Image00011.jpg)\n\n1. 在 Python 官方网站的下载页面 [`www.python.org/downloads/`](https://www.python.org/downloads/)\
    \ 上，你的操作系统应该会被自动检测并提供下载选项。\n\n2. 如果你的操作系统正确，只需点击 Download Python 按钮。否则，在下方的选项中选择一个操作系统。\n\
    \n"
