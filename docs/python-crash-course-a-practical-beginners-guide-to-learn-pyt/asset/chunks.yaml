    # 数据科学家：21 世纪最迷人的职业


    ![人工智能， 大脑，思考， 控制](img/Image00005.jpg)


    有趣的是，数据的这种巨大价值与一个事实形成了鲜明对比，即数据恰恰是地球上最丰富的资源（据估计每天产生 2.5 万亿字节的新信息）。让它们相互兼容并不容易。如此丰富的东西怎么会如此值钱呢？即便这纯粹取决于供需关系，积累数据也应该是轻而易举的。事实也如此，复杂之处在于如何处理它们。直到最近，我们还无法做到这一点。在
    90 年代末，机器学习领域开始成为一个自治实实体，我们处理海量数据的能力得到了提升，而互联网的社交爆发完成了剩下的工作。几年来，我们见证了这些技术的第一次大“民主化”。随之而来的是数据科学家的爆发式增长：没有人不想拥有一座尚未被开发的金矿。


    ## 寻找数据科学家


    问题在于，突然之间对一种直到那时几乎不存在的形象产生了巨大需求。请记住，你需要程序员通常不具备的统计学知识，以及统计学家通常无法想象的计算机知识。大多数时候，这是通过自学培训解决的，补充了培训课程本应具备但并不具备的基础技能。这就是为什么今天，我们可以在数据科学领域找到极其多样化的专业背景。根据
    `Burtch Works` 的数据，32% 的活跃数据科学家来自数学和统计领域，19% 来自计算机工程，16% 来自其他工程领域。


    ## 如何培训？


    ### 学位

    如今，有一些计算机工程与数学的双学位课程（马德里自治大学、格拉纳达大学、马德里理工大学、加泰罗尼亚理工大学、康普卢滕斯大学、穆西亚自治大学、巴塞罗那自治大学）或计算机科学与统计学的学位（瓦拉多利亚大学），如果我们考虑到这一专业方向，这些似乎是最佳选择。


    ### 研究生

    研究生是一个非常多元的世界。我们几乎可以在所有大学找到研究生、硕士或专化课程，而且私人提供的课程过多。举几个例子，我们在 `UGR`、`UAB`、`UAM`、`UPM`
    或 `Pompeu Fabra` 都有研究生课程。然而，在研究生课程中很难推荐某个特定的课程。我们不能忘记，数据科学家的大部分工作是在寻求使其数据库盈利的公司中进行的，因为市场导向是极受推荐的。事实上，许多“大数据”硕士课程是由
    `OEI` 或 `Instituto Empresa` 等商学院提供的。


    ### MOOC（大规模开放在线课程）

    你可以找到的最有趣的资源之一是 MOOC（你知道，即大规模开放在线课程）。事实上，最近我们看到自学选项非常有前景。从 `Coursera` 的大数据专业课程开始，我们可以找到来自世界顶尖大学的在线课程。这还没有提到用于学习
    `Python` 或 `R` 等语言的众多工具。


    ## 学习哪些语言？


    实际上，正如任何行内人士所知，在编程中选择一种语言还是另一种语言总是复杂的。在这种选择中，既有技术或培训因素，也有简单的个人偏好。很清楚，有些语言比其他的更受欢迎。尽管常识告诉我们每种语言都更适合某些事情，但在实践中存在某种竞争。我个人使用
    `R`，但我通常推荐 `Python`。不仅是因为它更漂亮，还因为它是多用途的，这始终是一个优势。


    ## 其他工具


    ### 防火大师

    * `Excel`：它不是一种语言，通常不受那些处理专业数据的人的待待。或者当被问及为什么调查结果显示相反时是如此：59% 的受访者经常使用 `excel`。所以，最后，Office
    表格的应用仍然是一场战争。


    ### 企业兄弟和其他语言及程序

    * 一些语言或环境受企业惯性的推动而获得成功：经典的 `Matlab` 就是如此，但它正在逐渐失去权重，使用率仅为 6%。

    * 如果我们查看调查结果，可以发现更多遵循数据科学家实践特定需求（或他们使用的程序）的语言：`Scala` (17%)、`Slack` (10%)、`Perl`
    (12%)、`C #` (6%)、`Mahout` (3%)、`Apache Hadoop` (13%) 或 `Java` (23%)。

    * 同时，尽管可能应该分开讨论它们，但数据科学中有许多特定的程序（免费或专有），具有不同的用途。例如，我们可以讨论 `Tableau`、`RapidMiner`
    或 `Weka`。


    ## 动力市场：薪资与机会


    薪资与软件开发世界一样，根据地点、职位和雇主的不同而变化很大。然而，现在这是一项高薪专长。从总体而言，根据年度 `KdNuggets` 调查，自由职业者的平均收入为
    141,000，员工为 107,000，政府工作人员或非营利部门为 90,000；大学工作为 70,000 美。


    然而，这些平均薪资必须谨慎对待。美国的平均薪资在 103,000 到 131,000 美元之间，而西欧在 54,000 到 82,000 美元之间。在西班牙，我们的数字也相似，因为尽管我们面临（日益减少）的产品公司短缺，但我们有大型公司（尤其是银行）转型这一领域。


    数据科学与开发世界其他部分的区别可能是专业人才的短缺。这种现象使得薪资相对通胀，随着更多数据画像出现，它们会调整。因此，可以说是时候加入数据科学浪潮了。


