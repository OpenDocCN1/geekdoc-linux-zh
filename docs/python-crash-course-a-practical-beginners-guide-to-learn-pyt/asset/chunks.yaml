    # 项目![数字化，转换，二进制，空，一](img/Image00026.jpg)


    ## 项目 - 1 (游戏)


    在为你提供第一个项目之前，让我先简要地介绍一下你对这些项目可以抱有的预期。


    每个项目都是独的，因为我们每个人对于如何执行和完成相同任务都有不同的想法。这些项目的设计初衷是为你提供看似简单的任务，但你会发现，你可能需要做的不仅仅是从一个文件复制并粘贴代码块到另一个文件。


    请运用你从所有渠道获取的编程知识，因为这些知识并不局限于特定的章节。在项目中，你将遇到各种问题、情况和场景。为了解决这些问题或成功完成任务，你将从一开始就需要使用各种方法，一直持续到如
    `functions`、`classes` 和 `modules` 等复杂事务。


    我将为你提供一些链接，你可以从那里下载特定的模块、库或 `classes`，以进一步使过程变得更容易。你已经知道如何使用 `from x import y`
    或 `import xyz` 方法将它们导入到 `PyCharm` 中了。尝试让一个看起来简单的场景变得复杂而有趣。利用你希望在读完这本书后获得的进阶知识继续开发这些项目。一个程序永远不会真正完成。即使是最好的程序和软件也会随着新知识、模块和变体的不断更新。


    继续练习并向这些项目添加更多内容。谁知道呢，你最后可能会做出比只显示一句“Hello World”要优得多且实用的东西。


    ### 任务

    创建一个简单的“剪刀石头布”游戏，由计算机随机生成数值，并要求用户输入他们的选择。结果应该显示用户获胜、失败还是平局。


    ### 要求

    要完成这个项目，你需要使用以下内容：


    **包：**

    `from random import randint` – 这是你的第一行代码。`Random` 是预装的，允许你强制计算机进行随机选择。这将帮助你确保每一回合都是独特且不可预测的。


    完成这个项目有非常多种方法。作为参考，我也会在书末尾分享我对这个项目的解决方案。


    请注意，我希望鼓励你探索 Python 的世界并使用你自己的方法，与社区交流，并学习更好的编码方式。出于这个原因，此后我将不再分享项目的细节。我很乐意分享问题的答案和其他问题的解决方案。至于其余部分，我邀请你运用自己的推理能力和编程能力来学习。


    到目前为止，我们已经通过了一些练习，质疑了什么是正确的，什么是错误的。我们甚至启动了第一个项目，坦率地说，这非常有挑战性。然而，一切都取决于你对基础知识的理解程度。你对基础了解得越透彻，从初学者变为中级程序员并最终成为熟练程序员的就就越容易。如果你对某些方面不确定，回顾概念并复习你所学的内容始终是一个好习惯。


    是时候和变量以及存储值说别了，进入我们的朋友们——语句和循环了。


    ## 项目 - 2


    又是一个新项目了。既然我们在讨论游戏，请编写一个 Python 程序，让用户根据给定的出生日期了解自己的星座。这个程序看起来可能相当简单，但一旦你深入细节，你很快就会发现这需要你跳出固有思维地思考。


    对于这个项目，我将不会提供提示或可以遵循的模板。你已经知道了，并且应该能够轻松且技巧地完成它。你不需要任何特殊的模块或包来完成这个项目。你只需要在互联网上搜索一下每个星座从什么时候开始，就可以开始了。


    通过不断尝试，你应该能够创建一个运行轻松且表现出众的程序。如果你遇到问题，请尝试自己解决它们，而不是在互联网上寻找解决方案。


    如果你对这类项目感兴趣，可以通过搜索“Python projects for beginners”找到更多项目并开始。你做的项目越多，学得就越好。关注当今的需求，并设定你的目标：有一天能够达到获得丰厚报酬的编程水平。


    ## 结


    '
- fmt: '

    Thank you for making it to the end of Python Crash Course. Let us hope that it
    was informative and able to provide you with all of the tools you need to achieve
    your goals whatever they may be.


    The objective of this is to present an introduction for the absolute beginners
    to machine learning and data science. This covers the dominant machine learning
    paradigms, namely supervised, unsupervised, semi-supervised, and reinforcement.
    This explains how to develop machine learning models in general and how to develop
    a neural network which is a particular method of performing machine learning.
    It teaches how to train and evaluate their accuracy.


    `Python` is a widely used programming language for different applications and
    in particular for machine learning. This covers the basic `Python` programming
    as well as a guide to use `Python` libraries for machine learning. This presents
    machine learning applications using real datasets to help you enhance your `Python`
    programming skills as well as machine learning basics acquired through the book.
    These applications provide examples of developing a machine learning model for
    predictions using linear regression, a classifier using logistic regression and
    artificial neural network. Through these applications, examples of data exploration
    and visualization using `Python` are presented.


    Nowadays, machine learning is used in every domain, such as marketing, health
    care systems, banking systems, stock market, gaming applications, among others.
    This book’s objective is to provide a basic understanding of the significant branches
    of machine learning as well as the philosophy behind artificial neural networks.
    This also aims at providing `Python` programming skills for machine learning to
    beginners with no earlier programming skills in `Python` or any other programming
    language.


    Remember that deep learning is relatively easy, contrary to collective thinking
    among programmers. The industry is quickly moving toward the top to take control
    of machines. There are lots of people who are firmly in favor of machine learning,
    but I have some solid reasons that deep learning is more profitable than machine
    learning. Practically speaking, deep learning is a subset of machine learning.
    It secures power and flexibility by learning the world on the basis of the database
    that it has stored in the backend. It works on the back of its hidden learning
    architecture that consists of multiple layers with some dense layers. The data
    is processed through these layers where the neural networks get to work on matching
    the input data with the data that is stored in the databases in the backend. Upon
    each match, they return the output on the basis of some highly educated findings
    that are efficient and very well managed.


    Once you have acquired the skills and understood the reasoning behind machine
    learning models presented in this book, you will be able to use these skills to
    solve complex problems using machine learning. You will also be able to easily
    acquire other skills and use more advanced machine learning methods. In this guide,
    I explained to you the basics of `Python` language. Learning to program is like
    learning another language. It takes a lot of patience, study, application, method,
    passion and above all perseverance.


    What I can suggest is to do as much practice as possible by starting to rewrite
    the hundreds of examples you find in this guide. Try to memorize them and when
    you write the code, say it to yourself, in your mind (open bracket, close round
    brackets and so on). In the beginning, this helped me a lot to memorize better
    the various steps needed to write a program even if simple.


    It is important not to feel like heroes when a program works but above all you
    should not be depressed when you cannot find a solution to your programming problems.
    The network is full of sites and blogs where you can always find a solution. I
    hope that this guide has been useful for you in learning `Python`.

    '
