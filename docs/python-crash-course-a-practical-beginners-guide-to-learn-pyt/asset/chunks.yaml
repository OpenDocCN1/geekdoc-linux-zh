    ### 3. After clicking, your download should start right away.


    Miniconda![](Image00012.jpg)Choose the appropriate OS on the following URL `https://docs.conda.io/en/latest/miniconda.html`
    and click on the download button. As always, the download should start, and you
    can proceed to follow the installation process.


    Anaconda Distribution![](Image00013.jpg)


    1. The download section of the Anaconda Distribution for all operating systems
    is available at `https://www.anaconda.com/distribution/#download-section`, select
    your OS.

    2. Click Download for version 3, and the download should start right away. Run
    the installer after the download is completed, and follow the instructions.


    ### Dictionaries

    Dictionaries are a powerful data type present in python. It can store indexed
    values like lists, but the indexes are not a range of integers. Instead, they
    are unique keys. Therefore, dictionaries are a set of key: value pairs. Like sets,
    dictionaries are not ordered. The keys can be any immutable objects such as strings,
    tuples, integers, or float numbers.


    #### Defining Dictionaries

    Curly brackets and colon are used in an explicit dictionary definition.![](Image00014.jpg)


    #### Assigning Values to Keys

    After a dictionary is created, you can assign values indexing by keys.![](Image00015.jpg)


    #### Get Keys and Values

    Dictionary has the built-in methods `keys` and `values` to achieve the current
    values stored.![](Image00016.jpg)

    OBS.: Remember that dictionaries are not an ordered object. Therefore, do not
    expect order in its keys or values, even though they maintain the insertion order
    in the latest Python version.


    #### Dictionaries in Loops

    In general, you want to know the key: value pairs on a dictionary when iterating.
    The `items` method returns both values when used in for loops.![](Image00017.jpg)


    #### Dictionary Comprehension

    Dictionaries can be used as in list comprehension.![](Image00018.jpg)


    ### Functions

    We already used multiple functions that are built in the Python programming language,
    such as `print`, `len`, or `type`. Generally, a function is defined to represent
    a set of instructions that will be repeatedly called. In order to achieve the
    desired task, a function may or may not need multiple inputs, called arguments.![](Image00019.jpg)

    Not all functions need an argument, for example, the built-in function `help`.![](Image00020.jpg)


    ### Testing your Code

    In a Python programming language, there are several technique methods that are
    used in testing a particular kind of code. Let us venture into the actual methods
    that are normally involved:


    #### Automated versus manual testing

    Exploratory testing is a type of manual testing that is committed without a specific
    plan, where a developer is just trying to explore the actual application. In a
    bid to complete certain amounts of manual tests, a developer is obligated to draft
    a list of all the available features that a certain application contains, the
    various kinds of inputs that are normally accepted, and the possible expected
    results. With this, the developer is expected to go back to his or her list whenever
    changes are made to a particular set of programs, an activity that is so much
    tiresome and unsatisfying. It is at this point where automated testing comes in.

    Automated testing is the execution of the set program of code by a script in place
    of a particular human. Python language comes in handy is a set of tools and certain
    libraries that aids a particular developer in making automated testing to its
    application.


    #### Unit tests versus integration tests

    A unit test is basically a kind of smaller test that checks whether a single component
    in a particular program works the right way so as to make it functional, whereas
    an integration test is the type of testing that ensures all the components that
    are involved in a particular set of program work well with each other. Both unit
    tests and integration tests can be written in a specific program.

    Test runners are basically tools that pick up the source code directory of a particular
    kind of program that contains unit tests and various settings, gets to execute
    them, and eventually outputs the results to the log files or the console.


    # CHAPTER - 8


    ### DATA TYPES IN PYTHON

    ![Code, Programming, Python](Image00021.jpg)

    Every program has certain data that allows it to function and operate in the way
    we want. The data can be a text, a number, or any other thing in between. Whether
    complex or as simple as you like, these data types are the cogs in a machine that
    allow the rest of the mechanism to connect and work. Python is a host to a few
    data types and, unlike its competitors, it does not deal with an extensive range
    of things. That is good because we have less to worry about and yet achieve accurate
    results despite the lapse. Python was created to make our lives, as programmers,
    a lot easier.


    #### Numeric Data Type

    Just as the number suggests, Python is able to recognize numbers rather well.
    The numbers are divided into two pairs:


    - Integer – A positive and/or negative whole numbers that are represented without
    any decimal points.

    - Float – A real number that has a decimal point representation.

