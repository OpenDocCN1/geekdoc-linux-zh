    like `functions`, `classes`, and `modules`.


    I will be providing you with links from which you can download specific modules,
    libraries, or `classes` to help further make the process easier. You already know
    how to import them into your `PyCharm` using the `from x import y` or `import
    xyz` method. Try and make a simple-looking scenario complex and interesting. Continue
    developing these projects with advanced knowledge that you will hopefully gain
    after this book. A program is never truly complete. Even the best programs and
    software continue to be updated with newer knowledge, modules, and variations.


    Keep on practicing and adding more to these projects. Who knows, you might end
    up with something far superior and more useful than just a message that says “Hello
    World” at the end.


    ### Task

    Create a simple game of “Rock, Paper, Scissors,” where the computer randomly generates
    value and asks the user to input their selection. The result should show whether
    the user wins or loses, or if it is a draw.


    ### Requirements

    To complete this project, you will need to use the following:


    **Packages:**

    `from random import randint` – This will be your first line of code. `Random`
    comes pre-installed and allows you to force the computer to randomize the selection.
    This will help you in ensuring that every turn is unique and unpredictable.


    There are quite a few ways you can complete this project. As a reference, I will
    share my solution for this project at the end of the book as well.


    Please note that I wish to encourage you to explore the world of Python and use
    your genuine approaches, communicate with the community, and learn better ways
    to code. For this reason, I will not share the details on the projects moving
    forward. I will gladly share the answers to questions and solutions to other problems.
    The rest, I invite you to use your power of deduction and programming to learn
    better.


    So far, we have gone through some exercises, questioned what was right and what
    was not. We even initiated our very first project, which is quite challenging
    in all fairness. However, everything hinges on how well you understand your basics.
    The better you know them, the easier it will be to move from a beginner to an
    intermediate programmer and eventually to a skilled programmer. If you are unsure
    about certain aspects, it is always a good habit to revisit the concepts and revise
    what you have learned.


    Time to say goodbye to variables and storing values and move on to our friends,
    the statements, and loops.


    ## Project - 2


    Time for yet another project. Since we are discussing games, create a Python program
    that lets the user know their astrological sign from the given date of birth.
    The program may seem rather easy, but once you look into the smaller details,
    you will soon realize that this will require you to think a little out of the
    box.


    For this project, I will not be providing hints nor a model to follow. You already
    know, and you should be able to execute this one with ease and a bit of finesse
    as well. You do not need any special modules or packages to get this project done.
    All you need is a quick search on the internet to see which star sign starts when
    to get you going.


    Through trial and error, you should be able to create a program that can work
    easily and exceptionally. Should you encounter issues, try and resolve them on
    your own instead of looking for a solution on the internet.


    If such projects interest you, you can find many more by searching for “Python
    projects for beginners” and get started. The more projects you work on, the better
    you will learn. Keep an eye out for what is in demand these days and set your
    target to one day be able to carry out programming of a level that will get you
    paid handsomely.


    ## CONCLUSION

