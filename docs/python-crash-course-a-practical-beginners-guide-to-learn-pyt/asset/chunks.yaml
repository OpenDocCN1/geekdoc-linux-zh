    # MACHINE LEARNING


    ![Tech, Circle, Technology, Abstract, Science, Space](Image00007.jpg)


    This is going to be an essential part of our data analysis because it helps us
    to work with some of the algorithms and the models that we want to control in
    this process. With the help of machine learning and the use of the `Python` language
    that we talked about earlier, we are able to see our algorithms actually work
    and do some of the insights and predictions that we want to work with along the
    way. To help us see why machine learning can be useful to our data analysis, we
    need to take a closer look at how machine learning is going to work in the first
    place.


    ## What is Machine Learning?


    The first thing that we need to take a look at here is the basics of machine learning.
    This is one of the approaches that we can use with data analytics that will help
    teach a computer how to learn and react on their own, without the interaction
    of the programmer. Many of the actions that we will train the system to do will
    be similar to actions that already come naturally to humans, such as learning
    from experience. The algorithms that come with machine learning are going to be
    able to use computational methods in order to learn information right from the
    data, without having to rely on an equation that is predetermined as its model.
    The algorithms are going to adaptively improve some of their own performance as
    the number of samples that we will use for learning will increase.


    With the rise in big data that is available for all industries to use, we will
    find that machine learning is going to become one of the big techniques that are
    used to solve a ton of problems in many areas, including the following:


    1. **Computational finance**: This is going to include algorithmic trading, credit
    scoring, and fraud detection.

    2. **Computer vision and other parts of image processing**: This can be used in
    some different parts like object detection, motion detection, and face recognition.

    3. **Computational biology**: This is going to be used for a lot of different
    parts, including DNA sequencing, drug discovery, and tumor detection.

    4. **Energy production**: This can be used to help with few different actions
    like load forecasting and to predict what the prices will be.

    5. **Manufacturing, aerospace, and automotive**: This is going to be a great technique
    to work with when it comes to helping with many parts, including predictive maintenance.

    6. **Natural language processing**: This is going to be the way that we can use
    machine learning to help with applications of voice recognition.


    Machine learning and the algorithms that they control are going to work by finding
    some natural patterns in the data that you can use, including using it in a manner
    that will help us make some better predictions and decisions along the way. They
    are going to be used on a daily basis by businesses and a lot of different companies
    in order to make lots of critical decisions. For example, medical facilities can
    use this to help them diagnose patients. And we will find that there are a lot
    of media sites that will rely on machine learning in order to sift through the
    potential of millions of options in order to give recommendations to the users.


    There are many reasons that your business is able to consider using machine learning.
    For example, it is going to be useful if you are working with a task that is complex
    or one that is going to involve a larger amount of data and a ton of variables,
    but there isn’t an equation or a formula that is out there right to handle it.
    For example, some of the times when we want to work with machine learning include:


    1. Equations and rules that are hand-written and too complex to work with. This
    could include some options like speech recognition and face recognition.

    2. When you find that the rules that are going to change all of the time. This
    could be seen in actions like fraud detection from a large number of transactional
    records.

    3. When you find that the nature of your data is going to change on a constant
    basis, and the program has to be able to adapt along the way. This could be seen
    when we work with predicting the trends during shopping when doing energy demand
    forecasting and even automated trading, to name a few.

