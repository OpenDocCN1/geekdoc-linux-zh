    String literals are usually surrounded by single quotation marks and double quotation
    marks. For example, the world expression ‘string’ is written in the same way as
    “string.” You can print it in the shell with the `print()` function, just like
    I did with the data types in Python shell. The first step is to assign a string
    to some variable of your choice. You can write down the name of the variable that
    you want to use, which can be followed by the equal sign and then the string.
    Please note that you can use either a single alphabet or a full name as the name
    of a variable. Use them wisely in a program so that when you read the code, you
    know the job of each variable.


    ```python

    >>> myString = "I am learning deep learning with python."

    >>> print(myString)

    I am learning deep learning with python.

    >>> myString = "I am studying deep learning with python."

    >>> print(myString)

    I am studying deep learning with python.

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString)

    I am studying deep learning, with Python, and I am really enjoying it, and writing
    programs with it.

    >>> myString = ''''''I am studying deep learning, with Python, and I am really
    enjoying it, and writing programs with it.''''''

    >>> print(myString)

    I am studying deep learning, with Python, and I am really enjoying it, and writing
    programs with it.

    ```


    Like many programming languages, Python strings are like byte arrays, which represent
    Unicode characters. There is no character data type in Python. However, a single
    character is a string that has a length of 1. You can use square brackets to access
    elements of the string.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString[10])

    i

    >>> print(myString[1])

    >>> print(myString[2])

    a

    >>> print(myString[0])

    I

    ```


    ### Do you love slicing?


    Slicing always has a satisfying effect on the human brain. Python strings offer
    you the freedom to return a wide range of characters with the help of using the
    slice syntax. The first step in this regard is to specify the starting index and
    the ending index. Separate the two by a colon to return a part of the string.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString[20:35])

    earning, with P

    >>> print(myString[10:35])

    ing deep learning, with P

    >>> print(myString[0:50])

    I am studying deep learning, with Python, and I am

    ```


    Python allows you to slice a string by using negative indexing as well. Let’s
    see how you can do that. The only difference is that you will use negative numbers
    in the string.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString[-50:-1])

    really enjoying it, and writing programs with it

    >>> print(myString[-60:-1])

    , and I am really enjoying it, and writing programs with it

    >>> print(myString[-70:-10])

    ith Python, and I am really enjoying it, and writing program

    ```


    You can calculate the total length of a string by using the following code.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(len(myString))

    100

    ```


    ### String Methods


    The first method that will come under discussion is the `strip()` method that
    does the job of removing whitespaces from your string at the start or the end.


    ```python

    >>> myString = """  I am studying deep learning, with Python, and I am really
    enjoying it, and writing programs with it.  """

    >>> print(myString.strip())

    I am studying deep learning, with Python, and I am really enjoying it, and writing
    programs with it.

    ```


    In the following example, I will try three different methods on the same string.
    One method is to convert the text into a lower case; the second is to convert
    it into the upper case, while the third is to convert the text into title case.
    All of them are simple and very handy when you are composing messages that you
    have to display for your users.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString.lower())

    i am studying deep learning, with python, and i am really enjoying it, and writing
    programs with it.

    >>> print(myString.upper())

    I AM STUDYING DEEPNING, WITH PYTHON, AND I REALLY ENJOYING IT, AND WRITING PROGRAMS
    WITH IT.

    >>> print (myString.title())

    I Am Studying Deep Learning, With Python, And I Am Enjoying It, And Writing Programs
    with It.

    ```


    Let’s talk about some string methods to learn how it operates.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString.replace("studying", "reading"))

    I am reading deep learning, with Python, and I am really enjoying it, and writing
    programs with it.

    >>> print(myString.replace("really", " "))

    I am studying deep learning, with Python, and I am enjoying it, and writing programs
    with it.

    >>> print(myString.replace("really", ""))

    I am studying deep learning, with Python, and I am enjoying it, and writing programs
    with it.

    >>> print(myString.replace("studying",""))

    I am  deep learning, with Python, and I am really enjoying it, and writing programs
    with it.

    ```


    In the above example, I attempted to replace a word with a new word. Then I moved
    on to eliminating a word by replacing it with no word. I tried it thrice to explain
    how you can manage whitespaces that are likely to happen if you’t fix them. The
    best method is to eliminate extra spaces from the code. There is a special method
    known as the `split()` method that can split the string into several substrings.


    ```python

    >>> myString = """I am studying deep learning, with Python, and I am really enjoying
    it, and writing programs with it."""

    >>> print(myString.split(","))

    [''I am studying deep learning'', '' with Python'', '' and I am really enjoying
    it'', '' and writing programs with it.'']

    >>> myString = "I, am, studying, deep, learning."

    >>> print(myString.split(","))

    [''I'', '' am'', '' studying'', '' deep'', '' learning.'']

    ```


    There is another interesting method using which you can check if a certain phrase
    or a character exists in a particular string or not. There are two keywords `in`
    or `not in` that you can use for this method.


    ```python

    >>> myString = "I am studying deep learning."

    >>> a = "studying" not in myString

    >>> print(a)

    False

    >>> a = "studying" in myString

    >>> print(a)

    True

    ```


    If you have got two strings, you can combine them easily by using the Python concatenation
    method. The primary operator that you can use here is the `+` operator. Let’s
    see how to do that.


    ```python

    >>> myString = "I am studying deep learning."

    >>> myString1 = "with Python."

    >>> combstring = myString + myString1

    >>> print(combstring)

    I am studying deep learning with Python.

    >>> myString = "I am studying deep learning."

    >>> myString1 = " with Python."

    >>> combstring = myString + myString1

    >>> print(combstring)

    I am studying deep learning with Python.

    ```


    The above code snippet has two similar code examples. The first one has a flaw.
    There is no whitespace in the first after the word learning. Two words have been
    wrongly combined. I fixed the issue by adding whitespace at the start of the second
    string. This formula will be helpful for you when you are combining two strings
    for writing a program. This method is the easiest; however, there is another method
    that you can use to add necessary space between two strings.


    ```python

    >>> myString = "I am studying deep learning."

    >>> myString1 = "with Python."

    >>> combString = myString + " " + myString1

    >>> print(combString)

    I am studying deep learning with Python.

    ```


    You can format your string at will by the following method. Formatting a string
    means that you can combine two data types when you are writing a program for a
    user. There is a special method for this purpose, the `format()` method.


    ```python

    >>> myString = 23

    >>> myString1 = "I am John and I am " + myString

    Traceback (most recent call last):

    File "<pyshell#98>", line 1, in <module>

    myString1 = "I am John and I am " + myString

    TypeError: can only concatenate str (not "int") to str


    >>> myString = 23

    >>> myString1 = "I am John and I am {}"

    >>> print(myString1.format(myString))

    I am John and I am 23

    ```

