    \ `true` 和 `false` 时，你处理的是一个 `bool` 值。\n\n### 列表\n虽然对于处于这个学习阶段的人来说这稍微高级一点，但列表（list）是一种顾名其实的数据类型。它在方括号（`[]`）中列出对象、值或存储数据。列表看起来如下：\n\
    \n```python\nmonth = ['Jan', 'Feb', 'March', 'And so on!']\n```\n\n我们将专门讨论这个问题，介绍列表、元组（tuples）和字典（dictionaries）。它们显然被用于\
    \ `Python` 中，但是如何使用的呢？如果你认为可以单独输入数字、`true` 和 `false`，那是永远行不通的。\n\n### 变量\n你有了乘客，但没有交通工具；他们将无处可去。这些乘客只会聚在一起站着，等待某种交通工具来接他们。同样，数据类型不能独立运行。它们需要被“存储”在这些可以带它们去往地方的车辆中。这些特殊的车辆，或者说我们程序员所说的“容器”，被称为“变量”，它们是为我们执行魔法的元素。\n\
    \n变量是特殊的容器，在其中存储特定的值，并在需要时对其进行访问、调用、修改甚至删除。你创建的每个变量都将包含特定类型的数据。你不能在一个变量中添加超过一种类型的数据。\n\
    \n在其他编程语言中，你会发现为了创建一个变量，你需要使用关键字 `var`，后跟等号 `=` 然后是值。在 `Python` 中，要简单得多，如下所示：\n\
    \n```python\nname = \"John\"\nage = 33\nweight = 131.50\nis_married = True\n```\n\
    \n在上面，我们创建了一个名为 `name` 的变量，并给它赋值了一个字符值。如果你还记得字符串（strings），我们使用了双引号告诉程序这是一个字符串。然后我们创建了一个名为\
    \ `age` 的变量。在这里，我们直接写了 `33`，它是一个整数，因为后面没有小数数字。你完全不需要在这里使用引号。接下来，我们创建了一个变量 `weight`\
    \ 并给它赋值了一个浮点数值。最后，我们创建了一个名为 `is_married` 的变量，并给它赋值了一个 `True` `bool` 值。如果你将 `T`\
    \ 改为 `t`，系统将不会将其识别为 `bool` 并最终导致错误。注意我们对最后一个变量是如何命名规范的。我们将确保变量也遵循相同的命名规范。如果你觉得以后可能需要这些变量，或者希望在应用程序开始时将它们初始化为空值，你甚至可以创建空变量。对于带有数值的变量，你可以创建一个你任选名称的变量并将其赋值为零。或者，你也可以通过仅使用开启和关闭引号创建一个空字符串。\n\
    \n```python\nempty_variable1 = 0\nempty_variable2 = \"\"\n```\n\n你不一定非这样命名，可以想出更有意义的名字，这样你以及任何可能阅读你代码的程序员都能理解。我给它们起这些名字是为了确保任何人都能立即理解它们的用途。\n\
    \n现在我们学习了如何创建变量，让我们学习如何调用它们吧。如果我们从不使用它们，那么拥有这些变量有什么意义呢，对吧？让我们创建一组新变量。看这里：\n\n\
    ```python\nname = \"James\"\nage = 43\nheight_in_cm = 163\noccupation = \"Programmer\"\
    \n```\n\n我非常鼓励你使用自己的值，并在喜欢的情况下玩玩变量。为了调用 `name` 变量，我们只需要输入变量的名字。为了在控制台中打印出它，我们需要这样做：\n\
    \n```python\nprint(name)\n```\n\n**输出**\n```\nJames\n```\n\n`age`、`height` 变量和\
    \ `occupation` 也是一样的情况。但如果我们想把它们一起打印，而不是分开打印呢？尝试运行下面的代码并看看发生了什么：\n\n```python\n\
    print(name age height_in_cm occupation)\n```\n\n感到惊讶吗？你最后得到了这个吗？\n\n```\nprint(name\
    \ age height_in_cm occupation)\n^SyntaxError: invalid syntax\nProcess finished\
    \ with exit code 1 \n```\n\n这就是发生这种情况的原因。当你只使用一个变量时，程序知道那是哪个变量。一旦你加入了第二个、第三个和第四个变量，它就会尝试寻找以那种方式编写的内容。由于不存在这种内容，它返回一个错误，大意是：“嗯……先生，你确定吗？我找遍了地方，但哪里都找不到\
    \ `name age height_in_cm occupation` 元素。”你只需要添加一个逗号作为分隔符，如下：\n\n```python\nprint(name,\
    \ age, height_in_cm, occupation)\n```\n\n**输出**\n```\nJames 43 163 Programmer\n\
    ```\n\n“您的变量，先生！”现在，它知道我们要干什么了。系统回了这些变量，并成功向我们展示了它们的值。但如果你尝试将两个字符串相加呢？如果你想合并两个字符串并生成第三个字符串作为结果呢？\n\
    \n```python\nfirst_name = \"John\"\nlast_name = \"Wick\"\nfirst_name + last_name\n\
    ```\n\n在这里，我们要求程序打印这两个字符串。如果你想打印这两个，只需添加 `print` 函数，并在括号内用 `+` 号连接字符串变量即可。听起来不错，但结果可能不是你预期的：\n\
    \n```python\nprint(first_name + last_name)\n```\n\n**输出**\n```\nJohnick\n```\n\
    \n嗯。你认为为什么会发生这种情况？确实，我们在两个变量之间使用了空格。问题是，这两个字符串在字面上完全组合在了一起（就在这里），而且我们没有在 `John`\
    \ 之后或 `Wick` 之前提供空格（空白处）；它不会包含那个。即使是空格也可以是字符串的一部分。为了测试一下，在第一行代码的 `John` 之后按一下空格空格键添加一个空格字符。现在再次运行相同的命令，你应该会看到结果为“John\
    \ Wick”。\n\n合并两个字符串的过程被称为拼接（concatenation）。虽然你可以随心所欲拼接任意数量的字符串，但你不能将字符串和整数拼接。如果你真的需要这样做，你需要使用另一种技术先将整数转换为字符串，然后再进行拼接。\n\
    \n"
- fmt: "\n# OBJECT ORIENTED PROGRAMMING IN PYTHON\n\n![Mobile Phone, Python, Programming\
    \ Language](Image00022.jpg)\n\n## Object and Class in Python\nPython supports\
    \ different programming approaches as it is a multi-paradigm. An object in Python\
    \ has an attribute and behavior.\n\n### Example\nCar as an object:\n- Attributes:\
    \ `color`, `mileage`, `model`, `age`.\n- Behavior: `reverse`, `speed`, `turn`,\
    \ `roll`, `stop`, `start`.\n\n### Class\nIt is a template for creating an object.\n\
    \n### Example\n```python\nclass Car:\n```\nNOTE: By convention, we write the class\
    \ name with the first letter as uppercase. A class name is in singular form by\
    \ convention.\n\n### Syntax\nclass Name_of_Class:\n\nFrom a class, we can construct\
    \ objects by simply making an instance of the class. The `class_name()` operator\
    \ creates an object by assigning the object to the empty method.\n\n## Object/Class\
    \ Instantiation\nFrom our class `Car`, we can have several objects such as a first\
    \ car, second care or SUVs.\n\n### Example\n1. Start IDLE.\n2. Navigate to the\
    \ File menu and click New Window.\n3. Type the following:\n```python\nmy_car=Car()\n\
    pass\n```\n\n### Practice Exercise\n- Create a class and an object for students.\n\
    - Create a class and an object for the hospital.\n- Create a class and an object\
    \ for a bank.\n- Create a class and an object for a police department.\n\n###\
    \ Example\n1. Start IDLE.\n2. Navigate to the File menu and click New Window.\n\
    3. Type the following:\n```python\nclass Car:\n    category=”Personal Automobile”\n\
    \    def __init__(self, model, insurance):\n        self.model = model\n     \
    \   self.insurance = insurance\nsubaru=Car(“Subaru”,”Insured”)\ntoyota=Car(“Toyota”,”Uninsured”)\n\
    print(“Subaru is a {}”.format(subaru._class_.car))\nprint(“Toyota is a {}”.format(toyota._class_.car))\n\
    print(“{} is {}”.format(subaru.model, subaru.insurance))\nprint(“{} is {}”.format(toyota.model,\
    \ toyota.insurance))\n```\n\n## Methods\nFunctions defined within a body of the\
    \ class are known as methods and are basic functions. Methods define the behaviors\
    \ of an object.\n\n### Example\n1. Start IDLE.\n2. Navigate to the File menu and\
    \ click New Window.\n3. Type the following:\n```python\ndef __init__(self, model,\
    \ insurance):\n    self.model = model\n    self.insurance = insurance\ndef ignite(self,\
    \ ignite):\n    return \"{} ignites {}\".format(self.model, ignition)\ndef stop(self):\n\
    \    return \"{} is now stopping\".format(self.model)\nsubaru=Car(“Subaru”,”Insured”)\n\
    print(subaru.ignite(\"'Fast'\"))\nprint(subaru.stop())\n```\nNOTE: The methods\
    \ `ignite()` and `stop()` are referred to as instance methods because they are\
    \ an instance of the object created.\n\n### Practice Exercise\n- Create a class\
    \ `Dog` and instantiate it.\n- Create a Python program to show names of two dogs\
    \ and their two attributes from `a`.\n"
