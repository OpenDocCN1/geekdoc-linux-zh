    感谢你读完了《Python 快速教程》（Python Crash Course）。希望这本书能为你提供丰富的信息，并无论你的目标是什么，都能为你提供实现目标所需的所有工具。


    本书的目标是为完全初学者介绍机器学习和数据科学。内容涵盖了主流机器学习范式，即监督学习、无监督学习、半监督学习和强化学习。它解释了通用的机器学习开发方法，以及如何开发神经网络（这是执行机器学习的一种特定方法）。它还教授了如何训练以及评估它们的准确性。


    `Python` 是一种广泛用于不同领域的编程语言，特别是在机器学习领域。本书涵盖了基础的 `Python` 编程，以及如何使用 `Python` 库进行机器学习的指南。书中通过使用真实数据集展示了机器学习应用，帮助你提升自己的
    `Python` 编程技能，并掌握通过书中获得的机器学习基础知识。这些应用展示了如何使用线性回归开发预测性模型、如何使用逻辑回归和人工神经网络开发分类器的示例。通过这些应用，书里还展示了使用
    `Python` 进行数据探索和可视化的示例。


    如今，机器学习已应用于每一个领域，例如营销、医疗保健系统、银行系统、股票市场、游戏应用等。本书的目标是让你对机器学习的重要分支有基本的了解，并理解人工神经网络背后的哲学。它还旨在为没有
    `Python` 或任何其他语言编程经验的初学者提供机器学习所需的 `Python` 编程技能。


    请记住，与程序员的普遍认知相反，深度学习相对容易。行业正在快速向顶层发展以控制机器。许多人坚定支持机器学习，但我有一些充分的理由深度学习比机器学习更有利。从实践上来说，深度学习是机器学习的一个子集。它通过学习存储在后端数据库中的世界来确保动力和灵活性。它运行在其隐藏学习架构之上，该架构由包含一些密集层的多层组成。数据通过这些层进行处理，神经网络将输入数据与后端数据库存储的数据进行匹配。每次匹配后，它们都会根据一些高效且管理良好的发现返回输出。


    一旦你掌握了技能并理解了书中介绍机器学习模型背后的原理，你就能使用这些技能通过机器学习来解决复杂问题。你也能轻松获得其他技能，并使用更高级的机器学习方法。在这份指南中，我向你解释了
    `Python` 语言的基础。学习编程就像学习另一种语言。它需要大量的耐心、学习、应用、方法、热情，最重要的是毅力。


    我建议的是尽可能多做练习，从重写本指南中找到的数百个示例开始。试着记住它们，并在书写代码时，在脑海中对自己说出来（左括号、右圆括号等等）。在开始时，这极地帮助我更好地记忆编写程序（即使是简单的程序）所需的各种步骤。


    当程序运行通同时，不要觉得自己像了英雄，最重要的是，当你找不到编程问题的解决方案时，千万不要感到沮丧。网络上充满了网站和博客，你总可以在那里找到解决方案。我希望这份指南对你学习
    `Python` 有帮助。

    '
