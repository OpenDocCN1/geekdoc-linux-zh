    ### 3. 点击后，你的下载应该立即开始。


    Miniconda![](img/Image00012.jpg) 在以下 URL `https://docs.conda.io/en/latest/miniconda.html`
    选择合适的操作系统并点击下载按钮。一如既往，下载应该开始，你可以继续按照安装过程进行。


    Anaconda Distribution![](img/Image00013.jpg)


    1. 所有操作系统的 Anaconda Distribution 下载部分位于 `https://www.anaconda.com/distribution/#download-section`，请选择你的操作系统。

    2. 点击版本 3 的 Download，下载应该立即开始。下载完成后运行安装程序并按照指示操作。


    ### 字典 (Dictionaries)

    字典是 Python 中存在的一种强大数据类型。它可以像列表一样存储索引值，但索引不是整数范围。相反，它们是唯一的键。因此，字典是一组键:值对的集合。和集合（sets）一样，字典无序的。键可以是任何不可变对象，如字符串、元组、整数或浮点数。


    #### 定义字典

    显式字典定义使用大括号和冒号![](img/Image00014.jpg)


    #### 为键赋值

    创建字典后，你可以通过键索引来分配值![](img/Image00015.jpg)


    #### 获取键和值

    字典拥有内置方法 `keys` 和 `values` 来获取当前存储的值![](img/Image00016.jpg)

    注意：记住字典不是一个有序对象。因此，不要期望其键或值是有顺序的，尽管在最新版本的 Python 中它们保持了插入顺序。


    #### 循环中的字典

    通常情况下，在迭代遍历字典时，你想要知道字典中的键:值对。`items` 方法在 `for` 循环中使用时会同时返回两个值![](img/Image00017.jpg)


    #### 字典推导式

    字典可以像列表推导式一样使用![](img/Image00018.jpg)


    #### 函数 (Functions)

    我们已经使用过多个 Python 编程语言内置的函数，例如 `print`、`len` 或 `type`。通常，定义函数是为了表示一组将被重复调用的指令。为了完成所需的任务，函数可能需要也可能不需要多个输入，这些称为参数（arguments）。![](img/Image00019.jpg)

    并非所有函数都需要参数，例如内置函数 `help`![](img/Image00020.jpg)


    ### 测试你的代码

    在 Python 编程语言中，有几种技术方法用于测试特定类型的代码。让我们进入通常涉及的实际方法：


    #### 自动化测试与手动测试

    探索测试（Exploratory testing）是一种在没有特定计划的情况下进行的手动测试，其中开发者只是在尝试探索实际的应用程序。为了完成定量的手动测试，开发者有义务列出某个应用程序包含的所有可用功能列表、通常接受的各种输入类型以及可能的预期结果。这样一来，每当某组程序发生变化时，开发者都必须回到自己的列表中，这种活动是如此乏味且令人不意的。这正是自动化测试发挥用场的地方。

    自动化测试是由脚本执行特定的代码集来代替特定人类。Python 语言通过一组工具和某些库，方便帮助开发者对其应用程序进行自动化测试。


    #### 单元测试与集成测试

    单元测试（Unit test）基本上是一种较小的测试，用于检查特定程序中的单个组件是否工作正常以实现其功能；而集成测试（integration test）是确保特定程序组涉及的所有组件都能良好工作的测试类型。单元测试和集成测试都可以在特定的程序中编写。

    测试运行器（Test runners）基本上是工具，它们获取包含单元测试和各种设置的特定程序的源码目录，执行它们，并将结果输出到日志文件或控制台。


    # 第 8 章


    ### Python 中的数据类型

    ![Code, Programming, Python](img/Image00021.jpg)

    每个程序都有某些数据，使其能够按照我们想要的方式运行和操作。数据可以是文本、数字或中间的任何内容。无论复杂还是像你喜欢的简单，这些数据类型都是机器中的齿轮，允许机制的其他部分连接并工作。Python
    拥有几种数据类型，与它的竞争对手不同，它不处理极其广泛的内容。这是好事，因为我们担心的更少，尽管有疏忽也能获得准确的结果。Python 的创建是为了让我们这些程序员的生活变得简单得多。


    #### 数字数据类型

    正如名称所示，Python 能够很好地识别数字。数字分为两类：


    - 整数（Integer）—— 不带任何小数点的正整数和或负整数。

    - 浮点数（Float）—— 具有小数点表示的实数。


