    除了列出的 Web 包的优点外，它们也有缺点：与普通应用程序相比，大多数认可的互联网包看起来很特殊。其目的是它们运行在浏览器内部。用户体验可能是非凡的，且不再被许多人所欣赏。为了能够遵守标准，Web
    包需要被编码，任何微小的修改都会防止互联网软件在任何浏览器中使用。Web 软件与服务器之间需要一种连接，以便其顺利运行。为了建立这种连接，你需要带宽。当连接并不总是充足时，你可能会遇到数据丢失或实用性大打折扣。


    大多数互联网程序依赖于托管它们的服务器。当服务器距离很远时，网络软件并不总是可用，然而传统的应用程序仍然可以运行。网络实用工具的总体控制权在主雇主手中。他们有权在他们觉得时创建新版本。当数据存储在远程端时，将其导出供其他程序使用可能会困难。Web
    应用程序允许组织跟踪用户的所有活动，因此会产生隐私问题。


    在此时，你需要了解互联网应用程序是如何工作的。大多数互联网程序是使用浏览器支持的语言编写的，如 `HTML` 或 `JavaScript`。首要目的是这些语言依赖浏览器来执行它们的程序。你需要意识到这些软件包中的许多是动态的，它们将需要服务器端的处理。其他的被认为是静态的，现在不需要服务器的任何处理。


    当你有一个互联网软件时，你会想要一个 Web 服务器来管理客户产生的所有请求。服务器将协助执行所有任务并存储记录和统计。软件服务器由 `ASP`、`PHP`
    和 `JSP` 组成。普通的 Web 实用工具有一个特定的流程：


    1. 用户触发一个指向 Web 服务器的互联网使用请求。可以通过 浏览器或应用程序的客户端界面完成。

    2. Web 服务器会将该请求转发给特定的 Web 应用程序服务器。

    3. 请求的项目可能会通过网络实用工具服务器执行；这包括查询数据库或处理信息以生成指定的结果。

    4. 结果将通过网络应用程序服务器发送到互联网服务器；这涉及到处理后的统计数据或指定的数据。

    5. 客户端从 Web 服务器接收响应；他们将获得请求的信息，它将显示在用户的屏幕上。


    网络应用程序有很多示例，包括购物车、文字处理器、在线表单、文档转换和扫描、在线表单以及如 `Yahoo` 和 `Gmail` 等电子邮件应用程序。


    ## 如何使用 Django


    Django 用于创建网络程序。它专门用于创建连接到数据库的 Web 软件。你还可以处理用户管理、适当的安全性和国际化。一些常见的网络包包括 `Disqus`、`Pinterest`
    和 `Instagram`。你可以将 `Django` 作为独立库使用，尽管这需要额外的工作。这就是为什么将其作为独立库使用并不总是真正用的用。


    `Django` 是通过响应用户请求的独特组件的混合体。第一步是请求-响应机制。主要的视图是获取并返回 Web 响应。`Django` 将接受所有 `URLs`
    的请求并将所有 `HTML` 事实返回给互联网浏览器。页面可以是简单的文本内容或更好的内容。互联网请求将通过 `URLs` 进入 `Django` 软件。任何
    `Django` 工具最简单的入口点是 `URLs`；开发者拥有操作已有的 `URLs` 的权限。当你访问 `URL` 时，`Django` 将允许查看。


    你所有的请求都可以通过使用 `views` 来处理。当访问 `URL` 时，`Django` 视图被认为是从 `Python` 生成的代码。`Views`
    是一些简单的东西，如向消费者返回文本。文本内容可以变得复杂。它可以是表单处理、信用卡处理和数据库查询。当 `view` 完成处理后，将向消费者发送一个互联网响应。当返回网络响应时，用户可以在浏览器中访问
    `URL`，他们将获得响应的访问。这可能是一个照片和文本混合的 `HTML` 网络页面，它们是使用 `Django` 的模板系统创建的。有了 `Django`
    事实，就有灵活性拥有额外的包。你可以使用你创建的创建一个简单的博客、销售应用程序或桌面程序。`Django` 框架由 `Instagram` 和 `Pinterest`
    等网站驱动。


    ## 用户账户


    用户账户位于社区服务器上，用于保存计算机的用户名、密码和任何相关的统计数据。当你拥有用户账户后，它将允许你或不再连接到其他计算机或网络。在一个有几个用户的网络中，你需要个人账户。用户账户的一个正确例子是你的电子邮件帐户。


    无论你使用的是什么工作设备，都有不同类型的个人账户。你可能跟踪、验证和监控所有服务。当你放入一个运行中的设备时，它会创建用户账户以便在安装后访问。安装后，你将拥有四个用户账户：设备账户、外部用户账户、普通和访客个人账户。


    * **系统账户**：这些是可能用于访问系统资源的账户。运行的系统将使用这些账户来确定服务是否允许访问资产。当它们被建立时，它们会创建相关的账户；在安装后，该账户可能访问所需的信息。如果你是网络或机器管理员，你可能不想知道任何关于债务的信息。

    * **超级用户账户**：此账户在工作设备中具有特权。在使用 `Windows` 时，该账户被称为 `Administrator` 账户。在使用 `Linux`
    时，该账户是 `root` 账户，工作设备将协助用户完成职责。任务如启动服务、开发和删除新用户账户、安装新软件以及更改系统文档。

    * **普通用户账户**：此账户没有许多权限，无法对设备主目录和文件进行修改。它们最简单的功能是授权的任务，如运行应用程序、创建文件和自定义变量。

    * **访客个人账户**：这是一个权限较低的账户；你将无法更改设备上的任何内容。该账户用于执行临时职责，如玩游戏、看电影或上网。使用 `Windows` 时，此账户可以在安装后创建；在
    `Linux` 中，你可能需要手动创建账户。


    接下来我们需要了解如何创建一个账户。 (此处原文结尾似乎不完整)


