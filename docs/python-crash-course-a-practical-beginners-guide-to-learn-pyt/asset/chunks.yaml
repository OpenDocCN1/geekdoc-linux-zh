    - `Integer`（整数）：不带小数点的正整数和/负整数。

    - `Float`（浮点数）：具有小数点表示的实数。


    这意味着，如果你使用 `100` 和 `100.00`，一个会被识别为整数，而另一个会被视为浮点数。那么，为什么我们需要两种不同的数字表示方式呢？如果你正在设计一个程序，假设是一个角色生命值为
    `10` 的小游戏，你可能希望程序表现为每当该角色受到攻击时，其生命值减少一或两点。然而，为了更精确一些，你可能需要使用 `float` 数字。现在，每次攻击可能不同，可能会从生命总值中扣除
    `1.5`、`2.1` 或 `1.8` 点。使用 `floats` 允许我们获得更高的精度，特别是在涉及计算时。如果你并不不在意准确性，或者你的编程只涉及整数，请坚持使用整数。


    # 第 11 章


    # 顶尖公司的编程语言与 Python


    ![Computer, Screen, Abstract, Colors, Rainbow, Wave](img/Image00024.jpg)


    Python 经常与其他解释型语言对比，例如 `Java`、`JavaScript`、`Perl`、`Tcl` 或 `Smalltalk`。与 `C++`、`Common
    Lisp` 和 `Scheme` 的联系同样具有启发意义。在这里，我将快速对比 Python 和所有这些方言。这些对比集中在每种语言从意义上提供了什么。编程语言的选择是一个非常重要的决定，通常由其他合理的因素组成，例如成本、可访问性、准备工作和以往经验，甚至是情感偏好。由于这些观点是非常主观的，在这种关系中过多考虑这些因素似乎是一项徒劳活动。


    ## Java


    Python 程序的运行速度通常比 `Java` 程序慢，但它们在创建时花费的精力也少得多。Python 程序通常比等同的 `Java` 程序短 3 到 5
    倍。这种差异归功于 Python 内置的不重要级别数据类型和它的动态类型。例如，Python 工程师不需要花时间来声明变量或表达式的类型，以及 Python
    极其强大的多态机制。此外，直接随语言提供丰富语法帮助的引用类型在几乎每个 Python 程序中都有用。由于运行时编译，Python 的运行时必须比 `Java`
    编程语言执行更密集的操作。例如，在评估表达式 `a+b` 时，它必须首先查找 `a` 和 `b` 上的以发现它们的类型，这在编译时是未知的。它随后收集相应的扩展操作，这可能是一个用户定义的重载方法。另一方面，`Java`
    可以执行成功的数字或浮点数扩展，但需要对 `a` 和 `b` 进行变量断言，并且不允许为自定义类的事件重载 `+` 运算符。


    因此，Python 是一个极其改进的“胶水”语言，而 `Java` 更好地被描述为低级应用语言。事实上，两者结合是一个极佳的组合。可以在 `Java` 中创建部分并合并到
    Python 中构建应用程序；Python 也可以用于演示部分，直到其方案可以在 `Java` 执行中被“固化”。为了帮助这种进度安排，用 `Java` 编写的
    Python 应用是一个进行中的，它允许从 `Java` 调用 Python 代码，反之亦然。在这种情况下，Python 源代码被建议转换为 `Java`
    字节码（借助运行时库来帮助 Python 的动态语义）。


    ## JavaScript


    Python 的“基于对象”子集通常与 `JavaScript` 相似。类似于 `JavaScript`（而不是任何地方像 `Java`），Python 支持一种使用基本函数和运算符而不参与类定义的编程风格。Python
    显然支持通过真正的对象编程风格构建更庞大的项目和更好的代码重用，其中类和继承承担了巨大的作用。


    ## Perl


    Python 和 `Perl` 起于相似的基础（它们都长期源自 UNIX 脚本语言），并拥有许多类似的特性，但工作方法有所不同。Perl 强调对基本应用级任务的支持，例如通过内置的正则表达式、文档过滤和报告生成功能来实现。Python
    强调对通用编程策略的支持，例如数据结构设计和模块化编程，并通过提供丰富但不过于神秘的文档来鼓励编程架构师编写清晰（因此具有实用性）的代码。因此，Python
    接近 `Perl` 但在其独特的应用领域很少超越它；无论如何，Python 的意义远超 `Perl` 的专长。


    ## Tcl


    像 Python 一样，`Tcl` 被视为一种应用开发语言，不仅仅是独立的编程语言。然而，`Tcl` 大部分将所有数据存储为字符串，在数据结构方面较薄弱，且执行普通代码比
    Python 慢得多。Tcl 在编写大型项目时同样需要包含的内容，例如显式命名空间。总之，虽然一个使用 `Tcl` 的“标准”大型应用通常包含用 `C` 或
    `C++` 编写的该应用可见 `Tcl` 扩展，但类似的 Python 应用通常可以用“纯 Python”编写完成。纯 Python 开发比编写和调试 `C`
    或 `C++` 编程语言部分快得多。人们说 `Tcl` 的唯一价值在于 `Tk` 工具箱。Python 已经获得 `Tk` 作为其标准的 GUI 部分库。`cl
    8.0` 通过提供对字节码编译器有限的数据类型支持来监控速度问题，此外它还合并了命名空间。无论如何，它目前仍然是一种非常基础的动态编程语言。


    ## Smalltalk


    Python 和 `Smalltalk` 之间最显著的区别可能是 Python 更为“标准”的语法，这使其在工程师设计方面处于优势。像 `Smalltalk`
    一样，Python 具有动态和强制组合，并且 Python 中的一切都是对象。Smalltalk 的变量数据类型标准库在不断完善，而 Python 的库有更多工作来处理互联网和
    WWW 真实组件，例如电子邮件、HTML 和 FTP。Python 在改进的条件和代码流方面有不同的工作方法。Smalltalk 大多拥有一个包含环境和客户端程序的稳固“系统映像”，而
    Python 将标准模块和客户端模块分别存储在特定的文件中，这些文件可以在不进行非常显著扩展的情况下重构或传递到结构之外。结果是，将图形用户界面 (GUI)
    连接到 Python 程序有许多选择，因为 GUI 并没有与结构固化。


    ## C++


    几乎适用于 `Java` 的话也适用于 `C++`，而且程度更高：由于 Python 代码通常比等同的 `Java` 代码短 3 到 5 倍，它通常比等同的
    `C++` 代码短 5 到 10 倍！事实证明表明，一个 Python 编程工程师可以在两个月内完成两个 `C++` 工程师一年都无法完成的工作。Python
    作为一种胶水语言出现，用于合并用 `C++` 编写的部分。


