    # 机器学习


    ![Tech, Circle, Technology, Abstract, Science, Space](img/Image00007.jpg)


    这将是我们数据分析中不可或缺的一部分，因为它帮助我们在这个过程中处理我们想要控制的某些算法和模型。通过机器学习的帮助以及我们之前谈过的 `Python` 语言的使用，我们能够看到算法的实际运行，并在此过程中完成我们想要进行的一些洞察和预测。为了帮助我们理解为什么机器学习对我们的数据分析有用，我们需要首先近距离观察机器学习最初是如何运作的。


    ## 什么是机器学习？


    我们首先需要查看的是机器学习的基础知识。这是我们在进行数据分析时可以使用的方法之一，它能帮助教计算机如何自主学习和做出反应，而不需要程序员的交互。我们将训练系统执行的许多动作将与人类自然而然具备的动作非常相似，例如从经验中学习。机器学习自带的算法将能够利用计算方法直接从数据中学习信息，而不需要依赖预先定义的方程作为其模型。随着我们用于学习的样本数量增加，这些算法将自适应地提高自身的的一些性能。


    随着各行业可用大数据的兴起，我们发现机器学习将成为解决许多领域大量问题的大技术之一，包括以下领域：


    1. **计算金融**：这将包括算法交易、信用评分和欺诈检测。

    2. **计算机视觉及图像处理的其他部分**：这可以用于目标检测、运动检测和人脸识别等不同领域。

    3. **计算生物学**：这将用于许多不同的领域，包括 DNA 测序、药物发现和肿瘤检测。

    4. **能源生产**：这可以帮助一些不同的操作，如负载预测和预测价格走向。

    5. **制造业、航空航天和汽车**：在帮助许多方面（包括预测性维护）方面这是一项非常棒的技术。

    6. **自然语言处理**：这将是我们利用机器学习来帮助语音识别应用的方式。


    机器学习及其控制的算法将通过在数据中寻找一些你可以使用的自然模式来工作，包括以一种帮助我们在沿途中做出更好预测和决策的方式使用。企业和许多不同的公司每天都会使用这些技术来做出许多关键决策。例如，医疗机构可以使用此来帮助他们诊断患者。我们发现，还有许多媒体网站将依赖机器学习，从数百万种潜在选项中进行筛选，以便为用户提供建议。


    你的业务能够考虑使用机器学习有许多原因。例如，如果你正在处理一项复杂的任务，或者涉及大量数据和大量变量的任务，但目前没有现成的方程或公式可以处理它，那么它将非常有用。例如，我们想要使用机器学习的一些情况包括：


    1. 手写且复杂到无法处理的方程和规则。这可能包括一些如语音识别和人脸识别的选项。

    2. 当你发现规则在不断变化时。这可以在从大量交易记录中进行欺诈检测等操作中看到。

    3. 当你发现数据的性质不断变化，且程序必须沿途中能够适应时。这可以在我们进行能源需求预测期间的购物趋势预测甚至自动交易时看到，仅举一角。


