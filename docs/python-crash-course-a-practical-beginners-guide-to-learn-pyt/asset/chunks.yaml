    # 客户定位与细分


    为了让广告机构能够以更高水平的个性化触达客户，它们需要针对日益细化的细分领域进行定位。这种人为的脑力创新可以利用当前的客户信息，并针对“最高质量水平”的准备数据集训练机器学习算法，以识别普通属性和关键因素。信息细分可以像区域、性取向和年龄那样基础，也可以像购买者的画像和过往行为那样复杂。通过人工智能，`Dynamics
    Segmentation`（动态细分）触手可及，这代表了客户的行为是不断变化的，个人在不同情况下可以承担不同的角色。


    ## 交易与营销预测


    在推广领域，计算机推理最清晰的应用之一是在交易方案的推进和广告效果评估模型中。海量的量化数据（例如点击、购买、邮件响应以及在网站页面上的停留时间）为 AI
    算法提供了训练资产。市场上的部分核心业务和创意组织包括 `Sisense`、`RapidMiner` 和 `Birst`。广告机构不断在改进他们的营销活动，在人工智能和机器学习的帮助下，他们可以预测营销活动或电子邮件营销活动的效果。人工智能可以分析过去的交易数据、财务趋势以及行业关联，以预测短期和长期交易执行情况并估计交易结果。业务预测模型指导了产品需求的估计，并帮助组织通过处理其创意来提升交易。


    ## 自动广告投放


    随着计算机推理技术的出现，基于程序的广告投放和侧重已变得越来越有效。自动广告可以被描述为“向市场买卖广告库存的机械化过程，该过程将广告主与分销商连接起来”。为了在网络社交平台、手机以及电视上允许股票持续投放，使用了人工智能技术。这同样回到了预测性分析，以及显示以前只能通过事后解决的信息的能力。人工智能可以帮助决定特定促销的最佳时机、广告转化为交易的概率、客户的反应程度以及与广告互动的概率。


    自动化机构可以收集并研究访问客户的统计和行为，以优化当前的活动并更准确地针对人群。自动媒体购买包含了“兴趣侧阶段”的使用（以鼓励在公开市场购买广告库存的方式）和“数据执行者阶段”（为营销组织提供触达其目标兴趣群体的能力）。为了让营销代表能够针对其目标客户做出明智决策，数据执行者阶段旨在收集和分析海量的网站“行为数据”。例如，由
    `Facebook`、`Twitter` 和 `Google` 等渠道实践的网页搜索引擎营销 (`SEM`) 广告。为了有效地管理大量的网站和应用观察者，自动广告提供了相对于竞争对手的关键优势。`Google`
    和 `Facebook` 充当高效且强大广告的最佳质量水平，并配备了词汇，提供了一个易于理解的平台，将允许非专业的广告机构在网上启动、运行和衡量他们的驱动程序和活动。


    ## 视觉搜索与图像识别


    基于人工智能的图像识别和分析技术的长期进步已经带来了不可思议的视觉搜索功能。随着 `Google Lens` 等技术和 `Pinterest` 等平台的出现，人们现在能够利用视觉搜索功能发现外观上相似的结果。视觉搜索的工作原理类似于传统的文本组合搜索，它会显示具有相似主题的结果。大型零售商和营销机构正日益利用视觉搜索来提供更好且更有吸引力的客户体验。视觉搜索可用于改进营销，并根据物品风格而非买家的过往行为或购买记录提供产品建议。


    `Target` 和 `Asks` 在其电子商务网站的视觉搜索技术开发方面做出了巨大投入。2017 年，`Target`报告了一项感兴趣的合作，允许将 `Pinterest`
    的视觉搜索应用“Pinterest 点”集成到 `Target 的移动应用程序`中。因此，客户在城市到处时可以拍摄他们想购买的物品照片，并在 `Target
    的在线购物网站`上找到类似物品。实际上，由 `Asks` 驱动的名为“Asks'' Style Match”的视觉搜索应用允许客户在 `Asks` 网站或应用程序拍摄或传输照片，并搜索他们的商品目录以寻找比较物。这些工具吸引客户进入零售商处购买他们可能在杂志上看到或在逛街时看到的物品，帮助他们寻找完美的物品，无论他们是否完全不知道该物品是什么。


    图像识别极大地帮助营销组织通过网络社交媒体扩大优势，允许他们发现其图像 Logo 和物品的各种用途，同时对视觉模式保持警觉。这种奇妙的现象被称为“视觉社交调优”，它允许组织识别并在任何情况下客户何时以及如何与他们的图像、Logo
    和产品进行互动，即使该组织没有直接通过名称被提及。


    ## 营销与广告


    由于大数据数据分析而产生的 AI 算法可以轻松地使用文字、图片和视频片段作为数据源进行训练。它将能够从这些源中提取文章和观点，并建议有效的营销和广告策略。例如，`Alibaba`
    开发了一个名为“Laban”的工具，与人类创作者相比，它可以极快地制作横幅。2016 年，针对中国在线购物盛宴“双十一”，`Laban` 以每秒 8000
    个横幅设计的速度生成了 1.17 亿个结构。


    “二十世纪影业”与 `IBM` 合作利用其 AI 框架“Watson”来制作他们的惊悚电影《机械》的预告片。为了获得标准惊悚预告片中应该出现的合适的片段或片段，`Watson`
    被训练以分组和检查来自一百多部电影的各种媒体和其他片段。这种准备让 `Watson` 在短短 24 小时内制作出了六分钟钟的电影预告片，而这需要人类专家几周的时间。通过利用机器学习、计算机视觉、自然语言处理和预测性分析，营销流程可以通过
    AI 营销阶段实现指数级加速。例如，由 Albert Intelligence Marketing 创建的人工智能营销阶段可以自动生成画板策略、制作定制安排并执行人群聚焦。


