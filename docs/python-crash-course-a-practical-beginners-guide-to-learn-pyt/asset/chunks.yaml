    为了了解 Scikit-Learn 库是如何用于改进机器学习的，让我们利用“来自 IBM Watson 仓库的销售胜负情况信息索引”，该索引包含了从某汽车配件供应商的交易争夺中获得的信息。我们将构建一个机器学习模型，以预测哪些交易将成为胜者，哪些将带来不幸。该信息索引可以通过
    `Pandas` 导入，并利用 `Pandas` 方法进行调查，例如 `head()`、`tail()` 和 `types()`。将利用 `Seaborn`
    的绘图程序来可视化这些信息。为了处理这些信息，将使用 Scikit-Learn 的 `preprocessing.LabelEncoder()` 以及 `train_test_split()`
    将数据集划分为准备子集和测试子集。为了从我们的信息索引创建预测，将使用三种独特的算法，具体来说是“线性支持向量分类和 K-近邻分类器”。为了思考这些算法的性能，将使用
    Scikit-Learn 库的 `accuracy_score` 程序。模型的得分可以通过 Scikit-Learn 和 `Yellow brick` 视觉进行可视化。


    ### 导入数据集


    要导入“来自 IBM Watson 存档的销售胜负情况信息索引”，第一步是通过 `import pandas as pd` 引入 `Pandas` 模块。此时，我们定义一个变量
    `URL` 为 `"https://community.watsonanalytics.com/wp content/transfers/2015/04/WA_Fn-UseC_-Sales-Win-Loss.csv"`，用于存储下载信息索引的
    URL。


    目前，将利用 `read_csv() as sales data = preds(URL)` 程序来读取由 Pandas 模块提供的上述“csv 或逗号分隔”记录。该
    csv 记录将被转换为 Pandas 数据结构，结果为因子 `sales data`，系统将存储其中。


    对于新的 `Pandas` 用户，上述引用代码中的 `pd.read_csv()` 方法将产生一个名为 `information system` 的普通数据结构，其中主部分包含每行的记录，主行中每个分段的名称是从数据集中获得的底层分段名称。在上面的代码段中，`business
    information` 变量的结果产生如下图所示的表格。


    在图表中，“row0, row1, row2”代表单个记录列表，而“col0, col1, col2”代表信息索引中单个分段或亮点的名称。通过这种方式，你有效地存储了数据集的副本并将其转换为了
    `Pandas` 系统！现在，利用 `head() as Sales_data.head()` 程序，可以像下面所示显示数据结构中的记录，以获得信息索引中包含的数据的“初步感受”。


    ### 数据探索


    由于我们已经有了信息索引的副本，并且该副本已转换为 `Pandas` 数据结构，我们可以快速调查信息，以理解从中可以汇总出什么数据，并据此合理设计策略。


    在任何机器学习项目中，数据调查通常是一个非常基础的阶段。事实上，即使是快速的数据集调查也能提供提供关键数据，这些数据在其他情况下可能无法察觉，而且这些数据可以提出值得关注的问题，随后我们可以通过项目尝试回答。


    这里将使用一些外部 Python 库来帮助我们处理信息，以便我们能用 Scikit-Learn 的强大算法有效利用利用这些信息。事实上，`(head)` 非常适合执行比显示记录多多的操作，并重做
    `head()` 程序来仅显示选定的记录，如 `sales data.head(n=2)`。此命令将专门显示数据集中的前 2 条记录。快速扫一眼显然，例如“Supplies
    Group”和“Locale”分段包含字符串信息，而例如“Opportunity Result”、“Opportunity Number”等分段则包含整数属性。同样可以看到，在‘Opportunity
    Number’分段中每条记录都有唯一的标识符。相应地，要显示表格底部的选定记录，可以使用 `tail() as sales data.tail()`。


    要查看数据集中可用的各种信息类型，可以使用 Pandas 方法 `dtypes() as sales data.dtypes`。通过这些数据，可以记录数据结构中可用的信息分段及其各自的信息类型。我们可以理解，例如，“Supplies
    Subgroup”分段是一个“object”（对象）信息类型，而“Customer Size by Revenue”分段是一个“整数型”信息类型。因此，我们对包含数值属性或字符串信息的分段有了理解。


    ### 数据可视化


    现在，我们已经完成了基础的数据调查步骤，因此我们将尝试制作一些有趣的图表来从外部描述数据，并从我们的数据集中发现其他隐藏的故事。在所有提供数据表示特性的可用
    Python 库中，`Seaborn` 在其他可用选项中脱颖而出，因此我们将使用它。确保你的框架上已经安装并适用于通过 `Seaborn` 提供的 python
    绘图模块。现在按照下面的步骤创建数据集所需的图表：


    - **阶段 1**：使用命令 `import seaborn as sns` 导入 `Seaborn` 模块。

    - **阶段 2**：使用命令 `import matplotlib.pyplot as plt` 导入 `Matplotlib` 模块。

    - **阶段 3**：将图表的“背景颜色”设置为白色，使用命令 `sns.set(style="whitegrid", color-codes=True)`。

    - **阶段 4**：设置所有图表的“尺寸”，使用命令 `sns.set(figsize=(11.7,8.2))`。

    - **阶段 5**：创建所需的图表，使用命令 `sns.countplot(data=sales data, hue=''Opportunity Result'')。

    - **阶段 6**：移除顶部和底部边缘，使用命令 `sns.despine()`。

    - **阶段 7**：显示图表，使用命令 `plt.show()`。


    快速回顾 - 首先导入了 `Seaborn` 和 `Matplotlib` 模块。后续关注 `blue` 对应 `won`，`green` 对应 `misfortune`。


    ### 数据预处理


    从数据调查步骤中，我们设定数据集中大部分分段都是“字符串信息”，然而 Scikit-Learn 只能处理数值信息。幸运的是，Scikit-Learn 库为提供了许多将字符串信息转换为数值信息的方法，例如
    `LabelEncoder()` 程序。为了将信息索引中的直接名称（例如“won”和“misfortune”）转换为数值属性，我们将使用 `LabelEncoder()`
    方法。


    为了知道编码是如何培养的，我们来快速体验一个模型。下面的代码包含了城市列表的字符串信息，例如 `["paris", "paris", "tokyo", "amsterdam"]`，它们将被编码为类似于
    `[2, 2, 1,3]` 的内容。


    - **阶段 1**：导入必要的模块，使用命令 `from sklearn import preprocessing`。

    - **阶段 2**：创建 Label 编码对象，使用命令 `le = preprocessing.LabelEncoder()`。

    - **阶段 3**：将未处理的分段转换为数值属性，使用命令：


    ```python

    encoded_value = le.fit_transform(["paris", "paris", "tokyo", "amsterdam"])

    print(encoded_value) [1 1 2 0]

    ```


    此外，你就是这样！我们只是将我们的字符串信息名称转换成了数值属性。


