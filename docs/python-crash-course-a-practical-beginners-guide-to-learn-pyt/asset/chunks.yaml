    # 从零开始学习 Python！！Python, Python 图标, Python 编程


    在购买这本书之前，你可能已经意识到 Python 有多重要以及需求有多大了。我们之前也读到了一些关于它的内容，并看到它是如何超越许多主流编程语言的。我们通过了一个分步指南，下载了
    `Python 3`、集成开发环境或文本/代码编辑器并设置了所有内容。最后，你创建了你的第一个程序：干得好！


    现在，是时候停止停留在表面，开始深入探索 Python 的世界了。Python 有太多的组件和方面需要学习，但我们将只关注对任何初学者来说必须知道和学习的核心内容。将此视为任何其他语言的语法吧。没有语法，语言听起来就像是破碎的，Python
    也是如此。


    ## 初识 Python


    让我们从下面的程序开始：


    ```python

    print("I made it!")

    print("======")

    print("If I only knew it would be this easy")

    print("======")

    print("I would have taken up Python ages ago")

    print("======")

    ```


    我们使用了 `print` 命令将我们的消息打印在控制台框中作为程序的输出。将 `print` 称为命令在技术上是不正确的；它是一个函数。虽然我们稍后会详细介绍函数和方法，但现在，只需记住函数是命令名称，后面跟着括号
    `()`，括号内可以是空的，也可以包含某种类型的数据。它们有预先定义的 set 参数，这意味着某些函数只能接受特定类型的数据。


    在上面的示例中，我们使用的仅仅是单纯的文本。用几个字母创建一个消息，就此而已。在 Python 中，工作方式有所不同。文本不会被识别为文本。我们需要告诉 Python
    我们想将这些内容作为文本打印出来。我们怎么做呢？我们使用单引号或双引号，这允许 Python 理解引号内的任何内容都是文本，它需要按原样将其打印出来。


    我打赌你们中的大多数人可能没有注意到所有行都是以小写的 `p` 开头的而不是相反。啊，是的！既然你注意到了，让我告诉你是为什么要那样做。Python 是一种区分大小写的语言。它将一切都视为字符，而不是字母或文本。这意味着小写的
    `p` 与大写的 `P` 不是同一个字符，以此类推。


    `Print`、`PRINT`、`print`、`PrinT`、`RINt` 所有这些会被 Python 区别对待，对于打印目的，除了 `print` 之外，这些都完全不起作用，因为它是输出的标准方式。


    在 Python 中命名任何内容，我们通常对单单词命令使用小写。这并不是 Python 独有的，因为每种语言都有某种标准方式来编写代码。让 Python 与不同的是在命名规范上投入了大量的思考，使得代码更易读。记住这一点，对于任何超过一个单词的内容，你可以使用几种方法，如此处所示：


    - `last_name`

    - `LastName`

    - `lastname`

    - `LASTNAME`


    在大多数情况下，我们将使用第一种方法，即每个字母都以小写开头。对于包含多个单词的组件，我们将使用下划线来分隔它们。排在其后的通常只用于类（classes）。在此时，你不需要担心什么是类。只需要记住首字母大写且没有下划线的单词是
    `驼峰命名法`（Camel Case）的示例，用于类。


    接下来是我们命名包（packages）的方法。在这里，所有单词都以小写字母开始和结束，并且它们之间没有下划线。完全相反的，是我们的最后一项，它用于定义常量（constants）。在这里，所有字母都是大写的，且没有下划线分隔单词。


    无聊，对吧？我懂！但这是你可能想要记住的，因为我们将进行很多这类操作。你应该知道在什么时候使用哪种规范，因为这极大地提高了代码的可读性。Python 的整个重点是提高代码的可读性，如果我们违背了这一点，那么学习
    Python 就没什么意义了。


    现在我们已经涵盖了这些，让我们开始讨论 Python 内部运行的数据类型。没有这些，任何编程语言都无法运行或工作。它们是我们用作输入的内容，并根据我们的意愿相应引导程序。


