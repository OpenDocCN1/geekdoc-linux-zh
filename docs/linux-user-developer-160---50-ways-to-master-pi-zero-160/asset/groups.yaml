    \n- Wi-Fi\n  Raspberry Pi B+ 内置了 Wi-Fi。\n\n# 50 种掌握树莓派的方法\n\n## 通过这些专家技巧和技巧充分利用你的树莓派性能\n\
    \n无论你只是刚刚幸运地获得了一台强大且小巧的 Raspberry Pi Zero，还是希望最大化你已有的那台可靠的 Raspberry Pi 的效率，这里有你入门并了解你设备所需的所有内容。树莓派是一件多功能的硬件，大多数人已经对它的日常功能了如，但总有许多可以探索的微调和调整，可以将树莓派带到你自己的理想体验。\n\
    \n从焊接到实用的 Python 特性，从 GPIO 中断到远程访问等等，这门技术和实操技能大师课程涵盖了五十 种充分利用树莓派的有用方法。如果你和我们一样，无论你的技能水平如何，你已经在摆弄\
    \ Raspberry Pi Zero 了，这些技巧对你来说依然可以大显身手。\n\n每一个技巧都适用于你的树莓派，但对于 Pi Zero 相关的板型除外。使用较早型号的你可能会错过一些功能——我们怎么能指望在没有它们的情况下拥有功能呢？——大多数技巧、窍和微调仍然适用于任何官方树莓派。玩得开心吧！\n\
    \n# Raspberry Pi Zero\n\n无引脚端口。GPIO 针脚与新机型相同，但没有引脚。你需要焊接一个 40 针的公头针脚块。\n\nBCM2835\
    \ 这是与原始树莓派型号相同的处理器，尽管它已过频运行在 900MHz，且运行速度快了约 40%。\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_60_0.png)\n\
    \n作为树莓派的最新成员，这块微型板子是树莓派基金会努力进一步降低电脑成本的成果。虽然没能将这台 35 美元的电脑降到 25 美元（这对某些人来说仍然有点贵），但通过一些调整直接削减了\
    \ 5 美元。以下是你需要了解的。\n\nMini-HDMI 你需要一根 mini HDMI 转 HDMI 的线来连接显示器。如果你焊接了引脚，可以使用带有\
    \ RCA 视频输出的电视。\n\nMicro-USB 其中端口之一用于 micro-USB 电源。你可以通过 micro-USB 转 USB 适配器使用外围设备和\
    \ wifi，从而连接一个带电源的 USB 集线器。\n\n# 核心知识\n\n提高日常使用的必备技巧\n\n- 03 在网络上寻找你的 pi \n  如果你无法通过\
    \ DHCP 在路由器上找到它，可以使用 Linux、Windows 和 Mac 扫描本地网络。你需要知道本地网络的地址范围（常见网络为 192.168.1.0\
    \ 或 192.168.2.0），运行 `nmap -sn 172.17.1.0/24` 将执行 ping 扫描并输出设备列表。示例输出：\n\n```\n\
    Nmap scan for raspberrypi.local (172.17.1.0/24)\nHost1 is up (0.04ms latency).\n\
    ```\n\n- 04 遇到稳定性问题？\n  导致稳定性问题的最高原因是你使用的电源。Raspberry Pi 2 拥有更多的 CPU 核心并消耗更多能量。Raspberry\
    \ Pi 2 或 B+ 的推荐电流供应为 2 安培。如果你仍然遇到问题，你的 SD 卡可能已经老化了。\n\n- 05 忘记输入 sudo 了？\n  sudo\
    \ 用于获取特定命令的权限（例如，`sudo apt-get update`）。变量 `!!` 是你上一次使用的命令。如果你需要某些操作的权限但忘记输入 sudo，只要你没有输入其他内容，只需输入\
    \ `sudo !!` 即可。\n\n- 06 开启最大电流\n  如果你有一个能提供 2 安培或以上的良好电源，并希望为你的 Pi 2 或 B+ 连接大耗电设备（如\
    \ USB 硬盘），你可以编辑 `/boot/config.txt` 文件，这将将 USB 的最大电流设置为 2 安培，而不是默认的 600mA。\n\n\
    - 02 确保你的树莓派上有最新的软件包\n  在终端中运行 `sudo apt-get upgrade`。\n\n控制选项 `sudo raspberry-config`\
    \ 可用于更改多个选项，例如启用摄像头、对 Pi 进行超频、更改启动选项以及将文件系统扩展到 SD 卡的全空间。\n\n# 可迁移技巧\n\n充分利用任何树莓派机型的提示和关键信息\n\
    \n- 使用 SSH 远程访问\n  SSH 代表 Secure Shell（安全外壳）。你可以使用 SSH 通过本地网络连接到树莓派上的终端。这意味着你只需要连接网络线和电源线即可使用\
    \ Pi，这要要得多。如果你在树莓派上连接了屏幕和键盘，你可以使用默认用户名 'pi' 和密码 'raspberry' 登录。Linux 和 Mac 内置了\
    \ SSH，只需打开终端并输入你 Pi 的地址即可。在 Windows 上，你可以使用 SSH 客户端 PuTTY，它是免费下载、无需安装且可以在几秒钟内完成设置的。\n\
    \n```\npi@raspberry:~$ \npi@192.168.1.15:~$ sudo raspberry-config\n[1] Interface\n\
    [2] Localization\n[3] Advanced\n[4] Performance\n[5] Password\n```\n\n- 使用 SCP\
    \ 传输文件\n  SCP 代表 Secure Copy Protocol（安全复制协议），允许你通过网络从树莓派拷贝文件（和目录）。如果你有一个 PyGame\
    \ 项目并需要拷贝，FileZilla 是一个不错的选择，因为它连接端口 22，用户名为 'pi'，密码为 'raspberry'。在终端中使用语法如下：\n\
    \n```\nscp -r testdir/ pi@172.17.1.21:~/testdir\n```\n开关 -r 表示递归，意味着整个目录。\n\n\
    # Raspberry Pi B+\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_61_0.png)\n\n- USB\
    \ 控制器\n  Pi 理论上可以达到 480MB/s。早期型号受限于单核 ARM。\n\n- 电源 LED\n  板载 LED 有红色和绿色。状态 LED\
    \ 在写入时会闪烁。\n\n- SD 卡\n  树莓派专为 SD 卡设计。状态 LED 在写入时闪烁。\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_61_0.png)\n\
    \n- Wi-Fi\n  Raspberry Pi B+ 内置了 Wi-Fi。\n\n"
