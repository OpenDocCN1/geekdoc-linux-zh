    # 教程


    # 编写一个《星际大战》克隆版

    在 FUZE BASIC 第二部分


    # 在 FUZE BASIC 中重制经典游戏

    深入编程世界


    为此需要安装该软件，Linux 和树莓派用户可以从 https://www.filesilo.co.uk/ 下载。


    欢迎来到 FUZE BASIC 教程的第二部分。你需要 FUZE BASIC。


    别担心；你可以跳过第一部分直接进入主题。不过，由于这是一个相当大的程序，你可能需要从 FileSilo 或这里下载程序列表：https://www.fuze.co.uk/tutorials/73MP357TPART2.fuze。


    73MP357 由 Luke Mulcahy 编写，他是 FUZE 的驻留程序员，在最客气的说法中，我们我们我们极具人味的超级计算机。这一期他在他温和的结构的基础上更进一步，添加了各种令人惊喜的精彩内容。这包括简单的评分系统、道具、敌人以及所有最棒的威力。游戏体验也通过流畅的移动得到了改进。简而言之，你将获得一个基础但绝对可玩的游戏所需的一切。


    # 你需要什么


    - FUZE BASIC V3 (fuze.co.uk/getfuzebasic)

    - 73MP357PART2.fuze


    Luke Mulcahy 是 FUZE 团队的内部程序员。15 岁的 Luke 活跃于多种编程语言，尽管他加入 FUZE BASIC 的节奏与众不同。


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_75_0.png)

    ![](img/df5857e82a6482b0f2db5a2e61e6012c_75_1.png)

    ![](img/df5857e82a6482b0f2db5a2e61e6012c_75_2.png)


    # FUZE BASIC


    ## 01 获取第二部分代码


    启动 FUZE BASIC，并加载（使用 FB 命令）`73MP57PART2.fuse` 或从编辑器和模式将代码复制到 IF2 基准编辑器中。如果你遵循第一部分的步骤，你将对目前的进展感到满意。按下
    F3 或在新窗口中运行程序。


    ## 02 测试


    你会注意到我们有一个分数基准。按下空格键并向左、向右移动。如果你发射，长按一秒钟，你还将获得重要的“强化（Power Up）”，在其中基准会随着粒子（Particle）增加。激光也会变成敌人，更重要的是，如果你触碰到它们，它们将摧毁你并停止程序，然后按
    F2。我们将简要介绍上个月创建的部分，并对新添加的内容提供更多详细说明。


    ## 03 设置环境（第 021-027 行）


    我们的初始设置了几几个变量。有多个变量用于分数、帧率、minfps 和 maxfps。它内置了一个非常动态的分分辨率功能，可以根据帧率调整（分辨率）最大值。你可以看到屏幕在调整，直到它将分辨率限制在帧率内。如果它达到
    60fps，则会使用延迟来保持稳定。我们将在项目稍后回到这里，届时你将找到用于同步改变帧的函数。这些变量贯穿始终。


    ## 04 设置地板（第 028-042 行）


    星场是在上个月创建的，但这里创建了三个相对数组来存储 100 颗星星的位置和角度。数组由随机初始值填充。


    ## 05 激光变量（第 043-059 行）


    好东西。设置了几个数组来存储每个激光的分数和移动位置。`LaserReload`（一个整数）在第 53 行设置为 2，创建了帧同步的第一部分。这是为了防止激光跟不上帧的速度，它们将以相同的速度重新加载。


    ## 06 敌人变量（第 056-069 行）


    如果我们无法利用激光来供应大量追随某些移动路径或你的敌人，那么拥有激光也没有意义。不过，只设置了几个数组来存储敌人的角度、距离（离中心距离）和速度，但额外增加了一个变量（`enemyhealth`），以便让不同的武器产生不同的结果。


    ## 07 威力和道具（第 070-085 行）


    我们在这里处理变量，如激光角度、分数以及道具的颜色和时长。


    ## 08 主循环（第 087-137 行）


    这是主循环。我们开始检测屏幕按键按下。在这里我们设置了 A 以及左侧和右。


    ## 09 释放道具（第 189-190 行）


    我们从单发激光开始游戏。只有在我们没有强化时，才会释放道具。此函数通过 `Laser=FALSE` 进行检查，然后释放一个新道具，并初始化所有变量。


    ## 10 移动道具（第 157-160 行）


    接下来它通过 `powerupDist = powerupDist + (radius)` 向玩家移动。


    ## 11 获取道具（第 161-174 行）


    如果是这样，如果它位于边缘且 `Laser=TRUE`，则它与玩家的位置相同（`playerAngle = gap / 2`）。


    ## 12 调整速度（第 175-186 行）


    这决定了帧的速度。


    ## 13 产生敌人（第 195-207 行）


    如果我们在边缘且 `Laser=TRUE`，则它与玩家的位置相同。`enemyhealth` 被额外增加，以便让不同的武器产生不同的结果。


    ## 14 绘制星星（第 208-231 行）


    星场是在上个月创建的，但这里创建了三个相对数组来存储 100 颗星星的位置和角度。数组由随机初始值填充。


    ## 15 绘制显示场（第 232-251 行）


    我们在上个月介绍过这个，现在变化不大。基本上，显示场是围绕圆周绘制的。


    '
