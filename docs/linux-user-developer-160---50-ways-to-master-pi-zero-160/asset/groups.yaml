    # Master Ras Pi


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_66_0.png)


    # Five-minute practical fixes


    Quick and easy things you can try in a few minutes


    ```

    HOLD DC DC AUTO S9u 200

    2V 2V 1MS

    UV:9.600V AT+=6.6ms Ubt

    ```


    Above are two waves with duty cycles of roughly 80% (top) and 20% (bottom)


    You should only draw a few milliamps from the GPIO pins of the Raspberry Pi. If
    you need more current than that you need to switch a higher voltage, use a transistor
    connected to a stronger voltage source.


    +   - Need more current?


    # Pulse modulation


    +   - Disable built-in sound card


    Pulse modulation is when the output of the GPIO is high for a percentage of time
    and low for the remainder of time. The percentage of time where the pin is high
    is called a duty cycle. Pulse modulation is used when it comes to control the
    brightness of LEDs. To do this with pulse modulation,


    ```

    sudo rm /etc/modprobe.d/alsa*

    sudo edit /etc/modules

    ```


    # Using a push-button


    Change-and-bcm2835 to #snd-bcm2835 and save, then reboot.


    Refer to the circuit below. When the button is pressed, the left pins are connected
    to the right pins. By using a 1k pull-down resistor connected to ground, the output
    (connected to a GPIO pin) will be low when the button is not pressed. The right-hand
    side of the button is connected to 3.3, so the output will be connected to 3.3.
    The left-hand side is in parallel with the LED, and also the 10k resistor to ground.
    Because electricity takes the time of resistance, the pulse signal will output
    3.3V.


    ```

    GPIO.setup(5, GPIO OUT)

    # Frequency of 58Hz

    # 50 percent duty cycle

    GPIO.start(5)

    # Do not work or have we

    # program don''t exit

    # Pulse width

    GPIO.change_cycle(5)

    5.stop()

    ```


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_66_1.png)


    # GPIO interrupts


    # Use a multimeter to verify orientation


    An interrupt is when a hardware event triggers an interrupt on the GPIO, causing
    it to stop what it is doing and run an interrupt handler. The Raspberry Pi can
    trigger interrupts on any GPIO pin from high (3.3V) to low (3V to 0V). This can
    be much more efficient than polling the state of a GPIO, as you only have to deal
    with the pin changing when it happens. Plus, it can actually simplify your flow
    of code.


    The use of interrupts requires root privileges you will have to execute your code
    with sudo. The code provided demonstrates how to set up a callback function to
    deal with a rising edge.


    You can use a multimeter to verify the orientation of the GPIO pins. At the bottom,
    left pin (5) is the ground and the right pin (1) is 3.3V. By using the multimeter
    to measure the ground and positive potential on scale 5 show you.


    # Set up serial channel


    You can use raspi-config to set up a serial port you can get a shell using the
    UART_TX and UART_RX pins by connecting them to a USB adapter.


    ```

    sudo raspi-config

    8 (Advanced Options)

    A1 (Serial)

    ```


    Select YES to enable serial console. Finish, then reboot.


    # LED resistor calculations


    To calculate the R, use Ohm''s law: Voltage = resistance x current. The voltage
    of a GPIO pin is 3.3V. Subtract the voltage drop of the LED and its suggested
    current, so R = (3.3V - voltage_drop) / led_current. Using 2V as the voltage drop
    and 20mA as the current: (3.3-2)/0.020 = 65 Ohms. Round up to the next available
    value.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_66_2.png)


    The blue wire is the ground, the red is 3.3V and purple is for the output'
