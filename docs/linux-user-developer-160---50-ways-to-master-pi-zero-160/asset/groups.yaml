    # 容器


    ## CoreOS 发布 Claire 安全监控器


    Quay 安全扫描现已对所有人开放


    CoreOS 是同名以集群为中心的 Linux 发行版的背后公司，发布了一个名为 Claire 的漏洞分析工具，采用 Apache License 2.0
    开源。通过该系统，用户可以根据常见漏洞与披露数据库 (CVE) 以及其他标识符扫描其容器镜像的每一层以检测已知威胁。红帽（Red Hat）声称，容器层数的不断增加意味着对容器之间的多个层进行扫描对于创建全面的清单和安全分析至关重要。


    “漏洞将永远存在，”CoreOS 的 Quentin Rocha 在发布会上表示，“CoreOS 认为，提高世界基础设施安全的工具应该供所有人使用。”


    # 基金会


    ## LF 启动 Open API 倡议


    Linux 基金（Linux Foundation）宣布与包括 Google、IBM、Microsoft、PayPal 和 Paypal 在内的行业巨头达成合作项目：Open
    API 倡议（Open API Initiative）。


    基金会宣布，该倡议的目标是扩展编程接口（API）框架的规范，这将产生一种通用技术，允许成员为提供 RESTful API 的元数据贡献中立供应商且开放的规范——这是
    Swagger 自 2010 年发布以来取得巨大成功的奖励。


    Swagger 现在被认为是一个达到成熟极限的开源项目；它无法由任何组织或开发者独立进行管理。因此，Linux 基金会决定启动 Open API 倡议作为
    Swagger 的继任者。


    Open API 倡议将因其表现力、凝聚的愿景和切利益而获得更多关注。Tony Tam 也是该项目所有者 Smart Software 的副总裁以及 Reverb
    Technologies 的联合创始人，他将与我们一起……


    # 安全


    ##“Linux 编码器”已被击败


    发现导致了易于反转的 AES 加密


    在停止 Linux 服务器上“勒索软件”的首批大规模尝试中存在一个灾难性的缺陷，Dr. Web Lin 博士通过利用 Linux 上恶意软件管理系统中的漏洞发现了这一入侵。被感染后，服务器将使用在
    Bitlocker 中安装勒索软件期间生成的唯一密钥对主机、root 和 MySQL 数据库进行加密，以恢复解密密钥。


    与 Lin 合作的密码学专家 Radia Caraga 对恶意软件进行了分析，发现了一个严重的缺陷：用于加密过程的密钥（使用 `lib rand` 函数生成）是与当前系统时间——种子生成的，而该种子可以通过查看加密文件的时间戳立即恢复。


    利用这些信息，Caraga 能够编写一个小型脚本在无需支付赎索金的情况下解密文件。Bitdefender 发布了一个破解加密的五步流程。解密工具和说明现在对所有人可用。


    “如果你的机器被感染了，请将此视作一次大幸存生。大多数加密勒索软件运营者要求付费以获取‘Linux 编码器’恶意软件的解密密钥。‘这种错误是非常不幸的，但其他错误更是……’”


    勒索软件是一项日益繁忙的业务，美国联邦调查局（FBI）在 6 月声称，在过去一年中收到了 922 起关于基于“Linux 编码器”的恶意软件的投诉，总损失额达
    1.88 亿美元。


    Open API 倡议向成员开放，目前并在开放治理模式下运行。如果你感兴趣，可以在 openapis.org 获取更多关于项目的信息。


