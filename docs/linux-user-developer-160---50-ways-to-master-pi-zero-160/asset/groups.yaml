    **Richard Curinis** 是 Premier Foundry 的全球战略联盟总监，负责开发、全球客户技术战略并专注于半导体软件和服务服务。


    通过与 element14 的设计和工程团队 Claire Doyle 和 Richard Curin 合作，您可以在树莓派上留下自己的印记，他们解释了其运作方式。


    > 定制化服务适用于所有树莓派型号，Claire Doyle 表示：这完全是围绕树莓派的，而且对配件周围的配件也持开放态度。


    **Claire Doyle** 担任 element14 树莓派元件全球负责人已已有三年，在此之前，她自 2013 年 5 月起一直管理客户供应商关系。


    它在人声方面具有扩展潜力，能够使其顺利启动。一旦我们完成了这一步并汇集了核心客户，我认为我们将扩展到不同的策略。


    我也可以看到它部署在教育领域，为其奠定坚实的基础。例如，我们将如何沿着这些路线为教育进行定制？在我们发布的关于此的公告中，我们看到了各个领域的组件。那些参考设计可以满足一些热门的客户需求；我们不希望参考设计被小批量生产，但这将让人们有机会获得定制服务，以便他们开展自己的市场项目等。


    **这项服务是针对企业的，还是说您也可以（例如）使用它？**


    CD: 它适用于任何类型的客户。从我们看到的所有查询来看（主要是 OEM 类客户），我们已经声明过，最小起订量在 300 到 500 个左右，但我们认为提供良好的产前定制服务是有意义的。客户类型……我们真的非常开放。这取决于客户的需求以及他们想用它做什么。


    **Richard Curin:** 它将首先从扩展性和优先级顺序开始，因为我们部署到该计划的资源是有限的。所以我们将关注 OEM 和 ODM，在这些……


    **你能告诉我们提供什么样的定制服务吗？**


    RC: 基本上，提供的定制是更改主板上除 Broadcom芯片和内存之外的任何物品的配置。当我们开始进行更改时，会对表面和引脚产生复杂的连锁反应。如果客户确实想对这些做些处理，我认为那将与
    Broadcom 和树莓派进行另一番对话，因此我们会限制这些组件，但其他所有部分——PCB、尺寸和外形——在我们寻求与客户的应用程序进行合作时，它们都是可以调整的。


    ## 运作方式


    客户首先会请求树莓派定制，然后我们的技术工程师和应用设计师将与客户合作进行该设计。Element14 将与树莓派的工具和设计合作。如果客户希望外包生产，element14
    将从世界范围内选择（取决于产量和规格）熟悉产品的制造商，并让他们进行制造，最终发送给客户。


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_12_0.png)


    你们是否有一份人们可以选取的特性列表，或者你们对更具冒险性的请求开放——例如，有人想要一个电镀的设计？


    RC: 在那个阶段或定制的某个点，我们会为客户创建某种菜单。当我们考虑涉及的潜在影响时，我之前已经提到过。根据我们的灵活性，我们完全可以告诉他们，在我们的工程团队可以涵盖的领域，我们拥有实现他们所要求的技术工程知识。所以，灵活性是优势，但同时也意味着我们对客户没有限制。我们会根据具体情况验证并批准定制请求，这就是我们目前正在做的，然后建立一份关于提交请求的记录，在那里我们可以根据看到的市场情况，考虑为客户制作一些真正创新且直观的菜单。


