    # ## GROUP TEST


    # ## Chromium browsers


    There are projects that have taken Chromium code to roll out their own web browsers.
    But can anyone beat Google''s flagship Chrome browser?


    ### Google Chrome

    Reported to be the most widely used browser on Earth, but the hood is just the
    same Chromium with extras. Chrome includes licensed codes for proprietary formats,
    giving access to a wider variety of media content, AAC and MP3-encoded audio.

    Download: bit.ly/1BxukGG


    ### Chromium

    Chromium is the only open source browser in our test and many things are obvious:
    Chromium doesn''t have the same charm as Chrome since we don''t use licensed stuff;
    however, the existing feature set will pit the browser performance against other
    competitors.

    Download: bit.ly/1MvHy6k


    ### Opera

    Opera is a respected browser for Linux with a long history. It used to implement
    its own Presto engine, but since 2013 Opera has dropped in favor of Blink, which
    uses components by Google. Opera released its new browser for Linux in summer
    2014, with significant design.

    Download: opr.as/1FvGzZ0


    ### Vivaldi

    Vivaldi emerged as an initiative to bring back the super-rich feature set of the
    old Opera to the new level, taking the Chromium code as a base. Vivaldi directly
    competes with Opera, bringing back users who were disrupted by Opera''s transition
    from Presto to the Blink rendering engine.

    Download: bit.ly/1cCQg3D


