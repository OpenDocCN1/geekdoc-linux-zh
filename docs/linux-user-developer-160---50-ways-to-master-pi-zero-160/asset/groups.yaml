    | 5. Fedora | 1,443 |

    | 6. Mageia | 1,103 |

    | 7. Manjaro | 1,020 |

    | 8. CentOS | 838 |

    | 9. Arch Linux | 813 |

    | 10. Kali | 810 |


    ### 本月


    - 稳定版 (17)

    - 开发中 (3)


    Linux Mint 本月凭借其 17 版本强势登场，确保其处于竞争领先地位。


    ## 创新


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_9_0.png)


    ### ISS 选择 Linux 而非 Windows


    #### Linux 成为强大的平台


    **美国国家航空航天局 (NASA) 将内部控制权转向 Linux**，这一决定被认为对可靠性至关重要。


    > “我们迁移到了稳定且可靠的操作系统，”空间联盟的 Keith Chusia 解释引入 Linux 的，“我们需要补丁或调整，我们可以这样做。”


    空间出版物 Dealer News 的 Stephen Hunter 确认 Linux 的引入正在增加。目前 ISS 使用约 100 台 Windows 工作站，但
    Linux 的使用可能会超过其他平台。


    除了工作站，ISS 还是人形机器人的所在地。机器人由宇航员部署，对人类环境来说是安全的，并且运行在 Linux 上。


    ISS 的下一个新设备将是 Ubuntu 15


    ## 亮点


    ### Linux Mint 17.3


    Linux Mint 17.3 测试版发布，带来了全新的 MATE 桌面环境，使用户首次能够快速地管理窗口。


    ### Chakra 2014.1


    这款新的 Ubuntu 发行版名为 Chakra，为老旧群体带来了 Compiz 桌面系统，并默认包含 SDDM 显示器管理器。


    ### Puppy Linux 6.3


    作为一个针对旧硬件一直受欢迎的发行版，此 Puppy Linux 版本采用了 Slack 分支——与 6.0 使用 Ubuntu True 分支形成对比。


    ## Wiley 成为新 Emacs 维护者


    ### Richard Stallman 再次离开项目


    Emacs 创始人兼维护者 Richard Stallman 已辞去维护者职位，由 John Wiley 继任。


    John Wiley 已经参与 Emacs 多年，他将接任维护者的角色。


    “我很乐意休息一下，”Stallman 说，“Emacs 交给 John 处理很放妥的。”


    该项目将在新的领导下继续演进，我们期待 Emacs 的未来。


