    \n# 云\n每月 £5 起\n树莓派商店 - 我们提供开发板、RPi 组合包、SD 卡、外壳及组件 - 全球送货！\n\n# 服务器\n立减 50%\n\
    ![](img/df5857e82a6482b0f2db5a2e61e6012c_86_3.png)\n\n# 数据中心\n每月 £35 起\n\n# UK\
    \ 服务器\n# 专用服务器\n使用优惠码享 15% 折扣\n当天到货，无需长期合同\n\n联系我们的团队成员，或访问我们的网站了解更多信息\n每月 £39\
    \ 起 + 增值税\nwww.ukservers.com\n\n# 测评 NeuG \nNeuG 采集模拟转数字转换器的噪声，并将其作为熵的基础\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_87_0.png)\n\
    \n# 安全 NeuG\nCPU: STM32F103 Cortex-M3 72MHz\nRAM: 20KB\nROM: 128KB\n存储: 4KB 闪存\n\
    操作系统: RTOS 288KB CRC-32 处理 816KB\n价格: $50 可自 shop.hf.org\n\n在你的 Linux 设备上添加一个基于\
    \ ARM 的微型计算机就能加密安全吗？/dev/random 是大多数 Linux 用户不会考虑的问题，但它让密码学家彻夜难眠。系统可能会受到安全漏洞的影响——当你进入虚拟化情况时，这个问题变得更大。\n\
    \n在使用 /dev/random 时，可能会遇到熵耗尽的问题：尝试从 /dev/random 拷贝 1MB 数据将迅速停止；因为大多数程序默认使用熵产生。处理\
    \ /dev/random 饥饿的一种方法是使用硬件随机生成器。这些设备通常很贵，但自由软件基金发布了一个廉价的微控制器 (FST)：NeuG 是设计运行在\
    \ F-01 ARM M3 处理器上的免费软件。通过 USB 连接，NeuG-FST 显示为一个串口；连接到端口，你就会发现随机字符填充了你的控制台。\n\n\
    一个所谓的随机生成器 (TRNG) 足够简单：通过 CRC 系统连接到处理器的模拟读数经过处理后，通过设备的内置 USB 输出。这股熵流可以在任何你需要的地方使用。安装足够简单；将设备插入你的\
    \ USB 端口，运行设备下的固件并保持连接，NeuG 固件就会启动。凭借其简单的 USB 设计，NeuG 足够便于随身携带\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_88_0.png)\n\
    \n> NeuG 完全有能力向 /dev/random 注入熵，速率高于操作系统自身的熵采集活动\n\n优点\n- 易于安装、紧凑，并且能够快速填充系统的熵池，你可以清空它\n\
    \n缺点\n- 现代处理器通常带有随机生成器，但尚未通过安全审计\n\n该设备将其变成一个包含实用 readme 的可移动存储设备。浏览此文件后，下一项是一个揭示了\
    \ NeuG 设计、用法和原理的建议设备，但缺少了一条信息：如何使用 NeuG 固件。\n\n288KB/s。最终模式输出传感器的原始数据，不尝试确保它是任何随机的。在两种随机数生成模式下，NeuG\
    \ 完全有能力向 /dev/random 注入熵，速率高于操作系统自身的熵采集活动。拔出时，FST-01 将通过串口设备 -dev/ttyACM0 切换到\
    \ NeuG。这需要额外的命令来启用读取模式：将端口设置设置为被禁用的原始模式，并且可以在模式之间切换。安装固定的硬件可能不可用，它在加载的瞬间可能会导致熵停止。\n\
    \n总结\n很难判断随机数据的质量，但 NeuG 在没有评估和验证的情况下通过了通常的硬件瓶颈；它既易用又便宜。\n\n这些模式对 NeuG 的运行有显著影响。在默认模式下，NeuG\
    \ 能够以 81KB/s 的速率通过 SHA-256 处理算法输出；替代的 CRC-32 算法可能会削弱熵的质量，但会提高速度。\n\n对于服务器来说，这是一个好消息——安装的硬件提供的各种熵源可能是安全系统与产生熵系统之间的区别。它还作为指向现代处理器（如\
    \ Intel 的 Ivy Bridge 及更新型号）内置的闭源 RNG 的方便接口。\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_88_1.png)\n\
    \nwww.luxuser.com 89\n\n"
