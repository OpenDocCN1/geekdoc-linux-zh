    \n## 你需要什么\n\n- 带有 RC 插座的 Pi-mote IR 控制板\n- 台灯\n- 附件\n\n上方 使用智能手机控制你的家庭环境\n\n\
    ## 安装 Energetie 库\n\n### 02\n接下来，启用 Energetie 库。这些库让 Pi-mote 板和树莓派与 Python 交互。在\
