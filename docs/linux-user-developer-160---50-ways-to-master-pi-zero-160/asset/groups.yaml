    # Feature Speed up Linux


    # DEBIAN


    Use these Debian optimisation tips to get the best from your system


    Debian was first announced in 1993, when it was a one-man project led by Murdock
    who was then a Computer Scientist at Purdue University. The Debian project was
    emphasized as a fast, open-source distribution of Linux with community-first development,
    and it has grown since then. However, if you cut that out from the default installation
    to make it all set, then each read access will also result in a slower Debian
    system.


    Linux systems generally have a default mount option for file /etc/fstab, which
    is set for a file system in /etc/fstab, then read access will no longer cache
    the atime, the last access information. If noatime is not set, each read access
    in a write operation. Therefore, using noatime can lead to performance gains.
    To do this, open the file:


    +   - /etc/fstab


    ...and add noatime to the options of /etc/fstab, like this:


    ```

    # proc /proc/mounts

    /dev/sda1 ext4,relatime 0 1

    /dev/md0n11 swap 0 0

    /dev/md02 defaults,noatime 0 0

    ```


    You don''t have to reboot the command for the changes to take effect- following
    command will do:


    +   - remount /


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_21_0.png)


    Another approach to speed up the boot process is using bootstat: install it and
    boot with init=/boot/bootstab to the kernel command line. In Grub, select the
    kernel using the cursor keys, then press E, edit the line, press Return, and then
    press B) then reboot the bootloader, which will log every write entry during boot
    and create a SVG file. The resulting file will be very useful. It will show you
    which process took the most time, and you can see how much time was spent waiting
    for I/O and how much time was CPU used. You can then understand the steps during
    the boot process and remove any culprits from the start-up process.


    Above the fstab has about mounted location of partitions and storage devices.
    Change it to enable noetail


    # BEST DEBIAN OPTIMISATIONS


    # DEFINING RUNLEVELS


    Debian uses runlevel 2 by default and doesn''t define any special function for
    levels 3-5. To speed up the start-up of services that you only run on occasions,
    you can set them to a different runlevel in 2. For instance, you might keep databases
    that you only run on runlevel 3 and a web server that you only use on runlevel
    4.


    # USING READHEAD TO LOAD FILES FROM DISK


    The readhead package runs at boot and prepares the disk cache. To activate it,
    it runs the command and then reboots: the first time after boot, the booting process
    is slow and will stay slow until readhead tunes the list of files loaded used
    during the profile for:


    +   - install readhead

    - touch /etc/readhead/profile-once


    # USING KEXEC FOR WARM BOOTS


    If your system is warmed up, rather than rebooting after a long shutdown period,
    you can skip the hardware re-initialisation. Then go through the BIOS and bootloader,
    you can go to a minimal runlevel and load the kernel image into memory. This requires
    kexec and a kernel compiled with KEXEC-ready for Debian. You can install it with
    the package kexec-tools re-kexec-tools:


    # REDUCING SYSTEM LOGGING


    In default installs, system logging is often configured fully, for a single-user
    or multi-user system. If you are using a single-user, the constant writing of
    many system log files will result in reduced performance, and logging activity
    will spend less time in Debian. Debian uses sysloglog and its configuration file
    is /etc/syslog.conf. You can disable the unnecessary default logs by commenting
    out the corresponding lines with:


