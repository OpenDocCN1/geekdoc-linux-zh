    # Master version control by learning how to use Git


    Created by Linus Torvalds a decade ago, Git is now the standard for open source
    project management


    As we know, with the help of a version control system, you can track the history
    of a collection of files. The main component of any version control system is
    known as a repository of different files. The version control systems are flexible
    and networked. Project version control is used to track changes in source code
    and as such, you can use version control systems for many kinds of things such
    as operating systems, network configurations, and software development.


    A distributed version control has a significant advantage in that each every user
    will have a local copy of the repository on their computer. A user can also access
    an existing repository through a process known as cloning. The popularity of a
    distributed version control system is widely used in many open source projects.
    Git was originally written in the C programming language, not Java, Python, etc.


    Since it is open source version control system, it is relatively easy to install.
    You can install Git by the following:


    ```

    $ sudo apt-get install git

    ```


    Git also comes with very well-documented man; its page gives more information
    about the various options and commands that are available with Git. To use Git
    version control, you need to understand the concept of the working tree. The working
    tree can be considered as a check out of version of the project. You can make
    changes here. As expected, you will be able to change the files in the working
    tree — either by modifying the existing files or adding/removing files. Afterwards,
    they will be able to commit these changes to the repository. Since every user
    has a local repository, a user will be able to perform operations in their local
    repository. Git version control operations — the most can also allow the creation
    of new branches.


    As with any version control system, Git also supports branches. With the help
    of these branches, users will be able to switch between different versions that
    they can work on


