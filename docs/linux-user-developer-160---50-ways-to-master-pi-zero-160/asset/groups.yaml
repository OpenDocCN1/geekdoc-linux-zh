  - "[PAGE 42]\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_42_0.png)\n\nLeft Movement\
    \ and rotation is achieved through MonoGame's BasicEffect class\n\nBy itself,\
    \ a point is completely meaningless: it becomes only useful when the coordinate\
    \ values are mapped to an axis and/or distance system. When working on 3D objects,\
    \ the entire model is placed in a coordinate system called model space, ranging\
    \ from -infinity to infinity.\n\n3D engines can be built by multiplying them with\
    \ one another. Sadly, matrix multiplications are not commutative: the operation\
    \ on the left performed before the one on the right. Getting the order wrong can\
    \ lead to weird results - scaling and rotating always come before translation.\n\
    \nBringing the model onto the screen is done in two steps. First of all, rotations\
    \ and scaling operations are carried out. You turn the object around an axis to\
    \ make it face correctly to the camera.\n\nIn the next step, the BasicEffect is\
    \ informed that the vertices passed to it contain colour data:\n\nAfter that,\
    \ a translation 'pushes' the object to its final place in the coordinate system.\
    \ With that, it is time to walk through the new version of Draw step by:\n\n```\n\
    protected override void Draw(GameTime gameTime)\n{\n    GraphicsDevice.Clear(Color.CornflowerBlue);\n\
    \    BasicEffect cubeEffect = new BasicEffect(GraphicsDevice);\n    Matrix cubeRotation\
    \ = Matrix.CreateRotationY(0.25f);\n    Matrix cubeTranslation = Matrix.CreateTranslation(0,\
    \ 0, -10);\n    cubeEffect.World = cubeRotation * cubeTranslation;\n    cubeEffect.View\
    \ = camera.View;\n    cubeEffect.Projection = camera.Projection;\n```\n\n```\n\
    cubeEffect.VerticesEnabled = true;\n```\n\nFinally, each of the drawing commands\
    \ contained in the BasicEffect is applied to all of the vertices:\n\n```\nforeach\
    \ (EffectPass pass in cubeEffect.CurrentTechnique.Passes)\n{\n    pass.Apply();\n\
    \    GraphicsDevice.DrawPrimitives(PrimitiveType.TriangleList, 0, 12);\n}\nbase.Draw(gameTime);\n\
    ```\n\nWith that, we're now ready to run the program and feel the results. Feel\
    \ free to modify the Rotation, Translation and Scale properties in Update.\n\n\
    First of all, a BasicEffect instance is created: it is a 'clatch' that calls a\
    \ set of drawing commands, which is intended to replace custom shader code.\n\n\
    # Conclusion\n\nThe BasicEffect is populated with three matrices that are needed\
    \ for the display. View and Projection matrices are not of interest current -\
    \ we will discuss them in a later related to shader programming.\n\nEven though\
