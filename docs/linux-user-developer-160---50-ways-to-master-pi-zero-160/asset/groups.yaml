    # 玩转树莓派


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_66_0.png)


    # 五分钟修复


    快速简单的方法，你可以在几分钟内尝试：


    ```

    HOLD DC AUTO S9u 200

    2V 2V AT:6.00V

    ```

    上面是两个波形，占空比约为 80%（顶部）和 20%（底部）。你应该只从树莓派引出几毫安。如果你需要更多电流，需要切换更高的电压，使用晶体管连接到电源。需要更多电流吗？


    脉冲调制


    脉冲调制是指 GPIO 输出高电平的时间，剩余时间为低电平。这种时间的百分比称为占空比。为了实现这一点，使用脉冲调制：


    ```

    sudo rm /etc/modprobe.d/alsa*

    sudo edit /etc/modules

    ```


    # 使用按钮


    将 `dto-bcm2835` 修改为 `dto-bcm2835` 并保存，然后重启。参考下方的电路。当按钮按下时，左侧引脚连接到 GPIO（通过一个 1k
    下拉电阻连接到地），当按钮未按下时，GPIO 为低电平。按钮的右侧连接到 3.3V，左侧与 10k 电阻并行。因为电流需要电阻，脉冲信号将输出 3.3V。


    ```python

    GPIO.setup(5, GPIO.OUT)

    # 频率 58Hz

    # 50% 占空比

    GPIO.start(5)

    # 不工作或退出

    # 脉冲宽度

    GPIO.change_cycle(5)

    GPIO.stop()

    ```


    ![](img/df5857e82a6482b0f2db5a2e61e012c_66_1.png)


    # GPIO 中断


    # 使用万用表验证


    中断是硬件事件触发 GPIO，导致其停止正在执行的操作并运行中断处理程序。树莓派可以在任何 GPIO 引脚上从高电平（3.3V）到低电平（3V 到 0V）时触发中断。这比轮询
    GPIO 状态效率得多，因为你只需要处理引脚变化的情况。此外，它实际上可以简化你的代码流程。


    中断的使用需要根权限，你必须使用 `sudo` 执行代码。提供的代码演示了如何设置回调函数来处理上升沿。你可以使用万用表验证 GPIO 引脚的情况。在底部，左引脚（5）是地，右引脚（1）是
    3.3V。通过万用表测量地 5 号的正电位。


    # 设置串口


    你可以使用 `raspi-config` 设置串口，通过将 UART_TX 和 UART_RX 引脚连接到 USB 适配器来实现：


    ```

    sudo raspi-config

    8 (Advanced Options)

    A1 (Serial)

    ```


    选择 YES 以启用串口。完成并重启。


    # LED 电阻计算


    要计算 R，使用欧姆定律：电压 = 电流。GPIO 引脚的电压为 3.3V。减去 LED 的压降及其建议电流，因此 R = (3.3V - voltage_drop)
    / led_current。使用 2V 作为压降，20mA 作为电流：(3.3-2)/0.020 = 65 欧姆。向上取整到下一个可用值。


    ![](img/df5857e82a6482b0f2db5a2e61e601_66_2.png)


    蓝线是地，红线是 3.3V，紫色线用于输出。


    # 物联网


    Cory Gynn 利用物联网让整个城市充满生机。


    ![](img/df5857e82a6482b0f2db5a2e61e601_67_0.png)


    - 你做这个项目多久了？

    - 从 9 月开始的，那时我发布了博客。

    - 热门话题是物联网，理解它可能会很困难。

    - 它是那种难以捉摸的元素，对吧？我开始查找技术，从 Node-RED 开始，它非常容易理解。

    - 我有一个树莓派，后来添加了一个 Arduino，这样我可以控制一切。

    - Johnny-Five 是一个用于机器人的 JavaScript 框架。

    - 与其他框架相比，Johnny-Five 编写控制物理设备的代码要容易得多。

    - Johnny-Five 就像写网页，如果你按下按钮，它就会改变该设备的状态。

    - 我用 Node 作为服务器。所以 Johnny-Five 非常简单，而且有一本很棒的书——由 Rick Dalton 编写。

    - 你为什么决定从 PubSub 开始创建一切？

    - 我用 PubSub 是因为我喜欢它，这是我为我的城市构建 API 的方式。我的城市是用树莓派和 Arduino 构建的。我的城市是用树莓派和 Arduino
    构建的，我想用传感器来获取更多信息。


