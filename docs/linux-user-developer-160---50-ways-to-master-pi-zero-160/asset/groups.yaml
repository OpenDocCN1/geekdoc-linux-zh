    ## 理解 LSOF


    输出 (img/df5857e82a6482b0f2db5a2e61e6012c_22_0.png)


    | COMMAND | PID | USER | SIZE | T | DEVICE | | NAME |

    | :--- | :--- | :--- | :--- | :--- | :--- | | | :--- |

    | 01 | | | | | | | |

    | 02 | | | | | | | |

    | 03 | | | | | | | |

    | 04 | | | | | | | |


    ##  Linux 性能的五个工具


    监控所有资源的五种方法


    ### 01 vmstat


    显示虚拟内存、内核线程、进程 IO、CPU 活动和内存使用。默认每秒显示计算、磁盘和网络接口三个方面的信息。如果你只想输出 细节，可以使用


    ```bash

    $ collect sc

    ```


    如果你有多个 CPU，可以使用 -l 输出多行，每个 CPU 一行：


    ```bash

    $ collect -sc

    ```


    ### 02 netstat


    Netstat 是一个用于监控和输出网络统计的命令行工具。它对于系统管理员非常有用，特别是在排查性能和网络问题时。


    ### 03 iotop


    iotop 类似于 top 命令，但它带有一个交互式监控器来显示磁盘 I/O。这个工具对于查找磁盘读/写最高的进程非常有用。


    ### 04 iostat


    Iostat 是一个用于从内核设备收集性能数据的命令行。与其他监控工具不同，iostat 并不关注有限的指标，而是提供许多类型的系统指标，包括内存、网络、TCP、inode、NFS
    和性能质量。


    ### 05 lsof


    Lsof 是 List Open Files 的写。该命令用于显示所有打开的文件和进程。打开的文件包括磁盘文件、网络套接、管道和设备。通过它你可以轻松识别哪些文件正在被使用。


    ## 使用获取详细报告


    ### 01 CPU 内存使用


    显示空闲内存、缓冲缓存以及其他一些细节。如果你想进一步了解细节，请使用 mem


    ### 02 内存监控


    要显示内存细节，你可以使用选项，如：


    ```bash

    $ collect sm

    ```


    ### 03 检查磁盘使用情况


    基于之前的工具，你可能需要查看磁盘细节，你可以使用


    www.linuxuser.com


