    # Review


    # NeuG

    G


    The NeuG gathers the sampling noise of analogue-to-digital converters and uses
    it as the base for its entropy creation


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_87_0.png)


    # SECURITY

    NeuG


    CPU

    STM32F103CBU6ARM Cortex-M3 72MHz

    RAM

    20KB

    ROM

    128KB

    Storage

    4KB flash memory

    Operating System

    Fraheakup/NeuG RTOS

    288KB CRC-32 conditioned,

    816KB SHA-256 conditioned

    Price

    $50

    Available from

    shop.hf.org


    Can adding a tiny, ARM-based 32-bit computer to your Linux box be all you need
    to improve cryptographic security?


    Entropy – the contents, basically, of /dev/random is not something which most
    Linux users give a second thought, but it keeps server administrators and cryptographers
    awake at night. A system can suffer from performance issues to security holes
    – it''s a problem that becomes much larger when you get into the situation of
    virtualization.


    When using /dev/random, you might be familiar with the issue of entropy: attempting
    to copy 1MB of data, from /dev/random will rapidly grind to a halt; it''s because
    the entropy generator is the default for most programs'' entropy.


    One way of dealing with the starvation of /dev/random and how to keep it free,
    especially on headless systems, is the use of a hardware random number generator.
    These are typically expensive devices, but the Free Software Foundation has


