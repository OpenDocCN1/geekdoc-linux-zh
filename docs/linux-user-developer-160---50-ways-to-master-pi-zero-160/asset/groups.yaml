    # MonoGame 教程


    ## 在 MonoGame 中渲染你的第一个 3D 对象


    ## 创建 3D 游戏曾是极其复杂的；MonoGame 已经准备好让事情变得简单


    在过去，微软希望通过让小型工作室发布各种独立游戏来拓宽 Xbox 360 的吸引力。然而，由于各种原因，发布原生 DirectX 是不可行的：我们在此就不多赘赘了，简而言之，该
    API 的巨大复杂性在社区中是众所周知的。幸运的是，微软引入了一项名为 XNA 的新产品。


    随着微软内部理念的改变而演进；Xbox One 不再支持 XNA。据传，这一变化是为了阻挡平庸的开发者；Android 和 iOS 的兴起导致了自由市场。MonoGame
    证明了自己能够立足脚跟。


    该产品现在已达到惊叹的成熟水平。开发非纯图形驱动的游戏开发者可以从其部署中获益：在引擎上节省的时间可以投入到新的游戏模式、更好的内容或更大的投入，例如。


    MonoGame 团队在今年 4 月发布了其产品的更新版本 - 你可以访问下载压缩包，然后将其解压到 http://www.monogame.net/2015/04/29/monogame-3/


    到达后，点击 MonoGame 链接进行下载。它包含了大量的 shell 文件，这些文件在构建过程开始前会被设置为可执行。


    通过以下 shell 文件实现这一操作效果最好，该文件已经在互联网上流传了一段时间。将其保存为 `generate*.sh` 文件，赋予其执行权限并运行它。


