    ## 07 开启插座的代码\n\nEnergetie 库让创建一个用于开启插座的代码变得极其简单，这将开启你的灯。在不知不觉中，你将使用树莓派来开启或关闭电水壶或电视。\n\
    启动一个新程序，导入 energie 库（第 2 和 3 行），然后添加切换插座的代码（第 4 行）。保存并运行你的程序。插座会发出点击声作为应答，然后你的灯就会亮起。\n\
    \n```python\nimport RPi.GPIO as GPIO\nimport time\nfrom energie import switch_on\n\
    \nswitch_on()\n```\n\n## IP 地址\n\n每个联网设备都有互联网协议地址（IP 地址）。此标签用于识别每个设备，可能包含你家庭网络中的\
    \ IP 地址，如 192.168.1.1。\n\n### 04\n关闭插座\n\n在树莓派 之前，你可以连接插座并关闭它，使用编程学习来自插座的代码。每个插座都有独特的代码可以控制。Energetie\
    \ 设置代码可以在你的教程资源中找到。\n\n### 05\n设置你的插座\n\n一旦完成了设置程序，运行它。它应该是插座正方的 LED 指示。LED 将闪烁几秒钟并引导信号。开启状态下，程序将返回。\n\
    \n```python\nimport RPi.GPIO as GPIO\nimport time\nimport energie\nfrom energie\
