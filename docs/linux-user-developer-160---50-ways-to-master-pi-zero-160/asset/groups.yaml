    # 加速 Linux


    Linux 以安全快速著称，但随着时间的推移可能会变慢。我们将学习如何测量计算机性能，然后揭示加速它的方法。


    大多数在 PC 上安装 Linux 的人是因为他们被告知 Linux 快速且安全，而且他们可以配置任何想要的东西。这些都是事实，但还有另一个事实。随着时间的推移，你的
    Linux 安装会经历软件安装和卸载的循环，过程会变得不稳定。我们都知道，理论上任何人都可以按照自己的意愿调整 Linux 安装，但在没有备份的情况下自己这样操作，会使你面临损坏操作系统甚至更糟糕的——丢失所有数据的风险。


    更安全的方法是先仔细测量计算机的性能，看看它是否比具有相似硬件配置的其他计算机运行得慢。一旦你确认你的 PC 确实运行缓慢，就可以采取系统化的方法，首先从简单的更改和启动用应用程序开始，然后转向更专业的优化技巧。通过增量式更改，你可以帮助避免系统崩溃。在本文中，请遵循这一分步骤的路径，帮助你的基于
    Linux 的 PC 运行得更快、更流畅。


    # 诊断与性能


    我们揭示了一些可以帮助衡量性能的命令行选项和第三方工具


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_20_0.png)


    现代计算机使用资源共享机制来运行多个进程。虽然进程是一个接一个运行的，但它们非常迅速，给你一种所有进程都在并行运行的错觉。因此，要理解为什么你的 PC 运行缓慢，就是检查所有正在运行的进程，以及是否真的需要运行某个特定进程。通常情况下，你的
    CPU 使用率不应超过总量的 70%。如果超过，那么你可能就会问题。如果你的 CPU 负载保持在 90-100% (0.90-1.0) 之间，那么是时候考虑删减不需要的内容了。同样，你应该尝试确保你的交换空间（swap）正常。


    Linux 提供了许多命令行工具，如 `top`、`free` 和 `uptime` 来显示关于进程、内存使用和负载的信息。你还可以使用第三方工具 `htop`
    来查看资源使用。


    Linux 提供了多种选项来查看资源使用，包括 `htop` 命令


    # HTOP 输出解释


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_20_1.png)


    - 01 资源使用状态栏：显示系统资源的使用情况。进度条。

