  - '[PAGE 15]


    # OpenSource

    Your source of Linux news & views


    # OPINION


    # The kernel column


    Jon Masters summarizes the latest happenings in the Linux kernel community, as
    the merge window closes for what will be kernel 4.4


    > Linus Torvalds closed the merge window (period of time during which changes
    are allowed for 4.4, following the customary weeks, with the release of Linux
    4.4-rc1 (Release Candidate). In his announcement, Linus noted that things were
    "possibly a bit hectic than usual with the patch drivers, and 100% architecture
    cooling." Subsequently announced 4.4-rc2, saying "Things are looking normal in
    4.4, with no huge scares in rc2. These features: parquet support and some list
    bulk allocator patches; that strictly speaking have been merged without issues.
    They haven''t been used yet, and so the updates on front are upon us rather than
    something that can regress."


    # Security cost of Waiting Channels


    Linux descends from many decades of Unix and Unix heritage. While there are seemingly
    little in common between a Linux developer, or embedded device of 2015 and the
    original Unix systems of the seventies, appearances can be misleading for various
    standards, protocols, conventions, and nomenclatures of the systems from that
    era. One such influence is visible every day in how Linux handles such processes
    (as "tasking" within the kernel in our system). Depending on the options, Linux
    provides for "Waiting Channel", and it has also provided a security flaw hidden
    under our noses.


    Implemented variants, in traditional Unix-like systems, WCHAN provided the absolute
    address of the kernel function or data structure which a particular thread was
    expected to run after returning from a blocking call (system call) to read some
    data from a disk, as an example) which would traditionally expose the memory address
    of the kernel thread. In Linux, the kernel address is not exposed except in the
    “System.map” file generated for Linux kernel. Modern Linux kernels don''t need
    to rely on user space variables to locate the kernel function, enabling this to
    turn the kernel address.


    # Jon Masters


    In a Linux kernel hacker who has been working on Linux for some 19 years, Masters
    attended the university of Leeds in 1993. He now works for an enterprise Linux
    vendor and leads the creation of standards for efficient ARM powered servers


    As encouraged extensive testing of the new kernel, which is currently available
    in some of the latest developments of the major subsystems, including exciting
    features, support for a new "dev cooling" device that lets us scale as mobile
    phones—an overheating condition that limits temperature is back within certain
    bounds; with journaling support for the software RAFS driver, allowing for a specific
    device—such as high-throughput NVMe flash or disk—as used in order to guarantee
    the address of away bad data contains such as passwords entered by the system
    user—which has the additional benefit that such memory may not be locked until
    it is accessed safely with data following a page fault.


    Last month''s issue coincided with the end of this year''s Kernel Summit, which
    was held in Seoul, South Korea, alongside the 2015 Korea Linux Forum. At the Kernel
    Summit, many topics were discussed, all of which were roughly summarised by Linux
    Weekly News (lwn.net).


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_15_0.png)'
  - '[PAGE 16]


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_16_0.png)


    which memory locations contain specific kernel functions, to address names that
    you might use. Thus, it is more difficult to have a kernel exploit that affects
    all systems when using vendor''s Linux kernel. KASLR works well, unless you defeat
    it by providing the randomly generated offset that is being used for all of the
    running kernel on a given system. That information is trivially available (under
    Linux 4.4) by performing a simple piece of arithmetic with the WCHAN output for
    a given task, visible to all users in /proc/stat.


    F. Mitter notes the following example, saying "WCHAN output isn''t ideal, because
    it trivially leaks the KASLR offset to any local attacker:".


    ```

    formatout=printf "%016x\n" $(cat /proc/$$ | cut -d'' '' -f35)

    ```


    His fix was to provide only the symbolic names of the functions, the existing
    kernel address to translate, in the /proc/PID/stat file, or to change the output
    of /proc/PID/stat to contain a 1 or 0 depending on whether a task is actually
    active or not, since many tools rely on this when determining whether it is running.


    # Overgoing development


    Octavian Puebla posted an interesting kernel patch series (Request For Comments)
    Linux kernel that allows to map the Linux kernel to other memory space. This strategy
    may seem strange, yet it can be used in terms of software development to use Linux''s
    implementation of virtual memory in applications running within virtual machines
    or other operating systems (and, in particular, Operating System). This patch
    marks itself as a library that is GPL code, but it does means that many Free Software
    projects wanting to use a simple Linux filesystem driver will have another option
    than copying and pasting a snippet of code borrowed from the kernel. Rich Jones
    quickly picked up on the work


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_16_1.png)


    and posted support for linking his excellent "listguests" utility against the
    LKL patch series. Jake Osmins from Microsoft posted a new PCI virtualised-driver
    for Hyper-V, using "hv_host", which allows access to real PCI devices as PF-Function
    (Physical Function) devices that have been assigned to Hyper-V virtual machines
    in SR-IOV (Single Root I/O Virtualization). This is much more positive - from
    the first Microsoft posted a driver supporting for Hyper-V, suggesting that Microsoft
    Linux kernel developers who do contribute significantly to Linux.


    # Linux 4.4 will contain new exciting features, including a "devqueue" device
    driver that lets systems experiencing throttle on bottleneck


    Finally this month, Noah Camus posted for the new Processor Order, which allows
    a single processor to handle a total of 4096 "CPU" SMP cores where each of them
    has only one instruction. Unlike Out-of-Order Superscalar, this network processor
    follows more of a GPU design philosophy in as using as many cores as possible,
    with blocking, individual cores frequently. Noah noted that he handles 4096 CPUs
    on a chip to be a "new record":'
