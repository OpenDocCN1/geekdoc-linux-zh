    \ positional variables\n\nAnother thing you could say, but but one\nincludes the\
    \ positions and values at the start\neach game - will make very important when\
    \ we\nuse level progression. The fail is the DEF FN\nlayer(2) that we referred\
    \ to.\n\n# TBC-\n\nAnd that's for it! At this stage we have\nbashic of the game.\
    \ Next time we will see\nupdating, into progressive scoring and level, add\nennemies\
    \ and difficulties, includes a start-up\nscreen and any finishing touches. We\
    \ see next\nTo find out more FUZE BASIC and the FUZE in,\nplease visit www.fuze.co.uk\n\
