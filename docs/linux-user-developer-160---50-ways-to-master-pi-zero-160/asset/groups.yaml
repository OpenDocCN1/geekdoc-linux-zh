    \ 结尾。\n\n```html\n<!doctype html>\n<head>\n<title>Controller</title>\n```\n\n\
    ## 添加一些样式\n\n```html\n<link rel=\"stylesheet\" href=\"static/style.css\" />\n\
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n</head>\n\
    <body>\n<div class=\"on\"><h1>Hello!</h1></div>\n<div class=\"off\"><a href=\"\
    #\">OK</a></div>\n</div>\n</body>\n</html>\n```\n\n级联样式表，CSS 用于创建并为网页应用样式。回到 Mobile_Lights\
    \ 文件夹并创建一个名为 static 的文件夹。这是保存 CSS 文件的地方。创建另一个文本文件并添加以下代码，它将为网页设置“样式”。你可以逐行更改按钮的颜色。将文件保存为\
    \ static 文件夹中的 'style.css'。记住，这是一个 CSS 文件并\n\n```css\nbody {\n    position: absolute;\n\
    \    margin: 0;\n    top: 0;\n    right: 0;\n    bottom: 0;\n    left: 0;\n  \
    \  font-family: Arial, sans-serif;\n    font-size: 150px;\n    text-align: center;\n\
    }\n```\n\n```css\ndiv {\n    display: block;\n}\n```\n\n## Flask\n\n```css\ndiv\
    \ : a {\n    width: 100%;\n    height: 50%;\n}\n\ndiv : a {\n    width: 100%;\n\
    \    height: 100%;\n    display: block;\n}\n\ndiv.on {\n    background: black;\n\
    }\n\ndiv : a {\n    color: white;\n}\n\ndiv.off, visited {\n    color: black;\n\
    }\n\na:link, visited {\n    text-decoration: none;\n}\n```\n\n```python\ndef index():\n\
    \    return render_template('index.html')\n\n@app.route('/')\ndef switch_():\n\
    \    return render_template('index.html')\n```\n\nFlask 是用于创建应用和页面的强大工具。如果你对这些感兴趣，很好的起点是\
    \ flask.org。查看该网站以了解 Flask 的功能和解决方案！还有 flask.com/community。\n\n```python\nif __name__\
