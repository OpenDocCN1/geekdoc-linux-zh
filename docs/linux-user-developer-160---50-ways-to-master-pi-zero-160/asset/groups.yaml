  md: "\n# Tutorial\n\n# Code a Tempest clone\nin FUZE BASIC Part 2\n\n# Remake a\
    \ classic game in FUZE BASIC\ndelve into the world of programming\n\ninstalled\
    \ for this, it can be downloaded for Linux and Raspberry Pi users from https://www.filesilo.co.uk/\n\
    \nWelcome to part two of our FUZE BASIC tutorial. You will need FUZE BASIC. \n\
    \nDon't worry; it's possible to skip part one and jump straight into it. However,\
    \ because this is a fairly large program, you will need to download the program\
    \ list from FileSilo or here: https://www.fuze.co.uk/tutorials/73MP357TPART2.fuze.\n\
    \n73MP357 is coded by Luke Mulcahy, FUZE's resident coder and, in the nicest way\
    \ possible, our very human supercomputer. This issue takes his tame structure\
    \ further, adding all sorts of awesome to delight. This includes simple scoring,\
    \ power-ups, enemies and all the finest power. Gameplay is also improved with\
    \ smooth movement. In short, all you need for a rudimentary – but definitely playable\
    \ game.\n\n# What you'll need\n\n- FUZE BASIC V3 (fuze.co.uk/getfuzebasic)\n-\
    \ 73MP357PART2.fuze\n\nLuke Mulcahy is the FUZE team's in-house programmer. 15\
    \ years old, Luke is active in many programming languages, though he does join\
    \ FUZE BASIC at it paces.\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_75_0.png)\n\
    ![](img/df5857e82a6482b0f2db5a2e61e6012c_75_1.png)\n![](img/df5857e82a6482b0f2db5a2e61e6012c_75_2.png)\n\
    \n# FUZE BASIC\n\n## 01 Grab Part 2 code\n\nStart FUZE BASIC and either load (with\
    \ FB) 73MP57PART2.fuse or copy the code into the editor IF2 baseline from the\
    \ editor and mode. If you follow the first part month then you will be pleased\
    \ with what is coming along. Run the program by pressing F3 or running in the\
    \ new window.\n\n## 02 Test out\n\nThe thing you'll notice is that we have a score\
    \ baseline. Tap the space bar and move left and right. If you fire, hold for a\
    \ second longer and you will also earn the important \"Power Up,\" in which baseline\
    \ increases with a Particle. Laser also becomes enemies, but more importantly,\
    \ if you touch them they will destroy you and stop the program, then F2. We'll\
    \ be brief on the sections that we created last month and offer more detail on\
    \ the new additions.\n\n## 03 Set up environment (lines 021-027)\n\nOur initial\
    \ setup sets up a few variables. There are a number of variables used for score,\
    \ frame rate, minfps and maxfps. It has built in a very dynamic resolution feature\
    \ that adjusts the (resolution) max to frame rate. You can see the screen adjust\
    \ until it limits resolution to frame rate. If it reaches 60fps, a delay is used\
    \ to keep it in. We'll come back to this later in the project when you will find\
    \ functions to vary the frame in sync. The variables are throughout.\n\n## 04\
    \ Set up floor (lines 028-042)\n\nThe star field was created last month but this\
    \ creates three relative arrays to store the position and angle of 100 stars.\
    \ The arrays are populated with random initials.\n\n## 05 Laser variables (lines\
    \ 043-059)\n\nThe good stuff. A few arrays are set up to store score and movement\
    \ position for each of the lasers. LaserReload (an integer) 2 on line 53, the\
    \ first part of a frame sync is created. This is so that the lasers can't keep\
    \ up with the speed of the frame, they will reload at the same speed.\n\n## 06\
    \ Enemy variables (lines 056-069)\n\nThere's no point having a laser if we can't\
    \ use it to supply plenty of enemies head-bent on following some path of movement\
    \ or you. Just a few arrays are set up to store enemy angles, distance (from the\
    \ center) and speed however an additional variable (enemyhealth) has been added\
    \ so that we have different results from weaponry.\n\n## 07 Power and power-ups\
    \ (lines 070-085)\n\nWe handle variables here like the laser angle, score and\
    \ the power-up colour and age.\n\n## 08 Main loop (lines 087-137)\n\nThis is the\
    \ main loop. We are start to meet the screen for key presses. Here we have it\
    \ to set A and the left and right.\n\n## 09 Release the power-up (lines 189-190)\n\
    \nWe begin the game with a single-shot laser. We only release the power-up if\
    \ we haven't powered up. This function is checked with Laser=FALSE, then a new\
    \ one is released and all variables initialized.\n\n## 10 Move the power-up (lines\
    \ 157-160)\n\nNext it is moved toward the player with powerupDist = powerupDist\
    \ + (radius).\n\n## 11 Get the power-up (lines 161-174)\n\nIf so, it is in the\
    \ same place as the player (playerAngle = gap / 2) if it is at the outer edge\
    \ and Laser=TRUE.\n\n## 12 Adjust shot speed (lines 175-186)\n\nThis determines\
    \ release frequency. releaseCount is significantly quicker than standard shotRate(shotCount).\n\
    \n## 13 Top up enemies (lines 195-207)\n\nIf we have the maximum number of enemies\
    \ on screen and we are within the enemyCount bounds, this will introduce a new\
    \ enemy.\n\n```\n// Check for enemies being present\nIf time > 300\n  If enemyCount\
    \ > 0\n    enemyCount = enemyCount - 1\nElse\n  If enemyCount = 0\n    If numEnemies\
    \ < maxEnemies\n      For i = 0 to maxEnemies\n        If enemyDist(i) < radius\n\
    \          enemyDist(i) = radius\n          enemyAngle(i) = (RND - vertices) +\
    \ (gap / gap)\n          health(i) = 100\n          numEnemies = numEnemies +\
    \ 1\n          enemyCount = enemyDelay\n          Break\n    Repeat\n```\n\n##\
    \ 14 Plot the stars (lines 208-231)\n\nThe star field runs through the maxStars\
    \ variable, increasing the distance from the center until it travels off the screen.\
    \ At that point it resets back to the center with a random factor so they appear\
    \ again with simple PLOT(starsX,starY).\n\n```\n// Route the points\nColor = White\n\
    While startTime < maxStars\n  star = starsDist(starsNum) * COS(startTime(starsNum))\n\
    \  starsX = centerX + star\n  star = starsDist(starsNum) * SIN(startTime(starsNum))\n\
    \  starsY = centerY + star\n  starsDist(starsNum) = starsDist(starsNum) + starsSpeed(starsNum)\n\
    \  If starsX < 0\n    starsDist(starsNum) = RND(15) + 5\nENIF\n  If star > gWidth\n\
    \    starsDist(starsNum) = RND(15) + 5\nENIF\n  If star < 0\n    starsDist(starsNum)\
    \ = RND(15) + 5\nENIF\n  If star > gHeight\n    starsDist(starsNum) = RND(15)\
    \ + 5\nPLOT(star,star)\nstarsNum = starsNum + 1\n```\n\n## 15 Draw playing field\
    \ (lines 232-251)\n\nWe explained this in last month and has little changed. Basically,\
    \ the playing field is drawn in segments around the circumference of a circle\
    \ using three line.\n\n```\n// Draw the playing field\nCOLOUR = Blue\nWILE angle\
    \ < 360\n  x = radius * COS(angle)\n  y = radius * SIN(angle)\n  x2 = centerX\
    \ + x\n  y2 = centerY + y\n  radius2 = radius + SIN(angle)\n  y2 = centerY + y\n\
    \  LINE(x,y,oldX,oldY)\nLINE(x2,y2,oldX,oldY)\n  oldX = x\n  oldY = y\n  oldX\
    \ = x2\n  oldY = y2\n  angle = angle + gap\nRepeat\n```\n\n## 16 Calculate and\
    \ draw player position\n\nThe player position is becoming more complex. This introduces\
    \ a new function: DEF lerp(a,b,c) which is going to be used from now on:\n\n```\n\
    DEF lerp(a,b,c)\n  result = a + c * (b - a)\n```\n\n```\n// Calculate the player\
    \ position\nIf playerAngle - oldPlayerAngle < ((0 - 360) + gap) + 1\n  tmpAngle\
    \ = lerp(playerAngle, oldPlayerAngle + 360)\n  oldPlayerAngle,count = moveDelay\n\
    ELSE\nIF playerAngle - oldAngle > (360 - gap)\nTHEN\n  tmpAngle = fn lerp(oldAngle,\n\
    \  oldAngle + 360, moveDelay)\nELSE\n  tmpAngle = fn lerp(oldAngle,\n  oldAngle.count,\
    \ moveDelay)\nENDIF\nIF player = ((radius + COS(tmpAngle) * gap / 2) + centerX,\
    \ (radius + SIN(tmpAngle) * gap / 2) + centerY)\n  particleLayer = TRUE\nENDIF\n\
    ```\n\nScore: 550\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_78_0.png)\n\n# TBC-\n\
    And that's for it! At this stage we have\nbashic of the game. Next time we will\
    \ see\nupdating, into progressive scoring and level, add\nennemies and difficulties,\
    \ includes a start-up\nscreen and any finishing touches. We see next\nTo find\
    \ out more FUZE BASIC and the FUZE in,\nplease visit www.fuze.co.uk\n\nwww.linuxuser.co\n"
