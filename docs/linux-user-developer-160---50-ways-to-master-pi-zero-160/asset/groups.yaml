    \n## 组测\n\n## Chromium 浏览器\n\n有一些项目采用了 Chromium 代码来推出自己的网络浏览器。但有人能击败谷歌的旗舰 Chrome\
    \ 浏览器吗？\n\n### Google Chrome\n据报道是地球上使用最广泛的浏览器，但内核只是带有额外功能的 Chromium。Chrome 包含了用于专有格式的许可代码，可以访问更广泛的媒体内容、AAC\
    \ 和 MP3 编码的音频。\n下载：bit.ly/1BxukGG\n\n### Chromium\nChromium 是我们测试中唯一的开源浏览器，很多事情是显而易见的：Chromium\
    \ 没有像 Chrome 那样有魅力，因为我们不使用许可内容；然而，现有的功能集将使浏览器性能与其他竞争对手竞争。\n下载：bit.ly/1MvHy6k\n\
    \n### Opera\nOpera 是一款备受尊敬的 Linux 浏览器，历史悠久。它曾实现自己的 Presto 引擎，但从 2013 年起，Opera\
    \ 放弃了它而转向 Blink，后者使用了谷歌的组件。Opera 在 2014 年夏天发布了新的 Linux 浏览器，具有显著的设计。\n下载：opr.as/1FvGzZ\n\
    \n### Vivaldi\nVivaldi 的出现是一项倡议，旨在将旧 Opera 丰富的功能带回到新的水平，以 Chromium 代码为基础。Vivaldi\
    \ 直接与 Opera 竞争，带回了被 Opera 从 Presto 切换到 Blink 渲染引擎困扰的用户。\n下载：bit.ly/1cCQg3D\n\n\
    www.linuxus.co.uk 83\n\n84\n\n## Opera\n\n## Vivaldi\n\n它有一个更新的插件品牌，但有理由让 Opera\
    \ 成为你的浏览器吗？\n\n这款由前 Opera 首席执行官 Jon von Tetzchner 开发的浏览器正变得非常...\n\n## 插件\n\n\
    ![](img/df5857e82a6482b0f2db5a2e61e6012c_84_0.png)\n\nOpera 有一个拥有超过 500 个扩展的插件目录，但可以使用\
    \ Chrome 插件。要这样做，请在 Vivaldi 中启用开发者模式并使用 chrome-extension.com 手动加载解包的扩展（获取）。这是一个实验性功能，请注意。\n\
    \n## 插件\n\nVivaldi 是一款在 2015 年出现的新浏览器，因此可以理解许多功能仍然缺失。没有官方插件目录，但可以使用 Chrome 插件。\n\
    \n## 用户体验\n\nOpera 官方为 Ubuntu 提供了 DEB 软件包。如果你的系统不是 Debian 或 Ubuntu 克隆，你将需要拆分包并依赖第三方包。由于\
    \ Opera 的能力有限，你的体验因发行版而异。\n\n## 用户体验\n\nVivaldi 凭借其设计提供了体验。它继承了旧 Opera 的精神，但没有同步功能，没有插件。然而，Vivaldi\
    \ 团队专注于标签页、窗口注释和为书签添加备注。\n\n## 多媒体支持\n\nOpera 对支持的格式和编码进行了研究，但 Opera 包包含了本地 FPEG\
    \ 副本，允许在 Linux 上播放许多相关问题。Opera 还带有 PDF 查看器，并可以使用 Chrome 的插件，特别是最新版本的 Flash。\n\n\
    ## 多媒体支持\n\n该浏览器拥有编码器和格式的所有基本支持，包括支持 Flash Player、MP3 和 AAC 的 HTML5。它与 Chrome\
    \ 中发现的相似。\n\n## 特色功能\n\nOpera 开发者创建了他们的同步服务，不依赖任何东西，真的非常好。Opera 还具有一些独特的功能，如 Opera\
    \ Turbo（针对慢网络）、鼠标手势、密码管理器等。\n\n## 特色功能\n\n对 Vivaldi 的兴趣很大程度上归于媒体炒作。Vivaldi 更多关于社区和社交生活，而不是额外功能。遗憾的是，该浏览器没有任何\n\
    \n## 总结\n\n如果 Opera 能在主流发行版（Ubuntu 外）上进行测试，它将会有更好的机会。Opera 擅于提供一致且最无故障的媒体播放和高级同步服务。\n\
    \n## 总结\n\nVivaldi 是一个不错的浏览器和一个有前景的项目，但在现阶段，我们不确定你应该放弃目前的浏览器转向 Vivaldi，因为后者仍然缺少许多重要功能。\n\
    \nwww.vivaldi.com | 85\n\n"
