    欢迎阅读 Linux User & Developer 最新期，这是英国和美国最喜爱的 Linux 和开源杂志。自从原始的树莓派 B 发布以来已经过去多年，树莓派基金会超越了自我。通过推出一款售价
    35 美元的摄像头，它推出了一款仅需 5 美元的全新型号——树莓派 Zero，这是一项了不起的成就，将让更多教育机构负担得起学生使用的设备，并将基金会的教育使命推向一个全新的世界。


    它更小，在可用功能方面略有限制，但它比我们使用的原始 Pi B 强大得多。你可以在第 58-59 页了解到电路板发生的具体变化。如果你已经有了一个，我们很高兴地知道我们的所有
    50 个技巧适用于你的新 Pi Zero —— 还有关于如何在线获取新板的指南。翻到第 60 页即可开始。


    我们花时间研究如何通过一些诊断工具和调整轻量级开源软件（FOSS）来改善你的 Linux 体验，你可以在第 20 页找到我们最佳的优化方案。阅读愉快！

