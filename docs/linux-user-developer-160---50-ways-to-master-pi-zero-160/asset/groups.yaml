    #  1 Tiny


    This is the smallest Raspberry Pi ever, at just 35x30mm (1.4x2 inches)—it''s half
    the size of a credit card. It''s perfect for embedded projects, where attaching
    them to microcontrollers or making wearable devices matters.


    #  4 HAT-compatible


    Unlike the original Raspberry Pi Zero, the board has HAT-addons that make it compatible
    with the original HAT specification, so your existing HAT-adds will work just
    fine.


    #  2 Powerful


    Despite the fact it uses the BCM2835 processor, it is about 60% faster than the
    original Raspberry Pi Model B, according to Eben Upton. It means we can use the
    standard Raspberry distro, just a regular desktop PC.


    #  5 Adaptable


    With all the GPIO pins, the Zero can display an output on monitors or TV as a
    desktop. You can expand the single micro-USB port by using a powered USB hub,
    so you can then plug in your keyboard, mouse, and Wi-Fi.


