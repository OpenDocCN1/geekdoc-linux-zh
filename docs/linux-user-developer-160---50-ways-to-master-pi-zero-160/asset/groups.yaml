    \ Google 应用商店上的所有好东西都能正常运行和工作。\n\nVivaldi 是一个很有前景的项目，它已经展示了惊人的开发速度并修复了许多 UI 缺陷。它被标记为“beta”是理应的，因为还有很多功能即将到来，包括云同步等许多重大功能。\n\
