    # Extra features


    The interest in Vivaldi is largely explained by the media

    hype. Vivaldi is more about community and social life, than extra

    features. Unfortunately, the browser doesn''t have any


    # Overall


    If only Opera was tested on mainline distros (other than

    Ubuntu), it would have a better chance of winning. Opera

    is good at providing a consistent and most trouble-free

    media playback and advanced synchronisation service.


    # Overall


    Vivaldi is a nice browser and a promising project,

    but at this stage we''re not confident you should ditch your

    current browser for Vivaldi, as the last still misses many

    important features.


