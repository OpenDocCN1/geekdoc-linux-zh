    \n如果检查通过，在终端中输入 `sudo hostname -I`。这将显示树莓派的 IP 地址。\n\n### 16 启动 Web 服务器\n\n你已经到达了准备启动\
    \ Web 服务器的节点。移动到 Mobile_Lights 文件夹并输入 python mobile.py。这将启动 Web 服务器，然后它准备好响应网页上点击的按钮。\n\
    \n## 14 整合一切\n\n最后的设置是编写控制移动灯和 style.css 文件的脚本，使用与步骤 7 类似的插座控制代码。打开 IDE 并开启新窗口，添加以下代码以保存你的\
