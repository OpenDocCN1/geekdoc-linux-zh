    # 机器人

    CamJam Pi EduKit 3


    使用这套简单且易于组装的套件，将树莓派变为机器人


    这可能不是审判日，但机器正在崛起——即使是树莓派！CamJam EduKit 3 允许你将 Pi 安装为机器人的控制器，是爱好者、儿童甚至树莓派初学者的理想选择。


    这个轻量级盒子包含了你开始树莓派之旅所需的所有物品。两个电机有点笨重，但内部的所有物品都很轻量——正如你按照项目说明书和建议的底盘所预期的那样。书中还提供了胶带用于固定电机和电池盒，以及必少的电池。


    通过完成项目说明书，你将从桌上的一堆组件转变为构建一个按照纸上打印的线条运行的机器人。然而，这并不简单——把所有东西组装在一起就能运行；其中还有更多细节……


    核心组件是一个跨越 GPIO 的电机控制器，利用 GPIO 引脚和 LED 启动运动；虽然电机的导线涂了锡，以提供足够的厚度使其固插入连接器中，但来自电池盒的电线没有。我们在第一次超时时发现它们被拔掉了。


    另一个限制是电源源。在没有进行定制的情况下，运动受限于电线的长度以及携带便携式电源的能力，无论是轻便的手机充电宝，还是结合六节 AA 电池和一个 UBEC
    的定制解决方案（见第 14 题）。总的来说，CamJam 的机器人套件在 20 英镑以下绝对是必备之选！


    > Christian Harvey


    # 总结


    易于遵循的指令组合结合将任何小组件盒转换为 Pi 控制机器人的能力，意味着 CamJam EduKit 对于任何对扩展树莓派可能性感兴趣的人（无论是成人还是孩子）都是合适的。而且它价格实惠！


    | 价格 |

    | :--- |

    | 17 英镑 (camjam.me/edikit) |


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_89_1.png)


    90 * Temeiw*


    # 技术规格


    智能不断电电源 (UPS)

    集成锂聚合物电池

