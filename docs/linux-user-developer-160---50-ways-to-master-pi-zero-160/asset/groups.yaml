    var myChart = new Chart(ctx, polarData);\n```\n\nThe process to plot radar charts\
    \ using Chart.js is: you just need to call the Radar() method:\n\n```javascript\n\
    var myChart = new Chart(ctx, polarData);\n```\n\nThe process to plot radar charts\
