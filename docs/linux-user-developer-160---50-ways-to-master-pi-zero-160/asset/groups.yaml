    # ROBOTICS

    CamJam Pi EduKit 3


    Transform a Raspberry Pi into a robot with this straightforward, easy-to-assemble
    kit


    It might not be Judgment Day, but the machines are rising — even Raspberry Pi!
    The CamJam EduKit 3 allows you to install your Pi as the controller of a robot
    that is ideal for hobbyists, kids and even Raspberry beginners.


    The lightweight box contains everything you need to get started with the Raspberry
    Pi. The two motors are a little bulky, but everything inside is lightweight —
    just as you''d expect once you follow the project sheets and the suggested chassis.
    Adhesive strips are also provided for you to secure the motors and the battery
    case, along with the obligatory batteries.


    By progressing through the project sheets, you''ll move from having a bunch of
    components on your desk to building a robot following a line printed on a sheet
    of paper. However, it isn''t as simple as--style put everything together and it
    works; there''s a little more to it than...


    The core component is a motor controller that sits across the GPIO, utilising
    GPIO pins and the LEDs to initiate movement; while the wires from the motors have
    been coated with solder to give them the necessary bulk to snug into the connectors,
    from the battery case have not. We found these pulled out when we were firstly
    timeout.


    Another limit is the power source. Without customisation, motion is limited by
    the length of your wires and power to carry a portable power supply, whether a
    lightweight phone recharge or a custom-build solution combining six AA-batteries
    and an UBEC (see issue 14). Overall, CamJam''s robotics kit is a must-have under
    £20!


    > Christian Harvey


    # Summary


    The combination of instructions that are easy to follow and the ability to turn
    any small box of components into a Pi-controlled robot means that the CamJam EduKit
    is not unsuitable for anyone — adult or child — who has some interest in extending
    the possibilities of their Raspberry Pi. And it is affordable!


    | Price |

    | £17 (camjam.me/edikit) |


