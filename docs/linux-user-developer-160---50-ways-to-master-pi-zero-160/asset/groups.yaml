    \ *argv, int flags)\ns = Py_SimpleString(\"The line is: Hello World\");\n```\n\
    \n这是 `Py_SimpleStringFlags(char *command, PyCompilerFlags *command)` 的简单版本，它还接受一个用于编译器的标志结构体。如果你需要检查标志，可以在编译器中查看详细信息。\n\
    \n假设你有一段 C 代码，其功能等同于 Python 脚本。文件使用 `Py_SimpleFlags *File, const char filename`\
    \ 初始化。如果你想从脚本中获取从 C 获取的函数，如果它是对脚本的引用，你可以通过读取文件获取函数。\n\n```c\nint PyRun_SimpleFileFlags(char\
    \ *filename, int flags)\n```\n\n你还需要用该文件打开 Python 解释器。该函数将带有正确的标志来打开此脚本。Python\
    \ 从此处返回函数的返回值：\n\n```c\nPyObject *Object = PyString_FromFromString(\"Hello World\"\
    );\n```\n\n然后你就可以配合函数使用 Python 对象。例如，如果你在字符串名称中开始一个 Python 模块名，可以通过函数调用导入它。你也可以从\
    \ C 代码中获取对象。你可以在此处引用问题中模块的字典：\n\n```python\nmy_module = PyImport_GetDict(name=\"\
    __main__\")\n```\n\n一旦获取了字典，你就可以通过以下方式获取特定对象的引用：\n\n```python\nmy_func = PyDict_GetItemString(dict,\
    \ name=\"my_func\")\ndict = PyDict_GetItem(dict, name=\"my_func\")\n```\n\n# 完整代码列表\n\
    \n```c\n# 简单的运行 Python 代码的方法\n#include <Python.h>\n\nint main(int argc, char *argv[])\
    \ {\n    Py_SetProgramName(argv);\n    # 初始化 Python 解释器\n    Py_Initialize();\n\
    \    # 运行 Python 代码\n    Py_RunSimple(\"from time import time, time\\nprint('Today\
    \ is', time())\\n\");\n    Py_Finalize();\n    return 0;\n}\n\n# 你创建一个交互式 Python\
    \ 控制台\n#include <Python.h>\n\nint main(int argc, char *argv[]) {\n    Py_SetProgramName(argv);\n\
    \    // 初始化 Python 解释器\n    Py_Initialize();\n    // 运行 Python 代码\n    Py_RunSimple(\"\
    from time import time, time\\nprint('Today is', time())\\n\");\n    Py_Finalize();\n\
    \    return 0;\n}\n\n# 你创建一个交互式控制台\n#include <Python.h>\n\nint main(int argc,\
    \ char *argv[]) {\n    FILE *fp;\n    fp = fopen(\"script.py\", \"r\");\n    Py_RunSimpleFileFlags(fp,\
    \ 0);\n    Py_Finalize();\n    fclose(fp);\n}\n```\n\n"
