  mdcn: "\n\n# Chart.js 教程\n\n## 使用 Chart.js 可视化你的数据\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_35_0.png)\n\
    \nChart.js 是一个 JavaScript 库，帮助你在网站上绘制各种精美的图表。\n\n当你需要以尽可能清晰的方式向观众传达信息时，数据可视化是最重要的考虑因素之一。无论是是一眼就能理解，还是将数据隐藏在图表中而不是纯表格中（这比文本效果更好），数据可视化总能为你和你的演示文提供支持。\n\
    \n## 01 安装\n\n要安装 Chart.js 库，只需从 Chart.js 的官方 GitHub 仓库下载 JavaScript 库，然后在你需要使用的地方引入\
    \ `chart.js` 文件：\n\n```html\n<script src=\"chart.js\"></script>\n```\n\n注意，在包含库文件时，你需要在文件系统中传递\
    \ `chart.js` 文件的正确路径。\n\n与其手动下载，你可以使用如 NPM 或 Bower 等 JavaScript 包管理器。你可能已经知道 NPM\
    \ 常用于管理 Node.js 项目，Bower 也支持它。\n\nChart.js 是为前端库设计的。区别在于 NPM 使用嵌套的依赖树，将依赖管理的负担交给了用户。回到\
    \ Chart.js，这里是使用 Bower 获取它的方法。\n\nNitish Tiwari 是一位软件开发者，他热爱自己增强的开源软件。正如在杂志上为自己写文章一样，他也帮助他人为业务需求寻找开源软件。\n\
    \n## 资源\n\nCharts.js\nchartjs.org\n\n```bash\n$ bower install Chart.js --save\n\
    ```\n\n如果你需要 NPM：\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_35_1.png)\n\n正确的\
    \ Chart.js 让你仅需极少代码即可绘制常见图表。这是一个带有自定义工具提示的饼图。\n\n```bash\n$ npm install chart.js\
    \ --save\n```\n\n此外，Chart.js 也可以通过 CDN 获取：https://cdnjs.com/libraries/Chart.js。\n\
    \n## 02 创建你的图表\n\n一旦你有了图表，就可以开始绘制图表了。第一步是创建一个 `canvas` 标签并为其分配一个 ID。稍后，你需要通过 ID\
    \ 获取元素并使用它初始化 `Chart` 类。例如，在 HTML 文件中创建一个 ID 为 `myChart` 的 `canvas` 以便你绘制图表：\n\
    \n```html\n<canvas id=\"myChart\" width=\"400\" height=\"400\"></canvas>\n```\n\
    \n然后，在 JavaScript 中，通过 ID 获取 `canvas` 的上下文，并在第一步中实例化 `Chart` 类：\n\n```javascript\n\
    var ctx = document.getElementById(\"myChart\");\nctx = ctx.getContext(\"2d\");\n\
    var myChart = new Chart(ctx, polarData);\n```\n\n如果你使用 jQuery，步骤保持不变。改变的是语法：\n\
    \n```javascript\nvar ctx = $('#myChart').get(0).getContext(\"2d\");\nvar myChart\
    \ = new Chart(ctx, polarData);\n```\n\n正如你所注意到的，在创建 `Chart` 对象后，使用了 `AreaPolar`\
    \ 方法。这会根据传递作为方法参数的数据绘制一个极坐标图。\n\n## 03 折线图\n\n折线图是最常用的图表之一，它显示数据点并在线上连接它们。这里有一个单条线的示例，用于显示更多数据。它也可以用于比较数据集。要绘制折线，你只需在\
    \ `Chart` 对象上调用 `Line` 方法。\n\n```javascript\nvar myChart = new Chart(ctx, lineData);\n\
    ```\n\n现在，`Line` 方法有两个参数。这让你了解了它们是如何工作的。第一个参数处理数据点、标签以及关于图表外观和数据点绘绘制位置的元数据。这里有一个示例数据集：\n\
    \n```javascript\nvar data = {\n  labels: [\"January\", \"February\", \"March\"\
    , \"April\",\n  \"May\", \"June\", \"July\"],\n  datasets: [\n    {\n      label:\
    \ \"My Dataset\",\n      backgroundColor: \"rgba(255,99,132,0.2)\",\n      borderColor:\
    \ \"rgba(255,99,132,1)\",\n      pointBackgroundColor: \"rgba(255,99,132,1)\"\
    ,\n      pointBorderColor: \"#fff\",\n      pointHoverBackgroundColor: \"#fff\"\
    \n    }\n  ]\n};\n```\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_36_0.png)\n\n\
    使用全局默认值并仅修改你想修改的部分，就像这个贝曲线图示例所示。\n\n`options` 选项帮助你获取有关图表其他方面的信息，例如数据点之间的线应该是曲线的还是直线。你甚至可以设置点的半径。不需要强制设置所有值，只需设置你想更改的值。其余字段从全局默认值获取。\n\
    \n```javascript\nvar myChart = new Chart(ctx,lineData, {\n  bezier: false\n});\n\
    ```\n这使用默认选项创建图表，仅设置 `bezier: false`，意味着连接点将是直线。\n\n## 04 柱状图\n\n柱状图是非常受欢迎的选择，用于显示随时间变化的数据点或其他参数。柱状的高度对应于数据点（如果柱在\
    \ x 轴上）或长度（如果在 y 轴上）。垂直柱可以并排放置。以下是如何在 Chart.js 中绘制柱状图：\n\n## 全局配置\n\n除了全局方法外，配置适用于所有图表类型，避免了配置每个实例的需求。你可以在\
    \ `chart.js` 文件中找到它。\n\n```javascript\nvar myChart = new Chart(ctx,data,options));\n\
    ```\n\n注意，柱状图的数据结构与折线图类似。\n\n## 05 雷达图\n\n雷达图是一种将数据显示为二维图的方式。在这些图表中，三个或多个变量被绘制在相同的轴上。这类图表的另一个特点是轴的相对位置和角度是直观的。你可以使用雷达图绘制多个变量。使用\
    \ Chart.js 绘制雷达图的过程是：调用 `Radar()` 方法：\n\n```javascript\nvar myChart = new Chart(ctx,polarData);\n\
    ```\n\n（此处省略重复的雷达图描述段落，翻译保持一致）\n\n# 添加新图表类型\n\n如果你愿意并且不反对将新的图表类型添加到现有的。Chart.js\
    \ 提供了你需要以某种格式传递名称的方法，这非常简单。对于新类型，Chart 辅助函数下有一组方法，包括收集请求、动画帧和方程。在所有这些方法上，对于 Chart\
    \ 元素的一些基类。这些元素类似于 `Chart.Element`，包含了点、条和刻度等内容。\n\n> 上述散点\n> 图表是社区\n> 扩展\n> 的结果\n\
    \n```javascript\nChart.typeextend{\n name: \"scatter\",\n defaults: {\n options:\
    \ \"Here\",\n available: \"st this options\"\n }\n initialize:function(data) {\n\
    \ this.chart\n this.chart.canvas\n }\\ draw:function() {\n }\n});\n```\n\n"
