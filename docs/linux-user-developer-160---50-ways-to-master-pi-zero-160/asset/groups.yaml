    ## UBUNTU


    ## 通过这些技巧和方法让 Ubuntu 运行更快


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_22_0.png)


    环境，你只需要使用 **apt-get** 命令在你的系统上安装它即可。例如：


    - `sudo apt-get install ubuntu-desktop`


    上面的 Ubuntu 桌面运行速度快且所需的资源更少，运行更流畅。


    安装完成后，你可以通过注销然后重新登录并选择使用来开始。


    后台进程是电脑响应缓慢的另一个常见原因。诸如 `apt-update` 或 `unattended` 这样的进程可能会后台运行几天，并在运行期间减慢你的电脑速度。在
    Ubuntu 中，使用了索引程序 apt-indexer。它能加速搜索操作，但可能会减慢你的系统速度。如果你移除这个包，它并不是必不可少的，而且占用空间小，你可能甚至察觉不到它的消失。在轻量级
    Ubuntu 中没有这个包。要卸载它，只需输入：


    Ubuntu 刚开始运行时非常敏捷，但仍然有一些普通用户不需要的方面。如果你在旧机器上运行 Linux，请考虑将其精简到最低，这样你的系统运行速度会快得多。


    默认安装带有一个 Ubuntu 及其桌面环境，它是非常消耗资源的。第一步是安装一个轻量级桌面环境，如 LXDE 或 Xfce，来简化你的桌面环境。Xfce
    是一个适用于各种系统的轻量级桌面环境。它是 Ubuntu 的默认环境。要开始使用其中之一：


    - `sudo apt-get purge ppa:apt-indexer`

    - `sudo apt-get install apt-fast`


    软件安装本质上是一个缓慢的过程，因为包需要先下载。Apt-fast 是一个 shell 脚本，它通过同时打开多个连接来更新包缓存并下载包。如果你使用终端和
    **apt-get** 安装包，你可能需要尝试 apt-fast。使用以下命令通过官方 PPA 安装 apt-fast：


    - `sudo add-apt-repository ppa:apt-fast/stable`

    - `sudo apt-get update`

    - `sudo apt-get install apt-fast`


    ## 最佳 Ubuntu 优化


    ### PRELOAD


    Preload 是一个监控你所使用的程序的守护进程。它学习程序使用的库和二进制文件并将其加载到内存中，以便程序启动更快。如果你在启动电脑后打开 Firefox，preload
    会在你启动它时自动将其文件加载到内存中。要安装它，通过 apt-get 安装 preload 包。


    ### APT 自动缓存


    Ubuntu 使用 apt 管理包及其依赖关系。它将缓存维护在 /var/cache/apt/ 下，随着时间的推移，该缓存可能会充斥关于旧包的无用信息。/etc/apt/lists
    下的 apt 列表也需要清理。要清理它们，运行 `apt-get clean`。根据你的使用情况，你可能需要释放大量的磁盘空间。


    ### 修改 SWAPPINESS 值


    交换（Swapping）控制内核在物理内存和虚拟内存之间交换的倾向。接受的值范围为 0-100。内核尽可能避免交换，而 100 则允许所有操作。Ubuntu
    的 swappiness 为 60。如果你想更改该值，请使用命令：`vm.swappiness=10`。为了在重启后保存该值，请编辑 /etc/sysctl.conf，如果该行不存在，则添加
    `vm.swappiness=10`。


    ### 减少过热


    过热是一个持续数日的问题——当你的 CPU 运行运行时，打开一个程序可能需要很长时间。TL 可以减少 Ubuntu 的过热并提升系统性能，它在后台运行：


    - `sudo add-apt-repository ppa:linuxner/tl`

    - `sudo apt-get update && sudo apt-get install tl-rdp`

    - `sudo apt-get tip`


    ## 加速 Linux 特性


    ## 系统与服务


    尝试这些适用于所有发行版的系统级修复方法


    我们刚刚查看了 Debian 和 Ubuntu 系统的性能优化建议。但还有许多其他 Linux 发行版，可能无法涵盖所有发行版的建议，不过有一些建议并非特定于某个发行版，但也适用于所有发行版。让我们现在来看看这些建议。


    其中首要的是 GRUB 配置。GRUB 负责启动过程，你必须注意由 GRUB 启动的引导过程。默认情况下，它会显示 10 到 30 秒的启动菜单。你可以通过编辑
    GRUB 默认配置文件来延迟启动加载程序的持续时间，甚至可以跳过倒计时。例如：


    如果你更改了 GRUB，还有几点需要考虑。在每行显示时间以及测量值，


    ```

    cat /etc/default/grub

    # 如果你更改了此文件，运行 `sudo update-grub` 来更新更改。

    # 编辑该文件，添加以下行：

    GRUB_TIMEOUT=5

    GRUB_TIMEOUT_STYLE=menu

    ```


    ```bash

    $ sudo vi /etc/default/grub

    ```


    将与此相关的变量更改为类似 5 或 3 的数字。如果设置为 0，则默认将选择第一个项。保存并关闭文件。然后运行：


    `$ update-grub`


    我们的下一个建议是列出启动程序。这是因为你的系统可能会启动不必要的服务并启动，从而加速。


