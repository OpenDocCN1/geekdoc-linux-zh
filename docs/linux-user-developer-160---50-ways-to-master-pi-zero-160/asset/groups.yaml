    # Tutorial Springs.io


    # # Launch scaleable Linux containers on Springs.io


    # ## Find out how cgroups and namespaces power Linux containers, and set up a
    pay-as-you-go server


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_43_0.png)


    Linux containers have been an explosion of interest in recent years, but all containers
    are powered by two under Linux technologies that we are going to explore in this
    article. Here we will compare containers to traditional VMs with some of the underlying
    technology.


    # 01 Get to grips with cgroups and namespaces


    Let''s start with什么样的 containers. They are a lightweight form of virtualised server
    that offer improved performance compared to virtual machines. The last two years
    have seen the Linux kernel have enabled a new generation of scalable containers
    that could make the serverless approach a more reality. Many tools have emerged
    for managing containers, including Docker, LXC, Incmty, Kubernetes and more.


    Cgroups, stands for control groups, limit and measure the resources used by a
    group of processes running on a system. Namespaces limit the visibility of a group
    of processes. Cgroups and namespaces allow for setting up a group of processes
    running inside an isolated environment. While both work together, the Linux kernel
    has led to some interesting applications for cloud infrastructure. The updates
    to cgroups now that improved insight into a server''s resource usage can allow
    for more isolation of processes, enabling better security.


    Richard Davis

    CEO and co-founder of Springs.io. According to this, he was one of the founding
    engineers of Spring Technologies PLC & limited with videos


    In most cases it doesn''t make sense for system administrators to directly use
    cgroups and namespaces - a container tool, such as Docker, LXC or Incmty, will
    do this for you. But if you want to understand what''s under the hood, rather
    than just working with the kernel technologies deeply. Having said that...


    # Resources


    Springs.io

    springs.io


    Lightweight containers

    bit.ly/3hello


    Cgroups

    bit.ly/h88wccd


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_43_1.png)


    Right Terminal: showing processes for cgroups'
