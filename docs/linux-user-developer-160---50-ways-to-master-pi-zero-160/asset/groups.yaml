    \n## 教程\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_73_0.png)\n\n上方 使用智能手机控制你的家庭环境\n\
    \n## Pi-mote\n\n你需要正确保存文件夹文件\n\n## CSS\n\n为了创建一个网页，你需要使用 HTML 和 CSS。HTML 代表超文本标记语言，CSS\
    \ 是用于创建网页的语言。你可以将 HTML 文件转换为网页。级联样式表，CSS 是描述网页外观的代码。它包含了在浏览器中渲染的 HTML 内容。在教程中，它控制屏幕上的显示方式。\n\
    \n## 创建新文件夹\n\n安装 Flask 后，重启你的树莓派；输入 `mkdir mobile_lights`。创建一个名为 Mobile_Lights\
