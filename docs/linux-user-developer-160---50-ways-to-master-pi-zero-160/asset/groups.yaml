    \ for example, let us use a line chart:\n\n```\nvar LineChart = new Chart(ctx,Line(data);\n\
    ```\n\nFirst method is clear(). This clears the chart canvas on\nmyLineChart is\
    \ drawn. You can use this animation\nframes to clear the frame and render again:\n\
    \n```\nmyLineChart.clear();\n```\n\nNext method is stop(), used to stop the current\
    \ animation\nframe. The frame is paused until you call this method:\n\n```\nmyLineChart.stop();\n\
    ```\n\nUse resize() to manually resize the chart element. This is\ne time the\
    \ chart is drawn, but you can also call this\nmethod manually if you change the\
    \ size of the nodes\ncontainer element:\n\n```\nmyLineChart.resize();\n```\n\n\
    The last method will destroy(). This will clean up\nany references to the chart\
    \ object within Chart.js,\nand any associated event listeners attached to Chart.js:\n\
    \n```\nmyLineChart.destroy();\n```\n\nThere are few other methods available as\
    \ well. In\nthese generic methods, there are several-chart-\nprototype methods.\
    \ Constraints make it difficult to\ncover all of them, but you can look them up\
    \ in the official\nChart.js documentation.\n\n# Extending chart types\n\nAs we\
    \ know, open source software is not only\nbeing free to use and stuff, but also\
    \ able to\nextend and build upon the existing. Using the\nlines, let how you can\
    \ extend a chart class\nwith function. Let's say, for example, we want to\nadd\
    \ more code while initializing every line chart:\n\n```\nChart.types.Line.extend(){\n\
    \ // Passing a name registers this chart in the\n // Chart name in the same way\n\
    \ this.name = \"Line\";\n initialize:function(data) {\n Chart.types.Line.prototype.initialize;\n\
    \ console.log(\"My Line chart extended\");\n apply(this,arguments);\n }\n});};\n\
    ```\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_38_0.png)\n\n+   * dataset 1\n\
    * dataset 2\n\n```\n// Create a new chart in the same\nnew Chart(ctx,LineAll(data));\n\
    ```\n\n# Adding new chart types\n\nIf you're willing and are not opposed to having\
    \ a\nadd new chart types to the existing. Chart.js provides\nways you need to\
    \ pass the name in a format\nnis relatively simple. For the new type. There are\
    \ a set\nof methods under Chart helpers, including the\nup for collecting requests,\
    \ reanimation\nframes, and equations. On all of these, there are\nsome some base\
    \ classes for Chart elements. These\nelements are like Chart.Element, and includes\
    \ things such as\npoints, bars, and scales.\n\n> Above this scatter\nchart is\
    \ a result of\ncommunity\nextensions\n\n```\nChart.typeextend{\n name: \"scatter\"\
    ,\n defaults: {\n options: \"Here\",\n available: \"st this options\"\n }\n initialize:function(data)\
    \ {\n this.chart\n this.chart.canvas\n }\\ draw:function() {\n }\n});\n```\n\n\
    There are a handful of chart extensions\nof them is them scatter chart. Take a\
    \ look\nhere:dim172github.io/Chart.Scatter.\n\n* Asterisk\n\nwww.linuxuser.co.uk\
    \ 39"
  md: "\n# Tutorial Chart.js\n\n## Visualise your data with Chart.js\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_35_0.png)\n\
    \nChart.js is a JavaScript library that helps you draw gorgeous graphs of all\
    \ kinds on your website.\n\nData visualisation is one of the most important considerations\
    \ when you need to convey a message to your audience in the clearest manner possible.\
    \ Whether it is instantly understood or hide the data as charts and instead of\
    \ plain tables is better than text, data visualisation will always save the day\
    \ for you and your presentation.\n\n## 01 Installation\n\nTo install the Chart.js\
    \ library, just download the JavaScript library from the official Chart.js GitHub\
    \ repository and then include the chart.js file wherever you'd like to use it:\n\
    \n```html\n<script src=\"chart.js\"></script>\n```\n\nNote that you need to pass\
    \ the proper path of the chart.js file in your file system, while including the\
    \ library file.\n\nInstead of manual download, you can use JavaScript package\
    \ managers like NPM or Bower. You may already know NPM is used commonly to manage\
    \ Node.js projects. Bower also supports it.\n\nChart.js is created for front-end\
    \ libraries. The difference is that NPM uses a nested dependency tree, putting\
    \ the burden of dependency management on the user. Coming back to Chart.js, here\
    \ is how to grab using Bower.\n\nNitish Tiwari is a software developer who loves\
    \ open source software enhanced by himself. It's as well as writing for himself\
    \ in magazines, he helps others find source software for business needs.\n\n##\
    \ Resources\n\nCharts.js\nchartjs.org\n\n```bash\n$ bower install Chart.js --save\n\
    ```\n\nIf you need NPM:\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_35_1.png)\n\
    \nRight Chart.js lets you draw common graphs with just a tiny bit of code. This\
    \ is a pie chart with custom tooltips.\n\n```bash\n$ npm install chart.js --save\n\
    ```\n\nAlso, Chart.js is available from CDN: https://cdnjs.com/libraries/Chart.js.\n\
    \n## 02 Create your chart\n\nOnce you have the chart, you can start plotting graphs.\
    \ The first step is to create a canvas tag and assign an ID to it. Later, you\
    \ need to get the element using the ID and use it to initialize the Chart class.\
    \ For example, create a canvas with the ID myChart as you like to draw the graph\
    \ in the HTML file:\n\n```html\n<canvas id=\"myChart\" width=\"400\" height=\"\
    400\"></canvas>\n```\n\nThen, in JavaScript, get the context of the canvas using\
    \ the ID and instantiate the Chart class in your first step:\n\n```javascript\n\
    var ctx = document.getElementById(\"myChart\");\nctx = ctx.getContext(\"2d\");\n\
    var myChart = new Chart(ctx, polarData);\n```\n\nThe steps remain the same if\
    \ you are using jQuery, Here is the syntax that changes:\n\n```javascript\nvar\
    \ ctx = $('#myChart').get(0).getContext(\"2d\");\nvar myChart = new Chart(ctx,\
    \ polarData);\n```\n\nIf you noticed, after creating the Chart object, the method\
    \ AreaPolar is used. This draws a Polar chart with the data passed as the argument\
    \ to method.\n\n## 03 Line charts\n\nOne of the most commonly used charts, line\
    \ chart displays data points and connects them on a line. Here is an example of\
    \ a single line to show more data. It can also be used to compare sets of data.\
    \ To draw a line, you can just call the Line method on the Chart object.\n\n```javascript\n\
    var myChart = new Chart(ctx, lineData);\n```\n\nNow, there are two arguments for\
    \ the Line method. This gives you an understanding of how they work. The first\
    \ argument handles the data points, labels and metadata about how the graph should\
    \ look and where the points are plotted. Here is a sample dataset:\n\n```javascript\n\
    var data = {\n  labels: [\"January\", \"February\", \"March\", \"April\",\n  \"\
    May\", \"June\", \"July\"],\n  datasets: [\n    {\n      label: \"My Dataset\"\
    ,\n      backgroundColor: \"rgba(255,99,132,0.2)\",\n      borderColor: \"rgba(255,99,132,1)\"\
    ,\n      pointBackgroundColor: \"rgba(255,99,132,1)\",\n      pointBorderColor:\
    \ \"#fff\",\n      pointHoverBackgroundColor: \"#fff\"\n    }\n  ]\n};\n```\n\n\
    ![](img/df5857e82a6482b0f2db5a2e61e6012c_36_0.png)\n\nUse the global default values\
    \ and just change the ones you want, as in this example of the bezier chart.\n\
    \nThe options help you info about other aspects of the graph, such as whether\
    \ the line between the data points should be curved or not. You can even set the\
    \ radius of the point in dots. It is not mandatory to set all the values, only\
    \ the value you would like to change. The rest of the fields are taken from global\
    \ defaults.\n\n```javascript\nvar myChart = new Chart(ctx,lineData, {\n  bezier:\
    \ false\n});\n```\n\nThis creates a chart using all the default options, just\
    \ with the bezier option set false, meaning the connecting data points will be\
    \ straight.\n\n## 04 Bar chart\n\nBar charts are a very popular choice to display\
    \ data points over time or some other parameter. Bars are generally rectangular\
    \ bars with their height corresponding to the data point (if the bar is on the\
    \ x-axis) or their length (if on the y-axis). Vertical bars can be placed side-by-side\
    \ to make comparisons. Here is how you can plot a bar chart in Chart.js:\n\n##\
    \ Tutorial Chart.js\n\n## Global configuration\n\nAlong with the global prototype\
    \ methods, chart configurations are available for changes across all chart types\
    \ avoiding the need to configure each instance, or the default type. You can find\
    \ it in the chart.js file.\n\n```javascript\nvar myChart = new Chart(ctx,Bar(data,options));\n\
    ```\n\nNote that the data structure used for a bar chart is similar to the one\
    \ used in line charts.\n\n## 05 Radar chart\n\nA radar chart is a way to show\
    \ data as a two-dimensional chart. In these kinds of charts, three or more variables\
    \ are plotted on the same axes. Another quality of these types of charts is that\
    \ the relative position and angle of the axes is intuitive. You can use radar\
    \ charts to plot more than one variable.\n\nThe process to plot radar charts using\
