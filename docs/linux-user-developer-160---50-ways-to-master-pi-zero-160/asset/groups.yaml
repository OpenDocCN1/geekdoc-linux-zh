    I want to do more of it''. So I came up with a subscription model, which I have
    on devices that can subscribe to a data feed, and if I have an update, they blast
    it out to the other devices. There are numerous ways you could use this, and there
    are other things you could build yourself but I found PubSub online and they had
    a really good explanation of how it works. I had hoped it would work across Node,
    Arduino, Raspberry Pi.


    # Further reading


    SAM has launched an electronics kit for IoT: there are 15 individual blocks, each
    with a different sensor, that can be snapped together - samiabs.com


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_67_2.png)


    Right Cory hacked his model train with LEGO and Raspberry Pi, using an infrared
    sensor to track the train as it runs at the platform. Ultimately, it was a low
    barrier to entry and I was able to quickly build a server-front to my city, add
    the little subscription to it, and then I could.


    Left city lighting is controlled via a master switch. There are 12V LEDs used
    up to three-LED segments for the buildings, while micro LEDs the size of a human
    hair. Right The station platform elevator driven by a DC motor and a gear system,
    uses an infrared sensor to detect its distance from the ground and stop its movement.
    Recent news: Internet of LEGO blog publishes "WordPress visitor" to PubNub when
    it gets to miles, which then fires up the disco lights.


    # My Pi project


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_68_0.png)


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_68_1.png)


    Easily add little hook-ins on my blog if somebody goes to my city, it would actually
    turn on lights in my city. I''m working on an idea where I have Bluetooth: Low
    Energy beacons off my access point, and I can have an app on my phone so that
    it detects the beacon, it publishes to PubNub and then tells me to start the train
    - maybe after? (laughs) These are the sort of things I have in mind.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_68_2.png)


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_68_3.png)


    # What''s next for incursion?


    I''m going to have some temperature sensors, humidity sensors... I''m going to
    build a collection of those, and I''ve just got now Arduino with Wi-Fi - I can
    now connect those sensors to the entire system and also have a weather API from
    weather.com, so I can see regional and local weather. Then I''m going to build
