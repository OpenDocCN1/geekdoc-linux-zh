    Emacs 的实现以及优化的功能。


    # 分区编辑器


    # GParted 0.24.0


    用于创建、调整大小和修改分区的友好界面


    新电脑或大硬盘带来的兴奋感可能会在接触磁盘分区时受到谨慎的影响，不仅是对带有重要数据的磁盘进行分区，对新硬盘进行分区也可能比搞掉另一个磁盘要好。如果你在第一次分区之前误安装了某些东西，那么带有图形界面的
    GParted 可以在磁盘之前运行，而且现在安全得多。支持 ReFS、JFS 等各种工具。GParted 0.24.0 增加了 ZFS 文件系统检测和对逻辑卷的更好信息，在处理分区表方面具有很大的活性。项目网站包含在不同情况下使用
    GParted 的教程链接。


    GParted 是 Parted 的前端，使用 libparted 管理设备和分区表。它还允许额外的文件系统，包括 GParted Live，这是一个小型的可启动发行版（适用于
    Intel 兼容硬件），以 CD 或 USB 磁盘的形式提供——也可以从硬盘或通过网络 PXE 你的 PC。GParted Live 基于最新的 Debian
    Sid，包含了救援和 efiboot。


    优点：如果分区磁盘的想法让你冷流汗，那么这个过程是最好的。

    缺点：它不适用于所有设备——例如树莓派。

    非常适合……消除对磁盘分区的恐惧 gparted.org


    # 游戏


    # SuperTaxKart 0.9.1


    基于自由软件吉祥物的特色角色


    十多年前，SuperKart (STK) 作为一种卡卡丁赛车游戏从孩子中诞生。从那以后，它变得更加精良和真实，但在《马里奥赛车》的精神下，趣味比关系更重要。通过对现有赛道进行改进并添加新赛道，STK
    有足够的玩性。


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_92_0.png)


    得益于它（修改过的）Irish Engine，STK 的早期版本在低硬件（如第一代）上运行良好。自 0.9.1 以来增加了更多角色，但我们用一个七岁的孩子和一台小笔记本电脑进行了测试，它是可以玩的。如果你想在旧硬件上获得最佳体验，STK
    0.8.1 仍然属于高质量 Debian 及许多其他产品的领域，因此每个人都可以加入乐趣。


    最新版本带来了更多内容，但重点仍然是游戏性。在改进车辆稳定性、渲染和音频方面，以及允许设计师使用 AngleScript。许多挑战得到了改进，网络方面的开发仍在继续，但应该在下一个版本中结出，届时你将跨局域网甚至通过互联网与其他玩家对战。


    优点：上手快速简单，有很多选项确保一切具有可比性并让你再次回来。

    缺点：虽然你可能可以在旧硬件上将其运行，但它更适合你的需求。

    非常适合……当你的大脑充满了代码时，你需要乐趣！superkart.net


    www.linuxuser.com | 93


    '
