    # 08 Make use of roles


    This relatively new PulseAudio feature reminds the behaviour of modern smartphones
    – when you receive an incoming call, all audio playback (if any) is temporarily
    muted. In PulseAudio, this lowers the volume of other streams when a more important
    stream appears, and raises the volume back up when it ends (this is called ''ducking'').
    The decision of whether a stream has high priority or low priority is based on
    the media.role property. By default, "music" and "phone" streams are ducked, so
    let''s learn how to modify ducking options and specific attenuation to be used
    while ducking-at:-10dB.


    # 09 Get things done


    Most of command lines around PulseAudio involve the pactl and pacmd commands,
    both producing verbose outputs. This is where Patrick comes in – a simple PHP-based
    utility (https://github.com/cootyne/patrick) that parses the pactl list and stat
    outputs to more readable variants. The syntax is also very easy to understand.


    Patrick


    ```

    # pactl load-module module-role-ducking,trigger-

    roles-phone ducking_roles=music,video volume=-10dB

    ```


    and then make sure it''s working with sample playback, like


    +   * pactl ls is


    +   * lists entries, while:


    +   * pactl ls si properties


    shows the properties of the currently used sink. This

    command can be shortened down to:


    ```

    $ PULSE_role=''media.role:phone'' player -o audio.sample.mp3

    ```


