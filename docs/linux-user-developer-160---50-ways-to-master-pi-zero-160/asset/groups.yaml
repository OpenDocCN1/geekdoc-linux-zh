    During the help of this command, you will note that branches are local to the
    repository in Git, that branch created in a local repository does not have its
    counterpart in the remote repository. As expected, a developer can work on changes
    from different branches. Later, they can use the merge command to combine them.
    This enables users to combine the changes from different developers in any open
    source project.


    When it comes to the process of adding a repository to Git, it is straightforward.


    +   - Staging: Here, we are going to add changes to the staging area.

    - Committing: The changes stored in the staging area are committed to the repository.


    During the process, Git provides a useful command: *add*. With it, you will be
    able to add changes in the working tree to the staging area. By using the *add*
    command, you can recommend changes, and then keep them staged until you are satisfied
    with your changes.

    In the next stage (committing), it is a goal to commit the files and add them
    to the repository. For the committed changes, you can use the *commit* command.
    Here we have a quick look at some of the most important terminologies:


    | Term | Description |

    | Working tree | As noted earlier, a working tree is made up of a set of files
    for the repository. |

    | Revision | The repository maintains the versions of the source code. |

    | Staging area | This is the place where we store changes in the working tree
    before committing them out. |

    | Head | Head can be described as the symbolic reference to the points currently
    checked out branch. |

    | Branch | A branch can be considered a pointer to a commit. When you check out,
    it typically refers to checking out a branch |

    | Commit | When we commit changes into a repository, it creates a new commit object.
    You can use this new commit object to uniquely identify a revision. |


    The files in the tree of Git may be in different states: they:


    +   - When a file is staged to be included in the next commit, it is said to be
    in a staged state.

    - When a file is changed but the change is not staged, it is in a modified state.

    - When a file is neither staged nor committed, it is in an untracked state.

    - When a file is committed, it is in a tracked state.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_48_0.png)


    Let us understand how to manage a new project in Git. We are going to use a swatch-3.2.3.tar.gz
    file that already exists in our home directory and will see how we can place it
    under Git control. You can use the following commands to place the project in
    Git version control:


    Above is the importing process for a project under Git control


    ```

    $ tar xf swatch-3.2.3.tar.gz

    $ cd swatch-3.2.3

    $ ls

    ```


    We have successfully initialized the working directory. With swatch-3.2.3, we
    can now see a new directory for Git, it is possible to instruct the Git program
    to take the files (under the current directory) by executing the following command:


    ```

    $ git add

    ```


    When we want to commit the changes of the project in Git we ended up with an error.
    This is because Git was not able to identify you. So, before we store this version
    of the project in Git, we need to identify ourselves to Git with name and email
    address. This can be achieved by the following commands:


    ```

    $ git config --global user.name Your Name

    $ git config --global user.email your@email.com

    ```


    Now we can use to store this version of our project in Git:


    ```

    $ git commit

    ```


    As you can see from the following, the commit command prompts for a commit message.
    You can also use -m parameter. This enables you to specify a commit message -
    as shown in the following code:


    ```

    $ git commit -m ''first version''

    ```'
