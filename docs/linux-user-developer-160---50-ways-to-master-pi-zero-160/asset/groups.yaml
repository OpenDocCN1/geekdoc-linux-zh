    sensor.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_68_4.png)


    We done all of - PubNub, and it''s not just that you''re a little better; it''s
    when to use the right tools for the job. The better I understand all of the technologies
    available the better I can figure out what matters for sensors running off a battery,
    what energy and power is a concern... Ultimately, it''s about creating cases in
    a medium that I can learn from. Also talk about the Internet of Things to people
    at Cisco, about the wider industry, it''s one thing to learn about it concepts,
    another to then easily scale up to a smart city, a smart warehouse - you''re just
    using real materials of little plastic bricks.


