    Linux 内核（提供音频硬件驱动程序）和桌面应用程序之间。PulseAudio 在几年前曾引起争议，但从那以后它取代了许多简单的客户端-服务器解决方案，拥有许多复杂的模块化客户端-服务器解决方案，对于想要深入研究
    Linux 配置的高级用户非常有益。


    ## 发现你的输出端（sinks）和输入端（sources）


    对于任何带有 PulseAudio 的系统，每个音频设备由三个主要组件识别：卡（card）、输出端（sink）和输入端（source）。输出端是我们用于播放和录制的设备，所有的物理输入和输出都是可用的。你不仅可以静输出，还可以将其路由到另一个设备（module-null-sink），或者通过创建一个虚拟音频管道输出端（pipe-sink）让其他应用程序访问。


    第一个流输入源用于处理麦克风、内联等，因此，PulseAudio 最后会为每个声卡创建一个输出端，为每个使用它的应用程序创建一个输入端，结合 PulseAudio
    的模块化设计，为我们提供了极大的灵活性。


    PulseAudio 尝试确定哪些输出端和输入端应该设置为默认，因此在很多情况下，你可能需要将音频从扬声器重定向，以便你的工作能够正常进行。要查看当前设置，请使用
    `audio pactl list` 并检查其输出。


    ## 资源


    本教程适用于任何通用桌面使用的最新 Linux 发行版，假设你的系统中安装了 PulseAudio，并将揭示我们需要的实用应用。这些包括处理多个播放流、通过网络重定向声音、提高音质以及让事情变得更轻松的体验增强技巧。


    你只需要提供一个命令行和几分钟的时间。


    ![](img/df5857e82a6482b0f2db5a2e616012c_51_1.png)


    正确的 PulseAudio 不仅仅是系统音量控制 52


    ## 发现你的输出端（sinks）和输入端（sources）


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_52_0.png)


    PulseAudio 应该自动识别输出端和输入端。


    ## 02 在扬声器和耳机之间切换


    这是笔记本电脑的常见情况，当你通过笔记本扬声器连接时，一旦插入 3.5mm 接口，声音就会传输到耳机。Linux 系统会自动处理这些，但可能会失败（或者你需要自定义行为），你可以控制
    PulseAudio 的多个部分。要找到当前使用的那个，请查找如下内容：


    > PulseAudio 在几年前曾引起争议，它经历了七次大版本发布，并且非常稳定


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_52_1.png)


    ## 超越基础知识


    **活动端口：audio-output-speaker**


    我们知道其他端口名称，因此我们可以手动将播放切换到耳机，如下：


    ```

    # pacact set-sink-volume ''audio.output_pulse_0000_08_ib-audio-stereo'' ''audio-output''

    ```


    这对服务器也是如此；所以当你在 Skype 中录制声音时，你需要确保相应的输入端使用正确的端口来捕捉声音。


    PulseAudio 引入了客户端-服务器架构，这意味着声音可以通过网络路由。这不仅仅是为了控制设备——它还包括录制、流传输以及将 PulseAudio 与本地和远程音频设置一起连接到你的流。


    ## 03 管理音量


    PulseAudio 使用 0 到 65536 的范围来管理音量，其中 0 是静音，65535 是 100%。技巧在于，你可以超过或低于音量，而无需任何第三方工具（如
    VLC）。


    如果你需要为某些输入设置音量，你可能想要关闭“线性”音量。这是一个简单的步骤：


    ```

    # pacact set-sink-volume ''1''

    ```


    ## PulseAudio 教程


    ## 发现 PulseAudio 的隐藏力量


    我们将为您指指指尖新的技巧和一些令人惊叹的 PulseAudio 新功能


    ## PulseAudio 教程


    ## 发现 PulseAudio 的隐藏力量


    我们将为您指指指尖新的技巧和一些令人惊叹的 PulseAudio 新功能


