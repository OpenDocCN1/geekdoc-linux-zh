    几乎可以匹配音乐风格或条件，例如非常有用的 Laptop 预设。除此之外，该工具非常简单，只有几个复选框和一个“应用设置”按钮。PulseAudioequalizer
    适用于通过当前输出设备播放的所有音频，如果你喜欢的话，也包括通知。预设以纯文本文件形式存储在 `/usr/share/pulseaudio-equalizer/`
    目录下，因此你可以使用现有文件作为模板，无缝地创建你自己的预设。


    左：可以降低流的音量以提高重要流的音量


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_54_1.png)


    # 08 利用角色 (roles)


    这个较新的 PulseAudio 功能让人了现代智能手机的行为——当你接收来电时，所有音频播放（如果有的话）都会临时静音。在 PulseAudio 中，当更重要的流出现时，它会降低其他流的音量，并在结束后恢复音量（这被称为“闪避”，即
    ducking）。一个流是否具有高优先级或低优先级取决于 `media.role` 属性。默认情况下，“music”（音乐）和“phone”（电话）流会被压低，让我们学习如何修改闪避选项以及在
    ducking-at:-10dB 时使用的特定衰减。


    # 09 完成任务


    大多数与 PulseAudio 相关的命令行涉及 `pactl` 和 `pacmd` 命令，这两者都会产生详细的输出。这就是 Patrick 发挥用场的地方——一个基于
    PHP 的简单实用程序（https://github.com/cootyne/patrick），它可以将 `pactl list` 和 `stat` 的输出转换为更易读的变体。其语法也非常容易理解。


    Patrick


    ```

    # pactl load-module module-role-ducking,trigger-roles-phone ducking_roles=music,video
    volume=-10dB

    ```


