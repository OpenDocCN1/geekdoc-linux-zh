  - "[PAGE 30]\n\n# Memory allocation\n\nOne of the reasons that C is fast is that\
    \ it deals directly with memory. However, many bugs in C programs come from memory\
    \ corruption shortly afterwards. Such operations can crash badly.\n\nThere are\
    \ several ways to allocate memory: malloc(), calloc(), realloc() and free(). In\
    \ practice, most of the time you are using malloc() to allocate memory that you\
    \ need to access to later.\n\nIf you want to allocate memory manually for copying\
    \ one string into another, you can use the following method:\n\n```\nint length\
    \ = strlen(str);\nchar *copy = malloc((length + 1) * sizeof(char));\n\n```\n\n\
    Please note that the extra space is for the '\\0' character used for properly\
    \ representing a string. Note that '\\0' is a single character and not a string.\
    \ There, are functions like\n\nstrdup(char*) that creates a copy of an existing\
    \ string into a new string, which automatically allocates the necessary memory\
    \ so you do not have to allocate it.\n\nThe unary operator sizeof returns the\
    \ size of a variable or type in bytes. malloc() allocates the memory space that\
    \ needs to be allocated for storing a variable. If you want to hold several numbers\
    \ using malloc(), you should use the following method:\n\n```\ndouble *array =\
    \ malloc((n + 1) * sizeof(double));\n\n```\n\nThe malloc,free pair in your tutorials\
    \ illustrates a relevant example. The segmentation fault happens as the second\
    \ variable uidstr has no memory association with after terminating with the following\
    \ code:\n\n```\nchar *uidstr = \"0\";\n\n```\n\nIt is extremely important to remember\
    \ that if a user has an ID with the value of 0, then it automatically has access\
    \ to root privileges; therefore it is not the name that the root user uses ID.\
    \ The following shows a C program that finds all users in /etc/passwd that have\
    \ a user ID of 0:\n\n```\n#include <stdio.h>\n#include <string.h>\n#define MAXLINESIZE\
    \ 512\nint main(int argc, char **argv) {\n    FILE *INPUT;\nchar buffer[MAXLINESIZE];\n\
    \n// Open /etc/passwd for READ ONLY\n    INPUT = fopen(\"/etc/passwd\", \"r\"\
    );\n    while (fgets(buffer, sizeof(buffer), INPUT) != NULL) {\n        // Ignore\
    \ comments in /etc/passwd\n        if (buffer[0] == '#')\n            continue;\n\
    \        // User ID is the third field\n        char *username = strtok(buffer,\
    \ \":\");\n        char *password = strtok(NULL, \":\");\n        char *uid =\
    \ strtok(NULL, \":\");\n        if (strcmp(uid, \"0\") == 0)\n            printf(\"\
    User %s has root privileges!\\n\", username);\n    }\n\n    fclose(INPUT);\n \
    \   return 0;\n}\n\n```\n\n# Most, if not, programs have access to, read or modify\
    \ files, which is generally behind the scenes\n\nThis is extremely valuable when\
    \ trying to execute the -R command, which lists all subdirectories. The password\
    \ file contains entries for each user. The system file for the user is: /etc/passwd\n\
    \nA colon separates the fields in the /etc/passwd file. The first field is the\
    \ username, and the second field is the length of the username. The third field\
    \ is the user ID. The fourth field is the home directory of the user. Please note\
    \ that instead of a string, you can define the absolute path of home, which is\
    \ used for users of services like web servers or a database. The entry for the\
    \ www-data user -which is, Apache of the web server- is the following:\n\n```\n\
    root:x:0:0:Mihail Tokoualous:/home/root:/bin/bash\n```\n\nusr/bin/nologin binary\
    \ is a shell replacement for accounts that should be disabled for security reasons.\
    \ The third field is the numerical value of the user ID, the fourth field is the\
    \ numerical value of the default group ID of the user. As you will see in a while,\
    \ to order the numerical value of the group ID something more meaningful, you\
    \ will have to access /etc/group.\n\n```\nwww-data:x:33:33:/var/www:/usr/bin/nologin\n\
    ```\n\n* Asterisk"
