    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    Linux and open source magazine. It has been over four years since the release
    of the original Raspberry Pi B and the Raspberry Pi Foundation has up-one on itself.
    With releasing a camera that costs $35, it has launched a brand new model that
    costs just $5 - the Raspberry Pi Zero, an amazing feat that will make far more
    educational institutions afford for their students, and boost the Foundation''s
    educational mission into a whole new world.


    It''s a smaller, and a little limited in terms of the available features, but
    it''s much more powerful than the original Pi B we used. You can find out exactly
    what''s changed with the board on pages 58-59. And if you''ve already got one,
    we''re pleased to know that all 50 of our class tips apply to your new Pi Zero
    - there''s also a guide to getting the new board online. Turn to page 60 to get
    started.


    We spent some time figuring out how to make your Linux experience better with
    some diagnostic tools through tweak lightweight FOOSS, you can find our best optimizations
    on page 20. Enjoy the issue!

    Gavin Thomas, Editor


