    \nWith decidedly retro rots, the award-winning FUZE is a programmable computer\
    \ and electronics workstation. Born out of a passion for programming and love\
    \ of electronics, the solid keyboard features a specially designed GPIO header\
    \ and a breadboard for simple electronics.\n\nsupport, including sprite and image\
    \ scaling, angle and alpha controls and FUZE BASIC is fully configured to run\
    \ with all models of the Raspberry Pi. The FUZE system is much more than just\
    \ an emulator.\n\nHousing a Pi below the keyboard, the FUZE comes with FUZE BASIC\
    \ already installed.\nZE BASIC is an advanced, modernised version of the programming\
    \ language, widely accepted as the easiest beginner language to learn and teach.\
    \ Featuring a redesigned interface and advanced graphics\n\nThe FUZE Special Edition\
