    \ is that it deals directly with memory. However, many bugs in C programs come\
    \ from memory corruption shortly afterwards. Such operations can crash badly.\n\
    \nThere are several ways to allocate memory: malloc(), calloc(), realloc() and\
    \ free(). In practice, most of the time you are using malloc() to allocate memory\
    \ that you need to access to later.\n\nIf you want to allocate memory manually\
    \ for copying one string into another, you can use the following method:\n\n```\n\
    int length = strlen(str);\nchar *copy = malloc((length + 1) * sizeof(char));\n\
    ```\n\nPlease note that the extra space is for the '\\0' character used for properly\
    \ representing a string. Note that '\\0' is a single character and not a string.\
    \ There are functions like strdup(char*) that creates a copy of an existing string\
    \ into a new string, which automatically allocates the necessary memory so you\
    \ do not have to allocate it.\n\nThe unary operator sizeof returns the size of\
    \ a variable or type in bytes. malloc() allocates the memory space that needs\
    \ to be allocated for storing a variable. If you want to hold several numbers\
    \ using malloc(), you should use the following method:\n\n```\ndouble *array =\
    \ malloc((n + 1) * sizeof(double));\n```\n\nThe malloc,free pair in your tutorials\
    \ illustrates a relevant example. The segmentation fault happens as the second\
    \ variable uidstr has no memory association with after terminating with the following\
    \ code:\n\n```\nchar *uidstr = \"0\";\n```\n\nIt is extremely important to remember\
    \ that if a user has an ID with the value of 0, then it automatically has access\
    \ to root privileges; therefore it is not the name that the root user uses ID.\
    \ The following shows a C program that finds all users in /etc/passwd that have\
    \ a user ID of 0:\n\n```c\n#include <stdio.h>\n#include <string.h>\n#define MAXLINESIZE\
    \ 512\nint main(int argc, char **argv) {\n    FILE *INPUT;\n    char buffer[MAXLINESIZE];\n\
    \n    // Open /etc/passwd for READ ONLY\n    INPUT = fopen(\"/etc/passwd\", \"\
    r\");\n    while (fgets(buffer, sizeof(buffer), INPUT) != NULL) {\n        //\
    \ Ignore comments in /etc/passwd\n        if (buffer[0] == '#')\n            continue;\n\
    \        // User ID is the third field\n        char *username = strtok(buffer,\
    \ \":\");\n        char *password = strtok(NULL, \":\");\n        char *uid =\
    \ strtok(NULL, \":\");\n        if (strcmp(uid, \"0\") == 0)\n            printf(\"\
    User %s has root privileges!\\n\", username);\n    }\n\n    fclose(INPUT);\n \
    \   return 0;\n}\n```\n\n## Most, if not, programs have access to, read or modify\
    \ files, which is generally behind the scenes\n\nThis is extremely valuable when\
    \ trying to execute the -R command, which lists all subdirectories. The password\
    \ file contains entries for each user. The system file for the user is: /etc/passwd\n\
    \nA colon separates the fields in the /etc/passwd file. The first field is the\
    \ username, and the second field is the length of the username. The third field\
    \ is the user ID. The fourth field is the home directory. Please note that instead\
    \ of a string, you can define the absolute path of home, which is used for users\
    \ of services like web servers. The entry for the web-server is the following:\n\
    \n```\nroot:x:0:0:root:/root:/bash\n```\n\nbin/nologin is a shell replacement\
    \ for accounts that should be disabled for security reasons. The third field is\
    \ the numerical value of the user ID, the fourth field is the numerical value\
    \ of the group ID. As you will see in, to order the numerical value of the group\
    \ ID something meaningful, you will have to access /etc/group.\n\n```\nwww-data:x:33:33::/bin/nologin\n\
    ```\n\n## Tutorial Data files and information\n\nReading /etc/passwd should be\
    \ fine, but don't try to edit it without locking The passwd structure is defined\
    \ in passwd.h as follows:\n\n```c\nstruct passwd {\n    char *pwname;      /*\
    \ username */\n    char *pwpassword;  /* password */\n    uid_t uid;         /*\
    \ user ID */\n    gid_t gid;         /* group ID */\n    char *pwge;       /*\
    \ user information */\n    char *pwhome;      /* home directory */\n    char *pwshell;\
    \     /* shell */\n};\n```\n\nSee passwd() for more information about these fields\
    \ by the line, it uses less than uid.c. The getuid() returns the effective ID\
    \ of the current user whereas getgid() returns the effective ID of the current\
    \ user. both systems need a program in order to be executed, what actually returns\
    \ is the properties of the current user at the end of the line. The adjacent image\
    \ shows various fields of the passwd that the getpasswd() system returns in userShell.\n\
    \n## Shadow support\n\nAlthough using /etc/passwd can perform the same task it\
    \ is much more difficult to protect the information in case you can see from the\
    \ output, /etc/passwd can be read by anyone /etc/shadow can only be read by users\
    \ who belong to the shadow group:\n\n```\n$ ls -l /etc/passwd /etc/shadow\n-rw-r--r--\
    \ 1 root 1953 Apr 26 /etc/passwd\n-rw-r---- 1 root 1245 Apr 26 /etc/shadow\n```\n\
    \nthe solution in C. The code reads /etc/passwd by line and gets the UID for each\
    \ entry that does not begin with a ':' character, which denotes a colon. If a\
    \ UID value is equal to zero, then the returned username is printed on the screen.\
    \ The process then returns the UID of the end.\n\nAs a result, /etc/passwd keeps\
    \ the encrypted password for security - that is why the file /etc/shadow is used\
    \ as a placeholder. This transformation of the password file means that sensitive\
    \ information is encrypted. /etc/passwd should have at least two fields, the username\
    \ and the encrypted password.\n\nThe strtok() function searches its input until\
    \ a ':' character is found. The returned token, the username, is stored in the\
    \ variable. In order to get next tokens and continue with the rest of the string,\
    \ you will have to pass NULL as the first argument to strtok(); strtok maintains\
    \ a static pointer to the start of the string, therefore if you pass a new pointer\
    \ to it, the old reference gets discarded. strtok() does not keep the contents\
    \ of the variable in any way. After you get the username, you can compare it with\
    \ strcmp(). If there is a match, you return the username of the user who has a\
    \ UID of zero.\n\n/etc/shadow usually contains additional fields that are related\
    \ to password aging. It is important that this information is encrypted. If you\
    \ want to support shadow passwords in your programs, you should use some or all\
    \ of the following: getpwnam, getspwd, getspwd, setspwd, getckpw, and unlockckpw.\n\
    \nPlease note that reading /etc/passwd without locking it is not a problem but\
    \ editing it without any locking is bad. Additionally, /shadow does not access\
    \ /etc/passwd using any calls, which is unconventional.\n\nFurther discussion\
    \ about shadow passwords is beyond the scope.\n\n## The /etc/group file is similar\
    \ to the following:\n\n```c\n#include <stdio.h>\n#include <types.h>\n#include\
    \ <unistd.h>\n#include <group.h>\n```\n\n```c\nint main(int argc, char **argv)\
    \ {\n    struct passwd *passwd;\n    if (getpwuid(getuid()) != NULL)\n       \
    \ printf(\"shell: %s\\n\", passwd->pwshell);\n    return 0;\n}\n```\n\nThe previous\
    \ output shows that mtsook is a member of the dev and shadow groups. Each group\
    \ has a unique number associated with it.\n\nThe group structure is quite similar\
    \ to the passwd structure is defined as follows:\n\n```c\nstruct group {\n   \
    \ char *gr_name;\n    char *gr_passwd;\n    gid_t gid;\n    char **gr_mem;\n};\n\
    ```\n\nThe gr_name variable holds the group name whereas gr_gid holds the group\
    \ ID. The gr_mem variable is a NULL-terminated array of pointers to names of group\
    \ members. The gr_passwd contains a string that contains the password of group,\
    \ which is rarely used nowadays.\n\nThis program (userShell) shows the shell of\
    \ the user using the appropriate system calls that access /etc/passwd. This is\
    \ a safer, easier and recommended way of accessing /etc/passwd. Additionally,\
    \ since it does not have to manually parse /etc/passwd line\n\n32\n"
  mdcn: "\n\n# 教程数据文件与信息\n\n## 系统编程\n数据文件与信息\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_29_0.png)\n\
    \nMihalis Tsoukalis 是一位 Unix 管理员、Unix 和 iOS 程序员、数据库管理员（DBA）以及其他许多领域的专家。他自 1993\
    \ 年起就开始使用 Linux。\n\n## 资源\n- 文本编辑器\n- GCC 编译器\n\n## 利用必要的系统调用和结构来帮助你处理 Linux 系统文件和信息\n\
    \n本教程将向你展示能够处理系统文件和信息的系统调用和技术。请记住，大多数系统文件都是纯文本格式，但使用文本编辑器编辑文件可能是危险的，应该谨慎地操作。\n\
    \n作为程序员，你将不得不处理文件，当你无法访问或删除文件时，权限起着关键作用。\n\n但在在此之前，需要一些关于进程的信息。每个进程有两个用户 ID（UID）：用户\
    \ ID 和真实用户 ID（real user ID）。同样，每个进程有两个组 ID（GID）。这使得一切变得更加复杂；内核在检查时仅检查用户 ID 和组\
    \ ID。你可能会问，拥有真实用户和组 ID 并影响所有文件（无论哪个用户创建了它）有什么意义呢？这样的进程必须以 root 权限运行，因为只有 root\
    \ 用户是不同用户（例如 mtsuk）的组才能访问某个文件，然后服务器进程在尝试执行请求的任务之前，会临时将其有效用户 ID 从 root 更改为 mtsuk。如果\
    \ mtsuk 不允许访问该文件，将生成错误。在完成 mtsuk 服务器要求的所有任务后，服务器进程将将其有效用户 ID 改回 root。许多服务器进程都是这样工作的。\n\
    \n## 为什么要处理系统文件？\n\nLinux 系统上的大多数任务都需要一个或多个程序的各种系统信息、组权限，例如 TCP 服务等。因此，如果所有程序都有读取\
    \ root 文件的权限（这通常由 root 在用户不知情的情况下完成），那么除非某处发生错误，否则会发生什么？\n\n## /etc/passwd\n\n\
    当你意识到每次执行 -l 命令时，它都会输出用户信息时，你就会理解 /etc/passwd 有么重要了。这是为了确保运行的用户具有正确的用户或组权限来访问相关文件或目录。\n\
    \n## 教程文件\n可用地址：\nfiles.co.uk\n\n30\n\n## 内存分配\n\nC 语言快速的原因之一是它直接处理内存。然而，C 程序中的许多\
    \ bug 来自于随后的内存损坏。此类操作可能会导致严重的崩溃。\n\n分配内存有几种方法：malloc()、calloc()、realloc() 和 free()。在实践中，大多数时间你使用\
    \ `malloc()` 来分配你之后需要访问的内存。\n\n如果你想手动分配内存以将一个字符串复制到另一个，可以使用以下方法：\n\n```\nint length\
    \ = strlen(str);\nchar *copy = malloc((length + 1) * sizeof(char));\n```\n\n请注意，额外的空间用于正确表示字符串的\
    \ '\\0' 字符。注意 '\\0' 是单个字符而不是字符串。有像 `strdup(char*)` 这样的函数，它可以将现有字符串复制到新字符串中，它会自动分配必要的内存，因此你不需要手动分配。\n\
    \n一元运算符 `sizeof` 返回变量或类型占用的字节数。`malloc()` 分配了存储变量所需的内存空间。如果你想使用 `malloc()` 存储几个数字，应该使用以下方法：\n\
    \n```\ndouble *array = malloc((n + 1) * sizeof(double));\n```\n\n教程中的 `malloc,free`\
    \ 配对说明了一个相关的示例。当执行以下代码并终止时，由于第二个变量 `uidstr` 没有内存关联，因此会发生段错误（segmentation fault）：\n\
    \n```\nchar *uidstr = \"0\";\n```\n\n记住这一点极其重要：如果一个用户的 ID 值为 0，那么它将自动拥有 root 权限；因此，root\
    \ 用户使用的不是 ID 的名称。以下显示了一个 C 语言程序，它可以查找 /etc/passwd 中所有用户 ID 为 0 的用户：\n\n```c\n\
    #include <stdio.h>\n#include <string.h>\n#define MAXLINESIZE 512\nint main(int\
    \ argc, char **argv) {\n    FILE *INPUT;\n    char buffer[MAXLINESIZE];\n\n  \
    \  // 以只读模式打开 /etc/passwd\n    INPUT = fopen(\"/etc/passwd\", \"r\");\n    while\
    \ (fgets(buffer, sizeof(buffer), INPUT) != NULL) {\n        // 忽略 /etc/passwd\
    \ 中的注释\n        if (buffer[0] == '#')\n            continue;\n        // 用户 ID\
