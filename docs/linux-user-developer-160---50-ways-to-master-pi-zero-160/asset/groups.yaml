    \n`sudo apt-get install --update`\n\n左侧 Pi-mote 发射器非常易用，它由 Pi 供电并使用仅限发射器的开环系统。\n\
    \n![](img/df5857e82a6482b0f2db5a2e61e6012c_72_0.png)\n\n### 03\n安装 Pi-mote\n\n\
