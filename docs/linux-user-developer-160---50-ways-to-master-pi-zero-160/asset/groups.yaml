    \ Free software\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_82_0.png)\n\n## GROUP\
    \ TEST\n\n## Chromium browsers\n\nThere are projects that have taken Chromium\
    \ code to roll out their own web browsers. But can anyone beat Google's flagship\
    \ Chrome browser?\n\n### Google Chrome\nReported to be the most widely used browser\
    \ on Earth, but the hood is just the same Chromium with extras. Chrome includes\
    \ licensed codes for proprietary formats, giving access to a wider variety of\
    \ media content, AAC and MP3-encoded audio.\nDownload: bit.ly/1BxukGG\n\n### Chromium\n\
    Chromium is the only open source browser in our test and many things are obvious:\
    \ Chromium doesn't have the same charm as Chrome since we don't use licensed stuff;\
    \ however, the existing feature set will pit the browser performance against other\
    \ competitors.\nDownload: bit.ly/1MvHy6k\n\n### Opera\nOpera is a respected browser\
    \ for Linux with a long history. It used to implement its own Presto engine, but\
    \ since 2013 Opera has dropped in favor of Blink, which uses components by Google.\
    \ Opera released its new browser for Linux in summer 2014, with significant design.\n\
    Download: opr.as/1FvGzZ\n\n### Vivaldi\nVivaldi emerged as an initiative to bring\
    \ back the super-rich feature set of the old Opera to the new level, taking the\
    \ Chromium code as a base. Vivaldi directly competes with Opera, bringing back\
    \ users who were disrupted by Opera's transition from Presto to the Blink rendering\
    \ engine.\nDownload: bit.ly/1cCQg3D\n\nwww.linuxus.co.uk 83\n\n84\n\n## Opera\n\
    \n## Vivaldi\n\nIt has a refreshed add-ons brand but is is\nreason to make Opera\
    \ your browser?\n\nThe browser from ex-Opera CEO Jon\nv von Tetzchner is getting\
    \ much...\n\n## Extensions\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_84_0.png)\n\
    \nOpera has an extension catalogue with over 500 titles, but it is possible to\
    \ use Chrome-extensions. To do so, enable the Developer Mode in Vivaldi and manually\
    \ load an unpacked extension (get) using chrome-extension-downloader.com. It is\
    \ an experimental feature, so take care.\n\n## Extensions\n\nVivaldi is a new\
    \ browser that arrived in 2015, so it's understandable why many things are still\
    \ missing. There is no official extension catalogue, but it is possible to use\
    \ Chrome-extensions.\n\n## User experience\n\nOpera officially ships a DEB package\
    \ for Ubuntu. If your system is not Debian or Ubuntu clone, you'll have to split\
    \ the package and rely on third-party packages for others. Due to limited ability\
    \ of Opera, your experience may vary depending on your distro.\n\n## User experience\n\
    \nVivaldi delivers experience thanks to its design. It inherits the spirit of\
    \ the Old Opera, but there is no sync feature, no addon. However, the Vivaldi\
    \ team focuses on usability to stack tabs, annotate windows, and add notes to\
    \ bookmarks.\n\n## Multimedia support\n\nOpera researches in supported formats\
    \ and codecs, but the Opera package includes the local FPEG copy, which allows\
    \ playback of many related issues in Linux. Opera also ships with PDF viewer and\
    \ can use plugins that are part of Chrome, particularly the latest version of\
    \ Flash.\n\n## Multimedia support\n\nThe browser has all the essential support\
    \ for codecs and formats, including HTML5 with proper support of Flash Player,\
    \ MP3, and AAC. It's nearly the same as the one found in Chrome.\n\n## Extra features\n\
    \nOpera developers created their sync service, not dependent on anything but really\
    \ good. Opera also has some unique features like Opera Turbo (for slow internet),\
    \ mouse gestures, a password manager, and more.\n\n## Extra features\n\nThe interest\
    \ in Vivaldi is largely explained by the media hype. Vivaldi is more about community\
    \ and social life, than extra features. Unfortunately, the browser doesn't have\
    \ any\n\n## Overall\n\nIf only Opera was tested on mainline distros (other than\
    \ Ubuntu), it would have a better chance of winning. Opera is good at providing\
    \ a consistent and most trouble-free media playback and advanced synchronisation\
    \ service.\n\n## Overall\n\nVivaldi is a nice browser and a promising project,\
    \ but at this stage we're not confident you should ditch your current browser\
    \ for Vivaldi, as the last still misses many important features.\n\nwww.vivaldi.com\
    \ | 85\n"
