    # 电源


    # UPS Pico


    得益于 Pico 这款实用的 UPS，断电将不再损坏你的 SD 卡


    又发生了——由于停电，你的树莓派 SD 卡损坏了，项目也毁了。你需要的只是一个备份的重置镜像，项目需要重启并重新配置。


    但有了 UPS，这一切都不会发生。ModPico HAT 包含 I2C 控制，并带有可选扩展功能（如 CPU 风扇和大容量电池），该设备由两个部分组成：HAT
    和 Pico。在将 HAT 安装到已上电设备之前，HAT 将连接到 Pico 下方的小连接口。将使用防静电带将其固定在位。


    下一阶段是下载两个 Python 脚本到主目录并编辑 `/etc/local`，使用其中一个来自动设置。虽然盒子里没有指南，防静电袋上打印的简短说明可以从
    ModPico 下载。一旦连接并启动你的 Pi，绿色和蓝色 LED 将闪烁表示设备已就绪。板上安装了一系列按钮。重置按钮将重置 UPS，而 FSD 按钮将启动安全关机。此外还有其他可用按钮。你可以通过
    GPIO 引脚监控电池电量。如果发生断电，3000 mAh 的电池单元可以维持八小时。


    # 总结


    尽管对于不熟悉 Python 的初学者来说，设置它可能很困难，但对于任何寻找避免数据损坏和关机方法的的人来说，UPS 是一个很棒的选择。一个不错的额外是得益于插件提供的各种
