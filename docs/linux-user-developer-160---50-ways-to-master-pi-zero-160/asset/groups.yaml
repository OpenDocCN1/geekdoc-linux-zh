    ## 微电脑


    ## 树莓派 Zero (Raspberry Pi Zero)

    是世界上首款 5 美元电脑


    主流树莓派 Zero 销商几乎立即售罄


    树莓派基金会在其树莓派单板计算机家族中发布了新型号：树莓派 Zero。


    以 5 美元售价，树莓派 Zero 为了更高的性价比牺牲了一些组件。它使用了 BCM2835 处理器，没有 HDMI 输出，Model B+ 型中没有 GPIO
    引脚，且没有 USB 端口，这意味着用户需要自己焊接引脚。


    树莓派 Zero 通过微 HDMI 转 HDMI 适配器连接，两个 USB 端口互为替代。


    “与如此强大的计算机工作就像回到了学习计算机时代，”来自伦敦的树莓派创始人 Eben Upton 说，“我们正在做的是确保树莓派永远不会成为对编程感兴趣的人的障碍。”


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_5_1.png)


    # 需了解


    ### 树莓派 Zero

    核心信息


    ### 3 廉价

    5 美元的价格点意味着该设备负担得起——使得学校 IT 部门的批量采购更具可行性，孩子们可以用零花钱买到它。


    ### 1 极小

    这是史以来最小的树莓派，仅为 35x30mm（1.4x2 英寸）——只有信用卡的一半大。它非常适合嵌入式项目，将其附加到微控制器或制作可穿戴设备非常完美。


    ### 4 兼容 HAT

    与原始的树莓派 Zero 不同，该板带有 HAT 扩展板，使其兼容原始 HAT 规范，因此您现有的 HAT 扩展板可以正常工作。


    ### 2 强大

    尽管使用了 BCM2835 处理器，但根据 Eben Upton 的说法，它比原始的树莓派 B 型快约 60%。这意味着我们可以使用标准的树莓派作为台式电脑。


    ### 5 灵活

    带有所有 GPIO 引脚，Zero 可以在显示器或电视上输出。您可以通过使用带电源 USB 集线器扩展单个 USB 端口，然后插入键盘、鼠标和 Wi-Fi。


    ## 硬件


    下方电路保持完好以运行


    ## 前五


    ### Linux 4.4 中的新功能


    ### 1 Pi 模式设置驱动

    Anthony 创建基于树莓派的操作系统的首个成果，Linux 4.4 捆绑的驱动提供了内核设置选项。预计 3D 加速将在未来的发布中出现——但不要期望在
    4.4 中立即看到。


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_6_0.png)


    ### 2 虚拟 3D

    Linux 4.4 首次带来了由 David Airlle 开发的 VirtIO，为 QEMU 栈提供了通过主机硬件渲染 3D 加速的能力。


    ### 3 支持更多 GPU

    对于 AMD 用户，Linux 4.4 引入了新的 GPU 调度器，增加了对 Radeon HD 系列 APUs 的支持。电源管理可能会等到 Linux 4.5。


    ### 保护免受攻击的电路

    位于旧金山的 Design Shift 通过众筹创建了锁定机器，它称是世界上首个开源、紧凑的、基于英特尔最新 x86 处理器的设备，安全是其重点：提供了密钥。当它超出范围时，系统进入睡眠模式和所有
    HDMI 端口。


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_6_1.png)


    ### 4 网络增强

    Linux 网络子系统在 Linux 4.4 的开发中受到了大量关注，包括 Atheros 的全新驱动、对 IPv6 的改进支持以及最后的 VXLAN 内核驱动。


    1&1 的价格从 $299 起，早期启动，设备完全便携并包含了外部电源、内存和固态硬盘。


    ### 5 Skylake 增强

    英特尔最新的微架构 Skyline 是对以前版本的许多改进之一。尽管如此，其中一些为升级到 Linux 4.4 带来了变化。


    www.linuxux.co.uk


    ## 开源新闻与观点


    开源免费软件


    ### 逆流而行

    “我们在研发支出上排名最后，”CBI 主席 Paul Dressler 说，“我们欠于在大学进行并由美国政府 DARPA 资助的研究。互联网由于 Tim Berners-Lee
    在 CERN 的工作。自由软件归功 Project Map 和 MIT，它们创建了第一个多用户操作系统和第一个计算机显示。所有项目的共同点是它们都有资金支持、时间限制，并对我们的工作、思考和互联网产生了深远影响。互联网产生的创新突破被转化为生活，这完全是因为长期的公共投资。但只有公共资金才能让所有人获得。如果其中一个在完全不同的点失去资金，互联网就不会是今天这样的通用工具。”


    经济学家、创新经济学教授 Angela Mazzucci 声称，大部分创新并非源自公共资助的项目。但有些原因。某些想法需要高资金和相对快速的回。在金融市场要求即时结果的现代商业环境中，此类创新不太可能在可能产生财务回报的大规模研发中出现。


    创新往往违背当前世界的行事，Mazzucci 将苹果作为公共资助研究如何创造质量的范例。苹果通常被视为一家创新公司，但它在研发方面的投入很少，其主要创新在设计、包装和营销领域。她指出，让智能手机变得智能的技术（如
    GPS、Siri 语音识别和语音触摸屏）并非由苹果或谷歌 开发的，而是长期国家资助研究的结果。史蒂夫·乔斯可能是天才也可能不是，因为他的支持帮助填补了市场空白，并知道设计在创建产品中的重要性。


    政府“积极”塑造和创造市场的许多方面。在 IT、生物技术、纳米技术以及如今的全球经济中都是如此。公共部门资金不仅支持基础研究，还降低了早期高风险金融的风险。这很重要，因为大多数风险基金太害怕高度不确定且漫长的创新过程。


    公共资金资助的研发项目在塑造市场和技术方面发挥了作用。研究的影响不仅在于我们国家的工业塑造，更在于开源和封闭技术的未来。


