    The lines show the state of cgroups in the physical server


    The first four lines set up the "test" cgroup - creating access to all physical
    hardware, limiting kernel memory. The next line puts the bash prompt into the
    cgroup we are currently using (and any child processes run from that bash) inside
    the "test" cgroup. The sixth line runs a tar in main, but within the cgroup and
    so to the "test" cgroup


    There are many cgroup limits available, and the full documentation for them is:
    https://www.cgroups.org/doc/Documentation/cgroups.txt.


    > Traditionally, resources recover when running in namespaces. However, spaces
    in namespaces might be affected when daemon crashes, and maintaining resource
    isolation as cloud hosts might have put disaster beyond the reach of traditional
    operators and developers.


    # Putting back together


    If we create two namespaces, we can create a bash prompt with limited kernel memory
    use, and private namespaces from the rest of the system. By using cgroups for
    resource isolation, we can limit what each container can use, and end up with
    total isolation between the running instance and the rest of the Linux container.


    # 03 Control namespaces


    The unshare command allows you to isolate namespaces. For example, if you


    ```

    # unshare --mount /bin/bash

    # unshare /dev/null -net

    ```


    then the first line starts a bash prompt inside an isolated mount point. This
    means the filesystem that you have mounted is visible from the bash prompt which
    you are currently using (and any child processes run from that bash), but the
    rest of the system cannot see this filesystem.


    Please see the main pages for namespaces for a list of namespaces that you can
    manipulate.


    # 05 Different containers


    Linux containers come in two types: Docker provide flexibility and ease for developers,
    while Operating System containers provide better isolation and security. We believe
    that you would probably make more of application containers as a developer, if
    you were not aware of the benefits of operation system containers for infrastructure.


    Operating system containers make more dynamic use of computing resources and allow
    greater density of field as well as VMs. We believe operating system containers
    will make the next generation of elastic infrastructure, scaling automatically
    to demand and benefit users of all kinds and will bring us closer to the ideal
    of utility-based computing that was promised in the early days of cloud.


