    # ### ISS chooses Linux over Windows


    #### Bit-player Linux to represent the mighty platform


    **The US Aeronautical and Space Administration (NASA) is shifting its in-house
    control of the International Space Station (ISS) from Linux**, a move deemed key
    for reliability.


    > "We migrated to a Linux operating system that was stable and reliable – one
    that would give us in-control,", explained the US Space Alliance''s Keith Chusia
    of his decision to add more flexibility to Linux. "If we need to patch, or adapt,
    we could."


    Space trade publication Dealer News, Stephen Hunter confirmed that the initial
    introduction of Linux onto


    ISS systems, the number of Linux deployments is growing. At present the ISS uses
    around 100 workstations under Windows, but is "increasing in use" with the possibility
    that may soon outweigh other platforms on Linux.


    In addition to workstations, the ISS is also home to Robot, the first humanoid
    robot in space. Robot has been deployed by the astronauts and is not dangerous
    for humans to be out in the station''s environment, and is running on Linux.


    The next gadget to the ISS is to be Ubuntu 15


    # ## Highlights


