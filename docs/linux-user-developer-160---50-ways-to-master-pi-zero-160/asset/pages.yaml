    # User experience


    Vivaldi delivers experience thanks to its design. The browser

    herits the spirit of the Old Opera, but there is no sync feature, no mail

    addon. However, the Vivaldi team focuses on usability to

    stack tabs, annotate native windows, and add notes to bookmarks.


    # Multimedia support


    Opera researches in in supported formats and codecs,

    but the Opera package includes the local FFMPEG copy, which

    allows playback of many related issues in Linux. Opera also ships with

    PDF viewer and can use plugins that are part of Chrome,

    particularly the latest version of Flash.


    # Multimedia support


    The browser has all the essential support for codecs and formats,

    including HTML5 with proper support of Flash Player, MP3,

    and AAC. It''s nearly the same as the one found in Chrome.

    These features appear recently, that Vivaldi has signed


    # Extra features


    Opera developers created their sync service, not dependent on

    anything but really equally good. Opera also has some unique

    features like Opera Turbo (for slow internet), mouse gestures,

    a a password manager, and more.


    # Extra features


    The interest in Vivaldi is largely explained by the media

    hype. Vivaldi is more about community and social life, than extra

    features. Unfortunately, the browser doesn''t have any


    # Overall


    If only Opera was tested on mainline distros (other than

    Ubuntu), it would have a better chance of winning. Opera

    is good at providing a consistent and most trouble-free

    media playback and advanced synchronisation service.


    # Overall


    Vivaldi is a nice browser and a promising project,

    but at this stage we''re not confident you should ditch your

    current browser for Vivaldi, as the last still misses many

    important features.


