    # SPEED UP LINUX


    Linux is famous for being secure and fast, but it may slow down with time. We''ll
    learn how to measure a computer''s performance and then reveal ways to speed it
    up


    Most of the people who install Linux onto their PCs do so because they are told
    Linux is fast and secure and they can configure anything they want. All of this
    is true, but there is another truth. As time passes, your Linux installation goes
    through cycles of software installs and uninstalls, and the process becomes unstable.
    We all know that in theory, anyone can tweak their Linux installation however
    they want, but doing so sort of yourself, without backup, puts you at the risk
    of corrupting your operating system or even worse, losing all your data.


    A safer approach is to first carefully measure computer''s performance and see
    if it does slower than other computers with similar hardware configurations. Once
    you establish that your PC is in fact running slow, you can take a systematic
    approach by first making simple changes and start-case applications, and then
    moving on to more specialised optimisation tricks. By making incremental changes,
    you can help to avoid wrecked systems. In this article, follow this step-by-step
    path and help to make your Linux-based PC work faster and smoother.'
