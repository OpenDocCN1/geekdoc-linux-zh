    \ 'L' part of the\nboard is marked with L. Plug it into one of\nof Energetie sockets\
    \ in the same room or area as\ny is. The range is fairly good, but wall\nways\
    \ might block the transmission signal. You can test\nther by plugging in a lamp\
    \ and then pressing\nthe green button that is led to the\nsocket. The trigger\
    \ will switch the socket off, and then\nlamp on and off.\n\n# 07 Code to turn\
    \ the socket on\n\nThe Energetie library makes it incredibly easy\nto create a\
    \ code to turn the socket on, which will turn your\nlamp on. Before you know,\
    \ you will be using your Raspberry Pi\nto turn the kettle or the TV on or off.\n\
    Start a new program, import\nnergetie library (line 2 and 3), then add the code\
    \ to switch\nsocket (line 4). Save and run your program. The socket will\nrespond\
    \ with a click, and then your lamp will come on.\n\n```\nimport RPi.GPIO as GPIO\n\
    import time\nfrom energie import switch_on\n\nswitch_on()\n```\n\n# IP address\n\
    \nEvery device in\nInternet has an\n Protocol (IP address). This\nlabel is used\
    \ to identify and identify each device\nwhich may contain\nthousands of\nyour\
    \ home network IP\naddresses with numbers such as\n192.168.1.1.\n\n# 04\nDown\
    \ the socket off\n\nBefore the Raspberry Pi you can connect the socket\nand switch\
    \ it off, use programming to learn a code\nthat is sent from the socket. Each\
    \ socket has its\nun unique code that you can control to find out.\nnergetic set-up\
    \ code can be found\nin your tutorial resources available through Flie.\n\n# 05\n\
    Set up your socket\n\nOnce you have finished the set-up program, run\nit should\
    \ place the socket-led, which will be\nindicated by the LED on the front of the\
    \ socket slowly\nflashing. The LED will stop flashing for at\nfew seconds and\
    \ when the LED leads to\nsignal out. On on-off resets, the program will return\n\
    you to the home screen, prompting the return again\n\n```\nimport RPi.GPIO as\
    \ GPIO\nimport time\nimport energie\nfrom energie import switch_on\nfrom energie\
    \ import switch_off\n```\n\n```\nswitch_on()\ntime.sleep(5)\n\nswitch_off()\n\
    ```\n\nWhen the code is executed, success will be indicated with\nbrief flashing\
    \ of the LED on the housing. If you have more\nthan one socket, simply use the\
    \ same program and method\nto do so for as many times as required.\n\n# 06\nA\
    \ quick test\n\nBefore you get to the task of creating your Raspberry code\nto\
    \ control the socket, it is always advisable to test that the\nsocket is working\
    \ correctly. Ensuring that the power is on\nthat the lamp is switched on, you\
    \ can\nturn the lamp off by pressing the green button on the\nnergetie socket.\
    \ The lamp should turn on again when\nthe button is pressed.\n\n# 09\nCreating\
    \ a web-based app\n\nIt is possible to have an app that you can turn the\nl off\
    \ and on from a mobile device such as your phone,\nor laptop. This makes the whole\
    \ project more impressive,\nand first step is to set up your Raspberry Pi as a\n\
    web server will host and display a page with the ON /\nOFF option. Use the LX\
    \ Terminal and install and flask.\n\n```\nsudo apt-get install pip\nsudo pi-3\
    \ install flask\n```\n\nwww.linuxuser.com | 73"
