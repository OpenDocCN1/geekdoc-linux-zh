    OPEN FREE SOFTWARE


    # # Against the grain


    "We rank last in the G8 for R&D spending," says Paul Dreschler, president of CBI


    > We owe the research undertaken at various universities and funded by the US
    government to DARPA. The World Wide Web grew out of the work of Tim Berners-Lee
    at CERN. Free software owes to Project Map and the Lab at MT which created the
    first multi-user operating system, USPL the first computer, the first software
    and the first hardware displays.

    All what these projects have in common is that they were funded, had few limits
    on time, and have profound implications on how we work, think and the Internet.
    The World Wide Web grew innovative breakthroughs that were transformed into lives
    and were made only because of long-term public investment. But only public funding
    could allow access to all. If either had been de-funded at a very different point.
    Without access, the Internet would not be the universal tool it is today.

    Marianna Mazzuaco, Economist and Professor of Economics in Innovation, claims
    that significant portions of innovation are not originating from publicly-funded
    projects. But there are some reasons for this. Some ideas require high capital
    and relatively rapid returns. In the modern business environment where the financial
    markets demand nothing less than immediate results, such innovations are unlikely
    to emerge in large-scale research and development that may or may not produce
    a financial return.

    Innovation often goes against the grain of current world, which Mazzuaco points
    to Apple as a prime example of how publicly-funded research has created quality.
    Apple is often regarded as an innovative company, but it invests very little in
    research and development, and its major innovations are in the areas of design,
    packaging and marketing. The technologies that make the smartphone smart, which
    she points out, with GPS, the Siri voice-recognition and speech multi-touch


    screen, were not developed by Apple or Google, but were the result of long-term,
    state-funded research. Steve Jobs may or not have been a genius, as his support
    helped close gaps in the market and by knowing the importance of design in creating
    a product.

    Many aspects that governments have “actively” shaped and created markets. This
    is the case in IT, biotech, nanotechnology and in today''s global economy. Public
    sector funds have not only supported basic research but also de-risked early-stage,
    high-risk finance. This is important because most venture funds are too afraid
    of highly uncertain and lengthy innovation process.

    Publicly-funded research and development projects have had a role in shaping markets
    and technology. The research implications are not just for how industry is shaped
    in our country, but for the future of open and closed technologies. The Internet
    was a disruptive technology, and the spread of open source methodologies has transformed
    how the software is developed. It has given birth to collaborative research, promoting
    innovation, seeding software projects that could be fulfilled without a massive
    budget, or for years after their last atheist.

    And yet there is innovation in our universe. Free source without the short-term
    drive to turn them into industries. A prime example is the discovery of the means
    to extract graphs from the University of Manchester, for which Thomas Marshall
    and Kostas Volov, awarded the Nobel prize. Directed research and development is
    vital to the health of our scientific community, especially when


    Publicly funded research and development projects have had a role in shaping markets
    and promoting new technologies


    Richard Hillary writes-about music, digital and free software for a variety of
    publications


