  md: "# # Master Ras Pi\n\n# # Five hidden features\n\nUncover the secrets to be\
    \ found in Python\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_64_0.png)\n\n+ \
    \  30 **List comprehension**\nList comprehension is a way of generating a list\
    \ on a single line. You can use list comprehension to extract values from other-type\
    \ data structures. For example, if you have a list of distances in kilometers\
    \ and get the distance in miles: `[miles for x in distances]`. Here is a sample\
    \ output:\n\nAbove notice we have a case where distance is a variable and the\
    \ distance is in kilometers. Getting from multiple variables to get the distance\
    \ in miles to kilometers and setting the variable values in miles.\n\n```\n```python\n\
    [x/2 for x in range(10)]\n```\n```\n\nclass distance(object):\nKM_PER_MILE = 1.60934\n\
    \n    def __init__(self, miles):\n        self.miles = miles\n\n    @property\n\
    \    def getkm(self):\n\n```\n```python\nreturn self.miles * KM_PER_MILE\n```\n\
    ```\n\n+   31 **Assertions**\nAssertions are useful when writing your algorithm.\
    \ You can use them to check if the data is valid or before you return the results.\
    \ For example, if you are expecting your result to be positive, then use `assert(expression)`.\n\
    \n```\n```python\nassert(0 > 0)\nassert(1 < 0)\nTraceback (most recent call last):\n\
    File \"<string>\", line 1, in <module>\nAssertionError\n```\n```\n\n```\nif __name__\
    \ == \"__main__\":\n    d = distance(3.1)\n    print d\n    km = d.getkm\n   \
    \ print km\n    ```\n```\n\n+   32 **Using exceptions**\nIt's useful to catch\
    \ exceptions in your code if it is possible that it can go wrong. That way the\
    \ person can put it in a try-except block and handle the exception if raised.\
    \ If the caller does not handle them your application crashes.\n\n# # 29 Using\
    \ the GPIO library\n\nGet grips with the GPIO library\n\n+   * **Step One: Import\
    \ library**\nStart by importing RPi GPIO.\n\nimport RPi.GPIO as GPIO\n\nThen you\
    \ want to set the pin configuration to the Broadcom mode (in GPIO7 it will be\
    \ pin 17, rather than pin 11 on)\n\n+   * **Step Two: Set up pin**\nNow you need\
    \ to set up your pins as inputs or outputs with the following syntax:\n\n```\n\
    GPIO.setmode(GPIO.BCM)\nGPIO.setup(5, GPIO.OUT)\n```\n\n+   * **Step Three: Get\
    \ values**\nOnce the pins are set up, getting values from them is easy. To get\
    \ the value of a pin (0 or 1 for high), use the following syntax:\n\n```\nvalue\
