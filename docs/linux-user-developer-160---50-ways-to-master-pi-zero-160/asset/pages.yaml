- pgno: 37
  md: "# # Tutorial Chart.js\n\n# Global configuration\n\nAlong with the global prototype\
    \ methods, chart configurations are available for changes across all chart types\
    \ avoiding the need to configure each instance, or the default type. You can find\
    \ it in the chart.js file.\n\n```\nvar myChart = new Chart(ctx,Bar(data,options));\n\
    ```\n\nNote that the data structure used for a bar chart is similar to the one\
    \ used in line charts.\n\n# 05 Radar chart\n\nA radar chart is a way to show data\
    \ as a two-dimensional chart. In these kinds of charts, three or more variables\
    \ are plotted on the same axes. Another quality of these types of charts is that\
    \ the relative position and angle of the axes is intuitive. You can use radar\
    \ charts to plot more than one variable.\n\nThe process to plot radar charts using\
    \ Chart.js is: you just need to call the Radar() method:\n\n```\nvar myChart =\
    \ new Chart(ctx,Radar(data,options));\n```\n\nA popular variation of pie charts\
    \ is the doughnut chart. The major difference is that the inner portion of the\
    \ pie chart is filled, while for a doughnut chart it is empty. Both effects use\
    \ the same class in Chart.js. You can set a different value for your percentageInnerCutout,\
    \ set in the global configuration file. If you want to show out the doughnut for\
    \ pie charts, you can set the percentageInnerCutout for both charts, but they\
    \ differ in the doughnut effect.\n\n```\nvar myChart = new Chart(ctx,Doughnut(data,options));\n\
    ```\n\n# 07 Polar chart\n\nPolar area charts look similar to pie charts, but there\
    \ is one major difference: the radius of segments changes according to values,\
    \ while the angles remain the same. The pie charts have the same radius for all\
    \ the segments, and the angle varies according to the values. To plot a polar\
    \ area chart using Chart.js, use the PolarArea() method:\n\n```\nvar myChart =\
    \ new Chart(ctx,PolarArea(data,options));\n```\n\n```\nvar data = {\n  labels:\
    \ [\n    'Eating', 'Drinking', 'Sleeping', 'Designing',\n    'Cycling', 'Running'\n\
    \  ],\n  datasets: [\n    {\n      label: 'My First dataset',\n      fill: 'rgba(255,228,208,0.2)',\n\
    \      borderColor: 'rgba(255,228,208,1)',\n      backgroundColor: 'rgba(255,228,208,1)',\n\
    \      pointColor: '#fff',\n      pointBackgroundColor: '#fff',\n      data: [65,\
