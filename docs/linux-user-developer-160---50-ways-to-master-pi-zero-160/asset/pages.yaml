  md: '# # OpenSource


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_5_0.png)


    MINI-PC


    # # Raspberry Pi Zero

    is is world''s first $5 PC


    Main Raspberry Pi Zero distributors sold out almost immediately


    The Raspberry Pi Foundation has released a new model in its family of Raspberry
    Pi single-board computers: the Raspberry Pi Zero.

    Railing for $5, the Raspberry Pi Zero sacrifices a few components for greater
    cost-effectiveness. The BCM2835 processor has been used, no HDMI output, no GPIO
    header found in the Model B+, and no USB ports mean users will need to solder
    the pins themselves.

    The Raspberry Pi Zero connects via a micro-HDMI to HDMI adapter, and two USB ports
    replace one another.

    "Working with such powerful computers was like back to learning about computers,"
    said Raspberry Pi founder Eben Upton, of London. "What we''re trying to do is
    make Raspberry Pi sure that it is never going to be a barrier to anyone interested
    in coding."


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_5_1.png)


    # NEED TO KNOW


    # Ras Pi Zero

    essential info


    #  3 Cheap


    The $5 price point means that this device is affordable—making bulk orders for
    school IT departments even more feasible, and kids can get it on some pocket money.


    #  1 Tiny


    This is the smallest Raspberry Pi ever, at just 35x30mm (1.4x2 inches)—it''s half
    the size of a credit card. It''s perfect for embedded projects, where attaching
    them to microcontrollers or making wearable devices matters.


    #  4 HAT-compatible


    Unlike the original Raspberry Pi Zero, the board has HAT-addons that make it compatible
    with the original HAT specification, so your existing HAT-adds will work just
    fine.


    #  2 Powerful


    Despite the fact it uses the BCM2835 processor, it is about 60% faster than the
    original Raspberry Pi Model B, according to Eben Upton. It means we can use the
    standard Raspberry distro, just a regular desktop PC.


    #  5 Adaptable


    With all the GPIO pins, the Zero can display an output on monitors or TV as a
    desktop. You can expand the single micro-USB port by using a powered USB hub,
    so you can then plug in your keyboard, mouse, and Wi-Fi.


