  md: '# LIGHTWEIGHT DISTROS


    Here we take a look at some lightweight distros to install

    on your old hardware to get lightning-fast processing


    # ARCH LINUX


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_26_0.png)


    Arch Linux is an independently-developed Linux distribution with a strong focus
    on simplicity, minimalism and code elegance. One of the main reasons that Arch
    Linux is a lightweight and fast distro is that it is installed as a minimal system
    base, and users add packages when they need them. This gives you control over
    everything is installed at once, making the system run slower and forcing you
    to keep an eye out for tricks to optimize the set.


    Arch Linux has a rather interesting approach towards releases. It is based on
    a rolling-release model, which allows one-time installation with continuous updates
    to the distro without having to perform the elaborate procedures involved in upgrades
    from versions. With just one command, an Arch system is kept up-to-date. This
    way you get to keep a clean and updated system without much effort on your part.


    # ELEMENTARY OS


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_26_1.png)


    Elementary OS started as a set of themes and applications designed for Ubuntu
    and later turned into its own Linux distribution. An Ubuntu-based distribution,
    it is compatible with Ubuntu repositories and packages. The similarities with
    Ubuntu are limited to the software packages and do not extend much beyond.


    It has mastered a global aesthetic by streamlining the user interface and minimizing
    the need to configure everything. Rather than fighting against the GNU philosophy
    OS does away with fully-fledged configuration and focuses on a gentle learning
    curve.


    The core focus of Elementary OS is to provide a great user experience for users
    anywhere in the world.


    With a minimal design that is a perfect combination of a fast and easy Linux distribution
    that you should definitely check out.


    # elementary OS


    An easy and open alternative for Windows 10


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_26_2.png)


    # PUPPY LINUX


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_26_3.png)


    With a size of ~100MB this distro can be easily downloaded, installed and booted
    from a variety of media like CD/DVD and USB drives. Puppy has a tiny boot time
    of 30-40 seconds, making it one of the fastest-


    boosting distros, and it''s an excellent option for those who cannot upgrade their
    hardware, or for those who prefer just a lightweight environment.


    Another benefit of Puppy Linux is that it can detect most of your hardware without
    much technical knowledge required. Also, there is a wide range of applications:
    word processors, spreadsheets, internet browsers, and many utilities. Extra software
    can be installed in the form of packages.


