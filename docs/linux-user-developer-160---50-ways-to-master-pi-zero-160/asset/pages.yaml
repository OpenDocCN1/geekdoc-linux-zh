  md: '# CONTAINERS


    # CoreOS launches Claire security monitor


    Quay Security scanning now available to all


    CoreOS, the company behind the eponymous cluster-centric Linux distribution, has
    released a vulnerability analysis tool dubbed Claire for the open source Apache
    License 2.0. With this system, users can scan each layer of their container images
    for known threats based on the Common Vulnerabilities and Exposures Database (CVE)
    and other identifiers. Red Hat claims that the increasing number of container
    layers means that scanning multiple layers between containers is vital for creating
    a comprehensive inventory and security analysis.


    vulnerabilities,'' claimed CoreOS Quentin Rocha of the release. ''CoreOS believes
    tools that improve the security of the world''s infrastructure should be available
    for everyone.''


    Vulnerabilities will always exist in the world of software, so good security practice
    means being prepared for them - to identify packages and update them quickly.
    Claire is designed to identify packages from each layer, strengthening the defense
    for each version. This, CoreOS claims, makes it storage efficient and increases
    performance over other methods.


    # FOUNDATION


    # LF launches Open API Initiative


    The Linux Foundation has announced a partnership with industry giants including
    Google, IBM, Microsoft, PayPal and Paypal on a Collaborative Project: the Open
    API Initiative.


    The aim of the Initiative, the Foundation has announced, is to extend the specification
    for programming interfaces (API) framework, which will then result in creating
    a common technology that allows members to contribute a vendor-neutral and open
    specification for providing metadata for RESTful APIs - the reward for Swagger,
    especially success since its launch in 2010.


    Swagger is now considered as an open source project that reaches the limit of
    maturity; it cannot be managed by any organization or developer, explorer alone.
    Thus, the decision at the Linux Foundation, to launch the Open API Initiative
    as the successor to Swagger follows.


    The Open API Initiative will receive increased attention for its expressiveness,
    cohesive vision and tangible benefits. Tony Tam, who is also vice president at
    project, owner Smart Software, and co-founder of Reverb Technologies, will work
    with us...


    # SECURITY


    # ‘Linux Encoder’ has been defeated


    Discovery leads to easily-reversed AES encryption


    One of the first large-scale attempts to stop ''ransomware'' on Linux servers
    had a catastrophic flaw, as Dr. Web Lin discovered the breach by exploiting a
    vulnerability in the malware management system on Linux. When infected, a server
    would encrypt the host, root, and MySQL databases with a unique key generated
    during the installation of a ransomware in Bitlocker to recover the decryption.


    Radia Caraga, a cryptographic specialist working with Lin performed an analysis
    of the malware and found a serious flaw: the keys used for the encryption process
    were generated (using the lib rand function) along with the current system time
    - seed which was immediately recoverable by looking at the timestamp of the encrypted
    file.


    Using this information, Caraga was able to write a small script to decrypt files
    without needing to pay a ransom. Bitdefender has released a five-step process
    for cracking the encryption. The decryption tools and instructions are now available
    to everyone.


    "If your machine has been infected, consider this a close call. Most crypto-ransomware
    operators ask payment to get the decryption key of the Linux Encoder malware.
    ''Mistakes like that are extremely unfortunately, but others are furthermore...''


    Ransomware is an increasingly busy business, with the US Federal Bureau of Investigation
    claiming in June it received 922 complaints about the malware on which Linux Encoder
    is based over the past year, with losses totaling $188 million.


    The Open API Initiative is open to members and now runs under an open governance
    model. If you are interested, you can get more information on the project at openapis.org.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_8_0.png)'
