  md: '# Tutorial PulseAudio


    # # Discover the hidden power of PulseAudio


    We reveal new tricks and some new mind-blowing PulseAudio features at your fingertips


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_51_0.png)


    Most of us are running recent versions of our favourite Linux distributions, and
    that probably everyone uses PulseAudio as a default server, without any conscious
    decision to do so. We just play music, watch movies and enjoy online, but whatever
    we hear from our sound layer sits between the Linux kernel (which offers a driver
    for sound hardware) and desktop applications. PulseAudio was controversial some
    years ago, but it has since superseded a much simpler client-server solution,
    with many sophisticated modular client-server solution which has many benefits
    for power users who want to dive deeper into their Linux setup.


    # ## Discover your sinks and sources


    For any system with PulseAudio, each sound device is identified by three main
    components: card, sink and source. Sinks are what we use for playback and recording,
    with all physical inputs and outputs available. Not only can you mute the output,
    but you can also route it to another device (module-null-sink) or make it accessible
    for other applications by creating a virtual audio pipe-sink.


    The first stream source is used for working with the microphone, in-line, etc.),
    and so, finally PulseAudio creates a sink for each card and a source for each
    application that uses it and together with PulseAudio''s modular design gives
    us great flexibility.


    PulseAudio tries to figure out which sink and source should be set as the default
    ones, so in many cases you should have to redirect audio from your speakers to
    make your life working correctly out of the box. To see the current setup, use
    audio pactl list and examine its output.


    # ## Resources


    Any up-to-date Linux distribution, set up for general desktop use


    This tutorial assumes that you have PulseAudio installed in your system and will
    reveal a number of practical applications that we need. These include handling
    multiple playback streams, redirecting sound over a network, improving sound quality
    and making the most of your experience techniques to make things a bit easier.


    All you''re going to need is to provide a command line and a few minutes of your
    time.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_51_1.png)


    Right PulseAudio is

    a lot more than just

    sound system

    volume control


