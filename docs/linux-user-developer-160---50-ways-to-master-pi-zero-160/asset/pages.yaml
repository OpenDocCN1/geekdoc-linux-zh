  md: "The usergroup.c, also provided in the FileSilo resources, accesses /etc/group\
    \ in order to print all users who belong to a group which as a command line parameter.\
    \ Please note that you give either the group name or the group ID. A simple C\
    \ program executes the following output:\n\n```\n$ UserGroups\nFinding information\
    \ about _116nThe group is stated with ID (116).\nThe members of this group are:\n\
    tsouuk\n```\n\n```\nappName = getservport(htons(port), NULL);\nif (appName ==\
    \ NULL) {\n    printf(\"unknown application!\\n\\n} else {\n    name = appName->name;\n\
    \    printf(\"port number %d is %s\\n\", port, name);\n    return 0;\n}\n```\n\
    \nIf you want to find out all groups that belong to you, you can access the main\
    \ page of /etc/group which will return the list of groups which a user belongs\
    \ to. Inside that page, you will also find a C program that demonstrates the use\
    \ of getgrouplist().\ngetgroup() returns the effective group ID.\ngetgid() returns\
    \ the real group ID of a process.\n\nPlease note that you translate the port number\
    \ and network order using the htons() function - a shortcut tutorial about network\
    \ order will explain what host and network order is and why such a translation\
    \ is needed.\n\n# AboutSeuid\n\nMany programs change the user ID in order to perform\
    \ tasks that it would be difficult to accomplish without. The example /usr/bin/passwd\
    \ allows a normal user to write to /etc/passwd and /etc/shadow with the help of\
    \ setuid().\n\n# The /etc/services\n\nThe services file contains information regarding\
    \ the Internet. The following lines belong to /etc/services and are presented\
    \ in order to better understand its format:\n\n| | | |\n|---|---||\n| http | 80\
    \ | #WorldHTTP\n| http | 80 | #HyperText Transfer Protocol |\n\n```\n$ ls -l /usr/bin/passwd\n\
    -rwxrsr-x 1 root root 48512 Jan 21 2014 /usr/bin/passwd\n```\n\nThe following\
    \ shows a c program getgeteuid() which displays its effective user ID.\n\nThe\
    \ first field is the name of the port and the protocol used. The policy of IANA\
    \ is to assign a well-known port number for both TCP and UDP protocols. Even if\
    \ a service does not support one, you can see a line which also contains comments.\n\
    \n```\n#include <sys/types.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include\
    \ <stdio.h>\n#include <fcntl.h>\n```\n\nIt is important to remember that there\
    \ is no default service port number for FTP or SSH. However, you need to explicitly\
    \ declare the port you want to use on your client program. A example is the http://www.example.com/\
    \ used for accessing a web server.\n\nC structures and struct\n\nAA structure\
    \ is a user-defined data type in C that enables you to combine different items\
    \ of data of different types, including structures. You can access any individual\
    \ member of the structure using the dot operator (.) which is the stop between\
    \ the structure variable name and the member that you want to access. You can\
    \ also use pointers to structures, as in the following code:\n\nYou can access\
    \ the information in /etc/services using the following system calls: getservname(name),\
    \ getservport(port, protocol), getservbyname(name, protocol).\n\n```\n#include\
    \ <sys/types.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n\
    ```\n\n```\nint value;\nlist * list;\nan_aliz_to_the_list;\n```\n\nThe getservbyport(port)\
    \ illustrates the structure of the getservbyport system call.\n\nHere, you created\
    \ a linked list where each node has a pointer to the next node in the list. After\
    \ closing the brace you can access the list using head.\n\n```\nint main(int argc,\
    \ char **argv) {\n    struct servent *appName;\n    int port = 80;\n    char *name;\n\
    ```\n\nAdditionally, you can use -instead of the full stop to access a structure\
    \ member that is a pointer to another structure. Therefore, (*ptrToStruct(l))->i=15\
    \ and ptrToStruct(l)->i=15 are equivalent.\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_32_0.png)"
