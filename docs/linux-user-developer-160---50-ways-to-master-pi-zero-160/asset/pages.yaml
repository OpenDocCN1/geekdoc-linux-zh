  md: '# HARDWARE


    Below the maze-like circuit has to remain intact to function


    # # TOP FIVE


    # # New features in Linux 4.4


    # ## 1 Pi-mode-setting driver


    The first fruit of Eric Anthony''s efforts to create an operating system based
    for the Raspberry Pi, Linux 4.4, the driver bundled with Linux 4.4, offers kernel
    mode setting option. 3D acceleration is expected to follow in future release -
    but don''t expect to see it as soon as 4.4.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_6_0.png)


    # ## 2 Virtual 3D acceleration


    Linux 4.4 brings the VirtIO-DRI, DRImode developed by David Airlle into mainline
    for the first time, giving the QEMU stack the ability to render 3D acceleration-native
    through the host machine''s hardware.


    # ## 3 More AMD GPU support


    For users of AMD graphics, Linux 4.4 brings the new AMGPU scheduler to drivers,
    adds new support for Radeon HD family AMD APUs, and initial support for upcoming
    Stony powers. Power management, though, might wait until Linux 4.5.


    Boasts a maze-like circuit to protect from attack


    San Francisco-based Design Shift has taken to create a locked machine, via crowdfunding.
    Kickstarter to take orders for what it claims is the world''s first open source,
    physically secure computer.


    A compact, device-based design based on Intel''s latest family of x86-64 processors,
    ORWL''s primary security point is of focus: a wireless dongle is provided with
    every system, with a unique key paired with one. When it goes out of range, the
    system locks down; it is put into sleep mode and all USB and HDMI ports disconnected.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_6_1.png)


    To protect against physical attacks on the locked machine, ORWL is built with
    a custom-made casing, the ''cases'' of surfaces which are covered in a maze-like
    circuit. This circuit may remain unbroken for the system, if broken the microcontroller
    will erase the local key - ensuring the data on the system can be decrypted never.


    With the maze-like circuit and strengthened casing, ORWL is a security fan''s
    dream


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_6_2.png)


    # ## 4 Network enhancements


    Linux''s networking subsystem has received considerable attention in the development
    of Linux 4.4 with new features including a brand-new WiFi driver for Atheros cards,
    improved eBPP, support for IPv6 and VXLAN drivers, and finally a TSOP kernel driver.


    Pricing for the ORWL starts from $299 for an early bird developer''s kickstart,
    with keys up to $399 for a top-end model. The price, which they''ve claimed, has
    reached a 50 percent level discount on the national price - suggesting that, if
    the devices are funded, they reach the very top of the computer price point.


    Each machine is fully portable and includes one or two encryption keys, an external,
    power supply, up to 8GB of RAM and a 512GB solid-state drive.


    While its design has been significantly improved it still unlikely to be used
    for production: at the time of writing, the campaign had raised $24,000 of its
    $175,000 goal.


    # ## 5 Skylake enhancements


    Intel''s latest microarchitecture, Skyline, is one of many improvements over previous
    incarnations. Still, some of these have brought changes to graphics or sound issues
    that should upgrade to Linux 4.4 for the best support.


    www.linuxux.co.uk'
