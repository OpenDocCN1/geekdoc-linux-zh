- pgno: 65
  md: '# # Hardware how-to


    GPIO interrupts, pulse width modulation, soldering and more


    # ## GPIO explained


    +   - **GPIO orientation**

    The best way to ensure the Pi is oriented the right way is to flip it over! The
    Pi has a square hole for the camera/display module.

    - **Serial console**

    If you connected the Pi to a USB-to-serial adapter, UART0_RXD to pin, you can
    set up a serial console.

    - **Unused GPIO pins**

    The green coloured pins are unused by default and are there for your personal
    projects. The other pins may have more than one use.

    - **Soldering headers**

    With the Pi, solder GPIO headers onto the board. Using a heat sink back to the
    header will make the job much easier.


    # ## 40 Pin layout


    | 3V3 Power | 01 | 02 | SV Power |

    | 5V Power | 03 | 04 | Power |

    | GPIO02 SDA1 | 05 | 06 | Ground |

    | GPIO03 SCL1 | 07 | 08 | GPIO24 |

    | Ground | 09 | 10 | GPIO14 UARTD_RXD |

    | GPIO17 | 11 | 12 | GPIO18 UARTD_TXD |

    | GPIO27 | 13 | 14 | Ground |

    | GPIO22 | 15 | 16 | GPIO23 |

    | 3V3 Power | 17 | 18 | Ground |

    | GPIO10 MOSI | 19 | 20 | GPIO25 |

    | GPIO9 MISO | 21 | 22 | GPIO26 |

    | GPIO01 SCLK | 23 | 24 | GPIO21 CEB_N |

    | Ground | 25 | 26 | GPIO27 SCL_N |

    | ID_ID EEPROM | 27 | 28 | ID_SC EEPROM |

    | GPIO05 | 29 | 30 | Ground |

    | GPIO06 | 31 | 32 | GPIO12 |

    | GPIO13 | 33 | 34 | Ground |

    | GPIO19 | 35 | 36 | GPIO16 |

    | GPIO26 | 37 | 38 | GPIO20 |

    | Ground | 39 | 40 | GPIO21 |


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_65_0.png)


    # ## How to solder with ease in a few steps


    +   - **Step One: The tools**

    You need a soldering iron (40-60 watts), a temporary coiled reel, a stand to put
    it in, a sponge to clean the tip, and then some solder. Solder is easier to work
    with lead-free, and with a square tip rather than a pointy one.

    - **Step Two: Soldering**

    Once the iron is hot, apply some solder to the tip and avoid any excess on the
    tip. When pressing the iron to the joint, the tip should be touching both the
    joint and the wire you are soldering. Do not apply solder directly to the iron;
    apply it to the joint/wire.

    - **Step Three: If you make a mistake**

    You''ll probably need more solder, as you will be, so soldering. Accidents can
    happen, and the best way to remove excess solder is to get some de-solder braid.
    This is what you put over solder, before putting the iron over the top. The solder
    is sucked onto the braid.'
