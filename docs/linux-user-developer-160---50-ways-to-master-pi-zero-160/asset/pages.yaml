    The Linux Mint 17.3 beta releases with a bang featuring the new MATE desktop environment
    that enables users to quickly and easily manage windows for the first time.


    # ### Chakra 2014.1


    This new Ubuntu Linux release, named Chakra, brings back the Compiz desktop system
    for the older tribe and includes the SDDM display manager as default.


    # ### Puppy Linux 6.3


    An always-popular distribution for older hardware, this Puppy Linux release features
    a Slack-branch - contrasted with the 6.0 used Ubuntu True branches.


    # ## Wiegley new Emacs maintainer


    # ### Richard Stallman takes another break from project


    Emacs founder and maintainer Richard Stallman has resigned the line to let John
    Wiley over leadership effectiveness.


    > "Richard and I met yesterday," Wiegley expressed delight at the announcement
    to the Emacs mailing list, while he accepted the role as maintainer of Emacs.


    Emacs, named as a contraction of Editor MacOS, were originally created in 1976
    by Stallman and Guy Steed. It was an extension of the TECO editor. Stallman then
    proceeded to


    the GNU Emacs project in 1984 as a free software implementation.


    Wiegley has already indicated he plans to change the project. "It has time to
    establish a Code of Conduct, along with a system where all one points are allowed
    by default, but those who disagree the CoC will let it rise until the end of a
    waiting period, I would like to have a semi-professional atmosphere focusing on
    integrating Emacs, and an easy going social atmosphere."


