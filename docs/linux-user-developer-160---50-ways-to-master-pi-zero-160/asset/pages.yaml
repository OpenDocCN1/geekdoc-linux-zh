    \ third field\n        char *username = strtok(buffer, \":\");\n        char *password\
    \ = strtok(NULL, \":\");\n        char *uid = strtok(NULL, \":\");\n        if\
    \ (strcmp(uid, \"0\") == 0)\n            printf(\"User %s has root privileges!\\\
    n\", username);\n    }\n\n    fclose(INPUT);\n    return 0;\n}\n\n```\n\n# Most,\
    \ if not, programs have access to, read or modify files, which is generally behind\
    \ the scenes\n\nThis is extremely valuable when trying to execute the -R command,\
    \ which lists all subdirectories. The password file contains entries for each\
    \ user. The system file for the user is: /etc/passwd\n\nA colon separates the\
    \ fields in the /etc/passwd file. The first field is the username, and the second\
    \ field is the length of the username. The third field is the user ID. The fourth\
    \ field is the home directory of the user. Please note that instead of a string,\
    \ you can define the absolute path of home, which is used for users of services\
    \ like web servers or a database. The entry for the www-data user -which is, Apache\
    \ of the web server- is the following:\n\n```\nroot:x:0:0:Mihail Tokoualous:/home/root:/bin/bash\n\
    ```\n\nusr/bin/nologin binary is a shell replacement for accounts that should\
    \ be disabled for security reasons. The third field is the numerical value of\
    \ the user ID, the fourth field is the numerical value of the default group ID\
    \ of the user. As you will see in a while, to order the numerical value of the\
    \ group ID something more meaningful, you will have to access /etc/group.\n\n\
    ```\nwww-data:x:33:33:/var/www:/usr/bin/nologin\n```\n\n* Asterisk"
