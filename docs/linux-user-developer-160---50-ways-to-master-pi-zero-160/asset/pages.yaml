- pgno: 60
  md: '# Raspberry Pi Zero


    Pinless port. The GPIO header is the same as in the newer models but comes without
    the pins. You''ll need to solder on a 40-pin male header block.


    BCM2835 This is the same processor used in the original Raspberry Pi models, although
    it has been overclocked to run at 900MHz and is about 40% faster.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_60_0.png)


    The newest member of the Raspberry Pi, this tiny board is the result of the Raspberry
    Pi Foundation''s efforts to reduce the cost of the computer even further. Not
    without reducing its $35 computer to $25, which can still be bit pricey for some
    people, it has cut right down $5 by making a few adjustments. Here''s what you
    need to know.


    Mini-HDMI You need a mini HDMI to HDMI cable to use your monitor. You can use
    your TV with the RCA video-out if you solder the pin.


    Micro-USB One of the ports is for micro-USB power supply. You can use peripherals
    and wifi by using a micro-USB to USB adaptor so you can attach a powered USB hub.


    # Vital knowledge


    Essential tricks to improve your day-to-day use


    +   03 Find your pi on a network

    If you can''t find it on your router via DHCP, you can scan the local network
    using Linux, Windows and Mac. You need to know the address range of your local
    network (common networks are 192.168.1.0, or 192.168.2.0), nmap -sn 172.17.1.0/24
    will run a ping scan and output a list of devices. Example output:


    ```

    Nmap scan for raspberrypi.local (172.17.1.0/24)

    Host1 is up (0.04ms latency).

    ```


    +   04 Experiencing stability issues?

    By the highest cause of stability issues is the power supply you are using. The
    Raspberry Pi 2 has more CPU cores and uses more energy. The recommended current
    supply for a Raspberry Pi 2 or B+ is 2 amps. If you are still having issues, your
    SD card may be worn out.


    +   05 Forgot to type sudo?

    sudo is used to get privileges for a specific command (for example, sudo apt-get
    update). The variable !! is the previous command you used. If you need privileges
    for something but forgot to type sudo then you can simply type sudo !! you haven''t
    typed anything else.


    +   06 Enable max current draw

    If you have a good power supply that feeds 2 amps or more want to be able to connect
    a power-heavy device to your Pi 2 or B+, use the USB hard disk, then you can also
    edit the /boot/config.txt file, which will set the max current over to USB 2 amps
    instead of the default 600mA.


    +   02 Ensure you have the latest packages on Raspberry by update sudo apt-get
    upgrade from the terminal'
  merge: -1
