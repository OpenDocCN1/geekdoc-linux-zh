    #include <unistd.h>\n#include <sys/types.h>\n#define _XOPEN_SOURCE\n#define _GNU_SOURCE\n\
    #define _USE_XOPEN\n#include <time.h>\n```\n\n```\nint main(int argc, char **argv)\
    \ {\n\t\ttime_t time;\n\t\tstruct tm *mytime;\n\t\tchar timstr[128];\n\t\t// Get\
    \ current time\n\t\ttime(&time);\n\t\t// Convert it to a tm structure\n\t\tmytime\
    \ = localtime(&time);\n\t\t// Get output from the same tm structure\n\t\ttftime(timstr,\
    \ 128, \"Date: %Y %d\", mytime);\n\t\tprintf(\"%s\\n\", timstr);\n\t\ttftime(timstr,\
    \ 128, \"Time: %H:%M:%S\", mytime);\n\t\tprintf(\"%s\\n\", timstr);\n\t\ttftime(timstr,\
    \ 128, \"Time: %X\", mytime);\n\t\tprintf(\"%s\\n\", timstr);\n\t}\nreturn 0;\n\
    }\n```\n\nHere is the source code of the nameServers.c program. You will find\
    \ that the program will produce output similar to the following:\n\n+   * nameServers\n\
    Total number of DNS servers: 3\nDNS Server 0: 104.24.192.230\nDNS Server 1: 104.24.192.231\n\
    DNS Server 2: 104.24.192.232\n\nAfter calling `res_init()` function, the resolver\
    \ is initialized and all the information you need is got. The list of DNS servers\
    \ is stored in a C structure named `addr_list`. As an example, you will have to\
    \ use `inet_ntop()` to convert its `sin_addr` value to a printable string, before\
    \ printing it. The `res` structure that stores all information after the `res_init()`\
    \ call can be found in the resolv.h file.\n\n# Time and date functions\n\nA Linux\
    \ system provides functions that enable you to deal with date and time with the\
    \ help of the data structures.\nThe following table shows the fields of the tm\
    \ structure as taken from the time.h page. You can see that the `tm_sec` field\
    \ contains values from 0 to 60 in seconds—around seconds—as example, these details\
    \ might make a big difference.\n\nThe `strftime()` function works for time values\
    \ as it supports various arguments that enable you to customize the output. The\
    \ `strftime()` function converts a representation of time and date to a tm structure\
    \ and is useful for parsing date and time input.\n\n```\nif (strftime(\"16 Nov\
    \ 2015 15:21:30\", mytime) == NULL) {\n\t\tprintf(\"Error executing strftime!\\\
    n\");\n}\nftime(timstr, 128, \"Date: %a %d %B, %Y\", mytime);\nprintf(\"%s\\n\"\
    , timstr);\n```\n\n# Global, local and static variables\n\nGlobal variables are\
    \ accessible throughout the program. Local variables are only accessible within\
    \ the block of code in which they are declared. Consequently, they usually have\
    \ simple names that do not cause confusion.\n\nGlobal variables are available\
    \ at any point during execution, so choose an appropriate name for them.\n\nA\
    \ static variable keeps its value between calls. It is initialized as a global\
    \ variable but is 'seen' only in the function where it is defined.\n\nIf you use\
    \ a local static variable, it stores the pointer to the passed string. In other\
    \ words, the static pointer was used in order to make the `strtok()` function\
    \ return different options. The buffer is allocated the first time `strtok()`\
    \ is called.\n\nwww.linuxuser.com 35"
