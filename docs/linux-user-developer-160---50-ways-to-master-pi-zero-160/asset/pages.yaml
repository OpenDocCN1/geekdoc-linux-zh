    \ similar to one in Step 7 Open IDE and start a new window, adding the following\
    \ code to save your Mobile_Lights folder, named 'mobile.py'. Line 4-7 and 11 use\
    \ @app.route('/') and @app.route('/') to tell the Flask trigger when the URL is\
    \ clicked. In line 15 the function is used to run the web server if the __name__\
    \ == '__main__' is executed directly from the Python interpreter and not used\
    \ as an imported module.\n\nfrom flask import Flask, render_template\nfrom energie\
    \ switch_on, switch_off\n\n```\napp = Flask(__name__)\n@app.route('/')\n```\n\n\
    # 17 Turn your lights on and off\n\nGrab your device, smartphone or tablet and\
    \ load the web browser. Enter the IP address you noted down in Step 5. At the\
    \ end of the address, add ':5000' – for example, 192.168.1.52:5000. The 5000 is\
    \ the port number to open the communication between your device and the Raspberry\
    \ Pi. All will be presented with On and Off options, and you can now control the\
