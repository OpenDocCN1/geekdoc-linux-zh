  md: "# Tutorial Data files and information\n\nBroken-down time is stored in the\
    \ structure tm, which is defined in <time.h> as\nfollows:\n\n```\nstruct tm {\n\
    \    int tm_sec;    /* Seconds (0-59) */\n    int tm_min;    /* Minutes (0-59)\
    \ */\n    int tm_hour;   /* Hours (0-23) */\n    int tm_mday;   /* Day of the\
    \ month (1-31) */\n    int tm_mon;    /* Month since January (0-11) */\n    int\
    \ tm_year;   /* Year since 1900 */\n    int tm_yday;   /* Day of the year (0-365,\
    \ 0=Sunday) */\n    int tm_wday;   /* Day of the week (0-6, 0=Sunday) */\n   \
    \ int tm_dst;    /* Daylight saving time */\n};\n```\n\nThe members of the tm\
    \ structure are:\n\n+   - tm_sec:  The seconds of the hour, normally in the range\
    \ of 0 to 59,\n  but can be up to 60 for leap seconds.\n- tm_min:  The minutes\
    \ of the hour, normally in the range of 0 to 59.\n- tm_hour: The hours of the\
    \ day, in the range of 0 to 23.\n- tm_mon:  The number of months since January,\
    \ in the range of 0 to 11.\n- tm_year:  The number of years since 1900.\n- tm_yday:\
    \  The days of the year since January, in the range of 0 to 365.\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_33_0.png)\n\
    \nThe setuid() function is used for setting the effective user ID of\nthe calling\
    \ process. Before you set executing setuid()\nYou should always change your permissions\
    \ before, using\nroot privileges:\n\n```\n# sudo chown 4755 setuid\n# su -root\
    \ setuid\n# -ls -l root msetook 7864 Nov 4 20:28 setuid\n```\n\nIf you execute\
    \ setuid as root, it will generate the\noutput:\n\n```\n$ /setuid\nReal UID =\
    \ 1000\nEffective UID = 0\nBecoming Root!\nReal UID = 1000\nEffective UID = 0\n\
    Real UID = 1000\nEffective UID = 0\n```\n\nThe touch() function is defined and\
    \ used inside setuid() for creating\nfiles:\n\n```\n$ -ls -l root setuid\n# -r\
    \ -xrwx root msetook Nov 4 20:31 asroot\n# -r -xrwx msetook Nov 4 20:31 asroot\n\
    ```\n\nPrograms that use setuid() are to prevent security threats\n should always\
    \ be carefully examined before use in production\nenvironment.\n\nAs you understand,\
    \ a process born by root can change\nits effective UID to mroot, but a process\
    \ born by root cannot\nchange its effective UID to root.\n\n# Accessing /resol.conf\n\
    \nSome programs accessing /etc/resol.conf\nthat they want to read the names of\
    \ servers in order\na hostname to an IP address. This will implement a\nutility\
    \ in C that the DNS servers used by the\nnetwork and programming might functions\
    \ are used to do with\nstrange things, so sorry if it leaves a little unfamiliar:\n\
    \nThe tm structure breaks\ndown the calendar\nand time into\ncore components\n\
    \n```\n#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include\
    \ <netinet.h>\n#include <resolv.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\
    ```\n\n```\nint main(int argc, char **argv) {\n    // Initialize the resolver\
    \ structure\n    res_init();\n}\n```\n\n34"
