  md: '# Tutorial Chart.js


    # Visualise your data

    with Chart.js


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_35_0.png)


    Chart.js is a JavaScript library that helps you draw gorgeous graphs of all kinds
    on your website


    Data visualisation is one of the most important considerations when you need to
    convey a message to your audience in the clearest manner possible. Whether it
    is instantly understood or hide the data as charts and instead of plain tables
    is better than text, data visualisation will always save the day for you and your
    presentation.


    +   01 Installation

    To install the Chart.js library, just download the JavaScript library from the
    official Chart.js GitHub repository and then include the chart.js file wherever
    you''d like to use it:


    ```

    <script src="chart.js"></script>

    ```


    Note that you need to pass the proper path of the chart.js file in your file system,
    while including the library file.

    Instead of manual download, you can use JavaScript package managers like NPM or
    Bower. You may already know NPM is used commonly to manage Node.js projects. Bower
    also supports it.

    Chart.js is created for front-end libraries. The difference is that NPM uses a
    nested dependency tree, putting the burden of dependency management on the user.
    Coming back to Chart.js, here is how to grab using Bower.


    Nitish Tiwari

    is a software developer who loves open source software enhanced by himself. It''s
    as well as writing for himself in magazines, he helps others find source software
    for business needs


    # Resources


    Charts.js

    chartjs.org


    ```

    $ bower install Chart.js --save

    ```


    If you need NPM:


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_35_1.png)


    Right Chart.js lets you draw common graphs with just a tiny bit of code. This
    is a pie chart with custom tool tips


    36'
