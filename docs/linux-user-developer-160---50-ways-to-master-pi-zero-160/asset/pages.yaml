  md: '# # Tutorial


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_73_0.png)


    Above you need to get the folder correct so that files are saved properly


    #  CSS


    To make the web page publication, you need to use an HTML and CSS file. HTML stands
    for Hyper Markup Language and CSS is the language used to create web pages. You
    can convert HTML files into web pages, images and objects to be embedded in the
    pages. Cascade Style Sheets, CSS, is the code which describes how the web page
    looks. It contains the instructions on the elements of the HTML content. It is
    rendered in your browser. In this tutorial, it controls how the off will be presented
    on the screen.


    #  Create a new folder


    With Flask installed, reboot your Raspberry Pi; type sudo reboot in /pi folder.
    Create a new folder called Mobile_Lights in the /home folder. This is where you
    will use the Python program which controls the socket and lamp, Lights. You can
    create the folder in the LX Terminal by typing `mkdir mobile_lights` or by right-clicking
    in the window and selecting New Folder.


    #  Create the HTML file


    Open the Mobile_Lights folder and create a new folder called ''templates''. Inside
    that folder create a new HTML file that contains the structure for the website
    layout. The code names the web page tab and indent, adds for the lines of and
    option.


    Open a text editor from your Start menu, or use nano and create a new file. Add
    the HTML to the file and save it to the template folder, naming it ''index.HTML''.
    Remember, this is an HTML file and must end with the file extension.


    ```

    <doctype html>

    <head>

    <title>Controller</title>

    ```


    #  Add some style


    > <link rel="stylesheet" href="static/style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <head>

    <body>

    <div class="on"><h1>Hello!</h1>

    <div class="off"><a href="#">OK</a></div>

    </div>

    </body>

    head>

    </html>


    The Cascade Style Sheet, CSS, is used to create and apply a style to the web page.
    Go back to the Mobile_Lights folder and create a new folder named static. This
    is where the CSS file is saved. Create another text file and add the code below,
    which will set the ''style'' for the web page. You can change the colours of the
    buttons from line to line. Save the file as ''style.css'' in the static folder.
    Remember this is a CSS file and


    ```

    body {

    position: absolute;

    margin: 0;

    top: 0;

    right: 0;

    bottom: 0;

    left: 0;

    font-family: Arial, sans-serif;

    font-size: 150px;

    text-align: center;

    }

    ```


    ```

    div {

    display: block;

    ```


    74'
