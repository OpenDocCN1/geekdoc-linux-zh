  md: "# # Become some handy Python Features that will make your code really stand\
    \ out\n\n# ## The main function\n\nHaving a function if `__name__ == '__main__'`\
    \ in Python makes it easier to see the difference between where your functions/classes\
    \ are defined and where your entry point is. More importantly it allows you to\
    \ import code from that script without it being the main script running. This\
    \ means you can create a class and have that tests classes to make sure work.\
    \ where you include your file in another program, the code in the method would\
    \ not run and you can just use the class that you require.\n\n```\nif __name__\
    \ == \"__main__\":\n    # Test MyClass\n    m = MyClass()\n    m.print_increment()\n\
    \    m.print_increment()\n```\n\nYou can check for line arguments in this list.\
    \ if the length of the list is 1 and you require arguments, print a help message\
    \ with instructions.\n\n```\nimport sys\n```\n\n```\nhelp_msg = \"My help message\"\
    \ndebug_mode = False\nif __name__ == \"__main__\":\n    if len(sys.argv) == 1:\n\
    \        print(help_msg)\n        sys.exit()\n```\n\n# ## Command line arguments\n\
    \nCommand line arguments enable programs modes based on the options that the user\
    \ passes to the program when running it. Command line arguments in Python are\
    \ given in sys, which is a list of strings. The first element is the name of the\
    \ script that has been executed. For example, some code that print the argv produces\
    \ outputs:\n\n```\n$python args['1']\n$python args['--'] --foo\n```\n\n# ## Class\
    \ Methods\n\n```\ndef __init__(self):\n    self.x = 0\nndef print_increment(self):\n\
    \    print(self.x)\n    self.x += 1\n```\n\n# ## Properties and setters\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_63_0.png)\n\
    \nProperties in Python are a way to write getters and setters for variables. You\
