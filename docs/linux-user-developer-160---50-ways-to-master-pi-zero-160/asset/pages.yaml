  md: "# Tutorial Data files and information\n\nRight Reading /etc/passwd should be\
    \ passed fine, but don't try to edit it without locking\n\nThe passwd structure\
    \ is defined in passwd.h as follows:\n```c\nstruct passwd {\n    char *pwname;\
    \      /* username */\n    char *pwpassword;  /* password */\n    uid_t uid; \
    \        /* user ID */\n    gid_t gid;         /* group ID */\n    char *pwgecos;\
    \     /* user information */\n    char *pwhome;      /* home directory */\n  \
    \  char *pwshell;     /* shell */\n};\n```nSee passwd() for more information about\
    \ these fields\n\nby line, it uses less C than uid.c. The getuid() returns the\
    \ effective ID of the current user whereas getgid returns the effective ID of\
    \ the current user. both systems need a program in order to be executed, what\
    \ is actually returns is the properties of the current user at the end of the\
    \ line.\n\nThe adjacent image shows various fields of the passwd de security that\
    \ the getpasswd() system returns it in userShell.\n\n# Shadow password support\n\
    \nAlthough using /etc/passwd can perform the same task using edit, it is much\
    \ more difficult to protect the information in case\n\nAs you can see from the\
    \ output, /etc/passwd can be read by anyone /etc/shadow can only be read by users\
    \ who belong to the shadow group:\n\n```\n$ ls -l /etc/passwd /etc/shadow\n-rw-r--r--\
    \ 1 root 1953 Apr 26 2015 /etc/passwd\n-rw-r---- 1 root 1245 Apr 26 2015 /etc/shadow\n\
    ```\n\nthe solution in C. The code reads /etc/passwd line by line and gets the\
    \ UID for each entry that does not begin with a ':' character, which denotes a\
    \ colon. If a UID value is equal to zero, then the returned username is printed\
    \ on the screen. The process then returns the UID of the end.\n\nAs a result,\
    \ /etc/passwd keeps the encrypted password for security - that is why the file\
    \ of /etc/shadow is used as a placeholder. This transformation of the password\
    \ file means that sensitive information is encrypted. /etc/passwd should have\
    \ at least two fields, the username and the encrypted password.\n\nThe strtok()\
    \ function searches its input until a ':' character is found. The returned token,\
    \ the username, is stored in the variable. In order to get next tokens and continue\
    \ with the rest of the string, you will have to pass NULL as the first argument\
    \ to strtok(); strtok maintains a static pointer to the start of the string, therefore\
    \ if you pass a new pointer to it, the old reference gets discarded. strtok()\
    \ does not keep the contents of the variable in any way. After you get the user\
    \ name, you can compare it with strmp(). If there is a match, you return the username\
    \ of the user who has a UID of zero.\n\n/etc/shadow usually contains additional\
    \ fields that are related to password aging. It is important that this information\
    \ is encrypted. If you want to support shadow passwords in your programs, you\
    \ should use some or all of the following: getpwnam, getspwd, getspwd, setspwd,\
    \ getckpw, and unlockckpw.\n\nPlease note that reading /etc/passwd without locking\
    \ it is not a problem but editing it without any locking is bad. Additionally,\
    \ /shadow does not access /etc/passwd using any calls, which is unconventional.\n\
    \nFurther discussion about shadow passwords is beyond the scope.\n\n# The /etc/group\
    \ file is similar to the following:\n\n```\n#include <stdio.h>\n#include <types.h>\n\
    #include <unistd.h>\n#include <group.h>\n```\n\n```\nint main(int argc, char **argv)\
    \ {\n    struct passwd *passwd;\n    if (getpwuid(getuid()) != NULL)\n       \
    \ printf(\"shell: %s\\n\", passwd->pwshell);\n    return 0;\n}\n```\n\nThe previous\
    \ output shows that mtsook is a member of the dev and shadow groups. Each group\
    \ has a unique number associated with it.\n\nThe group structure is quite similar\
    \ to the passwd structure is defined as follows:\n\n```\nstruct group {\n    char\
    \ *gr_name;\n    char *gr_passwd;\n    gid_t gid;\n    char **gr_mem;\n};\n```\n\
    \nThe gr_name variable holds the group name whereas gr_gid holds the group ID.\
    \ The gr_mem variable is a NULL-terminated array of pointers to names of group\
    \ members. The gr_passwd contains a string that contains the password of group,\
    \ which is rarely used nowadays.\n\nThis program (userShell) shows the shell of\
    \ the user using the appropriate system calls that access /etc/passwd. This is\
    \ a safer, easier and recommended way of accessing /etc/passwd. Additionally,\
    \ since it does not have to manually parse /etc/passwd line\n\n32"
