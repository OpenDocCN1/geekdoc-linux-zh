  md: '# Tutorial PulseAudio


    # ### Even more modules


    The number of PulseAudio modules is ever growing and most of them are still worth
    exploring. For the general public, there are many modules that would sound right.
    A couple of examples: module that can save your laptop battery by powering down
    an idle sound card, and module that shifts sounds between the left and right channels,
    changing the position of the widget them.


    # 04 Remove noise and echo

    This not everyone is aware of PulseAudio is shipped with modules that can improve
    the sound quality in certain cases, such as in VoIP conversations. The main idea
    for what called module-echo-cancel is removing echo, controlling gain and reducing
    ambience. To use it, add the following line to /etc/pulse/default.pa:


    ```

    load-module-echo-cancel

    ```


    You can also specify one of the audio echo cancellation (AEC) methods right here:


    ```

    load-module-echo-cancel aec_method=webrtc

    load-module-echo-cancel aec_method=aec

    ```


    webrtc works better than speck, though the latter is more stable. There is a small
    limitation, however: it only works when there is some audio to play back. By the
    way, it is possible to load modules without instantly restarting PulseAudio settings.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_53_0.png)


    ```

    $ $ load-module <module_name>

    ```


    # 06 Sound over network

    If you have two PCs in your LAN, you can set up remote audio playback with the
    PulseAudio''s capabilities. It can be really useful when you have speakers in
    different rooms, like a Raspberry Pi in your living room and you want to listen
    to music from your laptop. In PulseAudio your Pi would be the server and your
    laptop would be discoverable on the network. Now we''ll set up a tunnel from the
    client to the server. On the server side, add the following into /etc/pulse/default.pa:


    ```

    load-module-zero-copy-tcp-server-sink protocol=1 addr=192.168.0.1

    load-module-tcp-tunnel-client-sink protocol=1 server=192.168.0.1

    ```


    where 192.168.0.1 is your server''s IP address. On the client side, install the
    package (for Ubuntu it like sudo apt-get install), run it & enable the module
    discoverable PulseAudio network device available locally. Finally, restart PulseAudio
    daemon on both your server and client pulseaudio --start. Now you can choose your
    sound device from Pavucontrol or PulseAudio-compatible modules.


    # 05 Fix Skype issues

    Skype is a popular app but the most widespread PulseAudio issue is for Linux.
    Various issues can take place when using Skype, most concerning sound quality.
    PulseAudio can help here. First, if you encounter echoing, try to run the application
    with custom variables, like this:


    ```

    $ PULSE_FILTER=module_echo-cancel; skype

    ```


    Another concern can be cracking sounds, it is an issue in older PulseAudio versions,
    but some people using Skype on 64-bit Linux systems still find it issue. There
    are two methods to address these cases of the problem. The first changes audio
    latency:


    ```

    $ PULSE_LATENCY_MS=30; skype

    ```


    The second one disables glitch-free playback, which may help for sound cards that
    do not return accurate timing information. Add the following line to /etc/pulse/default.pa:


    ```

    load-module-udev-detect tsched=0

    ```


    # 07 Use a built-in equalizer

    Many music and users of Linux have audio equalizers that can enhance sound or
    create a desired effect. However, these are custom implementations that depend
    on the system. A system-wide equalizer so if your users are not experts enough,
    a global equalizer would be marvelous. Well, we have one and it is... PulseAudio-equalizer!
    it is included in most all Linux distros, so if not what to do is to go to your
    software manager and get this extra package installed. PulseAudio-equalizer has
    15 bands and 29 presets for


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_53_1.png)


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_53_2.png)


    and restart the system.


