    \ meaningless: it becomes only useful when the coordinate values are mapped to\
    \ an axis and/or distance system. When working on 3D objects, the entire model\
    \ is placed in a coordinate system called model space, ranging from -infinity\
    \ to infinity.\n\n3D engines can be built by multiplying them with one another.\
    \ Sadly, matrix multiplications are not commutative: the operation on the left\
    \ performed before the one on the right. Getting the order wrong can lead to weird\
    \ results - scaling and rotating always come before translation.\n\nBringing the\
    \ model onto the screen is done in two steps. First of all, rotations and scaling\
    \ operations are carried out. You turn the object around an axis to make it face\
    \ correctly to the camera.\n\nIn the next step, the BasicEffect is informed that\
    \ the vertices passed to it contain colour data:\n\nAfter that, a translation\
    \ 'pushes' the object to its final place in the coordinate system. With that,\
