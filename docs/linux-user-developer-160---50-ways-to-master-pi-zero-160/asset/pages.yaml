  md: '# FileSilo


    # HOW TO USE


    EVERYTHING YOU NEED TO KNOW ABOUT ACCESSING YOUR NEW DIGITAL REPOSITORY


    To access FileSilo, please visit www.filesilo.co.uk/linuxuser


    +   01 Follow the instructions on-screen to create an account with our secure
    FileSilo system, then log in and unlock the issue by answering a simple question
    about the magazine.

    You can access the content for free with your issue.


    +   02 If you''re a subscriber, you can easily unlock all the content by entering
    your Web ID. Your Web ID is the eight-digit alphanumeric code printed above your
    address details on the mailing label of your subscription copies. It can also
    be found on your renewal leaflets.


    +   03 You can access FileSilo on desktop, tablet or smartphone device using any
    popular browser (such as Firefox, Chrome or Safari). However we recommend that
    you use a desktop to download content, as you may not be able to download files
    to phone or tablet.


    +   04 If you have any problems with accessing content on FileSilo, or with the
    registration process, take a look at the FAQs online or email filesilo-help@imagine-publishing.co.uk


