    Hints and vital info to get the most out of\nany Raspberry Pi model\n\n+   - Remote\
    \ access with SSH\n  SSH stands for Secure Shell. You can use SSH\nto connect\
    \ to a terminal on your Raspberry Pi over your\nlocal network. This means that\
    \ you can use the Pi with only\nnetwork and power cable connected, which is much\
    \ more\nconvenient. If you have a screen and keyboard connected\nfound on your\
    \ Raspberry Pi you can log into it using the default\nusername of 'pi' and password\
    \ of 'raspberry'.\nLinux and Mac have built in SSH, so simply open the\nterminal\
    \ and type the address of your Pi. On Windows, you can use an SSH\nclient PuTTY,\
    \ which is free to download, not install\nand is easy to set up in a few seconds.\n\
    \n```\npi@raspberry:~$ \npi@192.168.1.15:~$ sudo raspberry-config\n[1] Interface\
    \ Options\n[2] Localization Options\n[3] Advanced Options\n[4] Performance Options\n\
    [5] Weak Password\n```\n\n+   - SCP for transferring files\n  SCP stands for Secure\
    \ Copy Protocol, and it allows you\nto copy files (and directories) from your\
    \ Raspberry Pi\nover network. A good use of this would be if you have a for\n\
    PyGame project and need to copy it over. FileZilla is a decent\nchoice for this\
    \ as it connects over port 22 with the\nusername of 'pi' and password 'raspberry'.\
    \ If you are using SCP\nfrom the terminal the syntax is as follows:\n\n```\nscp\
    \ testdir/ pi@172.17.17.21:~/testdir\n```\n\nThe switch is for recursive, which\
    \ means entire directories\n\n# # Raspberry Pi B+\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_61_0.png)\n\
    \n+   - USB controller The Pi is theoretically capable of 480MB/s.\nOn earlier\
