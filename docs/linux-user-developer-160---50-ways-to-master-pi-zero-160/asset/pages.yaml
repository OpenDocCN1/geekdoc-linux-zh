    \ for power and SD card\nactivity. The power LED is red and it flashes when there\
    \ is\nSD card activity. The activity\nLED also flashes when\npowering-down to\n\
    when it is disconnected.\n\n+   - SD cards SD cards aren't really...\ndesigned\
    \ for running an operating system.\nHig class SD cards can't necessarily mean\n\
    better performance for small file writes. The\nRaspberry Pi-foundation recommend\
