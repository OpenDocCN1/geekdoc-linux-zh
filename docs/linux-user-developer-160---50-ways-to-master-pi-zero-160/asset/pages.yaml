  md: '# # Get your Pi Zero online


    # ## Using an Ethernet adapter with your Pi Zero


    # # Five terminal tricks


    +   - **Step One: The parts**

    nYou''ll need an adapter to connect the micro-USB port to a full USB port, along
    with a mini-HDMI to adapter and GPIO pins headers here: http://swag.raspberry.org/products/pi-zero.
    You will also need a USB Ethernet adapter that works with Linux (most will work
    out of the box), which can be found on Amazon for around £10.


    # ## Navigate your way around the command line with ease


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_62_0.png)


    +   - **Step Two: Configuration**

    As the Pi Zero uses the Raspberry name and eth0 (if Ethernet card is added, there
    is no configuration required because the USB Ethernet card will take the missing
    link and places it as eth1.


    +   18 Listing open ports

    Lsof stands for Open Files, and you can install it with sudo apt-get install lsof.
    If you run sudo lsof -i you will see a list of all network connections and which
    applications are listening for new connections (for example, SSH).


    +   - **Step Three: Testing it**

    If the activity lights on your USB to Ethernet adapter are idle, then it should
    be working. Use the remote access tips from other sections of the article with
    your Pi Zero!


    +   19 Using wget to download files

    Wget can be used to download files from the Internet from the terminal. This is
    useful if you need to download a zip file containing source code and extract it.


    ```

    wget http://1linuxserver.co/test.zip

    unzip test list

    ```


    # ## 15 Set up a VNC server


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_62_1.png)


    VNC stands for Virtual Network Computing. You can access the Raspberry desktop
    over the network (using only audio and Ethernet connection, which is not supported
    for any other tasks (including video)). Raspberry Pi VNC provides acceptable performance.
    You can install a VNC server with the following commands:


    > The sync command ensures that everything has been flushed to the cache. It can
    be useful to run after updating packages, for example:


    ```

    sudo apt-get update

    sudo apt-get install vncserver

    ```


    There are several free VNC clients available, so search engine will help find
    one out. To set up a VNC server on your Pi, login in SSH and then type vncserver.
    You will be prompted to set a password the first time you run it. You can create
    a screen with the -geometry option, for example -geometry 1020x768. You can then
    connect your VNC session with tigvviewer. To connect to that session on a Linux
    machine, you could use the command: vncviewer 172.16.2.31, substituting for the
    IP address of your Raspberry Pi.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_62_2.png)


    +   20 Using top to monitor load

    Top is an implementation of the original top. It lets you see the CPU and memory
    usage of all processes on your machine. It is useful to see how activity is happening
    on a Raspberry Pi. You can install it with sudo apt-get install top.


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_62_3.png)


    +   21 Reboot from the terminal

    It seems like a trick but not everyone knows that you can reboot your Pi with
    sudo reboot. It works perfectly with sudo reboot. You need to disconnect and reconnect
    the power turning off the Pi, there is no switch out.


    +   22 Using screen

    Screen is available but it is great if you want to run something that lasts a
    long time. You can run it in a screen, disconnect from it and reconnect it later.
    On example, use screen


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_62_4.png)


    ```

    screen -S test to disconnect

    screen -ls to lists

    screen -r test to reconnect

    exit will kill the buffer and therefore end the session.

    ```


    Left Access the Raspberry desktop

    from your computer over

    your local network'
