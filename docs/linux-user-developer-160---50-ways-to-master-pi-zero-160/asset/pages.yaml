  md: "```\n$ npm install chart.js --save\n```\n\nAlso, Chart.js is available from\
    \ CDN: https://cdnjs.com/libraries/Chart.js.\n\n# 02 Create your chart\n\nOnce\
    \ you have the chart, you can start plotting graphs. The first step is to create\
    \ a canvas tag and assign an ID to it. Later, you need to get the element using\
    \ the ID and use it to initialize the Chart class. For example, create a canvas\
    \ with the ID myChart as you like to draw the graph in the HTML file:\n\n```\n\
    <canvas id=\"myChart\" width=\"400\" height=\"400\"></canvas>\n```\n\nThen, in\
    \ JavaScript, get the context of the canvas using the ID and instantiate the Chart\
    \ class in your first step:\n\n```\nvar ctx = document.getElementById(\"myChart\"\
    );\nctx = ctx.getContext(\"2d\");\nvar myChart = new Chart(ctx, polarData);\n\
    ```\n\nThe steps remain the same if you are using jQuery, Here is the syntax that\
    \ changes:\n\n```\nvar ctx = $('#myChart').get(0).getContext(\"2d\");\nvar myChart\
    \ = new Chart(ctx, polarData);\n```\n\nIf you noticed, after creating the Chart\
    \ object, the method AreaPolar is used. This draws a Polar chart with the data\
    \ passed as the argument to method.\n\n# 03 Line charts\n\nOne the most commonly\
    \ used charts, line chart displays data points and connects them on a line. Here\
    \ is an example of a single line to show more data. It can also be used to compare\
    \ sets of data. To draw a line, you can just call the Line method on the Chart\
    \ object.\n\n```\nvar myChart = new Chart(ctx, lineData);\n```\n\nNow, there are\
    \ two arguments for the Line method. This gives you an understanding of how they\
    \ work. The first argument handles the data points, labels and metadata about\
    \ how the graph should look and where the points are plotted. Here is a sample\
    \ dataset:\n\n```\nvar data = {\n  labels: [\"January\", \"February\", \"March\"\
    , \"April\",\n  \"May\", \"June\", \"July\"],\n  datasets: [\n    {\n      label:\
    \ \"My Dataset\",\n      backgroundColor: \"rgba(255,99,132,0.2)\",\n      borderColor:\
    \ \"rgba(255,99,132,1)\",\n      pointBackgroundColor: \"rgba(255,99,132,1)\"\
    ,\n      pointBorderColor: \"#fff\",\n      pointHoverBackgroundColor: \"#fff\"\
    \n    }\n  ]\n};\n```\n\n![](img/df5857e82a6482b0f2db5a2e61e6012c_36_0.png)\n\n\
    Use the global default values and just change the ones you want, as in this example\
    \ of a bezier chart\n\nThe options help you info about other aspects of the graph,\
    \ such as whether the line between the data points should be curved or not. You\
    \ can even set the radius of the point in dots. It is not mandatory to set all\
    \ the values, only the value you would like to change. The rest of the fields\
    \ are taken from global defaults.\n\n```\nvar myChart = new Chart(ctx,lineData,\
    \ {\n  bezier: false\n});\n```\n\nThis creates a chart using all the default options,\
    \ just with the bezier option set false, meaning the connecting data points will\
    \ be straight.\n\n# 04 Bar chart\n\nBar charts are a very popular choice to display\
    \ data points over time or some other parameter. Bars are generally rectangular\
    \ bars with their height corresponding to the data point (if the bar is on the\
    \ x-axis) or their length (if on the y-axis). Vertical bars can be placed side-by-side\
    \ to make comparisons. Here is how you can plot a bar chart in Chart.js:"
