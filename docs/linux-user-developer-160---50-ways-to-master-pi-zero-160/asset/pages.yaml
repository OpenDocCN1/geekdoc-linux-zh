- pgno: 57
  md: '# FAQ


    # FAQ Raspberry Pi Foundation surprised us with an early Christmas present this
    year – a brand new board! Here''s everything you need to know


    Gavin Thomas

    is the Editor of U&D

    Radar. He is an

    experienced technical

    journalist

    source enthusiast

    pass for home-

    grown projects


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_57_0.png)


    What happened to the Raspberry Pi 37?

    Well, calling it Raspberry Pi 3

    would imply it''s more powerful than the

    Raspberry Pi 2. It''s not a really an upgrade

    more of an awesome downgrade.


    If you like this...

    The Pi Zero is

    available from the Raspberry

    Store for just £5. It''s the

    single-board computer

    which contains the

    unexpected power you''ll need.


    So does that mean?

    That Raspberry Pi 2 isn''t as powerful

    as the original with few bits and

    pieces like the USB 2.0 and Ethernet

    ports have been removed. The whole

    point of it is to make computing

    humanly possible and by

    selling it for £5, the Raspberry Pi

    Foundation has definitely succeeded!


    Further reading

    You can get the Raspberry Pi

    Zero from the Raspberry Store

    for £5, the Raspberry Pi 2

    for £35 from Adafruit

    for Labs.


    $57 is awesome. But it''s not as

    good as other Raspberry Pi models?

    Because the Raspberry Pi Zero is on the same

    level as the Raspberry Pi Model

    B – it uses the same processor, rather

    than the newer BCM2835, that''s used


    in the Pi 2, however, processor

    has overclocked and the Pi Zero

    actually runs 40 per faster

    an the original Raspberry Pi.


    That''s cool. Does it have the RAM

    as the original Raspberry Pi as well?

    It got 512MB of RAM – the first

    Raspberry Pi had 256MB, with later versions

    the board were upgraded to 512MB.


    So can I plug in a keyboard and

    mouse at the same time?

    You''ll need two things for that:

    micro-USB to USB adapter and a then

    USB hub. Plug the adapter into

    micro-USB port and the USB

    hub, then plug things like your

    keyboard and mouse into the hub.


    What about the Ethernet cable – is

    there anything to replace that?

    No – if you use the micro-USB

    to USB adapter, you can just use

    your regular Wi-Fi to get online.


    But if I don''t have a USB hub

    then I won''t have room for a keyboard

    and mouse as well, right?

    You''re absolutely right. Don''t forget,

    though, if your Pi Zero has a Wi-Fi


    So is it super-cheap, better version

    of the original Raspberry Pi?

    Not quite. We used a couple of\changes made in order to

    bring the cost down. The 40-pin

    GPIO header on the Pi 2 and B is still

    there, for example, but it''s unexpected.


    And are there no USB ports?

    Not the full-size ones that you''re used to,

    but there are two micro-USB ports..


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_57_1.png)'
