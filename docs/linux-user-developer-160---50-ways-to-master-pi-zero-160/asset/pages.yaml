  md: '# Review Chrome browsers


    # In brief: compare and contrast the verdicts


    | | Google Web Store | Chrome | Opera | Vivaldi |

    |---|---|---|---|---|

    | Extensions | Google''s Web Store is the largest and the greatest catalogue of
    browser extensions | Most Google Chrome extensions will work, but there are some
    minor exceptions | Opera has its own official catalogue, plus tons of compatible
    Chrome extensions | There''s no store, but manually converted Chrome extensions
    might be very good |

    | User experience | Nothing feels fresh or special here, but everything works
    quickly and reliably | Get ready to do some tweaks if you want it to look just
    right | Sadly, Opera works without charm and its various flavours, but it shows
    promise | Vivaldi has a smart and polished feel, including many improvements |

    | Multimedia support | Chrome is already well-equipped for the modern world |
    Due to licensing, Chrome has limited support for online media | Opera is another
    browser that supports all the codecs, which it is | Multimedia support was weak
    but Vivaldi is now much better |

    | Extra features | The power of web apps, plus everything with Chrome | Shares
    many extra with Chrome, but some things don''t work | Opera has Turbo, its own
    service and lots of good stuff to show off | We have noted that it handles a bit
    more of some extra features |

    | Overall | We''ve got nothing to complain about here—a fantastic browser | Feels
    like Chrome, a bit limited but in many ways to make it better | A strong rival
    of Chrome with its power, probably one to keep an eye on | Vivaldi still shows
    promise |


    ![](img/df5857e82a6482b0f2db5a2e61e6012c_85_0.png)


    # AND THE WINNER IS...


    # Google Chrome


    You may have noticed that we skipped the performance test on this one, so you
    may be left wondering how the browsers feel in real worlds. Surely it would have
    made more sense, if we used Firefox or any other non-Chrome browser in this test.
    But it turns out that three of our four contenders are based on Chromium 45.2.2490.80
    and Vivaldi is based on later Chromium (45.2645.99). We ran all tests, both synthetic
    and real world, including Chrome 2.0 (for JavaScript) and Speedometer 1.0 (for
    web apps). All four browsers performed similarly, with differences being between
    1- and 3 percent apart. It will feel snappy and robust.


    The standout of this group test is Google Chrome, which is stable and armed with
    the best support for media formats and codcs, a great streaming channel and an
    11.4kHz-encoded video.


    Opera was thoroughly tested only as a .amd64 package, meaning that the responsiveness
    and other Linux features will likely cause issues. On the other hand, there''s
    nothing to complain about, and


    > It''s not just a browser, but a mini-version of featured Chrome


    Opera can save money on pre-paid web thanks to its early Turbo. Chrome remains
    the third place, because it takes some effort to set things up and there is no
    actual guarantee that all the goodies on the Google Web Store will behave themselves
    and work.


    Vivaldi is a promising project, which has already showcased an astonishing speed
    of development and lots of fixed UI paper cuts. It is deserved marked as ''beta''
    because many features are yet to come, including many major things like cloud
    sync.


    Alexander Tukey


