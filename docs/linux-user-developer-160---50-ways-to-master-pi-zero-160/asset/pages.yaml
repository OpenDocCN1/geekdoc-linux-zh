    # # BEST UBUNTU OPTIMISATIONS


    # ### PRELOAD


    Preload is a daemon that monitors the applications you use. It learns the libraries
    and binaries it uses and loads them into memory so the applications start faster.
    If you open Firefox after starting your computer, preload will automatically load
    its files into memory when you start them. To install it, install the preload
    package via apt-get.


    # ### APT AUTO-CACHE


    Ubuntu uses apt to manage packages and its dependencies. It maintains its cache
    at /var/cache/apt/ and with time, this cache can get cluttered with unnecessary
    information about old packages. The apt list in /etc/apt/lists also needs to be
    cleaned. To clean them, run apt-get clean. Depending on your usage, you might
    need free a significant amount of disk space.


    # ### CHANGE SWAPPINESS VALUE


    Swapping controls the kernel''s tendency to swap physical and virtual memory.
    Acceptable values are 0-100. The kernel avoids swapping for as long as possible
    and 100 allows everything. Ubuntu''s swappiness is 60. If you want to change the
    value, use the command: vm.swappiness=10. To save the value between reboots, edit
    /etc/sysctl.conf and add the line vm.swappiness=10 if it doesn''t already exist.


    # ### REDUCE OVER-HEATING


