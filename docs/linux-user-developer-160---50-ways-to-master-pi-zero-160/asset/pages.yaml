    executed as well as each function of it is called. Profilers are helpful for smaller
    programs, but their true power is in large programs where no other tool can be
    as effective. The default Linux profiler is gprof, which is going to be used here.
    The provided profile.me output can be used to delete costly code that never gets
    executed. Additionally, the gprof function calculates the number of Fibonacci
