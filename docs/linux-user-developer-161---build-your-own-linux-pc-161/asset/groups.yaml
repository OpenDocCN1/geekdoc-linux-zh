    \ Linux 调度器的工作。换句话说，当你知道进程状态将发生改变或当进程将进入运行状态时……\n\n# `system()` 调用\n\n`atexit()`\
    \ 系统调用允许你注册一个在正常终止时调用的函数。函数的注册顺序与它们的注册顺序相反。问题在于，没有传递任何参数。一个函数可以被注册多次，每次注册时都会被调用。此外，程序必须按顺序使用\
    \ `return()` 或 `exit()` 系统调用结束，才能调用 `atexit` 注册的函数。这本质上意味着如果程序被信号正常杀死，那么注册的函数将完全不会被调用。请密切关注这一点：使用\
    \ `atexit()` 的 C 程序及其输出是否正常。`atexit()` 函数成功时返回 0，否则返回 -1。如果你想取消注册一个已注册的函数，它就会取消注册。当函数退出时，它会被最后调用，类似于栈数据结构。\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n```\n\n```c\nvoid function_one()\
