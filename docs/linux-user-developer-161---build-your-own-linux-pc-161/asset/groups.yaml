    ## 特专题 构建你自己的 Linux 电脑


    ## Skyline 内核


    他们经常使用的软件。尝试使用 `apt-get install em`，但没多久你就会遇到找不到文件的错误：是时候扩展视野了。如果你不习惯使用任何一种行编辑器向
    `/etc/apt/lists` 添加存储库，你可以直接通过向控制台输入单行来完成此工作。


    如果你遵循了本专题页面上的构建步骤，你需要一个 Linux 4 之后的内核，不建议从 ubuntu 更改内核。相反，请使用 `sudo dpkg` 安装来自
    `ppa:kernel-mainline/v4.y` 的 `amlinux-headers-generic-linux` 以及其他包；然后重启系统完成。


    ![](img/a54b3b473771472dd2321ddda1014be1_25_0.png)


    ```bash

    echo "" | sudo add-apt-repository ppa:ubuntu/ubuntu-multiverse

    sudo apt-get update

    sudo apt-get install

    ```


    你在文件末尾添加文本的 `>>` 可能会覆盖现有内容。别忘记退出并离开。你可以使用 `apt`、`apt-get` 或 `synaptic`（一个友好的 GUI
    包管理器）来运行。


    在 Synaptic GUI 之上操作会更容易，它能为你提供信息列表以便 ISO 安装到你的 USB：选择左侧的 Skyline 内核。完成后，去烤一片吐司，因为在
    ISO 完成之前你会有这段时间。用你最喜欢的虚拟机测试它：QEMU。


    从 UCK 2.4 开始，可以在没有任何 CD 镜像的情况下更新 iso。由于我们自定义硬件构建中的 Skyline 处理器，尝试来自 Ubuntu 内核的内核会产生一些问题。如果你的时间比获得
    Wii 4.2 内核带来的任何满足感更有价值——即等待 Ubuntu 16.04 的测试版——那么在更新你的内核 ubuntu 之后


    ```bash

    wodim -system=x86-64 -boot -d /dev/sd* /tmp/remaster-files/iso -n 52

    ```


    现在你只需要创建一个 USB 驱动盘或 DVD —— 下一节你就可以像复制某种灰烬一样复制你的数字家了——


    ## 刻录 DVD 或 USB 闪盘


    你已经按照你的意愿设置好了发行版，现在将其刻录到 DVD 或制作一个用于安装的可启动闪盘


    ![](img/a54b3b473771472dd2321ddda1014be1_25_1.png)


    将你创建的 iso（从任何地方）传输到 USB 或闪盘并不是一个简单的拖放过程 —— 那只会将 ISO 设备作为存储文件放置。要制作一个可启动的闪盘，你需要使用一个特殊的命令，`dd`
    命令，


    ```bash

    wodim -ao speed=2 -dev=/dev/sr0/ -d live.iso

    ```


    如果你想用命令行创建它，请使用 `dd` 命令，它非常老旧且具有这种语法。你将使用以下行之一：


    该程序，从屏幕上选择 iso 文件和目标。你有安装到分区空间或擦除磁盘的选项。驱动器启动后 Ubuntu 将弹出一个对话框。如果你不喜欢内置方式，请使用


    ```bash

    dd if=yourfile.iso of=/dev/sdX

    ```


    但在第一次 `dd` 设置中，Ubuntu 不会挂载你，从文件管理器或终端将显示名称 —— 如果你想这样做，最好输入它，你将获得所需信息。带有 `sudo`
    ！！


    ## 命令行


    在 Ubuntu 上，`wodim` 是 `dd` 命令的继任者（更多详情查看手册）。检查驱动器的位置：使用 `wodim`，或 `ls -l/dev/`
