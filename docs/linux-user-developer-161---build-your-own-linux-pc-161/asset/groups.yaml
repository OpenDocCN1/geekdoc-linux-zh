    ## FUZE BASE


    ### Draw the lasers (lines 29-40)


    DEF drawers has, but actually a lot of repetition is not as tough as it is. The
    first works out, whether we are using a standard or particle laser, the logic
    of each individual [is the same]. We perform [them] using the same colour. Notice
    that, when working on the particle, there are two (left and right) to deal with.


    Following that, we check if any of the enemies comes into contact with this laser.
    This is done by making BOOM! The laser expands and contracts to match each of
    them - if hit, the enemies are reduced by one and a sound is added and sound effects
    are being played on laser layer.


    ### Draw the enemies (lines 41-50)


    Now for example, DEF drawEnemies. Any enemy will be generated, using the FOR loop
    which is fast enough to move that, and then it is drawn. Then we check if it comes
    into contact with the laser and, if so, the player''s lasers are reduced by one
    and we''re not out of luck if we warp the left off the screen.


    ### Draw the player (lines 51-60)


    Currently, the variable is used to store the CUR ID and it can be moved using
    x = x + player during each draw calculation. The unit is the distance from the
    center of the screen. The player is then drawn using aPlot.


    ```

    DEF drawPlayer

    COL = yellow

    x = cos((playerAngle + 90) * playerRadius)

    s = sin((playerAngle + 90) * playerRadius)

    height = 0

    Plotstart

    Plot( (x + s * 5, y + s * 5), playerX, 5)

    Plot( (x - s * 5, y + s * 5), playerX, 5)

    Plot( (x - s * 5, y - s * 5), playerX, 5)

    Plot( (x - s * 2, y - s * 2), playerX, 2)

    Plot( (x + s * 2, y - s * 2), playerX, 2)

    Plot( (x - s * 5, y - s * 5), playerX, 5)

    Plot( (x + s * 5, y - s * 5), playerX, 5)

    Plot( (x + s * 5, y + s * 5), playerX, 5)

    Plot( (x - s * 7, y + s * 7), playerX, 7)

    Plot( (x + s * 7, y + s * 7), playerX, 7)

    Plotend

    ENDPROC

    ```


    ### 20 Check progress (lines 52-58)


    Now we check to see how we''ve got the checkProgress. Every time we kill an enemy,
    the progress variable is increased, and if we kill then the advance variable which
    warps up to the next level. A score is displayed on screen.


    ```

    DEF checkProgress

    if progress = advance

    playSample(sfx, 7, 0)

    score = score + ((10 * score))

    rou = 1

    level = level + 1

    advance = advance + 1

    enemy = enemy / targetFPS

    ENDPROC

    ```


    ### 21 Update the enemies (lines 59-71)


    Enemies need updating, so we have a very simple updateEnemy. Each piece of enemy
    is updated with its position and in a random color.


    ### 22 Update the score (lines 72-76)


    DEF updateScore is responsible for drawing the current score and level. Would
    it help, yet another for free! This time we update the score time and awarded.
    We also show how the score increases if it is counting up the numbers and not
    just adding a counter like a simple example.


    ### 23 Start the game (lines 77-81)


    The loop is called every time a start is made, from the screen or a warp is initialized.
    All variables are not reset - the circle is defeated, but pretty everything else
    is reset or ready to start.


    Then, after half way, the WHILE (RADIUS) cycle starts in the loop in which the
    game is played and score is lost. The player is reset and we warp off.


    ### 24 Take to the next level


    And there we go! There''s plenty of scope for improvement. We could add more enemies,
    a smart bot, more audio tracks, a jump and proper end with a game over screen
    for example. We have you played with 72PM67 and what we want to make - we would
    like to improve this, so please send us in to LAUR or straight to the FUZE BASE.
    We don''t expect you to keep using BASIC forever, but if you have the programming
    bow and now then you will learn the language and then move on to C++.


    Our experts recommend using C++, it is the most widely-used coding language in
    the world and other languages are from or at least similar. If you can code in
    BASIC you will find it very easy and will be able to adapt to just about any other
    language. Good luck!


    To find out more about FUZE BASE and the FUZE in general please visit www.fuze.co.uk


    ### 19 Display remaining lines (lines 82-90)


    Next procedure, DEF plotLayers helps us to display the number of layers that has
    left at the top-right of the screen. This position is located below the top with
    GHEIGHT and then draws the lines from left to right using Plot commands.


