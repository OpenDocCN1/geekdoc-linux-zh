    # Python


    ## 在你的 Pi 上实现多任务

    # 学习如何为你自己的 Python 代码添加多任务 – 完美处理多个项目


    ![](img/a54b3b473771472dd2321ddda1014be1_61_0.png)


    大多数程序员将单线程编程作为他们的第一个学习模型。其基本思想是计算机指令是顺序处理的，一个接一个地执行。这在很多情况下运行良好，但你也会达到一个点，此时编写多线程应用程序的经典解决方案需要你一些说服。在这些情况下，运行多个线程时会遇到一些问题。在无法利用
    GIL（全局解释器锁）的情况下，在 Python 中使用多进程（multiprocessing）并不是缺点。然而事实确实如此。


