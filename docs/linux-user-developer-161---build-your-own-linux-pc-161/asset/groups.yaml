    现在例如 `DEF drawEnemies`。任何敌人都会使用 `FOR` 循环生成，该循环足够快到可以移动，然后进行绘制。接着我们检查它是否与激光接触，如果是，玩家的激光数量将减一，如果我们把它们移出屏幕外，我们的运气也不会太差。


