    ## Steam Machines 深度测试


    ![](img/a54b3b473771472dd2321ddda1014be1_89_0.png)


    前置 IO：两个 USB 3.0 端口、一个 USB 2.0 端口以及用于耳机的模拟音频接口，让 Syber 连接外设变得非常简单。


    ## 游戏主机 Syber Steam Machine I


    ### 规格

    - 英特尔酷 i5-4700 双核 3.2GHz

    - 4GB DDR3 1866MHz DDR3L

    - Nvidia GeForce GTX 950

    - 250GB 3.5TB SATA-III 硬盘

    - 集成千兆以太网

    - 2.4GHz Wi-Fi

    - 4x USB 3.0, 2x USB 2.0, 2x HDMI, 1x D-x DisplayPort

    - 模拟音频输出

    - 250W SFX 电源

    - Steam 散热器


    针对各种预算设计，入门级的 Syber Steam Machine 是否具备足够的实力？


    CyberPower 是首批宣布 Steam Machines 的公司之一，这并非偶然：它是其中之一，运行主操作系统并处于 Vapor 品牌下。通过快速切换到
    Steam OS 并达成协议，让 Syber Steam Machine 迅速得以上市。


    但这并不意味着在设计上有所妥协；其设计、激进的线条以及容易留指纹的表面处理并不适合所有人。机箱运行几乎无声，且机盖可以轻松拆卸，方便那些喜欢风格的用户访问其内部组件。侧面的装饰线条配合了各种颜色的
    LED 灯带，适应你的设置。遗憾的是，Syber 的底脚几乎没有被遮挡，占据了测评的大部分空间，只剩下一点点长度。


    Syber 设计用于放入电视柜，它很扁平但很宽：紧凑的机箱仅占总面积的四分之一多，电源、显卡和硬盘占据了其余部分。为了保持机器的整体高度比 PC 小，显卡安装在一个灵活的
    PCI 扩展支架上，这导致机身增加了一定的宽度，但这只在运输过程中才需要担心。


    价格：£505

    （范围从 £505 - £629）


    内置 802.11b/g/n Wi-Fi 能力让 Syber 即使处于入门级状态也能运行，仅在 2.4 GHz 频段缺少有线网络。


    ![](img/a54b3b473771472dd2321ddda1014be1_90_0.png)


    颜色切换：通过按下按钮让 LED 在一系列色调之间循环，可以将 Syber 的颜色与你的客厅装饰相协调。


    ![](img/a54b3b473771472dd2321ddda1014be1_90_1.png)


    ![](img/a54b3b473771472dd2321ddda1014be1_90_2.png)


    更大的问题是风扇通过机箱底部的小型通风区域抽风，因此随着时间推移，该区域可能会积灰并导致显卡过热，这意味着机器和通风口的定期清洁应该是任何主的日常维护任务清单上的。


    音频启动后很快消失在背景中。鉴于其入门级地位和 i5 的性能，Syber 的表现令人印象深刻。系统完成 Unity Valley 基准测试时，平均帧率为每秒
    55 帧，在测试前恢复到平均 53 FPS。


    散热：Syber 的外壳包含了良好的通风口，尽管显卡部分需要定期清理。


    ## 总结


    设计旨在吸引玩家的感官，显卡的激进风格适合所有人，除了第一人。

    - USB 3.0 端口和灯光是一个很好的触笔。

    - 游戏性能充足，但购买后对入门机型留有升级空间。


    Syber 带有免费的 Windows 操作系统注册程序，可以连接 Steam 账户或为从未体验过的用户创建新。由于使用了 1TB 机械硬盘而非更快的固态硬盘，进度稍有延迟，机械硬盘以更低的价格提供了存储更多游戏的空间。


    对于追求更高分辨率的用户，建议在当时升级 Syber。你也可以添加 RAM 以增加内存。虽然易于访问的机箱使得理论上可以在购买后升级，但机箱将限制显卡升级的选择。


    在 Syber 中使用内部散热器和风扇组件的决定意味着它在游戏期间会发出可见的嗡嗡声，特别是在 GPU 进入高负载的重度游戏期间。在安静的房间里非常明显，但一旦音频……


    ## 最适合玩家自己> Gareth Alhare


    www.linuxuser.com 91


