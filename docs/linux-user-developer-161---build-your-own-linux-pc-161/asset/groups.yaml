    ## Alienware Steam Machine


    这款设备历时两年打造；戴尔的专用游戏设备是否能配得上竞争对手以及之前的 Alpha 型号？


    ![](img/a54b3b473771472dd2321ddda1014be1_85_1.png)


    首先是——你无法为 Alienware Steam Machine 升级显卡。这会让很多硬件玩家望而却步，但遗憾的是，它们在出厂就被封死了。由于 Alienware
    对 SteamOS 的独特增强方式，我们一直无法对该机器进行改装。不过，从图形角度来看，它的运行相当良好，但随着游戏变得越来越精美，它并不是那种能一直保持竞争力的设备。


    你可以将机器进入桌面模式，但该选项默认是隐藏并禁用的。在万千菜单和窗口中穿行的过程需要好运（依靠那个 Steam 控制器），而且能够浏览互联网是为此设计的——尽管其他主机除了作为可靠的媒体中心外没有其他用途。你还不如固守控制器。


    由于这台机器运行在 Steam OS 上，并放弃了 Windows 用户熟悉的传统的“大屏幕（Big Picture）”Steam 设备，你会发现你的游戏库会受到影响——如果你只使用
    Steam 控制器而不是键盘/鼠标，游戏库会进一步缩减。如果你开箱就能玩游戏，那么你在客厅里就有了一套不错的音频设置，Alienware 机器的初衷是让你产生各种声音，而不是去配置那些……嗯，即插即用就好。


    更新机器很容易——但我们测试过了——这台机器在几年后就会过时，问题在于 PC 无法更换显卡，这将会产生巨大差异。如果要求支持/保修，机器必须恢复到基础配置——这似乎是一个灾难的方法。而且这是一个问题，因为你会发现
    Steam OS 对我们正在运行的很多游戏并不友好。


    隐形且光滑。黑色外壳暗示了 Alienware 的愿求——一个适合客厅且安静运行的盒子。尺寸至关重要。Alienware Steam Machine 非常小，高度仅
    3 英寸，这是一个违背预期的奇迹，比市面上的任何主机都小。与众不同，Alienware 电源按钮和 Steam 标志灯显示为白色，与 SteamOS 内的
    AlienFX 相匹配。


    Alienware Steam Machine 通过一些图形高密集型应用（如《魔环：中洲影》……）处于主机和 PC 之间尴尬的中间地带——帧率下降很大——有时运行重量级游戏简直完全无法进行。我们在高画质下运行大多数游戏，可以在超画质下运行旧作品，但没料到要支付
    100 多英镑购买 Alienware 版本——Steam OS 和 Linux 根本无法胜任。运行基准测试给了我们六十 fps，而 Alienware 报告为
    32.0 fps。质量都更高。还有更贵的 Alienware Alpha 机器（作为 Steam 来说更可行且更适合客厅）。正是这些小事让我们对 PC 预期的积极面以及在家庭中的渗透保持了信心。操作系统确实是一个大问题，但还不至于让它荒谬，或者以牺牲相当长的使用寿命为代价。由于游戏出版商最初只提供
    Windows 版本的标题，我们能够访问大量的 OpenGL 资源库是合理的……但这让 Steam 以第三档及以上的价格发布这个盒子就显得很奇怪，这这让我们接触到更多游戏。Alienware
    Steam Machine 似乎并没有达到你对主机音频以及访问现代游戏的预期。这台来自 Alienware 的第一台 Steam Machine 是一个概念，它只需要完善那个概念，那个概念就是
    Steam Machine 2.0。


    ## 总结

    Alienware Steam 处于一个尴尬的中间地带，缺乏主机的多样性或动力。它感觉像是一个完美的基于主机的游戏小设备——而且在功能和防止升级方面，它比任何东西都便宜。


