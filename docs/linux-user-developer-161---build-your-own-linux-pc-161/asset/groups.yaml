    # 3D 打印机器人

    # 创新移动者


    从用于转向动力的铅笔到橡皮筋轮胎，创意无无边界。


    ## 一个适合攻克 Pi 硬件挑战的好日子


    许多团队都探索了移动方式，Niklas Henderson 用一个分段机器人给我们留下了深刻印象，该机器人旨在通过中心枢纽来实现精细控制。Niklas 告诉我们，这是我们第一次在机器人领域的尝试。


    “我们用了一个树莓派 2 并在中间放了一根铅笔，这让它能够弯曲，并为机器人提供转向。我们本希望它能弯曲得更一点，但弯曲程度有些限制——这是一个我们没有预料到的设计……想象一下它有三个部分——这意味着中间部分可以向右侧弯曲，让它能够绕圈行驶。像蛇一样！”


    上述 3D 打印机器人枪上配有红外发射器，让玩家能够向对手的红外接收器发射。


    ## Red Robotics


    机器人激光射击！你在红外线上有红外激光，想法是你驾驶、移动——你拥有动作的第一人称视角，它的工作方式就像第一人称射击游戏一样。所有的控制都是 WASD——想法是你绕过去，然后可以射击这边的坦克（靠近）。它四周布满了传感器，所以你可以从任何方向进行射击。你有三条命——被射中三次，你的坦克就会爆炸。或者它可能只是抖动一下然后停止。Red
    Robotics.uk 的核心理念是你可以自己制作。这里所有的零件都是开源且可下载的，所有零件都是激光切割或 3D 打印的，完全可以用一个学校项目来完成。我不想在套件上花钱，所以这个设计被认为易于制作——下载文件，


    ![](img/a54b3b473771472dd2321ddda1014be1_58_1.png)


    上述橡皮筋被用于为 K.E.I.T. Evolution 的履带提供牵力。


    ## Muhammad Subratty


    我从 7 月开始开始的。所有的 MDF 部分（激光切割）都是 3D 打印的。我们在 SpaceClaim 中使用的并 3D 打印的所有东西都是用 Makerbot
    或 Overland。在这里我设计了自己的悬挂系统。实际电机支架是用 ABS 制的而不是 MDF，ABS 更坚固一些。我们有两个 H 桥——目前它们可以承受高达
    43kg，所以非常结实。


    “我有两个 500 mAh 的电池包，输出电压为 7.2 V，但电机需要很大的动力，所以这是我目前使用的设备。”


    ## K.E.I.T.H. Evolution


    我们使用的第一个树莓派是一个名为 K.E.I.T.H.（Kinetic Interaction Hardware Tracked，动力交互硬件履带）的坦克机器人，它几乎面临每一个挑战。这是我们团队第一次制作
    Mark IV 类坦克机器人。对于 CAD 设计的激光切割底盘以及绕在履带上的圈圈橡皮筋，Merlin 的 K.E.I.T.H. 是当天最困难的挑战之一。我们在循线方面表现得非常出色。当他们告诉我们‘这有点让人意外，因为我们连续直行了五圈没有出现任何问题，这简直是个奇迹！而且我们还拿得了第一轮树莓派，所以我们非常高兴！’


    www.linuxuser.com


    # 特写

    ## 运动中的诗意


    Tom Oinn 对移动的处理赋予了 Triangula 无与伦比的移动性。


    “（Triangula 上的）轮子是 BaseBot，”Tom 解释道，“它们在这种情况下是由其他相对于主运动成 90 度的滚轮组成的。所以你可以像正常一样驱动轮子，但它也可以在
    90 度向量上滑动。因此，你可以将任何方向视为另外两个向量之和，你可以将任何方向看作轮子行驶的主向量加上若干量的垂直分量的组合，这可以”


    “所以我们想使用这样的转向动力学，这使得我们在中心点平移和旋转方面的整体运动。从这里，我们为每个运动求解出二维速度向量。对于每一个向量，轮子将指向你转向时前进的方向。当我们驱动电机时，最终得到了一个可以轻松平移旋转起始点的控制系统。”


    “这个项目在 GitHub 上——用户 BaseBot(github.com/BaseBot)，这是我之前的项目。还有一个视频包含了用于 Arduino 的
    Python 代码，以及一些文档——我自己写了一个 Python 库来处理 PlayStation 控制器。”


    ![](img/a54b3b473771472dd2321ddda1014be1_59_0.png)


    上述橡皮筋被用于 K.E.I.T. Evolution 履带。


