    # Tutorial


    # BCM


    GPIO pins are physical interface between the Pi and other devices. At the simplest
    level, you can use them as switches to turn on or off. You can also program the
    pins to turn them on or off. The BCM numbering option means that you refer to
    the pins by the ''Broadcom channel'' number, instead of the pins by the physical
    numbers printed on the board.


    # 06 Another test


    Now it is time to adjust your camera to turn on the LISAPI and capture a frame
    in the dark. First, import the GPIO module (line 1); import RPi.GPIO as GPIO.
    Set the GPIO numbering system to BCM, with GPIO.setmode(GPIO.BCM). Then, set the
    pin 18 to output (line 5): GPIO.setup(18, GPIO.OUT). After the picture is taken,
    turn it off.


    ```

    import RPi.GPIO as GPIO

    GPIO.setmode(GPIO.BCM)

    GPIO.setup(18, GPIO.OUT)

    GPIO.output(18, GPIO.HIGH)

    import picamera

    camera = picamera.Camera()

    camera.start_preview()

    camera.capture(''nature.jpg'')

    camera.stop_preview()

    ```


    # 09 Testing the PIR


    Now that the PIR is connected, test that it is working correctly and adjust the
    settings to ensure it triggers correctly. Use your Python editor, open a new file
    and enter the test code. Important code:


    ```

    GPIO.add_event_detect(PIR, GPIO.RISING, callback=motion_sensing)

    ```


    It is set to detect the rising heat, such as a human body detected by the PIR
    and it triggers the GPIO 7. The Raspberry Pi identifies that heat is rising and
    executes the callback. In this callback, we will print "We see you" in the Python
    console. When the badge moves, there is there''s another change in heat and the
    PIR senses it.


    ```

    import time

    import RPi.GPIO as GPIO

    GPIO.setmode(GPIO.BCM)


    PIR = 7

    GPIO.setup(7, GPIO.IN)


    def print("Ready to find you")

    time.sleep(2)

    ```


    # 07 PIR sensor


    A heat sensor, passive infrared, picks up the heat that is emitted by objects.
    This radiation is invisible to the human eye but is infrared. However, it can
    be detected by electronic devices such as the PIR. The PIR is triggered when heat
    has occurred. The first dial is used to adjust the sensitivity, which will make
    the PIR trigger with more or less of a heat change. The second dial will adjust
    the time between the sensor stopping and resetting, generally set to a range of
    a few seconds.


    # 08 Connecting the PIR


    Time to connect the PIR. To check this working, first remove the LISAPI wires.
    The three wires are: 5V, a ground and the output. Remember to use the BCM numbering
    system, so the number in the code will be the GPIO pin number on the Raspberry
    Pi. The +5V connects to physical pin to connect to 26GPIO and the Ground connects
    to physical pin.


    | PIR 5 | PIR GND | PIR OUT, Pin 26 (GPIO 7) |


    ![](img/a54b3b473771472dd2321ddda1014be1_65_0.png)


    # 10 Saving a new picture


    When the PIR takes a picture using the code in Step 3 it overwrites the existing
    file because both files have the same name. This is not suitable for taking multiple
    pictures over a period of time.


    To ensure the files are not overwritten, we change the filename number each time
    the camera is triggered by a variable value. For example, the first file is Nature.jpg
    Nature2.jpg and so on. This saves each new file with a different name and won''t
    overwrite the existing images.


    ```

    camera.capture(''Nature'' + str(File_Number) + ''.jpg'')

    File_Number = File_Number + 1

    ```


    # 11 Add the time it was taken


    You may be to know the time that the camera was triggered and the picture taken,
    especially if the setup is running over night. To do this, create a new variable
    time_of_capture, at the start of the loop to store the current moment. To retrieve
    the time that the picture was taken use as_ctime(time.localtime(time.time)). This
    will check the time of your Raspberry Pi and save it to the time_of_'
