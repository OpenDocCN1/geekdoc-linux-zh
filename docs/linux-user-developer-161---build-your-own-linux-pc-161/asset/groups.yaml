    # PiBeacon devices


    ![](img/a54b3b473771472dd2321ddda1014be1_68_0.png)


    Once connected, open a terminal and enter `btcit` to confirm the device is detected.
    A suitable Bluetooth-Energy device will be listed as a Bluetooth 4.0 device.


    # 04 Configure for Broadcast


    Once you''re happy with the device, create a new directory for BlueZ (the Linux
    stack), switch to that directory and download BlueZ:


    With the BLE connected and the restarted, enter hiconfig in the command line to
    configure the Bluetooth module. It will usually be listed as being "DOWN". To
    resolve this, input the command. As ever, stay aware of the commands you''re inputting.
    If the line ends with *noscan*, change it to *up* to allow the device to scan
    simultaneously. With this time, the device entered, enter hiconfig once more.
    The device status will be "RUNNING",


    ```

    sudo mkdir bluez

    cd bluez

    sudo wget ..kernel.org/pub/linux/bluetooth/

    bluez-5.11.tar.xz

    ```


    Left Our PiBeacon relies on Bluetooth technology, so you''ll need a dongle


    # 03 Build BlueZ


    Extract the archive and configure the system. The node sudo make will take some
    time to complete, and when done, input `sudo make install`. If the Raspberry Pi
    is unresponsive, just wait.


    # Bluetooth


    Bluetooth Low Energy (BLE) device is the key to success with this project. Old
    USB Bluetooth dongles you don''t have will work. For best results, check the order
    from the version repository.


    Once it is done, you''ll need to restart your Pi with `sudo reboot`. Wait for
    the power light to go on, and then connect the Bluetooth over-USB dongle:


    # 05 Input UUID


    The PiBeacon is now ready. All you need to do is advertise to other (configured)
    devices. This simply allows the phone to attend to the PiBeacon. However the unique
    UUID will be broken up into pairs. Any like portions of the string (everything
    after cm*) are intended to be changed. For instance, manufacturer-specific data
    is displayed in this case 00, which is Apple''s ID. The UUID shown here is for
    your own Pi, but it is intended for a particular application - specifically.


    ```

    sudo unxz bluez-5.11.tar.xz

    sudo xvf bluez-5.11.tar.xz

    cd bluez-5.11/

    sudo ./configure --disable-system


    sudo make install

    ```


    Additionally, check the version repository to review the UUID (alternatively named
    versionUUID).


    ```

    sudo hiconfig hci0

    sudo hiconfig leadv 3

    sudo hiconfig hcichan

    ```


    ```

    sudo hiconfig -uuid 0E 01 1A 4F 4C 02 15 02 0E 09 34 7F 73 F5 04 C4 A2F 17 01
    07 13 6A 2F 17 01 07 09 01 00 00 00 00 00 00 00 08

    ```


    Here''s how to use a unique identifier that can be broken down into meaningful
    changes


    | iBeacon prefix. Manufacturer | TX Power |

    |---|---|---|

    | data begins after FF | | Minor |


