    re-worked, and new challenges were introduced: Pi Noon and Skittles. We interviewed
    Tim Richardson to find out more about how the robots and their owners through
    their paces...


    # TIM RICHARDSON


    PI WARS ORGANISER


    Creator of CamJam''s EduKit packs, Tim Richardson this year''s Pi Wars event alongside
    Michael Horne


    ![](img/a54b3b473771472dd2321ddda1014be1_56_0.png)


    # When did you start organising Pi Wars?


    The original one started around September of last year, but this one we started
    earlier. We started thinking about it while we were building around July. It''s
    been a long process of planning before it happened.


    # What''s your favourite robot so?


    There are some absolutely beautiful robots, but particularly Triangula. It''s
    just the three-wheeled robot and can go in any direction—it''s beautifully engineered.


    # Did you enjoy each challenge?


    It''s been hectic out! I''ve spent a lot of time recently creating the EduKit
    3, which is the robotics kit. I wrote the worksheets and designed the challenges
    and wrote all the worksheets for the kids - I used my own information about electronics
    before I started, so I was teaching myself to do that. I''m getting them all out
    because everything is awesome, and I''m trying to get affordable kits for people
    to explain examples. An example is the robot that shows you how programming works,
    even without like competitions, but she has built an EduKit 3 robot into it. It''s
    absolutely gorgeous!


    # So, what about the new challenges for this year?


    Pi Noon is a replacement for the duel. There was a Pi-Pi duel originally, the
    sumo wrestling: there was one robot to push the other one out, and another. We
    wanted to do something different where robot didn''t have an advantage, and this
    seemed like it was likely to be "size doesn''t matter".


    # What do you think of the robots built for the Skittles event?


    We expected people to push that robot - that''s all we thought then but we have
    people being able to knock that ball. We had to put cardboard boxes around it,
    just to stop them from smashing the windows! We really didn''t expect the engineering
    that they have come up with.


    # Any plans for the next year?


    We have some things in place that we can''t explain yet. It''s going to be another
    exciting year. We have another Pi Wars but it might not be next year - we haven''t
    decided yet. We''re just taking one event at a time.


    ![](img/a54b3b473771472dd2321ddda1014be1_56_1.png)


    Some competitors built special firing apparatus into the fronts of their robots
    for the skittles challenge


    www.luxuker.com 57


    # Feature


    # HITCHIN HACKBACKSPACE


    # HIGH-POWERED SHENANIGANS


    Meet Alexander Palfer-Brown, founder of Hitchin and designated Remap (remap.org.uk),
    who are a charity customise technology for people who have disabilities. We''ve
    been working with them to scroll through the pages, we added voice control.


    "First rolling the scene at the Raspberry Pi Birthday Weekend at the end of February
    2015, the robot once again appeared at Pi Wars and is well received as an event,"
    said Alexander. "One thing we worked on is a four-wheel drive with Raspberry Pi
    touch-screen."


    # PRECISION PROXITY SENSOR


    Not for half-measures, Hitchin Hackspace worked on a special robot for the proximity
    sensor test. The goal is to get robot to stop as close to the destination wall
    - without touching it.


    "The infrared distance sensor shows us roughly where we''re going and it helps
    us find from the wall we are," explained team member Rob Bevan. "But it''s not
    very accurate, millimetre-accurate, and we want better than that. Once it''s about
    10cm away, then our sensitive sensor picks up the air pressure. Effectively, we''re
    blowing out of a straw and measuring the pressure in the straw. When the claw
    gets close to the wall - really then the air pressure goes up and the chasis is
    all CAD and 3D-printed, so it''s 3D-printed stuff, laser-cut stuff, custom stuff...
    We have taken this a little too seriously!"


    # So, tell us about Hitchin Hackspace!


    We meet once a week at the Pavilion at ground in Hitchin, which is off North Road.
    We made a website for Hitchin Hackspace and just have all our information here.


    # Can anyone drop in to the hackspace?


    Yeah, we''re very welcome to anyone who wants to come and see what we are about,
    and if they want to get involved they can. If they have a problem that need a
    solution to, we can do that.


    ![](img/a54b3b473771472dd2321ddda1014be1_57_0.png)


    ![](img/a54b3b473771472dd2321ddda1014be1_57_1.png)


    Above Hitchin Hackspace hard at work on their precision proximity sensor

    Top find out how the team built the Bagh at hack.hitchin.org.uk/bagh-2


