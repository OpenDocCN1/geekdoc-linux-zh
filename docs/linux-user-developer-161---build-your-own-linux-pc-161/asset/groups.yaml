    Fast as a genius! Impressive and responsive make up for others


    Like Audacity, but not decentering. No multi-track feature but a decent playground


    Great for recording through long files keeping the simplest of edits


    # AND THE WINNER IS...


    # Audacity


    If we used a time machine and travel back de, the results could be quite different:
    Audacity was not mature at the time, while others of this test group were actively
    maintained and enjoyed bug fixes. But of 2016, only Audacity and KWave were alive
