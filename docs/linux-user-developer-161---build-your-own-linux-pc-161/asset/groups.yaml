    # 编译器


    ## Free Pascal Compiler 3.0.0


    适用于这种易用语言的快速跨平台编译器


    Free Pascal Compiler - FPC - 是一个既适用于 Object Pascal 方言（Free Pascal）也适用于其他 Delphi
    方言的编译器。FPC 能够将代码编译到许多平台和处理器，而无需更改源代码。对于跨平台 Pascal，使用 Free Pascal 构建的 IDE 也能运行得非常完美。某些发行版已经提供了二进制文件，在我们测试时
    FPC 尚未进入 Ubuntu PPA，但通过将 Debian 实验性源（experimental）添加到我们的 /etc/sources.list 并使用以下命令安装：


    ```bash

    $ apt-get install -t experimental fpc

    ```


    对于其他发行版，下载网站提供了完整的软件包和安装脚本。FPC 的性能惊人地超出了我们的需求（你的电脑性能绰绰有余），它支持汇编语言，并且支持在以前完全无法运行的树莓派。


    Free Pascal 是一种面向对象的语言，并支持 PostgreSQL 和 MySQL——它已经远远超越了 70 年代的教学语言。其文档是完善的，如果你从未用过
    Pascal，可以快速查看其中一个教程，然后去 pascaldevelopment.com 获取一个游戏的源码。


    ### 优点

    - 极速的 IDE，包含许多方言，集成了汇编语言并支持数据库


    ### 缺点

    - 可加入的 Pascal 项目不多，但希望在不久的将来发生变化


    ### 适合...

    - 语言学习者以及想要复习 freeppascal.org 的人员


    # 游戏


    ## Hedgewars 0.9.22


    动作、策略与暴力刺猬


    以带有姿态的“粉色刺猬”为主角，从地狱深处到太空边缘进行战斗。这是一款策略游戏。显然，所有战争（目标是摧毁所有敌人）与火箭筒刺猬的结合创造了超现实的杀戮，其开发深度会让你在探索无尽的关卡时花费大量时间。


    通过包管理器安装非常简单。Hedgewars 已经存在很久了，大多数发行版都包含了它，新版本发布频繁。你的首要任务是阅读 Hedgewars wiki 上的手册，然后开始训练任务。精通节点、降伞和沙漠敌人的技巧，并可以在本地、网络或实战行动中与人对战。我们使用了
    22 种武器和大量地图，以及无限数量随机生成的地图。主游戏的自定义包括“280 种服装、32 款游戏、143 种字体和独特的语音包”，以及社区交流和创建自己作品的可能性。


    ![](img/a54b3b473771472dd2321ddda1014be1_92_0.png)


    Hedgewars 下方是一个可玩的 2D 回制炮兵游戏。


    ### 优点

    - 带着武器和工具的刺猬！经典《刺猬大战》（Worms）系列粉丝的必备之选


    ### 缺点

    - 这种感觉很费时间！画面现在开始变得有些过时了，


    ### 适合...

    - 因为你想玩 Free Pascal 而玩游戏的人！hedgewars.org


