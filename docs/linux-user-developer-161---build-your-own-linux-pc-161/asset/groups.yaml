    # 特写


    ![](img/a54b3b473771472dd2321ddda1014be1_55_0.png)


    # 树莓派大战回归


    创意与机器人，在今年于剑桥（树莓派的所在地）举办的树莓派大战上，融合成了一场精彩的才华展示。以下是我们的活动亮点。


    ![](img/a54b3b473771472dd2321ddda1014be1_55_1.png)


    56


    # 什么是树莓派大战？


    树莓派大战于去年首次举办，是 2014 年 12 月 6 日作为剑桥树莓派参赛赛的一部分举行的。活动中，参赛者们通过将其由树莓派驱动的机器人投入挑战赢得了丰厚奖品：障碍赛、循迹挑战、三点转弯，以及机器人需要将对手推出圈外的相量赛。


    一年后，树莓派大战凭借升级的机器人和比赛华丽地回归。从初次创作者到资深专家，每个人都参与其中。这是一次让我们永远忘记的活动。循迹挑战和障碍赛经过了重大改进，并引入了新挑战：树莓派中午（Pi
    Noon）和保龄球（Skittles）。我们采访了 Tim Richardson，以了解更多机器人及其主人如何接受考验的……


    # TIM RICHARDSON


    树莓派大战组织者


    CamJam EduKit 套件的创始人 Tim Richardson 今年与 Michael Horne 一起组织了今年的树莓派大战活动。


    ![](img/a54b3b473771472dd2321ddda1014be1_56_0.png)


    # 你是从什么时候开始组织树莓派大战的？


    第一场是在去年 9 月左右开始的，但这一场我们开始得更早。我们在 7 月构建东西时就开始考虑了。在活动之前，这是一个漫长的规划过程。


    # 到目前为止你最喜欢的机器人是什么？


    有些机器人绝对非常漂亮，但 Triangula 特别出色。它就是一个三轮机器人，可以朝任何方向移动——它的工程设计非常精妙。


    # 你喜欢每一项挑战吗？


    最近非常忙碌！我最近花了大量时间制作 EduKit 3，那是一个机器人套件。我编写了工作单，设计了挑战并为孩子们编写了所有的工作单——在开始之前我使用了自己关于电子学的知识，所以我是在自学怎么做。我把它们都做出来是因为一切都太棒了，我正尝试为人们提供负担得起的套件来解释示例。例如，有一个向你展示编程是如何工作的机器人，即使没有比赛，但她已经在里面内置了一个
    EduKit 3 机器人。它太美了！


    # 那么，今年的新挑战怎么样？


    “树莓派中午”是决斗的替代方案。最初有一个树莓派对树莓派的决斗，即相量：一个机器人将另一个推出去，另一个是另一个。我们想做一些不同的东西，让机器人没有优势，这似乎很可能体现“大小并不重要”。


    # 你认为为保龄球活动构建的机器人如何？


    我们预料人们会推那个球，我们在我们在机器人周围放了纸箱，只是为了让它们撞窗户——我们真的没预料到。


    # 明年还有什么计划吗？


    我们有了一些计划，明年可能还会很精彩。我们会有下一次树莓派大战，但还没决定。我们只是一个接一个地进行。


    ![](img/a54b3b473771472dd2321ddda1014be1_56_1.png)


    一些参赛者在他们的机器人上安装了保龄球发射装置


    www.luxer.com 57


    # 特写


    # HITCHIN BACKSPACE


    # 高科技活动


    认识 Alexander Palfer-Brown，他是 Hitchin 和 Remap (remap.org.uk) 的创始人，他们是一家为残障人士提供技术的慈善机构。我们一直在与他们合作滚动页面，添加了语音控制。


    “在 2015 年 2 月底的树莓派生日周末，机器人再次出现在树莓派大战并广受好评，”Alexander 说，“我们正在开发一个带树莓派触摸屏的……”


    # 精密距离传感器


    为了传感器测试，Hitchin Hackspace 开发了一台特殊的机器人。目标是让机器人尽可能靠近目标墙——而不接触它。


    “红外距离传感器告诉我们大致的位置，帮助我们找到墙，”团队成员 Rob Bevan 解释道，“但它并不精确，达不到毫米级，我们想要更好。当距离大约 10 厘米时，我们的敏感传感器就能捕捉到空气压力。实际上，我们是从吸管里吹气并测量管内的压力。当爪子靠近墙时——那时气压力就会上升，底盘全是
    CAD 设计和 3D 打印的，所以是打印的东西、激光切割的东西……我们把这件事看得有点太认真了！”


    # 那么，给我们介绍一下 Hitchin Hackspace 吧！


    我们每周在 Hitchin 北路附近的 Pavilion 聚会。我们为 Hitchin Hackspace 制作了一个网站，所有的信息都在那里。


    # 任何人都可以进入这个黑客空间吗？


    是的，我们非常欢迎任何想来看看我们在做什么的人，如果他们想参与，完全可以。如果他们有需要解决的问题，我们可以帮忙。


