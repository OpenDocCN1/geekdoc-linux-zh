    # COMPILER


    ## Free Pascal Compiler 3.0.0


    Speedy cross-platform compiler for the user-friendly language


    Free Pascal Compiler - FPC - a compiler both for the Object Pascal dialect, Free
    Pascal, and for other Delphi dialects. FPC compiles to many platforms and processors,
    with no change to the source code. For cross-platform Pascal as well, the IDE
    - built with Free Pascal - works perfectly. Binaries are available for some distributions
    already, FPC hadn''t reached the Ubuntu PPA when we tested, but by adding Debian
    experimental to our /etc/sources.list and installing with:


    ```bash

    $ apt-get install -t experimental fpc

    ```


    For other distros, a complete package and install script is on the download site.
    FPC has astonishing met our demands (your PC has more than enough power) with
    assembler and supports Raspberry Pi without anyone can run at all, even if you
    have a much more powerful build.


    Free Pascal is an object-oriented language, with PostgreSQL and MySQL -it''s growing
    all beyond the teaching language of the Seventies. The documentation is, and if
    you''ve never used Pascal a quick look at one of the tutorials, then grab the
    score for one of the games at pascaldevelopment.com.


    ### Pros

    - Blazing IDE that includes many dialects, integrates with assembler and supports
    databases


    ### Cons

    - Not many Pascal projects to join, but hopefully that will change in the near
    future


    ### Great for...

    - Language learners and those who want to review freeppascal.org


    # GAMING


    ## Hedgewars 0.9.22


    Action, strategy and violent hedgeogs


    Featuring "pink hedgeogs", with attitude battle the depths of hell to the depths
    of space. This is a strategy game. Obviously, the combination of all war (the
    aim is to destroy all enemies) and hedgeogs with bazookas makes for surreal carnage,
    with the level of development thought to you losing a lot of time spent exploring
    endless.


    Installation is easy through the package manager. Hedgewars has been around for
    a long time, and is packed for most distributions, with new releases quite regularly
    appearing. Your first task is to read the manual on the Hedgewars wiki, then start
    the training missions. Get proficient in the art of nodes, parachutes and desert
    enemies, and can play against others locally or over the network, or at operations.
    We use 22 different weapons and numerous maps, as well as an infinite number of
    randomly-generated maps. Customization include "280 costumes, 32 games, 143 types
    of fonts and unique voice packs" in the main game, as well as community communications,
    and the possibility of creating your own artwork.


    ![](img/a54b3b473771472dd2321ddda1014be1_92_0.png)


    Below Hedgewars is a 2D, turn-based artillery game that''s playable


    ### Pros

    - Hedgewogs with weapons and tools! This game is a must-have for fans of the classic
    Worms franchise


    ### Cons

    - A though feeling timesink! Graphics are starting to get better dated now,


    ### Great for...

    - Playing games because you are wanting-to Free Pascal! hedgewars.org


