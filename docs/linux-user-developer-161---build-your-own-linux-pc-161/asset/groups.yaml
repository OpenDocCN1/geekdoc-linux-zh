    ## 开始 WooCommerce


    ![](img/a54b3b473771472dd2321ddda1014be1_36_0.png)


    只需输入提示符即可准备就绪。下一步是下载 WordPress 并设置配置文件。你可以从他们的服务器下载稳定版配置，上传并将内容放在文件夹的根目录下。然后使用示例文件
    (wp-config-sample.php) 创建实际文件（将其重命名为 wp-config.php）。完成后，打开配置文件并更新值。


    > 随着电子商务成为主流，开办商店的成本已经降低了几个量级。


    - 添加新产品非常像发布新的文章。


    ## 02 安装 WooCommerce


    现在配置已完成，启动 Web 服务器并打开默认页面。你应该能看到 WordPress 注册页面。输入你的用户名、密码和电子邮件 ID。然后 WordPress
    安装就准备好了。下一步是从他们的网站下载 WooCommerce 插件来安装 WooCommerce，将文件解压到 根目录。登录 WordPress 并进入左侧菜单栏的“插件”页面，点击“安装插件”并搜索
    WooCommerce，然后安装插件。直接从那里激活。如果你遇到与权限相关的错误，要解决这些问题，你现在需要创建文件夹并更改它们。


    浏览 dummy-data 文件夹（在 WooCommerce 源码内部），然后选择文本中的 dummy-data.xml，选择你想分配给所有内容的用户，并勾选“仅导入”框框。现在你的网站上就有所有内容了。要进行交叉检查，点击菜单栏上的“产品”链接并查看列出的产品。


    ## 03 导入数据


    现在你想要测试各种功能，并且已经准备好了必要的填充商店所需的内容，是时候将模拟数据导入到 WooCommerce 安装中了。这将让你在探索 WooCommerce
    时变得更加清晰。WooCommerce 源码文件夹本身就提供了模拟数据。使用 ImportWP 导入它。如果尚未安装，将安装 WordPress 导入插件。安装后，点击“激活”并“立即导入”。


    由于我们已经导入了数据，你会看到许多列出的产品。添加新产品很容易；只需点击“添加产品”链接。在出现的产品页面中，填写产品详情，如名称、描述、价格和图像。通过
    WooCommerce 的文章功能，找到这个相同的页面，但有一个重要的变化。通过描述字段，你将找到产品数据，这里是所有特定设置的地方。这些设置包括产品、常规设置、库存相关设置、运费、关联产品和产品属性。


    ```

    $ sudo wp-cli --user=www-data

    ```


    ## 使用 Pusher


    Pusher 插件将你的商店与 Android 和 iOS 的 Pusher 服务集成。你可以安装它来获取实时新订单的自动通知、缺货通知：

    访问这里：github.com/npusher-woocommerce


    ## 04 开始 WooCommerce


    现在你已经安装了 WooCommerce，你将在侧边栏看到产品菜单。你可以看到产品、系统状态等。对于 WooCommerce，你会看到产品分类、标签等。让我们开始产品部分。


    # WooCommerce 教程


    ![](img/a54b3b473771472dd2321ddda1014be1_37_0.png)


    选择正确的外观

    用户对于经济选择。因此，重要的是让你的 WooCommerce 网站有一个良好的外观。如果你想，查看我们的：github.com/jeamsmith/woocommerce-guide。


    ## 05 产品类型和设置


    默认有四种产品类型。第一个是简单产品：用于独立产品。接下来是组合产品：相关产品的集合，可以单独购买。外部或联盟产品是在网站之外销售的。可变产品具有不同 SKU、价格和库存数量。对于虚拟和下载产品，用于销售数字物品。


    ## 06 其他设置


    常规选项卡允许你为产品设置价格和促销价格。你还可以选择为有限时间安排促销。在库存选项卡中，你可以管理库存——这样在每次销售后，库存数量都会被跟踪和更新。关联产品可用于设置向上销售和交叉销售。这会在具有尺寸、颜色等属性的产品页面上显示推荐的产品。高级选项卡可以帮助你设置购买后发送给客户的可选产品备注，并启用评论，设置客户菜单等。在产品设置字段中，你也可以找到产品页面上的短描述。如果你填写了它，该短描述将出现在产品页面上。


    ## 07 WooCommerce 设置


    现在你已经了解了如何在 WooCommerce 中管理产品，让我们看看基本设置。在 WooCommerce 设置中查看带有不同选项卡的设置页面。首先，查看结账。你可以在这里找到基本设置位置、配送和税务。产品选项卡管理单位、产品下载、下载设置。在税务选项卡下，你可以启用产品和服务的税务相关计算。结账选项卡允许你设置如优惠码、支持的支付方法。配送选项卡用于设置配送区域和方法。账户选项卡帮助设置用户账户管理、密码管理和登录。邮件选项卡让你设置订单生命周期期间各种事项的通知。API
    选项卡用于将 WooCommerce 与其他插件集成。你可以使用 REST APIs 进行集成。


    '
