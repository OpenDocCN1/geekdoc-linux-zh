    quantity of the perpendicular, which can"


    "So we wanted to use the dynamics of steering like this, which makes our overall
    motion in terms of the translation of the centre-point and the rotation. From
    that, we then solve for the two-dimensional velocity vector for each. For each
    of those, the wheels will point in the direction you''ll go while turning. And
    when we drive the motors, and we end up with a control system which we can easily
