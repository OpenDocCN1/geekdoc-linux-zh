    \ processing how to translate a tab into multiple spaces\n\n> The issue we look\
    \ at this is converting a tab to a given number of space characters and versa.\
    \ This particular functionality is often needed in text editors and is often off\
    \ in programming. Two C programs are developed to do this. The number of space\
    \ characters is provided as a command line argument. Similarly, s2t uses a separate\
    \ function to replace spaces with tabs once the number of space characters is\
    \ provided. You might have given 8, 10, as the number of characters and implementation\
    \ of s2c is easier than s2t because a tab is a single character whereas it is\
    \ represented as ' and space character.\n\nThere are two approaches for solving\
    \ this problem using separate function for each task or both. The first approach\
    \ is more generic and both s2c and s2t will use a separate function named s2c\
    \ and s2t, respectively which will take a string and an integer as input and return.\
    \ The integer variable will return the number of space characters that replace\
    \ a tab and the number of space characters replaced in the string by a tab, respectively.\n\
    \n```\nwhile (c = (*c++)) {\n    if (c == '\\t') {\n        for (int i = 0; i\
    \ < n; i++) {\n            *c = ' ';\n        }\n        totalChars++;\n    }\n\
    \    } else {\n        *c = c;\n    }\n}\n```\n\nInside both s2t and s2c the input\
