    Next is a Grouped: a collection of related products that can be purchased individually.
    Note Variable products with many configurations like 64 GB international size
    can form a grouped product.


    An External or Affiliate product is something that is sold outside of your site.
    A Variable product has variations that have different SKU, price and stock quantity.
    For example, after the weight you can set the sale price. For the virtual and
    downloadable product, it is used to sell digital items or can be used to give
    access to files following a – think ebook.


    # 06 More settings


    The General tab allows you to set the regular price and sale price for a product.
    You can also choose to schedule the sale for a limited time on the Schedule link
    next to the sale price. In the Inventory tab, you can manage stock at the product
    level – this way, the number of items in stock will be tracked and updated after
    every sale.

