    \n# 报告\n\n报告对于帮助你理解电子商务业务的经营状况至关重要。让我们来看看 WooCommerce 开箱即提供的所有类型的报告。通过在出现的页面中进入\
    \ WooCommerce 报告，你可以看到三种不同类型的报告。\n\n在“订单”选项卡中，你可以看到所有关于销售、按产品销售、按分类销售的报告。在“客户”选项卡中，你可以看到由注册用户处理的结账报告。你还可以查看客户列表。“库存”选项卡允许你查看所有产品的数量信息——你可以看到哪些物品库存最多、最少，还可以查看缺货物品。\n\
    \n# 08 优惠券\n\n在线购物的另一个方面是优惠券管理。电子商务网站也以自己的商店折扣闻名。要实现这一点，你需要在 WooCommerce 设置中启用优惠券，此时所有优惠券将出现在页面顶部。在下一个页面上，你添加优惠券详情。优惠券代码和描述字段是自言易懂的。其余部分简单。\n\
    \n“折扣类型”下拉菜单让你设置该代码适用于所有内容还是仅适用于购物车中的某个产品。你可以在上一个下拉菜单中选择固定金额或百分比。对于在时间内有效的优惠券，你可以设置过期日期。“使用”部分允许你添加限制，例如仅限个人使用，或者“使用限制”允许你限制优惠券的使用次数或由特定用户使用。\n\
    \n> 设置好后，WooCommerce 为用户提供了一个标准的购物车界面\n\n![](img/a54b3b473771472dd2321ddda1014be1_38_0.png)\n\
    \n# Snort 教程\n\n## 使用 Snort 检测网络入侵者\n\n### 深入研究此网络入侵检测系统并学习监控你设备的流量\n\n![](img/a54b3b473771472dd2321ddda1014be1_39_0.png)\n\
    \n在嗅探模式（sniffer mode）下，Snort 在运行期间读取数据包并显示在控制台上。在数据包日志模式（packet logger mode）下，它可以将数据包记录到磁盘。在网络流量模式下，Snort\
    \ 将监控网络流量并根据用户定义的规则进行分析。在活动模式（active mode）下，Snort 可以根据检测到的异常活动执行操作。值得注意的是，Snort\
    \ 内置了告警功能。\n\n如所预期，Snort 可用于检测各种类型的攻击，例如端口扫描、缓冲区溢出等。Snort 可以运行在许多操作系统上，包括所有主流操作系统。Snort\
    \ 不需要你为现有的发行版编译任何其他软件，但它确实要求你拥有 root 权限。\n\n要使用 Snort，你需要配置网络入侵检测系统。所有这些都由系统管理员对任何网络活动完成，以便他们做出相应的决策。\n\
    \nSnort 以三种不同的模式进行配置：\n\n- 嗅探模式\n- 数据包日志模式\n- 网络入侵检测模式\n\n要开始之前，让我们安装 Snort 软件包。如你可能所知的，第一步是在\
    \ Linux 终端中执行以下命令：\n\n```bash\n$ apt-get install snort\n```\n\n安装完成后，你可以使用以下命令检查是否安装成功：\n\
    \n![](img/a54b3b473771472dd2321ddda1014be1_39_1.png)\n\nSnort 是一个开源网络入侵检测系统，执行实时流量分析和数据包日志记录以检测并防止入侵攻击。它可以作为数据包嗅探器、数据包记录器和网络入侵检测系统。Snort\
    \ 使用灵活的规则语言根据一组规则分析流量，然后实时告警用户或记录流量以查看是否检测到任何恶意活动。\n\nSnort 可以在多种模式下运行，例如嗅探（查看数据包）、数据包日志（保存数据包）和网络入侵检测模式（根据规则分析流量）。\n\
    \n- 告警模式 (alert mode)\n\n## -version\n\n此外，请注意 Snort 附带了非常详细的手册，建议读者阅读此手册以完全理解系统。这里需要注意的另一点是，如果你需要运行\
    \ Snort，某些软件包是非常关重要的。\n\n告警记录在你的日志目录中（默认为 `/var/log/`，或你通过 -l 指定的目录）。如果配置文件或其日志目录不存在，Snort\
    \ 将带错误退出。你可以通过提供 -l 切换选项指定你想要告警的 IP 地址、fast、none 或 UNIX 套接字。如果你不使用 -c 切换，Snort\
    \ 将不会进入告警模式。此外，如果你使用 -c 切换，Snort 默认将使用全告警模式。Snort 配置文件用于存储所有的配置规则。Snort 配置文件包含了关于如何使用它的注释说明。请快速查看一下此\
    \ snort 实例的可配置项。\n\n# 为什么使用 Snort？\n\n- apache（Web 服务器）\n- mysql-server（数据库）\n\
    - phpps（基于服务器的脚本）\n- php-mysql（PHP 扩展和应用程序库）\n\nSnort 被许多国家视为网络入侵检测系统的首选。它的有效性和许多功能使其非常受欢迎。一旦学会了如何将其配置到所需的环境中，开源的\
    \ Snort 就很容易使用。你可以 apt-get 安装所有这些程序，一次安装一个（例如，`sudo apt-get install apache`）或一次性安装所有（`sudo\
    \ apt-get install package`）。下一步，我们需要创建成功运行 Snort 所的目录集。使用以下命令：\n\n| 变量 | 说明 |\n\
    |---|---|\n| HOME_NET | 指定你正在保护的 IP 地址。当你使用 Snort 时，你需要配置实际的家庭 IP 地址 - 不要将其设置为任何的默认值。\
    \ |\n| ORACLE_PORTS | 用于指定 Snort 监听的端口。 |\n| RULE_PATH | 指向系统中规则文件的位置。通常，规则存储在\
    \ `/etc/snort/rules`，因此请确保你使用完整路径或所在位置。 |\n\n```bash\n$ snort /snort.conf\n$ snort\
    \ /rules\n$ snort /var/log\n```\n\n![](img/a54b3b473771472dd2321ddda1014be1_40_0.png)\n\
    \n# Snort 教程（续）\n\n同样注意，为了让 Snort 准备好运行，你需要更改默认配置设置以匹配你的本地环境和偏好。此外，如果你想更改默认配置文件的设置，你需要进行这些更改。在\
    \ Snort 配置文件中包含指示 Snort 包含位于 Snort 传感器文件中的信息是非常常见的。通常，这些文件包含与配置相关的信息和行为。如所预期，规则本身没有输入到配置文件中，以简化其管理。重要的是理解为每个告警都添加了行，这些行向你显示了以下信息：\n\
    \n- 源 IP 地址\n- 目的 IP 地址\n- 数据包类型和有用信息\n\n为了让 Snort 准备好运行，你需要更改默认配置设置以匹配你的本地环境和偏好。此外，如果你想更改默认配置文件的设置，你需要进行这些更改。在\
    \ Snort 配置文件中包含指示 Snort 包含位于 Snort 传感器文件中的信息是非常常见的。通常，这些文件包含与配置相关的信息和行为。如所预期，规则本身没有输入到配置文件中，以简化其管理。重要的是理解为每个告警都添加了行，这些行向你显示了以下信息：\n\
    \n- 源 IP 地址\n- 目的 IP 地址\n- 数据包类型和有用信息\n\n*(注：由于提供的英文文本后半部分存在大量完全重复的内容，译文已剔除逻辑重复部分。)*\n\
