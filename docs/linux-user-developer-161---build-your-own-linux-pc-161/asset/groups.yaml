    \ 的小型 C 程序的源代码，它可以打印所有命令行参数。它还展示了如何使用 `argc` 来帮助你访问命令行参数。\n\n```c\n#include <stdio.h>\n\
    #include <string.h>\nint main(int argc, char *argv[]) {\n    if (argc != 4) {\n\
    \        printf(\"Argument count is not %d; expected %d\\n\", argc, 4);\n    \
    \    return 1;\n    }\n    for (int i=0; i<argc; i++) {\n        printf(\"Argument\
    \ %d: %s\\n\", i, argv[i]);\n    }\n    printf(\"Argument 0: %s\\n\", argv[0]);\n\
    \    printf(\"Argument 1: %s\\n\", argv[1]);\n    printf(\"Argument 2: %s\\n\"\
    , argv[2]);\n    printf(\"Argument 3: %s\\n\", argv[3]);\n    return 0;\n}\n```\n\
    \n# 关于进程更多信息\n\n进程是 UNIX 中的一级公民，因此在 Linux 中易于管理。如果你使用带有可用选项的 `ps` 命令：你可以找到在 Linux\
    \ 机器上运行的进程列表，你会对后台运行的进程数量感到惊讶。同样惊讶的是，每个进程都是通过 `exec` 或 `fork` 系统调用启动的！这里有很多内容值得深入研究，请继续读下去。\n\
    \n# 教程文件\nfilesilo.co.uk\n\n`args.c` 的代码打印在顶部；下方你可以看到程序运行时的输出\n\n![](img/a54b3b473771472dd2321ddda1014be1_29_1.png)\n\
    \n| 状态 | 描述 |\n| :--- | :--- |\n| 1 | 进程创建 |\n| 2 | 就绪运行 |\n| 3 | 运行状态 |\n| 4\
