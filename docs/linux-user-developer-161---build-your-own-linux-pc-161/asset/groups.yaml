    # 开源


    ## 固件


    ## 戴尔支持在 Linux 中进行固件更新


    一系列让我们的生活更便利的厂商中的首位


    ![](img/a54b3b473771472dd2321ddda1014be1_5_0.png)


    戴尔已确认，它有能力加入 Linux 厂商固件服务（LVFS），该项目似乎是首个允许在 Linux 内部更新固件的项目，而无需要求用户启动到某个程序。


    关于元数据，你需要在更新页面中手动清除刷新按钮，到目前为止已有 40,000 人这样做了。考虑到 Colorostro 是唯一在 LVFS 上发布了固件的发行硬件，我预计下载量会在
    224 次左右这一量级。当戴尔（以及其他我无法提及的厂商）销售支持 UEFI 的真实消费硬件时，这一数字应该呈数量级增长。


    LVFS 由 Hughes 创建，其相关软件包已成为 Hughes 的 Colorostro 校准硬件进步的手段，作为第一个从 Linux 内部更新固件的设备。通过成为成员，首先支持从多个厂商更新固件的方法。


    支持这些用户意味着改进 LVFS 流程。从 Fedora 24 发布开始，元数据将在登录后自动刷新，并且当有新固件可用时可以通知。Fedora 24 包含的
    `fwupd` 也将是支持使用的系统。


    戴尔对 `fwupd` 的使用将受益于该公司的 Dell Edge 5000/5500 系列硬件，该公司一直尝试通过 LVFS 支持这些硬件。然而，支持范围在未来还将扩大：


    > 该项目向前推进，首次作为一种从多个厂商更新固件的受支持方法。


    “Hughes 在该项目的公告中表示：我们已经了解到戴尔正在考虑扩展 LVFS 以支持所有支持 UEFI 更新的新机型。”


    不仅是戴尔对此感兴趣。Hughes 表示，在某服务不可用或无法指明名称时，许多其他供应商一直在追踪通过该服务进行安装。目前，`fwupd` 工具的使用非常有限。Hughes
    透露道：“在 11 月，使用 `fwupd` 的系统安装或更新了 224 个固件文件。”


    “目前，可以在 GNOME 中更新固件，并支持符合戴尔固件升级（DFU）标准的 USB 设备。”


    Fedora 和 Linux 内核的发展得到了红帽的支持，红帽免费向所有发行版提供该服务。戴尔目前要求其客户加入，其他也有此兴趣。然而，戴尔尚未提供扩展其硬件列表以使用
    LVFS 的正式路线图：


