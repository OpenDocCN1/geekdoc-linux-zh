    # 教程


    在首次设置 PiBeacon 时，你需要一个像 iBeacon detector 这样的应用程序。


    下方的 iBeacon & Eddystone Scanner 是另一款实用的 Android  Beacon 检测工具。


    ![](img/a54b3b473771472dd2321ddda1014be1_69_0.png)


    ![](img/a54b3b473771472dd2321ddda1014be1_69_1.png)


    # 解决错误


    你可能会偶尔遇到 PiBeacon 的错误，特别是在促使状态从“DOWN”切换到“UPRUNNING”时。


    在这种情况下重启设备没有用。相反，你需要重置 hci 设备。首先，进入 `hcconfig` 配置 hci 设备名称。通常操作方法如下。


    接下来，输入 `sudo hci reset`。这基本上会清除所有输出并让你重新开始。要检查，再次输入 `hcconfig`，你应该看到状态现在显示为“UPRUNNING”。


    ```

    sudo hcconfig hci reset

    ```


    # 使用 iOS 设备进行测试


    在将 PiBeacon 用于特定项目之前，你需要确保它正在正确广播。为了做到，你需要一台 iPhone 或 iPad Touch 来检测扫描数据响应（Scan
    Data Response）——当你的手机靠近 PiBeacon 时，它会将包括 UUID 发送到你的手机。


    此外，你还需要一个应用程序。像上面提到的 Toolkit 这样的程序就足够了。我们在这个阶段只是为了测试你的 PiBeacon 的信号强度和范围。这些质量取决于连接到树莓派
    USB 接口的 BLE 设备。


    # 使用 Toolkit 应用程序


    打开 Toolkit 应用并点击 Listen（监听）。当你移动手机或平板电脑时，iOS 设备将显示出 PiBeacon 的位置，你可以利用这些信息来测试
    PiBeacon 的信号强度和范围。在这个阶段，我们只是在测试 PiBeacon 能被设备检测到。


    但现在，为什么要使用它？因为 PiBeacon 技术非常类似于 NFC，但不需要物理接触。这涉及到一些安全问题，因此在使用时请要小心……


    ![](img/a54b3b473771472dd2321ddda1014be1_69_2.png)


    ![](img/a54b3b473771472dd2321ddda1014be1_69_3.png)


    # PiBeacon


    如果你家里有旧的 Model A 或 Model A+，这将是理想的选择。


    # 信号强度


    无论你计划用 PiBeacon 开发什么项目，请记住每个手机的天线都不同，因此无法获得相同的距离和距离结果。


    # 09 Android 上的 ibeacon 扫描


    对于计划与树莓派 Beacon 通信的 Android 用户，有多种 Beacon 可用。包括 Locate Beacon、IBeacon Detector
    和 Beacon Scanner。除了兼容 IBeacon，它们还支持开放规范的 IBeacon 替代方案。下方是 IBeacon 示例。


    ![](img/a54b3b473771472dd2321ddda1014be1_70_0.png)


    如果你想建立一个近且易于配置的云服务器，否则可以使用 PiBeacons 或简单的树莓派模型


    # 10 选择 PiBeacon 还是 NFC


    正如你之前可能看到的，我们和 NFC 之间有一些相似之处，特别是在智能家居应用方面。你的项目应该使用哪一个？


    Android 无需 beacon 即可为树莓派产生 NFC beacon 功能，这对于任何需要 NFC 标签与手机之间接触的项目来说都非常有用。


    而这正是真正的区别所在。如果你的项目需要物理接触，请使用 NFC。否则，PiBeacon 方案应该足够了。


    # 11 让你的树莓派考虑


    你可以利用目前为止在智能手机和树莓派之间智能交互的所学，但应该从哪里开始呢？与其为你的手机寻找合适的应用程序，不如如果你花些时间学习它，就可以根据 PiBeacon
    的存在来启动应用程序。


    我们看过的工具还


