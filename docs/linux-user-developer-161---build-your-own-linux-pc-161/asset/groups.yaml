    ## 制作自定义发行版


    使用 Ubuntu 定制工具包（Ubuntu Customization Kit）制作可启动的 Linux 光盘


    - 资源

    - 任何 Ubuntu 系统

    - 下载的 Ubuntu ISO

    - SGB 硬盘空间（Live 刻盘或 2GB 闪存盘）


    Ubuntu 定制工具包 (UCK) 是 Ubuntu 用于定制 Ubuntu Live CD 的工具。通过 UCK，你可以向系统添加任何软件包，例如语言包、应用程序、媒体文件等。尽管我们仍然觉得
    CD 太大了，无法在 CD 和 CD2（两者仅隔两年）之间同时用于带光驱驱动的笔记本电脑，以及在 USB 闪盘上想要编辑的数据。


    UCK 是一系列脚本，用于为你定制镜像并构建 ISO。图形化前端向导会引导你完成定制版 Ubuntu Live 的创建，从更改语言到添加额外内容。


    `sudo apt-get install uck`


    .deb 文件可以从 Ubuntu 仓库获取并安装在 Debian、Linux Mint 或其他相关发行版上，你应该在不先安装它的情况下先构建 Ubuntu。有些细微的依赖关系必须正确安装。从
