    Snort is considered as the first choice for network intrusion detection systems
    in many countries. Its effectiveness and the many features make it very popular.
    Open source Snort is easy to use once you learn how to configure it to the needed
    environments. You can apt-get all of these programs, either one at a time (example,
    sudo apt-get install apache) or all at once (sudo apt-get install package). As
    next step, we need to create the set of directories required for successful running
    of Snort. Use the following commands:


    | Variable | Description |

    |---|---|

    | HOME_NET | Specifies the IP address you are protecting. When you use Snort,
    you will need to configure your actual home IP address - do not set this to the
    default value of any. |

    | ORACLE_PORTS | Used to specify the port that Snort is listening on. |

    | RULE_PATH | Points to the location of the rules file in your system. Typically,
    rules are stored in /etc/snort/rules, so make sure you use the full path or where
    the location is. |


    ```bash

    $ snort /snort.conf

    $ snort /rules

    $ snort /var/log

    ```


    ![](img/a54b3b473771472dd2321ddda1014be1_40_0.png)


    # Tutorial Snort


    Also note that in order to get Snort ready to run, you need to change the default
    configuration settings to match your local environment and preferences. Further
    to this, if you want to change the settings of the default configuration file
    you will need to make those changes. It is very common to include in Snort configuration
    files instruct Snort to include the information located in Snort''s sensor file.
    Typically, these files contain configuration-related information and behaviors.
    As expected, the rules themselves are not entered into the configuration file,
    order to simplify its management. It is important to understand that there are
    lines added for each alert and these lines show you the following information:


    - IP address of the source

    - IP address of the destination

    - Packet type and useful header information


    In order to execute Snort, you can use the following command:


    ```bash

    $ snort -c /etc/snort.conf -l /var/log/snort/

    ```


    With a config file, each alert will be generated in the /var/log directory. This
    file contains the alerts while Snort was running. Alerts are classified by the
    type of alert, and Snort will show you a priority for each alert. You can also
    run Snort to concentrate on the network using the -n option, as shown in the following
    command.


    You can set alert levels in the rules using the following:


    <Rule Actions><Protocol><Source IP Address><Source Point><Direction Option><Destination
    IP Address><Destination port> (rule options)


    Let us take a look at the rule structure with an example:


    | Structure | Example |

    | --- | --- |

    | Rule action | alert |

    | Protocol | ICMP |

    | Source address | any |

    | Source point | any |

    | Direction operator | -> |

    | Destination IP address | any |

    | Destination port | any |

    | Rule options | (msg:ICMP Packet; sid:477.2) |


    ```bash

    $ snort -c /etc/snort.conf -l /var/log/snort/

    ```


    If you want to be able to restart Snort by sending the SIGUP signal to the daemon,
    you will need to use path to the Snort binary when you start. You can use type
    -snort to get a full understanding of the various options that are available within
    Snort.


    Now let''s look at how you can use Snort modes as mentioned earlier. Snort can
    be configured in three ways: sniffer mode, logger mode and network intrusion detection.


    In sniffer mode, Snort will be able to print TCP/IP packet alerts to the screen.
    You can also do this by using the following command:


    ```bash

    $ snort -v

    ```


    # Pre-defined rules


    Snort has enough intelligence to read a rule set if the traffic matches the defined
    condition. When there is a match condition, alert can be logged to a file specified
    from the command line or shown on the screen. It is a common practice to use the
    rule sets available on the Snort network home interface is also available. If
    Snort makes a rule like the following


    ```bash

    log -tp any -> 192.168.1.0/24

    ```


    This log logs to tp traffic coming from any IP address and any source port on
    our network where the destination port is 23 (corresponding to tcp). Snort is
    said to be very powerful. There are three base detection actions that Snort can
    use when a rule matches a pattern: pass; log; alert. Pass rules generate no output.
    Alert rules generate an output by the user at runtime at command line, and then
    they will log the packet using the selected logging method to enable alert.


    It is best for you to know that there are many third-party tools which have come
    up in the market and these tools will help in using Snort for various purposes
    such as administration, performance and log analysis.


    ```bash

    $ snort -dev -1 /log

    ```


    The above command assumes that you have a directory named log in your directory.
    If it is not the case, Snort will exit with an error message. As expected, in
    order you will need to tell Snort where relative to the home network. Another
    useful method for logging is binary mode, and in this mode Snort will log the
    packets in binary format to a single binary file in the logging directory. The
    following command shows how binary mode can be used:


    ![](img/a54b3b473771472dd2321ddda1014be1_41_0.png)


