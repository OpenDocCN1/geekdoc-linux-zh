    ## 01 安装 WordPress


    现在有几个托管提供商提供一键安装 WordPress 服务。然而，如果你更倾向于手动操作，或者想在上线之前先在本地机器上操作，首先学习安装和配置 WordPress
    是重要的，然后创建一个用户并为用户分配权限，以便他们访问 WordPress 数据库。要执行此操作，请按照终端窗口中的步骤进行：


    ```

    $ mysql -u root -p

    CREATE DATABASE WordPress;

    GRANT ALL PRIVILEGES ON WordPress.* TO ''wordpress''@''localhost'' IDENTIFIED
    BY ''password'';

    FLUSH PRIVILEGES;

    ```


    注意，在第一步之后，你需要输入 MySQL 的密码。默认情况下没有分配密码，所以如果你不记得，你可以


    虽然这里有几种专有的解决方案可用，但开源方案并不落后。我们将查看所有方案。WooCommerce 是一个与 WordPress 无缝集成的开源插件。一旦设置好它，它就会扩展本教程中的所有内容。我们将运行安装和使用
    WordPress 以及 WooCommerce 的步骤，创建你自己的网店并开始销售商品。我们还将查看 WooCommerce 网店的管理方面以及如何有效地使用它。


