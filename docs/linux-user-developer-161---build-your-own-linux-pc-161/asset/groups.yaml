    \ PIR 传感器，使摄像头能够拍摄夜间野生动物。捕捉到的每张照片都会保存到 Pi 中，并添加“时间戳”以监控和跟踪动物访问你花园的时间。\n\n## 连接\
    \ NoIR 摄像头模块\n要开始之前，请将你的摄像头连接到树莓派。至关重要的一点是，首先通过触摸物体（如散热扇）来消除产生的所有静电。蓝色的标签有助于识别\
    \ HDMI 端口。使用 `sudo raspi-config` 访问配置设置并按如下启用摄像头，然后重启。建议始终更新软件，因此在命令行中输入以下内容：\n\
    \n**Dan Eldred**\n是树莓派认证教育工作者，《教师用树莓派》一书的作者。他曾领导了 Astro Pi 中学竞赛的获胜团队。\n\n```\n\
    sudo apt-get update\nsudo apt-get upgrade\n```\n\n## Pi NoIR\n\n## Cron\n\nCron，许多人说它代表“Command\
    \ Run Over Night”（夜间运行命令）——这是一个基于时间的调度工具，允许你安排作业命令或 shell 脚本在特定的时间或日期定期运行，通常用于自动化管理程序的维护程序或磁盘相关任务。\n\
    \n![](img/a54b3b473771472dd2321ddda1014be1_64_0.png)\n\n## 04 它能工作吗？\n\n当你在黑暗中拍照时，NoIR\
    \ 模块似乎不起作用。照片看起来像是一张右视角的间谍风格照片；实际上，它是完全黑色的。你需要改变的是一个红外光源。\nNoIR 是摄像头模块的适配器，旨在在黑暗中拍摄视频时提供额外的照明。它具有额外的安装点，非常适合自定义的支架或持有器。它有两个版本：标准版和\
    \ NoIR 版。红外线（带有 LED）在摄像头周围排列了 12 个 LED，以便在光光条件下使用时提供散开的光线，非常适合捕捉活动。\n\n## 02 拍摄照片\n\
    一旦设置好树莓派，请测试摄像头是否工作正常。运行以下命令：`raspicam -o test.jpg`。运行后，你将在屏幕上看到预览，文件将保存在 /home/pi\
    \ 中。参数 -o 表示输出，并是你要保存的文件的文件名。例如 `raspicam -o keyboard.jpg` 会将图像保存为名为 keyboard\
    \ 的文件。\n\n## 03 使用 Python 拍摄照片\n在这个项目中，我们将使用 Python 控制 NoIR 模块并捕捉照片。使用 Python\
    \ 拍摄照片只需几行代码即可实现。打开你的编辑器并创建下面的函数，然后运行。可以使用 `camera.start_preview()`（第 6 行）预览图像。要使用摄像头，只需一行代码即可捕捉帧：将\
    \ 'nature' 替换为你想命的名称。此测试将显示它在 Python 中运行正常。\n\n## 05 连接到 NoIR\nNoIR 很容易连接到树莓派。连接树莓派也同样简单：只需使用母对公的跳线并将其连接到板子上的引脚上。需要的引脚是\
    \ 5V、GND 和输出。记住使用 BCM 编号系统，这样代码中的数字将是提供使用的 GPIO 引脚号。现在你已经连接了 NoIR 并准备好拍照了。\n\n\
    ```python\nimport time\nimport picamera\n\ndef selfie(camera):\n    with picamera.Camera()\
    \ as camera:\n        camera.start_preview()\n        time.sleep(2)\n        camera.capture('nature.jpg')\n\
    \nselfie()\n```\n\n## 06 另一个测试\n现在是调整你的摄像头开启 NoIR 并在黑暗中捕捉帧了。首先，导入 GPIO 模块（第 1\
    \ 行）；`import R.GPIO as GPIO`。将 GPIO 编号系统设置为 BCM，使用 `GPIO.setmode(GPIO.BCM)`。然后将引脚\
    \ 18 设置为输出（第 5 行）：`GPIO.setup(18, GPIO.OUT)`。拍摄照片后，将其关闭。\n\n```python\nimport\
    \ R.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(18, GPIO.OUT)\nGPIO.output(18,\
    \ GPIO.HIGH)\nimport picamera\ncamera = picamera.Camera()\ncamera.start_preview()\n\
    camera.capture('nature.jpg')\ncamera.stop_preview()\n```\n\n## 07 PIR 传感器\n热敏传感器（被动红外传感器）可以拾取物体发射的热量。这种红外线是肉眼不可见的，但会被电子设备检测到。PIR\
    \ 触发的灵敏度可以调整。PIR 触发后可以重置。\n\n## 08 连接 PIR\n连接 PIR 并不难。连接树莓派也很容易。为了检查此项，首先移除 NoIR\
    \ 引线。三根引线分别是：5V、GND 和输出。记住使用 BCM 编号系统。\n\n| PIR 5 | GND | PIR 输出 (GPIO7) |\n|\
    \ :--- | :--- | :--- |\n\n![](img/a54b3b473771472dd2321ddda1014be1_65_0.png)\n\
    \n## 09 测试 PIR\n现在 PIR 已连接，测试它是否工作正常并调整设置。使用你的 Python 编辑器，打开一个新文件并输入测试代码。重要代码：\n\
    \n```python\nGPIO.add_event_detect(PIR, GPIO.RISING, callback=motion_sensing)\n\
    ```\n\n设置为检测上升的热量，例如人体。树莓派识别出热量正在上升并执行回调。在这个回调中，我们将在 Python 控制台中打印“我们看到你了”。当物体移动时，热量会发生变化，PIR\
    \ 会感知到它。\n\n```python\nimport time\nimport R.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\n\
    \nPIR = 7\nGPIO.setup(7, GPIO.IN)\n\ndef motion_sensing(channel):\n    print(\"\
    Ready to find you\")\n    time.sleep(2)\n```\n\n## 10 保存新照片\n当 PIR 使用第 3 步的代码拍摄照片时，它会覆盖现有文件，因为两个文件名相同。这不适用于在一段时间内拍摄许多照片。\n\
    \n为了确保文件不被覆盖，我们每次摄像头被触发时使用变量值更改文件名数字。例如，第一个文件是 Nature.jpg，Nature2.jpg 等等。\n\n\
    ```python\ncamera.capture('Nature' + str(File_Number) + '.jpg')\nFile_Number =\
    \ File_Number + 1\n```\n\n## 11 添加拍摄时间\n你可能需要知道摄像头触发并拍摄照片的时间，特别是当设置在夜运行时。为了做到这一点，在循环开始时创建一个新变量\
    \ `time_of_capture` 来存储当前时刻。要获取拍摄时间使用 `as_ctime(time.localtime(time.time()))`。这将检查你的树莓派的时间并将其保存到\
    \ time_of_\n\n"
