    # 开源


    您的 Linux 新闻与观点来源


    # 访谈 VIKTOR PETTERSSON


    ## 使用 Screenly 实现数字标牌


    ![](img/a54b3b473771472dd2321ddda1014be1_11_0.png)


    树莓派的破坏性力量为 Viktor Peterson 提供了一个机会，让他推出了一种低成本的解决方案来有效解决多屏驱动问题。


    > **你为什么要创建 Screenly？**

    > 大约是在 2012 年年前后。我偶然进入了一个职位，我们基本上必须为一家被收购的公司创建一个数字标牌解决方案。就在 6 月份交易完成前，也就是大约在 1
    月 1 日，我们最终做出了一个非常粗糙的软件。所以那确实是 Screenly 的第一个版本，它的 POC [概念验证] 最终只是一个用 Python、bash
    等工具在嵌入式 Linux 上构建的非常粗糙的工具。


    大约四个月后，树莓派出现了。当时我们按照常规运行，每个屏幕的物料清单成本大约 500 美元。然后树莓派出现了，每台只需 34 美元。当时就像是：“等一下——这个设备这么便宜，我们可以以低得多的价格来实现吗？”于是我发布了
    OSE（Screenly 的开源版本），将其发布在 Reddit 论坛上，然后放到了 GitHub 上。


    在这段时间内，我们基本上在树莓派出现之前就构建了 Screenly —— 我们的目标是看看用它能做什么。其中没有一个真正达到标准。我们查看了所有的方案，发现了在生产环境中可以依赖的东西。于是我们说，反正我们可以做得比这更好——
    只需要一些简单的东西。在两周内，我们就有了一个可以运行的雏形。


    我们从未……我们写这个程序是为了我们自己的需求，所以并没有打算让它成为一个大产品，但它迅速爆发了。我们在树莓派论坛发了一个帖子，浏览量增长到近 130,000
    次，有 700 条回复。有趣的是，这在很大程度上正是 Screenly 所需的。所以我到目前为止在营销上的花费不到五百美元！


    **Viktor Peterson**

    他在大学期间共同创立了软件公司 Work.inc，这让他进入了商业领域。2013 年，他加入了 CloudSign 领导设计和产品开发。2015 年，Viktor
    回归支持公司的产品开发。Screenly 是树莓派最流行的数字标牌解决方案，为全球的屏幕提供支持。


    *右：* Screenly 仪表板让你一目了然标牌的状态，包括其位置、最后一次 ping


    ![](img/a54b3b473771472dd2321ddda1014be1_11_1.png)


    | 位置 | 1 Primrose St, London SC2A 2BX, UK |

    | --- | --- |

    | 时区 | Europe/London |

    | 分组 | Europe, London |


    | 管理屏幕 | |

    | --- | --- |

    | 主机名 | test@raspberry.screenly.local |

    | Local IP | 10.15.10.15 |

    | MAC | AA:BB:CC:DD... |

    | 最后一次 ping | 几秒前 |


    ## 销商计划


    Screenly 推出了其销商计划，使批发公司能够向自己的客户销售订阅，或通过我们的订阅价值让注册 Screenly 的合格客户付费。“想想有机增长的情况，”Mike
    Video 说，“这种增长速度让我们应接不措——对 Screenly 的需求是我们自己完全无法想象的。我们拥有一些垂直领域的合作伙伴，他们服务于本地商店、餐厅或其他特定的利基市场。对我们来说，不仅如此，这非常神奇，而且在
    Screenly 的基础上还能获得佣金。”


    于是我们推出了 Screenly，它带来的反馈量和增长热度让我们应接不措，树莓派社区真的太棒了。在我们开放 Screenly 开源版本后一两个月，我们就收到了一家美国公司的联系，他们在全美有
    10,000 台 ATM 机机。他们说：“这对我们来说也很棒，”于是我们认为可能应该做一个商业版本。


    那笔特定的交易并没有产生收益，但我们开始收到越来越多想要商业可行方案的公司的提问——一种托管服务，而不仅仅是开源解决方案：“Screenly 如何能为我们的酒店和餐厅连锁提供服务。”于是我们开始着这项工作，在我们在树莓派上构建出第一个原型大约八个月后，就成功了。


    所以这个 OS 是一个独立的解决方案，你将其安装在树莓派上，基本上将你的浏览器指向 IP，并从 Screenly 进行管理。它是一个托管服务，所以你不需要有一个下载镜像并在首次启动时基本上对其进行配对——你只需要想要的
    QR-屏幕配对。通过 Web 界面管理所有屏幕。我们为全球的屏幕提供支持。


    ![](img/a54b3b473771472dd2321ddda1014be1_12_0.png)


    ## 对于加载到我们系统的视频，我们在发送到设备之前会进行编码


    为了方便管理，屏幕可以在 Screenly Pro 中进行分组，以应对地区差异


