    your device''s web traffic


    ![](img/a54b3b473771472dd2321ddda1014be1_39_0.png)


    In its sniffer mode, during operation Snort will read packets and display them
    on the console. In packet logger mode it will be able to log the packets to the
    disk. In network traffic mode Snort will monitor network traffic and analyze it
    against the rules defined by the user. In active mode Snort can perform actions
    based on detected abnormal activity. It is worth noting that Snort has an in-built
    tool alerting capability.


    As expected, Snort can therefore be used to detect various types of attacks such
    as port scans, buffer overflows, and more. Snort can be performed on many operating
    systems, including all the major operating systems. Snort doesn''t require you
    to compile any other software to your existing distribution, but it does require
    that you have root privileges.


    To use Snort, you need to configure the network intrusion detection system. All
    of this is done by the system administrators to any network activity so that they
    may make appropriate decisions.


    Snort is configured in three different modes:


    +   - Sniffer mode

    - Packet logger mode

    - Network intrusion detection mode


    To get started, let''s install the Snort package. The first step, as you may know,
    is to execute the following command in Linux terminal:


    ```

    $ apt-get install snort

    ```


    Once the installation is complete, you can check for a successful installation
    by using the following command:


    ![](img/a54b3b473771472dd2321ddda1014be1_39_1.png)


    Snort is an open source network intrusion detection system, that performs real-time
    traffic analysis and packet logging to detect and prevent intrusion attacks. It
    can function as a packet sniffer, a packet logger, and a network intrusion detection
    system. Snort uses a flexible rules language to analyze traffic against a set
    of rules, and then alerts the user or logs the traffic in real time to see if
    any malicious activity is detected.


    Snort can be run in various modes, such as sniffer (to view packets), packet logger
    (to save packets), and network intrusion detection mode (to analyze traffic against
    rules).


