    幻象使得运行的应用程序不需要感知每一个其他程序，因为它拥有自己的整个虚拟内存地址空间。页大小是在保持对内存细粒度控制与存储页-物理内存翻译所需的额外内存量之间的权衡，这些翻译存储在同样由内核管理的虚拟内存中。普通的内存管理不仅支持到物理地址的翻译，还提供保护


    “保护位”是防止内核内存转换的一部分。这种机制是一种权限嵌入的概念，其对此类限制的理解确保了特定的访问限制。这是可能的，例如，可以将虚拟内存的一个区域标记为用户进程可读但不可写。也可以将某些内存标记为不可执行，这允许内核将代码复制到内核运行空间而不会出现“缓冲区溢出”类型的情况。类似的问题可以通过适当的隔离来避免。


    一个特别糟糕的例子是以内核 VSO（虚拟动态对象）区域形式提供的只读数据拷贝，它提供了运行时插入到用户程序中的可执行代码。这是内核代码直接对用户可见的例子。VSO
