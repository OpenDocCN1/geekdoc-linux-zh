    # 评


    # 音频编辑器


    # Audacity


    # Reszound


    它是跨平台的，数百万 Windows 用户经常使用它。


    在 2013 年更新过版本，修复了错误并提供了基础的 PulseAudio 支持。


    ![](img/a54b3b473771472dd2321ddda1014be1_81_0.png)


    - Audacity 使用 wxWidgets 构建，其主工具栏上具有一些引人目的斜角按钮。


    ![](img/a54b3b473771472dd2321ddda1014be1_81_1.png)


    - Reszound 中包含一些实用的工具，提供了出色的预设和图表。


    # 录制音频


    Audacity 从你的默认 PulseAudio 源进行录制。它官方支持 ALSA，但我们有一个兼容层（名称与 PulseAudio 类似）来连接这两个音频系统。Audacity
    可以毫无问题地使用它。在“编辑-偏好设置：设备”中，你可以设置不同的录制轮廓、更改质量设置等。


    在 2008 年到 2013 年之间，Reszound 在录制音频方面存在问题，古老的设备 osound 项目为了在现代系统上录制和播放声音。David 修复了这个问题。如果你在声音中听到类似胶片的裂声，请检查
    `/etc/pulse.conf` 中的采样率。


    # 效果与后期处理


    你无法编辑内置效果，无法将吉他声输入 Audacity 并变成失真的电音比特，但这里有一些元素，包括降噪、归一化、淡入淡出。可扩展插件可以放在 `/user/share/audacity/plugins`
    中。


    Reszound 似乎停留在第一代音频编辑器的水平，适用于 Nitlets 中的 Windows PC 上。在音频质量方面，它可以与 Source Forge
    的早期版本相比。内置效果没有残留噪声，也没有预览。


    # 性能


    大多数用户一旦开始处理大型项目（即存储的音频数据增长到 GB 级左右），他们就会开始关注性能了。我们好奇当系统耗尽 RAM 时，Audacity 的表现如何。在测试中，我们发现它没有分配任何资源。虽然
    Audacity 非常棒，但对于长时间任务来说并不完美。


    Reszound 在处理大型音频文件时表现良好。它尝试一次性加载所有内容，就像其他程序尝试做的那样。Reszound 是我们用过的。然而，界面留下了混合的回声。它很快，但如果操作错误，它足以进行分段。


    # 多轨道与母带处理


    Audacity 在证明处理多个轨道方面表现良好。在录制已包含音频轨的项目时，Audacity 会将新记录添加到单独的轨道，而不会覆盖任何内容。你可以调整每个轨道的
    LR-R 和音量，调整它们的主带位置、缩放等。Audacity 是自制歌曲的极佳工具。


    Reszound 有一些平衡工具，具有动态范围、更改速度、绘制影响音频的曲线等功能。遗憾的是，Reszound 无法同时播放一个轨道。它允许切换打开的文件，我们可以从一个轨道复制粘贴到另一个，但可以实现声音叠加和母带处理。


    # 总体


    如果你不喜欢向 Audacity 加载大量数据，你会发现它非常敏捷。它已经附带了数十种用于录制声音或添加个人风格的极佳插件。


    仅在最新的 0.13 beta 版本中有用，且 Reszound 仍然需要时间来排查录制和播放问题。作为回报，你获得了一个处理大文件的高效工具。


    ![](img/a54b3b473771472dd2321ddda1014be1_81_2.png)


    ![](img/a54b3b473771472dd2321ddda1014be1_81_3.png)


    82


    # KWave


    来自 KDE 的现代音频编辑器，KWave 是一个模块化组件。


    # Sweep


    在 Pixar 的支持下开发，Sweep 承诺成为大胆的编辑器……


    ![](img/a54b3b473771472dd2321ddda1014be1_82_0.png)


    KWave 的音频对话框比这里的其他软件让你对录制内容有更好的控制。


    Sweep 窗口大部分被振幅图占据，上下配有辅助按钮。


    # 录制音频


    我们不得不承认，KWave 提供了设计最好的对话框，具有清晰的录制和源控制。KWave 在无需预先设置的情况下即可录制，但我们得到了带有裂声和咔嗒声的质量记录——当基于
    ALSA 的应用程序与 PulseAudio 编辑器交互不好时。


    Sweep 提供了一种不同的录制方法：以原始格式，然后选择你想要填充的区域，最后点击底部的红圈。自从 Sweep 在 2008 更新以来，它适用于任何设备。要修复此，使用特殊的
    PulseAudio 录制器启动 Sweep：`pasid sweep`。


    # 效果与后期处理


    KWave 拥有最基础的功能集，适用于入门级音频编辑。你有几个选项，包括均衡器、低通、带通、音符等可能更多。足够为业余录制添加一点小花样，但仅此而已。KWave
    功能最丰富的部分是编辑器，设计用于导出到 MP3 或 OGG。


    '
