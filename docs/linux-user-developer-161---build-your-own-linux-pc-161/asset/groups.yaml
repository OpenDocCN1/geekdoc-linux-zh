    > Linus Torvalds 宣布了最新的 Linux 4.4 版本 (c666)。在这次公告中，他指出“对于开发周期的这个后期来说，情况保持基本正常。”


    ## 只读内存


    内核以许多不同的方式使用内存。对于用户应用程序有运行时分配，这些是用户任务、文件系统、内部内核以及许多其他部分。还有在内核运行过程中定义的静态“分配”内存，这些内会在启动时就保持不变。


    某些内存并不是由内核分配的，而是从内核开始执行的那刻起就预留给内核使用的。这些内存通常包含会被写入并再次读取的区域，无论内核运行多久。这些内存中的某些包含敏感数据，如果这些数据被恶意或异常代码修改，安全功能旨在通过将内存区域设为只读来降低此类风险。


    最显著的特征之一是为 Broadcom VideoCore IV (VCA4) GPU 系统上芯片处理器增加了驱动程序，这些处理器被称为 BCM2836 SoC（系统上芯片）处理器，更广泛地用于树莓派
    2。新的 KMS（模式设置内核）驱动允许内核控制显示平衡和光标，但这是内核首次直接访问树莓派上的图形。


    现代操作系统将物理内存划分为数百万微小的（有时并不那么小）块，被称为“页”。页是典型的。为了方便理解，每个页为 4KB，因此这台机器上此列文章的纯文本内容占了约
    2MB 的物理内存（400 个页）。 100 个页即可包含所有用于存储功能和元数据的所有内存映射文件数据。


    4.5 内核版本将于 10 月初发布，取决于你阅读此文的时间。这条新闻意味着 4.5 开发周期的“合并窗口”（即整合更改的时间段）的发布特性。


    当然，主要的新功能将在 linux-next 中或在整个发布开发周期（4.5）的子树中测试——但这些是在将代码发送到 Linux 以纳入新内核之前的最后活动。在这些活动达到最终定稿后，开发者将迎来休假，这意味着他们的假期计划以及
    4.5 的开发可能会受到意外之外的干扰。由于由于原因，Linus 宣布


