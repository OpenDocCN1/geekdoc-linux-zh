  md: "# Tutorial Processes\n\nis something wrong with the system, or when the user\
    \ is not allowed to create a new process because they have reached the limit of\
    \ allowed processes; the last limit is specified by the CHILD_MAX which defines\
    \ the maximum of simultaneous processes per user.\n\nIn other words, if the fork()\
    \ call succeeds, it returns despite the fact that it is called once! It is also\
    \ important to remember that both the parent and the child continue execution\
    \ with the code that follows the call to fork()\nYou usually use fork() to create\
    \ processes that wants to duplicate itself so that the parent and the child can\
    \ execute each different section of code at the same time.\n\nAs you will see\
    \ in a forking server multiple processes such as Apache use fork() to start processes\
    \ and allow to serve multiple client requests. The parent process gets one client\
    \ request for each TCP/IP port, and is responsible for sending request to its\
    \ child to be served. Second, when a process wants to run a different program\
    \ it is very common for Linux shells. The child executes the exec system call\
    \ immediately after it returns from fork() such as an example:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\nint main(int argc, char\
    \ **argv) {\n\n    pid_t pid;\n    pid = fork();\n\n    if (pid == 0)\n      \
    \  exec(\"/bin/ls\", \"ls\", \"la\", (char*)0);\n    else if (pid < 0)\n     \
    \   printf(\"Error executing fork!\\n\");\n```\n\n```\nelse\n{\n    sleep(2);\n\
    \    printf(\"Hello from the server!\\n\");\n}\n```\n\n```\nreturn 0;\n```\n\n\
    The child process is identical to the calling-parent process except for the following:\
    \ the return value, the file locks set by the parent are closed for the child,\
    \ pending signal variables are cleared for the child, the tms, utime_stime, utime_cutime\
    \ and utime_values of the child\n\nThe subject is a little difficult to understand,\
    \ let's have a look at the following, which presents myfork.c as its output:\n\
    \n```\n#include <unistd.h>\n#include <stdio.h>\n\nint main(int argc, char **argv)\
    \ {\n\n    pid_t pid;\n    pid = fork();\n\n    if (pid == 0)\n        printf(\"\
    This is the child process talking!\\n\");\n    else if (pid < 0)\n        printf(\"\
    There was an error!\\n\");\n    else\n        printf(\"This is the parent process\
    \ talking!\\n\");\n```\n\n```\nreturn 0;\n```\n\n+   Printing the environment\n\
    \nWhen you execute a Linux program, it automatically gets all the environment\
    \ variables from the process - other processes that invoked it. The first argument\
    \ of the main function is the command name of the program. The second is the environment.\
    \ The program also has access to a global environment which is an array of strings\
    \ called environ.\n\nThe following code (c) prints all the environment variables\
    \ of program\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\nextern char **environ;\n\
    \nint main(int argc, char **argv) {\n\n    for (char **env = environ; *env !=\
    \ NULL; ++env)\n        printf(\"%s\\n\", *env);\n    return 0;\n```\n\nThe program\
    \ is executed as usual, until it reaches fork(). At this point, another process\
    \ is created and the parent continues its execution. So you now have two processes\
    \ running. The child process is the child of the parent by calling the return\
    \ value of fork() - this is happening inside the child process. Similarly, the\
    \ parent process understands that it is the parent of the child. The myfork.c\
    \ is the printing of two messages on screen, one from the parent and another from\
    \ the child. The difficulty is that after the message, you get the command prompt\
    \ and then the child prints the message, which happens because the parent does\
    \ not control the message\n\n34"
