    \ arguments: the head of the linked list and the data (value) and return an integer,\
    \ which is 1 in case of success and 0 in case of failure. The insert function\
    \ determines whether the data already exists in the list, in order to make the\
    \ lookup() the most important function of the program.\n\nNo operation on a linked\
    \ list can be completed without traversing it. The traverse() function visits\
    \ all the nodes and writes them to a file that each node occupies a separate line\
    \ and populates the linked list with them. The name of the file is given as a\
    \ command line argument.\n\nAbove Each of the five nodes in the linked list contains\
    \ value and a link to another node\n\n```\ntypedef struct node {\n    char *data;\n\
    \    struct node *next;\n};\n```\n\nThe next pointer of the last node points to\
    \ NULL in order to indicate that we have reached the end of the list. The defined\
    \ structure has only one variable for storing data, but you are free to declare\
    \ numerous variables inside the node structure. The create() function allocates\
    \ the memory for a new node and returns the following:\n\n```\nnew_node = malloc(sizeof(*node));\n\
    if (new_node == NULL) {\n    return 0;\n}\n```\n\nA successful call to malloc\
    \ returns a pointer to the allocated memory. If there is an error, malloc() returns\
    \ NULL. The two lines of code are used for checking the return value of malloc().\
    \ Once a new node is created, you will also need to allocate memory for the data\
    \ because it is a string pointer, which is done with the following:\n\n```\nnew_node->next\
    \ = next;\n*list = new_node;\n```\n\nDownload and free the code in FileSize. Each\
    \ new node is inserted at the front of the unsorted linked list and becomes the\
    \ head of the linked list:\n\nIt is time to take a little bit more about the linked\
    \ list implementation of create.c, which is the base of this tutorial.\n\n# Creating\
    \ a sorted list\n\nLinked lists not help you sort your data easily, but also help\
    \ you keep your data sorted after inserting or deleting. Deleting from an unsorted\
    \ list is the same as above; however, inserting into a sorted list is\n\n# Advantages\
    \ and disadvantages\n\nLinked lists are good for sequential searching, especially\
    \ when there are many insertions and deletions. If the list has many elements,\
    \ the search time of the element can be very slow.\n\nAdditionally, unsorted lists\
    \ can be very slow when searching for an element. An unsorted linked list with\
    \ 150,000 nodes will be very slow! Also, linked lists have an advantage: unlike\
    \ arrays, they can add or remove elements from them.\n\nAs you can appreciate,\
    \ sorted lists have many advantages. However, inserting into a sorted list is\
    \ costly, so to keep your list sorted when possible. However, inserting into a\
    \ sorted list is not easy.\nIf you need to manage a large number of sorted elements\
    \ and to search them fast, then you'd better use a tree structure instead of a\
    \ linked list; the price you are going to pay is that you will lose the simplicity\
    \ of the linked list; however, you will need more memory to create and keep a\
    \ tree or a hash table sorted or balanced."
