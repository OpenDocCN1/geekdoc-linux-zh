  md: '# Reviews


    81 Group test | 86 Steam Machines | 92 Free software


    ![](img/a54b3b473771472dd2321ddda1014be1_80_0.png)


    # GROUP TEST


    # Audio editors


    We''re looking at the most feature-packed and stable audio editors for Linux to
    process, and save dialogue or perhaps compose a simple song


    # Audacity


    One of the most successful open source projects, the branchich of Carnegie Mellon
    University the most renowned digital audio editor and post-processing software
    for many years too early to establish Audacity as a reference point, so we will
    see how others look in front of it first.


    Download: bit.ly/1fFTZmQF


    # Rezound


    Rezound is a lesser-known audio editor, maybe due to the fact that it hasn''t
    been updated for too long, yet it offers a stack of built-in filters and effects.
    LADSPA plugins work great with most popular file formats. We''ll also try to capture
    sound with it and process it for later use.


    Download: bit.ly/1Qqrv15


    # KWave


    It''s certainly simpler than the previous apps, but KWave integrates very well
    into the KDE desktop and handles the capturing, importing and exporting of audio
    beautifully. It has tools for editing your recordings, offers encoder setup, handles
    large files and much more.


    Download: bit.ly/1Nv00hj


    # Sweep


    Another powerful and relatively undiscovered app with capturing and editing capabilities.
    Sweep doesn''t have many filters (although LADSPA plugins can be used), but it
    is easy to use and for navigating inside an audio file. Sweep is also an aging
    software, but still works nicely on modern systems.


    Download: bit.ly/1Z4wQRX'
