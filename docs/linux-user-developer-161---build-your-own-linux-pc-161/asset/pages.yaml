  md: '# OpenSource


    FIRMWARE


    # Dell enables firmware updates within Linux


    The first of a stream of manufacturers making our lives easier


    ![](img/a54b3b473771472dd2321ddda1014be1_5_0.png)


    Dell has confirmed that it has the capacity to sign up to the Linux Vendor Firmware
    Service (LVFS), a project which seems to be the first to update firmware from
    within Linux rather than requiring users to boot into a program.


    metadata you need to manually clear the refresh button in the updates page, so
    far 40,000 people have done it. Given that Colorostro is the only released hardware
    with firmware on the LVFS, 224 downloads is what I expect of magnitude. When it
    comes to Dell (and others I can''t talk about) selling real consumer hardware
    with UEFI support should go up by orders of magnitude.


    Created by Hughes, the LVFS and its associated package became as a means for Hughes''
    Colorostro calibration hardware moved forward as the first to update the firmware
    from within Linux. With membership, the supported method of updating firmware
    from multiple manufacturers first.


    To support these users means improving the LVFS process. From the release in Fedora
    24, the metadata will be automatically refreshed after logging in and it will
    be possible to be notified when new firmware is available. The fwupd included
    in Fedora 24 will also be the first system to support using.


    Dell use of fwupd will benefit with the company''s Dell Edge 5000/5500 Series
    hardware, which the company has been trying through the LVFS. Support is due to
    expand in the future, however:


    > > The project moves forward as a supported method of updating firmware from
    multiple manufacturers from the first time


    "We''ve been that Dell are considering expanding the LVFS to support all new models
    supporting UEFI updates," Hughes in the announcement of the project.

    It''s not just Dell taking an interest in it either. Hughes indicates that many
    other vendors are trailing installing through the service at a time when it was
    unavailable or unable to name names. Currently, usage of the fwupd tool is limited.
    "In November, 224 firmware files were installed or updated on systems using fwupd,"
    Hughes revealed.

    "At the moment, to update the firmware


    within GNOME and to support USB devices adhering to the Dell Firmware Upgrade
    (DFU) standard.


    The development of Fedora and the Linux kernel is supported by Red Hat, which
    offers the service free to all distributions. Dell is currently asking its customers
    to join, as is interest. No formal roadmap for extending its list of hardware
    to use of LVFS has been provided by Dell, however:


    6'
