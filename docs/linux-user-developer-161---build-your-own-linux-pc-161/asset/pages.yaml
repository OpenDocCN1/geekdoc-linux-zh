- pgno: 38
  md: '# Orders and shopfront


    Let us move to the shopfront and see how the orders are managed. The process is
    simple: users visit the shop page and select a product. They can then add the
    items to their cart. Once all added, they click Checkout. On the checkout page,
    users need to fill in the shipping address and select the payment method. Finally
    once the payment is succeeded or if the user selects on delivery, the order is
    completed.


    As you can see, all the orders from WooCommerce Orders are shown here. If you
    have set up the email notification then you also get emails about new orders from
    you. You can also add orders by the backend. Click on Add Order and the next page
    appears, fills in the order details.


    # Reports


    Reports are important to help you understand the business performance of your
    ecommerce venture. Let''s take a look at all the kinds of reports that WooCommerce
    offers out of the box. By going to WooCommerce Reports on the next page that appears,
    you can see three types of different reports.


    In the Orders tab you can see all the reports about sales, sales by product, sales
    by category. In the Customers tab you can see reports about checkouts processed
    by registered users. You can also see the list of customers. The Stock tab allows
    you to see information about quantities of all the products - you can see which
    items are stocked the most and the least, and you can also see out-of-stock items.


    # 08 Coupons


    Another aspect of online shopping is coupons management. Ecommerce websites are
    known for discounts for your own shop too. To do this, you need to implement this
    by enabling coupons in the WooCommerce settings where all the coupons will appear
    at the top of the page. On the next page, you add the coupon details. Coupon code
    and the description fields are self-explanatory. The rest is simple.


    The Discount Type drop-down lets you to set if the code is valid for everything
    or only to a product in the cart. You can choose a fixed amount or percentage
    in the previous drop-down. For a coupon valid for time, you can set the coupon
    expiry date. The Usage section enables you to add restrictions, like individual
    use only, or Usage Limits allows you to restrict the number of times the coupon
    can be used or by a certain user.


    > Above Once set up, WooCommerce provides users with a standard shopping cart
    interface


    ![](img/a54b3b473771472dd2321ddda1014be1_38_0.png)'
