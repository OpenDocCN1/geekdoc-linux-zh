    # INTERVIEW VIKTOR PETTERSSON


    # # Digital signage with Screenly


    ![](img/a54b3b473771472dd2321ddda1014be1_11_0.png)


    The disruptive power of the Raspberry Pi gave Viktor Peterson the opportunity
    to launch a low-cost solution to the problem of effectively driving multiple screens.


    > > **Why did you create Screenly?**nIt was around New Year''s 2012. I stumbled
    into a position where we basically had to create a digital signage solution for
    a company that was acquired. Just before June, when the deal closed, and the first
    of January, roughly, we ended up having a very rough-around-the-edges kind of
    software. So that was really the very first version of Screenly to be, the POC
    [proof of concept] of which ended up being a very rough-around-the-edges kind
    of tools built in Python, bash, and alike of boxed-in Linux.


    Fast-forward about four months or so the Raspberry Pi came along. We were running
    on regularity, the bill of material for each screen was about five hundred dollars.
    Then the Raspberry Pi came along and it was thirty-four bucks per unit. It was
    like, ''Wait a second - this device is so cheap, we could do this at a much cheaper
    price point,?'' So I opened OSE, an open source version of Screenly, posted it
    on the Reddit Forum and then put it on GitHub.


    In this time-frame we basically built Screenly before the Raspberry Pi – and our
    goal was to see what one could do with it. None of them were really up to snuff.
    We looked at them all around and found something that could be relied upon in
    production. So we said, we could do something better than this anyways – just
    needed something simple. Within two weeks we had a prototype that worked.


    We never..., we wrote this for our own needs so we didn''t intend for it to be
    a big product, but it quickly exploded. We posted one post on the Raspberry Pi
    forum and it grew close to 130,000 views, to 700 replies. The funny thing is,
    it is more or less what we needed for Screenly. So I far spent under five hundred
    bucks on marketing!


    **Viktor Peterson**

    co-founded the software company Work.inc where he was still in college, which
