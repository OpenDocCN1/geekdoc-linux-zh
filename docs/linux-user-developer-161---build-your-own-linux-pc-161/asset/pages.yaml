  md: "# # Convert tabs to spaces\n\nLearning about the beauty of text processing\
    \ how to translate a tab into multiple spaces\n\n> The issue we look at this is\
    \ converting a tab to a given number of space characters and versa. This particular\
    \ functionality is often needed in text editors and is often off in programming.\
    \ Two C programs are developed to do this. The number of space characters is provided\
    \ as a command line argument. Similarly, s2t uses a separate function to replace\
    \ spaces with tabs once the number of space characters is provided. You might\
    \ have given 8, 10, as the number of characters and implementation of s2c is easier\
