    # Read-only memory


    The kernel uses memory in many different ways. There are runtime allocations for
    user applications, which are usertasks filesystems, internal kernels, and numerous
    others besides. There is also statically "allocated" memory that is defined in
    the course of the kernel and remains at boottime.


    Some memory is not allocated by the kernel, it is reserved for use by the kernel
    from the moment it begins to execute. This memory often contains regions that
    are written and read again, no matter how long the kernel remains running. Some
    of this memory contains sensitive data, that if modified by bad or rogue code,
    security features aims to reduce the risk of such by making memory regions read
    only.


