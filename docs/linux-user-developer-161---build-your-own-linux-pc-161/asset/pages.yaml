  md: '# Review Audio editors


    # In brief: compare and contrast our verdicts


    # Audacity


    Capturing sound


    The only editor that captures PulseAudio sound from home-made without errors


    Effects and post-processing


    Lots of built-in effects and plugins. Extras can be manually added


    Performance


    Sleeds down on heavy files, but for everyday use


    Multi-track and mastering


    Fine-control options are brilliant for multi-track recording tasks


    Overall


    The most balanced and featured audio editor. Highly recommended


    # Rezound


    Some issues with creaking code. Works okay after tweaking PulseAudio configs


    Basic set of effects. Very dated—like Nineties software


    Very snappy to catch errors, but with large files, the interface tends to crash


    Can switch between tracks with good tools, but cannot play multiple tracks


    Very good after you but not stable or enough for us


    # KWave


    Works flawlessly with ALSA and decency with PulseAudio. Great capturing interface


    Modest set of built-in effects, though for light lights on nature recordings


    Sane defaults but lacks memory swapping.


    Cannot save projects easily. Not suitable for mastering records


    Decent record but a simple editor. Stable for general use, though


    # Sweep


    Poor and half-working audio capturing. Hasn''t been updated in years so needs
    a workaround


    Not focused on professional recording at all—too lightweight for advanced use


    Fast as a genius! Impressive and responsive make up for others


    Like Audacity, but not decentering. No multi-track feature but a decent playground


    Great for recording through long files keeping the simplest of edits


    # AND THE WINNER IS...


    # Audacity


    If we used a time machine and travel back de, the results could be quite different:
    Audacity was not mature at the time, while others of this test group were actively
    maintained and enjoyed bug fixes. But of 2016, only Audacity and KWave were alive
    and keeping the flame. Audacity is clearly the best choice and the only option
    for anyone who wants to do some creative work with multiple audio tracks. You
    can add music background to your podcast or audiobook, also add a section to outro
    revision, adjust voice and master all tracks into one during starting and lagging,
    Audacity runs out of system resource and lagging, but it works to only now


    KWave performed really well and appreciated its clear straightforward interface.
    We can give a voice figure how to use the right input device and then play with
    the various settings. KWave is a simple recording tool, though without tools for
    mixing or mastering a composition, but it works right and is stable.


    ![](img/a54b3b473771472dd2321ddda1014be1_83_0.png)


    Set audio track with ''pulse'' device and it will use your current PulseAudio
    settings


    Rezound and Sweep are both avoid getting into obscurity. They used to record correctly
    in the times when Linux users had Open Sound (OSS) and switching to much more
    advanced API. Now you have to use workloads like papsp in order to enumerate the
    device


    for those legacy readers, it''s still possible to use Rezound and Sweep for simpler
    tasks with wave audio, and particularly liked the Scrub from Sweep for its amazing
    accuracy and speed even with files.


    > Alexander Tolstoy


    84'
