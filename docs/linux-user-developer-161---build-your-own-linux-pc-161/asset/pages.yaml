  md: "# A SIMPLE LINKED LIST\n\n# Head\n\n# Tail\n\n![](img/a54b3b473771472dd2321ddda1014be1_48_0.png)\n\
    \n> Linked lists are generic enough to be used in many different situations\n\n\
