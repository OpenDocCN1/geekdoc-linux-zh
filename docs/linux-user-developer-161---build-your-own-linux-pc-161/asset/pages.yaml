    \ == 0) \n    printf(\"atexit-function_two = failed!\\n\");\n\n```\n\n```\nprintf(\"\
    Exiting main.\\n\");\n    return 0;\n}\n```\n\n+   Process Categories\n\nThere\
    \ are three types of user processes: daemon, kernel, and user. User processes\
    \ run in user space with no special rights, kernel processes are executed in kernel\
    \ space and can fully access all hardware structures. Processes, also called programs\
