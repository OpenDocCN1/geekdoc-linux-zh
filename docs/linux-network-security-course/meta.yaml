    \ --generate-keys -L /etc/tripwire/$(hostname)-local.key\n  twadmin --generate-keys\
    \ -S /etc/tripwire/site.key\n  ```\n  This creates the files named above as arguments.\n\
    \n+   - Designate the configuration file with:\n  ```\n  twadmin --create-cfgfile\
    \ -S /etc/tripwire/site.key \\\n  /etc/tripwire/twcfg.txt\n  ```\n  This creates\
