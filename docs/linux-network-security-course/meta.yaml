  mdcn: "\n## 常用选项（均非强制，大多数选项可以组合使用）：\n\n- `-O` 使用 TCP/IP 指纹识别猜测远程操作系统\n- `-p <range>`\
    \ 要扫描的端口范围。示例：'1-1024,1060,1333,61337'\n- `-F` 仅扫描 `nmap-services` 中列出的端口（快速扫描）\n\
    - `-v` 详细模式。建议使用。使用两次效果更佳。\n- `-P0` 不 ping 主机（扫描 microsoft.com 等其他站点时需要）\n- `-D\
    \ decoy_host1,decoy2,[...]` 使用多个欺骗主机来隐藏扫描\n- `-T {Paranoid|Sneaky|Polite|Normal|Aggressive|Insane}`\
    \ 通用计时策略（Paranoid = 极慢，Insane = 极快）\n- `-n/-R` 永远不进行 DNS 解析 / 始终解析（默认：有时解析）\n\
    - `-oN/-oX/-oG logfile` 将普通/XML/grep 格式的扫描日志输出到 `logfile`\n- `-iL <inputfile>`\
