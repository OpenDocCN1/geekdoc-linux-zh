  md: "# ## 2.7 - Proxy Server 'Squid'\n\n# ### 2.7.1 - Installation\n\nInstallation\
    \ package 'squid' is available on SuSE CDs\n\n# ### 2.7.2 - squid Configuration\n\
    \n+   - Access Control:\n    - acl declarations:\n        - Aliases of src, dstdomain\
    \ (rest is in squidGuard below)\n        - http_access directives\n\n```\n```\n\
    acl verboten dstdomain .whitehouse.com .ebay.de .ebay.com\nacl fingerweg dstdom_regex\
    \ porn sex strip hardcore\nhttp_access deny verboten\nhttp_access deny fingerweg\n\
    ```\n```\n\n+   - Proxying behind another proxy:(Around line 558)\n    (Parent\
    \ Proxy:192.168.10.1)\n\n```\n```\ncache_peer 192.168.10.1 parent 3128 3130 proxy-only\
    \ no-query\n```\n```\n\n+   - Cache control directives:\n\n```\n```\ncache_dir\
    \ ufs /var/cache/squid 100 16 256\n100 = 100 MB Maximum Cache on hard disk\n16\
    \ = 16 Subdirectories (level 1)\n256 = 256 Subdirectories (level 2) per subdir\
    \ of level 1\ncache_mem 16 MB\nmaximum_object_size 4096\n```\n```\n\n+   - Bandwidth\
    \ control\n    **How can I assign different bandwidth to different squid clients?**\n\
    \    Squid has the possibility to limit the http/s/ftp bandwidth via 'delay pools'.\
    \ The procedure is as follows:\n    - Assignment of acl aliases to groups of hosts.\n\
    \    - Create 'delay pools' and assign a class type to each pool.\n    - Assign\
    \ bandwidth parameters to each pool\n    - Assign each acl group to a 'delay pool'.\n\
    \n+   - Recreating the squid cache:\n\n```\n```\nsquid -z\n```\n```\n\n**Example\
    \ No1:**\nWe want to assign two bandwidth:\n- 512kbit/s(64000 Bytes/s) for the\
    \ office hosts\n- 128kbit/s(16000 Bytes/s) for hosts of rest of the company\n\n\
