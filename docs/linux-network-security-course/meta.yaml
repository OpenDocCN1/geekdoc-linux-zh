    \     `or $netzkarte_ADDRESS eg. $eth0_ADDRESS`\n     `or any` \n  2) Configure\
    \ preprocessors (change to do is in underlined here)\n     The preprocessors are\
    \ the intelligent modules that detects certain types of attacks. eg.\n     `preprocessor\
    \ rpc_decode: 111 2049 <--- For NFS`\n     `preprocessor bo: -nobrute` \n  3)\
    \ Configure output plugins. It alerts the syslog with a specific message.\n  \
    \   Syntax: `output alert_syslog:LOG_facility LOG_priority`\n     `eg. output\
    \ alert_syslog: LOG_LOCAL0 LOG_DESTINATION` \n  4) Edit the file `/etc/syslog.conf`\
    \ and set the proper destination for `local0.alert` messages.\n     eg. `local0.alert\
    \ -/var/log/snort.log` \n     and then restart syslog `(rcsyslog restart)`\n \
    \ 5) Customize your rule set as needed (may already be prepared by the distribution)\n\
    \  6) Edit the file `/etc/sysconfig/snort` and set the parameters of the variables\
    \ as needed.\n     `SNORT_INTERFACE=\"ppp0\" or \"$netzkarte\"\n     SNORT_ACTIVATE=\"\
    no\"\n     SNORT_AUTO=\"yes\" Auto IP Number setting of HOME_NET\n     SNORT_PROMISC=\"\
    no\"\n     SNORT_USER=\"snort\"\n     SNORT_GROUP=\"snort\"\n     SNORT_EXTRA_OPTIONS=\"\
    \" <---Extra command line options come here`\n\n+   - To Start/Stop the snort\
    \ Daemon:\n  `rcsnort {start |stop |restart |reload |status |activate |deactivate}`\n\
