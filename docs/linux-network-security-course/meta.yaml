    \ perform the system check.\n  ```\n  tripwire --check\n  ```\n  - This prints\
    \ a report on the standard output and generates the file:\n    `/var/lib/tripwire/report/$HOSTNAME-YYYYMMDD-HHMMSS.twr`"
- md: "## The Tripwire 'Policy' file (from SuSE 8.2 and up)\n\n`/etc/tripwire/twpol.txt`\
    \ - Tripwire text policy file  \nMan page for `/etc/tripwire/twpol.txt`: man twpolicy\
    \  \n\n**Syntax:** `[ |= ] File Dir -> SelectionMask; [#] Comments`\n\n```\neg.\
    \ `/etc` -> `+pinugtsdbcmCM-rlacSH`;\n    `/var/log` -> `$ (Growing);`\n    `/bin`\
    \ -> `$ (ReadOnly);`\n    `!/etc/mtab;`\n    `=/home` -> `$ (ReadOnly); (= One\
    \ dir level)`\n```\n\n## Selection Masks\n\n- Ignore the following properties\
    \  \n- Record and check the following properties  \n- a Access timestamp  \n-\
    \ b Number of blocks allocated  \n- c Inode timestamp (create/modify)  \n- d ID\
    \ of device on which inode resides  \n- g File owner's group ID  \n- i Inode number\
    \  \n- l File is increasing in size (a \"growing file\")  \n- m Modification timestamp\
    \  \n- n Number of links (inode reference count)  \n- p Permissions and file mode\
    \ bits  \n- r ID of device pointed to by inode (valid only for device objects)\
    \  \n- s File size  \n- t File type  \n- u File owner's user ID  \n- C CRC-32\
    \ hash value  \n- H Haval hash value  \n- M MD5 hash value  \n- S SHA hash value\
    \  \n\n## User defined Variables\n\n**Syntax:** `Variablename = SelectionMask`\n\
    \n```\neg. `paramln = +SMCH; # Set variable paramln.` \n    `dirl = /etc/inet;\
    \ # Set variable dirln.` \n    `DIR1 = /etc/init.d; # Variables are case sensitive.`\n\
    ```\n\n## Fixed Mask Variables\n\n- ReadOnly is good for files that are widely\
    \ available but are intended to be read-only. Value: `+pinutgsdbmCM-rlacSH`  \n\
    - Dynamic is good for monitoring user directories and files that tend to be dynamic\
    \ in behavior. Value: `+pinutgd+srlbamCCMSH`  \n- Growing is intended for files\
    \ that should only get larger. Value: `+pinutgdl-srlbamCCMSH`  \n- Device is good\
    \ for devices or other files that Tripwire should not attempt to open. Value:\
    \ `+pugsd r- intlbamCCMSH`  \n- IgnoreAll tracks a file's presence or absence,\
    \ but doesn't check any other properties. Value: `-pinutgsdrlbamCCMSH`  \n- IgnoreNone\
    \ turns on all properties and provides a convenient starting point for defining\
    \ your own property masks. (For example, mymask = $ (IgnoreNone) -ar;) Value:\
    \ `+pinutgsdrbamCCMSH-1`  \n\n## 1.3.3.2 - AIDE (Advanced Intrusion Detection\
    \ Environment)\n\n**Description:** AIDE is composed of only one program and its\
    \ configuration file. `/usr/bin/aide` and `/etc/aide.conf`  \nIt creates a database\
    \ of file and directory attributes that can be used to check the integrity of\
    \ the system at a later date. Unlike Tripwire, it doesn't use encryption methods\
    \ or keys. The database needs to be saved in a secure place, e.g., a USB stick\
    \ mounted on `/mnt/secure`.\n\n**Installation:** Install the `aide` package from\
    \ the SuSE CD.\n\n**Configuration:** Edit `/etc/aide.conf` and change the database\
    \ path:  \n`database=file:/var/lib/aide/aide.db`  \n`database_out=file:/var/lib/aide/aide.db.new`\
    \  \nThe `.new` database is created when a new `aide --init` is run. The rest\
    \ of the parameters in the configuration file set which directories and their\
    \ attribute types are checked. SuSE has already entered the normal settings. More\
    \ info on the configuration by running: `man aide.conf`.\n\n**Initializing the\
    \ file system Database:**  \nIssue the command: `aide --init`\n\n**Checking the\
    \ system against an original database:**  \n- Rename the last created database\
    \ from `aide.db.new` to `aide.db`  \n- Issue the command: `aide --verbose=20 --check\
    \ | tee /mnt/secure/aide.log`  \nProviding that we want the log file to appear\
    \ on the screen and also be saved in a secure place with the databases. Verbose\
    \ level can be from 0 to 255. 20 gives us a workable output.\n\n## 1.4 - Logging\
    \ System\n\n### 1.4.1 - Log server\n\n(55_Log_Files)\n\n- Client Configuration\
    \  \n  `/etc/syslog.conf` → `@logservername`  \n\n- Server Configuration  \n \
    \ `/etc/sysconfig/syslog` → `SYSLOGD_PARAMS=\"-r -s domain\"` (`domain` is the\
    \ name of the domain that should be stripped off the client's name for the line\
    \ to log)  \n\n- Restart `syslogd` of Client and Server:  \n  `rcsyslog restart`\n\
    \n### 1.4.2 - Logcheck (using SuSE Linux)\n\n**Description**  \nLogcheck is composed\
    \ of a script (`logcheck.sh`) that calls a binary program (`logtail`) to check\
    \ for specific patterns based on lists (`logcheck.hacking`, `logcheck.violations`,\
    \ etc). The result is sent to the logcheck admin by email.\n\n**Installation**\
    \  \n- Unpack the `logcheck-x.x.x.tar.gz` to `/usr/local/logcheck-x.x.x`  \n-\
    \ Edit the script: `/usr/local/logcheck-x.x.x/systems/linux/logcheck.sh`. Enter\
    \ the `SYSADMIN` email address and under the RedHat section, check the paths for\
    \ logs. Normally `/var/log/messages` & `/var/log/mail`  \n- `cd /usr/local/logcheck-x.x.x`\
    \  \n- Compile the `logtail` program with the command: `make linux`. The programs\
    \ `logtail` and `logcheck.sh` will be created and copied to: `/usr/local/bin/logtail`\
    \ (logcheck binary program) `/usr/local/etc/logcheck.sh` (main logcheck shell\
    \ script). The following files will also be created and copied:  \n  - `/usr/local/etc/logcheck.hacking`\
    \  \n  - `/usr/local/etc/logcheck.violations`  \n  - `/usr/local/etc/logcheck.violations.ignore`\
    \  \n  - `/usr/local/etc/logcheck.ignore`  \n- Edit the crontab with `crontab\
    \ -e` and include the regular job (each hour): `/usr/local/etc/logcheck.sh`  \n\
    - Make sure the syslog logs all messages (`*.info`) to `allmessages` file.  \n\
    - Results will be reported by email to the `SYSADMIN` address entered in `logcheck.sh`.\
    \ This address can be either a LOCAL user (e.g., `root`) or a full e‑mail address\
    \ (`michel@linuxint.com`).\n\n**Content of keywords files**\n\n- `/usr/local/etc/logcheck.hacking`\
    \ (NOT Case sensitive)  \n  Contains keywords that trigger the special 'ACTIVE\
    \ SYSTEM ATTACK' reporting.\n\n- `/usr/local/etc/logcheck.violations` (NOT Case\
    \ sensitive)  \n  Contains system events keywords that trigger the 'Security Violation'\
    \ reporting.\n\n- `/usr/local/etc/logcheck.violations.ignore` (Case sensitive)\
    \  \n  Contains keywords that force ignoring some of the positive detections provoked\
    \ from the keywords in `logcheck.violations`.\n\n- `/usr/local/etc/logcheck.ignore`\
    \ (Case sensitive)  \n  Contains keywords that when detected will force ignore\
    \ the entry no matter what.\n\n**Search logic**  \n- `logcheck.sh` executes hourly\
    \  \n- `logcheck.sh` executes `logtail` on log files  \n- `logtail` parses any\
    \ text from the last time it was run  \n- Extract text for system attack messages\
    \ (`logcheck.hacking`)  \n- Extract text for security violations (`logcheck.violations`)\
    \  \n- Scan text for security violations to ignore (`logcheck.violations.ignore`)\
    \  \n- Scan text for all messages to ignore (`logcheck.ignore`)  \n- Any messages\
    \ found are e‑mailed to the system administrator (via `sendmail`)  \n- The process\
    \ ensures that ignored messages are filtered, and the rest are reported with the\
    \ title: **ACTIVE SYSTEM ATTACK** or **Security Violation** or **Unusual System\
    \ Events**.\n\n## 2- Network Security\n\n### 2.1 - Check services with Port scanners:\n\
    \n### 2.1.1 - NMAP and XNMAP\n\nInstallation:  \n- Install the `nmap` and `nmap-gtk`\
    \ packages (available on SuSE CD/DVD).\n\n+ Introduction examples:  \n  * `nmap\
    \ -v hostname` – Scan all reserved ports on the host with verbose output (process).\
    \  \n  * `nmap -sS -O 192.168.100.0/24` – Scan the whole subnet with half‑opened\
    \ TCP SYN connections (stealth) and OS detection.  \n  * `nmap -sP '192.168.70.80.*'`\
    \ – Scan for alive hosts using ping.  \n  * `nmap -sX -p 1-1024,6666,6666,31337\
    \ 192.168.100.60` – Perform a Christmas scan of well‑known ports (1‑1024) and\
    \ additional ports on the host.\n\nSyntax:  \n`nmap [Scan_Type(s)] [Options] <host_or_net_list>`\n\
    \nCommon Scan Types (options require root privileges):  \n- `-sT` TCP connect()\
    \ port scan (default)  \n- `-sS` TCP SYN stealth port scan (best all‑around TCP\
    \ scan)  \n- `-sU` UDP port scan  \n- `-sP` ping scan (find reachable machines)\
    \  \n- `-sF, -sX, -sN` stealth FIN, Xmas, or Null scans (experts only)"
  mdcn: "\n## Tripwire “策略”文件（适用于 SuSE 8.2 及更高版本）\n\n`/etc/tripwire/twpol.txt` - Tripwire\
    \ 文本策略文件  \n`/etc/tripwire/twpol.txt` 的帮助页：man twpolicy  \n\n**语法：** `[ |= ] 文件目录\
    \ -> 选择掩码; [#] 注释`\n\n```\n例. `/etc` -> `+pinugtsdbcmCM-rlacSH`;\n    `/var/log`\
    \ -> `$ (Growing);`\n    `/bin` -> `$ (ReadOnly);`\n    `!/etc/mtab;`\n    `=/home`\
    \ -> `$ (ReadOnly); (=一级目录)`\n```\n\n## 选择掩码 (Selection Masks)\n\n- 忽略以下属性  \n\
    - 记录并检查以下属性  \n- a 访问时间戳  \n- b 分配的块数  \n- c Inode 时间戳（创建/修改）  \n- d Inode 所在的设备\
    \ ID  \n- g 文件所有者组 ID  \n- i Inode 节点  \n- l 文件大小正在增大（“增长型文件”）  \n- m 修改时间戳  \n\
    - n 链接数（inode 引用计数）  \n- p 权限和文件模式位  \n- r Inode 指向的设备 ID（仅对设备对象有效）  \n- s 文件大小\
    \  \n- t 文件类型  \n- u 文件所有者 UID  \n- C CRC-32 哈希值  \n- H Haval 哈希值  \n- M MD5 哈希值\
    \  \n- S SHA 哈希值  \n\n## 用户定义变量\n\n**语法：** `变量名 = 选择掩码`\n\n```\n例. `paramln =\
    \ +SMCH; # 设置变量 paramln.` \n    `dirl = /etc/inet; # 设置变量 dirln.` \n    `DIR1\
    \ = /etc/init.d; # 区分大小写.`\n```\n\n## 固定掩码变量 (Fixed Mask Variables)\n\n- ReadOnly（只读）：适用于广泛可用但旨在设计为只读的文件。值：`+pinutgsdbmCM-rlacSH`\
    \  \n- Dynamic（动态）：适用于监控具有动态行为倾向的用户目录和文件。值：`+pinutgd+srlbamCCMSH`  \n- Growing（增长型）：适用于只会变大的文件。值：`+pinutgdl-srlbamCCMSH`\
    \  \n- Device（设备）：适用于 Tripwire 不应尝试打开的设备或其他文件。值：`+pugsd r- intlbamCCMSH`  \n-\
    \ IgnoreAll（忽略所有）：跟踪文件的是否存在，但不检查任何其他属性。\n- IgnoreNone：开启所有属性（例如，mymask = $ (IgnoreNone)\
    \ -ar;）。值：`+pinutgsdrbamCCMSH-1`  \n\n## 1.3.3.2 - AIDE (高级入侵检测环境)\n\n**描述：**\
    \ AIDE 由仅一个程序及其配置文件组成：`/usr/bin/aide` 和 `/etc/aide.conf`。  \n它创建一个文件和目录属性数据库，可用于在日后检查系统完整性。与\
    \ Tripwire 不同，它不使用加密方法或密钥。数据库需要保存在安全的地方，例如挂载在 `/mnt/secure` 的 USB 盘。\n\n**安装：**\
    \ 从 SuSE 光盘安装 `aide` 软件包。\n\n**配置：** 编辑 `/etc/aide.conf` 并更改数据库路径：  \n`database=file:/var/lib/aide/aide.db`\
    \  \n`database_out=file:/var/lib/aide/aide.db.new`  \n当运行新的 `aide --init` 时会创建\
    \ `.new` 数据库。配置文件中的其余参数设置了检查哪些目录及其属性类型。SuSE 已输入正常设置。运行 `man aide.conf` 获取更多信息。\n\
    \n**初始化文件系统数据库：**  \n执行命令：`aide --init`\n\n**根据原始数据库检查系统：**  \n- 将最后生成的 `aide.db.new`\
    \ 重命名为 `aide.db`  \n- 执行命令：`aide --verbose=20 --check | tee /mnt/secure/aide.log`\
    \  \n假设我们希望日志文件显示在屏幕上，并与数据库一起保存在安全的地方。详细级别可以是 0 到 255。20级为我们提供了一个可用的输出。\n\n##\
    \ 1.4 - 日志系统\n\n### 1.4.1 - 日志服务器\n\n(55_Log_Files)\n\n- 客户端配置  \n  `/etc/syslog.conf`\
    \ → `@logservername`  \n\n- 服务器配置  \n  `/etc/sysconfig/syslog` → `SYSLOGD_PARAMS=\"\
    -r -s domain\"` （`domain` 是应从客户端日志行中剥离的域名名称）  \n\n- 重启客户端和服务器的 `syslogd`：  \n\
    \  `rcsyslog restart`\n\n### 1.4.2 - Logcheck (使用 SuSE Linux)\n\n**描述**  \nLogcheck\
    \ 由一个脚本 (`logcheck.sh`) 组成，该脚本调用二进制程序 (`logtail`)，根据列表（`logcheck.hacking`、`logcheck.violations`\
    \ 等）检查特定模式。结果通过电子邮件发送给 logcheck 管理员。\n\n**安装**  \n- 将 `logcheck-x.x.x.tar.gz`\
    \ 解压到 `/usr/local/logcheck`\n\n（注：由于原文文本在“以下是需要翻译的英文文本”之后的内容似乎不完整，我已翻译了提供的所有内容。若有额外的英文部分，请提供。）\n"
