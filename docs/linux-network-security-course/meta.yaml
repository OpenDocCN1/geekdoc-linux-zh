    ```\n\n# ----------- LOGGING -----------\n\n# Protokolliert alle restliche Pakete\
    \ (syslog; kernel.warn)\n\n```\niptables -A OUTPUT -j LOG --log-prefix \"END-OUTPUT\
    \ TABLE \"\n```"
