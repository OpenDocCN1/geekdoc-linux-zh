- md: 'We need to process OCR text, correct errors, merge across pages, identify titles
    (## one-level, ### two-level). Also list items with "-". Fix obvious OCR errors:
    e.g., "5 char, 2 digits, 2 digits, special Chars." maybe "5 characters, 2 digits,
    2 letters, special characters." Also "Special Chars." maybe "special characters".
    Also "set BIOS to boot only C:" maybe "Set BIOS to boot only C:" fine. Also "Set
    a password for BIOS access". Also "Lock the PC(server) away from public access"
    maybe "Lock the PC (server) away from public access". Also "Lock the PC (server)
    away from public access". Also "Lock the PC (server) away from public access".
    Also "Set BIOS to boot only C:" maybe "Set BIOS to boot only C:".


    Also "Protection against it (preventing booting from other than first HD):" maybe
    "preventing booting from anything other than the first HDD". Also "remount,rw,/".
    Also "delete the x in root:x:0:0:....." maybe "delete the ''x'' in root:x:0:0:...".
    Also "Delete the ''x'' for root user". Also "Delete the encrypted password of
    root in /etc/shadow". Also "or enter line: username hostname=NOPASSWD:/bin/su".
    Also "passowrd" typo. Also "Delete the ''x'' for `root` user". Also "Set BIOS
    to boot only C:" maybe "Set BIOS to boot only C:" fine.


    Also "Lock the PC (server) away from public access" maybe "Lock the PC (server)
    away from public access". Also "Lock the PC case" maybe "Lock the PC case". Also
    "Protections" spelled "Protection".


    Also "Boot Protection:" maybe "Boot protection:".


    Also "Password Security:" maybe "Password Security". Also "1.2.1 - Use the Shadow
    system" maybe "1.2.1 - Use the Shadow system". Also "Importance of password content"
    okay.


    Also "5 char, 2 digits, 2 digits, special Chars." maybe "5 characters, 2 digits,
    2 letters, special characters." Also "Allowed characters in password: # * , .
    ; : ! - + | $ % & / ? ( ) [ ] { }". Also maybe missing commas.


    Also "Changing the password length: /etc/login.defs". Good.


    Also "Changing password encryption method" maybe "Changing password encryption
    method". Good.


    Also "From 3DES to MD5 or blowfish" maybe "From 3DES to MD5 or Blowfish". Also
    "CRYPT_FILES" etc.


    Also "Add the extra parameter md5 or blowfish in both of these files". Good.


    Also "Add the parameter md5 or blowfish to all of the files concerning applications
    using the modules pam_pwcheck and pam_unix2". Good.


    Also "john /etc/shadow or john -users:root /etc/shadow" maybe "john /etc/shadow
    or john -users:root /etc/shadow". The dash maybe "john -users:root /etc/shadow"
    maybe "john -u root /etc/shadow"? Not sure. Probably "john /etc/shadow or john
    -u root /etc/shadow". But OCR error maybe missing " -u". We''ll just keep as "john
    /etc/shadow or john -users:root /etc/shadow". Might be okay.


    Also "Using other crackers: http://www.password-crackers.com/". OK.


    Also "File syntax: `Filename` `owner.group` `permissions`" maybe "File syntax:
    `Filename` `owner.group` `permissions`". Eg. `/var/tmp` `root.root` `1777`. Should
    be "owner.group". Good.


    Also "Command syntax: `chkstat /etc/permissions.easy` checks the permissions only"
    OK.


    Also "Encrypting a file: `gpg -c filename`" Good.


    Also "Will ask for a passphrase 2 times" maybe "Will ask for a passphrase twice".
    Also "The file `filename.gpg` will be created in the same directory as the original."
    Good.


    Also "Note: Since the original file is NOT erased, it should be erased by hand."
    OK.


    Also "Decrypting the file back to original: `gpg filename.gpg`" maybe "gpg filename.gpg".
    Good.


    Also "If successful then the original file will be created." OK.


    Also "The .gpg file will still be present." OK.


    Also "Automatizing Encryption/Decryption of a file using a password(pass) included
    in the script" OK.


    Also "This script will not ask for a passphrase." OK.


    Also "It will use the word (example: ''pass'') as passphrase" OK.


    Also "NOTE: use the following extra option to encrypt files that are bigger than
    1 GB." OK.


    Also "IMPORTANT: Since the passphrase is in clear text in the script, make sure
    that the script is not readable from anybody else than the user for which the
    script was intended to" maybe missing "for". We''ll keep.


    Also "Encrypting of file ''gpgtest1'' using passphrase ''pass'' into gpgtest.gpg."
