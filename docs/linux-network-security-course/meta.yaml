    # 2.10 Extra Tips and Tricks


    # 2.10.1- Securely sending Mail from laptop to Internet via Wireless LAN


    The saga of "how can I securely send mail from my laptop when it''s plugged in
    to someone else''s network" continues. If you run a wireless network, you probably
    block port 25 to keep people from using your network for spamming. The problem
    is how do you make an outgoing SMTP connection from your laptop when you travel
    to other people''s wireless networks?"


    Miek Gieben has an elegant answer based on Postfix and OpenSSH. Set up Postfix
    on the laptop to use localhost and a high port as its relayhost, then tunnel that
    high port to port 25 on your mail server. Details and config file entries for
    the basic method are here: http://www.miek.nl/linux/postfix.html.


    The problem: you have a laptop and you''re not always connected to the Internet.
    Still you want to sent mail even when you''re offline. You cannot just use any
    mail server out there, ''cause a lot of them don''t relay. So you must use your
    own mail server.


    You''ll need:


    +   - postfix only used for queuing and forwarding the mail

    - openSSH for setting up a tunnel OpenSSH config


    You will need to create a ssh tunnel to your mail server. This is the command
    I use:


    ```

    ssh -2 -N -f -L 10025:elektron.atoom.net:25

    miekg@elektron.atoom.net 2>/dev/null

    ```


    Of course you also want to setup ssh so that you can login without typing a password.


    postfix config

    Next you must tell postfix to use your''re tunnel. It is also important to keep
    postfix from doing MX lookups. In the main.cf of postfix add the following:


    ```

    relayhost = [127.0.0.1]:10025 # use the tunnel, no MX lookups

    defer_transports = smtp # only send when online

    mydestination = localhost.localdomain # not sure if this is needed

    ```


    system config

    Put the startup commands in /etc/dhclient-exit-hooks. This way every time you
    get a IP number from a dhcp-server the tunnel is re-established and the mail is
    flushed.


    ```

    /etc/dhclient-exit-hooks:


    # start an ssh tunnel to elektron

    ssh -2 -N -f -L 10025:elektron.atoom.net:25 \

    miekg@elektron.atoom.net 2>/dev/null

    ```'
  - '[PAGE 50]


    ```

    # run the mailqueue

    /usr/sbin/sendmail -q

    ```


    Also make a cronjob that runs every now and then to then to flush the queue:


    ```

    # run queue every 5 minutes

    */5 * * * * root test -x /usr/sbin/sendmail # && \

    nice -n10 /usr/sbin/sendmail -q

    ```


    That''s it. Mail should now be queued until it can be delivered via your own mail
    server.


    For security, though, you don''t want to let people log in to your OpenSSH server
    as you without a passphrase. So, instead of using your main OpenSSH identity for
    the tunnel, add a user called tunnel to the OpenSSH server and make a tunnel-only
    SSH key on the laptop with this command:


    ```

    ssh-keygen -t dsa -f tunnel

    ```


    In the file `tunnel.pub`, add the following options to the beginning of the line:
    `command="/bin/false",no-X11-forwarding,no-agent-forwarding,no-pty` and then copy
    the contents of `tunnel.pub` to the end of the tunnel user''s `~/.ssh/authorized_keys`
    file on the OpenSSH server.


    If you can run only `/bin/false` and you can''t forward X or the SSH agent, what''s
    left? Port forwarding. Add `-i tunnel` to Miek''s instructions to use the tunnel,
    and replace `miekg@` with `tunnel@`.'
