    \ and their type of attributes checks. SuSE has already entered the normal settings.\
    \ \n  More info on the configuration by running: `man aide.conf`\n\n+   - **Initializing\
    \ the file system Database:**\n  Issue the command: `aide --init`\n\n+   - **Checking\
    \ the system against an original database:**\n  - Rename the last created database\
    \ from `aide.db.new` to `aide.db` \n  - Issue the command:\n    `aide --verbose=20\
    \ --check | tee /mnt/secure/aide.log` \n    Providing that we want the log file\
    \ to appear on the screen and also be saved in a secure place with the databases.\
    \ \n    Verbose level can be from 0 to 255. 20 gives us a workable output."
  - "[PAGE 11]\n\n# 1.4 - Logging System\n\n# 1.4.1 - Log server\n\n(55_Log_Files)\n\
    \n+   - Client Configuration\n  `/etc/syslog.conf` $\\longrightarrow$ `@logservername`\n\
    \n+   - Server Configuration\n  `/etc/sysconfig/syslog` $\\longrightarrow$ `SYSLOGD_PARAMS=\"\
    -r -s domain\"` (`domain` is the name of the domain that should be stripped off\
    \ the client's name for the line to log)\n\n+   - Restart `syslogd` of Client\
    \ and Server:\n  `rcsyslog restart`\n\n# 1.4.2 - Logcheck (using SuSE Linux)\n\
    \n+   - **Description**\n  Logcheck is composed of a script (`logcheck.sh`) that\
    \ calls a binary program (`logtail`) to check for specific patterns based on lists\
    \ (`logcheck.hacking`, `logcheck.violations`, etc). The result is sent to the\
    \ logcheck admin by email.\n\n+   - **Installation**\n  - Unpack the `logcheck-x.x.x.tar.gz`\
    \ to `/usr/local/logcheck-x.x.x`\n  - Edit the script: `/usr/local/logcheck-x.x.x/systems/linux/logcheck.sh`.\
    \ Enter the `SYSADMIN` email address and under the RedHat section, check the paths\
    \ for logs. Normally `/var/log/messages` & `/var/log/mail`\n  - `cd /usr/local/logcheck-x.x.x`\n\
    \  - Compile the `logtail` program with the command: `make linux`. The program\
    \ `logtail` and `logcheck.sh` will be created and copied to: `/usr/local/bin/logtail`\
    \ (logcheck binary program) `/usr/local/etc/logcheck.sh` (main logcheck shell\
    \ script). The following files will also be created and copied: (see details below)\n\
    \    - `/usr/local/etc/logcheck.hacking`\n    - `/usr/local/etc/logcheck.violations`\n\
    \    - `/usr/local/etc/logcheck.violations.ignore`\n    - `/usr/local/etc/logcheck.ignore`\n\
    \  - Edit the crontab with `crontab -e` and include the regular job (each hour):\
    \ `/usr/local/etc/logcheck.sh`\n  - Make sure the syslog logs all messages (`*.info`)\
    \ to `allmessages` file.\n  - Results will be reported by email to the `SYSADMIN`\
    \ address entered in `logcheck.sh`. This address can be either LOCAL user (eg.\
    \ `root`) or a full e-mail address(`michel@linuxint.com`)\n\n+   - Content of\
    \ keywords files."
  - "[PAGE 12]\n\n```\n/usr/local/etc/logcheck.hacking\t(NOT Case sensitive)\nContains\
    \ keywords that triggers the special 'ACTIVE SYSTEM ATTACK' reporting.\n```\n\n\
    ```\n/usr/local/etc/logcheck.violations\t(NOT Case sensitive)\nContains system\
    \ events keywords that triggers the 'Security Violation' reporting.\n```\n\n```\n\
    /usr/local/etc/logcheck.violations.ignore\t(Case sensitive)\nContains keywords\
    \ that force ignoring some of the positive detections provoked from the keywords\
    \ in logcheck.violations.\n```\n\n```\n/usr/local/etc/logcheck.ignore\t(Case sensitive)\n\
    Contains keywords that when detected will force ignore the entry no matter what.\n\
    ```\n\n+   * The search logic:\n  -logcheck.sh executes hourly\n  -logcheck.sh\
    \ executes logtail on log files\n  -logtail parses off any text from the last\
    \ time it was run -->\n  -extract text for system attack messages (logcheck.hacking)-->\n\
    \  -extract text for security violations (logcheck.violations)-->\n  -scans text\
    \ for security violations to ignore (logcheck.violations.ignore) -->\n  -scans\
    \ text for all messages to ignore (logcheck.ignore) -->\n  any messages found\
    \ are e-mailed to system administrator --> sendmail\n\nThis process makes sure\
    \ that all messages that should be ignored are, and the rest is reported with\
    \ the title: ACTIVE SYSTEM ATTACK or 'Security Violation' or 'Unusual System Events'.\n\
    \n# 2- Network Security\n\n# 2.1 - Check services with Port scanners:\n\n# 2.1.1\
    \ - NMAP and XNMAP\n\nInstallation:\npackage nmap and nmap-gtk (on SuSE CD/DVD)\n\
    \n+   Introduction examples:\n* nmap -v hostname\n  Scan all reserved ports on\
    \ the host with verbose on process(-v)\n* nmap -sS -O 192.168.100.0/24\n  Scan\
    \ the whole Subnet with half opened connections:\n  TCP SYN stealth(-sS) with\
    \ Operating system detection (-O)\n* nmap -sP '192.168.70.80.*'\n  Scan with pings\
    \ (search for alive hosts)\n* nmap -sX -p 1-1024,6666,6666,31337 192.168.100.60\n\
    \  Christmas scan of all well known ports (1-1024) and some extras of host\n\n\
    Syntax:\nnmap [Scan_Type(s)] [Options] <host_or_net_list>\n\n+   Common Scan Types\
    \ (*options require root privileges)\n-sT TCP connect() port scan (default)\n\
    * -sS TCP SYN stealth port scan (best all-around TCP scan)\n* -sU UDP port scan\n\
    -sP ping scan (Find any reachable machines)\n* -sF,-sX,-sN Stealth FIN, Xmas,\
    \ or Null scan (experts only)"
- md: "## Common Options (none are required, most can be combined):\n\n- `-O` Use\
    \ TCP/IP fingerprinting to guess remote operating system\n- `-p <range>` Ports\
    \ to scan. Example range: '1-1024,1060,1333,61337'\n- `-F` Only scans ports listed\
    \ in `nmap-services` (fast scans)\n- `-v` Verbose. Its use is recommended. Use\
    \ twice for greater effect.\n- `-P0` Don't ping hosts (needed to scan microsoft.com\
    \ and others)\n- `-D decoy_host1,decoy2,[...]` Hide scan using many decoys\n-\
    \ `-T {Paranoid|Sneaky|Polite|Normal|Aggressive|Insane}` General timing policy\
    \ (Paranoid = slow, Insane = fast)\n- `-n/-R` Never do DNS resolution / Always\
    \ resolve (default: sometimes resolve)\n- `-oN/-oX/-oG logfile` Output normal/XML/grepable\
    \ scan logs to `logfile`\n- `-iL <inputfile>` Get targets from file; use '-' for\
    \ stdin\n- `-S your_IP/-e devicename` Specify source address or network interface\n\
    \nExample:\n\n```bash\nnmap -v --sS -O www.my.com 192.168.0.0/16 '192.168.0.0/16'\n\
    ```\n\nExamples extracted from `nmap`:\n\n```bash\nnmap -v target.example.com\n\
    ```\n\nThis option scans all reserved TCP ports on the machine `target.example.com`.\
    \ The `-v` means turn on verbose mode.\n\n```bash\nnmap -sS -O target.example.com/24\n\
    ```\n\nLaunches a stealth SYN (`-sS`) scan against each machine that is out of\
    \ the 255 machines on class \"C\" where `target.example.com` resides. It also\
    \ tries to determine what operating system (`-O`) is running on each host that\
    \ is up and running. This requires root privileges because of the SYN scan and\
    \ the OS detection.\n\n```bash\nnmap -sX -p 22,53,110,143,4564 198.116.*.1-127\n\
    ```\n\nSends an Xmas tree scan (`-sX`) to the first half of each of the 255 possible\
    \ 8 bitsubnets in the 198.116 class \"B\" address space. We are testing whether\
    \ the systems run sshd, DNS, pop3d, impad, or port to 4564. Note that Xmas scan\
    \ doesn't work on Microsoft boxes due to their deficient TCP stack. Same goes\
    \ with CISCO, IRIX, HP/UX, and BSDI boxes.\n\n```bash\nnmap -v --randomize_hosts\
    \ -p 80 *.*.2-3.5\n```\n\n### XNMAP or NMAPFE\n\n- If started as normal user,\
    \ only ABOVE-ROOT options are allowed.\n- Enter the target host or host range\n\
    \  eg. `192.168.0.0/16` or `'192.88.90.*.*'`\n- Select the desired options and\
    \ click on SCAN button.\n- Note: The `nmap` command that will be run in the background\
    \ and its parameters are shown under the options after: `Output from:`\n\n###\
    \ 2.1.2 - NESSUS (Advanced port scanner/attack simulator)\n\n- Installation Packages:\
    \ `nessus-core`, `nessus-libraries`, `libnasl`\n\nComposition of Nessus:\n- The\
    \ daemon `nessusd` (it also authenticates users from the client.)\n- The client\
    \ (`nessus` X-program which controls the `nessus` daemon.)\n\nCreating Nessus\
    \ daemon users (must also exist in system):\n- `nessus-adduser <Enter>`\n- `Login:\
    \ michel`\n- `Authentication (pass/cert) [pass]: <Enter>`\n- `Login Password:\
    \ xxxxxx (nessus password, not the system password for that user)`\n- `Enter access\
    \ rules here`\n- `eg. accept 192.168.100.0/24 <Enter>`\n- `default deny <Enter>`\n\
    - `Ctrl-D creates 2 files in user's home dir: .nessusrc .nessusrc.cert`\n\nNOTE:\
    \ In SuSE 9.2 it produces an error.\n\ntrap: usage: trap [-lp] [[arg] signal_spec\
    \ ...]\nrm: cannot remove '/var/tmp/nessus-adduser.12239': is a directory\nINTERRUPT\n\
    \n## IGNORE THE ERROR\n\n- Creating Certificates:\n  NOTE for SUSE 9.2: we must\
    \ comment out (add a #) line 394 (trap 0) in /usr/sbin/nessus-mkcert\n- Command\
    \ to produce an SSL certificate:\n  - nessus-mkcert <Enter>\n  - Answer all the\
    \ questions by pressing <Enter> except for Country and Location.\n  The certificate\
    \ files will be created in :\n  Certification authority :\n    Certificate = /var/lib/nessus/CA/cacert.pem\n\
    \    Private key = /var/lib/nessus/CA/cakey.pem\n  Nessus Server :\n    Certificate\
    \ = /var/lib/nessus/CA/servercert.pem\n    Private key = /var/lib/nessus/CA/serverkey.pem\n\
    \nStarting nessus Daemon\n`nessusd -D`\n\n- Starting Nessus Client: Log in as\
    \ the user and start the nessus client:\n  - Give the name and password of a nessus\
    \ user and click on LOGIN\n  - Click on the third option and accept the Certificate.\n\
    \n- Starting the port scanning:\n  - Select the `Target Selection` tab\n  - Click\
    \ the `Enable all but dangerous plugins` button\n  - Enter the hostname or IP\
    \ of the host to scan.\n  - Click on `Start the scan...this can last a long time....`\n\
    \n- Results: When scan is finished, the window will change:\n  - Click on the\
    \ icon on the left panel to see the report on the right\n  - To save the report:\n\
    \    - Set the Report file format to HTML\n    - Under Selection give the filename\
    \ and click OK\n    - Use a Browser to look at the results in this created HTML\
    \ file\n  - Check also the `/var/log/messages` on the scanned host and see ..\n\
    \n- Nessus command options:\n  - `nessusd -D` Starts the nessusd as daemon\n \
    \ - `nessusd -p 1241` nessusd listens on Port 1241 (default)\n\n- Nessus administration:\n\
    \  - `nessus-adduser` Allows to add a nessus user\n  - `nessus-rmuser username`\
    \ Allows to remove a nessus user\n  - `nessus-mkcert` Allows to create a new nessus\
    \ certificate.\n\n### 2.1.3 - SAINT (Security Administrator's Integrity Network\
    \ Tool):\n\nWhat is SAINT:\nSaint is the more evolved follower of the port scanner\
    \ `satan`\n\nInstallation:\n- Install the `saint` package from CD\n\nStarting\
    \ Saint:\n- As `root`, start the saint with the command: `saint`\n- If it doesn't\
    \ want to start, then edit its configuration file: `/usr/lib/saint/config/saint.cf`\
    \ and add in:\n  - The default browser will start with the `saint` page: `file:///localhost/usr/lib/saint/html/saint.html`\n\
    \nScan with Saint:\n- Click on Target Selection button (on left pane)\n- Enter\
    \ the target hostname in `Primary target selection`\n- Select the scan level in\
    \ `Scanning level selection`\n- If behind a firewall select the 'Firewall Support'\
    \ option in: `Firewall Support`\n- Click on `Start the scan` button.\n- Progress\
    \ of the scan will be shown.\n- When finished, to see the report, click on one\
    \ of the links: [Continue with report and analysis](URL) or [View primary target\
    \ results](URL)\n\n## 2.2 - Monitoring system intrusions:\n\n### 2.2.1 - NIDS\
    \ - SNORT - Network Intrusion Detection System (SuSE 8.2 and up)\n\n- Installation\
    \ of `snort` package is from SuSE CD\n- SuSE 8.2 has version 1.9.1\n- Debian 'Woody'\
    \ has version 1.8.4\n\nConfiguring snort: Edit the `/etc/snort/snort.conf` and:\n\
    - Set the network variables for your network: `var HOME_NET $ppp0_ADDRESS` or\
    \ `$netzkarte_ADDRESS` (e.g., `$eth0_ADDRESS`) or `any`\n- Configure preprocessors\
    \ (e.g., `preprocessor rpc_decode: 111 2049` for NFS, `preprocessor bo: -nobrute`)\n\
    - Configure output plugins: `output alert_syslog:LOG_facility LOG_priority` (e.g.,\
    \ `output alert_syslog: LOG_LOCAL0 LOG_DESTINATION`)\n- Edit `/etc/syslog.conf`\
    \ to set the proper destination for `local0.alert` messages (e.g., `local0.alert\
