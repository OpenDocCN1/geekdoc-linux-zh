    # dsl_qos_queue


    This program implements a user space QUEUE processor which controls outbound traffic
    over a DSL modem using a pseudo- token-bucket-style queue with starvation protection.


    Main feature of this outbound rate limiter is it''s ability to rate limit based
    on the calculated raw bandwidth used rather than just the IP bandwidth used. This
    provides a MUCH more accurate way to prevent packet queuing in the network device
    (in this case, ADSL modem). Please report any problems you have to me.

    This has been tested on Redhat 7.3. You must be using `iptables`.

    You must have `libipq` installed to compile. (attempting to avoid this requirement
    by supplying my compiled `libipq.a` in the distribution package.)


    Package now includes a compiled binary for i386 Linux 2.4.x

    Version 0.9.2 updated to improve stability. See README for more details.

    Download here: `dsl_qos_queue-0.9.2.tar.gz` - v0.9.2


    If you''re trying to control bandwidth in Windows, try this:

    `http://www.bandwidthcontroller.com`'
