    To Start/Stop the snort Daemon:\n`rcsnort {start |stop |restart |reload |status\
    \ |activate |deactivate}` starts with parameters: `-d $SNORT_INTERFACE $PROMISC\
    \ -l /var/log/snort -u $SNORT_USER -g $SNORT_GROUP -c /etc/snort/snort.conf $SNORT_EXTRA_OPTIONS`\
