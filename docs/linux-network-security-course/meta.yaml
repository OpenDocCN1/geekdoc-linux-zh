  md: "# ## 2.5 - Secure Communications\n\n# ### 2.5.1 - SSH, SCP and RSYNC\n\n(90_SSH\
    \ - SCP)\n\n+   - Telnet and ssh differences\n- Public and Private keys principle\n\
    \    - Host keys\n        `/etc/ssh/ssh_host_rsa_key`\n        `/etc/ssh/ssh_host_rsa_key.pub`\n\
