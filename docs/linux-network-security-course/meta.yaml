    \ ENDE von NFS ÜBUNG ####################\n\n# ---------- DROP JUNK BEFORE LOGGING\
    \ -----------\n\n# Verhindert, dass die Protokolldatei mit Boradcasts gefüllt\
    \ wird\n\n```\niptables -A INPUT -i \\$netcard -p udp -s \\$lan1 -d \\$full_broadcast\
    \ -j DROP\n```\n\n# Verwirft alle Pakete von ungueltigen neuen Verbindungen {SYN-->DROP}\n\
