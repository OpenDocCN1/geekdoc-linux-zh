  md: "# 2.4 - Closing all unused open services (61_TCP_IP_Services)\n\n+   - Check\
    \ Open Ports:\n  `netstat -tunap` \n  Shows all the open `tcp` and `udp` ports(numeric)\
    \ with Programs PID\n  or\n  `lsof -Pni4` \n  Shows all the server and client\
    \ ports numbers used in system\n  Options:\n  `P=Port numbers instead of port\
    \ names` \n  `n=no Reverse resolving of IP Addresses` \n  `i4=IP Version 4 only`\n\
    \n+   - Super Daemon `inetd` services\n  - Set the values in the tcpwrapper (`tcpd`)\
    \ in `/etc/hosts.allow` and `/etc/hosts.deny` to disallow some hosts access to\
    \ certain inetd services.\n\n+   - Tcpwrappers\n  The tcpwrappers are programs\
    \ that uses configuration files to check if the client host is allowed to use\
    \ the requested service. One commonly used tcpwrapper is `tcpd`. It uses the `/etc/hosts.allow`\
    \ and `/etc/hosts.deny` files for this purpose. They contain a listing of the\
    \ hosts concerned for each requested service. Here is the logic: If none of the\
    \ two files exists, then all of the hosts are allowed to use all watched services.\n\
    \n  The access control software consults two files. The search stops at the first\
    \ match:\n  - Access will be granted when a (daemon,client) pair matches an entry\
    \ in the `/etc/hosts.allow` file.\n  - Otherwise, access will be denied when a\
    \ (daemon,client) pair matches an entry in the `/etc/hosts.deny` file.\n  Otherwise,\
    \ access will be granted.\n  The command:\n  `tcpdchk` \n  examines your tcp wrapper\
    \ configuration and reports all potential and real problems it can find. The program\
    \ examines the tcpd access control files (by default, these are `/etc/hosts.allow`\
    \ and `/etc/hosts.deny`), and compares the entries in these files against entries\
    \ in the `inetd` or `tldid` network configuration files.\n\n+   - Recommendations\n\
    \  - Run this super daemon only if needed or\n  - Disable all unused services\
    \ as described in the following sections:\n\n+   - Super Daemon `xinetd` services\n\
    \  - Run this super daemon only if needed or\n  - Disable all unused services\
    \ by editing the services files in `/etc/xinetd.d/` and making sure: `disable\
    \ = yes`\n\n+   - Runlevels services\n  Start YAST2 Run Level Editor and disable\
    \ all unused services from runlevels."
