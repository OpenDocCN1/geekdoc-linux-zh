    \ counter variable---\nnetnum=1\n> /tmp/sping\n# ----------------- ping them all\
    \ almost at the same time (sent as separate jobs)\nfor ip in $allips; do\n   \
    \ /bin/ping -c1 -wl -c1 $ip 1>>/tmp/sping &\n    let netnum++\ndone\n# -----------------\
    \ wait a bit to let some answers back\nsleep 2\n# ----------------- Kill all the\
    \ ping that are still waiting -----\nkillall ping &> /dev/null\n# -----------------\
    \ Show only the pings that received an answer ---\ngrep '64 bytes from' /tmp/sping\
    \ | cut -d: -f1 | cut \"-d\" \"-f4 \\\n| sort -t. -k4n\nexit 0\n```\n```"
  - "[PAGE 23]\n\n# pping script\n\n```\n#!/bin/bash\n\n# ------------------- Port\
    \ Pinger -------------------\n# Name:      pping\n# Purpose:   Pings ports of\
    \ hosts by sending SYN packets\n#            and waiting for an answer\n# Syntax1:\
    \   pping HostAddr PortNr\n# Syntax2:   pping NetAddr/CIDRNetmask PortNr\n# Author:\
    \    Michel Bisson (www.linuxinsxt.net)\n# Date:      04.10.2004\n# Note:    \
    \  Needs to be ROOT and uses nmap port scanner program\n#\n# ------------------\
    \ Allow only 2 arguments. No more no less. -------------------\nif [ \"$#\" -ne\
    \ 2 ] ; then\n    echo \"ERROR: Bad number of arguments. Must be 2 arguments\"\
    \n    echo \"Syntax: pping HostAddr PortNr or pping NetAddr/Netmask PortNr\"\n\
    \    exit 1\nfi\n\n# ------------------ Allow only numeric Port Number -------------------\n\
    \n# -- Use the numeric port number or find the port number\nin /etc/services\n\
    if ! ( echo $2 | egrep \"^([0-9]{1,5})$\" &>/dev/null ) ; then\n    port=$ (expand\
    \ /etc/services /services | grep \"^$2 .*tcp\" | awk '{ print $2 }' | cut -d/-f1)\n\
    \    if [ ! \"$port\" ] ; then\n        echo \"ERROR: Bad port number or port\
    \ name\"\n        echo \"Syntax: pping HostAddr PortNr or pping NetAddr/Netmask\
    \ PortNr\"\n        exit 1\n    else\n        port=$2\n    fi\nfi\n\n# ---\nif\
    \ ( echo $1 | grep \"/\" &>/dev/null ) ; then\n    # ---------------- Filter the\
    \ result so that I get only one line per Host\n    result=$ (nmap -n --host_timeout\
    \ 210 --max_rtt_timeout 210 -p $port -P0 $1 | egrep \"Interesting|open\" | sed\
    \ 's/$/#/')\n    IFS=\"#\"\n    for i in $result ; do\n        if (echo $i | grep\
    \ \"Interesting\" &>/dev/null) ; then\n            IP=$(echo -n $i | awk '{ print\
    \ $4 }' awk)\n        else\n            echo -n $i : $IP | sed -e 's/ open //'\
    \ -e 's/:/$://'\n        fi\n    done\nelse\n    # ---------------- Show the result\
    \ of the host poking on that port\n    nmap -n --host_timeout 210 --max_rtt_timeout\
    \ 210 -p $port -P0 $1 \\\n         | grep \"open\" | sed -e 's/ open //'\nfi\n\
    echo\n```"
  - "[PAGE 24]\n\n# 2.4 - Closing all unused open services (61_TCP_IP_Services)\n\n\
    +   - Check Open Ports:\n  `netstat -tunap` \n  Shows all the open `tcp` and `udp`\
    \ ports(numeric) with Programs PID\n  or\n  `lsof -Pni4` \n  Shows all the server\
    \ and client ports numbers used in system\n  Options:\n  `P=Port numbers instead\
    \ of port names` \n  `n=no Reverse resolving of IP Addresses` \n  `i4=IP Version\
    \ 4 only`\n\n+   - Super Daemon `inetd` services\n  - Set the values in the tcpwrapper\
    \ (`tcpd`) in `/etc/hosts.allow` and `/etc/hosts.deny` to disallow some hosts\
    \ access to certain inetd services.\n\n+   - Tcpwrappers\n  The tcpwrappers are\
    \ programs that uses configuration files to check if the client host is allowed\
    \ to use the requested service. One commonly used tcpwrapper is `tcpd`. It uses\
    \ the `/etc/hosts.allow` and `/etc/hosts.deny` files for this purpose. They contain\
    \ a listing of the hosts concerned for each requested service. Here is the logic:\
    \ If none of the two files exists, then all of the hosts are allowed to use all\
    \ watched services.\n\n  The access control software consults two files. The search\
    \ stops at the first match:\n  - Access will be granted when a (daemon,client)\
    \ pair matches an entry in the `/etc/hosts.allow` file.\n  - Otherwise, access\
    \ will be denied when a (daemon,client) pair matches an entry in the `/etc/hosts.deny`\
    \ file.\n  Otherwise, access will be granted.\n  The command:\n  `tcpdchk` \n\
    \  examines your tcp wrapper configuration and reports all potential and real\
    \ problems it can find. The program examines the tcpd access control files (by\
    \ default, these are `/etc/hosts.allow` and `/etc/hosts.deny`), and compares the\
    \ entries in these files against entries in the `inetd` or `tldid` network configuration\
    \ files.\n\n+   - Recommendations\n  - Run this super daemon only if needed or\n\
    \  - Disable all unused services as described in the following sections:\n\n+\
    \   - Super Daemon `xinetd` services\n  - Run this super daemon only if needed\
    \ or\n  - Disable all unused services by editing the services files in `/etc/xinetd.d/`\
    \ and making sure: `disable = yes`\n\n+   - Runlevels services\n  Start YAST2\
    \ Run Level Editor and disable all unused services from runlevels."
