  md: "+   - **When Squid starts:**\n    - Squid reads the `/etc/host.conf` to find\
    \ the sequence of name resolve\n    - If *order hosts bind* then it takes a snapshot\
    \ of the `/etc/hosts`\n    - it then checks if the directive `dns_nameservers`\
    \ exist in `/etc/squid.conf`\n    - if yes then it uses these DNS Servers for\
    \ name resolution\n    - otherwise it uses the `/etc/resolv.conf` if it exists.\n\
    \    - It then starts some DNS-Serving-Daemons called [dnsserver]\n\n+   - **How\
    \ can I purge an object from my cache?**\n\nSquid does not allow you to purge\
    \ objects unless it is configured with access controls in `squid.conf`. First\
    \ you must add something like\n\n```\n```\nacl PURGE method purge\nacl localhost\
    \ src 127.0.0.1\nhttp_access allow purge localhost\nhttp_access deny purge\n```\n\
    ```\n\nThe above only allows purge requests which come from the local host and\
    \ denies all other purge requests.\n\nTo purge an object, you can use the client\
    \ program:\n\n```\n```\nclient -m PURGE http://www.miscreant.com/\n```\n```\n\n\
    If the purge was successful, you will see a ``200 OK`` response:\n\n```\n```\n\
    HTTP/1.0 200 OK\nDate: Thu, 17 Jul 1997 16:03:32 GMT\nServer: Squid/1.1.14\n```\n\
    ```\n\nIf the object was not found in the cache, you will see a ``404 Not Found``\
    \ response:\n\n```\n```\nHTTP/1.0 404 Not Found\nDate: Thu, 17 Jul 1997 16:03:22\
    \ GMT\nServer: Squid/1.1.14\n```\n```"
