  md: "# # 1 - System Security\n\n# ## 1.1 - System recovery.\n\n# ### 1.1.1 - Emergency\
    \ Recovery\n\n(81_Emergency_Recovery)\n\n+   - **Boot Protection:**\n    - Lock\
    \ the PC(server) away from public access\n    - in BIOS:\n        - Set BIOS to\
    \ boot only C:\n        - Set a password for BIOS access\n    - in BOOT LOADER\n\
    \n+   - System recovery (unknown root password or bad `/etc/fstab`) via:\n   \
    \ - Using another system:\n        - Boot Diskette, Rescue diskette, Live CD,\
    \ second installed system\n        - Protection against it (preventing booting\
    \ from other than first HD):\n            - Locked PC case\n            - BIOS\
    \ Boot device set to C: only & BIOS password\n    - Using Boot kernel option (in\
    \ LILO/GRUB) `init= `/bin/bash`\n    - Remount the root directory: `mount -o remount,rw,/`\n\
    \    - `vi /etc/passwd --> delete the x in root:x:0:0:.....`\n    - `umount -a\
    \ and reboot with <Ctrl-Alt-Del>`\n\n+   - Protection against it:\n    - in `/etc/lilo.conf`\
    \ (if using LILO)\n        `restricted and password = \"xxxxxxx\"` or\n    - in\
    \ `/boot/grub/menu.lst` (if using GRUB)\n        `password = \"xxxxxxx\"` in the\
    \ global section.\n        If the booting also needs to be authenticated then\
    \ insert\n        `lock` immediately at the line after each title to limit access.\n\
    \        GRUB will expect to press 'p' before entering the password.\n\n+   -\
    \ What to change to login as root without password:\n    - Delete the 'x' for\
    \ `root` user in `/etc/passwd` or\n    - Delete the encrypted password of root\
    \ in `/etc/shadow`\n    - or enter line: `username hostname=NOPASSWD:/bin/su in\
    \ /etc/sudoers`. Reboot, login as user and enter:\n        `sudo su` (username\
    \ is a user with known passowrd)\n\n+   - Disable the `<Ctrl-Alt-Del>` in `/etc/inittab`\n\
    \n+   - Make boot and emergency disks (boot and rescue)\n\n# ## 1.2 - Passwords\
    \ Security:\n\n+   - 1.2.1 - Use the Shadow system\n    - `/etc/passwd` and `/etc/shadow`\
    \ concept and format\n\n1.2.2 - Importance of password content"
  merge: -1
  pgno: 4
- img_proc: true
  md: "+   - Recommended composition: 5 char, 2 digits, 2 digits, special Chars.\n\
    - Allowed characters in password:\n  `# * , . ; : ! - + | $ % & / ? ( ) [ ] {\
    \ }`\n\n# 1.2.4 - Changing the password length: `/etc/login.defs`\n\n```\nPASS_MAX_LEN\
    \ 16\nPASS_MIN_LEN 8\n```\n\n# 1.2.5 - Changing password encryption method\n\n\
    From 3DES to MD5 or blowfish\n\n+   - Change the value of `CRYPT_FILES` in `/etc/default/passwd`\n\
    \  Possible values: `des`, `md5`, `blowfish`\n  eg. `CRYPT_FILES=md5`\n\n+   -\
    \ For SuSE, use Yast to change the security options\n  `'Security and Users' --->\
    \ 'Security Settings'`\n\n+   - Add the extra parameter `md5` or `blowfish` in\
    \ both of these files:\n  `/etc/security/pam_pwcheck.conf`\n  `/etc/security/pam_unix2.conf`\n\
    \  eg. password: `md5 nullok`\n\n+   - Add the parameter `md5` or `blowfish` to\
    \ all of the files concerning\n  applications using the modules `pam_pwcheck`\
    \ and `pam_unix2`\n  eg. in `/etc/pam.d/login`\n  `password required pam_pwcheck.so\
    \ md5 nullok`\n  and in `/etc/pam.d/passwd`\n  `password required pam_unix2.so\
    \ md5 nullok`\n\n# 1.2.6 - Cracking passwords:\n\n+   - Using john:\n  Using john:\n\
    \  `john /etc/shadow or john -users:root /etc/shadow`\n\n+   - Using other crackers:\n\
    \  `http://www.password-crackers.com/`\n\n# 1.3 - File System security\n\n# 1.3.1\
    \ - Access rights settings:\n\n+   - SUID, SGID, StickyBit, acls and attributes\
