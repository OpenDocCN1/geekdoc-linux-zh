    \ HTTPS\n- (11)开放客户端 FTP（被动模式）和 FTP 服务器\n- (15)开放某些 ICMP（从几十个地方传输文本？）\n- (12)丢弃\
    \ INPUT 攻击和不必要的数据包：隐身扫描、无效数据包 (INVALID)、全广播 (DHCP)。\n- (11)结合类规则（使用嗅探器）处理 Windows\
    \ 共享\n- (16)练习：发现并进入：HTTP 服务器、SMTP、POP、NFS。\n"
