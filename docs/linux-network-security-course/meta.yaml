    ```

    #!/bin/bash

    #

    # Set the following values to somewhat less than your actual download

    # and uplink speed. In kilobits

    # I have a 256k up 64k up ADSL. 55 seem to work quite well..

    UPLINK=55

    DEV=ppp0


    # clean existing down and uplink qdiscs, hide errors

    tc qdisc del $DEV root 2> /dev/null > /dev/null

    tc qdisc del $DEV ingress 2> /dev/null > /dev/null


    # install root HTB, point default traffic to 1:20:

    tc qdisc add $DEV root handle 1: default 20


    # shape everything at $UPLINK speed - this prevents hgue queues in your

    DSL modem.

    tc class add $DEV parent 1: classid 1:1 htb rate ${UPLINK}kbit burst 6k

    # high prio class 1:10:

    tc class add $DEV parent 1:1 classid 1:10 htb rate ${UPLINK}kbit

    burst 6k prio 1


    # Default class 1:20 - gets slightly less traffic, and a lower priority:

    tc class add $DEV parent 1:1 classid 1:20 htb rate

    [($9*${UPLINK}/10)]kbit burst 6k prio 2


    # Bulk - ftp outgoing mail etc.

    tc class add $DEV parent 1:1 classid 1:30 htb rate

    [($9*${UPLINK}/10)]kbit burst 6k prio 3


    # both get Stochastic Fairness:

    tc qdisc add $DEV parent 1:10 handle 10: sfq perturb 10

    tc qdisc add $DEV parent 1:20 handle 20: sfq perturb 10

    tc qdisc add $DEV parent 1:30 handle 30: sfq perturb 10


    # TOS Minimum Delay (ssh, NFS, scp) in 1:10:

    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \

    match ip tos 0x10 Off flowid 1:10


    # ICMP (ip protocol 1) in the interactive class 1:10

    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \

    match ip protocol 1 0xff flowid 1:10


    # To speed up downloads while an upload is going on, put ACK packets in

    the interactive class:

    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \

    match ip protocol 6 0xff \

    match u8 0x05 0x0f at 0 \

    match u8 0x0000 0xffc0 at 2 \

    match u8 0x20 0x20 0xff at 33 \

    flowid 1:10


    # Bulk Filter

    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \

    match ip tos 0x2 0xff \

    flowid 1:30


    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \

    match ip tos 0x8 0xff \

    flowid 1:30


    NOTE: you will need to patch your kernel with the htb patch for the above queues
    to work. I''m also told it already in

    the 2.4.20-pre x kernels You can also monitor the queues with the command

    watch -n 1 tc -s qdisc show dev ppp0

    ```'
