  mdcn: "\n## 2.5 - 安全通信\n\n### 2.5.1 - SSH, SCP 和 RSYNC\n\n- Telnet 和 ssh 的区别\n-\
    \ 公钥与私钥原理\n  - 主机密钥 (Host keys)\n    - /etc/ssh/ssh_host_rsa_key\n    - /etc/ssh/ssh_host_rsa_key.pub\n\
    \  - 用户密钥 (User Keys)\n    - ssh-keygen -t rsa\n    - ~/.ssh/id_rsa\n    - ~/.ssh/id_rsa.pub\n\
    \    - ~/.ssh/known_hosts\n    - ~/.ssh/authorized_keys\n\n- 使用 `ssh` 隧道单个端口\n\
    \  `ssh -2 sun.linux.local -L 7772:sun.linux.local:80`\n\n- `scp` 和 `rsync`:\n\
    \  `scp -prvr server:/path localpath`\n  `rsync -e ssh -vazuH server:path localpath`\n\
    \n- 使用 X-程序和 `ssh` 隧道进行远程管理\n  `xhost +`\n  `ssh -X user@remoteserver`\n  `remote-program`\n\
    \n### 2.5.2 - VPN - 虚拟专用网络\n\n参见文档 `99_VPN.sxw`\n\n## 2.6 - 防火墙：\n\n### 2 - 防火墙基础：IPTABLES\
    \ 流程图\n\n# IPTABLES - 本地进程的数据包传输\n\n# IPTABLES - 本地进程通过规则链的数据包传输（策略设置为 DROP）\n\
    \n# IPTABLES - 转发包的传输\n\n（策略设置为 DROP）\n\n# ipchains 和 iptables 的流程图\n\n# 五个规则表：Prerouting,\
    \ Input, Forward, Output, Postrouting\n\n## 防火墙墙\n- 复制基础初始化脚本 (`Klasse_Firewall`)\n\
    - 在 `Klasse_Firewall` 脚本中：\n  - 加载 iptables 模块（SuSE 8.2 之后不需要）\n  - (1)本地变量：LAN、代理地址、代理端口等\n\
    \  - (2)设置表策略：启动时设置为 DROP，停止时设置为 ACCEPT\n  - (3)清空表：`iptables -F`\n  - (4)开放 `lo`\
