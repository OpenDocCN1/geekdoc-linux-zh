    # dsl_qos_queue


    此程序实现了一个用户空间队列处理器，通过使用带有饥饿保护的伪令牌桶（pseudo-token-bucket）队列来控制 DSL 调制器的出站流量。


    此出站速率限制器的主要功能是可以根据计算的实际原始带宽进行限速，而不仅仅是使用的 IP 带宽。这提供了一种更准确的方法来防止网络设备（在本例中为 ADSL
    调制器）出现数据包队列。如有任何问题请向我报告。


    程序已在 Redhat 7.3 上测试过。你必须使用 `iptables`。编译时必须安装 `libipq`。（我尝试通过在分发包中提供我编译好的 `libipq.a`
    来规避这一需求。）


