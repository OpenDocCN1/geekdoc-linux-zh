  md: "# pping script\n\n```\n#!/bin/bash\n\n# ------------------- Port Pinger -------------------\n\
    # Name:      pping\n# Purpose:   Pings ports of hosts by sending SYN packets\n\
    #            and waiting for an answer\n# Syntax1:   pping HostAddr PortNr\n#\
    \ Syntax2:   pping NetAddr/CIDRNetmask PortNr\n# Author:    Michel Bisson (www.linuxinsxt.net)\n\
    # Date:      04.10.2004\n# Note:      Needs to be ROOT and uses nmap port scanner\
    \ program\n#\n# ------------------ Allow only 2 arguments. No more no less. -------------------\n\
    if [ \"$#\" -ne 2 ] ; then\n    echo \"ERROR: Bad number of arguments. Must be\
    \ 2 arguments\"\n    echo \"Syntax: pping HostAddr PortNr or pping NetAddr/Netmask\
    \ PortNr\"\n    exit 1\nfi\n\n# ------------------ Allow only numeric Port Number\
    \ -------------------\n\n# -- Use the numeric port number or find the port number\n\
    in /etc/services\nif ! ( echo $2 | egrep \"^([0-9]{1,5})$\" &>/dev/null ) ; then\n\
    \    port=$ (expand /etc/services /services | grep \"^$2 .*tcp\" | awk '{ print\
    \ $2 }' | cut -d/-f1)\n    if [ ! \"$port\" ] ; then\n        echo \"ERROR: Bad\
    \ port number or port name\"\n        echo \"Syntax: pping HostAddr PortNr or\
    \ pping NetAddr/Netmask PortNr\"\n        exit 1\n    else\n        port=$2\n\
    \    fi\nfi\n\n# ---\nif ( echo $1 | grep \"/\" &>/dev/null ) ; then\n    # ----------------\
    \ Filter the result so that I get only one line per Host\n    result=$ (nmap -n\
    \ --host_timeout 210 --max_rtt_timeout 210 -p $port -P0 $1 | egrep \"Interesting|open\"\
