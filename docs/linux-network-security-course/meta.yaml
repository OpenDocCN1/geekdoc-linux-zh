    # Table of TOS codes to Band number for the *pflfo_fast* classless queue:


    | TOS | Bits | Means | Linux Priority | Band |

    |---|---|---|---|---|

    | 0x0 | 0 | Normal Service | 0 Best Effort | 1 |

    | 0x2 | 1 | Minimize Monetary Cost | 1 Filler | 2 |

    | 0x4 | 2 | Maximize Reliability | 0 Best Effort | 1 |

    | 0x6 | 3 | mmc+mr | 0 Best Effort | 1 |

    | 0x8 | 4 | Maximize Throughput | 2 Bulk | 2 |

    | 0xa | 5 | mmc+mt | 2 Bulk | 2 |

    | 0xc | 6 | mr+mt | 2 Bulk | 2 |

    | 0xe | 7 | mmc+mr+mt | 2 Bulk | 2 |

    | 0x10 | 8 | Minimize Delay | 6 Interactive | 0 |

    | 0x12 | 9 | mmc+md | 6 Interactive | 0 |

    | 0x14 | 10 | mr+md | 6 Interactive | 0 |

    | 0x16 | 11 | mmc+mr+md | 6 Interactive | 0 |

    | 0x18 | 12 | mt+md | 4 Int. Bulk | 1 |

    | 0x1a | 13 | mmc+mt+md | 4 Int. Bulk | 1 |

    | 0x1c | 14 | mr+mt+md | 4 Int. Bulk | 1 |

    | 0x1e | 15 | mmc+mr+mt+md | 4 Int. Bulk | 1 |


    # iptables command for TOS control


    | Option | --set-tos |

    |---|---|

    | Example | `iptables -t mangle -A PREROUTING -p TCP --dport 22 -j TOS --set-tos
    0x10` |

    | Descrip. | The `--set-tos` option tells the **TOS** mangler what TOS value to
    set on packets that are matched. The option takes a numeric value, either in hex
    or in decimal value. As the TOS value consists of 8 bits, the value must be 0-255,
    or in hex its 0x00-0xFF. Note that in the standard TOS target you are limited
    using the named values available (which should be more or less standardized),
    as mentioned in the previous warning. These values are:


    `Normal-Service` (decimal value 0, hex value 0x00)

    `Minimize-Cost` (decimal value 2, hex 0x02)

    `Maximize-Reliability` (decimal value 4, hex value 0x04)

    `Maximize-Throughput` (decimal value 8, hex value 0x08)

    `Minimize-Delay` (decimal value 16, hex value 0x10)


    The default value on most packets are `Normal-Service`, or 0. Note that you can,
    of course, use the actual names instead of the actual hex values to set up the
    TOS value, and it should generally be recommended since the values behind the
    names may be changed if you are unlucky. For a complete listing of the "descriptive
    values", do an `iptables -j TOS -h`. This is complete as of iptables 1.2.5 and
    should hopefully be so for another period of time. |


    To view the number of packets being modified by the TOS:


    ```

    iptables -t mangle -L PREROUTING -v -X -x 2 > /dev/null

    ```'
- md: "# dsl_qos_queue\n\nThis program implements a user space queue processor which\
    \ controls outbound traffic over a DSL modem using a pseudo-token-bucket-style\
    \ queue with starvation protection.\n\nMain feature of this outbound rate limiter\
    \ is its ability to rate limit based on the calculated raw bandwidth used rather\
    \ than just the IP bandwidth used. This provides a MUCH more accurate way to prevent\
    \ packet queuing in the network device (in this case, ADSL modem). Please report\
    \ any problems you have to me.\n\nThis has been tested on Redhat 7.3. You must\
    \ be using `iptables`. You must have `libipq` installed to compile. (attempting\
    \ to avoid this requirement by supplying my compiled `libipq.a` in the distribution\
    \ package.)\n\nPackage now includes a compiled binary for i386 Linux 2.4.x\nVersion\
    \ 0.9.2 updated to improve stability. See README for more details.\nDownload here:\
    \ `dsl_qos_queue-0.9.2.tar.gz` - v0.9.2\n\nIf you're trying to control bandwidth\
    \ in Windows, try this:\n`http://www.bandwidthcontroller.com`\n\n## Full implementation\
    \ of TOS modifications\n\nI have left a few sections commented out, as I'm not\
    \ sure if I need them.\n\niptables -t mangle -A PREROUTING -p tcp --dport 23 -j\
    \ TOS --set-tos Minimize-Delay\niptables -t mangle -A PREROUTING -p tcp --sport\
    \ 23 -j TOS --set-tos Minimize-Delay\niptables -t mangle -A PREROUTING -p tcp\
    \ --dport 25 -j TOS --set-tos Minimize-Delay\niptables -t mangle -A PREROUTING\
    \ -p tcp --sport 25 -j TOS --set-tos Minimize-Delay\niptables -t mangle -A PREROUTING\
    \ -p tcp --dport 20 -j TOS --set-tos Maximize-Throughput\niptables -t mangle -A\
    \ PREROUTING -p tcp --sport 20 -j TOS --set-tos Maximize-Throughput\niptables\
    \ -t mangle -A PREROUTING -p tcp --dport 21 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p udp --dport 53 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p udp --sport 53 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 25 -j TOS --set-tos Minimize-Cost\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 110 -j TOS --set-tos Normal-Service\n\
    iptables -t mangle -A PREROUTING -p icmp -j TOS --set-tos Minimize-Delay\niptables\
    \ -t mangle -A PREROUTING -p tcp --dport 143 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 4000 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p udp --dport 4000 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 6666:6667 -j TOS --set-tos Minimize-Delay\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 1214 -j TOS --set-tos Minimize-Cost\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 6699 -j TOS --set-tos Minimize-Cost\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 6700 -j TOS --set-tos Minimize-Cost\n\
    iptables -t mangle -A PREROUTING -p tcp --dport 1412 -j TOS --set-tos Maximize-Throughput\n\
    iptables -t mangle -A PREROUTING -p tcp --sport 1412 -j TOS --set-tos Maximize-Throughput\n\
    iptables -t mangle -A PREROUTING -p udp --dport 4000:7000 -j TOS --set-tos Minimize-Delay\n\
    \nI have also put together a simple but quite effective QoS script which you may\
    \ want to put into your path under /etc/ppp/ppp-up script\n\nThis script was put\
    \ together from a number of other scripts I found on the internet.\nI'm sure it\
    \ could be improved as I learned about Linux QoS about 3 hours ago and its my\
    \ first real attempt, but it does seem to work quite well. With a large FTP upload\
    \ going, real-time traffic is just about real-time and webpages come down with\
    \ only a small delay.\n\n#!/bin/bash\n#\n# Set the following values to somewhat\
    \ less than your actual download and uplink speed. In kilobits\n# I have a 256k\
    \ up 64k up ADSL. 55 seems to work quite well.\nUPLINK=55\nDEV=ppp0\n\n# clean\
    \ existing downstream and upstream qdiscs, hide errors\ntc qdisc del $DEV root\
    \ 2> /dev/null > /dev/null\ntc qdisc del $DEV ingress 2> /dev/null > /dev/null\n\
    \n# install root HTB, point default traffic to 1: default 20:\ntc qdisc add $DEV\
    \ root handle 1: default 20\n\n# shape everything at $UPLINK speed - this prevents\
    \ huge queues in your DSL modem.\ntc class add $DEV parent 1: classid 1:1 htb\
    \ rate ${UPLINK}kbit burst 6k\ntc class add $DEV parent 1:1 classid 1:10 htb rate\
    \ ${UPLINK}kbit\nburst 6k prio 1\n\n# Default class 1:20 - gets slightly less\
    \ traffic, and a lower priority:\ntc class add $DEV parent 1:1 classid 1:20 htb\
    \ rate (($9*${UPLINK}/10))kbit burst 6k prio 2\n\n# Bulk - ftp outgoing mail etc.\n\
    tc class add $DEV parent 1:1 classid 1:30 htb rate (($9*${UPLINK}/10))kbit burst\
    \ 6k prio 3\n\n# both get Stochastic Fairness:\ntc qdisc add $DEV parent 1:10\
    \ handle 10: sfq perturb 10\ntc qdisc add $DEV parent 1:20 handle 20: sfq perturb\
    \ 10\ntc qdisc add $DEV parent 1:30 handle 30: sfq perturb 10\n\n# TOS Minimum\
    \ Delay (ssh, NFS, scp) in 1:10:\ntc filter add dev $DEV parent 1:0 protocol ip\
    \ prio 10 u32 \\\nmatch ip tos 0x10 0xff flowid 1:10\n\n# ICMP (ip protocol 1)\
    \ in the interactive class 1:10\ntc filter add dev $DEV parent 1:0 protocol ip\
    \ prio 10 u32 \\\nmatch ip protocol 1 0xff flowid 1:10\n\n# To speed up downloads\
    \ while an upload is going on, put ACK packets in\n# the interactive class:\n\
    tc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \\\nmatch ip protocol\
    \ 6 0xff \\\nmatch u8 0x05 0x0f at 0 \\\nmatch u8 0x0000 0xffc0 at 2 \\\nmatch\
    \ u8 0x20 0x20 0xff at 33 \\\nflowid 1:10\n\n# Bulk Filter\ntc filter add dev\
    \ $DEV parent 1:0 protocol ip prio 10 u32 \\\nmatch ip tos 0x2 0xff \\\nflowid\
    \ 1:30\n\ntc filter add dev $DEV parent 1:0 protocol ip prio 10 u32 \\\nmatch\
    \ ip tos 0x8 0xff \\\nflowid 1:30\n\nNOTE: you will need to patch your kernel\
    \ with the htb patch for the above queues to work. I'm also told it is already\
    \ in the 2.4.20-pre kernels. You can also monitor the queues with the command\
    \ watch -n 1 tc -s qdisc show dev ppp0\n\n## 2.6.12 - Firewall GUIs\n\n- `webmin`\
    \ (Very good)\n- `fwbuilder` (Object oriented)\n- `jay's firewall generator`\n\
    \n### 2.7 - Proxy Server 'Squid'\n\n### 2.7.1 - Installation\n\nInstallation package\
    \ 'squid' is available on SuSE CDs\n\n### 2.7.2 - squid Configuration\n\n- Access\
    \ Control:\n  - acl declarations:\n    - Aliases of src, dstdomain (rest is in\
    \ squidGuard below)\n    - http_access directives\n\n- Proxying behind another\
    \ proxy: (Parent Proxy:192.168.10.1)\n\n- Cache control directives:\n  - cache_dir\
    \ ufs /var/cache/squid 100 16 256\n    100 = 100 MB Maximum Cache on hard disk\n\
    \    16 = 16 Subdirectories (level 1)\n    256 = 256 Subdirectories (level 2)\
    \ per subdir of level 1\n  cache_mem 16 MB\n  maximum_object_size 4096\n\n- Bandwidth\
    \ control\n  How can I assign different bandwidth to different squid clients?\n\
    \  Squid has the possibility to limit the http/s/ftp bandwidth via 'delay pools'.\
    \ The procedure is as follows:\n  - Assignment of acl aliases to groups of hosts.\n\
    \  - Create 'delay pools' and assign a class type to each pool.\n  - Assign bandwidth\
    \ parameters to each pool\n  - Assign each acl group to a 'delay pool'.\n\n- Recreating\
    \ the squid cache:\n  squid -z\n\n- Example No1:\n  We want to assign two bandwidth:\n\
    \  - 512kbit/s(64000 Bytes/s) for the office hosts\n  - 128kbit/s(16000 Bytes/s)\
    \ for hosts of rest of the company\n\nConfiguration in `/etc/squid.conf`:\n\n\
    \  acl office_hosts src 192.168.71.10 192.168.71.44 192.168.71.242\n  acl intranet\
    \ src 192.168.71.0/255.255.255.0"
