    + Record and check the following properties\na Access timestamp\nb Number of blocks\
    \ allocated\nc Inode timestamp(create/modify)\nd ID of device on which inode resides\n\
    g File owner's group ID\ni Inode number\nl File is increasing in size (a \"growing\
    \ file\")\nm Modification timestamp\nn Number of links (inode reference count)\n\
    p Permissions and file mode bits\nr ID of device pointed to by inode (valid only\
    \ for device objects)\ns File size\nt File type\nu File owner's user ID\nC CRC-32\
    \ hash value\nH Haval hash value\nM MD5 hash value\nS SHA hash value\n\n# User\
    \ defined Variables\n\n**Syntax:** `Variablename = SelectionMask`\n\n```\neg.\
    \ `paramln = +SMCH; # Set variable paramln.` \n    `dirl = /etc/inet; # Set variable\
    \ dirln.` \n    `DIR1 = /etc/init.d; # Variables are case sensitive.`\n```"
  - "[PAGE 10]\n\n```\n$ (dirl)    -> +tbmacs;   # Left hand substitution.\n/etc /inet\
    \ -> $ (paraml); # Right hand substitution.\n$ (DIRL)   -> $ (paraml); # Double\
    \ substitution.\n```\n\n# Fixed Mask Variables\n\nReadOnly\tReadOnly is good for\
    \ files that are widely available but are intended to be read-only. Value: `+pinutgsdbmCM-rlacSH`\n\
    \nDynamic\tDynamic is good for monitoring user directories and files that tend\
    \ to be dynamic in behavior. Value: `+pinutgd+srlbamCCMSH`\n\nGrowing\tThe Growing\
    \ variable is intended for files that should only get larger. Value: `+pinutgdl-srlbamCCMSH`\n\
    \nDevice\tDevice is good for devices or other files that Tripwire should not attempt\
    \ to open. Value: `+pugsd r- intlbamCCMSH`\n\nIgnoreAll\tIgnoreAll tracks a file's\
    \ presence or absence, but doesn't check any other properties. Value: `-pinutgsdrlbamCCMSH`\n\
    \nIgnoreNone\tIgnoreNone turns on all properties and provides a convenient starting\
    \ point for defining your own property masks.\n(For example, mymask = $ (IgnoreNone)\
    \ -ar;)\nValue: `+pinutgsdrbamCCMSH-1`\n\n# 1.3.3.2 - AIDE (Advanced Intrusion\
    \ Detection Environment)\n\n+   - **Description:** Aide is composed of only one\
    \ program and its configuration file. `/usr/bin/aide` and `/etc/aide.conf`\nIt\
    \ creates a database of file and directories attributes that can be used to check\
    \ the integrity of the system at a later date. Unlike Tripwire, it doesn't use\
    \ encryption methods or keys. The database needs to be saved in a secure place.\
    \ eg. usb-stick mounted on `/mnt/secure`\n\n+   - **Installation:** Package aide\
    \ from SuSE CD\n\n+   - **Configuration:** \n  Edit the file `/etc/aide.conf`\
    \ and change the database path:\n  `database=file:/var/lib/aide/aide.db` \n  `database_out=file:/var/lib/aide/aide.db.new`\
    \ \n  The .new database is created when a new aide `--init` is run. The rest of\
