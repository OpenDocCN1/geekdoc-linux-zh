    \ well. with a large FTP upload going, real-time traffic is just about real-time\
    \ and webpages come down with only a small delay.\n\nThe basic idea with the firewall\
    \ and QoS script is to generate 3 queues.\nReal-time: For all protocols which\
    \ transfer small amounts of data and need to be as close to real-time as possible.\n\
    Normal: This is for normal traffic www packets, pop etc.\nBulk Traffic: For all\
    \ protocols which you don't want affecting your normal day to day web browsing.\
    \ Outgoing mail, ftp uploads, p2p programs like kazza or DC.\n\nI'm not doing\
    \ any QoS on downloaded packets as I feel its not very effective unless the ISP\
