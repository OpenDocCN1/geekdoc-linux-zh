    因此，你可以将有用信息传递给一个程度智能的 CGI 页面：

    `http://proxy/cgi/SquidGuard?clientaddr=%a&clientname=%n&clientident=%i&clientgroup=%s&destinationgroup=%t&url=%u`

    首先，源码树的 `samples/samples/SquidGuard.cgi` 中有一个此类脚本示例。


    ## 域名列表 (Domain lists)


    domainlist 文件格式仅为换换符分隔的域名/区域名。这些列表的长度对性能的影响可以忽略不计。


    例如，一个金融类别的开始：


    ```

    amex.com

    asx.com.au

    bourse-de-paris.fr

    exchange.de

    londonstockex.co.uk

    nasdaq.com

    nyse.com

    ose.no

    tse.or.jp

    xse.se

    ```


    **注意：** `squidGuard` 将匹配任何包含域名本身的 URL 以及任何子域名和主机名（例如 `i.e.amex.com`、`www.amex.com`、`whatever.amex.com`
    以及 `www.what.ever.amex.com`，但不是 `.*[^.].amex.com` (例如 `i.e.aamex.com` 等）。


    ## URL 列表 (URLlists)


    urllist 文件格式仅为换行符分隔的 URL，但会切掉 `"proto://((www|web|ftp)[0-9]*)?"` 和 `"(:port)?"`
    部分，并且通常还会切掉结尾的 `"(/|\.[^/])^ [^/]*"` 部分（即以 `"/"` 或 `"filename"` 结尾）。

    例如 `"http://www3.foo.bar.com:8080/what/ever/index.html"` => `"foo.bar.com/what/ever"`


    例如，一个禁站站点分类：


    ```

    foo.com/-badguy

    bar.com/whatever/suspect

    ```


    **注意：** 上述移除的部分会被 squidGuard 在 URL 匹配时忽略。

    因此，所有这些 URL 将匹配上述 url 列表：


    ```

    http://foo.com/-badguy

    http://foo.com/-badguy/whatever

    ftp://foo.com/-badguy/whatever

    wais://foo.com/-badguy/whatever

    http://www2.foo.com/-badguy/whatever

    http://web56.foo.com/-badguy/whatever

    ```


    但**不匹配**：


    ```

    http://barfoo.com/-badguy

    http://bar.foo.com/-badguy

    ```


    http://foo.com/~goodguy


    ## 表达式列表 (Expressionlists)


    expressionlist 文件格式类似于 regex(5) 中描述的正则表达式。最感兴趣的是：


    - `.` 匹配任意单个字符（使用 `\.` 匹配 `.`）。

    - `[abc]` 匹配字符中的任意一个（`[abc]` 匹配单个 "a" 或 "b" 或 "c"）。

    - `[c-g]` 匹配范围内的字符之一（`[c-g]` 匹配单个 "c" 或 "d" 或 "e" 或 "f" 或 "g"）。

    - `[a-z0-9]` 匹配任意单个字母或数字。

    - `[-/.:?]` 匹配任意单个 `-` 或 `/` 或 `.` 或 `:` 或 `?`。

    - `?` 匹配零或一个前述字符（`"words?"` 会匹配 "word" 和 "words"）。

    - `[abc]?` 匹配单个 "a" 或 "b" 或 "c" 或空（即 ""）。

    - `*` 匹配零或多个前述字符（`"words*"` 会匹配 "word"、words" 和 "words"）。

    - `.*` 将匹配任何内容，包括空。

    - `+` 匹配一个或多个前述字符（`"xxx+"` 会匹配 3 个或更多 "x" 的序列）。

    - `(expr1)` 表达式之一，该表达式本身可能包含类似的结构。

    - `(expr2)` (""(foo|bar)"` 会匹配 "foo" 或 "bar")

    - `(foo|bar)?` 将匹配 "foo" 或 "bar" 或空（即 ""）。

    - `$` 行尾（`"(foo|bar)$"` 仅在行尾匹配 "foo" 或 "bar"）。

    - `\x` 禁用 `x` 的特殊含义，其中 `x` 是特殊正则字符 `.`、`*`、`+`、`()`、`[]`、`{}`、`\`（`\.` 匹配单个 `.`，`\*`
    匹配单个 `*` 等）。


    因此，通过表达式匹配拦截色情内容的示例可能如下：

    `(^|[\-?=+/_])(bondage|boobs?|busty?|hardcore|porno?|sex|xxx+)(|[\-?=+/_]|$)`
    $


    ## 注意：


    - 除非你非常非常仔细地构建表达式，否则极有风险会让你的用户感到困扰。在急于拦截色情内容时，你可能会意外拦截 "Essex"、"Sussex"、breastcancer、"www.x.org"
    等。在实践中，你可能会将上述示例中的某些单词替换为更明显的色情相关词汇，我不认为在这里列出它们合适。

    - 虽然域名和 URL 列表的大小对性能的影响微乎其微，但过多的大型或复杂的表达式会迅速降低 squidGuard 的性能。尽管这很大程度上取决于你所链接的正则表达式库的性能。

    - 源码树的 `samples/dest/adult` 下有一组针对所谓的色情网站的丰富示例文件，如果拦截色情是你的任务之一，你可以将其作为起点。**请注意：**
    我们建议在使用这些列表之前对其进行审查。这些域名和 URL 是机器人*自动*收集的。没有对相应内容进行人工评估。因此可能有非色情网站混入。请报告此类错误，但如果你的网站在列表中，请不要怪我们。（去怪那些在深度色情页面上混入适当链接的人吧！）


