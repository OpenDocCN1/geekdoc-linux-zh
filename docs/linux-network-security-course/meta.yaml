- md: "## Testing services through the firewall\n\n- ipp Client (CUPS):\n  `telnet\
    \ laptop 631 <enter>`\n  `GET / <enter>`\n  `<enter>`\n\n- http Client:\n  `telnet\
    \ laptop 80 <enter>`\n  `GET / <enter>`\n\n- smtp Client\n  `telnet laptop 25\
    \ <enter>`\n  `HELO laptop <enter>`\n  `QUIT <enter>`\n\n- pop3 Client\n  `telnet\
    \ laptop 110 <enter>`\n  `QUIT <enter>`\n\nhttp and ipp Servers are tested via\
    \ clients running the above commands towards the server host to test.\n\neg.\n\
    **http server**: `telnet httpServerAddr 80 <enter>`\n`GET / <enter>`\n\n**ipp\
    \ server**: `telnet cupsServerAddr 80 <enter>`\n`GET / <enter>`\n`<enter>`\n\n\
    ## 1.2.6.2 - Masquerading\n\n- Masquerading and Proxy principle (NAT)\n\n- Set\
    \ FORWARD rules\n\n- Turn ON IP_FORWARDING in kernel\n  `echo 1 > /proc/sys/net/ipv4/ip_forward`\n\
    \n- iptables POSTROUTING NAT table rules:\n\n- SNAT for static Internet IPs (faster):\n\
    \  `iptables -t nat -A POSTROUTING -o eth1 \\`\n  `-j SNAT --to-source $ROUTER_INET_IP`\n\
    \n- MASQUERADE for dynamic IPs (clean itself on interface-down):\n  `iptables\
    \ -t nat -A POSTROUTING -o eth1 \\`\n  `-j MASQUERADE`\n\n- Testing MASQUERADING:\n\
    client --(ping)--> router (no mask) --> Client: Client addr.\nclient --(ping)-->\
    \ router (masq) --> Client: Router addr.\n**Ping source addr?**\n\n## 2.6.3 -\
    \ REDIRECTION\n\n- DMZ Principle\n\n- Set FORWARD rules\n\n- Turn ON IP_FORWARDING\
    \ in kernel\n\n- iptables PREROUTING NAT table rule:\nSending all incoming web\
    \ requests from internet clients to the web server located in DMZ:\n`iptables\
    \ -t nat -A PREROUTING -p tcp -i $ext_if \\ \n--dport 80 -j DNAT --to-destination\
    \ $DMZ_HTTP_SERVER`\n\nRe-routing web server requests from Internet to a web server\
    \ port 8080 in DMZ:\n`iptables -t nat -A PREROUTING -p tcp -d $INET_IP \\ \n--dport\
    \ 80 -j DNAT --to-destination $DMZ_HTTP_SERVER:8080`\n\n**NOTE:** the following\
    \ 2 rules MUST be added to allow the same DMZ web server to be called from the\
    \ internal network where the web server is, or from the firewall itself:\n\nRule\
    \ to allow a local network host to call the DMZ web server:\n`iptables -t nat\
    \ -A POSTROUTING -d $DMZ_HTTP_SERVER \\ \n--dport 80 -j SNAT --to-source $FIREWALL_LAN_IP`\n\
    \nRule to allow requests direct from the firewall to the DMZ web server:\n`iptables\
    \ -t nat -A OUTPUT --dst $INET_IP --dport 80 \\ \n-j DNAT --to-destination $DMZ_HTTP_SERVER`\n\
    \n## 2.6.4 - Load balancing for DMZ servers:\n\nAllows to random balance the load\
    \ of DMZ servers offering all the same service.\n\nSyntax:\nRe-routing web server\
    \ requests from Internet to multiple web servers in DMZ\n`iptables -t nat -A PREROUTING\
    \ -p tcp -d $INET_IP --dport 80 \\ \n-j DNAT --to-destination 192.168.70.1-192.168.70.10`\n\
    \n## 2.6.5 - Logging level:\n\nThe `--log-level` option allows to change the logging\
    \ level from `kern.warn` to another level like `kern.debug`:\n\nSyntax:\n`iptables\
    \ -A INPUT -j LOG --log-level DEBUG \\ \n--log-prefix \"END of INPUT CHAIN = \"\
    `\n\n## 2.6.6 - TTL modification or detection:\n\nThe TTL target allows to modify\
    \ the existing TTL of packets to hide the fact that the clients are residing inside\
    \ a private network.\n\nSyntax:\n`iptables -t mangle -A PREROUTING -i eth0 \\\
    \ \n-j TTL --ttl-set 64`\n\nTo detect packets with a certain TTL then:\n`iptables\
    \ -A INPUT -m ttl --ttl 60 -j DROP`\n\n## 2.6.7 - Matching packet owner(user):\n\
    \nThis allows to detect which local user has generated the packet and decide what\
    \ to do with it. This feature is only accessible in the OUTPUT chain (for local\
    \ processes)\n\nSyntax:\n\n```\nUID:  iptables -A OUTPUT  -m owner  --uid-owner\
    \ 500  -j ACCEPT\nGID:  iptables -A OUTPUT  -m owner  --gid-owner 0  -j ACCEPT\n\
    PID:  iptables -A OUTPUT  -m owner  --pid-owner 2056  -j ACCEPT\nSID:  iptables\
    \ -A OUTPUT  -m owner  --pid-owner 2056  -j ACCEPT\n```\n\nsee page 51 of iptables-tutorial.html\n\
    \n## 2.6.8 - Matching multiple ports in one rule:\n\nThis feature allows us to\
    \ list up to 15 ports.\nCan only be used with -p tcp or -p udp.\n\nSyntax:\n\n\
    ```\niptables -A INPUT -p tcp -m multiport \\\n        --source-port 22,53,80,110,443\n\
    ```\n\n```\niptables -A INPUT -p tcp -m multiport \\\n        --destination-port\
    \ 22,53,80,110,443\n```\n\n```\niptables -A INPUT -p tcp -m multiport \\\n   \
    \     --port 22,53,80,110,443\n```\n\n## 2.6.9 - Limiting frequency of ping or\
    \ logged packets\n\nThis feature allows to limit the throughput of accepted packets\n\
    \n```\niptables -A INPUT -i eth0 -p icmp --icmp-type echo-request \\\n       \
    \                        -m limit --limit 5/minute -j ACCEPT\n```\n\nLimit can\
    \ be: '/second', '/minute', '/hour', or '/day' suffix; the default is 3/hour\n\
    \n## 2.6.10 - Matching MAC addresses:\n\nThis allows to match Ethernet cards MAC\
    \ (Hardware) addresses in rules:\n\n```\niptables -A INPUT -m mac --mac-source\
    \ 00:02:80:2F:58:62\niptables -A INPUT -m mac --mac-destination 00:02:80:2F:58:62\n\
    ```\n\n## 2.6.11 - Changing the priority of packets : TOS target\n\nChanging the\
    \ TOS(Type Of Service) of packets allows to control the different incoming packet\
    \ queues.\n\nThe standard pfifo_fast scheduler (classless queue)has 3 different\
    \ \"bands\": Traffic in band 0 is transmitted first, then the traffic in band\
    \ 1 then in band 2. No packets from band 1 are sent until the band 0 is empty,\
    \ and the same goes for band 2 vs band 1. So it is vital that our interactive\
    \ traffic be in band 0.\n\nTo achieve the band assignment of packets we need to\
    \ change their TOS. There are four seldom-used bits in the IP header, called the\
    \ Type of Service (TOS) bits. They effect the way packets are treated; the four\
    \ bits are \"Minimum Delay\", \"Maximum Throughput\", \"Maximum Reliability\"\
    \ and \"Minimum Cost\". Only one of these bits is allowed to be set. The change\
    \ of the TOS of packets is done via iptables rules:\n\neg.\n\n```\niptables -t\
    \ mangle -A PREROUTING -p TCP --dport 22 -j TOS --set-tos 0x10\n```\n\n| TOS |\
    \ Bits | Means | Linux Priority | Band |\n|---|---|---|---|---|\n| 0x0 | 0 | Normal\
    \ Service | 0 Best Effort | 1 |\n| 0x2 | 1 | Minimize Monetary Cost | 1 Filler\
    \ | 2 |\n| 0x4 | 2 | Maximize Reliability | 0 Best Effort | 1 |\n| 0x6 | 3 | mmc+mr\
    \ | 0 Best Effort | 1 |\n| 0x8 | 4 | Maximize Throughput | 2 Bulk | 2 |\n| 0xa\
    \ | 5 | mmc+mt | 2 Bulk | 2 |\n| 0xc | 6 | mr+mt | 2 Bulk | 2 |\n| 0xe | 7 | mmc+mr+mt\
    \ | 2 Bulk | 2 |\n| 0x10 | 8 | Minimize Delay | 6 Interactive | 0 |\n| 0x12 |\
    \ 9 | mmc+md | 6 Interactive | 0 |\n| 0x14 | 10 | mr+md | 6 Interactive | 0 |\n\
    | 0x16 | 11 | mmc+mr+md | 6 Interactive | 0 |\n| 0x18 | 12 | mt+md | 4 Int. Bulk\
    \ | 1 |\n| 0x1a | 13 | mmc+mt+md | 4 Int. Bulk | 1 |\n| 0xc | 14 | mr+mt+md |\
    \ 4 Int. Bulk | 1 |\n| 0xe | 15 | mmc+mr+mt+md | 4 Int. Bulk | 1 |"
  mdcn: "\n## 通过防火墙测试服务\n\n- ipp 客户端 (CUPS):\n  `telnet laptop 631 <enter>`\n  `GET\
    \ / <enter>`\n  `<enter>`\n\n- http 客户端:\n  `telnet laptop 80 <enter>`\n  `GET\
    \ / <enter>`\n\n- smtp 客户端\n  `telnet laptop 25 <enter>`\n  `HELO laptop <enter>`\n\
    \  `QUIT <enter>`\n\n- pop3 客户端\n  `telnet laptop 110 <enter>`\n  `QUIT <enter>`\n\
    \nhttp 和 ipp 服务器通过通过运行上述命令的客户端指向被测试主机进行测试。\n\n例如：\n**http 服务器**: `telnet httpServerAddr\
    \ 80 <enter>`\n`GET / <enter>`\n\n**ipp 服务器**: `telnet cupsServerAddr 80 <enter>`\n\
    `GET / <enter>`\n`<enter>`\n\n## 1.2.6.2 - 伪装 (Masquerading)\n\n- 伪装与代理原理 (NAT)\n\
    \n- 设置 FORWARD（转发）规则\n\n- 在内核中开启 IP_FORWARDING\n- `echo 1 > /proc/sys/net/ipv4/ip_forward`\n\
    \n- iptables POSTROUTING NAT 表规则：\n\n- 静态外 IP 的 SNAT（速度更快）：\n  `iptables -t nat\
    \ -A POSTROUTING -o eth1 \\`\n  `-j SNAT --to-source $ROUTER_INET_IP`\n\n- 动态\
    \ IP 的 MASQUERADE（在接口关闭时自动清理）：\n  `iptables -t nat -A POSTROUTING -o eth1 \\`\n\
    \  `-j MASQUERADE`\n\n- 测试伪装：\nclient --(ping)--> router（无掩码） --> Client: Client地址。\n\
    client --(ping)--> router（伪装） --> Client: 路由器地址。\n**Ping 源地址？**\n\n## 2.6.3 -\
    \ 重定向 (REIRECTION)\n\n- DMZ 原理\n\n- 设置 FORWARD 规则\n\n- 在内核中开启 IP_FORWARDING\n\n\
    - iptables PREROUTING NAT 表规则：\n将来自互联网客户端的所有入站 Web 请求发送到位于 DMZ 的 Web 服务器：\n`iptables\
    \ -t nat -A PREROUTING -p tcp -i $ext_if \\ \n--dport 80 -j DNAT --to-destination\
    \ $DMZ_HTTP_SERVER`\n\n将来自互联网的 Web 服务器请求重定向到 DMZ 中端口为 8080 的 Web 服务器：\n`iptables\
    \ -t nat -A PREROUTING -p tcp -d $INET_IP \\ \n--dport 80 -j DNAT --to-destination\
    \ $DMZ_HTTP_SERVER:8080`\n\n**注意：** 必须添加以下 2 条规则，以便从 Web 服务器所在的内部网络或从防火墙本身调用同一个\
    \ DMZ Web 服务器：\n\n允许本地网络主机调用 DMZ Web 服务器的规则：\n`iptables -t nat -A POSTROUTING\
    \ -d $DMZ_HTTP_SERVER \\ \n--dport 80 -j SNAT --to-source $FIREWALL_LAN_IP`\n\n\
    允许从防火墙直接请求 DMZ Web 服务器的规则：\n`iptables -t nat -A OUTPUT --dst $INET_IP --dport\
    \ 80 \\ \n-j DNAT --to-destination $DMZ_HTTP_SERVER`\n\n## 2.6.4 - DMZ 服务器的负载均衡：\n\
    \n允许随机均衡提供所有相同服务的 DMZ 服务器的负载。\n\n语法：\n将来自互联网的 Web 服务器请求重定向到 DMZ 中的多个 Web 服务器\n\
    `iptables -t nat -A PREROUTING -p tcp -d $INET_IP --dport 80 \\ \n-j DNAT --to-destination\
    \ 192.168.70.1-192.168.70.10`\n\n## 2.6.5 - 日志级别：\n\n`--log-level` 选项允许将日志级别从\
    \ `kern.warn` 更改另一个级别（如 `kern.debug`）：\n\n语法：\n`iptables -A INPUT -j LOG --log-level\
    \ DEBUG \\ \n--log-prefix \"END of INPUT CHAIN = \"`\n\n## 2.6.6 - TTL 修改或检测：\n\
    \nTTL 目标允许修改数据包现有的 TTL，以隐藏客户端位于私有网络的事实。\n\n语法：\n`iptables -t mangle -A PREROUTING\
    \ -i eth0 \\ \n-j TTL --ttl-set 64`\n\n要检测具有特定 TTL 的数据包：\n`iptables -A INPUT -m\
    \ ttl --ttl 60 -j DROP`\n\n## 2.6.7 - 匹配数据包所有者（用户）：\n\n这允许检测哪个本地用户生成了数据包并决定对其如何处理。此功能仅在\
    \ OUTPUT 链可用（针对本地进程）。\n\n语法：\n\n```\nUID:  iptables -A OUTPUT  -m owner  --uid-owner\
    \ 500  -j ACCEPT\nGID:  iptables -A OUTPUT  -m owner  --gid-owner 0  -j ACCEPT\n\
    PID:  iptables -A OUTPUT  -m owner  --pid-owner 2056  -j ACCEPT\nSID:  iptables\
    \ -A OUTPUT  -m owner  --pid-owner 2056  -j ACCEPT\n```\n\n参见 iptables-tutorial.html\
    \ 的第 51 页\n\n## 2.6.8 - 在一条规则中匹配多个端口：\n\n此功能允许我们列出最多 15 个端口。\n只能配合 -p tcp 使用。\n\
    语法：\n\n```\niptables -A INPUT -p tcp -m multiport --ports 22,80,443 -j ACCEPT\n\
    ```\n\n## 2.6.9 - 限制 ping 频率：\n\n此功能允许限制 ping 或数据包的吞吐量。\n\n```\niptables -A INPUT\
    \ -p icmp -m limit --limit 5/minute -j ACCEPT\n```\n\n## 2.6.10 - 匹配 MAC 地址：\n\
    \n这允许匹配以太网卡（硬件）地址。\n\n```\niptables -A INPUT -m mac --mac-source 00:11:22:33:44:55\
    \ -j ACCEPT\n```\n\n## 2.6.11 - 修改数据包的优先级：\n\n修改数据包的 TOS（服务类型）允许控制不同的入站队列。标准的\
    \ pfifo_fast 调度器（无分类队列）有 3 个不同的“带”：带 0 优先传输，然后是带 1，最后是带 2。为了实现带的分配，我们需要更改它们的 TOS。IP\
    \ 头部中有一个四个未使用的位，称为服务类型（TOS）。它们影响数据包被处理的方式；这四个位是“最小延迟”、“最大吞吐量”、“最大可靠性”和“最小成本”。只能设置这些位之一。数据包的\
    \ TOS 修改通过 iptables 规则完成。\n\n例如：\n\n```\niptables -t mangle -A PREROUTING -p tcp\
    \ --dport 22 -j TOS --set-tos 0x10\n```\n\n| TOS | 位 | 含义 | Linux 优先级 | 带 |\n\
    |---|---|---|---|---|\n| 0x0 | 0 | 普通服务 | 0 Best Effort | 1 |\n| 0x2 | 1 | 最小成本\
    \ | 1 | 2 |\n| 0x4 | 2 | 最大可靠性 | 0 Best Effort | 1 |\n| 0x6 | 3 | mmc+mr | 0 Best\
    \ Effort | 1 |\n| 0x8 | 4 | 最大吞吐量 | 2 Bulk | 2 |\n| 0xa | 5 | mmc+mt | 2 Bulk\
    \ | 2 |\n| 0xc | 6 | mr+mt | 2 Bulk | 2 |\n| 0xe | 7 | mmc+mr+mt | 2 Bulk | 2\
    \ |\n| 0x10 | 8 | 最小延迟 | 6 Interactive | 0 |\n| 0x12 | 9 | mmc+md | 6 Interactive\
    \ | 0 |\n| 0x14 | 10 | mr+md | 6 Interactive | 0 |\n| 0x16 | 11 | mmc+mr+md |\
    \ 6 Interactive | 0 |\n| 0x18 | 12 | mt+md | 4 Int. Bulk | 1 |\n| 0x1a | 13 |\
    \ mmc+mt+md | 4 Int. Bulk | 1 |\n| 0xc | 14 | mr+mt+md | 4 Int. Bulk | 1 |\n|\
    \ 0xe | 15 | mmc+mr+mt+md | 4 Int. Bulk | 1 |\n"
