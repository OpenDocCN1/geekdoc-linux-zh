    nmap -v --sS -O www.my.com 192.168.0.0/16 '192.168.0.0/16'\n```\n\n从 `nmap` 提取的示例：\n\
    \n```bash\nnmap -v target.example.com\n```\n\n此选项扫描机器 `target.example.com` 上所有保留的\
    \ TCP 端口。`-v` 表示开启详细模式。\n\n```bash\nnmap -sS -O target.example.com/24\n```\n\n\
    针对 `target.example.com` 所在的 \"C\" 类网段 255 台机器中的每台机器启动隐形 SYN (`-sS`) 扫描。它还会尝试确定每个在线主机运行的是什么操作系统\
    \ (`-O`)。由于使用了 SYN 扫描和操作系统检测，这需要 root 权限。\n\n```bash\nnmap -sX -p 22,53,110,143,4564\
