    \            this number(eg. 71) is the third part of an IP subnet.\n#       \
    \     eg. 192.168.71.0\n#------------------------------------------------------------------------------\n\
    # Declare error function using the Variable $errortext:\n# Displays error message\
    \ and exits with error code 1\nerror () {\n```\n```"
