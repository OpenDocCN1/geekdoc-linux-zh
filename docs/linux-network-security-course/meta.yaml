    +   - The redirect rule:\n\nThe *redirect* rules declares the altenative URL to\
    \ be used for blocked destination groups (*!groups*) for the actual acl.\n**Note:**\
    \ Inside an acl, this is a fallback used when there is no special redirect declared\
    \ for the actual destination group, and the default redirect is the last resort.\n\
    squidGuard can do runtime string substitutions in the redirectors. Therefore the\
    \ character \"%\" has special meaning in the redirector URLs:\n\n+   - `%a` is\
    \ replaced with IP address of the client.\n- `%n` is replaced with the domainname\
    \ of the client or \"unknown\" if not available.\n- `%i` is replaced with the\
    \ user ID (RFC931) or \"unknown\" if not available.\n- `%s` is replaced with the\
    \ matched source group (client group) or \"unknown\" if no groups were matched.\n\
    - `%t` is replaced with the matched destination group (target group) or \"unknown\"\
    \ if no groups were matched.\n- `%u` is replaced with the requested URL.\n- `%p`\
    \ is replaced with the REQUEST_URI, i.e. the path and the optional query string\
    \ of `%u`, but **note** for convenience without the leading \"/\".\n- `%%` is\
    \ replaced with a single \"%\"."
- md: 'Thus you can pass useful information to a more or less intelligent CGI page:

    `http://proxy/cgi/SquidGuard?clientaddr=%a&clientname=%n&clientident=%i&clientgroup=%s&destinationgroup=%t&url=%u`

    For a start, there is a sample of such a script in `samples/samples/SquidGuard.cgi`
    in the source tree.


    ## Domain lists


    The domainlist file format is simply domainnames/zonenames separated by a newline.
    The length of these lists have neglectable influence on the performance.


    For instance a start for a financial category:


    ```

    amex.com

    asx.com.au

    bourse-de-paris.fr

    exchange.de

    londonstockex.co.uk

    nasdaq.com

    nyse.com

    ose.no

    tse.or.jp

    xse.se

    ```


    **Note:** `squidGuard` will match any URL with the domainname itself an any subdomains
    and hosts (`i.e.amex.com`, `www.amex.com`, `whatever.amex.com` and `www.what.ever.amex.com`
    but not `.*[^.].amex.com` (`i.e.aamex.com` etc.)).


    ## URLlists


    The urllist file format is simply URLs separated by newline but with the `"proto://((www|web|ftp)[0-9]*)?"`
    and `"(:port)?"` parts and normally also the ending `"(/|\.[^/])^ [^/]*"` part
    (i.e. ending `"/"` or `"filename"`) chopped off.

    (i.e. `"http://www3.foo.bar.com:8080/what/ever/index.html"` => `"foo.bar.com/what/ever"`)


    For instance a category for banned sites:


    ```

    foo.com/-badguy

    bar.com/whatever/suspect

    ```


    **Note:** The removed parts above are ignored by squidGuard in URL matching.

    Thus all these URLs will match the above url list:


    ```

    http://foo.com/-badguy

    http://foo.com/-badguy/whatever

    ftp://foo.com/-badguy/whatever

    wais://foo.com/-badguy/whatever

    http://www2.foo.com/-badguy/whatever

    http://web56.foo.com/-badguy/whatever

    ```


    but **not**:


    ```

    http://barfoo.com/-badguy

    http://bar.foo.com/-badguy

    ```


    http://foo.com/~goodguy


    ## Expressionlists


    The expressionlist file format is like with regular expressions as described in
    regex(5). Of most interest is:


    - `.` Matches any single character (use `\.` to match a `.`).

    - `[abc]` Matches one of the characters (`[abc]` matches a single "a" or "b" or
    "c").

    - `[c-g]` Matches one of the characters in the range (`[c-g]` matches a single
    "c" or "d" or "e" or "f" or "g").

    - `[a-z0-9]` matches any single letter or digit.

    - `[-/.:?]` matches any single "-" or "/" or "." or ":" or "?".

    - `?` None or one of the preceding ("words?" will match "word" and "words").

    - `[abc]?` matches a single "a" or "b" or "c" or nothing (i.e. "").

    - `*` None or more of the preceding ("words*" will match "word", "words", and
    "words").

    - `.*` will match anything including nothing.

    - `+` One or more of the preceding ("xxx+" will match a sequence of 3 or more
    "x").

    - `(expr1)` One of the expressions, which in turn may contain a similar construction

    - `(expr2)` ("(foo|bar)" will match "foo" or "bar".

    - `(foo|bar)?` will match "foo" or "bar" or nothing (i.e.").

    - `$` The end of the line ("(foo|bar)$" will match "foo" or "bar" only at the
    end of a line).

    - `\x` Disable the special meaning of `x` where `x` is one of the special regex
    characters ".", "*", "+", "()", "[]", "{}", "\ ("\." will match a single ".",
    "\*" a single "*", etc.)


    Thus a start to block possible sexual material by expression match could look
    like this:

    `(^|[\-?=+/_])(bondage|boobs?|busty?|hardcore|porno?|sex|xxx+)(|[\-?=+/_]|$)`
    $


    ## Notes:


    - Unless you build your expressions very very carefully there is a high risk you
    will have annoyed users on your neck. Typically you might accidentally block "Essex",
    "Sussex", "breastcancer", "www.x.org" etc. in your eagerness for blocking pornographic
    material. In practice you would probably replace some words of the in the example
    above with some more clearly pornographic related words that I don''t find appropriate
    to list here.

    - While the size of the domain and urllists only has marginal influence on the
    performance, too many large or complex expressions will quickly degrade the performance
    of squidGuard. Though it may depend heavily on the performance of the regex library
    you link with.

    - There is a rich set of sample files for a group of supposedly pornographic sites
    under `samples/dest/adult` in the source tree that you can use as a start if porn
    blocking is one of your tasks. **Please note:** We recommend that you review these
    lists before using them. Those domains and urls have been collected *automatically*
    by a robot. No manual evaluation of the corresponding contents has been performed.
    Therefore there is a chance some nonpornographic sites have slipped in. Please
    report such errors but don''t blame us if your site is on the list. (Blame those
    who have pointers to appropriate sites mixed in on their heavy porn link pages!)


