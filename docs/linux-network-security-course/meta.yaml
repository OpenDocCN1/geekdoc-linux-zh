  md: "```\nUID:  iptables -A OUTPUT  -m owner  --uid-owner 500  -j ACCEPT\nGID: \
    \ iptables -A OUTPUT  -m owner  --gid-owner 0  -j ACCEPT\nPID:  iptables -A OUTPUT\
    \  -m owner  --pid-owner 2056  -j ACCEPT\nSID:  iptables -A OUTPUT  -m owner \
    \ --pid-owner 2056  -j ACCEPT\n```\n\n(SID is a Session ID based on parent process\
    \ threads)\nsee page 51 of iptables-tutorial.html\n\n# 2.6.8 - Matching multiple\
    \ ports in one rule:\n\nThis feature allows us to list up to 15 ports.\nCan only\
    \ be used with -p tcp or -p udp.\nSyntax:\n\n```\niptables -A INPUT -p tcp -m\
    \ multiport \\\n        --source-port 22,53,80,110,443\n```\n\n```\niptables -A\
    \ INPUT -p tcp -m multiport \\\n        --destination-port 22,53,80,110,443\n\
    ```\n\n```\niptables -A INPUT -p tcp -m multiport \\\n        --port 22,53,80,110,443\n\
    ```\n\n# 2.6.9 - Limiting frequency of ping or logged packets\n\nThis feature\
    \ allows to limit the throughput of accepted packets\n\n```\niptables -A INPUT\
    \ -i eth0 -p icmp --icmp-type echo-request \\\n                              \
    \ -m limit --limit 5/minute -j ACCEPT\n```\n\nLimit can be: '/second', '/minute',\
    \ '/hour', or '/day' suffix; the default is 3/hour\n\n# 2.6.10 - Matching MAC\
    \ addresses:\n\nThis allows to match Ethernet cards MAC (Hardware) adresses in\
    \ rules:\nSyntax:\n\n```\niptables -A INPUT -m mac --mac-source 00:02:80:2F:58:62\n\
    iptables -A INPUT -m mac --mac-destination 00:02:80:2F:58:62\n```\n\n# 2.6.11\
    \ - Changing the priority of packets : TOS target\n\nChanging the TOS(Type Of\
    \ Service) of packets allows to control the different incoming packet queues.\n\
    The standard pfifo_fast scheduler (classless queue)has 3 different \"bands\":\n\
    Traffic in band 0 is transmitted first, then the traffic in band 1 then in band\
    \ 2.\nNo packets from band 1 are sent until the band 0 is empty, and the same\
    \ goes for band 2 vs band 1. So it is vital that our interactive traffic be in\
    \ band 0.\nTo achieve the band assignment of packets we need to change their TOS.\
    \ There are four seldom-used bits in the IP header, called the Type of Service\
    \ (TOS) bits. They effect the way packets are treated; the four bits are \"Minimum\
    \ Delay\", \"Maximum Throughput\", \"Maximum Reliability\" and \"Minimum Cost\"\
    . Only one of these bits is allowed to be set. The change of the TOS of packets\
    \ is done via iptables rules:\neg.\n\n```\niptables -t mangle -A PREROUTING -p\
    \ TCP --dport 22 -j TOS --set-tos 0x10\n```"
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Table of TOS codes to Band number for the *pflfo_fast* classless queue:


    | TOS | Bits | Means | Linux Priority | Band |

    |---|---|---|---|---|

    | 0x0 | 0 | Normal Service | 0 Best Effort | 1 |

    | 0x2 | 1 | Minimize Monetary Cost | 1 Filler | 2 |

    | 0x4 | 2 | Maximize Reliability | 0 Best Effort | 1 |

    | 0x6 | 3 | mmc+mr | 0 Best Effort | 1 |

    | 0x8 | 4 | Maximize Throughput | 2 Bulk | 2 |

    | 0xa | 5 | mmc+mt | 2 Bulk | 2 |

    | 0xc | 6 | mr+mt | 2 Bulk | 2 |

    | 0xe | 7 | mmc+mr+mt | 2 Bulk | 2 |

    | 0x10 | 8 | Minimize Delay | 6 Interactive | 0 |

    | 0x12 | 9 | mmc+md | 6 Interactive | 0 |

    | 0x14 | 10 | mr+md | 6 Interactive | 0 |

    | 0x16 | 11 | mmc+mr+md | 6 Interactive | 0 |

    | 0x18 | 12 | mt+md | 4 Int. Bulk | 1 |

    | 0x1a | 13 | mmc+mt+md | 4 Int. Bulk | 1 |

    | 0x1c | 14 | mr+mt+md | 4 Int. Bulk | 1 |

    | 0x1e | 15 | mmc+mr+mt+md | 4 Int. Bulk | 1 |


    # iptables command for TOS control


    | Option | --set-tos |

    |---|---|

    | Example | `iptables -t mangle -A PREROUTING -p TCP --dport 22 -j TOS --set-tos
    0x10` |

    | Descrip. | The `--set-tos` option tells the **TOS** mangler what TOS value to
    set on packets that are matched. The option takes a numeric value, either in hex
    or in decimal value. As the TOS value consists of 8 bits, the value must be 0-255,
    or in hex its 0x00-0xFF. Note that in the standard TOS target you are limited
    using the named values available (which should be more or less standardized),
    as mentioned in the previous warning. These values are:


    `Normal-Service` (decimal value 0, hex value 0x00)

    `Minimize-Cost` (decimal value 2, hex 0x02)

    `Maximize-Reliability` (decimal value 4, hex value 0x04)

    `Maximize-Throughput` (decimal value 8, hex value 0x08)

    `Minimize-Delay` (decimal value 16, hex value 0x10)


    The default value on most packets are `Normal-Service`, or 0. Note that you can,
    of course, use the actual names instead of the actual hex values to set up the
    TOS value, and it should generally be recommended since the values behind the
    names may be changed if you are unlucky. For a complete listing of the "descriptive
    values", do an `iptables -j TOS -h`. This is complete as of iptables 1.2.5 and
    should hopefully be so for another period of time. |


    To view the number of packets being modified by the TOS:


    ```

    iptables -t mangle -L PREROUTING -v -X -x 2 > /dev/null

    ```'
