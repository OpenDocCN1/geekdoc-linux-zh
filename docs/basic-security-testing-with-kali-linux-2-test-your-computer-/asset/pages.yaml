    \ is to secure your router! Do not use open or WEP security. One of the main defenses\
    \ your network is your firewall; if you allow people inside your firewall you\
    \ can open yourself up to ARP MitM attacks, packet sniffing and other attacks.\
    \ Unfortunately, many corporate users do not understand this and will take their\
    \ business laptops from a very secured environment at work to a very unsecured\
    \ Wi-Fi network at home.\n\nBe cautious of free Wi-Fi. Don’t do online banking\
    \ or shopping while using public Wi-Fi. Make sure your operating system is using\
