    # # Conclusion


    In the first part of this section we learned how to use the Man-in-the-Middle
    attack Arpspoof, along with Urlsnark and Driftnet to view what websites a targeted
    local system was viewing.


    In the second part, we learned how to turn an exploited system into a remote packet
    sniffer using Meterpreter. We then analyzed the captured traffic in Xplico.


    Hopefully this chapter demonstrated why it is important to secure your network.
    If your ARP table is not protected, it makes it easy for an attacker on the local
    lan to perform a MitM attack and view all the traffic of a target system.


    And if your network an isn’t secured from remote threats it makes it easy for
    a remote attack to run a packet sniffer on your network from an exploited system.'
