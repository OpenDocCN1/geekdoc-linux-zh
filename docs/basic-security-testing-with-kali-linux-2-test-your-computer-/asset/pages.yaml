  md: '# GETPID & PS COMMANDS—As you use Meterpreter, two of the commands that you
    will use somewhat frequently getpid and ps.


    +   - Getpid – tells you process ID your shell is running on

    - Ps – lists all processes running on the remote system


    So if I type, “getpid” I see this:


    ```

    meterpreter > getpid

    Current pid: 3824

    ```


    This is the process ID number that our shell is using. If I type “ps” I can see
    all the processes:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_49_0.png)


    If we go down the list, looking for our pid number of 3824 we see this:


    ```

    3824 3796 powershell.exe x86 1 WIN-LOANLOTTDQU\Fred

    C:\Windows\System32\WindowsShell\v1.0\powershell.exe

    ```


    This shows our process ID of 3824. It also shows we are running under a powershell.exe
    process as the user “Fred”.


    This information comes in when I want to “migrate” out of this low level process
    and into a process with a higher level access. We can move our shell off of this
    PID to a process that has higher level access.


    Migrating also allows us to merge and hide our shell into another more common
    process, in essence hiding our connection. Explorer.exe is one of the more common
    processes to migrate to.


    Simply find the PID# of the process you want to use (1736 on our system) and type,
    “migrate <PID#>'
