    As you can simply hiding your Wireless name is not an effective means, either,
    as you can monitor an individual access point with airodump-ng and get the MAC
    address of any system that connects to it:


    ```

    Airodump-ng -c (AP Wireless Channel) -a -bssid (MAC Address of AP) mon0

    ```


    Then you simply spoof your MAC address using a program like macchanger and you
    can connect without any problems.


    # WEP and WPA/WPA2 Cracking


    You can use the Airmon-ng tools to manually attempt to crack WEP and WPA keys,
    but it is much simpler for new users if you use "Fern WiFi Cracker". Fern puts
    a graphical program interface to Airmon-ng, and includes the Reaver WPS protected
    setup attack, and several other useful tools.


    To start Fern in Kali: Type, "fern-wifi-cracker " at the command prompt.


    +   1. Simply select your interface and click "Scan for Access Points". After
    a short while and any detected Wi-Fi networks will show up next to the WiFi, or
    WPA buttons:'
