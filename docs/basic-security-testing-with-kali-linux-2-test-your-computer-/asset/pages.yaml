  md: 'Rule attacks are very useful. Hashcat has a list of built in rules that you
    can use to crack passwords. For example there is a “leet” rule that automatically
    takes each dictionary word and tries different leet-speak versions of the word.
    You can even use a programming language to create your own rulesets.


    Rule based attacks are enabled by using the “r” switch and including a name of
    the ruleset you want. Best64.rule, passwordpro.rule, d3ad0ne.rule, and leetspeak.rule
    are some of the more popular ones.


    Something like:


    ```

    root@kali:~/crack# hashcat -m 1000 hash rocky.txt -r leetspeak.rule -o cracked.txt

    ```


    Mask attacks allow you to define the layout of the words that will be used in
    your attack. For instance if you know the password policy requires two numbers
    six uppercase letters and two special characters you can create a mask for Hashcat
    to use.


    In this example it would look something like ?d?d?u?u?u?u?u?s:


    ```

    root@kali:~/crack# hashcat -m 1000 -a 3 hash.txt ?d?d?u?u?u?u?u?s -o cracked.txt

    ```


    Play around with the different options until you get a feel for how they work.


    Some of the attacks especially the Brute Force ones can take forever. Use the
    video card based Hashcat versions to speed things up if you have a compatible
    card.


    # Conclusion


    The purpose of this exercise was not just showing how to crack passwords but to
    demonstrate how insecure passwords can be.


    Sometimes as an Ethical Hacker or pentester you need to crack hashes. This was
    just a basic look at Hashcat. When you mix together the different attack styles
    rules and masks you can create a pretty powerful tool.


    Hopefully this demonstrated why strong passwords are important. Implementing a
    policy requiring your users to use long complex passwords is a good move in securing
    your network. Or better yet implement multi-factor authentication for your systems.


    Don''t forget to remind your users to use a different password for every account
    they have especially important online accounts that include personal information.
    That way if a password is compromised the hacker will not have access to every
    one of their accounts.'
