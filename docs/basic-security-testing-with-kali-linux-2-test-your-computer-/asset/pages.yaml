  md: 'Seversal users have logged onto our test PC and we can view all their user
    names, their password hashes and their actual passwords in plain clear text!


    As mentioned earlier, you would need to have physical access to the machine, especially
    to set up the initial Utilman Login Bypass. And you need to run Mimikatz, which
    I just downloaded and put on a USB drive for convenience.


    And someone had to have logged onto the system since it booted. If-no one has
    logged onto the system yet, there are no passwords in memory for Mimikatz to pull.


    # Conclusion


    In this section we learned how to boot from a Kali Live CD and view the contents
    of a Windows file system. If we drive isn''t encrypted we could easily pull user
    documents and files from it.


    We also learned how to set up the Utilman Bypass to log into Windows without the
    password. Finally we learned how to use Mimikatz to grab a user''s password in
    plain text.


    As a couple of my friends that do pentesting for the government have said, physical
    access equals total access. Shut down your system if you will be away for extended
    times, and install a Power on Password to protect the boot process from being
    tampered with. Use an encrypting file system that encrypts the entire drive.


    Secure physical access to important machines. Also turn off or disable DVD/CD
    ROM drives and USB ports if needed. Some organizations even go to the extent of
    filling USB ports with glue!'
