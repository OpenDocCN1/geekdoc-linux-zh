  md: '# # Chapter 3 – Introduction to Metasploit


    # ## Resources


    Metasploit Information


    +   - [http://www.offensive-security.com/metasploit-unleashed/Main_Page](http://www.offensive-security.com/metasploit-unleashed/Main_Page)

    - [http://www.offensive-security.com/metasploit-unleashed/Msfconsole_Commands](http://www.offensive-security.com/metasploit-unleashed/Msfconsole_Commands)


    Security Bulletin Sites


    +   - [http://cve.mitre.org/](http://cve.mitre.org/)

    - [http://technet.microsoft.com/en-us/security/bullet](http://technet.microsoft.com/en-us/security/bullet)


    # ## Introduction


    For the security testing community, Metasploit (and Metasploit Pro) is one of
    the coolest things since sliced bread. Metasploit gives you a complete framework,
    or playground for security testing.


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_30_0.png)


    ```

    # metasploit v4.7.8-20180310101 [core:4.7 api:1.0]

    + --[ 1169 exploits - 643 auxiliary - 186 post

    + --[ 312 payloads - 30 encoders - 8 nops

    ```


    The Metasploit Framework is a comprehensive platform for performing vulnerability
    testing, and exploitation. It is loaded with over a thousand exploits, hundreds
    of payloads and multiple encoders.


    We will cover the basics of using Metasploit in this chapter, and then in a later
    chapter see how to use Metasploit against a test target. If you are already familiar
    with Metasploit then feel free to skip this chapter or use it as a refresher.


    # ## Updates


    Normally to update Metasploit, you simply run "msfupdate", but according to the
    Rapid 7 website, Metasploit updates are synced to update with Kali.


    (https://community.rapid.com/thread/3007)'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Metasploit Overview


    You can start Metasploit a couple of different ways, from the menu or from a terminal.


    +   - /Kali Linux/Top Ten Security Tools/Metasploit framework

    - /Kali Linux/Exploitation Tools/Metasploit

    - Or just "mfconsole" in a terminal


    Once Metasploit loads you will see the following main screen and be given an “msf>”
    prompt.


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_31_0.png)


    Metasploit can be a little confusing if you have never used it before, but once
    you get used to know how it works, you can do some amazing things with it.


    Basically, using Metasploit to attack a target system usually involves:


    +   1. Picking an Exploit

    2. Setting Exploit Options

    3. Picking a Payload

    4. Setting Payload Options

    5. Running the Exploit

    6. Connecting to the Remote System

    7. Performing Post Exploitation Processes


    The screenshot below shows an example of this process, but don’t worry; we will
    cover the process in much more detail as we go along.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Depending on the type of exploit, once our exploit is complete we will normally
    end up with either a remote shell to the computer or a Meterpreter.


    A remote shell is basically a remote terminal connection or a text version of
    remote desktop for Windows users. It allows us to enter commands as if we are
    sitting at the keyboard.


    But a Meterpreter offers a ton of interesting programs and utilities that we can
    run to get information about the target machine, control devices like the webcam
    and microphone, or even use this foothold to get further access into the network.


    And of course, if needed, you can drop to a regular shell at any time.


    In most cases, depending on what you are trying to do, a Meterpreter Shell is
    much more advantageous than just a regular shell.


    We will discuss the Meterpreter Shell later, but for now let''s quickly cover
    the first five steps.


    > Tech Note:

    When all else fails and you start to feel lost in Metasploit, or the Meterpreter
    shell, try typing the "help" command.

    You can also use the "tab" key to autocomplete a line or hit it twice to show
    all available exploits and payloads.

    Ex. `show exploits <tab><tab>


    # Picking an Exploit


    If you are a glutton for punishment and want to view all the exploits, just type
    "show exploits" from the msf prompt:


    ```

    msf> show exploits

    ```


    But it is easier to use the search command to find what you are looking for. Simply
    type "search" and then the information you want. Sometimes being very specific
    will help you find the exploit you want quicker.'
