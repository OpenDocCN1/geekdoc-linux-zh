  md: '# meterpreter > help


    When we do so, we see that the commands are broken out into sections.


    The commands are:


    +   - Core Commands

    - File System Commands

    - Networking Commands

    - System Commands

    - User Interface Commands

    - Webcam Commands

    - And three Priv Commands


    We will not cover all of the commands, but will look at a couple in a little more
    depth. It is a good idea to read through them all to get a basic understanding
    of what they can do.


    # Core Commands


    | Command | Description |

    |---|---|

    | ? | Help menu |

    | background | Backgrounds the current session de-meterpreter script |

    | bgkill | Kills a background meterpreter script |

    | bglist | Lists background scripts |

    | bgrun | Executes a meterpreter script as a background thread |

    | channel | Displays information about active channels |

    | close | Closes a channel |

    | disable_unicode | Disables encoding of unicode strings |

    | enable_unicode | Enables encoding of unicode strings |

    | exit | Terminates the meterpreter session |

    | help | Help menu |

    | info | Displays information about a Post-module |

    | interact | Interacts with a channel |

    | ir | Drop into scripting session |

    | load | Load one or more meterpreter extensions |

    | migrate | Migrates the server to another process |

    | quit | Terminates the meterpreter session |

    | read | Reads data from a channel |

    | resource | Runs the commands stored in a file |

    | run | Executes a meterpreter script or Post-module |

    | write | Writes data to a channel |


    As a beginner level user, you will probably only use background, help, load, migrate,
    run and exit from this list:


    +   - Background - Background allows you to background a session so that you can
    get back to the msf prompt or access other sessions.'
