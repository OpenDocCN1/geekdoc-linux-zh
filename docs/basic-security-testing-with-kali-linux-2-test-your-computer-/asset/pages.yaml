  md: 'obtain configuration information, directory transversal, run remote commands,
    and more.


    Routerpwn includes a MAC lookup utility and a link to external resources including
    router default password list site and Shodan.


    Shodan (Shodanh.com) is probably one of the easiest ways for an attacker to find
    routers and others on the web. For the most part, entering the manufacturer''s
    name as a keyword will return thousands of them.


    The crazy thing is that because Routerpasswd is a website, it can be run off of
    almost any platform - Windows, Linux, smart phones, etc. In one security seminar
    the author of the tool mentioned that you can run it from a Wii!


    Routerpwn is a great one stop shop for finding basic exploits.


    # # Wi-Fi Protected Setup (WPS)


    WPS is used to try to make up new Wi-Fi devices easier, by allowing users to use
    a PIN or button presses instead of having to enter a long passphrase. Many routers
    support it, but the way in which it works opens it up to possible hacker brute
    force attacks.


    Cracking a complex Router passphrase could take days, or even months. But in many
    cases, WPS can be cracked to gain access to a router WPA/WPA2 passphrase in usually
    under 10 hours.


    WPS on the router side will look like this screenshot of a router configuration
    page below:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_187_0.png)


    I don''t want to spend a lot of time on this, but we will take a quick look at
    a couple utilities that can be used to perform WPS attacks.'
