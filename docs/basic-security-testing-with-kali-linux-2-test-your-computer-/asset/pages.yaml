  md: '# Chapter 11 - Packet Captures and Man-in-the-Middle Attacks


    # Introduction


    Another technique that may be advantageous to us is to monitor or capture network
    traffic on a remote machine.


    Think of it like a wiretap. As a wiretap records everything a person says on their
    telephone, a packet capture records everything your computer says on the network
    wire. This could include account names, passwords, etc.


    In this section we will look at viewing network packets using two very different
    processes.


    For the first we will use a Man-in-the-Middle attack on a system on a local network
    involving the commands arpspoof, urlsniff and Driftnet. Using these commands we
    can view what website a target is on and display every graphic that the target
    is viewing.


    Secondly, we will cover running a packet capture on a remote machine through Metasploit
    session. We will then view the captured information for artifacts in Wireshark
    and Xplico.


    In both cases we will use a Windows 7 computer as the target system.


    # Creating a Man-in-the-Middle attack with Arpspoof


    We will now learn how to use a Man-in-the-Middle (MitM) attack to capture and
    monitor network traffic.


    A MitM attack in essence places our Kali system in between the target and the
    router. This way, we see all of the traffic coming from and going to the target
    system.


    All traffic from the target system headed to the internet is re-routed first to
    our machine, which then captures it and forwards it to the network. All information
    coming from the internet headed to the target machine is routed through our system
    first, again we can review it, and forwarded to the target system.


    We accomplish this by modifying the ARP (Address Resolution Protocol) tables on
    the router and the target system. The ARP tables tell a system what physical MAC
    address an IP address is actually located at. So we tell the Target machine that
    we are the internet router and tell the router that we are


    +   1. We can modify ARP tables easily with the “arpspoof” program. But first
    we need to turn on IP forwarding by running the following command:'
  merge: -1
