  md: 'We see in the picture above, we can set a couple options for this exploit,
    which leads us into our next section.


    But before we set our exploit, we need to use “use”. Once we have the exploit
    we want, we simply run the “use” command with the exploit name. Again copying
    and pasting the exploit path and names will work very well here too:


    ```

    msf> use exploit/unix/irc/unreal_ircd_3281 backdoor

    msf exploit(unreal_ircd_3281 backdoor) > _

    ```


    Okay, we are now using our exploit, so do we set the options?


    # Setting Exploit Options


    Setting options in Metasploit is as simple as using the “set” command followed
    by the variable name to set and then the value.


    +   - set <Variable Name> <Value>


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_35_0.png)


    To set what variables can be set, use the “show options” command:


    ```

    msf exploit(unreal_ircd_3281 backdoor) > show options

    Module options (exploit/unix/irc/unreal_ircd_3281):

    Name            Current Setting Required Description

    RHOST           yes             The target address

    RPORT           6667           yes             The target port


    KALI LINUX

    Exploit target:

    Id              Name

    The quieter you become, the more you are able to hear

    0               Automatic Target

    msf exploit(unreal_ircd_3281 backdoor) > _

    ```


    This exploit only uses two main variables, RHOST and RPORT. Rhost is the remote
    host that we are attacking and Rport is the remote port.'
