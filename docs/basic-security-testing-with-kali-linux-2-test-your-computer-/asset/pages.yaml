  pgno: 63
- img_proc: true
  md: 'As you can see from the screenshot above, Recon-NG is enumerating the sub-domains
    for a fictitious website called "DomainName". Within seconds, several of the sub-domains
    are listed.


    All the data collected by Recon-NG is placed in a database. You can create a report
    to view the data collected.


    Just type in “back” to get out of the current module:


    ```

    [+] 46 total hosts found.

    [*] 46 NEW hosts found!

    recon-ng [google_site] > back

    recon-ng > |

    ```


    And then “show modules” again.


    Notice the “Reporting” section:


    ```

    Reporting

    ------

    reporting/csv_file

    reporting/html_report

    reporting/list

    reporting/pushpin

    ```


    Simply use > use reporting/csv_file to automatically create a nice report of the
    data that you have obtained.


    ```

    recon-ng > use reporting/csv_file

    recon-ng [csv_file] > run ''./workspaces/default/results.csv''

    [+] 46 records added to results.csv

    ```


    All the files will be stored in the “/usr/share/recon-ng/workspaces/default” directory.


    # Recon-NG wrap up


    Sub domain enumeration is only one module you can run, there are many others to
    choose from. There are also some that require a program API key like Twitter,
    Shodan, LinkedIn or Google. Using these you can get specific information from
    the corresponding sites about your targets.'
