    # Running Scripts


    The last topic we will cover in this section is running scripts. Meterpreter has
    over 200 scripts that you can run to further expand your exploitation toolkit.


    We actually have already touched on these. We used the “run” command to use the
    sound and webcam script attacks. We will take a moment and cover a couple of them.


    To see a list of all the available scripts just type “Run <tab><tab>”:


