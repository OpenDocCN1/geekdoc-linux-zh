    # SET ''s Java PYInjector Attack


    So far we have just sent a fake e-mail that could redirect someone to a bogus
    site. But what if we made a fake site that offered up a booby trapped script.
    And if the user allows the script to run, creates a remote shell with the user?


    The Java PYInjector attack leverages the anti-virus bypassing capabilities of
    PowerShell based attacks with a Java application. We will use SET to create a
    fictitious website that will offer up a booby-trapped Java app. And if the user
    allows the app to run, we get a full remote session to the system.


    We will be using a Windows 7 system as the “target” in this example.


    From the main SET menu:


    +   1. Select number 1, “ Social-Engineering Attacks ”.

    2. Next select 2, “ Website Attack Vectors ”.

    Notice the other options available.

    3. Then 1, “ Java Applet Attack Method ”.

    This will create a Java app that has a backdoor shell.


    There are several alternative attack options available here.


    The Metasploit Browser Expl attacks the client system with Metasploit browser
    exploits. The Credential Browser Hacker attack is pretty slick as it clones an
    existing website (like Facebook) and then stores any credentials that are entered
    into it. TabNabbing works if the client has a lot of browser windows open, it
    waits a certain time then switches one of the tabs to a page that SET creates.
    The Web-Jacking attack uses IFrame replacements to make a malicious link look
    legit. and finally, the Multi-Attack combines several of the above attacks.


    +   4. Next choose 1, “ Web Templates ” to SET create a generic webpage to use.
    Or use Option 2, “ Site Cloner ” to allow SET to use an existing webpage as a
    template for the attack webpage.


    +   5. NAT/Port Forwarding – Select yes or no depending on if your SET system
    will use a'
