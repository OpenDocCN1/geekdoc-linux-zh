    creating a possible 64 exploits. When the client connects, Metasploit tried numerous
    client attacks against our victim and in the end was able to create three fully
    functional remote shell connections.


    In real life you would likely have to social engineer your target and convince
    them to visit the Subterfuge site either by e-mail link or a phone conversation.


    This is one of the things that Subterfuge can do. You can also perform several
    other attacks including Man-in-The-Middle type attacks. Take some time and play
    with the different options to see what you can do.'
