- img_proc: true
  md: 'You should now have two files, “root/Desktop/passwd” and /root/Desktop/shadow-”
    on your local Kali system.


    Next we need to have both newly created text files and run the “Unshadow” command
    on them from the John Ripper utilities. This command takes the files and combines
    them into a single file (cracked) that John Ripper can crack:


    ```

    root@kali:~/Desktop$ unshadow passwd shadow > cracked

    ```


    Okay, now that we have combined the “cracked” file, we can unleash John the Ripper
    on it to attempt to retrieve the passwords.


    We will use the wordlist “password.lst” that comes with John:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_181_0.png)


    Okay, 7 password hashes and only one remaining. Now just use the show command
    to see what it found:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_181_1.png)


    And there we have 6 usernames and passwords to play with.


    +   - sys/ batmanman

    - klog/ 1234567898

    - msfadmin/ msfadmin

    - postgresql/ postgres

    - user/ user

    - service/ service


    Looks like the administrator of the box used simple passwords, not a good idea.


    # Automating Password Attacks with Hydra


    Now that we have these passwords, we can take them and use “Hydra ” to automate
    attacks against the Metasploitable system’s services.


    Hydra is a brute force attack program that takes a user list and password list
    and tries different combinations of them to attack server services.


    If we make a text file with the usernames and another with the passwords that
    we acquired above, we can feed them to a program like Hydra to automate testing
    of these passwords to see what services'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'So, if we want to attack the SSH service with our newly created passwords,
    we could do something like this:


    ```

    root@Desktop:~$# hydra -L user -P 192.168.198.145 ssh

    Hydra v7.5 (c)2013 by van Hauser/ThC Maciejak for legal purposes

    Hydra (http://www.thc.org/hydra) starting at 2013-11-02 16:35:44

    [DATA] 16 tasks, 1 server, 81 login tries (l:9/p), -5 tries per task

    [DATA] attacking ssh on port 22

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    KALI LINUX

    The quieter you become, the more you are able to hear

    [ERROR] ssh protocol error

    [SUCCESS] host: 192.168.198.145 login: msfadmin password: msfadmin

    1 target successfully completed, 1 valid password found

    Hydra (http://www.thc.org/hydra) finished at 2013-11-02 16:36:02

    root@Desktop:#

    ```


    The “-L” lists our username file, “user” in this case. The “-P” switch is the
    location of our password file, or “pass” in this case. Then we just list the target
    IP address and the target service and that is it!


    (You can use Hydra-GTK from the Online Password attack menu if you prefer a graphical
    interface)


    As you can see it found the right combination of username and password pretty
    quick:


    msfadmin/ msfadmin


    Though it is kind of silly trying a small list of passwords that we already know,
    the concept is solid. Without having any of the actual passwords we could use
    hydra with a large username and dictionary file to try to brute force our way
    into the server.


    # Conclusion


    That is all there too it. Because we had a root shell, we were able to grab the
    Linux password hashes from simply copying and pasting them to our local machine.
    We were then able to use John Ripper to crack them.


    If you take a good look at the Metasploit service scanner programs mentioned in
    an earlier tutorial, you probably noticed some that had a place to set usernames
    and passwords. How would it be just to feed our newly cracked passwords into these
    scanners and unleash them on the Metasploitable box?


    Also, as many times use the same passwords on other boxes, we could use the same
    scanners to target the whole network address space to see how many other machines
    we could get access to!


    If the Linux administrator had updated his software, or even used complex passwords
    this would have been much harder, if not impossible to do.'
