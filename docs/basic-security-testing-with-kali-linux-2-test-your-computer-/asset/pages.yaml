  md: '# # Chapter 21 - HashCat


    # ## Resources


    +   - Hashcat Wiki - http://hashcat.net/wiki/

    - Installing video drivers for your card - http://docs.kali.org/general-use/install-nvidia-drivers-kali-linux

    - Wordlists - See Wordlist Chapter


    # ## Introduction


    So far we have covered several techniques for attacking passwords. We saw that
    sometimes you can just do a rainbow table lookup, and in some cases you can pass
    the hash. But if all else fails, you have to crack the hash.


    Kali includes several excellent programs to do this. In this section we will look
    at one of our favorites, Hashcat.


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. As cracking programs improve and video cards get
    faster (Video GPU''s are used for very fast cracking) passwords are becoming much
    easier to crack.


    How big of a problem is this?


    Not long ago I tried OCL-Hashcat with my Windows 7 system that had a Core i5-750
    processor running at 2.67 Ghz and a single AMD Radeon 7870 video card. I used
    a fairly recently released password hash file that contained over 7,000 user hashes.
    I chose this one due to the size. Yes much larger are out there, but I thought
    the size corresponded realistically to an average company that a pentester or
    incident response team would be dealing with. Besides, how many American businesses
    have a million or more employees?


    With OCL-Hashcat and two different dictionary files, I was able to crack 86% of
    it... In 30 minutes...


    If that doesn''t sound impressive, OCL-Hashcat took just 12 seconds to recover
    46% of them, and about 13 minutes to recover 66%.


    Think about that for a moment, 46% of the seven thousand passwords were cracked
    in 12 seconds.


    Now, take a minute and think about your company password length and complexity
    policy. Long, complex passwords can take an exponentially longer time to crack,
    unless the password is in a dictionary file.


    # ## Hashcat


    Hashcat is an all-purpose password cracker that can run off of your graphics card
    processor (GPU) or your CPU. The GPU version, OCLHashcat-plus (or CUDAhashcat-plus
    depending on your video'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'is toused as the world’s fastest md5crypt, phpass, mcash2 and WPA / WPA2 cracker.


    Hashcat is a multi-threaded cracker, so if your CPU can run several threads, it
    will use them. But the real speed comes to play when using the horsepower of a
    GPU, the processor on your video card. If your GPU can run hundreds of threads,
    all of this power is used to break passwords.


    You can even harness the power of multiple video cards to create a monster cracking
    station.


    # Cracking NTLM passwords


    There is nothing like hands on practice, so let’s crack some hashes.


