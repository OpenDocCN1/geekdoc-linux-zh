  md: 'ATION section Thus you can see one of the inherent security flaws of Wi-Fi.
    Filtering clients by MAC address is not a very effective security strategy as
    it is trivial to view which clients are connected to APs by their physical address.


    All an attacker would have to do is view which addresses have connected and spoof
