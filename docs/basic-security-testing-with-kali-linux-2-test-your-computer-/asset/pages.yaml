  md: '# Chapter 27 – Wi-Fi Testing with WiFite


    # Introduction


    There are several programs that take the Aircrack-ng toolset and add a graphical
    or text menu to it. This makes it much easier to use the toolset without having
    to remember all the individual commands.


    Now we will take a look at WiFite a quick and easy to use command line driven
    program for finding and testing wireless networks.


    # Using WiFite


    +   1. To start WiFite simple type wifite at a terminal prompt:


    ```

    root@Kali:~# wifite

    ```


    +   2. Wifite will start and automatically begin scanning for networks:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_202_0.png)


    +   3. At this point just let it run for a while. You will see wireless networks
    begin to fill in as they are found. When you feel you have found enough, or have
    found the ones you are looking for, hit `CTRL-C`.


    +   4. You will then be asked what Wi-Fi networks you would like to attack. You
    can pick an individual one, pick by separating the numbers with a comma, or just
    type ''all'' to attack all of them.


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_202_1.png)


    Things to notice here, you have NUM, which is the number of the Wi-Fi network
    that you want to'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'ENCR is the type of encryption the network is using (Open,WEP, WPA, or WPA2),
    the POWER level in decibels, if Wi-fi Protected Setup (WPS) is enabled and if
    any CLIENT are connected. It will say ''client'' if one is connected or ''clients''
    if multiple clients are present.


    5. For this example, Number 1 - "Vulnerable", seems like a good one to try. As
    you can see it is using only WEP encryption is easy to crack.


    WiFi immediately begins to automatically attack and crack the WEP key.


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_203_0.png)


    A fairly large number of Initialization Vectors (IVs) are needed to crack the
    WEP key. Wireless AP’s generally generate IVs, but we need a large number of them
    you can see the aircrack-ng tools working in the background injecting packets
    to force the AP to produce a large amount of these key packets.


    Once enough of the packets have been collected the WEP key can be decoded as shown
    below:


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_203_1.png)


    [00:10:08] preparing attack "Vulnerable" (08:A3:B6:AA:83:7C)

    [00:10:08] attempting take authentication (2/5)... success!

    [00:10:08] attacking "Vulnerable" via arp-replay attack

    [00:08:04] started cracking (over 10000 ivs)

    [00:07:10] captured IV at rate 0.72/sec

    [00:07:18] cracked "Vulnerable" key: 1234567890

    1 attack completed:

    [+] 1/1 WEP attacks succeeded

    cracked "Vulnerable" (08:A3:B6:AA:83:7C), key: 1234567890

    [+] disabling monitor mode on mono0...done

    [-] quitting


    As you can see, WiFiite successfully cracks the WEP key, "1234567890" in this
    case.


    # More advanced attacks with WiFi


    WiFi has some command line switches that allow us to tailor our attacks. For example
    we can specify an individual Wi-Fi router by name if we know it by using the -e
    "AP Name" switch.


    We can also include a dictionary file to speed up cracking the WPS password by
    using the dictionary file --dict/Path switch.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Try by combining them to use the RockYou password file to attack a specific
    Wi-Fi network:


    ```

    root@kali:~# wifite -e "Vulnerable" --dict /usr/share/wordlists/rockyou.txt

    ```


    You can use the "-all" switch with an encryption switch (-wpa) to attack all networks
    detected that use WPA. Additionally, you can use the power switch (-p 60) and
    wps switch (-wps) to crack all Wi-Fi networks using WPS that have a power rating
    over 60 decibels.


    # Conclusion


    In this chapter we demonstrated how to use the WiFi program to discover and test
    network security from an easy to use menu driven system. We also discussed how
    to use command line switches with WiFi to customize our tests.


    Wifite is a streamlined program that allows you to perform wireless network pentesting
    very quickly.'
  merge: -1
