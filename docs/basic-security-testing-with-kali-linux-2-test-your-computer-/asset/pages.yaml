    SESSION         yes            The session to run this module on.

    TIMEOUT         3600           Search timeout. If @ the module will go t

    rough the entire MPET.

    msf post(recovery_files) > set drive E:

    DRIVE => E:

    msf post(recovery_files) > set SESSION 1

    SESSION => 1

    msf post(recovery_files) >

    ```


    As you can see in the screenshot, there are a couple settings that need to be
    set.

    If you just want to see what files are there, you only need to set the “Drive”
    and “Session” settings as shown above.


    Then just run the exploit:'
