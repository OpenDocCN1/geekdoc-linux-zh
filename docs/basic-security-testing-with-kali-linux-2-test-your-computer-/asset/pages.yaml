    But again, how many people actually record and analyze their data traffic?


    The module functions extremely well though on smaller drives that don''t have
    an enormous amount of deleted files. It was lightning fast and worked very well.


    # Conclusion


    In this chapter we learned a lot about Metasploit''s Meterpreter shell. Though
    we covered some of the basics of getting around and using the shell, we only touched
    on a fraction of its capabilities. Hopefully you can see why a Meterpreter shell
    gives you a lot more functionality than just getting a remote access shell.


    Grabbing video and sound may be a bit theatrical, but social engineers could use
    information they glean. From video they could grab images of people''s badges,
    and a glimpse into the target''s physical environment.


    Sound is interesting too. A social engineer could learn a lot about the target
    facility by being able to have a live microphone inside the building. And not
    too long “Sinn3r” from the Metasploit development team showed how they could grab
    recorded audio and search it using AT&T''s Watson speech recognition program and
    Metasploit to look for keywords like “password” or “social security number”.


    (See “Resources” above for link to article)'
