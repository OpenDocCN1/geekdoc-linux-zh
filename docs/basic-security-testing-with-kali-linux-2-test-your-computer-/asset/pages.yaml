    Ign http://http.kali.org kali/main Translation-en-en

    Ign http://http.kali.org kali/main/non-free Translation-en_US

    ```


    3. And, “apt-get dist-upgrade":


    ```

    root@kali:~# apt-get dist-upgrade

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    Calculating upgrade... Done

    The following packages will be REMOVED:

    console-tools icedtea-j-re-cacao-libopenvas5

    ```


    (Type, “y”) and enter when prompted that this might be a good time for a break,
    you deserve it!


    +   4. When done, reboot.


    | Tech Note:

    | There are additional source repositories that you can manually add to Kali if
    you want.

    | For example if you want the absolute latest and greatest, you can add the “Bleeding
    Edge” repositories to Kali. But these do come with the warning that they are not
    manually maintained and are low priority.

    | For more information:

    | http://docs.kali.org/general-use/kali-linux-sources-list-repositories |


    That''s it; Kali should be installed, updated and ready to go. We will take a
    closer look at the desktop in the next section.


