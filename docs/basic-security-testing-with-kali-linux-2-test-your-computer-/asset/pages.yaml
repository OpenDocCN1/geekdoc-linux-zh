  md: "# # Chapter 22 - Wordlists\n\n## Introduction\nWordlists are very important\
    \ when trying to crack passwords, as cracking programs can take a text file filled\
    \ with passwords, also known as a wordlist or dictionary file, and use it to crack\
    \ passwords.\nMost cracking programs can use the password file directly as they\
    \ exist, Most cracking programs can use the password file directly as they exist,\
    \ while more advanced ones can use the password file (or multiple files) and manipulate\
    \ them to create many new combinations of passwords to try.\nFor example, some\
    \ can take all the passwords in the wordlist and attach letters or numbers to\
    \ the beginning or end of the word.\nSome programs will take two or more password\
    \ files and combine the words from both to make a new list of words to try.\n\
    And finally some crackers use rule sets that modify how they work. Some rulesets\
    \ will change all upper case characters to lowercase, or vice versa. Others can\
    \ completely modify the word and use the new word. As mentioned before, a Le (133t)\
    \ Speak rule set would take a word from the password file and convert it to “leet\
    \ speak”, replacing common letters with numbers.\nUsing a wordlist can make password\
    \ cracking easiest and faster.\nMany pentesters will make their own password list\
    \ using company data, employee names, phone numbers, e-mail addresses, etc.\n\
    But where can we find wordlists?\n\n# ## Wordlists Included with Kali\n\nKali\
    \ comes with several that you can use, the problem is just finding them. Most\
    \ are in the directory of the main program that uses them.\n(On the latest release\
    \ of Kali, shortcut links to the other wordlists are stored in the “usr/share/wordlists”\
    \ directory)\n\n# ## ROCKYOU Wordlist\n\nThe most popular one would probably be\
    \ the RockYou wordlist. This is a huge collection of millions of passwords that\
    \ were actually used and pulled from a database dump.\nThe file is located in\
