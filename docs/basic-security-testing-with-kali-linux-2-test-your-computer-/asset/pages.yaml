    # Recovery File Module Wrap-Up


    The module seems to work really well on data drives, but not so on data drives
    where there are a lot of files to recover, like on the main drive of a single
    drive system.


    I ran this on a Windows 7 boot drive on a VM that I have used a lot and literally
    took hours to run. Granted it probably found a thousand files, but I just can''t
    see how feasible this would be in real life if it would create an enormous amount
    of suspicious network traffic.


