  md: '# # Chapter 15 - Subterfuge


    # ## Automatic Browser Attack with Subterfuge


    In this section we will continue to talk about Social Engineering type attacks.
    We will use a program called Subterfuge to create a fake webserver that will automatically
    attack any browser that tries to connect to us.


    This will simulate one way that hackers can gain access to a target machine by
    having them visit a malicious website. As soon as a client visits this webserver,
    Subterfuge automatically runs a slew of browser attacks through the Metasploit
    Framework’s Browser AutoPwn module at the client.


    If one (or more) of the attacks succeed, we usually get a full remote command
    shell to the client system.


    # ## Let''s get started


    First up we will need to install Subterfuge.


    Subterfuge was one of the programs removed from the Backtrack platform. It was
    present in Backtrack 5 but removed in the switch to Kali, most likely as there
    are other programs in Kali that do similar things. From reading the online forums,
    it sounds like Subterfuge could possibly be added back in at some time. But the
    install isn''t that hard.


    Let''s go ahead and download Subterfuge:


    +   1. Download Subterfuge (http://code.google.com/p/subterfuge/downloads/list)


    ![](img/3ef0f51cacb0127e8ad0ea42f248a9fe_133_0.png)


    +   2. Go ahead and save it in the root.'
