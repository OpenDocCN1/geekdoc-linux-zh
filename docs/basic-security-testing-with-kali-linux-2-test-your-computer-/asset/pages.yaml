    -p passive mode: do not send anything, only sniff

    -f perform an ARP request as a broadcast (default: "arp")

    -s time: time to sleep between each arp request (microseconds)

    -n node: last octet used for scanning (2 to 253)

    -c count: number of times to send each arp request (for nets with packet loss)

    -d timeout: set timeout, recommended for auto audit

    -g ignore home config files for autofast and fast mode

    -e enable sleep time between each request (hardcore mode)

    -o print results in a format suitable for parsing by other program

    -P parsable output (-P), continue listening after the scan is completed

    ```


    If r, -l or -p are not enabled, netdiscover will scan for common addresses.


    Netdiscover is another neat tool included in Kali. It too can be run from the
    command prompt or the menu system.


    Netdiscover scans a network looking for devices and displays them:'
