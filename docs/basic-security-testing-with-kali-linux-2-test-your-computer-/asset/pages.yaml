  md: 'search all you need to do is start the PostSQL Database before running msfconsole
    (though your search will work without it running, it will just be slower).


    To start the Database at a terminal prompt, type the following:


    +   - service postgresql start

    - service metasploit start

    - msfconsole


    Metasploit allows you to search for exploits in multiple ways, platform, or even
    CVE (Common Vulnerabilities and Exposures) and bugtrack numbers.


    Type “help search” to see all of the options:


    ```

    msf > help search

    Usage: search [keywords]


    Keywords:

    app : Modules that are client or server attacks

    author : Modules written by this author

    bug : Modules with a matching Bugtrack ID

    cve : Modules with a matching CVE ID

    edb : Modules with a matching Exploit-DB ID

    name : Modules with a matching descriptive name

    osvdb : Modules with a matching OSVDB

    platform : Modules affecting this platform

    ref : Modules with a matching ref

    type : Modules of a specific type (exploit, auxiliary, or post)


    Examples:

    search cve:2009 type:exploit appclient

    ```


    To search by name, just type search and the text you want. So for example to see
