    IP address to surf directly to the device found.


    On the left side of the screen, Shodan also shows you how many of the total devices
    are from a certain country or location. You can click on any of them to zero in
    your search, or you could use keyword filters directly in the search to fine tune
    the results.


    # Filter Guide


    Using Filter commands you can quickly narrow down your searches to very specific
    things.


    For example, say you were a Microsoft employee and needed to find all the IIS
    servers running 8.0 in the US that are a part of the Microsoft domain?


    You could enter something like the line below:


    ```

    Shodan Exploits Scanhub Anniversary Promotion

    SHODAN 8.0 hostname.microsoft.com country US Search

    ```


    This quickly and easily sorts the millions of servers out there and returns the
    ones that match the query.


    Here is a sample search return:'
