    # ## Investigating Traffic Logs


    There are various ways to investigate BLE traffic. If you are investigating BLE
    packets sent by an Android phone, an easy way is to let your phone log Bluetooth
    packets using an app, then transfer the logs to your computer and open them with
    Wireshark to follow the recorded Bluetooth traffic.


    Wireshark is a powerful open source network protocol analyzer. Network administrators
    use it to analyze traffic and troubleshoot a WiFi or Ethernet network at home.
    Wireshark can also capture other protocols, including Bluetooth, or from logs.


