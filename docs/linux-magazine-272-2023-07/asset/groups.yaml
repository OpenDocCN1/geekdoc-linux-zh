    图 2：有一系列令人印象深刻的 DTP 开源工具可用，但目前还不清楚它们在每个平台上具体是如何使用的。


    原因是，你下载的数据并不是专门为与其他服务具有互操作性而设计的。Facebook 在某种程度上纠正了这一点，允许你以 JSON 格式而非 HTML 格式下载账户数据，以便于在其他服务中使用
    [6]，但仍然警告说这些文件仅供个人使用（图 3）。欧洲的 GDPR（通用数据保护条例）等法规也要求公司提供其客户客户的所有信息。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_17_0.png)

    图 3：像 Facebook 这样的网站允许你以 JSON 格式下载账户信息以便于重新上传，但这些文件并不包含你所有的数据。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_17_1.png)

    图 4：XMPP（原 Jabber）是一种开放的消息标准，科技巨头可以使用它来实现跨平台之间的消息传递。


    在像 Facebook 这类网站的情况下，数据并不一定包括位置数据、人脸识别、朋友个人资料等。正如美国议员 David Cillotine 在剑桥分析（Cambridge
    Analytica）丑闻期间指出的，如果用户能够轻松传输所有数据（例如指向朋友的链接 [，较小的公司才能与 Facebook 竞争竞争。


    ## 数据困境


    开放性、数据透明度和可移植性是非常受推崇的目标，我们完全欢迎任何允许用户访问并控制其数据的尝试。尽管如此，在 Facebook 和 Twitter 等私有平台上添加数据扩展，远不能意味着实现一个像
    Diaspora 或 Mastodon 那样完全开源、去中心化的社交网络平台。数据传输项目是打破科技巨头魔咒的重要一步，但尚未宣告胜利。


    ## 开放数据与开源


    在他们的公告中，Facebook 和 Google 正在顺应数据传输的开源特性。存在开源扩展，允许数据传输项目在 Google Cloud 和 Microsoft
    Azure 上运行。项目的总体目标是确保开放数据——而不一定是开源工具——因为运行在云端的私有服务或闭源服务并不是自由软件的理想情况。由于运行在平台上的软件是私有的，因此无法确定你的每一个部分都是安全的。

