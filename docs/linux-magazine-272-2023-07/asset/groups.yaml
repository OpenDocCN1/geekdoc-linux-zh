    # Security search


    ## Nosey Parker


    It doesn''t take much effort to search Google or GitHub for API keys and others
    inadvertently share the world. This kind of information is often hidden within
    files or directories, unsettling with whatever files or directories were intended.
    Details can be very difficult to track unless you share anything that is from
