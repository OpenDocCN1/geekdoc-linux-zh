    # 使用 CKAN 的开放数据

    在马特拉拉的数据界面中，CKAN 用户在使用任何或其他服务时将不会遇到问题，正如我想象的那样！点击该按钮打开面板 10，你可以在其中定义数据集的 HTML
    iframe 并复制相应的 HTML 代码。


    图 6 中的每个条目都提供了项目名称、经理、国家以及马特拉拉已完成或正在中的工作百分比。在图 7 中，在将图 10 中的代码粘贴到编辑器和两个短段落后，图
    5 中的地理坐标让 CKAN 让你像使用电子表格软件一样快速创建各种图表来可视化原始数据。对于图 7，例如我绘制了每个项目的工作（可用）。这就是我为了创建图
    11 中完美的动态网页所做的一切，你能够搜索数据集、地图、内容或制作图表，就像原始状态一样，不是吗？


    你还可以创建一个 JSON 格式的数据集下载版本（图 8）。对于每个数据集，CKAN 会自动创建一个网页（图 9），列出所有数据链接（端点）以及多种编程语言的数据库查询。要生成
    API 页面，点击 Data 按钮（图中未显示）。


