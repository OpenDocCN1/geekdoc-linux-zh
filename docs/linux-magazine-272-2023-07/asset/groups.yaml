    # Open Data


    As long as governments have kept data, there have been people who have wanted
    to see it and control it. A new generation of tools, policies, and advocates seeks
    to keep the data free, available, and in accessible formats. This month we bring
    snapshots from the quest for open data.


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_4_0.png)


    ## LINUXVOICE


    - 73 **Welcome**: This month in Linux Voice.

    - 74 **Doghouse - Databases**: There are many FOSS databases available inexpensively
    today, and they might serve new projects well.

    - 75 **Espanso**: Espanso is a cross-platform text expander that can do far more
    than simply replace text modules.

    - 80 **nnn**: If you''re a Linux lover, you''ll know the command line is the stickiest
    and most efficient way to interact with the system. Free from point-and-click
    developer jargon, use nnn command-line manager.

    - 58 **DIY Lenticular Camera**: You can take lenticular images with a home-camera
    to recreate the "wiggle" pictures of your childhood.

    - 64 **Digital IC Simulation on Linux**: Designing-programmable gate arrays is
    only half the job: The hardest part is the simulation, but Linux is the best place
    to tackle challenges.

    - 84 **FOSSpricks**: This month Graham looks at Seably2D, Arianna, X-Pipe, Nosey
    Parker, IEM Plug-in, Open Hex, and more!

    - 90 **Tutorial - Carbonyl Web Browser**: This Chromium can run inside any console,
    with minimal resources, and is a great tool for making computers feel – and learning
    programming along the way.


