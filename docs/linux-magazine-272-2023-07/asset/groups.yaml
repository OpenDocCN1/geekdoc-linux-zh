    TUXEDO Computers has refreshed their popular InfinityBook Pro 14 with a 16:10
    3K display, a 99 Wh battery, and full Linux support.


    The 99 Wh battery reports improved lifetime and charge, which is easily supported
    by USB-C (Power Delivery) and the included DC power supply. It can charge with
    40 watts more than the weaker 15 watts of energy-saving CPUs in ultrabooks, turning
    this laptop into a much more mobile workstation. With dual-fan cooling, the device
    remains quiet.


    TUXEDO also includes the preinstalled Tuxedo Control Center, so the Intel13700H
    (14 cores and 20 threads) processor can be driven with 40 watts (not the weaker
    15 watts of energy-saving CPUs in ultrabooks).


    The display is 3K and the chassis is 1.7mm thick with a 1.3-kg weight. You can
    upgrade the TUXEDO InfinityBook Pro with up to 2TB DDR5-6400 RAM and 1 x M.2 SSD
    (PCIe Gen4.0) with up to 4TB of internal storage.


    The TUXEDO InfinityBook Pro 14 can be pre-ordered today https://www.tuxedo-computers.com/en/TUXEDO-InfinityBook-Pro-14-Gen8,
    at the time of writing, delivery is expected at the end of August.


    The base configuration of the InfinityBook Pro 14 - Gen8 includes Intel i7-13700H,
    a 14-inch display, 2 x 8 GB DDR5 RAM, and a 250GB Samsung 980 SSD, as well as
    TUXEDO OS preinstalled, with an entry price of EUR1,477.23 (excl. VAT).


    ## Linux Kernel 6.3 Release Interesting Features


    For those who like to use the latest/greatest Linux kernel, 6.3 has a few features
    that might interest you:


    On the top of the list is support for multi-actuator hard drives. Drives are being
    more widely adopted for hyper-scale cloud deployments because of their ability
    to enable faster performance by way of a set of parallel read/write commands.


    As well, Linux 6.3 adds Kernel Address Space Randomization, but this security
    feature is only available to RISC-V CPUs. Microsoft added hypervisor support for
    Hyper-V, and in addition to the 6.3 kernel, Intel GB NIC will be able to bring
    the 60-percent faster thread speed it suffered for the past years.


    Other features/improvements include support for the upcoming AMD and graphics
    cards, support for AMD''s Indirect Branch Speculation (to mitigate Spectre vulnerabilities),
    support for the Scalable Matrix Extension 2 instructions for ARM architecture,
    support for AES-SHA2-based encryption with NTFS, EXT4 optimizations, a faster
    B driver, and


