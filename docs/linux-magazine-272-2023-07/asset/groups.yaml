    # New Address


    The Data Transfer Project wants to make it easier to move your data between social
    media sites. By Nate Drake


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_15_0.png)


    Data portability and transparency are ongoing issues that plague all social media
    giants. Who owns the data you post to your social media accounts? Can you get
    a copy of the data if you ask for it? If not, what would you do with it?


    Many social media companies have APIs that let you extract and upload data, but
    data formats are dissimilar or proprietary, which means if you obtained the data,
    you couldn''t do much with it unless you are a programmer or have fancy skills.


    In 2018, a few leading social media companies pledged to make an effort at addressing
    this problem. The result is Data Transfer Project, which was recently rebranded
    and enhanced as the Data Transfer Initiative [1]. The mission of the Data Transfer
    Project (and Initiative) is to support a common data format for moving data from
    one platform to another, also as to provide the necessary tools for transforming
    data and out of that.


    In the long term, the goal is for users to be free from data lock-in. A user who
    wants to move data from (Twitter) to another platform (Facebook) will simply choose
    an option in the Facebook user interface, and the migration will happen automatically.
    According to the Data Transfer Project, the purpose of the project is to extend
    data portability by allowing users to download their data from their service provider
    (“provider”), providing the user the ability to directly transfer their data and
    out of any participating provider.


    The project was originally started by Google, Apple, Meta, Microsoft, Twitter,
    and SmugM (Figure 1), but other companies are invited to join. The Data Transfer
    Project is still


    a work in progress, but some code is available on GitHub [3] (Figure 2), and the
    developers provide API keys for the participating services who are interested
    in testing [4].


    # How It Works


    According to Meta''s Engineering Blog [5], the Data Transfer Project consists
    of three main components:


    +   * set schemas to represent each version (i.e., photos, contacts, playlists)

    * authentication, which handle the authentication of a user to a service (normally
    OAuth) and the transformation of data to and from shared data models (importers
    and exporters)

    * task management framework, which puts all the pieces pieces together to handle
    the life cycle of a transfer including scheduling, execution, and reporting


    The data models provide the neutral format for transferring data to or from the
    participating platforms. One of the guiding principles of the project is that
    the vendors should not have to rewrite their APIs. Instead, the vendor should
    transform the data from their own format into the neutral format – and also to
    transform the neutral data to a format needed for import. The adapters basically
    serve the extension of the APIs. With DTP, the vendor would have to create a different
    solution for every different platform. With DTP, the vendor just has to write
    an adapter'
