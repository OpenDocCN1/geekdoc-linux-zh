    # Considering FOSS Databases


    Recently a friend started a postgraduate course in software engineering, and that
    course was the topic of databases. My friend learned about them in his undergraduate
    degree in computer science, but not that much. Perhaps he needed more.


    Considered to be the premier for databases, the database engines would write their
    files into the filesystems. Not on Unix. In Unix the databases insisted on writing
    directly to partitions of the disk, bypassing the filesystems algorithms and the
    filesystem buffers, making it difficult to have data locks and backups. Plus the
    performance of the databases on a proprietary "commercial" OS of the same hardware
    platform


    When I started at my first full-time job after university, databases as we knew
    them were just starting. System R at IBM and the University of California, Berkeley,
    were research projects to determine the best way to access data from research
    grants, payment of the code were available at a nominal cost


