    # FOSSPICKS（开源精选）LINUX 之声


    # 电子书阅读器：Arianna


    我们有大量的图像和 PDF 查看器，但没有足够的阅读器。Calibre 是一个例外，是一个解决许多问题的电子书阅读器，但你需要它时它可能让你无从下手。Arianna
    是一个基于 Qt 为 KDE 桌面构建的小型、极简电子书阅读器，如果你有一小部分书籍想在有空时阅读，它是非常完美的。它不会移除 DRM，除了需要安装主题外，也不会将书籍发送到你的墨水设备，而这正是它的初衷。Arianna
    处于开发早期，不如 Calibre。项目网站：https://github.com/stable/arianna


    # 去中心化客户端：Sengi


    既然 Twitter 已经（稍微）放弃了所有事物的中心，现在是时候整合并关注 Mastodon 替代方案了。几个产品都在赶上趋势并受到了最近的关注，而 Sengi
    特别独特，因为它是一个尝试重现 Twitter 外观和功能的 Mastodon 客户端。TweetDeck 的列视图使其变得如此独特且强大，因为每一列都可以显示标签搜索、用户、列表或时间线的实时结果。这些列可以在自己的独立窗口中跟踪信息，就像股票经纪跟踪他们的投资一样。这就是
    Sengi 为 Mastodon 做的。TweetDeck 最初是 Twitter 的第三方客户端，最近已经放弃了桌面端或仅考虑浏览器订阅制。这使得 Sengi
    成为一个重要的项目，因为 Sengi 正在尝试将 TweetDeck 的独特体验带到 Fediverse，而且它已经可用。你可以添加一个或多个账户，为你的本地时间线、关注列表和搜索添加列；它充满了活力和许多可能。如果你更新数据并关注事件、列表、标签以及特定用户或实例，这是离开
    Twitter 的最佳方式。


    Sengi 还可以配合 Plom 使用，这是一个适配 Mastodon 并具有某些独特功能的小型活动流。


    基于 Electron 构建，它可能感觉有些消耗资源，而且你目前无法更改速度、调整字体或调整主题，但所有这些选项未来都有可能。目前，Sengi 是所有想要跳到
    Mastodon 并且感觉像 Twitter 替代品的人的最佳选择。


    项目网站：https://github.com/Nicolasconstant/sengi/

