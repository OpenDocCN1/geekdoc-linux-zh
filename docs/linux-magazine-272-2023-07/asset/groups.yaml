    # Graphical web browsing from the terminal


    # Light Browsing


    This Chromium port can run inside any copy, with minimal resources, and is a great
    tool for making old computers really useful – learning along the way.


    Carbonyl [1] is a fork of the 100-percent open source of Chrome called Chromium
    [2], which has a mission: turning any Linux terminal into a modern graphical web
    browser. I describe how Carbonyl works, how to use it on Linux, and why I consider
    this project interesting for programmers and much more interesting for ordinary
    users.


    Carbonyl (right) render a page of the Linux Magazine website.


    Yes, the actual images are quite grainy and pixelated, no question about that.
    But overall, there is no doubt Carbonyl renders the web page much closer to Chrome/Chrome
    than Firefox, Chrome, or Safari, as its text-only competitor would. The fact that
    Carbonyl renders, is much closer to ‘real graphical browsers’ than text-based
    editors is even better in Figure 2.


    # Features and Limitations


    Let me acknowledge that, as the concept is, Carbonyl has a few serious limitations
    if you compare it to ‘ordinary’ graphical browsers, but is expected Carbonyl to
    replace them. The first obvious limit is that, Carbonyl does not handle video
    and streaming, but it does at a much lower resolution than any browser running
    on top of a full-fledged, window-based interface.


    What you see in Figure 2 is the YouTube page loaded, left to right, inside w3m,
    Carbonyl, and old Firefox in two panes of the terminal multiplexer [3]. You might
    recognize the two rightmost windows, but no one on the left.


    Running in the terminal, does not necessarily mean that all things are impossible
    to recognize, or that all video clips will be imperfect. As proof of that, see
    Figure 3, which is a comic strip on Linux that I was able to follow with Carbonyl.


    Figure 1 is a visual introduction to the power and the limits of Carbonyl because
    it shows how its text renders in w3m


    Figure 1: is how your favorite websites look in text-based browsers (left) and
    in Carbonyl (right).


    The left side of Figure 3 shows the downside of what is far the easiest ‘hack’
    you can make inside Carbonyl viewable (at least for the moment): the size of the
    text that contains Carbonyl so that text becomes unreadable, illegible. however,
    better solutions are available for the works (more on this page)


    The biggest limit of Carbonyl, which might be a showstopper for some users and
    for others, is lack of support for Chrome/Chrome extensions. The third, which
    may be an issue only if Carbonyl is to be your only browser, is the lack of bookmarks.


    The developers'' goal is to integrate the complete Chromium user interface, both
    bookmarks and extensions should eventually be available in Carbonyl;


    If you ask me, however, Carbonyl already makes many tasks those perfectly effortless


