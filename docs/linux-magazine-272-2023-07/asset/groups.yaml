    # LXQt 1.3 Released with Bug Fixes


    LXQt is a fan-favorite desktop environment for systems with meager resources.
    Suitable for older systems it will run like an absolute charm on new hardware),
    LXQt is not just easy on hardware, but easy to use.


    With the latest release, version 1.3, the developers have replaced with Qt 5.15
    (although work is being done for initial Qt6 support) and have focused on adding
    new features.


    For example, the LXQt Panel now defaults to including the DOM plugin and a bug
    in the clock widget, as well as a bug discovered when switching between the dark
    and light themes. Additionally, the panel will correctly position the context
    menu when used with Wayland.


    The default file manager, PCManFM-Qt has fixed a bug preventing desktop items
    from "shaking" on changes. Also, the latest iteration of the file manager adds
    a title for Desktop to set window rules for anywhere collectors. You can also
    find that scrolling is now disabled in all view modes.


    There is now also support for proc-ng > 4.0 in the LXQt session tool for better
    detection of window managers and system trays.


    Although the new feature and bug list isn''t extensive, there were a lot of changes
    added across the entire desktop.


    Currently, LXQt is only available via source code. However, rolling releases (such
    as Arch Linux, Gentoo, and openSUSE Tumbleweed) pick up the latest version in
    their respective repos.


    You can read more about this new release in the LXQt announcement (https://lxqt-project.org/2022/04/15/release-lxqt-1.3-0).


    # 4MLux 42.0 Now Ready for Prime Time


    4MLux is a distribution with system features that can run on machines with as
    little as 128 MB of RAM, turning them into viable workstations or servers. 4MLux
    can be used as a rescue drive to recover data from a malfunctioning system.


    The stable version is 42.0 and includes software as LibreOffice 7.5.2, AbiWord
    3.0.5, GIMP 2.10.34, Firefox 111.0, Chromium 106.0.5249, Thunderbird-102.8.10,
    Audacity 3.4.2, Mesa 22.2.2, Wine 8.3, AlsaSpeaker, Bakeaway, Media Player, GMPlayer,
    mpblaster and VLC.


    You''ll also find updated tooling, including PHP (versions 5.6.0, 7.4.33, and
    8.17), Perl 5.36.0, Python (versions 2.7.18 and 3.10.8), and Ruby 3.1.3. On the
    server side, you''ll find Apache 2.4.56 and MariaDB 10.6.2. The kernel shipped
    with 4MLux is version 6.1.0. You can view the package list included with 4MLux
    (http://4mlux.com/packages-2.0.txt).


    4MLux isn''t just for reviving old hardware, because it also supports UEFI-enabled
    machines. With this distribution, you can create a desktop media-player, a productivity
    machine, and a mini server.


    Download an ISO of 4MLux (http://4mlux.com/index.php?page=download) now and bring
    new life to old hardware or use a new machine to create a lightning-fast desktop.


    # COVER STORY


    # Open Data


    # Prying the lid off government data


    # # Open Up


    The open data movement extends the ideals of open source to government data and,
    ultimately, to all the world''s knowledge.


    By Joe Casad


    For long as governments have kept records, citizens have debated over access to
    those records. When the ancient Mesopotamian recorded data on clay tablets, they
    have no doubt that lively discussions erupted over who should or should not see
    those tables. Information, all, is power, and data is the first step on the path
    of insight.


    But data has a way of becoming more powerful with more eyes looking at it. Enlightened
    government eventually came to share the whole, giving access to viewers who might
    find insights. The rise of democratic governments, where the people (at least
    in theory) set the rules, and the concept of press freedom fostered the need for
    access to public data, national university libraries, public libraries, and other
    data acquired through government funding.


    Then came the information age, and the value of data, as well as the tools for
    accessing, became so vast and complicated. Back when data was primarily stored
    and communicated through paper (or clay tablets), the "format" was the term we
    used to mean such critical. When government data came to be stored electronically,
    became a point of conflict, and we are still trying to work out what that means
    and what to do about it.


    Governments and research institutions funded by governments were users of computers.
    In early days, development teams tended to work independently - without a long
    term to prepare for data. Many government agencies didn''t have the staff or budget
    to do their own programming and instead, outsourced it to contractors. The contractors
    were aware the power of their position, and some became adept at positioning themselves
    as gatekeepers to the data. The government would conduct a study, and the contractor
    or grant recipient would provide a final report. But by the status of the data


    was often ill-defined. In theory, it was government data, but the knowledge and
    tools for how to access it belonged to the contractor, and the only way to gain
    additional insights and value from the data was to pay the contractor for another
    study.


    It took several years for elected officials to understand it. If you use of source
    code as "data" describing how a program works, the Free Software movement was
    an early effort at addressing this and many governments embraced software development.
    And, the ideals of Free Software and Open Source had a strong influence on recent
    open data initiatives.


    When the smoke cleared from the first computer revolution, people began to see
    that public interest was well served by throwing government money that was stored
    in formats. In 2003, the European Union adopted the Directive on the Re-Use of
    Public Information, which came to be known as the PSI Directive. The PSI Directive
    established a legal framework for communicating reuse, stating that public information
    should be "open by design and by default." The PSI Directive has been amended,
    most recently in 2019, and


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_11_0.png)


    Figure 1: The Open Knowledge Foundation was an early advocate for open data and
    creator of the Open Definition.

