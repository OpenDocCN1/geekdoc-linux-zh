    上运行四个 MXIS519 传感器，并处理 I2C 总线。通过水平排列的图像带可以实现图像、缩放和合并效果。与透镜间距对齐的编码带上的独立空间图像是离焦打印的，以便透镜背面的箔或镜子使用。


    你可以通过相互合并单个图像来实现空间视觉效果，从而导致观众图像分离。我们不需要限制在两幅图像上；可以使用一系列图像拍摄静态场景，或者逐步移动相机。或者，你可以使用多镜头技术，这是捕捉动态场景的方法。立体
    Maker [4] 用于准备图像序列。如果你想更仔细地观察波动图，查看 3DMasterKit [5] 软件是一个好主意。

