    ## Xubuntu 23.04 和 Fedora Workstation 38


    一张双面 DVD 上的两个精彩发行版！


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_5_0.png)


    Xubuntu 23.04，代号为 Lunar Lobster，是 Ubuntu 变体的最新版本，使用 Xfce 4.18 作为默认桌面。它将一直支持到 2024
    年 1 月。与所有 Ubuntu 版本一样，此版本非常适合青于轻量级桌面且不追求极致功能的用户。


    Fedora Workstation 是面向通用桌面用户的 Fedora 发布版。它是许多功能的首次亮相，这些功能最终将引入 Rocky Linux、AlmaLinux
    和 Red Hat Enterprise Linux (RHEL) 等发行版。


    传统上，Xubuntu 的短期版本不包含重大改进，Lunar Lobster 也不例外。但它仍然有一些值得关注的创新。首先，它是第一个使用 PipeWire
    和 WirePlumber 的 Ubuntu 版本，它们提供了改进的音频和性能。默认终端字体现在为 10 点，从九点增加，但对于易读性来说这是一个明显的提升。


    新功能包括重新设计的辅助功能设置；更清晰的设备配对语言；通过二维码进行连接的能力。对第三方软件包仓库的管理也得到了改进。其他更改包括使用 Gnome 44，包括文件选择器中的图标视图和预览，以及快速设置中的蓝牙支持。这些更改的总体趋势是趋向图像化设计，正如过去十年以来一样。结果是一个组织良好的用户体验，既没有牺牲功能，又适用于所有水平的用户。


    随着 Xfce 4.18 的推出，还有其他微调。一如往常，许多微调现在位于 Thunar 文件管理器中，还包括图像预览、可编辑工具栏、选中文件的自定义高亮，以及针对更多操作的撤销/重做支持。整个桌面包含了许多小调整，并改进了对
    Wayland 的支持。


    缺陷将被替换。请发送邮件至 subs@linux-magazine.com。尽管本 Linux 杂志经过了测试，据我们所知，不含恶意软件和缺陷，但 Linux
    杂志对使用本杂志相关的任何数据和计算机系统的中断、丢失或损坏不承担责任。


