    # 自定义 Slackware 仓库


    终于，你不再需要担心 `/etc/slackpkg/rors` 中的任何官方 Slack 镜像源了。该仓库可用于安装你需要的任何包：


    - slackpkg-gpp-update

    - slackpkg-update

    - slackpkg-physs gcc ghc lua fpc-headers


    请记住，`slackpkg` 不进行依赖跟踪；当你执行常规 Slackware 更新时，自定义仓库中安装的任何包都会被 `slackpkg` 提取：


    - slackpkg-update

    - slackpkg-upgrade-all


    ## 自定义包


    在某些时刻，你可能需要构建一个自定义包。如果你发现它没有包含在 SlackBuild 数据库中，最好的方法是创建自己的 SlackBuild 脚本并将其提交到
    SlackBuilds。这样社区以及你都可以从高可用服务器获取该构建脚本。


    如果你需要使用一组特定的配置选项来构建包，


    （此处为图片）


    那么现在由你决定了。Slackrepo 默认使用 Git 同步存储在 `/var/lib/slackrepo/slackBuilds` 中的所有 SlackBuilds。官方的
    SlackBuilds.org。如果你需要使用非官方的 SlackBuilds 或官方 SlackBuilds 的修改版，slackrepo 的原始维护者建议你获取
    Git 分支而不是官方分支。


    然后，根据 [11] 定期用自己的分支更新官方的 SlackBuilds。请记住，slackrepo 也会跟踪你在 `slackpkg` 文件中想要跟踪的依赖。


    Slackrepo 用于执行系统请求的某些操作。例如，如果一个包请求运行一个守护进程，它将创建钩子（hooks），钩子存储在 /etc/slackrepo/sx86/
    下的专用文件夹中（如果你想链接它们）。建议编辑 `slackrepo.hints` 文件，这将允许你在所有升级过程中编辑权限。


    ## 结论


    如果你能搭建一套设备，创建一个 Slackware 仓库是非常简单的。如果你只是一个管理员，那么 Slackware 本地机器仓库并不值得花精力。然而，如果你拥有一大批计算机，你自己的仓库将节省你大量的时间和麻烦。


    请记住，这里有很多 Slackware 包的仓库，其中一些拥有良好的信誉。Eric Hamilton 维护着 slackrepo 仓库 [13]，其中包含了所有可用的
    SlackBuilds。Nikola 使用构建好的 slackrepo 对官方 SlackBuilds 进行更新。


    如果你从 SlackBuilds.org 构建包，请不要以任何方式分发它们——这些建议针对 SlackBuilds 项目。这意味着如果你想与第三方共享你的包，需要从名称中移除
    `5bg` 标签。[1]


    ## 信息


    - [1] Slackware 仓库: http://slackware.com

    - [2] 发现: https://pppkg.kde/discover/

    - [3] Slackware 文档中的 slackpkg: http://docs.slackware.com/slackware/slackpkg

    - [4] SlackBuilds.org: https://slackbuilds.org/

    - [5] slackrepo: https://slackrepo.org/

    - [6] slacktools: https://github.com/slacktools/

    - [7] 来自 NetBSD 的 pkgsrc: https://www.netbsd.org/pkgsrc/introduction.html#platforms

    - [8] 原 SlackBuilds 首页: https://github.com/slack/slackrepo/index.html

    - [9] Andrew Clements 的 slackrepo 分叉: https://github.com/aclemons/slackbuilds/

    - [10] Hedgesvars: https://www.hedges.org/

    - [11] David Spencer 在 SlackBuilds 上: https://slackware.com/questions/slackware-14-slackware-and-custom-builds-41759267/post562588

    - [12] 无限文档: https://github.com/slackrepo/slackrepo.hints

    - [13] Eric Hamilton 的仓库: http://www.slackware.com/alien-slackbuilds/

    - [14] Slackonly 仓库: https://slackonly.com/


