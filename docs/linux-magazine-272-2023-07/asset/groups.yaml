    它现在被称为《开放数据指令》[2]。公共部门信息（PSI）指令和开放数据指令的立场是：无论是否存在关于何时以及以及如何重用数据的预定义计划，都应保持数据处于可用状态。


    在英国，开放知识基金会（OKF）[3]于2004年成立，旨在为支持开放知识提供服务、培训和社区活动（图1）。凭借其悠久的活动历史，提高人们意识花费了一些时间。2007年，30位愿景者在加利福尼亚州的塞巴斯托波尔（Sebastopol）聚会参加会议，这次会议促成了“开放政府数据倡议”的诞生。小组中的许多人熟悉FOSS（自由和开源软件）原则，包括O''Reilly
    Media的创始人蒂姆·奥雷利（Tim O''Reilly），以及知识产权组织创始人斯坦福法学院教授罗伦斯·西尔菲尔德（Lawrence Silkfield）。成员之一是艾隆·施格尔（Aaron
    Schlegel），他是一位FOSS和数据活动家，也是RSS的创造者。塞巴斯托尔小组定义了数据“开放”的八项原则：


    - 完整性（complete）——所有不受隐私、安全或特权限制的公共数据可用，没有可能限制其可用性或模糊其含义的缺失部分。

    - 数据以在源头采集的形式保存，而不是聚合或处理成修改后的形式。

    - 及时性（timely）——尽快提供数据，以保留其潜在价值。

    - 可访问性（accessible）——数据可以在互联网上获取，并以允许最广泛用途的格式存储。

    - 可处理性（processable）——数据应该是“合理结构化的”，以允许自动化处理。

    - 非歧视性（non-discriminatory）——任何人都可以访问数据，无需注册要求。

    - 机器可读性（machine readable）——数据应以任何实体均无独占控制权的格式存储。


    OKF的开放定义和开放政府的八项原则对于建立未来的清晰愿景至关重要。2009年，巴拉克·奥马签署了一项行政命令，要求政府数据集具有机器可读性[6]。奥马政府期间发起的倡议之一是开放数据[7]，这是一个用于促进开放数据的工具和资源集合。随着2019年《美国政府数据法案》的通过，开放项目被在线资源data.gov（图2）取代。目前，美国政府已在data.gov网站发布了超过255000个数据集[8]。跨党支持。《开放政府数据法案》有四位发起人——两名共和党人和两名民主人。


