    Qt 框架的桌面应用程序。它最近还获得了 GitHub 加速计划的奖，该计划为每个项目提供 20,000 美元和 12 周的指导，项目目标是为他们的工作构建耐用的结构。Seamly2D
    被视为用于工程文档的参数化 CAD，这听起来很复杂，但那些工程元素需要无限拟合。它的学习曲线接近 FreeCAD 而不是 Figma，但它是由不同操作的技能和功能调板制成的。设计师想要花费时间的草图模式（Draft
    mode）是调板中图标最多的模式，工具范围包括创建固定变量长度的点和线，以及使用相似形状来简化和复制已创建的组。右侧还有一个编辑器，用于查看和设置图案的精确值，以及不同图层和颜色的图例。它深层的功能可以帮助你拟合并提供及时的结果。有一个活跃的社区会提供良好的帮助，并有各种入门教程![](img/4dce49e5b3f3b719f67be60db9a2a5ec_83_1.png)


    - 1. 草图 (Draft)、裁片 (Piece)、布局 (Layout)：每个图案都由独立的区块构建，排列成裁片并在布局中导出。

    - 2. 测量 (Measurements)：所有按参数缩放的精确测量。

    - 3. 设计 (Design)：在许多方面，Seamly2D 可用于设计。

    - 4. 属性 (Properties)：设置值和属性。

    - 5. 布局 (Layout)：查看你的设计在页面上的样子。

    - 6. 编辑 (Editing)：某些设计是从它们之间的点和线构建的。

    - 7. 主视图 (Main view)：从独立区块创建设计。


