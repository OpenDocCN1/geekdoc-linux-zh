    - accessible – data is available on the Internet and stored in a format that permits
    the widest possible range of uses.

    - processable – data should be “reasonably structured” to allow automated processing.

    - non-discriminatory – anyone can access the data, with no requirement for registration.

    - machine readable – data should be stored in a format over which no entity has
