    # Open Data


    # Prying the lid off government data


    # # Open Up


    The open data movement extends the ideals of open source to government data and,
    ultimately, to all the world''s knowledge.


    By Joe Casad


    For long as governments have kept records, citizens have debated over access to
    those records. When the ancient Mesopotami recorded data on clay tablets, they
    have no doubt that lively discussions erupted over who should or should not see
    those tables. Information, all, is power, and data is the first step on the path
    of insight.


    But data has a way of becoming more powerful with more eyes looking at it. Enlightened
    government eventually came to share the whole, giving access to viewers who might
    find insights. The rise of democratic governments, where the people (at least
    in theory) set the rules, and the concept of press freedom fostered the need for
    access to public data, national university libraries, public libraries, and other
    data acquired through government funding.


    Then came the information age, and the value of data, as well as the tools for
    accessing, became so vast and complicated. Back when data was primarily stored
    and communicated through paper (or clay tablets), the "format" was the term we
    used to mean such little critical. When government data came to be stored electronically,
    became a point of conflict, and we are still trying to work out what that means
    and what to do about it.


    Governments and research institutions funded by governments were users of computers.
    In early days, development teams tended to work independently - without a long
    term view to prepare for data future. Many government agencies didn''t have the
    staff or budget to do their own programming and instead, out-sourced it to contractors.
    The contractors were aware the power of their position, and some became adept
    at positioning themselves as gatekeepers to the data. The government would conduct
    a study, and the contractor or grant recipient would provide a final report. But
    by the status of the data


    that was often ill-defined. In theory, it was government data, but the knowledge
    and tools for how to access it belonged to the contractor, and the only way to
    gain additional insights and value from the data was to pay the contractor for
    another study.


