    year, Brazilian-born Linux distribution, created by Anderson Marquez, focuses
    on having an operating system ready to use from the moment of installation.

    With Br OS, users will enjoy image-video-editing tools, security tools, trace
    hiding and data for publishing content even in countries with authoritarian governments.

    However, it''s integration that might garner the attention of a lot of Linux users.
