    which offer improved sound and performance. The default terminal font is now 10
    points, up from nine, a but noticeable gain for easy reading.


    New features include redesigned and accessibility settings; clearer language for
    device pairing; the ability to connect via QR Codes. Management of third-party
    package repositories is also improved. Other changes include the use of GNome
    44, including icon views and previews in the file chooser and Bluetooth support
    in the Quick Settings. The general tendency of these changes is to a more pictorial
    design, as it has been for over a decade. The result is a well-organized user
    experience that does not sacrifice functionality and is accessible to all levels
    of users.


