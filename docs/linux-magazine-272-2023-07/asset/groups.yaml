    # 结识开放数据研究所的 Lisa Allen


    ## 解锁优势


    开放数据研究所（ODI）的 Lisa Allen 解释了为什么数据很重要，以及更广泛的应用需要什么。作者：Joe Casad


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_23_0.png)


    万维网之父蒂姆·伯纳斯-李（Tim Berners-Lee）创立了开放数据研究所（ODI），旨在帮助促进自由的互联网。我们邀请了 ODI 数据与服务总监 Lisa
    Allen，与我们谈谈她的使命和未来的道路。


    **Linux Magazine (LM)** 如果我们从简单的历史说起如何？什么是开放数据研究所？它是如何起步的为什么要这么做？


    **Lisa Allen (LA)** 开放数据研究所是一家成立于 2012 年的非营利公司（我们去年庆祝了 10 周年！），由蒂姆·伯纳斯-李爵士和尼杰·沙博特爵士（Sir
    Nigel Shabolt）创立。我们作为一个机构和服务提供者运营，与企业、政府和公民社会合作，创造一个数据为所有人服务的世界。


    **LA:** 我们相信透明度可以捍卫开放数据的价值，并倡导其创新性用途，以带来积极变化。在早期，我们认为社会、经济和环境的改变将来自全球议程中数据的大规模采纳和开放。我们建立了一个由
    ODI 领导的工作组，现在仅在英国就有超过 600 万用户。我们还很早地就指导公司创建了近 1000 个数据集，并创造了 1 亿英镑（约 1.25 亿美元）的收入。我们的工作横跨数据领域，帮助机构在这一光谱上共享数据。


    **LM:** 你们的使命非常多元。一方面，你们拥有开放数据工具；另一方面，你们扮演着优势性角色。在定义什么是数据以及为负责任的数据共享制定指南方面，你们扮演了哪些角色？这一切是如何结合在一起的？你会如何描述优先事项？你们机构大部分时间花在哪里？


    **LA:** 我们的愿景是创建一个数据为所有人服务的世界，并旨在通过与企业、政府和公民社会的合作，构建一个开放、可信的数据生态系统来实现这一目标。对我们来说，数据是国家基础设施的关键部分，就像我们所有人依赖的电力网络一样。改进机构的数据处理流程很重要，这样它们就可以构建和提供包括培训、专家咨询和研究在内的各种服务，使机构具备产生社会经济价值的能力。我们确实开发了产品和服务，运行会员计划，并帮助建立对公共政策决策的理解。我们提供广泛的服务。


    **LM:** “开放数据”变得抽象了。我们有推荐的特定格式或框架吗？你能指出大多数用户最想使用的特定服务吗？


    **LA:** 我们将开放数据定义为任何人都可以访问和使用的数据，而不是特定的格式或框架。我们信赖蒂姆·伯纳斯-李爵士的 5 链接数据（Linked Data）系统，即该数据在网络上可用、机器可读、采用非专有格式、使用开放标准以及此类系统。这是我们为了解锁数据价值而必须经历的历程。许可是通过制定和使用诸如知识共享（Creative
    Commons）等开放许可来转变透明度、实例，英国政府许可（Government License）的开放对公共数据的可用性和可用性产生了巨大影响。


    **LM:** 我们的开发者和 Linux 高级用户读者会对此特别感兴趣。我们将告诉你更多关于“业务数据工具包”和“公共服务工具包”，以及你更喜欢使用的其他工具。


    **LA:** 我们制作了许多免费工具和指南，帮助人们管理、使用和发布数据。“业务数据工具包”和“公共服务工具包”有很多共同点——最终，它们旨在帮助人们克服有效使用数据的障碍，并汇总一系列工具以帮助不同的环境。它们共同的两个元素是“画布”（Canvas）和“数据生态系统映射”（Data
    Ecosystem Mapping），这也是我们非常自豪的。我们最近了解到，联合国开发计划和德国国际合作机构（GIZ）可以将这两者整合到一个工具中，该工具加入了微软、OCHA（联合国人道主义事务协调厅）和
    Arup 团队，并与英国及全球的政府部门、学术机构和卫生部门一起使用它们。


    这些可以影响对数据之目的且将满足用户需求的信心。良好的、可信的数据非常重要，开放数据是数据基础设施的最佳基础，确保了透明度、问责和理解。


    **LM:** 随时代演进似乎是 ODI DNA 的一部分。最近，你一直在提高人们对开放数据人工智能的意识。AI 与开放数据有什么关系？你们在这一领域的目标是什么？


    **LM:** 你认为开放数据采纳的最大障碍是什么？现在什么在阻碍它？


    **LA:** 很难忽视我们收到的所有生成式 AI 以及随之而来的头条新闻。但它们的一个共同点是，它们都依赖于海量数据。技术不断演进，但取决于喂给你的数据。


    共享数据（尤其是开放数据）的风险之一是高风险。我们认为这是因为人们不理解其数据中存在的风险以及与共享相关的风险，更重要的是，不知道如何减轻这些风险。我们针对这个问题工作，开发了一个工具来帮助人们理解这些问题和风险。我们确定了评估共享数据的关键领域：监管、伦理、声誉和商业风险。通常缺失的最重要点是如何理解数据、风险，以及最重要的是开放数据可以解锁的收益。


    这就是为什么构建和信任数据生态系统如此重要。我们需要对数据源、其中包含的偏见有开放性和理解，影响可能是负面的也可能是正面的。我们需要更好的数据技能和知识，帮助人们理解
    AI 处的状态以及如何处理这些数据。


    **LM:** 如果开放数据被大规模采纳，有哪些具体的例子会变得更容易？


    在没有保障的情况下，精心策划的数据至关重要。我们将保障定义为一种过程或一组方法，以确保数据将满足我们的需求，并确保收集、访问、使用和共享数据的是可靠的。数据保障涉及多个因素，包括质量、供应和伦理。在考虑伦理时，用户需要确保数据被正确收集、使用和共享。所有这些因素都会影响对数据之目的且满足用户需求的信心。


    **LA:** 开放数据在银行和运输领域的影响无疑造福了数百万人。我们与开放数据（OA）及其社区的合作产生了重大影响，让人们通过开放数据获得以前被锁的机会。这些创新的益处远超预期。环境署的开放
    LiDAR 数据在挑战和学习如何解锁开放数据优势方面产生了意想不到的益处。这是通过开放性实现的，即其他创造和创新的数据使用方式；效率，即开放数据消除障碍并释放价值；以及通过创造透明度带来的所有价值。这些都是开放数据的益处——所以释放越多，解锁的就越多。


