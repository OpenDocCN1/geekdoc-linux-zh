    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_0.png)


    #271/June 2023


    # Smart Home


    Smart home solutions will save you time and energy – and, did I mention, you can
    amaze your friends. This month we show you how to take charge of your home environment
    with smart devices and open source automation software.


    **On the DVD:** SystemRescue 10.0 and Linux Lite 6.0


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_1.png)


    #270/May 2023


    # Green Coding


    A sustainable world will need more sustainable programming. This month we tell
    you about some FOSS initiatives dedicated to energy efficiency, and we take a
    look at some green coding techniques in Go.


    **On the DVD:** Fedora 37 Workstation and TUXEDO OS 2


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_2.png)


    #269/April 2023


    # The Fediverse


    Social media connect the world, bringing in the latest news and commentary from
    politicians, movie stars, community leaders, and remote friends. But the tracking
    and data mining of the commercial social media platforms has many users searching
    for a better option. This month we dive into the alternative universe for social
    media: the Fediverse.


    **On the DVD:** EndeavourOS Cassini 22.12 and Debian 11.6 “bullseye”


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_3.png)


    #268/March 2023


    # Data Poisoning


    Think computers don''t make mistakes? If you slip some doctored-training samples
    into the mix, you can get a fancy machine-learning system to think a dog is a
    cat or it is an 8 – and you can trigger this bad behavior through a hidden signal
    no one will ever notice.


    **On the DVD:** MX Linux 21.3 and Puppy Linux FossaPup 9


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_4.png)


    #267/February 2023


    # Backup


    In theory, everyone could use the backup tool, but the best way to regular and
    systematic backups into your life is to find a solution that fits with your habits
    and methods. This month, we preview popular backup apps in the Linux space so
    you can find one that works for you.


    **On the DVD:** Linux Mint 21 Cinnamon and Kali Linux 2022.4


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_94_5.png)


    #266/January 2023


    # Generative Adversarial Networks


    What is the secret behind the recent explosion of computer art and fake videos?
    One neural network leads to another neural network...


    **On the DVD:** Ubuntu 22.10 and AlmaLinux 9.0'
