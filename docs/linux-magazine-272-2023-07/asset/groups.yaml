    # IN-DEPTH

    Programming Snapshot – Remote Backup


    ## Control your backup NAS from the desktop


    # Magic

    Cargo


    To be able to power up and shut down his NAS and check the current status without
    getting out of his chair, Mike Schilli programs a graphical interface that sends
    a Magic Packet in this month''s column. By Mike Schilli


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_51_0.png)


    As a backup I use a Synology with some hefty hard drives. But because of the strict
    regulations by paranoia and noise-protection protocols in the hollows of Peoples
    Studios, I develop only when actually needed (i.e., a backup is running). To switch
    it on needed, I prefer to mouse around a GUI and occasionally instead of getting
    out of my chair.


    ## Switch It On


    How does this work? When switched off, the NAS actively waits for a Wake-on-LAN
    (WoL) signal. It detects its control network is running in low power mode. If
    a broadcast packet arrives on the LAN, the device''s power supply or motherboard
    to switch on.


    The Synology desktop application presented here (Figure 1) powers up the NAS via
    the local network at a touch of button and displays the milestones of the boot
    process with progress bars. As soon as the system has finished booting and is
    ready for access, it notifies the user.


    The Magic Packet contains the target system MAC address, that a controlling transmitter
    can notify different network nodes independently.


    Author: Mike Schilli works as a software engineer in the San Francisco Bay Area,
    California. Each month in his column, which has been running since 1997, he researches
    practical applications of various programming languages. If he emails him at mschilli@perlitemeister.com
    he will answer any questions.


    After the work is done, a mouse click on the GUI''s button is all it demands,
    and the NAS receives the operational or if it is no longer responding to ping
    and has finally gone to sleep (Figure 2).


    Figure 3 shows a practical example of the Magic Packet''s format [1]. The first
    6 bytes of the packet header each contain a fixed value, XXFF. This is followed
    by


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_51_1.png)


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_51_2.png)


    Figure 1: Control via desktop app: Mike Synology booting.


    Figure 2: At the push of a button, the network drives shuts down again.


    # Programming Snapshot – Remote Backup


    ```

    5 /magic header_c

    00000000 ef ff ff ff 00 11 32 6c ab cd 32 6c 00 32

    0000010 32 6c ab cd 00 11 32 6c ab cd 32 6c 00 32

    0000020 32 6c ab cd 00 11 32 6c ab cd 32 6c 00 32

    0000030 32 6c ab cd 00 11 32 6c ab cd 32 6c 00 32

    0000040 32 6c ab cd 00 11 32 6c ab cd 32 6c 00 32

    0000050 32 6c ab cd 00 11 32 6c ab cd 32 6c 00 32

    0000060 32 6c ab cd 00 11 32 6c

    ```


    Figure 3: A MagicPacket''s hexdump for the MAC address: 00:11:32:6c:ab:cd its
    length 6 bytes is. In cases, there can be devices with longer MAC addresses, but
    their Magic Packets are more difficult to build. For the purpose of illustration,
    I''ll keep short and simple. The MagicPacket structure in line 9 lists the packet''s
    two areas: header and payload. The MagicPacket() function starting in line 13
    prepares the payload with 6 bytes of 255, and then the MAC address so that all
    devices on the local network can see the packet and react accordingly. If a device
    receives a packet that matches its MAC address, it initiates the boot process
    by the payload, which consists of 16 repetitions of the 6-byte MAC address of
    target device (00:11:32:6c:ab:cd) in this example. Each packet has its own header,
    which begins its signature, and individual identifier. Listing 1 cobbles the MagicPacket
    in Go. Line 7 sets the NAS''s MAC address as a string, while line 8 specifies


    ```go

    01 package main

    02 import (

    03 "bytes"

    04 "encoding/binary"

    05 "net"

    06 )

    07 sync_packet = "00:11:32:6c:ab:cd"

    08 const MacLen = 6

    09 type MagicPacket struct {

    10 header []byte

    11 payload [16]byte

    12 }

    13 func sendMagicPacket() {

    14 var packet MagicPacket

    15 hwaddr, err := net.ParseMAC(sync_packet)

    16 if err != nil {

    17 panic(err)

    18 }

    19 for idx := range packet.header {

    20 packet.header[idx] = 0xFF

    21 }

    22 for idx := range packet.payload {

    23 for i := 0; i < MacLen; i++ {

    24 packet.payload[i] = hwaddr[i]

    25 }

    26 }

    27 buf := new(bytes.Buffer)

    28 if err := binary.Write(buf, binary.BigEndian, packet); err != nil {

    29 panic(err)

    30 }

    31 conn, err := net.Dial("udp", "255.255.255.255")

    32 if err != nil {

    33 panic(err)

    34 }

    35 defer conn.Close()

    36 err = conn.Write(buf.Bytes())

    37 if err != nil {

    38 panic(err)

    39 }

    40 }

    ```


    The ParseMAC() function from the standard net library receives the MAC string
    from line 7 into a binary address, which the library''s functions need in order
    to send the packet. The header with 6 bytes of prefix and the for loop starting
    in line 19 then writes the MAC address in succession to the packet''s payload.
    To construct the structure of a MagicPacket to create a string of bytes for packet
    listening on the network, the Write() function in line 28 draws the structure
    of the packet''s value. To do this, it writes the structure in network format
    (big-endian, most significant byte) to the buf buffer. Then it uses Write() to
    send it via the UDP object created in line 32 to the LAN''s broadcast address.
    Be careful, Write() can serialize a string without error if any of its fields
    are of a length that the function does not support Go''s slice arrays. You will
    see some runtime errors if you proceed without heeding this the states at runtime
    are those of a simple finite machine. After starting the program, the NAS is asleep
    (state DOWN). The user uses the wake-up sending new commands to the machine using
    methods such as Event() to initiate the associated state transitions. The third
    party library used for the library from Github uses strings instead of types for
    its states. This is not recommended as a simple type in a state could be enough
    to trigger a frantic search for errors. This way, the type checker in the Go compiler
    will help detect bugs at compile time. The library still has room for improvement,
    but you can''t lift a ghost in the mouth.


    ## On Screen!


    Listing 3 has all the code to draw the simple GUI shown in the screenshots. It
    is based on the F framework, which the code pulls from Github at compile time.


    Figure 4: The states and transitions of the simple machine.


    By pressing the Up button, the application keeps checking if the NAS can be pinged.
    If it shows no, it is probably still idle (i.e., resting down). But as soon as
    the ping command reports, the NAS is ready for operation and the machine jumps
    to the UP. Figure 4 shows the state machine graph, while using the Go fsm library
    from Github. The New() function creates a new state machine starting with two
    states: wake (1), which transitions from the DOWN state to the UP, and sleep (2),
    which switches the machine from UP to DOWN. Listing 2 defines the conditions for
    transitions in the machine and enter/post callbacks; the machine jumps to each
    of these actually starting. Each of these two callbacks extracts a hurdle that
    the program flow needs to clear before entering the new state. For infinite loops
    running ping() to check whether the desired state has been reached, the NAS is
    either awake or asleep, depending on the callback. If not, the callbacks will
    wait and then try again. This is repeated until the state is reached. Then the
    callback is called with the new state of the machine by the caller. The caller''s
    final act is to return a reference for the ready-to-go machine. With this tool
    at its disposal, the caller will be


