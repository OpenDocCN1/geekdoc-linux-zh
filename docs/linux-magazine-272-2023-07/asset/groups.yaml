    # Linux 一站式解决方案


    # 成长


    Linux 用户现在可以体验 Windows 和 macOS 用户几十年来一直享有的：硬件、软件和服务的整合。我们查看了这六种 Linux 一站式解决方案。作者：Bryce
    Byfield。


    根据传统定义，发行版是软件。越来越多的公司正将发行版作为包含硬件、支持和服务的包的一部分提供——这是商业术语中被称为垂直整合的一种一站式解决方案。这些解决方案提供的服务可能是昂贵的。


    一站式解决方案的优势是显而易见的。供应商可以提供为其硬件和客户忠诚度定制的软件。对于买家来说，一站式解决方案提供了便利和易于购买，即使是在配置 Linux
    电脑最近已成为标准的购买前搜索中。Ubuntu 是近期蓬勃发展的一种一站式解决方案。2013 年，KDE 未能推出带有其独特桌面环境变体的 Spark（等离子体）。Ubuntu
    发布了自己版本的桌面系统，但在 2017 年停止了支持。这些失败的原因已经过彻底分析，包括在硬件方面缺乏商业经验，以及商业 Linux 市场相对较小。


    无论原因何，一站式解决方案最近才获得认可。许多是 Ubuntu 长期支持（LTS）发布版本的衍生版本，在桌面上进行了微调。效仿大型商业厂商的 Linux 产品，有一些一站式解决方案为每个用户提供详细的选项。它们通常通过微型管理工具来区分，这些工具是为桌面硬件设计的，并不适用于所有发行版。像
    Debian 一样，自由软件 BIOS 和 UEFI 替代品（或计划在不久后这样做）提供频繁的远程更新。发行版仍然是至关重要的，当然，一站式的差异在于……


    作者


    Bryce Byfield 是一位计算机记者，也是一位专精自由和开源软件的自由作家和编辑。除了他的写作项目外，他还教授电子学习课程。他谈论关于西海岸的一切事物（https://bycebyword.com）。他还是
    Freedom Pieces 的联合创始人，这是一本关于写作和幻想的博客（https://freedompieces.com/）。


