    # NEWS Linux News


    Although Linux kernel 6.3 has to make it into the standard repositories, you can
    download it from kernel.org (https://kernel.org/) and compile it yourself. Eventually,
    it will arrive in your distributions, and it''s generally better to wait.


    For more information on the new kernel, check out part 1 (https://lwn.net/Articles/23846/)
    and part 2 (https://lwn.net/Articles/92384/) of the merge window.


    # ## Arch-Based blendOS Features Cool Trick


    Imagine being able to install apps from Arch, Fedora, Ubuntu, Android, and even
    the web onto a single distribution. That''s blendOS (https://blendos.co/).


    Created by the same maintainer as Ubuntu Unity, blendOS allows you to use the
    native Arch package manager (pacman), as DNF (from Fedora) and Apt (from Ubuntu).
    Both DNF and Apt are made available as containers way of the Podman runtime engine
    (with a bit of help from Distrobox and NVIDIA driver).


    Even though blendOS is based on Arch, the developers have made it to use any app
    from a supported distro. On top of that, you can choose between Gnome or KDE Plasma
    desktop.


    When installing applications using the containerized versions of DNF or Apt, those
    will be available from the base OS (so you don''t have to run them from the command
    line as typical Podman containers).


    blend is also a rolling and immutable operating system that allows you to use
    system packages as you normally would, while still being able to roll back to
    an instant snapshot.


    You can also use the blendOS build scripts (https://github.com/blendos/ ) to create
    and submit your own blendOS remix with the desktop environment of your choice.


    You can read more about the new release of blendOS here (https://blendos.co/ )


    # ## Fedora 38 Released with New Features


    The developers of Fedora have given us yet another stellar release, by number
    38. It''s a surprise, the team rarely delivers early but it''s certainly an early
    gift from a dedicated team.


    Fedora 38 stars Gnome 44 and Linux kernel 6.2. The Version of Gnome used in Fedora
    is straight-up, so there are zero changes made by the Fedora team.


    Some of the new features found in Gnome 44 include folders in the File manager
    as well as the icon/thumbnail mode for the file picker.


    You''ll also find flatpak apps in the Software application, which means you''ll
    find even more flatpak available for installation through third-party repositories.


    With the release of Fedora 38, the team has made significant changes to the website
    (https://fedoraproject.org/) and has included a few new spins, including one for
    Budget, Sway, and for mobile devices called Posh.


    You can read more about the latest release from the official blog (https://Fedora-magazine.org/announcing-fedora-38)
    and download an ISO from the page (https://fedoraproject.org/workstation/download).


    Get the latest news in your inbox every week Subscribe FREE to Linux Update bit.ly/Linux-Update


