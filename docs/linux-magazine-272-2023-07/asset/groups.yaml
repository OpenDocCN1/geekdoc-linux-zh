    ## The Data Dilemma


    Openness, data transparency, and portability are very lauded goals, and we can
    only welcome attempt to allow users access and control over their data. Still,
    adding data extensions to proprietary platforms like Facebook and Twitter is far
    from implementing a fully open source, decentralized social networking platform
    like Diaspora or Mastodon. The Data Transfer Project is an important step in breaking
    the spell of Big Tech, but not one that declare victory.


