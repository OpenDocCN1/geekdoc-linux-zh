    ## Creating custom ISO images

    DIY Imager


    If you are looking to customize your Linux distribution, we show you three graphical
    front ends for creating bootable ISO images. By Erik Bärwald


    Specialized Linux distributions exist for virtually any imaginable case. However,
    much daily use, these distributions often come with superfluous applications.
    These apps consume disk space – and if they happen to run in the background –
    CPU usage spikes. Some allow a lean basic system without additional software,
    which you can customize with the projects they actually need. This article looks
    at front ends that give you a DIY Linux imager quickly without too much overhead.


    To use computers later, you need the ability to create ISO images of the system
    by deploying a handy tool, one that is easy to use and not for Linux gurus.


    Depending on whether you want to create a custom Linux derivative to boot from
    optical media or a removable USB, you may need different tools to generate the
    ISO image. If possible, choose a tool that can generate hybrid images (i.e., one
    can boot from a separate repository as needed).


    ## Approach


    There are two approaches to generating a custom image. The first approach involves
    working with a live system. When you first run the desired distribution and remove
    all unwanted applications. To this system, then you add all the applications you
    need for your daily use. Then, use a tool for generating ISO images from the running
    system, creating an image into which you bundle the running system, including
    the newly installed applications.


    The second approach uses another ISO image obtained from the Initial system (without
    prior installation) as a custom system. The tool generates the system from the
    standard ISO by temporarily unpacking for editing. Then it creates a custom image
    from the you modified.


