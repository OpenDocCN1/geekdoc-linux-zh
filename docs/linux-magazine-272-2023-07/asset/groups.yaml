    ## 制作透镜相机

    ### 波动时光 (Wiggle Time)


    你可以使用自制相机拍摄透镜图像，重现你小时候的那种“波动”照片。


    作者：Günter Pomska


    透镜图像在同一区域内存储多次曝光。通过倾斜图像实现动画。另一种应用是在无需特殊工具的情况下创建空间感（自动立体视觉）。这种技术的数字版本在社交媒体上通常以“波动图”（wigglegram）的形式出现。


    随后，富士（Fuji）的八镜头 Rensha 相机于1991年活跃。与 Nishika 的同步快门相机不同，富士是顺序曝光 35mm 胶片的。今天，这种胶片场景在
    Instagram 等平台上仍然非常流行。


    创建现代数字记录系统的方法之一是使用树莓派和 ArduinoCam [2] 的 Camray HAT（安装在顶部）。我在本文制作的相机使用了四个间距 1 厘米的
    MIS359 传感器（如图所示）。第一次曝光后，你可以将设备移动相机的一半距离，从而产生等距离的照片，总像素为 3200 万像素 (MP)。


    ## 透镜相机


    在消费市场上，透镜相机以 ActionSampler 的名称出售。40 多年前，四镜 Nishika (Nisimilo) 问世。


    ## 透镜技术


    如今透镜屏幕的前身是波纹和层层图像，分别占据两次和三次显示。与前任的平面图像带不同，常用的透镜是半圆柱条形的透明膜，可以同时显示多幅图像 [3]。取决于视角，左眼看到的与右眼不同，观众感知到的视图是三维的（图
    2）。


    层厚的密度影响分辨率；以每英寸线条 (dpi) 设置。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_57_1.png)


    # DIY 透镜相机 MAKERSPACE


    你可以可以使用应用程序。相反，外壳的设计允许你按照相机距离移动透镜板。通过这种方式，透镜图像的数据可以从每隔 2 厘米一个传感器在 14 厘米厘米的基础上组装而成。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_58_0.png)


