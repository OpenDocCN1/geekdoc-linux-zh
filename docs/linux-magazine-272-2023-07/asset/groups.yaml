    - 2. Gary Marcus 的开场陈述：https://www.senate.gov/media/press/doc/2023-05-16%20-%20Testimony%20-%20Marcus.pdf

    - 3. AI 法案：https://artificialintelligence.eu/://www.ibm.com/policy/wp-content/uploads/2023/Christina-Montgomery-Senate-Judiciary-Testimony-5-16-23.pdf

