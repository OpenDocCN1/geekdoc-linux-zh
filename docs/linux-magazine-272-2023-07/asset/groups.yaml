- md: "\n## Reverse Engineering Bluetooth\n\nruns the main asynchronously (because\
    \ Bleak uses asyncio). It creates a BleakClient instance, with a default callback\
    \ function that runs when a BLE device is connected. then starts the scanner,\
    \ waits five seconds, and stops the device. The function adds the device to a\
    \ set of found devices. The script shows complete addresses and names of the devices\
    \ in\n\n![](img/4dce49e5b3f3b719f67be60db9a2a5ec_48_0.png)\n\nIf you run this\
    \ Python script with `python scan.py`, it shows the names and addresses of all\
    \ the BLE devices in your view. For example, a clock, with name 526C is the four\
    \ hexadecimal digits of the clock's address, so you can now see which\n\n| Search\
    \ for: | Text search | |\n|---|---|---|\n| Search definitions of | | |\n| Class\
    \ | Method | Field | Code |\n| | | Options: Case Insensitive |\n| Field | Code\
    \ | | |\n| * uuid.UUID('0000180d-0000-1000-8000-00805f9b34fb') | | |\n| * uuid.UUID('0000180a-0000-1000-8000-00805f9b34fb')\
    \ | | |\n| * uuid.UUID('00001805-0000-1000-8000-00805f9b34fb') | | |\n| * uuid.UUID('00001806-0000-1000-8000-00805f9b34fb')\
    \ | | |\n| * uuid.UUID('00001807-0000-1000-8000-00805f9b34fb') | | |\n| * uuid.UUID('00001808-0000-1000-8000-00805f9b34fb')\
    \ | | |\n\nFigure 4: Following breakpoints in the decompiled code.\n\nUUID 0000180d-0465-1007-82a9-02a9c0dd2b1\
    \ in the field, you found one occurrence: value for the 24-hour format. My code\
    \ is showing the time in its default 24-hour format, but apparently this bit changes\
    \ the format to a 12-hour clock using AM/PM.\n\n```python\npublic final UUID f476c\
    \ = UUID.fromstring('0000180d-0465-1007-82a9-02a9c0dd2b1');\n```\n\nYou can also\
    \ see that this code sets the setting command, without the day of month or the\
    \ 24-hour format. This means that the UUID refers to its name f476c. You can open\
    \ the hex search and search for f476c. This shows you one other occurrence:\n\n\
    ```python\nBluetoothCharacteristic-characteristic = service.getCharacteristic\n\
    ```\n\n# Finding the Right Code\n\nYou have a good idea of what to send to the\
    \ Bluetooth clock in order. I'll put this all together and create a Python script\
    \ to do this without the app.\n\nA few lines later the characteristic is used\
    \ as follows:\n\n```python\ncharacteristic.setValue(bar);\n```\n\nHere, the value\
    \ is in the method to which this code comes from. My method is called f476c. That's\
    \ what we need. Search for this name in the text to see where this method is called,\
    \ gives eight results (Figure 4), look at each result and try to figure out what\
    \ they're doing.\n\nAfter all the breakpoints, but only in Listing 1, which immediately\
    \ shows that you had figured out: a header body, the year, month, day, and then\
    \ minutes, confirms that this comes the second. Then comes the day of the week,\
    \ and the week that you couldn't identify turn out to be a.\n\nWith Bleak, a cross-platform\
    \ LE client library for Python, it works with:\n\nFirst, you can find all the\
    \ devices in the city and show their names and addresses. The script `find_devices.py`\
    \ (Listing 2)\n\n```bash\npip install bleak\n```\n\n### Listing 2: find_devices.py\n\
    \n```python\n01 import asyncio\n02\n03 from bleak import BleakScanner\n04 from\
    \ bleak.backends.device import BLEDevice\n05 from bleak.backends.scanner import\
    \ AdvertisementData\n06\n07\n08 def find_found(device:BLEDevice, advertisement_data:AdvertisementData):\n\
    09     devices.add(device)\n10\n11\n12 async def main():\n13     scanner = BleakScanner(discovery_callback=find_found)\n\
    14\n15     print(\"Scanning for devices...\")\n16     await scanner.start()\n\
    17     await asyncio.sleep(5)\n18     await scanner.stop()\n19\n20\n21 for device\
    \ in devices:\n22         print(f\"{device.name} : {device.address}\")\n23\n24\n\
    25 if __name__ == \"__main__\":\n26     devices = set()\n27     asyncio.run(main())\n\
    ```\n\nFor this type of Bluetooth clock by filtering on name with TP358, you only\
    \ have to change the callback function to get the script `find_clocks.py`.\n\n\
    ```python\ndef find_found(device:BLEDevice, advertisement_data):\n    if device.name.startswith(\"\
    TP358\"):\n        devices.add(device)\n```\n\n## Sending the Time\n\nNow that\
    \ you know your Bluetooth's address, you can write another script `sync_clock.py`\
    \ (Listing 3), which receives this address as a command-line argument and sets\
    \ the time of the clock. With your previous knowledge, this logic is straightforward.\
    \ The script defines the characteristic to send the command and then a function\
    \ `get_bytes_from_time`, to convert a Unix timestamp to bytes that need to be\
    \ sent to the clock. The main function connects to the device, and writes it to\
    \ the right characteristic address. If you run this command with your Bluetooth\
    \ address as an example, for:\n\n```bash\npython sync_clock.py 12:58\n```\nit\
    \ should set your clock's time.\n\n### Listing 3: sync_clock.py\n\n```python\n\
    01 import asyncio\n02 from datetime import datetime\n03 import sys\n04 from time\
    \ import time\n05\n06 from bleak import BleakClient\n07\n08 COMMAND_CHAR = \"\
    00010203-0405-0607-0809-a0b1c0d0b2\"\n09\n10 def get_bytes_from_time(timestamp:\
    \ float) -> bytes:\n11     # The bytes needed to set the time on TP358\n12\n13\
    \ Args:\n14     timestamp (float): The time encoded as a Unix timestamp.\n15\n\
    16 Returns:\n17     bytes: The bytes needed to set the time of the device to 'timestamp'.\n\
    18\n19 date_time = datetime.fromtimestamp(timestamp)\n20 return get_bytes([\n\
    21     date_time.year % 1000,\n22     date_time.month,\n23     date_time.day,\n\
    24     date_time.hour,\n25     date_time.minute,\n26     date_time.second,\n27\
    \     date_time.weekday() + 1, # Monday-Sunday -> 0-6\n28     # Use 24-hour format\n\
    29 ])\n30\n31\n32\n33 async def main(address: str):\n34     print(f\"Connecting\
    \ to {address}...\")\n35\n36     async with BleakClient(address) as client:\n\
    37         command = get_bytes_from_time(time())\n38         await client.write_char(COMMAND_CHAR,\
    \ command)\n39\n40     print(\"time synchronized\")\n41\n42 if __name__ == \"\
    __main__\":\n43     try:\n44         asyncio.run(sys.argv[1])\n45     except IndexError:\n\
    46         print(\"Please provide the Bluetooth address of the device\")\n```\n\
    \n![](img/4dce49e5b3f3b719f67be60db9a2a5ec_49_0.png)\n\n# Listing 4: Discovering\
    \ Bluetooth Clocks\n\n```bash\n01 $ bluetooth-clocks discover\n02 $ Scanning for\
    \ supported clocks...\n03 $ Found a ThermoTP958 address BC:C7:DA:6A:C6, name TP958\
    \ (SSC)\n04 $ Found a Xiaomi LWWD05 address EE:57:00:B1:38:96 LWWD05\n05 $ Found\
    \ a ThermoTP959 address: 10:76:34, name TP959 (SAAD)\n06 $ Found a Qingping BT\
    \ Clock address: 58:3D:94:53:DC, name Qingping BT Clock Lite\n07 $ Found a Current\
    \ Time Service: address EB:76:B5:98:56, name F15\n```\n\n# Listing 5: Setting\
    \ a Bluetooth Clock's Time\n\n```bash\n01 $ bluetooth-clocks set -a E7:5E:00:B1:38:96\n\
    02 $ Scanning for device E7:5E:00:B1:38:96\n03 $ Writing time to device...\n```\n\
    \nIf you have a Bluetooth clock at home that isn't supported by bluetooth-clocks,\
    \ try the reverse engineering approach demonstrated here and contribute to knowledge.\
    \ If you want to learn more about Bluetooth and how to use it in your own programs,\
    \ read the post on the book [8].\n\nmy clocks, and I published the result, bluetooth-clocks,\
    \ on Python Package (PyPI) [7].\n\n# Info\n\n+   [1] Home Assistant: https://www.home-assistant.io\n\
    [2] Wireshark: https://www.wireshark.org\n[3] Android SDK Platform: https://developer.android.com/studio/releases/platform-tool/\n\
    [4] APKPure: https://apkpure.com\n[5] jdx: https://github.com/kykot/jdx\n[6] Bleak:\
    \ https://bleak.readthedocs.io/\n[7] bluetooth-clocks: https://github.com/koenervoesem/bluetooth-clocks\n\
    [8] Voelseem, Develop your own Bluetooth Energy Applications. Elektor, https://www.elektor.com/develop-your-own-bluetooth-clock-applications\n\
    \nThis script is just the beginning. You can make it much more robust by catching\
    \ some exceptions, such as connection problems. You could add other arguments,\
    \ such as the choice of the 24- or 12-hour format. This is just for one type of\
    \ clock. You can add support for other types of Bluetooth clocks. I did for all\
    \ of\n\nyou can discover all your supported clocks as shown in Listing 4. Then\
    \ you can set the clock's time with a Bluetooth address as shown in Listing 5.\
    \ If you want to regularly synchronize the device, you can run Listing 5 as a\
    \ service, for example, with a system timer or in a cron job.\n\n# Author\n\n\
    Koen Voelseem has written about Linux and open source, computer security, privacy,\
    \ programming, algorithmic and the Internet of Things for more than 20 years.\
    \ You can find more on his website at koen.ervoersen.com.\n"
  mdcn: "\n\n## 蓝牙逆向工程\n\n主函数异步运行（因为 Bleak 使用了 asyncio）。它创建了一个 BleakClient 实例，并带有一个默认回调函数，该函数在\
