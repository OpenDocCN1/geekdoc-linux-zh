    # 封面故事

    CKAN 的开放数据


    CKAN 的力量之二，得益于 Patrunno，源自古城马特拉拉（Matera）。它是《电影中的威尼斯》和 2019 年欧洲文化之都的电影拍摄地。因为一个拥有如此久历史的地方比其他地方需要更多的维护，Patrunno
    和其他人准备了一个 CKAN 演示 [12]，以及其他内容，即该地区所有公共工程的数据（进行中），如图 6 所示。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_21_0.png)


    图 5：在分配正确的纬度和经度字段后，CKAN 现在显示了带有景点的地图。


    尽管纬度和数据存在差异，马特拉拉的界面与特伦托的界面（图 2）看起来相同。位置数据可以标识（例如，特伦托的数据资源器对比）。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_21_1.png)


