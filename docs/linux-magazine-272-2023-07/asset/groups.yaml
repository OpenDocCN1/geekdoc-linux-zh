    ## Xubuntu 23.04 and Fedora Workstation 38


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_5_0.png)


    Xubuntu 23.04, codename Lunar Lobster, is the latest version of the Ubuntu flavor
    that uses Xfce 4.18 as its default desktop. It will be supported until January
    2024. Like all Ubuntu releases, this release is ideal for those prefer a lightweight
    desktop that not not on features.


    Fedora Workstation is the Fedora release for general desktop users. It is the
    first appearance of many features that will eventually find their way into distributions
    such as Rocky Linux, AlmaLinux, and Red Hat Enterprise Linux (RHEL).


    Traditionally, Xubuntu''s short-term releases do not include major improvements,
    and Lunar Lobster is no exception. But it still has some innovations worth checking
    out. To start with, it is the first version of Ubuntu to use PipeWire and WirePlumber,
    which offer improved sound and performance. The default terminal font is now 10
    points, up from nine, a but noticeable gain for easy reading.


    New features include redesigned and accessibility settings; clearer language for
    device pairing; the ability to connect via QR Codes. Management of third-party
    package repositories is also improved. Other changes include the use of GNome
    44, including icon views and previews in the file chooser and Bluetooth support
    in the Quick Settings. The general tendency of these changes is to a more pictorial
    design, as it has been for over a decade. The result is a well-organized user
    experience that does not sacrifice functionality and is accessible to all levels
    of users.


    With Xfce 4.18 also comes a few other tweaks. As usual, many are now in the Thunar
    file manager, as well as image preview, an editable toolbar and custom highlighting
    of selecting files, and undo/redo support for a larger number of operations. The
    desktop in general includes numerous small tweaks, as well as improved Wayland
    support.


