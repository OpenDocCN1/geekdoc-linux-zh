    number or keywords attributed to books in your collection. Keywords could be used
    for search, "mystery" stories, for example, and selecting a book will open the
    reader view. This is what part of Arianna because the text is rendered beautifully,
    making it very easy to read for long on your monitor. Arianna is a great example
    of what KDE''s capabilities are: control over the font and font size, as well
    as the colors. This is perfect if you use a dark theme, because otherwise would
    be light on a dark background, which isn''t too good for light-sensitive or aging
    eyes. Another great feature is the progress bar often missing from ebook readers.
