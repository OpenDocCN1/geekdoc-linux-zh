  mdcn: '

    # Espanso：文本扩展器与缩写工具


    Espanso 是一个跨平台的文本扩展器，它的功能远不止简单的文本模块替换。作者：FERDINAND THOMMES


    文本扩展器将预定义的缩写替换为存储的文本模块。一个例子是 `wkr`，它可以展开为 AutoKey [1] 工具——该工具一年前尚在 macOS 和 Windows
    上使用，但因为它仅在 Linux X11 上运行。


    作为替代方案，Espanso 自 2019 年起问世，它超越了简单的文本缩写替换。该扩展器用 Rust 语言编写，运行在 Linux、macOS 和 Windows
    上。你可以使用 DEB 软件包或二进制包在 Linux、Debian 及其他发行版上安装它。如果你想自己编译 Espanso，Arch 用户 库 (AUR)
    中也有相应的包。


    虽然目前未直接支持某些，但你可以使用 AppImage 或自己构建软件包。开发者正寻求随时间扩展这种支持。通过 `TPE` 命令可以检查系统使用的是 X11
    还是 Wayland 作为显示类型。如安装说明 [3] 所示，结果可能需要根据情况选择不同的软件包或代码。列表 1 显示了下载第一个文件的步骤，然后运行它以确保安装成功（第
    1 到 3 行）。最后，将 Espanso 服务引入系统（第 4 行）。


    然后运行 `espanso start` 调用该工具。窗口关闭后，Linux 桌面面上没有 Espanso 的痕迹，而 macOS 和 Windows 的控制栏上会出现图标。`espanso
    --help` 提供了如何控制 Espanso 的概览（图 1）。


    在作为文本扩展器的功能中，Espanso 允许你以 `:keyword` 的形式输入关键词并将其替换为文本。例如，如果你输入 `:espanso`，这里会显示正确的响应。你可以在任何可以写字的地方替换缩写，包括
    Shell 中。


    你可以在 `~/.config/espanso` 的多个文件中配置设置。`config/` 文件夹下的 `default.yaml` 文件包含你可以通过删除
    `#` 号来编辑的设置。注意：YAML 对缩进错误是不宽忍的。


    ### 在 YAML 中配置


    你可以使用 `espanso edit` 命令打开配置文件。如果可能，替换的内容不应包含非标准字符。它们在某些应用中可以替换，但在另一些应用中不行。因为配置文件也是用
    YAML 编写的，你必须注意缩进并遵循下方提供的示例。


    当你保存 Espanso 时，会弹出的窗口提示你确认操作。如果你犯错了，消息会告诉你这是哪一行的哪个位置（图 2）。


    列表 1：安装 Espanso

    01 $ wget https://github.com/ferdinand-toni/espanso/releases/download/v0.1.7-beta-espanso-debian-x11-amd64.deb

    02 $ sudo apt install espanso-debian-x11-amd64

    03 $ espanso status

    04 $ espanso service register

    05 服务文件已存在，此操作将覆盖它

    06 正在 "/.config/systemd/user/espanso.service" 创建服务文件

    07 启用系统服务

    08 服务注册成功


    # LINUX ESPANSO


    一个隐私优先的、跨平台的文本扩展器


    ```

    用法

    espanso [FLAGS] [SUBCOMMAND]

    ```


    - 标志 (FLAGS):

    -h, --help

    -v

    -V, --version

    打印帮助信息

    设置详细程度

    打印版本信息


    - 选项 (OPTIONS):

    命令 (COMMANDS):

    code

    edit

    nc-path

    install

    log

    migate

    package

    restart

    service

    向 espanso 编辑器发送命令以编辑配置文件

    从 PATH 中打开默认文本编辑器命令的快捷方式

    打印此消息或给定子命令的帮助信息

    打印守护进程日志

    从 CLI 列出并验证条目

    自动将配置迁移到新版本

    打印所有 espanso 目录以轻松定位配置和匹配项

    一组管理 espanso 服务的命令（例如，启用系统启动时自动启动）

    将 espanso 作为服务启动

    检查守护进程是否运行

    删除软件包

    ununinstall

    workaround

    一组解决常见问题的变通方案。


    故障排除


    图 1：你可以使用 -h 或 --help 来识别可用选项。


    `match/` 是你如何指定你想让 espanso 扩展什么以及扩展成什么。工具在 `/match/base.yml` 文件中为你提供了一些简单的替换示例（图
    3）。匹配项由触发器（trigger）和替换（replace）值对定义。触发器是触发替换的字符串，而替换是它被替换的文本。一个简单的示例如下：


    为了创建一个新行，YAML 使用两个运算符 `|`，并且当两行进入视野时生效。如果你在行中使用 `|` 作为第一个运算符，另一方面，如果将缩进的三行作为 `replace
    |` 使用，应用程序将在单行中应用替换。你可以在 Stack Overflow [4] 上学习更多关于这些标量的知识。


    ```

    trigger: ":"

    replace: "Kind, regards,"

    ```


    另一个示例出现在信件和邮件的结尾，它给你两行输出：


    ```

    trigger: ":"

    replace: "Love,

    s/Peter"

    ```


    静态还是动态？

    Espanso 区分了静态和动态替换。上述描述的示例属于静态类别；它们的输出始终保持不变。动态替换的一个典型例子是放置当前行的文本。


    # 全局变量


    创建全局变量的一个原因是你可以在多个地方使用它们。在 YAML 文件的顶部定义全局变量。它们适用于此文件及其子集中定义的所有替换。如果你经常写错单词（例如，输入了额外的
    而不是别的），Espanso 证明非常有用。此处使用的真实触发器如详细配置 [5] 所示。


    | 列表 4：示例 |

    | 触发器 (trigger) | 替换 (replace) |

    | --- | --- |

    | 01 | :"div" |

    | 02 | :"<<div></</div>>" |

    | 03 | :"quote" |

    | 04 | "三个人可以保守一个秘密，如果有两个的话。" |

