    # 在驾驶？


    亲爱的读者：


    我在写这篇专栏时，参议院正在举行人工智能（AI）听证会，特别是关于是否有必要监管。证词人之一是 ChatGPT 背后的机构 OpenAI 的执行官萨姆·奥特曼（Sam
    Altman）。大多数即将成为监管对象的公司 CEO 都会对事情可能变得多么糟糕发出警告 [1]。认为一个行业参与自身监管会更好，或者说奥特曼持有不同观点并呼吁加强监督，这确实令人警觉。


    我读过几篇关于监管 AI 重要性的报道和评论文章，甚至看到了关于这种监管如何运作的细节。我不打算写另一那类的评论文章，我将告诉你们我所知的。对于奥特曼来说，监管意味着设定要求以确保
    AI 符合“安全要求”。他的安全概念涵盖几个部分，包括隐私、问责和透明度。正如他所说，AI——特别是那些开发最强大模型的模型——遵守一套安全要求至关重要，包括发布前的内部和外部测试以及发布评估结果。为了确保这一点，美国政府应该考虑建立一个围绕
    AI 模型能力、进行开发和发布的全面注册框架，并对符合这些要求的提供激励措施 [1]。


    奥特曼表示，他最担心的是 AI 可能会给世界造成巨大伤害，并“补充”道，如果这项技术增长，可能会变得非常糟糕 [1]。为了更好地理解所有这些潜在后果，我们需要更多关于技术的知识吗？然而，奥特曼并不是吹哨人——他是一个由于顾虑而辞职的人，而且并没有说他想辞职。他只是说想建立规则。


    一个 CEO 呼吁对其所属行业进行监管是值得赞扬的，但我倾向于认为责任在于政府，而该行业的个人（以及公司）不应被要求对他们认为可能对他人造成巨大伤害的技术进行具有约束力的自我限制。


    许多科学家还讨论了在披露用于训练 AI 模型的数据方面对透明的需求，以便他人识别潜在偏见。这一步对于确保问责和非歧视性 AI 至关重要，但美国需要开发新的系统来检查这些可能包含数百万页的数据集。


    参议员们对着镜头恳求，寻找可以批准反对的界限和律师，但在这种情况下，我可以同情他们理解这一问题以及如何监管的困难，以及他们如何获得这些支持。在过去，人们通过通过定义正确的规则来“思考”，但现代
    AI 系统会找到通答案的任何方法，遵循当时任何人都会遵循的路径，以展示他们如何找到比那个人（谁？）可能知道使用哪些数据进行训练的更好的答案。


    欧盟提出了一项 AI 法律框架（《AI 法案》似乎旨在监管 AI 的行为，对于开发过程禁止诸如社会评分、处理儿童或执法部门的远程生物识别等活动）。但在这些禁止的活动之外，另一些被分为三个不同的类别，每个类别都有相应的要求。这些要求涵盖了训练、测试和文档记录的需求。


    我对比欧盟提出的提出的某些监管建议表示赞赏。然而，两年前写的内容在 ChatGPT 时代显得有些过时。考虑到我们那时甚至无法想象的事物，比如如果 AI 创建了深度伪造，或者将你定义成一首诗。


    时代正在快速变化。我们需要灵活应对以解决问题。IBM 隐私与信誉官克里斯蒂娜·蒙哥马利（Christina Montgomery）在参议院听证会上作了证词，她总结认为需要“清晰、合理的政策和保障”。蒙哥马利警告说：“AI
    时代不能是另一个随心所欲的时代”。


