    # 评测


    解决方案往往存在于包的其余部分。每一篇都是六种领先一站式解决方案的总结，它们通过与商业公司的合作伙伴关系提供了一站式解决方案的社区版本。云服务通过 Shell
    和硬件 Labs Systems（见下文）提供。MX 还提供了嵌入在其 Windows 和网页上的文档。作为权利的倡导者，System76 提供了有关如何修复和升级其产品的详细说明。


    # TUXED 电脑


    TUXED 是一个正在快速扩张且在北美已广为人知的品牌，它提供优秀的产品线。TUXED 也以定制请求闻名。作为一站式解决方案之一，TUXED 提供了加密以及使用网络摄像头、麦克风、无线技术的能力。在我写这句话时，TUXED
    正在探索添加这些功能。TUXED 还提供了一些设计良好的工具，这些工具可能在其他发行版上无法工作。


    # 供应商锁定？


    有了一站式解决方案，Linux 用户终于可以享受 Windows 和 macOS 用户几十年来享有的东西。因此，用户购买系统是为了获得这种一站式解决方案，但许多人对此担忧过重，且解决方案各不相同。然而，不再需要搜索每个组件的
    Linux 兼容性了。


    # Star Labs Systems


    在此处列出的解决方案中，Star Labs [5] 并没有自己的发行版，而是选择提供对用户友好的：MX Linux、Ubuntu、Linux Mint 也提供硬件，包括高分辨率屏幕和带有指纹识别器的大触控板。它的安全功能包括一个硬件切断开关。Star
    Labs 不允许轻松浏览，它以几十种货币显示价格。长期一站式解决方案可能整合一些用户想要下载的后门。这并不是重大的阴谋，只是为了自由的必要努力。但这更容易实现吗？答案是肯定的，但不太可能。


    # Purism


    Purism [3] 于 2014 年推出，其发行版 PureOS 是少数几个因安全和隐私功能获得自由软件认证的发行版之一。其电脑包含了用于物理断开摄像头、麦克风和蓝牙的开关。Purism
    的电脑可以在安全状态下运行。此外，在从公司发货时，所有内部接口都是可用的。


    # Slimbook


    由 Pop! 的 SlimOS [6] 拥有一种不常见的界面，并包含了平铺桌面选项。在本文突出的选择中，KDE 和 Manjaro 也有发行版。Slimbook
    在几年前测试过，但由于问题已经停止了。


