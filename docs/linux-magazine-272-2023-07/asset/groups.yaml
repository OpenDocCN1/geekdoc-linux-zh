    ## Efficiently manage files with nnn


    If you''re a Linux lover, you''ll know the command line is the slickest and most
    efficient way to interact with the system. Free from point-and-click interfaces,
    popular distros such as Ubuntu have masses with icons. Users save huge amounts
    of time and effort by staying within the terminal (CLI). However, terminal doesn''t
    make it easy to navigate between files plus you need to memorize a series of commands
    to rename, copy, and move files. This is where nnn comes in—a CLI for privacy-centric
    developers, inspired by an old minimalist file manager which allows you to derive
    its own runtime. To get started, just open your terminal and:


    ```

    sudo apt-get install nnn

    ```


    You can also start nnn by running `nnn` from the command line (Figure 1).


    ### nnn Navigation


    Once you start nnn, you can navigate files and folders using the arrow keys. Press
    `j` to open a folder and `l` to return. Alternatively, use Vim-like `H` (left),
    `L` (right), `k` up, and `j` down. When browsing files, simply enter to open a
    file. nnn''s default editor is open, but nnn has limited support for opening files
    within the terminal. You can, however, press `e` for text file to display contents
    (Use `q` when you''re done).


    ### nnn Names


    Once you''re comfortable hopping from directory to directory, you might want to
    perform more advanced operations. This list can seem overwhelming if you first
    start. Using the terminal, I downloaded a file of Shakespeare''s Romeo and Juliet.
    In order to rename it, press `R` for the folder in question, and press `Ctrl+r`.
    A prompt appears at the bottom of the terminal to enter a new filename (e.g.,
    `romeandjuliet.txt`). An interesting quirk of nnn is that you can also copy files
    and folders to a new destination. Just press `Ctrl+r` to rename the file/folder
    and then enter (Figure 2). The prompt will allow you to enter the destination
    which you want to copy.


    ### nnn Motions


    Although copying individual files can be useful, you''ll need to move more files
    or even the contents of entire folders.


    Figure 1: By default, nnn opens your current working directory (in the home folder),
    unless you specify the PATH variable.


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_79_0.png)


    for Debian-based Linux distros:

    sudo install nnn for RHEL-based systems.


    ## NNN LINUX VOICE


    This is one area where using a file manager such as Nautilus can be more convenient
    than entering multiple terminal commands to select files. Luckily, nnn makes the
    selection intuitive. To select a folder or file, just right-click the folder or
    press the space bar (3). You can do this for multiple files within a folder or
    select them all. A + icon will appear next to selected files.


    If this is what you''re looking for, use / to open the prompt, which allows you
    to filter lists by keyword (Figure 4). You can also use D to toggle detailed information
    such as date and size.


    ## Moving


    Once you''ve made your selection, nnn can use Ctrl+C and Ctrl+V to copy to your
    destination of choice. If you use Ctrl-C instead, nnn will, by default, simply
    paste the folder''s contents to destination. To copy the folder and its contents
    instead, select the folder space or right-click.


    If you want to move the selected files/folders to the destination and copy-paste,
    use Ctrl+C and Ctrl+V instead. In testing, I could copy and paste a folder containing
    wallpapers from Pictures to Desktop. This worked fine, except the new folder added
    when we tried to order it, forcing us to use move to fix the issue.


    ## nnn Plugins


    Although nnn is a very respectable file manager utility in use, it can enhance
    it further by using


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_80_0.png)


    Figure 5: The officially supported plugins are available from nnn''s terminal
    manager [2], though there are community plugins in the wild, too.


    To start with the official plugins, make use / after you have installed, and then


    ```bash

    sh -c "curl -Ls https://github.com/jarun/nnn-plugins/getplugins | sh"

    ```


    Note that some of the plugins required dependencies to work. For instance, if
    you want to play audio files using the moc plugin, you need to install the moc
    audio player. You can check plugin dependencies from the GitHub page. Whatever
    plugin you choose, you''ll need to bind a key to each of them using the environment
    variable PLUGIN. For instance, to assign the letter P to play tracks using moc,
    open the terminal and type:


    ```bash

    export NN_PLUGIN="moc"

    ```


    Figure 3: Use the space bar or right-click to select multiple files. Additionally,
    press j to select all the files in a folder.


