    # # CLI File Manager


    If you''re a Linux lover, you''ll know the command line is the slickest and most
    efficient way to interact with the system. Free yourself from point-and-click
    with the nnn command-line file manager.


    BY NATE DRAKE


    popular distros such as Ubuntu have Linux to the masses with icons and point-and-click
    interfaces. Still, users save huge amounts of time and effort by staying within
    the command interface (CLI)


    However, the Linux terminal doesn''t make it easy to navigate between files, plus
    you need to memorize a series of commands to rename, copy, and move files. This
    is where nnn comes in-developer''s name ddr—a CLI for the privacy-centric DuckDuckGo
    engine, which we covered in issue 27 [1].


    This utility is inspired by an old minimalist file manager for the terminal, which
    allows you to derive its own native runtime (nnn''s Not Choice).


    Like ddgr, nnn cuts the GUI and allows you to perform operations efficiently.
    To get started, just press your terminal and


    ```

    sudo apt-get install nnn

    ```


    You can also fire up nnn by running `nnn` from the command line (Figure 1).


    # ### nnn Navigation


    Once you fire nnn, you can start navigating files and folders using the arrow
    keys. Press `j` to open a folder and `l` to return. Alternatively, use Vim-like
    `H` (left), `L` (right), `k` up, and `j` down.


    When browsing files, simply enter to open a file. nnn''s default editor is open,
    but nnn has limited support for opening files within the terminal. You can, however,
    press `e` for a text file to display contents (Use `q` when you''re done).


    # ### nnn Names


    Once you''re comfortable hopping from directory to directory, you might want to
    perform more advanced operations.


    +   - list of all commands. (You can use `q` to return to the main window)


    This list can seem overwhelming, if you first start. Using terminal, I downloaded
    a file of Shakespeare''s Romeo and Juliet, which Gutenberg has given me the unrelated
    filename `rg153.txt`.


    In order to rename, press `R` for the folder in question, and press `Ctrl+r`.
    A prompt appears at the bottom of the terminal to enter a new filename (e.g.,
    `romeandjuliet.txt`).


    An interesting quirk of nnn is that you can also copy files and folders to a new
    destination here. Just press `Ctrl+r` to rename the file/folder and then press
    enter (Figure 2). The prompt will allow you to enter the destination to which
    you want to copy the file.


    # ### nnn Motions


    Although copying individual files can be useful, often you''ll need to move more
    files or even the contents of entire folders.


