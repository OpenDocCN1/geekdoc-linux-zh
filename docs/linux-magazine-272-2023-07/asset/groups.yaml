    # Wii U 模拟器


    # FOSSPICKS LINUX 之声


    # Cemu 2


    Linux 上有几十个甚至数百个开源模拟器，从通过 MAME 运行的街机游戏移植到各种。自从各种任天堂模拟器的开发达到惊人的高度以来，已经有一段时间了。Dolphin
    是一个针对 GameCube 和 Wii 模拟的出色项目，而 Yuzu 能够获得如此广泛的也令人赞叹。它利用尖端技术处理任天堂的硬件，在对其同世代的 RPCS2
    进行修订后，但 Wii 运行在像 Steam Deck 这样的现代硬件上仍然令人惊讶。直到最近，Linux 上还缺少任天堂模拟堆栈中的一个部分，而该部分在
    Wii U 上被精细地模拟了。Wii U 是 Wii 的继任者，但并没有获得任天堂预想中的成功。这是由于其嵌入式屏幕的巨大变化，使得当你仍然需要连接独立显示器时，整个系统变得不必要的笨拙。但任天堂并没有停止为该设备制作一些出色的游戏，包括《塞尔传说》、《超级大乱斗》等作品。


    如果你拥有其他游戏，并准备好通过相当复杂的提取过程在 Cemu 上运行，直到最近它一直是 Windows 专用的且闭源。该模拟器自 2015 年以来一直存在，也可以轻松运行许多热门游戏且性能出色。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_88_0.png)


    Cemu 的最新版本包含了 Ubuntu 和 Appx64 版本。Steam Deck 的流行促使开发者创建了原生移植版，尽管它在 Proton 下运行良好良好。Windows
    版本也保持着更新，而且运行良好并兼容所有模组和图形设置。原始移植版可以访问硬件并拥有不错的游戏收藏，这是在 Linux 上玩它们，或者当你的 Linux 硬件胜任时以更高分辨率和帧率玩它们的最佳方式。


    # 项目网站


    ```

    https://cemu.info

    ```


    # 街机生存


    # 开源六角形


    年轻时任何闲暇的日子或在外玩游戏的日子，感觉都漫无止境，浪费无数虚拟橡果似乎是虚度时间的好方法。在这种行动中履行承诺的最佳解决方案之一，是在没人看到时寻找街机风格的游戏来玩，其中最好的类型之一就是《超级六角形》（Super
    Hexagon）。


    总有一个间隙，你作为玩家的任务是让一个小三角形穿过这些间隙，越久越好。如果你不好，只能活几秒钟。超过这个，你要么很年轻，就是喝了太多咖啡（或茶）。它是高强度的、成瘾的，如果你用另一只手可能不是个好主意。


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_88_1.png)


    Open Hexagon 是一场色彩与游戏性的极速冲击，自原版发布以来经过了多年的演变。Open Hexagon 是同一款游戏的开源再创作。原版已经面世十多年，也得到了
    Terry Charat 的认可。原版非常简单，但 Open Hexagon 已经过更新，以利用 Steam Deck 日益增长的活力。这是一个可以在 Steam
    上购买的版本，但你仍然可以从项目的 GitHub 仓库中构建自己的二进制文件，这是值得的。Open Hexagon 提供了原始的体验，它现在看起来依然很棒。对于
    Steam Deck 上的对战来说，它在桌面上快速畅玩一下同样有趣，并且像它最初发布时一样永不过时。


    # 项目网站


    ```

    https://github.com/vittorioneomi/SSVOpenHexagon

    ```


    # LINUX 教程 – CARBONYL 图形网页浏览器


    # 从终端进行图形网页浏览


    # 轻量浏览


    这个 Chromium 移植版可以在任何设备上运行，消耗资源极少，是让旧电脑变得真正有用的极佳工具——在此过程中还能学习。


    Carbonyl [1] 是 100% 开源的 Chrome 称为 Chromium [2] 的分支，它的使命是：将任何 Linux 终端变成现代图形化网页浏览器。我将描述
    Carbonyl 如何工作、如何在 Linux 上使用它，以及为什么我认为这个项目对程序员很有趣，而对普通用户来说更有趣。


    Carbonyl（右侧）渲染了《Linux 杂志》网站的一个页面。


    是的，实际图像确实相当颗粒化且像素化，这一点毫无疑问。但总的来说，毫无疑问 Carbonyl 渲染网页的方式比 Firefox、Chrome 或 Safari（作为其纯文本竞争对手）要接近得多。Carbonyl
    渲染的事实比基于文本的编辑器更接近“真实的图形浏览器”，这一点在图 2 中更加明显。


    # 特性与局限性


    让我承认，从概念上来说，与“普通”图形浏览器相比，Carbonyl 有一些严重的局限性，但人们预期 Carbonyl 可以取代它们。第一个显易见的限制是 Carbonyl
    不处理视频和流媒体，但它的分辨率比任何运行在完整窗口界面上的浏览器都要低得多。


