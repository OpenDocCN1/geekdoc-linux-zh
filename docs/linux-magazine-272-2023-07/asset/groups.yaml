    # LINUX VOICE 序言


    对于许多用户来说，Linux 最好的部分是工具——成千上万的工具，而且大多数都是免费的。你可以像玩具店里的孩子一样，或者更好，像城堡里的孩子一样，可以选择任何玩具，而不必担心别人说“只有一种”或“选择最便宜的”。Linux
    工具允许你根据自己的喜好和习惯构建环境。在本月的 Linux Voice 中，我们向你介绍三个你可能觉得很有用但在默认配置中找不到的工具：Espanso 文本扩展器、基于文件的管理器以及终端浏览器。


    有很多独立的数据库可用，它们可以很好地服务项目。Espanso 是一个跨平台文本扩展器，其功能远超替换文本。如果你是一个 Linux 爱好者，你会知道命令行是与系统交互最流畅、高效的方式。Chromium
    可以以极少的资源运行，是让旧电脑变得非常有用的工具——学习编程。


    作为开发者，最难学的技能之一是：编写代码；使用社交媒体；玩 NetHack；


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_72_0.png)

    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_72_1.png)


    # LINUX DOGHOUSE - 数据库


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_73_0.png)


    # MADDOG 的 DOGHOUSE


    作者：JOHN "MADDOG" HALL


    John "mog" Hall 是一位作家、教育工作者、计算机科学家，自 1999 年遇到 Linus Torvalds 并将 Linux 移植到 64 位系统以来，一直是
    Linux 的热情倡导者。担任 Linux International 的主席。


    有很多便宜的 FOSS 数据库可用，它们可以很好地服务项目。


    # 选择 FOSS 数据库


    最近，一个朋友开始了软件工程研究生课程，该课程的主题是数据库。我的朋友在计算机科学本科学位中学习过它们，但并不多。也许他需要更多。


    被认为是数据库的首选方案是，数据库引擎会将文件写入文件系统。在 Unix 上不是这样。在 Unix 中，数据库坚持直接写入磁盘分区，绕过文件系统算法和文件系统缓冲区，使得数据锁定和备份变得困难。此外，数据库在相同硬件平台的专用“商业”操作系统上的性能。


    当我大学毕业后开始第一份全职工作时，我们所熟悉的数据库才刚刚开始。IBM 和加州大学伯克利分校的 System R 是确定从研究经费获取数据最佳方法的研究项目，代码以名义的价格提供。


    作为 DEC Unix 系统的产品，我与工程师合作将关系型数据库引擎实现到每一个 Unix 中（我们使用的标记类 Unix 系统），这样客户就不会察觉他们正在为此付费。我们没有只在我们的
    Unix 数据库上使用数据库引擎，而是使用了 100% 的系统。


    如果你没有权限存储自己的数据，你就必须处理各种问题，如备份数据以获取一致快照、大小差异问题（小与大）、故障导致的数据丢失以及由于缺少日志记录导致的系统崩溃、通过缓慢的网络拉取大量数据、数据传输瓶颈以及其他系统的问题。最终，数据库可以在引擎内部存储并实现复杂功能，使整个过程变得简单得多。


    在我们拥有这种功能后，我要求我们的 Unix 系统在 VMS（开发者编写程序的地方）上运行，而不是支持的 100 多个 Unix 系统。


    还有一个问题是，当你使用带有字典的系统时，管理员会考虑数据，而不只是创建或使用数据的程序。数据库和管理员将更多精力放在向数据库中填充错误数据，这使得进展更好。


    我们起初很高兴，但由于同事的促使我写了一篇白皮书文章，标题为《Unix 系统作为数据库平台的十一个理由》，由他的一些同事编写。


