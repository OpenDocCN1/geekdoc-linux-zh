    providers to check their validity, but it is better if you can do this locally.
    This is what Nosey Parker does.


    Nosey Parker is a command-line tool that will look through files, directories,
    and your GitHub history looking for anything it considers a secret. Its definitions
    are contained within 95 regular expressions, and can be expanded or updated upon.
    The first step in performing an audit is to scan the system with an argument for
    a local file or the destination to search. Nosey Parker can report 100kb of source
    code line in less than two minutes on a Mac or Linux machine, and even a scan
    of the most private secrets. Its git history may take many seconds. But it takes
    a long time to get the best results, which it''s scary. Even in your experience,
    choosing to scan the git fascinating and in equal parts, Nosey Parker will see
    what for the data it contains of a small Git project (we won''t say) found 25
    unique API keys; including three for an AWS API, and numerous passwords – others.
    The results are summarized in the output, but you can also use the report to argue
