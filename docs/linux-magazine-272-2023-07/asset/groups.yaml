    ## File transfer


    ### X-Pipe


    With so many options for transferring files from one computer or location, it''s
    surprising that it can be so difficult and unpredictable. Two computers need the
    same protocol or run the same client. They may need to be on the same network,
    have a common firewall, or permit a third-party to negotiate connection on their
    half. And that''s what we experienced with this Linux distribution. These are
    the problems that X-Pipe attempts to solve through either a graphical file manager
    or command line equivalent, which have been specifically designed to make files
    and directories from one to another as simple as possible. X-Pipe takes a simple
    approach to providing this seamless connectivity, and it accomplishes this without
    doing anything at all. Instead of trying to negotiate connection and manage the
    transfer itself, it uses tools to natively find the client''s server. For Linux
    users, it will use SSH, but also works on macOS and Windows. It can automatically
    detect Docker and LXD instances, remote machines, WSL, and PostgreSQL databases.
    It will take you to the connection panel, and entered details are securely saved.
    Hosts can be selected in the main view, where they''ll appear as tabs, or as your
    local file system, which is accessed in the same way.


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_85_0.png)


    Adding Connections

    Connect to remote systems, databases, and more.


    The only downside of X-Pipe, other than it being open source licensing, is that
    it only releases the core components as source. You can now explore the remote
    filesystem or storage, copy and paste between tabs, or drag files to send them
    to local. It works well and is a great option if you need non-technical users
    access certain files across operating systems.


