    Reverse engineering a BLE clock


    # # Perfect Time


    What do you do when all your Bluetooth clocks show slightly different times? With
    some reverse engineering, you plan to write a Python program to synchronize your
    clocks. By Koen Vervloesen


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_45_0.png)


    While I had a ThermoPro TP358, a Bluetooth Low Energy (BLE) digital thermometer
    with a display. The ThermoPro shows the temperature, humidity, and air comfort
    indicator, as well as the time and day. Its display is nice for immediate feedback,
    but the device lets you read its values and view graphs through an app available
    on Android and iOS (Fig. 1). My plan was to figure out the meaning of the commands
    and then implement the synchronization command in a Raspberry Pi that could run
    all day. This article describes how I did this for the ThermoPro TP358, but you
    can use the same procedure with any BLE device. Moreover, every time I connect
    to the app, it synchronizes the time.


    ## Investigating Traffic


    There are various ways to investigate traffic. If you are investigating BLE packets
    sent by an Android phone, an easy way is to let your phone log, then transfer
    the logs to your computer and open them with Wireshark. Wireshark is a powerful
    open source network analyzer. Network administrators use it to analyze traffic
    and troubleshoot WiFi or Ethernet network. Wireshark can also capture other protocols,
    including Bluetooth.


    However, a nice feature, I have a couple of other types of sensors with clock,
    and a solution already exists: I don''t have any solution to synchronize the time
    across all clocks without using apps. From past engineering experience, I know
    it should be possible to intercept the synchronization commands.


    Figure 1: The app synchronizes the time of the digital thermometer.


    46 JULY 2023 | ISSUE 272 | LINUX-MAGAZINE.COM


    # Preparing Your Phone


    First you need to enable USB debugging on your phone. On some models, you may
    need to go to Settings, About phone, Software information, and finally tap Build
    number seven times. Then enter your PIN to unlock the Developer options menu,
    which will appear in your Settings. The First Request will just output notifications,
    which is probably needed to get the notification of sensors from the device. With
    the second packet, a Write Command, which indicates a winner with a value of 0x0500
    (unique identifier 0500) stands out here—it looks like 0x11. The hex value is
    also not difficult to understand: 0xf1 = 1*16 + 7.


    Now start Wireshark and open the .log file you extracted. Wireshark now shows
    you the logs from your phone''s Bluetooth Controller interface. Here, you can
    start your investigation. Wireshark shows each packet in a list with columns for
    the packet number, the time, source, protocol, and some information. When the
    source is control or there are low-level packets, you should filter the list until
    you encounter the name of your phone or the connection in question.


    Now restart your phone, go to the Developer options, and switch off USB debugging
    (Figure 2). Then tap Enable Bluetooth snnoop. After this, disable and re-enable
    Wireshark to start logging traffic. The phone BLE clock packets show when your
    phone starts connecting and asks for different types of information that the clock
    offers services and characteristics. There are a lot of packets flowing in both
    directions, so it is like finding a needle in a haystack. However, you can filter
    the packets by very specific criteria: after the date and time written by the
    phone to characterize the connection. You can filter the packets on those writes.


    # Filtering the Write Packets


    Under the Filter menu, you can find some packets with Write Request and others
    with Write Command. A Write Request requires a Write Response, while a Write Command
    does not. However, you don''t know beforehand which one the phone uses to write
    the settings, so you''ll have to investigate both.


    Click on the filter arrow, unfold the Attribute Protocol drop-down in the packets
    below, and unfold. Next click on Method: Write Request (0x12), and then apply
    Filter | Selected.


    This should show your phone as an attached device. If you''ve confirmed the address,
    your device will be listed as an <anonymous> address. To access it, you can run
    the following command on:


    ```

    adb devices

    ```


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_46_0.png)


    Then you can generate a report file, which is a ZIP file containing the btnoop_cap.log
    file in fs/data/109/bt. Generate this report file and transfer it to your computer:
    You can unplug your phone from the computer at any time. I recommend disabling
    USB debugging and the Bluetooth HCI service and re-enable them to stop logging.


    The number of packets decreases dramatically (Figure 3), which makes it much easier
    to determine the connection. Based on date and time observed (March 5th, 2023),
    you may want to look for numbers like 0x07 (for the week of March 5, 2023) and
    0x11.

