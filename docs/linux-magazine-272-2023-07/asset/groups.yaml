    # IEM Plug-in Suite


    The IEM in the name of this audio effects collects is an acronym for the Institute
    for Electronic Music and Acoustics. It is a renowned institute based in Austria,
    with a focus on acoustics, sound, signal processing, and it''s perhaps best known
    for closely associated with functional programming for audio synthesis and composition.
    There''s an IEM-flavored version of Pure Data built specifically for them, and
    the institute sponsors a lot of experimental content, which is software released
    as open source — which is exactly what makes amazing audio effects come directly
    from the institute''s research and student projects.

    The suite consists of 21 different effects. They all have a focus on acoustics,
    and in particular, something "ambisonics," which is a specific sound format. There''s
    most evident effect in the bundle, the GranularEncoder. A form of granullar-synthesizer,


    with the granular element tiny fragments of audio pulled from its stereo inputs.
    The location of grain details to the beginning of a recording with a duration
    of 1/4 of a second, but these values are easily modified through the GUI, or through
    OSC remote automation, which allows any of the sounds to be faded in and out with
    the original signal, but the main processing from a large circle to represent
    a top-down view of the immersive sphere. This is the 360-degree ambisonic sound
    stage, which you can use to change where the grains emanate from three-dimensional
    environment: left, right, front, back, up, down and between. All of this is encoded
    as surround-sound, which works perfectly with your plugin but will need decoding
    for the positional encoding. The BinauralEncoder is very good for this, even simulating
    the audio effects caused by dense clump of mass between your ears.


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_87_0.png)


    Apart from surround, the IEM effects include compression and equalization that
    can be used on any music.


    The other effects deal with room simulation and reverb.

    The RoomEncoder, for example, is the most computationally intensive one it generates
    2000 reflections for the audio you within its room. It sounds incredible, unnatural
    realistic when you map your current position and listening position to the plugin.
    The potential energy for all audio can be be viewed with the Visualizer plugin,
    which is also great for how your creations might sound in an environment of true
    ambisonics, reverb, there are compressors, processors and others that can process
    your 3D audio even further. It sounds incredible, and it''s exactly amazing that
    high-quality processing is available as open source for Linux audio software for
    free. The output doesn''t have to be 3D audio either, because these effects are
    also a great way to add subtle ambience to a podcast, or to one position or multiple
    recordings within a live environment, regardless of whether you consider yourself
    an audio wizard or not. Not something the Institute for Electronic Music and Acoustics
    would be proud of.


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_87_1.png)


    The 3D room simulation, via the room encoder and directly shape, sounds binaural
    in output with headphones.


    Project Website

    https://plugins.iem.at'
