    占用率就会飙升。有些允许创建一个没有额外软件的精简基础系统，你可以根据实际需要的项目对其进行自定义。本文将介绍那些可以快速为你提供 DIY Linux 制作工具且没有太多开销的前端。


    为了以后使用电脑，你需要通过一个实用的工具创建系统的 ISO 镜像，这种工具应该是易于使用且不是为 Linux 专家设计的。


    根据你想要创建一个可以从光介质或可移动 USB 启动的自定义 Linux 衍生版，你可能需要不同的工具来生成 ISO 镜像。如果可能，请选择可以生成混合镜像的工具（即根据需要可以从单独仓库启动）。


    ## 方法


    生成自定义镜像有两种方法。第一种方法涉及与实时系统（live system）一起工作。当你首次运行所需的发行版并删除所有不需要的应用程序后，在这个系统中，你添加日常使用所需的所有应用程序。然后，使用工具从运行中的系统生成
    ISO 镜像，创建一个包含该运行系统（包括新安装的应用程序）的镜像。


    第二种方法使用从初始系统（无预安装）获取的另一个 ISO 镜像作为自定义系统。该工具通过临时解包进行编辑，从标准 ISO 生成系统。然后根据你修改的内容创建一个自定义镜像。


    ## Cubic


    Custom Ubuntu ISO Creator（自定义 Ubuntu ISO 创建器）可用于 Ubuntu、Debian 及其衍生版，以创建单个 ISO
    镜像。你可以从单独的仓库选择该软件。要将归包添加到包管理系统中，首先打开终端并使用它。然后将 Cubic 包含在运行系统中并按照步骤操作（列表 1）。之后，你可以从菜单启动该工具以开始一个几乎为空的环境（图
    1）。


    ## 策略


    自定义 Linux 发行版通常基于自定义镜像。理想情况下，镜像将包含图形化界面或提供一种简单的方法来安装桌面。有些系统带有多个运行时版本。像 LibreOffice、Firefox、Gimp
    或 VLC 等应用程序可能缺失，但可以通过包管理器安装。为了使用这样的系统，你需要部署一个实用的工具来创建 ISO 镜像，这种工具易于使用且不是为 Linux
    专家设计的。当你到达那里，开始收集生成 ISO 镜像所需的数据。要此此，点击文件管理器右上角的绿色按钮，然后点击 Next 选择所需的目录。然后，在主窗口中点击
    Next 定义源和目标镜像。Cubic 不从运行中的系统生成新镜像，而是从现有的 ISO 镜像。理想情况下，使用尽可能轻量的镜像。


    选择源镜像后，Cubic 会自动填充对话框中的所有字段。如果发生问题（例如，镜像无法确定某些源数据的 Ubuntu 或 Debian 衍生版本），程序将显示错误消息。对于成功识别的镜像，Cubic
    会提取数据。你可以点击窗口右上角的 Next 进入几乎空的环境。


    通过点击左侧的单选按钮选择压缩方法。然后点击开始创建新的 ISO 镜像。Cubic 通过几个步骤，逐个识别并记录进度条。


