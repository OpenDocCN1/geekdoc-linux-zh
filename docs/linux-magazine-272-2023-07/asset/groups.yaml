    # COVER STORY

    Interview – ODI''s Lisa Allen


    # Meet Open Data Institute''s Lisa Allen


    ## Unlocking the Benefits


    The Open Data Institute''s Lisa Allen explains why data matters and what it will
    take for more widespread adoption. By Joe Casad


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_23_0.png)


    World Wide Web creator Tim Berners-Lee founded the Open Data Institute (ODI) to
    help foster a free internet. We asked Lisa Allen, Director of Data and Services
    for ODI, to talk out her mission and the path ahead.


    **Linux Magazine (LM)** How if we start with a little history? What is the Open
    Data Institute? How did it get started and why?


    **Lisa Allen (LA)** The Open Data Institute is a nonprofit company founded in
    2012 (we celebrated our 10th anniversary last year!) by Sir Tim Berners-Lee and
    Sir Nigel Shabolt. We operate as an institute and services provider, collaborating
    with businesses, governments, and civil society to create a world where data works
    for everyone.


    **LA:** We believe that transparency can champion the value of open data and to
    advocate for its innovative use in bringing positive change. In the early days,
    we argued that social, economic and environmental change would come from the wide-scale
    adoption and opening of data on the global agenda. We established a working group
    led by the ODI, and now over six million users in the UK alone. We also instructed
    companies early on, to create nearly 1,000 datasets and generate £100 million
    (~$125 million) in revenue. We work across the data space, helping organizations
    share data across this spectrum.


    **LM:** Your mission is so diverse. On one hand, you have tools for open data.
    On the other hand, you have an advantage role. What roles do you serve to be defining
    what data is and developing guidelines for responsible data sharing? How does
    this all fit together? How would you describe the priorities? Where does your
    organization spend most of its time?


    **LA:** We vision to create a world where data works for everyone, and we aim
    to achieve this by building an open, trustworthy data ecosystem through our work
    with businesses, governments, and civil society. For us believe data is a critical
    part of the national infrastructure, and the electricity networks on which we
    all rely. Improving the data processes of organizations is important so they can
    build and range of services including training, expert consultancy, and research,
    to equip organizations with the ability to generate social and economic value.
    We do develop products and services, run a membership program, and help build
    an understanding of, public policy decision making. We are a broad range of services,


    **LM:** the "open data" gets abstract. Are there specific formats or frameworks
    we recommend? Can you point to specific services that most users want to use?


    **LA:** We define open data as data that anyone can access, and use, rather than
    specific formats or frameworks, we believe in Sir Tim Berners-Lee''s 5 Linked
    Data system, that is available on the web, machine-readable, in a non-proprietary
    format, using open standards, and others like this. This is the journey that we
    all need to go through to unlock the value of data. Licensing is making and use
    of open licenses such as Creative Commons to transform transparency, instance,
    opening the Government License in the UK to drastic effect on the availability
    and usability of public data.


    **LM:** Our readership of developers and Linux power users will be of particular
    interest. We will tell you more about data Toolkit for Business and Public Services
    Toolkit, as all other tools you''d prefer to use.


    **LA:** We produce many free tools and guides to help people manage, use, and
    publish data. The Data Toolkit for Business and the Public Services Toolkit have
    much in common — ultimately, they both aim to help people overcome barriers to
    using data effectively and bring together a range of tools to help in different
    settings. Two elements they have in common are the Canvas and the Data Ecosystem
    Mapping, and things we are really proud of. We recently learned that both of these
    could be incorporated into a tool by United Nations Development programme and
    the GIZ (Germany international development office), which joins the team of Microsoft,
    OCHA (United Nations Office for the Coordination of Humanitarian Affairs), and
    Arup, alongside government departments, academic institutions, and health authorities
    in the UK and globally, in using them.


    These can affect the confidence that data is for purpose and will meet user requirements.
    Good, trusted data really matters, and open data is the best foundation for data
    infrastructure ensuring transparency, accountability, and understanding.


    **LM:** It seems to be part of ODI’s DNA to evolve with the times. Recently, you’ve
    been raising awareness about open data artificial intelligence. How does AI relate
    to open data? What are your goals in the area?


    **LM:** What do you see as the biggest impediments to open data adoption? What
    is standing in the way right now?


    **LA:** It is hard to miss that all the generative AI we have received, and the
    headlines that have accompanied it. But the one thing that they have in common
    is that they are all dependent on amounts of data. The technologies continue to
    evolve but data what is feeding you.


    One of the risks of sharing data, especially open data, is high risk. We think
    this is because people don’t understand the risks that are present in their data,
    and the risks associated with sharing it, and, importantly, how to mitigate those
    risks. We worked on this issue to develop a tool to help people understand these
    issues and risks. We have identified key areas to assess sharing data: regulatory,
    ethical, reputational, and commercial risk. The biggest thing often missing is
    how to understand the data, the risk and, most importantly, the benefits that
    open data can unlock.


    That’s why building and trusting data ecosystems is so important. We need more
    openness and understanding about data sources, the biases contained within, and
    the impact can have both negative and positive. We need better data skills and
    knowledge to help people understand where AI is at and for working with this data.


    **LM:** What are some examples of things that will get easier if open data is
    adopted on a scale?


    Well-curated data is vital when there is no assurance. We define assurance as
    the process, or set of, that ensures confidence that data will meet our needs,
    and that organizations collecting, accessing, using, and sharing data are doing
    so without trusty. Data assurance to several factors including its quality, supply,
    and ethics. When considering ethics, users need assurance that the data is properly
    collected, used, and shared. All of these factors can affect the confidence that
    data is for purpose and will meet user requirements.


    **LA:** The impact of open data in banking and transport is undoubtedly benefiting
    millions of people. Our work with OpenAc (OA) with the OA community has had a
    significant impact, making it easier for people to access opportunities through
    open data that were previously locked away. The benefits of these innovations
    extend far beyond what was initially anticipated. The Environment Agency’s open
    LiDAR data, has had unexpected benefits for challenges and learning from how the
    benefits of open data can be unlocked. This is unlocked through openness, as other
    creative and innovative ways to use the data; efficiencies, as open data removes
    friction and unlocks value; and all the value to building by creating transparency.
    These are all benefits of open data – so more that is released, the more that
    can be unlocked.


