  mdcn: "\n\n## Linux 下的数字 IC 仿真\n\n# MAKERSPACE\n\n在之前的 N 个时钟周期中，其中 N 取决于信号 FSM 的状态和输入数量以及组合逻辑的复杂程度。因为“状态”可以代表任何内容，从一个简单的计数器到实时算法时尚的阶段，FSM\
    \ 是许多 HDL 设计中的通用组件。\n\n## Reg vs Wire\n\n### 列表 1：示例 Verilog 代码\n\nHDL 数据类型最重要的的是线线（wires）和寄存器（regs）。wire\
    \ 和 reg 都可以存储多个位。\n\n```verilog\n01 module sample_counter;\n02 input CLK;\n03\
    \ input RST;\n04 output reg[23:0] COUNTER;\n05 output wire SOME_OTHER_SIGNAL;\n\
    06 output wire SOME_RIGHT;\n07 always @(posedge CLK)\n08 begin\n09 if (RST ==\
    \ 1b1)\n10 COUNTER <= 0b0; // 将 COUNTER 的所有位置为 0\n11 COUNTER <= COUNTER + 1d;\
    \ // 通过 24 位加法器\n12 end\n14\n15 assign SOME_PULSE = (COUNTER[2:0] != 3'b001);\
    \ // 1b1\n16\n17 controller (clk, SOME_PULSE, SOME_OTHER_SIGNAL);\n18 endmodule\n\
    ```\n\n## 在 HDL 中实现\n\nWire 用于表示数字信号（“网”，连接算法元素之间的连接）。虽然 wire 可以表示两个或多个模块之间的直接连接，\n\
    \n为了便于设计和管理，电路被划分为包含子模块的模块；然而，电路的其余部分被忽略，它是一个黑盒。\n\n数字设计人员允许我们使用 Verilog、VHDL\
    \ 或 SystemC 等 HDL 语言进行建模。在本文中，我们将帮助你学习如何使用 VHDL 为各种电路建模。\n\n物理行为与其 HDL 模型行为完全一致，而无需声明并将每一个逻辑门连接到所有其他逻辑门。\n\
    \nHDL 在编程语言中呈现出两类特征。一类是始终在运行并需要描述逻辑门结构特征的实例，这些特征仅在时钟跳变时改变。\n\n刻意选择使用列表 1 显示了两种数据以及在\
    \ RTL 层级处理它们的 Verilog 语法。\n\n另一类包含了仿真和分析电路实时行为所需的所有内容。\n\nHDL 设计师描述了与设计中所有其他块并行运行的块。如果你遵循规则，无论所有块实例化的顺序如何，每个块的行为都将是相同的。\n\
    \n在 Verilog 中，module 是关键字。module 始终有一个名称并实例化其他模块。列表 1 显示了一个简单的模块计数器，它可以实例化名为 controller\
    \ 的其他模块实例。\n\n与 wire 不同，reg 是一种可以存储值的 Verilog 数据类型。取决于你如何编写，每个 reg 必须存在于硅片中，并且是寄存器传输级（RTL）代码。良好的代码比高层代码花费更多时间来编写，但你生成的概率会高得多。\n\
    \nHDL 的主要特征是支持电路建模的语法和结构。\n\n![](img/4dce49e5b3f3b719f67be60db9a2a5ec_64_0.png)\n\
    \n![](img/4dce49e5b3f3b719f67be60db9a2a5ec_64_1.png)\n\n图 1：内存和计数器逻辑最简单的组合，它在每个时钟周期翻转其值。\n\
    \n图 2：图 1 的反馈环产生了一个与时钟同步的输出，频率为一半。\n\n## MAKESPACE 硅上数字\n\n使用注释解释每个信号是什么以及模块如何工作。\n\
    \n在变量声明和 cl1 实例化之间，submodule_counter 包含了两个控制现实的块（或过程）。从值计数器第 28 行开始的块与 cl1 的起始赋值相匹配。当\
    \ RST 为低电平时，计数器将置为零；否则，它将加 1。注意非阻塞的语法是非常重要的。\n\n**阻塞（Blocking）**赋值就像“正常”赋值，它们会被转换为组合逻辑。主要区别是“块，仿真器将按照它们出现的顺序一个接一个地顺序执行它们。结果是阻塞赋值的输出将取决于它们的顺序。然而，非阻塞赋值\n\
    \n非阻塞赋值几乎相反。例如，假设仿真有执行时间。所有变量和寄存器的值不包含 나서 这很重要。非阻塞赋值意味着，在赋值结束时：\n\n- 它在层次结构的每一层，采样出现在非阻塞赋值语句右侧的所有变量的输入值；\n\
    - 使用这些采样的值（可能会以后获取）来计算非阻塞赋值左侧所有变量的下一个值。\n\nHDL 仿真器在收集到所有使用 `<=` 运算符进行的赋值的输入之前不阻塞计算任何下一个值的能力，这正符合硬件寄存器的实际行为。在编写时，赋值的结果不取决于非阻塞语句的编写顺序。\n\
    \n赋值 counter (*) 并且你应该明确声明数值常数的值。如果第 15 行说是 5'db，例如，COUNTER 的低位被设置为零，但其他位可能持有更新后的值。\n\
    \n请参见“阻塞”部分以了解更多关于 HDL 中阻塞和非阻塞逻辑的工作原理。只需注意非阻塞赋值 counter (*) 并且你应该明确声明数值常数的值。\n\
    \n![](img/4dce49e5b3f3b719f67be60db9a2a5ec_65_0)\n\n## 测试平台（Test Benches）\n\n\
    HDL 语言有许多关键字和特征可以可以\n\n### 列表 2：激励（Stimuli）\n\n```verilog\nbegin\n    $display(\"\
    Simulation started\")\n    #100 $display(\"Waiting for edge\")\n    @(posedge\
    \ FINISHED) $display(\"FINISHED\")\nend\n```\n\n### 列表 3：交通信号控制器\n\n```verilog\n\
    module 01 traffic_controller(n_lights,s_lights,e_lights,w_lights,\n    clk, rst_a);\n\
    \    input [2:0] n_lights,s_lights,e_lights,w_lights;\n    input clk;\n    input\
    \ rst_a;\n    output reg [2:0] state;\n\n    parameter [2:0] north = 3b000;\n\
    \    parameter [2:0] north_y = 3b001;\n    parameter [2:0] south = 3b002;\n  \
    \  parameter [2:0] east = 3b101;\n    parameter [2:0] west = 3b010;\n    parameter\
    \ [2:0] west_y = 3b011;\n\n    reg count;\n\n    always @(posedge clk, rst_a)\n\
    \    begin\n        if (rst_a == '1'b0) // 重位信号为低电平\n        begin\n         \
    \   state <= north;\n            count <= 3b000;\n        end\n        else\n\
    \        begin\n            case (state)\nnorth\n                begin\n     \
    \               if (count == 3b001)\n                        state <= north_y;\n\
    \                    count <= 3b000;\n                end\nsouth\n           \
    \     begin\n                    if (count == 3b001)\n                       \
    \ state <= south_y;\n                    count <= 3b000;\n                end\n\
    east\n                begin\n                    if (count == 3b001)\n       \
    \                 state <= east;\n                    count <= 3b000;\n      \
    \          end\nwest\n                begin\n                    if (count ==\
    \ 3b001)\n                        state <= west_y;\n                    count\
    \ <= 3b000;\n                end\n            endac\n        end\n    end\nend\n\
    ```\n\ntask 可以返回任意数量的结果（即使没有）并调用其他任务或函数；最重要的是，任务可以包含任何耗时语句，如 @delay\n\n归根结，良好的测试平台的重要性至少不亚于编写模块，以至于\
    \ HDL 设计师甚至专门负责测试平台，以验证团队其他成员的设计。\n\n"
