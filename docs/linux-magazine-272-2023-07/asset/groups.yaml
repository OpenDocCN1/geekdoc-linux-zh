    # WHO''S DRIVING?


    Dear Reader,


    I have to write this column on a day when the Senate is conducting hearings on
    Artificial Intelligence (AI) and, specifically, whether a need exists for regulation.
    One of the people testifying is Sam Altman, CEO of OpenAI, the body behind ChatGPT.
    Most CEOs of companies that are about to be the subject of regulation come with
    warnings about how bad things could go wrong [1]. To believe it is better for
    an industry to be involved in its own regulation, or it is alarming, that Altman
    is having a different view and calling for more oversight


    I have read several stories and opinion columns on the importance of regulating
    AI, I have even seen details on what this regulation would look like. Rather than
    writing another of those opinion columns, I’ll tell you what I know. For Altman,
    regulation means setting requirements to ensure that AI meets “safety requirements.”
    His concept of safety encompasses several parts, including privacy, accountability,
    and transparency. As he stated, it is vital that AI – especially those working
    on the most powerful models – adhere to a set of safety requirements—including
    internal and external testing to release and publication evaluation results. To
    ensure this, the U.S. government should consider a comprehensive registration
    framework for development and release of AI models around their capabilities,
    alongside incentives for compliance with these requirements [1]


    Altman says that his worst fear is AI could cause significant harm to the world,
    “adding” if this technology grows, it can go quite wrong [1]. To better understand
    all those potential consequences we need more about the technology? And yet, Altman
    is not a whistleblower–he is the guy who is resigning because of his misgivings
    and is not saying he wants to. He is just saying he wants to set up rules.


    It is commendable that a CEO would call for regulation of his own industry, but
    I feel better that the onus is on the government and individuals (as well as companies)
    in this industry would not be expected to exercise some self-restraint binding
    a technology that they feel themselves could cause significant harm to others.


    Many scientists have also talked about the need of transparency in disclosing
    the data that was used to train AI models so others can identify potential for
    bias. This step seems essential for ensuring accountability and non-discriminatory
    AI, but the US will need to develop new systems for checking these datasets that
    can contain millions of pages of data.


    The senators pleaded to the cameras, looking for bounds and attorneys to approve
    against, but in this case, I can sympathize with the difficulties they have to
    understand this issue know how to regulate how they could get them. In the old
    days, people used to “think” by just defining the right rules, but modern AI systems
    find any way to the answer, following a path that anyone then follow to show how
    they find better than that someone (who?) might know what data was used for training.


    The EU has proposed a law framework for AI (the AI Act appears to regulate the
    behavior of the AI, as to the developed process, prohibiting activities such as
    social scoring, processing of children or remote biometric identification by law
    enforcement). But these prohibited activities, others are classified into three
    different categories requiring requirements for each category. The requirements
    address the need for training, testing, and documentation.


    I applauded the EU for some proposed regulation on the table. However, what was
    written two years ago, sounds a little anachronistic in the ChatGPT era. Thinking
    about things we weren’t even imagined then, like if an AI creates deepfakes or
    defines you into a poem


    Times are rapidly changing. We need to be nimble in order to address the problem.
    IBM Privacy and Trust Officer Christina Montgomery, who testified at the Senate
    hearing, put it in summary the need for “clear, reasonable policies and guards.”
    Montgomery warns that “The era of AI cannot be another of free and break things”


    Info


    - 1. https://www.senate.gov/media/press/doc/2023-05-16%20-%20Testimony%20-%20Sam%20Altman.pdf

    - 2. Gary Marcus’ opening statement: https://www.senate.gov/media/press/doc/2023-05-16%20-%20Testimony%20-%20Marcus.pdf

    - 3. The AI Act: https://artificialintelligence.eu/

    ://www.ibm.com/policy/wp-content/uploads/2023/Christina-Montgomery-Senate-Judiciary-Testimony-5-16-23.pdf

