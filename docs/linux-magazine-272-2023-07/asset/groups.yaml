    # COVER STORY

    # Open Data with CKAN


    Managing open data with CKAN


    ## Fast Track


    CKAN, a versatile data management system, lets you build a portal to share your
    open data. By Marco Fioretti


    > Open data would be of little use if it wasn''t easy to find, download, and integrate.
    The Comprehensive Knowledge Network (CKAN), a key component of the Open Knowledge
    Foundation''s mission to promote open data [2], is a collection of tools for implementing
    open hubs and portals. If you have a dataset that you want to make available to
    everyone, CKAN gives you a head start on implementing the necessary infrastructure.


    The CKAN tool helps you manage and fetch the data. It also comes with advanced
    features, search capabilities, metadata, and visualization options. With these
    you can build a portal for your open data with the least possible effort.


    ## How CKAN works


    CKAN is built on open standards and free/open software. At its core, most of CKAN
    is Python code, released under an GPL license. Many of its components are the
    PostgreSQL database engine and Apache


    CKAN makes it easy to find, browse, and analyze open data manually. CKAN''s real
    value, however, is in its support for creating federated catalogs of open data.
    CKAN does this through programming interfaces (APIs) [4] which support REST-style
    data exchange and allow to export entries to the Data Catalog Vocabulary Profile
    (DCAT-AP) [5], DCAT-AP is an application standard for describing public datasets.


    developed in Europe to make these datasets easy to search. DCAT-AP rules standardize
    the description of datasets, defining what metadata should be published and the
    corresponding machine-readable formats.


    For this reason, many organizations (mainly, but not exclusively, public administrations)
    use CKAN to collaboratively build a worldwide, coherent catalog of open data.
    CKAN''s tools and methods automate not just the initial import of data with all
    its metadata, but also its constant updating, straight from the original sources,
    from databases or web feeds.


    When one or more sets of data go into a CKAN website, its administrator may enable
    its users (human and other software) to immediately download current data in any
    format or visualize the data directly in.


    Automatic usage is possible thanks to various mechanisms that, once a dataset
    is announced, its excellence with reference description (RDF) declarations. RDF
    declarations may then expose the corresponding datasets, as well as datasets of
    many other CKAN-compatible stores, as one of single catalog of choosing. In Italy,
    several regional administrations'' CKAN catalogs feed into the national data portal
    [6], which then feeds into the European portal [7]. Worth noting here, the national
    portal is not a CKAN portal, but it can still be showcased by using the DCAT-AP
    standards and software tools, to the beauty of open standards.

