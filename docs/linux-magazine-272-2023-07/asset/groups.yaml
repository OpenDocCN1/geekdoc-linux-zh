    作为备份，我使用了 Synology 以及一些大容量硬盘。但由于严格的规定和保护协议，我只有在需要时才会使用它（例如，备份正在运行）。为了开启它，我更倾向于偶尔点击图形界面（GUI），而不是离开椅子。


    ## 开启它


    它是如何工作的？当它处于关闭状态时，NAS 会积极等待局域网唤醒（WoL）信号。它检测到网络处于低功耗模式。如果广播包到达局域网，设备的电源或主板将开启。


