    # 深度解析 – coreboot


    ## 编译 coreboot 固件


    ### 从零开始


    coreboot 让你在学习 Linux 的同时构建自己的固件。*作者：Bruce Byfield*


    作为 BIOS 和 UEFI 的开源替代方案因其速度和安全性而受到赞誉 [1]。然而，它的可访问性同样重要。“coreboot 网站的架构设计旨在实现不可变砖的过程。更新固件就像在手机上安装
    App 一样简单。”作为这一目标的主要结果，用户可以选择自定义他们的固件。就像自定义 Linux 内核一样，coreboot 需要遵循指令。该文档面向 Debian，可以轻松迁移到其他系统，尽管某些包的名称可能不同。coreboot
    已经在使用它，你可能需要对其调整以适应你的需求。例如，你可能需要关闭虚拟化支持以获得更好的信息。有时，不支持的主板可能满足大多数用户不熟悉的技术好奇奇。尽管有这些目标，存在损坏机器的可能性，以及另一种尝试恢复的功能。在刷入固件之前，你应该确保创建备份并彻底研究你正在做什么。


    ## 准备构建


    你需要编译器和其他工具来构建固件。你还需要访问 coreboot 的文件。


    ```bash

    bb@coreboot-pc:~$ git clone https://github.com/coreboot coreboot

    remote: Counting objects: 755206, done

    remote: Finding: 100% (755206/755206)

    remote: Total: 755206 (delta 582644), received 15800 (100% of 15800), 183.1 MiB
    | 3.05 Mi/s, done.

    remote: Resolving deltas: 100% (582644/582644), done.

    ```


    图 1：coreboot 的源代码存储在 Git 上。


    （此处为图片）


    # 深度解析命令行


    ```bash

    bb@system76-pc -- /coreboot make crossgcc-i386 Welcome to coreboot toolchain v2023-04-17
    Building coreboot using thread.目标架构是 i386。找到兼容的 Ada 编译器，默认启用 Ada 支持。正在下载并验证压缩包...

    # gmp-6.2.1.tar.xz downloading from https://ftp.gnu.org/pub/gmp/6.2.1.tar.xz 100%
    hash verified (057...

    # mpfr-4.2.0.tar.xz downloading from https://ftp.gnu.org/pub/mpfr/4.2.0.tar.xz
    100% hash verified (bac)

    # mpc-1.3.tar.xz downloading from https://ftp.gnu.org/pub/mpc/1.3.tar.xz 100%
    hash verified (bac)

    # binutils-2.40.tar.xz downloading from https://ftp.gnu.org/pub/binutils/2.40.tar.xz
    100% hash verified (bac (4fe890623f4a7b36a4f753d9a4b7f86)

    # gcc-11.3.0.tar.xz downloading from https://ftp.gnu.org/pub/gcc/11.3.0.tar.xz
    5%

    ```


    **图 2**：coreboot 通过提供自己的顺序来简化构建过程。如果你有偏好的编译器（C、G++ 或 gcc-multilib），可以替换它。如果你使用
    Clang 或 LLVM 作为编译器，也可以使用它。同样，如果你的硬件使用高级配置和电源接口 (ACPI) 进行电源管理，也包含它！如果你想要终端图形显示，使用
    `ncurses-dev` 就是你所需要的。但对于许多使用其他发行版的用户，你可能需要搜索不同的方法。


    最后一个命令输出你使用的子配方（图 1）。最后的准备阶段是构建工具链。这一步是必要的，因为不同的发行版包含不同的功能，防止许多问题，coreboot 使用它自己的补丁版本
    GCC，包括细节。


    从源码目录，输入 `make menu` 显示文本界面（图 3）。或者，如果已安装，输入 `make nconfig` 进入菜单。详细说明可以在 coreboot
    文档可用，尽管对于某些设置你可能接受默认值。对于具有原生名称的系统，遵循硬件的通用图形。对于非图形，请参考图 5 中的信息。注意，对于 Intel 和 AMD
    主板，你可能需要提供来自 vet 的文件——


    # 构建步骤


    你可以在任何机器上构建 coreboot。在你完成规则之前，该过程将无法工作。要开始，克隆 coreboot 文件并切换到它们的根目录：


