    ## Why and Why Now?


    If you''ve ever tried to download your information from major providers like Facebook,
    you know that you have one online tool to download your account, so you might
    wonder why the DTP is necessary. The Data Transfer Project was launched in 2018
    to create an open-source, service-to-data portability platform so that all individuals
    across the web could easily move their data between online service providers whenever
    they want.


    The contributors to the Data Transfer Project believe portability and interoperability
    are central to innovation. Making it easier for individuals to choose among services
    facilitates competition, empowers individuals to try new services and enables
    them to choose the best that suits their needs. Current contributors include:


