    负载（payload）在带有 coreboot 的启动机器的第一阶段加载操作系统。你可以使用默认的 SeaOS 或其他负载。包括，像 Linux 和 Star
    Labs 这样的硬件系统提供了自己的负载，这对于使用它们的工具或应用程序可能是必要的。然而，你也可以使用其他负载构建。


