    is recommended to edit the slackrepo.hints file, which will allow you to edit
    permissions across all upgrades.


    # ## Conclusion


    Creating a Slackware repository is easy if you can build a rig. If you are only
    one administrator a Slackware local machine repository is not worth the effort.
    However, if you have a large fleet of computers, your own repository will save
    you a lot of time and headaches.


    Keep in mind there are many here repositories for Slackware packages, some of
    which have a trustworthy reputation. Eric Hamilton keeps the slackrepo repository
    [13] that contains all available SlackBuilds. Nikola updates it using built slackrepo
    against official SlackBuilds.


    If you build packages from SlackBuilds.org, you do not distribute them in any
    way


