    In the UK, the Open Knowledge Foundation (OKF) [3] launched in 2004 to provide
    services, training, and community campaigns in support of open knowledge (Figure
    1). With its long history of activism, it took a little time to raise awareness.
    In 2007, a group of 30 visionaries met in Sebastopol, California, for a summit
    that would lead to the birth of the Open Government Data Initiative. Many in the
    group were familiar with FOSS principles, including Tim O''Reilly, founder of
    O''Reilly Media, and Stanford Law Professor Lawrence Silkfield founder of the
    Creative Commons license. One of the members of the group was Aaron Schlegel,
    a FOSS and data activist and creator of RSS. The Sebastopol group defined eight
    principles for when data is “open":


    +   - complete – all public data that is not subject to privacy, security, or
    privilege limitations is made available, without missing pieces that could limit
    its usefulness or obscure its meaning.

    - data is saved as collected at the source, not aggregate or processed into a
    modified form.

    - timely – data is made available as quickly possible to preserve the potential
    value.

    - accessible – data is available on the Internet and stored in a format that permits
    the widest possible range of uses.

    - processable – data should be “reasonably structured” to allow automated processing.

    - non-discriminatory – anyone can access the data, with no requirement for registration.

    - machine readable – data should be stored in a format over which no entity has
    exclusive control.


    The Open Definition of the OKF and the eight principles of Open Government were
    important for establishing a clear vision for the future. In 2009, Barack Obama
    signed an executive order making machine-readable data for government data sets
