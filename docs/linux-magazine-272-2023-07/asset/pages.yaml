    # New Release of Br OS Includes ChatGPT Integration


    If you''re a web content, Br OS might be a great option for you. In his third
    year, Brazilian-born Linux distribution, created by Anderson Marquez, focuses
    on having an operating system ready to use from the moment of installation.

    With Br OS, users will enjoy image-video-editing tools, security tools, trace
    hiding and data for publishing content even in countries with authoritarian governments.

    However, it''s integration that might garner the attention of a lot of Linux users.
    The developer integrated ChatGPT such that it''s easily accessible desktop menu
    and doesn''t have access to your data.

    ChatGPT fits within the application. By clicking the ChatGPT icon, you can log
    in with your OpenAI and start the service. As you use ChatGPT, the only data the
    service can collect is what you type into.

    This latest release of Br OS includes linux kernel 6.2, KDE Plasma 5.27.4, and
    Qt 5.15.8.


    You can read all the latest version from the release notes (https://br-os.com/blog/pt-390
    (in Portuguese)) and download an ISO from the official OS site https://br-os.com/download/.


    # Command-Line Only Perplexity 2.1


    Perplexity is not for everyone but if you''re looking for a small-scale, minimal,
    GUI-operating system to use as the base for something, this might be what you''re
    looking for:

    Perplexity includes only free software, as console tools for email, browsing,
    data recovery, and deployment. You can use Perplexity for educational purposes,
    fixing a broken OS, data recovery, and more.

    Perplexity 2.1 adds autocomplete and autofill into the menu and includes tools
    such as Perl, zstd, GNU GCC and+, bash, bintop, bzip2, pkg-config, tar, wget,
    and and more. You can find the complete package list here (https://perplexity.org/bundle/).

    New updates for version 2.1 includes kernels 6.3, 1.475-1.470, 0.188, git-2.7,
    spice-3.10, 0.9, image-20230312.20, scap 2.68, Linux 2.29, Linux kernel 6.3, and
    firmware-20230410, 1.13, Linux 4.4, OpenSSL 3.1.0, Pro-ng 4.3, sqlite 3.41.2,
    wireless-regdb-master 2023-02-13,

    You can download a live ISO (https://perplexity.org/), which isn''t intended to
    be written to and run directly from memory. The ISO is very small (205MB) and
    should run on aging hardware without a problem.'
