  md: '# # Espanso: text expander and

    Abbreviated


    Espanso is a cross-platform text expander that can do more than simply replace
    text modules. BY FERDINAND THOMMES


    A text expander replaces predefined abbreviations with stored text modules. One
    example of this is wkr, which expands to the AutoKey [1] tool used until a year
    ago on macOS and Windows because it only works on Linux X11.


    As an alternative, Espanso has been available since 2019, and it goes beyond simply
    replacing abbreviations in texts. The expander, written in Rust, runs on Linux,
    macOS, and Windows. You can install it on Linux, Debian, and other distributions
    using a DEB package or a binary package. There are also packages in the Arch User
    Repository (AUR) if you want to build Espanso yourself.


    It is not directly supported, you can use the AppImage or build a package yourself.
    Developers are looking to extend this support over time. The TPE command to check
    which system uses X11 or Wayland as setting type. The result may need you to select
    different packages or code as case in, as described in the installation instructions
    [3]. Listing 1 shows the steps to install the first download, then run it to make
    sure the installation works (lines 1 to 3). Finally, introduce the Espanso service
    to system (line 4).


    Then run the espanso start to call the tool. After the window closes, there is
    no trace of espanso on the Linux desktop, whereas an icon appears in the control
    bar on macOS and Windows. An overview of how to control Espanso is provided by
    espanso --help (Figure 1).


    In its function as a text expander, Espanso allows you to enter a keyword in the
    form: :keyword and substitutes it for the text. For example, if you type :espanso,
    the correct response is shown here. You can replace abbreviations anywhere you
    can write, including in the shell.


    You can configure the settings in several files ~/.config/espanso. The default.yaml
    file in the config/ folder contains settings that you can edit by removing the
    # hashtag. Be careful: YAML does not forgive mistakes with indentations.


    # ### Configuration in YAML


    You can use the espanso edit command to open the configuration file. If possible,
    the replaced should not contain nonstandard characters. Replacing them in some
    apps, but not in others. Because the configuration file is also written in YAML,
    you must pay attention to the indentations and follow the examples provided below.


    When you save Espanso, it shows a pop-up window where you are prompted to confirm
    the action. If you make a mistake, a message will tell you what position in line
    this is (Figure 2).


