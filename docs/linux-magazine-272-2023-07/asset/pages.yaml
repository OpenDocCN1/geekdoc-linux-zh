    # ## Compiling coreboot firmware


    # # Start from Scratch


    Coreboot lets you build your own firmware while learning about Linux. *By Bruce
    Byfield*


    The open source alternative to BIOS and UEFI is often praised for its speed and
    security [1]. However, just as much is its accessibility matters. "The architecture
    of the coreboot website is designed to have an unbrickable update process. Updating
    firmware is as simple as installing your app on mobile phone." As a major result
    of this goal, users can choose to customize their firmware. Much like customizing
    the Linux kernel, coreboot requires following instructions in the thorough documentation.
    The documentation is oriented towards Debian, which can be easily transposed to
    others, though details may differ in names of some of the necessary packages.


    machine already uses coreboot, you might want to tweak it to suit your needs.
    For example, you may prepare to turn off virtualization support in unsupported
    motherboard to get better information from your machine. Sometimes, too, an unsupported
    motherboard might suffice with a few experimental tweaks. Perhaps building coreboot
    can satisfy your curiosity about a technology that is still unfamiliar to most
    users.


    You may want to install coreboot on a machine that already has its own BIOS or
    UEFI.


    Despite the project goals, chance exists that you could break your machine, and
