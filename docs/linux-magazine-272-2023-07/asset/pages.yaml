    # # Perfect Time


    What do you do when all your Bluetooth clocks show slightly different times? With
    some reverse engineering, you plan to write a Python program to synchronize your
    clocks. By Koen Vervloesen


    ![](img/4dce49e5b3f3b719f67be60db9a2a5ec_45_0.png)


    while I had a ThermoPro TP358, a Bluetooth Low Energy (BLE) digital thermometer
    with a display. The ThermoPro shows the temperature, humidity, and air comfort
    indicator, as well as the time and day of the week. Its display is nice for immediate
    feedback, but the device lets you read its values and view graphs through an app
    available on Android and iOS (Fig. 1). Moreover, every time you connect to the
    app, it synchronizes the time.


    between my Android phone and the clock. My plan was to figure out the meaning
    of the commands and then implement the synchronization command in a Raspberry
    Pi that I could run all day on any. This article describes how I did this for
    the ThermoPro TP358, but you can use the same procedure with any other BLE device.


    # ## Investigating Traffic Logs


    There are various ways to investigate BLE traffic. If you are investigating BLE
    packets sent by an Android phone, an easy way is to let your phone log Bluetooth
    packets using an app, then transfer the logs to your computer and open them with
    Wireshark to follow the recorded Bluetooth traffic.


    Wireshark is a powerful open source network protocol analyzer. Network administrators
    use it to analyze traffic and troubleshoot a WiFi or Ethernet network at home.
    Wireshark can also capture other protocols, including Bluetooth, or from logs.


    To transfer the Bluetooth logs from your phone to your computer, you


    However, a nice feature, I have a couple of other types of Bluetooth sensors with
    a clock, and I don''t want to use multiple apps to view the sensor measurements
    and synchronize the clocks. For the sensor measurements, a solution already exists:
    Home Assistant supported my devices out-of-box, letting me view measurements in
    my Home Assistant dashboard. However, I don''t have any solution to synchronize
    the time across all of my Bluetooth clocks without using the individual apps.


    From past experience engineering Bluetooth devices, I know it should be possible
    to intercept the synchronization commands


