    \ the Real World. Since they all differ in their behaviour you have to select\
    \ one based on your needs.\n\nOne drawback to all of these methods is that they\
    \ rely on fork(2). What's wrong with that? Imagine this scenario: You have a big\
    \ Ruby app that is using hundreds of MB of memory. You need to shell out. If you\
    \ use any of the methods above you'll incur the cost of forking.\n\nEven if you're\
    \ shelling out to a simple ls(1) call the kernel will still need to make sure\
    \ that all of the memory that your Ruby process is using is available for that\
    \ new ls(1) process. Why? Because that's the API of fork(2). When you fork(2)\
    \ the process the kernel doesn't know that you're about to transform that process\
    \ with an exec(2). You may be forking in order to run Ruby code, in which case\
    \ you'll need to have all of the memory available.\n\nIt's good to keep in mind\
    \ that fork(2) has a cost, and sometimes it can be a performance bottleneck. What\
    \ if you need to shell out a lot and don't want to incur the cost of fork(2)?\n\
    \nThere are some native Unix system calls for spawning processes without the overhead\
    \ of fork(2). Unfortunately they don't have support in the Ruby language core\
    \ library. However, there is a Rubygem that provides a Ruby interface to these\
    \ system calls. The posix-spawn project ([http://github.com/rtomayko/posix-spawn](http://github.com/rtomayko/posix-spawn))\
    \ provides access to posix_spawn(2), which is available on most Unix systems."
