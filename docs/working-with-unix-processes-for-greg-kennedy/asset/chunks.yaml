  trans: '

    如果你的程序依赖于 `exec(2)` 用的输出，你可以使用之前章节中学习过的工具来处理。`Process.wait` 将确保你的程序等待子进程完成它正在执行的操作，以便你可以获取结果。


    请记住，`exec(2)`（默认情况下）不会关闭任何已打开的文件描述符，也不会进行任何内存清理。在某些情况下，你可以利用这一点。在其他情况下，它可能会导致资源使用出现问题。


    ```ruby

    hosts = File.open(''/etc/hosts'')


    exec ''python'', ''-c'', "import os; print os.fdopen(#{hosts.fileno}).read()"

    ```


    在这个示例中，我们启动了一个 Ruby 程序并打开了 `/etc/hosts` 文件。然后我们 `exec(2)` 一个 `python` 进程，并告诉它打开
    Ruby 为打开 `/etc/hosts` 文件所接收的文件描述符。你可以看到 `python` 识别了这个文件描述符（因为它通过 `exec(2)` 共享的），并能够从中读取，而无需重新打开文件。


    ## `exec` 的参数


    注意在上面的所有示例中，我向 `exec` 发送了一个参数数组，而不是将它们作为字符串传递？这两种参数形式之间存在微妙的区别。


    向 `exec` 传递字符串，它实际上会启动一个 shell 进程并将字符串传递给 shell 进行解释。传递一个数组，它将跳过 shell 并直接将数组设置为新进程的
    `ARGV`。


    **通常情况下，你应该避免传递字符串，除非你确实需要。尽可能传递数组。** 传递字符串并通过 shell 运行代码可能会引发安全问题。如果涉及用户输入，他们可能直接在
    shell 中注入恶意命令，从而可能获取当前进程拥有的任何权限。当你想要执行类似 `exec(''ls * | awk ''{print($1)}'')`
    这样的操作时，你必须以字符串的形式传递它。


    ### Kernel#system


    ```ruby

    system(''ls'')

    system(''ls'', ''--help'')

    system(''git log | tail -10'')

    ```


    `Kernel#system` 的返回值以基础的方式反映了终端命令的退出状态。如果终端命令的退出状态为 0，则它返回 `true`，否则返回 `false`。


    终端命令的标准流与当前进程共享（通过 `fork(2)` 的魔法），因此来自终端命令的任何输出都应该与从当前进程看到的输出以相同的方式。


    ### Kernel#`


    ```ruby

    `ls`

    `ls --help`

    %x[git log | tail -10]

    ```


    `Kernel#`` 的工作方式略有不同。返回的值是收集到 `String` 中的终端程序的 `STDOUT`。


    如前所述，它在底层使用了 `fork(2)`，并且对 `STDERR` 没有进行任何特殊处理，因此你可以在第二个示例中看到 `STDERR` 被打印到屏幕上，就像
    `Kernel#system` 一样。


    `Kernel#``` 和 `%x[]` 执行完全相同的操作。


    ### Process.spawn


    ```ruby

    # 仅限 Ruby 1.9!


    # 此调用将启动 ''rails server'' 进程，并将环境变量

    # RAILS_ENV 设置为 ''test''

    Process.spawn({''RAILS_ENV'' => ''test''}, ''rails server'')


    # 此调用将在 ''ls --help'' 程序运行期间

    # 将 STDERR 与 STDOUT 合并。

    Process.spawn(''ls'', ''--help'', STDERR => STDOUT)

    ```


    `Process.spawn` 与其他不同之处在于它是非阻塞的。


    如果你比较以下两个示例，你会发现 `Kernel#system` 将阻塞直到命令完成，而 `Process.spawn` 会立即返回。


    ```ruby

    # 使用阻塞方式执行

    system ''sleep 5''


    # 使用非阻塞方式执行

    Process.spawn ''sleep 5''


    # 使用 Process.spawn 以阻塞方式

    # 注意它返回子进程的 pid

    pid = Process.spawn ''sleep 5''

    Process.waitpid(pid)

    ```


    此代码块中的最后一个示例是 Unix 编程灵活性的极佳例子。在之前的章节中，我们讨论了许多 `Process.wait`，但它总是在 forking 然后运行某些
    Ruby 代码的上下文中。从这个示例中你可以看到，内核并不关心你在进程中做什么，它的工作方式始终如一。


    所以，即使我们执行了 fork(2) 然后运行了 `sleep(1)` 程序（一个 C 程序），内核仍然知道如何等待该进程完成。不仅如此，它还能像在我们的
    Ruby 程序中发生的那样，正确地返回退出状态。


    所有代码对内核看起来是一样的；这使得它成为一个灵活的系统。你可以使用任何编程语言与任何其他编程语言交互，所有的都将被平等对待。


    `Process.spawn` 接受许多选项，允许你控制子进程的行为。我在上面的示例中展示了一些实用的选项。请查阅官方 rdoc ([`www.ruby-doc.org/core-1.9.3/Process.html#method-c-spawn`](http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-spawn))
    获取详尽列表。


    ### IO.popen


    ```ruby

    # 此示例将返回一个文件描述符（IO 对象）。

    # 从其读取将返回 shell 命令打印到 STDOUT 的内容。

    IO.popen(''ls'')

    ```

    '
- fmt: "\n`posix-spawn` mimics the `Process.spawn` API. In fact, most of the de-options\
    \ that you pass to `Process.spawn` can also be passed to `POSIX::Spawn.spawn`.\
    \ So you can keep using the same API and yet reap the benefits of faster, more\
    \ resource efficient spawning.\n\nAt a basic level `posix_spawn(2)` is a subset\
    \ of `fork(2)`. Recall the two discerning attributes of a new child process from\
    \ `fork(2)`: 1) it gets an exact copy of everything that the parent process had\
    \ in memory, and 2) it gets a copy of all the file descriptors that the parent\
    \ process had open.\n\n`posix_spawn(2)` preserves #2, but not #1\\. That's the\
    \ big difference between the two. So you can expect a newly spawned process to\
    \ have access to any of the file descriptors opened by the parent, but it won't\
    \ share any of the memory. This is what makes `posix_spawn(2)` faster and more\
    \ efficient than `fork(2)`. But keep in mind that it also makes it less flexible.\n\
    \n### System Calls\n\nRuby's `Kernel#system` maps to `system(3)`, `Kernel#exec`\
    \ maps to `execve(2)`, `IO.popen` maps to `popen(3)`, `posix-spawn` uses `posix_spawn(2)`.\n\
    \n## Ending\n\nWorking with processes in Unix is about two things: abstraction\
    \ and communication.\n\n### Abstraction\n\nThe kernel has an extremely abstract\
    \ (and simple) view of its processes. As programmers we're used to looking at\
    \ source code as the differentiator between two programs.\n\nWe are masters of\
    \ many programming languages, using each for different purposes. We couldn't possibly\
    \ write memory-efficient code in a language with a garbage collector, we'll have\
    \ to use `C`. But we need objects, let's use `C++`. On and on.\n\nBut if you ask\
    \ the kernel it all looks the same. In the end, all of our code is compiled down\
    \ to something simple that the kernel can understand. And when it's working at\
    \ that level all processes are treated the same. Everything gets its numeric identifier\
    \ and is given equal access to the resources of the kernel.\n\nWhat's the point\
    \ of all this jibber-jabber? Using Unix programming lets you twiddle with these\
    \ knobs a little bit. It lets you do things that you can't accomplish when working\
    \ at the programming language level.\n\nUnix programming is programming language\
    \ agnostic. It lets you interface your `Ruby` script with a `C` program, and vice\
    \ versa. It also lets you reuse its concepts across programming languages. The\
    \ Unix Programming skills that you get from `Ruby` will be just as applicable\
    \ in `Python`, or `node.js`, or `C`. These are skills that are about programming\
    \ in general.\n\n### Communication\n\nBesides the basic act of creating new processes,\
    \ almost everything else we talked about was regarding communication. Following\
    \ the principle of abstraction mentioned above, the kernel provides very abstract\
    \ ways of communicating between processes.\n\nUsing signals any two processes\
    \ on the system can communicate with each other. By naming your processes you\
    \ can communicate with any user who is inspecting your program on the command\
    \ line. Using exit codes you can send success/failure messages to any process\
    \ that's looking after your own.\n\n### Farewell, But Not Goodbye\n\nThat's the\
    \ end! Congratulations for making it here! Believe it or not, you now know more\
    \ than most programmers about the inner workings of Unix processes.\n\nNow that\
    \ you know the fundamentals you can go out apply your newfound knowledge to anything\
    \ that you work on. Things are going to start making more sense for you. And the\
    \ more you apply your newfound knowledge: the clearer things will become. There's\
    \ no stopping you now.\n\nAnd we haven't even talked about networking :) We'll\
    \ save that one for another edition.\n\nRead the appendices at the end of this\
    \ book for a look at some popular `Ruby` projects and how they use Unix processes\
    \ to be awesome.\n\nIf you have any feedback on this book, find an error or build\
    \ something cool with your newfound knowledge, I'd love to hear it. Send a message\
    \ to `jesse@workingwithunixprocesses.com`. Happy coding!\n\n## Appendix: How Resque\
    \ Manages Processes\n\nThis section looks at how a popular Ruby job queue, Resque\
    \ ([http://github.com/defunkt/resque#readme](http://github.com/defunkt/resque#readme)),\
    \ effectively manages processes. Specifically it makes use of `fork(2)` to manage\
    \ memory, not for concurrency or speed reasons.\n\n### The Architecture\n\nTo\
    \ understand why Resque works the way it does we need a basic understanding of\
    \ how the system works.\n\nFrom the README:\n\n> Resque is a Redis-backed library\
    \ for creating background jobs, placing those jobs on multiple queues, and processing\
    \ them later.\n\nThe component that we're interested in is the Resque worker.\
    \ Resque workers take care of the 'processing them later' part. The job of a Resque\
    \ worker is to boot up, load your application environment, then connect to `Redis`\
    \ and try to reserve any pending background jobs. When it's able to reserve one\
    \ such job it works off the job, then goes back to step 1\\. Simple enough.\n\n\
    For an application of non-trivial size one Resque worker is not enough. So it's\
    \ very common to spin up multiple Resque workers in parallel to work off jobs.\n\
    \n### Forking for Memory Management\n\nResque workers employ `fork(2)` for memory\
    \ management purposes. Let's have a look at the relevant bit of code and then\
    \ dissect it line by line.\n\n```\nif @child = fork\n  srand # Reseeding\n  procline\
    \ \"Forked #{@child} at #{Time.now.to_i}\"\n  Process.wait(@child)\nelse\n  procline\
    \ \"Processing #{job.queue} since #{Time.now.to_i}\"\n  perform(job, &block)\n\
    \  exit! unless @cant_fork\nend\n```\n"
