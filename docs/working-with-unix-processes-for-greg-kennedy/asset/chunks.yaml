  trans: "\n\n`posix-spawn` 模拟了 `Process.spawn` API。事实上，你传递给 `Process.spawn` 的大多数选项（de-options）也可以传递给\
    \ `POSIX::Spawn.spawn`。因此，你可以继续使用相同的 API，同时享受更快、更高效进程创建带来的优势。\n\n从基础层面来说，`posix_spawn(2)`\
    \ 是 `fork(2)` 的子集。回一下 `fork(2)` 产生的新子进程的两个显著属性：1) 它的获得了父进程内存中所有内容的精确拷贝，2) 它的获得了父进程所有打开的文件描述符的拷贝。\n\
    \n`posix_spawn(2)` 保留了第 2 点，但没有保留第 1 点。这是两者之间的巨大差异。因此，你可以预期新创建的进程可以访问父进程打开的任何文件描述符，但它不会共享任何内存。这就是为什么\
    \ `posix_spawn(2)` 比 `fork(2)` 更快且更高效。但请记住，这也使得它的灵活性降低。\n\n### 系统调用\n\nRuby 的\
    \ `Kernel#system` 映射到 `system(3)`，`Kernel#exec` 映射到 `execve(2)`，`IO.popen` 映射到\
    \ `popen(3)`，而 `posix-spawn` 使用 `posix_spawn(2)`。\n\n## 结束\n\n在 Unix 中处理进程涉及两件事：抽象和通信。\n\
    \n### 抽象\n\n内核对其进程有着极其抽象（且简单）的。作为程序员，我们习惯于将源代码视为程序之间的区别。\n\n我们精通许多编程语言，各自用途。我们无法在带有垃圾回收的语言中编写内存高效的代码，必须使用\
    \ `C`。但我们需要对象，让我们用 `C++`。以此类推。\n\n但如果你询问内核，这一切看起来都是那样的。最终，我们所有的代码都被编译成内核可以理解的简单内容。当它在该层级运行时，所有进程都被同等对待。一切都会获得一个数字标识符，并获得对内核资源的平等访问权限。\n\
    \n这些废话的意义何在？使用 Unix 编程让你稍微拨动这些旋钮。它让你能够完成在编程语言层面无法实现的事情。\n\nUnix 编程是与语言无关的。它让你的\
    \ `Ruby` 脚本与 `C` 程序建立接口，反之亦然。它还让你能够跨编程语言复用其概念。你通过 `Ruby` 获得的 Unix 编程技能在 `Python`、`node.js`\
    \ 或 `C` 中同样适用。这些是关于通用编程的技能。\n\n### 通信\n\n除了创建新进程这一基本动作外，我们谈到的几乎其他一切都是关于通信的。遵循上述抽象原则，内核提供了进程间通信的非常抽象的方式。\n\
    \n使用信号（signals），系统上的任何两个进程都可以相互通信。通过命名你的进程，你可以与任何在命令行查看你程序的用户进行通信。使用退出码，你可以向任何监控你自身进程的进程发送成功/失败消息。\n\
    \n### 告别，但不是永别\n\n结束了！恭喜你来到这里！信不否，你现在对 Unix 进程内部机制的了解比大多数程序员都要多。\n\n既然你已经掌握了基础，就可以将你的新知识应用到你工作的任何事情上。事情对你来说将开始变得更有意义。你应用新知识越多，事情就会变得越清晰。现在没有什么能挡住。\n\
    \n而且我们还没有提到网络 :) 我们把那个留到另一个版本。\n\n阅读本书末尾的附录，查看一些流行的 `Ruby` 项目以及它们如何使用 Unix 进程变得如此出色。\n\
    \n如果你对这本书有任何反馈、发现错误，或用你的新知识构建了酷酷的东西，我很想听听。请向 `jesse@workingwithunixprocesses.com`\
    \ 发送消息。编码愉快！\n\n## 附录：Resque 如何管理进程\n\n本节查看了流行的 Ruby 任务队列 Resque ([`github.com/defunkt/resque#readme`](http://github.com/defunkt/resque#readme))\
    \ 如何有效管理进程。具体而言，它利用 `fork(2)` 来管理内存，而不是为了并发或速度。\n\n### 架构\n\n要理解为什么 Resque 这样工作，我们需要对系统如何工作有一个基本的了解。\n\
    \n根据 README：\n\n> Resque 是一个基于 Redis 的库，用于创建后台任务、将这些任务放在多个队列中并在以后处理它们。\n\n我们感兴趣的组件是\
    \ Resque worker。Resque worker 负责“稍后处理”部分。Resque worker 的工作是启动、加载你的应用程序环境，然后连接到\
    \ `Redis` 并尝试预留任何待的后台任务。当它能够预留一个这样的任务时，它就会执行该任务，然后回到步骤 1。足够简单。\n\n对于一个非复杂规模的应用程序，一个\
    \ Resque worker 是不够的。因此，并行启动多个 Resque worker 来处理任务是非常常见的。\n\n### 用于内存管理的 Forking\n\
    \nResque worker 采用 `fork(2)` 用于内存管理目的。让我们看看相关的代码片段，然后逐行剖析。\n\n```\nif @child =\
    \ fork\n  srand # 重新种子\n  procline \"Forked #{@child} at #{Time.now.to_i}\"\n\
    \  Process.wait(@child)\nelse\n  procline \"Processing #{job.queue} since #{Time.now.to_i}\"\
    \n  perform(job, &block)\n  exit! unless @cant_fork\nend\n```\n\n"
- fmt: "\nThen the child process will go to the task of working off the job. This\
    \ is where memory usage can go awry. The background job may require that image\
    \ files are loaded into main memory for processing, or many `ActiveRecord` objects\
    \ are fetched from the database, or any other operation that requires large amounts\
    \ of main memory to be used.\n\nOnce the child process is finished with the job\
    \ it exits, which releases all of its memory back to the OS to clean up. Then\
    \ the original process can resume, once again with only the application environment\
    \ loaded.\n\nSo each time after a job is performed by Resque you end up back at\
    \ a clean slate in terms of memory usage. This means that memory usage may spike\
    \ when jobs are being worked on, but it should always come back to that nice baseline.\n\
    \n### Doesn't the GC clean up for us?\n\nWell, yes, but it doesn't do a great\
    \ job. It does an OK job. The truth is that MRI's `GC` has a hard time releasing\
    \ memory that it doesn't need anymore.\n\nWhen the Ruby VM boots up it is allocated\
    \ a certain block of main memory by the kernel. When it uses up all that it has\
    \ it needs to ask for another block of main memory from the kernel.\n\nDue to\
    \ numerous issues with Ruby's `GC` (naive approach, disk fragmentation) it is\
    \ rare that the VM is able to release a block of memory back to the kernel. So\
    \ the memory usage of a Ruby process is likely to grow over time, but not to shrink.\
    \ Now Resque's approach begins to make sense!\n\nIf the Resque worker simply worked\
    \ off each job as it became available then it wouldn't be able to maintain that\
    \ nice baseline level of memory usage. As soon as it worked on a job that required\
    \ lots of main memory then that memory would be stuck with the worker process\
    \ until it exited.\n\nEven if subsequent jobs needed much less memory Ruby would\
    \ have a hard time giving that memory back to the kernel. Hence, the worker processes\
    \ would inevitably get bigger over time. Never shrinking.\n\nThanks to the power\
    \ of `fork(2)` Resque workers are reliable and don't need to be restarted after\
    \ working a certain number of jobs.\n\n## Appendix: How Unicorn Reaps Worker Processes\n\
    \nAny investigation of Unix Programming in the Ruby language would be remiss without\
    \ many mentions of the Unicorn web server ([http://unicorn.bogomips.org](http://unicorn.bogomips.org)).\
    \ Indeed, the project has already been mentioned several times in this book.\n\
    \nWhat's the big deal? Unicorn is a web server that attempts to push as much responsibility\
    \ onto the kernel as it can. It uses lots of Unix Programming. The codebase is\
    \ chock full of Unix Programming techniques.\n\nNot only that, but it's performant\
    \ and reliable. It's used by lots of big Ruby websites like Github and Shopify.\n\
    \nThe point is, if this book has whet your appetite and you want to learn more\
    \ about Unix Programming in Ruby you should plumb the depths of Unicorn. It may\
    \ take you several trips into the belly of the mythical beast but you will come\
    \ out with better understanding and new ideas.\n\n### Reaping What?\n\nBefore\
    \ we dive into the code I'd like to provide a bit of context about how Unicorn\
    \ works. At a very high level Unicorn is a pre-forking web server.\n\nThis means\
    \ that you boot it up and tell it how many worker processes you would like it\
    \ to have. It starts by initializing its network sockets and loading your application.\
    \ Then it uses `fork(2)` to create the worker processes. It uses the master-worker\
    \ pattern we mentioned in the chapter on forking.\n\nThe Unicorn master process\
    \ keep a heartbeat on each of its workers and ensures they're not taking too long\
    \ to process requests. The code below is used when you tell the Unicorn master\
    \ process to exit. As we covered in chapter (Forking) if a parent process doesn't\
    \ kill its children before it exits they will continue on without stopping.\n\n\
    So it's important that Unicorn clean up after itself before it exits. The code\
    \ below is invoked as part of Unicorn's exit procedure. Before invoking this code\
    \ it will send a `QUIT` signal to each of its worker process, instructing it to\
    \ exit gracefully.\n\nThe code below is used by Unicorn to clean up its internal\
    \ representation of its workers and ensure that they all exited properly.\n\n\
    Let's dive in.\n\n```\n# reaps all unreaped workers\ndef reap_all_workers\n  begin\n\
    \    wpid, status = Process.waitpid2(-1, Process::WNOHANG)\n    wpid or return\n\
    \    if reexec_pid == wpid\n      logger.error \"reaped #{status.inspect} exec()-ed\"\
    \n      self.reexec_pid = 0 \n      self.pid = pid.chomp('.oldbin') if pid \n\
    \      proc_name 'master'\n    else\n      worker = WORKERS.delete(wpid) and worker.close\
    \ rescue nil \n      m = \"reaped #{status.inspect} worker=#{worker.nr rescue\
    \ 'unknown'}\"\n      status.success? ? logger.info(m) : logger.error(m)\n   \
    \ end \n  rescue Errno::ECHILD\n    break\n  end while true\nend\n```\n\nWe'll\
    \ take it one line at a time:\n\n```\nbegin\n  ...\nend while true\n```\n\nThe\
    \ first thing that I want to draw your attention to is the fact that the `begin`\
    \ block that's started on the first line of this method actually starts an endless\
    \ loop. There are others ways to write endless loops in Ruby, but the important\
    \ part is to keep in mind that we are in an endless loop so we'll need a hard\
    \ `return` or a `break` in order to finish this method.\n\n```\nwpid, status =\
    \ Process.waitpid2(-1, Process::WNOHANG)\n```\n\nThis line should have some familiarity.\
    \ We looked at `Process.waitpid2` in the chapter on `Process.wait`, but we always\
    \ passed in a `pid` as the first option and never passed anything as the second\
    \ option.\n\nSo we saw that passing a valid `pid` as the first option would cause\
    \ the `Process.waitpid` call to wait only for that `pid`. What happens when you\
    \ pass `-1` to `Process.waitpid`? We know that there are no processes with a pid\
    \ less than 1, so...\n\nPassing `-1` waits for *any* child process to exit. It\
    \ turns out that this is the default option to that method. If you don't specify\
    \ a `pid` then it uses `-1` by default. In this case, since the author needed\
    \ to pass something in for the second argument, the first argument couldn't be\
    \ left blank, so it was set to the default.\n\nHey, if you're waiting on any child\
    \ process why not use `Process.wait2` then? I suspect that the author decided\
    \ here, and I agree with him, that it was most readable to use a `waitpid` variation\
    \ when specifying a value for the `pid`. As mentioned above the value specified\
    \ is simply the default, but nonetheless it's most salient to use `waitpid` if\
    \ you're specifying any value for the `pid`.\n\nThe second argument is for special\
    \ flags. Passing `Process::WNOHANG` causes this normally blocking call to become\
    \ a non-blocking call. When using this flag if there are no processes that have\
    \ exited for us then it will not block and simply return nil.\n\n```\nwpid or\
    \ return\n```\n\nThis line may look a little odd but it's actually a conditional\
    \ `return` statement. If `wpid` is `nil` then we know that the last line returned\
    \ `nil`. This would mean that there are no child processes that have exited returning\
    \ their status to us.\n\nIf this is the case then this method will return and\
    \ its job is done.\n\n```if reexec_pid == wpid\n  logger.error \"reaped #{status.inspect}\
    \ exec()-ed\"\n  self.reexec_pid = 0 \n  self.pid = pid.chomp('.oldbin') if pid\
    \ \n  proc_name 'master'\n```\n\nI don't want to spend much time talking about\
    \ this bit. The 'reexec' stuff has to do with Unicorn internals, specifically\
    \ how it handles zero-downtime restarts. Perhaps I can cover that process in a\
    \ future report.\n\nOne thing that I will draw your attention to is the call to\
    \ `proc_name`. This is similar to the `procline` method from the Resque chapter.\
    \ Unicorn also has a method for changing the display name of the current process.\
    \ A critical piece of communication with the user of your software.\n\n```\nelse\n\
    \  worker = WORKERS.delete(wpid) and worker.close rescue nil \n```\n\nUnicorn\
    \ stores a list of currently active worker processes in its `WORKERS` constant.\
    \ `WORKERS` is a hash where the key is the pid of the worker process and the value\
    \ is an instance of `Unicorn::Worker`.\n"
