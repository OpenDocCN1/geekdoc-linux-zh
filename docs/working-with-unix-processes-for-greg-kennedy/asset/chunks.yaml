- fmt: "\nGiven a system with 4 CPUs, if you `fork` 4 new processes then those can\
    \ be handled each by a separate CPU, giving you multicore concurrency.\n\nHowever,\
    \ there's no guarantee that stuff will be happening in parallel. On a busy system\
    \ it's possible that all 4 of your processes are handled by the same CPU.\n\n\
    `fork(2)` creates a new process that's a copy of the old process. So if a process\
    \ is using 500MB of main memory, then it forks, now you have 1GB in main memory.\n\
    \nDo this another ten times and you can quickly exhaust main memory. This is often\
    \ called a `fork bomb`. Before you turn up the concurrency make sure that you\
    \ know the consequences.\n\n## Using a Block\n\nIn the example above we've demonstrated\
    \ `fork` with an if/else construct. It's also possible, and more common in Ruby\
    \ code, to use `fork` with a block.\n\nWhen you pass a block to the `fork` method\
    \ that block will be executed in the new child process, while the parent process\
    \ simply skips over it. The child process exits when it's done executing the block.\
    \ It does not continue along the same code path as the parent.\n\n```\nfork do\n\
    \  # Code here is only executed in the child process\nend\n\n# Code here is only\
    \ executed in the parent process.\n```\n\n## In the Real World\n\nHave a look\
    \ at either of the appendices, or the attached Spyglass project, to see some real-world\
    \ examples of using `fork(2)`.\n\n## System Calls\n\nRuby's `Kernel#fork` maps\
    \ to `fork(2)`.\n\n## Orphaned Processes\n\n### Out of Control\n\nYou may have\
    \ noticed when running the examples in the last chapter that when child processes\
    \ are involved, it's no longer possible to control everything from a terminal\
    \ like we're used to.\n\nWhen starting a process via a terminal, we normally have\
    \ only one process writing to `STDOUT`, taking keyboard input, or listening for\
    \ that Ctrl-C telling it to exit.\n\nBut once that process has forked child processes\
    \ that all becomes a little more difficult. When you press Ctrl-C which process\
    \ should exit? All of them? Only the parent?\n\nIt's good to know about this stuff\
    \ because it's actually very easy to create orphaned processes:\n\n```\nfork do\n\
    \  5.times do\n    sleep 1\n    puts \"I'm an orphan!\"\n  end\nend\n\nabort \"\
    Parent process died...\"\n```\n\nIf you run this program from a terminal you'll\
    \ notice that since the parent process dies immediately the terminal returns you\
    \ to the command prompt. At which point, it's overwritten by the `STDOUT` from\
    \ the child process! Strange things can start to happen when forking processes.\n\
    \n### Abandoned Children\n\nWhat happens to a child process when its parent dies?\n\
    \nThe short answer is, `nothing`. That is to say, the operating system doesn't\
    \ treat child processes any differently than any other processes. So, when the\
    \ parent process dies the child process continues on; the parent process does\
    \ not take the child down with it.\n\n### Managing Orphans\n\nCan you still manage\
    \ orphaned processes?\n\nWe're getting a bit ahead of ourselves with this question,\
    \ but it touches on two interesting concepts.\n\nThe first is something called\
    \ daemon processes. Daemon processes are long running processes that are intentionally\
    \ orphaned and meant to stay running forever. These are covered in detail in a\
    \ later chapter.\n\nThe second interesting bit here is communicating with processes\
    \ that are not attached to a terminal session. You can do this using something\
    \ called Unix signals. This is also covered in more detail in a later chapter.\n\
    \nWe'll soon talk about how to properly manage and control child processes.\n\n\
    ## Processes Are Friendly\n\nLet's take a step back from looking at code for a\
    \ minute to talk about a higher level concept and how it's handled in different\
    \ Ruby implementations.\n\n### Being CoW Friendly\n\nAs mentioned in the forking\
    \ chapter, `fork(2)` creates a new child process that's an exact copy of the parent\
    \ process. This includes a copy of everything the parent process has in memory.\n\
    \nPhysically copying all of that data can be considerable overhead, so modern\
    \ Unix systems employ something called copy-on-write semantics (CoW) to combat\
    \ this.\n\nAs you may have guessed from the name, CoW delays the actual copying\
    \ of memory until it needs to be written.\n\nSo a parent process and a child process\
    \ will actually share the same physical data in memory until one of them needs\
    \ to modify it, at which point the memory will be copied so that proper separation\
    \ between the two processes can be preserved.\n\n```\narr = [1,2,3]\n\nfork do\n\
    \  # At this point the child process has been initialized.\n  # Using CoW this\
    \ process doesn't need to copy the arr variable, \n  # since it hasn't modified\
    \ any shared values it can continue reading \n  # from the same memory location\
    \ as the parent process.\n  p arr\nend\n```\n\n```\narr = [1,2,3]\n\nfork do\n\
    \  # At this point the child process has been initialized.\n  # Because of CoW\
    \ the arr variable hasn't been copied yet.\n  arr << 4\n  # The above line of\
    \ code modifies the array, so a copy of\n  # the array will need to be made for\
    \ this process before\n  # it can modify it. The array in the parent process remains\n\
    \  # unchanged.\nend\n```\n\nThis is a big win when using `fork(2)` as it saves\
    \ on resources. It means that `fork(2)` is fast since it doesn't need to copy\
    \ any of the physical memory of the parent. It also means that child processes\
    \ only get a copy of the data they need, the rest can be shared.\n\nCoW is great,\
    \ but unfortunately it's `not supported in MRI or Rubinius`. In order for CoW\
    \ to work properly programs need to be written in a CoW friendly manner. In other\
    \ words, they need to manage memory in a way that makes CoW possible. MRI and\
    \ Rubinius are not written this way.\n\n### Why not?\n\nMRI's garbage collector\
    \ uses a 'mark-and-sweep' algorithm. In a nutshell this means that when the GC\
    \ is invoked it must iterate over every known object and write to it, either saying\
    \ it should be garbage collected or it shouldn't. The important point here is\
    \ that every time the GC runs every object in memory is written to.\n\nSo, after\
    \ forking, the first time that the GC runs will retract the benefit that copy-on-write\
    \ provides.\n\nThis is one of the main reasons why Ruby Enterprise Edition ([http://www.rubyenterpriseedition.com/](http://www.rubyenterpriseedition.com/))\
    \ was created. `ree is CoW friendly`. For a deeper look at this issue and how\
    \ Ruby Enterprise Edition solves it check out their Google Tech Talk: Building\
    \ a Efficient Ruby Interpreter ([http://www.youtube.com/watch?v=ghLCtAwqQ](http://www.youtube.com/watch?v=ghLCtAwqQ)).\n\
    \n### MRI / RBX users\n\nWhat does this mean for users of other Ruby VMs?\n\n\
    Simply, when forking processes you will not reap the benefits of CoW. Child processes\
    \ will require a complete copy of the memory owned by the calling process.\n\n\
    If you're building something that will depend heavily on `fork(2)` then have a\
    \ serious look at Ruby Enterprise Edition. Looking ahead to the future, MRI trunk\
    \ now has patches ([http://bugs.ruby-lang.org/issues/5839](http://bugs.ruby-lang.org/issues/5839))\
    \ that make the GC CoW-friendly. So the 2.0 release of Ruby will ship with a CoW-friendly\
    \ GC!\n\n## Processes Can Wait\n\nIn the examples of fork(2) up until now we have\
    \ let the parent process continue on in parallel with the child process. In some\
    \ cases this led to weird results, such as when the parent process exited before\
    \ the child process.\n\nThat kind of scenario is really only suitable for one\
    \ use case, fire and forget. It's useful when you want a child process to handle\
    \ something asynchronously, but the parent process still has its own work to do.\n"
