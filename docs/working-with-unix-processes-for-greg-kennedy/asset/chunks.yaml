    \ by Kernel#at_exit.\nat_exit { puts 'Last!' }\nexit\n```\n\nwill output:\n\n\
    ```\nLast!\n```\n\n#### exit!\n\n`Kernel#exit!` is almost exactly the same as\
    \ `Kernel#exit`, but with two key differences. The first is that it sets an unsuccessful\
    \ status code by default (1), and the second is that it will not invoke any blocks\
    \ defined using `Kernel#at_exit`.\n\n```\n# This will exit the program with a\
    \ status code 1.\nexit!\n```\n\n```\n# You can still pass an exit code.\nexit!\
    \ 33\n```\n\n```\n# This block will never be invoked.\nat_exit { puts 'Silence!'\
    \ }\nexit!\n```\n\n#### abort\n\n`Kernel#abort` provides a generic way to exit\
    \ a process unsuccessfully. `Kernel#abort` will set the exit code to 1 for the\
    \ current process.\n\n```\n# Will exit with exit code 1.\nabort\n```\n\n```\n\
    # You can pass a message to Kernel#abort. This message will be printed\n# to STDERR\
    \ before the process exits.\nabort \"Something went horribly wrong.\"\n```\n\n\
    ```\n# Kernel#at_exit blocks are invoked when using Kernel#abort.\nat_exit { puts\
    \ 'Last!' }\nabort \"Something went horribly wrong.\"\n```\n\nwill output:\n\n\
    ```\nSomething went horribly wrong.\nLast!\n```\n\n#### raise\n\nA different way\
    \ to end a process is with an unhandled exception. This is something that you\
    \ never want to happen in a production environment, but it's almost always happening\
    \ in development and test environments.\n\nNote that `Kernel#raise`, unlike the\
    \ previous methods, will not exit the process immediately. It simply raises an\
    \ exception that *may* be rescued somewhere up the stack. If the exception is\
    \ not rescued anywhere in the codebase then the unhandled exception will cause\
    \ the process to exit.\n\nEnding a process this way will still invoke any at_exit\
    \ handlers and will print the exception message and backtrace to `STDERR`.\n\n\
    ```\n# Similar to abort, an unhandled exception will set the exit code to 1.\n\
    raise 'hell'\n```\n\n## Processes Can Fork\n\n### Use the fork(2), Luke\n\nForking\
    \ is one of the most powerful concepts in Unix programming. The fork(2) system\
    \ call allows a running process to create new process programmatically. This new\
    \ process is an exact copy of the original process.\n\nUp until now we've talked\
    \ about creating processes by launching them from the terminal. We've also mentioned\
    \ low level operating system processes that create other processes: fork(2) is\
    \ how they do it.\n\nWhen forking, the process that initiates the fork(2) is called\
    \ the \"parent\", and the newly created process is called the \"child\".\n\n**The\
    \ child process inherits a copy of all of the memory in use by the parent process,\
    \ as well as any open file descriptors belonging to the parent process.** Let's\
    \ take a moment to review child processes from the eye of our first three chapters.\n\
    \nSince the child process is an entirely new process, it gets its own unique pid.\n\
    \nThe parent of the child process is, obviously, its parent process. So its ppid\
    \ is set to the pid of the process that initiated the fork(2).\n\nThe child process\
    \ inherits any open file descriptors from the parent at the time of the fork(2).\
    \ It's given the same map of file descriptor numbers that the parent process has.\
    \ In this way the two processes can share open files, sockets, etc.\n\nThe child\
    \ process inherits a copy of everything that the parent process has in main memory.\
    \ In this way a process could load up a large codebase, say a Rails app, that\
    \ occupies 500MB of main memory. Then this process can fork 2 new child processes.\
    \ Each of these child processes would effectively have their own copy of that\
    \ codebase loaded in memory.\n\nThe call to `fork` returns near-instantly so we\
    \ now have 3 processes with each using 500MB of memory. Perfect for when you want\
    \ to have multiple instances of your application loaded in memory at the same\
    \ time. Because only one process needs to load the app and forking is fast, this\
    \ method is faster than loading the app 3 times in separate instances.\n\nThe\
    \ child processes would be free to modify their copy of the memory without affecting\
    \ what the parent process has in memory. See the next chapter for a discussion\
    \ of copy-on-write and how it affects memory when forking.\n\nLet's get started\
    \ with forking in Ruby by looking at a mind-bending example:\n\n```\nif fork\n\
    \  puts \"entered the if block\"\nelse\n  puts \"entered the else block\"\nend\n\
    ```\n\noutputs:\n\n```\nentered the if block\nentered the else block\n```\n\n\
    WTF! What's going on here? A call to the `fork` method has taken the once-familiar\
    \ if construct and turned it on its head. Somehow this piece of code is entering\
    \ both the if and else block of the if construct!\n\nIt's no mystery what's happening\
    \ here. One call to the `fork` method actually returns twice. Remember that `fork`\
    \ creates a new process. So it returns once in the calling process (parent) and\
    \ once in the newly created process (child).\n\nThe last example becomes more\
    \ obvious if we print the pids.\n\n```\nputs \"parent process pid is #{Process.pid}\"\
    \n\nif fork\n  puts \"entered the if block from #{Process.pid}\"\nelse\n  puts\
    \ \"entered the else block from #{Process.pid}\"\nend\n```\n\noutputs:\n\n```\n\
    parent process is 21268\nentered the if block from 21268\nentered the else block\
    \ from 21282\n```\n\nNow it becomes clear that the code in the if block is being\
    \ executed by the parent process, while the code in the else block is being executed\
    \ by the child process. The child process will exit after executing its code in\
    \ the else block, while the parent process will carry on.\n\nAgain, there's a\
    \ rhythm to this beat, and it has to do with the return value of the `fork` method.\
    \ **In the child process `fork` returns `nil`**. Since `nil` is falsy it executes\
    \ the code in the else block.\n\n**In the parent process `fork` returns the pid\
    \ of the newly created child process**. Since an integer is truthy it executes\
    \ the code in the if block.\n\nThis concept is illustrated nicely by simply printing\
    \ the return value of a `fork` call.\n\n```\nputs fork\n```\n\noutputs\n\n```\n\
    21423\nnil\n```\n\nHere we have the two different return values. The first value\
    \ returned is the pid of the newly created child process; this comes from the\
    \ parent. The second return value is the nil from the child process.\n\n### Multicore\
    \ Programming?\n\nIn a roundabout way, yes. By making new processes it means that\
    \ your code is able, but not guaranteed, to be distributed across multiple CPU\
    \ cores."
