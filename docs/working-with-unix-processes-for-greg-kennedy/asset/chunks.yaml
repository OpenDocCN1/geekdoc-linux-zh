  trans: "\n\n```\nmessage = 'Good Morning'\nrecipient = 'tree@mybackyard.com'\n\n\
    fork do\n  # 在这个为了意的示例中，父进程派生出一个子进程来\n  # 负责将数据发送到统计收集器。与此同时，父进程\n  # 继续执行它发送实际负载的工作。\n\
    \n  # 父进程不希望被这项任务拖慢速度，\n  # 即使由于某种原因它失败了也没关系。\n  StatsCollector.record message,\
    \ recipient\nend\n\n# 将消息发送给接收者\n```\n\n### 进程守护 (Babysitting)\n\n对于大多数涉及 `fork(2)`\
    \ 的其他用例，你可能需要某种方法来监控你的子进程。在 Ruby 中，`Process.wait` 提供了这种技术。让我们重写上一章中那个产生孤儿进程的示例，让它的运行少一些意外。\n\
    \n```\nfork do\n  5.times do\n    sleep 1\n    puts \"I am an orphan!\"\n  end\n\
    end\n\nProcess.wait\nabort \"Parent process died...\"\n```\n\n这次的输出看起来像这样：\n\n\
    ```\nI am an orphan!\nI am an orphan!\nI am an orphan!\nI am an orphan!\nI am\
    \ an orphan!\nParent process died...\n```\n\n不仅如此，在所有输出被打印之前，控制权都不会返回给终端。\n\n\
    那么 `Process.wait` 是做什么的？`Process.wait` 是一个阻塞调用，指示父进程在继续执行之前等待其任何一个子进程退出。\n\n###\
    \ Process.wait 及其兄弟方法 (Cousins)\n\n我在上那句话中提到了一个关键点，`Process.wait` 会阻塞，直到它的任何一个子进程退出。如果你有一个父进程正在守护多个子进程，并且你正在使用\
    \ `Process.wait`，你需要知道是哪一个退出了。为了这一点，你可以使用返回值。\n\n`Process.wait` 返回退出子进程的 `pid`。来看一下。\n\
    \n```ruby\n# 我们创建了 3 个子进程。\n3.times do\n  fork do\n    # 每个进程睡眠一个小于 5 秒的随机数。\n\
    \    sleep rand(5)\n  end\nend\n\n3.times do\n  # 我们等待每个子进程退出，并打印返回的 pid。\n  puts\
    \ Process.wait\nend \n```\n\n### 与 Process.wait2 通信\n\n等一下！`Process.wait` 还有一个兄弟方法叫做\
    \ `Process.wait2`！\n\n为什么名字会混淆？一旦你知道 `Process.wait` 返回一个值（`pid`），而 `Process.wait2`\
    \ 返回两个值（`pid`，`status`），它就合情合理了。\n\n这个状态可以通过退出码作为进程之间的通信手段。在关于退出码的章节中，我们提到过可以使用退出码为其他进程编码信息。`Process.wait2`\
    \ 让你直接访问这些信息。\n\n从 `Process.wait2` 返回的 `status` 是 `Process::Status` 的实例。它包含了许多有用信息，用于确定进程究竟是如何退出的。\n\
    \n```ruby\n# 我们创建了 5 个子进程。\n5.times do\n  fork do\n    # 每个进程生成一个随机数。如果是偶数，它们以\n\
    \    # 111 退出码退出，否则使用 112 退出码。\n    if rand(5).even?\n      exit 111\n    else\n\
    \      exit 112\n    end\n  end\nend\n\n5.times do\n  # 我们等待每个子进程退出。\n  pid, status\
    \ = Process.wait2\n\n  # 如果子进程以 111 退出码退出\n  # 那么我们就知道它们遇到了偶数。\n  if status.exitstatus\
    \ == 111\n    puts \"#{pid} 遇到了一个偶数!\"\n  else\n    puts \"#{pid} 了一个奇数!\"\n \
    \ end\nend\n```\n\n不需要通过文件系统或网络的进程间通信！\n\n### 等待特定的子进程\n\n等一下！`Process.wait` 的兄弟方法还有两个兄弟。`Process.waitpid`\
    \ 和 `Process.waitpid2`。\n\n你可能已经猜到了它们的作用。它们的功能与 `Process.wait` 和 `Process.wait2`\
    \ 相同，不同在于，它们不是等待*任何*子进程退出，而是只等待由 `pid` 指定的*特定*子进程退出。\n\n```\nfavourite = fork\
    \ do\n  exit 77\nend\n\nmiddle_child = fork do\n  abort \"I want to be waited\
    \ on!\"\nend\n\npid, status = Process.waitpid2 favourite\nputs status.exitstatus\n\
    ```\n\n尽管 `Process.wait` 和 `Process.waitpid` 看起来提供了不同的行为，但不要被骗了！它们实际上是相同内容的别名（alias）。两者都接受相同的参数并且行为相同。\n\
    \n你可以将 `pid` 传递给 `Process.wait` 以使其等待*特定*的子进程，也可以将 `-1` 作为 `pid` 传递给 `Process.waitpid`\
    \ 以使其等待*任何*子进程。\n\n`Process.wait2` 和 `Process.waitpid2` 也是如此。\n\n就像 `Process.pid`\
    \ 与 `$$` 的关系一样，我认为作为程序员，尽可能使用提供的工具来揭示我们的意图是非常重要的。尽管这些方法是相同的，但在你等待任何子进程时，应该使用 `Process.wait`，而在你等待特定进程时，应该使用\
    \ `Process.waitpid`。\n\n### 竞态条件 (Race Conditions)\n\n当你查看这些简单的代码示例时，你可能会开始思考竞态条件。\n\
    \n如果父进程处理得很慢会怎么样？让我们来看看：\n\n```ruby\n# 我们创建了两个子进程。\n2.times do\n  fork do\n  \
    \  # 进程立即退出。\n    abort \"Finished!\"\n  end\nend\n\n# 父进程等待第一个进程，然后睡眠 5 秒。\n\
    # 在期间，子进程已经退出且不再运行。\nputs Process.wait\nsleep 5\n\n# 父进程再次请求等待，神奇的是，进程已经退出了。\n\
    puts Process.wait\n```\n\n你可以看到，这种技术是不存在竞态条件的。内核缓存了已退出进程的信息，因此父进程总是可以获取它。\n\n\
    所以即使父进程处理每个子进程很慢，它也能准备准备时获取信息。\n\n注意，在没有子进程的情况下调用 `Process.wait` 的任何变体都会抛出 `Errno::ECHILD`。跟踪你创建了多少子进程是一个好习惯。\n\
    \n### 现实世界\n\n监控子进程的思想是常见 Unix 模式的核心。这种模式有时被称为进程守护（babysitting）、主/工作模式或预派生（preforking）。\n\
    \n这种模式的核心在于，你有一个进程派生了多个子进程来实现并发，然后花费时间照顾它们：确保它们保持响应，并在任何一个进程退出时做出反应等。\n\n例如，Unicorn\
    \ Web 服务器 ([`unicorn.bogomips.org`](http://unicorn.bogomips.org)) 就采用了这种模式。你告诉它希望它启动多少工作进程，例如\
    \ 5 个。\n\n然后一个 `unicorn` 进程将启动并派生 5 个子进程来处理请求。父进程（或主进程）与每个子进程保持心跳，并确保所有子进程保持响应。\n\
    \n这种模式兼顾了并发性和可靠性。关于 Unicorn 的更多信息请参见附录。\n\n关于该技术的替代用法，请阅读附件 Spyglass 项目中的 `Lookout`\
    \ 类。\n\n### 系统调用\n\nRuby 的 `Process.wait` 及其兄弟方法映射到 `waitpid(2)`。\n\n## 僵尸进程 (Zombie\
    \ Processes)\n\n在上章开头，我们看了一个使用子进程异步处理任务的示例。我们需要回顾这个示例，并确保妥善地清理该子进程，以免它变成僵尸！\n\n\
    ### 等待(2)的人会有好报\n\n在上一章中，我展示了内核会缓存已退出子进程的状态。因此，即使你在子进程退出很久后才调用 `Process.wait`，它的状态仍然可用。我确定你已经闻到了这里的问题了……\n\
    \n"
- fmt: "\nThe kernel will retain the status of exited child processes until the parent\
    \ process requests that status using `Process.wait`. If the parent never requests\
    \ the status then the kernel can never reap that status information. So creating\
    \ fire and forget child processes without collecting their status information\
    \ is a poor use of kernel resources.\n\nIf you're not going to wait for a child\
    \ process to exit using `Process.wait` (or the technique described in the next\
    \ chapter) then you need to 'detach' that child process. Here's the fire and forget\
    \ example from last chapter rectified to properly detach the child process:\n\n\
    ```\nmessage = 'Good Morning'\nrecipient = 'tree@mybackyard.com'\n\npid = fork\
    \ do\n  # In this contrived example the parent process forks a child to take\n\
    \  # care of sending data to the stats collector. Meanwhile the parent\n  # process\
    \ has continued on with its work of sending the actual payload.\n\n  # The parent\
    \ process doesn't want to be slowed down with this task, and\n  # it doesn't matter\
    \ if this would fail for some reason.\n  StatsCollector.record message, recipient\n\
    end\n\n# This line ensures that the process performing the stats collection\n\
    # won't become a zombie.\nProcess.detach(pid)\n```\n\nWhat does `Process.detach`\
    \ do? It simply spawns a new thread whose sole job is to wait for the child process\
    \ specified by `pid` to exit. This ensures that the kernel doesn't hang on to\
    \ any status information we don't need.\n\n### What Do Zombies Look Like?\n\n\
    ```\n# Create a child process that exits after 1 second.\npid = fork { sleep 1\
    \ }\n# Print its pid.\nputs pid\n# Put the parent process to sleep indefinitely\
    \ so we can inspect the \n# process status of the child\nsleep\n```\n\nRunning\
    \ the following command at a terminal, using the pid printed from the last snippet,\
    \ will print the status of that zombie process. The status should say 'z' or 'Z+',\
    \ meaning that the process is a zombie.\n\n```\nps -ho pid,state -p [pid of zombie\
    \ process]\n```\n\n### In The Real World\n\nNotice that any dead process whose\
    \ status hasn't been waited on is a zombie process. So *every* child process that\
    \ dies while its parent is still active will be a zombie, if only for a short\
    \ time. Once the parent process collects the status from the zombie then it effectively\
    \ disappears, no longer consuming kernel resources.\n\nIt's fairly uncommon to\
    \ fork child processes in a fire and forget manner, never collecting their status.\
    \ If work needs to be offloaded in the background it's much more common to do\
    \ that with a dedicated background queueing system.\n\nThat being said there is\
    \ a Rubygem called `spawn` ([https://github.com/tra/spawn](https://github.com/tra/spawn))\
    \ that provides this exact functionality. Besides providing a generic API over\
    \ processes or threads, it ensures that fire and forget processes are properly\
    \ detached.\n\n### System Calls\n\nThere's no system call for `Process.detach`\
    \ because it's implemented in Ruby simply as a thread and `Process.wait`. The\
    \ implementation in Rubinius ([https://github.com/rubinius/rubinius/blob/c6e8e33b37601d4a082ddcbbd60a568767074771/kernel/common/process.rb#L377-395](https://github.com/rubinius/rubinius/blob/c6e8e33b37601d4a082ddcbbd60a568767074771/kernel/common/process.rb#L377-395))\
    \ is stark in its simplicity.\n\n## Processes Can Get Signals\n\nIn the last chapter\
    \ we looked at `Process.wait`. It provides a nice way for a parent process to\
    \ keep tabs on its child processes. However it is a blocking call: it will not\
    \ return until a child process dies.\n\nWhat's a busy parent to do? Not every\
    \ parent has the luxury of waiting around on their children all day. There is\
    \ a solution for the busy parent! And it's our introduction to Unix signals.\n\
    \n### Trapping SIGCHLD\n\nLet's take a simple example from the last chapter and\
    \ rewrite it for a busy parent process.\n\n```\nchild_processes = 3\ndead_processes\
    \ = 0\n# We fork 3 child processes.\nchild_processes.times do\n  fork do\n   \
    \ # They sleep for 3 seconds.\n    sleep 3\n  end\nend\n\n# Our parent process\
    \ will be busy doing some intense mathematics.\n# But still wants to know when\
    \ one of its children exits.\n\n# By trapping the :CHLD signal our process will\
    \ be notified by the kernel\n# when one of its children exits.\ntrap(:CHLD) do\n\
    \  # Since Process.wait queues up any data that it has for us we can ask for it\n\
    \  # here, since we know that one of our child processes has exited.\n\n  puts\
    \ Process.wait\n  dead_processes += 1\n  # We exit explicitly once all the child\
    \ processes are accounted for.\n  exit if dead_processes == child_processes\n\
    end\n\n# Work it.\nloop do\n  (Math.sqrt(rand(44)) ** 8).floor\n  sleep 1\nend\n\
    ```\n\n### SIGCHLD and Concurrency\n\nBefore we go on I must mention a caveat.\
    \ **Signal delivery is unreliable**. By this I mean that if your code is handling\
    \ a CHLD signal while another child process dies you *may or may not receive a\
    \ second CHLD signal*.\n\nThis can be lead to inconsistent results with the code\
    \ snippet above. Sometimes timing will be such that things work perfectly, and\
    \ sometimes you'll 'miss' an instance of child dying.\n\nTo properly handle CHLD\
    \ you must call `Process.wait` in a loop. Since signals might arrive at any time\
    \ it's possible for the last CHLD signal to arrive after the previous CHLD handler\
    \ has already called `Process.wait` twice and gotten the last available status.\
    \ This asynchronous stuff can be mind-bending. *Any* line of code can be interrupted\
    \ with a signal. You've been warned!\n\nOne more thing to remember is that `Process.wait`,\
    \ even this variant, will raise `Errno::ECHILD` if no child processes exist. Since\
    \ signals might arrive at any time it's possible for the last CHLD signal to arrive\
    \ after the previous CHLD handler has already called `Process.wait` twice and\
    \ gotten the last available status. This asynchronous stuff can be mind-bending.\
    \ *Any* line of code can be interrupted with a signal. You've been warned!\n\n\
