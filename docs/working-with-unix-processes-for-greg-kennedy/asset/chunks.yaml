  trans: "\n如果你在 `irb` 会话中运行该代码，那么这两个值将是相等。通常，进程组 ID 会与进程组组长的 `pid` 相同。进程组组长是终端命令的“源头”进程。也就是说，如果你在终端启动一个\
    \ `irb` 进程，它将成为新进程组的组长。它创建的任何子进程将成为同一个进程组的一部分。\n\n尝试以下示例来观察进程组是如何继承的。\n\n```\n\
    puts Process.pid\nputs Process.getpgrp\n\nfork { \n  puts Process.pid\n  puts\
    \ Process.getpgrp\n}\n```\n\n你可以看到，尽管子进程获得了一个唯一的 `pid`，但它从父进程那里继承了组 ID。因此，这两个进程属于同一个组。\n\
    \n你可能还记得我们之前看过孤儿进程（Orphaned Processes）。在那个章节我说过内核不会对子进程进行特殊对待。父进程退出后，子进程将继续运行。这是父进程退出时的行为，但当父进程受终端控制并被信号杀死时，行为会有所不同。\n\
    \n考虑这种情况：一个 Ruby 脚本调用了一个长时间运行的 shell 命令，例如一个长时备份脚本。如果你用 `Ctrl-C` 杀死 Ruby 脚本会发生什么？\n\
    \n如果你尝试这样做，你会发现长时间运行的备份脚本并不是孤儿，它在父进程杀死后并没有继续运行。我们没有编写任何代码将信号从父进程转发到子进程，那么它是如何实现的呢？\n\
    \n终端接收信号并将其转发给前景进程组中的任何进程。在这种情况下，Ruby 脚本和长时间运行的 shell 命令都属于同一个进程组，因此它们会被同一个信号杀死。\n\
    \n## 会话组 (Session Groups)\n\n会话组是更高一级的抽象，是进程组的集合。考虑以下 shell 命令：\n\n```\ngit log\
    \ | grep shipped | less\n```\n\n在这种情况下，每个命令将获得它自己的进程组，因为每个命令都可能创建子进程，但没有一个是另一个的子进程。尽管这些命令不属于同一个进程组，一个\
    \ `Ctrl-C` 也会杀死它们所有的。\n\n这些命令属于同一个会话组。 shell 的每次调用都会获得它自己的会话组。一次调用可以是单个命令，也可以是由管道连接的一系列命令字符串。\n\
    \n就像上面的示例一样，会话组可以附加到终端。它也可以不附加到任何终端，例如守护进程（daemon）的情况。\n\n再次，你的终端以特殊方式处理会话组：向会话头发送信号会将该信号转发给该会话中的所有进程组，而这些进程组又将其转发给这些进程组中的所有进程。层层嵌套\
    \ ;)\n\n有一个用于获取当前会话组 ID 的系统调用 `getsid(2)`，但 Ruby 的核心库没有它的接口。使用 `Process.setsid`\
    \ 会返回它创建的新会话组的 ID，如果你需要，可以存储该 ID。\n\n回到我们的 Rack 示例，在第一行中 fork 了子进程，父进程退出。源终端识别到了退出并将控制权交给用户，但\
    \ fork 进程仍然拥有从自的组 ID 和会话 ID。此时，这个 fork 进程既不是会话头也不是组长。\n\n因此终端仍然与我们的 fork 进程有链接，如果它向会话组发送信号，fork\
    \ 进程就会收到，但我们希望完全脱离终端。\n\n`Process.setsid` 将此 fork 进程变为新进程组和新会话组的头。请注意，`Process.setsid`\
    \ 在已经是进程组头的进程中会失败，它只能从子进程中运行。\n\n这个新的会话组没有控制终端，但技术上可以分配一个。\n\n```\nexit if fork\n\
    ```\n\n刚刚成为进程组和会话组头的 fork 进程再次进行 fork，然后退出。\n\n这个新 fork 的进程不再是进程组头，不再是会话头。由于之前的会话头没有控制终端，且这个进程不是会话头，可以保证这个进程永远不会拥有控制终端。终端只能分配给会话头。\n\
    \n这番“华尔兹之舞”确保了我们的进程现在已完全脱离了控制终端，并将运行到完成。\n\n```\nDir.chdir \"/\" \n```\n\n这把当前工作目录更改为系统的根目录。这并非必须，但这是一个额外的步骤，以确保守护进程的当前工作目录在执行期间不会消失。\n\
    \n这避免了由于任何原因启动守护进程的目录被删除或卸载而导致的问题。\n\n```\nSTDIN.reopen \"/dev/null\"\nSTDOUT.reopen\
    \ \"/dev/null\", \"a\" \nSTDERR.reopen \"/dev/null\", \"a\" \n```\n\n这设置了所有标准流都指向\
    \ `/dev/null`，即被忽略。由于守护进程不再附加到终端会话，这些流本身没有任何用处。它们不能简单地关闭，因为某些程序期望它们始终可用。通过将它们重定向到\
    \ `/dev/null` 确保了它们对程序仍然可用，但没有影响。\n\n### 在现实世界中\n\n如所述，`rackup` 命令带有一个用于将进程守护化的命令行选项。任何流行的\
    \ Ruby Web 服务器也是如此。\n\n如果你想深入研究守护进程的更多内部机制，你应该查看守护进程（daemon processes）。\n\n##\
    \ 启动终端进程 (Spawning Terminal Processes)\n\nRuby 程序中常见的交互是从程序“壳出”（shell out）来运行终端命令。这尤其发生在我编写\
    \ Ruby 脚本来组合某些命令时。有多种方法可以在 Ruby 中启动进程来运行终端命令。\n\n在查看不同的“壳出”方法之前，让我们看看它们底层使用的机制。\n\
    \n### fork + exec\n\n下面描述的所有方法都是一个主题的变体：`fork` + `exec`。\n\n我们在之前的章节中已经很好地看了 `fork(2)`，但这是我们第一次查看\
    \ `exec(2)`。它非常简单，`exec(2)` 允许用另一个进程替换当前进程。\n\n换句话说：`exec(2)` 允许你将当前进程转换为任何其他进程。你可以将一个\
    \ Ruby 进程转换为 Python 进程，或者 `ls(1)` 进程，或者另一个 Ruby 进程。\n\n`exec(2)` 转换进程且不返回。一旦你将你的\
    \ Ruby 进程转换为其他内容，你就永远无法回来了。\n\n```\nexec 'ls', '--help'\n```\n"
- fmt: "\nIf your program depends on the output from the `exec(2)` call you can use\
    \ the tools you learned in previous chapters to handle that. `Process.wait` will\
    \ ensure that your program waits for the child process to finish whatever it's\
    \ doing so you can get the result back.\n\nKeep in mind that `exec(2)` doesn't\
    \ close any open file descriptors (by default) or do any memory cleanup. You can\
    \ use this to your advantage in certain situations. In other situations it may\
    \ cause problems with resource usage.\n\n```ruby\nhosts = File.open('/etc/hosts')\n\
    \nexec 'python', '-c', \"import os; print os.fdopen(#{hosts.fileno}).read()\"\n\
    ```\n\nIn this example we start up a Ruby program and open the `/etc/hosts` file.\
    \ Then we `exec(2)` a `python` process and tell it to open the file descriptor\
    \ number that Ruby received for opening the `/etc/hosts` file. You can see that\
    \ `python` recognizes this file descriptor (because it was shared via `exec(2)`)\
    \ and is able to read from it without having to open the file again.\n\n## Arguments\
    \ to `exec`\n\nNotice in all of the examples above I sent an array of arguments\
