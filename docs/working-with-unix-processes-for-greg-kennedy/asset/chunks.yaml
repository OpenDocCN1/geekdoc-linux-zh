    \ see:\n\n```\n# We create two child processes.\n2.times do\n  fork do\n    #\
    \ Both processes exit immediately.\n    abort \"Finished!\"\n  end\nend\n\n# The\
    \ parent process waits for the first process, then sleeps for 5 seconds. \n# In\
    \ the meantime the second child process has exited and is no \n# longer running.\n\
    puts Process.wait\nsleep 5\n\n# The parent process asks to wait once again, and\
    \ amazingly enough, the second\n# process' exit information has been queued up\
    \ and is returned here.\nputs Process.wait\n```\n\nAs you can see this technique\
    \ is free from race conditions. The kernel queues up information about exited\
    \ processes so that the parent always receives the information in the order that\
    \ the children exited.\n\nSo even if the parent is slow at processing each exited\
    \ child it will always be able to get the information for each exited child when\
    \ it's ready for it.\n\nTake note that calling any variant of `Process.wait` when\
    \ there are no child processes will raise `Errno::ECHILD`. It's always a good\
    \ idea to keep track of how many child processes you have created so you don't\
    \ encounter this exception.\n\n### In the Real World\n\nThe idea of looking in\
    \ on your child processes is at the core of a common Unix programming pattern.\
    \ The pattern is sometimes called babysitting processes, master/worker, or preforking.\n\
    \nAt the core of this pattern is the concept that you have one process that forks\
    \ several child processes, for concurrency, and then spends its time looking after\
    \ them: making sure they are still responsive, reacting if any of them exit, etc.\n\
    \nFor example, the Unicorn web server ([http://unicorn.bogomips.org](http://unicorn.bogomips.org))\
    \ employs this pattern. You tell it how many worker processes you want it to start\
    \ up for you, 5 for instance.\n\nThen a `unicorn` process will boot up that will\
    \ `fork` 5 child processes to handle web requests. The parent (or master) process\
    \ maintains a heartbeat with each child and ensures that all of the child processes\
    \ stay responsive.\n\nThis pattern allows for both concurrency and reliability.\
    \ Read more about Unicorn in its Appendix at the end of the book.\n\nFor an alternative\
    \ usage of this technique read through the Lookout class in the attached Spyglass\
    \ project.\n\n### System Calls\n\nRuby's `Process.wait` and cousins map to waitpid(2).\n\
    \n## Zombie Processes\n\nAt the beginning of the last chapter we looked at an\
    \ example that used a child process to asynchronously handle a task in a fire\
    \ and forget manner. We need to revisit that example and ensure that we clean\
    \ up that child process appropriately, lest it become a zombie!\n\n### Good Things\
    \ Come to Those Who wait(2)\n\nIn the last chapter I showed that the kernel queues\
    \ up status information about child processes that have exited. So even if you\
    \ call `Process.wait` long after the child process has exited its status information\
    \ is still available. I'm sure you can smell a problem here..."
