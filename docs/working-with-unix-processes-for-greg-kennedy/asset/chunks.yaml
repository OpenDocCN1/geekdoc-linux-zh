  trans: "\n内核将保留已退出子进程的状态，直到父进程使用 `Process.wait` 请求该状态。如果父进程从未请求过状态，内核就永远无法回收该状态信息。因此，创建“发后置不管”的子进程而不收集它们的状态信息，是对内核资源的糟糕利用。\n\
    \n如果你不打算使用 `Process.wait` 等待子进程退出（或下一章中描述的技术），那么你就需要“分离”（detach）该子进程。以下是对上一章中“发后置不管”示例的修正，以正确地分离子进程：\n\
    \n```\nmessage = 'Good Morning'\nrecipient = 'tree@mybackyard.com'\n\npid = fork\
    \ do\n  # 在这个刻意的示例中，父进程派生了一个子进程来负责\n  # 将数据发送给统计收集器。与此同时，父进程\n  # 继续执行发送实际负载的工作。\n\
    \n  # 父进程不想被这项任务拖慢速度，\n  # 即使它因为某种原因失败也无所谓。\n  StatsCollector.record message,\
    \ recipient\nend\n\n# 这行确保执行统计收集的进程\n# 不会变成僵尸。\nProcess.detach(pid)\n```\n\n`Process.detach`\
    \ 做了什么？它仅仅启动了一个新线程，其唯一工作是等待指定的 `pid` 的子进程退出。这确保了内核不会保留我们不需要任何状态信息。\n\n### 僵尸进程看起来是什么样？\n\
    \n```\n# 创建一个 1 秒后退出的子进程。\npid = fork { sleep 1 }\n# 打印它的 pid。\nputs pid\n# 让父进程无限睡眠，以便我们可以检查\n\
    # 子进程的状态。\nsleep\n```\n\n在终端中运行以下命令（使用上一个片段打印的 pid），将打印该僵尸进程的状态。状态应该显示为 'z' 或\
    \ 'Z+'，意味着该进程是一个僵尸。\n\n```\nps -ho pid,state -p [zombie process pid]\n```\n\n\
    ### 在现实世界中\n\n注意，任何状态未被等待的死亡进程都是僵尸进程。因此，*每一个*在父进程仍然活跃时死亡的子进程都会成为僵尸，即使只是很短时间。一旦父进程从僵尸那里收集了状态，它就会有效地消失，不再消耗内核资源。\n\
    \n在现实世界中，以“发后置不管”的方式派生子进程且从不收集状态的情况并不常见。如果需要在后台卸载工作，通常做法是使用专门的后台队列系统。\n\n尽管如此，有一个名为\
    \ `spawn` 的 RubyGem（[`github.com/tra/spawn`](https://github.com/tra/spawn)）提供了完全的功能。除了提供进程或线程的通用\
    \ API 外，它还确保了“发后置不管”的进程被正确分离。\n\n### 系统调用\n\n`Process.detach` 没有系统调用，因为它在 Ruby\
    \ 中只是简单地实现为线程和 `Process.wait`。Rubinius 中的实现方式（[`github.com/rubinius/rubinius/blob/c6e8e33b37601d4a082ddcbbd60a568767074771/kernel/common/process.rb#L377-395`](https://github.com/rubinius/rubinius/blob/c6e8e33b37601d4a082ddcbbd60a568767074771/kernel/common/process.rb#L377-395)）极其简单。\n\
    \n## 进程可以接收信号\n\n在上一章中，我们查看了 `Process.wait`。它为父进程监控其子进程提供了一种很好的方法。然而，这是一个阻塞调用：在子进程死亡之前，它不会返回。\n\
    \n忙碌的父进程怎么办？并不是每个父进程都有奢侈整天等孩子。忙碌的父进程有一个解决方案！这就是我们对 Unix 信号的介绍。\n\n### 捕获 SIGCHLD\n\
    \n让我们从上一章取一个简单的示例并为忙碌的父进程重写它。\n\n```\nchild_processes = 3\ndead_processes = 0\n\
    # 我们派生了 3 个子进程。\nchild_processes.times do\n  fork do\n    # 它们睡眠 3 秒。\n    sleep\
    \ 3\n  end\nend\n\n# 我们的父进程将忙于某些数学计算。\n# 但仍然想知道一个孩子何时退出。\n\n# 通过捕获 :CHLD 信号，我们的进程将在一个子进程退出\n\
    # 时收到内核的通知。\ntrap(:CHLD) do\n  # 因为 Process.wait 会为我们排队任何可用数据，我们可以在\n  # 这里请求它，因为我们知道其中一个子进程已经退出了。\n\
    \n  puts Process.wait\n  dead_processes += 1\n  # 一旦统计了所有子进程，我们就显式退出。\n  exit\
    \ if dead_processes == child_processes\nend\n\n# 运行它。\nloop do\n  (Math.sqrt(rand(44))\
    \ ** 8).floor\n  sleep 1\nend\n```\n\n### SIGCHLD 与并发\n\n在继续之前，我必须提到一个注意事项。**信号传递是不可靠的**。我的意思是，如果你的代码在处理\
    \ CHLD 信号的同时另一个子进程死亡了，你*可能接收也可能不到第二个 CHLD 信号*。\n\n这会导致上述代码片段产生不一致的结果。有时时机恰好一切运行完美，有时你会“错过”进程死亡的实例。\n\
    \n要正确处理 CHLD，你必须在循环中调用 `Process.wait`。由于信号可能在任何时候到达，最后一个 CHLD 信号可能会在处理器已经调用了两次\
    \ `Process.wait` 并获取了最后的可用状态之后到达。\n"
- fmt: "\nSo you must handle the `Errno::ECHILD` exception in your `CHLD` signal handler.\
    \ Also if you don't know how many child processes you are waiting on you should\
    \ rescue that exception and handle it properly.\n\n### Signals Primer\n\nThis\
    \ was our first foray to Unix signals. Signals are asynchronous communication.\
    \ When a process receives a signal from the kernel it can do one of the following:\n\
    \n1. ignore the signal\n2. perform a specified action\n3. perform the default\
    \ action\n\n### Where do Signals Come From?\n\nTechnically signals are sent by\
    \ the kernel, just like text messages are sent by a cell phone carrier. But text\
    \ messages have an original sender, and so do signals. Signals are sent from one\
    \ process to another process, using the kernel as a middleman.\n\nThe original\
    \ purpose of signals was to specify different ways that a process should be killed.\
    \ Let's start there.\n\nLet's start up two ruby programs and we'll use one to\
    \ kill the other.\n\nFor these examples we won't use `irb` because it defines\
    \ its own signal handlers that get in the way of our demonstrations. Instead we'll\
    \ just use the `ruby` program itself.\n\nGive this a try: launch the `ruby` program\
    \ without any arguments. Enter some code. Hit Ctrl-D.\n\nThis executes the code\
    \ that you entered and then exits.\n\nStart up two `ruby` processes using the\
    \ technique mentioned above and we'll kill one of them using a signal.\n\n1. In\
    \ the first `ruby` session execute the following code:\n\n```\nputs Process.pid\n\
    sleep # so that we have time to send it a signal\n```\n\n2. In the second `ruby`\
    \ session issue the following command to kill the first session with a signal:\n\
    \n```\nProcess.kill(:INT, <pid of first session>)\n```\n\nSo the second process\
    \ sent an \"INT\" signal to the first process, causing it to exit. \"INT\" is\
    \ short for \"INTERRUPT\".\n\nThe system default when a process receives this\
    \ signal is that it should interrupt whatever it's doing and exit immediately.\n\
    \n### The Big Picture\n\nBelow is a table showing signals commonly supported on\
    \ Unix systems. Every Unix process will be able to respond to these signals and\
    \ any signal can be sent to any process.\n\nWhen naming signals the `SIG` portion\
    \ of the name is optional. The Action column in the table describes the default\
    \ action for each signal:\n\n**Term**: means that the process will terminate immediately\n\
    **Core**: means that the process will terminate immediately and dump core (stack\
    \ trace)\n**Ign**: means that the process will ignore the signal\n**Stop**: means\
    \ that the process will stop (ie pause)\n**Cont**: means that the process will\
    \ resume (ie unpause)\n\n```\nSignal   Value     Action   Comment\n-------------------------------------------------------------------------\n\
    SIGHUP      1       Term    Hangup detected on controlling terminal \n       \
    \                                 or death of controlling process\nSIGINT    \
    \  2       Term    Interrupt from keyboard\nSIGQUIT     3       Core    Quit from\
    \ keyboard\nSIGILL          4       Core    Illegal Instruction\nSIGABRT     \
    \    6       Core    Abort signal from abort(3)\nSIGFPE          8       Core\
    \    Floating point exception\nSIGKILL         9       Term    Kill signal\nSIGSEGV\
    \        11       Core    Invalid memory reference\nSIGPIPE        13       Term\
    \    Broken pipe: write to pipe with no readers\nSIGALRM        14       Term\
    \    Timer signal from alarm(2)\nSIGTERM        15       Term    Termination signal\n\
    SIGUSR1     30,10,16    Term    User-defined signal 1\nSIGUSR2     31,12,17  \
    \  Term    User-defined signal 2\nSIGCHLD     20,17,18    Ign     Child stopped\
    \ or terminated\nSIGCONT     19,18,25    Cont    Continue if stopped\nSIGSTOP\
    \     17,19,23    Stop    Stop process\nSIGTSTP     18,20,24    Stop    Stop typed\
    \ at tty\nSIGTTIN     21,21,26    Stop    tty input for background process\nSIGTTOU\
    \     22,22,27    Stop    tty output for background process\n```\n\nThe signals\
    \ `SIGKILL` and `SIGSTOP` cannot be trapped, blocked, or ignored.\n\nThis table\
    \ might seem a bit out of left field, but it gives you a rough idea of what to\
    \ expect when you send a certain signal to a process. You can see that, by default,\
    \ most of the signals terminate a process.\n\nIt's interesting to note the `SIGUSR1`\
    \ and `SIGUSR2` signals. These are signals whose action is meant specifically\
    \ to be defined by your process. We'll see shortly that we're free to redefine\
    \ any of the signal actions that we please, but those two signals are meant for\
    \ your use.\n\n### Redefining Signals\n\nLet's go back to our two `ruby` sessions\
    \ and have some fun.\n\n1. In the first `ruby` session use the following code\
    \ to redefine the behaviour of the `INT` signal:\n\n```\nputs Process.pid\ntrap(:INT)\
    \ { print \"Na na na, you can't get me\" }\nsleep # so that we have time to send\
    \ it a signal\n```\n\nNow our process won't exit when it receives the `INT` signal.\n\
    \n2. In the second `ruby` session issue the following command and notice that\
    \ the first process is taunting us!\n\n```\nProcess.kill(:INT, <pid of first session>)\n\
    ```\n\n3. You can try using Ctrl-C to kill that first session, and notice that\
    \ it responds the same!\n\n4. But as the table said there are signals that cannot\
    \ be redefined. `SIGKILL` will show who's boss.\n\n```\nProcess.kill(:KILL, <pid\
    \ of first session>)\n```\n\n### Ignoring Signals\n\n1. In the first `ruby` session\
    \ use the following code:\n\n```\nputs Process.pid\ntrap(:INT, \"IGNORE\")\nsleep\
    \ # so that we have time to send it a signal\n```\n\n2. In the second `ruby` session\
    \ issue the following command and notice that the first process is unaffected.\n\
    \n```\nProcess.kill(:INT, <pid of first session>)\n```\n\n### Signal Handlers\
    \ are Global\n\nSignals are a great tool and are the perfect fit for certain situations.\
    \ But it's good to keep in mind that trapping a signal is a bit like using a global\
    \ variable, you might be overwriting something that other code depends on. Unlike\
    \ global variables signal handlers can't be namespaced.\n\n### Being Nice about\
    \ Redefining Signals\n\nThere is a way to preserve handlers defined by other code,\
    \ so that your signal handler won't trample any ones ones. It looks something\
    \ like this:\n\n```\ntrap(:INT) { puts 'This is the first signal handler' }\n\n\
    old_handler = trap(:INT) {\n  old_handler.call\n  puts 'This is the second handler'\n\
    \  exit\n}\nsleep # so that we have time to send it a signal\n```\n\nJust send\
    \ it a Ctrl-C to see the effect. Both signal handlers are called.\n\nNow let's\
    \ see if we can preserve the system default behaviour. Hit the code below with\
    \ Ctrl-C.\n\n```\nsystem_handler = trap(:INT) {\n  puts 'about to exit!'\n  system_handler.call\n\
    }\nsleep # so that we have time to send it a signal\n```\n\n:/ So we can't preserve\
    \ the system default behaviour with this technique, but we can preserve other\
    \ Ruby code handlers that have been defined. In terms of best practices your code\
    \ probably shouldn't define any signal handlers, unless it's a server. As in a\
    \ long-running process that's booted from the command line. It's very rare that\
    \ library code should trap a signal.\n\n```\n# The 'friendly' method of trapping\
    \ a signal.\n\nold_handler = trap(:QUIT) {\n  # do some cleanup\n  puts 'All done!'\n\
    \n  old_handler.call if old_handler.respond_to?(:call)\n}\n```\n\nThis handler\
    \ for the QUIT signal will preserve any previous QUIT handlers that have been\
    \ defined. Though this looks 'friendly' it's not generally a good idea. Imagine\
    \ a scenario where a Ruby server tells its users they can send it a QUIT signal\
    \ and it will do a graceful shutdown. You tell the users of your library that\
    \ they can send a QUIT signal and it will draw an ASCII rainbow. Now if a user\
    \ sends the QUIT signal both handlers will be invoked. This violates the expectations\
    \ of both libraries.\n"
