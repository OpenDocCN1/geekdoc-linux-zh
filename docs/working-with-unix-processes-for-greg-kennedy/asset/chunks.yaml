    \ Redirecting them to `/dev/null` ensures that they're still available to the\
    \ program but have no effect.\n\n### In the Real World\n\nAs mentioned, the `rackup`\
    \ command ships with a command line option for daemonizing the process. Same goes\
    \ with any of the popular Ruby web servers.\n\nIf you want to dig in to more internals\
    \ of daemon processes you should look at the `daemons` rubygem ([http://rubygems.org/gems/daemons](http://rubygems.org/gems/daemons)).\n\
    \nIf you think you want to create a daemon process you should ask yourself one\
    \ basic question: Does this process need to stay responsive forever?\n\nIf the\
    \ answer is no then you probably want to look at a cron job or background job\
    \ system. If the answer is yes, then you probably have a good candidate for a\
    \ daemon process.\n\n### System Calls\n\nRuby's `Process.setsid` maps to setsid(2),\
    \ `Process.getpgrp` maps to getpgrp(2). Other system calls mentioned in this chapter\
    \ were covered in detail in previous chapters.\n\n## Spawning Terminal Processes\n\
    \nA common interaction in a Ruby program is 'shelling out' from your program to\
    \ run a command in a terminal. This happens especially when I'm writing a Ruby\
    \ script to glue together some common commands for myself. There are several ways\
