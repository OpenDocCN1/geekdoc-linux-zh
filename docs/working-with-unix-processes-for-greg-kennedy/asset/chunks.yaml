    ## 更新


    * 2011 年 12 月 20 日 - 第一个发布版本

    * 2011 年 12 月 21 日 - 拼写错误

    * 2011 年 12 月 23 日 - `Process.setsid` 的说明

    * 2011 年 12 月 27 日 - 关于 `SIGCHLD` 和并发的章节

    * 2011 年 12 月 27 日 - 关于重新定义“默认”信号处理程序的说明

    * 2011 年 12 月 28 日 - 拼写错误

    * 2011 年 12 月 31 日 - 关于使用 `Kernel.raise` 异常出的澄清；关于在块中使用 `fork` 的章节；更多拼写错误；关于 `getsid(2)`
    的说明

    * 2012 年 1 月 13 日 - 改进了代码高亮。改进了电子阅读器格式。

    * 2012 年 2 月 1 日 - 新封面。

    * 2012 年 2 月 7 日 - 新章节：僵尸进程、环境变量、预分叉服务器、spyglass 项目。关于 MRI 中 CoW（写时复制）友好性的澄清。添加了关于
    `IO.popen` 和 `Open3` 的章节。

    * 2012 年 2 月 13 日 - `Process::WNOHANG` 和文件描述符关系的澄清。

    * 2012 年 3 月 13 日 - 包含 TXT 格式。

    * 2012 年 3 月 29 日 - 格式调整与勘误。

    * 2012 年 4 月 20 日 - 新章节：ARGV 和 IPC。

    * 2012 年 5 月 15 日 - 关于信号处理程序中重入性的澄清。

    * 2012 年 6 月 12 日 - 关于 rlimits 的新章节；许多格式/语法更新。


    ## 引言


    在我成长过程中，只要有机会我就会坐在电脑前。并不是因为我正在编程，而是因为我被这台神奇机器可以实现的功能所着迷。我是作为一个使用 ICQ、Winamp 和
    Napster 的电脑用户长大的。


    随着年龄增长，我花更多时间在电脑上玩视频游戏。起初我迷恋第一人称射击游戏，最后大部分时间都在玩实时策略游戏。然后我发现你可以在线玩这些游戏！在整个青少年时期，我都是一个“电脑虫”：`我知道如何使用电脑，但我完全不知道它们在底层是如何工作的。`


    我之所以向你介绍我的背景，是因为我想让你知道我并不是一个天才。我没有在 7 岁时自学 Basic 语言编程。当我上第一门计算机编程课时，我并不是在教老师并纠正他的错误。


    直到大学二级时，我才真正开始爱上编程这项活动。有些人可能会说我是一个大器晚成者，但我我觉得比你想象的要更接近常态。


    虽然我是为了编程本身而热爱编程，但我仍然没有掌握计算机在底层是如何工作的。如果你当时告诉我，我所有的代码都运行在一个 `process`（进程）内部，我会用异样的眼光看着你。


    幸运的是，我在本地的一家 Web 初创公司获得了一个极佳的工作机会。这让我有机会在真实的生产系统上进行一些编程。这改变了我的一切。这给了我学习事物底层工作原理的理由。


    当我处理这个高流量的生产系统时，我面临着日益复杂的问题。随着我们的流量和资源需求增加，`我们必须开始查看整个技术栈来调试和修复待解决的问题`。如果仅仅关注应用代码，我们就无法获得应用程序运行的全景图。


    在应用程序面前有许多层级：防火墙、负载均衡器、反向代理和 http 缓存。我们还有与应用程序并行的层级：任务队列、数据库服务器和统计收集器。每个应用程序都会由一组不同的组件组成，而这本书不会教你关于所有这些组件的知识。


    本书将教你关于 Unix 进程所需的所有知识，而这`保证能提高你对应用程序中运行的任何组件的理解`。


    通过调试问题，我被迫深入研究了那些使用 Unix 编程概念的 Ruby 项目。例如 `Resque` 和 `Unicorn`。这两个项目是我进入 Ruby
    Unix 编程世界的大门。


    `在更深入地理解了它们的工作原理后，我能够更快、更透彻地诊断问题`，并调试那些仅看应用代码时完全无法理解的棘手问题。


    我甚至开始利用从这些项目中中学到的技术，为我解决的问题提出新的、更快、更高效的解决方案。好了，关于我的就够了。让我们进入兔子洞吧。


    ## 基础


    本节将提供书中用到的一些关键概念的背景。强烈建议你在进入更有实质内容的章节之前阅读这部分。


    ### 为什么要关注？


    Unix 编程模型自 1970 年以来一直以某种形式存在。那时，Unix 在贝尔实验室被著名发明，以及 C 语言语言或框架。在之后的几十年里，Unix 因其可靠性、安全性和作为首选操作系统受了时间的考验。


    Unix 编程概念和技术并不是时尚，它们不是最新的流行编程语言。这些技术超越了编程语言。无论你是用 C、C++、Ruby、Python、JavaScript、Haskell
    还是[在此处插入你喜欢的语言]进行编程，这些技术都会有用。


    这些东西已经存在了几十年，基本没有变化。聪明的程序员一直在使用 Unix 编程来解决困难的问题。


    ### 掌握力量！


    我现在要警告你，书中描述的概念和技术能带给你巨大的力量。通过这种力量，你可以创建新的软件，理解现有的软件，甚至将你的职业提升到一个新的水平。


    只要记住，能力越大，责任越大。继续读下去，我会告诉你一切所需的知识。


    ### 概述


    本书不是作为参考手册来写的。它更像是一份指南。为了从中获得最大的收获，你应该按顺序阅读，因为每一章都建立在前一章的基础上。完成后，如果需要复习，可以使用章节。


    本书包含了许多代码示例。我强烈建议你通过在 Ruby 解释器中实际运行它们来跟随。亲自操作代码并进行调整将有助于加深这些概念。


    ### 系统调用


    理解系统调用首先需要对 Unix 系统的组件进行简单说明，特别是用户态（userland）与内核（kernel）。


    你 Unix 系统的内核位于计算机硬件之上。它是任何与硬件交互的中间人。这包括从文件系统读取/写入、通过网络发送数据、分配内存或通过扬声器播放音频。由于其力量，程序被不允许直接访问内核。任何通信都通过系统调用完成。


