  trans: "\n这一行将工作进程从 Unicorn 的内部跟踪列表（`WORKERS`）中移除，并在工作实例上调用 `#close`，从而关闭它不再需要的心跳机制。\n\
    \n```\nm = \"reaped #{status.inspect} worker=#{worker.nr rescue 'unknown'}\"\n\
    ```\n\n这些行根据 `Process.waitpid2` 调用返回的 `status` 构建了一条日志消息。\n\n该字符串是通过首先检查 `status`\
    \ 变量构建的。它看起来像什么样？类似于这样：\n\n```\n#<Process::Status: pid=32227,exited(0)>\n# or\n\
    #<Process::Status: pid=32308,signaled(SIGINT=2)>\n```\n\n它包含了已结束进程的 `pid` 以及它结束的方式。在第一行中，进程以退出代码\
    \ 0 自行退出。在第二行中，进程被信号杀死（在此例中为 `SIGINT`）。因此，像这样的一行会被添加到 Unicorn 的日志中。\n\n日志行的第二部分\
    \ `worker.nr` 是 Unicorn 对工作进程编号的内部表示。\n\n```\nstatus.success? ? logger.info(m)\
    \ : logger.error(m)\n```\n\n这一行获取构建好的日志消息并将其发送记录器。它使用 `status` 对象上的 `success?`\
    \ 方法将此消息以 INFO 级别或 ERROR 级别进行记录。\n\n`success?` 方法只会在一种情况下返回 `true`，即进程以退出代码 0\
    \ 退出。如果它以不同的代码退出，它将返回 `false`。如果它被信号杀死，它将返回 `nil`。\n\n```\nrescue Errno::ECHILD\n\
    \  break\n```\n\n这是该方法顶层 `begin` 语句的一部分。如果抛出此异常，则该方法的无限循环将 `break`（退出）并返回。\n\n\
    如果当前进程没有子进程，`Process.waitpid2`（或任何同类方法）将抛出 `Errno::ECHILD` 异常。如果在这种情况下发生了这种情况，意味着该方法的任务已经完成！所有子进程都已经被收割。因此，它返回了。\n\
    \n### 结论\n\n如果你对这段代码感兴趣，并想学习更多关于 Ruby 中的 Unix 编程，Unicorn 是一个很棒的资源。请访问官方网站 [`unicorn.bogomips.org`](http://unicorn.bogomips.org)\
    \ 并学习吧！\n\n## 附录：预叉服务器 (Preforking Servers)\n\n很高兴你读到了这里，因为这一章可能是整本书中最充实的一章。预叉服务器将书中解释的许多概念结合在一起，形成了一种强大且高效的方法来解决某些问题。\n\
    \n你很有可能用过 Phusion Passenger ([`www.modrails.com/`](http://www.modrails.com)) 或\
    \ Unicorn ([`unicorn.bogomips.org`](http://unicorn.bogomips.org))。这两个服务器以及 Spyglass（本书附带的\
    \ Web 服务器）都是预叉服务器的示例。\n\n所有这些项目的核心都是预叉模型。关于预叉有几点使其变得与众不同，这里是 3 点：\n\n1. 高效的内存利用。\n\
    2. 高效的负载均衡。\n3. 高效的系统管理。\n\n我们将逐一查看。\n\n### 高效的内存利用\n\n在关于分支（forking）的章节中，我们讨论了\
    \ `fork(2)` 如何创建一个新进程，该进程是调用（父）进程的*精确拷贝*。这包含了父进程在当时内存中拥有的任何内容。\n\n#### 加载 Rails\
    \ 应用\n\n在我的 Macbook Pro 上，仅加载 Rails 3.1（不包含库或应用代码）大约需要 3 秒。加载 Rails 后，该进程消耗了约\
    \ 70MB 的内存。\n\n这些数字在你的机器上是否完全相同对于我们的目的并不重要。我将在接后的示例中将它们作为基准。\n\n预叉比产生多个不相关的进程能更高效地使用内存。作为对比，这就像运行带有\
    \ 10 个工作进程的 Unicorn，与运行 10 个 Mongrel 实例（一种非预叉服务器）相比。\n\n让我们先从进程的角度回顾一下，当我们启动每种服务器的\
    \ 10 个实例时会发生什么，先看 Mongrel，然后看 Unicorn。\n\n#### 多个 Mongrels\n\n并行启动 10 个 Mongrel\
    \ 进程看起来与串行启动 10 个 Mongrel 进程差不多。\n\n在并行启动时，所有 10 个进程都将竞争内核的资源。每个进程都会消耗资源来加载 Rails，并且每个进程都预计需要通常的\
    \ 3 秒来启动。总共，那是 30 秒。此外，一旦 Rails 加载完成，每个进程将消耗 70MB 内存。总计，10 个进程将占用 700MB 内存。\n\n\
    预叉服务器可以做得更好。\n\n#### 多个 Unicorn\n\n启动 10 个 Unicorn 工作进程将使用 11 个进程。其中一个进程是主进程（master），负责看其他\
    \ 10 个工作进程。\n\n在启动 Unicorn 时，只有一个进程（即主进程）加载 Rails。不会发生内核资源的竞争。\n\n主进程将花费通常的 3\
    \ 秒来加载，而分支 10 个进程几乎是瞬时完成的。主进程将消耗 70MB 内存来加载 Rails，得益于写时拷贝（copy-on-write），子进程不会产生额外的内存开销。\n\
    \n事实是，分支进程需要一些时间，并且每个进程都会产生一些内存开销，但这与启动多个 Mongrels 的开销相比是微不足道的。预叉胜出。\n\n### 高效的负载均衡\n\
    \n我已经强调了 `fork(2)` 创建了调用进程的*精确拷贝*。这包含了父进程打开的任何文件描述符。\n\n#### 套接字的基础知识\n\n高效的负载均衡很大程度上取决于套接字（sockets）的工作原理。由于我们在讨论\
    \ Web 服务器：套接字非常重要。它们是网络的核心。正如我之前暗示的：套接字和网络是一个复杂的话题，无法放入书中。但你需要理解基础的工作流才能理解后续部分。\n\
    \n使用套接字涉及多个步骤：1) 打开套接字并绑定唯一端口，2) 在套接字上使用 `accept(2)` 接收连接，3) 数据可以从连接读取、写入连接并最终关闭连接。套接字保持开启，但连接会被关闭。\n\
    \n通常这发生在同一个进程中。打开套接字，然后进程在套接字上等待连接。处理并关闭连接，然后循环开始。\n\n预叉服务器使用不同的工作流来让内核在套接字上平衡负载。让我们看看是如何实现的。\n\
    \n在像 Unicorn 和 Spyglass 这样的服务器中，主进程的第一件事是打开套接字，甚至在加载 Rails 应用之前。这是供外部 客户端连接的套接字。但主进程*不接受*连接。得益于\
    \ `fork(2)` 的工作方式，当主进程分支工作进程时，每个进程都获得打开套接字的拷贝。\n\n这就是魔法发生的地方。\n\n每个工作进程都拥有打开套接字的精确拷贝，每个工作进程都尝试在套接字上使用\
    \ `accept(2)` 接收连接。这就是内核接管并在 10 个套接字拷贝上平衡负载的地方。它确保一个且只有一个进程可以接收每个单独的连接。即使在高负载下，内核也能确保负载均衡，且只有一个进程处理每个连接。\n\
    \n将此与 Mongrel 实现负载均衡的方式进行对比。\n"
- fmt: "\nGiven 10 unrelated processes that aren't sharing a socket each one must\
    \ bind to a unique port. Now a piece of infrastructure must sit in front of all\
    \ of the Mongrel processes. It must know which port each Mongrel processes is\
    \ bound to, and it must do the job of making sure that each Mongrel is handling\
    \ only one connection at a time and that connections are load balanced properly.\n\
    \nAgain, preforking wins both for simplicity and resource efficiency.\n\n### Efficient\
    \ sysadminning\n\nThis point is less technical, more human-centric.\n\nAs someone\
    \ administering a preforking server you typically only need to issue commands\
    \ (usually signals) to the master process. It will handle keeping track of and\
    \ relaying messages to its worker processes.\n\nWhen administering many instances\
    \ of a non-preforking server the sysadmin must keep track of each instance, adminster\
    \ them separately and ensure that their commands are followed.\n\n### Basic Example\
    \ of a Preforking Server\n\nWhat follows is some really basic code for a preforking\
    \ server. It can respond to requests in parallel using multiple processes and\
    \ will leverage the kernel for load balancing. For a more involved example of\
    \ a preforking server I suggest you check out the Spyglass source code (next chapter)\
    \ or the Unicorn source code.\n\n```\nrequire 'socket'\n\n# Open a socket.\nsocket\
    \ = TCPServer.open('0.0.0.0', 8080)\n\n# Preload app code.\n# require 'config/environment'\n\
    \n# Forward any relevant signals to the child processes.\n[:INT, :QUIT].each do\
    \ |signal|\n  Signal.trap(signal) {\n    wpids.each { |wpid| Process.kill(signal,\
    \ wpid) }\n  }\nend\n\n# For keeping track of child process pids.\nwpids = []\n\
    \n5.times {\n  wpids << fork do\n    loop {\n      connection = socket.accept\n\
    \      connection.puts 'Hello Readers!'\n      connection.close\n    }\n  end\n\
    }\n\nProcess.waitall\n```\n\nYou can consume it with something like `nc(1)` or\
    \ `telnet(1)` to see it in action.\n\n```\n$ nc localhost 8080\n$ telnet localhost\
    \ 8080\n```\n\nNotice that I snuck something new into that one? We haven't seen\
    \ `Process.waitall` yet, it appeared on the last line of the example code above.\n\
    \n`Process.waitall` is simply a convenience method around `Process.wait`. It runs\
    \ a loop waiting for all child processes to exit and returns an array of process\
    \ statuses. Useful when you don't actually want to do anything with the process\
    \ status info, it just waits for the children to exit.\n\n## Appendix: Spyglass\n\
    \nIf you want to know even more about Unix processes then your next stop should\
    \ be the included Spyglass project. Why? Because it was written specifically to\
    \ showcase Unix programming concepts.\n\nIf you have a copy of this book but didn't\
    \ get the included code project, send me an email and I'll hook you up: jesse@workingwithunixprocesses.com.\n\
    \nThe case studies you read are meant to showcase the same thing, but at times\
    \ they can be dense and hard to read when you're new to Unix programming. Spyglass\
    \ is meant to bridge that gap.\n\n### Spyglass' Architecture\n\nSpyglass is a\
    \ web server. It opens a socket to the outside world and handles web requests.\
    \ Spyglass parses HTTP, is Rack-compliant, and is awesome.\n\nHere's a brief summary\
    \ of how to start a Spyglass server and what happens when it receives an HTTP\
    \ request.\n\n### Booting Spyglass\n\n```\n$ spyglass\n$ spyglass -p other_port\n\
    $ spyglass -h # for help\n```\n\n### Before a Request Arrives\n\nAfter it boots,\
    \ control is passed to `Spyglass::Lookout`. This class DOES NOT preload the Rack\
    \ application and knows nothing about HTTP, it just waits for a connection. At\
    \ this point in time `Spyglass` is extremely lightweight, it's nothing more than\
    \ just an open socket.\n\n### Connection is Made\n\nWhen `Spyglass::Lookout` is\
    \ notified that a connection has been made it forks a `Spyglass::Master` to actually\
    \ handle the connection. `Spyglass::Lookout` uses `Process.wait` after forking\
    \ the master process, so it remains idle until the master exits.\n\n`Spyglass::Master`\
    \ is responsible for preloading the Rack application and for forking/babysitting\
    \ worker processes. The master process itself doesn't know anything about HTTP\
    \ parsing or request handling.\n\nThe real work is done in `Spyglass::Worker`.\
    \ It accepts connections using the method outlined in the chapter on preforking,\
    \ leaning on the kernel for load balancing. Once it has a connection it parses\
    \ the HTTP request, calls the Rack app, and writes the response to the client.\n\
    \n### Things Get Quiet\n\nSo long as there is a steady flow of incoming traffic\
    \ Spyglass continues to act as a preforking server. If its internal timeout is\
    \ able to expire without receiving any more incoming requests then the master\
    \ process, and all its worker processes, exit. Control is returned to `Spyglass::Lookout`\
    \ and the workflow begins again.\n\n### Getting Started\n\nSpyglass is not a production-ready\
    \ server, so don't rush to start using it for your projects! It's a codebase that's\
    \ meant to be read. It's heavily commented and formatted documentation is generated\
    \ with `rocco` ([http://rtomayko.github.com/rocco](http://rtomayko.github.com/rocco)).\n\
    \nThe best thing to do at this point is enter the `code` directory that comes\
    \ with this book in your terminal, find the Spyglass codebase, and run `rake read`.\
    \ This will open up the formatted documentation in your browser for your reading\
    \ pleasure.\n\nNow go forth and read the code! And may the `fork(2)` be with you!\n"
