  trans: "\n这创建了一对相互连接的 UNIX 套字。这些套字使用数据报（datagrams）进行通信，而不是流（stream）。通过这种方式，你可以向一个套字写入一个*完整*的消息，并从另一个套字读取一个*完整*的消息。不需要分隔符。\n\
    \n这里有一个管道示例稍微复杂一点的版本，其中子进程实际上会等待父进程告诉它要做什么，然后在完成工作后向父进程报告结果：\n\n```ruby\nrequire\
    \ 'socket'\n\nchild_socket, parent_socket = Socket.pair(:UNIX, :DGRAM, 0)\nmaxlen\
    \ = 1000\n\nfork do\n  parent_socket.close\n\n  4.times do\n    instruction =\
    \ child_socket.recv(maxlen)\n    child_socket.send(\"#{instruction} accomplished!\"\
    , 0)\n  end \nend \nchild_socket.close\n\n2.times do\n  parent_socket.send(\"\
    Heavy lifting\", 0)\nend \n2.times do\n  parent_socket.send(\"Feather lifting\"\
    , 0)\nend \n\n4.times do\n  $stdout.puts parent_socket.recv(maxlen)\nend \n```\n\
    \n输出：\n\n```\nHeavy lifting accomplished!\nHeavy lifting accomplished!\nFeather\
    \ lifting accomplished!\nFeather lifting accomplished!\n```\n\n因此，管道提供的是单向通信，而套字对提供了双向通信。父套字既可以读取子套字，也可以写入，反之亦然。\n\
    \n### 远程 IPC？\n\nIPC（进程间通信）意味着运行在同一机器上的进程之间的通信。如果你感兴趣从一台机器扩展到多台机器，同时进行类似于 IPC\
    \ 的操作，那么有一些东西可以研究。第一种方法就是通过 TCP 套字进行通信。对于非复杂的系统，此选项比其他选项需要更多的样板代码。其他可行的解决方案包括\
    \ RPC ([`en.wikipedia.org/wiki/Remote_procedure_call`](http://en.wikipedia.org/wiki/Remote_procedure_call))（远程过程调用）、像\
    \ ZeroMQ 这样的消息系统 ([`www.zeromq.org/`](http://www.zeromq.org/)) 或者分布式系统的通用领域 ([`en.wikipedia.org/wiki/Distributed_computing`](http://en.wikipedia.org/wiki/Distributed_computing))。\n\
    \n### 现实世界\n\n管道和套字对都是进程间通信的有用抽象。它们快速且易用。它们通常用作通信通道，而不是像共享数据库或日志文件等粗暴的方法。\n\n\
    至于使用哪种方法：取决于你的需求。在权衡决策时，请记住管道是单向的，而套字对是对向的。\n\n对于更深入的示例，请查看包含的 Spyglass 项目中的 `Spyglass`\
    \ 类。它使用比你上面看到的代码更复杂的示例，许多子进程通过单个管道与父进程进行通信。\n\n### 系统调用\n\nRuby 的 `IO.pipe` 映射到\
    \ `pipe(2)`，`Socket.pair` 映射到 `socketpair(2)`。`Socket.recv` 映射到 `recv(2)`，而 `Socket.send`\
    \ 映射到 `send(2)`。\n\n## 守护进程\n\n守护进程是在后台运行的进程，而不是在终端用户的控制下运行。守护进程的常见例子如 Web 服务器或数据库服务器，它们将始终在后台运行以提供服务。\n\
    \n守护进程也是你操作系统的核心。有很多进程不断在后台运行，保持你的系统正常运行。这些是诸如 GUI 系统上的窗口服务器、打印服务或音频服务，这样你的扬声器随时准备好播放那恼人的“叮”的通知声。\n\
    \n### 第一个进程\n\n有一个守护进程对你的操作系统具有特殊的特殊意义。我们在上一个章节中讨论过每个进程都有一个父进程。这对于所有进程都可能吗？系统上的第一个进程又是呢？\n\
    \n这是一个经典的“谁创造了创造者”的问题，它有一个简单的答案。当内核引导启动时，它会产生一个名为 `init` 的进程。该进程的 `ppid` 为 `0`，是“所有进程的祖父”。它是第一个，且没有祖先。它的\
    \ `pid` 是 `1`。\n\n### 创建你的第一个守护进程\n\n我们需要什么来开始？并不多。任何进程都可以变成守护进程。\n\n让我们看看 rack\
    \ 项目 ([`github.com/rack/rack`](http://github.com/rack/rack)) 作为一个示例。Rack 自带有一个\
    \ `rackup` 命令，用于使用不同的支持 Rack 的 Web 服务器提供应用程序。Web 服务器是一个永远不会结束的进程绝佳例子；只要你的应用程序处于活动状态，你需要一个监听连接的服务器。\n\
    \n`rackup` 命令包含一个将服务器守护化并在后台运行的选项。让我们来看看它做了什么。\n\n### 深入研究 Rack\n\n```ruby\ndef\
    \ daemonize_app\n  if RUBY_VERSION < \"1.9\"\n    exit if fork\n    Process.setsid\n\
    \    exit if fork\n    Dir.chdir \"/\" \n    STDIN.reopen \"/dev/null\"\n    STDOUT.reopen\
    \ \"/dev/null\", \"a\" \n    STDERR.reopen \"/dev/null\", \"a\" \n  else\n   \
    \ Process.daemon\n  end \nend\n```\n\n这里有很多操作。让我们先跳到 `else` 块。Ruby 1.9.x 自带了一个名为\
    \ `Process.daemon` 的方法，它可以守护化当前进程。\n\n### 逐步守护化进程\n\n```ruby\nexit if fork\n```\n\
    \n这行代码智能地利用了 `fork` 方法的返回值。回顾分叉章节，`fork` 返回两次，一次在父进程中，一次在子进程中。在父进程中它返回子进程的 `pid`，而在子进程中它返回\
    \ `nil`。\n\n如往常，返回值对于父进程是真，对于子进程是假。这意味着父进程将退出，而我们所知，孤儿进程会继续运行。\n\n如果一个进程是孤儿，当你询问\
    \ `Process.ppid` 时会发生什么？\n\n这就是 `init` 进程知识变得有用的地方。孤儿进程的 ppid 总是 `1`。这是内核可以始终活跃的进程。\n\
    \n在创建守护进程时，这一步是必须的，因为它导致调用此脚本的终端认为命令已完成，将控制权返回给终端并将其排除。\n\n```ruby\nProcess.setsid\n\
    ```\n\n调用 `Process.setsid` 执行了三件事：\n\n1  进程成为新会话的会话组\n2  进程成为新进程组的组组\n3  进程没有控制终端\n\
    \n为了确切理解这三件事产生了什么影响，我们需要暂时离开 Rack 示例的上下文，深入底层。\n\n### 进程组和会话组\n\n进程组和会话组都是关于作业控制。我所说的“作业控制”是指终端处理进程的方式。\n\
    \n我们从进程组开始。\n\n每个进程都属于一个组，每个组都有唯一的整数 ID。进程组只是相关进程的集合，通常是一个父进程及其子进程。然而，你也可以通过使用\
    \ `Process.setpgrp(new_group_id)` 设置组 ID 来任意对进程分组。\n\n查看以下代码片段的输出。\n\n```ruby\n\
    puts Process.getpgrp\nputs Process.pid\n```\n"
- fmt: "\nIf you ran that code in an `irb` session then those two values will be equal.\
    \ Typically the process group id will be the same as the `pid` of the process\
    \ group leader. The process group leader is the 'originating' process of a terminal\
    \ command. ie. If you start an `irb` process at the terminal it will become the\
    \ group leader of a new process group. Any child processes that it creates will\
    \ be made part of the same process group.\n\nTry out the following example to\
    \ see that process groups are inherited.\n\n```\nputs Process.pid\nputs Process.getpgrp\n\
    \nfork { \n  puts Process.pid\n  puts Process.getpgrp\n}\n```\n\nYou can see that\
    \ although the child process gets a unique `pid` it inherits the group id from\
    \ its parent. So these two processes are part of the same group.\n\nYou'll recall\
    \ that we looked previously at Orphaned Processes. In that section I said that\
    \ child processes are not given special treatment by the kernel. Exit a parent\
    \ process and the child will continue on. This is the behaviour when a parent\
    \ process exits, but the behaviour is a bit different when the parent process\
    \ is being controlled by a terminal and is killed by a signal.\n\nConsider for\
    \ a moment: a Ruby script that shells out to a long-running shell command, eg.\
    \ a long backup script. What happens if you kill the Ruby script with a `Ctrl-C`?\n\
    \nIf you try this out you'll notice that the long-running backup script is not\
    \ orphaned, it does not continue on when its parent is killed. We haven't set\
    \ up any code to forward the signal from the parent to the child, so how is this\
    \ done?\n\nThe terminal receives the signal and forwards it on to any process\
    \ in the foreground process group. In this case, both the Ruby script and the\
    \ long-running shell command would part of the same process group, so they would\
    \ both be killed by the same signal.\n\n## Session Groups\n\nA session group is\
    \ one level of abstraction higher up, a collection of process groups. Consider\
    \ the following shell command:\n\n```\ngit log | grep shipped | less\n```\n\n\
    In this case each command will get its own process group, since each may be creating\
    \ child processes but none is a child process of another. Even though these commands\
    \ are not part of the same process group one `Ctrl-C` will kill them all.\n\n\
    These commands are part of the same session group. Each invocation from the shell\
    \ gets its own session group. An invocation may be a single command or a string\
    \ of commands joined by pipes.\n\nLike in the above example, a session group may\
    \ be attached to a terminal. It might also not be attached to any terminal, as\
    \ in the case of a daemon.\n\nAgain, your terminal handles session groups in a\
    \ special way: sending a signal to the session leader will forward that signal\
    \ to all the process groups in that session, which will forward it to all the\
    \ processes in those process groups. Turtles all the way down ;)\n\nThere is a\
    \ system call for retrieving the current session group id, `getsid(2)`, but Ruby's\
    \ core library has no interface to it. Using `Process.setsid` will return the\
    \ id of the new sesssion group it creates, you can store that if you need it.\n\
    \nSo, getting back to our Rack example, in the first line a child process was\
    \ forked and the parent exited. The originating terminal recognized the exit and\
    \ returned control to the user, but the forked process still has the inherited\
    \ group id and session id from its parent. At the moment this forked process is\
    \ neither a session leader nor a group leader.\n\nSo the terminal still has a\
    \ link to our forked process, if it were to send a signal to its session group\
    \ the forked process would receive it, but we want to be fully detached from a\
    \ terminal.\n\n`Process.setsid` will make this forked process the leader of a\
    \ new process group and a new session group. Note that `Process.setsid` will fail\
    \ in a process that is already a process group leader, it can only be run from\
    \ child processes.\n\nThis new session group does not have a controlling terminal,\
    \ but technically one could be assigned.\n\n```\nexit if fork\n```\n\nThe forked\
    \ process that had just become a process group and session group leader forks\
    \ again and then exits.\n\nThis newly forked process is no longer a process group\
    \ leader nor a session leader. Since the previous session leader had no controlling\
    \ terminal, and this process is not a session leader, it's guaranteed that this\
    \ process can never have a controlling terminal. Terminals can only be assigned\
    \ to session leaders.\n\nThis dance ensures that our process is now fully detached\
    \ from a controlling terminal and will run to its completion.\n\n```\nDir.chdir\
    \ \"/\" \n```\n\nThis changes the current working directory to the root directory\
    \ for the system. This isn't strictly necessary but it's an extra step to ensure\
    \ that current working directory of the daemon doesn't disappear during its execution.\n\
    \nThis avoids problems where the directory that the daemon was started from gets\
    \ deleted or unmounted for any reason.\n\n```\nSTDIN.reopen \"/dev/null\"\nSTDOUT.reopen\
    \ \"/dev/null\", \"a\" \nSTDERR.reopen \"/dev/null\", \"a\" \n```\n\nThis sets\
    \ all of the standard streams to go to `/dev/null`, a.k.a. to be ignored. Since\
    \ the daemon is no longer attached to a terminal session these are of no use anyway.\
    \ They can't simply be closed because some programs expect them to always be available.\
    \ Redirecting them to `/dev/null` ensures that they're still available to the\
    \ program but have no effect.\n\n### In the Real World\n\nAs mentioned, the `rackup`\
    \ command ships with a command line option for daemonizing the process. Same goes\
    \ with any of the popular Ruby web servers.\n\nIf you want to dig in to more internals\
    \ of daemon processes you should look at daemon processes.\n\n## Spawning Terminal\
    \ Processes\n\nA common interaction in a Ruby program is 'shelling out' from your\
    \ program to run a command in a terminal. This happens especially when I'm writing\
    \ a Ruby script to glue together some commands for myself. There are several ways\
    \ you can spawn processes to run terminal commands in Ruby.\n\nBefore we look\
    \ at the different ways of 'shelling out' let's look at the mechanism they're\
    \ all using under the hood.\n\n### fork + exec\n\nAll of the methods described\
    \ below are variations on one theme: `fork` + `exec`.\n\nWe've had a good look\
    \ at `fork(2)` in previous chapters, but this is our first look at `exec(2)`.\
    \ It's pretty simple, `exec(2)` allows you to replace the current process with\
    \ a different process.\n\nPut another way: `exec(2)` allows you to transform the\
    \ current process into any other process. You can take a Ruby process and turn\
    \ it into a Python process, or an `ls(1)` process, or another Ruby process.\n\n\
    `exec(2)` transforms the process and never returns. Once you've transformed your\
    \ Ruby process into something else you can never come back.\n\n```\nexec 'ls',\
    \ '--help'\n```\n\nThe fork + exec combo is a common one when spawning new processes.\
    \ `exec(2)` is a very powerful and efficient way to transform the current process\
    \ into another one; the only catch is that your current process is gone. That's\
    \ where `fork(2)` comes in handy.\n\nYou can use `fork(2)` to create a new process,\
    \ then use `exec(2)` to transform that process into anything you like. Voila!\
    \ Your current process is still running just as it was before and you were able\
    \ to spawn any other process that you want.\n"
