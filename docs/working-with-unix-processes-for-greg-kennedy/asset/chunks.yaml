  trans: "\n是否决定保留之前定义的信号处理程序取决于你，只需确保你清楚自己为什么要这么做即可。如果你只是想在退出前挂载某些行为来清理资源，你可以使用 `at_exit`\
    \ 钩子，我们在退出状态码的章节中提到过它。\n\n### 你在什么时候无法接收信号？\n\n你的进程可以随时接收信号。这就是信号的妙之处所在！它们是异步的。\n\
    \n你的进程可以从一个繁忙的 `for-loop` 循环被切换到信号处理器，甚至可以从长时间的 `sleep` 中取出。如果进程在处理一个信号时接收到另一个信号，甚至可以从一个信号处理器切换到另一个。但正如预期的，它始终会返回并完成所有被调用的处理器中的代码。\n\
    \n### 在现实世界中\n\n通过信号，任何进程都可以与系统上的任何进程通信，只要它知道对方的 pid。这使得信号成为非常强大的通信工具。从 shell\
    \ 使用 `kill(1)` 发送信号是很常见的。\n\n在现实世界中，信号主要由服务器和守护进程等长时间运行的进程使用。在大多数情况下，发送信号的是人类用户而不是自动化程序。\n\
    \n例如，Unicorn Web 服务器 ([`unicorn.bogomips.org`](http://unicorn.bogomips.org)) 响应\
    \ `INT` 信号的方式是杀死所有进程并立即关闭。它响应 `USR2` 信号的方式重新执行自身来实现零停机重启。它响应 `TTIN` 信号的方式增加其正在运行的\
    \ worker 进程数量。\n\n查看 Unicorn 附带的 SIGNALS 文件 ([`unicorn.bogomips.org/SIGNALS.html`](http://unicorn.bogomips.org/SIGNALS.html))\
    \ 获取其支持的信号完整列表以及它如何响应这些信号。\n\nmemprof 项目有一个处理信号时做一个友好公民的有趣示例 ([`github.com/ice799/memprof/blob/d4bc228aca323b58fea92dbde20c1f8ec36e5386/lib/memprof/signal.rb#L8-16`](https://github.com/ice799/memprof/blob/d4bc228aca323b58fea92dbde20c1f8ec36e5386/lib/memprof/signal.rb#L8-16))。\n\
    \n### 系统调用\n\nRuby 的 `Process.kill` 映射到 `kill(2)`，`Kernel#trap` 大致映射到 `sigaction(2)`。`signal(7)`\
    \ 也很有用。\n\n## 进程可以通信\n\n到目前为止，我们查看了共享内存和打开资源的相关进程。但在多个进程之间通信信息又是呢？\n\n这是称为“进程间通信”（简称\
    \ IPC）的整个领域的一部分。有许多实现 IPC 的不同方法，但我将涵盖两种常用的方法：管道（pipes）和套接字对（socket pairs）。\n\n\
    ### 我们的管道\n\n管道（pipe）是一个单向的数据流。换句话说，你可以打开一个管道，一个进程可以“占用”的一端，另一个进程可以“占用”另一端。然后数据就可以沿着管道传递，但只能单向。所以，如果一个进程“占用”了读取者的位置而不是写入者，它将无法向管道写入。反之亦然。\n\
    \n在引入多个进程之前，让我们先来看看如何创建一个管道以及我们从中得到什么：\n\n```\nreader, writer = IO.pipe #=> [#<IO:fd\
    \ 5>, #<IO:fd 6>]\n```\n\n`IO.pipe` 返回一个包含两个元素的数组，这两个元素都是 `IO` 对象。Ruby 惊人的 IO\
    \ 类 ([`librelist.com/browser//usp.ruby/2011/9/17/the-ruby-io-class/`](http://librelist.com/browser//usp.ruby/2011/9/17/the-ruby-io-class/))\
    \ 是 `File`、`TCPSocket`、`UDPSocket` 等类的父类。因此，所有这些资源都有共同的接口。\n\n`IO.pipe` 返回的 `IO`\
    \ 对象可以被认为是匿名文件。你基本上可以像对待 `File` 一样对待它们。你可以调用 `#read`、`#write`、`#close` 等。但此对象不会响应\
    \ `#path` 且在文件系统中没有位置。\n\n在还没有引入多个进程的情况下演示管道通信：\n\n```\nreader, writer = IO.pipe\n\
    writer.write(\"Into the pipe I go...\")\nwriter.close\nputs reader.read\n```\n\
    \n输出\n\n```\nInto the pipe I go...\n```\n\n非常简单对吧？注意到我在向管道写入后必须关闭写入者了吗？这是因为当读取者调用\
    \ `IO#read` 时，它将继续尝试读取数据直到它看到 EOF（即文件结束标记 ([`en.wikipedia.org/wiki/End-of-file`](http://en.wikipedia.org/wiki/End-of-file))）。这告诉读取者不再有更多数据可读。\n\
    \n只要写入者仍然开启，读取者可能会看到更多数据，所以它会等待。通过在读取之前关闭写入者会在管道上放置一个 EOF，这样读取者在获取初始数据后就会停止读取。如果你跳过关闭写入者，读取者将阻塞并无限地尝试读取。\n\
    \n### 管道仅限单向\n\n```\nreader, writer = IO.pipe\nwriter.write(\"Trying the reader\
    \ to write\")\n```\n\n输出\n\n```\nIOError: not opened for writing\nfrom (irb):2\n\
    ```\n\n`IO.pipe` 返回的 `IO` 对象只能用于单向通信。所以读取者只能读取，写入者只能写入。\n\n现在，让我们把多个进程引入到这个混合中。\n\
    \n### 共享管道\n\n在 fork 章节中，我描述了当进程 fork 时打开资源是如何共享或复制的。管道被视为一种资源，它们拥有自己的描述符，因此与子进程共享。\n\
    \n这是一个使用管道在父子进程之间通信的简单示例。子进程通过向管道写入表示它完成了工作：\n\n```\nreader, writer = IO.pipe\n\
    \nfork do\n  reader.close\n\n  10.times do\n    writer.puts \"Another one dust\"\
    \n  end\nend\n\nwriter.close\nwhile message = reader.gets\n  $stdout.puts message\n\
    end\n```\n\n输出十次。注意，像上面一样，未使用的管道端被关闭了，以免干扰 EOF 的发送。由于涉及到两个进程，实际上多了一层。由于描述符被复制了，现在有\
    \ 4 个实例。由于只有两个将用于通信，其他 2 个实例必须关闭。这就是为什么需要额外的关闭操作。\n\n由于管道的端是 `IO` 对象，我们可以对它们调用任何\
    \ `IO` 方法，而不只是 `#read` 和 `#write`。在这个示例中，我使用了 `#puts` 和 `#gets` 来读取和写入以换行符分隔的\
    \ `String`。\n\n### 流与消息\n\n当我说流（stream）时，是指在管道中写入和读取数据时没有开始和结束的概念。在处理 IO 流（如管道或\
    \ TCP 套接字）时，你将数据写入流，并跟上某些协议特定的分隔符。例如，HTTP 使用一系列换行符来分隔头部和正文。\n\n然后当从该 IO 流中读取数据时，你每次读取一个块，直到遇到分隔符停止。*这*就是为什么我在上一个示例中使用\
    \ `#puts` 和 `#gets`：它为我使用了换行符作为分隔符。\n\n正如你可能猜到的，可以通过消息而不是流进行通信。我们无法通过管道实现，但可以通过\
    \ Unix 套接字实现。在不详细介绍的情况下，Unix 套接字是一种只能在同一物理机器上通信的套接字。因此，它比 TCP 套接字快得多，非常适合 IPC。\n\
    \n这里有一个我们创建了一对可以通过消息通信的 Unix 套接字的示例：\n\n```\nrequire 'socket'\nSocket.pair(:UNIX,\
    \ :DGRAM, 0) #=> [#<Socket:fd 15>, #<Socket:fd 16>]\n```\n"
- fmt: "\nThis creates a pair of UNIX sockets that are already connected to each other.\
    \ These sockets communicate using datagrams, rather than a stream. In this way\
    \ you write a *whole* message to one of the sockets and read a *whole* message\
    \ from the other socket. No delimiters required.\n\nHere's a slightly more complex\
    \ version of the pipe example where the child process actually waits for the parent\
    \ to tell it what to work on, then it reports back to the parent once it's finished\
    \ the work:\n\n```ruby\nrequire 'socket'\n\nchild_socket, parent_socket = Socket.pair(:UNIX,\
    \ :DGRAM, 0)\nmaxlen = 1000\n\nfork do\n  parent_socket.close\n\n  4.times do\n\
    \    instruction = child_socket.recv(maxlen)\n    child_socket.send(\"#{instruction}\
    \ accomplished!\", 0)\n  end \nend \nchild_socket.close\n\n2.times do\n  parent_socket.send(\"\
    Heavy lifting\", 0)\nend \n2.times do\n  parent_socket.send(\"Feather lifting\"\
    , 0)\nend \n\n4.times do\n  $stdout.puts parent_socket.recv(maxlen)\nend \n```\n\
    \noutputs:\n\n```\nHeavy lifting accomplished!\nHeavy lifting accomplished!\n\
    Feather lifting accomplished!\nFeather lifting accomplished!\n```\n\nSo whereas\
    \ pipes provide uni-directional communication, a socket pair provides bi-directional\
    \ communication. The parent socket can both read and write to the child socket,\
    \ and vice versa.\n\n### Remote IPC?\n\nIPC implies communication between processes\
    \ running on the same machine. If you're interested in scaling up from one machine\
    \ to many machines while still doing something resembling IPC there are a few\
    \ things to look into. The first one would simply be to communicate via TCP sockets.\
    \ This option would require more boilerplate code than the others for a non-trivial\
    \ system. Other plausible solutions would be RPC ([http://en.wikipedia.org/wiki/Remote_procedure_call](http://en.wikipedia.org/wiki/Remote_procedure_call))\
    \ (remote procedure call), a messaging system like ZeroMQ ([http://www.zeromq.org/](http://www.zeromq.org/)),\
    \ or the general body of distributed systems ([http://en.wikipedia.org/wiki/Distributed_computing](http://en.wikipedia.org/wiki/Distributed_computing)).\n\
    \n### In the Real World\n\nBoth pipes and socket pairs are useful abstractions\
    \ for communicating between processes. They're fast and easy. They're often used\
    \ as a communication channel instead of a more brute force approach such as a\
    \ shared database or log file.\n\nAs for which method to use: it depends on your\
    \ needs. Keep in mind that pipes are uni-directional and socket pairs are bi-directional\
    \ when weighing your decision.\n\nFor a more in-depth example have a look at the\
    \ `Spyglass` class in the included Spyglass project. It uses a more involved example\
    \ of the code you saw above where many child processes communicate over a single\
    \ pipe with their parent process.\n\n### System Calls\n\nRuby's `IO.pipe` maps\
    \ to `pipe(2)`, `Socket.pair` maps to `socketpair(2)`. `Socket.recv` maps to `recv(2)`\
    \ and `Socket.send` maps to `send(2)`.\n\n## Daemon Processes\n\nDaemon processes\
    \ are processes that run in the background, rather than under the control of a\
    \ user at a terminal. Common examples of daemon processes are things like web\
    \ servers, or database servers which will always be running in the background\
    \ in order to serve requests.\n\nDaemon processes are also at the core of your\
    \ operating system. There are many processes that are constantly running in the\
    \ background that keep your system functioning normally. These are things like\
    \ the window server on a GUI system, printing services or audio services so that\
    \ your speakers are always ready to play that annoying 'ding' notification.\n\n\
    ### The First Process\n\nThere is one daemon process in particular that has special\
    \ significance for your operating system. We talked in a previous chapter about\
    \ every process having a parent process. Can that be true for all processes? What\
    \ about the very first process on the system?\n\nThis is a classic who-created-the-creator\
    \ kind of problem, and it has a simple answer. When the kernel is bootstrapped\
    \ it spawns a process called the `init` process. This process has a `ppid` of\
    \ `0` and is the 'grandparent of all processes'. It's the first one and it has\
    \ no ancestor. Its `pid` is `1`.\n\n### Creating Your First Daemon Process\n\n\
    What do we need to get started? Not much. Any process can be made into a daemon\
    \ process.\n\nLet's look to the rack project ([http://github.com/rack/rack](http://github.com/rack/rack))\
    \ for an example here. Rack ships with a `rackup` command to serve applications\
    \ using different rack supported web servers. Web servers are a great example\
    \ of a process that will never end; so long as your application is active you'll\
    \ need a server listening for connections.\n\nThe `rackup` command includes an\
    \ option to daemonize the server and run it in the background. Let's have a look\
    \ at what that does.\n\n### Diving into Rack\n\n```ruby\ndef daemonize_app\n \
    \ if RUBY_VERSION < \"1.9\"\n    exit if fork\n    Process.setsid\n    exit if\
    \ fork\n    Dir.chdir \"/\" \n    STDIN.reopen \"/dev/null\"\n    STDOUT.reopen\
    \ \"/dev/null\", \"a\" \n    STDERR.reopen \"/dev/null\", \"a\" \n  else\n   \
    \ Process.daemon\n  end \nend\n```\n\nLots going on here. Let's first jump to\
    \ the `else` block. Ruby 1.9.x ships with a method called `Process.daemon` that\
    \ will daemonize the current process.\n\n### Daemonizing a Process, Step by Step\n\
    \n```ruby\nexit if fork\n```\n\nThis line of code makes intelligent use of the\
    \ return value of the `fork` method. Recall from the forking chapter that `fork`\
    \ returns twice, once in the parent process and once in the child process. In\
    \ the parent process it returns the child's `pid` and in the child process it\
    \ returns nil.\n\nAs always, the return value will be truthy for the parent and\
    \ false-y for the child. This means that the parent process will exit, and as\
    \ we know, orphaned child processes carry on as normal.\n\nIf a process is orphaned\
    \ then what happens when you ask for `Process.ppid`?\n\nThis is where knowledge\
    \ of the `init` process becomes relevant. The ppid of orphaned processes is always\
    \ `1`. This is the only process the kernel can be sure is active at all times.\n\
    \nThis first step is imperative when creating a daemon because it causes the terminal\
    \ that invoked this script to think the command is done, returning control to\
    \ the terminal and taking it out of the equation.\n\n```ruby\nProcess.setsid\n\
    ```\n\nCalling `Process.setsid` does three things:\n\n1.  The process becomes\
    \ a session leader of a new session\n2.  The process becomes the process group\
    \ leader of a new process group\n3.  The process has no controlling terminal\n\
    \nTo understand exactly what effect these three things have we need to step out\
    \ of the context of our Rack example for a moment and look a little deeper.\n\n\
    ### Process Groups and Session Groups\n\nProcess groups and session groups are\
    \ all about job control. By 'job control' I'm referring to the way that processes\
    \ are handled by the terminal.\n\nWe begin with process groups.\n\nEach and every\
    \ process belongs to a group, and each group has a unique integer id. A process\
    \ group is just a collection of related processes, typically a parent process\
    \ and its children. However you can also group your processes arbitrarily by setting\
    \ their group id using `Process.setpgrp(new_group_id)`.\n\nHave a look at the\
    \ output from the following snippet.\n\n```ruby\nputs Process.getpgrp\nputs Process.pid\n\
    ```\n"
