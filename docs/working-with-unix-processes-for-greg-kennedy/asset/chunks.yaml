- fmt: "\nUserland is where all of your programs run. You can do a lot in your userland\
    \ programs without ever making use of a system call: do mathematics, string operations,\
    \ control flow with logical statements. But I'd go as far as saying that if you\
    \ want your programs to do anything interesting then you'll need to involve the\
    \ kernel via system calls.\n\nIf you were a C programmer this stuff would probably\
    \ be second nature to you. System calls are at the heart of C programming.\n\n\
    But I'm going to expect that you, like me, don't have any C programming experience.\
    \ You learned to program in a high level language. When you learned to write data\
    \ to the filesystem you weren't told which system calls make that happen.\n\n\
    The takeaway here is that system calls allow your user-space programs to interact\
    \ indirectly with the hardware of your computer, via the kernel. We'll be looking\
    \ at common system calls as we go through the chapters.\n\n## Nomenclature, `wtf(2)`\n\
    \nOne of the roadblocks to learning about Unix programming is where to find the\
    \ proper documentation. Want to hear the kicker? It's all available via Unix manual\
    \ pages (manpages), and if you're using a Unix based computer right now it's already\
    \ on your computer!\n\nIf you've never used manpages before you can start by invoking\
    \ the command `man man` from a terminal.\n\nPerfect, right? Well, kind of. The\
    \ manpages for the system call api are a great resource in two situations:\n\n\
    1. you're a C programmer who wants to know how to invoke a given system call,\
    \ or\n2. you're trying to figure out the purpose of a given system call\n\nI'm\
    \ going to assume we're not C programmers here, so #1 isn't so useful, but #2\
    \ is very useful.\n\nYou'll see references throughout this text to things like\
    \ this: `select(2)`. This bit of text is telling you where you can find the manpage\
    \ for a given system call. You may or may not know this, but there are many sections\
    \ to the Unix manpages.\n\nHere's a look at the most commonly used sections of\
    \ the manpages for FreeBSD and Linux systems:\n\n- Section 1: General Commands\n\
    - Section 2: System Calls\n- Section 3: C Library Functions\n- Section 4: Special\
    \ Files\n\nSo Section 1 is for general commands (a.k.a. shell commands). If I\
    \ wanted to refer you to the manual page for the `find` command I would write\
    \ it like this: `find(1)`. This tells you that there is a manual page for `find`\
    \ in section 1 of the manpages.\n\nIf I wanted to refer to the manual page for\
    \ the `getpid` system call I would write it like this: `getpid(2)`. This tells\
    \ you that there is a manual page for `getpid` in section 2 of the manpages.\n\
    \n**Why do manpages need multiple sections?** Because a command may be available\
    \ in more than one section, ie. available as both a shell command and a system\
    \ call.\n\nTake `stat(1)` and `stat(2)` as an example.\n\nIn order to access other\
    \ sections of the manpages you can specify it like this on the command line:\n\
    \n```\n$ man 2 getpid\n$ man 3 malloc\n$ man find # same as man 1 find\n```\n\n\
    This nomenclature was not invented for this book, it's a convention that's used\
    \ everywhere ([http://en.wikipedia.org/wiki/Man_page#Usage](http://en.wikipedia.org/wiki/Man_page#Usage))\
    \ when referring to the manpages. So it's a good idea to learn it now and get\
    \ comfortable with seeing it.\n\n## Processes: The Atoms of Unix\n\nProcesses\
    \ are the building blocks of a Unix system. Why? Because **any code that is executed\
    \ happens inside a process**.\n\nFor example, when you launch `ruby` from the\
    \ command line a new process is created for your code. When your code is finished\
    \ that process exits.\n\n```\n$ ruby -e \"p Time.now\"\n```\n\nThe same is true\
    \ for all code running on your system. You know that MySQL server that's always\
    \ running? That's running in its own process. The e-reader software you're using\
    \ right now? That's running in its own process. The email client that's desperately\
    \ trying to tell you you have new messages? You should ignore it by the way and\
    \ keep reading! It also runs in its own process.\n\nThings start to get interesting\
    \ when you realize that one process can spawn and manage many others. We'll be\
    \ taking a look at that over the course of this book.\n\n## Processes Have IDs\n\
    \nEvery process running on your system has a unique process identifier, hereby\
    \ referred to as 'pid'.\n\nThe `pid` doesn't say anything about the process itself,\
    \ it's simply a sequential numeric label. This is how the kernel sees your process:\
    \ as a number.\n\nHere's how we can inspect the current `pid` in a ruby program.\
    \ Fire up `irb` and try this:\n\n```\n# This line will print the pid of the current\
    \ ruby process. This might be an \n# irb process, a rake process, a rails server,\
    \ or just a plain ruby script.\nputs Process.pid\n```\n\nA `pid` is a simple,\
    \ generic representation of a process. Since it's not tied to any aspect of the\
    \ content of the process it can be understood from any programming language and\
    \ with simple tools. We'll see below how we can use the `pid` to trace the process\
    \ details using different utilities.\n\n### Cross Referencing\n\nTo get a full\
    \ picture, we can use `ps(1)` to cross-reference our `pid` with what the kernel\
    \ is seeing. Leaving your `irb` session open run the following command at a terminal:\n\
    \n```\n$ ps -p <ppid-of-irb-process>\n```\n\n## Processes Have Parents\n\nEvery\
    \ process running on your system has a parent process. Each process knows its\
    \ parent process identifier (hereby referred to as 'ppid').\n\nIn the majority\
    \ of cases the parent process for a given process is the process that invoked\
    \ it. For example, you're an OSX user who starts up Terminal.app and lands in\
    \ a bash prompt. Since everything is a process that action started a new Terminal.app\
    \ process, which in turn started a bash process.\n\nThe parent of that new bash\
    \ process will be the Terminal.app process. If you then invoke `ls(1)` from the\
    \ bash prompt, the parent of that `ls` process will be the `bash` process. You\
    \ get the picture.\n\nSince the kernel deals only in pids there is a way to get\
    \ the pid of the current parent process. Here's how it's done in Ruby:\n\n```\n\
    # Notice that this is only one character different from getting the\n pid of the\
    \ current process.\nputs Process.ppid\n```\n\n### System Calls\n\nRuby's `Process.pid`\
    \ maps to `getpid(2)`.\n\nThere is also a global variable that holds the value\
    \ of the current process. You can access it with `$$`.\n\nRuby inherits this behaviour\
    \ from other languages before it (both Perl and bash support `$$`), however *I\
    \ avoid it when possible*. Typing out `Process.pid` in full is much more expressive\
    \ of your intent than the dollar-dollar variable, and less likely to confuse those\
    \ who haven't seen the dollar-dollar before.\n\n### In the Real World\n\nJust\
    \ knowing the pid isn't all useful in itself. So where is it used? A common place\
    \ you'll find pids in the real world is in log files. When you have multiple processes\
    \ it's imperative that you tell which line comes from which process. Through the\
    \ use of commands like `top(1)` or `lsof(1)`.\n\n```\n[58550] [Spyglass::Server]\
