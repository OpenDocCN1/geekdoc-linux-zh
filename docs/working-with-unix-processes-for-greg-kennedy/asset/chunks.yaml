    \ that you pass to `Process.spawn` can also be passed to `POSIX::Spawn.spawn`.\
    \ So you can keep using the same API and yet reap the benefits of faster, more\
    \ resource efficient spawning.\n\nAt a basic level posix_spawn(2) is a subset\
    \ of fork(2). Recall the two discerning attributes of a new child process from\
    \ fork(2): 1) it gets an exact copy of everything that the parent process had\
    \ in memory, and 2) it gets a copy of all the file descriptors that the parent\
    \ process had open.\n\nposix_spawn(2) preserves #2, but not #1\\. That's the big\
    \ difference between the two. So you can expect a newly spawned process to have\
    \ access to any of the file descriptors opened by the parent, but it won't share\
    \ any of the memory. This is what makes posix_spawn(2) faster and more efficient\
    \ than fork(2). But keep in mind that it also makes it less flexible.\n\n### System\
    \ Calls\n\nRuby's `Kernel#system` maps to system(3), `Kernel#exec` maps to execve(2),\
    \ `IO.popen` maps to popen(3), posix-spawn uses posix_spawn(2).\n\n## Ending\n\
    \nWorking with processes in Unix is about two things: abstraction and communication.\n\
    \n### Abstraction\n\nThe kernel has an extremely abstract (and simple) view of\
    \ its processes. As programmers we're used to looking at source code as the differentiator\
    \ between two programs.\n\nWe are masters of many programming languages, using\
    \ each for different purposes. We couldn't possibly write memory-efficient code\
    \ in a language with a garbage collector, we'll have to use C. But we need objects,\
    \ let's use C++. On and on.\n\nBut if you ask the kernel it all looks the same.\
    \ In the end, all of our code is compiled down to something simple that the kernel\
    \ can understand. And when it's working at that level all processes are treated\
    \ the same. Everything gets its numeric identifier and is given equal access to\
    \ the resources of the kernel.\n\nWhat's the point of all this jibber-jabber?\
    \ Using Unix programming lets you twiddle with these knobs a little bit. It lets\
    \ you do things that you can't accomplish when working at the programming language\
    \ level.\n\nUnix programming is programming language agnostic. It lets you interface\
    \ your Ruby script with a C program, and vice versa. It also lets you reuse its\
    \ concepts across programming languages. The Unix Programming skills that you\
    \ get from Ruby will be just as applicable in Python, or node.js, or C. These\
    \ are skills that are about programming in general.\n\n### Communication\n\nBesides\
    \ the basic act of creating new processes, almost everything else we talked about\
    \ was regarding communication. Following the principle of abstraction mentioned\
    \ above, the kernel provides very abstract ways of communicating between processes.\n\
    \nUsing signals any two processes on the system can communicate with each other.\
    \ By naming your processes you can communicate with any user who is inspecting\
    \ your program on the command line. Using exit codes you can send success/failure\
    \ messages to any process that's looking after your own.\n\n### Farewell, But\
    \ Not Goodbye\n\nThat's the end! Congratulations for making it here! Believe it\
    \ or not, you now know more than most programmers about the inner workings of\
    \ Unix processes.\n\nNow that you know the fundamentals you can go out apply your\
    \ newfound knowledge to anything that you work on. Things are going to start making\
    \ more sense for you. And the more you apply your newfound knowledge: the clearer\
    \ things will become. There's no stopping you now.\n\nAnd we haven't even talked\
    \ about networking :) We'll save that one for another edition.\n\nRead the appendices\
    \ at the end of this book for a look at some popular Ruby projects and how they\
    \ use Unix processes to be awesome.\n\nIf you have any feedback on this book,\
    \ find an error or build something cool with your newfound knowledge, I'd love\
    \ to hear it. Send a message to jesse@workingwithunixprocesses.com. Happy coding!\n\
    \n## Appendix: How Resque Manages Processes\n\nThis section looks at how a popular\
    \ Ruby job queue, Resque ([http://github.com/defunkt/resque#readme](http://github.com/defunkt/resque#readme)),\
    \ effectively manages processes. Specifically it makes use of fork(2) to manage\
    \ memory, not for concurrency or speed reasons.\n\n### The Architecture\n\nTo\
    \ understand why Resque works the way it does we need a basic understanding of\
    \ how the system works.\n\nFrom the README:\n\n> Resque is a Redis-backed library\
    \ for creating background jobs, placing those jobs on multiple queues, and processing\
    \ them later.\n\nThe component that we're interested in is the Resque worker.\
    \ Resque workers take care of the 'processing them later' part. The job of a Resque\
    \ worker is to boot up, load your application environment, then connect to Redis\
    \ and try to reserve any pending background jobs. When it's able to reserve one\
    \ such job it works off the job, then goes back to step 1\\. Simple enough.\n\n\
    For an application of non-trivial size one Resque worker is not enough. So it's\
    \ very common to spin up multiple Resque workers in parallel to work off jobs.\n\
    \n### Forking for Memory Management\n\nResque workers employ fork(2) for memory\
    \ management purposes. Let's have a look at the relevant bit of code and then\
    \ dissect it line by line.\n\n```\nif @child = fork\n  srand # Reseeding\n  procline\
    \ \"Forked #{@child} at #{Time.now.to_i}\"\n  Process.wait(@child)\nelse\n  procline\
    \ \"Processing #{job.queue} since #{Time.now.to_i}\"\n  perform(job, &block)\n\
    \  exit! unless @cant_fork\nend\n```\n\nThis bit of code is executed every time\
    \ Resque works off a job.\n\nIf you've read through the Forking chapter then you'll\
    \ already be familiar with the if/else style here. Otherwise go read it now!\n\
    \nWe'll start by looking at the code inside the parent process (ie. inside the\
    \ if block).\n\n```\nsrand # Reseeding\n```\n\nThis line is here simply because\
    \ of a bug ([http://redmine.ruby-lang.org/issues/4338](http://redmine.ruby-lang.org/issues/4338))\
    \ in a certain patchlevel of MRI Ruby 1.8.7.\n\n```\nprocline \"Forked #{@child}\
    \ at #{Time.now.to_i}\"\n```\n\n`procline` is Resque's internal way of updating\
    \ the name of the current process. Remember we noted that you can change the name\
    \ of the current process by setting `$0` but Ruby doesn't include a method for\
    \ it?\n\nThis is Resque's solution. `procline` sets the name of the current process.\n\
    \n```\nProcess.wait(@child)\n```\n\nIf you've read the chapter on `Process.wait`\
    \ then this line of code should be familiar to you.\n\nThe `@child` variable was\
    \ assigned the value of the `fork` call. So in the parent process that will be\
    \ the child pid. This line of code tells the parent process to block until the\
    \ child is finished.\n\nNow we'll look at what happens in the child process.\n\
    \n```\nprocline \"Processing #{job.queue} since #{Time.now.to_i}\"\n```\n\nNotice\
    \ that both the `if` and `else` block make a call to procline. Even though these\
    \ two lines are part of the same logical construct they are being executed in\
    \ two different processes. Since the process name is process-specific these two\
    \ calls will set the name for the parent and child process respectively.\n\n```\n\
    perform(job, &block)\n```\n\nHere in the child process is where the job is actually\
    \ 'performed' by Resque.\n\n```\nexit! unless @cant_fork\n```\n\nThen the child\
    \ process exits.\n\n### Why Bother?\n\nAs mentioned in the first paragraph of\
    \ this chapter, Resque isn't doing this to achieve concurrency or to make things\
    \ faster. In fact, it adds an extra step to the processing of each job which makes\
    \ the whole thing slower. So why go to the trouble? Why not just process job after\
    \ job?\n\nResque uses fork(2) to ensure that the memory usage of its worker processes\
    \ don't bloat. Let's review what happens when a Resque worker forks and how that\
    \ affects the Ruby VM.\n\nYou'll recall that fork(2) creates a new process that's\
    \ an exact copy of the original process. The original process, in this case, has\
    \ preloaded the application environment and nothing else. So we know that after\
    \ forking we'll have a new process with just the application environment loaded."
