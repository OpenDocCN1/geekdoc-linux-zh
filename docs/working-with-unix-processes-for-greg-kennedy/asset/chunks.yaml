  trans: "\n\n### 超过限制\n\n请注意，超过软限制（soft limit）将引发 `Errno::EMFILE`：\n\n```ruby\n#\
    \ 将最大打开文件数设置为 3。我们知道\n# 将达到上限，因为标准流占据了\n# 前文件描述符。\nProcess.setrlimit(:NOFILE,\
    \ 3)\n\nFile.open('/dev/null')\n```\n\n输出：\n\n```\nErrno::EMFILE: Too many open\
    \ files - /dev/null\n```\n\n### 其他资源\n\n可以使用相同的方法来检查和修改其他系统资源的限制。常见的限制包括：\n\n\
    ```ruby\n# 当前用户允许的最大并发进程数。\nProcess.getrlimit(:NPROC)\n\n# 可以创建的最大文件大小。\nProcess.getrlimit(:FSIZE)\n\
    \n# 进程栈段的最大大小。\nProcess.getrlimit(:STACK)\n```\n\n请查看文档 ([`www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit`](http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit))\
    \ 关于 `Process.getrlimit` 获取可用选项的完整列表。\n\n### 现实世界\n\n对于大多数程序，修改系统资源限制并不是常见需求。但对于某些特殊工具，这非常重要。\n\
    \n一个用例是任何需要处理数千个并发网络连接的进程。例如 `httperf(1)` http 性能工具。诸如 `httperf --hog --server\
    \ www --num-conn 5000` 的命令会要求 `httperf(1)` 创建 5000 个并发连接。显然，由于系统的默认软限制，这将会产生问题，因此\
    \ `httperf(1)` 在正确进行测试之前需要增加其软限制。\n\n限制系统资源的另一个现实世界用例是：执行第三方代码并需要将其限制在某些约束范围内。你可以为运行该代码的进程设置限制，并撤销更改限制所需的权限，从而确保它们使用的资源不会超过你的允许范围。\n\
    \n### 系统调用\n\nRuby 的 `Process.getrlimit` 和 `Process.setrlimit` 分别映射到 `getrlimit(2)`\
    \ 和 `setrlimit(2)`。\n\n## 进程拥有环境\n\n在此意义上，环境指的是所说的“环境变量”。环境变量是存储进程数据的键值对。\n\n\
    每个进程都从其父进程继承环境变量。它们由父进程设置并被其子进程继承。环境变量是进程级别的，并且对每个进程来说是全局的。\n\n这里是在 `bash` shell\
    \ 中设置环境变量、启动 Ruby 进程并读取该环境变量的简单示例。\n\n```bash\n$ MESSAGE='wing it' ruby -e \"\
    puts ENV['MESSAGE']\"\n```\n\n`VAR=value` 语法是 `bash` 设置环境变量的方式。在 Ruby 中，也可以使用\
    \ `ENV` 常量来完成相同的操作。\n\n```ruby\n# 同样的操作，只是位置反过了！\nENV['MESSAGE'] = 'wing it'\n\
    system \"echo $MESSAGE\"\n```\n\n这两个示例都打印了：\n\n```\nwing it\n```\n\n在 `bash` 中，环境变量使用语法\
    \ `$VAR` 进行访问。从这几个示例可以看出，环境变量可以用于在运行不同语言的进程（在本例中 `bash` 和 `ruby`）之间共享状态。\n\n###\
    \ 它是一个 Hash 吗？\n\n尽管 `ENV` 使用了哈 风格的访问 API，但它实际上并不是一个 `Hash`。例如，它实现了 `Enumerable`\
    \ 和一些 `Hash` API，但并非全部。像 `merge` 这样的关键方法*并没有*实现。因此你可以执行 `ENV.has_key?` 等操作，但不要指望所有的\
    \ hash 操作都能生效。\n\n```ruby\nputs ENV['EDITOR']\nputs ENV.has_key?('PATH')\nputs\
    \ ENV.is_a?(Hash)\n```\n\n输出：\n\n```\nvim\ntrue\nfalse\n```\n\n### 现实世界\n\n在现实世界中，环境变量有许多用途。这里是\
    \ Ruby 社区中常见的工作流：\n\n```bash\n$ RAILS_ENV=production rails server\n$ EDITOR=mate\
    \ bundle open actionpack\n$ QUEUE=default rake resque:work\n```\n\n环境变量通常被用作向命令行程序接受输入的通用方式。任何终端（Unix\
    \ 或 Windows）已经支持它们，且大多数程序员对它们都很熟悉。使用环境变量的开销通常比显式解析命令行选项要小。\n\n### 系统调用\n\n没有用于直接操作环境变量的系统调用，但\
    \ C 库函数 `setenv(3)` 和 `getenv(3)` 完成了大部分工作。另请查看 `environ(7)` 览。\n\n## 进程拥有参数\n\
    \n每个进程都可以访问一个名为 `ARGV` 的特殊数组。其他编程语言的实现可能略有不同，但每个都有称为 'argv' 的东西。\n\n`argv` 是“argument\
    \ vector”（参数向量）的缩写。换句话之：参数的向量或数组。它保存了命令行传递给当前进程的参数。这里有一个检查 `ARGV` 并传递一些简单选项的示例。\n\
    \n```bash\n$ cat argv.rb\np ARGV\n$ ruby argv.rb foo bar -va\n[\"foo\", \"bar\"\
    , \"-va\"]\n```\n\n### 它是一个数组！\n\n与上一章不同（上一章我们学到 `ENV` 不是 `Hash`），`ARGV` 仅仅是一个\
    \ `Array`。你可以向它添加元素、删除元素、修改元素。\n\n### 现实世界\n\n`ARGV` 最常见的用例可能是接受文件名。有很多 Ruby 库可以处理输入。但现在你了解了\
    \ `ARGV` 的工作原理，对于简单的标志可以跳过额外的开销并手动处理。\n\n```ruby\n# 用户是否请求帮助？\nARGV.include?('--help')\n\
    # 获取 -c 选项的值\nARGV.include?('-c') && ARGV[ARGV.index('-c') + 1]\n```\n\n## 进程拥有名称\n\
    \nUnix 进程通信其状态的方式非常少。\n\n程序员绕过了这个问题并发明了日志文件等工具。日志文件允许进程通过写入文件系统通信关于其状态的任何信息，但这运行在文件系统层面而不是进程固有的。\n\
    \n同样，进程可以使用网络打开套与其他进程通信。但再次，这运行在进程本身不同的层面。\n\n有两个机制可以在进程层面运行并用于通信信息。一个是进程名称，另一个是退出码。\n\
    \n### 命名进程\n\n系统上的每个进程都有名称。例如，当你启动一个 `irb` 会话时，该进程被命名为 'irb'。进程名称的巧妙在于它们可以在运行时更改并作为通信的方法。\n\
    \n在 Ruby 中，你可以通过 `$PROGRAM_NAME` 访问当前进程的名称。同样，你可以给该全局变量赋值来更改当前进程的名称。\n\n```ruby\n\
    puts $PROGRAM_NAME\n\n10.downto(1) do |num|\n  $PROGRAM_NAME = \"Process: #{num}\"\
    \n  puts $PROGRAM_NAME\nend\n```\n\n输出：\n\n```\nirb\nProcess: 10\nProcess: 9\n\
    Process: 8\nProcess: 7\nProcess: 6\nProcess: 5\nProcess: 4\nProcess: 3\nProcess:\
    \ 2\nProcess: 1\n```\n\n作为一个有趣的练习，你可以启动一个 `irb` 会话，打印 pid 并更改进程名称。然后你可以使用 `ps(1)`\
    \ 工具查看系统上反映的更改。\n\n"
- fmt: '

    Unfortunately this global variable (and its mirror `$0`) is the only mechanism
    provided by Ruby for this feature. There is not a more intent-revealing way to
    change the name of the current process.


    ## In the Real World


    To see an example of how this is used in a real project read through *How Resque
    Manages Processes* in the appendices.


    ## Processes Have Exit Codes


    When a process comes to an end it has one last chance to make its mark on the
    world: its exit code. Every process that exits does so with a numeric exit code
    (0-255) denoting whether it exited successfully or with an error.


    Traditionally, a process that exits with `an exit code of 0 is said to be successful`.
    Any other exit code denotes an error, with different codes pointing to different
    errors.


    Though traditionally they''re used to denote different errors, they''re really
    just a channel for communication. All you need to do is handle the different exit
    codes that a process may exit with in a way that suits your program and you''ve
    gotten away from the traditions.


    It''s usually a good idea to stick with the ''0 as success'' exit code tradition
    so that your programs will play nicely with other Unix tools.


    ## How to Exit a Process


    There are several ways you can exit a process in Ruby, each for different purposes.


    ### exit


    The simplest way to exit a process is using `Kernel#exit`. This is also what happens
    implicitly when your script ends without an explicit exit statement.


    ```

    # This will exit the program with the success status code (0).

    exit

    ```


    ```

    # You can pass a custom exit code to this method

    exit 22

    ```


    ```

    # When Kernel#exit is invoked, before exiting Ruby invokes any blocks

    # defined by Kernel#at_exit.

    at_exit { puts ''Last!'' }

    exit

    ```


    will output:


    ```

    Last!

    ```


    ### exit!


    `Kernel#exit!` is almost exactly the same as `Kernel#exit`, but with two key differences.
    The first is that it sets an unsuccessful status code by default (1), and the
    second is that it will not invoke any blocks defined using `Kernel#at_exit`.


    ```

    # This will exit the program with a status code 1.

    exit!

    ```


    ```

    # You can still pass an exit code.

    exit! 33

    ```


    ```

    # This block will never be invoked.

    at_exit { puts ''Silence!'' }

    exit!

    ```


    ### abort


    `Kernel#abort` provides a generic way to exit a process unsuccessfully. `Kernel#abort`
    will set the exit code to 1 for the current process.


    ```

    # Will exit with exit code 1.

    abort

    ```


    ```

    # You can pass a message to Kernel#abort. This message will be printed

    # to STDERR before the process exits.

    abort "Something went horribly wrong."

    ```


    ```

    # Kernel#at_exit blocks are invoked when using Kernel#abort.

    at_exit { puts ''Last!'' }

    abort "Something went horribly wrong."

    ```


    will output:


    ```

    Something went horribly wrong.

    Last!

    ```


    ### raise


    A different way to end a process is with an unhandled exception. This is something
    that you never want to happen in a production environment, but it''s almost always
    happening in development and test environments.


    Note that `Kernel#raise`, unlike the previous methods, will not exit the process
    immediately. It simply raises an exception that *may* be rescued somewhere up
    the stack. If the exception is not rescued anywhere in the codebase then the unhandled
    exception will cause the process to exit.


    Ending a process this way will still invoke any at_exit handlers and will print
    the exception message and backtrace to `STDERR`.


    ```

    # Similar to abort, an unhandled exception will set the exit code to 1.

    raise ''hell''

    ```


    ## Processes Can Fork


    ### Use the fork(2), Luke


    Forking is one of the most powerful concepts in Unix programming. The `fork(2)`
    system call allows a running process to create new process programmatically. This
    new process is an exact copy of the original process.


    Up until now we''ve talked about creating processes by launching them from the
    terminal. We''ve also mentioned low level operating system processes that create
    other processes: `fork(2)` is how they do it.


    When forking, the process that initiates the `fork(2)` is called the "parent",
    and the newly created process is called the "child".


    `the child process inherits a copy of all of the memory in use by the parent process,
    as well as any open file descriptors belonging to the parent process.` Let''s
    take a moment to review child processes from the eye of our first three chapters.


    Since the child process is an entirely new process, it gets its own unique `pid`.


    The parent of the child process is, obviously, its parent process. So its `ppid`
    is set to the `pid` of the process that initiated the `fork(2)`.


    The child process inherits any open file descriptors from the parent at the time
    of the `fork(2)`. It''s given the same map of file descriptor numbers that the
    parent process has. In this way the two processes can share open files, sockets,
    etc.


    The child process inherits a copy of everything that the parent process has in
    main memory. In this way a process could load up a large codebase, say a Rails
    app, that occupies 500MB of main memory. Then this process can fork 2 new child
    processes. Each of these child processes would effectively have their own copy
    of that codebase loaded in memory.


    The call to `fork` returns near-instantly so we now have 3 processes with each
    using 500MB of memory. Perfect for when you want to have multiple instances of
    your.

