    \ any shared values it can continue reading \n  # from the same memory location\
    \ as the parent process.\n  p arr\nend\n```\n\n```\narr = [1,2,3]\n\nfork do\n\
    \  # At this point the child process has been initialized.\n  # Because of CoW\
    \ the arr variable hasn't been copied yet.\n  arr << 4\n  # The above line of\
    \ code modifies the array, so a copy of\n  # the array will need to be made for\
    \ this process before\n  # it can modify it. The array in the parent process remains\n\
    \  # unchanged.\nend\n```\n\nThis is a big win when using fork(2) as it saves\
    \ on resources. It means that fork(2) is fast since it doesn't need to copy any\
    \ of the physical memory of the parent. It also means that child processes only\
    \ get a copy of the data they need, the rest can be shared.\n\nCoW is great, but\
    \ unfortunately it's **not supported in MRI or Rubinius**.\n\nIn order for CoW\
    \ to work properly programs need to be written in a CoW friendly manner. In other\
    \ words, they need to manage memory in a way that makes CoW possible. MRI and\
    \ Rubinius are not written this way.\n\n**Why not?**\n\nMRI's garbage collector\
    \ uses a 'mark-and-sweep' algorithm. In a nutshell this means that when the GC\
    \ is invoked it must iterate over every known object and write to it, either saying\
    \ it should be garbage collected or it shouldn't. The important point here is\
    \ that every time the GC runs every object in memory is written to.\n\nSo, after\
    \ forking, the first time that the GC runs will retract the benefit that copy-on-write\
    \ provides.\n\nThis is one of the main reasons why Ruby Enterprise Edition ([http://www.rubyenterpriseedition.com/](http://www.rubyenterpriseedition.com/))\
    \ was created. *ree is CoW friendly*. For a deeper look at this issue and how\
    \ Ruby Enterprise Edition solves it check out their Google Tech Talk: Building\
    \ a More Efficient Ruby Interpreter ([http://www.youtube.com/watch?v=ghLCtCwAKqQ](http://www.youtube.com/watch?v=ghLCtCwAKqQ)).\n\
    \n### MRI / RBX users\n\nWhat does this mean for users of other Ruby VMs?\n\n\
    Simply, when forking processes you will not reap the benefits of CoW. Child processes\
    \ will require a complete copy of the memory owned by the calling process.\n\n\
    If you're building something that will depend heavily on fork(2) then have a serious\
    \ look at Ruby Enterprise Edition. Looking ahead to the future, MRI trunk now\
    \ has patches ([http://bugs.ruby-lang.org/issues/5839](http://bugs.ruby-lang.org/issues/5839))\
    \ that make the GC CoW-friendly. So the 2.0 release of Ruby will ship with a CoW-friendly\
    \ GC!\n\n## Processes Can Wait\n\nIn the examples of fork(2) up until now we have\
    \ let the parent process continue on in parallel with the child process. In some\
    \ cases this led to weird results, such as when the parent process exited before\
    \ the child process.\n\nThat kind of scenario is really only suitable for one\
    \ use case, fire and forget. It's useful when you want a child process to handle\
    \ something asynchronously, but the parent process still has its own work to do."
