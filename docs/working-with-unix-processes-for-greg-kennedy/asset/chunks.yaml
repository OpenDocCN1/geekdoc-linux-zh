  trans: "\n随后子进程将开始处理任务。这正是内存使用可能出现问题的地方。后台任务可能需要将图像文件加载到主内存中处理，或者从数据库中获取大量的 `ActiveRecord`\
    \ 对象，或者任何需要使用大量主内存的操作。\n\n一旦子进程完成任务，它就会退出，从而将其所有内存释放回操作系统（OS）进行清理。然后，原始进程就可以恢复运行，此时再次只加载应用程序环境。\n\
    \n因此，每当 Resque 执行完一个任务后，在内存使用方面你又回到了一个干净的状态。这意味着在正在处理任务时，内存使用可能会出现峰值，但它应该总是回到那个理想的基准线。\n\
    \n### GC（垃圾回收）不是为我们清理内存的吗？\n\n嗯，是的，但它做得并不完美。只能说还可以吧。事实是，MRI 的 `GC` 很难释放那些它不再需要的内存。\n\
    \n当 Ruby 虚拟机启动时，内核会为它分配一段特定的主内存。当它用尽了所有已的内存时，它需要向内核请求另一块主内存。\n\n由于 Ruby 的 `GC`\
    \ 存在许多问题（天真的的方法、磁盘碎片等），虚拟机很少能将内存块释放回内核。因此，Ruby 进程的内存使用可能会随着时间推移而增长，而不是缩小。现在 Resque\
    \ 的方法开始变得合理了！\n\n如果 Resque 工作进程简单地在每个任务可用时处理它们，那么它将无法维持那种良好的内存使用基准水平。一旦它处理一个需要大量主内存的任务，这些内存就会一直被工作进程占用，直到它退出。\n\
    \n即使随后的任务需要的内存少得多，Ruby 也很难将这些内存还给内核。因此，工作进程不可避免地随着时间推移而变得越来越，永远不会缩小。\n\n得益于 `fork(2)`的力量，Resque\
    \ 工作进程是可靠的，在处理一定数量的任务后不需要重启。\n\n## 录：Unicorn 如何收割工作进程\n\n在研究 Ruby 语言中的 Unix 编程时，如果不多次提到\
    \ Unicorn Web 服务器 ([`unicorn.bogomips.org`](http://unicorn.bogomips.org)) 将是不完整的。事实上，该项目已经在书中被多次提到。\n\
    \n这有什么大大的？Unicorn 是一个 Web 服务器，它试图尽可能将责任推给内核。它使用了大量的 Unix 编程技术。代码库中充满了 Unix 编程技巧。\n\
    \n不仅如此，它还是高效且可靠的。Github 和 Shopify 等许多大型 Ruby 网站都在使用它。\n\n关键点是，如果这本书激发了你的兴趣，并且你想学习更多关于\
    \ Ruby 中的 Unix 编程，那么你应该深入研究 Unicorn 的奥秘。这可能需要你多次进入这只神话巨兽的肚子里，但你将会获得更好的理解和新的想法。\n\
    \n### 收割什么？\n\n在我们深入代码之前，我想提供一些关于 Unicorn 如何工作的背景信息。从非常高层次来说，Unicorn 是一个预叉（pre-forking）Web\
    \ 服务器。\n\n这意味着你启动它并告诉它希望拥有多少工作进程。它首先初始化网络套字并加载你的应用程序。然后它使用 `fork(2)` 创建工作进程。它使用了我们在“分叉”章节中提到的主从工作模式。\n\
    \nUnicorn 主进程对每个工作进程都保持心跳，并确保它们处理请求的时间不会过长。当你告诉 Unicorn 主进程退出时，会使用下面的代码。正如我们在（分叉）章节中介绍过的，如果父进程在退出之前没有杀死子进程，子进程将继续运行而不会停止。\n\
    \n因此，让 Unicorn 在退出前完成自我清理是非常重要的。下面的代码作为 Unicorn 退出程序的一部分被调用。在调用这段代码之前，它会向每个工作进程发送\
    \ `QUIT` 信号，指示它们优雅地退出。\n\n下面的代码被 Unicorn 用于清理它对工作进程的内部表示，并确保它们都正常退出。\n\n让我们深入吧。\n\
    \n```\n# 收割所有未收割的工作进程\ndef reap_all_workers\n  begin\n    wpid, status = Process.waitpid2(-1,\
    \ Process::WNOHANG)\n    wpid or return\n    if reexec_pid == wpid\n      logger.error\
    \ \"reaped #{status.inspect} exec()-ed\"\n      self.reexec_pid = 0 \n      self.pid\
    \ = pid.chomp('.oldbin') if pid \n      proc_name 'master'\n    else\n      worker\
    \ = WORKERS.delete(wpid) and worker.close rescue nil \n      m = \"reaped #{status.inspect}\
    \ worker=#{worker.nr rescue 'unknown'}\"\n      status.success? ? logger.info(m)\
    \ : logger.error(m)\n    end \n  rescue Errno::ECHILD\n    break\n  end while\
    \ true\nend\n```\n\n我们逐行来看：\n\n```\nbegin\n  ...\nend while true\n```\n\n我首先想要引起你注意的事实是，在该方法的第一行开始的\
    \ `begin` 块实际上启动了一个无限循环。在 Ruby 中有其他方法可以编写无限循环，但重要的部分是要记住我们正处于一个无限循环中，因此我们需要一个硬性的\
    \ `return` 或 `break` 来结束这个方法。\n\n```ruby\nwpid, status = Process.waitpid2(-1,\
    \ Process::WNOHANG)\n```\n\n这一行应该看起来有些熟悉。这一行包含了一些熟悉的参数。我们在 `Process.wait` 章节中看过\
    \ `waitpid2`，但我们没有传递 `pid` 作为第一个选项。\n\n所以，指定有效的 `pid` 作为第一个选项会导致 `waitpid` 只等待该\
    \ `pid`。如果你传递 `-1` 给 `waitpid` 会发生什么？\n\n传递 `-1` 等待*任何*子进程退出。事实是该方法的默认值。如果你没有指定\
    \ `pid`，它就会使用 `-1`。\n\n```if reexec_pid == wpid\n  logger.error \"reaped #{status.inspect}\
    \ exec()-ed\"\n  self.reexec_pid = 0 \n  self.pid = pid.chomp('.oldbin') if pid\
    \ \n  proc_name 'master'\n```\n\n我不想花太多时间谈论这部分。“reexec” 的内容涉及到 Unicorn 的内部机制，特别是它是如何处理零停机重启的。也许我可以在未来的报告涵盖这个过程。\n\
    \n我会引起你注意的是对 `proc_name` 的调用。这类似于 Resque 章节中的 `procline` 方法。Unicorn 也有一个更改当前进程显示名称的方法。\n\
    \n```\nelse\n  worker = WORKERS.delete(wpid) and worker.close rescue nil \n```\n\
    \nUnicorn 在其 `WORKERS` 常量中存储了当前活跃工作进程的列表。`WORKERS` 是哈希，键是工作进程的 pid，值是 `Unicorn::Worker`\
    \ 的实例。\n\n"
- fmt: "\nSo this line removes the worker process from Unicorn's internal tracking\
    \ list (`WORKERS`) and calls `#close` on the worker instance, which closes its\
    \ no longer needed heartbeat mechanism.\n\n```\nm = \"reaped #{status.inspect}\
    \ worker=#{worker.nr rescue 'unknown'}\"\n```\n\nThese lines craft a log message\
    \ based on the `status` returned from the `Process.waitpid2` call.\n\nThe string\
    \ is crafted by first inspecting the `status` variable. What does that look like?\
    \ Something like this:\n\n```\n#<Process::Status: pid=32227,exited(0)>\n# or\n\
    #<Process::Status: pid=32308,signaled(SIGINT=2)>\n```\n\nIt includes the `pid`\
    \ of the ended process, as well as the way it ended. In the first line the process\
    \ exited itself with an exit code of 0. In the second line the process was killed\
    \ with a signal, `SIGINT` in this case. So a line like that will be added to the\
    \ Unicorn log.\n\nThe second part of the log line `worker.nr` is Unicorn's internal\
    \ representation of the worker's number.\n\n```\nstatus.success? ? logger.info(m)\
    \ : logger.error(m)\n```\n\nThis line takes the crafted log message and sends\
    \ it to the logger. It uses the `success?` method on the `status` object to log\
    \ this message as at the INFO level or the ERROR level.\n\nThe `success?` method\
    \ will only return true in one case, when the process exited with an exit code\
    \ of 0. If it exited with a different code it will return `false`. If it was killed\
    \ by a signal, it will return `nil`.\n\n```\nrescue Errno::ECHILD\n  break\n```\n\
    \nThis is part of the top-level `begin` statement in this method. If this exception\
    \ is raised then the endless loop that is this method `break`s and it will return.\n\
    \nThe `Errno::ECHILD` exception will be raised by `Process.waitpid2` (or any of\
    \ its cousins) if there are no child processes for the current processes. If that\
    \ happens in this case then it means the job of this method is done! All of the\
    \ child processes have been reaped. So it returns.\n\n### Conclusion\n\nIf this\
    \ bit of code interested you and you want to learn more about Unix Programming\
    \ in Ruby, Unicorn is a great resource. See the official site at [http://unicorn.bogomips.org](http://unicorn.bogomips.org)\
    \ and go learn!\n\n## Appendix: Preforking Servers\n\nI'm glad you made it this\
    \ far because this chapter may be the most action-packed in the whole book. Preforking\
    \ servers bring together a lot of the concepts that are explained in this book\
    \ into a powerful, highly-efficient approach to solving certain problems.\n\n\
    There's a good chance that you've used either Phusion Passenger ([http://www.modrails.com/](http://www.modrails.com))\
    \ or Unicorn ([http://unicorn.bogomips.org](http://unicorn.bogomips.org)). Both\
    \ of those servers, and Spyglass (the web server included with this book), are\
    \ examples of preforking servers.\n\nAt the core of all these projects is the\
    \ preforking model. There are a few things about preforking that make it special,\
    \ here are 3:\n\n1. Efficient use of memory.\n2. Efficient load balancing.\n3.\
    \ Efficient sysadminning.\n\nWe'll look at each in turn.\n\n### Efficient use\
    \ of memory\n\nIn the chapter on forking we discussed how `fork(2)` creates a\
    \ new process that's an *exact copy* of the calling (parent) process. This includes\
    \ anything that the parent process had in memory at the time.\n\n#### Loading\
    \ a Rails App\n\nOn my Macbook Pro loading only Rails 3.1 (no libraries or application\
    \ code) takes in the neighbourhood of 3 seconds. After loading Rails the process\
    \ is consuming about 70MB of memory.\n\nWhether or not these numbers are exactly\
    \ the same on your machine isn't significant for our purposes. I'll be referring\
    \ to these as a baseline in the following examples.\n\nPreforking uses memory\
    \ more efficiently than does spawning multiple unrelated processes. For comparison,\
    \ this is like running Unicorn with 10 worker processes compared to running 10\
    \ instances of Mongrel (a non-preforking server).\n\nLet's review what will happen\
    \ from the standpoint of processes, first looking at Mongrel, then at Unicorn,\
    \ when we boot up 10 instances of each server.\n\n#### Many Mongrels\n\nBooting\
    \ up 10 Mongrel processes in parallel will look about the same as booting up 10\
    \ Mongrel processes serially.\n\nWhen booting them in parallel all 10 processes\
    \ will be competing for resources from the kernel. Each will be consuming resources\
    \ to load Rails, and each can be expected to take the customary 3 seconds to boot.\
    \ In total, that's 30 seconds. On top of that, each process will be consuming\
    \ 70MB of memory once Rails has been loaded. In total, that's 700MB of memory\
    \ for 10 processes.\n\nA preforking server can do better.\n\n#### Many Unicorn\n\
    \nBooting up 10 Unicorn workers will make use of 11 processes. One process will\
    \ be the master, babysitting the other worker processes, of which there are 10.\n\
    \nWhen booting Unicorn only one process, the master process, will load Rails.\
    \ There won't be competition for kernel resources.\n\nThe master process will\
    \ take the customary 3 seconds to load, and forking 10 processes will be more-or-less\
    \ instantaneous. The master process will be consuming 70MB of memory to load Rails\
    \ and, thanks to copy-on-write, the child processes should not be using any memory\
    \ on top of what the master was using.\n\nThe truth is that it does take some\
    \ time to fork a process (it's not instantaneous) and that there is some memory\
    \ overhead for each child process. These values are negligible compared to the\
    \ overhead of booting many Mongrels. Preforking wins.\n\nKeep in mind that the\
    \ benefits of copy-on-write are forfeited if you're running MRI. To reap these\
    \ benefits you need to be using REE.\n\n### Efficient load balancing\n\nI already\
    \ highlighted the fact that `fork(2)` creates an *exact copy* of the calling process.\
    \ This includes any file descriptors that the parent process has open.\n\n####\
    \ The Very Basics of Sockets\n\nEfficient load balancing has a lot to do with\
    \ how sockets work. Since we're talking about web servers: sockets are important.\
    \ They're at the very core of networking. As I hinted earlier: sockets and networking\
    \ are a complex topic, too big to fit into this book. But you need to understand\
    \ the very basic workflow in order to understand this next part.\n\nUsing a socket\
    \ involves multiple steps: 1) a socket is opened and binds to a unique port, 2)\
    \ a connection is accepted on that socket using `accept(2)`, and 3) Data can be\
    \ read from this connection, written to the connection, and ultimately the connection\
    \ is closed. The socket stays open, but the connection is closed.\n\nTypically\
    \ this would happen in the same process. A socket is opened, then the process\
    \ waits for connections on that socket. The connection is handled, closed, and\
    \ the loop starts over again.\n\nPreforking servers use a different workflow to\
    \ let the kernel balance heavy load across the socket. Let's look at how that's\
    \ done.\n\nIn servers like Unicorn and Spyglass the first thing that the master\
    \ process does is open the socket, before even loading the Rails app. This is\
    \ the socket that is available for external connections from web clients. But\
    \ the master process *does not* accept connections. Thanks to the way `fork(2)`\
    \ works, when the master process forks worker processes each one gets a copy of\
    \ the open socket.\n\nThis is where the magic happens.\n\nEach worker process\
    \ has an exact copy of the open socket, and each worker process attempts to accept\
    \ connections on that socket using `accept(2)`. This is where the kernel takes\
    \ over and balances load across the 10 copies of the socket. It ensures that one,\
    \ and only one, process can accept each individual connection. Even under heavy\
    \ load the kernel ensures that the load is balanced and that only one process\
    \ handles each connection.\n\nCompare this to how Mongrel achieves load balancing.\n"
