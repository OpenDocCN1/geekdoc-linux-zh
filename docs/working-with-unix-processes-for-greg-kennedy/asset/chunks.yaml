  trans: "\n因此，你必须在 `CHLD` 信号处理程序中处理 `Errno::ECHILD` 异常。此外，如果你不知道正在等待多少个子进程，你应该捕捉该异常并对其进行妥善处理。\n\
    \n### 信号入门\n\n这是我们首次尝试 Unix 信号（Signals）。信号是异步通信。当进程接收到来自内核的信号时，它可以执行以下操作之一：\n\n\
    1. 忽略信号\n2. 执行指定的动作\n3. 执行默认动作\n\n### 信号从何而来？\n\n从技术上讲，信号是由内核发送的，就像手机运营商发送短信一样。但短信有原始的发送者，信号也是如此。信号通过内核作为中间人，从一个进程发送到另一个进程。\n\
    \n信号的原始意图是指定杀死进程的不同方式。让我们从这里开始。\n\n让我们启动两个 Ruby 程序，并用其中一个来杀死掉另一个。\n\n对于这些示例，我们不会使用\
    \ `irb`，因为其内部定义了自己的信号处理程序，这会干扰我们的演示。相反，我们将直接使用 `ruby` 程序本身。\n\n尝试一下这个：在不带任何参数的情况下启动\
    \ `ruby` 程序。输入一些代码。按下 Ctrl-D。\n\n这会执行你输入的代码然后退出。\n\n使用上述技术启动两个 `ruby` 进程，我们将使用信号杀死其中一个。\n\
    \n1. 在第一个 `ruby` 会话中，执行以下代码：\n\n```\nputs Process.pid\nsleep # 这样我们就有时间给它发送信号\n\
    ```\n\n2. 在第二个 `ruby` 会话中执行以下命令，用信号杀死第一个会话：\n\n```\nProcess.kill(:INT, <第一个会话的\
    \ pid>)\n```\n\n因此，第二个进程向第一个进程发送了 \"INT\" 信号，导致其退出。\"INT\" 是 \"INTERRUPT\"（中断）的缩写。\n\
    \n当进程接收到此信号时，系统的默认行为是中断它正在执行的任何操作并立即退出。\n\n### 宏观视图\n\n下表显示了 Unix 系统上常见的支持信号。每个\
    \ Unix 进程都能响应这些信号，并且任何信号都可以发送到任何进程。\n\n在命名信号时，名称中的 `SIG` 部分是可选的。表格中的 Action 列描述了每个信号的默认动作：\n\
    \n**Term**: 意味着进程将立即终止\n**Core**: 意味着进程将立即终止并转储核心（堆栈跟踪）\n**Ign**: 意味着进程将忽略该信号\n\
    **Stop**: 意味着进程将停止（即暂停）\n**Cont**: 意味着进程将恢复（即取消暂停）\n\n```\nSignal   Value    \
    \ Action   Comment\n-------------------------------------------------------------------------\n\
    SIGHUP      1       Term    检测到控制终端挂断\n                                      \
    \  或控制进程死亡\nSIGINT      2       Term    来自键盘的中断\nSIGQUIT     3       Core    来自键盘的退出\n\
    SIGILL          4       Core    非法指令\nSIGABRT         6       Core    来自 abort(3)\
    \ 的中止信号\nSIGFPE          8       Core    浮点数异常\nSIGKILL         9       Term \
    \   杀死信号\nSIGSEGV        11       Core    无效的内存引用\nSIGPIPE        13       Term\
    \    管道破裂：向没有读者的管道写入\nSIGALRM        14       Term    来自 alarm(2) 的定时器信号\nSIGTERM\
    \        15       Term    终止信号\nSIGUSR1     30,10,16    Term    用户自定义信号 1\nSIGUSR2\
    \     31,12,17    Term    用户自定义信号 2\nSIGCHLD     20,17,18    Ign     子进程停止或终止\n\
    SIGCONT     19,18,25    Cont    停止后继续\nSIGSTOP     17,19,23    Stop    停止进程\n\
    SIGTSTP     18,20,24    Stop    在 tty 处输入的停止\nSIGTTIN     21,21,26    Stop   \
    \ 后台进程的 tty 输入\nSIGTTOU     22,22,27    Stop    后台进程的 tty 输出\n```\n\n信号 `SIGKILL`\
    \ 和 `SIGSTOP` 无法被捕获、阻塞或忽略。\n\n这个表看起来可能有些突如其来，但它让你对向进程发送特定信号时可能预期的情况有一个大致的了解。你可以看到，默认情况下，大多数信号都会终止进程。\n\
    \n注意的是 `SIGUSR1` 和 `SIGUSR2` 信号很有趣。这些信号的动作特意留给你的进程来定义。我们很快就会看到，我们可以自由地重新定义任何喜欢的信号动作，但这两个信号是供你使用的。\n\
    \n### 重新定义信号\n\n让我们回到我们的两个 `ruby` 会话并玩点花。\n\n1. 在第一个 `ruby` 会话中，使用以下代码重新定义 `INT`\
    \ 信号的行为：\n\n```\nputs Process.pid\ntrap(:INT) { print \"Na na na, you can't get\
    \ me\" }\nsleep # 这样我们就有时间给它发送信号\n```\n\n现在我们的进程在接收到 `INT` 信号时不会退出。\n\n2. 在第二个\
    \ `ruby` 会话中执行以下命令，注意第一个进程正在嘲讽我们！\n\n```\nProcess.kill(:INT, <第一个会话的 pid>)\n```\n\
    \n3. 你可以尝试使用 Ctrl-C 来杀死第一个会话，你会发现它的响应是一样的！\n\n4. 但如表所示，有些信号是无法重新定义的。`SIGKILL`\
    \ 将显示谁才是老大。\n\n```\nProcess.kill(:KILL, <第一个会话的 pid>)\n```\n\n### 忽略信号\n\n1. 在第一个\
    \ `ruby` 会话中使用以下代码：\n\n```ruby\nputs Process.pid\ntrap(:INT, \"IGNORE\")\nsleep\
    \ # 这样我们就有时间给它发送信号\n```\n\n2. 在第二个 `ruby` 会话中执行以下命令，注意第一个进程不受影响。\n\n```\nProcess.kill(:INT,\
    \ <第一个会话的 pid>)\n```\n\n### 信号处理程序是全局的\n\n信号是一个强大的工具，在某些情况下非常完美。但要记住，捕捉信号就像使用全局变量，你可能会覆盖其他代码依赖的内容。与全局变量不同，信号处理程序无法命名空间。\n\
    \n### 友好地重新定义信号\n\n有一种方法可以保留其他代码定义的处理器，这样你的信号处理程序就不会破坏它们。它看起来像这样：\n\n```ruby\n\
    trap(:INT) { puts '这是第一个信号处理器' }\n\nold_handler = trap(:INT) {\n  old_handler.call\n\
    \  puts '这是第二个处理器'\n  exit\n}\nsleep # 这样我们就有时间给它发送信号\n```\n\n只需按下 Ctrl-C 查看效果。两个信号处理程序都被调用了。\n\
    \n现在让我们看看能否保留系统的默认行为。按下 Ctrl-C 执行以下代码。\n\n```ruby\nsystem_handler = trap(:INT)\
    \ {\n  puts '即将退出！'\n  system_handler.call\n}\nsleep # 这样我们就有时间给它发送信号\n```\n\n\
    :/ 所以我们无法通过这种技术保留系统的默认行为，但我们可以保留已定义的 Ruby 代码处理器。\n"
- fmt: "\nWhether or not you decide to preserve previously defined signal handlers\
    \ is up to you, just make sure you know why you're doing it. If you simply want\
    \ to wire up some behaviour to clean up resources before exiting you can use an\
    \ `at_exit` hook, which we touched on in the chapter about exit codes.\n\n###\
    \ When Can't You Receive Signals?\n\nYour process can receive a signal anytime.\
    \ That's the beauty of them! They're asynchronous.\n\nYour process can be pulled\
    \ out of a busy for-loop into a signal handler, or even out of a long `sleep`.\
    \ Your process can even be pulled from one signal handler to another if it receives\
    \ one signal while processing another. But, as expected, it will always go back\
    \ and finish the code in all the handlers that are invoked.\n\n### In the Real\
    \ World\n\nWith signals, any process can communicate with any other process on\
    \ the system, so long as it knows its pid. This makes signals a very powerful\
    \ communication tool. It's common to send signals from the shell using `kill(1)`.\n\
    \nIn the real world signals are mostly used by long running processes like servers\
    \ and daemons. And for the most part it will be the human users who are sending\
    \ signals rather than automated programs.\n\nFor instance, the Unicorn web server\
    \ ([http://unicorn.bogomips.org](http://unicorn.bogomips.org)) responds to the\
    \ `INT` signal by killing all of its processes and shutting down immediately.\
    \ It responds to the `USR2` signal by re-executing itself for a zero-downtime\
    \ restart. It responds to the `TTIN` signal by incrementing the number of worker\
    \ processes it has running.\n\nSee the SIGNALS file included with Unicorn ([http://unicorn.bogomips.org/SIGNALS.html](http://unicorn.bogomips.org/SIGNALS.html))\
    \ for a full list of the signals it supports and how it responds to them.\n\n\
    The memprof project has a interesting example of being a friendly citizen when\
    \ handling signals ([https://github.com/ice799/memprof/blob/d4bc228aca323b58fea92dbde20c1f8ec36e5386/lib/memprof/signal.rb#L8-16](https://github.com/ice799/memprof/blob/d4bc228aca323b58fea92dbde20c1f8ec36e5386/lib/memprof/signal.rb#L8-16)).\n\
    \n### System Calls\n\nRuby's `Process.kill` maps to `kill(2)`, `Kernel#trap` maps\
    \ roughly to `sigaction(2)`. `signal(7)` is also useful.\n\n## Processes Can Communicate\n\
    \nUp until now we've looked at related processes that share memory and share open\
    \ resources. But what about communicating information between multiple processes?\n\
    \nThis is part of a whole field of study called Inter-process communication (IPC\
    \ for short). There are many different ways to do IPC but I'm going to cover two\
    \ commonly useful method: pipes and socket pairs.\n\n### Our First Pipe\n\nA pipe\
    \ is a uni-directional stream of data. In other words you can open a pipe, one\
    \ process can 'claim' one end of it and another process can 'claim' the other\
    \ end. Then data can be passed along the pipe but only in one direction. So if\
    \ one process 'claims' the position of reader, rather than writer, it will not\
    \ be able to write to the pipe. And vice versa.\n\nBefore we involve multiple\
    \ processes let's just look at how to create a pipe and what we get from that:\n\
    \n```\nreader, writer = IO.pipe #=> [#<IO:fd 5>, #<IO:fd 6>]\n```\n\n`IO.pipe`\
    \ returns an array with two elements, both of which are `IO` objects. Ruby's amazing\
    \ IO class ([http://librelist.com/browser//usp.ruby/2011/9/17/the-ruby-io-class/](http://librelist.com/browser//usp.ruby/2011/9/17/the-ruby-io-class/))\
    \ is the superclass to `File`, `TCPSocket`, `UDPSocket`, and others. As such,\
    \ all of these resources have a common interface.\n\nThe `IO` objects returned\
    \ from `IO.pipe` can be thought of something like anonymous files. You can basically\
    \ treat them the same way you would a `File`. You can call `#read`, `#write`,\
    \ `#close`, etc. But this object won't respond to `#path` and won't have a location\
    \ on the filesystem.\n\nStill holding back from bringing in multiple processes\
    \ let's demonstrate communication with a pipe:\n\n```\nreader, writer = IO.pipe\n\
    writer.write(\"Into the pipe I go...\")\nwriter.close\nputs reader.read\n```\n\
    \noutputs\n\n```\nInto the pipe I go...\n```\n\nPretty simple right? Notice that\
    \ I had to close the writer after I wrote to the pipe? That's because when the\
    \ reader calls `IO#read` it will continue trying to read data until it sees an\
    \ EOF (aka. end-of-file marker ([http://en.wikipedia.org/wiki/End-of-file](http://en.wikipedia.org/wiki/End-of-file))).\
    \ This tells the reader that no more data will be available for reading.\n\nSo\
    \ long as the writer is still open the reader might see more data, so it waits.\
    \ By closing the writer before reading it puts an EOF on the pipe so the reader\
    \ stops reading after it gets the initial data. If you skip closing the writer\
    \ then the reader will block and continue trying to read indefinitely.\n\n###\
    \ Pipes Are One-Way Only\n\n```\nreader, writer = IO.pipe\nreader.write(\"Trying\
    \ to get the reader to write something\")\n```\n\noutputs\n\n```\n >> reader.write(\"\
    Trying to get the reader to write something\")\nIOError: not opened for writing\n\
    \        from (irb):2:in `write'\n        from (irb):2\n```\n\nThe `IO` objects\
    \ returned by `IO.pipe` can only be used for uni-directional communication. So\
    \ the reader can only read and the writer can only write.\n\nNow let's introduce\
    \ processes into the mix.\n\n### Sharing Pipes\n\nIn the chapter on forking I\
    \ described how open resources are shared, or copied, when a process forks a child.\
    \ Pipes are considered a resource, they get their own file descriptors and everything,\
    \ so they are shared with child processes.\n\nHere's a simple example of using\
    \ a pipe to communicate between a parent and child process. The child indicates\
    \ to the parent that it has finished an iteration of work by writing to the pipe:\n\
    \n```\nreader, writer = IO.pipe\n\nfork do\n  reader.close\n\n  10.times do\n\
    \    # heavy lifting\n    writer.puts \"Another one bites dust\"\n  end\nend\n\
    \nwriter.close\nwhile message = reader.gets\n  $stdout.puts message\nend\n```\n\
    \noutputs `Another one bites dust` ten times.\n\nNotice that, like above, the\
    \ unused ends of the pipe are closed so not to interfere with EOF being sent.\
    \ There's actually one more layer when considering EOF now that two processes\
    \ are involved. Since the file descriptors were copied there's now 4 instances\
    \ floating around. Since only two of them will be used to communicate the other\
    \ 2 instances must be closed. Hence the extra instances of closing.\n\nSince the\
    \ ends of the pipe are `IO` objects we can call any `IO` methods on them, not\
    \ just `#read` and `#write`. In this example I used `#puts` and `#gets` to read\
    \ and write a `String` delimited with a newline.\n\n### Streams vs. Messages\n\
    \nWhen I say stream I mean that when writing and reading data to a pipe there's\
    \ no concept of beginning and end. When working with an IO stream, like pipes\
    \ or TCP sockets, you write your data to the stream followed by some protocol-specific\
    \ delimiter. For example, HTTP uses a series of newlines to delimit the headers\
    \ from the body.\n\nThen when reading data from that IO stream you read it in\
    \ one chunk at a time, stopping when you come the delimiter. *That's* why I used\
    \ `#puts` and `#gets` in the last example: it used a newline as the delimiter\
    \ for me.\n\nAs you may have guessed it's possible to communicate via messages\
    \ instead of streams. We can't do it with pipe, but we can do it with Unix sockets.\
    \ Without going into too much detail, Unix sockets are a type of socket that can\
    \ only communicate on the same physical machine. As such it's much faster than\
    \ TCP sockets and is a great fit for IPC.\n\nHere's an example where we create\
    \ a pair of Unix sockets that can communicate via messages:\n\n```\nrequire 'socket'\n\
    Socket.pair(:UNIX, :DGRAM, 0) #=> [#<Socket:fd 15>, #<Socket:fd 16>]\n```\n"
