  trans: "\n\n对于一个拥有 4 个 CPU 的系统，如果你 `fork` 了 4 个新进程，那么每个进程都可以由一个独立的 CPU 处理，从而为你提供多核并发。\n\
    \n然而，并不能保证事情会并行执行。在繁忙的系统上，你的所有 4 个进程都可能由同一个 CPU 处理。\n\n`fork(2)` 创建一个旧进程的副本的新进程。因此，如果一个进程正在使用\
    \ 500MB 的主内存，当它进行 fork 之后，现在主内存中就有了 1GB。\n\n再这样做十次，你很快就会迅速耗尽主内存。这通常被称为 `fork bomb`（fork\
    \ 炸弹）。在提高并发性之前，请确保你了解其后果。\n\n## 使用块（Block）\n\n在上面的示例中，我们通过 if/else 结构演示了 `fork`。在\
    \ Ruby 代码中，配合块使用 `fork` 也是可能的，而且更为常见。\n\n当你向 `fork` 方法传递一个块时，该块将在新的子进程中执行，而父进程将简单地跳过它。子进程在执行完块后会退出。它不会沿着与父进程相同的代码路径继续执行。\n\
    \n```\nfork do\n  # 这里的代码只在子进程中执行\nend\n\n# 这里的代码只在父进程中执行。\n```\n\n## 现实世界\n\n\
    查看附录中的任意一个或随附的 Spyglass 项目，可以看到一些使用 `fork(2)` 的真实世界示例。\n\n## 系统调用\n\nRuby 的 `Kernel#fork`\
    \ 映射到 `fork(2)`。\n\n## 孤儿进程\n\n### 失控\n\n你可能已经注意到，在运行上一章的示例时，当涉及到子进程时，再无法像我们所习惯的那样从终端控制一切了。\n\
    \n当通过终端启动进程时，我们通常只有一个进程向 `STDOUT` 写入内容、接收键盘输入或监听告诉其退出的 Ctrl-C 信号。\n\n但一旦该进程 fork\
    \ 了子进程，这一切都会变得稍微困难一些。当你按下 Ctrl-C 时，哪个进程应该退出？是全部退出吗？还是只有父进程？\n\n了解这些是有好处好处，因为创建孤儿进程实际上非常简单：\n\
    \n```\nfork do\n  5.times do\n    sleep 1\n    puts \"I'm an orphan!\"\n  end\n\
    end\n\nabort \"Parent process died...\"\n```\n\n如果你从终端运行此程序，你会发现由于父进程立即死亡，终端将你返回到命令提示符。在此时，它会被子进程的\
    \ `STDOUT` 覆盖！在 fork 进程时可能会发生一些奇怪的事情。\n\n### 被遗弃的子\n\n当父进程死亡时，子进程会发生什么？\n\n简短的答案是：`什么`。也就是说，操作系统对待子进程的方式与其他任何进程相同。因此，当父进程死亡时，子进程会继续运行；父进程不会带上子进程一起。\n\
    \n### 管理孤儿进程\n\n你还能管理孤儿进程吗？\n\n我们在这个问题上有点操之过急，但它涉及到两个有趣的概念。\n\n第一个是所谓的守护进程（daemon\
    \ processes）。守护进程是特意被孤儿化并旨在永久运行的长持续进程。这些将在稍后的章节中详细介绍。\n\n这里另一个有趣的点是与未附加到终端会话的进程进行通信。你可以使用称为\
    \ Unix 信号（signals）的东西来实现。这在后面的章节也有更详细的介绍。\n\n我们将很快讨论如何正确地管理和控制子进程。\n\n## 进程是友好的\n\
    \n让我们暂时离开代码，来讨论一个高层次的概念以及它在不同的 Ruby 实现中是如何处理的。\n\n### 对 CoW 友好（CoW Friendly）\n\
    \n正如在 fork 章节中提到的，`fork(2)` 创建了一个作为父进程完全副本的新子进程。这包括父进程在内存中拥有的所有内容的副本。\n\n物理复制所有数据可能会产生巨大的开销，因此现代\
    \ Unix 系统采用称为“写时复制”（copy-on-write, CoW）语义来应对这个问题。\n\n正如你从名称中猜到的那样，CoW 将内存的实际复制延迟到需要写入它时为止。\n\
    \n因此，父进程和子进程实际上会共享内存中相同的物理数据，直到其中一个需要修改它，在那个时刻，内存将被复制，以保持两个进程之间的正确分离。\n\n```\n\
    arr = [1,2,3]\n\nfork do\n  # 此时子进程已经初始化。\n  # 使用 CoW，此进程不需要复制 arr 变量，\n  # 因为它没有修改任何共享值，所以它可以继续从\
    \ \n  # 与父进程相同的内存位置读取数据。\n  p arr\nend\n```\n\n```\narr = [1,2,3]\n\nfork do\n\
    \  # 此时子进程已经初始化。\n  # 由于 CoWW，arr 变量还没有被复制。\n  arr << 4\n  # 上面行代码修改了数组，所以在在该进程\n\
    \  # 修改它之前，需要为它创建一个数组\n  # 的副本。父进程中的数组保持\n  # 不变。\nend\n```\n\n这是在使用 `fork(2)`\
    \ 时的一个巨大胜利，因为它节省了资源。这意味着 `fork(2)` 是快速的，因为它不需要复制父进程的任何物理内存。这也意味着子进程只获得它们需要的数据副本，其余部分可以共享。\n\
    \nCoW 非常棒，但遗憾的是它`在 MRI 或 Rubinius 中不受支持`。为了让 CoW 正常工作，程序需要以对 CoW 的方式编写。也就是说，它们需要以允许\
    \ CoW 的方式管理内存。MRI 和 Rubinius 不是这样写的。\n\n### 为什么？\n\nMRI 的垃圾回收器使用“标记-清除”（mark-and-sweep）算法。简而言，这意味着当\
    \ GC 被调用时，它必须遍历每个对象并对其进行写入，标记它应该被垃圾回收还是不应该。这里的关键点是，每当 GC 运行时，内存中的每个对象都会被写入。\n\n\
    因此，在 fork 之后，第一次运行 GC 就会撤销写时复制提供的收益。\n\n这就是为什么创建 Ruby Enterprise Edition ([`www.rubyenterpriseedition.com/`](http://www.rubyenterpriseedition.com/))\
    \ 的原因之一。`ree 对 CoW 友好`。想要深入了解这个问题以及 Ruby Enterprise Edition 如何解决它，请查看他们的 Google\
    \ Tech Talk：Building a Ruby Interpreter ([`www.youtube.com/watch?v=ghLCtAwqQ`](http://www.youtube.com/watch?v=ghLCtAwqQ))。\n\
    \n### MRI / RBX 用户\n\n这对其他 Ruby VM 用户意味着什么？\n\n简单来说，fork 进程无法获得 CoW 的收益。子进程将需要调用进程内存的完整副本。\n\
    \n如果你正在构建深度依赖 `fork(2)` 的东西，请认真考虑 Ruby Enterprise Edition。展望未来，MRI 主分支现在有了让 GC\
    \ 对 CoW 友好的补丁。因此，Ruby 2.0 版本将带有一个对 CoW 友好的 GC！\n\n"
- fmt: "\n```\nmessage = 'Good Morning'\nrecipient = 'tree@mybackyard.com'\n\nfork\
    \ do\n  # In this contrived example the parent process forks a child to take\n\
    \  # care of sending data to the stats collector. Meanwhile the parent\n  # process\
    \ has continued on with its work of sending the actual payload.\n\n  # The parent\
    \ process doesn't want to be slowed down with this task, and\n  # it doesn't matter\
    \ if this would fail for some reason.\n  StatsCollector.record message, recipient\n\
    end\n\n# send message to recipient\n```\n\n### Babysitting\n\nFor most other use\
    \ cases involving `fork(2)` you'll want some way to keep tabs on your child processes.\
    \ In Ruby, one technique for this is provided by `Process.wait`. Let's rewrite\
    \ our orphan-inducing example from the last chapter to perform with less surprises.\n\
    \n```\nfork do\n  5.times do\n    sleep 1\n    puts \"I am an orphan!\"\n  end\n\
    end\n\nProcess.wait\nabort \"Parent process died...\"\n```\n\nThis time the output\
    \ will look like:\n\n```\nI am an orphan!\nI am an orphan!\nI am an orphan!\n\
    I am an orphan!\nI am an orphan!\nParent process died...\n```\n\nNot only that,\
    \ but control will not be returned to the terminal until all of the output has\
    \ been printed.\n\nSo what does `Process.wait` do? `Process.wait` is a blocking\
    \ call instructing the parent process to wait for one of its child processes to\
    \ exit before continuing.\n\n### Process.wait and Cousins\n\nI mentioned something\
    \ key in that last statement, `Process.wait` blocks until any one of its child\
    \ processes exit. If you have a parent that's babysitting more than one child\
    \ process and you're using `Process.wait`, you need to know which one exited.\
    \ For this, you can use the return value.\n\n`Process.wait` returns the `pid`\
    \ of the child that exited. Check it out.\n\n```\n# We create 3 child processes.\n\
    3.times do\n  fork do\n    # Each one sleeps for a random amount of number less\
    \ than 5 seconds.\n    sleep rand(5)\n  end\nend\n\n3.times do\n  # We wait for\
    \ each child process to exit and print the pid that\n  # gets returned.\n  puts\
    \ Process.wait\nend \n```\n\n### Communicating with Process.wait2\n\nBut wait!\
    \ `Process.wait` has a cousin called `Process.wait2`!\n\nWhy the name confusion?\
    \ It makes sense once you know that `Process.wait` returns 1 value (`pid`), but\
    \ `Process.wait2` returns 2 values (`pid`, `status`).\n\nThis status can be used\
    \ as communication between processes via exit codes. In our chapter on Exit Codes\
    \ we mentioned that you can use exit codes to encode information for other processes.\
    \ `Process.wait2` gives you direct access to that information.\n\nThe The `status`\
    \ returned from `Process.wait2` is an instance of `Process::Status`. It has a\
    \ lot of useful information attached to it for figuring out exactly how a process\
    \ exited.\n\n```\n# We create 5 child processes.\n5.times do\n  fork do\n    #\
    \ Each generates a random number. If even they exit\n    # with a 111 exit code,\
    \ otherwise they use a 112 exit code.\n    if rand(5).even?\n      exit 111\n\
    \    else\n      exit 112\n    end\n  end\nend\n\n5.times do\n  # We wait for\
    \ each of the child processes to exit.\n  pid, status = Process.wait2\n\n  # If\
    \ the child process exited with the 111 exit code\n  # then we know they encountered\
    \ an even number.\n  if status.exitstatus == 111\n    puts \"#{pid} encountered\
    \ an even number!\"\n  else\n    puts \"#{pid} encountered an odd number!\"\n\
    \  end\nend\n```\n\nCommunication between processes without the filesystem or\
    \ network!\n\n### Waiting for Specific Children\n\nBut wait! The `Process.wait`\
    \ cousins have two more cousins. `Process.waitpid` and `Process.waitpid2`.\n\n\
    You can probably guess what these do. They function the same as `Process.wait`\
    \ and `Process.wait2` except, rather than waiting for *any* child to exit they\
    \ only wait for a *specific* child to exit, specified by `pid`.\n\n```\nfavourite\
    \ = fork do\n  exit 77\nend\n\nmiddle_child = fork do\n  abort \"I want to be\
    \ waited on!\"\nend\n\npid, status = Process.waitpid2 favourite\nputs status.exitstatus\n\
    ```\n\nAlthough it appears that `Process.wait` and `Process.waitpid` provide different\
    \ behaviour don't be fooled! They are actually aliased to the same thing. Both\
    \ will accept the same arguments and behave the same.\n\nYou can pass a `pid`\
    \ to `Process.wait` in order to get it to wait for a *specific* child, and you\
    \ can pass `-1` as the `pid` to `Process.waitpid` to get it to wait for *any*\
    \ child process.\n\nThe same is true for `Process.wait2` and `Process.waitpid2`.\n\
    \nJust like with `Process.pid` vs `$$` I think it's important that, as programmers,\
    \ we use the provided tools to reveal our intent where possible. Although these\
    \ methods are identical you should use `Process.wait` when you're waiting for\
    \ any child process and use `Process.waitpid` when you're waiting for a specific\
    \ process.\n\n### Race Conditions\n\nAs you look at these simple code examples\
    \ you may start to wonder about race conditions.\n\nWhat if the parent is slow\
    \ at processing each child? Let's see:\n\n```\n# We create two child processes.\n\
    2.times do\n  fork do\n    # Both processes exit immediately.\n    abort \"Finished!\"\
    \n  end\nend\n\n# The parent process waits for the first process, then sleeps\
    \ for 5 seconds.\n# In the meantime the child process has exited and is no\n#\
    \ longer running.\nputs Process.wait\nsleep 5\n\n# The parent process asks to\
    \ wait once again, and amazingly enough, the\n# process exited.\nputs Process.wait\n\
    ```\n\nAs you can see this technique is free from race conditions. The kernel\
    \ queues up information about exited processes so that the parent always receives\
    \ the information.\n\nSo even if the parent is slow at processing each child it\
    \ will be able to get it when it's ready.\n\nTake note that calling any variant\
    \ of `Process.wait` when there are no child processes will raise `Errno::ECHILD`.\
    \ It's always a good idea to keep track of how many child processes you have created\
    \ so you don't encounter this.\n\n### In the Real World\n\nThe idea of looking\
    \ in your child processes is at the core of a common Unix pattern. The pattern\
    \ is sometimes called babysitting processes, master/worker, or preforking.\n\n\
    At the core of this pattern is the concept that you have one process that forks\
    \ several child processes, for concurrency, and then spends its time looking after\
    \ them: making sure they are responsive, reacting if any of them exit, etc.\n\n\
    For example, the Unicorn web server ([http://unicorn.bogomips.org](http://unicorn.bogomips.org))\
    \ employs this pattern. You tell it how many worker processes you want it to start\
    \ up for you, 5 for instance.\n\nThen a `unicorn` process will boot up that will\
    \ `fork` 5 child processes to handle web requests. The parent (or master) process\
    \ maintains a heartbeat with each child and ensures that all the child processes\
    \ stay responsive.\n\nThis pattern allows for both concurrency and reliability.\
    \ Read more about Unicorn in its Appendix at the end of the book.\n\nFor an alternative\
    \ usage of this technique read through the `Lookout` class in the attached Spyglass\
    \ project.\n\n### System Calls\n\nRuby's `Process.wait` and cousins map to `waitpid(2)`.\n\
    \n## Zombie Processes\n\nAt the beginning of the last chapter we looked at an\
    \ example that used a child process to asynchronously handle a task in a fire\
    \ and forget manner. We need to revisit that example and ensure that we clean\
    \ up that child process appropriately, lest it become a zombie!\n\n### Good Things\
    \ Come to Those Who wait(2)\n\nIn the last chapter I showed that the kernel queues\
    \ up status information about child processes that have exited. So even if you\
    \ call `Process.wait` long after the child process has exited its status information\
    \ is still available. I'm sure you can smell a problem here...\n"
