    \ to exit. This ensures that the kernel doesn't hang on to any status information\
    \ we don't need.\n\n### What Do Zombies Look Like?\n\n```\n# Create a child process\
    \ that exits after 1 second.\npid = fork { sleep 1 }\n# Print its pid.\nputs pid\n\
