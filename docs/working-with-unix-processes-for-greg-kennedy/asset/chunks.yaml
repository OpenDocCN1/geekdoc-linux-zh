- fmt: "\n### Exceeding the Limit\n\nNote that exceeding the soft limit will raise\
    \ `Errno::EMFILE`:\n\n```ruby\n# Set the maximum number of open files to 3\\.\
    \ We know this\n# will be maxed out because the standard streams occupy\n# the\
    \ first three file descriptors.\nProcess.setrlimit(:NOFILE, 3)\n\nFile.open('/dev/null')\n\
    ```\n\noutputs:\n\n```\nErrno::EMFILE: Too many open files - /dev/null\n```\n\n\
    ### Other Resources\n\nYou can use these same methods to check and modify limits\
    \ on other system resources. Some common ones are:\n\n```ruby\n# The maximum number\
    \ of simultaneous processes \n# allowed for the current user.\nProcess.getrlimit(:NPROC)\n\
    \n# The largest size file that may be created.\nProcess.getrlimit(:FSIZE)\n\n\
    # The maximum size of the stack segment of the\n# process.\nProcess.getrlimit(:STACK)\n\
    ```\n\nHave a look at the documentation ([http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit](http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit))\
    \ for `Process.getrlimit` for a full listing of the available options.\n\n###\
    \ In the Real World\n\nNeeding to modify limits for system resources isn't a common\
    \ need for most programs. However, for some specialized tools this can be very\
    \ important.\n\nOne use case is any process needing to handle thousands of simultaneous\
    \ network connections. An example of this is the `httperf(1)` http performance\
    \ tool. A command like `httperf --hog --server www --num-conn 5000` will ask `httperf(1)`\
    \ to create 5000 concurrent connections. Obviously this will be a problem on my\
    \ system due to its default soft limit, so `httperf(1)` will need to bump its\
    \ soft limit before it can properly do its testing.\n\nAnother real world use\
    \ case for limiting system resources is a situation where you execute third-party\
    \ code and need to keep it within certain constraints. You could set limits for\
    \ the processes running that code and revoke the permissions required to change\
    \ them, hence ensuring that they don't use more resources than you allow for them.\n\
    \n### System Calls\n\nRuby's `Process.getrlimit` and `Process.setrlimit` map to\
    \ `getrlimit(2)` and `setrlimit(2)`, respectively.\n\n## Processes Have an Environment\n\
    \nEnvironment, in this sense, refers to what's known as 'environment variables'.\
    \ Environment variables are key-value pairs that hold data for a process.\n\n\
    Every process inherits environment variables from its parent. They are set by\
    \ a parent process and inherited by its child processes. Environment variables\
    \ are per-process and are global to each process.\n\nHere's a simple example of\
    \ setting an environment variable in a `bash` shell, launching a Ruby process,\
    \ and reading that environment variable.\n\n```bash\n$ MESSAGE='wing it' ruby\
    \ -e \"puts ENV['MESSAGE']\"\n```\n\nThe `VAR=value` syntax is the `bash` way\
    \ of setting environment variables. The same thing can be accomplished in Ruby\
    \ using the `ENV` constant.\n\n```ruby\n# The same thing, with places reversed!\n\
    ENV['MESSAGE'] = 'wing it'\nsystem \"echo $MESSAGE\"\n```\n\nBoth of these examples\
    \ print:\n\n```\nwing it\n```\n\nIn `bash` environment variables are accessed\
    \ using the syntax: `$VAR`. As you can tell from these few examples environment\
    \ variables can be used to share state between processes running different languages,\
    \ `bash` and `ruby` in this case.\n\n### It's a hash, right?\n\nAlthough `ENV`\
    \ uses the hash-style accessor API it's not actually a `Hash`. For instance, it\
    \ implements `Enumerable` and some of the `Hash` API, but not all of it. Key methods\
    \ like `merge` are *not* implemented. So you can do things like `ENV.has_key?`,\
    \ but don't count on all hash operations working.\n\n```ruby\nputs ENV['EDITOR']\n\
    puts ENV.has_key?('PATH')\nputs ENV.is_a?(Hash)\n```\n\noutputs:\n\n```\nvim\n\
    true\nfalse\n```\n\n### In the Real World\n\nIn the real world environment variables\
    \ have many uses. Here's a few that are common workflows in the Ruby community:\n\
    \n```bash\n$ RAILS_ENV=production rails server\n$ EDITOR=mate bundle open actionpack\n\
    $ QUEUE=default rake resque:work\n```\n\nEnvironment variables are often used\
    \ as a generic way to accept input into a command-line program. Any terminal (on\
    \ Unix or Windows) already supports them and most programmers are familiar with\
    \ them. Using environment variables is often less overhead than explicitly parsing\
    \ command line options.\n\n### System Calls\n\nThere are no system calls for directly\
    \ manipulating environment variables, but the C library functions `setenv(3)`\
    \ and `getenv(3)` do the brunt of the work. Also have a look at `environ(7)` for\
    \ an overview.\n\n## Processes Have Arguments\n\nEvery process has access to a\
    \ special array called `ARGV`. Other programming languages may implement it slightly\
    \ differently, but every one has something called 'argv'.\n\n`argv` is a short\
    \ form for 'argument vector'. In other words: a vector, or array, of arguments.\
    \ It holds the arguments that were passed in to the current process on the command\
    \ line. Here's an example of inspecting `ARGV` and passing in some simple options.\n\
    \n```bash\n$ cat argv.rb\np ARGV\n$ ruby argv.rb foo bar -va\n[\"foo\", \"bar\"\
    , \"-va\"]\n```\n\n### It's an Array!\n\nUnlike the previous chapter, where we\
    \ learned that `ENV` isn't a `Hash`, `ARGV` is simply an `Array`. You can add\
    \ elements to it, remove elements from it, change the elements it like.\n\n###\
    \ In the Real World\n\nThe most common use case for `ARGV` is probably for accepting\
    \ filenames. There are many Ruby libraries for dealing with input. But now that\
    \ you know how `ARGV` works you can skip that extra overhead for simple flags\
    \ and do it by hand.\n\n```ruby\n# did the user request help?\nARGV.include?('--help')\n\
    # get the value of -c option\nARGV.include?('-c') && ARGV[ARGV.index('-c') + 1]\n\
    ```\n\n## Processes Have Names\n\nUnix processes have very few ways of communicating\
    \ about their state.\n\nProgrammers have worked around this and invented things\
    \ like logfiles. Logfiles allow processes to communicate anything they want about\
    \ their state by writing to the filesystem, but this operates at the level of\
    \ the filesystem rather than being inherent to the process.\n\nSimilarly, processes\
    \ can use the network to open sockets and communicate with other processes. But\
    \ again, that operates at a different level than the process itself.\n\nThere\
    \ are two mechanisms that operate at the level of the process itself that can\
    \ be used to communicate information. One is the process name, the other is exit\
    \ codes.\n\n### Naming Processes\n\nEvery process on the system has a name. For\
    \ example, when you start up an `irb` session that process is given the name 'irb'.\
    \ The neat thing about process names is that they can be changed at runtime and\
    \ used as a method of communication.\n\nIn Ruby you can access the name of the\
    \ current process in the `$PROGRAM_NAME` variable. Similarly, you can assign a\
    \ value to that global variable to change the name of the current process.\n\n\
    ```ruby\nputs $PROGRAM_NAME\n\n10.downto(1) do |num|\n  $PROGRAM_NAME = \"Process:\
    \ #{num}\"\n  puts $PROGRAM_NAME\nend\n```\n\noutputs:\n\n```\nirb\nProcess: 10\n\
    Process: 9\nProcess: 8\nProcess: 7\nProcess: 6\nProcess: 5\nProcess: 4\nProcess:\
    \ 3\nProcess: 2\nProcess: 1\n```\n\nAs a fun exercise you can start an `irb` session,\
    \ print the pid, and change the process name. Then you can use the `ps(1)` utility\
    \ to see your changes reflected on the system.\n"
  raw: "### Exceeding the Limit\n\nNote that exceeding the soft limit will raise `Errno::EMFILE`:\n\
    \n```\n# Set the maximum number of open files to 3\\. We know this\n# will be\
    \ maxed out because the standard streams occupy\n# the first three file descriptors.\n\
    Process.setrlimit(:NOFILE, 3)\n\nFile.open('/dev/null')\n```\n\noutputs:\n\n```\n\
    Errno::EMFILE: Too many open files - /dev/null\n```\n\n### Other Resources\n\n\
    You can use these same methods to check and modify limits on other system resources.\
    \ Some common ones are:\n\n```\n# The maximum number of simultaneous processes\
    \ \n# allowed for the current user.\nProcess.getrlimit(:NPROC)\n\n# The largest\
    \ size file that may be created.\nProcess.getrlimit(:FSIZE)\n\n# The maximum size\
    \ of the stack segment of the\n# process.\nProcess.getrlimit(:STACK)\n```\n\n\
    Have a look at the documentation ([http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit](http://www.ruby-doc.org/core-1.9.3/Process.html#method-c-setrlimit))\
    \ for `Process.getrlimit` for a full listing of the available options.\n\n###\
    \ In the Real World\n\nNeeding to modify limits for system resources isn't a common\
    \ need for most programs. However, for some specialized tools this can be very\
    \ important.\n\nOne use case is any process needing to handle thousands of simultaneous\
    \ network connections. An example of this is the httperf(1) http performance tool.\
    \ A command like `httperf --hog --server www --num-conn 5000` will ask httperf(1)\
    \ to create 5000 concurrent connections. Obviously this will be a problem on my\
    \ system due to its default soft limit, so httperf(1) will need to bump its soft\
    \ limit before it can properly do its testing.\n\nAnother real world use case\
    \ for limiting system resources is a situation where you execute third-party code\
    \ and need to keep it within certain constraints. You could set limits for the\
    \ processes running that code and revoke the permissions required to change them,\
    \ hence ensuring that they don't use more resources than you allow for them.\n\
    \n### System Calls\n\nRuby's `Process.getrlimit` and `Process.setrlimit` map to\
    \ getrlimit(2) and setrlimit(2), respectively.\n\n## Processes Have an Environment\n\
    \nEnvironment, in this sense, refers to what's known as 'environment variables'.\
    \ Environment variables are key-value pairs that hold data for a process.\n\n\
    Every process inherits environment variables from its parent. They are set by\
    \ a parent process and inherited by its child processes. Environment variables\
    \ are per-process and are global to each process.\n\nHere's a simple example of\
    \ setting an environment variable in a `bash` shell, launching a Ruby process,\
    \ and reading that environment variable.\n\n```\n$ MESSAGE='wing it' ruby -e \"\
    puts ENV['MESSAGE']\"\n```\n\nThe `VAR=value` syntax is the `bash` way of setting\
    \ environment variables. The same thing can be accomplished in Ruby using the\
    \ `ENV` constant.\n\n```\n# The same thing, with places reversed!\nENV['MESSAGE']\
    \ = 'wing it'\nsystem \"echo $MESSAGE\"\n```\n\nBoth of these examples print:\n\
    \n```\nwing it\n```\n\nIn `bash` environment variables are accessed using the\
    \ syntax: `$VAR`. As you can tell from these few examples environment variables\
    \ can be used to share state between processes running different languages, `bash`\
    \ and `ruby` in this case.\n\n### It's a hash, right?\n\nAlthough `ENV` uses the\
    \ hash-style accessor API it's not actually a `Hash`. For instance, it implements\
    \ `Enumerable` and some of the `Hash` API, but not all of it. Key methods like\
    \ `merge` are *not* implemented. So you can do things like `ENV.has_key?`, but\
    \ don't count on all hash operations working.\n\n```\nputs ENV['EDITOR']\nputs\
    \ ENV.has_key?('PATH')\nputs ENV.is_a?(Hash)\n```\n\noutputs:\n\n```\nvim\ntrue\n\
    false\n```\n\n### In the Real World\n\nIn the real world environment variables\
    \ have many uses. Here's a few that are common workflows in the Ruby community:\n\
    \n```\n$ RAILS_ENV=production rails server\n$ EDITOR=mate bundle open actionpack\n\
    $ QUEUE=default rake resque:work\n```\n\nEnvironment variables are often used\
    \ as a generic way to accept input into a command-line program. Any terminal (on\
    \ Unix or Windows) already supports them and most programmers are familiar with\
    \ them. Using environment variables is often less overhead than explicitly parsing\
    \ command line options.\n\n### System Calls\n\nThere are no system calls for directly\
    \ manipulating environment variables, but the C library functions setenv(3) and\
    \ getenv(3) do the brunt of the work. Also have a look at environ(7) for an overview.\n\
    \n## Processes Have Arguments\n\nEvery process has access to a special array called\
    \ `ARGV`. Other programming languages may implement it slightly differently, but\
    \ every one has something called 'argv'.\n\nargv is a short form for 'argument\
    \ vector'. In other words: a vector, or array, of arguments. It holds the arguments\
    \ that were passed in to the current process on the command line. Here's an example\
    \ of inspecting `ARGV` and passing in some simple options.\n\n```\n$ cat argv.rb\n\
    p ARGV\n$ ruby argv.rb foo bar -va\n[\"foo\", \"bar\", \"-va\"]\n```\n\n### It's\
    \ an Array!\n\nUnlike the previous chapter, where we learned that `ENV` isn't\
    \ a `Hash`, `ARGV` is simply an `Array`. You can add elements to it, remove elements\
    \ from it, change the elements it contains, whatever you like. But if it simply\
    \ represents the arguments passed in on the command line why would you need to\
    \ change anything?\n\nSome libraries will read from `ARGV` to parse command line\
    \ options, for example. You can programmatically change `ARGV` before they have\
    \ a chance to see it in order to modify the options at runtime.\n\n### In the\
    \ Real World\n\nThe most common use case for `ARGV` is probably for accepting\
    \ filenames into a program. It's very common to write a program that takes one\
    \ or more filenames as input on the command line and does something useful with\
    \ them.\n\nThe other common use case, as mentioned, is for parsing command line\
    \ input. There are many Ruby libraries for dealing with command line input. One\
    \ called `optparse` is available as part of the standard library.\n\nBut now that\
    \ you know how `ARGV` works you can skip that extra overhead for simple command\
    \ line options and do it by hand. If you just want to support a few flags you\
    \ can implement them directly as array operations.\n\n```\n# did the user request\
    \ help?\nARGV.include?('--help')\n# get the value of the -c option\nARGV.include?('-c')\
    \ && ARGV[ARGV.index('-c') + 1]\n```\n\n## Processes Have Names\n\nUnix processes\
    \ have very few inherent ways of communicating about their state.\n\nProgrammers\
    \ have worked around this and invented things like logfiles. Logfiles allow processes\
    \ to communicate anything they want about their state by writing to the filesystem,\
    \ but this operates at the level of the filesystem rather than being inherent\
    \ to the process itself.\n\nSimilarly, processes can use the network to open sockets\
    \ and communicate with other processes. But again, that operates at a different\
    \ level than the process itself, since it relies on the network.\n\nThere are\
    \ two mechanisms that operate at the level of the process itself that can be used\
    \ to communicate information. One is the process name, the other is exit codes.\n\
    \n### Naming Processes\n\nEvery process on the system has a name. For example,\
    \ when you start up an `irb` session that process is given the name 'irb'. The\
    \ neat thing about process names is that they can be changed at runtime and used\
    \ as a method of communication.\n\nIn Ruby you can access the name of the current\
    \ process in the `$PROGRAM_NAME` variable. Similarly, you can assign a value to\
    \ that global variable to change the name of the current process.\n\n```\nputs\
    \ $PROGRAM_NAME\n\n10.downto(1) do |num|\n  $PROGRAM_NAME = \"Process: #{num}\"\
    \n  puts $PROGRAM_NAME\nend\n```\n\noutputs:\n\n```\nirb\nProcess: 10\nProcess:\
    \ 9\nProcess: 8\nProcess: 7\nProcess: 6\nProcess: 5\nProcess: 4\nProcess: 3\n\
    Process: 2\nProcess: 1\n```\n\nAs a fun exercise you can start an `irb` session,\
    \ print the pid, and change the process name. Then you can use the ps(1) utility\
    \ to see your changes reflected on the system."
