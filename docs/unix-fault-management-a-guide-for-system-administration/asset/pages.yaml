    # OpenView IT/Operations


    IT/Operations (IT/O) is an OpenView application that provides central operations
    and problem management. NNM is included as part of the IT/O product. IT/O uses
    intelligent agents that run on each managed system to collect management information,
    messages, and alerts, and to send the information to a centralized console. After
    receiving events, IT/O can initiate automatic corrective actions. When an operator
    reads an individual message, guidance is given and actions may be suggested for
    further problem resolution or recovery.


    IT/O has the following four main windows:


    +   * **Node Bank:** Displays iconographically the systems managed by an operator,
    and allows for them to be organized into node groups.

    * **Message Groups:** Displays logical message groups, such as performance, Oracle,
    or backup. The message groups serve as one way to organize messages in the Message
    Browser window.

    * **Message Browser:** Shows the events that have been received by the management
    server.

    * **Application Desktop:** Provides access to commonly used diagnostic and administrative
    applications.


    IT/O comes with predefined monitors and templates. For monitoring disk resources,
    it has a monitor for the root filesystem for Hewlett-Packard, Sun, and other platforms.
    The predefined message template defines the message condition so that when the
    root filesystem usage exceeds 90 percent, a warning is sent to the IT/O Message
    Browser. The message condition defining this criterion is shown in Figure 5-6.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Figure 5-6 IT/O message condition template for monitoring root filesystem
