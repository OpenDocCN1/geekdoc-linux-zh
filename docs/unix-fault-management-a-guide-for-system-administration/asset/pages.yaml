    # ## EcoSYSTEMS


    Compuware Corporation provides the EcoSYSTEMS suite of management tools, which
    includes EcoTOOLS for system and network management, EcoSCOPE for monitoring application
    performance, and EcoSNAP for managing application failures. The products are supported
    on both NT and Unix platforms, with HP-UX, IBM AIX, SunOS, and Sun Solaris among
    the supported Unix platforms.


    EcoSCOPE can automatically discover which of hundreds of predefined applications
    are running on the network, and the user can add application definitions to the
    EcoSCOPE database. EcoSCOPE can then monitor the number of users accessing an
    application, the application’s response time, byte counts for each application,
    and the traffic load per application.


    A key feature of EcoSCOPE is its ability to monitor application response times.
    No application changes are needed to get the response time information. EcoSCOPE
    provides application- or session-level response times, including Oracle transaction
    information. The response times for individual verbs in an Oracle or Sybase SQL
    statement can be monitored, to help diagnose long database response times. Minimum,
    maximum, standard deviation, and mean response time information can be displayed.


    Compuware’s EcoSCOPE can analyze application traffic at the protocol level. You
    can see network traffic by application and by protocol. You can recognize multicast
    and broadcast packets and determine the application sending them. The traffic
    loads between two nodes can be displayed per application.'
