- pgno: 190
  md: '# ## Using Network Performance Data


    This section provides a brief introduction on how you can use the network performance
    monitoring tools to detect and address network performance problems. Various types
    of network performance problems are possible. Potential problems could be an overloaded
    server, a congested network, or a faulty network masquerading as an overloaded
    network. You can use the performance tools to avoid these problems, if possible,
    or at least to correct them quickly when they occur.


    # ### Avoiding Performance Issues


    To avoid network performance issues, key networks should be monitored regularly
    to look for trends. You should first use tools such as PerfView and NetMetrix
    to collect baseline data from when the computing environment is behaving normally.
    You may want to put some NFS commands into scripts to create your own benchmarks.
    Be sure that your mixture of NFS commands reflects the typical usage for your
    environment. In addition to benchmarking utilization rates, you should determine
    what collision rates are typical by using lanadmin or MeasureWare. Data should
    be collected over a period of time to get an accurate view of the network load.
    As loads increase, you should be prepared to segregate network traffic, add more
    LAN cards, or restrict the number of new applications being used on the network.


    Network performance problems can be caused by an increase in the number of users
    or the introduction of a new application into the production environment. By proactively
    collecting performance information, you can identify when a jump in usage occurred
    and you may be able to trace it to a new application or a user’s inappropriate
    use of the network. Network analyzers and tools such as NetMetrix can be used
    to identify the applications and users dominating network traffic. A new network
    application initially should be deployed in a test environment so that its network
    load can be characterized. If its network usage is unexpectedly high, it can be
    redesigned before deployment into the production environment, or the production
    environment can be modified to support the new workload.


    # ### Detecting Overloaded Network Servers


    If the server performing a network service, such as NFS, is overloaded, it won’t
    be able to handle network traffic effectively. The problem could be a CPU, memory,
    or disk I/O bottleneck, or an inability of the server’s NIC to handle the load.


    To check for a CPU bottleneck on the network server, check the CPU utilization
    and run queue length. GlancePlus/UX can provide this information. CPU utilization
    greater than 95 percent and a high processor run queue length may indicate a CPU
    bottleneck. One option is to increase the capacity of the server by adding more
    processors, but this is not always possible. Also, it may not be sufficient to
    fix the problem, if the service is single-threaded.


    To check for a real memory bottleneck on the network server, you can first check
    the amount of free memory. It should not drop below 5 percent of the total available.
    If the system can’t keep up with the demands for memory, it will start paging
    and swapping. Excessive paging'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'and swapping, viewed from GlancePlus, may be a sign of a memory bottleneck.
    Increasing the capacity of the system by adding more memory may eliminate the
    bottleneck.


    You can check for an I/O imbalance on the network server by using tools such as
    iostat. High activity on the system disk is normal, but delays among nonsystem
    disks should be roughly the same. You may want to move files around to balance
    the disk load if an imbalance exists. You may also want to check your system’s
    buffer cache hit ratio to see whether your buffer cache size is too small. Tools
    such as MeasureWare and BMC PATROL can provide information about your system buffer
    cache. If all of your disks are more than 75-percent utilized, then you are disk-bound
    and may need faster or additional disks.


    # ## Detecting Network Congestion


    For Ethernet links, you can use the collision rate to determine whether or not
    a performance problem is due to congestion. lanadmin can be used to calculate
    the collision rate. You can cal-culate the rate by dividing the number of collisions
    by the number of outbound packets. A colli-sion rate consistently greater than
    5 to 10 percent indicates a congested network. You can also calculate the average
    collision rate for a network by totaling the number of output packets of all systems
    on the network and then dividing by the total number of collisions. If this average
    colli-sion rate is greater than 10 percent, it is another sign that you need to
    take some action.


    Network utilization averaging more than 35 to 40 percent of capacity on a shared
    medium is another sign of network congestion. If the utilization rate persists,
    it is likely to lead to colli-sions on the network.


    As mentioned, lanadmin can be used to identify network congestion. Compare the
    current collision rate to the rate that you benchmarked during normal operation.
    Specifying netstat —a shows statistics for each open connection, including the
    send queue, which indicates the number of packets waiting to be sent. This should
    be 0 for most connections. If it is a large number, it could be an indication
    of network congestion. You should check this over a period of time to see whether
    the problem persists.


    If you determine that a network is congested, and the network is being used appropriately,
    then you may need to partition the network into subnetworks and use gateways to
    isolate inde-pendent streams of data. (Techniques for identifying the appropriate
    location for a LAN bridge or gateway is beyond the scope of this book.) If configured
    properly, this can reduce the colli-sions on shared media and thus improve network
    performance. You should take advantage of any planned downtime to reconfigure
    networks, add additional LAN cards, or move applications to other systems on different
    networks.


    Information about NFS usage can be shown by using nfss tat. Specifying nfss tat
    -c shows the client’s NFS statistics. If the number of bad XID packets is approximately
    equal to the num-ber of retransmissions, then one of the client’s NFS servers
    is having trouble keeping up with the workload and is forcing the client to resend
    requests. Check each of the NFS servers to see whether any have system resource
    bottlenecks, as discussed earlier in this section. The disk is'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'the most common resource bottleneck for an NFS server. If the nfstat output
    shows that only the number of retransmissions is high, then the network is congested
    or faulty.


    # Avoiding Network Problems


    According to a 1998 survey by the MERIT Project, sponsored by Computer Associates,
    networking was identified as the area most in need of management automation to
    reduce outages. Network downtime can be prevented by watching for trends in performance
    that could lead to overloads, and by providing redundancy, so that single network
    component failures are not noticed by users.


    Network outages are often due to network bandwidth problems. By using tools such
    as NetMetrix and PerfView, increases in network usage can be identified and addressed
    before they become problems. Users can reduce network bandwidth requirements by
    using tools such as compress on files before transferring them over the network.
    The previous section discusses ways to avoid network performance problems.


    You can’t keep a networking component from failing, but you can set up your system
    so that users are not impacted by the failure. To prevent the downtime associated
    with a NIC failure, high availability software and redundant LANs can be used.
    MC/ServiceGuard can detect failed LAN cards and automatically configure a backup
    LAN card to take over the work. MC/ServiceGuard also supports the ability to automatically
    move TCP/IP addresses on Ethernet, FDDI, Token Ring, 100VG, and ATM LANs. High
    availability networking products that provide additional protection are available
    from HP, such as HA NFS and HA ATM.


    You may also want to use MC/ServiceGuard to protect your network application.
    It can detect application failures and restart the application locally or move
    it to another system if the problem is persistent.


    You should take advantage of the support for redundancy in various network services.
    The Domain Name Service, for example, enables you to configure primary and secondary
    servers. Name resolution can also be set up to rely on a configuration file or
    an alternate name service if the DNS server is unavailable. By setting up this
    redundancy, you can avoid the connectivity problems that would result from a failed
    name server.


    High availability software was mentioned as a way to mask network failures. However,
    a fault needs to be detected and corrected before any additional failures cause
    unplanned downtime. EMS can be used to report the failure of a NIC. Use any planned
    downtime as an opportunity to replace the LAN card.


    # Recovering from Network Problems


    This section discusses how to diagnose and then correct network problems. Networking
    is a broad area, spanning geographical distances and a variety of software and
    hardware components. Faults may be due to a NIC, transceiver, connector, cable,
    or other network device. Network communication problems may be due to a software
    configuration problem or misbehaving'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'network software. You need to use a combination of the tools discussed throughout
    this chapter to isolate the problem.


    Problems related to performance were discussed earlier, in the section “Using
    Network Performance Data.” Distinguishing between performance problems and network
    faults is often difficult. For example, a failed network device stops responding
    to packets, which may lead to a flood of retransmissions. A variety of network
    faults can be detected by using network performance tools. netstat and rstat are
    examples of commands that can be used for both performance monitoring and fault
    diagnosis.


    An early step in troubleshooting should be to try to identify what is unique about
    the problem. For example, if only one user is experiencing a problem, then something
    could be wrong with that user’s configuration or access rights. If the problem
    involves only a specific network service, you may want to check whether the service
    has recently been updated. Similarly, if a communication problem involves a specific
    computer system, you should check whether that system has recently had a software
    or hardware configuration change.


    The following sections provide some troubleshooting steps that can help you to
    locate a network problem.


    # ## Isulating the Fault


    If a user is unable to use a network service, the first thing that you probably
    should do is use ping to see whether you can reach the user’s system and the network
    server. ping is an easy command to remember and can isolate the problem to the
    appropriate part of the networking stack. ping tests the physical, data link,
    and network layers of the networking stack. If ping succeeds, then you should
    check the transport layer or higher layers for the problem. If this fails, then
    you have isolated the problem to the network or lower layers.


    Depending on the network topology in your computing environment, a possible scenario
    is that you can access the user’s system and network server from your management
    station, but the user can’t access the network server directly. If the user’s
    topology is different from your own, you may need to ping from the user’s system,
    or use the remote ping capability of NNM. If the ping behavior differs, it may
    indicate a routing problem.


    If a ping failure occurs, you should verify the name resolution before continuing.
    You can use nslookup to see whether the name resolves to the correct IP address.
    Another option is to use ping and specify the IP address instead of the system
    name. You may try pinging from different subnetworks to eliminate some of the
    network components as the source of the problem. You can also check the ARP cache
    to see whether the IP address is being resolved to the correct MAC address.


    # ## Network and Lower Layers


    If you suspect a problem with the lower network protocol layers, you should first
    verify the network configuration by using iocan, lanscan, and ifconfig. The lanscan
    command should display the status of all the LAN cards shown through iocan. ifconfig
    shows you whether the IP address has been properly bound to the network interface
    and whether the subnet masks are set correctly.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'If these commands do not return the correct information, then a link or software
    configuration error may exist. You should check the system log file for link-level
    errors.


    You may be able to confirm a LAN card error by checking the LEDs on the card itself.
    Usually, green is good and red or yellow is bad. Check the appropriate hardware
    user manual for the detailed interpretation of these LEDs.


    You can test the data link layers of the source and destination systems by using
    linkloop. If this command fails, the link layer would seem to be the problem and
    you should check the LAN cables, transceivers, and other network hardware. lanadmin
    can show you LAN statistics, to see whether excessive packet errors or collisions
    are occurring. If the linkloop test succeeds, you should next check the network
    configuration, using netstat -in.


    If network problems started when a new system was added to the LAN, the new system
    may be using a duplicate IP address. You can use netstat -in on each system on
    the LAN to see whether duplicates are present.


    If you suspect that packets are being routed inappropriately, you can use traceroute
    to identify the route UDP packets are taking from the source system to the destination.
    The command shows the route and time taken between gateways. This can help you
    to determine whether a router has failed or a routing table is configured incorrectly.


    If netstat shows bad checksums under the IP, ICMP, TCP, or UDP protocols, it is
    an indication that packets are getting corrupted, possibly on their way through
    a gateway. If the server is attached to multiple gateways, you may need to send
    test packets through each gateway to isolate the culprit. Just check the number
    of bad checksums after sending the packets through each gateway to determine which
    one is faulty. You then need to repair the faulty gateway device.


    The number of input and output errors reported by netstat should be very low,
    unless a power failure recently occurred. If netstat reports an increasing number
    of input errors, it could be an indication of corrupt packets being received from
    another system on the network, or a damaged LAN cable. Try to isolate the source
    of the remote packets to identify the culprit. If you see an increasing number
    of output errors, then your system’s NIC could be bad.


    When a network cable problem is suspected, a LAN analyzer can be used to isolate
    the problem. The analyzer is attached to the problematic network and can determine
    the distance to the failed component. A cable may be improperly terminated, or
    a network segment may need to be replaced.


    # ## Transport and Higher Layers


    If the network and link layers seem to be working properly, you should next check
    the transport layer to the destination system by using a network application such
    as telnet or FTP. The netstat command can be used on the server to see which network
    applications are currently running. If a desired service has failed, it may need
    to be restarted. You may want to look in /var/adm/syslog/syslog.log for potential
    causes of the failure. netstat can also show useful protocol statistics.


    If connectivity to the network server seems okay, but a service is not responding,
    performance problems may exist with the server or services, or the service may
    have failed. You may'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'be running the wrong version of the service. Compare the version of the service
    on a working system with that on a system where the service is failing. To check
    the version of a service such as FTP, type what ftppd.


    A service may exist on the system, but it may not be running because of security
    reasons. If a service is not being started, check whether the optional file /var/adm/inetd.sec
    is being used. This file can be used to deny or allow access to each network service.
    If the user is authorized, make sure that this file is not configured to deny
    access. Some services have their own specific security files. For example, FTP
    denies access to local accounts listed in /etc/ftpusers.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# CHAPTER 7


    # Monitoring the Application


    Earlier chapters focused on the systems, networks, and disks that connect the
    end-users to the application. This chapter describes the tools available to an
    operator to monitor the application. Although the name would suggest that a system
    operator is responsible primarily for monitoring the operation of the system,
    in fact, the business application is what is most important. It doesn’t matter
    that the system is up if the application itself is unavailable. Maintaining application
    availability means maintaining the availability and performance of all components
    that the application depends on, including databases, networks, storage, and the
    system itself.


    # Important Application Components to Monitor


    Applications can be monitored from several different perspectives. This chapter
    divides application monitoring into configuration management, fault management,
    and resource and performance management.


    An application can fail for many reasons. Software logic problems, hardware faults,
    limit conditions (such as running out of memory or overflowing a counter), and
    race conditions (such as forgetting to request a semaphore) can all cause an application
    to fail. In some of these cases, an operator can determine what happened by other
    system events (such as available memory dropping below a threshold). However,
    having monitors watching specific applications is often useful. Customized application
    monitors may be able to identify hundreds of different causes of application problems,
    saving you from some of the effort involved in troubleshooting a failure. Continual
    monitoring during business hours is needed to ensure the service is available.
    “By far, application software failures account for the greatest portion of downtime,”
    according to a 1996 Gartner Group study.


    Configuration management includes both ensuring that the application was configured
    initially without errors and monitoring any changes that are made to the configuration
    files. This change history can be used to detect and recover from any inappropriate
    configuration changes.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'In addition to monitoring whether or not the application is running, monitoring
    its performance is also important. If an application is hung or performing poorly,
    the end-user considers the service to be unavailable. Checking system performance
    can be a useful gauge as to how well the application is performing. A Unix environment
    often has only one important application per system. However, more specific tools
    are needed to diagnose and recover from application problems.


    For important applications, it may be useful to monitor the resources that the
    application needs, even if the application is not running. For example, tapes
    should be checked periodically so that tape hardware failures are detected before
    the backup application starts running. This helps to ensure that the backup completes
    within the desired time window.


    Another reason to monitor the application is to determine its resource usage over
    time. This can be used to bill back clients for their use of a service. You may
    want to check the number of resources in use by the application for several reasons.
    The application may be nearing configuration limits or taking an inappropriate
    share of system resources.


    A trend in companies'' IT/O departments is to implement “service-level agreements.”
    Instead of merely maintaining the availability of key systems and the networking
    backbone, IT/O departments are now measured based on their ability to provide
    specific levels of availability and response times for their end-users. The focus
    is on the service provided by the application. When measuring performance or availability
    in a computing environment, measuring in terms of the end-user service or application
    is most important.


    # Identifying Application Types


    Different types of applications require different levels of monitoring. Some of
    the tools described in this chapter are primarily used for certain types of applications.


    Here are some types of important applications:


    +   - MC/ServiceGuard packages

    - Database applications

    - Enterprise Resource Planning (ERP) applications

    - System Service applications

    - Management applications


    Some applications are critical to a company''s business. A failure may result
    in significant lost revenue for the company. You may want to protect these applications
    with high availability software. HP''s MC/ServiceGuard is a high availability
    software product that detects system failures, network or LAN card failures, and
    the failures of critical applications. MC/ServiceGuard can be configured to handle
    these failures automatically. For example, a failed critical application can be
    restarted. The failure of a LAN card can result in the automatic configuration
    of a backup LAN card to take over the network load. MC/ServiceGuard configures
    mission-critical applications into “packages” by using the System Administration
    Manager (SAM). These packages are then monitored and controlled by MC/ServiceGuard.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Database applications are important to monitor because they reference critical
    business data. Oracle, Sybase, and Informix are the most common database management
    system vendors. Database servers are discussed in Chapter 8.


    ERP software applications are used to integrate the data in different parts of
    a corporation, such as manufacturing, payroll, human resources, and accounting.
    By sharing information efficiently with different parts of the organization, a
    corporation can detect and respond more quickly to changing business conditions.
    ERP is now a $1 billion software business. Common ERP applications include SAP
    R/3, Baan, and PeopleSoft.


    Some overlap exists between these categories. For example, a database application
    may be configured as an MC/ServiceGuard package, and some Oracle applications
    are used as part of ERP solutions. This chapter distinguishes between tools that
    can be used for any application and tools that are customized for specific ERP
    applications.


    Some applications are shipped with the operating system to perform essential services.
    Many of these applications, such as sendmail, NFS, telnet, and rlogin, are covered
    in the system and networking chapters, and thus are not discussed here.


    Although this chapter focuses on ERP and general application monitoring, you should
    remember that management applications also require careful attention. Without
    monitoring the management applications, such as the system monitors, how do you
    know the system is still being monitored? Backup applications are another example.
    What if the backup fails every night, but no one notices? Some commercial products
    are available to help ensure that your backups were successful. Many system applications,
    such as OmniBack and OpenSpool, are shipped with IT/Operations (IT/O) templates
    and filters. OmniBack provides sophisticated monitoring, and can be monitored
    by any SNMP-based product, in addition to IT/O. During backup job execution, network-wide
    consolidated notification is provided.


    # Using Standard Commands and Tools


    This section describes standard commands and system instrumentation that can be
    used for monitoring any application. Some Unix commands are available that can
    help you to determine the status of your application. Commands to report the overall
    status of your system are described in Chapter 4.


    In addition to these commands, you may want to check the system log file, /var/
    admin/syslog/syslog.log, for error messages if your system is experiencing problems.
    Messages written to this log file include information on the module experiencing
    the problem and the time the event occurred, which can be very valuable when troubleshooting.


    ```

    ps

    ```


    The ps command can be used to show the processes running on the system. This can
    be a quick way to determine whether an application is running — if its process
    names are known.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'On larger systems with many active processes, you may want to restrict `ps`
    output by using the various options. `ps -p` restricts the listing to a specific
    process list, and `ps -u` shows only those processes with a matching user ID.


    A process name may not be unique on the system, so you may need to look at additional
    information, such as the user ID. The `ps` command can provide the following information:


    +   - User ID of process owner

    - Process Identifier (PID)

    - PID of parent process

    - Start time of process

    - Controlling terminal for process

    - Cumulative execution time for process

    - Command name and arguments


    # top


    The `top` command is useful for monitoring process information, as well as system
    CPU and memory loads. `top` output is displayed in the terminal window and is
    updated every five seconds, by default.


    `top` shows CPU resource statistics, including load averages (job queues over
    the last 1, 5, and 15 minutes), number of processes in each state (sleeping, waiting,
    running, starting, zombie, and stopped), percentage of time spent in each processor
    state (user, nice, system, idle, interrupt, and swapper) per processor on the
    system, as well as the average for each processor in a multi-processor system.


    At the process level, `top` lists the most active processes on the system, based
    on their CPU usage. The process data displayed by `top` includes the PID, process
    size (txt, data, and stack), resident size of the process (in K), process state
    (sleeping, waiting, running, idle, zombie, or stopped), number of CPU seconds
    consumed by the process, and the average CPU utilization of the process. `top`
    can be used to identify processes that may be using large amounts of CPU or memory.


    Listing 7-1 shows an example of the output you see when running `top`. Note that
    system and process information are displayed on the same screen, so that you can
    quickly get an overview of what is happening.


    # vmstat


    The `vmstat` command supplies good information about system resources, including
    virtual memory and CPU usage. `vmstat` is useful for detecting when you are low
    on memory or swap space. CPU utilization is shown by user, system, and idle time.


    For processes, `vmstat` shows the number of processes in various states. These
    states include: currently in the run queue, blocked on an I/O operation, and swapped
    out to disk. This can help to give you an idea of whether or not a process is
    functioning properly.'
  merge: -1
  img_proc: true
