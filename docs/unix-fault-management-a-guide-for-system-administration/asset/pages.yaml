    # GlancePlus


    GlancePlus is a real-time, graphical performance monitoring tool. It is used to
    monitor the performance and system resource utilization of a single system. Both
    Motif-based and character-based interfaces are available. The product can be used
    on HP-UX, Sun Solaris, and many other operating systems.


    GlancePlus can be used to view and graph a system’s current CPU, memory, swap,
    and disk activity. GlancePlus has screens dedicated to each of these main resources.


    GlancePlus can display a variety of data useful for disk monitoring:


    +   • Disk utilization and queue length per disk device

    • Disk I/O rates by filesystem

    • Disk I/O rates per process

    • Number of configured disks

    • Physical reads and writes per disk and per filesystem

    • Reads and writes per logical volume

    • Number of configured LVM volume groups

    • Filesystem capacity and utilization

    • Swap space capacity and utilization

    • System table resources


    The specific list of available metrics can be found when running GlancePlus, through
    its online help facility.


    GlancePlus is also capable of setting and receiving performance-related alarms.
    Customizable rules determine when a system performance problem should be sent
    as an alarm. The rules are managed by the GlancePlus Adviser. An Adviser menu
    option allows you to Edit Adviser Syntax. When you select this option, all of
    the alarm conditions are shown and can be modified, as demonstrated in Figure
    5-8.


    Notice in Figure 5-8 how the swap-related alarms are integrated into the same
