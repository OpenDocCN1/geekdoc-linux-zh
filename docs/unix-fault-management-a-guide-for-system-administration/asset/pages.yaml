- pgno: 76
  md: 'After you recognize that a problem exists, the NNM menu interface provides
    many tools to troubleshoot problems or monitor the system in more detail. NNM
    provides a performance menu that you can use to check network activity, CPU load,
    and disk space, or to graph SNMP data. A configuration menu is provided so that
    you can check network configuration, system statistics, or the SNMP trap configuration.
    From the fault menu, you can try to reach the system through the network connectivity
    poll, a ping from the management station, or a ping initiated from another remote
    system. If you suspect that the route to a system is down, you can test that from
    the fault menu as well. A terminal window, the SAM interface (HP-UX only), and
    a MIB Browser are all available from the pull-down menus.


    NNM also provides several utilities to help you gather and process data provided
    in MIBs. You can configure data collection of MIB objects and define thresholds
    for when to generate an event. You can build your own MIB application to collect
    MIB objects for graphing or generating tabular output.


    As this section has described, OpenView NNM can provide help for numerous system
    monitoring categories. Faults can be detected and shown graphically, with failure
    events sent to the Message Browser. You can monitor network performance by using
    the performance menus. You can check some of the system resource limits by using
    predefined tools or the MIB Browser. NNM, however, is typically used only if you
    have many systems to monitor.


    NNM is a building block for other HP OpenView applications. Application integration
    is provided through developer’s kits and registration files. More than 300 applications
    are integrated today with HP OpenView. HP IT/O, discussed later, is one product
    that extends NNM’s capabilities. The most commonly used partner applications are
    CiscoWorks, Bay Networks Optivity, 3Com Transcend, Remedy ARS, and HP NetMetrix.


    OpenView NNM runs on NT and UNIX platforms. Both versions can be used to monitor
    UNIX systems.


    # ClusterView


    ClusterView is a graphical monitoring tool integrated with OpenView NNM and IT/O.
    It provides monitoring of systems and other resources in MC/ServiceGuard environments.
    MC/ServiceGuard is a Hewlett-Packard high availability software product that detects
    system failures, network or LAN card failures, and the failure of critical applications.
    While MC/ServiceGuard can be configured to handle these failures automatically,
    it is through ClusterView that you can capture these high availability events
    and graphically view the health of systems that are part of MC/ServiceGuard clusters.
    MC/ServiceGuard is supported only on HP 9000 Series 800 systems running HP-UX
    10.x or later operating systems.


    MC/ServiceGuard is most commonly used in a cluster environment. Software on each
    system monitors the other systems. When system failures occur, MC/ServiceGuard
    software can detect the problem and automatically restart critical applications
    on an alternate node. Monitoring of failures is done automatically, but without
    ClusterView, you may need to use MC/ServiceGuard commands to verify that the cluster
    software itself is working.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'MC/ServiceGuard detects numerous cluster events, such as the failure of a critical
    application. These events can be forwarded to a management station by using either
    SNMP traps or openmsg, a proprietary communication mechanism used by IT/O. Information
    about an MC/ServiceGuard cluster is stored in the HP Cluster and HP MC/ServiceGuard
    Cluster MIBs. These Cluster MIBs are listed in Appendix A. The following is a
    list of the MC/ServiceGuard events that trigger SNMP traps from the MC/ServiceGuard
    subagent:


    +   - MC/ServiceGuard subagent was started

    - MC/ServiceGuard cluster is reforming

    - MC/ServiceGuard cluster is up on this node

    - MC/ServiceGuard cluster is down on this node

    - MC/ServiceGuard cluster configuration has changed

    - MC/ServiceGuard package is starting

    - MC/ServiceGuard package is running

    - MC/ServiceGuard package is halting

    - MC/ServiceGuard package is down

    - MC/ServiceGuard service is down

    - MC/ServiceGuard package switching flags have changed

    - MC/ServiceGuard relocatable IP address added

    - MC/ServiceGuard relocatable IP address removed

    - MC/ServiceGuard network interface local switch

    - MC/ServiceGuard subnet is up

    - MC/ServiceGuard subnet is unavailable

    - MC/ServiceGuard node joined the cluster

    - MC/ServiceGuard node has halted

    - MC/ServiceGuard node has failed


    MC/ServiceGuard software detects a variety of error conditions, but it does not
    have a sophisticated notification mechanism for customers to learn what happened.
    Errors often are written to the system log, which can be used to help retrace
    what occurred.


    Whereas MC/ServiceGuard can monitor the system, network, and processes and provide
    automatic recovery, ClusterView provides you with event notification of these
    recovery events. For example, if MC/ServiceGuard detects a local LAN card failure,
    it can reconfigure the IP connectivity on a backup LAN card on the local system
    transparently. Using ClusterView, you will see an event indicating that MC/ServiceGuard
    has performed a local switch to a backup LAN card. The bad LAN card should be
    replaced, to eliminate the LAN card as a single point of failure.


    ClusterView can be used to help you with diagnosis in MC/ServiceGuard environments.
    ClusterView is an OpenView application with custom monitoring capabilities for
    MC/ServiceGuard and MC/LockManager clusters. An SNMP subagent that can be used
    to send events to an OpenView management station is included with the MC/ServiceGuard
    and MC/LockManager'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'products. These events, sent as SNMP traps, can actually be received by any
    management station that understands SNMP (for example, Computer Associates'' Ucenter
    product). These events are received in OpenView''s event browser.


    ClusterView provides automatic discovery and real-time status and event notification
    via the Event Browser and graphical displays of MC/ServiceGuard clusters, systems,
    and packages. Templates are provided to map the cluster events to readable text.
    Without these templates, events are unrecognized or unmatched traps in OpenView.
    With these templates, the traps are formatted in the NNM Event Browser or IT/O
    Message Browser when ClusterView is installed.


    When a system failure is detected by MC/ServiceGuard, it moves all critical resources
    to an alternate node. A series of SNMP traps are generated by the MC/ServiceGuard
    subagent as an event occurs. Figure 4-2 shows the events in the NNM Event Browser
    after the system “bakers” fails. MC/ServiceGuard first detects the failure and
    starts the two packages, ems1 and ems2, on the alternate system, lindt. The Node
    Down trap is generated by NNM when it detects that system “bakers” is down.


    ClusterView provides additional capabilities when used with IT/O. SNMP events
    are sent to the Event Browser, where ClusterView provides special troubleshooting
    instructions and recommends actions to help resolve the problems. Some data collection
    activities are done automatically. For example, in response to a package failure,
    ClusterView automatically retrieves the system''s system log file entries from
    the time of failure to aid in diagnosis. Common HP-UX monitoring tools, such as
    netstat and lanscan, are included by ClusterView in IT/O''s Application Desktop,
    along with MC/ServiceGuard-specific tools, such as cmviewid.


    In addition to high availability clusters, ClusterView can monitor user-defined
    clusters. ClusterView provides a configuration tool that enables the administrator
    to create a cluster, and then displays that cluster on its cluster submap. The
    operator can then monitor all the cluster systems at a glance, because they are
    all in the same OpenView window. Also, the operator can launch monitoring tools,
    such as HP PerfView, on the cluster, avoiding the need to select each system manually
    when running each tool.


    ClusterView can be a useful extension to the capabilities of NNM if you are managing
    MC/ServiceGuard clusters, MC/LockManager clusters, or groups of systems. You can
    view detailed


