  md: '# ## HP Predictive Support


    HP Predictive Support is a high level of support from the Hewlett-Packard customer
    support team. It provides fault monitoring, trending, and HP Response Center notifications.
    Predictive Support includes monitoring of system hardware devices for faults.


    With Predictive Support, you can have Hewlett-Packard proactively monitor your
    HP-UX systems for you. Predictive Support provides detection of potential problems
    in your system before the system’s availability is noticeably affected. Predictive
    Support includes both software for hardware monitoring and a link to the HP Response
    Center. Predictive Support monitors detect failures and predict potential problems.
    Predictive Support then informs the HP Response Center via e-mail or modem (if
    allowed) to take any necessary action to prevent unscheduled downtime at the customer.


    Predictive Support monitors determine potential problems by analyzing patterns
    in logged errors pertaining to disk drives, such as bad blocks and recoverable
    I/O errors. Errors are periodically extracted from system log files and other
    logs. Based on the rule sets, a notification may be sent to the Response Center,
    which could result in a service call by an HP support engineer to replace a device
    having sporadic errors before it actually fails.


    Predictive Support now uses EMS to receive alerts for fibre channel disk devices.
    EMS Hardware Monitors are used to send alerts as errors and faults are detected.
    These events are logged and correlated by the Predictive Support monitors.


    # ## Collecting Disk Performance Data


    This section describes some common tools for measuring and monitoring disk performance.
    The following are some key terms that you need to know for this section:


    +   - **Block I/O:** The reads and writes that are held in the buffer cache (*buffered*)
    and then transferred in fixed-size blocks.

    - **File I/O:** The I/O access to a physical disk, which does not include virtual
    memory. It includes filesystem I/O, system I/O, raw I/O, and block I/O.

    - **Logical I/O:** The read or write system call made by an application to the
    filesystem. The call results in physical I/O if the data is not in the buffer
    cache.

    - **Physical I/O:** Data transferred from memory to disk, or vice versa. Physical
    I/O includes both file I/O and virtual memory I/O.

    - **Raw I/O:** Unbuffered I/O between a user application and the physical disk
    that bypasses the filesystem’s buffer cache (also known as *character mode*).

    - **Virtual memory I/O:** The reads and writes from the disk for memory-mapped
    files and for paging out pages from a swap area.


    Performance tools, such as BMC PATROL and HP MeasureWare Agent, do not always
    provide the same set of metrics on all platforms. For simplicity, this section
    focuses only on the Sun Solaris and HP-UX platforms. Also, these products are
    continually being enhanced, so the actual'
  merge: -1
  img_proc: true
