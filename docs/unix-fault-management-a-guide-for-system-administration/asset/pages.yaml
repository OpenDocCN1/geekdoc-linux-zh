    # Resource and Performance Monitoring Tools


    As mentioned earlier, the majority of database performance problems are the result
    of a poor database design or poorly coded database queries. Other reasons for
    performance problems are data access contention (“hot spots”), inadequate hardware
    resources, or a poorly configured database server. This section describes a variety
    of tools and techniques for locating database performance problems.


    # Application Resource Measurement


    Because measuring the performance of an application is difficult, Hewlett-Packard
    and Tivoli Systems jointly developed an open set of APIs for measuring application
    response times. This standard set of APIs is called Application Resource Measurement
    (ARM). If an application has been modified to use the new APIs at key points,
    then you can measure and control the application’s end-to-end performance. API
    calls are made in the application to mark the beginning and end of transactions.
    A Software Developer’s Kit (SDK) is freely available for ARM from either Tivoli
    or Hewlett-Packard to make this process easier. Table 8-5 lists and describes
    the few available ARM APIs.


    Baan has announced that the next release of its ERP application will be instrumented
    using the ARM API, which will make collecting application performance data for
    Baan more straightforward.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '| **Name** | **Function** |

    |---|---|

    | arm_init | Initializes ARM environment for application |

    | arm_getid | Names each transaction class used in application |

    | arm_start | Marks the start of execution of transaction instance |

    | arm_update | Updates information about transaction instance |

    | arm_stop | Marks the end of transaction |

    | arm_end | Cleans up application’s memory used by ARM |


    After the application data is collected, it can be presented through performance
    management tools such as MeasureWare and HP PerfView.


    # Oracle Trace


    Oracle has an API called Oracle Trace that is similar to the ARM APIs, except
    that Oracle Trace is available only for Oracle environments. Oracle7 server release
    7.3.2 and SQL*NET release 2.3 are already instrumented with Oracle Trace calls.
    Oracle Trace can be used to instrument an Oracle application to get performance
    data. This set of APIs can also be used to detect the following two types of events
    occurring in an application:


    +   - **Duration or transaction events**: Have a start and stop time associated
    with them.

    - **Asynchronous events**: Refer to special conditions, such as errors.


    Tables 8-6 and 8-7 show the Oracle Server 7.3 duration and asynchronous events,
    respectively, that are instrumented for Oracle Trace.


    An operator can use the asynchronous events to create an audit trail of database
    accesses, for example. The duration of various database transactions can be studied
    over time to look for trends.


    An application that has been modified to include calls to Oracle Trace routines
    is called a *facility*. The user configures the facility definition file to define
    which metrics, or *items*, to collect when the application is traced. Table 8-8
    shows the items available, by default, for every event.


    Additional cross-facility items, such as the Oracle7 Server Transaction ID, can
    be used to correlate data collected from multiple applications.


    After an application has been instrumented, performance analysis can be enabled
    from the OEM console. In fact, the Oracle Trace Manager can automatically discover
    applications that have been instrumented using Oracle Trace APIs. A trace can
    be started or stopped, and data can be viewed from past or currently active traces.
    Applications can also start and stop tracing from within themselves. Multiple
    facilities can be included in the same trace. When the trace, called a *collection*,
    is stopped, the data is written to a collection file.


    In addition to viewing trace information from the GUI, reports can be run against
    the collection file. The otrcrep command generates a detailed trace report, displaying
    statistics for all'
  merge: -1
