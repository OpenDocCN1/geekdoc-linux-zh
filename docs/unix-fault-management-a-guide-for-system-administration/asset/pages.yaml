- pgno: 205
  md: 'The example in Listing 7-3 shows only memory information, but a variety of
    additional metrics are also available. Here is a summary of the information available
    for each process:


    +   - User ID, PID, effective user ID, real and effective group ID, and parent
    PID

    - Number of real pages used for data, text, or stack

    - Number of real pages used for shared memory, memory mapped files, and so forth

    - Number of virtual pages used for data, text, stack, shared memory, and so forth

    - Priority and nice value

    - Terminal device ID

    - Process group and PRM group ID

    - Address of process in memory

    - User and system time spent executing

    - Time process started

    - Process status and status flags

    - Processor last used by process

    - Command line and executable base name for process

    - CPU time used

    - Current and high-water mark of resident set size

    - Number of swaps, page faults, and page reclaims

    - Number of signals or socket messages received

    - Number of socket messages sent

    - Scheduling policy of process

    - Session ID

    - File ID of process'' root directory, current directory, and executable

    - Highest file descriptor currently opened

    - Number of characters read and written


    More information about the process and system metrics available from this interface
    can be found in the system include file, /usr/include/sys/psstat.h.


    # Fault Detection Tools


    This section describes products that can be used to detect application failures.
    Additional tools for monitoring application performance are discussed later in
    the chapter.


    # IT/Operations


    IT/Operations (IT/O) is a sophisticated management product for system operators.
    Systems in the enterprise can be displayed on maps onscreen, with colors representing
    their current status. An Application Bank is included for default and customized
    tools that can be launched from a particular system. Events can be sent from systems
    throughout the enterprise, and configured recovery actions can then be taken.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'IT/O can also be used to monitor specified components on a managed system.
    Some predefined monitors are provided, one of which has the ability to monitor
    specific processes. An event is sent to the IT/O console if a process fails. A
    recovery action can be configured to restart the application.


    Although IT/O can detect an application failure and restart the application, it
    does not have sufficient high availability capabilities to move an application
    to another system or ensure that only one copy is running. More extensive high
    availability capabilities are provided by MC/ServiceGuard, which is discussed
    next.


    # ## MC/ServiceGuard


    MC/ServiceGuard is a high availability product from Hewlett-Packard that is used
    to protect your critical applications and servers. MC/ServiceGuard is most commonly
    used in a multisysem (cluster) environment. The MC/ServiceGuard software on each
    system monitors the other systems in the cluster. MC/ServiceGuard can detect the
    failure of systems, networks, and applications. For example, MC/ServiceGuard can
    recover transparently from a LAN failure.


    After deciding which applications need to be protected, you configure them as
    packages by using MC/ServiceGuard commands or the graphical interface accessible
    from SAM. Numerous attributes of the application need to be defined, such as the
    following:


    +   - Name of application

    - Scripts used to start and stop application

    - Processes or services that make up application

    - Subnetworks used by application

    - Alternate systems on which application can run

    - Additional resource dependencies


    MC/ServiceGuard then monitors these services and dependencies. If a failure occurs,
    the package is either restarted locally or moved and restarted on another system.
    Similarly, when a system failure occurs, MC/ServiceGuard software can detect the
    problem and automatically restart critical applications on an alternate node.


    MC/ServiceGuard software detects a variety of error conditions, but does not have
    a sophisticated notification mechanism for you to learn what happened. Errors
    are often written to the system log file, which helps retrace what happened.


    Because MC/ServiceGuard can automatically move applications to other systems,
    it may be difficult for you to know the current status of your application. MC/ServiceGuard
    commands, such as cmviewcl, can tell you the current state of a cluster and its
    packages. The HP MC/ServiceGuard MIB also contains this information. However,
