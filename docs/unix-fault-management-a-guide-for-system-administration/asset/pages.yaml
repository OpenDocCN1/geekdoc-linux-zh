    \ a time interval, you can have vmstat run continuously so that you can see how\
    \ values vary over time.\n\n# Using System Instrumentation\n\nStandards for network\
    \ and system management, such as Simple Network Management Protocol (SNMP) and\
    \ Desktop Management Interface (DMI), have been developed to help make management\
    \ easier. They provide industry-standard ways to build instrumentation and to\
    \ interface into the instrumentation. SNMP is used to access Management Information\
    \ Bases (MIBs), and DMI is used to access Management Information Formats (MIFs).\n\
    \nStandard MIBs and MIFs define the metrics that can be instrumented by any vendor.\
    \ Vendor-specific MIBs and MIFs provide vendor-specific instrumentation. This\
    \ section looks at some of the system instrumentation available through each of\
