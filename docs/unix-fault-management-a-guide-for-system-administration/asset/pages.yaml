- pgno: 283
  md: 'agent can be extended through configuration files that describe new managed
    objects and actions to be taken. The MIB value can be the output from a command,
    or the contents of a user-specified file. The Extensible SNMP Agent can generate
    user-defined SNMP traps based on configured conditions. When it is used with HP
    OpenView Network Node Manager (NNM) or IT/Operations (IT/O), automated actions
    can also be taken when the trap is received.


    MIBs often originate as Internet draft documents. These draft specifications can
    be created by anyone, but before becoming standards, they are reviewed by the
    Internet Engineering Task Force (IETF). After review, these documents are published
    as Requests For Comments (RFCs). RFC specifications can be found on the Web at
    http://www.ietf.org, along with other IETF documents.


    In addition to the standard MIBs, many vendors provide unique MIBs for their own
    hardware or software products. Hewlett-Packard, for example, provides an MIB for
    its MC/Service-Guard product. Oracle provides its own proprietary MIB specifications
    under the private branch. These private documents are subject only to the reviews
    appropriate to the issuing organization.


    A management application can receive the MIB information by making an SNMP Get
    request, which can be a blocking or nonblocking call. The reply from the subagent
    includes the OID, variable type, and value. SNMP also supports SNMP Set requests,
    but this capability often isn''t implemented by the subagents.


    In addition to responding to SNMP requests for information, a subagent can initiate
    notification of an event through the SNMP trap mechanism. SNMP traps are an important
    tool for integrating with other management frameworks, because a process is typically
    provided on the management station that listens for these traps. Subagents can
    forward key event information to different management applications by using this
    one mechanism.


    SNMP trap configuration information is stored in the configuration file /etc/SnmpAgent.d/snmpd.conf,
    which is where you specify SNMP community names. If configured, the SNMP agent
    allows only those requests with the specified community name. You can specify
    a different community name configuration for SNMP Set and Get requests. The destination
    addresses where traps should be sent are also specified in this configuration
    file. You should be sure to list the IP address of your management station.


    The Event Monitoring Service (EMS) uses SNMP traps as one method of forwarding
    resource events to target applications. EMS has a MIB defined, which includes
    the various traps that can be sent. The enterprise OID for EMS traps is 1.3.6.1.4.1.11.2.3.1.7.
    Using the SNMP trap notification provided by EMS, monitors can generate events
    via SNMP traps to multiple applications and platforms without having to make SNMP
    function calls directly


    Like most enterprise management platforms, Hewlett-Packard''s OpenView IT/O and
    NNM provide event handlers that listen for SNMP traps and can display events,
    log events, and generate automatic actions when they are received. Templates are
    provided to define the handling of specific SNMP traps. The templates define the
    event message to be displayed, the severity of the event, the name of the system
    sending the event, the message group or category for the event, and the automatic
    or operator-initiated action for the event. New trap definitions can easily be
    added to a template so that the event will be recognized and properly formatted.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Each trap is identified by its OID as well as generic and specific trap numbers.
    The trap includes the address of the agent sending the event and a list of variables.
    Using the template, the event handler assigns the event to a category and then
    assigns the severity configured in the template. The message is formatted based
    on the format string in the template. The variables contained in the trap message
    can be used in the formatted event message that is displayed in the Message Browser.


    Management platforms, such as OpenView NNM, provide several tools for accessing
    the MIB information. An MIB Browser is useful for exploring MIBs and querying
    for the MIB values. Figure A-3 shows the result of querying for the operational
    status of the LAN interface cards from the MIB-II.


    NNM not only provides a simple MIB Browser, it also provides a Data Collector
    tool that collects the MIB data for historical trending and problem monitoring.
    You can define thresholds to generate an event when specified thresholds are exceeded.
    The NNM Application Builder MIB tool enables you to quickly develop an application
    to monitor the MIB variables. The


