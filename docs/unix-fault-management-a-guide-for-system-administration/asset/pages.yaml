    \n# ### Monitoring Notes\n\nIf you intend to write your own SNMP application,\
    \ the numeric root OID of the RMON MIB is 1.3.6.1.2.1.16. RMON II is an extension\
    \ of this MIB.\n\nThe protocol directory lists all the protocols that the monitor\
    \ supports. A monitor can add more protocols, but the extensibility is limited.\n\
    \nThe protocol distribution group shows per-protocol statistics for the amount\
    \ of data and packets being sent on a LAN segment. From this information, you\
    \ can calculate the bandwidth utilization per protocol and, hopefully, isolate\
    \ a troublesome application.\n\nThe address mappings group is used to map a network\
    \ address to the station address to which it is bound. The network layer host\
    \ group then shows the amount of traffic for each network address. The network\
    \ layer matrix group shows network traffic statistics between pairs of network\
    \ addresses. You can also see the top traffic producers.\n\nThe application layer\
    \ host shows network traffic statistics for a particular network address, broken\
    \ down by protocol. Similarly, the application layer matrix shows this information\
    \ for traffic between a pair of network addresses.\n\n# ### Host Resources MIB\n\
    \nThe Host Resources MIB is a proposed IETF standard for representing host information.\
    \ This MIB requires the implementation of portions of the MIB-II. The Host Resources\
    \ MIB includes information such as the current and maximum number of processes\
    \ on a system and the system uptime. This MIB may be used to represent information\
    \ about a computer system or about a device, such as a network printer.\n\n# ####\
    \ MIB Definition\n\nListing A-4 shows the complete specification for the Host\
    \ Resources MIB, as defined in RFC 1514.\n\n# #### Listing A-4    Host Resources\
    \ MIB specification.\n\n```\nmib_2\n\t[25] host\n\t\t[1] hrSystem\n```"
