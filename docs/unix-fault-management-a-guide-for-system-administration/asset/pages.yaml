    \ such as TCP/IP and IPX/SPX.\n\n# ## Managing Database Resources and Performance\n\
    \nMonitoring database resources and performance can ensure that the database is\
    \ being used effec-\n   tively. The most common database problems are related\
    \ to resource management. Some com-\nmon errors are:\n\n+   - Out of disk space\n\
    - Log file full\n- Performance overload\n\nSystem and database resources should\
    \ be studied periodically to detect trends. The opera-\ntor should check the free\
    \ space for tables, tablespaces, and indexes. Continual modifications and\nupdates\
    \ to a database can lead to database fragmentation, which means that the available\
    \ storage\nfor the database is scattered. Each available storage area is too small\
    \ to be used and thus is\nwasted. Eventually, increased database fragmentation\
    \ can lead to performance problems or even\ndatabase failure. Some database monitoring\
    \ tools help detect database fragmentation so that cor-\nrective action can be\
    \ taken, such as restructuring the database objects.\n\nPerformance problems can\
    \ be difficult to diagnose. Many database performance problems\nare caused by\
    \ a poorly designed database, or programs that are not coded efficiently. For\
    \ these\ncases, a simple solution is unlikely. Therefore, the database operator\
    \ needs monitoring tools that\ncan predict performance problems and provide corrective\
    \ actions when appropriate.\n\n# ## Keeping the Database Server Secure\n\nYou\
    \ should also be able to detect security intrusions or access violations related\
    \ to the database\nserver. Monitoring tools can track unsuccessful logins, privileged\
    \ statement executions, and\nother events that are important for maintaining database\
    \ security.\n\nYou may also want to use the network monitoring tools discussed\
    \ in Chapter 6 to help\nkeep your systems secure. Network firewalls can stop intruders\
    \ before they are able to access a\ncomputer system.\n\n# ## Ensuring Successful\
    \ Database Backups\n\nYou also need to back up the systems and ensure that the\
    \ backups run successfully. Depending\non how the database is being used, different\
    \ types of backup tools may be needed. A system\noperator responsible for the\
    \ backup and restore procedures for hundreds of systems may not\nhave the expertise\
    \ to handle the procedures associated with a database vendor’s backup tool.\n\
    Automated tools for managing and monitoring database backup can be helpful in\
    \ lowering the\nskill level needed for the job."
