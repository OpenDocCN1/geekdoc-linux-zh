- pgno: 175
  md: '# Monitoring Network Services


    A variety of applications can be accessed over the Internet or via corporate intranets.
    For instance, a client application may use the network to access an application
    on the server system. The application running on the server system is referred
    to as a network service.


    The availability and response time of the network service is what the user cares
    about. This section discusses tools for monitoring the network service. Some of
    the more common network services are discussed, such as the Domain Name System
    (DNS), Network Information Service (NIS), and Network File System (NFS). Other
    applications are discussed in Chapter 7.


    Many network services are started by a *daemon* process in response to a client
    request. The daemon process is called *inetd*. You can use *ps* to see whether
    this daemon is running. If it is not running, you should try to restart it by
    executing `/usr/sbin/inetd` as *superuser*. You can use *netstat* –a to list the
    network applications currently running on a system. The TCP or UDP socket ports
    associated with each service are listed in the file `/etc/services`. If a service
    is not running, you may want to check this file to see whether the service is
    configured. The service should also be listed in the file `/etc/inetd.conf`. The
    *inetd* daemon writes error and informative messages to `/var/adm/syslog/syslog.log`
    when new services are started or stopped.


    There are other important network services that are up all the time (or should
    be). These services include NFS and HTTP. The rest of this section lists monitoring
    tools specific to each network service.


    # Monitoring DHCP/BOOTP Servers


    The Bootstrap Protocol (BOOTP) allows systems to obtain their network configuration
    information, such as their IP address, from a remote server system. The BOOTP
    service *bootpd* may use the Trivial File Transfer Protocol (TFTP) to transfer
    data back to the client. Make sure that both are configured as Internet services
    in `/etc/services` and `/etc/inetd.conf`.


    When receiving a BOOTP request, a service checks whether it has information for
    the client in its database. If it does, it replies with the information; otherwise,
    it may forward the request to another system. You may need an analyzer to ensure
    the key parameters set by the client in the BOOTP request are correct.


    Client information is put in the file `/etc/bootptab`. If BOOTP is working correctly
    in general, but not for a specific system, you should check this file to ensure
    the configuration information is correct. You may want to issue a test from the
    server by using *bootquery*, which can be used to send test BOOTP requests to
    the BOOTP server. In this way, you can verify that the service is starting in
    response to a query. By specifying the client address in the query, and by enabling
    replies to this client to be broadcast — a configuration option in `/etc/bootptab`
    — you can see the actual reply sent by this BOOTP server.


    Dynamic Host Configuration Protocol (DHCP) is a superset of BOOTP. Both *bootpd*
    and DHCP can write some error messages to the system log file. If you are troubleshooting
    a problem, make sure that *bootpd* is started with the `–d 2` command option,
    to enable informative log messages to be written to the system log file.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'DHCP allows for clients to obtain their IP address from a pool of available
    addresses. The /etc/bootptab file is used for BOOTP clients and for DHCP clients
    with fixed IP addresses. Clients belonging to a pool are configured in /etc/dhcpdtab.


    On HP-UX, dhcpools can be used to trace DHCP packets or to examine the internal
    state of the DHCP daemon. This can be used, for example, to find configuration
    problems. The operator can determine whether IP addresses are available to be
    given out to clients, and the total number of IP addresses available. dhcpools
    also has an option to allow for packet tracing of DHCP requests and replies.


    Note that monitoring the server status is difficult, because DHCP can shut itself
    down when it has nothing to do.


    # ## Monitoring DNS/NIS Name Servers


    Domain Name System (DNS) and Network Information Service (NIS) are two services
    for providing name resolution. NIS has additional capabilities, such as maintaining
    consistent configuration information across multiple systems.


    An easy way to check these services is to make a query to the server application.
    In addition to checking the service availability, you can get a snapshot of the
    response time. Note that in this and other examples, the monitoring of the service
    is being done from the client system.


    The configuration file /etc/resolv.conf contains the IP addresses of name servers
    being used by the local system. An example is shown in Listing 6-16. You may want
    to ping the servers listed in this file if you are having trouble with name resolution.


    # ### Name Service Switch


    The Name Service Switch enables you to specify which name service should be used
    for name resolution and other queries. You may want to check the /etc/nsswitch.conf
    file to see how name resolution is being done on your system. The nsquery command
    can be used to test the behavior of the Name Service Switch.


    # ### nslookup


    nslookup can be used to determine whether a name server is aware of a particular
    host name. Listing 6-17 shows a name server successfully resolving the system
    name to an IP address.


    # ## Monitoring FTP


    File Transfer Protocol (FTP) is used for transferring files efficiently between
    systems. An easy way to check whether FTP is working is to use ftp to transfer
    an arbitrary file. Along with an indication


    # **Listing 6-16** Checking name servers in /etc/resolv.conf.


    ```

    ```

    # more /etc/resolv.conf

    domain cup.hp.com

    nameserver 15.27.217.36  # cup44ux

    nameserver 15.13.168.63  # hpperfl

    ```

    ```'
