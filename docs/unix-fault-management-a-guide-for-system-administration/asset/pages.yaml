    # Using Additional Products to Monitor Network Links


    The standard commands shipped with the UNIX operating system provide substantial
    capabilities for monitoring your network links. However, you can also buy products
    that extend these capabilities. A few examples are given in this section.


    # EMS HA Monitors


    The Event Monitoring Service (EMS) is a free software package for HP-UX systems
    to monitor system hardware components. EMS provides libraries so that additional
    hardware and software monitors can be added. Hewlett-Packard provides the HA Monitors
    product, which can be used to detect LAN interface status changes. HA Monitors
    discovers all the network interfaces. Monitoring can be enabled for one or all
    network interfaces. This status information is similar to that provided by the
    MIB-II or lanscan, but EMS allows for information to be communicated automatically
    through a variety of notification methods. For example, EMS can send an e-mail
    message, log an event to the system log or an arbitrary text file, or report a
    problem to MC/ServiceGuard, HP’s high availability cluster software. Events can
    also be reported via TCP, User Datagram Protocol (UDP), SNMP, opcmsg (a proprietary
    communication protocol used by IT/O), or e-mail, as long as it does not require
    the use of a failed NIC.


    To configure EMS network monitoring, you use SAM. From the Resource Management
    functional area, you select the Event Monitoring Service and then select the action
    to add a new monitoring request. Resources are grouped into categories, and by
    selecting /net, you can see the interfaces available to be monitored. You can
    choose an interface to be monitored, or select all of them, and then enter the
    monitoring parameters. A portion of the EMS configuration is shown in Figure 6-7.


    ATM and HyperFabric adapters can also be monitored by using EMS. An EMS monitor
    is included with each of these products.'
