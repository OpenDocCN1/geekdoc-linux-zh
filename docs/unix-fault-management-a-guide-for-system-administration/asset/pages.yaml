    \ line. This command reports process accounting data for the command and all of\
    \ its children, as well as the total system activity during execution of the command.\
    \ The **timex** command can give you a crude idea of the impact of a command on\
    \ the rest of the system.\n\n# **top**\n\nThe **top** command is useful for monitoring\
    \ the system CPU and memory loads. It also lists the most active processes on\
    \ the system. **top** output is displayed in the terminal window and is updated\
    \ every five seconds, by default.\n\n    **top** shows CPU resource statistics,\
    \ including load averages (job queues over the last 1 minute, 5 minutes, and 15\
    \ minutes), the number of processes in each state (sleeping, waiting, running,\
    \ starting, zombie, stopped), the percentage of time spent in each processor state\
    \ (user, nice, system, idle, interrupt, and swapper) per processor on the system,\
    \ as well as the average for each processor in a multiprocessor system.\n\n  \
    \  For memory utilization, **top** shows virtual and real memory in use, the amount\
    \ of active memory, and the amount of free memory.\n\n    At the process level,\
