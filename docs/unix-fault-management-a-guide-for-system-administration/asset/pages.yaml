    # # Using System Instrumentation


    Standards for network and system management, such as the Simple Network Management
    Protocol (SNMP) and Desktop Management Interface (DMI), were developed to help
    make management easier. They provide industry-standard ways to build instrumentation
    and interface into the instrumentation, respectively. SNMP is used to access Management
    Information Bases (MIBs), and DMI is used to access Management Information Formats
    (MIFs).


    Standard MIBs and MIFs define the metrics that can be used by any vendor’s instrumentation.
    Vendor-specific MIBs and MIFs provide vendor-specific instrumentation. This section
    looks at some of the system instrumentation available through each of these standards.


    Many tools already exist for accessing this instrumentation. Several vendors offer
    browsers and monitoring capabilities that use a common interface to access instrumented
    objects from different hardware platforms and operating systems. For example,
    the common enterprise management frameworks, such as the HP Network Node Manager,
    include a MIB Browser tool to access MIB data. They may also include tools that
    can be used to monitor MIB data on remote systems from the enterprise management
    platform. Toolkits are available that provide an interface with which people can
    write their own tools to monitor or track this information. Furthermore, toolkits
    exist for creating your own instrumentation.


    Many valuable system resources can be monitored via these standard interfaces,
    to detect system events or faults. Some of the resources that you may be interested
    in are reviewed in this section.


    # ## SNMP


    A MIB is a standard way of representing information of a certain category. For
    example, MIB-II provides useful information about a system, such as the number
    of active TCP connections, system hardware and version information, and so forth.
    OpenView IT/Operations (IT/O), discussed later in this chapter, provides a MIB
    Browser. The MIB Browser tool helps you to discover which MIBs are available,
    and to see the information being provided by each MIB. The MIB Browser tool can
    check the value of anything contained in a MIB. If you find a MIB that contains
    some useful fields, you can use the MIB Browser to gather that data from the target
    system. The resulting data is displayed in the MIB Browser’s output window on
    the screen. By browsing through available MIBs, and by querying values of selected
    MIB fields, you can gather specific information needed to monitor systems and
    troubleshoot problems.


    The SNMP interface provides access to objects stored in various MIBs. MIB-II is
    a standard MIB that has been implemented on most UNIX systems. On HP-UX systems,
    the HP-UNIX MIB defines various metrics for monitoring system resources. Other
    vendors, such as Sun, have vendor-specific MIBs that provide similar information.
    Appendix A includes complete MIB definitions.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'MIB-II, the “System MIB,” is a standard repository for information about a
    computer system, and is supported on a variety of platforms, including UNIX and
    Windows NT. MIB-II contains information about a computer system, such as its name,
    system contact, and the length of time that it has been running. It also contains
    statistics from the key networking protocols, such as TCP, UDP, and IP. Statistics
    include packet transmission counts and error counts. Table 4-1 lists several variables
    in MIB-II that will help you to monitor system resources effectively. Both the
    actual MIB variable name and a description are provided for each variable.


    The HP-UNIX MIB contains important information about the users, jobs, filesystems,
    memory, and processes of a system. The number of users logged in to the system
    and number of jobs running are both indications of how busy the system is. Reduced
    amounts of free swap space or filesystem space can serve as warnings of potential
    problems. The process status can be checked to see whether a particular application
    is still running normally on the target system. Table 4-2 contains some of the
    interesting metrics from the HP-UNIX MIB for monitoring system resources.


    # Table 4-1 Important MIB II Fields to Monitor


    | MIB Variable Name | Description |

    | --- | --- |

    | sysDescr | System description |

    | sysObjectID | Unique identifier for the system |

    | sysUpTime | Amount of time since the last system reboot |

    | sysContact | System contact person |

    | sysName | System name |

    | sysLocation | System location |

    | sysServices | The network services performed by this system |


    # Table 4-2 Important HP-UNIX Variables to Monitor


    | MIB Variable Name | Description |

    | --- | --- |

    | computerSystemUsers | Current number of users on the system |

    | computerSystemAvgJobs1 | Average job queue length over the last minute |

    | computerSystemAvgJobs5 | Average job queue length over the last 5 minutes |

    | computerSystemAvgJobs15 | Average job queue length over the last 15 minutes
    |

    | computerSystemMaxProc | Maximum number of processes allowed in the system |

    | computerSystemFreeMemory | Amount of free memory |

    | computerSystemPhysMemory | Amount of physical memory |

    | computerSystemMaxUserMem | Maximum user memory |

    | computerSystemSwapConfig | Amount of swap space configured |

    | computerSystemEnabledSwap | Amount of swap enabled via swapon |

    | computerSystemFreeSwap | Amount of free swap space |

    | computerSystemUserCPU | Amount of CPU used by users |

    | computerSystemSysCPU | Amount of CPU used by the system |

    | computerSystemIdleCPU | Amount of idle CPU |'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'System resource information can also be retrieved by using the Desktop Management
    Interface (DMI), which is another standard for storing and accessing management
    information. Management information is represented in a text file in the Management
    Information Format (MIF). Management information is divided into components. Each
    component has a Service Provider (SP) that is responsible for providing DMI information
    to the management applications that request it.


    Several system platforms, including HP-UX, provide instrumentation for the System
    MIF and the Software MIF. Appendix A contains a complete listing of these MIFs.


    Similar to MIB-II, the System MIF can be used to get generic system information,
    such as how long it has been running, and system contact information. It includes
    the system name, boot time, contact information, uptime, the number of users,
    as well as some information about the filesystem and disks.


    The Software MIF provides information about the software products and product
    bundles installed on the system. The Software MIF can be a useful tool after a
    problem with a product has been discovered. By using a MIF Browser, you can examine
    the Software MIF to see whether the problem might be caused by a bad patch installation
    or a modified file. The MIF contains revision information for each product, and
    its creation and modification times. Version information can be checked to see
    whether a compatibility problem exists. Finally, the product''s vendor information
    is provided in case product support personnel needs to be contacted.


    # Using Graphical Status Monitors


    The graphical status monitoring tools described in this chapter are also referred
    to as *enterprise management frameworks*. These tools monitor multiple systems
    from a central location and display status information graphically.


    Because you may not be able to sit at a console or watch the front panel of each
    system for which you are responsible, you need to be able to monitor system faults
    from a tool that is external (or remote) to the system. Besides, even if the console
    or front panel doesn''t indicate any problems, network problems can make the system
    inaccessible to the end-user. Graphical status monitors can detect connectivity
    problems because they rely on network polls to gather status information.


    Your server may depend on services provided by other systems. For example, network
    services such as the Domain Name Service (DNS), Dynamic Host Configuration Protocol
    (DHCP), Network File System (NFS), and e-mail are critical to the server, but
    are unlikely to be running on the server that you''re monitoring, and consequently
    aren''t tracked by any local monitors. This is critical information, because if
    the DNS is down, other systems may not be able to reach the system being monitored.
    Because the enterprise framework products are gathering status information about
    multiple systems at a central site, it is more likely that both the server and
    its service providers are being monitored.


    Graphical status monitors provide many features that can help you to detect system
    faults, especially hardware or software faults. Most graphical status monitors
    provide hierarchical maps or visual displays that indicate status information.
    This saves you the time of correlating event'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'data from logs to determine status. The graphical status monitors provide remote
    management capabilities, so you aren''t required to have a physical console for
    each system. Furthermore, they can automatically discover the systems in your
    enterprise, so you don''t have to remember system names and manually configure
    them. A graphical view typically can be customized by setting up filters, so that
    you see only those systems that you are responsible for managing.

    This section describes only a couple of the available graphical status monitors.
    Others with similar system monitoring capabilities, such as HP''s IT/O, Sun''s
    Enterprise SyMON, or BMC PATROL, are mentioned in other parts of the book.


    # ## OpenView Network Node Manager


    Network Node Manager (NNM) is a management product based on the HP OpenView platform.
    NNM is used primarily to view and monitor the status of network and system resources.
    Information is displayed graphically through a window-based display. A hierarchical
    set of submaps is available, enabling the customer to navigate and drill down
    through complex network topologies. Network and system components are represented
    graphically in maps as icons, which are color-coded to indicate the health of
    the objects represented. Events are propagated, based on severity, to higher-level
    submaps to indicate events, such as failures, at lower levels. Through pull-down
    menus available in NNM, the operator can run tools to get additional real-time
    status information, or remotely log in to the system and execute diagnostic commands.


    One key feature of NNM is its ability to discover automatically network-addressable
    components, such as routers, hubs, and computer systems. Because the network discovery
    activity uses noticeable network resources, you may want to limit it to just the
    networks that you manage. This can be done by using discovery filters, a configurable
    option in NNM; or, alternatively, you can schedule discovery process(es) to run
    during off-peak hours.


    After discovery is complete, the network topology information is then displayed
    on submaps, with colors used to indicate status. An operator can navigate through
    the submaps to find a particular LAN segment to monitor. In addition to viewing
    systems, an operator can also drill down to see system information, such as configured
    network interfaces. Figure 4-1 shows a segment map with icons indicating the health
    of each system in the segment.


    NNM provides mechanisms to collect statistics and generate reports on individual
    network devices, including systems. NNM periodically checks the status of systems
    and devices by sending an ICMP echo request (ping). If no reply is received, a
    Node Down event is sent as an SNMP trap and logged in the Event Browser. NNM also
    listens to SNMP traps from SNMP supported devices. For instance, if NNM gets a
    Node Down trap, it changes the color of the icon representing the node that just
    went down.


    The NNM Event Browser is a graphical display of the events that have been received
    from systems on the network. Events are sent to the management station as SNMP
    traps. The trap handler receives these traps and stores them in a database. The
    events can be viewed through the Event Browser, and filters can be used to prevent
    the operator from being flooded with noncritical information. Filters can be configured
    based on the sending system or event criticality, for'
