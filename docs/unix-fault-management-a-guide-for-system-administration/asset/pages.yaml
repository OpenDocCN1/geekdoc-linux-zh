- pgno: 349
  md: '# ### Monitoring Notes


    The Software MIF can be a useful tool after discovering a problem with a product.
    Using a MIF Browser, you can examine the Software MIF to see whether the problem
    might be caused by a bad patch installation or a modified file. The MIF contains
    revision information for each product, and its creation and modification times.
    Version information can be checked to see whether a compatibility problem exists.
    Finally, the product''s vendor information is provided, in case you need to contact
    product support personnel.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# GLOSSARY


    **AAL** ATM Adaptation Layer. The AAL translates digital voice, image, video,
    and data signals into the ATM cell format, and vice versa. There are four AALs
    defined (AAL1, AAL2, AAL3/4, and AAL5) that provide different services and have
    been recommended by the CCITT. The services have three distinguishing attributes:
    whether or not they require the transfer of timing information between source
    and destination, whether a constant or variable bit rate is supported, and whether
    the service is connectionless or connection-oriented. For example, AAL5 supports
    connection-oriented variable bit rate data services.


    **ABAP** A programming language used with SAP R/3.


    **ARM** Application Resource Measurement. ARM is a standardized set of APIs for
    measuring application transactions.


    **ARP** Address Resolution Protocol. This protocol is used to find the station
    address associated with a given higher-level protocol address such as an IP address.
    The mappings between IP address and station address are then stored on the local
    system in an ARP cache.


    **ATM** Asynchronous Transfer Mode. A form of digital transmission based on the
    transfer of units of information known as cells. It is suitable for the transmission
    of image, voice, video, and data. Asynchronous operations are allowed between
    the sender clock and receiver clock, with empty packets in the stream used to
    resolve clock differences.


    **CCITT** International Consultative Committee for Telecommunications and Telegraphy.
    CCITT defines international standards for telephony and telegraphy. CCITT standards
    include ATM, but in general their standards are identified by a letter, followed
    by a period, followed by a number. X.400 is an example.


    **CCMS** Computing Center Management System. CCMS is a management tool for the
    SAP R/3 application.


    **cell** A transmission unit of a fixed length used in cell relay transmission
    techniques, such as ATM. An ATM cell is made up of 53 bytes (octets), including
    a 5-byte header and a 48-byte data payload. The 48-byte standard was a compromise
    between the 32-byte size recommended by Europe, and the 64-byte size promoted
    by the U.S. and Japan.


    333'
  merge: -1
  img_proc: true
- pgno: 351
  md: '**CiscoWorks** A network management product from Cisco Corporation.


    **cluster** A generic term used to refer to a set of computer systems sharing
    a common attribute. For HP-UX 10.x and 11.x operating systems, a cluster is often
    associated with the set of HP series 800 computer systems running MC/ServiceGuard
    high availability software and being commonly administered.


    **ClusterView** A Hewlett-Packard product used to manage groups of systems, or
    clusters. It is an HP OpenView application designed primarily to monitor high
    availability clusters such as MC/ServiceGuard and MC/LockManager. ClusterView
    can also monitor Windows NT high availability clusters, and other groups of systems,
    such as an EPS cluster.


    **CMIP** Common Management Information Protocol. CMIP is a protocol standardized
    by Open Systems Interconnection for accessing management information and receiving
    status events.


    **collision** A network transmission error caused by two network devices trying
    to send data on a shared medium at the same time.


    **COPS** Computer Oracle and Password System. A network monitoring product for
    Unix systems. COPS checks for security weaknesses and provides warnings.


    **CPU** Central Processing Unit. The computer component responsible for executing
    the machine instructions on behalf of user and system processes.


    **CRC** Cyclic Redundancy Check. LAN technologies such as Ethernet and Token Ring
    use a CRC field in the network packet to ensure that the data is exchanged with
    the target without error.


    **DBA** Database Administrator.


    **DHCP** Dynamic Host Configuration Protocol. A protocol to help with the administration
    of IP addresses and other configuration information. A client requests its configuration
    information from a DHCP server automatically, instead of requiring manual configuration
    by a system administrator.


    **DML** Data Manipulation Language. DML is the set of SQL commands that affect
    the contents of database objects (e.g., `SELECT`, insert, update).


    **DNS** Domain Name System. A name service for translating between computer system
    names and IP addresses.


    **DSI** Data Source Integration. A MeasureWare API that allows the MeasureWare
    Agent to collect data from different data sources.


    **ELAN** Emulated LAN. An ELAN interface is an ATM card running LAN emulation.


    **EPS** Enterprise Parallel Server. Enterprise Parallel Server is Hewlett-Packard’s
    high-end clustered server product.


    **ERP** Enterprise Resource Planning. ERP applications such as Baan and SAP R/3
    are used by corporations for supply-chain management.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '**extent** An amount of disk space allocated to a file with the intent of keeping
    future records physically close together.


    **FCS** Frame Check Sequence. A checksum used to indicate whether a packet has
    been corrupted on the network medium.


    **FDDI** Fiber Distributed Data Interface. FDDI is a LAN technology that uses
    fiber optics and is capable of data rates of 100Mbps.


    **firewall** A system separating multiple networks to limit access by enforcing
    a security policy.


    **GlancePlus** A real-time, graphical, performance monitoring product from Hewlett-Packard.


    **ICMP** Internet Control Message Protocol. This networking protocol is part of
    the TCP/IP protocol suite and is used for passing error and control information
    between gateways and other systems. The ping command uses the ICMP protocol. The
    ICMP protocol uses IP datagrams for transmitting its information.


    **inode** A kernel data structure associated with a file or directory in the filesystem.


    **IP** Internet Protocol. IP is a network protocol and is part of the TCP/IP protocol
    suite. IP provides the packet routing and delivery functions for TCP, UDP, and
    ICMP.


    **IP address** Internet Protocol address. An IP address is currently a 32-bit
    address consisting of a network identifier and a system identifier. A name resolution
    service can convert a system name to an IP address. Network applications usually
    use a name or IP address for communication. The networking kernel software then
    converts the IP address to a station address using ARP.


    **ISO** International Standards Organization. An international organization that
    creates standards to facilitate the exchange of goods and services among nations.


    **IT/O** IT/Operations. A network management product from Hewlett-Packard. IT/O
    includes the Network Node Manager and also provides an Application Desktop for
    launching administrative tools.


    **JFS** Journalled File System. A journaled filesystem can track updates to a
    file so that if the file is damaged, it can be recovered.


    **kernel** The operating system controlling system services such as memory management,
    CPU scheduling, and device I/O.


    **LAN Emulation** Local Area Network Emulation. A protocol to make an ATM network
    look and behave like an Ethernet or Token Ring LAN. The LANE protocol defines
    a service interface for higher-layer (the network layer) protocols that is identical
    to that of existing LANs. Data sent across the ATM network is encapsulated in
    the appropriate LAN packet format. LAN Emulation allows interoperability between
    ATM and existing LAN technology.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '*LVM Logical Volume Manager*. A set of commands for managing your disks. In
    addition to setting up logical volumes, LVM can be used to stripe data across
    disks and to mirror data.


    *MAC* Media Access Control. Station addresses are also referred to as MAC addresses.


    *managed node* The computer system being monitored or managed.


    *management station* The computer system from which you monitor other systems
    in the enterprise.


    *Mb*ps Million bits per second.


    *MC/LockManager* A high availability product from Hewlett-Packard. It is used
    to protect applications running in the Oracle Parallel Server environment on HP-UX
    systems.


    *MCSE* Multi-Computer System Environment. MCSE refers to the Hewlett-Packard management
    software used to support the Enterprise Parallel Server. This software has been
    rendered obsolete by the ClusterView product.


    *MC/ServiceGuard* A high availability product from Hewlett-Packard that protects
    HP-UX systems and restarts applications when they fail.


    *MeasureWare* A performance management product from Hewlett-Packard.


    *MERIT* Maximizing Efficiency of Resources in Information Technology. A project
    sponsored by Computer Associates, Inc.


    *MIB* Management Information Base. A MIB is an SNMP format for representing information
    about managed components.


    *MIB-II* A standard defining how to store management information pertaining to
    a computer system.


    *MIF* Management Information Format. A MIF is a Desktop Management Interface format
    for representing information about managed components.


    *MPI* MultiProtocol Interchange. An Oracle product used to provide application
    connectivity by translating between different network transport stacks such as
    TCP/IP and IPX/SPX. MPI uses SQL*NET.


    *MTU* Maximum Transmission Unit. The MTU is the maximum size of a packet that
    can be sent on a network link. For example, the data portion of an Ethernet frame
    cannot exceed 1500 bytes. Transfer of data across links with different MTU sizes
    can lead to fragmentation by the IP layer.


    *NetManager* A network management product from Sun Microsystems.


    *NetMetrix* A network performance management product from Hewlett-Packard.


    *NetView* A network management product from IBM Corporation.


    *NFS* Network File System. NFS provides transparent access to remote, networked
    file systems. The physical location of files is hidden from the user.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '**NIS** Network Information Service. NIS can be used to store and distribute
    information such as configuration data from a central location.


    **NNM** Network Node Manager. NNM is a network management product from Hewlett-Packard.
    It provides status and discovery of network devices.


    **OID** Object Identifier. An OID refers to the unique identifier for a MIB variable.


    **Oracle Names** A product providing a directory service by making database address
    and database link information available to all systems throughout the network.


    **Oracle Network Listener** An Oracle process that is part of SQL*NET. It is used
    to receive remote database connection requests.


    **OSI** Open Systems Interconnection. The ISO model for computer networks that
    is a standard way to describe network behavior. Networks are divided into seven
    layers: physical, data link, network, transport, session, presentation, and application.


    **package** An MC/ServiceGuard package is an application that has been specifically
    configured with high availability protection. The package configuration includes
    the control scripts needed to start and stop the application, and the list of
    processes and resources needed to run the application.


    **packet** A block of data sent over the network.


    **PerfView** A graphical performance monitoring product from Hewlett-Packard.


    **PID** Process Identification. A unique identifier for a process running on a
    computer system.


    **ping** Packet Internet Gropor. The ping command uses the ICMP protocol to test
    the connectivity to a remote system.


    **promiscuous mode** A LAN interface in promiscuous mode will read all packets
    given to the system, not just those addressed to it.


    **PVC** Permanent Virtual Circuit. A PVC is a channel through a network provided
    by a carrier between two end points for dedicated, long-term information transfer
    between two locations.


    **RAM** Random Access Memory. All or a portion of a program''s pages are loaded
    into RAM to be executed.


    **RARP** Reverse Address Resolution Protocol. RARP is a protocol that maps a station
    address to an IP address. It can be used by a diskless workstation to get its
    IP address.


    **RDBMS** Relational Database Management System. For example, Oracle, Sybase,
    and Informix are relational database management systems.


    **RFC** Request For Comments. RFCs are publicly available specifications for Internet
    protocols.


    **RMON** A remote monitoring standard for collecting network performance data.


    **RPC** Remote Procedure Call. With RPC, a procedure call on a local system results
    in a procedure being executed on a remote system.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'SAM System Administration Manager. SAM is an administration tool for HP-UX
    computer systems.


    SATAN Security Administrator Tool for Analyzing Networks. SATAN is a public-domain
    tool for analyzing system security and identifying weaknesses.


    SGA Shared Global Area, or System Global Area. The shared database segment containing
    temporary data caches used by the Oracle7 and Oracle8 server’s while the server
    is running.


    SNMP Simple Network Management Protocol. SNMP is a standard for getting and setting
    management information, and for reporting management events.


    SONET Synchronous Optical Network. SONET is a set of standards for the digital
    transmission of information over fibre optics.


    SP Service Provider. An SP is an intermediary between management applications
    and the information about a managed component.


    SPOF (or SPof) Single Point Of Failure. A single hardware or software component
    that is unprotected such that its failure will make your application or service
    unavailable. Configuring redundancy into your environment can avoid these single
    points of failure.


    SQL Structured Query Language. SQL is a language that allows you to specify database
    queries as relational expressions.


    SQL*NET Oracle software that provides remote connectivity for clients to the database
    server. It is the SQL database module at the session layer in the OSI protocol
    stack.


    station address The unique address of a network interface card. It is also referred
    to as a MAC address, or physical address. The station addresses on an Ethernet
    are 48 bits. The first 24 bits are assigned to a hardware vendor, and the vendor
    is then responsible for keeping the remaining bits unique.


    subnet A portion of a network sharing a network address with other portions of
    the network. The host portion of the address is further subdivided into a subnet
    number and a host number, with a subnet mask specifying how many bits are used
    by each.


    SVC Switched Virtual Circuit. A channel established on demand that is used for
    transferring information between two locations. The connection is established
    by network signalling, and lasts only for the duration of the transfer.


    swapping A technique used by the memory management service during periods of heavy
    memory use on the computer system. The pages in memory of a process that is not
    executing are swapped out to disk to make room for the code and data needed by
    the currently executing process.


    SyMON A management software product for Sun Solaris systems.


    TCP Transmission Control Protocol. A transport protocol providing a reliable,
    connection-oriented service for transferring network data.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '**TME** Tivoli Management Environment. TME is an enterprise management framework
    from Tivoli, a subsidiary of IBM Corporation.


    **TNS** Transparent Network Substrate. The lower layer of SQL*NET that establishes,
    maintains, and tears down connections for Oracle7 servers.


    **Token Ring** A LAN technology providing data transfer rates of 4Mbps and 16Mbps.


    **Transcend** A suite of network performance management and troubleshooting products
    from 3Com Corporation. The available products include Traffix Manager, Network
    Control Services, and Enterprise Monitor.


    **UDP** User Datagram Protocol. A transport protocol providing an unreliable,
    connectionless service for transferring network data. Its network service is provided
    by the Internet Protocol.


    **Unicenter** A product from Computer Associates, Inc. for network and system
    management.


    **V$ table** An Oracle term for a virtual database table that allows a user to
    access memory structures within the shared global area. V$ tables can be used
    to monitor the performance of processes of an Oracle instance. These tables are
    also called dynamic performance tables.


    **X.25** A CCITT standard for packet-switched networks.


    **X.400** A CCITT standard for electronic mail.


    **zombie process** A process that exited without cleaning up its system resources
    properly. The process terminated and the parent was not waiting for it.'
  merge: -1
  img_proc: true
