    # ## SMART Plug-Ins for Databases


    IT/Operations is meant to provide a consistent interface for managing systems
    and networks. The goal of HP''s SMART Plug-Ins (SPIs) is to extend support for
    applications and databases. SPIs are preconfigured solutions that are intended
    to be used with IT/O, although IT/O is not required. Today, SPIS exist for SAP
    R/3, Baan, Oracle, Informix, and Sybase.


    SPIs for Databases provide the same set of metrics as provided by the Oracle Management
    Pak, plus the ability to report information via IT/O''s reliable RPC mechanism,
    not via SNMP traps.


    The tight integration between SPIS and IT/O means that other features are available
    to SPIS, such as event filtering and correlation, and task escalation. Events
    include built-in instructions and operator text that can aid in diagnosis and
    recovery. Corrective actions are predefined for many SPI events.


    Figure 8-3 shows how the SPI for Informix integrates into IT/O. You can see the
    new message groups that were added for Informix by the SPI for Informix. The Application
    Group window shows all the database tools added for SPI for Informix. The Message
    Browser enables you to see messages about the Informix database.


    Unlike EMS, which is focused on fault management, SPIS for Databases focus on
    database configuration and resource management. IT/O templates can specify different
    thresholds for different database instances. SPIS can verify that the database
    processes defined in Oracle''s init.ora configuration file are actually running,
    and their performance can be monitored in GlancePlus and PerfView as a single
    application.


    # ## BMC PATROL Knowledge Modules


    BMC Software, Inc. provides monitoring capabilities through its PATROL software
    suite. With PATROL, you can define thresholds and send events to a console or
    to other management applications. PATROL consists of a console, intelligent agents,
    and more than 40 different monitoring programs, or Knowledge Modules (KMs). Each
    KM is optional, so you can pick the monitors that are best for your environment.


    The console provides a centralized graphical display, with icons representing
    system components or other monitored components. Icons change color to correspond
    to their status. For example, an icon may change to red to represent a critical
    event on its node or component. The PATROL console also provides an Event Browser,
    in which you can filter, correlate, sort, and escalate events. Alarms can be configured
    so that events are sent to the console and shown in the Event Browser. Events
    can also be configured to go to HP OpenView IT/O or other SNMP-based management
    stations.


