    # Collecting Network Performance Data


    This section describes some of the tools available for collecting network performance
    information. Some overlap exists between network performance management and system
    performance management. For example, a network application may have a low network
    transmission rate because it isn''t getting sufficient CPU time to send its data.
    Consequently, overlap also exists between the tools used for system and network
    performance management.


    # Using RMON and RMON-II Instrumentation


    RMON I and RMON II (defined in RFCs 1757 and 2021, respectively) together form
    a standard for network performance management. Monitors, or probes, are placed
    on specific LAN segments and then collect data on those segments. Packet statistics
    and performance history can be stored. An RMON management application can collect
    data from remote RMON probes and present it at a central site. Alarms can also
    be triggered based on specified conditions and sent to the management station.


    The RMON definition consists of the following optional sections, or groups:


    +   - Statistics

    - History

    - Alarm

    - Hosts

    - HostsTopN

    - Matrix

    - Filter

    - Capture

    - Event'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The statistics section provides information on the amount of data being sent
    on a particular Ethernet interface, including the number of broadcasts, errors,
    and collisions. You can also see the distribution of packets of different sizes.


    The history group allows statistics to be sampled at a specified polling interval
    and summed over time. The RMON statistics are Ethernet-centric, but extensions
    to support Token Ring are defined in RFC 1513.


    The alarm and event groups are used to report when configured thresholds are met.
    Statistics are periodically checked to see whether a threshold has been met. After
    an event is sent, no additional events are sent until the opposite threshold has
    been met.


    RMON probes can discover new systems, or hosts, by watching the source and destination
    station addresses in packets passing on the LAN segment. The hosts group stores
    each address seen on the interface. A variety of important statistics are kept
    about each system, such as the number of packets sent and received, the number
    of error packets sent, and the number of broadcasts sent. This can be invaluable
    information for catching a misbehaving system that is dominating the network bandwidth
    on a LAN segment.


    The hostsTopN group keeps track of the top systems on the segment for a specific
    statistic, such as packets received, error packets sent, or broadcast packets
    sent. The number of systems in the list is configurable.


    The matrix group can be used to determine traffic problems. Statistics are kept
    on the network conversations between two addresses. Information collected includes
    the number of packets sent in either direction, and the number of error packets
    sent.


    The filter and capture groups work together to capture packets sent on a segment.
    A management station can then download the packets.


    RMON focuses on the data link and network layers of the network stack. RMON-II
    extends the specification to include the transport, session, presentation, and
    application layer protocols. Additional groups provided by RMON-II include:


    +   - Protocol Directory

    - Protocol Distribution

    - Address Mapping

    - Network Layer Host

    - Network Layer Matrix

    - Application Layer Host

    - Application Layer Matrix


    The Protocol Directory lists all the protocols that the monitor supports. A monitor
    can add more protocols, but the extensibility is limited.


    The Protocol Distribution group keeps per-protocol statistics for the amount of
    data and number of packets being sent on a LAN segment. From this information,
    you can calculate the bandwidth utilization per protocol and, hopefully, isolate
    a troublesome application.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The Address Mappings group is used to map a network address to the station
    address to which it is bound. The Network Layer Host group then shows the amount
    of traffic for each network address. The Network Layer Matrix group shows network
    traffic statistics between pairs of network addresses. You can also see the top
    traffic producers.


    The Application Layer Host shows network traffic statistics for a particular network
    address, broken down by protocol. Similarly, the Application Layer Matrix shows
    network traffic statistics for traffic between a pair of network addresses.


    As previously mentioned, both Ethernet and Token Ring use the RMON standard. Other
    standards are being considered for other link types. For example, to account for
    the switching technology in ATM, a new specification called AMON has been proposed
    by Hewlett-Packard. Other vendors have additional proposals for supporting ATM.


    # ## NetMetrix Site Manager


    As mentioned earlier, NetMetrix Site Manager can be used to monitor the status
    and utilization of your network devices. Some of the different errors reported
    were discussed earlier. Utilization reports can also be generated, such as the
    top users on a network segment, and the devices sending the most packets.


    NetMetrix also includes a MIB Browser so that you can query the MIB values of
    a selected network device.


    # ## MeasureWare


    The MeasureWare Agent is a Hewlett-Packard product that collects and logs resource
    and performance metrics. MeasureWare agents run and collect data on the individual
    server systems being monitored. Agents exist for many platforms and operating
    systems, including HP-UX, Solaris, and AIX.


    The MeasureWare agents collect data, summarize it, timestamp it, log it, and send
    alarms when appropriate. The agents collect and report on a wide variety of system
    resources, performance metrics, and user-defined data. The information can then
    be exported to spreadsheets or to performance analysis programs, such as PerfView.
    The data can be used by these programs to generate alarms to warn of potential
    performance problems. By using historical data, trends can be discovered. This
    can help to solve resource issues before they affect system performance.


    MeasureWare agents collect data at three different levels: global system metrics,
    application metrics, and process metrics. Global and application data is summarized
    at five-minute intervals, whereas process data is summarized at one-minute intervals.
    Important applications can be defined by an administrator by listing the processes
