- pgno: 52
  md: '![](img/eae88b61ada165139a1d9b546a34140b_52_0.png)


    # Monitored Components


    Monitoring in PATROL is provided by KMs, which contain the expertise used by PATROL
    to know what to monitor and how to react when problems occur. KMs are used to
    monitor a set of parameters, which can include a description of the monitored
    attribute, the polling interval, the method for measuring the attribute, and a
    threshold for abnormal values. The KMs provide rules to detect events and perform
    corrective actions. Events are sent to an operator console when an error or warning
    condition occurs.


    PATROL provides a wide variety of operating system, middleware, database, and
    application KMs. Different combinations of KMs can be purchased, so you can customize
    the solution for your own environment.


    Operating system KMs are provided for UNIX, NT, and other OSs. UNIX platforms
    include Sun Solaris, HP-UX, and IBM AIX. Middleware KMs include Tuxedo and DCE.


    Database KMs include Oracle, Sybase, Informix, DB2, Red Brick, Ingres, and others.
    BMC PATROL''s database KMs provide more metrics than are available from the other
    products described in this chapter. For example, BMC PATROL provides more than
    70 metrics for Oracle. About 50 metrics are monitored for Informix. Metrics include
    user connection information, active locks, I/O statistics, dictionary hit ratios,
    and CPU utilization. Server performance is also monitored. BMC formerly had a
    technical agreement with HP to provide the database KMs for MeasureWare. PATROL
    provides a strong solution for database management because it encompasses both
    monitoring and database administration tools.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'BMC has bundled its database products into a PATROL Availability Suite for
    Oracle. The product bundle includes the PATROL KM for Oracle, PATROL DB-Stats
    for Oracle, PATROL DB-Reorg for Oracle, and the PATROL DB-Integrity products.


    Application KMs include SAP R/3, Baan, and PeopleSoft. System and database KMs
    should also be used with these application KMs.


    Details on specific KMs for system, applications, middleware, and databases are
    covered in separate chapters.


    # Monitoring Features


    PATROL’s operator console provides a centralized graphical display in which icons
    represent system components or other monitored components. Icons change color
    to correspond to a component’s status. On the console, icons represent system
    components or other monitored components, and change color to correspond to the
    status. Detailed information can be displayed as gauges, or in graphs or text
    windows.


    BMC PATROL has its own configuration interface and its own message browser for
    receiving events. Alarms can be configured such that events are sent to the console,
    indicated graphically, and shown in the Event Browser. Events can also be sent
    to the Message Browser in IT/O. Additionally, events can also be sent to other
    management platforms, such as Uncenter TNG or Tivoli TME, via SNMP.


    PATROL can graph multiple metrics simultaneously for a single system to help with
    performance monitoring. If data is logged, historical graphs can also be shown.


    Intelligent agents provide the ability to discover system, database, and application
    components in the enterprise. The agents reside on each server. On an ongoing
    basis, the agents look for problems. When they encounter problems, they either
    take preconfigured actions or send notification so that recovery can be done manually.


    KMs on the monitored system provide the rules for detecting events and performing
    recovery actions. Events are sent to an operator console when an error or warning
    condition occurs. Administrators can customize the recovery actions. The PATROL
    agent polls for information and can adjust its sampling rate based on its performance
    impact. Each system has one PATROL agent, but may have many KMs.


    PATROL has been certified to run in an MC/ServiceGuard environment, but inconsistency
    issues exist. For example, PATROL may report an SAP process failure to its operator
    console, while MC/ServiceGuard may have already restarted the process or moved
    it to another system.


    Unlike MC/ServiceGuard, PATROL does not provide any failover capability. However,
    a limited set of automated recovery actions is available.


    PATROL can show an application view in the PATROL console. IT/O provides only
    a node view, although ClusterView adds an application view to IT/O when used in
    an MC/ServiceGuard environment.


    Hewlett-Packard used to rely on BMC PATROL to provide database information to
    its MeasureWare Agent. The database KMs were resold through a special licensing
    agreement. HP now uses its SMART Plug-Ins for databases to gather database information
    for MeasureWare.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Monitor Discovery and Configuration


    You need to install the PATROL agent and KMs on each system to be monitored. Once
    this software is installed, you need to load (or activate) the KMs you intend
    to use on each system. This can be done from PATROL’s operator console.


    PATROL agents discover all databases, applications, and key resources when they
    are started. This makes it easy to start monitoring quickly. The administrator
    can also define additional applications and databases so that they can be discovered
    in the future.


    Figure 3-5 shows an example of the resources being monitored by PATROL on a system
    called “bakers.” This system has the KMs for UNIX and for Oracle loaded. You can
    drill down on each of these resource’s classes to see the metrics being monitored,
    graph data, and check status.


    In addition to monitoring, PATROL can automate recovery actions taken in response
    to error or failure conditions. The user must assign the desired recovery actions
    to an event. The concept of operator-initiated actions, available with IT/O, is
    not supported with PATROL.


    PATROL can be configured to respond automatically to specific problems, and can
    help tune databases for optimal performance. Recovery actions can be performed
    locally by agents without requiring communication with the console.


    Users can set thresholds. Events are sent by the PATROL Event Manager to the PATROL
    console. All metrics are sampled simultaneously, which can cause unnecessary system
    overhead for resources that are less critical or that rarely change.


    # Monitor Developer’s Kit


    BMC PATROL has an API that enables events to be sent by a non-PATROL program to
    the PATROL Event Manager. This is similar to IT/O, which has an API for sending
    RPC messages to its Event Browser. A non-PATROL program can also receive events
    from PATROL.


    The PATROL Scripting Language (PSL), part of the PATROL Developer Console, can
    be used to create scripts to perform recovery actions by the PATROL agent on managed
    nodes. PSL can also be used to write parameters, commands, tasks, and discovery
    procedures for PATROL agents.


    # Notification Methods


    PATROL Alarm Manager can be used to send notifications by pager, by e-mail, or
    to third-party messaging systems. Users define the resources to monitor and the
    notification criteria. After configuration, the alarm policies can be distributed
    to a predefined set of systems. The PATROL Alarm Manager keeps track of additional
    information, such as the number of events sent by a host, and time periods during
    which notifications should be sent. PATROL can also send copies of an event to
    multiple consoles.


    The PATROL Event Translator (PET) can translate messages for various protocols.
    BMC provides a PET for IT/O, using the OpenView APIs, but it forwards only the
    event. The operator must switch to the BMC PATROL console to initiate corrective
    actions.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Diagnostic Capabilities


    PATROL can graph multiple metrics simultaneously for a single system to help with
    performance monitoring. If data is logged, historical graphs can also be shown.


    In addition to monitoring, PATROL can automate recovery actions taken in response
    to error or failure conditions. The user must assign the desired recovery actions
    to an event. The concept of operator-initiated actions, available with IT/O, is
    not supported with PATROL.


    PATROL can be configured to respond automatically to specific problems, and can
    help tune databases for optimal performance. Recovery actions can be performed
    by agents without requiring communication with the console.


    In addition to providing help diagnosing and recovering from problems, BMC provides
    PATROL DB, which includes database administrative tools such as Pathfinder, DB-Alter,
    DB-Reorg, DB-Change Manager, DB-Integrity, DB-Voyager, and SQL-Explorer. These
    tools are integrated into the PATROL framework and can be launched from the PATROL
    console. In contrast, IT/O provides monitoring only, relying on other software
    vendors to provide administrative tools.


    To change UNIX kernel parameters in response to a problem, BMC uses the tool Opportune.


    # Additional Information


    More information about BMC Software can be found on the Web at http://www.bmc.com.
    BMC PATROL software can be downloaded from its Web site.


    BMC Software announced plans to buy BGS Systems, Inc. in early 1998. BMC intends
    to integrate BGS''s Best/1 product for performance analysis and trending into
    the PATROL software suite. This includes integration of its separate agent, collection,
    and data store technologies. BGS provides performance management solutions for
    UNIX, NT, and mainframe systems. Information about BGS Systems, Inc. can be found
    at http://www.bmc.com.


    # MeasureWare


    MeasureWare Agent is a Hewlett-Packard product that collects and logs resource
    and performance metrics. MeasureWare agents run and collect data on the individual
    server systems being monitored. Agents exist for many platforms and operating
    systems, including HP-UX, Solaris, and AIX.


    MeasureWare is a monitoring framework, because MeasureWare agents collect and
    log performance data on several different platforms in a consistent manner. It
    also has two interfaces, Application Resource Measurement (ARM) and Data Source
    Integration (DSI), for adding additional instrumentation. A common analysis tool,
    such as PerfView, can be used to analyze and graph data.


    The MeasureWare agents collect data, summarize it, timestamp it, log it, and send
    alarms when appropriate. The agents collect and report on a wide variety of system
    resources, performance metrics, and user-defined data. The information can then
    be exported to ASCII files, spreadsheets, or performance analysis programs such
    as PerfView. The data can be used by these'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'programs to generate alarms to warn of potential performance problems. By using
    the historical data, trends can be discovered, which can help to solve resource
    issues before they affect system performance.


    # Monitored Components


    MeasureWare agents collect data at three different levels: global system metrics,
    application met-rics, and process metrics. Global and application data is summarized
    at five-minute intervals, whereas process data is summarized at one-minute intervals.
    Important applications can be defined by an administrator by listing the processes
    that make up the application in a configuration file.


    In addition, optional modules for database and networking support are offered.
    MeasureWare also provides a DSI interface that enables you to pass your own data
    to the MeasureWare Agent.


    MeasureWare has database modules for collecting database metrics for Oracle, Sybase,
    and Informix databases. These modules can take advantage of all the standard monitoring
    fea-tures of MeasureWare, such as timestamping data, logging, and forwarding alarms
    to HP Perf-View. However, this product is similar to another HP product for database
    performance informa-tion, the OpenView SMART Plug-Ins for databases. SPIs also
    feed information into Measure-Ware, providing a consistent interface with other
    IT/O products.


    A more detailed list of metrics in each category can be found in the next few
    chapters on systems, disks, networks, applications, and databases. Although MeasureWare
    provides exten-sive performance and resource information, it offers limited configuration
    information and no data about system faults.


    # Monitoring Features


    HP MeasureWare Agent software is installed on each managed system. The agents
    keep a history of a system''s resource utilization, and the information can then
    be exported to spreadsheets or to performance analysis programs, such as HP PerfView.
    The data can be used by these programs to generate alarms to warn of potential
    performance problems. By using historical data, trends can be discovered, which
    can help to solve resource issues before they affect system performance.


    MeasureWare allows you to define alarm conditions. You can have alarms sent based
    on conditions that involve a combination of metrics. For example, a CPU bottleneck
    alarm can be based on the CPU use and CPU run queue length.


    MeasureWare agents provide alarms to PerfView for analysis, and to the IT/O management
    console. SNMP traps can also be sent by the MeasureWare Agent at the time threshold
    conditions are met. Automated actions can be taken, or the operator can choose
    to take a suggested action.


    You can configure alarms based on a combination of multiple metrics and on duration.
    In this way, rules can be used to ensure that messages are sent to an operator
    only when a real prob-lem occurs.


    MeasureWare''s extract command can be used to export data to other tools, such
    as spread-sheet programs.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'MeasureWare Service Reporter is a Web-based metrics tool for generating reports
    on network performance. Network performance can be compared to service-level agreements.
    Reports can show the actual response times for specific applications.


    MeasureWare can show application information, but an application first has to
    be defined. Application definitions can be used to summarize process-level data
    for all processes defined for an application.


    With PerfView, a system administrator can analyze, alarm, forecast, and report
    on the MeasureWare metrics. HP OpenView IT/O can then receive event messages from
    the MeasureWare Agent regarding alarm conditions. In fact, the MeasureWare Agent
    will detect an HP OpenView IT/O agent running on the system and automatically
    start sending alarms to it. Then, by clicking a database message sent to IT/O,
    for example, you can bring up PerfView to graph the related database and system
    information.


    MeasureWare requires approximately 1MB of memory for data collection, and 40MB
    of disk space is recommended for each month of data that needs to be stored. To
    ensure that the MeasureWare Agent is automatically restarted after a system reboot,
    make sure the file `/etc/rc.config.d/mwa` is configured with the parameter `MWA_START`
    equal to 1.


    MeasureWare is a complement to EMS and IT/O, providing performance data while
    EMS and IT/O focus on availability information. MeasureWare should be used when
    you need to see a history of resource values over time.


    MeasureWare agents gather information at one- and five-minute intervals. Other
    tools, such as EMS, can acquire information as frequently as every second. EMS
    monitors can also forward important information without waiting to be polled.


    The MeasureWare agents are available on HP-UX, IBM AIX, Sun Solaris, and NCR WorldMark
    systems.


    # Monitor Discovery and Configuration


    When MeasureWare is activated, the data is automatically collected and analyzed
    at regular intervals. An administrator configures the alarm thresholds for notification.


    An ASCII file contains alarm definitions. To add or modify an alarm, you need
    to edit this file; no GUI is available. Validation is done to ensure that the
    syntax is correct. On HP-UX systems, this file is located at `/var/opt/perf/alarmdef`.
    To create an alarm, you need to know the available metrics to choose from. The
    online help facility can show you the data that is available, with descriptions
    of each metric.


    Applications can also be defined by an administrator by editing the parm file,
    located at `/var/opt/perf/parm`, by default. You can then monitor specific metrics
    for your application.


    To ensure that alarms are appropriate, you can use the `analyze` command from
    within MeasureWare''s utility program to test alarm conditions. analyze looks
    at historical data and reports when alarms would have been sent. In this way,
    you can determine whether you have the appropriate alarm conditions.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'If you edit the parm or alarmdef file, you need to use the mwa command to instruct
    the MeasureWare Agent to reread the file.


    You can run the perfstats utility to check the status of a MeasureWare agent.


    # Monitor Developer''s Kit


    A few different ways exist to include your own performance instrumentation along
    with other MeasureWare data. Through the DSI API, custom applications can send
    information to MeasureWare to store. MeasureWare also can timestamp and provide
    summaries of this data.


    Additionally, the ARM APIs can be used with instrument applications so that transaction
    response times can be measured. This information can be passed along to MeasureWare
    agents for analysis. The ARM APIs are described in more detail in Chapter 7.


    # Notification Methods


    MeasureWare agents collect information about system performance. Threshold events
    can be sent to PerfView, as alerts, or to IT/O, as opmsgs. You can also configure
    alarms to execute a UNIX command, such as mail, to send a notification.


    Alarm notification can be sent to PerfView, IT/O, or any SNMP-based management
    platform (such as Ucenter TNG) by using SNMP traps. Alarms can be sent to multiple
    destinations. MeasureWare can also be configured to execute an arbitrary UNIX
    command when the alarming threshold is reached. Custom applications that need
    to receive alarm information can be integrated in this way.


    If the MeasureWare Agent detects that a system is being managed by IT/O, it automatically
    sends alarms to IT/O.


    # Diagnostic Capabilities


    MeasureWare is integrated with IT/O and PerfView. A MeasureWare alarm can be received
    by IT/O. Drilling down on an event can launch PerfView for further analysis.


    # Additional Information


    The list of MeasureWare metrics varies from release to release. To verify that
    the metric you want is available, you can check the files under /opt/perf/paperdocs/mwa/C
    on a system where MeasureWare is installed.


    The MeasureWare Agent is available as a separate product and is also included
    as part of the GlancePlus Pak software bundle.


    For further information, visit the HP Resource and Performance Management Web
    site at http://www.openview.hp.com/solutions/application/.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # Chapter 4

    ## Monitoring the System


    A computer system consists of processors, memory, and I/O devices. Users log in
    to the system and run business jobs or applications. Network software and interface
    cards connect users over the network to the computer system. This chapter focuses
    on monitoring the processors and memory components, as well as the user activity
    on the system. Disks, networks, databases, and applications are covered in separate
    chapters.


    # ### Identifying Important System Monitoring Categories


    This chapter identifies important system resources to monitor, so that you can
    detect faults, avoid problems, and ultimately ensure availability. Many important
    system resources can be monitored for events and faults, and many system management
    tools are available with which to monitor them. Instead of categorizing based
    on specific hardware components, this chapter relates its descriptions of tools
    to the different ways of monitoring your system. For example, your focus as an
    operator may be on watching for system faults and failures, software or hardware
    configuration changes, system resource usage, performance management, or security.
    This chapter tries to show a tool''s role, if any, in each of these monitoring
    categories.


    # ### Monitoring System Configuration Changes


    This category includes monitoring for changes in hardware and software configurations
    that can be caused by an operating system upgrade, patches applied to the system,
    changes to kernel parameters, or the installation of a new software application,
    for example. The root cause of system problems can often be traced back to an
    inappropriate hardware or software configuration change. Therefore, it is important
    to keep accurate records of these changes, because the problem that a change causes
    may remain latent for a long period before it surfaces.


    Adding or removing hardware devices typically requires the system to be restarted,
    so configuration changes can be tracked indirectly (in other words, remote monitoring
    tools would notice system status changes). However, software configuration changes,
    or the installation of a'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'new application, are not tracked in this way, so reporting tools are needed.
    Also, more systems are becoming capable of adding hardware components online,
    so hardware configuration tracking is becoming increasingly more important.


    # ## Monitoring System Faults


    After ensuring that the configuration is correct, the first thing to monitor is
    the overall condition of the system. Is the system up? Can you talk to it, ping
    it, run a command? If not, a fault may have occurred. Detecting system problems
    ranges from determining whether the system is up to determining whether it is
    behaving properly. If the system either isn’t up or is up but not behaving properly,
    then you must determine which system component is having a problem.


    This chapter addresses monitoring various components of the system for faults
    or events. The fault category generally covers system hardware components, including
    the Central Processing Unit (CPU), memory, and system buses, as well as peripherals,
    such as tape drives and printers. (Disks are covered in Chapter 5.) CPU and memory
    faults may cause system failures or degraded performance. Tape faults may result
    in a backup failing, a bad backup, or delays in completing a backup in a timely
    manner. With proactive monitoring, you can find out that a tape drive is having
    problems before backup is actually scheduled to begin.


    # ## Monitoring System Resource Utilization


    For an application to run correctly, it may need a fixed amount of system resources.
    Some resources are renewable, such as the amount of CPU or I/O bandwidth an application
    is entitled to use during a time interval. The resource category refers to those
    system resources that an application acquires and then releases at its own discretion.
    For example, an application can allocate a segment of shared memory or launch
    a group of processes. Other examples included in the resource category are the
    number of open files or sockets, message segments, and system semaphores that
    an application has. The system has fixed limits for each of these resources, so
    monitoring their use is important. If these system tables are exhausted, the system
    may no longer function properly. You may want to set up alarms to notify you when
    the available resources in a given system table are below a certain threshold,
    which will give you time to react before the problem becomes critical.


    Another aspect of resource utilization is studying the amount of resources that
    an application has used. You may not want a given workload to use more than a
    certain amount of CPU time or fixed amount of disk space. Some resource management
    tools, such as quota, can help with this.


    # ## Monitoring System Security


    One way that a system’s availability can be impacted is through unauthorized use.
    Performance and resource controls are not useful if the system is used for the
    wrong purposes. You need to prevent unauthorized use of system resources by using
    password files, network firewalls, and so forth. In addition to setting up access
    rights and policies, you need to monitor the system, so that'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'you know when security has been compromised. This chapter briefly mentions
    some of the security tools that are available.


    # Monitoring System Performance


    Knowing both that system resources are available and that your application is
    performing well is important. Eliminating bottlenecks or, even better, preventing
    them, allows the system to provide its intended services. Monitoring the performance
    of system resources can help to indicate problems with the operation of the system.
    Bottlenecks in one area usually impact system performance in another area. CPU,
    memory, and disk I/O bandwidth are the important resources to watch for performance
    bottlenecks. You should monitor during typical usage periods to establish baselines.
    Understanding what is “normal” operation helps you to identify when system resources
    are not behaving well. Resource management tools are available that can help you
    to allocate system resources among applications and users.


    In this and each of the next four chapters, performance issues are contained in
    a separate section and described after the other tools are discussed.


    One way to check for system problems is to watch the system''s front panel of
    lights. Any change from normal (for example, color changes from green to red or
    a light starts flashing) could be indicative of a hardware or firmware problem.
    Of course, to monitor the system in this way, you need an operator to watch the
    front panel of the system manually. If an operator isn''t always available to
    watch the front panel, a delay in detecting a problem may occur. Many other, more
    sophisticated tools are available to help you detect system problems that may
    occur in your system. These tools, which are covered in the following sections,
    range from standard UNIX commands to sophisticated add-on monitoring software
    suites.


    # Using Standard Commands and Tools


    Many UNIX commands exist to check configuration, status, and resource information.
    These tools generally report on only a snapshot in time. You can write or use
    custom scripts that incorporate these or other commands and run them periodically
    so that you can track configuration changes or test the status of system resources
    over time.


    The more commonly used commands are described in this section. Note that they
    are organized alphabetically. You may also want to check the online *man* pages
    for additional information about each command. Unless otherwise noted, the commands
    listed in this section are available on multiple UNIX platforms. (Tools that are
    specific to networking, such as *netstat* and *rsstat*, are discussed in Chapter
    6.)


    In addition to these commands, you may want to check the system log file, */var/adm/syslog/syslog.log*,
    for error messages if your system is experiencing problems. Messages written to
    this log file include information regarding the module experiencing the problem
    and the time that the event occurred, which can be very valuable when troubleshooting.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# bdf and df


    The bdf and df commands are commonly used to show the amount of disk and swap
    space used and available. bdf – i reports the number of used and free filesystem
    structures (inodes) in the kernel.


    By default, bdf shows information for all mounted filesystems. If this information
    is too lengthy, you can also run the command and specify a filesystem as a command-line
    option. An example is shown in Listing 4-1.


    # ioscan


    The ioscan command is used to discover and display the system hardware, usable
    I/O system devices, or kernel I/O system data structures. The results displayed
    list the default hardware path to the device, the class of hardware, and a brief
    description. ioscan includes information on the following hardware: processors,
    memory, network interface cards, and I/O devices. Listing 4-2 shows how you can
    check the number of processors on your system by using ioscan.


    ioscan is a good tool to use to get a complete picture of your system hardware
    layout. It reports the status of the installed software, indicating whether the
    proper drivers are loaded. By storing the command output in files, you can maintain
    a history of the hardware configuration changes to your system.


    # iostat


    iostat reports CPU statistics and I/O statistics for disks and terminals. For
    disks, it lists the device name, number of bytes transferred per second (bps),
    number of seeks per second (sps), and milliseconds per average seek (mps). For
    terminals, it shows the number of characters read and the number of characters
    written. For the CPU, it shows the percentages of time that the system has spent
    in user mode, nice mode (low-priority user processes), and system mode. Listing
    4-3 shows sample output for a system with only one physical disk.


    ```

    Listing 4-1 bdf output for a specific filesystem.


    # bdf /dev/vg00/lvol3

    Filesystem   kbytes   used   avail   %used Mounted on

    /dev/vg00/lvol3  126976 33003 93912   26%   /

    #

    ```


    ```

    Listing 4-2 Output from ioscan for a two-processor HP-UX system.


    # ioscan |grep processor

    32   processor   Processor

    34   processor   Processor

    #

    ```'
  merge: -1
  img_proc: true
