    # Setting Up Monitoring and Reconfiguration


    From the Enterprise SyMON console, Bill loads the Config-Reader and Dynamic Reconfiguration
    modules to ensure that he will be notified of hardware faults, so that he can
    handle the faults without having to take the system down. The Config-Reader module
    is located under Hardware and the Dynamic Reconfiguration module is located under
    local applications (shown in Figure 4-7, earlier in this chapter).


    # Memory Board Failure Occurs


    When a critical memory fault occurs, the icon for the system on the SyMON console
    indicates the alarm. Bill looks at the Alarm window to see more details about
    the event. He notices that a memory board has failed. Using the Logical View,
    like the one shown in Figure 4-14, he locates the failed memory board. Using the
    Physical View, like the one shown earlier in Figure 4-5, he locates the exact
    location of the physical board in the system.


    # Fixing the Failure and Restoring Service


    Bill accesses the Dynamic Reconfiguration screen from the SyMON console. First,
    he selects the failed memory slot and clicks the Disconnect button to unconfigure
    and disconnect the board. Next, he replaces the failed board and then connects
    the board by clicking the Connect button; he leaves it temporarily unconfigured,
    however, while he performs a memory test using'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# **Figure 4-14** Using the SyMON Logical View to locate a failed memory board.


    ![](img/eae88b61ada165139a1d9b546a34140b_116_0.png)


    the Test Memory button, to ensure that the new board is functional. Finally, Bill
    clicks the Configure button to make these memory resources available to the system.


    Bill was able to handle a failed memory board in this environment with very little
    impact to the system. Sun’s dynamic reconfiguration capabilities, available from
