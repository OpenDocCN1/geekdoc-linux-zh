- pgno: 260
  md: '# # Using Database Performance Data


    Possible causes of database performance problems include a poor design of the
    data model or a poorly written database application program. Programs should first
    be tested heavily in a development environment before going into production. However,
    resolving design and programming problems are beyond the scope of this book. You
    may want to consult documentation from the database vendors, such as Oracle’s
    *Oracle Server Concepts*, to get more information on these topics.


    Additional causes of performance problems can be an inappropriate system configuration
    or an ineffective use of database resources. To identify these types of situations,
    you need to collect performance statistics, using the metrics and tools discussed
    earlier in this chapter. With the database in production, performance monitoring
    tools should be used to monitor loads and collect performance data. By collecting
    performance statistics, you can establish a baseline to compare against when a
    major performance problem exists. Because application workloads change and usage
    varies, it is important to collect data over a period of time rather than rely
    on a single snapshot of data.


    # ## Avoiding Performance Issues


    Proactive monitoring against established baselines can enable you to identify
    resource usage trends that could lead to performance problems. In doing this,
    you can correct a situation before the end-user experiences poor response times.


    Other types of performance problems involve the inability to prioritize different
    workloads and allocate to each a designated amount of system resources. Two products
    can help to prioritize database workloads: the Process Resource Manager and Oracle
    Database Resource Manager.


    The Process Resource Manager (PRM) can be used to control system resource allocations
    for users and applications. Both minimum and maximum entitlements can be specified.
    CPU, real memory, and disk I/O bandwidth can be controlled by PRM. PRM, however,
    is available only on HP-UX.


    You can use PRM on HP-UX to isolate database applications from other applications.
    The database management system can be given resource entitlements for CPU, memory,
    and I/O to help reduce interference from other applications. If the system is
    busy, PRM ensures that the database applications get their configured share of
    system resources. If an application doesn’t need all the resources it is entitled
    to, PRM can be configured to distribute its resources to other applications. PRM
    can also be configured to limit an application’s maximum resource usage for capacity
    planning purposes.


    In addition to isolating the database management system from other applications
    on the system, PRM has special Oracle support to allow resources to be allocated
    to specific databases. Oracle imbeds the database name in the processes that it
    creates to handle database accesses. By configuring processes for each database
    instance to be in separate PRM groups you can manage each database separately.
    This is especially useful if some database applications have a higher priority
    than others. For example, if long-running database jobs are of a lower priority,
    but need'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'access to the same disks accessed by interactive users, then PRM I/O bandwidth
    controls can be used to ensure that the jobs make continual progress without seriously
    impacting other users. A less sophisticated approach may be to have policies in
    place to ensure that long-running jobs are not executed during periods of heavy
    database or system usage. Another approach is simply to run those jobs at a lower
    priority than the other applications on the system.


    Oracle also provides resource management capabilities with its Oracle8i release.
    The Oracle Database Resource Manager can be used to prioritize database workloads
    between different users. For example, users running OLTP applications could be
    given more of the CPU than decision-sup-port users. Only the CPU usage associated
    with Oracle is being manipulated; the CPU entitlements for other applications
    running on the server should not be impacted. However, the Database Resource Manager
    behaves optimally if Oracle is the only application running on the server.


    # ## Checking for System Contention


    If users are complaining of a performance problem, you may want to check the user
    call rate or database transaction rate first to get an idea of how much useful
    work, if any, is being done. This information is available in the RDBMS MIB for
    standard databases. In addition, Oracle provides metrics for the number of user
    calls and the number of user commits in its Private Database MIB. By monitoring
    this data over a period of time, you can calculate rates for these measures. Transaction
    rates can be compared to a known baseline to give you some idea of whether a per-formance
    problem exists. Transaction rates can be unreliable metrics, however, because
    low numbers could also indicate less end-user activity. Ideally, you would check
    the database response time, but no good way exists to track this metric directly.


    If a performance problem is reported, you need to determine whether the cause
    is a system bottleneck, a disk bottleneck, or misconfigured database parameters.
    Potential causes of system resource bottlenecks are an untuned operating system,
    a system that is too small to accommo-date the database workloads, or other applications
    running on the system. You may need to increase the capacity of the system by
    adding more memory or processors. As previously men-tioned, PRM can help you prioritize
    resources among applications.


    To check for real memory bottlenecks, you can first check the amount of free memory.
    It should not drop below 5 percent of the total available. If the system can''t
    keep up with the demands for memory, it will start paging and swapping. Excessive
    paging and swapping may be a sign of a memory bottleneck. GlancePlus, MeasureWare,
    and BMC PATROL are some of the tools available to show you paging rates.


    CPU resource contention can be identified by high utilization and a long run queue.
    This should be sustained over a period of time to indicate a serious CPU bottleneck.
    In a database environment, check for memory contention first, because much of
    the CPU''s time is spent pag-ing and swapping data between disk and main memory.
    High CPU usage can be an indication of an application problem, such as a missing
    database index. You should also look for runaway processes dominating the CPU
    usage.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Networking bottlenecks may be identified by high utilization and many collisions
    on shared media. They can be addressed by redesigning an application to reduce
    its network traffic. Other options are to use higher-capacity network links, or
    to move client and server systems closer together.


    # Checking for Disk Bottlenecks


    Disk-related metrics can be used to identify unbalanced I/O activity. If this
    is the problem, you may need to restructure the database and relocate data files
    on different disks to avoid disk and controller bottlenecks. You should not have
    the database files on the disk used for swapping. Database tables and their indexes
    should be on different disks, because they are accessed concurrently. If the database
    is updated frequently, the redo logs should also be put on a different disk, because
    the logs are as frequently updated as well. You should also try to place tables
    that are commonly used together onto separate disks. Ensure that OS disk striping
    and Oracle striping are being used appropriately. You should also see whether
    a system memory bottleneck exists, to determine whether adding more real memory
    to the system may fix the problem.


    Database tables, indexes, and rollback segments are each created with an initial
    disk allocation. If these allocations are exceeded, then more space must be allocated
    dynamically, potentially all over the disk. This disk fragmentation slows down
    I/O operations and can lead to disk bottlenecks. An administrator may need to
    restructure the database periodically to repair problems, such as a significant
    amount of database fragmentation. PLATINUM’s TSReorg tool can show database fragmentation
    graphically, so that you can quickly assess the size of the problem. TSReorg can
    be used together with DBVision so that actions such as a database reorganization
    can be taken in response to a database problem event.


    # Checking Database Buffer and Pool Sizes


    For Oracle databases, some parameters in the init.ora configuration file can be
    adjusted to reduce system resource contention and improve memory performance.
    Another option is for the database administrator to limit or control user logins.
    The number of concurrent users can be controlled to help ensure adequate response
    times. Policies can be enforced to disconnect inactive sessions.


    Sorting can be a very time-consuming part of a database query. Oracle provides
    several configurable parameters in the init.ora file, such as SORT_AREA_SIZE,
    SORT_WRITE_BUFFERS, and SORT_WRITE_BUFFER_SIZE. These parameters determine how
    much of a sort is done in main memory. Having a large sort area can make database
    queries faster; but, because the resource parameters are applied to each user
    session, this impacts contention for system memory. Having a small sort area may
    require writes to disk during the sort.


    If periods during which jobs are run with few users logged in to the system are
    available, perhaps during evenings, you may want to switch between two sets of
    configuration parameters. After business hours, you can take advantage of more
    free memory to increase the sort area size, and then switch to a smaller size
    during peak usage to account for the larger number of users. Oracle'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'keeps track of the number of sorts that go to disk in its Private Database
    MIB. Comparing this to the total number of sorts yields a sort overflow ratio,
    which should be zero for OLTP applications.


    As mentioned earlier, a number of resources are allocated on a per-user basis.
    If a performance problem exists, you may want to check who is currently logged
    in, to determine if unauthorized users are logged in or if some users have logged
    in multiple times. You can use who or check the number of inbound associations
    using the RDBMS MIB to get an idea of system activity. Earlier in the chapter,
    Listing 8-2 showed how an SQL SELECT statement could be used to display the current
    database user processes. Monitoring the number of concurrent sessions over time
    can be useful in identifying any spikes in usage. Oracle7 and Oracle8 have the
    ability to establish resource limits for a user''s CPU time and amount of disk
    I/O. These parameters are defined in the user''s database profile.


    Oracle has a single buffer cache and shared pool area that is shared among all
    database users. The DB_BLOCK_BUFFERS and SHARED_POOL_SIZE parameters in the init.ora
    file control the size of these resources. Data from database tables, indexes,
    clusters, and rollback segments may be stored in the buffer cache. The buffer
    cache hit ratio can be calculated for Oracle by using the number of consistent
    gets, number of block gets, and number of physical reads metrics stored in Oracle''s
    Private Database MIB. Other tools, such as BMC PATROL''s KM for Oracle, also keep
    track of the buffer cache hit ratio. By checking the buffer cache hit ratio, you
    can see whether the size of the buffer cache is appropriate. The hit ratio should
    be 70 to 85 percent. If the hit rate is low and free memory exists, consider increasing
    the size of the buffer cache, because this is likely to improve performance. You
    can increase the cache size until the hit ratio stops increasing, as long as free
    memory is available and no CPU bottleneck exists. In cases where a CPU bottleneck
    exists and no memory is available, reducing the size of the buffer cache may be
    appropriate, to transfer some of the work from the CPU to disk. Balancing system
    resources this way can lead to better overall response times for database users.


    The shared pool area is used for dictionary information and shared SQL and PL/SQL
    code. A lot of SQL statement reloading may indicate that the shared pool area
    is too small. For Oracle, the metrics needed to calculate the library cache miss
    ratio are in the library cache table of the Oracle Private Database MIB.


    Database checkpointing affects disk performance because it increases the I/O activity
    to the disk. The LOG_CHECKPOINT_INTERVAL parameter in Oracle''s init.ora file
    determines how often changed data in the buffer cache is written to the database.
    Make sure the LOG_CHECKPOINT_INTERVAL is equal to or larger than the size of the
    redo logs.


    Oracle''s LOG_BUFFER parameter is used to determine the amount of modified data
    that should be buffered before writes are made to the redo log files. Increasing
    the amount buffered reduces the number of disk writes needed, by writing data
    in larger blocks. This may be useful if many changes are being made to the database.
    If system memory is a bottleneck and not many database updates are taking place,
    it could indicate that the log buffer is too large. You can observe the log buffer''s
    effectiveness by monitoring the I/O rate of the disk containing the redo log and
    the number of times a user has waited for space in the redo log buffer, which
    ideally'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'should be zero. In BMC PATROL, the RedoSpaceRequests metric will tell you this.
    From Oracle''s Private Database MIB, you can use the redo log space requests and
    redo log entries to calculate a redo log space wait ratio, which should stay below
    1/5000.


    Contention may occur if multiple users try to access the redo log buffer latches.
    BMC PATROL monitors this metric as RedoAllocationLatch. If contention is occurring,
    decrease the LOG_SMALL_ENTRY_MAX_SIZE parameter, which indicates the largest log
    entry that can be written on a redo allocation latch without obtaining the redo
    buffer copy latch. This forces the larger copy latch to be used. You should also
    increase LOG_SIMULTANEOUS_COPIES to twice the number of CPUs on the system.


    Database chaining occurs if a row is updated and becomes too large to fit in a
    single physical database block. Multiple block reads are necessary to read data
    from a chained row, causing performance to degrade. To determine whether this
    is a problem, you need to check periodically the percentage of chained row fetches
    being made. If this number is large, you may need to increase the database block
    size, which requires re-creating the database.


    # # Avoiding Database Problems


    You can take several proactive steps to avoid database problems. System and database
    server failures can be difficult to predict, but some of the root causes can be
    monitored. You can monitor how many rows a table gains over time, to monitor database
    growth. Gradual performance degradation or an available tablespace falling below
    critical thresholds could be an indication that a failure is imminent. Loss of
    data can be avoided through the use of data redundancy. Several techniques are
    available, such as disk mirroring. This is not sufficient, however, unless the
    failure of a disk mirror, for example, is quickly detected and repaired. The EMS
    HA Monitors product is one tool for detecting mirror failures.


    The database operator should also periodically check system and database log files
    (such as Oracle''s alert file) to look for failure information or unusual events.


    Tools for monitoring system performance can be found in Chapter 4. A tool such
    as PerfView can be used to discover any resource utilization and performance trends.
    This information can be used by a database administrator to project database growth
    and plan for increased capacity. Various monitoring tools, such as BMC PATROL
    or SMART Plug-Ins, can be used to gather resource threshold information. If a
    database is out of available space, you need to archive or delete unneeded data,
    or allocate more space.


    Some tools are available to help you properly tune your system. Oracle provides
    an add-on product, Oracle Expert, which is an expert system that uses configuration
    and tuning rules specific for Oracle databases. BMC PATROL has built-in self-tuning
    and load-balancing capabilities, such as compressing log files and resizing tables.


    Monitoring backups and security are two additional proactive steps that you can
    take. Database backups should be verified periodically to ensure that data can
    be restored when needed. By maintaining audit logs of system access, you can more
    easily detect security intrusions and respond before experiencing database outages.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# ## Recovering from Database Problems


    Tools such as BMC PATROL can detect failures of key database processes and restart
    them automatically. MC/ServiceGuard provides a similar capability, and is also
    able to restart an application on another system.


    Assuming successful backups exist, databases such as Oracle can recover from a
    disk failure without losing data. This requires a trained database administrator,
    because the process typically is not automated. The Oracle Recovery Manager product
    can be used to manage the backup, restore, and recovery processes.


    After a system failure, Oracle can automatically recover data to a consistent
    state by performing full recovery. This is done by ensuring that committed changes
    are applied to the database and that uncommitted changes are undone. This can
    be a time-consuming activity. If the system problem is persistent, the workload
    may need to be moved to another system. For HP-UX systems, MC/ServiceGuard provides
    the capability of automatically moving a workload. To avoid the downtime associated
    with a single node failure, Oracle Parallel Server can be used. HP’s MC/LockManager
    provides high availability for HP-UX Oracle Parallel Server environments.


    In addition to system failures, human error, such as deleting the wrong rows in
    a database table, can lead to downtime. Successful database backups are critical,
    to ensure that the system can be returned to a good, consistent state.


    To determine how to recover from Oracle database problems, refer to the following
    documents from Oracle: *Oracle7 Server Administrator''s Guide, Oracle7 Server
    Tuning, Oracle7 Server Reference*, and *Oracle7 Server SQL Reference*. Similar
    manuals exist for later versions of Oracle as well.


    # ## Comparison of Database Monitoring Products


    Your choice of a database monitoring product is likely to depend on your database
    responsibilities and the details of your computing environment. For example, EMS
    is available only for HP-UX environments and has special capabilities if used
    on servers in an MC/ServiceGuard cluster. The HA cluster products, such as MC/ServiceGuard
    and Solstice HA, are only available on a single OS platform. Other database monitoring
    tools, such as MIB Browsers, SP1s, and BMC PATROL, are available for a variety
    of UNIX platforms.


    For configuration management, Network General’s Database Module product can help
    detect when database connectivity problems are caused by misconfigurations. EMS
    provides a file status change monitor that can be used to ensure that nobody is
    altering a database configuration file unexpectedly.


    For fault management, you can protect your database with either Sun’s Solstice
    HA or Hewlett-Packard’s MC/ServiceGuard product, depending on the platform you
    are using. If MC/ServiceGuard is being used, you can use ClusterView to see graphically
    any database failures that occur. EMS HA Monitors can provide additional database
    and server status information. In addition to supporting a variety of notification
    methods, EMS is the only tool that can'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'send failure information to MC/ServiceGuard. EMS can also send alarms to HP
    Predictive Support for proactive care of the system, but currently, Predictive
    monitors only hardware events.


    The PATROL KMs from BMC and SPIs from HP provide the most complete solutions for
    database resource and performance management. Both provide several performance
    metrics and have solutions for multiple databases. SPIs can be used with MeasureWare
    and PerfView and are also tightly integrated with IT/O. Because of their tight
    integration with the IT/O agent, SPIs can provide more sophisticated event correlation
    and filtering than BMC PATROL. SPIs also have more resource granularity, enabling
    you to choose the database objects to monitor. For example, you don''t need to
    include read-only tablespaces when monitoring tablespace free space.


    For the budget-conscious, EMS HA Monitors can provide some resource monitoring
    of tablespaces. You can get a lot of useful performance data by browsing the database
    MIBs, if you have the time. The MIB browsing capability may be useful in small
    database environments. Operators must bring up the MIB Browser and poll for individual
    database values, instead of responding to problems on an exception basis. This
    quickly becomes labor-intensive for even medium-sized installations. However,
    it can be a useful mechanism for getting additional information after a database
    problem is reported. MIB data can help diagnose the causes of performance problems.
    For example, you can go to the Informix Private MIB to see the last SQL query
    executed by a session.


    Thus, a variety of ways to obtain database performance information are available.
    GlancePlus and MeasureWare add the ability to look at transaction-level performance
    data. The HA cluster products provide the ability to detect and recover from database
    problems without user intervention. For example, MC/ServiceGuard can restart a
    database server on another system in the event of a system failure. BMC PATROL
    and PLATINUM ProVision provide database administration tools in addition to detection
    capabilities. SMART Plug-Ins provide textual guidance on how to recover from problems,
    but rely on their integration with database vendor tools, such as OEM, for administrative
    tasks.


    For database security and backup management, the tools are pretty weak. Network
    General''s Database Module can detect attempts to breach security because it monitors
    all database network traffic. IT/O can detect failed superuser logins at the system
    level. Informix stores some information about past backups in its Private MIB.


    Combinations of these tools may be used. For example, BMC PATROL, SPis, and EMS
    can each send events to IT/O. Thus, a BMC PATROL database KM can detect a problem
    and send a message to IT/O''s Message Browser, on which an IT/O administrator
    can already have enabled an automatic action to be taken.


    EMS, BMC PATROL, and SPis each provide additional solutions for system, disk,
    and network monitoring. Your choice for database monitoring may depend on the
    products that are already being used in your environment.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# # Enterprise Management


    Much of this book is focused on tools for monitoring a single UNIX system. You
    may, however, be responsible for monitoring tens or hundreds of systems. Also,
    it is likely that you are managing a heterogeneous environment in which it is
    important to monitor heterogeneous systems consistently. For example, a company
    may have decided to migrate from UNIX to NT, but does not want to replace their
    UNIX applications, such as SAP. The company may choose to keep a portion of the
    application (e.g.. the database server) on UNIX, while moving the application
    servers to NT. Using consistent tools for monitoring different platforms can make
    your job easier. Standards such as SNMP are especially important for this type
    of environment.


    This chapter focuses on some of the issues that arise if you are managing multiple
    systems. This includes issues with monitoring systems across an enterprise. A
    section on using event correlation tools discusses how you can reduce the volume
    of messages that can be generated in an enterprise environment. We''ll look at
    some issues with monitoring multiple systems, including clusters. There may also
    be cross-platform monitoring issues for systems in a heterogeneous environment.
    And finally, since no single tool will solve all of your monitoring needs, we''ll
    look at some of the tools that can be used together for this purpose.


    # ## Monitoring Across an Enterprise


    There are problems with trying to manage a large number of systems. Typically,
    an IT department will be responsible for managing multiple systems, most likely
    on multiple platforms. Big companies have a large number of systems that need
    to be managed.


    Keeping track of multiple systems on multiple platforms can be a complex task.
    Some companies want to implement a lights-out environment, in which operators
    are not required at every computing location in the enterprise. Other companies
    require the availability of systems 24 hours a day, 7 days a week. Most companies
    also have a disaster recovery plan to protect their critical data and application
    resources. These are some of the issues you must deal with when managing an enterprise
    of computer systems and applications.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Several solutions are available to aid in enterprise management. For example,
    HP OpenView IT/Operations (IT/O) is one product designed to help with enterprise
    management. It provides an Event Browser and a topology map with different icons
    to represent all of the various systems in an environment. IT/O uses different
    icons on the map to represent different platforms. For example, there are distinctive
    icons used to identify NT systems and HP-UX systems.


    Using a standard like SNMP from IT/O, you can receive events and poll heterogeneous
    systems in the enterprise using a common interface. IT/O allows you to distribute
    monitoring and message templates to multiple systems. It is scalable, so you can
    easily add additional systems to be managed. To aid in event management, you can
    integrate one of several event correlation tools to coordinate and reduce the
    number of messages coming in from systems in the enterprise. IT/O also supports
    a sophisticated architecture in which events can be forwarded, with annotations,
    to another IT/O management station.


    For disaster recovery, many companies have sophisticated procedures in place and
    practice disaster recovery annually. One thing to consider is a backup plan for
    the enterprise management platform itself. Many of the enterprise management frameworks
    discussed in this book have been certified to run in an MC/ServiceGuard environment,
    meaning the whole enterprise management framework can start up on an alternate
    node in the event of a system failure.


    When managing multiple systems in an enterprise, using common tools and standards
    can greatly reduce the number of tools you need to learn. Using a centralized
    console reduces the number of places you need to look to check for problems. Enterprise
    monitoring frameworks are important for reducing the complexity of monitoring
    systems in the enterprise.


    # ## Identifying Events


    If you have configured your enterprise so that all of the events are sent to a
    centralized event browser, you may need a way to distinguish events from each
    other. Event browsers typically include the event source in the message of an
    event. Many enterprise management frameworks provide some kind of grouping mechanism
    to group events together.


    In *IT/O*, for example, has message groups. When events are received into IT/O
    by an agent or at a management station, message groups are assigned based on matching
    conditions defined in the templates. Message group names are shown along with
    the event in the Message Browser. Additionally, you can view the Message Group
    window, which shows the status of each message group. The color of the message
    group icon represents the status of the worst severity event in that category.


    IT/O uses five different colors to represent event severity. Here is a list of
    the colors and their meaning.


    +   * **Green:** Normal/Up

    * **Cyan (Light Blue):** Warning/Marginal

    * **Yellow:** Minor warning

    * **Orange:** Major warning

    * **Red:** Critical/Down'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Figure 9-I shows message groups configured into IT/O. In this example, OpenView
    SMART Plug-Ins have added a whole set of database message groups, including groups
    for configuration events, faults, and performance.


    # ## Using Event Correlation Tools


    As a company''s enterprise grows to include more systems and devices, the company
    probably also wants to reduce the number of staff people needed to manage the
    enterprise. The sheer volume of events can be overwhelming.


    To avoid floods of information in an environment with multiple managed nodes,
    some type of event correlation is needed. For example, in a clustered environment,
    each node may notice the failure of a shared disk device. Without intelligent
    event filtering, the management station may receive a critical event from each
    cluster node. Event correlation tools provide event reduction and consolidation,
    exclude unnecessary and meaningless information, and identify root causes.


    In addition to the notification flexibility provided by IT/O, EMS, and other tools,
    you need additional control over the messages received. A network printer failure
    provides a good example. Although you may like to know when a network printer
    fails, if the event is detected and reported by all users of the printer it could
    inundate the Message Browser. Similarly, if the same event is reported multiple
    times, you may miss a more critical event. Filtering could make man-


    # ### Figure 9-1 Using IT/O Message Groups to categorize events.


    ![](img/eae88b61ada165139a1d9b546a34140b_269_0.png)'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'agement of these types of scenar ios much easier. Correlation tools can also
    be used to help resolve problems. For example, a network printer may be down to
    some of the users, but not all. The tools can be used to pinpoint the problem.


    We have selected a few event correlation tools to discuss in this section. Many
    other event correlation products are available. Here is a list of some that are
    not discussed:


    +   - NetCool/OMNibus from Micromuse provides event correlation capabilities.
    The NetCool/Reporter can generate reports based on events interesting to a particular
    user.

    - Tivoli Enterprise Console, part of Tivoli TME, can be configured to do simple
    event correlation.

    - COMMAND/POST, from Boole & Babbage Inc., does event correlation. It works with
    Tivoli TME, BMC PATROL, and OpenView.

    - InCharge, from System Management Arts (SMARTS), does event correlation. It is
    preconfigured with information about common network problems. InCharge is integrated
    with Tivoli TME.


    # OpenView Event Correlation Services


    HP OpenView provides the Event Correlation Services (ECS) tool that integrates
    with OpenView NNM and IT/O. ECS can be used to reduce and consolidate events.
    It can also be used to suppress and reduce event storms. This tool can be configured
    to filter out unnecessary information and help you identify the root cause of
    a problem. Using ECS, you only need to be notified of critical events. ECS is
    capable of receiving events as SNMP traps, CMIP notifications, opcm sg messages,
    and ASCII events. It can be used to manage networks, systems, databases, and applications
    and is extensible, so new events/sources are easy to add.


    The OpenView ECS product has two major components: the ECS Designer and the ECS
    Engine. The ECS Engine is a runtime correlation engine. It is the real-time component
    that acts against defined correlation rules. The ECS Designer is a graphical utility
    used to simplify developing and designing correlation rules. It also provides
    simulation capabilities to test rules before deploying them.


    A *correlation circuit* in ECS is a collection of nodes that are configured to
    perform correlation and filtering. ECS can correlate events independent of the
    order in which they were received. You can also configure ECS to suppress repeated
    events using a time-based filter.


    With the ECS integration in IT/O, correlation of events can be done from multiple
    devices locally by the agent or centrally at the management server. This not only
    reduces network traffic, but also allows for the root cause to be determined faster
    and closer to the source, providing more efficient problem resolution.


    Correlation templates are easy to distribute to managed nodes. They are distributed
    the same way as other IT/O templates. Automatic and operator-initiated actions
    can also be configured and executed locally, even when the management server is
    down.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'ECS also integrates with NNM. ECS can discover the network topology from NNM
    and can use it for correlation. It also comes with some out-of-the-box correlation
    circuits for network event correlation.


    # Seagate NerveCenter


    Seagate NerveCenter provides network event correlation and behavior management
    for UNIX and NT systems. It uses rules-based filtering and advanced correlation
    to pinpoint root causes and help you manage the volume of critical network issues
    and events in the enterprise. NerveCenter can also be configured to perform automated
    corrective actions.


    NerveCenter has three main components: NCServer, AdminTool, and NC Client. The
    NCServer maintains a database of events. It detects events, distributes information
    to clients, and communicates with the network management platform. The AdminTool
    is used for maintaining and configuring NerveCenter domains.


    NerveCenter comes with a graphical alarm interface. It provides a display to show
    the health of the environment at a glance. There is an Alarm and Traffic Summary
    window that shows existing alarms and their severity.


    Rules are also user-configurable via a drag-and-drop GUI. The user can specify
    particular events and define corrective actions.


    Behavior models are used to define the relationships between critical conditions
    and specific corrective actions. NerveCenter comes with several predefined models
    for monitoring network traffic, performance, status, security, and error conditions.


    There are many different types of automatic actions available to configure for
    specific events. The following is a list of automatic actions available from NerveCenter:


    +   - Send a notification to a management station or another NCServer.

    - Execute a UNIX or NT command or Perl script.

    - Log data to a file or database.

    - Send a page or e-mail.

    - Send an SNMP trap.

    - Perform an SNMP set.


    NerveCenter correlates across network devices, UNIX systems, and NT systems. Correlation
    can be done at a central management station or using a distributed management
    model. In the distributed model, each NCServer is responsible for managing different
    domains.


    NerveCenter correlates events through SNMP polling and listening for SNMP traps.
    It can be configured to monitor specific MIB variables. New MIBs can easily be
    added, so NerveCenter can be configured to poll additional MIB objects.


    NerveCenter integrates in most network management platforms, including OpenView
    NNM and IT/O, IBM NetView for AIX, Tivoli TME, and Unicenter TNG. It can also
    be run standalone. With IT/O integration, NerveCenter can forward messages to
    IT/O, and IT/O can forward messages to NerveCenter.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# ## IT Masters MasterCell


    IT Masters provides an event correlation tool called MasterCell. It provides event
    management capabilities for mission-critical applications in a distributed environment.


    MasterCell uses a distributed architecture, which employs agents and a central
    server. The agents perform limited filtering and can perform actions as well as
    forward events to the server. Using intelligent agents, MasterCell can eliminate
    bottlenecks by adding more cells to distribute the load. Also, using this multi-tiered
    structure puts intelligence as close to the source as possible. Events can be
    analyzed through intermediate queries and then selectively propagated. This architecture
    also eliminates an SPOF of the event management environment.


    MasterCell has four main components: the event processors/cells, an event browser,
    the Knowledge Base Editor, and adapters. Adapters, which run on the managed nodes,
    feed events into the cells. The cells collect and analyze the events. The event
    browser and Knowledge Base Editor, which connect to one or more cells, are written
    in Java, so you can run them from anywhere.


    Cells are the event processors in the MasterCell environment. These lightweight
    correlation engines are distributed across the enterprise. They collect and analyze
    events, then respond, store, propagate, or group events according to defined rules
    and actions. You can have networks of cells called domains. Cells can be grouped
    by geographical, functional, or organizational boundaries. Operators can be assigned
    to specific cell domains. Local actions can be performed on the workstation where
    a cell is installed.


    The MasterCell event browser can be used to browse events from one or more cells.
    Cells group events into collectors. Grouped events are shown as icons in the browser
    with color-coded indicators. You can drill down to view the events for each collector.
    Figure 9-2 shows an example of the collectors and their status indicators defined
    under demo1. You can also interactively trigger corrective actions from the browser.


    The Knowledge Base Editor, or KB Editor, is used to define classes and event instances.
    It is also used to define configuration rules. A wizard is available to walk you
    through the steps. You can


    ![](img/eae88b61ada165139a1d9b546a34140b_272_0.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'edit the knowledge base(s) offline, then distribute them to the cells. Figure
    9-3 shows some instances of application events, such as APP_DOWN, which have been
    defined using the KB Editor.


    Several new features have been added in the 2.0 release of MasterCell to dynamically
    maintain up-to-date configurations across cells and browsers in the enterprise.
    Configuration changes in the knowledge bases are maintained on a configuration
    server and are automatically distributed to the cells. When invoking the browser,
    configuration data from the server is retrieved automatically.


    The adapters feed events into cells. Adapters, which run on monitored systems,
    are background processes responsible for detecting events, translating the events
    into BAROC, and notifying MasterCell. MasterCell understands events using the
    BAROC language. This language is also understood at the Tivoli Enterprise Console.
    The adapters convert events into BAROC and send the events to the cell. MasterCell
    comes with adapters for SNMP, the NT event log, and generic text logs such as
    syslog. Events will be buffered if the adapter is unable to propagate them to
    the cell.


    The MasterCell rules engine goes through nine distinct processing steps for each
    event collected by a cell. It refines an event by gathering more information about
    the event or executing a command to qualify the event before the event is processed.
    It filters events, deciding whether an event should be dropped or passed on based
    on knowledge base rules. It regulates events by holding repetitive occurrences
    of events until a threshold based on time is met. It updates existing events in
    response to new events. It does abstraction, which creates higher-level events
    by combining low-level events. It also correlates an event with others to establish
    cause-and-effect relationships.


    ![](img/eae88b61ada165139a1d9b546a34140b_273_0.png)'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'effect relationships. The execute phase is where operators are notified and
    corrective actions based on rules are performed. The timer phase schedules actions
    based on time factors in the rules. It also propagates, forwarding events to other
    cells.


    MasterCell also has a performance throttling feature to control the rate at which
    events are processed. This feature can be used to control the impact of event
    storms on server resources.


    MasterCell runs on Solaris, AIX, HP-UX, and Windows NT. In addition, it integrates
    with Tivoli''s TME Enterprise Console, BMC PATROL, and Remedy AR System.


    # Monitoring Multiple Systems


    If you have a set of systems that needs to be managed in similar ways, being able
    to perform operations on groups of systems, rather than individual systems, can
    cut down on your having to do repeated tasks. Several tools allow you to cluster
    or group systems together, which can help you to apply management policies or
    monitor configurations in a single operation.


    # IT/O


    IT/O managed nodes can be grouped into *node groups*. When configuring monitoring
    for IT/O managed nodes, you can assign templates to an entire node group. Then,
    when you update the managed nodes, templates are distributed to all of the systems
    that are defined in the node group. This makes it easier to configure multiple
    systems in a consistent way and there is less room for error. If you assign templates
    to node groups, however, it becomes difficult to customize monitoring for each
    system. Customization requires separate templates that get applied individually
    to each node as needed.


    # ClusterView


    Some companies group critical systems together into a high availability configuration
    referred to as a *cluster*. ClusterView has special monitoring capabilities for
    HP-UX and Windows NT high availability clusters. It can report on the overall
    status of a cluster. In some cases, a cluster is considered to be available when
    at least one system in the cluster is up.


    ClusterView also allows you to define management clusters as a group of HP-UX
    systems. Then, from IT/O, you can apply management operations, such as applying
    templates or graph-ing metrics in PerfView, on a group of systems in a single
    step.


    In a single-system environment, you know where your application is running. When
    running applications in an MC/ServiceGuard environment, you may not always know
    where your applications are running. ClusterView shows where your applications
    are running or where they last attempted to run and their status.


    # Enterprise Management Frameworks


    The enterprise management frameworks are designed for centralized operations with
    monitor-ing of multiple systems. Agents are typically deployed on multiple systems.
    Most frameworks'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'provide a developer’s kit, which allows you to extend the agent’s monitoring
    capabilities so that you can provide monitoring in a consistent interface provided
    by the framework.


    Many of the enterprise management frameworks provide platform-specific agents
    to monitor systems across a heterogeneous environment. They provide a centralized
    event browser at the management station. This way, operations can be run in a
    consistent fashion.


    IT/O can monitor HP-UX, IBM AIX, Sun Solaris, Windows NT, as well as other platforms.
    CA Uncenter TNG and Tivoli TME also provide agents that can be managed from a
    centralized console for many different platforms.


    # ## ClusterView


    ClusterView can monitor HA clusters on HP-UX and NT systems. It provides a consistent
    interface for receiving events and getting information about HA clusters regardless
    of whether they are on NT or HP-UX systems. This is useful for administrators,
    because they do not have to learn a separate tool for each platform.


    # ## Monitoring Agents


    BMC PATROL agents and MeasureWare agents can run on many platforms. Data collected
    by these agents can then be analyzed using common tools in a common and consistent
    way. Each provides agents on most UNIX platforms, as well as on NT. Both products
    provide developer’s kits to extend the functionality and metrics that can be monitored
    and tracked.


    # ## Using Multiple Tools


    Vendors realize that no single product can provide a total solution that fits
    every need of an enterprise. And because you probably won’t find one tool or enterprise
    management platform that fits all of your fault management needs, several vendors
    provide integration tools. This feature provides you with more flexibility in
    selecting the tools that best fit your monitoring needs. This means that you can
    select best-in-class monitoring tools and manage them from your enterprise management
    framework platform of choice.


    Many of the monitoring tools integrate with enterprise management frameworks,
    such as IT/O, Uncenter TNG, and Tivoli TME. This section covers a few of the integration
    tools, but not all of them.


    There are many other combinations of integration tools. For example, Oracle’s
    OEM product is integrated with IT/O such that each tool can be launched from the
    other, IT/O can launch OEM in context. Also, OpenView SMART Plug-Ins work with
    MeasureWare, PerfView, and IT/O.


    # ## IT/Operations and the Network Node Manager


    OpenView IT/O includes the Network Node Manager (NMM). NMM can be used separately,
    however, integration provides all of the NMM capabilities from within the IT/O
    environment, and also includes more system and problem management capabilities.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'IT/O provides more managed node capabilities, while NNM provides mostly monitoring
    capabilities through standards such as SNMP. With IT/O agents, you can do more
    than just monitor managed nodes. You can manage them, too. With IT/O, you can
    set up more sophisticated message conditions and configure automatic or operator-initiated
    actions to run on the managed nodes. IT/O also provides more flexibility to add
    additional monitoring to your managed nodes.


    In both NNM and IT/O, colored icons on the graphical map are used to reflect node
    status. In NNM, node status is usually determined by the network status of the
    system, including the status of the network interface cards. In IT/O, node status
    is determined not only by the network status of the system, but also by the IT/O
    alarm status for that node.


    # ## IT/O and PerfView


    PerfView can be integrated into the IT/O Application Bank. With this integration,
    you can easily select a managed node, then use PerfView to graph metrics collected
    on the selected node. Add- tionally, templates can be configured so that if you
    receive a PerfView alarm condition in the IT/O Message Browser, you can run an
    operator-initiated action that will invoke PerfView to create a graph showing
    metrics related to the alarm condition.


    If you have the MeasureWare Agent installed on an IT/O managed node, it will detect
    the IT/O agent running and automatically start sending alarms to it.


    # ## BMC PATROL and IT/O


    PATROL does not require a special management console. Instead, its server-based
    PATROL agents can send monitoring information via SNMP traps to management platforms
    such as HP OpenView NNM and IT/O, CA UniCenter TNG, and Tivoli TME. This level
    of integration requires an addi- tional product called PATROLVIEW, and there are
    special versions for OpenView, Cabletron SPEC- TRUM, Remedy AR, Sun''s Solstice
    Domain Manager, and Tivoli TME. The PATROL product can be integrated with Unisenter
    TNG through a special product called PatrolLink.


    You need to install PATROLVIEW on the IT/O management station. This process installs
    and sets up message groups, message templates, node groups, threshold monitors,
    and application icons.


    One of the unique things about PATROL''s integration with IT/O is that PATROL
    agents from many systems, not just IT/O managed nodes, can send events to IT/O.
    PATROLVIEW includes a PATROL Event Translator server, the PET server, which translates
    PATROL events in IT/O events. The PATROL agents send events to the PET server
    on the IT/O managed node. The PET server processes and forwards the events to
    the IT/O agent.


    The PET server runs on one or more IT/O managed nodes. It receives and processes
    events from one or more PATROL agents, then forwards the data to the IT/O agent
    that processes the events and forwards them, if necessary, to the IT/O console.
    You can also install the PET server on more than one managed node. This is useful
    if one of your PET servers goes down. If you have only one PET server configured
    and it goes down, you will lose the connection to all of the PATROL agents that
    send events to the PET server and on to IT/O.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'If you want access to the PATROL console or agent configuration utilities from
    your IT/O management station, these tools must be installed there as well.


    # **PLATINUM ProVision and IT/O**


    PLATINUM provides the ProVision Adapter for HP OpenView. This provides you with
    a single point of integration to ProVision. The adapter automatically enables
    all ProVision tools from within the IT/O environment. The adapter comes with IT/O
    templates and monitors that get configured into IT/O at installation time.


    Using the PLATINUM IT/O Event Adapter, ProVision tools send events through the
    POEMS event manager to the IT/O agent at the IT/O managed node.


    PLATINUM also provides an MIB that can be used by any SNMP-ready management framework
    to receive events as SNMP traps from ProVision tools. The MIB can be loaded into
    NNM, IT/O, or AIX NetView, for example.


    PLATINUM ProVision is also tightly integrated with Tivoli TME. PLATINUM has integrated
    their products into TME to provide a common interface to the PLATINUM products
    from the TME environment.


    # **EMS and OpenView NNM or IT/O**


    EMS provides templates for receiving events into OpenView NNM and IT/O. With EMS,
    you can configure events to be sent as SNMP traps. If the system where you are
    configuring EMS monitors is an IT/O managed node, you can configure an event to
    be sent as an opmsg. In addition to configuring EMS notification targets, you
    also need to configure your management station to receive, recognize, and display
    events.


    For NNM, you need to load the EMS-specific trap configuration file. You also need
    to make sure the management station is listed as a trap destination on the monitored
    system.


    For IT/O, you need to configure the templates into IT/O. Templates include message
    conditions, automatic actions to gather additional event data, and instructions
    about each event. Once configured at the management station, EMS templates need
    to be assigned and distributed to managed nodes.


    Also available for IT/O is an Application Bank utility called monvols. With monvols,
    you can configure monitoring of all logical or physical disk volumes on an HP-UX
    managed node in a single operation. Event notifications are sent to the IT/O Message
    Browser.


    OpenView NNM and IT/O templates for receiving EMS events are freely available,
    along with the EMS Developer''s Kit and other tools at the Hewlett-Packard software
    Web site at http://www.software.hp.com, under High Availability. monvols is also
    available at this Web site.'
