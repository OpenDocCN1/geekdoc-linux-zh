- pgno: 233
  md: 'As mentioned earlier, the database administrator is responsible for trending
    analysis and capacity planning. Ideally, the administrator is focused on these
    strategic and planning activities, but often they spend time helping operators
    troubleshoot database problems. Automated tools for database operations help free
    the administrator to focus on these longer-range planning tasks. The administrator
    is likely to use some of the same tools as the operator for performance and resource
    management. For example, PerfView can be used to forecast future performance bottlenecks,
    and can also help to analyze existing resource problems.


    The remainder of this chapter describes a variety of tools and products that can
    be used to provide monitoring capabilities for databases. The emphasis is on the
    fault and performance and resource management categories; not many tools are available
    in the other important areas. Generic system and application tools, as well as
    database-specific tools, are covered in this chapter.


    Oracle is, by far, the dominant vendor for UNIX database servers and thus gets
    the most attention in this chapter. Informix is another important UNIX database
    vendor and is used for comparison purposes.


    # ## Using Standard Database Commands and Tools


    This section describes the commands and tools that are either included with a
    database product or are part of the operating system.


    # ### UNIX Commands


    UNIX commands and tools, such as ps and pstat, can be used to check on some of
    the important database processes. The database listeners and names servers are
    examples of some of these critical database processes. Listing 8-1 shows an example
    of using ps to find the Oracle processes on the system. Note that Oracle appends
    the database instance name to the end of the process names associated with each
    instance.


    The who command can be used to list the UNIX users logged in to the system. This
    gives you an idea of who is using the system, but doesn’t necessarily help you
    to determine who is using the database. Other tools, also described in this section,
    can be used to display information about current database users.


    # ### SQL Commands


    SQL commands can be used to check database status or the available space. Sometimes,
    the best way to know whether a database is working is to try to use it. This is
    a manual process, unless the commands are put into scripts.


    If a database problem exists, determining who is currently using the database
    may be useful. Listing 8-2 shows how you can make an SQL query to obtain this
    information in an Oracle environment.


    Listing 8-3 shows an example of using this SQL query on an Oracle 7.3 system with
    multiple active database users.'
  merge: -1
  img_proc: true
