    If you intend to write your own SNMP application, the root OID of the HP Cluster
    MIB is 1.3.6.1.4.1.11.2.3.1.6. The cluster type, hpmcClusterTypes, should indicate
    MC/ServiceGuard or MC/LockManager, with the additional MIB variables referring
    to a high availability cluster.


    You can check this MIB to ensure that high availability configuration parameters
    are set correctly, such as the heartbeat interval. You can also use this MIB to
    determine the critical applications running in the cluster and their status. Note,
    however, that the package status is accurate only on the cluster’s coordinator
    node.


    HP’s EMS HA Monitors product uses this MIB to monitor MC/ServiceGuard and MC/LockManager
    cluster, node, package, and service status.


    # ## Network Services MIB


