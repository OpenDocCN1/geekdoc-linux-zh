    {\n    WARNING ALERT \"Your app is busy.\"\n    EXEC \"echo 'finance app is very\
    \ busy'|mailx root\"\n}\nREPEAT EVERY 15 MINUTES\n    CRITICAL ALERT \"finance\
    \ app continues to be busy.\"\nEND\n    RESET ALERT \"finance app no longer busy.\"\
    \n```\n\nin an alarm definitions configuration file. You can then decide whether\
    \ the alarm definitions will generate too many or too few alarms. You can see\
