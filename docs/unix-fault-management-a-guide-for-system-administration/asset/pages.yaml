    # Event Monitoring Service


    As mentioned earlier, MC/ServiceGuard can monitor and migrate application packages.
    However, its application monitoring is limited to determining whether an application
    is running or has failed. MC/ServiceGuard relies on the Event Monitoring Service
    (EMS) to monitor additional components that are important to the application.
    The application package may be dependent on a'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'resource, such as a disk volume. Any package dependencies are specified when
    the package is initially configured. When the package is started by MC/ServiceGuard,
    EMS begins continual monitoring of each resource.


    EMS can report resource problems to MC/ServiceGuard so that an application can
    be restarted. EMS can also report important events to a log file or management
    station. This can aid in troubleshooting, because the operator can receive information
    about the specific component that failed (instead of simply learning that an application
    was restarted, with no explanatory text).


    A variety of events can be reported by EMS. Several networking links have customized
    monitors. A database monitor is available to monitor Oracle server status. The
    disk monitor can report logical and physical volume status information. All EMS
    monitors can be used with or without the MC/ServiceGuard product.


    EMS also provides a software developer’s kit that enables you to write your own
    monitor and use it along with other monitors. In this way, you can provide custom
    monitoring for your own homegrown application.


    EMS is available only for HP-UX platforms.


    # ## EcoSNAP


    Compuware’s EcoSNAP (formerly called Fault-XPERT) is another tool for detecting
    application failures. EcoSNAP is used to detect and troubleshoot application failures,
    both in production and during product development. Similar to MC/ServiceGuard,
    no application changes are required for EcoSNAP to be able to monitor and detect
    failures. Faults are reported to a console, and additional details that can aid
    in diagnosis can be provided along with a fault notification.


    EcoSNAP can also be configured to take certain actions when an application fails.
    In general, applications are started by the EcoSNAP starter program. If an application
    is already running, monitoring can be started by executing a special EcoSNAP command.


    EcoSNAP consists of four modules:


    +   • **Fault Agent:** Detects application faults. It is activated when a Unix
    signal or CICS abnormal end call (abend) is issued. After key information is captured
    by the Agent, control is returned to the OS. Information captured includes the
    application name, fault type and program offset, system information (such as the
    server name), and CICS for AIX and HP-UX transaction information.


    +   • **Fault Messenger:** Sends notification when a fault occurs. The failure
    event is sent to a configured console and system log file. It can also be sent
    via page or e-mail.


    +   • **Fault Manager:** Provides a visual display of the faults that have occurred.
    The program name, fault code, program offset, server name, user ID, and date and
    time of the fault are all displayed. The display lists all faults that have occurred,
    and history information can be used to identify trends.


    +   • **Fault Analyzer:** Can be used after viewing a fault in the Fault Manager
    display to drill down for additional diagnostic details. Additional information
    available includes a program'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'stack trace from the time of the failure, the OS name and version, the shared
    libraries used, a list of accessed files, filesystem information, the state of
    program variables at the time of the failure, and the failing source statement
    for C and C++ programs. The computer screen from the time of the fault can be
    displayed. Fault Analyzer can provide a list of possible causes of a problem as
    well.


    By providing fault information, such as stack traces, EcoSNAP can help in diagnosing
    problems with an application. Multiple applications can be monitored simultaneously.


    EcoSNAP works by detecting Unix signals that cause an application to fail. These
    signals are then trapped, and program diagnostic information is captured before
    the application actually terminates. This information is later made available
    through a GUI that enables the user to drill down on an individual fault. The
    following set of Unix signals and abnormal termination errors can be detected
    by EcoSNAP:


    +   - Signal or exception error

    - Deadlock timeout condition

    - Operation failed during RPC

    - Unable to synchronize

    - Communications operation failure

    - Invalid command

    - Unable to initialize application server

    - Illegal instruction

    - Bus error

    - Segmentation violation

    - Write on pipe error

    - Floating-point exception

    - Software termination signal

    - Quit (generated from terminal)

    - Hangup (generated from terminal)


    EcoSNAP runs on Sun Solaris, HP-UX, IBM AIX, and other platforms. More information
    about EcoSNAP can be obtained from Compuware Corporation''s Web site at http://www.compuware.com.


    # Monitoring Tools for ERP Applications


    ERP applications are used for supply-chain management within an organization.
    The top ERP applications are SAP R/3, Baan, PeopleSoft, and Oracle applications.
    This section describes the monitoring tools that have been customized for ERP
    applications, emphasizing SAP R/3, because it is the leader in this market.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Some ERP application vendors provide a monitoring capability, such as SAP''s
    Computing Center Management System (CCMS) management tool and the EarlyWatch program,
    which periodically check SAP performance. However, other vendors provide more
    complete monitoring capabilities. This section focuses on Envite Corporation''s
    monitoring capabilities for SAP, and three monitoring vendors, BMC Corporation,
    Hewlett-Packard, and Computerware Corporation, who provide customized monitoring
    products for multiple applications. Emphasis is placed on HP-UX solutions, because
    HP 9000s are the leading Unix platform for ERP applications from PeopleSoft, Baan,
    SAP, and many other key applications.


    As with other ERP applications, the availability of SAP R/3 depends not only on
    the application, but also on the underlying database, network, and OS. SAP R/3
    is a multi-tiered application with an application server, print servers, and a
    database server. Properly monitoring SAP R/3 requires the monitoring of all of
    these components. Products such as SMART Plug-Ins and BMC PATROL are advantageous
    because of the breadth of monitors that they have available.


    # Envite


    Envite provides several tools for monitoring SAP R/3:


    +   * **Inspector for R/3:** Manages SAP R/3 performance and availability, provides
    root-cause analysis and predictive analysis, and recommends recovery actions.
    The product analyzes 40 to 50 different categories of performance problems and
    collects and stores its information in a database on a dedicated NT server.

    * **Service-Level Manager for R/3:** Reports global SAP R/3 usage, performance,
    and availability information. Reports can be generated comparing actual service
    levels to service-level agreements that have been defined. Predefined reports
    are available that can be scheduled to be generated at regular intervals. Response
    time, transaction rate, and total bytes transferred are examples of the types
    of statistics that can be included on these reports.

    * **StopWatch:** Provides end-user response time information for SAP R/3. For
    every SAP R/3 transaction, StopWatch collects the total round-trip response time,
    which includes network time, SAP R/3 time, and client idle time. Reports are provided
    by user, transaction, or network segment. StopWatch is installed on the same LAN
    segment as the SAP R/3 application server so that it can capture LAN traffic and
    correlate logical transaction statistics.


    Envite claims to be able to detect 1500 different SAP R/3 symptoms, including
    deadlocks and a hung application. The applications have been certified with HP''s
    MC/ServiceGuard.


