    # Security Monitoring


    The whole area of security is a huge subject. Entire books are dedicated to security
    alone. Security is usually broken down into two categories: network security and
    host-based security. This section focuses on host-based (or system) security,
    so that you can monitor and detect activities that could compromise system, application,
    or data availability. Host-based security intrusions usually are the most problematic.
    As a system administrator, you should monitor the system for activities that would
    prevent the system from doing what it is intended to do.


    # Security Overview


    The level of security needed for your system depends on what you are trying to
    protect. Both the US government and European Information Technology Security Evaluation
    Criteria (ITSEC) have defined sets of security levels. The most common level is
    C2, which is the de facto standard for secure UNIX systems. Level B1 security,
    which is more secure than C2, is often required in government, military, and commercial
    applications. HP-UX, for example, operates in two modes of security: standard
    mode, which has no security, and trusted mode, which is C2-level compliant. Each
    level of security has different requirements.


    Regardless of the level of security you are trying to provide in your environment,
    several categories for system security apply to all levels. The requirements in
    each category are more restrictive as you increase the security level. These categories
    are authentication, authorization, access control, data security, and physical
    security.


    Before describing each of these categories, you need to know that implementing
    a host-based security plan will include defining policies for preventing intrusions
    and for monitoring to detect intrusions. Password policies are an example of the
    many policies that should be defined'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'and enforced to try to prevent intrusions. When monitoring to detect intrusions,
    detection systems need to be told what to monitor.


    After you implement intrusion-prevention policies, you need to put security monitoring
    and intrusion-detection monitors in place. You want these monitors to tell you
    when an intrusion was attempted, is occurring, or has occurred. The following
    are the system security categories that apply to all security levels, along with
    a description of what can be done to prevent and detect intrusions:


    +   * **Authentication**: Usually done to verify a user''s ID prior to allowing
    access to a system or resource. Authentication is usually accomplished with a
    password, which serves as proof that a user is who they claim to be. Password
    length and complexity restrictions, as well as password lifetime limits, are some
    of the devices that can be used to make getting past authentication checks more
    difficult for unauthorized users. More secure measures include hiding the password
    file, which contains encrypted passwords.


    +   * **Authorization**: The process of granting privileges to individual users.
    UNIX has two main classes of users. *Root users* (or superusers) have authorization
    to do almost anything on a system, including administer the system, perform backups,
    and bypass security controls. *Regular users* have ordinary access to programs
    and data. Authorization can be controlled by using time-based authorization, whereby
    users are restricted to certain hours of the day. Fine-grained authorization allows
    root access to be restricted to more narrow tasks, giving users only as much power
    as they need to accomplish their tasks. This provides more control over system
    security. HP-UX has a special version of SAM, called restricted SAM, which allows
    restricted use by authorized users, allowing you to delegate limited authority.
    Monitoring for failed login attempts and super-user logins is important, to see
    whether anyone is gaining or attempting to gain unauthorized access to the system.
    IT/O is one product that provides this capability.


    +   * **Access control policies**: Used to define which users have access to various
    system resources, including files, programs, and printers. Access control is generally
    handled through UNIX file permissions, which define read, write, and execute permissions
    by user, group, and everyone. Access Control Lists (ACLs) are also used to grant
    file access to users on a list. Or, ACLs can be used to list those users who don''t
    have access rights to a file. You can check a file''s access rights by using the
    ls command. You may want to monitor access rights for changes that allow other
    users to access these restricted files.


    +   * **Data security**: Helps you to protect critical data. This includes backups,
    which can protect against accidental data loss, and data encryption, which can
    protect the privacy of information.


    +   * **Physical security**: Covers the physical protection of system resources
    against deliberate or accidental threats. This includes ensuring against even
    simple threats, such as someone tripping on an exposed power cord.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# ## Security Monitoring Tools


    Auditing is a way to log security-related events on a per-user basis. It can be
    set up to monitor system calls, specific users, password policies, logins, superuser
    logins, failed login attempts, and so forth. Because auditing incurs lots of system
    overhead, you should try to limit it to the most critical security-related events.
    On HP-UX, auditing is available only in trusted mode. Auditing can be enabled
    on HP-UX using SAM. Although the system itself provides the library routines for
    auditing, data reduction and analysis tools are useful for extracting relevant
    information from audit logs.


    Some of the common tools for looking at audit logs are:


    +   OmniGuard/TTA (Axent Technologies): Used to detect intruders and abuse. It
    uses data from log files and listens for SNMP traps to feed into its rules engine
    when detecting intruders. It can also monitor file-level accesses.


    +   Stalker (Haystack Labs): Analyzes and compares audit logs to its database,
    to detect system misuse, attacks, and known system vulnerabilities. It can collect
    and store audit logs from multiple UNIX systems at a centralized server.


    MEMCO Software provides SeOS Access Control, which provides more granular root
    capabilities. Narrow capabilities can be granted to users to perform specific
    tasks. This means that you don''t need to grant a user full root capabilities,
    which can be dangerous, just to perform system backups, for example.


    You can make some simple checks to help protect your system. Check the `/etc/hosts.equiv`
    and `/.rhosts` files to ensure that the remote host systems listed are authorized
    to access the system. Also, the optional file `/var/adm/inetd.sec` can be used
    to explicitly deny or allow access to specific network services, so you should
    verify that this file is configured correctly.


    # ## Using Diagnostic Tools


    Various support tools monitor errors and faults, configuration information, and
    troubleshooting for hardware components, including the CPU, system memory, and
    tape devices. Some of these support tools also monitor software configurations,
    to track changes.


    # ## Support Tool Manager


    HP''s Support Tool Manager (STM) provides access to a set of tools for verifying
    and troubleshooting HP-UX system hardware. These online diagnostic tools provide
    the ability to determine device status, get configuration information, and diagnose
    hardware problems. These tools are available by using a GUI or through commands,
    and have the flexibility to be invoked automatically at periodic intervals.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'STM discovers the hardware devices on a system and can diagnose memory errors,
    Low-Priority Machine Check (LPMC) errors, I/O driver errors, Logical Volume Manager
    (LVM) errors, and over-temperature events. Memory errors include single-bit errors
    and page deallocation events.


    STM includes the Automatic Configuration Mapper, shown in Figure 4-8, which gives
    a graphical view of your hardware configuration using color-coded icons, showing
    device status as well as logical relationships, such as the peripherals connected
    to an I/O card. Each icon on the map represents a hardware device. These icons
    display the device type, device identifier, device path, last active tool, and
    test status (from last active tool). You can launch other STM tools from this
    view as well.


    The Information tool provides product identifier information, product description,
    hardware path, vendor name, firmware revision, and error log statistics, including
    read errors, which


    ![](img/eae88b61ada165139a1d9b546a34140b_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'can be used to trend and anticipate problems. This tool also checks onboard
    log information, and can be used to track configuration changes.


    Several other tools under STM perform varying levels of testing to stress a device
    or determine and diagnose problems:


    +   - **Verifier tool**: Can be invoked on a particular device to verify quickly
    that it is connected and functioning properly.


    +   - **Excerciser tool**: Stresses a device, to help reproduce and troubleshoot
    intermittent problems by stressing the hardware to the maximum point expected
    in a customer environment.


    +   - **Diagnose tools**: Perform a complete test of the hardware, to help isolate
    failures down to the component or FRU level.


    +   - **Expert tools**: Are sophisticated troubleshooting tools for expert users.


    +   - **Logtool tool**: Helps you to format, filter, and extract error information
    from raw data contained in system logs. You can monitor recoverable errors detected
    by the computer, such as *I/O device errors*. This data can be used to troubleshoot
    and trend historical information, so that you can fix failures before they become
    critical. The errors that you see here are automatically forwarded to the EMS
    Hardware Monitors, which generate an event if an error is serious enough.


    +   - **Firmware Update tools**: Provide a customer-usable way to update the firmware
    on hardware devices.


    STM enables an operator to run a module on several devices simultaneously. In
    addition, the operator can start diagnostic tests running on more than one system
    from within the user interface.


    STM provides both configuration and fault monitoring capabilities for the system.
    STM tools detect the same errors as the EMS Hardware Monitors, but the EMS Hardware
    Monitors report them in real time. After getting an EMS event, you can run STM
    to further diagnose a problem.


    STM is used to diagnose local or remote systems. It is available on HP-UX releases
    10.01 and later. STM replaces the Sherlock diagnostics. The software (product
    number is B4708AA) is being distributed on the HP-UX Diagnostic/IPR Media.


    # ## HP Predictive Support


    HP Predictive Support detects and predicts system-related faults. When problem
    conditions are detected, notification is sent to the HP Response Center. This
    level of care is meant for customers with special support contracts with Hewlett-Packard.
    The Predictive Support software proactively monitors the system and automatically
    reports information back to the HP Response Center via modem access. Because the
    HP Response Center is available 24 hours a day, 7 days a week, this procedure
    can lead to a quick response to problems.


    The Predictive Support software focuses on system event information for memory
    and I/O devices. Error logs are analyzed daily, with potential problems diagnosed.
    By proactively warning'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'of potential problems, scheduled maintenance can replace the unplanned downtime
    associated with a failed component.


    Predictive Support uses a set of rules on a managed node to determine when events
    should be sent to the HP Response Center. These conditions can be updated periodically
    by downloading new rules from HP. Event correlation ensures that duplicate messages
    are suppressed and that the Response Center is not repeatedly warned of the same
    root problem.


    Predictive Support analyzes on-board logs, system logs, and memory logs. The software
    can automatically dial the HP Response Center to transmit error data and logs,
    or the system administrator can initiate modem transmission. Similarly, Predictive
    Support software updates, to include new rules for generating predictive events,
    can be triggered automatically or controlled by the administrator. Configuration
    and administration is controlled through a menu-driven interface.


    System logs are scanned for I/O errors and LPMCs. Logged data is analyzed for
    trends associated with specific disk or tape devices, such as correctable errors.
    LPMC records are analyzed for internal cache errors. Memory logs are also scanned
    to look for error rates exceeding specified thresholds.


    The Response Center determines where a failed device is located, its model number,
    its manufacturer, and its serial number, so that repairs can be made. This information
    is sent in the failure notification messages.


    HP Predictive Support does not help with other areas of system monitoring, such
    as resource and performance management. Also, the software runs only on HP-UX
    systems.


    # HA Observatory


    HA Observatory is a suite of tools used to detect and quickly diagnose system
    problems. The products include the Configuration Tracker, which keeps track of
    the server’s software configuration, Network Node Manager, and HP Predictive Support.
    A support system and network router are also maintained at the customer site.


    HA Observatory relies on HP Predictive Support to report hardware failures. In
    addition, configuration information collected by the Configuration Tracker is
    available. The Configuration Tracker generates and maintains a snapshot of the
    configuration so that it can detect software configuration changes.


    HA Observatory uses a secure network link to HP’s High Availability Support Center
    from a special system at the customer site. This support system, an HP 9000 Series
    700 workstation, collects system configuration information from key servers and
    can be used to view network status and topology information. Hardware failure
    notifications and configuration information can be sent to HP. When permitted
    by the customer, HP support engineers can access the customer servers over the
    secure link to gather additional information.


    HA Observatory is supported only on HP-UX systems and is available only to customers
    with BCS and CCS support contracts.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Monitoring System Peripherals


    When monitoring your UNIX server, you should not forget about the system peripherals,
    such as disk, tape, and printer devices.


    # Disks


    Disk devices store your corporate data, so ensuring their correct operation is
    critical. Disk monitoring should be included as part of any effort to monitor
    a system. Chapter 5 is dedicated to covering the tools for monitoring disk devices
    because of the importance and complexity of the subject.


    # Tapes


    By checking for tape hardware failures periodically, problems can be found before
    the tape drive is needed. For example, early detection and repair can result in
    the evening backup application running without delays.


    You should use hardware monitors, such as the EMS Hardware Monitors, to ensure
    that your tape drives are healthy, so that backups may occur as scheduled. As
    mentioned earlier, a variety of tape-related errors can be detected, such as failed
    I/O operations to the tape, tape loader errors, and tape changer errors.


    # Printers


    This chapter discussed earlier how you can use MIB instrumentation to look for
    important system information. A Printer MIB specification typically is supported
    by modern network printer devices. The Printer MIB stores the status of the printer
    (online, offline, and so forth), as well as information about printer subcomponents,
    such as an empty printer tray. A tool such as IT/O can be used to enable monitoring
    of individual fields in the MIB, such as printer status.


    Using the lpstat command, you can check the status of jobs in the print queue
    and verify that the print scheduler is running. Using lpstat with no options shows
    you information for all the printers connected to the system.


    Some printer management software is also available. One example is HP JetAdmin
    software, which can be used to manage printers and monitor the status of jobs
    printing remotely. This host-based application provides real-time printer and
    job status information, as well as status updates, remote diagnostics and troubleshooting,
    an optional status log, and a remote front panel. The utilities are accessible
    through a graphical interface. Web JetAdmin software adds additional capabilities,
    such as the ability to view customized maps that show printer locations and status
    information from a Web browser.


    Web JetAdmin 4 is an HP software application that is used to monitor all peripheral
    devices on the network from a Web browser. Maintenance and troubleshooting can
    be done on any MIB-compliant printer device, including ScanJet 5 scanners and
    HP SureStore CD-ROMs.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# ## Collecting System Performance Data


    Users call their IT department when they have delays in accessing data or applications.
    Good tools are needed to help an operator pinpoint the source of the problem.
    This section covers some of the interesting performance and resource-utilization
    metrics, and the tools available to collect data about these metrics.


    A wide range of conditions may result in resource and performance problems. Running
    out of available memory may be caused by a failure of a memory component or by
    a memory leak in an application. A sudden rise in CPU utilization could be an
    indication of processor failure or the introduction on the system of a CPU-intensive
    application. Analysis is needed to determine whether resource problems can be
    fixed with a configuration change, hardware repair, or other techniques.


    Many important system resources have configured limits. The following system resource
    metrics are important to monitor:


    +   - Number of named pipes

    - Number of messages and message queues

    - Number of system semaphores

    - Amount of shared memory

    - Number of open files

    - Number of processes


    Earlier, this chapter discussed some of the tools that can be used to check system
    resource usage. The **sar** and **sysdef** commands can compare current usage
    to configured limits. An EMS monitor is available to detect thresholds being exceeded
    for the following resources:


    +   - Callout table

    - Process table

    - File descriptor table

    - File lock table

    - Shared memory

    - System semaphores

    - Message queues and message segments


    The performance tools discussed in this section can also detect resource usage
    problems.


    Some system performance monitoring is available from the **SAM Performance Monitors**,
    with which an administrator can obtain information on system, disk, and virtual
    memory activity, for example. Text-based information is displayed in a Motif window
    when one of the desired metrics is selected.


    Having historical information is important, to understand how the system performance
    has varied over time. Knowing how your system behaves under normal conditions
    helps when trying'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'to troubleshoot system performance problems. Note that the performance tools
    themselves impact the performance of the system, so you need to find a tool with
    low overhead.


    This section describes some common tools for measuring and monitoring system performance.
    Here are some of the key metrics discussed in this section:


    +   * **Buffer cache queue length**: Refers to the number of processes blocked
    that are waiting for updates to the buffer cache. If this value is high, it could
    be an indication of a memory bottleneck.

    * **Context switches**: How often processes are being swapped out of the run queue.

    * **CPU utilization**: Expressed as a percentage of time spent in various execution
    states. Low utilization indicates that the CPU spent the majority of its time
    in the idle state.

    * **CPU run queue length**: The average number of processes in the run state waiting
    to be scheduled.

    * **Memory utilization**: Usually expressed as a ratio of the amount of memory
    in use versus the total memory available.

    * **Paging**: Refers to the transfer of data between virtual memory (disks) and
    physical memory.

    * **Swapping**: Refers to the transfer of data between physical memory and a special
    virtual memory area reserved for swapping.


    Performance tools, such as BMC PATROL and MeasureWare, don''t always provide the
    same set of metrics on all platforms. For simplicity, this section focuses on
    the Sun Solaris and HP-UX platforms only. Also, these products are continually
    being enhanced, so the actual metrics available for use in your environment may
    not precisely match the information presented in this section.


    # MeasureWare


    HP MeasureWare Agent is a Hewlett-Packard product that collects and logs resource
    and performance metrics. MeasureWare agents run and collect data on the individual
    server systems being monitored. agents exist for many platforms and operating
    systems, including HP-UX, Solaris, and AIX.


    The MeasureWare agents collect data, summarize it, timestamp it, log it, and send
    alarms when appropriate. The agents collect and report on a wide variety of system
    resources, performance metrics, and user-defined data. The information can then
    be exported to spreadsheets or to performance analysis programs, such as PerfView.
    The data can be used by these programs to generate alarms to warn of potential
    performance problems. By using historical data, trends can be discovered. This
    can help address resource issues before they affect system performance.


    MeasureWare agents collect data at three different levels: global system metrics,
    application, and process metrics. Global and application data is summarized at
    five-minute intervals, whereas process data is summarized at one-minute intervals.
    Important applications can be defined by an administrator by listing the processes
    that make up an application in a configuration file.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '**Table 4-4 Categories of MeasureWare Agent Information**


    | Category | Metric Type |

    | :--- | :--- |

    | System | CPU, disk, networking, memory, process queue depths, user/process information,
    and summary information |

    | Application | CPU, disk, memory, process count, average process wait states,
    and summary information |

    | Process | CPU, disk, memory, average process wait states, overall process lifetime,
    and summary information |

    | Transaction | Transaction count, average response time, distribution of response
    time metrics, and aborted transactions |


    The basic categories of MeasureWare data are listed in Table 4-4. Also included
    are optional modules for database and networking support. MeasureWare agents also
    collect data provided through the DSI interface.


    The following lists the global system metrics that are available from MeasureWare
    on HP-UX and Sun Solaris. Additional metrics provided by MeasureWare are covered
    in other chapters.


    +   * CPU use during interval

    * Number and rate of physical disk inputs/outputs

    * Maximum percent full of all disk file sets

    * System CPU use during interval

    * User CPU use during interval

    * CPU use at nice priorities

    * CPU idle time during interval

    * Rate of system procedure calls during interval

    * Main memory use

    * Swap space use on disk

    * Number and rate of memory page faults during interval

    * Number of process swaps during interval

    * Percentage of virtual memory currently in active use

    * Number of processes in run queue during interval

    * Number of processes waiting for a disk during interval

    * Number of processes waiting for memory during interval

    * Number of processes currently in sleep state during interval

    * Number of processes waiting for other reasons during interval

    * Number of user sessions during interval

    * Number of processes alive during interval

    * Number of processes active during interval

    * Number of processes started during interval'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   - Number of processes completed during interval

    - Average runtime of completing process during interval

    - Operating system version

    - Number of processors in the system

    - Number of disk devices and their device IDs

    - Main memory size

    - Swapping space allocated

    - Disk I/O information (see Chapter 5)

    - Networking statistics (see Chapter 6)


    Note that, in addition to performance metrics, MeasureWare provides useful configuration
    information, such as number of processors and the number of disk devices.


    The following additional global system metrics are available on HP-UX:


    +   - CPU use at real-time priorities

    - CPU use for context switching during interval

    - CPU use for interrupt handling during interval

    - Number of processes waiting for interprocess communications during interval

    - Number of processes waiting on network transfers during interval

    - Number and rate of terminal transactions during interval

    - Average terminal transaction “think” time

    - Average terminal transaction first response time

    - Average terminal response to prompt time

    - Distribution of transaction first response times

    - Distribution of transaction response to prompt times


    You can have alarms sent based on conditions that involve a combination of metrics.
    For example, a CPU bottleneck alarm can be based on the CPU use and CPU run queue
    length.


    MeasureWare agents provide these alarms to PerfView for analysis, and to the IT/O
    management console. SNMP traps can also be sent at the time a threshold condition
    is met. Automated actions can be taken, or the operator can choose to take a suggested
    action.


    MeasureWare''s extract command can be used to export data to other tools, such
    as spreadsheet programs. Additionally, Application Resource Measurement (ARM)
    APIs (described in detail in Chapter 7) can be used to instrument applications
    so that response times can be measured. The application response time information
    can be passed along to MeasureWare agents for analysis.


    Although MeasureWare provides extensive performance and resource information,
    it provides limited configuration information and no data about system faults.
    For further information, visit the HP Resource and Performance Management Web
    site at http://www.openview.hp.com/solutions/application/.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# GlanchePlus


    GlanchePlus is a real-time, graphical performance monitoring tool from Hewlett-Packard.
    It is used to monitor the performance and system resource utilization of a single
    system. Both Motif-based and character-based interfaces are available. The product
    can be used on HP-UX, Sun Solaris, and many other operating systems.


    GlanchePlus collects information similar to the information collected by MeasureWare,
    and samples data more frequently than MeasureWare. GlanchedPlus can be used to
    graphically view the following:


    +   • Current CPU, memory, swap, and disk activity and utilization (see Figure
    4-9)

    • Application and process information

    • Transaction information, if the MeasureWare Agent is installed and active

    • Alarm information, color-coded to reflect severity

    • CPU utilization, with per-processor information available for multiprocessor
    systems

    • Memory utilization, split among cache, user, and system memory

    • Disk utilization, with the I/O paths of the top disk users indicated

    • I/O activity, by filesystem or logical volume


    GlanchePlus is also capable of setting and receiving performance-related alarms.
    Customizable rules determine when a system performance problem should be sent
    as an alarm. The rules are managed by the GlanchedPlus Adviser. The Adviser menu
    gives you the option to Edit


    ![](img/eae88b61ada165139a1d9b546a34140b_101_0.png)


    ![](img/eae88b61ada165139a1d9b546a34140b_101_1.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# **Listing 4-13**  Defining alarms in GlancePlus.


    ```

    ```

    alarm CPU_Bottleneck > 50 for 2 minutes

    start

    if CPU_Bottleneck > 90 then

    red alert "CPU Bottleneck probability=  ", CPU_Bottleneck, "%"

    else

    yellow alert "CPU Bottleneck probability=  ", CPU_Bottleneck, "%"

    repeat every 10 minutes

    if CPU_Bottleneck > 90 then

    red alert "CPU Bottleneck probability=  ", CPU_Bottleneck, "%"

    else

    yellow alert "CPU Bottleneck probability=  ", CPU_Bottleneck, "%"

    end

    reset alert "End of CPU Bottleneck Alert"

    ```

    ```


    Adviser Syntax. When you select this option, all the alarm conditions are shown,
    and you can then modify them.


    Alarms result in onscreen notification, with the color representing the criticality
    of the alarm. An alarm can also trigger a command or script to be executed automatically.
    Instead of sending an alarm, GlancePlus can print messages or notify you by executing
    a UNIX command, such as mailx, using its EXEC feature.


    To configure events, you need to edit a configuration file. The GlancePlus Adviser
    syntax file (/var/opt/perf/adviser.syntax) contains symptom and alarm configuration.
    Additional syntax files can also be used. A condition for an alarm to be sent
    can be based on rules involving different symptoms. Listing 4-13 shows an example
    of how you can set up an alarm for CPU bottlenecks that is based on CPU utilization
    and the size of the run queue.


    You can also execute scripts in command mode. To execute a script, type:


    ```

    ```

    glance  -adviser_only --syntax <script file name>

    ```

    ```


    In this example, a yellow alert is sent to the GlancePlus Alarm screen if a CPU
    bottleneck is suspected. As a bottleneck becomes more likely, the alarm changes
    to red. You can define the threshold for when the alarm should be sent. The symptoms
    are re-evaluated at every time interval.


    Here is a sampling of some of the useful system metrics that can be monitored
    with GlancePlus:


    +   - CPU utilization

    - CPU run queue length

    - Number of processors

    - Filesystem buffer cache queue length

    - Disk utilization and queue length

    - Physical memory capacity'
