  img_proc: true
- pgno: 81
  md: 'available to download from the Internet at http://www.software.hp.com, under
    the High Availability Software product category. A developer’s kit is also available
    so that customers and system management software providers can integrate their
    own EMS monitors. EMS manuals are available at http://docs.hp.com/unix/ha.


    # ## EMS High Availability Monitors


    The HA Monitors product contains several EMS monitors for monitoring filesystem
    space, network interface status, disk status, and MC/ServiceGuard cluster status.
    HA Monitors also detects changes in the number of users and jobs. This product
    has been extended to include database monitoring capabilities as well.


    Available filesystem space can be monitored for any mounted filesystem. The operational
    status is monitored for each configured network device. For disks, you can monitor
    physical volume status, logical volume status, the number of mirrored copies,
    and summary information.


    The MC/ServiceGuard cluster monitor, included with HA Monitors, reports on cluster
    events, such as the failure of a cluster node, and provides monitoring that is
    similar to the events reported in ClusterView. The ClusterView product provides
    more complete monitoring of MC/ServiceGuard clusters, but it requires the purchase
    of HP OpenView. Here are the resources monitored by the cluster monitor:


    +   - Cluster status

    - Node status

    - Package status

    - Service status


    Monitoring node status using EMS can be done to provide notification when MC/Service-Guard
    detects problems with the system. Whereas MC/ServiceGuard’s job is to detect a
    system failure and move the configured application package(s) to an alternate
    system, the EMS cluster monitor’s job is to notify you of such an event.


    # ## EMS Hardware Monitors


    The EMS Hardware Monitors provide the ability to detect and report problems with
    system hardware resources, including system memory, tape devices such as SCSI,
    Digital Linear Tape (DLT), and Digital Data Storage (DDS), tape libraries, and
    autoloader. These monitors detect device errors, component failures, page deallocation
    errors, and other faults. They poll the hardware at regular intervals and most
    notify of hardware errors in real time. These monitors are delivered with HP-UX
    Online Diagnostics, which are freely available for HP-UX. The EMS Hardware Monitors
    provide monitoring for the following system components and Hewlett-Packard products:


    +   - System memory

    - SCSI tape devices'
