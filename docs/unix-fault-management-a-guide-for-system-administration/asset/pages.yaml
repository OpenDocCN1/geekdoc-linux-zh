    # ## Using Event Monitoring Tools


    Event monitoring involves generating notification messages as soon as faults and
    other interesting conditions are detected. This is unlike UNIX commands, which
    report status information only when asked. You can configure event monitors to
    generate an event when a change in status occurs or when a predefined threshold
    condition has been met. Some event monitors generate events when faults or errors
    occur at the disk device level.


    Several monitors discussed in this section are integrated into the Event Monitoring
    Service (EMS) framework. The EMS framework, available only on HP-UX systems, enables
    monitors'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'to be provided in a consistent manner for a system. Whereas the EMS framework
    itself is freely available, the monitors are usually available as separate products
    or are bundled with the individual products for which they provide monitoring.


    EMS provides a consistent graphical user interface (GUI) for the discovery and
    configuration of resources that can be monitored. EMS monitors can be configured
    to send events to OpenView IT/O. In addition, EMS events can be sent directly
    to any SNMP-capable management station, to a network application listening on
    a TCP or UDP port, to an e-mail address, or locally, to the console, system log
    file, or user log file. MC/ServiceGuard can allow packages to be dependent on
    these EMS resources, as well.


    HA Monitors is a software package of EMS monitors. It includes monitors for filesystem
    space, user and job information, network interface status, MC/ServiceGuard cluster
    status, and disk volume status.


    # Event Monitoring Service Disk Volume Monitor


    The EMS Disk Volume Monitor (DVM) is included in the HA Monitors product. It can
    be used to monitor disk resources that are configured using LVM, including copies
    of mirrored logical volumes.


    The EMS DVM can be used in conjunction with MirrorDisk/UX. Using MirrorDisk/UX
    is completely transparent to an application. However, this can sometimes be a
    problem. A disk could fail and a mirror could take over, but the operator wouldn’t
    know about the failure, so the failed disk wouldn’t get repaired. Eventually,
    another failure would occur, with no backup for the data. The EMS DVM provides
    help for this situation.


    The EMS DVM is responsible for monitoring a variety of attributes:


    +   *   Physical volume summary

    *   Physical volume and physical volume link status

    *   Logical volume summary

    *   Logical volume status

    *   Logical volume copies


    These attributes (or resources) are structured into a resource hierarchy. Figure
    5-2 shows the EMS DVM’s resource hierarchy. The resource instances, such as the
    volume group names or logical volume names, vary from system to system, based
    on the configuration. The EMS DVM requires monitor requests to be initiated on
    each local node; however, this also allows monitor requests to be customized to
    the local systems, so that only the critical disk resources need to be monitored.


    The physical volume summary provides a summary status of all physical volumes
    in a volume group. In determining the summary status, the EMS DVM notes which
    physical volumes are not up, and their associated physical volume group. The possible
    values for the physical volume summary status are shown in Table 5-1.'
