- pgno: 306
  md: "# ## Monitoring Notes\n\nIf you intend to write your own SNMP application,\
    \ the numeric root OID of the Host Resources MIB is 1.3.6.1.2.1.25.\n\nThe valid\
    \ states for the hrDeviceStatus field in the hrDeviceTable are unknown, running,\
    \ warning, testing, and down. When used for printers, this status can be combined\
    \ with printer status fields to determine a more specific status of a printer\
    \ device, such as active, busy, or unavailable.\n\n# ## Printer MIB\n\nThe Printer\
    \ MIB is the proposed IETF standard for defining a printer’s attributes and current\
    \ status. The MIB focuses on management of the printer itself, not the queuing\
    \ or scheduling of print jobs. The Printer MIB can report critical alerts such\
    \ as “Out of Paper”. Several printer vendors have already adopted this MIB. For\
    \ example, Hewlett-Packard uses this MIB to record information about its LaserJet\
    \ 5Si and many other printer models.\n\n# ## MIB Definition\n\nListing A-5 shows\
