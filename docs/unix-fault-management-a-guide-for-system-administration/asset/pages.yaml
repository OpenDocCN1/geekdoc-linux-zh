    # ### EMS Hardware Monitors


    EMS Hardware Monitors provide the ability to detect and report problems with system
    hardware resources, such as disk components. EMS Hardware Monitors help you to
    monitor for faults, such as device errors and component failures. They not only
    poll the hardware at regular intervals, but they also notify you of hardware errors
    in real time. EMS Hardware Monitors are delivered with HP-UX Online Diagnostics,
    which is freely available for HP-UX. EMS Hardware Monitors provide monitoring
    for the following Hewlett-Packard products:


    +   - AutoRAID disk arrays

    - High availability disk arrays

    - High availability Storage Systems'
