    # BMC PATROL Knowledge Modules


    BMC Software provides monitoring capabilities through its PATROL software suite.
    PATROL is a system, application, and event management suite for system and database
    administrators. PATROL provides the basic framework for defining thresholds, sending
    and translating events, and so forth. Optional products called Knowledge Modules
    (KMs) contain the capability to monitor specific components. For example, BMC
    PATROL includes KMs for Unix, SAP R/3, Oracle, Informix, PeopleSoft, and other
    applications. In fact, more than 40 KMs are available from BMC for use with PATROL.


    PATROL consists of a console, intelligent agents, and KMs. The console provides
    a centralized graphical display in which icons represent system components or
    other monitored components. Icons change color to correspond to status. The PATROL
    console also provides an event browser, where you can filter, correlate, sort,
    and escalate events. Alarms can be configured so that events are sent to the console,
    indicated graphically, and shown in the event browser.


    Intelligent agents provide the ability to discover the system, database, and application
    components in the enterprise. The agents reside on each server. On an ongoing
    basis, the agents look for problems, and when they locate one, they either take
    preconfigured actions or send notification so that recovery can be done manually.


    The KMs contain the expertise used by PATROL to know what to monitor and how to
    react when problems occur. KMs are used to monitor a set of “parameters,” which
    can include a description of the monitored attribute, the polling interval, the
    method for measuring the attribute, and a threshold for abnormal values. The KMs
    provide rules to detect events and perform corrective actions. Events are sent
    to an operator console when an error or warning condition occurs.


    BMC provides tools in its Unix KM that can help in monitoring applications. For
    example, the ACTIVEPROCESS tool monitors active processes. The PROCESS tool displays
    statistics on active and zombie processes. The USER tool monitors user sessions
