- pgno: 44
  md: 'EMS is the only method for allowing a resource monitor to send events to MC/ServiceGuard,
    which again reflects its emphasis on high availability. EMS can also send notifications
    via SNMP, opcmq, TCP, UDP, and e-mail, and can write to the console, a specified
    text file, or another application.


    EMS provides a few key functions. It is meant to provide a consistent way for
    a user to enable monitoring of different system components, which is done through
    the EMS SAM GUI, the MC/ServiceGuard SAM GUI, the Hardware Request Manager (monconfig),
    and a set of EMS library routines.


    When configuring monitoring conditions, you have the option to request notification
    at every polling interval, when the value changes, or when some configured threshold
    has been met. The polling interval can range from 30 seconds to 1 day.


    You can configure additional information to be sent along in an event, providing
    customization for the specific environment in which EMS is used. Also, when events
    occur, the resource monitor can include additional resource-specific information
    to aid problem diagnosis.


    EMS was created with system performance in mind. An EMS resource monitor runs
    only if a user has asked to monitor at least one resource instance. Also, multiple
    resource instances can be monitored concurrently by the same monitor process.
    EMS APIs are provided to allow the monitor to check a resource at the appropriate
    time interval. Monitors that receive resource information asynchronously don''t
    need to use these APIs and can thus operate more efficiently. This can allow for
    event notification to be received in microseconds, without paying the system performance
    penalty of frequent polling.


    EMS alarms are configured separately for each client. The alarms of other products,
    such as MeasureWare, are system-wide. EMS can detect problems more quickly than
    other tools that need to wait for summary time intervals to expire. However, EMS
    doesn''t have the concept of durations or compound conditions, which can be associated
    with alarms.


    EMS requests are per client. A target “user” can receive customized event data,
    and another “user” can receive different data for the same event. EMS monitor
    data enables the monitor to provide customized data for an event.


    To ensure that monitored resources continue to be monitored, EMS provides a “persistence
    client.” The EMS persistence client detects when a monitor fails and automatically
    restarts it.


    # Monitor Discovery and Configuration


    EMS provides a consistent GUI for the discovery and configuration of resources
    that can be monitored. The EMS GUI, available from SAM, can automatically discover
    the set of resource monitors available on a system. Resource instances can vary
    from system to system based on hardware and software configuration. Using EMS,
    you can define conditions indicating when notification events should be sent.
    Notifications can be sent at periodic intervals, when a component''s state changes,
    or when a threshold condition is met. EMS also allows you to configure where events
    should be sent.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'EMS requires monitor requests to be initiated on each local node; however,
    this also allows monitor requests to be customized to the local systems so that
    only the critical resources need to be monitored. EMS should not be considered
    an enterprise framework because it lacks the ability to enable monitoring across
    multiple systems easily.


    Using the EMS GUI to configure each resource instance to be monitored may be time-consuming.
    The EMS Configuration GUI supports some wildcarding to make the configuration
    easier. Also, the EMS Hardware Monitors available with Online Diagnostics come
    preconfigured. If you are using IT/O, a tool called monvols is available to help
    you configure all the logical or physical volumes for a selected system. The monvols
    tool and other tools and templates for EMS are available for free when downloading
    the EMS Developer''s Kit from the Web at http://www.software.hp.com/products/EMS.
    Note, however, that monvols is available only for HP-UX 10.20.


    To configure most EMS monitors, you use SAM. From its Resource Management functional
    area, you can select the Event Monitoring Service to launch the EMS GUI, and then
    add a new monitoring request. The initial configuration screen is shown in Figure
    3-4.


    MC/ServiceGuard provides one GUI, as well as command-line and configuration-file
    options, to configure packages to be dependent on EMS resources. In this case,
    event notification is sent directly from a resource monitor to MC/ServiceGuard.


    The EMS configuration tools enable a user to configure a resource or set of resources
    to be monitored. The user chooses the type of notification desired based on applications
    available in the customer environment. For example, if events should be sent to
    an OpenView management station, the user can choose SNMP notification. SNMP can
    also be used to send events to other management stations, such as IBM NetView,
    Tivoli, or CA Unicenter TNG. If IT/O is being used, opcmsg notification is available
    on IT/O managed nodes. Although EMS is often used with a management platform such
    as HP OpenView, HP OpenView is not required. For


    # Figure 3-4 Initial EMS configuration screen.


    ![](img/eae88b61ada165139a1d9b546a34140b_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'example, if a customer has written a custom fault-recovery application, event
    notification could be received directly by the application, using TCP or UDP.


    The EMS configuration tools also enable you to browse the list of resources that
    can be monitored dynamically. This allows a resource monitor to monitor different
    resource instances on different systems, and provides a standard interface for
    operators to find available monitors. You can then customize the monitoring for
    each system. Although EMS provides more flexibility, it is also more difficult
    to configure, because configuration is generally done once per system.


    First, the operator browses through the available resources. Then, he or she selects
    a resource to monitor and specifies the monitoring parameters, such as thresholds
    and polling intervals. After the monitor request is made, the operator is returned
    to the main EMS screen, where all active EMS monitor requests are displayed.


    EMS hardware monitor configuration is done by using the Hardware Monitoring Request
    Manager, monconfig. Notification conditions can be configured in a consistent
    way for all the supported hardware resources on the system. As hardware is added
    to the system, monitoring can be enabled automatically and consistently with the
    way similar hardware is being monitored.


    If requesting SNMP trap or opcmgs notification, additional configuration is usually
    required on the management station. EMS provides templates that can be used in
    OpenView NNM or IT/O to recognize and format traps and opcmgs notifications for
    viewing in their respective event browsers.


    # ## Monitor Developer''s Kit


    EMS provides a Developer''s Kit to make it easy for customers and third parties
    to integrate or write their own EMS monitor programs. Customers can define their
    own important resources to be monitored. Using the EMS Developer''s Kit also ensures
    that monitors will behave in a standard way.


    The EMS Developer''s Kit includes the necessary header files and libraries to
    write a custom resource monitor. Monitoring APIs are provided for the monitor
    to receive requests, wait during polling intervals, and send notifications. A
    sample monitor is also provided. The mechanism to actually check the value of
    a resource is resource-dependent, but APIs are provided to determine whether notification
    should be sent based on the value of a resource. The monitor provider does not
    need to write code to send different types of notification, such as SNMP traps
    or e-mail; this is handled by the EMS framework.


    All the products in this chapter provide some mechanism to allow you to add your
    own resource monitors. EMS monitors are more difficult to develop because they
    require you to write a program instead of merely writing some scripts. EMS, however,
    provides more flexibility, because its monitors do not have to rely on HP-UX commands
    to gather data.


    Information on using the EMS Developer''s Kit is included with other software
    that is downloadable from the HP software Web site. You can find the Developer''s
    Kit along with HP OpenView templates and other tools at http://www.software.hp.com,
    under the High Availability Software product category. EMS manuals are available
    at http://docs.hp.com/hpux/ha.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Notification Methods


    EMS was designed specifically to support monitors for high availability resources.
    Consequently, it supports notification by using an HP-proprietary interface to
    MC/ServiceGuard. However, EMS can be used without MC/ServiceGuard and it supports
    an unusually large variety of notification options, including:


    +   - SNMP traps

    - IT/O''s RPC mechanism (opcmsg)

    - E-mail

    - Logging to the system log file, the console, or a specific log file

    - UDP or TCP messages


    Notification is sent on a per-request basis, which provides additional flexibility.
    Several EMS events can be managed concurrently, as shown in this example:


    +   - Client A requests Event 1 via SNMP

    - Client A requests Event 2 via opcmsg

    - Client B requests Event 1 via TCP

    - Client B requests Event 3 via TCP

    - Client C requests Event 3 via opcmsg


    Notification is then sent to the specified clients when the events occur.


    # Diagnostic Capabilities


    EMS enables the monitor to provide arbitrary data, up to 10,000 bytes, along with
    an event notification. This information can be unique for each event notification
    and it can contain vital diagnostic information. For example, a disk failure event
    could include the serial number of the failed disk device in its monitored data
    area. Additional text could describe how to fix a failed component. Monitor providers
    taking advantage of this capability must document how operators should interpret
    this information.


    EMS Hardware Monitors provide detailed information about the cause of an event
    and give recommended actions.


    Unlike other products, such as Uncenter TNG, EMS doesn''t provide the ability
    to take automated actions in response to events. However, you can have events
    sent to your own customized fault-recovery application by configuring the TCP
    or UDP notification methods. If EMS is used with IT/O, then you can also configure
    templates and recovery actions into IT/O.


    # Additional Information


    The EMS framework is freely available from HP with the Online Diagnostics on the
    support media and the application CD-ROMs.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'For the latest information on EMS, check the HP High Availability Web site
    at http://www.datacentersolutions.hp.com/2_3_index.html. The EMS manuals and release
    notes are available at http://docs.hp.com, under High Availability.


    You can learn more about the Hewlett-Packard diagnostic tools, including the EMS
    Hardware Monitors, on the Web at http://docs.hp.com/hpux/systems.


    # # PLATINUM ProVision


    PLATINUM technology, Inc. has a suite of products called ProVision (originally
    Enterprise Performance Management). The ProVision product suite collects server,
    database, and network performance information and has four components: DBVision,
    ServerVision, WireTap, and TransTracker. Data can be collected by agents running
    either locally on the managed system or remotely over the network. All of these
    components, except for TransTracker, share the same ProVision console, an NT or
    X Windows GUI.


    ProVision has agents collecting performance data, which then is stored in a database.
    Configuration parameters determine when to archive, delete, and compress data.
    These parameters can vary for each individual metric. Utility programs are available
    to export and import archived data.


    PLATINUM also provides solutions for software distribution and remote execution
    (AutoXfer), problem resolution (Apriori), security (AutoSecure), data warehousing,
    disaster recovery, and capacity planning.


    The PLATINUM tools are accessed through an interface called PLATINUM Director,
    which provides monitoring through different user-configurable perspectives. Operators
    can use either a graphical view, showing the status of system resources or applications,
    or a Windows Explorer-like view, showing systems listed in a hierarchical tree
    format. From a Director console, administrators can first see a high-level view
    of events and system status, and then drill down to take actions. The Alarm window
    shows the status and descriptions of events, with event-specific actions available
    from a pull-down menu.


    From the Director Explorer view, the administrator can select a system and then
    launch other tools, such as the job scheduler, to view the job status for a system.
    The AutoXfer tool can be launched to distribute software.


    AutoSecure and AutoSys are certified with MC/ServiceGuard. AutoSys and Apriori
    have been integrated with HP OpenView. A much more complete integration has been
    done with Tivoli TME.


    # ## Monitored Components


    DBVision is PLATINUM’s product for database monitoring. DBVision gathers database
    statistics and supports Oracle, Sybase, Informix, and DB2. Events such as resource
    thresholds can be sent from different databases to a central console, where corrective
    actions can be taken. DBVision can detect problems such as running out of available
    tablespace, processes waiting for locks, and runaway processes.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'ServerVision collects server performance data. Metrics include CPU utilization
    and swap space usage. The product can also be used to see which user is tying
    up system resources. ServerVision supports Sun Solaris, HP-UX, IBM AIX, NT, and
    other operating systems. It monitors and manages the performance of UNIX and NT
    servers, and provides system-wide metrics for use by other tools, such as PLATINUM''s
    job scheduler, AutoSys. AutoSys provides dynamic load balancing and batch queue
    control.


    WireTap shows the utilization of a network segment. The standard product categorizes
    network utilization by transport protocol, network protocol, application, and
    so forth. Optional modules can provide additional statistics for Oracle and Sybase
    requests, and for Web traffic.


    TransTracker is a pre-deployment tool for measuring the system, database, and
    network usage of a transaction. Instead of requiring an application to be instrumented,
    TransTracker can identify transactions by collecting data from network packets.


    WireTap can also be used to measure transaction response time. WireTap provides
    net- work monitoring by capturing packet-level data and categorizing it by protocol
    (such as HTTP or TCP). The user can identify SQL statements to look for, and can
    define alarm thresholds so that notification is sent when transaction response
    times are not being met. Web performance data for HTML requests can be provided,
    as well as Web server "hit" rates. Alarm information can be sent to the ProVision
    console or through an event adapter to the Tivoli Event Console.


    PLATINUM provides a variety of database products. Solutions are available for
    database monitoring, database administration, and database performance bottleneck
    identification.


    Database tools, such as Enterprise DBA and TSReorg, provide user administration,
    schema, and content management, as well as database reorganization. Enterprise
    DBA''s admin- istrative tasks can be done across different databases, with support
    for Oracle, Informix, and DB2 databases. Remote agents are used to perform the
    changes to the database. TSReorg sup- ports both Oracle and Sybase databases.
    It can be used to reorganize database tables, indexes, and tablespaces. TSReorg
    is integrated with DBVision so that corrective actions can be automat- ically
    taken in response to an event. Tablespaces can be monitored with database reorganization
    triggered automatically. Tablespaces can be reorganized while the database stays
    online. TSRe- org can also be used to view database structures graphically, showing
    where database fragmen- tation exists.


    # ## Monitoring Features


    ProVision includes agents to collect performance data and a GUI to show performance
    graphs. ProVision can be compared to the combination of MeasureWare and PerfView,
    products dis- cussed later in this book.


    Performance data can be accessed via the GUI console or a character-based interface.
    Both real-time and historical data can be presented. The console can display performance
    data from multiple database instances and servers. The information can be displayed
    as bar graphs, time-based graphs, charts, and tabular displays. You can also create
    your own display with your own combination of graphics.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'ProVision enables you to configure alarms using multiple thresholds and varying
    severities. Actions can be configured at each severity level. Actions include
    several notification options, such as paging, e-mail, and SNMP traps. Corrective
    actions can also be configured. ProVision allows multiple actions to be configured
    that can be scheduled to run either simultaneously or sequentially.


    # Monitor Discovery and Configuration


    The DBVision and ServerVision instances to be monitored are defined during the
    installation and post-installation of ProVision. From the console, you can get
    summary statistics for each instance.


    Some predefined alarms are provided by ProVision. You can also create your own
    alarms be specifying the metric and threshold condition. Alarm configuration is
    available from the console’s Control menu. The metric name needs to be entered
    manually, but you can find available metrics by using the Display menu. Menus
    associated with the graphs list available metrics. A wildcarding capability is
    also available. After specifying threshold information and actions, you may need
    to specify additional information, such as a mail recipient or pager number.


    Before configuring an alarm, you may want to see which ones have already been
    defined. From the console, you can see a summary of the active alarms for all
    monitored instances.


    # Monitor Developer’s Kit


    PLATINUM Open Enterprise Management Services (POEMS) is a framework for plugging
    in additional monitoring capabilities. Tools using POEMS can take advantage of
    common services, including PLATINUM Director, event management, and communications.


    # Notification Methods


    Performance agents (scanners) collect data and store it in a shared memory segment,
    which is accessible to the archive and alarm background processes. The alarm process
    checks the data in the shared memory segment to determine whether alarm conditions
    are met.


    When problems are detected, alerts can be sent to a pager, via e-mail, or to a
    centralized console receiving information from multiple databases or servers.
    Predetermined corrective actions can be taken in response to an event. These actions
    can be defined in customized scripts that are executed automatically.


    Colors can be associated with each alarm severity when the events are shown in
    the Alarm window. The instance experiencing the alarm will also be highlighted
    within the GUI. An audible alarm is also provided at the console when the alarm
    arrives. Notification can be sent via e-mail or pager. Alarms can be sent to the
    management console or to any SNMP-capable management station using a predefined
    SNMP notification script.


    A set of predefined corrective actions that can be used in response to alarms
    is provided, and you can define additional actions. Forwarding an alarm via pager
    or e-mail is an action that is supported. If multiple actions are provided for
    an alarm, they are executed in the order specified in the configuration.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "A single alarm can have multiple actions associated with it. ProVision waits\
    \ for a specified time and then takes the next corrective action. If the actions\
