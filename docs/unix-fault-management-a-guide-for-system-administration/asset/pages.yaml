    # Monitoring Notes


    If you intend to write your own SNMP application, the root OID of Oracle’s Network
    Listener MIB is 1.3.6.1.4.1.111.5.


    Each entry in the oraListenerTable represents the network listener for a current
    database instance on the system. You should monitor the state of the listener,
    oraListenerState, to ensure that the process is still running. If the listener
    isn’t running, then no new client connection requests can be processed. You can
    monitor this by having your management station listen for an oraListenerStateChange
    trap, indicating that the listener has changed state. This is the only'
