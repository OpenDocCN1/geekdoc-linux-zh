    # **Monitoring Notes**


    If you intend to write your own SNMP application, the numeric root OID of the
    RMON MIB is 1.3.6.1.2.1.1.16.


    The RMON MIB is divided into the following sections: statistics, history, alarm,
    hosts, hostsTopN, matrix, filter, capture, and event.


    The statistics section provides information regarding the amount of data being
    sent on a particular Ethernet interface, including the number of broadcasts, errors,
    and collisions. You can also see the distribution of packets of different sizes.


    The history group enables you to sample statistics at a specified polling interval
    and sum them over time.


    The alarm and event groups are used to report when configured thresholds are crossed.
    Statistics are periodically checked to see whether a threshold has been crossed.
    After an event is sent, no additional events are sent until the opposite threshold
    has been crossed.


    RMON probes can discover new systems, or hosts, by watching the source and destination
    station addresses in packets passing on a LAN segment. The hosts group stores
    each address seen on the interface. A variety of important statistics are kept
    about each system, such as the number of packets sent and received, error packets
    sent, and broadcasts sent. This can be invaluable information for catching a misbehaving
    system that is dominating the network bandwidth on a LAN segment.'
  merge: -1
  img_proc: true
- pgno: 296
  md: "The hostsTopN group keeps track of the top systems on a segment for a specific\
    \ statistic, such as the number of packets received, error packets sent, or broadcast\
    \ packets sent. The number of systems in the list is configurable.\n\nThe matrix\
    \ group can be used to determine traffic problems. Statistics are kept on the\
    \ network conversations between two addresses. Information collected includes\
    \ the number of packets sent in either direction and the number of error packets.\n\
    \nThe filter and capture groups work together to capture packets sent on a segment.\
    \ A management station can then download the packets.\n\nNote that this MIB also\
    \ supports two traps that can be sent when an alarm entry either rises above or\
    \ falls below a threshold.\n\n# RMON II MIB\n\nRMON II extends the RMON specification\
    \ to include additional network performance information for the transport-, session-,\
    \ presentation-, and application-layer protocols. These network layers are defined\
    \ in Chapter 6.\n\n# MIB Definition\n\nListing A-3 shows the complete specification\
    \ for RMON II, as defined in RFC 2021.\n\nListing A-3  RMON II MIB specification.\n\
    \n```\nmib_2\n   [16] rmon\n      [11] protocolDir\n         [1] protocolDirLastChange\n\
