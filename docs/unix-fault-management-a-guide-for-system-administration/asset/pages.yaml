    a specific network interface on an ATM adapter. This does not stop the ATM adapter,
    so activity on other network interfaces is not impacted.


    # HA ATM


    HA ATM is a product from Hewlett-Packard that protects ATM links in the event
    of a failure. HA ATM is integrated with EMS and MC/ServiceGuard. Local recovery
    is aided through its EMS integration, and remote recovery involves both EMS and
    MC/ServiceGuard.


    The HP ATM adapter enables you to run one Classical IP (CIP) interface and up
    to 32 Emulated LAN (ELAN) interfaces simultaneously. High availability is provided
    only for ATM with LAN emulation.


    HA ATM protects against a single failure in the ATM network. It detects local
    ATM ELAN interface failures and can perform local recovery by switching to another
    local ELAN interface. HA ATM can detect and recover locally from problems with
    the core ATM software, or with the ATM adapter, link, or ATM switch. EMS events
    can be sent when a failure is detected. MC/ServiceGuard is notified via EMS when
    HA ATM is unable to provide local recovery.


    MC/ServiceGuard remote recovery is used when a system failure occurs or the system
    loses all of its adapters, switches, or cables. To process a remote failover,
    MC/ServiceGuard moves all ATM applications defined as packages to the remote system,
    and configures any package IP addresses on the remote system''s ELAN interface
    on an ATM adapter.


    # Monitoring Networking and Transport Protocols


    Networking problems can be difficult to diagnose, because networking involves
    a variety of hardware and software components. The previous section focused on
    the physical cable and'
