- pgno: 137
  md: '# Enterprise SyMON


    Sun Microsystems has an enterprise management product called Enterprise SyMON,
    a management solution that includes monitoring tools for Sun platforms. It can
    be thought of as a scaled-down version of IT/O. SyMON provides an event browser
    and a detailed display of systems and hardware. A graphical view of the physical
    system layout can be shown. SyMON can be used to monitor the health of disk resources
    and to isolate hardware and software faults. It analyzes health information to
    predict potential disk hardware failures. For diagnostics, SyMON can launch the
    SunVTS diagnostic system or view the system log. Performance monitoring capabilities
    are also provided.


    SyMON can be configured to send SNMP traps for events. Only hardware events are
    included, such as disk, memory, or tape failures. However, additional events can
    be generated by placing various rules written in the Tool Command Language (TCL)
    scripting language in a special directory. Recovery actions can be associated
    with an event.


    # Using Diagnostic Tools


    Various support tools provide monitoring of errors and faults, configuration information,
    and troubleshooting for hardware components, including disks.


    # Support Tool Manager


    HP Support Tool Manager (STM) is a set of tools for HP-UX systems that is used
    for verifying and troubleshooting system hardware. These tools provide the ability
    to determine device status, get configuration information, and diagnose hardware
    problems. These tools are available using a GUI or through commands, and have
    the flexibility to be invoked automatically at periodic intervals.


    STM includes the Automatic Configuration Mapper, which provides a graphical view
    of your hardware configuration using color-coded icons that show device status,
    as well as logical relationships, such as the peripherals connected to an I/O
    card. Each icon on the map represents a hardware device. These icons display the
    device type, device identifier, device path, last active tool, and test status
    (from the last active tool). From this view, you can launch the other STM tools.
    Figure 5-7 shows the Automatic Configuration Mapper, which is the main screen
    of STM.


    The Information tool provides product identity information, product description,
    hardware path, vendor name, firmware revision, and error log statistics, including
    read errors, which can be used to trend and anticipate problems. This tool can
    also be used to track configuration changes.


    Several other tools under STM perform varying levels of testing to stress a device
    or determine and diagnose problems:


    +   - **Verifier**: Can be invoked on a particular device to verify quickly that
    the device is connected and functioning properly


    +   - **Exerciser**: Stresses a device to help troubleshoot intermittent problems'
