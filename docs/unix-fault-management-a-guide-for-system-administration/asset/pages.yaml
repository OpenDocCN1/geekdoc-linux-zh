- pgno: 160
  md: '# lanscan


    The *lanscan* command shows the hardware path to each LAN device, the station
    address, link status, network management ID, and link technology being used (for
    example, Ethernet or FDDI). The *station address* is the unique identifier for
    a LAN card and is also referred to as a physical address or Media Access Control
    (MAC) address. You can compare the information from lanscan, as shown in Listing
    6-2, to that provided by ioscan, shown in Listing 6-1. With this additional information,
    you can uniquely identify your LAN card so that you can configure it for the appropriate
    corporate network. Also, if you are using an analyzer to look at network packets
    on a LAN, lanscan will help you to map the station address in the packet to a
    network interface on a system.


    Note that an interface has both a hardware state and a network interface state.
    The hard-ware state corresponds to the configured state of the device, and the
    network interface state cor-responds to the current operational state. In the
    example in Listing 6-2, lan1 has been configured *UP*, but is not operating properly.


    # lanadmin


    The lanadmin command can be used to display or change the station address, Maximum
    Trans-mission Unit (MTU), or speed setting of each configured network interface.
    It can also be used to display or reset the MIB-II network interface statistics.
    The statistics include the interface name, administrative status, operational
    status, number of error packets, and other information. For Ethernet links, lanadmin
    also displays statistics from RFC 1284 (Ethernet-like interface information),
    which can indicate the number of collisions happening on the link.


    Some overlap exists with other commands. For example, the station address is also
    avail-able from lanscan, and the MTU can also be obtained from netstat (discussed
    later).


    lanadmin can be used to reinitialize a LAN card. For example, if networking fails
    during system startup, you may be able to enable networking by using lanadmin
    to reset the LAN card, and then use *ifconfig* (described later) to bring the
    card up with the proper IP address.


    Numerous statistics are available from lanadmin, as shown by using the lanadmin
    menu-driven interface in Listing 6-3. Note that to use the lanadmin command, you
    need to specify the network management ID number of the LAN card, which can be
    obtained from the lanscan command.


    **Listing 6-2** Output from lanscan command showing the list of LAN cards.


    ```

    # lanscan

    Hardware Station    Crd Hardware Net-Interface NM MAC  HP DLPI Mjr

    Path     Address      In# State  Name/Unit State  ID Type  Support Num

    8/16/6   0x080009C3FAYD 0      UP    lan1      UP    4  ETHER Yes   52

    8/20/5/1 0x080009ACC83C 1      UP    lan1      DOWN  5  ETHER Yes   176

    8/20/5/7 0x080009ACD860 2      DOWN  lan2      DOWN  6  ETHER Yes   176

    8/20/5/8 0x080009ACF11E 3      DOWN  lan3      DOWN  7  ETHER Yes   176

    #

    ```'
