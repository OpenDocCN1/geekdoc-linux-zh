    ![](img/eae88b61ada165139a1d9b546a34140b_136_0.png)


    IT/O enables you to define and customize your own monitors and templates. The
    monitor for the root filesystem can be modified for other critical filesystems.
    Or, you can define your own monitors and templates to monitor MIB variables, such
