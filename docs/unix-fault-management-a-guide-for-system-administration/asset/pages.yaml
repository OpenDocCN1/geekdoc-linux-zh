  md: 'hardware and version information, and so forth. OpenView IT/O, discussed later
    in this chapter, provides a MIB Browser that helps you to discover which MIBs
    are available and to see the information being provided by each MIB. The MIB Browser
    tool can check the value of anything contained in a MIB. If you find a MIB that
    contains some useful fields, you can use the MIB Browser to gather that data from
    the target system. The resulting data is displayed in the MIB Browser’s output
    window. By browsing through available MIBs, and by querying values of selected
    MIB fields, you can gather specific information needed to monitor systems and
    troubleshoot problems.


    The SNMP interface provides access to objects stored in various MIBs. On HP-UX
    systems, the HP-UNIX MIB defines various metrics for monitoring disk resources,
    such as filesystem usage. Other vendors, such as Sun, have vendor-specific MIBs
    that provide similar information. Complete MIB definitions are listed in Appendix
    A, “Using Standards.”


    Objects in the File System Table of the HP-UNIX MIB can be monitored to detect
    when filesystem usage reaches a certain threshold, so that you can avoid filesystem
    faults, such as running out of space. Here is a list of the objects available
    for each entry in the File System Table:


    +   - fileSystemName

    - fileSystemBlocks

    - fileSystemBfree (free blocks)

    - fileSystemBavail (free blocks available to non-supereusers)

    - fileSystemBsize

    - fileSystemFiles

    - fileSystemFree

    - fileSystemDir


    Note that a table entry exists for each mounted filesystem.


