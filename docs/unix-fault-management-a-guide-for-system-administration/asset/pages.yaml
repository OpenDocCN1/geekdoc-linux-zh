- pgno: 179
  md: '# ## NetMetrix for NFS


    NetMetrix provides an extension for monitoring the NFS service. Monitors are used
    to capture the network traffic, after which NFS service performance can be calculated.
    Graphs can show information such as the load, response time, number of retransmissions,
    and number of errors.


    # ## HA NFS


    An HA NFS toolkit is available as an add-on to the MC/ServiceGuard product. NFS
    server failures can be detected and reported to MC/ServiceGuard, with NFS service
    restarted on another node. NFS locks are not maintained during the failover.


    # ## Monitoring Remote Connectivity


    rlogin and telnet provide remote login capability so that clients can access the
    UNIX systems. For rlogin, the application started by inetd is called logind, and
    for telnet, the daemon is telnetd. The who command can show you the users that
    are logged into a system. Use ps –f | grep logind to see how many users are remotely
    connected, and for how long they have been connected.


    # ## Monitoring Web Servers


    Monitoring Internet services is a new phenomenon, and tools to monitor Web servers
    are just beginning to emerge. Netscape’s SuiteSpot server software is being bundled
    with HP OpenView technology for Internet monitoring and fault management for high-end,
    enterprise-level HP-UX users.


    The HP OpenView Internet Service Manager provides tools to manage Web resource
    utilization and performance. Monitoring is done from an IT/O management station.
    Management is provided for the following UNIX-based Internet services: Netscape
    Enterprise Server, Netscape Fasttrack Server, Netscape News, Netscape Proxy Server,
    Netscape Mail, NCSA Web Server, and Apache Web Server. Internet Service Manager
    can also identify broken HTML links.


    CompuWare also has some tools, such as EcoScope and Single View, which can be
    used to monitor Web servers. Network traffic can be analyzed at the protocol level
    to capture HTTP packets. Single View can then report on the traffic load, with
    specialized Internet utilization reports for Web (HTTP), secure Web (HTTPS), and
    other protocols.


    # ## Monitoring Network Hosts


    On a shared network medium, monitoring only the client and server systems is insufficient.
    Other network devices may be critical for network connectivity. Name servers were
    previously discussed; if the name service is unavailable, your application may
    be unable to connect to the server, because it can’t determine the server’s IP
    address. The router responsible for transferring your packets to the server’s
    LAN segment may also be down.


    In addition to network faults, performance problems could occur. Congestion on
    a shared LAN can prevent your data from being transmitted. Performance monitoring
    tools are discussed in the next section.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Other network devices, or hosts, may also be interesting to monitor, such as
    a network printer. This section discusses how you can ensure the correct operation
    of these additional network hosts.


    # Network Node Manager


    As described earlier in this chapter, graphical network status monitors, such
    as Network Node Manager, can discover any IP-addressable device accessible from
    the management station, including routers, switches, hubs, and network printers.
    If you are trying to isolate a network problem, you may want to examine the entire
    path between the client and server. NNM is one tool that can help you do this.
    By drilling down from the global network submap, you can examine individual network
    segments.


    Figure 6-8 shows the devices on one LAN segment. The devices include NT and HP-UX
    computers, as well as routers and printers. Colors indicate the status of each
    device, and are based on NNM’s ability to poll the system and get a response.


    Resolving a connectivity problem may involve navigating through multiple network
    segments. You may have multiple routers in your environment, in which case you
    need to know the routes that your packets should be taking. This requires that
    you understand your system’s routing tables.


    # netstat


    Knowing the network topology is important for resolving communication problems.
    If hosts can communicate successfully on each side of a gateway or repeater, but
    not to systems on the other side, this most likely indicates a problem with the
    forwarding device.


    **Figure 6-8** NNM topology.


    ![](img/eae88b61ada165139a1d9b546a34140b_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The netstat -rn command can be used to show your current configuration of routes
    from the local system to remote networks, as shown in Listing 6-20. If you are
    experiencing long delays in packet transmission to remote networks, you may want
    to examine the routing algorithms being used on the network. Many networks use
    routing algorithms that minimize the number of hops that a packet must take, because
    that improves both the delay and amount of network bandwidth used, which in turn
    can boost network throughput.


    The netstat -rs command can show statistics related to the system’s use of remote
    routes, as shown in Listing 6-21. If a bad route is indicated, you should check
    whether your router is behaving properly.


    If connectivity between two systems is a problem, check whether or not each system
    can reach other networks. The routing table may not have the right route to all
    the LANs. You may want to compare this configuration to the routing tables of
    a working system. If the routing information is wrong, you can use the route command
    to add and delete routing table entries.


    # Interconnect & Router Manager


    Routers and bridges are the network devices that connect your LAN segments together.
    It is critical that these devices continue to work. You can use some of the same
    tools to monitor a router


