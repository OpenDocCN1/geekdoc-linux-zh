    # PLATINUM DBVision


    PLATINUM Technology, Inc. provides the ProVision suite of products for monitoring
    the performance of servers, databases, applications, and networks. ProVision consists
    of four products:


    +   - **ServerVision**: Provides performance information about the computer system,
    including the load average, number of current users, disk rates, most active CPU
    process, and CPU and disk usage per process.


    +   - **DBVision**: PLATINUM''s product for database monitoring, it can monitor
    Oracle, Sybase, Informix, and DB2 databases. A Motif GUI and a Windows NT GUI
    are supported. The emphasis is on resource and performance monitoring. DBVision
    can detect problems such as running out of available tablespace, high CPU utilization,
    low swap space, processes waiting for locks, and runaway processes. The product
    can also be used to see which user is tying up system resources.


    +   - **TransTracker**: A pre-deployment tool for measuring the system, database,
