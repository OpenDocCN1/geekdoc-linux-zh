    \nMany tools already exist for accessing this instrumentation. Several vendors\
    \ offer browsers and monitoring capabilities that use a common interface for accessing\
    \ instrumented objects from"
  merge: -1
  img_proc: true
- pgno: 201
  md: 'different hardware platforms and operating systems. For example, the common
    enterprise management frameworks, such as HP Network Node Manager (NNM), include
    a MIB Browser tool to access MIB data. They may also include tools that can be
    used to monitor MIB data on remote systems from the enterprise management platform.
    Toolkits also exist that provide an interface in which users can write their own
    tools to monitor or track this information. Other toolkits enable users to create
    their own instrumentation.


    # SNMP


    A MIB is a standard way of representing information of a certain category. For
    example, MIB-II provides useful information about a system, such as the number
    of active TCP connections, system hardware and version information, and so forth.
    OpenView IT/O, discussed later in this chapter, provides a MIB Browser that helps
    you to discover which MIBs are available and to see the information being provided
    by each MIB. With the MIB Browser tool, you can check the value of anything contained
    in a MIB. If you find a MIB that contains some useful fields, you can use the
    MIB Browser to gather that data from the target system. The resulting data is
    displayed onscreen in the MIB Browser’s output window. By browsing through available
    MIBs and querying values of selected MIB fields, you can gather specific information
    needed to monitor systems and troubleshoot problems.


    The SNMP interface provides access to objects stored in various MIBs. MIB-II is
    a standard MIB that has been implemented on most Unix systems. On HP-UX systems,
    the HP-UNIX MIB defines various metrics for monitoring system resources. Other
    vendors, such as Sun, have vendor-specific MIBs that provide similar information.
    You can find complete MIB definitions in Appendix A.


    The HP-UNIX MIB contains information about each of the processes running on the
    system. Useful information includes the PID, CPU utilization, priority, and resident
    set size. If numerous processes are active on a system, searching through the
    process table in the MIB may be difficult. If you want to find information only
    for a specific process, you may prefer to write a small program that uses the
    psstat interface, covered later in this section, which provides the same information
    as the MIB process table, as well as additional fields. However, the MIB is a
    useful source for collecting data about multiple processes, especially if you
    do not want to write your own application.


    If you are using MC/ServiceGuard to protect your application, then you may also
    want to use the HP MC/ServiceGuard MIB, which contains information about each
    configured MC/ServiceGuard application, or package. Information about a package
    includes the name, description, current status, system on which it is currently
    running, processes making up the package, and alternate nodes for the package.
    Note that the MIB does not show any/EMS resource dependencies for a package. You
    have to use the MC/ServiceGuard command crviewcl -v to obtain this additional
    information.


    The Network Services MIB and Relational Database Management System MIB are used
    for database applications. From these MIBs, you can learn the database version,
    database status,'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'length of time the application has been running, and number of current users.
    Some resource and performance information is also available.


    # DM I


    System resource information can also be retrieved by using DMI, which is another
    standard for storing and accessing management information. Management information
    is represented in a text file in the MIF. It is divided into components, each
    of which has a Service Provider (SP) that is responsible for providing DMI information
    to the management applications that request it.


    Several system platforms, including HP-UX, provide instrumentation for the System
    MIF and Software MIF. Appendix A contains a complete listing of these MIFs.


    Similar to MIB-II, the System MIF can be used to get generic system information
    (such as how long it has been running) and system contact information. It includes
    the system name, boot time, contact information, uptime, number of users, and
    some information about the filesystem and disks.


    The Software MIF provides information about the software products and product
    bundles installed on a system, and can be a useful tool after the discovery of
    a problem with an application. By using a MIF Browser, you can examine the Software
    MIF to see whether a problem might have been caused by a bad patch or modified
    file. The MIF contains revision information, including creation and modification
    times, for each product. Version information can be checked to see whether a compatibility
    problem exists. Finally, the product’s vendor information is provided, in case
    you need to contact the product’s support personnel.


    Vendors such as Hewlett-Packard are working to provide enterprise-wide repositories
    of software configuration information. Tools are needed to compare application
    versions on different systems and update systems to the same revision level.


    # pstat


    Occasionally, you may want to write your own application program to get access
    to information about specific processes. This interface is referred to as *pstat*.
    Your program can generate output for only the interesting processes, which can
    be much easier than wading through *top* or *ps* output looking for important
    information.


    Listings *7-2* and *7-3*, respectively, show a program that obtains *pstat* statistics
    and the output from running the program. The program displays information for
    the process(es) matching the names that you enter. The *pstat* interface can also
    show overall system information, as demonstrated in Listing *7-2*.


    For the example in Listing *7-3*, the concern is that an application named *memhog*
    is using too much memory, so the program is being used to check *memhog*’s memory
    usage at various times, and to track the overall system load. This can be more
    convenient than running other tools, such as *top* or *GlancePlus*, and sifting
    through the output.'
  merge: -1
  img_proc: true
