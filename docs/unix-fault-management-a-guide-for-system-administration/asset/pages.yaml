    # ### Oracle Private MIBs


    Oracle also provides several non-standard database MIBs for managing its RDBMS.
    Oracle supports a Private Database MIB for Oracle7 and later servers, an OEM MIB,
    and MIBs for the Oracle Network Listener, Oracle Multiprotocol Interchange, and
    Oracle Names components. The OEM intelligent agent can provide direct access to
    these database MIB variables.


    Oracle’s Private Database MIB includes several useful metrics for performance
    monitoring. Here are some of the more important variables in this MIB:


    +   - Number of sort requests to disk

    - Number of sort requests to memory

    - Number of user calls

    - Number of consistent gets

    - Number of block gets

    - Number of physical reads

    - Number of user commits

    - Number of redo log space requests'
