- pgno: 18
  md: '# Analyzing the Role of System Operators


    System operators are responsible for maintaining the integrity and availability
    of the computer systems in a company''s data center. An operator''s responsibilities
    can span a wide range of tasks. Most spend the majority of their time troubleshooting
    and resolving problems reported by users. Other primary tasks are system health
    monitoring, performance monitoring, and backing up the system. Periodically, the
    operator is asked to perform additional tasks such as upgrading the operating
    system and applications, restoring files, installing patches, or performing system
    maintenance. It is not unusual for an operator to have more than 100 systems to
    maintain in the environment.


    Larger organizations will have a number of system operators. On average, there
    is approximately one operator per ten UNIX servers. System management responsibilities
    may be segmented by region, by application, by problem area (performance, backup,
    and so forth), or by time zone. In some situations, an operator may need to pass
    responsibility for a problem to an operator in one of the company''s data centers
    in another country. System, application, database, and network management may
    involve different people in different departments. As part of troubleshooting,
    an operator may ask the advice of a more experienced system administrator. Large
    companies may have many experts, including database administrators and network
    administrators, who are specialized in certain areas.


    This book should be a useful tool for simplifying the operator''s primary task
    of troubleshooting user problems. Troubleshooting involves checking the current
    health of the system and researching recent events and faults that may be related.
    The goal is to find the root cause of a problem. Many system outages are caused
    by operator errors made when trying to fix problems. In fact, studies by Hewlett-Packard
    and industry consultants such as the Gartner Group have indicated that operator
    error is the most common cause of unplanned downtime. The following chapters are
    intended to simplify the monitoring and recovery tasks.


    The monitoring chapters are categorized by system component, and are self-contained,
    so you should be able to resolve a problem without leafing back and forth between
    chapters. However, because of the huge number of unique problem situations, it
    is impossible to list solutions to all pos-'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'sible problems that you may encounter. Instead, this book tries to explain
    a representative set of available monitoring tools, and how each can be used to
    solve problems. You should read the recovery sections at the end of each chapter
    to get an idea of general techniques for problem resolution and to get a feeling
    for when to apply each tool.


    # Trends in System Operations


    With rapidly changing computer technology and the growth of the Internet, the
    duties of the system operator are becoming increasingly complex. New hardware
    platforms, new software products, and a larger number of systems and networks
    to manage make it difficult for system operators to rely on manual tools to do
    their jobs. Automation is clearly needed. For many tasks, the operator is already
    relying on software automation. For example, system backups used to be done with
    primitive commands; now they are sophisticated software packages such as Hewlett-Packard’s
    OmniBack II and Legato’s NetWorker that are commonly used to simplify and automate
    the task of backing up a system or set of systems.


    A number of trends in the computer industry are making system monitoring much
    more critical. For some companies, corporate data must be available 24 hours a
    day, 7 days a week, and the penalty of downtime can be measured in lost revenue.
    In these environments, operators must not only detect current problems, but must
    also be able to predict when failures will occur. This book describes some of
    the tools that can identify trends or events that could lead to downtime.


    Another industry trend is that Information Technology (IT) departments are now
    being measured on the percentage of time that systems are up, the performance
    of the systems, and how quickly operators can resolve user problems. Management
    software needs to indicate not only what a problem is, but also how to fix it.
    System management is now the largest contributor to the total cost of ownership
    of UNIX servers.


    While customer demands on the operations staff are increasing at a rapid rate,
    the evolution of management tools is struggling to keep pace. Tools that once
    were text-based and user-initiated are now graphical and event-driven. An operator
    can watch multiple systems from a single, centralized console. Systems can be
    shown as icons with colors showing status. This gives the operator a quick overview
    of the state of the data center. An increasing number of problems can be detected
    and reported to the console.


    The problem-reporting tools, however, are overwhelming the typical operator. Some
    help is provided by enterprise management products, which are introduced in Chapter
    3, “Using Monitoring Frameworks,” and then referenced throughout the rest of the
    book. If one component shared by many systems fails, the result can be a storm
    of events at the management station. In addition, a component failure can have
    a cascading effect as it causes other components or products to fail, too. Again,
    a large number of events arrive at the system or centralized console. An operator
    needs to be able to wade through these events to find the root causes. Chapter
    9, “Enterprise Management,” describes some of the emerging technologies to deal
    with this problem.


    Before describing the fault management tools, we must first define what we mean
    by “fault management,” which we do in the next chapter. We also give you descriptions
    of the types of events you need to be prepared to receive to adequately protect
    your UNIX servers.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # Enumerating Possible Events


    Fault management is a key part of system management, and it is critical to maintaining
    the availability of applications in your environment. This chapter defines fault
    management, and lists the types of faults you may detect on your servers.


    # ## Defining Fault Management


    Detecting and reporting unusual or unacceptable behavior is generally referred
    to as fault management (or event management). A fault is any behavior different
    from specified or expected behavior, and generally is used to refer to the complete
    failure of a hardware component or software product.


    Fault conditions can be characterized in many different ways. Faults can be caused
    by hardware component failures in the environment, or by the failure of software
    running on systems within the environment. A computer is dependent on more than
    the CPU and memory; for example, power supplies and fans can also fail. Loss of
    power in the data center, natural disasters, and the failure of air conditioning
    units are just a few examples of how environmental problems can cause systems
    to fail.


    Fault isolation is something that hardware and software vendors try to achieve.
    This means that a fault within the software or hardware of a system should not
    affect the correct operation of other components in that system or other systems
    that the system is interacting with on the network. When fault isolation is not
    achieved, operators have a much more difficult time finding the root cause of
    problems when they occur.


    An event is a more general term and includes faults as well as system anomalies,
    such as performance problems. An event includes anything that happens in the computing
    environment that may be of interest to someone. Events may be sent automatically,
    or a user (operator) may ask to be informed of events. The start of a backup,
    for example, may be an interesting event worth noting.


    A variety of events can occur in a computer environment that are of interest to
    a system administrator or computer operator. Many involve failure conditions in
    the environment, but other important types of events also occur. In a mission-critical
    environment, a configuration change of any kind to the hardware or software may
    need to be recorded. For example, an'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'administrator may want to record when a software patch was installed on a system.
    This information can be used later when troubleshooting a problem on the system.
    In addition, the CPU utilization reaching a certain predefined threshold on a
    critical server may also be considered a significant event. Automated monitoring
    tools can detect other activities, such as an attempt to breach system security.
    Multiple failed "root" login attempts could be the sign of a security problem.


    Events can be received in a variety of ways. Hewlett-Packard OpenView, a suite
    of enterprise management products, provides sophisticated event management capabilities,
    allowing an event message to be stored in a log, while optionally causing a graphical
    icon associated with the event to change color based on a status change (see Chapter
    4). Recovery or troubleshooting actions can be triggered automatically, or trouble
    tickets can be filed so that the appropriate person can be notified of the problem
    and a problem history can be maintained.


    Fault management includes the process of detecting, reporting, and reacting to
    the faults or events taking place in the computing environment. Chapter 3 describes
    both the types of notification methods available for reporting events and the
    enterprise management tools that can receive events. The rest of this chapter
    describes the different types of events that can be detected. Given the list of
    possible events, you can choose the level of monitoring that is appropriate for
    your environment. Subsequent chapters introduce the tools that detect the various
    events.


    # Event Categories


    To effectively manage events related to a UNIX server, you first need to understand
    the types of events that may occur. This chapter gives examples of a wide variety
    of events that may occur, and provides one possible grouping of those event categories.
    By understanding the set of possible events that may occur, you will understand
    what to look for when troubleshooting a problem.


    One way to categorize events is by the affected software or hardware component.
    These categories include: system, disk, network, application, and database events.
    In fact, we used this approach when determining the structure of this book. Each
    category of events is discussed exclusively in its respective chapter later in
    the book. For example, system events are described in Chapter 4.


    Chapters 4 through 8 group events into the following additional categories:


    +   - Configuration

    - Faults

    - Resource and performance management

    - Security intrusions


    The following sections describe each category, in turn, in more detail.

    Environmental changes, such as power outages, are also important, but are only
    briefly touched upon in this book and thus are described in overview at the end
    of this chapter.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Configuration Events


    You should know about the hardware and software configuration changes taking place
    on your servers. A software package installed just days before a failure may be
    a prime suspect. Configuration changes can be complex, and administrative tools
    often do not provide adequate assistance. Operator error is a common source of
    unplanned downtime, so it is important to keep a record of the configuration changes,
    as well as the time each change is made. This log can be examined later, in the
    event of a problem, to provide an audit trail for backing out of the changes.
    This can be especially important when multiple operators make changes on the same
    systems.


    Configuration changes encompass a broad spectrum, and they may involve the application
    or database, operating system, or system hardware or peripherals.


    # Application Changes


    Application changes include changing software parameters, such as the maximum
    number of users allowed to use a product. Restructuring a database is another
    example. Keeping a history of the changes made to application parameters can be
    difficult, and probably is done most commonly through revision comments in the
    configuration files themselves. Patches or bug fixes to applications are easier
    to track because the software includes a version number, which should be updated
    by the software vendor whenever new versions are released. Numerous tools are
    now available to track the software versions installed on your system. You should
    run one of these tools periodically and store the results, to maintain an appropriate
    change history.


    Installing a new application on the server is a key event that should be recorded.
    You should use this application in a test environment before moving it to production.
    However, the application still might not behave well. You may want to use this
    time as a data point when looking at performance data, to see the effect of the
    new application.


    # Operating System Changes


    Operating system changes are usually easier to track because they often require
    a system reboot before they take effect. Enterprise management products, such
    as HP OpenView, automatically record system reboots as events in an event log.
    Operating system configuration changes include changes to kernel parameters, patches,
    and operating system upgrades. All of these changes should be recorded.


    # Hardware Changes


    Hardware configuration changes include the addition of a new processor or a new
    disk device. You may also want to remove or replace a component that is not behaving
    properly. Other hardware configuration changes include changing the firmware versions
    or patching the driver software.


    Because these configuration changes often involve a system reboot, you should
    plan for downtime and schedule changes during a period when the systems are not
    being used. Planned downtime includes downtime required for scheduled maintenance,
    such as a software upgrade, and for configuration changes, such as adding disks,
    restructuring a database, or moving clients to different systems for load-balancing
    purposes.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The best way to update system hardware or software is to do it online. High
    availability cluster products, such as Hewlett-Packard’s MC/ServiceGuard, support
    rolling hardware and OS upgrades and enable you to move applications to another
    system until the upgrade is complete. Although cluster products can help you automate
    the upgrade process, it is still beneficial to have additional online replacement
    capabilities, to avoid the service interruptions associated with a rolling upgrade.
    System vendors are now making it easier to modify hardware components without
    requiring a system reboot. Both Sun and Hewlett-Packard have released these capabilities
    for their UNIX servers, and both will be adding more capabilities in this area.
    Before the introduction of online replacement, you could track hardware configuration
    changes by monitoring system reboots and then just track the current configuration.
    Now you need to check for configuration changes more frequently.


    The configuration change history should be stored at a central management station
    and should be backed up regularly. Storing it at a central site enables you to
    access the information even when the server has failed or is unavailable, which
    can be important when trying to recover from a system failure.


    # **Faults**


    A *fault* broadly refers to any unexpected behavior occurring in the computing
    environment. A fault may report the failure of a hardware or software component,
    such as a database failure, or it may be a warning of a condition that could lead
    to a failure, such as a series of disk errors.


    Faults are the most common events sent to an event management product, partly
    by process of elimination. Configuration changes, security intrusions, and environmental
    alerts are difficult to capture as events. Performance monitoring is often done
    in reaction to a user complaint, because it is difficult to configure the correct
    performance threshold conditions that should lead to events.


    Faults can occur on the server itself, on a peripheral attached to the server,
    or on some component external to the system.


    # #### *Failure of a System Hardware or Software Component*


    System hardware components include the CPU, memory, and I/O cards. As business
    servers have become more critical, hardware vendors have improved their designs
    to make these components more reliable. High availability solutions provide additional
    protection and can prevent some problems from causing a system failure.


    Despite these improvements, you still need to be prepared for hardware faults.
    Although the reliability of each component is improving, many more components
    exist to manage. A company could have 100 or more servers, each with multiple
    processors, many disk arrays, tape libraries, and so forth. High availability
    systems typically include redundant components, such as mirrored disks, extra
    power supplies, or extra cooling fans. Failures need to be reported in a high
    availability environment so that a component can be fixed before a double failure
    occurs.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Hardware failure indications should report specific information about the failed
    component, such as the serial number or hardware path. This can help network support
    personnel locate the failed component in the server. A lower severity may be used
    when redundant components fail, to indicate that the problem is important but
    not necessarily urgent to fix. Hardware monitoring is discussed in Chapters 4
    and 5.


    Hardware failures used to cause the system to fail, but servers are more resilient
    today. Servers can now continue to run, often in a crippled state, after a hardware
    failure. For example, a server can detect bad memory pages and deallocate them,
    but this leaves less memory available for the applications. The fact that a component
    failure may not be obvious again points out the importance of continual monitoring
    of the system. Repairs can then be made during a planned downtime period.


    You also need to monitor the status of the server software. The software can be
    divided into the following categories:


    +   - Operating system or firmware

    - System vendor applications or middleware

    - Database and enterprise resource planning applications

    - User applications


    If the operating system fails, you will see a failure (panic) message on the server
    console. The server status will be shown as “DOWN” to an enterprise management
    product, such as HP OpenView. You need to reboot the system and look at system
    log files or core files to diagnose the problem.


    The failure of a key software application may also be a critical event to a system
    operator. Typically, only one key application is configured per UNIX server, so
    the failure of the application is essentially equivalent to a failure of the server.
    If you know the processes making up the application, you can periodically check
    the status of the processes by using UNIX commands. Some monitoring tools can
    automatically notify you of the failure of an important process.


    Some vendors provide high availability software to help protect your server. This
    software also needs to be monitored to ensure that it is working properly. Other
    important applications include database applications and enterprise resource planning
    applications. Later chapters describe some of the sophisticated monitoring products
    that are available for these applications. Management applications, such as a
    backup software application, also need to be monitored. Errors encountered during
    a backup should be reported, because such errors indicate that critical data is
    not being adequately protected.


    The easiest application failure to detect is the failure of an application process.
    An application can also get into a process loop or deadlock situation. Although
    the effect is the same to the end-user, the application is unusable; this is a
    much more difficult situation to detect. You are unlikely to see these situations
    reported as external events, although you may receive some external indications,
    such as timeout errors, when trying to use a service. In general, to detect these
    types of problems, you need to measure the performance and resource usage, and
    compare it to baselines.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Failure of a Peripheral


    In addition to the internal computer components, other important components are
    attached to the system. These peripheral devices include tape drives, disk devices,
    printers, and CD-ROM drives.


    A variety of errors can affect tape drives. Tape devices should be monitored proactively,
    because backups normally have a small window of time to complete. Detecting failures
    and recovering before the backup window starts can help to ensure that the backup
    will succeed. You should also watch for mount requests during the backup process,
    to keep the backup application from being blocked for too long.


    Disk errors and failures are an increasing problem, because the amount of stored
    information continues to grow. Many high availability environments now use RAID
    devices, which provide data redundancy by spreading data across an array of disks.
    Data can thus be reconstructed from surviving disks in the event of a disk failure.
    The arrays can even be repaired online. In addition to monitoring for disk failures,
    you may want to monitor the logical volume status, physical volume status, I/O
    errors, and the loss of a mirrored copy of data. Each of these types of failure
    conditions can be detected with monitoring software.


    Various printer events can be interesting to monitor. For example, the printer
    can jam, fail, or be set offline. Also, the print spooler can fail and the queue
    can be full. Printers require vigilant monitoring because they can often get into
    a state in which they are not performing properly. It is important to detect problems
    and fix them quickly to avoid receiving user complaints.


    CD-ROM drives are perhaps the least interesting of the peripheral devices to monitor.
    You may be interested in knowing when a drive is mounted or unmounted, but receiving
    only drive failure notifications is usually sufficient.


    # Failure or Loss of an External Service


    Hardware or software failures are not the only critical events that can occur
    on your system. Monitoring your corporate networks is critical as well. With the
    movement away from mainframes to distributed client/server environments, the dependency
    on local area networks (LANs) and wide area networks (WANs) is increasing. If
    the proper precautions are not taken in designing the company data center, the
    loss of a single network could cause denial of service to all clients trying to
    access critical server machines. You also need to understand the purpose of each
    of your networks so that you know the consequences of a failure. For example,
    in a high availability environment, you have networks that are used for sending
    data between systems, networks dedicated for high availability status checking,
    and backup networks.


    You can check a variety of networking faults and statistics to further analyze
    the status of your networks. You should watch for connectivity problems and “Node
    Unreachable” errors. You can also check Ethernet collision rates and use performance
    tools to check network bandwidth utilization.


    A UNIX server is dependent on external services, such as network services. For
    example, a server may be active, but the Domain Name System (DNS) server for its
    domain may be down, preventing clients from connecting successfully. An e-mail
    server is another example of a machine in this category.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Similarly, hardware external to the managed system may also be important. The
    failure of a network router can prevent any data from getting to the managed system.


    Here is a sampling of some of the important external services that you need to
    monitor in your environment:


    +   - Name servers, such as DNS and Network Information Service servers

    - File servers

    - E-mail server

    - Directory service, such as Novell Directory Service

    - Boot server

    - Software license server

    - Web proxy server

    - News server


    You can set up monitoring of these services if you know the processes that make
    up the application. Process failures can be detected, as mentioned earlier. More
    proactive approaches involve actually trying to use the service to see whether
    it is working properly. Many other conditions are equally important, but are much
    more difficult to detect, such as an expired software license, which could cause
    you unexpectedly to be denied access to a key application.


    Redundancy of these network services is a key to maintaining the availability
    of your server. However, this alone is not sufficient. Configuration problems
    and issues such as software licenses can still prevent the use of an important
    service.


    # ## Resource and Performance Events


    In addition to looking for failure events, monitoring resource usage and performance
    are important. If users are unable to access critical system resources, you might
    as well consider the system down. The system operator needs to be notified when
    resource utilization reaches certain thresholds, so that measures can be taken
    to avert a crisis. The network, CPU, process table, filesystem, and memory are
    examples of critical system resources that should be monitored.


    High utilization alone is not sufficient to indicate a problem. It could just
    indicate that you are getting optimal use of your server. You also need to determine
    whether system bottlenecks exist and, if so, which applications are being delayed.


    This book distinguishes between resource usage and performance. Particular types
    of system resources have limitations. For example, you can run out of filesystem
    space, swap space, processes in the process table, files in the file table, system
    semaphores, or shared memory. You monitor resource usage so that you know when
    the system usage is approaching these configured limits. Performance describes
    the balance between CPU, memory, and I/O usage, and the relative usage of different
    applications. You want to avoid CPU, memory, and I/O bottlenecks and also ensure
    that high-priority applications are not blocked behind low-priority workloads.
    Application response time and throughput are also important to track, because
    those are the performance measures most visible to the users of an application.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'To monitor resource usage or performance, you generally watch for threshold
    conditions rather than failure events. For example, to watch for CPU bottlenecks,
    you may enable an event to be sent whenever the CPU utilization exceeds 85 percent
    and the run queue has more than three processes. You may need to study a system
    for some time to know the appropriate threshold to monitor.


    As previously shown, not all the important components are on the server. Printer
    queues can fill up, tapes can be full, and networks can become overloaded. An
    overloaded network can prevent access to the server.


    Each of these events can be monitored by setting up the appropriate thresholds.
    Tools are available that can provide this information in real time, or give you
    historical information for identifying trends.


    # Security Intrusions


    You also need to monitor suspicious activity. Threats to a data center may come
    internally or externally and may be the result of intentional or unintentional
    misuse. As an administrator, you want to ensure that system resources are available
    for their intended purposes.


    The following events can be useful for an administrator to audit on a business
    system to prevent misuse of the server:


    +   * Successful and unsuccessful login and logout events

    * Granting of additional privileges to individual users

    * Modifications to system configuration files or system libraries

    * Administrative actions (such as user adds, host changes, and password changes)

    * System-level events (such as reboots and software or hardware changes)


    By monitoring failed login attempts, especially attempts to log in as superuser,
    you can potentially identify when someone is trying to guess a password to gain
    unauthorized access to the system. An intruder may modify existing configuration
    files to give himself or herself special privileges, so it is important to have
    a detailed change history for these files. After successfully logging in to the
    system, an intruder can reconfigure or damage system components, so you need to
    keep a history of system changes to be able to recover successfully later.


    You can never be completely sure that your system is adequately protected, so
    you must monitor your system constantly and keep system backup tapes stored safely
    offline.


    # Environmental Changes


    Environmental changes can also affect the availability of your servers. The following
    are a few examples of environmental events or changes:


    +   * Loss of an air conditioning unit causes a sudden rise in temperature

    * Natural disasters, such as fire, floods, or earthquakes, cause system downtime'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - Loss of power to the data center

    - Sabotage leading to damaged servers


    Power outages are a major source of failure among companies who do not have emergency
    backup power. Data from a 1995 study by the National Power Lab indicates that
    at least once a day, every computer room in the U.S. experiences some problem
    with the building’s power source, typically spikes, surges, or outages.


    One solution to power problems is to use uninterruptible power supplies (UPSS).
    A UPS allows for graceful shutdown of the system after a loss of power. Batteries
    can keep systems up for a short amount of time, until diesel generators are activated.
    Systems can also recover transparently from failures of power supplies and fans
    if redundant components are used.


    Many large corporations are starting to include a disaster recovery plan as part
    of their computer maintenance strategy. Most at least have a policy on how to
    recover from backup tapes after a disaster. Companies for whom downtime equates
    to huge sums of lost revenue are now looking at standby data centers that are
    ready to take over in the event of a catastrophic failure. Hewlett-Packard’s MetroCluster
    product is one disaster recovery product available to those customers.


    As shown in Figure 2-1, this book covers monitoring for events in the system,
    particularly those concerning the disks, network, databases, and applications.
    A fault or critical event in any of these areas could render mission-critical
    applications unusable.


    # **Figure 2-1**  Components of the application stack.


    ![](img/eae88b61ada165139a1d9b546a34140b_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # Using Monitoring Frameworks


    Chapter 2 focused on the set of possible events that can occur on UNIX systems.
    The remaining chapters of this book describe the tools available to monitor these
    events, with tools for different components such as systems, disks, or networks;
    each discussed in a separate chapter. This chapter focuses on monitoring frameworks,
    which can be used to monitor many different components and systems through a common
    interface.


    Some companies monitor systems simply by checking the size of log files every
    day, such as the system log file. If the file is bigger than a certain size, then
    something unusual has happened and the operator can investigate further by looking
    at the specific file contents. The problem is that this can be very labor-intensive.
    A lot of duplicate messages may exist, making it difficult to analyze and fix
    each individual problem. Also, this technique may not help to determine the root
    cause of the problem. Lastly, although each logged event may have a severity associated
    with it, prioritizing the investigation of numerous logged messages may be difficult.


    Operators spend a great deal of time watching the system consoles. Small data
    centers might manage from a Microsoft Windows computer, with scripts executed
    periodically (such as daily) to check resource usage and the availability of the
    computer systems. System failures are detected by the loss of a window on the
    console, or by complaints from users. Larger data centers might manage from a
    workstation or server running monitoring software such as HP IT/Operations, Computer
    Associates’ Unicenter The Next Generation (TNG), or IBM’s Tivoli Management Environment.
    These products can show the status of many systems graphically on a single screen.


    Some comprehensive monitoring products can be used to monitor multiple components,
    and often provide developer’s kits so that you can add additional monitors. These
    products are referred to as *monitoring frameworks*. If a product has additional
    capabilities to help deploy it over many systems, it is referred to as an *enterprise
    management framework*. A data center is unlikely to be using more than one enterprise
    management framework, due to the cost, complexity, and time required to learn
    a second framework.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Customers are recognizing the need for management tools, and enterprise management
    framework providers — such as Hewlett-Packard, with its IT/Operations (IT/O),
    and Computer Associates, with its Unicenter TNG — are feeling pressured to provide
    low-cost alternatives. Both HP and CA have announced intentions to bundle low-cost
    versions of their software with HP-UX servers. Enterprise SyMON is a low-cost
    management station available on Sun systems, but because it currently lacks a
    developer’s kit, it is not a true monitoring framework.


    According to a recent Network Computing Review of enterprise frameworks, the products
    “...are as complex as the problems they are meant to solve.” Monitoring frameworks
    can be difficult to set up and are very expensive, but the benefit is that you
    can monitor heterogeneous components and systems through a common interface.


    This chapter describes some of the frameworks available for UNIX fault management.
    It identifies some of the monitoring capabilities provided or available with each
    framework. Hopefully, these descriptions will help you to determine which framework,
    if any, is best for your environment.


    You may need to use multiple monitoring frameworks in your environment. Chapter
    9 briefly describes how to integrate different combinations of these tools.


    # Distinguishing Monitoring Frameworks


    We have selected a variety of frameworks to discuss in this chapter. Each has
    different strengths and weaknesses. Describing all the available products would
    be difficult, but this chapter should give you insight into the capabilities you
    should expect from any product that you choose to evaluate. This chapter is meant
    to give you a very high-level overview of features; later chapters go into more
    detail on product differences.


    For each product, we describe its breadth of monitored components, general monitoring
    features and capabilities, ease of setup, approach to extensibility (developer’s
    kits), notification flexibility, and diagnostic capability. These attributes are
    generally described in this opening section.


    # Monitored Components


    Each product’s breadth of coverage is described in this chapter. You should ensure
    that all the components that you need to monitor are available before you select
    a framework. Some products, such as CA’s Unicenter TNG, have a smaller set of
    metrics available than other products, such as BMC PATROL with its set of Knowledge
    Modules (KMs).


    # Monitoring Features


    This section on monitoring features describes the framework’s general monitoring
    capabilities, making special note of any unusual capabilities, such as IT/O’s
    event-correlation capability.


    # Monitor Discovery and Configuration


    The first step toward actually using a monitoring framework is to determine its
    set of available resource monitors. The methods of doing this vary depending on
    the framework being used.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'You can obtain resource monitors in a variety of ways. Some are freely available
    when you purchase a computer, while others are included with the enterprise framework.
    Monitors can also be sold as add-ons to the framework. Another possibility is
    that the monitor for a product is included with the product itself. For example,
    Hewlett-Packard includes Event Monitoring Service monitors with many of its networking
    products.


    Different frameworks have different approaches to help you find the available
    metrics and components to monitor. With MeasureWare, you use HP’s online help
    facility to explore the available metrics. Other tools provide a GUI to select
    the monitors to install or use.


    After determining the available monitors, you need to choose and configure the
    ones that you want to use. Some monitors are configured automatically when they
    are installed, while others require that you manually define notification criteria
    and other information before they can be used.


    # # Monitor Developer’s Kits


    The advantage of a framework is having all of your resources monitored through
    a consistent interface. However, a framework is unlikely to account for everything
    that might be interesting to you, especially if you have your own custom applications.
    In this case, you need an easy way to create a custom monitor that can be used
    seamlessly with the rest of the framework.


    A defining characteristic of frameworks is that they provide some method to allow
    the customer to add a monitor, but these methods vary. Some enable you to add
    a monitor with scripts, while others require more programming.


    # # Notification Methods


    To make administration easier, you should have all events sent to a common location.
    This may be a consolidated console or system log file, for example. Monitoring
    multiple systems from a master console reduces the need for additional hardware
    dedicated to monitoring. Sending messages to a single location makes diagnosis
    faster and less error-prone, because operators do not need to remember the names
    of key log files and do not need to remember to check individual logs.


    The console or log file needs to be accessible anywhere. Of course, a system log
    file will be inaccessible if an event led to a system outage. Within a company,
    a system operator may need to access logs from a remote network. Network accessibility
    and security may be concerns when remote access is required.


    Paging is an increasingly common technique for problem notification. According
    to a recent System Administrators Guild (SAGE, a USENIX technical group) study,
    a majority of administrators now carry pagers during nonworking hours. System
    operators may be paged at home to diagnose problems, so access from outside the
    company firewall may be an issue. Paging may require software that is not provided
    by the framework itself. Also, a terminal interface may be needed for remote access
    over a modem.


    Ideally, the system operator has a management tool with a graphical representation
    of the network and systems, and an event log file. Without a consolidated console
    for the managed'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'environment, the operator is forced to log on to the system, if accessible,
    and troubleshoot by using local log files. Many software products write error
    information to the system log file, /var/adm/syslog/syslog.log.


    Notification can be as simple as a color change on a system''s front panel display.
    Notifica-tion can also be much more sophisticated, such as an ASCII message appearing
    on the operator''s console, with the color reflecting criticality, and with actions
    suggested or automatically taken to try to recover from the problem.


    Industry-standard notification methods include Simple Network Management Protocol
    (SNMP) traps, and Desktop Management Interface (DMI) notifications. SNMP traps
    are commonly used on UNIX operating systems, including HP-UX, for event notification.
    Support for DMI has only recently been added to HP-UX.


    Some tools, such as the Network Node Manager (NNM), discussed in Chapters 4 and
    6, rely on SNMP traps or sent from the UNIX system to keep their network topology
    and maps up-to-date. They may also use SNMP to poll the systems periodically.


    Many of the enterprise management frameworks provide SNMP trap handlers so that
    they can receive events as traps and log and display events in an event browser.
    Templates are needed on a management station to translate SNMP traps into an ASCII-readable
    format. A user can configure these templates. Some HP and third-party products
    provide respective OpenView templates.


    Because SNMP uses an unreliable network protocol, some management frameworks provide
    an additional reliable mechanism. IT/O, for example, uses a proprietary Remote
    Procedure Call (RPC) mechanism called opcmsg. With opcmsg, you can be assured
    of receiving notification.


    In some cases, you may not want to be notified when an event occurs, because a
    recovery action may have already taken place. For example, when MC/ServiceGuard
    software detects that a Network Interface Card (NIC) has failed, it automatically
    configures a standby NIC, and network traffic transparently switches to the new
    interface. However, even in this simple example, you probably want to be notified,
    to ensure that the failed NIC is fixed in a timely manner.


    Events can also be sent into event correlation engines, which can do some event
    processing and filtering on behalf of the operator. This is described in more
    detail in Chapter 9.


    If you have a support contract, you may want to have your customer support center
    notified automatically when problems occur. HP Predictive Support software has
    the ability to send events via modem to the HP Response Center.


    You need to determine whether or not the framework you want to use has a sufficient
    set of notification methods available.


    # Diagnostic Capabilities


    Another way to compare frameworks is by their diagnostic capabilities. For example,
    after you receive notice of a problem, how easy can you troubleshoot and resolve
    the problem with each of the frameworks? Some products, such as IT/O, can provide
    detailed instruction information along with every event.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'In addition to determining what has gone wrong, you may want to take corrective
    actions. With some products, these actions can be predefined and automatically
    taken when an event arrives. In some cases, the actions are available, but need
    to be executed by the operator. You also need to be able to easily record the
    results of any actions that were taken, to help track the status of problem resolution.


    # # IT/Operations


    IT/Operations (IT/O) is an HP OpenView application that provides central operations
    and problem management. IT/O is a software bundle that not only includes NNM for
    network management, but also provides capabilities in the area of system management.
    With IT/O, facilities are provided that enable operators to share the management
    station software, and also have individual responsibilities for different sets
    of managed systems or types of events.


    IT/O uses intelligent agents that run on each managed system to monitor and collect
    management information, messages, and alerts, and to send the information to a
    centralized console. The agents can also perform local actions without communicating
    with the management station. After receiving events, IT/O can initiate automatic
    corrective actions or prompt the operator to run predefined, operator-initiated
    actions. When an operator reads an individual message, guidance is given and actions
    may be suggested for further problem resolution or recovery.


    IT/O has four main windows:


    +   - **Node Bank:** Displays the systems managed by the operator as icons. and
    allows organization of the icons into node groups, which then can be viewed from
    the Node Group window.


    +   - **Message Groups:** Displays logical message groups, such as Performance,
    Oracle, and Backup. The message groups serve as one way to organize messages in
    the Message Browser window.


    +   - **Message Browser:** Shows the events that have been received by the management
    server, including instructions, annotations, results of automatic actions, performed
    actions, and acknowledgments.


    +   - **Application Bank:** Provides access to commonly used diagnostic and administrative
    applications.


    These four main IT/O windows are shown in Figure 3-1.


    The Message Browser can filter out messages from systems that you don''t care
    about. If you are responsible for only a specific system function, such as performance,
    you can configure the Message Browser to show only those messages from a specific
    message group.


    # # Monitored Components


    As previously described, IT/O provides assistance with multiple aspects of system
    monitoring, especially faults, and resource and performance management. IT/O can
    also help with security monitoring, with its predefined template for monitoring
    root login attempts.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# **Figure 3.1 IT/O main windows.**


    ![](img/eae88b61ada165139a1d9b546a34140b_34_0.png)


    IT/O comes with predefined monitors and templates. Templates are used to configure
    monitors, to define message conditions, and to match patterns on received events.
    Templates also define Event Browser message text, severity levels, message groups,
    instructions, and actions. Monitors are predefined for e-mail, CPU utilization,
    swap utilization, and filestem utilization, among other things. Log file templates
    monitor system log files for system errors, su (switch user) events, logins, logouts,
    and kernel messages. Templates and message conditions can be modified so that
    the operator gets paged under certain conditions.


    Many other tools plug into IT/O to provide additional monitoring and management
    capabilities. IT/O has add-on modules for the managed node, called SMART Plug-Ins
    (SPIs). These modules provide customized knowledge of databases and applications
    via templates and monitors. For example, SPIs are available for SAP R/3, Baan,
    Oracle, and Informix. ClusterView is an HP OpenView application that provides
    monitoring of high availability clusters. Combined with the ability to do network
    and system monitoring, IT/O can provide a consistent interface for monitoring
    all of your components.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'IT/O provides multiplatform support. The IT/O console is available on HP-UX
    and Sun platforms. IT/O can manage HP-UX, Sun Solaris, IBM AIX, and other platforms,
    including Windows NT.


    # Monitoring Features


    Each system being monitored must have IT/O managed node software installed on
    it. This software includes IT/O''s intelligent agents, which monitor and collect
    data, perform actions, and send messages to the IT/O management console.


    Managed nodes are displayed in the Node Bank window. System status is reflected
    by the colors of the node icons in the Node Bank. Propagation rules are configurable
    in IT/O. For example, the color of the node icons may represent the criticality
    of the most serious unacknowledged event in the Message Browser.


    The IT/O agent is a key to differentiating the IT/O product. The agent is considered
    to be intelligent and autonomous because it can take actions without requiring
    operator intervention. The IT/O agent performs local polling of the resources
    being monitored, and can filter out redundant or unnecessary events before forwarding
    them to the management station. This can eliminate some network traffic and help
    to avoid information overload for the operator. The agent can also do event correlation,
    which further reduces network traffic. New events can be created by consolidating
    data from multiple events. The IT/O correlation engine can also reach conclusions
    based on the absence of events.


    The IT/O agent can continue monitoring and taking automated actions autonomously
    if it loses its connection to the management station. The agent will store events
    so that when the management station comes back up, no events are lost. The agent
    also uses a secure and reliable Remote Procedure Call (RPC) mechanism, opcmsg,
    to communicate with the management station.


    IT/O is useful when an operator needs to manage numerous systems consistently.
    Templates can be modified and then downloaded to a set of systems, enabling the
    operator to monitor many systems identically. In other words, monitoring can be
    set up in a consistent way for all systems.


    IT/O receives inbound events (such as SNMP traps), performs filtering, and delivers
    events to other processes registered for notification.


    Events received by IT/O are stored in a central repository, providing a permanent
    history and allowing for future analysis and auditing. Events are ordered chronologically
    and marked by severity. The name of the system that sent the message and a timestamp
    are stored with each event. Additional information includes the type of the event
    and application sending the event. When automated actions are provided, an indication
    is given as to whether an action was successful. Annotations can be used to show
    the output from the actions.


    Filtering can be used on the management station to reduce the number of events
    visible in the Message Browser. Filters can be based on severity, originating
    system, message group, or other categories.


    Events in the Message Browser may be the result of an SNMP trap, log file monitoring
    done by an IT/O agent, or an opcmsg call made by an IT/O monitor application.
    Events may indicate faults, status changes, configuration changes, performance
    thresholds being exceeded,'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'and so forth. Events are kept in the Message Browser until they have been acknowledged.
    Events can also be forwarded to other management stations or to trouble-ticketing
    systems.


    IT/O enables you to assign roles to operators so that each can be responsible
    for different events, nodes, message groups, or applications.


    It is important to be able to ensure that any monitoring you enable remains enabled.
    You don''t want to lose critical events. Because the IT/O agent is responsible
    for obtaining the monitor data periodically, you need to ensure that the agent
    is always running, which you can do by using IT/O''s capability of monitoring
    arbitrary processes. The agent can also be automatically restarted.


    # Monitor Discovery and Configuration


    After the intelligent, autonomous agents are installed, they monitor resources
    according to the templates that have been assigned to the local system. IT/O comes
    with a set of templates that are used to define monitoring conditions, thresholds,
    and event messages. The templates can include configured actions, either automatic
    or operator-initiated. This is where you may want to configure an action such
    as paging.


    The Message Template window shows the message templates currently configured in
    IT/O. Templates are grouped. For example, a template group exists for HP-UX 10.x
    systems.


    From the Node Bank window, you can assign templates to your managed nodes or node
    groups. After you assign all the templates, you need to install or update the
    IT/O software and configuration on the managed nodes. This can be done on one
    or more managed nodes, so that you can quickly set up monitoring for multiple
    systems. With IT/O, the templates are pushed out to each managed node so that
    the IT/O agent can then monitor, filter information, forward messages, and perform
    local actions without requiring communication with the management station.


    Message templates are available for receiving SNMP traps. Message conditions are
    defined to specify which messages are displayed in the Message Browser, the format
    of the displayed messages, and any actions that should be performed when an SNMP
    trap matches a defined message condition.


    A message group can be specified in a template. When message conditions are matched,
    the event gets assigned to the configured message group. This can be useful when
    delegating operator responsibilities. When configuring operators, both node group
    and message group responsibilities are assigned. For example, you can assign all
    HA (MC/ServiceGuard) messages to the operator responsible for monitoring MC/ServiceGuard
    clusters.


    When configuring monitoring, you can also include instructions in the template
    or configure actions to be performed, either automatically or manually triggered
    by the operator.


    As shown in Figure 3-2, you can assign templates from the Message Source Templates
    window to nodes in the Node Bank to configure monitoring and event management.


    # Monitor Developer''s Kit


    IT/O provides default monitors for CPU utilization, disk space, and other resources.
    IT/O also allows users to create their own monitor scripts. The script-based monitors
    rely on the IT/O agent to poll them for information, but the agent can then send
    notifications on their behalf.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# **Figure 3-2** IT/O template distribution.


    ![](img/eae88b61ada165139a1d9b546a34140b_37_0.png)


    IT/O also enables you to create your own monitors and templates. For instance,
    you can create a template to monitor arbitrary MIB variables, such as network
    interface status. The IT/O agent then periodically queries the MIB object to determine
    whether a message should be generated. Or, you can create your own monitor program
    or script that is invoked periodically by the IT/O agent. These monitors or scripts
    can have notifications sent by the IT/O agent, or they can send IT/O notifications
    through the opcom API. The monitor can then send asynchronous events, which is
    often more efficient than a polling mechanism. The IT/O user interface can also
    be used to set up monitoring of a specified log file, such as the system log file.
    Thus, an easy way to integrate a new monitor is to have interesting events first
    written to a log file.


    # **Notification Methods**


    IT/O is capable of receiving events via SNMP traps. IT/O also forwards events
    from the IT/O agent to the management station, using opcomsg. Local agents can
    buffer events if the management station is temporarily unavailable.


    The opcom API can be used to forward the current value of a monitored object to
    the IT/O agent. The agent then checks the value against the configured threshold.
    If the threshold is met, the event is forwarded to the IT/O management station.
    Local actions, which may include logging or suppressing the message, are done
    before the message is forwarded. Additionally, message templates can be configured
    with automatic actions, such as generating an e-mail message or pager notification.


    IT/O also provides a capability called "follow the sun," which enables events
    to be forwarded to the appropriate IT/O management station in a global environment
    based on the time of day. For example, if you have data centers with management
    stations in Japan, Europe, and'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'North America, each could be responsible for monitoring the company''s systems
    for a period of eight hours each day, together providing coverage around the clock.


    # Diagnostic Capabilities


    IT/O provides the capability to configure automatic and operator-initiated actions
    through templates. You can configure IT/O to take actions automatically when it
    receives an event matching a configured message condition. For example, when IT/O
    receives an MC/ServiceGuard event, the ClusterView template for that event can
    run an automatic action to extract additional data regarding the event from /var/adm/syslog/syslog.log
    and MC/ServiceGuard log files. This data is available to the operator in an annotation,
    available from the Message Browser.


    Message templates can also include instruction text, providing more detailed information
    about what the operator should do upon receipt of a particular event.


    IT/O provides several tools in the Application Bank that can be used to diagnose
    a problem, including tools to monitor local systems and remote access tools to
    diagnose problems. The Application Bank includes tools from HP products, other
    integrated products, and customer-generated tools.


    Applications in the Application Bank are represented as icons. Operators select
    the icon representing the target system and then select the icon of the tool to
    run on that system. You can bring up a telnet window or, for HP-UX systems, run
    the System Administration Manager (SAM) on the system having problems. You can
    check the print status or CPU load on any UNIX system from the central management
    station.


    The Application Bank has a two-level hierarchy, whereby similar applications are
    grouped together in an application group, represented as a top-level icon. Opening
    up an application group icon displays a window with all the Application Bank tools
    in that group.


    IT/O has also tightly integrated performance management with fault management.
    You can launch GlancePlus or PerfView from within IT/O. These performance management
    products are described in more detail in later chapters. Data from multiple IT/O
    agents (such as SMART Plug-Ins) on multiple nodes can be collected, correlated,
    and presented in a single PerfView graph launched from the IT/O management station.
    These graphs can be launched in the context of an event selected in the IT/O Message
    Browser.


    Hewlett-Packard also includes a preconfigured, single-system version of IT/O with
    its GlancePlus Pak 2000 product. A Java-based GUI presents diagnostic applications
    and an Event Browser. The product allows you to connect to information from multiple
    systems, as long as it is done one system at a time.


    GlancePlus Pak 2000 includes the intelligent agent technology from its Enterprise
    version, enabling it to collect events from a variety of sources and execute automated
    actions. After events are received in the Event Browser, an operator can trigger
    some predefined recovery actions.


    # Additional Information


    For further information, visit the HP OpenView Web site at http://www.openview.hp.com/.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Unicenter TNG


    Computer Associates'' Unicenter The Next Generation (TNG) is an enterprise management
    platform that provides graphical status monitoring. It provides system and network
    management for an enterprise of heterogeneous systems. Unicenter TNG provides
    monitoring and management for all the resources in your environment, including
    system resources, networks, databases, and applications.


    Unicenter TNG provides a framework for an integrated management solution to manage
    all IT resources via a common infrastructure. The TNG framework itself includes
    the following components: auto discovery, object repository, Real World interface,
    event management, calendar management, reporting, virus detection, and desktop
    support. Together with vendor, third-party, and custom-built applications, Unicenter
    TNG provides increased management and maintenance capabilities for the enterprise.


    A Common Object Repository stores the information used to create the Real World
    graphical views. You can browse the repository by using the Class Browser, Object
    Browser, or Topology Browser. Using the ObjectView, you can get details on the
    performance of devices, and even graph the data.


    The Real World interface provides graphical views that can be organized based
    on business functions, geography, or any logical groupings. The views can show
    the topology of the enterprise in two or three dimensions. These views can be
    used to see the status of the systems and resources in your environment.


    Unicenter TNG manages by using a distributed management approach. Distributed
    agents are responsible for monitoring and control. Centralized managers provide
    core management throughout the enterprise, including data correlation from one
    or more agents, workload management, and job management. The agents monitor and
    control based on policies provided by managers.


    # Monitored Components


    Unicenter TNG has available agents to monitor CPU and memory, swap usage, and
    filesystem space. You can also monitor file sizes and modifications. Messages
    in log files can also be periodically checked.


    The agents run on managed nodes and gather data, apply filters, and report when
    necessary. Some provide control or execution on behalf of the managers. The agents
    send notifications and can be polled. They can also collect performance data or
    be configured to send events and perform actions based on thresholds.


    # Monitoring Features


    The core Unicenter TNG product contains modules for a variety of system management
    functions: network management, calendar management, software distribution, event
    management, user/security management, workload management, tape/file management,
    printer/spool management, and reporting. The most common management components
    used by Unicenter TNG customers are database, event, and performance management.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Agents are available that can do threshold monitoring and take automated or
    manual actions. Alarms can be sent based on metrics measured over a specified
    period of time. A distributed state machine for event correlation is also available.


    CA Unicenter/DB Alert is a system monitor for databases and database applications.
    CA Unicenter/System Alert is a client/server application that provides some system
    and application-level monitoring. CA Unicenter/AP (Automation Point) and CA Unicenter/AHD
    (Advanced Help Desk) help with problem escalation, notification, and incident
    tracking.


    Unicenter TNG is layered on top of the Unicenter suite of system management tools.
    It enables you to configure business views so that operators can monitor systems
    based on business processes, such as purchasing, inventory, or payroll, without
    displaying resources and systems that are not involved.


    One unusual feature of Unicenter TNG is its Real World interface, a 3D view of
    the objects being monitored in the computing environment. Managed objects can
    also be shown in 2D, tree view, or text form.


    Information about managed objects is stored in an object repository. Search and
    query tools are provided to allow management applications to extract information
    from the database.


    Unicenter TNG’s Workload Management function can be used to schedule and monitor
    jobs. Jobs that fail can be automatically restarted. Workload Management can also
    ensure that jobs do not run beyond their configured time limits.


    Unicenter’s Spool Management function can be used to monitor the status of the
    UNIX spooler daemon or a print device. It can start and stop the daemon or alter
    print jobs already queued to the printer.


    # Monitor Discovery and Configuration


    Unicenter TNG provides automatic discovery of networked objects, including systems
    and other resources within the enterprise. Information is stored in the Common
    Object Repository and can be displayed topographically in the Real World interface.
    Discovery filters can also be used to limit discovery to a specific subnetwork
    or to specify which types of resources Unicenter TNG should discover. In addition
    to network discovery, more can be discovered if a Unicenter intelligent agent
    is installed on the system.


    A centralized Event Console Log GUI is available in Unicenter TNG to receive events
    from throughout the enterprise, including any system or application message written
    to the system log. Users can configure additional messages from other log files
    to send to the Event Console. Events are shown with timestamps, the system that
    sent the message, the message text, and other information. Automated actions can
    be configured for each event. Actions can be based on pattern matching of the
    received messages. Messages can also be forwarded to other event managers.


    For viewing agents and getting information about the agents, Unicenter TNG provides
    a MIB-II agent view to view MIB-II information, a node view, a Distributed State
    Machine (DSM) view, and an Event Browser. The DSM view tracks the status of objects
    across the network. It gathers information from the repository and agents, to
    maintain the state of objects'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'based on configured policies. The node view displays detailed state information
    about the system objects that are watched by the DSM.


    In conjunction with the calendar management function provided by Unicenter TNG,
    you can change or set event policies based on the time. For example, you may want
    to apply different policies during the weekend.


    Computer Associates also repackages some of its monitoring and discovery features
    into its Unicenter TNG Framework, which it ships for free on some platforms, including
    HP-UX.


    # Monitor Developer’s Kit


    An Agent Factory is provided that enables software developers to integrate their
    own monitors with Unicenter TNG. This is similar to the EMS developer’s kit, which
    is used to integrate new monitors into the EMS environment. A software developer’s
    kit is also available to help other vendors integrate applications into Unicenter
    TNG.


    # Notification Methods


    The management agents can detect event conditions and forward them to the management
    station. The events are sent as SNMP traps.


    # Diagnostic Capabilities


    Unicenter TNG does not provide the sophisticated event correlation capabilities
    available from other products, such as IT/O. The Event Console can be integrated
    with other functions, such as problem management, which can be used to identify
    and escalate certain problems automatically. A trouble ticket can be generated
    automatically when an event arrives at the management station.


    Managing events is one of the core capabilities provided by Unicenter TNG. The
    hub of event management is at the Unicenter TNG Event Console. Here you can configure
    policies to respond automatically to specific events, forward events, filter unimportant
    events, correlate events from several agents, and feed events into the DSM.


    Unicenter TNG does not provide continuous collection of performance data, nor
    does it provide the sophisticated drill-down diagnostic capability found with
    the integration of IT/O, PerfView, and MeasureWare.


    # Additional Information


    Additional information about Computer Associates can be found on their Web site
    at http://www.cai.com/unicenter/.


    # Event Monitoring Service


    The Event Monitoring Service (EMS) is a monitoring framework for HP-UX. It provides
    a common interface for monitor configuration and event notification. Using the
    EMS developer’s kit, monitors'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'are developed in a common way. Although the framework itself is freely available,
    some EMS monitors are sold separately, shipped with the products they support,
    or bundled with the system.


    EMS monitors provide help primarily with fault and resource management. Performance
    monitoring generally requires more sophisticated tools. Some system fault and
    resource monitoring capabilities are provided by the HA Monitors product and EMS
    Hardware Monitors. Other EMS monitors enable you to detect when you are getting
    low on system resources, such as file descriptors, shared memory, and system semaphores.


    # Monitored Components


    Multiple HP products include specific EMS resource monitors, so the resources
    available for monitoring vary depending on the customer’s installed software products.
    The resources available for monitoring also vary from system to system because
    the hardware configuration is different.


    EMS Hardware Monitors are provided with the Online Diagnostics bundle, available
    on the HP-UX support media, also known as the HP-UX Diagnostic/IPR Media. EMS
    Hardware Monitors provide the ability to detect and report problems with system
    hardware resources, such as device errors and component failures. Monitors are
    available for system hardware components and various HP storage products, including
    system memory, SCSI disk and tape devices, AutoRAID disk arrays, high availability
    disk arrays and storage systems, fast/wide SCSI disk arrays, various fibre channel
    components, tape autoloaders, and digital linear tapes.


    The HA Monitors contain several EMS monitors for monitoring filesystem space,
    network interface status, disk status, and MC/ServiceGuard cluster status. HA
    Monitors also provide monitoring for CPU load and the number of system users.
    The monitors include database monitoring as well.


    ATM adapters and HyperFabric adapters from HP can also be monitored using EMS.
    An EMS monitor is included with each of these products. These resources are also
    integrated with MC/ServiceGuard. HA ATM, for example, first attempts to perform
    a local recovery in the event of a failure, but if it is unable to provide local
    recovery, it notifies MC/ServiceGuard to trigger a failover to an alternate node.


    All the different resources that can be monitored are contained in a single EMS
    resource hierarchy. The portion of the hierarchy containing system hardware and
    kernel resources is shown in Figure 3-3. You see the entire resource hierarchy
    when configuring monitor requests in the EMS GUI.


    # Monitoring Features


    EMS is designed for use in high availability environments. The user can select
    only the critical components to be monitored, so the resource monitor will not
    be delayed polling for information from non-critical components. This is different
    from other tools, such as IT/O, which typically gathers data from all components.
    The IT/O agent executes a system-wide command and then parses the output. Thus,
    if a noncritical component hangs, the IT/O agent could be delayed'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Figure 3-3 EMS resource hierarchy.


