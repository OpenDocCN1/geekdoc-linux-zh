    \ An alarm summary report shows a count of the number of alarms and the amount\
    \ of time each alarm would have been active.\n\nMeasureWare's extract command\
    \ in the utility program can be used to export data to other tools, such as spreadsheet\
    \ programs. The extract command makes raw log files usable by PerfView as well.\n\
    \nThe following application-level metrics are available on HP-UX and Sun Solaris:\n\
    \n+   * CPU use during interval\n* Number and rate of physical disk transfers\
    \ during interval\n* Average number of processes in application\n* Average number\
    \ of active processes in application\n* Number of application processes that completed\
    \ during interval\n* Runtime of completing application processes\n* Average process\
    \ priority in application\n* Standard deviation of process priorities\n* CPU use\
    \ for user processes during interval\n* CPU use for system processing\n* Main\
    \ memory use\n* Swap space use on disk\n\nThese additional application-level metrics\
    \ are available on HP-UX:\n\n+   * Number and rate of I/O transfers to all devices\n\
    * Number of terminal transactions during interval\n* Average terminal first-response\
    \ time\n* Average terminal response-to-prompt time\n* Number of user-defined transactions\
