  md: 'management easier. These standards provide an industry-standard way to build
    instrumentation, and an industry-standard way to interface into the instrumentation.
    SNMP is used to access Management Information Bases (MIBs), and DMI is used to
    access Management Information Formats (MIFs).

    Standard MIBs and MIFs define the metrics that can be provided by any vendor.
    The information provided is generally referred to as instrumentation. Private
    MIBs and MIFs provide vendor-specific instrumentation. This section looks at some
    of the disk instrumentation available through each of these standards.

    Many tools already exist for accessing instrumentation. Several vendors offer
    browsers and monitoring capabilities that use a common interface to access instrumented
    objects from different hardware platforms and operating systems. For example,
    each of the common enterprise management frameworks, including HP OpenView Network
    Node Manager, HP OpenView IT/Operations, and CA Unicenter TNG, provide a MIB Browser
    tool to access MIB data. An example is shown in Figure 5-1. Toolkits exist to
    provide an interface so that developers can write their own tools to monitor or
    track this information. Toolkits also exist for doing custom instrumentation.

    Both standards provide disk-type information and more information is being instrumented
    as time goes on.


    # Simple Network Management Protocol


    A MIB is a standard way of representing information of a certain category. For
    example, MIB-II provides useful information about a system, such as the number
    of active TCP connections, system


