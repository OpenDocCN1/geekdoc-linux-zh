- pgno: 333
  md: '# # Monitoring Notes


    If you intend to write your own SNMP application, the root OID of the Oracle Enterprise
    Manager MIB is **1.3.6.1.4.1.111.12**.


    All events discovered by the OEM agent can also be sent as SNMP traps. Possible
    traps include reaching the limits on available file space or concurrent locks
    and sessions, falling below configured limits for cache hit ratios, and reaching
    system performance thresholds, such as CPU utilization.


    # # Oracle MultiProtocol Interchange MIB


