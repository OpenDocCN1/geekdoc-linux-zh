- pgno: 236
  md: 'Although the RDBMS MIB defines nine tables, only five are truly vendor-independent.
    These tables are shown in Table 8-1. The `rdbmsSrvParamTable` is also served by
    the major database vendors, but the server configuration information contained
    in this table is database-specific and may contain customized parameters. Informix
    and Oracle do not support the other three tables defined in the MIB: `rdbmsDbParamTable`,
    `rdbmsDbLimitedResourceTable`, and `rdbmsSrvLimitedResourceTable`.


    Two SNMP traps, `rdbmsStateChange` and `rdbmsOutOfSpace`, are defined in the RDBMS
    MIB, but only `rdbmsStateChange` is consistently implemented. The trap is sent
    when the database or database server''s state changes to restricted or unavailable.
    You may need to modify trap configuration files on your management station to
    receive new traps.


    The RDBMS MIB is primarily used for monitoring, not administration. However, much
    of the information is static configuration information, which is not useful for
    operational monitoring. The major database vendors also support the Network Services
    MIB, defined in RFC 2248, as a repository for database process information. The
    Network Services MIB is casually referred to as the "Application MIB", although
    the Internet Engineering Task Force (IETF) has now defined a different MIB with
    that name. Table 8-2 contains a list of useful fields from the RDBMS MIB, as well
    as the application table (appTable) in the Network Services MIB. Only MIB variables
    available for both Oracle and Informix are included in this table.


    Many of the variables listed in Table 8-2 are used to monitor the status of the
    database or database server. The `appOperStatus` field can be used to indicate
    the operational status of the database server: up, down, congested, or restarting.
    The `appInBoundAssociations` variable can be used to determine the number of active
    connections to the database. `rdbmsRelState` indicates the status of the database:
    active, available, restricted, unavailable, or other.


    Some of the database monitoring variables can also be used for resource control.
    The `rdbmsDbInfoSizeAllocated` and `rdbmsDbInfoSizeUsed` variables can be used
    to determine the amount of free disk space available for the database, indicating
    whether more space should be allocated. `appInboundAssociations` can be compared
    to the maximum allowed inbound associations from the server info table.


    You can use these variables in conjunction with Hewlett-Packard''s Process Resource
    Manager (PRM) to increase or restrict system resource entitlements when too many
    users are active. The server info table includes several interesting statistics
    about the number of transactions handled, and the number of reads and writes made
    by the server. The ratio of logical to


