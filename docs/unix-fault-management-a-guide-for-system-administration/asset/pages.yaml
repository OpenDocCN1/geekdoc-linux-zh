    physical reads can be used to determine the appropriate cache size, for example.
    However, the information in the server info table is aggregated for the database
    server, so database-specific statistics are not available here (unless the database
    server is handling only one database). The database relation table is used to
    match a database to its server.


    If you want to monitor Informix, the rdbmsSrvLimitedResource table is useful,
    because it contains current resource limits and thresholds reached. This table
    is not supported for Oracle. Other interesting variables in the RDBMS MIB not
    generally available for Oracle, but available for Informix, include:


    +   - rdbmsDbInfoLastBackup: Indicates the timestamp of the last database backup.

    - rdbmsSrvInfoOutOfSpaces: Indicates the number of times the database server has
    been unable to obtain the disk space that it wanted.

    - rdbmsRelActiveTime: Indicates the time this database was made active by the
