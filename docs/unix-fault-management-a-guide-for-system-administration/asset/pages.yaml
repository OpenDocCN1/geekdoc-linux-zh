- pgno: 285
  md: "Application Builder enables you to report the MIB data in the form of a table,\
    \ form, or graph. IT/O also includes the MIB *monitor templates*, which enable\
    \ you to set up monitoring for any MIB variable. Monitor templates provide tight\
    \ integration with the IT/O Message Browser and provide the ability to specify\
    \ automatic actions based on events.\n\nA summary of SNMP and the latest revisions\
    \ to SNMP version 2 can be found in Marshall T. Rose's *The Simple Book: An Introduction\
    \ to Internet Management* (Prentice Hall, 1994). More information about SNMP can\
    \ also be found in RFCs 1441 and 1442, available on the Web at `http://www.ietf.org`.\n\
    \nThe following sections describe some important MIB specifications that take\
    \ advantage of the SNMP standard. These documents include information about your\
    \ system, peripherals, and database, as well as other software applications. This\
    \ information can be invaluable in providing the appropriate level of monitoring\
    \ for your Unix system. Note that in the following the MIB specifications, an\
    \ asterisk (*) suffix indicates that the variable serves as an index for a table\
    \ entry.\n\n# MIB-II\n\nThe MIB-II is often referred to as the *System MIB*. It\
    \ is a standard repository for information about a computer system that is supported\
    \ on a variety of platforms, including Unix and Windows NT. The MIB-II contains\
    \ information about a computer system, such as its name, system contact, and the\
    \ length of time it has been running. It also contains statistics from the key\
    \ networking protocols, such as TCP, UDP, and IP. Statistics include packet transmission\
    \ counts and error counts.\n\n# MIB Definition\n\nListing A-1 shows the complete\
    \ definition for the MIB-II, as defined in RFCs 1213 and 1214.\n\n**Listing A-1\
    \ MIB-II specification.**\n\n```\nmgmt\n[\x01] mib_2\n[\x01] system\n[\x01] sysDescr\n\
    [\x02] sysObjectID\n[\x03] sysUpTime\n[\x04] sysContact\n[\x05] sysName\n[\x06\
    ] sysLocation\n[\a] sysServices\n[\x02] interfaces\n[\x01] ifNumber\n[\x02] ifTable\n\
    [\x01] ifEntry\n[\x01] ifIndex*\n[\x02] ifDescr\n```"
