    monitoring of all physical or logical volumes for all volume groups on a particular
    system.


    IT/O is useful when an operator needs to manage numerous systems consistently.
    The disk monitoring template can be modified and then downloaded to a set of systems.
    In this way, multiple systems can be monitored identically.'
