  md: "```\n[27] snmpOutSetRequests\n[28] snmpOutGetResponses\n[29] snmpOutTraps\n\
    [30] snmpEnableAuthenTraps\n```\n\n# ### Monitoring Notes\n\nWhen navigating the\
    \ MIB hierarchy using a tool such as the HP OpenView MIB Browser, you see the\
    \ mnemonic names for the MIB variables. The mnemonic for the MIB-II is iso.org.dod.internet.mgmt.mib-2.\
    \ However, if you intend to write your own SNMP application, you need to know\
    \ the numeric root OID of the MIB-II, which is 1.3.6.1.2.1. An operator can query\
    \ this information and correlate it to track error rates.\n\nThis MIB contains\
    \ some fault information. For example, Hewlett-Packard's EMS HA Monitors product\
    \ uses this MIB to monitor the status of each network interface.\n\nThe MIB-II\
    \ also contains network performance information, including the amount of data\
    \ sent and received per protocol. However, data is not correlated or converted\
    \ to rates. Consequently, to get an accurate picture of your network performance,\
    \ you must collect this data over a period of time and then note the changes yourself.\n\
    \n# ### RMON MIB\n\nThe RMON MIB is meant to provide a standard method for collecting\
    \ network performance data. Monitors, or *probes*, are placed on specific LAN\
    \ segments and then collect data on those segments. Network packet statistics\
    \ and a history of network performance can be stored in the MIB. RMON also provides\
    \ lists of the top network users, such as the systems that are sending the most\
    \ packets with errors.\n\n# ### MIB Definition\n\nListing A-2 shows the complete\
    \ RMON specification, as defined in RFC 1757.\n\n# **Listing A-2** RMON MIB specification.\n\
    \n```\nmib_2\n|\t[[16]\trmon\n|\t|\t[1 ]\tstatistics\n|\t|\t[1 ]\tetherStatsTable\n\
    |\t|\t|\t[1 ]\tetherStatsEntry\n|\t|\t|\t|\t[1 ]\tetherStatsIndex*\n|\t|\t|\t\
    |\t[2 ]\tetherStatsDataSource\n|\t|\t|\t|\t[3 ]\tetherStatsDropEvents\n|\t|\t\
    |\t|\t[4 ]\tetherStatsOctets\n|\t|\t|\t|\t[5 ]\tetherStatsPkts\n```"
  merge: -1
  img_proc: true
