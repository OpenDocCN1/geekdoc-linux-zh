  md: 'To view agents and get information about them, Unicenter TNG provides a MIB-II
    agent display to view MIB-II information, a node view, Distributed State Machine
    (DSM) view, and an Event Browser. The DSM tracks the status of objects across
    the network. It gathers information from the repository and agents to maintain
