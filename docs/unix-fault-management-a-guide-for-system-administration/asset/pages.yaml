    \n# arp\n\nThe Address Resolution Protocol (ARP) is used when a sending system\
    \ knows the IP address of the destination, but not the station address. An ARP\
    \ request is broadcast on the network, asking the destination or intermediate\
    \ router to respond with its station address. Recently used IP-address-to-station-address\
    \ mappings are stored in an ARP cache.\n\nThe arp command can be used to display\
    \ the current entries in the ARP cache. This can be a useful tool if you think\
    \ that two systems may be using the same IP address. You can check the MAC address\
    \ on the remote system and compare it to the value in the local system's ARP cache.\
    \ You may also want to use a LAN analyzer to see whether multiple ARP replies\
    \ are being received by the local system. Note that in the arp output in Listing\
    \ 6-8, one station address (0:60:3E:81:E:A0) appears multiple times. This system\
    \ is a router supporting multiple network interfaces."
