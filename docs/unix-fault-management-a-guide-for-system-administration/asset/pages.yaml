    # Unicenter TNG


    Computer Associates'' Unicenter TNG is an enterprise management platform that
    provides graphical status monitoring and provides system and network management
    for a heterogeneous enterprise. Unicenter TNG provides monitoring and management
    for all the resources in your environment, including system resources, networks,
    databases, and applications.


    Unicenter TNG provides the framework for an integrated management solution to
    manage all IT resources via a common infrastructure. The TNG framework itself
    includes the following components: auto discovery, object repository, Real World
    interface, event management, calendar management, reporting, virus detection,
    and desktop support. Together with vendor, third-party, and custom-built applications,
    Unicenter TNG provides increased management and maintenance capabilities for the
    enterprise.


    Unicenter TNG provides automatic discovery of networked objects, including systems
    and other resources within the enterprise. Information is stored in the Common
    Object Repository and can be displayed topographically in the Real World interface.
    Discovery filters can also be used, to limit discovery to a specific subnetwork
    or to specify which types of resources Unicenter TNG should discover.


    A Common Object Repository stores the information used to create the Real World
    graphical views. You can browse the repository by using the Class Browser, Object
    Browser, or Topology Browser. Using ObjectView, you can get details on the performance
    of devices, and you can even graph the data.


    The Real World interface provides graphical views that can be organized based
    on business functions, geographical location, or any logical groupings. The views
    can show the topology of the enterprise in two or three dimensions. These views
    can be used to see the status of the systems and resources in your environment.


    Unicenter TNG provides management by using a distributed management approach.
    Distributed agents are responsible for monitoring and control. Centralized managers
    provide core management throughout the enterprise, including data correlation
    from one or more agents, workload management, and job management. The agents monitor
    and control based on policies provided by managers.


    The agents run on managed nodes and gather data, apply filters, and report when
    necessary. Some provide control or execution on behalf of the managers. The agents
    send notifications, and can be polled. The agents can also collect performance
    data or be configured to send events and perform actions based on thresholds.'
