- pgno: 151
  md: '# # Monitoring the Network


    With the introduction of client/server computing, and the more recent explosion
    of Internet usage, the importance of maintaining your corporate networks has increased
    dramatically. A discussion of network management could easily fill an entire book,
    so this chapter instead addresses only the monitoring aspects of network management,
    specifically showing you how to study network performance and detect and recover
    from network component failures.


    # ## Identifying Important Network Components to Monitor


    In addition to monitoring a system and its components, it is critical to monitor
    the networks connecting the system to the end-users. Without connectivity to end-users
    and adequate performance, the service provided by a system is useless. This chapter
    shows how to monitor all aspects of your networked environment.


    Networking is a broad category and it can be broken down into a variety of components.
    These network components are shown in Figure 6-1. The client in this picture is
    the end-user connecting to the corporate network from the user''s desktop computer,
    and the server is the UNIX computer system, providing access to the corporate
    databases, performing network services such as Network File System (NFS), and
    so on. Note that the failure of any of these components can affect service availability,
    so it is important to provide high levels of redundancy throughout the corporate
    backbone. Network problems can be due to an application, defects in the network
    protocol software in the operating system, hardware problems with the LAN card
    or cabling, etc.


    To isolate a network problem, you need monitoring tools. The tool discussions
    in this chapter are organized by network component, such as routers and network
    interfaces, so that you can more easily see the specific monitoring tools available
    for each component. Some tools with a variety of capabilities are discussed in
    multiple sections of this chapter. Tools are available that show you the status
    of a network graphically, and that detect faults as well as configuration,'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'resource, and performance problems. The most common problems are performance-related,
    and include both temporary and sustained performance overloads. This chapter focuses
    primarily on TCP/IP networks, because the TCP/IP protocol suite is driving most
    Internet use.


    # Using Graphical Network Status Monitors


    As mentioned earlier, networking involves numerous different components, such
    as routers, hubs, bridges, and the system’s Network Interface Cards (NICs) and
    operating system. You will see in this chapter that tools are available to address
    each of these components individually. Before introducing each of these tools,
    this section shows how some network management products can reduce the complexity
    of monitoring your corporate networks. The products discussed in this section,
    referred to as *graphical network status monitors*, reduce complexity by providing
    summary information about the devices at a central location. You don’t need to
    log in remotely to each network device, and you can see status at a glance.


    Popular network management products include Hewlett-Packard’s Network Node Manager,
    Computer Associates’ Unicenter TNG, Sun’s Net Manager, IBM’s NetView, and HP’s
    Net-Metrix. These products offer various unique capabilities, such as the ability
    to discover automatically all the network devices in your computing environment
    and display the real-time status of each graphically on network topology maps.
    A sample of these products is provided in this section. Sun Enterprise SYMON is
    also discussed in this section, because it is a low-cost alternative to the other
    products. NetMetrix is discussed later in the chapter, along with other performance
    tools, because of its primary emphasis on network performance.


    # Network Node Manager


    Network Node Manager (NNM) is a management product based on the HP OpenView platform.
    It is used primarily to view and monitor the status of network and system resources.
    Information is displayed graphically in a windows-based display. A hierarchical
    set of windows, or submaps, are available to enable users to navigate through
    the network topologies.


    From the initial network view, you can drill down to the submap that shows the
    systems on a specific network segment, as shown in Figure 6-1. Specific statuses
    of systems are depicted by using different colors for the system icons. The ability
    to group systems by their network segment can help to isolate a problem to a specific
    network.


    As with other network management products, NNM can automatically discover and
    monitor the status of network-addressable components, such as routers, hubs, and
    computer systems, via management protocols such as the Simple Network Management
    Protocol (SNMP). Any IP-addressable device that is accessible from the management
    system can be displayed. The network topology information is then displayed on
    submaps, as shown in Figure 6-1. In larger computing environments, you may want
    to reduce the network overhead of the discovery process by using *discovery filters*,
    which enable you to specify the subnetworks that you want to'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# **Figure 6-1** NNM displays network segments.


    ![](img/eae88b61ada165139a1d9b546a34140b_153_0.png)


    be explored. This can also help to limit the scope of the systems managed from
    a single management station in your organization.


    An operator can navigate through the submaps to find a particular LAN segment
    containing important systems to monitor. In addition to viewing the overall status
    of a network device, an operator can drill down to see system information, such
    as configured network interfaces. A system''s standby network interfaces — those
    without a configured IP address — can also be shown. The icons can help you distinguish
    between configured and standby interfaces, as shown in Figure 6-2. Icons without
    an "IP" symbol are standby interfaces.


    NNM includes a graphical Event Browser, which displays the events received from
    systems on the network. Events are sent to the management station as SNMP traps.
    The trap daemon receives these traps and stores them in a database to maintain
    an event history. The events can be viewed through the Event Browser, and filters
    can be used to prevent the operator from being flooded with noncritical information.
    Filters can be based on several attributes, including the sending system, criticality
    of the event, or the time. NNM can also process Common Management Information
    Protocol (CMIP) events for multivendor interoperability.


    NNM periodically polls network devices to verify that they are working. If no
    reply is received, a Node Down event is sent as an SNMP trap and logged in NNM
    Event Browser. This results in a color change of the graphical icon in NNM that
    represents the device. NNM''s reliance'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Figure 6-2  NNM displays a system''s network interface status.


    ![](img/eae88b61ada165139a1d9b546a34140b_154_0.png)


    on network connectivity to determine status information can create problems if
    not all networks are globally accessible. If the management station doesn’t have
    a route to a private subnetwork, the subnetwork will appear to be down when examined
    from the management station.


    Pull-down menus enable the operator to run tools to get additional real-time information.
    These tools can be used to check a system’s network configuration, including addresses,
    the routing table, ARP cache entries, and system services. The Fault menu includes
    tools to test a system’s network connectivity, ping the system from the management
    station, remote ping between two remote systems, and locate the SNMP route to
    the system. Some of these tools are explained in more detail later in the chapter.
    Finally, NNM tools are available to collect, set thresholds for, and display the
    MIB data via SNMP. NNM also provides an xnmgraph utility, which enables the user
    to input any historical data that was collected and see it in graph form.


    For additional diagnostic information, you can remotely log in from NNM to the
    system and execute diagnostic commands. The NNM toolbar provides this feature
    via telnet, and also provides the capability to launch System Administration Manager
    (SAM) on the remote system.


    OpenView’s MIB Browser tool also provides diagnostic capability. A Management
    Information Base (MIB) is a standard way of representing information of a certain
    category. For example, the MIB-II provides useful information about a system,
    such as the number of active TCP connections, details about system hardware, and
    version information. By using the MIB Browser, you can discover which MIBs are
    available and see the information being provided by each MIB. The MIB Browser
    tool can check the value of anything contained in a MIB on the remote system.
    When you find a MIB that contains some useful fields, you can use this tool or
    other MIB tools to gather that data from the target system. The MIB data is displayed
    in the MIB Browser’s output window on the screen. By browsing through available
    MIBs and querying values of selected MIB fields, you can gather specific information
    needed to monitor systems and troubleshoot problems. Figure 6-3 illustrates how
    you can use the MIB Browser to check the status of the NICs on a given system.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/eae88b61ada165139a1d9b546a34140b_155_0.png)


    A more detailed description of MIBs, as well as definitions of some of the important
    MIBs for UNIX servers, are provided in Appendix A.


    NNM software can run on UNIX and NT management stations and is a building block
    for other HP OpenView applications. Application integration is provided through
    developer''s kits and registration files. Many applications are integrated today
    with HP OpenView, with the most commonly used partner applications being CiscoWorks,
    Bay Networks Optivity, 3Com Transcend, Remedy ARS, and HP NetMetrix.


    # IT/Operations


    Hewlett-Packard has a product called OpenView IT/Operations (IT/O), a software
    bundle that not only includes NNM for network management, but also extends its
    capabilities to provide more in the area of system management. IT/O provides facilities
    that enable operators to share the management station software, but retain responsibilities
    for different sets of managed systems.


    IT/O includes an Application Bank that allows HP products or customer-generated
    tools to be iconified and available for use by the operator. Operators select
    the target system, and then select the tool to run on that system. A two-level
    hierarchy of tools may be defined. Examples of available tools include GlancePlus
    and PerfView. These tools can then be used to monitor performance on an arbitrary
    target system from the central management station.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'The IT/O Application Bank includes three application groups with networking
    tools: Net Activity, Net Config, and Net Diag. Each of these groups has several
    tools. The Net Activity group, shown in Figure 6-4, has tools to monitor network
    activity, including interface traffic, Ethernet errors, Ethernet traffic, SNMP
    traffic, SNMP operations, SNMP errors, interface statistics, SNMP authorization
    failures, and TCP connections. The Net Config and Net Diag groups provide many
    of the same tools provided in NNM pull-down menus mentioned earlier in this section.


    # Unicenter TNG


    Computer Associates’ Unicenter TNG product is comparable to HP’s IT/O product.
    It discovers IP-addressable components and can display them as icons on maps.
    The maps can reflect the network topology. An Event Browser is also included and
    can be used to keep a history of SNMP events received from the monitored systems.
    This Event Browser is shown in Figure 6-5.


    Computer system status is reflected on the map with different colors. Like NNM,
    Unicenter TNG also has difficulty showing the status of private networks correctly.


    Computer Associates (CA) repackages some of its monitoring and discovery features
    into its Unicenter TNG Framework, which it ships for free on some platforms, such
    as HP-UX. Additionally, CA has done some special integration with HP’s Event Monitoring
    Service (EMS) product (discussed later in this chapter), so that the status of
    monitored resources on the system can be shown graphically.


    # Enterprise SyMON


    Sun Enterprise SyMON is a low-end product for network monitoring. It is able to
    discover computer systems that are reachable from the management station, and
    can group systems into


    ![](img/eae88b61ada165139a1d9b546a34140b_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# **Figure 6-5** Unicenter TNG Event Browser.


    ![](img/eae88b61ada165139a1d9b546a34140b_157_0.png)


    “domains” for easier administration. Figure 6-6 shows how this discovery is configured.
    SyMON provides system status based on the criticality of events received from
    a system. SyMON can also be used to generate performance graphs.


    Sun Enterprise SyMON can be used to report network alarms through its graphical
    display. Events can be generated by configuring rules in the Tool Command Language
    (TCL) scripting language. SyMON provides an intelligent agent on the managed node
    that has access to a large set of system data, including the MIB-II. Rules can
    be configured for the network portion of the MIB-II to send alarms when the interface
    card’s status changes, for example.


    SyMON also includes diagnostic capabilities. In response to an event, you can
    drill down to a physical view of the system that includes a photo view of the
    failed component, based on preloaded GIF files for each system model.


    The intelligent agent on the managed system can support additional modules being
    loaded. For example, a module exists that can report events for the NFS. The user
    can choose which additional modules to load.


    SyMON is only available for monitoring Sun systems.


    # ## Monitoring Network Interface Card and Cable Failures


    The Mean Time Between Failures (MTBF) for a single Network Interface Card (NIC)
    can be many years. However, in a large computing environment, you are still likely
    to experience LAN card failures. This section shows how you can monitor LAN card
    failures, verify that physical cables are set up properly, and discover related
    problems, such as a link disconnection. You can also see how to identify the type
    of network link being used.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Figure 6-6 Configuring discovery in SyMON.


    ![](img/eae88b61ada165139a1d9b546a34140b_158_0.png)


    This section refers to monitoring the networking components that correspond roughly
    to the physical and data link layers of the Open Systems Interconnection (OSI)
    model. This section also shows how to obtain a LAN''s status and statistics, the
    LAN station addresses used by each UNIX server, and information on LAN packet
    errors. This section concludes with some of the monitoring tools that are specific
    to certain network links, such as X.25, Asynchronous Transfer Mode (ATM), and
    Fiber Distributed Data Interface (FDDI).


    # Using SNMP Instrumentation


    As mentioned earlier in this chapter, important monitoring information can be
    stored in standard MIBs, and can then be queried by using a MIB Browser. The MIB
    Browsers are publicly available and are also included with the NNM, IT/O, and
    other network management products. The MIB data can also be obtained by using
    a custom SNMP application, but you need to know the Object Identifiers (OIDs)
    of the fields you are interested in querying, which are provided in the MIB specifications.
    Standard MIB documents are provided as Requests For Comments (RFCs) from the Internet
    Engineering Task Force (IETF), and are available on the Web at http://www.ietf.org.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The MIB-II (defined in RFCs 1213 and 1214) contains numerous useful fields
    for monitoring network links. Information about each network interface is available,
    including its current status. You can compare the total number of input packets
    to the number of input packets received in error. Similar fields are available
    for output packets. Together, these fields can be an indication of how well a
    network is behaving.


    You may also want to check the number of inbound packets that were discarded despite
    being received without error. If packets are being discarded, this could indicate
    a lack of system memory reserved for network buffers.


    Each network interface has both an administration status and an operation status
    defined in the MIB-II. Administration status is up, down, or testing. It refers
    to the desired state of the interface. Operation status is also up, down, or testing,
    and it corresponds to the current operational state of the interface.


    Network statistics are accumulated from the time the system was booted, or since
    the last manual reset of the statistics. Because this usually is a long period
    of time, a single MIB query is unlikely to be useful. You will probably want to
    set up ongoing monitoring and calculate the change in value over time to get an
    idea of network traffic over a NIC and the current error rate. Output errors are
    likely to indicate a problem getting to the link from the local system.


    # ## Using Standard Commands and Tools


    Each UNIX operating system includes a variety of commands that can be helpful
    in determining the status of a network interface. The more commonly used HP-UX
    commands are described in this section. You may want to check the online man pages
    for additional information about each command.


    In addition to these commands, you may also want to check the system log file,
    /var/adm/syslog/syslog.log, for LAN-related error messages if your system is experiencing
    network problems.


    # ### ioscan


    The ioscan command is used to provide information about all the I/O paths on a
    system. It can show the hardware paths to your LAN cards and help you to distinguish
    between a built-in LAN card and additional LAN cards. You can also see the specific
    type of LAN card being used. ioscan shows errors if the hardware or software has
    not been properly installed. Errors may be due to the wrong network driver being
    installed, meaning that you would need to rebuild the kernel with the correct
    driver. Listing 6-1 shows an HP-UX system with one built-in LAN card and three
    EISA cards.


    > Listing 6-1  The ioscan command with grep, which shows only network information.


    ```

    ```

    chacha#ioscan |grep lan

    8/16/6        lan        Built-in LAN

    8/20/5/1      lan        EISA card HWP1990

    8/20/5/7      lan        EISA card HWP1990

    8/20/5/8      lan        EISA card HWP1990

    chacha#

    ```

    ```'
