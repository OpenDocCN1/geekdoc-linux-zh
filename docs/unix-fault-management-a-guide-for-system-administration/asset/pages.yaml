- pgno: 224
  md: 'The data collected through ARM can be integrated with other MeasureWare data.
    The MeasureWare Transaction Tracker technology is used to provide metrics for
    an application using ARM. The following metrics are available on both HP-UX and
    Sun Solaris:


    +   - Transaction name

    - Transaction count

    - Transaction average response time

    - Distribution of response-time metrics

    - Number of aborted transactions

    - Response times of aborted transactions


    The utility program includes the ability to generate reports on log files. System-wide
    changes can be found in this way, such as the addition of a new disk device. Reports
    can also be generated that provide summaries of each application''s CPU and disk
    utilization.


    To verify that MeasureWare is working correctly, you can use the `perstat -t`
    command, which shows you recent status and error information.


    # GlancePlus


    GlancePlus is a real-time, graphical, performance monitoring tool from Hewlett-Packard.
    It is used to monitor the performance and system resource utilization of a single
    system. Both Motif-based and character-based interfaces are available. The product
    can be used on HP-UX, Sun Solaris, and many other operating systems.


    GlancePlus collects information similar to MeasureWare, but samples data more
    frequently. GlancePlus can be used to graphically view current CPU, memory, swap,
    and disk activity and utilization at the system level. It can also show application
    and process information. Transaction information can be shown if the MeasureWare
    Agent is installed and active.


    For monitoring applications, the application must be defined. To define an important
    application, use the configuration file located at `/var/opt/perf/parm`, which
    is also used by the MeasureWare and PerfView products.


    GlancePlus is also capable of setting and receiving performance-related alarms.
    Customizable rules determine when a system performance problem should be sent
    as an alarm. The rules are managed by the GlancePlus Adviser. When you select
    the Edit Adviser Syntax option from the Adviser menu, all the alarm conditions
    are shown, which you can then modify. The GlancePlus Adviser syntax file (`/var/opt/perf/adviser.syntax`)
    contains the symptom and alarm configuration. Additional syntax files can also
    be used. A condition for an alarm to be sent can be based on rules involving different
    symptoms.


    Alarms result in onscreen notification, with color representing the criticality
    of the alarm. An alarm can also trigger a command or script to be executed automatically.
    Instead of sending an alarm, GlancePlus can print messages or notify you by executing
    a Unix command, such as `mailx`, by using its EXEC feature.'
  merge: -1
  img_proc: true
