    information and network interface status. HP OpenView IT/O enables you to set
    up ongoing monitoring of MIB variables. Management frameworks, such as Ucenter
    TNG, also provide a MIB Browser. Public-domain MIB Browsers are available, too.


    Database vendors, such as Oracle, Sybase, and Informix, each support the Relational
    Database Management System (RDBMS) MIB, which provides information such as the
    database status. (The entire contents of this MIB is provided in Appendix A.)
    Because the database vendors have standardized their representation of some key
    information, an operator can access this information in the same way regardless
    of which database is being used. This information can then be combined with information
    learned from MIB-II and the HP-UNIX MIB, to get a broader understanding of the
    condition of the databases. The Gartner Group estimates that every Fortune 1000
    organization has an average of five database sources, so the use of a standard
    MIB for monitoring can provide some much needed consistency and reduce the amount
    of database operator training.'
