  img_proc: true
- pgno: 164
  md: '![](img/eae88b61ada165139a1d9b546a34140b_164_0.png)


    # **MC/ServiceGuard**


    MC/ServiceGuard is a high availability software product that detects system failures,
    network or LAN card failures, and the failures of critical applications. MC/ServiceGuard
    can be configured to handle these failures automatically. For example, a failed
    critical application can be restarted. The failure of a LAN card can result in
    the automatic configuration of a backup LAN card to take over the network load.


    MC/ServiceGuard is much more than a monitoring product, because it also provides
    transparent application restart when failures are detected. If you are responsible
    for monitoring a network, and MC/ServiceGuard is being used in your environment,
    then you should become familiar with how the MC/ServiceGuard product uses the
    network.


    Although MC/ServiceGuard can be used for a single system to provide transparent
    LAN failover, it is more commonly used in a cluster environment. In this case,
    if a system failure occurs, an application can be restarted on another system.
    This capability requires MC/Service-Guard to be sending packets over the network,
    to ensure that its cluster members are still alive. You may want to have a dedicated
    network for this high availability communication, to ensure that high network
    utilization doesn''t cause an unnecessary migration of your application. MC/ServiceGuard
    monitors subnetworks and can send an SNMP trap when a subnetwork goes'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'up or down. If you are using an SNMP-based management application, this can
    be a quick way to learn that you are having network problems.


    MC/ServiceGuard takes advantage of the ability to have multiple IP addresses bound
    to a single network interface card. This allows an application to be migrated
    to another system without the clients needing to learn a new address; the IP address
    moves with the application. MC/ServiceGuard distinguishes between a "stationary"
    IP address, which is associated with one computer system, and "floating" IP addresses,
    which are associated with applications and are migrated with them to other systems.


    MC/ServiceGuard sends SNMP traps when its IP addresses are added or removed from
    the system. To see whether these floating IP addresses are being used on your
    system, you can use `netstat_in`, which shows all of your configured IP addresses.
    The `ifconfig` command shows only the stationary IP address for a specified network
    interface. These commands are discussed in more detail later in the chapter.


    Note that MC/ServiceGuard is supported only on HP 9000 Series 800 systems running
    HP-UX 10.x or later operating systems. However, other system vendors provide similar
    high availability networking products.


    # MeasureWare


    MeasureWare is a software product that collects system performance information.
    Collected data can be used by performance tools such as HP PerfView.


    MeasureWare monitors numerous metrics on HP-UX, Sun Solaris, and other platforms.
    Although the information is collected primarily for performance reasons, it can
    also be helpful in inferring the status of network components. For example, if
    the rate of inbound LAN packets suddenly dropped to zero on a busy network interface,
    it might signal a link problem. After you detect a potential problem, you should
    use other tools to diagnose where the problem might be happening.


    MeasureWare is discussed in more detail in "Collecting Network Performance Data,"
    later in this chapter.


    # Using Link-Specific Commands


    You should be able to diagnose the health of Ethernet and Token Ring links by
    using only the tools already described. Additional commands are available for
    other network links, such as FDDI, X.25, and ATM. The remaining portion of this
    section describes some of the link-specific commands that are available to help
    with fault diagnosis and troubleshooting.


    # Using FDDI Status Commands


    Fiber Distributed Data Interface (FDDI) is a high-speed LAN technology that is
    capable of data transfer rates of 100 megabits per second. FDDI supports dual
    fiber-optic rings, which provide a level of redundancy. Systems can connect to
    an FDDI network through an FDDI device called a *concentrator*, which can provide
    some fault tolerance by ensuring that the network won''t be impacted by a failed
    system. NICs with dual-attach capability can directly connect into separate concentrators,
    for additional protection.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'You can check whether your system is using FDDI by executing the lanscan command.
    The link type is shown for each LAN card. In addition to lanscan, other common
    commands can be used with FDDI links, such as ioscan, linkloop, and lanadmin.


    You can execute fddiinit with the device file of your FDDI adapter, to initialize
    the adapter and connect the system to the network. If this command fails, the
    cables may not be connected properly, the card may not be operational, or the
    concentrator may not be up.


    If the adapter is initialized successfully, you can get additional information
    about the card by using fddistat, which also requires the device file (for example,
    /dev/lan1). If the card is set up properly, the output should indicate that the
    ring is operational and that the line state of the station connection is WRAP_S.


    An additional command, fddinet, can be used to display connection information
    about the local ring, a specified remote node, or all nodes connected to the same
    FDDI ring.


    # ## X.25 Status Commands


    X.25 is a packet-switching network standardized by CCITT. x25stat can be used
    to detect problems with an X.25 link. It provides the status of the X.25 device
    and card, configuration information, and virtual circuit statistics. Executing
    x25stat -f -d /devicefile shows you the number of errors on the X.25 link. If
    the link state is not listed as NORMAL, then a problem exists.


    Statistical information shown through x25stat includes the current number of virtual
    circuits configured and the bytes transferred over each subnetwork. x25stat can
    also show statistics for a specific virtual circuit, such as the number of data
    packets sent or received.


    If IP is not working over X.25, you can check that your network address has been
    configured correctly and see the mapping between IP and X.25 addresses by using
    x25stat -a. You may need to reinitialize X.25 using x25init.


    The x25check and x25server commands are used together to test the X.25 network.
    x25server is a background process that waits for call requests from x25check.
    x25check sends packets to a remote system running x25server, and the packets are
    echoed back. This can be used to test your X.25 link to the network or the X.25
    switch. If successful, x25check also shows the time spent setting up the virtual
    circuit.


    # ## ATM Status Commands


    Asynchronous Transfer Mode (ATM) is a high-speed network technology. Some network
    commands, such as lanscan and netstat, are generic and can be used with ATM links.
    netstat -i, for example, shows the statistics for ATM network interfaces. However,
    some ATM-specific status commands are also available, and are described next.


    To get information about an ATM adapter, its MAC address, and associated virtual
    circuits, you can use the atmgr command. The command requires a card instance
    number to be specified. Additional information can also be shown, depending on
    the command options specified. For example, atmgr 0 show -p shows the status,
    statistics, and MAC address.


    To do an external loopback test, you can use the atmloop command. You must first
    use atmstop to stop the ATM adapter, and then replace the cable with a loopback
    hood. After the test,'
  merge: -1
  img_proc: true
