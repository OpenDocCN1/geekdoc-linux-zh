  md: '![](img/eae88b61ada165139a1d9b546a34140b_385_0.png)


    # UNIX FAULT MANAGEMENT


    A GUIDE FOR SYSTEM ADMINISTRATORS


    BRAD STONE

    JULIE SYMONS


    # **Maximize UNIX system integrity and availability in mission-critical environments!**


    If you''re responsible for maintaining the integrity and availability of a mission-critical
    UNIX system, then you need *UNIX Fault Management: A Guide for System Administrators*,
    the first book that presents all of the monitoring and fault management information
    you want to know. Expert UNIX system management engineers Brad Stone and Julie
    Symons show you exactly how to implement appropriate, cost-effective system monitoring
    on any UNIX server—including systems configured as high availability clusters.


    **COVERAGE INCLUDES:**


    +   * Plan for–and establish–cost-effective, reliable system monitoring procedures

    * Monitor systems, disks, networks, applications, and databases

    * Detect, investigate, and recover from server problems

    * Implement best practices for high availability in enterprise-class UNIX installations—including
    clusters

    * Take advantage of key fault management trends, new standards, and new technologies


    This book contains detailed descriptions of fault monitoring tools and monitoring
    frameworks to help you make better purchasing decisions. You''ll also find a handy
    quick reference of monitoring tasks and techniques for operators—including specific,
    step-by-step recovery solutions. If you can''t afford one nanosecond more downtime
    than necessary, you can''t afford to be without *UNIX Fault Management*.


    **BRAD STONE** is a systems management architect at Hewlett-Packard with responsibilities
    spanning multiple areas of system management, including fault management. In his
    11 years at HP, he has helped design and implement multiple system management
    tools, including Network Connection Policy Manager and Event Monitoring Service.


    **JULIE SYMONS** is a lead engineer for HP-UX Fault Management at Hewlett-Packard.
    She has been with HP for 12 years, developing various system management and high
    availability tools including HP Process Resource Manager, ClusterView, and Event
    Monitoring Service.


    $39.99 U.S.  $60.00 Canada


