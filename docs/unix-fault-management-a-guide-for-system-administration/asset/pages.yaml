    # ### Monitoring Notes


    If you intend to write your own SNMP application, the root OID of the Oracle Names
    MIB is 1.3.6.1.4.1.111.6.


    The table entries in this MIB are indexed using applIndex from the Network Services
    MIB.


    Running time in the oraNamesTNSTable table can be used to get an idea of how long
    the server has been running. Several fields in this table are not supported for
    Oracle Names, including the start date, security level, state, listen addresses,
    and failed listen addresses.


    The oraNamesConfigTable includes important configuration information, such as
    the server name and administrative region name. Several fields in the table aren’t
    supported for Oracle Names, including the configuration’s checkpoint file, the
    default forwarders, fields related to domains, the configuration log file directory,
    the configuration unique log flag, the maximum number of open connections, the
    message pool start size, the region database flag, the topology checkpoint file,
    and the fields related to tracing.


    The oraNamesServerTable includes important performance information, such as the
    number of queries received and responses sent, and the time spent processing the
    queries. Several fields aren’t supported: last few names not found; information
    on deletes, renames, and updates; statistics on error responses; the last reload
    time; and the last checkpoint time.


    # ### Oracle Enterprise Manager MIB


    Oracle Enterprise Manager (OEM) provides database management and monitoring. OEM
    supports the private Oracle Enterprise Manager MIB, which includes information
    about database events discovered by the OEM agent.


    # #### MIB Definition


    Listing A-14 shows the complete specification for the Oracle Enterprise Manager
    MIB, as defined by Oracle.'
