  md: '# Figure 5-2 EMS DVM resource hierarchy.


    ![](img/eae88b61ada165139a1d9b546a34140b_129_0.png)


    The physical volume status and physical volume link status are checked when the
    EMS DVM attempts to communicate with a device over a particular physical path.
    The volume group does not have to be active. Valid values are **UP**, **DOWN**,
    and **BUSY**. If you have configured redundant links to your physical volumes,
    and the primary link fails, the LVM switches transparently to an alternative path
    to the device. This results in a SPOF. If you are monitoring the physical volume
    link status, you will be notified and can take action to restore redundancy by
    re-establishing an alternative path.


    The logical volume summary summarizes the LVM status values of all logical volumes
    in the volume group. The possible values for the logical volume summary status
    are shown in Table 5-2.


    The logical volume status reports the LVM subsystem’s status for the selected
    logical volume. Inactive logical volumes have an **INACTIVE** status. Active logical
    volumes have either an **UP** or **DOWN** status, depending on whether at least
    one copy of all the data is available.


    The EMS DVM uses logical volume copies to report the number of copies of data
    available within the logical volume. In this way, the failure of a mirror can
    be detected. The value returned by the monitor is the number of complete copies
    of the data that are available. In the screen shown in Figure 5-3, the DVM is
    being configured to monitor mirrored copies of all logical volumes.


    | **Table 5-1** | DVM Status Values for Physical Volume Summary |

    | :--- | :--- |

    | **Status** | **Physical Volume Summary Interpretation** |

    | UP | All physical volumes in this volume group are up |

    | PVG_UP | At least one PVG exists for which all physical volumes are up |

    | SUSPECT | Some PVs are not up; cannot conclude if all data is available |

    | DOWN | Some data is not available |


    | **Table 5-2** | DVM Status Values for Logical Volume Summary |

    | :--- | :--- |

