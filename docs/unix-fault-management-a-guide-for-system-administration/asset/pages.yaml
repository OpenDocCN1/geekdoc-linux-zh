    # ## BMC PATROL for UNIX


    BMC Software provides monitoring capabilities through its PATROL software suite.
    PATROL is a system, application, and event management suite for system and database
    administrators. PATROL provides the basic framework for defining thresholds, sending
    and translating events, and so forth. Optional products, called Knowledge Modules
    (KMs), are capable of monitoring specific components. For example, BMC PATROL
    includes KMs for UNIX, SAP R/3, Oracle, Informix, and other applications. In fact,
    more than 40 KMs are available from BMC for use with PATROL.


    With the PATROL KM for UNIX, managed components include the CPU, memory, users,
    kernel, processes, printers, security, and filesystems. These components are discovered
    automatically and represented on the PATROL console with status icons. System
    utilization can be shown as graphs, to capture trends, and data can either be
    displayed in real time or saved in log files.


    Like other graphical monitoring tools, PATROL provides an Event Manager window,
    which can show received events. Figure 4-12 highlights disk and NFS events received
    at the console.


    For memory and swap resources, PATROL can show total real memory available, total
    virtual memory available, a list of swap devices, the number of processes swapped,
    and swap space utilization.


