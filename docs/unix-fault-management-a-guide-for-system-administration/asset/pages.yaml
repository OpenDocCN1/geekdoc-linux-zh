    Another way to find out which computer system is associated with a given station
    address is to use NNM, which has a Locate menu option. By specifying the station
    address using this menu option, NNM searches its object database to find the corresponding
    system.


    The arp command can also be used to add or delete entries from the ARP cache.
    This is useful if you want to use ping to diagnose IP and ARP failures.


    # *netstat*


    The netstat command can be used to show information about network interfaces and
    protocols. Statistics can be shown for the TCP, UDP, IP, ICMP, ARP, and other
    protocols. netstat can be used to show all active TCP connections and their current
    TCP state. With netstat, you can display all the IP addresses currently configured
    on the system. For example, you can determine the total number of TCP connections
    requested and accepted. Information can be displayed on the network traffic sent
    on a configured network interface and its configured IP addresses. Internal data
    structures, such as socket structures and routing tables, can also be shown.


    Listing 6-9 shows how netstat can be used to get statistics about network interfaces.
    These statistics are also available from the lanadmin command, but lanadmin doesn''t
    provide IP address information. During periods of normal operation, the error
    rates shown here should be very low (much less than 1 percent). Note that, in
    this example, MC/ServiceGuard is being used on the system, and multiple IP addresses
    are bound to the same network interface.


    On HP-UX, use netstat -in to make sure that two network interfaces are not using
    the same network address (or subnetwork address), because this is not supported
    on HP-UX.


    With netstat, you can see protocol statistics for each of the key networking protocols.
    Listings 6-10 through 6-13 show sample output for IP, ICMP, TCP, and UDP, respectively.


    ICMP provides numerous useful error statistics. Destination unreachable errors
    can be caused by many things, including an unknown destination name, routing problem,
    or bad hardware.'
