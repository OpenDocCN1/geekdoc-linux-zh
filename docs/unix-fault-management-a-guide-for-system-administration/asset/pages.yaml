- pgno: 219
  md: 'Baan has announced that the next release of its ERP application will be instrumented
    using the ARM API, which will make collecting application performance data for
    Baan more straightforward.


    # MeasureWare


    The MeasureWare Agent is a Hewlett-Packard product that collects and logs resource
    and per-formance metrics. MeasureWare agents run and collect data on the individual
    server systems being monitored. Agents exist for many platforms and OSs, including
    HP-UX, Solaris, and AIX.


    The MeasureWare Agent collects data, summarize it, timestamp it, log it, and send
    alarms when appropriate. The agents collect and report on a wide variety of system
    resources, perfor-mance metrics, and user-defined data. The information can then
    be exported to spreadsheets or to performance analysis programs, such as PerfView.
    The data can be used by these programs to generate alarms warning of potential
    performance problems. By using historical data, trends can be discovered, which
    can help to address resource issues before they affect system performance.


    The MeasureWare agents collect data at three different levels: global system metrics,
    application, and process metrics. Global and application data is summarized at
    five-minute inter-vals, whereas process data is summarized at one-minute intervals.
    Process information is recorded only at interesting time periods, such as when
    the process starts, terminates, or exceeds a defined threshold for CPU or disk
    utilization.


    The basic categories of MeasureWare data are listed in Table 7-2. Optional modules
    for database and networking support also are available. The Data Source Integration
    (DSI) capabil-ity is used to integrate your own data with other data collected
    by the MeasureWare Agent.


    Transaction data is available for applications that are using the ARM API, described
    ear-lie. Separate log files are created for each of these categories, as well
    as a file for individual device data. However, only system and process data is
    logged by default. Many of the system metrics collected by MeasureWare are described
    in Chapter 4. This section describes the addi-tional metrics that are available
    for applications and processes.


    # Table 7-2 Categories of MeasureWare Agent Information


    <table><tr><td>Category</td><td>Metric Type</td></tr><tr><td>System</td><td>CPU,
    disk, networking, memory, process queue depth, user/process information, and summary
    information</td></tr><tr><td>Application</td><td>CPU, disk, memory, process count,
    average process wait state, and summary information</td></tr><tr><td>Process</td><td>CPU,
    disk, memory, average process wait state, overall process lifetime, and summary
    information</td></tr><tr><td>Transaction</td><td>Transaction count, average response
    time, distribution of response time metrics, and aborted transactions</td></tr></table>'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Although MeasureWare provides extensive performance and resource information,
    it provides limited configuration information and no data about system faults.
    It may be beneficial to use MeasureWare with a fault monitoring tool, such as
    EMS.


    For MeasureWare to aggregate process-level data into an application, the application
    has to be defined first. The administrator associates an application name with
    a group of processes. To define a new application, edit the file `/var/opt/perf/parm`.
    In this example, metrics are logged for an application called ORACLE, which will
    be an aggregation of process metrics collected for all processes whose names begin
    with `ora`:


    ```

    application = ORACLE

    file=ora*

    ```


    Note that wildcards can be used, which can be handy if all the individual processes
    are not known in advance, or many processes exist. Additional configuration options
    enable you to associate processes with an application, based on the process priority
    or the user or group name. Note that a process can belong to only one application,
    and MeasureWare finds the first match for the process, so be sure to list your
    most important applications first in the configuration file.


    If you want to receive messages when the MeasureWare data being logged hits certain
    thresholds, you can specify these alarm conditions in the `/var/opt/perf/alarmdef`
    configuration file. Additional alarm definition files can also be used. Alarm
    conditions are checked at the time the data is logged. The alarms can be sent
    to PerfView, IT/O, or any SNMP-capable management station. The target configuration
    information is specified in the alarm generator database (agdb).


    Actions can be performed on the local system in response to an alarm. The local
    action is one way to provide your own notification method in response to an alarm.
    For example, you can execute a Unix command to send the administrator a message.
    Note that if alarms are being sent to an IT/O agent, MeasureWare, by default,
    won''t take any local actions, under the assumption that IT/O will be configured
    to take the local actions instead of MeasureWare.


    You can have alarms sent based on conditions that involve a combination of metrics.
    For example, a CPU bottleneck alarm can be based on the CPU use and CPU run queue
    length. Durations can be specified along with an alarm condition. The condition
    must be true for the specified time before an alarm is sent. An alarm severity
    can also be specified.


    If you want MeasureWare alarms to be sent to PerfView, you need to configure this
    through the PerfView interface. The MeasureWare tool agsysdb is used to add a
    new trap destination system for SNMP alerts.


    The example in Listing 7-5 shows an alarm definition to send alerts when the finance_app
    application exceeds a limit on its CPU utilization. First, a warning alert is
    sent. If the problem persists, a critical alert is sent. Depending on how the
    alarm generator has been configured, the alarm goes to the PerfView Alarms window,
    the IT/O Message Browser, or an SNMP-based management station. Note that the application
    must also be defined in the parm file.


    MeasureWare includes a program called utility that can do a variety of tasks.
    The analyze command in the utility program is used to analyze the data in a log
    file against alarm definitions'
  merge: -1
  img_proc: true
- pgno: 221
