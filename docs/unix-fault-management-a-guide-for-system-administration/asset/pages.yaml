    # Monitoring Notes


    The mnemonic root OID for Oracle’s Private Database MIB is iso.org.dod.internet.private.ent-prises.oracle.oraDbMIB.
    If you intend to write your own SNMP application, the numeric root OID of Oracle’s
    Private Database MIB is 1.3.6.1.4.1.111.4.


    Many of the table entries in this MIB are indexed by using appIndex from the Network
    Services MIB.


    This MIB contains several fields that are useful for performance monitoring. They
    supply statistics such as the number of block changes, user calls, consistent
    Gets, block Gets, physical reads, recursive calls, user commits, and consistent
    changes. This data needs to be queried at regular intervals to establish baselines
    and to be able to determine whether a persistent performance problem exists.


    Each entry in the oraDbSysTable corresponds to a current database instance on
    the system. The table is indexed by rdbsDbIndex, from the RDBMS MIB.


    Each entry in the oraDbTablespaceTable represents a given tablespace within a
    current database instance. The table is indexed by rdbsDbIndex, from the RDBMS
    MIB, and by oraDbTablespaceIndex.'
