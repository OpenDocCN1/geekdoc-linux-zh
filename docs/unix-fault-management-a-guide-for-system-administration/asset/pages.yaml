    # linkloop


    The linkloop command is used to verify LAN connectivity. A local network management
    ID and a local or remote station address is specified, and the connectivity is
    then checked by sending test packets. In the example shown in Listing 6-4, connectivity
    is checked between lan2 (with a network management ID of 6) and a network interface
    on a remote system.


    Because linkloop tests only the physical and data link layers, the remote station
    must be on the same network segment. The test packets are not routable using IP
    addresses: you must specify the station address of the destination system instead.


    If you are unsure of the station address of a remote host, one command you can
    use is arp, which shows the current Address Resolution Protocol (ARP) cache entries.
    ARP provides the mapping between an IP address and a station address. The arp
    command also shows the host name associated with each IP address. This command
    is helpful only if connectivity has previously been established or a static ARP
    entry is being used. You may need to run lanscan on the remote system to determine
    its station address. The arp command is discussed in more detail later in this
    chapter.'
