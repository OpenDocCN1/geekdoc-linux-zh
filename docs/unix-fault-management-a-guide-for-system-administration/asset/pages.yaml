- pgno: 82
  md: '+   - DDS-2 Autoloader (A3400A)

    - DDS-3 Autoloader (A3716A)

    - DLT 4000 4/48 Library; HP-UX; Differential SCSI (A3544A)

    - DLT 4000 2/48 Library; HP-UX; Differential SCSI (A3545A)

    - DLT 4000 2/28 Library; HP-UX; Differential SCSI (A3546A)

    - DLT 4000 & 7000; 2/28; Drives Differential; Robotics SE/Diff (A4850A)

    - DLT 4000 & 7000; 15 slot; Deskside/Rack; Differential (A4851A)

    - DLT 4000 & 7000; 4/48; Drives Differential; Robotics SE/Diff (A4855A)

    - DLT 4000 & 7000; 588 slot; Drives Diff; Robotics SE (A4845A)

    - DLT 4000 & 7000; 100 slot; Drives Diff; Robotics SE (A4846A)

    - DLT 4000 & 7000; 30 slot; Differential (A4853A) Channel Adapters


    These EMS Hardware Monitors are designed to provide consistency in the configuration
    interface, event detection, and message formats that provide a detailed description
    of a problem and a recommended recovery action.


    The EMS Hardware Monitors can report low-level device errors that are encountered
    during an I/O session with a device. They detect and report component and Field
    Replaceable Unit (FRU) failures, including fan and power supply problems. Protocol
    errors are also detected.


    For monitoring tape devices, events include problems reading or writing data,
    bad tapes, wrong tapes, temperature problems, tape loader errors, tape changer
    problems, and incorrect firmware. For monitoring system memory, the monitor checks
    the page deallocation table and reports an event when the table is 60, 90, or
    100 percent full. This indicates that a new memory SIMM (Single In-line Memory
    Module) should be added to replace a failed memory chip. These threshold values
    are configurable.


    The monitor assigns hardware events severity levels, which reflect the potential
    impact of an event on system operation. Table 4-3 provides a description of each
    severity level.


    EMS Hardware Monitor configuration is done by using the Hardware Monitoring Request
    Manager. Notification conditions can be configured in a consistent way for all
    supported hardware resources on the system. As hardware is added to the system,
    monitoring can be enabled automatically. Figure 4-3 shows an example of using
    the Hardware Monitoring Request Manager to send SNMP traps of all critical and
    serious tape and memory events. To configure with MC/ServiceGuard, you need to
    use the MC/ServiceGuard configuration interface.


    The EMS Hardware Monitors provide fault information only. No performance-related
    events are included.


    When an EMS Hardware Monitor detects an event, a notification message is sent
    to the designated target locations. The message contains a full description, including
    the system on which the event occurred, the date and time when the event was detected,
    the hardware device on which the event occurred, a description of the problem,
    the probable cause, and recommended action. The event message contains detailed
    information, including product/device identification information, I/O log event
    information, raw hardware status, SCSI status, and more.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Table 4-3 Description of Hardware Event Severity

    | Severity | Description |

    | :--- | :--- |

    | Critical | An event that will or has already caused data loss, system downtime,
    or other loss of service. Immediate action is required to correct the problem.
    System operation will be impacted and normal use of the hardware should not continue
    until the problem is corrected. If configured with MC/ServiceGuard, the package
    will experience failover. |

    | Serious | An event that may cause data loss, system downtime, or other loss
    of service if left uncorrected. The problem should be repaired as soon as possible.
    System operation and normal use of the hardware may be impacted. If configured
    with MC/ServiceGuard, the package will experience failover. |

    | Major Warning | An event that could escalate to a more serious condition if
    not corrected. The problem should be repaired at a convenient time. System operation
    should not be impacted and normal use of the hardware can continue. If configured
    with MC/ServiceGuard, the package will not experience failover. |

    | Minor Warning | An event that will not likely escalate to a more serious condition
    if left uncorrected. The problem can be repaired at a convenient time. System
    operation will not be interrupted and normal use of the hardware can continue.
    If configured with MC/ServiceGuard, the package will not experience failover.
    |

    | Information | An event that occurs as part of the normal operation of the hardware.
    No action is required. If configured with MC/ServiceGuard, the package will not
    experience failover. |


    Most EMS Hardware Monitors are “stateless.” In other words, events of the designated
    severity are forwarded as soon as they are detected; no aspect of history or correlation
    with other data is involved, except that the monitor limits repeated messages
    by using a repeat frequency. Determining the current status of a device is difficult,
    because messages are sent only when an event occurs.


    To monitor for hardware device state changes, you can use a Peripher al Status
    Monitor (PSM), which maintains the state of monitored hardware devices and reports
    state changes. The PSM gathers events from the other EMS Hardware Monitors, but
    does not send its own notification unless a state change has occurred. By default,
    critical or serious events cause the PSM to change a device''s status to Down.


    For example, critical tape events from a tape monitor would cause the PSM to change
    the device''s status to Down. The PSM would then send a single “Tape device status
    = Down” event if the administrator had requested to be notified of such an event.
    This may be the only message visible to the administrator. Additional disk failure
    messages would not be forwarded because they are not the result of a status change
    (in other words, the status remains Down). This reduces the number of events that
    need to be processed by the user. The last event received should reflect the current
    device status.'
  merge: -1
  img_proc: true
