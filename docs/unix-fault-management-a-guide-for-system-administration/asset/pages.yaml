  md: "One rdbmsDbTable entry is likely to correspond to multiple tablespace table\
    \ entries. For example, addition to indicating the amount of space allocated and\
    \ in use, the state variable oraDbTablespaceState indicates whether the tablespace\
    \ is offline or accessible.\n\nThe oraDbDataFileTable keeps track of the number\
    \ of disk reads and writes being made to a data file. The oraDbConfigTable stores\
    \ important database configuration parameters, such as **DB\\_BLOCK\\_BUFFERS**,\
    \ which is used to determine the buffer cache size.\n\nThe oraDbLibraryCacheTable\
    \ keeps track of performance data about the library cache. Variables in this table,\
    \ such as oraDbLibraryCachePins and oraDbLibraryCacheReloads, can be used to calculate\
    \ the library cache miss rate. Each table entry represents a given library cache\
    \ within a current database instance on the system. The oraDbLibraryCacheSumTable\
    \ provides summary information for all the library caches in a database instance.\n\
