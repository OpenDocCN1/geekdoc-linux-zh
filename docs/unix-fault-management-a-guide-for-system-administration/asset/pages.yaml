- pgno: 131
  md: '+   * Fast/Wide SCSI disk arrays

    * Standalone SCSI and fibre channel disks

    * Fibre channel SCSI multiplexors

    * Fibre channel adapters

    * Fibre channel arbitrated loop hubs


    These EMS Hardware Monitors are designed to provide a commonality in the configuration
    interface, event detection, and message formats, which include a detailed message
    describing the problem and how to fix it.


    The EMS Hardware Monitors can report low-level device errors encountered during
    an I/O with a device. They detect and report component and FRU failures, including
    fan and power supply problems. Protocol errors are also detected.


    Hardware monitoring is critical for maintaining a system’s high availability.
    For example, when using an AutoRAID disk array, two controllers may be used for
    high availability. The AutoRAID Monitor reports events that could indicate the
    failure of a controller. These events could result in a loss of hardware redundancy.
    Other events indicate a potential loss of data redundancy, such as the failure
    of a disk component or the failure to recover data redundancy after a component
    failure. Many events may indicate a SPOF and the loss of high availability. Notification
    of these events is critical so that the failure can be fixed to eliminate the
    risk of downtime.


    Hardware events are assigned a severity level by the monitor. These severity levels
    reflect the potential impact of the event on system operation. Table 5-3 provides
    a description of each severity level.


    Table 5-3 Description of Hardware Event Severity

    | Severity | Description |

    | Critical | An event that will or has already caused data loss, system downtime,
    or other loss of service. Immediate action is required to correct the problem.
    System operation will be affected and normal use of the hardware should not continue
    until the problem is corrected. If configured with MC/ServiceGuard, the package
    will experience failover. |

    | Serious | An event that may cause data loss, system downtime, or other loss
    of service if left uncorrected. The problem should be repaired as soon as possible.
    System operation and normal use of the hardware may be affected. If configured
    with MC/ServiceGuard, the package will experience failover. |

    | Major Warning | An event that could escalate to a more serious condition if
    not corrected. The problem should be repaired at a convenient time. System operation
    should not be affected, and normal use of the hardware can continue. If configured
    with MC/ServiceGuard, the package will not experience failover. |

    | Minor Warning | An event that will not likely escalate to a more serious condition
    if left uncorrected. The problem can be repaired at a convenient time. System
    operation will not be interrupted, and normal use of the hardware can continue.
    If configured with MC/ServiceGuard, the package will not experience failover.
    |

    | Information | An event that occurs as part of the normal operation of the hardware.
    No action is required. If configured with MC/ServiceGuard, the package will not
    experience failover. |'
