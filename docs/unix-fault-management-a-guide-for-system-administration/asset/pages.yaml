    unnecessarily waiting for it to respond. The EMS monitor queries only the critical
    components by comparison.


    The EMS event management libraries have been used by a number of system components
    on HP-UX to provide monitoring. IBM recently announced a similar set of event
    management routines, called Phoenix, for its AIX environments, which it hopes
    will be adopted by its software development partners. Sun does not provide event
