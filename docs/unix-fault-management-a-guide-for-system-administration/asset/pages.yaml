    # Enterprise SyMON


    Sun’s Enterprise SyMON is a system management platform for monitoring and managing
    the Sun systems in your enterprise. Enterprise SyMON provides administrators the
    capability to manage all of their Sun systems remotely from a common interface.
    Enterprise SyMON can automatically discover the Sun systems in the environment.
    Intelligent SyMON agents run on each system, to provide monitoring and remote
    management capabilities.


    The console layer of Enterprise SyMON provides a visual representation of all
    managed objects. The console layer provides several views of the enterprise, including
    logical views and topological views. The Logical View window provides a hierarchical
    representation of the systems being managed. Indicators are used on system icons
    to indicate the alarm status of the system. As shown in Figure 4-4, you can see
    the status of the systems in the payroll domain. Badges on each system icon indicate
    the alarms for the node. The Domain Status Summary at the top of the window shows
    how many alarms are outstanding in each category. Figure 4-4 shows no down alarms,
    two critical alarms, one alert, one caution, and no disabled. So, Comptroller
    Workstation has a caution-level alarm outstanding.


    When a critical event occurs, such as a hardware component failure, it is indicated
    in the Logical View window. As the event occurs, the failed hardware component
    is also highlighted in the Physical View window. You can use this photo-like view
    of the system to detect and isolate failed or failing components. As shown in
    Figure 4-5, the Physical View indicates that board 3 is disconnected, and highlights
    the back panel of the server to show you where the board is.


    Enterprise SyMON provides event and alarm management. Alarms and actions can be
    configured so that events are sent via SNMP traps to the SyMON console when certain
    conditions or thresholds are met. Event-based actions and notifications, such
    as e-mail, can also be configured. Recovery actions can be associated with an
    event. Additional events can be defined and generated by placing rules written
    in the TCL scripting language in a special directory. SyMON provides features
    for correlating events and filtering based on priority and severity.


    SyMON provides intelligent agents, which run on the systems being monitored. The
    agents are configured with intelligence to detect abnormal conditions, to generate
    alarms based on default or customized thresholds, and to perform actions automatically,
    based on certain predefined events.'
