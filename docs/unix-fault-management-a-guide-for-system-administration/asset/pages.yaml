- pgno: 342
  md: '# **Figure A-4** DMI architecture.


    ![](img/eae88b61ada165139a1d9b546a34140b_342_0.png)


    +   • **Event type:** Provides the reason for the event.

    • **Event severity:** Describes the type of event. Severities of OK, Non-Critical,
    Critical, and Non-Recoverable are used for state-based events. A severity of Monitor
    is used for an expected periodic event; a severity of Information is used for
    a nonperiodic event.

    • **Whether event is state-based:** State-based event generators are expected
    to generate no more than one event of any given event type for each relevant state
    transition. Events with an OK severity are expected to clear each of these events.
    An event generator that is not state-based sends an event for each condition that
    occurs, and doesn''t send corresponding OK events.

    • **Event state key:** Refers to the number of the row in the event state group
    that is associated with the component. This is used only for state-based events.

    • **Associated group:** Identifies the group generating the event.

    • **Event system:** Refers to the specific part of the component causing the event.

    • **Event subsystem:** Also refers to the specific part of the component causing
    the event.


    Optional fields that can be part of an event include a recommended corrective
    action and vendor-specific data.


    The event data received by an application is a DmiMultiRowData structure. The
    first DmiRowData structure contains the foregoing event attributes. A second DmiRowData
    structure is used when the group generating the event has multiple instances.
    A *key* refers to the specific instance generating the event. The third DmiRowData
    structure is used when an event is forwarded to its eventual destination, and
    it contains the address of the source system. Additional rows contain any proprietary
    information that might be associated with the event.


    Additional information about DMI data structures and current MIF specifications
    can be found in the DMTF''s *Desktop Management Interface Specification* on the
    Web at http://www.dmtf.org.'
  merge: -1
  img_proc: true
