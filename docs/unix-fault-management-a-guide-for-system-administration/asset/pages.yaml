    # ## PerfView


    PerfView is a graphical performance analysis tool from Hewlett-Packard. It is
    used to graphically display performance and system resource utilization for one
    system or for multiple systems simultaneously, so that comparisons can be made.
    A variety of performance graphs can be displayed. The graphs are based on data
    collected over a period of time, unlike the real-time graphs of GlancePlus. This
    tool runs on HP-UX or NT systems and works with data collected by MeasureWare
    agents.


    **Figure 7-3** GlancePlus shows transaction data.


    ![](img/eae88b61ada165139a1d9b546a34140b_226_0.png)'
