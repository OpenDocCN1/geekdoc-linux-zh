    # uname


    The uname command can be used to display configuration information about your
    system. This information includes the operating system name, machine model, and
    operating system version.


    You may want to gather this information and store it for later use. This may be
    useful if you are trying to keep all of your systems on the same release of the
    operating system, for example.


    # uptime


    The uptime command is probably the most commonly used command to check system
    resources. This command shows the current time, length of time the system has
    been up. number of users logged on, and the average number of jobs in the run
    queue for the last 1, 5, and 15 minutes.


    Using uptime with the -w option shows a summary of the current activity on the
    system for each user. As shown in Listing 4-11, you can see the login time, CPU
    usage, and command activity for each user.


    # vmstat


    The vmstat command provides good information about system resources, including
    virtual memory and CPU usage, and is useful for detecting whether you are low
    on memory or swap space.


    Listing 4-11 Output from the uptime command showing paging activity.


