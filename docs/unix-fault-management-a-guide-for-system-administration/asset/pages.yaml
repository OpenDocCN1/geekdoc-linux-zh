    # ## Using Disk Performance Data


    To address disk performance problems, you first need to collect the appropriate
    data. MeasureWare and BMC PATROL are two examples of tools that collect the necessary
    performance metrics. This'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'section provides a brief overview of how to interpret the data to determine
    whether a disk performance problem exists.


    This chapter shows only those metrics related directly to disks. However, you
    should also study system and application-related performance information, because
    disk information alone may not be sufficient to solve a problem. MeasureWare provides
    a lot of information about an application''s disk utilization that may need to
    be correlated with system data. For example, the root cause of a disk performance
    problem may be an I/O-intensive application that is not supposed to be running
    during production hours. Looking at application and system data in conjunction
    with disk data can help to find the culprit.


    All performance monitoring tools can provide system CPU utilization information.
    If an application''s response time is low, and the system''s CPU utilization is
    less than 95 percent, this may be an indication that a disk bottleneck exists.
    Other important metrics are disk utilization, disk queue lengths, and the time
    the system spends waiting for I/O to complete.


    To avoid disk bottlenecks, you need to balance I/O across filesystems, disk spindles,
    and disk controllers to reduce uneven queueing and delays. Performance monitoring
    tools, such as GlancePlus, can be used to find the process with the highest I/O
    rate, and also the busiest physical disk. Checking only the I/O rate is insufficient,
    because a slower device will have a higher utilization than a faster disk with
    the same I/O rate. If a single disk has greater than 50-percent utilization for
    an extended period of time, this may be an indication of an I/O bottleneck. The
    percentage should be compared with that of other disks to see whether a severe
    load imbalance exists. However, high utilization is not sufficient to identify
    a problem. The disk may still be capable of handling more I/O. A continually long
    disk queue length must be present to indicate a problem. Heavily used disks are
    also likely to have long disk queue lengths.


    Both BMC PATROL and MeasureWare collect read cache hit ratio information. Determining
    how many logical reads are satisfied by the system''s buffer cache is an indication
    of whether the cache size was configured correctly. Because increasing the cache
    size negatively affects the system memory available for other purposes, the appropriate
    cache hit ratio depends on the type of workload being run on the system. For I/O-intensive
    applications, you may want to configure your system such that this ratio is as
    high as about 90 or 95 percent. Similarly, you may want to ensure that your write
    cache hit ratio is at least 75 percent. If your hit rates are too low, the system
    buffer cache may be too small.


    After you determine that the system buffer cache is too small, you can increase
    its size on HP-UX by using SAM. Select Configurable Parameters from the Kernel
    Configuration functional area. The appropriate parameter to modify depends on
    whether a static or dynamic buffer cache is being used, but this can be checked
    on this screen as well. *Fixed-size buffer caches* are most effective if the environment
    and workload are static. *Dynamic buffer caches* fluctuate in size based on demands
    for I/O or virtual memory, and are useful when workloads vary. If the *nbuf* and
    *bufpages* system parameters are set to zero, then a dynamic buffer cache is in
    use. When using a dynamic buffer cache on systems with greater than 1GB of real
    memory, you should lower the maximum size below 50 percent, because caches greater
    than 500MB actually cause performance degradations.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The Process Resource Manager (PRM) can be used to control system CPU, real
    memory, and I/O bandwidth allocations between users and applications. Users or
    applications are assigned to PRM groups, and each group is configured with the
    desired system resource entitlement. This can help to provide application isolation,
    by preventing one application from affecting the performance of another application.
    CPU controls alone are often sufficient, but sometimes, an I/O-intensive application
    may be using very little CPU. Other applications that need to use the same I/O
    interface may be starved. If multiple applications are sharing access to a volume
    group, PRM can be used to allocate an appropriate minimum entitlement of disk
    bandwidth to each. PRM can throttle disk throughput for PRM groups by ordering
    logical I/O requests, so that requests for lower-priority processes are delayed,
    allowing requests from higher-priority processes to get through. Resource capping
    isn’t available for I/O bandwidth, so an application can use all of the available
    bandwidth if no other applications need it.


    PRM controls disk bandwidth only for disks under LVM. Determining the best entitlements
    to configure may be difficult and may require some experimentation. Before enabling
    a disk bandwidth configuration in PRM, you can collect data on the current usage
    of different PRM groups. This can be done by first configuring the CPU entitlements
    in PRM with no disk records specified. The prmonconfig and prmonitor commands
    can then be used to collect current usage statistics for a specified volume group.
    PRM is available only on HP-UX.


    If GlancePlus is available, PRM behavior can be shown on the GlancePlus screens.
    For example, the actual I/O bandwidth used by each PRM group can be shown. Also,
    GlancePlus can be used to change PRM resource group entitlements.


    These are just a few examples of how disk information can be used to address performance
    problems.


    # ## Avoiding Disk Problems


    The previous section discussed how to use performance data to fix disk performance
    problems. Proper configuration can help you to avoid performance problems. Commands
    such as *newsfs* and *tunefs* can be used for the High-Performance File System
    (HFS) to set block size and reduce the number of inodes.


    The best way to avoid disk faults is to configure for redundancy and monitor critical
    disk resources proactively. Products exist at the hardware level that provide
    both data redundancy and redundant hardware components. Monitoring for hardware
    faults provides failure notification of redundant components. Although these faults
    may not cause data to be unavailable, the problems should be fixed immediately.
    Otherwise, a subsequent failure could cause a loss of data or availability.


    Tools such as HP Predictive Support help to indicate when disks are likely to
    fail. You can also monitor hardware device events, so that you can replace a disk
    during nonproduction hours (planned downtime), instead of waiting for it to fail.
    Similarly, use the EMS DVM to detect the loss of a mirror, and then replace the
    disk before another drive fails.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'At the resource level, you need to ensure that the filesystems are accessible.
    Monitoring the configuration and resource status can help to ensure that the filesystems
    are up and accessible to those who require them. Monitoring filesystem usage is
    critical. If a filesystem fills up, applications may have failures. By using tools
    such as Online JFS, you can increase filesystem capacity online, without affecting
    availability. By using three-way mirroring, you can perform backups on one mirror,
    while still maintaining data redundancy.


    You should monitor free space on all disk drives to see whether you are nearing
    configured limits. The EMS File System Monitor can be used for this purpose. Archive
    files that have not been used for a long time, and remove them from the system.
    You can use commands such as du to view the usage for each directory and locate
    large files.


    The availability of tools may depend on the filesystem being used. A journalled
    filesystem can track updates to a file, so that if the file is damaged, it can
    then be recovered. Online JFS is an optional product that can be used in conjunction
    with a journalled filesystem. Online JFS can create large file extents to avoid
    fragmentation, perform online filesystem resizing when a filesystem nears its
    configured limit, and provide data on fragmentation that is occurring. Online
    JFS has a defragmentation capability as well. Directories and extents can be reorganized
    by using the fsadm command.


    # Recovering from Disk Problems


    If you are unable to avoid a disk problem, a variety of tools can help you recover,
    depending on the problem you are facing. Recovering from system misconfigurations,
    load imbalances, and disk failures is discussed in this section.


    Many tools and techniques are available to help correct a disk load imbalance
    after it is discovered. Frequently accessed files and swap areas can be spread
    over different filesystems, spindles, and disk controllers. Disk striping and
    LVM can be used to spread access across multiple disks. LVM stripe sizes are defined
    when logical volumes are created. You need to understand I/O access patterns so
    that you can set the appropriate stripe sizes. More disks may need to be added
    so that the load can be spread out effectively.


    You may want to dedicate disks to a single application to avoid contention problems.
    A more drastic solution to a performance problem may be to move an application
    and its data to another system, on which it may have more exclusive access to
    system resources, including CPU and memory. In some cases, you may be able to
    study and redesign an application to make fewer disk I/Os.


    As long as you have been making regular system backups, you should be able to
    recover without a loss of data.


    # Comparing Disk Monitoring Products


    The best way to keep track of your disk configuration is to use the UNIX commands
    provided with the operating system, such as ioscand and vgdisplay. The information
    tools in STM can provide additional configuration information, such as the firmware
    revision and serial numbers. You may want to save all of this output for comparison
    purposes later. Then, if a disk problem occurs, the'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'configuration history can help to track when a change was made. The System
    Administration Manager presents a textual summary of the disk configuration for
    HP-UX systems. On Sun Solaris systems, Enterprise SyMON can be used to graphically
    display the physical system layout.


    If configuration information needs to be collected from a variety of systems,
    querying the system MIB by using a MIB Browser may be more efficient, especially
    for multiplatform environments, because you will need to remember using only one
    tool to get the information.


    Disk failures can be detected initially by using EMS DVM, or the EMS Hardware
    Monitors for the appropriate hardware device. EMS DVM is unique in that it can
    also be used to detect the loss of a disk mirror. After a problem is reported,
    you may use STM for further diagnosis. These products are available only on HP-UX.
    Enterprise SyMON provides some basic hardware diagnostics for Sun Solaris environments,
    including the ability to send events for disk failures.


    To avoid the need to monitor and repair disk devices, you may want to establish
    a support contract with Hewlett-Packard. In that case, disk problems are reported
    directly to the Hewlett-Packard Response Center, and based on trending information
    collected by HP Predictive, a support engineer may be sent to replace the disk
    before a failure actually occurs.


    MeasureWare and BMC PATROL have comparable disk monitoring functionality, and
    both primarily provide disk performance metrics. The choice of tool is likely
    to depend on the other activities that you are doing. For example, PerfView receives
    its information only from MeasureWare agents. BMC PATROL and MeasureWare can both
    send information to IT/O. BMC PATROL''s UNIX KM, which provides disk metrics,
    can be used with a wide variety of other KMs. Both tools collect a large amount
    of data, so you may want to analyze how each performs in your environment before
    you select one.


    # Case Study: Configuring and Monitoring for Mirrored Disks


    At Silicon Valley Hospital, Nancy Jergens is responsible for maintaining patient
    records on the hospital''s records computer system. To provide extra data protection
    and high availability, she has decided to use MirrorDisk/UX to mirror the /patient
    filesystem containing the patient records.


    Nancy sets up two-way mirroring on the logical volume containing the patient records.
    The logical volume lvol_patients is mounted at /patient.


    # Verifying Configuration


    After Nancy configures the mirroring, she verifies the configuration by using
    the lvdisplay command. As shown in Listing 5-12, Nancy verifies that the logical
    volume, lvol_patients, is available and mirrored with one copy.


    # Setting Up Monitoring


    Nancy knows that if one of her mirrored copies fails, her patient data will be
    protected, because she has another copy. But, she wants to be told when she has
    only one copy left. Unless she monitors for this, she won''t be told when a mirrored
    copy fails.'
  merge: -1
  img_proc: true
