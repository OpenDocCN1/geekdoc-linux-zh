    # PerfView


    PerfView is a graphical performance analysis tool from Hewlett-Packard. It is
    used to graphically display performance and system resource utilization for one
    system or for multiple systems simultaneously, so comparisons can be made. A variety
    of performance graphs can be displayed. The graphs are based on data collected
    over a period of time, unlike the real-time graphs of GlancePlus, which show only
    recent history. PerfView runs on HP-UX or NT systems and works with data collected
    by MeasureWare agents.


    PerfView has three main components:


    +   - **PerfView Monitor**: Provides the ability to receive alarms. A textual
    description of an alarm can be displayed. Alarms can be filtered by severity,
    type, or source system. Also, after an alarm is received, the alarm can be selected,
    which displays a graph of related metrics. An operator can monitor trends leading
    to failures, and can then take proactive actions to avoid problems. Graphs can
    be used for comparison between systems and to show a history of resource consumption.
    An internal database is maintained that keeps a history of alarm notification
    messages.


    +   - **PerfView Analyzer**: Provides resource and performance analysis for disks
    and other resources. System metrics can be shown at three different levels: process,
    application (configured by the user as a set of processes), and global system
    information. It relies on data received from MeasureWare agents on the managed
    nodes. Data can be analyzed from up to eight systems concurrently. All MeasureWare
    data sources are supported. PerfView Analyzer is required by both PerfView Monitor
    and PerfView Planner.


    +   - **PerfView Planner**: Provides forecasting capability. Graphs can be extrapolated
    into the future. A variety of graphs (such as linear, exponential, s-curve, and
    smoothed) can be shown for forecasted data.


    In addition to graphing and analyzing system resources, process and application
    resources can be graphed and analyzed using PerfView. With PerfView, users can
    define the set of processes that make up an application. PerfView can then be
    used to show a history of a specified application’s utilization. PerfView’s ability
    to show history and trend information can be'
  merge: -1
  img_proc: true
