    \ gsyviewl\nName Server:\tcup44ux.cup.hp.com\nAddress:\t15.27.217.36\n\nName:\t\
    \tgsyviewl.cup.hp.com\nAddress:\t15.13.174.132\n```\n\nof the success of the request,\
    \ ftp tells you the transfer rate. While connected, you can check the status of\
    \ the remote FTP session by using the status FTP command, as shown in Listing\
    \ 6-18.\n\nftp denies access to the local user accounts listed in /etc/ftpusers,\
    \ so be sure to check this file if ftp is not working for certain users.\n\n#\
    \ ## Monitoring NFS\n\nThe Network File System is meant to give users a transparent\
    \ view of remote filesystems, and to make those remote filesystems appear to be\
    \ attached locally. NFS can be a useful tool to share filesystems to save disk\
    \ space and make management easier. All NFS clients share the single copy of the\
    \ file that is stored on the NFS server. The downside of the transparency is that\
    \ a client may not be aware of the network traffic they are causing by reading\
    \ a simple file. Also, the client may not know that others are simultaneously\
    \ accessing the files.\n\nNumerous things can go wrong with NFS. Processes can\
    \ die or hang. The key processes for NFS are nfsd, automount, lockd, statd, and\
    \ portmap. The status of these processes can be checked with the ps command.\n\
    \nNFS requests are processed by NFS server daemons (nfsd). These daemons read\
    \ requests from a single UDP socket. The number of daemons is adjustable, with\
    \ the optimal number dependent on system load and NFS activity. If you do not\
    \ have enough daemons running, then the kernel may drop some NFS requests when\
    \ they arrive, to avoid overflowing the storage area\n\n# **Listing 6-18** Output\
    \ from FTP status command showing status of remote machine.\n\n```\nftp> status\n\
    Connected to hpssc16.cup.hp.com.\nNo proxy connection.\nMode: stream; Type: binary;\
    \ Form: non-print; Structure: file\nVerbose: on; Bell: off; Prompting: on; Globbing:\
    \ on\nStore unique: off; Receive unique: off\nCase: off; CR stripping: on\nNtrans:\
    \ off\nNmap: off\nHash mark printing: off; Use of PORT cmds: on\nftp>\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: 'reserved for these packets. You can detect this problem by checking the number
    of UDP socket overflows using netstat –s. Increasing the number of daemons should
    reduce socket overflows and increase NFS performance. However, no tools exist
    to help you determine how many daemons to add. An excess of NFS daemons may be
    identified through an increasing load average on the server. Also, because the
    number of overflows is a system-wide statistic, the problem may be due to another
    UDP application. You may want to use netstat to show the current UDP activity,
    before you assume that any problems are due to NFS.


    If you are responsible for monitoring NFS, you should also check the status of
    exported file systems, and disks to see whether they are full or unavailable.
    NFS statistics should be checked to see whether NFS timeouts have been reported.
    MeasureWare collects statistics on the number and rate of NFS requests during
    a time interval. BMC PATROL provides a tool with its UNIX KM to monitor NFS activities
    and Remote Procedure Calls (RPCs).


    # nfstat


    The nfstat output can give you an idea of the type of NFS workload occurring in
    your environment. This can be useful if you want to establish benchmarks to measure
    your typical server load.


    nfstat can report information for an NFS client, an NFS server, or both. The example
    in Listing 6-19 shows the statistics for an NFS client.


    The bad transaction identifier (XID) metric indicates the number of times replies
    are received without a request outstanding. This could be an indication that client
    requests are timing out too quickly and being resent. If the client has many bad
    XID packets and timeouts, you should increase the timeout value by using the mount
    utility.


    A large number of symbolic link resolutions on the server may indicate that the
    client has configured inappropriate names as mount points.


    Listing 6-19 Output showing a client''s NFS statistics.


    ```

    # nfstat -c


    Client rpcs:


    calls   badcalls retrans  badxid   timeout   wait   newcred

    200     0        0        0        0        0     0


    Client nfs:


