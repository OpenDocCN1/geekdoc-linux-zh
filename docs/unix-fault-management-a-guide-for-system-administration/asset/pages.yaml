    weekend.


    # ## Using Event Monitoring Tools


    This section covers various event monitors that are available for monitoring system
    resources. You can configure event monitors to generate a message when a change
    in status occurs or when a pre-defined threshold condition is met. This is different
    from commands, which give you status reports only when asked, and performance
    monitoring, which is generally studied over a long period of time. Event monitors
    generate a notification message soon after faults and events occur.


    # ## Event Monitoring Service


    Several monitors discussed in this section are integrated into the Event Monitoring
    Service (EMS) framework. The EMS framework, available only on HP-UX systems, enables
    monitors to be provided in a consistent manner for a system. Although the EMS
    framework itself is freely available, some monitors are delivered with HP-UX Online
    Diagnostics, some are sold separately, and others are bundled with the individual
    products for which they provide monitoring.


    EMS provides a consistent GUI for the discovery and configuration of resources
    that can be monitored. Using EMS, you can define conditions that indicate when
    notification events should be sent, which can be at periodic intervals, when a
    component’s state changes, or when a threshold condition is met. EMS also enables
    you to configure where events should be sent. You can configure EMS to send events
    to OpenView IT/O, directly to any SNMP-capable management station, to a network
    application listening on a TCP or UDP port, to an e-mail address, or locally to
    the console, system log file, or a regular log file. Furthermore, you can configure
    MC/ServiceGuard to make packages dependent on these EMS resources.


    EMS monitors provide help primarily with fault and resource management. Performance
    monitoring generally requires more sophisticated tools. Some system fault and
    resource monitoring capabilities are provided by the EMS HA Monitors product,
    discussed in the next section. Other EMS monitors allow you to detect when you
    are getting low on system resources, such as file descriptors, shared memory,
    and system semaphores.


    Templates for formatting EMS SNMP traps into various enterprise management platform
    Event Browsers, including OpenView, CA Unicenter, and other freely available EMS
    tools, are'
