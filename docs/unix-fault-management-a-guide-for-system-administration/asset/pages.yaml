- pgno: 132
  md: 'EMS Hardware Monitor configuration is done using the Hardware Monitoring Request
    Manager. Notification conditions can be configured in a consistent way for all
    of the supported hardware resources on a system. As hardware is added to the system,
    monitoring can be enabled automatically. Figure 5-4 shows an example of using
    the Hardware Monitoring Request Manager to send e-mail notification of all critical
    and serious hardware events. To configure with MC/ServiceGuard, you need to use
    the MC/ServiceGuard configuration interface.


    When an EMS Hardware Monitor detects an event, a notification message is sent
    to the designated target locations. The message contains a full description, including
    the system on which the event occurred, the date and time when the event was detected,
    the hardware device on which the event occurred, a description of the problem,
    the probable cause, and a recommended action. Figure 5-5 shows the detailed message
    for a media failure event on a SCSI disk. Although not shown, the message contains
    more detailed information, including product/device identification information,
    I/O log event information, raw hardware status, SCSI status, and more.


    # Figure 5-4 Using the Hardware Monitoring Request Manager to configure hardware
    monitoring.


