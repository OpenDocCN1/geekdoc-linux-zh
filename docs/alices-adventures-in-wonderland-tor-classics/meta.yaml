    **ABDULLAH:** Your last comment shows that you are a Muslim not a Christian and
    if you really love God and His Messenger Jesus, you will follow Islam and Prophet
    Muhammad. Break this barrier inside you and come back to the way of your ancestors.
    You are now free because you are looking for the Truth and our great prophet Jesus
    told us that we should look for the Truth and the Truth will set us free. So,
    you will be a free man as soon as you accept It. Be strong enough to accept Islam
    as the Truth, without any hesitation on your part and you will taste real freedom
    and real happiness that you have never tasted before.


    **DEREK:** Frankly, I am concerned about the negative way Islam and Muslims are
    shown in the media. In the West, there is a stigma attached to being a Muslim
    and I''m not sure I''m ready to live with that stigma.


    **ABDULLAH:** This is why I have chosen to tell people about the right picture
    of Islam.


    **DEREK:** Then, what is the right picture of Islam?


    **ABDULLAH:** The right picture of Islam is conveyed in the Qur''an, which is
    exemplified by Prophet Muhammad peace be upon him. The reality is that it is not
    fair to judge a religion by the actions of its followers alone because there are
    good and bad followers in every religion. The correct'
  - '[PAGE 5]


    thing to do is to judge a religion by its documented revelation from God and the
    prophet who brought that revelation.


    **DEREK:** I see. I agree with you, but I''m still concerned about the reaction
    of my family and friends if they know that I am a Muslim.


    **ABDULLAH:** On Judgement Day, no one will be able to help you, not even your
    father, mother or any of your friends (see Qur''an 31:33). So, if you believe
    that Islam is the True religion, you should embrace it and live your life to please
    the One Who created you. Be an illuminating torch for them. Do not delay your
    coming to Islam. If you die before becoming a Muslim, then it''s too late (see
    Qur''an 2:132, 3:102, 3:85). So grab this opportunity now. You can only remedy
    this pain inside you by becoming a Muslim and being able in the future, God willing,
    to come and perform pilgrimage (Hajj).


    **DEREK:** You are very wise man, I want to say that when I sometimes see on the
    satellite, especially in the season of Hajj, people of different colors and different
    races sitting side by side and praying to God, I feel pain deep inside my heart
    and I feel something urging me to talk with someone to know more about that great
    religion that can gather all the races in the same place. Thanks to you, I have
    found that person. So please help me become a Muslim!


    **ABDULAH:** Brother let us take it step by step. First, enter Islam by saying:
    I BEAR WITNESS THAT THERE IS NO GOD WORTHY OF WORSHIP EXCEPT ALLAH. AND I BEAR
    WITNESS THAT MUHAMMAD IS HIS SERVANT AND MESSENGER. I BEAR WITNESS THAT JESUS
    IS HIS PROPHET AND MESSENGER. Let us say this again, I BEAR WITNESS THAT THERE
    IS NO GOD WORTHY OF WORSHIP EXCEPT ALLAH AND I BEAR WITNESS THAT MUHAMMAD IS HIS
    SERVANT AND MESSENGER. I BEAR WITNESS THAT JESUS IS HIS PROPHET AND MESSENGERS.
    I BEAR WITNESS THAT JESUS IS HIS PROPHET AND MESSENGER.


    **DEREK:** I BEAR WITNESS THAT THERE IS NO GOD WORTHY OF WORSHIP EXCEPT ALLAH.
    I BEAR WITNESS THAT MUHAMMAD IS HIS SERVANT AND LAST MESSENGER. I BEAR WITNESS
    THAT EISA IS HIS SERVANT AND MESSENGER.


    **ABDULLAH:** By the way, Jesus'' name is not Jesus. It is a latinized name. His
    real name is Eisa. Now you will say the same thing in Arabic, the language of
    the Qur''an. I will transliterate for you. ASH''HADU AN LA''ILAHA ILLA ALLAH WAASH''HADU
    ANNA MUHAMMMADAN RASOOLULLAH WA ASH''HADU ANNA EISA ABDULLAHI WA RASOOLUHU.


    **DEREK:** ASHADU AN LA ILAHA ILLALLAH WA ASHADU ANNA MUHAMMADAN RASULULLAH WA
    ASHADU ANNA EISA ABDULLAHI WA RASOOLUHU.'
  - '[PAGE 6]


    **ABDULLAH:** Brother, say ALLAH is the greatest because you are a Muslim now.
    You are not a Christian anymore. Your are in the House of Islam. If I were with
    you, I would hug you as my brother in Islam. How do you feel now? A burden has
    been removed from you and you feel like you are so light, isn''t this right?


    **DEREK:** If you were with me now, you would have seen my tears reaching my neck.
    You are a great brother. I feel that I have just come to life, This is exactly
    how I feel from now. I don''t have to listen the silly words of the priests in
    the church, who knowingly or unknowingly lead people astray. I hope to be a good
    servant of ALLAH.


    **ABDULLAH:** You know what came out of you was disbelief and it was replaced
    by belief. You are so clean now, because when someone embraces Islam sincerely,
    Allah forgives all of his past sins. So, go to the Islamic center that has Muslims
    from all over the world and announce your Islam there, and continue to learn more
    about Islam from them. In addition, find a book on prayer in Islam and practice
    it. This is essential. Now after you are through with me, you must take a shower
    to purify yourself from previous wrong beliefs. Remember to stay away from bad
    company and be with righteous Muslim people. Also, beware of those so-called Muslims
    who call to nationalistic ideas or racial thoughts, which are rejected in Islam.
    I love you as a brother in Islam and I hope one day I will see you and hear your
    voice.


