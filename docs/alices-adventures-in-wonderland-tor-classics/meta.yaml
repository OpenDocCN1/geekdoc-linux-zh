    **DEREK:** No, then what about Jesus'' appearance to his disciples after the crucifixion?


    **ABDULLAH:** Jesus didn''t die on the cross nor was he resurrected. If he were
    resurrected, then he would have come to his disciples in a spiritual body. As
    shown in Luke 24:36-43, he met them with his physical body after the event of
    his alleged crucifixion. In the Qur''an, it says that Jesus was not crucified,
    but it was someone else who was made to look like him (see 4:157,158).


    **DEREK:** How did the story of the crucifixion of Jesus get into the Bible then?


    **ABDULLAH:** Once again, Paul was responsible (see Timothy 2:8 and Romans 5:10).


    **DEREK:** Well, I, very deep in my heart, believe that God can never look like
    his creation nor does he do what they do. What I believe is that God is the perfect
