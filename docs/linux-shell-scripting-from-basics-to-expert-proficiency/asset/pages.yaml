    # Characteristics of Symbolic Links


    Symbolic links possess unique attributes:\They can link to directories and files
    across different filesystems. Deleting or moving the symbolic link does not affect
    the original file. The link becomes broken if the target file is deleted or moved.
    Operations on the link will result in a "No such file or directory" error.


