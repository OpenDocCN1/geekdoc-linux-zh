  md: 'Cron also supports several predefined special strings to simplify common scheduling
    expressions. These include:


    +   @reboot — Run once, at startup.

    @yearly or @annually — Run once a year, equivalent to 0 0 0 1 *

    @monthly — Run once a month, equivalent to 0 0 1 *

    @weekly — Run once a week, equivalent to 0 0 * *


    +   @daily or @midnight — Run once a day, equivalent to 0 0 * *

    @hourly — Run once an hour, equivalent to 0 * *


    For example, to schedule a script to run daily using a special string:


    @daily


    ```

