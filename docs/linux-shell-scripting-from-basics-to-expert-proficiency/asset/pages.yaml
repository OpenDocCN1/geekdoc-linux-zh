- img_proc: true
  md: '# Making a Shell Script Executable


    After writing your first shell script, the next crucial step is to make the script
    executable. A shell script is an ordinary text file until it is given the proper
    permissions to execute. This distinction allows the operating systemsystem to
    treat it as a program. To make a script executable, you must modify its permissions
    using the chmod command.


    chmod stands for "change mode," and it is used to adjust the permission settings
    of files and directories. In Linux, file permissions determine the actions that
    users can perform on a file. There are three types of permissions: read write
    and execute These permissions can be granted to the owner of the file, the group
    owner, and others.


    Consider a sample shell script named Initially, when you create this script, it
    may have the following default permissions:

    % ls -l myscript.sh -rw-r-r-- 1 user group 0 Apr 1 10:00 myscript.sh


    In this example, the script has read and write permissions for the owner and read-only
    permissions for the group and others. However, it lacks execute permissions, which
    are necessary for it to be run as a program.


    To make the shell script executable, you need to modify its permissions by adding
    the execute permission. This can be done using the following command:


    ```

    chmod

    ```'
  merge: -1
  pgno: 201
- img_proc: true
  md: "```\n+\nx\nmyscript\n.\\sh\n```\n\n +x option tells chmod to add execute permissions\
    \ for the owner, group, and others. After running this command, you can verify\
    \ the new permissions using the ls -l command:\n% ls -l myscript.sh -rwxr-x 1\
    \ user group 0 Apr 1 10:00 myscript.sh\n\nNow, the script has execute permissions,\
    \ as indicated by the x in the permission string This means the owner, group,\
    \ and others can all execute the script.\n\nFor more granular control over permissions,\
    \ you can specify explicitly which users (owner, group, others) should have execute\
    \ permissions. The chmod command allows these modifications through symbolic and\
    \ octal modes.\n\nWith symbolic mode, you can add specific permissions. To grant\
    \ execute permissions only to the owner, use:\n\n```\nchmod\nuu+\nx\n```"
