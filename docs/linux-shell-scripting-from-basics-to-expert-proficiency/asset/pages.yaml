  md: '2. Tokenizing: After reading a line, the shell splits it into tokens. Tokens
    are syntactic units such as keywords, commands, arguments, and operators.


    echo


    "


    Hello


    ,


    World


    !


    "


    Here, `echo` is recognized as a command token, and “Hello, World!” is identified
    as a single argument token.


    3. Parsing: The shell parses the tokens to understand their structure and relationship.
    This stage involves syntax analysis where the shell checks for syntactic correctness.


    4. Execution: The parsed commands are then executed. Execution involves running
    built-in commands directly within the shell or invoking external programs.


    Command Execution Flow:'
