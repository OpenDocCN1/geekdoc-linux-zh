    Tasks: 185 total, 1 running, 184 sleeping, 0 stopped, 0 zombie %Cpu(s):

    7.3 us, 2.2 sy, 0.0 ni, 90.1 id, 0.2 wa, 0.0 hi, 0.3 si, 0.0 KiB Mem :

    8159276 total, 1593428 free, 3307760 used, 3258088 buff/cache KiB

    Swap: 2097148 total, 2095740 free, 1408 avail Mem

    PID USER VIRT RES SHR S %CPU %MEM TIME+


    COMMAND 1367 root 20 0 434100 52056 34852 1.3 0.6

    ```'
