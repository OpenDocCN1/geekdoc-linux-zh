    until explicitly unset.


    Environment Variables: These variables are inherited by any child processes or
    subshells spawned from the original shell session. They provide a means to influence
    the behavior of these child processes and stand as a means for communication between
    the different processes.


    To promote a local variable to an environment variable, the export command is
    used.


    ```

    export

    variable_name

    ```


    Example:


    ```

    export

    name

    ```


    The variable name would now be accessible in any child processes of the current
    shell session.


    Variable Names: There are specific rules adhered to in naming variables in shell
