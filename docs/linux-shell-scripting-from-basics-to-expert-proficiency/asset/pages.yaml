  md: '# Working with File Descriptors and Redirection


    In Unix-like operating systems, file descriptors are an integral part of the system''s
    I/O (input/output) mechanism. Each process is provided with a set of file descriptors
    that it uses to communicate with various resources such as files, terminals, or
    even other processes. Understanding how to manage these file descriptors is essential
    for advanced shell scripting, enabling more precise control over input and output
    streams.


    Every process starts with three default file descriptors:


    Standard Input file descriptor 0, used for input operations.

    Standard Output file descriptor 1, used for output operations.

    Standard Error file descriptor 2, used for outputting error messages.


    By default, stdin, stdout, and stderr are associated with the terminal.

    However, redirection allows these descriptors to be associated with other files
    or processes.


