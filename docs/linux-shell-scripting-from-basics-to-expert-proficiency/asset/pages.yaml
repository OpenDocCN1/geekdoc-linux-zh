- img_proc: true
  md: '# Job Control in Shell Scripts


    Job control in shell scripts encompasses the mechanisms for managing multiple
    processes. This is vital when running multiple commands concurrently, ensuring
    resources are allocated efficiently. Shell scripting facilitates job control through
    various commands and constructs, including ‘&’, ‘*’, ‘jobs’, ‘fg’, ‘bg’, and ‘wait’.


    The ‘&’ symbol is used to run a command in the background, detaching it from the
    terminal. This allows the terminal to accept new commands while the background
    process continues execution. For instance, the following script runs `command1`
    in the background while `command2` runs in the foreground:


    ```

    #

    !/

    bin/

    bash


    command1

    &

    command2

    ```


    The `command1` runs asynchronously with the ‘&’ at the end, allowing `command2`
    to execute without waiting for `command1` to complete.'
  merge: -1
  pgno: 1234
- img_proc: true
  md: "To monitor background jobs, the 'jobs' command is utilized. It lists all jobs\
    \ initiated during the current session, providing their job IDs, statuses, and\
    \ commands. For example:\n\n```\n#\n!/\nbin\n/\bash\nsleep\n30\n&\njobs\n```\n\
    \nExecuting this script will display the background job initiated, typically outputting\
    \ something like:\n[1]+ Running sleep 30 &\n\nBringing jobs to the foreground\
    \ is achieved with the 'fg' command, followed by the job ID. If no job ID is specified,\
    \ the shell defaults to the most recent job. Conversely, the 'bg' command resumes\
    \ suspended jobs in the background. For instance:\n\n```\n#\n```"
  merge: -1
  pgno: 1235
- img_proc: true
  md: '```

    #!/nbin/

    bash


    sleep 30 &\nsleep 60 &\njobs

    fg

    %1

    bg

    %2

    ```


    This script will start two ''sleep'' commands in the background. The ''jobs''
    command lists these jobs, ''fg %1'' moves the first ''sleep'' command to the foreground,
    and ''bg %2'' resumes the second ''sleep'' command in the background.'
  merge: -1
