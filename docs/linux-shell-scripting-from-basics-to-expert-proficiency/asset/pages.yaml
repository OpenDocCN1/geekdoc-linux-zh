  md: 'Let’s break down the key elements of this script:


    +   - **Shebang Line**: `!/bin/bash`


    +   - This instructs the system to use the Bash shell to interpret the following
    commands. The path `/bin/bash` points to the location of the Bash interpreter.


    +   - **Comment**: `# This script displays a welcome message and the current date
    and time`


    +   - Comments are preceded by `#` and are not executed. They help in documenting
    the script for better understanding and maintenance.


    +   - **Command**: `echo "Welcome to Linux Shell Scripting!`


    +   - The `echo` command prints the specified string to the terminal.


    +   - **Command with Command Substitution**: `current_date=$(date)`


    +   - The `date` command retrieves the current date and time. The `$(command)`
    syntax performs command substitution, capturing the output of the `date` command
    and storing it in the variable `current_date`.


    +   - **Variable Expansion**: `echo "Current date and time: $current_date""'
