    # Cloud storage


    While Google Drive and Dropbox dominate the market in other computing areas, what
    storage options are out there for the Linux community?


    # ownCloud


    There are plenty of similarities between ownCloud and Dropbox, but that hasn''t
    stopped the dev team from producing an open source alternative to the popular
    storage. Built-in music streaming and chat makes it one of the best storage solutions.


    Download: bit.ly/1SWk2nF


    # Bitcase


    While Bitcase is not directly open source, it uses software around GC/Chang, OpenSSL,
    Rapid JSON and libcurl. It''s touted as being one of the leaders in file encryption
    and provides a virtual fortress for your files and folders that you want to bring
    to the cloud.


    Download: bit.ly/1p7DIX


    # Cozy


    Cozy provides flexibility when it comes to using as a storage server, with Cozy-based
    apps to considerably extend what it can do. It provides an all-in-one file manager,
    and Cozy Light is also available for those accessing via a Raspberry Pi.


    Download: bit.ly/1Le29k


    # Yandex.Disk


    A big part of why Yandex.Disk has gained a fairly strong Linux following is likely
    down to its syncing system between multiple devices. There''s integratedDAV support
    for easy sharing and a built-in flash player that enables users to preview songs
    before downloading them.


    Download: bit.ly/1p7HSFn'
