  md: '# Tutorial


    # Mattermost


    # Searching


    The search bar in Mattermost returns non-case sensitive results from all channels
    you''ve joined. You can also search members and search results. For example, you
    can search for users and posts from specific channels. You can also filter the
    search by the type of search result.


    # 04 Managing basics


    The bottom text box lets you enter messages in a channel or one-to-one chats.
    To create a new line without sending the message you press Shift+Enter simultaneously.
    You can format your messages using Markdown. Note that the text area supports
    Markdown, you can easily format your messages with basic knowledge of Markdown
    syntax. Here is a primer:


    | Text you | Displayed as |

    |---|---|

    | **bold** | bold |

    | *italic* | italic |

    | [link](http://...) | hyperlink |

    | `code` | code |

    | ~~strike~~ | strirough |


    Mattermost has an in-built file preview that lets you peek at attached files.
    Just click the attached file to leave the file preview. After a preview opens,
    you''ll Download and Get Public link. When the Download is exported you can use
    these links to share the files with people outside Mattermost.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_59_0.png)


    # 06 Adding members


    There are two ways to invite members to your team: sending invites and sharing
    the team invite link. Direct invites are emails sent from your server to the invited
    member''s email address. A link within the invite directs the users to account
    creation. To send an invitation, click ''Invite Members'' on the Mattermost header.
    Then, enter the new member''s email address with first name. Click ''Add'' to
    send the invite email.


    The team invite link is a URL that directs users to account creation for your
    team. The team invite link can be used by any number of users and does not change
    it is reusable. You can use it in a company-wide email to invite members to a
    Mattermost team. To create a link, click the Main Menu in the Mattermost header,
    then time selecting ''Get Invite Link''. This is the only link, so just share
    it with users you would like to invite to team.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_59_1.png)


    # 05 Executing commands


    Mattermost lets you execute commands via the message text area. There are server-based
    commands that can be used to perform basic tasks—here are some of the built-ins:


    +   - /delay [seconds]: This command allows you to send a message after a delay
    of the specified number of seconds

    - /join channelname: Lets you join a channel directly

    - /logout: Logs out of Mattermost


    Mattermost also supports custom commands, so you can use all the built-ins in
    the message text area. It is important to remember that you can add custom commands
    to Mattermost instances that work on a HTTP request response and mechanism. For
    example, if you want to add a command with an external application, you just need
    to handle the HTTP response from the external application and format it to property
    display the results in the Mattermost channels.


    # 07 Managing channels


    To create a new channel or a private group, select + symbol to the corresponding
    header on the left-hand side. For a direct message, click ''More'' at the top
    of the chat window. To create a channel, click ''More'' at the top of the channels
    list. To join a channel, click the Channels list to see a list of Public channels
    you can join.


    To leave a channel, click the channel name at the top of the drop-menu, then click
    ''Leave Channel''. Note that for a private group, click ''Remove Member'' next
    to the member you want to remove. Also, team members will not receive notifications
    from channels where they are not members.'
