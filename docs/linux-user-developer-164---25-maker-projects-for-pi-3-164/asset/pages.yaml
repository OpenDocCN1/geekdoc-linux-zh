  md: '# BUNSENLABS


    # CrunchBang lives on its community-led successor


    There were a lot of users who were sad to see the demise of CrunchBang distribution,
    but its successor, BunsenLabs, is reality starting to take shape, it''s another
    community-led distribution, offering both a highly stable and lightweight Openbox
    desktop, with the tint2 and conky monitor readily available to use.


    There''s a range of GTK2/3 wallpapers and themes that can be used to change the
    look and feel of the distribution, and several conky configurations have been
    implemented for advanced users. Additional desktop and hardware-related packages
    have been installed to make it one of the few distros that offers a complete experience
    on the first boot.


    # UNTETHERED LAUNCHER


    You can open Bunsenlabs launcher anywhere on the desktop - just right-click to
    bring it up. If the feature is disabled, look for a launcher icon at the far-left
    of the menu bar


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_0.png)


    # MONITORING WITH CONKY


    Conky comes as one of the premier features of BunsenLabs. Users are able to get
    an overview of their system performance and the current key bindings they have
    in place


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_1.png)


    bunsenlabs


    Above BunsenLabs incorporates useful and modern-looking notifications and widgets


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_2.png)


    # GTK2 THEME PACKAGE


    There''s a range of GTK2/3 themes and wallpapers to be used within BunsenLabs.
    Similarly, users can configure various widgets, the mouse cursor and other areas
    of the distribution


    # OPENBOX WINDOW MANAGER


    Openbox is configured in BunsenLabs, providing a minimal approach to window management.
    Openbox is one of the most customisable window managers


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_3.png)


    # NIXOS


    # An all-in-one solution for system configuration


    System configuration is at the heart of Nix, for those who really want to get
    along with them the best distro out there. Nix combines things like configuration
    rollback and package management into a single configuration file that can be activated
    easily with a sole command.


    The other unique feature of Nix is that each system configuration file is saved
    to the system and then freely available to boot, until it is wiped from the system.
    It provides a reliable way to rollback without fear. If you''re able to get your
    head around the standard directory architecture and the steep learning curve,
    Nix provides an excellent suite for DevOps and makes large-scale cloud deployments
    much simpler.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_4.png)


