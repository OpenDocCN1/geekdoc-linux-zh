  md: "# OPINION CODING\n\n# # Counting string length\n\nThis month we explore the\
    \ most popular string-related C\nfunction, strlen(), so we can measure and traverse\
    \ strings easily\n\n> The strlen() function gives the length of a string by counting\
    \ the characters that precede the terminating NULL character\n\nEvery string is\
    \ required to be null-terminated in this way; otherwise the\ncorrect printf()\
    \ placeholder for printing will fail.\nThe most important thing to remember is\
    \ that a string\nusing a null character cannot determine where the string\nends\
    \ - a nasty bug that the compiler cannot detect!\nA C string starting with the\
    \ \"\"0\\0\" character might be\nconfused; \"0\" is a single character despite\
    \ the fact\nit needs two characters to be printed on your screen.\nAs always,\
    \ there are two ways to deal with strings in C:\nusing arrays or pointers. Similarly,\
    \ you can use a loop\nby character - picking one of them at a time.\nYou can access\
    \ strings using pointers. When the\nterminating character occupies some memory\
    \ space, a\nstring with five characters occupies six space: five\nfor the null\
    \ character. If you use static strings, it allocates\nmemory space and puts the\
    \ terminating character\n\npositive values, such as the length of a string, but\
    \ it\ncbe used for representing negative quantities. If size_t values are\nwritten\
    \ as %u use it to avoid compiler warnings like:\n\nwarning: \"%d\" expects argument\
    \ of type \"int\",\nbut argument has type \"size_t\" [-Wformat]\n\nThe most interesting\
    \ part of the strlen() C code is:\n\n```\nchar *str = \"1234\";\nchar another[]\
    \ = \"12345\";\n```\n\nIf you decide to allocate memory for a string using\nmalloc()\
    \ you should include the additional space for\nt terminating character, as in\
    \ next example:\n\n```\nchar *str = malloc(sizeof(char) * 6);\n```\n\nThis is\
    \ one of the most features of using pointers. To\nmake things more interesting,\
    \ the pointer() will use\nstatement where returns the address of the array (or)\
    \ array, as\n it will be given as a command line argument in both versions\nof\
    \ the program. Last, to avoid conflicts and\\confusion, the selected\nfunction\
    \ will be named mystrlen() but it will; take the\nsame input and produce the same\
