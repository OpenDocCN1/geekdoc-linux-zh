  md: '# Tor router


    # NAT needs to be configured to allow devices

    to connect to the Raspberry Pi’s wireless access point


    Restart with `sudo shutdown -now`, and retry the connection

    from your mobile device.


    # 14 Time to install Tor


    With this setup, the Raspberry Pi is a wireless access

    point. But it is not anonymous yet. Reconnect via SSH and

    run `sudo apt-get install tor`, then open `/etc/tor/torrc` in nano

    and add the following to Tor anonymise the wireless

    access point:


    +   - Log file /var/log/tor/reporter.log

    - VirtualNetworkAddress 192.168.2.10

    - AutoHostsSuffixes exit

    - AutoHostsResolve 1

    - TransportPort 9050

    - TransListenAddress 192.168.2.1

    - DNSListenAddress 192.168.2.1


    # 15 Add SSH exception


    Next, follow the flat:


    +   - sudo iptables -t nat -F

    - sudo iptables -t nat -F


    And follow this by adding an exception for SSH connections

    to port 22:


    +   - sudo iptables -t nat -A PRERUTING -i wlan0 -p tcp

    --dport 22 -j REDIRECT --to-ports 22


    These rules allow DNS lookup and direct TCP traffic to

    to Tor’s port 9040.


    ```

    sudo iptables -t nat -A PREROUTING -i wlan0 -p udp

    --dport 53 -j REDIRECT --to-ports 53

    sudo iptables -t nat -A PREROUTING -i wlan0 -p tcp

    --syn -j REDIRECT --to-ports 9040

    ```


    Save the NAT file with:


    ```

    sudo sh -c "iptables-save > /etc/iptables.ipv4"

    ```


    # 16 Enable the Tor service


    At this stage, you can enable the Tor service on

    wireless access point:


    ```

    sudo service tor start

    ```


    Boot scripts can be enabled:


    ```

    sudo update-rc.d enable

    ```


    Restart the Pi with `sudo reboot -now`.


    # 17 Verify anonymity


    With your Raspberry Pi wireless access restarted,

    it’s time to connect via a Wi-Fi enabled device, perhaps a

    smartphone or laptop. As before, the connection should work

    without anonymity.


    Find out by using https://torproject.org from two devices\and comparing the IP
    addresses. If they’re different, you’re

    anonymous!


    > Even you could

    use the Pi’s

    Bluetooth, control,

    smart phone

    gadgets as well as

    nt traffic through Tor.


