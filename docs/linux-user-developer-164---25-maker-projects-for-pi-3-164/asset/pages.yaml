    # ## The full Android experience on any desktop


    Based on Android-x86, Remix OS is one of the first mainstream atports to getting
    Android on your PC, bringing pretty much everything you previously encountered
    with Android in general, with the added support of a window manager, taskbar and
    more.


    Android has always been about notifications, and the way Remix has added it to
    OS not only looks great, but is incredibly useful. Notifications are split between
    apps, core settings and


    allowing for easy control. It''s noticeably more usable than some of the notification
    centres we''ve encountered in your Linux distro. While not the most exciting of
    features, Remix offers the first ever management system built around Android.
    It uses a drag-and-drop system to move files around, and has external storage
    support to hook up a drive on the go. With the support of the Google ecosystem,
    Remix can provide all the tools you need Android usage to take to the next level,
    without compromising on whatever hardware that you''re using.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_36_1.png)


    # # ELEMENTARY OS


    # ## Wait, isn''t this OS?


    ![](img/453752f2a570e8fff106aca09a3ea2e3_36_2.png)


    A large part of why Elementary has gained a cult following since its inception
    a couple of years ago is not just to its use, but also its design ethic. For moving
    from Windows, or even OS X, Elementary offers a recognizable alternative to the
    standard operating system. Think of it as Linux, but with a very well-done version
    of it focus on usability.


    Simplicity is key here and a large portion of it centres around the multitasking
    of the desktop environment. We''ve seen others distribute multi-window features,
    but Elementary implementation is slightly different. It hits hot spots on your
    desktop for effortless switching between windows, most of which can be achieved
    with a click of the mouse, or a customised shortcut.


    And if that''s not enough then the team behind the OS has also created a suite
    of preinstalled software, custom-made for their desktop environment. It''s all
    centered around simplicity and ease-of-use. This won''t tick the trick for advanced
    users, but for making the transition to Linux for the first time, it''s a great
    place to:


