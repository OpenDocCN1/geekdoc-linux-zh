    Hadoop is for batch processing, but for real-time access of data, you should use
    HBase


    Big data - measured in terabytes/petabytes - cannot be stored and processed with
    traditional databases, so it was only a matter of time before something like Hadoop
    emerged. Hadoop uses HDFS-distributed filesystem and MapReduce to store and manage
    this data.


    auto-managed by HBase at the time of cell insertion. Rows and columns are grouped
    into column families; every column follows the first row (the row key). The column
    family must be specified as part of the table schema definition, but new column
    members can be added on demand.


    Hadoop is open source, the HBase project was started by Chad Wang and Jim Kalmers
    at Yahoo and was modeled after Google''s Big Table. HBase is suited for sparse
    datasets, which are common in Hadoop and provides APIs that enable development
    in different programming languages.


    Each row is a byte array, allowing anything from strings to longer-ever serialized
    data structures as rows. The coordinates used to identify data in a HBase table
    are row, family, and column; however there are several strategies for supporting
    the types of query that secondly demands.


