    # 08 Organizing conversations


    There are three ways to communicate in Mattermost: public channels, private channels
    and direct messages. Public channels are open to everyone on a team. New members
    are automatically added to two channels: General and Off-Topics. These private
    channels can be used to discuss sensitive topics and are only visible to select
    team members. Any member of a group can join the group or choose to leave at any
    time, but only the group owner or team administrator can remove members.


    Direct Messages are for conversations between two members. These conversations
    are only visible to the members involved. The status indicator next to team members''
    names in the direct message list displays: online, active (activity for five minutes),
    and offline (browser).


    As you like in Mattermost, you can view all of these streams of conversations
    on the left-hand menu bar, clearly separated from channels.


    # 09 Notification configuration


    Unread messages are indicated by a bold name in the left-hand side bar to notify
    of a new message. Clicking the channel name takes it back to normal, unreading
    the message. You can also configure the events that trigger a channel notification
    by clicking Channel > Menu > Preferences > Mark as Read.


    Similarly, bold text and a jewel next to the channel name in sidebar indicate
    unread mentions in a channel. Clicking the channel name removes the style and
    unread jewel. You can also review your recent mentions by clicking


    the @ symbol beside the search box at the top of the screen. There are email notifications
    available, to Manage notifications in Account Settings > Notifications > Email
    Notifications. To configure the address where you want to receive them, go to
    Account Settings > General. Choose a place for all activity that you want a desktop
    notification. Sounds are available on Safari, Chrome and Edge. You can manage
