  md: '# INTERNET OF THINGS


    # TOP FIVE


    # New features

    in Android N


    # Multi-window mode


    One of the most anticipated features of N is the new multi-window mode. With this
    enabled, users can seamlessly switch between multiple apps in seconds, or when
    needed, use multiple apps once (simultaneously).


    # Interactive notifications


    In a move that closely resembles iOS, users will now be able to reply to messages
    from their notification panel. A quick overview of the design shows that you can
    simply tap on it to start a reply. You''ll never need the Messaging app again!


    # Sounded-up settings


    An overarching system menu is implemented to help get around the settings in a
    much simpler way. In fact, one of the recognizable menu will show different settings,
    which can then be edited depending on what you need.


    # Enhanced Doze mode


    Doze was a great idea of saving battery, but it was limited in its functionality.
    A new and improved Doze mode has been implemented in Android, which will further
    extend battery life, especially with more accurate tracking.


    # Android beta program


    Users can opt-in to the Android beta program on their devices. This allows Google
    to preview features and test updates, without the need for factory testing.


    > Allow the system to suggest settings is a real improvement


    # Mozilla Firefox

    OS into IoT hub


    # Firefox OS is to bring into our lives


    As an operating system


    Mozilla is working on four IoT projects behind the scenes: Smart Project Home,
    Hot Link, Project Sensor and Vaani. Each of these projects will work with different
    technologies, but they are all aimed at making the consumer''s home and devices
    smarter.


    In the blog post, SVP of Connected Devices, Ajit explains how it works. This revolution
    has already started and is built by previous technologies, each revolution, each
    evolution. Internet of Things, as many call it, fundamentally affecting all of
    us.


    Smart Home is pretty self-explanatory, and looks to give users the tools needed
    to automate some of their home''s basic functions, while giving more discerning
    users


    useful flexibility in how they adopt it into their home. With Link, users will
    have a personal assistant that bridges the gap between them and their smart devices.
    Over time, Link will remember your preferences, and learn from your interactions.


    Vani is given to Mozilla new voice interface that can be integrated into third-party
    apps and handlers. Vaani will receive variety of commands, with a voice to connect
    more compelling statements to data. The Sensor is a hub for information that relies
    on-sensor data that will be accessible to all. Mozilla will process the data and
    present it to users at their convenient time.


    Many of Mozilla''s projects are very in the early stages and it''s not known where
    they will end up. With Mozilla''s concurrent development of the firefox platform,
    it''ll be interesting to see where its new focus leads us.


