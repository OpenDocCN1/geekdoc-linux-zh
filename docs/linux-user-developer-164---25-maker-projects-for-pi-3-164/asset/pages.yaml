  md: '# OPEN HARDWARE


    # Google has joined Facebook’s

    Open Compute Project


    Two of tech''s biggest players want to revolutionise the world of data centres


    Facebook''s Open Compute Project has been picking up a lot of steam lately, and
    Google''s acquisition shows their commitment.

    The project was originally created six years ago for end-user data centre equipment,
    as a way of keeping costs down afterwards.

    A number of other technology giants have already jumped on the project, including
    the likes of Microsoft. Google has been absent from the list since the recent
    OCP Summit in Silicon Valley.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_8_0.png)


    Google is already touted for owning some of the most advanced data centres, and
    its first contribution was to produce a radical take on rack design that powers
    servers with an enhanced 48-volt circuit used in most data centres. Currently,
    it''s using the standard 12-volt design.


    The new design is a partnership between Facebook and Google, with both trailing
    the design in their own data centres. Google''s involvement leaves Amazon as the
    only hyperscale cloud provider that isn''t a member of the OCP besides Apple''s
    membership near end of last year.


    # GAMING


    # MAME is now free and

    open source


    Arcade emulator now free to be modified


    After two decades of availability, MAME (Multiple Arcade Machine Emulator) has
    finally been made open source. Availability. Previously the software was available
    under a BSD license, which prohibited any of commercial use of MAME


    Despite the many areas that MAME has to deal with in its license, it remains the
    most popular way for gaming enthusiasts to contribute from various platforms.


    > The most popular for gaming enthusiasts to emulate and enjoy retro titles


    Up until recently, the source code for MAME had been readily available, but restrictions
    were in place to limit what users could do. Can users now distribute MAME to their
    here''s content? It''s interesting to see where the project ends up, and how it
    will be developed.


    right ROMs from classic arcade machines can be run inside the MAME software


    "After 19 years, MAME is now available under an OSI-compliant and free-approved
    license," the team on mamedev.org says "A great majority of files are still available
    under the 3-Clause BSD license, but the project as a whole is distributed under
    the GNU ...


    General Public License. The transition into completely open source project hasn''t
    been easy, with the team also stating that the past ten months have been filled
    with trying to contact all the people who have contributed to MAME over its lifespan
    with information about the new license. If you believe that you''ve contributed
    to the core MAME source code, the MAME team has included a link where you can
    reach out to them directly over their site.


