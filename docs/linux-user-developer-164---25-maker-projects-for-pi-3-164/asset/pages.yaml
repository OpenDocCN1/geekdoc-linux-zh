    # # AsteroidOS: Wear an open source watch


    ![](img/453752f2a570e8fff106aca09a3ea2e3_5_0.png)


    # Unlock the potential of your Android smartwatch with a new, libre operating
    system


    For a long time, Android has led the way when it comes to the world of smartphones.
    What was initially just a bit of invaluable aides from early adopters has now
    turned into a series of devices that are essential and personal aides for people
    around the world.


    Advancements in hardware and software have allowed us to operate Android more
    freely, which has led to a suite of features that would have been restricted to
    our smartphones before.


    But, now, the open community has largely been left behind when it comes to the
    smartwatch market. With Google and Apple leading the charge in this field, there''s
    been little competition, and any independent launchers have been heavily restricted
    in what they can do. However, we now finally have a choice with the launch of
    AsteroidOS.


    Developed by Florent Revest, AsteroidOS is the first true open source distribution
    for smartphones from LG in its current state. AsteroidOS includes only the bare
    minimum of functions. So stopwatch, calendar and calendar are all ready to use,
    but many features we''re accustomed to are not.


    Adoption rates are still in their infancy, and Revest has been quick to improve
    the project as developers are working on it. Currently, owners of the LG Watch
    and LG G Watch bootloader is unlocked, putting it over to other devices isn''t
    a difficult task. The kernel is built around libhybrid, which allows the re-use
    of Android code.


    Initial tests on the AsteroidOS software have provided positive. On videos uploaded
    to


    AsteroidOS official Twitter account, videos have shown many of its core apps working.
    Speed is quick, crashes are infrequent and plenty of polish on hand. Keen developers
    can go hands with the code that Revest and his team released to build applications
    from scratch and directly implement them on smartwatch, and change the way that
    their hardware performs. By being an open source operating system, users also
    have the tools to adapt the OS for other various uses.


    Visit the AsteroidOS website (asteroid.org) for a full overview of the project,
    to find a guide to installing the OS on your device, and its GitHub where you
    can check out its source code for.


