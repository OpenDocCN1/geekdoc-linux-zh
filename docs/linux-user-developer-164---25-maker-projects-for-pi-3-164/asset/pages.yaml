    # What does the Raspberry Pi take in this project?


    The RV is controlled with a joystick controller we read the signals from the joystick.
    The signals are then translated into commands and sent to the Raspberry Pi. The
    Raspberry Pi is the brain of the drone and communicates with the laptop via Wi-Fi.
    I learned to implement a Tenda home router, which reduces the communication latency.
