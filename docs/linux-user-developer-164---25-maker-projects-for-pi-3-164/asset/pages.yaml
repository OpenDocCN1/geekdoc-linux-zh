    Supporting modularisation requires that the kernel include a useful dynamic linker
    capable of adding and removing the code (known as "text" in the parlance of those
    who are engineer compilers) that links modules within the original in-memory kernel
    image, and output at runtime whenever needed like "modprobe" causes code to be
    added to or removed from the running system, usually as a result of a "detector"
    hooking mechanism. The kernel needs to resolve many dependencies between a loadable
    kernel module and the pieces of the in-memory kernel that are already running.
    This is done through dynamic linking and relocation to resolve their living symbols
    (names of functions) into memory addresses that are patched into the loadable
    module.


    Supporting dynamic symbol resolution in the kernel is hardly a trivial task. The
    kernel exports symbols (names of functions) that have been individually associated
    with the "EXPORT_SYMBOL" macro. When a function such as "printk" (which causes
    messages to be logged to the kernel log and output to journal) is exported via
    "EXPORT_SYMBOL(printk)", the build-time inserts a reference into the kernel image
    at the location of the function in such a way that loadable modules using printk
    (which they all do) can resolve their use of the symbol back into its actual in-memory
    location to patch. The linker performs this setting up of memory as part of load
    module. Using symbols, then, allows the kernel to be very modular in nature.


    But one effect of modularisation is that the kernel in-memory image contains references
    to over thousand symbols that must be tracked, even if the vast majority of them
    will never be used by the available modules for that particular kernel. This is
    something Nico (Nicola Pchesire) has sought to change in his latest patches titled
    "un exported kernel symbols". This reduces the number of symbols the kernel exports
    to only those actually referenced by the modules for that particular kernel –
    taking the total down from over 10000 to as few as a couple hundred.


    The result is that the kernel is a smaller, more efficient image that may be 3
    and 14% reduced when he completes his patch with something called "LTO (compiler
    supported Link Time Optimization) removing pieces that don’t need to be inserted
    or linked in the kernel code during compilation, which could reduce the kernel
    image size by as much as 16%, which is close to the 13.9% number that comes from
    disabling kernel module support. This means that for embedded systems (such as
    small devices), loadable module support effectively becomes free of overhead,
    adding more flexibility to the design of small resource constrained design systems
    that in the past have been forced to disable modularisation entirely.


