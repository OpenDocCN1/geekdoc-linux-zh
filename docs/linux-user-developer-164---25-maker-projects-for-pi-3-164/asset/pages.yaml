  md: '# Anonymise your web traffic with a Pi Tor router


    Use your Raspberry Pi as a wireless access point and route traffic anonymously


    Are you concerned about your online privacy? Suspect that the NSA or GCH are tracking
    you? Or are you simply announcing advertising networks targeting your ads? If
    this is the case, or you''re simply on the lookout for a wireless access point
    that is secure, consider setting your Raspberry Pi up as an anonymising network
    and setting up Tor on all your PCs and mobile devices.


    If you''re unsure, Tor is free software that enables you to browse anonymously
    through a network of over 7000 relays. By doing this, your location and website
    can be concealed from trackers, analysis and surveillance.


    This is all about protecting your privacy. By making your visits to websites,
    instant messages, emails and more difficult to track, you can set up your Raspberry
    Pi with a wireless dongle for a Raspberry Pi 3, Ethernet cable, and a bit of configuration.


    # 01 Connect everything


    With everything connected and switched on, you can begin configuring the Raspberry
    Pi. So by plugging one end of the Ethernet cable into your Raspberry Pi and the
    other into a switch or router.


    If you''re using a 2016 model of the Raspberry Pi, connect your wireless dongle
    to the computer. Pi 3 owners don''t need to do this as it has built-in networking.


    # 02 Remotely configure with SSH


    The next step is to connect to your Raspberry Pi via SSH. You can do this using
    SSH. (If this isn''t an option, continue the rest of the tutorial with a monitor
    connected to your Raspberry Pi, with a mouse and keyboard.) To use SSH, open a
    terminal and enter:


    ```

    ssh pi@192.168.1.28

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_77_0.png)


    # What you''ll need


    +   - Ethernet cable

    - Wireless router

    - USB WiFi adaptor or Raspberry Pi 3'
