    all settings are in the /config/config.json file, so it is important to keep the
    config file in its location to make sure no one changes it other than. The first
    user added to a new Mattermost installation is the system administrator and can
    access the system console from there.


    To access the system console, click on the three dots icon on the top left and
    select "System console". The console will display the system statistics total
    number of users, total public/private channels. You will also see a graphical
    representation of total users. All the other options available under system console
    can be seen on the left sidebar. For example, you can change the default port
    for connections, the connection number of login attempts, and several other-related
    settings here. If you want to add custom commands, you will need to enable incoming
    and cutting webhooks from here as well.


