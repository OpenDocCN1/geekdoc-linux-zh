    - Perl interpreter


    # We return to file I/O this month with an in-depth look at the advanced techniques
    you can employ


    Advanced file I/O means that you can do usual file I/O operations with extra powers
    such as recording, nonblocking I/O, multiplexing, asynchronous I/O, memory mapped
    and scatter read and gather. Don''t worry, we will take you through everything
    you need to get started.


    and the nonblocking ones, which return with an error message indicating that the
    operation was not completed and could have been blocked.

    As you might have guessed, advanced I/O is often the key feature of modern operating
    systems.

    This tutorial will present the systems and the techniques that will allow you
    to perform advanced I/O. It will be the most seen in the Systems Programming series.
    Most of the code in this article will be written in C but you will also see examples
    in Go.


    Please be in mind that the concepts and principles of advanced file I/O are more
    complex than standard I/O. When in doubt, look at the source code or try to write
    it yourself to solve any ambiguities and make things clearer for you.


    # Blocking and nonblocking I/O


    There exist two categories of systems: the usual ones like read() and write(),
    which can block,


    Another scenario where a program can wait for is input. Yet another area is network
    programming, which is related to file I/O, because it is most likely to wait for
    "future" over a network-related problem when a problem occurs on your filesystem
    - those of you remember having NFS-related problems will understand!


    Tutorial files available:

    files.co.uk'
