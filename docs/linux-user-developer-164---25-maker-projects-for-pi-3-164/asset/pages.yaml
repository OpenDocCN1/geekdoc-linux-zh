  md: '# # Feature Next-gen distros


    # # COREOS


    Make your desktop work for you with the help of CoreOS


    When you first get hands on CoreOS, you can be forgiven for thinking it’s a bare
    distribution, but that turns out to be one of its greatest strengths. The positive
    aspect of this minimal approach is that CoreOS is capable of trying out different
    deployments and dependencies, with the end user having a distro that’s easier
    to scale and manage.


    CoreOS’s real selling point is that it doesn’t ship with a package manager, and
    instead relies on containers to help applications and dependencies. The most prominent
    containers for each service you want on your machine (caching, database), use
    the file system to start and then connect them together easily.


    Its other benefit is through its update system with its root scheme, FastPath.
    Instead of updating packages, CoreOS is updated by a single unit, allowing for
    quickly and timely downloads. Essentially it minimizes the overall complexity
    of the update process by compartmentalising each entity. While probably not suited
    for those who are new to Linux, it is one of the few lightweight distributions
    out where the control is fully in the end user’s hands.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_35_0.png)


    # # CUB LINUX


    # ## Chromium and Ubuntu in one helpful package


    We’ve already noticed how great Chromium is, when mixed with Ubuntu, it gets even
    better; Cub Linux is a unique mix of the best of both named speed and web apps,
    with the best of what Ubuntu can offer. The end result is a combination of speed
    and stability.


    While Cub Linux doesn’t use any components of actual CoreOS, it does


    use a variety of open source products that look and act the same as the browser,
    but without the over-reliance on solely using web apps. With the power of Ubuntu
    behind it, users can now customise their Core OS experience with a myriad of desktop
    applications, making desktop computing more ever.


    If you want the power of the Google ecosystem, but without being directly tied
    to its limited set of desktop applications, Cub Linux is a worthy alternative
    to your standard Ubuntu experience.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_35_1.png)'
