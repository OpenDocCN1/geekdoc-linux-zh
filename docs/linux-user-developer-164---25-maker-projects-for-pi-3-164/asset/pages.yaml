    Communication is a very important aspect of team dynamics. The productivity of
    a team depends on the quality of communication that people in the team have with
    each other. There has to be a balanced approach where team members, while sharing
    a great report, do depend on the individuals themselves, or the company culture,
    the tools that you have a very important role to play in team communication. When
    we look at Mattermost, a tool that can help you streamline and enhance internal
    communication, while being hosted under your own freedom (Linux, SVN, etc.) to
    get a unified interface to your team''s status.


    # ## 01 Database installation


    As a web-based software Mattermost needs a database and web server to run. Let
    us first install PostgreSQL on Ubuntu 15.0. First of all we need to update your
    system with the latest updates and patches.


    ```

