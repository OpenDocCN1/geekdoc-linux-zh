  md: '# Tutorial DNS Proxy


    publish a service from an internal network to a publicly accessible network.


    If you want to go deeper into the techniques of NAT and DNAT, you really need
    to understand this: we are allowing traffic to be served by a remote server transparently.
    We use iptables-nat which is a flexible tool for Linux computers. To create a
    DNAT mapping, the following commands are used:


    ```

    $ sudo iptables -t nat -A PRERUTING -tcp --dport <local Port> -d local IP -A DNAT
    --destination=remote IP --dport=<remote Port>

    $ sudo iptables -t nat -A POSTROUTING -tcp --dport=<remote Port> -j MASQUERADE

    ```


    You can also write these in a shell script, run it and save it with iptables-persistent
    or iptables-save. For example, if the remote server is in the US with a public
    IP address 218.58.197.46 in a file named dnatrules.sh, create the following:


    ```

    $ iptables -t nat -A PRERUTING --dport 80 -d 192.168.1.1 -j DNAT --destination
    218.58.197.46

    $ iptables -t nat -A POSTROUTING --dport 80 -d 192.168.1.1 -j MASQUERADE

    $ iptables -t nat -A PRERUTING --dport 443 -d 192.168.1.1 -j DNAT --destination
    218.58.197.46

    $ iptables -t nat -A POSTROUTING --dport 443 -d 192.168.1.1 -j MASQUERADE

    ```


    Copy and paste the four lines into a new file. Increment of the first id for the
    IP in Line 1 (i.e., e.g. 192.168.1.1). Use the same IP in Line 3. There are two
    ports in each server and different IP address so that Lines 1 and 3 have different
    addresses. Increment the port of each line by two (e.g. 218.58.197.46 in Line
    3). Add two stanzas in this way, for example using 10.0.0.10 and then ports 2105
    and 2107. Save the file and run it:


    ```

    $ sh dnatrules.sh

    ```


    # Creating the remote proxy


    The remote proxy is the key piece of setup. It will accept the connection from
    the local server and provide the requested services. The easiest way to set up
    a remote server is to use one of the virtual private server providers or cloud
    providers. There are several providers to choose from, like Microsoft Azure, Digital
    Ocean, Linode, and others. Digital Ocean is one of the cheapest service providers


    Most of the providers include some sort of trial so you can get started for free.
    For this tutorial we will use Microsoft Azure, it has the most generous offer
    of $125 in Azure credit. You can follow the same process as for any other cloud
    provider. Just sign up for the trial here: https://azure.microsoft.com/en-in/free.
    Head over to portal.azure.com.


    and log in with your new account. Click ''Virtual machines (classic)'', click
    ''Create'' for Ubuntu 14.04, select it then select Deployment Model as Classic.


    In the VM dialog, enter your HostName for the server and Username and Password
    for the server. Clicking Next, then leave the size as this is the cheapest and
    it''s resource-hungry. Click Configuration > Network and make a note of the domain
    name. When Head Endpoints, configure the proxy to expose on the Internet. From
    the local and remote ports table, we need to open ports, and for each one you
    need to tunnel:


    NAME:endpoint1

    PORT: 2181

    PROTOCOL: TCP

    PUBLIC_PORT: 2181


    Once you have the IP address, check the location where the service is available.
    In the case of Facebook, it is all addresses in the US so you should choose one
    of the regions. After making all the selections, click Create. The VM has been
    created and started, note down the IP address which is updated in the local configuration.


    # 07 Installing the proxy server


    HTTP HA Proxy is a proxy load balancer. It is used to distribute workload across
    multiple servers so that works properly when there is high demand. But we do not
    have to worry about all of that. For purposes, we will use HA Proxy to provide
    the traffic for the services that are geo-blocked.


    We need to install the proxy server. For this tutorial we will use Ubuntu 14.04.


    ```

    $ sudo apt-add-repository ppa:vergat/haproxy-1

    $ sudo apt-update

    $ sudo apt-install haproxy

    ```


    There are a lot of options to be configured, here, but you need to pay attention
    to the frontend and backend sections.


    ```

    frontend_facebook_com_http

    bind 0.0.0.0:2181

    mode http

    ```


    Frontend sets the address where our local server will be sending the request.


    ```

    backend_facebook_com_http

    mode http

    server server.www.facebook.com:80

    ```


    Backend sets up the address which our server will use for the request.'
