    BACKUP


    # Tardis os – a time machine for your files


    Backup solutions range from simple, home-based, rsync-based scripts, to glossy
    software, which is just a fancy front-end to rsync-based scripts. It''s essential
    to back up; a backup is only useful when you will need to recover data. The fact
    is so many people don''t do regular backups in part – no doubt, owing to use complicated
    tools or perceived failed backups – particularly the software''s interface takes
    some of the blame.


    Machine, and provides encrypted and incremental backups (with revision-level access
    to the archives) – also it has a filesystem-based recovery. Although it has a
    client-server architecture, you can run it – locally with a tool found online,
    and manage it on GitHub. Installation is as easy as KDE itself, but KDE is perfect
    for the GUI, and it provides simple instructions for installing and setting up
    GNOME. A free tool for packages (Ubuntu and Fedora directions given), when you
    run the setup install script. If you''ve not made a backup this month, ask yourself
    why, not then try Tardis and it''s right for you.


