    out as one of the few distros that caters for low-resource computers. Its default
    containers require no than 8MB of space and its installation to disk takes up
    a 130MB of HD space. Perhaps the biggest benefit from this is that you can expect
    lightning-fast install times. And, despite its small size, users still feel flexed
    out because there is also a set of repository packages which have been split and
    thinned out, allowing users more control over what they install. There''s plenty
    of choice here, so don''t worry about Alpine being overly simplistic.


    In its recent release, it was announced that Alpine would be teaming with Docker,
    adding another node to the team and leaving a small footprint. Docker''s containers
    don''t require a separate, full operating system, and can make use of low resources.
