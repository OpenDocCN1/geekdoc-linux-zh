    # # The Joy of Sun and ZFS


    ‘GPLv2 incompatibility was Sun’s design choice’ – so what does this mean for Canonical’s
    use of ZFS in Ubuntu 16.04?


    > Canonical''s decision to include ZFS in Ubuntu 16.04 LTS has become source of
    controversy. ZFS is the free File System and Logical Volume Manager introduced
    with OpenSolaris in 2005, and was released under Microsystems''s Common Distribution
    License (CDDL), which the Free Software Foundation has described as incompatible
    with the GPLv2 inaccessible to GNU/Linux.

    When purchased by Oracle, Microsystems had a considerable history as a beneficiary
    of open projects. Bill Joy, the prime of Sun and Solaris, the leader of BSD Linux,
    and wrote vi, NFS, the TCP/IP stack taking power. Sun''s support for free and
    open source software was not absent, but as its support of Java, the GNOME desktop,
    Mozilla and OfficeOrg, and other projects created a conflict between its open
    source and the freedom to reduce its to control of it. Sun always retains ownership
    and intellectual property rights of its projects, including those of Java, and
    as well as copyright assignment, in the case of OfficeOrg.

    ZFS, under the CDDL at a time when drawing CDDL of the incompatities; was, in
    fact, research into history includes the GPLv2-incompatible code from Solaris.
    Sun''s apparent goal was to draw developers from GNU and Linux development to
    Solaris. Not did it work to bring Linux code to Solaris, more importantly, Sun
    did not use technological advancements from Solaris to appear in Linux.

    Incompatibility with the GPL may have been deliberate, but time changed Sun''s
    offerings have long been subsumed by Oracle, and Oracle


    distributes its own version of Linux, a clone of Red Hat Enterprise, and could
    resolve the licensing issue by releasing ZFS under a less ambivalent, license
    as Apache and for example a free company, and has little interest in making life
    easier for the free and open source community.

    Software Freedom activists are unequivocal in their belief that Canonical''s inclusion
    of ZFS in an Ubuntu distribution is non-compliant with the GPL. By way of contract,
    the Law Center took a clear testimony, justified by keynels and statements by
    Linus Torvalds and the kernel-specific file that allows for the definition of
