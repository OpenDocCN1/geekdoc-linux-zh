  md: '# Tutorial


    # Master essential Sense HAT skills


    # Develop your Sense HAT skills and start a coding version of Rock, Paper, Scissors,
    Lizard, Spock


    Last November, two Raspberry Pi computers were fitted with an Astro Pi, which
    is an add-on board boasting an array of sensors and an 8B LED Matrix. These were
    flown to the ISS and delivered to Major Tim Pearce with a school of children''s
    experiments. In December, Astro was released for sale as the rebranded Sense HAT:
    exactly the same hardware and sensors found on the Astro Pi but with a new ''Sense
    HAT API''. The first part of this two-part tutorial takes you through the skills
    required to create a Sense HAT version of Rock, Paper, Scissors, Lizard, Spock.
    These skills also stand alone and you adapt them for your own projects.


    Dan Alfred

    isis a Raspberry Pi Certified Educator and a Lead School teacher

    He recently led a team of pupils to the winning of the Astro Pi secondary school
    contest


    # 01 Install the Sense HAT software


    First, attach the board to the GPIO header and install the Sense HAT software.
    This is pre-installed on the latest Raspberry images; for others it can be downloaded
    - boot up your Raspberry Pi, load the Terminal and type in sudo apt-get install
    sense-hat On completion reboot your Raspberry Pi.


    ```

    sudo apt-get update

    sudo apt-get install sense-hat

    sudo reboot

    ```


    # 02 Scrolling a message


    Writing code to scroll text on LCD / LED displays can be challenging and frustrating.
    The Sense HAT removes the difficulties and simplifies the procedure to a simple
    line of code: sense.show_message("This is a test message"). Open your Python editor
    and enter the code at the bottom of this step,


