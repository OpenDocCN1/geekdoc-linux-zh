    # **Region and locking**


    In HBase as a table grows in size it is automatically distributed across regions
    - being the units that the table belongs to, with its first row and last row defining
    the boundaries. This splits into regions of roughly equal size. A table that is
    too big for a single server is stored in a cluster of servers, with each node
    hosting a subset of the table''s total.


