    Why did you build an RC (remotely operated vehicle)?

    When I was a kid I frequently built RC models, sailing boats and speedboats. I
    was never discouraged and dreamed of having my own RC submarine, anyway at the
    time I had an RC, building from one was always tricky with its electronics and
