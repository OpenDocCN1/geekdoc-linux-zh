  md: '# Tutorial


    # # Create your own circuit diagrams with Fritzing


    ![](img/453752f2a570e8fff106aca09a3ea2e3_81_0.png)


    # ## Wonder how we illustrate circuit diagrams? With Fritzing – a donationware
    utility you can use too!


    Putting circuits together can be tricky, even for experts. Various notions exist
    that make it easier to work out where wires go, components and power sources are
    connected. But rather than those details with a pencil, use Fritzing to simplify
    the illustration. This is particularly useful for beginners, and if you''re demonstrating
    a breadboard-mounted circuit with an Arduino...


    #  01 Install Fritzing


    For the quickest installation option, use sudo apt-get install fritzing on Ubuntu
    (whichever Debian fork you''re using). Alternatively, for Fedora use yum fritzing.
    If you prefer to download it from the website, selecting the 32-bit or 64-bit
    as appropriate for your system.


    Christian Cayley


    is a former IT and software engineer since 2000 writing for computers and electronics,
    both online and in print magazines.


    I''ve been a developer over the years, and with Fritzing I can put much together
    circuit illustrations, simply by dragging and dropping the components into place,
    saving, and exporting. In addition to breadboard illustrations, you can also create
    traditional schematics and PCBs.


    #  02 Select your project type


    With the app launched, you''ll need to select an appropriate type. There are available
    in Fritzing Breadboard, Schematic, and PCB. We''re starting with the Breadboard
    project, so select this. Across the bottom of the screen you''ll see controls
    to add notes and rotate the board, with the mouse used to select and move elements.


    With some same familiar shortcuts and tools you might have already used in an
    art package, Fritzing is remarkably easy to use.


