    # # Simplify team communication with Mattermost


    ![](img/453752f2a570e8fff106aca09a3ea2e3_57_0.png)


    We''ll see how to install Mattermost and use it to enhance and simplify team communication


    **Nitish Tiwari** is a software developer by profession and open source enthusiast.
