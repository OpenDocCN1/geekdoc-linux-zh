    ## FFmpeg 3.0.0 “Einstein”


    Unsung hero that ffmpeg transcoding makes media codcs usable for your apps.


    FFmpeg transcoding libraries libavcodec, libavutil, libavformat, libavdevice,
    libavfilter, and libswample are used by VLC, Xine, getplay, Handbrake, and for
    playtime within Firefox. Also as a useful command line tool, you can forward ffmpeg
    streams, stream from disk, and probe, a useful tool for gathering information
    from streams directly; the output is “human-readable”. The FFmpeg project is dedicated
    to giving users the best encoders — external encoders where their own are not
