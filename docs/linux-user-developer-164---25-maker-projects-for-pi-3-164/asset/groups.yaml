    # 内核专栏


    Jon Masters 探讨了 Linux 4.5 发布时的最新进展，以及为将成为 4.6 版本的合并窗口开启的情况。


    > Linus Torvalds 宣布了 Linux 4.5 的正式发布，并指出他“无法决定是该发布 rc8 [发布候选版本]，还是一直等到现在。最后，我决定不发布了，但也可以有其他做法。”正如上个月报道的，此版本包含了几个翻天覆地的特性，这在典型的发布周期中是常有的（这在一年中会根据某些新功能的开发和合并周期性地发生）。我们新引入了通过
    `devmmap` 对易失性内存的新功能支持，我们在上期中中详细介绍了这一点，以及通过 `copy_file_range` 系统进行的优化。


    ### 修剪未使用的内核符号


    在 Linux 早期阶段，当 Linus 和 Andrew Tanenbaum 正就单体内核与微内核之间发生无数争论时（他们都在在线 usenet 上寻找幽默
    - usenet 是一种较旧的群组编程技术），Google 证明了单体 Linux 在将所有支持内核运行的代码整合到单个二进制设计中存在局限性。这与开放的微内核设计形成对比，微内核是由许多部分构建的内核，这些部分之间相互隔离，就像用户在
    Linux 下通过接口进行通信的方式一样。


    关于微内核设计的争论是大学课堂和论坛的热点话题 - 例如，Windows NT 及其延伸的现代 Windows，部分通过像 Mach OS 等设计得到了解决，Mach
    OS 运行在其构建内核时所使用的微内核之下。但在大多数情况下，Linus 选择这种方法的原因是，单体内核并非严格由一个单一、不可分割、不可分解的内核构成的，这种内核允许大幅度地使用模块化
    - 通过将代码编译为动态可加载模块 - 将此作为一种在添加和删除功能的同时，又在模块之间保持更轻量桥接的方法。


    Jon Masters


    Jon 是一位已经在 Linux 领域工作了 19 年的内核黑客，目前任职于剑桥利兹大学。他曾在一家大型企业 Linux 发行版公司工作过，并领导了高效 ARM
    驱动服务器标准的制定。


    使用新的系统调用 `copy_file()`（命令行使用的 Linux 和 Unix 文件复制工具）将不再需要对从用户空间文件到新文件中包含的数据进行大量复制，从而避免了每个入口的轮读-点操作和出内核操作。相反，Linus
    表示，使用新系统调用在许多正常情况下可以帮助加速运行。然而，当在使用 NFS（网络文件系统）时，由于也包含了服务器端拷贝（如发布所示，NFSv4 已可用），内核在运行
    NFS3 时节省了通过网络传输文件数据的开。


    随着 Linux 4.5 的发布，为将成为 4.6 版本的“合并窗口”（允许集成破坏性变更的时间段）已经开启。在合并窗口期间，允许集成破坏性变更。这在典型的发布周期中是常有的（这根据某些新特性的开发和合并，一年中周期性地发生）。


