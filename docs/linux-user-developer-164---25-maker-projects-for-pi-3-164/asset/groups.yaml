    mask 255.255.255.0

    ```


    转到你想访问的网站。对于你需要访问的服务，将 DNS 服务器 IP 地址设置为你的树莓派。你将看到一条与来自该服务的拦截相关的错误消息。这发生在我们记录正尝试访问的地址时。如果你正尝试从其他设备访问服务，可能需要重复此过程以捕获所需的特定设备地址。


