    # SOLUS OS


    ## 图形界面从未如此惊艳


    对于在座的资深用户来说，你们可能以前听说过 Solus 操作系统的开发——无论出于好理由还是坏理由。对于那些关注过幕后文章的人来说，你们可能想回顾一下我们在
    LU&D 162 中对创始人 Ikey Doherty 的完整访谈。


    在成功发布后，该项目旨在提供一种比常见的 GNOME 发行版更稳定且更具替代性的方案。毫无疑问，Solus 最具区别的特征是其独特的图形界面：Budget。Budget
    桌面是从零开始编写的，能够集成到其他系统中，并且本质上是一个独立的开源项目。


    它的核心是简单性，这是 Solus 高度依赖的特性，并在界面间切换时带来了极佳的回报。这很大一部分归功于 Raven 应用技术，它为桌面用户提供了一个直观的通知中心，这在现代发行版中仍然并不多见。它还具有极高的开箱即用可用性，不仅是因为提供了大量现成的软件，还使用了高对比度主题，使其成为视觉障碍人士的优选发行版。


    Solus OS 刚刚发布了其第一个版本（1 Shannon），随之而来，Budget 经过优化、精炼和调整，变得比以往任何时候都更好。对于那些害怕接触新事物并愿在界面上妥协的人，你真的需要尽快下载
    Solus。官方细节可以在 solus-project.com 找到。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_30_0.png)


    # 安全是 SOLUS OS 的关键


    ## 配置少，安装更简单


    让第一次测试 Solus 的用户感到愉悦的是，该网站没有多个工具链版本并存。Solus 团队仅发布最新构建，确保每个人同时拥有最佳版本。这也有助于防止出现数百个复刻的、有时是无意的配置，这些配置不受该开发团队的控制。“单一下载，随处适用”的心态对于新手和资深
    Linux 用户来说都是好事；在下载某些不需要的工具时面临的风险可能会给你的桌面带来大问题。幸运的是，Solus 为你所需的所有工具，因此你不需要在其他地方寻找下载。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_30_1.png)


    智能 Budget 桌面已经扩展到 Solus 之外的发行版


    # 下一代发行版特性


    ## ALPINE LINUX


    ### 不同口味的开箱即用体验


    极简发行版的真正定义


    与我们介绍的许多发行版相比，Alpine Linux 作为少数针对低资源计算机的发行版之一脱颖而出。它的默认容器需要的不到 8MB 空间，安装到磁盘仅占用
    130MB 的硬盘空间。也许最大的好处是，你可以期待极快的安装速度。而且，尽管体积很小，用户仍然觉得功能强大，因为还有了一组经过拆分和精简的仓库包，允许用户对要安装的内容有更多控制权。这里有很多选择，所以不用担心
    Alpine 过于简单。


    在最近的发布中，官方宣布 Alpine 将与 Docker 合作，为团队增加了另一个节点并保持了极小的资源占用。Docker 容器不需要独立的完整操作系统，并且可以利用低资源。这对你来说是天作之合。虽然有多种
    ISO 可供选择，但为想通过树莓派使用它的用户提供了定制下载。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_31_0.png)


    ## KORORA


    自 2005 年成立以来，Korora 经历了多次更新，曾被淡化并遗忘，最近被重新发明为完全全新的东西。它经历了一段旅程，成为最优秀的入门发行版之一。


    提供 Gnome 环境，然后根据他们的喜味和专业知识进行重度、详细的定制。


    我们还应该指出非常有用的 Perhaps 工具的存在，它适用于那些希望无需许多其他发行版那样复杂的流程就能获取应用程序的用户。Korora 的核心在于简单，用户将从中受益。


    虽然 Korora 是 Fedora 的重混版（remix），但 Fedora 似乎也忽略了这一点。它随带了许多开源和专有应用程序，因此终端用户不需要调整系统或设置。凭借
    Korora 承诺并交付的易用性，一个开箱即用的发行版的意义从未如此明显。


    Korora 更棒的一点是，它通过支持多种桌面环境，为用户提供了极大的自定义选项。用户可以轻松地在 MATE、Cinnamon、KDE、XFCE 和之间切换


    ![](img/453752f2a570e8fff106aca09a3ea2e3_31_1.png)


    Alpine Linux：为资源计算机构建的极简发行版


    上方管理文件，或选择将其分发云端


    ![](img/453752f2a570e8fff106aca09a3ea2e3_31_2.png)


    # BUNSENLABS


    ## CrunchBang 由其社区驱动的继任者延续


    许多用户对 CrunchBang发行版的终结感到遗憾，但它的继任者 BunsenLabs 开始成形，它是另一个社区驱动的发行版，提供了高度稳定且轻量级的 Openbox
    桌面，并可以使用 tint2 和 conky 监控。


    有很多 GTK2/3 壁纸和主题可以更改发行版的视觉效果，并为高级用户实现了几种 conky 配置。安装了额外的桌面和硬件软件包，使其成为少数在首次启动时提供完整体验的发行版之一。


    # 无束启动器


    你可以在桌面任何地方打开 Bunsenlabs 启动器——只需右键即可调出。如果功能被禁用，请查看菜单栏左侧的启动器图标


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_0.png)


    # 使用 CONKY 进行监控


    Conky 是 BunsenLabs 的主要功能之一。用户可以。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_32_1.png)


    Alpine Linux：为资源计算机构建的极简发行版


    上方管理文件，或选择将其分发云端


    （注：由于原文在此处截断结束）


    '
