    # # Make utility and Makefiles


    Make is a powerful build automation tool. Makefiles are the configuration files
    of GNU make, which is the standard implementation for Linux, and allow you to
    organize and build your projects with one command. The Makefile we made to support
    this invokes the execution of one of the following commands:


    +   - make clean

    - make my

    - make lex.y.c

    - make myCalc.c


    The ''clean'' rule is quite simple because it deletes everything except the source
    files. This ensures that myCalc.c, nor lex.y, will be deleted. The ''myCalc''
    rule generates the executable file myCalc.tab.c, myCalc.h, and lex.y.


    ```

    /* ''*'' ''/'' */

    /* ''+'' ''/'' */

    ```


    ```

    input : input statement "%vn";

    ```


    ```

    statement : printf("The output is %s\n", $);

    | quitCommand(0);

    ```


    ```

    expression : NUMBER ($= $1)

    | expression ''+'' expression ($= $1 + $2)

    | expression ''-'' expression ($= $1 - $2)

    | expression ''*'' expression ($= $1 * $2)

    | expression ''/'' expression ($= $1 / $2)

    ```


    ```

    void yyerror(char *msg) {

    | fprintf(stderr, "%vn\n", msg);

    }

    ```


    ```

    int main(int argc, char **argv) {

    | yyparse();

    | return 0;

    }

    ```


    The following rule shows how addition of two integers is implemented, which is
    perfectly straightforward:


    ```

    expression ''+'' expression ($= $1 + $3)

    ```


    The reason for adding $1 and $3 is because $2 is occupied by the ''+'' operator.


