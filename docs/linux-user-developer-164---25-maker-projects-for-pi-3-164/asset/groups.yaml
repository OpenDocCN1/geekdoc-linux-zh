- md: "\n# Tutorial\n\n# Hadoop\n\n## Use Hadoop data with HBase\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_45_0.png)\n\
    \nHadoop is for batch processing, but for real-time access of data, you should\
    \ use HBase.\n\nBig data - measured in terabytes/petabytes - cannot be stored\
    \ and processed with traditional databases, so it was only a matter of time before\
    \ something like Hadoop emerged. Hadoop uses HDFS-distributed filesystem and MapReduce\
    \ to store and manage this data.\n\nauto-managed by HBase at the time of cell\
    \ insertion. Rows and columns are grouped into column families; every column follows\
    \ the first row (the row key). The column family must be specified as part of\
    \ the table schema definition, but new column members can be added on demand.\n\
    \nHadoop is open source, the HBase project was started by Chad Wang and Jim Kalmers\
    \ at Yahoo and was modeled after Google's Big Table. HBase is suited for sparse\
    \ datasets, which are common in Hadoop and provides APIs that enable development\
    \ in different programming languages.\n\nEach row is a byte array, allowing anything\
    \ from strings to longer-serialized data structures as rows. The coordinates used\
    \ to identify data in a HBase table are row, family, and column; however there\
    \ are several strategies for supporting the types of query that secondly demands.\n\
    \n**Ashish Sinha**\nis an author, teacher, and open source enthusiast. With over\
    \ five years of experience in IT, he is currently exploring open source technologies\
    \ and tools.\n\n## Region and locking\n\nIn HBase as a table grows in size it\
    \ is automatically distributed across regions - being the units that the table\
    \ belongs to, with its first row and last row defining the boundaries. This splits\
    \ into regions of roughly equal size. A table that is too big for a single server\
    \ is stored in a cluster of servers, with each node hosting a subset of the table's\
    \ total.\n\n## Resources\n\n- Hadoop: http://hadoop.apache.org\n- HBase: http://hbase.apache.org\n\
    - Eclipse: https://www.eclipse.org\n\n## HBase data model\n\nApplications use\
    \ HBase data in labeled tables containing rows and columns. The intersections\
    \ of rows and columns are defined, and by their default is\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_45_1.png)\n\
    \n```\nFile Edit View Search Terminal Help\nApplications Places System\ntraining@localhost:\n\
    04/12/2023 16:51:24 INFO hbase.conf.hadoop.native.lib is deprecated. Use io.native.lib.available\
    \ instead.\nWarning: hbase.conf.hadoop.native.lib is not supported.\ntype 'STDOUT'\
    \ to leave the HBase Shell.\nOct 16 14:44:57 PM 2012\nhbase:main[001:0] get 'table',\
    \ 'row'\nrow\nrow\nrow\n(2 rows) in 0.4930 seconds\nhbase:main[002:0] get 'table',\
    \ 'row'\nrow\ncolfamily\n\ncolf:ia, timestamp:1456095695286, value=value1\ntimestamp:1456095695000,\
    \ value=value2\ncolf:c, timestamp:1456095705211, value=value3\n```\n\nRight HBase\
    \ attributes are timestamped, so you can get versioning with your stored databases.\n\
    \nHBase uses atomicity, consistency, isolation, and durability properties. When\
    \ an operation like put or delete starts, HBase retrieves the next transaction\
    \ number, WriteNumber. The flow of this transaction in HBase is: 1) lock the row\
    \ to guard against concurrent writes 2) write the change to the WAL (Write Ahead\
    \ Log); 3) apply changes to the MemStore (using WriteNumber to get the Keys);\
    \ 4) commit the transaction; 5) unlock the row. For read or scan HBase retrieves\
    \ the last committed number, called ReadPoint. The flow is: 1) get the current\
    \ ReadPoint; 2) list all scanned Keys with a timestamp greater than the ReadPoint;\
    \ 3) close the scanner.\n\n## Implementation\n\nHBase is comprised of a cluster\
    \ of one or more region servers. The HBase master orchestrating, assigning regions\
    \ to region servers, and recovering region servers when failures occur, handles\
    \ read/write operations. Region servers also manage the splitting and merging\
    \ of HBase-new regions.\nThe cluster is managed by ZooKeeper, which handles the\
    \ location and address of the cluster. ZooKeeper provides a distributed mechanism\
    \ to safely handle partial failure; it can be used as a rendezvous mechanism so\
    \ that the processes can interact with each other. All the partitions of regions\
    \ are managed by ZooKeeper, which assignment transactions so that if the server\
    \ crashes mid-assignment, the recovery can pick up from where the assignment crashed.\
    \ Region servers listed in HBase configuration for the remote nodes, an SSH-based\
    \ mechanism is used.\n\n## Installation\n\nThe prerequisite for HBase is that\
    \ HBase and Hadoop be installed across the nodes of the cluster and must have\
    \ SSH connection. HBase can be installed in three modes: standalone, pseudo-distributed\
    \ and fully distributed. It can be downloaded from http://www.apache.org/hbase/.\
    \ To set up, first go to the conf folder, of the hbase folder and set the JAVA_HOME\
    \ path by adding the line below:\n\nThe standalone mode uses a single implementation\
    \ of the local filesystem.\n\n```\nexport JAVA_HOME=/usr/lib/jvm/java-8\n```\n\
    \nNow open the hbase-site.conf file under the configuration table to specify the\
    \ folder for HBase and the ZooKeeper directory, as follows:\n\n```\n<configuration>\n\
    \  <property>\n    <name>hbase.zookeeper.client.quorum</name>\n    <value>localhost:2181</value>\n\
    \  </property>\n  <property>\n    <name>hbase.zookeeper.client.instance</name>\n\
    \    <value>hbase</value>\n  </property>\n  <property>\n    <name>hbase.cluster.distributed</name>\n\
    \    <value>true</value>\n  </property>\n  <property>\n    <name>hbase.rootdir</name>\n\
    \    <value>hdfs://localhost:2020/hbase</value>\n  </property>\n  <property>\n\
    \    <name>hadoop.fs.default</name>\n    <value>hdfs://localhost:2020/hbase</value>\n\
    \  </property>\n</configuration>\n```\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_46_0.png)\n\
    \n## HBase vs Map Reduce\n\nHBase uses HDFS in a different way than MapReduce.\
    \ In MapReduce, Hadoop map and then close, whereas HBase stays open at the cost\
