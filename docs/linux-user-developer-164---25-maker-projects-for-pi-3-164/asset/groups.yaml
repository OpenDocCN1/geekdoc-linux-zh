    \ the program does not have to write code to identify the status of each file\
    \ descriptor itself. If an error occurs, the function returns -1.\n\n+   - retval\
    \ = poll(fds, 1, 2500)\n\nThe poll system call is similar to select() and waits\
    \ for multiple file events. Similarly, the poll() system call is analogous to\
