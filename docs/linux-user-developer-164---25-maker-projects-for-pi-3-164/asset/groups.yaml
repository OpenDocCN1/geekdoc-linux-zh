    Right You can convert diagrams into proper schematics, too


    # # Mine your parts


    ![](img/453752f2a570e8fff106aca09a3ea2e3_83_1.png)


    In the Parts panel the second tab is where you start first running Labeled MINE,
    this is a place where you can collect the components and boards you really refer
    to this list, for instant access you need to create a diagram, to the relevant
    tab, and drop it into the MINE table.


    Fritzing helps you to create diagrams; it can also inform you there is a problem


    # ## 10 Manipulate others


    As you switch through to the alternatives (Schematic and PCB) you will find that
    the options for moving things are limited, although still possible.

    In instance, in the illustration above, representing an Arduino with a simple
    click and drag, the circuit originally built on a breadboard reveal a more collection
    of components that are connected with wires.


    # ## 11 Playing with the PCB


    Similarly, the PCB view shows a very different experience, and as how you move
    things around it is better than the Arduino and PCB circuit being presented as
    separate entities, in which the circuit also of the Arduino.


    Adjusting the position of circuits here tricky, but a more intimate look at just
    how the parts of the breadboard are connected.


    # ## 08 Incorporate others


    So we we''ve been playing with the breadboard on so far. but what if you''re developing
    a project with an Arduino too?

    The answer is in the Parts panel. The Arduino symbol (as "-" and "w" wrapped in
    a Mobob strip) and drag the corresponding Arduino board into the main panel, although
    your breadboard section of Arduino is also included.


    # ## 09 Familiarize yourself


    In fact, there are so many parts you can use in a Fritzing diagram that it is
    quite easy to find yourself overwhelmed by the choices to use.


    Use the tabs on the left column of the Parts panel to find the items you''re looking
    for; Find parts for Arduino, Intel Edison, Galileo, Sparkfun, and many more.


    As you move or select each part, details are displayed in the Inspector panel.


    # ## 12 Use the grid


    Keeping your project tidy is important, so more your Fritzing diagram. To help
    you, enable the View > Align Grid and Show Grid options, which will assist with
    repositioning the components you remove, on which of the three views you are currently
    using, and zoom level. Zoom is via the mouse, and fine-tuning using the arrow
    keys.


    84'
  - '[PAGE 84]


    # # Fritzing


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_0.png)


    Made with fritzing


    AMPLIFIER


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_1.png)


    # 13 Autoute assistance


    While it is not possible to automate the creation of Fritzing projects the next
    thing is available: While using the Schematic and PCB views, you can activate
    Autoute to automatically connect the components. You can also press Ctrl+Shift+A
    to make the work fast. This means that is all you need to do to place the components
    – the autoute will handle the rest!


    # 16 Get a quote


    Diagrams can be converted into physical entities using the Fritzing Quote service,
    which is initiated via Routing -> Fritzing Quote. In the resulting view you will
    see information about the size of the board, and a quote for 1, 2, 5 or 10 boards
    to be printed, exported in Euro. This means that a prototype board can be designed
    in Fritzing and a physical copy only


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_2.png)


    Your batch is for production, there are no connections to make that either are
    not close together


    # Export your project


    With your Fritzing project, you''ll probably want to share with others. By using
    the Export tool, found in the File menu, two options are available: As Image and
    For Export. If you''re planning to print your project out, choose JPG, PNG, SVG
    or PDF of the diagram, then select As and the preferred format. It will result
    in checking out some projects, so there''s so much you can do with Fritzing that
    may not have enough of:


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_3.png)


    # Detailed placement


    If you''ve ordered a PCB - perhaps a new Pi-HAT - you can use the Inspector tool
    inside the software!


    # 14 Is your project ready?


    Not only does Fritzing help you to create diagrams, but also inform you if you
    have a problem with the project. Once you use your components in the parts and
    PCB views, using Routing > Design Rules check and let the software device report
    back with them. Any issues that may come up are usually addressed by adjusting
    the position of parts and wires.


    # 15 List your parts


    Large projects can run away with you. When you''re prototyping something or on
    a breadboard, it is easy to forget something. In the File > Export parts menu,
    selecting this creates an HTML file that lists all the items included in the diagram,
    which means you have a list to refer for shopping parts.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_4.png)


    ![](img/453752f2a570e8fff106aca09a3ea2e3_84_5.png)


    Should you have a need to place component change the color of wires, you can employ
    the Inspector tool. With a component selected, you can adjust and draw traces
    in the Placement section of the Inspector panel to adjust it accordingly. Meaning
    will be reinforced by selecting the item and then changing the options in the
    colour box, Properties.


