    ## 树莓派 3 特性


    ## 无 FM 功能


    一直有人推测 Pi 3 拥有 FM 接收器，但这很可能是假的，James “证实”了这一点。“Wi-Fi 芯片是一个 BGA 设备，带有微小的焊点，他们必须将焊点焊接到
    PCB 上。现在，在那块芯片上，焊点间距为 0.4mm，这实际上是为更廉价的移动 PCB 设计的——比 Pi 使用的板子要高。其中一个原因是因为我们使用了低技术的
    PCB 设计，没有那么多巧妙的技巧，我们设法在覆盖层使用了高技术的部件——但是以牺牲 FM 为代价的——有太多信号需要布线，我们不得不采用更高规格的 PCB。”


    ![](img/453752f2a570e8fff106aca09a3ea2e3_19_0.png)


    正确的 James 也是 Fifteen 团队的一部分。对于基于模块的媒体播放器 - 但我们非常注重软件向后兼容、外形和舒适度，尽可能做到。因此目前没有计划制作
    64 位版本的树莓派。它需要两个独立的 GSU，我们必须对其管理。我们需要重写所有内容以理解 64 位，这是一项巨大的工作，然后你就能获得支持方面的收益。


    从技术上讲，64 位 Linux 的性能提升是可能的，我们将来会花时间考虑这是否值得。目前 64 位以及所有未来的 ARM 核心都将支持它——这很困难，但我们没有选择。我们将观察发生什么；这种状态也很好。


    已经相当不错了。但这会杀死你的 Pi 3 吗？绝对不会。2837 SoC 已经通过了 125°C 温度运行的认证，我认为它有十年的寿命——这就是我们切断担忧并说“到此为止”的地方——我们并不担心故障的发生。


    当树莓派达到高温时，它会触发降频——固件将其设置为 85°C。正如你在 Gareth 的工作中看到的那样，你可以让树莓派达到更高的温度。芯片上存在温度梯度——降温位于芯片的一个角——但在另一端它运行良好。我们的温度算法比
    Gareth 的更准确。


    正如你所说，芯片确实会变热，尤其是当被推运转时，然后它们会降低频率和电压。所以如果你在非常重的负载下使用 Pi 2 或 3，Pi 可能会过热并关机，且每天如此。我们现在提供的速率要快得多，所以我们只是在推向物理极限。


