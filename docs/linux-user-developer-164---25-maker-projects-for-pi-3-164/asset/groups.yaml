    # Tutorial


    # # Create your own circuit diagrams with Fritzing


    ![](img/453752f2a570e8fff106aca09a3ea2e3_81_0.png)


    # ## Wonder how we illustrate circuit diagrams? With Fritzing – a donationware
    utility you can use too!


    Putting circuits together can be tricky, even for experts. Various notions exist
    that make it easier to work out where wires go, components and power sources are
    connected. But rather than those details with a pencil, use Fritzing to simplify
    the illustration. This is particularly useful for beginners, and if you''re demonstrating
    a breadboard-mounted circuit with an Arduino...


    #  01 Install Fritzing


    For the quickest installation option, use sudo apt-get install fritzing on Ubuntu
    (whichever Debian fork you''re using). Alternatively, for Fedora use yum fritzing.
    If you prefer to download it from the website, selecting the 32-bit or 64-bit
    as appropriate for your system.


    Christian Cayley


    is a former IT and software engineer since 2000 writing for computers and electronics,
    both online and in print magazines.


    I''ve been a developer over the years, and with Fritzing I can put much together
    circuit illustrations, simply by dragging and dropping the components into place,
    saving, and exporting. In addition to breadboard illustrations, you can also create
    traditional schematics and PCBs.


    #  02 Select your project type


    With the app launched, you''ll need to select an appropriate type. There are available
    in Fritzing Breadboard, Schematic, and PCB. We''re starting with the Breadboard
    project, so select this. Across the bottom of the screen you''ll see controls
    to add notes and rotate the board, with the mouse used to select and move elements.


    With some same familiar shortcuts and tools you might have already used in an
    art package, Fritzing is remarkably easy to use.


    82'
  - '[PAGE 82]


    # Fritzing


    ![](img/453752f2a570e8fff106aca09a3ea2e3_82_0.png)


    # Put together circuit illustrations, simply dragging and dropping


    # 06 Add components


    To build your project, you''ll need to do this: Fritzing highlights the components
    you need into the main panel. Look carefully as the breadboard highlights the
    areas that should aid you connecting to the components. These aides will aid you
    with your wires, although it isn''t a perfect guide for creating circuits. However,
    of if you''re new to breadboards, it can help you understand how they work.


    # 07 Switch views


    Breadboarding is an easy way of putting circuits together. The graphical representation
    isn''t for everyone''s liking. Fritzing includes various parts that you can view.
    From the top of the screen you will see the Schematic and PCB buttons. Click to
    switch these views - the project you''re currently working on will be displayed
    in a different format! You can use perfect export later on the project.


    # 03 Select your parts


    The next stage is to identify the parts that you need to add to the breadboard
    to complete your journey. For a finished diagram, you want to keep it as simple
    as possible, but for now you have the scope to have a play around. In Parts Box
    in the top-right corner, choose the appropriate tab and drag components and wires
    to your breadboard with the Ctrl key to drop them.


    # 04 Manipulate your board


    Once you add components to the board, spend a few moments with the mouse to get
    an idea of what you want to do. Left-click on the board allows you to move it
    about, for instance, right-click to rotate and lock parts. You can also use your
    mouse scroll and the key to zoom in and out.


    # 05 Add wires


    Adding a wire by the left-starting point and the end point. Breadboard pins have
    labels assigned, and these can be displayed by hovering your mouse over them to
    identify them.

    You can also add pivots to the wires, which can be useful if you have a busy project.
    Simply click-left the length of the wire and pull it in the direction you want.


    Above Fritzing covers a range of components as well as boards like Arduino


    Once you start using Fritzing, it''s great to see the components that you use
    early in the project, and to see them in the main panel. If you need to switch
    between the different categories, you can easily identify the components without
    wasting time switching between them! You''ve already selected them!


    ![](img/453752f2a570e8fff106aca09a3ea2e3_82_1.png)


    www.linuxuser.co.uk | 83


    ![](img/453752f2a570e8fff106aca09a3ea2e3_82_2.png)'
