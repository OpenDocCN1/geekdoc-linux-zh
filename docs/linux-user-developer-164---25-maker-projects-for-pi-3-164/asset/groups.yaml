    # Feature Next-gen distros


    # QUBES


    Take your security game to the next level


    ![](img/453752f2a570e8fff106aca09a3ea2e3_33_0.png)


    Despite the protection we implement on the machines, there''s always the concern
    they will be compromised. While we''ve encountered numerous security-oriented
    distros, Qubes'' main focus is centred around security by compartmentalisation,
    which allows for different parts of your digital footprint to be isolated between
    different virtual machines.


    While it may seem complex, the premise is actually fairly simple. By splitting
    your digital footprint into VMs, if one of them is compromised, there''s no way
    for other parts of your footprint to fall victim to the same fate. If you accidentally
    open a malicious website or download a risky attachment, all separate so that
    your digital life won''t be taken down in one few swoop.


    However, virtual machines also be compromised, right? Likely, Qubes has taken
    care of too. Wherever VMs run off the core hardware. What this means is that the
    attacker is capable of breaking through the entry of the hardware, which is vastly
    more difficult, than just the OS.


    A recently implemented install means that using a USB VM to protect against USB-sourced
    malware, and network VMs to quarantine sensitive documents, made easily available.
    What Qubes is offering is a new solution to desktop security; if you care about
    your digital security, this is the distro you need.


