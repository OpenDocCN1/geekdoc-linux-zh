    # 评树莓派3


    ![](img/453752f2a570e8fff106aca09a3ea2e3_25_0.png)


    # 迷你电脑


    # 树莓派 3 Model B


    | 特性 |

    | :--- |

    | 博通 BCM2837 |

    | 1.2GHz，四核 ARM Cortex-A53 |

    | 博通 VideoCore VI |

    | 1GB RAM |

    | Micro SD 卡存储 |

    | 40 针 GPIO 插座，已填充 |

    | 10/100 有线以太网，2.4GHz Wi-Fi |

    | 蓝牙 4.0 Class LE |

    | 接口：3.5mm 音视频接口、4x USB 2.0、以太网、HDMI |

    | 价格：£31.66 (gppf.raspberrypi.com) |


    为了庆祝该项目一周年而发布的 Pi 3 是否继承了它前代的所有优点？


    树莓派 3 发布于树莓派基金会的四周年生日当天——或者是一周年，因为是闰日——初看之下它很容易被忽视。它与之前的树莓派 2 并不相同，但外壳下方的微型芯片留下了差异的首要迹。


    Pi 3 是第一款具备无线连接功能的树莓派，基金会在电路板背面 2.4GHz 单频 Wi-Fi 旁增加了一个芯片——以及蓝牙 4.0 和低功耗蓝牙 (BLE)。


    树莓派 3 核心的系统 (SoC) 也是全新的。正如树莓派 2 升级了其单核 ARMV6 BCM2836 一，树莓派 3 采用了定制的 ARMV7 BCM2837，使得新的
    Pi 3 成为家族中第一个支持 Raspian（其定制的 Debian）的型号。


    遗憾的是，目前提供的版本是没用的。树莓派基金会表示，它将维护其定制 Debian Debian Raspbian，针对旧的 ARMV6 指令集编译，并带有特定应用的
    ARMV7 设置。


    尽管如此，新的 Cortex-A53 核心相比旧型号提供了显著的提升。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_0.png)


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_1.png)


    # 如果你觉得旧型号限制很大，那么新的树莓派 3 可能是你正在寻找的设备


    相比早期型号速度大幅提升；内置无线连接；近乎向后兼容；64 位潜力


    # 缺点


    Pi 3 可以在 49 秒内完成多线程 SysBench CPU 测试，而 Pi 2 需要 76.28 秒，原始代树莓派甚至难以达到这一目标。我们可以轻易地看到我们进步了多远：Araya
    的帧率在 Pi 3 上达到 51 帧/秒，Pi 2 上为 57 帧，而在旧的 Model B 上为 19.4 帧。如果你觉得旧的树莓派型号限制太多，树莓派
    3 可能就是你一直在寻找的。


    Pi 3 是第一个：基金会建议“可能需要散热器”的型号。虽然不是必须，但在正常使用时，温度通常会升到 80°C 以上。


    对设备设计关注较少这一事实反而是件好事。大多数现有配件和扩展卡都可以立即使用，如果通风不畅，GPIO 端口 UART 可能会产生一些兼容性问题。


    然而，性能提升是有代价的：热量。在负载下，BCM2835 运行在 87°C-90°C，这导致我们的模型达到了超过原始规格的高温，而这一问题在树莓派基金会写作期间还无法复现。Pi
    2 周围的 SoC 温度在左右，这是一个大幅增加，而且如果你把树莓派放在外壳里，情况会更好。这并不意外。


    一个负面因素是性能有限，与原始 Model B 的所有型号一样，这些都通过共享通道连接到 SoC，限制了可用带宽——至少每个端口能提供的功率已经得到提升以提高性能。


    # 总结


    无线连接使得 Pi 3 比其前代更了一步，即使在考虑热性能和优点之前。新的树莓派保留了前代所有的缺点，共享带宽除外。


    - Gareth Halreece


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_2.png)


