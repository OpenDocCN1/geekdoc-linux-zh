    # 3D PRINTER


    You can control a 3D printer using the Pi3, and the extra horsepower means you
    can handle the slicing on the Pi as well. First of all, you''ll need to set up
    a appropriate kit in the RepRap project - RepRap supports multiple 3D printers,
    so you just need to find a friend with a home or street 3D printer in order to
    run off the parts (check here: http://reprap/wiki/RepRap_Hutter).


    With your 3D printer up, install the OctPi image onto your SD card and then use
    the included software, such as OctoPrint and CuraEngine, to manage it.


    G-Code and slicing, it all via Wi-Fi. You could even set up the camera module
    inside the 3D printer and time-lapse footage of your prints, you''ll want a powered
    external hard drive to save the video files.


    # PRACTICAL GADGETS


    ## PIBOOK


    Fit a display into a 3D-printed laptop case, along with a keyboard and trackpad.
    Use Bluetooth speakers for audio and connect to the internet via Wi-Fi. Switch
    to a portable power pack if you want to go mobile. Run something like Linux MATE
    for the look.


    ### Parts

    - 3D printer

    - Camera module

    - Powered external hard drive


    ## PPAD


    Mount your Pi on the back of the official touchscreen display and it all up. Use
    a couple of screws so it can be unattached to a portable power pack. Be sure to
    pair it with Bluetooth so you can get the command line.


    ## WI-FI HOTSPOT


    ## SUPER SERVER


    Set up your Pi as an access point for other devices, which can share IP addresses.
    Connect to the internet via ethernet, and it will act as a bridge for the devices
    connecting via Wi-Fi. If you''re trying to get a connection in your garden, use
    a portable dongle. You use the on-board Wi-Fi to connect to your home network
    and plug the router in Wi-Fi to broadcast your hotspot.


    The Raspberry Pi 3 can keep up with huge amounts of requests - the Pi Foundation
    ran an experiment with the Pi 3 to see if it could keep up with the high traffic
    (see Pi-3-GBR), and over 12 hours it served 15 million requests. If your website
    is high, you can serve it from the Pi, and now it''s fast. Wi-Fi can connect it
    remotely while it''s tucked away in a drawer somewhere.


    ## SMART TV


    Install Kodi, mount your Pi onto the back of your TV. Connect your Pi to the TV
    via HDMI, use a USB drive for external storage to add movies, and set up with
    wireless widgets. Connect via Bluetooth or grab the Kodi app.


    ### Parts

    - Portable speakers

    - power pack

    - Wi-Fi dongle


    ## MEGA MEDIA CENTRE


    Get your monitor, speakers, keyboard and mouse plugged in, then install OSMC -
    this is your home theatre centre. Configure a Bluetooth receiver, a control remote
    or a tablet. Connect an external hard drive to your Raspberry Pi, loaded with
    all your favourite music, movies and TV shows. Use OSMC to browse the content
    stored on your external hard drive, and add new files from USB flash drives when
    you plug them in. Set your Pi as a media server for your mobile devices. Firstly,
    browse OSMC''s App Store for things like torrent client and TV tuner.


    ### Parts

    - Home theatre peripherals

