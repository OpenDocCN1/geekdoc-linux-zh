    \n### 额外功能\n\nownCloud 拥有许多额外功能，包括完整的日历和联系人支持。然而，协作编辑系统吸引了我们的注意。如果几个人同时进行项目工作，任何更改都可以通过电子邮件汇总给其他成员。在大多数情况下，这是一个非常直观的系统。\n\
    \n### 总结\n\n用户需要时间来完全设置 ownCloud，但其丰富的功能和协作选项使其成为市场上某些闭有软件潮流的严肃替代品。\n\n### 文件管理\n\
    \n添加到您的 Bitcase 账户的任何文件都受到 AES-256 加密的保护，因此提供了一些保护。它支持各种文件类型，无论原始格式或源自什么操作系统。遗憾的是某些文件的上传速度较慢，但这似乎并不是问题。\n\
    \n"
