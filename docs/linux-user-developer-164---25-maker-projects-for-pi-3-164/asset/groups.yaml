    # 教程


    ## 使用 Fritzing 创建你自己的电路图


    ![](img/453752f2a570e8fff106aca09a3ea2e3_81_0.png)


    ## 奇奇我们是如何绘制电路图的吗？使用 Fritzing —— 这是一项捐赠软件实用工具，你也可以使用！


    将电路组合在一起可能非常困难，即使对于专家也是如此。存在许多概念，可以让你更容易地确定导线的去向、组件和电源源是如何连接的。但与其用铅笔画这些细节，不如使用
    Fritzing 来简化绘图。这对于初学者来说特别有用，如果你正在演示一个安装在面包板上的 Arduino 电路……


    ## 01 安装 Fritzing


    要获得最快速的安装选项，请在 Ubuntu 上使用 `sudo apt-get install fritzing`（无论你使用的是哪一个 Debian 派生发行版）。或者，对于
    Fedora，请使用 `yum fritzing`。如果你倾向于从网站下载，请根据你的系统选择 32 位或 64 位版本。


    Christian Cayley 是一位自 2000 年起一直工作的 IT 和软件工程师，在在线和纸质杂志上撰写计算机和电子文章。


    多年来我一直是一名开发者，通过 Fritzing，我只需简单地将组件拖放到所需位置、保存并导出，就可以组合许多电路图。除了面包板图外，你还可以创建传统的原理图和
    PCB 板板。


    ## 02 选择你的项目类型


    启动应用后，你需要选择一个合适的类型。Fritzing 可用的类型有面包板（Breadboard）、原理图（Schematic）和 PCB。我们将从面包板项目开始，所以请选择此项。在屏幕底部，你将看到添加注释和旋转面板的控制控件，并使用鼠标选择和移动元素。


    通过一些你可能已经已经在艺术软件包中使用过的熟悉快捷键和工具，Fritzing 用起来非常简单易用。


    # Fritzing


    ![](img/453752f2a570e8fff106aca09a3ea2e3_82_0.png)


    ## 只需拖放即可组合电路图


    ## 06 添加组件


    为了构建你的项目，你需要执行此操作：Fritzing 在主面板中突出显示你需要的组件。仔细观察，面包板会突出显示有助于你连接到组件的区域。这些辅助将帮助你连接导线，尽管它不是创建电路的完美指南。但是，如果你是面包板的新手，它可以帮助你理解它们的工作原理。


    ## 07 切换视图


    使用面包板是组合电路的一种简单方法。图形化表示并不符合所有人的胃。Fritzing 包含了你可以查看的不同部分。从屏幕顶部，你会看到原理图（Schematic）和
    PCB 按钮。点击切换这些视图 —— 你正在进行的项目将以不同的格式显示！你可以在项目后期使用完美的导出功能。


    ## 03 选择你的零件


    下一阶段是识别需要添加到面包板上以完成你的旅程的零件。对于一张完成的图表，你希望它尽可能简单，但现在你有空间进行一些尝试。在右上角的零件框（Parts Box）中，选择相应的标签页，并将组件和导线拖到面包板上，按
    Ctrl 键释放它们。


    ## 04 操作你的面板


    一旦你将组件添加到板上，花几分钟时间使用鼠标来思考你想做什么。左键点击面板可以让你移动它，例如，右键点击可以旋转和锁定零件。你还可以使用鼠标滚轮和键进行放大和缩小。


    ## 05 添加导线


    通过左侧起点和终点添加导线。面包板引脚分配有标签，可以通过将鼠标悬停在上面来显示它们并识别它们。

    你还可以为导线添加转折点（pivots），如果你的项目很复杂，这将很有用。只需左键点击导线长度并按你想要的方向拉即可。


    Fritzing 涵盖了各种组件以及如 Arduino 等板


    一旦你开始使用 Fritzing，看到项目早期使用的组件并在主面板中看到它们是非常棒的。如果你需要在不同类别之间切换，你可以轻松识别组件，而无需浪费时间在它们之间切换！你已经选中它们了！


