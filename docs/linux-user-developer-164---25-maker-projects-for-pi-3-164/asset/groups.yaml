    \ testimony, justified by keynels and statements by Linus Torvalds and the kernel-specific\
    \ file that allows for the definition of what is to be a ‘derivative work.’\n\n\
    ’ZFS has been made available by programmers using the free software CDDL-licensed\
    \ versions,’ wrote Moglin, “for use as a filesystem in Linux systems through the\
