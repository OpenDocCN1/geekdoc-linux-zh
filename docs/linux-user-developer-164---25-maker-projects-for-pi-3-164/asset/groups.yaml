    # Anonymise your web traffic with a Pi Tor router


    Use your Raspberry Pi as a wireless access point and route traffic anonymously


    Are you concerned about your online privacy? Suspect that the NSA or GCH are tracking
    you? Or are you simply announcing advertising networks targeting your ads? If
    this is the case, or you''re simply on the lookout for a wireless access point
    that is secure, consider setting your Raspberry Pi up as an anonymising network
    and setting up Tor on all your PCs and mobile devices.


    If you''re unsure, Tor is free software that enables you to browse anonymously
    through a network of over 7000 relays. By doing this, your location and website
    can be concealed from trackers, analysis and surveillance.


    This is all about protecting your privacy. By making your visits to websites,
    instant messages, emails and more difficult to track, you can set up your Raspberry
    Pi with a wireless dongle for a Raspberry Pi 3, Ethernet cable, and a bit of configuration.


    ## 01 Connect everything


    With everything connected and switched on, you can begin configuring the Raspberry
    Pi. So by plugging one end of the Ethernet cable into your Raspberry Pi and the
    other into a switch or router.


    If you''re using a 2016 model of the Raspberry Pi, connect your wireless dongle
    to the computer. Pi 3 owners don''t need to do this as it has built-in networking.


    ## 02 Remotely configure with SSH


    The next step is to connect to your Raspberry Pi via SSH. You can do this using
    SSH. (If this isn''t an option, continue the rest of the tutorial with a monitor
    connected to your Raspberry Pi, with a mouse and keyboard.) To use SSH, open a
    terminal and enter:


    ```bash

    ssh pi@192.168.1.28

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_77_0.png)


    ### What you''ll need


    - Ethernet cable

    - Wireless router

    - USB WiFi adaptor or Raspberry Pi 3


    ## Tor torrent router


    ```bash

    $ pi@raspberry:~$ apt-get update

    [1] Fetch lists... Done

    [2] Dependency tree... Done

    [3] Reading package information... Done

    [4] Building package list... Done

    ```


    pi@raspberry:~$ apt-get update

    ort: - Failed to connect to 192.168.1.27: Connection can''t be established.

    Are you sure you want to continue? [Y/n] y


    ## Tor is free software that provides anonymity online and routes traffic through
    a network without logging


    ```bash

    $ pi@raspberry:~$ sudo apt-get install tor

    ```


    The Raspberry Pi has the default username "pi" and the IP address 192.168.0.27.
    If you don''t have SSH open-client, you can install one or communicate via SSH
    in Windows PuTTY.


    You''ll find the IP of your Raspberry Pi by checking your router''s admin page,
    monitoring a keyboard and checking other devices.


    ## 03 Access point


    Next, connect to your Raspberry Pi with SSH and install wconfig to ensure the
    wireless adapter is recognized, refresh the list with sudo apt-get update and
    install the wireless access point software:


    ```bash

    sudo apt-get install isc-dhcp-server

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_78_0.png)


    | file | path | status |

    |---|---|---|

    | dhcpd.conf | /etc/dhcp/dhcpd.conf | |


    ```

    option definitions to connect to supported networks.

    option domain-name servers example.example.org;

    option default-router 192.168.0.1;

    max-lease-time 600;

    min-lease-time 600;

    ```


    If you want to log messages to a different log file, make sure the permissions
    are correct or the DHCP service will fail.


    ## 04 Edit DHCP settings


    Next, we need to edit /etc/dhcp/dhcpd.conf, to avoid IP addresses being assigned
    randomly. Open with nano:


    ```bash

    sudo nano /etc/dhcp/dhcpd.conf

    ```


    Scroll through the lines starting "option domain-name" and comment them out with
    #


    - option domain-name-servers example.example.org;

    - option domain-name-internal.example.org;


    Following this, uncomment the line that is the default gateway and remove the
    #


    ## 05 Specify Addresses


    Head down we need to edit the end of the document and add the following lines
    to define the IP address for the client, the range of addresses and the domain
    name servers (known as DNS):


    ![](img/453752f2a570e8fff106aca09a3ea2e3_78_1.png)


    ```

    subnet 192.168.0.0 mask 255.255.255.0 {

    range 192.168.0.20 192.168.0.250;

    option default-router 192.168.0.1;

    max-lease-time 600;

    min-lease-time 600;

    option domain-name "local";

    }

    ```


    Note that the domain name specified here is provided by Google. Press Ctrl+X to
    save, exit,.


    ## Deal with errors


    Various errors can occur during the setting up of this project with Your settings
    are examples:


    This can be dealt with by checking the config file:


    ```bash

    sudo nano /etc/tor/tor

    ```


    Find the lines that say "Server" and comment out the lines that need. You will
    need to restart your Raspberry Pi to fully overcome the error.


    www.linux.com


    ## Set up the wireless adapter


    Which Pi can you use?


    With the older Raspberry Pi, better results are achieved with Pi 4 and Pi 3. Once
    using nano again, open the /etc/interfaces file and comment out lines with:


    ```

    #if wlan0 inet manual

    #wpa_supplicant.conf

    #if default dhcp

    ```


    simple: both have four ports, connection such as keyboard and mouse, are both
    enough with volumes of data. Pi Zero wouldn''t be practical as a long term.


    Find the line below and add the following:


    ```

    if wlan0 inet static

    address 192.168.1.2

    netmask 255.255.255.0

    ```


    Use Ctrl+X to save, and exit.


    ## 08 Configure your Wap


    With the wireless adapter built, the software is then defined, it is time to configure
    it. Create a new file:


    ```bash

    sudo nano /etc/hostapd/hostapd.conf

    ```


    To this, adding following:


    ```

    interface=wlan0

    mode=Hotspot

    channel=6

    mac_acl=0

    ignore_broadcast=0

    wpa=2

    wpa_phrase=YourPassword

    pairwise=TKIP

    ```


    You can specify your own password here.


    ## 09 Find the configuration file


    By default, your Raspberry Pi will not be visible when the wireless access point
    boots. To do this, you need to point it to the /etc/default/interfaces file. Open
    nano and look for the line that DAEMON_CONF=. Uncomment this, and add the path
    to the file:


    ```

    DAEMON_CONF=/etc/hostapd/hostapd.conf

    ```


    Press Ctrl+X to save.


    ## 10 Configure network address translation


    Network address translation, or NAT, needs to be configured to allow devices -
    laptops, tablets, media streamers, etc to connect to the Raspberry Pi wireless
    access point and route traffic through that IP address. /etc/sysctl.conf with
    nano and at the bottom of the file:


    Update the initialisation (init) scripts with:


    ```bash

    sudo service hostapd start

    sudo service isc-dhcp-server start

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_79_0.png)


    ## Tor router


    NAT needs to be configured to allow devices to connect to the Raspberry Pi’s wireless
    access point. Restart with `sudo shutdown`, and retry the connection from your
    mobile device.


    ## 14 Time to install Tor


    With this setup, the Raspberry Pi is a wireless access point. But it is not anonymous
    yet. Reconnect via SSH and run `sudo apt-get install tor`, then open `/etc/tor/torrc`
    in nano and add the following to anonymise the wireless access point:


    ```

    Log file /var/log/tor/reporter.log

    VirtualNetworkAddress 192.168.2.10

    AutoHostsSuffixes

    AutoHostsResolve 1

    TransportPort 9050

    TransListenAddress 192.168.2.1

    DNSListenAddress 192.168.2.1

    ```


    ## 15 Add SSH exception


    Next, follow the flat:


    - sudo iptables -t nat -F

    - sudo iptables -t nat -F


    And follow this by adding an exception for SSH connections to port 22:


    - sudo iptables -t nat -A PREROUTING -i wlan0 -p tcp --dport 22 -j REDIRECT --to-ports
    22


    These rules allow DNS lookup and direct TCP traffic to Tor’s port 9040.


    ```bash

    sudo iptables -t nat -A PREROUTING -i wlan0 -p udp --dport 53 -j REDIRECT --to-ports
    53

    sudo iptables -t nat -A PREROUTING -i wlan0 -p tcp --syn -j REDIRECT --to-ports
    9040

    ```


    Save the NAT file with:


    ```bash

    sudo sh -c "iptables-save > /etc/iptables.ipv4"

    ```


    ## 16 Enable the Tor service


    At this stage, you can enable the Tor service on wireless access point:


    ```bash

    sudo service tor start

    ```


    Boot scripts can be enabled:


    ```bash

    sudo update-rc.d enable

    ```


    Restart the Pi with `sudo reboot -now`.


    ## 17 Verify anonymity


    With your Raspberry Pi wireless access restarted, it’s time to connect via a Wi-Fi
    enabled device, perhaps a smartphone or laptop. As before, the connection should
    work without anonymity.


    Find out by using https://torproject.org from two devices and comparing the IP
    addresses. If they’re different, you’re anonymous!


    > Even you could use the Pi’s Bluetooth, control, smart phone gadgets as well
    as nt traffic through Tor.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_80_0.png)

