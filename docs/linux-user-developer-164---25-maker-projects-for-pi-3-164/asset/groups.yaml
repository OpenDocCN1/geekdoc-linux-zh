    # 多媒体


    ## FFmpeg 3.0.0 “爱因斯坦”


    ffmpeg 转码是一个无名英雄，它让媒体编码器在你的应用程序中可用。


    FFmpeg 转码库 libavcodec、libavutil、libavformat、libavdevice、libavfilter 和 libswample
    被 VLC、Xine、getplay、Handbrake 以及 Firefox 内部播放器使用。此外，作为一个实用的命令行工具，你可以转发 ffmpeg 流、从磁盘流媒体，并进行探测（probe），这是一个用于直接从流中收集信息的有用工具；其输出结果是“人类可读”的。FFmpeg
    项目致力于为用户提供最好的编码器——在自带编码器尚不成熟时提供外部编码器，并在没有明显“最佳选择”时提供内部和外部编码器。直到最近，ffmpeg  一直使用
    VisualON AAC，而 3way AAC 编码器不再受支持、处于实验阶段，且外部库已被移除。其他更改还包括更多的 HD 解码器，且安装变得简单——无需运行最新的发行版，Ubuntu
    14.04 可使用 PPA 进行切换，且在 http://johnavickle.com/ffmpeg 提供 2.6.32 及以上的 32 位和 64 位二进制文件——但
    Git 版本会更新。


    ### 优点

    直接使用或在脚本中使用，它快速且强大，无需费力即可获得结果。


    ### 缺点

    有许多命令行开关供选择以获得最佳选项。


    ### 非常适合...

    通过命令行控制你喜爱的媒体解码器。


    ## RSS 阅读器


    ### QuiteRSS 0.18.3


    一个让你告别 SaaS 订阅的跨平台阅读器。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_92_0.png)


    ![RSS 图标](https://example.com/rss_icon.png)


    指示网站订阅源的小符号可能没有一年前那么有用了，但对于大多数重要的新闻网站来说，那里都有订阅源——即使通过 Google 很容易找到。Google Reader
    服务在三年前关闭了——就这么简单，但许多人直接跳到了 Feedly 等其他服务。如果你喜欢阅读订阅内容，并且为了避免可能像 Google Reader 那样轻易消失的网页版阅读器，QuiteRSS
    是一个非常值得尝试的小巧阅读器。它提供 Arch、FeedRSS、Gint、Generic 和 OperaRSS 的包，以及 OS X 和 Windows
    版本。基于 Qt 的版本也移植到了 MS OS，以备你极少数人的需求。


    我们目前在 Ubuntu 的 OpenJDK 7 上遇到了一些稳定性问题，但我们不能在这里怪 QuiteRSS，因为这在其他地方也给我们带来了麻烦。在日常使用中响应良好，但最重要的是我们想要的功能：在带有广告拦截的嵌入式浏览器中处理
    RSS 和 Atom 订阅。


    通过对所有订阅源、嵌入浏览器和过滤的视图，新闻将主动找上门。


