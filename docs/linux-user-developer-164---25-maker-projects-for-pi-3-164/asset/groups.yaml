    # Review Raspberry Pi3


    ![](img/453752f2a570e8fff106aca09a3ea2e3_25_0.png)


    # Mini PC


    # Raspberry Pi 3 Model B


    | Feature |

    | :--- |

    | Broadcom BCM2837 |

    | 1.2GHz, Quad-core ARM Cortex-A53 |

    | Broadcom VideoCore VI |

    | RAM 1GB |

    | Storage Micro SD card |

    | GPIO 40-pin header, populated |

    | 10/100 wired Ethernet, 2.4GHz Wi-Fi |

    | Bluetooth 4.0 Class LE |

    | Ports 3.5mm audio-video jack, 4x USB 2.0, Ethernet, HDMI |

    | Price £31.66 (gppf.raspberrypi.com) |


    Released to celebrate the project''s first birthday, is the Pi 3 everything it
    has been for?


    Launched on the day of the Raspberry Pi Foundation''s fourth birthday - or first
    birthday, it was a leap day - the Raspberry Pi 3 is easy to dismiss at first glance.
    It is not identical to the Raspberry Pi 2 before, but the presence of a small
    chip under the cover leaves the first sign of difference.


    The Pi 3 is the first Raspberry Pi to feature wireless connectivity, and the Foundation
    has added a chip on the underside of the board beside 2.4GHz channels-only Wi-Fi
    - along with Bluetooth 4.0 and Bluetooth Low Energy (BLE).


    The system-on-chip (SoC) at the heart of the Raspberry Pi 3 is new, too. Just
    as the Raspberry Pi 2 upgraded its single-core ARMV6 BCM2836, the Raspberry Pi
    3 features a custom-made ARMV7 BCM2837 making the new Pi 3 the first in the family
    to support Raspian, its customised Debian


    Sadly, what is present at present is useless. The Raspberry Pi Foundation has
    indicated that it will maintain Raspbian, its customised Debian distribution,
    compiled for the old ARMV6 instruction with a setting of application-specific
    ARMV7.


    Despite this, the new Cortex-A53 cores offer a considerable boost over older models.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_0.png)


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_1.png)


    # If you''ve found the older models restrictive, the new Raspberry Pi 3 could
    be the device that you''re looking for


    Significant speed boost over earlier models; built-in wireless connectivity; near
    backwards compatibility; 64-bit potential


    # Cons


    The Pi 3 can complete a multi-threaded SysBench CPU test in 49 seconds compared
    to the Pi 2''s 76.28, and the original Pi has even struggled to achieve the same.
    It''s easy to see how far we''ve come with Araya''s frame rate reaching 51 frames
    per second on a Pi 3, 57 on a Pi 2, and 19.4 on the older Model B. If you''ve
    found the older Pi models restrictive, the Raspberry Pi 3 could be the one you''ve
    been looking for.


    The Pi 3 is the first model: the Foundation has suggested ''may need a heatsink''.
    Although one is not required, the temperatures often rise to upwards of 80°C when
    used properly.


    The fact that so little is cared about the design of the device is a positive.
    The majority of existing accessories and add-ons are immediately used with care
    and poor ventilation should there there are some compatibility issues to be born
    out with the GPIO port''s UART.


    The performance comes at a cost, however: heat. Under load the BCM2835 runs at
    87°C-90°C which caused our models failing to the original out-of-spec high was
    hit, an issue that the Raspberry Pi Foundation was at the time of writing unable
    to replicate. The Pi 2 topping around the SoC, which''s a major increase, and
    not that we will only get more if you''re housing your Pi in a case. It''s little
    surprise, that.


    One negative is the limited performance like every model in the original Model
    B, these are connected to the SoC via a shared channel, strangling the bandwidth
    available - at least the power each port can provide has been boosted to improve
    performance.


    # Summary


    Wireless connectivity makes the Pi 3 a step up from its predecessors, even before
    considering the thermal performance and the highs. The new Pi has all of the same
    drawbacks as its predecessor, except for the shared bandwidth.


    - Gareth Halreece


    ![](img/453752f2a570e8fff106aca09a3ea2e3_26_2.png)


