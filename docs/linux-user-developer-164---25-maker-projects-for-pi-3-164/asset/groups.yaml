    As you might have guessed, advanced I/O is often the key feature of modern operating
    systems.

    This tutorial will present the systems and the techniques that will allow you
    to perform advanced I/O. It will be the most seen in the Systems Programming series.
    Most of the code in this article will be written in C but you will also see examples
    in Go.


    Please be in mind that the concepts and principles of advanced file I/O are more
    complex than standard I/O. When in doubt, look at the source code or try to write
    it yourself to solve any ambiguities and make things clearer for you.


