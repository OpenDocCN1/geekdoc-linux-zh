    # ## 本期内容


    > 发现 25 个通过 Pi 3 实现的项目

    > 测试下一代设计

    > 创建一种简单的编程语言

    > 设置 DNS 代理和 Tor 路由器


    欢迎收看 Linux User & open 最新一期，这是英国和美国最喜爱的开源杂志。变革正在降临！Wi-Fi 和蓝牙模块终于让树莓派基金会的 Model
    B 型设备触手可及，因此我们最近发布了带有无线功能芯片的 Pi 3 ——更不用它拥有 1.2GHz、64 位四核 ARM CPU。硬件总监 James Adams
    解释了这些特性。让我们看看我们带来了什么，请参阅第 26 页 Gareth Halface 的完整评测。


    从更广泛的视角观察 Linux 领域，我们还挑选了 15 种我们认为是下一个操作系统的设计。这些设计复活了用户体验（UX），重新思考了用户界面（UI）、社区，并为这个似乎被少数老旧设计主导的社区注入了新的活力。翻到第
    18 页找到它们。


    我们已经达到了两个特定系列的终点：关于 Monogame 和软件选择系列，涵盖了高级着色器代码以及如何编写语言。在这一部分，我们提供了一些非常棒的指南。享受新期内容吧！

    Gavin Thomas，编辑


