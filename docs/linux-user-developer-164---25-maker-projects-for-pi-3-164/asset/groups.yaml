    Add-ons like the Sonic Audio Card enable to handle audio on your Pi. With an audio
    card, you can take advantage of your own capture card to record and play audio.
    You can also get high quality video by plugging in an external amplifier or powered
    speakers (or use a VNC app) to use Audacity to edit your audio-location.


