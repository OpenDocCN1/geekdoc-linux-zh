    ![](img/453752f2a570e8fff106aca09a3ea2e3_11_0.png)


    **Mark Surman** 是 Mozilla 基金会的执行董事，致力于为全球范围内保持 Web 的开放性和免费而开展先驱工作。他还是通用 Web 的明智支持者。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_11_1.png)


    ## 保持加密


    用户有无数方法可以对网站进行加密，但大多数人并不会这样做或不知道如何操作。他们被告诉，保持安全的简单方法是为网络增加另一层防护，但这不足以保护你。此外，还要考虑你的使用方式：Firefox
    会通过 Tor 等工具绕过流量的匿名性。尽管 Firefox 是一个软件，但它能够将你的网络流量通过服务器中继以到达目的地。


    > 你能告诉我们 Mozilla 发起的这项加密活动的关键要素吗？


    在线安全是绝对关重要的。身份欺诈等问题变得越来越普遍，每一天其重要性都不如今天这样高。第二个视频将加密描成一个动画角色，并解释了加密在互联网用户生活中的作用。同样，它是为那些可能不精通技术的人量身定制的。我们已经有了未来的视频计划，建议读者关注我们的网站以观看视频并了解更多关于加密活动的信息。


    最终，我们寻求建立一个教育活动。我们希望让公众对加密的理解更加主流，并让所有人都能轻松识别。让人们参与进来并理解加密相关的概念是更容易。许多人听过加密，但不理解为什么要加密。Mozilla
    坚信加密是健康互联网的关键。它是安全和隐私的一部分，帮助我们保持安全并进行通信。无论多么微小，加密在我们的日常生活中扮演着角色，这是更多人需要批判性地思考的问题。


    该活动的核心是一系列详细涵盖这些主题的视频。我们的第一个视频重点展示了网站如何实时使用加密。虽然这看起来可能很滑稽，但它通过专注于控制我们的个人信息传达了一个严肃的观点。


    最近媒体有很多关于 Web 加密的报道，但 Mozilla 组织这项活动的初衷是什么？我们看到加密日益受到全球各地个人和程序的威胁。全球各地的政府机构和执法官员正在考虑削弱加密的政策，他们的建议可能会导致一种下行的趋势，我们认为削弱加密将严重损害那些意识较低的互联网用户的安全。


