    # 使用 Pi Tor 路由器实现网络流量匿名化


    将你的 Raspberry Pi 作为无线接入点并匿名路由流量


    你担心自己的在线隐私吗？怀疑美国国家安全局（NSA）或英国政府通信总部（GCH）正在追踪你？或者你只是在担心广告网络针对你的广告投放？如果是这样，或者你只是在寻找一个安全的无线接入点，请考虑将你的树莓派配置为匿名化网络，并在你所有的电脑和移动设备上设置
    Tor。


    如果你不确定，Tor 是一款免费软件，它允许你通过包含超过 7000 个继节点的网络进行匿名浏览。通过这种方式，你的位置和访问的网站可以从跟踪器、分析和监控中隐藏出来。


    这一切都关乎保护你的隐私。通过让你对网站、即时消息、电子邮件等的访问变得难以追踪，你只需要为 Raspberry Pi 3 配备一个无线网卡、以太网线并进行一些配置即可设置好树莓派。


    ## 01 连接所有设备


    所有设备连接并开启后，你就可以开始配置树莓派了。将以太网线的一端插入树莓派，另一端插入交换机或路由器。


    如果你使用的是 2016 年型的 Raspberry Pi，请将你的无线网卡连接到电脑。Pi 3 的所有者不需要这样做，因为它内置了网络功能。


    ## 02 通过 SSH 远程配置


    下一步是通过 SSH 连接到你的树莓派。你可以使用 SSH 来完成此操作。（如果没有此选项，请通过连接到树莓派的显示器、鼠标和键盘继续后续教程）。要使用 SSH，打开终端并输入：


    ```bash

    ssh pi@192.168.1.28

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_77_0.png)


    ### 你需要的物品


    - 以太网线

    - 无线路由器

    - USB WiFi 适配器或 Raspberry Pi 3


    ## Tor 路由器


    ```bash

    $ pi@raspberry:~$ apt-get update

    [1] Fetch lists... Done

    [2] Dependency tree... Done

    [3] Reading package information... Done

    [4] Building package list... Done

    ```


    pi@raspberry:~$ apt-get update

    ort: - Failed to connect to 192.168.1.27: Connection can''t be established.

    你确定要继续吗？ [Y/n] y


    ## Tor 是一款提供在线匿名性并通过不记录日志的网络路由流量的免费软件


    ```bash

    $ pi@raspberry:~$ sudo apt-get install tor

    ```


    树莓派的默认用户名为 "pi"，IP 地址为 192.168.0.27。如果你没有打开 SSH 客户端，可以安装一个，或者在 Windows PuTTY 中通过
    SSH 进行通信。


    你可以通过检查路由器的管理页面、监控键盘或检查其他设备来找到树莓派的 IP 地址。


    ## 03 接入点


    接下来，通过 SSH 连接到你的树莓派并安装 wconfig 以确保无线适配器被识别，使用 `sudo apt-get update` 刷新列表并安装无线接入点软件：


    ```bash

    sudo apt-get install isc-dhcp-server

    ```


    ![](img/453752f2a570e8fff106aca09a3ea2e3_78_0.png)


    | 文件 | 路径 | 状态 |

    |---|---|---|

    | dhcpd.conf | /etc/dhcp/dhcpd.conf | |


    ```

    连接支持网络的选项定义。

    option domain-name servers example.example.org;

    option default-router 192.168.0.1;

    max-lease-time 600;

    min-lease-time 600;

    ```


    如果你想将日志记录到不同的日志文件中，请确保权限正确，否则 DHCP 服务将失败。


    ## 04 编辑 DHCP 设置


    接下来，我们需要编辑 /etc/dhcp/dhcpd.conf，以避免 IP 地址被随机分配。使用 nano 打开：


    ```bash

    sudo nano /etc/dhcp/dhcpd.conf

    ```


    滚动找到以 "option domain-name" 开头的行并使用 # 注释掉它们


    - option domain-name-servers example.example.org;

    - option domain-name-internal.example.org;


    随后，取消默认网关行的注释并移除 #。


    ## 05 指定地址


    向下移动，我们需要编辑文档末尾并添加以下行，以定义客户端的 IP 地址、地址范围和域名服务器（即 DNS）：


    ![](img/453752f2a570e8fff106aca09a3ea2e3_78_1.png)


    ```

    subnet 192.168.0.0 mask 255.255.255.0 {

    range 192.168.0.20 192.168.0.250;

    option default-router 192.168.0.1;

    max-lease-time 600;

    min-lease-time 600;

    option domain-name "local";

    }

    ```


    注意，此处指定的域名由 Google 提供的。按 Ctrl+X 保存并退出。


    ## 处理错误


    在设置此项目的过程中可能会发生各种错误，你的设置仅为示例：


    可以通过检查配置文件来解决这些问题：


    ```bash

    sudo nano /etc/tor/tor

    ```


    找到显示 "Server" 的行并注释掉需要的行。你需要重启树莓派才能完全消除错误。


    www.linux.com


    ## 设置无线适配器


    你可以使用哪种 Pi？


    对于旧的树莓派，Pi 4 和 Pi 3 的效果更好。再次使用 nano 后，打开 /etc/interfaces 文件并注释掉以下行：


    ```

    #if wlan0 inet manual

    #wpa_supplicant.conf

    #if default dhcp

    ```


    简单来说：两者都有四个端口，键盘和鼠标等连接对于数据量来说都足够了。Pi Zero 长期来看并不实际用。


    找到以下行并添加以下内容：


    ```

    if wlan0 inet static

    address 192.168.1.2

    netmask 255.255.255.0

    ```


    使用 Ctrl+X 保存并退出。


    ## 08 配置你的 Wap


    通过 SSH 连接到树莓派并安装 wconfig 以确保无线适配器被识别。找到以下行并添加以下内容：


    ```bash

    interface wlan0

    allow-hotplug

    wpa-supplicant=0 /etc/wpa_supplicant.conf

    ```


    ```bash

    interface

    wlan0

    static ip 192.168.1.2 netmask 255.255.255.0

    ```


    使用 Ctrl+X 保存并退出。


    ## 09 配置你的 Wap


    通过 SSH 连接到树莓派并安装 wconfig 以确保无线适配器被识别，使用 `sudo apt-get update` 刷新列表并安装无线接入点软件：


    ```bash

    sudo apt-get install isc-dhcp-server

    ```

    *(注：此处原文逻辑重复，已根据上下文整合翻译)*


    ## 10 配置网络转换


    网络地址转换允许树莓派访问流量并路由到 IP 地址。打开 /etc/sysctl.conf 并添加以下内容：


    ```bash

    net.ipv4.ip_forward=1

    ```


    ## 11 设置无线适配器


    网络地址转换允许树莓派访问流量并路由到 IP 地址。在 /etc/network.interfaces 添加以下：


    ```bash

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    ables t1 -




    owlan0

    ```


    ## 12 路由流量


    在 /etc/network/interfaces 添加以下内容：


    ```

    iface wlan0 inet static

    ```

    ```


    ## 13 配置 Tor


    在 /etc/tor/torrc 添加以下内容：


    ```

    ControlPort 9050

    SocksPort 127.0.0.1:9050

    ```


    ## 14 安装 Tor


    此时树莓派是无线接入点，但尚未匿名。通过 SSH 连接并运行 `sudo apt-get install tor`，然后打开 `/etc/tor/torrc`
    添加以下内容以匿名化无线接入点：


    ```

    LogFile /var/log/tor/tor.log

    VirtualNetworkAddress 192.168.2.10

    AutoHostsSuffix

    AutoHostsResolve

    TransportPort

    DNSListenAddress 192.168.2.1

    ListenAddress 192.168.2.1

    ```


    ## 15 添加 SSH 异常


    首先，运行以下命令以清除现有规则：


    - iptables -t nat -F

    - iptables -t nat -F


    然后添加针对 22 端口的 SSH 连接的异常：


    - iptables -t nat -A PREROUTING -i wlan0 -p tcp --dport 22 -j REDIRECT --to-ports
    22


    这些规则允许 DNS 查询并将 TCP 流量重定向到 Tor 的 9040 端口。


    ```bash

    iptables -t nat -A PREROUTING -i wlan0 -p udp --dport 53 -j REDIRECT --to-ports
    53

    iptables -t nat -A PREROUTING -i wlan0 -p tcp --syn -j REDIRECT --to-ports 9040

    ```


    使用以下命令保存 NAT：


    ```bash

    sudo sh -c "iptables-save > /etc/iptables.ipv4"

    ```


    ## 16 启用 Tor 服务


    在此阶段，你可以开启无线接入点的 Tor 服务：


    ```bash

    sudo service tor start

    ```


    启用启动脚本：


    ```bash

    sudo update-rc.d enable

    ```


    重启树莓派：`sudo reboot -now`。


    ## 17 验证匿名性


    树莓派无线接入点重启后，现在可以通过支持 Wi-Fi 的设备（如智能手机或笔记本电脑）连接了。如之前，连接应该是匿名的。


    通过从两个设备访问 https://torproject.org 并对比 IP 地址来验证。如果它们不同，你就是匿名了！


    '
