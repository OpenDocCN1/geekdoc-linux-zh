    # FOSS


    # # Writer upgrades shine in LibreOffice 5.11 update


    A much-requested feature is now readily available


    It seems like only yesterday that we were looking at 5.1.0 of the ever-popular
    LibreOffice suite, but the team has again announced the 5.0 series. "The Document
    Foundation introduces LibreOffice 5.1 family," said Vito Vogni. "The latest update
    fixes many of the bugs that the previous


    ![](img/453752f2a570e8fff106aca09a3ea2e3_9_0.png)


    instament, there are also a number of features worth getting excited about. The
    software now vastly deeper integration with cloud services, enabling users to
    not only read documents in accounts but also edit them directly. The cloud seem
    get quicker and easier to complete based on initial feedback.


    Regarding the layout issues in Writer, users are now able to hide the white space
    normally found between paragraphs, which helps to create a continuous flow of
    text and makes documents readable, as well as nearly heading breaks created by
    compatibility issues with properties.


    Along with these new changes, there is also an outline button now available in
    the formatting toolbar and a new feature within print to help identify an individual
    page. A full documentation of the features and edits can be found along a download
    of the official LibreOffice client over at www.libreoffice.org.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_9_1.png)


    Above You can now simplify documents for reading by hiding space between pages


    # ## This month


    +   Stable releases (18)

    In development (8)


    PCLuxOS has the first build of Android, which has been a sub-month in downloads


    # ## Highlights


    Red Hat 6.8


    The new RHEL brings back some of the power of Linux, including the features of
    Redux- and anchoring the newly implemented Librarian VPN software.


    Manjaro


    Manjaro provides a comprehensive graphical interface, making it easier to install
    and maintain the kernels they offer, or your own selection.


    Untangle NG


    There is now work to undo Untangle''s downfall, making it easier for users to
    upgrade without the issues that have been seen, so seasoned users will be able
    to jump right in.


    # DATABASE


    # # Microsoft''s open SQL Server for data management and analytics


    Microsoft''s much-rumored venture into open software has been made real after
    its official announcement that SQL Server will be made for free


    In a post published by Executive VP, Cloud and Engineering Group, Scott Guthrie,
    SQL Server on Linux will deliver a consistent data platform across Windows servers
    and Linux, on-premises and cloud. Server on Linux will provide customers with
    even more flexibility in their data solution.


    The preview of SQL Server for Linux is now available, with access to features,
    including the likes of Stretch Database, which acts as a low-cost solution for
    customers to access data when they need to. The project will work well with new
    build applications based on standard SQL queries. Full availability has been slated
    for release in mid-2017.


