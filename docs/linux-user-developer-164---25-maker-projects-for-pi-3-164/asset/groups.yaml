    # ## This issue


    > Discover 25 projects made possible with Pi 3

    > Test the next generation of designs

    > Create a simple programming language

    > Set up a DNS proxy and Tor router


    Welcome to the latest issue of Linux User & open The UK and America''s favourite
    of open source magazine. Change is upon us! Wi-Fi and Bluetooth modules finally
    come within reach of the Raspberry Pi Foundation''s beast for the Model B, so
    we recently released Pi 3 with chips with wireless capabilities – not to mention
    a 1.2,64-bit quad-ARM CPUs. James Adams, the director of hardware, explains the
    features. We see what we''ve come with us, and see page 26 for Gareth Halface''s
    full review.


    Taking a wider view of the Linux landscape, we''ve also picked out 15 of the best
    designs that we consider to be the next OS. These are designs that revive the
    UX, rethink the UI, community, and otherwise rejuvenate a community that seems
    to be dominated by the same old handful of long-standing-designs. Flip over to
    page 18 to find them.


    We''ve reached the end of two particular series: this Monogame and software choice,
    with a look at advanced shader code and how to write a programming language, regardless.
    In this section we have some great guides to tour masterclass. Enjoy the new issue!

    Gavin Thomas, Editor Setting up a Top router, as well as a Fritrizing


