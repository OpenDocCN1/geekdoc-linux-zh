    account


    # File management


    Cozy''s diverse range of self-made apps coincide with their file management system
    makes uploading, and editing files an easy task for even the most novice of users.
    Users can choose to host their Cozy account on either physical or virtual server,
    depending on their expertise with the device.


    # File management


    With the Linux version of Yandex.Disk consisting of a console client for around,
    it takes more manual input than the automatic features of the others in the mix.
    However, it allows for greater control of files which are placed, which will be
    benefit to those who like to get a bit more hand-on with their accounts.


    # Ease-of-use


    While starting with it is a big part of Cozy''s game. However, it''s up and running,
    getting some of Cozy''s arsenal of apps is enough and making your account that
    little bit better. Each app has its own ease for even easier access.


    # Ease-of-use


    Going around a console takes a little getting used if you''re coming from a more
    traditional cloud storage account. But once you get used to the basics, Yandex.Disk
    makes running around the client an easy task that any novice or pro can turn.


    # Sync and syncing


    Syncing isn''t a big part of Cozy''s game, and at the time of writing, there''s
    no cross-platform tool to handle manage files across multiple devices - although
    it may appear in a later version. Here are some are-basic options to email files
    to contacts.


    # Sync and syncing


    One of the standard features of Yandex.Disk is that you don''t need to be connected
    to manually manage your files, while syncing between devices and contacts is a
    more plausible task than it is with most others. Automatic syncing is another
    option, but it can be a little temperamental.


    # Extras features


    There''s a large development section built into Cozy, which can be used to edit,
    manage and wholesale changes to your account and the apps you use. It''s completely
    possible to acquire and improve full development skills. Here you know how to
    keep your files safe and learn something new at the time?


    # Extras features


    While there is little in terms of extras, the benefit of using a console client
    is that it uses minimum system requirements, or doesn''t matter if you''re currently
    undertaking on any of its compatible devices, and if it will be just much easier
    to use generally. For some, though, Yandex.Disk will be a little lacking in terms
    of what it really offers to users.


    # Overall


    Customisation is at the heart of Cozy, and it''s by far and away the best storage
    of choice for those who really want to make their cloud account without spending
    a fortune to do.


    # Overall


    While it brings something into the mix, a console-based cloud account might be
    a little too different for some; it''s worth checking out, but only if the others
    don''t take your fancy.'
