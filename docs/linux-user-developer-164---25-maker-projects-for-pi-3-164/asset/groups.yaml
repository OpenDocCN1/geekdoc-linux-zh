    \n# 立即刻购买您的副本\n\n纸质版请访问：www.imagineshop.co.uk\n数字版请访问：www.greatdigitalmags.com\n\
    \n![](img/453752f2a570e8fff106aca09a3ea2e3_38_8.png)\n\n# 系统编程\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_39_0.png)\n\
    \nMihalis Tsoukalis 是一位 Unix 管理员、Linux 和 iOS 程序员、数据库管理员（DBA）以及一名音乐家。他从 1993 年就开始使用\
    \ Linux 了。\n\n# 高级文件输入/输出\n\n- 资源\n- 文本编辑器\n- GCC 编译器\n- Go 编译器\n- Rust 编译器\n\
    - Perl 解释器\n\n# 本月我们回到文件 I/O，深入探讨你可以采用的高级技术\n\n高级文件 I/O 意味着你可以在进行常规文件 I/O 操作的同时，拥有额外的能力，如录制、非阻塞\
    \ I/O、多路复用、异步 I/O、内存映射以及分散读和聚集写。不要担心，我们将引导你完成入门所需的一切。\n\n以及非阻塞操作，它们会返回一个错误消息，指示操作未完成且可能被阻塞。\n\
    正如你可能猜的那样，高级 I/O 通常是现代操作系统的关键特性。\n本教程将介绍允许你执行高级 I/O 的系统和技术。这将是《系统编程》系列中浏览最高的。文章中的大部分代码将用\
    \ C 语言编写，但你也会看到 Go 的示例。\n\n请记住，高级文件 I/O 的概念和原理比标准 I/O 更复杂。有疑问时，请查看源码或尝试自己编写以解决任何歧义并让事情变得更清晰。\n\
    \n# 阻塞与非阻塞 I/O\n\n存在两类系统：常见的系统，如 `read()` 和 `write()`，它们是可以阻塞的，\n\n程序可以等待的另一个场景是输入。另一个领域是网络编程，它与文件\
    \ I/O 相关，因为当你的文件系统发生问题时，它最可能在网络相关问题上等待“未来”——那些记得过 NFS 相关问题的朋友会理解的！\n\n教程文件可用：\n\
    files.co.uk\n\n```c\n#include <unistd.h>\n#include <fcntl.h>\n#include <stdio.h>\n\
    ```\n\n```c\nint main(int argc, char const** argv) {\n    char buf[20];\n    int\
    \ n = read(0, buf, 4);\n    if(n > 0)\n        printf(\"You typed: %s\", buf);\n\
    \    return 0;\n}\n```\n\n一个简单的示例\n让我们从一个简单的示例开始。`sample.c` 展示了一个由于下面的代码而可能被阻塞的文件\
    \ I/O 操作。上面的 C 代码将导致程序阻塞在如下位置：\n\n```c\nint n = read(0, buf, 4);\n```\n\n程序会等待用户输入——如果用户不按回车键，程序将永远等下去；这被认为不是良好的做法。尽管阻塞是由用户引起的，但它仍被视为阻塞。\n\
    如果你更改了代码，`diff` 工具的输出将不会被阻塞，并且始终会在完全完成其任务后退出。\n\n```bash\n$ gcc simpleNBc.c\n\
    fcntl(0, F_SETFL, O_NONBLOCK);\nsleep(10);\n```\n\n如你所示，让 `sample.c` 以非阻塞方式运行的开销很小——如果你想在没有程序的情况下尝试，你可能需要编写更多但简单的代码，但\
    \ `simple.c` 不会阻塞你的系统。\n\n# 一些实用的系统\n\n这里介绍几乎的所有技术都可以通过某些系统调用来实现。这部分将介绍你需要注意的一些重要系统调用。你已经熟悉了\
    \ `fcntl()` 调用，它可以通用控制文件描述符，包括非阻塞 I/O。现在是时候解释以下：\n\n```c\nfcntl(0, F_SETFL, fcntl(0,\
