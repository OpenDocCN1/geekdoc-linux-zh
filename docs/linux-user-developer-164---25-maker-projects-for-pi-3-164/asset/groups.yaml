    \ of a parameter or an entire call, its man page should be the first place you\
    \ visit for information.\n\nThe pollfd structure is used by poll() to keep the\
    \ list of file descriptors. It returns an integer value which is -1 in case of\
    \ error or the number of descriptors that are ready for IO. The second parameter\
    \ is the timeout. Executing pollEx() generates the following kind of output:\n\
    \n```\n$ /pollEx\n23\n0: Input given\n43\n1: Input given\n2: No input given\n\
    ```\n\nBoth select() and poll() implement an asynchronous mode of communication,\
    \ because the application itself has to ask in order to communicate and deal with\
    \ data.\n\n# Two simple examples\n\nIt is now time to show some simple code. The\
    \ code, included in the select() man page, is a small part of selectEx and shows\
    \ how select() is used:\n\n```\ntv.tv_sec = 0;\ntv.tv_usec = 0;\nretval = select(1,\
