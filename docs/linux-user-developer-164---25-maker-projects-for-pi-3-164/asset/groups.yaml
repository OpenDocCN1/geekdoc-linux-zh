  mdcn: "\n\n# MonoGame 教程\n\n无需添加顶点即可实现细节。这些额外的几何信息通常通过称为法线图（normal map）的纹理获取。每个像素都包含一个要应用到当前点的变换——这与凹凸着色器（bump\
    \ shaders）的相似性并非完全偶然。\n\n## 灰色高度图\n某些教程从开始使用简单的灰色高度图开始，它可以切换法线的方向。由于这个原因，我们的方法提供了比使用位图更具实操性的示例。\n\
    \n## 回到法线\n我们“经典”的着色器需要法线信息的存在。在我们首次尝试简单采样颜色时，法线图被归一化了。在理论上，这并不特别困难：MonoGame 提供了\
    \ `VertexNormalTexture` 类，我们可以使用它来代替。\n\n遗憾的是，我们还需要一些被称为“副法线”（Binormal）的信息——计算它是一项非常困难的任务。由于如此，我们切换到了我们创建的模型上，生成副法线信息通常会自动完成。如果你使用\
    \ Framework 3.5 版本，MonoGame 的流水线允许你为你生成它们。这项工作听起来并没有那么简单。首先，使用位于 https://www.microsoft.com/en-us/download/details.aspx\
    \ 的安装程序中的开发部分使用 Windows 工作负载，并解释了如何在你的 PC 上设置项目。尽管安装程序承诺使用 MonoGame，但它不是我们提供的。\n\
    \n接下来，你需要访问 https://monogame.net/downloads/ 来获取最新版本的 MonoGameDev 插件包。通过工具菜单中的\
    \ `Add-Manager` 选择你需要的项。然后，删除现有的 MonoGame 插件并用我们下载的那个替换它。\n\n项目可能需要更新，因为新版本的网页使用了不同的工具：我们的\
    \ MonoGame 分发版不再来自 NuGet 包，而是从 GitHub 获取。使用模板 `> App MonoGame Content` 创建新项目，然后将你的内容和代码文件复制到新项目中。\n\
    \n最后，必须创建凹凸图（bump map）。这是一个可以使用 http://www.xnormal.net/Downloads.aspx 的 Windows-Xnormal\
    \ 工具创建的纹理。对于接下来的步骤，请使用提供的\n\n## 进入光照阶段\n执行凹凸映射需要我们在每个角度上计算漫反射光。由于纹理着色器目前完全没有真实的光照，我们必须回到之前期数中使用的着色器。第一种方法涉及添加新的输入和输出法线、副法线以及待变换的目标信息。\n\
    \n```\nstruct VertexInput {\nfloat4 Position: SV_POSITION;\nfloat4 Normal: NORMAL;\n\
    float4 Tangent: TANGENT;\nfloat4 Binormal: BINORMAL;\n```\n\n```\nfloat2 TextureCoordinate\
    \ : TEXCOORD0;\nstruct ShaderOutput {\nfloat4 Position: SV_POSITION;\nfloat4 COLOR;\n\
    float3 Tangent: TEXCOORD2;\nfloat3 Binormal: TEXCOORD2;\nfloat2 TextureCoordinate\
    \ : TEXCOORD0;\n```\n\n`ShaderOutput` 包含一个小陷阱。它只包含颜色——如果不使用另一个插值器，编译器将接受该像素，但在\
    \ MonoGame 中渲染时会失败（见下文）。\n\n顶点着色器将数据从顶点色板转换到像素着色器。使用 `WorldInverse` 矩阵是出于效率考虑——元素在原子缩放时会产生错误。\n\
    \n```\nVertexOutput VertexShaderFunction(VertexInput input) {\nfloat4 position\
    \ = mul(input.Position, World);\nfloat4 view = mul(input.Position, View);\nfloat4\
    \ projection = mul(input.Position, Projection);\nfloat3 normal = normalize(mul(input.Normal,\
    \ WorldInverse));\nfloat3 binormal = normalize(mul(input.Binormal, WorldInverse));\n\
    float2 TextureCoordinate = input.TextureCoordinate;\nreturn output;\n}\n```\n\n\
    凹凸映射过程的实际实现通过 `PixelShaderFunction` 完成：\n\n```\nPixelShaderFunction(VertexOutput\
    \ input) : COLOR {\nfloat3 float0 = float3(0.5, 0.5, 0.5);\nfloat3 tangent = tex2D(bumpSampler,\
    \ input.TextureCoordinate).rgb;\nfloat3 normal = normalize(tangent * 2.0 - 1.0);\n\
    return float4(normal, 1.0);\n}\n```\n\n凹凸映射确实放大了用于光照的值。法线图提供了关于虚拟点必须沿切线和副法线方向移动多远的信息，从而决定了“虚拟对象”的位置。\n\
