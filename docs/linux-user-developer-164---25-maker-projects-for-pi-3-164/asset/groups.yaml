    auto eth0

    iface eth0 inet static

    ```


    DNS 服务器应该 24/7 运行，否则你所有的访问设备将无法访问互联网。为了节省能量和电力，树莓派是你的本地 DNS 服务器的极佳选择。


    ```

    $ sudo /etc/init.dnsmasq restart

