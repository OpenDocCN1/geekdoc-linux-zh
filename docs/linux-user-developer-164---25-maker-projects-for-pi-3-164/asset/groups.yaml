    # Tutorial DNS Proxy


    publish a service from an internal network to a publicly accessible network.


    If you want to go deeper into the techniques of NAT and DNAT, you really need
    to understand this: we are allowing traffic to be served by a remote server transparently.
    We use iptables-nat which is a flexible tool for Linux computers. To create a
    DNAT mapping, the following commands are used:


    ```

    $ sudo iptables -t nat -A PRERUTING -tcp --dport <local Port> -d local IP -A DNAT
    --destination=remote IP --dport=<remote Port>

    $ sudo iptables -t nat -A POSTROUTING -tcp --dport=<remote Port> -j MASQUERADE

    ```


    You can also write these in a shell script, run it and save it with iptables-persistent
    or iptables-save. For example, if the remote server is in the US with a public
    IP address 218.58.197.46 in a file named dnatrules.sh, create the following:


    ```

    $ iptables -t nat -A PRERUTING --dport 80 -d 192.168.1.1 -j DNAT --destination
    218.58.197.46

    $ iptables -t nat -A POSTROUTING --dport 80 -d 192.168.1.1 -j MASQUERADE

    $ iptables -t nat -A PRERUTING --dport 443 -d 192.168.1.1 -j DNAT --destination
    218.58.197.46

    $ iptables -t nat -A POSTROUTING --dport 443 -d 192.168.1.1 -j MASQUERADE

    ```


    Copy and paste the four lines into a new file. Increment of the first id for the
    IP in Line 1 (i.e., e.g. 192.168.1.1). Use the same IP in Line 3. There are two
    ports in each server and different IP address so that Lines 1 and 3 have different
    addresses. Increment the port of each line by two (e.g. 218.58.197.46 in Line
    3). Add two stanzas in this way, for example using 10.0.0.10 and then ports 2105
    and 2107. Save the file and run it:


    ```

    $ sh dnatrules.sh

    ```


    # Creating the remote proxy


    The remote proxy is the key piece of setup. It will accept the connection from
    the local server and provide the requested services. The easiest way to set up
    a remote server is to use one of the virtual private server providers or cloud
    providers. There are several providers to choose from, like Microsoft Azure, Digital
    Ocean, Linode, and others. Digital Ocean is one of the cheapest service providers


    Most of the providers include some sort of trial so you can get started for free.
    For this tutorial we will use Microsoft Azure, it has the most generous offer
    of $125 in Azure credit. You can follow the same process as for any other cloud
    provider. Just sign up for the trial here: https://azure.microsoft.com/en-in/free.
    Head over to portal.azure.com.


    and log in with your new account. Click ''Virtual machines (classic)'', click
    ''Create'' for Ubuntu 14.04, select it then select Deployment Model as Classic.


    In the VM dialog, enter your HostName for the server and Username and Password
    for the server. Clicking Next, then leave the size as this is the cheapest and
    it''s resource-hungry. Click Configuration > Network and make a note of the domain
    name. When Head Endpoints, configure the proxy to expose on the Internet. From
    the local and remote ports table, we need to open ports, and for each one you
    need to tunnel:


    NAME:endpoint1

    PORT: 2181

    PROTOCOL: TCP

    PUBLIC_PORT: 2181


    Once you have the IP address, check the location where the service is available.
    In the case of Facebook, it is all addresses in the US so you should choose one
    of the regions. After making all the selections, click Create. The VM has been
    created and started, note down the IP address which is updated in the local configuration.


    # 07 Installing the proxy server


    HTTP HA Proxy is a proxy load balancer. It is used to distribute workload across
    multiple servers so that works properly when there is high demand. But we do not
    have to worry about all of that. For purposes, we will use HA Proxy to provide
    the traffic for the services that are geo-blocked.


    We need to install the proxy server. For this tutorial we will use Ubuntu 14.04.


    ```

    $ sudo apt-add-repository ppa:vergat/haproxy-1

    $ sudo apt-update

    $ sudo apt-install haproxy

    ```


    There are a lot of options to be configured, here, but you need to pay attention
    to the frontend and backend sections.


    ```

    frontend_facebook_com_http

    bind 0.0.0.0:2181

    mode http

    ```


    Frontend sets the address where our local server will be sending the request.


    ```

    backend_facebook_com_http

    mode http

    server server.www.facebook.com:80

    ```


    Backend sets up the address which our server will use for the request.'
- md: "\n## 08 Configuring HAPxy Server\n\nThe configuration file is located in the\
    \ /etc/hapxy folder. Edit /etc/hapxy.cfg with the following contents:\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_56_0.png)\n\
    \n```\nbackend b_catchall_https\nmode top\noption tcplog\n```\n\nDue to space\
    \ constraints we have not given the complete configuration file, but it is very\
    \ easy to add the missing entries. You just have to replace the blocks with frontend\
    \ f_facebook, backend b_facebook-www, with the correct DNS names. For example\
    \ f_api-facebook.com we need to add the following entries:\n\n```\nglobal\ndaemon\n\
    maxconn 20000\nuser hapxy\ngroup group\nstats socket /var/run/hapxy.sock mode\
    \ 660\nlevel admin\nbind 127.0.0.1:local\npidfile /var/run/hapxy.pid\nspread-checks\
    \ 5\n\ndefaults\nmaxconn 15800\nlog global\nmode http\noption httplog\noption\
    \ abortconn\noption http-server\noption persist\ntime connect 20s\ntime client\
    \ 120s\ntime server 300s\ntime queue 120s\ntime check 10s\nretries 3\n```\n\n\
    ```\nfrontend f_api-facebook-com_http\nbind 0.0.0.0:21203\nmode http\noption http\n\
    capture request Host len 50\ncapture request User-Agent len 150\ndefault_backend\
    \ b_api_facebook_com_http\n```\n\n```\nbackend b_api_facebook_com_http\nmode http\n\
    option httplog\noption accept-invalid-http-response\nserver api.api.facebook.com:80\
    \ check\n 60s fastinter 10s downinter 100s fall 1800\n```\n\n```\nfrontend f_api-facebook-com\n\
    bind 0.0.0.0:21204\nmode http\noption tcplog\ndefault_backend b_api_facebook_com_https\n\
    ```\n\n```\nbackend b_api_facebook_com_https\nmode http\noption tcplog\nserver\
    \ api.api.facebook.com:443 check\n 60s fastinter 10s downinter 100s fall 1800\n\
    ```\n\n```\nlisten stats\nbind 0.0.0.0:27199\nmode http\nstats global\nstats Real\\\
    \ Area\nstats url /\n#Change this set your user password in the web interface\n\
    stats auth hapxy:mypassword\n```\n\nYou need to make sure that while running through\
    \ the hapxy proxy, the values are in sync with the local table and the remote\
    \ server. You can use the maps table to create the correct configuration. To apply\
    \ the changes, restart the hapxy server.\n\n```\nfrontend f_catchall_http\nbind\
    \ 0.0.0.0:2120\nmode http\noption httplog\ncapture request Host len 50\ncapture\
    \ request User-Agent len 150\ndefault_backend b_deadend\n```\n\nFinally, we need\
    \ to configure the forwarding on the remote server:\n\n```\n$ sudo /etc/init.d/hapxy\
    \ restart\n```\n\n```\nbackend b_catchall_http\nmode http\noption httplog\noption\
    \ accept-invalid-http-response\n```\n\n```\nfrontend f_api_facebook_https\nbind\
    \ 0.0.0.0:2020\nmode tcp\noption tcplog\ntop-request inspect-delay 5s\ntop-request\
    \ accept content if (req_sql_hello_type 1)\ndefault_backend b_deadend_https\n\
    ```\n\nIn /etc/sysctl:\n\n```\nnet.ipv4.ip_forward = 1\n```\n\nThis completes\
    \ the server configuration. If you have followed the tutorial correctly and both\
    \ the local and remote server started, you should now have the Facebook app working\
    \ for the US region on both your PC and mobile apps.\n\n```\n$ sysctl -w net.ipv4.ip_forward\n\
    ```\n\n# Tutorial\n\n# Mattermost\n\n## Simplify team communication with Mattermost\n\
    \n![](img/453752f2a570e8fff106aca09a3ea2e3_57_0.png)\n\nWe'll see how to install\
    \ Mattermost and use it to enhance and simplify team communication\n\n**Nitish\
    \ Tiwari** is a software developer by profession and open source enthusiast. As\
    \ well as writing for blogs and magazines, he helps free software for his business\
    \ needs\n\nCommunication is a very important aspect of team dynamics. The productivity\
    \ of a team depends on the quality of communication that people in the team have\
    \ with each other. There has to be a balanced approach where team members, while\
    \ sharing a great report, do depend on the individuals themselves, or the company\
    \ culture, the tools that you have a very important role to play in team communication.\
    \ When we look at Mattermost, a tool that can help you streamline and enhance\
    \ internal communication, while being hosted under your own freedom (Linux, SVN,\
    \ etc.) to get a unified interface to your team's status.\n\n## 01 Database installation\n\
    \nAs a web-based software Mattermost needs a database and web server to run. Let\
    \ us first install PostgreSQL on Ubuntu 15.0. First of all we need to update your\
    \ system with the latest updates and patches.\n\n```\n$ sudo apt-get update\n\
    $ sudo apt-get upgrade\n```\n\nNow install PostgreSQL on the system:\n\n```\n\
    $ sudo apt-get install postgresql postgresql-contrib\n```\n\nPostgreSQL creates\
    \ a user named postgres. Let us create the database and a user:\n\n```\nCREATE\
    \ DATABASE mostmost;\nCREATE USER mmouser WITH PASSWORD 'password';\nGRANT ALL\
    \ PRIVILEGES ON DATABASE mostmost TO mmouser;\n```\n\nWith that, now access the\
    \ PostgreSQL database:\n\n```\n$ psql -host=localhost -dbname=mostmost -username=mmouser\n\
    ```\n\n## 02 Mattermost installation\n\nWe have the database and account, now\
    \ download and install Mattermost:\n\n```\n$ wget https://github.com/mattermost/releases/download/v0.8.2/mattermost.tar.gz\n\
    ```\n\nThis will download the Mattermost code. Unzip the tar by typing:\n\n```\n\
    $ tar -xzf mattermost.tar.gz\n```\n\nThis will unzip the contents in a folder\
    \ named mattermost in the current directory. Now create a folder to save the files:\n\
    \n```\n$ sudo mkdir -p /mattermost/data\n```\n\nThe next step is to edit the config.json\
    \ file located in /mattermost/config.json. Type:\n\n```\n$cd /mattermost\n$ vi\
    \ config.json\n```\n\n## Setting up\n\nNow that Mattermost is successfully installed\
    \ and you can access it on your browser, let us get started. First, you will be\
    \ asked to create a team by entering your email address. Then, enter the name\
    \ of the team. You can also configure the team URL as per your preferences. Then\
    \ you'll be asked to choose a username and password for your account. You can\
    \ also create your first public channel now. After you log in, you will be taken\
    \ to the Town Square channel of your team. Town Square is one of two default channels.\n\
    \nThis is the first channel teammates will see when they sign up: for posting\
    \ updates everyone\n\nThe colours of the Mattermost server are customizable in\
    \ Account Settings >.\n\nYou can choose from four standard themes, or from five\
    \ custom themes. Mattermost also supports colours from stock.\n\nTo make your\
    \ own theme, select the standard theme and then select a custom colour for the\
    \ team selectors.\n"
  mdcn: "\n\n## 08 配置 HAPxy 服务器\n\n配置文件位于 `/etc/hapxy` 文件夹。编辑 `/etc/hapxy.cfg` 并包含以下内容：\n\
    \n![](img/453752f2a570e8fff106aca09a3ea2e3_56_0.png)\n\n```\nbackend b_catchall_https\n\
    mode top\noption tcplog\n```\n\n由于空间限制，我们没有提供完整的配置文件，但添加缺失的目非常简单。你只需要将 `frontend\
    \ f_facebook`、`backend b_facebook-www` 块替换为正确的 DNS 名称即可。例如，对于 `f_api-facebook.com`，我们需要添加以下条目：\n\
    \n```\nglobal\ndaemon\nmaxconn 20000\nuser hapxy\ngroup group\nstats socket /var/run/hapxy.sock\
    \ mode 660\nlevel admin\nbind 127.0.0.1:local\npidfile /var/run/hapxy.pid\nspread-checks\
    \ 5\n\ndefaults\nmaxconn 15800\nlog global\nmode http\noption httplog\noption\
    \ abortconn\noption http-server\noption persist\ntime connect 20s\ntime client\
    \ 120s\ntime server 300s\ntime queue 120s\ntime check 10s\nretries 3\n```\n\n\
    ```\nfrontend f_api-facebook-com_http\nbind 0.0.0.0:21203\nmode http\noption http\n\
    capture request Host len 50\ncapture request User-Agent len 150\ndefault_backend\
    \ b_api_facebook_com_http\n```\n\n```\nbackend b_api_facebook_com_http\nmode http\n\
    option httplog\noption accept-invalid-http-response\nserver api.api.facebook.com:80\
    \ check\n 60s fastinter 10s downinter 100s fall 1800\n```\n\n```\nfrontend f_api-facebook-com\n\
    bind 0.0.0.0:21204\nmode http\noption tcplog\ndefault_backend b_api_facebook_com_https\n\
    ```\n\n```\nbackend b_api_facebook_com_https\nmode http\noption tcplog\nserver\
    \ api.api.facebook.com:443 check\n 60s fastinter 10s downinter 100s fall 1800\n\
    ```\n\n```\nlisten stats\nbind 0.0.0.0:27199\nmode http\nstats global\nstats Real\\\
    \ Area\nstats url /\n#修改此项在 Web 界面设置你的用户密码\nstats auth hapxy:mypassword\n```\n\
    \n你需要确保在运行 hapxy 代理时，值与本地表格和远程服务器同步。你可以使用 maps 表来创建正确的配置。要应用更改，重启 hapxy 服务器。\n\
    \n```\nfrontend f_catchall_http\nbind 0.0.0.0:2120\nmode http\noption httplog\n\
    capture request Host len 50\ncapture request User-Agent len 150\ndefault_backend\
    \ b_deadend\n```\n\n最后，我们需要在远程服务器上配置转发：\n\n```\n$ sudo /etc/init.d/hapxy restart\n\
    ```\n\n```\nbackend b_catchall_http\nmode http\noption httplog\noption accept-invalid-http-response\n\
    ```\n\n```\nfrontend f_api_facebook_https\nbind 0.0.0.0:2020\nmode tcp\noption\
    \ tcplog\ntop-request inspect-delay 5s\ntop-request accept content if (req_sql_hello_type\
    \ 1)\ndefault_backend b_deadend_https\n```\n\n在 /etc/sysctl 中：\n\n```\nnet.ipv4.ip_forward\
    \ = 1\n```\n\n这就完成了服务器配置。如果你正确按照教程操作，并且本地和远程服务器都已启动，现在现在你的 PC 和移动端 App 上应该可以正常使用美国地区的\
    \ Facebook 应用。\n\n```\n$ sysctl -w net.ipv4.ip_forward\n```\n\n# 教程\n\n# Mattermost\n\
    \n## 使用 Mattermost 简化团队通信\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_57_0.png)\n\
    \n我们将看到如何安装 Mattermost 并使用它来增强和简化团队通信\n\n**Nitish Tiwari** 职业是一名软件开发人员，也是开源爱好者。除了为博客和杂志写文章外，他还为自己的业务需求帮助自由软件。\n\
    \n通信是团队动态中一个非常重要的方面。团队的生产力取决于团队成员之间通信的质量。必须有一种平衡的方法，即团队成员在共享优秀报告的同时，取决于个人本身，也取决于公司文化，你所拥有的工具在团队通信中起着至关重要的作用。当我们查看\
    \ Mattermost 时，这是一个可以帮助你简化和增强内部通信的工具，同时托管在你自己的自由（Linux, SVN 等）下，以获取团队状态的统一界面。\n\
    \n## 01 数据库安装\n\n作为一种基于 Web 的软件，Mattermost 需要一个数据库和 Web 服务器来运行。让我们先在 Ubuntu 15.0\
    \ 上安装 PostgreSQL。首先，我们需要更新系统以获取最新的更新和补丁。\n\n```\n$ sudo apt-get update\n$ sudo\
    \ apt-get upgrade\n```\n\n现在在系统上安装 PostgreSQL：\n\n```\n$ sudo apt-get install\
    \ postgresql postgresql-contrib\n```\n\nPostgreSQL 会创建一个名为 postgres 的用户。让我们创建数据库和用户：\n\
    \n```\nCREATE DATABASE mostmost;\nCREATE USER mmouser WITH PASSWORD 'password';\n\
    GRANT ALL PRIVGES ON DATABASE mostmost TO mmouser;\n```\n\n完成后，现在访问 PostgreSQL\
    \ 数据库：\n\n```\n$ psql -host=localhost -dbname=mostmost -username=mmouser\n```\n\
    \n## 02 Mattermost 安装\n\n我们有了数据库和账户，现在下载并安装 Mattermost：\n\n```\n$ wget https://github.com/mattermost/releases/download/v0.8.2/mattermost.tar.gz\n\
    ```\n\n这将下载 Mattermost 代码。通过以下命令解压 tar 包：\n\n```\n$ tar -xzf mattermost.tar.gz\n\
    ```\n\n这将内容解压到当前名为 mattermost 的文件夹中。现在创建一个文件夹保存文件：\n\n```\n$ sudo mkdir -p /mattermost/data\n\
    ```\n\n下一步是编辑位于 `/mattermost/config.json` 的文件。输入：\n\n```\n$cd /mattermost\n$ vi\
    \ config.json\n```\n\n## 设置\n\nMattermost 已成功安装并且你可以通过浏览器访问它，让我们开始吧。首先，你将被要求输入电子邮件地址创建一个团队。然后，输入团队名称。你可以根据喜好配置团队\
    \ URL。然后，你将被要求为账户选择用户名和密码。你现在也可以创建你的第一个公共频道。登录后，你将被带到团队的 Town Square 频道。Town Square\
    \ 是两个默认频道之一。\n\n这是团队成员注册时看到的第一个频道：供所有人发布更新\n\nMattermost 服务器的颜色可以在“账户设置 >”中进行自定义。\n\
    \n你可以从四个标准主题中选择，或从五个自定义主题中选择。要制作你自己的主题，请选择标准主题，然后为团队选择器选择自定义颜色。\n\n"
