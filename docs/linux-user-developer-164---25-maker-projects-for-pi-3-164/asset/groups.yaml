    # Feature Next-gen distros


    ## COREOS


    ### Make your desktop work for you with the help of CoreOS


    When you first get hands on CoreOS, you can be forgiven for thinking it’s a bare
    distribution, but that turns out to be one of its greatest strengths. The positive
    aspect of this minimal approach is that CoreOS is capable of trying out different
    deployments and dependencies, with the end user having a distro that’s easier
    to scale and manage.


    CoreOS’s real selling point is that it doesn’t ship with a package manager, and
    instead relies on containers to help applications and dependencies. The most prominent
    containers for each service you want on your machine (caching, database), use
    the file system to start and then connect them together easily.


    Its other benefit is through its update system with its root scheme, FastPath.
    Instead of updating packages, CoreOS is updated by a single unit, allowing for
    quickly and timely downloads. Essentially it minimizes the overall complexity
    of the update process by compartmentalising each entity. While probably not suited
    for those who are new to Linux, it is one of the few lightweight distributions
    out where the control is fully in the end user’s hands.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_35_0.png)


    ## CUB LINUX


    ### Chromium and Ubuntu in one helpful package


    We’ve already noticed how great Chromium is, when mixed with Ubuntu, it gets even
    better; Cub Linux is a unique mix of the best of both-named speed and web apps,
    with the best of what Ubuntu can offer. The end result is a combination of speed
    and stability.


    While Cub Linux doesn’t use any components of actual CoreOS, it does use a variety
    of open source products that look and act the same as the browser, but without
    the over-reliance on solely using web apps. With the power of Ubuntu behind it,
    users can now customise their OS experience with a myriad of desktop applications,
    making desktop computing easier. If you want the power of the Google ecosystem,
    without being directly tied to its limited set of desktop applications, Cub Linux
    is a worthy alternative to your standard Ubuntu experience.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_35_1.png)


    ## REMIX OS


    ### The full Android experience on any desktop


    Based on Android-x86, Remix OS is one of the first mainstream ports to getting
    Android on your PC, bringing pretty much everything encountered with Android in
    general, with the added support of a window manager, taskbar and more.


    Android has always been about notifications, and the way Remix has added it to
    OS not only looks great, but is incredibly useful. Notifications are split between
    apps, core settings and management, allowing for easy control. While not the most
    exciting of features, Remix offers a drag-and-drop system to move files around
    and has external storage support to hook up a drive on go. With the support of
    the Google ecosystem, Remix can provide all the tools you need to take usage to
    the next level, without compromising on whatever hardware you''re using.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_36_0.png)


    > It uses a drag-and-drop system


    A large part of why Elementary has gained a cult following since its inception
    a couple of years ago is not just its use, but also its design ethic. Think of
    it as Linux, but with a very well-done version of it focus on usability. Simplicity
    is key here and a large portion of it centres around multitasking of the desktop
    environment. We’ve seen others distribute multi-window features, but Elementary
    implementation is slightly different. It hits hot spots on your desktop for effortless
    switching between windows, most of which can be achieved with a click of the mouse,
    or a customised shortcut. And if that''s not enough then the team behind the OS
    has also created a suite of preinstalled software, custom-made for their desktop
    environment. This won''t tick the trick for advanced users, but for making the
    transition to Linux for the first time, it''s a great place to: Above OS-style
    dock at the bottom of the distribution.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_36_1.png)


    ## ELEMENTARY OS


    ### Wait, isn''t this OS?


    Plasma is open source in every sense of the word. It can be modified, distributed
    and re-used without any restrictions in place. There''s a buzzing community already
    behind it, with a huge number of key developments in the early stages.


    # Next-gen distros


    ## PLASMA OS


    ## SAILFISH OS


    ### A radical alternative to Ubuntu Touch


    The true independent mobile system


    Unlike many of competitors, Plasma can support different types of apps. So well
    as native apps, there''s also support for apps developed by GTK, Ubuntu Touch
    and Sailfish OS. An comprehensive ecosystem is a variety of getting more people
    interested in OS such as this:


    The core of Sailfish is built in the same vein as a classic Linux distribution,
    based on the Mer Project - a mobile-optimised distro. While there are some noticeable
    similarities between the look and feel of Sailfish and Android, it relies more
    on user participation for early results. Open source providers and vendors are
    all readily available for download, with the ultimate aim to make Sailfish as
    cohesive as possible.


    A large portion of Sailfish is designed to be modular and easily supportive of
    multiple hardware targets. Third-party elements are used as external features
    for the core OS, enabling experimentation with different areas of the device to
    figure out what works best together. The skate is still in the early stages of
    development, there already offshoots of the core OS available for a myriad of
    devices, so it''s worth experimenting with different versions.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_37_0.png)


    Personalization plays a big role in mobile OS, enabling users to tinker with every
    aspect of their smartphone experience, as they would with a desktop. With a few
    of developers working in the background, and some great incentives out there for
    others to get involved, Plasma Mobile could play a major part in your smartphone
    experience.


    ## TIZEN


    ![](img/453752f2a570e8fff106aca09a3ea2e3_37_1.png)


    ### The Linux Foundation''s pet mobile project has come of age


    When the Linux Foundation partners with the likes of Samsung and Intel, you''re
