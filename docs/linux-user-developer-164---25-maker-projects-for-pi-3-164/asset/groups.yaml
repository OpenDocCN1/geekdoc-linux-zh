  - "[PAGE 46]\n\nHBase uses atomicity, consistency, isolation, and durability properties.\
    \ When an operation like put or delete starts, HBase retrieves the next transaction\
    \ number, WriteNumber. The flow of this transaction in HBase is: 1) lock the row\
    \ to guard against concurrent writes 2) write the change to the WAL (Write Ahead\
    \ Log); 3) apply changes to the MemStore (using WriteNumber to get the Keys);\
    \ 4) commit the transaction; 5) unlock the row. For read or scan HBase retrieves\
    \ the last committed number, called ReadPoint. The flow is: 1) get the current\
    \ ReadPoint; 2) list all scanned Keys with a timestamp greater than the ReadPoint;\
    \ 3) close the scanner.\n\n# Implementation\n\nHBase is comprised of a cluster\
    \ of one or more region servers. The HBase master orchestrating, assigning regions\
    \ to region servers, and recovering region servers when failures occur, handles\
    \ read/write operations. Region servers also manage the splitting and merging\
    \ of HBase-new regions.\nThe cluster is managed by ZooKeeper, which handles the\
    \ location and address of the cluster. ZooKeeper provides a distributed mechanism\
    \ to safely handle partial failure; it can be used as a rendezvous mechanism so\
    \ that the processes can interact with each other. All the partitions of regions\
    \ are managed by ZooKeeper, which assignment transactions so that if the server\
    \ crashes mid-assignment, the recovery can pick up from where the assignment crashed.\
    \ Region servers listed in HBase configuration for the remote nodes, an SSH-based\
    \ mechanism is used.\n\n# Installation\n\nThe prerequisite for HBase is that HBase\
    \ and Hadoop be installed across the nodes of the cluster and must have SSH connection.\
    \ HBase can be installed in three modes: standalone, pseudo-distributed and fully\
    \ distributed. It can be downloaded from http://www.apache.org/hbase/. To set\
    \ up, first go to the conf folder, of the hbase folder and set the JAVA_HOME path\
    \ by adding the line below:\n\nThe standalone mode uses a single implementation\
