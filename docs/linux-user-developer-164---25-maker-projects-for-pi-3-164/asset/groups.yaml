    ## 12 AUTO-LIGHTS


    Many Bluetooth light bulbs can be reverse-engineered to work with Blue2—find which
    library to download to work with bit.ly/UiGadget. You could also use Bluetooth
    to plug your switches into non-smart lights and control them through it.


    ## 16 DRONE


    There are some great resources if you want to build your own drone—check diyrones.com
    and instructables.com—including the motors you''ll need for Pi drone, or you could
    instead purchase a package for a chassis. Actually, you can drive your Pi 3 with
    the new PFXMFini autonomous shield. The PFXMFini is perfectly compatible with
    the Raspberry Pi 3, and its extra CPU power gives it performance boost over a
    Pi Zero or drone. The PFXMFini includes a gyro, compass, accelerometer, temperature
    and pressure sensor, plus an ADC—a very handy board that works with the Pi 3 and
    Bluetooth, and you won''t need any extra modules in order to control it if it''s
    in the air.


    ## 13 PLANT MONITOR


    Use a DHT11 sensor to sense the temperature and moisture of the earth, then feed
    that data to a web server that you can check via your phone. You can even plug
    in a water pump and a waterproof enclosure for the Pi, and leave it in the garden.


    ## 14 TEMPERATURE CONTROL


    Use DHT22 sensors to track everything inside a case. Then move the unit around
    the house to get readings. Upload all the data to a database on a web page, and
    find out the hot and cold spots are.


