    \ little competition, and any independent launchers have been heavily restricted\
    \ in what they can do. However, we now finally have a choice with the launch of\
    \ AsteroidOS.\n\nDeveloped by Florent Revest, AsteroidOS is the first true open\
    \ source distribution for smartphones from LG in its current state. AsteroidOS\
    \ includes only the bare minimum of functions. So stopwatch, calendar and calendar\
    \ are all ready to use, but many features we're accustomed to are not.\n\nAdoption\
    \ rates are still in their infancy, and Revest has been quick to improve the project\
    \ as developers are working on it. Currently, owners of the LG Watch and LG G\
    \ Watch bootloader is unlocked, putting it over to other devices isn't a difficult\
    \ task. The kernel is built around libhybrid, which allows the re-use of Android\
    \ code.\n\nInitial tests on the AsteroidOS software have provided positive. On\
    \ videos uploaded to AsteroidOS official Twitter account, videos have shown many\
    \ of its core apps working. Speed is quick, crashes are infrequent and plenty\
    \ of polish on hand. Keen developers can go hands with the code that Revest and\
    \ his team released to build applications from scratch and directly implement\
