    With your Fritzing project, you''ll probably want to share with others. By using
    the Export tool, found in the File menu, two options are available: As Image and
    For Export. If you''re planning to print your project out, choose JPG, PNG, SVG
    or PDF of the diagram, then select As and the preferred format. It will result
    in checking out some projects, so there''s so much you can do with Fritzing that
    may not have enough of:![](img/453752f2a570e8fff106aca09a3ea2e3_84_3.png)


    ## Detailed placement


    If you''ve ordered a PCB - perhaps a new Pi-HAT - you can use the Inspector tool
    inside the software!


    ## 14 Is your project ready?


    Not only does Fritzing help you to create diagrams, but also inform you if you
    have a problem with the project. Once you use your components in the parts and
    PCB views, using Routing > Design Rules check and let the software device report
    back with them. Any issues that may come up are usually addressed by adjusting
    the position of parts and wires.


    ## 15 List your parts


    Large projects can run away with you. When you''re prototyping something or on
