  mdcn: "\n\n# 教程\n\n# Hadoop\n\n## 在 HBase 中使用 Hadoop 数据\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_45_0.png)\n\
    \nHadoop 用于批处理，但对于数据的实时访问，你应该使用 HBase。\n\n大数据——以太字节（terabytes）/拍字节（petabytes）为单位——无法用传统数据库进行存储和处理，因此出现\
    \ Hadoop 这样的东西只是时间问题。Hadoop 使用 HDFS 分布式文件系统和 MapReduce 来存储和管理这些数据。\n\n在插入单元格时由\
    \ HBase 自动管理。行和列被组成列族（column families）；每一列都遵循第一行（行键）。列族必须作为表模式定义的一部分指定，但根据需要添加新的列成员。\n\
    \nHadoop 是开源的，HBase 项目由 Yahoo 的 Chad Wang 和 Jim Kalmers 启动，并以 Google 的 Big Table\
    \ 为模型构建。HBase 适用于稀疏的数据集，这种数据集在 Hadoop 中很常见，并提供了允许使用不同编程语言开发的 API。\n\n每一行都是一个字节数组，允许从字符串到较长的序列化数据结构作为行存储。用于标识\
    \ HBase 表中数据的坐标是行、族和列；然而，有几种策略来支持其次要要求的查询类型。\n\n**Ashish Sinha**\n他是一位作者、老师和开源爱好者。在\
    \ IT 领域拥有超过五年的经验，他目前正在探索开源技术和工具。\n\n## 区域与锁定\n\n在 HBase 中，随着表大小的增长，它会自动分布在各个区域（regions）上——区域是表所属的单元，其第一行和最后一行定义了边界。这会将表划分为大致等大小的区域。对于单个服务器来说太大的表存储在服务器集群中，每个节点托管表总量的子集。\n\
    \n## 资源\n\n- Hadoop: http://hadoop.apache.org\n- HBase: http://hbase.apache.org\n\
    - Eclipse: https://www.eclipse.org\n\n## HBase 数据模型\n\n应用程序在包含行和列的带标签表中使用 HBase\
    \ 数据。行和列的交点被定义了，在默认情况下，它们是\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_45_1.png)\n\
    \n```\nFile Edit View Search Terminal Help\nApplications Places System\ntraining@localhost:\n\
    04/12/2023 16:51:24 INFO hbase.conf.hadoop.native.lib is deprecated. Use io.native.lib.available\
    \ instead.\nWarning: hbase.conf.hadoop.native.lib is not supported.\ntype 'STDOUT'\
    \ to leave the HBase Shell.\nOct 16 14:44:57 PM 2012\nhbase:main[001:0] get 'table',\
    \ 'row'\nrow\nrow\nrow\n(2 rows) in 0.4930 seconds\nhbase:main[002:0] get 'table',\
    \ 'row'\nrow\ncolfamily\n\ncolf:ia, timestamp:1456095695286, value=value1\ntimestamp:1456095695000,\
    \ value=value2\ncolf:c, timestamp:1456095705211, value=value3\n```\n\n正确的 HBase\
    \ 属性带有时间戳，因此你可以从存储的数据库中获取版本信息。\n\nHBase 使用原子性、一致性、隔离性和持久性属性。当启动如 put 或 delete\
    \ 等操作时，HBase 获取下一个事务号 WriteNumber。该事务在 HBase 中的流向为：1) 锁定行以防止并发写入；2) 将更改写入 WAL（预写日志）；3)\
    \ 将更改应用到 MemStore（使用 WriteNumber 获取 Keys）；4) 提交事务；5) 解除行锁。对于读取或扫描，HBase 获取最后一次提交的编号，称为\
    \ ReadPoint。其流向为：1) 获取当前 ReadPoint；2) 列出所有时间戳大于 ReadPoint 的已扫描 Keys；3) 关闭扫描器。\n\
    \n## 实现\n\nHBase 由一个或多个区域服务器（region servers）组成的集群组成。HBase master 负责协调、将区域分配给区域服务器以及在发生故障时恢复区域服务器，并处理读/写操作。区域服务器还管理\
    \ HBase 新区域的拆分和合并。\n集群由 ZooKeeper 管理，ZooKeeper 处理集群的位置和地址。ZooKeeper 提供了一种分布式机制来安全地处理部分故障；它可以被用作会会机制，以便进程之间相互交互。所有区域的分区都由\
    \ ZooKeeper 管理，它负责分配事务，这样如果服务器在分配过程中崩溃，恢复过程可以从崩溃处继续。对于 HBase 配置中列出的远程节点服务器，使用了基于\
    \ SSH 的机制。\n\n## 安装\n\nHBase 的前提是 HBase 和 Hadoop 必须安装在集群的节点上，并且必须有 SSH 连接。HBase\
    \ 可以以三种模式安装：独立模式（standalone）、伪分布式（pseudo-distributed）和全分布（fully distributed）。可以从\
    \ http://www.apache.org/hbase/ 下载。设置时，先进入 HBase 文件夹下的 conf 目录，通过添加下面的行设置 JAVA_HOME\
    \ 路径：\n\n独立模式使用本地文件系统的单一实现。\n\n```\nexport JAVA_HOME=/usr/lib/jvm/java-8\n```\n\
    \n现在打开配置表下的 hbase-site.conf 文件，指定 HBase 文件夹和 ZooKeeper 目录，如下：\n\n```\n<configuration>\n\
    \  <property>\n    <name>hbase.zookeeper</name>\n    <value>localhost:2181</value>\n\
    \  </property>\n  <property>\n    <name>hbase.cluster.mode</name>\n    <value>standalone</value>\n\
    \  </property>\n  <property>\n    <name>hbase.root</name>\n    <value>/hbase/root</value>\n\
    \  </property>\n  <property>\n    <name>hbase.zookeeper.client</name>\n    <value>/tmp/zookeeper</value>\n\
    \  </property>\n</configuration>\n```\n*(注：由于原文示例中配置块不完整，此处根据常规配置补全了逻辑结构，翻译时保持了意图)*\n\
