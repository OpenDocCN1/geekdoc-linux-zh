    \ 时，死锁文件使这种有效技术变得有效：\n\n```c\nfcntl(fd, F_SETLK, &lock)\n```\n\n当锁被成功锁定时，`lockFile()`\
    \ 函数返回 0。执行 `deadlock.c` 将产生以下输出：\n\n```\n$ /deadlock_deadlock.c\nFile deadlock\
    \ is successfully locked!\n```\n\n请注意，你需要复制 `deadlock.c` 并执行它。之所以这样做是因为你第一个实际上可以锁定该文件：\n\
    \n```\n$ /deadlock_deadlock.c\nFile deadlock cannot be locked!\n```\n\n务必阅读 `deadlock.c`\
    \ 的源代码。\n\n## 异步 I/O\n\n在异步模式下，应用本身必须询问才能进行通信并处理数据。`aio_read()` 函数将由 aiocbp 指定的缓冲区请求的\
    \ I/O 请求。该函数是 `read(2)` 的异步等效版本。调用的参数（按顺序）对应 aiocbp 指向结构中的 `aio_fildes`、`aio_buf`\
    \ 和 `aio_bytes` 字段。\n\n## 内存映射 I/O\n\n内存映射 I/O 是一种将文件映射到进程空间的技术，允许程序像访问内存一样访问文件数据。POSIX\
    \ 标准定义：\n\n```c\nstruct aiocb {\n    int aio_fildes; /* 文件描述符 */\n    void *aio_buf;\
    \ /* 缓冲区 */\n    size_t aio_bytes; /* 字节数 */\n    off_t aio_offset; /* 偏移量 */\n\
    \    struct aio_sigevent aio_sigevent; /* 通知事件 */\n    int aio_lio_opcode; /*\
    \ 操作代码 */\n    int aio_errno; /* 错误代码 */\n    int *aio_return; \n};\n```\n\n`pollfd`\
    \ 结构用于 `poll()` 保存文件描述符列表。它返回一个整数，出错时为 -1，或者返回准备好 IO 的描述符数量。第二个参数是超时时间。执行 `pollEx()`\
    \ 会产生如下输出：\n\n```\n$ /pollEx\n23\n0: Input given\n43\n1: Input given\n2: No input\
    \ given\n```\n\n`timeval` 和 `timespec` 结构之间的区别在于前者使用秒和微秒，而后者使用秒和纳秒。如你所见，`timespec`\
    \ 结构比 `timeval` 结构更精确。\n\n下面的 C 代码是 `pollEx.c` 的一部分，说明了 `poll()` 函数的使用：\n\n这两个系统调用允许程序监控多个文件，并等待直到其中一个或多个文件可以进行某种\
    \ IO 操作。因此，程序不需要自己编写代码来识别每个文件描述符的状态。如果发生错误，该函数将返回 -1。\n\n- retval = poll(fds,\
    \ 1, 2500)\n\n`poll` 系统调用类似于 `select()`，它等待多个文件事件。同样，`poll()` 系统调用等同于 `select()`。通常情况下，每当你需要清除或记住某个参数或整个调用的目的时，其\
    \ man 页应该是你获取信息的首选地方。\n\n## 两个简单的示例\n\n现在是展示一些简单代码的时候。包含在 `select()` man 页中的代码是\
    \ `selectEx` 的一部分，展示了如何使用 `select()`：\n\n```c\ntv.tv_sec = 0;\ntv.tv_usec = 0;\n\
    retval = select(1, &fds, NULL, NULL, &tv);\n```\n\n编译 `selectEx` 在不提供任何输入的情况下执行，会产生输出：\n\
    \n```\n$ /selectEx\nNo data within seconds.\n```\n\n## 死锁检测器\n\n你应该避免死锁。有时可能会出现问题，并发生意外的死锁。解决方案是防止死锁。`simple.c`\
    \ 显示了一个可能发生死锁的情况，但这是由于用户没有按回车键。最罕见的死锁通常发生在进程 A 等待由进程 B 持有的资源时。\n\n```c\n#include\
    \ <fcntl.h>\n#include <errno.h>\n#include <stdio.h>\n#include <unistd.h>\n\nint\
    \ lockFile(int fd, int limit)\n{\n    int try = 0;\n    struct lock;\n    lock.l_type\
    \ = F_WRLCK;\n    lock.l_whence = 0;\n    lock.l_start = 0;\n    lock.l_len =\
    \ 0;\n\n    for (try = 0; try < limit; ++try)\n    {\n        if (0 == fcntl(fd,\
    \ F_SETLCK, &lock))\n            break;\n        if ((errno != EAGAIN) && (errno\
    \ != EACCES))\n            break;\n    }\n}\n```\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_42_0.png)\n\
    \n# 教程\n\n# 系统编程\n\n阅读各种异步 I/O 系统的描述是值得的。\n\n2. mtsouk@mail:~/docs/article/working/SPAdIO.LUD164/code\
    \ (seh)\n\nAIO_READ(3) Linux 程序员手册 AIO_READ(3)\n\nNAME\naio_read - 异步读取\n\nSYNOPSIS\n\
    \n```c\n#include <aio.h>\n\n aio_read(struct aiocb *aiocbp);\n\n链接时使用 -lrt。\n\
