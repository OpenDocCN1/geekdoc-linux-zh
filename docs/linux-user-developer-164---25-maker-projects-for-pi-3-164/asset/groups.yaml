    enough for general use | No cross-platform sharing options are present | Yandex
    offers a bit of off performance for distributing files |

    | Extra features | Limited in terms of lightweight console uses, little tools
    | Collaborative editing is the standout feature for working remotely | Frankly
    limited, but the features can be helpful for uploading regularly | There''s a
    built-in web editor you can get hands-on with in Cozy |

    | | Cozy''s excellent range of deep optimization options is a formidable | Solid
    collaborative options are of great use | Does a job of covering tables, and can
