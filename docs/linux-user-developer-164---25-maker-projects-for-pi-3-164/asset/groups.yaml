    worth experimenting with different versions.


    ![](img/453752f2a570e8fff106aca09a3ea2e3_37_0.png)


    Personalization plays a big role in

    mobile OS, enabling users to tinker

    with every aspect of their smartphone

    experience, as they would with a desktop.

    With a few of developers working in the

    background, and some great incentives

    out there for others to get involved, Plasma

    Mobile could play a major part in your

    smartphone experience.


    # # TIZEN


    ![](img/453752f2a570e8fff106aca09a3ea2e3_37_1.png)


    # The Linux Foundation''s pet mobile project has come of age


    When the Linux Foundation partners

    with the likes of Samsung and Intel, you''re in

    for something exciting. Tizen is their first vision

    of the future of mobile operating systems

    should look like. Being built from the

    ground up has enabled the OS to be ported

    numerous devices. As smartphones, there''s

    current support for Tizen on a number

    smartwatches, tablets and even

    appliances. Due to the high flexibility of the

    OS, a device manufacturer, or even network,-


    can modify and create their own fork of Tizen'
