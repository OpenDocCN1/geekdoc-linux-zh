    # Feature Next-gen distros


    # # NEXT-GEN\ DISTROS


    # ## Kit your desktop out with one of these radical takes on the classic distro
    formula


    **As Linux users, we''re pretty fortunate that when it comes to being able to
    switch up our desktop experience whenever we fit.** The process of switching distros
    has become effortless, and thanks to the likes of VirtualBox, testing potential
    distros can also be completed in a matter of minutes.

    But despite the increased amount of distros and the simplicity of switching between
    them, many users prefer established powerhouses for their needs. The likes of
    Ubuntu Linux Mint and Debian have been recognised as one of the primary reasons
    for the year-on-year increase in users around the world, offering accessibility
    to the OS for those making


    the transition from Windows and OS X, However, the next generation of Linux distros
    is upon us. Promising new features and better design, focusing on stability, relatively
    new distros are creating quite a stir around the community - and lightly. Many
    of them are heavy, tweaked versions of classic distros, while some bring entirely
    different to the table - with varying ideas. We get hands and eyes on some of
