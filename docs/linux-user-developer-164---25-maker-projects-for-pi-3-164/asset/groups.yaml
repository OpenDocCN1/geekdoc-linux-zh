    ## How compilers and interpreters work


    The diagram shows how compilers work and the various stages of the compilation
    process. As you can understand, it is a challenging reality which may amaze you.
    To get the executable, think of the next time you have a bug in your programs!


    So first the compiler gets the source file, which a scanner processes the lexical
    analysis of the source file. The scanner produces - a stream of tokens - which
    are used as input to the parser that does the syntax analysis. The analysis takes
    place and code generation begins. Now you have a syntax tree or an equivalent
    of a syntax tree, where other tools like a linker is involved.


    Put simply, tools like lex and flex do the lexical analysis and split the input
    into tokens, whereas tools like yacc and bison do the semantic processing with
    the tokens that lex and flex produce.


    ## The lex utility


    Mike Les developed the original version of lex around 1975 at AT&T Bell Labs.
    The lex utility can help you make lexical analysts. Their main job is to break
    up an input stream into useful tools that do not deal with the meaning of the
    tokens. The lexical analysis phase eliminates blanks, and after helping you separate
    tokens which have no other use. As you see, the lex utility has been replaced
    by flex.


    ## The yacc utility


    yacc is an acronym for Yet Another Compiler which is a tool that we use for creating
    compilers.


    In computer science, yacc is a parser that gets a grammar of a programming language
    as input and generates the source code of a parser as its output. Its job is to
    determine whether the input matches the grammar or not and may report it or generate
    error messages.


