    \n![](img/453752f2a570e8fff106aca09a3ea2e3_38_6.png)\n\n# A world of content at\
    \ your fingertips\n\nWhether you love gaming, history, animals, photography, Photoshop,\
    \ sci-fi or anything in between, every magazine and bookazine from Imagine Publishing\
    \ is packed with expert advice and fascinating facts.\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_38_7.png)\n\
    \n# BUY YOUR COPY TODAY\n\nPrint edition available at www.imagineshop.co.uk\n\
    Digital edition available at www.greatdigitalmags.com\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_38_8.png)\n\
    \n# Systems programming\n\n![](img/453752f2a570e8fff106aca09a3ea2e3_39_0.png)\n\
    \nMihalis Tsoukalis is a Unix administrator, a programmer for Linux and iOS, a\
    \ DBA and a musician. He has been using Linux since 1993.\n\n# Advanced file input/output\n\
    \n- Resources\n- Text editor\n- GCC compiler\n- Go compiler\n- Rust compiler\n\
    - Perl interpreter\n\n# We return to file I/O this month with an in-depth look\
    \ at the advanced techniques you can employ\n\nAdvanced file I/O means that you\
    \ can do usual file I/O operations with extra powers such as recording, nonblocking\
    \ I/O, multiplexing, asynchronous I/O, memory mapped and scatter read and gather.\
    \ Don't worry, we will take you through everything you need to get started.\n\n\
    and the nonblocking ones, which return with an error message indicating that the\
    \ operation was not completed and could have been blocked.\nAs you might have\
    \ guessed, advanced I/O is often the key feature of modern operating systems.\n\
    This tutorial will present the systems and the techniques that will allow you\
    \ to perform advanced I/O. It will be the most seen in the Systems Programming\
    \ series. Most of the code in this article will be written in C but you will also\
    \ see examples in Go.\n\nPlease be in mind that the concepts and principles of\
    \ advanced file I/O are more complex than standard I/O. When in doubt, look at\
    \ the source code or try to write it yourself to solve any ambiguities and make\
    \ things clearer for you.\n\n# Blocking and nonblocking I/O\n\nThere exist two\
    \ categories of systems: the usual ones like read() and write(), which can block,\n\
    \nAnother scenario where a program can wait for is input. Yet another area is\
    \ network programming, which is related to file I/O, because it is most likely\
    \ to wait for \"future\" over a network-related problem when a problem occurs\
    \ on your filesystem - those of you remember having NFS-related problems will\
    \ understand!\n\nTutorial files available:\nfiles.co.uk\n\n```c\n#include <unistd.h>\n\
    #include <fcntl.h>\n#include <stdio.h>\n```\n\n```c\nint main(int argc, char const**\
    \ argv) {\n    char buf[20];\n    int n = read(0, buf, 4);\n    if(n > 0)\n  \
    \      printf(\"You typed: %s\", buf);\n    return 0;\n}\n```\n\nA simple example\n\
    Let's start off with a simple example. sample.c, which presents a file I/O operation\
    \ that can be blocked because of the code below. The C code above will block the\
    \ program to the following:\n\n```c\nint n = read(0, buf, 4);\n```\n\nThe program\
    \ waits for input from the user - if the user does not press the Enter key, the\
    \ program will wait forever; which is not considered a good practice. Although\
    \ the blocking happens because of the user, it is still considered blocking.\n\
    If you change the code, the output of the diff(utility) cannot be blocked and\
    \ will always terminate with completely finishing its job.\n\n```bash\n$ gcc simpleNBc.c\n\
    fcntl(0, F_SETFL, O_NONBLOCK);\nsleep(10);\n```\n\nAs you can see, the overhead\
    \ for making sample.c to behave in a non-blocking way is small - if you want to\
    \ try it without program, you might need to write even more code, but simple.c\
    \ will not block your system.\n\n# Some useful system\n\nAlmost all techniques\
    \ presented here some system calls can be implemented. This part will present\
    \ some of the most important system calls you need to be aware of. You already\
    \ know fcntl() call, which can control file descriptor in general, including non-blocking\
    \ I/O. It is now time to explain the following:\n\n```c\nfcntl(0, F_SETFL, fcntl(0,\
    \ F_GETFL) | O_NONBLOCK)\n```\n\nFirst, F_SETFL, F_GETFL and O_NONBLOCK should\
    \ be clarified. The F_GETFL command tells fcntl to return the current value of\
    \ status flags. The status returned makes the internal file descriptor on the\
    \ status flags and we add the O_NONBLOCK flag to the existing ones. The O_NONBLOCK\
    \ flag allows a descriptor to be set in non-blocking mode, which is specified\
    \ as the parameter of fcntl function. As you understand, F_SETFL command requires\
    \ three arguments, whereas fcntl(2)\n\n# Balancing pros and cons\n\nThe main disadvantage\
    \ of all advanced I/O techniques is that they need advanced code, which you might\
    \ find expensive. However they can make your program much faster. What is important\
    \ is deciding whether extra effort is worth it compare the speed of normal I/O\
    \ with application that uses before. It is important to note that each example\
    \ of memory mapped I/O is supported with reading and writing. Another thing you\
    \ need to consider is that most of these techniques cannot be used at the same\
    \ time but is inefficient because of the overhead associated with such call.\n\
    \n# Tutorial\n\n# Advanced I/O in Go\n\nYou can do many things with Go, including\
    \ the implementation of the techniques discussed in this tutorial. Advanced I/O\
    \ guide shows how to perform memory mapped I/O in Go. The previous chapter discussed\
    \ how pointers -- if you do not handle pointers correctly, it will not. The most\
    \ interesting part of advanced I/O is where the mapping takes place.\n\n```go\n\
    data, err := syscall.Mmap(int(file.Fd()), 0, size, syscall.PROT_WRITE, syscall.MAP_SHARED)\n\
    if err != nil {\n\tlog.Fatal(err)\n}\nvar array = make([]byte, len(data))\ncopy(array,\
    \ data)\nfmt.Printf(\"%v\\n\", string(array))\n```\n\nThe full guide of advanced\
    \ I/O can be found in your resources. If you run it, you are going to get the\
    \ following output, which is what is written to the binary:\n\n```bash\n$ go run\
    \ main.go\n0 1 4 9 16 25 36 49 ...\n```\n\nThe FGETL command needs only two arguments.\
    \ This is because fcntl() accepts a variable number of arguments just like printf()\
    \ and scanf(). The following output illustrates that the program returns a code\
    \ on a Linux system:\n\n### $fcntlExample\nBefore: fd 0 Flags: 802\nAfter: fd\
    \ 0 Flags: 802\n\nThe flags have no recognisable meaning unless you know what\
    \ they are. A big advantage of fcntl is that it is largely standardized and available\
    \ across different platforms. The part of select(2) can be seen below. The select(2)\
    \ system call allows to supervise multiple file descriptors. The timeout in the\
    \ select(2) call is defined with a struct timeout. The system call is almost identical\
    \ to select(2) apart from three differences: first, the timeout is defined with\
    \ a timespec structure; whereas select(2) can and whereas select(2) does not.\n\
    \n| SELECT(2) | SELECT(2) |\n| :--- | :--- |\n| | Linux Programmer's Manual |\n\
    | NAME | |\n| select, pselect, FD_CL, FD_SET, FD_SET, FD_ZERO | synchronous I/O\
    \ multiplexing |\n\n```c\n/* SYNOPSIS\n/* According to POSIX.1-2001 */\n#include\
    \ <sys/select.h>\n/* According to earlier standards */\n#include <sys/time.h>\n\
    #include <sys/types.h>\n#include <unistd.h>\n```\n\n```c\nint select(int nfds,\
    \ fd_set *readfds, fd_set *writefds,\n\t      fd_set *exceptfds, struct timeout\
    \ *timeout);\n\tvoid FD_CL(int fd, fd_set *set);\n\tint FD_SET(int fd, fd_set\
    \ *set);\n\tvoid FD_SET(int fd, fd_set *set);\n\tvoid FD_ZERO(fd_set *set);\n\
    ```\n\n```c\n#include <sys/select.h>\n```\n\n```c\nint pselect(int nfds, fd_set\
    \ *readfds, fd_set *writefds,\n\t      fd_set *exceptfds, struct timespec *timeout,\n\
    \t      sig_t *sigmask);\n```\n\nRight We use the select(2) system to monitor\
    \ file descriptors to see when they are ready for an I/O operation\n\nFeature\
    \ Macro Requirements for glibc (see feature_test_mask(3)):\n\n```c\npselect(:):\
    \ _POSIX_C_SOURCE >= 200112L || _KOPEN_SOURCE >= 600\n```\n"
