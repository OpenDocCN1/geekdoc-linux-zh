    ![](img/453752f2a570e8fff106aca09a3ea2e3_70_0.png) Niels Affourit 将对 RC 的热爱变成了一个功能完备的潜水器


    为什么要建造 RC（遥控车辆）？当我还是孩子时，经常制作 RC 模型船和快艇。我从未放弃，并梦想拥有自己的潜水艇，尽管当时我有 RC，制造电子设备总是很困难。此外，水是我的敌人。2014
    年左右，我看到了一篇关于打捞沉船的国家地理杂志文章。他们使用无人机监控工作的方式令我印象深刻，这让我梦想拥有自己的。我偶然发现了一些拥有自己的无人机并进行应力计算（使用有限元分析）的人。我们还使用
    Linux 来改进与第三方软件的交互。对于 RC 的所有功能，有很多实现方法。树莓派部分让这个项目变得有趣。


    树莓派在这个项目中接收什么？无人机通过摇杆控制器控制，我们读取摇杆信号。信号随后转换为命令并发送到树莓派。树莓派是无人机的大脑，通过 Wi-Fi 与笔记本电脑通信。我学会了减少通信延迟。无人机可以在
    50 米深处运行，信号极不容易丢失。无人机由锂电池（在当地商店购买）供电，信号发送到电机。我们必须安装卷轴以避免使用电缆。这也减少了下没风险。Wi-Fi 路由器连接到船上。来自无人机的信号被传输并写入
    MySQL 数据库和网页。我们还在网页上显示数据。目前我使用树莓派控制无人机：四个电机的 PWM（脉冲调制）、摄像头的舵机以及另一个传感器。由于树莓派的 GPIO
    有限，我们需要一个 Arduino 与无人机（MS985R）通信。Arduino 通过 USB 连接，其模拟端口用于控制电池电压（使用两个电阻将电压降低到无人机所需的电压）。侧面的
    USB 电源连接无法使用。因此这不是熔丝连接，带来了一些风险，但对我来说运行完美。


    为什么要使用 3D 打印零件？底盘、机构和树莓派外壳都是 3D 打印的。我们使用 Inno3D 3D 打印机是因为很容易改变零件的方向和形状。每个零件的成本减半，但我们可以在打印时使用更少的层数使其更符合流体力学。目前无人机可以停留多深？


