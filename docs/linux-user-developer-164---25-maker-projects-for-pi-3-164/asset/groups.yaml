    # Yandex.Disk


    A multi-purpose cloud client that works across multiple platforms


    ![](img/453752f2a570e8fff106aca09a3ea2e3_88_0.png)


    ![](img/453752f2a570e8fff106aca09a3ea2e3_88_1.png)


    +   Add extras to your Cozy account to expand how you can interact with your files


