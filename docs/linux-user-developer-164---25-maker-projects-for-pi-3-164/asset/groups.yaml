    # 开源硬件


    ## Google 已加入 Facebook 的开放计算项目 (Open Compute Project)


    **科技界两大巨头想要彻底变革数据中心世界**


    Facebook 的开放计算项目（OCP）近期非常火热，Google 的加入展示了他们的承诺。该项目最初于六年前创立，为终端用户数据中心设备设计，旨在之后降低成本。许多其他科技巨头已经加入了该项目，包括微软等公司。自从最近在硅谷举办的
    OCP 峰会以来，Google 一直未出现在名单上。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_8_0.png)


    Google 已经被誉为拥有一些最先进的数据中心，它的首次贡献是对机架设计提出了一项激进的方案，使用大多数数据中心使用的增强 48 伏电路为服务器供电。目前，它们仍使用标准的
    12 伏设计。


    这种新设计是 Facebook 和 Google 的合作成果，双方都在各自的数据中心中采用该设计。Google 的加入使得除了苹果在去年年底加入外，亚马逊成为唯一尚未加入
    OCP 的超大规模云提供商。


    # 游戏


    ## MAME 现在免费并开源


    **街机模拟器现已可免费修改**


    在面世二十年后，MAME（多功能街机游戏模拟器）终于开源了。此前，该软件根据 BSD 许可证发布，禁止了任何对 MAME 的商业用途。


    尽管 MAME 的许可协议涉及许多需要处理领域，但它仍然是游戏爱好者从各个平台进行贡献的最流行方式。


    > 游戏爱好者模拟和享受复古游戏的最流行选择


    直到最近，MAME 的源代码虽然可以易于获取，但存在限制用户操作的规定。现在用户可以向他们的这里内容分发 MAME 吗？看到这个项目最终将走向何方以及它将如何开发是非常有趣的。经典街机游戏的正确
    ROM 文件可以在 MAME 软件内部运行。


    “在 19 年之后，MAME 现在可以在符合 OSI 标准且免费批准的许可证下发布，”mamedev.org 团队表示，“绝大多数文件仍然根据 3 句 BSD
    许可证提供，但整个项目是以 GNU 通用公共许可证（GPL）分发的。向完全开源项目的转型并非易事，团队还表示，过去的十个月一直在尝试联系所有在 MAME 周期内贡献过的人，并告知他们新许可证的信息。如果你认为你对
    MAME 核心源码做过贡献，MAME 团队在网站上提供了一个链接，你可以直接与他们联系。”


    ![](img/453752f2a570e8fff106aca09a3ea2e3_8_1.png)


    # OpenSource

    你的 Linux 新闻与观点来源


    # 发行动态


    ## 前 10 名

    2月19日 – 3月16日 日均访问量


    - 1. Linux Mint: 3,027

    - 2. Debian: 2,043

    - 3. Ubuntu: 1,943

    - 4. openSUSE: 1,361

