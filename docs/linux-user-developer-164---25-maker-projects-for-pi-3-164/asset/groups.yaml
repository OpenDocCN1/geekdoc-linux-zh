    # Review Cloud storage


    ![](img/453752f2a570e8fff106aca09a3ea2e3_87_0.png)


    Cloud storage built by the community, for the community


    ![](img/453752f2a570e8fff106aca09a3ea2e3_87_1.png)


    Cloud encryption propel Bitcasa up to the top of the class?


    ![](img/453752f2a570e8fff106aca09a3ea2e3_87_2.png)


    +   - Use the gallery options to switch out how files are viewed through your
    account


    +   - Files are automatically encrypted as soon as they''re uploaded to your Bitcasa
    account


    ![](img/453752f2a570e8fff106aca09a3ea2e3_87_3.png)


    # File management


    One of the greats about ownCloud is that you can manage your files in different
    ways. There are no limits to the folders and files you can create. It offers support
    for web-based MS Word documents. Editing options are a little on the basic side,
    but it''s one of the few open source storage systems that supports us.


    # Ease-of-use


    It''s not easiest to get working straight away. Users can set up their own ownCloud
    server, simply go to the link or link them to a domain name. It''s a bit intimidating
    to set up, the client is fairly intuitive. Could use a better drag and drop sync,
    but we''re nitpicking.


    # Sync and sharing


    ownCloud is centred around the idea of syncing and sharing files through its servers.
    Syncing data between accounts, and across desktop, web or mobile app, is entirely
    possible. Sharing is fast, and there are additional options available for users
    to protect their data.


    # Extra features


    Extra features are present in ownCloud, including a full calendar and contact
    support. However, the collaborative editing system that has caught our eye. If
    few individuals can work on project simultaneously, with any changes to be summarised
    to other members via email. It''s an extremely intuitive system, for the most.


    # Overall


    It''ll take notice users time to fully set up ownCloud, but its plethora of features
    and collaborative options makes it a serious alternative to some of the big players
    out there in the proprietary bandwagon.


    # File management


    Any and all files added to your Bitcasa account are protected by AES-256 encryption,
    so there is some protection available. It works with a wide variety of file types,
    no matter original format or the OS they stemmed from. It is the luckily slow
    upload speed for some files, which don''t appear to be a problem for other cloud
    storage systems in this.


    # Ease-of-use


    Bitcasa has a lot of similarities to Dropbox and Google Drive, so it''s far easier
    to use of the group, mainly due to lack of setup required on the other side of
    devices. Creating new folders to merging files is simple to complete, there are
    enabled tutorials to help you if you''re ever in doubt.


    # Sync and sharing


    Despite being highly locked to encrypted files, there are still numerous ways
    to share them via social networks. Each file will have password protection, in
    case it ends up in the wrong hands.


    # Extra features


    There aren''t many things to get excited about in Bitcasa, but a helpful-backup
    is the top of what''s included. It''s a surprisingly easy way to get your files
    into account, without without any limits to it, it''s easy enough to have untold
    of uploaded files out of your space.


    # Overall


    Bitcasa''s simplicity makes it a tempting proposition to most users, and while
    its focus on encryption should be applauded, it has some other features being
    bare for the most part.'
