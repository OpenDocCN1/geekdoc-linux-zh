    > Linus Torvalds announced the final release of Linux 4.5, noting that he ''couldn''t
    make up his mind whether to do rc8 [release candidate], or to keep waiting until
    now. In the end, I decided not to, but it could have gone other way.'' As reported
    in last month, this release includes a few earth-shifting features that are true
    of a typical release cycle (this happens periodically during the year based upon
    certain new features being developed and merged). We have new features support
    for volatile memory via devmmap, which we covered in detail last issue and optimisation
    by the ''copy_file_range'' system


    Trimming unused kernel symbols


    In the early days of linux, back when Linus and Andrew Tanenbaum were having numerous
    arguments about monolithic versus microkernels (which were both digging for their
    comedy in the online usenet - usenet an older technology for group programming),
    Google proved that monolithic Linux fell under the cap having all of the code
    to support kernel operation into a single binary design. Contrast this with the
    exposed microkernel design, which is a kernel built from many parts that are isolated
    from one another in the way that users communicate via interfaces under linux.


    Arguments around microkernel design were hot topics in the university classes
    and forums - as example, Windows NT, and by extension modern Windows, is partially
    addressed with designs like Mach OS which runs under a microkernel which it is
    built. But for the most part, though, the reason Linus was choosing one part of
    approach is that the monolithic kernel is not strictly formed from a single inseparable,
    indivisible kernel that allows for heavy use of modularity - compiling code into
    dynamic loadable-modules - as a way to add and remove functionality while keeping
    a lighter bridge between the modules.


    Jon Masters


    In a Linux-kernel hacker who has been working on Linux for some 19 years, now
    at the university of j. Leeds in Cambridge, Jon has worked for a large enterprise
    Linux distribution and led the creation of standards for efficient ARM-powered
    servers


    Using the new system call, copy_file() (the Linux and Unix file copy utility used
    by the command line) will not have to extensively perform a copy of data contained
    within a user-space file to a new file, avoiding every entrypoint round-read-point
    operation and out of the kernel. Instead, Linus says using the new system call
    could help faster under many normal situations. However, when using NFS (Network
    File System), which also include server-side copy (which is now available in NFSv4,
    as noted in the release), the kernel saves transferring the file data over the
    network when using NFS3.


    With the release of Linux 4.5, the opening of the ''merge window'' (period of
