    - 6. Fedora: 1,175

    - 7. PCLux: 1,035

    - 8. Zorin: 994

    - 9. CentOS: 907


    # FOSS


    ## Writer 更新在 LibreOffice 5.11 更新中表现亮眼


    **一个备受期待的功能现已可用**


    似乎就在昨天我们还在看广受欢迎的 LibreOffice 套件的 5.1.0 版本，但团队再次宣布了 5.0 系列。“文档基金会引入了 LibreOffice
    5.1 系列，”Vito Vogni 说，“最新更新修复了上一个版本中的许多错误……”


    ![](img/453752f2a570e8fff106aca09a3ea2e3_9_0.png)


    此外，还有许多令人兴奋的功能。软件现在与云服务的集成深度大增，使用户不仅可以在账户中读取文档，还可以直接进行编辑。根据初步反馈，云端完成任务似乎变得更快、更简单了。


    关于 Writer 中的布局问题，用户现在可以隐藏通常位于段落之间的空白，这有助于创建连续的文本流并提高文档的可读性，同时还解决了由于属性兼容性问题导致的几近标题断行符。


    除了这些新变化外，格式工具栏中还出现了一个大纲按钮，打印功能中也增加了一个帮助识别单个页的新功能。你可以在 www.libreoffice.org 下载官方
    LibreOffice 客户端，并找到功能和编辑的完整文档。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_9_1.png)


    上方你现在可以通过隐藏页间空白来简化文档阅读


    ## 本月


    - 稳定版 (18个)

    - 开发中 (8个)


    PCLuxOS 拥有 Android 的第一个构建版本，下载量在月内增长。


    ## 亮点


    ### 红帽 6.8

    新的 RHEL 带回了 Linux 的部分功能，包括 Redux 特性，并锚定了新实现的 Librarian VPN 软件。


    ### Manjaro

    Manjaro 提供了一个全面的图形界面，使得安装和维护他们提供的内核（或你自选的内核）变得更容易。


    ### Untangle NG

    现在正致力于扭转 Untangle 的衰落，使用户可以更容易升级而不会遇到以前过的问题，因此资深用户可以直接上手。


    # 数据库


    ## 微软用于数据管理和分析的开源 SQL Server


    **在官方宣布 SQL Server 将免费后，微软传闻已久的开源尝试已成现实**


    云与工程小组执行副总裁 Scott Guthrie 发表的一篇文章中，Linux 版 SQL Server 将在 Windows 服务器和 Linux、本地和云端之间提供一致的数据平台。Linux
    版服务器将为客户的数据解决方案提供更大的灵活性。


    SQL Server for Linux 预览版现已可用，可以访问多种功能，包括扩展数据库 (Stretch Database)，它是客户在需要时访问数据的一种低成本解决方案。该项目将与基于标准
    SQL 查询的新构建应用程序良好地工作。完整可用版计划于 2017 年中期发布。


