    ## 13 Autoute assistance


    While it is not possible to automate the creation of Fritzing projects, the next
    thing is available: using the Schematic and PCB views, you can activate Autoute
    to connect the components. You can also press Ctrl+Shift+A to make the work fast.
    This means all you need to do is place components – the autoute will handle the
    rest!


    ## 16 Get a quote


    Diagrams can be converted into physical entities using the Fritzing service, which
    is initiated via Routing > Quote. In the resulting view you will see information
