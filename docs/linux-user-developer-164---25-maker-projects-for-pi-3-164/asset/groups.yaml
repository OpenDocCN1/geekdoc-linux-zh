    # 开源


    06 新闻与观点 | 12 访谈 | 96 FileSolo


    可穿戴设备


    ## AsteroidOS：佩戴开源手表


    ![](img/453752f2a570e8fff106aca09a3ea2e3_5_0.png)


    # 使用全新的自由操作系统，释放你的 Android 智能手表的潜能


    长期以来，Android 在智能手机领域一直处于领先地位。最初这只是早期采用者提供的一些无价帮助，但现在已变成全球范围内不可或缺的个人化助手系列设备。


    硬件和软件的进步使我们能够更自由地运行 Android，这导致了一系列以前仅限于我们智能手机的功能出现。


    但现在，在智能手表市场上，开源社区在很大程度上被遗后了。随着谷歌和苹果在该领域的领跑，竞争变得非常稀少，而且任何独立启动器在功能上都受到了严格限制。然而，随着
    AsteroidOS 的发布，我们终于拥有了选择。


    AsteroidOS 由 Florent Revest 开发，是目前状态下 LG 发布的首款真正的智能手机开源发行版。AsteroidOS 仅包含最基本的功能。因此，秒表、日历和计算器已备绪可用，但我们习惯的许多功能还没有。


    采用率仍处于起步阶段，Revest 在开发者进行开发的同时也在迅速改进该项目。目前，LG Watch 和 LG G Watch 的所有者引导加载程序已解锁，将其迁移到其他设备并非一项困难的任务。内核围绕
    `libhybrid` 构建，这允许重用 Android 代码。


    对 AsteroidOS 软件的初始测试提供了积极反馈。在上传到 AsteroidOS 官方 Twitter 账号的视频中展示了其许多核心应用程序的运行。运行速度很快，崩溃频率很低，并且经过了大量的打磨。热衷的开发者可以利用
    Revest 及其团队发布的代码从零开始构建应用程序，并直接将其实现在智能手表上，从而改变其硬件的性能。通过作为一个开源操作系统，用户还拥有工具将操作系统调整用于其他各种用途。


    访问 AsteroidOS 网站 (asteroid.org) 查看项目的完整概述，查找在你的设备上安装该系统的指南，以及访问其 GitHub 可以在那里查看其源代码。


    ## 物联网


    ## 前五名


    ### Android N 的新功能


    ### 多窗口模式

    N 最受期待的功能之一是新的多窗口模式。启用此功能后，用户可以在几秒钟内无缝切换多个应用程序，或在需要时一次（同时）使用多个应用程序。


    ### 交互式通知

    采取了与 iOS 非常相似的措施，用户现在可以从通知面板回复消息。设计的快速概述显示，你只需点击即可开始回复。你再也不需要消息应用了！


    ### 增强的设置

    实现了一个总的系统菜单，帮助以更简单的方式进行设置。事实上，一个可识别的菜单将显示不同的设置，然后根据你的需要进行编辑。


    ### 增强的 Doze 模式

    Doze 是节省电池的一个极佳主意，但它的功能有限。Android 中实现了一种全新的改进型 Doze 模式，这将进一步延长电池寿命，特别是通过更准确的跟踪。


    ### Android beta 计划

    用户可以在他们的设备上加入 Android beta 计划。这允许谷歌预览功能并测试更新，而无需进行出厂测试。


    > 允许系统建议设置是一个真正的改进


    ## Mozilla Firefox-OS 成为物联网中心


    ### Firefox OS 将作为操作系统引入我们的生活


    Mozilla 正在幕后开发四个物联网项目：智能家居项目（Smart Project Home）、Hot Link、Project Sensor 和 Vaani。这些每个项目将使用不同的技术，但它们的目标都是让消费者的家庭和设备变得智能。


    在博客中，连接设备高级副总裁 Ajit 解释了它的运作原理。这场革命已经开始，并是由之前的技术构建的，每一次革命，每一次演进。正如许多人所说的，物联网正在从根本上影响着我们所有人。


    智能家居自言易懂，旨在为用户提供自动化某些家庭基本功能所需的工具，同时为更具眼光的用户在将其融入家庭方面提供实用的灵活性。通过 Link，用户将拥有一个个人助手，弥合他们与智能设备之间的差距。随着时间的推移，Link
    将记住你的偏好，并从你的交互中学习。


    Vaani 是赋予 Mozilla 的一个新的语音界面，可以集成到第三方应用程序和处理器中。Vaani 将接收各种命令，通过语音将更具吸引力的陈述与数据连接起来。Sensor
    是一个依赖传感器数据的信息的枢纽，这些数据将所有人可用。Mozilla 将处理数据并在用户方便的时间将其呈现给用户。


    Mozilla 的许多项目仍处于非常早期阶段，不知道它们将走向何方。随着 Mozilla 并行开发 firefox 平台，看到它的新重点将我们引向何方将是非常有趣的。


    ![](img/453752f2a570e8fff106aca09a3ea2e3_6_0.png)

    ![](img/453752f2a570e8fff106aca09a3ea2e3_6_1.png)


