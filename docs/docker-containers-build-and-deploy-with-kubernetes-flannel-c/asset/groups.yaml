    integrate those projects together into operating systems that are ready for the
    most stringent enterprise environments. So, in general, I want to thank developers,
    testers, and other writers on the Red Hat Enterprise Linux Atomic, OpenShift,
    and Linux teams helping me learn on a daily basis what it takes to make Linux
    Containers ready for the enterprise.


    As for having a direct impact on the book, there are a few people from Red Hat
    I want to call out individually. First, William Henry wrote two chapters in this
    book on storage and networking. I was fortunate that he was available to write
    those critical chapters. Beyond his work, William has made significant contributions
    to Docker-related projects. In fact, William wrote dozens of command pages that
    are delivered with the Docker software itself. Having William around to participate
    in helping the development of the book was priceless as well.


    Another important contributor to this book from Red Hat is Scott Collier. Scott''s
    public contributions to the general knowledge about Docker have included blogs
    on setting up Docker and Kubernetes, as well as sharing many sample Dockerfiles
    through the Fedora Cloud initiative. For this book, Scott was generous with his
    time, helping me sort through technology and examples illustrated throughout the
    book.


    Because I wrote this book outside of work hours (which is why it took me longer
    than I had hoped), I often relied on interactions with my publisher (Pearson)
    during evenings and weekends. So, thanks to editors Chris Zahn and Elaine Wiley
    for reviewing my content, occasionally responding on Sunday nights, and compressing'
- md: '

    Finally, I''d like to thank my family. When someone writes a book he must almost,
    by necessity, neglect his family for some amount of time. I''m so proud of you
    all. Despite my drifting off to write, my son Seth managed to do a great imitation
    of Zac Efron in High School Musical by having the lead in his school play while
    also playing on his high school soccer team. My son Caleb found his niche, settling
    on his little organic farm in Maine. And my wife, Sheree, continues to amaze younger
    generations with her fitness and Spartan runs. Your love and support are what
    keeps me going.


    ## About the Author


    Chris joined Red Hat in 2008 as an RHCE instructor. For that role, he became a
    Red Hat Certified Instructor (RHCI) and Red Hat Certified Examiner (RHX). In 2014,
    Chris became a Red Hat Certified Architect (RHCA), with certifications in Virtualization
    Administration, Deployment and Systems Management, Cluster and Storage Management,
    and Server Hardening. In 2011, Chris shifted from his Linux instructor role back
    to being a full-time writer for Red Hat, which he continues to do today.


    Early in his career, Chris worked at UNIX Laboratories and AT&T Bell Labs with
    the organizations that produced the UNIX operating system. During that time, Chris
    wrote the first official UNIX System V Desktop system manual and cowrote the Guide
    to the UNIX Desktop. For eight years, Chris worked closely with developers of
    the UNIX system, from UNIX System V Release 2.0 through Release 4.2.


    ## Setting Up a Private Docker Registry


    IN THIS CHAPTER:


    - Create a private Docker registry in Fedora or Ubuntu

    - Use the docker-registry package

    - Use the registry container image

    - Understand the Docker image namespace


    One of the foundations of Docker is the ability to request to use an existing
    container image and then, if it is not already on your system, grab it from somewhere
    and download it to your system. By default, “somewhere” is the Docker Hub registry
    (https://hub.docker.com). However, there are ways to configure other locations
    from which you can pull docker images. These locations are referred to as registries.


    By setting up own private registry, you can keep your private images to yourself.
    You can also save time by pushing and pulling your images locally, instead of
    having them out over the Internet.


    Setting a private registry is simple. It requires getting the service (by installing
    a package or using the registry Docker container image), starting the service,
    and making sure the proper port is open so the service is accessible. Using registries
    requires a bit more explanation than setting up one, especially when you consider
    that features are added to Docker every day that are changing Docker uses and
    searches registries for images.


    In particular, the way that Docker uses the image namespace is changing to be
    more adaptable. If your location is disconnected from the Internet, with the Docker
    hub inaccessible, features are being developed to allow you to use a different
    default registry. Likewise, new features let you add registries to your search
    order, much the same way you can have an Internet browser look at different DNS
    servers.


    This chapter describes how to set up a private Docker registry on several different
    Linux systems. The first examples are simply to help you get a Docker registry
    up and running quickly to begin testing or how to use registries. After that,
    I describe some techniques for making a Docker registry more production ready.


    Later in the chapter, I tell you how to adapt your local Docker service uses Docker
    registries, including how to replace Docker.io as the default registry and all
    other registries to the search path.


    > NOTE

    > Having a local registry in place is not required to use this Docker. However,
    as you build, save, and reuse images throughout this book, you may find handy
    a way to store your images (especially private ones) without pushing them out
    to the public Docker Hub Registry. That said, you can skip this chapter for now
    if you want to learn more about using containers before you jump into setting
    up a Docker registry.


    ## GETTING AND STARTING A PRIVATE DOCKER REGISTRY


    You can run a Docker registry on your Linux system in a number of different ways
    to store your own Docker images. For Linux distributions that include a docker-registry
    package (such as Fedora and Red Hat Enterprise Linux), you can install that package
    and start up the service. For other distributions, you can run the official registry
    container image from Docker.io to provide the service.


    See the section later in the chapter that corresponds to the Linux system you
    are using for instructions on installing and running a Docker registry on that
    system. For Fedora, I illustrate how to use the docker-registry package, while
    for Ubuntu I show how to use the registry container.


    Here are a few general things you should know about setting up a Docker registry:


    - Install anywhere: Like most servers, the Docker registry does not need to be
    installed on client systems (that is, where you run your docker commands). You
    can install it on any Linux system that your clients can reach over a network.
    That way, multiple Docker clients can access your Docker registry.


    ## CHAPTER 3 Setting Up a Private Docker Registry


    - Open port: If your Docker registry is not on the client, you must be sure that
    TCP port 5000 is not being blocked by the firewall where the Docker registry is
    running.

    - Provide space: If you push a lot of images to your registry, space can fill
    up quickly. For the docker-registry package, stored images are contained in the
    /var/lib/docker-registry directory. Make sure you configure enough space in that
    directory to meet your needs, or you can configure a different directory, if you
    want.


    ## Setting Up a Docker Registry in Fedora


    Follow these instructions to install and start a Docker registry on a Fedora system.
    At the moment, this procedure creates a version 1 Docker registry from the docker-registry
    RPM package. Although this procedure was tested on Fedora, the same basic procedures
    should work for following Linux distributions:


    - Fedora 22 or later

    - Red Hat Enterprise Linux 7.1 or later

    - CentOS 7.1 or later


    The docker-registry package is not included in the Atomic project, RHEL, and CentOS
    distributions. So you must use the registry container, described later for setting
    up a Docker registry in Ubuntu, to get that feature on an Atomic Linux system.


    > NOTE

    > During the following procedure, you are going to use image tags to identify
    the registry where you intend to store an image. For a more in-depth look at tags,
    refer to Chapter 6, “Tagging Images.\ To get docker-registry to work, you may
    need to edit the usr/lib/system/docker-registry and remove --debug.


    1. Install docker-registry: When you install the docker-registry package in Fedora,
    it pulls in more a dozen dependent packages as well. To install those packages,
    type the following:


    ```bash

    # yum install docker-registry

    ...

    Transaction Summary ===================================

    Install 1 Package (+15 Dependent)

    Total download size: 6.8 M

    Installed size: 39 M

    Is this ok [y/N]: y

    ```


    2. List docker-registry: Use the rpm command to list the contents of the docker-registry
    package in Fedora. There are nearly 200 files (mostly python code in the package).
    This command shows you only documentation and configuration files (I describe
    how to configure them):


    ```bash

    # rpm -ql docker-registry | grep -E "(/etc) \|(/usr/share) \|(systemd)"

    /etc/sysconfig/docker-registry.yml

    /usr/lib/systemd/system/docker-registry.service

    /usr/share/doc/docker-registry/

    /usr/share/doc/docker-registry/AUTHORS

    /usr/share/doc/docker-registry/CHANGELOG.md

    /usr/share/doc/docker-registry/LICENSE

    /usr/share/doc/docker-registry/README.md

    ```


    3. Open firewall: If your Fedora is running a firewall that blocks incoming connections,
    you may need to open TCP port 5000 to access access to the registry service. Assuming
    you are using the firewall service in Fedora, run these commands to open the port
    on the firewall (immediately and permanently) and see that the port has been opened:


    ```bash

    # firewall-cmd --zone=public --add-port=5000/tcp

    # firewall-cmd --zone=public --add-port=5000/tcp --permanent

    # firewall-cmd --zone=public --list-ports

    ```


    4. Start the docker-registry service: If you want to do any special configuration
    for your docker registry, refer to the next sections before starting the service.
    For a simple docker-registry installation, you can start the service and begin
    using it, as follows (the status shows, the docker-registry service is active
    and enabled):


    ```bash

    # systemctl start docker-registry

    # systemctl enable docker-registry

    ```

    Created symlink from /etc/systemd/system/multi-user.target.wants/docker-registry.service
    to /usr/lib/systemd/system/docker-registry.service.

    # systemctl status docker-registry

    docker-registry.service - Registry server for Docker

    Loaded: loaded (/usr/lib/systemd/system/docker-registry.service; vendor preset;)

