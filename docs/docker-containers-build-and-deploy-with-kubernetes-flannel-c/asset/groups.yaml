    # 前言


    **命令行 shell**：Docker 提供了图形化界面供用户操作。然而，本书中的大多数 Docker 示例均来自 Linux 命令行 shell。熟悉如何在
    Linux shell 中进行操作，将使你使用 Docker 的工作效率变得高得多。


    **软件包**：Docker 本身是一种将软件打包并作为捆绑应用程序进行交付的机制。然而，为了构建容器镜像，大多数 Docker 基础镜像都配置为允许你从其基于的特定
    Linux 发行版安装软件包。


    例如，对于 Ubuntu 基础镜像，你应该了解如何使用 `apt-get` 等工具安装 Deb 软件包。对于 Fedora、Red Hat Enterprise
    或 CentOS 镜像，`yum`、`dnf` 和 `rpm` 命令会非常有用。当你使用这些基础镜像构建你自己的 Docker 容器时，这些镜像通常会被设置为从在线软件仓库获取你请求的软件包。了解如何在所选的
    Linux 发行版中获取和安装软件包，对于你成功使用 Docker 至关重要。


    **文件所有权与权限**：Linux 系统以及容器内的每个文件都由特定的用户和组所有，并具有某些允许访问这些文件的权限。有时，你希望从宿主机向容器内部授予文件和目录（文件夹）的访问权限。其中一些可能是特殊文件，例如应用程序运行所需的设备或套接字。进程也会以特定用户的身份运行。理解这些权限的工作原理对于确保容器正常运行至关重要。


    我只提到了有效操作 Docker 容器时需要的几个较明显的特性。在你继续探索如何充分利用以及自己创建 Docker 容器时，你还会遇到许多与其他 Linux
    相关的特性。


    如果你不熟悉 Linux，我强烈建议你参加一个课程或买一本至少提供 Linux 基础知识的书，以帮助你上手 Docker 容器。我个人的建议是读一本由本书编写的《Linux
    圣经》（Linux Bible）第九版（http://www.wiley.com/WileyCDA/WileyTitle/productCd-111899878.html）。它不仅能专门帮助你构建
    Docker 容器所需的技能，还能帮助你在开发 Docker 容器镜像时通用的在 Linux 环境中工作。


    # 本书内容


    本书旨在供初接触 Docker 容器的人士从头到尾阅读。之后，它可以作为参考资料，提醒你与 Docker 容器相关的各种选项和功能。本书分为五个部分。


    # 第一部分：容器入门


    在第一部分，你将学习开始使用 Docker 容器所需的知识。第 1 章“使用 Docker 容器化应用程序”描述了什么是容器以及它们与未容器化的应用程序有什么区别。在第
    2 章“设置容器运行时环境”中，你将学习如何在 Fedora 和 Ubuntu 等不同的通用 Linux 系统上安装 Docker，以及如何在 CoreOS
    和 Project Atomic 等专门面向容器的 Linux 系统上安装 Docker。在第 3 章“设置私有仓库”中，我们通过向你展示如何配置一个私有的
    Docker 仓库来存放你的 Docker 镜像，完成了一次基础设置。


    # 第二部分：操作单个容器


    此部分的大部分内容涉及使用 `docker` 命令直接操作单个容器。在第 4 章“运行容器镜像”中，我将向你展示如何运行第一个容器镜像。为了帮助你查找并获取镜像，第
    5 章“查找、拉取、保存和加载容器镜像”描述了如何从 Docker 仓库搜索容器镜像，然后拉取所需的镜像、将其保存为文件并加载到另一个 Docker 系统中。


    在第 6 章“标记镜像”中，你将学习如何为镜像打标签，以便更好地识别镜像包含的内容，并利用这些信息将镜像推送到仓库。在第 7 章“调查容器”中，我将向你展示如何查看
    Docker 容器或镜像内部，了解该容器或镜像的工作细节。在第 8 章“启动、停止和重启容器”中，你将学习如何停止、启动和重启容器。


    在第 9 章“配置容器存储”中，你将学习如何配置存储，主要通过将宿主机的目录挂载到容器内部。要学习如何为容器配置网络，第 10 章“配置容器网络”描述了如何配置
    Docker 服务通常使用的（或不使用的）默认网络，以及每个运行容器的人如何为单个容器设置网络接口。


    Docker 会缓存大量数据以便重复使用。在第 11 章“清理容器”中，我将向你展示如何清理创建或运行 Docker 镜像时留下的缓存。在第 12 章“构建
    Docker 镜像”中，你将学习如何构建自己的 Docker 容器，包括如何构建构建和运行高效的容器。


    # 第三部分：在云环境中运行


    在第 13 章“使用超级权限容器”中，我描述了如何运行所谓的超级权限容器（SPCs）。为了说明 SPCs 的工作原理，我将向你展示如何在 RHEL Atomic
    系统上获取几个执行不同管理任务的镜像。在第 14 章“使用 Cockpit 在云端管理容器”中，我描述了如何使用 Cockpit 网页版容器管理工具在你的云或本地环境中跨多个主机管理容器。


    # 第四部分：管理多个容器


    在这一部分，我将进入编排领域。在第 15 章“使用 Kubernetes 编排容器”中，我描述了如何在一个系统上使用 Kubernetes 主节点和节点服务来尝试
    Kubernetes。在第 16 章“创建 Kubernetes 集群”中，我将跨越一体机系统，描述如何设置一个集群。有了该集群，你就可以可以在节点的 Pod
    上部署应用程序。


    # 第五部分：开发容器


    在短段时间内，已经出现了一些提高容器构建效率的技术。在第 17 章“开发容器”中，我描述了一些开发容器的技巧。最后，在第 18 章“探索 Dockerfile”中，我向你展示我见过的各种
    Dockerfile，以说明人们是如何克服构建容器障碍的。


    所以，如果你现在准备好了，就开始阅读吧。希望你喜欢这本书！


    # 致谢


    在制作本书期间，我获得的帮助是超凡的。在我的日常工作中，我有幸能与 Red Hat 的人员直接合作，他们将 Docker、Kubernetes 和 Atomic
    等项目的优秀工作扩展并集成到适用于大多数企业环境的操作系统中。因此，来说，我要感谢 Red Hat Enterprise Linux Atomic、OpenShift
    以及 Linux 团队的开发者、测试人员和其他作者，他们每天告诉我如何让 Linux 容器企业化。


    对于对本书有直接影响的人，我想点名 Red Hat 的几个人。首先，William Henry 为本书撰写了关于存储和网络的两个章节。我很幸运他能编写这些关键章节。除了他的工作外，William
    对 Docker 相关项目做出了重大贡献。事实上，William 编写了 Docker 软件自带的几十页命令说明。让他参与并帮助本书的发展是非常贵的。


    Red Hat 的另一位重要贡献者是 Scott Collier。Scott 对 Docker 知识的公开贡献包括设置 Docker 和 Kubernetes
    的博客，以及通过 Fedora Cloud 共享许多示例 Dockerfile。对于这本书，Scott 慷慨投入时间，帮助我梳理书中贯穿的技术和示例。


    由于我是在工作时间之外编写这本书的（这也是为什么它比我预想的要长），因此我经常在晚上和周末与出版社（Pearson）互动。所以，感谢编辑 Chris Zahn
    和 Elaine Wiley 审核我的内容，偶尔在周日晚上回复并进行压缩。

    '
