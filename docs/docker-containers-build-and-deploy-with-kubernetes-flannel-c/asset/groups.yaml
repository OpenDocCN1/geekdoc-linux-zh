    access messages are simply sent to standard output (where they are picked up by
    the systemd journal and viewed by the journalctl command).

    **--max-requests 100**: Sets the maximum number of requests that a gunicorn daemon
    can accept to 100. After that, the worker is restarted.

    **--graceful-timeout 3600**: Gives the gunicorn worker 3600 seconds (6 minutes)
    to finish handling a request once it has been sent a restart signal. If it has
    not completed what it is doing by that time, it is killed.

    **--t 3600**: If the gunicorn worker is silent for more than 3600 seconds (6 minutes),
    it is killed and restarted.

    **--k gevent**: Sets the type of gunicorn worker to gevent (an asynchronous type
    worker based on Greenlets).'
