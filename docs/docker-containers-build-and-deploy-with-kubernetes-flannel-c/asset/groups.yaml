    # CHAPTER 3 Setting Up a Private Docker Registry


    # CONFIGURING A PRIVATE DOCKER REGISTRY


    The default registries that come in the docker-registry package or the registry
    container are free you just want to try out a Docker registry. If you want to
    use a registry in a production environment, however, you need a deeper understanding
    of how to configure your Docker registry to better suit your needs.


    The following sections describe how to modify the Docker registry software for
    both the docker-registry package and using the registry container.


    # Configuring the docker-registry Package


    To better understand how the docker-registry package works, start with how the
    registry is set to run by default. When the docker-registry service starts up
    in Fedora or Red Hat Enterprise Linux, it runs the gunicorn process. There is
    one main gunicorn process and four additional gunicorn workers running, by default,
    to provide the service.


    From a ps output the gunicorn processes; you can see the options for them:


    ```

    # ps -ef | grep gunicorn --access-logfile

    00:00:00 | /usr/bin/python /usr/bin/gunicorn --access-logfile

    --max-requests 100 --graceful-timeout 3600 -t 3600 -k gevent -b

    0.0.0.0:5000 -w 4 docker_registry.wsgi:application

    ```


    Here’s what you can learn from this command line:


