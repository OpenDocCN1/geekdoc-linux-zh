    Docker Hub Registry。通过这种方式，只有此特定 docker 安装的用户会在你明确包含的注册仓库中搜索镜像。


    `INSECURE_REGISTRY=''--insecure-registry''` 变量不会显式地允许或拒绝某个仓库。这是一种特定情况：用户想使用本地
    Docker 客户端从提供 HTTPS 通信的仓库拉取镜像，但客户端没有该仓库的证书来验证其真实性。取消注释该变量并在行中添加不安全仓库的名称，可以允许 docker
    命令在没有完全授权的情况下从该仓库拉取镜像。


    ```

    INSECURE_REGISTRY=''--insecure-registry myreg.example.com''

    ```


    再次，此功能以及上述描述的其他功能并不是上游 Docker 项目的一部分。但如果你你的安装需要这些功能，可以通过目前存在于 Fedora、RHEL、CentOS
    和相关 Atomic 项目中的功能，更改 Docker 默认访问注册仓库的方式。


    # 摘要


    设置私有 Docker 仓库可以让你能够在不使用公共 Docker Hub Registry 的情况下推送和拉取镜像。本章描述了为自己设置 Docker 仓库的不同方法。


    对于提供了 `docker-registry` 包的 Linux 发行版（如 Fedora 和 Red Hat Enterprise Linux），你可以安装该包并使用
    `systemctl` 命令启动 `docker-registry` 服务。作为替代方案，任何运行 Docker 服务的系统都可以拉取并运行来自 Docker
    Hub Registry 的仓库镜像，从而提供私有的 Docker 仓库。


    除了如何设置你自己的 Docker 仓库外，本章还描述了 Docker 镜像命名空间的工作原理，并以 Docker Hub Registry 为中心。对该模型的建议修改已经在
    Fedora 和其他 Red Hat 赞助的操作系统中实现，并在 Docker 社区中讨论。这些修改使用户能够更改 Docker 服务在搜索和拉取请求时设置哪些仓库。


