  md: '# Preface


    Docker is a containerization technology at the center of a new wave for building,
    packaging, and deploying applications. It has the potential to impact every aspect
    of computing, from the application development process to how applications are
    deployed and scaled up and out across massive data centers.


    Despite its great popularity, Docker is still a fairly new project, with many
    people still not really knowing exactly what Docker is. If you are one of those
    people, this book can help you take that first step, while also opening your eyes
    to the huge potential that containerization promises for you down the road. My
    goals for leading you into the world of containerization with this book can be
    summed up in these ways:


    +   **Hands-on learning:** I often say this in my books, but I believe the best
    way to learn how technology works is to get it and use it. To that end, I let
    you choose among several popular Linux systems, show you how to install Docker
    on the one you choose, and provide working examples of using Docker for everything
    from running a simple container to building and managing your own container images.
    That learning then extends into tools and techniques for orchestrating and managing
    containers.


    +   **How Docker can benefit you:** I explain the benefits of creating and running
    applications in containers, instead of installing software packages (in formats
    such as RPM or Deb) and running uncontained applications directly from your hard
    disk. Beyond running applications, I also describe how containerization can benefit
    software developers and system administrators.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Essential qualities of Docker: I describe how Docker uses technologies such
    as Linux Containers (LXC) to keep containers separate from other applications
    running on a host computer or selectively tap into the host system. These qualities
    include how Docker uses name spaces, metadata, and separate file systems to manage
    and secure containerized applications.


    To get started, you don''t need to know anything about Docker or containerization;
    you can treat this book as your introduction to Docker. However, this book is
    also intended to offer an entry into more advanced Docker-related topics, such
    as orchestration and container development.


    As you progress through the book, you see specific ways to run containers, investigate
    them, stop and start them, save them, and generally manage them. As you begin
    creating your own containers, I discuss techniques to help you make containers
    that build and run efficiently. Every step you go through build files (which are
    called Dockerfiles) that others have created to make their own containers.


    A knowledge of Linux Containers in general, or Docker containers specifically,
    is not needed to start using this book. That said, however, there are other technologies
    you will use within your Docker containers and outside those containers to work
    with them. Understanding some of those technologies will make your experience
    with Docker much more fruitful.


    # KNOWLEDGE TO HELP YOU WITH DOCKER


    To get the most out of working with Docker containers, it helps to know something
    about the operating environment in which Docker will be running. Docker is built
    on Linux technology and is specifically integrated with advanced features, including
    Linux Containers (LXC) for managing Linux name spaces and Cgroups for managing
    system resources (such as CPU and memory).


    Even your most basic interactions with Docker containers rely on underlying Linux
    technologies. You may have heard that you can run Docker on your Windows or Mac
    systems. Adding Docker to those systems always relies on your adding a Linux virtual
    machine. In other words, there are Docker containers without Linux. Likewise,
    each container itself is typically built from a base image created from a specific
    Linux distribution.


    If you have no experience working with Linux systems, you might find it useful
    to learn about some of the following aspects of Linux and related technologies:'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Preface


    **Command shell**: There are graphical interfaces available for working with Docker.
    However, most of the examples of Docker in this book are from a Linux command
    line shell. Knowing how to get around in a Linux shell makes it much more efficient
    to work with Docker.


    **Software packages**: Docker is itself a mechanism for delivering software packaged
    and delivered together as a bundled application. To build the container images
    however, most Docker base images are set up to allow you to install software packages
    from the specific Linux distribution on which they were based.


    So, for example, for an Ubuntu base image, you should understand how to install
    Deb packages with tools such as apt-get. For Fedora, Red Hat Enterprise, or CentOS
    images, the yum, dnf, and rpm commands are useful. When you use these base images
    to build your own Docker containers, those images are usually enabled to automatically
    grab the packages you request from online software repositories. Understanding
    how to get and install packages in your chosen Linux distribution is important
    for your success with Docker.


    **File ownership and permissions**: Every file in a Linux system, as well as within
    a container, is owned by a particular user and group and has certain permissions
    to allow access to those files. At times, you want to grant access to files and
    directories (folders) from the host within the container. Some of those might
    be special files, such as devices or sockets, that the application needs to run.
    Processes also run as a particular user. Understanding how those permissions work
    can be critical to getting a container working properly.


    I mentioned only a few of the more obvious features you need to work effectively
    with Docker containers. You will run into many other Linux-related features as
    you continue to explore how to make the best use of the Docker containers you
    use and create yourself.


    If you are not familiar with Linux, I strongly recommend you take a class or get
    a book that gives you at least the basics of Linux to help you getting going with
    Docker containers. My humble suggestion would be to pick up the **Linux Bible**,
    Ninth Edition, written by this author (http://www.wiley.com/WileyCDA/WileyTitle/productCd-111899878.html).
    It will not only help you specifically with the technology you need to build Docker
    containers, but will also help you to generally work in a Linux environment as
    you develop Docker container images.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# WHAT THIS BOOK COVERS


    This book is meant to be used from beginning to end by someone just starting up
    with Docker containers. Later, it can serve as reference material to remind you
    of different options and features associated with Docker containers. The book
    is organized into five parts.


    # Part I: Getting Going with Containers


    In Part I, you learn what you need to know to start working with Docker containers.
    Chapter 1, “Containerizing Applications with Docker,” describes what containers
    are and how they differ from applications that are not contained. In Chapter 2,
    “Setting Up Container Run-Time Environment,” you learn how to install Docker on
    different general-purpose Linux systems, such as Fedora and Ubuntu, as well as
    how to install Docker on specialized container-oriented Linux systems, such as
    CoreOS and Project Atomic. In Chapter 3, “Setting Up a Private Registry,” we complete
    a basic setup by showing you how to configure a private Docker registry to hold
    your Docker images.


    # Part II: Working with Individual Containers


    Most of the coverage in this part relates to using the docker command to work
    directly with individual containers. In Chapter 4, “Running Container Images,”
    I show you how to run your first container images. To help you find and get container
    images, Chapter 5, “Finding, Pulling, Saving, and Loading Container Images,” describes
    how to search for container images from the Docker registry and then pull the
    image you want, save it to a file, and load it into another Docker system.


    In Chapter 6, “Tagging Images,” you learn how to tag images, to better identify
    what the image contain and to use that information to push images to registries.
    In Chapter 7, “Investigating Containers,” I show you how to look inside a Docker
    container or image to see the details of how that container or image works. In
    Chapter 8, “Starting, Stopping, and Restarting Containers,” you learn just that—how
    to stop, start, and restart containers.


    In Chapter 9, “Configuring Container Storage,” you learn how to configure storage,
    primarily by mounting directories from the host inside your containers. To learn
    how to configure networking for containers, Chapter 10, “Configuring Container
    Networking,” describes how to configure both the default networking used (or not
    used) by the Docker service in general, as well as everyone running containers
    can set network interfaces for individual containers.'
