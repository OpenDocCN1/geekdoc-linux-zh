  md: '# Configuring the registry Container


    Instead of trying to configure the registry container image by modifying the contents
    of the running container, the creators of that container image suggest you rebuild
    the registry container image yourself. In particular, you probably want to add
    security measures to your registry and more flexible storage features.


    So far, this book has not yet introduced you to the concepts you need to build
    your own containers. However, after you become familiar with the process, if you
    decide to build a custom version 1 registry container, I recommend you refer to
    the docker-registry GitHub page:


    ```

    https://github.com/docker/docker-registry

    ```


    From the docker-registry GitHub page, you can find information on how to build
    version 1 registry image and links to the Dockerfile used to build it (https://github.com/docker/docker-registry/blob/master/Dockerfile).


    By the time you read this, Docker registry version 2 may be ready to use. Refer
    to the Docker registry 2.0 page (https://docs.docker.com/registry) for details
    on how to deploy and configure this newer version of the Docker registry.


    # UNDERSTANDING DOCKER IMAGE NAMESPACE


    Similar to the way that the Internet uses the Domain Name System (DNS) to have
    a unique set of names to refer all the host computers in the world, Docker set
    out to make a namespace to allow a unique name to every container image in the
    world. In that vision, a docker run someimage would result in the exact same image
    being pulled to the local system and, no matter where your location or what type
    of Linux system you run it on.


    For potential Docker users, this presents problems. Some Docker installations
    are disconnected from the Internet. Security requirements of others allow them
    to search and pull images only from registries that they own themselves. These
    issues would prevent a pure Docker system from being installed in their environments.


    There has been pressure to change some aspects of how the Docker image namespace
    works, so you can expect that story to evolve over time. As things stand today,
    you should know that a system running Docker purely from the upstream Docker Project
    code has the following attributes:


    +   **Search:** An unpatched Docker system today only searches the Docker Hub
    Registry when you run a docker search command.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# CHAPTER 3 Setting Up a Private Docker Registry


    +   - **Blocking registries**: Docker does not have a feature to block the Docker
    Hub Registry. Pulling an image without identifying a specific registry causes
    Docker to search for image on the Docker Hub Registry (if it''s not already on
    the local system).


    +   - **Changing the default registry**: Docker doesn''t have a feature for changing
    your default registry to anything other than the Docker Hub Registry.


    +   - **Push confirmation**: Docker does not ask you to confirm a push request
    before it begins pushing an image.


    Changes to some of these features are being discussed in the Docker community.
    Patches to change how some of these features work are included in Red Hat Enterprise
    Linux, Fedora, Atomic project, and related Linux distributions. For example, the
    current version of the docker package in RHEL Atomic (docker-l8) includes some
    of those features just mentioned.


    For example, here are some settings from the /etc/sysconfig/docker file on an
    RHEL Atomic system that represent features that have not yet been added to the
    upstream Docker Project:


    ```

    ADD_REGISTRY=''--add-registry.access.redhat.com''

    # BLOCK_REGISTRY=''--block-registry''

    # INSECURE_REGISTRY=''--insecure-registry''

    ```


    The ADD_REGISTRY variable allows you to add a registry to use for docker search
    and pull commands. For users of Red Hat distributions, this puts Red Hat''s own
    registry (registry.access.redhat.com) before the Docker Hub Registry, so the user
    can know he is searching and pulling from that registry first. A user could also
    replace that with his own registries or simply add his own registry in front of
    Red Hat''s registry.


    Using the ADD_REGISTRY variable to this file puts any registry you add at the
    front of the listed searched. However, if a requested image is not found in any
    of the registries you add, the Docker Hub Registry still is searched. To change
    that behavior, you need to use the BLOCK_REGISTRY variable.


    By setting the BLOCK_REGISTRY variable, you can block access to any registry you
    choose. Of course, at the moment only the Docker Hub Registry is searched by default.
    So, to block the Docker Hub Registry from search and pull requests, you could
    use the following line:


    ```

    BLOCK_REGISTRY=''--block-registry docker.io''

    ```


    With that, any requests for images that could not be found in registries set with
    ADD_REGISTRY variables would fail to be found, even if they existed at the'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Docker Hub Registry. In this way, only registries that you specifically included
    are searched for images by the users of this particular docker installation.


    The INSECURE_REGISTRY=''--insecure-registry'' variable does not explicitly allow
    or deny a registry. This is a specific case where someone wants to use the local
    Docker client to pull an image from a registry that provides HTTPS communication,
    but the client doesn''t have a certificate from that registry to verify its authenticity.
    Uncommenting the variable and adding the name of the insecure registry to line
    allows the docker command to pull from that registry without full authorization.


    ```

    INSECURE_REGISTRY=''--insecure-registry myreg.example.com''

    ```


    Again, this and other features just described are not part of the upstream Docker
    Project. But if you need these features for your installation, you can change
    how to access registries works by default in Docker using these features that
    are currently in Fedora, RHEL, CentOS, and related Atomic projects.


    # SUMMARY


    Setting up a private Docker registry gives you the ability to push and pull images
    without using the public Docker Hub Registry. This chapter described two different
    ways of setting up a Docker registry for yourself.


    For Linux distributions that have a docker-registry package available (such as
    Fedora and Red Hat Enterprise Linux), you can install that package and start up
    the docker-registry service using the systemctl command. As an alternative, any
    system running the Docker service can pull and run the registry image, available
    from the Docker Hub Registry, to offer a private Docker registry.


    Besides how to set up your own Docker registry, the chapter included a description
    of how the Docker image namespaces work, with the Docker Hub Registry as its centerpiece.
    Proposed modifications to that model have been implemented in Fedora and other
    Red Hat sponsored operating systems and are being discussed in the Docker community.
    These modifications give users the ability to change which registries are set
    up to be used with search and pull requests from the Docker service.'
