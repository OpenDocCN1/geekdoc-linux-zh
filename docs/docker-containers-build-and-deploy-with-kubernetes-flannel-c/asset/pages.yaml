  md: '# Setting Up a Private Docker Registry


    IN THIS CHAPTER:


    +   * Create a private Docker registry in Fedora or Ubuntu

    * Use the docker-registry package

    * Use the registry container image

    * Understand the Docker image namespace


    One of the foundations of Docker is the ability to request to use an existing
    container image and then, if it is not already on your system, grab it from somewhere
    and download it to your system. By default, “somewhere” is the Docker Hub registry
    (https://hub.docker.com). However, there are ways to configure other locations
    from which you can pull docker images. These locations are referred to as registries.


    By setting up own private registry, you can keep your private images to yourself.
    You can also save time by pushing and pulling your images locally, instead of
    having them out over the Internet.


    Setting a private registry is simple. It requires getting the service (by installing
    a package or using the registry Docker container image), starting the service,
    and making sure the proper port is open so the service is accessible. Using registries
    requires a bit more explanation than setting up one, especially when you consider
    that features are added to Docker every day that are changing Docker uses and
    searches registries for images.


    In particular, the way that Docker uses the image namespace is changing to be
    more adaptable. If your location is disconnected from the Internet, with the Docker
    hub inaccessible, features are being developed to allow you to use a different'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'default registry. Likewise, new features let you add registries to your search
    order, much the same way you can have an Internet browser look at different DNS
    servers.


    This chapter describes how to set up a private Docker registry on several different
    Linux systems. The first examples are simply to help you get a Docker registry
    up and running quickly to begin testing or how to use registries. After that,
    I describe some techniques for making a Docker registry more production ready.


    Later in the chapter, I tell you how to adapt your local Docker service uses Docker
    registries, including how to replace Docker.io as the default registry and all
    other registries to the search path.


    > NOTE

    Having a local registry in place is not required to use this Docker. However,
    as you build, save, and reuse images throughout this book, you may find handy
    a way to store your images (especially private ones) without pushing them out
    to the public Docker Hub Registry. That said, you can skip this chapter for now
    if you want to learn more about using containers before you jump into setting
    up a Docker registry.


    # GETTING AND STARTING A PRIVATE DOCKER REGISTRY


    You can run a Docker registry on your Linux system in a number of different ways
    to store your own Docker images. For Linux distributions that include a docker-registry
    package (such as Fedora and Red Hat Enterprise Linux), you can install that package
    and start up the service. For other distributions, you can run the official registry
    container image from Docker.io to provide the service.


    See the section later in the chapter that corresponds to the Linux system you
    are using for instructions on installing and running a Docker registry on that
    system. For Fedora, I illustrate how to use the docker-registry package, while
    for Ubuntu I show how to use the registry container.


    Here are a few general things you should know about setting up a Docker registry:


    +   Install anywhere: Like most servers, the Docker registry does not need to
    be installed on client systems (that is, where you run your docker commands).
    You can install it on any Linux system that your clients can reach over a network.
    That way, multiple Docker clients can access your Docker registry.'
