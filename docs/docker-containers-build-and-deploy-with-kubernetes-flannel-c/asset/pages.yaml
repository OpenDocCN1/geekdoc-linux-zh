  md: '# CHAPTER 3 Setting Up a Private Docker Registry


    # CONFIGURING A PRIVATE DOCKER REGISTRY


    The default registries that come in the docker-registry package or the registry
    container are free you just want to try out a Docker registry. If you want to
    use a registry in a production environment, however, you need a deeper understanding
    of how to configure your Docker registry to better suit your needs.


    The following sections describe how to modify the Docker registry software for
    both the docker-registry package and using the registry container.


    # Configuring the docker-registry Package


    To better understand how the docker-registry package works, start with how the
    registry is set to run by default. When the docker-registry service starts up
    in Fedora or Red Hat Enterprise Linux, it runs the gunicorn process. There is
    one main gunicorn process and four additional gunicorn workers running, by default,
    to provide the service.


    From a ps output the gunicorn processes; you can see the options for them:


    ```

    # ps -ef | grep gunicorn --access-logfile

    00:00:00 | /usr/bin/python /usr/bin/gunicorn --access-logfile

    --max-requests 100 --graceful-timeout 3600 -t 3600 -k gevent -b

    0.0.0.0:5000 -w 4 docker_registry.wsgi:application

    ```


    Here’s what you can learn from this command line:


    +   **--access-logfile**: Access to the docker-registry service is logged to any
    file you set. In this, however, the log file is set to a single hyphen (-), so
    access messages are simply sent to standard output (where they are picked up by
    the systemd journal and viewed by the journalctl command).

    **--max-requests 100**: Sets the maximum number of requests that a gunicorn daemon
    can accept to 100. After that, the worker is restarted.

    **--graceful-timeout 3600**: Gives the gunicorn worker 3600 seconds (6 minutes)
    to finish handling a request once it has been sent a restart signal. If it has
    not completed what it is doing by that time, it is killed.

    **--t 3600**: If the gunicorn worker is silent for more than 3600 seconds (6 minutes),
    it is killed and restarted.

    **--k gevent**: Sets the type of gunicorn worker to gevent (an asynchronous type
    worker based on Greenlets).'
  merge: -1
  pgno: 34
- img_proc: true
  md: '+   - **b 0.0.0.0:5000**: Sets the worker to bind on all IP addresses on the
    system (0.0.0.0) on port 5000. This allows Docker clients to connect to the Docker
    registry through any external network interface on the system via TCP port 5000.


    +   - **w 4**: Sets the number of worker processes to 4 (above the original gunicorn
    process).


    +   - **docker-registry.wsgi:application**: Runs the process with the Docker registry
    wsgi application.


    To change the behavior of the docker-registry service, you can edit the `/etc/sysconfig/docker-registry`
    file. Here is how that file is set by default in Fedora:


    ```

    # The registry configuration file

    DOCKER_REGISTRY_CONFIG=/etc/docker-registry.yml

    ```


    ```

    # The configuration to use from DOCKER_REGISTRY_CONFIG

    SETTINGS_FLAVOR=local

    ```


    ```

    # Address to bind the registry to

    REGISTRY_ADDRESS=0.0.0.0

    ```


    ```

    # Port to bind the registry to

    REGISTRY_PORT=5000

    ```


    ```

    # Number of workers to handle the connections

    GUNICORN_WORKERS=4

    ```


    In the `docker-registry` file, you can do such things as have the Docker registry
    listen only on a particular IP address (by default, REGISTRY_ADDRESS=0.0.0.0 listens
    on all addresses). You can also change the port of the service to something other
    than TCP port 5000 or set the number of `gunicorn` workers to something other
    than 4.


    The `/etc/docker-registry.yml` file is set as the Docker registry config file.
    SETTINGS_FLAVOR=local tells the config to include common variables and then set
    the directory `/var/lib/docker-registry` for local storage. In the `/etc/sysconfig/docker-registry`
    file, the common variables you can set the following:


    +   - **LOGLEVEL**: By default, the log level is set to info. This can also be
    set to debug, notice, warning, err, error, crit, alert, emerg, or panic.


    +   - **DEBUG**: Set to either true or false to have debugging on or off.


    +   - **STANDALONE**: If set to true (the default), the registry acts as a standalone
    registry and doesn''t query the Docker index.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# CHAPTER 3 Setting Up a Private Docker Registry


    +   ** INDEX_ENDPOINT**: If the local registry is not set to run in standalone,
    the default, the index endpoint is set to https://index.docker.io.


    +   ** STORAGE_REDIRECT**: By default, this is disabled.


    +   ** DISABLE_TOKEN_AUTH**: If the service is not in standalone, this variable
    is enabled to allow token authentication.


    +   ** PRIVILEGED_KEY**: By default, no privileged key is set.


    +   ** SEARCH_BACKEND**: By default, there is no search backend.


    +   ** SQLALCHEMY_INDEX_DATABASE**: By default, the SQLite backend database is
    set to: sqlite:///tmp/docker-registry.db.


    If you want to use a setting flavor than local, look in the /etc/docker-registry.yml
    file. Setting different flavors can be used for Ceph Gateway configuration, Google
    Cloud Storage configuration, OpenStack Swift Storage, and others.


    Other variables you can set can be picked up by the gunicorn process, include
    the following. Notice that some of these values show up on the gunicorn command
    line:


    +   ** GUNICORN_GRACEFUL_TIMEOUT**: Sets the timeout for gracefully restarting
    workers (in seconds).


    +   ** GUNICORN_SILENT_TIMEOUT**: Sets the timeout for restarting workers that
    have gone silent (in seconds).


    +   ** GUNICORN_USER**: Runs the gunicorn process as the user set here, instead
    of running it with root privileges.


    +   ** GUNICORN_GROUP**: Runs the gunicorn process as the group set here, instead
    of running it with root privileges.


    +   ** GUNICORN_ACCESS_LOG_FILE**: Sets the name of the log file to direct messages
    to those are related to clients trying to access the service. By default, messages
    are sent to the systemd journal through standard output.


    +   ** GUNICORN_ERROR_LOG_FILE**: Sets the name of the log file to direct messages
    to those are related to error conditions. By default, messages are sent to the
    systemd journal through standard output.


    +   ** GUNICORN_OPTS**: Identifies any extra options you want to pass to the gunicorn
    process.


    After you set or change /etc/config/docker-registry file variables, restart the
    docker-registry service for these features to take effect.'
