  md: 'Most of the data in FIGURE 5-6 is self explanatory. All times are in seconds
    in double precision accuracy. The minor fault counter seems to be broken because
    it always reports zero. The inblock and outblock counters are not interesting
    because they only refer to file system metadata for the old-style buffer cache.
    The charles counter includes all read and write data for all file descriptors,
    so you can see the file I/O rate. The lwp_count is not the current number of lwps.
    It is a count of how many lwps the process has ever had. If the count is more
    than one, then the process is multithreaded. It is possible to access each lwp
    in turn and read its psinfo and usage data. The process data is the sum of these.


    Child data is accumulated when a child process exits. The CPU used by the child
    is added into the data for the parent. This can be used to find processes that
    are forking many short-lived commands.


    # Accounting


    Who ran, when, and how much resource was used?


    Many processes have very short life spans. You cannot see such processes with
    ps, but they may be so frequent that they dominate the load on your system. The
    only way to catch them is to have the system keep a record of every process that
    has run, who ran it, what it was, when it started and ended, and how much resource
    it used. The answers come from the system accounting subsystem. While you may
    have some concerns about accounting of the “big brother is watching you” connotation
    or the cost of additional overhead, the information is important and valuable.
    The overhead of collecting accounting data is always present but insignificant.
    When you turn on accounting, you are just enabling the storage of a few bytes
    of useful data when a process exits.


    Accounting data is most useful when it is measured over a long period of time.
    This temporal information is useful on a network of workstations as well as a
    single, time-shared server. From this information, you can identify how often
    programs run, how much CPU time, I/O, and memory each program uses, and what patterns
    throughout the week do look like. To enable accounting to start immediately, enter
    the three commands below.


    ```

    # ln /etc/init.d/acct /etc/rc0.d/K22acct

    # ln /etc/init.d/acct /etc/rc2.d/S22acct

    # /etc/init.d/acct start

    Starting process accounting

    ```'
