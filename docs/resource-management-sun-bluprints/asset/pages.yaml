    are being reported, the iostat -x variant provides extended statistics and is
    easier to read because each disk is summarized on a separate line (see FIGURE
    5-8). The following values are reported: the number of transfers and kilobytes
    per second with read and write separately, the average number of commands waiting
    in the queue, the average number of commands actively processed by the drive,
    the I/O service time, and the percentages of time that commands were waiting in
    the queue, and were active on the drive.


