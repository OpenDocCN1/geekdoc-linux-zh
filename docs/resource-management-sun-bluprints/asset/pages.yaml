- img_proc: true
  md: '# CHAPTER 3


    # Policies and Controls


    To manage the resources of a system, you must be able to measure and control resource
    usage. You must also establish policies that determine the controls that are invoked
    once the available measurements are interpreted. This chapter examines various
    types of policies and controls and ways to implement them. It also looks at each
    subsystem in turn to see the resources that can be managed.


    # Policy Types


    There are many types of policies and many ways to implement them. Some of the
    main classifications are explained below. A recent draft standard defines the
    terminology of each kind of policy. That terminology has been adopted in this
    book, and the standard is summarized in this section.


    # Limits and Error Event Rules


    One of the simplest policies is to define limits on a measurement and associate
    it with an action. This is often implemented as an “if measure passes threshold
    then action” rule. Products such as the Sun Enterprise SyMon 2.0 software (referred
    hereafter as SyMon) redefine many simple limit rules and allow new rules to be
    set on any measurement. A limit can be defined as a simple rule with a single
    input measurement. It is also common to have several thresholds with a warning
    level action and a critical problem level action for the same measurement.


    An error event is different because it is treated as a discrete on/off event rather
    than a continuous variable to be compared against a limit.


    In either case, an alert is generated and logged. The alert can be transitory
    and go away when the rule is re-evaluated, or it can be persistent and require
    a user to acknowledge that it has been seen.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Complex Rules and Hierarchies


    More complex rules take several inputs and can maintain historical information
    as previous state and running averages. They can also be built out of several
    simple limit rules. A complex rule is used to establish the state of a component
    or a subsystem. When rules are combined, they are ranked so critical problems
    take precedence over warnings. A hierarchy of rules can be built for a network
    of systems so that the overall state of the network is indicated by the state
    of the system that has the worst problem. In turn, state is based on the state
    of the subsystem that has the worst problem. A rule state propagation hierarchy
    is provided as part of the Sun Enterprise SyMON 2.0 product, and many other commercial
    tools implement this mechanism.


    The policy is inherent in the set of rules that are implemented, the thresholds
    that the rules use, and the actions that occur when a rule becomes active.


    # Priority


    A relative importance level can be given to the work done by a system as part
    of a policy that prioritizes some activities over others. The Solaris Resource
    Manager product and others like it assign shares to each user according to a policy
    decided by the administrator, then accumulate the CPU usage at a per-user level
    and implement a control based on the number of shares held by each user and the
    user''s place in the hierarchy.


    An alternative approach is to specify percentages directly. The Solaris Bandwidth
    Manager software uses this mechanism to provide a way to specify policies on a
    per-network packet basis. Each packet is classified by address or protocol and
    each class is given a priority and a percentage of the total bandwidth that it
    can use.


    # Goals


    Goal-based policies are prescriptive rather than reactive. They operate at a higher
    level. A goal can be translated into a mixture of limits, priorities, and relative
    importance levels. Goals can include actions for when the goal cannot be met.


    A goal can also be thought of as a control loop, where the policy manipulates
    controls when a measurement deviates from its desired range. As described in Chapter
    3, a control loop is a complex thing to manage because its stability characteristics,
    time constant, and damping factor must be set correctly. The interaction of multiple
    inter-linked control loops can be problematic.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Goals can be expressed in several ways:


    +   - Response time goals to monitor the end user response time of a system and
    control resources so that high priority work maintains its response time goal
    by taking resources from lower priority work.

    - Throughput goals monitor the rate of consumption of a resource for long running
    jobs and control the relative priority to maintain the desired balance.

    - Deadline goals have a way of telling how far a repetitive batch job has gone
    through its work, and control resources to ensure that the entire job completes
    by a deadline. for, a payroll application must complete on time and generate the
    correct number of pay slips. A goal-based workload manager could monitor the running
    total.


    At present, automated goal-based workload management is a feature found only on
    mainframes running OS/390 software.


    # Operational Policies


    Some policies are implemented manually as part of operations management. For example,
    an availability policy can include a goal for uptime and an automatic way to measure
    and report the uptime over a period. There is no direct control in the system
    that affects uptime. It is handled by operations staff, who will reconfigure software
    to work around problems, swap out unreliable hardware, or reconfigure the system
    into a more resilient configuration if the availability goal is not being.


    In most cases, goal-based policies require manual intervention to complete the
    control loop. A measure of response time is monitored, and if its goal is not
    being met, the administrator manually varies the CPU shares, moves work from an
    overloaded system to another system, or performs a hardware upgrade.


    # Networked Security Policies


    Access to a system varies according to the role of the user. A security policy
    can prevent access to certain resources or allow designated users to manage subsystems.
    For example, the SyMon software includes access control lists for operations that
    change the state of the system, and multiple network domain views to give different
    administrative roles their own view of the resources being managed. Security and
    network-based policies can be stored in an LDAP based name service. When users
    dial into an Internet service provider, they are looked up in a RADIUS authentication
    database, which can extract a profile from an LDAP server to configure the systems
    each user is allowed to access and the Solaris Bandwidth Manager configuration
    is updated to take into account that user''s network address.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Controls


    Controls are used to limit or redirect resources.


    # Limits


    A limit prevents a resource from exceeding a preset value. Some limits are system
    wide (such as the total number of processes allowed on a system) and some operate
    on a per-user basis (such as a file system quota). Since many limits are implemented
    by the Solaris software, the action, when a limit is reached, is to return an
    error code inside the application and possibly send a signal to the process. Well-written
    applications handle the errors and catch the signals, but applications that do
    not expect to ever run into a limit misbehave or abort. During testing, it is
    a good idea to run with very tight limits and test the behavior of applications
    as they hit those limits.


    # Direct and Indirect Controls


    A direct control operates on the resource you want to control. For example, the
    Solaris Resource Manager software controls CPU usage per user by implementing
    a scheduling class that determines each user''s share of the CPU. An indirect
    control works via dependent resources. For example, to limit the I/O throughput
    of a process, it is sufficient to be able to measure the I/O throughput and limit
    the CPU resources for that process. The process could be stopped temporarily to
    prevent it from issuing read and write system calls at too high a rate. It might
    be more efficient to add a direct measurement and control capability to the code
    that read and write calls, but that is a more invasive approach that requires
    changes to the Solaris software itself.


    The Solaris Bandwidth Manager process implements a direct control on network packet
    rates. This can be used to implement an indirect control on the CPU resources
    taken up by the NFS server code in the kernel. The Solaris Resource Manager software
    cannot control NFS service directly as NFS is implemented using kernel threads
    that do not have an associated user-level process.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Standardized Policy Definitions


    The Internet draft policy framework standard by Strassner and Ellesson defines
    its scope thus:


    This document defines a set of terms that the Internet community can use to exchange
    ideas on how policy creation, administration, management, and distribution could
    work among policy servers and multiple device types.


    The terminology definitions are network oriented but apply equally well to system
    policy levels. Some of the terms defined in this standard are listed here.


    +   - Administrative Domain: A collection of network elements under the same administrative
    control and grouped together for administrative purposes.


    +   - Network Element (also called a Node): A networking device, such as a router,
    a switch, or a hub, where resource allocation decisions have to be made and the
    decisions to be enforced.


    +   - Policy: The combination of rules and services where rules define the criteria
    for resource access and usage.


    +   - Policy control: The application of rules to determine whether or not access
    to a particular resource should be granted.


    +   - Policy Object: Contains policy-related info such as policy elements and
    is carried in a request or response related to resource allocation decision.


    +   - Policy Element: Subdivision of policy objects; contains single units of
    information necessary for the evaluation of policy rules. A single policy element
    carries an user or application identification whereas another policy element may
    carry user credentials or credit card information. Examples of policy elements
    include identity of the requesting user or application, user/app credentials,
    and so on. The policy elements themselves are expected to be independent of which
    Quality of Service signaling protocol is used.


    +   - Policy Decision Point (PDP): The point where policy decisions are made.


    +   - Policy Enforcement Point (PEP): The point where the policy decisions are
    actually enforced.


    +   - Policy Ignorant Node (PIN): A network element that does not explicitly support
    policy control using the mechanisms defined in this standard.


    +   - Resource: Something of value in a network infrastructure to which rules
    or policy criteria are first applied before access is granted. Examples of resources
    include the buffers in a router and bandwidth on an interface.


    +   - Service Provider: Controls the network infrastructure and may be responsible
    for the charging and accounting of services.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# General Policy Architecture


    The general architecture shown FIGURE 3-1 illustrates one common implementation
    of a policy that combines the use of a policy repository, a PDP, and a PEP. This
    diagram is not meant to imply that these entities must be located in physically
    separate devices, nor is it meant to imply that the only protocols used for communicating
    policy are those illustrated. Rather, it simply shows one implementation containing
    the three important entities fundamental to policy: a repository, a PDP, and a
    PEP.


    | Management tool |

    | Repository client |


    Repository access protocol


    | Policy repository\n(directory server, database, etc.) |


    Repository access protocol


    | Repository client |

    | Policy Decision Point (PDP) |


    Policy protocol


    | Policy Enforcement Point (PEP) |


    FIGURE 3-1 Example Policy Architecture


    It is assumed that policy decisions will always be made in the PDP and implemented
    in the PEP. Specifically, the PEP cannot make decisions on its own. This simplifies
    the definition and modeling of policy while leaving open the possibility for a
    single device to have both a local PDP (LPDP) as well as a PEP.


    In general, the repository access protocol and the policy protocol are different
    protocols. If the policy repository is a directory, then LDAP is one example of
    a repository access protocol. However, the policy protocol can be any combination
    of COPS, SNMP, and Telnet/CLI. Given this rich diversity, a common language is
    needed to represent policy rules. The rest of the standard document describes
    the'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'terminology necessary to enable the definition of such a language and discusses
    policy is defined, manipulated, and used in the PDP and PEP. For more information,
    see the complete document at http://www.ietf.org/internet-drafts/draft-strassner-policy-terms-01.txt.


    # Subsystem Policies and Controls


    Each component and subsystem implements a set of measurements and controls that
    allows a policy to manage them.


    # User-Level Controls


    User-level controls include limits on the number of logins and limits on the resources
    used by each user.


    # Login Limits


    Solaris software implements a blanket login ban for non-root users as described
    in the nlogin(4) manual page. It also limits the total number of processes that
    can be started via the nproc kernel tunable. This feature scales with the memory
    configuration. A further limit is placed on the total number of processes per
    user using the maxproc kernel tunable. This is a single global limit. The total
    number of logins per user can also be limited. The current limit can be viewed
    with sysdef or sar. The example in FIGURE 3-2 was run on a 64 Mbyte desktop system.


    ```

    % sysdef -i | grep processes

    1002mimum number of processes (v.v_proc)

    997maximum processes per user id (v.v_maxup)

    % sar -v 1

    ```


    | proc-sz | ov | inod-sz | ov | file-sz | ov | lock-sz |

    | --- | --- | --- | --- | --- | --- | --- |

    | 18:25:12 | | | | | | |

    | 18:25:13 | 108/1002 | 0 | 4634/4634 | 0 | 495/495 | 0 | 0/0 |


    FIGURE 3-2 Determining Solaris Process Limits


    Chapter 3 Policies and Controls 25'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'When the SRM software is in use, you can view the maximum number of processes
    that can be limited on a per-user basis using the limadm command. You can view
    the current number and limit using the liminfo command, as described in Chapter
    7.


    # Application-Level Controls


    The main class of application-level controls are those provided by relational
    databases and transaction processing monitors. These consist of mainly access
    controls, but the Oracle8i database also implements controls on resource consumption
    and policies for relative importance. This is described in more detail in the
    Chapter 7.


    # CPU Power-Level Controls


    There are many ways to control CPU power. The most basic one is to physically
    change the CPU configuration itself. A faster CPU shortens the CPU-intensive component
    of response times. Additional CPUs allow more concurrent work to take place with
    a similar response time.


    Physically changing the CPU configuration requires a power down and reboot on
    many computer systems. But the Sun Enterprise Server systems allow CPU boards
    to be added and removed from a running system without powering it down or rebooting
    it. On the Starfire system, the CPUs can be partitioned into dynamic system domains,
    and a separate copy of the Solaris operating environment booted in each domain.
    CPU boards can then be moved from one dynamic system domain to another. This is
    described in detail in Chapter 8.


    With a single copy of the Solaris software, the CPUs are partitioned into processor
    sets as described in Chapter 7. Each process is bound to a processor set and constrained
    to run only on the CPUs that are members of that set. Sets are created and removed
    dynamically. If one set is overloaded, its processes cannot make use of the CPU
    power in a different set without manual intervention. Processor sets are most
    useful when there are a large number of CPUs to partition. This technique is not
    useful on a uniprocessor system.


    The SRM software also works within a single copy of the Solaris operating environment.
    Unlike sets, it has fine granularity and can be used on a uniprocessor system.
    When a system gets busy, all CPU power is used automatically. SRM works by biasing
    CPU usage on a per-user basis, using shares to determine the relative importance
    of each user.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'The kill command sends a stop signal to a process and suspends it in the same
    way typing Control-Z does in an interactive shell session. Sending a start signal
    lets the process continue. Stopping and starting processes in this way can control
    the concurrency of CPU-bound jobs on a system.


    The Load Share Facility (LSF) software is described in detail in Chapter 10. LSF
    software implements a distributed batch queueing system when jobs are submitted
    and, resources are available, sent to run on a system. LSF software implements
    its own set of policies and controls.


    # Disk I/O Policies


    Access controls via file permissions and access control lists (ACLs) control who
    can read and write to a file system.


    Currently, no direct measures or controls of the rate at which a process is a
    file system exist. The only information provided for each process is the total
    read plus write data rate. Block input and output counters are not incremented
    correctly in current releases of the Solaris operating environment. The block
    counter problem is filed bug1141605 and is fixed in the next release of Solaris
    software. This data is not made available by the standard commands; it is part
    of the "usage" structure that includes microstate accounting as described in Chapter
    5.


    Because the Solaris software does not have any direct measures or controls, additional
    application-specific information is required (such as configuring the location
    of data files manually) to implement policies.


    # Disk Space


    See Chapter 6 for a description of the disk quota system. Disk quotas are currently
    implemented separately on each file system type. They are available on the UFS
    file system and remote mounts of UFS via NFS only. Other file system types either
    have no quota system or have a separately administered implementation.


    # Virtual Memory


    An application consumes virtual memory when it requests memory from the operating
    system, and the memory is allocated from a central pool of resources. Virtual
    memory usage, however, is not directly related to physical memory usage because
    not all virtual memory has physical memory associated with it. If an'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'application requests 16 Mbytes from the operating system, the operating system
    will create 16 Mbytes of memory within application''s address space, but will
    not allocate physical memory to it until memory is read from or written to.


    When you restrict or control the amount of virtual memory that an application
    can have, you are not controlling the amount of RAM that application can have.
    Rather you are implementing a policy limit on the maximum amount of virtual address
    space that process can have. This is an important difference because the limit
    is enforced when the application first requests memory while it is using. When
    the application hits the limit, it will probably fail because extends its requests
    to extend its virtual address space will fail. This may be what you want if the
    application is likely to impact higher priority work. But careful testing and
    debugging is required to make applications recover gracefully from memory allocation
    failures.


    Virtual memory can be limited at the system level and at the process level. At
    a system level, the total amount of virtual memory available is equal to the total
    amount of swap space available. Each time virtual memory is used, the amount of
    swap space drops by the same amount. If one application requests a large amount
    of virtual memory (for example, malloc (1 Gbyte), there is potential for that
    to exhaust the system-wide swap space, which will cause other applications to
    fail when they request memory.


    You can use resource management of virtual memory to prevent a single process
    from growing too large and consuming all virtual memory resources by limiting
    the maximum amount of memory that a process or group of processes can use. This
    can be useful in two cases: to prevent any one user from using all of the available
    swap space (a denial of service attack) and to prevent a runaway process or leaking
    process from consuming all of the swap space.


    Base Solaris software can do simple resource management of a process''s virtual
    memory usage. The limits information described in Chapter 6 can be used to limit
    the maximum amount of virtual memory used by a process. Limits are enforced per
    process, preventing any one process from using an unreasonably large amount of
    virtual memory. But a user can run many processes, so this does not prevent denial
    of service attacks.


    The SRM software has a mechanism that can limit the maximum amount of virtual
    memory per user. This implements a similar limits policy as the per-process limit
    built into the Solaris operating environment, but it can be used to limit a user,
    regardless of how many processes are running. FIGURE 3-3 shows the three levels
    of virtual memory that can be controlled.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_60_0.png)


    FIGURE 3-3 Three Levels of Virtual Memory Limits


    # # Relationship Between Virtual Memory and Swap Space


    Note that the amount of swap space used by a user does not correlate directly
    to the sum of all that user''s processes. A user may have three processes, where
    each shares a single shared memory segment mapped among them. Each process has
    the shared memory segment mapped to its address space, but swap space is only
    accounted for once within these processes. For example, three users each have
    one Gbyte shared global area mapped to their address space, but each incremental
    user is not consuming an additional 1 Gbyte of swap from the system-wide pool.
    They use three Gbytes of virtual memory space, but only one Gbyte of swap space.


    It is important to factor this in when using products like SRM software to control
    a user''s virtual memory usage. The virtual memory accounted for by the SRM software
    is different from the amount of swap space used by the user. Since we are trying
    to control virtual memory in an attempt to prevent a single user from consuming
    all of the swap space, we must take care to apply the correct virtual memory limit
    policy. This sometimes makes it extremely difficult to control swap usage with
    SRM software, but the right parameters provide adequate control in most environments.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_61_0.png)


    FIGURE 3-4 Swap Usage Only Accounts for Shared Segments Once


    In the example illustrated in FIGURE 3-3 and FIGURE 3-4, the SRM software is configured
    to limit the virtual memory to 1.012 GBytes, which allows all three processes
    to execute normally. If one of the three processes has a memory leak, the limit
    would be hit for that user, affecting only the processes owned by that user. The
    disadvantage is that if the user starts another process, the same limit is reached.
    The per-user limits must take into account the number of processes each user is
    expected to run.


    # # Physical Memory


    Resource Management of physical memory means defining policies and controlling
    the amount of RAM that is allocated to different workloads. In contrast to the
    virtual memory limit policies, physical memory is controlled by applying importance
    policies to different types of memory. In the future, it may be possible to limit
    or allocation style policies to physical memory, but that capability is not available
    in the Solaris operating environment today.


    The physical memory management system in the Solaris operating environment can
    implement different policies for different memory types. By default, the memory
    management system applies an equal importance policy to different memory subsystems,
    which sometimes results in unwanted behavior. Before we look at the policies,
    let''s take a quick look at the different consumers of memory.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'The most important consumers of memory in the Solaris operating environment
    are:


    +   - Kernel memory, used to run the operating system

    - Process memory, allocated to processes and applications

    - System V shared memory, allocated by the shared memory subsystem for applications
    such as databases

    - Memory used for file system caching


    # The Default Memory Allocation Policy


    Memory in the Solaris operating environment is, by default, allocated on a demand
    basis with equal importance to each subsystem. When a subsystem requests memory,
    it is allocated from a central pool of free memory. If sufficient memory is available
    in the free pool, then an application''s request is granted. If free memory is
    insufficient, memory is taken from other subsystems to satisfy the request. The
    equal-importance policy means that the application with the most aggressive memory
    requests gets the majority of the memory assigned to it. For example, suppose
    a starts starts netscape process that uses 20 Mabytes of memory. Memory is taken
    from the free pool and allocated to the netscape process. When the user starts
    a gimp image editor tool, if there is no memory in the free pool, then memory
    will be taken from the netscape browser and allocated to the gimp image editor
    tool. The Solaris memory allocation policy takes into account recent usage in
    an attempt to choose the correct application from which to steal memory, but the
    usage history is very short (less than one minute) in most circumstances.


    FIGURE 3-5 shows an example where the memory allocated to the netscape process
    is reduced when the gimp process is started.


    ![](img/52144374747884a32fdddbed4e8cd9d7_62_0.png)


    FIGURE 3-5 Memory Allocation with netscape and gimp'
