    FIGURE 6-2 Per Shell Current and Hard Limits (Continued)


    Let us examine the capabilities of each limit in turn. They exist in this form
    for historical reasons and have several limitations.


    # CPU Time


    The maximum CPU time specified in total CPU seconds can be specified. Any process
    reaching this limit is sent a SIGXCPU signal, and will terminate with a core dump
    unless it catches the signal.


    # File Size


    The maximum size in bytes of any single file can be specified. Any process reaching
    this limit is sent a SIGFSZ signal, and will terminate with a core dump unless
    it catches the signal.


    # Data Size and Stack Size


    The maximum size in bytes of the data segment of a process can be specified. If
    this limit is reached, a call to malloc will fail and the process may terminate.
    A stack size overun causes a segmentation violation and a core dump. The hard
    limits for data size and stack size vary according to the hardware architecture
    of the system.


    # Core Dump Size


    This sets the maximum size of a core dump. It can be set to zero if core dumps
    are unwanted and there is a danger that they may accumulate and fill up the disk.
    It also takes some time to write the core dump to disk, so it is quicker to recover
    from a failed application such as a web browser that needs and to be restarted.'
  merge: -1
