  md: '# Network Measurements


    The way network measurements can and should be made depends on the objective of
    the measurement. Do you want to manage the overall health of a network link? Are
    you interested in the TCP/IP statistics of your server? Do you want to know how
    much bandwidth is used by a specific application? Each of these can be answered
    if the right tools and techniques are used to do the measuring.


    # Network Throughput


    Using SNMP counters is a good way to get an overall view of network throughput.
    The Solaris software provides an SNMP daemon which provides the data you need.
    If your host is managed by the SymMon software, you can browse the SNMP counters
    through the SymMon GUI, and it is very easy to graph network throughput by combining
    some of these counters in a simple formula. For example, to get a graph depicting
    how much percent of the (half duplex) network segment is busy, use the following
    formula:


    ```

    ((ifInOctets + ifOutOctets) / time_interval) / ifSpeed) * 100

    ```


    Most networking devices support SNMP, and the SymMon software can incorporate
    any third-party MIBs so all links from a switch can be monitored at the same time.


    Besides the SymMon software, many other commercial and free applications and utilities
    manage SNMP devices. One example of an excellent free utility is MRTG and can
    be downloaded from http://ee-staff.ethz.ch/~oetik/webtools/rtrg/rtrg.html.


    # Ethernet Statistics


    Traditionally, administrators have used collisions as an indicator of network
    health for Ethernet networks. Collisions are reported using netstat with the -i
    flag.


    doghouse$ netstat -i

    Name Mtu Net/Det Address Ipkts Ierr Opkts Oerrs Collis Queue

    lo 8232 loopback localhost 40986 0 40986 0 0 0

    hme0 1500 doghouse doghouse 128128305 0 125004514 0 77754 0'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'The collision rate (Collis / Opkts) * 100%. In our case, that is less than
    a tenth of a percent. Collisions are absolutely normal and should cause no concern
    unless collision rates become very high (in the order of 10 to 20 percent or higher).
    If you have high collision rates, check the total bandwidth utilization on your
    network link.


    Today, more and more switched and full duplex Ethernet networks are deployed.
    In these environments, there are no collisions since each port on the switch has
    its own dedicated bandwidth, and hosts can send packets whenever they want. If
    a switch gets overloaded, it drops packets that it cannot process fast enough.
    Dropped packets must be retransmitted by the sender.


    Netstat has an undocumented option that is invoked with the -k flag. It will dump
    a lot of statistics that are kept in kernel structures (the kstats). You can look
    at for example the statistics from the hme card as:


    ```

    doghouse% netstat -k hme0

