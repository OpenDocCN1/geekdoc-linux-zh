    # Internet Service Provider Workloads


    The Internet provides a challenge for managing computing systems. Instead of a
    small population of known users who can connect to a server system, millions of
    users can connect to any server that is on the Internet. External synchronizing
    events can cause a tidal wave of users to arrive at the server at the same time,
    as shown in these examples.


    +   Sports-related web sites in the USA get a peak load during key games in the
    "March madness" college basketball season. In general, any television or news
    media event may advertise a URL to which users can connect, and cause a spike
    in activity.


    +   In countries where local phone calls are charged by the minute, the onset
    of cheap rate calls at 6:00 p.m. each day causes a big spike in the number of
    dial-in connections at an ISP, creating a major load on the local servers at that
    time.'
