- img_proc: true
  md: '# Load Sharing Facility Software


    The Load Sharing Facility (LSF) software enables you to execute batch and interactive
    jobs on a pool of networked computers. The Sun Microsystems High Performance Computing
    (HPC) package includes LSF as a vehicle for launching parallel applications on
    an HPC cluster. Besides batch jobs, LSF also provides load balancing by determining
    which computer possesses the optimum resources to run the jobs.


    This chapter explains how to deploy LSF resource management tool and how it interoperates
    with other Solaris resource management controls.


    # When to Use LSF


    LSF is part of the Sun HPC foundation package and is required as a job starter
    to launch parallel applications within an HPC cluster environment. In most cases,
    an HPC supercomputer is composed of computers dedicated to running complex tasks
    that require supercomputer speeds. In these instances, all the resource management
    of the cluster is performed through LSF and other HPC tools. However, there may
    be environments, such as universities, where not all the CPUs in an HPC cluster
    are always dedicated to highly compute intensive applications. In these environments,
    resource management controls before LSF can be deployed, such as the SRM software
    and Solaris processor sets.


    LSF software may also be obtained directly from Platform Computing Corporation
    (www.platform.com) and run independent of Sun''s HPC software. In this environment,
    the LSF software creates its own cluster of computers independent of the Sun HPC
    software. LSF clusters are created so batch jobs can be launched on the least
    busy computers in the cluster that contains sufficient resources to run them.
    The LSF cluster can consist of a collection of both servers and workstations.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'Workstations are typically used by interactive users who usually do not keep
    the CPU 100 percent of the time. This results in a lot of cycles going to waste.
    By deploying an LSF cluster, the unused CPU cycles in a network of high performance
    workstations and servers can be harnessed to do productive work. The LSF software
    can also be used in conjunction with other Solaris resource management controls
    as the SRM software and processor sets to create an environment that can provide
    a predictable level of service to both interactive and batch users.


    #  Workload Candidates for LSF Software


    A typical environment where the LSF software is useful is where numerous compute-intensive
    jobs must be run on a limited number of computers with some jobs having higher
    priority than others. In this environment, a compute server farm is constructed
    of high end Sun Enterprise servers to which batch jobs are dispatched. Additionally,
    engineering workstations can be added to the server farm during non-working hours
    to take advantage of unused CPU cycles.


    An example would be regression tests run during the ASIC microprocessor design
    process. In this scenario, there is the activity of building a model of the ASIC,
    adding new functionality to the model, and performing functions against the model.
    Once new functionality is added to the ASIC model a slew of regression tests needs
    to be run over existing functions continue to work properly. Because of the complexity
    of ASICs, regression tests can number in the thousands. Since testing new functionality
    is more important than running regression tests, these batch jobs must be granted
    a higher priority.


    Another type of workload where the LSF software is applicable is running complex
    analysis applications, where the application has been parallelized using the industry
    standard Message Passing Interface (MPI) library. An example would be the design
    of an airframe where complex structural analysis must be performed. Techniques
    such as Finite Element Analysis (FEA) are typically employed to create a model
    of the airframe, then stress forces are applied to the model. Since the analysis
    can be broken up into smaller pieces which can run in parallel on different computers,
    creating a cluster of compute servers by deploying the Sun HPC software that includes
    the LSF software, makes sense.


    # LSF-Aware Applications


    Workloads that use applications that are LSF aware can also benefit by deploying
    the LSF software. Platform Computing provides some applications that are LSF aware.
    These applications contact the LSF software to locate the best host to run on.
    Two examples are: Lmake and Lnamed.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'The smoke application is a version of GNU make that performs parallel makes.
    This application is useful in reducing the total build time of software projects
    by distributing compilations to multiple computers.


    The Lnamed application can be used to load balance DNS lookup requests. The DNS
    lookup will be dispatched to the least busy DNS server, thus reducing the chance
    that one server will become overloaded with lookup requests.


    For applications other than Platform Computing provides, you can write a wrapper
    that makes calls to the LSF software. An example of where a wrapper could be beneficial
    is the execution of a CGI script used on a web server. Instead of having the CGI
    script always run on the same server, the wrapper would call LSF and execute the
    script on the least busy server that contains the appropriate resources.


    # Commercial Applications


    Many batch jobs that run on mainframes require processing being performed in a
    well defined sequence. The output from one part of the process is used as the
    input for the next. An example of this is a program that extracts data from a
    database and then sorts it. A subsequent program takes the sorted data and performs
    an analysis on it. In this, it is important that the second program doesn''t start
    until the first process is complete. While LSF can track job dependencies, many
    customers choose another batch management system to run their commercial applications
    such as Platinum''s AutoSys, which provides a GUI for designing complex flows.


    Many companies deploy mission critical ERP packages such as SAP R/3 to help run
    their business. These ERP packages typically have their own scheduler to run batch
    jobs. These schedulers do not interoperate with the LSF software. Likewise, a
    single Sun Enterprise server primarily used to run Oracle applications, would
    use the Oracle application''s batch job facility and not the LSF software. Customers
    who de\u00ire to run all their batch jobs under the control of a single scheduler,
    might choose to deploy Platinum''s AutoSys. Alternatively, Platform can provide
    specific integrations, where needed.


    # Relationship to Other Solaris Resource Control Features


    This section discusses the relationship between the LSF software and other Solaris
    resource control features.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Base Solaris Software


    Batch jobs are launched by LSF run as user processes in the timesharing scheduling
    class. As such, the priority of these jobs run can be adjusted using the Solaris
    nice( ) command. However, it is not necessary to assign different nice levels
    to batch jobs, since batch jobs can be placed in different priority batch queues.
    The LSF software launches the batch job based on its batch queue priority and
    can suspend a running job if a higher priority job is waiting or if the batch
    job is using more than its allocated resources. The LSF software does not implement
    its own scheduling class like the SRM software. The scheduling of LSF batch jobs
    is performed at a level higher than the operating system schedulers.


    The LSF software deploys its own process monitoring agents that track the resources
    being used by the running batch job. This is a separate process that collects
    performance data over time, such as given by Solaris ps and vmstat commands. Thresholds
    on CPU and memory usage are set in the LSF software for each batch job. If the
    thresholds are exceeded or the system activity is too high, the running batch
    job will be suspended. The job is restarted when there are sufficient system resources
    or another batch job has reached its resource usage threshold.


    Solaris processor sets may be used in conjunction with the LSF software, but care
    must be taken to avoid unwanted effects. The LSF software provides a facility
    for running a script before and after a batch job. The batch job can be confined
    to run on a particular processor set by specifying the parset command in the start
    script. However, this is a manual process since the current version of the LSF
    software has no awareness that processor sets are being used on a particular host.
    Likewise, the LSF monitoring process has no knowledge of processor sets, so it
    will assume all the CPU cycles on the host are available for running batch jobs.
    This could cause a batch job to be started on a less than optimum host. Platform


    Computing is currently working on processor set features for the next release
    of the LSF software.


    The Solaris software provides a batch scheduler cron, which can be invoked using
    the at command. In a limited fashion, the LSF features can be duplicated using
    a combination of cron and shell scripts. You can write a script that checks the
    CPU load on hosts in a network, then launches batch jobs on the least busy hosts.
    However, trying to monitor running jobs and prioritizing jobs will be very difficult.
    Unlike the LSF software, which maintains multiple batch queues for jobs of different
    priorities, cron only provides a single batch queue. Since the LSF software has
    no way to manage the cron batch queue, it is not advisable to launch batch jobs
    with both the LSF software and cron on the same computer.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Solaris Resource Manager Software


    The SRM software provides the capability of limiting resource consumption of processes
    based on the user running that. Since batch jobs launched by the LSF software
    can be run as specific users, the LSF software batch jobs can be controlled by
    the SRM software. In this scenario, the jobs launched by the LSF software would
    run as a particular user, for example, called batch. The user would then be granted
    a certain number of SRM shares. Using this method, batch jobs are not allowed
    to consume all the resources of a host. Therefore, interactive users are not penalized,
    having batch jobs run on the same computer, since they are always guaranteed a
    certain level of resources.


    Unlike interactive processor sets, which do not allow consumption of unused CPU
    cycles by processes not bound to a particular processor set, the SRM software
    allows batch jobs to use whatever unused CPU cycles are available. If interactive
    users are active on the computer, they can reclaim their share of resources. The
    result is that the batch jobs take longer to complete. However, since batch jobs
    are guaranteed a certain share of the computer''s resources, a predictable maximum
    time to complete can be established and be part of a SLA. The upside here is that
    on interactive usage, the batch jobs can run faster than the time specified in
    the SLA.


    There is one caveat with running the LSF software on computers under SRM control.
    The monitor process of the LSF software cannot predict the level of resources
    that will later be available on a host. If there are two hosts to choose from,
    the LSF software will normally choose the least busy one to launch a batch job
    on. If, the batch job is running, interactive usage picks up substantially on
    the host and drops on a host that was not chosen to run the batch job, optimum
    results will not be achieved. The LSF software has the ability to terminate a
    job on one host, restart it on another one, but this is not always desirable.
    Even though the optimum host was not chosen, the batch job will still get its
    percentage of the computer''s resources as determined by its SRM shares.


    # Dynamic System Domains


    Each Sun Enterprise 10000 domain looks like a separate host to the LSF software.
    Therefore, the LSF software treats domains as separate hosts and applies whatever
    LSF policies are established for them.


    # Dynamic Reconfiguration


    The LSF software maintains both static and dynamic information about hosts in
    an LSF cluster. If a Sun Enterprise 10000 is dynamically reconfigured, the static
    parameters that the LSF software must be manually updated.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Other Third-Party Batch Management Systems


    Some applications like SAP have a facility for scheduling and running batch jobs.
    Running end of month ERP reports, for example, can be scheduled and controlled
    by SAP software. While the LSF software can coexist with other batch management
    systems, avoiding scheduling conflicts. For example, if ERP reports are to be
    the last day of each month using the SAP batch facility, write the LSF policy
    for that host so as not to conflict with the anticipated load on that host during
    that time.


    # LSF Resource Management Viewpoint


    The LSF software has a clusterpoint of resource management. It is essentially
    unaware of other resource controls which may be implemented on the hosts that
    make up the LSF cluster. The LSF software assumes that all the resources within
    its cluster are at its disposal. Network bandwidth is not a major concern of the
    LSF software since the batch jobs it controls do not generate network traffic
    and neither does the monitoring or management of jobs running on execution hosts.


    In the Sun HPC environment, a high speed interconnect is used for message passing
    between hosts running parallel applications. Since this is a dedicated channel,
    resource control of the traffic on the interconnect is not required.


    # LSF Cluster Viewpoint


    The term cluster is widely used to describe a configuration of computers in a
    network that some how share resources. In LSF terminology, a cluster is a federation
    of computers, each running LSF software. There are no special hardware configuration
    requirements except that the computers are networked together and running TCP/IP.


    There are no special software dependencies as long as all the systems in the cluster
    are running one of the supported operating systems. File sharing between the systems
    is recommended, but not required. Running a directory service such as NIS makes
    things easier, but again, is not a requirement.


    To create an LSF cluster, the LSF software must be loaded on each computer and
    a configuration file modified to reflect the cluster''s available resources. The
    role of the master host is determined automatically by the LSF software, so no
    manual configuration is required.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# # LSF Functions


    The LSF software provides a full range of resource management functions. You can
    establish policies for where and when batch jobs can be run. Monitoring processes
    are put in place to control the amount of resources consumed by batch jobs. After
    batch jobs are run, information about job resource usage, number of jobs run,
    and on is recorded for later workload analysis and department charge back.


    # # Establishing Policies


    The LSF software provides a number of controls that can be used to establish resource
    management policies. These controls include: setting job priorities, establishing
    scheduling policies, setting limits on job slots, and setting user permissions.


    # # Job Priorities


    Each LSF batch queue has a priority number. The LSF software tries to start jobs
    from the highest priority queue first. Within each queue, jobs are dispatched
    in a first come, first served order, unless a fairshare scheduling policy has
    been established.


    Jobs can be dispatched out of turn if pre-execution conditions are not met, specific
    hosts or resources are busy or unavailable, or a user has reached the user job
    slot limit. To prevent overloading any host, the LSF software waits for a configured
    number of dispatch intervals before sending another job to the same host.


    # # Scheduling Policies


    The LSF software provides several resource controls to prioritize the order in
    which batch jobs are run. Batch jobs can be scheduled to run on a first-come-first-served
    basis, fair sharing between all batch jobs, and preemptive scheduling where a
    high priority job can bump a lower priority job that is currently running. Other
    policies include deadline constraint and backfill of resources reserved for large
    jobs that are not yet ready to run.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'Note - The fairshare scheduling the LSF software uses should not be confused
    with the scheduling class implemented by the Solaris Resource Manager software.
    The LSF software is implemented on top of the Solaris timeshareing scheduling
    class and only manages jobs submitted to LSF batch queues. The SRM software provides
    fairshare scheduling for all jobs running on a Solaris system.


    # Fairshare in Queues


    Fairshare scheduling is an alternative to the default first, first served scheduling.
    Fairshare scheduling divides the power of the LSF cluster among users and groups
    to provide fair access to resources for all jobs in a queue. The LSF software
    allows fairshare policies to be defined at the queue level so that different queues
    can have different sharing policies.


    The main purpose of LSF fairshare scheduling is to prevent a single user from
    using up the available job slots, locking out other users.


    # Fairshare in Host Partitions


    Host partitions provide fairshare policy at the host level. Unlike queue level
    fairshare, a host partition provides fairshare of resources on a group of hosts,
    and it applies to all queues that use hosts in the host partition. Fairshare scheduling
    at the level of queues and host partitions are mutually exclusive.


    # Hierarchical Fairshare


    Hierarchical fairshare allows resources to be allocated to users in a hierarchical
    manner. Groups of users can collectively be allocated a share, and that share
    can be further subdivided and given to subgroups, resulting in a share tree. Note
    that LSF shares are not related to SRM shares.


    # Preemptive Scheduling


    Preemptive scheduling allows the LSF administrator to configure job queues so
    that a high priority job can preempt a low priority running job by suspending
    the low priority job. This is useful to ensure that long running low priority
    jobs do not hold resources while high priority jobs are waiting for a job slot.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Exclusive Scheduling


    Exclusive scheduling makes it possible to run exclusive jobs on a host. A job
    only runs exclusively if it is submitted to an exclusive queue. An exclusive job
    runs by itself on a host. The LSF software does not send any other jobs to the
    host until the exclusive job completes.


    # Processor Reservation and Backfilling


    Processor reservation and backfilling ensure that large parallel jobs are able
    to run without under-utilizing resources.


    There might be delays in the execution of parallel jobs when they are competing
    with sequential jobs for resources. This is because as job slots become available,
    they are used in smaller numbers by sequential jobs. This results in the larger
    number of job slots required by a parallel application never becoming available
    at any given instant. Processor reservation allows job slots to be reserved for
    a parallel job until enough are available to start the job. When a job slot is
    reserved for a job, it is unavailable to other jobs.


    Backfilling is the execution of a job that is short enough to fit into the time
    slot during which the processors are reserved, allowing more efficient use of
    available resources. Short jobs are said to backfill processors reserved for large
    jobs.


    # Job Slot Limits


    A job slot is the basic unit of processor allocation in the LSF software. A sequential
    job uses one slot whereas a parallel job that has N components, uses N job slots,
    which can span multiple hosts. A job slot can be used by a maximum of one job.
    A job slot limit restricts the number of job slots that can be used at any one
    time. Each LSF host, queue, and user can have a slot limit.


    Job slot limits are used by queues when deciding whether a particular job belonging
    to a user should be started on a specific host. Depending on whether or not preemptive
    scheduling policy has been configured for individual queues, each queue can have
    a different method of counting jobs toward a slot limit.


    # Resource Controls


    Determination of where to run particular jobs is often based on the resources
    required by the job and the availability of those resources. The following section
    explains what those resources are.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Resources Based on Location


    After an LSF cluster is created, an inventory of all resources in the cluster
    is taken, so jobs will know the best place to run. Resources can be classified
    by location into two categories:


    +   - Host-based resources

    - Shared resources


    # Host-Based Resources


    Host based resources are resources that are not shared among hosts, but tied to
    individual hosts. An application must run on that host to access such resources.
    Examples are CPU, memory, and swap space. Using these resources on one host does
    not affect the operation of another host.


    # Shared Resources


    A shared resource is a resource that is not tied to a specific host, but is associated
    with the entire cluster, or a specific subset of hosts within the cluster. Examples
    of shared resources include:


    +   - floating licenses for software packages

    - disk space on a file server which is mounted by several machines

    - the physical network connecting the hosts


    An application may use a shared resource by running on any host from which that
    resource is accessible. For example, in a cluster in which each host has a local
    disk, but can also access a disk on a file server, the disk on the file server
    is a shared resource and the local disk is a host-based resource. There will be
    one value for the entire cluster that measures the utilization of shared resources,
    but each host based resource is measured separately.


    # Resources Based on Type


    Resources can also be categorized as dynamic and static.'
  merge: -1
  pgno: 289
- img_proc: true
