- img_proc: true
  md: '# File Descriptors


    To increase the default number of file descriptors per process, you can set the
    kernels rlim_fd_cur and rlim_fd_max in /etc/system.


    The definition of FILE for the stdio library can handle only 256 open files at
    most, but raw read/write will work above that. The select system call uses a fixedsizefield
    that can only cope with 1024 file descriptors; the alternative is to use poll,
    which has no limit.


    It is dangerous to set rlim_fd_cur to more than 256. Programs that need more file
    descriptors should either call setlimit directly or have their own limit in a
    wrapper script. If you need to use many file descriptors to open a large number
    of sockets or other raw files, it is best to force all of them to file descriptors
    numbered above 256. This lets system functions as name services, which depend
    upon stdio file operations, continue to operate using the low-numbered file descriptors.


    Programs compiled in the 64-bit execution using the Solaris operating environment
    do not have the above limitations. The definition of FILE is opaque and has no
    practical limit on open files. The definition of the select bitfield is increased
    to 65536 bits.


    # Memory Size


    This limit operates on the total size of the process address space. It can be
    used to prevent leaky processes from growing to consume all of the swap space,
    but it has no effect on real resident memory usage. This is due to a fundamental
    limitation of the Solaris operating environment. We understand that it would be
    very useful to be able to control real physical memory usage per process, but
    it requires a substantial rewrite of the way Solaris software handles virtual
    memory.


    # Disk Quotas


    The Solaris disk quota system is based directly on the Berkeley UNIX quota system
    developed many years ago. It provides limits on the total size of the files owned
    by a user on a UFS file system, and the total number of files. There is a soft
    limit that causes warnings to be printed out, and a hard limit that cannot be
    exceeded. After a grace period the soft limit is also enforced, and the user must
    free enough space to go below the soft limit again to reset this timer.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'When UFS file system is exported over NFS, the quotas of the underlying file
    system are inherited by the NFS mount, and quotas work in basically the same way
    as they would on a local UFS disk. This is not true for other file systems such
    as Veritas VxFS, which provides its own local quota system, which is not integrated
    into the NFS export mechanism in the current release.


    Quotas are set up using the edquota (1M) command. A user can view quotas using
    the quota (1M) command. By default quotas are displayed when the user logs into
    the system.


    In practice, quotas are not used very often. The mere threat of imposing quotas
    on a disk that is being overused is an effective way to motivate users to clear
    up their directory spaces.


    When large numbers of uncontrolled users share a large system, it is a good idea
    to set up disk quotas from the beginning. Two environments where this is important
    are the home directories of university student populations and internet service
    providers that provide space for home pages, and charge more for extra space.


    SRM is based on the ShareII product from Softway. ShareII contains its own disk
    quota functionality, but this was not carried over into SRM. The thinking was
    that a more general quota mechanism is needed, one that works across all file
    system types. Rather than introduce a new mechanism in SRM and change it again
    in a future release, it was decided to just make a single change.'
  merge: -1
