  md: 'The TS scheduler is configured by altering the dispatcher table that controls
    how process priorities are decayed. The TS scheduler uses a variable time quantum
    and adjusts process priorities as their time quantum expires. You can see the
    existing dispatcher table with the dispadmin command.


    # # Time Sharing Dispatcher Configuration

    RES=1000


    | ts_quantum | ts_tgexp | ts_slpret | ts_maxwait | ts_lwait | PRIOR LEVEL |

    | --- | --- | --- | --- | --- | --- |

    | 200 | 0 | 50 | 0 | 50 | # 0 |

    | 200 | 0 | 50 | 0 | 50 | # 1 |

    | 200 | 0 | 50 | 0 | 50 | # 2 |

    | 200 | 0 | 50 | 0 | 50 | # 3 |

    | 200 | 0 | 50 | 0 | 50 | # 4 |

    | 40 | 44 | 58 | 0 | 59 | # 54 |

    | 40 | 45 | 58 | 0 | 59 | # 55 |

    | 40 | 46 | 58 | 0 | 59 | # 56 |

    | 40 | 47 | 58 | 0 | 59 | # 57 |

    | 40 | 48 | 58 | 0 | 59 | # 58 |

    | 20 | 49 | 59 | 32000 | 59 | # 59 |


    (snip)


    Process priorities are shown by the priority levels, which range from 0 through
    99. The highest priority process (represented as 59) gets the most amount of CPU.
    A process starts with a normal priority inherited from its parent in the middle
    of the table. If the process uses its time quantum (each represented by ts_quantum),
    it will be decayed to the priority in the ts_tgexp column. A process that has
    no CPU will have its priority raised to ts_lwait. A process that has awakened
    after sleeping for an I/O will have its priority set to ts_slpret.


    # Decay Algorithms


    If you were to use a fixed priority scheduler with no decaying of process priorities,
    a higher priority process would always get as much CPU as it wanted and block
    all other lower priority processes from receiving any CPU. (The Solaris RT scheduler
    works this way.) The decay algorithm prevents any process from hogging all of
    the CPU by decrementing its priority once it receives its allocation of CPU. This
    provides a fair allocation of CPU resources to each process, based on its priority.
    The amount of CPU allocated to each process can be influenced by the nice value
    between -19 and +19. The nice value is added to the process priority as it is
    scheduled. It allows one process to receive more CPU than another, but because
    of the decay model, it will not completely block other processes.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'The table-based decay algorithms used in the Solaris software provide a flexible
    framework where the scheduler can be tuned for different workloads. The scheduler
    also replaces the BSD style scheduler''s notion of a simple decay that does not
    use a table to calculate process priorities.


    # Comparison to BSD Style Priority Decay


    The BSD UNIX scheduler decays the priority of each process by multiplying its
    priority by a fixed decay factor at a regular interval:


    ```

    process_pri = 0.66 * process_pri + nice_factor

    ```


    We can compare what would happen if we varied the decay factor. At one end of
    the range, we could set the decay factor to 0.9 (slow decay), which would mean
    we almost have fixed processes. This would cause a high priority to stay at a
    high priority for a long time and allow a process to monopolize the CPU and starve
    others processes. At the other end of the range, we could decay process priorities
    very fast using a decay factor of 0.1. This would prevent monopolization but would
    cause all processes to receive similar amounts of CPU regardless of their nice
    factor. It would also allow a user who runs a large number of processes to get
    a large and unfair amount of CPU.


    ![](img/52144374747884a32fdddbed4e8cd9d7_197_0.png)


    FIGURE 7-13 Effect of Decay Time on Allocation Fairness


    # Usage Decay and Process Priority Decay


    The SRM scheduler has two different notions of decay that affect processes: one
    is the usage decay and the other is the process priority decay. This happens because
    the SRM software is implemented with two schedulers, the user scheduler and the
    process scheduler, each with its own set of parameters. The user scheduler calculates
    and attempts to bias users so that each receive their share of allocated CPU according
    to the amount of shares allocated to them. The process scheduler sits underneath
    the user scheduler and manages fine-grained allocation of CPU to each process
    by using a BSD style decay model.'
  merge: -1
  pgno: 197
