    # Changing the User Scheduler Run Rate


    The scheduler run rate is the frequency at which the user scheduler is run to
    summarize process usage per user. It is four seconds by default. The CPU overhead
    of doing this is minimal, and there is little reduction in overhead by slowing
    down the scheduler run rate. Do not change the default of four seconds.


    # Changing the Scheduler Quantum


    The scheduler is configured by default for a time quantum of 11 ticks, with which
    the default system clock rate of 100Hz, is 110ms. The scheduler quantum can be
    changed, and ideally should not be a divisor of the system clock (100) to prevent
    possible beat effects with the per-second process scheduler and the per-4-second'
