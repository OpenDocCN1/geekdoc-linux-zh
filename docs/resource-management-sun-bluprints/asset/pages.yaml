    Fast tapes now match the performance impact of disks. We recently ran a tape benchmark
    to see if there were any scalability or throughput limits in the Solaris software,
    and we were pleased to find that the only real limit is the speed of the tape
    drives. The final result was a backup rate of an Oracle database at 1 terabyte/hour
    or about 350 Mbytes/s, which was as fast as the disk subsystem we had configured
    perform. To sustain this rate, we used every accessible tape drive, including
    24 StorageTek Redwood tape transports, which run at around 15 Mbytes/s we ran
    this using the Solaris 2.5.1 operating environment, but there are no measurements
    of tape drive throughput in the Solaris 2.5.1 release. Tape metrics were added
    to the Solaris 2.6 release, and you can see the tape drive that is active, the
    throughput, transfer size, and service time for each tape drive.


    Tapes are instrumented in the same way as disks; they appear in sar and iostat
    automatically. Tape read/write operations are instrumented with all the measures
    that are used for disks. Rewind and scan/seek are omitted from the service time.


    The output format and options of sar(1) are fixed by the generic UNIX standard
    SVID3, but the format and options for iostat can be changed. In the Solaris 2.6
    release, existing iostat options are unchanged. Apart from extra entries that
    appear for tape drives and NFS mount points, anyone storing iostat data from a
    mixture of Solaris 2.x systems will get a consistent format. New options that
    extend iostat are as follows:


    +   -E full error statistics

    -e error summary statistics

    -n disk name and NFS mount point translation, extended service time

    -M Mbytes/s instead of Kbytes/s

    -P partitions only

