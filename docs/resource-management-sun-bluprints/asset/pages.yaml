- img_proc: true
  md: '# A Simple Form of Batch Management


    You can create a simple hierarchy to control the environment in which batch jobs
    are run. To do this, add an extra layer in the hierarchy to divide the computational
    requirements of online and batch using the limadm command:


    ```

    # limadm set sgroup=root online

    # limadm set sgroup=root batch

    # limadm set cpu.shares=20 online

    # limadm set cpu.shares=1 batch

    # limadm set sgroup=online chuck

    # limadm set sgroup=online mark

    ```


    In the example above, the limadm command was used to create a new leaf in the
    hierarchy for online and batch, and put Chuck and Mark into the online group.


    ![](img/52144374747884a32fdddbed4e8cd9d7_182_0.png)


    FIGURE 7-3 Creating Online and Batch Shares with Solaris Resource Manager Software


    By using the described hierarchy, you can ensure that the online users get their
    share of the processor resource. Without any further changes, both Chuck and Mark
    will have access to 20 times the processing resource than batch because their'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'userid''s map to inodes that are under the online Node. You must, however,
    ensure that the batch processes run against the batch Node. To do this simply
    start the batch jobs under the batch userid.


    ```

    # srmuser batch /export/database/bin/batchjob

    ```


    For further information on batch management and batch management tools, see Chapter
    4.


    # Consolidation


    Since SRM software is a key component of batch management, we will discuss how
    SRM can be used to implement portions of workload consolidation.


    The SRM software allows system resources to be allocated at a system-wide level,
    sometimes in proportion with business arrangements of machine allocation between
    departments. An additional layer in the SRM hierarchy is used to achieve this.


    ![](img/52144374747884a32fdddbed4e8cd9d7_183_0.png)'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# A Multi User Workload Example


    A simple example is to split a single machine into two separate share groups,
    for example, BATCH and ONLINE. Using the simple batch/online example, we can allocate
    different shares to each of these two different workloads. In this example, 5
    shares were given to batch, and 95 shares were given to online. The actual total
    number of shares is arbitrary, but in this example they total 100 to like percentages.
    Given that batch and online have different shares on the machine, the scheduler
    can now allocate depending on two things: the share apportioned to that workload
    and the amount of free CPU available.


    Note that the workload depends on both items, rather than just its share. On a
    machine that is 100 percent busy, our example will allocate 5 percent of the resource
    to the batch workload. However, on a machine that is not 100 percent busy more
    CPU can be allocated to batch without affecting any other workload. This gives
    the effect of soft-partitioning, where a workload can be constrained to a maximum
    (for example 5 percent), but can use more if more is available. FIGURE 7-5 shows
    our example using OLTP application (TS) mode.


    # OLTP Application


    ![](img/52144374747884a32fdddbed4e8cd9d7_184_0.png)


    +   - TS-Online (tpm)

    "- TS-Batch (tph)

    "- SRM-Online (tpm)

    "- SRM-Batch (tph)"


    FIGURE 7-5 OLTP Application Using SRM to Separate Batch and Interactive Users


    Chapter 7 Solaris Resource Manager Software 153'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'The OLTP application has a batch and interactive portion, each of which typically
    has some sort of impact on their respective throughputs. FIGURE 7-5 shows the
    batch and interactive curves for both timeshare and using the SRM software. Looking
    at the batch timeshare workload, note that the CPU is not 100 percent busy, batch
    is free to consume CPU as it requires. When the CPU becomes 100 percent utilized
    (at about 192 users), we see the effect of soft partitioning. As demand for CPU
    increases, the online users see totally different effects with and without share.
    Online throughput and performance drops off dramatically without the SRM software,
    but with the SRM software, batch is limited to 5 percent, and will not affect
    the throughput of the interactive workload.


    # Databases


    Databases are typically configured as "black boxes" when used with SRM, and SRM
    is used to manage the amount of CPU given to each instance of the database. Some
    of the database vendors offer resource management features, which are discussed
    in more detail in "Database Workloads" on page 71.


    Note that the SRM scheduler does impose a small system scheduling overhead, which
    may need to be taken into account. Most database measurements done to date reflect
    an overhead of less than 5 percent. However different workloads behave in different
    ways and may show different results.


    # SRM and Preemption Control


    Oracle8 implements preemption control to cpu allow high-end scalability. Preemption
    control is an interface between the Oracle kernel and the Solaris scheduler that
    allows Oracle to provide hints to the scheduler to prevent the Solaris software
    from stopping process execution at critical times. For example, with no hints
    the Solaris scheduler could schedule a thread just after it has acquired a row
    latch in the database, holding up all other processes until that process is rescheduled.
    To avoid this problem, Oracle can tell the Solaris scheduler that it''s holding
    a critical resource and should not stop running, and if possible, the process
    will be allowed to run until it gives up its context.


    The Solaris Resource Manager 1.0 software needs a patch to support preemption
    control. Note that there are some performance implications of running Oracle8i
    without the preemtion control patch. Refer to Sun RFE 4223677 for further information.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Managing NFS


    The Network File System (NFS) runs as kernel threads, and uses the kernel scheduling
    class SYS. This means scheduling allocation for NFS is not managed by the SRM
    SHR class, and hence no CPU resource control of NFS is possible.


    However, NFS can be controlled by using network port resource management. For
    example, the Sun Bandwidth Allocator product can control the number of NFS packets
    on the server. In some cases, NFS can also be managed by limiting the number of
    CPUs available in the system class with processor sets.


    # Managing Web Servers


    The SRM software can manage resources on web servers by controlling the amount
    of CPU and virtual memory. Three basic topologies are used on systems hosting
    web servers.


    # Resource Management of a Consolidated Web Server


    A single web server can be managed by controlling the amount of resources that
    the entire web server can use. This is useful in an environment where a web server
    is being consolidated with other workloads. This most basic form of resource management
    prevents other workloads from affecting the performance of the web server and
    vice versa.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_187_0.png)


    FIGURE 7-6 Managing Resources on a Consolidated Web Server


    In Figure 7-6, the web server is allocated 20 shares. This means that it is guaranteed
    at least 20 percent of the processor resources if the database places excessive
    demands on the processor.


    In addition, if a CGI-BIN process in the web server runs out of control with a
    memory leak, the entire system will not run out of swap space. Only the web server
    will be affected.


    # Fine Grained Resource Management of a Single Web Server


    Often resource management is needed to control the behavior within a single web
    server. For example, a single web server can be shared among many users, with
    each running their own CGI-BIN programs.


    An error in a CGI-BIN program could cause the entire web server to run slowly.
    In case of a memory leak, could even bring down the web server. To prevent this
    from happening, use the per-process limits.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '| Web Server | /usr/lib/httpd |

    |---|---|

    | cpu.shares=20 shares | Web Server, httpd |

    | memory=50 Mbytes | limited to 5 Mbytes of virtual memory |

    | process.memory=5 Mbytes | |

    | | /cgi-bin/form.pl |

    | | CGI-BIN perl program limited to 5 Mbytes of virtual memory |

    | | /cgi-bin/lookup.sh |

    | | Shell program limited to 5 Mbytes of virtual memory |


    FIGURE 7-7 Fine Grained Resource Management of a Single Web Server


    # Resource Management of Multiple Virtual Web Servers


    Single machines are often used to host multiple virtual web servers In such cases,
    there are multiple instances of the httpd web server. There is also greater opportunity
    to exploit resource control using the SRM software.


    Each web server can run as a different UNIX userid by setting a parameter in the
    web server configuration file. This effectively attaches each web server to a
    different Inode in the SRM hierarchy.'
  merge: -1
  pgno: 188
