    # FIGURE 7-16 Process Priority Decay with Two Different nice Values


    You can see how a process''s sharepri is decayed every second using the priority
    decay factor. Now let''s look at how process sharepri is increased. The sharepri
    for each process is increased at the same time according to the amount of CPU
    that it has used, just as we saw with the BSD scheduler equation. The SHR scheduler
    includes a user usage factor that is derived from the user scheduler shown in
    FIGURE 7-14. This is how the SHR scheduler implements the notion of user based
    scheduling rather than just process-based scheduling. At each second, the scheduler
    manipulates the sharepri of each process by the following:


    ```

    sharepri = sharepri * decay_factor + users_usage_factor

    ```


