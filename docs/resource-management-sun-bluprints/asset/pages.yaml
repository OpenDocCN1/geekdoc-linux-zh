    # The Solaris 2.5 Trace Capability


    UNIX systems have a kernel trace capability for many years. It was designed for
    development and debugging, not for end users. The production kernel is normally
    built without the trace capability for performance reasons. One of the first production
    kernels including tracing was IBM''s AI kernel for the RS/6000 servers. They left
    it during early releases to assist in debugging, then decided that tracing was
    useful enough to pay its way, and the overhead was low. So it is now a permanent
    feature. Sun also recognized the value of trace information but decided to extend
    the trace capability to make it more useful and implement it alongside the existing
    kernel system. It was introduced in the Solaris 2.5 operating environment and
    consists of the following features.


    +   * A self-describing trace output format, called Trace Normal Form (TNF), data
    structures to be embedded in the trace file without the need for an external definition
    of their types and contents.

    * A set of libraries allows user-level programs to generate trace. In particular,
    this trace data helps analyze and debug multithreaded applications.


    Chapter 5 Workload Measurements 107'
