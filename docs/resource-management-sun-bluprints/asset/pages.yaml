  md: '# Sun Enterprise SyMON 2.0 Software


    The Sun Enterprise SyMON 2.0 (SyMON) software was developed by Sun to act as a
    user interface to hardware features. It is a powerful and extensible system and
    network monitoring platform that is used to manage other products. The Solstice
    SyMON 1.x software was a Motif based system monitor for a single machine. The
    Sun Enterprise SyMON 2.0 software is a Java based monitor with multiple user consoles
    that can monitor multiple systems using the secure extensions to SNMPv2 to communicate
    over the network.


    # When to Use SyMON Software


    The SyMON software is good at monitoring many systems and large complex hardware
    configurations. It has knowledge about possible hardware error conditions embedded
    in it, and can be used to browse details of the configuration.


    # SyMON Software Availability and Support


    Solstice SyMON 1.x was included for free with the Solaris operating environment
    as part of the Sun Computer Systems server bundle. The SyMON software will also
    be free when it is used to monitor and control a single server at a time, an extra
    license must be purchased. SyMON software can also be used to manage any number
    of generic SNMP devices without additional licensing. SyMON software supports
    Solaris 2.5.1, Solaris 2.6, and Solaris 7 operating environments running on the
    sun4d and sun4 architectures. This includes the SPARCCenter™ 2000 and SPARCserver™1000,
    and most UltraSPARC™ based systems. It will not monitor sun4m based SPARCstation™
    5, 10 or 20 systems. It is not currently supported on the Sun Enterprise 10000,
    as the hardware configuration is far more complex and requires special support
    that is currently being developed for shipment later in 1999.'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'SyMON software can be downloaded from the Sun web site at

    http://www.sun.com/symon


    # SyMON Software Architecture


    The overall architecture is shown in FIGURE 12-1. Multiple Java-based GUIs can
    be

    installed to allow several administrators to use the system at the same time.
    The

    GUIs, which can be installed on a Solaris system or a Microsoft Windows or

    Windows NT system, can communicate using Java RMI calls to a central server

    process that is partly written in Java, but includes other Solaris processes to

    perform some functions, must run on a Solaris system. The SyMON server

    process talks to SyMON agent processes and other generic devices using the Simple

    Network Management Protocol (SNMP). When talking to a system that is managed

    by SyMON agent, the enhanced SNMPv2 protocol is used with secure

    authentication from the GUI to the system being managed. Other tools can obtain

    data from a SyMON agent via SNMP.


