  md: '+   - Proxy caching web servers sit between a large number of users and the
    Internet and funnel all activity through the cache. They are used in corporate
    intranets and at ISPs. When all the users are active at once, regardless of where
    they are connecting to, these proxy cache servers get very busy.


    On the other hand, many web sites get little or no activity most of the time.
    It is too expensive to dedicate a single computer system to each web site, so
    a single system is sometimes known as virtual hosting. From a user perspective
    it is not possible to tell that accesses to the different web sites are going
    to the same physical system. If one of the virtual web sites becomes very busy,
    the performance of accesses to all the other virtual sites can be affected, and
    resource management tools are needed to help maintain a fair quality of service
    for all the sites.


    This section looks at three case studies: a proxy web cache workload, virtual
    web hosting, and a content provider site.


    # Proxy Web Cache Workload


    A caching server acts as an invisible intermediary between a client browser and
    the servers that provide content. It cuts down on overall network traffic and
    provides administrative control over web traffic routing. Performance requirements
    are quite different from those for a regular web server. After discovering the
    issues, we''ll look at several metrics that must be collected and analyzed to
    determine the workload mix and the management of resources.


    We start by remembering the caching principle of temporal and spacial locality.
    In the case of a web cache, cacheable objects are always separate and always read
    in their entirety with no prefetching. The proxy cache mostly works by using temporal
    locality. If cached items are read more than once by different users in a short
    time interval, the cache will work well. If every user reads completely different
    pages, the cache will just get in the way. If one user rereads the same pages,
    the proxy server cache won''t be used effectively.


    Not all web content is cacheable. Some of the busiest traffic is dynamic by nature,
    and caching it would prevent the browser from seeing an update.


    # Cache Effectiveness


    Caches commonly have a hit rate of about 20 to 30 percent, with only 60 percent
    of the data being cacheable. That figure does not take into account the size of
    each access—just the total number of accesses. Each cache transaction takes some
    time to complete and adds significant latency to the connection. In other words,
    the cache slows down end users significantly, and only a small proportion of the
    data'
  merge: -1
