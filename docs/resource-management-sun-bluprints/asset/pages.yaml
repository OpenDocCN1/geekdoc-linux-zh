  md: '# ASCII Format


    An accounting agent collects accounting information, and outputs it in ASCII format
    which can be accepted by a billing system.


    ![](img/52144374747884a32fdddbed4e8cd9d7_276_0.png)


    **FIGURE 9-10** Solaris Bandwidth Manager Converts Accounting Information to ASCII


    Accounting data includes details such as sender and receiver IP addresses, packet
    and byte counts, time-stamps, and application port numbers. Thus both Internet
    service providers and enterprise customers can choose from a variety of charging
    parameters including time-of-day, bandwidth usage, application usage, traffic
    class, and so on. Accounting data also provides the base for billing for advanced
    QoS-enabled IP services such as premium charging for premium CoS.


    # NetFlow


    NetFlow support is built into the Solaris Bandwidth Manager software. NetFlow
    technology, developed by Cisco Systems, allows the collecting and processing of
