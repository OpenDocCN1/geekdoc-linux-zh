- img_proc: true
  md: 'DSD for the Solaris 7 release. Over time, the Solaris 2.5.1 DSD will shrink
    away and its resources will migrate into the other DSDs. Applications will also
    migrate into the Solaris 7 DSD. The key benefit here is that all happens under
    software control, using a single system footprint in the data center. DSDs are
    described in detail Chapter 8.


    Use the Solaris Resource Manager or the Solaris Bandwidth Manager software or
    processor sets to control applications within a single copy of the Solaris operating
    environment.


    A consolidated system runs a mixture of workloads. You have to choose relevant
    processes and aggregate to measure them. The remainder is overhead or unplanned
    activity. If it is significant, it should be investigated. Break down network
    workloads so well as you know which applications are generating the network traffic.


    There is a common set of measurements to collect per workload.


    +   - Number of processes and number of users

    - End user response times for a selection of operations

    - User and System CPU usage

    - Real and virtual memory usage and paging rates

    - I/O rates to disk and network devices

    - Microstate wait timers to see which resources are bottlenecks


    To actually perform workload aggregation you have to match patterns in the data.


    +   - match processes on user name

    - match processes on command name and arguments

    - match system accounting data using user and command name

    - match network packets on port number and protocol


    You usually have to assign disks and file systems to workloads manually. Dealing
    with shared memory, libraries, and code make RAM breakdown hard.


    When you are accumulating measurements don''t accumulate the `ps` command CPU.
    It''s a decayed average of recent CPU usage, not an accurate measure of actual
    CPU usage over interval. You need to measure the actual process CPU time in each
    interval by taking the difference of two measurements. There is more detail on
    the available measurements and what they mean in Chapter 5.'
