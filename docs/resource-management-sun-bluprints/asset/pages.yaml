- img_proc: true
  md: '# When to Use Solaris Bandwidth Manager


    Without any form of bandwidth management, it is difficult to maintain a network
    that has predictable performance characteristics. Nevertheless, this is how most
    networks are run today. Network usage is estimated or modeled, and then enough
    bandwidth is configured to achieve respectable latencies. Enough is a relative
    term, it could mean that there will always be sufficient bandwidth for all applications
    that would possibly need it, or it could that the network is oversubscribed, knowing
    that on average a certain percentage of users is actually using the network. When
    new applications are deployed, or existing applications become more popular, links
    become congested and start slow application performance, until the network gets
    upgraded. For many customer environments, this is a completely acceptable way
    to maintain network resources. New technologies such as switched networking equipment
    and gigabit ethernet have rapidly become available at continuously decreasing
    prices.


    Deploying any type of QoS solution is no magical fix to a bandwidth shortage on
    the network, and the term Quality of Service is subjective. When the network is
    overloaded, bandwidth management software can help determine which network traffic
    to penalize more in respect to other (more important) traffic. If the network
    is not oversubscribed, then deploying bandwidth management might be a title exercise,
    since there is no network bandwidth shortage to begin with.


    However, many networks are oversubscribed, and critical network services might
    be affected during peak loads on the network. The Solaris Bandwidth Manager software
    can help define which network services are more important than others, and set
    priorities and bandwidth percentages to enforce them so these services are not
    negatively impacted by other, less important traffic on the network.


    In addition, the Solaris Bandwidth Manager software can be used for billing based
    on network usage. Clients who pay more can be offered a larger piece of the network
    bandwidth.


    # Relationship to Other Resource Management Products


    The Solaris Bandwidth Manager software can be used along other resource management
    products to offer additional control over the available resources. Examples are:'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# # Where to Deploy Solaris Bandwidth Manager


    Typically, the Solaris Bandwidth Manager software is deployed at the edge of the
    network. There are two ways to configure the Solaris Bandwidth Manager software
    in the network: on a host which originates network traffic (server mode), or in
    front of a router at a network choke point (IP-transparent mode).


    # # Server Mode


    In Server Mode, bandwidth originating from a given server can be managed. The
    Solaris Bandwidth Manager software sits as a STREAMS module directly in the path
    of incoming and outgoing network traffic, between TCP/IP and the network card
    device driver.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_266_0.png)


    **FIGURE 9-5** Server Mode


    When the network interface is initialized (usually at system boot time), the Solaris
    Bandwidth Manager policy agent reads the configuration file and loads the configuration
    information into the ipqos module. The ipqos module then processes all traffic
    according to the configured definitions.


    The advantage of running in Server Mode is that by being on the same machine as
    the traffic generating application, the Solaris Bandwidth Manager software can
    take better advantage of application specific requirements for allocating network
    bandwidth.


    # # IP-Transparent Mode


    This mode is called IP-transparent because the host running the Solaris Bandwidth
    Manager software is completely transparent to the IP network and is perceived
    as just another machine connected to the LAN. The LAN and the WAN behave as though
    they are directly connected through the router only. It is not necessary to modify
    the routing tables.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_267_0.png)


    FIGURE 9-5 IP-Transparent Mode


    The advantage of running in this mode is that bandwidth can be managed completely
    transparently, usually at locations in the network topology where there is a network
    choke point. This is often the connection from a LAN to a WAN.


    Other alternatives are to run the Solaris Bandwidth Manager software on the same
    host as the firewall. Packets can be classified before encryption takes place
    (after it is much harder to do packet classification).'
  merge: -1
  pgno: 267
