    disk r/s w/s Kr/s Kw/s len res_svc_t %ut q res_t svc_t %ut

    c0t2d0s0 0.0 0.2 0.0 1.2 0.00 0.02 0.02 0 00 22.87 22.87 0

    03:43:00----------------------wait queue-------

    disk r/s w/s Kr/s Kw/s len res_svc_t %ut q res_t svc_t %ut

    c0t2d0s0 0.0 3.2 0.0 23.1 0.00 0.01 0.01 0 0.72 225.45 16.20 5

    ```


    > FIGURE 5-12 SE-Based Rewrite of iostat to Show Service Time Correctly


    The Solaris 2.6 disk instrumentation is complete and accurate. Now that it has
    been extended to tapes, partitions, and client NFS mount points, there is much
    more done with it.


    # Understanding Resource Utilization Characteristics


    One important characteristic of complex I/O subsystems is that the utilization
    measure can be confusing. When a simple system reaches 100 percent busy, it has
    also reached its maximum throughput. This is because only one thing is being processed
    at a time in the I/O device. When the device being monitored is an NFS server,
    hardware RAID subsystem, or a striped volume, it is clearly a much more complex
    situation. All of these can process many requests in parallel.


    114 Resource Management'
  merge: -1
  pgno: 145
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_146_0.png)


    IOs waiting in device driver $Q_{wait}$ $R_{wait}$ $U_{wait}$


    I/O being sent to device $S_{wait}$


    I/Os active in device $Q_{run}$ $R_{run}$ $U_{run}$


    I/O being serviced by M devices $S_{run}$


    **5-13  Complex I/O Device Queue Model**


    As long as a single I/O is being serviced at all times, the utilization is reported
    as 100 percent. This makes sense because it means that the pool of devices is
    always doing something. However, there is enough capacity for additional I/Os
    to be serviced in parallel. Compared to a simple device, the service time for
    each I/O is the same, but the queue is being drained more quickly so the average
    queue length and response time is less, and the peak throughput is more. In effect,
    the load on each disk is divided by the number of disks, so the underlying utilization
    is U/M. The approximated model for response time in this case changes that response
    time stays lower for longer, but it still heads for infinity at a true 100 percent
    utilization.


    ```

    $R_{wait} = \text{average wait response time prediction} = iostat \ wsc\_t = \frac{S_{wait}}{1
    - (B_{wait}/M)}$

    ```


    ```

    $R_{run} = \text{average run queue response time prediction} = iostat \ asvc\_t
    = \frac{S_{run}}{1 - (B_{run}/M)}$

    ```


    In practice, some other effects come into play. The drives optimize head movement,
    so as the queue gets longer, the average service time decreases, since it is more
    likely that there is a block nearby to make a shorter seek. In this increases
    throughput more than traditional simple queueing models would predict.'
  merge: -1
