  md: '# Priority Paging—Memory Policy by Importance


    The Solaris feature priority paging prevents the file system from consuming much
    memory. Priority paging implements a memory policy with different importance factors
    for different memory types. Application memory is allocated at a higher priority
    than file system memory thus preventing the file system from stealing memory from
    other applications. Priority paging is implemented in the Solaris 7 operating
    environment, but it must be enabled with an /etc/system parameter as follows:


    ```

    * /etc/system file

    * set priority_paging=1

    ```


    With priority paging with the Solaris 2.6 release, use kernel patch 105181-13;
    with the Solaris 2.5.1 release, use kernel patch 103640-26 or higher.


    With priority paging enabled, the memory system behaves differently. In example,
    rather than shrinking Netscape from 30 Mbytes, the system limits the amount of
    memory that is allocated to the file system. FIGURE 3-7 shows how both netscape
    and dtmail can exist on the same system, while the size of the file system cache
    is held to a reasonable limit.


    | OS, CDE, etc (23 Mbytes) | OS, CDE, etc (23 Mbytes) |

    |---|---|n| netscape (30 Mbytes) | netscape (30 Mbytes) |

    | | dtmail (4 Mbytes) |

    | | /var/mail file sys (5 Mbytes) |

    | Free Memory 10 Mbytes | Free Memory 1 Mbytes |


    FIGURE 3-7 Memory allocation policy with Priority Paging Enabled


    The new memory allocation policy can be extremely important for larger systems,
    where memory paging problems cannot be resolved by adding additional memory. A
    large database system with a 50 Gbyte+ database on the file system will continuously
    put memory pressure on the database application with the default'
  merge: -1
