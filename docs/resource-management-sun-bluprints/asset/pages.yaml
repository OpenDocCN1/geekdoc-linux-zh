    # # Limits


    The sysdef -i command shows the default limits, listing the values in hexadecimal,
    as shown in FIGURE 6-1. The shell commands limit or ulimit show the default limits,
    as shown in FIGURE 6-2.


    ```

    % sysdef -i

    ...

    Soft:Hard Resource

    Infinity:Infinity cpu time

    Infinity:Infinity file size

    1fefe000:1fefe000 heap size

    800000: ff00000 stack size

    Infinity:Infinity core file size

    40: 400 file descriptors

    Infinity:Infinity mapped memory

    ```


    FIGURE 6-1 Example Systemwide Resource Limits Shown by sysdef


    ```

    % limit

    cputputime unlimited

    filesize unlimited

    datasize 2097148 kbytes

    stacksize 8192 kbytes

    coreduumps 0 kbytes

    descriptors 64

    memoryize unlimited

    % limit -h

    ```


    FIGURE 6-2 Per Shell Current and Hard Limits'
