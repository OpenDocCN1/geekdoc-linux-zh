- img_proc: true
  md: '# Establishing Resource Plans and Policies


    Resources are allocated to users based on a plan specified by the database administrator.
    User sessions and groups of user sessions are assigned to resource consumer groups.
    Resource consumer groups are separate from user roles. This separation allows
    one user to have different sessions assigned to different resource consumer groups.
    An overall resource plan defining how resources are distributed among the different
    resource consumer groups. Subplans allow the further subdivision of CPU resources
    within a resource consumer group. Up to eight levels of resource allocation can
    be defined. Levels allow the further subdivision of CPU resources between resource
    consumer groups. Levels specify both consumer group allocation limits and distribution
    of unused resources. Subplans and levels can be used together. These capabilities
    allow simple, yet powerful allocation policies to be implemented for database
    resources.


    # Oracle Database Resource Manager Functionality


    Let us look at the example of Company XYZ that sells widgets directly to customers
    over the Internet. To ensure optimum performance for customers placing orders,
    80 percent of the CPU is allocated to service customer orders. The remainder of
    the CPU resource is divided between the processing required to ship the widgets
    and bill for them. To implement this resource policy, the following plan is created.


    TABLE 4-3 Company XYZ Resource Plan

    | Resource Consumer Groups | CPU Resource Allocations |

    |---|---|n| Web Based Order Entry | 80% |

    | Shipping | 15% |

    | Billing | 5% |


    The Company XYZ resource plan can be refined by specifying how resources are allocated
    between different classes of customers or how resources are allocated within a
    resource consumer group. Company XYZ categorizes its customers into two groups
    based on their purchase volume: premium and standard. To ensure a higher level
    of service for premium customers, the company creates an order entry subplan.
    The order entry subplan dictates how resources allocated to the order entry resources'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# TABLE 4-4 Order Entry Subplan


    | Resource Groups | CPU Resource Allocations |

    |---|---|

    | Premium Customers | 60% |

    | Standard Customers | 40% |


    Using a subplan is different from creating two different order entry resource
    consumer groups in the primary plan. If that were done, any resources allocated
    but not used by the standard customers would be distributed across all the other
    resource consumer groups. With the order entry subplan, resources unused by the
    standard customers are made available to the premium customers before making them
    available to other resource consumer groups. It is also possible to create additional
    subplans to benefit premium customers with priority shipping and billing


    This resource plan can be refined by specifying how unused resources are allocated
    between resource consumer groups. Company XYZ wants to ensure that at least five
    percent of the resources are always available to service the billing functions.
    It also wants any unused resources from order entry and shipping made available
    to billing. This is done by placing the order entry and shipping resource consumer
    groups in one level and the billing resource consumer group in a second level,
    as shown in TABLE 4-5.


    # TABLE 4-5 Company XYZ Resource Plan


    | Resource Consumer Groups | Level 1 CPU Resource Allocation | Level 2 CPU Resource
    Allocations |

    |---|---|---|

    | Web-based Order Entry | 80% | 0% |

    | Shipping | 15% | 0% |

    | Billing | 0% | 100% |


    While this revised plan may appear to provide the same allocation of resources
    as the first plan, it is different. Unused resources allocated to the order entry
    or shipping resource consumer group are made available to the billing resource
    consumer group. The levels also establish a maximum level of CPU consumption for
    the order entry and shipping resource consumer groups. In the first plan, unused
    resources from any one consumer group are proportionally divided among the other
    resource consumer groups.'
