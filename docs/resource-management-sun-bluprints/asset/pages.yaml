  md: '# Decay Factors and Parameters


    The SRM software is designed to run with minimal or no tuning. However, a number
    of configurable parameters govern the way the scheduler operates shares. These
    parameters can be used to influence the way the scheduler reacts to dynamic workloads,
    and different parameters can sometimes benefit particular workloads.


    The SRM scheduler is a complete replacement for the Solaris timeshare scheduler
    (TS), and does not use any of the existing parameters provided with the TS scheduler
    module. On systems SRM is installed, use the dispadin command to display the configured
    scheduling classes:


    ```

    # dispadin -l

    CONFIGURED CLASSES

    ==============

    SYS      (System Class)

    SHR      ((SHR) SRM Scheduler)

    TS       (Time Sharing)

    IA       (Interactive)

    ```


    At boot time, the Solaris kernel starts all non-kernel processes in the SHR class
    instead of the TS class. You can see this with the ps command.


    ```

    # ps -cafe

    UID  PID PPID PRI STIME TTY    TIME CMD

    root  0   0    SYS 96  Mar 12 ?      0:00 sched

    root  0   0    SYS 96  Mar 12 ?      0:00 sched

    root  1   0    SHR 59  Mar 12 ?      1:03 /etc/init -

    root  2   0    SYS 98  Mar 12 ?      0:00 pageant

    root  3   0    SYS 60  Mar 12 ?      7:19 fsflash

    root  4   0    SYS 60  Mar 12 ?      1:05 smrgr

    root 563   1    SHR 60  Mar 12 console 0:00 /usr/lib/saf/ttym

    root 313   1    SHR 59  Mar 12 ?      0:04 /usr/lib/utmpd

    root 201   1    SHR 59  Mar 12 ?      0:00 /usr/sbin/keyserv

    root 14   1    SHR 59  Mar 12 ?      0:00 vxconfigd -m boot

    root 159   1    SHR 59  Mar 12 ?      0:23 limdaemon

    root 199   1    SHR 59  Mar 12 ?      0:00 /usr/sbin/rpcbind

    root 252   1    SHR 59  Mar 12 ?      1:24 automountd

    ctd...

    ```'
