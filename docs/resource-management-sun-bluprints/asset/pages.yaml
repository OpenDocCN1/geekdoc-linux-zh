  md: '# Workload Partitioning: OLTP and DSS/DW


    The Decision Support System/Data Warehousing (DSS/DW) workload involves the movement
    of large amounts of continuous disk data to the server for analysis. Such operation
    will normally consume all available I/O bandwidth and available CPU capacity.


    Online Transaction Processing (OLTP), in contrast with DSS/DW, involves registration
    of small asynchronous transactions, each requiring minimal CPU capacity and real-time
    random access to small portions of disk data.


    OLTP and DSS/DW applications do not provide a good working solution when placed
    on the same server because OLTP transactions might get delayed when outstanding
    DSS/DW queries consume all available server resources. A single Starfire can easily
    support these two conflicting workloads by providing two separate DSD instances,
    which establish the required hardware isolation and appropriate separation of
    the operating system instances.


    In this example, the OLTP DSD has the ability to relocate system boards from the
    DSS DSD to meet the high volume of OLTP transactions during peak hours. The DSS
    DSD can also have resource-demanding queries postponed to a time when the OLTP
    transactions are minimal and system boards can be safely relocated from the OLTP
    DSD.


    In addition, DSDs introduce the possibility of instantly migrating OLTP data resident
    on disk devices and making it immediately available to the DSS/DW DSD without
    resorting to time-consuming network transfers.


    # Organizational Partitioning: Production, Development, Test, Training


    DSDs can produce separate processing nodes in support of software development,
    training and testing or simply to allow organizations that share ownership of
    their own piece of the machine. The Test DSD in this example can take resources
    from the Training and Development DSD whenever new software or operating system
    releases need testing before getting rolled out into production.


    Customers can easily create and remove DSDs outside of their production environments
    to help support functions that are important but not critical in the data center
    environment.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Functional Partitioning: OLTP, Sales, Financials, Planning


    DSDs allow partitioning of a Starfire platform in support of different processing
    functions within the same company. The importance of processing functions within
    a company varies with time, and DSD resources can be re-allocated to serve those
    varying needs. For an example, the sales and distribution function becomes more
    important than the production planning function during a quarter-end cycle. System
    boards from the production planning DSD can be migrated to the sales and distribution
    DSD to help meet anticipated seasonal surge in the workload.


    ![](img/52144374747884a32fdddbed4e8cd9d7_230_0.png)


    # Resource Management Controls


    DR was an exclusive feature of the Starfire platform, but it now supports the
    entire Sun Enterprise 3000-6500 Server line. The Starfire DR allows the relocation
    of resources within a single system (a Starfire chassis), while the Sun Enterprise
    3000-6500 DR allows the relocation of resources between separate systems.


    DR works in conjunction with the hot-swap hardware capability to allow the physical
    insertion or removal of system boards. Additionally, DR increases the level of
    availability and serviceability by providing a way to execute on-line hardware
    upgrades and maintenance.


    The Starfire DR provides full functionality (CPU, memory, and I/O interfaces)
    starting with the Solaris 2.5 release. In contrast, the Sun Enterprise 3000-6500
    DR provides full functionality after the Solaris 7 (5/99) release and support
    for I/O interfaces only in the Solaris 2.6. 5/98 release (see TABLE 8-1).


    TABLE 8-1 Dynamic Reconfiguration Functionality Matrix

    | Solaris Version | Starfire | Sun Enterprise 3000-6500 |

    |---|---|---|n| Solaris 2.5.1 | Yes | No |

    | Solaris 2.6 | Yes | Support for I/O interfaces only in 5/98 release |

    | Solaris 7 | Yes, in 5/99 release | Yes, in 5/99 release |


    If required, Alternate Patching (AP) software provides an additional mechanism
    in support of DR to provide redundant disk and network controllers (and their
    respective physical links) to sustain continuous network and disk I/O when resources
    are removed (detached) from a DSD. While AP is supported on both the Starfire
    and the Sun Enterprise 3000-6500 servers, it is not a prerequisite for DR.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Managing Resources with Starfire DR


    The Starfire DR has an extended resource management functionality over the Sun
    Enterprise 3000-6500 DR since it enables system resource sharing between DSDs.
    The Starfire DR allows the logical detachment of a system board from a provider
    DSD (DSD from which resources are borrowed) and the logical attachment of the
    same system board to a receptor DSD (DSD where loaned resources are applied).
    The Sun Enterprise 3000-6500 DR is also equipped to handle logical sharing, but
    it would require idle resources within the server activated only when they are
    needed.


    To provide a mental picture of all resource management issues involved when using
    DSDs we will next present a hypothetical HPC (High Performance Computing) workload
    in need of more CPU power, a larger memory footprint, and an increased disk I/O
    bandwidth. Each of the HPC workload resource needs is addressed as a separate
    instance in following paragraphs and each instance is assumed to have fulfilled
    appropriate pre-requisites.


    # Managing CPU Resources


    If the hypothetical HPC workload running on a Starfire DSD had access to a system
    board populated with just CPUs, then the detach sequence executed in the provider
    DSD followed by the attach sequence in the receptor DSD would take the same amount
    of time every single time (approximately one minute for the detach process and
    approximately six minutes for the attach process).


    # Managing Memory Resources


    If the hypothetical HPC workload running on a Starfire DSD had access to a system
    board populated with just memory, then the detach time would be variable, depending
    on how much of that memory is being used by the provider DSD. There is no such
    thing as a Starfire system board populated with just memory since at least one-on-board
    CPU is required to enable Power-On Self-Test (POST) execution.


    All dirty memory pages resident on the board to be detached get immediately flushed
    to the swap area (either memory or disk), while all non-pageable memory gets copied
    to the available memory remaining in the provider DSD system. The time required
    for the attach process is determined by the execution of POST (approximately six
    minutes with default POST level 16).'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'The kernel cage is a special data structure (normally contained by a single
    system board) which controls the dynamic growth of all non-relocatable memory,
    including the OpenBoot™ PROM (OBP) and kernel memory. When detaching a system
    board containing the kernel cage, you must quiesce the operating system to ensure
    that no I/O or kernel activity exists while the kernel cage is being relocated.
    The operating quiescence involves the suspension of all device driver activity
    and kernel threads to avoid corruption of critical memory.


    During a DR-detach process, the ISM associated with the system board being removed
    is locked down and cannot be passed out. ISM will always be relocated to memory
    available on the remaining system boards. If a system is already experiencing
    memory pressure (paging and swapping), the removal of existing system memory to
    make room for the ISM footprint will impact the performance of running applications
    and the DR-detach operation.


    > Note - After the release of the Solaris 7 software, the kernel cage is confined
    to the highest physical address which translates to the highest numbered system
    board in the DSD. There is a patch to the SSP software which introduces the appropriate
    modifications to hpost to override the Starfire''s physical memory address introduced
    with the Solaris 7 software and preserve the kernel cage in the lowest numbered
    system board. The Sun Enterprise 3000-6500 DR does not allow the relocation of
    the kernel cage.


    # Managing I/O Resources


    If the hypothetical HPC workload running on a Starfire DSD had access to a system
    board populated with just I/O interfaces then the detach time will be dependent
    on the number of disk devices and the queued pending transfers because they need
    to be serviced before the I/O interfaces are quiesced. Again, there is no such
    thing as a Starfire system board populated with just I/O interfaces because at
    least one on-board CPU is required to enable execution.


    # Starfire DR-Detach and DR-Attach Timing Reference


    To provide a sense of timing for the DR-detach and DR-attach operations, we refer
    to a lab exercise, executed under the Solaris 2.6 operating environment and using
    System Service Processor software version 3.1, where we relocated a system board
    populated with the following:


    +   - Four 250 Mhz UltraSPARC-II CPUs with 4Mbytes of external cache

    - One Gigabyte of memory'
  merge: -1
  pgno: 232
- img_proc: true
  md: '+   ■ SBus FWDIFF-SCSI controllers attached to seven tape drives (contained
    by a single SunEdge™ L3500 tape library


    The recorded times for the DR-detaching operations involved in releasing the system
    board from the provider DSD as follows:


    +   ■ The drain of the 1 Gigabyte resident memory took approximately two minutes


    +   ■ DR-detach completion process took approximately one minute.


    The times for the DR-attaching operations involved in introducing the system board
    to the receptor DSD as follows:


    +   ■ The POST execution against the newly attached system board (with default
    POST level 16) took approximately six minutes.


    +   ■ DR-attach completion process: approximately one minute


    > Note - The timing references introduced in this section reflect the lower end
    of the spectrum since they were extracted from an idle system. The detach and
    attach times in a production environment will depend on the system load. The DR-detach
    operations described in this section reflect the installation of the appropriate
    collection of patches required for DR as well as ensuring that any non-DR-compliant
    driver instances contained by the system board were appropriately unloaded.


    # DR with and without DSDs


    In the interest of resource management and to have DR best serve your application
    needs, you must understand the differences between the DR capabilities applicable
    to the Starfire and those applicable to the Sun Enterprise 3000-6500 servers.


    The Sun Enterprise 3000-6500 DR is simpler in nature because it doesn''t support
    DSDs, and its functionality is limited to bringing in new system board resources
    into the Solaris instance or detachable system boards to be serviced or shared
    with other Sun Enterprise 3000-6500 servers.


    In contrast, the Starfire DR is more complex in nature because it includes all
    of the Sun Enterprise 3000-6500 DR functionality as well as DSD support to allow
    resource sharing within the same platform.


    # Resource Sharing


    In the Resource Management framework, the Sun Enterprise 3000-6500 platforms are
    limited to physically sharing system board resources with other Sun Enterprise
    3000-6500 platforms. Physical sharing involves the powering down and physical
    removal of a system board from a system (after having it removed from Solaris
    operating'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'environment control. After the system has been removed from the original system,
    it can then be inserted into an alternate system, powered up, and registered with
    the active Solaris operating environment instance.


    Both the Starfire and Sun Enterprise 3000-6500 platforms share the risk of having
    bent pins damage the backplane interface and bring down the whole Solaris operating
    environment instance when exercising physical sharing. The Starfire DR eliminates
    the danger of having bent pins or worn out connectors by allowing the logical
    relocation of system boards between DSDs.


    Note – Physical removal or installation of system boards might invalidate service
    contracts if attempted by non-qualified service personnel.


    # Memory Interleaving


    The Starfire and Sun Enterprise 3000-6500 platforms require that memory interleaving
    be disabled in order to support DR. Memory interleaving helps increase subsystem
    performance by reducing the probability of hot spots or contention in a few memory
    banks by spreading access to multiple memory banks.


    The active Gigaplane-XBM™ interconnect on the Starfire provides main memory access
    through a point-to-point data router, which isolates traffic between system boards
    and minimizes any performance degradation when memory interleaving is disabled.
    The passive Gigaplane bus interconnect on the Sun Enterprise 3000-6500 platforms
    is shared by all system boards and may introduce performance degradation with
    memory intensive workloads when memory interleaving is disabled.


    # System Board Diagnostics


    The Sun Enterprise 3000-6500 executes POST as soon as the system board is attached
    to the system. The Sun Enterprise 3000-6500 system boards do not have hardware
    isolation applicable to DSDs and will expose the risk of bringing down its active
    Solaris operating environment instance by registering faulty on-board components.
    The Starfire DR, in contrast, controls the POST operation from the SSP over the
    JTAGG (Joint Test Action Group, IEEE Std. 1149.1) interface and does not activate
    a newly attached system board until its full functionality is guaranteed.


    Note – The Starfire DR allows an increased test coverage on all system board components
    by temporarily increasing the POST level through modification of the SSP’s postrc
    (4) file).'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# User Interfaces


    Both the Sun Enterprise 3000-6500 DR and Starfire DR functions have their own
    private user interfaces that require manual intervention from a system administrator.
    The Sun Enterprise 3000-6500 DR uses the SymMon framework and the cfgadm(1M) command
    interface to invoke the required DR functions.


    The cfgadm (1M) command provides an interface to build automated DR scripts. Script
    building for unattended DR operations must be handled with caution when detaching
    a system board removing system resources may have a negative impact on applications
    executing in the machine.


    The SSP manages all the resources that are allocated to DSDs and keeps track of
    their boundaries; thus, it has to initiate all DR operations. The Starfire DR
    is performed through the following SSP applications:


    +   - The drview(1M) command, which produces a GUI to be invoked only through
    the hostview(1M) interface, see FIGURE 8-2.


    +   - The dr (1M) command, a Tool Command Language (TCL) application that produces
    a command line interface monitor that supports a set of commands that integrate
    all DR functionality, see FIGURE 8-3.


    Currently, the Starfire DR user interface does not provide mechanisms to automate
    DR operations. The current user interfaces are exclusively interactive.'
  merge: -1
