    section briefly introduces the product and concentrates on the specific process
    of performing a workload analysis breakdown using SyMON as the example tool.


    Sun Enterprise SyMON 2.0 software is a three-tier application. A customizable
    agent runs on each system to be monitored. All agents report back to a centralized
    server process. Multiple graphical consoles can be started to view or customize
    the data. The console is written in Java and can be installed on the Solaris operating
    environment or the Windows NT environment.


