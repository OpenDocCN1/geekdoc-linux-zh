  md: '# Glossary


    **access control list** (ACL) A file that specifies which users can access a particular
    resource, such as a filesystem.


    **accounting** Keeping track of resource usage on a machine. SRM provides accounting
    features.


    **ACL** See access control list.


    **administration Tool** A GUI tool for configuring Solaris Bandwidth Manager.


    **administrative domain** A collection of network elements under the same administrative
    control and grouped together for administrative purposes.


    **ADOP** See automatic degree of parallelism.


    **alarm** The means by which notification is sent when an exception occurs.


    **attaching** See DR Attach.


    **Alternate Pathing** (AP) A software mechanism which works in conjunction with
    Dynamic Reconfiguration (DR) to provide redundant disk and network controllers
    their respective physical links. The main purpose of Alternate Pathing is to sustain
    continuous network and disk I/O when system boards are detached from a machine
    or DSD (in the case of the Starfire) that is running a live copy of the Solaris
    operating environment.


    **AP** See Alternate Pathing.


    **application resource measurement** (ARM) A means of measuring the end-to-end
    response time of a system.


    **ARM** See application resource measurement.


    **ASE** Sybase Adaptive Server Enterprise.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'automatic degree of parallelism (ADOP) A feature of the Oracle8i Database Resource
    Manager that attempts to optimize system utilization by automatically adjusting
    the degree of parallelism for parallel query operations.


    backfilling Execution of a job that is short enough to fit into the time slot
    during which processors are reserved, allowing for more efficient use of the available
    resources. Short jobs are said to backfill processors reserved for large jobs.


    BBSRAM Boot Bus Static Random Access Memory.


    blacklist A file that enables you to specify components, such as system boards,
    that should not be configured into the system. The blacklist file is read and
    processed at longterm time.


    BMC Best/1 BMC Software''s BEST/1 products provide tools to address management
    requirements across OS/390, Parallel Sysplex, SAP R/3, Unix, Windows NT, VM and
    AS/400 environments.


    CBQ See Class Based Queuing.


    CCMS A tool that provides information to SAP R/3 allowing it to measure the performance
    of key user transactions and the response time of the backend database for applications.


    CICS See Customer Information Control System.


    CIM See Common Information Model.


    Class Based Queuing (CBQ) The underlying queuing technology used in Solaris Bandwidth
    Manager.


    Classes of Service A feature supported by Solaris Bandwidth Manager that allows
    network traffic to be organized so that urgent traffic gets higher priority than
    less important traffic.


    classifier A component of the Solaris Bandwidth Manager that allocates packets
    to a class queue. When a packet arrives, the classifier analyzes the packet protocol,
    ToS value, URL information, source information, destination information and then
    allocates the packet to a class queue where it waits to be processed.


    CLI Command Line Interface, as opposed to Graphical User Interface (GUI).


    cluster A collection of computers interconnected via a high-speed interface that
    allows the environment to behave as a single unified resource.


    clustered cache A method of caching web where multiple servers use the intercache
    protocol (ICP) to talk among themselves and form an explicit hierarchy of siblings
    and parents. If the load would overwhelm a single server or if high availability,
    multiple servers are configured as siblings. Each sibling stores data in its cache
    also uses ICP to search the caches of other siblings.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# CMIP A scalable OSI-based management protocol that is used in situations
    where SNMP is not powerful enough.


    **codepoint** A construct used by the ToS facility of the Solaris Bandwidth Manager.
    The way that the DSCP bits are set in a packet is called its *codepoint*, and
    network translate DSCP codpoints to device configurations. For example, a compliant
    router that has two priority queues (one for regular priority traffic and one
    for high priority traffic) could be configured to have several codpoints map to
    the high priority queue, and several others to the regular priority queue.


    **Common Information Model** (CIM) A metamodel based on the Unified Modeling Language
    (UML) that supplies a set of classes with properties and associations. The Common
    Information Model provides a conceptual framework within which it is possible
    to organize information about a managed environment.


    **control interval** In control theory, the rate at which measurements are made
    and corrections are applied.


    **CoS** See Classes of Service.


    **Cross-System Coupling Facility** A WLM component that communicates policies,
    metrics, and control data between Sysplex nodes.


    **Customer Information Control System** (CICS) An interactive transaction processing
    system from IBM.


    **DDI_ATTACH** A function, used by DR (called from the *dr_driver*) that provides
    the ability to attach a particular instance of a driver without affecting other
    instances that are serving separate devices.


    **DDI/DKI** Device Driver Interface/Device Kernel Interface. These are function
    call points that device drivers should implement in order to fully support DR.
    DDI/DKI is specified in the "Writing Device Drivers" section of the Developer
    Site 1.0 Answerbook (http://docs.sun.com).


    **DDI_DETACH** A function, used by DR (called from the *dr_driver*) that provides
    the ability to detach a particular instance of a driver without affecting other
    instances that are serving separate devices.


    **DDI_RESUME** A function, used by DR (called from the *dr_driver*) that provides
    the ability to detach a board that contains the kernel cage (OBP, kernel, and
    non-pageable memory). The kernel cage can only be relocated after all of the drivers
    throughout the entire DSD (not just on the board being detached) is quiesced to
    guarantee the data integrity of the kernel cage relocation. *DDI_RESUME* resumes
    the drivers after the quiesce period.


    **DDI_SUSPEND** A function, used by DR (called from the *dr_driver*) that provides
    the ability to detach a board that contains the kernel cage (OBP, kernel, and
    non-pageable memory). The kernel cage can only be relocated after all of the drivers'
