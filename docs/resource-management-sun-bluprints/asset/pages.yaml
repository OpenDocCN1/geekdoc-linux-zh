    +   - New iostat options to present these metrics


    One option (iostat -M) shows throughput in Mbytes/s rather than Kbytes/s for high-performance
    systems. Another option (-n) translates disk names into a more useful form, so
    you don''t have to deal with the sd4kb format—instead, you get c1t2d51. This feature
