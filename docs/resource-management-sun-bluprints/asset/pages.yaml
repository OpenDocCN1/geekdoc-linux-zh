  md: '# Dynamic System Domains and Dynamic Reconfiguration


    In the Resource Management framework


    DSDs are logical, hardware-isolated server entities that can add (attach) or remove
    (detach) hardware resources through the use of Dynamic Reconfiguration (DR) software,
    without incurring any downtime on their operating system instances. DSD''s electrical
    isolation provides a faultft-fencing mechanism which allows applications to run
    independently of each other within the same machine. In addition, DSDs can increase
    their Reliability, Availability, and Serviceability (RAS) service levels by making
    use of the Sun™ Cluster software.


    # Dynamic System Domains


    DSDs are Starfire''s independent hardware entities formed by the logical association
    of system boards. DSD is the preferred term when referring to Starfire domains
    because the generic term "domain" is used by the industry to reflect different
    applications (for example, mail servers, name servers, and Microsoft Windows NT
    have distinct representations of "domains").


    The current second generation Starfire DSD technology was originally introduced
    in 1995 with the Cray CS6400 machine (it later became the Sun CS6400 server).
    DSDs were originally inspired by the Multiple Domain Feature (MDF™) hardware'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'capability introduced by Amdahl® Corporation in 1985, allowed CPU and I/O resources
    on their mainframes to be allocated to concurrently run multiple operating system
    instances on the same machine.


    Mainframe companies have enjoyed plenty of time to develop robustness in their
    operating systems and hardware. High mainframe prices have appropriately funded
    engineering developments and materials cost. However, the Starfire platform implements
    some of the best mainframe attributes at a fraction of the cost, while providing
    a larger memory capability and improved I/O capacity and performance.


    DSDs are separate Solaris servers in their own right. Each has a separate boot
    disk (to execute a private instance of the Solaris operating environment) as well
    as disk storage, network interfaces, and I/O interfaces. In addition, system board
    resources can be relocated between DSDs within the same machine to accommodate
    workload needs without having to stop running applications or reboot the machine.


    Theoretically, the Starfire server can support 16 DSDs, but 8 is the supported
    maximum. The granularity of floating resources allocated to DSDs is the system
    board. The Starfire platform supports a maximum of 16 systems with each system
    board configured to contain a maximum of:


    +   * 4 CPUs

    * 4 Gbytes of memory, 32*128 Mbyte DIMMs (dual in-line memory modules)

    * 4 SBUS I/O interfaces or 2 PCI I/O interfaces


    # When to Use Dynamic System Domains


    DSDs alleviate the need to over-configure hardware to handle peak loads and eliminate
    idle or under-utilized resources because they can be dynamically reallocated without
    the need for a reboot. Currently, there are no mechanisms to manage the automatic
    transfer of system boards between DSDs based on workload needs. Such process currently
    requires manual operator intervention.


    DSDs are well suited to commercial applications because of their manageability,
    flexible processing, I/O capacity, as well as their fault and resource isolation
    features. Because DSDs are virtual independent machines, all Solaris applications
    and available resource management tools that apply to the entire Sun Enterprise
    3000-6500 Server line are available.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Relationship to Other Solaris Resource Management Products


    The prset utility can create processor sets to address individual processing needs
    of different workloads within the same DSD. The Solaris Resource Manager (SRM)
    product enables an enhanced workload resource control over prset by managing CPU,
    Virtual Memory, number of processes, number of logins and connect time to achieve
    a guaranteed service level for each application.


    The SyMon product can be used to monitor each individual DSD and perform limited
    control functions; however, the System Service Processor (SSP) is still the primary
    administrative interface for DSDs. The Solaris Bandwidth Manager product can be
    used to address the individual network bandwidth requirements of separate workloads
    within the same DSD.


    # Server Consolidation Workload


    DDSs provide the simplest approach to customers entertaining server consolidation,
    which is an attempt to relocate applications running on smaller servers into a
    single physical footprint, thereby reducing data center space. DDSs provide a
    guarantee that a misbehaving workload will not affect the rest of the consolidated
    applications because each instance is restricted by hardware to its own Solaris
    operating


    The maximum number of DDSs supported by a single Starfire platform represents
    the hard limit on the number of distinct workloads to be consolidated. Having
    numerous DDSs restricts the amount of shared resources, while it increases administrative
    overhead.


    SRM can take advantage of the large size, scalability, and performance of a single
    Starfire DSD by enabling a higher granularity of resource management. SRM does
    not currently control physical memory and DDSs are still the best way to consolidate
    memory-intensive workloads.


    # Database Workload


    Dynamic Reconfiguration (DR) is a software mechanism that allows resources to
    be attached (logically added) or detached (logically removed) from the Solaris
    operating environment control and without incurring any downtime.


    Commercial Relational Database Management Systems (RDBMS) vendors such as Oracle®,
    IBM® DB2, Informix®, and Sybase®, attempt to guarantee a service level by reserving
    system resources and controlling how and when such resources are utilized.'
  merge: -1
  pgno: 226
- img_proc: true
  md: "Because each RDBMS vendor has its own proprietary architecture, each is affected\n\
    differently by the dynamic resource increments or decrements introduced by DR.\
    \ A\ntable of database resource management compatibility can be found in TABLE\
    \ 4-2.\n\n# Dynamic CPU Resources\n\nOracle™ 7.x and 8.0 are process-based products\
    \ that can tolerate the increment\ndecrement of CPU resources introduced by DR.\
    \ However there are some\nperformance impacts when changing the number or processors\
    \ for a running\ninstance. (See Oracle8 \"Databases in a Resource Managed Environment\"\
    \ on\npage 77). The Oracle Resource Manager must know exactly how many processors\n\
    are available, and currently must be restarted after a DR event that chages the\n\
    umber of processors.\n\nDB2 Universal Database™ (UDB) is a process-based product\
    \ that can easily adapt\nthe increment and decrement of CPU resources introduced\
    \ by DR. DB2 UDB uses\nshadow processes that unfortunately get queued to run across\
    \ an expanded\nreduced CPU pool through the Solaris kernel scheduler. A reduction\
    \ of CPUs\navailable to the Solaris scheduler will have a negative impact on\n\
    by the same number of processes allocated to fewer CPUs.\n\nSybase Adaptive Server\
    \ Enterprise™ (ASE) is engine-based and each configured\ntype is typically assigned\
    \ to an available CPU. A Database Administrator (DBA)\ncan dynamically register\
    \ a CPU resource increment by bringing up more engines,\nbut engines are not allowed\
    \ to be dynamically removed. Sybase ASE will be adding\nthe capability to bring\
    \ down engines in version 12.0, which is expected to be\navailable by the end\
    \ of 1999.\n\nInformix OnLine Server™ (ODS) allows a number of CPUs to be added\
    \ to\nspecific processing class (CPU, AIO, PIO, LIO, SHM, STR, TLI, and SOC) using\
    \ the\noncommand command. Informix ODS only allows CPUs to be removed from the\
    \ CPU\nclass provided polling threads are not executed (poll threads can be assigned\
    \ to run\nde degraded mode in the SHM, TLI or TLI classes instead).\n\n# Dynamic\
    \ Memory Resources\n\nMany databases make use of the Intimate Shared Memory (ISM)\
    \ capability in the\nSolaris operating environment where shared memory can be\
    \ exclusively reserved\n locked into RAM to prevent paging. ISM makes use of the\
    \ shared page table, to\nmake more efficient use of the page translation looksaside\
    \ buffers (TLBs). Informix\nOnline Dynamic Server™ is the only RDBMS that currently\
    \ allows dynamic addition\nor removal of its shared memory allocation."
  merge: -1
  pgno: 227
- img_proc: true
  md: 'During a DR-detach process, the ISM associated with the system board being
    removed is considered non-pageable memory and needs to be relocated available
    on the remaining boards (the DR operation will fail if there is insufficient memory
    available in the remaining system boards).


    During DR-attach process, the allocated shared-memory size for the database will
    not change since it is statically registered in the database configuration. The
    only way to increase the shared-memory footprint increasing system memory through
    a DR-attach process is by shutting down the database instance, changing the shared-memory
    parameters in the configuration file, and then restarting the database.


    # DSD Implementation Examples


    To get a better idea about the resource management role of DSDs in the data center,
    we''ll consider three different Starfire setups represented in FIGURE 8-1. Keep
    in mind that every scenario introduces the opportunity to relocate resources between
    DSDs in anticipation of the variable workload demands perceived on a real-time,
    daily, or a monthly basis. When relocating a system board to a DSD, some of the
    components can be ruled out of the configuration for security purposes or to speed
    up the DR-attach process through use of the blacklist (4) file.


    | Workload Partitioning | Organizational Partitioning | Functional Partitioning
    |

    | --- | --- | --- |

    | DSD1: OTP Operational Database 8 System Boards (32 CPUs) | DSD1: Production
    8 System Boards (32 CPUs) | DSD1: OTP 8 System Boards (32 CPUs) |

    | DSD2: DSS/DW Database 8 System Boards (32 CPUs) | DSD2: Development 4 System
    Boards (16 CPUs) | DSD2: SAP Sales & Dist. 4 System Boards (16 CPUs) |

    | | DSD3: Test 3 System Boards (12 CPUs) | DSD3: Oracle Financials 3 System Boards
    (12 CPUs) |

    | | DSD4: Training 1 System Board (4 CPUs) | DSD4: Prod. Planning 1 System Board
    (4 CPUs) |


    FIGURE 8-1 DSDs Implementation Examples'
