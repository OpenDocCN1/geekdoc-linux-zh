- img_proc: true
  md: '# Configurable Kernel Limits


    There are a few kernel variables that limit the resources a user can request.
    If they are set too high, the system can be susceptible to denial of service attacks.


    # System V Shared Memory


    The normal semantics for System V Shared Memory allow any user to request a memory
    segment to be shared. Ultimately, if too many large processes try to run they
    will be paged out. The shared memory requests are limited by the amount of swap
    space that can be reserved to backup the memory.


    A special option for System V Shared Memory called Intimate Shared Memory (ISM)
    is implemented in the Solaris operating environment to increase performance for
    database applications. When ISM is requested by setting a special SHM_SHARE_MMU
    flag in the call to shmat (2) memory is allocated that is locked in RAM and shares
    its memory management mappings with every process. ISM has evolved over the years.


    +   - Solaris 2.5.1 ISM reserves an equal amount of swap space but never uses
    it.

    - Solaris 2.6 ISM does not reserve any swap space and uses 4-Mbyte payloads to
    map large ISM segments, which greatly reduces memory management overheads.


    The resource management implications are that end users could consume all the
    memory in a system with calls to allocate ISM, and this memory is not pagable.
    In the Solaris 2.5.1 ISM this memory also consumes swap space.


    The kernel variable that limits all System V memory allocation can be set in /etc/system.
    Its default value is one megabyte, which prevents any problems:


    ```

    set shmsys:shmininfo_shmax=1048576

    ```


    FIGURE 6-3 Setting for System V shared memory Size Limit


    When running databases, this value is normally increased to allow several gigabytes
    of ISM to be allocated.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Maximum User Process Count Limit


    There is a systemwide limit on the total number of processes that each user is
    allowed to have. By default this limit is set to five less than total process
    count limit, which effectively means that there is no limit. It can be useful
    to set this limit to a low value on student timesharing systems.


    ```

    set maxuprc=20

