  md: '# Clustered DSDs


    In the clustered world, DSDs qualify as independent servers and can be clustered
    to enhance hardware availability for mission-critical applications. The following
    are four recommended failover permutations of DSD clustering through use of the
    Sun Cluster 2.2 software ranging from the highest to the lowest availability level
    (see FIGURE 8-4):


    +   - Clustering of two DSDs in two separate Starfire cabinets each with many
    DSDs. This configuration is applicable to servers handling customer orders and
    money transactions that are intolerant of system down time

    - Clustering of two DSDs in two separate Starfire cabinets, each with a single
    DSD which is applicable to read-only databases with backed-up source data

    - Clustering of a DSD and a non-Starfire external system, which is applicable
    to file and print servers handling non-critical data

    - Clustering of two DSDs within the same Starfire cabinet, which is applicable
    to development servers that are tolerant of system downtime


    Currently, clustered DSD nodes do not support DR because of the amount of time
    involved quiescing (suspending) the operating system whenever the kernel cage
    needs to be relocated. The time that the operating system spends in the suspended
    state is dependent upon system resource availability during the DR-detach operation.
    A really busy system might stay in the suspended state for a long time and trigger
    a non-responsive node alarm in the cluster management software.'
  merge: -1
