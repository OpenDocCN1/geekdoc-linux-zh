- img_proc: true
  md: 'The host''s availability time window is closed


    +   - unavail


    The host is not responding


    +   - unlicensed


    The host does not have a valid LSF license


    The r15s, r1m and r15m load indices have the 15 second, 1 minute, and 15 minute
    average CPU run queue lengths. This is the average number of processes ready to
    use the CPU during the given interval.


    On multiprocessor systems more than one process can be executed at a time. The
    LSF software systems scale the run queue value on multiprocessor systems to make
    the CPU load of uniprocessors and multiprocessors comparable. The scaled value
    is called the effective run queue length.


    The LSF software also adjusts the CPU run queue based on the relative speeds of
    the processors. The normalized run queue length is adjusted for both the number
    of processors and the CPU speed. The host with the lowest normalized run queue
    length will run a CPU intensive job fastest.


    The ut index measures CPU utilization, which is the percentage of time spent running
    system and user code. A host with no process running a ut value of 0 percent,
    while a host on the CPU is completely busy has a ut of 100 percent.


    The pg index gives the virtual memory paging rate in pages per second. This index
    is closely tied to the amount of available RAM and the total process size. If
    there is not enough RAM to satisfy all processes, the paging rate will be high.


    The paging rate is reported in units of pages rather than kilobytes, because the
    relationship between interactive response and paging rate is largely independent
    of the page size.


    The ls index gives the number of users logged in. Each user is counted once, no
    matter how many times they have logged into the host.


    The it index is the interactive idle time of the host, in minutes. Idle time is
    measured from the last input or output on a directly attached terminal or a network
    pseudo terminal supporting a login session.


    The tmp index is the space available on the file system that contains the /tmp
    directory in megabytes.


    The swp index gives the currently swap space in megabytes. This represents the
    largest process that can be started on the host.'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'The mem index is an estimate of the real memory currently available to user
    processes. This represents the approximate size of the largest process that started
    on a host without causing the host to start paging. This is an approximation because
    the virtual memory behavior is hard to predict.


    The io index measures the I/O throughput to disks attached directly to the host
    in kilobytes per second. It does not include I/O to disks that are mounted from
    other hosts.


    # Static Resources


    Static resources represent host information that does not change over time such
    as the maximum RAM available to processes in a machine. Most static resources
    are determined when the LSF software starts up. The following table lists the
    static resources reported by the LSF software.


    TABLE 10-2 Static Resources Reported by the LSF Software


    | Index | Measures | Units | Determined by |

    | --- | --- | --- | --- |

    | type | host type | string | configuration |

    | model | host model | string | configuration |

    | hname | host name | string | configuration |

    | cpuf | CPU factor | relative | configuration |

    | server | host can run remote jobs | Boolean | configuration |

    | repri | execution priority | nice(2) argument | LSF |

    | ncpus | number of processors | processors | LSF |

    | disks | number of local disks | disks | LSF |

    | maxmem | maximum RAM available to users | megabytes | LSF |

    | maxswp | maximum available swap space | megabytes | LSF |

    | maxptmp | maximum space in temporary file system | megabytes | LSF |


    The type and model resources are strings specifying the host type and model.


    The CPU factor is the speed of the host''s CPU relative to other hosts in the
    cluster. If one processor is twice the speed of another, its CPU factor is twice
    as large. For multiprocessor hosts, the CPU factor is the speed of a single processor.
    The LSF software automatically scales the host load to account for additional
    processors.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'The server resource is a Boolean, where its value is 1 if the host is configured
    to execute tasks from other hosts, and 0 if the host is not an execution host.


    # # Monitoring Resource Usage


    Since the amount of available resources on an execution host is constantly changing,
    some method of monitoring the current state of that host must be deployed to avoid
    overloading it. Also, some check of the resources consumed by a particular batch
    job must be performed to ensure that the batch job is not consuming more resources
    than specified in the resource policy for that job. The LSF software uses the
    Load Information Manager (LIM) as its resource monitoring tool. The LIM process
    running on each execution host is responsible for collecting load information.
    The load indicates collected by the LIM include:


    +   - Host status

    - Length of run queue

    - CPU utilization

    - Paging activity

    - Available swap space

    - Available memory

    - I/O activity


    The load information is gathered at predefined intervals ranging from 15 seconds
    to one minute.


    To modify or add load indices, you can write an Extended Load Information Manager
    (ELIM). The ELIM can be any executable program, either an interpreted script or
    compiled code. Only one ELIM per host is allowed; but each ELIM can monitor and
    report multiple measures.


    # # LSF Scheduler Components


    The following diagram shows the components used by the LSF software to schedule
    jobs. The mbatchd daemon runs on the master host, which manages the run queues.
    A job is submitted to these run queues along with the resources job requires.


    The mbatchd daemon periodically scans through the jobs ready to run and compares
    their resource requirements with the hosts contained in the Load Information Manager
    (LIM). When the appropriate resources become available for the job, the load conditions
    on the available hosts are checked to find the least loaded host.


    Once the most appropriate host is found, mbatchd sends the job to the sbatch daemon
    running on that system. When the job is started, sbatchd keeps track of the resource
    consumption of the job and reports back to mbatchd.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_294_0.png)


    # # Exceptions and Alarms


    When managing critical jobs, it is important to ensure that the jobs run properly.
    When problems are detected during the processing of the job, it becomes necessary
    to take some form of corrective action. The LSF software allows the user to associate
    each job with one or more exception handlers, which tell the system to watch for
    a particular type of error and take a specified action if it occurs. An exception
    condition represents a problem processing a job. The LSF software can watch for
    several types of exception conditions during a job’s life cycle.


    An alarm specifies how a notification should be sent in the event of an exception.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Events


    An event is a change or occurrence in the system (such as the creation of a specific
    file, a tape drive becoming available, or a prior job completing successfully)
    that can be used to trigger jobs. The LSF software responds to the following types
    of events:


    +   - time events


    Points of time (defined by calendars and time expressions) that can be used to
    trigger the scheduling of jobs.


    +   - job events


    The starting and completion of other jobs.


    +   - job group events


    Changes in the status condition of job groups.


    +   - file events


    Changes in a file''s status.


    +   - user events


    Site specific occurrences, such as a tape mount, defined by the LSF cluster administrator.


    +   - exception events


    Conditions raised in response to errors in the scheduling or execution of jobs.


    # Job Starters


    A job starter is a specified command (or set of commands) that executes immediately
    prior to a submitted batch job or interactive job. This can be useful when submitting
    or running jobs that require specific set up steps to be performed before execution,
    or jobs that must be performed in a specific environment. Any situation in which
    a wrapper would be written around the job you executed, is a candidate for a job
    starter.


    There are two types of job starters in the LSF software: command level and queue
    level. A command level job starter is user defined and precedes interactive jobs.
    A queue level job starter is defined by the LSF administrator and precedes batch
    jobs submitted to a specific queue.


    Job starters can also be used to run a job on a specific processor set, or to
    start a job inside an application-specific shell.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Analyzing Workloads


    The LSF software can process historical workload data to produce reports about
    cluster. The workload data includes information about batch jobs, system metrics,
    load indices and resource usage. The data obtained from the analyzer can be used
    for chargeback accounting and generating chargeback reports and invoices. It can
    also be used to plan for additional computing purchases.


    The primary features of the LSF software for analyzing workloads are:


    +   - Profiles highlighting the number of jobs processed by the system, job resource
    usage, system metrics, load indices, and resource usage


    +   - Usage trends for the LSF system hosts, users, applications, and projects


    +   - Information to manage resources by user and project


    +   - Chargeback accounting for users or projects providing reports and invoices


    +   - Data export to comma separated values (.csv) file format compatible with
    industry standard spreadsheet and data analysis tools


    +   - Built-in and user generated templates to automate analysis


    The LSF software collects and analyzes historical data stored in the LSF database
    to produce statistical reports that are designed to suit your needs. The analysis
    can be displayed in table, bar, area, and line charts and can be saved as a template,
    which makes it convenient to repeat the analysis any time.


    # LSF Workload Configuration


    The following diagram depicts an LSF cluster configuration.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_297_0.png)


    **FIGURE 10-2** LSF Cluster Configuration


    The submission host computer is the node where the user, or operator, submits
    the task to be performed. Typically, user accounts, established for these computers,
    grant the user permission to write data files on the execution host’s storage.
    There is nothing special about being a submission host, since any node in the
    cluster can submit jobs. In fact, jobs can be submitted by computers outside the
    cluster by invoking an xterm session on one of the cluster nodes, or by using
    the Motif based tool provided with the LSF software.


    The master host is the node where the LSF batch queues reside. When the LSF software
    initializes, one of the nodes in the cluster is elected to be the master host.
    This election is based on the order of nodes listed in a configuration file. If
    the first node listed in the configuration file is ineffective, the next node
    is chosen, and so forth.


    The execution hosts are the nodes where the jobs will be executed. A master host
    can function as an execution host and usually does. If a node fails while a job
    is running, the job is lost, but no other nodes are affected. The failed node
    is then marked as offline in the cluster and no further jobs will be sent to it.
    All failed jobs are re-scheduled on another available host.


    Setting up an LSF cluster requires some planning. Besides configuration data on
    each execution host, care must also be taken to ensure that the batch job has
    access and correct permissions for reading and writing data files. Also to avoid
    a single point of failure, it is a good idea to implement the LSF software’s high
    availability features.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Setting Correct Permissions


    Correct permissions are required at several levels to run batch jobs.


    # File Access within a Cluster


    At some point, the batch jobs that run in the LSF cluster will need to write data
    to a file system. Since the batch job runs with the same access rights as the
    user who submits it, that user must have appropriate permissions to access files
    that the batch jobs requires. Also, the data files, which are required, must be
    accessible to the host that is running the job.


    The easiest way to ensure file accessibility is to NFS mount the file systems
    containing all systems in the cluster and use NIS for authentication. Alternatively,
    the LSF software can be configured to copy the required files to the host running
    the job, then copy back when the job is complete.


    > Note If the LSF software is used in a mixed environment of Solaris and Windows
    NT servers, NFS can be used as long as the LSF client on Windows NT supports the
    Universal Naming Convention. Since mounting disks on drive letters is not performed
    until a user logs in, these type of mounts will not work in an LSF cluster.


    # Host Authentication Considerations


    When a batch job or a remote execution request is received, the LSF software first
    determines the user''s identity. Once the user''s identity is known, the LSF software
    decides whether it can trust the requests it come from.


    The LSF software normally allows remote execution by all users except root. The
    reason for this is that by configuring an LSF cluster you are turning a network
    of machines into a single computer. Users must have valid accounts on all hosts.
    This allows any user to run a job with their own permission on any host in the
    cluster. Remote execution requests and batch job submissions are rejected if they
    come from a host not in the LSF cluster.


    # User Account Mapping


    By default, the LSF software assumes uniform user accounts throughout the cluster.
    This means that a job will be executed on any host with exactly the same user
    ID and user login name.'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'The LSF software has a mechanism to allow user account mapping across dissimilar
    name spaces. Account mapping can be done at the individual user level or system
    level.


    # High Availability Features


    The LSF software has several features that assure high availability. The following
    diagram shows the failover features of the LSF software.


    ![](img/52144374747884a32fdddbed4e8cd9d7_299_0.png)


    In the above diagram there are four LSF servers, or hosts, connected to a fileserver.
    Although only a single fileserver is shown, in reality, this could be a pair of
    fileser in a HA cluster. The fileserver contains two key files: lsf.cluster and
    lsb.events.


    The file lsf.cluster is the main configuration file LSF uses. All the names of
    the hosts in the LSF cluster are listed in this file along with the resources
    each has. By default, the host that appears first in lsf.cluster becomes the master
    host. As the master host, this node is responble for maintaining the batch queues
    and launching jobs.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'The lsb.events is a log of jobs that have run and their current status. This
    file is updated by the master host. It is usually kept on a separate server or
    replicated if it is kept on a local disk.


    In the event of a master host failure, the LIMs on the surviving nodes perform
    an election to determine which node should become the new master. The rule is
    to choose the next host listed in the lsf.cluster. Once a new master host is established,
    control of the lsb.events log is transferred to it. The LSF software also has
    an option to keep a copy of lsb.events on the master host. In the event the fileserver
    fails, the second copy of lsb.events prevents a single point of failure.


    # Parallel Jobs with Sun HPC


    The Sun High Performance Computing (HPC) product suite provides an environment
    for running compute intensive parallel applications. These applications are written
    using the Sun MPI libraries and launched using the LSF software. These are typically
    scientific applications written in scientific programming languages such as FORTRAN.


    # Parallel Job Support in LSF Software


    Applications that are too compute-intensive to run effectively on a single computer,
    can be broken into smaller pieces that can run simultaneously on several computers.
    A popular method for creating parallel applications is to create the application
    using the Message Passing Interface (MPI).


    To execute a parallel application under the LSF software, it must first be compiled
    with the MPI libraries. The following diagram shows the job execution flow of
    a parallel application.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_301_0.png)


    FIGURE **10-4** Job Execution Flow of a Parallel Application


    The Master Batch Daemon (MDB) dispatches the job based on data obtained from the
    Load Information Manager (LIM). The MBD then contacts a Slave Batch Daemon (SBD),
    which starts the Parallel Application Manager (PAM) on one of the execution hosts.
    The PAM then dispatches pieces (tasks) of the job to other execution hosts in
    the LSF cluster.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Other Similar Products


    The LSF software is a very complete offering and was chosen by Sun for that reason:
    but it is not the only batch system product available. Other products are listed
    below.


    # Distributed Queuing System


    The Distributed Queuing System (DQS), from Florida State University is available
    in the public domain. The set of system resources it understands includes:


    +   - Host (by name)

    - System architecture

    - Operating system type

    - Amount of memory

    - CPU usage


    Users can start xterm sessions via interactive queues and some built-in support
    for PVM jobs is available. Limited high availability features are included since
    the master scheduler cannot migrate to another host.


    # Network Queuing System


    Network Queuing System (NQS) is public domain software that has been enhanced
    by many hardware vendors. Sterling Software offers a distributed version of NQS
    called NQS/Exec that is geared towards a supercomputer environment. Limited load
    balancing is provided as there is no concept of demand queues, utilizing traditional
    push queues instead. There is also no control over interactive batch jobs.


    # Load Balancer


    Load Balancer from Freeman Sharp and Associates, Inc., uses a single master queue
    for all jobs and only uses CPU usage as the sole metric for load balancing. Like
    NQS, the master queue scheduler cannot migrate to another host; thus it represents
    a single point of failure.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# LoadLeveler


    Loadleveler, from IBM, is a product based on the public domain Condor package
    developed at the University of Wisconsin. It is supported on AIX, IRIX, and SunOS
    and is compatible with NQS. Load balancing is based solely on CPU usage.


    # Task Broker


    Task Broker, from Hewlett-Packard, is available on HP, Sun, and RS6000 platforms.
    It operates by having hosts bid for a job. The integer value of the bid returned
    from potential target hosts is either hard coded or determined by an affinity
    script which the system manager can define.


    With Task Broker, the resources required by specific tasks are preconfigured by
    the system manager. Users do not have control over which resources can be used
    to run a particular task.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# CHAPTER 11


    # The Jiro Initiative


    Jiro is an industry wide initiative sponsored by Sun Microsystems, Inc. that will
    deliver a standard, open platform for storage software development and management.
    The initiative is managed through Sun''s Java Community Process (JCP), in which
    the community directs the content and the development of a standard infrastructure
    for the management of storage resources using the Java (and Jini) technologies.


    The Jiro initiative uses the Java Community Process (JCP) in the development of
    standard specifications. The JCP enables the resulting APIs to be extensions to
    the Java Platform, while the execution of the Sun Community Source License (SCSL)
    provides the licensee access to the source code. The result of the community process
    is a set of specifications that provides guidelines and standards for the development
    of storage management applications.


    # The Storage Management Problem


    Currently, no end-to-end software development standards for the storage industry
    are available. As a result, vendors have to develop individual, proprietary interfaces
    to all the other components in the system, thereby making the management process
    highly complex. Customers face vendor lock-in with difficult choices between competing
    systems. For example, Veritas has to develop different interfaces for Sun StorEdge,
    EMC, and ClarION. In addition, storage management is difficult, because each vendor
    chooses a different user interface, and there is no simple way today to administer
    all the server and storage resources necessary to ensure optimum performance for
    the entire system.


    With Jiro, Sun takes a leadership position in an industry initiative to develop
    an open standards based on software management platform for the storage industry.
    The platform applies to any environment that supports Java Virtual Machine (JVM),
    including both the Solaris operating environment and Microsoft Windows NT.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Storage Solution Requirements


    The Jiro Initiative provides an enabling technology designed to facilitate the
    development of enterprise storage management solutions. This technology enables
    storage solutions having the following requirements:


    +   - Simple Storage Management—The management of storage must be accomplished
    through a high level of abstraction.


    +   - High Integrity Management—The integrity of the management operations must
    be assured.


    +   - Simple Programming Model—The learning curve required for adoption must be
    minimized.


    +   - Remote/Distributed Management—The solution must be accessible remotely without
    regard to distance and network topology.


    +   - Centralized View of Management—The solution must be able to access a wide
    domain from a single location.


    +   - Automated Management—The solution must allow software that minimizes the
    manual intervention necessary for complex and tedious steps.


    +   - Flexibility for Future Solutions—The solution must allow composition with
    other solutions into new applications outside the scope of the original design.


    +   - High Availability Management—The solution must be tolerant of the loss of
    a management server.


    +   - Non-Compounding Management—The solution itself must not itself be a management
    problem.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# The Jiro Solution


    The architecture of the solution is three tiered: the management client, the management
    logic, and the management resources. These are described in more detail below.


    # The Client Tier


    The client locates and communicates with the management logic as a proxy for the
    human administrator. As solutions are combined, a solution is considered a client
    when it utilizes the interface designed for client interactions. In this respect,
    a client is a relative relationship between solutions.


    # The Management-Logic Tier


    The management logic provides simple management components that can be assembled
    together to provide complete management solutions. Management-logic servers host
    these components on either shared servers or private servers. Shared servers are
    available across managed resources provided by different vendors. Private servers
    are components private to the managed resource. In a domain, groups of shared
    and private servers are called a federation of management servers and are the
    deployment target for management components.


    # The Resources Tier


    The resources include both the framework resources, which are used exclusively
    by the management server framework, and the component resources, which are used
    exclusively by management components. Framework resources include state and behavior
    servers. Component resources include managed resources such as storage devices
    and storage software. Framework resources provide the underlying technology support
    that is the core of this enabling technology, providing the base services and
    infrastructure to support the requirements of storage solutions. Component resources
    for storage management are represented as Managed Objects (MO), with local representation
    of these objects being Managed Object Proxies (MOP). The MOs themselves are based
    on the Common Information Model (CIM).'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# # Jiro and Resource Management

    Possibilities


    The Jiro core enables resource management of the capacity, performance, and availability
    of data storage. Storage can be managed to a Storage Service Level, elevating
    the level of storage to where users, not the administrators, think about it. Backup
    and archival policies can be used to automate migration of data to a tape library.
    Measurements of capacity and performance characteristics are combined with availability
    policies, and the operator will be alerted of any problems. Ultimately storage
    subsystems will be reconfigured automatically.


    Jiro provides the platform on which SLAs can be established. At present, Jiro
    does not include a general rule script-based policy engine. Policies are embedded
    in the Java code for component and configuration management.


    Integration between the system viewpoint and the storage viewpoint has some of
    the same problems as integration of system and network viewpoints. The traffic
    on the SAN does not contain any indication of which user or process generated
    the request. Within the Solaris software it is possible to trace storage accesses
    on a per-process per-device basis, but the overhead of collecting and analyzing
    this data is quite high. There may be a need for a Jiro-based Bandwidth Manager
    that bridges multiple management viewpoints.


    # # Jiro Architecture


    The core of Jiro is based on Java and Jini technology. It also includes a distributed
    object model (DOM). A set of base services, such as scheduler, logging, notification,
    and persistence, is offered to enable components to be built based on the Jiro
    platform. These fundamental services are required by most applications, so the
    developer does not need to implement these base services and can add more value
    in their core competency.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_308_0.png)


    FIGURE 11-1 Jiro Architecture


    # # Object Model


    The object model extends the Java technology-based object model to add distributed
    operations. This extension provides a simple mechanism to communicate with remote
    objects. The framework used to extend the Java technology-based object model is
    referred to as the Distributed Object Kernel (DOK). A summary of the major enhancements
    to achieve the distributed operations follows:


    +   - Proxies—The distributed equivalent of an object reference. A proxy to an
    object supplies a handle to a remote object in the system. The proxy concept allows
    the distributed operations conducted on classes and objects to function similarly
    to those on a local class or object.


    +   - Logical Threads—The distributed implementation of a thread or flow of control
    for a local operation. The use of logical threads allows the distributed framework
    to be able to understand and handle concurrency control in the system.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '+   Composite Exception—This provides a familiar way of generating exceptions
    in the distributed framework that is intuitive to the programmer of the Java programming
    language. It provides the convenience of allowing multiple exceptions to be composed
    and gathered from distributed points in a uniform manner.


    +   Internationalization—The framework contains all of the necessary support for
    internationalization of management applications. It does this in a non-intrusive
    and uniform manner to promote clear and concise localizations.


    +   Security—Due to the distributed additions to the Java technology based object
    model, security becomes a high concern. The framework provides a security solution
    that restricts management applications to authorized usage and protects vital
    storage systems from intrusion.


    # Component Model


    The component model provides support for the construction of applications from
    components. Thus, it is primarily concerned with how components are deployed and
    assembled. The framework provides an environment that enables the components to
    be deployed and assembled by providing the following:


    +   ORB—The management server is a specialized object request broker that has
    been decorated for storage management.


    +   Execution Environment—Provides the core platform supports the solution software.


    +   Logging—Provides the ability to track operations and instantiations of components
    in the system.


    +   Notification—Provides the ability for a uniform manner of event passing between
    components in the system and the user.


    +   Scheduling—Allows time-based operations of the components in the system.


    # The Java Community Process


    The JCP is a formal process for developing high-quality Java technology specifications
    in “Internet-time” using an inclusive, consensus building process that not only
    delivers the specification, but also the reference implementation and its associated
    suite of compatibility tests.


    JCP suggests that the best way to develop a specification is to start with a handful
    of industry experts who have a deep understanding of the technology in question
    and then have a strong technical lead work with them to create a first draft.
    Consensus is'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'then built using an iterative review process that allows an ever-widening audience
    to participate and to see their comments and suggestions incorporated into successive
    draft versions of the specification prior to its final release.


    The expert groups established under the JCP, such as the Jiro Core Expert Group,
    will be responsible for individual specifications, proof-of-concept Reference
    Implementations (RI), and Compatibility Test Suites (CTS) within the Jiro initiative.


    # Momentum Behind Jiro


    Jiro has obtained endorsements from many key vendors in the industry, who plan
    to use the Jiro Open Standard to simplify their developments and provide greater
    choice and ease of use to their customers.


    As this book goes to print in, Exabyte, Fuji, Hitachi Data Systems, Hitachi Computer
    Products, Legato, StorageTek, Sun, and Veritas form the initial Jiro Core Expert
    Group. This group will define the core specifications and corresponding reference
    implementation. In the following months, other expert groups may be formed in
    areas such as console, volume management, and backup.


    The benefits of the initiative will be substantial for end users, developers,
    and systems integrators. Jiro frees developers from tedious tasks such as porting
    multiple applications and interfaces to multiple platforms; thus, enabling resource
    vendors to concentrate on adding value for their customers. Jiro helps ISVs by
    enabling them to focus on creating new, high-value storage services and by broadening
    the market for storage services. Jiro also enables customers to save money on
    storage appliances by increasing the functionality and manageability of existing
    storage systems.


    More information on Jiro can be obtained from:


    ```

    http://www.sun.com/jiro/

    ```'
  merge: -1
  pgno: 310
