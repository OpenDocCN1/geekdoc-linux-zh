  md: 'specified processes. If a process is composed of multiple LWs, which have different
    bindings, the bindings of only one of the bound LWPs will be shown. If no argument
    is given, the processor set bindings of all processes is displayed.


    The -r option removes a list of processors from their current processor sets.
