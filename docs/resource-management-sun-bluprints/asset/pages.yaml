  md: "This situation can be avoided by configuring physical memory in the system\
    \ so that there is always enough memory for each application's requirements. In\
    \ example shown in FIGURE 3-5, if we configured the system with 128 Mbytes of\
    \ memory, then both netscape and gimp could execute at the same time without affecting\
    \ each other.\n\nHowever, there is another consumer of memory in the operating\
    \ system that often causes application starvation. That is the file system. The\
    \ system uses memory from the free memory pool just like any other application\
    \ in the system. Because the memory system implements equal importance by default,\
    \ the file system can squeeze applications the same way gimp did in FIGURE 3-5.\
    \ Reading a file through the file system causes the system to use physical memory\
    \ to cache the file. This memory is consumed in 8-kilobyte chunks as the file\
