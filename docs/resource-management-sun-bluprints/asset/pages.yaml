  md: '![](img/52144374747884a32fdddbed4e8cd9d7_269_0.png)


    FIGURE 9-7 Solaris Bandwidth Manager Architecture


    # # Java Dynamic Management Kit


    The administration tool and the policy agent are implemented using the Java Dynamic
    Management™ Kit.


    The Java Dynamic Development Kit is a JavaBeans based framework for developing
    and deploying dynamic management based applications. Autonomous agents can be
    deployed in real-time to perform management tasks for devices on the network.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'A Java Dynamic Management Kit consists of a lightweight framework that runtime
    JavaBeans components can be plugged in to. These management beans (or m-beans)
    can be dynamically pushed to the agent with push and pull technology built into
    the Java Dynamic Management Kit. Management applications operate on the methods
    of the instantiated m-beans.


    Communication services between the Java Dynamic Management Kit agent and the management
    application are implemented through protocol adapters which are also JavaBeans-based.


    # Agent side Manager side


    ![](img/52144374747884a32fdddbed4e8cd9d7_270_0.png)


    +   - C-bean

    - M-bean


    Bundled protocol adapters exist for RMI, HTTP and SNMP. A Java MIB compiler can
    integrate existing SNMP device management directly in the Java Dynamic Management
    Kit agent, and agents can be managed by traditional SNMP applications, as well
    as Java and web-based applications.


    For more information regarding Java Dynamic Management Kit, see http://www.sun.com/software/java-dynamic.


    # The Administration Tool


    The Solaris Bandwidth Manager administration tool (batool) is a Java application
    that can run on client platforms such as Windows or Solaris. It communicates with
    the Policy Agent (see below) over the HTTP protocol, which makes it easy to run
    remotely, when firewalls are configured between the management client and the
    Bandwidth Manager station running the Policy Agent. Use the GUI to control the
    m-beans running in the Policy. The m-beans in turn control the Solaris Bandwidth
    Manager application configuration.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# The Policy Agent


    The Policy Agent is an instance of the Java Dynamic Management Kit framework,
    in which several management JavaBeans (m-beans) are configured. The Policy Agent
    runs on the same machine as the Solaris Bandwidth Manager software.


    ![](img/52144374747884a32fdddbed4e8cd9d7_271_0.png)


    FIGURE 9-8 Policy Agent Components


    The m-bean interfaces are documented in the Solaris Bandwidth Manager documentation
    set, and you can develop custom management applications and GUI’s using them.


    # Configuration m-bean


    The configuration m-bean handles configuration issues such as reading the configuration
    file, or updating the Solaris Bandwidth Manager configuration dynamically when
    a directory event happens (such as a new user logging in to the'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'network). The event-driven model of the m-bean allows the Solaris Bandwidth
    Manager software to adapt to changing network behavior in real-time, which is
    is powerful concept.


    # Directory m-bean


    The directory m-bean contains information used when interacting with a directory
    service. Listeners can be configured to wait for certain directory events and
    react appropriately.


    When configured with a directory server such as the Sun Directory Server 3.1 software,
    the Policy Agent is configured as a replica of the Directory Server. When the
    Directory gets updated, for example when a new user dial in through the RADIUS
    server, then the directory replication mechanism can immediately update the Solaris
    Bandwidth Manager configuration.


    # Statistics and Accounting m-bean


    This m-bean uses the JDBC interface to write flow statistics to a text file, after
    each 30 seconds of flow activity.


    # Configuration Interface


    Communicates the configuration interface between the Policy Agent and the kernel.
    Also used by SNMP monitoring.


    # Accounting Interface


    Communicates statistics and accounting information between the Policy Agent and
    the kernel. Also used by SNMP monitoring, and by the C statistics API.


    # LDAP Directory Integration


    Solaris Bandwidth Manager configuration and policy information can be stored in
    a directory service such as the Sun Directory Services 3.1 software. The advantage
    of storing configuration and policy information in a directory instead of a configuration
    file is that the configuration can be dynamically updated upon detection of user'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'connections or traffic flows. It also makes it possible to update the configuration
    of multiple instances of the Solaris Bandwidth Manager software from a single
    point: the directory.


    When a remote user connects to the network through a remote access server or network
    access server (NAS) using the RADIUS protocol, the IP address of the user''s point
    of presence can be dynamically recorded in the user''s entry. The policy agent
    detects this information and triggers a change to the dynamic configuration, to
    add the required policies for traffic associated with this user.


    You can also write an application to detect the start of a flow, or update the
    configuration to take account of that flow. To support this dynamic configuration,
    you need a way to store information about the policies to be applied to traffic
    in a new flow. A directory service, such as the Sun Directory Services 3.1 software,
    can be used to handle the policy rules and relate to a new flow.


    When you want to ensure consistency in configuration for multiple instances of
    the Solaris Bandwidth Manager software, a directory is the ideal location for
    storing and modifying the configuration. Using standard directory replication
    processes, the configuration can be loaded into the policy agents, rather than
    configuring each one individually.


    # Directory Enabled Networks


    Computer networks are becoming increasingly complex to manage. Currently, most
    network devices are independently, and mostly statically configured. Effective
    resource management is not feasible using this model. Ideally, higher level SLAs
    and policies would be automatically translated in dynamic network configuration
    changes. To achieve this, some kind of centralized view of the network is needed,
    and directories (such as LDAP based ones) are an ideal match for this.


    Currently, directories store most user and application information. The goal of
    the Directory Enabled Networks working group (DEN) is to offer a standard information
    model and directory schemas to tie users and applications with network elements,
    protocols, and services through specific relationships. By complying with this
    information model and the DEN schemas, different network equipment and application
    vendors should be able to build interoperable network elements around a central
    directory.


    Instead of duplicating work that already has been done, the DEN working group
    is using work done by the Desktop Management Task Force (DMTF), which already
    has an information model called CIM (Common Information Model) for managing computer
    systems. DEN is using the CIM schema as much as possible, and has been'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'extending it to add network information specific. Because of the close relationship
    between the DEN information model and CIM, the DEN draft recently been transferred
    to the DMTF group for review and approval.


    The Solaris Bandwidth Manager software is DEN compliant. The LDAP schema used
    based on DEN schemes, and the schema extensions that were defined for the Solaris
    Bandwidth Manager software are documented in the product manuals.


    # # Monitoring, Accounting, and Billing


    The Solaris Bandwidth Manager software provides real-time statistics on resource
    usage as well as SLA commitment level information (when combined with the right
