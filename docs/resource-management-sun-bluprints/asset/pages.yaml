  md: '# Protocol Statistics


    To view TCP, UDP, IP, ICMP, and IGMP statistics, you can use netstat -s. The command
    prints lots of protocol-specific information. Adrian Cockcroft and Rich Petit
    describes this in their book Sun Performance and Tuning, Java and the Internet.
    The more interesting counters are incorporated into the SE Toolkit script nx.se.
    The output of nx.se looks as follows:


    ```

    % /opt/RICHPse/bin/se nx.se

    Current tcp RtoMin is 200, interval 5, start Thu Aug 27 00:23:09 1998

    00:23:14 Iseg/s Oseg/s InkB/s OukB/s Rst/s Atf/s Ret* Icn/s Ocn/s

    tcp 0.0 0.2 0.00 0.01 0.00 0.00 0.0 0.00 0.00

    Name Ipkt/s Opkt/s InkB/s OukB/s IErr/s OErr/s Coll* NoCP/s Defr/s

    hme0 1.2 1.2 0.09 0.20 0.000 0.000 0.0 0.00 0.00

    hme1 0.0 0.0 0.00 0.00 0.000 0.000 0.0 0.00 0.00

    hme2 0.0 0.0 0.00 0.00 0.000 0.000 0.0 0.00 0.00

    ```


    The script lists TCP as if it were an interface, with input and output segment
    and data rates, resets per second, outgoing connection attempt fails per second,
    percentage of bytes retransmitted, and incoming and outgoing connections per second.
    It then lists all interfaces. For interfaces that provide this information as
    present, only le and hme) nx.se reports kilobytes in and out. NoCP is nocanput.
    This counts the number of times a received packet was discarded due to slow processing
    in the TCP/IP stack and lack of buffering on input. Defr shows the number of defers
    that took place. A deffer happens when an Ethernet tries to send out a packet,
    but it finds the medium to be busy, and has to hold off (defer) the sending until
    the line is clear.'
