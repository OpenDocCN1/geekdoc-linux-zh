    # Data Access Permissions


    To access process data you must have access permissions for entries in /proc or
    run as a setuid root command. In the Solaris 2.5.1 release, using the ioctl access
    method for /proc, you can only access processes that you own, unless you log in
    as root, or use the ps command In the Solaris 2.6 release, although you cannot
    access the /proc/pidentry for every process, you can read /proc/pid/psinfo and
    /proc/pid/usage for every process. This means that any user can use the full functionality
    of ps and the process. The code for process_class.se conditionally uses the new
    Solaris 2.6 access method and the slightly changed definition of the psinfo data
    structure.


    # Microstate Accounting


    Microstate accounting is not turned on by default. It slows the system down slightly.
    It was on default until the Solaris 2.3 release. From the Solaris 2.4 release,
    on, it is enabled the first time you use ioctl to read the data. For the Solaris
    2.6 access method, the process flags that enable microstate data collection and
    the inherit on fork option must be set directly via the /proc/pid/ctl


    The CPU time is normally measured by sampling 100 times a second, the state of
    all the CPUs from the clock interrupt. Microstate accounting works as follows:
    A high-resolution timestamp is taken on every state change, every system call,
    every page fault, and every scheduler change. Microstate accounting doesn''t miss
    anything, and the results are much more accurate than from sampled measurements.
    The normal measures of CPU usage and system time made by sampling can be wrong
    by 20 percent or more because the sample is biased, not random. Process scheduling
    uses the same clock interrupt to measure CPU usage. This approach leads to systematic
    errors in the sampled data. The microstate-measured CPU usage data does not suffer
    from those errors.


    Chapter 5 Workload Measurements 97'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'For example, consider a performance monitor that wakes up every ten seconds,
    reads some data from the kernel, then prints the results and sleeps. On a fast
    system, the total CPU time consumed per wake-up might be a few milliseconds. On
    exit from the clock interrupt, the scheduler wakes up processes and kernel threads
    that have been sleeping until that time. Processes then consume less than their
    allotted CPU quanta runs at the highest timespriority. On a lightly loaded system
    there is no queue for access to the CPU, so immediately after the clock interrupt,
    it is likely that the performance monitor will be scheduled. If it runs for less
    than 10 milliseconds, it will have completed and be sleeping again before the
    next clock interrupt. If you remember that the only CPU time allocated is based
    on what was running when the clock interrupt occurs, you can see that the performance
    monitor could be sneaking a bit of CPU whenever the clock interrupt isn''t looking.
    When there is a significant amount of queuing for CPU time, the performance monitor
    is delayed by a random amount of time, so sometimes the clock interrupt sees it,
    and the error level decreases.


    The error is an artifact of the dual functions of the clock interrupt. If two
    independent, unsynchronized interrupts are used (one for scheduling and one for
    performance measurement), then the errors will be averaged over time. Another
    approach to the problem is to sample more frequently by running the clock interrupt
    more often. This does not remove the bias, but it makes harder to hide small bites
    of the CPU. The overhead of splitting the interrupts is not worth implementing.
    You can increase the CPU clock rate to get more accurate measurements, but the
    overhead is higher than using microstate measurement, which is more useful and
    accurate because it measures more than just CPU activity.


    The case where this problem matters most is when a sizing exercise occurs by measuring
    a lightly loaded system, then scaling the results up for a higher load estimate.
    Performance models that are calibrated at a light load also suffer from this problem.
    The best solution is to use a microstate accounting-based tool, or to disable
    some of the CPUs so that the measurements are made on a fairly busy system.


