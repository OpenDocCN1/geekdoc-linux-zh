  merge: -1
  pgno: 189
- img_proc: true
  md: 'Proc mem limit [memory.plimit]


    Limit the amount of virtual memory a single cgi-bin process can use. This will
    stop any cgi-bin process from bringing down its respective web server.


    Process limit [process.limit]


    Set the maximum number of processes allowed to attach to a web server. This will
    effectively limit the number of concurrent cgi-bin processes.


    # Creating a Policy on Executable Name


    In some cases, it may be useful to construct a hierarchy that allocates resources
    based on the application which each user is executing. Use the srmusr command
    and wrappers around the executables.


    Create a different point in the hierarchy for each application type. Then authorize
    users to switch innodes as they execute each application.


    ![](img/52144374747884a32fdddbed4e8cd9d7_190_0.png)


    FIGURE 7-9 A Hierarchy Allowing Policies by Executable Name'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'The simple hierarchy shown in FIGURE 7-9 is established using the limadm command
    and makes Chuck and Mark children of the users group, and makes app1 and app2
    children of the applications group:


    ```

    # limadm set group=root users

    # limadm set group=users chuck

    # limadm set group=users mark


    # limadm set group=root apps

    # limadm set group=apps app1

    # limadm set group=apps app2

    ```


    Give both Chuck and Mark permission to switch Inodes on their child processes.
    This allows you to attach /usr/bin/app1 to the app1 Inode and /usr/bin/app2 to
    the app2 Inode.


    ```

    # limadm set flag.admin=s chuck

    # limadm set flag.admin=mark

    ```


    Allocate shares to both applications in the desired proportions:


    ```

    # limadm set cpu.shares=20 app1

    # limadm set cpu.shares=1 app2

    ```


    Now use the srmuser command to create a simple wrapper script to set the appropriate
    Inodes upon execution of the applications:


    ```

    #!/bin/sh

    #

    # Execute /usr/bin/app1 and attach it to the app1 Inode

    #

    usr/srm/bin/srmuser app1 /usr/bin/app1

    ```


    # The Role and Effect of Processor Sets


    Even with the SRM software in effect, processor sets may still play an important
    role. Sometimes a system must have hard limits applied to the resource policies.
    Suppose a company purchases a single 24-processor system, and then hosts two different
    business units from the same machine. Each of the business units pays for'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'a proportion of the machine, 40 percent and 60 percent in our example. In this
    case, the IT department may want to enforce that the business that paid for 40
    percent of the machine never gets more than 40 percent. This might seem selfish,
    but in reality if the second business uses only 10 percent of the machine for
    the first two months, the first business unit will become accustomed to 90 percent
    of the machine. When they are eventually reduced to their allocated 40 percent,
    response times will increase and users will comply.


    With processor sets, it is possible to divide the workloads into 40 percent and
    60 percent by allocating 10 and 14 processors to each of the business units. At
    no point in the future will either of the business units allocation of processor
    resource reduce, avoiding the drop in response times.


    See "Processor Sets" on page 123 for detailed information on the use of processor
    sets for resource management.


    Processor sets were introduced in the Solaris 2.6 release, and can co-exist with
    the SRM software. Some attention should be made to the interaction between these
    two technologies, as in some circumstances the net effect can be different from
    what was originally expected.


    # SRM Software and Processor Sets: A Simple Example


    FIGURE 7-10 shows a simple scenario where processor sets and SRM CPU shares are
    mixed. User 1 has 25 SRM shares, and is restricted to processor set A (1 CPU).
    User 2 has 75 SRM shares, and is restricted to processor set B (1 CPU).


