    \ |\n| r1m | run queue length | processes | increasing | 1 minute | 15 seconds\
    \ |\n| rl15m | run queue length | processes | increasing | 15 minutes | 15 seconds\
    \ |\n| ut | CPU utilization | percent | increasing | 1 minute | 15 seconds |\n\
    | pg | paging activity | in+pages pages per second | increasing | 1 minute | 15\
    \ seconds |\n| ls | logins | users | increasing | N/A | 30 seconds |\n| it | idle\
    \ time | minutes | decreasing | N/A | 30 seconds |\n| swp | available swap space\
    \ | megabytes | decreasing | N/A | 15 seconds |\n| mem | available memory | megabytes\
    \ | decreasing | N/A | 15 seconds |\n| tmp | available temporary space | megabytes\
    \ | decreasing | N/A | 120 seconds |\n| io | disk I/O | kbytes per second | increasing\
    \ | 1 minute | 15 seconds |\n\nThe status index is a string indicating the current\
    \ status of the host. The possible values are:\n\n+   - ok\n  The host can be\
