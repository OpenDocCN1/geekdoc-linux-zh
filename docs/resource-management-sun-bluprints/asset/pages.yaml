  md: '# Statistics


    Statistics information includes per class and per flow statistics:


    +   - number of bytes and number of packets sent

    - number of bytes and number of packets dropped

    - average throughput

    - number of borrows from a class to its parent


    # Monitoring Statistics


    Statistics and accounting information can be extracted from the Solaris Bandwidth
    Manager software in several ways:


    +   - Statistics can be accessed directly and displayed graphically through the
    Java administration tool or manually through a command line utility.

    - Flow statistics can be viewed from any billing or accounting package that is
    compatible with version 5 of Cisco''s NetFlow protocol. The Solaris Bandwidth
    Manager software can be configured to send NetFlow diagrams directly to a NetFlow
    FlowCollector application.

    - The Solaris Bandwidth Manager software has Java and C APIs for building standalone
    monitoring utilities or for integrating the Solaris Bandwidth Manager software
    statistics with existing monitoring systems.

    - A Solaris Bandwidth Manager-specific SNMP MIB is included with the Solaris Bandwidth
    Manager software. The MIB data can be extracted, processed, and viewed using an
    appropriate tool.


    # Interface with Accounting and Billing


    Statistics extracted from the Solaris Bandwidth Manager software can be input
    into accounting and billing systems. There are four output options:


    +   - ASCII format

    - NetFlow datagrams

    - Java and C APIs

    - SNMP'
