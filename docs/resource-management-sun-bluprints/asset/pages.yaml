    Disk configurations have become extremely large and complex on big server systems.
    The Starfire system supports a maximum configuration of several thousand disk
    drives, but dealing with even a few hundred is a problem. When large numbers of
    disks are configured, the overall failure rate also increases. It is hard to keep
    an inventory of all the disks, and tools like the SysMON software have to depend
    upon parsing messages from syslog to see if any faults are reported. The size
    of each disk is also growing. When more than one type of data is stored on a disk,
    it''s hard to determine which disk partition is active. A series of new features
    has been introduced in the Solaris 2.6 release to help solve these problems.


    +   - Per-partition data identical to existing peer-disk data


    It is possible to separate root, swap, and home directory activity if these file
    systems are on the same disk.


    +   - "Error and identity" data per disk


    You no longer need to scan syslog for errors. Full data is saved from the SCSI
    probe to a disk. This data includes vendor, product, revision, serial number,
    RPM, heads, and size. Soft, and transport error counter counters sum up any problems.
    The detail option adds the Media Error, Device not ready, No'
