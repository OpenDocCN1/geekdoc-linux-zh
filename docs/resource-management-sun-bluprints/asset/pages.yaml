- img_proc: true
  md: '# Solaris Bandwidth Manager Software and Type of Service


    To be completely flexible with ToS and Diff-Serv for current and future to be
    defined queuing behaviors, the Solaris Bandwidth Manager software can be configured
    to filter a packet for any possible value in the ToS field as the classification
    criteria, and packets can be marked and remarked in any possible way. It is up
    to the Solaris Bandwidth Manager administrator to give meaning to this in the
    context of the network where the Solaris Bandwidth Manager software is deployed,
    and the administrator is responsible for keeping the configuration compliant the
    standards (for example, with the Solaris Bandwidth Manager software, you can filter
    the last two bits of the DS header, even though they are currently defined to
    be unused.


    # HTTP Support


    The popularity of the World Wide Web is one of the main reasons that network traffic
    has skyrocketed so much over the last 5 years. Information is now easily accessible
    at everybody''s fingertips. For a large part, HTTP traffic is bound to destinations
    on the internet, and many corporations have had to upgrade their internet connection''s
    bandwidth or their network backbone as a result of this.


    Unfortunately, it is not easy to distinguish important business-critical HTTP
    traffic from less important traffic such as live sports scores or stock tickers.
    Because firewalls often block ports of protocols such as real-audio, vendors now
    start tunneling these protocols over port 80 (HTTP), and it is increasingly hard
    for network administrators to manage the network strain resulting from this. One
    option is to use Proxy Cache systems that filter unwanted traffic by refusing
    access to certain classes of web destinations, but it still doesn''address the
    need to prioritize the remaining web traffic on the network. For example, you
    could allow real-audio on the network as long as nobody else has a need for the
    required bandwidth.


    ISPs could give higher priority to URLs from customers who are willing to pay
    more.


    Web Hosting Providers could use HTTP prioritization to give higher priority to
    the web pages of visitors who are in the process of buying a product, rather than
    web pages for the customers who are merely browsing the online product catalog.'
  merge: -1
