    # Understanding I/O Measurements


    To really understand the data presented by iostat, sar, and other tools, you must
    look at the raw data being collected by the kernel, remember some history, and
    do some simple mathematics.


    In the old days, disk controllers controlled the disks directly. All the intelligence
    was in the controller. The disk heads were directly connected to the controller,
    and the device driver knew exactly which track the disk was reading. As each bit
    read from disk, it was buffered in the controller until a whole disk block was
    ready to be passed to the device driver.


    The device driver maintained a queue of waiting requests, which were served one
    at a time by the disk as shown in FIGURE 5-9. From this, the system could report
    the service time directly as milliseconds-per-seek. The throughput in transfers
    per second was also reported, as the percentage of the time that the disk was
    busy (the utilization). The terms utilization, service time, wait time, throughput,
    and wait queue length have well-defined meanings in this scenario because the
    setup is so simple that a very basic queuing model fits it. A set of simple equations
    from queuing theory can be used to derive these values from underlying metrics.


    ![](img/52144374747884a32fdddbed4e8cd9d7_140_0.png)


    I/Os waiting in device driver queue


    I/Os being serviced one at a time by the disk


    **FIGURE 5-9** Simple Old Disk Model


