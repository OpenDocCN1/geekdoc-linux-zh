  md: '# DR I/O Device Driver Requirements


    To support DR operations, I/O device drivers associated with the system that is
    to be attached or detached must be able to build (attach) and tear down (detach)
    all device instances spanning from its root.


    This section covers the specific device driver functions required to support DR,
    but it does not provide enough detail for software developers to create their
    own device drivers. I/O drivers intended to be supported by the DR framework must
    fully implement the following Solaris DDI/DKI (Device Driver Interface/Device
    Kernel Interface) entry points as in the Writing Device Drivers sections of the
    Developer Site 1.0 AnswerBookTM (http://docs.sun.com):


    +   - DDI_ATTACH (attach (9E))


    +   - DDI_DETACH (detach (9E))


    +   - DDI_SUSPEND


    An additional requirement to support DR is that drivers allocate memory directly
    through the page_create(), page_create_va() or through some kernel routines must
    not hold the memory pages locked for extended periods of time.


    The specific lock in question is the p_selock of the page_t structure typically
    acquired through the page_lock() routine. The p_selock is intended as a transient
    lock and holding the lock interferes with the memory drain required when a system
    is detached. The page_create(), page_create_va() and page_lock() routines are
    not DDI/DKI compliant interfaces and their use is strongly discouraged.


    > Note - In the Solaris 2.5.1 and Solaris 2.6 releases, the Starfire DR requires
    newly DR-compliant drivers to register the dr driver by introducing the following
    line in the /etc/system file: set dr:detach_safe_list1="driver2... driver n".
    In the Solaris 7 release, newly-created DR-compliant drivers are required to register
    the D_HOTPLUG bit in the cb_ops data structure.


    FIGURE 8-10 provides an abstraction of the I/O device file to explain the DR attach
    and detach functions. For example, the Starfire /devices/sbus@54,0/sunW, fas@sd2,0:a
    device file represents a SCSI disk registered with a fast/wide SCSI controller
    located on SBus0 of System board 5.


    When detaching a system board, the driver locates the device tree and traverses
    it from the bottom up to invoke the detach function on every leaf of the tree.'
  merge: -1
  pgno: 251
