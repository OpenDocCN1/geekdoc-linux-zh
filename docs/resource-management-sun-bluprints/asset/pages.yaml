- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_315_0.png)


    FIGURE 12-2 The SyMON Software Console


    Next, scroll down and choose the Health Monitor module. It may already be loaded
    if the SyMON software has been pre-configured. Otherwise, select it and press
    the OK button.'
