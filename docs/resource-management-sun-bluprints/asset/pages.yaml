    # Database Workloads


    Resource management of databases can be somewhat simplified by viewing the database
    as a “black box” and managing resources around it. This strategy is particularly
    useful when doing server consolidation because the main objective with consolidation
    is to partition one workload from an other.


    In most commercial database systems several packages interact with the database
    to provide the overall application environment to the user. The typical data center
    strategy is to consolidate more workloads onto each system. Resource management
    of the whole environment requires careful planning and a solid understanding of
    the interaction between these packages and the database.


    A look at a typical example where a single database instance provides database
    services for two different applications that require access to the same data,
    uncovers some of the complexities of database resource management. FIGURE 4-26
    shows a typical backend database server with a web application used for customer
    entry and an ad-hoc decision support user that generates large queries against
    a database.'
