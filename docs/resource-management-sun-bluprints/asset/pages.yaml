  md: 'memory allocation policy. But priority paging will ensure that the file system
    only uses free memory for file system caching. As the application grows and shrinks,
    the size of the file system cache will grow and shrink in keeping with the amount
    of memory on the system.


    # Network Interfaces and Network Services


    TCP/IP-based network services are configured using the /etc/services and /etc/inetd.conf
    files so that the server responds on a particular port number. Access controls
    are implemented by removing and enabling particular port specifications from these
    files. In addition, more sophisticated access controls look at the incoming request
    packets and can deny access from unauthorized networks. To relay high volumes
    of traffic in and out of a secured network, a firewall is used. Access policies
    can be based on the destination address, protocol, or port number.


    The Solaris Bandwidth Manager product provides controls on network traffic on
    each interface of a server. Chapter 9 explains how this product can be used as
    part of a resource control framework.


    Network resource managers distribute distribute traffic over multiple systems
    according to the current load on each system and the network delays between the
    end user and the available servers. Cisco Local Director and Resonate Central
    Dispatch, among other products, can be used to direct traffic within a single
    web site, while Cisco''s Distributed Director and Resonate''s Global Dispatch
    products distribute traffic over wide areas, routing the wide area network delays.
    Cisco''s products are implemented as hardware routers, while Resonate''s products
    run as a software package on the existing server systems.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Workload Management


    Application workloads can be understood in terms of the resources they consume
    on each of the systems that they are distributed across.


    Resource measurements are available at the system level and at the per-process
    level. Analysis of per-process measurements separates the raw data into application
    workloads. When several applications are consolidated onto a single system, resource
    contention can occur. Analysis determines which resource is suffering from contention
    and which application workloads are involved. This chapter describes several tools
    that help perform process-based analysis.


    This chapter also describes several diverse, real-life situations and the appropriate
    tools to use with them.


    +   - The first scenario covers resource management issues that occur in Internet
    service provider (ISP) environments.


    +   - The second scenario portrays at consolidated commercial workloads, which
    include databases and file services for UNIX systems using NFS and batch workloads.


    +   - The third scenario looks at batch workloads, which are required by most
    commercial installations.


    # Workload Analysis Tools


    In a distributed environment with discrete applications on separate systems, workloads
    are analyzed by monitoring the total resource usage of each whole system. The
    busiest systems can be identified and tuned or upgraded. This approach does not
    work when multiple workloads are combined on a single system. While all performance
    monitoring tools can tell you how busy the CPU is in total, few of them can aggregate
    all the processes that make up a workload and tell you the amount of resource
    per-user that workload is using.'
  merge: -1
  pgno: 66
- img_proc: true
