  md: 'We assume all disk commands complete fairly quickly, so the arrival and completion
    rates are the same in a steady state average, and the throughput of each is the
    same. We''ll use completions below because they seem more intuitive in this case.


    ```

    $C_{read} = completed reads = reads[end]-reads[start]$

    ```


    ```

    $X_{read} = read throughput = iostat rps = \frac{C_{read}}{T}$

    ```


    ```

    $C_{write} = completed writes = writes[end]-writes[start]$

    ```


    ```

    $X_{write} = write throughput = iostat wps = \frac{C_{write}}{T}$

    ```


    ```

    $C = total commands completed = C_{read} + C_{write}$

    ```


    ```

    $X = throughput in commands per second = iostat tps = \frac{C}{T}X_{read} + X_{write}$

    ```


    A similar calculation gets us the data rate in kilobytes per second.


    ```

    $K_{read} = Kbytes read in the interval = \frac{nread[end]-nread[start]}{1024}$

    ```


    ```

    $X_{kread} = read Kbytes throughput = iostat Kr/s = \frac{K_{read}}{T}$

    ```


    ```

    $X_{kwrite} = Kbytes written in the interval = \frac{nwritten[end]-nwritten[start]}{1024}$

    ```


    ```

    $X_{kwrite} = write Kbytes throughput = iostat Kw/s = \frac{K_{write}}{T}$

    ```


    ```

    $X_k = total data rate in Kbytes per second = iostat Kps = X_{kread} + X_{kwrite}$

    ```


    Next, we obtain the utilization or the busy time as a percentage of the total
    time:


    ```

    $U_{wait} = wait queue utilization = iostat %w = \frac{100 \times B_{wait}}{T_{hires}}$

    ```


    ```

    $U_{run} = run queue utilization = iostat %b = \frac{100 \times B_{run}}{T_{hires}}$

    ```'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Now, we get to service time, but it is not what iostat prints out and calls
    service time.

    This is the real thing!


    $S_{wait} = average wait queue service time in milliseconds = \frac{B_{wait}}{C
    \times 100000}}$


    $S_{run} = average run queue service time in milliseconds = \frac{B_{run}}{C \times
    100000}}$


    The meaning of $S_{run}$ is as close as you can get to the old-style disk service
    time.

    Remember that the disk can run than one command at a time and can return those
    commands in a different order than they were issued.


    The data structure contains an instantaneous measure of queue length, but we want
    the average over the time interval. We get this from that strange "length time"
    product by dividing it by the busy time:


    $Q_{wait} = average wait queue length = iostat wait = \frac{QB_{wait}}{B_{wait}}$


    $Q_{run} = average run queue length = iostat actv = \frac{QB_{run}}{B_{run}}$


    Finally, we get the number that iostat calls service time. It is defined as the
    queue length divided by the throughput, but it is actually the residence or response
    time and includes all queuing effects:


    $R_{wait} = average wait queue response time = iostat wsvc\_t = \frac{Q_{wait}}{X}}$


    $R_{run} = average run queue response time = iostat asvc\_t = \frac{Q_{run}}{X}}$'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Another way to express response time in terms of service time and utilization:


    $R_{wait} = average queue response time prediction = iostat wsvc\_t = \frac{S_{wait}}{1-B_{wait}}$


    $R_{run} = average queue response time prediction = iostat asvc\_t = \frac{S_{run}}{1-B_{run}}$


    This uses a theoretical model of response time that assumes as you approach 100
    percent utilization with a constant service time the response time increases to
    infinity.


    The real definition of service time is the time taken for the first command in
    line to be processed. Its value is not printed out by iostat. Using the SE Toolkit,
    the deficiency is easily fixed. A corrected version of iostat written in SE prints
    out the data, using the format shown in FIGURE 5-12.


    ```

    % se iostat -se 10--------------------------------active queue----

