- img_proc: true
  md: '# # Setting Decay and Scheduler Parameters


    The default values for usage decay and process priority decay are suitable in
    most situations because they include usage history over a relatively large window
    (about 1 minute) yet stop any process from completely monopolizing the CPU for
    short periods. The default parameters particularly suit interactive workloads,
    where different shares can be given to users without affecting keyboard response.
    Different behaviors can be achieved using different decay factors for other workloads,
    such as HPC or batch environments.


    Decay and scheduler parameters are global, and may be set with the `srmadm` command,
    which must be run as root. The parameter changes take effect immediately and do
    not require a reboot or restarting of any `srm` processes.


    ```

    # srmadm set useddecay=240

    ```


    The full list of parameters that can be set with the `srmadm` command are shown
    in TABLE 7-2.


    TABLE 7-2 SRM Scheduler Parameters


    | Decay Parameter | Description |

    | --- | --- |

    | delta=[seconds] | The run interval for the SRM CPU scheduler. This is the time
    interval that elapses between recalculations of the normalized usages of all active
    users. The normalized usage affects the priorities of a user''s processes, so
    larger values of delta effectively reduce the short-term responsiveness of the
    scheduler. |

    | maxusage=[float] | The upper bound for CPU usages used in the priority calculation.
    Users with usages larger than this will use this value for their priority calculation.
    This prevents users with high CPU usages from skewing the priorities of other
    users. |

    | usedecay=[seconds]] | The decay rate for users'' usages, expressed as a half-life
    in seconds. The optional suffix character h may be used to specify the value in
    hours. |'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# TABLE 7-2 SRM Scheduler Parameters


    | Decay Parameter | Description |

    |---|---|

    | decayrate[={seconds hours[h]]] | The decay rate for the priorities of processes
    with normal and maximum nice values respectively, expressed as half-lives. The
    decay rates for other values are interpolated between these two and extrapolated
    down to minimum nice. The second value must be greater than the first. |

    | limshare=y,n] | When this parameter is enabled, the SRM CPU scheduler applies
    its priority clearing feature to limit all users'' effective shares to prevent
    extremely low-usage users from briefly acquiring almost 100 percent of CPU. Use
    the enabled state.

    | The rate of CPU service for a user is roughly proportional to the user''s usage.
    If users have not been active for a very long time, then their usage decays to
    near-zero. When such a user logs in (or the Inode becomes active in any way),
    then, for the duration of the next interval, the user''s processes could have
    high priority that they monopolize the CPU. Enabling the limshare scheduling flag
    causes the scheduler to estimate the effective share that an Inode will receive
    before the next interval. If the result exceeds the user''s assigned entitlement
    by a factor (see maxushare), the user''s normal usage is readjusted to prevent
    this. |float] | If the limshare scheduling mode is enabled, the maximum effective
    share an individual user can have is limited to float times that the user''s allocated
    share. The maxushare default is 2.0, and it must not be less than 1.0.|


    # Changing the Default Process Priority Decay


    The default configuration of decay parameters is a trade-off between process priority
    decay and usage decay to create an environment suitable for the short-term response
    required for interactive users. Sometimes the default parameters can provide incorrect
    results.


    In "Comparison to BSD Style Priority Decay" on page 166 we discussed how process
    priority decay times have trade-offs at each extreme. A long process priority
    decay causes strict CPU allocation between processes. But it can cause a process
    to be marooned or starved of CPU if one user has priority over another. A short
    decay implements a fairer scheme where processes are biased but not starved. The
    latter is represented by the SRM defaults, which means that when a user starts
    a large number of processes the default setting can influence the amount of CPU
    that user is apportioned.'
