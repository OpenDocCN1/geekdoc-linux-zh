- img_proc: true
  md: '+   - All swap devices contained by the system board must be deleted using
    the swap (1M) command and remove from the /etc/vfstab file.


    +   - All on-board non-network I/O interfaces must be brought down.


    +   - All file systems hosted by the system board to be detached must be unmounted.


    +   - If AP is not used, disks hosted by the system board to be detached must
    be removed from Veritas VxVM control using the vxdiskadm (1M) command with the
    replace option.


    +   - Tape drives hosted by the system board that is the detached must be empty
    or have a loaded page sitting at BOT.


    # DR-Detach Actions


    The following steps are automatically executed on both the SSP and DSD sides during
    the DR-Detach operation:


    +   1. All free pages associated with the system board to be detached are locked
    to avoid further use by applications. All dirty pages are flushed to swap (swap
    could be memory or disk).


    +   2. ISM must be relocated to memory available on the remaining system. If dirty
    pages from the remaining system are flushed to disk to make room for the ISM footprint.


    +   3. If the kernel cage is located on the system board to be detached, the dr
    driver invokes the DDI_SUSPEND driver function on all I/O devices in the system
    and the operating system is quiesced (suspended) to allow the safe relocation
    of the entire address range associated with the system board to be detached.


    > Note – When the kernel cage is relocated, a target system board is selected
    (out of the remaining system) to absorb the entire memory address range assigned
    to the board being detached. The relocation process involves releasing the memory
    content from the target system board as defined in steps 1-2 above. Once the memory
    is evacuated of the target system board, the entire memory range for the board
