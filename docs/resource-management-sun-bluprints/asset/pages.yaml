    # Process Priority Decay


    If we ignore the user scheduler for the moment, we can look at the process scheduler
    as just another UNIX process scheduler that uses decay factors. The SHR scheduler
    does not use table driven decay. It uses a model closer to the BSD decay where
    each process priority is decayed according to a fixed decay factor at regular
    intervals (each second). Internal process priorities in the SRM process scheduler
    are known as userpri and range from 0 to 10^{32}, where 0 is the highest priority


    ![](img/52144374747884a32fdddbed4e8cd9d7_198_1.png)


    FIGURE 7-15 Effect of Decay on Process Priority


    To prevent CPU monopolization, a low priority process (a high userpri value) has
    its userpri decayed each second by the fixed decay parameter so that it will eventually
    get some allocation of CPU. This prevents a process from CPU starvation in a way
    that is similar to the BSD scheduler. Use the srmadm command to view the process
    priority decay parameter:'
