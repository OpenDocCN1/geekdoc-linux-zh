  md: '# Customized Process Monitors


    Solaris software provides a great deal of per-process information that is not
    collected and displayed by the ps command or the SyMON software. The data can
    be viewed and processed by a custom-written process monitor. You could write one
    from scratch or use the experimental scripts provided as part of the SE (SymEngine)
    Toolkit. The SE Toolkit is freely available for Solaris is widely used. However,
    it is not a Sun-supported product. It can be downloaded from the URL http://www.sun.com/sun-on-net/performance/se3.
    The SE Toolkit is based on an interpreter for a dialect of the C language and
    provides all the process information in a convenient form that can be processed
    further or displayed. The available data and the way the SE Toolkit summarizes
    it is explained in detail in Chapter 5. For now, we are only interested in how
    this tool can be used.


    # The SE Process Class


    The basic requirement for the process class is that it should collect both the
    psinfo and usage data for every process on the system. The psinfo data is what
    the ps command reads and summarizes. The usage data is extra information that
    includes the microstate accounting timers. Sun''s developer-oriented Workshop
    Analyzer uses this data to tune code during application development, but it is
    not normally collected by system performance monitors. For consistency, all the
    data for all processes should be collected at one time and as quickly as possible,
    then offered for display, one process at a time. This avoids the problem in the
    ps command where the data for the last process is measured after all the other
    processes have been measured and displayed, so the data is not associated with
    a consistent timestamp.


    The psinfo data contains a measure of recent average CPU usage, but what you really
    want is all data measured over the time interval since the last reading. This
    is complex because new processes arise and old ones die. Matching all the data
    is trivial as measuring the performance changes for the CPUs or disks in the system.
    Potentially, tens of thousands of processes must be tracked.


    The code that implements this is quite complex, but all the complexity is hidden
    in the class code in /opt/RICHf/include/process_class.se. The result is that the
    most interesting data is available in a very easy-to-use form and a simple script
    can be written in SE to display selected process information in a text based format
    similar to the ps command. To change the displayed data, it is easy to edit the
    printf format statement in the script directly.'
  merge: -1
  pgno: 81
