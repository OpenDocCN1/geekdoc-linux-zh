  md: '# Solaris Operating Environment


    This chapter discusses the Solaris operating environment, focusing on several
    standard capabilities that are useful for resource management. The Solaris operating
    environment provides a foundation for all the other products that manage resources.


    # When to Use Basic Solaris Features


    The basic facilities of the Solaris operating environment are sufficient for simple
    resource management that can be partly implemented manually, where low low system
    cost is more of an issue than automating and controlling the management process.


    On a large multiprocessor system, you can use processor partitioning at the per-CPU
    level. This obviously doesn''t work on uniprocessors and is too coarse in granularity
    with small numbers of CPUs.


    Some of the software controls such as limits can be set globally, if the same
    limit is appropriate for all the users, the basic limits set by Solaris software
    might be useful.


    With a simple workload that is performance sensitive, the additional overhead
    of measuring and controlling resources can be an issue. The basic Solaris features
    are always present and have low overhead when enabled.


    # Relationship to Other Resource Control Features


    Although the Solaris operating environment provides the foundation, some hardware
    and optional software features extend that capability. In some cases, the Solaris
    operating environment itself is a limiting factor. Each of the following products
    is described in detail in its own chapter.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Solaris Resource Manager Software


    Solaris Resource Manager (SRM) extends some of the resource management concepts
    of the Solaris operating environment by managing resources on a per-user basis
    rather than having a single global default for limits. It also completely replaces
    the regular Solaris timeshare scheduler with its hierarchical shared scheduler.
    SRM software also maintains accrued usage accounting information for each user,
    which is much more detailed and accurate than the regular Solaris accounting information.


    # Dynamic System Domains and Dynamic Reconfiguration


    The Sun Enterprise 10000 server implements dynamic system domains, where each
    domain runs its own copy of the Solaris operating environment. Domains can grow
    and shrink at runtime without requiring a reboot. The Sun Enterprise 3500 to 6500
    servers implement a single domain but still allow CPUs, memory, and I/O boards
    to be dynamically added or removed from a running system. This requires considerable
    support in the Solaris software, and in particular all device drivers must implement
    extra functionality that allows them to be dynamically reconfigured. Old and third-party
    devices still work but require a full reboot they need to be reconfigured in or
    out of a system.


    # Solaris Bandwidth Manager Software


    Solaris Bandwidth Manager software uses the Solaris streams networking infrastructure.
    It pushes extra streams onto the protocol stack that instruments and controls
    packets coming and going, on each network interface.


    # Processor Partitioning


    When several workloads compete for CPU time on a large system, you can divide
    the CPUs into sets and bind each workload to a different set to constrain it.
    This section describes how this works and where it can be used effectively.


    In the past, it was common to use several systems, to run each workload. Modern
    computer systems are so powerful and scalable, that it becomes more efficient
    to consolidate workloads onto fewer, larger, systems. A new feature in the Solaris
    2.6 operating environment allows a multiprocessor machine to be partitioned into
    processor sets, where each workload is constrained to use only the processors
    in one set. The Solaris 7 version adds some interrupt management capabilities.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Processor Sets


    Let''s start by taking a look at the manual page for the Solaris 7 version of
    the psrset command.


    Maintenance Commands    psrset (1M)


    # NAME


    psrset - creation and management of processor sets


    # SYNOPSIS


    ```

    psrset -c [ processor_id ... ]

    psrset -d processor_set

    psrset -a processor_set_id processor_id ...

    psrset -r processor_id ...

    psrset -p [ processor_id ... ]

    psrset -b processor_set_id pid ...

    psrset -u pid ...

    psrset -e processor_set_id command [argument(s)]

    psrset -n processor_id

    psrset -q [ pid ... ]

    psrset -i ] [ processor_set_id ... ]

    ```


    # DESCRIPTION


    The psrset controls the management of processor sets. Processor sets allow the
    binding of processes to groups of processors, rather than just a single processor.
    There are two types of processor sets, created by the user using the psrset command
    or the pset_create(2) system call, and those automatically created by the system.
    Processors assigned to user-created processor sets will run only LWPs that have
    been bound to that processor set, but processor sets may run other LWPs as well.


    System-created processor sets will not exist on a given machine. When they exist,
    they will generally represent particular characteristics of the underlying machine,
    such as groups of processors that can communicate more quickly with each other
    than with other processors in the system. These processor sets cannot be modified
    or removed, but processes may be bound to them.


    # OPTIONS


    The following options are supported:


    +   -a Assigns the specified processors to the specified processor set.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '-b Binds all the LWPs of the specified processes to the specified processor
    set.


    -c Creates a new processor set.


    -d Removes the specified processor set, releasing all processors and processes
    associated with it.


    -e Executes the given command in the specified processor set.


    -f Disables interrupts for all processors within the specified processor set.


    -i Displays the type and processor assignments of the specified processor sets,
    or of all processor sets.


    -n Enables interrupts for all processors within the specified processor set.


    -p Displays the processor set assignments of the specified processors, or of all
    processors.


    -q Displays the processor set bindings of the specified processes, or of all processes.


    -r Removes the specified processors from the processor sets to which they are
    assigned.


    -u Removes the processor set bindings of all LWPs of the specified processes.


    # USAGE


    The -a option assigns a list of processors to a processor set. Processor sets
    automatically created by the system cannot have processors assigned to them. However,
    processors belonging to system processor sets may be assigned to user-created
    processor sets. This option is restricted to use by the super-user.


    The -b option binds all of the LWPs of the specified processes to the specified
    processor set. LWPs bound to a processor set will be restricted to run only on
    the processors in that set unless they require resources available only on another
    processor. Processes may only be bound to non-empty processor sets, that is, processor
    sets that have had processors assigned to them.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'Bindings inherited, so new LWPs and processes created by a bound LWP will have
    the same binding. Binding an interactive shell to a processor, for example, binds
    all commands executed by the shell.


    The -c option creates a processor set and displays the new processor set ID. If
    a list of processors is given, it also attempts to assign processors to the processor
    set. If this succeeds, the processors will be idle until LWPs are bound to the
    processor set. This option is restricted to use by the super-user.


    The -d option removes a previously created processor set. Processor sets automatically
    created by the system cannot be removed. This option is restricted to use by the
    super-user.


    The -e option executes a command (with optional arguments) in the specified processor
    set. The command process and any child processes are executed only by processors
    in the processor set.


    The super-user may execute a command in any active processor set. Other users
    may only execute commands in system processor sets.


    The -f option disables interrupts for all possible processors in the specified
    processor set. See prism(1M). If some processors in the set cannot have their
    interrupts disabled, the other processors will still have their interrupts disabled,
    and the command will report an error and return non-zero exit status. This option
    is restricted to use by the super-user.


    The -i option displays a list of processors assigned to each named processor set.
    If no argument is given, a list of all processor sets and the processors assigned
    to them is displayed. This is also the default operation if the prset command
    is not given an option.


    The -n option enables interrupts for all processors in the specified processor
    set. See prism(1M). This option is restricted to use by the super-user.


    The -p option displays the processor set assignments for the specified list of
    processors. If no argument is given, the processor set assignments for all processors
    in the system is given.


    The -q option displays the processor set bindings of the'
