  md: '# # Performance and Scalability Factors


    Two factors affect the performance and scalability of SRM software: hierarchy
    depth and kernel memory.


    # ## Hierarchy Tree Depth


    The amount of overhead caused by the SRM scheduler is minimal in most situations,
    and is proportional to the number of processes and the depth of the hierarchy
    tree. Hierarchies tree deeper than about 7 layers impose a significant overhead
    and should be avoided. It is best to keep the hierarchy tree as flat as possible.


    # ## Kernel Memory


    The amount of kernel memory used by the SRM software can be significant in some
    cases where a large number of Inodes are created. This is most likely on systems
    with large number of users in the password database. An SRM Inode is about 3 kilobytes.


    # ## Monitoring SRM Software


    Implementing the SRM software can introduce some interesting new challenges for
    performance monitoring and management.


    The question is often asked "How do I determine that the SRM software is constraining
    a workload?" The answer is simple. If the run queue is greater than the number
    of CPUs and the CPU is almost 100 percent busy (usr+sys=95 percent) then SRM is
    constraining a workload somewhere. This is no different from the standard Solaris
    scheduler since the SRM software allows a user to consume more than that user''s
    share when there are spare CPU cycles available. The difference is which workloads
    are constrained, and that depends on how the shares are apportioned.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'The Inode provides some information about which artworks are being constrained
    and by how much. The srmstat command can monitor the allocation of CPU against
    each SRM group The STU LTU columns show the short term and long term CPU usage.
    See srmstat (1SRM) manual page for further information.


    ```

    # srmstat -ac

    User/group No. Proc %Cpu STU LTU

    System 7 59 0.8 0.0 0.0

    demon 1 1 0.0 0.0 0.5

    srmiddle 1 0.0 0.0 0.0

    rmc 1 66 10.7 0.0 0.0

    interactive 1 0.0 0.0 0.5

    user1 1 3 84.8 1.0 0.0

    user2 1 3 3.8 0.0 0.0

    ```


    # System Resource Accounting Information


    The SRM software provides the ability to generate accounting data based on resource
    usage. This is made available by the accumulation of resource information in the
    Inode tree. Although the SRM software does not provide resource accounting, it
    does the data and data extraction tools that can be used to develop a system to
    generate accounting (or billing) information.


    # Billing Issues


    You must decide which Inodes are to be billed for resource usage. For example,
    you may only be concerned with billing entire departments, so they may only want
    to bill the group headers of the topmost groups, whose accrued usage will include
    all the accrued usage of the Inodes at lower levels within their departments.


    To implement a billing system, you must determine a costing function for each
    resource to be billed. This can be a simple linear relationship (where unit is
    the same, regardless of the amount used) or it can be a non-linear relationship,
    such as a step function, or a curve where unit cost varies as the amount of usage
    varies.


    In deciding upon a costing function for each resource, the administrator should
    keep in mind that the costing function will not only control the assignment of
    cost to, but can also have an impact on the way in which a user uses'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'the resource. For example, if the costing function for virtual memory usage
    causes the unit cost to increase as the amount of usage increases, there is a
    strong incentive for the users to keep virtual memory usage low. Therefore, you
    can control user behavior through an appropriate costing strategy.


    There is only one accrue attribute for the resource. It contains the accrued usage
    for the resource based on the usage attribute. This means that there is no accrued
    usage corresponding to the usage attribute. For group headers, there is no accrued
    usage for the user as an individual, since the accrue attribute holds the group''s
    accrued usage. For Inodes with no children, leaf Inodes, this does not matter
    because the usage attribute and the usage attribute are identical. If a bill is
    required for the individual accrued usage for a group header, it must be calculated
    from the group total less the sum of the individual totals of each child in the
    group.


    # Extracting Accounting Data


    The limreport command allows you to query any attributes, including the accrue
    attributes, of any user. The command provides a executable method for the selection
    of information to be displayed from the chosen Nodes.


    The limadm command provides a mechanism to reset the usage data of each user at
    an appropriate point, the timing of which will depend on the billing strategy.


    +   1. Zero Usage Counters # limadm set cpu.accue=0 sales


    +   2. Usage is accrued up the tree


    | sales |

    |---|---|

    | oltp | batch |


    +   3. Usage may be reported with # liminfo sales

    liminfo or limreport # limreport ''uid==5000''%%f'' cpu.accrue


    FIGURE 7-25 Life Cycle of Usage Data


    For example, if bills are to be produced at a group level, and then individual
    bills are to be produced for the group members, the usage would not be cleared
    until after both bills have been produced. However, if'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'individual bills are not to be produced, the group members'' accrue attributes
    may be cleared at the same time as the group header''s, even though they may not
    have been individually used.


    If we take a look at one of the previous examples that use a multi level hierarchy
    can look at the points of the hierarchy from which we would want to take usage
    information.


    ![](img/52144374747884a32fdddbed4e8cd9d7_219_0.png)


    FIGURE 7-26 A Sample Hierarchy


    # The limreport and liminfo Commands


    A common requirement might be to generate billing information for all users in
    the online group. We can do this with the limreport command:


    ```

    # limreport flag.real==set && sroup=online'' ''%f'' cpu.accrue

    ```


    At a global level we may want to know the usage information for the two departments,
    sales and finance. This can be obtained by looking at the Inodes for finance and
    sales since the usage information is accrued up the hierarchy.'
  merge: -1
