- img_proc: true
  md: '# SyMON Health Monitor


    A SyMON module that can be used in a resource management scenario determine if
    a system has enough resources to run comfortably. For example, if the CPU state
    is reported as “red”, then either less or more CPU power may be needed on that
    system. Similarly, if the memory rule reports “red” then the system may need more
    memory


    # system level measurements


    A type of measurement. System level measurements show the basic activity and utilization
    of the memory system and CPUs. Some network measurements such as TCP/IP throughput
    are also available on a per system basis. For process activity can be aggregated
    at a per level then combined with network measurements to measure distributed
    applications.


    # Teamquest


    A workload analysis product. See www.teamquest.com.


    # time constant


    In control theory, the rate at which a system responds to changes.


    # TNF


    See trace normal form.


    # ToS


    See Type of Service.


    # trace normal form


    (TNF) A format used to implement tracing (which makes it possible to trace the
    execution steps of user and kernel processes). Trace normal form, which is supported
    by the Solaris operating environment, provides a self-describing trace output
    format. Trace normal allows data structures to be embedded in the trace file without
    the need for an external definition of their types and contents.


    # Type of Service


    (ToS) A header field contained in IP packets. Its purpose is to convey information
    about how the packet should be routed. The Solaris Bandwidth Manager can use this
    information when classifying a packet. It can also change the information, to
    influence how the packet is routed.


    # UDB


    DB2 Universal Database.


    # usage decay


    A form of decay used by SRM. The user scheduler is the most important and visible
    portion of SRM and it implements usage decays which control long CPU allocation
    responsiveness.


    # virtual memory


    A type of memory that is allocated from a central resource pool is consumed by
    an application when it requests memory from the operating system. Virtual memory
    is not directly related to physical memory usage because virtual memory is not
    always associated with physical memory. For example, if an application requests
    16 Mbytes from the operating system, the operating system will create 16 Mbytes
    of memory within that application''s address space but will not allocate physical
    memory to it until that is read from or written to.'
