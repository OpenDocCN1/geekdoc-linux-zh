  md: '# Flexible and Adaptable Resource Management


    The only constant is change. Resource plans and policies that achieve the desired
    results in the morning, may not do so in the evening. All aspects of the Oracle
    Database Resource Manager settings can be changed while the database is running
    without shutting down and restarting the database. Plans, subplans, levels, membership
    in resource consumer groups, and resource allocations can be dynamically altered
    on a production database without taxing the system.


    The database administrator can create many different plans and resource consumer
    groups. These definitions are stored in the data dictionary. A default plan, specified
    by the administrator, is activated when the database is started. This allows plans
    for day time, night time, weekends, quarter end, or other times that require a
    different set of priorities.


    Unlike conventional priority schemes, all resource consumer groups will receive,
    if required, their allotment of resources cannot be starved by a high demand for
    resources from other resource consumer groups. Using percentages to allocate CPU
    resources ensures this. In addition, it allows resource allocation policies to
    remain static across hardware changes to the computer system.


    # Database Integration


    The Oracle Database Resource Manager is fully integrated into the database security
    system. A PL/SQL package lets you to create, update, and delete resource plans
    and resource consumer groups. You define a user''s default consumer group and
    privileges. Users can switch resource consumer groups to increase execution priority
    if they have the necessary privileges. In addition, CPU resource usage can change
    dynamically because an administrator on a production system can move users from
    group to group.


    Oracle database versions prior to Oracle8i support the ability to set hard resource
    limits for each user. Oracle8i continues these fixed ceilings, specified in each
    user''s profile, provide a separate and different capability for Oracle Database
    Resource Manager''s flexible allocation of unused resources to consumer groups.
    To maximize system throughput, this allocation can be well specified resource
    plan percentages when other user groups use less than their allocation.


    Finally, the Oracle8i Resource Manager software and the Oracle8i automatic degree
    of parallelism (ADOP) feature have been integrated. ADOP attempts to optimize
    system utilization by automatically adjusting the degree of parallelism for parallel
    query operations. ADOP takes into account resource group allocations before choosing
    a degree of parallelism to ensure CPU targets are met.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Support Oracle8i Resource Manager with SRM Software


    At the time of this writing, Oracle8i Resource Manager should not be used when
    other resource management tools are managing the database instance. Do not use
    Oracle Resource Manager and SRM software at the same time.


    # Using Processor Sets and Domains to Allow Use of Oracle8i Database Resource
    Manager


    To overcome the Oracle8i Database Resource Manager compatibility restrictions,
    it is possible to isolate the database so that it is responsible for managing
    its resources. Two approaches can be used to do this: processor sets and dynamic
    system domains.


    ![](img/52144374747884a32fdddbed4e8cd9d7_115_0.png)


    FIGURE 4-30 Using Processor Sets or Domains to Allow Oracle8i Resource Management


    Using this approach, you partition the database from other resource demands on
    the system and provide a consistent resource allocation to the database (a requirement
    of Oracle Resource Manager software). Oracle Resource Manager software can then
    be used to allocate resources to each authenticated Oracle user. In the case of
    the Perl'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'script, the user''s identity may not be known, so a special user can be created
    Oracle’s user database specifically for that Perl script, and resources can be
    assigned against it.


    Note that the size of the processor set or dynamic system domain cannot change
    once Oracle is started. A change in the number of processors must be followed
    by a restart of the database instance.


    # # Resource Manager of the Informix Database


    Informix uses a fixed number of server engines (processes), which are configured
    at start-up plus one. Take care to ensure that the right number of engines are
    running for the allocated resources. This is straight forward when using processor
    sets and dynamic domains because the resource allocation is done on a processor
    boundary and at specific times. Each time the processor allocation is changed,
    the Informix command line interface can alter the number of engines to correctly
    reflect the new CPU allocation.


    The SRM software provides a more dynamic environment with no fixed boundaries
    around resource allocation. This means that the amount of CPU available to the
    Informix instance varies and cannot be easily predicted. The maximum amount of
    CPUs that an informix instance will use is governed by two factors: the configured
    number of Informix engines, and the resource limits imposed by the resource manager
    (processor sets, SRM software).


    # # Batch Workloads


    Most commercial installations require batch processing. Batch processing is typically
    done at night, after the daily online load has diminished. This is usually for
    two reasons: to consolidate the day’s transactions into reports and to prevent
    batch workloads from affecting the on-line workload.


    A batch workload runs unconstrained and attempts to complete in the shortest time
    possible. This means that batch is your worst resource consumer, because it attempts
    to consume all other resources it needs until it is constrained by some system
    bottleneck. (The bottleneck for batch is the smallest dataflow point in the system.)


    Batch presents two problems to system managers: it can affect batch jobs that
    are running concurrently and it can never be run together with the online portion
    of the workload during business hours.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'Good planning schedules jobs to run outside work hours (for example, 12:00
    midnight to 6:00 a.m.). A simple hiccup or day of high sales could make the batch
    workload spill over into business hours. This is not as bad as downtime, but if
    your workload is still running at 10:30 a.m. the next day, it could make online
    customers wait several minutes for each sales transaction. This could ultimately
    leading to lost sales.


    Both these problems require resource management to allow proper control over the
    workloads. In an M environment, IBM Workload Manager can specify completion times
    and job velocity for batch workloads (see Chapter 13 for more details). For the
    Solaris operating environment, you can control the allocation of resources to
    the batch workloads to constrain them. This requires more administration of resource
    management, but achieves a similar result.


    # Resources Used by Batch Workloads


    Batch workloads are a hybrid between OLTP and DSS workloads, and their effect
    on the system lies somewhere between the two. A batch workload can consist of
    many repetitive transactions to a database, with heavy computational work for
    each. A simple example may be the calculation of total sales for the day. In such
    a case, the batch process must retrieve every sales transaction for the day from
    two databases, extract the sales amount, and maintain a running sum.


    Batch typically places high demands on both processor and I/O resources because
    a large amount of CPU is required for the batch process and the database, and
    a large amount of I/Os are generated from the backend database for each transaction
    retrieved.


    To control a CPU and I/O, you must effectively limit the rate of consumption of
    both CPU and I/O. At the time of writing, the Solaris operating environment allows
    fine-grained resource control of CPU. However, I/O resources must be managed by
    allocating different I/O devices to each workload.


    Two methods are typically used to isolate batch resource impact: one is to copy
    the database onto a separate system and run the batch and reporting workloads
    on that separate system; the other is to use CPU resource control. Copying the
    database onto a separate system presents a problem because, in most situations,
    the batch process updates portions of the online database and cannot be separated.


    Since the amount of I/O generated from a batch workload is proportional to the
    amount of CPU consumed, you can indirectly control the I/O rate of the batch workload.
    However, you must ensure that excessive I/O is not generated on workloads with
    very light CPU requirements.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Workload Measurements


    If you want to manage a resource, you must measure its usage.


    The generic types of measurements that you can obtain directly or indirectly via
    related measurements are throughput, utilization, queue length and response time.
    These measurements are made at several levels, including business operations,
    application, user, system, network, process, and device level.


    This chapter discusses measurement sources and the meaning of the available measurements
    that are important for resource management.


    One problem in documenting the details of Solaris measurements is that far more
    measurements are available than can be displayed by the standard tools such as
    vmstat, sar, and ps. Most commercial performance tools read the kernel directly
    and have access to the full range of measurements, although they do not use all
    of them. SymON product collects a large proportion of the available measurements.
    The most convenient way to explore this data is to use the SE Toolkit. This freely
    available but unsupported tool provides full access to all the raw data sources
    in the Solaris operating environment and generates higher level processed data.
    It is used to prototype ideas that can then be promoted for incorporation in products,
    in particular for the Sun Enterprise SymON 2.0 software.


    # The SE Toolkit


    The SE Toolkit is based on a C language interpreter that is extended to make all
    the Solaris measurement interfaces available in an easy form. The code that takes
    metrics and processes them is provided as C source code and runs on the interpreter
    so it is easy to trace where data comes from and how it is processed. You can
    write your own programs in any language to obtain the same data. The SE Toolkit
    has been jointly developed by Richard Pettit and Adrian Cockcroft as a “spare
    time” activity since 1993. Richard worked at Sun but is currently at Foglight
    Software, and'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Adrian is one of the authors of this book. The SE Toolkit can be downloaded
    from http://www.sun.com/sun-on-net/performance/se3.Detailed information and examples
    of how to write code that reads the kernel and the SE Toolkit itself be found
    in Sun Performance and Tuning, Java and the Internet, by Adrian Cockcroft and
    Richard Pettit, Sun Press 1998.


    # Measurement Levels


    Measurements can be classified into several levels. Data from lower levels is
    aggregated and merged with new data as more valuable higher level measurements
    are produced.


    +   - Business operations

    Business workloads are broad-based and are not only computer oriented. Use a form
    that makes sense to managers and non-technical staff to represent the part of
    the business that is automated by the computer system.


    +   - Applications

    The business operation can be broken down into several applications such as sales
    and distribution, e-commerce web service, email, file, and print. Examples of
    application-specific measurements are order entry rate, emails relayed, and web
    server time.


    +   - Users

    Each class of user interacts with several applications. The number of users and
    the work pattern of each class of users should be understood.


    +   - Networks

    Networks connect the users to the applications and link together multiple systems
    to provide applications that are replicated or distributed. Measure traffic patterns
    and protocol mixes for each network segment.


    +   - Systems

    System-level measurements show the basic activity and utilization of the memory
    system and CPUs. Some network measurements, such as TCP/IP throughput, are also
    available on a per system basis. Per process activity can be aggregated at a per
    system level then combined with network measurements to measure distributed applications.


    +   - Processes

    Process measurements show the activity of each user and each application. Current
    process activity can be monitored, and accounting logs provide a record of who
    ran what when.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'Devices, such as disks and network interfaces, are measured independently and
    aggregated at the system level. There are few ways to link the usage of a device
    to a process or a user automatically, so detailed information about the configuration
    of devices and the usage of file systems by applications is needed.


    # The Application Resource Measurement Standard


    The Application Resource Measurement (ARM) standard aims to instrument application
    response times. The intent is to measure end-to-end response time by tagging each
    ARM call with a transaction identifier and tracking these transactions as they
    move from system to system. If a user transaction slows down, the system in the
    end-to-end chain of measurements that shows the biggest increase in response time
    can be pinpointed.


    This technique sounds very useful, and there is both good and bad news about ARM.
    The good news is that all vendors support the one standard, and several implementations
    exist, from Hewlett-Packard and Tivoli (who jointly invented the standard) to
    the more recently developed BMC Best/1 and Landmark. The bad news is that application
    code must be instrumented to measure user response time, and sophisticated tools
    are needed to handle the problems of distributed transaction tracking. Application
    vendors have shown interest, so more measurements will become available. The latest
    versions of Baan products include ARM-based instrumentation.


    # SAP R/3 Measurements


    The SAP R/3 enterprise resource planning package has three tiers of systems: user
    desktops, application servers, and a backend database. The application instruments
    itself and measures the performance of key user transactions and the response
    time of the backend database for each application. This information is provided
    by a facility called CCMS, and it is used by several tools such as BMC Best/1
    to provide more detailed application-level management than can be done with just
    system and device-level information.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Internet Server Measurements


    An Internet server complex often provides a range of services and uses applications
    such as firewalls, web servers, and content generation databases. Each of these
    applications supports a range of operations that you can log or monitor to discover
    the rate of use and the mixture of operations. In some cases, the time taken for
    each operation is also logged, so you can obtain a response time measurement.


    One of the most common applications is the proxy web cache service. Because this
    application acts as a funnel for all the web traffic going out of a corporate
    intranet to the Internet itself, a good measure of overall Internet response time
    can be obtained. An example scenario follows.


    # Configuring and Monitoring a Proxy Cache


    Data is collected on a Netscape 2.5 proxy cache that is serving most of the thousand
    or employees in Sun''s United Kingdom facility. The server is situated at the
    largest size, some users use LAN-based access speeds. However, several others
    in the UK, run over area links to the central site. Additionally, a number of
    users are connected over ISDN or modem dial-up connections.


    The access log contains the same data that a normal web server log contains, but
    Netscape supports extended formats and also allows a custom format to be specified.
    The interesting data to extract is the mixture of possible cache outcomes that
    determines whether it is a cache hit or not, as well as the routing information
    and transfer time. The SE Toolkit percolator.se script can parse Netscape and
    Squid proxy cache logs and summarize the data.


    The route data is analyzed to count all the entries that go to PROXY or SOCKS
    are indirect. This is the percentage that gets routed to the Internet, rather
    than being DIRECT references to other servers in the corporate intranet or incomplete
    transfers marked with a “-\”.


    The cache finish status was analyzed, and operations are divided into four categories.
    The NO-CHECK and UP-TO-DATE states are cache hits. The WRITTEN, REFRESHED, and
    CL-MATCH states are misses that cause cache writes. The DO-NOT-CACHE and NON-CACHEABLE
    states are uncacheable, and anything else is an error or incomplete transfer.
    The percentages for the first three are recorded.


    The total transfer time is recorded. The average transfer time can be calculated,
    but since the transfer size varies from zero to several megabytes, the average
    transfer time for each of the size ranges for the mix must also be worked out.
    The mix in the percolator.se code is based on the SPECweb96 size boundaries of
    to'
  merge: -1
  pgno: 121
- img_proc: true
  md: '1 Kbyte 1 Kbyte up to 10 Kbytes, 10 Kbytes up to 100 Kbytes, 100 Kbytes to

    1 Mbyte, and over 1 Mbyte. We end up with the percentage of ops and the average

    transfer time in each size range.


    # Observed Results in Practice


    On a fairly quiet weekday, 280,000 accesses went via this cache, and 56 percent
    of the

    accesses went out to the Internet. The cache breakdown was as follows: 34 percent
    of

    the accesses hit in the cache, 16 percent missed and caused a cache write, 49
    percent

    of the accesses were not cacheable, and 1 percent ended in some kind of error.

    A week''s worth of data showed that the indirect and cache hit rates vary by 5
    to 10

    of the total from day to day.


    The transfer time averaged around 2.3 seconds. The problem with this number is
    that

    it included a small number of very large or very slow transfers. The average for

    transfers up to 1 Kbyte was 1.8 seconds; for 1 to 10 Kbytes, it was 2.5 seconds;
    for

    10 to 100 Kbytes, it was 6 seconds; for 100 Kbytes to 1 Mbyte, it was 40 seconds;
    and

    for over 1 Mbyte, it was 188 seconds. Within each of these size bands, connections
    to

    the client browser took place over everything from 100-Mbit Ethernet to 28.8-Kbit

    modems.


    # Transfer Time Versus Size Distribution


    To calculate the transfer time versus size distribution, 10,000 access log entries
    were

    taken. After removing all zero content length and zero time transfers, size was

    plotted against transfer time using log-to-log axes. The result showed that transfer

    time is not very dependent on size until the size gets into the 10 to 100 Kbyte
    region,

    as shown in FIGURE 5-1.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_123_0.png)


    FIGURE 5-1 Log-to-Log Plot of Response Time Versus Size


    The plot in FIGURE 5-1 shows bands of transfer times that depend upon the user''s
    location. Many users are locally connected, but others are operating over slower
    networks. The transfer time includes the time spent waiting for the remote server
    to respond. Although it does not represent the extra time imposed by the cache,
    it actually gives a reasonable summary of the response time that users are experiencing
    with their browsers. This information is useful because you can collect it at
    a central point rather than attempting to measure the response time at an individual
    user site.


    A probability density histogram of the same data is shown in FIGURE 5-2.'
