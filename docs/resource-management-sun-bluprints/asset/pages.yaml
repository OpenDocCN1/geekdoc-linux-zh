    The real reason to set up a proxy cache intranet infrastructure is the administrative
    control. Security is a big problem. One approach is to set up the firewall gateways
    to the Internet so that they route traffic only to and from the proxy caches.
    The proxy caches can make intelligent routing decisions. For example, Sun connections
    to the Internet in Europe and the USA. If a user accesses an Internet site in
    Europe, access is routed via the local connection. When access is made to a site
    in the USA, a choice can be made. The route could go to the USA over Sun''s private
    network to the USA-based gateway, or it could go directly to the Internet in Europe
    and find its way to the USA. The second option reduces the load on expensive private
    transatlantic links, but the first option can be used as a fallback if the European
    connection goes down.


