  md: '# Network Bandwidth Accounting Using NetFlow


    The Solaris Manager software has built-in support for Cisco NetFlow™ software.
    This feature allows for detailed network measurements that can be sent to other
    software packages that can process and analyze this data.


    Besides the Solaris Bandwidth Manager software, NetFlow data collection is supported
    on a variety of Cisco devices, such as the Cisco 7000 and 7500 series routers.


    When NetFlow is enabled on the Solaris Bandwidth Manager software or any Cisco
    equipment supporting NetFlow, network packets are processed and classified into
    flows. A flow is a unidirectional series of packets that have several parameters
    in common:


    +   - Source and destination IP address

    - Source and destination application port number

    - IP protocol type

    - IP ToS (Type of Service)


    A flow ends when either a FIN or RST packet is received for that flow, or when
    it times out.


    NetFlow-enabled devices send out NetFlow datagrams, which contain records for
    one or more flows. Combining multiple flow records in one datagram reduces network
    overhead caused by NetFlow. These datagrams are UDP based, so they can get lost
    in transit in case of a busy network. NetFlow version 5 and higher add a sequence
    number to the datagram header, so the receiver of these datagrams can at least
    know that a datagram was lost.


    Each NetFlow datagram record contains detailed flow information, such as the number
    of bytes in the flow, the number of packets, the duration, source and destination
    IP address, and so on.


    Cisco offers applications that read and process NetFlow datagrams. NetFlow FlowCollector™
    is a NetFlow datagram consumer for one or more NetFlow devices. These devices
    simply point to the host and port number on which the FlowCollector software is
    running. The FlowCollector aggregates this data, does preprocessing and filtering,
    and provides several options to save this data to disk (as flat files). Other
    applications, such as network analyzing, planning, and billing, can use these
    flows as input.


    The NetFlow FlowAnalyzer™ application uses the output from NetFlow FlowCollector.
    It provides elaborate processing, graphing, and reporting options for network
    analysis, planning, troubleshooting, and more.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'You can run the Solaris Bandwidth Manager software in statistics mode, where
    it will process packets but not provide the priority scheduling. By using the
    NetFlow output of the Solaris Bandwidth Manager software, you can obtain detailed
    network measurements that are not easily measured otherwise. For example, you
    can find out the bandwidth used by a specific application or user using NetFlow
    data analysis. The flow data can also provide latency information of specific
    applications. Trend data can show the long-term impact of the deployment of certain
    applications.


    For more information about CiscoFlow, see http://www.cisco.com/warp/public/732/netflow/index.html.


    # Storage Measurements


    Individual disks are well instrumented, but storage subsystems are now much more
    complex than a few individual disks. This section explains the basic Solaris software
    measures and discusses more complex disk subsystems.


    # Disk Workloads


    There are six basic disk access patterns. Read, write, and update operations can
    either be sequentially or randomly distributed. Sequential read and write occur
    when files are copied and created or when large amounts of data are processed.
    Random read and write can occur in indexed database reads or can be page-in or
    page-out to a file. Update consists of a read-modify-write sequence and can be
    caused by a database system committing a sequence of transactions in either a
    sequential or random pattern. When you are working to understand and improve the
    performance of your disk subsystem, spend some time identifying which of the access-pattern
    categories are most important to you.


    You cannot automatically tell which processes are causing disk activity. The kernel
    does not collect this information. You may be able to work out where the workload
    comes from looking at how an application was installed, but often you must resort
    to using truss on a process or the TNF tracing system. The Solaris software does
    not offer a way of getting I/O activity on a per-file descriptor basis, so application-specific
    instrumentation is all we have. Databases as Oracle can collect and report data
    on a per-tablespace basis, if you can map the tablespaces to physical disks, you
    can tell what is going on programmatically. Such collection and analysis is performed
    by the BMC Best/1 performance modeling tool that changes in disk workload can
    be modeled.'
