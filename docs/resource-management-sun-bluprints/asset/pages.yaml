  md: '# Resource Manager of the Oracle Database


    Managing resources in an Oracle database provides the means to meet service levels
    and response times in commercial systems. However, you must consider architectural
    and support issues when planning to implement resource management. There are two
    ways to manage resources of a database: the black box approach, where you manage
    a whole instance as a single entity or using resource management products to manipulate
    resources within an Oracle instance.


    Oracle versions 7.3, 8.0, and 8i must be managed as a black box, which allows
    you to implement server consolidation by using Solaris resource management products.
    If you require fine-grained resource management within Oracle, Oracle''s resource
    manager software, which ships with Oracle versions starting at 8i.


    # Oracle8i Resource Manager Software


    The Oracle8i Resource Manager software ensures system resources are applied to
    the most important tasks of the enterprise at the levels required to meet enterprise
    goals.


    In Oracle8i, a new Database Resource Manager software allocates and manages CPU
    resources among database users and applications. In addition, the Oracle8i Database
    Resource Manager software enables you to limit the degree of parallelism of any
    operation. You can balance one user''s resource consumption against other users
    and partition system resources among tasks of varying importance to achieve overall
    enterprise goals.


    ![](img/52144374747884a32fdddbed4e8cd9d7_111_0.png)'
