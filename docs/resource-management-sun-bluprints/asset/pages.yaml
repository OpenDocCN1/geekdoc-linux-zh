  md: '# The Consolidation Process


    The consolidation process starts when you identify candidate systems and applications.
    First measure the resource usage and service levels of those systems so you can
    see which application workloads fit together best.


    Next, migrate those systems to a common Solaris release and patch revision and
    do some testing you can be sure that everything works correctly in the same environment.
    You also need to make sure that there are no conflicts in the name service configuration
    and network services files. For example, local password files may need to be merged,
    and any conflicting port numbers specified in the /etc/services file may need
    to be cleared. If you use a name service as NIS for all your password and service
    information, the systems should already be seeing the same name space and definitions.
    By using a common name service eases the consolidation process. If you prefer
    to make all the changes at one time, then you can upgrade the application as consolidated,
    but for more testing then and a more incremental installation process on the consolidated
    system


    For each group of consolidated applications, you must choose appropriate resource
    management controls. Once you have consolidated your applications to fewer systems,
    monitor and re-size the consolidated systems to allow for peak loads. You can
    remove extra resources for elsewhere or identify candidate applications to be
    consolidated onto these systems. Treat this as a rolling upgrade program rather
    than a one-time big change.


    An obvious question that arises is how many systems should the new consolidation
    contain. Circumstances vary, but the basic principles remain the same. If you
    treat consolidation as a process, then the number of systems decreases over time
    and the size of systems increases.


    Downtime impacts multiple applications on the consolidated systems. Therefore,
    when you increase the resources by adding an extra application, you want to do
    so without rebooting. Consolidated upgrades benefit from systems that can perform
    dynamic reconfiguration. The Sun Ultra™ Enterprise E3000-E650 servers can perform
    I/O board reconfiguration with the Solaris 7 release which release for dynamic
    reconfiguration of CPU and memory, which causes some application availability
    issues. The number of system footprints may be too high with mid midrange servers,
    and it is hard to reduce the total number of servers effectively. With the high-end
    Starfire system, Dynamic Systems Domains (DSDS) solve these problems. DSDs are
    supported on the Solaris 2.5.1, 2.6, and 7 releases. The total number of DSDs
    can be reduced as applications are consolidated.


    One approach is to use each DSD for a different Solaris revision. You may have
    a large DSD for the bulk of your Solaris 2.6 applications, a smaller one for applications
    that have not migrated from the Solaris 2.5.1 release, and a development and test'
  merge: -1
