  md: '# IBM Workload Manager for OS/390


    This chapter provides an overview the possibilities available with extensive use
    of resource management and serves as a guide to help design long-term resource
    management goals for application developers. The relatively proprietary nature
    of the mainframe environment has afforded IBM the opportunity to manage resources
    effectively because of their ownership of most of the components: computer hardware,
    operating system, middleware, and applications. This is not in the case in open
    systems, or specifically UNIX environments. However, as we move forward we will
    see a great deal of collaboration between the major computer system component
    vendors to provide an environment with resource management interoperability. Initial
    evidence of this is the CPU and Network resource management work being done by
    Sun and bandwidth management with companies like Cisco.


    # Mainframe Data Center Resource Management


    Mainframe administrators and system programmers are familiar with the resource
    and workload management facilities provided by IBM Workload Manager (WLM). WLM
    is a comprehensive tool set that provides an automated resource management environment,
    driven by high-level business goals, and that, in many cases, is self tuning.
    Tools are provided to define the business goals or objectives, to control system
    resources, and to feed metrics concerning these resources back to the resource
    controller, which attempts to ensure that the goals are met. This is an implementation
    of the measure/policy/control control loop described in “Resource Management Control
    Loop” on page 7.'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Historically, IBM has been driven by the same needs that drive Sun: making
    computer systems easier to manage and making better or more efficient use of capacity.
    WLM is key to IBM''s future in reinforcing its position within the data center
    by lowering the cost of managing their large mainframe systems.


    The Solaris resource management components together with the measurement techniques
    under development form the building blocks for the long term future of Solaris
    resource management and the foundation on which automated, business-level, goal-driven
    resource management will be built.


    # # Workload Manager Overview


    WLM, with the ability to run in goal mode, was first released with MVS/ESA version
    5 in 1995. It is tightly integrated into the core of the operating system and
    available on all OS/390 implementations, including Sysplex configurations. IBM
    is strongly encouraging existing users to migrate to the OS/390 environment so
    that they can take advantage of this product. The functionality of WLM is described
    only in very general terms within this book. IBM-specific terminology has been
    avoided and replaced with terms that are familiar to the open systems literate
    reader. As a consequence, some detail has been sacrificed to readability and understanding.
    The notable exception is the terminology associated with goals, which is both
    descriptive and generic.


    # # WLM Modes of Operation


    WLM allows an OS/390 or Sysplex environment to run in two, mutually exclusive
    modes:


    +   - Compatibility mode

    - Goal mode


    Dynamic switching between these modes is supported.


    # # Compatibility Mode


    This mode allows the Sysplex system resources to be managed in a traditional fashion,
    that is, manual tuning and defining rigid boundaries of resource limits and guarantees.
    It assumes that performance metrics are gathered and analyzed by skilled engineers
    who then tune the appropriate system parameters. These parameters can be changed
    and are usually set following an extended period of metrics gathering.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Goal Mode


    The key feature within WLM is the ability to run in goal mode. In this mode, the
    system is driven by simple business goals, for example:


    +   - Provide a given response time for a specific transaction type.

    - Ensure that a certain percentage of transactions complete within the specified
    per transaction time.

    - Ensure that a certain batch run is completed within a given time frame.


    In goal mode, no manual configuration or performance tuning is required. Indeed
    it is not permitted. Tuning and resource management are carried out automatically,
    with system parameters changed on the fly. Manually. All of this is performed
    by WLM and its components to ensure that the specified goals are met. Performance
    groups and performance domains, the traditional resource management tools of the
    system tuner, are not supported by WLM when running in goal mode. However, most
    of the components or tools used to manually control resource consumption are integrated
    and used in some form within WLM. WLM is tightly coupled with the underlying operating
    system and system services, especially transaction based environments such as
    CICS and IMS. Thus it can measure consumption and control key, low level, resources
    such as processor, memory and disk storage I/O while integration with CICS and
    IMS allows performance to be measured at the level the business perceives, transaction
    time.


    # Defining Service Policies within WLM


    When running in goal mode, WLM manages resources based upon a service policy.
    The service policy is a complete set of policies, including goals, that drive
    the entire OS/390 or Sysplex entity. Within a Sysplex, an instance of WLM is present
    on each node, or under each MVS, but all act in concert, with all nodes using
    the same policy. A number of these service policies can be defined, but only one
    can be in force at any given time. However, the enforced policy can be changed
    dynamically.


    The service policy consists of the following major components:


    +   - Resource groups

    - Service classes

    - Periods

    - Duration

    - Importance

    - Goals'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Resource Groups


    Resource groups allow maximum and minimum processor service levels to be defined
    and shared between one or more member service classes. Processor service level
    is not as simple as PRM percentages or SRM(IBM) shares. Assignment and measurement
    of processor resource uses standardized values, which take into account the relative
    performance of different processors.


    # Service Classes


    A service class defines a set of goals, together with periods, duration, and importance.
    A number of individual processes and CICS/IMS transactions can be assigned membership
    of a service class. They will then become subject to the specified goals and constraints,
    including those imposed by any resource group subscribed to the class. In essence,
    this is analalous to the Solaris Resource Manager Inode, which effectively defines
    a resource management policy that can be subscribed to.


    # Periods and Duration


    Up to eight periods can be defined for each service class, each of which except
    the last has a duration (expressed in another standardized IBM form). These are
    used to vary goals and their relative importance with time. Thus each service
    class and period combination, usually referred to as the service class period
    in IBM documentation and here also, has a duration, an importance, and a goal.
    For example, if a process does not complete within the first period''s goal, then
    it becomes subject to the goal and importance associated with the second period.
    Periods can not be defined for CICS or IMS transactions.


    # Importance


    Importance defines the relative priority of the goal and is represented by a number
    between one and five, being most important. This allows goals to be prioritized
    and resources redistributed in cases where multiple goals are not being met. It
    does not affect scheduling or any other form of priority unless goals are not
    met and there is contention between service class periods.'
  merge: -1
  pgno: 331
- img_proc: true
  md: "# Goals\n\nGoals are defined for a given service class period. Four types of\
    \ goal are recognized:\n\n+   - Average response time—The average response time,\
    \ including queuing, to be provided within the period.\n- Response time with percentile—The\
    \ percentage of transactions that should complete within a specified time. For\
    \ example:\n  - CICS—90 percent of transactions complete within 0.7 seconds\n\
    \  - Batch—Turn time of < 5 minutes\n  - TSO—99 percent of jobs complete within\
    \ 4 seconds\n- Execution velocity—This is a goal for controlling application execution\
    \ access to processor resource. It effectively defines priorities based on ensuring\
    \ that a process is run a given percentage of the time that it is runnable. Thus,\
    \ velocity is given by velocity =(ticks process was run x 100)/(ticks process\
    \ + process was runnable but not running). This is considered especially useful\
    \ for long running and nontransaction oriented jobs. It is intended to ensure\
    \ that processes don't get just the appropriate amount of processor resource during\
    \ a given span, but that they get the processor resources when they need them.\
    \ If a velocity goal is assigned to a service that handles transactions on behalf\
    \ of others, who may have service classes with transaction throughput goals, WLM\
    \ will ignore the velocity goal after start-up and use specific transaction goals.\n\
    - Discretionary—This is defined by WLM as work without a specific service class.\
    \ No importance is attached to discretionary goals, and they will always lose\
    \ resource when a service class period with another type of goal requires resources.\n\
    \n# WLM Components\n\nWLM consists of a number of major software components including:\n\
    \n+   - WLM—Workload Manager.\n- SRM—System Resource Manager, referred to as SRM—IBM\
    \ in this document to differentiate it from the Solaris Resource Manager software.\
    \ This component provides the algorithms for managing resources and caters to\
    \ dynamic switching between compatibility and goal modes.\n- RMF—Resource Measurement\
    \ Facility. Tracks metrics including progress against goals.\n- XCF—Cross-System\
    \ Coupling Facility (Sysplex interconnect communications infrastructure). Communicates\
    \ policies, metrics, and control data between Sysplex nodes.\n\nChapter 13 IBM\
    \ Workload Manager for OS/390 301"
  merge: -1
  pgno: 332
- img_proc: true
  md: '+   - ISPF—Interactive System Productivity Facility, a generic MVS interface
    can be used to define, activate, and deactivate policies.


    +   - CP/SM—CICSPlex/System Manager—Acts as a Sysplex TPM by dynamically routing
    CICS queries to appropriate MVS nodes for both capability and response in line
    with goals.


    These are all products that work together to dynamically manage performance and
    resources for IBM Sysplex systems. WLM is based on hierarchical control of resources.
    Each node within the Sysplex is responsible for managing its assigned share of
    the workload and communicates with the WLM to ensure that it is appropriately
    co-ordinated and meets the Sysplex wide goals. Also some-systems, specifically
    CP/SM effectively have delegated responsibility for managing the resources they
    are capable of controlling, in such a way as to ensure that goals are met.


    # # WLM Control Architecture


    Control within WLM is centered around the SRM(IBM) component which is responsible
    for:


    +   - Policy adjustment—this does not refer to the service policy but by the way
    resources are distributed and how this is adjusted and balanced. SRM(IBM) is capable
    of doing this because of the ability of WLM components to gather and assign metrics
    and then to control the requisite resources. When in goal mode effectively controls
    the following resources:


    +   - Processor


    +   - Virtual memory system (MVS)


    +   - Disk I/O


    Once a series of goals has been assigned, in the form of service class periods,
    WLM ensures that all of the appropriate measurements are taken during the process
    or transaction. Periodically, it compares observed performance with that required
    to meet the specified goal and then modifies its internal policies, that is detailed
    policies that determine individual resource consumption requirements and constraints.
    Finally, it applies the appropriate controls for the next period or interval.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Gathering Metrics


    Because of the tightly integrated architecture of the MVS environment and its
    sub-systems, especially with IMS and CICS, a wide variety of metrics can be gathered
    and attributed appropriately. In particular, transactional components can be easily
    identified and traced their resource consumption. Tools are present which allow
    the gathering of very fine grained statistics for each component of a transaction,
    matter where it is being executed, and for those components to be recognized as
    being from a particular transaction or transaction type. This allows it to dynamically
    determine the routes of the transactions, aiding resource management and control.


    A number of control interfaces, some similar to ARM, are provided to the various
    components of WLM, to allow them to communicate each other as well as with applications
    and transaction processors. These allow you to set transaction boundaries that
    collect and share metrics, and allow applications to determine their service classes
    and goals. These tools are used by standard IBM resource measurement utilities
    so that the metrics gathered can be viewed and manually analyzed or automatically
    processed by WLM. The WLM analysis engine determine both the attribute resource
    consumption and locate performance bottlenecks. This is possible because of the
    type of statistics gathered, especially delay metrics. These can indicate how
    often a desired resource was demanded but was not available.


    # The Performance Index


    All of the WLM algorithms are run by SRM(IBM), are based on meeting the Sysplex
    wide goals and are driven by a metric referred to as the performance index. This
    is the ratio of work completed versus the amount of work that should have been
    completed to meet the goal.


    For example, if the goal was for an average response time, then the performance
    index would be


    Performance Index = Actual Average Response Time / Goal Average Response Time


    An index of less than one indicates that the workload is not on target, one indicates
    that it is on target and more than one shows that it is overachieving. This is
    the prime mechanism used by the WLM to measure performance against goal and to
    redistribute or limit resources as required.


    Most of the performance index calculations are very simple. However, the calculation
    for response time with percentile is based on a distribution. That calculation
    has been simplified, without sacrificing too much accuracy, to provide rapid processing.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Component and Server Topology


    As mentioned earlier, WLM can independently determine the routes taken by transactions
    and thus determine the overall transaction server topology. This is possible because
    it understands the different applications, the different TP services, and their
    location, possibly on different nodes within the Sysplex. A service can process
    the transactions from a number of different clients, who may belong to different
    service classes. WLM can track what serves and whom control each of the elements.
    This is key to its ability to manage transactions effectively.


    Also, WLM is capable of this, it ignores velocity goals for underlying TP servers
    if it recognizes that they service transactions from different clients. It will
    enforce their transaction goals instead.


    All of this is used by WLM to automatically and dynamically tune CICS, and manage
    the resources supporting CICS and IMS to meet the goals. This includes ensuring
    that all transactions that belong to the same service class period use the same
    components of the service provider, that is CICS regions. WLM then creates dynamic
    internal service classes (DISC) to allow it to manage the transactions. Each DISC
    is associated with one or more normal service classes and a given server component.
    The number of transactions using each route then allow the DISCs to be weighted.
    If the external or standard service class goal is not being met, the associated
    DISCs can be managed (if that is where the bottleneck lies).


    # Policy Adjustment


    Because WLM can effectively monitor and control resource consumption at the appropriate
    level of attributability, it can vary resource control policies to ensure that
    service class period goals are met. A resource control policy effectively defines
    the type and quantity of resources that should be provided to service classes
    to ensure this.


    The mechanism used by WLM to balance all of these needs is based on a simple principle:
    sharing resources among the service class periods to keep each of their performance
    indices at one. This must be done while still adhering to any limitation imposed
    on a service class account of its resource membership.


    Note that policy adjustments are almost always carried out at the service class
    period level and not at the process or transaction type level.


    Policy adjustment is cyclic and by default occurs every 10 seconds. The balance
    is achieved or maintained by adjusting the policy to benefit a class that is not
    on track to meet its goal, the receiver, and by penalizing one, or more, that
    is, the donor(s). During each cycle the aim is to modify one receiver appropriately.'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'Receivers are defined as service classes where the goal is missed and where
    WLM has the requisite control to provide help. Thus, service classes with a performance
    index well below one but which are I/O or lock bound will not be made a receiver
    and granted help. WLM cannot control the specific resource.


    As previously stated, WLM’s ability to understand bottlenecks is key. Once a receiver
    and its bottlenecks have been identified, one or more donors of the required resources
    can be sought. Donors can only donate processor or memory resources.


    The policy adjustment cycle is as follows:


    +   1. Select a potential receiver class.


    +   2. Determine if there is the bottleneck is a WLM controlled resource. If not
    return to 1.


    +   3. Determine if there is a donor available using the opposite criteria


    +   4. Adjust policy. And return to 1, 2, or 3


    +   5. Enforce resource group limitations if present.


    +   6. End


    # Selecting a Potential Resource Receiver


    Selection of a potential receiver service class is based on the following criteria,
    in decreasing order of importance:


    +   - Whether the goal is met. Is the performance index less than 1?


    +   - Whether its resource group minimum service level is being utilized.


    +   - How far below its resource group service level the service class is. Most
    is preferred.


    +   - Its importance. Most importance (lowest number) is preferred.


    +   - How high its performance index is. Highest is preferred.


    These are only the basic criteria.


    IBM’s policy with respect to performance index is to allocate receivership to
    processes nearest their goal. This is not particularly intuitive at first sight
    However, this is based on the premise that resource donation must make a difference.
    If a single large resource sink is identified, and other potential receivers are
    identified, these would be brought on track prior to dealing with the resource
    sink. Thus only one service class would be in difficulty. If the reverse were
    the case, that if lowest performance index was used as the differentiator, then
    resources would be donated onlyto to the resource sink. All the other service
    classes would risk becoming sinks or lagging behind their targets themselves.
    The aim is to keep as many service classes as possible on target.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Determining the Receiver Bottleneck


    Before a receiver candidate can be confirmed, WLM ensures that its poor performance
    is caused by the lack of a resource which WLM can manage. It checks the delays
    associated with processor and memory usage for the service class period and for
    any transaction services derived DISCs.


    If the bottleneck is not associated with processor or memory, for example, it
    could be due to database locks or I/O constraints, then another receiver candidate
    is sought. If the bottleneck is associated with a WLM controlled resource, then
    a receiver is assigned. This will be the original service class in the case of
    nontransaction-based service classes or maybe a DISC in the case of transaction-based
    service classes.


    Following this, one or more candidates for resource donation are sought.


    # Selecting a Resource Donor


    Resource donation is focused on donation of the resource needed by the designated
    receiver. Donor service classes are selected for each receiver bottleneck. Their
    selection criteria are based on the following, in decreasing order of importance:


    +   * Whether their goal is being met. Is the performance index greater than or
    equal to 1?


    +   * Discretionary goals. These are considered as universal donors.


    +   * Whether resource group minimum service level is being utilized.


    +   * How far below the resource group minimum service level the service class
    is. Least is preferred.


    +   * Its importance. Least preferred.


    +   * How low its performance index is. Lowest is preferred.


    Again these are the basic criteria.


    The value of the donation to the receiver is tested to ensure that it will have
    a good net effect. This is to ensure that potential resource sinks are avoided
    and resources are not donated to service classes where they will make little difference.
    WLM would rather donate to slightly below target service classes where their effect
    can be greater proportionally. If there is value, then the trade off between the
    loss of resource to the donor and the benefit to the receiver is checked. All
    aspects of the resource groups, service class periods, importance and goals are
    checked, as are projected performance indices. Only if the net value favors the
    receiver will the donation occur. Otherwise, the cycle is begun again with a new
    receiver being


    If one donor cannot provide the appropriate resource or if there is more than
    one bottleneck, a number of donors can be selected by repeating the selection
    process.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'Some resources can also be donated, or rather scavenged, if they are considered
    to have little effect on the system''s ability to meet its goals. For example
    an analogy would be the virtual system choosing to donate pages from processes
    if paging is not considered overly detrimental to the system.


    # Carrying Out the Donation


    # Typical Uses for WLM


    WLM is typically used in the following way:


    +   - Long running batch jobs and non transactional jobs are run in velocity mode
    and presumably within resource groups. This attempts to guarantee resource capacity
    and responsiveness.


    +   - User transactions or transaction based applications are run in either average
    or percentile response time mode.


    When appropriate planning has been undertaken, WLM implementations seem to be
    very successful. The main keys to success to be


    +   - Correctly identifying the business goals to be met and the applications
    which provide the services.


    +   - Understanding how these services are delivered, i.e. how the applications
    work.


    +   - Not being too ambitious in terms of granularity of goals. Twenty goals for
    business critical applications is far better than one for every user and application/service
    combination. The cost of having too many goals can impose an unacceptably high
    overhead in terms of capacity.


    Finally, the area that to WLM''s success is the proprietary nature of the environment
    it manages—specifically tightly coupled hardware, operating environment, and middleware—and
    IBM''s ownership of these components. The very high cost associated with this
    type of environment is why resource utilization is such a key issue.


    In the UNIX, or open systems environment, no one vendor has such ownership or
    is able to execute such control. However the presence of massive data center UNIX
    systems, such as the Sun Enterprise 10000, enable extremely complex and high capacity
    applications to be deployed and large numbers of smaller services to be'
  merge: -1
  pgno: 338
- img_proc: true
  md: consolidated on a single platform. The attraction of access to new applications,
    combined with the lure of cost reduction through both hardware and software consolidation
    is inevitably driving customers to do this. This in turn will drive the need to
    guarantee service levels and improve the utilization of such platforms, maximising
    the return on ever increasing investment. Partnership between many of the key
    hardware and software vendors who deliver these service platforms will lead to
