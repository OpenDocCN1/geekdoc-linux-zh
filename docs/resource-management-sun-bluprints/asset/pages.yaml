- img_proc: true
  md: '# CHAPTER 1


    # Introduction


    This chapter introduces the business problems that resource management addresses
    and explains the scope of this book.


    # Business Problems


    If you work in a large data center environment, the following questions might
    be familiar to you.


    +   - The data center is full of systems. Many of those systems are lightly used,
    and more applications are always waiting to be brought online. There is no room
    to add more systems, and the available systems are getting more powerful. How
    can we add a new application to an existing system, without affecting the level
    of service provided to its users?


    +   - There are so many small server systems that they are a nightmare to manage.
    Each server has its own custom setup, and unlike an environment containing desktop
    machines, it''s hard to automate a cloned installation process. How can we combine
    lots of small servers into a few ones?


    +   - Very large systems are installed in the data center, and many applications
    share their resources. How can we measure and control these applications to meet
    a service level agreement (SLA) that we have with users?


    +   - The Solaris operating environment is being installed as a replacement for
    mainframes running MVS. How can mainframe techniques be applied to a UNIX system?
    What is the same and what is new?


    These are the questions answered by this book.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Scope


    The scope of this book can be summarized as:


    +   - The best way to use combinations of Sun Microsystems products to manage
    resources.


    +   - Generic resource management concepts and methods.


    +   - Comparison of UNIX system practices practices with mainframe class practices.


    Sun''s range of products provide a lot of built-in flexibility that can be deployed
    in many ways to meet the requirements of several markets. The documentation for
    these product covers all the options but normally provides only basic information
    about how these product can be used with other products. This book, on the other
    hand, focuses on resource management, looks at products that are relevant, gives
    detailed and specific information about how to choose the right set of products
    and features to solve resource management problems.


    To solve the problem, products must fit into an overall methodology that addresses
    the processes of workload consolidation and service level management. The principles
    are explained with reference to tools and products that can help implement each
    scenario. To manage the service level you provide, you must be able to measure
    and control the resources consumed by it.


    Resource management is an established discipline in the mainframe operations arena.
    As Solaris systems are deployed in the data center, mainframe staff must figure
    out how to applying existing management practices to these unfamiliar systems.
    One of the common complaints voiced by mainframe staff confronted with UNIX systems
    is that they don''t have the measurement data they need to do capacity planning
    and performance management properly. These techniques are critical parts of a
    consolidation and resource management process. Thus, this book provides detailed
    information on the tools and measurements available for Solaris systems. The Solaris
    operating environment is one of the best instrumented UNIX implementations, and
    it is supported by all the vendors of performance tools. However, not all commercial
    tools report Solaris-specific metrics.


    Resource management for UNIX systems is in its infancy compared to common practices
    under MVS. We are all trying to solve the same set of problems. So over time,
    the Solaris operating environment will provide comparable resource and service
    level management features.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Service Level Management


    This chapter describes the overall methodology of service level management so
    that the resource management component can be put into a wider context. It also
    describes and compares several approaches to resource management.


    # Service Level Definitions and Interactions


    This section starts with a high level view of service level management and defines
    a terminology that is based on existing practices.


    Computer systems are used to provide a service to end users. System and application
    vendors provide a range of components that can be used to construct a service.
    System managers are responsible for the quality of this service. A service must
    be available when it is needed and must have acceptable performance characteristics.


    Service level management is the process by which information technology (IT) infrastructure
    is planned, designed, and implemented to provide the levels of functionality,
    performance, and availability required to meet business or organizational demands.


    Service level management involves interactions between end users, system managers,
    vendors and computer systems. A common way to capture some of these interactions
    is with a service level agreement (SLA) between the system managers and the end
    users. Often, many additional interactions and assumptions are not captured formally.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'Service level management interactions are shown in FIGURE 2-1. Each interaction
    consists of a service definition combined with a workload definition. There are
    many kinds of service definitions and many views of the workload. The processes
    involved in Service Level Management include creating service and workload definitions
    and translating from one definition to another.


    The workload definition includes a schedule of the work that is run at different
    times of the day (for example, daytime interactive use, overnight batch, backup,
    and maintenance periods). For each period, the workload mix is defined in terms
    of applications, transactions, numbers of users, and work rates.


    The service level definition includes availability and performance for service
    classes that map to key applications and transactions. Availability is specified
    as uptime over a period of time and is often expressed as a percentage (for example
    99.95 percent per month). Performance may be specified as response time for interactive
    transactions or throughout for batch transactions.


    ![](img/52144374747884a32fdddbed4e8cd9d7_35_0.png)


    FIGURE 2-1 Service Level Management Interactions


    # System Level Requirements


    System managers first establish a workload definition and the service level requirements.
    The requirements are communicated to vendors, who respond by proposing a system
    that meets these requirements.


    # Sizing Estimates


    Vendors measure the system performance using generic benchmarks. They may also
    work with system managers to define a customer-specific benchmark test. Vendors
    provide a sizing estimate based on the service level requirements and workload
    definition. The basis of the sizing estimate can be a published benchmark performance.
    In some cases, the measured performance on a customer-defined'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'benchmark is used as the basis of sizing estimate. Vendors provide performance
    reliability for system components. They can also provide availability and guarantees
    for production systems with a defined workload (at a price). Vendors cannot provide
    unqualified guarantees because typically, many application and environmental dependencies
    are outside their control.


    # Service Level Agreements


    System managers and end users negotiate an SLA that establishes a user-oriented
    view of the workload mix and the service levels required. This may take the form:
    95th percentile response time of under two seconds for the new-order transaction
    with up to 600 users online during the peak hour. It is important to specify the
    workload (in this case the number of users at the peak period), both to provide
    bounds for what the system is expected to do and be precise about the measurement
    interval. Performance measures averaged over shorter intervals will have higher
    variance and higher peaks.


    The agreed-upon service levels could be too demanding or too lax. The system may
    be quite usable and working well, but still failing an overly demanding service
    level agreement. It could also be too slow when performing an operation that is
    not specified in the SLA or whose service level is too lax. The involved parties
    must agree to a continuous process of updating and refining the SLA.


    # Real User Experiences


    The actual service levels experienced by users with a real workload are subjective
    measures that are very hard to capture. Often problems occur that affect parts
    of the system not covered explicitly by the service level agreement, or the workload
    varies from that defined in the service level agreement. One of the biggest challenges
    in performance management is to obtain measurements that have a good correlation
    with the real user experience.


    # Service Level Measurements


    The real service levels cannot always be captured directly, but the measurements
    taken are believed to be representative of the real user experience. These measurements
    are then compared against the service level agreement to determine whether a problem
    exists. For example, suppose downtime during the interactive shift is measured
    and reported. A problem could occur in the network between the users and the application
    system that cause poor service levels from the end-user point of view but not
    from the system point of view'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'service levels inside a backend server system than at the user interface the
    client system, but it is important to be aware of the limitations of such measurements.

    transaction may take place over a variety of systems. An order for goods will
    affect systems inside and outside the company and across application boundaries.
    This problem must be carefully considered when the service level agreement is
    made and when the service level measurements are being defined.


    # Policies and Controls


    System managers create policies that direct the resources of the computer system
    to maintain service levels according to the workload definition specified in those
    policies. A policy workload definition is closely related to the service level
    agreement definition, but may be modified to satisfy operational constraints.
    It is translated into terms that map out system features. Example policies include:


    +   - A maximum of 600 interactive users of the order entry application at any
    time.

    - Order entry application has a 60 percent share of CPU, 30 percent share of network,
    and 40 percent share of memory.

    - If new-order response time is worse than its target, steal resources from other
    workloads that are overieving.


    The policy is only as effective as the measurements available to it. If the wrong
    things are being measured, the policy will be ineffective. The policy can control
    resources directly or indirectly. For example, direct control on CPU time and
    network bandwidth usage might be used to implement indirect control on disk I/O
    rates by slowing or stopping a process.


    # Capacity Planning and Exception Reporting


    The measured workload and service levels should be analyzed to extract trends.
    A capacity planning process can then be used to predict future scenarios and determine
    action plans to tune or upgrade systems, modify the service level agreement, and
    proactively avoid service problems.


    In cases where the measured workload from the users exceeds the agreed-upon workload
    definition or where the measured service level falls short of the defined level,
    an exception report is produced.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Accounting and Chargeback


    The accrued usage of resources by each user or workload may be accumulated into
    an accounting system so that projects can be charged in proportion to the resources
    they consume.


    # Resource Management Control Loop


    To manage a resource, you must be able to measure and control it. A control loop
    is set up that measures the performance of an application subsystem, applies policies
    and goals to decide what to do, then uses controls to change the resources being
    provided to that subsystem. This loop can be implemented manually on a time scale
    measured in days or weeks (by reconfiguring and upgrading entire systems), or
    it can be automated in software and run as often as every few seconds. The control
    loop is shown in FIGURE 2-2.


    ![](img/52144374747884a32fdddbed4e8cd9d7_38_0.png)


    FIGURE 2-2 Resource Management Control Loop


    A complete system implements many control loops. A brief digression into basic
    control theory is provided at this point to help explain the behavior of such
    systems.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# A Simple Approach to Control Theory


    We spend so much of our lives operating control loops that it is actually quite
    intuitive to most people. Designing a control loop is more complex and requires
    a more explicit understanding of the situation.


    You start with an objective, such as to steer a car around a corner while staying
    in the lane. You apply a control input by turning the steering wheel to the point
    that will get you around the corner. After a delay, the car responds, You measure
    the response, compare it with what you wanted, and obtain the error difference.
    If the difference is zero you don''t need to change the control input. If the
    turn is too wide, you need to increase the input. You have to decide how much
    extra correction is needed to compensate for being wrong the first time, and also
    decide whether the car has finished responding fully to the initial input. You
    may decide to over- or under-correct, and apply the correction gradually or quickly
    (for example, if you are heading straight for a lamp post!).


    ![](img/52144374747884a32fdddbed4e8cd9d7_39_0.png)


    FIGURE 2-3 Example Control Loop


    The first time you tried a car driving game on a computer, you probably wildly
    from side to side. This wild swinging is caused by over-correcting too late because
    you don''t have the same motion sensing inputs you have in a real car. When the
    car is oscillating, your corrections may end up being delayed to the point that
    you are turning the wheel the wrong way at the wrong time, and you might spin
    off or crash. Eventually, you learn to react based on what you see on the screen
    and make smaller corrections more quickly to keep the car on track and stable.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'In control terms, you are applying negative feedback to the system. You take
    the error difference between what you wanted and what you got, and apply the inverse
    of the error to the system to reduce the error in the future. The rate at which
    the system responds to changes is called the time constant for the loop. The amount
    of the error you feed back changes the characteristic behavior of the control
    loop. If you feed back a large portion of the error with a short control interval,
    the system is lightly damped and will be very responsive to sudden changes but
    will probably oscillate and forth. If you feed back a small portion of the error
    over a longer control interval, the system is heavily damped and will tend to
    be sluggish and unresponsive with a large constant time.


    When you apply these principles to computer resource management you can see that
    it is important to average measurements over an appropriate time scale and get
    the damping factor right. The resource manager needs to respond quickly to cope
    with sudden changes in the workload as many simultaneous user logins at the start
    of a shift, while maintaining a steady flow of resources to the workloads so that
    response times are consistent and predictable.


    # Viewpoints of Resource Management


    You can measure and control a computer system in many ways. This section examines
    various approaches to solving resource management problems. The methodology used
    depends upon the starting point of the developers, for example a network-centric
    methodology can be extended for use in other areas, so can a storage-centric or
    server-centric viewpoint.


    # Diverse Methods


    This diversity of approach occurs both because of the products that are available
    and because of the expectations of the end users who are purchasing solutions.
    In a large organization, several groups (such as system administrators, network
    managers, database administrators, and security managers) are responsible for
    different parts of operations management.


    In some organizations, each group is free to use its own methods and obtain its
    own tools. This can cause demarcation problems because there is so much overlap
    in the scope of each method. Or a single methodology and tool could be imposed
    by the dominant group. The problem with such an approach is that the methodology
    may be optimal for managing one aspect of the system only and could do a poor
    job in other areas.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'In an ideal world, all-encompassing mega-tool would implement an integrated
    methodology and solve all resource management problems. The closer you get to
    this ideal, the more expensive and complex the tool becomes. And you may not want
    all of its features. So it is harder to justifying it.


    A more pragmatic approach is to integrate simpler, more specialized tools that
    share information with each other, have a similar look and feel, and can be used
    as a standalone product as needed.


    Today''s diverse set of methodologies and tools have very little integration between
    them and several different user interfaces. The products produced by Sun Microsystems,
    Inc. are converging on a common user interface style and on common technologies
    for sharing information to provide better resource management components. This
    book''s primary role is to explain to data center operations managers how to use
    combinations of the current set of products and technologies. It also indicates
    the direction of the development and integration work that will produce the next
    generation of products.


    # The System-centric Viewpoint


    The system-centric viewpoint focuses on what can be done on a single server using
    a mixture of hardware and operating system features. The operating system provides
    basic management capabilities for many components such as attached network and
    storage devices. But it specializes in managing CPU and memory resources for a
    single desktop or server system. Dynamic Reconfiguration (DR), processor sets,
    Solaris Resource Manager™, and Sun Enterprise™ 10000 (also known as Starfire™)
    Dynamic System Domains (DDSs) are all system-centric resource management technologies.
    The hardware system-centric resource management tool is the Sun Enterprise SYMON™
    2.0 software. It is based on the Simple Network Management Protocol (SNMP), so
    it also has network management capabilities. The Solaris Management Console™ provides
    a more generic framework for gathering together operating system administration
    tools and interfacing to industry standard initiatives as the web-based management
    initiative (WebM) and the Common Information Model (CIM). The Starfire system
    currently uses its own HostView interface running on a separate system service
    processor (SSP) to manage domains.


    The system-centric viewpoint runs into problems when a lot of systems must be
    managed. Coordinating changes and allocating resources becomes complex rapidly.
    Tools like the Sun Enterprise SYMON 2.0 software can view many systems on one
    console, cannot replicate and coordinate changes over multiple systems. One reason
    why the Sun Enterprise SYMON 2.0 software does not fully support management of
    the Starfire system is because each domain on the system runs a separate copy
    of the Solaris operating environment and sees a different subset of the'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'hardware configuration. The next release of this software will be extended
    to view an SSP and all the domains in a Starfire system as a special kind of cluster
    so that it can be used in place of the HostView interface.


    The operating system and devices provide a large number of measurements of utilization,
    throughput, and component-level response times. There are several good ways to
    control CPU resources, but at present, there is no way to control the usage of
    real memory by a workload. The only way to constrain a workload that is using
    too much memory is to slow down or stop its CPU usage so that it stops referencing
    its memory, which will then be stolen by other, more active processes.


    Manual resource management policies can be implemented using the Sun Enterprise
    SyMON Health Monitor, which generates alerts when a component of the system becomes
    overloaded. The system administrator can then tune or reconfigure the system to
    avoid the problem. Automatic resource management policies are implemented by Solaris
    Resource Manager, which dynamically adjusts the priorities of processes to ensure
    that their recent CPU usage tracks the share of the system that has been given
    as a goal for that user.


    # The Cluster-Centric Viewpoint


    The cluster-centric viewpoint concentrates on coordinating resource management
    across the cluster. Systems are clustered together to provide higher availability
    and higher performance than that provided by a single system. A cluster is more
    complex to install and administer, so tools and methods attempt to automate cluster
    management to make it more like a single system. From a resource-management viewpoint,
    the primary issue is load balancing and the extra costs of accessing nonlocal
    information over the cluster interconnect. Sun has two kinds of clusters. The
    highly integrated SPARCluster™ product range is focused on improved availability
    in commercial environments. Its management tools will eventually become an integrated
    extension to the SyMON software. For high performance computing, Sun HPC Servers
    use the platform load share fairness (LSF) to perform load balancing on much larger
    and more loosely coupled clusters.


    At a cluster level, multiple system level measurements are compared to measure
    load balance and look for spare resources. The cluster interconnect utilization
    and proportion of remote data access are important additional measures. The primary
    resource management control is the choice of where to run new work. It is not
    currently possible to migrate a running job from one node in a cluster to another,
    or to checkpoint a job to disk and restart it again later, either on the same
    node or on a different one.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'When deciding on the CPU resources that are available on a node, it is easy
    to decide if there is spare CPU power, but very hard to decide if there is enough
    real memory. The kernel maintains a free list of memory, but there is also some
    proportion of memory in use as a file system cache that could be reclaimed to
    run a new job if there was a way to measure it. This is a current issue for the
    LSF product.


    # The Network-Centric Viewpoint


    From a network point of view, there are a large number of devices to manage. Many
    of them are network components with limited monitoring capabilities, such as bridges
    and routers. The primary resource that is managed is network capacity. At the
    intersection of servers and networks, there are products that perform protocol
    based bandwidth management on a per-server basis (such as Solaris™ Bandwidth Management
    software) or act as secure firewalls. In the telecommunications industry, network
    management encompasses all the equipment required to run a global system where
    the endpoints are mostly telephones or mobile cells, and the traffic is a mixture
    of voice and data. In this environment, SNMP is just too simple, so the more scalable
    OSI-based CMIP management protocol is often used. The Solstice™ Enterprise Manager
    is a Telco-oriented CMIP and SNMP management system that is used to manage cellular
    networks. In theory it could be used to manage computer systems and local area
    networks, but it was not developed to do this. Computer-oriented local and wide
    area networks are normally managed using SNMP protocols, with the Solstice SunNet
    Manager™ or HP View products collecting and displaying the data. Both products
    provide some visibility into what is happening in the computer systems on the
    network, but they are much more focused on network topology. At this level, resource
    management is done on a per-network basis, by controlling the priority of data
    flows through intelligent routers and switches. The Sun Enterprise Symon 2.0 software
    can act as a network management platform as well as a hardware management platform,
    which may help to integrate these two viewpoints.


    Protocol information along with the information found in packet headers and network
    addresses form the basis for network measurements. There is no user or process
    identifier in a packet, so it is hard to directly map network activity to system
    level unless an identifiable server process is dedicated to each protocol. Some
    protocols measure round trip times for their acknowledgments. This can provide
    an estimate of network latency between two systems.


    Network controls are based on delaying and prioritizing packets based on the protocol
    and destination data in the packet headers. This can occur at the servers that
    make up the end points or in the routers that connect them.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Storage-Centric Viewpoint


    Storage has recently moved from being a simple attached computer system peripheral
    to a complex managed entity in its own right. Networked storage using fibre channel
    puts an interconnection layer between multiple servers or clusters and multiple
    storage subsystems. This storage area network (SAN) can contain switches and routers
    just like local or wide area networks, but the protocol in common use is SCSI
    over fibre channel rather than IP over Ethernet. A SAN may span multiple sites,
    for example, where remote mirroring is being used for disaster recovery. Storage
    is also now open for access in a heterogeneous multi-vendor environment, where
    multiple server and storage vendors can all be connected over the SAN. This is
    an emerging technology, and tools to manage a SAN are still being developed. Sun
    provides one approach with an industry-wide initiative called Jiro. It is based
    on a distributed Java™ technology platform that can run anywhere a JVM is available,
    scaling from embedded devices through open systems into mainframe and enterprise
    environments. Jiro enables management of any storage resource in a heterogeneous
    distributed environment, from storage hardware, like devices and switches, to
    storage software like backup solutions and volume managers. Jiro is being promoted
    as an open multi-vendor standard.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_45_0.png)


    FIGURE 2-4 Storage Area Network


    Storage management has two constraints that make it interesting: one is that it
    must be distributed over many server systems and storage devices to be useful.
    The other is that these servers and devices come from many vendors and run different
    operating software. So Jiro cannot include a core dependency on the Solaris operating
    environment or other Sun products. Jiro must solve some of the generic generic
    problems of clustered and networked resource management. In particular, it manages
    the state of distributed devices in a persistent manner. Jiro must be capable
    of stand-alone operation, with component management interfaces to other products.


    Jiro enables resource management of capacity, performance, and availability of
    data storage. Backup and archival policies can be used to automate migration of
    data to a tape library. Measurements of capacity and performance characteristics
    de can be combined with availability policies, so the operator will be alerted
    of any problems. Ultimately storage subsystems will be reconfigured automatically.


    At present, Jiro does not include a general purpose rule script-based policy engine.
    It provides the infrastructure necessary to create policies, allowing the view
    of storage to be elevated to the Storage Service level.


    Resource Management'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Integration between the system viewpoint and the storage viewpoint has some
    of the same problems as the integration of system and network viewpoints. The
    traffic on the SAN does not contain any indication of which user or process generated
    the request. Within the Solaris software, it is possible to trace storage accesses
    on a per-process, per device basis. But the overhead of collecting and analyzing
    this data is quite high. There may be a need for a Jira Solaris Storage Bandwidth
    Manager to bridge the two management viewpoints in a way that accounts for, prioritizes,
    and controls SAN bandwidth on a per process or user basis.


    # Database-Centric Viewpoint


    A database management system has its own notion of users, manages its own memory
    and storage allocation, and can appear as a "black box" to the server system on
    which it runs. Some database vendors have implemented their own resource management
    capability as per user or per transaction basis. This may take the form of priorities,
    shares, or limits on CPU usage per user or per transaction. The database also
    contains its own logic that implements policies and dynamically controls resources.


    The database implementation can sometimes work well with server-based resource
    management. This is described in more detail in Chapter 4.


    Integration is needed between the internal database resource management capabilities
    and the other resource management viewpoints.


    # Application-Centric Viewpoint


    Large and complex applications such as SAP R/3, Baan, and Oracle Financials contain
    their own resource management concepts and controls. For example, Oracle Financials
    implements its batch queue system to decouple the generation of large reports
    from the interactive response time of the users. A report is sent to a subsystem
    called the concurrent manager, which is configured to have a number of parallel
    streams of work of various types according to the local policy. Concurrent manager
    activity can be scheduled to occur outside normal working hours, or it can be
    used to soak up spare cycles during the day.


    SAP R/3 measures the response time of important transactions and breaks these
    down into application server time and backend database server time. As many users
    connect to an application server and many database servers connect to a single
    backend database, there is no concept of which user is doing work on the backend
    system. The application itself must have the instrumentation to keep track of
    what is going on. The application directly implements the policies and controls.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Integrated Methods


    In a large organization, all of the above viewpoints are useful, and some combination
    of methodologies is probably implemented already. FIGURE 2-5 indicates the relative
    breadth of coverage of each methodology. A darker box shows that better coverage
    is available, a white box indicates that little or no support is provided for
    a combination.


    | Method used to manage resources in: | Application | Database | Network | Cluster
    | Server | Storage |

    |--- | :---: | :---: | :---: | :---: | :---: | :---: |

