  md: "# Solaris Bandwidth Manager Architecture\n\nSolaris Bandwidth Manager consists\
    \ of the following major components:\n\n+   - The administration tool, batool,\
    \ provides a graphical interface for configuring the Solaris Bandwidth Manager\
    \ software. This can be run as an applet or an application from any machine in\
    \ your network that has a Java Virtual Machine.\n- The policy agent implements\
    \ the configuration and handles communication with the kernel module. See \"The\
    \ Policy Agent\" on page 240 for details of how the policy agent works.\n- The\
    \ kernel module is viewed as a STREAMS driver, /dev/ipqos, by the tools in user\
    \ space, and is viewed as a STREAMS module, ipqos, by the IP stack. It contains\
    \ the classifier and the scheduler.\n  - The classifier allocates packets to a\
    \ class queue.\n  - The scheduler determines the order in which queued packets\
    \ are forwarded across the network and applies the bandwidth limits and priorities\
    \ configured for each type of traffic. Class Based Queuing (CBQ) is the underlying\
    \ queuing technology used in Solaris Bandwidth Manager.\n- Commands, utilities\
    \ and API’s for managing the Solaris Bandwidth Manager software and for monitoring\
    \ your network."
  merge: -1
