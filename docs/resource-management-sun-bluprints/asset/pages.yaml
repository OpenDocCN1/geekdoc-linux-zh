  md: '# Controlling NFS CPU Usage


    NFS servers are implemented in the Solaris kernel as kernel threads and run in
    the system class. You can control the amount of resource allocated to the NFS
    server in three ways:


    +   - Limit the number of NFS threads with nfsd

    - Limit the amount of CPU allocated to the system class with prset

    - Indirectly control the number of NFS ops with Solaris Bandwidth Manager.


    You can control the number of NFS threads by changing the parameters to the NFS
    daemon when the NFS server is started. Edit the start-up line in /etc/rc3.d/S15nfs.server:


    ```

    /usr/lib/nfs/nfsd -a 16 (change 16 to number of threads)

    ```


    The actual number of threads required will vary according to the number of requests
    coming in and the time each thread spends waiting for disk I/O to service the
    request. There is no hard tie between the maximum number of threads and the number
    of NFS threads that will be on the CPU concurrently. The best approach is to approximate
    the number of threads required (somewhere between 16 to 64 per CPU), and then
    find out if the NFS server is doing its job or using too much CPU.


    NFS is a fairly lightweight operation, so it is unlikely that the NFS server CPU
    usage is an issue. The CPU time consumed by the NFS server accumulates as system
    time. If the system time is high, and the NFS server statistics show a high rate
    of NFS server activity, then curtail CPU usage by reducing the number of threads.


    A far more effective way to control NFS servers is to use the Solaris Bandwidth
    Manager product to limit the traffic on the NFS port, 2049, and indirectly cap
    the amount of CPU used by the NFS server. The disadvantage is that spare CPU capacity
    can be wasted because managing bandwidth usage does not reveal how much spare
    CPU is available.


    To understand if you have over constrained NFS''s allocation of resources you
    can use the new NFS metrics and look at the iostat column.


    # NFS Metrics


    Local disk and NFS usage are functionally interchangeable, so the Solaris 2.6
    operating environment was changed to instrument NFS client mount points the same
    way it does disks. NFS mounts are always shown by iostat and with Sar.'
