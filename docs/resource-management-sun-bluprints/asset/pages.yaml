  md: '# Preface


    This book is one of an on-going series of books collectively known as the Sun
    BluePrints™ Program. The Sun BluePrints Program is managed by the Enterprise Engineering
    Group. This group provides a framework to identify, develop, and distribute best
    practices information that applies across Sun products for the data center. This
    Resource Management BluePrint describes the best practices for combinations of
    products to manage resources.


    # Sun BluePrints Program


    The mission of the Sun BluePrints Program is to empower Sun customers with the
    technical knowledge required to implement reliable, available, extensible, and
    secure information systems within the data center using Sun products. The Sun
    BluePrints Program is managed by the Enterprise Engineering Group. This group
    provides a framework to identify, develop, and distribute best practices information
    that applies across the Sun product line. Technical subject matter experts in
    various areas contribute to the program and focus on the scope and usefulness
    of the information.


    The Enterprise Engineering Group is the primary provider of the technical content
    of the Sun BluePrints Program that includes books, guides, and online articles.

    Through these vehicles, Sun can provide guidance, installation and implementation
    experiences, real-life scenarios, and late-breaking technical information.


    The bimonthly electronic magazine, Sun BluePrints Online, is located on the Web
    at http://www.sun.com/blueprints. To be notified about updates to the Sun BluePrints
    Program, please register yourself on this site.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Who Should Use This Book


    This book is for experienced system administrators familiar with UNIX® and the
    Solaris™ operating environment.


    # How This Book Is Organized


    This book is divided into two major sections.


    Part I, "Architecture," describes the overall architecture of resource management
    introduces policy definition and resource control and describes a selection of
    workloads and common methods of measurement. It contains the following chapters:


    +   Chapter 1 "Introduction, "Introduction," introduces the business problems
    that resource management addresses and explains the scope of this book.


    +   Chapter 2 "Service Level Management, "Methodology," defines the overall methodology
    of service level management so that the resource management component can be put
    into a wider context. It also describes and compares several different approaches
    to resource management.


    +   Chapter 3 "Policies and Controls, "Policy and Controls," examines a range
    of policy and control types and ways to implement them, then looks at each subsystem
    in turn to see what resources can be managed.


    +   Chapter 4 "Workload Management, "Workload Management," describes several scenarios
    to illustrate the diversity of real life situations and the different tools that
    are appropriate.


    +   Chapter 5 "Workload Measurements, "Workload Measurements," discusses the measurement
    stores that are important for resource management and the detailed naming of some
    of the available measurements.


    Part II, "Products,\" describes the products available for resource management
    and explains how they work alone and together. It contains the following chapters:"


    +   Chapter 6 "Solaris Operating Environment, "Solaris Operating Environment,"
    discusses the Solaris operating environment, focusing on several standard capabilities
    that are useful for resource management.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Chapter 7 Solaris Resource Manager Software “Solaris Resource Manager Software,”
    discusses the Solaris Resource Manager (SRM) software, which provides the ability
    to allocate and control major system resources.


    Chapter 8 “Dynamic System Domains and Dynamic Reconfiguration, Dynamic Systems
    Domains and Dynamic Reconfiguration,” discusses the Dynamic Systems Domains and
    Dynamic Reconfiguration within the framework of resource management.


    Chapter 9 “Solaris Bandwidth Manager Software, “Solaris Bandwidth Manager Software,”
    explains how to use this product as part of a resource control framework.


    Chapter 10 “Load Sharing Facility Software, “Load Sharing Facility Software,”
    explains how to deploy LSF as a resource management tool and how it interoperates
    with other Solaris resource management controls.


    Chapter 11 “The Jiro Initiative, “Jiro and Resource Management,” describes the
    product in detail and explains how to use it as part of a resource control framework.


    Chapter 12 “Sun Enterprise SyMON 2.0 Software, “Sun Enterprise SyMON 2.0 Software,”
    describes when and how to use this product for monitoring resources.


    Chapter 13 “IBM Workload Manager for OS/390, “IBM Workload Manager,” provides
    an overview of what is possible with extensive use of resource management and
    serves as a guide to help design long term resource management goals for application
    developers.


    Glossary is a list of words and phrases found in this book and their definitions.


