  md: '# SOLARIS™


    RICHARD Mc DOUGALL ADRIAN COCKCROFT EVER HOOGDOORN ENRIQUE VARGAS TOM BIALSKI


    # Sun


    ![](img/52144374747884a32fdddbed4e8cd9d7_371_0.png)


    ![](img/52144374747884a32fdddbed4e8cd9d7_371_1.png)


    # BLUEPRINTS


    Resource Management is a practical guide that shows how to manage system resources
    to meet system and performance service levels. The theory of Resource Management
    is introduced and a detailed analysis of what is required to implement resource
    management in the Solaris environment is explored. The BluePrint includes examples
    of typical system workloads and how the Solaris resource management facilities
    and products can be used with these workloads. Workloads include Databases, File
    Servers, Web Servers, Batch Tasks, and Internet Service Provider configurations
    such as ftp.


    # ABOUT THE AUTHORS


    This BluePrint was produced by a team of performance and resource management specialists
    from the Enterprise Engineering group at Sun.


    RICHARD Mc DOUGALL has over 11 years of UNIX experience, including application
    design, kernel development, and performance analysis, and specializes in operating
    system tools and architecture.


    ADRIAN COCKCRO, the author of Sun Performance and Tuning, is an accomplished performance
    specialist for Sun Microsystems and recognized worldwide as an expert on the subject.


    EVER HOOGDOORN is a Networking and Security specialist for the Enterprise Engineering
    Group.


    ENRIQUE VARGAS brings a wealth of large systems experience to Sun and specializes
    in high-end UNIX offerings including the Enterprise 10000. Enric comes to Sun
    from Amdahl Corporation where he focused on UTS* (mainframe UNIX) and high-end
    Solaris systems.


    TOM BIALSKI joined Sun in 1984 as a Systems Engineer and has worked to provide
    customers with Sun-based solutions in various roles since then.


