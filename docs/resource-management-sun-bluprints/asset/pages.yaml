  md: '![](img/52144374747884a32fdddbed4e8cd9d7_124_0.png)


    **FIGURE 5-2** Perspective Log-Log Plot of Response Time Versus Distribution


    The plot in FIGURE 5-2 shows that the most probable response is at about 0.5 seconds
    and 1 Kbyte. Remember that the average response time is 2.3 seconds on this data.
    It is clear that the average does not tell the whole story.


    # # Internet Servers Summary


    Log files are a rich source of performance information. Watching the rate at which
    they grow and breaking down the mix of logged operations is a powerful technique
    for getting good application-level performance measurements. You can apply this
    technique to many other applications, such as ftp and mail servers, as well as
    any other application that can write a line to a file when it does some work.'
