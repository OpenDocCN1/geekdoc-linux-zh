- img_proc: true
  md: "# DR-Detach Prerequisites and Actions\n\nTo guarantee a successful DR-detach\
    \ process the following prerequisites must be fulfilled:\n\n# Pre-Boot Requirements\n\
    \nThe following prerequisites require a system reboot to take effect:\n\n+   -\
    \ All system memory must not be interleaved between system boards.\n\n+   - In\
    \ the Solaris 2.5.1 and Solaris 2.6 5/98 operating environments, the dr_max_mem\
    \ OBP environment variable must be set to a value equal to or greater than 512\
    \ Mbytes. The dr_max_mem OBP environment variable is not required after Solaris\
    \ 7 5/99 because the required VM structures are dynamically allocated.\n\n+  \
    \ - The soc driver requires the following entry in the /etc/system file to enable\
    \ the suspend-resume/detach-attach features:\n  - set soc:soc_enable_suspend=1\n\
    \  - In the Solaris 2.6 5/98 operating environment, the soc driver requires the\
    \ following entry in the /etc/system file to enable the suspend-resume features:\n\
    \  - set local:socal_enable_suspend=1\n  - The pln driver requires the following\
    \ entry in the /etc/system file to enable the suspend-resume/detach-attach features:\n\
    \  - set pln:pln_enable_suspend=1\n  - Activation of the kernel cage requires\
    \ the following entry in the /etc/system file:\n  - set kernel_cage_enable=1\n\
    \n# System Requirements\n\nThe following prerequisites need to be fulfilled immediately\
    \ before the DR-Detach operation takes place:\n\n+   - On-board non-DR-compliant\
    \ drivers need to be unloaded using the modunload(1M) utility.\n\n+   - Real-time\
    \ processes are not allowed when the kernel cage is being relocated because their\
    \ behavior becomes unpredictable with the operating system quiescence. All real-time\
    \ processes must be reassigned an alternate scheduling class using the prioritycntl(1)\
    \ command or killed using the kill(1) command. The hostview(1M) interface provides\
    \ the force option to override this requirement.\n\n+   - Processor sets or processes\
    \ hosted by the system board to be removed are not allowed. Processor sets must\
    \ be torn down using the prset(1M) command and processes must be on-board processors\
    \ must be unbounded by the pbind(1M) command."
