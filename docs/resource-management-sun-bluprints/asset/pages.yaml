  md: 'virtual Web hosting A web server configuration where a single server is configured
    to respond to hundreds or thousands of Internet addresses. Virtual web hosting
    is often used in situations where web sites receive little or no activity most
    of the time. In these situations, it is usually too expensive to dedicate a single
    computer system to each web site.


