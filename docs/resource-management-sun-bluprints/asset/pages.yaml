  md: 'SyMON software has a dynamically extensible agent. At run time, you can request
    to load a new module, and this module will be automatically loaded the next time
    the SyMON agent starts up.


    # Resource Monitoring with SyMON Software


    The SyMON software can be used in several ways to monitor the resource usage of
    systems, this can be useful in both manual and automatically managed resource
    control environments. This section illustrates how to configure and use the SyMON
    software to perform basic monitoring operations and to discover the resources
    that are available in a system. The system used in the examples is an Ultra Enterprise
    4000 configured with two 167MHz CPUs and for about 300 disks.


    # The SyMON Health Monitor


    The SyMON software includes a system health monitoring module that you can use
    in a resource management scenario to see if a system has enough resources to run
    comfortably. For example, if the CPU state is reported as red, that system probably
    needs either less work or more CPU power. Similarly, if the memory rule reports
    red, then the system may need more memory.


    The health monitor is based on a set of complex rules developed over several years
    by Adrian Cockcroft, one of the authors of this book. The rules have become known
    as the "virtual artisan" rules as this is the name of the SE Toolkit script that
    first implemented them. The health monitor is not enabled by default when you
    first install the SyMON software because only the basic modules are loaded into
    the agent.


    To load the health monitor module, start the SyMON program with the default administrative
    domain. Select the system and popup a menu. Then, select the Load Module option
    from the menu. In the example shown in FIGURE 12-2, a single red alert is present
    because one of the file systems on this machine is 98 percent full.'
  merge: -1
