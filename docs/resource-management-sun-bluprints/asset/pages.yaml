    brdcstxt 14694 norcvbuf 0 nomtbuf 0 phy_failures 0

    ```


    Most of these statistics are related to the Ethernet MAC and the network interface
    card hardware itself. In general, these counters help troubleshoot hardware

    problems. Every network interface card typically has different counters, which
    can

    change with the operating system releases. Sun does not officially support the

    netstat option.'
