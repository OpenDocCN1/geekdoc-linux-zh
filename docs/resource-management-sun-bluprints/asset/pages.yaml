  md: '# Changing the Default User Usage Decay


    The default usage decay parameters are appropriate for consolidating typical commercial
    workloads such as OLTP, batch, web servers and so on. However they may be inappropriate
    for timeshare environments such as universities and HPC environments. Where the
    usage history is decayed over a period of minutes, it means that over the period
    of an hour or a day users may overconsume their share of the machine.


    A larger usage decay time will resolve such a problem and must be set on a global
    basis. The decay time can be set in hours or seconds.


    ```

    # srmadm set useddecay=4h


    # srmadm show -V 3

    ```


    Usage decay rate half-life = 4.0 hours, (0.999807477651 - 4 second units, 0.999999518648
    - 100 Hz units)


    Note that there are side effects of setting a large usage decay. Users can consume
    their share without knowing it. For example, a user can use 100 percent of the
    CPU for a sustained period when there are no other users on the system. Suppose
    that a user was granted 5 percent of the system but used 100 percent for two hours
    when no other users were logged in. Then, when other users log in the first user
    will almost stop until his usage is decayed.


    # Changing the Maximum User Share


    Another interesting factor is the maximum user share clamp. This limits the maximum
    amount of share a user can get in a CPU constrained environment. The maxushare
    parameter, by default, limits users from exceeding 2.0 times their share. This
    parameter does not affect users in a case where each of two users is given 50
    percent of the system, allowing either to swing to 100 percent. If you repeated
    the example with different shares, the results would be quite different. FIGURE
    7-22 shows an example where user 1 is given 90 shares and user 2 is given 10 shares.
    Notice that even though user 2 has no usage history and should be able to use
    100 percent for a short duration, only 20 percent is realized.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_212_0.png)


    FIGURE 7-22 Effect of Maximum User Share Clamping (default maxushare=2)


    You can set the maximum share clamp in two ways. You can adjust the maxushare
    parameter.


    ```

    ```srmadm set maxushare=10 ```

    ```


    Or completely remove the clamp.


    ```

    ```# srmadm show limshare

    yes

    # srmadm set limshare=n

    # srmadm show limshare

    no```

    ```


    Both these parameters are global.'
