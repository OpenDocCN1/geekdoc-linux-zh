    want to mix decision support and OLTP applications on the same system, you need
    resource management so that the decision support does not affect the response
    times for the users of the OLTP system. Without consolidation, workload management
    is an important tool that can provide resource allocation for users according
    to importance. (For example, in the case where telesales users have a higher importance
    than general accounting users.)


