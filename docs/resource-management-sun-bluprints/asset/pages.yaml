  md: '# Starfire Architecture


    Each DSD is centrally managed by the SSP. The SSP is an independent workstation
    loaded with the Solaris operating environment and additional Sun software packages,
    which manages the Starfire hardware and DSD resource allocation (see FIGURE 8-5).
    The SSP manipulates system board hardware registers through an Ethernet link attached
    to the control board to reflect DSD boundaries. The control board converts TCP/IP
    traffic from the SSP to the JTAG protocol.


    ![](img/52144374747884a32fdddbed4e8cd9d7_239_0.png)


