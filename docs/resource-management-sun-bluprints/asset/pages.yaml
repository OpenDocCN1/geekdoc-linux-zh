    of memory and over 20 Terbytes of disk space.


    # Sun Enterprise SyMon

    2.0


    A product developed by Sun to act as a user interface to hardware features. It
    is a powerful and extensible system and network monitoring platform that is used
    to manage other products. Sun Enterprise SyMon 2.0 is a Java-based monitor with
    multiple user consoles that can monitor multiple systems using the secure extensions
    to SNMPv2 to communicate over the network.


    # SunNet Manager


    See Solstice SunNet Manager.


    # SyMON


    See Sun Enterprise SyMon 2.0.'
