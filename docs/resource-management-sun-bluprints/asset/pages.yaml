    utilization. That correlation depends very much on the type of NFS workload. A
    data-intensive NFS environment moves large files and tends to saturate networks
    is very different from an attribute-intensive environment, which tends to saturate
    CPUs with lots of small requests for file attributes, such as a software development
    compile and build server.


