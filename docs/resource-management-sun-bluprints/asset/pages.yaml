  md: '# Plug-ins


    Java plug-ins can be developed to implement network usage policies. For instance,
    a plug-in can be developed to perform internal statistics monitoring and react
    to statistics events by instigating an action. The action could be to generate
    an alert, or to dynamically change the configuration of the Solaris Bandwidth
    Manager software.

    A concrete example is a plug-in that checks traffic statistics. If it detects
    Premium Class traffic is reaching capacity, it can dynamically reconfigure the
    Solaris Bandwidth Manager software. As a result, Standard Class is disconnected
    to ensure that Premium Class traffic has guaranteed access.

    Plug-ins are implemented using the Java Dynamic Management Kit. The plug-ins are
    m-beans, instantiated in the Java Dynamic Management Kit management framework
    in the policy agent. They can be pushed to or pulled from the policy agent dynamically,
    without having to restart the application.


    # Applications


    The Solaris Bandwidth Manager APIs can be used to develop self-contained management
    applications or interfaces to existing management applications. For example, an
    application could be developed that provides a GUI to integrate the Solaris Bandwidth
    Manager software into a proprietary network management solution.'
  merge: -1
