    Processors with LWPs bound to them using pbind(LM) cannot be assigned to or removed
    from processor sets.


    The -u option removes the processor set bindings from all the LWPs of the specified
    processes, allowing them to be executed on any on-line processor if they are not
    bound to individual processors through pbind.


    The super-user may bind or unbind any process to any active processor set. Other
    users may only bind or unbind processes to system processor sets. Furthermore,
    they may only bind or unbind processes for which they have permission to signal,
    that is, any process that has the same effective ID as the user.


    The initial state is all CPUs belong to a default system processor set. You can
    create additional sets by taking CPUs from the system set. The kernel only uses
    the system set for normal operations, although interrupts are handled by processors
    regardless of which they belong to. At least one CPU will always remain in the
    system processor set. For example, NFS services will run only on the system processor
    set.


    If you have a mix that includes some NFS service needs to be constrained, this
    is one way to accomplish that. In general, the system set should be as large as
    possible, perhaps shared with one of your regular workloads so that you don''t
    starve the kernel of CPU time.


    # Published Dual TPC-C and TPC-D Results


    Sun has published a fully audited benchmark in which an online transaction processing
    TPC-C workload was run on the same machine at the same time as a data warehouse
    TPC-D workload. This was managed using processor sets. A 16-CPU Sun Enterprise
    6000 was divided into an 8-CPU system processor set and an additional 8-CPU user-created
    set. A single copy of the IBM DB2 Universal server database'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'code was used to create two database instances on separate parts of the disk
    subsystem. When the benchmark was run, the continuous stream TPC-C transactions
    at a constant rate, providing good response times to the online users. The large
    and varied TPC-D transactions were constrained and did not affect the online user
    response times. The overall throughput was less than it might have been if the
    idle time in each had been used by the other workload, by consistency of state
    response times and throughput is a requirement for an audited TPC-C result, and
    it could not be achieved without using processor sets in this way.


    The TPC-C summary is at:


    http://www.tpc.org/results/individual_results/Sun/sun.ue6000.ibm.esf


    The TPC-D summary is at:


    http://www.tpc.org/results/individual_results/Sun/sun.ue6000.ibm.d.es


    # How Process Partitioning Works


    The Solaris operating environment maintains a queue of jobs that are ready to
    run on a per-CPU basis. There is no single global run queue. Older versions of
    the Solaris operating environment implement processor binding using the pbind
    command and underlying system calls. A process is bound to a CPU with pbind, but
    it is not exclusive. Other work can also run on that CPU. With prset, the binding
    is to a group of CPUs, but it is also an exclusive binding, and nothing else will
    be scheduled to run on that set. You can use pbind within any set, to give a further
    level of control over resource usage.


    The parset works is to create a kind of virtual machine for scheduling purposes.
    Once a process is bound to that set, all child processes are bound to that set,
    it is sufficient to bind a shell or startup script for an application. You must
    have root permissions to make bindings.


    With processor sets, you can split the list of processors into disjoint subsets.
    When you create a processor set, you create a new list with the processors that
    are in the set. The processors are taken out of the normal list of processors
    that run everything not in the set. Processes assigned to the set run on the processors
    in the set''s list and can migrate between them. Other processes and (non-interrupt)
    kernel threads cannot run on those processors; they no longer have access to them.
    It''s as if the processors have been taken off-line. The exception is kernel threads
    that can be bound to a specific processor for one reason or another, but this
    is unusual.'
