  md: '# Virtual Memory and Databases


    The SRM software and resource limits limit the amount of virtual memory by processes,
    users, and workloads. This capability does not manage physical memory, but it
    effectively restricts the amount of global swap space consumed by each user.


    When a user or workload reaches the virtual memory limit, the system returns a
    memory allocation error to the application, that is calls to malloc() fail. The
    same error code is reported to the application as if application had run out of
    space.


    In practice, many applications do not respond well to memory allocation errors
    because it is very hard to recover from a lack-of-memory error without making
    some additional demand for memory. Because of this, it is a high risk to ever
    let a database server reach its virtual memory limit. If the limit is reached,
    the database engine may hang or crash, and the database may have to be restarted.


    It is best to set a high virtual memory limit so that the limit can never be reached
    under normal circumstances. However, the virtual memory limit can be used to place
    a ceiling on the entire database server server to stop a user with a memory leak
    from affecting other databases or workloads on the system.


    # Database Consolidation


    You can consolidate databases using a number of resource management techniques.
    Choose the technique based on the supportability and functionality of the solution.
    Not all databases are supported under each of the resource management facilities.
    Because most consolidated database servers are mission-critical production servers,
    this should be the primary concern.


    The objective for successful consolidation is to provide strong insulation between
    each database instance. This requires careful resource management of CPU, memory,
    I/O, and network traffic.


    # Insulating CPU Usage


    Processor usage is a relatively easy resource to isolate. There are several mechanisms
    by which this can be achieved. There is a trade-off between the strength of insulation
    and the flexibility of resource allocation. At one end of the scale is Starfire
    dynamic system domains, which provides the same level of insulation as separate
    machines but requires manual intervention to shift resources between database
    instances. There is also a large four granularity of resource allocation, which
    is four processors at a time. At the other end of the spectrum is the SRM software,
    which provides'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'fine-grained resource management with the ability to dynamically assign resources
    whenever they are needed. But it also provides much lower insulation between the
    applications.


    ![](img/52144374747884a32fdddbed4e8cd9d7_106_0.png)


    **FIGURE 4-28** Consolidation of Two Databases with Solaris Resource Manager


    The advantage with the SRM software is that resources are completely dynamic.
    If one database is not using the resources, they are available to the other database.
    System resources are not wasted because spare CPU cycles can be used by any other
    workload requiring. The more workloads consolidated, the flatter the total resource
    usage becomes. By doing this, you can often size a system for the average resource
    requirements instead of the peaks.


    Processor sets provide a middle ground. The granularity is one CPU, and the resources
    are easier to reallocate with domains, but still relatively static in nature.
    Processor sets and domains, however, provide the static processor assignment and
    granularity required by some databases. In some cases, this is the only supported
    way of dividing resources between databases. Unfortunately, resources are statically
    assigned. Although some movement of resources is possible, it means that you must
    size each database instance for most of its peak requirements.


    # # Insulating Memory Usage


    Databases have three types of memory usage, which have very different characteristics:


    +   - shared memory area

    - private memory area

    - file system paging memory


    The shared memory area is often the largest component of the database''s memory
    requirements. It is the easiest to insulate between instances because the memory
    is allocated as shared memory. All mainstream databases allocate this intimate'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'shared memory (ISM), which wires down the memory so that it can''t be paged.
    Because this memory is wired down, the memory allocated to each instance cannot
    steal memory from another. However, this poses a challenge for dynamic memory
    resource allocation, such as dynamic reconfiguration because the wired-down memory
    must be unallocated before it can be removed from the system, requiring quiescing
    of the database.


    The private memory is the additional memory that a database uses, and over the
    large shared memory segment that is typical of many databases. The private memory
    is the regular process used by each process that the database engines processes,
    and it is a regular pageable memory. For example, the Oracle shadow processes
    have a small private memory size of about 500k per process. The Oracle parallel
    query processes may use several megabytes per process. The private memory area
    requirements for each database vary, but they are generally minutes smaller than
    the global shared memory requirements. Amount of memory used is sometimes configurable.
    Simple capacity planning ensures that sufficient system-wide memory exists to
    cover all of the database private memory requirements. Take care when including
    Decision Support System (DSS) database instances they often have high private
    memory requirements.


    Often overlooked are the memory requirements of the file system. By using raw
    devices for all instances or by using the direct I/O feature of the UFS file system,
    the file system bypasses the Solaris page cache. In this case, we do not need
    to take into consideration the memory use of the file system.


    The Solaris page cache causes a huge memory demand, which places pressure on the
    database private memory and breaks down any insulation between established databases.
    Priority paging puts a hard fence between the file systems and applications, and
    the file system will only use free memory in the system for its cache. If you
    plan to run a database on file systems, consider this a mandatory requirement.
    See Chapter 3 for more information.


    In summary, to provide proper memory insulation between databases, ensure the
    following:


    +   - Use ISM for the shared global areas to wire down memory.


    +   - Use proper capacity planning and parameters to ensure there is sufficient
    RAM for private memory requirements.


    +   - Use either raw disk devices or ensure that priority paging is installed
    to prevent file system memory pressure.


    # Insulating I/O


    Ensure that I/O activity from one application does not affect another application
    in an undesirable way. The best way to insulate I/O within a single database instance
    is to make sure that application tables are placed on separate I/O devices. This'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'leaves log devices, which can be a source of I/O contention. Ensure that adequate
    I/O bandwidth, spindles, and, where possible, hardware caching is provided for
    adequate performance for the log devices.


    Databases can be consolidated by simply ensuring that each database is assigned
    its own I/O devices. This completely insulates one database from another. However,
    you must also make sure that all data paths from the server to the storage device
    are carefully insulated. For example, two databases can be placed on their set
    of disks within a Sun StorageEdge™ A3500 storage system. However, because both
    sets of disks use the same SCSI channel to the host, I/O is not properly insulated.


    If you must use a single storage controller, use capacity planning so that sufficient
    bandwidth is available to combine both. For OLTP applications this is rarely an
    issue because the bandwidth requirements are so low. For example, an OLTP system
    generating 2000 8-kilobyte IOPS only requires 16 Mbytes of I/O bandwidth. A decision
    support application is completely different. A single decision support workload
    can generate several hundred megabytes per second of I/O. In addition to this,
    decision support often generates enough I/O to overwrite the cache continuously
    (cache wiping), which hurts the OLTP random I/O that makes extensive use of the
    storage cache. Do not consider a single storage controller for consolidation of
    decision support workloads with OLTP workloads.


    # Databases in a Resource Managed Environment


    Relationships with databases and resource management products are many and vary
    with each database type. For example, if you add CPU resources to an instance
    of Oracle 7, the Oracle engine automatically picks up those resources, whereas
    other databases must be restarted to use the newly available resources. (Note,
    however internal table sizes and latch sizing will not be automatically adjusted,
    and performance may improve after a restart of the database.) To understand how
    different databases work within a resource management environment, look at the
    different database topologies and explore what happens to each database when you
    add or remove CPU, memory, or I/O resources.'
