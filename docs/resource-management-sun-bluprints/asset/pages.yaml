  md: '# Starfire DR Architecture


    The DR framework was merged in Solaris 7 to provide some module commonality between
    the Starfire and the Sun Enterprise 3000-6500 platforms. FIGURE 8-7 shows all
    software modules involved in the Solaris 7 Starfire DR for both the SSP and DSD
    sides.


    ![](img/52144374747884a32fdddbed4e8cd9d7_242_0.png)


    FIGURE 8-7 Solaris 7/59 Starfire DR Software Architecture


    The Starfire platform, all DR operations are initiated by the SSP, and only one
    outstanding operation is allowed at a time. Both the SSP and the DSD manage their
    own states to synchronize and guarantee the integrity of the DR operations.


    The hostview(1M) and dr(1M) applications on the SSP provide user interfaces for
    executing DR operations. Both applications are dynamically linked to the libdr.so
    shared-object library, which provides access to the dr_daemon process on the DSD
    through TCP/IP Remote Procedure Calls (rpc 3N). The DR daemon process acts as
    a translator and intermediary between the SSP and the DSD.


    Chapter 8 Dynamic System Domains and Dynamic Reconfiguration 211'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The libdr.so library invokes both the hpost (1M) and obp_helper (1M)

    processes to resource changes in the OBP kernel device tree and to execute

    POST on added system boards.


    If the ap_daemon were present on the server, the dr_daemon process would\communicate
    appropriate device information to invoke the rerouting of I/O calls

    through registered alternate devices. The dr_daemon invokes the dr driver module,

    which is a common, platform-independent module used by the Starfire

    platform only. The dr driver communicates with the loadable drmach platform-

    specific module to invoke hardware-specific functions. Currently, there is only
    one

    drmach module applicable to the Starfire platform.


    The ndi (nexus device interface) layer provides the framework to manipulate the

    I/O device tree in support of the DR-attach and DR-detach operations. The DR

    module will register the addition or removal of CPU, memory and I/O resources

    using the generic Solaris kernel interfaces.


    # Starfire DR-Detach Details


    The software mechanism by which Dynamic Reconfiguration reduces resources

    available to the operating system is called detaching (see FIGURE 8-8).


    The DR-Detach process requires you to do strategic planning because it reduces
    the

    overall CPU and memory resources available to the DSD, and it may involve

    removing I/O interfaces that are critical to the operation of the machine. Before

    removing a system board, it is critical that all on-board I/O devices be closed
    since

    I/O drivers will fail to detach when an application has open device instances.


    Note that removing CPU and memory resources from an already busy system (a

    system running short of memory and using excessive amounts of CPU) will

    significantly delay the DR-Detach process because the removed memory will have
    to

    be transferred to the swap disk.'
  merge: -1
