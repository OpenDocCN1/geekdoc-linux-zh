  md: '# Process Monitoring with SyMON Software


    You can use the SyMON software to monitor processes and groups of processes form
    workloads. This is described in detail in Chapter 5.


    # Browsing Configuration Information


    The SyMON software includes detailed knowledge of the configuration of Sun hardware.
    This includes color pictures of components, so you can look inside a large server
    system to see exactly how the system boards are configured. This is a useful availability
    feature because you do not have to turn off a system and take it apart to find
    out what components are present. Any failed components are clearly indicated and
    the errors are logged to assist in problem diagnosis, which saves time and reduces
    the chance of accidentally changing the wrong component.


    From the host details window, select the configuration tab. The initial view,
    FIGURE 12-11, shows a list of the main hardware resources in this Enterprise Server
    system.


    ![](img/52144374747884a32fdddbed4e8cd9d7_323_0.png)


    FIGURE 12-11 Detailed Configuration Window'
  merge: -1
