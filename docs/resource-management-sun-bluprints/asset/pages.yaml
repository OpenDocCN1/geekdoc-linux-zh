  md: '# Device Driver Functions:


    For a driver to be compliant with DR operations, it must support DDI_DETACH, DDI_ATTACH,
    DDI_SUSPEND and DDI_RESUME functions.


    DDI_ATTACH and DDI_DETACH:


    The DDI_ATTACH and DDI_DETACH functions provide the ability to attach or detach
    a partial instance of a driver without impacting other instances that are servicing
    separate devices. For example, if System board 1 in FIGURE 8-10 were to be attached
    or detached, the dr_driver would invoke the DDI_ATTACH or the DDI_DETACH function
    on each device under Driver A''s first instance and Driver B''s first instance
    without affecting other driver instances.


    If there''s a non DR-compliant driver associated with the system board to be attached,
    the DR operation will not fail, but it will not load the appropriate drivers either.
    A workaround for attaching system boards with non DR-compliant drivers is to manually
    load the driver using the modload (1M) command. If there are already driver instances
    of the non DR-compliant driver, the modunload (1M) must be executed previous to
    the modload (1M) command execution.


    If there is a non DR-compliant driver associated with the system board to be detached,
    the DR operation will fail. A workaround for det system boards with non DR-compliant
    drivers is to use the "big hammer approach" by manually unloading the driver using
    the modunload (1M) command. The modunload (1M) command requires that all open
    device instances be closed, and its application will remove all driver instances
    throughout the entire system.


    DDI_SUSPEND and DDI_RESUME:


    The DDI_SUSPEND and DDI_RESUME functions enable the ability to detach a board
    that contains the kernel cage (OBP, kernel and non-pageable memory). The kernel
    cage can only be relocated after all the drivers throughout the entire DSD (not
    just on the board being detached) is quiesced to guarantee the data integrity
    of the kernel cage relocation.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Solaris Bandwidth Manager Software


    The Solaris Bandwidth Manager software allows you to manage your network resources
    to provide quality of service (QoS) to network users. It allows network traffic
    to be allocated to separate classes of service (CoS), so that urgent traffic gets
    higher priority than less important traffic. Different classes of service can
    be guaranteed a portion of the network bandwidth, leading to more predictable
    network loads and overall system behavior. Service level agreements can be defined
    and translated into Solaris Bandwidth Manager controls and policies. Tools and
    APIs provide the interface for monitoring, billing, and accounting options.


    This chapter explains how to use the Solaris Bandwidth Manager software as part
    of a resource control framework.


    # The Need for Bandwidth Management


    Since almost all network links are shared by multiple users and applications,
    the available bandwidth must be shared. Bandwidth management tools enable you
    to manage how the bandwidth is shared.


    If a network link is continuously congested, the link must be upgraded to provide
    greater capacity. In many cases, however, the average load on a link is within
    the link capacity, and the link is only congested temporarily. Temporary congestion
    is sometimes predictable; for example, there are typically peaks in network use
    at particular time of the day or following a particular event. Other causes of
    temporary congestion, such as transferring a large file, are not predictable.


    The Solaris Bandwidth Manager software enables you to manage the bandwidth used
    by IP traffic. It does this by:


    +   - Allocating traffic to a class based on the application type, source and
    destination IP address, URL group, or a combination

    - Assigning individual limits for each class. For example:'
  merge: -1
  pgno: 254
- img_proc: true
  md: '+   - Traffic to engineering must have at least 50 percent of the link.

    - HTTP traffic cannot exceed 10 percent of the link.


    Prioritizing traffic. Some types of traffic, for example interactive traffic generated
    when using telnet or login, need a quick response time. Solaris Bandwidth Manager
    lets you assign a higher priority to traffic. Traffic that does not require a
    quick response time, such as a file transfer using FTP, can be assigned a lower
    priority.


    By balancing the bandwidth allocated to different types of network traffic and
    the relative priorities, you can optimize your network performance. Solaris Bandwidth
    Manager also allows you to monitor the achieved performance of your network, and
    has interfaces for third party billing applications.


    The current version of the product as of this writing is Solaris Bandwidth Manager
    1.5; the previous version of the product was known as Sun Bandwidth Allocator
    1.0.


    # Examples of When to Use Bandwidth Management


    You are the owner of a LAN, leasing a network connection from a service provider.
    You can use the Solaris Bandwidth Manager software to make sure you make the most
    efficient use of the capacity you lease. Bandwidth allocation ensures that your
    higher-priority traffic is sent first and that you always get the maximum use
    of the capacity you are paying for. It will no longer be necessary to over-specify
    your requirements to guarantee that priority traffic can be sent. You might even
    be able to reduce the capacity you use.


    You are the owner of a WAN, providing network services to many clients. The Solaris
    Bandwidth Manager software enables you to regulate the traffic in your network.
    You can provide a guaranteed minimum bandwidth to a client, and as a bonus, provide
    additional bandwidth from time to time when it is not required by other clients.
    Since you know the level of guaranteed bandwidth, capacity planning will be both
    easier and more accurate.


    You are a service provider, hosting several web sites on behalf of commercial
    companies. The Solaris Bandwidth Manager software enables you to guarantee your
    client companies that a given bandwidth is available to the customers visiting
    their sites. Today, many web providers charge base on either disk space used or
    on the number of times a site is visited. Disk space used is not a good indication
    of the cost to a provider, since a small site that is visited frequently can be
    as expensive as a large site that is visited less frequently. Using the number
    of visits to a site is a better indicator of the cost to a provider, but is potentially
    an unbounded cost for the client. With Solaris Bandwidth Manager you can charge
    clients for bandwidth for their web site. Additionally, you can provide extra'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'functionality such as providing a higher priority to network traffic originating
    from web site visitors who are paying for online shopping goods as opposed to
    visitors who are just looking around.


    You are an ISP providing services to many customers. The Solaris Bandwidth Manager
    software enables you to provide different classes of service to different customers.
    For example, you could offer Premium and Standard services, with guaranteed minimum
    access levels, to suit the needs and budgets of your customers. This will also
    allow you to start consolidating services from many small machines onto fewer
    larger servers. Optional Resource Management products such as Solaris Resource
    Manager (covered in Chapter 7) can be used on these services to guarantee processing
    power as well as networking bandwidth to your customers, while at the same time
    reducing the total cost of administration and cost of ownership.


    # End-to-End Quality of Service


    To manage network resources, it is not sufficient to manage and control only the
    network segment close to the computer systems that supply the services in question.
    Clients can be anywhere on the network, and the whole network path from client
    to server needs to be considered. This is what is meant by end-to-end QoS, and
    in general, it can be very difficult to achieve. If congestion takes place anywhere
    on the network, it will affect the overall QoS. Therefore, routers need to help
    supply QoS. In the Internet Engineering Task Force (IETF), several groups have
    been working on this problem, notably the Integrated Services working group (Int-Serv)
    and the Differentiated Services working group (Diff-Serv).


    # Integrated Services


    In recent years, several developments in the IETF have attempted to make end-to-end
    QoS to the Enterprise and the Internet a reality. To guarantee a certain bandwidth
    to an application, each hop in the network from client to server must guarantee
    the resources that are required.


    The Internet Integrated Services framework (Int-Serv) was developed by the IETF
    to provide applications the ability to have multiple levels of QoS to deliver
    data across the network. It consists of two components:


    +   - Network components along the path must support multiple levels of service.


    +   - Applications must have a way to communicate their desired level of service
    to the network components.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'The RSVP protocol was developed for the latter. It requires each hop from end
    to end RSVP-enabled, including the application itself (through an API). Bandwidth
    will be reserved at each hop along the way before transmitting, guaranteeing that
    resources will be available for the duration of this connection.


    For the internet backbone, RSVP never received widespread acceptance. One reason
    is that routers handle the forwarding and routing of very large amounts of concurrent
    flows (connections). Deploying RSVP means that routers need to keep state on each
    connection. This puts a high load on these routers, which leads inevitably to
    performance, scalability, and management problems.


    Still, RSVP could be the right solution for certain applications, especially on
    better contained networks (such as corporate). The Solaris Bandwidth Manager software
    does not use RSVP to manage bandwidth. However, Sun offers a separate product
    called Solstice Bandwidth Reservation Protocol 1.0 do exactly that. It can be
    downloaded from http://www.sun.com/solstice/telecom/bandwidth.


    # Differentiated Services


    More recent developments in the IETF''s Diff-Serv working group are attempting
    to resolve the concern of overloaded backbone routers. Instead of requiring per-flow
    resource reservation at each hop, it moves the complexity to the network edge,
    to keep the packet-forwarding mechanisms in the network core relatively simple.


    The IPv4 packet header includes a field called ToS (Type of Service) which can
    be used to mark a packet for different levels of quality. In the Diff-Serv context,
    this IP header is renamed the DS header byte. The IPv6 header has a similar field.
    At the edge of the network, packets and flows are classified and shaped (scheduled).
    The DS field in the IP header is marked for a corresponding level of service,
    and the network core routers give the type of service that was requested. In the
    Diff-Serv specification, care was taken to supply as much backwards compatibility
    with the original meaning of the Type of Service header, as defined in RFC 791
    (the original IP specification) and RFC 1349 which refines these definitions.


    For more information regarding Diff-Serv, see RFC 2474 and RFC 2475.


    The Solaris Bandwidth Manager software is Diff-Serv compliant. The software can
    classify, filter and mark network packets based on the DS field contents. This
    allows the software to be deployed in a Diff-Serv environment together with networking
    equipment (such as routers and switches) from other vendors that are Diff-Serv
    compliant.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# How Bandwidth Allocation Works


    Bandwidth is allocated to a class of network traffic. The class of a packet is
    defined by some or all of the following factors:


    +   - IP source address

    - IP destination address

    - IP protocol (TCP, UDP, or other)

    - Source ports for TCP and UDP

    - Destination ports for TCP and UDP

    - Type of Service (ToS) value in the IP header

    - URL or URL group


    Class definitions are hierarchical and every class has a parent. For example,
    if you define a class for FTP traffic and a class for FTP to a host called peer,
    the classes are connected in a hierarchy as shown in FIGURE 9-1.


    ![](img/52144374747884a32fdddbed4e8cd9d7_258_0.png)


    **FIGURE 9-1** Hierarchical Class Definitions


    In this example, the ftp class is a child of the root class and is the parent
    of the ftp-to-peer class.


    The configuration of Bandwidth Manager specifies the set of known classes for
    a node, defined in terms of the values of some or all of these factors. It also
    allocates a percentage of bandwidth and a priority to each class. The priority
    of a class is an integer from 1 (highest priority) to 7 (lowest priority).


    When a packet arrives, the classifier analyzes the packet protocol, ToS value,
    URL information, source information, destination information and allocates the
    packet to a class queue where it waits to be processed. If the queue to which
    a packet is allocated is full, the packet is dropped. Normal retransmission ensures
    that the packet is resent. Normal TCP/IP behavior such as slow start and congestion
    avoidance assures that traffic flows adapt adapt to the bandwidth that is made
    available to each flow.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'The scheduler uses the percentage of bandwidth that is configured and the priority
    for each class to decide the order in which class queues are processed. Within
    a class queue, the packets are processed on a first-in, first-out basis. When
    the network traffic reaches the maximum allocated for a class, packets from the
    next class in priority order are processed, as illustrated in FIGURE 9-2.


    # Character


    ![](img/52144374747884a32fdddbed4e8cd9d7_259_0.png)


    FIGURE 9-2 Bandwidth Allocation


    # Borrowing Bandwidth


    Each class is guaranteed a percentage of the available bandwidth, and when that
    limit is reached, normally no more traffic from that class can be forwarded. However,
    if the network link is not fully used, a class can borrow bandwidth from its parent
    class, and send traffic at a percentage that exceeds its allocation.


    Similarly, if not all the bandwidth allocated to a child’s class is being used,
    the parent of that class can use it. The amount of spare bandwidth allocated to
    a class depends on the percentage of bandwidth that the class can borrow. maximum
    bandwidth.


    When there is spare bandwidth, it will be allocated among the highest priority
    classes first, until there is no more spare bandwidth, or until all those classes
    reach their maximum bandwidth. If the latter happens, the remainder of the spare
    bandwidth will be divided among the next highest priority, and so on.'
  merge: -1
  pgno: 259
- img_proc: true
  md: "# Example of Borrowing Bandwidth\n\nIn this example, 15 percent of the bandwidth\
    \ is spare, and there are three classes with packets queued (http, ftp and smtp).\
    \ See table 9-1. The spare bandwidth will be divided between http and ftp traffic,\
    \ since they have the highest priority. The http class will get 15 percent * 50\
    \ / (50 + 20) = 11 percent and the ftp class will get 15 percent * 20 / (50 +\
    \ 20) = 4 percent. The smtp class will get nothing extra.\n\nTABLE 9-1 Example\
    \ of Borrowing Bandwidth\n\n| Class Name | Priority | Guaranteed Bandwidth (percentage)\
    \ |\n| --- | --- | --- |\n| http | 1 | 50 |\n| ftp | 1 | 20 |\n| smtp | 3 | 10\
    \ |\n\nIf http has been allocated a maximum bandwidth of 55 percent, and ftp has\
    \ a maximum of 22 percent, then smtp can borrow 8 percent. Of course, if no http\
    \ traffic or ftp traffic is scheduled at all, smtp can borrow the full 15 percent\
    \ of the spare bandwidth.\n\nIt is possible to define a class that has 0 percent\
    \ bandwidth guaranteed but may borrow bandwidth from its parent class. A packet\
    \ allocated to such a class is only forwarded if there is no other traffic of\
    \ higher priority waiting. Allocating 0 percent and no borrowing to a class means\
    \ that the class is blocked. \n\n# Flows\n\nA flow is a complete exchange of information\
    \ between a sender and a recipient, as seen from the user's point of view. Examples\
    \ of flows include sending a mail message or downloading a web page.\n\nA flow\
    \ is defined by:\n\n+   * The interface used\n* The source and destination IP\
    \ address\n* The IP protocol (TCP, UDP or other)\n* The source and destination\
    \ ports (TCP and UDP)\n* The IP ToS value\n* The URL\n\nSince the ToS value can\
    \ change during the lifetime of a flow, a flow can move from one class to another."
  merge: -1
  pgno: 260
- img_proc: true
  md: 'Information about all current flows is stored in cache. When a packet arrives,
    its flow characteristics are compared with the cache information to see whether
    it is part of an existing flow or whether a new flow has started. The cache record
    includes the flow identification information and the following statistics:


    +   - The number of packets sent


    +   - The number of octets sent


    +   - The system uptime when the first packet arrived


    +   - The system uptime when the last packet arrived


    A flow is terminated 60 seconds after the last packet in the flow was detected.
    Monitoring flows rather than classes gives a more accurate picture of network
    usage, at finer granularity. This enables you to predict future network needs
    more accurately, and gives you information that can be used in accounting. See
    “Monitoring, Accounting, and Billing” on page 243 for more details.


    # Type of Service Packet Marking


    An IP packet contains TOS header field. Its purpose is to convey information about
    how the packet should be routed. The Solaris Bandwidth Manager software can use
    this information when classifying a packet. It can also change the information,
    to influence how the packet is routed.


    # IP Specification of ToS


    The IP specification includes a definition of a ToS field in the IP packet header.
    This is used by upper-layer protocols to pass information to the Internet about
    how to optimize routing for the packet. The topology of the Internet is such that
    there are often a number of available routes between the source and destination
    of a packet. Some routes are more reliable than others. Some are expensive, with
    high setup or usage charges, while low-cost but slow. The most suitable for a
    packet depends on the application and user, and might even vary with other factors
    such as the time of day. For example, if you are a system administrator monitoring
    a remote system, you need to receive alarm traffic as rapidly as possible regardless
    of cost, because the cost of routing the alarm is significantly lower than the
    incurred by a system problem. However, if you start to get by the same system
    at the end of your working day, intending to use it the following day, a low-cost
    slow route is sufficient.


    The Internet has no direct knowledge of how to optimize a route for a given application
    or user. The ToS facility was intended to provide hints about how best to route
    a packet, influencing both queuing algorithms and routing.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '| 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---||

    | | Precedence | | | | TOS | | MBZ |


    FIGURE 9-3 IP Type of Service Byte


    The Precedence bits are used to denote the importance or priority of the packet.
    The ToS field denotes how the network should make trade-offs between throughput,
    delay, cost, and reliability when routing this packet. The last bit, MBZ (which
    stands for “Must Be Zero”), is as the name implies currently unused.


    # Differentiated Services


    The ToS facility has not been extensively used in the past, and the Differentiated
    Services working group within the IETF has been working to extend the use of ToS
    to encourage its to achieve end-to-end QoS. In this context, the ToS header field
    has been renamed the DS header field. Currently, only the first six bits of the
    DS field are being used, as shown in FIGURE 9-4.


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---||

    | | | | DSCP | | | | CU |


    DSCP: differentiated services codepoint

    CU: currently unused


    FIGURE 9-4 DS Header Field


    The way that DSCP bits are set in a packet is called its codepoint, and network
    devices translate DSCP codepoints to device configurations. For example, a DSCP
    compliant router that has two priority queues (one for regular priority traffic
    and one for high priority traffic) could be configured to have several codepoints
    map to the high priority queue. An attempt was made to provide some sort of backwards
    compatibility, by having the first three bits of the DSCP field map to behaviors
    similar to the definitions of the three precedence bits of the ToS byte that existed
    before Diff-Serv came along.'
  merge: -1
