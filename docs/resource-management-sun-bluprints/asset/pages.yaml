- img_proc: true
  md: '# Solaris Resource Manager Software


    This chapter discusses the Solaris Resource Manager (SRM) software, which controls
    major system resources. SRM software also implements administrative policies that
    govern which resources users can access, and more specifically, what level of
    those resources each user is permitted to consume.


    The SRM product is based on ShareII technology from Softway Pty. Limited, Australia.


    # When to Use SRM Software


    The SRM software is the Sun resource management extension for the Solaris operating
    environment and should be used when more advanced resource management and control,is
    required.


    For example, two workloads can be consolidated onto a single system using processor
    sets to manage the CPU resource by allocating 10 processors to workload A and
    8 processors to workload B. Although this would provide processor limits for each
    workload, resources could be potentially wasted if one of the workloads is not
    using all of its share of the processors because the spare CPU cannot be used
    by any other workload.


    The SRM software provides the following advantages over base Solaris resource
    control:


    +   * Better utilization of system resources

    * Dynamic control of system resources

    * More flexible resource allocation policies

    * Fine-grained control over resources

    * Decayed usage of resources

    * Accounting data for resource usage'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Relationship to Other Solaris Resource Control

    Features


    # Base Solaris Operating Environment


    The Solaris operating environment includes several features that provide control
    over certain types of resources. Some features, as as nice(1) and processor sets,
    are part of the basic Solaris software and allow a limited form of resource management.


    The nice(1) command permits users to manipulate program execution priority. Unless
    superuser privilege is invoked, this command only permits the user to lower the
    priority. This can be a useful feature (for example, when a user starts a low-priority
    batch job from an interactive login session), but it relies on the cooperation
    of the user. The SRM software enforces administrative policies, even without the
    cooperation of the user.


    Processor sets were introduced in the Solaris 2.6 release. This feature allows
    you to divide multiprocessor systems into logical groups and permits users to
    launch processes into those groups. The advantage is that workloads running in
    one processor set are protected from CPU activity taking place in any other processor
    set. In some ways, this is similar to what the SRM software does, but the two
    features operate on a completely different basis. Processor sets control only
    CPU activity. The control is at a relatively coarse-grained hardware level, because
    processors can belong to exactly one processor set at a time. Especially in the
    case of relatively small systems, the granularity may be quite: on a 4-processor
    system, the minimum resource that can be assigned is 25 percent of the system.


    The SRM software has much finer-grained control. Each user is allocated a share
    of the system. The shares can be distributed arbitrarily on any granularity, and
    the scheduler will allocate resources accordingly. For example, if 50 shares are
    granted, and one user has 40 of them, that user will get 40 / 50 = 80 percent
    of the resource. Similarly, if 67 total shares are granted, a user with 57 shares
    will get 85 percent of the resource. In addition, the SRM software can control
    resources other than CPU.


    # Dynamic System Domains


    The Enterprise 10000 server has a feature called dynamic system domains, which
    allows you to logically divide a single system rack into one or more independent
    systems, each running its own copy of the Solaris environment. For example, a
    system with 32 CPUs on 8 system boards might be operated as 1 system with 16 CPUs,
    and 2 other systems with 8 CPUs each. In this configuration, three copies of the
    Solaris system would be running. The dynamic system domains feature also permits
    controlled movement of resources into and out'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'of each of the Solaris images, thus creating a relatively coarse-grained facility
    for managing physical resources. (The minimum unit of inter-domain allocation
    is an entire system.) The SRM software is similar to dynamic system domains in
    that it provides the mechanisms to allocate resources, but it does so in very
    different ways. The SRM software runs within a single instance of the Solaris
    operating environment, and provides fine-grained administrative control to the
    resources in the system. Dynamic domains divide a single piece of hardware into
    multiple instances of the Solaris operating environment. Dynamic system domains
    provide tools to manage the transfer of resources between instances of the Solaris
    operating environment running on the same Sun Enterprise 10000 frame. The SRM
    software can be run in each instance of the Solaris operating environment within
    a Sun Enterprise 10000 system and used in conjunction with dynamic system domains.


    # Dynamic Reconfiguration


    The dynamic reconfiguration feature of Sun Enterprise servers enables users to
    dynamically add and delete system boards, which contain hardware resources as
    processors, memory, and I/O devices. The effect of a dynamic reconfiguration operation
    on memory has no impact on SRM memory-limit checking.


    # Solaris Bandwidth Manager Software


    The Solaris Bandwidth Manager software is a product that works with the Solaris
    kernel to enforce limits on the consumption of network bandwidth. The Solaris
    Bandwidth Manager software is a form of resource management software that applies
    to a different class of resources. The SRM software and the Solaris Bandwidth
    Manager software have different and separate management domains: the SRM software
    operates on a per-user or per-application basis, while the Solaris Bandwidth Manager
    software manages on network identities, including combinations of per-port, per-service,
    and per-protocol bases.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Solaris Resource Manager Functions


    This section describes the SRM software capabilities as outlined in TABLE 7-1.


    TABLE 7-1 Solaris Resource Manager Functions

    | | Policy | Control | Measurement | Accounting |

    |---|---|---|---||

    | CPU Usage | Per userid | X | Per userid | X |

    | Virtual Memory | per-user per-process | per-user per-process | per-user per-process
    | X |

    | Number of processes | X | X | X | X |

    | Maximum Logins | X | X | X | X |

    | Connect Time | X | X | X | X |


    # Solaris Resource Manager Policies


    The SRM software is built around a fundamental addition to the Solaris kernel
    called an Inode (limit node). Inodes correspond to UNIX userids, and may represent
    individual users, groups of users, applications, and special requirements. Inodes
    are indexed by userid and are used to record resource allocations policies and
    accrued resource usage data by processes at the user, group of users, and/or application
    level.


    # Hierarchical Structure


    The SRM management model organizes Inodes into a hierarchical structure called
    the scheduling tree. The scheduling tree is organized by userid: each Inode references
    the userid of the Inode''s parent in the tree. Each sub-tree of the scheduling
    tree is called a scheduling group, and the user at the root of a scheduling group
    is the group''s header. The root user is the group header of the entire scheduling
    tree.


    A group header can be delegated to manage resource policies within the group.
    The Inodes are initially created by parsing the /etc/passwd file. An Inode administration
    command (limadm(1MSRM)) will create additional Inodes after the SRM software is
    installed and assign Inodes to parents.


    The scheduling tree data is stored in a flat file database that can be modified
    as required.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Though users used by Inodes do not correspond to a system account, with an
    entry in the system password map, it is strongly recommended that a system account
    is created for the userid of every Node. A non-leaf Node (those with subordinate
    Inodes) can be purely administrative because no one ever logs in it. However,
    it is equally possible that it can be the Node of a real user who logs in and
    runs processes attached to this non-leaf inode.


    Note that SRM scheduling groups and group headers have nothing to do with the
    system groups defined in the /etc/group database. Each node of the scheduling
    tree, including group headers, corresponds to a real system user with a unique
    userid.


    # Hierarchical Limits


    If a hierarchical limit is assigned to a group header in an In tree (scheduling
    group), then it applies to the usage of that user plus the total usage of all
    members of the scheduling group. This allows limits to be placed on entire groups,
    as well as on individual members. Resources are allocated to the group header,
    who may allocate them to users or groups of users that belong to the same group.


    # Delegated Administration of Policies


    The system administrator can set administrative privileges for any Node, including
    assigning administrative privileges selectively to users. A user with hierarchical
    administrative privilege is called a sub-administrator. A sub-administrator may
    create, remove, and modify the Inodes of users within the sub-tree of which they
    are group header.


    Sub-administrators cannot normally alter their own limits or flags, and cannot
    circumvent their own flags or limits by altering flags or usages within their
    group.


    The central administrator (or super-user) can alter the limits, usages, and flags
    of any user, including itself. Ordinary users can be granted this privilege by
    setting a flag.


    # Policies by Executable Name


    Resource policies that are not restricted to userids can be created by attaching
    workloads to Inodes. For example, a policy based on application executable name
    can be created by creating Inodes for each application executable and then attaching
    the executable to the correct Inode.


    A wrapper script can be required to implement this policy using the srmuser command.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Controls Available with SRM Software


    The SRM software provides control of the following system resources: CPU (rate
    of processor) usage, virtual memory, number of processes, number of logins, and
    terminal connect-time.


    The SRM software keeps track of each user''s usage of each resource. For all resources
    except CPU usage, users may be assigned hard limits on their resource usages.
    A hard limit causes resource consumption attempts to fail if the user allows the
    usage to reach the limit. Hard limits are directly enforced by the kernel or whatever
    software is responsible for managing the respective resource. A limit value of
    zero indicates no. All limit attributes of the root Inode should be set to zero.


    The SRM software progressively decays past usage so that only the most recent
    usage is significant. The system administrator sets a half-life parameter that
    controls the rate of decay. A long half-life favors users, typical of long batch
    jobs, while a short half-life favors interactive users.


    The CPU resource is controlled using the SHR scheduler. Users are allocated CPU
    time dynamically in proportion to the number of shares they possess (analogous
    to shares in a company), and in inverse proportion to their recent usage. The
    important feature of the SHR scheduler is that while it manages the scheduling
    of individual threads (technically, in the Solaris software, the scheduled entity
    is a lightweight process (LWP)), it also portions CPU resources between users.


    Each user also has a set of flags that are boolean-like variables used to enable
    or disable selective system privileges, for example, login. Flags can be set individually
    per user or inherited from a parent Inode.


    The usages, limits, and flags of a user can be read by any user, but can be altered
    only by users who have administrative powers.


    # Decay of Renewable Resources


    The SRM software employs a usage, limit, and decay model to control a user''s
    rate of consumption of a renewable resource. Usage is defined as the total resource
    used, with a limit set on the ratio of usages in comparison to other users. Decay
    refers to the period by which historical usage is discounted. The next resource
    quantum, for example, clock tick, will be allocated to the active Inode with the
    least decayed total usage value in relation to its allocated share. The decayed
    usage value is a measure of the total usage over time less portion of historical
    usage determined by a half-life decay model.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# CPU Resource Management


    The primary advantage of the SRM scheduler over the standard Solaris scheduler
    is that it schedules users or applications rather than individual processes. Every
    process associated with an inode is subject to a set of limits. For the simple
    case of one user running a single active process, this is the same as subjecting
    each process to the limits listed in the corresponding inode. When more than one
    process is attached to an inode, as members of a group run multiple processes,
    all of the processes are collectively subject to the listed limits. This means
    that users or applications cannot consume CPU at a greater rate than their entitlements
    allow, regardless of how many concurrent processes they run. The method for assigning
    entitlements as a number of shares is simple and understandable, and the effect
    of changing a user''s shares is predictable.


    The allocation of the renewable CPU service is controlled using a fair share scheduler.
    Each inode is assigned a number of CPU shares, analogous to shares in a company.
    The processes associated with each inode are allocated CPU resources in proportion
    to the total number of outstanding shares, where active mean that the inode has
    running processes attached. Only active inodes are considered for an allocation
    of the resource, as they only have processes running and need CPU time. As a process
    consumes ticks, the CPU usage attribute of its inode increases.


    The scheduler regularly adjusts the priorities of all processes to force the ratios
    of CPU usages to converge on the relative ratios of CPU shares for all active
    inodes at their respective levels. In this way, users can expect to receive at
    least their entitlements of CPU service in the long run, regardless of the behavior
    of other users. The scheduler is hierarchical, because it also ensures that groups
    receive their group entitlement independently of the behavior of the members.


    The SRM software has a long-term scheduler; it ensures that all users and applications
    receive a fair share over the course of the scheduler. This means that when a
    light user starts to request the CPU, that user will receive commensurably more
    resource than heavy users until their comparative usages are in line with their
    relative fair share allocation. The more you use over now, the less you will receive
    in the future. Additionally, you can set the decay period so that the scheduler
    forgets about past usage.


    The decay model is one of half-life decay, where 50 percent of the resource has
    decayed away within one half-life. This ensures that steady, even users are not
    penalized by short-term, process-intensive users. The half-life decay period sets
    the responsiveness or term of the scheduler; the default value is 120 seconds.
    Shorter values tend to provide more even response across the system, at the expense
    of slightly less accuracy in computing and maintaining system-wide resource allocation.
    Regardless of administrative settings, the scheduler tries to prevent marooning
    (resource starvation) and ensure reasonable behavior, even in extreme situations.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'The SRM scheduler will never waste CPU availability. No matter how low a user''s
    allocation, that will always be given the available CPU if there are no competing
    users. One of the consequences of this is that users may notice performance is
    less smooth than they used to. If a user with a very effective share is running
    an interactive process without any competition, it will appear to run quickly.
    However, as soon as another user with a greater effective share demands some CPU
    time, it will be given to that user in preference to the first user, so the first
    user will notice a marked job slow-down. Nevertheless, SRM scheduler goes to some
    lengths to ensure that legitimate users are not marooned and unable to do any
    work. All processes being scheduled by the SRM software are allocated regularly
    by the scheduler. There is also logic to prevent a new user who has just logged
    on from being given an arithmetically fair, but excessively large, proportion
    of the CPU to the detriment of existing users.


    # Virtual Memory (Per-User and Per-Process Limits)


    Virtual memory is managed using a fixed resource model. The virtual memory limit
    applies to the sum of the memory sizes of all processes attached to the node.
    In addition, there is a per-process virtual memory limit that restricts the total
    size of the process''s virtual address space, including all code, data, file mappings,
    and shared libraries. Both limits are hierarchical. Limiting virtual memory is
    useful for avoiding virtual memory starvation. For example, the SRM software will
    stop an application that is leaking memory from consuming unwarranted amounts
    of virtual memory to the detriment of all users. Instead, such a process only
    starves itself or, at worse, others in its resource group.


    # Number of Processes


    The number of processes that users may run simultaneously is controlled using
    a fixed resource model with hierarchical limits.


    # Terminals and Login Connect-Time


    The system administrator and group header can set terminal login privileges, number
    of logins, and connect-time limits, which are enforced hierarchically by the SRM
    software. As a user approaches a connect-time limit, warning messages are sent
    to the user''s terminal. When the limit is reached, the user is notified, then
    forcibly logged out after a short grace period.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Processes


    Every process is attached to an Inode. The init process is always attached to
    the root Inode. When processes are created by the fork(2) system call, they are
    attached to the same Inode as their parent. Processes can be re-attached to any
    Inode using a SRM system call, given sufficient privilege. Privileges are set
    by root or by users with the correct administrative permissions enabled.


    # Measurement


    Resource usage information is exposed to the administrators of the system, and
    provides two views of resource usage information: a per-user view and a workload
    view of resource usage.


    # Per-User Resource Usage


    Use the liminfo command to obtain a report of an individual user''s current usages,
    limits, privileges, and so on. You can also use the liminfo command to inquire
    about the attributes of other users.


    You can request a number of different report formats, including options that make
    the output of liminfo suitable for processing by a pipeline of filters. Refer
    to the manual page for liminfo(SRM) for details of the options and their meanings,
    and for a description of the fields that can be displayed.


    # Workload View of Resource Usage


    The workload view of resource usage is based on the Inode resource hierarchy tree.
    The SRM software does this by recording accrual of resource usage in the Inode
    tree.


    The Inode''s cpu.accrue attribute contains the accrued CPU usage for all Inodes
    within the group as well as that of the current Inode. When any of an Inode''s
    accrual attributes are updated, the change is also applied to the Inode''s parent
    (with changes to the usage attribute) and so on up to the root Inode so that the
    accrued usage at each level in the scheduling tree is the sum of the accrued usage
    for the Inode and its children, if any.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '![](img/52144374747884a32fdddbed4e8cd9d7_175_0.png)


    FIGURE 7-1 Accounting Based on the Workload Hierarchy


    For example, a system with two workloads A and B can have an inode hierarchy with
    Inodes A and B reporting to the root node, and then individual users reporting
    into node A and B. The CPU usage of each user can be observed via the usage fields
    in the Inode of each user, but the sum total of CPU used for workload A is available
    by looking at the accrued CPU usage in the Inode for workload A.


    # System Resource Accounting Information


    The SRM system maintains information (primarily current and accrued resource usage)
    that you can use to conduct comprehensive system resource accounting. No accounting
    programs are supplied as part of the SRM software, but its utility programs provide
    a base for the development of a customized resource accounting system.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Workload Configuration


    The key to effective resource management using the SRM software is a well designed
    resource hierarchy.


    # Mapping the Workload to the Inode Hierarchy


    The SRM software uses the Inode tree to userid to implement the resource hierarchy.
    Each node in the Inode tree maps to userid in the password database. This means
    workloads must be mapped to align with entries in the password database. In some
    cases, you might have to create additional users to cater to the leaf nodes in
    the hierarchy. These special users will not actually run processes or jobs, but
    will act as an administration point for the leaf node.


    # A Simple Flat Hierarchy


    A simple hierarchy would, for example, control the processing resources of two
    users, Chuck and Mark. Both of these users are notorious for using large amounts
    of CPU at different times, and hence have an impact on each other at different
    times of the day. To resolve this, construct a single level hierarchy and allocate
    equal shares of CPU to each user.


    ![](img/52144374747884a32fdddbed4e8cd9d7_176_0.png)'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'This simple hierarchy is established using the limadm command to make Chuck
    and Mark children of root:


    ```

    # limadm set group=root chuck

    # limadm set group=root mark

    ```


    Now that both Chuck and Mark are children of the root share group, you can allocate
    resource shares against them. For example, to allocate 50 percent of the resources
    to each, give the same number of CPU shares to each. (There is no reason you could
    not allocate one share to each to achieve the same). Use the limadm command to
    allocate the shares:


    ```

    # limadm set cpu.shares=50 chuck

    # limadm set cpu.shares=50 mark

    ```


    You can observe the changes to the Inode associated with Chuck with the liminfo
    command:


    # liminfo -c chuck

    Login name: chuck Uid (Real,Eff): 2001 (-,-)

    Sgroup (uid): root (0) Gid (Real,Eff): 200 (-,-)


    Shares: 50 Myshares: 1

    Share: 41 % E-share: 0%

    Usage: 0 Accrued usage: 0


    Mem usage: 0B Term usage: 0s

    Mem limit: 0B Term accrue: 0s

    Proc mem limit: 0B Term limit: 0s

    Mem accrue: 0B B.S


    Processes: 0 Current logins:

    Process limit: 0


    Last used: Tue Oct 4 15:04:20 1998

    Directory: /users/chuck

    Name: Hungry user

    Shell: /bin/csh


    Flags:'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'The fields from the liminfo command are explained below. Refer to manual page
    on liminfo for more information. The first two lines of output from the liminfo
    command relate to aspects of the inode userid and its position in the inode tree.


    # Login name


    The login name and initial GID for password map that corresponds to the userid
    of the attached Inode. Every Inode is associated with a system userid. Create
    a system account for the userid of every Inode. In this instance a placeholder
    userid is used for the Database of db1.


    Note that the default PAM configuration under the SRM software creates an Inode
    for any user who logs in without one. By default, Inodes created by root or by
    a user with the limadmin flag set are created with the Inode for the user other
    as their parent, or if that does not exist, with the root Inode as their parent.
    Inodes created by a user with the administration flag set are created with that
    user as their parent. The parent of an Inode can be changed with the general command
    for changing inode attributes limadm.


    # Uid


    The userid of the Inode attached to the current process. Normally, this will be
    the same as that the real userid of the process (logged in), but in some circumstances
    (described later) it may differ.


    # R,Euid and R,Egid


    The real and effective userid and GID of the current process. This is the same
    information that is provided by the standard system id (1M) command. It is not
    strictly related to the SRM software, but it is displayed for convenience. These
    fields are not displayed if liminfo (SRM) is displaying information on a user
    other than the default (that is, it was provided with a login name or userid as
    an argument).


    # Sgroup (uid) [sgroup]


    The name and userid of the parent Inode in the inode tree hierarchy. Many SRM
    features depend on the position of an Inode within the tree hierarchy, so it is
    useful for a user to trace successive parent Inodes back to the root of the tree.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'After the blank line, the next two lines of the liminfo (SRM) display show
    fields relating to CPU scheduling.


    # Shares [cpu.shares]


    The number of shares of CPU entitlement allocated to this user It is only directly
    comparable to other users with the same parent Node, and to the Myshares value
    of the parent Node itself. You might normally set the shares of all users within
    a particular scheduling group to the same value (giving those users equal entitlements).
    This value will normally be something greater than 1, so that you have some leeway
    to decrease the shares of specific users when appropriate.


    # Myshares [cpu.myshares]


    This value is used only if this user has child Inodes (that is, if there are other
    Inodes that have a group value of this user) that are active (that is, have processes
    attached). Where this is the case this value gives the relative share of CPU for
    processes attached to this Inode, with those attached to its child Inodes.


    # Share


    The calculated percentage of the system CPU resources to which the current user
    is entitled. As other users log on and log off (or Inodes become active or inactive),
    this value will change, because only active users are included in the calculation.
    Recent usage by the current user is not included in this calculation.


    # E-Share


    This is the effective share of this user (that is, the actual percentage of the
    system CPU resources which this user would be given in the short term if the user
    required and all other active users were also demanding their share). It can be
    thought of as the current willingness of the SRM software to allocate CPU resources
    to that Node. This value will change over time as the user uses (or refrains from
    using) CPU resources. Nodes Inodes that are active but idle (that is, with processes
    sleeping), and so have a low usage, and have a high effective share value. Correspondingly,
    the effective share can be very small for users with attached processes that are
    actively using the CPU.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Usage [cpu.usage]


    The accumulated usage of system resources are used to determine scheduling priority.
    Typically, this indicates recent CPU usage, though other parameters may also be
    taken into account. The parameter mix can be viewed with the srmadm (1SRM) command.
    Each increment to this value decays exponentially over time so that eventually
    the SRM software will forget about the resource usage. The rate of this decay
    is most easily represented by its half-life, which you can see with the srmadm
    command.


    # Accrued usage [cpu.accrue]


    This is the same resource accumulation measurement as Usage, but it is not decayed.
    It is not used directly by the SRM software but may be used by administration
    for accounting purposes. Unlike usage, this value represents the sum of the accrued
    usages for all inodes within the group, as well as that of the current node.


    After the second blank line, the next four lines of the liminfo display show four
    fields relating to virtual memory:


    # Mem usage [memory.usage][memory.usage]


    The combined memory usage of all processes attached to this node.


    If two values are displayed, separated by a frontslash (/) character, then this
    Node is a group header and the first value is the usage for the whole scheduling
    group, while the second value is that of just of the current user.


    # Mem limit [memory.limit]


    The maximum memory usage allowed for all processes attached to this Node and its
    members (if any). That is, the sum of the memory usage for all processes within
    the group plus those attached to the group header will not be allowed to exceed
    this value. Note that in this instance, a 0 value indicates that there is no limit.


    # Proc mem limit [memory.plimit]


    The per-process memory limit is the maximum memory usage allowed for any single
    process attached to this Node and its members.


    # Mem accrue [memory.accrue]


    The memory accrue value is measured in seconds and is an indication of overall
    memory resources used over a period of time.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'After the third blank line, the next four lines of the liminfo display show
    fields relating to the user and processes.


