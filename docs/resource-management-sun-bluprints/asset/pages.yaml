  md: '+   - A well-defined set of kernel probe points covering most important events
    was implemented.

    - A program prex(1) controls probe execution for both user and kernel traces.

    - A program tnfract(1) reads the kernel trace buffer, and tnfdump(1) displays
    data in human-readable ASCII.

    - Manual pages exist for all the commands and library calls. The set of implemented
    kernel probes is documented in tnf_probes(4).


    A few things about kernel probes are inconvenient. While user-level probes write
    to trace files, the kernel probes write to a ring buffer. This buffer is not a
    single global ring; it is a buffer per kernel thread. This buffer scheme avoids
    any need to load the data structures, so there is no performance loss or contention
    on multiprocessor systems. You cannot easily tell how big the buffer needs to
    be while others have hardly started. If you are trying to capture every single
    probe, make the buffer as big as you can. Rely on sampling and put up with missing
    probes. The tnfract routine just takes a snapshot of the buffer, so a second snapshot
    will include anything left over from the first one. The tnfdump program does a
    lot of work to sort the probe events into time order.


    # I/O Trace: Commands and Features


    The command sequence to initiate an I/O trace is quite simple. You run the commands
    as root, and you need two windows open: one to run prex, and the other to go through
    a cycle of extracting, dumping, and viewing the data as required. The command
    sequence for prex is to first allocate a buffer (the default is 4 Kbytes; you
    can make it bigger), enable the io group of probes, make them trace accesses,
    then turn on the global flag that enables all kernel tracing.


    Now, wait a while or run the program you want to trace. In this case, we ran iostat
    -x 10 in another window, didn''t try to cause any activity, and waited for some
    low service time to appear. After approximately one minute, we stopped collecting.


    ```

    prex> ktrace off

    ```'
