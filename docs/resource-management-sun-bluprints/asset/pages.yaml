    The point is that you have a limited amount of expensive wide-area network capacity.
    There is a strong tendency for end users to consume all the capacity that you
    provide. Using gentle peer pressure to keep the usage productive reasonable and
    can radically improve the performance of your network for real use.


    Solaris Bandwidth Manager software can be used effectively in this environment
    to implement policies based on the URL, domain or protocol mix that is desired.
    For example, if traffic to an Internet stock quote server is crowding out more
    important traffic in the wide area of a company intranet, Solaris Bandwidth Manager
    software can throttle access to that site to a specified percentage of the total.
    The combination of proxy cache controls and bandwidth management is a powerful
    and flexible way to optimize of wide area network and Internet gateway bandwidth.


    # Clustered Proxy Cache Architectures


    The Apache and Netscape™ proxy caches are extensions of a conventional web server.
    They are used singly, and although they can be used in a hierarchy of caches,
    there is no optimization between the caches. An alternative is a clustered cache.
    The Harvest cache was the original development and is now a commercial product.
    The Squid cache is a freely available spin-off and is the basis for some commercial
    products. Squid is used at the best cache installations, caching traffic across
    the country for very large Internet service providers.


    Clustered caches use an interchange protocol (ICP) to talk among themselves and
    form an explicit hierarchy of siblings and parents. If the load would overwhelm
    a single machine or if high availability is important, multiple systems are configured
    as siblings. Each sibling stores data in its cache also uses the ICP to search
    the caches of other siblings. The net result: the effective cache size is that
    of all the siblings combined, the hit rate is improved, and it doesn''t matter
    which sibling a client visits. The parent-child relationships also form a more
    efficient than individual hierarchy because the ICP-based connections are more
    efficient than individual HTTP transfers. ICP connections are kept open, and transfers
    have lower latency.'
