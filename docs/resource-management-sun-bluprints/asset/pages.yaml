    # 4-16 Output from the -DWIDE pea.se Command


    The.se script is 90 lines of code containing a few printf in a loop. The real
    work is done in process_class.se (over 500 lines of code). It can be used by any
    other script. The default data shown by pea.se consists of:


    +   - Current time and process name

    - Number of lwps for the process, so you can see which are multithreaded

    - Process ID, parent process ID, and user ID

    - User and system CPU percentage measured accurately by microstate accounting

    - Process time spent waiting in the run queue or for page faults complete

    - CPU accumulated from child processes that have existed

    - Virtual address space size and resident set size, in Kbytes

    - Page fault second rate for the process over this interval


    When the command is run in wide mode, the following data is added:

    - Metadata input and output blocks per process

    - Characters transferred by read and write calls

    - System call second rate over this interval

    - Voluntary context switches, where the process sleeps for a reason

    - Involuntary context switches where the process was interrupted by higher priority
    work or exceeded its time slice

    - Milliseconds per second or the calculated average amount of CPU consumed between
    each context switch


    Additional metrics are available and can be substituted or added to the display
    by editing a copy of the script.


    # Workload Based Summarization


    When you have numerous processes, group them together to make them more manageable.
    If you group them by user name and command, then you can form workloads, which
    is a powerful way to view the system. The SE Toolkit includes a workload class,
    which sits on top of the process class. It pattern matches'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'on user name, command and arguments, and processor set membership. It can work
    on a first-fit basis, where each process is included only in the first workload
    that matches. It can also work on a summary basis, where each process is included
    in every workload that matches. By default, the code allows up to 10 workloads
    to be specified.


    # The pw.se Test Program for Workload Class


    Specifying workloads is the challenge. For simplicity, pw.se uses environment
    variables. The first variable is PW_COUNT, the number of workloads. This is followed
    by PW_CMD_n, PW_ARGS_n, PW_USER_n, and PW_PRSET_n where n goes from 0 to PW_COUNT
    -1. If no pattern is provided, pw.se automatically matches anything. you run pw.se
    with nothing specified all are accumulated into a single catch-all workload. The
    size value is accumulated because it is related to the swap space usage for the
    workload although it is inflated by shared memory. The rss value is not, as too
    much memory is shared for the result to have any useful meaning. The final line
    also shows the total accumulated over all workloads.


