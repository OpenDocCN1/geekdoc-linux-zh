  md: '# Handling Alarms in SyMON Software


    When a simple rule or one of the more complex health monitoring rules generates
    an alarm, it is logged by SyMON software. At the domain level console, the worst
    alarm state for each system being monitored is counted. This means that with only
    one system being monitored only one alarm will be indicated. In this case, it
    is in the red state.


