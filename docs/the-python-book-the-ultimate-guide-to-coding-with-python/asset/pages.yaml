    # 02 Downloading pagers


    Get is a simple version control system that helps programmers store their code
    and associated files. It does not help you return a file to its past or manage
    the history of changes, but it can help you recover code from places like github.com.


    In this version of the project we created for this tutorial we download the folder
    from the command line using `git clone` and `cd


    ```

    $ git clone github.com/rubymist/rubypagiders

    ```


    This creates a folder that contains pagiders — go cd pagiders and take a look
    around.


    # 03 Navigating the pagers


    The project is laid out with several folders. Within pagiders find subfolders:
    one for assets and a second one for players. The players folder contains the main
    file, pagiders.py, which contains the logic of the game. The data folder contains
    subfolders for graphics and sounds, as well as the folder for the screens and
    menus.


    Use the arrow keys to move left and right and the space to shoot. You can go to
    the main screen with the Esc key and quit the game any time.


    # 04 Animation & sound


    Compared with the last tutorial, it''s now a much more dynamic project. The project
    feels alive as you change direction and reacts when you either press the input
    direction or lift the button. When you shoot an alien, the ship explodes


    with several effects and when you take into fire, a smaller explosion occurs on
    your ship. Lasers and explosion effects also accompany the aliens.


    end of the line so the ship moves correctly (without any background). We use subsurface
    to set the initial Player, image to the ship sprite on the sheet. This is set
    by self, ani_pos, which has an initial value of 5. Changing this value would alter
    the ship image it draws to the screen: `0` would draw it fully, `11` to the left.


    # 05 Finding images to animate


    Before we can start animating, we have to set up our assets. We''ve used sprite
    sheets; to use sprite sheets: you create an original image or edit with GIMP with
    a library. It''s easier to make each frame separately. Find many free images at
    opengart.org where we found them.


    # 06 Animation flags


    In this tutorial coding code for the game


    # 07 Tweaking assets


    Many of the assets on sites like opengart.org are used, but you may want to import
    them to fit your game. If you want to change the color or size to fit what you
    need, use the editor as we did with our ship sprite to make it fit to your new
    size and style.


