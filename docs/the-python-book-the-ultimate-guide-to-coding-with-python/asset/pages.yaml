  md: "# # Use Python with Pi\n\n# # Activate motion tracking with your Pi\n\n# ##\
    \ Learn to track images with your Raspberry Pi, a camera and some Python code\n\
    \nBy now you will know that it is possible to you capture functionality using\
    \ a camera and a Raspberry Pi. This lets you include image capture in your program,\
    \ but there is so much more you can do once you have your code working. In this\
    \ chapter we will look at how to add motion detection to your Python program.\n\
    \nThis advanced image processing is extremely difficult to do, so we will define\
    \ building on the hard work of others. Specifically, we will be using the excellent\
    \ OpenCV package. It is constantly improved, with more functionality being added\
    \ with updates.\n\nYou will also need to install the Python packages that you\
    \ will need to talk to the camera and OpenCV. Installing the packages can be done:\n\
    \n```\nsudo apt-get install python3-picamer opencv-python\n```\n\nThis will then\
    \ automatically install all of the dependencies. In this project you will use\
    \ the PICamera for the Raspberry Pi, but we will also point out the other options\
    \ if you want to use a USB webcam. To talk to the camera, you need to use the\
    \ PICamera class from the picamera module.\n\n```\nfrom picamera import PICamera\n\
    from picamera import tuple\ncamera = PICamera()\ncamera.resolution = tuple((640,480))\n\
    frame = camera.capture()\nframe = np.array(frame, dtype=np.uint8)\n```\n\nYou\
    \ have your camera ready, and a memory buffer to store the captured images. There\
    \ are several different methods to use to do motion tracking. One of the simplest\
    \ is to try and notice when something changes. There is a Python module, called\
    \ numpy, that provides several basic image processing functions that are useful\
    \ in the process. We will use it for this purpose:\n\n```\nsudo pip install numpy\n\
    ```\n\nTo look at images, we need to see what the background looks like. We can\
    \ take a series of images and look at the average of these images to get an idea\
    \ of the background. When new images differ from the background, we know that\
    \ something has changed. This change is most visible in grayscale. To find this,\
    \ we will grayscale the image and then get rid of any high-contrast regions. We\
    \ will simply run a continuous loop, capturing an image from the frame and then\n\
    \nprocess the captured frame. There is no data wrapping this image, so it is your\
    \ responsibility to remember what you are working with. next step within the loop\
    \ is to check whether we have an averaged image and initialise it if we don't.\
    \ The first time through the loop, then the code will execute:\n\n```\nif avg\
    \ is None:\n    avg = gray.copy().astype('float')\n    raise.truncate('count')\n\
    continue\n```\n\nNow that we have an averaged image, we can add any subsequent\
    \ captured image to the weighted average. We then need to find how different the\
    \ current image is from the weighted average.\n\n```\ncv2.weighted(gray, avg,\
    \ 0.5)\ndiff = cv2.absdiff(gray, avg)\n```\n\nBy using this difference, we will\
    \ be able to detect motion without false positives due to changes in lighting.\
    \ Now that we have the difference from the average, what do we do with it? How\
    \ do we decide if the difference is large enough? We need to set a threshold that\
    \ signifies a 'large' difference in the image from the average. If we then threshold\
    \ this difference image, we can then go on to find the contours to identify the\
    \ function of objects that are different from the averaged background.\n\n```\n\
    imgThreshold = cv2.threshold(diff, 25, 255, cv2.THRESH_BINARY)[1]\ncontours, _\
    \ = cv2.findContours(imgThreshold, ...)\n```\n\nHere we use the OpenCV functions\
    \ to handle the image processing steps. We have noticed that we are actually working\
    \ with the array representation of the raw\n\n156 The Book Python\n\n*"
