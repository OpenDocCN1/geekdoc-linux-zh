    \ if we want\n\n# The Script\n\nThe game is handled here, passing the player\n\
    to the next function to play, and calling the\nof the session as well\n\n# The\
    \ Game\n\nWe access the full game loop here, and the\nfunction that allows us\
    \ to play if we are\nso inclined\n\n# The Throw\n\nThe initial hand is dealt,\
    \ to start, at the\ntrow function. This function handles all the\ndecision making\
    \ in the game, passing off the\ndice to another function\n\n# The Hand\n\nWe've\
    \ also got a special function so we can\nplayer exactly what style of hand they\n\
    have\n\n# The Decision\n\nThere are two rounds in this version of poker\ndice,\
    \ and we can select how many dice you want\nto re-roll in this small loop that\
