  md: '# Work with Python


    ![](img/287427b4a3b7d7792fc1ca7834fce232_89_0.png)


    # # Replace your shell with Python


    Python is a great programming language, but did you know that it is even capable
    of replacing your primary shell (command-line interface)? Here, we explain all...


    We all use shell on a daily basis. For most of us, shell is the gateway into our
    Linux system. For years and even today, Bash has been the default shell for Linux.
    It is getting a bit long in the tool.


    While the Python programming language may require you to write longer commands
    to use, Python''s modules are organised; however, this is nothing to be particularly
    concerned about. You can easily create aliases for any Bash command that you intend
    to replace. The more time there will be more one way to do a thing, you will need
    to decide which way is best for you.


    No need to be offended: still, Bash is the best shell out there when compared
    to some other shells such as Korn Shell, ZSH, or Csh.


    This tutorial is not about Bash being incapable, it is about how to bring completely
    new life into the shell to do things conveniently and new things which were previously
    not possible, even by a shot. So, without further delay, lets jump!


    Python provides support for executing commands directly (via the os or subprocess
    module), but here we will focus on Python-native implementations, which this allows
    us to develop portable code.


    # Resources


    You will require a version of Python installed on your system. The good news is
    you don''t have to do anything to get it installed. Most of the Linux distributions
    already ship with Python 2.6 or later.'
