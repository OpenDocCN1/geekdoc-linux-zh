  md: '# Use Python with Pi


    The Model A has the Pi-camera connector near the Ethernet port, as does the Model
    B. On the B+ and the Raspberry Pi 2, the connector is in a similar position, but
    it is a little further from the term between the audio-out and HDMI ports.


    Connecting the camera module can be tricky. With your Pi out of its case remove
    the top and disconnect all cables. Take precautions before removing the device
    from your antistatic bag, as the camera module is very sensitive to static electricity.


    On the left, align the plastic catch on the connector and slot the camera module
    into place with the shiny contacts facing away from the Ethernet port. Once it
    is fully slotted, push the plastic catch back into place.


    ```

    sudo apt-get install python-picamera\python3-picamera

    sudo idle3

    ```


    In the Python editor, open FileNew and enter the code below, setting the camera.vflip
    and camera.hflip as True or False as required; save as `camera.py`; then press
    F5 to run the script and view the corrected output.


    To save time, you might try rotating the position of your camera or camera module!


    # 04 Test your Pi camera module


    After connecting the camera, check that it works by booting the Raspberry Pi (we
    assume you''re running Raspberry Pi) and entering this in the command line:


    ```

    sudo raspberrypi-config

    ```


    ```

    import picamera

    from time import sleep

    ```


    ```

    with picamera.Camera() as camera:

    camera.vflip = True

    camera.hflip = True

    camera.start_preview()

    sleep(2)

    camera.capture(''/home/pi/image2.jpg'')

    camera.stop_preview()

    ```


    With the arrows, move down to option ''Enable Camera'', and tap Enter. Following
    the screen, hit Enter again to enable the camera and exit. If you''re not already
    signed into the GUI, or if you''re in the command line interface, enter startx
    to launch the desktop. Open the terminal and enter:


    ```

    raspistill image.jpg

    ```


    You can view the resulting image in your Home directory.


    # 06 Set up the breadboard and button


    We have two ways to add a button to the Raspberry Pi, but before proceeding, ensure
    you have switched the computer off and disconnected it from the power. Disconnect
    all cables and hardware.


    The simplest method of adding a button is to use a solder-free breadboard and
    a single-push button. Connect the button to the breadboard with two male-to-female
    wires running to pins GND and 17. With a script designed to detect action from
    the button on the GPIO frame of your animation can be captured with a single button
    push.


    # 05 Straighten the image


    With the camera up running, you may notice that it''s outputting the image with
    the axes flipped. We can fix this using Python, to open the terminal and enter:


    ![](img/287427b4a3b7d7792fc1ca7834fce232_160_0.png)


    Consider the angle you''ll be shooting from as you are setting up


    Right with the camera module, ensure the shiny side faces away from the Ethernet
    port


