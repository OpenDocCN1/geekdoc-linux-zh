  md: '# Work with Python


    # # System administration


    Get the most out of Python in handling all the day-to-day upkeep that keeps your
    system healthy


    System administration tasks are some of the most things that you need to deal
    with when you have to maintain your own. Because of this, system administrators
    have constantly been trying to find ways to automate these tasks to maximise their
    time. They start with basic shell scripts, and moved on to various scripting languages.
    For a long time, Perl had been the language of choice for developing these types
    of maintenance tools. However, Python is growing in popularity to the point where
    Linux has a Python interpreter included in order to run scripts, so you shouldn''t
    have any problem writing your own scripts.

    Because you will be doing a lot system level work, you will have most of a couple
    of Python modules. The modules provide the bulk of the interfaces interacting
    with the underlying system.

    The first step is to look at the environment where your script is running to see
    what information might exist there. The following code gives you a mapping object
    where you can interact with the environment variables active now:


    Let'' Python scripts enable you to instruct and interact with your operating system


    ```

    import os

    environ

    ```


    You can get a list of the environment variables with the "os.environ" and then
    access individual variables with "os.getenv" used when you spawn a subprocess.
    So you will want to change values, like the PATH or the current working directory,
    in order for you to run subprocesses correctly. There is a "put" function that
    edits these values for you, but unfortunately does not exist on os. So better


    | SYSTEM ADMINISTRATION BASH, PERL, PYTHON | OPERATING SYSTEM | FILES/IO |


    way to do this is to edit the values within the system.

    Another category of tasks you might want to automate when working with files.
    For example, you can get the current working directory with code like


    ```

    cwd = os.getcwd()


    ```


    You can get a list of the files in this directory


    os.listdir(cwd)

    You can move around the file system with the "os.chdir". Once you are interested
    in it, you can use "open" for reading, writing and appending. You can then read
    or write to it using the "os.read" and "os.write". Once, you can close the file
    with "closed".


    # # Running subprocesses from Python


    The philosophy of Unix is to build small, specialised programs that do one thing
    well. You then join together to build more complex behaviors. There is no reason
    to write one giant script for all everything. There are several utilities available
    to use with little work of your own. The order of handling this was very important
    to me, so I used the os module instead, but by using the subprocess module instead.
    You can then launch a program


    This provides you with a long file list for the current directory. The function
    "run" was introduced in Python 3.0 and it is the suggested way of handling this.
    If you need to get the output of the program, you can employ the "popen" function.
    If you want to get the output, you can use the following:


    # # Scheduling with cron


    Once you have your script ready, you can make it to run automatically without
    your intervention. With cron programs, you can run your script on a schedule however
    you like.


    ```

    import subprocess

    subprocess.run([''ls'', ''-l''])

    ```


    ```

    output = subprocess.run([''ls'', ''-l''], stdout=PIPE)

    ```


    The variable "output" is a CompletedProcess object that returns the return code
    and a string holding the stdout output.


    "cron -l" lists the cron jobs and lets you edit the scheduled jobs that you want
    to run.


