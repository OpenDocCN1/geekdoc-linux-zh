  md: '# Use Python with Pi


    # # essential

    # Sense HAT: Part 2


    # Use your skills from the last tutorial to create a

    Sense HAT version of RPSLS


    By now you will have played Rock, Scissors in real life.

    The issue with this version is that there are only three possible outcomes

    other than a tie. Sam and Karen Bly introduced an alternative version

    that adds "spock" and "lizard"; signed with the Star Trek

    Vulcan sign, where "live" is shown by forming the hand into a mouth.

    Rock is crushed by scissors and rocks; this tutorial will walk you through creating

    your Sense HAT version of the game.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_171_0.png)


    Each LED on the matrix can be automatically set from

    an image file. For example, an image of a lizard can be

    loaded, the colours and positions calculated and then

    the corresponding LEDs enabled. The image needs to be

    8x8 pixels so it fits the LED matrix. Modify the

    structure to fit the lizard, and save it in the

    same folder as your program.


    # 01 Import things with the Sense HAT


    When you complete this tutorial you will have a folder which contains

    five 8 images, each representing one of the items: rock, scissors,

    lizard and spock. When the program runs, it will ask you to use the joystick to

    select your choice. Press any key to enter. The computer then selects a random
    item. Each picture is

    asigned a value and used to find the modulus (remainder) of

    diding the two values. The value of the remainder determines the outcomes,

    like:


    # 02 Import the modules


    Boot up your Raspberry Pi and open the Terminal. Type nano edit

    to load the Python 3 editor. Import the module (one line) and the

    SenseHAT module (one line). Your program uses the random module to

    the computer''s choices in the game. Import the random module (four line):


    ```

    import pygame

    import random

    from sense_hat import SenseHAT

    import random

    import time

    ```


    # 03 Scrolling a message


    During the game the message is updated via messages with

    scrolled LED matrix. The SenseHAT API simplifies the process

    to a simple line of code: sense.show_message("This is a message!").nYour message
    will be scrolled across the Sense HAT LEDs. Change the

    message the space between characters and the time it takes to scroll, by changing

    text_colour=(255, 0, 0) to set the RGB value and scroll_speed=50. Try

    experimenting with the following code:


    ```

    sense = SenseHAT()

    sense.show_message("Hello User Developer", text_colour=[255,

    0, 0])

    ```


    # 04 Mapping an LED image


    Images are made of pixels that combine to create an overall picture.


    ```

    from sense_hat import SenseHAT

    ```


    ```

    sense = SenseHAT()

    sense.load_image("lizard.png")

    ```


    # 05 Create the variables and initialise Pygame


    Next, create variables to store the player''s choice, one

    and also to track the picture which is currently

    displayed on the global clock. Set these as global variables

    able them to be accessed by other parts of the program or

    return the values that are returned. Then, use the Pygame window

    typing to display the result not used in the

    game to set it a small size. The first code with the

    sense.load_image("lizard.png") loads this picture from your folder.

    Now that the LEDs are too bright, add size, light=True, to return

    the choice and then set the same image for the

    game running with


    ```

    players_choice

    computer_choice

    global_clock

    ```


    ```

    ### Setup Pygame Frame ###

    pygame.init()

    ```


    ```

    ### Prepare Sense HAT ###

    sense = SenseHAT()

    sense.load_image("png")


    nsense.low_light=True # save your efforts

    ```


    ```

    players_choice = 0

    running = True

    ```


    # 06 Convert the variables/numbers into items


    In the following game use variables to identify

    the their names. You can select a player and

    also use a modulus operation to calculate the outcome of the game. Create a

    function that converts and assigns the value to the respective item.

    The value of player''s choice is set twice—during a game loop to check

    that the fifth image has been loaded and then resets the value to zero

    would result in the fifth image not displayed.


    172 The Python Book'
