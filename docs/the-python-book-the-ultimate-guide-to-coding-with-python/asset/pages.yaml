  md: '# Turn your Raspberry Pi into a stop-motion studio


    Build your own animation studio by using Raspberry Pi as a stop-motion camera


    # Resources


    Hard drive


    OSMC:


    osmc.tv


    Home network


    Another Linux computer, less than eight years old


    What have you done with your Raspberry Pi lately? While it gives us plenty of
    new ways to use the Pi, unless you''ve got your computer set up as a security
    monitor or particular fan of time-lapse photography, you''ve overlooked the Raspberry
    Pi module for a while


    If you''re it into animation or you simply want to extend the possibilities of
    the module, why not build a stop-motion camera? By using Python and an external
    button to capture images, the Raspberry Pi can actually be


    Better yet, you can go beyond animating toys bits of LEGO and go school by mounting
    the Pi on a rostrum and creating a cartoon. If you can''t buy or build one, you
    can mount the stop-motion Pi camera with a smartphone mount for stability.


    # 01 Mount your stop-motion camera


    Before you get started, think about the type of animation you''re going to be.
    If you''re using the traditional-cut method, used by cartoon artists, you''ll
    need a rostrum to mount the Raspberry Pi.


    Alternatively, you may be animating something on a desk, table or perhaps the


    floor, but you''ll need your Pi camera mounted in a similar way, looking rather
    than down.


    Various options are available, such as smartphone stands and dashboard mounts.
    Most of these should be suitable for securely mounting your Pi.


    # 02 Find where to shoot


    For your first attempt at shooting a stop-motion video, why not use a kitchen
    work surface or even the floor, it might be a desk, it should be a hard and flat
    area in most cases. You will need a stable environment for the creation of your
    stop-motion film.


    As you progress and your skills develop, other surfaces can provide alternatives,
    but keep it simple for now and with flat surfaces while you get used with the
    art form using the Raspberry Pi.


    # 03 Connect the Pi camera module


    Next you''ll need to connect the Pi camera to your Raspberry Pi. All models have
    the necessary connector, although it is found on the device will depend on the
    version of your Raspberry Pi.


    Below our home-made antenna may look a little rough around the edges, but works
    great!


    ![](img/287427b4a3b7d7792fc1ca7834fce232_159_0.png)'
