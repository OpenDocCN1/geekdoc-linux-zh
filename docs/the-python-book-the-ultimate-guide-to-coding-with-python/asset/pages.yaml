  md: '# Preparing the structure


    As we have mentioned previously, XBMC extension type follows a certain naming
    convention. In this case we are building a video plug-in, so the plug-in directory
    would be plugin_video. But just that we will need other folders and files as well.


    +   The following describes the structure of LCD/User Interface:

    - plugin_video/ (Root plugin)

    - default.xml

    - changelog.txt

    - icon.png

    - LICENSE.txt

    - README

    - resources/

    - settings.xml


    ```

    version="2.3.0"

    <import addon="plugin.video.youtube" version="1.0.0">

    <import addon="plugin.video.vimeo" version="2.3.0">

    <import addon="plugin.video.youtube.com" version="1.0.0">

    ```


    In the code we have added a library called xbmc_python 21.1. Currently it is added
    as a mandatory dependency. To make the dependency optional, use sg addon="xbmc_python"
    version="0.1.0" optional="true",


    # Setting up plug-metadata


    Metadata about the plug is provided in extension point="xbmc.addon.metadata".
    The following are the important elements:


    platform: For this case, XBMC extensions are are cross-platform. However, if the
    dependent platform library is only available on certain platforms then you will
    need to set the supported platforms here. Accepted values for the platform are
    x64, ios (Apple iOS), windx (Windows DirectX), wingl (Windows OpenGL) and other.


    summary: This gives a brief description of the plug-in. Our example sets the language
    as English, but you can also set the language.


    description: A description of the plug-in. source: Source repository URL. If you
    are hosting your plug-in on GitHub, you can put the repository URL here.


    forum: Forum URL for your plug-in. email: Your email address. You can directly
    enter your email or use a bot-friendly email address like domain.com.


    # Creating an addon


    The addon is created in the root of the extension directory. The addon contains
    the metadata from a XBMC extension. It contains overview, credits, version information
    and details about the author.


    ```

    xbmc_python 2.1

    xbmc_python 4.0

    xbmc_metadata 2.1

    xbmc_addon 12.0

    ```


    The root of the addon is the element it is defined as:


    ```

    <addon id="plugin.video">

    <name>LS HD Video</name>

    <version>1</version>

    ```


    For the current version of XBMC 121, the following version of core components
    has changed:


    In the addon we also add some third-party plug-ins as dependencies, such as plugin:video-plugins.
    These plugins will be installed when we install the XBMC addon.


    The rest of the content is placed here <addon>

    Here, we define the library for the plug-in, so it should be unique among all
    the XBMC extensions, and it is also used for the dependency. The XBMC version
    number, which helps in its ability to develop the addon - follows Major.Minor.Patch
    versioning convention; is the English of the plug-in.


    # Setting icon, format and licence


    We need a few more details in the plug-in: directory. The changelog is visible
    from the XBMC UI.


    changelog.txt: You should list the changes made to your plug-in between releases.
    The changelog is visible from the XBMC UI.


    +   An example:

    0.0.1

    - Initial Release

    0.0.2

    - Fixed Video Buffering


    icon.png: This will represent the plug-in in the XBMC UI. It will be a non-transparent
    PNG image of size 256x256.


    fanart.jpg (optional): The fanart is rendered in the XBMC mark if a user selects
    the plug-in. The MC mark needs to be rendered in HD formats, so its size can range
    from 1280x720 (720p) to the maximum 1920x1080.


    # Setting up the entry point


    Our extension is provided to the content point for XBMC. In order to convey that,
    we have to set up the following:


    ```

    <extension point="xbmc.addon">

    pluginsource="default"

    <providers><video/</providers>

    </extension>

    ```


    Here, the library attribute sets the plug-in point. In this example default python
    is executed when the user activates the plug-in. We specify the type it provides.
    This also reflects the placement of the plug-in. Since we are a video plug-in,
    it will show up in the Sections of XBMC.


    # Adding dependency information


    Dependency is an extension that is managed using the requires element.


    ```

    <requires>

    <import addon="xbmc.python">

    ```


    ![](img/287427b4a3b7d7792fc1ca7834fce232_74_0.png)


    The Python Book 75'
