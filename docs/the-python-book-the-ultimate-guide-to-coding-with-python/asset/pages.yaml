  md: "# Work with Python\n\n# Multitask with your Pi\n\nLearn how to multitask with\
    \ your own Python code — for those with multiple projects on the go\n\nthe majority\
    \ of programmers will learn single-threaded programming as their first computational\
    \ model. The basic idea is that functions are executed sequentially, one after\
    \ the other. This works well in most situations, but you will reach a point where\
    \ you need to multitask. Many modern applications are built by running on a multiprocessor\
    \ processor of some machine. In these cases, you would have some heavy, compute-bound\
    \ processes running on each. Since your Pi is not a 16-core desktop machine, you\
    \ might be under the assumption that you can't take advantage of using multiple\
    \ threads of execution. This isn't true.\n\nThere are lots of problems that may\
    \ require you to multitask. The you might break down a large task into smaller\
    \ threads that take an amount of time to complete. In these cases, it is well\
    \ worth putting effort to program threads. Since Python is the language of choice\
    \ for the Raspberry Pi, we will learn how to add threads to your code. For those\
    \ who have worked with multi-threading in Python, you may have run into the GIL,\
    \ Global Interpreter Lock. Only one thread can actually be running at a time,\
    \ so you get no parallel processing. The Raspberry Pi is exactly like this.\n\n\
    ```\nt = threading.Thread(target=my_func)\n```\n\nthread object has finished its\
    \ initialisation, it is alive but not running. You need to explicitly call the\
    \ new thread's start() method. This will begin running the code within the function\
    \ handed to the thread.\n\nYou can check to verify if a thread is alive and active\
    \ by calling is_alive(). Normally, this new will run until the thread finishes.\
    \ Depending on your experience of parallel programming, you may already have some\
    \ ideas about how to handle the case where an exit is an unexpected exception.\n\
    \n```\ndef my_func():\n    id = threading.get_ident()\n    if id == 1:\n     \
    \   print(\"starting thread\")\n\nread threading.Thread(target=my_func).start()\n\
    ```\n\nThis code doesn't work in Python 2. One of the modules that was changed\
    \ when moving from one version of Python to another is threading. Here is the\
    \ fix for the version of your code.\n\nAnother common problem in parallel programming\
    \ is how to share variables IO between threads. This way, your program can continue\
    \ with the code and all of the resources are kept safe. But what if the child\
    \ thread is dead or not? If you use the is_alive() method you can wait for the\
    \ results from the child thread. In these cases, you can use the join() method\
    \ of the thread object you\n\nare waiting on. This method blocks until the thread\
    \ in question returns. You can include an optional parameter to the method that\
    \ times out after some number of seconds. This allows you to not get trapped in\
    \ a thread that never returns to main execution.\n\nNow we have more than one\
    \ thread of execution at the same time, we have to worry what might happen if\
    \ they read, or write, variables. They access global data. What if you have two\
    \ threads that want to read write the same variable? You can have situations where\
    \ the values of the variables get out of sync with each other.\n\nThese types\
    \ of issues are called race conditions, because the threads are racing with each\
    \ other to see what they will find when they try to access the variables. There\
    \ are two solutions to solve this problem of:\n\n```\nlock = threading.Lock()\n\
    ```\n\nThe first is to control access to global variables and only allow one thread\
    \ to work with them at a time. The generic thread describes how to use this to\
    \ control access. A mutex is an object that needs to lock shared variables. This\
    \ module object is called a lock. The first is to create a new object:\n\nThis\
    \ new lock is created but not used yet. To use the lock you must call the lock()\
    \ method for the lock. If the lock is currently held by another thread the state\
    \ will change and run the code that must be protected. If the lock is locked in\
    \ a thread it will wait for the lock to become free. Once you are done with the\
    \ protected code, you can use the release() method to free the lock for the next\
    \ thread. You can then control a variable containing the sum of results results\
