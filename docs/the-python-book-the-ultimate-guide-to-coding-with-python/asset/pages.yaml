    # 02 Reloading modules


    When a module is imported, any initialization functions are run at that time.
    This may involve creating objects, establishing connections. But this is only
    done the first time within a given session. Importing the module again will not
    re-execute any of the code. If you have to re-run it, you must use the reload
    function. The format is reload(modename). To keep in mind that the reference from
    the previous import lasts, but only once. This means that if you redefine a function,
    the old one and related objects are not updated. There may be side effects, the
    old one will still be active and so. Always use with caution.


    # 01 Importing modules


    The strength of Python is to be extended through modules. The first step in that
    is to import the modules that you need. Simple implementation is to just call
    ''import module''. In this case, functions and objects are not in the general
    namespace. You access them by using the command module.modename. You can shorten
    the modename by using ''from module as modename''. You can skip this by using
    import * from the given module. Then you can call provided capabilities directly.
    If you only need a few of the items, you can import them selectively by prefixing
    the with ''*'' to object names.


    # 03 Installing new modules


    While most of the commands we are looking at are Python commands there are few
    essential commands that need to be executed outside Python. The first of these
    is installing a module involves downloading the source code, and compiling any
    external code. Locally, there is a repository of hundreds of Python modules available
    at http://pypi.org/. Instead of doing everything manually, you can install it
    using pip. The command is ''pip install modename''. You may need administrator
    rights if you want to install this new module in the global library for your computer.
    On a Linux machine, you can use sudo with the pip pip command. Otherwise, you
    can install it to your personal library by using the --user option .


    > "Programming language that there has a core of functionality that everyone want
    to know in order to work done. Python is no different"


    # 04 Executing a script


    Importing a module does run the code within the file, but it does not the Python
    engine. This method also does without initializing code. If you only want to execute
    a script and run the code without importing it, you can use the ''execute filename.py''
    command, where the main option is to calling the Python file to load and variables
    are not loaded into the locals and globals of the current session. You can optionally
    include two parameters to the execute command. These work both dictionaries, for
    a different set of locals and a different set of globals. If you only have in
    one dictionary, it is assumed to be the global dictionary. The return value of
    this command is None.


    # 05 An enhanced shell


    The default shell is provided rather than an enhanced shell through the command
    ''python'', but it provides an interactive interface to develop code. The history
    system is available, showing not only from the current session, but many commands
    of interacting with the current Python session. You can also peek into the memory
    of the Python session and decompose it. You can create profiles that allow you
    to handle initialisation steps that you may need to do every time use python.


    # 06 Evaluating code


    Sometimes you may have chunks of code that are put together programmatically.
    If these pieces of code can be put as a string, you can execute the result with
    the ''eval string''. Any syntax errors in the code will be executed within the
    current session, using the current locals and globals. If you have two other parameters,
    you may provide a different set of dictionaries for the globals and locals. If
    there is only one global parameter, you can use the global dictionary. You can
    also hand in a global dictionary an object that is executed with the compile command
    instead of the code. The return value of this command is None.


