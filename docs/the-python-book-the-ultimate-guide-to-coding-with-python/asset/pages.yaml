  md: '# Create with Python


    ![](img/287427b4a3b7d7792fc1ca7834fce232_111_0.png)


    # # Part one: Program a Space Invaders clone


    Write your own Invader in 300 lines of Python


    # Resources


    Raspbian: [www.raspberry.org/downloads](https://www.raspberry.org/downloads)


    Python: [www.python.org/doc](https://www.python.org/doc)


    Pygame: [www.pygame.org/docs](https://www.pygame.org/docs)


    When you''re learning to program in a new language or mastering a new module,
    experimenting with a familiar and relatively simple project is a very useful exercise
    for understanding the tools you''re using. Our Space Invaders clone is one such
    example that lends perfectly to Python and the Pygame module - it''s a simple
    game with almost universally known rules and logic. The invaders


    meander they down the screen towards you, it''s your job to pick them off while
    dodging their random fire. When one wave is conquered faster, more waves appear.
    We''ve tried to use many features of Pygame, which is designed to make creating
    interactive games applications easier. We''ve extensively used the Sprite class,
    which makes dozens of lines of extra code in making the invaders move across the
    screen and many others


    We agree that this is an exciting game to play and learn more about Python and
    Pygame, but our system is far from perfect. Don''t worry, that will be covered
    in the next tutorial, adding animation and sound effects to our game to give it
    that self-respecting Space Invaders shooter demands...


    #  01 Setting up dependencies


    If you''re looking to get a better understanding of programming games with Python
    and Pygame, we recommend copying the Python code in the tutorial into your own
    program. It''s great practice and gives you a chance to tweak the elements of
    the game to see what fits a different ship shape, changing the difficulty or the
    ways the aliens behave. If it isn''t already installed can install it from the
    terminal by typing:


    ```

    sudo apt-get install python

    ```


    #  02 Downloading the project


    If you prefer using Git, a brilliant form of version control to easily store the
    game files and retain historical versions of your code, it should already be installed
    on your Pi. If not you can install it by typing:


    ```

    sudo apt-get install git

    ```


    As well as today for code, Git enables you to clone copies of other projects so
    you can work on, or use them. To clone Pygame, go to your home folder in the terminal
    cd - make a directory for your project space invaders and type


    ```

    git clone https://github.com/raspiiv/spaceinvaders

    ```


    112 The Book by Python'
