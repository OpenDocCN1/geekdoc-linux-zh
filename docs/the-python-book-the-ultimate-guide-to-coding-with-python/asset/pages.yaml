  md: '# Create a graphical interface for Python games


    Bring everything together with a Python GUI and take the next step in programming
    your own software


    The three basic games we have made so far have all run without issues which allowed
    us to use different IDEs. To show off different ways to use Python, we haven''t
    actually shown you how to present it yet. In this tutorial, we will take all three
    games and put them all into one nearly unified graphical interface.


    To this end, we''ll be use of the small line of code we added at the bottom of
    each previous tutorial we can import as


    modules into our main graphical script. We''ll also modify the existing code to
    add some graphical elements. To do this we''ll be using Tkinter, a default module
    in Python that allows us to create windows and frames with simple code.


    All you need for this tutorial is an up-to-date copy of Python, from your distro
    repository or the website, and the IDE development environment. This will also
    work great on Raspberry Pi Distros, as Raspbian.


    # Resources


    +   * Python 2: https://www.python.org/download

    * IDLE: https://www.python.org/idle


    # The start


    Here we''re doing some minor setup, including getting a new module that helps
    us create a simple graphical interface


    # The imports


    We''re importing the three games we created in past issues so we can call them
    or use


    # The window


    Creating graphical window and giving it a name so we can add functions to


    # The frame


    Define the dimensions of the window and give a rough guide to the placement of
    widgets


    # The welcome


    Putting a message in the window and place it in a specific orientation. This was
    a little different to


    # The button


    The focus of this month''s work is making Rock-Paper-Scissors in a graphical interface,
    so we''re creating a new function for


    # The interface


    Creating and formatting to start the other two games command line or shell


    # The exit


    Here we create a button that quits the window and ends the script. We also placed
    it specifically at the bottom of the window


    # The loop


    The mainloop allows the window to continue to work and updated without exiting
    the program unless specified


    ```

    #/usr/bin/python

    ```


    # Main Interface Code Listing


    ```

    import rockscissors

    import happen

    import tkinter


    root = tk.Tk()

    root.title("Welcome to Linux & Developers Mega Mega Collection")


    frame = tk.Frame(root, height=200, width=500)

    frame.pack()


    rock_button = tk.Button(frame, text="Rock, Paper, Scissors", command=rockscissors)

    rock_button.pack()


    happen_button = tk.Button(frame, text="Hangman", command=happen)

    happen_button.pack()


    dice_button = tk.Button(frame, text="Poker Dice", command=pdice.start)

    dice_button.pack()


    exit_button = tk.Button(frame, text="Quit", command=root.destroy)

    exit_button.pack(side=BOTTOM)


    root.mainloop()

    ```'
