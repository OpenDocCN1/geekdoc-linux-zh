    **In a previous piece, we looked at how you could look at a scene and figure out
    there was any motion there.** Now we take one step further and we will get our
    Raspberry Pi to accurately recognize faces.


    We will assume here that you are using the camera for the Raspberry Pi, or a USB
    cam. In this case, you have streams of images being handled by your code, ready
    to be processed. Again, as in previous articles, we will be using Python module
    to handle all of the heavy image processing involved. The first step is to have
    your OpenCV module installed with:


    are a number of files which will identify many common targets. You can get them
    using the command:


    ```

    `sudo apt-get install opencv-data`

    ```


    This will install a number of cascade files within the directory `/usr/share/opencv/haarcascades/.


    This gives you a list of what looks like a face. Where OpenCV has found what it
    likes. Something to keep in mind is that these algorithms are performed using
    machine learning, so they are not perfect. You will likely get false positives,
    as well as missed faces.


    ```

    sudo apt-get install python-opencv

    ```


    To identify a face, your code needs to check each sub-region of the image for
    the face. To succeed, you may need to check as many as sixty features, or more,
    for each sub-region of the image. The more features the machine has to detect.
    OpenCV gets objects by this using a technique called cascade. For each sub-region,
    it will check if this sub-region contains something that might be a face.


    Now that we have everything ready, we will look how to identify faces. We have
    a static image in the file ''faces.jpg'' and we are going to use a classifier
    constructed from one of the Haarcascades that you are interested in forward facing
    faces.


    In the example, the scale-factor tries to account for the fact that the face might
    be larger or smaller than in training the classifier. The MinNeighbors find how
    many objects are detected before the classifier decides that is a face. The MinSize
    defines the window size used in the cascade classifier.


    If these initial tests pass, then OpenCV will confirm this classification. This
    allows to quickly decide that some sub regions contain a face. This will save
    time and get the more details. This technique brings facial recognition to real-time
    speeds. In order to detect these cascades, we will need a classifier for faces.
    This is in an XML file that contains the details of a training session where images
    were processed to find out what features a face has of.


    One thing to be aw of is that the CascadeClassifier will not function without
    the default set. The next step is to load the classifier from the XML file and
    then we need to use it on the image if it is in color. You could use something
    like the lines of:


    ```

    face = cv2.imread(''faces.jpg'')

    gray = cv2.cvtColor(face,cv2.COLOR_GRAY)

    ```


    Now that we have the basics of detecting, we need to move on and see how to do
    this on a stream of images, such as from camera. From a camera, we might need
    to use the video capture functionality within OpenCV. To use example, you could
    use:


    ```

    video = cv2.VideoCapture(0)

    ```


    If you are using images, like pygame, to read the image stream, it should be used
    with pre-processing. Then you need to enter a loop where you are reading frames
