  md: '# Python essentials


    ![](img/287427b4a3b7d7792fc1ca7834fce232_25_0.png)


    Python is a programming language that lets you work more quickly and integrate
    your systems more effectively. Today, Python is one of the most popular programming
    languages in the open source space. Look around and you will find it running everywhere,
    from various configuration tools to XML parsing. Here is the collection of 50
    gems to make your Python experience worthwhile...


    # Basics


    01 Running scripts

    On most of the UNIX systems, you can run Python scripts from the command line.

    $ python myprog.py


    02 Running Python programs from Python interpreter

    The interactive interpreter makes it easy to try your first steps in programming
    and


    using all Python commands. You just issue each command at the prompt (>>>), one
    by one, and the answer is immediate.


    ```

    Python interpreter can be started by issuing

    $ python

    kunal@ubuntu:~$ python

    Python 2.6.2 (release2-6-main, Apr

    19 2009, 15:46:41) on linux2

    [GCC 4.3.3]

    >>> help("help","copyright","credits"

    ...or "license" for more information.

    >>> quit()

    ```


    In this article, all code starting at the

    >>> symbol is meant to be generated by


    # Python prompt.


    It is important to remember that Python takes tabs very seriously — if you receive
    any error that mentions tabs, check the tab spacing.


    # 03 Dynamic typing


    In C, and other statically typed languages, you must specify the data type of
    the return value and each function argument. Python is a dynamically typed language,
    you never have to explicitly specify the type of anything. Based on what value
    you assign, Python will keep track of the data type internally.


    26 The Python Book'
