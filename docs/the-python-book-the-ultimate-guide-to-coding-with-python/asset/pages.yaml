    , hand[i])\n\nresult = hand\nprint(\"You finish with\", result)\n```\n\n# The\
    \ Rolls\n\nThe function we roll our virtual dice using a simple loop. This allows\
    \ us to keep the codebase smaller\n\n```\nroll_number = roll(7)\ndice = roll(roll_number)\n\
    iterations = 0\nwhile iterations < roll_number:\n    iterations = iterations +\
    \ 1\n    dice(iterations-1) = random.choice(numbers)\nreturn dice\n```\n\n# The\
    \ Analysis\n\nThere are eight types of hands in this, and we can use a bit of\
    \ logic to work out all of them without without checking all 7,778 outcomes -\
    \ in fact, we specifically have to check for\n\n# The Question\n\nOur 'play' game\
    \ that functions player input so we can restart or end the script\n\n# The End\n\
    \nScores are displayed at the end of the game, and the very final part allow us\
    \ to import this into other Python scripts as a module\n\n```\ndef hand(dice):\n\
    \    dice_hand = [list(group(dice)) for key, group in group(dice)]\n    dice_hand.sort(reverse=True)\n\
    \    if dice == stright(2):\n        return(\"straight\")\n    elif len(dice_hand[0])\
    \ == 4:\n        return(\"four of a kind\")\n    elif len(dice_hand[0]) == 3 and\
    \ dice_hand == 2:\n        return(\"a full house\")\n    elif dice_hand[0] ==\
    \ 3:\n        return(\"three of a kind\")\n    elif dice_hand[0] == 2:\n     \
    \   return(\"two pair\")\n    else:\n        return(\"a high card\")\n```\n\n\
    ```\ndef play_game():\n    answer = input(\"Would you like to play again? y/n:\"\
    )\n    if answer.lower() in ('y', 'yes', 'Yes', 'Of course'):\n        return\
    \ play_game()\n    else:\n        print(\"Thank you for playing our game. See\
    \ you next time!\")\n```\n\n```\ndef score(dice):\n    dice_score, computer_score\
    \ = computer_score(dice)\n    print(\"HIGH SCORE\")\n    print(\"Player:\", player_score)\n\
    \    print(\"Computer\", computer_score)\n\nif __name__ == \"__main__\":\n   \
    \ start()\n```\n\n+   EXTRA FUNCTIONS\nSplitting actions into functions makes\
    \ it easier to not perform them multiple times, but reduces the amount of code.\
    \ On larger projects, this can aid with speed.\n\nThe Python Book 45"
