  md: "# We're going to write a program that will ask the user to input an arbitrary\n\
    # number of integers, store them in a collection, and then demonstrate how the\n\
    # collection would be used with various control structures.\n\nThe number of integers\
    \ we\nwant in the list\n\n```\n#/usr/bin/env python2\n\nimport sys # Used for\
    \ the sys.exit function\ntarget_int = int(input(\"How many integers?\"))\n\n#\
    \ By now, the variable target_int contains a string representation of\n# whatever\
    \ the user typed. We need to try and convert that to an integer but\n# be ready\
    \ to deal with the error if it's not. Otherwise the program will\ntry:\n    target_int\
    \ = int(target_int)\nexcept ValueError:\n    sys.exit(\"You must enter an integer\"\
    )\n```\n\nA list used to store the integers\n\nThese are used to keep track\n\
    of how many integers we\ncurrently have\n\n```\nints = list()\ncount = 0\n\n#\
    \ Keep asking for an integer until we have the required\nwhile count < target_int:\n\
    \    new_int = raw_input(\"Please enter integer (0):\".format(count + 1))\n  \
    \  is_int = False\n    try:\n        new_int = int(new_int)\n```\n\nIf the above\
    \ succeeds then int\nwill be set to true: is_int=True\n\n```\nexcept:\n# Only\
    \ if we have an integer. If not, we will loop again\n# Notice below we use ==,\
    \ which is different from =. The single equals is an\n# assignment operator whereas\
    \ the double equals is a comparison operator.\n\nis is_int == True:\n# Add the\
    \ integer to the collection\nints.append(new_int)\n# Increment the count by 1\n\
    count = 1\n```\n\nBy now, the user has given up\nwe have the list with integers.\n\
    We can loop through there a\nc couple of ways. The first is with\na for loop\n\
    \n```\nprint(\"Using a for loop\")\nfor value in ints:\n    print(str(value))\n\
