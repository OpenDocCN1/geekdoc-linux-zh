    # # Pygame Zero


    Pygame Zero cuts out the boilerplate to turn your ideas into games instantly,
    and we''ll show you how


    Code for later


    # Resources


    +   **Pygame Zero:**

    pygame-zero.readtheocs.org

    **Pygame:**

    pygame.org/download.html

    **Pip**

    pip-installer

    **Python 3.2 or later**

    www.python.org/

    **Code from FileSilo (optional)


    Games are a great way of understanding a language: you have a goal to work towards,
    and each feature you add brings more fun. However, games need libraries and modules
    for graphics and other essential features. Pygame made it relatively easy to make
    games without having to learn everything that you need before you started - barriers
    to your young getting started in code.


    Pygame Zero deals with all of the boilerplate code for you, so you get coding
    games instantly. It (we assume) makes sensible assumptions about what you''ll
    need for a game - from the size of the window to importing the game library -
    so that you can get straight to coding your ideas.


    > Pygame''s creator, Daniel Pope, told us that the library ''grew out of talking
    to teachers at Python UK''s track, and trying to understand that they need to
    immediate results and breaks into bite-size fragments, to keep a close up to speed.
    To give you an idea of what''s involved, we''ll build up a simple sample from
    a Pong-type bat and ball to smashing blocks style. The project will be done with
    little effort. Rapid in early development but still offers a great start and is
    now included on the Pi in the Raspberry Pi image.


    We''ll look at installation on other platforms, but let''s see what magic it can
    bring us.'
