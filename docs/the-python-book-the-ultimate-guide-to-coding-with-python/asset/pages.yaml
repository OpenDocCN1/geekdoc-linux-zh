  md: "# Web development\n\n> You don't have full control from start to finish with\
    \ a prefabricated blog – but you will win it with Django\n\n# 08 Create your blog\n\
    \nproject: Now it's time to create a blog app in python manage.py startup blog\n\
    \nThis creates the models file which is all your data lives. You can change 'blog'\
    \ to another name, but we use it in our examples.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_143_0.png)\n\
