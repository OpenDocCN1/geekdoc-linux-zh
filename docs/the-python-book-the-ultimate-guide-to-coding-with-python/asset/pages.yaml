    \ += 1\n```\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_118_0.png)\n\n```\nself.explode\
    \ = False\nself.alien_explode = False\npygame.time.get_millis() % 1000 < 5\nreturn\
    \ True\n```\n\n```\ndef update(self):\n    for alien in self.alien_group:\n  \
    \      if alien.rect.top > 0:\n            self.alien_explode = True\n    self.alien_explode\
    \ = False\n    pygame.time.get_millis() % 1000 < 5\n```\n\n```\nif len(self.alien_group)\
    \ < 1:\n    spawn_alien(self)\n```\n\n```\ndef next_row(self):\n    self.explode\
    \ = False\n    for alien in self.missile_group:\n        if missile.rect.colliderect(alien.rect):\n\
    \            alien.explode = True\n            self.alien_group.append(rect.x)\n\
    ```\n\n```\ndef calc_collision(self):\n    pygame.sprite.groupcollide(self.bullet_group,\
    \ self.alien_group, True, True)\n    pygame.sprite.groupcollide(self.bullet_group,\
    \ self.barrier_group, True, True)\n```\n\n```\ndef main_loop(self):\n    while\
    \ GameState.game_time:\n        while GameState.game_time:\n            pygame.time.get_ticks()\n\
    \            self.player.update()\n            self.collison = False\n       \
    \     self.calc_collision()\n            if GameState.is_dead or self.enemies_breached:\n\
    \                self.game_over()\n            for alien in self.alien_group:\n\
    \                alien.update()\n                if alien.rect.colliderect(self.player.rect):\n\
    \                    self.is_dead = True\n            if GameState.is_dead:\n\
    \                self.game_over()\n```\n\n```\nif __name__ == '__main__':\n  \
    \  pv = Game()\n    pv.main_loop()\n```\n\nThe Python Book 119"
