  md: "# 50 Python commands\n\n# Asserting values\n\nAt some point we all need to\
    \ debug some piece of code we are trying to write. An assertion takes a Python\
    \ expression and checks if it is true. If it is, nothing happens as normal. If\
    \ it is not, an AssertionError is raised. You can use assertions to check that\
    \ invariants. You can check assertions made within your code. You can optionally\
    \ include a second assertion to parameter the command. If the assertion fails,\
    \ this is some type of detailed error message that gets printed out, or you may\
    \ want to include cleanup code that helps to recover from the failed assertion.\n\
    \n# Mapping functions\n\nA common task that is done in modern programming is to\
    \ map a computation over a list of elements. The map() function returns a list\
    \ of the results of the function applied to each element of an iterable. Object\
    \ can map functions. If there is more than one function, a list of tuples is returned,\
    \ with each element of the tuple containing the results from each function. If\
    \ functions take more than one input parameter, it will take them from the iterables.\
    \ This assumes that the iterables are of the same size and that they are all necessary\
    \ for the function.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_17_0.png)\n\n\
    # Virtual environments\n\nBecause of the complexity of the environment, it is\
    \ best to set up a clean environment within which to install only the modules\
    \ you need for a given project. You can create a named environment (VENV). This\
    \ will create a subdirectory, bin and include, with an initial environment. You\
    \ can then start using this environment which will change your environment variables.\
    \ When you are done, you can reset your environment to its previous condition.\
    \ You can create environments that have only the modules you need for given set\
    \ of tasks.\n\nWhile not strictly commands, everyone needs to know how to deal\
    \ with loops. The main types of loops are fixed number iterations loops (for)\
    \ and a conditional loop (while)\n\n# Loops\n\nWhile not strictly commands, everyone\
    \ needs to know how to deal with loops. The main types of loops are fixed number\
    \ iterations loops (for) and a conditional loop (while). In a loop, you iterate\
    \ over a sequence of values, putting them one at a time and putting them in a\
    \ variable. If you have already processed every element or you have a break, the\
    \ loop will stop. Loops can also be exited early by using the break command, or\
    \ you can skip pieces of code using the continue statement to selectively skip\
    \ this current iteration and move to the next one.\n\n```\nfor i in range(5):\n\
    \    print(i)\n```\n\n```\nfor i in range(5):\n    print(i)\n```\n\n# Filtering\n\
    \nWhere the map returns a result for every element in an iterable, filter returns\
    \ only the result that returns a true value. You can create a new list of elements\
    \ where only those that meet some condition are returned. For example, if the\
    \ values were between 0 and 10, you would create a new list with negative numbers\
    \ and numbers above 10. This can be accomplished with a loop, but this method\
    \ is much less code. If the filter function provided is 'None', it is assumed\
    \ to be the identity function. This means that all elements are returned as part\
    \ of the new list. There are many iterable versions of filter available in itertools\
    \ tools.\n\n# Reductions\n\nIn many calculations, you need to do an operation\
    \ that reduces a list of elements to a single value. You can use the 'reduce'\
    \ function to apply the reduction function to each element of an iterable cumulatively.\
    \ For example, if you apply reduction to the list, you would get the (((1+2)+3)+4)+5.\
    \ You can also provide an initial value as an argument. It is used in between\
    \ elements from the iterable, and returns as a default if the iterable is empty.\
    \ You can use a lambda function as parameter to keep your code as tight as possible.\
    \ In this case, it should only take two input parameters.\n\n18 The Python Book"
