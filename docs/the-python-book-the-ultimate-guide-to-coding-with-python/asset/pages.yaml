  md: '# # Get started with Python


    # Variables and data types


    Let''s get in, and make better way than the programmer''s first friend, the ''Hello
    World'' application! Start opening a terminal. Its current working directory will
    be your home directory. It''s probably good to make a directory for the first
    project you will be creating, rather than having them all loose in your directory.
    Create a directory called Python using the command `mkdir python`.


    A variable is a name in source code that is associated with an area in memory
    that you can use to store data, which is called upon the code. The data can be
    one of many types, including:


    | Type | Description |

    |---|---|

    | Integer | Stores numbers |

    | Float | Stores decimal numbers |

    | Boolean | Can have value of True or False |

    | String | Stores a collection of characters, "Hello World" is a string |


    The next step is to create an empty file using the `touch hello.py` command. Our
    expert used the `touch hello.py` command and the first important part of making
    it is writing some code. You can write code inside the hello.py file. We do this
    with the command `nano hello.py`. Once we have file set up, we can run it. Geist
    is a great editor with syntax highlighting that should be available on your distribution.
    You''ll be able to install it using your package manager if you don''t have it.


    As well as many data types, there are sequences (technically, a string is a sequence
    type but some commonly used) we''ve classed it as a main data type:


    Our Hello World program is simple, it only needs two lines. The first line begins
    with a ''#bang'' (the symbol #—also known as a hashtag) followed by the path to
    the Python interpreter. The second line uses the `print` function to output text.
    Both lines need to be interpreted. If you''re running this in an IDE LIKE, you
    don''t necessarily need to do this.


    | Type | Description |

    |---|---|

    | List | Contains a collection of data in a specific order |

    | Tuple | Contains immutable data in a specific order |


    A tuple could be used like a coordinate, containing an x and y value as single
    variable, whereas a list is typically used to store larger collections. The data
    in a tuple is immutable because you''re not able to change values of elements
    in a tuple. In turn, you can change values of elements in a list.


    It is also useful to use Python''s dictionary. A dictionary is a mapped data type.
    It stores data in key-value pairs so you can access elements in the dictionary
    using value''s corresponding key, which is how you would want to do it with a
    list. In a list, you access an element by its index (an integer), but in a dictionary
    you access it by its key.


    It is actually quite easy to write comments in source code. A comment is a note
    that is ignored by the interpreter. You can write a comment on any value that
    needs to be excluded from the code.


    You save the changes you''ve made to the file by pressing Ctrl+O, then Enter.
    Use Ctrl+X to exit.


    ```

    #!/usr/bin/python2

    print("Hello World")

    ```


    > A variable is in source code that is associated with an area in memory that
    you can use to store data


    You can run the Hello World program by fitting the filename with a / in this case
    you type: /hello.py.


    ```

    $[liamiam-laptop Python~$] ./hello.py

    Hello World

    ```


    If you were using a graphical editor such as geist, you would have to do the last
    step of making the file executable. You only have to mark the file as executable
    once. You can then freely edit the file once it is executable.


    # Interpreted vs compiled languages


    An interpreted language such as Python is one where the source code is compiled
    to machine code and then execute the program. It differs from compiled languages
    where the source code is only compiled to machine code once—the resulting machine
    executes the program each times.


    Let''s work on a program to demonstrate how to use various different data types.
    It''s worth noting that Python has many different data types. Feel free to create
    this file in any editor you like. Everything will work as long as you remember
    to make the file executable. We''re going to out variables.'
