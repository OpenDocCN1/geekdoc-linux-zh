    # Instant messaging with Python


    How to program both client, complete with a GUI, server of a simple instant messenger
    in Python


    # Resources


    Here we will be implementing an instant messenger in Python with a client-server
    architecture. This means each client connects to the server, which relays any
    message that one client sends to all other clients. The server will also notify
    all clients when someone joins or leaves the chat. We can work with any TCP socket:
    on the loopback interface, across computers on a LAN, or over the internet if
    you need to configure your router correctly. However, our messages are not encrypted,
    so we wouldn''t recommend them for sensitive information.


    +   - We will also be using threading, which allows a program to do multiple things
    at once.

    - We will cover the basics of writing a simple graphical user interface with GTK,
    as how to interact with it from a different thread.

    - We will touch on the use of regular expressions to parse data from strings.

    - Before getting started, you''ll need to have Python2 installed, as well as the
    PyGTK bindings and the Python2GObject bindings. If you have a system with a fair
    amount of software installed, it will be easier to see if you''re missing libraries
    when you attempt to import them. All the above packages are commonly used, so
    you should be able to install them using your distro''s package manager.


    A computer - running your Linux distribution


    Internet connection - to access documentation


    Python 2.x, PyGTK and GObject


    Writing an instant messenger is an interesting technical problem that covers a
    bunch of areas that may not have come across in programming before:


    +   - We will be employing sockets, which are used to transmit data across networks.'
