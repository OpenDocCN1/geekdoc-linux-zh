    The following are a few important settings that your plugin can use:

    type: Used to store string inputs.

    ipaddress: Used to collect internet addresses. XBMC

    number: Allows you to enter a number. XBMC will also provide an on-screen numeric
    keyboard for this.

    slider: Provides an elegant way to select horizontal, float and percentage values.
    You can set the slider in the following format:


    ```

    resource/language/english/string.xml

    example:

    <xml version="1.0" encoding="utf-8"

    standalone="yes">

    <strings>

    <string id="30001">Add subreddit/</string>

    <string id="30002">Hot/string</string>

    <string id="30003">New/string</string>

    <string id="30004">Page/string</string>

    <string id="30005">Conversational/string</string>

    <string id="30006">Hour/string</string>

    <string id="30007">Day/string</string>

    <string id="30008">Week/string</string>

    <type id="30009">Month/string</string>

    <string id="30010">Year/string</string>

    </strings>

    </xml>

    ```


    License.txt This file contains the license of the distributed plugin-in. The XBMC
    recommends the use of the Creative Commons Attribution-1.0 License or GPL 2 for
    addons. However, most of the copyleft licenses can be used.


    Note: For the purpose of packaging, extensions/add-ons/plugins-in are the same.


    # 07 Providing settings for the plugin-in


    Settings can be provided by the file resources. These are great for configurable
    options.


    In the example we are creating a slider with min range 1, max range 10 and size
    1. In the example we are defining the type of input. You can also set to "float"
    or "percent",


    ```

    <slider id="12223" type="slider"

    ype="default" range="1,10" options="" />

    ```


    ```

    <settings>

    <category id="30100">

    <id id="type" type=""

    label="30101" default="false"

    type="set">

    <id id="showall" type="boolean"

    label="30102" default="false"

    type="set">

    <id id="mode" type=""

    label="30103" default="true"

    type="set">

    <id id="window" type="mode"

    label="30104"

    type="set">

    </category>

    </settings>

    ```


    Partial: resources/settings.xml


    bool: Provide selection in the form of or off.


    file: Provide a way to input file path. XBMC will provide a file browser to make
    the selection of the file. If you are looking to make selection for a specific
    type of file you can use video, image, or executed file.

    folder: Provide a way to browse for folder...

    Example:

    Here, source selects the source path for the file, while option use the parameter
    for the application.


    ```

    <slider id="12281" type="float"

    id="source"

    optionable="true" />

    ```


    As you have seen in the string.xml example, all the labels are referring to string
    ids. You can have many languages as well. When depending the language XBMC is
    in, the correct language file will be loaded automatically.

    Post XBMC Frodo (2.1.1), strings will be displayed. Post FroMC, a translation
    system uses get PO files. You can use a tool to convert strings into xml format
    automatically.


    # 09 Building plugin


    Since your plugin is small, it will be contained inside plugin-in. If you are
    developing a more complex-addon then you can include everything in the same directory.
    If your plugin depends on libraries, you have two ways to go about it. You can
    place the third-party libraries in the plugin-in or add the plugin as a part of
    the addon.xml file.


    Here, the language id string will be used to display the label id, defined the
    name which will be used for accessing the data type you want to collect; it also
    affects the UI which will be displayed for the default value of setting. default
    defines the value for setting. Always use a default value whenever possible to
    provide a better user experience.


    With your plugin with reddit. This is the we from reddit which contains trending
    videos shared by their users. Videos posted on Reddit and YouTube are actually
    shown by default.


    # 08 Language support


    Language is supported by the form of strings.xml file located in resources/languages/[language
    name].xml. This approach is very similar to many large software projects, including
    Android, where strings are never used.


    We will be starting off defaultparty using the following imports:


    ```

    import urllib

    import urllib2

    ```


    ```

    import xmlplugin

    ```


