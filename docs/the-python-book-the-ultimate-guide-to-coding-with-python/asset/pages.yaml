  md: '# Web development


    ![](img/287427b4a3b7d7792fc1ca7834fce232_132_0.png)


    First in 1991, like Google and NASA have been using Python for years


    Thanks to the introduction of the Web Server Gateway (WSGI) in 2003, developing
    Python web apps for general servers became a viable solution as opposed to resorting
    to custom solutions.


    Apple''s implementation of the library greatly differs from the official release.
    Installing Homebrew helps you keep up to date and also means you get the Python
    package manager easily.


    Python executables are widely available from the official Python site at www.python.org.


    Mac users can also benefit from using Homebrew to install and manage their Python
    versions. While OS X comes with a version of Python, it has potential issues.
    Updating regularly clears any downloaded packages, and


    Once Python is installed the first package to download should be virtualenv ''pip
    install virtualenv'', which allows you to create-project environments and run
    on separate versions of Python with project-specific packages. Check out the Hitchhiker''s
    Guide to Python for more information: docs.python-guide.org/en/latest/


    # # Frameworks


    Let''s take a look at some of the frameworks available when developing Python
    applications


    # ## Django djangooproject.com


    GOOD FOR: Large database-driven web apps with multiuser support and sites that
    need to have heavily controllable admin interfaces.


    Django contains many impressive features, all in the interfaces and modules. These
    include an admin interface, database migration tools, ORM, and authentication
    applications. Django allows rapid application development for enterprise-level
    projects, also enabling a clear modular reusable approach to using subapplications.


    # ## Tornado tornadomain.com


    GOOD FOR: Web server connection and long polling due to its ability to scale manage
    vast number of connections


    Tornado is a library that works as a nonblocking web server and web application
    framework. It''s known for its high performance and scalability, originally developed
    for a real-time chat system that served several social media sites. It closed
    in 2015 as its user number had declined steadily, but Tornado remains active and
    useful ever.


    # ## Flask pyloscoo.com


    GOOD FOR: Creating-full-featured REST APIs. Its ability to manage multiple routes
    and methods is impressive


    Flask''s aim is to provide a set of core components such as URL, routing and templates.
    Flask will also work on controlling the request and response objects, all-in-all
    means it is lightweight but powerful framework.


    # ## Pyramid pylonsproject.com


    GOOD FOR: Highly extensible and adaptable to any project requirement. Not a lightweight
    system either


    Heavily focused on documentation, Pyramid brings all the needed support for most
    regular tasks. Pyramid is open source and also provides a great deal of extensibility
    - it comes with the powerful Werkzeug debugger.


    # ## Werkzeug werkzeug.pocoo.com


    GOOD FOR: API creation, connecting databases and following strict URL routes whilst
    HTTP utility


    Werkzeug is the underlying framework for Flask and other frameworks. It provides
    a unique set of tools that enable you to perform URL routing processes as well
    as request and response objects, and it includes a powerful debugger.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_132_1.png)


    # Flask is Fun


    overview // docs // community // snippets // extensions // search


    Flask is a microframework for Python based on Werkzeug, Jinja 2 and good intentions.
    And you ask: it''s BSD licensed!


    Latest Version: 0.1.0


    ```

    from flask import Flask

    app = Flask(__name__)

    ```


