    # # Part two: Add animation and sound to Pivaders


    After writing a Space Invaders clone in 300 lines of Python, now we expand it
    to include animation and sound


    # ## Resources


    +   * Raspberry Pi: [https://www.raspberrypi.org/]


    +   * Python: [https://www.python.org/docs]


    +   * Pygame: [https://www.pygame.org/]


    +   * Opensart: [https://www.opensart.org/]


    that would likely have been obvious at least twofold. Pygame''s ability to group,
    manage and detect collisions thanks to the Sprite class really made a great difference
    to our project, not just in terms of length but simplicity. The v0.1 code listing
    from GitHub via git.io/cbY8tg which we could then draw in v0.2, adding all the
    music and sound effects we used, over at git.io/S9Xw


    # ## 01 Setting up dependencies


    As we recommend with the last tutorial, you''ll get more out if you download the
    code at git.io/cbY8tg which you can use as a reference for your own animations
    and sound for your Pygame projects. Regardless of whether you want to follow along
    or read the walk-through to get a better understanding of basic game creation,
    you will learn some basic dependencies. The two key requirements are Pygame and
    Git, both of which are installed by default on Raspberry Pi. If you''re not sure
    you have them, though, follow the following at the command line:


    Because the rarely defined framework Pygame offers, there are still a thousand
    ways we could have approached animation and sound. We could have created any one
    of the images, or read in a sprite sheet (a single image for all of smaller images)
    which could then draw (or blast) to the screen. For this project we chose animation
    methods in our Game class and opted to use a sprite sheet. Not only is it very
    easy to draw to, but it also keeps the asset count under and keeps performance
    levels up, which is especially important for Raspberry Pi.


    We had fun creating our Space Invaders clone, for the previous tutorial. One of
    the key challenges with the project was keeping it to a manageable size - 300
    lines of Python. Without the use of Pygame''s strong set of features,


    ```

    sudo apt-get install python3-pygame

    ```'
