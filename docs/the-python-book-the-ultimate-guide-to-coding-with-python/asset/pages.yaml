  md: "# # Create with Python\n\n> > To get the ball to move we need to define move(ball)\
    \ for each case where the ball meets a wall\n\n```\n## Breakout game to demonstrate\
    \ Pygame Zero library\n## Based originally upon Tim Viner's Python Django Dojo\n\
    ## demonstration\n## Licensed under MIT License - see file COPYING\n```\n\nfrom\
    \ collections named tuple\nimport pygame\nimport sys\nimport time\n\n```\nW =\
    \ 800\nH = 600\nRED = 200, 0, 0\nWHITE = 200, 200, 200\nGOLD = 255, 215, 0\n\n\
    ball = Rect(W/2, H/2, (30, 30))\ndirection = namedtuple('Direction', 'x y')\n\
    ball_dir = Direction(0, -5)\n\nbat = Rect(W/2, 0.96 * H, (120, 15))\n\nclass Ball(Rect):\n\
    \    def __init__(self, colour, rect):\n        super().__init__(rect)\n     \
    \   self.color = colour\n\nblocks = []\nfor n in range(24):\n    block = Block(GOLD,\
    \ (((n % 8) * 100) + 100), ((n // 8) * 30), (60, 20))\n    blocks.append(block)\n\
    ```\n\n```\ndef draw_blocks():\n    for block in blocks:\n        screen.draw_filled(block,\
    \ block.colour)\n\ndef draw():\n    screen.clear()\n    screen.draw_filled(ball,\
    \ WHITE)\n    screen.draw_filled(bat, RED)\n    draw_blocks()\n\ndef on_mouse_move(pos):\n\
    \    x, y = pos\n    bat.center = (x, bat.centery[1])\n\ndef on_mouse_down():\n\
    \    global ball_dir\n    ball_dir = Direction(ball_dir.x * 1.5, ball_dir.y *\
    \ 1.5)\n```\n\n# 10 Square ball\n\nIn properly retro-graphics-style, we define\
    \ another rectangle - the (30,30) size making it that subset of rectangles that\
    \ we call a square.\nWe're doing this because Rect is an built-in in PgZero. If\
    \ we wanted a circle, we'd have to define a class and use Pygame's draw.circle(surface,\
    \ color, radius) - But Rect can draw directly.\n\n```\nWHITE = 200, 200, 200\n\
    ball = Rect(W/2, H/2, (30, 30))\n```\n\n... to the initial variable assignments,\n\
    \n```\nscreen.draw_filled(rect(ball, WHITE)\n```\n\n... to the draw() block.\n\
    \n![](img/287427b4a3b7d7792fc1ca7834fce232_126_0.png)\n\n# 11 Action!\n\nLet's\
    \ make the ball move. Download the tutorial at pygame.co.uk and then add the code\
    \ below\nball_dir = assignment. Change the velocity (-5) to make the ball slower\
    \ or faster, as your processor (keyboard) demands - but it's better to tell now\
    \ because the ball goes off the screen PgZero if we call the function you define\
    \ once per frame, drawing the illusion of smooth(ish) if you're not running enough.\n\
    \n# 12 move(ball)\n\nTo get the ball moving we need to define move(ball) for each\
    \ case where the ball meets a wall. In this statement we need to handle the collision\
    \ at each edge of Rect. Refer to the full code for snippet.\nThe hardcoded value\
    \ of 781 for the width of the screen, the width of the ball - it's okay to hardcode\
    \ values in early stages, but it is the kind of thing that you will need if your\
    \ project expands. For example, a screen would need a value of W-30.\n\n# 13 Absolute\
    \ values\n\nYou might expect multiplying by minus to work for reversing the direction\
    \ of the ball when it hits the side.\nball_dir = Direction(ball_dir.x * -1, ball_dir.y)\n\
    --- but you need to use abs, which removes any minus signs, then minus:\n\n```\n\
    ball_dir = Direction(abs(ball_dir.x), -abs(ball_dir.y))\n```\n\nTry it without\
    \ the following code and see if it looks strange. Your however is how to work\
    \ out.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_126_1.png)\n\nThe Python Book\
    \ 127"
