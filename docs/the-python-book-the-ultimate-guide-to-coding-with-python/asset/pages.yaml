    # Creating the mine


    In the previous step you found the player''s location on the board. The code `mine
    = random.randint(0, 11)` generates a random number between 1 and 10. Combine this
    with the player''s x position and add the number to the position - this creates
    a mine block on the board.


    ```

    mine_x = int(x)

    mine_y = int(y)

    mine_z = int(z)

    ```


    Use setObject to place the block: `mc.setblock(mine_x, mine_y, mine_z, block)`.
    Using y-1 ensures that the block is on the same level as the board and is hidden.
    The score is the block-ID, which you can change if you wish to see where it connects;
    the mine itself is useful for testing that the rest of the code is working correctly.
    Change it back before you play it!


    # Other Minecraft hacks


    If you enjoy programming and making Minecraft there are many great Raspberry Pi-based
    projects to check out. One example of them we found at tech.co.uk/hacks. The HTML
    blocks before Adventures in Minecraft have some great features check out stuffabloode.com/minecraft/html-blocks.html


    # 08 Create a score


    Each time you remain inside the mine, the score is added to your score. Use `setScore`
    to store the score, setting it to zero when the block is destroyed. Use `postChat`
    to announce the score on the screen as MC cannot place a value to chat, so show
    the score it is displayed.


    ```

    score = 0

    postChat("Score: " + str(score))

    ```


    # 09 Check the player''s position


    Next, you need to check the player''s position and if they are standing on the
    mine. This uses a while loop to check if your player''s position is safe, mine
    game over. The coordinate position is used to build the original board and the
    mine, you have to


    find the player''s position and store it as a new variable - x1, y1 and z1


    ```

    While True:


    x1, y1, z1 = mc.player.getTitlePos()


    time(1)

    score = score +1

    ```


    # 10 One point,


    Now that the player has moved one square they are awarded a point. This is a simple
    action of adding the value to the score value. Use a conditional to compare score
    to 1 if it is inside a loop, it will award one point each time the player moves.


    # 11 The tension increases...


    Once you have awarded the point, the next stage of the game is to check whether
    the block the player is standing on is a safe block if it is lava. Use a conditional
    to compare the block with lava, mine_x, mine_y, position of the mine. If they
    are equal in the next section you will code to


    ```

    if (x1, y1, z1) == mine_x, mine_y, mine_z:

    ```


    # 12 Setting the mine


    In the previous step a conditional checks whether you are standing on the mine
    or a safe block. If it is then lava, place lava blocks, which will fill the player.
    For this, use the mc.setblock code to set blocks between two points. Lava blocks
    are affected by gravity, so setting them higher than the player means they flows
    over


    ```

    mc.setblock(x-5, y+1, z-5, x+2, z+5, 18)

    ```


