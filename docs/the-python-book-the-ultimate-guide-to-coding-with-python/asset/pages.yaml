    \ /django/mysql sudo nano db.py\n$ --manage.py /django/mysql sudo nano urls.py\n\
    $ --manage.py /django/mysql python manage.py sql blog\n```\n\n# 09 Start your\
    \ blog\n\nWe can now take the first steps in creating our blog model. Open is\
    \ simple. Open and change it to django.db import models\n\n```\nclass Post(models.Model):\n\
    \    post = models.TextField()\n    title = models.TextField()\n    author = models.CharField(Max_length=100)\n\
    \    pub_date = models.DateTimeField()\n```\n\nThis creates the Post class, which\
    \ has a subclass that contains your blog text.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_143_1.png)\n\
    \n# 10 Customise your blog\n\nLet's expand the blog model a bit so it remains\
    \ a bit complex.\n\n```\nclass Post(models.Model):\n    post = models.TextField()\n\
    \    title = models.TextField()\n    author = models.CharField(Max_length=100)\n\
    \    pub_date = models.DateTimeField()\n```\n\nA CharField needs to have a character\
    \ limit, and DateTimeField holds the time values.\n\n# 11 Install your app\n\n\
    Your app needs to be installed in the project, which is very simple. Open the\
    \ settings py file again, to the INSTALLED_APPS section and add 'blog'.\n\nThen\
    \ run the following to create the database\n\n```\npython manage.py sql blog\n\
    ```\n\nAnd finally:\n\n```\npython manage.py syncdb\n```\n\n# 13 Let's post\n\n\
    We will test it post:\n\n```\ntest_post = Post()\n```\n\nNow's add the blog content:\n\
    \n```\ntest_post.post = 'Hello World!'ntest_post.title = 'First Post'\ntest_post.author\
    \ = 'Me'\ntest_post.pub_date = datetime.now()\n```\n\nAnd save it with:\n\n```\n\
    test_post.save()\n```\n\n# 12 Set up post\n\nNow we can create a post and test\
    \ our code. First, enter the Python shell:\n\n```\npython manage.py shell\n```\n\
    \n# 14 Start the start-link\n\nTo create the admin site, edit urls from the myproject,\
    \ and uncomment add the following lines:\n\n```\nfrom django.contrib.admin import\
    \ admin\nurl(r'^admin/', admin.site.urls)\n\n```\n\nSave and exit, then edit settings.py\
    \ and uncomment this from INSTALLED_APPS:\n\n```\n'django.contrib.admin'\n```\n\
    \nThe admin site is now at 127.0.0.1:8000/admin/\n\nThen execute commands to add\
    \ all the necessary database data.\n\n```\nfrom blog.models import Post\nimport\
    \ datetime\n```\n\n144 The Python Book"
