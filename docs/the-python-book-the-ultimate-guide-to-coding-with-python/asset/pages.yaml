    ![](img/287427b4a3b7d7792fc1ca7834fce232_21_0.png)\n\n41 Internal variables\n\
    For some programming languages, there is a concept of having variables that are\
    \ only available internally within an object. In Python, there is no such concept.\
    \ All elements of an object are accessible. There is a style rule, however, that\
    \ one can mimic this type of behaviour: Any names with an underscore are expected\
    \ to be treated as private to the object. They are not hidden, however, there\
    \ is no explicit protection for these variables or methods. It is up to the programmer\
    \ to honor the information from the author and not alter any of these names. You\
    \ are free to make these types of changes if it becomes necessary.\n\n```\nFile\
    \ View Search Terminal Help\nPython 2.7.6 (default, Mar 22 2014, 22:59:56)\nGCC\
    \ (2.7.6 on linux)\n>>> help(\"copyright\", \"credits\" or \"license\" for more\
    \ information.\n>>> str1 = \"Hello world\"\n>>> str2 = \"Hello world\"\n>>> str3\
    \ = \"Hello\"\n>>> str1 == str2\nTrue\n>>> cmp(str1, str2)\n0\n>>> cmp(str1, str3)\n\
    1\n>>> str1 is str2\nTrue\n>>> str1 is str3\nFalse\n>>>\n```\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_21_1.png)\n\
    \n43 Slices\nWhile not a command, slices are so important not to mention in this\
    \ list of essential commands. Indexing elements in data structures, like lists,\
    \ is one of the most common things done in Python. You can get a single element\
    \ by giving a single index value. You can get a range of elements by using a start\
    \ and end index with a colon. This returns a new list that you can save in a new\
    \ variable. You can even change the step size, using to skip some number of elements\
    \ from the list. For example, you can get elements from the 'list' with the slice\
    \ ['1::2\\']. This starts at index 1, continues until the end, and steps through\
    \ the index values 2. Slices can be given negative integer values. If you do not,\
    \ they start from the end of the list and count backwards.\n\n# 42 Comparing objects\n\
    \nThere are several ways to compare objects within Python, with several caveats.\
    \ The first is to compare objects by identity and equality. If you are testing\
    \ identity, you want to see if two names actually refer to the same object instance.\
    \ This can be done with the 'is' operator. For example, 'obj1 is obj2'. If you\
    \ are testing for equality, you are testing to see whether the values in the objects\
    \ referred to by the two names are the same. This can be done with the '==' operator;\
    \ as in 'obj1 == obj2'. Testing for equality can become complex for more complicated\
    \ objects.\n\n22 The Python Book"
