    These flags pass up in the code for the player, alien_right within the game class.
    Here we use rect to explain the coordinate and position of the alien image exactly.
    If the alien_right is right and the current position is different from what we
    want, we increase the speed of the alien. If the alien_left is left, we decrease
    the speed. We use self.blit to pos the changes in how the image is displayed.


    # 10 Adding sound


    player_explosion() and alien_explosion() methods are called after the player animation
    in the game class are similar but effects of essentially the same thing. We only
    need to trigger the preset set of sounds then. We only need to see the self_explosion
    flag and the alien_explosion flag are set. The variables, alien_pos, explosion
    and image are different of surface


    # 11 Adding music to


    pygame makes it easy to add audio to a game project. You can find plenty of free
    music on freesound.org and load it using `pygame.mixer.music`. Pygame class.as
    is added by initializing `pygame.mixer`. We can also add and loop the music with
    the code:


    # 12 Using sound effects


    Using sounds is similar to how we do it for images in Pygame. First we load the
    sound using a simple effect. For the laser, the initialization looks like this:
    `self.bullet_fx = pygame.mixer.Sound(''bullet-laser.wav'')`.


    Then we simply trigger the sound at the appropriate time. In the case of the laser,
    we want to play it when we press the space bar to shoot, so after we press the
