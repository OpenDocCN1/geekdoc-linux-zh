  md: "# Work with Python\n\n# Computational science\n\nPython is the best-go-language\
    \ for\ncomputational science\n\nPython has some of the key languages used in science.\
    \ There is a huge number of packages available to handle almost any task that\
    \ you may have, and importantly, Numpy knows when it isn't good at. To deal with\
    \ this, Python has been designed to easily incorporate heavy code from C FORTRAN.\
    \ Numpy can offload any heavy computations to more efficient code.\n\nThe core\
    \ package of the scientific code alone is numpy. One of the problems in Python\
    \ is the object nature of the language which, however, without types, Python always\
    \ needs to check parameters with every operation. Numpy provides a new datatype,\
    \ which helps solve the object problem, because Python knows it can use some optimizations\
    \ to speed up to almost what you can get from writing your code in C FORTRAN.\
    \ The difference is for example, if you wanted to scale a vector by some value,\
    \ like a*b in regular Python, this would look\n\n```\nfor elem in b:\n  c.append(a*b)\n\
    In numpy, this would look like:\n  a*b\n```\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_69_0.png)\n\
    \nLeft: The numpy package makes it simple to visualise your data\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_69_1.png)\n\
    \n# Parallel Python\n\nOne of the powerful features of python (interpreted) is\
    \ that it is built with an event server model. This means that it does manage\
    \ multiple tasks to act as parallel. The framework makes it easy to have these\
    \ other tasks to get going. However, it doesn't run any particular functions that\
    \ you run in the background while you work on something else.\n\nSo, not only\
    \ is it faster, it also also written in shorter code. Along with the new datatype,\
    \ numpy provides forms of all the operators that are most use, like multiplication\
    \ or division. It also provides optimised versions of several functions, like\
    \ the trig functions, to take advantage of this datatype.\nipy is built on top\
