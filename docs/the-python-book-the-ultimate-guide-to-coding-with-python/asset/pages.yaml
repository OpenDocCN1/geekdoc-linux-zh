  md: "# Get started with Python\n\n```\n[liam-liam-top Python]$ ./function_and_scope.py\n\
    This is a test string\nThis is a test string that has been modified.\n```\n\n\
    Scope is important to get the hang of, if you can get it into some bad lists.\
    \ It's a wise quick to program to demonstrate this. It's going to be a Boolean\
    \ variable called count, which will decide if a number will be assigned to a variable\
    \ in an 'if' statement. The variable hasn't been defined anywhere apart from the\
    \ scope of the 'if' statement. We'll finish by trying to print the variable.\n\
    \n```\n#!/usr/bin/env python2\ncount = False\nif count:\n    var = 1234\n    print(var)\n\
    ```\n\nIn the section below, Python will convert the integer to a string before\
    \ printing it. It's always good to deify explicit especially when it comes to\
    \ converting strings. If you try to use the + operator on a string and an integer\
    \ it will be an error because it's not clear what should happen. Python will usually\
    \ add two strings or two integers. Python's string format that we demonstrated\
    \ is a clearer way of doing that. Can you see the problem? Your variable has only\
    \ been defined in the scope of the 'if' statement, which means that we get a very\
    \ nasty error when we tried to access it.\n\n```\n[liam-liam-top Python]$ ./scope.py\n\
    Traceback (most recent call last):\n  File \"scope.py\", line 8, in <module>\n\
    \    print(var)\nNameError: name 'var' is not defined\n```\n\n# Comparison operators\n\
    \nThe common comparison operators are available in Python include:\n\n| < less\
    \ than |\n| <= less than or equal |\n| > greater than |\n| >= greater or equal\
    \ |\n| == equal |\n| != equal |\n\nwhat a variable does. The other thing that\
    \ goes with this is to comment your code. This will help anyone else who reads\
    \ your code, and in the future. It's always good to provide a summary at the top\
    \ of a code file describing what the application does, or a part of the application\
    \ if it's made of multiple files.\n\n# Summary\n\nThis article has introduced\
    \ you to the basics of programming in Python you are getting used to the syntax,\
    \ internal logic and feel of a Python program. The next step is to learn how to\
    \ handle a problem that you want to solve, and break it down into small steps\
    \ that you can implement in a programming language.\n\nGoogle, any search engine\
    \ is helpful. If you are stuck with anything, or have an error message you can't\
    \ work out how to fix, stick to Google and it should be a bit easier to solving\
    \ your problem. Google's first link usually takes us to a Stack Overflow thread\
    \ with a bunch of useful replies. Don't be afraid to get stuck in - the real fun\
