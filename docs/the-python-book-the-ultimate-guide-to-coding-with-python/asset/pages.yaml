  md: "# Django is an incredibly powerful and simple-to-use language\n\n# 15 Setup\
    \ the admin page\n\nThe admin page has a generic, usable template, but you need\
    \ to configure it to view, edit, create and delete posts. Create a new file in\
    \ the blog directory and enter from blog.models import Post from django.contrib\
    \ import admin admin.site.register(Post)\n\n```\nTo have the posts display on\
    \ the site, edit models.py and add\nclass Post(models.Model):\n    def __init__(self):\n\
    \        return self.title\n```\n\n# 22 Format the page\nGo back to the following\
    \ template file, index.html, and add the following html tags:\n{% for post in\
    \ post_list %}\n<h2>{{ post.title }}</h2>\n<p>{{ post.author }}</p>\n<p>{{ post.date\
    \ }}</p>\n{% endfor %}\n\nSave, and run\npython manage.py syncdb\nThe admin page\
    \ is now usable! You should be able to see the other posts, and it's now easier\
    \ to manage.\n\nThis is an example - the post can be in any editor and with tags.\n\
    \n# 18 Start the template\nWe've just written a template that currently exists.\
    \ First need to lock the templates in settings.py.\n\n# 22 Spruce up admin list\n\
    We'll do this in our admin.py or blog directory; follow the following\n\n```\n\
    TEMPLATE_DIRS = [\n'/home/user/projects/templates/',\n```\n\n```\nfrom blog.models\
    \ import Post\nfrom django.contrib import admin\nclass Post(admin.Model):\n  \
    \  list_display = ('title', 'author', 'pub_date', 'the changing fields')\n```\n\
    \n# 19 Write a comment\nHow to write a comment on the site, using our example\
    \ index.html.\n\nadmin.site.register(Post, Admin)\nIn this case 'list_display'\
    \ is a fixed variable.\n\n# 16 Activate the front page\nCreate a copy of the blog\
    \ directory in your directory and add the following\n\n# 23 Aological post list\n\
    The new post list on the site might not be in order or you're comfortable with.\
    \ We'll change how it works in admin.py\n\nurl(r'blog/', blog.urls.include))\n\
    One of the examples in the file will be uncommented and added to this as well.\
    \ It points to a model we will now use.\n\n# 17 Create another url\nYou need to\
    \ create another url in the app directory using urls.py; and add the following\n\
    \n```\nfrom django.template import Context, render loader\nfrom blog.models import\
    \ Post\nfrom django.http import HttpResponse\ndef index(request):\n    post_list\
    \ = Post.objects.all()\n    template = loader.get_template('index.html')\n   \
    \ context = Context({'post_list': post_list})\n    return HttpResponse(template.render(context))\n\
    ```\n\nThis needs to be in a folder with the same name as your app directory.\n\
