  md: '# Use Python with Pi


    # # Handle OpenGL with Pi


    The Raspberry Pi includes a basic GPU. Learn how to use it to generate 2D graphics
    on board


    Many of the examples we have looked at in this column contain programs that run
    on the console. We will be looking at how you can include graphics within your
    Python code. The hardware on the board is quite capable, but to take full advantage
    of this equipment it will be useful to please note that you will want to have
    an actual monitor connected to your Raspberry Pi. If you don''t have one, you
    can connect to your Raspberry Pi over SSH with X11 forwarding. With an X11 server
    on your desktop, you can display on your local machine. To access OpenGL from
    Python, you will need to install the correct package:


    From the Microsoft world, it is essentially DirectX for everything non-Microsoft.
    All the functionality is encoded within libraries written in C, while python-opengl
    provides a set of Python wrappers for easy use.


    The first step in using OpenGL in Python is to import the windowing module. Once
    created, there are several categories of functions available. These are grouped
    under the GLU and GLUT sub-modules.


    ```

    glutDisplayMode(GLUT_RGBA | GLUT_DOUBLE | GLUT_ALPHA | GLUT_DEPTH)

    ```


    The first thing you will need is a window to draw within. Windows need a size
    and a position to define where they should be drawn on the physical screen.


    ```

    glutWindowSize(800, 600)

    glutMinPosition(0, 0)

    ```


    The last step is to actually create the window. This creates a new window object
    and displays it on yours. You can do this with:


    ```

    glut("OpenGL window")

    ```


    ```

    sudo apt-get install python-opengl

    ```


    This is just the beginning. As using built-in distributions such as, we will also
    need OpenGL libraries that can talk to the GPU and handle the 3D operations. For
    those who don''t already know, OpenGL is the open source, multi-platform library
    to handle 3D graphics. To of


    All of the functions you will need be imported to your namespace. One of the most
    useful functions is GLUT to create and draw within them. In order to use it, you
    need to initialize the system:


    ```

    glutInit()

    ```


    # # How to draw 3D scenes on Pi


    ![](img/287427b4a3b7d7792fc1ca7834fce232_157_0.png)


    "But what about 3D? We hear you. Luckily, we have already covered how to handle
    dimensions. The first change is that instead of two coordinates, you have three:
    x, y, and z. The coordinates are what you need to use. You can see that the functions
    two-dimensional are explicitly used in their names. For example, we''ll use functions
    like glVertex2f(). To draw three-dimensional, we will use functions like glVertex3f().


    The essential definitions can be set:


    say you would use:


    ```

    gluPerspective(width, height, depth)

    ```


    ```

    glColor4(r, g, b, a)

    ```


    The first parameter is the field of view, the second parameter is the aspect ratio,
    and the third two are the near and far clipping planes.


    There are other types of transformations, for example if we want to extend the
    rectangle to a cube, we would draw it the same way from vertex to vertex.


    Once we''ve set up the three-dimensional environment, we will project two-dimensional
    objects onto the screen (the floor) so that it looks correct. To do this, we need
    to see it. To see it, luckily, you can move relatively easily. There is a function
    that can rotate the camera to meets with objects. In order to move back,


    ```

    glRotate(1, 1, 1)

    ```


    This takes an angle and x, y, and z coordinates and rotates the mesh by that amount.
    You can then draw it and see the rotated cube.


    158 The Python Book'
