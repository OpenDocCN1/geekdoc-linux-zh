    H = 600\nRED = (200, 0, 0)\nbat = Rect((W/2, 0.96 * H), (150, 35))\nscreen.clear()\n\
    screen.draw_filled(bat, RED)\n```\n\nDavid Ames, who\nused pygame to teach\nyoung\
    \ to code at\nacross the UK,\ntold us to avoid\ncoming when\ncomplex topics like\n\
    OOP (object-oriented\nprogramming) are\npartially encountered\nearly early on\n\
    it it can't be ignored.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_125_2.png)\n\
    \n# 07 Sprite\n\nThe example from the Pong docs expands on thatnActor class, which\
    \ will automatically load the named\nsprite (Pong) which will hunt for a jpg or\
    \ in a subclass\nclass.\nYou loaded the alien from the Pong documentation; use\n\
    l1SM to update the animation shown, but we create a\ndifferent approach in our\
    \ game.\n\n# 07 Breakout\n\nWhile Pong is a stretch of the 1980s - a breakout\n\
    game comes from the 1970s and is a different\ndescendant of the classic arcade\
    \ game. We follow the\nroute from Pong to Breakout (which historically added\n\
    Steve Wozniak and Steve Jobs) in the steps to create\nour code, with the option\
    \ of developing the Pong\nelement into a proper game, as well as refining the\n\
    Breakout.\n\n# 09 Mouse move\n\nWe want to move the bat, and the mouse is closer\
    \ to\narcade paddle that the arrow. Here are the following:\n\n```\ndef on_mouse_move(pos):\n\
    \    x, y = pos\nbat.center = (x, bat.center[1])\n```\n\nUse pygame to test that\
    \ you have a bat, and movement\n\n126 The Python Book\n\n* Weith"
