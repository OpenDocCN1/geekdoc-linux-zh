    # Scientific computing with NumPy


    Powerful calculations with NumPy, SciPy and Matplotlib


    NumPy is the primary Python package for performing scientific computing. It has
    powerful N-dimensional array objects, tools for linear algebra, C/C++ interfaces,
    Fourier transforms and random number capabilities among others. NumPy also supports
    broadcasting, which is a clever way for universal functions to deal with arrays
    of different shapes without making unnecessary copies of the data.


    NumPy also works with Pygame, a Python package for creating games, explaining
    that its use is beyond the scope of this article. It is considered good practice
    to use NumPy arrays before putting them into Python programs. The examples in
    this article are using NumPy or SciPy.


    Apart from its capabilities, the other advantage of NumPy is that it can be integrated
    into Python programs. In other words, you may get your data from a database, output
    of another program, or from a file and process it using NumPy.


