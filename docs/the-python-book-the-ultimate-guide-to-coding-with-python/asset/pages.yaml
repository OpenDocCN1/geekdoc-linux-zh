  md: "# # Web development\n\nOpen index.html. All code executed in a Flask template\
    \ is contained within this. As for our homepage, we want to direct users accordingly.\
    \ So let's check if we've got access (Fig 01).\n\nBetween the ifs and else of\
    \ the template standard if we want to include data for the access token - we can\
    \ just use `{{session.auth))` in the HTML and it will be rendered. Previously,\
    \ in our authorised endpoint, we would display the OAuth values from the header\
    \ of the response. But now that we have a template, we can redirect users back\
    \ out our URL, have a page for them that explains the process we made.\n\n# ##\
    \ 06 Getting lost and found\n\nWith every server, things might get complicated\
    \ and people get lost. How do we handle this? Rather than defining a route, we\
    \ can define a better way that deals with getting lost.\n\n```\npython\n@app.route('/four')\n\
    def four():\n    return render_template('four.html')\n```\n\nIf an endpoint is\
    \ not requested and it returns a 404, then our function will fail to run. In this\
    \ case, we'll create a template that tells the user about it, but we could also\
    \ redirect to another page or dump the error message.\n\n# ## 07 Static files\n\
    \nUsing JavaScript, CSS, and images, how do we keep them? With Flask we can define\
    \ a folder for static content. For Flask, we will create a folder named `static`\
    \ and access files by calling `/static/css/styles.css` or `/static/js/script.js`.\
    \ The resource is accessible in our project.\n\n# ## 08 Let get some tweets\n\n\
    So we know how to build templates, let's get how to display them. In server, we\
    \ define a new route, get-tweets, so\n\n```\npython\n@app.route('/get-tweets<count>')\n\
    def get_tweets(count):\n```\n\nYou'll notice that unlike our other authentication\
    \ endpoints, we made two changes. The first is a standard route definition: it\
    \ will\n\n# # Now we know how to build templates, let's grab some tweets to display\n\
    \nintercept and handle the path-tweets. We define count as a parameter that we\
    \ use as a value in our tweets. By including count in our function definition,\
    \ the function is built so we don't have to check if the value is present before\
    \ we access it. If it is in the URL, it will be returned in the variable `variable_name`.\
    \ For example, we will use it as an integer instead of a string. If the value\
    \ passed to the function is not a specific type, or if count was not an integer\
    \ or string, Flask will return an error.\n\n```\n@app.route('/get-tweets<count>')\n\
    ```\n\n# ## 10 Checking signing and sending our request\n\nWe've built out our\
    \ parameters. So sign our request and then add the signature to the parameters\
    \ (Fig 02). Before we authorise the headers, we need to remove the count and user_id\
    \ dictionary. Since the signature we signed won't be valid unless we achieve this\
    \ with the OAuth tokens, instead of including the parameters we define them as\
    \ query parameters.\n\n# ## 11 Handling Twitter request\n\nNow we're ready to\
    \ get feed from Twitter and send a GET request to it. Here we'll use the JSON\
    \ method we imported. Using the `json.loads` function, we parse the JSON into\
    \ a dictionary that we can access and pass it through our Twitter template.\n\n\
    ```\ntweet_response = json.loads(response.text)\nreturn render_template('tweets.html',\
    \ data=tweet_response)\n```\n\nWhereas, we accessed the session to get data into\
    \ our template, we're now passing a value to our template.\n\n# ## 12 Displaying\
    \ our tweets\n\nLet's now display the tweets now using the index.html, instead\
    \ of using a container, we're going to create a list of tweets that we created.\n\
    \nFirst, we check if we actually received some data from our server. If we've\
    \ got some to render, we're ready to work through it; otherwise, we'll pass it\
    \ through to our template.\n\nAgain, any template logic that we want to use to\
    \ generate our page is included between\n\n```\nif session('auth') == None:\n\
    \    return redirect(url('login'))\n```\n\nAs we have now left is to build the\
    \ parameters for our request (Fig 02). You'll notice that the difference in parameters\
    \ is that characters that are unique to the request for the auth header are added.\
    \ This needs to be a 32-character hexadecimal string containing only the characters\
    \ a-f. If we add the following function to our helper files, we can quickly build\
    \ it for every request.\n\n```\ndef name(size=12, chars='abcdef'-'string_digits'):\n\
    \    return ''.join(random.choice(chars) for x in range(size))\n```\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_139_0.png)\n\
    \n140 The Python Book"
