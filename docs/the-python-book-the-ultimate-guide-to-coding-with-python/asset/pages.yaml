  md: '# 50 Python commands


    # 34 Files


    When dealing with files, you need to create a file object to interact with it.
    The file command takes a string with a name and location to create a file object.
    You can then call the file object methods like ''open'' and ''close'', to get
    data out of it. If you are doing file processing, you can also use the ''readline''
    mode. When opening a file, there is an explicit ''open'' command to simplify the
    process. It takes a string with a name, and an optional parameter that is a string
    which defines the mode. It returns a file object that can be used for reading
    and appending to the file. After opening the file, a file object is returned that
    you can further interact with. You can then read, write to it, and finally close
    it.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_20_0.png)


    # 35 Yielding


    In many cases, a function may need to yield control of execution to another function.
    This is the case with generators. The preferred method for a generator is that
    it will only calculate the next value when it is requested through the ''next()''
    call. The ''yield'' word saves the state of the generator, and returns control
    to the calling function. In this way, the state of the execution is saved and
    the generator picks up where it left off. In fact, you only need to have enough
    memory to store the next needed value, rather than storing all of the possible
    values in memory.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_20_1.png)


    # 36 Weak references


    You need to have a reference to an object, but still be able to destroy it. A
    weak reference is one that can be ignored by the garbage collector. If the weak
    reference refers to an object, the garbage collector will destroy the object and
    reclaim the space for its uses. This is useful in cases where you have a reference
    to an object but you do not necessarily have to keep it in memory. If an object
    that is weakly referenced is destroyed and you try to access it, it will return
    None instead of crashing. You can then delete the object if you decide that this
    is a necessary step.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_20_2.png)


    # 37 Picking data


    There are few different ways to serialize memory data to results. One of these
    is called pickle. Pickle is a module that converts Python objects into a byte
    string. To store this on the hard drive, you can use the dump method to write
    the data out. When you want to read the same data back, you can use the load method.
    It works with any Python object, or even a list of them. It is a simple module,
    but provides a lot of functionality. Since it is written in C, it can be as fast
    as 1000 times faster. One thing to be aware of is that pickle does not store the
    information of the class itself, but only the instance information. This means
    that when you unpickle an object, it may have different methods and attributes
    if the class definition has changed in the interim.


    # 38 Shelving


    While allowing you to save data and retrieve it, it needs some memory management.
    In Python, the shel module handles everything that can be pickled and stored.
    The storage of the data is on the hard drive in the form of a database. When you
    open a shelf, you can read and write data using key-value pairs. When you are
    done, you need to be sure to specify the class of the data that you want to store.
    The data may be stored in the backing database, so it is not best to open the
    relevant files outside of the module in Python. You can also open the shelf with
    writeback set to create out changes.


    # 39 Threads


    You can do multiple threads of execution within Python. The ''thread'' command
    can create a new thread of execution for you. It follows the same technique as
    the process command, but you need to create a thread instead to handle data in
    parallel, with with parameters that need function calls. This is just like POSIX
    threads. That means that everything is the responsibility of the programmer. You
    need to handle locks with the ''lock'' method. When you use a lock, you need to
    ''exit'' it to ensure that it is properly cleaned up and no resources are left
    behind. You can also have fine-grained control over the threads, but it is to
    set the class status for each needs.


    The Python Book 21'
