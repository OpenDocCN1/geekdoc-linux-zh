  md: "# Work with Python\n\n# Web development\n\nPython has server frameworks available\
    \ for all of your various web development tasks. We will look at some of the more\
    \ popular ones\n\nWith the content and the bulk of computing hosted on a server,\
    \ an application can better guarantee a consistent experience for all users. The\
    \ popular Django framework provides a very complete environment of plugins and\
    \ is built on the DRY principle (Don't Repeat Yourself). Because of this, you\
    \ should be able to build your application very quickly. With \"pip install django\"\
    , most distributions will have a package for Django ready to go. Depending on\
    \ what you want to do, you may need to install a database like MySQL or postgresql\
    \ to store your application data.\n\nThere Django utilities to automatically generate\
    \ a starting point for your new project's code:\n\n# django-admin startproject\
    \ new\n\nThis command creates a file named \"manage.py\". The file contains several\
    \ useful functions you can use to manage your project. The newly created directory\
    \ contains the files \"init__.py\", \"urls.py\" and \"settings.py\". These files\
    \ and the directory reside in your project root. The web server can be found in\
    \ the settings.py file. The URL declarations, basically a table of controllers\
    \ for your sites, are stored in the urls.py file for WSGI-compatible web servers.\n\
    \nOnce your application is done, it should be hosted on a web server. This is\
    \ next in the process of developing your web application. To find out, Django\
    \ has a web server built into it. You can start by navigating to the \"newsite\"\
    \ directory and running the following command:\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_67_0.png)\n\
    \nLeft Python interpreters work your databases to power a web\n\nBottom The Model-View-Controller\
    \ architecture is used for Uis\n\n# python manage.py runserver\n\nThis will start\
    \ up a server to listen on port 8000 on your local machine. This built in server\
    \ is designed to be used for development, it automatically updates your Python\
    \ code for each change. This means that you don't have to restart the server.\n\
    \nAll these steps get you to a working project. You are now starting to develop\
    \ your applications. Within the \"newsite\" subdirectory, you can create\n\n#\
    \ python manage.py startapp new\n\nThis will create a new subdirectory named \"\
    newapp\", with the files \"models.py\", \"tests.py\" and \"views.py\", among others.\
    \ The simplest view consists of the\n\n```\nfrom django.http import HttpResponse\n\
    def index(request):\n    return HttpResponse(\"Hello world\")\n```\n\n# Virtual\
    \ environments\n\nThis isn't enough to make it available, however. You also need\
    \ to create a URLconf for your use. If the file \"urls.py\" doesn't exist, then\
    \ add the following code:\n\n```\nfrom django.conf.urls import url\nfrom . import\
    \ views\nurlpatterns = [url(r'\\'/', views.index)]\n```\n\nWhen you start developing\
    \ your applications, you may need a different version of Django. Several Python\
    \ packages have their own dependencies. This is a great thing, but also you might\
    \ have to have virtual environments for each of them.\n\nThe last step is to create\
    \ the virtual environment for each project. You can do this with code\n\n```\n\
    from django.conf.urls import include, url\nfrom django.contrib import admin\n\
    urlpatterns = [url(r'\\'/new\\',\n    include(\\'settings.py\\'))]\n```\n\nYou\
    \ can create new environments for each of your projects with this, and be sure\
    \ to capture all of the dependencies for your own package.\n\n| MODEL | |\n|---||\n\
    | Manipulates | Updates |\n| VIEW | CONTROLLER |\n| Sees | Uses |\n\n68 The Python\
