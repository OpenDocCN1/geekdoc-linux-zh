  md: "# Web development\n\n(%*) This time we're creating a loop; inside the loop\
    \ we will be able to access any property we want of that object in it. In this\
    \ template we're going to create a div element for each tweet we received and\
    \ display the user's profile picture. In template we can access properties using\
    \ dot notation or with brackets ([]). They behave largely the same; however, brackets\
    \ check for an instance in the dictionary or object defined and look for an item\
    \ by name. If either cannot find the parameter specified undefined then this occurs,\
    \ the template will not throw an error, it will simply render an empty string.\
    \ If this is in your mind then you've probably misidentified the property you're\
    \ trying to access. In Python, we need to tell the template where loop and if\
    \ else elements stand, so we do that with (% end%) and (% endif %).\n\n```\ntweetParams\
    \ = {\n  \"oauth_consumer_key\": \"consumer_key\",\n  \"oauth_nonce\": helpers.nonce(),\n\
    \  \"oauth_signature_method\": \"HMAC-SHA1\",\n  \"oauth_timestamp\": int(time.time()),\n\
    \  \"oauth_version\": \"1.0\",\n  \"oauth_token\": session['oauth_token'],\n \
    \ \"user_id\": session['user_id'],\n  \"count\": str(count)\n}\n```\n\nFig 02\n\
    \n```\ntweetRequest = tweetRequest(tweetParameters, \"GET\",\n\"https://api.twitter.com/1/statuses/user_timeline.json,consumer_secret,consumer_secret\"\
    )\n```\n\nFig 03\n\n```\ntweetParameters['oauth_signature'] = tweetRequest\nmakeRequest\
    \ = tweetRequest(\"https://api.twitter.com/1/statuses/\" + tweetParameters['count']\
    \ + \"?user_id=\" + tweetParameters['user_id'])\")\n```\n\n+   13 Flask filters\n\
    Python when parsing, JSON, can generate erroneous characters that don't render\
    \ properly in HTML. You may notice that text() is forescape. This is an example\
    \ of a filter; it does affect the input before we render it - it's escaping the\
    \ quotes for us. There are many different built-in filters you can use with Flask.\
    \ Your advisor recommends a full reading of list of the potential options.\n\n\
    ```\ndel = tweetParameters['user_id'], tweetParameters['count']\n```\n\n```\n\
    makeRequest_add_header(\"Authorization\", headers.create_auth(\nheaders(tweetParameters)))\n\
    ```\n\n```\ntry:\n  response = urllib2.urlopen(makeRequest)\nexcept urllib2.HTTPError,\
    \ e:\n  return response(e)\n```\n\n+   14 Wrapping up\nThat's pretty much for\
    \ templating with Flask. It's insanely easy to build and deploy simple applications.\
    \ Flask is great for any Python developer looking to run a web service. We used\
    \ Twitter to demonstrate Flask's power, all of the features described can be used\
    \ with any third-party service or database resource. Flask with other rendering\
    \ engines, such as Jinja2, still needs to be present to run Flask and conflicts\
