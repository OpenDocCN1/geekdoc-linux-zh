    # 03 The dashboard


    Once registered and logged in, visit the dashboard page, which will display your
    AccountSid and your Auth Token. These are required to use the Twilio REST. Keep
    them secure and private, but be sure to make a note of what you will need for
    your Twilio program.


    # 04 Install the software


    Before installing your Raspberry Pi and connecting to the Internet, it is worth
    upgrading and updating your Pi. In the LX Terminal, use `sudo apt-get update`,
    then `sudo apt-get upgrade`. Use `sudo apt install twilio` or `pip install twilio`
    to install. If you need to install pip, use `sudo apt install python-pip`, then
    `pip install twilio --user`.


    # 05 Twilio authentication


    Now you are ready to create the SMS to your mobile phone. Use Python to import
    the Twilio REST libraries (see below). Next, add your AccountSid and Auth Token,
    replacing the X with your own, and you will proceed with:


    ```

    from twilio.rest import TwilioClient

    account_sid = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    # Your Auth Token

    auth_token = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    # Your Keys

    client = TwilioClient(account_sid, auth_token)

    ```


    # 06 Create your message


    You will be able to send more than one text message by creating a new variable
    in your code called message. This will prompt you to enter the phrase that you
    want to send to the mobile phone. When the program runs, it will send the message
    that be:


    ```

    message = input("Please enter your message")

    ```


    Above You will be able to find your AccountSid and your Auth Token on Twilio


    # 07 Add your numbers


    To send, you will need to add the code below and your phone numbers. The first
    number is your mobile phone number, which is registered and validated with Twilio
    (Step 2). The second number is your Twilio account number, which can be retrieved
    from your dashboard page. Change the Sandbox number to your country code and remainder
    it to the international code.


    # 08 Send your message


    When you send the message, the code below is not required, but useful to indicate
    your message has been sent. Add the lines and send your function. Ensure your
    Raspberry Pi is connected to the Internet and that it is, then run your program.
    You have just texted from your Raspberry Pi!


    ```

    message = client.messages.create(

    from="+44TWILIONNUMBER",

    body=message

    )

    ```


    ```

