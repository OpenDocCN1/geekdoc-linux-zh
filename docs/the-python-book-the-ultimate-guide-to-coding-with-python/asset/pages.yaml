    | spide Simple python editor | 5 |


    05 Start the development server

    Django comes with a lightweight development server to it work locally. You can
    also use it to check your work, so cd to the myblog folder and then use: `python
    manage.py runserver`


    If all goes well, it should return zero errors. Use Ctrl+C to exit well.


    03 Verify Django

    To make sure Django is installed properly, and that you have the right version,
    enter the Python shell by typing ''python'' and enter


    ```

    import django

    print(django.get_version())

    ```


    It will return a version number if it has installed correctly, which should be
    1.


    01 Install Django

    Django is based on Python, and it is to be developed on Django. Python 2.7 is
    the recommended version, and this is installed with the python package. If you
    want to check your version, start the Python shell by typing ''python'' into the
    terminal.


    06 Configure the database

    The Django settings are kept in the settings.py file. Open it with your favourite
    editor and go to the Databases section. Change ENGINE


    Save and exit.


    02 Install Django

    Most operating systems have a Django package available in the repository, python-django
    in Debian. If you have a list of tuple finding it, or you could build it from
    source. Make sure you install version 1.3.


    07 Create the database

    The database file will be generated by using the command:


    ```

    python manage.py migrate

    ```


    During the process, it will ask you to set up a supervisor, which you can do now.


    The SQLite database file will be created in myblog folder.


    04 Start a new project

    In the terminal, cd to the folder you want to start the blog in, and run the next
    command:


    ```

    django-admin startproject myblog

    ```


    Here, ''myblog'' can be replaced by whatever you want to name the project, but
    we''ll use it for the upcoming examples.


