  md: '# Create a two-step

    authentication with Twilio


    Increase security in access to your web services

    by building a simple two-step authentication

    with Twilio''s SMS APIs to help you


    # Resources


    +   Python 2.7+

    Flask 0.10.1

    Flask-github:

    A Twitter account:

    Twilio''s Python

    API Library:

    MySQLDB:


    Telephony is one of the most versatile

    ologies in our households. Despite being

    invented over 100 years ago, it still carries

    the infrastructure to deliver a multitude of

    voices to people to deliver media content

    at incredible speeds. As is often the case

    of wonderful things, they can also be

    leveraged for much more than our

    today lives daily than ever. So, what can we

    d use for some of that technology?

    Well, we can use an API. Twilio has

    created a RESTful API that others use

    great deal of that complexity so that we

    can write apps and are able to

    deliver calls and SMS messages using

    various endpoints and services. In

    this tutorial, we''re going to look at Twilio

    to help us create the Flask app for a

    authentication system for logging into.

    We''re also going to use Flask to help

    create our routes and generate our pages,

    nof Flask''s detail will be covered here.


    # 01 Get a Twilio account and

    phone number


    Signing up to Twilio is pretty easy. First, head

    over to http://twilio.com and click the ''Signup''

    Button. At this point it doesn''nt really differ from any other service,

    but after you''ve entered an email address and

    phone number to confirm

    Given the nature of Twilio API, it makes sense

    for them to ask whether to confirm

    that you are human, and

    then send you a text to confirm

    that. A two-step authentication is

    exactly we''re working towards.


    You can enter any code you received access

    to be a token to confirm you are

    present, but at this point we will be

    authenticating using a phone that can

    receive a text message from your

    number, you''ll receive a text to phone

    er it''ll be presented

    a a phone number. This is your Twilio

    phone number and we will be using to send and receive

    cour authentication texts.


    ![](img/287427b4a3b7d7792fc1ca7834fce232_107_0.png)


    # 02 Add credit


    Just like a mobile phone, out is

    free to use. Although it is not

    inoperative. code will need to

    add a card and some funds to your

    created Twilio account. On the main page of the

    dashboard, you''ll see a big blue box asking

    to upgrade your account and

    follow the instructions to add a card

    and the amount of credit you would like to use.

    The minimum amount of $10 (or more) will

    be more than plenty for this and other projects.

    Once that''s done, you''re already ready to start

    sending text messages—but first head back

    over the Twilio dashboard and copy your

    account SID and auth token to down somewhere,

    you''ll need those little later.


    ■ The Twilio interface is kept nice and simple – no complications here'
