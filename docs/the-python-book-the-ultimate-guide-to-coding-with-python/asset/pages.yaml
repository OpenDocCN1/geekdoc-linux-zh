    # # Create a Minecraft Minesweeper game


    Use your Raspberry Pi and Python knowledge to code a simple mini-game in Minecraft


    # ## Resources


    ### Jessie or Raspian:


    [raspberrypi.org/downloads](https://raspberrypi.org/downloads)


    You may remember or have even played the classic Minesweeper PC game that originally
    dates back to the 60s. Over the years it has been bundled with many operating
    systems, and featured as a mini-game within-Super Mario Bros.


    # ## 01 Update and install


    To update your Raspberry Pi, open the terminal and type:


    ```

    sudo apt-get upgrade

    sudo apt-get update

    ```


    The new Raspberry Pi OS already installed. The Minecraft API which enables you
    to interact with Minecraft using Python is also pre-installed. If you are using
    an old OS version, we would highly recommend downloading and then updating your
    version to either the most recent Jessie or Raspian-images.


    This project will walk you through how to create a simple version in Minecraft
    Minesweeper which will a program that sets out an area of blocks and turns one
    of these into mines. To play the game, guide your player around the board. Each
    time you stand on a block you identify and collect points, but watch out for the
    mine as it will end the game and you will lose!


    12 The Python Book'
