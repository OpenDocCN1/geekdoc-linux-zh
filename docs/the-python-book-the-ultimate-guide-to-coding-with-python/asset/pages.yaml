  md: "# # Get started with Python\n\n> TIP\n\nYou can define defaults for variables\
    \ if you want to be able to call the function without passing variables at all.\
    \ You do this by putting an equals sign after the variable name, for example `def\
    \ my_function(string='default'):`\n\n```\n# Or with a while loop:\nprint(\"using\
    \ a while loop\")\n# We already have the total above, knowing the len function\
    \ is very\n# useful:\ntotal = len(ints)\ncount = 0\nwhile count < total:\n   \
    \ print(str(ints[count]))\n    count = 1\n```\n\n# ## Functions and scope\n\n\
    Functions are used in programming to break processes into smaller chunks. This\
    \ makes code much easier to read and reassign in certain ways. Functions can have\
    \ variables. Variables in Python are passed by value, which means that a copy\
    \ of the variable is passed inside the function that is only valid in the scope\
    \ of the function. Any changes made to the variable inside the function will be\
    \ discarded. However, functions can also return values, so this isn't an issue.\
    \ Variables are defined with the `return` keyword in the name of the function.\
    \ Multiple variables are separated by commas. The name given to the variables\
    \ in these brackets are the\n\nthat they have outside the scope of the function,\
    \ regardless of what the variable was passed to the function. Let's see this\n\
    \nThe output from the program opposite is as follows:\n\n# \"Functions are used\
    \ in programming to break processes down in\"\n\n```\n#!/usr/bin/env python 2\n\
    \n Below is a function called modify_string, which accepts a variable\n# that\
    \ will be called called in the scope of the function. Anything\n# indented with\
    \ 4 spaces under the function definition is in the\n# scope:\ndef modify_string(original):\n\
    \    original += \" has been modified.\"\n# At the moment, only the local copy\
    \ of this string has been modified\n\ndef modify_string_return(original):\n  \
    \  original += \" has been modified.\"\n# However, we return our local copy to\
    \ the caller. The function\n# ends as the return statement is used, regardless\
    \ of where it\n# is in the function.\n    return original\n\ntest_string = \"\
    This is a test string\"\nndef modify_string(test_string):\nprint(test_string)\n\
    \ntest_string = modify_string_return(test_string)\nprint(test_string)\n\n# The\
    \ function's return value is stored in the variable test string,\n# overwriting\
    \ the original and therefore changing the value that is\n# printed.\n```\n\nWe\
    \ are now outside of the scope of the function, modified string, as we have reduced\
    \ the level of indentation\n\nThe test string won't be changed in this code\n\n\
    However, we can call the function like this"
