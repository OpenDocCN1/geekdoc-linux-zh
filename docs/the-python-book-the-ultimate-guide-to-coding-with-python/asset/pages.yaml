    \ have objects that have no references to them. One example of this is the lambda\
    \ expression. With this, you can create an anonymous function. This allows you\
    \ functional programming techniques within Python. The lambda expression is very\
    \ powerful; for example, you can build your own function to square a number with\
    \ `lambda x: x**2`. You can then have a function that programmatically create\
    \ new functions and return them to the calling code. The only limitation is that\
    \ they are limited to a single expression, so you can't generate complex functions.\n\
    \n# Compiling code objects\n\nPython is an interpreted language, which means the\
    \ source code that you write needs to be compiled into a byte code. This byte\
    \ code gets fed into the actual Python engine to step through instructions. Within\
    \ your program, you may have the need to take over the process of compiling code\
    \ and running the results. You might want to build your own REPL. The `compile()`\
    \ function takes a string or a collection of Python code and returns an object\
    \ that represents a byte translation of this code. This new object can then be\
    \ handled in either 'eval' or 'exec' to be compiled. The 'single' mode is a simple\
    \ expression, 'eval' is a simple expression and 'exec' is a code block.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_22_0.png)\n\
    \n# init_method\n\nWhen you create a new class, you can include an initialisation\
    \ method that gets called when the new object is created. This method is useful\
    \ when the new object needs some data loaded in the new object.\n\n# del_method\n\
    \nWhen an object is about to be destroyed, the `del` method is called. This gives\
    \ you the opportunity to release resources that may be required. This might be\
    \ closing files, or disconnecting connections. After the object is destroyed,\
    \ resources are freed.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_22_1.png)\n\
    \n# Exiting your program\n\nThere are two ways to exit available to the Python\
    \ interpreter (`exit()` and `quit()`). Each takes an optional integer parameter\
    \ which sets the exit code for the program. However, it is better to use the exit\
    \ function from the sys module (`sys.exit()`).\n\n# Return values\n\nA function\
    \ can return a value to the calling function. Because essentially no function\
    \ has a type signature, you must use the `return` command to return any object\
    \ to the caller.\n\n![](img/287427b4a3b7d7792fc1ca7834fce232_22_2.png)\n\n# String\
    \ concatenation\n\nWe will finish with what most lists – string concatenation.\
    \ The easiest way to build up strings is to use the `+` operator. If you want\
    \ to include other items, like numbers, you can use the `str()` casting to convert\
    \ it to a string object.\n\n# 3 About Python\n\nThe Python Book 23"
