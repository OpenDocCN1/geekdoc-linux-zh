  md: '# Work with Python


    # Robotics and electronics


    Robotics is the most direct interface between your code and the real world around
    you


    Robotics is the most direct way that your code can interact with the world around
    you. You can read actual sensor information and move actuators and get real-world
    results.


    The thing your robot needs is the ability to sense the world around it. The one
    sense that we humans feel most of is sight. With web cameras being so easy to
    connect to hardware, vision is easy to give to your robot. The problem is how
    to interpret this data. Luckily, you can use the OpenCV project to do that, it
    can provide simple image gathering and processing, extremely complex functions
    like recognition and extraction of 3D objects. You can identify and track objects
    moving through your field of view. You can also use OpenCV to give your robot
    reason capabilities. OpenCV includes sets of


    ![](img/287427b4a3b7d7792fc1ca7834fce232_71_0.png)


    machine learning, you can do statistical classification or clustering, and use
    it to feed decision trees or neural networks.

    Another sense that you may want to use is sound. The jasper project is developing
    a complete voice control system. This project would give your robot the ability
    to listen and respond to your verbal commands. The project has the point to where
    you can give it a command and the voice recognition software can build a mapping
    of text content to what commands to execute.

    There are also other sensors you could use, that begins to learn the realm of
    store-bought hardware. With other sensors like temperature, pressure, or location,
    needed hardware that needs to be interfaced with the computer brain for your robot.


    # Arduino


    > Contrast to the Raspberry Pi, which runs all from its OS, the Arduino boards
    are microcontrollers with no operating system. Instead of computers, Arduino uses
    platform code that you write. Then you need to interface it with hardware. It
    is mainly used to interface with sensors and servos, and devices such as LEDs,
    and motors. Arduinos are widely used to build a powerful complement to the Pi.


    # Raspberry Pi


    While we haven''t decided what kind of computer to use for your projects, you
    should consider the Raspberry Pi. This is a tiny computer that is small enough
    to fit into any project you might be building. Since it is always running Linux
    and Python, it is easy to simply copy your code it. It also has its own IO bus
    so that you can have it read them


    While you could write some code on a standard computer and a Linux distribution,
    which is not optimal when trying to use python for a project that needs all the
    data processing dealing with real events, a dedicated operating system - The Robot
    Operating System (ROS) is designed to provide the type of interface between hardware
    and software. One of the most powerful features of ROS is that it is designed
    to facilitate communication. You can run it on one computer, or over multiple
    connected over network that is protected from all other processes, ROS is more
    of a graph of messages being passed between them.


    # ROS - Robot Operating System


    Because ROS is a complex operating system, rather than all is enough to think
    that you can use it in Python. It is better to write your Python code that can
    be used in ROS. The design of this system is to be flexible and scalable. This
    means that your code should be clean and not particularly concerned with where
    you are running it or who it is talking to. Then, it can be used within any graph
    among ROS nodes. There are plenty of libraries available that allow you to coordinate
    tasks, visualize where sensors or limbs are in space. There is a library for vision,
    for data processing, and another for creating and managing the state that can
    be shared among ROS processes. For extremely time-sensitive tasks, there is a
    plugin library that allows you to write a C++ plugin that can be loaded with ROS
    processes.'
