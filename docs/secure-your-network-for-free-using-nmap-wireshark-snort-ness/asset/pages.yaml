  md: '# CERT Team


    When the network is impacted by a crisis, you need a group of highly knowledgeable
    and skilled individuals who can react to the crisis and direct the response efforts.
    The crisis could take any number of forms, from events such as a power outage,
    a virus outbreak, or a denial of service attack. This group is typically called
    a Computer Emergency Response Team (CERT) or a Computer Incident Response Team
    (CIRT). The size of this group could vary depending on the size and needs of your
    organization. The CERT team should meet regularly and review any outstanding security
    issues. This group will monitor security notification lists so that the organization
    can be aware of security issues in a timely fashion. When an issue arise, the
    CERT team will meet and make an assessment of the threat and then call in the
    appropriate resources to deal with it. This could simply mean calling in the “IT
    guy,” notifying a law enforcement agency, or flying out a security expert to address
    the issue.


    Because the CERT team is responsible for halting or minimizing the damage from
    an emergency, it is typically backed by the highest level of management. This
    backing generally includes access to significant resources if that is what is
    necessary to get the job done. While a small organization might not have a group
    of people make the CERT team per se, you do want to consider some steps to be
    prepared. There should be a plan in place so that people know who to call if something
    goes wrong. The first contact person should be someone who can make a judgment
    call about technical issues and how severe the emergency truly is. Employees should
    be educated so that they can make an educated determination of when a computer
    emergency is occurring.


    The following is a list of some of the widely used notification services. You
    may want to consider signing up for some of these so you can stay ahead of the
    information curve. While some offer alternate of notification, the most common
    one is a mailing list, in which case you will receive all the e-mails sends to
    the list. Sorting the e-mails can consume some time, but if you really want to
    be ahead of the game it''s worth it. You can be sure that the hackers are using
    these services so they know about the new vulnerabilities as soon as possible.
    They are often counting on knowing them before the security administrator for
    a company.'
