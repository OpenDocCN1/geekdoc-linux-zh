    for more information on the bug with secedit.


    # Account Lockout Policy


    Now that you are familiar with GPOs and how to apply them, we will discuss a few
    policy settings that you may want to consider implementing, either at the domain
    level or with local GPOs.The account lockout policy(\Computer Configuration\Windows
    Settings\Security\Account Policy\Account Lockout Policy) allows you to configure
    the number of incorrect passwords that a user can enter before being locked out
    of an account, how long the account stays locked out, and how long the lockout
    counter resets. The following recommended settings will provide the most security
    in an average environment:


    +   - Account Lockout Duration represents how long the account will stay locked
    out. Setting this to zero means that the account will stay locked out until an
    administrator manually unlocks it. This is the most secure option. However, even
    allowing the account to reset after as little as 10 minutes will serve to slow
    down a hacker who is attempting to force the password.


    +   - Account Lockout Threshold represents how many invalid passwords a user can
    attempt before locking out the account. A setting of three invalid logon attempts
    is usually considered adequate. If the number is too low, a simple typo could
    result in an account being locked out. If this is set to 0 (insecure), the account
    will never be locked out.


    +   - Reset Account Lockout Counter After determines how long before the invalid
    attempt counter is reset. The default setting of 30 minutes is usually adequate.
    A longer setting is considered secure.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_174_0.png)'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Chapter 3 • Protecting Network Resources


    Figure 3.9 shows the account lockout policy setting and MMC console.


    # 3.9 Account Lockout Policy


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_175_0.png)


    # Audit Policy


    Chapter 5 covers the specific settings for controlling various aspects of your
    auditing settings. Don''t forget that the audit trail you configure can help you
    catch a hacker, and sometimes help you troubleshoot issues. Having extensive auditing
    of failed access attempts, for example, can help you isolate a rights issue that
    is keeping software from properly running. Refer to Chapter 5 when configuring
    your policy for auditing.


    # User Rights Assignment


    The list of configurable events under user rights assignments is extensive. These
    settings (Local Policy\Computer Configuration\Windows Settings\Local Policies\User
    Rights Assignments) allow you to configure what users (including the accounts
    processes run) can do. Many of these settings are used only in unusual circumstances
    to allow particular software to run. Rather than elaborate on all of the specific
    settings in this category, we will examine only the most significant configurable
    events and recommend the most secure settings for the majority of environments:


    www.syngress.com'
  merge: -1
  pgno: 175
- img_proc: true
  md: '+   * Access This Computer from the Network. You can safely set this to Authenticated
    Users and remove all other access. You should make certain that ANONYMOUS LOGON
    is not in the allowed list. In some cases it is more secure to remove the ability
    to log on locally for normal users. For example, a nonadministrator account has
    no reason to need to log on to your domain controller.


    +   * Act As Part of the Operating System. It allows a user to impersonate any
    other user on the system without authentication. This would pose a huge security
    risk, and would render your other auditing events meaningless. If an application
    needs this type of access to function properly, it should use the LocalSystem
    account, which includes this access by default.


    +   * Bypass Traverse Checking. This setting allows a user to navigate through
    directory entries even if the user does not have access to a directory. It does
    not allow the user to list the directory contents of a directory to which he does
    not have the appropriate rights. You should set this to Administrators Only.


    +   * Change the System Time. While the time might not be important at first glance,
    setting it incorrectly can create a huge security hole. If you do not set the
    time correctly, certain encryption systems such as IPsec will fail. Further, it
    becomes impossible to accurately correlate event logs, and critical transactions
    could fail, causing a denial of service for legitimate traffic. You should set
    this setting to Administrators Only.


    +   * Create Token Object. This setting allows an account to create a token that
    can be used to gain access to any system resource. You should not need to set
    this right manually on any account. If you need this right, you should assign
    it to the LocalSystem account.


    +   * Debug Programs. This right will allow a user to attach a debugger to a process
    which, in turn, will give the user access to many sensitive internal resources.
    You should assign this right with great care. Usually you will not need it on
    a production host anyway.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '+   Deny Access to This Computer from the Network. This should include the
    local Administrator account. There is no legitimate need for the local account
    to access the system over the network.


    +   Deny Logon as Batch Job, and Deny Logon as Service. You should set both of
    these to the local administrator. By doing this, you ensure that if the local
    Administrator account is compromised, the attacker will not be able to immediately
    install a service or batch job to further compromise system security.


    # Security Options


    This group of settings is also extensive (Local Computer Policy\Computer Configuration\Windows
    Settings\Security Settings\Local Policies\Security Options) and offers important
    security settings that impact the entire system, instead of individual accounts.
    For most of these settings, the purpose and function will be fairly obvious, but
    a brief description should hopefully clear up any lingering doubts. The following
    list represents the settings that are the most important for your systems:


    +   Do not display username in logon screen. You should set this to Enabled. By
    displaying the user to log on, you are giving any attacker that can get to logon
    screen a first clue as to what a viable account name might be. This may not prevent
    attempts by attackers who have done some reconnaissance, but will not provide
    50 percent of the credentials to be available to the casual attacker.


    +   Message text for users attempting to log on. You will see this message when
    someone attempts to log on the console directly (after entering Ctrl + Alt + Delete).
    This setting, also known as the logon banner, gives legal protection against unauthorized
    access. Fill this in with a message stating that only authorized users should
    be accessing the system. Your organization''s IT security and its legal department
    should work together to develop a suitable message. The purpose of this message
    is primarily to remove attackers'' claims that they didn''t know they were doing
    anything wrong.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Protecting Network Resources • Chapter 3


    +   Message title for users attempting to log on. This is the title for the preceding
    message. Something suitably ominous such as “Warning” or “Authorized Users Only”
    should be adequate. Consult your local department to be safe.


    +   Number of previous logons to cache (in case domain controller is not available).
    If this is a stand-alone server, there should be no credentials to cache and you
    can set this to zero (which disables caching). Even if you are using domain authentication
    on your bastion host, the most secure setting is a setting of 0.


    +   Rename Administrator account. As mentioned earlier, the local Administrator
    account is the most popular user account for attack. Changing this account name
    to something other than the default can prevent the success of some automated
    attacks, such as an automated password-cracking attack against the local Administrator
    account. You should avoid any obvious alternatives, such as “Admin” or “root.”


    +   Rename Guest account. For the same reasons as the Administrator account, you
    should select this option as well. The Guest account has few privileges, it can
    still provide a local logon account and act as a first step toward elevating an
    attacker’s privileges. Code Red, for example, adds Guest to the local Administrators
