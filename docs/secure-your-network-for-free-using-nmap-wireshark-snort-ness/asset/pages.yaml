- img_proc: true
  md: 'to the appropriate parties for peer review and critique by the subject matter
    experts. When considered final, they should require written approval by senior
    management. In this way you can ensure that your policies don''t become outdated
    and lose their value. As with most changes, there should be some mechanism in
    place for implementing changes to policy and standards in an expedited fashion
    in the event of some emergency.


    # Physical Security


    In many instances, physical security is overlooked, especially in a smaller organization
    where such concerns are often considered too unlikely to worry about the environment.
    Physical security can include any security risks related to your servers in your
    front lobby, I would probably consider them insane. However, I have seen many
    small businesses where the network equipment was in a closet with the door consistently
    popped open to provide ventilation. This is fine if you can ensure only authorized
    individuals have access to the area the closet is in, but that is that this is
    rarely the case. Cleaning personnel and other support staff often have unrestricted
    access to sensitive systems. It may sound farfetched, but if one of those personnel
    had the know-how, how hard would it be for him or her to get to your most sensitive
    data? What if, a bucket of water were accidentally dumped on the server that was
    key to your business?


    If you give it some careful thought, you may realize physical security of a site
    should be regularly reviewed and any weaknesses addressed. In some cases, the
    solution may be a simple change of process or policy; in some others, new equipment
    may be needed. When reviewing the physical security, consider whether or not someone
    can gain unauthorized physical access to networking components. Authorized access
    logged or otherwise documented? Are sensitive materials being handled appropriately
    in all mediums? Are environmental risks being considered such as flood, fire,
    or temperature extremes? Are employees educated to speak up if they see something
    suspicious?


    Some physical security risks do not involve door locks or security fences. Most
    high-security environments mandate that any network ports that are not'
