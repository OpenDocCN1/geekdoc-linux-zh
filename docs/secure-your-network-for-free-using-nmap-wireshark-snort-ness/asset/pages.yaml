  md: 'Unless you use the --user option to specify a different user for clamav to
    run as, it will run as the clamav user. This is true even if you are running the
    process as root user. As soon as the clamav process starts, it drops from the
    running user to the clamav user. This explains why you may run the process as
    root but still receive a permissions error. In my case, with Fedora Core 5, the
    permissions were not set correctly for clamscan or freshclam to run and had to
    be edited.


    You can freshclam with no options and it will use the Internet to update the database
    definitions. You can automate the database update process in several ways. You
    could run the same command as the command line and schedule it with cron to run
    as frequently as you like. You could also run freshclam in database mode by adding
    the -d switch. If you are going to use database mode, the default is to connect
    and check for updates every two hours. You can edit this in the freshclam.conf
    file with the line reading #Checks 24. Uncomment this line to cause freshclam
    to check for updates every hour (i.e., 24 times per day).


    This covers running on-demand scans. You gain a lot of protection by running these
    scans regularly in this fashion. You may want to evaluate the pros and cons of
    running an on-access scanner so all files will be scanned as they are accessed.
    By scanning files as they are accessed, you may prevent the payload of an infected
    file from ever being triggered. With a nightly scan, an entire system could be
    infected by the time the nightly scan runs. You can configure clamav in this fashion;
    however, this additional protection comes at a price. By scanning every file as
    it is accessed, a small additional delay is incurred for each file. On a system
    that accesses a large number of files, this delay can bring the system to a grinding
    halt. Clamuko functionality (discussed shortly) is also not as stable as the base
    package, so even if the expected level of file access is low, you should evaluate
    whether unexpected lock is acceptable. The best bet is to run the on-access feature
    on a test system and evaluate the stability for yours.


    If you want to enable on-access scanning, you can do so by installing Clamuko,
    which is a thread within the clamd daemon process. Unfortunately,'
