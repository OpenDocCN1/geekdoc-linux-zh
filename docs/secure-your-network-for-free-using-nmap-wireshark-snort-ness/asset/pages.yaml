  md: '# Managing Event Logs • Chapter 5


    +   3. If Stunnel does not come pre-installed on your Linux distribution, then
    download and install Stunnel from www.stunnel.org.

    4. Create a Stunnel configuration file called /etc/stunnel/stunnel.conf. Add the
    following text to the file and save the file.


    ```

    client = yes

