  md: '# Chapter 5 • Managing Event Logs


    The real meat of swatch can do is defined in the configuration file. If you had
    the following lines in your configuration file, it would cause any line containing
    “denied” or “Denied” to echo to the console and sound the bell once. Everything
    else would be caught by .*/ and get echoed to the console as normal text.


    ```

    watchfor echo yellow

    bell 1


    watchfor .*/

    echo

    ```


    As you can see, configuring swatch is not difficult. Refer to the swatch man page
    for specifics on some of the coloring options and other functionality of swatch.
    Some of the key commands for security considerations and their use follow:


    +   - script-dir=<path to directory> Used on the command line, when swatch runs,
    it creates a temporary watcher script, which by default is written to the user’s
    home directory. You should redirect watcher script to a secured directory where
    it cannot be edited. A hacker with access to this temporary script could control
    what swatch reports and cover his tracks.


    +   - exec command Used in the config file, this will cause another command. This
    could be as simple as a program to send an e-mail, for example, or could run a
    custom script to lock down the netfilter automatically.


    +   - Throttle hours:minutes:seconds,[use=message|regex| <regex>] This is especially
    valuable because it controls how often duplicates of a message are acted upon.
    On this way a brute password cracker being run won''t overload swatch with a nonstop
    scrolling message, possibly filling up your logging partition.


    +   - Threshold events:seconds,[repeat=no|yes] This is another very important
    one. This enables you to ignore certain matches until they surpass a given threshold;
    for example, threshold 4:60 will not


