    You''ll notice that the file.txt file created at earlier from all the rest. The
    leftmost column contains the permissions for the file, and the series of dashes
    and letters corresponds to the grid of checkboxes in the GUI permissions tab.
    The breakdown of the permissions designations is as follows.


    1222333444


    +   1. This first character designates the object type. Usually the object is
    a directory (d), but other options are possible, such as a socket (s) or a named
    pipe (p).A directory contains a d in the leftmost position.


    +   2. The next three characters indicate the permissions granted to the owner
    of the objects (r = read, w = write, x = execute). x is replaced with S when the
    SUID is set.


