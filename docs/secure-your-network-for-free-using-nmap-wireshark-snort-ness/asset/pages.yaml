    # Encrypting Sensitive Data


    Another way to protect your sensitive data is through encryption. In theory, even
    if logical controls are compromised and bypassed, an encryption mechanism can
    still keep data out of a hacker''s hands. There are some critical caveats to employing
    any form of data encryption, whether for personal use or within an organization.
    You should never encrypt something without having a means to decrypt the data
    in an emergency. You would typically do this through a password escrow mechanism,
    whereby a central repository contains all the needed passwords to decrypt the
    data.


    The objective is to ensure that the encryption does not become a liability. This
    can occur in a surprising number of ways. An employee who has the password for
    critical encrypted data could quit or become unreachable. A malicious employee
    could intentionally use your encryption mechanism to encrypt critical data and
    could even offer the password for ransom. If the encryption protocols and methods
    truly secure, the data will be unrecoverable for you as it would for any other
    attacker. The requirement for a password recovery mechanism exists whether you
    are implementing encryption that is supported natively by the operating system,
    or in the form of third-party software. This warning is so important that many
    security experts advise disabling the native Windows encryption (encrypted file
    system, or EFS) if you do not implement a means (of which there are several) to
    recover encrypted data (see the next section for more information).


    You should also consider the types of encryption you need. Encrypting single files
    is a convenient way to secure specific files on an as-needed basis. Another alternative
    is to create a normal file, which you can access as though it were an entire disk
    volume. The volume is integrated into your operating system and appears as another
    drive letter. Any files placed on this disk'
  merge: -1
