    # Business Continuity and Disaster Recovery Plans


    While not purely a network security document, there are many considerations surrounding
    business continuity (BC) and disaster recovery (DR) plans. For themselves, they
    will typically contain a log of highly sensitive information in the plans. For
    this reason, access to these documents should be limited to only those personnel
    who require access. This documentation will also serve as your first guide to
    walk through the processes that are outlined, and the infrastructure that is in
    place, and to look for any security risks. Oftimes people neglect to secure their
    DR servers or backup tapes containing sensitive information lying around securing
    them. In the end, this documentation will hopefully be useful or needed, but if
    it is, these are the documents that can make or break a company after a disaster
    occurs.


    # IT Security Policies/Standards/Procedures


    Because this subject is the cause of much confusion, it’s worth summarizing what
    each of these types of documents should contain.


    +   **Policies** Policies are broad statements that are general in nature. These
    documents should not change often. For example, a policy statement could be “data
    classified as confidential or higher must be encrypted when traversing an untrusted
    network.”These documents rarely contain sensitive information, and one company’s
    policies often look very much like another’s.


    +   **Standards** These specify what method should be used to conform to policy.They
    are more specific than policies. An example of a standard would be “acceptable
    encryption protocols are 3DES,AES(128),


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_380_0.png)'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'and AES(256)."The information in standards may be useful to a hacker, as what
    encryption you are using, but this information is typically of marginal value.


    +   **Procedures** Procedures are the most detailed documents. A procedure outlines
    exactly how to perform a given activity. These are very specific and include instructions
    such as "click here" or "run this program using these options." Because of the
    level of detail, procedures often make use of numbered steps and includes such
    as IP addresses and possible access accounts and passwords. While not every process
    will have procedures written for it, these documents often contain highly sensitive
    information and should be safeguarded appropriately.


    Because some of the documentation in this category can contain sensitive information
    they should be handled with care. Processes need to be in place to ensure the
    information is available, and that the confidentiality of the data is maintained.
    The integrity of the data is sometimes overlooked but is of equal importance.
    Only authorized individuals should have access to modify this documentation.


    # Vulnerability Scanning


    After locating all the hosts on your network, and hopefully removing or performing
    remediation on the unauthorized ones, you should determine the security status
    of all your systems. One of the most efficient ways of doing this is with an automated
    vulnerability scanner. These types of scanners typically work using varying levels
    of *ininvasiveness*. At the safest end of the spectrum, the devices only look
    for settings that *might* indicate a vulnerability, but they do not actually exploit
    the vulnerability. This approach can result in some false positives, but it is
    also the safest of scanning because it carries the lowest risk of causing a service
    disruption on the target machine. On the opposite side of the spectrum, the scanner
    can actually attempt to exploit the vulnerability. Because many of the vulnerabilities
    are expressly designed to disrupt service, this type of scanning obviously carries
    a high risk with it. It does, result in very few false positives and provide a
    very accurate indicator of the overall security of the system in question.'
