    # # Summary


    In this chapter, we examined a multitude of methods to secure your network perimeter
    and provide you, as the administrator, the access that is needed to administer
    the network. The Linux built-in network firewall was covered extensively due to
    its power and flexibility, not to mention availability, as a free faithful whatever.
    In addition to iptables, we looked at several GUI front ends that allow you to
    manage the network firewall without knowing the iptables command-line syntax.
    With your perimeter secured, the next step was to establish a secure doorway,
    so that you could sit at home and take care of the network. With command-line
    access via SSH, and Windows Terminal Services offering a remote desktop, FreeNX
    ruled out the offering by offering multiple remote desktop sessions from the same
    server.


    Armed with this knowledge, you have no excuse to have any type of firewall for
    protection on any and all unsecured connections. We use unsecured, not intentionally,
    because any business partner, home user network, or the Internet are all considered
    untrusted, meaning you have no or incomplete control over the security of the
    network you are connected to. Ultimately, you have no guarantee or enforce the
    proper security controls of an untrusted network. The sad fact is, you have an
    Internet connection and don''t have any type of firewall between a computer and
    the Internet, odds are very high that you have already been compromised. For other
    types of untrusted connections your odds may be better, but you''re still gambling
    if you don''t take steps to protect your network and systems.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_145_0.png)'
