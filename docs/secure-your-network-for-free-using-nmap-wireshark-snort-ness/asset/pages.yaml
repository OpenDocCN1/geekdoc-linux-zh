    # Demonstrating Effectiveness


    One of the age-old debates when it comes to network data collection placement
    of the sensors. This applies to both IDS sensors and reporting sensors as PRTG
    Traffic Grapher. The most common difference of opinion is whether you should place
    the sensor outside your external firewall or inside it. It is relevant because
    the data you see will be drastically different between the two. With the sensor
    placed outside your perimeter firewall, you will see all traffic directed at you
    the Internet, including all the traffic your firewall is blocking. If the sensor
    is placed inside the perimeter firewall, you will only see the traffic that has
    managed to pass through your firewall.


    Undeniably, the traffic of the most security relevance is the traffic that has
    managed to traverse your firewall and get into your internal network. These are
    the potential attacks, probes, and what need to be inspected and monitored closely
    to make sure the network is not compromised. Everything is configured properly,
    an IDS inside the perimeter should really see very little traffic, except perhaps
    triggers related to IT policy, as file sharing or instant messaging protocols.
    So if all the data a security officer would find “interesting” is on the inside,
    you might wonder what value a sensor on the outside would bring.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_272_0.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 4 · Configuring an Intrusion Detection System


    The unfortunate value for placing a sensor outside is really one of public relations.
    The unfortunate fact is that when it comes to network security, if everything
    is done properly, no one ever sees of anything. There are no flashing lights or
    alarms that say the network is functioning properly and securely. If you place
    an IDS on the outside of the perimeter, you can extract reports based on the traffic
    the IDS sees. These can be used to demonstrate management in concrete terms what
    your security efforts are accomplishing. Saying “the network is running fine”
    is great, probably doesn''t have the impact that a one-page report with a pie
    chart would. An executive summary of the attacks the sensor has seen could list
    some basic facts like “56,000 instances of code red were blocked, up 5 percent
    from last month,” and so forth. With an old PC and a little up-front effort, these
    types of reports would take very little to produce, but they could help you reap
    huge rewards when it comes to public perception of network security.


    When exposing any system to the Internet at large, remember it will be attacked.
    If your IDS is outside your perimeter firewall, there is nothing protecting the
    IDS except the IDS itself. This means the IDS will need to be hardened and secured
    as much as possible to ensure that it doesn''t become a system for hackers to
    use. Under these circumstances, one of your best defenses would be for the IDS
    to use a network tap (not free) to ensure that it can only receive from the network
    and not transmit. There are various discussions on this for making cables that
    can receive only. A little research will surely turn up some interesting designs
    to try. The success of these read–only cables will greatly depend on your system''s
    network connected and the switch or hub which you are connected to. While this
    doesn''t make the IDS invulnerable to attacks or alleviate the need to harden
    it, this configuration will make it significantly harder to compromise.


