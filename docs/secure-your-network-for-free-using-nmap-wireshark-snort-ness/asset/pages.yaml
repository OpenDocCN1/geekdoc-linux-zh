  md: '# Protecting Your Perimeter • Chapter 2


    VPN option, you only need to use one system, so if the user has a laptop, it can
    be used while they work remotely.


    The last and functional option is that of a remote shell. Because most average
    users do not operate extensively (if at all) in a console (i.e., text only) environment,
    this type of remote access is generally most viable for network administration
    personnel. While it may be impossible for accountants to operate their accounting
    program without a GUI, many network tasks and most firewall administration tasks
    can be performed with terminal access. Because the widely used Telnet protocol
    sends all data encrypted, any sensitive tasks should only be performed using a
    secured protocol such as secure shell (SSH), or Telnet over a Secure Internet
    Protocol (IPsec) tunnel.


    # Providing VPN Access


    A virtual private network (VPN) is exactly what it sounds like, the network connection
    you create is virtual, because you can use it over an otherwise public network.
    Basically, you take two endpoints for the VPN tunnel, and all traffic between
    these two endpoints be encrypted so that the data being transmitted is private
    and unreadable to the systems in between. Different VPN solutions use different
    protocols and encryption algorithms to accomplish this level of privacy. VPNs
    tend to be independent, at least to some degree, in that the VPN configuration
    is not on a per-port basis. Once you have established the VPN tunnel, all applicable
    traffic will be routed around the tunnel, effectively extending the boundaries
    of your internal network to include the remote host.


    One of your first considerations when planning to implement a VPN solution is
    the network design. Because the VPN tunnel needs two endpoints, one will be the
    remote workstation. The other will be a specially configured device for that purpose.
    This is generally called a VPN concentrator, because it acts as a common endpoint
    for multiple VPN tunnels. The remote systems will be using the concentrator as
    a gateway into the internal network, so the placement of the concentrator is important.
    In a highly secured environment, the concentrator is placed in a DMZ sandwiched
    between two firewalls facing the Internet and the other facing internally (see
    Figure 2.29). While this type of arrangement is the most secure, it takes hardware
    to implement.


    www.synergy.com'
