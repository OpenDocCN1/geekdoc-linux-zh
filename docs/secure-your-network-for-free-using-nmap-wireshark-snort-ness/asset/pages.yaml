- img_proc: true
  md: '# Security as an Ongoing Process • Chapter 46


    determined by corporate policy, with consideration given for the risk and sensitivity
    of the host in question. In the case of a very large network, it might take months
    for a complete scan of the network to finish, but in a small environment, a weekly
    scan is usually easy to implement.


    Updates to the scanning engine will occasionally need to be made. More commonly
    will be updates to the actual attack scripts that the scanner uses. Some scanners
    call these scripts plug-ins, while others call them scripts. This is what tells
    the scanning software how to check for a given vulnerability. If these are not
    current, you may not be checking for the latest risks, and thus might believe
    you are secure when in fact you are not. Because vulnerability scanners carry
    an especially high risk of causing service disruption on the target host, any
    updates or changes to the scanner or the attack scripts should be thoroughly tested
    before being used on a number of hosts.


    > You may have noticed an emphasis on conducting a vulnerability scan carefully.
    This concept is repeated for good reason. Be sure to evaluate which tests are
    needed carefully before scanning a host and preferably scan a test system before
    targeting the entire network. Some of the tests can carry a very high risk of
    causing a service disruption. After a given set of tests has been run several
    times without causing any problems, the risk will be minimal; however, if changes
    are made to the environment, you once are running a high risk of causing a service
    disruption.


    # Vulnerability Management Cycle


    Because vulnerability scanning must be repeated on a regular basis, you must develop
    appropriate policies and procedures to accommodate these. This should include
    a schedule for when, and under what circumstances, a given host should be scanned.
    There should be a process for the appropriate parties to sign off when a system
    is deemed “clean,” as well as a procedure to accept a risk in cases where it is
    undesirable or impossible to remediate at this time. A typical vulnerability scanning
    cycle would consist of the following steps (see Figure 8.2):


