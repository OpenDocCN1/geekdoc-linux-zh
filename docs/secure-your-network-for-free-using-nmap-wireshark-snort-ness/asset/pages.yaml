  md: '# Testing and Auditing Your Systems • Chapter 6


    The contents of your inventory documentation will vary according to your needs,
    but there are some common elements. At a bare minimum you will want to know the
    IP address, host name, and contact information for the person(s) responsible for
    administering the device. You could get as detailed as including hardware specifications
    (manufacturer, model, memory, etc.), MAC address, administrative contacts, emergency
    contacts, operating system type and version, and much more. Ultimately you will
    want to customize the documentation to your business needs. Perhaps deploying
    biometric authentication is a priority, in which case you might want to include
    a column indicating devices which have fingerprint scanners attached to them.


    # Nmap


    Nmap is the most widely used general-purpose network scanner. It is available
    from http://insecure.org/nmap/ for Windows, Linux, MAC OS X, Solaris, and other
    operating systems. The operation of Nmap is largely the same whether you are running
    it on Windows or Linux. The most notable exception is that you will need the Windows
    packet capture driver, WinPcap, if you are running Nmap on Windows.


    > NOTE

    The latest version of Nmap supports raw sockets, which means if you are using
    Windows 2000, Windows XP, or Windows 2003 Server, you don''t need the WinPcap
    drivers. For older versions of Windows you will need WinPcap.


    Nmap can scan open ports using a variety of standardized TCP packet options, as
    well as using some of the options in non-standard ways. There are a large number
    of command-line options, which can sometimes appear confusing, but the Nmap documentation
    and support on the Internet are very good. Periodically, a GUI front end will
    come and go, but currently there are no Windows front ends for Nmap being actively
    developed. NmapFE is a GUI front end for Linux and is actively maintained by the
    creator of Nmap. The GUI has the benefit of enabling you to check boxes for


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_356_0.png)'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Chapter 6 • Testing and Auditing Your Systems


    various options instead of requiring you to know a more complex command-line syntax.


    > Be aware of the underlying network topology that you are working with. If you
    are scanning a host on the other side of a firewall it will likely severely alter
    your results. In some cases, even an ISP will filter out ports. Although this
    prevents ports from being available over the Internet, they might still be available
    locally, and possibly still pose a security risk.


    If you have the Windows packet capture driver (WinPcap) installed and working
    properly, all that is needed to install Nmap on Windows is to extract the contents
    of the Zip download to a directory and run the Nmap executable. On Linux you can
    download and compile the source code, or install it as an RPM. When you run with
    no options, you will see a lengthy screen with a few examples. For the real treasure
    of helpful information, refer to the Nmap map page located at http://secure.org/nmap/man/.
    If you are comfortable working on Linux or Windows, Nmap functions almost identically
    on either. There is, however, one difference that can be significant, which is
    speed. Nmap runs much faster on Linux than Windows. In a small network this may
    not be a consideration, but if you are scanning a large number of hosts, or ports,
    the difference in scan times can be significant.


    Let’s go through some examples of how you could make use of Nmap. Let’s suppose
    you want to do an initial scan of your entire company network. If your company
    is using the private address space 192.168.0.0 or some portion thereof, you could
    scan the class B network, sending only a ping to see if the system is “alive”
    with the following command line.


    ```

    nmap -v -sP 192.168.0.0/16

    ```


    This would perform the most basic type of scan, which is a ping scan only, as
    specified by the -sP option. You can see more information by using the -v option,
    which tells Nmap to be more verbose; in most cases


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_357_0.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Testing and Auditing Your Systems • Chapter 6


    you will find the extra information informative. This option can also be used
    multiple times for even more information, so -v, and -vv are both valid. Because
    it is common for a personal firewall to block ping attempts, you may have better
    luck if you run the scan without the -s option. If you don''t specify a scan type,
    Nmap will default to a TCP scan (same as -S). The normal TCP three-way handshake
    consists of the initiating scan sending a packet with the SYN bit set. The target
    responds with a packet with the SYN and ACK bit set. The normal system sends an
    ACK packet back to the target. In this fashion a TCP session is established, which
    is followed by the desired communications. The SYN scan (-S) will send the initial
    SYN packet, but when the target host replies with a SYN ACK, Nmap completes the
    three-way handshake to fully establish the session. This method is so fast and
    efficient that it is the default scanning method Nmap uses.


    If you do not specify which TCP ports, Nmap will scan all TCP ports defined in
    nmap-services file, at which the time of this writing is 1680 of the most common
    ports. So let''s suppose during your ping of the entire network a system was identified
    that you didn''t recognize (192.168.1.10) and you want to find out about it. After
    the ping scan you could perform an Nmap scan with no options and see which of
    the most common ports are. The output of nmap 192.168.1.106, being a typical single-host
    scan with no other options specified, is shown in Figure 6.1.


