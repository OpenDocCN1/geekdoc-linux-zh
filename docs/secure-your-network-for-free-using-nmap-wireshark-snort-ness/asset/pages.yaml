  md: '# Users and Groups


    One of the simplest ways to define access is by configuring the user and group
    accounts and the rights they have. Typically you can access the users and groups
    configuration via the Control Panel under User Accounts. You can also access the
    same information (in an easier-to-use format, at least in my opinion) using the
    MMC with the Local Users and Groups snap-in. If you try to use the Local Users
    and Groups snap-in on a domain controller, you will receive an error. You should
    use the Active Directory Users and Computers snap-in to manage your domain user
    and group accounts. There are a few common hardening steps you can perform with
    little effort, which are very effective from a security standpoint.


    Most user and group administration will revolve around the Administrator account.
    On Windows, the Administrator account is a special account. Although the Administrator
    account is in the Administrator group, the uniqueness of the account goes beyond
    that. Placing another user in the Administrator group will not give you the level
    of access and breadth of power that the Administrator account enjoys. Similar
    to the root account on Linux, the Administrator account is the number-one target
    for attacks upon the Microsoft operating system. The name of this account is identical
    on every Microsoft Windows system, so everyone knows which account to attack.
    But we don''t have to leave it that way.You cannot delete the Administrator account,
    but you can rename it to a more customized (and unknown) username.


    A clever technique is to rename the Administrator account. You can then create
    a new user account (with a username of administrator) with as little access as
    possible. This new Administrator account can have very thorough logging and auditing
    enabled for any actions this account performs. Using this method, all of your
    local technical support personnel will know about the renamed Administrator account
    and will not attempt to use it. Therefore, the only people attempting to use the
    Administrator account are likely to be to no good, or at least such activity would
    be highly suspicious. Renaming the Administrator account is as simple as right-clicking
    the account and selecting Rename. You may also want to remove the description
    for the newly named Administrator account. In some environ'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Protecting Network Resources • Chapter 3


    ments, the accounts are renamed to very innocuous-looking names, such as Printing
    or Lockout. In other environments, I have seen random-looking account names, such
    as XOU923744. You can decide what strategy you want to employ. Just make sure
    the people who need to know can figure out the appropriate account to use.


    Creating a new, fake "administrator" account is simple. Just right-click Users
    in the tree view (the left pane of the MMC) and select New User. Enter Administrator
    for the account name. You could even use Built-in account for administering the
    computer/domain in the description field. You can change the password to random
    characters, as no one should ever be logging on using the new Administrator account
    anyway. If you really want to make life difficult for an attacker, you can configure
    the login script for the fake Administrator account to execute some type of notification
    program. If anyone does manage to log in to the new administrator, it can send
    an e-mail to the security team. I have also seen organizations in which the legitimate
    Administrator account (the renamed one) did the same. They did this because support
    personnel should never be using the local Administrator account instead, they
    should be using their own personal accounts or a separate account that possesses
    administrative access to the local workstations.


    If you wanted, you could take this concept a step further. You could require that
    any administrative accounts to be used for administrative activities only and
    that they are not to be used for day–to–day login, even by the administrators.
    In this scenario, an administrator would have his normal account, which would
    have the same access as any other user account, and also have a unique account
    to use when doing administrative tasks. This unique account would have the elevated
    privileges that are required. Although this approach might be considered extreme,
    it does provide separation, as well as a high-quality audit trail of what high-privilege
    accounts are being used for. Whenever possible shared accounts should not be used
    (including the local administrator’s account) because, if something happens, having
    the audit trail tell you the local administrator account was used won’t really
    mean much when any number of support staff have access to the administrator password.


