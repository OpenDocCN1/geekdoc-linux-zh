    # VNC


    VNC computing and has been around for a long time. It has gone through a lot of
    changes and is now available under many names, each with their own focus. This
    resembles the situation with Linux distributions in that the number of options
    can sometimes make it difficult to know which one is the best choice. Some of
    the most prominent are RealVNC, TightVNC, and UltraVNC.TightVNC (www.tightvnc.com/)
    encrypts the password when you initially, but the rest of the session is unencrypted.
    While you could use an encrypted tunnel to encapsulate the VNC session (see Chapter
    5, Managing Event Logs, for instructions on encrypting arbitrary sessions over
    both SSH and SSL), the other alternatives include native encryption. RealVPC Personal
    Edition (realvnc.com/) includes support for AES128 encryption, but is only available
    for Windows platforms. This leaves my current top choice as UltraVPN from http://ultravnc.sourceforge.net/.
