  md: '# Chapter 5 • Managing Event Logs


    ```

    log { source(s_sys); filter(f_no-debug); destination(d_lab); };

    ```


    After you save the changes, you will need to restart the syslog-daemon. Considering
    that we are logging everything short debug, you should see some messages as soon
    as you start the syslog-service. In the event that you don''t see any messages,
    or if you just want to do some further testing, you can generate a test message
    on some Linux systems with the logger command using the format logger -p facility.severity
    message. An example is:


    ```

    logger -p cron.emerg test message here

    ```


    This will send the messages "test message here" as facility cron, with a severity
    of emergency. Assuming you are able to successfully send TCP-based syslog messages,
    the next step is to add a layer of encryption to secure the syslog messages.


    # Configuring Stunnel


    Stunnel does not contain any cryptographic code itself. Instead, Stunnel uses
    external libraries to perform the encryption. In this case, OpenSSL is used to
    create an encrypted tunnel. SSL for Secure Sockets Layer, which is the same well-tested
    encryption that is commonly used to encrypt Web pages. To demonstrate the operation
    of Stunnel on both Windows and Linux, we will be using a Linux host to generate
    the logs (via syslog-ng) and a Windows host to receive them (via Kiwi Syslog Daemon).
    This should give you a feel for the operation of Stunnel on both operating systems.
    Follow these steps to configure Stunnel on the Linux host.


    +   1. Adding the following destination to your syslog-ng.conf file, which will
    define a new destination d_loghost.


    ```

    destination d_loghost tcp("127.0.0.1" port(5140));

    ```


    +   2. Change the log line in syslog-ng.conf that points to a destination of d_lab
    to the new destination d_loghost and restart syslogng. This tells syslog-ng to
    send the syslog messages to the localhost using a destination TCP port of 5140,
    which is where we will tell Stunnel to listen.


    ```

    log { source(s_sys); filter(f_no-debug); destination(d_loghost); };

    ```'
