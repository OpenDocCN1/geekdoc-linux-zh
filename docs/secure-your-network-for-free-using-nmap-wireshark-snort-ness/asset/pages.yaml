    There are a variety of methods to secure the syslog communications. We will walk
    you through setting up a syslog server on a Windows host and on a Linux host.
    We will also demonstrate some of the software that can be used to filter and analyze
    the syslog logs as well as the steps needed to encrypt your syslog data between
    the syslog client and syslog server.


    # Windows Syslog


    Although it is not native to Windows, syslog has been around since the 1980s and
    is so prevalent that the inevitable Windows support has surfaced. When you are
    researching the products to use for Windows-based syslog, remember to differentiate
    between the syslog server (or daemon) software and the client software. Because
    the software to send and receive syslog messages is typically not the same software
    package, we will discuss each in turn. We will cover the various ways to generate
    your events to a syslog server, for both Windows and Linux, as well as the software
    that is used to receive the event messages (again on Windows and Linux).


    # Generating Syslog Events


    The approaches to generating syslog messages from a Windows host basically fall
    into two broad categories. The first is to generate the message natively in syslog
    format and send it to the syslog server. Because current Windows offerings don''t
    support syslog natively, you need to manually generate these mes-


