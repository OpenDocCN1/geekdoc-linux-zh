    # Firewall Builder


    Firewall Builder is the most complete GUI offering for managing netfilter firewalls
    with features and capabilities comparable to some commercial firewall products.
    At a price: as is almost always the case, this functionality and capability as
    far as net GUIs are concerned, Firewall Builder is not the easiest to configure
    and use. If you want or need its superior management capabilities, however the
    extra effort is worth it. (Download firewall builder from www.fwbuilder.org/)
    Firewall Builder manages netfilter firewalls well as ipfilter, OpenBSD PF and
    (commercially) Cisco PIX. Firewall Builder runs on many popular operating systems
    including Red Hat, Mandrake, SUSE, FreeBSD, Mac OS X, and Windows XP.


    Firewall Builder operates differently than all of the GUIs so far. It uses an
    object-based approach. Essentially, you must define an object to represent any
    entity that you want to use in the firewall rules. In most cases these a source,
    a destination, and a service (port) at a minimum. Both the configuration and the
    GUI bear some resemblance to that of the Checkpoint Firewall GUI. Once the objects
    are defined, you can drag and drop them into the rules in order to permit or deny
    communications between the two. In this example we use a Windows XP host to run
    Firewall Builder and configure a Linux netfilter firewall.


