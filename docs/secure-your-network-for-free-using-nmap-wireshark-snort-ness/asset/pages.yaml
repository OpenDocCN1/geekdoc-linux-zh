    # Special-Purpose Enumerators


    The scanning utilities we have discussed been general-purpose scanners even if
    some included specialized enumeration techniques. Although SuperScan 4 includes
    some special Windows enumeration options, previous version of SuperScan, Nmap,
    and Scanline do not. In some cases you may want to scan for very specific responses.
    One example would be to scan for machines infected with the Back Orifice Trojan
    (BPoing) or to scan for SNMP-enabled devices (via SNScan). Nbtcan scan on a network
    for all devices. Both BPoing and SNScan are available from Foundstone, but there
    are many examples of special purpose enumerators available on the Internet. The
    intended purpose of these special enumerating scanners may vary from legitimate
    security tools to scanning for systems to launch denial of service attacks from.
    As is always the case, use caution when downloading tools from the Internet and
    researching the source of the tool to ensure that you are not introducing a Trojan
    or virus into your environment. The general purpose scanners are usually intended
    for finding responsive systems and determining what ports they are listening on.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_370_0.png)'
