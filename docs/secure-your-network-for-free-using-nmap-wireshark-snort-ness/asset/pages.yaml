  md: '# Network Infrastructure Devices


    The network infrastructure includes anything that is *part* of the network rather
    than being *on* the network, or *using* the network. These are the devices that
    move data through the network and include routers, switches, firewalls, and bridges.
    All these devices will require patching sooner or later. One of the biggest considerations
    you to work around when developing your patch management procedures is the patch
    release schedule. Obviously, you can''t patch a system if the patch isn''t put
    out. In the case of network devices, particularly firewalls and other security
    devices, patches for security vulnerabilities are typically released very quickly
    and *often*. This means your patch management system will need to include a process
    to schedule and prioritize the testing and application of the patches. Having
    a set schedule for patching, for example monthly, at least for the noncritical
    patches, enables the business units to schedule around the patching windows and
    account for any outages. By distributing a patching schedule, you help minimize
    the impact of your patching efforts. If you wait to patch a critical hole in your
    Internetfacing firewall, you are gambling that the hackers don''t find your vulnerable
    firewall in the next week; on the other hand, if the patch is inadequately tested,
    you could create a service disruption if the patch causes any unexpected problems.


    Always keep in mind when applying patches to infrastructure devices the potential
    for service disruption is high. Because all your other devices rely on the underlying
    network infrastructure for communication, complications at the network level can
    have devastating consequences. If a single server patch causes the service to
    quit functioning, you are without the services of that server. If the same thing
    happens to a core router for the network, it''s possible that no network systems
    will be able to function. Because of the high potential for service disruption
    and the large scope of potential impact, patches to infrastructure devices should
    be tested *extra* thoroughly before being deployed. Although the risk that the
    patch will break something is generally low, you want to put particular emphasis
    on the testing of any optional or less-common features you may be using.'
  merge: -1
  pgno: 467
- img_proc: true
  md: '# Operating System Patches


    Operating system patches are released at different times by different vendors.
    In most cases, a patch will be released to address a specific security risk or
    correct a bug related to particular functionality. Some vendors may have a specific
    schedule that they release their patches on, such as Microsoft, which releases
    their patches on the second Tuesday of each month. It is release schedules and
    release frequencies are the primary differences between infrastructure patches
    and operating system patches. Your timelines for patch review, application, and
    testing cycles will need to be synchronized with the vendor''s release schedule.
    You also need to schedule your patch updates with your change windows (see below
    for change management), perhaps even devoting one change window to OS patches
    if the volume is significant.


    The processes of applying patches and the time frames for doing so also need to
    account for the role of the host system. The people responsible for prioritizing
    when patches get applied must be aware of the criticality of the services the
    network host provides. A server that is critical to the business might need to
    wait longer to receive a patch during a monthly maintenance window, while a host
    that is exposed to hostile attacks (such as in a DMZ) might need receive a security
    patch much quicker. These are the types of considerations that someone who is
    not familiar with your business operations could not take into consideration when
    developing a patch management strategy. To schedule these maintenance activities
    properly, you will need a technical understanding of the impact of the patch,
    be able to weigh the risk of not applying the patch, and understand the potential
    business impact of a service disruption.


    # Application Patches


    Application patches are typically released by the application developer. The release
    frequency can vary drastically, while others change frequently. Most often, the
    vendor will recommend you only apply patches to address functionality if you need
    functionality or are experiencing an issue; in other words,“don''t fix it if it
    isn''t broken.” Because the nature of an application patch can vary so dramatically,
    these will need to be evaluated on a case–by-case basis in order to schedule'
  merge: -1
  pgno: 468
- img_proc: true
  md: '454 Chapter 8 • Security as an Ongoing Process


    the patches for deployment. Unless the patch is to address a security risk, these
    types of updates can often wait for a regular change window to be applied. As
    with operating system patches, the role of the application in question may impact
    the scheduling and testing of the patch in question.


    # Change Management


    Although change management and patch management are related, they are not the
    same thing. Patch management is a subset of change management and refers to applying
    patches specifically. Change management is much broader in that it encompasses
    any type of change to the existing environment. The change that is being managed
    could include the installation of new software or hardware, or a modification
    of settings with a system to alter the functionality. The objective of change
    management is to handle changes in a controlled fashion that minimizes risk. There
    are many things that can go wrong when implementing a change; however, a proper
    change management strategy can help mitigate some of those risks.


    # Change Causes Disruption


    The biggest and most obvious risk when implementing change is that it may cause
    a service disruption. We are all familiar with this type of complication arising
    from a change. We applied the update and suddenly the server was unreachable.
    This could be a total loss of functionality, such as when the network drivers
    get corrupted, or a partial disruption, where only a portion of functionality
    is lost. In either case, the downtime can signify loss of revenue, or real dollars
    (paid to consultants or vendors) to correct, not to mention the headache involved
    in troubleshooting the problem. Remember that some of these risks are entirely
    avoidable, while others are not. There really is no way to know if a network interface
    card on the server is going to quit when you reboot the server, but having a spare
    one on hand can really help. In some cases, the changes themselves may work perfectly,
    but due to a lack of proper management, multiple changes occurring simultaneously
    could interfere with each other. For example, if you are upgrading the Internet
    connection, another technician may not be able to perform an upgrade using software
    that is downloaded over the Internet.


