    # Encrypting Syslog Traffic Using IPsec


    For starters, let''s cover some basic IPsec terminology. IPsec settings are controlled
    on a Windows system via the IP policy. Only one policy can be applied to a given
    host at a time. The policy is defined using IPsec rules. A rule defines what types
    of traffic to act on and whether the traffic is permitted, blocked, or encrypted.
    The rules also determine how to authenticate the IPsec peer and other encryption
    settings. Filters are used to identify what types of traffic should be processed
    by the IPsec policy. Some systems this is referred to as defining interesting
    traffic. Security methods are used to define the encryption and hashing algorithms
    to use. Follow these steps to configure IPsec on the syslog client and syslog
    server.


    +   1. Open the IP Security Policies snap-in to your console if it is not already
    present.

    2. Right-click IP Security Policies on Local Computer in the left pane and select
    Manage IP Filter lists and filter actions (see Figure 5.13).


