    of IPs. After selecting the IPs or ranges of IPs to scan, click the start button
    at bottom, which looks like a traditional play button. The authors of the programs
    suggest using version 3 (shown in Figure 6.6) if version 4 doesn''t work properly
    for you. I have included both versions because, while version 4 offers many more
    options, my experience is that version 4 returns no results after a scan while
    version 3 works much more reliably. One of the primary reasons to use V4 over
    V3 is that version 3 and earlier versions support scanning only a single C network
    at a time. Version 4 also offers several additional features over the capability
    to scan noncontiguous IP address ranges,


