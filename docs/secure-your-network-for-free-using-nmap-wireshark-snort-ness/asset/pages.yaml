  md: '# Protecting Your Perimeter • Chapter 2


    geographic area be able to initiate a connection to the remote desktop than to
    the entire world.


    There are people who scan the Internet looking for systems that are listening
    on ports commonly used for remote access. This is the primary reason you may want
    to consider using a non-standard port for your remote desktop solution. In the
    case of terminal services, the port is configured in the registry, and Microsoft
    does not recommend changing it; however, it can be changed. For third-party products
    such as Virtual Network Computing (VNC), changing the listening port is typically
    much simpler and advisable. Using a non-standard port does not guarantee the system
    will not be discovered and attacked. In fact, for this reason you must require
    and enforce a policy requiring strong passwords for accounts with remote access
    privileges. If you''re going to be exposing your internal network to the outside
    world, you should also implement an IDS if possible (see Chapter 4).


    # Windows Terminal Services


    Windows terminal services are a handy way to provide access to a remote desktop
    across a single TCP port using remote desktop protocol (RDP). The fact that terminal
    services only uses a single port (TCP 3389); however, you can configure the port
    to any port), makes the firewall rules simple to configure. With Windows XP or
    Server 2000, the terminal services client and server will be installed by default.
    For Windows 2000, the terminal services component can be installed via the add/remove
    programs app in the control panel. Another advantage of using the Windows terminal
    services is that the client portion can be installed on older systems, allowing
    them to use the newer hosts and software. The remote desktop client can be installed
    on Windows 95, 98, ME, and NT as well as all of the newer Windows operating systems.


    To enable the remote desktop functionality on a Windows XP Professional or Windows
    2003 system, follow these steps.


    +   1. Right-click the My Computer icon and select Properties

    2. Select the Remote tab.

    3. Check the box that says Allow users to connect remotely to this computer.


