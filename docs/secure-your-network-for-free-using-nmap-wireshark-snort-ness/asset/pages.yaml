    all of your configuration information read-only media. Even if a hacker manages
    to compromise the system, all it takes is a reboot and it can be restored to its
    previous condition. The system can still fall victim to a virus or Trojan, but
    only until it is rebooted. Further, if the firewall system has a hardware failure
    such as a failed central processing


