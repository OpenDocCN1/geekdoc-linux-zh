    # Choosing Installation Media


    One of the more interesting features that Linux has over Windows is that it can
    be run from a variety of media. While Windows is notoriously difficult to configure
    from a CD-ROM, there are Linux distributions that are capable of running off a
    traditional hard disk install, CD-ROM, a Universal Serial Bus (USB) drive, or
    even a floppy disk. Each media type offers some security pros and cons, and not
    distribution will be available on every media type. If you need the features of
    a specific distribution that doesn''t come on the media you prefer, you may need
    to make a compromise. You will need to research the different media options and
    choose one that fits in your environment. We will review some of the pros and
    cons of each.


    # Full Install


    The install is the traditional install to a system''s hard disk. Much like Windows,
    you boot up an install CD and walk through a guided install process. Most of the
    Linux distributions installed on the hard disk offer graphical user interface
    (GUI) install programs that walk you through the installation steps. There is
    no great advantage to using this type of distribution other than the size of the
    hard disk allows you to install a lot of extra software. For a firewall, you generally
    want to keep the software running to a minimum to enhance security, so this shouldn''t
    be a very big consideration. This type of installation also has the advantage
    that it will be easy to modify and alter the configuration if needed.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_48_0.png)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 2 • Protecting Your Perimeter


    On the down side, this type of installation has all of the same disadvantages
    of a Windows bastion host. Namely that the entire system is sitting on the hard
    drive and if a hacker manages to compromise the root account, it will be able
    to install a virus or Trojan on the system that can survive future reboots. This
    type of install isn''t any better or worse than if you were using Windows for
    your bastion host OS. Despite these concerns, this is the most common type of
    Linux installation and most versions of Linux install firewall components by default.
    This means if you download a version of Linux you like and install it to a hard
    disk, you will have a firewall waiting to be configured when you''re done.


    In the event that you discover your firewall has been compromised, it is considered
    best practice to wipe the system clean and rebuild it from scratch. Unfortunately,
    unless you have some means of isolating all changes that were made, you cannot
    ensure that it is safe to leave the system operational. One of a hacker''s first
    steps is often to install a back door so that they can easily gain access to the
    device in the future. These backdoors include techniques such as modifying various
    systems commands that detecting the back door is difficult. For this reason, rather
    than risk leaving a system operational that may be compromised, a complete format
    and reinstall is recommended.


    # CD-ROM


