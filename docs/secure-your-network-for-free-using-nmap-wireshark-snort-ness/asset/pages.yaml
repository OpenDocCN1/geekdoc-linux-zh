    be used to determine when the back-out threshold should be. For example, if your
    change window for Web servers is 1:00 A.M. to 6:00 A.M. and it will take three
    hours to back out the changes (by restoring the server from tape), your back-out
    threshold would be no later than 3:00 A.M.


    +   **Contact List** The contact list is a list of relating all relevant stakeholders.
    This includes who will be making the changes, and who will be testing the changes,
    and who they report to. This list should also include who should be contacted
    in the event of an emergency, and possibly the project manager for the effort.
    It is a good idea to also note the expected means of communication. For example,
    if the senior network manager expects an e-mail in his inbox after the change
    is successful, this should be noted as well. This helps ensure that these details
    are not forgotten.


    +   **Sign-off** This is one of the key sections. Not only subject experts but
    also stakeholders should provide their written approval. This could include line-of-business
    representatives who are not technical as well. This provides assurance that everyone
    who has been impacted respects is in agreement with the change.


    All of these procedures should have a plan for dealing with emergency changes.
    By definition, an emergency change is a needed change that was not planned for.
    But the risk may still be acceptable if the alternative is less desirable. These
    changes can occur when a system is unreachable unexpectedly, or if you are actively
    being attacked by a hacker. There should be alternate procedures for implementing
    a change that enable one to expedite the process. Emergency change procedures
    should be well documented. Special consideration should be given with regards
    to how one seeks approval for an emergency change and who has the authority to
    approve emergency changes.'
