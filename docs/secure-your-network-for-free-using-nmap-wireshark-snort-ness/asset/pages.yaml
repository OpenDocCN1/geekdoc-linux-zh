  md: '# Hidden Costs


    What are all the costs of a free solution? For starters, power consumption. I
    had a Windows 98 system that was only being used as a print server. It occurred
    to me that the PC cost me approximately $7 per month in electricity. With a dedicated
    print server costing only $30.00 and using virtually no electricity, I would save
    money within five months by buying the print server. The Pentium II running Windows
    98 was technically "free," but paying for electricity to keep it running was not
    the most-effective choice. Some security tools are not offered as a commercial
    appliance, and some are (e.g., small, low cost firewalls that use less power than
    a standard desktop PC are available from several manufacturers). Your cost for
    electricity will vary. Based on your electric bill, you can calculate with a high
    degree of accuracy what given device costs.


    Another consideration is heating, ventilation, and air-conditioning (HVAC) costs.
    HVAC is basically the climate controls. Additional computers create additional
    heat, which costs more money for air conditioning. The same considerations apply
    as for power consumption. If a stand-alone appliance is not an option, the additional
    HVAC requirements are an unavoidable cost; however, in cases where more efficient
    appliance-based solutions exist, they almost always produce less heat than a normal
    workstation. This also applies to the difference between an older computer and
    a newer computer. Newer systems that demand more power and cooling when they are
    being heavily often incorporate energy-saving characteristics that are superior
    to those of the older systems.


    There is also the cost of real estate. A decommissioned full-sized tower PC takes
    up a lot space the size of a cigar box. You may have plenty of room now, but as
    the server gets more and more crowded, space could become an issue. A keyboard,
    video, and mouse (KVM) switch might save more in space than it costs to. As the
    servers become increasingly tightly packed, good air flow and adequate cooling
    will be inhibited, physical access to the systems for operation or maintenance
    will also be difficult.


    Inefficiency is another cost of free solutions with the respect that the support
    staff are likely unfamiliar with the new free solutions. When a'
