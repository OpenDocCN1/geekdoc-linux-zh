    > NOTE


    Always remember if you have configured the default policy for a chain to DROP
    (for example, iptables -P FORWARD DROP) that you will need to include an explicit
    rule to permit the return traffic. This can be done by using the following command:


    ```

    iptables -A <CHAIN> -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    So if you wanted to permit the return traffic for a FORWARD chain, you would enter


    ```

    iptables -A FORWARD -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    Many hours of troubleshooting Linux firewalls have been spent by overlooking a
    rule that permits the return traffic.


