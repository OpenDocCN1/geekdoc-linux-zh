    configuration check. Check each option here and ensure that both interfaces have
    been recognized, have a driver installed, and have IP address settings. Commonly,
    the RED interface uses DHCP and the GREEN uses a static IP address, so that hosts
    hosts configure the firewall as their default gateway out to the Internet.'
