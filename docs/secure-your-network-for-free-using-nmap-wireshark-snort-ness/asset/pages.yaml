  md: '# Security as an Ongoing Process • Chapter 8


    in use should be disabled. This is related to physical security because the intent
    intent is to prevent someone from plugging in an unauthorized device, such as
    a sniffer, and having access to the network. This concept of port access as a
    physical security concern can be extended to any type of data port, writable CD-ROM
    drives, infrared data ports, even to USB ports on the workstations. Any of these
    can offer an unauthorized individual access to data.


    > Notes from the Underground...


    Know Where Your Sensitive Data Is (at All Times)

    If you are trying to figure out what to secure from the view of “is this server
    sensitive,” you are inviting problems. The correct approach is to know what data
    is sensitive (meaning classify all your data), and then know where data resides
    at all points in its lifecycle. As an example, a business calls you, as your customer,
    and places a large order. They fax you your relevant tax ID and any other needed
    forms. You get their payment information verbally over the phone, process the
    order, and e-mail them a confirmation receipt.


    You know you need to store their payment information securely so you encrypt the
    account details on the server’s hard drive. The e-mail receipt itself may need
    to be encrypted depending on what information it contains, so you take that into
    account well. When you verify the phone you are speaking to existing account information
    when possible. Are all your bases covered? Is the fax machine, which contains
    confidential information, in a physically secured location or unauthorized people
    walk by and see the faxed forms? Are the server backup tapes secured? Depending
    on the encryption mechanism, if you can restore the entire server from tape, you
    might be able to access the encrypted data.


    The point here is to know where the sensitive data is at all times and to protect
    it accordingly.


