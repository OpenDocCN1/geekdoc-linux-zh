  md: '# Chapter 2 · Protecting Your Perimeter


    (typically port 80 for the Web), the source port is usually a random port above
    1024. By tracking the source port, the firewall knows which address belongs to
    which session. In the event that two hosts attempt to use the same source port,
    the NAT device edits the source port of one of the connections and replaces it
    with another random source port. When the return traffic is received, it translates
    the source port back, just it did for the IP address. Because this method of NAT
    relies heavily on the source port number, it is sometimes referred to as port
    NAT (PNAT).


    To add the SNAT functionality to the example firewall, source use the following
    command:


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j SNAT --to-source 5.5.5.5

    ```


    The -t option is used to specify the type you want to modify, and the -A option
    specifies that you are going to append this rule to the POSTROUTING chain. By
    specifying the outbound interface, you are ensuring that the SNAT only occurs
    as traffic leaves the private network, meaning only in the proper direction.


    > SNAT can only be performed in the nat table. However, the rules for SNAT can
    only go in the POSTROUTING chain of the nat table. This means that any time you
    use SNAT, your rule will contain -t nat -A POSTROUTING.


    The jump target SNAT is self-explanatory. The --to-source option specifies which
    IP address we want to use as the new source address. SNAT assumes we have a static
    IP address to SNAT the outgoing packets. While this is likely the case in a corporate
    environment, a more appropriate solution to closely mimic the configuration of
    a home router would be to use the MASQUERADE command:


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE

    ```


    The masquerade command does not require an IP specification, and will use the
    IP address of the firewall interface.You might be wondering why you'
