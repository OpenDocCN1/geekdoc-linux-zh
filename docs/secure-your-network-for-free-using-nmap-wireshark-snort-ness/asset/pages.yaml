  md: '# Chapter 6 • Testing and Auditing Your Systems


    > TIP


    When trying to triangulate the location of a given wireless device, bear in mind
    that wireless signals can be reflected off nearby objects, such as buildings.
    So you might get a stronger signal from a wireless access point in the room next
    from the direction of the building across the street. This could happen if the
    walls between you and the wireless device were very well insulated and the building
    across the street was particularly well suited to reflecting the wireless signal.


    Many wireless card manufacturers also offer a utility to monitor the signal strength
    of an access point. These will often show a graph of the signal strength or signal
    quality.Their utilities generally require you to be associated with the access
    point in question, however, so their use as a walking utility will be limited.
    NetStummer packs a lot of information on its results page. The general quality
    of the signal is indicated by the color of the circle on the left (green is good,
    yellow not so good). The circles with a lock symbol indicate that the wireless
    device is using some form of encryption. The type of encryption is shown in the
    Encryption column. If NetStummer detects an access point (green or yellow circle)
    is no longer receiving any signal from the device, the circle will change to gray.
    The device could be gray due to ambient conditions such as whether causing a weak
    signal to no longer detected, or the device could have been turned off.


    The tree view (left–hand pane) of NetStummer includes some handy ways to sort
    your results. The Channels can be expanded to list all the channels with signals
    on. Each channel can be expanded again to see what devices are using those channels.
    This can be useful if you are getting information from nearby devices on the same
    channel you are using. This will let you quickly see what other devices are using
    the same channel. The Filters also contains some ways to filter the results. One
    of the most useful filters is the Encryption Off, which, simply enough, shows
    a listing of all the devices that are not using encryption.


    One feature you might find searching for is a way to tell NetStummer to connect
    to a given wireless device. Don’t look too hard because NetStummer does not include
    this feature.To connect to any of the


