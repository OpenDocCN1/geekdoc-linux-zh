    Targets are the actions that should be taken when a packet matches a given rule.
    A target is specified using the -j <target> syntax (for jump). The primary targets
    used for a firewall are ACCEPT and DROP.


    +   - ACCEPT The packet is accepted and processed by the rest of the TCP/IP stack.


    +   - DROP The packet is dropped, and no notice is given to the sender. While
    this does not honor the TCP/IP protocol specifications, it is considered the most
    secure option, because it denies a hacker useful information about the firewall.
    This behavior also has a negative side effect, which is if a system is trying
    to initiate a connection to a port that is blocked by a firewall, the connection
    attempt might time out before the initiating host gives up. If you use REJECT,
