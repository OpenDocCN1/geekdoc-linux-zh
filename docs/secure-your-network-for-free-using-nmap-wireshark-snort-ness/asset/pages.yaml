- img_proc: true
  md: 'You can also enable a particular port using any of the following syntax examples:


    netsh firewall add portopening TCP 80 Webserver

    netsh firewall add portopening UDP 80 Webserver

    netsh firewall add portopening ALL 80 Webserver


    As yet another means to configure and control the Windows Firewall, you can use
    GPOs.You find the settings for the Windows Firewall in the MMC Group Policy Editor
    snap-in. Navigate to /Computer Configuration/Administrative Templates/Network/Network
    Connections/Windows Firewall/ to locate the appropriate settings.


    The Windows Firewall can usually do an adequate job of protecting the local system.
    The Windows Firewall configuration allows you to configure global settings on
    the General and Exceptions tabs, and allows a higher degree of granularity on
    the Advanced tab. The Advanced tab allows you to configure many of the same settings
    as the global settings, but you can configure them on a per-interface basis. You
    also can configure these same settings from the command line using the Netsh utility.
    While I wouldn''t recommend using the Windows Firewall as a perimeter firewall
    gateway, it can make an excellent personal firewall for your Windows-based network
    resources.


    > Tools & Traps...


    # What''s in a Name?


    The ability to specify access through the Windows Firewall based on the program
    name is pretty handy. By doing so, you don''t need to figure out which port it
    needs, or whether the program needs to listen on a lot of ports or manage a large
    list of ports to allow through the firewall. This ease is not without its pitfalls,
    however. access is based on the program name and nothing else. This means if the
    Windows Firewall is configured to allow inbound connections to helphelp.exe, and
    a user renames badapp.exe to helpdesk.exe, connections to badapp.exe will be permitted
    through the firewall. This is why renaming an executable of the user''s choosing
    is a popular method of bypassing Windows Firewall restrictions.'
