  md: '# Are You Owned?


    # A Word of Caution


    Perhaps you have fortunate enough, or cautious enough, to never have downloaded
    any malicious software accidentally. One thing you will discover when searching
    for security software on the Internet is that it is precisely security software
    that is most often a security risk. Countless Internet sites like to offer you
    security tools to discover Trojans (or even more commonly, supposedly control
    the Trojans), to clean a virus, or otherwise protect you when in fact the programs
    you are downloading are infected with a virus, Trojan, or other malicious software.
    You must exercise extreme caution when scouring the Internet for security tools
    or you will become the next victim of unscrupulous people.


    My advice is to download your security tools from only the major security researchers.
    In this way you can be fairly sure that the software will only do what it''s supposed
    to, without any hidden payload. There may be times when you simply cannot find
    what you are looking for from one of the more mainstream security sites, in these
    cases you may have to visit some less well-known sites. In these instances I would
    recommend downloading the software to an isolated test system and only running
    the software after extensively testing it with a variety of anti-virus and anti-spyware
    programs. These steps help minimize the chances of falling prey to malicious software.


    Table 6.2 highlights the primary features of each scanner covered in this chapter.'
