  md: '# Configuring Snort on a Windows System


    +   - Remember that every path in the snort.conf file needs to be an absolute
    path. A single incorrect path will prevent Snort from running properly.


    +   - WinPcap is required in order to use Snort on Windows. It is also required
    for using several other networking utilities on Windows.


    +   - IDS Policy Manager can be used to centrally configure and manage the Snort
    process and Snort rules.


    # Configuring Snort on a Linux System


    +   - You may want to consider a Snort alert front end such as BASE for viewing
    alerts.


    +   - If your environment is primarily Windows, this will enable you to access
    the alerts from the Windows systems without having to view the Snort console on
    the Linux IDS host.


    # Other Snort Add-Ons


    +   - A fully functioning IDS will not be of much value if no one is taking notice
    of the alerts it generates. An easy-to-use alert console can add a lot of value
    to your IDS in that it may increase the attention that alerts receive.


    +   - We recommend using Oinkmaster to automatically keep your Snort signature
    files current.


    # Demonstrating Effectiveness


    +   - One of the age-old debates when it comes to network data collection is placement
    of the sensors.'
