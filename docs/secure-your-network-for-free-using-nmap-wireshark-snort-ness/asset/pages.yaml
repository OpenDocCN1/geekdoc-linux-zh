  md: '# Chapter 2 • Protecting your Perimeter


    SmoothWall uses a concept of interface colors to denote their trust level, and
    you will begin seeing referred to in that fashion during the installation process.
    For example, your inside interface is assumed to be the trusted traffic and is
    designated as the GREEN interface. Various dial-up, Integrated Services Digital
    Network (ISDN), or DMZ interfaces are designated as ORANGE interfaces. You can
    also have a combination of colors indicating your interface configuration. If
    you use an additional Ethernet interface as the untrusted (OUTSIDE) interface,
    in SmoothWall parlance that would be GREEN + RED.


    After the files are installed successfully, you are given the opportunity to restore
    your configuration from floppy disks. This is useful if you are upgrading or migrating
    to new hardware. In this case, we select OK.


    +   - Select your keyboard layout (in my case “US,” and select OK.

    - Select a hostname for the firewall (e.g., smoothwall) and select OK.

    - The next screen allows you to enter proxy server information in case you need
    to go through a proxy for the firewall to retrieve Web updates. If you are using
