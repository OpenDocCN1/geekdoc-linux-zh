  md: 'needs to be used for their implementation. You probably don''t want hours of
    reporting and meetings because someone wants to change their screensaver. The
    changes need be prioritized, which is somewhat subjective but includes consideration
    as the following:


    +   - The impact and risk of not implementing the change. Will business be impacted?
    Will real dollars be lost or will it only be an inconvenience for employees performing
    some processes?


    +   - The risk that applying the change might negatively impact service. What
    are the odds of this change breaking something? How complex is the environment?
    How well documented and understood is the environment?


    +   - The criticality of the host/system system affected by the change. How key
    is the affected device to the business process?


    +   - Nontechnical considerations. If the change breaks something, will the disruption
    be visible to the customer? Will there be a loss of customer confidence or business?


    All these considerations will lead to the second phase, which is scheduling. I
    have seen many examples where the risk of making a change was simply too high,
    and the decision was made to live with the risk. Your prioritization and deadlines
    can probably be very similar to that of the aforementioned patch management process.


    Only after you have analyzed the priority of the changes will you have one change
    window, you schedule them. Typically, depending on the urgency of the change.
    Minor changes to noncritical systems may be acceptable during any nonbusiness
    hours, while critical systems may only have a change window of a couple of hours
    each week to apply changes. A change window is the accepted time frame for implementing
    changes. This phase best accomplished with multiple stakeholders working together.
    This allows for various initiatives to be scheduled without creating a conflict
    between them. The scheduling stage will work best if you provide input and buy-in
    from representatives from multiple lines of business.


    Scheduling could also be impacted by nontechnical considerations that the technical
    staff may not be aware of. Perhaps a new advertising campaign is'
