    a user will either forget to encrypt the file after modifying it, or neglect it
    to the inconvenience of doing it every time a filename is changed due to versioning
    or other factors. This is why it is recommended that you set folders as encrypted,
    instead of individual files. The process is the same, except you select a folder
    instead of an individual file. After you do this, all files in the folder will
    be encrypted, even ones moved or copied from other folders. This makes encryption
    painless to use.


    A significant disadvantage of using EFS is that it does not support access to
    encrypted content based on group membership. This means that one encrypts the
    data, only that one user can encrypt the data, or individual users manually given
    access on a per-file basis (Windows XP and newer). This makes EFS unsuitable,
    or at least cumbersome, for files that are shared among a group of users. To configure
    additional users to access a specific encrypted file, open the Advanced Properties
    for the file and click Details. You can then click Add to add an individual user
    to be able to access that encrypted file.


