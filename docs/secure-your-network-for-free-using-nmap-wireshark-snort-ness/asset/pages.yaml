  md: '# Protecting Your Perimeter • Chapter 2


    ```

    IF "%1"="test" exit

    psexecec -l -u $username -p $password C:\check.bat test

    ```


    The first line is checking the command line for an argument of test. The first
    time OpenVPN Server calls check.bat, this argument will not be pre-sent, so it
    will go to the next line.The next line will use psexec to run same check.bat.
    This will fail if the supplied credentials are not correct. If they are correct,
    check.bat (# 2) will be opened, this time with "test" as the first argument. When
    check.bat (# 2) sees "test" as the first argument, check.bat (# 1) has completed
    its assigned task and exits with error code of zero, thus authenticating the VPN
    client. The psexec utility allows you to specify the system to run the command
    using \<computer> format. When you omit the computername, in this example, psexec
    will assume the local account. In this case, the VPN server would need a local
    account to authenticate.


