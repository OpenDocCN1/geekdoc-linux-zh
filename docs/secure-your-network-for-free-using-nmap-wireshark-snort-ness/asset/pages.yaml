    Now that you have the basics, create an example configuration. Suppose you have
    a mission-critical server with an IP address of 192.168.1.100. You want to send
    you an e-mail for any message containing that IP address. You don''t want to get
    500 e-mails in five minutes if the server crashes, so you want a throttle that
    you won''t generate more than one e-mail every five minutes at most. The lines
    at the beginning of the switch.conf will accomplish this.


    ```

    WatchFor /192.168.1.100/

    exec sendemail -f Syslog@yourcompany.com -t recipient=some.com -u ALARM -s

    Mails@svr.com -m "Problem with 192.168.1.100"

    thttle 00:05:00

    ```


    -f option is from body; -t is the address. -u specifies the subject line and -s
    specifies the outbound SMTP server to use. The option -m is to specify the message
    body. The variable $ will be expanded to include the entire entry as the e-body.
    You could also use -o message-file=/var/logs/somelog.log to create the body from
    a file you specify.


    Suppose you want to know anytime anyone is denied access to anything. You can
