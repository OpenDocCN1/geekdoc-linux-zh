  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: Is there any way to automate the live Web-based virus scans?


    A: While you can do it, such a project would likely be very time-intensive. You
    could start with the set of tools called libwww, from www.w3.org/Library/Distribution.html.
    This includes tools for command-line HTTP tools for retrieving Web sites, and
    even sending input back. You could probably patch a script that would perform
    the scan, though I don’t recommend it unless you really need it desperately.


    Q: I haven''t had a virus or spyware before. Do I really need to worry about installing
    any software to protect myself?


    A: First, I would encourage you to run some scanners. Many systems are infected
    with a virus or spywarewithout causing enough of a problem for anyone to notice.
    Second, most well-informed users can sometimes make mistakes, and without protection,
    it will take only one mistake to potentially bring your entire network to its
    knees. If you want to see how easy it is to fall victim, Burn a CD-ROM and configure
    a program that will e-mail you when run. Do the same with an executable on the
    disk. Give the files interesting-sounding names, as quotes, incomes, merchants,
    or discounts. When finished, leave the unlabeled CD-ROM lying anywhere near your
    organization’s building. Sit back and see how long it takes before you receive
    your e-mail. All it takes one person getting curious and putting the disk in the
    drive.


    Q: How can I disable the configuration of Windows Firewall so that my users can''t
    turn it off?'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Protecting Network Resources • Chapter 23


    A: You can read about the process of configuring Windows Firewall GPOs in more
    detail here: www.microsoft.com/technet/security/small-business/prodtech/windowsxp/fwgrppol.mpsp.
    The appropriate settings are located in the policy under Computer Configuration\Administrative
    Templates\Network\Network Connections\Windows Firewall. When your configuration
    changes are completed, you can apply the policy by running gpupdate, rebooting
    the machine, or waiting for the default policy refresh to occur.


    Q: What happens if I''m using EFS and copy an encrypted file to my USB drive?
    Will it remain encrypted, or does Windows decrypt it before copying it out?


    A: It depends on a lot of factors. If the destination file system is not formatted
    as NTFS, the file will be decrypted and copied. If you are using Windows 2000
    EFS, this decryption takes place transparently, so you may not be aware that the
    file was decrypted. With newer versions of Windows, you will receive a warning
    reminding you that the file will be decrypted. Without getting too long-wind,
    EFS behaves differently depending on (1.) whether you are making a move or a copy
    operation; (2.) the way the destination file system is formatted; and (3.) what
    OS and directory access the destination operating system has.


    Q: I am a home user. Will Windows Firewall protect my host if I plug it in directly
    to my cable modem?


    A: Placing your system directly on the Internet with no firewall ensures that
    the system will be compromised and used for some purposes you probably wouldn''t
    approve of—possibly without you ever knowing. Enabling Windows Firewall is a big
    improvement over no firewall and will offer some protection. A real firewall (even
    an inexpensive home model) offers additional security that Windows Firewall doesn''t.
    This includes source NAT for one, which will help hide your machines IP address
    and make directing attacks toward it more difficult. So will Windows Firewall
    protect you? Sure, to a degree, but remember defense in depth is the objective.


