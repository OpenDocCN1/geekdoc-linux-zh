    to the application. Different sniffers provide varying levels of sophistication
    and features.


    The primary difference between a commercial sniffer and a free one will be in
    remote management and in some advanced analysis options. In many cases the sniffer
    will require special drivers to be installed in order to sniff traffic. The sniffer''s
    role is mostly to display the data it collects. It is up to the human user to
    interpret the data and determine what it means in the big picture. For this reason,
    the analysis of sniffer output (often called traces) is typically reserved for
    experienced networking experts. With a little basic information, however, a sniffer
    can provide a quick look into the otherwise unseen background of network communications.
    We will explain the installation and basic use of GUI sniffers and a couple command-line
    sniffers as well.


    # Using a GUI Sniffer


