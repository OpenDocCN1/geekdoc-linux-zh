    the snmpadministring community string to gain read-only access to the entire MIB
    tree.


    After this configuring you might be wondering what the difference is between one
    version of SNMP and another. As the protocol has matured, it has gone through
    several changes, the majority of which revolve around security. The basic differences
    between one version and another are highlighted for your reference.


    +   * **SNMP v1** Included basic functionality and sent SNMP data using clear
    text.

    * **SNMP v2** Mostly introduced security features, including two new branches
    of the MIB tree, 1.3.6.1.5 (security) and 1.3.6.1.6 (SNMPv2). Introduced the GetBulk
    operation, for requesting large amounts of data in a single request. SNMP v2 also
    sends information using clear text.

    * **SNMPv3** Introduced the *digest* authentication protocol, which is used for
    *integrity*, ensuring that the message that was sent is the one that is received
    using MD5. Introduced the *symmetric privacy protocol* to ensure data *confidentiality*
    using Data Encryption Standard (DES) encryption. Note that DES is not generally
    considered secure by modern standards and was replaced with triple DES (3DES),
    and, more recently, with *Advanced Encryption Standard (AES)*. Introduced the
    *User-based Security Model (USM)* and the *View-based Access Control Model (VACM).


    # Troubleshooting Network Problems


    Inevitably, sooner or later, something will go wrong on your network. In most
    cases you can troubleshoot the problem using standard resources such as the error
    message and syslog logs. There will be those rare times, however, where the standard
    information sources aren''t giving you enough information to know what is going
    on. In those cases, a network sniffer may be your only option. A sniffer will
    basically look at all the traffic at the network layer in its raw form and collect
    it. This means you can see the way your network card sees it, which is very different
    from how the final product looks


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_439_0.png)'
