  md: '+   - Network Topology Maps

    - Access Request Forms

    - Business Continuity and Disaster Recovery Plans

    - IT Security Policies/Standards/Procedures


    An additional consideration that all your critical documentation is one of availability.
    If the network is unavailable and all your documentation is stored on a file server,
    you''re going to have a hard time accessing the network documentation that you
    need to repair the network. Many times individuals fail to account for this during
    an emergency and discover they cannot access their critical documentation. This
    could include not being able to access your business continuity plan, network
    diagrams, and other critical documents. Typically, copies of the documentation
    should be printed out and stored in a safe location offsite, possibly at the same
    location where you store your data backups.


    # Network Topology Maps


    Most people are probably familiar with network topology maps or network diagrams.
    The idea is to show a graphical representation of how the various network components
    are connected. Oftimes this type of documentation is generated when the initial
    network is installed but it is not maintained like it should be. An inaccurate
    network map can actually cause more problems than not having one at all, because
    someone may assume they are configured one way, in fact they are configured differently.
    Accurate network diagrams are critical. Their real value is apparent when there
    are problems and you need to troubleshoot the network. When you don''t know how
    things are put together, any problem solving has to be preceded with an information-gaining
    exercise that only adds delays.


    Or maybe the network is small enough that you know every device that is connected
    to it like you know the back of your hand, and you don''t need a diagram. This
    might work adequately most of the time but if you ever have to bring in outside
    help, they probably don''t know the network as well as you do, and you have to
    pay for the consultant''s time just to learn how things work, before they can
    begin to do the work you actually hired'
