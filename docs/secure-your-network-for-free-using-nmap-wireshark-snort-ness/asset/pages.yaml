    # Using Secure Shell


    SSH (Secure Shell) requires both an SSH client and an SSH server component. SSH
    is the industry standard for remote command line access and most systems with
    it as part of the default install. Windows systems of course are one of the few
    that do not. There are a variety of products available to bring SSH functionality
    to Windows, both commercial and free. One of the better known commercial SSH clients
    is SecureCRT (www.vandyke.com). Most of the free versions are based on the OpenSSH
    (www.openssh.com) package. There is also a GUI front for OpenSSH, called PuTTY.
    Cygwin (www.cygwin.com) is a port of many UNIX tools for Windows and included
    in this package is an SSH server. To add even options, SSHWindows is a free package
    that installs only the minimum components of the Cygwin package use SSH, SCP,
    and SFTP. We will walk through setting up SSHWindows (on a Windows XP system).
    This package includes both the SSH client files and the SSH server files.


    +   1. Download SSHWindows from http://sshwindows.sourceforge.net/ on the client
    and server

    2. Unzip the file and run the setup utility. Answer the standard prompts and then
    click **Finish**


    At this point the SSH client is ready to be used without the need for any additional
    configuration. Before you use the SSH server, however, you must create and edit
    the \OpenSSH\etc\passwd and \group files.


    +   1. If desired create a separate group on the system to hold users who have
    access to SSH, and add the local user accounts to the group for anyone you wish
    to have access to connect to the SSH server.

    2. At the console navigate to the directory where you installed \OpenSSH\bin\

    3. Enter the following command on the server to specify which groups can connect
    via SSH: `mkgroup -l >> ...etc\group`. This will give


