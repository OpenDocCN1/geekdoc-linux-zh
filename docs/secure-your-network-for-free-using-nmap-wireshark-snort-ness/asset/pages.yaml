    back-out time typically requires senior management approval.


    +   **Testing** This section should include the procedures used to test the change.
    In some cases this may be simple; in others it may be a very detailed section
    requiring its own set of documentation. This section explicitly states the manner
    in which you will measure success of the change. This section also serves to show
    the person implementing the change performed their due diligence in testing the
    change, should a problem arise later.


    +   **Backout Plan** This section will detail what steps will be needed to reverse
    the changes. In some cases this section may seem trivial, while'
