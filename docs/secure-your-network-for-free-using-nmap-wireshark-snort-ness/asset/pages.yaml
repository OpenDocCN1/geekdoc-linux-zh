  md: '# Strengths of Free Solutions


    One advantage free solutions often have over their commercial counterparts is
    that of development speed. This varies from one product to another; not all free
    products have quick development cycles.The open-source packages often have very
    fast development cycles and can address the latest security issue more quickly
    than their commercial counterparts. If you want to stay on the cutting edge, free
    software (especially open-source software) might be a better path than commercial
    solutions.


    Previously, we discussed customization as a cost savings with free software. This
    is because you can do the customizing yourself instead of paying the vendor to
    do it for you. Customization is worth mentioning as a strength of its own, above
    and beyond the cost savings. Again, not all free software is customizable. Sometimes
    the best software in a particular category used closed code and there is no way
    for you to perform any customization. But one of the greatest strengths of the
    open-source movement is that everyone has the freedom to edit, customize, and
    improve the software.


    A potential strength of free solutions is the speed with which they can be implemented
