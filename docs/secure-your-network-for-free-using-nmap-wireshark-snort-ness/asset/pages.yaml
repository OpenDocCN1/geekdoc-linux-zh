    Sometimes you may be looking for a security issue and you want to look at all
    the directories, not specific directories or folders. The built-in security interfaces
    don''t do a very good job of allowing you to do that. Some additional utilities
    do so, however.


    AccessEnum(https://www.microsoft.com/technet/sysinternals/AccessEnum.jsp) is a
    GUI utility that you can use to quickly identify permissions that deviate from
    the norm. AccessEnum will run on Windows NT, 2000, XP, and 2003. It will scan
    the folder you specify and all subfolders and files, and in this way, you can
    quickly see which ones have been permissions changed or modified in some fashion.
    AccessEnum can also scan a portion of the Registry, looking for similar permission
    deviations. This is a big plus because the provided interfaces for working with
    Registry permissions are very cumbersome. Unfortunately, AccessEnum abbreviates
    the access types to just Read, Write, and Deny, so it''s probably not an an auditor''s
