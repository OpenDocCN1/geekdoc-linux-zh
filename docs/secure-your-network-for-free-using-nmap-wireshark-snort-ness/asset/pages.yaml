  md: '# Encrypting Syslog Traffic


    Often the systems we monitor are on un-trusted networks, such as a Web server
    in an Internet-facing DMZ, or a DNS server. Because the messages could contain
    sensitive information, we should encrypt the data to maintain confidentiality
    in transit. This is where the choice of using syslog over UDP or TCP becomes important.Your
    choice of encryption mechanisms changes dramatically based on whether you plan
    to use UDP or TCP as the underlying protocol. You can encrypt traffic with TCP
    or UDP, but TCP''s reliability makes encryption much simpler to implement. Therefore,
    many more options exist for implementing encryption of arbitrary data over TCP
    than UDP. Syslog uses UDP port 514 by default. There are both syslog clients and
    syslog servers that can use TCP instead of UDP. The KiwiSyslog daemon (Server)
    is free and can receive syslog messages over either UDP or TCP.


    The problem, is that at the time of this writing we could not find a syslog utility
    to convert the Windows logs to syslog format and use TCP. SNARE will use TCP,
    but only for the commercial version. Although there are many ways to encrypt TCP
    traffic using free solutions, the same is not true for UDP traffic.There is a
    version of TLS (Transport Layer Security) in the works, called DTLS (Datagram
    TLS), which will be able to encrypt over UDP, but there is no working implementation
    as of yet. TLS is the successor to SSL (Secure Sockets Layer), which is the standard
    for encrypting Web pages (i.e., https://). The Adicon logger (www.monitorware.com/logger/index.php)
    is a free command-line utility for generating log messages that will support sending
    syslog over TCP or UDP.


    If you have the ability to send your Windows event logs to the syslog server using
    TCP, there are a couple of encryption options that are easy to set up. One way
    is to use SSL. SSL is a very well-documented and simple-to-implement encryption
    for almost any TCP-based communications. Stunnel is open-source software available
    from www.stunnel.org. Stunnel can tunnel'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Managing Event Logs • Chapter 27


    TCP communications through an SSL-encrypted session with a minimum of configuration
    complexity. Yet another industry-standard option is to use SSH and its port-forwarding
    capability. In practice, this works similarly to Stunnel, but SSH is a different
    encryption mechanism. The end result is the same, the capability to forward a
    TCP connection through an encrypted tunnel.


    If you are limited to use UDP-based syslog architecture, there is still hope.
    You will need to set up an IP Security (IPsec) tunnel between the client and server.
    Although a little more complicated to configure, IPsec is the industry standard
    when it comes to setting up VPNs, which is just another form of encrypted tunnel.
    IPsec also has a major advantage in that it is protocol independent. IPsec can
    encrypt TCP, UDP, and even ICMP, basically anything that runs over IP with a few
    caveats. In the case of sending syslog messages, we only need the syslog communications
    encrypted, but IPsec can be used to encrypt all communications between a host
    and destination. The primary downside to using IPsec over one of the previously
    mentioned solutions is the configuration complexity. Additionally, the out support
    for modern Windows systems (Windows 2000, Windows XP, and Windows Server 2003)
    is better (easier to configure) than that of a Linux host. Although Linux supports
    IPsec natively, the task of configuring it is made much simpler with the assistance
    of some third-party configuration utilities. We will demonstrate how to set up
    IPsec between the syslog server (in this case running on Windows XP) and the syslog
    client generating the syslog messages (in this case running on Windows Server
    2003).


    As a final option, if you happen to be sending your syslog messages from one Windows
    host to another Windows host (not likely given Windows'' lack of syslog support),
    then you can use a free tunneling application from Kiwi Enterprises. Kiwi Secure
    Tunnel can be downloaded from www.kiwisys.com/secure-tunnel-info.php. Kiwi Secure
    Tunnel supports the tunneling of both TCP- and UDP-based syslog, but there is
    no Linux software component. The most likely scenario where you could take advantage
    of this would be when you have systems (including Linux hosts) generating syslog
    messages from a secure subnet, but the messages must traverse an insecure network,
    such as the Internet, to be received at a central location. In this case, all
    the hosts could send their logs to the Windows host


