  md: '# Summary


    As you can see, there are many powerful and free solutions for network reporting
    and troubleshooting available. Never underestimate the power of a visual aid,
    be it a graph, a pie chart, or whatever. A simple graph can get the point across
    more quickly than a page full of numbers. Armed with the relevant data presented
    in an easy-to-understand format you can demonstrate the need for more Internet
    bandwidth. You could also demonstrate how the use of Internet streaming music
    is consuming all the bandwidth, and with a policy change, a bandwidth upgrade
    is not needed. Depending on your specific policies, you could generate reports
    for whichever protocols are of interest to you. You could run a sniffer to collect
    and graph statistics on your own, but having free software that will do it for
    you is a real time saver. Far and away I would recommend PRTG and ntop as the
    best free solutions for tracking usage statistics.


    If, despite your best efforts, problems do arise, there are powerful and free
    packet sniffing solutions available to help troubleshoot problems at the network
    level. Once you have an understanding of the merits of the different products,
    you can select a sniffing tool that is right for the job.You can quickly see what
    is happening at the network packet level, and in some cases identify problems
    that would be virtually impossible to troubleshoot any other way.


