  md: '# Managing Event Logs • Chapter 5


    your log collector, you are likely to have md5sum or shasum (preferred) already
    installed. You can also use the openSSL suite of software to generate message
    digests using a variety of algorithms. Both md5sum and shasum are special-purpose
    programs that only generate hash values using their respective algorithms. OpenSSL
    can generate the following hash types: MD2, MD4, MD5, rmd160, SHA and SHA1. Here
    are some examples of md5sum and shasum approaches.


    ```

    # md5sum /input.txt

    3ecb8cc0a0f5bff1b83bbe4d53cfe522

    # shasum /input.txt

    afd72e14ec0c04d07c2b70f3412c477406a0121 /input.txt

    # openssl md5 /input.txt

    MD5(/input.txt)=3ecb8cc0a0f5bff1b83bbe4d53cfe522

    # openssl sha /input.txt

    SHA(/input.txt)=afd72e14ec0c04d07c2b70f3412c477406a0121

    ```


    A regularly scheduled process to generate the hash values can be automated to
    coincide with the rotation of the log files themselves. For example, if you rotate
    your logs at midnight each night, you can create/edit the process to generate
    the hash of the log file if it is no longer being actively modified by the logging
    process. This hash can be stored with the log file, as long as it is also stored
    in a secure location that is separate from the log file. You don''t want anyone
    who has access to the log files to be able to simply generate a new hash and replace
    theirs for the original; this would circumvent the entire purpose for generating
    the hashes. As an additional bonus, if desired, openSSL can also encrypt the log
    files from the command line, which, makes scripting this process relatively simple.


    # Applying Your Knowledge


    So now you know how to generate logs for custom applications and processes. You
    can centrally control the log files using encryption, and ensure that the log
    files have not been tampered with. You are also armed with the tools to analyze
    the log files, and you can do this for free. You might be wondering just what
    you should do with all this newfound knowledge or what the next step for applying
    it should be. Whether you are


