  md: '# Protecting Your Perimeter • Chapter 2


    For example, if there was a Web server running on the Linux host, you could use
    the “Policy” tab to permit inbound connections to TCP port 80. The “Editing” dropdown
    box allows you to choose between inbound and outbound rules to edit. For the Web
    server example, we selected “Inbound traffic policy.” The policy group you select
    when you click Add Rule determines where the policy is placed. The function of
    the various policy groups is outlined below.


    +   - Allow Connections From Host This is used to configure a given IP address,
    hostname, or network. When you enter the IP information and create a rule in this
    policy group, all traffic from the configured source is permitted.


    +   - Allow Service The allow service policy group is used to permit individual
    services. You can configure the source to anyone including a specific IP, or network,
    or all local area network (LAN) clients. The LAN clients option permits the service
    through the firewall with a source address that is on the same subnet as the inside
    network adapter.


    +   - Forward Service This option is used only when you NATing. This allows the
    firewall to forward a specific port or range of ports, so that a service hosted
    on an internal NATed device can receive inbound connections from the external
    network.


    The “Outbound traffic policy” window shows a different set of policy groups (see
    Figure 2.18). There are also the additional radio buttons to select “Permissive
    by default,“blacklist traffic,” or “Restrictive by default, whitelist traffic.”
    If you select the permissive option (the default), outbound connections will be
    allowed and any rules you create will be DENY rules. This is the same default
    behavior of most firewalls. If you select the restrictive configuration, the default
    target for the table is DENY, and any rules you create will be PERMIT rules.


