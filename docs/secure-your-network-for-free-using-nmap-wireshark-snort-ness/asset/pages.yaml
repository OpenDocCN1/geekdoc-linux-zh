  md: '# Introduction


    Sooner or you will need to identify all the systems on your network. Despite the
    most stringent of usage policies, sometimes undocumented systems may be added
    to the network. Sometimes these systems are “test” systems that were never decommissioned.
    At other times you may find “rogue” systems whose presence on the network violates
    policy. There are instances where the system is managed by a third party as part
    of a vendor’s service offering. The value of a full network discovery is even
    more apparent if you are dealing with an environment that you are not familiar
    with, such as a newly acquired company, or if you are new to your position. If
    the network has enough hosts, this task isn''t much of a challenge. If the network
    is large, or spread across multiple locations, and visiting all isn''t practical,
    an automated discovery/scanning tools will be much more practical. We will look
    at some generic discovery/scanning tools, as well as some that are targeted at
    specific services.


    After you have identified all the systems on your network, the next logical step
    is to determine the security posture of those systems. Several automated scanning
    tools are available that can check for a large list of known vulnerabilities and
    can make this task easier. We will demonstrate the configuration and operation
    of some automated vulnerability scanners. We will also discuss the Microsoft Baseline
    Security Analyzer, which simply checks a Microsoft system and reports on any known
    security issues it finds. Finally, there are some formalized security testing
    methodologies that you can use to assess the security of a system, beyond simply
    running a vulnerability scanner.


    # Taking Inventory


    In a perfect world, you would have 100 percent accurate and complete documentation
    encompassing every system that is connected to the corporate network. No one with
    access to the network would ever connect a system to the network without all the
    proper documentation and approvals to do so. Well, we all know “perfect” doesn''t
    exist. Perhaps you have a specific reason to do the network discovery, or maybe
    not. A periodic discovery is a good idea anyway, even if you don''t have any reason
    to do one. It can provide'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Testing and Auditing Your Systems • Chapter 6


    assurance that policies are being followed when you can successfully produce documented
    approval for all devices on your network. A host inventory can also demonstrate
    that your documentation matches the true state of the network and that routers
    and switches are where they are supposed to be. The fact that systems can be very
    hard to locate physically, especially given the increasingly smaller size of wireless
    access points, a network-based discovery is often more fruitful than a physical
    one.


    # Locating and Identifying Systems


    There are two primary steps to performing a network inventory. The first step
    is simply to identify the existence of a system. There are number of ways to do
    this; typically a combination of methods will result in the most accurate inventory.
    If the system is configured not to respond to a ping, however it will course be
    missed. This occurs most often when a personal firewall is running on the host
    that is blocking network pings. Even in cases where a system will not respond
    to a ping, the host is usually listening on some port. A more comprehensive TCP-based
    port scan will often reveal the presence of systems that a ping scan will not.
    Further, by capturing the input output for each port you can often gather more
    information, which can be used to identify the software or host. For example,
    if you connect to TCP port 21, and it responds with HTML headers, you could probably
    conclude that the system is running a Web server on the port normally used for
    FTP. You can inspect the DHCP scope on the DHCP servers in an attempt to identify
    a system that is not authorized to be on the network. Wireless systems can be
    identified relatively easily due to the fact that they must transmit a signal
    in order to communicate. Depending on the size of the network, you may be able
    to take an inventory of the ports used on switches and routers, or for those with
    a lot of time on their hands, by cross-referencing the ARP tables with a list
    of known hosts. In 99 percent of the cases, however, a simple ping scan of all
    the network IP addresses combined with a TCP and UDP scan of a few key ports will
    provide a very good inventory of the hosts on the network.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_354_0.png)'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Chapter 6 • Testing and Auditing Your Systems


    > TIP

    A well-secured network will hinder exactly the types of inventory-building activities
    you will be performing. The same techniques that stop a hacker from mapping out
    your network will also hinder you as an admin. If you are not able to see the
    results you are expecting, remember that firewalls, VLANs, IPSec, and other security
    measures may skew your results.


    After you have identified the systems that exist on your network, the next step
    is more time consuming: determining where the system is physically located. In
    some cases, maybe you dont not need to, particularly if they are authorized systems,
    or if you can identify a means to contact the person responsible for the system
    in order to make the system “legal.” If you find a rogue system, however, you
    will want to see where it is located and perform other information-gathering steps
    in an attempt to get it removed from the network or complete the needed procedures
    for the system to have authorized access to the network. Sometimes this process
    is relatively simple, such as when the system is using a host-naming convention
    that tells you your location and maybe even the server role, such as DALLASWEB0.somecompany.com.
    In other cases you may need to use the IP address and traceroute to track down
    the physical location based on the subnet combined with a good network map (we’ll
    go over an example in the next few paragraphs). In the case of a wireless system
    (host or access point), locating the rogue system can be particularly challenging.


    Remember that a network device inventory is a living document. It will take time
    to perform an IP scan, track down any devices that you weren’t familiar with,
    and verify network access approval or seek approval for all devices. By the time
    you are finished, it will probably be time to start the process over. Because
    the network is rarely a static entity, this type of discovery should be performed
    on a regular schedule. You may have local policies that dictate how frequently
    the discovery should be. If these policies are not present, you should develop
    a process and make it part of your normal business operations. In this way, rogue
    systems can be located in a minimal amount of time and you can minimize any security
    risk that these systems may.


    www.syngress.com'
  merge: -1
