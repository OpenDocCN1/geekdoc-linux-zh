- img_proc: true
  md: '# Protecting Network Resources • Chapter 3


    All you have to do is use Bastille is to start up, and it will present a series
    of yes/no questions which you must respond. Based on your answers, it will configure
    various security settings automatically. These settings include removing SUID
    bits from some programs, disabling insecure services (such as rshell, for example),
    changing user account expiration, and much more. The script does a good job of
    presenting you with reasonable defaults, providing the most secure option that
    will not overly impact usage of the system. When you are finished answering the
    questions, you will be prompted to choose whether to save the resulting Bastille
    configuration. Note that saving the configuration is not the same as applying
    it, and the next question is whether you want to apply the configuration.


    Bastille is a powerful tool that helps harden a default install. Depending on
    your selections, you can easily make a system so secure and unsuitable for use
    as an everyday workstation. A little experiment, combined with reading the excellent
    explanations that Bastille provides, should help you create a very secure system
    with a minimal amount of effort.


    # Using SELINux


    SELinux stands for security-enhanced Linux, and it was developed in partnership
    with the National Security Agency (NSA). It provides a higher level of security
    by enforcing mandatory access controls (MAC) through the kernel. Mandatory access
    controls are very different from the standard discretionary access controls. Most
    systems are said to use discretionary access controls because someone (the file
    owner, or the root/administrator user account) has discretion over who has access
    to what. Mandatory access control is based on the principle that a given role
    has predetermined access rights, and these are immutable. Basically, the only
    way to change access permissions is for the user to be assigned to a new role
    (called contexts in SELINux terminology). Because the enforcement is through the
    kernel, it can restrict the actions of any process, even a process run by the
    root user. As far as the underlying components of SELINux are concerned, there
    is no concept of a root user, only security policies and security contexts. SELINux
    is available for many Linux distributions (see which ones at http://selinux.sourceforge.net/distros/redhat.php3).
    SELinux is installed by default (though disabled) on Fedora Core 5. You


