  md: '# Summary


    Taken as able, the tools and utilities covered in this chapter should empower
    you to locate the systems on your network using a variety of methods. The best
    of class utilities presented offer a broad spectrum of choices in complexity and
    features for discovery scanning. After all the systems are located, you can begin
    testing them with a vulnerability scanner to determine what their current security
    posture is. This enables you to build a complete and accurate picture of just
    how secure the systems are. The Baseline Baseline Analyzer takes this one step
    further and reports on weak security settings for Microsoft operating systems,
    rather than vulnerabilities. All of this collectively gives you the information
    you need to complete the first step of securing your network, which is information
    gathering.


