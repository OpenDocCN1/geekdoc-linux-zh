  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask the Author” form.


    +   Q: I have many hosts at a remote office and I want to send UDP-based logs
    from all of them back to a central logging server; is there a simpler solution
    than enabling IPSec on all my hosts?


    +   A: Sure, you could accomplish this any of several ways. You could collect
    all the logs to a single syslog server at the remote office and then configure
    the secure IPSec encryption from that single server back to the central office.
    You could also configure a gateway device to communicate securely with the central
    office in tunnel mode, so that all traffic from all hosts pass through that gateway
    will be encrypted. Using either option, only one system needs to be configured
    with IPSec.


    +   Q: What is the simplest way to generate log entries for testing purposes?


    +   A: For generating syslog events from a Windows host, Kiwi SyslogGen is indispensable.
    You can download it from www.kiwisyslog.com/info/sys-loggen.htm. For Linux, you
    can simply pipe data into the log files directly, such as echo kernel.emergency
    >> /var/log/messages. If, for example, you have a switch running, it would then
    be able to trigger on kernel.emergency (assuming it was watching /var/log/messages,
    which will be by default).


    +   Q: How long should I keep my log files?


    +   A: That will depend on your business and environment. If you are in an environment
    where risk of a security incident is higher, such as an ISP, that will surely
    affect how long you should keep your logs. If you have government regulations,
    the retention period might be mandated to you. If your logs contain any information
    that would fall under HIPAA, an entirely different set of requirements becomes
    relevant. When deciding'
