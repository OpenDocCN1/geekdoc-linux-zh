    for one-off processes or custom applications, odds are you will have a large number
    of items that can only log to the Windows event log, which brings us to the second
    alternative.


    Perhaps the "cleanest" option of all is not to generate syslog events natively,
    but to use a utility to convert the Windows event logs into a syslog-compatible
    format and then process them in that format. Using this methodology will not only
    be easier to configure, but will also help you don''t have events that are missed.
    In increasing order of complexity and functionality is the Eventlog to Syslog
    Utility (evtsys), NTsyslog, and SNARE.


