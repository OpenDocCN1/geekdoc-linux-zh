  md: '# Introduction


    If you have successfully implemented a firewall, a network analysis and reporting
    system, and an intrusion detection system (IDS), I would like to tell you your
    job is done, and you can head over to the coffee shop. Sadly, this isn''t true.
    Securing your network and systems is only the first step of an ongoing process.
    Without consistent and conscious effort, an otherwise secure infrastructure will
    devolve into an insecure one. This chapter will discuss the various efforts that
    are needed to maintain a secure environment.


    Each topic will be examined with an eye toward *not* following these procedures.
    Security is an area of networking where, more than any other, inction will result
    in failure. The most secure system that we make today will eventually be the biggest
    security risk on the network if it is *not* is maintained adequately. Along these
    lines, almost every system that uses the network for communications, from wireless
    access points, firewalls, workstations, servers, and even the routers and switches
    themselves, need regular maintenance in order to operate reliably andsecure. This
    regular maintenance can be broken into several more specific categories, which
    we will discuss in detail.


    # Patch Management


    Patch management is a broad category that basically means “keeping everything
    up to date in a controlled fashion.” A patch is a modification of software that
    is typically relatively small and specific in what it addresses. The changes resulting
    from the application of a patch are usually less significant than those of a service
    pack or a fully incremented version release. Patch management is not applying
    all the latest patches when they are released to the public. Applying Service
    Pack 2 for Windows XP will enable the built-in Windows Firewall automatically.
    This isn''t an issue for most users, since the firewall will allow outbound connections
    by default, but if you have some service running on that system that needs to
    listen for an inbound connection, you will suddenly find it doesn''t work after
    applying the patch. In this particular example, the service pack has been out
    for so long, most people are either already updated or, if not they are aware
    of the issues. If you didn''t'
  merge: -1
  pgno: 463
- img_proc: true
  md: '# Security as an Ongoing Process • Chapter 8


    know about the service pack enabling the firewall, the information is so widely
    disseminated that you would likely be able to find the information very quickly.
    When the patch was first released, however, this wasn''t the case, and many organizations
    suffered a service disruption that could have been avoided with proper patch management.


    A proper patch management system should include a regularly scheduled review of
    the patch levels of all systems (by the appropriate subject matter experts). The
    particular schedule you will choose will be based on your environment. In a high-security
    environment, this process may occur as often as weekly, while in many environments
    a monthly process is adequate. A key component of the patch review will be to
    assign a priority to newly released patches. This should be done by an appropriate
    subject matter expert, or if you have the luxury, a group of them. This is a relatively
    subjective art with no hard and fast rules, only guidelines. If a patch addresses
    a security flaw in hardware the company has deployed, it would be a very high-priority
    patch. If, on the other hand, the affected hardware was only deployed in a few
    places, and there were additional controls in place, the priority would be much
    lower. The priority that is assigned will dictate the deadlines for a patch to
    be applied. These deadlines will also need to be developed to meet your business
    needs but the following priorities could serve as a starting point.


    +   **Critical** These types of patches are for serious vulnerabilities that are
    both easy to exploit and likely to be exploited. These patches should be tested
    and applied as soon as possible, with a 24-hour deadline being common.


    +   **High** These high-risk patches will need to be applied with some urgency
    on an accelerated testing schedule. These patches could have a one-week deadline
    for implementation.


    +   **Medium** This is a typical vulnerability. Maybe it requires a very detailed
    set of circumstances to exploit, or the risk is a minor denial of service, but
    not a complete compromise of the affected device. The deadline for these types
    of patches would be your standard patch cycle, possibly monthly.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_464_0.png)'
  merge: -1
  pgno: 464
- img_proc: true
  md: '+   Low Patches that are nearly impossible to actually exploit, or for devices
    that are very well secured with additional mitigating controls. While relevant
    to business, these types of patches may wait until the normal maintenance cycle
    to be applied. The maintenance cycle would mean the patch would be applied indirectly
    with the next software upgrade. It’s worth noting that these patches are still
    tracked as outstanding until they can be remediated.


    +   Negligible These patches do not apply to your particular hardware or configuration.
    These patches are generally filtered out when they are assigned their initial
    priority and are not tracked after that point.


    The patch review meetings will likely include some type of reporting to distributed
    upper management, in a format that is easy to digest and understand so that everyone
    involved can be up to date and informed as to the current status is. These reports
    should include a list of patches that are outstanding, schedules for applying
    the patches, and an indication of the success or failure of past patching efforts.
    This type of documentation will also be of value to auditors to show that there
    are processes in place and being followed for keeping the systems secure and their
    software up-to-date.


    A vital component to any patch management system is testing. It would even be
    reasonable to say testing the core of patch management. Without a procedure in
    place to test prospective patches and ensure compatibility with the existing hardware
    and software, you really only have patch scheduling, which is not adequate. The
    testing procedure should make use of standardized forms, with sign-off by the
    person who performed the testing, and with much detail as is reasonable, a description
    of the testing that was performed. It is important to capture and document the
    testing process in an effort to increase accountability and consistency.This will
    help you avoid multiple people believing someone else tested a particular patch.


    Sometimes a patch will not make it through testing successfully.This may be by
    design; for example, if patch disables some feature you were using. In these cases
    you may need to evaluate whether or not to apply the patch anyway, even there
    were issues discovered during the testing process. This will basically be a judgment
    call on whether the problems introduced by'
