    inadequate network documentation among other things. In any case, these trained
    professionals should have known better, but accidents happen to the best of us.


    # Implementing Firewalls


    When it comes to selecting a firewall there are a host of factors to consider.
    For commercial offerings there is the up front cost in addition to ongoing maintenance
    costs, which in some cases can be considerable. For free-offerings, however, one
    of the first considerations is what OS you want to run the firewall on. This will
    impact how it is managed, and while the capabilities of the firewalls are likely
    similar, the implementation details will be very different. Most firewalls (commercial
    and free) run on either Windows or Linux. Some commercial offerings run on their
    own base system (e.g., Cisco PIX). With some firewalls the underlying Linux system
    has been so heavily modified it is now considered proprietary. In the case of
