  md: '# Using Online Virus Scanners


    Another option is to use any of several free online virus scanners.These are not
    hands-off as installing a product, because you need to go to the Web site and
    initiate a scan. This process will also require installation of various browser
    plug-ins to function. Many Web sites offer free online scans, may actually require
    you to download software, which isn''t really an “online” scan. Trend Micro offers
    a true online scan using HouseCall, from http://housecall.trendmicro.com. When
    you run the scanner, HouseCall will allow you to choose between performing the
    scan using a Java-based application or an ActiveX browser plug-in. Loading HouseCall
    will take some time. Once HouseCall is completely initialized, you can choose
    to scan the complete computer, or selected files and folders. If you select the
    entire computer, there are no other options to configure and the scan will commence.
    If you choose selected files and folders, you will be presented with a tree view
    to choose which folders to scan. After making your selection, click Next. One
    word of caution: Stick with reputable antivirus vendors’ Web sites for online
    scans; otherwise, you could fall victim to a hacker posing as an online virus
    scanner.


    # Antispyware Software


    Spyware can cause a lot more problems than most people realize. Even if a corporate
    firewall prevents the software from ever revealing any confidential information,
    the processes that are running can consume the system of valuable resources. Right
    off the top, these programs will consume processor cycles, and with enough of
    them, or with a poorly written program, the impact can be substantial. Also, the
    running spyware will consume some amount of memory. In addition to these resources,
    the spyware will consume some amount of disk space, though this is typically the
    least of your worries. These are present even if the spyware in question is working
    perfectly. The truth is that in most cases, the people installing the spyware
    don''t care whether your system crashes, and these programs are rarely tested
    adequately. The source of many unexplained problems is often spyware. Luckily,
    free antisware utilities are available. Note that the same licensing caveats that
    apply to antivirus software (and all free software, really) apply to antispy-'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'ware software. In many instances, the default business model is to offer a
    feature-limited version for free, in an attempt to convince you to buy the commercial
    version. In most of these cases, the license agreement will expressly exclude
    installation in a business environment. Be sure to review the license carefully
    and ensure that you are using the software legally. When in doubt, consult your
    legal team.


    # Microsoft Windows Defender


    Microsoft Windows Defender is a relatively new offering which will attempt to
