    # Securing Your Event Logs


    In the same way that having event logs no reviews is of little value, having event
    logs is also of very little. If you are trying to reconstruct a set of events,
    you need to be sure that the logs have not been tampered with. Erasing the logs
    is typically one of the first stops a hacker makes after gaining access to a system.
    In this way, not only are legal repercussions but securing the system to prevent
    the break-in becomes all the more difficult if you don’t know how access was obtained.
    Most concerns around log reliability will be related to one of two areas: chain
    of custody and log integrity. We will look at ways to ensure both, because they
    are heavily interrelated, and in the process make your network more secure.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_342_0.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Ensuring Chain of Custody


    Chain of custody simply means knowing who had possession of an item at all times.
    These same principles apply to physical objects as well as data. In the case of
    a physical object, it means who had possession of the object itself, or who had
    physical access to said object. In the case of digital data such as log files,
    chain of custody includes physical access to the media that stores the logs, as
    as legal access to the log data. The objective is to be able to prove who had
    custody (or access) to the data. If you ever need to pursue legal actions against
    a hacker, ensuring chain of custody becomes especially important. If your server
    is sitting on the network and everyone has access to the log files, the logs will
    likely be of minimal value in a court case.


    The ways one can ensure chain of custody with data are many and varied. Much like
    the concept of security in depth, a multitude of controls will serve better than
    relying on a single control or method. All log data should only be accessible
    to those who need it. These restrictions can be accomplished through file-level
    access controls, limiting which user accounts can log in to the logging server,
    and even network-level firewall and isolation. At the physical layer, you need
    to limit who can physically gain access to the logging server, through door locks,
    security guards, ID badges, and the like. This primarily addresses who has access
    to the log data. You will also want to create an audit trail for when the data
    is accessed in an authorized fashion.


    All log to files (authorized or not) should be logged. These logs should be stored
    in a different location that the normal log administrators do not have access
    to. In all reality, you would rarely need to inspect these logs, but it is certainly
    better to have them available than not to. In the event that a hard drive or other
    storage media needs to be changed, there should be some means to document who
    changed it, when, and why. This is often accomplished with a chain of custody
    form (similar to what is used with physical evidence in legal proceedings), which
    accompanies the physical medium as it is moved around. All of these measures work
    collectively to ensure you know who had access to the data at all times. The next
    step is ensuring that the data has not been altered at any point in time.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Ensuring Log Integrity


    The next best thing for a hacker to do if he can''t delete the logs, is to alter
    them. While you might think it would take something extreme, all he has to do
    is alter them in any obvious way, and they will lose most of their value for legal
    proceedings. This is because, as soon as it is demonstrated that any part of the
    logs have been altered, the integrity of the entire log cannot be guaranteed.
    There are a lot of ways to ensure the integrity of a log file. Some people have
    advocated printing the logs to create a hardcopy and storing them in a secured
    location. This has mostly gone out of practice because the volume of logging information
    has increased dramatically. Another option is to write the logs to a write-once
    medium, such as a recordable CD-ROM or DVD. This has the advantages that the storage
    capacity is reasonable and the physical media is relatively small, making secure
    storage cost effective. The simplest and most common ways of ensuring a file''s
    integrity is to generate a hash value at the time the file is generated and to
    store this hash value on a read-only medium.


    A hash is the result of a mathematical computation performed on a set of data.
    This result, called a hash, hash value, or message digest, (ideally) unique and
    reproducible for a given input. In practical terms this is similar to a digital
    fingerprint for a set of data. If you were to generate a hash using the entire
    book “War and Peace” as input, you would get a particular hash value. Anyone who
    used the same hash algorithm with “War and Peace” would also generate the same
    hash value. If any single character were altered in the entire book, as period
    changed to the comma, the hash value would be different. A hash is a one-way computation,
    meaning there is no way to derive the original input from a known hash value.
    In the case of a log file, this means if you reviewed the log files at a later
    date, you could recompute the hash value using the log file as input and compare
    this with the original hash value that was generated when the log file was created.
    If the two hashes match, the log file has not been altered.


    There are many utilities for generating a hash value and many different algorithms
    that are widely used. Some algorithms are more “secure,” in that the odds of two
    different inputs producing the same hash value are smaller. SHA (secure hash algorithm)
    and MD5 (message digest 5) are commonly used


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_344_0.png)'
