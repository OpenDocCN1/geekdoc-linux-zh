    # Personal Firewalls


    Personal firewall is a term that refers to firewalls to protect the single host
    on which they reside. While many excellent firewalls are free versions of commercial
    software, you should read the license agreement for these firewalls carefully.
    In most cases, the free version extends only to home users and excludes use in
    a business environment. One example is ZoneAlarm, from Zone Labs (www.zonelabs.com),
    which comes in a free version as well as a commercial offering. The free version
    offers great control but is for nonbusiness use. Kerio Personal Firewall (www.sunbeltsoftware.com/Kerio-Download.cfn)
    follows a similar model, with the free version being “personal use only”. For
    any freeway products you find, and there are several excellent ones, be sure to
    review the license agreement carefully to ensure that you can deploy it within
    your organization legally. If you are unsure, consult your organization''s legal
    council to determine whether a given product license is suitable.


    # Windows Firewall


    Although it hasn''t been around for as long as the netfilter firewall (for Linux),
    the Windows firewall enjoys a similar advantage in that it is included with all
    modern Windows operating systems (Windows XP and Windows 2003).


    www.syngress.com'
