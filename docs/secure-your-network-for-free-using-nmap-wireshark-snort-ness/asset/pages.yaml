  md: '# Introduction


    When it comes to securing networks, the first items that come to mind are firewalls,
    which are the primary gatekeepers between an organization''s internal network
    and the outside world. While a properly implemented firewall can be one of the
    most effective security tools in your arsenal, it shouldn''t be the only tool.
    The "defense-in-depth" means that you should have multiple layers of security.
    Using a defense-in-depth configuration, if one component of your defense failed
    or defeated, there would still be a variety of fallbacks to protect your network.
    With the availability of increasingly affordable firewalls such as the popular
    Linksys cable/digital subscriber line (DSL) router, using the free firewall alternatives
    may not be as effective for some. With a little effort, you will find the free
    alternatives are more configurable, allowing greater flexibility and control than
    the "home office" grade offerings.


    This chapter focuses on securing your network perimeter. Remember that although
    the most common way to implement a firewall is between an internal network and
    the outside world (often the Internet), you should not limit yourself to placing
    firewalls only on the network edge. A firewall should be in any place you want
    to restrict the flow of traffic. With the current trend of security breaches originating
    from the inside of the network (often employees or ex-employees), companies are
    increasingly relying on firewalls to isolate and filter traffic between portions


    This chapter reviews some basic firewall concepts and briefly discusses the different
    architectural ways to implement a firewall. Most of this chapter covers the installation
    and configuration of firewalls to run on both Windows- and Linux-based systems.
    Finally, once the network edge has been adequately secured, we discuss how to
    create controlled, secure paths through the perimeter for remote connectivity,
    including administrative access or remote office/work from home scenarios.


    # Firewall Types


    No discussion of firewalls would be complete without a discussion of the different
    types of firewalls. This is particularly true in this context, because it allows
    you to better understand exactly where in the spectrum the free firewall


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_39_0.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Protecting Your Perimeter • Chapter 25


    offerings lie. In the networking sense, a firewall is basically any component
    (software or hardware) that restricts the flow of network traffic. This is a scientifically
    broad definition to allow for all of the ways people have chosen to implement
    firewalls. Some firewalls are notoriously limited in capability and others are
    extremely easy to use.


    Within the realm of firewalls there are many ways to restrict network traffic.
    Most of these methods vary in the level of intelligence that is applied to the
    decision-making process. For example, to permit or deny traffic based on which
    network device is the sender or recipient, you would use a packet-filtering firewall.
    In reality, the simplest packet filtering firewalls can typically make decisions
    based on the source Internet Protocol (IP) address, the destination IP address,
    and the source and/destination port number. While this type of firewall might
    sound overly simplistic, if you have a server running a Web site for the Internet.
    In any likelihood, the traffic that you need to allow the server uses a destination
    port of Transmission Control Protocol (TCP) 80 or 443; thus you could configure
    your firewall to permit only that traffic. These ports are used for HTTP and HTTPS,
    respectively. Because the server is available for the Internet, you can''t filter
    traffic based on the source address or source port, which will be different for
    each connection.


    The primary drawback with a simple packet filter is that the packet-filtering
    firewall has to rely on very primitive means to determine when traffic should
    be allowed (e.g., synchronous [SYN] or acknowledgement [ACK] bits being set).
    While this was adequate in the early days of the Internet when security was not
    as of a concern, it doesn''t work anymore. It is trivial to set the bits on the
    packet using freely available software to make the traffic look like it is a reply
    to another connection. Thus the stateful inspection firewall was born of necessity.Type
    of firewall monitors all connections (inbound or outbound), and as the connection
    is permitted (based on the firewall''s configured rules) it enters this connection
    into a table. When the reply to this connection comes back, even if it uses a
    port that the firewall was not previously configured to permit, it can intelligently
    realize the traffic is a response to a permitted session and permit the traffic.


    Unfortunately, as the firewalls get better so the methods hackers use to circumvent
    them. Suppose you have configured your firewall perfectly and


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_40_0.png)'
