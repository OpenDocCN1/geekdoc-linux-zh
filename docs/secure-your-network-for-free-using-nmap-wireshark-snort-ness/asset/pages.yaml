  md: '# # Configuring Snort on a Linux System


    The process of installing Snort on a Linux system is very close to the process
    on a Windows system. The primary difference is that the default (relative) paths
    in the snort.conf file are much more likely to work without modification on the
    Linux system. You will need to download the latest version of Snort that is appropriate
    for your system. If you are using Fedora Core 5, this is as simple as performing
    `yum install snort`, or you could download and install the .rpm from snort.org.


    # ## Configuring Snort Options


    The next step is to configure the various options that determine how Snort will
    behave using the Snort configuration file. The configuration file is excellently
    documented and very easy to use. To get Snort working the way you want it to,
    follow these simple steps.


    +   1. Start by opening the main Snort configuration file. By default it will
    be located at /etc/snort/snort.conf.

    2. Configure the HOME_NET variable, if desired, by removing the # from the line
    you need. # is a comment indicator in the Snort configuration file. The HOME_NET
    variable defines which networks are the "trusted" internal networks. This is used
    with the signatures to determine when the internal network is being attacked.
    By default, HOME_NET is set to any network with the `var HOME_NET` any line in
    the snort.conf. Setting this to accurately reflect your internal address space
    will reduce the number of false alerts you receive. A common example would be
    `var HOME_NET 192.168.1.0/24` or perhaps `var HOME_NET [192.168.1.0/24,192.168.2.0/24]`.

    3. Configure the EXTERNAL_NET variable if desired. This is the network you expect
    attacks to come from. The recommendation is to set everything *except* the HOME_NET
    using the following: `var EXTERNAL_NET !$HOME_NET`. (Default: `var EXTERNAL_NET
    any`).

    4. Next, define what servers are running services. For example, by setting HTTP_SERVERS
    to only specific servers, Snort will only


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_255_0.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Configuring an Intrusion Detection System • Chapter 24


    watch for HTTP attacks targeted at those servers. If you wish to see attacks targeting
    servers that are not running the affected services, leave the defaults, which
    are to watch for attacks directed towards any internal servers. (Default: var
    DNS_SERVERS$HOME_NET If you had a Web server running on 192.168.1.11 and 192.168.1.12,
    you could tell Snort to only look for HTTP attacks targeting that server by setting
    the following variable: var HTTP_SERVERS [192.168.1.11/32,192.168.1.12/32].


    +   5. If you desired, configure the specific ports that services are available
    on. For example, the default for HTTP is defined on the following line: var HTTP_PORTS
    80. Similar to defining the servers in the preceding section, this will tell Snort
    to only look for attacks targeting specific ports. With the default configuration,
    Snort will ignore any HTTP attack to port 8080. Again, this setting will help
    focus where Snort looks for different types of attacks.


    +   6. If you are interested in detecting the usage of AOL Instant Messenger (AIM),
    the various IP addresses of the AIM servers are defined in the snort.conf file.
    This is done because the IP addresses change frequently, and by using a variable,
    the rules don''t have to be updated each time the IP address changes. If you do
    not want to trigger based off AIM usage, don''t worry about changing these IP
    addresses.


    +   7. Download the Snort rules from http://snort.org/rules. Click Download Rules
    on the right-hand side of the page. On the Download Rules page, scroll down to
    the section labeled Sourcefire VRT Certified Rules (unregister release). Download
    the latest ruleset.


    +   8. Extract the rules (and /docs) to the location of your choice, typically
    /etc/snort/rules and /etc/snort/docs.


    +   9. Configure the RULE_PATH variable, which tells Snort where to find the rules
    used for triggering events. You can use a relative path such as var RULE_PATH
    ..rules or an absolute path such as /etc/snort/rules.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_256_0.png)'
  merge: -1
