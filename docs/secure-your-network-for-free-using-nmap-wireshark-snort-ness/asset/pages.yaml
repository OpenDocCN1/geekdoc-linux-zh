  md: '# Chapter 4 · Configuring an Intrusion Detection System


    Edit the snort.conf to include your new rule by adding the following line:

    include SRULE_PATH/TESTING.rules. As a last step, edit the snort\c\snort-msg.map
    file. This file provides a mapping between snort alert messages and alert IDs
    or names. Custom alerts should use an ID number of more than one million. Add
    the following line at the end of the file:


    100001


    Placing the ID number is the minimum requirement for Snort not to output an error.
    You can certainly fill in all the other fields, following the existing message
    maps as a guideline. When this is done, you will need to stop and restart Snort.
    The console output of a single ping and reply:


