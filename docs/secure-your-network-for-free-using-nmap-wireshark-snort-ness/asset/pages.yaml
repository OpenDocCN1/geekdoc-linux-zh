  md: '# Chapter 3 • Protecting Network Resources


    Q: How long should I wait before applying patches to my protected hosts?


    A: This is really going to depend on your environment, and the requirements will
    likely be different for different resources within your environment.

    The development servers probably deserve a different patching schedule than the
    critical Web portal that makes the majority of company revenue.

    Another important determining factor will be the severity of the issue(s) the
    patch addresses. If the patch remotely exploitable security hole, applying it
    will be more urgent than if the patch addresses a vulnerability that can only
    be exploited while someone is logged in to the machine locally.'
