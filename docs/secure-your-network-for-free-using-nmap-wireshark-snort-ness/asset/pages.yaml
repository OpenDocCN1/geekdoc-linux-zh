    # The Savings of Using Free Security Solutions


    The following section discusses how a free security solution can save you money.
    The primary savings are obvious: you didn''t pay for the product; however, there
    are additional benefits. This section offers a detailed look into the benefits
    of using free software. By evaluating the expected savings and costs, you can
    form a more practical, accurate picture of what will be gained by implementing
    a free security solution.


    # Purchase Costs


    The purchase cost is one of the largest cost savings of using free software. The
    best example of this is with firewalls. A small Linksys or Netgear firewall costs
    around $20.00 to $50.00. They use almost no power, support port forwarding, performing
    Network Address Translation (NAT), act as a Dynamic Host Configuration Protocol
    (DHCP) server, and are stateful packet filters. Suppose you use Linux and netfilter
    to run a firewall for free. Odds are it will cost more to pay for the employee''s
    time to set up the Linux firewall'
