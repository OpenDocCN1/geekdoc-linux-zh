  md: '# Presenting the Business Case for Free Solutions • Chapter 1


    # Training Costs


    Training costs are one of the biggest expenses when it comes to implementing a
    free solution. First are the direct training expenses (e.g., sending someone for
    classroom instruction). Your options may be limited when it comes to training
    for free software solutions. In most cases, training does not exist in a fixed
    format (i.e., you probably won''t find a class on netfilter firewalls). Instead,
    you may be able to find applicable training indirect, such as in classes on general
    Linux os or administration.


    Another training cost is materials (e.g., books). Aside from this book, there
    will likely be areas you want more specialized information. For example, if you
    are implementing a Snort intrusion detection system (IDS), this book will guide
    you through setting up Snort. A small library covering the specific software you
    have deployed is a worthwhile investment.


    You will also incur training costs, such as not having access to an employee during
    training. This time away from work is an expense, because you are paying for an
    asset that isn''t available. The same is true if the employee is on-site and “self-training.”


    # Hardware Costs


    A security appliance is a device that doesn''t require a computer and is only
    used for its intended purpose, while all of the free solutions require a system
    to run on. Frankly, the requirements are usually minimal; therefore, you can often
    use an old PC. However, connectivity requirements could make using the system
    in a nondictionary security risk. Rarely does a system require enough resources
    to make using the same host for any other functional impractical (e.g., the Snort
    IDS logging capability can quickly eat up disk space, leaving little to no resources
    for other programs).


    If there are no old systems available, many online retailers offering older systems
    at affordable rates. A large portion of the cost for low-PC’s is often for the
    operating system. Many retailers offer affordable systems that either include
    Linux as the operating system, or without an operating system installed. These
    allow you to purchase a relatively modern


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_18_0.png)'
