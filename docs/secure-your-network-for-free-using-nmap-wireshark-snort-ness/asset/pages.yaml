  md: '# Chapter 5 • Managing Event Logs


    on rotation and retention periods, work closely with your legal department to
    ensure that you are meeting all your obligations.


    **Q**: Which hash algorithm is the best?


    **A**: As with many security questions the answer is, “it depends.”The more secure
    hashing algorithm tends to be more computationally intensive. The more may not
    be noticeable with a small input file, but with a very large file, the time it
    takes to generate the hash can be significant. Thus, a more practical answer would
    be,“use the most secure hashing algorithm that you can without adversely impacting
    the system processes.” From a security perspective, the “risk” with a hash algorithm
    is that the same message digest can be produced from two different inputs. Newer
    algorithms and longer hashes decrease this risk. So, in order of preference, use
    SHA-512, SHA-256, SHA1, SHA0, and MD5. Perform some testing and see which ones
    operate at an acceptable speed for your application.'
