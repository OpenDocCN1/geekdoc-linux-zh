    # Super Scanner


    Sometimes you want something simpler than Nmap, or maybe you want to use something
    that doesn''t require the WinPcap drivers to be installed in order to run it on
    Windows. SuperScanner doesn''t require the WinPcap drivers and doesn''t even require
    a setup program. All you need to do is download the program from www.foundstone.com/resources/proddesc/superscan.htm,
    extract the executable from the Zip file, and run it. The latest version (version
    4) will run on Windows 2000 and Windows XP. The main window is shown in Figure
    6.5 with some results from systems it found.


