  md: '+   14. Edit the paths for the dynamically loaded libraries in section #2 to
    point to the proper path. Depending on your Linux distribution and installation
    method, these paths may not be the default. For example, on Fedora Core 5, using
    yum to install Snort, the settings would use the following paths: `dynamicpreprocessor
    directory /usr/lib/snort/dynamicpreprocessor` and `dynamicengine /usr/lib/snort/libfs_engine.so`.
    If you receive an error when to run Snort, along the lines of Unknown rule type:
    `dynamicpreprocessor directory` or Unknown rule type: `dynamicengine`, then your
    installation of Snort is not configured to use dynamically loaded processors.
    In this case, simply place a # in both of these lines to comment them out.


    +   15. The last section (#Step 6), contains various inline statements that specify
    the rules to be checked. Some rules are disabled by default, such as chat.rules,
    which is triggered by the use of various instant messaging clients. To enable
    or disable a given ruleset, simply add or remove a # at the beginning of the include
    line. This entry can be left as a relative path (for example, include RULE_PATH/local.rules)
    because the RULE_PATH variable will be expanded to make it absolute path.


    +   16. If you need any custom rules that are not included you can download rules
    provided by the Snort community from the Rules page on the Snort Web site. If
    you are looking for something unusual, might find it there without having to create
    the rule yourself.


    You are now ready to start Snort and see what it looks like in action. When you
    start Snort you can specify the interface to listen on using the -i switch as
    -i eth0. If you don''t specify, it will use the first interface. Use the -c option
    to tell Snort which configuration file to use. It could be useful to have multiple
    configuration files configured so you can quickly switch configurations for special
    circumstances. Youcould prepare different configuration files to home in on certain
    circumstances, segments, or more in-depth logging. Another important option is
    -A, which tells Snort what type of alerts to generate. The options are fast, full,
    console, or none.


