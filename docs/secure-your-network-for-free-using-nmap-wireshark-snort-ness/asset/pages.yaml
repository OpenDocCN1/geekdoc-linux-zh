  md: '# WARNING


    Depending on how your Internet connection is configured, if the Internet router
    NAT inbound traffic, traffic originating from the Internet or an external network
    may be NATed to an internal address. If this is the case, the external address
    would appear as an internal address from an IP subnet perspective and a Windows
    Firewall scope of My Network would still grant them access.


    The Advanced tab (shown in Figure 3.21) has a few interesting settings of its
    own. Starting from the bottom of the window and moving upward, the setting with
    the simplest options is the Restore Defaults button. Of course, this will restore
    the default settings for the Windows Firewall, which is useful if the configuration
    is messed up and starting fresh is the easiest option. The next section is ICMP.
    By clicking the Settings button, you can configure a list of checkboxes, with
    each one corresponding to another type of ICMP packet. If you highlight a particular
    option a description will be below. The descriptions are perfectly helpful, and
    in most cases you shouldn''t need to edit these unless you have some specific
    needs. The Security Logging section also has a Settings button. Clicking the Settings
    button will allow you to configure dropped packets and successful connections
    to be logged. You can also specify the path for the log file and enter a maximum
    log size.


