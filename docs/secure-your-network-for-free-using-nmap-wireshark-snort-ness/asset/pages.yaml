  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: How do I know when I have found the best solution?


    A: The solution that is “best” today might not be tomorrow. There are certain
    leaders who will likely continue to be top picks for the foreseeable future, many
    other free solutions will come and go. The only way to make a good decision is
    to “do your homework,” and if possible, consult an expert in the area you are
    interested in.


    Q: If some of these free tools are so good, why doesn''t everyone use them?


    A: In the case of a large organization, the features or functionality of the free
    solutions lack are vital, so a commercial solution may be the only option for
    some. For smaller organizations for which a free solution can satisfy their needs,
    it typically comes down to not knowing what the options are. No one is paying
    to advertise free.products in computer magazines, so generally only the more experienced
    and knowledgeable information (IT) people know about all the available products.


    Q: Is free software really free?


    A: Not in every sense of the word. While the software itself may cost nothing,
    you have to consider the costs of the hardware required to run the software, the
    training required to implement the software, and the potential maintenance costs
    (in terms of man-hours and actual dollars) when considering a free solution. After
    you add all of this up, some free solutions can be very “cost-effective,” even
    if not truly free.'
