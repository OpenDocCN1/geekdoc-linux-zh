    the VPN. In the \OpenVPN\easy-rsa directory run build-client1, where client1 is
    the name you want to use for the first client connection. This is often the same
    as the users logon ID. When prompted, the common name should be unique for each
    client; and, again, the login ID might be a good choice for the common name. When
    prompted, it is recommended that you create a password for the client certificate.
    If you do not, anyone who obtains the certificate files can access the VPN.


    +   3. Move or copy the client1.key and client1.crt to the appropriate client
    host. The server does not need a copy of these files, but generally you would
    leave a copy on the server as a backup.


    +   4. In the client configuration file comment out the auth-user-pass line.


    +   5. Edit the .cert and .key directives that were commented out previously for
    password authentication. Configure both of these lines with the appropriate paths
    to the .cert and .key files you copied from the server. Remember to use double
    backslashes for the path.'
