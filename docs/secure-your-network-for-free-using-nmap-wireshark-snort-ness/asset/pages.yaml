  md: '# Chapter 2 • Protecting Your Perimeter


    # Other GUIs


    Although there are too many netfilter GUIs to cover them all extensively, we have
    tried to cover some of the best available. If none of the ones ever struck your
    fancy, or if you just like to experiment and see what else is out there, you might
    want to investigate some additional offerings. If you are running KDE look into
    Guardguard from www.simonzon.com/software/guardguard/#introduction, which is aimed
    at novice to intermediate users and offers the ability to define security policies
    based on logical groupings called network “zones.” The Turtle Firewall Project
    (www.turtlefirewall.com/) allows you to administer your firewall host via Web
    interface. While there is no substitute for a good understanding of the command-line
    configuration of iptables, for an uncomplicated configuration of these GUIs allow
    you to get your firewall up and running quickly and without having to read the
    iptables page.


    # Smoothwall


    Smoothwall (http://smoothwall.org/) is a firewall in its own category. First,
    let''s clarify some basic nomenclature. Smoothwall.org is the site for SmoothWall
    Express. SmoothWall Express is a free open-source firewall solution. Smoothwall.net
    is the home of SmoothWall Limited, which produces various commercial products,
    including a version of the SmoothWall firewall. SmoothWall differs from the other
    solutions covered in here that it is a dedicated firewall device. Other solutions
    using netfilter and optional GUIs to configure the firewall can run on a workstation.
    You can still use the firewall system as a normal workstation, but it''s not recommended.
    If you want to harden the firewall (as you should), you need to remove unneeded
    services and software from the system, and update all of the remaining software.
    SmoothWall takes a different approach in all of this is for you. When you install
    SmoothWall, it wipes out the filesystem and installs a secure version of Linux
    on the hard disk, along with the SmoothWall software. The SmoothWall firewall
    has no GUI on the system, only commandline access and administration via the Web
    management interface. SmoothWall is meant to be a firewall and nothing more.


    With that in mind, there are several advantages to this approach. Foremost, you
    don''t have to learn how to harden your Linux distribution so that it will be


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_91_0.png)'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Protecting Your Perimeter • Chapter 27


    secure enough to use. Further, unlike installing Linux and then learning iptables
    syntax, with SmoothWall you don''t to know Linux. The installation menu walks
    you through configuring the minimum settings so that you can use the Web interface
    to configure the firewall functionality. You don''t need to know anything about
    Linux to get SmoothWall up and running (though it hurts). The fact that the SmoothWall
    firewall is already stripped down and unneeded software and services are removed
    means that you can get the maximum performance out of an old computer without
    spending a lot of time trying to tweak a full (normal) Linux distribution.


    # Installing Smoothwall


    The simplest way to install SmoothWall Express is by downloading the .iso image
    from http://smoothwall.org/get/. It is advisable to read along with the manuals
    located at http://smoothwall.org/docs/. The documentation provided SmoothWall
    Express is exceptional among free products, and all of the installation screens
    are shown in the PDF installation guide. This installation method is used as we
    walk through installing SmoothWall Express.


    +   1. After burning this image to a CD-ROM, boot the prospective firewall with
    the CD-ROM in the drive.

    2. The boot screen will look typical of many Linux distributions. We will warn
    you that installing SmoothWall Express will delete all data on the hard drive.
    To continue with the installation, press ENTER.

    3. The installation then shifts into a DOS-like GUI interface. Navigation is accomplished
    using the TAB, arrow, and ENTER keys. You will be prompted to insert the CD and
    press OK. This is done in case your system cannot boot from a CD-ROM and you used
    a boot floppy to begin the installation. Either way, ensure that the CD-ROM is
    (still) in the drive, highlight OK, and press ENTER.

    4. You have to select OK twice before the hard disk will be partitioned and all
    data lost.

    5. When prompted, select Probe to allow the installation routine to see what network
    cards can detect.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_92_0.png)'
