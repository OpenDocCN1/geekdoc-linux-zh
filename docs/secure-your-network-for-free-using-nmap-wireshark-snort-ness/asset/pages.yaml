  md: '# Chapter 2 • Protecting Your Perimeter


    # Option Summary


    +   - -p specifies the protocol to match (works with “!\”). iptables -A FORWARD
    -p tcp will add a rule to match any TCP packet to the FORWARD chain. iptables
    -A FORWARD -p ! will match any packet that was not TCP.


    +   - -s specifies the source address to match (works with !). iptables -A FORWARD
    -s 192.168.1.99 will match any packet with a source address of 192.168.1.99. iptables
    -A FORWARD -s ! 192.168.1.99 will match any packet that did not have a source
    address of


    +   - -d specifies the destination address to match (works with !). iptables -A
    FORWARD -d 192.168.1.99 will match any packet with a destination address of 192.168.1.99.


    +   - -i specifies the network interface that the traffic was received on (works
    with !). iptables -A FORWARD -i eth0 will match any packet entering the eth0 interface.


    +   - -j specifies the target. iptables -A FORWARD -p tcp -j DROP would create
    a rule at the bottom of the FORWARD chain that will DROP any TCP packet.


    +   - -o specifies the network interface that the traffic was sent out of (works
    with “!\”). iptables -A FORWARD -o eth1 would match any packet leaving out the
    eth1 interface.


    +   - -t specifies the table to manipulate. iptables -t nat -A POSTROUTING -p
    tcp -j DROP will add a rule to the bottom of the POSTROUTING chain in the NAT
    table, to DROP any TCP packet.


    If you don''t specify the -t option, ipt assumes you are working with the filter
    table.


    +   - -v specifies to be verbose. iptables -L -v lists all of the rules and includes
    packet counts per chain and per rule.


    +   --line-numbers specifies that the rule list should be numbered:


