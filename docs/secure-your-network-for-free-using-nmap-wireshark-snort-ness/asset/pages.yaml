  md: '# Testing and Auditing Your Systems • Chapter 6 37


    It is worth pointing out that a vulnerability scanner is just that, a scanner
    with no real intelligence. Some unscrupulous security companies will run the same
    scanner you can run for free, print the results, and present them to their customers
    along a bill. The vulnerability scanner has to depend on the human user to configure
    it intelligently. And even when something is found, it is a human that must make
    a judgment call as whether or not that item is truly in your current environment.
    In some cases, further investigation will be required to determine if the findings
    are valid and set a true risk. What follows is a discussion of Nessus, one of
    the best free vulnerability scanners today.


    # Nessus


    Nessus has been around for a long time, since 1998, in fact It is available for
    Linux, FreeBSD, Solaris, MAX OS X, and Windows (2000, XP, and 2003). The Windows
    product is currently listed as beta, but it ran with no issues for me. You can
    download it from www.nessus.org/download/. While free, the most current version
    (Nessus 3) is no longer open source. The Nessus system comprises two components:
    a server and a client. The server process does the actual scanning, while the
    client is used to configure and run scans to view the results of a scan. Nessus
    is a very feature-rich application, which can perform more than 10,000 different
    types of checks via download-plug-ins. The licensing is relatively generous, but
    there are some circumstances whereby you must purchase a license. In short, you
    can always scan your own personal systems for scanning third-party networks some
    additional licensing will be needed. There are also option for installing Nessus
    on an appliance to be provided to customers and for providing Nessus as an OEM
    product. For full details on the licensing of Nessus, refer to the licensing FAQ
    located here: http://nessus.org/plugins/index.php?view=faq.


    You should periodically scan your hosts for vulnerabilities according to the requirements
    of your IT security policy.You should also perform a vulnerability scan any time
    changes are made to your network or hosts which could inadvertently create a security
    risk, either due to human error or due to an interaction between the changes and
    the existing security controls. A significant change could include adding a new
    feature like enabling terminal services, performing an upgrade, or installing
    a new service


