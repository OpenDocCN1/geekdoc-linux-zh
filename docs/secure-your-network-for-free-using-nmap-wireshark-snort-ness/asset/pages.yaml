    view and number view, displays the respective views for the file permissions listed
    above. We will explore them all, but for now, just make note of them.


    The user ID and group ID bits are also referred to as the SUID and SGID bits.
    In simple terms, the SUID bit causes a given file/application to run as the user
    who is the owner of the file, rather than the user who is executing the file.
    Most often this is used to allow a normal,privileged user to run a script or process
    requiring root access. The first thing that comes to most people''s minds is that
    this would be a big security risk. Well, like many other things, it can be a big
    risk, but it can also increase security. An obvious example of a big security
    risk would be one the application or script is interactive, or allows manipulation
    of other system parameters. Obviously, allowing an unprivileged user to run a
    file manager as the root user would be a big risk. Many security scanners will
    report the number of SUID files which are also owned by root for exactly this
    reason. The following command would search the entire system from the root of
    files that are owned by root, and list the SUID bit set:


    ```

    find -type f -perm /4000 -uid 0 -ls

    ```


    Find is the utility that is doing the searching (man find at the Linux command
    prompt for more information). The type -f option says to look for normal files
    (instead of named pipes and other, more unusual options). The -perm option specifies
    that we are looking for the SUID bit being set. The -uid option specifies the
    owner as user ID 0, which is always root. Finally,-ls tells find to format the
    output such that any unusual characters are escaped. This is for your protection
    in case any filenames are using nonprinting characters that could cause problems
    within your terminal. You can use the same command with -perm /2000 to list the
    SGID files belonging to the root group.


    SUID can increase your security as well. Suppose you have a program or script
    that you want the user to run, to perform some administrative task automatically.
    If this program requires root permissions to function properly, you would have
    to give the user the root password, or run the program yourself. Instead, the
    administrator can set the program SUID bit and make root


