  md: '# Introduction


    You may be looking for inexpensive ways to solve a security problem and want to
    know more about the free tools that are available. This book will guide you to
    some of the best free solutions. In some environments, taking the initiative and
    implementing any type of security measures can get you in trouble; even with the
    best planning, problems can arise. This chapter will help you gain the support
    you need in order to implement a cost saving solution.


    Whether you are the person implementing the changes and need to “sell” the solution
    to your manager, or you’re the person making the decisions and need to understand
    the true implications of a particular “free” solution, this chapter will help
    you find solutions to your security problems. This chapter discusses some of the
    hidden costs associated with free solutions and clarifies what comes from those
    solutions. This chapter also addresses the fact that in most cases, an apples-to-apples
    comparison between a free package and a commercial product is not feasible. With
    all of this information, you should be in a good position to propose a solution
    and back up your choice with some compelling business arguments.


    # The Costs of Using Free Security Solutions


    In the case of security solutions, few things are in free. And while you may not
    pay for a security solution itself, there are costs associated with implementing
    a solution that are not obvious. In most cases, your security needs dictate which
    solutions are appropriate; if there is not a free solution available, you have
    to use commercial tools. Fortunately, there are a lot of high-quality free solutions
    available. The section included in subsequent chapters is aimed at providing a
    spectrum of solutions with a variety of sophistication levels. If you dive headlong
    into implementing a free solution without adequate knowledge and research, it
    could end up costing more than if you had purchased a commercial solution.'
