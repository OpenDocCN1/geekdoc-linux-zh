    # Using the X Window System


    X window is the underlying management system for most UNIX and Linux GUIs. It
    takes an entirely different architectural approach than a Microsoft Windows system,
    in that the X Window system is set up in a client-server architecture from the
    beginning, similar to VNC. When reading the X Window documentation, you will find
    that X Window uses the terms server and client in the reverse of what would seem
    intuitive, meaning the server is where the display is being generated, not the
    remote machine you are connecting to. Most current implementations are based on
    the work of the X.Org foundation'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Chapter 2 · Protecting Your Perimeter


    (http://x.org/), which is the open source implementation of the X11 protocol.
    A closely related project is the XFree86 Project (www.free86.org), which is the
    open source version of the XWindow system (which uses the X11 protocol). X11 is
    the protocol that is used to transfer information about the GUI between the server
    and the client. The end result of these design decisions is that much like Windows''built-in
    terminal server support, two Linux systems can remotely access each other via
    a GUI virtual desktop.


    You can configure the X Window System to permit connections from remote systems
    without any third-party software. While this works, the evolution of desktop Window
    Managers and common software packages have rendered this method inefficient. A
    much robust way to accomplish the same thing is using NX technology developed
    by NoMachine, which is a highly optimized protocol to make X sessions available
    remotely. NX is available for free (client and server) from www.nommachine.com/download.php.
    Commercial variants are also available. You can see the differences between versions,
    and thus see what the limitations of the free version are at www.nommachine.com/features.php.
    The big limitation is that NX Free limits you to only two concurrent connections.
    In most cases it won''t be of a unless you are trying to use it as a full-blown
    terminal server solution rather than just a remote access mechanism. An opensource
    version of the nx server is called FreeNX and is available from http://freenx.berlio.de/.
    FreeNX does not support relaying sounds to the client (the NoMachine server does).
    This is the recommended server and the one used in the following examples.


    To set up the FreeNX server, download and install FreeNX using whatever method
    is appropriate for your Linux distribution. For Fedora Core 5, you yum install
    freenx.(yum package installer for Fedora Core 5) will automatically check for
    install any dependencies. The aforementioned command also installed the core nx
    package, and expect as dependencies. In the case of Fedora Core 5, there is no
    need for any installation. Depending on the distribution you are using, the installation
    may be more involved. Most of major distributions should have packages available
    that make the installation relatively painless. You will need to have SSHD listening
    on port 22 in order for NX to work properly.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_135_0.png)'
