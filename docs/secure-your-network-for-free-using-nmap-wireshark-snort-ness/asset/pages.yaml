  md: '# Hardening Linux Systems


    When you install a given Windows operating system (OS), you will always get the
    same basic installation for that version of OS, including the default security
    settings. Basically, all versions of Windows XP are same out of the box, unless
    you have customized the installation yourself. With Linux, this isn''t true. Some
    distributions you install are very secure as part of their default configuration
    and others are very insecure. At a high level, the hardening steps remain the
    same for Linux for Windows, but some of them may be done for you to a greater
    or lesser extent. The following list represents the high-level hardening tasks
    that you would need to perform:


    +   * Remove unnecessary software.

    * Disable unused services/daemons.

    * Patch the operating system and any remaining software.

    * Configure user and group accounts to provide only the minimum required access.

    * Tighten operating system parameters (login requirements, timeouts, and so on).

    * Configure network access to permit only the minimum required connectivity (IP/ports).


    These are the same steps you would perform to harden a Windows system. A special-purpose
    distribution, such as the Smoothwall firewall, performs most of these except for
    applying the latest patches as part of the basic installation. At the other end
    of the spectrum are distributions that emphasize user friendliness, such as Ubuntu
    or Red Hat. If a default install is performed with these types of distributions
    there will be a lot of hardening left to do. As such, they may not represent the
    best choice in a high-security environment.


    # General Hardening Steps


