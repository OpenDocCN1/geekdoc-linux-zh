    Our first task is to rename email.txt to working.txt so that if more messages
    are generated the batch file is running, it won''t cause any problems. The email.txt
    file could contain multiple syslog messages, so we iteratively pipe each line
    of email.txt to a temporary file called lastline.txt. Because we are sending each
    line to the same file, we''ll only be left with the syslog message in lastline.txt.
    We then use FOR to grab the facility and servity from the syslog message in lastline.txt
    and place that in the subject line of our e-mail. In the body of the email we
    use blat.exe to send working.txt, which will have all the syslog messages generated
