- img_proc: true
  md: 'The common difference of opinion is whether you should place the sensor outside
    your external firewall or inside.

    Undeniably, the traffic of the most security relevance is the traffic that has
    managed to traverse your firewall and get into your internal network. These are
    the potential attacks, probes, and whatnot need to be inspected and monitored
    closely to make sure the network is not compromised.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered, browse to www.syngress.com/solutions and
    click on the “Ask the Author” form.


    Q: How do I configure Snort to send e-mail alerts?


    A: You don’t. Snort includes no native way to send e-mail alerts. This was an
    intentional decision because processing e-mail alerts would place an undue burden
    on the Snort process, possibly resulting in dropped packets and missed alerts.
    Instead, the simplest way to accomplish this is with a log parsing tool, such
    as Swatch. Swatch and other utilities for log management are covered in more detail
    in Chapter 7,"Network Reporting and Troubleshooting.”


    Q: How do I turn Snort into an IPS instead of an IDS?


    A: Snort (www.snort.net/) is designed to automatically adjust the rules on a firewall
    based on certain Snort alerts. It is a mature tool with relatively active development.
    Also check the user-contributed section of the Snort Web site for an assortment
    of utilities at www.snort.org/dl/contpatches/. Snort itself also has limited capability
    to take actions, specifically when acting in “inline mode.” Refer to the documentation
    at www.snort.org/docs/snort_htmanuals/htmanual_260/node7.html for more on Snort’s
    native IPS support.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_276_0.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 4 • Configuring Intrusion Detection System


    **Q:** How do I make a Snort rule to trigger for “X” application’s traffic?


    **A:** Start by searching online; you can usually find the rule already made for
    you. If not, the general procedure is to do a packet capture (with Wireshark,
    for example) and then review the packets. The tricky part is to identify all the
    packets (or if not all, at least the initial packet) has in common. Some string
    that can uniquely identify that application’s payload option. See the online Snort
    manual for more information on rule option fields.


    **Q:** How can I make my Snort sensor more secure?


    **A:** There are many ways. First, configure a firewall on the sensor itself to
    protect itself. You would only filter traffic with a destination of the sensor,
    so that you don’t accidentally filter the traffic you want to trigger alerts on.
    You can also have Snort listen on an interface without an IP address; this will
    make it a lot harder for an attacker to target the sensor. (See the main Snort
    FAQ for instructions on how to do this.)'
  merge: -1
