    # Hardening Windows Systems


    Windows systems have a reputation for being insecure out of the box. This reputation
    is certainly less justified than it was once. Microsoft has made a lot of progress
    toward a very difficult goal, which is to make its operating systems inherently
    more secure without diminishing the user''s experience. After all, a secure system
    that is unusable isn''t going to be of much value. Like much minimum password
    requirements, there is a point at which your efforts to increase security will
    actually backfire and reduce your overall security level. Because of this, you
    should always maintain a balance to increased security measures with overall system
    usability and functionality. Again, doing this properly will require an in-depth
    understanding of the needs and processes of the organization.


    The first thing to do in terms of hardening a system is to assess the current
    security posture of the device in question. Only after you know how the system
    is configured can you determine what you need to do. Chapter 6 provides some good
    guidance on how to assess the current security posture of your network, while
    this chapter will focus on the tools that you can use to configure settings in
    an effort to harden your network resources.


    # General Hardening Steps


    All the possible steps that you can take to secure a Windows host could fill (and
    have filled) entire volumes. The contents of this chapter should start you on
    your way with the basic hardening steps, and hopefully point out a few tools you
    might not have known at your disposal. Be aware that in some cases, certain policies
    and standards may influence or affect other areas directly. For example, if you
    use biometric scanners for logon on all workstations, a "secure password" policy
    becomes practically moot. Under those circumstances, the password policy would
    end up applying only to special devices that were not able to take advantage of
    the biometric scanner. The exception, of course, is a requirement to use multifactor
    authentication, such as biometrics and a password. In this way, all of the hardening


