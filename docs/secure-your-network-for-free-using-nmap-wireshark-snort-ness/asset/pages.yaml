  md: '# Chapter 3 • Protecting Network Resources


    +   Install the ClamAV package and any dependencies.


    +   You will need to create a ClamAV user and group. Typing the command `useradd
    -s /bin/false` will create the ClamAV user and will set the user shell to `/bin/false`.
    On Fedora Core /home/clamav will be created automatically, but you will want to
    verify that this is true on your distribution. If the directory is not created
    automatically, you will need to create the directory manually.


    You can now run the command-line scanner using the syntax `clamscan <target>`.
    As an example, `clamscan -r /home` would scan all the directories and all subdirectories
    (-r specifies a recursive scan). Clamscan includes a large number of command-line
    options. The most significant ones are explained in the following list (you can
    enter clamscan --help for a more detailed explanation of man the many command-line
    options):


    +   -infected. This causes clamscan to list only infected files in its output.


    +   --bell. This will cause a bell to sound played if a virus is found.


    +   --recursive / -r. This will cause clamscan to scan recursively—that is, to
    scan all subdirectories of the specified path.


    +   --move=<directory>. You use this to specify that infected files are moved
    to a particular location. Typically normal users have no access to it, effectively
    placing the file in quarantine.


    That''s all there is to the on-demand portion of Clam AntiVirus. As soon as you
    run any of the example commands, or any on-demand scan, clamscan will notify you
    that the definitions are out-of-date. You can see this in the following example:


    ```

    [root@localhost ~]# clamscan /input.txt

