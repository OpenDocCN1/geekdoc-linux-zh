  md: '# Chapter 7 • Network Reporting and Troubleshooting


    MRTG has the benefit that there are no limitations on the number of systems you
    can collect data from. Although throughput is the default metric, if you know
    the OID of the metric you wish to monitor, MRTG can collect and record historical
    data for that well. Some good examples might be disk space, CPU utilization, network
    errors, and available memory. As an example of specifying the target OID, here
    is a target specification:


    Target[RTR]: `1.3.6.1.2.1.2.2.14.1&1.3.6.1.2.1.2.2.20.1:pass@192.168.1.25`


    The OID format is `<OID for first line in graph>&<OID for second line in graph>`.
    In this example, you would be specifying a target device at IP address 192.168.1.25,
    using the SNMP community string of “pass.” The OID to read would be 1.3.6.1.2.1.2.2.14.1
    (input error counts) for one line on the graph, and 1.3.6.1.2.1.2.2.20.1 (output
    error counts) for the other line. The last number is the interface number. The
    input error count on interface #2 “RTR” would be displayed on the graph page as
    a device name.


    As you can see, getting simple graphs in HTML page using MRTG is pretty painless.
    With a little work, you can configure MRTG to graph a wide range of useful information.
    I would highly recommend doing some reading on the MRTG page with third-party
    documentation (http://oss.oietker.ch/mrtg/3party.en.html). This page has many
    articles describing how to use MRTG in various circumstances. There are also links
    to many graphical utilities to help manage your configuration files. For increased
    granularity in graphs (as small as one-minute intervals) and more aesthetic graphs,
    check out RRtool at http://oss.oietker.ch/rrtool/.


