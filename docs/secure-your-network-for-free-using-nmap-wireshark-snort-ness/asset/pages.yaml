  md: '# Chapter 5 • Managing Event Logs


    the only person who needs to approve of a new log management policy, or whether
    you need to get your manager to sign off on it, the process remains largely the
    same—start with a plan. The tasks required to apply these strategies fall into
    two broad, develop a log management policy, and develop an implementation strategy.
    Both of these will likely be developed concurrently and each will affect the other.


    Your implementation plan will need to include an analysis of what hosts will be
    included in the log management scope. The numbers of hosts, physical location,
    and the volume of log data are likely to produce will impact how you implement
    your logging policy. You will then need to make a decision on when and where to
    centrally collect the log files. The location should be strategic, accounting
    for communications links and other performance metrics. The frequency will include
    both how often to collect the logs and how frequently to run any analysis on them.
    Perhaps most importantly, you will need to decide what format the log files are
    processed in, Windows event log format or syslog format. You need to choose which
    log management tools to use, which will likely involve testing in a lab environment.
    You will need to plan for such administrative concerns as how to preserve the
    confidentiality of the log data both in transit and in storage.


    Your log management policy will be a high-level outline of how logs should be
    managed. This document probably won''t go into detail on how to accomplish specific
    objectives; it will specify only what those objectives are. The policy should
    address the requirements for ensuring confidentiality of log data. Remember to
    address confidentiality of log data both in transit and while in storage. Provisions
    may need to be made for off-site storage much like with server backup tapes. Be
    in mind that in some cases there may be regulations that apply to these requirements.
    In some cases, log integrity may need to be addressed as well. This is especially
    likely if there are regulations that affect your organization, such as HIPAA.
    You will need to develop a strategy around event alerting as well. This could
    include notifying the security group if the log messages indicate a possible intrusion
    attempt or a different person/group if the log messages indicate a key server
    has problems. The alerting hierarchy will need to be documented and the configuration
    of the monitoring software configured to reflect what is documented. As you can
    see, the policy you define need to include log management sign-off.


