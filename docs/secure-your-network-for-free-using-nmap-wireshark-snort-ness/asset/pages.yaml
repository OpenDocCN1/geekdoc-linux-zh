    ## MIB.name  incl/excl  MIB.subtree  mask

    ##

    view all-mibs      included .1

    view limited      included .1.3.6.1.2.1.2

    ```


    This section defines a view, which basically defines a portion of the MIB The
    all-m view includes the entire MIB tree, whereas the limited view includes only
    the .1.3.6.1.2.1.2 section, which consists of the network interfaces and related
    metrics. You can configure a given view''s MIB subtree to be included or excluded.
    By excluding, you can omit sensitive portions of the MIB tree. You can use the
    MIB name instead of the number if desired. In the example used above, you could
    use included .1.3.6.1.2.1.2 or you could use this command: included .iso.org.dod.internet.mgmt.2.interfaces.
    The mask is an optional bit on the MIB tree that specifies which bits to match
    for the indexed access. The default (without the mask) is to match only the bits
    that are indicated in the view.You would commonly use the mask to match a particular
    row or rows in a table. In this example, the all-mibs view has access to .1 and
    everything under.


    ```

    ## MIB.group.name  .sect.model  sec.level  prefix  write  notify

    access  Full_Group ""  any  noauth  0 all-mins none none

    access  RO_Group ""  any  noauth  0 limited none none

    ```


    The final section is where you define access for a group to a view. The context
    is optional and no context is the default. For SNMP v1 or v2, the sec.level needs
    to be noauth. Under the read and write column, you define the view. The notify
    column is where you would specify the capability to send traps, except the notify
    view is not currently implemented.


    After making your changes, you will need to restart the snmpd for the changes
    to take effect. What does all this accomplish? The MIB is accessible from the
    host using snmpploc the community string, which will provide read access to the
    entire MIB tree. Users from the 10.0.0.0/8 networks, which are assumed to be the
    bulk of the user base, can access the MIB using the snmpcommunitycommunity string,
    and they will have read-only access to the network interface subtree only. Hosts
    on the 192.168.1.0/24 subnet, a network management subnet for example, can use'
