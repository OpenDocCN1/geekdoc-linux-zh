- img_proc: true
  md: 'Because it is enabled by default, most users have some firewall protection
    in place even if they don''t know it. While fairly ubiquitous, the Windows Firewall
    is very simple in its configuration and capability. It cannot perform any advanced
    packet manipulation and is really designed only to protect the host on which it
    is running. You can access your Windows Firewall navigating to Start | Settings
    | Control Panel | Windows Firewall. The General tab has only three settings: an
    On setting, Off setting, and the Don''t allow exceptions option. If you select
    Don''t allow exceptions, any selections you make on the Exceptions tab are simply
    ignored.


    The Exceptions tab is where all the fun happens. The Windows Firewall operates
    as personal firewalls by default, which is to allow the local system to communicate
    outbound unhindered. The only traffic that is allowed inbound to the interface
    is reply traffic to sessions that were established bound. In this way, your surfing
    and other network access is unimpeded, but others cannot initiate a session to
    the protected system. This is usually perfectly adequate; however, if you happen
    to be running any type of server on the local machine, no one will be able to
    initiate a connection to the port. In other words, if you have a Web server running
    on the protected system, the Windows Firewall would block connection attempts
    to port 80. The Exceptions tab allows you to configure an exception to that normal
    behavior and allow a particular port. Figure 3.19 shows the Exceptions tab.


    # Figure 3.19 Windows Firewall Exceptions


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_196_0.png)'
