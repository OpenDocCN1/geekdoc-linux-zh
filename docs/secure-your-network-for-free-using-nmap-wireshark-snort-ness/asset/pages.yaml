  md: '# Testing and Auditing Your Systems • Chapter 6


    them to do. In this situation the lack of accurate documentation is costing you
    or your company real dollars, not only to pay for the outside help to learn the
    lay of the land, but possibly in lost revenue while the solution is delayed. These
    costs can get outrageously if you''re not careful and are the sort of things management
    will take notice of.


    Another situation where quality documentation can really be valuable for an audit.
    There are the obvious types of audits, Sarban-Oxley, SAS70, and related types
    of business audits.You might not be impacted by these types of regulations and
    requirements. There are other audit-like scenarios that may affect you. If you
    are looking to partner with another business entity in such fashion that it will
    require network connectivity between the two entities, the other business partner
    will likely require documentation related to your network infrastructure. They
    will want to review it to make sure it is a secure configuration. If you cannot
    provide them with the documentation you requested could impede the business venture,
    again causing a loss of revenue.


    Okay, so I''ve had on the value of good network maps enough. The next question
    is what exactly constitutes “good” network maps? At its most basic form, simply
    having all the important data in place and being accurate is all that is required.
    Beyond that, there are characteristics that are nice to have, such as consistency.
    A consistent look and feel will go a long way for being able to quickly look at
    the diagram and understand the information it contains. This could mean a consistent
    set of icons or symbols, and consistent placement of key information, who the
    document owner is and different people generating the diagrams will have a stylistic
    impact on their work, if they get too disparate you can end up having a lot of
    difficulty sorting out one document from another.


    You should also consider developing a stance on when it is appropriate to use
    logical diagrams or physical diagrams. Logical diagrams tend to be more high level
    and show the overall data flow and devices’ general connectivity, while a physical
    diagram typically specifies on cables, ports, and so on. Each type of diagram
    has its place. A physical diagram is generally of more use when it comes to troubleshoot
    a connectivity issue, while a logical diagram often is clearer for nontechnical
    staff, such as project managers and upper management. To some degree it just come
    down to personal preferences; neither type is “wrong,” and either both types may
    be appropriate


