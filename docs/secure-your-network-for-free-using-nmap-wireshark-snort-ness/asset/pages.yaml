    I have edited the actual IP addresses and host names, but you can try the traceroute
    command to a few hosts in your network. Because it is very common to use some
    indication of the geographic location in the naming convention for routers, others
    this will tell you where the host is located. In Figure 6.3, hop #6 would lead
    you to believe the host was in Orlando, Florida. Assuming you had a managed switch
    in Orlando, you could then Telnet to the switch (in this example a Cisco 2900XL
    switch) and view the table of MAC addresses. Referring to our previous Nmap scan,
    we can know the MAC address of our mystery system is 00:08:02:32:8A:4c, so we
    can use the following command to filter the MAC table to show the address we are
    interested in:'
