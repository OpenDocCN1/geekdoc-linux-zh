    # Scanline


    If you happen to be looking for something even lightweight, there is an excellent
    product available. Scanline, which is also available from Foundationstone in its
    free tools set (www.foundstone.com/resources/prodesc/scanline.htm), is a command-line-only
    TCP scanner. This can be especially valuable if you do not have remote GUI access
    to the system you want to scan from. From an SSH session, Scanline would be a
    perfect fit. Using Scanline is rather simple. Entering sl from the Scanline directory
    will result in the help screen shown in Figure 6.9.


