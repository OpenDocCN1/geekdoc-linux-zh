  md: '# Introduction


    No matter how secure your network is, sooner or later something will happen that
    wasn''t supposed to. If you don''t take steps to identify security events, your
    only notice that something has occurred might be when there is a production outage
    or other undesirable disruption. At that point you are in a reactive mode instead
    of a proactive one. It would be preferable to know the instant security event
    takes place so that you have a head start on correcting the issue and minimizing
    any damage. The two most common ways to keep yourself informed of security events
    across your network are through intrusion detection systems (IDS) and by monitoring
    event logs. In this chapter we will demonstrate how to install and configure a
    first-class IDS on both Linux and Windows systems, and we will discuss the various
    tools for managing event logs, including syslog and Windows event log formats.


    # Intrusion Detection Systems


    Intrusion detection systems do exactly what it sounds like. They spot undesirable
    activity, and typically, send an alert to someone so that action can be taken.
    The undesirable activity does not necessarily have to be from an actual intrusion,
    it can be any activity that you don''t want to occur, such as the use of a file
    sharing program on the corporate network. The most common way to implement an
    IDS is by having a system monitor and (sniff) all traffic over a given link. The
    system compares the traffic with a database of known signatures for undesirable
    traffic. This is an example of a signature-based IDS. Some IDS are anomaly based,
    which means the IDS attempts to build a list of “normal” traffic from your actual
    network data, and then it flags anything that doesn''t fit the list of normal
    traffic that it has built. The process of identifying the normal traffic can be
    very time consuming and requires a lot of human intervention and judgment. Some
    systems combine the two methods.


    Anomaly based and signature based are both terms that describe how the undesirable
    traffic is identified. In addition to this, there are also different terms to
    where the IDS is doing the monitoring. A host-based IDS (HIDS) inspects the activities
    on a particular system. In this way, you can monitor your key servers, such as
    a Web server, and look for attempts to brute'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Configuring an Intrusion Detection System • Chapter 4


    force a password. A network-based IDS (NIDS) inspects the actual packets flowing
    across the network. The difference in methodologies between the two is significant.
    Sometimes malicious traffic at the host level may be indistinguishable from legitimate
    traffic at the network level.


    As a final bit of vocabulary worth mentioning intrusion prevention systems (IPS).
    An IDS serves only to detect the malicious activities; it then notifies someone
    that human judgment can be applied and the needed steps taken in response to the
    malicious activities. An IPS is more powerful in in addition to merely detecting
    malicious activities, it has the capacity to take action on its own to prevent
    the malicious activity from being successful. As an example, if IDS can detect
    a user who uses ICQ messenger on the corporate network. If configured to do so,
    the IDS can send an e-mail, or even page the network administrator who can take
    any needed action. The IDS could also merely the occurrence to be included in
    a report at the end of the month. At its most invasive, the IPS can, upon detecting
    the connection, send a TCP RESET packet to the ICQ server and tell it to terminate
    the connection. The user would only see that the application would not work properly.


    Such authority to take direct action without human intervention may sound appealing,
    but such capabilities could be used with extreme caution. A packet could be generated
    with a false source IP, to make it look like another machine is trying to connect
    using ICQ, and a reset packet would dutifully be sent to the incorrect machine.
    A little creativity and a malicious user could turn your IPS against you and cause
    problems on your network. The real drawback is that no matter how well programmed
    it is, the IPS is generally done very gradually and with very conservative settings.
    There are Snort modules that provide IPS functionality, but we won''t be covering
    those in this book.


    # Configuring an Intrusion Detection System


    When it comes to IDSes, there really isn''t a very large playing field for free
    solutions. That''s not to say that there isn''t an excellent IDS, just that there
    is only one, Snort (http://snort.org/). Snort is an excellent, free, signature-based
    NIDS. You can take advantage of a subscription service, which enables


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_232_0.png)'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'you to download newer signatures as they are released, but it is not a requirement.
    You can also create your own rules to match on various portions of the IP packet
    revel easily. The configuration of Snort is a little different when it is installed
    on Linux versus when it''s installed on Windows, I will demonstrate both. If you
    would like to pursue more in-depth reading on Snort see Snort Intrusion Detection
    and Prevention Toolkit (Syngress Publishing, 2006).


    # Hardware Requirements


    The prevailing theme in this book is to improve security without requiring a direct
    purchase of anything. In the majority of cases there will be an old PC lying around
    somewhere to use. In the case of an IDS, this device will need to see traffic
    at chokepoints in your network, possibly placing the IDS host, or an interface
    on the host, outside the protected perimeter. For this reason, the IDS hosts are
    often dedicated systems. You would need to weigh carefully if you are using the
    IDS host as a normal workstation in addition to performing the IDS function.


    The point of all this is to touch on the fact that your IDS, probably more than
    any other system in this book, you will need to ensure you have hardware with
    adequate resource to do its job. Most of the tools mentioned here are simply other
    processes that could run on any system and usually require few resources. The
    IDS has the potential to log a large amount of data and process a lot of network
    traffic. These functions require both memory and hard drive space. This doesn''t
    mean you can''t use an old PC as your IDS. It also means you want to give your
    IDS (and your firewalls) “best” of the old hardware you have available. After
    you implement the IDS, monitor the system resources closely until you gain a level
    of comfort with the resources that are required.


    # Placing Your NIDS


    When it comes to implementing an NIDS, the single biggest factor in its effectiveness
    is its placement within the network. The value of the NIDS is in identifying malicious
    traffic and obviously it can''t do if it can''t see the traffic. This means you
    want to place the NIDS in a location to maximize the data it will see. In a very
    small office where there is only one switch or hub, Depending on your objectives,
    you may place


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_233_0.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Configuring an Intrusion Detection System • Chapter 4


    it inline with the Internet connection only, so that you are inspecting traffic
    only to or from the Internet. In a larger installation, you may need to place
    multiple network cards in the NIDS so that it can inspect traffic from several
    checkpoints in your network. Also see Chapter 7, “Network Reporting and Troubleshooting,”
    for additional discussions on sensor placement.


    > Notes from the Underground...


    Further Considerations

    Remember that an IDS is also a target for a hacker just like any other system,
    and even more so. As such, the IDS host system should be hardened and locked down
    as much as possible. In addition to being a target because it can alert administrators
    to their activities, the hacker might target the IDS system itself because it
    often contains logs with valuable information in it about various systems. The
    IDS also has the capability of capturing packets that match its rulebase, and
    these packet dumps can contain valuable data as well. Don''t neglect securing
    your IDS or you may be creating a security liability instead of the asset you.


    Be cognizant of the fact that if you choose to install multiple network cards
    to monitor multiple segments you have the potential to create an alternate data
    path that enables traffic to bypass a firewall. As part of your hardening of the
    IDS host, you must ensure that routing is not enabled so that the IDS cannot forward
    traffic from one segment that it is monitoring to another. There are multiple
    approaches to protect against this happening. The simplest is to use a network
    tap instead of just plugging in a normal network card. A tap is a specially designed
    piece of hardware that will only listen to traffic but not transmit. Because it
    is hardware, there is no possibility of hacking the configuration or making a
    mistake in the configuration and accidentally allowing routing. Unfortunately,
    network taps are not free. Disabling routing, ensuring the host has no static
    routes, and disabling any routing protocols are the free ways to ensure that you
    don''t create a path around a firewall. Figure 4.1 illustrates bypassing the firewalls
    using your IDS.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_234_0.png)


    www.syngress.com'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Chapter 4 • Configuring an Intrusion Detection System


    # Figure 4.1 Bypassing the Firewalls Using the IDS


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_235_0.png)


    The first dotted line (data flow #1) represents the desired (secure) data flow.
    Traffic from outside can only terminate on a server in the DMZ, and traffic going
    into the internal network can only come from a server in the DMZ. With this configuration
    traffic from the Internet can never pass all the way through directly to a host
    on the internal network. The second data flow, #2, represents how an incorrectly
    configured IDS is used to route traffic from the outside (untrusted) network into
    the internal network.


    When it comes to placement of your IDS, you need to be aware of the difference
    between a switch and a hub. A hub operates by sending any traffic it receives
    on any port to every other port. Therefore, when using a hub, the IDS will see
    all the traffic passing through that hub, which is usually what you want for your
    IDS. A switch is more advanced than a hub, and most new devices are switches.
    A switch listens and learns what machines are connected to which port. It then
    uses this information to construct a forwarding table.


    *www.syngress.com'
