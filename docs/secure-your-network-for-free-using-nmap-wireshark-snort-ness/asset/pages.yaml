    portability and wireless access points becoming so cheap and prolific, you no
    longer need a car to locate them. Simply walking around with your laptop looking
    for wireless signals has become known as war walking. There are Sites, and groups
    of people, who make it a pastime to locate unsecured (i.e. publicly accessible)
