    if you join in enough, it shows the individual SSIDs of the wireless access point.


    # NetStumber


    NetStumber, which is short for Network Stumber (www.netstumber.com), is a tool
    to detect wireless using 802.11a, 802.11b, and 802.11g. In addition to simply
    passively listening for indications of wireless devices, NetStumber will send
    out various types of traffic in an attempt to solicit additional information from
    the device. In practice, NetStver is very easy to use. The only real concern is
    making sure you are using a wireless card that NetStumber supports. Although there
    are no guarantees, typically sticking with cards that use the Lucent Orinoco chipset,
    or Cisco cards will provide good performance and compatible hardware. Senao also
    offers a higher power card with sensitivity that I have used myself very successfully.
    Unfortunately, there is no comprehensive list of supported cards so a little research
    before buying can really pay off here. The NetStumber site does contain some useful
    information on supported cards, though. When you start up NetStumber you will
    see a screen similar to the one shown in Figure 6.11.


    If everything is working properly, NetStumber will start up and produce a list
    of detected devices. If you aren''t getting any results and you should be, navigate
    to Device at the top of the window and see if the proper network card is selected.You
    can change the selected card without stopping the scanning. The number of results
    you get will vary greatly depending on the quality of the wireless card and antenna
    you use.'
