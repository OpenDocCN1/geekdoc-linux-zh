- img_proc: true
  md: '# Managing Event Logs • Chapter 5


    Although much of the operation of SSH port forwarding is the same as the SSL tunnel
    port Tunnel creates, there are a couple of differences. By default, the SSH port
    forwarding is just that. It is the forwarding of a port on an established SSH
    tunnel. The encrypted SSH tunnel is established first, using the normal SSH TCP
    port of 22 unless you specify a different port. This tunnel is set exactly the
    same as if you were going to connect for remote command-line access. In addition,
    SSH will listen for and forward connections on the additional port you have specified.
    The primary disadvantage of SSH for port forwarding is there is no command line
    method to specify the password. This is an intentional design choice on the part
    of the SSH developers to increase security. They specifically did not wish to
    provide a simple means of including passwords in scripts and batch files. This
    requirement user interaction makes SSH a better candidate for interactive sessions
    than service-based connections like syslog. As you can see, however, it is very
    easy to set up on a system that already has SSH configured properly.


    # Configuring IPsec


    Because IPsec is an industry standard, specifically designed for interoperability
    between different vendor systems, it is a popular choice for implementing encryption.
    Current Linux kernels have IPsec support built in, and there are other packages
    that provide their own implementation of IPsec as well. For these examples we
    will assume you are using the Linux kernel native IPsec support. Follow these
    steps to configure IPsec on a Linux host.


    +   1. If they are not already installed, download and install the IPsec Tools
    from http://sourceforge.net/projects/ipsec-tools. These tools provide a simplified
    interface to configure the various IPsec settings.

    2. Edit the /etc/racon/psk.txt file. This file holds the pre-shared (AKA “secret”)
    keys. In the previous example we choose “password” as your pre-shared key. (This
    isn’t a secure password; you should use a high-quality password for a production
    environment.) The format of the file is <identifier> <key>. In our example we
    would add the following line to the file and save the new file.


    ```

    192.168.1.99 password

    ```


