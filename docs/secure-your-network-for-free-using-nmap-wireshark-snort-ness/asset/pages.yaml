  md: 'Protecting Network Resources • Chapter 3 189


    # # Antivirus Software


    Antivirus software is required on all systems. Most computers these days come
    with antivirus software installed, typically with a limited duration of updates
    for the virus definitions (often as as 30 days or, at best, a year). Unfortunately,
    many systems are never updated and continue running the out-of-date virus signatures.
    While an out-of-date antivirus program is still better than any antivirus program
    at all, it will not offer you much protection from the latest virus threats. Whichever
    antivirus methodology you use (Automatic Updates, live Web scans, manual updates),
    you will need to ensure that the signature files are maintained and remain current.
    Several of the best free antivirus programs have license agreements limiting their
    use to home or personal computers, specifically excluding a business environment.
    However, there are still some excellent alternatives.


    # # Clam AntVirus


    Clam AntVirus (www.clamav.net) is an open source, free antivirus program with
    a lot of commercial-grade features. Clam was natively written for use on UNIX/Linux
    systems, but a Windows port also is available. Clam provides a command-line scanner
    for spot scans or scripted scanning. This is the primary way Clam was intended
    to be used. There is also an (experimental) on-access scanner, similar to what
    you''d find in most commercial products. Even includes a utility to update your
    signature files automatically. You can view the latest online documentation at
    www.clamav.net/doc/latest/html. Because Clam AntVirus is one of the few antivirus
    solutions available without stipulation that it be for “personal” use, I will
    discuss using it on both Linux and Windows systems.


    # # Installing Clam AntVirus on Linux


    You should be able to download the needed files to install Clam AntVirus from
    your standard repositories. If they are not available, you can download the base
    packages from www.clamav.net and install them manually. After installation, there
    is some configuration required. Follow these steps to Clam AntVirus running:


