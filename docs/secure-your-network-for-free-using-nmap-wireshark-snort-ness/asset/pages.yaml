    The operation of SuperScan is rather straightforward. To scan a subnet, simply
    enter the starting and ending IP address and click the -> button to add it to
    the scanning queue. If you enter the same IP address and starting and ending IP,
    you can scan a single host. A third option is to click the -> button next to Read
