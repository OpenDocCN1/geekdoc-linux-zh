  md: '# Inadequate Documentation Can Exacerbate Problems


    There are still ways an inadequate change management system can cause problems.
    Imagine a co-worker installs a new switch, touches the connectivity, and then
    heads home. The next day, an entire group of systems become unavailable. You suspect
    that all the systems might be connected to the new switch but there is no documentation
    of the change. You don''t know which systems are using the new switch, or what
    ports they are connected to. You now have to spend precious time trying to learn
    the current environment before you even begin to troubleshoot the real issue.
    This is an example of how the change itself might not be the cause of an outage,
    without proper documentation and procedures in place, changes can still negatively
    impact the functioning of the network. To mitigate these risks, the best practice
    is to develop a change management strategy.


    # Change Management Strategy


    So now we know that change management is a necessity, how exactly one go about
    implementing a change management strategy? A good change management strategy will
    provide you with the tools that are needed to implement and manage change effectively
    and safely.Your change management strategy should include the following elements:


    +   - Change Review

    - Change Scheduling

    - Change Documentation


    The first step to implementing changes in a controlled fashion is to review and
    assess the changes that are needed. In some cases, this may be a relatively informal
    process conducted by a single individual. In a larger organization, this could
    actually be implemented by a committee and include formal meeting minutes are
    made available to upper management.You will need to find a level of sophistication
    that suits the needs of your organization. The purpose of this phase is to identify
    the changes that are needed, determine how badly they are needed, and determine
    what level of process'
  merge: -1
