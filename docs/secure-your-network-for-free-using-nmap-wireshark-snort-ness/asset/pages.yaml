    # Linux Firewall Operation


    Before discussing the specific commands used to configure the Linux firewall,
    we will cover some basic Linux firewall vocabulary and how the firewall operates.
    Netfilter filters the firewall logic, and iptables is the program that uses to
    modify the rules that the firewall uses. (See the netfilter home page at www.netfilter.org/)
    These rules (or ACLs) define the rules to permit or deny packets and how to react
    to denied packets. The current iptables use both tables and chains. *Tables* are
    the blocks of processing where various actions are performed on the packets. Different
    tables process different chains.*Chains* are a set of rules (or ACLs). There are
    four built-in tables: *nat, mangle, filter,* and *raw*, each of which processes
    different chains (see Figure 2.4).


    # Figure 2.4 Netfilter Tables and Chains


    | Net Table | Mangle Table |

    |---|---|

    | PREROUTING Chain | PREROUTING Chain |

    | POSTROUTING Chain | POSTROUTING Chain |

    | OUTPUT Chain | INPUT Chain |

    | | FORWARD Chain |

    | | OUTPUT Chain |

    | Filter Table | Raw Table |

    | INPUT Chain | PREROUTING Chain |

    | FORWARD Chain | OUTPUT Chain |

    | OUTPUT Chain | |


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Protecting Your Perimeter • Chapter 2


    The following tables and chains are not listed in any particular order, as a given
    packet may be impacted by multiple tables and chains as it is processed. The primary
    built-in chains are INPUT, OUTPUT, and FORWARD. In addition to these, you can
    create your own user-defined chains. Capitalizing the names of the chains is a
    common convention, but is not required.


    A brief summary of the roles the tables and chains play is included for reference.


    +   - Nat Table This table is referenced with a packet that is used to create
    a new connection.


    +   - PREROUTING This chain is processed as soon as a packet is received and before
    any routing decisions are made.


    +   - POSTROUTING This chain is processed before a packet is sent to an interface
    but after any routing decisions have been made.


    +   - OUTPUT This chain is processed for packets generated locally.


    +   - Filter Table This is the default table that is used when the iptables command
    is used to modify the rules, and the command does not specify an alternate table.
    This is where the bulk of a firewall''s processing is consumed.


    +   - INPUT This chain is processed for packets destined for the local system.


    +   - FORWARD This chain is processed for packets passing through the local system.


    +   - OUTPUT This chain is processed for packets generated by the local system.


    +   - Mangle Table This table is used for any specialized packet alterations that
    are needed. Examples are performing Network Address Translation (NAT) or manipulating
    various bits within the packet.


    +   - PREROUTING This chain is processed on incoming packets before a routing
    decision is made.


    +   - POSTROUTING This chain is processed last before a packet is sent to an interface.


