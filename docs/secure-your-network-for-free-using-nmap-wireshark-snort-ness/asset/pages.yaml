  merge: -1
  pgno: 291
- img_proc: true
  md: 'An additional tool provided by Microsoft is Log Parser, which can be downloaded
    from www.microsoft.com/downloads/details.aspx?FamilyID=890cd06b-abf8-4c25-91b2-f8d97cf8c07&lang=en.
    Log parser is of a general-purpose utility that can parse any log, not just Windows
    logs. With the increased flexibility comes increased complexity. The syntax for
    using Log Parser (a command-line utility) can be complex at times and resembles
    that of SQL queries. Entering logparserexe -h examples will generate a lengthy
    list of sample commands. If you review the documentation you will see that Log
    Parser is indeed very flexible and powerful but not for the faint of heart.


    When it comes to collecting your Windows event logs in a centralized location
    in their native event log format, you are really limited to using a Microsoft
    host. This is because a Linux system cannot work with the event logs directly.
    Because of this, if you want to manipulate, filter, or otherwise process the Windows
    event logs on a non-Microsoft logging server, the best bet is to export them in
    a commonly understood format, such as syslog. The use of syslog will be discussed
    in depth later in this chapter.


    # Analyzing Windows Event Logs


    Microsoft provides some tools that can be used to sort through the large volume
    of event logs you are likely to generate. Eventlog.pl (Windows 2000 Resource Kit,
    supplement 1) enables you to back up event logs, export event logs to text files,
    clear event logs, and query properties of event logs. Eventquery:pl (Windows 2000
    Resource Kit, supplement 1) enables you to display and filter event logs based
    on various fields such as time, date, source, category, ID, et cetera. Both of
    these could be scripted to sort through event logs and generate a listing of the
    most serious security issues. If you wish to do the processing on the host that
    is generating the logs, you can always use something like eventtriggers.exe (Windows
    2003/XP), which enables you to configure a process to be executed when certain
    events are logged.'
  merge: -1
