    Documenting changes is one of the most commonly overlooked or inadequately performed
    steps. This is especially true when the middle of a crisis and restoring functionality
    is the highest concern. A well-documented change is far more likely to be successful
    than that of not. This is true not only because someone may needing the documentation
    later, but also because the process of completing the required documentation may
    cause one to consider some facet that may otherwise been overlooked. Although
    change documentation will be different for each organization, there are some elements
    that all change documentation should have in common. These are outlined here:


    +   **Change Schedule** The change schedule will have the time and date the change
