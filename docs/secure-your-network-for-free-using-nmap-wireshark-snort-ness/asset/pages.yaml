  md: '# Chapter 2 • Protecting Your Perimeter


    when not using certificates. The script is a file or program that authenticates
    the users. Vie-file or via-env tells OpenVPN to pass the username and password
    to the script as an environment variable or as a two-line file.


    The default assumption for OpenVPN is that you will use PKI to authenticate all
    parties. If you want to use a user/password authentication mechanism, you are
    expected to configure OpenVPN so that it can pass the credentials out to a third-party
    process for verification. This modularity allowsOpenVPN to support many different
    types of authentication. If you are running on Linux, there is a PAM module you
    can use. If you are running on Windows, there is no built-in way to verify the
    authentication. You can use any script you like. If the script produces an error
    code zero, the authentication was successful; a one means it was not successful.
    There are many ways to verify the users, with only your imagination as a limitation.


    To elaborate, let''s look at a simple example. Suppose all you want to do for
    verification is see if a directory is present on the VPN server with the same
    name as the user''s (not secure, but this is an example of how the process works).
    You could create an "authentication" script called:check.bat. The line in the
    server configuration file would be auth-user-pass C:\check.bat via-env. This will
    cause the OpenVPN server to call the batch file every time a user logs in. The
    batch file will have environment variables of username and password. The authentication
    script would only need the following line to check for the appropriate directory:


    ```

    IF EXIST C:\%username% EXIT

    ```


    If the directory is present, an error level of zero would be returned to the OpenVPN
    Server and the user would be authenticated. For something more practical, you
    could use a psex utility, which is part of the pset package.These are free tools
    available from Microsoft at www.microsoft.com/tech/security/PsTools.mspx. The
    purpose of the tool is to allow you to remotely execute commands on Windows hosts.
    The key component we use allows you to authenticate, so if you try and run the
    command using the credentials the VPN client supplied, it will tell you if they
    are a legitimate user or not, based on their local Windows account. The check.bat
    file assumes all relevant files and utilities are in the system''s path. Check.bat
    contains the following lines:


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_117_0.png)'
