    so we will only cover at a high level here. The WinPcap drivers enable a greater
    degree of access and control to the network communications at the packet level
    than is available by going through the Windows network drivers. For this reason,
    many third-party utilities that do heavy packet manipulation use of WinPcap. Follow
    these steps to install Wireshark on a Windows system.


    +   1. Go to www.wireshark.org and download the Windows installer file.

    2. Run the setup executable. During the installation, you will be asked if you
    want to install the WinPcap drivers. Unless you already have


