  md: '# Chapter 3 • Protecting Network Resources


    # Introduction


    Chapter 2 focused on protecting the perimeter of your network, which typically
    means the Internet link, but it could include any link to the outside world, including
    connections to business partners and affiliates. This chapter focuses on how to
    secure the network-connected resources, such as servers and workstations. Many
    times an organization looks only at securing its perimeter, leaving its interior
    network wide open and unprotected. This hard-exterior-soft-squishy-approach is
    surely better than no security, but it is not the best approach. The best approach
    is defense in depth, which is the practice of applying security measures at all
    levels of the network. A solid defense-in-depth approach includes defenses at
    the outer perimeter—typically, firewalls and an intrusion detection system. It
    also includes defenses within the interior of the network, such as internal firewalls,
    network segmentation, and port-level access controls. Finally, at the core of
    the security onion are the actual network resources. You can protect these resources
    in a variety of ways, including via personal firewalls, antivirus software, spyware
    software, data encryption, and automated security policy enforcement. This chapter
    demonstrates how to accomplish all of these objectives and secure your network
    resources using only free tools.


    # Performing Basic Hardening


    All general-purpose operating systems will, by their very nature, come with weaker
    security settings than you might like. This characteristic is unavoidable, largely
    because the devices are general-purpose. To accommodate the wide variety of users
    the system might fulfill, some sacrifices must be made when it comes to securing
    the system. This isn''t necessarily true when it comes to special-purpose systems,
    which often come with highly secured and specially configured configurations so
    that the system can be used only for its intended purpose. You, on the other hand,
    know exactly what you want systems to do, so you can customize the general-purpose
    installation to be more secure in your environment. Securing a system is also
    referred to as hardening the system, which means to make it harder for an attacker
    to compromise it'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Protecting Network Resources • Chapter 13


    Regardless of what purpose the system serves, there are some common hardening
    steps that you should apply to all systems. There are high-level tasks, and as
    such, the specific implementation details are going to vary from system to system.
    These high-level hardening tasks have been outlined here. Any plan you develop
    to harden any network resource should address all of these issues in fashion.


    # Defining Policy


    You cannot possibly harden a system, at least not from an auditing perspective,
    if you do not have a definition and set of criteria for what constitutes “hardened,”
    or secure. Because of this, any hardening process actually starts before you configure
    anything on a device, with defining policies and standards. We touch some of the
    policy-related elements in Chapter 8. Your IT security team will clearly outline
    the objectives you are trying to meet. The related standards will provide measurable
    milestones to meet in pursuit of your objective. Your security standards are your
    yardstick for success and provide an objective measure of your progress. Although
    the words “make the server secure” imply certain objectives, they do not clearly
    define tasks; therefore, proving that you have “made the server secure” would
    be difficult at best. As such, having well-defined security standards will be
    to everyone’s advantage.


    The IT policies and standards of your organization employs should accurately reflect
    your organization’s specific needs. Many organizations will sell you an IT policy
    to use, or to use one as a shell for filling in your own specifics. This approach
    of using a “canned” policy has many challenges. What may not adequately cover
    the needs of another organization. The business model, type of business, and a
    host of other factors all contribute to making a good policy fit for your organization.
    You will always want your security policy and security standards to address some
    elements, as shown in the following list. Note that you need to represent each
    item in both policy and standards:


    +   **Classifying Data.** You must have some guidelines for the classification
    of data (public, confidential, secret, etc.) in order to define steps to secure
    the data. These classifications will drive subsequent stan-'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 3 • Protecting Network Resources


    wards, such as “confidential data must be secured on untrusted networks.” Also,
    such policy needs to define when data needs to be classified, and explain the
    different levels of data classification.


    +   **Information Confidentiality.** This policy and standard should define how
    to keep data private. This will include encryption requirements and methods. You
    also need to define the requirements concerning authorization and authentication.
    Any password requirements would fall into this category. This will also include
    procedures for granting and revoking access to data, and who has the authority
    to do so.


    +   **Information Availability.** This covers when and where redundancy mechanisms
    are required. This should spell out what levels of redundancy are needed under
    what circumstances, as redundant Internet circuits, RAID arrays, server clusters,
    failover hot sites, spare hardware, and UPS requirements.


    +   **Physical Security.** These will address requirements concerning granting
    access, revoking access, monitoring, and types of access. These could include
    when and where badge readers are required, when keys should and should not be
    used, office locks, access by service personnel, and so on.


    Generally speaking, the larger the organization, the larger the IT security documents
    will be. In some cases, you may get as specific as to have separate documents
    for “Physical Security for IT Datacenters” and “Physical Security for Retail Storefronts.”
    In a very small organization, the entire security policy may be one document,
    and the entire set of IT security standards another document. Your IT policies
    are an instance of “size doesn’t matter,” meaning that a large 100-page policy
    is not necessarily a “better” policy than a short, concise one. The key is that
    the policy fits your organization and addresses your needs.


    Except in an emergency situation (where you have vulnerable devices in need of
    immediate hardening steps), defining the appropriate policies and standards should
    be the first step toward securing your network. You will not be able to create
    a proper IT security policy without understanding the business first. The creation
    of these policies cannot be done in a vacuum. I have


