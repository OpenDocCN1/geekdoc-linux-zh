  md: '# Tcpdump


    Tcpdump is native to Linux and does not run on Windows systems. Tcpdump is installed
    by default on a large number of Linux/UNIX systems. Because tcpdump is so widely
    used, there is a wealth of support information and articles on the Internet on
    how to use tcpdump. The syntax and usage is nearly identical to that of WinDump,
    which we have already discussed, so what I will do here is demonstrate how install
    tcpdump on a Linux system if you find it isn''t already installed.


    In order to install the tcpdump package, obtain or locate the appropriate package
    file for your distribution. Different distributions may have packages specific
    to their configuration, or a given distribution may not support the newest version
    of a piece of software.Then enter the following command to install tcpdump (for
    this example it is version 3.9.4-1):


    ```

    -i tcpdump-3.9.4-1.i586.rpm

    ```


    If the installation is successful, you should see output similar to the following:...


    ```

    ################################################ [100%]

