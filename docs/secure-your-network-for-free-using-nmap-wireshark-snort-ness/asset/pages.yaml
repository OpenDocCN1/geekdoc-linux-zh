    you have installed, the configuration and usage is primarily via a Web interface,
    so the data will be presented in a uniform manner regardless of the underlying
    operating system. The ntop Web offers multiple versions of the package for download.
    For Windows, they offer the source files, in which case you must compile them,
    and they offer a pre-compiled binary distribution. The downside is that they have
    chosen to limit the precompiled version to capturing only the first 2000 packets,
    which makes it fairly useless to most people. This limitation does not exist in
    the Linux versions or the Windows source files. If compiling the source code is
    not a task you relish, you can download and install a precompiled version (meaning
    no 2000 packet capture limit!) of ntop from www.opentra.uk, whose tagline is “network
    management for all.” OPENXTRA Limited has made available precompiled files for
