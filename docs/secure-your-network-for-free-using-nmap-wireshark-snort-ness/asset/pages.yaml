  md: '# Summary


    Many security solutions are available for protecting your network resources. You
    should perform basic hardening on all network resources, from workstations, to
    servers, to routers and switches. After basic hardening, regular patches and updates
    are required to ensure that you are running the most secure software possible.
    Personal firewalls can serve as your first line of defense, providing logical
    access control over the contents of network packets. After the network is secured,
    your defenses turn inward, to protecting your assets from such things as viruses
    and spyware. Finally, we wrapped up the last line of defense—file encryption—to
    protect sensitive data even if your system or encrypted files fall into the wrong
    hands.


    # Solutions Fast Track


    # Performing Basic Hardening


    +   - Have an IT security policy in place so that you have a concrete set of standards
    against which to measure. Having specific objectives in mind when you are hardening
    systems will increase the odds of you achieving those objectives.


    +   - Requiring high-quality passwords is a balancing act between requiring a
    good password and making the requirements so difficult that the user ends up writing
    down the password in order to remember it.


    # Hardening Windows Systems


    +   - Renaming the administer account and disabling the user account simple and
    effective security measures.


    +   - Utilizing GPOs is a means to provide centrally managed security configurations
    to all of your protected hosts.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Hardening Linux Systems


    +   - Understand how file system permissions work in order to lock down access
    to the minimum that is required.


    +   - Employ TCP Wrappers to restrict network access based on applications (daemons)
    instead of based on network ports or IP addresses.


    # Hardening Infrastructure Devices


    +   - You must perform the same high-level tasks for infrastructure devices as
    for any other workstation or server.


    +   - Remember to disable the unneeded services that most managed infrastructure
    devices will enable by default.


    # Patching Systems


    +   - Remember that a controlled patch management methodology does not mean applying
    all the patches the instant they are released. You should conduct proper research
    and testing before making any changes to a system’s software.


    +   - Most modern operating systems (Linux and Windows) include tools to automatically
    check for software updates online and apply them if desired.


    # Personal Firewalls


    +   - Pay careful attention to the license agreements and make sure you are not
    using a great ‘personal’ firewall illegally.


    +   - Windows Firewall provides adequate controls for what types of access are
    permitted, but it only really is suitable as a personal firewall, not as a network
    perimeter firewall.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Providing Antivirus and Antispyware Protection


    +   - Free antivirus and antispyware software often prohibit use in a business
    setting. Verify that the license agreement allows you to deploy the software in
    your environment.


    +   - Both antivirus and antispyware software require regular patching with the
    current signature files in order to remain effective.


    # Encrypting Sensitive Data


    +   - You should use EFS only if a data recovery agent has been configured and
    enforced via group policy. Using EFS without a data recovery agent runs the risk
    of permanently losing access to encrypted data if the original user who encrypted
    it becomes corrupt or unavailable.


    +   - Consider carefully the ease of the encryption methods you choose. A high-quality
    encryption program that is hard to use probably will go unused.'
  merge: -1
