  md: '# Testing and Auditing Your Systems • Chapter 6


    The process of enumerating the shares can be done for all hosts on the entire
    subnet instead of a single host by checking the Shares check box on the Windows
    Enumeration tab, and is just one of the enumeration options SuperScan can use.
    By default SuperScan will perform all of the enumeration using no credentials,
    but if you click Options on the Windows Enumeration tab, you can enter specific
    account information that should be used for the connections. This is the same
    information you would get by using nbtstat -A 192.168.1.108. This shows the NetBIOS
    machine name (which can be different from the host name, though it rarely is),
    and the workgroup/domain the machine belongs to. Depending on how secure the system
    has been configured, you may be able to get a lot of information from these enumeration
    techniques. If the system is very secure you will get very little information.
    In general these checks carry little risk to the target system but as always the
    case, if a server disruption is not acceptable, you should avoid running these
    types of checks because there are some risk involved.


    SuperScan has fewer features than Nmap with the exception of the Windows enumeration
    options, but it is easier to use, and does not require running a Setup Wizard,
    any registry entries, or special network drivers. Because SuperScan doesn''t require
    any installation per se, and makes no changes to the registry, it can be very
    useful to have on a pen drive or shared network drive. This type of low-footprint
    tool can be very useful at times.


    # Angry IP Scanner


    A final GUI scanner that is rapidly on the rise in popularity is Angry IP Scanner
    (www.angryizer.com/ipscan/). It lies somewhere between SuperScan 3 and 4 in functionality
    and does not require any installation. Angry IP Scanner also has the advantage
    that it does not need the WinPcap drivers. Although Angry IP Scanner uses a deceptively
    simple interface (shown in Figure 6.8), it packs a lot of features into its small
    file size.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_366_0.png)'
