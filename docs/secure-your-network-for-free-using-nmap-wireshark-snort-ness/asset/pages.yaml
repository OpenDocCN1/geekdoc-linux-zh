    # Tools & Traps...


    Don’t Block Yourself

    Anyone who has spent any time configuring firewalls has learned the hard way to
    be very careful when configuring the rules. It is always a good idea to create
    the rules to PERMIT administrative access before any others. This is because soon
    as you configure the default policies to DROP, your SSH connection will no longer
    be permitted unless you added it to the access list. If you forget to do this,
    you could find that you no longer have remote access to your firewall after applying
    the policy. If that happens, you won’t be able to remotely update the policy and
    change ACLs.


    The next step is to tell FWBuilder where to find the SSH executables, because
    this is need to have SSH working on both the firewall and the FWBuilder console
    (assuming they are on different systems). (Detailed steps on using and configuring
    SSH are included in Chapter 2, “Securing Your Perimeter.”


    +   34. Select Edit | Preferences from the menu.


