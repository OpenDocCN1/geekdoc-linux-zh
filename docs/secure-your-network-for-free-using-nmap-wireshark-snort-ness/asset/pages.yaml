  md: '# Protecting Your Perimeter • Chapter 12


    If you check the running services in an attempt to verify that the FreeNX server
    was installed successfully (via chkconfig or the like), you will not see it. This
    is because the server FreeNX server does not sit and listen on a port for an inbound
    connection like most services. Instead, when you login via SSH (this is why you
    need SSDH running on port 22), it logs you in as a special user (NX). That user''s
    profile is configured such that it executes a process to start up the server and
    listen for the inbound connection.


