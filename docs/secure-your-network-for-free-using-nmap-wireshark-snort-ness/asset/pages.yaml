    # Configuring OpenSSH


    OpenSSH is an open source implementation of the SSH (Secure Shell) protocol. Originally
    it was intended as a secure alternative to other clear text protocols for remote
    administration, as Telnet or rshell, SSH includes a port forwarding option that
    enables it to function similarly to Stelnel. There are advantages to using OpenSSH
    over Stelnel, as the fact that you might already have OpenSSH installed to provide
    remote access. In those cases it would be one less piece of software that you
    needed to install and configure. Virtually every Linux implementation will come
    with OpenSSH installed by default, so you are more likely to have SSH on your
    Linux host than are Stelnel.


    We discussed the installation and configuration of OpenSSH in Chapter 2, “Protecting
    Your Perimeter,” so we will discuss only the configuration of OpenSSH here, under
    the assumption that you already have OpenSSH installed and working properly to
    provide remote command-line access. SSH port forwarding, in this scenario, is
    used like Stelnel. The SSH client establishes a connection to the SSH server and
    listens to local traffic destined for a port you specify. When it receives it,
    it will send the data encrypted, to an OpenSSH server, which in turn decrypts
    the data and passes it to the local port which is listening on. To setup port
    forwarding using OpenSSH, perform the following steps.


    +   1. On the Linux host, run the following command: user@192.168.1.99 -L 5140:192.168.1.99:7140.`


    +   2. Generate a sample syslog message and it should be received on the syslog
    server. If not, ensure that your Kiwi Syslog Daemon is still listening on TCP
    port 7140.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_319_0.png)'
  merge: -1
