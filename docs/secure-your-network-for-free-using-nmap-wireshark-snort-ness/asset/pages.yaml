  md: 'The

    udit policy settings can be found by navigating to the MMC

    Security Configuration and Analysis\Local Policies\Audit Policy. You can review
    Microsoft''s recommendations for securing Windows 2000, including audit settings,
    where: https://www.microsoft.com/technet/security/prodtech/windows2000/secwin2k/default.mspx.
    For Windows 2003 you can refer to this article: http://www.microsoft.com/technet/security/prodtech/windowserver2003/w2003hg/sgch00.mspx.
    Some of the most significant audit options are outlined below, with some recommendations
    for the most secure settings. Remember that enabling auditing you must have an
    adverse impact on the performance of the system host. You must carefully weigh
    the benefits of having the audit trail the resources that will be consumed by
    enabling various audit options.


    +   **Audit account logon events** There is a subtle yet imperfect difference
    between "audit account logon events" and "audit login events." The account logon
    events occur only when a local account is used to log on to another computer.
    For standalone servers in isolated environments, this event should never be triggered.
    You will see the most logs generated from this type of auditing when it is used
    on domain controllers.


    +   **Audit account management** Keep this set to Success, Failure, which tracks
    when passwords are changed, accounts are created and deleted, and group membership
    changes. The audit records generated by this setting should be closely monitored
    for signs of unauthorized activity, which can indicate a system compromise.


    +   **Audit directory service access** This will create event log entries for
    active directory events, which can be useful for spotting security issues.


    +   **Audit logon events** Set to Success, Failure.This is the single most important
    audit item. These audit events will let you know who and when someone is trying
    to log on, and perhaps even importantly, if they are succeeding. This setting
    will provide glaring evidence of brute force logon attempts and hopefully give
    you a jump start on investigating the source and taking correction.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Chapter 5 • Managing Event Logs


    +   **Audit object access** Keep at Success, Failure. This is another important
    audit setting. It will record access to objects such as printers, registry keys,
    folders, or individual files. Basically, it will audit anything with a system
    access control list (SACL).


    +   **Audit policy change** Keep at Success, Failure. This will trigger when someone
    modifies (or attempts to modify) your policies. An attacker who has successfully
    compromised a system may attempt to alter the system policy, to give him more
    freedom over the compromised system.


    +   **Audit privilege use** According to Microsoft, this setting will “Audit each
    instance of a user exercising a user right.”This might sound handy at first, but
    in reality it generates far too much data to be useful. If your environment justifies
    auditing on these events, setting it to audit only failures will usually suffice.
    Often this is set to No auditing on production systems and enabled only for special
    troubleshooting activities.


    +   **Audit process tracking** Similar to “privilege use,” this setting can generate
    a large amount of data and can have a significant impact on performance. In many
    cases you should set it to No auditing, unless you''re diagnosing specific problems.


    +   **Audit system events** Keep at Success, Failure. This event triggers only
    for events affecting the entire system, such as system start and shutdown or for
    events that affect the system security or security log.


    All of these will cause audit events to be generated and recorded to the event
    log. Another item for which it may be useful to generate audit events is access
    to specific files. With some files, and especially executables, you may find advantageous
    to configure the creation of audit events when the file is accessed. To enable
    auditing on specific files, follow these steps:


    +   1. In the left-hand pane, under Security and Configuration Analysis, select
    File System.


    +   2. Navigate to the directory containing the file you want to audit and select
    it in the left pane. In this example will use cmd.exe, located in %systemroot%\system32\.


