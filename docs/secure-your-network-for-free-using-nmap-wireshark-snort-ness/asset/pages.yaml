  md: '# Hardware versus Software Firewalls


    Another consideration is whether the firewall decision-making logic is run as
    software that sits on top of another functional system, or if the firewall is
    a dedicated piece of hardware. In the case of a Cisco PIX firewall, the smallest
    models are the size of a small box and there is no OS other than the PIX software.
    This is a hardware device used to perform the firewall function, also called a
    firewall appliance. The other alternative is that the firewall is not a dedicated
    box, but a software component. Many popular firewalls take this approach as well,
    such as a checkpoint firewall that can be installed on top of a Windows system.
    These two approaches, if you want a free solution the choice is made for you.
    I know of no free hardware-based firewalls, so you will be using a software firewall.


    # Configuring netfilter


    When it comes to Linux-based firewalls, there is only one choice, which is netfilter.
    This is partially because it was the best option for the longest time. Since version
    2.4, however, netfilter has been built into the Linux kernel. Even many commercial
    firewalls are running a modified OS with netfilter inside their own custom cases.
    Netfilter is the underlying software that makes up the built-in firewall on Linux
    systems. The netfilter component reads the contents of the network packets and
    decides to permit or deny network traffic. Many people incorrectly refer to the
    firewall as iptables, or prior to that, ipchains. In fact, iptables is the software
    command that is used to configure the rules that netfilter uses to make decisions
    to permit or deny traffic, and ipchains is the previous version of iptables. Even
    after you have settled on Linux as your base OS for your firewall, there are some
    additional choices to make before you start any configuring.


    # Choosing a Linux Version


    While all versions of Linux share some common characteristics, there will be differences.
    Depending on the specific Linux distribution, the differences could be significant
    and each distribution will likely offer some different sets of software packages.
    An excellent source of information on the different distributions is with.distrowatch.com.
    This site includes a brief summary of


