    were hosting a service on this system, such as a Web server, you would need to
    configure the INPUT chain appropriately. This configuration would afford any Linux
    system a minimum level of firewall security with virtually no impact to its overall
    functionality.


    # Simulating a Home Network Router


    With the basics of iptables configuration out of the way, let''s tackle a more
    practical example. For a typical firewall, there is very little traffic to or
    from the firewall itself. In general, the only traffic that would fit this profile
    would be administrative sessions to configure the firewall itself. The vast majority
    of a firewall''s traffic is passing through the firewall, and will thus be checked
    against the FORWARD chain. The following examples would configure the Linux firewall
    with the same access controls as a typical home network router such as a Linksys
    or Netgear router/firewall. This example assumes that 192.168.1.0/24 is the internal
    network on interface eth0 and the external interface is eth1.


    ```

    iptables -P OUTPUT ACCEPT

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -A INPUT -p tcp -s 192.168.1.0/24 -i eth0 --dport 80 -j ACCEPT

    iptables -A FORWARD -s 192.168.1.0/24 -i eth0 -o eth1 -j ACCEPT

    iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


