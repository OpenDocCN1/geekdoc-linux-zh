  md: '# Chapter 5 • Managing Event Logs


    Configuring your policies at the domain level also allows for some additional
    settings that are not available using a local computer policy object, such as
    event log settings. By navigating to Default Domain Policy | Computer Configuration
    | Windows Settings | Security Settings | Event Log | Settings for Event Logs,
    you can (and should) configure settings regarding how the event log itself is
    accessed. The following list summarizes the event log policy settings that have
    a high impact on security.


    +   * Rest Guest Access to <log type> This should be set to enable to prevent
    a potential attacker who manages to gain guest access from the event logs.

    * Retention Method for <log type> This determines what is to be done with old
    log events. The default event log will overwrite old events as needed. This method
    ensures that the system will not shut down due to an inability to log the security
    events, and this should be acceptable as long as you are collecting the important
    events on another secure system. The objective is to ensure that important security
    events cannot be lost because an attacker generates so many events that the incrementing
    ones are wrapped and lost. Shutting the system down due to running out of space,
    possibly even with the intent of creating a denial of service attack (versus legitimately
    attempting to break into the system) are most likely if you use the setting “Do
    not overwrite events (clear the log manually).”,


    # Generating Custom Windows Event Log Entries


    Granular per-file auditing enables a lot of control of when events are generated;
    however, suppose you were in the following scenario:You have a custom script or
    batch file that runs regularly and you would like to create event log entries
    based on the actions of that script. Auditing based on file could create an event
    any time cmd.exe was accessed, but it wouldn''t be able to know anything about
    the script files that cmd was accessed. In this case you need to be able to manually
    create event log entries containing your own custom data.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Managing Event Logs • Chapter 5


    Logevent.exe (Windows 2000 and Windows NT) and eventcreate.exe (Windows 2003/XP)
    will do exactly that. Various command-line switches will enable you to specify
    the event data, the log to write to (system, application, or security), the event
    source, the event type, and the event ID to use. The following is an example command:


    ```

    Eventcreate /T ERROR /ID 123 /L SYSTEM /D "Secure your network for FREE!"

    ```


    This would create an event in the system log of type ERROR, with an ID of 123,
    and the contents "Secure your network for free." Note that you cannot create custom
    events in the security log. Using this utility you could have portions of your
    custom script generate event entries based on the script''s internal processing.


    # Collecting Windows Event Logs


    The MMC will enable you to view the event logs from remote computers. While useful,
    this is a manual process and far from ideal when it comes to day-to-day monitoring
    of your entire network. The best solution is to find a means to get all your logs
    from all your systems in one place. Then the logs can be centrally parsed, filtered,
    analyzed, and processed. Windows is some-what limited when it comes to collecting
    event logs so are are created by third parties and feature-rich applications to
    are commercial products. Eventlog.pl (Windows 2000 Resource Kit, supplement) will
    enable you to back up the event logs and export them as files. These files could
    be moved to a central system and analyzed. Eventquery.vbs (Windows 2003/XP) enables
    you to filter and list events from a local machine or a single remote machine.


    Another option is EventCombMT (from Microsoft). This has a GUI interface which
    will enable you to basically search remote event logs for events that match your
    criteria and log them to a text file. EventCombMT will search multiple systems
    simultaneously, while eventquery.vbs be run for each system to be queried. EventCombMT
    is available as part of the Windows Server 2003 Resource Kit and the Windows Server
    2003 Deployment Kit. The Windows Server 2003 Resource Kit Tools can be downloaded
    here:


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_290_0.png)'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'www.microsoft.com/downloads/details.aspx?FamilyID=9d467a69-57ff-4ae7-96ee-b18c4790ff0d&DisplayLang=en


    In Figure 5.7, you can see the EventCombMT program window. The configuration and
    search criteria are straightforward. By default, EventCombMT will log the output
    from its searches to C:\temp\. EventCombMT provides summary information on the
    query, as how many servers were searched and what search criteria was used. Additional
    logs will be created of the format <hostname>-<log>.txt.


    # Figure 5.7 EventCombMT


