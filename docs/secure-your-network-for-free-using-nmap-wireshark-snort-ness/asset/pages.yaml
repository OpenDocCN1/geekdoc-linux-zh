  md: '# Protecting the Perimeter • Chapter 2


    would''t use the masquerade target all of the instead instead the SNAT target.
    Because the source IP is static, the SNAT target will cause the NAT calculations
    to be performed once for a given session. Subsequent packets belonging to that
    session are handled the same way as the first. With the masquerade target, each
    packet is checked for the source IP to use, which requires more overhead than
    with SNAT. This is why SNAT is preferable if you have a static source IP address,
    and masquerade is your only option if you do not have a static source IP address
    to use.


    # Additional Commands


    By this point, you should have a relatively solid grasp of how to configure a
    Linux firewall. So far we have covered all of the core commands to permit and
    deny the traffic. Another useful command for your Linux firewall deals with logging
    packets. If you want to log everything passing through the firewall, use `iptables
    -A FORWARD -j LOG`. While simple, this would likely generate an excessive amount
    of logging traffic. You might want some additional control of how the logging
    occurs. There are some additional options to provide this functionality. Of particular
    note are the --log-level and --log-prefix options.


    The --log-level option allows you to specify which logging level is used for the
    LOG rule. The effect this log level depends on how you have your kernel logging
    configured (via syslog or syslog-ng). When you combine the custom logging of iptables
    with the syslog configuration, you can have syslog act in any manner of ways based
    on the firewall logs, including sending e-mails for certain events. The --log-prefix
    option allows you to insert up to a 2-letter string in front of the log entry.
    This can be useful for troubleshooting purposes. Some examples of information
    you could place in log prefix would be the name of the chain that generated the
    log entry such as iptables -A FORWARD -j LOG --log-prefix "from FORWARD chain."
    (For more information on event logging, refer to Chapter 7, "Network Reporting
    and Troubleshooting.")


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_66_0.png)'
