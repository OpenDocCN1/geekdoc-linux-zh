    ```

    SWITCH#Show mac | incl 0008.0232.8A4C 0008.0232.8A4C 1 FastEthernet0/2

    ```


    We could now provide an nmap network port (port 2 on the switch) for someone with
    local access to trace the cable and find the machine. As you can see, Nmap has
    a lot of features. There are a large number of options that for avoiding IDS detection.
    There are many additional options that manipulate the TCP packets in far more
    unusual. Although these options aren''t for everyone, even if you don''t need
    to use these special options yourself, it is good to be familiar with them as
    a security professional. There are also options the timeout period to be used
    when attempting to connect. The defaults are adequate, but if you want to speed
    up the Although more aggressive using nmap is practically a necessity if you are
    going to doing scanning, Table 6.1 highlights some of the most useful command-line
    options, of a sort of tip.


    # Table 6.1 Nmap Options


    | Option | Nmap Options | Notes |

    |---|---|---|

    | -exclude | nmap 192.168.1.1-254 --exclude 192.168.1.106 | These are especially
    important when scanning large blocks of IP addresses so you can avoid critical
    servers. |

    | -excludefile | nmap 192.168.1.1-254 --excludefile file txt | Performs an ICMP
    ping scan only |

    | -P | nmap 192.168.1.1-254 -P | Attempt to determine service version on open
    ports |

    | -S | nmap 192.168.1.1-254 -S | Performs TCP scan using 3-way handshake for each
    port |

    | -T | nmap 192.168.1.1-254 -T | Scan only the ports specify, using TCP or UDP
    |

    | -p | nmap 192.168.1.1-254 -p 126-137 192.168.1.1-254 -U 514-514 | Scan <U> ports,
    <T> ports |

    | -P0 | nmap 192.168.1.1-254 -P0 | Treat all hosts as down. Without this nmap
    will not scan the host if it fails to ping. |

    | -A | nmap 192.168.1.1-254 -A | Performs OS detection |

    | -o <file> | nmap 192.168.1.1-254 -o <file> | Sends the output to screen and
    as -v |

    | -oX <file> | nmap 192.168.1.1-254 -oX <file> XML | Sends the output in XML format
    for web |

    | -oG <file> | nmap 192.168.1.1-254 -oG <file> grep | Sends the output in a more
    easily grep format. Grep is the "nox command line filtering utility, in functionality
    to the Windows find utility. |

    | -v --vv | nmap 192.168.1.1-106 -v nmap 192.168.1.1-106 --vv | More output providing
    more detail about what actions nmap is performing. |


    Nmap is a general-purpose scanner that can perform a wide variety of scans. The
    available output formats can be very useful if you need to provide reports of
    your scan results. You could even schedule a scan and have the output written
    to a file in XML, which could then distribute via email or over a web site. Figure
    6.4 shows the XML output of a sample scan of 192.168.1.100.


