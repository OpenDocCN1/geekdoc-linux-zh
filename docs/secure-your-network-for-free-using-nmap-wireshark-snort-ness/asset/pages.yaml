    to configure an automatic refresh by navigating to View | Auto-refresh. If you
    wish to change the refresh interval, you can access the setting by navigating
    to View | Auto-refresh Interval. You can access a robust filter mechanism by navigating
    to View | Filter. The filters will enable you to quickly check a system’s logs
    for events of particular importance. The downside to the Event Log Explorer is
    that it displays each log for each system in a separate window. This could make
    navigating a large number of logs tedious, though still better than using Event
    Viewer in the MMC.


    A free utility targeted at inspecting IIS logs is NTLas, available from www.foundation.com.
    Unfortunately, free solutions that offer quality features for analyzing Windows
    event logs are few and far. For serious log parsing without paying for a commercial
    product, we would recommend converting the Windows event log to syslog format
    and then analyzing the syslog logs on a Linux host. This architecture will offer
    the most functionality and options for log collection and analysis while providing
    the best performance. Even if you choose to perform your analysis on a Windows
    host, you will find that there is a wealth of free utilities for parsing logs
    that use the syslog format; the same cannot be said for the Windows event format.


    # Generating Syslog Event Logs


    Right out of the box, virtually every Linux system will be configured to generate
    a generous amount of logging information. In most cases, not only will syslog
    logs be generated with a default installation, but also a syslog server will be
    running unless you have specifically disabled it. Even if you choose to host your
    syslog server on a Windows system, there are far more options for analyzing syslog
    logs than Windows logs (largely due to syslog’s ASCII format no doubt). Due to
    the ubiquitous nature of syslog logging, it would be advisable to familiarize
    yourself with some basic syslog concepts.


    Syslog works in a client-server fashion. The server (or daemon in UNIX/Linux parlance)
    receives the messages that are generated by remote hosts, or even the same host.
    The client piece compiles the messages with the proper data and sends them to
    the server. A syslog entry is recorded all on a single line. Each entry consists
    of a facility and a severity level. The facility


