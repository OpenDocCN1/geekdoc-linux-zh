    selecting the maintenance tab and then the backup screen, you have a couple of
    options. The “Create backup floppy disk” button will write the configuration directly
    to a floppy disk. Given the relatively unreliable nature of floppy disks, you
    should choose the “Create backup image file” option. This creates and downloads
    an .img file to the system you use for Web administration. You can store this
    file on a more reliable media, and then write it to a physical floppy disk at
    a later date using a utility such as rawwrite. Once you have made a backup, you
    can safely apply the firewall updates.


    Firewall updates are another area where the SmoothWall designers have made things
    as painless as possible. Click on the maintenance tab and you will see sections
    on the updates screen. The top section shows installed updates and the bottom
    one shows available updates. To update the firewall, go to http://smoothwall.org/get/.
    In the “Latest Updates and Patches” section there is a small link called updates
    archive. Click that link and on the following page, download all the updates to
    your local system.


    > NOTE


    All of the updates must be applied sequentially; the SmoothWall updates are not
