  md: '# Protecting Your Perimeter • Chapter 2


    If you are in full screen mode such that you cannot see your local desktop, there
    are some keyboard shortcuts available to accomplish commonly needed tasks. These
    are outlined here.


    +   - CTRL+ALT+F Toggles full-screen mode.


    +   - CTRL+ALT+T Shows the terminate/suspend dialog. If you terminate, the session
    is closed, while if you select suspend, you will be able to open the same session
    next time.


    +   - CTRL+ALT+M Maxizes or minimizes the NX client window


    +   - CTRL+ALT+Mouse Drags the desktop viewing area, so you can view different
    portions of the desktop. This is useful if the remote desktop has a higher resolution
    than your local resolution.


    +   - CTRL+ALT+Arrows CTRL+ALT+Keypad Will move the viewport by an incremental
    amount of pixels.


    +   - CTRL+ALT+S Will activate "screen-scraping" mode, so all the GetImage originated
    by the clients will be forwarded to the real display. This will allow you to take
    a screenshot of the remote desktop, to your local clipboard. If you press the
    sequence again, xagent will revert to the usual "fast" mode.


    +   - CTRL+ALT+E Enables lazy image encoding for improved speed.


