    # Hardening Infrastructure Devices


    Don''t overlook hardening your infrastructure devices. Not all routers and switches
    have administrative capability, but many do. For those that,'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'referred to as managed devices, they usually allow you to control many aspects
    of the device, redirecting traffic to ports of your choosing and basically enabling
    or disabling all traffic flow through the device. Given the often central role
    these devices fulfill in your network, control over one of them will often mean
    control over your entire business. For this reason, you should exercise the same
    care and due diligence in securing your infrastructure as you would your critical
    servers. The same high-level bullets for hardening host-based systems also apply
    to managed infrastructure devices.


    Most managed devices will have a means to authenticate using a local account as
    well as a central authentication server, such as TACACS or RADIUS. Ensure that
    the accounts are secured and a high-quality password is used. Sometimes routers
    and switches will have unnecessary services installed by default. One common example
    is enabling an HTTP interface for managing the devices. While this can certainly
    be handy, the web interface opens up an entire category of potential security
    risks that would not otherwise be present. The highest level of security is achieved
    by disabling any services that are not needed. Conservative timeouts for abandoned
    sessions and a login warning banner are advisable security measures.


    You will also need to update the software on the device. Given the criticality
    and potential scope of impact for these devices if an update causes a problem,
    these devices are rarely configured to update automatically. In most cases, this
    will be a manual process which you must incorporate into your patch management
    and change management processes. Pay extra attention to any device connected to
    the Internet as these are going to be attacked on a regular basis. You must secure
    them before you connect them to the Internet, or you will likely lose control
    of them in short order.


