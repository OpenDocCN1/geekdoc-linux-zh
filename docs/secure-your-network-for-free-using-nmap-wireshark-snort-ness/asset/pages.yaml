    # Using the Bastille Hardening Script


    There are many settings to configure when it comes to hardening your Linux distribution,
    and all you have to do is miss one setting and a hacker can compromise the system.
    To help combat this, many people have developed semi-automated scripts to help
    harden a Linux system. These scripts basically just make a bunch of changes automatically
    based on configuration selections that you would otherwise have to make manually.
    One of the oldest hardening scripts, and one of the most mature and well-developed,
    is the Bastille Linux script. It has evolved from a crude basic script to a well-refined
    hardening system with a GUI interface. Bastille currently supports Red Hat Enterprise
    Linux, Fedora Core, SuSE, Debian, Gentoo, Mandrake, and HP-UX with a Mac OS version
    in development. You can read and download Bastille from www.bastille-linux.org.


    You can pass only three options to Bastille, each of which tells it to run in
    a different mode. If you use bastille --report it will generate a Web-based report
    of your current “hardness.” The -c option will run the actual hardening script
    in a text-based mode, and -x will run it in a graphical mode, as shown in Figure
    3.13.


    # Figure 3.13 Bastille Graphical Configuration


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_187_0.png)'
