  pgno: 152
- img_proc: true
  md: 'using something the user knows to prove he is who he claims to be. When you
    hear the term two-factor authentication, this refers to using two out of the three
    mechanisms for proving someone''s identity. Two-factor authentication often takes
    the form of a token which randomly generates a key. This key (something you have),
    combined with a password or PIN (something you know), provides heightened authentication.
    One of your goals of the hardening efforts is to strengthen the authentication
    process as much as possible. Your hardening steps will need to provide authentication
    as much as possible.


    # # Authorization


    Authorization means to define what you have access to do. Obviously, authorization
    cannot occur securely without authentication happening first. You cannot possibly
    know what Jill should be able to access until you have positively identified the
    person in question is fact Jill. Usually you control and harden authorization
    through tighter configuration of file-level security. It can also include access
    to systems—for instance, a restricted user who is not allowed to install software
    drivers or applications on his workstation. The objective is, of course, to provide
    as few privileges as possible, while still enabling the person to perform his
    assigned tasks. This concept is known as the principle of least privilege. It
    helps to determine the least amount of access a user requires in order to fulfill
    his duties.


    # # Auditing


    Auditing is a part of the hardening process as well. A system with no audit trail
    is certainly less secure than one with an audit trail. Most of the security hardening
    you will perform to various network resources comprises preventive controls, an
    audit trail serves as a defensive control. You should not only enable and configure
    the appropriate level of auditing but also take steps to protect the result audit
    logs. Remember to protect the logging process (by using a secure account to run
    it) and the logging configuration (typically using file-level access controls).
    You will need to safeguard the audit logs by implementing mechanisms to ensure
    log integrity and availability. If you cannot ensure the integrity of a log file,
    it may still be useful when it comes to troubleshooting a technology issue. The
    log file will be practically useless,'
