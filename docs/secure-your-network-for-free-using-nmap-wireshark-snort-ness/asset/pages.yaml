  md: '# Chapter 3 • Protecting Network Resources


    You can add a special script to the fake Administrator account by double-clicking
    the account and selecting Properties. Click on the Profile tab and enter the path
    to an appropriate file in the Login Script box. I have seen instances where the
    true Administrator account was also “trapped.” When anyone logged in with either
    the “fake” or the real Administrator account, a batch file was run to collect
    a variety of system information, and then it was e-mailed to the security team.
    A net send was also used to send an alert message to the entire security team.
    How elaborate do you want to get when it comes to “trapping” the accounts is up
    to you.


    Another simple step is to disable the guest account. In an environment where you
    have a domain controller you want all users to log in using their domain accounts
    anyway. This provides for more meaningful auditing. The only instances where a
    guest account serves a useful purpose would be when the environment is completely
    peer-to-peer and there are no domain controllers. Even then it would be preferable
    to have each person log in with a unique account, although so would require creating
    the account on all the workstations to which the person needed access. You can
    use net user to programmatically add a user account. By entering net user newUser
    /add at a command prompt, you can add an account, called newUser. If you add /domain
    to the end and execute the command on a domain controller, it will add the account
    to the domain instead of adding it as a local account. If you use the same command
    without the /add or /domain, it will allow you to change the password for the
    account.


    When it comes to account management, there is also an issue of education. It is
    desirable to use the actual Administrator account as little as possible. It is
    also desirable to perform day-to-day operations as a standard user instead of
    as a user with administrative access. This limits the possibility of a virus or
    other malware compromising the system when attempts to modify the Registry or
    perform other actions to embed itself would be met with inadequate privileges.
    Because spyware, malware, and viruses almost require some type of elevated privileges
    to propagate, this mode of operation is much safer. In reality, most people know
    this is the recommended way to operate, but few people actually do it because
    of the inconvenience it can cause. Many programs are written poorly


