  md: '# Protecting Network Resources • Chapter 3


    seen more than one policy or standard that was written without input from the
    appropriate groups. Although you could point to it and say, "we have a policy
    defined," the policy was constantly in need of revision, and there were innumerable
    exceptions. Remember, from an audit perspective, a high number of exceptions against
    a very granular policy are likely to look less favorable against a more liberal
    policy.


    # Access Controls


    Access to the devices will be one of the first issues to consider, regardless
    of what type of device it is. This will include hardening both the logical access
    and the physical access. When it comes to logical access, the simplest control
    to introduce is the use of firewalls, whether separate firewalls or a built-in
    "personal" firewalls on the host in question. Some systems have their own mechanisms
    for implementing logical access controls in addition to filtering network packets.
    Where possible, using these additional methods helps defense in depth and increase
    security. You should address physical access as well. The universal truth is that
    you have physical access to a system, you can have full access to the system.
    This is because you have physical control of a system, generally the system has
    mechanisms that allow you to gain complete access to the system.


    For example, if you have physical access to a server, you can boot up under Linux,
    edit the raw data on the hard disk, and reset the administrator password. You
    can use encryption mechanisms to encrypt the entire hard disk, which will render
    this particular attackine. In this scenario encryption is serving as a type of
    access control as part of your defense-in-depth strategy. These types of requirements
    are exactly the ones you would need to spell out within your policy and implement
    them to secure your systems and your data. Your hardening steps should address
    all of these concerns.


    # Authentication


    Authentication means to prove your identity. In the most common form, do you this
    using passwords. Recall that there are several means to authenticate a user, including
    something they have, something they are, something they know, or any combination
    of the three. In the case of a password, this would mean


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_152_0.png)'
