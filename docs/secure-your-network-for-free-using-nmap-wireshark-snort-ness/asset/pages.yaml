    has taken a new turn and is now known as Wireshark (www.wireshark.org). Wireshark
    has some features not found in many of the other free sniffers that are available,
    such as conversationassembly and a capture display/filter syntax that is more
    advanced than most. Wireshark requires the WinPcap drivers, which are very simple
