  md: '# Deleting Rules and Chains


    Chapter 2 • Protecting Your Perimeter

    Many Linux distributions, the netfilter firewall will come enabled, but with an
    empty ruleset. In others, it might come with the firewall enabled and a very liberal
    ruleset in place. Let''s start configuring a Linux firewall by deleting any default
    rules that are present. You can use iptables -L (or --list) to list the current
    rules. An empty default ruleset should look like this:


    ```

    iptables -L (policy ACCEPT)

    Chain INPUT (policy ACCEPT)

    Target    prot source            destination

    Chain FORWARD (policy ACCEPT)

    Target    prot source            destination

    Chain OUTPUT (policy ACCEPT)

    Target    prot source            destination

    ```


    If there are any default rules, they can be deleted using the iptables -F command.
    The -F option means to flush, which is equivalent to using flush. This will clear
    all rules out of any existing chains. If distribution has additional chains created
    beyond the default, Creating your own user-defined chain is accomplished using
    the iptables -N customchain command. In addition to the individual rules within
    a chain, the built-in chains have a default policy associated with them. This
    policy tells netfilter what to do if a packet reaches the end of the chain without
    finding a match. The default policy is to ACCEPT, it is better to change this
    to the DROP by using the -P option, which sets the default policy for that chain,
    as follows:


    ```

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT DROP

    ```


    # Permitting Traffic to and from the Firewall


    Now that you have a clean slate and a default policy of DROP, the first thing
    you will want to do is make sure that management traffic is permitted to the firewall
    itself. This is done first, because once you have enabled the firewall'
  merge: -1
