    Being able to pull this raw data opens a host of possibilities. As a simple example,
    let''s suppose you wanted to produce a listing of all the hostnames ntop currently
    know about. Dumpflat.pl is configured by default to loop and dump the output on
    one-minute intervals. Remoteclient.pl is configured for a Perl-like output, which
    isn''t conducive to parsing in a DOS window. Copy the remoteClient.pl and rename
    it to raw. Edit raw.pl and find the line that says


    ```

    URL = "http://$.ntopHost.:$.ntopPort/dumpData.html?language=perl";

    ```


    and change to read


    ```

    URL = "http://$.ntopHost.:$.ntopPort/dumpData.html?language=text";

    ```


    Now executing perl.raw will produce the raw data held in memory by ntop. This
    is easily parsable because each host knows about all of its data on one line.
    Now the following command would produce the output from raw.raw and print the
    fourth field (the hostname) to the screen for each


    ```

    FOR /F "tokens=1-4 delims=" a in (''perl raw.pl'') do @echo $d

    ```


    You could also use each (perl.raw | find "192.168.1.99") to pull out a line of
    data containing a known hostname or IP address. Once you have the raw data at
    your disposal you can perform a wide variety of parsing options on it.


