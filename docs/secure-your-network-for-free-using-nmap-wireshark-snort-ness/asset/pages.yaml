- img_proc: true
  md: 'way to configure the desired settings and export them for use on

    another machine''s local GPO.You do this through either the GUI or the

    command line. The GUI is, of course, the MMC.You will need to add the

    Security Configuration and Analysis and, optionally, the Security

    Templates snap-ins to your console.


    In order to import settings from another system, you have to have config-

    ured the desired settings at some point. To do this use the Security

    Templates snap-in. A template is a preconfigured collection of settings.

    You can, of course, edit the templates to your taste, or create your own.

    The following is a brief summary of the templates included with Windows XP:


    +   * compatws. Relaxes the default file and Registry permissions for

    the Users group.

    * hisedcdc. Provides further restrictions on LanManager authentication

    and further requirements for the encryption and signing of secure

    channel and SMB data above and beyond what is configured within

