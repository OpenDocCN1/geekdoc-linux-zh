- img_proc: true
  md: '# Chapter 2 • Protecting Your Perimeter


    # NOTE


    While a packet matches an ACCEPT or DROP rule will stop traversing any other chains,
    this is not true of packets that match a log rule. After matching the log rule,
    the packets continue through any appropriate chains to be processed. Keep this
    in mind, so that you can configure an additional rule and action for the packet
    if desired.


    Now that you can create a working ruleset for netfilter, you will want to save
    it. There are two commands of note: one for saving the configurations and one
    for loading a saved configuration. You can use the iptables-save command to generate
    output that is the current ruleset. By default, it will generate the output only
    to the stdout, which will display in the console. To save this output, redirect
    it to a file. To redirect the current ruleset to a file called /etc/ruleset, you
    would type iptables-save > /etc/ruleset. If you want to save the current packet
    counts and rule counts, use the iptables-save -c > /etc/ruleset command. Individual
    tables can be saved separately by specifying the -t option using the iptables-save
    -t mangle > /etc/ruleset command.

    Roring a restore is accomplished using the iptables-restore command. Like iptables-save,
    the restore function takes only two optional arguments. The -c option will cause
    iptables to load the saved packet and bytes counts, writing the current count
    values. The default behavior when using iptables-restore is to flush the ruleset
    before loading the saved, thus all previous rules are lost. If you wish to override
    this behavior, you can use the -n option, in which case the rules will be added
    to the existing ruleset, and only overwrite if there is a duplicate rule. You
    can use the iptables-restore < /etc/ruleset command to pipe the saved configuration
    to iptables-restore.


    # Command Summary


    The following is a brief summary of the most useful iptables commands for easy
    reference, along with some examples to make the command usage clear. Bear in mind
    this is not an exhaustive list of commands; it only represents the most important
    commands for configuring your firewall. For a complete list, refer to the iptables
    man page.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_67_0.png)'
