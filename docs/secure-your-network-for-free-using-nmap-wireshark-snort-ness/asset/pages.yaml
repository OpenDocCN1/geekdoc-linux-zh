  md: '+   Perform the Initial Scan gives you a baseline of issues and is used in
    subsequent steps.


    +   Verify the Scan Results Some of the issues a vulnerability scanner finds be
    false positives. In other cases they may be legitimate issues, but the issues
    may not be relevant because other compensating controls the scanner cannot account
    for.


    +   Remediate Valid Issues This will include following all your change control
    procedures in an attempt to remove or mitigate the risk that the vulnerability
    scanner found.


    +   Rescan This last step is often skipped but it is important. This not only
    verifies that your remediation steps were successful, but demonstrates to management
    and, if needed, to auditors, that you are actively taking steps to safeguard your
    network.


    This cyclical process will be never ending in once you have scanned a host, verified
    the scan results, performed remediation for any issues, and then rescanned the
    host to verify your remediation efforts, it will be time to begin the process
