  md: '# Chapter 4 • Configuring an Intrusion Detection System


    The following command example would start Snort listening on the first interface
    (-i used), alerts going to the console only, using the configuration file at /etc/snort/snort.conf.The
    -w tells Snort where the logging directory is located. The -K switch tells Snort
    what types of logs to generate. ASCII logs are easier for a human to read, but
    they take a little more time to load. If speed isn''t a concern, the ASCII logs
    will probably be the easiest to read and analyze.


    ```

    snort -A console -c /etc/snort/snort.conf -l /etc/snort/log -K ascii

    ```


    You should see every triggered rule produce a message on the console and logged
    to your syslog server. If you add the -s switch to the end of the line, it will
    tell Snort to log to the syslog server you have configured in the snort.conf file;
    however, it will not display on the sn console. If you want to create a rule for
    testing purposes to see what the results like, create a test as TESTING.rules,
    and place it in the rules folder (/etc/snort/rules, in this example). In this
