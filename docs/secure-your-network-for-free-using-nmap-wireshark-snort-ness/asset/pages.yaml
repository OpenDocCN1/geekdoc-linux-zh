    the event logs to the one-line syslog format and send them to a syslog server
    as they are generated. NTsyslog allows you to configure what types of events you
    wish to export and what facility and severity to label them as (Figure 5.10) syslog
    can be downloaded from http://sourceforge.net/projects/ntsyslog/. Because NTsyslog
    is a good middle ground and will likely be adequate for most installations, we
    will walk through using NTsyslog.


    Similar functionality to NTsyslog is offered by SNARE, which is available for
    free from www.interclearance.com/projects/SnareWindows/. While it is a little
    more complicated to set up than NTsyslog, SNARE can provide additional control
    over which events are exported to the syslog server. Effectively, SNARE enables
    you to do some robust filtering at the host generating the syslog traffic, whereas
    NTsyslog only allows a less-flexible filtering mechanism based on the event type
    and event log. This can be adv-


