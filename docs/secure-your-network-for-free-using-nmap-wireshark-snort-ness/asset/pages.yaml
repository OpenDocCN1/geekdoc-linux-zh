    viable options. Use the costs of those products as your basis for determining
    what the free solution will save you.


    # Maintenance Costs


    Maintenance can be expensive; it is not uncommon for a yearly maintenance contract
    to cost 10 percent of the purchase price. This price will fluctuate, as almost
    all vendors have various support tiers with varying response times and service
    level agreements (SLAs). The reality is, if you opt for the free solution and
    spend the 10 percent on training instead, you would probably have a very high
    level of responsiveness from your own in-house staff. Ensuring an equivalent level
    of responsiveness and availability from the vendor would likely cost you a large
    sum. Your support staff could probably go to the office or address the issue remotely
    more quickly than all the largest and most well-established vendors. Even if a
    vendor can have someone on site in two hours, sometimes getting a live person
    to return your call and schedule the emergency appointment takes time.You can
    probably reach your own staff as quickly, if not more so. The level of service
    you expect should be factored in when estimating the cost savings available by
    not having to purchase a maintenance contract.


    # Customization Costs


    Customization is an area that can offer huge gains or be inconsequential, depending
    on your circumstances. If you purchase a commercial product, you may find that
    there is no way it can be customized for your environment. If


