    # Providing a Remote Desktop


    Some of the considerations for placing your remote desktop are similar to those
    of a VPN. The primary consideration (i.e., physical location for the desktop host)
    has very little flexibility. Because the remote users will be accessing the desktop
    virtually, the desktop needs to access all of the same things it normally has.
    Unless you have systems you can dedicate to this task and place in a DMZ, this
    probably means the users will be coming in through the firewall and accessing
    their desktops that are sitting on the internal network. Because of this, you
    want to secure the connection as much as possible. This desktop will have a login
    prompt exposed to the Internet unless you take steps to prevent it. A personal
    firewall (covered in more detail in Chapter 3) can help mitigate this, as well
    as firewall rules on your Internet connection. Most home users will use a dynamic
    IP address, so you will probably not be able to restrict the connection to the
    users'' specific IP addresses. You can, however, restrict it to the block of IP
    addresses corresponding to the local ISP''s dynamic range. It is better to only
    let your local


