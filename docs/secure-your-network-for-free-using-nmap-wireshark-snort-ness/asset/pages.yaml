  md: '# Configuring Your Perimeter • Chapter 2


    Configuring the policies will satisfy the bulk of what you need to accomplish,
    but there are some additional configuration options available by navigating to
    Edit | Preferences. Selecting Interface | Events allows you to configure some
    useful tools. The “Skip redundant entries” checkbox only makes one event entry
    for sequential event entries. This helps prevent the event windows from being
    flooded by repetitive alerts.You also have the option of entering certain hosts
    or ports as exempt from triggering the event log. After making your selections,
    click Accept.


    Another preferences setting of note is under Firewall | Network Settings. This
    allows you to enable Internet connection sharing (the same as the initial wizard),
    and enable the firewall host as a Dynamic Host Configuration Protocol (DHCP) server.
    This allows you to configure the Linux host similarly to a home firewall, which
    generally acts as a DHCP server in addition to performing NAT and acting as a
    firewall. The ICMP filtering window also allows you to filter ICMP packets. By
    default, the permit and deny rules configured by Firestarter to TCP and UDP, but
    not ICMP. This screen allows you to permit the desired types of ICMP traffic.
    Generally speaking, it is better not to allow any ICMP from the Internet to your
    firewall or internal network unless absolutely necessary.


    One final setting you want to configure is under Firewall | Advanced Options.
    In the broadcast traffic section, check both options under Broadcast traffic.
    In general, you should not permit broadcast traffic to go through your firewall,
    as doing so poses a security risk. You also want to check the option to “Block
    traffic from reserved addresses on public interfaces,” which is a common filtering
    tactic. Because the “private” addresses outlined in RFC1918 should not be routed
    through the Internet, there is never a reason to receive traffic sourced from
    any of those addresses on your outer interface. If you do, it is almost a hacker
    attempting to bypass a poorly configured firewall.


    Short of any advanced packet mangler, there isn''t much you can accomplish using
    Firestarter as your configuration tool. If you need to implement a more advanced
    configuration, use an alternate tool, or generate the configuration using Firestarter
    and use those chains as a starting point to add your own more advanced options.


