  md: '# Introduction


    Event logs provide valuable insight into what is happening on a system. The scope
    of a typical event log is very different from the output of an IDS (intrusion
    detection system). This is because in general the logs are more tailored to specific
    systems and applications. With the right utilities you can even create event log
    entries for custom applications or batch files/scripts. For example, if you have
    a batch that deleted temp files on a server, you could send it a message to the
    syslog server if there are errors during the delete process. When talking about
    free event logging (free software to generate the logs and free software to receive
    them), there are basically two formats that you are likely to encounter and work
    with extensively. In the UNIX world, there is syslog which is the de facto standard
    when it comes to centralized logging. On the other hand, there are the Microsoft
    proprietary event logs, which are used only by Microsoft Systems. Because Microsoft
    chooses not to natively support syslog, we will discuss what you can do to make
    the best use of the Windows event logs. In addition to configuring and generating
    the logs, we will show you how to analyze the logs and create notifications for
    significant events.


    # Generating Windows Event Logs


    Windows event logs are broken up into six major categories: Application, Security,
    and System; and on domain controllers: Directory Service, DNS, and File Replication.You
    can view the event logs on a Windows host by navigating to Start | Run | eventwr.exe.
    The Event Viewer is rarely an MMC console snap-in, and as you can add it to your
    MMC console instead of using the standalone Event Viewer if you choose to do so.
    Application logs are, of course, application specific and rely on the application
    that is generating the logs to provide meaningful information for the event log.
    Because of this, support from specific applications can vary greatly. When the
    application in question is a Microsoft application, event log support tends to
    be good, and the logs usually provide relatively detailed information. In other
    cases, the application may not support Windows event logs at all and you may not
    see the application generate any logs of its own. The Event Viewer is shown'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'below Figure 5.1. The Event Viewer is intended to be your primary access to
    view and save Windows logs, though there are additional tools available to manipulate
