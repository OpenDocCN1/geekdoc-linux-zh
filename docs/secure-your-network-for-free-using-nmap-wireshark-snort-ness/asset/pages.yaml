    For example, we searched for an event ID between 1 and 1000. The result output
    was logged to C:\temp\Lab2003-System_LOG.txt. The log contained the following:


    123, ERROR,system,Sun Aug 13 21:25:32 2006,LAB2003\Administrator, Secure your
