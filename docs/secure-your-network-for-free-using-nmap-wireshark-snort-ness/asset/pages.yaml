    which would assign clients to addresses 192.168.1.66—192.168.1.94, with one of
    the available IP addresses going to the VPN server itself.


    +   If there are any non-local subsets that the VPN clients need to access, you
    must update the clients routing table accordingly. There are two ways to accomplish
    this, and both use the push directive. It is by sending a specific route in the
    format push route 192.168.111.0 255.255.255.0 This will modify the client''s routing
    table and add a route to 192.168.111.0 with the VPN server as the next hop to
    reach that network. The other is using the push "redirect-gateway" directive.
    This will create a new default route in the client, so all traffic without a more
    specific route defined will go through the VPN server. The latter method is generally
    preferable as it is more secure. The increased security is because you will effectively
