    loosely tells you what component subsystem generated the message, while the severity
    tells you the general severity or importance of the message. We use terms like
    “loosely” and “general” because not all applications will be written the same
    and one you give a message is more important than another. When you are manually
    generating the messages you can typically enter facility and severity levels of
    your choosing. Table 5.1 provides a summary of the different severity levels that
    are available, in order from most to least severe. Note that the severity is listed
    as LOG_EMER, it would appear using slightly different formats depending on the
    software you are using, such as emer, emerg, or any emergency.


    # Table 5.1 Syslog Severity Summary


    | Syslog Severity | Identifier (Level) | Usage |

    | :--- | :--- | :--- |

    | LOG_EMER | 0 | Emergency: This indicates a panic condition. Emergency-level
    messages are usually broadcast to all users on a system and indicate the most
    severe of conditions. |

    | LOG_ALERT | 1 | Alert: Indicates a condition that should be corrected immediately,
    such as a corrupted system database. Critical: Indicates a condition such as a
    hardware device error |

    | LOG_CRIT | 2 | Error: Is the generic error level for a message that does not
    specify an alternate severity. |

    | LOG_ERR | 3 | Warning: These messages represent non-critical events or conditions.
    |

    | LOG_WARNING | 4 | Notice: Represents conditions that are not errors, but should
    possibly be handled specially. This type of level may be used for manually generated
    messages. |

    | LOG_NOTICE | 5 | Informational: These messages typically do not receive special
    attention unless you are looking for a specific or piece of information. |

    | LOG_INFO | 6 | Debug: These messages contain very detailed information normally
    of use only when debugging a process. Due to the high volume of data that can
    be generated, debug-level logging is usually enabled to troubleshoot a specific
    issue. |

    | LOG_DEBUG | 7 | |


    Some systems and utilities will refer to the various levels by name others will
    use the numerical representation of the level. Because non-Windows systems support
