  md: '# Chapter 4 • Configuring an Intrusion Detection System


    +   4. Next, define what servers are running specific services. For example, by
    setting HTTP_SERVERS to only specific servers, Snort will only watch for HTTP
    attacks targeted at those servers. If you want to see attacks targeting servers
    that are not running the affected services, leave the defaults: to watch for attacks
    directed towards any internal servers. (Default: var DNS_SERVERS $HOME_NET). If
    you had a Web server running on 192.168.1.11 and 192.168.1.12, you could tell
    Snort to only look for HTTP attacks targeting that server by setting the following
    variable: var HTTP_SERVERS [192.168.1.11/32,192.168.1.12/32].n5. If desired, configure
    the specific ports that services are available on. For an example, the default
    for HTTP is defined on the following line: var HTTP_PORTS 80. Similar to defining
