  md: '# Protecting Your Perimeter • Chapter 2


    +   -A appends a rule to a chain. iptables -A INPUT -p icmp -j ACCEPT ICMP will
    add the rule to permit ICMP at the bottom of the INPUT chain in the FILTER table.


    +   -D deletes a rule from a chain. iptables -D INPUT -p icmp -j will delete the
    matching rule from the INPUT chain. iptables -D INPUT 3 will delete the third
    rule from the top in the INPUT chain.


    +   -I inserts a rule in a chain. iptables -I INPUT 5 -p icmp -j will insert this
    rule as the fifth rule in the INPUT chain


    +   -R replaces a rule in a chain. iptables -R INPUT 4 -p icmp -j ACCEPT will
    replace the fourth rule in the INPUT chain with this new rule.


    +   -L lists the rules. iptables -L will list all rules and iptables -INPUT will
    list all rules in the INPUT chain.


    +   -F flush (delete) the rules. iptables -F will delete all rules in all chains.
    It will not delete chains, only the rules inside the chains.


    +   -Z will zero the packet and byte counters. iptables -Z will delete all of
    the counters. iptables -Z FORWARD will delete all of the counters in the FORWARD
    chain only.


    +   -N will create a new chain. iptables -N CUSTOMCHAIN1 will create a new chain
    CUSTOMCHAIN1.


    +   -X will delete a chain. iptables -X CUSTOMCHAIN1 will delete the custom chain
    named CUSTOMCHAIN1.


    +   -P will change the policy for a chain. iptables -P INPUT ACCEPT will change
    the policy for the INPUT chain to ACCEPT.


    The policy for a chain does not need to be limited to ACCEPT or DROP; it could
    use a custom chain for a target, if desired.


