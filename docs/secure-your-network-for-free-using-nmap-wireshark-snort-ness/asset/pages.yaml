  md: 'Another very powerful feature is that you can configure Kiwi to receive SNMP
    traps. SNMP is Simple Network Management Protocol. Traps can be configured as
    a sort of alarm message, to be sent when various parameters surpass certain thresholds.
    When this option is enabled, you can configure which facility and/severity to
    use for the SNMP traps. In most cases, if you point your SNMP traps to the server
    that is hosting your syslog, and check the box next to List for SNMP Traps, the
    default settings on this screen should work fine.


    # Linux Syslog


    The Linux daemon that supports syslog is syslogd, or on some newer distributions,
    syslog-ng. With current Linux distributions you would be hard pressed to find
    one that didn''t come with a syslog daemon already enabled, but if you need to,
    you can install it like any other package. There are a few differences between
    syslog and the newer syslog-ng. Syslog-ng supports sending syslog messages over
    TCP, which gives you more choices for encrypting your syslog messages. The feature
    that will appeal to the most people is the increased granularity when configuring
    what actions generate syslog events using the /etc/syslog-ng.conf file. This greater
    degree of control comes with a price, which is that the configuration file of
    syslog-ng is a little more complex than that of plain syslog.


    # Generating Syslog Events


    Once installed, you can control the behavior of the syslog daemon through /etc/syslog.conf,
    or in the case of syslog-ng. This configuration file is relatively simple and
    additional information can be found by viewing the man page for your version of
    syslog. You can typically type **man syslog** at the console to view the MANual
    for syslog. There should also be a page for syslog.conf to explain the syntax
    of the configuration file. The configuration file is used to tell the syslog daemon
    what syslog messages to generate. Each line contains a selector and an action
    field. The selector tells the syslog daemon what types of events to act on, while
    the action field tells the syslog daemon what to do with those events. More practically
    you will see the following format used in the syslog.conf file: <facility>.<severity><action>.
    Take the following example:


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_312_0.png)'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 298 Chapter 5 • Managing Event Logs


    Mail.* /var/log/mailaog

    ^Selector ^action


    This would trigger the syslog daemon to log all events from the mail subsystem;
    that is, the mail facility, regardless of their severity, to /var/log/mailaog.
    For examples of valid severities refer to Table 5.1 earlier in this chapter. An
    asterisk “*” is a special case and can represent several different things. If
    used in place of the facility or severity, it can represent all facility or all
    severities respectively. If you place an asterisk as the action, the message will
    be sent to all logged-on users. The action can also be /dev/console, for example,
    to send it to the console.


    Unless a facility isn''t used or available on your bastion host, you should probably
    plan a logging action for all of them. The action will typically be to log to
    a real file, but there are other options available. The most notable action from
    a security perspective is the remote action. This enables you to send the logs
    to a remote machine, which is a good idea. The syntax for the remote action is
    simply @host. The following line in the syslog.conf would send all critical events
    to the system at 192.168.1.11.


    *.crit @192.168.1.11


    If the system holding your log files were compromised by a hacker, any logs on
    that host become suspect and of less value if legal action were to be taken. If
    you needed to use logs that were stored on the compromised machine, ensuring their
    integrity would be nearly impossible. You would have virtually no way to guarantee
    that the logs had not been modified; in short, the logs would become all but useless.
    By sending the syslog events to a syslog daemon on another machine, you can make
    the logs much more secure. The hacker would have to break into two machines in
    an attempt to modify the log files.


    # Encrypting Syslog Traffic


    To encrypt your syslog messages, you will need to send your syslog messages over
    TCP and then use another means to encrypt the logs in transit. The Linux distribution
    you are using does not include syslog-ng, it is available for free from www.balabit.com/products/syslog_ng/
    and can be installed like any other package. There are many ways available to
    encrypt the syslog messages.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_313_0.png)'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Managing Event Logs • Chapter 5


    Stunnel can be used to send the logs over an SSL-encrypted tunnel. OpenSSH can
    use its port-forwarding feature in the same way and encrypt the data using SSH.
    IPsec can be used as well. IPsec is the only option that enables you to encrypt
    the syslog logs if they are being sent over UDP.


    Before beginning the encryption configuration, verify that you can successfully
    send syslog messages from the Linux host to the syslog server (Linux or Windows).
    While UDP syslog uses a destination port of 514,TCP syslog messages do not have
    a standardized port number to use.You can use TCP514 if you like, but it is officially
    registered to rsyslog. For more information, go to www.iana.org/assignments/port-numbers.
    If you don''t have any other software listening on your syslog server on TCP 514,
    then you can certainly use that port. The default syslog-ng.conf is configured
    to behave very closely to the original syslog if you do not modify anything. Direct
    logs to a remote syslog server you will need to edit the syslog-ng.conf file.


    The default configuration file has all the destinations defined in one area. The
    default is to name destinations with a name following the format d_<name>, but
    this isn''t required. Syslog.conf uses the format of <facility>.<severity>.<action>.
    Syslog-ng uses the format log { source; filter; destination; }; Each of these
    fields must be defined in the syslog-ng.conf file. To define your remote destination,
    add the following line just after the last destination that is defined in the
    syslog-ng.conf file.


    ```

    destination d_lab { tcp "192.168.1.99" port (5140); };

    ```


    This defines d_lab as a syslog server at 192.168.168.1.99, which is listening
    on TCP port 5140. In the filter section, you can define any filters you want to
    apply to the logging. The following filter would trigger on all log messages of
    severity info (6) through emerg (0), which is basically anything except debug.
    Using f_ to precede any filter name is a standard, but it is not a requirement.
    The following line will define a filter named f_no-debug.


    ```

    filter f_no-debug {level info..emerg; };

    ```


    The source is defined by default as s_sys, and we have added definitions for the
    filter and the destination. You can now use these definitions and configure syslog-ng
    to send syslog messages. Do this by adding the following line after the last log
    line.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_314_0.png)'
