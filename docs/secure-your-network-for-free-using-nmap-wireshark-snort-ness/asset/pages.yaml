    # Configuring Snort Options


    After you have verified that WinPcap is working, it’s time to configure the various
    options that determine how Snort will behave using the Snort configuration file.
    The configuration file is excellently documented and very easy to use. The configuration
    file is divided into six “steps” annotated within the comments. To get Snort working
    the way you want it, follow these simple steps:


    +   1. Start by opening the main Snort configuration file. By default it will
    be located at C:\Snort\etc\snort.conf. If you open it in Notepad may display properly,
    so Word would be a better choice.


    +   2. Configure the HOME_NET variable, if desired, by removing the # from the
    line you need. (# is a comment indicator in the Snort configuration file.) The
    HOME_NET variable defines which networks are “trusted” internal networks. This
    is used with the signatures to determine when the internal network is being attacked.
    By default, HOME_NET is set to any network with the var HOME_NET any in the snort.conf.
    Setting this to accurately reflect your internal address space will reduce the
    number of false positive alerts receive. A common example is var HOME_NET 192.168.1.0/24.


    +   3. Configure the EXTERNAL_NET variable if desired. The recommended setting
    is to set this to everything except come from your HOME_NET using the following
    var EXTERNAL_NET !$HOME_NET. (Default: var EXTERNAL_NET any).'
