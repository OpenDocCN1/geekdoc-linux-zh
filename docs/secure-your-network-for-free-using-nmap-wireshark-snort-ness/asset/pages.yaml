- img_proc: true
  md: '# Chapter 8 • Security as an Ongoing Process


    independent antisware products. Because antisware or malware products typically
    use signatures, like an antivirus program, these will need to be updated regularly.
    It is also worth pointing out that antisware products are prone to a lot more
    false positives, particularly when it comes to network-related utilities. Because
    an average user doesn''t use these networking utilities, they are often flagged
    as malware.You will will need to take this into account and provide some methods
    to review the scan results, preferably forming a white list of approved users
    and/or products in order to reduce the false positives.


    # Intrusion Detection Systems


    Much of the same considerations for an antisware solution for an IDS or intrusion
    prevention system (IPS) as well, if it''s signature based, such as Snort. Because
    the IDS/IPS uses a known sequence to identify hostile traffic, keeping the signatures
    current is vital.Typically, an IDS will alert you of an intrusion, there is little
    risk of failed or inadequate maintenance causing the IDS to result in a service
    disruption for other traffic.These same guidelines are not true if you use an
    IPS, which will take active measures to stop an intrusion. In the case of an IPS,
    it is critical that they are thoroughly tested so that the IPS doesn''t inadvertently
    identify critical business traffic as hostile and terminate the connection. Most
    maintenance will be related to either updating the IDS/IPS software itself, or
    the attack signatures. In all cases, adequate testing of the changes will help
    ensure that the changes are successful and do not adversely affect normal operations.


    # Vulnerability Scanning


    Vulnerability scanning and penetration testing are often (incorrectly) used interchangeably.
    Vulnerability scanning is typically a passive activity. You are simply using automated
    software to check hosts for known vulnerabilities or risky (that is, insecure)
    settings. This is not a penetration test. A penetration test is an active attempt
    to compromise the security measures that are in place. Vulnerability scanning
    is not a substitute for a penetration test, but it is useful for determining the
    baseline of your security risks for a given system. Because the network is dynamic
    and ever changing, the vulnerability scanning process is never really done. The
    frequency of vulnerability scans will be


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_475_0.png)'
