    By scheduling MRTG to run, you can build a history of data points that are used
    to populate the graphs. MRTG can be in *daemon* mode. In this mode, you start
    MRTG will not exit; it will stay running and continue to collect data. To do this
    requires two steps. First, configure the file and add the line **RunAsDaemon:
    yes** in the Global Properties section. Second, start MRTG using the following
    command from a command prompt: **start /b perl mrtrg.cfg**. Yet another way to
    accumulate the needed data is to run MRTG as a Windows service using *SERVANY.exe*
