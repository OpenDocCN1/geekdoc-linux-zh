- img_proc: true
  md: '# Chapter 7 • Network Reporting and Troubleshooting


    this by using the traceroute utility (tracerert on Windows systems). When you
    execute the traceroute command ICMP (Internet Control Message Protocol) is used
    to transmit packets to the destination with a Time to Live (TTL) value of 1, and
    increases for each hop. When everything goes smoothly, each hop has to reduce
    the TTL by one, and when it becomes zero, the packet is dropped, and a message
    is sent to the receiver. The problem that often arises is ICMP is partially or
    completely filtered out by intervening routers or firewalls. In this case, you
    need a way to accomplish the same thing with a protocol that has a higher chance
    of success.


    In these cases, a TCP traceroute can be a life saver. It will effectively do the
    same thing, by manipulating the TTL values, but it uses a TCP packet and allows
    a user-configurable port, which almost every firewall and router will allow it
    to be a well-chosen port. For example, if you picked a popular Web site and tried
    a trace route, you may get several instances of “request timed out,” which indicates
    that the hop is not responding. In most cases this means ICMP is being filtered
    by a firewall. If you instead use a TCP-based traceroute utility and specify a
    destination port of 80, you may get better results. A good TCP-based traceroute
    utility for Windows is tracercp from http://tracercp.sourceforge.net/. For Linux,
    a very robust utility is LFT, which stands for “layer four traceroute,” which
    can be downloaded from http://p.org/lft/


    # Netstat


    You can use the netstat utility on Windows or Linux to see a list of network connections.
    The -l option (on Linux) will list only the listening ports for that system. On
    Windows, the same functionality is provided by the -a option (-a works on Linux
    as well) to list all connections. From a troubleshooting perspective, there may
    be times when you want to verify that a service is listening on the proper port,
    or identify what service is listening on a given port. While older versions of
    netstat cannot show you, this modern Windows systems provide the -b option, which
    will list the process associated with a given listening port.


    ```

    C:\netstat -a -b

    ```'
