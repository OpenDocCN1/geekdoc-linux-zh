    # Documentation


    Documentation is frequently one of the most overlooked aspects of network engineering
    and design. Most people don''t like to generate network diagrams and related documents.
    Many IT staff consider documentation a poor use of their time and would prefer
    it doing “real” work. The fact is there a lot of reasons why you need to have
    this documentation, and it is important that the documentation remain accurate
    and up to date. The types of documentation that is important will vary based on
    your specific business needs, but the following list represents some of the most
    important types of documentation from a security perspective.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_376_0.png)'
