    # Receiving Syslog Events on a Linux Host


    Configuring your Linux host to accept syslog messages is fairly simple. For the
    generation of test events from a Windows host, Kiwi offers a handy tool creatively
    called Kiwi Syslog Message Generator. It will generate both TCP and UDP messages
    of your specification, or messages using random parameters. You can download the
    message generator at www.kiwisyslog.com/info_sysloggen.htm. If you are using the
    standard syslog daemon, you will need to edit the /etc/sysconf/syslog file. The
    line that contains SYSLOG_OPTIONS= tells the system how to run the syslog daemon.
    Add -r to the list of options and restart the syslog service. That''s all there
    is to it. Your Linux system will now be listening on the default syslog port (UDP
    514) for syslog messages. If you enter netstat -A in a terminal, you should see
    syslog as one of the listening processes.


    If you are using syslog-ng, you will need to edit the /etc/syslog-ng-ng.conf file.
    If you are only trying to receive syslog messages on the default UDP port of 514,
    all you need to do is remove the delimiter (#) from the following line in the
    syslog-ng.conf file.


    ```

    # udp(ip(0.0.0.0)) port(514));

    ```


    The default configuration file is set up to mimic the original syslog daemon,
    which is set to not listen for syslog messages from the network by default. After
    editing the configuration file, restart the syslog-ng service and you should begin
    receiving syslog messages on UDP port 514. To configure the Linux host to receive
    syslog messages on a TCP port (recom-


