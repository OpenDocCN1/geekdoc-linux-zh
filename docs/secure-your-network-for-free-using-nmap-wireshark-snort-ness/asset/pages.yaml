    # Other Snort Add-Ons


    The number of Snort utilities and add-ons is impressive. Some of these address
    key issues as keeping your Snort rulebase up-to-date, while others provide additional
    performance improvements such as faster logging. If you are looking for a particular
    feature or option, you should do some searching on the Internet, and you might
    find that the functionality you are looking for already exists. If you do find
    an add-in that you are interested in using, remember to properly test it before
    deploying it in a production environment.


    # Using Oinkmaster


    You may get tired of constantly having to update the Snort signature files. Because
    Snort is a signature-based IDS, having current signatures is vital. Without current
    signature files you could be unaware of intrusion attempts happening right in
    front of you. Although Snort itself does not include any means to automatically
    update the signature file, there is another utility that can help called Oinkmaster
    (http://oinkmaster.sourceforge.net/features.shtml). Oinkmaster is a Perl script
    that will update your Snort rules from the Snort Web site automatically. Because
    it uses Perl, Oinkmaster will run on a Linux or Windows Snort host. The Oinkmaster
    Perl script can be scheduled to run and check for updates as often as you like.
    To download Snort rules without having to wait until the next release of Snort,
    you have to register on the Snort Web site. You can register for free at https://snort.org/pub-bin/register.cgi
    A password will be sent to the e-mail address you provide during registration.
    The configuration of Oinkmaster is outlined here.


    +   1. After logging on to the Snort Web site, click the link that says User Preferences.


    +   2. At the bottom of the page is a section titled Oink Code; click the Get
    Code button.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_269_0.png)'
