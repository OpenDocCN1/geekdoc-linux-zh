  md: '# Security as an Ongoing Process • Chapter 8 459


    With well-established change procedures in place before implementing a change,
    you can minimize the risk caused by implementing an emergency changes. If a service
    disruption does occur, you will also be more prepared for dealing with it in a
    timely fashion.


    # Antivirus


    In modern times, an antivirus system of one type or another is a requirement for
    doing business. These can be implemented on a central gateway such as a mail server,
    or locally on individual workstations (or more commonly, both). In any case, the
    antivirus software will need frequent updates to keep the virus signature database
    current. Because the signature file is used to identify a virus based on a small
    code sample, and given the rapid development of new viruses and Trojans, an out-of-date
    signature file is close to not having any antivirus protection at. In most cases,
    new signature files will be released very frequently and generally cause little
    risk of a service disruption. A schedule for signature file updates should be
    established and approved by management. Most commonly, the complications from
    a new signature file will be an improper identification of a file as malicious
    when it isn''t, also known as a false positive. It is important that reports be
    generated to verify that the signatures are current on all systems, and that someone
    regularly reviews these reports to take action if that is not the case. If automated
    updates have been failing on a server for months, there needs to be a process
    in place that will ensure someone notices that. While testing needs to be minimal
    when it comes to antivirus signatures, it is all a good idea to try a pilot deployment
    on a small subset of hosts before deploying any significant updates across the
    entire company. This is particularly true if the scanning engine itself is being
    updated or a new antivirus option is being implemented. You wouldn''t want your
    antivirus product to detect your corporate accounting program as a virus and “clean”
    for you.


    # Antispyware


    Antispyware software may be integrated with your antivirus software, or it may
    be its own independent product. In the latter case it will need to be updated,
    and all the same caveats that apply to antivirus will also pertain to


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_474_0.png)'
