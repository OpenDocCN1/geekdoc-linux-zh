    Report** or the **Scan Report.**


    While ClamWin lacks on-access scanning, which is supported with virtually every
    commercial antivirus product, the integrated scheduling functionality and automated
    e-mail alerts are very new features in a free product. ClamWin virus signature
    database is updated several times a day, so you have the ability to keep your
    signatures updated without any manual configuration. If you are trying to keep
    your network secure without spending a lot of cash, you should definitely consider
    ClamWin.'
