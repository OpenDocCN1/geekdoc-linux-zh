    # OpenSSL VPN


    There are many commercial VPN solutions using SSL to provide encryption. SSL is
    the same encryption protocol that is used for secure Web pages (HTTPS://) and
    as it is a very well tested and widely understood protocol. There are not many
    offerings for free SSL based VPNs, OpenVPN is a very robust and active package.
    You can read about it and download it from http://openvpn.net. OpenVPN can be
    installed on Linux, Windows (2000 or newer), several versions of BSD, MAX OS X,
    and Solaris. We will be using Windows 2000 for the server and Windows XP for the
    client, although the differences between using Windows and Linux should be minimal.


    OpenVPN uses a single executable to serve both the client and server components.
    Download the latest stable version from http://openvpn.net/download.html. You
    can download a .ZIP file or a Windows program (.EXE). The executable is easy to
    use, so that there will be the installation method used in the examples. OpenVPN
    is natively a command-line program; however, there is a GUI available for download
    from http://openvpn./. Follow these steps to get OpenVPN installed and configured.


