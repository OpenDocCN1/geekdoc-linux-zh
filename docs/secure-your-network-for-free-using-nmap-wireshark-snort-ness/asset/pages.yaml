- img_proc: true
  md: '# Chapter 1 • Presenting the Business Case for Free Solutions


    system cheaply, and then install your OS on it. This can be a viable option for
    running security tools and providing user workstations.


    # Consulting Costs


    You must carefully weigh and balance where you spend your money. Too little training
    and you will end up hiring consultants. Implementing, configuring, or fixing your
    free firewall cost a lot, more than if you had bought a firewall. With small commercial
    firewalls costing around $500.00, it doesn''t take long before its so free.


    With that said, don''t be afraid to call a consultant if necessary. Having a well-paid
    consultant configure your free solution and make sure it''s implemented using
    best practices is a steal compared to implementing some proprietary solutions.
    A consultant can also act as a trainer. You can shadow the consultant and see
    how and what is being done, and you can ask questions and learn why things are
    done in a certain way. In this way you can have your solution set up by someone
    who is knowledgeable and experienced, and provide training and guidance to the
    in-house personnel.


    If you have ever had to rely on consultants, you probably know they are not always
    a “good buy.” Sometimes they are not knowledgeable as you were led to believe.
    The key is to communicate with the consulting firm, being very clear about what
    your needs are. A good consultant can save the day.


    > WARNING


    You should attempts to save money end up costing more. In almost all cases, getting
    a consultant in quickly is the best course of action and the most cost effective
    in the long run. If you find a skilled consultant you like, a monthly retainer
    might be a good investment.'
