  md: 'Protecting Your Perimeter • Chapter 2


    # Solutions Fast Track


    # Firewall Types


    +   - In the networking sense, a firewall is basically any component (software
    or hardware) that restricts the flow of network traffic.

    - Some firewalls are notoriously limited in capability, and others are extremely
    easy to use.

    - To permit or deny traffic based on which network device is the sender or recipient
    and what ports are being used, you would use a packet-filtering firewall.


    # Firewall Architectures


    +   - The most securely configured firewall in existence will not provide much
    protection if the underlying network was not properly designed.

    - A screened subnet is the simplest and most common firewall implementation. Most
    small businesses and homes use this type of firewall.

    - The one-legged demilitarized zone (DMZ) still has the advantage of cost, because
    you are building a DMZ using only a single firewall.

    - The true DMZ is generally considered the most secure of firewall architectures.
    With this design, there is an external and internal firewall. Between the two
    is sandwiched which Internet accessible devices.


    # Implementing Firewalls


    +   - Netfilter is the built-in component that performs the firewall logic. iptables
    is the command-line interface used to configure the netfilter ACLs.

    - Many GUIs exist with widely varying degrees of functionality and complexity.
    My suggestion here is choose the simplest one that will do what you need to do.
    In all likelihood “right” one will change for you over time.

    - SmoothWall sits in a class of its own, due to the fact that it turns a PC into
    a dedicated firewall appliance that is completely configurable without ever logging
    into the underlying Linux operating system.


