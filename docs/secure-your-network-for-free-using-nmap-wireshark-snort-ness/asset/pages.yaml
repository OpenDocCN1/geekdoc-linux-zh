    The longest gap between all scanned records occurred at Sun Aug 13 21:25:32 2006
    was 0 days, 0 hours, 28 minutes, 18 seconds. c:\temp\Lab2003-System_LOG.txt contains
    1 parsed events.


    As you can see, EventCombMT found the entry we made early using EventCreate. The
