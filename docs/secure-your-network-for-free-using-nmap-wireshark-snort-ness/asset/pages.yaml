    # OSSTMM


    Let’s suppose that you can run vulnerability scanners and perform network discovery,
    but you want to take your security assessments to the next level. If you begin
    to think about all the security testing that could be, covering broad topics as
    wireless security, physical security, employee education, incident response, and
    much more, you might feel a bit overwhelmed. The task is so large simply figure
    out where to start could be difficult, and if you do that, there is always the
    possibility you might miss something critical. The OSSTMM (Open Source Testing
    Methodology Manual) is exactly what it sounds like. This is a free manual on how
    to perform a security assessment. It is very detailed (version 2.0 is 120 pages)
    and can be downloaded from www.isecom.org/osstmm/. Even if you choose not to perform


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_397_0.png)'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Testing and Auditing Your Systems • Chapter 6 383


    all the testing that is outlined in the manual, it is an invaluable resource to
    help guide you on proper testing procedures and practices.


    In addition to covering such pretesting tasks as defining scope of the testing
    and the rules of engagement, it breaks the actual areas to be tested down into
    sections and subsections called modules. Here are summaries of the sections


    +   **Information Security** This broad category covers such tasks as scouring
    the Internet for publicly available information that can provide clauses about
    nonpublic information. An example of indirect disclosure would be a job posting
    that specifically requires experience with F5’s BIGIP products, which would indirectly
    tell people what type of load balancers the company is using. It also covers the
    secure handling of confidential data, including personal data.


    +   **Process Security** This section includes testing verifying your procedures
    and attempting to gain unauthorized access via an e-mail or phone call, either
    through improper process (such as not verifying your identity before resetting
    an account) or while impersonating someone else. This section also includes lures
    authorized users to an external location (typically a virtual location as a Web
    page) whereby their credentials can be compromised or other information gathered.


    +   **Internet Technology Security** This section focuses more on the underlying
    technologies, and examines such things as the network, packet loss, routes, route
    control, ISP, and bandwidth of the target organization. This section is really
    where the build of security testing takes place performing a network survey and
    initial investigation via IP scanning and port scanning. Some indirect disclosure
    issues will also be touched upon here as you learn some things about the underlying
    network. The handling of confidential information will again be reviewed at the
    network level concerning encryption protocols and related technologies. This section
    also does the work of application vulnerability testing, route testing, access
    control testing, IDS testing, and testing of anti-Trojan


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_398_0.png)'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'and antivirus systems. Finally, this section includes modules to address password
    cracking, denial-of-service testing, and a review of the organization''s security
    policy.


    +   **Communication Security** This section includes testing the PBX and other
    communications methods such as voice mail, modems, and fax machines.


    +   **Wireless Security** Because of the complexity and expertise needed to thoroughly
    test wireless security, herself has its own section in the OSSTMM. This section
    includes esoteric methods as testing electromagnetic radiation (EMR), which can
    enable a person to read what appears on a CRT monitor from outside the building,
    based on the EMR that is projected beyond the display screen. It also covers the
    more mundane testing against the wireless network itself, including both 802.11x
    and Bluetooth networks. The broad category would even includes wireless headsets
    and the security of conversations over them, wireless hand scanners (such as in
    a retail store), RFID devices, and other wireless/cordless devices.


    +   **Physical Security** This section includes evaluating perimeter security,
    security monitoring, and access controls methods, such as gates, doors and locks.
    It also includes alarm response (all types of alarms, including fire, environmental,
    and a security incident alarm). The geographical location and ramifications thereof
    are also reviewed in this section.


    The end of the document contains multiple templates that can be used for your
    actual testing, such as a Firewall Analysis Template and a Password Cracking Template.
    These templates are not procedures but rather the type of documentation you would
    include with your testing, detailing exactly what was tested and how. These templates
    can be valuable for both ensuring that you do not miss any vital steps, because
    many of the steps have explicit sections of the template to record the specifics.


    The business model for the Institute for Security and Open Methodologies (ISECOM)
