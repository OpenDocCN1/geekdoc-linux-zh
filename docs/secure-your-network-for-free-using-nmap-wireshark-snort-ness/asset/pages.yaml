- img_proc: true
  md: '# Summary


    A secure network will stay secure only with proper maintenance. This maintenance
    needs to occur at many levels, such as patching software, upgrading hardware,
    and keeping IDS and antivirus signatures up to date. All of these upgrades and
    patches will need to conform to a change management process, which is in place
    to ensure that changes happen in a controlled fashion, designed to minimize risk.
    Some foresight should be applied to develop an appropriate response plan should
    a computer emergency occur. Remember, your network is much like a chain in that
    it is as strong as the weakest link. If any one of these areas is neglected, you
    may be creating a security risk. As the network administrator, you have to secure
    all these avenues, whereas a hacker only needs to find one unpatched or out-of-date
    system to compromise your security.


    # Solutions Fast Track


    # Patch Management


    +   - Virtually all network devices will need to be patched at some time or another.
    When patches become available, evaluate if they are needed at this time or if
    you can wait for a bundle (such as a service pack or new kernel) release that
    has had time to undergo more rigorous testing.

    - Apply extra caution when patching core components whose malfunction could mean
    a loss of all network functionality.


    # Change Management


    +   - All change carries some risk; change management is aimed at understanding
    and minimizing that risk.

    - Documenting changes is key to understanding your environment, which in turn
    lends itself to being able to troubleshoot the environment in the event of a service
    disruption.'
  merge: -1
  pgno: 485
- img_proc: true
  md: 'Security as an Ongoing Process • Chapter 8


    # Antivirus


    +   If you don''t keep your antivirus signatures up-to-date, you might well not
    have any antivirus protection at all. Maintenance is absolutely vital for signature-based
    products.


    # Antisypware


    +   Antisypware software may be integrated with your antivirus software, or it
    may be its own independent product.


    +   Because antisypware or malware products typically use signatures, like an
    antivirus program, these will need to be updated regularly.


    # Intrusion Detection Systems


    +   Keeping signatures up-to-date on a signature-based IDS is critical.


    +   Testing any IDS is key to preventing false positives, and in the case of an
    IPS, adequate testing will help you avoid creating a computer emergency using
    the IPS.


    # Vulnerability Scanning


    +   Vulnerability scanning must be a regular, cyclical process. The task is never
    done unless you make any any change to your systems.


    # Penetration Testing


    +   Make sure there are no ambiguities, so that you know exactly what services
    you are getting for the agreed-upon fee.


    # Policy Review


    +   Your IT policies (and standards/procedures) will need regularly scheduled
    reviews, and, if needed, modifications to maintain their value and applicability.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_486_0.png)'
  merge: -1
  pgno: 486
- img_proc: true
  md: '# Physical Security


    Physical security can include any security risks related to your environment.


    Most high-security environments mandate that any network ports that are not in
    use be disabled. This prevents unauthorized users from inadvertently using the
    data port to attack the system, load malicious software, or transfer sensitive/confidential
    data.


    # CERT Team


    You should have a procedure in place to respond to computer-related emergencies,
    including contact procedures so that the initial discovery can be escalated properly.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    **Q:** How much information should penetration testers have about the target before
    they begin?


    **A:** This varies. Often, the testers will begin with no information and have
    to gather it on their own. This would simulate what an external attacker could
    come up with. After an initial round of penetration testing using only the data
    was gathered by the testers, follow-up testing is performed after providing the
    testers with full information regarding the architecture and processes, in place.
    This second stage is to simulate the types of compromises an inside attacker who
    was knowledgeable about the target environment may attempt. In this way, the first
    penetration attempts would have a different set of obstacles. The filters on your
    firewalls are likely to be very different if you are coming in from the Internet'
  merge: -1
  pgno: 487
- img_proc: true
  md: 'than if you are internal to the organization. Although penetration testing
    isn’t always done this way, it does represent a very thorough way to test.


    **Q:** Should we tell other staff about a penetration test, which may “warn” employees
    to be vigilant?


    **A:** Again, this often done both ways, with the initial intrusions serving the
    dual purpose of testing your *security* and testing your IDSes and security response.
    After the initial responses, everyone will know the penetration test is underway
    and any pretense can be dropped, with security staff only monitoring the activities
    and likely providing reporting of what activity was detected.


    **Q:** Do all these roles need to be different people or can they all be done
    by the same person?


    **A:** The best guideline is to try to avoid any potential conflict of interest.
    If the person who is approving the server patches is the person who is applying
    the server patches, he or she might have a reason to “approve” applying them at
    lunch, rather than waiting until the weekend so that he or she doesn’t need to
    come into work on the weekend. probably won’t be possible to avoid all potential
    conflicts of interest in a smaller organization. In instances where it cannot
    be avoided, try to seek additional management signoff so that at least an additional
    set of eyes have approved the maintenance activity, and make sure all maintenance
    is well documented.


    **Q:** Where is the end of the vulnerability scanning cycle?


    **A:** There is no “end.” After the vulnerability scanning cycle has been implemented,
    steps 2 through 4 will be repeated forever.'
