  md: '# Security as an Ongoing Process • Chapter 8


    being initiated on the first of the month and traffic to the corporate Web site
    is expected to rise sharply. In this case, applying an operating system patch
    on the server the night before might not be a good idea. It is for these reasons
    the person scheduling the changes should not work in a vacuum, but instead seek
