- img_proc: true
  md: '# Chapter 3 • Protecting Network Resources


    Nice feature of the Windows Firewall is the ability to permit access based on
    the program that is running instead of on the port number. For the standard services,
    you probably know what port is needed, but sometimes a single application might
    need a large number of ports, or it may use a custom port and you''re not sure
    which port it needs. In these cases, you can permit the application to open a
    listening port, and the firewall will allow inbound connections. To do this simply
    click Add Program, navigate to the program needing access, and then click OK.
    If you happen to know the port you need to open, this is as easy as Click Add
    Port, and enter a reference name for the rule, such as Web Server. Then enter
    the port number—80, for example. As a final step, select whether to open the port
    for TCP or UDP connections using the radio buttons. Figure 3.20 shows the Add
    Port window.


    # Figure 3.20 Windows Firewall Add a Port Window


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_197_0.png)


    By clicking the Change Scope button, you can change the systems for which the
    port will be open. This allows you greater control over who will be able to connect
    to these ports. Your available options are Any Computer, My Network (meaning the
    subnet that the host is on), or a custom list of IP addresses. File sharing access
    would be a good example of changing the scope from the default (Any) may be advisable.
    As long as your entire network is on the same subnet, there is no reason to leave
    the scope at Any. By setting it to My Network, you ensure that only local IP addresses
    can connect.'
