- img_proc: true
  md: 'After it has learned which given host is on, it will then only send

    traffic destined for that host to that specific port. This means that any

    additional configuration, when you plug your IDS into a switch port, it isn’t

    going to be seeing much traffic.


    Luckily, there are some options for getting around this. Most

    enterprise switches (that is, the more expensive ones) have a port mirroring

    option. The terms used to describe this functionality vary from one manu-

    actor to another, Cisco calls it Switched Port Analyzer (SPAN). This enables

    you to configure a specific port so that it will see traffic from other designated
    ports. Typically, one (or all other ports) even when the traffic is destined for
    a dif-\ferent port. Typically, one is configured to mirror all other ports, and
    the

    IDS is attached to this port. On a Cisco 3750 switch with 24 ports you could

    configure mirroring by entering the following commands:


    ```

    switch(config)# monitor session 1 source interface gig1/0/1 gig1/0/23

    switch(config)# monitor session 1 destination interface gig1/0/24

    switch(config)# end

    ```


    This setup is straightforward. Line one specifies which ports to forward

    traffic from, and line two specifies which port should be mirrored to.

    You will need to refer to the user guide for your specific switch hardware to

    if port mirroring is supported, and if it is, how to configure it.


    # Configuring Snort

    on a Windows System


    From the start, the developers of Snort wanted it to be available on a wide

    variety of platforms. The current version will run on Linux, UNIX,

    Windows, and Macintosh OSX. This is good since you will probably be run-ning your
    IDS on whatever system happens to be lying around. There are

    cave to be aware when running Snort on Windows. For one, the,

    documentation is very *nix-centric. Many times it is referred to as the

    “default” behavior is not the default for Windows Snort. The second, more

    noticeable difference is that getting Snort up and running on Windows is

    actually more difficult than setting it up to run on Linux. Still, if your com-fort
    level is much higher on Windows (as it is for many), Windows still

    may be the best choice. For my example I installed on Windows Server

    2003 with all the latest updates applied.


