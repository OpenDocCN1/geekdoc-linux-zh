  md: '# Chapter 1 · Presenting the Business Case for Free Solutions


    some degree of customization is available, it is rarely free. Often, the hourly
    rate for such services is at a premium, the assumption being you must really want
    or need the desired functionality if you are willing to add it. With some free
    solutions, this customization can be affordable, or even free, if you have the
    expertise. However, not all free software is customizable. Just because it is
    free does not always mean it is open source. Open source software is where the
    source code (i.e., the programming code used to make it) is freely available.
    When software is open source, you can download the source code and edit it to
    your heart''s content. You can add as few or as many custom features as you want.


    Obviously, this is an advantage that not everyone will have or the means to take
    advantage of. Depending on the software package in question, some are programmed
    using languages, so if you have a resource who knows enough to be able to customize
    the program, they might not know the particular programming language that is required.
    Customization is also something you dont know until you are well into the implementation
    phase. If you know your customization ahead of time you can investigate and weigh
    the costs accordingly. Generally speaking, even if the cost is to customize the
    free solution as a comparable commercial solution, the level of customization
    that is possible is often (but not always) equivalent or better with the free
    solution.


    # # Comparing Free Solutions with Commercial Solutions


    When it comes to making an informed decision as to whether to purchase a commercial
    solution or implement a free solution, there are some additional non-dollar-related
    considerations to take into account. First and foremost, compare like functionality.
    Dont compare the deluxe version of the commercial product to the free version;
    they wont have the same features or learning curve, or require the same hardware.
    Ultimately, by making the informed and well-reasoned comparison possible, the
    best solution will be chosen.'
