    # Providing Secure Remote Access


    +   Your remote access options will depend most heavily on the platforms you have
    available to use for the remote access server. In most cases, the client used
    for remote access will run on virtually any OS.


    +   In conjunction with considering the available resources, you need to evaluate
    what your remote access needs really are. Is command line good enough? Do you
    need a remote GUI? Do you need to tap into existing sessions for a tech support
    type of functionality?


    +   For any remote access solution, remember make sure you are using encryption
    if you plan on the session traversing an untrusted network, such as the Internet.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask Author” form.


    Q: How do I make the NX Client connect to an existing session?


    A: Currently, the oft used solution is to have the local user use an NX session
    (localhost). That way, all of their activities are always within an NX session,
    making management (terminate, pause, resume) much simpler. Again, it''s not elegant
    but it works adequately.


    Q: I like the features of a particular flavor of VNC (or any remote access method)
    but it doesn''t support encryption. What can I do to secure it?


    A: One of the most common approaches is to use the SSH port-forwarding functionality.
    This is how many of the VNC variants are providing encryption behind the scenes
    always. While we discuss gaining access via SSH in this chapter, Chapter 5 (Managing
    Event Logs) contains detailed instructions on using the SSH port forwarding feature.


