    is something you''re interested in I highly recommend this list. https://honor.truescure.com/mailman/listinfo/firewall-wizards


    There are many lists out there. Some are generic and contain information related
    to any type of security issue, while others are very product specific. With a
    little search you can find several that serve not only as an early warning system
    for security-related news, but also as a sounding board to help you make sense
    of tough security questions that may arise.'
