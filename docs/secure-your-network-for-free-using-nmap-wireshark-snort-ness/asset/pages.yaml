- img_proc: true
  md: '# Chapter 2 • Protecting Your Perimeter


    there are no holes: every permitted port is one you expressly want to allow. Using
    the previous example, no traffic is allowed to the Web server except Web traffic.
    Sounds good, but the problem is, if the firewall is completely secure, the server
    might not be flawed. Flaws in the Web server software could allow the attacker
    to send an HTTP request that is 10,000 characters long, overflowing the buffers
    and allowing the attacker to execute the code of his choice. The packets used
    to transport the 10,000-character HTTP request are all legal TCP packets as far
    as the Web server is concerned: therefore, it would permit them to pass through
    to the Web server. The next step in firewall gateways, or layer 7 firewalls.


    This type of firewall not only filters network traffic on the standard network
    parameters, but they also understand the higher layer protocol contained within
    the packet, in this example HTTP. The firewall itself knows what a legitimate
    HTTP request looks like and can filter out malformed or malicious request even
    though, from a network perspective, it might otherwise be a permitted packet.
    There is a downside to this type of approach, which is that the firewall must
    be programmed with all the same intelligence needed to filter normal traffic,
    plus the firewall fully understand the protocols it is inspecting. This means
    additional programming for any protocol you want the firewall to understand. Most
    of the major commercial application gateways offer support for the major protocols
    such as HTTP, File Transfer Protocol (FTP), and Simple Mail Transfer Protocol
    (SMTP).


    With all of this information circulating in your head, you''re probably wondering
    which type is available for free. Generally speaking, you can find many free varieties
    of firewalls that perform some type of stateful inspection. Application layer
    gateways are not readily available for free. In reality, few organizations have
    the funds to use application gateways extensively. One ramification of not using
    an application gateway is that you need to ensure that the service that is exposed
    to untrusted traffic is configured as securely as possible and that the server
    itself is hardened against attack. Keeping the service patches up-to-date will
    help reduce the odds that an application-level attack will be successful.'
