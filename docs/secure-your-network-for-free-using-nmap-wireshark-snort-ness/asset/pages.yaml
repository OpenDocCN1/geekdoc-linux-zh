  md: 'Security as an Ongoing Process • Chapter 8


    # Policy Review


    You may be tired of all this maintenance, but believe it or not, even your policies
    need regular maintenance. As technologies change so must your policies. A new
    type of encryption could become available, or an established encryption algorithm
    be rendered ineffective due to some new attack vector. This type of maintenance
    will include policies, standards, and procedures documents. Procedures are usually
    pretty to identify, but unfortunately, you will often see policies and standards
    used interchangeably. The following bullet points outline each of these type of
    documents:


    +   **Policies** These high-level documents do not contain details, but instead
    state a broad objective or requirement. A common example would be something like,
    “All data classified as highly confidential must be encrypted.”These documents
    are generated by senior staff and change infrequently. Changes to policy are usually
    prompted by business factors.


    +   **Standards** These documents represent the more technical requirements that
    are needed to meet policy. For example, a standard might state that “when data
    encryption is required by policy, it must be done using 3DES or AES encryption
    only.”These documents will change as the relevant technologies have used change.


    +   **Procedures** These documents contain the detailed, step-by-step instructions
    to be used for policy and standards compliance. They will specify exactly what
    utility to use, which radio buttons to enable, and what boxes to check. These
    documents may change often, depending on the technologies used. An update to a
    software product may completely change the procedures you have established. Different
    procedures may assume a different level of expertise on the part of the person
    performing the procedure, but the general rule is to make the documentation as
    easy to follow.


    Each of these documents should be reviewed on a scheduled basis to ensure they
    are still adequately addressing the security needs of the organization. After
    being reviewed and, if needed, modified, they should be submitted'
