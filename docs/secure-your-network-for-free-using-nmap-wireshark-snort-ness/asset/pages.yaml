    involved, sometimes an update will actually do more harm than good, breaking some
    functionality or, in a worst-case scenario, rendering the system unusable and
    requiring a complete rebuild. While both the labor involved and the number of
    adverse reactions to patches have decreased as methodologies have matured, it
    is still not a fun task. In this section, we will look at how to keep your systems
    patched with a minimal amount of effort.


