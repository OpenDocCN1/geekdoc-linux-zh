  md: 'From these results you can see that the system has TCP ports 135, 139, and
    445 open, most likely indicating a Windows host. Just to confirm your suspicions,
    you could use Nmap''s operating system fingerprinting feature. Any given system
    on the network was likely programmed slightly differently, resulting in slightly
    different ways of responding to network traffic. Nmap can use these subtle differences
    in responses (such as TCP ISR [initial sequence number] sampling, TCP options
    support and ordering, IPID [IP ID] sampling, and the initial window size) as clues
    and compare them with Nmap''s os-fingerprint database. If it finds a match in
    the database, there is a good probability that the actual OS can accurately be
    identified. An example of the OS fingerprinting the -O option in action is shown
    in Figure 6.2.


    # Figure 6.2 Nmap OS Fingerprinting


    ```

    Starting Nmap 4.11 ( http://www.insecure.org/nmap ) at 2006-09-17 15:00

    Central Standard Time

    Interesting ports on 192.168.1.106:

    Not shown: 1676 closed ports

    PORT    STATE

    135/tcp  open  msrpc

    139/tcp  open  netbios-ssn

    445/tcp  open  microsoft-ds

    5101/tcp open  amdmong

    MAC Address: 00:08:02:32:8A:4C (Compaq Computer)

    Device type: general purpose

    Running: Microsoft Windows 2003/.NET/2K/XP

    OS details: Microsoft Windows 2003 Server or XP SP2


    Nmap finished: 1 IP address (1 host up) scanned in 2.813 seconds

    ```


    Nmap identified the system as either Windows 2003 Server or XP with service pack
    2. Further, you may notice that Nmap has identified the system as a Compaq based
    on the MAC address. With all information you have a pretty good idea of what type
    of system this PC is. The next step would be to find out where it is physically
    located. Assuming you will not recognize the subnet as belonging to a specific
    location, traceroute will'
