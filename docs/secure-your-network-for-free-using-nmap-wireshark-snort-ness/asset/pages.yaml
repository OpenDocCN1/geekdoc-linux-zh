  md: '# Managing Event Logs • Chapter 5


    Most of the fields are self-explanatory. The Event ID is often the quickest way
    to filter the list for a specific event if you happen to already know the event
    ID you are looking for. The User field is the user a process was running under
    when it generated the event. In most cases this will be NA or SYSTEM, which isn''t
    of much use. This field is most useful when viewing the security log. After you
    have configured the filters to your satisfaction, click Apply and OK. The event
    list will be filtered immediately. To remove the filter and display all events,
    go back to the filter list and click Restore


    The event log details can sometimes be cryptic. If the meaning of a particular
    event is not clear, there are many places on the Internet to get information on
    particular events (including www.Microsoft.com). A handy site to enter the event
    ID and source, as well as links to search for information for that event on Google
    and Microsoft''s Web pages.


    # Using Group Policy to Generate Windows Events Logs


    By default, Windows systems will generate event log entries for certain types
    of events automatically. Individual applications will generate events based on
    their programming. While the level of logging is adequate for day-to-day use,
    there are a lot of additional things you might wish to generate log entries for,
    particularly when it comes to security events. You can configure the operating
    system to generate security-related event logs relatively by applying policies
    to enable auditing via the Microsoft Management Console (MMC). You can access
    the console by navigating to Start | Programs | Administrative Tools. All the
    listed utilities, such as Services, are actually MMC snap-ins. You can also customize
    your MMC console and add the snap-ins of your choice instead of just viewing the
    snap individually. You will need to load the Security Configuration and Analysis
    snap-in to configure auditing. To do this, go to Start | Run, type mmc, and then
    click OK. This will open up the full'
