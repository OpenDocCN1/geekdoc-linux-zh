    2. Click Next on the welcome screen.

    3. Accept the license agreement and click Next.

    4. Enter a user name and organization if desired, choose whether the start menu
    entries will be made for all users or only the user who is running the Setup Wizard,
    and then click Next.

    5. Choose which components to install (the defaults are recommended) and the installation
    target directory and click Next.

    6. When the installation is complete, click Finish.


