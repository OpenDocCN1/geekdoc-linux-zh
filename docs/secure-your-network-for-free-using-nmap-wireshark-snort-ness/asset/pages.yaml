  md: '# Protecting Network Resources • Chapter 13


    Although the respective guides will go into great detail of hardening the operating
    system you are interested in, there are, of course, many articles on the Internet
    and books on the subject. Essentially you can summarize all of the hardening steps
    in a few high-level tasks which are the same on all operating system, and most
    of them do not require additional software other than is included with the operating
    system. The steps are as follows:


    +   1. Remove unnecessary software.

    2. Disable unneeded services/daemons.

    3. Patch the operating system and any remaining software.

    4. Configure user and group accounts to provide only the minimum required access.

    5. Tighten operating system parameters (login requirements, timeouts, etc.).

    6. Configure network access to permit only the minimum required connectivity (IP/ports).


    # Using Microsoft Group Policy Objects


    If you find yourself to lock down a particular security setting, such as removing
    user access to a directory, you could connect to each system and edit the security
    properties individually. While this would work, it''s not a very efficient way
    of doing things. Of course, you can use the MMC to edit and control these settings
    individually, and then have them applied to computers automatically. This collection
    of security settings is called a group policy object (GPO). You can apply a GPO
    to the domain level, to individual organizational units (OUs), or to individual
    computers in detail, so we won''t cover it here. Unless you have special needs,
    such as for a high-risk host, you will configure your security policy to apply
    to all devices within the domain. If you could then address any high-security
    hosts by applying a more restrictive local policy (this policy should not include
    settings that conflict with the domain policy or else will be


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 154 Chapter 3 • Protecting Network Resources


    overwritten) or placing the high-security hosts in a particular OU and apply an
    GPO. Here is a step-by-step example of how this would work.


    +   1. Local policies are applied.These could be modified or just left at the
    default; it doesn''t really matter if you will be updating them the domain GPO
    anyway.

    2. The domain GPO is applied to every device on the network (workstations and
    servers). This overwrites the local policy with settings you want applied to everyone.
    In effect, this acts as your security baseline.

    3. The GPO for the server OU is applied to the servers (or other high-security
    hosts). These devices will still have the minimum security settings from the domain
    GPO, but in cases where you wanted to define a strict security setting, the OU
    GPO will allow you to do so.


    The nature of GPOs is that you will configure settings with the intent of overriding
    other settings. GPOs are applied in the following order: local, the site GPO,
    the Domain GPO, and each OU GPO working downward. Typically you configure the
    domain settings to intentionally override the local computer security settings.
    Each successive application of the GPO overrides the previous one, which also
    has the desired effect that the local policies are of lowest priority.Youcan view
    the default domain policy by opening your MMC console. Add the Active Directory
    Users and Computers snap-in. Right-click the domain in question and select Properties.
    Click the Group Policy tab. Initially window will contain only the Default Domain
    Policy. This represents the top level of the domain, and you can configure multiple
    policies here. Again, all settings you configure in the domain GPO will override
    any local settings.


    If the default domain policy does not have that particular setting configured
    at all, the previous policy settings will remain in effect. Because the default
    domain policy contains all of your default settings, you do not want to edit it
    directly. Instead, click on New, give the new policy a name, and then click Edit.
    This will place the newly created policy below the domain policy.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_169_0.png)'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'You can use the Up and Down buttons to shift positions of the highlighted policy.
    As you can see in Figure 3.7, the highest policy in the list will take priority
    (remember all of the GPOs in this list are domain GPOs). Because any newly created
    policies are intended to override the default domain policy, you probably want
    to click Up so that your policy takes precedence over the default policy. Figure
    3.7 shows the Group Policy tab showing the default domain policy.


    # Figure 3.7 Domain GPOs


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_170_0.png)


    You can follow the same procedure to add a GPO to an OU (right-click Properties
    | Group Policy). In this fashion, you can assign granular policies to all your
    resources. If you click Edit, you are presented with the same MMC console structure
    as found within the Local Computer Policy snap-in. If you were to edit the Local
    Computer Policy settings, you would be configuring a local GPO, which would be
    overwritten in the event of conflicting settings with the domain GPO, or an OU
    GPO.


    You have noticed that within the Local Computer Policy snap-in there is no mechanism
    to import and export settings.This would imply that you have to configure any
    desired policies within Active Directory instead of doing so locally. Indeed,
    if you plan to apply the settings to all hosts, doing it within Active Directory
    may be a better way to do it, but there is actually a'
