  md: '# Netcat


    Netcat has often been described as the “Swiss Army knife” of troubleshooting tools.
    This is because its function is so elegantly simple that it has many uses. In
    essence, it establishes a communication session between two systems. You can enter
    `nc -l 2222` to tell system to listen on port 2222. On system two, the command
    `nc 192.168.1.10 2222` would connect to system 1 (assuming the IP address is 192.168.1.10)
    on port 2222. After the connection is established, anything typed at the console
    of either system is sent to the stdout of the other. Although both ends of the
    session can be netcat executable, they don’t have to be. In addition to providing
    a command line based method for transferring data, netcat enables you to test
    connectivity over arbitrary ports. By entering `nc <IP Address>` 23, you can connect
    to a system to verify that Telnet is listening and available. In, if you use the
    `-t` switch, netcat will negotiate the Telnet specifications. Although Telnet
    is often used in exactly the same way to test connectivity to arbitrary ports
    (telnet `<port>`), netcat is more versatile that enables you to connect via TCP
    (the default) or UDP.


    There are additional functions netcat offers to aid the network troubleshooter.
    Netcat can be configured to create a hex dump of the session (via the -o option).
    It can also be configured to execute a program when a connection is made (potentially
    unsafe if used carefully), or to restart it in listen mode after a session is
    terminated. Netcat can be downloaded from http://netcat.sourceforge.net/; the
    last update was in January of 2004. A Windows version (1.1) can be downloaded
    from www.vulnwatch/netcat/. Finally, a derivative project that adds typeof encryption
    is known as cryptcat and is available from http://farm9.org/Cryptcat/, with versions
    for both Linux and Windows. There is also a very similar utility called socat,
    which is being actively developed. Socat can be downloaded from www-destreach/socat/.


