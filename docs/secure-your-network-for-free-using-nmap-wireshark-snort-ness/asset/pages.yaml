- img_proc: true
  md: 'While the program is running, you will want to activate as many of its functions
    as possible. If you do not use a particular feature or menu function, the program
    may not fully exercise all the access rights it needs. When you are testing the
    program, stop the program manually. This will cause the analyzer to complete its
    analysis and show the results. Each tab contains the elevated access that the
    program used. In the example shown in Figure 3.3, I was testing Windup, the Windows
    command-line sniffer. If you navigate to View | Detailed Information, the window
    will split into multiple panes showing more detailed fields explaining what type
    of access was requested. With the help of this tool, the odds are very good that
    you can have access restricted to that of a standard user and simply grant elevated
    privileges where needed, rather than making the user account Administrator account


    # File-Level Access Controls


    With all your accounts and groups organized and secured, the next step is to get
    more granular and look at file-level access controls. This is also the logical
    step if you have used the Microsoft Standard User Analyzer and now need to modify
    some access within the file system. The standard way to access the file-level
    permission for a directory or file is to right-click on the file or folder in
    Explorer and select Properties. Select the Security tab and you will be able to
    see the currently applied access for users and groups, as shown in Figure 3.4.


    As you highlight each user or group in the top pane, the assigned rights will
    be displayed in the bottom pane.


    > Avoid the common mistake of clicking Deny when you do not want a particular
    user to have access to a file or directory. To remove access, you should instead
    remove the check in the Allow column—either directly or as an inherited permission
    from a folder higher up—the user will not have any access. The Deny selection
    overrides any granted access that may be present. This particular error occurs
    most often when an administrator wants to remove access to a directory for the
    Everyone group. By clicking Deny, no one will have access, including authorized
    users.'
