    If you refer to the file permissions in Figure 3.12, you will notice that the
    “number view” is listed. This is actually another way to represent file permissions.
    As you check or uncheck the various permissions, the number view will be updated
    and will display the new view. If the pattern to the numbers is a little hard
    to sort out, here is how it works. The rightmost digit indicates the permission
    for “other” users. The next character to the left represents the permissions for
    the group, and the next one to the left represents the permissions for the object
    owner. Read access corresponds to a 4, write corresponds to and execute to a 1.
    Each of (nux) is added together to indicate the access. Thus, access by the owner,
    group, and other would be 444 for the rightmost numbers. Read and write access
    for all three would be 666, and finally, nux for all three would be represented
    numerically as 777. You can use the chmod utility to change the permissions on
    a file from the command line, as shown here:


    ```

    # ls file.txt -o

    --r--r--r-- 124 Dec 8 23:32 file.txt

    # chmod 777 file.txt

    # ls file.txt -o

    -rwxrxr-x 124 Dec 8 23:32 file.txt

    ```


    Administering Linux file permissions is not more difficult than doing so for a
    Windows file system, but there are a lot of utilities involved when administering
