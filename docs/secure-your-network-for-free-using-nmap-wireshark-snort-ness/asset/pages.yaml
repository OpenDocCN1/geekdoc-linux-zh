  md: '# Lead Author


    Eric S. Seagreen (CISA, CISP-ISSAP, SCNP, CCNA, CNE-4, MCP+I, MCSE-NT) has 10
    years of experience in the computer industry, with the last eight years spent
    in the financial services industry working for a Fortune 100 company. Eric started
    his career working on Novell servers and performing general network troubleshooting
    for a small Houston-based company. Since he has been working in the financial
    services industry, his position and responsibilities have advanced steadily. His
    duties have included server administration, disaster recovery responsibilities,
    business coordinator, Y2K remediation, network vulnerability assessment, and risk
    management responsibilities. He has spent the last few years as an IT architect
    and risk analyst, designing and evaluating secure, scalable, and redundant networks.


    Eric has worked on several books as a contributing author or technical editor.
    These include Hardening Network Security (McGraw-Hill), Hardening Network Infrastructure
    (McGraw-Hill), Hacking Exposed: Cisco Networks (McGraw-Hill), Configuring Check
    Point VPN-1/Firewall-1 (Syngress), Firewall Fundamentals (Cisco Press), and Designing
    and Building Enterprise DMZs (Syngress). He has also received a CTM from Toastmasters
    of America.


    I would like to express my gratitude to several people who helped me make this
    book a reality. First and foremost I would like to say thank you to Sandra and
    Angela, for their support, patience, and understanding the entire process. I would
    like to thank Wes, for the quality and consistency of his constructive feedback.
    I would also like to thank Holla, for providing the original spark of an idea
    that eventually evolved into this book (specifically Chapters 2 and 7), and Moe,
    for being supportive when the opportunity presented itself.'
