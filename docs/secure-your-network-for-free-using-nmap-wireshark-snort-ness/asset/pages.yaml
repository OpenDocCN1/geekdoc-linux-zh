  md: '# Configuring Intrusion Detection System • Chapter 4 22


    Interface Device Description


    +   1 \Device\NPF_GenericDialupAdapter (Generic dialup adapter)

    2 \Device\NPF_{F95B71A4-C943-40BA-9F65-CD73D4B20769} (Intel R) PRO/100B PCI Adapter
    (TX)

    3 \Device\NPF_{A7F703C5-7567-49BC-B61-1A1F14614CAF} (SIS NIS SISNIC)


    (Note: The line has been wrapped for Interface 2 to this page.)

    When we start Snort, we can specify the interface to listen on using the -i switch.
    If you don''t, it will use the first interface, which in my case won''t see anything
    because it''s a dial-up interface that is not in use. The -c option to tell Snort
    which configuration file to use. It can be useful to have multiple configuration
    files configured so that you can quickly switch configurations for special circumstances.
    You could prepare different configuration files to home on certain issues, segments,
    or more in-depth logging. Another important option is -A, which tells Snort what
    type of alerts to generate. The options are fast, full, console, or none.


    The following command would start Snort listening on interface 3, with alerts
    going to the console only, using the configuration file at C:\snort\etc\snort.conf.
    The -K switch tells Snort what types of logs to generate. ASCII logs are easier
    for a human to read, but they take a little more time to log. If speed isn''t
    a concern, the ASCII logs will probably be the easiest to read and analyze manually.


    ```

    snort -A console -i 3 -c C:\snort\etc\snort.conf -l C:\snort\log -K ascii

    ```


    You should see any triggered rules produces a message on the console. If you add
    the -s switch to the end of the line, it will tell Snort to log to the syslog
    server you have configured in the snort.conf file; however, it will not only display
    on the snort console. If you want to create a rule for testing purposes to see
    what the results look like, create a test rule file, such as TESTING.rules, and
    place it in the rules folder (C:\snort\rules\ by default). In this file you could
    place the following line, which would trigger on any attempts to ping another
    system.


    ```

