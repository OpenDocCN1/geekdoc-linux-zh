  md: '# Roles and Responsibilities


    As in all areas of network security, roles and responsibilities are important.
    This is even more so when it comes to vulnerability scanning and remediation.
    The roles of individuals should be clearly documented and defined, with signoff
    from management at the most senior level. This is for several reasons. For one,
    you need to ensure that when John says it''s okay to leave that without any authentication,
    John is really qualified and authorized to speak on behalf of the business unit
    in question. You need to know that he understands the risks, and is held accountable
    for any repercussions that may arise. Another reason to clearly document these
    roles and responsibilities is to demonstrate that there are no conflicts of interest
    occurring. If John is the one who will have to stay up during the maintenance
    window all weekend to configure the servers, it may not be appropriate for the
    same person to say the servers need to be reconfigured.


    # Penetration Testing


    Penetration testing carries many of the same concerns as vulnerability scanning
    but will often be performed by a third party. This is because penetration testing
    requires individuals with a high level of skill and knowledge. Few businesses
    have the workload or budget to have such staff full time. Instead its very common
    to pay a trusted party for penetration services. The costs of such services can
    be considerable. Because of this, penetration testing is typically performed on
    high-risk/or high-criticality hosts and systems. Penetration testing when a new
    infrastructure is deployed isnt'' really maintenance, but subsequent penetration
    tests will fall into that category. The criteria whereby a system/host will need
    to be penetration tested again should be clearly defined. In most cases the criteria
    will be on a scheduled basis (such as annually), or when significant changes have
    occurred, whichever comes first. You should work with your legal counsel to develop
    a consent form that will protect you from accidental service disruptions.'
