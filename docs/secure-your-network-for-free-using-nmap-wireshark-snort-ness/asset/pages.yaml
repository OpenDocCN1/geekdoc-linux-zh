    # # Locating Wireless Systems


    Some of the most difficult systems to locate are ones with no physical connection
    to the network, as systems that rely on wireless connectivity. There are many
    reasons for denying a wireless site survey. If your company uses wireless technology
    you will probably want to learn what the effective work coverage is. Perhaps the
    building across the street to be able to use your wireless access point. On the
    flip side, you could perform a site map to out where your coverage is and needs
    to be redesigned. Or perhaps an employee has installed a wireless access point
    or repeater and such “rogue” devices are not permitted according to your company
    policy. If any of these are true you will want to identify the device exists,
    and if necessary, attempt to locate the physical device. Physically locating the
    system is more of an art than a science. A directional antenna a directional antenna
    can have as small as a 15-degree arc and when it comes to triangulating, the smaller
    the reception arc, the better.


    The pastime of taking a laptop computer and driving with a wireless network card
    and a wireless scanning utility such as NetStumbler is called *war driving*. This
    term is derived from an older technique in which you use a modem to dial large
    blocks of telephone numbers to see if


