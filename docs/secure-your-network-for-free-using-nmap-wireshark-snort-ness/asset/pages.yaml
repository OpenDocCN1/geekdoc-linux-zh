    # Linux Log Analysis


    When it comes to log analysis, there are many options available for Linux systems.
    What you are looking for in a log analysis utility will determine which one is
    the best for you to use, and in most cases no single utility will be able to do
    everything you might want toYou probably can, however, find a small subset of
    tools that do 99% of what you need. Two robust general-purpose tools are swatch
    and logwatch. Each general in purpose that they are not specific to a particular
    log format. Of the two, swatch is the more lightweight, being easier to set up
    but having fewer options. Swatch is intended to parse the logs in real time and
    act upon what it finds inside the logs according to the configuration you specify.
    Logwatch has a slightly different role. Its focus is on analyzing and reporting
    on log files, not in real time.


    # Configuring Swatch


    Because swatch (short for watcher) is relatively focused in its purpose, the setup
    and configuration are pretty simple. The swatch home page can be found at http://sw.sourceforge.net/.
    Some swatch behaviors can be set from the command line, but the rules must be
    in a configuration file. An example command line to invoke swatch -c /etc/swatch.conf
    –t /var/log/syslog, which tells swatch to use the configuration file (-c) /etc/swatch.conf.
    If you don''t specify which file to watch using the -t option, swatch will default
    to /var/log/messages or /var/log/syslog, in that order. If you don''t specify
    a configuration file it will echo everything to the console. You can use -f <file>
    to examine a file once, instead of it running continuously with the -t option.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_336_0.png)'
