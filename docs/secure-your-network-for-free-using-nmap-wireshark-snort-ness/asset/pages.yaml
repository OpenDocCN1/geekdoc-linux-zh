    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to **www.synergy.com/solutions**
    and click on the “Ask the Author” form.


    **Q: Does a simple port scan pose any risk to my target hosts?


    **A:** It definitely *can*. A simple ping scan to see which systems are alive
    shouldn''t pose any risk, but a more involved port scan *might*. If the target
    host has significantly more resources than the target system, you could exhaust
    the resources of the target system and result in an inadvertent denial of service
    attack. Of even higher risk are of Nmap''s more unusual scanning options. Some
    of the specialized TCP flag manipulation scans carry a definite risk to the target
    host. Because the flag combinations can be illegal (according to the TCP specifications)
    the target host might not be coded well enough to handle them. Granted, in this
    day and age this shouldn''t happen, but these types of scans still carry a risk.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_402_0.png)


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_402_1.png)'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'Q: Why are wireless access points such a big security concern? Why should I
    care if my users want to use someone else''s Internet bandwidth instead of mine?


    A: There are many reasons. If a user who is connected to your corporate network
    also connects to an open access point and his machine is attacked and compromised,
    the attacker has an open backdoor into your corporate network which probably bypasses
    all your firewalls and security measures. Even if you set aside the security issues,
    the user in question now has an outside connection that you cannot easily monitor.
    You no longer have visibility if that user is trafficking in trade secrets or
    otherwise transmitting confidential information. When the user is using your company
    connection, you have the capability to use the same IDS, collect traffic statistics,
    take advantage of a firewall you control, and apply other security policies.


    Q: Can I write my own custom “plug-ins” to perform special security checks using
    NASL?


    A: You can. There is a large body of plug-ins already available and odds are good
    the check you''re looking for is already available unless it is very customized.
    You can search the available plug-ins at index.php?view=search. The search results
    may include plugins that are not available yet except for the direct feed or registered
    feed customers. You can also create your own plug-ins from scratch and if they
    might be useful to others you can share them with the Nessus community. X-Scan
    also enables you to create your own plug-ins and uses the same NASL plug-ins as
    Nessus.'
  merge: -1
