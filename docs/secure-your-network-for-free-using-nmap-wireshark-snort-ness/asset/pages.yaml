  md: '# Netfilter Firewall


    Netfilter is the firewall component that is included with the Linux kernel. Unless
    firewall support has been explicitly removed, netfilter should be present on all
    Linux distributions. Unlike the Windows Firewall, which is really suited only
    for use as a personal firewall, netfilter is just as capable of serving as a personal
    firewall as it is a dedicated firewall for your perimeter Internet connection.
    Detailed usage guidelines, including several recommended GUI interfaces for configuring
    netfilter, is discussed in detail in Chapter 2. All of the same configuration
    recommendations that were discussed when implementing netfilter as a perimeter
    firewall will apply when using it as a personal firewall.


    # Configuring TCP Wrappers


    You can find similar functionality to the Windows Firewall''s capability to permit
    access by a program name in the Linux utility,TCP Wrappers. TCP Wrappers works
    in conjunction with the network-level filtering of a firewall. Whereas a firewall
    permits or denies traffic based on data contained in the IP header of the packet,
    TCP Wrappers filters access to services (by name) on the host which the service
    is running. Only services that are compiled against the libwrap.a library can
    use TCP Wrappers. With TCP Wrappers enabled, attempts to access a given service
    will be compared against the /etc/hosts.allow file, and then the /etc/hosts.deny
    file. Rules are checked sequentially and processing of the rules stops when a
    match is found. If a match is not found in either file, access will be granted.
    An example, if you wanted to allow only connections from synergy.com to SSH on
    your bastion host while rejecting all attempts, you would have the following two
    lines in your hosts.allow and hosts.deny files:


    ```

    /etc/hosts.allow

    sshd : .synergy.com

    ```


    ```

    /etc/hosts.deny

    sshd : ALL

    ```


    While you would not want to rely on TCP Wrappers as your only means of protection,
    it does have the advantage that in the preceding example, access'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 3 • Protecting Network Resources


    would be permitted to sshd regardless of the port on which it was listening. The
    two filter files accept wildcards, such as ALL, LOCAL, KNOWN, UNKNOWN, and PARANOID.
    You can enable logging in the rule files as well, and configure the facility and
    security of the log entry. With TCP Wrappers'' limited functionality and syntax,
    you might wonder why you would use it over simply using netfilter. Because iptables
    works at the packet level, if you want to deny access to a particular process,
    as HTTP, you must do it based on port number. So if you use netfilter to explicitly
    block connection attempts to port 80, and the user starts up the Web server and
    tells it to listen on port 8080, the connection will be allowed. With TCP Wrappers,
    you can permit or deny access to a process. In this way, you can ensure that a
    given process will work only on the port you want it to work. This distinction
    could prove invaluable if you have a service that uses a large number of listening
    ports, or some type of service that is spawned as needed and the port number isn''t
    always constant, or if the packets are tunneled in another protocol, rendering
    identification via port numbers impossible.


    # Providing Antivirus and Antispyware Protection


    Antivirus and antispyware efforts are a necessary evil in today''s world. Having
    no protection from viruses and spyware will almost guarantee that you will fall
    victim to one or the other eventually. Almost everyone has a good feel for the
    risk a virus can pose, from just being a nuisance to rendering a system inoperable.
    Spyware, despite all the hype, often doesn''t get the attention it deserves. I
    have seen many systems that have been choked with spyware-consuming resources
    that have slowed down to a crawl and are no longer usable. Worse yet, some spyware
    is very difficult to remove, which translates into more lost time and effort just
    to clean the computer. In the end, it''s definitely better not to let any spyware
    or viruses on a system in the first place than it is to have to deal with the
    hassle of trying to clean up the mess after the fact.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_203_0.png)'
