- img_proc: true
  md: 'this type of encryption can be useful for large numbers of frequently changing
    files. The native Windows encryption is a sort of hybrid solution, encrypting
    and decrypting data files automatically using your Windows credentials. You may
    not need to use all of these methods of encryption, or you may benefit from a
    combination of methods. Ultimately, one of the most common determining factors
    is ease of use. An encryption method that is easy to use will probably be far
    more consistently than one that is hard to use. We will review some of these methods
    in the next section in order to help you make an informed decision.


    # EFS


    Microsoft''s EFS shines really when it comes to ease of use. Once you figure it,
    there are no additional passwords to remember (other than your Windows login credentials),
    and you don''t need to manually encrypt or decrypt anything. EFS was introduced
    with Windows 2000, and you can implement it only on Windows 2000 or newer. With
    Windows 2000, a recovery policy was required in order to implement EFS. This allowed
    for an alternative method to recover encrypted data, in addition to the data being
    unencrypted by the original user who encrypted it. Without a recovery policy defined,
    EFS would simply not work. With Windows XP and 2003, this requirement was removed,
    meaning that if EFS is enabled and there is no recovery policy, a user could encrypt
    data that was not recoverable by the organization. In most cases IT policy is
    worded in such a way that any data the user might belongs to the organization,
    and therefore, the organization has a right to ensure that the data is recoverable.
    Because the default data recovery agent is the domain administrator, the risk
    of data becoming unrecoverable is particularly high with stand-alone workstations.


    Because EFS is enabled by default, it''s easy to encrypt an individual file or
    folder. Select the file you want to encrypt, right-click it, and select **Properties**.
    Click **Advanced** and check the box next to **Encrypt secure data**, as shown
    in Figure 3.29.'
