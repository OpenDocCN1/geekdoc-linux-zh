    Unlike firewalls, netfilter allows you to apply multiple rulesets (chains) to
    the same interface. Although it may seem minor, this option creates a lot of powerful
    possibilities. For example, suppose you have an ACL and you want to permit packets
    originating from 192.168.1.0 network except those from 192.168.1.11, which is
    a host that a third-party uses and is not a completely trusted system. You want
    packets sourced from 192.168.1.11 with a destination port of 22, 25, 53, 80, and
    443 to be permitted, while all other packets are blocked (see Figure 2.6).


    # 2.6 Cisco ACL


    ```

    1 somerule

    2 access-list 100 permit tcp tcp host 192.168.1.11 any eq 22

    3 access-list 100 permit tcp tcp host 192.168.1.11 any eq 25

    4 access-list 100 permit tcp tcp host 192.168.1.11 any eq 53

    5 access-list 100 permit tcp tcp host 192.168.1.11 any eq 80

    6 access-list 100 permit tcp tcp host 192.168.1.11 any eq 443

    7 access-list 100 deny ip host 192.168.1.11 any any

    8 access-list 100 permit ip 192.168.1.0 255.255.255.0 any

    9 somerule

    ```


    Figure 2.5, each line of the ACL is numbered for easy reference. The order of
    the rules is critical for proper operation of the firewall. Cisco processes each
    line in the ACL and the rule with the packet in question. If it finds a match,
    it performs the indicated action and stops any further processing of the ACL.
    This means if you reversed the order of rules 7 and 8, all packets from 192.168.1.11
    would be permitted. This type of arrangement also means that a packet with a source
    IP address of 192.168.1.22 has to be compared against rules 2–7 before being accepted
    by rule # 8. With seven rules this will happen quickly, but if the ACL is lengthy
    this extra overhead could be CPU-intensive.


    Netfilter''s ability to move through multiple chains for the same packet allows
    you to design your chains for greater efficiency (see Figure 2.7).'
