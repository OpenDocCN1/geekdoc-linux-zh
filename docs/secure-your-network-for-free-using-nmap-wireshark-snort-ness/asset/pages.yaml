  md: '# Chapter 5 • Managing Event Logs


    Now all that is left is to configure the IPsec policy on the syslog server. On
    the server side, you need to perform a similar configuration; however, there are
    some implementation details to consider before settling on your configuration.
    For example, if all the systems connecting to the syslog server will be using
    IPsec, you can configure the policy on the server to require IPsec, instead of
    requesting it. If you will have a mixture, with some systems using IPsec secured
    syslog and some systems connecting with plain UDP syslog (internal trusted systems,
    for example), the most secure option would be to require security from the individual
    systems that will be using IPsec, based on their IP address or IP segment.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_307_0.png)


    Remember that a logging server can make a very attractive target for many hackers.
    For one, if he gains enough access to see that logs are being sent, attacking
    the logging server may enable him to delete the logs and erase his tracks. In
    addition to erasing his tracks, the log server will likely contain a treasure
    trove of information about your internal systems and what software is running
    on them. Based on the log data, even more information may be deduced. As example,
    if the hacker sees a large number of connection from a variety of systems to a
    host in a DMZ on port 443, and then subsequent connection from that host to another
    in the internal network on 1433, the attacker might guess that the first host
    is an e-commerce Web server that makes calls to an internal SQL database, possibly
    containing customer information such as credit card numbers.


    If that is not enough, and the hacker cannot compromise the logging server, he
    could simply attack it to cause a denial of service so that it cannot receive
    the logs, or try to overwhelm the logging server with so many messages as to cause
    it to run out of disk space, crash, or at the least make it really hard to sort
    through the chaff to find entries related to his attack. For all these reasons,
    the logging server must be secure like any other high-risk system.


