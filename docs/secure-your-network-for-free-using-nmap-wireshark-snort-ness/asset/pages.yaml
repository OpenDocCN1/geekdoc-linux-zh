  md: '# Chapter 7 • Network Reporting and Troubleshooting


    # Introduction


    It is an unfortunate fact that network security is only glamorous to geeks. For
    everyone else, seeing an IDS purr away, or watching swatch grind through gigabytes
    of log messages is pretty dull, and more importantly, meaningless. There will
    inevitably be occasions where you need to demonstrate the state of your network
    to a less-technical audience. In some cases you need to justify a recent expense,
    in other cases you may need to provide support for a proposed expense. It is at
    these times that some tools to help turn the bits and bytes into graphs can go
    a long way. We will discuss several such tools in this chapter, and how they can
    be useful in your day–to–day activities.


    # Reporting on Bandwidth Usage and Other Metrics


    If you''ve ever been in a position to request approval to upgrade your Internet
    bandwidth, one of the first questions that often come up is, “What are we using
    the bandwidth for now?”You don''t want to have to admit you have any idea. In
    these cases, some type of reporting mechanism on network traffic would come in
    really handy. Or maybe the Internet responsiveness is slow because your Internet
    connection is saturated and you want to know what it''s being used for. A report
    based on the protocols and ports being used would do the job nicely. There are
    administrative uses for traffic statistics, but maybe the entire network has to
    crawl and you need to know why… are a lot of ways to determine the cause, but
    a nice graph showing that a particular workstation is generating all the traffic
    could help. If your reports clearly showed a particular workstation is uploading
    large amounts of data over a file sharing network, there could be security implications.
    When it comes down to it, there are a number of metrics that could be useful for
    administering and securing your network.


    There are many commercial products to provide various levels of insight into your
    network data flows. There are also a large number of products, both commercial
    and free, to collect more-focused pieces of data (such as Web server statistics).
    The following list provides a brief summary of some of the


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_405_0.png)'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Network Reporting and Troubleshooting • Chapter 7


    best general-purpose free offerings, with additional instructions on how to install
    and configure the products provided later in the chapter.


    +   **Multi Router Traffic Grapher (MRTG) ** When it comes to generic network
    statistics using free software, MRTG is one of the most widely used. You can download
    it for free at http://oss.oetiker.com/mrt/. It will run on Unix/Linux, Windows,
    or Network systems and is incorporated into many third-party applications. It
    derives its figures and graphs from simple network management protocol (SNMP)
    information, so you will need to support SNMP on your devices to use MRTG the
    data it needs. We will discuss SNMP concepts in more detail in the next section,
    feel free to jump ahead if you are not comfortable with SNMP. MRTG uses Perl (www.perl.org)
    on the back end for the real work, which is freely available and to install.


    +   **MZL & Novatech TrafficStatistic ** TrafficStatistic (www.trafficstatistic.com)
    works a little differently than MRTG; it gathers data by sniffing all the network
    traffic. Much like an IDS, for traffic analyzers that work this way, placement
    within the network will be crucial to collecting the data you want to see. In
    a small environment, this should not be too difficult. TrafficStatistic offers
    only minimal reporting data, consisting of total throughput (in, out, and combined)
    and a top-10 talkers (in, out, combined), and top-10 protocols (in, out, combined).
    If you need anything more than that, you can pay for additional plug-ins. Some
    of the plug-ins are affordable.You can download the free version from www.trafficstatistic.com/pages/basemodule.html.TrafficStatistic
    might be a good option if you want something that''s very easy to install and
    running only provides the most basic of reporting data.


    +   **PRTG Traffic Grapher ** This is probably the best free offering available
    at the time of this writing based on functionality and ease of use. You can download
    the free version from www.paessler.com/download/prtg. PRTG Traffic Grapher is
    one of


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_406_0.png)'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'the move versatile offerings and can extract statistical data from the NetFlow
    protocol, SNMP, and traffic sniffing. The setup is pretty painless and the graphs
    are well constructed by default. The limitation for the free version is that you
    can collect data from only three sensors, which is generous and will probably
    be plenty for a small environment.


    +   ntop Ntop (www.ntop.org) is a very powerful Web-based utility to analyze network
    traffic. can run ntop on FreeBSD, Linux, Solaris, SGI IRIX, AIX, and Microsoft
    Windows systems. Ntop does not natively include alert and notification mechanisms;
    its sole purpose is the collection and reporting of traffic statistics, which
    it does very well. The level of detail offered by ntop exceeds that of any other
    utility reviewed here. Ntop is also completely free, with no restrictions or limitations.


    # Collecting Data for Analysis


    As we discuss the various offerings for data analysis, a key consideration is
    how these products collect their data. The methods that are used will have a significant
    impact not on what metrics are available for analysis, but also the analysis host''s
    placement within the network and resource requirements. What follows is a brief
    explanation of what data-collection methods are most common, with some of their
    strengths and weaknesses.


    Sniffing data is one of the simplest methods of collecting data. Without any special
    configuration, sniffing the data means listening to all network traffic as it
    passes through the segment the host system is connected to. This technique is
    typically the most robust in sniffing the traffic, the host has the capability
    to see every single packet. What is done with all this data is up to the analysis
    engine, but the focus is that you are not grabbing pieces of information, you
    are collecting all the data, and then sorting through it. This method will be
    more processor intensive than most other methods, especially if there is a high
    volume of traffic.


    This method also requires precise placement of the host that will be collecting
    data, because it has no way to see the data unless it passes through the segment
    the host is on. Because of this, the physical location of the data-'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Network Reporting and Troubleshooting • Chapter 7 39


    collection system will likely be dictated by the network topology and location
    of traffic you wish to analyze. Besides resource requirements, the biggest drawback
    to this method is that it will collect data at the network level, with no regard
    for product-specific metrics. Although some analysis platforms attempt to remedy
    this and perform analysis on some higher-layer information contained in the packet,
    you will not be able to get the same level of upper-layer information as you will
    with the other methods.


    SNMP is a protocol that is designed specifically to accommodate the management
    of network-enabled devices. Although this management can include making changes,
    in a data analysis context, SNMP is really only used to retrieve information.
    When used this, a network host requests certain information from the SNMP-enabled
    device, which then sends the metrics in response. Alternatively, the SNMP device
    can be configured to send the metrics as a sort of alert when they surpass a configured
    threshold. The information collected is limited in that it is very focused. You
    can only ask a device for the specific statistics that it supports. While sniffing
    network data, SNMP can collect higher-layer, product-specific data that sniffing
    would not easily able to gather. An example of product-specific counters is the
    currentAnonymousUsers and currentNonAnonymous values from an IIS 6 server. Attempting
    to build the logic for a sniffer to track each connection to the IIS server and
    monitor if that connection used authentication would be very burdensome. Instead,
    SNMP can provide metrics directly from the IIS server, which is already tracking
    these connections.


    SNMP can also be a chatty protocol in a large environment, contributing to network
    congestion. In a small environment this is something to be aware of. The primary
    benefit that SNMP has going for it is that you do not need to place your data
    collector in the path of the data. You can place the system anywhere and then
    it will reach out and poll the devices (using a Get) for the desired data points.
    You can also configure an SNMP-enabled device to send the metrics to a collector
    when they reach a preconfigured threshold (via a TR). SNMP and sniffing provide
    different information, which enables the two to complement each other''s capabilities.
    Both SNMP and sniffing will require foresight and planning to implement mainly
    due to the fact that they collect their statistics differently.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_408_0.png)'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'NetFlow is a specially designed protocol for collecting network traffic statistics.
    NetFlow is primarily supported on Cisco devices, but some other manufacturers
    implement similar technologies, which exhibit varying levels of interoperability.
    NetFlow is similar in behavior to SNMP traps that once a NetFlow-enabled device
    has been configured, it will then send traffic statistics back to the data collector.
    The difference is that while SNMP targets very specific metrics that may be supported
    by the SNMP device, NetFlow targets a very small subset of network traffic data.
    NetFlow gathers information based on source and destination IP address, port number,
    the protocol being used, type of service settings, and the device interface. These
    metrics lend themselves to gathering data on bandwidth and network topers. This
    may sound like just what the doctor ordered; however, NetFlow is not supported
    on all devices, particularly the more economical models. This may mean that NetFlow
    is a less viable option for data collection in a small networking environment.
    If you do network devices that can support it, a little research would be advisable
    to see if you can take advantage of NetFlow data. You can read more about NetFlow
    from: cisco.com/en/US/products/ps6601/products_ios_protocol_group_home.html.


    > RMON stands for remote monitoring, which is yet another network management protocol.
    RMON is a standard, described in RFC2819, uses SNMP for its underlying functionality
    and an extensive set of new MIB objects for its data collection. Because it uses
    SNMP, RMON is vendor neutral, and RMON also takes steps to reduce network traffic
    where possible. While RMON support on enterprise class network analysis devices
    is good, it is virtually non-existent on free network analysis solutions.


    # Understanding SNMP


    As you can see from the brief summaries above, a lot of network devices rely on
    SNMP to gather information. This makes good sense, because SNMP is'
  merge: -1
  pgno: 409
- img_proc: true
  md: 'one of the most widely used architectures for managing systems in a centralized
    fashion. Some basic vocabulary you should be familiar with includes the Management
    Information Base, or MIB. The MIB is basically a hierarchical-like structure,
    serving as a catalog of settings that can be read or changed on the target system.
    The MIB consists of some portions that will be the same across all devices that
    support SNMP, and other portions that can be defined by individual vendors. Any
    specific object in the MIB can be referred to by its Object Identifier or OID,
    which is a numerical map to find the object in the MIB. As an example, the first
    highest level object in the MIB could be referred to as 1 and each of 3 objects
    one lower would be 1.1, 1.2, and 1.3. This pattern is continued, and due to the
    large number of objects, a typical OID would be 1.3.6.1.2.1.2.2.1.14.1. In addition
    to the numerical reference to OID, each subtree also has a corresponding name.
    Using the previous example, 1.3.6.1 the full name is used less often than but
    you may encounter it. A managed device can be almost any network device that runs
    an agent that can translate device-specific management information into an SNMP-compatible
    format. The Network Management Station is the device doing the managing, and can
    be referred to by many names depending on where you are reading.


    The basic operations the management station can perform on the MIB objects are
    Get and Set. There are some variations such as GetNext, or GetBulk, but suffice
    to say that it all boils down to using a Get to read a value in the MIB, and using
    Set to set what it is. In the case of network throughput all we are doing is a
    Get for relevant MIB objects. An example would be 1.3.6.1.2.1.2.2.1.14, which
    is interface inbound errors. Another key feature of SNMP is management the Trap.
    The Get or Set operations are initiated by the management station, acting as the
    client to the managed device; the Trap is initiated by the managed device. An
    SNMP trap is basically an alert of some preconfigured condition, like the notifications
    available in PRTG Traffic Graph. Traps are sent from the managed device to the
    management station that was specified as a sort of alarm.


    If all this seems confusing, don''t be alarmed. If you follow the examples below,
    a little hands on should help clear things up.There are also several free tools
    to browse a device MIB. Using one of these will probably be useful'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Chapter 7 • Network Reporting and Troubleshooting


    for understanding what the OIDs are and how they are used. I suggest using GetIf
    from www.wtcs.org/snmp4pc/. It is a free MIB browser that is pretty easy to use.
    Once you get it installed, simply enter an IP address or host name in the Host
