    * hisecsec. Provides further restrictions on LanManager authentica-

    tion further requirements for the encryption and signing of

    secure channel and SMB data above and beyond what is configured

    within the securesec templates.

    * rootsec. Will reset the default permissions on the drive roots and

    propagate those permissions to child objects. Use with caution.

    * securedc. A “secure domain controller” template that will configure

    tighter restrictions on domain account policies and additional restric-

    tions on anonymous users.

    * securews. A “secure workstation” template that will configure

    tighter restrictions on local account policies and additional restric-

    tions on anonymous users.

    * setup security. Holds the default settings and is usually a good

    place to start if you’re not sure which template to use.


    Figure 3.8 shows the Security Templates snap-in. If you want to create

    your template, or make any changes to one of the default templates, you'
