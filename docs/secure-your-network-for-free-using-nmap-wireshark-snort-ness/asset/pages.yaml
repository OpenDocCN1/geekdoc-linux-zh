- img_proc: true
  md: '# Chapter 4 • Configuring an Intrusion Detection System


    10. The next section has commented out lines to disable certain detections of
    some infrequently types of traffic. Unless you are having issues with alerts or
    your IDS is very low on resources, it''s probably fine to leave those at the default
    (enabled) configuration.


    11. The last few lines of the "step 1" section enable you to configure the detection
    engine for systems with limited resources. Unless you are having issues, you can
    leave this option alone.


    12. After that the "step 2" and "step 3" sections of the configuration file allow
    you to enable or disable specific functionality and detect particular types of
    attack, such as fragmentation attacks, stateful inspection, and stream reassembly.
    Delving into the specifics of each of those options is beyond the scope of this
    chapter and for many, the default setting will serve them well.


    13. The section labeled #4 contains output options for Snort. Uncomment output
    alert_syslog: LOG_AUTH LOG_ALERT (the default). Despite what facility and security
    you configure, the alerts will be generated by auth.info. You also need to include
    the -s switch on the command line to enable syslog logging. We will discuss syslog
    in detail in the next chapter. If you don''t have a syslog server to log to, just
    make note of the setting and come back to it when your syslog server is set up.


    Using the preceding example of LOG_AUTH and LOG_ALERT, you would need the following
    in your syslog.conf file to log to a syslog server at 192.168.1.99:


    ```

    auth.info @managementserverIP

    ```


    If you are using syslog, you would need a logging destination defined, a later
    filter in the syslog-ng.conf file. An example of this configuration would be the
    following:


    ```

    destination d_lab { udp ("192.168.1.99") port (514)); };

    filter f_most { level(info..emerging); };

    log { source(s_sys); filter(f_most); destination(d_lab); };

    ```


