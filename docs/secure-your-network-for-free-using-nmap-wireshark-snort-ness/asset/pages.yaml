    # Solutions Fast Track


    # Intrusion Detection Systems


    +   - The most common way to implement an IDS is by having a system monitor and
    inspect (sniff) all traffic over a given link.

    - An IDS compares traffic with a database of known signatures for undesirable
    traffic is an example of a signature-based IDS.

    - Some IDS systems are anomaly based, which means the IDS attempts to build a
    list of“normal” traffic from your actual network data, and then it flags anything
    that doesn''t fit the list of normal traffic that it has built.


    # Configuring an Intrusion Detection System


    +   - Placement of the IDS will be key. If the IDS is not placed properly you
    will miss alerts and possibly think you are more secure than you really.

    - Your IDS is probably the security host that will need the most hardware resources
    of any discussed in this book (with the firewall being a close second), so plan
    accordingly when selecting the hardware to use for your IDS.

    - Remember that even with the proper physical placement, you need to have a hub
    in order for the IDS to be able to see traffic destined for other devices, or
    enable port mirroring if you are using a switch instead of a hub.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_274_0.png)'
