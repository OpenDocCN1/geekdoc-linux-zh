    To uninstall the package you must use the package name, which is not the name
    of the RPM file. To uninstall tcpdump 3.9.4-1, enter the following command, using
    the -e switch for erase.


    ```

    -e tcpdump-3.9.4-1

    ```


    We hope that by this point you have some idea of the troubleshooting power a sniffer
    can provide. You might wonder why you wouldn''t just put Wireshark on every system
    in case a troubleshooting issue comes up. Consider that a hacker manages to gain
    access to any of your systems; a network sniffer is an indispensable information-gathering
    tool for the hacker. If you provide a pre-installed and configured sniffer for
    the hacker to, you might make the hacker''s job a lot easier. On top of, installing
    additional software on production systems is something you want to minimize if
    at all possible. Although the WinPcap driver has been dependable for a while (which
    wasn''t always the case), installing network drivers always carries the risk of
    disrupting network communications if something'
