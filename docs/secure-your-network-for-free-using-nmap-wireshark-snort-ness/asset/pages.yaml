  md: 'mended) instead, add the following to the syslog-ng.conf file in the source

    definition section (s_sysys) is the default source definition).


    ```

    tcp(ip(0.0.0.0) port(7140));

    ```


    Replace 7140 with the TCP port you wish to receive syslog messages on.

    If you wish to configure some type of encryption for your syslog messages to

    the Linux host, you can use any of the previously discussed examples to

    amplish this.


    # Analyzing Syslog Logs on Windows and Linux


    Now that you are receiving all these wonderful logs, there is the question

    of what to do with them. You are probably realizing that they can create a large

    volume of data in a relatively short time frame. You need a way to sort

    t the log files and pick out the most interesting pieces of information,

    dan then do something about it when necessary, preferably all in auto-

    fashed possible. There are basically two types of processing you may

    wish to perform on your log data. One is real time analysis, and the other is

    offline analysis at some later point in time after the logs have been

    generated. Typically, the real-time type of analysis is used for sorting out the

    more important events from the bulk of “normal” activity and highlighting

    em or sending alerts to bring these events to the attention of a human for

    further analysis. This type of analysis and response can take many forms, from

    a simple color coding as the events scroll across an administrative terminal,
    to

    complex rules for sending out e-mails or paging people.


    The offline analysis is more often used for less-sensitive investigations,

    such as identifying trends or spotting issues for follow up. For example,

    a CPU running a little high is no longer a critical event that would be

    flagged during a real-time analysis, while a chronically high CPU might be

    som you want the offline analysis to report on. On a similar note, an

    excessively high CPU would be appropriate for real-time notification because it

    could indicate a production device is no longer able to adequately service

    requests. Each type of analysis has its merit and uses. What follows is a discus-

    sion of some useful tools for log analysis.'
