- img_proc: true
  md: '# Protecting Your Perimeter • Chapter 2


    with a default policy of DROP, you will not be able to manage the firewall remotely
    unless you have configured the firewall rules to permit the management traffic.
    This traffic is processed against the INPUT chain, because the destination is
    the netfilter itself. To allow secure shell (SSH) connections to the firewall,
    use the following command:


    ```

    iptables -A INPUT -p tcp -s 192.168.99.0/24 --dport 22 -j ACCEPT

    ```


    In this example, you are applying (-A) a rule to the INPUT chain to allow traffic
    from 192.168.99.0/24 to a destination port of TCP 22. With no other configurations,
    all other traffic through or to the firewall would be dropped. This will show
    up in the rule list as follows:


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_60_0.png)


    ```

    iptables -L INPUT

    Chain INPUT (policy DROP)

    Target opt source destination

    ACCEPT 192.168.99.0/24 anywhere tcp dpt:ssh

    ```


    Although the aforementioned rules will not permit the inbound SSH session, if
    you were to change the default policy for the OUTPUT chain to ACCEPT, this would
    permit the reply packet, but we will instead address this more securely in the
    next few examples.


    If you also wanted to allow 192.168.99.99 access to the firewall with a destination
    ofTCP port 80, you could use the same syntax with -A to append the rule, which
    would put the new rule for port 80 after port 22.You could also use -I for insert,
    as in the iptables -I INPUT 1 -p tcp -s 192.168.99.99 -j ACCEPT command. This
    would insert the new rule in the INPUT chain as rule #1, meaning the rule for
    port 80 would come before the rule for port 22.Remember, this is still permitting
    only half of the conversation; you still need to permit the outbound reply packets.
    It is sometimes useful to list the chains with line numbers using the iptables
    --line-numbers command.


    For outbound traffic (i.e., traffic generated by the firewall), you need to create
    rules in the OUTPUT chain. To enable syslog traffic from the firewall to a remote
    syslog server (192.168.1.99), you would enter the following:


    ```

    iptables -A OUTPUT -p udp -d 192.168.1.99 --dport 514

    ```


