    the owner, allowing the user to run the program without ever needing to know the
    root user password. Basically, whether SUID is an asset or a liability depends
    on the program to which it is attached. The SGID bit does the same thing, except
    the program is now the group owner. All the same security considerations apply
    for SGID as for SUID.


    The sticky bit is much less interesting than it sounds. When set, it tells the
    operating system not to unload the executable from memory after a user closes
    it. In this fashion, the program (the sticky bit) applies only to executable files
    will now start faster. This can have some security implications, but it is not
    used anymore and is mostly a holdover from when Linux was intended to serve as
    a multiserer operating system.


    With these special bits out of the way, let''s look at the basic system permissions.You
    can list the files in a directory in long list format, including the detailed
    files permissions, using ls -l:


    ```

    ls -l

    total 116

    drwxr-xr-x 5 root 4096 Dec 9 00:10 Desktop

    -rw-r--r-- 1 test 164 Dec 8 23:32 file (copy).txt

    -rSw--r-- 1 test 164 Dec 8 23:32 file.txt

    -rw-sr-r-- 1 root 26225 Sep 9 14:37 install.log

    -rw-sr-xr-- 1 root 3973 Sep 9 14:36 install.log.syslog

