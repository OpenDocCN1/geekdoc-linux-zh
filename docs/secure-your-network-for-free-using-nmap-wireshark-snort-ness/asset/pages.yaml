  md: '# Protecting Your Perimeter • Chapter 2


    Once you have chosen a design and VPN technology, you need to consider the administrative
    ramifications of offering remote access. Some training will be required, at the
    very least so that they can use the VPN software. You should educate users on
    good security habits as well. A determination will also need to be made to whether
    remote users are allowed to use their own personal computers, or if they must
    use a company-provided computer for remote access. The former option carries with
    many risks. When remote users connect their personal computers to the corporate
    network (via a VPN), they may have spyware, a virus, or any number of potentially
    damaging conditions present on their systems. Because you probably don''t have
    any administrative access to their systems, you may have no way to secure the
    personal systems even if you wanted to. This is why most companies require that
    only corporate resources be allowed to connect to the company network. In the
    case of remote users, this typically means a company-provided laptop, but I have
    also seen instances of older desktops being sent home for remote access.


    A final consideration is one of hardware selection. Normal desktop applications
    typically place little strain on an even modern processor. The same is not true
    when it comes to VPN connections. A single VPN connection requires little overhead
    and rarely impacts the remote user''s system unless it is especially overpowered.
    For the VPN concentrator, however, it will handle the encryption and decryption
    of multiple connections, in addition to managing the volume of network data that
    will be accessed through it. For this reason, if you anticipate more than just
    a couple of VPN connections to be used simultaneously, you will want to test and
    evaluate your hardware needs.


