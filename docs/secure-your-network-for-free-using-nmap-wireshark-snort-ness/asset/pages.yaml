- img_proc: true
  md: '# Chapter 2 • Protecting Your Perimeter


    # Figure 2.29 VPN Concentrator Design


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_103_0.png)


    Another way to place the VPN concentrator inside a DMZ is to use an additional
    interface on the firewall as the DMZ in a "one-legged" configuration. This saves
    you having to implement an additional firewall, but still provides some isolation
    between the concentrator and the rest of the internal network. If an attacker
    compromised a remote host who was VPN''d into the concentrator or compromised
    the concentrator itself, they would still have a firewall between them and the
    internal network. The least preferable option is to place the concentrator inside
    the internal network. With this type of design, if the concentrator is compromised,
    the attacker would have full access to the internal network, with no firewalls
    to inhibit their activities. With any of these designs, you will have to permit
    the required ports through the firewall and forward them to your VPN concentrator.


    Another consideration is the type of VPN protocol you want to use. IPsec is still
    the most widely deployed VPN technology for good reason. As a widely used and
    tested standard, IPsec will work with virtually any firewall and operating system.
    The disadvantage of IPsec is that it can be difficult to configure properly, and
    there is zero margin for error on the configuration. Both ends have to use the
    same parameters for encryptions, hashing, and so forth, and the tunnel cannot
    be established. Secure Sockets Layer (SSL) is an increasingly popular choice for
    VPNs, largely because of its simplicity to implement.'
