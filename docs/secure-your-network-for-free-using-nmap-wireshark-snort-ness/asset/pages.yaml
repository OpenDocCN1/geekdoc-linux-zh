- img_proc: true
  md: '# Obtaining the Support of Senior Management


    Due to the nature of the checks, vulnerability scanning and especially penetration
    testing carry a high risk of causing a service disruption. There are just too
    many components that must work properly for everything to go smoothly. All it
    takes is single process running on the target host to stop working and the system
    could come to a crashing halt. A little research and you find countless stories
    of the overworked network admin who is testing in an effort to point out a security
    risk, only to lose his job for “hacking” the company resources. No matter how
    well your intentions be, if you use Nessus to run a vulnerability scan against
    the server running the company Web and it crashes the Web site, you will surely
    be in some grief. It is for this reason that you must obtain approval from the
    most senior management possible before undertaking any of these high-risk activities.
    This approval should be in writing and signed by someone with the appropriate
    authority to do so. This may be the only thing you have to act as proof that your
    activities were authorized and legitimate.


    # Clarify What You Are Buying


    The phrase caveat emptor says “let the buyer beware.” When it comes to penetration
    testing this is especially true. There are a great security consultants out who
    will perform a vulnerability scan using Nessus (free), print out the results,
    and hand the customer the report along with a bill. This is not a penetration
    test. A penetration test requires someone who has the skill to be a “hacker” but
    chooses to make a legal living out of security testing. You can get a lot more
    value out of your penetration testing by taking the time to sit down and talk
    with your prospective provider of such services. Ask for references, do your research
    and outline exactly what services they will provide, in writing, prior to signing
    on the dotted line. There is nothing wrong with running a vulnerability scan,
    and there is nothing wrong if you want an expert to run the scan for you. You
    just need to be sure you are buying what you think you are buying. Being an educated
    consumer will help you obtain a better value with security services and help your
    organization be more secure.'
