  md: '# # Firewall Architectures


    The most securely configured firewall in existence will not provide much protection
    if a network was not designed properly. For example, if the firewall was installed
    in an environment that allows an alternate network path that bypasses the firewall,
    the firewall would only be providing a false sense of security. This is an architectural
    error that would render the firewall useless. In short, where the firewall is
    implemented is every bit as important as how it is implemented. The first step
    to installing anything is always planning. What follows is a discussion of the
    most common firewall architectures, in increasing order of security. Remember,
    these sections are discussing firewall architectures independent of the firewall
    type. For example, you could use a packet-filtering firewall, a stateful inspection
    firewall, or an application gateway in any of the designs discussed in the next
    section.


    # # Screened Subnet


    A screened subnet is the simplest and most common firewall implementation. Most
    small businesses and homes use this type of firewall (see Figure 2.1). This design
    places the firewall on the edge of your network, dividing everything (from the
    firewall''s point of view) into internal and external, with nothing in between.


    Figure 2.1 Screened Subnet Firewall


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_42_0.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Chapter 2 • Protecting Your Perimeter


    The screened subnet firewall (or edge firewall) is as straightforward as you can
    get. Internet users who need access to an internal server (e.g., Web, FTP, SMTP,
    and so on) must traverse the firewall to do so. Internal users needing access
    to those same servers would be able to access them directly. Internet traffic
    not destined for any Web-based server would be blocked by the firewall to prevent
    attacks on internal systems. All internal users must also traverse firewalls to
    access the Internet. This is the same type of architecture you would have at home
    with a small network behind a Linksys router. This configuration has several advantages.
    The primary advantage is simplicity. With only two interfaces, the Access Control
    Lists (ACLs), which are the filters that define the criteria for permitting or
    denying traffic, are much simpler.


    Although this configuration is cost-effective and simple to implement, it is not
    without its drawbacks. In this arrangement, the hacker has several chances to
    penetrate your network. If he or she can find a security hole in the firewall,
    or if the firewall is improperly configured, he or she might be able to gain access
    to the internal network. Even if the firewall is executed flawlessly, the hacker
    has a second opportunity to gain access. If the hacker can compromise any available
    Web-based services and take control of the servers, he or she would then have
    an internal system from which to launch additional attacks. Finally, if the servers
    are critical to the business function, by allowing the internal users to access
    them without going through the firewall, you may lose some audit capability that
    the firewall might otherwise offer. By far the biggest security weakness in this
    configuration is that if you are exposing any Web-based services: the servers
    hosting those services will be attacked frequently, and a compromise of one of
    those servers may expose your entire network.


    # One-Legged


    The one-legged demilitarized zone (DMZ) still has the advantage of cost, because
    you are building a DMZ using only a single firewall (see Figure 2.2). Commonly,
    the firewall interfaces are called Internal or Inside, External or Outside, and
    DMZ.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Figure 2.2 One-Legged DMZ


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_44_0.png)


    With this type of configuration you get to keep the low cost benefit, but add
    some isolation to your Internet-based servers. Internal users must traverse the
    firewall to access the servers or the Internet. External users must traverse the
    firewall to access the Web-based services. The real strength of this type of configuration
    is that if the servers that are hosting the Web-based servers are compromised,
    the hacker still needs to contend with the firewall to continue attacking the
    internal network. As an added feature, because all users (internal or external)
    must traverse the firewall to access the Web-based servers, you may gain a higher
    degree of auditing from the firewall logs. If you wanted to provide further isolation,
    assuming you have the available interfaces on the firewall, you could implement
    a separate DMZ for each Web-based server you needed.


    The only real disadvantages to this configuration are complexity, and to a small
    degree, cost. As you add interfaces to the firewall, the configuration will become
    more complex. Not only does this complexity add to the time and labor for configuration
    and maintenance, it also increases the chance that an error could be made in the
    configuration. As you add interfaces there will often be additional costs associated
    with them. In many cases this cost will be minor and far less than an additional
    firewall, but with some high-speed interfaces, they can become very costly. Lastly,
    though many would consider it minor, with this configuration, if the firewall
    itself is defeated, the entire network is open to attack. Of course the solution
    to such paranoid thinking is costly.'
  merge: -1
