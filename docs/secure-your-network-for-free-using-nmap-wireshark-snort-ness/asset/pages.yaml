- img_proc: true
  md: '# True DMZ


    The true DMZ is generally considered the most secure of firewall architectures.
    With this design, there is an external and internal firewall. Between the two
    is sandwiched by any Internet accessible devices (see Figure 2.3).


    # Figure 2.3 True DMZ


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_45_0.png)


    Internet traffic is only permitted to a server in the DMZ, and only on the port
    that server is listening on. For example, if you had a Web server in the DMZ and
    an FTP server in the DMZ, traffic with a destination port of 80 would only be
    permitted to the Web server. For users accessing the same servers, the same rules
    would apply. Internal users would have to go through both firewalls to access
    the Internet. Obviously, this type of design costs more, typically double, but
    that buys increased security. In a true DMZ, if the Web server is compromised
    the hacker is stuck between two firewalls For those who want to go the extra mile,
    the inside and outside firewalls can be of different types (e.g., Cisco Private
    Internet Exchange [PIX] and Linux filter). In this way, a hacker that finds a
    security hole in one firewall is unlikely to be able to apply the same techniques
    to the other firewall.


    With all the basics out of the way, you will be in a better position to make informed
    decisions when it comes to time to propose and implement a firewall solution for
    your network. Bear in mind, while this chapter covers the basics of firewalls,
    there are entire volumes (such as Designing and Building Enterprise DMZs by Syngress
    Publishing, 2006) that explore the topic of wall architectures, DMZ design, and
    implementation.'
