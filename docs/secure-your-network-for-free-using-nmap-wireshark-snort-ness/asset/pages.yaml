  md: 'The Permissions tab allows you to control inheritance. With inheritance, if
    you grant access to a folder, it is assumed that you should have the same level
    of access to newly created files and folders underneath that. The new folders
    effectively inherit the same access control lists. The Replace permission entries
    on all child objects with entries shown here that apply to child objects checkbox
    allows you to do much the same thing with existing folders and files. The Auditing
    tab allows you to configure auditing on files and folders. Chapter 5 covers auditing
    on files and so we won''t discuss it here. The Owner tab can be very useful to
    a file or folder (either directly or via membership in the Everyone group), the
    simple method to regain control over the file or folder is to go to a level above,
    where the administrator has access, and take ownership. You can do this by navigating
    to the Owner tab. The administrative user you are logged as should already be
    entered in the Name field. Select the checkbox that says Replace owner on subcontainers
    and objects and click OK. As the new owner, you will always have access. You can
    then edit the permissions as needed to restore proper operation.


    The Effective Permissions tab allows you to specify a particular group or account
    and generate a listing of what access users would have. This takes into account
    inheritance, group membership, and explicitly defined permissions that may be
    present. To see the effective permissions for a user, click Select. On the next
    screen, you can enter the account name, or if you are unsure of the account name,
    you can click Advanced. This will take you to a third window that you can search
    for an account name. You can click the Object types button to limit the search
    to only users, groups, or built-in security principles, for example. The Locations
    button will allow you to choose on which system you want search. After selecting
    your search criteria, you will see the Find Now button. With no search criteria
    defined, you will see a list of all accounts, groups, and built-in security principles
    for the local machine. Clicking one and then clicking OK will place the name in
    the Select User or Group window. You can then click OK to show the Effective Permissions
    window. Figure 3.6 shows the Effective Permissions window. This is an effective
    way to know the result of all the various levels of filters and'
