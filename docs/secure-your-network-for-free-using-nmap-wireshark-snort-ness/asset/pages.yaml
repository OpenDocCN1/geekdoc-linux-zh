    # Enabling SNMP on Linux Hosts


    If you want to collect data using SNMP from a Linux host, the first step is to
    see if the SNMP daemon (snmpd) is already installed. You can enter checkconfig
    --list snmpd, which will list the snmp daemon if it is installed, and which run
    levels it is configured to start in. If the daemon is not installed, it can be
    installed using whatever method is appropriate for your distribution. On Fedora
    Core 5, for example, it takes you install net-snmp. The daemons and some utilities
    are included in the net-snmp package, which includes utilities aimed at using
    SNMP, such as MIB browsers, but does not include the daemon.


    After you have snmpd installed, it needs to be configured. We will discuss two
    ways to configure snmpd. The current version of the daemon is very robust, which
    has the side effect of including a very complicated configuration file located
    at /etc/snmp/snmpd.conf. The simplest way to get SNMP up and running is to save
    the snmpd.conf file under a new name and create your own. The new snmpd.conf can
    contain only the single line community labcommunitystring. In this example, the
    read-only com'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# Chapter 7 • Network Reporting and Troubleshooting


    munity string would be set to labcommunitystring. Obviously, you should select
    a secure password of your own. This type of configuration file is quick and easy
    but not overly secure.


    You could also use the netfilter firewall and/or tcpwrappers to restrict SNMP
    access based on the IP address of the communicating system. Another option is
    to use the control built into the SNMP daemon. To configure the snmpd access,
    you will need to edit the snmpd.conf file. Granting access to the SNMP MIB requires
    four basic steps, which are all done in the configuration file. The example below
    includes a variety of configuration settings to hopefully provide a good idea
    of the possibilities. Add the following lines to the configuration file.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_437_0.png)


    ```

    ## sec.name source community

    ##

    com2sec localhost snmplocalstring

    com2sec internal 10.0.0.0/8 snmpcommunitystring

    com2sec admin_net 192.168.1.0/24 snmpadminstring

    ```


    These lines map a community name to a security name, thus the com2sec directive
    reference the access you are granting. The security name is just a name to use
    whatever name you like. The source is the hosts that will use that access profile.
    You can also use a source of default, which will mean any IP address. The community
    is the community string to be used for that access. Note that there is no differentiation
    between a read-only community string and a read-write community string. This is
    because the access that the security name will have will be defined later in the
    configuration file.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_437_1.png)


    ```

    ## Access.group.name sec.model sec.name

    ##

    group Full_Group v1 local

    group RO_Group v2c internal

    group Full_Group any admin_net

    ```


    The next section maps a security name into a group name using the group directive.
    In this case, we mapped both the local security name and the admin_net security
    name to the same group (Full_Group). The sec.model determines which version of
    SNMP (1 or 2) will be used/allowed. Using version 3 requires a different configuration
    altogether.


    ![](img/0eb7273a8d9e486628f6e18d37ab22c6_437_2.png)'
