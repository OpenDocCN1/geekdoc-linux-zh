  md: A final, very useful function you can get from cipher is the /w option. You
    can use the /w option to remove remnant data from “empty” portions of the hard
    disk. When you delete a file, only the pointer to the file in the file allocation
    table is really removed.The actual data from the file stays right where it was
    on the hard disk, until something else randomly comes along and needs that particular
    piece of disk real estate. The various programs designed to “undelete” files work
    by scanning the disk and finding the original data, and then rebuilding the file
    allocation table entry for it. The /w option of cipher will intentionally overwrite
    all unallocated disk space to ensure that files cannot be deleted.You can find
    additional information on the Encrypting File System at www.microsoft.com/technet/security/guidance/cryptographyetc/efs.mspx.
  merge: -1
