  md: '# Protecting Your Perimeter • Chapter 2


    6. When you are satisfied with all the settings, select DONE.


    7. You will be asked if you want to enable the SmoothWall firewall to serve as
    a DHCP server. This is the same configuration as home firewalls, acting as firewall,
    gateway, and DHCP server. If you do not already have a DHCP server in your network,
    enable it. Fill in the desired values for the various fields. Most of the settings
    are not critical, but one setting to take note of is the lease duration. If your
    lease duration is too long, you will slowly lose IP addresses from systems that
    did not get the chance to release the address property prior to going offline
    (such as a crash or power outage). If the lease time is too long, this IP address
    attrition can exhaust the DHCP scope and leave no address available for other
    users. A 24-hour lease is not uncommon, and generally the larger the network the
    shorter the duration you want. If you are unsure about DHCP, you can leave it
    disabled. The DHCP settings are easily configured from the Web interface.


