  md: '# Security as an Ongoing Process • Chapter 8 451


    the patch outweigh the risk posed by not implementing the patch. types of decisions
    will need to be made, or at least approved, by the appropriate business representatives.
    The person who makes such decision needs to have the appropriate authority for
    such a risk acceptance.


    Don''t forget that the testing procedures themselves will need to be regularly
    reviewed to ensure that the testing is still adequate. As software and features
    change, you will need to modify the testing procedures to accommodate the new
    functionality. While all of these considerations are applicable regardless of
    what you are patching, there are some considerations that are specific to the
    patch in question. Your individual business needs will dictate the specific procedures
