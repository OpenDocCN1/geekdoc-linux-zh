  \ `lvcreate` 是实际使用逻辑卷之前 LVM 三步骤中的最后一步。\n\n### 42. A\n`ss` 命令提供了许多 `netstat` 相同的功能，但可以显示一些扩展信息，例如给定套接字的内存分配。`free`\
