  \ `rsync` 无效。\n\n### 46. A\nMX 记录优先级最低的数字获胜，从而使 0 成为该域优先级最高的 MX 记录。\n\n### 47. D\n\
  DNS 通常使用 UDP 端口 53，区域传输除外，由于大多数区域请求的大小，区域传输使用 TCP 端口 53。\n\n### 48. D\n`axfr` 类型可以配合\
  \ `dig` 使用来请求区域传输。请求区域传输的客户端需要获得授权才能发起传输。\n\n### 49. D\n文件 `/etc/exports` 包含了使用\
