  \n11. A. `suid` 位允许程序以文件所有者的身份运行，无论是谁执行了该程序。出于安全考虑，通常不建议使用 SUID。其他权限允许文件所有者读取（`r`）和写入（`w`）。组和“其他”权限包含读取（`r`）和执行（`x`），但不写入。\n\
