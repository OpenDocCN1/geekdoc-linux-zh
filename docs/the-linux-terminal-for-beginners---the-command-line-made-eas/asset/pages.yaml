  md: '# THE `df` COMMAND (DISK FILESYSTEM)


    `df` command in Linux stands for "disk filesystem" and is used to display the
    amount of disk space available on the file systems of your computer. It provides
    information about the total space, used space, available space, and the percentage
    of used space on each mounted system.


    # Basic Syntax


    df [OPTION]... [FILE]...


    # Common Options


    +   -h` or `--human-readable`: Shows sizes in a human-readable format (e.g., 1K,
    234M, 2G).


    +   -a` or `--all`: Includes filesystems that have a size of 0 blocks.


    +   -T` or `--print-type`: Shows the type of filesystem.


    +   -i` or `--inodes`: Displays inode information instead of block usage.


    +   --total`: Produces a grand total at the end.


    +   --output`: Allows specifying the columns to be included in the output.


    # Basic Usage:


    ```

    df

    ```


    This command will display the basic disk space usage of all mounted systems.'
  merge: -1
