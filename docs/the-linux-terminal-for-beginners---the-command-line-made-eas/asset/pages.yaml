- img_proc: true
  md: '# THE `PING` COMMAND


    The `ping` command in Linux is used to test the reachability of a host on an Internet
    Protocol (IP) network. It also measures the round-trip time for messages sent
    from the originating host to a destination computer.


    # Explanation


    Purpose: To check if a particular host is reachable and how long it takes for
    the data packets to go to the destination and back.


    Mechanism: `ping` works by sending ICMP (Internet Control Protocol) Echo Request
    packets to the target host and waiting for an ICMP Echo Reply.


    # Basic Syntax


    ping [options] destination


    `destination`: This can be an IP address or a hostname (e.g., `google.com`).


    # Commonly Used Options


    +   -c count`: Send a specified number of packets and then stop.

    `-i interval`: Set the interval between sending each packet.

    `-s packetsize`: Specify the number of data bytes to be sent.

    `-t ttl`: Set the time to live for packets.'
  merge: -1
  pgno: 262
