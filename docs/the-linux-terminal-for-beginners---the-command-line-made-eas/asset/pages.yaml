    ```

    tar -xvjf my_archive.tar.bz2

    ```'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# LIST THE CONTENTS OF A TAR ARCHIVE:


    ```

    tar -tvf archive_name.tar

    ```


    - t: List the contents of an archive.


    Example:


    ```

    tar -tvf my_archive.tar

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# APPEND FILES TO AN EXISTING TAR ARCHIVE:


