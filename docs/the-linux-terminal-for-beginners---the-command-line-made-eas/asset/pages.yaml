  md: '# # THE `FREE` COMMAND


    The `free` command in Linux is used to display the amount of free and used memory
    in the system. This includes physical memory (RAM) as well as swap memory.


    # ## Syntax


    free [options]


    # ## Common Options


    +   -b, -k, -g,--tera,--peta,--exa: Display memory in bytes, megabytes, gigabytes,
    terabytes, petabytes, or exabytes, respectively.


    +   -h,--human: Show the output in a human-readable format (e.g., 1K, 234M, 2G).


    +   -t,--total: Display a line showing the column totals.


    +   -s N,--seconds N: Continuously display the memory status every N seconds.


    +   -c N,--count N: Display the output N times.


    +   -l,--lohi: Show detailed low and high memory statistics.


    +   -w,--wide: Show output in a wide format.


    # ## Basic Usage


    free


    This displays the memory usage in kilobytes by default.'
