  md: '# THE `FIND` COMMAND


    The `find` command in Linux is a powerful utility used for searching and locating
    files and directories based on various criteria such as name, type, permissions,
    modification date, and more. Here''s a summary of how the command works, along
    with examples.


    # Basic Syntax:


    find [path] [expression]


    # Common Options:


    +   - `-name pattern`: Search for files matching the pattern.

    - `-iname pattern`: Case-insensitive search for files matching the pattern.

    - `-type [fd]`: Search for files (`f`) or directories (`d`).

    - `-mtime n`: Search for files modified `n` days ago.

    - `-size [+-size`: Search for files based on size.

    - `-exec command {} \;`: Execute a command on each found item.

    - `-delete`: Delete files found by the search.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# FINDING FILES BY NAME:


    ```

    find /path/to/search -name "filename"

    ```'
  merge: -1
