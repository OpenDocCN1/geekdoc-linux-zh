- img_proc: true
  md: '# THE `GZIP` AND `GUNZIP` COMMANDS


    The `gzip` and `gunzip` commands in Linux are used to compress and decompress
    files, respectively. Here''s a detailed explanation along with examples and a
    summary.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# `GZIP` COMMAND


    The `gzip` command is used to compress files. It reduces the size of the named
    files using the Lempel-Ziv (LZ77) algorithm and replaces the original files with
    files that have a `.gz` extension.


    # Syntax


    gzip [options] [file...]


    # Common Options


    +   - `-c`: Write the compressed file to standard output and keep the original
    file unchanged.


    +   - `-d`: Decompress the compressed file (same as `gunzip`).


    +   - `-k`: Keep the original file.


    +   - `-r`: Recursively compress files in directories.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# COMPRESS A SINGLE FILE


    gzip filename.txt


    This will compress `filename.txt` to `filename.txt.gz`.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# COMPRESS MULTIPLE FILES


    gzip file1.txt file2.txt file3.txt


    Each file will be compressed into `file1.txt.gz`, `file2.txt.gz`, and `file3.txt.gz`
    respectively.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# KEEP THE ORIGINAL FILE


    ```

    gzip -k filename.txt

    ```


    This will compress `filename.txt` to `filename.txt.gz` but also keep the original
    `filename.txt`.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# COMPRESS AND OUTPUT TO

    STANDARD OUTPUT


    ```

    gzip -c filename.txt > compressed.gz

    ```


    This will compress `filename.txt` and write the compressed data to `compressed.gz`.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# RECURSIVELY COMPRESS A DIRECTORY


    ```

    gzip -r directory_name

    ```


    This will compress all files in the directory and its subdirectories.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# THE `GUNZIP` COMMAND


    The `gunzip` command is used to decompress files that were compressed using `gzip`.


    # Syntax


    gunzip [options] [file...]C


    # Common Options


    +   - -c: Write the decompressed file to standard output and keep the original
    file unchanged.


    +   - -k: Keep the compressed file.


    +   - -r: Recursively decompress files in directories.


    # Examples'
  merge: -1
