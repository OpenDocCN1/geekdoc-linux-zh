  md: '# ADDING A PPA (PERSONAL PACKAGE ARCHIVE)


    +   - PPAs are typically added using the `add-apt-repository` command, but you
    can add them manually as well.

    - deb http://ppa.launchpad.net/graphics-drivers/ppa/ubuntu focal main

    - URI: `http://ppa.launchpad.net/graphics-drivers/ppa/ubuntu`

    - Distribution: `focal`

    - Component: `main`'
  merge: -1
