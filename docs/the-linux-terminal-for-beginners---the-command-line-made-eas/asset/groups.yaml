    # THE `TOUCH` COMMAND


    The `touch` command is a basic command-line utility used in Unix and Unix-like
    operating systems, including Linux and macOS. It is primarily used to create empty
    files and update the timestamps of existing files. Here are some common usages
    and examples:'
  - '[PAGE 91]


    # CREATING AN EMPTY FILE


    touch filename


    Example:


    ```

    touch example.txt

    ```


    This command will create an empty file `example.txt` in the current directory.
    If `example.txt` already exists, its last modification and access timestamps will
    be updated to the current time.'
  - '[PAGE 92]


    # CREATING MULTIPLE FILES AT ONCE


    touch file1 file2 file3


    Example:


    ```

    touch file1.txt file2.txt file3.txt

    ```


    This command will create three empty files named `file1.txt`, `file2.txt`, and
    `file3.txt`.'
  - '[PAGE 93]


    # # UPDATING THE TIMESTAMP OF AN EXISTING FILE


    When you run `touch` on an existing file, it updates the file''s access and modification
    times to the current time.


    touch existingfile.txt


    Example:


    touch existingfile.txt


    This command will update the access and modification timestamps of `existingfile.txt`
    to the current time.'
  - '[PAGE 94]


    # SETTING A SPECIFIC TIMESTAMP


    You can use the `-t` option to set a specific timestamp for the file.


    ```

    touch -t [[CC]YY]MMDDhhmm[.ss] filename

    ```


    Example:


    ```

    touch -t 202401010000.00 example.txt

    ```


    This command will set the modification and access time of `example.txt` to midnight
    (00:00) on January 1, 2024.'
  - '[PAGE 95]


    # USING A REFERENCE FILE


    You can use the `-r` option to set the timestamp of one file to be the same as
    another file.


    touch -r reference file target file


    Example:


    ```

    touch -r oldfile.txt newfile.txt

    ```


    This command will set the modification and access times of `newfile.txt` to match
    those of `oldfile.txt`.'
  - '[PAGE 96]


    # CREATING A FILE WITH NO CLOBBER


    Using the `-c` option, `touch` will not create a file if it does not already exist.
    It will only update the timestamps if the file exists.


    touch -c filename


    Example:


    ```

    touch -c maybe_exists.txt

    ```


    If `maybe_exists.txt` exists, its timestamps will be updated. If it does not exist,
    no file will be created.'
