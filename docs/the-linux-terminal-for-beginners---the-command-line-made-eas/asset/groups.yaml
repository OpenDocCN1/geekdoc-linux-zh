    # 5. SYSTEM INFORMATION


    # THE `uname` COMMAND


    The `uname` command in Linux is used to display system information. It provides
    details about the system''s kernel and operating system.


    # Syntax


    uname [OPTION]...


    # Option


    - `-a` or `--all`: Print all system information.

    - `-s` or `--kernel-name`: Print the kernel name.

    - `-n` or `--nodename`: Print the network node hostname.

    - `-r` or `--kernel-release`: Print the kernel release.

    - `-v` or `--kernel-version`: Print the kernel version.

    - `-m` or `--machine`: Print the machine hardware name.

    - `-p` or `--processor`: Print the processor type or "unknown".

    - `-i` or `--hardware-platform`: Print the hardware platform or "unknown".

    - `-o` or `--operating-system`: Print the operating system.


    # DISPLAY KERNEL NAME:


    uname -s


    Output might be:


    Linux


    # DISPLAY NETWORK NODE HOSTNAME:


    uname -n


    Output might be:


    myhostname


    # DISPLAY KERNEL RELEASE:


    uname -r


    Output might be:


    5.11.0-37-generic


    # DISPLAY KERNEL VERSION:


    uname -v


    Output might be:


    ```

    41~20.04.2-Ubuntu SMP Fri Sep 24 09:06:38 UTC 2021

    ```


    # DISPLAY MACHINE HARDWARE NAME:


    uname -m


    Output might be:


    ```

    x86_64

    ```


    # DISPLAY PROCESSOR TYPE:


    uname -p


    Output might be:


    ```

    x86_64

    ```


    # DISPLAY HARDWARE PLATFORM:


    uname -i


    Output might be:


    ```

    x86_64

    ```


    # DISPLAY OPERATING SYSTEM:


    uname -o


    Output might be:


    GNU/Linux


    # DISPLAY ALL INFORMATION:


    uname -a


    Output might be:


    ```

    Linux myhostname 5.11.0-37-generic #41~20.04.2-Ubuntu SMP Fri Sep 24 09:06:38
    UTC 2021 x86_64 x86_64 x86_64 GNU/Linux

    ```


    # SUMMARY


    The `uname` command is a simple but powerful utility in Linux that provides essential
    system information. It''s particularly useful for obtaining details about the
    kernel and operating system, which can be helpful for troubleshooting, system
    monitoring, and configuration tasks. The `uname -a` command gives a comprehensive
    summary of all available information, making it a quick way to get a full snapshot
    of the system''s status.


    # THE `TOP` COMMAND


    The `top` command in Linux is a powerful tool for monitoring the system''s performance.
    It provides a dynamic, real-time view of the system''s tasks, showing the processes
    that are currently running and their resource usage.


    Purpose: Monitor system performance and resource usage in real-time.


    Key Features:


    - Displays information about CPU and memory usage.

    - Lists running processes and their resource consumption.

    - Allows user interaction to sort and filter the displayed information.


    # Basic Usage


    To start the `top` command, simply type:


    top


    This will bring up the default `top` interface. The display is divided into two
    main sections:


    1. System summary: Shows overall system performance metrics.

    2. Process list: Displays detailed information about each running process.


    # KEY SECTIONS AND FIELDS


    At the top of the screen, you''ll see several lines of system summary information:


    - uptime: The first line displays the current time, system uptime, number of logged-in
    users, and load average.

    - tasks: Shows the total number of tasks, number of running, sleeping, stopped,
    and zombie tasks.

    - CPU(s): Shows the percentage of CPU usage split into user, system, nice, idle,
    wait, hardware interrupt, software interrupt, and steal time.

    - Mem: Displays total memory, used memory, free memory, buffers, and cached memory.

    - Swap: Shows total swap memory, used swap, and free swap.


    # PROCESS LIST


    - Below the system summary, you''ll see a list of processes, each with several
    columns:


    - PID: Process ID.

    - USER: User that owns the process.

    - PR: Priority of the process.

    - NI: Nice value of the process.

    - VIRT: Virtual memory used by the process.

    - RES: Resident memory used by the process.

    - SHR: Shared memory used by the process.

    - S: Process status (e.g., S for sleeping, R for running).

    - %CPU: CPU usage percentage.

    - %MEM: Memory usage percentage.

    - TIME+: Total CPU time used by the process.

    - COMMAND: Command that initiated the process.


    # INTERACTIVE COMMANDS


    While `top` is running, you can use various keyboard commands to interact with
    it:


    - `h`: Display help.

    - `k`: Kill a process (you''ll be prompted for the PID).

    - `r`: Renice a process (change its priority).

    - `u`: Filter processes by a specific user.

    - `P`: Sort by CPU usage.

    - `M`: Sort by memory usage.

    - `N`: Sort by process ID.

    - `T`: Sort by time.

    - `q`: Quit `top`


    # BASIC USAGE:


    top


    This command will open the `top` interface, showing a real-time view of system
    performance and running processes.


    # SORT BY MEMORY USAGE:


    While `top` is running, press `M` to sort processes by memory usage.


    # FILTER BY USER:


    While `top` is running, press `u`, then type the username to filter the processes
    by that user.


    # KILL A PROCESS:


    Press `k`, then enter the PID of the process you want to kill.


    # RENICE A PROCESS:


    Press `r`, then enter the PID of the process you want to renice, followed by the
    new nice value.


    Here''s an example of what the `top` interface might look like:


    ```

    top - 15:22:10 up 1 day, 2:14, 3 users, load average: 0.00, 0.00, 0.00

    Tasks: 105 total, 1 running, 103 sleeping, 1 stopped, 0 zombie

    %Cpu(s): 0.3 us, 0.2 sy, 0.0 ni, 99.5 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st

    KiB Mem: 2048576 total, 610196 free, 1338380 used, 38874 buff, 61126 cached

    KiB Swap: 2047996 total, 204796 free, 0 used

    PID USER PR NI VIRT RES S %CPU %MEM TIME+ COMMAND

    1234 root 20 0 16272 1644 S 0.3 0.1 0:00.05 ssh

    5678 user 20 0 155672 2352 S 0.0 0.1 0:01.10 bash

    ```


    # SUMMARY


    The `top` command is an essential tool for system administrators and anyone who
    needs to monitor the performance and resource usage of a Linux system in real-time.
    Its interactive features allow for flexible monitoring and control of system processes.


    # THE `DU` (DISK USAGE) COMMAND


    The `du` (disk usage) command in Linux is used to estimate file space usage. It
    can display the size of files and directories in a variety of formats and is useful
    for understanding how disk space is being used.


    # Basic Usage


    The basic syntax of the du command is:


    du [OPTIONS] [FILE/DIRECTORY]


    # Commonly USED OPTIONS


    - `-a` or `--all`: ow sizes for all files, not just directories.

    - `-h` or `--human-readable`: Print sizes in human-readable format (e.g., 1K,
    234M, 2G).

    - `-s` or `--summarize`: Display only a total for each argument.

    - `-c` or `--total`: Produce a grand total.

    - `-dN` or `--max-depth=N`: Display total for a directory (or file, with `-a`)
    only if it is N or fewer levels below the command line argument.


    # BASIC USAGE:


    du


    This will display the disk usage of the current directory and all its subdirectories.


    # HUMAN-READABLE FORMAT:


    ```

    du -h

    ```


    This will display sizes in a human-readable format, making it easier to understand
    the size of each directory.


    # SUMMARIZE DISK USAGE OF A DIRECTORY:


    ```

    du -s /path/to/directory

    ```


    This will display the total disk usage of the specified directory.

