    # THE `GREP` COMMAND


    The `grep` command in Linux is a powerful tool used to search for specific patterns
    within files or output. The name "grep" stands for "Global Regular Expression
    Print," and it is commonly used for searching plain-text data sets for lines that
    match a regular expression.


    # Syntax


    ```

    grep [options] pattern [file...]

    ```


    # SIMPLE SEARCH:


    Search for the word "hello" in a file named `file.txt`.


    ```

    grep "hello" file.txt

    ```


    This command prints all lines in `file.txt` that contain the word "hello".


    # CASE-INSENSITIVE SEARCH:


    Search for "hello" in a case-insensitive manner.


    ```

    grep -i "hello" file.txt

    ```


    This will match "hello", "Hello", "HELLO", etc.


    # RECURSIVE SEARCH:


    Search for "hello" in all files within the current directory and its subdirectories.


    ```

    grep -r "hello" .

    ```


    # SEARCH FOR WHOLE WORDS:


    Search for the word "hello" as a whole word.


    ```

    grep -w "hello" file.txt

    ```


    This will not match "hello123" or "123hello".


    # DISPLAY LINE NUMBERS:


    Search for "hello" and display line numbers where matches are found.


    ```

    grep -n "hello" file.txt

    ```


    # COUNT MATCHES:


    Count the number of lines that contain the word "hello".


    ```

    grep -c "hello" file.txt

    ```


    # INVERT MATCH:


    Display lines that do not match the word "hello".


    ```

    grep -v "hello" file.txt

    ```


    # USING REGULAR EXPRESSIONS:


    Search for lines that match a regular expression. For example, lines that start
    with "hello".


    ```

    grep "^hello" file.txt

    ```


    # COMBINING OPTIONS:


    Combine multiple options. For example, search recursively, case-insensitive, and
    show line numbers.


    ```

    grep -rin "hello"

    ```


    # PIPING WITH OTHER COMMANDS:


    Use `grep` with other commands via piping. For example, search for "hello" in
    the output of `ls -l`.


    ```

    ls -l | grep "hello"

    ```


    # SUMMARY


    Purpose: `grep` is used to search for patterns within files.


    Basic Syntax: `grep [options] pattern [file...]`


    # Common Options:


    - `-i`: Case-insensitive search

    - `-r`: Recursive search

    - `-w`: Search for whole words

    - `-n`: Display line numbers

    - `-c`: Count matches

    - `-v`: Invert match


    Regular Expressions: Use `grep` to search with regular expressions for more complex
    pattern matching.


    Piping: Combine `grep` with other commands for powerful text processing.

    `grep` is a versatile and essential tool for text processing and data analysis
    in Linux. By mastering its options and capabilities, you can efficiently search
    and manipulate text files and command output.


    # 8. COMPRESSION


    # THE `TAR` COMMAND


    The `tar` command in Linux is used to create, maintain, modify, and extract files
    that are archived in the tar format. The name "tar" stands for "tape archive,"
    and it''s a widely used command for working with file archives and backups.


    # Syntax


    Here are some of the most common uses of the `tar` command along with their syntax:


    # CREATE A TAR ARCHIVE:


    tar -cvf archive_name.tar /path/to/directory_or_files


    - `-c`: Create a new archive.

    - `-v`: Verbely list files processed (optional, for seeing the files being archived).

    - `-f`: Specify the filename of the archive.


    Example:

    tar -cvf my_archive.tar /home/user/documents


    Extract a tar archive:

    tar -xvf archive_name.tar


    - `-x`: Extract files from an archive.


    Example:

    tar -xvf my_archive.tar


    # CREATE A COMPRESSED TAR ARCHIVE WITH GZIP:


    tar -cvzf archive_name.tar.gz /path/to/directory_or_files


    - `-z`: Filter the archive through gzip.


    Example:

    ```

    tar -cvzf my_archive.tar.gz /home/user/documents

    ```


    # EXTRACT A COMPRESSED TAR ARCHIVE WITH GZIP:


    tar -xvzf archive_name.tar.gz


    Example:

    ```

    tar -xvzf my_archive.tar.gz

    ```


    Create a compressed tar archive with bzip2:


    ```

    tar -cvjf archive_name.tar.bz2 /path/to/directory_or_files

    ```


    - `-j`: Filter the archive through bzip2.


    Example:

    ```

    tar -cvjf my_archive.tar.bz2 /home/user/documents

    ```


    # EXTRACT A COMPRESSED TAR ARCHIVE WITH BZIP2:


    tar -xvjf archive_name.tar.bz2


    Example:

    ```

    tar -xvjf my_archive.tar.bz2

    ```


    # LIST THE CONTENTS OF A TAR ARCHIVE:


    ```

    tar -tvf archive_name.tar

    ```


    - `-t`: List the contents of an archive.


    Example:

    ```

    tar -tvf my_archive.tar

    ```


    # APPEND FILES TO AN EXISTING TAR ARCHIVE:


    tar -rvf archive_name.tar /path/to/new_files


    - `-r`: Append files to the end of an archive.


    Example:

    ```

    tar -rvf my_archive.tar /home/user/newfile.txt

    ```


    # DELETE FILES FROM A TAR ARCHIVE:


    tar --delete -f archive_name.tar /path/to/file_to_remove


    Example:

    ```

    tar --delete -f my_archive.tar /home/user/oldfile.txt

    ```


    # SUMMARY


    Creating an archive: Use `tar -cvf` for plain tar archives or `tar -cvzf`/`tar
    -cvjf` for gzip/bzip2.


    Extracting an archive: Use `tar -xvf` for plain tar archives or `tar -xzvf`/`tar
    -xjvf` for gzip/bzip2.


    - Listing contents: Use `tar -tvf`.

    - Appending to archive: Use `tar -rvf`.

    - Deleting from archive: Use `tar --delete -f`.


    The `tar` command is a powerful and flexible tool for archiving and compressing
    files, making it an essential part of a Linux user''s toolkit for managing backups
    and archives.


    # THE `GZIP` AND `GUNZIP` COMMANDS


    The `gzip` and `gunzip` commands in Linux are used to compress and decompress
    files, respectively. Here''s a detailed explanation along with examples.


    # `GZIP` COMMAND


    The `gzip` command is used to compress files. It reduces the size of the named
    files using Lempel-Ziv (LZ77) algorithm and replaces the original files with files
    that have a `.gz` extension.


    # Syntax


    gzip [options] [file...]


    # Common Options:


    - `-c`: Write the compressed file to standard output and keep the original file
    unchanged.

    - `-d`: Decompress the compressed file (same as `gunzip`).

    - `-k`: Keep the original file.

    - `-r`: Recursively compress files in directories.


    # COMPRESS A SINGLE FILE


    gzip filename.txt


    This will compress `filename.txt` to `filename.txt.gz`.


    # COMPRESS MULTIPLE FILES


    gzip file1.txt file2.txt file3.txt


    Each file will be compressed into `file1.txt.gz`, `file2.txt.gz`, and `file3.txt.gz`
    respectively.


    # KEEP THE ORIGINAL FILE


    ```

    gzip -k filename.txt

    ```


    This will compress `filename.txt` to `filename.txt.gz` but also keep the original
    `filename.txt`.


    # COMPRESS AND OUTPUT TO STANDARD OUTPUT


    ```

    gzip -c filename.txt > compressed.gz

    ```


    This will compress `filename.txt` and write the compressed data to `compressed.gz`.


    # RECURSIVELY COMPRESS A DIRECTORY


    ```

    gzip -r directory_name

    ```


    This will compress all files in the directory and its subdirectories.


    # THE `GUNZIP` COMMAND


    The `gunzip` command is used to decompress files that were compressed using `gzip`.


    # Syntax


    gunzip [options] [file...]


    # Common Options:


    - `-c`: Write the decompressed file to standard output and keep the original file
    unchanged.

    - `-k`: Keep the compressed file.

    - `-r`: Recursively decompress files in directories.

