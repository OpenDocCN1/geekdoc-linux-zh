    # SYMBOLIC LINK


    A symbolic link, also known as a symlink or soft link, is a type of file in Linux
    that points to another file or directory. It''s a shortcut that provides an alternative
    path to access a file or directory.


    Here’s a bit more detail:'
  - '[PAGE 34]


    # CHARACTERISTICS OF SYMBOLIC

    LINKS


    Pointer to Another File/Directory: A symbolic link points to the location of another
    file or directory. It contains the path to the target file or directory.


    Non-Ownership of Data: Unlike a hard link, a symbolic link doesn’t contain the
    actual data of the target file. If the target file is deleted, the symlink becomes
    a dangling link, pointing to a non-existent file.


    Can Cross Filesystems: Symbolic links can point to files or directories across
    different filesystems.


    Permissions: The permissions of a symlink are not relevant to the target file’s
    permissions. The system follows the symlink and checks the permissions of the
    target file.'
  - '[PAGE 35]


    # CREATING A SYMBOLIC LINK


    You can create a symbolic link using the `ln` command with the `-s` option.

    The syntax is:


    ```

    ln -s [target] [link_name]

    ```


    `target``: The path to the file or directory you want to link to.

    `link_name`: The name of the symbolic link you are creating.


    Example:


    To create a symbolic link called `mylink` to a file `myfile.txt`:

    ln -s myfile.txt mylink

    Now, `mylink` acts as a shortcut to `myfile.txt`. You can open, read, and edit
    `myfile.txt` using `mylink`.'
- md: '

    # VIEWING SYMBOLIC LINKS


    You can identify symbolic links in a directory listing using the `ls -l` command.
    Symbolic links are usually indicated with an `l` at the beginning of the permission
    string, and the link will show what it points to:


    ```

    lrwxrwxrwx 1 user group 11 Mar 8 12:34 mylink -> myfile.txt

    ```


    # REMOVING SYMBOLIC LINKS


    To remove a symbolic link, you can use the `rm` command:

    ```bash

    rm mylink

    ```


    This will remove the symlink `mylink`, but it will not affect the target file
    `myfile.txt`.


    ### Use Cases


    - Shortcuts: Create easy-to-remember shortcuts for deeply nested directories.

    - Version Control: Point to different versions of a file or directory.

    - Resource Management: Manage multiple versions of a software library.


    In summary, symbolic links in Linux are a powerful feature for creating shortcuts
    and managing files and directories efficiently.


    So, open your terminal, and let''s dive into the world of Linux commands that
    every user should know. **Embrace the power, flexibility, and efficiency** that
    come with mastering the Linux CLI.


    # 2. BASIC COMMANDS


    # THE PWD COMMAND


    The `pwd` command in Unix-like operating systems, including Linux and macOS, stands
    for "print working directory." It is used to display the full pathname of the
    current working directory. Here are some examples to illustrate how `pwd` works:


    ### Basic Usage


    ### SIMPLE `pwd` COMMAND:


    - When you type `pwd` and press Enter, it will output the current directory you
    are in.


    ```bash

    $ pwd

    /home/user

    ```


    ### Examples of Different Scenarios


    ### AFTER CHANGING DIRECTORY:


    If you change the directory using `cd` and then use `pwd`, it will show the new
    directory path.


    ```bash

    $ cd /usr/local

    $ pwd

    /usr/local

    ```


    ### USING `PWD` IN A SCRIPT:


    You can use `pwd` within a shell script to get the current directory path.


    ```bash

    #!/bin/bash

    echo "The current directory is: $(pwd)"

    ```


    When you run this script, it will print the current directory.


    ### COMBINING `PWD` WITH OTHER COMMANDS:


    You can combine `pwd` with other commands using command substitution.

    For example, creating a file in the current directory with its full path.


    ```bash

    $ touch "$(pwd)/newfile.txt"

    ```


    ### ADVANCED USAGE


    ### USING OPTIONS (THOUGH RARE):


    The `pwd` command typically doesn''t have many options, but some versions may
    support options like `-L` and `-P` to handle symbolic links differently.


    ```bash

    $ cd /tmp

    $ ln -s /home/user symlink_to_home

    $ cd symlink_to_home

    $ pwd -L # Shows the logical path

    /tmp/symlink_to_home

    $ pwd -P # Shows the physical path

    /home/user

    ```


    - `-L` (logical): Prints the logical path, which includes symbolic links.

    - `-P` (physical): Prints the physical path by resolving symbolic links.


    ### Practical Applications


    ### SCRIPTING AND AUTOMATION:


    In scripting, knowing the current directory is often necessary to navigate or
    manipulate files and directories relative to the script''s location.


    ```bash

    #!/bin/bash

    SCRIPT_DIR=$(pwd)

    echo "The script is running from: $SCRIPT_DIR"

    ```


    ### DEBUGGING:


    When debugging scripts or commands, knowing your current directory can help diagnose
    path-related issues.


    ```bash

    echo "Current directory is: $(pwd)"

    ```


    ### SUMMARY


    The `pwd` command is a simple yet powerful tool to help you keep track of your
    location in the filesystem. It is especially useful in scripts and for debugging
    purposes, ensuring you know exactly where you are operating within the directory
    structure.


    # THE `LS` COMMAND - LISTS THE FILES AND DIRECTORIES


    in Unix-based operating systems (such as Linux and macOS) is used to list the
    contents of directories. Here are some common options and examples to help you
    understand its usage:


    ### Basic Usage


    ```bash

    ls

    ```


    This command lists the files and directories in the current directory.


    ### LISTING IN LONG FORMAT


    ```bash

    ls -l

    ```


    The `-l` option lists the contents in a long format, showing details like permissions,
    number of links, owner, group, size, and modification date.

    Example output:


    ```

    -rw-r--r-- 1 user group 4096 Jun 19 12:00 file1.txt

    drwxr-xr-x 2 user group 4096 Jun 19 12:00 directory1

    ```


    ### INCLUDING HIDDEN FILES


    ```bash

    ls -a

    ```


    The `-a` option lists all files, including hidden files (those starting with a
    dot `.`).


    ### COMBINING OPTIONS


    ```bash

    ls -la

    ```


    You can combine options to show a detailed list of all files, including hidden
    ones. Example output:


    ```

    drwxr-xr-x 5 user group 4096 Jun 19 12:00 .

    drwxr-xr-x 3 user group 4096 Jun 19 12:00 ..

    -rw-r--r-- 1 user group 4096 Jun 19 12:00 .hiddenfile

    -rw-r--r-- 1 user group 4096 Jun 19 12:00 file1.txt

    drwxr-xr-x 2 user group 4096 Jun 19 12:00 directory1

    ```


    ### LISTING WITH HUMAN-READABLE SIZES


    ```bash

    ls -lh

    ```


    The `-h` option makes file sizes human-readable, adding units like K, M, G for
    kilobytes, megabytes, and gigabytes, respectively.


    ### SORTING BY MODIFICATION TIME


    ```bash

    ls -lt

    ```


    The `-t` option sorts the files by modification time, with the most recent first.

    Example output:


    ```

    -rw-r--r-- 1 user group 4096 Jun 19 12:00 file1.txt

    drwxr-xr-x 2 user group 4096 Jun 19 12:00 directory1

    ```


    ### LISTING SUBDIRECTORIES RECURSIVELY


    ```bash

    ls -R

    ```


    The `-R` option lists all subdirectories recursively.


    ### LISTING BY SIZE


    ```bash

    ls -S

    ```


    The `-S` option sorts files by size, with the largest first.


    ### LISTING BY EXTENSION


    ```bash

    ls -X

    ```


    The `-X` option sorts files by file extension.


    ### SUMMARY OF COMMON OPTIONS


    - `-l`: Long format

    - `-a`: All files, including hidden

    - `-h`: Human-readable sizes

    - `-t`: Sort by modification time

    - `-R`: Recursive listing

    - `-S`: Sort by size

    - `-X`: Sort by extension


    These examples should help you get started with the `ls` command and understand
    how to manage files and directories efficiently.


    # THE CD CHANGE DIRECTORY


    The `cd` (change directory) command is used in command-line interfaces to change
    the current working directory. Here''s detailed explanation along with examples:


    ### Syntax


    ```bash

    cd [directory]

    ```


    ### CHANGE TO A SPECIFIC DIRECTORY:


    ```bash

    cd /path/to/directory

    ```


    Example:


    ```bash

    cd /home/user/Documents

    ```


    This command changes the directory to `/home/user/Documents`.


    ### CHANGE TO THE PARENT DIRECTORY:


    ```bash

    cd ..

    ```


    This moves up one level in the directory hierarchy. If you are in `/home/user/Documents`,
    running `cd ..` will take you to `/home/user`.


    ### CHANGE TO THE ROOT DIRECTORY:


    ```bash

    cd /

    ```


    This changes the current directory to the root directory of the filesystem.


    ### CHANGE TO THE HOME DIRECTORY:


    ```bash

    cd or cd ~

    ```


    This changes the current directory to the user''s home directory. If your username
    is `user`, it takes you to `/home/user`.


    ### CHANGE TO A DIRECTORY USING A RELATIVE PATH:


    ```bash

    cd relative/path

    ```


    Example:


    ```bash

    cd Projects/2024

    ```


    If you are currently in `~/home/user/Documents`, running `cd Projects/2024` will
    take you to `~/home/user/Documents/Projects/2024`.


    ### NAVIGATE THROUGH DIRECTORIES USING ABSOLUTE PATHS:


    ```bash

    cd /home/user/Documents/Projects

    ```


    This command directly changes the current directory to `/home/user/Documents/Projects`,
    regardless of the current location.


    ### USE ENVIRONMENT VARIABLES:


    ```bash

    cd $HOME/Documents

    ```


    Here, `$HOME` is an environment variable that typically points to the home directory
    of the current user. This command changes the directory to the `Documents` folder
    in the home directory.


    ### CHANGE TO THE PREVIOUS DIRECTORY:


    ```bash

    cd -

    ```


    This switches back to the last directory you were in. It’s useful if you need
    to toggle between two directories.

    '
