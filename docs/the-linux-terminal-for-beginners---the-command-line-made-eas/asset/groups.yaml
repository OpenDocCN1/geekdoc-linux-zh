    ```


    # `IP` 命令


    `ip` 命令是 `iproute2` 包的一部分，提供了比 `ifconfig` 更高级的功能。它现在是官方推荐的网络管理工具。


    **`ip` 的基本用法**


    ### 显示所有网络接口及其状态：


    ip addr show


    或者简单使用


    ip a


    ### 显示特定的网络接口：


    ```

    ip addr show dev eth0

    ```


    ###为接口分配 IP 地址：


    ```

    sudo ip addr add 192.168.1.100/24 dev eth0

    ```


    ### 激活网络接口：


    ```

    sudo ip link set eth0 up

    ```


    ### 禁用网络接口：


    ```

    sudo ip link set eth0 down

    ```


    ### 修改接口的 MAC 地址：


    ```

    sudo ip link set dev eth0 00:1A:2B:3C:4D:5E

    ```


    ### 显示路由表：


    ip route show


    或者简单使用


    ip r


    # 摘要


    `ifconfig`: 用于配置网络接口的传统工具。它简单直接但缺乏高级功能。


    示例：`ifconfig eth0 192.168.1.100`


    用途：快速、简单的配置任务。


    `ip`: 一个替代 `ifconfig` 的现代多功能工具。它支持更高级的网络管理任务。


    示例：`ip addr add 192.168.1.100/24 dev eth0`


    用途：全面的网络配置和管理。


    # 比较


    - 灵活性：`ip` 更灵活、更强大，支持高级路由、隧道和流量控制等更多功能。

    - 语法：`ip` 使用更一致且易于脚本编写的语法。

    - 未来性：`ip` 是当前和未来 Linux 网络管理推荐的现代工具。


    通过过渡到 `ip` 命令，用户可以利用更健壮、功能丰富的能力来管理网络配置。


    # `NETSTAT` 命令


    Linux 中的 `netstat` 命令是一个强大的网络实用程序，提供了网络连接、路由表、接口统计、伪装连接和多播组组成的信息。以下是其用法的详细说明、示例和总结：


    用途：显示各种网络相关信息，如网络连接、路由表、接口统计、伪装连接和多播组。


    语法：


    ```

    netstat [options]

    ```


    常用选项及示例


    ### 显示所有连接：


    ```

    netstat -a

    ```


    此命令显示所有活动连接和监听端口。


    ### 仅显示监听端口：


    ```

    netstat -l

    ```


    此命令仅列出监听套接字（包括 TCP 和 UDP）。


    ### 显示路由表：


    ```

    netstat -r

    ```


    这显示内核路由表，类似于 `route` 命令。


    ### 显示网络接口统计：


    ```

    netstat -i

    ```


    这提供了一张网络接口统计表。


    ### 显示扩展接口统计：


    ```

    netstat -ie

    ```


    这提供了关于网络接口的详细信息，包括 IP 地址。


    ### 显示 TCP 连接：


    ```

    netstat -t

    ```


    此命令仅列出 TCP 连接。


    ### 显示 UDP 连接：


    ```

    netstat -u

    ```


    此命令仅列出 UDP 连接。


    ### 显示数值地址：


    ```

    netstat -n

    ```


    这显示数字地址而不是解析主机名。


    此显示每个套接字所属的 PID 和程序名称。


    ### 持续显示：


    ```

    netstat -c

    ```


    这每秒连续刷新一次网络统计。


    # 示例


    ### 显示所有活动连接和监听端口：


    netstat -a


    输出：


    ```

    | Proto Recv-Q Send-Q Local Address Foreign Address State |

    | tcp 0 0 localhost:3306 *:* LISTEN |

    | tcp 0 0 localhost:6379 *:* LISTEN |

    | udp 0 0 localhost:123 *:* |

    | udp 0 0 192.168.1.10:123 ** |

    ```


    ### 仅显示监听端口：


    netstat -l


    输出：


    ```

    | Proto Recv-Q Send-Q Local Address Foreign Address State |

    | tcp 0 0 localhost:3306 *:* LISTEN |

    | tcp 0 0 localhost:6379 *:* LISTEN |

    | udp 0 0 localhost:123 *:* |

    | udp 0 0 192.168.1.10:123 ** |

    ```


    ### 显示路由表：


    netstat -r


    输出：


    内核路由表


    ```

    | Destination Gateway Genmask Flags Metric Iface |

    | 0.0.0.0 192.168.1.1 0.0.0.0 UG 100 eth0 |

    | 192.168.1.0 0 255.255.255.0 U 0 eth0 |

    ```


    ### 显示网络接口统计：


    netstat -i


    输出：


    接口统计表


    ```

    | Iface MTU RX-OK RX-ERR RX-DRP Colls Peer |

    | eth0 1500 0 0 0 0 0 0 0 |

    ```


    # 7. 搜索


    # `FIND` 命令


    Linux 中的 `find` 命令是一个强大的工具，用于根据各种标准（如名称、类型、权限、修改日期等）搜索和定位文件及目录。以下是该命令如何工作的总结以及示例。


    语法：


    find [path] [expression]


    常用选项：


    - `-name pattern`：按模式搜索。

    - `-iname pattern`：不区分大小写搜索模式。

    - `-type [fd]`：搜索文件 (f) 或目录 (d)。

    - `-mtime n`：搜索 n 天前修改的文件。

    - `-size [+-size]`：根据大小搜索文件。

    - `-exec command {} \;`：对找到的项目执行命令。

    - `-delete`：删除搜索结果。


    ### 按名称查找文件：


    ```

    find /path/to/search -name "filename"

    ```


    ### 在 `/home` 目录下查找所有名为 `test.txt` 的文件：


    find /home -name "test.txt"


    ### 不区分大小写的搜索：


    ```

    find /path/to/search -iname "filename"

    ```


    示例：在 `/home` 目录下查找名为 `test.txt` 或 `TEST.TXT` 的文件：


    ```

    find /home -iname "test.txt"

    ```


    ### 按名称查找目录：


    ```

    find /path/to/search -type d -name "directoryname"

    ```


    示例：查找所有名为 `backup` 的目录：


    ```

    find / -type d -name "backup"

    ```


    ### 按修改时间查找文件：


    ```

    find /path/to/search -mtime n

    ```


    示例：查找过去 7 天内修改过的文件：


    ```

    find /home -mtime -7

    ```


    ### 按大小查找文件：


    ```

    find /path/to/search -size [+-size]

    ```


    示例：查找所有大于 10 MB 的文件：


    ```

    find /home -size +10M

    ```


