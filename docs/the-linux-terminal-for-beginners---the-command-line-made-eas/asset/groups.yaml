    ## "DEB" 概述


    - 1. 定义：`deb` 关键字用于 APT 的 `sources.list` 文件中，用于定义 Debian 软件包仓库的位置。


    - 2. 用途：它告诉 APT 在何处查找和下载软件包及更新。


    - 3. 语法：在 `/etc/apt/sources.list` 或 `/etc/apt/sources.list.d/` 下的文件中，`deb` 行的典型语法为：


    ```

    deb [options] uri distribution [component1] [component2] [...]

    ```


    ## "DEB" 行的组件


    - options（可选）：APT 的额外选项。

    - uri：仓库的 URL。

    - distribution：发行版名称（例如 `buster`、`bullseye`、`focal`、`jammy`）。

    - components：仓库的分区（例如 `main`、`contrib`、`non-free`）。


    ## 使用示例


    让我们来看一些示例 `deb` 行在实践中是如何使用的。


    ## 标准 DEBIAN 仓库


    - deb http://deb.debian.org/debian buster main contrib non-free

    - URI: `http://deb.debian.org/debian`

    - Distribution: `buster` (Debian 10)

    - Components: `main`、`contrib`、`non-free`


    ## UBUNTU 仓库


    - deb http://archive.ubuntu.com/ubuntu focal main restricted

    - URI: `http://archive.ubuntu.com/ubuntu`

    - Distribution: `focal` (Ubuntu 20.04)

    - Components: `main`、`restricted`


    ## 添加 PPA（个人软件包存档）


    - PPA 通常使用 `add-apt-repository` 命令添加，但也可以手动添加。

    - deb http://ppa.launchpad.net/graphics-drivers/ppa/ubuntu focal main

    - URI: `http://ppa.launchpad.net/graphics-drivers/ppa/ubuntu`

    - Distribution: `focal`

    - Component: `main`


    ## 总结


    `deb` 行是 Debian 系系统中指定仓库的方式。它包含了仓库 URL、发行版代号和仓库组件。


    正确配置 `deb` 行允许 APT 从指定的仓库查找并安装软件。


    ## 实际步骤：


    找到 `sources.list` 文件：使用文本编辑器打开。

    - sudo nano /etc/apt/sources.list


    添加仓库：为你想要添加的仓库添加 `deb` 行。

    - deb http://archive.ubuntu.com/ubuntu focal restricted


    更新软件包列表：运行 `apt update` 刷新列表。

    - sudo apt update


    通过正确理解 `deb` 行，你可以有效管理软件源并保持系统拥有最新软件包的安全更新。


    ## YUM 命令


    `yum` 命令代表 Yellowdog Updater，是 RPM 系发行版的软件包管理工具，如 CentOS、Fedora 和 Red Hat Enterprise
    Linux (RHEL)。它允许用户在系统上安装、更新和删除软件包。


    以下是 `yum` 的概述和一些示例：


    用途：管理 RPM 系系统上的软件包（安装、更新、删除）。


    常见用法：


    - 安装新软件包。

    - 更新现有软件包到新版本。

    - 已安装的软件包。

    - 管理以获取软件包。

    - 查询软件包。


    ## 安装软件包


    - yum install package_name

    - 示例：yum install httpd

    - 该命令安装 Apache HTTP 服务器。


    ## 更新软件包


    - yum update package_name

    - 示例：yum update httpd

    - 该命令将 Apache HTTP 服务器更新到可用版本。


    ## 更新所有软件包


    - yum update

    - 更新系统上所有已安装的软件包到最新版本。


    ## 软件包


    - yum remove package_name

    - 示例：yum remove httpd

    - 从系统中删除 Apache HTTP 服务器。


    ## 列出已安装的软件包


    - yum list installed

    - 显示系统上已安装的所有软件包列表。


    ## 搜索软件包


    - yum search keyword

    - 示例：yum search httpd

    - 搜索与 "httpd" 的软件包。


    ## 获取软件包信息


    - yum info package_name

    - 示例：yum info httpd

    - 提供有关指定软件包的详细信息。


    ## 列出可用更新


    - yum check-update

    - 列出有更新的软件包。


    ## 清理缓存


    - yum clean all

    - 清理已启用仓库的所有缓存信息。其他选项如 `yum clean packages`、`yum clean headers` 等可以清理特定的缓存数据。


    ## 启用仓库


    yum --enable-repo=repo_name 命令


    ## 禁用仓库


    yum --disable-repo=repo_name 命令


    ## 更新所有软件包


    ```

    yum update

    ```


    ## 安装新软件包


    ```

    yum install vim

    ```


    ## 搜索软件包


    ```

    yum search nginx

    ```


    ## 获取软件包信息


    ```

    yum info nginx

    ```


    ## 不需要的软件包


    ```

    yum remove vim

    ```


    ## 总结


    `yum` 命令是管理 RPM 系发行版软件的重要工具。它简化了安装、更新和删除软件包以及管理仓库和系统更新的过程。理解基本的 `yum` 命令可以有效地维护和管理
    Linux 系统。


    ## PACMAN 命令


    `pacman` 命令是 Arch Linux 及其衍生版（如 Manjaro）的软件包管理器。用于在系统上安装、更新、删除和管理软件包。以下是其用法的概述和示例。


    ## 概述


    - 名称：`pacman`

    - 用途：Arch Linux 及其衍生版的软件包管理。

    - 自动处理依赖关系。

    - 语法简单。

    - 使用单个命令执行各种软件包操作。


    ## 更新软件包数据库：


    ```

    sudo pacman -Sy

    ```


    ## 更新软件包数据库并升级所有软件包：


    ```

    sudo pacman -Syu

    ```


    ## 强制刷新软件包数据库：


    ```

    sudo pacman -Syy

    ```


    ## 安装单个软件包：


    ```

    sudo pacman -S package_name

    ```


    ## 安装多个软件包：


    ```

    sudo pacman -S package1 package2 package3

    ```


    ## 软件包：


    ```

    sudo pacman -R package_name

    ```


    ## 软件包及其依赖项：


    ```

    sudo pacman -Rs package_name

    ```


    ## 软件包、其依赖项以及所有配置文件：


    ```

    sudo pacman -Rns package_name

    ```


    ## 在数据库中搜索软件包：


    ```

    pacman -Ss keyword

    ```


    ## 搜索已安装的软件包：


    ```

    pacman -Qs keyword

    ```


    ## 列出已安装的软件包：


    ```

    pacman -Q

    ```


    ## 获取已安装软件包的信息：


    ```

    pacman -Qi package_name

    ```


    ## 列出软件包安装的所有文件：


    ```

    pacman -Ql package_name

    ```


    ## 清理软件包缓存：


    ```

    sudo pacman -Sc

    ```


    ## 更彻底地清理缓存（删除所有缓存版本）：


    sudo pacman -Scc


    ## 示例


    ## 安装 VLC 媒体播放器


    ```

    sudo pacman -S vlc

    ```


    ## 删除 Firefox


    ```

    sudo pacman -R firefox

    ```


    ## 更新系统


    ```

    sudo pacman -Syu

    ```


    ## 搜索与“编辑器”相关的软件包


    ```

    pacman -Ss editor

    ```


    ## 获取“NANO”软件包的信息


    pacman -Qi nano


    ## 清理软件包缓存


    ```

    sudo pacman -Sc

    ```


    ## 总结


    - `S`：安装软件包。

    - `R`：删除软件包。

    - `Q`：查询软件包数据库。

    - `Syu`：同步软件包数据库并更新系统。

    - `Ss`：在远程仓库中搜索软件包。

    - `Sc`：清理软件包缓存。


    ## 结




    `pacman` 是一个强大且直接的软件包管理器，旨在处理 Arch Linux 中软件包管理的复杂性，同时为用户提供简单高效的界面。通过精通这些命令，你可以轻松地管理系统的软件。


    '
