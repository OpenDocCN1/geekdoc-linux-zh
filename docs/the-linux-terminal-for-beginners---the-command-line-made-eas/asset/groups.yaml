    # THE `IFCONFIG` AND `IP` COMMANDS


    # `IFCONFIG` COMMAND


    `ifconfig` (interface configuration) is a traditional network management tool
    used to configure and display network interface parameters. It''s now considered
    deprecated in favor of the `ip` command but is still widely used.


    **Basic Usage of `ifconfig`**


    ### DISPLAY ALL NETWORK INTERFACES AND THEIR CONFIGURATIONS:


    ifconfig


    ### DISPLAY A SPECIFIC NETWORK INTERFACE:


    ```

    ifconfig eth0

    ```


    ### ASSIGN AN IP ADDRESS TO AN INTERFACE:


    ```

    sudo ifconfig eth0 192.168.1.100

    ```


    ### ACTIVATE A NETWORK INTERFACE:


    ```

    sudo ifconfig eth0 up

    ```


    ### DEACTIVATE A NETWORK INTERFACE:


    ```

    sudo ifconfig eth0 down

    ```


    ### CHANGE THE MAC ADDRESS OF AN INTERFACE:


    ```

    sudo ifconfig eth0 hw ether 00:1A:2B:3C:4D:5E

    ```


    # `IP` COMMAND


    The `ip` command is part of the `iproute2` package and provides more advanced
    features than `ifconfig`. It is now the recommended tool for network management.


    **Basic Usage of `ip`**


    ### DISPLAY ALL NETWORK INTERFACES AND THEIR STATUSES:


    ip addr show


    or simply


    ip a


    ### DISPLAY A SPECIFIC NETWORK INTERFACE:


    ```

    ip addr show dev eth0

    ```


    ### ASSIGN AN IP ADDRESS TO AN INTERFACE:


    ```

    sudo ip addr add 192.168.1.100/24 dev eth0

    ```


    ### ACTIVATE A NETWORK INTERFACE:


    ```

    sudo ip link set eth0 up

    ```


    ### DEACTIVATE A NETWORK INTERFACE:


    ```

    sudo ip link set eth0 down

    ```


    ### CHANGE THE MAC ADDRESS OF AN INTERFACE:


    ```

    sudo ip link set dev eth0 00:1A:2B:3C:4D:5E

    ```


    ### DISPLAY THE ROUTING TABLE:


    ip route show


    or simply


    ip r


    # SUMMARY


    `ifconfig`: A traditional tool for configuring network interfaces. It''s straightforward
    but lacks advanced features.


    Example: `ifconfig eth0 192.168.1.100`


    Use: Quick and easy configuration tasks.


    `ip`: A modern and versatile tool that replaces `ifconfig`. It supports more advanced
    network management tasks.


    Example: `ip addr add 192.168.1.100/24 dev eth0`


    Use: Comprehensive network configuration and management.


    # COMPARISON


    - Flexibility: `ip` is more flexible and powerful, supporting more features like
    advanced routing, tunneling, and traffic control.

    - Syntax: `ip` uses a more consistent and script-friendly syntax.

    - Future-proof: `ip` is the modern tool recommended for current and future Linux
    network management.


    By transitioning to the `ip` command, users can leverage more robust and feature-rich
    capabilities for managing network configurations.


    # THE `NETSTAT` COMMAND


    The `netstat` command in Linux is a powerful network utility that provides information
    about network connections, routing tables, interface statistics, masquerade connections,
    and multicast memberships. Here''s a detailed explanation, examples, and a summary
    of its usage:


    Purpose: To display various network-related information such as network connections,
    routing tables, interface statistics, masquerade connections, and multicast memberships.


    Syntax:


    ```

    netstat [options]

    ```


    Common Options and Examples


    ### DISPLAY ALL CONNECTIONS:


    ```

    netstat -a

    ```


    This command shows all active connections and listening ports.


    ### DISPLAY ONLY LISTENING PORTS:


    ```

    netstat -l

    ```


    This lists only the listening sockets, both TCP and UDP.


    ### SHOW ROUTING TABLE:


    ```

    netstat -r

    ```


    This displays the kernel routing tables, similar to the `route` command.


    ### SHOW NETWORK INTERFACE STATISTICS:


    ```

    netstat -i

    ```


    This provides a table of network interface statistics.


    ### SHOW EXTENDED INTERFACE STATISTICS:


    ```

    netstat -ie

    ```


    This gives detailed information about network interfaces, including IP addresses.


    ### DISPLAY TCP CONNECTIONS:


    ```

    netstat -t

    ```


    This lists only TCP connections.


    ### DISPLAY UDP CONNECTIONS:


    ```

    netstat -u

    ```


    This lists only UDP connections.


    ### DISPLAY NUMERICAL ADDRESSES:


    ```

    netstat -n

    ```


    This shows numerical addresses instead of resolving hostnames.


    This displays the PID and the name of the program to which each socket belongs.


    ### CONTINUOUS DISPLAY:


    ```

    netstat -c

    ```


    This refreshes the network statistics continuously every second.


    # Examples


    ### SHOW ALL ACTIVE CONNECTIONS AND LISTENING PORTS:


    netstat -a


    Output:


    ```

    | Proto Recv-Q Send-Q Local Address Foreign Address State |

    | tcp 0 0 localhost:3306 *:* LISTEN |

    | tcp 0 0 localhost:6379 *:* LISTEN |

    | udp 0 0 localhost:123 *:* |

    | udp 0 0 192.168.1.10:123 ** |

    ```


    ### SHOW ONLY LISTENING PORTS:


    netstat -l


    Output:


    ```

    | Proto Recv-Q Send-Q Local Address Foreign Address State |

    | tcp 0 0 *:ssh ***: LISTEN |

    | tcp 0 0 localhost:mysql **: LISTEN |

    | udp 0 0 *:bootpc *:* |

    ```


    ### SHOW ROUTING TABLE:


    netstat -r


    Output:


    Kernel IP routing table


    ```

    | Destination Gateway Genmask Flags MSS Window irtt Iface |

    | 0.0.0.0 192.168.1.1 0.0.0.0 UG 0 0 eth0 |

    | 192.168.1.0 0.0.0.0 255.255.255.0 U 0 0 eth0 |

    ```


    ### SHOW NETWORK INTERFACE STATISTICS:


    netstat -i


    Output:


    Kernel Interface table


    ```

    | Iface MTU RX-OK RX-ERR RX-DRP RX-OVR TX-OK TX-ERR TX-DRP TX-OVR Flg |

    | eth0 1500 45012 0 0 0 3498 0 0 0  | |

    ```


    # 7. SEARCHING


    # THE `FIND` COMMAND


    The `find` command in Linux is a powerful utility used for searching and locating
    files and directories based on various criteria such as name, type, permissions,
    modification date, and more. Here''s a summary of how the command works, along
    with examples.


    Syntax:


    find [path] [expression]


    Common Options:


    - `-name pattern`: Search for files matching the pattern.

    - `-iname pattern`: Case-insensitive search for files matching the pattern.

    - `-type [fd]`: Search for files (`f`) or directories (`d`).

    - `-mtime n`: Search for files modified `n` days ago.

    - `-size [+-size]`: Search for files based on size.

    - `-exec command {} \;`: Execute a command on each found item.

    - `-delete`: Delete files found by the search.


    ### FINDING FILES BY NAME:


    ```

    find /path/to/search -name "filename"

    ```


    ### FIND ALL FILES NAMED `TEST.TXT` IN THE `/HOME` DIRECTORY:


    find /home -name "test.txt"


    ### CASE-INSENSITIVE SEARCH:


    find /path/to/search -iname "filename"


    Example: Find all files named `test.txt` or `TEST.TXT` in the `/home` directory:


    ```

    find /home -iname "test.txt"

    ```


    ### FINDING DIRECTORIES BY NAME:


    find /path/to/search -type d -name "directoryname"


    Example: Find all directories named `backup`:


    ```

    find / -type d -name "backup"

    ```


    ### FINDING FILES BY MODIFICATION TIME:


    find /path/to/search -mtime n


    Example: Find all files modified in the last 7 days:


    ```

    find /home -mtime -7

    ```


    ### FINDING FILES BY SIZE:


    find /path/to/search -size [+]-size


    Example: Find all files larger than 10 MB:


    ```

    find /home -size +10M

    ```

