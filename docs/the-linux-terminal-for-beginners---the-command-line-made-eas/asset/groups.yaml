    - `-t STAMP`: Use the specified time (in the format `[[CC]]YY]MMDhhmm[.ss]]


    These examples should give you a good understanding of how to use the `touch`
    command to create files and manipulate timestamps in Unix-like systems.'
- md: "\n# THE `CP` (COPY) COMMAND\n\nThe `cp` (copy) command is used in Unix and\
    \ Unix-like operating systems, such as Linux and macOS, to copy files and directories\
    \ from one location to another. Here are some common examples and options:\n\n\
    ## Basic Usage\n\n### COPYING A FILE:\n\n```\ncp source_file.txt destination_file.txt\n\
    ```\n\nThis command copies `source_file.txt` to `destination_file.txt`. If `destination_file.txt`\
    \ does not exist, it will be created. If it does exist, it will be overwritten.\n\
    \n### COPYING A FILE TO A DIRECTORY:\n\n```\ncp source_file.txt /path/to/destination_directory/\n\
    ```\n\nThis command copies `source_file.txt` into the specified directory. The\
    \ directory must already exist.\n\n## COMMON OPTIONS\n\nCopying multiple files\
    \ to a directory:\n\n```\ncp file1.txt file2.txt file3.txt /path/to/destination_directory/\n\
    ```\n\nThis command copies `file1.txt`, `file2.txt`, and `file3.txt` into the\
    \ specified directory.\n\n```\ncp -r /path/to/source_directory /path/to/destination_directory/\n\
    ```\n\nThe `-r` (or `--recursive`) option copies all files and subdirectories\
    \ from the source directory to the destination directory. The destination directory\
    \ will be created if it does not exist.\n\n### PRESERVING FILE ATTRIBUTES:\n\n\
    ```\ncp -p source_file.txt destination_file.txt\n```\n\nThe `-p` option preserves\
    \ the original file's attributes, such as timestamps, ownership, and permissions.\n\
    \n### INTERACTIVE MODE:\n\n```\ncp -i source_file.txt destination_file.txt\n```\n\
    \nThe `-i` (interactive) option prompts the user before overwriting an existing\
    \ file at the destination.\n\n### VERBOSE MODE:\n\n```\ncp -v source_file.txt\
    \ destination_file.txt\n```\n\nThe `-v` (verbose) option shows detailed output\
    \ of the copying process, listing files as they are copied.\n\n### UPDATING FILES:\n\
    \n```\ncp -u source_file.txt destination_file.txt\n```\n\nThe `-u` (update) option\
    \ only copies the file if the source file is newer than the destination file or\
    \ if the destination file does not exist.\n\n## COMBINING OPTIONS\n\nYou can combine\
    \ multiple options to customize the behavior of the `cp` command. For example:\n\
    \n```\ncp -r -v -p /path/to/source_directory /path/to/destination_directory/\n\
    ```\n\nThis command recursively copies the source directory to the destination,\
    \ preserving file attributes and providing verbose output.\n\n## Examples\n\n\
    ### COPY A SINGLE FILE TO ANOTHER FILE:\n\n```\ncp file1.txt file2.txt\n```\n\n\
    This copies `file1.txt` to `file2.txt`.\n\n### COPY A FILE TO A DIRECTORY:\n\n\
    ```\ncp file1.txt /home/user/documents/\n```\n\nThis copies `file1.txt` into the\
    \ `/home/user/documents/` directory.\n\n### COPY AN ENTIRE DIRECTORY TO ANOTHER\
    \ DIRECTORY:\n\n```\ncp -r /home/user/pictures /backup/\n```\n\nThis copies the\
    \ `pictures` directory and all its contents to the `backup/` directory.\n\n###\
    \ PRESERVE FILE ATTRIBUTES WHEN COPYING:\n\n```\ncp -p file1.txt /backup/file1.txt\n\
    ```\n\nThis copies `file1.txt` to `backup/` and preserves its original attributes.\n\
    \n### COPY FILES INTERACTIVELY:\n\n```\ncp -i file1.txt /home/user/documents/\n\
    ```\n\nThis will prompt you before overwriting any existing files in `/home/user/documents/`.\n\
    \n### VERBOSE COPYING OF A DIRECTORY:\n\n```\ncp -rv /home/user/music /backup/\n\
    ```\n\nThis recursively and verbely copies the `music` directory to `/backup/`.\n\
    \nThese examples should cover most common scenarios you'll encounter when using\
    \ the `cp` command.\n\n# THE `MV` COMMAND\n\nThe `mv` command in Unix/Linux is\
    \ used to move or rename files and directories.\n\nBasic syntax is:\n\n```\nmv\
    \ [options] source target\n```\n\n## MOVING FILES\n\n### MOVING A FILE TO ANOTHER\
    \ DIRECTORY\n\n```\nmv file1.txt /path/to/target/\n```\n\nThis moves `file1.txt`\
    \ from its current location to `/path/to/target/`.\n\n### MOVING MULTIPLE FILES\
    \ TO A DIRECTORY\n\n```\nmv file1.txt file2.txt /path/to/target/\n```\n\nThis\
    \ moves `file1.txt` and `file2.txt` to `/path/to/target/`.\n\n## RENAMING FILES\n\
    \n### RENAMING A FILE\n\n```\nmv oldname.txt newname.txt\n```\n\nThis renames\
    \ `oldname.txt` to `newname.txt`.\n\n## Moving Directories\n\n### MOVING A DIRECTORY\
    \ TO ANOTHER DIRECTORY\n\n```\nmv /path/to/source_directory /path/to/target_directory/\n\
    ```\n\nThis moves `source_directory` to `target_directory`.\n\n## Renaming Directories\n\
    \n### RENAMING A DIRECTORY\n\n```\nmv old_directory new_directory\n```\n\nThis\
    \ renames `old_directory` to `new_directory`.\n\n## Options\n\n### THE `-i` OPTION\
    \ (INTERACTIVE MODE)\n\n```\nmv -i file1.txt /path/to/target/\n```\n\nThis will\
    \ prompt you before overwriting a file in the target location.\n\n### THE `-v`\
    \ OPTION (VERBOSE MODE)\n\n```\nmv -v file1.txt /path/to/target/\n```\n\nThis\
    \ will show you what is being done (i.e., `file1.txt` -> `/path/to/target/`).\n\
    \n### THE `-n` OPTION (NO CLOBBER)\n\n```\nmv -n file1.txt /path/to/target/\n\
    ```\n\nThis will not overwrite an existing file at the target location.\n\n###\
    \ COMBINING OPTIONS\n\n```\nmv -iv file1.txt /path/to/target/\n```\n\nThis will\
    \ prompt you before overwriting and show what is being done.\n\n## PRACTICAL SCENARIOS\n\
    \n### MOVING ALL FILES OF A SPECIFIC TYPE\n\n```\nmv *.txt /path/to/target/\n\
    ```\n\nThis moves all `.txt` files in the current directory to `/path/to/target/`.\n\
    \n### USING WILDS FOR RENAMING\n\n```\nmv project1/file1.txt project2/\n```\n\n\
    This moves `file1.txt` from `project1` directory to `project2` directory.\n\n\
    ## SUMMARY\n\n- Moving a file: `mv file1.txt /target/directory/`\n- Renaming a\
    \ file: `mv oldname.txt newname.txt`\n- Moving a directory: `mv sourcedir /target/directory/`\n\
    - Renaming a directory: `mv olddir newdir`\n\nThe `mv` command is versatile and\
    \ useful for organizing files and directories.\n\n# THE RM COMMAND\n\nThe rm command\
    \ in Unix/Linux is used to remove files or directories. It's a powerful command\
    \ and should be used with caution because it deletes files and directories.\n\n\
    ## REMOVE A SINGLE FILE\n\n```\nrm filename\n```\n\nExample:\n```\nrm file.txt\n\
    ```\n\n## REMOVE MULTIPLE FILES\n\n```\nrm file1 file2 file3\n```\n\nExample:\n\
    ```\nrm file1.txt file2.txt file3.txt\n```\n\n## REMOVE FILES WITH A PATTERN\n\
    \n```\nrm *.extension\n```\n\nExample:\n```\nrm *.log\n```\n\n### FORCE REMOVAL\
    \ (-f)\n\n```\nrm -f filename\n```\n\nExample:\n```\nrm -f important.txt\n```\n\
    \n### INTERACTIVE REMOVAL (-i)\n\n```\nrm -i filename\n```\n\nExample:\n```\n\
    rm -i file.txt\n```\n\n### VERBOSE MODE (-v)\n\n```\nrm -v filename\n```\n\nExample:\n\
    ```\nrm -v file.txt\n```\n\n### REMOVE AN EMPTY DIRECTORY\n\n```\nrmdir directory\n\
    ```\n\nExample:\n```\nrmdir emptydir\n```\n\n### REMOVE A DIRECTORY AND ITS CONTENTS\
    \ RECURSIVELY (-r or -R)\n\n```\nrm -r directory\n```\n\nExample:\n```\nrm -r\
    \ somidir\n```\n\n### COMBINE FORCE AND RECURSIVE OPTIONS (-rf)\n\n```\nrm -rf\
    \ directory\n```\n\nExample:\n```\nrm -rf olddir\n```\n\n## IMPORTANT NOTES\n\n\
    - Be Cautious: `rm` permanently deletes files; they are not moved to a trash/recycle\
    \ bin.\n- Use `-i` for Safety: This option prompts for confirmation before each\
    \ deletion to prevent accidental data loss.\n\n## SUMMARY\n\n- rm filename: Deletes\
    \ a file.\n- rm -i filename: Deletes a file with a confirmation prompt.\n- rm\
    \ -v filename: Deletes a file and displays a message.\n- rm -f filename: Deletes\
    \ a file forcefully without prompts.\n- rm -r directory: Deletes a directory and\
    \ its contents recursively.\n- rm -rf directory: Forcefully deletes a directory\
    \ and its contents recursively.\n\nAlways double-check the files and directories\
    \ you are deleting, especially when using options like -r and -f, to avoid accidentally\
    \ losing important data.\n\n# 3. FILE PERMISSIONS\n\n# THE `CHOWN` COMMAND\n\n\
    The `chown` command in Unix and Unix-like operating systems is used to change\
    \ the ownership of files and directories.\n\nThe command allows you to specify\
    \ a new owner and optionally a new group for the files.\n\n## Basic Syntax\n\n\
    ```\nchown [OPTION] OWNER[:GROUP] FILE... \n```\n"
  mdcn: "\n\n# `CP` (COPY) 命令\n\n`cp`（复制）命令用于 Unix 和类 Unix 操作系统（如 Linux 和 macOS），将文件和目录从一个位置复制到另一个位置。以下是一些常见的示例和选项：\n\
    \n## 基础用法\n\n### 复制文件：\n\n```\ncp source_file.txt destination_file.txt\n```\n\n\
    此命令将 `source_file.txt` 复制到 `destination_file.txt`。如果 `destination_file.txt` 不存在，则将创建它。如果它已存在，则会被覆盖。\n\
    \n### 将文件复制到目录：\n\n```\ncp source_file.txt /path/to/destination_directory/\n```\n\
    \n此命令将 `source_file.txt` 复制到指定的目录。该目录必须已经存在。\n\n## 常用选项\n\n将多个文件复制到目录：\n\n```\n\
    cp file1.txt file2.txt file3.txt /path/to/destination_directory/\n```\n\n此命令将\
    \ `file1.txt`、`file2.txt` 和 `file3.txt` 复制到指定的目录。\n\n```\ncp -r /path/to/source_directory\
    \ /path/to/destination_directory/\n```\n\n`-r`（或 `--recursive`）选项会将源目录的所有文件和子目录复制到目标目录。如果目标目录不存在，则将创建它。\n\
    \n### 保留文件属性：\n\n```\ncp -p source_file.txt destination_file.txt\n```\n\n`-p`\
    \ 选项保留原始文件的属性，例如时间戳、所有权和权限。\n\n### 交互模式：\n\n```\ncp -i source_file.txt destination_file.txt\n\
    ```\n\n`-i`（interactive）选项在覆盖目标位置已存在的文件之前提示用户。\n\n### 详细模式：\n\n```\ncp -v source_file.txt\
    \ destination_file.txt\n```\n\n`-v`（verbose）选项会显示复制过程的详细输出，在复制文件时列出这些文件。\n\n###\
    \ 更新文件：\n\n```\ncp -u source_file.txt destination_file.txt\n```\n\n`-u`（update）选项仅在源文件比目标文件新或目标文件不存在时才复制该文件。\n\
    \n## 组合选项\n\n你可以组合多个选项来自定义 `cp` 命令的行为。例如：\n\n```\ncp -r -v -p /path/to/source_directory\
    \ /path/to/destination_directory/\n```\n\n此命令递归地复制源目录到目标目录，保留文件属性并提供详细输出。\n\n\
    ## 示例\n\n### 将单个文件复制到另一个文件：\n\n```\ncp file1.txt file2.txt\n```\n\n这会将 `file1.txt`\
    \ 复制到 `file2.txt`。\n\n### 将文件复制到目录：\n\n```\ncp file1.txt /home/user/documents/\n\
    ```\n\n这会将 `file1.txt` 复制到 `/home/user/documents/` 目录。\n\n### 将整个目录复制到另一个目录：\n\
    \n```\ncp -r /home/user/pictures /backup/\n```\n\n这会将 `pictures` 目录及其所有内容复制到 `backup/`\
    \ 目录。\n\n### 复制时保留文件属性：\n\n```\ncp -p file1.txt /backup/file1.txt\n```\n\n这会将\
    \ `file1.txt` 复制到 `backup/` 并保留其原始属性。\n\n### 交互式复制文件：\n\n```\ncp -i file1.txt\
    \ /home/user/documents/\n```\n\n这将在覆盖 `/home/user/documents/` 中的任何现有文件之前提示你。\n\
    \n### 目录的详细复制：\n\n```\ncp -rv /home/user/music /backup/\n```\n\n这会递归且详细地将 `music`\
    \ 目录复制到 `/backup/`。\n\n这些示例应该涵盖了你在使用 `cp` 命令时会遇到大多数常见场景。\n\n# `MV` 命令\n\nUnix/Linux\
    \ 中的 `mv` 命令用于移动或重命名文件和目录。\n\n基本语法为：\n\n```\nmv [options] source target\n```\n\
    \n## 移动文件\n\n### 将文件移动到另一个目录\n\n```\nmv file1.txt /path/to/target/\n```\n\n这将\
    \ `file1.txt` 从当前位置移动到 `/path/to/target/`。\n\n### 将多个文件移动到目录\n\n```\nmv file1.txt\
    \ file2.txt /path/to/target/\n```\n\n这这将 `file1.txt` 和 `file2.txt` 移动到 `/path/to/target/`。\n\
    \n## 重命名文件\n\n### 重命名文件\n\n```\nmv oldname.txt newname.txt\n```\n\n这将 `oldname.txt`\
    \ 重命名为 `newname.txt`。\n\n## 移动目录\n\n### 将目录移动到另一个目录\n\n```\nmv /path/to/source_directory\
    \ /path/to/target_directory/\n```\n\n这将 `source_directory` 移动到 `target_directory`。\n\
    \n## 重命名目录\n\n### 重命名目录\n\n```\nmv old_directory new_directory\n```\n\n这将 `old_directory`\
    \ 重命名为 `new_directory`。\n\n## 选项\n\n### `-i` 选项（交互模式）\n\n```\nmv -i file1.txt\
    \ /path/to/target/\n```\n\n这将在覆盖目标位置的文件之前提示你。\n\n### `-v` 选项（详细模式）\n\n```\nmv\
    \ -v file1.txt /path/to/target/\n```\n\n这会显示移动过程的详细输出。\n\n### `-n` 选项（不覆盖）\n\n\
    ```\nmv -n file1.txt /path/to/target/\n```\n\n这将在不覆盖现有文件。\n\n```\nmv -n file1.txt\
