    # 选项


    - -R：递归更改目录及其内容的所有权。

    - -h：更改符号链接本身的所有权，而不是它们指向的文件。

    - -reference=RFILE：使用 RFILE 的所有者和组，而不是指定 OWNER:GROUP 值。


    # 总结


    `chown` 命令是 Unix 类系统中更改文件和目录所有权及用户组的强大工具。其基本语法涉及为目标文件或目录指定新的所有者，以及可选的新组。该命令也可以递归应用于目录。关键选项包括用于递归更改的
    `-R` 和用于影响符号链接的 `-h`。理解如何有效使用 `chown` 对于多用户环境下的文件权限和所有权至关重要。


    # `CHMOD` 命令


    Unix 和类 Unix 操作系统（如 Linux）中的 `chmod` 命令用于更改文件和目录的模式位。该命令可以修改文件和目录的读、写、执行权限。


    # 理解权限


    # 在类 Unix 系统中，每个文件和目录都有三种权限：


    - 1. 读取 (r)：读取文件或列出目录内容的权限。

    - 2. 写入 (w)：修改文件或目录的权限。

    - 3. 执行 (x)：执行文件或访问目录的权限。


    # 这些权限针对三类用户定义：


    - 1. 用户 (u)：文件的所有者。

    - 2. 组 (g)：属于文件用户组的其他用户。

    - 3. 其他 (o)：所有其他用户。


    # 数字（八进制）表示


    权限可以使用三个数字用数值表示，其中每个数字都是代表读取 (4)、写入 (2) 和执行 (1) 权限的值之和：


    ```

    `r = 4`

    ```


    ```

    `w = 2`

    ```


    ```

    `x = 1`

    ```


    # 例如：


    `7` (读 + 写 + 执行)：`4 + 2 + 1`


    `6` (读 + 写)：`4 + 2`


    `5` (读 + 执行)：`4 + 1`


    `4` (只读)：`4`


    `3` (写 + 执行)：`2 + 1`


