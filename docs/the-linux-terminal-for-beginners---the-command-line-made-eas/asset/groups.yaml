- md: "\n## INCLUDE ALL FILES:\n\n```\ndu -ah\n```\n\nThis will show the disk usage\
    \ of all files and directories in a human-readable format.\n\n## LIMIT DEPTH:\n\
    \n```\ndu -h --max-depth=1\n```\n\nThis will display the disk usage of directories\
    \ up to one level deep from the current directory.\n\n## TOTAL DISK USAGE:\n\n\
    ```\ndu -ch /path/to/directory\n```\n\nThis will display the disk usage of each\
    \ directory and file, and include a grand total at the end.\n\n## SUMMARY\n\n\
    The `du` command is a powerful tool for analyzing disk usage on Linux systems.\
    \ It provides detailed information on how disk space is being used by files and\
    \ directories, allowing users to identify large files and directories that may\
    \ be consuming excessive space. By using various options, users can customize\
    \ the output to show disk usage in human-readable formats, include individual\
    \ files, summarize totals, and limit the depth of directory traversal.\n\n## THE\
    \ `df` COMMAND (DISK FILESYSTEM)\n\n`df` command in Linux stands for \"disk filesystem\"\
    \ and is used to display the amount of disk space available on the file systems\
    \ of your computer. It provides information about the total space, used space,\
    \ available space, and the percentage of used space on each mounted system.\n\n\
    ### Basic Syntax\n\ndf [OPTION]... [FILE]...\n\n### Common Options\n\n- `-h` or\
    \ `--human-readable`: Shows sizes in a human-readable format (e.g., 1K, 234M,\
    \ 2G).\n- `-a` or `--all`: Includes filesystems that have a size of 0 blocks.\n\
    - `-T` or `--print-type`: Shows the type of filesystem.\n- `-i` or `--inodes`:\
    \ Displays inode information instead of block usage.\n- `--total`: Produces a\
    \ grand total at the end.\n- `--output`: Allows specifying the columns to be included\
    \ in the output.\n\n### Basic Usage:\n\n```\ndf\n```\n\nThis command will display\
    \ the basic disk space usage of all mounted systems.\n\n## HUMAN-READABLE FORMAT:\n\
    \n```\ndf -h\n```\n\nOutput:\n\n```\nFilesystem Size Used Avail Use% Mounted on\n\
    /dev/sda1 50G 20G 30G 40% /\ntmpfs 3.9G 2.1M 3.9G 1% /run\n/dev/sda2 100G 60G\
    \ 40G 60% /home\n```\n\nThe `h` option makes the output easier to read by converting\
    \ bytes into KB, MB, GB, etc.\n\n## INCLUDING ALL FILESYSTEMS:\n\n```\ndf -a\n\
    ```\n\nThis includes all filesystems, even those with 0 blocks.\n\n## SHOWING\
    \ FILESYSTEM TYPES:\n\n```\ndf -T\n```\n\nOutput:\n\n| Filesystem | Type | 1K-blocks\
    \ | Used | Available | Use% | Mounted on |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| /dev/sda1 | ext4 | 52403200 | 20971520 | 31431680 | 40% |\
    \ / |\n| tmpfs | tmpfs | 4096000 | 2048 | 4093952 | 1% | /run |\n| /dev/sda2 |\
    \ ext4 | 104857600 | 629144560 | 41943040 | 60% | /home |\n\n## INODES INFORMATION:\n\
    \n```\ndf -i\n```\n\nOutput:\n\n| Filesystem | Inodes | IUUsed | IFree | IUUse\
    \ | Mounted on |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| /dev/sda1 | 3276800\
    \ | 20480 | 3256320 | 1% | / |\n| tmpfs | 524288 | 10 | 524278 | 1% | /run |\n\
    | /dev/sda2 | 6553600 | 102400 | 6451200 | 2% | /home |\n\nThis shows inode usage\
    \ instead of block usage.\n\n## GRAND TOTAL:\n\n```\ndf --total\n```\n\nOutput:\n\
    \n```\nFilesystem 1K-blocks Used Available Use% Mounted on\n/dev/sda1 52403200\
    \ 20971520 31431680 40% /\ntmpfs 4096000 2048 4093952 1% /run\n/dev/sda2 104857600\
    \ 62914560 41943040 60% /home\ntotal 161920800 83888128 78032672 52%\n```\n\n\
    ## SPECIFYING COLUMNS:\n\n```\ndf --output=source,fstype,size,used,avail,percent,target\n\
    ```\n\nOutput:\n\n```\nFilesystem Type Size Avail Use% Mounted on\n/dev/sda1 ext4\
    \ 50G 20G 30G 40% /\ntmpfs tmpfs 3.9G 2.1M 3.9G 1% /run\n/dev/sda2 ext4 100G 60G\
    \ 40G 60% /home\n```\n\n## SUMMARY\n\nThe `df` command is a useful tool for monitoring\
    \ disk space usage on your system. It provides various options to display the\
    \ information in different formats, such as human-readable sizes, inode usage,\
    \ filesystem types, and more. By using the appropriate options, you can get a\
    \ comprehensive view of your disk usage, making it easier to manage your file\
    \ systems effectively.\n\n## THE `FREE` COMMAND\n\nThe `free` command in Linux\
    \ is used to display the amount of free and used memory in the system. This includes\
    \ physical memory (RAM) as well as swap memory.\n\n### Syntax\n\nfree [options]\n\
    \n### Common Options\n\n- `-b, -k, -g, --tera, --peta, --exa`: Display memory\
    \ in bytes, megabytes, gigabytes, terabytes, petabytes, or exabytes, respectively.\n\
    - `-h, --human`: Show the output in a human-readable format (e.g., 1K, 234M, 2G).\n\
    - `-t, --total`: Display a line showing the column totals.\n- `-s N, --seconds\
    \ N`: Continuously display the memory status every N seconds.\n- `-c N, --count\
    \ N`: Display the output N times.\n- `-l, --high`: Show detailed low and high\
    \ memory statistics.\n- `-w, --wide`: Show output in a wide format.\n\n### Basic\
    \ Usage\n\n```\nfree\n```\n\nThis displays the memory usage in kilobytes by default.\
    \ This shows the memory usage in a human-readable format, which is easier to interpret.\n\
    \n## DISPLAY IN MEGABYTES\n\n```\nfree -m\n```\n\nThis shows the memory usage\
    \ in megabytes.\n\n## DISPLAY CONTINUOUSLY\n\n```\nfree -s 5\n```\n\nThis updates\
    \ the memory usage every 5 seconds.\n\n## SHOW TOTAL\n\n```\nfree -t\n```\n\n\
    This adds a line showing the total memory (physical + swap).\n\n## LIMITED COUNT\n\
    \n```\nfree -c 3\n```\n\nThis will display the memory usage three times and then\
    \ exit.\n\n### Example Output\n\n```\ntotal used free shared buff/cache available\n\
    Mem: 16393036 3271988 11234568 50996 18400\n```\n\n## SUMMARY\n\nThe `free` command\
    \ is essential for monitoring memory resources. It provides a snapshot of how\
    \ much RAM and swap space is currently utilized or available.\n\n## ADDITIONAL\
    \ INFORMATION\n\nThe `ping` command is used to test the reachability of a host\
    \ on an IP network and measures the round-trip time for messages sent from the\
    \ host and back.\n\n## THE `PING` COMMAND\n\nThe `ping` command in Linux is used\
    \ to test the reachability of a host on an IP network and measures the round-trip\
    \ time for messages sent from the host and back.\n\n### Explanation\n\n`ping`\
    \ works by sending ICMP Echo Requests to the target host and measuring how long\
    \ it takes for a reply.\n\n### Basic Syntax\n\nping [options] host\n\n### Commonly\
    \ Used Options\n\n- `-c count`: Send a specified number of packets.\n- `-i interval`:\
    \ Set the interval between sending packets.\n- `-s size`: Specify the number of\
    \ bytes to send.\n `- `-t ttl`: Set the time-to-live value.\n\n## PING A HOST\n\
    \n```\nping google.com\n```\n\nThis will send ICMP Echo Requests until you stop\
    \ it (usually with Ctrl+C).\n\n## PING WITH A SPECIFIC COUNT\n\n```\nping -c 4\
    \ google.com\n```\n\nThis will send exactly 4 packets and stop.\n\n## PING WITH\
    \ A SPECIFIC INTERVAL\n\n```\nping -i 2 google.com\n```\n\nThis will send a packet\
    \ every 2 seconds.\n\n## PING WITH A SPECIFIC PACKET SIZE\n\n```\nping -s 100\
    \ google.com\n```\n\nThis will send packets with 100 bytes of data.\n\n## PING\
    \ WITH A TIME-TO-LIVE (TTL) VALUE\n\n```\nping -t 64 google.com\n```\n\nThis sets\
    \ the TTL value of the packet to 64.\n\n### Example Output\n\n```\nPING google.com\
    \ (172.250.190.46) 56(84) bytes of data.\n64 bytes from 172.250.190.46: icmp_seq=1\
    \ ttl=117 time=15.8 ms\n64 bytes from 172.250.190.46: icmp_seq=2 ttl=117 time=15.9\
    \ ms\n64 bytes from 172.250.190.46: icmp_seq=3 ttl=117 time=16.0 ms\n64 bytes\
