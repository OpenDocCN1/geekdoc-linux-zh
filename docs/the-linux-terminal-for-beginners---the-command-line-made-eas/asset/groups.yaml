- md: '

    # OWNER: THE NEW OWNER OF THE FILE.


    GROUP: (Optional) The new group of the file. If not specified, the group is unchanged.


    FILE: The file(s) or directory(ies) whose ownership is to be changed.


    # CHANGE THE OWNER OF A FILE:


    ```

    chown alice file.txt

    ```


    This command changes the owner of `file.txt` to `alice`.


    # CHANGE THE OWNER AND GROUP OF A FILE:


    ```

    chown alice:developers file.txt

    ```


    This changes the owner of `file.txt` to `alice` and the group to `developers`.


    # CHANGE THE OWNER OF MULTIPLE FILES:


    ```

    chown alice file1.txt file2.txt

    ```


    This changes the owner of `file1.txt` and `file2.txt` to `alice`.


    # CHANGE THE OWNER OF A DIRECTORY AND ITS CONTENTS RECURSIVELY:


    ```

    chown -R alice:developers /home/alice

    ```


    This changes the owner and group of `/home/alice` and all files and directories
    inside it to `alice` and `developers`, respectively.


    # CHANGE ONLY THE GROUP OF A FILE:


    ```

    chown :developers file.txt

    ```


    This changes the group of `file.txt` to `developers` while leaving the owner unchanged.


    # OPTIONS


    - -R: Recursively change ownership of directories and their contents.

    - -h: Change the ownership of symbolic links themselves rather than the files
    they point to.

    - -reference=RFILE: Use RFILE''s owner and group rather than specifying OWNER:GROUP
    values.


    # SUMMARY


    The `chown` command is a powerful tool for changing the ownership and group of
    files and directories in Unix-like systems. The basic syntax involves specifying
    a new owner and optionally a new group for the target files or directories. The
    command can also be applied recursively to directories. Key options include `-R`
    for recursive changes and `-h` for affecting symbolic links. Understanding how
    to use `chown` effectively is essential for managing file permissions and ownership
    in a multi-user environment.


    # THE `CHMOD` COMMAND


    The `chmod` command in Unix and Unix-like operating systems (such as Linux) is
    used to change the file mode bits of files and directories. This command modifies
    the read, write, and execute permissions of files and directories.


    # UNDERSTANDING PERMISSIONS


    # IN UNIX-LIKE SYSTEMS, EACH FILE AND DIRECTORY HAS THREE TYPES OF PERMISSIONS:


    - 1. Read (r): Permission to read the file or list the directory''s contents.

    - 2. Write (w): Permission to modify the file or directory.

    - 3. Execute (x): Permission to execute the file or access the directory.


    # THESE PERMISSIONS ARE DEFINED FOR THREE CATEGORIES OF USERS:


    - 1. User (u): The owner of the file.

    - 2. Group (g): Other users who are in the file''s group.

    - 3. Others (o): All other users.


    # NUMERIC (OCTAL) REPRESENTATION


    Permissions can be represented numerically using three digits, where each digit
    is a sum of the values representing read (4), write (2), and execute (1) permissions:


    ```

    `r = 4`

    ```


    ```

    `w = 2`

    ```


    ```

    `x = 1`

    ```


    # For example:


    `7` (read + write + execute): `4 + 2 + 1`


    `6` (read + write): `4 + 2`


    `5` (read + execute): `4 + 1`


    `4` (read only): `4`


    `3` (write + execute): `2 + 1`


    `2` (write only): `2`


    `1` (execute only): `1`


    `0` (no permissions): `0`


    # SYMBOLIC REPRESENTATION


    # PERMISSIONS CAN ALSO BE REPRESENTED SYMBOLICALLY WITH:


    - `u` for user

    - `g` for group

    - `o` for others

    - `a` for all (user, group, and others)


    And using:


    - `+` to add permissions

    - `-` to remove permissions

    - `=` to set exact permissions


    # NUMERIC METHOD


    # EXAMPLE 1:


    Granting read, write, and execute permissions to the user, and read and execute
    permissions to the group and others.


    ```

    chmod 755 filename

    ```


    This sets:


    - User: read (4) + write (2) + execute (1) = 7

    - Group: read (4) + execute (1) = 5

    - Others: read (4) + execute (1) = 5


    # EXAMPLE 2:


    Granting read and write permissions to the user, and read-only permissions to
    the group and others.


    ```

    chmod 644 filename

    ```


    This sets:


    - User: read (4) + write (2) = 6

    - Group: read (4) = 4

    - Others: read (4) = 4


    # SYMBOLIC METHOD


    Example 3: Adding execute permission to the user.


    - `chmod u+x filename`

    - This sets execute permission for the user while leaving other permissions unchanged.


    Example 4: Removing write permission for others.


    - `chmod o-w filename`

    - This removes the written permission for others.


    Example 5: Setting read and write permissions for the user and group, and removing
    all permissions for others.


    - `chmod ug=rw,o= filename`

    - This sets:


    - User: read (r) + write (w)

    - Group: read (r) + write (w)

    - Others: no permissions


    # SUMMARY


    The `chmod` command is used to change the permissions of files and directories.
    Permissions can be modified numerically (e.g., `755`) or symbolically (e.g., `u+x`).
    The permissions control read, write, and execute access for the user (owner),
    group, and others. Using `chmod` effectively allows for proper management of file
    and directory access rights in Unix-like systems.


    # 4. VIEWING


    # THE LESS COMMAND


    The `less` command is a powerful utility for viewing (but not editing) files one
    screen at a time. It''s commonly used on Unix-like systems, such as Linux.


    # Basic Syntax


    ```

    less [options] [file]

    ```


    # OPENING A FILE:


    ```

    less /var/log/syslog

    ```

    This opens the system log file for viewing.


    # NAVIGATING WITHIN LESS:


    Moving Forward:


    - `Space` to move down one screen.

    - `Enter` to move down one line.

    - `d` to move forward half screen.

    - `G` to go to the end of the file.


    Moving Backward:


    - `b` to move up one screen.

    - `Up Arrow` to move up one line.

    - `u` to move backward half screen.

    - `g` to go to the beginning of the file.


    # SEARCHING WITHIN LESS:


    Forward Search:


    - `/pattern` to search forward for the pattern.

    - `n` to repeat the search forward.


    Backward Search:


    - `?pattern` to search backward for the pattern.

    - `N` to repeat the search backward.


    # OTHER USEFUL COMMANDS:


    - `q`: quit less

    - `h`: display help within less

    - `F`: follow the end of the file (like `tail -f`).


    # FOLLOWING A FILE IN REAL-TIME:


    ```

    less +F /var/log/syslog

    ```

    This command follows the end of the file, showing new lines as they are added.


    # OPENING MULTIPLE FILES:


    ```

    less file1.txt file2.txt

    ```

    Use `:n` to go to the next file and `::p` to go to the previous file.


    # SUMMARY


    The `less` command is a versatile and powerful tool for viewing the contents of
    text files in a Unix-like environment. It provides extensive navigation and search
    capabilities, allowing users to move through large files without loading them
    entirely into memory. Key features include the ability to move forward and backward
    through the file, search for patterns, and even follow real-time updates to files.


    # THE MORE COMMAND


    The `more` command in the Linux terminal is used for viewing the content of text
    files one screen at a time. It''s especially useful for reading long files where
    the content doesn''t fit on a single screen.


    The basic syntax:


    ```

    more [options] [file_name]

    ```

