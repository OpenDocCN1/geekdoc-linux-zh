- md: "\n## COMBINING COMMANDS\n\n- Change directory and list contents:\n\n```\ncd\
    \ /path/to/directory && ls\n```\n\nExample:\n\n```\ncd /home/user/Documents &&\
    \ ls\n```\n\nThis changes the current directory to `home/user/Documents` and then\
    \ lists its contents.\n\n## SUMMARY\n\nThe `cd` command is essential for navigating\
    \ the filesystem in command-line interfaces. Understanding how to use it efficiently\
    \ can greatly enhance productivity and ease of file management. Here’s a quick\
    \ recap of the common uses:\n\n- `cd /path/to/directory` – change to a specified\
    \ directory.\n- `cd ..` – move up one level.\n- `cd /` – change to the root directory.\n\
    - `cd` or `cd ~` – go to the home directory.\n- `cd relative/path` – navigate\
    \ using a relative path.\n- `cd -` – switch to the previous directory.\n\n## THE\
    \ `MKDIR` COMMAND\n\nThe `mkdir` command in Unix-like operating systems (such\
    \ as Linux and macOS) is used to create directories (also known as folders). Here’s\
    \ a breakdown of its usage with examples:\n\n### Basic Syntax\n\n```\nmkdir [options]\
    \ directory_name\n```\n\n### Basic Usage\n\n### TO CREATE A SINGLE DIRECTORY:\n\
    \n```\nmkdir my_directory\n```\n\nThis command creates a directory named `my_directory`\
    \ in the current working directory.\n\n## CREATING MULTIPLE DIRECTORIES\n\nYou\
    \ can create multiple directories at once by specifying them one after the other:\n\
    \n```\nmkdir dir1 dir2 dir3\n```\n\nThis command creates three directories named\
    \ `dir1`, `dir2`, and `dir3` in the current working directory.\n\n## CREATING\
    \ NESTED DIRECTORIES\n\nIf you need to create nested directories (directories\
    \ within directories) in one command, use the `-p` option:\n\n```\nmkdir -p parent_dir/child_dir/grandchild_dir\n\
    ```\n\nThis command creates `parent_dir`, `parent_dir/child_dir`, and `parent_dir/child_dir/grandchild_dir`\
    \ all at once. Without the `-p` option, `mkdir` would return an error if any intermediate\
    \ directories do not already exist.\n\n## HANDLING ERRORS\n\nIf a directory already\
    \ exists and you try to create it again without using `-p`, `mkdir` will return\
    \ an error:\n\n```\nmkdir existing_dir\n```\n\nThe command will fail if `existing_dir`\
    \ already exists. Using `-p` suppresses the error if the directory exists:\n\n\
    ```\nmkdir -p existing_dir\n```\n\nThis command will not return an error if `existing_dir`\
    \ already exists.\n\n## SETTING PERMISSIONS\n\nYou can set permissions for the\
    \ new directory using the `-m` option followed by the permission mode (in octal):\n\
    \n```\nmkdir -m 755 new_dir\n```\n\nThis command creates `new_dir` with permissions\
    \ set to `755` (read, write, and execute for the owner; read and execute for others).\n\
    \n## VERBOSE OUTPUT\n\nFor a detailed output of the directories being created,\
    \ use the `-v` option:\n\n```\nmkdir -v new_dir\n```\n\nThis command prints a\
    \ message for each created directory.\n\n## SUMMARY\n\n- Creating a single directory:\n\
    `mkdir my_directory`\n\n- Creating multiple directories:\n`mkdir dir1 dir2 dir3`\n\
    \n- Creating nested directories:\n`mkdir -p parent_dir/child_dir/grandchild_dir`\n\
    \n- Creating a directory with specific permissions:\n`mkdir -m 755 secure_dir`\n\
    \n- Creating a directory with a verbose output:\n`mkdir -v verbose_dir`\n\nThese\
    \ are the most common usages of the `mkdir` command. It is a powerful and versatile\
    \ command essential for directory management in Unix-like systems.\n\n## THE `RMDIR`\
    \ COMMAND\n\nThe `rmdir` command in Unix-like operating systems (including Linux\
    \ and macOS) is used to remove empty directories. If the directory is not empty,\
    \ `rmdir` will not delete it and will return an error message.\n\nHere are some\
    \ key points and examples to help explain the `rmdir`:\n\n### Basic Syntax\n\n\
    The basic syntax of the `rmdir` command is:\n\n```\nrmdir [options] directory_name\n\
    ```\n\n### Examples\n\n### REMOVING A SINGLE EMPTY DIRECTORY\n\nSuppose you have\
    \ an empty directory named `example_dir`:\n\n```\nrmdir example_dir\n```\n\n##\
    \ REMOVING MULTIPLE EMPTY DIRECTORIES\n\nYou can remove multiple empty directories\
    \ in one command:\n\n```\nrmdir dir1 dir2 dir3\n```\n\nThis will remove `dir1`,\
    \ `dir2`, and `dir3` if they are all empty.\n\n## USING `-P` OPTION TO REMOVE\
    \ PARENT DIRECTORIES\n\nThe `-p` (or `--parents`) option allows you to remove\
    \ a directory and its parent directories if they become empty after the removal:\n\
    \n```\nrmdir -p dir1/dir2/dir3\n```\n\nThis will remove `dir3`, `dir2`, and `dir1`\
    \ if all of them are empty.\n\n## HANDLING ERRORS\n\n### DIRECTORY NOT EMPTY\n\
    \nIf the directory is not empty, `rmdir` will not remove it and will display an\
    \ error message:\n\n```\nrmdir non_empty_dir\n```\n\nError message:\nrmdir: failed\
    \ to remove 'non_empty_dir': Directory not empty\n\n### DIRECTORY NOT EXIST\n\n\
    If the directory does not exist, `rmdir` will return an error:\n\n```\nrmdir non_existent_dir\n\
    ```\n\nError message:\nrmdir: failed to remove 'non_existent_dir': No such file\
    \ or directory\n\n## PRACTICAL EXAMPLE\n\nLet's go through a practical example.\
    \ Assume you have the following structure:\n\n```\nproject/\n└── src/\n    └──\
    \ main/\n```\n\n1. Removing `main`:\n`rmdir project/src/main`\n\n2. Removing `src`\
    \ after `main`:\n`rmdir project/src`\n\n3. Removing all empty directories at once\
    \ using `-p`:\n`rmdir -p project/src/main`\n\n## SUMMARY\n\nThe `rmdir` command\
    \ is used for removing empty directories. It is a safe tool because it will not\
    \ delete directories that contain files.\n\n## THE `TOUCH` COMMAND\n\nThe `touch`\
    \ command is a basic utility used in Unix-like systems, including Linux and macOS.\
    \ It is primarily used to create files and update timestamps. Here are some common\
    \ usages:\n\n### CREATING AN EMPTY FILE\n\ntouch filename\n\nExample:\n\n```\n\
    touch example.txt\n```\n\nThis command will create `example.txt`. If `example.txt`\
    \ already exists, its access and modification times will be updated.\n\n### CREATING\
    \ MULTIPLE FILES AT ONCE\n\ntouch file1 file2 file3\n\nExample:\n\n```\ntouch\
    \ file1.txt file2.txt file3.txt\n```\n\nThis command will create three empty files.\n\
    \n### UPDATING THE TIMESTAMP OF AN EXISTING FILE\n\nWhen you run `touch` on an\
    \ existing file, it updates the access and modification times to the current time.\n\
    \ntouch existingfile.txt\n\nExample:\n\ntouch existingfile.txt\n\nThis command\
    \ updates the access and modification timestamps of `existingfile.txt`.\n\n###\
    \ SETTING A SPECIFIC TIMESTAMP\n\nYou can use the `-t` option to set a specific\
    \ timestamp for the file.\n\n```\ntouch -t [[CC]YY]MMDDhhmm[.ss] filename\n```\n\
    \nExample:\n\n```\ntouch -t 202401010000.00 example.txt\n```\n\nThis command will\
    \ set the modification and access time of `example.txt` to midnight (00:00) on\
    \ January 1, 2024.\n\n### USING A REFERENCE FILE\n\nYou can use the `-r` option\
    \ to set the timestamp of one file to be the same as another file.\n\ntouch -r\
    \ reference target target\n\nExample:\n\n```\ntouch -r oldfile.txt newfile.txt\n\
    ```\n\nThis command will set the modification and access times of `newfile.txt`\
    \ to match those of `oldfile.txt`.\n\n### CREATING A FILE WITH NO CLOBBER\n\n\
    Using the `-c` option, `touch` will not create a file if it does not already exist.\
    \ It will only update the timestamps if the file exists.\n\ntouch -c filename\n\
    \nExample:\n\n```\ntouch -c maybe_exists.txt\n```\n\nIf `maybe_exists.txt` exists,\
    \ its timestamps will be updated. If it does not exist, no file will be created.\n\
    \n## SUMMARY OF COMMON OPTIONS\n\n- `-a`: Change only the access time.\n- `-m`:\
    \ Change only the modification time.\n- `-c` or `--no-create`: Do not create any\
    \ files.\n- `-r file`: Use the times from `file`.\n- `-t STAMP`: Use the specified\
    \ time (in the format `[[CC]]YY]MMDDhhmm[.ss]]`)\n\nThese examples should give\
    \ you a good understanding of how to use the `touch` command to create files and\
    \ manipulate timestamps in Unix-like systems.\n"
  mdcn: "\n\n## 命令组合\n\n- 切换目录并列出内容：\n\n```\ncd /path/to/directory && ls\n```\n\n\
    示例：\n\n```\ncd /home/user/Documents && ls\n```\n\n这会将当前目录更改到 `home/user/Documents`\
    \ 并列出其内容。\n\n## 总结\n\n`cd` 命令在命令行界面中导航文件系统至关重要。理解如何高效地使用它可以极大提高工作效率并简化文件管理。以下是常见用法的回顾：\n\
    \n- `cd /path/to/directory` – 切换到指定目录。\n- `cd ..` – 移动上一级。\n- `cd /` – 切换到根目录。\n\
    - `cd` 或 `cd ~` –回到主目录。\n- `cd relative/path` – 使用相对路径导航。\n- `cd -` – 切换到上一个目录。\n\
    \n## `MKDIR` 命令\n\n在 Unix 类操作系统（如 Linux 和 macOS）中，`mkdir` 命令用于创建目录（也称为文件夹）。以下是其用法详解及示例：\n\
    \n### 基本语法\n\n```\nmkdir [options] directory_name\n```\n\n### 基础用法\n\n### 创建单个目录：\n\
    \n```\nmkdir my_directory\n```\n\n此命令在当前工作目录中创建一个名为 `my_directory` 的目录。\n\n##\
    \ 创建多个目录\n\n你可以通过连续指定多个目录来一次创建多个目录：\n\n```\nmkdir dir1 dir2 dir3\n```\n\n此命令会在当前工作目录中创建三个名为\
    \ `dir1`、`dir2` 和 `dir3` 的目录。\n\n## 创建嵌套目录\n\n如果你需要在一个命令中创建嵌套目录（目录中的目录），请使用 `-p`\
    \ 选项：\n\n```\nmkdir -p parent_dir/child_dir/grandchild_dir\n```\n\n此命令会同时创建 `parent_dir`、`parent_dir/child_dir`\
    \ 和 `parent_dir/child_dir/grandchild_dir`。如果没有 `-p` 选项，当任何中间目录不存在，`mkdir` 将返回错误。\n\
    \n## 处理错误\n\n如果目录已存在且你尝试在不使用 `-p` 的情况下再次创建，`mkdir` 将返回错误：\n\n```\nmkdir existing_dir\n\
    ```\n\n如果 `existing_dir` 已存在，命令将失败。使用 `-p` 则会在目录存在时抑制错误：\n\n```\nmkdir -p existing_dir\n\
    ```\n\n如果 `existing_dir` 已存在，此命令将不会返回错误。\n\n## 设置权限\n\n你可以使用 `-m` 选项后跟权限模式（八进制）来为新目录设置权限：\n\
    \n```\nmkdir -m 755 new_dir\n```\n\n此命令创建 `new_dir` 并将其权限设置为 `755`（所有者具有读、写、执行权限；其他人具有读、执行权限）。\n\
    \n## 详细输出\n\n获取所创建目录的详细输出，请使用 `-v` 选项：\n\n```\nmkdir -v new_dir\n```\n\n此命令会为每个创建的目录打印一条消息。\n\
    \n## 总结\n\n- 创建单个目录：\n`mkdir my_directory`\n\n- 创建多个目录：\n`mkdir dir1 dir2 dir3`\n\
    \n- 创建嵌套目录：\n`mkdir -p parent_dir/child_dir/grandchild_dir`\n\n- 创建具有特定权限的目录：\n\
    `mkdir -m 755 secure_dir`\n\n- 创建带有详细输出的目录：\n`mkdir -v verbose_dir`\n\n这些是 `mkdir`\
    \ 命令最常用的用法。它是一个强大且多功能的命令，对于 Unix 类系统的目录管理至关重要。\n\n## `RMDIR` 命令\n\n在 Unix 类操作系统（包括\
    \ Linux 和 macOS）中，`rmdir` 命令用于删除空目录。如果目录为空，`rmdir` 将不会删除它并返回错误消息。\n\n以下是一些帮助解释\
    \ `rmdir` 的关键点和示例：\n\n### 基本语法\n\n`rmdir` 命令的基本语法为：\n\n```\nrmdir [options] directory_name\n\
    ```\n\n### 示例\n\n### 删除单个空目录\n\n假设你有一个名为 `example_dir` 的空目录：\n\n```\nrmdir example_dir\n\
    ```\n\n## 删除多个空目录\n\n你可以在一个命令中删除多个空目录：\n\n```\nrmdir dir1 dir2 dir3\n```\n\n如果\
    \ `dir1`、`dir2` 和 `dir3` 均为空，则将删除它们。\n\n## 使用 `-P` 选项删除父目录\n\n`-p`（或 `--parents`）选项允许你在删除目录后，如果其父目录变为空，则一并删除这些父目录：\n\
    \n```\nrmdir -p dir1/dir2/dir3\n```\n\n如果 `dir3`、`dir2` 和 `dir1` 均为空，则将删除它们。\n\
    \n## 处理错误\n\n### 目录不为空\n\n如果目录为空，`rmdir` 将不会删除它并显示错误消息：\n\n```\nrmdir non_empty_dir\n\
    ```\n\n错误消息：\nrmdir: failed to remove 'non_empty_dir': Directory not empty\n\n\
    ### 目录不存在\n\n如果目录不存在，`rmdir` 将返回错误：\n\n```\nrmdir non_existent_dir\n```\n\n错误消息：\n\
    rmdir: failed to remove 'non_existent_dir': No such file or directory\n\n## 实际示例\n\
    \n让我们来看一个实际示例。假设你有以下结构：\n\n```\nproject/\n└── src/\n    └── main/\n```\n\n1. 删除\
    \ `main`：\n`rmdir project/src/main`\n\n2. 删除 `main` 后删除 `src`：\n`rmdir project/src`\n\
    \n3. 使用 `-p` 一次删除所有空目录：\n`rmdir -p project/src/main`\n\n## 总结\n\n`rmdir` 命令用于删除空目录。它是一个安全的工具，因为它不会删除包含文件的目录。\n\
    \n## `TOUCH` 命令\n\n`touch` 命令是 Unix 类系统（包括 Linux 和 macOS）中的一个基础实用程序，主要用于创建文件和更新时间戳。以下是一些常见用法：\n\
    \n### 创建空文件\n\ntouch filename\n\n示例：\n\n```\ntouch example.txt\n```\n\n此命令将创建\
    \ `example.txt`。如果 `example.txt` 已经存在，它的访问时间修改修改时间将得到更新。\n\n## 一次创建多个文件\n\ntouch\
    \ file1 file2 file3\n\n示例：\n\n```\ntouch file1.txt file2.txt file3.txt\n```\n\n\
    此命令将创建三个空文件。\n\n## 更新现有文件的时间戳\n\n当你对现有文件运行 `touch` 时，它会将访问时间和修改时间更新为当前时间。\n\n\
    touch existingfile.txt\n\n示例：\n\n```\ntouch existingfile.txt\n```\n\n此命令将更新 `existingfile.txt`\
    \ 的访问和修改时间戳。\n\n## 设置特定时间戳\n\n你可以使用 `-t` 选项为文件设置特定的时间戳：\n\n```\ntouch -t [[CC]YY]MMDDhhmm[.ss]\
    \ filename\n```\n\n示例：\n\n```\ntouch -t 202401010000.00 example.txt\n```\n\n此命令将\
    \ `example.txt` 的修改和访问时间设置为 2024 年 1 月 1 日午夜 (00:00)。\n\n## 使用参考文件\n\n你可以使用 `-r`\
    \ 选项将一个文件的时间戳设置为与另一个文件相同：\n\ntouch -r reference target target\n\n示例：\n\n```\n\
    touch -r oldfile.txt newfile.txt\n```\n\n此命令将 `newfile.txt` 的访问和修改时间设为与 `oldfile.txt`\
    \ 匹配。\n\n## 在不覆盖的情况下创建文件\n\n使用 `-c` 选项时，如果文件不存在，`touch` 将不会创建文件。它只会在文件存在时更新时间戳。\n\
    \ntouch -c filename\n\n示例：\n\n```\ntouch -c maybe_exists.txt\n```\n\n如果 `maybe_exists.txt`\
    \ 存在，则其时间戳将得到更新。如果它不存在，则不会创建文件。\n\n## 常用选项总结\n\n- `-a`：仅更改访问时间。\n- `-m`：仅更改修改时间。\n\
    - `-c` 或 `--no-create`：不创建任何文件。\n- `-r file`：使用 `file` 的时间。\n- `-t STAMP`：使用指定的时间（格式为\
    \ `[[CC]]YY]MMDDhhmm[.ss]]`\n\n这些示例应该让你良好地理解如何在 Unix 类系统中使用 `touch` 命令来创建文件和操作时间戳。\n\
    \n"
