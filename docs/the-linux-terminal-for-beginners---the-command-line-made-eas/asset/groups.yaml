    # Common Uses:


    ![](img/3018b019ea77beb5d8f87fb98f1e207c_425_3.png)


    +   - Install new software packages.

    - Update existing software packages to newer versions.

    - Remove installed software packages.

    - Manage repositories for obtaining software packages.

    - Query and verify packages.'
