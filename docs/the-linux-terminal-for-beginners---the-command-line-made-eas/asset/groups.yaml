    # 9. PACKAGE MANAGEMENT


    # THE `APT` COMMAND


    The `apt` command in the Linux terminal is a package management tool used in Debian-based
    distributions like Ubuntu. It simplifies the process of managing software packages,
    including installing, updating, and removing packages. Below is a detailed explanation
    along with some examples.


    # OVERVIEW OF `APT`


    Full Name: Advanced Package Tool


    Usage: Simplifies package management tasks


    Distributions: Debian, Ubuntu, and other Debian-based distributions


    Functions: Install, update, upgrade, search, and remove software packages


    # UPDATING THE PACKAGE LIST


    Before installing or upgrading packages, it''s a good practice to update the package
    list to get the latest versions and dependencies.


    ```

    sudo apt update

    ```


    # UPGRADING INSTALLED PACKAGES


    This command upgrades all the packages on your system to the latest available
    versions.


    ```

    sudo apt upgrade

    ```


    # FULL UPGRADE


    This command not only upgrades the installed packages but also handles changing
    dependencies with new versions of packages.


    ```

    sudo apt full-upgrade

    ```


    # INSTALLING A PACKAGE


    To install a new package, use the `install` subcommand followed by the package
    name.


    ```

    sudo apt install package_name

    ```


    For example, to install the `curl` package:


    ```

    sudo apt install curl

    ```


    # REMOVING A PACKAGE


    To remove an installed package, use the `remove` subcommand.


    ```

    sudo apt remove package_name

    ```


    For example, to remove the `curl` package:


    ```

    sudo apt remove curl

    ```


    # PURGING A PACKAGE


    Purging a package removes it along with its configuration files.


    ```

    sudo apt purge package_name

    ```


    # SEARCHING FOR A PACKAGE


    If you are not sure about the exact package name, you can search for it.


    ```

    apt search keyword

    ```


    For example, to search for packages related to `curl`:


    ```

    apt search curl

    ```


    # SHOWING PACKAGE INFORMATION


    To display detailed information about a specific package, use the `show` subcommand.


    ```

    apt show package_name

    ```


    For example, to show information about the `curl` package:


    ```

    apt show curl

    ```


    # LISTING PACKAGES


    To list all packages that can be upgraded:


    ```

    apt list --upgradable

    ```


    # CLEANING UP


    To clean up local repository of retrieved archive files:


    ```

    sudo apt clean

    ```


    # THE `AUTOREMOVE` COMMAND


    The `autoremove` command in Linux, used with `apt-get` or `apt`, removes packages
    that were automatically installed to satisfy dependencies for other packages but
    are no longer needed. This helps free up disk space and keep the system clean.


    ```

    sudo apt autoremove

    ```

