    # VIEWING A FILE


    - `more filename.txt`

    This will display the content of `filename.txt` one screen at a time.


    # PIPING OUTPUT TO `MORE`


    - `cat largefile.txt | more`

    This pipes the output of `cat largefile.txt` to `more`, allowing you to view the
    content of `largefile.txt` one screen at a time.


    # COMBINING COMMANDS


    - `ls -l | more`


    This lists the directory contents with detailed information and paginates the
    output.


    # KEY COMMANDS WHILE USING `MORE`


    - Spacebar: Move to the next screen.

    - Enter: Move to the next line.

    - b: Move back one screen.

    - pattern: Search for `pattern` in the text. Use `n` to go to the next occurrence.

    - q: Quit `more`.


    # Options


    - -d: Prompt the user with a more detailed message when pausing.

    more -d filename.txt

    - -c: Clear the screen before displaying the next page.

    more -c filename.txt

    - -s: Squeeze multiple blank lines into one.

    more -s filename.txt

    - + num: Start displaying the file from line `num`.

    more +20 filename.txt

    - + pattern: Start displaying the file from the first occurrence of `pattern`.

    more +/"start_pattern" filename.txt


    # SUMMARY


    The `more` command is a simple and effective way to read through text files and
    command outputs one screen at a time. Its key features include the ability to
    scroll through files, search within files, and start reading from specific lines
    or patterns. Although more modern pagers like `less` offer additional functionality,
    `more` remains a useful and straightforward tool for file viewing in Unix-like
    systems.


    # THE `CAT` COMMAND


    The `cat` command in Unix-based systems (like Linux and macOS) is short for "concatenate"
    and is used to read, display, and combine the contents of files. Here are some
    common uses and examples:


    Basic Usage


    # DISPLAY CONTENTS OF A FILE


    - `cat filename.txt`

    This command displays the content of `filename.txt` on the terminal.


    Example:


    ```bash

    cat hello.txt

    ```


    If `hello.txt` contains "Hello, world!", the output will be:


    Hello, world!


    # CONCATENATE MULTIPLE FILES


    - `cat file1.txt file2.txt`


    This command reads the contents of `file1.txt` and `file2.txt`, and outputs them
    in sequence.


    Example:


    ```bash

    cat hello.txt world.txt

    ```


    If `hello.txt` contains "Hello," and `world.txt` contains "world!", the output
    will be:


    Hello,


    world!


    # REDIRECT OUTPUT TO A NEW FILE


    `cat file1.txt file2.txt > newfile.txt`


    This command concatenates `file1.txt` and `file2.txt`, and writes the result to
    `newfile.txt`.


    Example:


    ```bash

    cat hello.txt world.txt > greeting.txt

    ```


    The contents of `greeting.txt` will be:


    Hello,


    world!


    # APPEND TO AN EXISTING FILE


    `cat file1.txt >> existingfile.txt`


    This command appends the contents of `file1.txt` to the end of `existingfile.txt`.


    Example:


    ```bash

    cat hello.txt >> greeting.txt

    ```


    If `greeting.txt` initially contains "Hi there.", it will now contain:


    Hi there.


    Hello,


    # ADVANCED USAGE


    # NUMBER ALL OUTPUT LINES


    - `cat -n filename.txt`

    This command numbers all the lines in the output.


    **Example:**


    ```bash

    cat -n hello.txt

    ```


    The output will be:


    1 Hello, world!


    # NUMBER NON-EMPTY OUTPUT LINES


    - `cat -b filename.txt`

    This command numbers only the non-empty lines in the output.


    Example:


    ```bash

    cat -b hello.txt

    ```


    If `hello.txt` contains:


    Hello,


    world!


    The output will be:


    1 Hello,


    2 world!


    # SHOW END OF LINE CHARACTERS


    - `cat -E filename.txt`

    This command shows `$` at the end of each line, indicating the end of line.


    Example:


    ```bash

    cat -E hello.txt

    ```


    The output will be:


    Hello, world!$


    # DISPLAY NON-ABLE CHARACTERS


    - `cat -v filename.txt`

    This command displays non-printable characters in visible format.


    # PRESS REPEATED EMPTY LINES


    - `cat -s filename.txt`

    This command suppresses repeated empty lines.


    Example:


    ```bash

    cat -s hello.txt

    ```


    If `hello.txt` contains:


    Hello,


    world!


    The output will be:


    Hello,


    world!


    # SUMMARY


    The `cat` command is a versatile tool in Unix-based systems used to:


    - Display the contents of files.

    - Concatenate multiple files.

    - Redirect output to a file.

    - Append output to an existing file.

    - Number lines, show the end of lines, display non-printable characters, and suppress
    empty lines.


    It is often used in scripting and combining the contents of multiple files in
    a simple manner.


    # THE `HEAD` COMMAND


    The `head` command in Linux is used to display the first few lines of a file or
    input. By default, it shows the first10 lines. This command is useful for quickly
    viewing the beginning of a file to understand its structure or contents without
    opening the entire file.


    ## Basic Syntax


    `head [OPTION] [FILE]...`


    ## Common Options


    - `-n [NUMBER]`: Show the first NUMBER lines of the file.

    - `-c [NUMBER]`: Show the first NUMBER bytes of the file.

    - `-q`: Suppress headers when multiple files are being examined.

    - `-v`: Always show headers when multiple files are examined.


    # DISPLAY THE FIRST 10 LINES OF A FILE:


    `head filename.txt`


    # DISPLAY THE FIRST 20 LINES OF A FILE:


    ```bash

    head -n 20 filename.txt

    ```


    # DISPLAY THE FIRST 50 BYTES OF A FILE:


    ```bash

    head -c 50 filename.txt

    ```


    # DISPLAY THE FIRST 5 LINES OF MULTIPLE FILES:


    ```bash

    head -n 5 file1.txt file2.txt

    ```


    # DISPLAY THE FIRST 10 LINES OF MULTIPLE FILES WITHOUT HEADERS:


    ```bash

    head -q file1.txt file2.txt

    ```


    # DISPLAY THE FIRST 10 LINES OF MULTIPLE FILES ALWAYS WITH HEADERS:


    ```bash

    head -v file1.txt file2.txt

    ```


    # SUMMARY


    The `head` command is a simple yet powerful tool for quickly viewing the beginning
    portion of files. It can be customized to show a specific number of lines or bytes
    and can handle multiple files with options to control the display of headers.
    This command is commonly used in scripting and command-line data inspection to
    get a peek at file contents.


    # THE `tail` COMMAND


    The `tail` command in the Linux terminal is used to display the last part of files.
    By default, it shows the last 10 lines of a file, but it can be customized to
    display a different number of lines or even bytes. It''s particularly useful for
    monitoring log files or checking the most recent changes to files.


    ## Syntax


    `tail [OPTION] [FILE]...`


    ## Common Options


    - `-n,--lines=[+]NUM`: Output the last NUM lines, instead of the last 10. With
    the leading `+`, output lines starting with the NUMth line from the start.

    - `-c,--bytes=[+]NUM`: Output the last NUM bytes; with the leading `+`, start
    at the NUMth byte.

    - `-f,--follow`: Output appended data as the file grows; useful for log files.

    - `-q,--silent`: Never output headers giving file names.

    - `-v,--verbose`: Always output headers giving file names.

    - `-s,--sleep-interval=N`: With `-f`, sleep for approximately N seconds (default
    1.0) between iterations.


    # DISPLAY THE LAST 10 LINES OF A FILE:


    ```bash

    tail filename.txt

    ```


    This command shows the last 10 lines of `filename.txt`.


    # DISPLAY THE LAST 5 LINES OF A FILE:


    ```bash

    tail -n 5 filename.txt

    ```


    This command shows the last 5 lines of `filename.txt`.


    # DISPLAY THE LAST 20 BYTES OF A FILE:


    ```bash

    tail -c 20 filename.txt

    ```


    This command shows the last 20 bytes of `filename.txt`.


    # FOLLOW A FILE (REAL-TIME MONITORING)


    ```bash

    tail -f /var/log/syslog

    ```


    This command monitors the file `/var/log/syslog` in real-time, showing new lines
    as they are added.


    # DISPLAY LINES STARTING FROM THE 5TH LINE


    ```bash

    tail -n +5 filename.txt

    ```


    This command shows the file content starting from the 5th line to the end of `filename.txt`.


    # FOLLOW A FILE WITH A SPECIFIC SLEEP INTERVAL


    ```bash

    tail -f -s 2 /var/log/syslog

    ```


    This command monitors the file `/var/log/syslog`, checking for updates

    every 2 seconds.

