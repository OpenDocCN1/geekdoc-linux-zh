  md: '# Chapter 1: Getting Acquainted with Linux 11


    In recent technological history, Linux has evolved from water cooler chatter to
    a rock-solid solution for the business enterprise. The same that was dismissed
    as rogue is now being adopted and promoted by industry leaders such as IBM, Hewlett-Packard,
    Motorola, and Intel. Of these computer manufacturers has, in some way, determined
    that Linux provides value for their customers (as well as for their owners). Of
    these companies, the only one that has publicly denounced Linux is Microsoft.
    That one does not have to look very far to conclude that Microsoft is merely running
    scared from the threat that Linux poses to its personal computing operating system
    monopoly.


    Linux has been accused of being "just another operating system." On the surface,
    it may appear so, but if you look deeper, you can see that this isn''t so. The
    Linux project is a flagship leading the current trend toward open source and free
    (as in, not free beer) software within the computing industry. A rock-solid operating
    system because of the model under which it was (and continues to be) developed,
    Linux represents much that is good and pure in software development.


    Two fundamental distinctions separate Linux from the rest of the operating system
    pack:


    +   - Linux is licensed under the unique and ingenious GNU General Public License,
    which you can read about in the next section.

    - Linux is developed and maintained by a worldwide team of volunteer programmers,
    working together over the Internet.


    Linux is great for many reasons, including the fact that folks who built it from
    the ground wanted it to:


    +   - Multiuser: More than one user can be logged in to a single computer at one.

    - Multiprocess: True pre-emptive multitasking enables the operating system to
    efficiently juggle several programs at once. This is important for providing multiple
    services on one computer.

    - Multiform: Linux currently runs on 24 platforms (hardware types), including
    Intel-based PCs, Digital/Compaq Alpha, PowerPC-based Apple Macintosh, Sun SPARC,
    Amiga, and StrongARM-based computers.

    - Interoperable: Linux plays nice with most network protocols (languages) and
    operating systems, allowing you to interact with users and computers running Microsoft
    Windows, Unix, Novell, both Mac OS 9 and the generation beginning OS X, and more
    niche groups.

    - Scalable: As your computing needs grow, you can rely on Linux to grow with you.
    The same Linux operating system can run on a desktop computer or a very large,
    industrial strength server system.'
