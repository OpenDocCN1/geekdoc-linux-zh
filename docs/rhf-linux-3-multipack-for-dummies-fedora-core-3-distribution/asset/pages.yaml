  md: '# 346 Part IV: Getting Done


    # # Checking Your Sound Card


    Many distributions ask you to test your sound card as part of the installation
    or immediate post-installation routine. Just in case you skipped this step, the
    first thing to do is locate the sound-testing program (if one exists) to see yours
    is working:


    +   - Fedora: Choose Applications-System Settings-Soundcard Detection to see whether
    the card is correctly detected and play tests sounds.


    +   - Knoppix: From the main menu, choose KNOPIX-Configure-Soundcard Configuration
    to start the sound configuration utility.


    +   - Linspring: From the main menu, choose Settings-Control Panel-Advanced Settings-Information-Sound
    to see whether the card is correctly detected.


    +   - Mandrake: From the main menu, choose System-Configuration-Configure Your
    Desktop-Sound-Sound System-Hardware to see whether the card is correctly detected.


    +   - SuSE: From the main menu, choose Control Center-Sound & Multimedia-Sound
    System-Hardware to see what card has been found.


    +   - Xanders: Choose Launch-Control Center-Hardware Information-Sound to see
    what sound card the operating system found.


    # # Looking into Your Mixer


    If the card seems to be detected properly, then a look at your mixer is the next
    important step. Sometimes cards are picked up right, and yet the mixer for some
    reason by hangs muted, or other strange things are. To find the mixer:


    +   - Fedora: Choose Applications-Sound & Video-Volume Control.


    +   - Knoppix: From the main menu, choose Multimedia-KMix.


    +   - Linspring: From the main menu, choose Programs-Audio & MP3-Volume.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '+   - Mandrake: From the main menu, choose Multimedia-SoundKMix.


    +   - SUSE: From the main menu, choose Multimedia-Volume Control. You may find
    other programs useful in this menu as well.


    +   - Xandros: Choose Launch-Multimedia-Sound Mixer.


    Mixer terms of interest include the following:


    +   - Lock: When two slider bars appear for a setting, this option just makes
    sure that they''re always level with one another.


    +   - Mute: No sound comes from this section.


    +   - PCM: Control the volume for audio files as opposed to, say, CDs.


    +   - Volume: Control the overall volume.


    Finally, many of the distributions have a little volume icon on the panel. If
    everything else looks right but you get no sound, click it and make that it hasn''t
    been pulled down to the bottom.


    # # Investigating Troublesome Sound Issues


    If your sound isn''t working, your card may not be supported. The following strategies
    can help you track down a potential solution:


    +   - Proceed to the manufacturer''s Web site and locate the page for the specific
    card that you have. This page often has a link to technical support, drivers,
    and downloads. If it does, follow these links and see whether a driver (the piece
    of software that tells your operating system how to talk to each piece of hardware)
    is available for your card in Linux. If drivers are listed by kernel version —
    the version of the Linux core that you are using—uname to see your version number
    and then choose the closest driver that you can. You might also have to try the
    central tech support page on that if there isn''t one dedicated to the hardware.


    +   - Search on www.google.com for the make and model of your card, plus the word
    Linux: YMF-744B Linux


    You may be lucky enough to find a nice, simple solution to your problem. Or, you
    may find one that requires you to have a degree in Geekspeak. If so, see the Web
    sites in Chapter 1 for where to go for help that you can understand.'
  merge: -1
