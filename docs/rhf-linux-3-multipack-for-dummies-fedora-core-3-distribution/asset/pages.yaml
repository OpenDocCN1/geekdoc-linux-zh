- img_proc: true
  md: '# Chapter 14: Working without the GUI


    The capability of the Linux file system to deal with practically unlimited sizes
    of filenames that mean many filenames can become huge. Typing these long filenames
    can become cumbersome. Fortunately, with command completion, typing a command
    or a long filename is short work.


    You may want to use command completion in two situations: to enter a command or
    to complete a filename.


    # Completing a command


    Suppose that you want to type a command, but you can remember only that it begins
    with the letters and is supposed to return the length of time that has passed
    since the system was rebooted. Type up at the command prompt and press Tab:


    ```

    $deepthink_evan$ up[TAB]

    ```


    One of two things happens:


    +   * If one matching command is in the search path (directory locations for searching
    for programs; type echo $PATH to find out yours is), your command line is completed
    with that command, and the system waits for you to press Enter to execute the
    command.


    +   * If you hear a beep, it means that more than one command begins with up.
    Simply press Tab a second time, and all the possibilities are displayed. Locate
    the command on the list and continue it until the first letters are unique, at
    which point you press the Tab key to complete the command.


    # Completing a filename


    Command-line completion isn''t only for commands; if you''re typing a filename
    on your command line, you only need to type the first few characters and press
    Tab. The shell searches the current directory for filenames that match what you
    have typed and subsequently completes the filename on the command line. This feature
    behaves the same way as the command-completion feature in that, if more than one
    file contains the letters you type, you hear a beep and need to press Tab again
    to see a list of choices.


    It a little getting used to, but after you have control of the Tab key and the
    shell command-line completion feature, you may wonder how you ever got along without
    it.


    # Accessing your command history


    It''s nice of the shell to remember what you have done, for better or worse. Having
    the shell keep track of the commands you enter makes easy to'
