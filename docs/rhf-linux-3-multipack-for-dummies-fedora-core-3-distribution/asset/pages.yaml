- img_proc: true
  md: '# Files and file system


    No matter what operating system you''re using, it''s hard to do anything without
    being able to find your way through and work with the file system. The following
    utilities help you find your way:


    # File organization


    Boxing, packing, sorting, shipping — I''m always shuffling files around my system.
    File organization commands provide tools for moving files and file units around,
    as shown in Table A-4.


    | Command | Purpose |

    | --- | --- |

    | cd | Changes directories. |

    | cp | Copies a file. |

    | df | Shows partitions and how much space they have. |

    | du | Shows how much disk is being used in the current directory and below. |

    | ln | Creates a shortcut. |

    | ls | Lists the contents of a directory or information about a file. |

    | mkdirdir | Creates a directory. |

    | mv | Moves or renames a file. |

    | pwd | Shows the path for the directory you''re currently in. |

    | rm | Deletes a file. |

    | rmdir | Deletes an empty directory. |


    # File attributes


    Files are like candy bars. The wrappers provide information about the ingredients,
    size, and package date — all descriptive of the tasty nugget inside. (Perhaps
    the wrapper is even childish.) Files keep all this wrapper information in an *inode*.
    Along with the capability to change file information, these commands can return
    data about the content of the file, as shown in Table A-5.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Appendix A: Common Linux Commands 399


    | Table A-5 File Attributes Commands |

    | Command | Purpose |

    |---|---|n| chgrp | Changes the group associated with a file. |

    | chmod | Changes a file''s permissions. |

    | chown | Changes who owns a file. |

    | file | Shows what type of file you''re dealing with. |

    | stat | Shows some statistics about the file. |

    | touch | Creates an empty file of this name. |

    | wc | Shows how many words, lines, and so on in this file. |


    File locators

    Where, oh can my file be? These commands, shown in Table A-6, help you locate
    files in Linux''s monster tree-structure file system:


    | Table A-6 File Locators Commands |

    | Command | Purpose |

    |---|---|n| find | Hard-core filesystem search tool. |

    | locate | Lighter weight filesystem search tool. |

    | which | Tells you the path for the program that would be run if you typed this
    command. |


    File viewers

    File browsing is a favorite pastime of many a system user. These tools provide
    a variety of utilities for utilizing the contents of readable files of all sizes.
    Unlike using a full-screen editor, you cannot damage the contents of a file with
    these commands, shown in Table A-7, because they''re read-only tools:


    | Table A-7 File Viewers |

    | Command | Purpose |

    |---|---|n| cat | Dumps the contents of the file to your screen. |

    | head | Shows the first ten lines of a file.


    (continued)'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# 400 Part VI: Appendixes


    | Command | Purpose |

    | --- | --- |

    | less | Shows the file a screen at a time. |

    | more | Shows the file a screen at a time. |

    | tail | Shows the last ten lines of a file. |


    Table A-7 (continued)


    File system commands

    These commands, listed in Table A-8, provide information or perform actions on
    the entire file system, from creation and tuning to repair and recovery. Some
    of these commands return data only, whereas others also provide you with surgical
    instruments for serious file-system hacking.


    | Command | Purpose |

    | --- | --- |

    | badblocks | Searches a partition for bad blocks. |

    | e2fsck | Checks and repairs an ext2 or ext3 filesystem. |

    | e2label | Applies a filesystem label to an ext2 or ext3 partition. |

    | eject | Ejects a CD or DVD. |

    | fsck | Can check and repair many types of filesystems. |

    | mkfs | Creates a filesystem (format a partition). |

    | mount | Loads a partition into your filesystem. |

    | sync | Saves all information out of buffers onto disks. |

    | tune2fs | Adjusts ext2 and ext3 filesystem parameters. |

    | umount | Removes a partition from the filesystem. |


    Table A-8

    File System Commands


    # mtools


    The mtools suite of utilities provides a nice way to transfer information to your
    Microsoft friends. Although Linux has native support for Windows and DOS file
    systems, your Microsoft cohorts don''t have'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'to Linux (ext2 and ext3) file systems. To keep everyone happy, you can buy
    preformatted MS-DOS disks and use them with the mtools commands (see Table A-9)
    so that you can swap them back and forth with your friends who are using Windows:


    | Table A-9 | mTools Commands |

    | Command | Purpose |

    | mcd | Changes directory in DOS format on a DOS disk. |

    | mcopy | Copies DOS files to and from Linux. |

    | mdel | Deletes a DOS file. |

    | mdtree | Deletes a DOS directory and its contents. |

    | mdir | Lists a DOS directory''s contents. |

    | mdu | Shows how much space is taken and available for a DOS partition. |

    | mformat | Formats a partition for DOS. |

    | mlabel | Applies a DOS volume label. |

    | mmd | Creates a DOS directory. |

    | mmount | Mounts a DOS disk or partition. |

    | move | Moves or renames a DOS file or directory. |


    # System control


    These commands provide system-wide information and control. Normal users can run
    many commands to obtain system information; however, commands that actively change
    the configuration of the system need to run while you''re logged in as root —
    or have utilized the su command to temporarily become the superuser.


    # Administration


    Some administration commands, shown in Table A-10, don''t fall neatly into a category.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# 402 Part VI: Appendixes


    | Table A-10 Administration Commands |

    | Command | Purpose |

    | --- | --- |

    | passwd | Change a particular user''s password. Any user can run this command
    to change their own password. Only root can use it to change someone else''s.
    |

    | su | Switch to another user account without logging out of this one.


    # Kernel module handling


    You may sometimes need to add kernel support for an additional device (software
    or hardware). If this need arises, you have a limited number of choices: You can
    either rebuild the kernel or install a loadable kernel module. Although rebuilding
    the kernel doesn''t exactly require a Ph.D. in nuclear science, consider it a
    time-consuming nuisance that''s best to avoid. The commands in Table A-11 enable
    you to include the kernel support while need the system is running, without having
    to rebuild the entire thing from scratch:


    | Table A-11 Kernel Support Commands |

    | Command | Purpose |

    | --- | --- |

    | depmod | Regenerates your module dependencies. |

    | insmod | Loads a module by hand. |

    | lsmod | Lists the modules your kernel has loaded. |

    | modprobe | Loads a module by hand along with its dependencies and settings.
    |

    | rrmod | Unloads a module by hand.


    # Processes


    Most of your system activity requires processes. Even when your system appears
    idle, a dozen or so processes are running in the background. These commands, shown
    in Table A-12, enable you to check under the hood to make sure that everything
    that needs to be running is running and that you''re not overheating or overtaxing
    resources:'
  merge: -1
  pgno: 419
- img_proc: true
  md: '| Table A-12 Process Commands |

    | Command | Purpose |

    | at | Has a command run at a particular time. |

    | atq | Works with the at queue. |

    | crontab | Sets up commands to run at regular intervals. |

    | kill | Stops a process by its number. Often used as -9 for a harsh stop for
    something that won''t die. |

    | killall | Stops a process by name rather than number. |

    | nice | Assigns a CPU priority to a process. |

    | pidof | Gets a program''s ID number. |

    | ps | Gets a lot of programs'' ID number, usually used as ps aux. |

    | pstree | Shows the relationships between programs. |

    | renice | Changes a program''s CPU priority. |

    | top | Shows resource use over time. |'
  merge: -1
