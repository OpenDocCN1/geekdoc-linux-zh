  md: '# Part I: Getting Your Feet Wet


    # Giving Linux the Boot


    Let''s face it: As Enjoyable as the experience of staring at a dormant device,
    is the real fun starts when you turn on the computer. As with any electronic device,
    opening the electron floodgate is the first step to fun. A computer, however,
    has much more stuff to do than your toaster oven. Rather than a simple heating
    element, your computer has to check all gizmos that you (or the manufacturer)
    plugged into your computer''s motherboard. After the initial power-up, the computer
    performs some simple hardware tests (called the POST, or Power-Up Self Test) to
    determine whether those components are working properly.


    Checking all your hardware is just the beginning. Between the time you turn the
    computer on and the moment the gospher on your monitor prompts for a login name,
    the computer is building itself an empire. If you listen and watch carefully,
    your computer and monitor show signs of the boot process through bleeps, buzzes,
    whirling motors, clicks, messages on the monitor, and blinking lights.


    # Step 1: Power-On Self-Test (POST) leads to BIOS


    The POST process really has nothing to do with the operating system. Your computer
    performs this step whether you''re running Linux or another operating system such
    as Windows XP.


    Some symptoms of a failed POST include


    +   An unusual series of long and short sweeps.

    Nothing displayed on the monitor.

    No apparent activity other than the whirring fan on the power supply.

    A puff of smoke or the pungent smell of burning electrical components from your
    computer case.

    An error message, displayed on the monitor, indicating a hardware failure.


    If you encounter any of these problems, you may have troubles that need to be
    resolved before you proceed. Chances are, if your computer'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Chapter 5: Booting and Stopping Linux 97


    was running properly before you began your Linux installation, your computer would
    be getting through the POST just fine — POST problems don''t tend to be caused
    by installing a new operating system; they''re far more fundamental to the computer
    itself.


    For all the last of these errors, it''s time to question your nephew Mortimer,
    who was last seen lurking around your computer with a screwdriver. (Or take your
    computer into a computer repair shop) may! If you see an error message indicating
    a hardware failure, you might have a shot of fixing the problem in the BIOS. As
    the POST does it and finishes up, it briefly displays (usually at the bottom of
    the screen) instructions on how to enter "setup." Typically, these instructions
    mention pressing the DEL key or a function key as F1. When you press this, if
    all goes well, you will see a blue screen with black and white text. From here,
    if you''re familiar with your hardware, you can try to figure out and fix the
    problem. However, many people would rather have a root canal with no anesthesia
    than this stuff, so you may want to grab the nearest teenager or computer repair
    shop to take a look.


    The good news is that if you get to the BIOS at all, the problem may be easier
    to fix than one where the computer fails before you reach the BIOS.


    # Step 2: The BIOS passes the baton to the boot loader


    After the BIOS gives the okey-dokey with a successful POST, the BIOS locates the
    first hard drive in your system and reads the first sector of that disk, which
    is often referred to as the MBR (Master Boot Record). On that first chunk of disk
    is a small program called boot loader. The boot loader doesn''t know much anything,
    except how to start loading your operating system.


    Two boot programs understand how to load a Linux operating system: LILO (Linux
    LOader) and GRUB (GRand Unified Boot loader). LILO has been a tried-and-true boot
    loader for as long as Linux has been a gleam in the geek''s eyeball. GRUB is a
    newer and much more sophisticated boot loader program than LILO. Many distributions
    allow you to choose your boot loader. Typically, most people stick with the defaults,
    which are as follows for the five distributions discussed in this book:


    # Distribution


    # Default Boot Loader


    Fedora Core | GRUB


    Linscape | LILO, with its own special routines on top of


    Mandrake | LILO


    SuSE | GRUB


    Xandros | LILO, with its own special routines on top of'
