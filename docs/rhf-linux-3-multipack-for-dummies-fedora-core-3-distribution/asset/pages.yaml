  md: '# 12 Part I: Getting Your Feet Wet


    +   **Portable**: Linux is mostly written in the C programming language. C is
    a language created specifically for writing operating system-level software and
    can be readily ported (translated) to run on new computer hardware.

    - **Flexible**: You can configure the Linux operating system as a network host,
    router, office productivity PC, home entertainment computer, file server, Web
    server, cluster, or just about any other computing appliance that you can think
    of.

    - **Stable**: The Linux *kernel (the operating system itself)* has achieved a
    level of maturity that makes most software developers envious. It''s not uncommon
    to hear reports of Linux servers running for years without crashing.

    - **Efficient**: The modular design of Linux enables you to include only those
    components that you need to run your desired services. Even older Pentium computers
    can utilize Linux and become useful again.

    - **Free**: To most people, the most intriguing aspect of Linux is the fact that
    it''s often free. How (the capitalists murmur) can anyone build a better mousetrap
    with no incentive of direct monetary return?


    # So, where did Linux come from?


    To understand Linux, you need to take a peek at its heritage. Although programming
    of the Linux core started in 1991, the design concepts were based on the time-tested
    Unix operating system.


    Unix was developed at Bell Laboratories in the late 1960s. The original architects
    of Unix created it when there were few operating systems, with the desire to share
    data, programs, and resources both efficiently and securely—something that wasn''t
    available at this time. From there, Unix evolved into many versions and its current
    family is so complicated it looks like kudzu infestation!


    In 1991, Linux Torvalds was a computer science student at the University of Helsinki
    in Finland. He wanted an operating system that was like the Unix system he''d
    grown fond of at the university, both Unix and the hardware he ran


    were prohibitively expensive. A Unix version called Minix was available for free,
    but it didn''t meet his needs. So, as a computer science student, Torvalds studied
    Minix and set out to write a new version of his own works (recorded for posterity
    on the Internet). This was in an early version of an online chat room); this,
    just a hobby, won''t be big and professional like gun.


    Writing an operating system is no small task. After six months of hard work, Torvalds
    made very little progress toward the general utility of the system. What he posted
    on the Internet found many shared his interest and curiosity. Before long, some
    of the brightest minds around the world were contributing to Linux''s project
    by adding enhancements or fixing *bugs*(errors in the code).'
