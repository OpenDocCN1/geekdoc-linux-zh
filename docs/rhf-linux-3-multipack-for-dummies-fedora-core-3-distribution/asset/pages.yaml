  md: '# 216 Part III: Getting Up to Speed with Linux


    is the majority of your Linux filesystem. Because you''re running your own Linux
    machine, you need to be familiar with how it''s put together — especially the
    sections that are dangerous to mess with!


    # Meet the root directory


    Everything in the Linux filesystem is relative to the root directory, which is
    referred to as / and is the file-system base, a doorway into all your files —
    don''t confuse this with the root directory, which is the system administrator.
    The root directory contains a mostly predictable set of subdirectories. Each distribution
    varies slightly, but certain standards exist to which they all conform. The standards
    keep us all safe.


    ![](img/82ece24d778fc2b746539fd81bd94284_233_0.png)


    If you''re interested in these standards, go to www.pathname.com/fhs and look
    at the latest version of the rules.


    Rather than flood you with everything at once, I start by talking about the base
    directories, mentioning the items you find in /. Table 11-1 lists what you might
    find in this base location. (This list can vary from distribution to distribution.)
    An asterisk (*) at the end of a description indicates that you shouldn''t mess
    with this directory unless you have a really good reason because it contains files
    that are very important to the functioning of your system.


    | Directory | Standard / Contents in Linux |

    | --- | --- |

    | /bin | Essential commands that everyone needs to use at any time* |

    | /boot | The information that boots the machine, including your kernel* |

    | /dev | The device drivers for all the hardware that your system needs to interface
    with* |

    | /etc | The configuration files for your system* |

    | /home | The home directories for each of your users |

    | /lib | The libraries, or code that many programs (and the kernel) use* |

    | /media | A spot where you added temporary media, such as floppy disks and CD-ROMs;
    not all distributions have this directory |

    | /mnt | Another spot where you added temporary media, such as floppy disks and
    CD-ROMs, along with networked drives and other items you aren''t permanently adding
    to your filesystem |'
