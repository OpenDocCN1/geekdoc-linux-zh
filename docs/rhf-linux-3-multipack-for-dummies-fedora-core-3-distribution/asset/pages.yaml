  md: '# # Chapter 21


    # # Ten Cool Uses for Knoppix


    **In This Chapter**


    +   - Rescuing files off a dead machine

    - Testing, testing!

    - Carrying around a portable Linux desktop

    - Installing Knoppix


    > > Until you walk a mile in another man''s moccasins you can''t imagine the smell.

    > — Robert Byrne


    LiveCDs are a great way to experiment with Linux in general, or a particular distribution
    of Linux, because many of them offer a live version for download or purchase.
    Because Knoppix is recommended as the LiveCD to use for pre-installation tasks
    in this book, I thought I would make sure to give you more fun things you can
    do with this CD-ROM so that you don''t feel like you wasted your time burning
    it! I won''t even do what husband suggested and make one of the ten entries being
    to use the disk as a frisbee, because I''d hate for you to feel cheated out of
    something truly cool.


    # # Rescuing Files off of a Machine that Won''t Boot


    One cool use for Knoppix is to recover the important files that might be left
    on a messed up computer that otherwise won''t boot. You can use Knoppix for this
    task whether those files are in Linux or Windows (even on an NTFS partition!).
    Then you can email the files to yourself — you can find a simple e-mail program
    in the main menu where you choose Internet:KMail — or attach a USB storage device
    to the machine and copy the data onto it.'
