  md: '# 108 Part I: Getting Your Feet Wet


    so you just add a c to make less groc and press Tab again to finish the autocompletion.
    This technique can save you a ton of typing, especially really long filenames!


    Most Linux distributions also keep a running history of the most recently used
    commands. To use this, press the up-arrow key on your keyboard. This action pulls
    up the last command you typed. As you continue to press the up-arrow key, you
    step through the most recently entered commands from the most to least. If you
    accidentally press what you''re looking for, use the down-arrow key to go back.
    When the command you want appears at the command prompt, press Enter to execute
    the command, or edit it and then press Enter.


    In Chapter 14, I cover the command-line environment in more detail.


    When you installed Linux, you added a graphical login by default. (This addition
    is true for all the versions discussed in this book.) Some versions of Linux give
    you the option of choosing a graphical or command-line login, which can cause
    a lot of confusion for folks who accidentally choose the command-line option.
    If you did so (or think you did) find yourself lost after the machine boots up,
    see Chapter 19.


