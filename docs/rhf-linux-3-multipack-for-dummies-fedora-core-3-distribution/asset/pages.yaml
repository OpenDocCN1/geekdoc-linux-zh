    # Laptop considerations


    The current distributions of Linux do very well on relatively new notebooks and
    laptops. (See www.linux-laptop.net for an excellent research site for how Linux
    gets along with various kinds of models.) If your laptop is a common brand, you
    should not encounter any problems installing Linux. However, laptops often contain
    WinMods. (Hardware labeled with the Win prefix is for Windows, not Linux.)


    If you plan on purchasing a laptop for Linux, check out the modem and other hardware,
    such as network cards, to make sure they''re not Win


    branded. If the built-in or default hardware for the laptop is Win labeled or
    you discover while researching the machine that contains a Win product even if
    it''s not properly labeled, you might be able to switch the offending hardware
    for a PC (or PCMCIA). Most current laptops contain at least one PC card slot so
    you can slip in a PC card modem, network card, or combo modem-network card. As
    long as you stick with a common brand of PC card, it should be able to work well
    with Linux.'
