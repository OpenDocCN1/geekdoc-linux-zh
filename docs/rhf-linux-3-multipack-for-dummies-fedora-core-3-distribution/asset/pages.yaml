  md: '# Part I: Getting Your Feet Wet


    # Custom boot disks


    You can protect against boot loader failures after you get your installation working
    by making a custom boot floppy, which you can use to boot the system if the boot
    loader on your hard drive gets corrupted. Many distributions have special programs
    or tools available to make custom boot disks for you, and will offer to make the
    disks during installation. To make a disk manually is mbbootdisk for Fedora and
    Mandrake, drakfloppy for Mandrake as well, for Slack and bind, floppy for Xwinds.
    However, a custom boot disk won''t help you if something goes wrong with the boot
    loader. It''s only good for the boot loader


    problems. After you manage to boot with the floppy, after a terminal window (Chapter
    14), type su -- become the root (administrative) user, and then double-check which
    boot loader your distribution uses. For LILO, type lilo -v to try repairing boot
    loader on your hard drive. For GRUB, look in the file /boot/grub/menu.list and
    look for a line in the beginning with the text “—”—for example, it may say boot=/dev/hda.
    Then grub-install where bootdrive is the hard drive listed in the boot line, such
    as grub-install. Now you can try rebooting with the floppy in the drive.


    Sometimes “bad things” can happen to your boot loader. One symptom of boot loader
    problems is a message saying that the operating system could not be found. Another
    hint is that the problem is your boot loader if you never see your boot menu,
    which is a screen that comes up during the boot process that lets you choose operating
    system and version to boot.


    The boot menu will look different from distribution to distribution.


    If you suspect a boot loader problem, see the section “Entering Rescue Mode,”
    later in this chapter. For another option, see the sidebar “Custom Boot Disks.”


    # Step 3: The boot loader (GRUB or LILO) loads the system kernel into memory


    Every computer (and electronic device) requires an operating system to run. The
    technical term for this operating system, or at least the kernel of it, is the
    kernel. The kernel is your maestro, orchestrating all the components of your computer
    and debating resources in a local and cooperative manner, the boot loader is the
    red carpet on the maestro.


    Many Linux distributions today actually up a GUI progress screen during the kernel
    loading and system initialization phase (after the kernel finishes loading, when
    it finishes the boot process). If you want to see what happens, you can typically
    click an icon or press a key. Just look for instructions on how to “see details.”'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Chapter 5: Booting and Stopping Linux 99


    This list shows some symptoms of a missing, incorrect, or corrupt kernel — all
    would occur after you either make your menu selection and press Enter, or just
    let the boot loader do its thing automatically without choosing anything:


    +   - The system freezes.

    - A few dots appear across the top of the monitor, and then the system freezes.

    - A few messages appear on the screen, and the final message reads kernel panic.

    - The system reboots automatically.


    You know when the kernel is loading because you start to see crazy text like:


    ```

    Uncompressing Linux... Ok, booting the kernel.

    audit(109256612,337:0): initialized

    ```


    Recovering from a kernel loading failure (aside from "operating system not found")
    — see previous section) is one of the more challenging issues in Linux. This is
    unfortunately not for the faint of heart. On the other hand, the failed kernel
    may be an updated one. If you have more than one Linux option in your boot menu,
    look at the version numbers for each of the options and choose the second. Doing
    so lets you boot into the last kernel and having a working system. You can open
    up www.google.com and search on the error messages or wait until the next kernel
    comes out and ignore the bad one for now.


    In the case your original install doesn''t properly start, you unfortunately don''t
    have a fallback kernel option. If this is your problem, recommend either contacting
    your distribution''s support address (if you purchased a commercial product) or
    joining the installation or beginner''s help list if you downloaded a free product.
    See Chapter 2 to find out where to locate help for each distribution discussed
    in this book.


    # Step 4: Control is handed over to init


    Once the kernel''s finished loading, it passes off the system initialization to
    a program named init. The init program is responsible for starting all services
    and programs. You can see these processes starting as they scroll up the screen
    with [OK] or [FAILED] on the right side of the monitor. If you see these lines,
    you know that your kernel has finished loading.'
  merge: -1
  pgno: 116
