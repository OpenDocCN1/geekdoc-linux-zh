  md: '# Chapter 11: Checking Out the Linux Filesystem


    If you partitioned your hard drives on your own, you know that you needed to specify
    a mount point for each partition — which is like an empty space in a puzzle, the
    outside partition or media can be plugged into the rest of the filesystem. In
    the case of a hard drive partition that''s part of your primary filesystem and
    at boot time, the mount point isn''t in the /mnt /media part of the filesystem.
    It''s an item in the root directory — maybe /boot /media or /usr or anywhere in
    your directory hierarchy (/usr/share). Later, when you''re working on the computer,
    you don''t need to know or care about whether the directories or files are all
    on one drive or are on multiple drives.

    You do not just your doing.


    The times you do need to know how Linux sees the hardware are when you''re trying
    to add new drives, install the machine without using automatic partitioning, or
    access temporary media. Table 11-4 lists a common breakdown of popular hardware
    designations. Note that these designations aren''t in /mnt /media; they''re in
    /dev. They''re the actual device driver shortcuts — which point to the real drivers.
    These names are typically used for convenience so you don''t have to remember
    exactly which driver to deal with.


    | Table 11-4 Common Drive Designations |

    | Designation | Description |

    |---|---|n| /dev/cdrom | CD-ROM drive; if you have more than one, then you may
