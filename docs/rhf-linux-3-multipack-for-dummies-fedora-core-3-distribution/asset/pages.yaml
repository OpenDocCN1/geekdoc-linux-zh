    # ## Viewing the Contents of a Text File


    Almost all configuration files in Linux are text files. In addition, many pseudoprograms
    (called shell scripts), all HTML documentation, and many other items in your system
    are text files. Fortunately, if you just want to see what''s in a text file and
    don''t want to do anything to it, you can use three command-line commands to view
    text files: `cat`, `less`, and `more`. I would bet that you will come to love
    them.


    Yes, that first command is `cat` and it''s taken from the word *concatenate*,
    which means "to bring together to end" — you can use the `cat` command on multiple
    text files to have their text joined, one file''s contents directly after another''s.
    Typically, you use this command in the Linux world in the format `cat filename`,
    where the contents of the file `filename` are displayed on the screen. For example,
    if you create the short text file `greetings` and then type `cat greetings`, you
    see the following:


    ```

    $ cat greetings

    These are the contents of the greetings file.

    Meow!

    $

    ```'
  merge: -1
