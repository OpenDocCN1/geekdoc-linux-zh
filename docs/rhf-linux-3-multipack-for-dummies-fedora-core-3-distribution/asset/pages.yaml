    # Removable hard drives


    One way to handle multiple operating systems is the removable rack hard drive.
    The installation places a special carriage into one of your computer''s hard drives.
    This setup can be installed in most computers by an experienced world or a qualified
    technician.


    second hard drive in the machine, a removable rack hard drive is a great alternative.
    You''ll need to make sure that your existing hard drive can fit in the rack, as
    well as the new one, and it''s wise to buy more than one chassis (used to slide
    the drive into the rack) so that you can just leave your drives in the chassis
    when they''re not in the machine.


    After this component is installed, you can place individual hard drives into the
    carriage, pulling them in and them out as you might do to just yank one out with
    a CD-ROM—although you wouldn''t want to yank one in the middle of doing something
    on your machine! Using a removable hard drive setup allows you to separate your
    Windows and Linux drives. When you''re using Windows and switch to Linux, you
    shut down Windows and pull out the drive. You replace it with the Linux drive
    and boot as though the Linux drive was always there.


    For more information, see PC Hardware in a Nutshell by Robert Bruce Thompson and
    Barbara Friction Thompson, from O''Reilly & Associates.


    If you need to upgrade hardware, I strongly recommend that you seek assistance
    or have a technician install an additional hard drive or removable rack setup
    for you. Improper handling of computer components can damage your computer. In
    addition, you must keep safety in mind when working with electrical components.


    If you''re nervous about managing multiple operating systems and don''t have room
    for a


    ![](img/82ece24d778fc2b746539fd81bd94284_38_0.png)


