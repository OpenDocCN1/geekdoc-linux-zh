  md: '# 102 Part I: Getting Your Feet Wet


    # Don''t Just Turn Off the Machine!


    When you''re not tapping the keyboard or clicking buttons, Linux is still running
    around in the background and doing lots of housekeeping chores. Some of these
    chores may involve swapping cached data to and from the fixed disk — a geeky way
    of saying it''s actually jotting down things onto your hard drive that did before
    it had been making sure to remember in RAM. When you shut off the power out of
    the blue, anything the computer was remembering but hadn''t written is lost, kind
    of like when you or I fall asleep without a to-do list for the next day.


    If you''re to Windows 98, you need to recondition yourself from shutting off the
    power when you''re finished. For one thing, many Linux users leave their computers
    when they''re not using them; they just log out of their accounts so that no one
    can mess with stuff and shut off the monitors draw a lot of power. When you decide
    to turn off your Linux machine, for whatever reason, you must shut down the computer
    in an orderly manner.


    You can use one of these methods to shut down Linux properly:


    +   - If you''re in the GUI, log out of your account using the main menu''s Log
    Out and then click the display manager option that says, strangely enough, Shut
    Down.


    +   - If you have a command prompt open, enter the halt command at the shell prompt
    (#) followed by the root password, and Linux shuts itself down and tells you it''s
    all right to turn off the machine.


    +   - If you have a command prompt open, enter the shutdown -f now is the most
    traditionally accepted method. The shutdown command allows you to send messages
    to logged-in users and determine how long the shutdown takes place. Another method
    is the poweroff command, which is just alias to the previously mentioned halt
    command.


    If you accidentally cut the power to your Linux box, take heart; all is lost.
    More often than not, you can reboot your computer and pick up where you left off.
    However, you may have to pay for your error by waiting during a quick file system
    check while the machine makes sure that nothing was damaged. This process is similar
    to the one in Windows, where if you power off incorrectly, the operating system
    may need to scan its hard drives to make sure that everything is okay.'
  merge: -1
