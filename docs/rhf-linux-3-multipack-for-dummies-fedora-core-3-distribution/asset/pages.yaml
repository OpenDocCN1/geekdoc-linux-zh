    # Controlling and adjusting your firewall


    Even better (but just as essential) than turning off unnecessary services is to
    make that you have a firewall in place. A firewall is like putting a bunker under
    your house. You would then have openings that only fit wanting to do certain kinds
    of things. Friends could fit through one door, family another, and package deliveries
    to another.


    In computer networks, each of the services discussed earlier always comes through
    the same door (port, in computer-world luogo). You use firewalls to prevent anyone
    from being able to so much as touch a door or port unless you explicitly set it
    up that they can do. This technique is especially important if you''re on a cable
    network (Chapter 8), where there''s always some overactive jerk out there using
    his computer to knock on every other computer on the network''s doors to see where
    it get in.


    You probably did some basic firewall setup during installation. If you want to
    make changes, do the following:


    +   - Fedora: Choose Applications-System Settings-SecurityLevel(see 13-2).


    +   - Knoptix: None. But, then, what could change on a system running from CD-ROM?
    Not much.


    +   - Linpierre: From the main menu, choose Programs-Utilities-CNR Firestarter.
    This tool helps you set up your firewall and is installed under the Utilities
    menu.'
