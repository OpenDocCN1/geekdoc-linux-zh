    # Updating Your Software


    In the last couple of years, updating your operating system and software in Linux
    has become easier and easier. Each Linux distribution has its own way of handling
    updates, so I cover how to update each one in its section. The cool thing is that
    you''re actually updating your operating system and its software all at once.
    Be sure to be connected to the Internet before you try to update!


