  md: '# # Chapter 9


    # # Using the Internet


    **In This Chapter**


    +   - Browsing the Web

    - Reading newsgroups

    - Checking and sending e-mail

    - Sending instant messages


    > Give a man a fish and you feed him for a day; teach him to use the Net, and
    he won''t bother you for weeks.

    — Anonymous


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow access to information
    across the Internet. Linux, along with its related Unix operating system — has
    long supported and worked with the Internet. Practically all the different services
    available on the Internet are available from your Linux desktop.


    When you install Linux (see Chapters 3 and 4), one or more web browsers, mail
    programs, and instant messaging tools are placed upon your new system. In this
    chapter, I introduce you to some tools you can use to access different services
    on the Internet, such as accessing Web sites, using e-mail, investigating newsgroups,
    and utilizing FTP — assuming that your Internet connection is configured (see
    Chapter 8).


    # # Meet the Popular Browsers


    Many people attribute the explosive growth of the Internet to the graphical web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in plain old
    text, which held little attraction for those people who like pretty pictures.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 166 Part II: Internet Now!


    A number of graphical Web browsers are available for Linux. The default browser
    included with each of the distributions covered in this book:


    +   - Fedora: Firefox (www.mozilla.org/products/firefox), based on

    Mozilla


    +   - Knppix: Conqueror (www.conqueror.org), though Mozilla is also

    included by default


    +   - Linspre: Customized Mozilla


    +   - Mandrake: Conqueror, though Mozilla and Epiphany (www.gnome.org/

    projects/epiphany, which is based on Mozilla as well) are both

    included by default


    +   - SuSE: Conqueror


    +   - Xandros: Mozilla


    You can add the browsers that aren''t included by default to most of

    these distributions (see Chapter 12). Another popular browser in Linux is

    Opera (www.opera.com).


    Many browsers are based on Mozilla, aren''t they? And Mozilla is a branch of

    Netscape. Because Mozilla is included with so many of these distributions

    (and can be easily added to the), I focus on it here. Mozilla is actually

    more complex than its Epiphany and Firefox love-children, and you''ll

    find other options to easily figure out — and Epiphany and Firefox also

    work very similarly to Mozilla. In fact, Firefox doesn''t have the same huge

    pile of configuration routines in its Preferences dialog box because it doesn''t

    have means to contend with.


    Mozilla, Firefox, and Opera are all available for Windows and OS X as well!


    ![](img/82ece24d778fc2b746539fd81bd94284_183_0.png)


    # Configuring Mozilla


    You can start surfing right now, if you want. You don''t need to customize your

    browser. However, you may want to take a moment to tell Mozilla your prefer-

    s, as the default Web site to show when it starts up, what font sizes

    to by default, what colors to use, and many other options.


    The following steps introduce you to the Preferences window, where all the

    Mozilla configuration parameters are stored:


    +   1. Start Mozilla.


    How you start Mozilla depends on which distribution you''re using.

    Typically it''s either a shortcut on your Panel (Knoppix, Linspre,

    Xandros) or is available in the Internet portion of your menu be.

    patient; Mozilla is a large program, and it usually takes a few seconds

    to start up.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Chapter 9: Using the Internet


