- img_proc: true
  md: 'Newsgroups tend to be in hierarchies, so when you see a triangle to a listing''s
    left, click it to expand and see the subgroups inside that group. The section
    comp.os.linux (so that comp.os*:linux) contains a number of Linux newsgroups you
    may be interested in.


    +   4. Click OK.


    You''re now back at the Manage Newsgroup Subscriptions dialog box.


    # Reading news


    To read your news after you''ve configured Mozilla for this purpose (by following
    the instructions in the previous section):


    +   1. From the main Mail & Newsgroups dialog box or the Manage Newsgroup Subscriptions
    dialog box, click the newsgroup you want to read.


    The Download Headers pop up with a message stating that need to load headers (for
    each post, the name of the person who posted and the subject assigned to the post)
    for this group. If it''s a busy newsgroup or it''s the first time you read this
    one, you may be prompted for the number of headers you want to download.


    +   2. If you are asked how many headers to download, select either All Headers
    or specify how many headers to download.


    The default of 500 is a good number. If you don''t want to see any of the others
    (not a bad idea when you''re just starting in a group, or you''ll never get to
    the new stuff), click the Mark Remaining Headers as Read checkbox.


    +   3. Click Download.


    The program goes to the news server and grabs the basic information about the
    news posts. You can now scroll through the messages and read or contribute to
    this newsgroup by clicking one of the headers. Seeing what your peers are doing
    around the world is educational, if nothing else!


    > Be aware of the written and unwritten rules for newsgroup etiquette, which vary
    from group to group. I recommend that you read the Frequently Asked Question (FAQ)
    page for the newsgroup and lurk for a while before posting questions and comments.


    ![](img/82ece24d778fc2b746539fd81bd94284_194_0.png)


