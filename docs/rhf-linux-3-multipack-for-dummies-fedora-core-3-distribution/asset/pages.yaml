    # Recognizing some special Linspire features


    One of the most talked about special features of Linspire is its CNR (Click and
    Run) Warehouse. This online store allows you to surf through more than a thousand
    software programs and purchase, download, install them with just a few clicks.
    Even better, if you subscribe to the CNR service — you get a free one-year membership
    when you purchase Linspire — a lot of the items in the Warehouse are free. (You
    don''t need to keep your CNR membership up to date to keep using the software
    you downloaded; after you''ve got it, it''s yours.) I cover how to add software
    using this in Chapter 11.


    Another cool aspect of some versions of Linspire is the audio/visual tutorials.
    After your installation is complete, the tutorials immediately launch to start
    you through how to use the system. You can stop them and come back to them at
    any time.


    ![](img/82ece24d778fc2b746539fd81bd94284_87_1.png)'
