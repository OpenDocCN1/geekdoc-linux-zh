    In Chapter 2, I explain that Knoppix is included on the DVD-ROM that came with
    this book. You can boot with the book''s DVD-ROM and just press Enter from your
    main menu to boot Knoppix Linux, skipping any need to install anything onto your
    computer.


    ![](img/82ece24d778fc2b746539fd81bd94284_83_0.png)


    If the DVD-ROM included with this book doesn''t work, see Appendix B. If you don''t
    have a DVD-ROM drive, you can download the CD-ROM image to burn onto your CD by
    going to: knnoppix.net/get.php.


