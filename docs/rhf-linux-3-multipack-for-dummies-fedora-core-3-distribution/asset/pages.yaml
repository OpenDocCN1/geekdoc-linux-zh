  md: '# 214 Part III: Getting Up to Speed with Linux


    | Table 10-1 (continued) |

    | Label | Type | Description |

    | c | Character device | The item is a driver (control program) for a piece of
    hardware that transmits data, such as a modem. |

    | d | Directory | The item is a container for files, also referred to as a folder
    in some operating systems'' lingo. |


    In addition to this, you find lots more different file types out there in the
    Linux world. By types, I''m not referring to extensions, such as .exe or .doc.
    Linux sees everything within its file system — even directories and hardware like
    your monitor as “files.” As a result, assigning a type to a file is merely a Linux
    machine''s way of keeping track of what''s.


    The main thing Windows users in particular want to know when they move to Linux
