  md: '# 100 Part I: Getting Your Feet Wet


    The main problems you may encounter with services (programs that run in the background)
    that fail to start properly, as is indicated by the [FAILED] status during the
    boot process. Many of these services don''t keep you from logging in and using
    your system. Services usually fail because of misconfigurations or unsupported
    hardware drivers. Sometimes a service takes a long time to start up, so you may
    need some patience while you wait it out. You can use the techniques described
    in Chapter 12 to shut off the rescue mode if it''s being a pain. If the machine
    can''t boot because of this service, you''ll need to access your distribution''s
    rescue mode to shut off the service. Rescue mode is covered in the next section,
    Entering Rescue Heavy-duty system repair tends to happen in rescue mode, which
    is a special boot selection that simulates your hard disk in what is called a
    RAM disk, holding the files entirely in memory. The benefit of this is that you
    perform necessary system surgery without requiring utilities of the installed
    system; everything is part of the rescue disk. The drawback is that this is a
    purely command-line interface, and you really have to find your way to work around.


    Appendix A contains a list of Linux commands, roadmap to try to help you. Chapter
    20 addresses, among other things, how to fix your boot loaders from if your problem
    is with the boot loader, and how to track down the error messages your kernel
    might have left behind. You may also be able to find helpful tips by reviewing
    your distribution''s documentation and help forums.


    > Knoppix is quite popular to use for system rescues because it''s a whole distribution
    on a CD. (For more on using Knoppix and live CDs, see Chapter 2.) Chapter 20 is
    for more on using Knoppix for things like rescuing Linux (and even Windows) systems.


    Just about every Linux distribution includes a rescue mode. Due to space restrictions,
    I have only to cover everything Fedora''s rescue mode in step-by-step detail,
    but at the very least, there''s a quick reference to how to find the rescue mode
    in the distributions covered in this book:


    +   - Linspace: The CD contains a rescue mode. When the installer starts, use
    your arrow keys to select Diagnostics and then press Enter.

    - Fedora: The DVD, or the first installation CD, contains a rescue mode that you
    can enter by typing linux at the installer''s boot prompt.

    - Mandrake: The first CD contains a rescue mode. When the installer starts, press
    F1 to access the command prompt, type rescue, and press Enter.


