  md: '# Part IV: Getting Things Done


    # Commercial Software


    A growing number of commercially available tools let you work with anything from
    Microsoft Office to your Windows games under Linux. Mind you, ultimately the Linux
    user''s goal is not to use any of these extra layers — but in the meantime, it''s
    nice not to be inconvenienced. I''ve reviewed and at least used one of these softares
    (often more than once over the years), I''m not just going by their Web sites.


    ![](img/82ece24d778fc2b746539fd81bd94284_377_0.png)


    Many of these vendors offer server, as well as desktop products. I''m focusing
    on the desktop. For more about their server products, check out their Web sites.


    # CodeWeavers


    CodeWeavers (www.codeweavers.com) provides an excellent product that I use from
    time to time: CrossOver Office. This program allows you to use Microsoft Office
    (along with a growing number of office applications) directly over Linux. It also
    comes with a hefty number of plug-ins (see Figure 19-1) that you might miss when
    it comes to Web Surfing. It''s a bit of jarring to run Microsoft Word and Windows
    Media Player under Linux at first — because there''s no native (without special
    software) way to do this — but it''s certainly handi.


    Figure 19-1: The CrossOver Office Install Software dialog, in Xandros 2.5.


    ![](img/82ece24d778fc2b746539fd81bd94284_377_1.png)'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Chapter 19: Windows-Only Media Formats and Programs 361


    What I most appreciate about CodeWeavers (and all these companies, really) is
    that they are very upfront about what works really well, what works except for
    a few features, and what works not so well. All you have to do is check their
    Web site. For those who seem to scream "piracy" when it comes to Linux, you actually
    do to own the programs you want to run (say, Microsoft Office) and install them
    through CrossOver Off of your original CDs or DVDs. However, you do not have to
    have the version of Microsoft Windows software run under. CodeWeavers has built
    a re-implementation of the necessary Windows functionality under the hood.


    ![](img/82ece24d778fc2b746539fd81bd94284_378_0.png)


    Are you iPod and iTunes junkie? There''s no Linux version of iTunes although,
    but CrossOver Office lets you run under Linux


    A plus to CodeWeavers CrossOver Office is that the applications run in windows
    just like every other program on your machine. A minus is that not all Windows
    software is supported, because hooks have to be built under the head for each
    new piece of software.


    ![](img/82ece24d778fc2b746539fd81bd94284_378_1.png)


    CrossOver Office comes with the Xandros Deluxe desktop (available for installation
    through the Xandros Networks, which is available for Chapter 12) and is available
    for purchase from the Xandros store for other Xandros users.


    # Win4Lin


    Another option is Win4Lin from NeTraverse (www.nettraverse.com/). Win4Lin actually
    offers you a platform within which you install Microsoft Windows (so you have
    CDs handy) and then run programs on top of it. As of this writing, Win4Lin supports
    Windows 95, 98 (see Figure 19-2), and ME. Soon, it will support newer versions
    of Windows as well.


    A plus to Win4Lin is that it supports a full range of Windows software. A minus
    is that it runs in its own separate window, so its applications aren''t integrated
    into the rest of your desktop. You also have to keep your Windows operating system
    CDs around because you need to install the operating system into Win4Lin — though
    you can then put them in storage after you''ve done the installation. You also
    end up having a special kernel (boot session) to run Win4Lin 5.0, so if you hate
    rebooting, this program may not be the solution for you — though you could just
    make this your default boot option.


    ![](img/82ece24d778fc2b746539fd81bd94284_378_2.png)


    Win4Lin is available for purchase for Linsphere users through their Click And
    Run Warehouse; from the main menu, choose Programs:Utilities:CNR More:Win4Lin.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# Part IV: Getting Done


