  md: '# 146 Part I: Getting Your Feet Wet


    You can use many of the tools discussed in this chapter at the command prompt,
    not all of them. YaST actually has a full command-line version in case you''re
    not using a GUI!


    Finally, you can look in one place. From the main menu, choose System-Configuration:


    +   - OpenOffice.org Printer Administration: See Chapter 17 for more about this.

    - SaX2: The base GUI configuration tool.

    - YaST: The system configuration tool.


    # Xandros tools


    Xandros offers a customized version of the KDE Control Center called the Xandros
    Control Center, available by choosing Launch Control Center (see Figure 7-9).
    Both your system-wide and your individual look and feel settings are available
    in this tool.


    ![](img/82ece24d778fc2b746539fd81bd94284_163_0.png)


    As you can see, the cool thing about learning one Linux distribution is that you''re
    learning useful things to help you survive another version of Linux. Remember
    that all of these distributions are relatives, like cousins. Go out there and
    have fun tweaking your system!'
