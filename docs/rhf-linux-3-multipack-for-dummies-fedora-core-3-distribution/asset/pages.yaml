  md: '# Chapter 17: Word-Processing and More with OpenAPI.org


    # Menu bar


    Along the top of the window is the menu bar, something you should be used if you
    typically work in Microsoft Windows. OpenAPI.org Writer has all the features you''d
    expect from a modern word processor. It has too many menu options to cover in
    depth, so I will give you a (nonexhaustive) summary of what you find on each major
    menu:


    +   - File: The usual Open, Save, Save As, Print, and Print Preview (under the
    Page Preview) commands, along with a set of wizards (under the term AutoFile)
    plus the ability to send documents through e-mail, create templates, and create
    Web pages


    +   - Edit: The usual Select All and Find commands, along with change tracking,
    document merging, and document comparing


    +   - View: The usual Zoom functions and toolbars, with the abilities to show
    or hide formatting characters, to see what the document would look like a Web
    page, and to access your database information


    +   - Insert: The usual page breaks and special characters, along with indexes,
    bookmarks, headers, footers, and cross-references


    +   - Format: The usual character, paragraph, and page settings, with styles,
    autoformatting capabilities, and columns


    +   - Tools: The usual spell-checking and thesaurus entries, in addition to hyphenation,
    autocorrection, an image gallery, and a bibliography database


    These menus have more features than what is listed here. Go through and take a
    look; you may find a new favorite feature in somewhere.


    # Function bar


    Directly below the menu bar in a default setup is the function bar, which you
    can remove at any time using the View menu. This series of icons allows you single-click
    access to the most commonly used File and Edit features, among others. Table 17-2
    lays out, from left to right, what you find on the default Function bar. The extensible
    items can all be opened to show a further set of options.


    | Table 17-2 | The OpenAPI.org Writer Function Bar, from Left to Right |

    | Button or Item | What You Can Do | Extensible? |

    | New | Open new documents of various types. | Yes |

    | Open File | Open an existing file for reading or editing. | No |


    (continued)'
  merge: -1
