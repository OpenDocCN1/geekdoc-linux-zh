  md: '# Making a Boot Floppy (if Needed)


    If you''re having trouble booting from the DVD or CD, you can start the installation
    from a floppy disk. Because there is no boxed set for Fedora, however, you''ll
    have to make this disk yourself. You can find the disk image file — a fancy way
    of referring to a snapshot of a floppy disk''s contents — or first CD in the /images
    directory. You can''t just copy this image onto the floppy. You have to use a
    special program to make sure that every part of the image is written exactly correctly.
    Assuming you''re using Windows right now, the program I use for this purpose is
    RAWWRITE, which you can download from http://uranus.it.swin.edu.au/-jn/linux/rawwrite.htm.


    To make a boot disk on a Windows system using Fedora Core 3 and the DVD (or CD)
    that came with this disk, follow these steps (I focus on Windows XP here, with
    notes for other users of Windows):


    +   1. Point your Web browser to http://uranus.it.swin.edu.au/-jn/linux/rawwrite.htm.


    +   2. Click the Latest Binary release (at the time of writing it''s the first
    link on the page, rawwritewin-0.7.zip) to download it.


    +   3. When asked what to do with this file, click Save.


    +   4. When the Save As dialog appears, navigate to where you would like to save
    the file and click Save to download the file.


    This is a small program, so for dial-up users, it shouldn''t take all day!


    +   5. Once the program is saved on your machine, open your floppy browser and
    navigate to where you have saved it.


    If you used Windows XP, it''s in the defaults in the My Documents\Downloads folder.


    +   6. If you are using Windows XP or another version of Windows with a program
    like WinZip (http://www.winzip.com/) installed, double-click the rawwritefile
    to open the archive.


    If you don''t have a program that can open this file, download WinZip and install
    it on your machine. You can then return to Step 6.


    +   7. If you''re using WinZip, extract the files into the same folder or a new
    one and skip to Step 9. If you''re using XP, click Extract All Files to the left
    of the folder listing.


    This action opens the Extraction Wizard.


    +   8. Follow through the brief wizard, telling it where to extract the files.


    When finished, you end up in a folder containing the extracted files.'
