    # Starting Programs from the Shell


    The most obvious, but perhaps not so apparent, use of the shell is to start other
    programs. Most utilities you use in Linux are separate and distinct executable
    programs. Users need a method to start these programs. In the GUI, you can associate
    an icon with a particular program, and the graphical environment contains the
    intelligence to start the program. Note that programs require information from
    environment variables, which are part of the shell environment. (I discuss environment
    variables in more detail in the section "Working with Variables", later in this
    chapter) For this reason, the GUI often finds the intended program via the bash
    shell—although the GUI does its best to hide this detail from you.'
