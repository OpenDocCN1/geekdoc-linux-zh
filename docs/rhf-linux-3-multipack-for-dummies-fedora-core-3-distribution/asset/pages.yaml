  md: '# Chapter 9: Using the Internet 171


    Underneath Navigator, you can also check out:


    +   **History**: The History box enables you to designate how many days you want
    your browser to remember where you''ve been. You can click the Clear History button
    to clear the history manually at any time, or click the Clear Location Bar in
    this same dialog box to remove the list of sites it suggests whenever you''re
    trying to type a new URL.

    **Languages**: No, this option doesn''t automatically translate the content of
    a Web page into the preferred language. Rather, some Web authors provide their
    Web pages in more than one language. If it''s an option, this one merely lets
    you decide language preference.

    **Helper Applications**: In this task, you designate applications to interpret
    special file types. An example is a .pdf file, which requires the Acrobat Reader
    in order to view it. You can specify the application and optional arguments that
    need to be passed to the program.

    **Smart Browsing**: With this option, you can set the characteristics of the What''s
    Related tab, which is on the Sidebar (located in the left pane of the browser
    window). The What''s Related tab has a drop-down menu listing sites that may be
    related to the displayed site.

    **Internet Search**: Search engines have become an integral part of Web browsing.
    To accommodate searching, Mozilla can integrate your favorite search engine into
    your browser. You can click the drop down under Default Search Engine and choose
    your preference.

    **Tabbed Browsing**: You can customize how your tabbed browsing functions, if
    you like to play with this.

    **Downloads**: Mozilla provides you with a helpful download manager that lets
    you watch the progress of multiple files, all in a single window. You can even
    see the last items you downloaded.


    # Other preferences


    +   **Composer**: If you intend to build Web pages, you may want to check out
    Mozilla''s Composer feature and its preferences. Of course, other Web page-building
    programs are out there. Your version of Linux probably offers one or more of the
    following: Bluefish (http://bluefish.openoffice.nl/), NVu (http://www.nvu.com/),
    Quanta Plus (http://kdeweb.org/), or others.

    **Mail & Newsgroups**: If you intend to use Mozilla for your e-mail and newsgroups
    (the default in Linux and Xandros), you can set up comments and other look-and-feel
