    # Object bar


    The Object bar is directly below the function bar in a default OpenOffice.org
    setup. As usual, you can remove the object bar at any time by Viewing the menu.
    This series of icons allows you to click buttons and expand drop-down list boxes
    that represent standard word-processing functions, such as styles, fonts, size,
    and formatting instructions. Most features on this bar are identical to what you
    see in modern word processors. The button for paragraph background formatting
    is the only one that''s particularly unusual.'
