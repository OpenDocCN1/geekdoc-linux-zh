  md: '# Chapter 20: Ten Troubleshooting Tips


    # # I Don''t Want to Boot into This!


    Are you booting into the command-line environment when you want to use only the
    GUI? Or are you finding that you''re already booting into the GUI and you would
    rather boot to that nice, clean, black-and-white command-line screen? You''re
    not stuck with either of these options. You can change them at any time.


    ![](img/82ece24d778fc2b746539fd81bd94284_392_0.png)


    You can press Ctrl-Alt-F# to change out of the GUI to a command line terminal
    at any time and Alt-F7 or Alt-F8 to switch back.


    # ## Changing your boot environment "permanently"


    The **permanently** is in quotes in the heading because you can, of course, go
    back and change this setting later. If you want, *Permanently* just refers to
    the fact that you have made this change, every time you boot the system, it automatically
    gets you to the preferred environment until you change it.


    ![](img/82ece24d778fc2b746539fd81bd94284_392_1.png)


    You can''t make this change in Linux or Xandrus unless you want to boot into single-user
    mode, which is basically "safe mode" and not much use. Well, okay, you, but you
    would need a techie friend to set up a bunch of stuff for you. Linux and Xandrus
    assume you don''t want to do this. You can''t do this in Knopix either, but then
    it''s a Live CD so you''re not doing anything to it.


    To make this change in Fedora, Mandrake, or SuSE, you need to edit what''s called
    a runlevel. Fortunately, all three of distributions use the same runlevel settings,
    so the instructions are the same for all of them:


    +   1. **In the GUI, open a command line terminal.**

    If you''re not sure how to do so, see Chapter 14. If you''re not in the GUI and
    already logged in, type `su` to become the root user.

    2. **Type cp /etc/inittab /etc/inittab.old to make a backup.**

    Now, if something happens while you''re editing the inittab file, you can always
    restart fresh with the old version.

    3. **Open the inittab file in your preferred text editor.**

    Some Linux text editors are covered in Chapter 16.

    4. **Scroll down until you find a line similar to the following:**


    ```

    id:5:initdefault:

    ```'
  merge: -1
