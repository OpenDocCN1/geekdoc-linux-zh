- img_proc: true
  md: '# 154 Part II: Internet Now!


    Some ISPs provide their own proprietary software that you must install on your
    PC to connect to the Internet. The software they provide is likely to run only
    on Windows. Several free dial-up services do not work with Linux because of this
    fact. The proprietary software meddles with the operating system to ensure that
    banner advertising isn''t hidden or that you dialed in


    If you''re shopping around for an ISP, consider these questions:


    +   - Can you get dial-up numbers across the country and around the world? If
    you travel often and need Internet access from different cities, this service
    is a handy money (headache) saver.


    +   - Does it provide technical support for Linux? If you''re running Linux, this
    consideration is an important one. However, it doesn''t have to be a deal breaker.


    +   - Can you get a recommendation? Ask a friend. An ISP''s best friend is an
    endorsement from a satisfied customer.


    +   - Will you have trouble dialing? Although a subscriber-to-line ratio of 7-to-1
    (an average of seven or fewer subscribers per line) or better isn''t an entirely
    accurate measure of how often you''ll get busy signals, it''s probably the easiest
    measure for consumers.


    # Getting Information You Need from Your ISP


    Most reputable ISPs provide you with a customer information sheet after you sign
    up for your services. This sheet should include the following information at the
    minimum:


    +   - Local telephone dial-in numbers

    - User login name

    - User login password

    - E-mail address

    - E-mail outbound host or Simple Mail Transport Protocol (SMTP) server

    - E-mail inbound host or Post Office Protocol (POP) server

    - News host

    - Whether your computer address will be

    - Static: You always have the same IP address. Static addresses are more common
    for servers than for desktops. If you''re using static,'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Chapter 8: Connecting to the Internet


    your ISP needs to give you your nameserver IP addresses, your gateway address,
    the network address, and the netmask. This information should be all on the customer
    information sheet.


    +   * Dynamic: Your IP address changes each time you connect, or at regular intervals.
    On desktops, you just don''t need to have the same address, and it makes life
    easier on ISPs. It makes life easier for computer like laptops, which get moved
    around often from network to network. If you''re using dynamic addressing, you''re
    told that you need to connect using DHCP.


    With this information, you can establish an Internet connection by using your
    Linux system.


    # Hooking Up


    Fortunately, the Linux vendors provide tools that reduce the complexity of hooking
    up with Linux. It''s not that networking has changed, but rather many of its details
    have been hidden so you just have to click here and press a key. Not long ago,
    configuring dial-up networking (in particular) on a Linux machine was nothing
    short of debugging a defective Rube Goldberg contraction.


    The Internet configuration tools available in the distributions covered within
    this book are:


    +   * Linsp: Double-click the Internet Connection Tools on your desktop to open
    the Connection Tools folder. Double-click the appropriate icon to ate from.


    +   * Fedora: From the main menu, choose System-Network to open the Network Configuration
    dialog box. Click New to start the Configuration.


    +   * Mandrake: From the main menu, choose System-Configuration to Configure Your
    Computer to open the Mandrake Control Center. Choose Network & Internet-New Connection
    to access the Connection Creation wizard.


    +   *SE: From the main menu, choose System-YaST to open the YaST configuration
    tool. On the left, select Network Devices. On the right, choose the type of hardware
    you have in order to start configuring your setup.


    +   * Xandros: From the main menu, choose Control Center to open the Xandros Control
    Center. Click the plus next to Network to expand that menu and then choose Internet
    to open your connection listing — you might need to click the Administrator button
    to enter your root password. Click New to launch the Connection Wizard.'
