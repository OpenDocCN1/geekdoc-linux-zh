    A separatePackage window appears.


    +   3. When asked for your root password, type it and Enter.


    Within the secondary window, you can watch the update process. Once you see the
    text RESULT=# (where # stands for any number), the update is complete. You''ll
    also see the word Done a bit above it.


    +   4. Click Cancel to close the secondary window.


    It takes a minute or so for KPackage to process the package lists it just downloaded.


    +   5. In KPackage, choose Special: Apt: Debian: Upgrade.


    The Update selection just grabbed the latest list of available packages. Choosing
    Upgrade now grabs all the updated software and installs it. A secondary window
    appears, and you can watch what''s happening in first. KPackage figures out what
    software it needs to update.


