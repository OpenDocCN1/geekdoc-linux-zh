  md: '# 176 Part II: Internet Now!


    # # Subscribing to newsgroups


    Read newsgroups, you first must subscribe to the ones you want to check out, and
    then you have to load their new posts (individual messages). To activate these
    subscriptions:


    +   1. Click your newsgroup server in the list on the left (The Local Folders
    entry beneath it is your e-mail interface).


    The settings and configuration screen appears, as shown in Figure 9-6.


    +   2. Click Manage Newsgroup Subscriptions.


    The Subscribe dialog box appears. The first time you open this dialog box, you''re
    in a wait for an index of all the newsgroups downloads to your browser. Tens of
    thousands of newsgroup titles are out there, even though the browser is downloading
    only the newsgroup names, the process takes some time. The status bar at the bottom
    of the dialog box indicates progress.


    +   3. After all the newsgroup titles have loaded into your browser, scroll through
    the list for topics of interest. When you find a newsgroup you want to subscribe
    to, click in its Subscribe box in the listing to put a checkmark in.


    ![](img/82ece24d778fc2b746539fd81bd94284_193_0.png)'
