  md: '# Chapter 7


    # Configuring Linux


    In This Chapter


    +   - Creating user accounts

    - Setting up your printing

    - Finding cool configuration tools


    > The doctor can bury his mistakes but an architect can only advise his client
    to plant vines.


    Frank Lloyd Wright (1869–1959)


    Unlike both the architect and the doctor, the computer user isn''t stuck with
    configuration mistakes. You can tweak and change things until you''re happy with
    them! Because the first a lot of people to do with a new system is get it up just
    right. I start by finding out about user accounts and why I am so insistent that
    you create a special one for your own personal use in Chapter 3. Then, you find
    out how to set up your machine to talk to your printer. I also show you where
    the cool configuration tools are for your distribution that you can get down to
    serious customization.


    # Accounts Great and Small


    Linux is a multiuser operating system. It allows everyone to have a unique account
    and allows more than one user to log on at the same time. Typically, even if you''re
    the only user on the system, you need an account of your own that isn''t the root
    user''s. (I explain why in the next section). In addition, having multiple accounts
    is especially fun for experimenting with different user setups. That way, you
    can create a main account to be more careful with goofing around account to completely
    mess around with.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 134 Part I: Getting Your Feet Wet


    # Avoiding root


    The root user, also known as the superuser or just root, has access to everything
    and everything on your machine. There is no blocking root for a directory, file,
    command, or device. Because of this factor, many Linux beginners figure that they
    may well use the root account all the time because it''s convenient.


    However, for lots of reasons, you shouldn''t use the root account for everyday
    use:


    +   - You don''t always need root-level access.


    +   - Root-level access is as much a curse as it is a blessing. If you mess up
    as a regular user, you only mess the stuff in your account. If you mess up you
    can wipe out everything—all the files on your entire Linux system! That''s why
    Linux distributions like SuSE give you a nasty background when you use the root
    account (in the GUI) as a dire warning. Mandatory doesn''t even give you one of
    the options to select in the GUI login. SuSE doesn''t give you a graphical option
    for root, but you can type it into the Username text box.


    +   - Don''t think you can wipe out everything? Many experienced Linux administrators
    tell horror stories about the day they made a fatal typo or weren paying attention
    to what they were doing and completely destroyed an installation.


    +   - If you send e-mail or news posts as root for anything other than serious
    administrative business, people think that you don''t know what you''re doing
    or are showing off.


    +   - Root comes with too much temptation. The superuser can read other people''s
    e-mail messages and files, which introduces a few “tiny” issues.


    ![](img/82ece24d778fc2b746539fd81bd94284_151_0.png)


    Linsetpos has a slightly different philosophy. You have only one account when
    you''re using Linsetpos, by default. However, in the next section, I show you
    how to create new accounts so that you don''t have to use root — or let someone
    who''s borrowing your computer for a moment to browse the Web under it root!


    # Creating user accounts


    Many Linux distributions include a graphical interface application for creating
    and managing user accounts. Here''s how you can find this application for your
    distribution:


    +   - Fedora Core: Choose Applications-System Settings-Users And Groups opens
    the User Manager.'
  merge: -1
  pgno: 151
- img_proc: true
