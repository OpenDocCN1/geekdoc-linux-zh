    # Introducing SELinux


    Security-Enhanced Linux (SELinux) was developed by the USA''s NSA (National Security
    Agency, www.nsa.gov/selinux/) and gives you more fine-grained control over everything
    that''s happening on your system than the standard user, group, and owner permissions
    used by default in the Linux world. SELinux is not limited to Fedora Core; it''s
    available as an extension in giving a number of Linux distributions. In general,
    solid security policies involve giving people and programs only the amount of
    access that they strictly require to those who have a heavy need for limiting
    people and software can be running mission-critical servers or are operating in
    a realm that needs for serious security measures that SELinux lets them have far
    more control over what they can do on their system. For the average home or small
    business user''s desktop, SELinux can be overkill, though if you''re looking to
    use this technology and become familiar with it for your resume or other reasons,
    your home desktop is an ideal platform for such a purpose. Because SELinux is
    quite extensive, I only touch it in Chapter 12, but I do give you enough information
    to get started.


