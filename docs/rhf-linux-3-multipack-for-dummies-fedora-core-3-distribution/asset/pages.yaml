- img_proc: true
  md: '# 376 Part V: The Part of Tens


    This line appears near the top of the file. What you''re interested in is the
    number. In most mainstream Linux distributions, the number 5 Linux to boot into
    the GUI, and the number 3 tells Linux to boot into the command line. In the preceding
    example, therefore, I boot into the GUI.


    # 5. Change the number in this line.


    If it''s a 5, change it to 3, and vice versa. Make sure that all colons and other
    items are left properly in place, or else your machine will have problems booting
    later.


    # 6. Save and exit the file.


    The changes go into effect the next time you reboot the system.


    > TIP If you do end up having problems booting the system, in many current Linux
    distributions (including the one that comes with this book) can be used as an
    emergency boot disk. Check your documentation for information about the distribution
    you''re using if it''s not Red Hat 10.


    # Changing your boot environment just for now


    At any time, you can have your Linux boot switch between full command-line mode
    and full GUI mode. The instructions I give here assume you are using Fedora, Mandrake,
    or SuSE. (Knoppix, Linspire, and Xanders give you this option.)


    To switch between modes, de do the following:


    +   - To change from the GUI login to the command-line login, open a terminal
    window and type (as root) init 3.


    +   - To change from the command line login to the GUI login, type (as root) init
    5.


    # I Want to Change Screen Resolutions


    Do you want or need to swap resolutions in the GUI on the fly? Suppose you want
    to use 1,024 x 768, but you work on Web pages and be able to see how they look
    in a browser at 800 x 600 or 640 x 480. Your machine is very likely already set
    up to do this, you just need to know how!


    If your machine is set up for it, you can change resolutions by pressing the key
    combination Ctrl-Alt-Plus, where Plus is the big plus (+) sign on your number
    pad — you cannot use the plus sign on the main keyboard for this.'
