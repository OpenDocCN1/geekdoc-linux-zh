    # Installing and Using Wine


    And then there''s Wine (www.winehq.org), a complete rebuild of Microsoft Windows
    x8 functionality that runs under Linux. Wine is in many ways the mother of everything
    in the previous section. However, it''s not quite as friendly as commercial versions.
    It''s kind of like the others but with all the makeup and hairspray removed.


    Some Linux distributions offer Wine RPMs directly on their installation CDs or
    through their packaging schemes. For the distributions covered in this book, the
    following to install WINE for the distributions that don''t already installed,
    or to start it for the distributions that do have it. (See Chapter 12 for more
    details on installing software.)'
