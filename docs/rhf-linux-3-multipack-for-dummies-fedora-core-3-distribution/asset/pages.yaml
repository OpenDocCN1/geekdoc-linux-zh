  md: '# Chapter 7: Configuring Linux


    # Red Hat and Fedora Core tools


    Red Hat''s Fedora community project comes with a number of tools developed by
    Red Hat for its commercial products, as well as a variety of tools built by the
    community, such as the GNOME Project''s tools. When it comes to customizing your
    desktop, you can find most of what you''re looking for choosing Applications>Preferences.
    Rather than having a large control center, GNOME has opted to keep the configuration
    tools broken into smaller, individual programs. You find this layout in other
    GNOME installations as well.


    Keeping with the theme of smaller, more specialized tools, your various system-wide
    configuration options are available by choosing Applications>System Settings.


    # SuSE tools


    Like Mandala, SuSE offers two primary places to configure your system. One of
    them is (again) the KDE Control Center, which is available by going to the lizard
    (geek-o) head in the lower left corner (the main menu) and choosing Control Center.
    This version of the KDE Control Center is slightly different than the standard
    one as it''s got support for YaST (Yet Another Setup Tool''s) modules — each of
    the individual configuration routines within YaST — built in. However, to use
    YaST directly, you can go to the main menu and choose System>YaST (see Figure
    7-8).


    ![](img/82ece24d778fc2b746539fd81bd94284_162_0.png)


    Figure 7-8: The YaST interface in SuSE 9.2.'
