- img_proc: true
  md: '# 310 Part IV: Getting Things Done


    Of course, if the file contains more than a screen''s worth of information, cat
    spews it all out at one time like a big hairball, and all but the last screen
    of text scrolls off the screen. It''s a good thing that you have some other choices.
    The one you''re likely to choose is less, which displays the contents of a full
    screen at a time. Then you use the spacebar to continue to the next screen. You
    can also use the arrow keys to move up and down one line at a time, if you want.


    An alternative to less is more. The main difference between the two is with more,
    you can move only forward through the file and see only a screen''s worth of information
    at a time. You can''t back up.


    To use less or more, the format is similar to the format used with the cat command:
    nano and more filename. When you finish the document, press Q to exit.


