  md: '# Chapter 11: Checking Out the Linux Filesystem


    # # Formatting Disks


    A floppy disk, USB keychain, and any other small(ish) storage device often comes
    as a blank slate or formatted for Windows or Macintosh (most often these days
    they come formatted for Windows). If the item is a blank slate, no computer can
    use it for anything. You can actually use the item in Windows format with no problem,
    or you can format—change its setup—for Linux. (The handy thing about leaving it
    as a Windows disk is that you can use it to share with Windows users).


    To format a floppy, place the floppy into your floppy drive and do the following:


    +   * Fedora: Choose Applications:System Tools:Floppy Formatter.

    * Knix: Right-click the floppy icon on the desktop and choose Actions:Format Floppy
    Disk.

    * Linspire: From the main menu, choose Programs:Utilities:Floppy Formatter.

    * Mandrake: From the main menu, choose System:Configuration:Hardware:KFlo.

    * SuSE: From the main menu, choose System:Filesystem:KFloppy.

    * Xanders: Open the Xanders File Manager (see Chapter 10), right-click the Floppy
    entry in the left section, and choose Format. You may have to click the Floppy
    item first to open its contents before you can format it.


    Typically, the defaults are what you''ll want to choose. If you want to format
    the disks for Linux, use the Linux Native (ext2) format. To share disks with Windows
    users, choose DOS (FAT). Another setting you may want to choose Thorough rather
    than Quick.


    # # Care and Feeding of Your Filesystem


    Regardless of which operating system you''re using, you need to keep your filesystem
    healthy and happy. Everything that you need to operate the machine and do your
    work (or play) it exists in that filesystem. Keep it in good shape, and it''s
    sure to treat you in return. Fortunately, Linux does some of it automatically
    for you.


