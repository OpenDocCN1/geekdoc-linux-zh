    Now, KPackage actually grabs the updates to install them. This process can take
    a while (an hour or longer) the first time you do it, depending on how long your
    version of Knoppix has been available. You can tell how much longer it has to
    go by the percentage marker in the bottom left of the window. Once the download
    is complete, KPackage begins configuring the packages for installation.


