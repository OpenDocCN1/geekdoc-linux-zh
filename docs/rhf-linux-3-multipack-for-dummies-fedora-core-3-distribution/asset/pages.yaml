  md: '# 14 Part I: Getting Your Feet Wet


    The Massachusetts Institute of Technology (MIT) has held a reputation for nurturing
    the greatest minds in the technological disciplines. In 1984, Stallman, a gifted
    student and brilliant programmer at MIT, was faced with a dilemma — sell his talent
    to a company for a tidy sum of money or donate gifts to the world. He did what
    we''d all do right?


    Stallman set out on a journey to create a completely free operating system that
    would dominate the world. He understands and continues to live the original hacker
    ethic, which declares “information wants to be free.” This concept wasn''t new
    in his time. In the early days of the computing industry, many advancements were
    made by freely sharing ideas and programming code. Manufacturer-sponsored groups
    brought the best minds together to solve complex problems. This ethic, Stallman
    felt, was lost when companies began hog software as their own intellectual property
    with the single purpose of profit.


    As you may not have gathered by this point, widespread and accessible source code
    is paramount to successful software development. Source code is the term for the
    human-readable text (as opposed to the unreadable ones and zeros of binary code
    or an “executable”) that a programmer types to communicate to the computer.


    Writing computer programs in binaries is an extremely arduous task. Modern computer
    software is usually written in a human-friendly language and then compiled, or
    translated, into the computer’s native instruction. To make changes to this software,
    a programmer needs access to a program’s source code. Most proprietary software
    comes only as precompiled, and the software developer keeps the source code for
    those programs under lock and key.


    After determining that his operating system would be built around a conceptual
    framework of Unix, Stallman wanted the project name to distinguish his system
    from Unix, he chose the recursive GNU (pronounced ga-new), which means GNU Not


    To finance the project, Stallman organized the Free Software Foundation (FSF),
    which used free software to feed the programmers who worked on its continuing
    development. (Remember, we’re talking free as in free speech, not free beer.)
    Although this organization goal of creating a complete operating system was necessary
    and important, the puzzle to be put into place to protect this new software from
    business pirates — a concern still all relevant today as a former Linux company
    tries to hijack decades of volunteer work from thousands of people around the
    world.


    The GNU Public License (GPL) is a unique and creative software license that uses
    copyright to protect the freedom of the software user, which is usually the opposite
    of how a copyright works. Generally, a copyright is an enforceable designation
    of ownership and restriction from duplication by'
