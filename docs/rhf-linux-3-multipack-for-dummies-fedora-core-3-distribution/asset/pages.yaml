  md: '# 210 Part III: Getting Up to Speed with Linux


    # Understanding long format file listings


    Remember those detailed list views in the file managers? They typically contain
    information similar to ls -la output here (see Appendix A for a list of commonly
    used commands in Linux):


    ```

    drwx      -- dee 4096 Jul 29 07:48 . permission set assigned

    drwxr-xr-x 5 root 4096 Jul 27 11:57 -

    -r--r--r-- 1 dee 24 Jul 27 06:50 .bash_logout

    -r--r--r-- 1 dee 230 Jul 27 06:50 .bash_profile

    -r--r--r-- 1 dee 124 Jul 27 06:50 .bashrc

    ```


    You may find some parts of this format easier to understand, at a glance, others.
    The first item in link (the part with the links and dashes—for example, the drwx
    in the first line) is the permission set define who can read the file, change
    it, or run it if it''s a program. You can read more about permissions in “A permissions
    primer,” in this chapter. The second item in the first line (in this case, 2)
    is the number of links to the item.


    A link is a file listing pointing to another file, making a kind of shortcut.
    Use two kinds of links in Linux and Unix:


    ![](img/82ece24d778fc2b746539fd81bd94284_227_0.png)


    +   * Soft link: This link is a Windows shortcut in the link points back to the
    original file, and anything you do to the link happens to the original. Erase
    the original file, and the link remains, but it becomes unusable.


    +   * Hard link: This link doesn''t have a counterpart in the Windows world. A
    hard link isn''t a shortcut; it''s another instance of the file itself. The data
    is saved in only one place, where you can edit the original or the link, and the
    edit is saved for both instances of the file. Erase the original, and the file
    still exists as long as the link is. It is like two doors to the same room!


    The third item (dee) is the file''s owner, depending on which version of Linux
    you''re using, these items or may not be identical. You can find out about both
    of these in “A permissions primer,” in this chapter. The fifth item is the file''s
    size in bytes. All directories show up as 4096 bytes. Everything else has its
    own size. You can delete an empty file from the size of 0 bytes.


    The sixth, seventh, and eighth entries are all related to the last time the file
    was changed: the month (Jul), the date (29), and the time in 24-hour format (07:48).
    Finally, the ninth item is the filename (for example, bash logout, in the third
    row).'
  merge: -1
