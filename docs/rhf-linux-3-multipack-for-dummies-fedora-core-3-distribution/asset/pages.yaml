  md: '# Chapter 6: Checking Out Those Desktops


    Most distributions come with both KDE and GNOME, so most users simply choose their
    preferred desktop. While it may look here as though KDE is particularly popular
    compared to GNOME, this isn''t necessarily the case. Both are excellent desktops
    with strong fans. It''s a pretty personal preference, so I encourage you to test
    and experiment with both and to see which you like better. The cool thing is you
    can run KDE programs under GNOME and vice versa. This ability is vital when it
    comes to making it easier for developers (and users) in the Linux community. When
    you ask people why they chose one over another, they really can''t give you much
    of a good answer aside from "That''s what I''ve used." Keep this in mind when
    you try to convince them that one or the other is the best since sliced bread!


    I cover how to switch between KDE and GNOME later in this chapter in the section
    "Switching between GNOME and KDE."


    # # Making the Best of the Command Line


    The Linux command-line interface provides a quick and easy way of entering commands
    and executing actions. If you''re even just a "GUI person," after you get the
    hang of using the command line, you discover that it''s faster to perform tasks
    at the command line than with a mouse in a GUI environment. However, if you prefer
    to use a GUI interface as your working environment, you can easily open a *terminal
    window*, command prompt, to perform your command-driven tasks without having to
    completely leave the point-and-click environment (see Chapter 14).


    There are some interesting things that you might find to know about using the
    command line interface. One difference between the Linux command line and other
    command lines, such as the Windows MS-DOS prompt, is that Linux commands are case
    sensitive. Tapping LS is different from typing ls, and in fact, it gives you an
    error because there is an ls command but there is no LS command. The Linux command
    line also has an *autocompletion* feature. If you know the first characters of
    a command or filename, type part of it and press Tab to complete the rest automatically.
    For example, if you''re trying to use the *less* command to view the contents
    of the file /home/bob/group_it, you can type *less /home/bob/group_it* and press
    Tab to complete the filename. If you want the subdirectory (folder) /home/bob/group_projects,
    you hear a beep. You can press the Tab again, double-clicking a mouse, to see
    the output:


    ```

    grocery_list      group_projects

    ```


    The cool thing is that the command prompt enhances these items still with the
    text *less gro* so you don''t have to retype it! You can then see that typing
    a c makes it clear that you''re referring to grocery and not group,'
