  md: '# Part III: Getting Up Speed with Linux


    You probably see a pattern by now. A hard drive has a three-letter designation:


    +   - IDE drive''s designation starts with /dev/hd; the first drive of this type
    is a, the second is b, and so. The third IDE drive looks like this: /dev/hdc.
    If you''re using something like a Promise controller that bypasses the main IDE
    controllers (I know, this is technical stuff), then your first IDE hard drive
    will, in fact, show up as /dev/hde. I know this from one personal experience!

    - A SCSI drive''s designation starts with /dev/sd; the first drive of this type
    is also a, the second is b, and so. The fourth SCSI drive looks like this: /dev/ssd.
    USB drives are also seen as SCSI devices. A little like a USB keychain is often
    seen as /dev/sdal by your system you don''t have any persistent SCSI drives attached.


    The name that follows the three-letter designation represents the partition you''re
    referring to. I cover partitioning your hard drive in Chapter 2.


    In 11-1, I break down this concept, hopefully making it a bit accessible. In this
    case, the user created three partitions for Linux. The first IDE drive is a single
    partition, allocated for the root partition. The second IDE drive is broken into
    two partitions. The first was given /usr; and the second, /var.


    If you move the filesystem, you can (and don''t need to know) which of these directories
    is which drive. The prompt, for example, doesn''t change based on which drive
    each directory is; the commands used for moving around the filesystem (see Appendix
    A) don''t care about the underlying hard drive or drives.


    Figure 11-1: Linux versus Windows in handling partitions and hard drives.


    | Windows | Linux |

    |---|---|

    | A: Floppy | /mnt/floppy Floppy |

    | B: CDROM | /mnt/cdrom CDROM |

    | First IDE drive C: | /dev/hda1 / First IDE drive |

    | Second IDE drive D: E: | /dev/hdb1 /usr /dev/hdb2 /var Second IDE drive |

    | First partition Second partition | First partition Second partition'
