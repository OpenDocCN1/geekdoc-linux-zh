    # Anatomy of an Open Source Software Project


    > Linux isn''t a product. Linux is an organic part of — Michael Robinson, Netrinsics


    To the casual observer (and some corporate IT decision-makers), Linux appears
    to be a freak mutation — a rogue creature randomly generated by anarchy. After
    all, can something so complex and discipline-dependent as a computer operating
    system be developed by a loosely knit band of volunteer computer geeks from around
    the world?


    Just as science is constantly attempting to classify and explain everything in
    existence, technology commentators are still trying to understand how this open
    source model can create superior software. Often, the reasons have much to do
    with the usual human desire to fill a need with a solution. When a programmer
    in the Linux world wants a tool, the programmer simply writes one or bands together
    with other people who want a similar package to write it together.


    # GNU who?


    — software created out of need rather than projected profit. Even though Unix
    ultimately became expensive proprietary software, the ideas and motives for its
    creation were originally based on need. What people usually refer to as the singular
    Linux operating system is actually a collection of software tools that were created
    with the express purpose of solving computing problems.


    Linux also not be possible without the vision of a man whom Steven Levy (author
    of the book Hackers) refers to as The Last of the Great MIT AI-LAB Hackers — the
    original meaning of the word hacker, which meant someone who plays with code,
    not the current meaning implying criminal intent. This pioneer and advocate of
    freedom software is Richard Stallman.'
