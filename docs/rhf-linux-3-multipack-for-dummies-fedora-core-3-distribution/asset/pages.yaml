  md: '# Creating and Modifying Graphics


    The GIMP is a graphics program that’s considered in many ways equivalent to Adobe
    Photoshop. Many don’t consider the GIMP the friendliest program on the planet,
    but by the very least, it has enough features to keep you busy experimenting for
    weeks! To Open GIMP:


    The GIMP may not already be installed. In Inspire and Xandros in particular, you
    might need to use what you learned in Chapter 12 to add this software before you
    can use.


    +   - Fedora: Choose Applications:Graphics:GIMP Image Editor.

    - Knoppix: From the main menu, choose Graphics:GIMP Image Editor.

    - Inspire: From the main menu, choose Programs:Multimedia & Design:GIMP, which
    is installed under Multimedia & Design.

    - Mandrake: From the main menu, choose Multimedia:Graphics:The GIMP v2.

    - SuSE: From the main menu, choose Graphics:Image Editing.

    - Xandros: Choose Applications:Graphics:GIMP Image Editor.


    When you start The GIMP for the first time, you have to walk through its user
    setup routine. Fortunately, you can just click Continue each time, unless you’re
    a graphics guru who has a particular reason to want do things in a different way.
    After you’ve clicked past these dialog boxes, a collection of one or more dialog
    boxes pop up containing the GIMP main dialog box (see Figure 18-6) plus additional
    tool dialog boxes. I recommend closing all the main one for now, just to keep
    your screen and brain uncluttered.


    ![](img/82ece24d778fc2b746539fd81bd94284_372_0.png)


