    do the following:


    +   1. Place the Knoppix CD or the DVD-ROM that came with this book into your
    CD-ROM or DVD-ROM drive.

    2. Reboot the computer.

    3. After the computer successfully boots into Knoppix, determine which partition
    returns to your main Linux installation.

    4. After you find the proper partition, if you currently do not have a file browser
    open anywhere within that partition, click the partition icon to open the browser
    now.

    5. Click the Terminal Icon on your panel.

    6. Type su to access the root user''s account.

    7. Make sure to close the file window that''s accessing your root partition.

    8. Type mount -r remount rw /dev/partition to remove the partition and re-add
    it as a full read-write filesystem.


    If you''re using the DVD-ROM that came with this book, Press Enter when you reach
    the boot menu. If, for some reason, the DVD-ROM doesn''t boot, see Appendix.


