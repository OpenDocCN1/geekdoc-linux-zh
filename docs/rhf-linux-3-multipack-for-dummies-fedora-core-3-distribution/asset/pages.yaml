  md: '# 10 Part I: Getting Your Feet Wet


    Don''t scratch your head too hard; these concepts are tough to grasp initially,
    especially when you consider the conditioning you''ve received from the marketing
    departments of the commercial software industry. Perhaps you don''t know that
    when you purchase proprietary, shrink-wrapped software, you don''t actually own
    the software; rather, you''re granted to use the software within the bounds dictated
    by the licensor.


    Linux also has a license, but the motives and purpose of the license are much
    different from those of most commercial software. Rather than use the license
    to protect ownership of the software, the GNU General Public License (GPL) that
    Linux is licensed under ensures that the software will always be open to anyone.
    No one can ever own or dictate the way in which you use or modify Linux—though
    they can have their own individual copyrights and trademarks on their various
    brands of it, like Red Hat. In essence, you already own Linux, and you can use
    it for anything you like, as long as you propagate the GPL freedoms to any further
    recipients of the software.


    # Linux: Revolution or Just Another Operating System?


    > Contrary to popular belief, penguins are not the salvation of modern technology.
