    # Listening to Downloaded Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s both legal and ethical, when in fact, it''s often fought, depending
    on where you grabbed the music. I leave that ethical issue between your belief
    system of choice, but because my own ethics say that I''m trying to focus on showing
    you music that you''re welcome to download — legally and ethically! Take a look
    at strategies for finding music, along with how to listen to it.


    One place to find such material is on an own Web site. Many groups today realize
    that offering free downloads of their work is a great PR move — if people use
    the sample songs, they''re more likely to go out and buy the album. For an example,
    I use one of my favorite bands, Evanescence (www.evescence.com).


    Evanescence, like many other bands, has its page done mostly with Macromedia''s
    Flash tool. (See Chapter 12 for how to add this functionality to your distribution.)
    To listen to music files in general:


    +   - Fedora: Choose Applications:Sound&Video:Music Player.


    +   - Knoppix: From the main menu, choose Multimedia:Sound:XMMS.'
