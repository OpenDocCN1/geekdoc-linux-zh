    # Partitions versus Directories


    One very important thing to understand about the Linux filesystem is that it may
    not be on one single hard drive or hard drive partition, and yet you don''t have
    to keep track of what drive or partition it''s like you do in other operating
    systems. In the Microsoft Windows world, if you use separate drives or partitions,
    you have a specific designation for each one. The primary hard drive is C, the
    next is D, and so on. Under Linux, each of these drives and partitions quietly
    blends together.'
