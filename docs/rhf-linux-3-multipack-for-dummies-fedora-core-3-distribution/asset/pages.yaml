    A train station is where a train stops.

    On my desk, I have a workstation. . . .

    — Steven Wright


    A lot of people like to characterize Linux as a DOS-like environment, where all
    you can operate in this antique-feeling world where you have to type a lot of
    cryptic stuff and can''t see any pretty pictures. The Linux desktop offers you
    a nice working environment, as you see throughout this chapter. The cool thing
    is that most of it is configurable. Those who like to customize their systems
    can have too much fun changing things around.


    # Introducing the Interfaces


    Linux has two interface types: the command-line interface and the graphical user
    interface (GUI). If you use other computers, such as Windows or the Macintosh,
    you''re already familiar with a GUI. Most Linux distributions include different
    versions of the GUI (which takes up the majority of this chapter), which you can
    heavily customize.'
