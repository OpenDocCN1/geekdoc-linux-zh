    Figure 19-2: Windows 98 installing under Win4Lin in a SuSE 9.1 window.


    # Cedeqa


    More interested in games than office tools? There''s also TransGaming''s Cedeqa
    (www.transgaming.com), which was once called WineX. This version of the free Wine
    project (see the upcoming section "Installing and Using Wine") is specifically
    designed to support DirectX, which is used in Windows to make programming for
    multimedia and games easier. Subscribers have access to regular updates, allowing
    them to make use of their favorite games and also add any games they like to the
    growing list of games that are tested with the system.


    Go to ..transgaming.com/search.php, scroll to the bottom of the screen, and click
    the Here link. A list of all games, in order, appears so that you''re able to
    find out what games are supported at what level. A handy new(ish) feature is the
    Point2Play installer (see Figure 19-3), which you can use to ready your computer
    for the Cedeqa experience.


    A plus to Cedeqa is again, that you don''t need to keep those Windows CDs lying
    around. However, its support for individual games can be spotty, so be sure to
    check the Web site before you invest in this product. Also, be sure to make use
    of the help forums!'
  merge: -1
