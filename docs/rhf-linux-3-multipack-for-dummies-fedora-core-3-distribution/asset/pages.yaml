- img_proc: true
  md: '# 212 Part III: Getting Up to Speed with Linux


    The three triads are read as follows:


    +   - The first triad consists of the second, third, and fourth characters in
    the long format file listing. This triad sets the permissions for the user, or
    owner, of the file. (Owners are discussed in the "Beware of owners" section, later
    in this chapter).

    - The second triad consists of the fifth, sixth, and seventh characters in the
    long format file listing. This triad sets the permissions for the group that is
    assigned to the file. (Groups are discussed in the "Hanging out in groups" section,
    later in this chapter).

    - The third triad consists of the eighth, ninth, and tenth characters in the long
    format file listing. This triad sets the permissions for other, or everyone who
    isn''t the file''s owner or a member of the owning group.


    Although each triad is often different from the others, the internal structure
    of each one is made up in the same way. Focus specifically on how to read one
    triad before looking at the set of them. Each triad includes three characters:


    +   - The first character is either an r or a dash. The r stands for permission.
    If r is set, the triad allows the entity it stands for (user, group, or other)
    to view the directory or file contents.

    - The second character is either a w or a dash. The w stands for write permission.
    If w is set, the triad allows the entity it stands for to add or edit items to,
    in this directory or file.

    - The third character is either an x or a dash. The x stands for execute permission.
    If x is set, the triad allows the entity it stands for to run programs contained
    in this directory or to run the particular program in.


    ![](img/82ece24d778fc2b746539fd81bd94284_229_0.png)


    In all cases, if the dash sits in place of r, w, or x, the triad doesn''t allow
    the entity owners to read, write, or execute permission.


    The following sections describe owners and groups in detail.


    # Beware of owners


    You may have noticed now that I talk about great deals about owners (users) and
    groups in Linux. Every file and directory has both of these components: a user
    from the /etc/passwd file that is assigned to your group and from /etc/group assigned
    as the group.


    Although an everyday user probably doesn''t need to change file ownership, the
    root user does so regularly. If you add the file comments, for example, to /home/tom
    when you''re logged in as the superuser (another term for the administrator, who
    is the person who owns the root), root owns that file. The user tom can''t do
    anything with it unless you have set the last'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories 213


    triad''s permissions to allow the other folks (those who aren''t the file''s owner
    or in the specified group) to read and write to the file. But this method is a
    pretty sloppy of doing things because the whole idea of permissions is to reduce
    access, not to give everyone access. Instead, remember to change the file''s owner
    to the user tom. You do this with the chown (change owner) command. For example,
    by typing chown comments, root changes the ownership over tom. Then tom can work
    with this file and change its permissions to something he prefers.


    Hanging out in groups

    groups are more interesting to work with than owners. You use groups to allow
    the root user to assign multiple users the ability to share file system areas.
    For example, in many versions of Linux, all users are added to a group users (SUSE
    does this, for example) then, rather than a long file listing like the one shown
    earlier in this chapter, you may see the following:


    ```

    total 20

    drwx-xr-x 2 dee users 4096 Jul 29 11:57 --

    drwxr-xr-x 5 root root 4096 Jul 27 06:50

    -rw-r--r-- 1 dee users 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee users 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee users 124 Jul 27 06:50 .bashrc

    -rw-rw--r-- 1 dee users 0 Jul 29 07:48 lsfile

    ```


    In other distributions (such as Fedora) a unique group is created for every user,
    which is why the early listings showed the owner and group items as identical
    (dee).


    # Comprehending file types


    The first letter in long format file listing tells you which type of file you''re
    dealing with. In Table 10-1, I list the types you''re likely to run into.


    | Table 10-1 | Linux File Types |

    | Label | Type | Description |

    | - | Regular file | The item is an everyday file, such as a text file or program.
    |

    | b | Block device | The item is a driver (control program) for a storage medium,
    such as a hard drive or CD-ROM drive. |


    (continued)'
