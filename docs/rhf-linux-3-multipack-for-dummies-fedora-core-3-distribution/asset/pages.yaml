    # Troubleshooting your IM connections


    If you''ve been using most of these IM clients with other operating systems, after
    your Linux system has successfully connected to the IM service, if you haven''t
    ever used AIM or MSN, you can now set up buddy lists. Buddy lists contain the
    usernames of people you communicate with through the instant messaging service.
    Your buddy list lets you know when your "buddies" are online and available to
    receive an instant message.


    Sometimes, your Linux system is unable to connect to the IM service. When this
    problem happens, an error message pops up on your screen and indicates a failure
    to connect. You may be unable to connect to the IM service for several reasons:


    +   You may have entered the wrong password for your IM account or chosen the
    incorrect IM account name.


    +   Your computer may not be connected to the Internet. Try opening your Web browser
    to see whether you can get to a Web site, which tells you whether you''re connected
    to the Internet.'
