  md: '# Compressing and Packaging Files to Share


    Life isn''t all about "take, take, take" (or at least I should hope not!) Sometimes
    you''ve just gotta give. Creating packages to share with others involves learning
    how to tell Nautilus (GNOME users) or Konqueror (KDE users) that you want to do.
    However, because the overall process is so similar, I don''t break these steps
    down into separate sections.


    To package up and compress files for sending off to other people, navigate to
    the location where you''ve stored the file(s) — see Chapter 10 for how to move
    out — and then:


    +   1. **Determine whether you want to compress or pack a single file**, group
    of files, or a whole folder.


    If the files and folders that you want to bundle are all over the place in your
    folders, you may want to create a new folder and copy the items you want to bundle
    together into it. Chapter 10 shows how to do so.


    +   2. **Select the item(s) you want to package.**


    Chapter 10 explains how to do so. If you select a whole folder, navigate into
    its parent folder and select the folder''s icon instead of entering it.


    +   3. **Right-click over the item(s) (or if you''re using Nautilus, you can also
    choose the Edit menu).


    The context menu appears if you right-clicked or, or in Nautilus, the Edit menu
    opens.


    +   4. **Create your archive.**


    How you create your archive depends on what distribution you''re using:


    +   **Fedora**: In the context or Edit menu, choose Create Archive. In both cases,
    the Create Archive dialog box appears, suggesting a tarball (Table 12-1) version
    of the file. If this is what you want, leave it alone, or change the file extensions
    (as discussed in the table) to match what you want. Then click Create, and you''re
    finished with these steps.


    +   **Knoppix and Mandrake**: In the context menu, select the Create option as
    a target. By Table 12-1: Create gzipped Archive means to make a .tar.gz file;
    Create bzipped Archive means to make a .tar.bz2 or .bz2 file; Create zip Archive
    means to make a .zip file.


    +   **Linspire**: You cannot use the file browser in Linspired 4.5 to create an
    archive. Instead, you''ll have to go to the main menu:Programs'
