  md: '# Chapter 17: Word-Processing and More with OpenOffice.org


    2. If you want to select one of the default slide backgrounds that come with OpenOffice.org
    impress, you can do so by looking to the Select a slide design drop-down list
    box, choosing Presentation Backgrounds, and then clicking the various options
    to see what they look like to the right of the dialog box.


    By default, there aren''t many background templates. This is one area where Sun''s
    StarOffice offers added value.


    3. If you want to select a presentation (content) layout template that was designed
    specifically for the template you chose in this dialog box''s screen, you can
    do so by looking to the Select A Slide Design drop-down list box, choosing Presentation(s),
    and then selecting the presentation type you want to use.


    Again, you have found limits here by default.


    4. If you want your presentation ultimately to appear on something other than
    a computer screen, adjust the Select An Output medium to match its intended setting.


    Your choices are Screen, Overheat Sheet, Slide, and Paper.


    5. Click Next to proceed.


    Dialog 3 appears.


    6. Under Select a slide transition, experiment with the various options in the
    Effect and Speed drop-down list boxes to narrow down how you want to move from
    one slide to another.


    OpenOffice.org Impress animates these transitions for you as long as the Preview
    box is checked.


    7. If you want to navigate manually from one slide to the next (the Default option)
    while you give your presentation, skip to Step 10. If you want to have your presentation
    advance automatically, click the Automatic option.


    8. In Duration Of Page, set how long you want each slide to stay up.


    9. In Duration Of Pause, set how long of a blank gap you want to have between
    slides.


    If you have Show Logo checked, the OpenOffice.org logo appears during the blank
    pauses.


    10. After you have your settings selected, click Create to proceed.


    OpenOffice.org Impress opens, as shown in Figure 17-5. You may find it useful
    to click the X in the upper right of the Modify Slide dialog box so that you can
