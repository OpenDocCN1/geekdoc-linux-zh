  md: '# 232 Part III: Getting Up to Speed with Linux


    # Don''t run out of room!


    One of the most insidious problems that all computer users run into from time
    to time is a lack of disk space. The scope of this problem really depends on number
    of things. The primary issue is that, if root partition becomes 99 or 100 percent
    full, you need to use emergency rescue techniques (refer to Chapter 5) to boot
    the machine and clean it up. That''s no fun, is it?


    In the beginning, you''re probably not in danger of filling the drives, unless
    you barely had enough room to install Linux in the first place. However, you might
    vary forget about watching the drives for remaining space. Even experienced administrators
    run into this problem, so certainly you''re for-given you do it too!


    Really do try to making the following habit:


    +   1. Open a command prompt window (see Chapter 14).

    2. Type df -h.


    That''s it! As you can see earlier in the section "If your machine fails to reboot,"
    though you ignored it at the time, the columns include


    +   - Size: How big the partition is.

    - Used: How much of the partition has been used already.

    - Avail: How much is left.

    - Use%: So we don''t have to do mental math, a % of how much of the partition
    has been used up.


    When you start reaching 90 percent, it''s time to start doing housecleaning!'
