  md: '# 168 Part II: Internet Now!


    Appearance preferences

    Selecting the Appearance main menu option — Figure 9-2 — allows you to determine
    how you want Mozilla to look and act when it loads. Its basic setup is governed
    by three sections: When Mozilla/Internet Starts Up, Open; Show Toolbars As; and
    the miscellaneous section at the bottom. The first section determines what parts
    of Mozilla should launch when you start up your browser. The options here are


    +   - Navigator: The browser itself is selected by default.

    - Composer: The Web page creation part of Mozilla.

    - Mail & Newsgroups: The e-mail and newsgroups part of Mozilla. (This is only
    available in some distributions by default.)


    You can have more than one of these selected at a time, and all the ones you''ve
    chosen start when you open your browser. Or, you can choose to launch the additional
    pieces separately through the Window menu, just when you need them.


    The second section allows you determine how you want to see your toolbars:


    +   - Pictures and text: Show buttons on your Mozilla toolbars and text with them.

    - Text only: Don''t bother showing the pictures.

    - Pictures only: Don''t bother showing the text.


    ![](img/82ece24d778fc2b746539fd81bd94284_185_0.png)


    Figure 9-2:

    The Mozilla Appearance Preferences window in Fedora Core 3.'
