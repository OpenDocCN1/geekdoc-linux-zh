  md: '# # Chapter 12


    # # Adding Software to Linux


    In This Chapter


    +   * Recognizing tarballs, RPMs, and compressed files

    * Creating tarballs and archives

    * Compressing files

    * Opening tarballs, archives, and compressed files

    * Installing and removing RPMs


    > > I will make you shorter by the head.

    — Queen Elizabeth II


    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the goofy extensions. The Windows world has .exe and
    .zip. The Macintosh world has .bin and .hqx. What about the Linux world? It certainly
    has its fair share of bizarre extensions, but, really, they make a great deal
    of sense after you know the programs that make them. In this chapter, you will
    find out about .tar, .gz, .tar.gz, .tgz, .bz2, and .rpm Anyone up for a game of
    Scrabble alphabet soup?


    After you''ve got the letter juggle all you''ve figured out, the Linux offers
    a new set of cool tools for working with these crazy files, updating your system,
    adding new software, and more.


    # # Opening Downloaded Files


    The Linux and Unix worlds are full of strange terms and acronyms. For example,
    if someone comes up to you out of the blue and starts talking about tarballs,
    you probably get a mental image of sticky balls of tar, maybe rolled in feathers.
    A tarball is something you run regularly in the Linux world, especially when you''re
    looking for software or you need to save your some space. A tarball is a bunch
    of files (and possibly directories) packaged together in a tar file and then compressed
    using the gzip utility.'
