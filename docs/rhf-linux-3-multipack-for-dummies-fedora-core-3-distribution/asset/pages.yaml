    # Surfing the Web


    Mozilla is your viewing window into the wonderful World Wide Web. Mozilla''s primary
    purpose is to fetch Web pages on your command, download all their graphics and
    related files into your computer''s memory, and, finally, render for your interactive
    viewing pleasure.


    If you''re using Internet Explorer or Netscape, Mozilla should be a snap. It has
    all the familiar navigation tools, such as an address bar; Back, Forward, Reload,
    and Stop buttons; and a feature that stores links to your favorite Web sites (bookmarks).


    Mozilla, like Netscape, also has a Sidebar feature — press F9 to show and hide
    it (see 9-3) — which you can use to find sites related to the one you''re visiting,
    search for a word or phrase on the Internet, access bookmarked Web pages, or access
    a Web page you recently visited (through the History option).


