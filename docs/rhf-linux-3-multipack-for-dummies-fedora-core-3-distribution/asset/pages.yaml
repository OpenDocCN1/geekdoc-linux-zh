  md: '# Chapter 21: Ten Cool Uses for Knoppix


    then the problem may be hard-drive oriented. If you run into problems with Knoppix
    that you did under Windows or another form of Linux, then you have more hints
    there.


    I had problems on one machine with three different distributions, and after a
    lot of frustration and observation, I realized that the machine only crashed in
    the GUI in all three, and never when I was just using the command line. I changed
    the machine’s video card and voilà everything was fine.


    # Exploring Tons of Linux Tools


    Knoppix comes with an amazing array of tools for just one CD-ROM. You can play
    with multimedia tools for television, sound editing, and more without having to
    hunt down and install a new piece of software. When you find something really
    like, you can go about seeing whether you can get it and add it for your own distribution.
    Heck, a lot of software is available for Windows, too!


    You can also use Knoppix to test documents like Web sites and word-processing
    files to make sure that they right under Linux. You can even check to see whether
    WINE (see Chapter 19) can handle a particular Windows program that you’re hoping
    to run, because WINE comes installed by default in Knoppix. If the program works
    in Knoppix, you might not bother to install WINE under another distribution.'
