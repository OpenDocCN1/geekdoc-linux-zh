  md: '# Chapter 13: A Secure Linux Box Is a Happy Linux Box 265


    whether you can trust a particular Web site, do some research and perhaps ask
    others for their opinions.


    12 details of how to keep your distribution and its software up to date. Please,
    please, please, do so! After all, as the person in charge, your job is to make
    sure that this computer stays intruder-free. In addition to making sure that you
    do all the same things a user would for both your user accounts and the superuser
    (root) account, no matter what Linux distribution you''re running, you must keep
    up-to-date with security problems.


    # Network holes


    On a Linux server or workstation — or any computer at all, using any operating
    system — you should not have any services running that you don''t intend to use.
    Think of each network program as a glass window or sliding door in your house.
    Each network service is a weak spot, and many nasty folks are out there on the
    Internet who like to go up to all the houses and make note of how many windows
    and glass are on, what kinds they are, and how easy they are to breach.


    # Controlling your services


    The more flexible your distribution — as far as its ability to run desktops and
    many types of servers — the more it may have running in the background by default.
    To open the network service management program for your distribution:


    +   - Fedora: Choose Applications❧System Settings❧Server Settings❧Services (see
    Figure 13-1).


    +   - Knopix: From the main menu, choose KNOPPIX❧ Services. There is no central
    service unit, but because distribution is designed as a desktop, a few services
    are available. This menu contains each service you have access to.


    +   - Linsphere: There is no central service configuration point, but this distribution
    is designed to be purely desktop, so there is little to do anywhere.


    +   - Mandrake: From the main menu, choose System❧ConfigurationYour Computer❧System❧Services.


    +   - SuSE: From the main menu, choose System❧YaST❧Network Services. There is
    no central service control unit, but in this section, you can select each service
    individually to see whether it''s on and find out about it. If you''re asked to
    install software when selecting a service, say if you don''t intend to use it!
    Clicking Cancel does the trick.


