    The X Window System (or X) opens a world of possibilities. X is, in general, a
    set of applications that work together to provide a graphical interface. Think
    of these applications as the wireframe beneath your GUI, with GNOME and KDE (see
    Chapter 6) offering the pretty macho coating. Some of these applications draw
    windows, some manage the look and feel, and others handle aspects of the graphical
    world which is enough. All of them are configurable and even replaceable, which
    is enough to make the average user''s eyes cross with too many options!


    GNOME and KDE are entirely creatures of convenience, offering integrated sets
    of window dressing that you do not have to pick and choose your components. In
    this chapter, you get a chance to alter both KDE and GNOME''s behavior to suit
    your needs. For example, if you have a hard reading text in those small command-prompt
    windows in the GUI, you can make both the windows and their fonts larger. You
    can change a wealth of things, too, so and take a look.


    ![](img/82ece24d778fc2b746539fd81bd94284_310_0.png)


    If something goes terribly wrong in the GUI and you need to exit in a hurry, press
    Ctrl+Alt+Backspace. This combination does one of two things. If you boot into
    the GUI, it collapses your GUI session and takes you to the GUI login prompt.
    However, if you boot to the command line, this key combination collapses the GUI
    immediately, taking you to the command line.


    However, press Ctrl+Alt+Backspace only in an emergency. This key combination doesn''t
