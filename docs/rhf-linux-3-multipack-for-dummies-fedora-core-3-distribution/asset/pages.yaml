- img_proc: true
  md: '# 106 Part I: Getting Your Feet Wet


    If you''ve been using computers for many years, you may also be familiar with
    the command-line interface, which usually consists of a black screen with white
    text. The initial release and early development of Linux was all command-line-oriented;
    GUIs then grew as the icing on the Linux cake, making it a lot more colorful to
    use and easier for people who would rather point and click than type.


    In choosing between the command-line and the GUI, you need to consider a number
    of factors. For a lot of people, this decision is pretty much no-brainer issue.
    They have no intention of leaving GUIs behind. That''s fine, but for the very
    least, you may want to become familiar with what''s under the hood. Some day,
    your GUI might break and leave you at the ever-dreaded login prompt!


    # Deciding Which Interface to Use


    One important factor when choosing the command-line interface and a GUI is speed.
    Keep in mind that if you''re a programmer who needs to compile programs or a scientist
    who needs to run software that does heavy number crunching, the GUI slows down
    your system. You also need to shut off the GUI when using Linux as a server, because
    it''s mostly a waste of RAM and processing speed — more often than not, a server
    just does with it no one seeing watching over it.


    Readability can also be a big issue when choosing between the GUI and the command-prompt.
    If you have a hard time reading text in those small command-prompt windows within
    the GUI (Chapters 14 and 20 cover various ways to switch around), you can either
    make the windows and the font bigger, or work directly with the command prompt
    outside of the GUI. However, on a desktop that you want to use for word-processing
    or editing images, you''ll want a point-and-click environment. This setup is the
    type I focus on, but I don''t leave you any clue about the command-line, just
    in case!


    You can also choose from two major GUI versions: GNOME and KDE. Some people prefer
    one, and the other, and I''m not here to tell you which to use. If you stick with
    the defaults for your distribution, you''re using


    +   - Fedora: GNOME

    - Knoppix: KDE

    - Linspire: KDE

    - Mandrake: KDE

    - SuSE: KDE

    - Xanders: KDE'
