- img_proc: true
  md: '# Chapter 14: Working without the GUI 279


    +   - Mandrake: Choose System-Terminals-Konsole.

    - SuSE: Choose System-Terminal-Konsole.

    - Xandros: Choose Applications-System-Console.


    Often, your shell prompt includes helpful information. For example, if you are
    logged in as evan on the machine deepthink in Fedora Core 3, your prompt looks
    like this:


    ```

    [evan@deepthink_evan]$

    ```


    Before surveying a few of the shell capabilities, I need to tell you about another
    method for starting a shell session. First of all, notice that your shell prompt
    is merely a window that is part of your GUI desktop. Suppose that you want to
    start a shell session in a character-only or text environment.


    To switch to a text environment, press Ctrl+Alt+F2. Don''t be alarmed when your
    familiar graphical desktop disappears. It''s still running in the background,
    and you can get back to where you left off in a moment. But first, a few words
    about the boring text you''re looking at now (I hope).


    You''re looking at a virtual terminal, one of several available with your default
    installation. You probably see something like:


    ```

    deepthink login:

    ```


    Go ahead and type your username and password, which you''re prompted for. You
    see a message indicating your last date followed by the bash prompt:


    ```

    [evan@deepthink_evan]$

    ```


    Notice the similarity between this prompt and the window you have behind the GUI
    desktop. Both prompts are an indication that you have a bash session open. Note
    that, although it''s accurate to say they''re both the results of using the bash,
    they are distinct and separate instances of the same program. In other words,
    the environment you''re working with here is exclusive of the bash environment
    you still have open in the GUI terminal.


    Are you wondering where your GUI desktop has gone? Just to settle your nerves,
    do some jumping around the GUI. The desktop is located at virtual terminal (VT)
    number 7 by default. You now have VT-2 open. Position your piano-playing fingers
    and strike the Ctrl+Alt+F7. Within a second or two, your screen should flash and
    return to your graphical desktop. Neat, huh? And what guess? The bash session
    you left open on VT-2 is still there; you never logged out. Go back again by pressing
    Ctrl+Alt+F2. Voila!—back to where you left it. Feel free to jump back and forth
    a few times and try some other VTs (F1 through F6). Whoopee! This virtual terminal
    stuffs rocks.'
