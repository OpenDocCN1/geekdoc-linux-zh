  md: '# Chapter 5


    # Booting and Stopping Linux


    In This Chapter


    +   - Understanding what happens when you turn on your Linux machine

    - Identifying and isolating boot problems

    - Shutting down safely


    > I work; it fascinates me. I can sit back and look at it for hours.


    Jerome K. Jerome


    If you come here from Chapter 3 or 4, you likely just survived the first gauntlet
    of the Linux world: installing the operating system. I hope that booting for the
    first time worked well. If it did and you decide that most of this chapter isn''t
    for you, at least skip to the last section in this chapter, "Don''t Turn Off the
    Machine! Otherwise, if you''re interested in learning about what your machine
    does as it boots (this chapter can get pretty geek!), read on.


    Your Linux installation failing to boot properly is not necessarily an emergency.
    Much of this chapter is designed to help you with any problems you might run into.
    Before you use Linux, remember that installing an operating system is not a small
    task and because many technical variables are associated with such an installation,
    many computer manufacturers insist on performing the task at the factory. Companies
    as Hewlett Packard and Wal-mart (believe it or not) have been offering Linux pre-installed,
    so if you''re too discouraged at at this point or are reading ahead and are too
    nervous to give it a shot, you can either use Knoppix (see Chapter 4 for how to
    use Knoppix without having to install it) or purchase a pre-installed machine
    from a vendor or a local computer builder.


    To unravel the mystery of a Linux system that won''t boot requires a bit of understanding
    of how your computer starts up.'
