    only run one operating system at a time. In other words, if you''re using Windows
    and want to run Linux, you need to shut down Windows, and then start Linux. However,
    with the additional software, you can run Linux on a Windows system at the same
    time as Windows. You can also run Windows software within Linux itself! See 19
    for more information.


    # Partitioning from scratch for a dual boot


    If you plan to have a fresh hard drive and install both Windows and Linux, be
    sure to install Linux first. While you''re going through the Windows installation,
    you will be asked to partition your drives. Your hard drive can have three primary
    partitions and one extended partition. Inside that extended partition, you can
    have up to 12 logical partitions.


    No matter what type of partition you use for Linux, make sure to leave at least
    3GB open for it. Typically, you''ll want even more, because you may like to download
    big files like media stuff.'
