    # Presentations with OpenOffice.Org


    # Impress


    Most people would rather eat grass than speak in front of a group of people. Still,
    if you have to, you may as well have cool presentation software to back you up.
    This program is what I use when my clients want to send me in my presentation
    in Microsoft PowerPoint format. Shh! Don''t tell — they don''t know the difference!
    Give OpenOffice.org Impress a chance to impress you.


