  md: '# 164 Part II: Internet Now!


    Sometimes, especially when you''re troubleshooting the reason that you can''t
    access your intended Web site, you perform a traceroute that times out somewhere
    along the way. This situation usually indicates that a "traffic accident" has
    occurred somewhere along the information superhighway. Give it a few minutes and
    try again. If you get this problem consistently, it may mean that a site is down
    or a firewall is blocking the traffic.


    # After You''re Connected


    After you''re connected, you''ll probably want to leap straight to Chapter 9 for
    how to use the Internet programs available to you. In the meantime, let me offer
    you a few sites you might find useful when you need help, have questions, or otherwise
    want to explore the Linux world — some of these are pretty geeky, but you''ll
    grow into them! You may also want to update your machine (see Chapter 12), add
    new software (also Chapter 12), and give extra thought to security (see Chapter
    13) to protect yourself from nasty people and programs.


    Useful cites


    +   * www.linuxsecurity.com: A somewhat geeky but useful place you can track what''s
    going on in the world of Linux security.

    * www.kerneltraffic.org: Everything you wanted to know about what''s happening
    with the Linux kernel but were afraid to ask. This place is great for tracking
    what new features are being added, if you''re interested in things like bleeding-edge
    hardware or just like to be "in the know.\n* www.linuxquestions.org: I mention
    this elsewhere in the book, but it''s worth a mention. This site is a hangout
    for people who have questions to ask, and those who like to help them.

    * http://linux-newbie.sunsite.dk/: The Linux Newbie Administrator Guide is a massive
    collection of information that you may find useful.

    * www.tfiles.org: A collection of help files on individual topics of interest.

    * www.tld.org: Contains lots of help documentation written for various user levels.

    * www.slashdot.org: Uber-geek (with a rather hostile culture, unfortunately) hangout
    with lots of pointers to interesting articles online. Best used to view the articles
    and skip the arguments in the comments section.


    In addition to these recommendations, your favorite search site can be very handy.'
  merge: -1
