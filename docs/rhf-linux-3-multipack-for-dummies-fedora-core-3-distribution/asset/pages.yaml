  md: '# About the Author


    Dee-Ann LeBlanc, RHCE (Red Hat Certified Engineer), is a writer, course developer,
    instructor, and trainer who specializes in Linux. She is the gaming industry editor
    for LinuxWorld magazine, and the author of numerous books on Linux and other computer
    topics. Dee-Ann is also a regular contributor to Computer Power User magazine
    and the new Tux magazine dedicated to the Linux desktop, among other publications.
    When Dee-Ann isn''t teaching in person or online classes, developing course materials,
    writing technical nonfiction or fantasy fiction, chatting about Linux online or
    at conferences, trying in one way or another to save the world, she hikes with
    her dogs and experiments on her husband Rob with new recipes. See the latest that
    Dee-Ann''s up to and join her readers'' mailing list at www.Dee-AnnLeBlanc.com.
    (Contact Dee-Ann at dee@renaisoft.com.)'
