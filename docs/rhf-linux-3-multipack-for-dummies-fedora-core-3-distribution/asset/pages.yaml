  md: '# 138 Part I: Getting Your Feet Wet


    +   Xandros: You had the option to add a printer with the First Run Wizard the
    first time your system booted, though, of course you can skip this with no problem.
    If you skipped printer setup, go to the main menu and choose Control Center to
    open the Xandros/KDE Control Center. Click the plus sign next to Peripherals to
    expand this menu and then choose Printers. Choose Add to open the Add Printer
    Wizard box.


    In this section, I describe how to set up a printer on Fedora due to space restrictions.
    although each application is different, they all involve the same basic steps
    for configuration, even though these steps may be in different orders or worded
    a little differently. Follow these steps for Fedora (or if you''re using another
    distribution, read through here and use what you learn to set up your printer
    using the appropriate tool):


    +   1. To access the printing setup tool, from the main menu, choose Applications:
    System Settings: Printing.


    The Printer Configuration window appears, as shown in Figure 7-3. If you''re not
    logged in root, you''re prompted to enter the root password.


    ![](img/82ece24d778fc2b746539fd81bd94284_155_0.png)


    Figure 7-3:

    The opening window of the Printer Configuration tool.


    +   2. To begin setting up your printer, click the New button.


