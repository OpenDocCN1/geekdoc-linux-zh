  md: '# Chapter 20: Ten Troubleshooting Tips


    If you''re using a keyboard without a number pad — as you will be if you''re using
    a laptop — or your machine isn''t set up to be able to change on the fly, you
    need to change your resolution through your display configuration program. You
    can find this option at:


    +   - Fedora: Choose Applications❖:Settings❖:Display.

    - Knoppix: From the main menu, choose Settings❖:Control Center❖Peripherals❖:Display.

    - Linspire: From the main menu, choose Settings❖:Control Panel❖:Look & Feel!

    - Mandrake: From the main menu, choose Settings❖:Configuration❖:Peripherals❖:Display.

    - SUSE: From the main menu, choose Control Center❖:Display.

    - Xandros: Choose Launch❖:Control Center❖:Settings.


    # ## My GUI Is Hung, and I''m Stuck!


    One quick solution to this problem is the key combination Ctrl+Alt+Alt+Backspace.
    If this doesn''t do the trick, your system is in really bad shape! Try to switch
    to a virtual machine by using Ctrl+Alt+F5. If this combination does not, you need
    to reboot the machine.


    # ## Help, My Machine Hangs During Boot!


    When configuring a Linux machine, you may encounter problems with the /etc/grub.conf
    file. This file indicates the operating system or systems to which your system
    can boot, and the file also contains Linux startup settings. Linux can boot from
    any of your hard drives — not just the master IDE drive on the primary IDE drive.
    Consider this list of potential solutions if the /etc/grub.conf file makes:


    +   - If you have altered or added hard drives, you may need to change the boot
    line in the /etc/grub.conf file.

    - If you haven''t made hardware changes, check to make sure that your /etc/grub.conf
    file is referring to the correct location of the Linux image. (The program code
    that loads and executes at runtime is located in the /boot directory.)

    - If the location under the /boot directory or the device for the root entry is
    incorrect, your system can''t boot to Linux. In this situation, a rescue or emergency
    disk is helpful. Refer to Chapter 5 for instructions on using a rescue disk.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# 378 Part V: The Part of Tens


    +   - If you''re working with /etc/multiboot operating system environment, be
    sure that your /etc/grub.conf file contains entries for each of your operating
    systems. Each operating system or Linux installation needs to be in separate entries.


    +   - If your file contains entries to switch to a higher-resolution display and
    you have problems, try reducing the video setting to simple VGA.


    ![](img/82ece24d778fc2b746539fd81bd94284_395_0.png)


    Linux allows you to use spaces and other characters in filenames that you may
    or not be able to use in filenames on other operating systems. However, some Linux
    applications may stumble when they encounter file or directory names containing
    spaces. Usually, a safe bet is to stick with alphanumeric characters and avoid
    spaces and odd characters, such as question marks and exclamation points.


    # # Aargh! I Forgot My Root Password! What Do I Do?


    Fear not. You have a way around this problem! You need to boot into single user
    mode, which you can accomplish by rebooting the machine and doing the following:


    +   - Fedora: If you see a blue screen with the words "Press any key to enter
    the menu," press a key. At the GRUB boot screen, press E which takes a configuration
    file. Use the arrow keys to go to the line with kernel, and press E to edit that
    line. At the end of the line, add the word single, press Enter to put the change
    into place, and then press B to boot the machine.


    +   - Knopix: You don''t need to because you can reboot the machine and start
    over.


    +   - Linspur and SuSE: See Chapter 21 for how to use Knopix to recover your root
    password. Even in single user/failsafe mode, you will need the root password for
    these distributions.


    +   - Mandrake: Reboot the computer and at the boot screen, select Configure (Expert).
    When you reach the Root Password For Maintenance prompt, enter your password.


    +   - Xandros: At the Xandros boot screen, select Configure (Expert). When you
    reach the Root Password For Maintenance prompt, enter your password.


    No what distribution you''re using, now is your chance to change the root password
    to one you can remember. Type passwd twice and then enter the new password as
    directed. When you''re done, type exit and then boot the machine normally.'
  merge: -1
