  md: '# 54 Part I: Getting Your Feet Wet


    Firewalls protect your system from unauthorized access and discovery. When you''re
    connected to the Internet with a high-speed connection, your computer appears
    as one of the hundreds of thousands of other systems on the Internet. I wish I
    could tell you that there aren''t tons of nasty people and programs trying to
    break into your computer, but unfortunately, there''s lots of them. A firewall
    is your first (but not only) barrier against cyberhoods, viruses, worms, and a
    host of others that might try to peek in through doors that should have been kept;
    see the sidebar "Firewalls" for more information.


    +   13. Unless you are 100-percent sure that this computer is safe from the Internet
    and other machines you may on your home or office network (keeping in mind that
    before viruses and worms, most busy computer break-ins happened from inside rather
    than outside), leave Enable Firewall as your firewall setting.


    If you are absolutely determined to have your firewall off, select No Firewall.
