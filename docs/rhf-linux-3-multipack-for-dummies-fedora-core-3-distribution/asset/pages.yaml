  md: '# # Chapter 8


    # # Connecting to the Internet


    In This Chapter


    +   - Understanding common Internet connection methods

    - Setting up your Internet connection

    - Connecting to your Internet Service Provider (ISP)

    - Understanding enough TCP/IP to be dangerous


    > Every improvement in communication makes the bore more terrible.

    — Frank Moore Colby


    You may already be connected to the Internet if you''re on a machine that''s connected
    to a LAN and configured the networking during installation. To test whether you
    have a connection, open a Web browser and try to go to an outside Web site (like
    www.linuxworld.com). If it works, you''re up! No need for this chapter. Otherwise,
    read on.


    # # Internet Connectivity 101


    A few words regarding the broadband options (DSL and cable) are in order before
    I. The word broadband has a technical definition, but I just use it to mean high-speed
    Internet access. Although a dial-up modem can typically transmit information at
    speeds up to 56 kilobits (thousand bits) per second, broadband connections can
    reach 50 times that speed. Nowadays, the Web contains lots of images and multimedia
    elements, and enjoying these features through a 56 kbps dial-up modem is similar
    to drinking a cold glass of water when you''re dying of thirst.


    Don''t let high-speed providers discourage you from using Linux with their services.
    Just because they don''t support Linux directly doesn''t mean that the technology
    doesn''t work with Linux. TCP/IP (the set of traffic rules for the Internet) was
    developed for the Unix operating system, from which Linux descends.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 150 Part II: Internet Now!


    If you have the luxury of dual-booting to Windows, your ISP can help you install
    your broadband connection, and then you can tinker with getting Linux connected
    as you have the time and inclination. I point to some sites that can help you
    configure your broadband connection as you look at the types:


    +   - Cable modem: Many cable television companies have expanded their product
    lines to include Internet access over their cable infrastructure. When you subscribe
    to a Internet service, the installation technician can often provide you with
    a special device, called a cable modem, along with a standard network adapter
    (like an Ethernet card). The technician installs the network adapter into your
    computer and connects the cable modem to it. As far as speeds go, to get the exact
    speeds available, you need to talk to your cable provider. The web page provides
    a document that contains helpful information about various cable providers and
    Linux:


    +   - Integrated Services Digital Network (ISDN): Not long ago, SDN was one of
    the only residential high-speed options. When appeared at 28 Kbps (half the speed
    of today''s regular dial-up modems) was all about what you could milk from the
    copper strands that connected you to the telephone company SDN is still available
    in some areas and promises a steady 128 Kbps - as long as you are within 3.4 miles
    of the telephone company''s central office. You need two special devices to use
    ISDN: an ISDN modem (typically provided by the ISDN ISP) and a net-work adapter
    (typically an Ethernet card). Because ISDN is used so little these days, not many
    specific sites are devoted to it. The overall modem HOWTO (http://tdip.org/HOWTO-HOWTO.html)
    does contain pointers to the latest ISDN information, as well as just plain interesting
    to read.


    ```

    www.tdip.org/HOWTO/Cable-Modem

    ```


    +   - Digital Subscriber Line (DSL): DSL works much like ISDN in that it carries
    data to your phone line in a digital format. DSL is popular because it provides
    a faster connection with lower installation and service costs than ISDN, and it
    utilizes the existing copper telephone wiring provided by your telephone company.
    You can even use the same phone line as a regular phone line! A DSL connection
    requires additional communication hardware, which your Internet Service Provider
    (ISP) should provide.


    Note that several variants of DSL exist:


    +   - ISDL (over an ISDN line) DSL line


    +   - Symmetric Digital Subscriber Line (DSL)


    +   - Generic DSL (XDSL)'
