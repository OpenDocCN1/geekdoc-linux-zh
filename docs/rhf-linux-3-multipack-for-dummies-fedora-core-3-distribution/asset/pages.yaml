  md: '# 156 Part II: Internet Now!


    Sometimes the choice isn''t as obvious as you think. For example, maybe you have
    DSL, but because the DSL connection is going through your Ethernet card, your
    system sees it as a LANEthernet connection. So if you can''t get your connection
    to work, play with these factors.


    Again, I have only so much space, I walk through setup using Fedora. Many of the
    decisions and required pieces of information are the same from distribution to
    distribution, again, if you''re not using Fedora, read through this section and
    use what you find out here to work on your computer.


    # Configuring Your Connection


    With your ISP''s information in hand and a glowing monitor in front of you, follow
    these steps to configure your dial-up connection to the Internet in Fedora:


    +   1. From the GUI desktop, choose Applications: System Settings: Network.

    2. Enter your root profile password in the dialog box, if necessary.


