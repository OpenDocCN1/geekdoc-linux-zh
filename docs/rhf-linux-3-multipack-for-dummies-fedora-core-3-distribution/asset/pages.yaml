  md: '# 410 Part VI: Appendixes


    Both CDs include GPG signatures, allowing the installer to check the contents
    of the files against the stored security data to make sure that the files haven''t
    changed. (The assumption is that all changes would be for the worse, such as Trojan
    horses or viruses). Thus, signatures provide a way to make sure that everything
    is safe and wholesome for your computer!


    ![](img/82ece24d778fc2b746539fd81bd94284_427_0.png)


    # If You''ve Got Problems (Of the DVD-ROM Kind)


    I tried best to locate programs that work on most computers with the minimum system
    requirements, as Red Hat did for its operating system. Alas, your computer may
    differ, and some programs may not work properly for reason.


    The two likewise problems are that you don''t have memory (RAM) for the programs
    you want to use or that you have other programs running that are affecting the
    installation or running of a program. If you see error messages like Not enough
    memory or Setup cannot continue, try one of the methods and then try running with
    your software:


    +   - Close all running programs. The more programs you''re running, the less
    memory is available to other programs. Installers also typically update files
    and programs; if you keep other programs running, the installation may not work
    properly.


    +   - In Linux, close your GUI environment and run directly from a command line.
    The interface itself can tie up system memory or even with certain kinds of interactive
    demos. Use the command prompt to browse files on the DVD-ROM and launch installers
    or demos.


    +   - Have your local computer store add more RAM to your computer. This step
    is indeed, a drastic and potentially expensive one, depending on the price of
    RAM at the time. If you have a modern PC with less than 64MB of RAM, however,
    adding more memory can really help the speed of your computer and enable more
    programs to run at the same time.


    If you still have trouble with the DVD-ROM, call the Wiley Product Technical phone
    number at 1-800-572-3994. Outside the United States, you can also contact Wiley
    Product Technical Support through the Internet at www.wiley.com/techsupport. Wiley
    Publishing provides technical support only for installation and other general
    quality control items; for technical support on the applications themselves, consult
    the program vendor or author.


    To place additional orders or to request information about Wiley products, please
    call 1-800-225-5945.'
