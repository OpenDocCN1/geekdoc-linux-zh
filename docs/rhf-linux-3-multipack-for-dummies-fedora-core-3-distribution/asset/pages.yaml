    # # A Secure Linux Box Is a Happy Linux Box


    **In This Chapter**


    +   * Implementing strong passwords

    * Keeping your system up to date

    * Plugging security holes

    * Using the System Logs Viewer

    * Securing your system by using best practices


    > I am Inspector Clouseau, and I am on official police business.

    — Inspector Clouseau


    You don''t leave the front door of your house open when you go to work, how about
    leaving it shut and locked with a few, big windows open? The problem is many people
    do this every day with their computers, and they don''t even know it! In this
    chapter, I take a look at where your open doors and windows are and what you can
    do to secure them.


    Every user''s actions affect your overall system security. If your family members
    or classmates need access to your Linux machine, take the time to sit down and
    explain the facts of secure life to them. They can then apply this information
    to the other computers they use, because these issues aren''t specific to Linux.


    # # Choosing Secure Passwords


    The first line of defense against intruders is the collection of passwords used
    on your system. For each account you have set up your system, the passwords must
    be strong and difficult to figure out. If even one of the accounts has a weak
    password, you may be in some trouble. Amazingly enough, in 70 percent of the cases
    where unauthorized individuals gain access to'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    systems, the password for an account was the word password itself! When choosing
    good passwords, follow these rules:


    +   - Don''t use any part of your name.

    - Don''t use the names of friends, loved ones, or pets.

    - Don''t use birthdays, anniversaries, or other easily guessed dates.

    - Don''t use dictionary words.

    - Don''t keep your password written down near your computer, unless it''s buried
    in something, such as writing it in an address.

    - Don''t tell anyone your password. If someone needs to access specific files,
    give the person an account and set up permissions and groups properly so they
    can do.

    - Do a mix of lowercase letters, capital letters, and numbers.

    - Do ensure that your password contains a minimum of eight characters.

    - Do use acronyms from sentences, such as having the password M8yodnit to stand
    for "My eight-year-old dog''s name is Tabby".


    Every person on your system needs to follow these rules, including you!

    Considering a sheet of paper with these rules on it next to the machine.


    ![](img/82ece24d778fc2b746539fd81bd94284_281_0.png)


    I can''t stress this advice: Never give out your password. Make sure that the
    people using your machine understand this rule. You can always find alternative
    methods to accomplish a task without giving out your password. If someone wants
    to use your machine, make an account for that person.


    # Updating Software


    All users can download and install new software. Of course, the programs they
    install are limited to the user''s permissions. The thing to be careful of here
    — with any operating system — is that you don''t get a version of a program that
    has been tampered with or even an all-out fake trying to trick folks into installing
    it.


    Most Linux and other Linux software programs are distributed by way of the Internet.
    In fact, the development cycle of new (and updates) to Linux software revolves
    around the Internet for file exchange, e-mail, and forum or newsgroup discussions.
    Make sure that you and other users of your Linux system are comfortable with the
    Web sites that are used and visited. You need to develop a list of trusted sites
    that provide you with the information you need and are not misleading in their
    presentation. As a starting point, you can trust all the Web sites referenced
    in this book because I accessed them all. If you or a user of your Linux system
    is'
