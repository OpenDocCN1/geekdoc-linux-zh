    +   9. If you want to examine more plug-ins, return to Step 3.


    +   10. When you''re finished selecting plug-ins, click Close to close the Preferences
    dialog box.


    You can now access the plug-ins from your gedit menus. Each one is placed in its
    appropriate location: for example, Change Case appears on the Edit menu.


    # Saving your work


    As with programs, you have two choices for saving your work. You can save your
    work and keep going or save it and then close the program. To just save the file
    and keep going, follow these steps:


    +   1. Click the Save button.

    This button looks like a floppy disk. If you''ve never saved this file, clicking
    it opens the Save dialog box.


    +   2. Click the right-facing arrow toward the bottom left.

    The filesystem browser opens.


    +   3. Browse through the directories in the left or right pane you''re in the
    directory where you want to save the file.

    Double-click the name of a directory to enter it or . . in the left pane''s lining
    to move up a level in the directory tree.


    +   4. Type the file''s name in the Selection text box.


    +   5. Click OK to save the file.

    The dialog box closes.


    To close gedit, follow these steps:


    +   1. Choose File: Quit.

    If you haven''t saved this file since the last time you changed it, the Question
    dialog box appears.'
