  md: '# 190 Part II: Internet Now!


    +   - If you can open a Web site but can''t get IM to work, the IM system be unavailable.
    This problem occurs at times because of maintenance of the IM service or an excessive
    amount of traffic on the Internet or on the IM service.


    +   - If you attempt to access the IM service from your computer at work, your
    company or organization may block the IM service for security or productivity
    reasons. Using IM at your work is permitted, check with your network administrator
    to see whether he can help you out.


    +   - Often, companies use firewalls between the company''s network and the Internet
    to keep unwanted traffic on the company''s network. If the firewall is configured
    to block IM traffic, you cannot use IM across the Internet.


    # Working with Other Internet Tools


    You may want to explore a variety of other types of tools, depending on your needs.
    This section covers some pointers to get you started, so if you go to Chapter
    12 and want to add the appropriate software (or find yourself digging through
    menus and wondering what the program may be), you''re completely lost.


    +   - FTP programs: If you want to FTP, a commonly used program in the Linux world
    is GFTP. This program is available for all five distributions discussed in this
    book, although it''s only installed by default in Mandrake. The KDE equivalent
    is KBear.


    +   - IRC programs: While the IM clients support IRC these days, you may prefer
    a program that''s used only for IRC. Common programs for your purpose are X-Chat
    and KIRC.


    +   - File sharing: LimeWire is a program if one want to use the Gnutella network.


    +   - RSS readers: Firefox has a number of RSS extensions designed for it. In
    addition, Straw is a popular RSS program.


    In general, if you''re not sure what programs to use, do a Web search on the type
    of thing you want to do (like RSS) and the word Linux. So, to find all the Linux-based
    file-sharing programs that handle BitTorrent (a popular network for distributing,
    among other things, legal copies of Linux distributions), you can search on


    ```

    file sharing bitorrent linux

    ```'
