    The folks in the section Large are pretty creative about putting together packaging
    options. In the section “Living with Linexpire, earlier in this chapter, I address
    the various ways you can purchase this distribution. In this section, I look at
    the various ways Linexpire is packaged for boxed sets and downloads. I''m not
