  md: '# 66 Part I: Getting Your Feet Wet


    # # Burning your ISOs


    If you end up needing to use the ISO files on the DVD-ROM or that you download
    in order to create CD-ROMs or DVD-ROMs, you have some handy tips that can make
    this process easier for you. First, you need CD burning software, such as the
    Nero program (www.nero.com/en). Once you have a CD burning tool, look at the file
    of the ISO you need to burn. Most ISOs can be burned to 650MB/74 minute: CD-R
    or CD-RW, some are large 700MB/80 minutes. Knoppix is one that needs to burn the
    larger CD-Rs. Another is Mandrake.


    having to throw out a lot of CDs to to the landfills. However, your burner has
    to actually support rewritable files. Look on its front to see whether its CD-R
    (it can''t rewrite), or CD-RW (it can rewrite).


    As you prepare to burn your CD or DVD, make sure that your software understands
    that you want to burn an ISO (often the word you look for is image) and not just
    a file. If you burn your CD or DVD, put it into the drive, open it up, and see
    only one file, you have burned it incorrectly. An ISO should be unpacked onto
    the CD or DVD as a bunch of files and directories.


    When possible, use CD-RWs, because''re rewritable and you''re able to download
    and burn other distributions or newer versions them later. CD-RWs are just a great
    way to avoid


    Finally, it is a good idea to burn these CDs and DVDs at a speed of four or less.
    You reduce your chance of introducing errors this way.


