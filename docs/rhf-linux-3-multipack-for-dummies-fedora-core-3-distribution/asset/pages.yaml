    # Viewing and changing permissions

    Every file in Linux (and other forms of Unix) has a set of permissions that govern
    who is allowed to view it, run it, delete it, and so on. These permissions are
    used to make sure that people can''t mess with the system''s or other''s files,
    they''re pretty important. In this section, I focus on how to work with files
    in the GUI. See the section "A permissions primer," later in this chapter, for
    a breakdown of how file permissions work.


    To view and change a file or directory''s permissions in Nautilus, you need to
    follow these steps:


    +   1. Browse to the file or directory''s location.

    Opening the folder window that contains this item is sufficient.

    2. Right-click the file or directory.

    A context menu appears.

    3. Choose Properties from the context menu.

    The Properties dialog box appears with the Basic tab open.

    4. Click the Permissions tab.

    The Permissions portion of the Properties dialog box appears, as shown in Figure
    10-4.


