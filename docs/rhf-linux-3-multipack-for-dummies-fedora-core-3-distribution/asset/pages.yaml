- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories


    If you find yourself scratching your head when looking at parts of long format
    file listing, don''t worry. The "Comprehending file types" section, in this chapter,
    gives you a feeling for the first letter on each line, but more characters are
    attached to that item before you get to the next column. This group of nine is
    the set of permissions (also called a permission set) for the file or directory.
    Linux, Unix, and Mac OS use permissions as a way of providing file and directory
    security by giving you means to specify exactly who can look at your files, who
    can change them, and even who can run your programs. You need this capability
    when you have a bunch of different users on the same machine, networked to the
    world.


    # Checking out the triads


    Each permission consists of three triads. Each of the triads has the same structure
    but controls a different aspect of who can use what. Consider the long format
    listing for /home/dee in the following code:


    ```

    total 20

    drwx------ 2 dee 4096 Jul 29 07:48

    drwxr-xr-x 5 root root 4096 Jul 27 11:57

    -rw-r--r-- 1 dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee 128 Jul 27 06:50 .bashrc

    -rw-rw-r-- 1 dee 0 Jul 29 07:48 isfile

    ```


    The first character in the directory refers to the type of file. For a directory,
    the character is shown as a d, as you see here for the first items in the preceding
    list; files are designated with a dash (-). Each file or directory''s permission
    is a group of nine characters — that is, nine characters that follow the first
    character (for a total of ten). But this group of nine is really three groups
    of three, as shown in Figure 10-12.


    ![](img/82ece24d778fc2b746539fd81bd94284_228_0.png)


    | R | W | E | | R | W | E | | R | W | E |

    |---|---|---|---|---|---|---|---|---|---||

    | Users | | Groups | | Others |


    Legend:

    R=Read

    W=Write

    E=Execute'
