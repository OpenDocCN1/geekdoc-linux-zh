  md: '# 172 Part II: Internet Now!


    +   **Privacy & Security:** Network security has become a very big issue for everybody
    connected to the Internet. Although the typically nontechnical media sensationalizes
    this issue, security should still be a consideration for all users of the Internet.
    Every time you send an e-mail or click a Web site, you''re exchanging information
    across a network. Although you don''t need to sleep over it, you should be conscious
    of every request you make on the Internet. Even though securing your information
    is impossible, you can readily confident that your exchanged Internet information
    is safe because of the default options that Mozilla provided. See the Popup window
    in particular for how to keep these annoyances from cluttering your screen


    +   **Advanced:** This category provides options that affect the entire Mozilla
    user environment. Options include whether you want to enable Java applets or XSLT
    Web pages. This is also where you can flush your cache — your browser''s memory
    of what you''ve been doing and where you''ve been, but not your bookmarks — establish
    your proxy settings in the Cache and Proxies submenu. (If you never been before
    to use a proxy, you don''t need one.)


    # The dad-gum browser plug-ins


    Do you ever get irritated at those Web sites that install a plug-in, or additional
    piece of software, just to view the site? The difference between a plug-in and
    an external program is this: A plug-in displays the results in the browser, and
    an external program runs outside the browser. Although these plug-ins are annoying
    if you''re just looking for some basic information, they can provide some pretty
    cool stuff, as streaming video and music through your browser.


    Plug-ins provide capability extensions, which are programs that interface with
    the browser to providestandard features, as sound and video. The digital age is
    still in its infancy, so the industry hasn''t yet adopted these multimedia as
    standard. In turn, the developers have chosen not to build support into the Mozilla
    browser. Rather, the plug-in architecture enables developers to innovate without
    requiring the supporting browser to know what to do with newly emerging formats.


    ![](img/82ece24d778fc2b746539fd81bd94284_189_0.png)


    Chapter 12 explains how to add the popular plug-ins (like Macromedia''s Flash
    plug-in) to your system for each of the distributions covered in this book. You
    may also be interested in "helper applications," (Mozilla launches to handle particular
    types of contents, like PDF viewers) which you can configure in the Preferences
    dialog box by opening the Navigator menu and choosing Helper Applications. This
    section lets you tell Mozilla'
