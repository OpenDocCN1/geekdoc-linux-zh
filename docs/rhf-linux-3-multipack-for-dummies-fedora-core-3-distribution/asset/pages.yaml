  md: '# Chapter 4


    # Installing Other Linux

    Distributions


    **In This Chapter**


    +   - Loving Linspire

    - Demystifying Mandrake

    - Getting to know SuSE

    - Xapping your brain with Xandros

    - Discovering even more Linux!


    If you read any of the chapters in the book, you understand that Linux is more
    than just some newfangled computer program. Linux is a fully equipped workshop
    of software tools and building materials that you can use to construct any of
    a wide spectrum of computing solutions. Developing the killer Linux distribution
    has been the Holy Grail of the Linux community. The ultimate Linux distribution
    would provide all the support and capability that the preschool, the rocket scientist,
    the housewife, and the crotchet oily science professor would need to harness the
    power with Linux.


    However, it''s just impossible to make something that absolutely pleases everyone.
    In this chapter, I survey four of the most popular and easiest-to-install distributions.
    Some of these are commercial products, so my hope is that if you''re considering
    one of those, this chapter helps you decide which of these (if not Fedora) meets
    your needs. I don''t cover every aspect of the commercial items, such as how much
    support you get. For more information, see the appropriate Web sites.


    Occasionally in this chapter, I mention burning "ISO image" onto a CD-ROM or DVD-ROM.
    When this subject comes up, refer to the sidebar "Burning ISOs" for tips. When
    I refer to ISO images included in this book''s DVD-ROM, you find these images
    in the DVD-ROM''s `distros` folder.'
  merge: -1
