    # Watchin'' Movies


    These days, you can watch many kinds of movies on your computer. Whether it''s
    a Flash animation, a DVD, or a movie trailer, you''ve got the tools that you need
    right at your fingertips (or just a click away). You may have installed already
    while trying to access other multimedia features. Here are some of the tools of
    the trade.


    Watching a DVD in Linux is a bit of a legal quagmire if you live in the United
    States. The Digital Millennium Copyright Act (DMCA) and other issues make it tricky
    for any open source program to navigate the maze when it comes to movies that
    are encoded or protected in various fashions. However, not all DVDs have such
    countermeasures: There are DVDs that Americans can watch under Linux with no trouble.
    (Note that I say *watch*, and not copy or pirate).


    For on the DMCA and the problems it causes, see anti-dmca.org.


    To watch a DVD in Linux, first check Chapter 11 to see what your distribution
    does if you will put a DVD into your drive. Of course, you can also start a program
    by hand, though you may have to download it first:


    +   - Fedora: Doesn''t ship with any DVD players by default. Use Chapter 12 to
    add repositories so you can install Caffeine, Xine, or Mplayer

    - Knoppix: From the main menu, choose Multimedia:Video media layer.

    - Linspine: Purchase a legal DVD player from the Click And Run Warehouse by going
    to the main menu and choosing Programs: Multimedia & Design: CNR More: DVD Player
    (see Figure 18-7). Or install Mplayer from the same place.


    ![](img/82ece24d778fc2b746539fd81bd94284_373_0.png)'
