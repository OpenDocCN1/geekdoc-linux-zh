  md: '# 16 Part I: Getting Your Feet Wet


    Many have also pointed out that copyright is violated in open source, it is easy
    to tell. Watch the news and notice how often large software corporations are convicted
    of stealing other people''s code and incorporating it into their own work. Tracking
    such copyright violations is incredibly difficult in a closed source scheme.


    # Packaging Linux: The Distribution


    What people call a Linux distribution is actually the culmination of the GNU project''s
    tools, the Linux kernel, and any number of other open source (and closed source)
    software projects that sprang upon the way.


    Robert Young, cofounder and current chairman of Red Hat, has coined an analogy
    comparing Linux to ketchup. Essentially, the operating system called Linux, with
    the GNU tools, Linux kernel, and other software, is a freely available commodity
    that, like ketchup, different distributors can package and label in different
    containers. Anyone is encouraged to package and market the stuff, even though
    the ingredients are fundamentally the same.


    Linux is a complex, malleable operating system, and thus it can take on many appearances.
    The greatest Linux advancement in recent years has been making it easier to install.
    After all, the tools that enable the casual PC user to install Linux originally
    never available. Companies such as Red Hat saw this as an opportunity to add value
    to an existing product, and the concept took off like gangsters.


    To draw on the ketchup analogy, various distributions of Linux have a slightly
    different flavor or texture: your distribution preference might be spicy, mild,
    thick or runny. However, you can rest assured that any of the following distributions
    have the same Linux and GNU heart and soul. Each description includes a Web address
    where you can find more information about each project:


    +   Debian GNU/Linux: This distribution is one of the oldest and is a recognized
    favorite among advanced technical circles. Historically, it''s relatively difficult
    to install. The Debian team works closely with the GNU project and is considered
    the most “open” of the Linux distributions. Easier to install (and use) distributions
    with Debian underneath Xandros and Linsphere (formerly known as Windows).

    www.debian.org

    www.xandros.com

    www.linsphere.com


    +   Mandrake: This distribution demonstrates the power of the GPL by allowing
    this competing company to stand on the shoulders of giants.'
