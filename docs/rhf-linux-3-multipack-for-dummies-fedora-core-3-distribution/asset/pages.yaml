  md: '# # Appendix B


    # # About the DVD-ROM


    The DVD-ROM included with this book contains everything you need to install and
    run Fedora Core 3, Knoppix 3.6, Linscope 4.5, Mandrake 10.1, SuSE9.2, and Xand
    2.5. Collectively, this content is the equivalent of 11 CD-ROMs that you would
    have to download for yourself. Because it can be too confusing to focus on everything,
    the primary focus within this book is to focus on Fedora Core 3. This distribution
    includes the following:


    +   - Fedora Core 3: A complete copy of the software for the latest and greatest
    version of the consumer-level Red Hat, for your computing pleasure. If you are
    interested in the source code, you can download it directly from Red Hat''s Fedora
    Project site at http://fedora.redhat.com. We thought you might not mind us using
    the space that we would have gone to multiple CD''s of source code to include
    lots and lots of other software instead!


    +   - RPM (Red Hat Package Manager): The Red Hat software distribution and installation
    management environment, where Linux updates and new facilities are packaged for
    every installation on your Linux machine.


    +   - KDE (the K Desktop Environment) and GNOME (GNU Network Object Environment):
    The two leading graphical user interfaces for Linux. You can pick the one you
    like best!


    +   - Firefox: The best-of-breed Web browser for your Linux machine, just waiting
    for your surfing pleasure.


    +   - Samba: The best way to integrate Linux servers with Windows users. Samba
    lets your Linux machine masquerade as a Windows server so that Windows users can
    grab files and print documents hassle-free.


    +   - Apache Web Server: The world''s most popular (or at least, most frequently
    used) Web server software.


    +   - Games: Tons of games; enough to help you procrastinate for weeks!


    +   - OpenOffice.org: A full-featured and popular office suite.


    ![](img/82ece24d778fc2b746539fd81bd94284_422_0.png)


    Or, you can download Fedora yourself by going to http://fedora.redhat.com.'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# Part VI: Appendices


    But that''s not all. This DVD also contains the ISO images (the files you can

    use to make your own CDs) for:


    +   - The full version of Linspire 4.5, which you would normally have to buy!

    - A LiveCD (see Chapter 4 for an explanation of a LiveCD) version of the popolar
    SuSE Linux 9.2 distribution, with its default KDE desktop.

    - The "open circulation" (free) version of Xandros 2.5!

    - The full version of Mandrake 10.1, another popular distribution.


    (See Chapters 1 and 4 for more information on these distributions.)


    You can use both Fedora and Knoppix directly off the DVD-ROM. The others

    can use your own CD burning software and (legally) you to write the

    ISO images to CDs. The files are contained with the DVD-ROM''s distros directory.
    If, for some reason, you can''t use the DVD, you can get the distributions discussed
    in this book going to:


    +   - Fedora: http://fedora.redhat.com

    - Knoppix: www.knoppix.net

    - Linspire: www.linspire.com

    - Mandrake: www.mandrake-linux.com

    - SuSE: www.suse.com

    - Xandros: www.xandros.com


    Getting all of these (except Fedora) is covered in more detail in Chapter 4.


    When it comes to burn your CD-ROMs or DVD-ROM, make sure that you

    tell your CD burner with the word "image" (usually the option

    has something to do with the word). If you burn the CD and find

    it contains just one big file (the ISO file), it will not work. The ISO image-

    contains all of the files that were on the CD, so if you put the CD in and

    find that it contains many files, the CD was created properly.


    In addition, if you want the source code for those distributions that are just

    ISO images (Xandros, Linspire, SuSE, and Mandrake) sent to you, please com-

    plete the online coupon at www.dummies.com/go/linux3sourcecoupon.


    ![](img/82ece24d778fc2b746539fd81bd94284_423_0.png)


    # System Requirements


    Make sure that your computer meets the minimum system requirements-\ments. If
    your computer doesn''t match up to most of these requirements, you

    may have problems using the contents of the DVD-ROMs:'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# Appendix B: About the DVD-ROM


    +   A PC with an Intel-compatible Pentium-class processor: I recommend a 400MHz
    Pentium II or better for using Graphical mode, though for a heavy desktop system,
    "more is better."


    +   At least 256MB of RAM: You need at least 192MB of RAM for Graphical mode.
    (Linux can handle as much RAM as you can into a typical PC, and more is almost
    always better than less.)


    +   At least 650MB (the best minimum) of hard drive space: I recommend 2.5GB and
    as much as you want to install all the software from the DVD-ROM. You need less
    space if you don''t install every program, but you should go ahead and make 5GB
    of space available, to give yourself options.


    +   A DVD-ROM drive — double-speed (2x) or faster: The faster the DVD drive, the
    faster your installation. A coupon is offered in this book if you need to order
    CDs to replace the DVD.


    +   Just about any VGA monitor: Just about any monitor does the trick, but you
    want one that''s capable of displaying 256 colors or grayscale.


    +   A keyboard and a mouse: You need both items so that you have a way to communicate
    with your Linux system and tell it what to do!


    +   A 3½inch floppy drive is handy, although not absolutely necessary: You might
    need to start the installer with a floppy, though most people won''t have to.


    +   Some kind of network connection: Again, the faster your internet connection,
    the less time it takes to update your installation to the most recent versions.
    I use a cable modem for my internet connection, and I like the increased speed
    when it comes to dealing with the many and varied sorts of Linux software and
    updates online. See Chapter 8 for the various ways to connect to the Internet.


    If you need more information on PC basics


    # Using the DVD-ROM


    You can take either of two approaches to using the Fedora Core installation DVD-ROM.
    I cover each one in separate step-by-step lists. I tell you in this section how
    to pick which of instructions to follow. The two ways to use this DVD-ROM are
    shown in this list:


    +   If you can boot from your DVD-ROM drive (which probably means you have a newer
    PC), follow the instructions in the following section.


    +   If you can''t boot from your DVD-ROM drive, for whatever reason, follow the
    instructions in the upcoming section "Booting from a Linux floppy disk." Choosing
    this option means that you boot from a Linux boot'
  merge: -1
  pgno: 424
- img_proc: true
  md: '# 408 Part VI: Appendixices


    floppy disk, with the DVD that came with this book already inserted into your
    DVD-ROM drive. (To create a Linux boot floppy disk to enable this approach, please
    check out the instructions in Chapter 2.) The floppy disk handles the beginning
    of the process and then turns the rest of the installation over to the DVD-ROM.


    # Booting from the DVD-ROM


    To install items from the DVD-ROM to your hard drive, follow these steps:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM drive.

    2. Reboot your PC.


    As long as your PC is configured to boot from the DVD-ROM, this step starts the
    Linux installation process for you automatically.

    3. If you want to install Fedora, type `linux` at the boot prompt. If you want
    to boot into Knoppix without having to install anything, just press Enter.


    Congratulations! The Linux installation is now under way, or you''re just about
    to use Linux without having to install a thing. For the rest of the gory details
    on the fascinating task of installing Fedora, please consult Chapter 3. If you
    had to order the CD-ROMs, then boot with the first CD for the same effect as booting
    with the DVD.


    # Booting from a Linux floppy disk


    To install the items from the DVD-ROM to your hard drive with a boot disk (I show
    you how to make one in Chapter 2), follow these steps:


    # ### In case you have a problem

    installing from the DVD


    On some PCs, after booting from the companion DVD, Knoppix and Fedora Core installation
    may not work. If you have such problems with the DVD, you can download Knoppix
    from www.knoppix.net and burn your own CD-ROM from there. For Fedora Core, please
    visit


    www.dummies.com/go/linuxsource coupon to obtain the CD set. Note that this problem
    doesn''t affect the other distributions'' ISO images that are in the DVD''s distros
    directory.'
