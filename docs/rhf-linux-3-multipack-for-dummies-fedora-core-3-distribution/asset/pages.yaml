  md: '# Part I: Getting Your Feet Wet


    # Using LiveCDs


    As I mentioned throughout this chapter (and book), LiveCDs (or bootable distributions)
    are versions of Linux that you can launch directly by rebooting a computer using
    a CD-ROM (or DVD-ROM). The beauty of these versions, from a Linux newbie''s point
    of view, is that you can try something out without actually installing it on your
    system. Old-timers know LiveCDs, too. If a system is broken, rebooting it with
    a LiveCD is a way of giving yourself a “known good” (undamaged) system to work
    from while repairing the damage on the computer itself. Also, many distributions
    offer highly specialized environments for particular tasks ... but I''m getting
    ahead of myself.


    You also need to keep in mind that LiveCDs tend to be slower than a traditionally
    installed system. Everything has to run directly from the CD or DVD-ROM, after
    all.


    Make sure, that you''re able to save things if you need. Doing so requires some
    planning, or at least a bit of thought — Chapter 21 for how to accomplish this.
    When all else fails, I quickly configure the mail client and e-attachments to
    myself. If I get NTFS NTFS images (Chapter 2) from Knoppix to my Fedora machine
    you can also access your real hard drive from a bootable distribution that supports
    NTFS or depends on the version. Knoppix supports NTFS, though it''s best to use
    it as read-only.


    Another popular option with LiveCDs is to use portable storage like USB chains.
    That way, you can carry your keychain and your bootable distribution and have
    access to your preferred environment and your data at the same time. The important
    thing to know about USB storage is that Linux sees these items as SCSI drives,
    so if you access them manually (Chapter 11) you''ll access them as SCSI partitions.
    For example, if you''ve got your USB keychain plugged into the first SCSI slot,
    it would probably be /dev/sdal.


    Finally, not all LiveCDs work with all PCs. The cool thing is that if one doesn''t
    work with yours, you just shrug and download another!


    # Finding Even More Linux


    More than 200 different Linux distributions are available today, with new ones
    being created every year while others fade from existence as the initial enthusiasm
    or funding finding them dwindles away. Many of these distributions are general
    purpose, or at least similar purpose (full desktop, server, and so on), and so
    provide similar base software and surrounding'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'tools to one another with different configurations, documentation, GUI trappings,
    installation procedures, and other bells and whistles. Even then, general-purpose
    distributions serve some markets better than others. For example, TurboLinux is
    popular in Japan, Red Flag Linux is the official choice in China, and Connectivity
    is popular in Spanish-speaking countries. Many special-purpose distributions exist
    as well. LiveCDs fall under this category, but even they fall into categories,
    with some of them (like Knopps) serving the general-purpose segment, others being
    multimedia-focused, etc. To dig through the many distributions available, check
    out DistroWatch (www.distrowatch.org) and let your mouse do the walking over three-hundred
    distributions. If you can''t find enough to choose from here, go to this site''s
    Related Links section, and you can find plenty more.


    If you don''t want to download and burn all this stuff and then know any helpful
    Linux geeks, you may want to look up a local Linux Users Group (LUG). You can
    find a list of LUGs worldwide, listed by geographic region, on the GLUE (Groups
    of Linux Users Everywhere) Web site: www.ssc.com/glue/groups. These folks are
    also happy to help the technologically challenged called demo days or install-fests,
    where you can bring your computer and get all the help you need. These events
    are usually lots of fun for computer enthusiasts — hot- and cold-running caffeine
    and enough know-how to do anything with a computer.'
