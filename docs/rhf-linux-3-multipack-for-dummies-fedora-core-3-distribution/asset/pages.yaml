- img_proc: true
  md: '# Chapter 9: Using the Internet


    Finally, the bottom section of this dialog box allows you to make a few more customization
    tweaks:


    +   - Show Tooltips: When you hover your mouse pointer over a Mozilla option,
    a little tip pops up onto your screen.

    - Show Web Site Icons: Grabs and uses the tiny icons some sites next to your URLs,
    showing them in your bookmarks next to the labels.

    - Smooth Scrolling: Make sure that when you scroll, you''re doing so. Available
    in Fedora Core 3 but not Lin5 or Xandros.

    - Resize Large Images To Fit In The Window: Doesn''t force you to scroll around
    a big image to see the whole thing at once, but instead fits it into the window.
    Underneath Appearances, the remaining entries are:

    - Fonts: Allows you to set your preferred typeface. For desktop resolutions of
    1024 x 768 I recommend jacking your font sizes immediately (Otherwise, become
    very familiar with the key combinations Ctrl+ to make all the fonts in the browser
    bigger, and Ctrl- to make them smaller). Use the + and - on your number pad and
    not your keyboard.

    - Colors: Select your text colors and whether you want to override explicit Web
    page settings. This setting is an important one for color-blind installation.

    - Themes: Allows you to put a custom paint job on your Mozilla installation.

    - Languages/Content: Allows you to set the sidebar preferences of your browser
    to a particular language''s language.


    ![](img/82ece24d778fc2b746539fd81bd94284_186_0.png)


    If you''re not sure about how to use a particular setting, click the Help button
    to open the Mozilla help interface.


    # Navigator preferences


    The Navigator category (see Figure 9-1) enables you to set the behavior of your
    browser when it''s first started. These settings are divided into three sections:
    Display On, Home Page, and Select The Buttons You Want To See In The Toolbars.
    In the first section, the first thing you do is choose which aspect of Mozilla
    you''re setting by choosing one of the following from the drop-down list above
    the radio buttons:


    +   - Navigator Startup: Specify what to do when the main browser window opens.

    - New Window: Specify what to do if you click a link that launches a new window
    or choose File-New--Navigator Window.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# 170 Part II: Internet Now!


    +   - **New Tab**: Specify what to do if you have your browser/Navigator set to
    use tabbed browsing and open a new tab or choose File:New Tab. Tabbed browsing
    reflects the latest craze in Web browser capabilities, especially among those
    who have their desktop cluttered with windows. It allows you to have multiple
    surfing destinations, all in one window, and change between them by clicking tabs.
    See later in this same section for more on tabbed browsing.


    After you''ve selected which item you''re configuring, you can then choose one
    of the following for its default behavior when it launches:


    +   - **Blank Page**: Open this item without opening any pages.

    - **Home Page**: Open this item to my home page.

    - **Last Page Visited**: Open this item to a copy of an open page or the one you
    visited.


    In the Home Page section, you can specify the home page to use for the times you
    want to have a default page loaded. You have one of the following options for
    choosing this page:


    +   - Enter the URL you want to use in the Location text box.

    - Click Choose File and browse to the file (on your computer) that you want to
    use as your default and then click Open to add it to the Location text box.

    - Surf to the page you want to use for your home page and click the Use Current
    Page button to add it to your Location text box.

    - Open multiple tabs and, in each of them, surf to the pages you want to open
    by default. Then click Use Group to have all these tabs added to the Location
    text box. (It actually says “Home Page Group is in the text box.)


    +   - Change the home page back to the last setting you had by restoring Default.
    For memory, it defaults to the hard-coded Fedora Project page.


    Finally, in the bottom section, you can choose which buttons should show in your
    top two Mozilla toolbars (lower toolbar), Go (upper toolbar), Home (lower toolbar),
    Search (upper toolbar), and Print (upper toolbar).


    ![](img/82ece24d778fc2b746539fd81bd94284_187_0.png)


    You can actually control what''s in the lower toolbar with quite a bit of detail,
    by choosing Bookmarks:Manage Bookmarks and then changing what you find in the
    Personal Toolbar Folder. That''s a really fun option to play with!'
