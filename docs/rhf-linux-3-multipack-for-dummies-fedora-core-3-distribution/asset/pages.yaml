  md: '# 370 Part V: The Part of Tens


    +   - Reduce the number of active programs. Stop running unnecessary services
    and applications that aren''t related to the problem at hand. You may more easily
    figure out what''s happening if other services and applications aren''t getting
    in the way.


    +   - Check to see whether the problem is reproducible. Does the same sequence
    of events produce the problem? Suppose that when you try to print to a color printer,
    nothing happens. If nothing every time you attempt to print, the problem is reproducible.
    If, instead, sometimes your information is printed and at other times it isn''t,
    the problem isn''t the same and isn''t reproducible—or it''s caused by something
    more complicated than just clicking one button. Unfortunately, problems that are
    nonproducible are more difficult to resolve because it seems that no pattern of
    events re-creates these problems.


    After you''ve come with a solution, take a few moments to document the situation.
    Note the symptoms of the problem, its cause, and the solution you implement. Next
    the time you encounter the same problem, you can call on your notes for a solution
    rather than reinvent the wheel.


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you do. Making a backup of your /etc directory and your /boot directory
    is a great place to start.


    ![](img/82ece24d778fc2b746539fd81bd94284_387_0.png)


    # "The Linux Installer Froze"


    When you''re installing Linux, the installation may just freeze. If it does, wait
    a bit and make sure that the installation program really freezes. (Sometimes,
    the software just takes a while to process information.) If the software has it
    frozen, there''s no harm in rebooting your computer and starting over—just as
    you would with any operating system installation. Sometimes, you can reboot and
    never have that problem again. At other times, the problem may have happened twice
    in a row and be the third time before giving up.


    If the installation freezes in the same spot or close to the same spot, go to
    the distribution''s support pages (Chapter 2). These pages talk about some known
    problems and solutions that can help you and show you how to join discussion lists
    in order to get more assistance. Otherwise, diagnosing the problem can be tricky
    and may seem more like voodoo science. Here are some tips:


    +   - If this problem happens repeatedly at the same spot, you may have a bad
    installation disk. If you''re a Fedora Core or Red Hat Linux user, see the next
    section, "For Fedora Core Users," and then return here if that technique doesn''t
    solve your problem. Otherwise, try the disk in another machine if possible and
    see whether the installation'
