    So, you might type /prompt and press Enter to jump down to the first instance
    of this word. If the text around the word doesn''t reflect what you''re looking
    for, you''d press the N key to jump to the next one, and so on.


    # Getting Help


    When you''re digging around for help on a command, you can call on an interesting
    range of shell commands for assistance, as shown in Table A-3.


    | Table A-3 | Shell Help Commands |

    | Command | Purpose |

    | apropos | Looks for commands that contain a keyword in their man page descriptions.
    |

    | info | One way of finding help information. You can find instructions for this
    at www.gnu.org/software/texinfo/manual/ |

    | man | The primary way of getting help in Linux and Unix. |

    | whatis | Gets a one-line description of a command.


    Locating details about the command-prompt options of a command is a never-ending
    pursuit. The man page system provides some helpful guides at your fingertips for
    rapidly finding this detailed information.'
  merge: -1
