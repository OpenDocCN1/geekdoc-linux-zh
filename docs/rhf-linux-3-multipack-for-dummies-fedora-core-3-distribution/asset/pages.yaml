  md: '# Chapter 2: Prepping Your Computer for Linux


    little quite a lot. Some newer systems may display several screens of information
    about the computer''s hardware.


    To access the BIOS, you need to do so before any operating systems load. Most
    manufacturers indicate the keyboard key or sequence to get into the BIOS, or Setup,
    or on the screen when the system is starting up — for example, Press Del to enter
    Setup. If you can''t find the keyboard sequence, check the manufacturer''s Web
    site. After you''ve entered the BIOS, you typically navigate around with the arrow
    keys, Tab key, or Enter key. In some BIOS environments, the function keys are
    also used. Look for a list of function keys on the top or bottom of the screen.


    You especially need to be cautious of labels on hardware boxes and Web sites that
    include the term Win (as in Windows). These components, such as WinModem, don''t
    contain all the configuration and software to the hardware — even worse, there
    may be nothing on the packaging that suggests this limitation. These components
    are designed to use the Windows operating system to handle the load. Only a very
    slight chance exists that you can find a Linux driver for Win hardware. If you
    can''t find a driver and you do need to use a modem, put a little cash and get
    a modem that is supported properly. For more information about WinModems, see
    Chapter 8.


    ![](img/82ece24d778fc2b746539fd81bd94284_54_0.png)


    # Finally, Finally Before You Get Started


    No matter what Linux distribution you choose, it probably comes with a bootable
    first CD (out of the CD set) or DVD — Fedora, the distribution included with this
    book, comes on a bootable DVD, and if use the coupon to get the CDs, the CD is
    also bootable. A boxed set might also come with some floppy disks. You probably
    won''t need the floppy disks, but maybe people do. If you''ve ever booted your
    system from a CD or DVD, you''ll have no problem booting from the Linux installation
    CD. You can find this information in your BIOS, in the section that lets you tell
    the machine which storage devices (drives) to check at boot time. If CD-ROM or
    DVD-ROM isn''t listed in the options, Chapters 3 and 4 show you how to make an
    installer boot floppy for your distribution.


    ![](img/82ece24d778fc2b746539fd81bd94284_54_1.png)


    If you have to make changes in your BIOS, make sure to save them when you exit!
    It''s easy to forget and end up wondering why the machine isn''t doing what you
    told it to do.


    Now, before you go any further, there''s one more thing you want to do: Locate
    your Linux distribution''s documentation. These manuals will help you get past
    installation roadblocks and contain lots of useful information'
