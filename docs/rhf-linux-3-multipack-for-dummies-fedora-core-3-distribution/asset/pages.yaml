  md: '# Chapter 7: Configuring Linux


    In this section, I look at the configuration tools available in each version of
    Linux covered in this book. An important thing to note is that the Control Panels
    in each KDE-default distributions (all but Fedora) all look (and work) in very
    similar manners because they''re all based on the main KDE Control Panel.


    # Knoppix tools


    Knoppix comes with many tools that it''s easy to get lost as you stagger around
    the menus, overwhelmed. The main place to find configuration tools in this distribution
    is by choosing KNOOPPIX from the main menu (the K in the bottom left corner).
    This inside menu is a set of submenus, of which other offer configuration options:


    +   **Configure**: Options for setting up your TV card, printers, a real home
    directory that sticks around between the times you boot with distribution (see
    Chapter 21), and more.

    * **Network/Internet**: Internet connection (see Chapter 8) programs for everything
    from ISDN.

    * **Services**: Options for starting servers useful on the desktop, such as SSH
    (see Chapter 13) and Samba for offering Linux files to your Windows machines over
    your network.


    In addition to this location, you also find configuration programs by choosing
    settings from the main menu:


    +   **Change Password**: This program lets you set a password for the account
    you are logged under. However, it doesn''t accept a blank password, and the defaults
    for kinda logins (the regular `knoppix` account and the `root account`) are both
    empty passwords. You''ll want to open a virtual terminal (see Chapter 14) and
    type `passwd` in order to set an initial password for your account before you
    use the GUI tool.

    * **Configure Panel**: This panel lets customize your panel — moving it elsewhere,
    hiding it, changing its appearance, and so on.

    * **Control Center**: This option opens the KDE Control Center.

    * **Desktop Settings Wizard**: This option opens the KDE setup wizard.

    * **Menu Editor**: This option opens the KDE Menu Editor, where you can customize
    your menu contents.

    * **Menu Updating Tool**: This option searches your system for particular programs
    and adds them to your menus if they''re not there.

    * **Printing Manager**: This program (see Figure 7-5) opens a handy print manager
    that can help you do things like printing to PDFs, sending to fax machines, and
    so on.'
