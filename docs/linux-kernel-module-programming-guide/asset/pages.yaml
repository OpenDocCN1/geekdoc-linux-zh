- pgno: 110
  md: '# Appendix A


    # Changes between 2.0 and 2.2


    I don''t know the entire kernel well enough to document all of the changes. In
    the course of converting the examples (or actually, adapting Emmanuel Papirakis''
    changes) I came across the following differences. I listed all of them together
    to help module programmers, especially those who learned from previous versions
    of this book and are most familiar with the techniques I use, convert to the new
    version.


    An additional resource for people who wish to convert to 2.2 is in http://www.atnf.csiro.au/~rgooch/linux/docs/porting-to-2.2.html.


    +   1. asmac.h If you need put_user or get_user you have to #include it.

    2. get_user In version 2.2, get_user receives the pointer into user memory and
    the variable in kernel memory to fill with the information. The reason for this
    is that get_user can read two or four bytes at a time if the variable we read
    is two or four bytes long.

    3. file_operations This structure now has a flush function between the open and
    close functions.

    4. close in file_operations In version 2.2, the close function returns an integer,
    so it''s allowed to fail.

    5. write and read in instead of size_t The headers for these functions changed.
    They now return ssize_t instead of an integer, and their parameter list is different.
    The inode is no longer a parameter, and on the other hand the offset into the
    file.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   6. proc_register_dynamic This function no longer exists. Instead, you call
    the regular proc_register and put zero in the inode field of the structure.


    +   7. Signals The signals in the task structure are no longer a 32 bit integer,
    but an array of _NSIG_WORDS integers.


    +   8. queue_task_irq Even if you want to schedule a task to happen from inside
    an interrupt handler, you use queue_task, not queue_task_irq.


    +   9. Module Parameters You no longer declare module parameters as global variables.
    In 2.2 you have to also use MODULE_PARM to declare their type. This is a big improvement,
    because it allows the module to receive string parameters which start with a digits,
    for example, without getting confused.


    +   10. Symmetrical Multi-Processing The kernel is no longer inside one huge spinlock,
    which means that kernel modules have to be aware of SMP.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Appendix B


    # Where From Here?


    I could easily have squeezed a few more chapters into this book. I could have
    added a chapter about creating new file systems, or about adding new protocols
    stacks (as there''s a need for that — you''d have to dig under ground to find
    a protocol stack not supported by Linux). I could have added explanations of the
    kernel mechanisms we haven''t touched upon, such as bootstrapping the kernel or
    the disk interface.


    However, I chose not to. My purpose in writing this book is to provide initiation
    into the mysteries of kernel module programming and to teach the common techniques
    for that purpose. For people seriously interested in kernel programming, I recommend
    the list of kernel resources at http://jungla.dit.ump.es/~jmsayas/linux/kernel/hackers-docs.html.
    Also, as Limis said, the best way to learn the kernel is to read the source code
    yourself.


    If you''re interested in more examples of short kernel modules, I recommend Phrack
    magazine. Even if you''re not interested in security, and as a programmer you
    should be, the kernel modules there are good examples of what you can do inside
    the kernel, and they''re short enough not require too much effort to understand.


    I hope I have helped you in your quest to become a better programmer, or at least
    to have fun through technology. And, if you do write useful kernel modules, I
    hope you publish them so I can use them too.'
  merge: -1
  img_proc: true
