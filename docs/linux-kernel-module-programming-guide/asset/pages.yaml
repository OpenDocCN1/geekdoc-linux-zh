  md: '# Chapter 6


    # Startup Parameters


    In many of the previous examples, we had to hard-wire something into the kernel
    module, such as the file name for /proc files or the major device number for the
    device so we can have ioctl() to it. This goes against the grain of the Unix,
    and Linux, philosophy which is to write flexible program, or a kernel module the
    user can customize.


    The way to tell a program, or a kernel module, something it needs before it can
    start working is command line parameters. In the case of kernel modules, we don''t
    get argc and argv— instead, we get something better. We can define global variables
    in the kernel module and insmod will fill them for.


    In this kernel module, we define two of them: str1 and str2. All you need to do
    is compile the kernel module and then run insmod str1=xxx str2=yyy. When init_module
    is called, str1 will point to the string ''xxx'' and str2 to the string ''yyy''.


    In version 2.0 there is no type checking on arguments¹. If the first character
    of str or str2 is a digit the kernel will fill the variable with the value of
    the integer, rather than a pointer to the string. If a real situation you have
    to check for this.


    On the other hand, in version 2.2 you use the macro MACRO_PARM to tell insmod
    that your parameters, its name and type. solves the type problem and allows kernel
    modules to begin with a digit, for example.


    ```

    param.c

    ```


    > ¹There can''t be, since C the object file has only the location of global variables,
    not their type. That is why header files are necessary'
