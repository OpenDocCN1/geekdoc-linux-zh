  md: 'system is in an unknown state. The solution to this problem is the interrupt
    handler to do what needs to be done immediately, usually reading something from
    the hardware or something to the hardware, and then schedule the handling of the
    new information at a later time (this is called ‘bottom half’) and return. The
    kernel is guaranteed to call the bottom half as soon as possible — and when it
    does, everything allowed in kernel modules will be allowed.


    The way to implement this is to call `request_irq` to get your interrupt handler
    called when the relevant IRQ is received (there are 16 of them on Intel platforms).
    This function receives the IRQ number, the name of the function, flags, a name
    for `/proc/interrupts` and a parameter to pass to the interrupt handler. The flags
    can include `SA_SHIRQ` to indicate you''re sharing the IRQ with other interrupt
    handlers (usually because a number of hardware devices sit on the same IRQ) and
    `SA_INTERRUPT` to indicate this is a fast interrupt. This function will only succeed
    if there isn''t already a handler on this IRQ, or if you''re willing to share.


    Then, from within the interrupt handler, we communicate with the hardware and
    use `queue_task_irq` with `tg_immediate` and `mark_bh(BH_IMMEDIATE)` to schedule
    the bottom half. The reason we cannot use `queue_task` in version 2.0 is that
    the interrupt might happen right in the middle of someone''s `queue_task`. We
    need `mark_bh` because earlier versions of Linux only had an array of 32 bottom
    halves, and now one of them (`BH_IMMEDIATE`) is used for the linked list of bottom
    halves for drivers which didn''t get a bottom half entry assigned.


    # 11.1 Kernels on the Intel Architecture


    > Warning: The test this chapter is completely Intel spec. If you''re not running
    on an Intel platform, it will not work. Dont even try to compile the code here.


    I had a problem with writing the sample code for this chapter. On one hand, for
    an example to be useful to use it on everybody''s computer with meaningful results.
    On the other hand, the kernel already includes device drivers for all of the common
    devices, and those device drivers won''t coexist with what I''m going to write.
    The solution I found was to write something for the keyboard interrupt, and disable
    the regular keyboard interrupt handler file. Since it is defined as a static symbol
    in the kernel source files (specifically, `drivers/char/keyboard.c`), there is
    no way to restore it. Before insmoding this code, on another terminal `sleep 120
