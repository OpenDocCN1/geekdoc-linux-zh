  md: '# Chapter 7


    # System Calls


    So far, the only thing we''ve done was to use well defined kernel mechanisms to
    register /proc files and device handlers. This is fine if you want to do something
    the kernel programmers thought you''d want, such as write a device driver. But
    if you want to do something unusual, change the behavior of the system in some
    way? Then, you''re mostly on your own.


    This is when kernel programming gets dangerous. While writing the example below,
    I killed the open system call. This meant I couldn''t open any files, I couldn''t
    run any programs, and I couldn''t shut down the computer. I had to pull the power
    switch. Luckily, nothing died. To ensure you lose no files, please sync right
    before you do the insmod and rmod.


    Forget /proc files, about device files. They''re just details. The real process
    to kernel communication, the one used by processes, is system calls. When a process
    requests a service from the kernel (such as opening a file, forking to a new process,
    or requesting memory), this is the mechanism used. If you want to change the behaviour
    of the kernel in interesting ways, this is the place to do it. By the way, if
    you want to see which system calls a program uses, run strace <arguments>


    In general, a process is not supposed to access the kernel. It can''t access kernel
    memory and it can''t call kernel functions. The hardware of the CPU enforces this
    (that''s reason why it''s called ''protected mode''). System calls are an exception
    to this general rule. What happens is that the process fills the registers with
    the appropriate values and then calls a special instruction which jumps to a previously
    defined location in the'
