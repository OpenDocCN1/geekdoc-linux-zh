    # Interrupt Handlers


    Except for the last chapter, everything we did in the kernel so far we''ve done
    as a response to a process asking for it, either by dealing with a special file,
    sending an `ioctl`, or issuing a system call. Another job, which is every bit
    as important, is to speak to the hardware connected to the machine.


    There are two types of interaction between the CPU and the rest of the computer''s
    hardware. The first type is when the CPU gives orders to the hardware, the other
    is when the hardware needs to tell the CPU something. The second, called interrupts,
    is much harder to implement because it has to be dealt with convenient for the
    hardware, not the CPU. Hardware devices typically have a very small amount of
    ram, and if you don''t read their information when available, it is lost.


    Under Linux, interrupts are called IRQs (short for *Interrupt Requests*). There
    are two types of IRQs, short and long. A short IRQ is one which is expected to
    take a very short period of time, during which the rest of the machine will be
    blocked and no other interrupts will be handled. A long IRQ is one which can take
    longer, and during which interrupts may occur (but not interrupts from the same
    device). If all possible, it''s better to declare an interrupt handler to be long.


    When the CPU receives an interrupt, it stops whatever it''s doing (unless it''s
    processing a more important interrupt, in which case it will deal with this only
    when the more important one is done), saves certain parameters on the stack and
    calls the interrupt handler. This means that things are not allowed in the interrupt
    handler itself, because the


    > This is standard nomenclature on the Intel architecture where Linux originated.'
