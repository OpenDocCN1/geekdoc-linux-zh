  img_proc: true
- pgno: 36
  md: 'for that is that read and write refer to the user''s point of view — if a process
    reads something from the kernel, then the kernel needs to output it, and if a
    process writes something to the kernel, then the kernel receives it as input.


    Another interesting point here is the module_permission function. This function
    is called whenever a process tries to do something with the /proc file, and it
    can decide whether to allow access or not it is only based on the operation and
    the use of the current (as available in current, a pointer to a structure which
    includes information on the currently running process), but could be based on
    anything we like, such as what other processes are doing with the same file, or
    the last input we received.


    The reason for put_user and get_user is Linux memory (under Intel architecture,
    it might be different under other processors) is segmented. This means that a
    pointer, by itself, does not reference a unique location in memory, only a location
    in a memory segment, and you need to know which memory segment is to be able to
    use it. There is one memory segment for the kernel, and each of the processes.


    The only memory segment accessible to a process is its own, so when writing regular
    programs to run as processes, there''s no need to worry about segments. When you
    write a kernel module, normally you need to access the kernel memory segment,
    which is handled automatically by the system. However, when the content of a memory
    buffer needs to be passed between the currently running process and the kernel,
    the kernel function put_user and get_user macros allow you to access that memory.


