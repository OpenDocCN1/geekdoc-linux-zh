- pgno: 15
  md: '# # Chapter 2


    # # Character Device Files


    So, now we''re bold kernel programmers and we know how to write kernel modules
    to do nothing. We feel proud of ourselves and we hold our heads up high. But somehow
    we get the feeling that something is missing. Catatomic modules are not much fun.

    There are two major ways for a kernel module to talk to processes. One is through
    device files (like the files in the `/dev/` directory), the other is to use the
    proc file system. Since one of the major reasons to write something in the kernel
    is to support some kind of hardware device, we''ll begin with device files.

    The original purpose of device files is to allow processes to communicate with
    device drivers in the kernel, and them with physical devices (modems, terminals,
    etc.). The way this is implemented is the following:

    Each device driver, which is responsible for some type of hardware, is assigned
    its major number. The list of drivers and their major numbers is available in
    `/proc/devices`. Each physical device managed by a device driver is assigned a
    minor number. The `/dev` directory is supposed to include a special file, called
    a device file, for each of devices, whether or not it''s really assigned on the
    system

    For example if you do `ls /dev/hd*`, you see all of the IDE hard disk partitions
    which might be connected to a machine. Notice that all of them use the same major
    number, 3, but the minor number changes from one to the other Disclaimer: This
    assumes you''re using a PC architecture. I don''t know about devices on Linux
    running on other architectures.

    When the system was installed, all of these device files were created by the `mknod`
    command. There''s no technical reason why they have to be in the `/dev` directory,
    it''s just'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'a useful convention. When creating a device file for testing purposes, as with
    the exercise here, it would probably make more sense to place it in the directory
    where you compile the kernel module.


    Devices are divided into two types: character devices and block devices. The difference
    is that block devices have a buffer for requests, so they can choose by which
    order to respond to them. This is important in the case of storage devices, where
    it''s faster to read or write sectors which are close to each other, rather than
    those which are further apart (whereas character devices can only accept input
    and return output in blocks whose size varies according to the device, whereas
    devices are allowed to use as many or as few bytes as they like. Most devices
    in the world are character, because they don''t need this type of buffering, and
    they don''t operate with a fixed block size. You can tell whether a device file
    is a block device or character device by looking at the output of ls -l. - if
    it''s ''b'' then it''s a block device, and if it''s ''c'' then it''s a character
    device.


    This module is divided into two parts: The module part registers the device and
    the device driver part. The init_module function calls module_register_chrdev
    to add the device to the kernel''s character driver table. It also returns the
    major number to be used for the driver. The cleanup_module function deregisters
    it.


    This registering and unregistering it is the general functionality of those two
    functions. In the kernel don''t run on their own initiative, like processes, but
    are called, by system calls or, by hardware devices via interrupts, or by other
    parts of the kernel (simply by calling functions). As a result, when you add code
    to the kernel, you are supposed to register it as the handler for a certain type
    of event and when you remove it, you are supposed to unregister it.


    The device driver is composed of the four device,<action> functions, which are
    called when somebody tries to do something with a device file which has our major
    number. The kernel knows to call them via the file_operations structure, Fops,
    was given when the device was registered, which includes pointers to those functions.


    Another point to remember here is that we cannot allow the kernel module to be
    removed without freeing it. The reason is that if the device file is opened by
    a process and then we remove the kernel module, using the file would cause a call
    to the memory location where the appropriate function (read/write) used to be.
    If we''re lucky, no other code was loaded there, and we''ll get an ugly error
    message. If we''re unlucky, another kernel module was loaded into the same location,
    which means a jump into the middle of'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'another function within the kernel. The results of this would be impossible
    to predict, but they can’t be positive.


    Normally, when you don''t want to allow something, you return an error code (a
    negative number) from the function which is supposed to do it. With `cleanup_module`
    that is impossible because it''s a void function. Once `cleanup_module` is called,
    the module is dead. However, there is a use counter which counts how many other
    modules are using `/proc/modules`. If this number isn''t zero, rmmod will fail.
    The module’s reference count is available in the variable `moduse_count_`. Since
    there are macros defined for handling this variable (`MOD_INC_USE_COUNT` and `MOD_DEC_USE_COUNT`),
    we prefer to use them, rather than `moduse_count`, directly, so we’ll be safe
    if the implementation changes in the future.


