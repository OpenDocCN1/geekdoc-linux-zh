- pgno: 10
  md: "+   - _KERNEL_ — This tells the header files that this code will be run in\
    \ kernel mode, not as part of a user process.\n\n+   - MODULE — This tells the\
    \ header files to give the appropriate definitions for a kernel module.\n\n+ \
    \  - LINUX — Technically speaking, this is not necessary. However, if you ever\
    \ want to write a serious kernel module which will compile on more than one operating\
    \ system, this will allow you to do conditional compilation on the parts which\
    \ are OS dependant.\n\nThere are other symbols which have to be included, or not,\
    \ depending on the flags the kernel was compiled with. If you're not sure how\
    \ the kernel was compiled, look it up in /usr/include/linux/config.h\n\n+   -\
    \ _SMP_ — Symmetrical MultiProcessing. This has to be defined if the kernel was\
    \ compiled to support symmetrical multiprocessing (even if it's running on one\
    \ CPU). If you use Symmetrical MultiProcessing, there are other things you need\
    \ to do (see chapter 12).\n\n+   - CONFIG_MODVERSIONS — If CONFIG_MODVERSIONS\
    \ was enabled, you need to have it defined when compiling the kernel module and\
    \ to include /usr/include/linux/modversions.h. This can also be done by the code\
    \ itself.\n\n# Makefile\n\n# Makefile for a basic kernel module\n\n```\nCC=gcc\n\
    MODCFLAGS :=-Wall -DMODULE -D__KERNEL__ -DLUX\n\nhello.o: hello.c /usr/include/linux/version.h\n\
    \t$(CC) $(MODCFLAGS) -c hello.c\n\techo insmod hello.o to turn it on\n\techo rmmod\
    \ hello to turn it off\n\techo\n\techo X and kernel programming do not mix.\n\
    ```"
