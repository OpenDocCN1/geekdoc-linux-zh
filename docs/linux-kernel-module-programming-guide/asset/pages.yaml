  md: '# # Linux Kernel Module Programming Guide


    1999 Ori Pomerantz


    Version 1.1.0, 26 April 1999.


    This book is about writing Linux Kernel Modules. It is, hopefully, useful for
    programmers who know C and want to learn how to write kernel modules. It is written
    as an ‘How-To’ instruction manual, with examples of all the important techniques.


    Although this book touches on many points of kernel design, it is not supposed
    to fulfill that need — there are other books on this subject, both in print and
    in the Linux documentation project.


