- pgno: 46
  md: '# Chapter 5


    # Talking to Device Files (writes and IOCTLs)


    Device files are supposed to represent physical devices. Most physical devices
    are used for output as well as input, so there has to be some mechanism for device
    drivers in the kernel to get the output to send to the device from processes.
    This is done by opening the device file for input and writing to it, just like
    writing to a file. In the following example, this is implemented by write.


    This is not always enough. Imagine you had a serial port connected to a modem
    (even if you have an internal modem, it is still implemented from the CPU''s perspective
    as a serial port connected to a modem, so you don''t have to tax your imagination
    too). The natural thing to do would be to use the device file to write things
    to the modem (either commands or data) and read things from the modem (responses
    for commands or the data received through the phone line). However, this leaves
    the question of what to do when you need to talk to the serial port itself, for
    example to send the rate at which such data is sent and received.


    Control in Unix is to use a special function called ioctl (short for input output
    control). Every device has its own ioctl commands, which can be read by ioctl''s
    (to send information from a process to the kernel), write ioctl''s (to return
    information to a process), 1 both or neither. The ioctl function is called with
    three parameters: the descriptor of the appropriate device file, the ioctl number,
    and a parameter, which is of type


    > Notice that the roles of read and write are reversed, so in ioctl''s read is
    to send information to the kernel and write is to receive information from the
    kernel.'
