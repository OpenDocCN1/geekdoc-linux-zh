    # Replacing printk’s


    In the beginning (chapter 1), I said that X and kernel module programming don’t
    mix. That''s true while developing the kernel module, but in actual use you want
    to be able to send messages to whichever tty¹ the command to the module came from.
    This is important for identifying errors after the kernel module is released,
    because it will be used through all of them.


