  - "[PAGE 8]\n\n# # Chapter 1\n\n# # Hello, world\n\nWhen the first caveman programmer\
    \ chiseled the first program on the walls of the first computer, it was a program\
    \ began to paint the string 'Hello, world' in Antelope pictures. Roman programming\
    \ textbooks began with the 'Salut, Mundi' program. I don't know what happens to\
    \ people who break with this tradition, and I think it's safer not to find out.\n\
    \nA kernel module has to have at least two functions: init_module which is called\
    \ when the module is inserted into the kernel, and cleanup_module which is called\
    \ just before it is removed. Typically, init_module either registers a handler\
    \ for something with the kernel, or replaces one of the kernel function with its\
    \ own code (usually code to do something). The cleanup_module function is supposed\
    \ to undo whatever init_module did, so the module can be unloaded safely.\n\n\
    ```\nhelloc\n/* hello.c\n * Copyright (C) 1998 by Ori Pomerantz\n *\n * \"Hello,\
    \ world\" - the kernel module version.\n */\n\n/* The necessary header files */\n\
    /* Standard in kernel modules */\n#include <linux/kernel.h>    /* We're doing\
    \ kernel work */\n```"
  - "[PAGE 9]\n\n```\n#include <linux/module.h>  /* Specifically, a module */\n```\n\
    \n```\n/* Deal with CONFIG_MODVERSIONS */\n#if CONFIG_MODVERSIONS==1\n#define\
    \ MODVERSIONS\n#include <linux/modversions.h>\n#endif\n```\n\n```\n/* Initialize\
    \ the module */\nint init_module()\n{\n    printf(\"Hello, world - this is the\
    \ kernel speaking\\n\");\n\n    /* If we return a non zero value, it means that\
    \ */\n    * init_module failed and the kernel module\n    * can't be loaded */\n\
    \    return 0;\n}\n```\n\n```\n/* Cleanup - undid whatever init_module did */\n\
    void cleanup_module()\n{\n    printf(\"Short is the life of a kernel module\\\
