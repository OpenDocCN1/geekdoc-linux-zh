    \n## 第 3 章\n\n## /proc 文件系统\n\n在 Linux 中，内核和内核模块有一种用于向进程发送信息的额外机制——`/proc` 文件系统。它最初的设计是为了方便地访问有关进程的信息（因此得名），现在它被内核中每一个有有趣报告内容的部分使用，例如\
    \ `/proc/modules`（包含模块列表）和 `/proc/meminfo`（包含内存使用统计）。\n\n使用 `proc` 文件系统的方法与使用设备驱动程序的方法非常相似——你创建一个包含\
    \ `/proc` 文件所需所有信息的结构体，包括指向任何处理函数的指针（如果只有一个函数，则是当有人尝试读取 `/proc` 文件时调用的那个函数）。然后，`init_module`\
    \ 注册该结构体，`cleanup_module` 注册它。\n\n我们使用 `register_dynamic` 的原因是我们不想确定用于我们文件的索引节点（index-node），而是让内核来决定，以防止冲突。普通文件系统位于磁盘上，而不是仅仅在内存中（`/proc`\
    \ 所在的位置），在这种情况下，索引节点是一个指向磁盘位置的指针，该文件的索引节点（inode for for）位于该磁盘位置。该节点包含有关文件的信息、文件权限，以及指向可以找到文件数据的磁盘位置或多个位置的指针。\n\
    \n由于在文件被打开或关闭时我们不会被调用，因此在该模块中我们没有地方放置 `MOD_INC_COUNT` 和 `MOD_DEC_COUNT`，而且如果文件被打开且模块被移除，就没有办法避免后果了。在下一章中，我们将看到一种更复杂但更灵活的处理\
    \ `/proc` 文件的方法，它将允许我们防止防止这个问题。\n\n> 在 2.0 版本中，在 2.2 版本中，如果我们将节点设置为 0，就可以完成这一点。\n\
    \n### procfs.c\n\n```\n* procfs.c - 在 /proc 中创建一个“文件”\n* 版权所有 (C) 1998-1999 由\
    \ Ori Pomerantz\n*/\n```\n\n```\n* 必要的头文件 */\n\n* 内核模块的标准头 */\n#include <linux/kernel.h>\
    \ / * 我们正在进行内核工作 */\n#include <linux/module.h> / * 具体地，一个模块 */\n```\n\n```\n*\
    \ 处理 CONFIG_MODVERSIONS */\n#if CONFIG_MODVERSIONS==1\n#define MODVERSIONS\n#include\
    \ <linux/modversions.h>\n#endif\n```\n\n```\n* 因为我们使用了 proc fs */\n#include <linux/proc_fs.h>\n\
    ```\n\n```\n* 在 2.2.3 中，/usr/include/linux/version.h 包含一个\n* 用于此的宏，但 2.0.35 没有，所以如果有必要\n\
