  md: "\nat least some kernel source files and understand them. Having said that,\
    \ I also believe in\nthe value of playing with the system first and asking questions\
    \ later. When I learn a new\nprogramming language, I don't start with reading\
    \ the library code, but by writing a small\n‘hello, world’ program. I don't see\
    \ why playing with the kernel should be any different.\n\n## 0.2 Note on the Style\n\
    \nI like to put as many jokes as possible into my documentation. I'm writing this\
    \ because\nEnjoy it, and I assume most of you are reading this for the same reason.\
    \ If you just want\nto get to the point, ignore all the normal text and read the\
    \ source code. I promise to put all\nimportant details in remarks.\n\n## 0.3 Changes\n\
    \n### 0.3.1 New in version 1.0.1\n\n- 1. Changes section, 0.3\n- 2. How to find\
