    # Chapter 12


    # Symmetrical Multi–Processing


    One of the easiest (read, cheapest) ways to improve hardware performance is to
    put more than one different CPU on the board. This can be done either making the
    different CPUs take on different jobs (asymmetrical multi-processing) or by making
    them all run in parallel, doing the same job (symmetrical multi-processing, a.k.a.
    SMP). Doing asymmetrical multi-processing effectively requires specialized knowledge
    about the tasks the computer should do, which is unavailable in a general purpose
    operating system such as Linux. On the other hand, symmetrical multi-processing
    is relatively easy to implement.


    By relatively, I mean exactly— not that it''s really easy. In a symmetrical multi-processing
    environment, the CPUs share the same memory, and a result code running in one
    CPU can affect the memory used by another. You can no longer be certain a variable
    you set to a value in the previous line has that value— the other CPU might have
    played with while you weren''t looking. Obviously, it''s impossible to program
    reliably.


    In the case of processing this normally isn''t an issue, because a process will
    normally run on one CPU at a time¹¹. The kernel, on the other hand, could be called
    by different processes running on different CPUs.


    In version 2.0, this isn''t a problem because the entire kernel is in one spinlock.
    This means that if one CPU is in the kernel and another wants to get in, for example
    of a system call, it waits until the first CPU is done. This makes Linux SMP safe²,
    but terribly inefficient.


    > ¹The exception is threaded processes, which can run on several CPUs at once.

    ²Meaning it is safe to use it with SMP'
  - '[PAGE 108]


    In version 2.2.x, several CPUs can be in the kernel at the same time. This is
    something module writers need to be aware of. I got somebody to give me access
    to an SMP box, so hopefully the next version of this book will include more information.'
  - '[PAGE 109]


    # Chapter 13


    # Common Pitfalls


    Before I send you on your way to go out into the world and write kernel modules,
    there are a few things I need to warn you about. If I fail to warn you and something
    bad happen, please report the problem to me for a full refund of the amount I
    got paid for your copy of the book.


    +   1. **Using standard libraries** You can''t do that. In a kernel module you
    can only use kernel functions, which are the functions you can see in /proc/ksym.


    +   2. **Disabling interrupts** You might need to do this for a short time and
    that is OK, but if you don''t enable them afterwards, your system will be stuck
    and you''ll have to power it off.


    +   3. **Sticking your head inside a large carnivore** I probably don''t have
    to warn you about this, but I figured I will anyway, just in case.'
  - '[PAGE 110]


    # Appendix A


    # Changes between 2.0 and 2.2


    I don''t know the entire kernel well enough to document all of the changes. In
    the course of converting the examples (or actually, adapting Emmanuel Papirakis''
    changes) I came across the following differences. I listed all of them together
    to help module programmers, especially those who learned from previous versions
    of this book and are most familiar with the techniques I use, convert to the new
    version.


    An additional resource for people who wish to convert to 2.2 is in http://www.atnf.csiro.au/~rgooch/linux/docs/porting-to-2.2.html.


    +   1. asmac.h If you need put_user or get_user you have to #include it.

    2. get_user In version 2.2, get_user receives the pointer into user memory and
    the variable in kernel memory to fill with the information. The reason for this
    is that get_user can read two or four bytes at a time if the variable we read
    is two or four bytes long.

    3. file_operations This structure now has a flush function between the open and
    close functions.

    4. close in file_operations In version 2.2, the close function returns an integer,
    so it''s allowed to fail.

    5. write and read in instead of size_t The headers for these functions changed.
    They now return ssize_t instead of an integer, and their parameter list is different.
    The inode is no longer a parameter, and on the other hand the offset into the
    file.'
  - '[PAGE 111]


    +   6. proc_register_dynamic This function no longer exists. Instead, you call
    the regular proc_register and put zero in the inode field of the structure.


    +   7. Signals The signals in the task structure are no longer a 32 bit integer,
    but an array of _NSIG_WORDS integers.


    +   8. queue_task_irq Even if you want to schedule a task to happen from inside
    an interrupt handler, you use queue_task, not queue_task_irq.


    +   9. Module Parameters You no longer declare module parameters as global variables.
    In 2.2 you have to also use MODULE_PARM to declare their type. This is a big improvement,
    because it allows the module to receive string parameters which start with a digits,
    for example, without getting confused.


    +   10. Symmetrical Multi-Processing The kernel is no longer inside one huge spinlock,
    which means that kernel modules have to be aware of SMP.'
  md: "\nThis code binds to IRQ 1, which is the IRQ of the keyboard controlled under\
    \ Intel architectures. Then, when it receives a keyboard interrupt, it reads the\
    \ keyboard's status (that's the purpose of the *inb (0x64)* and the scan code,\
    \ which is the value returned by the keyboard). Then, as soon as the kernel thinks\
    \ it's feasible, it runs got_char which gives the code of the key used (the first\
    \ seven bits of the scan code) and whether it has been pressed (if the 8th bit\
    \ is zero) or released (if it's one).\n\n## intprpt.c\n\n```c\n/* intprpt.c -\
    \ An interrupt handler. */\n```\n\n```c\n/* Copyright (C) 1998 by Ori Pomerantz\
    \ */\n```\n\n```c\n/* The necessary header files */\n/* Standard in kernel modules\
    \ */\n#include <linux/kernel.h>    /* We're doing kernel work */\n#include <linux/module.h>\
    \     /* Specifically, a module */\n\n/* Deal with CONFIG_MODVERSIONS */\n#if\
    \ CONFIG_MODVERSIONS==1\n#define MODVERSIONS\n#include <linux/modversions.h>\n\
    #endif\n\n#include <linux/sched.h>\n#include <linux/tqueue.h>\n\n/* We want an\
    \ interrupt */\n#include <linux/interrupt.h>\n\n#include <asm/io.h>\n```\n\n```c\n\
    /* In 2.2.3 /usr/include/linux/version.h includes a\n * macro for this, but 2.0.35\
    \ doesn't - so I add it\n * here if necessary. */\n#ifndef KERNEL_VERSION\n#define\
    \ KERNEL_VERSION(a,b,c) ((long) (a)*65536+(b)*256+(c))\n#endif\n```\n\n```c\n\
    /* Bottom Half - this will get called by the kernel\n * as soon as it's safe to\
    \ do everything normally\n * allowed by kernel modules. */\nstatic void got_char(void\
    \ *scancode)\n{\n    printf(\"Scan Code %x %s\\n\",\n           (int)((char *)scancode)\
    \ & 0x7F,\n           ((char *)scancode) & 0x80 ? \"Released\" : \"Pressed\");\n\
    ```\n\n```c\n/* This function services keyboard interrupts. It reads\n * the relevant\
    \ information from the keyboard and\n * schedules the bottom half to run when\
    \ the kernel\n * considers it safe. */\nvoid irq_handler(int irq,\n          \
    \       void *dev_id,\n                 struct pt_regs *regs)\n{\n    /* This\
    \ variables are static because they need to be\n     * accessible (through pointers)\
    \ to the bottom\n     * half runtime. */\n    static unsigned char scancode;\n\
    \    static struct tq_struct task =\n        {NULL, 0, got_char, &scancode};\n\
    \    unsigned char status;\n```\n\n```c\n/* Read keyboard status */\nstatus =\
    \ inb(0x64);\nscancode = inb(0x60);\n```\n\n```c\n/* Schedule bottom half to run\
    \ */\n#if LINUX_VERSION_CODE > KERNEL_VERSION(2,2,0)\nqueue_task(&task, &tq_immediate);\n\
    #else\nqueue_task_irq(&task, &tq_immediate);\n#endif\nmark_bh(IMMEDIATE_BH);\n\
    ```\n\n```c\n/* Initialize the module - register the IRQ handler */\nint init_module()\n\
    {\n```\n\n- Since the keyboard handler won't co-exist with another handler, such\
    \ as us, we have to disable it (free its IRQ) before we do anything. Since we\
    \ don't know where it is, there's no way to reinstate it later - so the computer\
    \ will have to be rebooted when we're done.\n\n```c\nfree_irq(1, NULL);\n```\n\
    \n- Request IRQ 1, the keyboard IRQ, to go to our irq_handler.\n\n```c\nreturn\
    \ request_irq(\n1, /* The number of the keyboard IRQ on PCs */\nirq_handler, /*\
    \ our handler */\nSA_SHIRQ,\n```\n\n- SA_SHIRQ means we're willing to have other\
    \ handlers on this IRQ.\n\n```c\n}\n```\n\n```c\n/* SA_INTERRUPT can be used to\
    \ make the\n * handler into a fast interrupt.\n*/\n\"test_keyboard_irq_handler\"\
    , NULL);\n}\n```\n\n```c\n/* Cleanup */\nvoid cleanup_module()\n{\n/* This is\
    \ only here for completeness. It's totally\n* irrelevant, since we don't have\
    \ a way to restore\n* the normal keyboard interrupt so the computer\n* is completely\
    \ useless and has to be rebooted. */\nfree_irq(1, NULL);\n}\n```\n\n## Chapter\
    \ 12\n\n## Symmetrical Multi–Processing\n\nOne of the easiest (read, cheapest)\
    \ ways to improve hardware performance is to put more than one different CPU on\
    \ the board. This can be done either making the different CPUs take on different\
    \ jobs (asymmetrical multi-processing) or by making them all run in parallel,\
    \ doing the same job (symmetrical multi-processing, a.k.a. SMP). Doing asymmetrical\
    \ multi-processing is much easier than symmetrical multi-processing, but it is\
    \ also less efficient. Doing symmetrical multi-processing is much harder because\
    \ it requires the kernel to be re-entrant.\n\nIn asymmetrical multi-processing,\
    \ one CPU is designated as the master and the others as slaves. The master handles\
    \ all the interrupts, and the slaves perform the tasks. In symmetrical multi-processing,\
    \ all CPUs can handle interrupts and perform tasks. This is much more efficient,\
    \ but it is much more complex to implement.\n\nIn this chapter, we will discuss\
    \ how to implement symmetrical multi-processing in Linux. We will start with a\
    \ simple asymmetrical multi-processing model and then gradually add more features.\n"
  mdcn: "\n这段代码绑定到 IRQ 1，这是 Intel 架构下控制键盘的 IRQ。然后，当它接收到键盘中断时，它会读取键盘状态（这就是 *inb (0x64)*\
