    \ for. If you need\nversion.h, you need to include yourself, because module.h\
    \ won't do it for\nyou with _NO_VERSION_\n\n- 2. Compile all the source files\
    \ as usual.\n\n- 3. Combine all the object\nfiles into a single one. Under x86,\
    \ do it with ld -m elf_i386 -r -o <name\n\n> ¹The reason is not proper to compile\
