  mdcn: "\n至少要有一些内核源码文件并理解它们。尽管如此，我也相信先玩玩系统、后再提问的价值。当我学习一门新的编程语言时，我并不是从阅读库代码开始，而是从写一个小的“hello,\
    \ world”程序开始。我不认为玩玩内核应该有什么不同。\n\n## 0.2 关于风格的说明\n\n我喜欢在文档中加入尽可能多的笑话。我写这些是因为我享受其中，而我假设你们大多数人阅读本书也是出于同样的原因。如果你只想直奔主题，请忽略所有正文并直接阅读源代码。我承诺会将所有重要的细节写在注释中。\n\
    \n## 0.3 更改\n\n### 0.3.1 版本 1.0.1 新内容\n\n- 1. 更改章节，0.3\n- 2. 如何找到次要设备号，2.\n- 3.\
    \ 修复了字符文件和设备文件区别的解释，2\n- 4. 内核模块的 Makefile，1.1.\n- 5. 对称多任务处理，12.\n- 6. 一个“坏主意”章节，13.\n\
    \n### 0.3.2 版本 1.1.0 新内容\n\n- 1. 支持内核版本 2.2 的内核，处可见。\n- 2. 多内核源文件，2.1.\n- 3. 2.0\
    \ 和 2.2 之间的更改，A.\n- 4. 多个源文件中的内核模块，1.2.\n- 5. 建议不要让干扰系统调用的模块被 rrmmod 移除，7.\n\n\
    ## 0.4 致谢\n\n感谢 Yoav Weiss 提供的许多有帮助的想法和讨论，感谢他在文档出版前发现了其中的错误。当然，任何剩余的错误都是我的错。\n\
    这本书的 LaTeX 骨架是廉耻地借自《Linux Installation and Getting Started》的；书中的 LaTeX 工作是由 Matt\
    \ Welsh 完成的。\n感谢 Linus Torvalds、Richard Stallman 以及所有其他让我能够在我的计算机上运行高质量操作系统并在不说话的情况下就获得源代码的人们（是啊，得谱——那我刚才为什么要那样说呢？）。\n\
    \n### 0.4.1 针对版本 1.0.1\n\n我无法列出所有给我发邮件的人，如果我疏漏了您，我预先表示道歉。以下人员提供了特别帮助：\n\n- * 来自荷兰的\
    \ Frodo Looijaard：提供了许多有用的建议，以及关于 2.1.x 内核的信息。\n- 来自新西兰的 Stephen Judd：拼写检查。\n\
    - 来自瑞典的 Magnus Ahtororp：纠正了我关于字符设备和块设备区别的一处错误。\n\n### 0.4.2 针对版本 1.1.0\n\n- *\
    \ 来自加拿大魁北克的 Emmanuel Papirakis：将所有示例移植到内核 2.2 版本。\n- 来自荷兰的 Frodo Looijaard：告诉我如何创建多个内核模块\
    \ (1.2)。\n\n当然，任何遗留的错误都是我自己的问题，如果你认为这些错误让这本书变得无法使用，欢迎申请全额退还你为此支付的费用。\n\n## 第 1\
    \ 章\n\n## Hello, world\n\n当第一个穴穴人程序员在第一台计算机的墙壁上刻下第一个程序时，那是一个开始在反羚羊画上绘制“Hello,\
    \ world”字符串的程序。罗马编程教科书以“Salut, Mundi”程序开头。我不知道那些打破这一传统的人会发生什么，我觉得还是不弄发现比较安全。\n\
    \n内核模块必须至少有两个函数：`init_module` 在模块插入内核时调用，以及 `cleanup_module` 在它被移除之前调用。通常，`init_module`\
    \ 要么为内核的某个功能注册处理程序，要么用它自己的代码替换内核函数（通常是执行某些操作的代码）。`cleanup_module` 函数应该撤销 `init_module`\
    \ 所做的一切，以便模块可以安全地卸载。\n\n```c\nhelloc\n/* hello.c\n * Copyright (C) 1998 by Ori\
    \ Pomerantz\n *\n * \"Hello, world\" - 内核模块版本。\n */\n\n/* 必要的头文件 */\n/* 内核模块的标准\
    \ */\n#include <linux/kernel.h>    /* 我们正在做内核工作 */\n```\n\n```c\n#include <linux/module.h>\
    \  /* 具体来说，一个模块 */\n```\n\n```c\n/* 处理 CONFIG_MODVERSIONS */\n#if CONFIG_MODVERSIONS==1\n\
    #define MODVERSIONS\n#include <linux/modversions.h>\n#endif\n```\n\n```c\n/* 初始化模块\
    \ */\nint init_module()\n{\n    printf(\"Hello, world - this is the kernel speaking\\\
    n\");\n\n    /* 如果我们返回非零值，意味着 */\n    * init_module 失败且内核模块\n    * 无法加载 */\n \
    \   return 0;\n}\n```\n\n```c\n/* 清理 - 撤销 init_module 所做的一切 */\nvoid cleanup_module()\n\
    {\n    printf(\"Short is the life of a kernel module\\n\");\n}\n```\n\n## 1.1\
    \ 内核模块的 Makefile\n\n内核模块不是独立的可执行文件，而是运行时链接到内核中的对象文件。因此，它们应该使用 `-c` 标志进行编译。此外，所有内核模块必须在定义某些符号的情况下编译。\n\
    \n- `-__KERNEL__` — 这告诉头文件此代码将在内核模式下运行，而不是作为用户进程的一部分。\n\n- `-MODULE` — 这告诉头文件为内核模块提供适当的定义。\n\
    \n- `-LINUX__` — 从技术上说，这并不是必要的。然而，如果你想写一个可以在多个操作系统上编译的严肃内核模块，这将允许你对依赖于系统的部分进行条件编译。\n\
    \n还有其他符号必须包含或不包含，取决于编译内核时使用的标志。如果你不确定内核是如何编译的，请在 `/usr/include/linux/config.h`\
    \ 中查找。\n\n- `-__SMP__` — 对称多任务处理。如果内核编译为支持对称多任务处理（即使它在单个 CPU 上运行），则必须定义它。如果你使用对称多任务处理，还需要做其他事情（见第\
    \ 12 章）。\n\n- `-CONFIG_MODVERSIONS` — 如果启用了 `CONFIG_MODVERSIONS`，你需要在编译内核模块时定义它，并包含\
    \ `linux/modversions.h`。\n\n## Makefile\n\n内核模块的 Makefile\n\n```makefile\nCC=gcc\n\
    CFLAGS :=-Wall -DMODULE -D__KERNEL__\n\nhello.o: hello.c /usr/include/version.h\n\
    \t$(CC) $(CFLAGS) -c hello.c\n\necho insmod hello 开启\n\techo rmmod hello 关闭\n\
    ```\n\n现在，剩下的就是以 root 身份执行（你不是那样做的的吧），然后 insmod hello 和 rmmod hello。\n\n## 1.2\
    \ 多个内核模块\n\n有时将一个内核模块划分到多个文件中是有意义的。在这种情况下，你需要以下操作：\n\n- 1. 在所有源文件中添加行 `#define\
    \ _NO_VERSION_`。这是因为 `module.h` 通常包含全局变量 `kernel_version` 的定义，它是编译模块时对应的内核版本。如果你需要\
    \ `version.h`，你需要自己包含，因为 `module.h` 在有 `_NO_VERSION` 时不会为你包含。\n\n- 2. 像往常编译所有源文件。\n\
    \n- 3. 将所有对象文件合并为一个。在 x86 下，使用 `ld -m elf_i386 -r -o <name>` 完成。\n\n> ¹不以 root\
    \ 身份编译的原因是 root 身份执行的操作越少越安全。我从事计算机安全工作，所以我很偏执。\n\n"
