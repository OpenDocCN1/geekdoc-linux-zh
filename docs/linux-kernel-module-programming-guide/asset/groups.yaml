    # # Chapter 3


    # # The /proc File System


    In Linux there is an additional mechanism for the kernel and kernel modules to
    send information to processes — the /proc file system. Originally designed to
    allow easy access to information about processes (hence the name), it is now used
    by every bit of the kernel which has something interesting to report, such as
    /proc/modules which has the list of modules and /proc/meminfo which has memory
    usage statistics.


    The method to use the proc file system is very similar to the one used with device
    drivers — you create a structure with all the information needed for the /proc
    file, including pointers to any handler functions (in case there is only one,
    the one called when somebody attempts to read from the /proc file). Then, init_module
    registers the structure with the cleanup_module registers it.


    The reason we use register_dynamic is because we don''t want to determine the
    index-node used for our file but allow the kernel to determine it to prevent clashes.
