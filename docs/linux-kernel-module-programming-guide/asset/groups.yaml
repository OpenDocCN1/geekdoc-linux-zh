  mdcn: "\n\n# 附录 B\n\n# 接下来该怎么办？\n\n我本可以很容易地在书中再挤进几个章节。我可以添加一个关于创建新文件系统的章节，或者关于添加新协议栈的章节（因为这确实有需求——你得挖到地下才能找到一个\
    \ Linux 不支持的协议栈）。我还可以对我们尚未触及的内核机制进行解释，例如内核引导或磁盘接口。\n\n然而，我选择了不这样做。我写这本书的目的是让读者进入内核模块编程的奥秘，并教授实现这一目的的常用技术。对于对内核编程产生浓兴趣的人，我推荐这个内核资源列表：http://jungla.dit.ump.es/~jmsayas/linux/kernel/hackers-docs.html。此外，正如\
    \ Limis 所说，学习内核最好的方法就是亲自阅读源代码。\n\n如果你对更多短内核模块示例感兴趣，我推荐《Phrack》杂志。即使你对安全不感兴趣（作为一个程序员你本应该感兴趣），那里的内核模块也是你在内核内部可以做的事情的良好示例，而且它们足够短，不需要费太大精力就能理解。\n\
    \n我希望我帮助你走上成为程序员的道路，或者至少让你通过技术获得乐趣。而且，如果你确实编写了实用的内核模块，我希望你能发布它们，这样我也可以使用它们。\n\n\
    # 附录 C\n\n# 商品和服务\n\n我希望没人介意这里的廉价推广。它们都是可能对初级 Linux 内核模块程序员有用的东西。\n\n### C.1 本书的印刷\n\
    \nCoriolis 组将在 1999 年夏天的某个时候印刷这本书。如果现在已经是夏天，并且你需要这本书的纸质版，你可以去打印机店轻松地买一本精装本的。\n\
    \n# 附录 D\n\n# 表达你的感谢\n\n这是一份免费文档。除了《GNU 通用许可证》（附录 E）规定的义务外，你没有任何其他义务。然而，如果你想对这本书做些回报，你可以做以下几件事：\n\
    \n- 寄一张明信片给\n  Pomeranz\n  Apt. #1032\n  2355 N Hwy 360\n  Grand Prairie\n  USA\n\
    - 如果你想收到我的感谢，请包含你的电子邮件地址。\n- 贡献金钱或时间给自由软件社区。\n- 编写程序或发布它，例如 Linux 或 Perl。\n- 教会他人如何使用自由软件。\n\
    - 解释自私行为与社会或他人是不兼容的。\n\n我很享受编写这份文档，并相信如果你发布了它，它在未来将帮助我。请记住，快乐的人比不快乐的人更有用，有能力的人比能力低的人更好。\n\
    - **保持快乐。** 如果我遇到你，这会让我变得更有用；\n\n)。\n\n# 附录 E\n\n# GNU 通用许可证\n\n下面打印的是 GNU 通用许可证（GPL\
    \ 许可证），本书是根据该许可证许可的。\n\n# GNU 通用许可证\n\n版本 2，1991 年 6 月\n\n版权 © 1989-1991 Free\
    \ Software Foundation, Inc. 675 Mass Ave, Cambridge, MA 02139 允许复制和分发本许可证的完整副本，但不允许对其进行修改。\n\
    \n#### 前言\n\n大多数软件的许可证设计旨在剥夺你共享和更改的自由。相比之下，GNU 通用许可证旨在保证你共享和更改自由软件的自由。本许可证适用于自由基金会的软件，以及任何承诺使用它的程序。（其他自由软件受\
    \ GNU 函库许可证保护。）你也可以将其应用于你的程序中。\n\n当我们谈论自由软件时，我们指的是自由，而不是价格。我们的通用许可证旨在确保你拥有以下自由：分发自由软件的副本（如果你愿意，可以对其收费）；你接收源代码（如果你想要，可以获取它）；你可以更改软件或其部分；以及你知晓可以做这些事情。\n\
