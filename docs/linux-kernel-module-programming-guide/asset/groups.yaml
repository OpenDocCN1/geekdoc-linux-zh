    \ 8 位为 0）还是释放的（如果为 1）。\n\n## intprpt.c\n\n```c\n/* intprpt.c - 一个中断处理程序。 */\n\
    ```\n\n```c\n/* Copyright (C) 1998 by Ori Pomerantz */\n```\n\n```c\n/* 必要的头文件\
    \ */\n/* 内核模块的标准头文件 */\n#include <linux/kernel.h>    /* 我们正在进行内核级工作 */\n#include\
    \ <linux/module.h>     /* 具体来说，是一个模块 */\n\n/* 处理 CONFIG_MODVERSIONS */\n#if CONFIG_MODVERSIONS==1\n\
    #define MODVERSIONS\n#include <linux/modversions.h>\n#endif\n\n#include <linux/sched.h>\n\
    #include <linux/tqueue.h>\n\n/* 我们需要一个中断 */\n#include <linux/interrupt.h>\n\n\
    #include <asm/io.h>\n```\n\n```c\n/* 在 2.2.3 /usr/include/linux/version.h 中包含一个\n\
    \ * 用于此的宏，但 2.0.35 没有 - 所以如果有需要，\n * 我在这里添加。 */\n#ifndef KERNEL_VERSION\n#define\
    \ KERNEL_VERSION(a,b,c) ((long) (a)*65536+(b)*256+(c))\n#endif\n```\n\n```c\n\
    /* 下半部 (Bottom Half) - 只要内核认为可以\n * 执行内核模块允许的所有正常操作，\n就会调用它。 */\nstatic void got_char(void\
    \ *scancode)\n{\n    printf(\"Scan Code %x %s\\n\",\n           (int)((char *)scancode)\
    \ & 0x7F,\n           ((char *)scancode) & 0x80 ? \"Released\" : \"Pressed\");\n\
    ```\n\n```c\n/* 此函数处理键盘中断。它从键盘读取\n * 相关信息，并在内核认为\n * 安全时调度下半部运行。 */\nvoid irq_handler(int\
    \ irq,\n                 void *dev_id,\n                 struct pt_regs *regs)\n\
    {\n    /* 这里的变量是静态的，因为它们需要\n     * （通过指针）以便在下半部\n     * 运行时可以访问。 */\n    static\
    \ unsigned char scancode;\n    static struct tq_struct task =\n        {NULL,\
    \ 0, got_char, &scancode};\n    unsigned char status;\n```\n\n```c\n/* 读取键盘状态\
    \ */\nstatus = inb(0x64);\nscancode = inb(0x60);\n```\n\n```c\n/* 调度下半部运行 */\n\
    #if LINUX_VERSION_CODE > KERNEL_VERSION(2,2,0)\nqueue_task(&task, &tq_immediate);\n\
    #else\nqueue_task_irq(&task, &tq_immediate);\n#endif\nmark_bh(IMMEDIATE_BH);\n\
    ```\n\n```c\n/* 初始化模块 - 注册 IRQ 处理程序 */\nint init_module()\n{\n```\n\n- 由于键盘处理程序不会与另一个处理程序（例如我们的）共存，我们必须在执行任何操作之前禁用它（释放它的\
    \ IRQ）。由于我们不知道它在哪里，因此无法在以后恢复它 - 所以当我们完成后，必须重启电脑。\n\n```c\nfree_irq(1, NULL);\n\
    ```\n\n- 请求 IRQ 1（键盘 IRQ），将其跳转到我们的 `irq_handler`。\n\n```c\nreturn request_irq(\n\
    1, /* PC 上的键盘 IRQ 编号 */\nirq_handler, /* 我们的处理程序 */\nSA_SHIRQ,\n```\n\n- SA_SHIRQ\
    \ 意味着我们愿意在该 IRQ 上有其他处理程序。\n\n```c\n}\n```\n\n```c\n/* SA_INTERRUPT 可以用于将\n * 处理程序转变为快速中断。\n\
    */\n\"test_keyboard_irq_handler\", NULL);\n}\n```\n\n```c\n/* 清理 */\nvoid cleanup_module()\n\
    {\n/* 这只是为了完整性。它完全完全\n* 无关，因为我们没有办法恢复\n* 正常的键盘中断，所以电脑\n* 变得完全没用且必须重启。 */\nfree_irq(1,\
    \ NULL);\n}\n```\n\n## 第 12 章\n\n## 对称多处理 (Symmetrical Multi–Processing)\n\n提高硬件性能最简单（读：最廉价）的方法之一是在板上放置多个不同的\
    \ CPU。这可以通过让不同的 CPU 承担不同的任务（非对称多处理）或通过让它们全部并行运行执行相同的任务（对称多处理，又称 SMP）。执行非对称多处理比对称多处理容易得多，但效率也较低。执行对称多处理困难得多，因为它要求内核是可入的。\n\
    \n在非对称多处理中，一个 CPU 被指定为主机，其余为从机。主机处理所有中断，从机执行任务。在对称多处理中，所有的 CPU 都可以处理中断并执行任务。这种方法高效得多，但实现也复杂得多。\n\
    \n在本章中，我们将讨论如何在 Linux 中实现对称多处理。我们将从一个简单的非对称多处理模型开始，然后逐渐添加更多功能。\n\n"
