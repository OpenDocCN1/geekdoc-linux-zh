    kernel module (1.2).\n\nOf course, any remaining mistakes are my own, and if you\
    \ think they make the book\nunusable you're welcome to apply for a full refund\
    \ of the money you paid for it.\n\n## Chapter 1\n\n## Hello, world\n\nWhen the\
    \ first caveman programmer chiseled the first program on the walls of the first\
    \ computer, it was a program began to paint the string 'Hello, world' in Antelope\
    \ pictures. Roman programming textbooks began with the 'Salut, Mundi' program.\
    \ I don't know what happens to people who break with this tradition, and I think\
    \ it's safer not to find out.\n\nA kernel module has to have at least two functions:\
    \ init_module which is called when the module is inserted into the kernel, and\
    \ cleanup_module which is called just before it is removed. Typically, init_module\
    \ either registers a handler for something with the kernel, or replaces one of\
    \ the kernel function with its own code (usually code to do something). The cleanup_module\
    \ function is supposed to undo whatever init_module did, so the module can be\
    \ unloaded safely.\n\n```c\nhelloc\n/* hello.c\n * Copyright (C) 1998 by Ori Pomerantz\n\
    \ *\n * \"Hello, world\" - the kernel module version.\n */\n\n/* The necessary\
    \ header files */\n/* Standard in kernel modules */\n#include <linux/kernel.h>\
    \    /* We're doing kernel work */\n```\n\n```c\n#include <linux/module.h>  /*\
    \ Specifically, a module */\n```\n\n```c\n/* Deal with CONFIG_MODVERSIONS */\n\
    #if CONFIG_MODVERSIONS==1\n#define MODVERSIONS\n#include <linux/modversions.h>\n\
    #endif\n```\n\n```c\n/* Initialize the module */\nint init_module()\n{\n    printf(\"\
    Hello, world - this is the kernel speaking\\n\");\n\n    /* If we return a non\
    \ zero value, it means that */\n    * init_module failed and the kernel module\n\
    \    * can't be loaded */\n    return 0;\n}\n```\n\n```c\n/* Cleanup - undid whatever\
    \ init_module did */\nvoid cleanup_module()\n{\n    printf(\"Short is the life\
    \ of a kernel module\\n\");\n}\n```\n\n## 1.1 Makefiles for Kernel Modules\n\n\
    A kernel module is not an independant executable, but an object file which will\
    \ be linked into the kernel in runtime. As a result, they should be compiled with\
    \ the -c flag. Also, all kernel modules have to be compiled with certain symbols\
    \ defined.\n\n- - _KERNEL_ — This tells the header files that this code will be\
    \ run in kernel mode, not as part of a user process.\n\n- - MODULE — This tells\
    \ the header files to give the appropriate definitions for a kernel module.\n\n\
    - - LINUX — Technically speaking, this is not necessary. However, if you ever\
    \ want to write a serious kernel module which will compile on more than one operating\
    \ system, this will allow you to do conditional compilation on the parts which\
    \ are OS dependant.\n\nThere are other symbols which have to be included, or not,\
    \ depending on the flags the kernel was compiled with. If you're not sure how\
    \ the kernel was compiled, look it up in /usr/include/linux/config.h\n\n- - _SMP_\
    \ — Symmetrical MultiProcessing. This has to be defined if the kernel was compiled\
    \ to support symmetrical multiprocessing (even if it's running on one CPU). If\
    \ you use Symmetrical MultiProcessing, there are other things you need to do (see\
    \ chapter 12).\n\n- - CONFIG_MODVERSIONS — If CONFIG_MODVERSIONS was enabled,\
    \ you need to have it defined when compiling the kernel module and to include\
    \ /usr/include/linux/modversions.h. This can also be done by the code itself.\n\
    \n## Makefile\n\n## Makefile for a basic kernel module\n\n```makefile\nCC=gcc\n\
    MODCFLAGS :=-Wall -DMODULE -D__KERNEL__ -DLUX\n\nhello.o: hello.c /usr/include/linux/version.h\n\
    \t$(CC) $(MODCFLAGS) -c hello.c\n\techo insmod hello.o to turn it on\n\techo rmmod\
    \ hello to turn it off\n\techo\n\techo X and kernel programming do not mix.\n\
    ```\n\necho Do the insmod and rmmod from outside X.\n\nSo, now the only thing\
    \ left is to root (you didn't compile this as, did you?\nLiving on the edge...),\
    \ and then insmod hello and rmmod hello to your heart's\ncontent. While you do\
    \ it, notify your new kernel module in /proc/modules.\n\nBy the way, the reason\
    \ why the Makefile recommends against using insmod from X\nis because the kernel\
    \ has a message to print with printk, it sends it to the console.\nWhen you don't\
    \ use X, it goes to the virtual terminal you're using (the one you chose\nal Alt-F3)\
    \ and you see it. When you do use X, on the other hand, there are two\npossibilities.\
    \ Either you have a console open with xterm -C, in which case the output\nwill\
    \ be sent there, or you don't, in which case the output will go to virtual terminal\
    \ 7 — the\ncovered by X.\n\nIf your kernel becomes unstable you're unlikely to\
    \ get the debug messages without X.\nOutside of X, printk goes directly to the\
    \ console. In X, on the other hand,\nprint's go to the X server (xterm -C). When\
    \ process receives CPU time,\nit is supposed to send it to the X server process.\
    \ Then, when X server receives the CPU,\nit is supposed to display it — but an\
    \ unstable kernel usually means the system is about\nto crash or reboot, so you\
