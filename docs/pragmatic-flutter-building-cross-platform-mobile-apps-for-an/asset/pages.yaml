  md: "# Data Modeling\n\nLet's re-examine the fetchBooks() method of _BooksListingState\
    \ class in the previous chapter (Chapter 12: Integrating REST API).\n\n```\nvar\
    \ booksListing;\nfetchBooks() async {\n  var response = await makeHttpCall();\n\
    \  booksListing = response[\"items\"];\n}\n```\n\nThe items property in the JSON\
    \ response holds the list of books as JSON objects. The response is assigned to\
    \ the results returned from the makeHttpCall()function. The booksListing is assigned\
    \ to the response[\"items\"] returned from the API. Since the response variable\
    \ stores the response[\"items\"] would give the list of books as a list of JSON\
    \ objects. We will use this list of JSON objects to retrieve the book information\
    \ and eventually render it in Flutter.\n\nNote: The response[\"items\"] returns\
    \ a list of LinkedHashMap as List<Dynamic>. LinkedHashMap(HashMap<K, V> class)\
    \ is a Hashtable implementation of the Map. The LinkedHashMap preserves the insertion\
    \ order of keys.\n\nEach JSON object of this list contains the information that\
    \ needs to be displayed in each row of the app's books list. In our app, we're\
    \ interested in displaying the title, authors and thumbnail image of the book.\
    \ We can use the following attributes from the JSON object(s) to get information.\n\
    \n+   * volumeInfo->title: title of the book.\n* volumeInfo->description: description\
    \ of the book\n* volumeInfo->imageLinks->thumbnail: Link to thumbnail image of\
    \ the book's cover page.\n\nNow we know how to fetch and access information about\
    \ the book listing, let's start building the interface. We'll build a simple interface\
    \ below (Figure 13.2) to display the book's title, author(s), and cover image,\
    \ if available.\n\n# ListView WIDGET: LISTING ENTRIES\n\nIn the previous chapter\
    \ (Chapter 12: Integrating REST API), a big blob of API responses was displayed\
    \ on the main screen. In this section, you'll see how to display each book entry\
    \ in its own row using the ListView (ListView class) Flutter widget."
