  md: "# 20 Unit Testing\n\nIn this chapter, you will learn the basics of unit testing\
    \ (Unit Testing) in a Flutter application. Unit tests are useful for testing a\
    \ particular functionality of a method/function or class. The modified version\
    \ of default counter application is used to learn writing unit tests for a Flutter\
    \ application. In the modified default CounterApp, we will add two buttons. We\
    \ use a Flutter plugin font awesome_flutter for the increment and decrement button\
    \ icons. This plugin comes with a rich set of Flutter icons. We will add one green\
    \ button with an increment for increasing the counter by one. Another red button\
    \ with a decrement icon is used for reducing the counter value by one.\n\nOnce\
    \ this modified interface for CounterApp is ready, you will learn how to write\
    \ unit tests to test the logical functions for the Dart class 'Counter'. The default\
    \ CounterApp is improvised, as shown in Figure 20.1 to demonstrate testing in\
    \ Flutter applications.\n\n# PACKAGE DEPENDENCIES\n\nThe test (package) package\
    \ is enough to write unit tests for pure Dart code. However, the flutter_test\
    \ (package) is the right choice when testing Flutter applications. It also comes\
    \ with tools to test Flutter widgets, which we will be exploring in the next chapter\
    \ (Chapter 21: Widget Testing). In this chapter, you have the option to add either\
    \ the test or flutter_test package to pubspec.yaml. The test package is the minimum\
    \ required dependency for unit tests. The test is added under the 'dev dependencies'\
    \ section of the pubspec.yaml file.\n\n```\ndev_dependencies:\n  test: ^1.15.3\n\
    ```\n\nThe font awesome_flutter is added under the 'dependencies' section of the\
    \ pubspec.yaml file.\n\n```\ndependencies:\n  font_awesome_flutter: ^8.8.1\n```\n\
    \n# The CounterApp\n\nIn this section, we'll build each part of the app one by\
    \ one starting from Counter pure Dart class."
