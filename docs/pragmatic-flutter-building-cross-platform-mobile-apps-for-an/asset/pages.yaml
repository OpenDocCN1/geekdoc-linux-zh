  md: "# Flutter Widgets\n\nFuture<int> _futureError = Future<int>.delayed(Duration(seconds:\
    \ 3), () => throw (\"Sample error\"));\n\n# FutureBuilder WIDGET\n\nThe FutureBuilder\
    \ (FutureBuilder<T> class) builds widgets for the interface based on the snapshot\
    \ received from the Future object. The Future object `futureData` is assigned\
    \ to its `future` property. The `builder` property is given to the constructor\
    \ with `AsyncSnapshot<int>` snapshot. It uses `snapshot` to build the `futureChild`.\
    \ When the app is waiting for data to arrive, or `snapshot` has data, it displays\
    \ the data received in a Text widget. If an error is received, then an error message\
    \ is displayed, or a circular progress indicator is shown. The `futureChild` is\
    \ added as a child to the Center widget.\n\n```\nFutureBuilder<int> (\n  future:\
    \ _futureData,\n  builder: (BuildContext context, AsyncSnapshot<int> snapshot)\
    \ {\n    Widget futureChild;\n    if (snapshot.hasData) {\n      //success\n \
    \     futureChild = Text(\"Number received is ${snapshot.data}\");\n    } else\
    \ if (snapshot.hasError) {\n      //show error message\n      futureChild = Text(\"\
    Error occurred fetching data ${snapshot.error}\");\n    } else {\n      //waiting\
    \ for data to arrive\n      futureChild = CircularProgressIndicator();\n    }\n\
    \n    return Center(\n      child: futureChild,\n    );\n  });\n```\n\nThe circular\
    \ progress bar `CircularProgressIndicator()` is presented to the user when waiting\
    \ for data to arrive as shown in Figure 6.7.\n\nFigure 6.8 displays the data retrieved\
    \ asynchronously from the Future object."
