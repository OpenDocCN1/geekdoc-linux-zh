  md: '# 192 Pragmatic Flutter


    # API ENDPOINT


    An endpoint is a place where the resource lives and where an API sends requests
    to. Usually, an endpoint is a URL of the service. The API endpoint or URL to fetch
    the listing of Python''s programming books is as. You would need to replace `apiKey`
    with the API keys generated in Google Cloud Console.


    ```

    https://www.googleapis.com/books/v1/volumes?key=apiKey&q=programming

    ```


    Your endpoint is ready to make an HTTP request. Try to copy and paste this in
    the browser of your choice, and observe the response in the browser window. You
    will see a big blob of text in JSON format displayed in the browser''s display
    area. Refer to Figure 12.2 to see how response from API is rendered in the Chrome
    browser. Chrome is the browser of choice throughout this book.


    # MAKE HTTP REQUEST


    At this point, you''re ready to make a REST API call to fetch book listing from
    your Flutter app. The package http imported earlier is used to make the HTTP request
    in the code snippet below. Let''s create a function `makeHttpCall()` to make such
    calls. The `http.get(...)` method returns a `Future` object. That''s why you must
    call it from an `async` function. The reason is to mark `makeHttpCall()` with
    `async` keyword.


    The await keyword is used to make calls asynchronously without blocking the main
    thread. The following code returns the API response of the HttpResponse (HttpResponse
    class) type. It will print this text on the console: `Flutter: Instance of ''Response''.`


    ![](img/ffb84d2e382861a17088a545dbd2b0c6_208_0.png)


    Figure 12.2 Raw dump of JSON response from Google Books API displayed in the browser'
