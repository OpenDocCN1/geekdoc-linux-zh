  md: "# 50\n\n# Pragmatic Flutter\n\n(MaterialApp class) is used to implement material\
    \ design. The class `HelloBooksApp` extends `StatelessWidget`. A Flutter application\
    \ is a stateless widget because it's immutable. It can have mutable and immutable\
    \ widgets as its children. The `HelloBooksApp` widget implements the `build()`\
    \ method of parent `StatelessWidget`. The `build()` method is responsible for\
    \ composing the widgets to the user interface. In `build()` method, MaterialApp\
    \ widget is returned. The Text (Text class) widget is used to display the ‘Hello\
    \ Books’ text. Let's create a MaterialApp and display ‘Hello Books’ text in the\
    \ code below:\n\n```\nclass HelloBooksApp extends StatelessWidget {\n  // This\
    \ widget is the root of your application.\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return MaterialApp(\n      debugShowCheckedModeModeBanner: false,\n\
    \      //Text Widget without SafeArea\n      home: Text('Hello Books'),\n    );\n\
    \  }\n}\n\n```\n\nThe Flutter app development has a debug banner at the top right\
    \ corner. You can remove it by setting the flag `debugShowCheckedModeBanner` in\
    \ MaterialApp to `false`.\n\n# ENTRY POINT\n\nWe have HelloBooksApp ready to run\
    \ on devices. We need to specify an entry point where the compiler can start executing\
    \ the app code. The `main()` method in most of the programming languages is the\
    \ method from which the compiler starts execution.\n\n```\nvoid main() {\n  runApp(HelloBooksApp());\n\
    }\n\n```\n\n# OUTPUT\n\nThe string ‘Hello Books’ is visible on the screen, as\
    \ shown in Figure 5.4. You’ll see the Text widget displaying ‘Hello Books’ aligned\
    \ to the top of the screen.\n\n# SOURCE CODE ONLINE\n\nSource code for this example\
    \ (Flutter App Structure: Display ‘Hello Books’ text) is available at GitHub."
