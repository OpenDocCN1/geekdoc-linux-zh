  md: '# 19 BLoC Design Pattern


    In this chapter, we will explore BLoC Pattern to manage states in Flutter applications.
    The ''BLoC'' stands for ''Business Logic Component''. The BLoC pattern was introduced
    by Google I/O 2018 (Build reactive mobile apps with Flutter (Google I/O ''18))
    that uses reactive programming to manage the data flow across the Flutter application(s).
    We will also learn to use the BLoC pattern for managing states in CounterApp.


    # WHAT IS BLoC PATTERN?


    The BLoC is a design pattern to facilitate data flow to Flutter widgets and vice
    versa. It stands for Business Logic Component. The data sources can be API responses
    or dataevents generated from widgets. The BLoC receives streams of the event(s)
    from data sources and/or widgets, perform business logic on events and emits corresponding
    states. A BLoC architecture looks like shown in Figure 19.1.


    # ANATOMY OF CounterApp


    Now that we understand ChangeNotifier and Provider widgets'' responsibili- from
    previous chapter (Chapter 18: Provider & ChangeNotifier), let''s take a look at
    CounterApp''s widget tree in Figure 19.2.


    Most of the widgets are arranged similar to example discussed in previous chap-
    There are a total of seven widgets in this app:


    +   1. Scaffold: The root widget.

    2. AppBar: Displays title of the app.

    3. Center: Aligns its children in the center of the screen.

    4. FAB: FloatingActionButton to increase the counter.

    5. Column: Aligns its children vertically.

    6. Text: Displays the information text.

    7. Text: Displays the counter value.


    Widget #7 is the Text, which displays the updated counter. In the ''setState()''
    approach, the whole widget tree was rebuilt. In the ''Provider & ChangeNotifier''
    imple-mentation, the Text widget was not notified about the counter change.


    ![](img/ffb84d2e382861a17088a545dbd2b0c6_287_0.png)


    FIGURE 19.1 BLoC architecture overview'
