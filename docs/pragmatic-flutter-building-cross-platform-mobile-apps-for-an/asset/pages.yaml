    # DISTRIBUTING APP ON GOOGLE PLAY STORE


    In this section, we’ll go over the basic steps to publish your app bundle ‘aab’
    artifact to the Play Store. I recommend reviewing the detailed launch checklist
    here (Google Play).


    # Creating Application


    Once you’re at Google Play’s publishing portal (Google Play Console), click the
    ‘Create Application’ button to get started with publishing your app. You’ll get
    a prompt to enter the name of your application. Once you enter the name for your
    app and choose the target language, you are redirected to the store listing next.
    Make sure to keep saving the draft as you make progress.


    # App Releases


    In this section of the portal, you upload the ‘aab’ artifact. There are four tracks
    that you can choose to upload your app/APK artifacts.


    +   1. Production track (Production): In this track, the app becomes available
    to all users on the Google Play Store.

    2. Open track (Beta): In this track, the app is available for open testing. Anyone
    with the link can access the test.

    3. Closed track (Alpha): In this track, the app becomes available for closed testing.
    The app becomes allowed to listed users.

    4. Internal test track: In this track, the app becomes available for internal
    testing quickly. In contrast, other options may take several hours to become available.
    It requires the allowed testers.


    It’s recommended to upload artifacts for internal testing first and then gradually
    move up to the production track. This strategy helps to catch the bugs and issues
    much earlier for users worldwide later.


    # Store Listing


    This is where you provide the app’s short and detailed description. Be ready with
    a high-resolution app icon (512 × 512), feature graphic (1024 × 500 h), and screenhots
    for supported devices like phones and tablets in our case. You can use the Android
    Asset Studio (Launcher icon) to generate app icons. All screenshot images and
    category should follow a 2:1 ratio.


    Choose the application type and category for the app. It’s required to apply a
    content rating on your app listing. Take content rating questionnaire to apply
    a content rating. You need to upload your ‘aab’ artifact before you can take a
    content rating questionnaire. may provide your contact details under the ‘Contact
    details’ part of the Store Listing.


    # App Content


    In this section, you need to provide details about the privacy policy, ads integration,
    granular login-based app access, target audience information, and content rating.'
