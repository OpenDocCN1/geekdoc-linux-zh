  md: "# Integrating REST API\n\n```\n? Text(\"Google Books API response\\n $booksResponse\"\
    \n: Text(\"No Response from API\"),\n```\n\n# LOADING DATA AT APP STARTUP\n\n\
    As you can see that `build()` method is triggered whenever `setState()` is updated.\n\
    However, it may not be a wise choice because every time the interface is rebuilt,\n\
    `fetchBooks()` will be called, and an API request in turn. It could quickly go\
    \ in a cycle and end up making a network request every time. This could lead to\
    \ numerous amounts of API calls to Google Books API and run out your free API\
    \ quota limit quickly and/or incur API request costs needlessly.\n\nTo solve this\
    \ problem, it makes sense to make sure you make REST API call only when needed.\
    \ In our case, we need to fetch data only once. To do so, we means call `initState()`\
    \ method from `BookListingState`. This method is executed exactly one time in\
    \ the lifecycle of the StatefulWidget.\n\n```\nclass _BookListingState extends\
    \ State<BookListing> {\n  String booksResponse;\n\n  //method to fetch books asynchronously\n\
    \  fetchBooks() async {\n    //making REST API call\n    var response = await\
    \ makeHttpCall();\n\n    //Updating booksResponse to fetched remote data\n   \
    \ setState((){\n      booksResponse = response;\n    });\n  }\n\n  @override\n\
    \  void initState() {\n    super.initState();\n    fetchBooks();\n  }\n\n  @override\n\
    \  Widget build(BuildContext context) {\n    return Scaffold(\n      body: SingleChildScrollView(\n\
    \        child: booksResponse != null\n          ? Text(\"Google Books API response\\\
    n $booksResponse\"\n          : Text(\"No Response from API\"),\n```"
