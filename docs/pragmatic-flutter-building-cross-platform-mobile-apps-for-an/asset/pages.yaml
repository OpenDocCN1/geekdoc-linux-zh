    # **Expanded WIDGET


    The Expanded (Expanded class) widget is a single-child layout widget. This layout
    is used for a specific child of the multi-layout widgets like Row, Column, and
    Flex. The child widget wrapped in Expanded widget expands to fill the available
    space along the main axis. It expands horizontally for Row parent and vertically
    for Column parent. It uses a flex factor to let the child widget know how much
    available space they can take up. The child wrapped in the Expanded widget takes
    up all the open space. It uses the `flex` property to allocate space in case there
    is competition between Expanded widgets for available space.'
