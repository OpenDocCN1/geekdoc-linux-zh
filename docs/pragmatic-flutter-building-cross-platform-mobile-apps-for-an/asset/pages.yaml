  md: "# # Dart Fundamentals\nA Quick Reference to Dart 2\n\nDart programming language\
    \ is developed by Google. It has been around since 2011. However, it has gained\
    \ popularity recently since Google announced Flutter software development kit\
    \ (SDK) for developing cross-platform-applications. Dart aims to help developers\
    \ build web and mobile applications effectively. It works for building production-ready\
    \ solutions for client applications as well as for the server-side. Dart has an\
    \ Ahead-of-Time (AOT) compiler that compiles predictable user code natively for\
    \ the target platform. It is optimized to build customized user interfaces natively\
    \ for multiple platforms. The Dart is a developers-friendly programming language.\
    \ It is easy for developers coming from different programming language backgrounds\
    \ to learn Dart without much effort.\n\nDart 2 (Announcing Dart 2 Stable and the\
    \ Dart Web Platform) is the latest version of Dart language including the rewrite\
    \ of many features, improved performance and productivity. This chapter covers\
    \ the basics of Dart 2 language syntaxes (Google, 2020) to get started with the\
    \ journey of building applications using Flutter. A prior understanding of object-oriented\
    \ programming is needed to follow along with the material. Dart 2 and Dart will\
    \ be used to infer the Dart 2 programming language in this book. In the upcoming\
    \ topics, we'll review some of the language features with the help of examples.\n\
    \n# THE MAIN FUNCTION\n\nThe `main()` function is the entry point for any Dart\
    \ program. The following code snippet will print \"Hello Dart\" on the console.\
    \ Open a `Terminal` at MacOS or its Windows or Linux equivalent. Create a file\
    \ say `hello.dart`, and copy the following code snippet in.\n\n```\nvoid main()\
    \ {\n  print(\"Hello Dart\");\n}\n```\n\n# Running DART PROGRAM\n\nGo back to\
    \ the ‘Terminal’ and execute the file using `dart hello.dart`. “Hello Dart” is\
    \ printed on the console.\n\n```\n$ dart hello.dart\nHello Dart\n```"
  merge: -1
