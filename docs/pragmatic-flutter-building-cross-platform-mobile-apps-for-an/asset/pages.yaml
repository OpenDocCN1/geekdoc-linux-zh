    FIGURE 4.6 `New Flutter Application` screen (setting package name)


    Next, provide the package name to organize the source code. You also need to select
    the support for ''android artifacts'' and Kotlin and Swift language support for
    Android and iOS platforms as displayed in Figure 4.6.


    # CROSS-PLATFORM FLUTTER PROJECT STRUCTURE


    The Flutter project has shared code in the `lib` folder. Each platform has its
    folder to keep the platform-specific code. There are ''android'', ''iOS'', ''web'',
    ''linux'', and ''macOS'' folders for each platform Flutter App can be deployed.
    To visual for project structure is shown in Figure 4.7.


    Let''s check out the details of significant project directories and files:


    +   - lib/: This folder contains Dart files. This is a shared code across all
    platforms like iOS, Web, Desktop, and embedded devices. In this book, we are focusing
    on Android, iOS, Web, and Desktop (macOS) only.

    - android/: This folder contains Android code, including AndroidManifest.xml.

    - ios/: This folder contains the iOS application'' native code in the Swift language.

    - web/: This folder includes `index.html`, assets that can be deployed to the
    public hosting site.

    - linux/: This folder contains the Linux platform-related code. This folder is
    generated by enabling the support for desktop (Linux) but can only be compiled
    on a Linux machine.

    - macos/: This folder contains native code for the macOS platform.'
