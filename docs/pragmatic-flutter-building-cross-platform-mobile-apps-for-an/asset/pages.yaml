    widget. `IntrinsicHeight` widget helps to set the height of its child widget when
    there''s unlimited height available to it. This class is expensive. The cheap
    way of limiting the widget size is to use the `SizedBox` layout widget. This widget
    is used when children of a `Row` (Row class) widget are expected to expand the
    height of the tallest child.


