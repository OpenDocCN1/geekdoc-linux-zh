  md: '# Integrating REST API


    First, you''ll need to get an API key for yourself. You need this to be able to
    make API requests to Google servers. Once you have your own API key, don''t forget
    to replace it with "YOUR _ API _ KEY".


    # GETTING AN API KEY


    Our BooksApp makes requests to fetch public data from Books API. Such requests
    need to be accompanied by an identifier like an API key (Using API keys). Follow
    these steps to request an API key for Google Books API:


    +   - The first step is to acquire the API key (Acquiring and using an API key)
    on Google Console''s credentials page (Credentials). You need to have a Google
    account to be in and create a project.

    - Create a project in Google Cloud if you dont have an existing project.

    - Click on ''Create Credentials'' -> ''API Key''

    - Clicking on ''API Key'' will generate the key and will provide an option to
    restrict key access to Books API only (Figure 12.1).

    - Your key will be available under the ''API keys'' section on the ''Credentials''
    page. You may want to rename the key to something memorable for future references.

    - Keep this API key safe to be used in the code.

    - Update the API key in the code.


    # ACCESSING API


    Now that you have your API key safe & handy to use in your code later. The placeholder
    "YOUR_API_KEY" shall be updated with your API key. Google Books API gives a generous-free
    API quota of a limit of 1000 queries per day to explore and learn API.


    ![](img/ffb84d2e382861a17088a545dbd2b0c6_207_0.png)


    FIGURE 12.1 Creating credentials in the Google Cloud console interface'
