    # SPREAD OPERATOR


    Dart 2.3 introduced the spread operator (Spread Operator) and null aware spread
    operator to combine multiple lists into one. Let''s create a list `theList` with
    two items and a list `nullList`. If you want to merge these two lists into another
    list, say `anotherList`, it can be done using spread (...) and null aware spread
    (??).


    ```

    List theList = [''Dart'', ''Kotlin''];

    //null list

    List nullList;

    ```


    ```

    // Spread operator ... Flatten the list and to be merged with another list

    // Null spread operator ...? Helps to avoid runtime exceptions iterator called
    on null.

    List another = [''Java'', ...theList, ...?nullList];

    ```


    ```

    // Printing the merged list created using spread operators

    print(anotherList);

    ```


    ```

    // Output

    [Java, Dart, Kotlin]

    ```


    # TRANSFORM LIST ITEMS


    The `map` on the `List` can be called to transform the list items. Let''s append
    the word `Language` to objects of the `theList` list.


    ```

    List theList = [''Dart'', ''Kotlin''];

    result = theList.map((e) => "$e Language").toList();

    print(result);

    ```


    ```

    // Output

    [Dart Language, Kotlin Language]

    ```


    # FILTERING


    The `where` method on `List` can help filter items meeting specific criteria.
    In the following code snippet, we are filtering the words containing the letter
    ''a''. Only ‘Dart’ matches these criteria, `result` will hold only the word ‘Dart''.'
