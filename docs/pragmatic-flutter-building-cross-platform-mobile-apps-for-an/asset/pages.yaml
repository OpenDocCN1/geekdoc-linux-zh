  md: "# 236\n\n# Pragmatic Flutter\n\n```\nbook: booksListing[0],\n  },\n},\n{\n\
    ```\n\nIn static navigation, the routing table is assigned statically. That means\
    \ any object can be passed in the routing map only. This requires data to be available\
    \ at the top-level. We can pass the `book` object to the BookDetailsPage for the\
    \ `/details` route name. As you can see that this value is static and cannot be\
    \ changed with the update in the book selection in BookListing items list. The\
    \ value is retrieved by accessing `List<BookModel> booksListing`, which gets updated\
    \ after the REST API response is returned. For `/details` route, only one object\
    \ is assigned for the lifecycle of the app as `booksListing[0]`. This causes to\
    \ show the same book's details for every book displayed in the BookListing widget.\n\
    \n# NAVIGATION IMPLEMENTATION\n\nAll routes/pages have entries in the routing\
    \ table above. The Map entry '</details, BookDetailsPage()' added to the navigateDetailsPage\
    \ screen. The '/details' is the alias/name to the BookDetailsPage screen. This\
    \ name is pushed on the Navigator widget using `Navigator.pushNamed(pushNamed<T>\
    \ extends Object)`.\n\n# DETECTING GESTURE\n\nThe navigation is initiated from\
    \ the user activity on the homepage screen, similar to a direct navigation example.\
    \ The GestureDetector widget is used to detect the gestures. It handles the tap\
    \ gesture on the listing with `onTap` property. Let's check out the new way of\
    \ pushing routes on the Navigator widget in the code below. Please note the new\
    \ route '/details' are pushed on the Navigator stack. This route is declared in\
    \ the MaterialApp routing table.\n\n```\nonTap: () =>\nNavigator.pushNamed(context,\
    \ '/details')\n---\n```\n\n# PASSING DATA\n\nAs we saw earlier, the data can be\
    \ passed to the BookDetailsPage() at the top-level only when the routes are assigned\
    \ to `routes` property. In this case, only globally available data can be passed\
    \ to another widget. In this implementation, only the first item `booksListing[0]`\
    \ detail widget is available for any selection on the homepage."
