  md: "# 196\n\n# Pragmatic Flutter\n\n),\n}\n...\n\n# DISPLAYING DATA IN APP\n\n\
    Now that we've remove data fetched and updated in the `booksResponse` variable,\
    \ we are ready to display it in our interface. Since this data is a large blob\
    \ of text, we need a widget that can adapt to scrolling if needed. The `SingleChildScrollView`\
    \ widget can help with this requirement. It can accommodate a large blob of text\
    \ in a scrolling manner.\n\nAs soon as we start the app, it displays a message:\
    \ 'No Response from API' on-screen since no data is available. The remote data\
    \ is fetched using the `await makeHttpClient()` method. The variable `booksResponse`\
    \ is updated in the `setState()` method. The `setState` triggers rebuilding the\
    \ interface with newly fetched data, and a large text is displayed on the screen.\n\
    \n# RUNNING CODE\n\nLet's put what we have learned so far together and run the\
    \ code to see the Flutter application displaying data on the screen on all platforms:\
    \ Android, iOS, MacOS, and Chrome.\n\n> Note: Don't forget to update the apikey\
    \ with your own key. Replace “YOUR_API_KEY” with the key you obtained earlier.\n\
    \n# COMPLETE CODE\n\n---\n\n```\nimport 'package:flutter/material.dart';\nimport\
    \ 'package:http/http.dart' as http\nimport '../config.dart';\n\n//Making HTTP\
    \ request\nFuture<String> makeHttpClient() async {\n  final apikey = \"$YOUR_API_KEY\"\
    ;\n  final apiEndpoint =\n    \"https://www.google.com/books/v1/volumes?key=${apikey}&q=python\"\
    \n  final http.Response response =\n    await http.get(apiEndpoint, headers: {'Accept':\
    \ 'application/json'});\n\n  //This will print `flutter: Instance of 'Response'`\
    \ on console.\n  print(response);\n  return response.body;\n}\n```"
