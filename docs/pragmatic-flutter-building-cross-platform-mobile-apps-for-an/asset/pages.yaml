    # ListView Widget


    The ListView widget is used for laying out its children in a scrolling manner.

    One way to build a ListView widget is to use ListView.builder. It has two main
    properties:


    +   - itemCount: This property includes the number of items to be displayed in
    ListView.

    - itemBuilder: This property takes an anonymous function with two parameters (context,
    index) to render each row of the list. The index keeps track of the number of
    items in the list.


    A BuildContext (BuildContext class) is like the handle to the location of a widget
    in the widget tree.'
