  md: "# 8 Responsive Interfaces\n\nThis chapter focuses on building responsive layouts\
    \ for Flutter applications. The responsive layouts can adjust themselves based\
    \ upon the space available to render their widgets. We will cover FittedBox (FittedBox\
    \ class), Expanded (Expanded class), Flexible (Flexible class), FractionallySizedBox\
    \ (FractionallySizedBox), LayoutBuilder (LayoutBuilder class), and Wrap (Wrap\
    \ class) widgets.\n\n# FittedBox WIDGET\n\nThe FittedBox (FittedBox class) fits\
    \ its child within the given space during layout to avoid overflows. It positions\
    \ and scales (or clips) its child as per the `fit property, which helps to fit\
    \ its child into the space allocated during layout. It makes sure that its child\
    \ is inside the parent widget.\n\nLet's understand the usage of FittedBox by adding\
    \ a Row widget with two Image widgets as children.\n\n```\nRow(\n  children: [\n\
    \    Image.asset('assets/flutter_icon.png'),\n    Image.asset('assets/flutter_icon.png'),\n\
    \  ]\nn)\n```\n\nWhen the code above is added to the `body` of the Scaffold widget,\
    \ the second image overflows to the right of the screen, as shown in Figure 8.1.\n\
    \nWrapping the Row widget in FittedBox makes sure that both of the Image widgets\
    \ are contained inside the FittedBox without overflowing out the screen.\n\n```\n\
    FittedBox(\n  Row(\n    children: [\n      Image.asset('assets/flutter_icon.png'),\n\
    \      Image.asset('assets/flutter_icon.png'),\n    ]\n  )\n)\n```\n\nFigure 8.2\
    \ shows both Image widgets adjusted inside the screen without overflowing to the\
    \ right."
