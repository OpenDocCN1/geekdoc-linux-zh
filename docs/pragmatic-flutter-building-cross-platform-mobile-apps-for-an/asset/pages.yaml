  md: "# CONSTRUCTING BookModel\n\nLet's create a BookModel class to hold the API\
    \ movie listing data set. The BookModel class will have members for each attribute\
    \ of the JSON response.\n\ns?id=4pgQfXvekcc&rdid-book=4pgQfXvekcc&rdot=1&source=gbs_\n\
    \n# The BookModel.fromJson(...)\n\nThe BookModel.fromJson(Map<String, dynamic>\
    \ json) takes a JSON map and assigns corresponding values to the BookModel object's\
    \ members. This is the entry point that is called to parse JSON responses received\
    \ from the network. In this case, JSON response attributes are tiered. Each tier\
    \ will have its own models. The BookModel class needs access to volumeInfo, accessInfo,\
    \ and saleInfo attributes/members.\n\n# BookModel Class\n\nBookModel.fromJson()\
    \ uses a factory constructor. The factory constructor is used when implementing\
    \ a constructor that doesn't always create a new instance of its class. It's useful\
    \ when getting an object from a cache rather creating a duplicate.\n\n```\nclass\
    \ BookModel {\n  final VolumeInfo volumeInfo;\n  final AccessInfo accessInfo;\n\
    \  final SaleInfo saleInfo;\n\n  BookModel({this.volumeInfo, this.accessInfo,\
    \ this.saleInfo});\n\n  factory BookModel.fromJson(Map<String, dynamic> json)\
    \ {\n    return BookModel(\n      volumeInfo: VolumeInfo.fromJson(json['volumeInfo']),\n\
    \      accessInfo: AccessInfo.fromJson(json['accessInfo']),\n      saleInfo: SaleInfo.fromJson(json['saleInfo'])\n\
    \    );\\n  }\n}\n```\n\n\"buyLink\": \"https://play.google.com/store/books/detail\"\
    \n\"accessInfo\": {\n  \"webReaderLink\": \"http://play.google.com/books/reader?id=4pgQfXvekcc&hl=en&printsec=frontcover&source=gbs_api\"\
    \n}"
