    ```\n\n# MyHomePage StatefulWidget\n\nThe StatefulWidget keeps the state of the\
    \ variable(s) in the widget. The MyHomePage is a StatefulWidget. It uses `_MyHomePageState`\
    \ class to hold the state(s) of the variables. It keeps a reference to the `Counter`\
    \ class created earlier to access the counter's number.\n\n```\nclass MyHomePage\
    \ extends StatefulWidget {\n  MyHomePage({Key key, this.title}) : super(key: key);\n\
    \  final String title;\n  @override\n  _MyHomePageState createState() => _MyHomePageState();\n\
    }\nclass _MyHomePageState extends State<MyHomePage> {\n  Counter _counter = Counter();\n\
    }\n```\n\n# METHOD TO INCREMENT COUNTER NUMBER\n\nThe `MyHomePageState` class\
    \ has a private method to increment the counter by one. It calls `counter.increment()`\
    \ from `setState()` to trigger the widgets to render the current counter number\
    \ on the screen."
