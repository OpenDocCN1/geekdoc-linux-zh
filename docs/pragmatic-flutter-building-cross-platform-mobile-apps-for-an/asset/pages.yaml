  md: "48\n\nPragmatic Flutter\n\n# FLUTTER WIDGETS\n\n# StatelessWidget\n\nA StatelessWidget\
    \ (StatelessWidget class) widget is immutable. Once it is created, it can't be\
    \ changed. It doesn't preserve its state. A stateless widget is created only once,\
    \ and it cannot be rebuilt at a later time. Stateless widget' 'build()' method\
    \ is called only once.\n\nLet's use the Container (Container Widget) widget to\
    \ understand creating a custom StatelessWidget. A widget is a convenience widget\
    \ that combines common painting, positioning, and sizing widgets.\n\nThe following\
    \ code snippet demonstrates how a Container widget is created in a stateless manner.\
    \ This widget is created only once.\n\n```\n```nclass MyStatelessWidget extends\
    \ StatelessWidget {\n  @override\n  Widget build(BuildContext context) {\n   \
    \ return Container();\n  }\n}\n```\n```\n\nStateless widgets don't keep track\
    \ of their state. Once they are created, their value can't be changed. If the\
    \ value of the stateless widget needs to be changed, then new widgets need to\
    \ be created with the updated value. Some of the Stateless widgets are below:\n\
    \n+   * Text widget (Text Widget): It contains the immutable string of letters.\n\
    * Icon widget (Icon Widget): The icon widget is immutable and not meant for interaction.\n\
    * Card widget (Card Widget): It is a material design card that that is used to\
    \ show relevant information.\n\nFigure 5.2 shows few examples of StatelessWidget.\n\
    \n![](img/ffb84d2e382861a17088a545dbd2b0c6_64_0.png)\n\nFIGURE 5.2 Examples of\
    \ StatelessWidgetWidget"
