  md: "# 88 Pragmatic Flutter\n\nThe HelloBooksApp displays a greeting text in the\
    \ middle of the screen. The smiley floating action button provides the option\
    \ to switch the greeting to a different language on every click.\n\n# LAYOUT WIDGET\n\
    \nIn the HelloBooksApp, the greeting text is displayed in the middle of the screen.\
    \ We need a layout widget (Layout Widgets) to hold the visible widget displaying\
    \ the text. The Center (Center class) layout widget centers its child horizontally\
    \ and vertically inside.\n\n```\n-\\-\nCenter(\n)\n---\n```\n\n# VISIBLE WIDGET\n\
    \nThe Text widget displays the greeting text.\n\n```\n-\\-\nText(\n  'Hello Books',\n\
    \  style: Theme.of(context).textTheme.headline4,\n),\n```\n\n# ADDING VISIBLE\
    \ WIDGET TO LAYOUT WIDGET\n\nThe Center widget is more like a container. We need\
    \ to add a visible widget as its descendant. At this point, we have got a layout\
    \ with a visible text string.\n\n```\n-\\-\nCenter(\n  child: Text(\n  'Hello\
    \ Books',\n  style: Theme.of(context).textTheme.headline4,\n),\n),\n```\n\n# ADDING\
    \ A LAYOUT WIDGET TO MaterialApp\n\nThe last step is to add the layout widget\
    \ to the MaterialApp. The MaterialApp provides the Scaffold widget that provides\
    \ application programming interfaces (APIs) to add app bars, bottom sheets, navigation\
    \ drawer, etc. The `body` property adds the layout widget for the main screen."
  merge: -1
