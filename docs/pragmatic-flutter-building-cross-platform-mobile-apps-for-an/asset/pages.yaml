  md: '# Preface


    Have you ever thought of creating beautiful blazing-fast apps for iOS and Android
    from a single codebase? Have you dreamt of taking native apps to the web and desktop
    without costing a fortune? If so, this book is the right place to start your journey
    of developing cross-platform apps.


    Google''s Flutter software development kit (SDK) is the latest way of developing
    beautiful, fluid-cross-platform apps for Android, iOS, Web, and Desktops (macOS,
    Linux, Windows). Google''s new Fuchsia user interface (UI) is implemented using
    Flutter as well. Learning to develop mobile apps with Flutter opens the door to
    multiple devices, form-factors, and platforms from a single codebase.


    You don''t need any prior experience with Dart to follow along with this book.
    However, it might have some familiarity with writing code in one of the object-oriented
    programming languages like Java and Python. You will pick up the fundamentals
    of Dart 2 language in the first chapter. We will learn to structure and organize
    the multi-platform Flutter project and test by using the same code on Android,
    iOS, web, and desktop platforms. Next, we will explore basic Flutter widgets along
    with layout while building a non-trivial UI. Later on we will continue to learn
    building responsive layouts for different screen sizes and form-factors.


    We will be organizing and applying styles, and handling user input, and gestures.
    We will move on to fetching data over the network, integrating, and consuming
    REST API in app. We will build a BooksApp to display books listing from Google
    Books API and integrate this API to fetch book data. Different types of testing
    strategies will be introduced to develop solid and high-quality apps. You will
    get hands-on experience using state management, data modeling, routing, and navigation
    for multi-screen apps. You will learn to Flutter plugins to persist data in the
    app. This book concludes by giving the pointers to deploy and distribute your
    Flutter app across all platforms.


    When you finish this book, you will have a solid foundational knowledge of Flutter
    SDK that will help you move forward in your journey of building and successful
    mobile apps that can be deployed to Android, iOS, web, and desktop (macOS) from
    a single code.


    Throughout the book, *Italic* is used to render file, code, and Flutter application.
    The monospace format is used to represent code snippets, variables name, and data
    structures. All examples used in this book are available in the GitHub repository:
    https://github.com/pyagicodecamp/pragmatic_flutter.


    Last but definitely not least, I want to acknowledge the input of my fellow developers
    Rajalakshmi Balaji, Preetika Tyagi, and Snehal Patil without whom book wouldn''t
    be possible. I am also thankful to the Flutter community worldwide for sharing
    their expertise and knowledge for developing great cross-platform applications.


    xiii'
