  md: "# Widget Testing\n\n# Custom Text WIDGET (NUMBER)\n\nThe counter number is\
    \ displayed as a string using MyText on the screen. The MyTextWidget is created\
    \ in a test environment with a default`textString` property initialized to '0'.\
    \ The `widget.pumpWidget()` method creates the MyTextWidget. The `find()` method\
    \ finds the Widget rendering '0' text. Since there's only one widget rendering\
    \ '0', the `Matcher` constant `findOneWidget` is used to assert the `expect()`\
    \ method as shown in the code:\n\n```\ntestWidgets('Testing Counter Text Widget\
    \ for number 0',\n  WidgetTester tester) async {\n\n// Creating Text widget\n\
    \  await tester.pumpWidget(MyTextWidget(textString: '0'));\n// Creating Finder\
    \ to widget created\nfinal myCounterText = find.text('0');\n```\n\n```\n// Verifying\
    \ widget using Matcher constant\nexpect(myCounterText, findsOneWidget);\n);\n\
    ```\n\n# Finding Widget Using Key\n\nThe other way to find a widget in the widget\
    \ tree is by using the widget key. A Key (Key class) is initialized to identify\
    \ widgets in a widget tree. We will create the test widget using Key. We will\
    \ run the test for the counter number same as in the last test case, but using\
    \ the Key time. The `widgetKey` is created using `Key('T')`, and assigned to the\
    \ counter MyTextWidget using the `nKey` property. Refer to the last chapter on\
    \ Unit testing to review the CounterApp in detail. MyTextWidget is found using\
