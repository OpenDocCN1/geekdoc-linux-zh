    These are some of the issues that developers may want to avoid by using cross-platform
    solutions to develop applications that can share a single codebase in one programming
    language.


    # **JavaScript + WebView**


    One solution for developing cross-platform applications from a single code is
    to use JavaScript with WebView(s). A WebView is a part of the browser''s engine
    that can be inserted into a Native app with loading web content. In this architecture,
    as shown in Figure 2.2, *App-X* creates hypertext markup language (HTML) contents
    and displays them in a WebView on the platform. The HTML/coding style sheets (CSS)
    is used to recreate the native equipment manufacturer (OEM) widgets. The app is
    written using a combination of JavaScript, HTML, and CSS. The platform’s services
    are accessed over the JavaScript bridge. The ''bridge'' the context switches between
    the JavaScript and the Native realms. It converts JavaScript instructions into
    Native instructions and vice versa.


    Some of the cross-platform frameworks are based on this approach PhoneGap (Ado)
    (Adobe PhoneGap), Apache Cordova, and Ionic. At the time of this writing, Adobe
    discontinued investment in PhoneGap and Cordova.'
