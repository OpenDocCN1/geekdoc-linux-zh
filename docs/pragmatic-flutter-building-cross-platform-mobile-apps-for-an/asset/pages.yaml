  md: "# Navigation and Routing 233\n\n# DIRECT NAVIGATION\n\nDirect navigation is\
    \ also known as unnamed routing. As mentioned earlier, it is implemented using\
    \ MaterialPageRoute. The MaterialPageRoutes is pushed directly to the navigator\
    \ widget stack. This approach can contribute to duplicate boilerplate code across\
    \ multiple pages. This boilerplate code multiplies with growing screens/pages.\
    \ It is challenging to keep track of logic wrapped around these routes in a commonplace\
    \ it spreads around multiple classes.\n\nLet's implement this type of navigation\
    \ in our BooksApp for navigating from the BooksListing page to BookDetailsPage.\n\
    \n# ENTRY POINT\n\nThe MaterialApp assigns the BooksListing screen to its home\
    \ property.\n\n```\n```dart\nclass BooksApp extends StatelessWidget {\n  @override\n\
    \  Widget build(BuildContext context) {\n    // Using Direct Navigation (un-named\
    \ routing)\n    return MaterialApp(\n      debugShowCheckedModeBanner: false,\n\
    \      home: BooksListing(),\n    );\n  }\n}\n```\n```\n\n# NAVIGATION IMPLEMENTATION\n\
    \nThis routing is implemented using Navigator.push(push<T extends Object> Object)\
    \ method. The MaterialPageRoute (MaterialPageRoute<T> class) is pushed on the\
    \ Navigator (Navigator class). The Navigator is a widget that manages a set of\
    \ child widgets as a stack. These child widgets are pages or screens pushed on\
    \ the Navigator widget. The Navigator widget refers to these children as Route\
    \ (Route objects).\n\n# DETECTING GESTURE\n\nThe navigation is initiated from\
    \ the user activity on the homepage page. That means the BooksListing page list\
    \ items need to be interacted with to navigate to its detailed page. The GestureDetector\
    \ (GestureDetector class) widget is used to detect the gestures. It handles the\
    \ taps on the list items using 'onTap' property.\n\n```\n```dart\nclass BooksListing\
    \ extends StatefulWidget {\n  @override\n  _BooksListingState createState() =>\
    \ _BooksListingState();\n```\n```"
