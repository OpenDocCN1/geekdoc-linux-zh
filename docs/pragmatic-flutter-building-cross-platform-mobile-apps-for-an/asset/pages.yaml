  md: "# 18 Provider and ChangeNotifier\n\nIn this chapter, we will add one more approach\
    \ to our exploration of state management. This approach will use a combination\
    \ of ChangeNotifier (ChangeNotifier class) and Provider (provider) package to\
    \ manage the counter state in CounterApp. This state-management solution helps\
    \ manage the state of widgets at the application level.\n\n# WHAT IS Provider\n\
    \nThe Provider (provider) package is a wrapper around the InheritedWidget (InheritedWidget\
    \ class) to make them easier to use and more reusable. The InheritedWidget is\
    \ a base class for all widgets and it propagates information down the widget tree.\
    \ The Provider(s) are placed above the widget(s) they're supposed to provide data.\n\
    \nIn the CounterApp, the `CounterApp()` is added as a child to ChangeNotifierProvider\
    \ automatically manages ChangeNotifier. It creates ChangeNotifier (ChangeNotifier\
    \ class) using `create`, and makes sure to dispose of it when ChangeNotifierProvider\
    \ is removed from the widget tree. We will be implementing a custom ChangeNotifier\
    \ named `CountNotifier()` later in this chapter.\n\n```\nChangeNotifierProvider(\n\
    create: (_) => CountNotifier(),\nchild: CounterApp(),\n)\n```\n\n# ADDING DEPENDENCY\n\
    \nThe provider package needs to be added to pubspec.yaml under the dependencies\
    \ section. You may want to upgrade the provider package's version to the latest.\n\
    \n```\ndependencies:\n  flutter:\n    sdk: flutter\n  #Provider package\n  provider:\
    \ ^4.1.2\n```"
  merge: -1
  pgno: 281
- img_proc: true
  md: "# WHAT IS ChangeNotifier\n\nThe ChangeNotifier class belongs to Flutter's Foundation\
    \ library (foundation library). It does what its name says. It notifies about\
    \ the change to any widgets that are subscribed to it. It can be extended or mixed\
    \ using mixins (mixins) to provide a change notification API.\n\nThe CounterApp\
    \ has `CountNotifier` that notifies about the update in the counter. It uses `notifyListeners()`\
    \ method to do this. Method notifies all listeners/subscribers about the new update.\n\
    \n```\nclass CountNotifier with ChangeNotifier {\n  int _counter = 0;\n  int get\
    \ counter => _counter;\n  void incrementCounter() {\n    print(\"Incrementing\
    \ and notifying\");\n    _counter++;\n    //Notifies about the change in counter\n\
    \    notifyListeners();\n  }\n}\n```\n\n# ANATOMY OF CounterApp\n\nNow we understand\
    \ ChangeNotifier and Provider widgets’ responsibilities, let’s take a look at\
    \ CounterApp’s widget tree in Figure 18.1.\n\nMost of the widgets are arranged\
    \ similar to examples discussed in previous chapters. There is a custom widget,\
    \ CounterWidget, responsible for displaying the updated counter value on the screen.\
    \ There are a total of eight widgets in this app:\n\n+   1. Scaffold: The root\
    \ widget.\n2. AppBar: Displays title of the app.\n3. Center: Aligns its children\
    \ in the center of the screen.\n4. FAB: AlignsActionButton to increase the counter.\n\
    5. Column: Aligns its children vertically.\n6. Text: Displays the information\
    \ text.\n7. CounterWidget: A custom widget to display a counter value on the screen.\n\
    8. Text: It is the child to ‘CounterWidget’. Displays the counter value.\n\nRefer\
    \ to Figure 18.1 for the anatomy of CounterApp’s implementation and ChangeNotifier.\n\
    \nLet’s dive into the code to understand the implementation details. The CounterApp’s\
    \ homepage is a StatelessWidget. This is because the state is managed using ChangeNotifier\
    \ and Provider. The ChangeNotifier updates the value and notifies its subscribers.\
    \ The Provider package takes care of passing along this updated value to the appropriate\
    \ widgets."
  merge: -1
