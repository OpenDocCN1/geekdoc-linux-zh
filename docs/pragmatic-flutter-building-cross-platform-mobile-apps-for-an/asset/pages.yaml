  md: '# 7 Building Layouts


    In this chapter, you will learn to build layouts for a Material Flutter application.
    A Material app follows the material design guidelines (Material Components widgets).
    Flutter also supports building layouts for non-materials applications. You''ll
    learn building layouts in Flutter (Layouts in Flutter) using layout Widgets (Layout
    widgets).


    We will begin with revisiting the HelloBooksApp from previous chapters. This will
    help to understand the process of laying out widgets in a Flutter application.


    # REVISITING HelloBooksApp LAYOUT


    Let''s revisit the HelloBooksApp from the previous chapter (Chapter 05: Flutter
    Structure) to analyze its four-part process of building its layout.


    +   1. Choosing a layout widget

    2. Creating a visible widget to display text

    3. Adding visible widget to layout widget

    4. Adding a layout widget to the app


    Refer to Figure 7.1 to revisit the layout structure of HelloBooksApp.


    ![](img/ffb84d2e382861a17088a545dbd2b0c6_103_0.png)


    FIGURE 7.1 Layout of HelloBooksApp'
