    \n# Types OF LAYOUT WIDGETS\n\nThere are two types of layout widgets:\n\n+   1.\
    \ Single child: There can be only one child added for these layouts. Few examples\
    \ are: Center (Center class), Container (Container class), Padding (Padding class),\
    \ ConstrainedBox (ConstrainedBox class), Expanded (Expanded class), Flexible (Flexible\
    \ class), FittedBox (FittedBox class), FractionallySizedBox (FractionallySizedBox\
    \ class), IntrinsicHeight (IntrinsicHeight class), IntrinsicWidth (IntrinsicWidth\
    \ class), LimitedBox (LimitedBox class), OverflowBox (OverflowBox class), SizedOverflowBox\
    \ (SizedOverflowBox class), SizedBox (SizedBox class), and Transform (Transform\
    \ class).\n2. Multi-child: Multiple children can be added to this type of layout\
    \ widgets. Few examples are Column (Column class), Row (Row class), Flex (Flex\
    \ class), ListView (ListView class), GridView (GridView class), Stack (Stack class),\
    \ IndexedStack (IndexedStack class), Flow (Flow class), Layout (Layout class),\
    \ ListBody (ListBody class), Table (Table class), Wrap (Wrap class).\n\nIn the\
