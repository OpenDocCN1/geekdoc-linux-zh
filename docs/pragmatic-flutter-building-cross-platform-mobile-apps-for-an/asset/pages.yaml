  md: "# BooksListing Widget\n\nThe BooksApp has BooksListing stateful as its home\
    \ property. This widget actually makes the REST call to fetch data. Since remote\
    \ data is fetched asynchronously, it may not be available at the time of building\
    \ the widget. The BooksListing widget is a StatefulWidget. The StatefulWidget\
    \ helps to rebuild the interface ever data is changed/updated. It uses the `setState()`\
    \ method to update the data. The interface rebuilt whenever data is changed inside\
    \ the `setState()` method.\n\nThe widget's state is managed by the `BooksListing`\
    \ class. The `BooksListing` defines the method to fetch book lists as the `fetchBooks()`\
    \ method. This is marked `async` to support making API calls asynchronously without\
    \ blocking the app. The `build()` method makes the REST call using the `fetchBooks()`\
    \ method and then goes on building its interface.\n\nThe variable `booksResponse`\
    \ of type `String` holds the data fetched from the HTTP call.\n\nThe `fetchBooks()`\
    \ method makes the remote call via `HttpClient()` and receives data over the network\
    \ asynchronously. It stores network response in variable `response`. Later, `booksResponse`\
    \ is updated with `response` in `setState()` method, and `build()` method is called\
    \ to rebuild the interface again.\n\n```\nclass BooksListing extends StatefulWidget\
    \ {\n  @override\n  BooksListingState createState() => _BooksListingState();\n\
    }\n\nclass _BooksListingState extends State<BooksListing> {\n  String booksResponse;\n\
    \n  //method to fetch books asynchronously\n  fetchBooks() async {\n    //making\
    \ REST API call\n    var response = await makeHttpClient();\n\n    //Updating\
    \ booksResponse to fetched remote data\n    setState(() {\n      booksResponse\
    \ = response;\n    });\n  }\n\n  @override\n  Widget build(BuildContext context)\
    \ {\n    //fetching books listing\n    fetchBooks();\n    return Scaffold(\n \
    \     body: SingleChildScrollView(\n        child: booksResponse != null\n```"
