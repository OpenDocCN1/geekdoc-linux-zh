  md: "Responsive Interfaces\n\n# LayoutBuilder WIDGET\n\nThe LayoutBuilder (LayoutBuilder\
    \ class) supports the multi-child layout. It builds widgets dynamically as per\
    \ the constraint passed by the parent. The LayoutBuilder layout works well when\
    \ creating responsive layouts. It can build appropriate layouts on the constraints'\
    \ maximum width (maxWidth) or maximum height (maxHeight). The LayoutBuilder calls\
    \ the builder function at the time.\n\nIn this example, LayoutBuilder renders\
    \ different widgets on the maximum width of the screen during layout time. It\
    \ renders `largeScreen()` layout for screens larger than 400 dips `smallScreen()`\
    \ for any screen with width less than 400 dips.\n\n```\nLayoutBuilder(\n  builder:\
    \ (context, constraints) {\n    if (constraints.maxWidth > 400) {\n      return\
    \ largeScreen();\n    } else {\n      return smallScreen();\n    }\n  }\n);\n\
