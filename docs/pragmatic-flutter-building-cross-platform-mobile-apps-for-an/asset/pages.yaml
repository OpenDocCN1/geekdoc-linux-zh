  md: "# Building Layouts\n\n# Constraints Property\n\nThe 'constraints' property\
    \ applies the size constraints to the Container widget. For example, BoxConstraints.tightFor(width:x,\
    \ height:y) creates a box for the given width 'x', or/and height 'y'.\nThe Container\
    \ widget looks like shown in Figure 7.7 when width and height are constrained\
    \ to '100'. You can notice the text cut-off because the size of the box is not\
    \ enough to display the full text.\n\n```\nContainer(\n  constraints: BoxConstraints.tightFor(width:\
    \ 100.0, height: 100.0),\n  child: Text(\n    \"Hello Container\",\n    style:\
    \ TextStyle(fontSize: 30),\n  )\n);\n```\n\n![](img/ffb84d2e382861a17088a545dbd2b0c6_111_0.png)\n\
    \nFIGURE 7.7 Container layout – constraints property"
