  md: "# Navigation and Routing\n\n# SOURCE CODE\n\nThe full source code of this example\
    \ (Chapter 14: Static Navigation) is available on GitHub.\n\n# DYNAMIC NAVIGATION\n\
    \nIn dynamic navigation, routes are generated dynamically with the help of a function.\
    \ This function implements the onGenerateRoute (onGenerateRoute property) callback\
    \ in the MaterialApp class. This is a type of Named Routing that makes use of\
    \ onGenerateRoute property.\n\nThe MaterialApp and AppBar provide the onGenerateRoute\
    \ property to assign the callback function, say generateRoute returning a route.\
    \ It allows the data to pass using RouteSettings (RouteSettings class). It carries\
    \ the data to help construct a Route (Route class).\n\nAny authorization or verification\
    \ logic can be extended to a single page. This routing provides the option to\
    \ show a default page when a route or match is not found. In our BooksApp, we\
    \ use the NotFound widget when no route is matched. It's a simple page that displays\
    \ the message that the requested page is not available.\n\n# ENTRY POINT\n\nThe\
    \ entry page Listing is assigned to home property. The initialRoute property can\
    \ be set to the beginning route/page. The generateRoute callback function handles\
    \ the navigational logic.\n\n```\nclass BooksApp extends StatelessWidget {\n \
    \ @override\n  Widget build(BuildContext context) {\n    //Using Dynamic Navigation\
    \ (Named Routing)\n    return MaterialApp(\n      debugShowCheckedBanner: false,\n\
    \      home: BooksListing(),\n      //Named with onGenerateRoute\n      initialRoute:\
    \ '/',\n      onGenerateRoute: generateRoute,\n    );\n  }\n}\n```\n\n# THE generateRoute()\
    \ FUNCTION\n\nThe generateRoute() function takes the RouteSettings as an argument,\
    \ which allows sending data along. The arguments property on the RouteSettings\
    \ object retrieves any arguments sent with the widget."
  merge: -1
  pgno: 253
- img_proc: true
  md: "```\nRoute<dynamic> generateRoute(RouteSettings routeSettings) {\n  final args\
    \ = routeSettings.arguments;\n  switch (routeSettings.name) {\n    case '/':\n\
    \      return MaterialPageRoute(\n        builder: (context) => BooksListing(),\n\
    \      );\n    case '/details':\n      if (args is BookModel) {\n        return\
    \ MaterialPageRoute(\n          builder: (context) => BookDetailsPage(\n     \
    \       book: args,\n          );\n      }\n      return MaterialPageRoute(\n\
    \        builder: (context) => PageNotFound(),\n      );\n    default:\n     \
    \ return MaterialPageRoute(\n        builder: (context) => PageNotFound(),\n \
    \     );\n  }\n}\n```\n\n# NAVIGATION IMPLEMENTATION\n\nThe Navigator uses the\
    \ Route object to represent the page/screen. The generateRoute() function returns\
    \ the appropriate route based on the matching name. RouteSettings is useful in\
    \ passing around these route names and arguments, if any. The route is extracted\
    \ using routeSettings.arguments. When no match is found, a common default page\
    \ is shown to display the appropriate message.\n\n# DETECTING GESTURE\n\nThe navigation\
    \ is initiated from the user activity on the homepage screen, similar to direct\
    \ and static navigation examples. The GestureDetector widget is used to detect\
    \ the gestures. It handles the tap gesture on the listing with `onTap` property.\n\
    \n# PASSING DATA\n\nDynamic navigation uses named-routing as well. This allows\
    \ passing selected book object `booksListing[index]` as an argument to generateRoute()"
