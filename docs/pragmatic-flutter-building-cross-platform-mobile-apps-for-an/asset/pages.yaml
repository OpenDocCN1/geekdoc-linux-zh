    # TEST FILE


    The next step is to create a test file to test the counter number’s increment
    and decrement functionality. Usually, this test file is created under the `test`
    folder of the root of the Flutter project. The file name ends in the `.test.dart`
    suffix. Since our CounterApp is located in `lib/counter20/main_20.dart`, the test
    file will be created at `test/main_20.test.dart`. The tests are written in a `test`
    block like:


    ```

    test(''Test description'', () {

    //test code

    });

    ```


    Multiple tests can be combined in one group like below:


    ```

    group(''Test group'', () {\ntest(''Test#1 Description'', () {});

    test(''Test#2 Description'', () {});

    });

    ```


    We''ll be testing the `Counter` class for four scenarios: default number at the
    beginning, increasing the number by one, decreasing the number by one, and finally
    incrementing and decrementing number in order.


    # Testing DEFAULT NUMBER


    In this case, the default counter number is tested. It''s expected to have a default
    number as ''0''. The number is accessed from the `Counter` class as `counter.number`.


    ```

    test(''Default Number is 0'', () {

    final counter = Counter();

    expect(counter.number, 0);

    });

    ```


    # INCREMENTING NUMBER


    Increasing the number by one will increase the counter by one. In this case, it''s
    expected `counter.number` to be equal to ''1''.'
