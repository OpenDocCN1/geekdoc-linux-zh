  md: "# Building Layouts 97\n\n# Decoration PROPERTY\n\nThe `decoration` property\
    \ is used to add shape to the Container widget. It uses BoxDecoration to provide\
    \ details. The BoxDecoration (BoxDecoration class) tells the widget how the box\
    \ around the Container widget will be painted. In simple words, this property\
    \ lets Container a border around it or drop a shadow. Let’s create a solid border\
    \ around the Container of specified width and color. Please note that the Container\
    \ widget's `color` property cannot be used along with `decoration`. The Container\
    \ widget's `color` and `decoration` property cannot be used together.\n\n```\n\
    Container(\n  decoration: BoxDecoration(\n    border: Border.all(\n      color:\
    \ Colors.amber,\n      width: 5.0,\n      style: BorderStyle.solid,\n    ),\n\
    \  ),\n  child: Text(\n    \"Hello Container\",\n    style: TextStyle(fontSize:\
    \ 30),\n  )\n)\n```\n\nRefer to Figure 7.9 to observe decoration property in Container\
    \ layout.\n\n# SOURCE CODE ONLINE\n\nThe source code for this example (Building\
    \ Layouts: Container Widget) is available online on GitHub.\n\n# Padding WIDGET\n\
    \nThe Padding (Padding class) widget inset its child as the given padding. It\
    \ creates space around the child. It takes care of resizing any constraints passed\
    \ to the child to be able to provide the given space around it.\n\nA Padding widget\
    \ is created as below. It uses the `padding` property to assign the amount of\
    \ space for the inset. The EdgeInsets (EdgeInsets class) class specifies the offset\
    \ from all four edges. In the example below, an offset of 8 dip (Density-independent\
    \ Pixels) is provided from the top, bottom, left, and right sides. The keyword\
    \ `const` is required when you are sure that the provided padding won’t change.\
    \ In this example, we’ll modify padding to show a few examples of different values\
    \ for padding property."
