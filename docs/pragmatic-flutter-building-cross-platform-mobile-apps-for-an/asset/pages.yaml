    Flutter uses Dart to write apps. It''s a delight to work with Dart language. It
    is an object-oriented language that is built on the most popular features of other
    reliable programming languages like Java and similar languages built upon object-oriented
    concepts. Dart is created, keeping developers in mind, and it is easy to learn
    to start being productive from day one.


