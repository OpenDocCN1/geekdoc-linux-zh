  md: "# 21 Widget Testing\n\nIn this chapter, you will learn the basics of testing\
    \ widgets (Widget Testing) in a Flutter application. The widget test lets build\
    \ and test widgets interactively. We will use the improvised default CounterApp\
    \ example from the previous chapter (Chapter 21: Unit Testing). Earlier, we used\
    \ the CounterApp to learn unit tests for Flutter applications. In this chapter,\
    \ you will use the same CounterApp for writing tests for this apps. We will test\
    \ the custom widget `MyWidget` used for displaying label text and counter number.\
    \ Additionally, we will write a widget `ElevatedButton` widget to increment and\
    \ decrement the number on the screen.\n\n# PACKAGE DEPENDENCY\n\nIn the last chapter,\
    \ the (test) package was enough to write unit tests for pure Dart code. For Flutter\
    \ widgets, you need tools shipped with the `flutter_test` (flutter_test_) package.\
    \ The `flutter_test` dependency is automatically added to pubspec.yaml under the\
    \ `dev_dependencies` section when creating the Flutter project.\n\n```\ndev_dependencies:\n\
    \  flutter_test:\n    sdk: flutter\n```\n\nThe `flutter_test` comes with tools\
    \ useful to widget testing. We will use the following methods to write widget\
    \ tests:\n\n+   * WidgetTester (WidgetClass): The WidgetTester's build interactive\
    \ widgets. It interacts with widgets and environments. These widgets can be tapped\
    \ programmatically to mimic the real-world user interface interactions. We will\
    \ be using the following methods of WidgetTester class:\n  * pumpWidget(widget)\
    \ (pumpWidget method): This method builds the given `widget` in a test environment.\n\
    \  * pump() (pump method): This method rebuilds the already built widgets in this\
    \ environment. This is a useful method when testing StatefulWidgets, which needs\
    \ to be rebuilt when their state is modified.\n  * tap(Finder finder) (tap method):\
    \ This method simulates the tapping on a widget in the test environment on the\
    \ found widget using Finder (Finder class) class."
