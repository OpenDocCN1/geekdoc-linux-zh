    The (Set<E> class) data structure holds a collection of objects only once. The
    duplicates are not allowed when storing data in ''Set''. Let''s create two sets
    to learn the usage.


    ```

    Set langSet = {''Dart'', ''Kotlin'', ''Swift''};

    Set sdkSet = {''Flutter'', ''Android'', ''iOS''};

    ```


    # ADDING ITEM


    Let''s add a new item ''Java'' in the `langSet` and print the final set.


    ```

    // Adding ''Java'' to Set

    langSet.add(''Java'');

    print(langSet);

    ```


    ```

    // Output

    {Dart, Kotlin, Swift, Java}

    ```


    # REMOVING ITEM


    Let''s remove the newly added item ''Java'' from `langSet` and print the final
    set.


    ```

    // Remove Java from Set

    langSet.remove(''Java'');

    print(langSet);

    ```


    ```

    // Output

    {Dart, Kotlin, Swift}

    ```


    # ADDING MULTIPLE ITEMS


    More than one item can be added all at once in `Set` using the `addAll()` method.
    It accepts the list of items. Let''s add multiple items to both sets.'
