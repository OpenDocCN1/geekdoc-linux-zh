  md: "# 284\n\n# Pragmatic Flutter\n\n```\n//Implementation in Mapping Event to State\
    \ section\n{\n}\n```\n\n# MAPPING EVENT TO STATE\n\nThe `Stream<CounterState>\
    \ mapEventToState(CounterEvent event) async*()` method maps a given event to its\
    \ counter state based on the business logic. When an event of type `ChangeEvent`\
    \ is passed, the new state is generated by the generator function. The new state\
    \ is calculated as `CounterState(counter: state.counter + 1)` where `state.counter`\
    \ is the current value of the counter. The combination of `async*` & `yield` provides\
    \ the stream of CounterState as it becomes `#3` in the diagram Figure 19.5. Internally,\
    \ this step maps to the `#4` & `#5` in Figure 19.5.\n\n```\n//#3: Mapping events\
    \ to their corresponding state based on business logic\n@override\nStream<CounterState>\
    \ mapEventToState(CounterEvent event) async* {\n  if (event is IncrementEvent)\
    \ {\n    //#4 + #5: Stream<CounterState> provides the stream of state.\n    Heavy\
    \ lifting done by BLoC library\n    yield CounterState(counter: state.counter\
    \ + 1);\n  }\n}\n```\n\n# Closing StreamController\n\nClosing streams controllers\
    \ are the same as the previous implementations.\n\n# INITIALIZING CounterBloc\n\
    \nThe `CounterBloc` initialization is similar to previous examples with a twist.\
    \ The `CounterBloc` constructor takes the initial state for the `CounterState`.\n\
    \n```\nfinal CounterBloc _bloc = CounterBloc(CounterState.initial());\n```\n\n\
    # PUSH UI EVENTS\n\nThis step maps to the #1 in Figure 19.5. In this step, the\
    \ user interaction with the app’s FAB as `IncrementEvent()` is added to the `CounterBloc`\
    \ and managed by the library thereafter."
