  md: "# Container WIDGET\n\nThe Container (Container class) widget is a simple and\
    \ versatile layout widget. It can hold only one child as its descendant. It has\
    \ versatile properties that can be leveraged to style its widget to change the\
    \ background color or shape and size. By default, it aligns itself to the top-left\
    \ corner of the screen.\n\nLet's add a Text widget with 'Hello Container' text\
    \ as its child. The TextStyle (Flutter Team, 2020) is applied to make the text's\
    \ font '30'.\n\n```\nContainer(\n  child: Text(\n    \"Hello Container\",\n  \
    \  style: TextStyle(fontSize: 30),\n  )\n)\n```\n\nThe 'Hello Container' will\
    \ render like, as shown in Figure 7.2.\n\n![](img/ffb84d2e382861a17088a545dbd2b0c6_106_0.png)\n\
    \nFIGURE 7.2 Container layout – default"
  merge: -1
