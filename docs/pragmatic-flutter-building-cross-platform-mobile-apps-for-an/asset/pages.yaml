  md: "Function testWidgets (testWidgets function): The `testWidgets()` functions\
    \ are similar to `test()` functions used in unit tests. Here is where you write\
    \ a test code for verifying a widget's behavior. It creates a WidgetTester for\
    \ the given test case.\n\n3. Finder (Finder class): It helps for widgets in the\
    \ test app. The Finder searches a widget tree to find a match for the pattern(s)\
    \ and returns the matched node(s).\n\n4. Matcher (Matcher class): This helps verify\
    \ whether the Finder class can locate a widget in the test environment.\n\n# TESTING\
    \ WIDGETS\n\nWe use all tools and functions mentioned above to write widget tests\
    \ for CounterApp. My TextWidget custom Text widget is used to render the display\
    \ label as well as to render the current counter number. The `testWidgets()` function\
    \ is used to write test code. It provides a `WidgetTester()` to create widgets\
    \ in the test environment. The `testWidget()` function is executed asynchronously\
    \ and doesn't block another test's execution. The widgets to be created are using\
    \ the `pumpWidget()` method asynchronously.\n\n# Custom Text Widget (LABEL)\n\n\
    In this test we will be testing the widget rendering the 'My Counter:' label on\
    \ the screen. The `testWidgets()` function is used to write the test code for\
    \ custom widget MyTextWidget with `testString` property. This widget is created\
    \ using Provider by the `testWidgets()` function. The WidgetTester class uses\
    \ the `pumpWidget()` method to create MyTextWidget with `testString` property\
    \ assigned to 'My Counter:' string. Once the widget gets to be created, the Finder\
    \ class `find()` is used to find the occurrence of a `Text` widget rendering 'My\
    \ Counter:'. The matched widget in the widget tree is stored in the `myCounterText`\
    \ variable. The `Matcher` constant `findOneWidget` finds one that matches the\
    \ criteria. The `findOneWidget` matcher.\n\n```\ntestWidgets('Testing Label Text\
    \ Widget (My Counter):',\n  WidgetTester widgetTester) async {\n  // Building\
    \ Text widget using WidgetTester\n  await widgetTester.pumpWidget(MyTextWidget(testString:\
    \ 'My Counter:'));\n\n  // Creating Finder to widget created\n  final myCounterText\
    \ = find.text('My Counter:');\n\n  // Verifying widget using Matcher constant\n\
    \  expect(myCounterText, findsOne);\n});\n```"
