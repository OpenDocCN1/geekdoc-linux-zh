    following concluding points are the general recommendations for building interfaces
    in Flutter.


    +   - If you know the direction of laying out the widgets, then use Row or Column.

    - If you don''t know the main axis direction for widgets, then use the Flex widget.

    - If you have only one child to display, then use Center or Align to position
    the child.

    - If a child is smaller than the parent, then wrap it in the Align (Align class)
    widget.

    - If a child is going to be bigger than the parent, then wrap it in a SingleChildScrollView
    (SingleChildScrollView class) or OverflowBox (OverflowBox class) widget.'
