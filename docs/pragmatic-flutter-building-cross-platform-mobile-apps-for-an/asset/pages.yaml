  md: '# # Introduction to State Management


    As real-world application needs to handle the application state sooner or later.
    As developers, we might start to build an application with one screen, but soon
    screens supporting different features join the band. These additional screens
    may need to know the state of the application at a given time. For example, for
    an e-commerce shopping application, the cart page should be updated based on what
    was selected from the catalog on the page before.


    When it comes to building Flutter applications where everything is a ''widget'',
    the deeply nested trees start to build up quickly. The widgets in tree-widgets
    might need to share the application''s state and pass their state to other widgets.
    It becomes crucial to handle the widget''s state sharing or ''State management''
    appropriately and efficiently to avoid the scaling issues that can lead to technical
    debts.


    In Flutter development, the architecture patterns and state management are used
    interchangeably. However, architecture patterns help to streamline code organization
    into separate responsibilities. There are many options to manage the state of
    the application in the Flutter applications. The Flutter apps are categorized
    into two types: Local (or Ephemeral) State and Application State. In broader terms,
    the local State class can be managed by a combination of StatefulWidget refers
    to the state scoped to a single widget, whereas the application state is application-wide.
    Refer to Flutter''s official documentation (Differentiate between ephemeral state
    and app state) to learn about state management in detail.


    The local state can be managed using a combination of StatefulWidget (StateWidget)
    and setState() (setState method) methods. However, there are several solutions
    available for managing an application-wide state. We''ll use Flutter''s default
    sample CounterApp to understand the various state-management solutions throughout
    several chapters. I have preferred this example to show the contrast in state-management
    implementations while, still, full code can fit in a single page.


    # ## REVISITING DEFAULT CounterApp


    Flutter creates a simple counter app by default when a Flutter project is created
    by command line or Android studio. The following command creates the default counter
    app.


    ---


    ```

    flutter create.

    ```


    It is a basic app with an app bar, two Text widgets in the middle of the screen
    to display the counter information, and a FloatingActionButton (or FAB) widget'
