  md: '# VARIABLES & DATA TYPES


    In Dart, you can use the `var` keyword to infer the underlying data type. The
    following code snippet declares variable `data` to hold the numeric value ''1''.


    ```

    var data = 1;

    print(data);

    ```


    The above code snippet will print the ''1'' on the console. The runtimeType (locatorType)
    property gives the runtime type of the object it''s called on. The following code
    snippet will print the data type of the `data` variable as ''int'' on the console.


    ```

    var data = 1;

    print(data.runtimeType);

    ```


    It''s valid for the `data` variable to be reassigned to a value from a different
    data type. There''s another keyword, `dynamic`, to assign a value to a variable
    similar to the `var` keyword. The difference between the two is that for `dynamic`
    keyword, the same variable can be reassigned to a different data type, as shown
    in the code snippet below:


    ```

    // Assigning int to dynamicData

    dynamicData = 1;

    // Prints `int` as data type on console

    print(dynamicData.runtimeType);

    ```


    ```

    // Re-assigning dynamicData to String data type

    dynamicData = "I''m a string now"

    // Prints `String` as data type on console

    print(dynamicData.runtimeType);

    ```


    # SOURCE CODE ONLINE


    The source code for this example (Chapter01: Quick Reference to Dart2 (Variables
    & Data Types)) is available at GitHub.


    # COLLECTIONS


    # List


    Dart''s List (List<E> class) is a collection that holds indexable objects. An
    empty list can be declared using two square brackets ''[]''. List items can be
    put inside these brackets separated by commas.


    ```

    List emptyList = [];

    ```'
