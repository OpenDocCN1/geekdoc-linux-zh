  md: '# 11 Persisting Data


    This chapter introduces persisting data in a Flutter application. There are two
    approaches to persist data on the disk permanently in Flutter applications. In
    the previous chapter (Chapter 10: Flutter Themes, 2021) you learned to toggle
    themes from one to another. However, that change doesn''t persist from launch
    to another. Users have to select a theme every they launch the app. This is not
    a very good user experience. It makes sense to persist the theme''s selection
    from the previous launch, so that users can have seamless experience across the
    multiple launches. In this chapter, you will learn to persist selection using
    two approaches: Key/Value datastore (Shared preferences) and Local database. Shared
    preferences are the better choice when there''s a small amount of data that needs
    to be stored. Local database is a better choice for a huge dataset. In real-world
    applications, it makes sense to use the Shared preference approach vs Local database
    is that Shared preference plugins can''t-guaranteeing writes to disk after app
    restarts. However, saving data to a Local database is more reliable. In this chapter,
    both approaches are demonstrated to persist for the selected theme on Android,
    iOS, web, and desktop-macOS platforms.


    # LIGHT THEME (DEFAULT)


    The BooksApp launches for the first time in the default theme. The BooksApp''s
    theme can be changed to the dark theme by clicking on the app bar''s infinity
    icon. However, if you exit the app and restart it restores to the light blue theme.
    This happened because the theme selection was not persisted (Figure 11.1).


    # DARK THEME


    The BooksApp''s dark theme is shown in Figure 11.2. The app''s theme can be switched
    back to light theme by clicking on the app bar infinity icon. However, none of
    the theme selection is persisted to the disk and will be restored to the default
    theme every time app restarts.


    In the following sections, you will learn to save the selected theme preference
    to the disk using key/value datastore and Local database variations.


    # KEY/VALUE DATA STORE (SHARED PREFERENCES PLUGIN)


    The Shared preference approach uses key/value pairs to store information on the
    device using Shared Preference Flutter plugin (Shared preferences). Shared preference
    plugin is useful in storing sized data using key-format on disk. This solution
    is useful when amount of data to be saved is relatively small like saving user
    preferences. In the previous chapter, you learned how to implement'
