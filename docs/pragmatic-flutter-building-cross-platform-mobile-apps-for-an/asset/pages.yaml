  md: "# Flutter App Structure\n\n# STATEFULWIDGET\n\nA StatefulWidget (StatefulWidget)\
    \ widget is mutable. It keeps track of the state. It rebuilds several times over\
    \ its lifetime. A StatefulWidget's `build()` method is called multiple times.\n\
    \n```\nclass MyStatefulWidget extends StatefulWidget {\n  @override\n  _MyStatefulWidget\
    \ createState() => _MyStatefulWidgetState();\n}\nclass _MyStatefulWidgetState\
    \ extends State<MyStatefulWidget> {\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return Container();\n  }\n}\n```\n\nSome of the examples of\
    \ Stateful widgets are below. They're meant to keep track of their state.\n\n\
    +   - Checkbox (Checkbox class): Keeps track of its state whether a checkbox is\
    \ checked or not.\n- Radio (Radio<T> class): Needs to remember its state if it's\
    \ selected or not.\n- TextField (TextField class): The TextField widgets enable\
    \ users to type in the text. That means it needs to keep track of what the user\
    \ has already typed.\n\nFigure 5.3 shows examples of StatefulWidget.\n\nIn the\
    \ HelloBooksApp, we'll use StatefulWidget to implement the 'Smiley' round button\
    \ to change the greeting display text.\n\n# DISPLAY ‘HELLO BOOKS’ TEXT\n\nWe will\
    \ start building the HelloBooksApp by displaying the ‘Hello Books’ text. The app\
    \ makes use of Material Design (Material Design). The MaterialApp\n\n![](img/ffb84d2e382861a17088a545dbd2b0c6_65_0.png)\n\
    \nFIGURE 5.3 Examples of StatefulWidget"
