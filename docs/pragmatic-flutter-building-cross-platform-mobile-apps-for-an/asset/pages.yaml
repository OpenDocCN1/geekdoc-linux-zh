  md: '# versionCode & versionName


    This can be set in the `version` attribute in the `pubspec.yaml` file. The versionCode
    specifies the internal app version, while versionName specifies the display string
    for the version in Play Store. The `version` in `pubspec.yaml` is specified as
    `1.0.0+1`. The first part, `1.0.0` is the versionName, and everything after the
    `+` sign is the versionCode. You can update the versionName to `1.0.1`, and versionCode
    to `2` at once in pubspec.yaml file below:


    ```

    version: 1.0.1+2

    ```


    # Building APP BUNDLE


    App bundles are the newer and recommended artifact type. Execute the following
    command in the Flutter project''s root directory to build the release artifact
    in `*.aab` file format. It is generated in the `<flutter-project-root>/build/app/outputs/bundle/release/`
    directory. The artifact is created is `app-release.aab`.


    ```

    flutter build appbundle

    ```


    The `app-release.aab` contains Dart and Flutter code compiled for ARM 32-bit (armeabi-v7a),
    ARM 64-bit (arm64-v8a), and x86-64. There''s only one artifact for each target
    application binary interface (ABI).


    # Building APK


    An APK artifact is needed for the distribution platforms that don''t support app
    bundle formats. By default, one APK contains native binaries for all the platforms/ABI(s)
    in one fat artifact and risks users to download files that are not an application
    to their device. In this case, it makes sense to create an APK targeted to a specific
    platform. The APK artifacts targeted to each application binary interface or ABI
    can be created using the following command:


    ```

    flutter build apk --split-per-abi

    ```


    The above command will generate artifacts in multiple ABI targeted artifacts `<flutter-project-root>/build/app/outputs/flutter-apk/`
    and `<flutter-project-root>/build/app/outputs/apk/release` directory. The artifacts
    generated in both directories are:


    +   * app-arm64-v8a-release.apk

    * app-armeabi-v7a-release.apk

    * app-x86-64-release.apk'
