  md: "# Transform PROPERTY\n\nThe `transform` property (transform property) is used\
    \ to transform the child before adding to the layout widget `Container`. The value\
    \ `Matrix4.rota-\ntion(0.3)` rotates the Container widget clockwise by the given\
    \ amount.\n\n\n```\nContainer(\n  transform: Matrix4.rotationZ(0.3)\n  child:\
    \ Text(\n    \"Hello Container\",\n    style: TextStyle(fontSize: 30),\n  )\n\
    )\n\n```\n\nRefer to Figure 7.8 to observe transform property of Container layout.\n\
    \n![](img/ffb84d2e382861a17088a545dbd2b0c6_112_0.png)\n\n**FIGURE 7.8** Container\
    \ layout – transform property"
