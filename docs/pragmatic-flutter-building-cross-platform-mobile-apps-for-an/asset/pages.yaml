    # SOURCE CODE ONLINE


    The full source code for this example (Chapter 21: Widget Testing) is available
    at GitHub. The CounterApp code is available here (Chapter 21: Widget Testing).


    # RUNNING WIDGET TESTS


    The widget tests can be run using the same command as unit tests.


    ```

    $ flutter test test/main_21_test.dart

    ```


    # OUTPUT


    The total time taken for executing all tests is displayed as `00:04`. The `+6`
    represents the number of tests executed. The last part, `All tests passed!`, displays
    the status of the test run.


    ```

    00:04 +6: All tests passed!

    ```


    # CONCLUSION


    In this chapter, you learned to write widget tests for CounterApp. You learned
    to use the `flutter_test` package to write tests for verifying the behavior of
    widgets. You used `WidgetTester`, `testWidgets()`, `Finder`, and `Matcher` to
    test the widgets'' behavior. The `WidgetTester` helped build interactive widget
    tests. The `testWidgets()` methods were used to write test code for verifying
    a getter''s behavior. The `Finder` class is used to search for widgets in the
    test app. The `Matcher` class helped verify whether the `Finder` class could locate
    a given widget in the environment.


