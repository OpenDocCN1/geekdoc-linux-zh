    # LOADING Theme


    The `BooksAppState` class holds the active theme in the `currentTheme` variable.
    The default theme is `AppThemes.light`. The theme settings are restored from persistent
    store during the app''s startup from the `initState()` method. The `loadActiveTheme()`
    gets the reference to Shared preference using `SharedPreferences.getInstance()`
    which is an asynchronous operation. The `await/async` keywords are used to get
    reference to SharedPreferences class. The AppThemes enumeration''s index is used
    as theme id, and saved in the Shared preference using `theme_id`. The app''s first
    launch will return `null` for `sharedPrefs.getInt(''theme_id'')`, and `AppThemes.light.index`
    is assigned as default `themeId`. Once `currentTheme` is assigned to the selected
    theme using `AppThemes.values[themeId]`, the `currentTheme` is called from the
    `setState()` method that rebuild the MaterialApp widget, and here reassigns `currentTheme`
    to the `theme` property of the MaterialApp.'
