  md: '# 2 Introduction to Flutter


    Flutter is an open-sourced software development kit (SDK) (Flutter) to develop
    cross-platform applications and is free to use. It''s Google''s SDK for crafting
    beautiful, fast, and natively compiled applications for mobile, web, and desktop
    from a single code base. Flutter applications are written in Dart language (Dart).
    The Dart is optimized for building custom user interfaces (UIs) and fast cross-platform
    applications. The Dart code compiles to Native machine code for the platform app
    running on. For example, the web Dart code compiles to JavaScript. Flutter is
    a complete framework that provides UI rendering and widgets, state management
    solutions, navigation, testing, and hardware application programming interfaces
    (APIs) to interact with device-level features like sensors, Bluetooth, etc.


    # CROSS-PLATFORM SOLUTIONS


    The term ''cross-platform solutions'' stands for the code reused across the different
    platforms or ''write code once and run everywhere''. The perfect cross-platform
    solution with hundred percent code reuse is the holy grails that every mobile
    developer dreams of. Let''s discuss some of the solutions used to maximize the
    sharable code across multiple deployment targets like web, Android, iPhone Operating
    System (iOS), and desktop.


    # NATIVE SDKs


    In the world of app development, Native SDKs (Software development kit) prominently
    refer to Apple iOS SDK (Develop iOS Applications) and Google''s Android SDK (Develop
    Android Applications) to build mobile applications on iOS and Android platforms,
    respectively. The iOS applications are developed using either Objective-C (Objective-C)
    or Swift (Swift) programming languages. The Android applications are developed
    using Java (Java) or Kotlin (A modern programming language that makes developers
    happier.) programming languages. Your app code runs natively on the platform.
    The Native code is compiled to run on a particular platform like iOS or Android.


    In this architecture, as shown in Figure 2.1, the application ''App-X'' talks
    to the platform and accesses platform services directly. The platform side creates
    widgets that are rendered on the screen''s canvas. The events are propagated back
    to the widgets. In this case, you would need to write two separate implementations
    of ''App-X'' for each platform. Different implementations mean both apps are written
    in entirely different languages as well.


    Android and iOS platforms support legacy (Objective-C for iOS and Java for Android)
    and modern (Swift for iOS, and Kotlin for Android) programming'
