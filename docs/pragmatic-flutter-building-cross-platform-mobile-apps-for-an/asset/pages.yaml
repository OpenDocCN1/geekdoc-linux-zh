  md: '# # 10 Flutter Themes


    In this chapter, you will learn the basics of Flutter themes and how to use it
    to style your apps. Flutter theme is used to define application-wide stylings
    like colors, fonts, and text. There are two ways to implement themes in Flutter:


    +   - Global Theme: Styling throughout the application. This chapter will define
    the global theme to style the BooksApp developed in the previous chapter (Chapter
    09: User Interface for BooksApp).

    - Local Theme: A specific widget. We will use the local theme to style one part
    of the BooksApp. We will style the `BooksListing` widget displaying books without
    impacting other parts of the app.


    # ## GLOBAL THEME


    A theme is used to style the entire app all at once. Global themes are implemented
    using ThemeData (ThemeData class). We will create and use a Global theme for BooksApp
    using ThemeData to hold styling information for the material apps. The ThemeData
    widget uses the following properties to define attributes.


    +   - The `brightness` (brightness property) uses the `brightness` property to
    assign light or dark color theme.

    - The `appBarTheme` (AppBarTheme property) property: The `appBarTheme` property
    defines the theme for the AppBar widget.

    - The `iconTheme` (iconTheme property) property: The `iconTheme` property of AppBarTheme
    declares theme selection for the icons used in the app bar. However, the iconTheme
    property for ThemeData defines the icon colors for the whole app. The IconThemeData
    (IconData class) defines the color, size, and opacity of icons.


    A ‘Home’ icon is added to the AppBar (AppBar class) widget to demonstrate styling
    in an app. Let’s create two light themes and one dark theme to understand creating
    and using them.


    # ## DEFAULT BLUE THEME


    The blue theme comes by default with the Flutter starter application. The AppBar’s
    color scheme can be customized using the `appBarTheme` property. The default light
    theme is stored in the `defaultTheme` variable.


    ```

    ThemeData defaultTheme = ThemeData(

    ```'
