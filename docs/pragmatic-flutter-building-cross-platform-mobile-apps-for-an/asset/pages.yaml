  md: "# Persisting Data\n\n# PREPARING DATABASE USING MOOR\n\nFirst, we'll use Moor\
    \ to prepare a database to save `themeId` and `theme-Name`. The active theme's\
    \ id will be saved in the database table. This table will have only one entry\
    \ at a time. When theme switches from light to dark, the older entry will be deleted,\
    \ and a newly selected theme's id will be added to this table. I kept it simple\
    \ on purpose to demonstrate how Moor can be integrated in your app.\n\nThe `ThemePrefs`\
    \ class extends `Table`. ThemePrefs table contains only two fields: theme_id to\
    \ save for the theme and another field themeName for saving.\n\n```\nclass ThemePrefs\
    \ extends Table {\nIntColumn get themeId => integer();\nTextColumn get themeName\
    \ => text();\n}\n```\n\nIt will generate a table called theme_prefs for us. The\
    \ rows of that table will be represented by a class called `ThemePrefs` auto generated\
    \ by `moor_generator_plugin`.\n\nFollowing part actually prepares the database\
    \ table. This is the class where migration strategy is described. I kept the migration\
    \ strategy simple on purpose. It resets the tables, and makes the light theme\
    \ default in case of first launch or upgrade.\n\n```\n@UMoor(tables: [ThemePrefs])\n\
    class MyDatabase extends $_MyDatabase {\n  @override\n  MigrationStrategy get\
    \ migration {...}\n}\n```\n\nThere is one method to activate the theme. It adds\
    \ the current theme's index/id to the table.\n\n```\nvoid activateTheme(AppThemes\
    \ theme) {\n  ThemePrefs pref =\n    ThemePrefs(themeId: theme.index, themeName:\
    \ theme.toString())\n      .into(themePrefs).insert(pref);\n}\n```\n\nThe other\
    \ method `deactivateTheme(int i)` removes the entry from the table for the given\
    \ `theme_id`."
