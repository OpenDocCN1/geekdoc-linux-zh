  md: '# 24 Pragmatic Flutter


    to the Flutter documentation (Get the Flutter SDK). You don''t need to worry about
    installing Dart because Dart SDK is bundled with Flutter SDK.


    In this section, we will briefly cover setting Flutter SDK in the macOS environment.
    The Flutter is in active development, and a lot of changes are expected. Please
    refer to the Flutter documentation to setup your Flutter environment for detailed
    and latest information. I am describing the installation process at a higher level,
    which is less likely to change.


    # Download Stable Flutter SDK


    It''s always a good idea to install the stable version for Flutter SDK to avoid
    unexpected behaviors. However, there''re many features related to web and desktop
    variants may not be available in the stable release. The good news is that you''re
    free to change from one version of Flutter to another using Flutter channels.


    # Update PATH


    Don''t forget to add Flutter SDK to your environment using `PATH` (Update your
    path). Once you''ve added the Flutter installation directory to your system''s
    `PATH` variable, you can execute the `flutter` command from the terminal (bash).


    # Flutter Doctor


    The `flutter doctor` command helps to find out if there are any required dependencies
    are not installed yet. If any dependency or tool is missing, it''ll let you know
    and tell you how to do it.


    # Flutter Channels


    Flutter channels are used to switch from one Flutter version to another. You can
    choose to switch between different Flutter channels using command `flutter channel`
    from the command line.


    ```

    $ flutter channel

    Flutter channels:

    * master

    dev

    beta

    stable

    ```


    There are four channels at this time you can choose from. You can switch to the
    preferred channel using the command `flutter channel <channel_name>`.


    +   * master: You can switch to the master channel using command `flutter channel
    master`. It contains bleeding-edge changes. You may need to switch to it to run
    some of the preview features. We may need to'
