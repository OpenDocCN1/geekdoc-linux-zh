  md: "# Data Modeling\n\n# CONSTRUCTING DATA MODEL\n\nIn this section, you'll learn\
    \ to create a data model object from a JSON formatted API response. We will create\
    \ a BookModel Dart class to parse the JSON response returned from API.\n\nBookModel\
    \ class will have members for each of the response[\"items\"] JSON attributes\
    \ returned as API response.\n\n# REVISITING Books API Response Structure\n\nThe\
    \ JSON response returned from Books API looks like a huge blob of string. It could\
    \ be hard to access the attributes by calling their names every time from code.\
    \ A spelling mistake can make debugging very hard.\n\nTo avoid this problem, it\
    \ makes sense to create a Dart object mapped to the response. We will call this\
    \ BookModel.\n\nEarlier\n\nAfter mapping data to the BookModel class, you can\
    \ access 'title' as bookObjvolumeInfo.title and so on.\n\n# Google Books API JSON\
    \ Response\n\n```\n{\n  \"items\": [\n    \"volumeInfo\": {\n      \"title\":\
    \ \"Learning Python\",\n      \"subtitle\": \"Powerful Object-Oriented Programming\"\
    ,\n      \"authors\": [\n        \"Mark Lutz\"\n      ],\n      \"publisher\"\
    : \"O'Reilly Media, Inc.\",\n      \"publishedDate\": \"2013-06-12\",\n      \"\
    description\": \"Get a comprehensive, in-depth introduction to the core Python\
