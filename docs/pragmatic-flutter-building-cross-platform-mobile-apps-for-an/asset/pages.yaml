  md: '# 12 Integrating REST API


    This chapter is an introduction to fetching data from a remote REST (Representational
    state transfer) API (Application Programming Interface) in a Flutter app. The
    Representational state transfer is a software architectural style for an API that
    uses less bandwidth for data transfer. It uses HTTP requests to access data. You''ll
    learn how to access The Google Books API (Books API v1 (Experimental)) to fetch
    books listing for the given criteria. The Google Books API allows to view books
    in JSON representation (JSON Representation) over the HTTP. The JavaScript Object
    Notation (JSON) is a type of data interchange format. It is a programming language
    that is independent and text-based. It uses key/value pairs to store information
    and is human-readable.


    Google Books (Google Books) is an effort to digitize the world''s books. The Google
    Books API lets developers search books based on content. We will use this API
    to search books that match specific criteria and fetch book listings using the
    REST API. Once we have data available, we will render the raw JSON data in a simple
    Flutter interface. We will touch on setting up an API key on Google API Console,
    and use Books API. We will dive into API details and learn how to make a REST
    API call to fetch results and display it in a Flutter app.


    By the end of this chapter, you''ll have a good understanding of getting your
    own API key from Google API Console. You will use this API to make a REST call
    to fetch book listings. Finally, you will learn to display the raw JSON response
    returned from API in Flutter.


    # WHAT IS AN API?


    An API (API) is an acronym for Application Programming Interface. An API lets
    two applications talk to each other. We will use API to fetch book information
    to learn consume APIs in Flutter applications.


    The Google Books API v1 (Books API v1 (Experimental)) provides programmatic access
    to content and operations available on Google Books Website (Google Books). Developers
    can use this API to create reading applications using Google Books data. Google
    Books API is v1 and experimental at the time of writing and provides the following
    features:


    +   - Searching a list of books for specified criteria.

    - Viewing book information like metadata, sales information, and preview links.

    - Access to users'' bookshelves and help manage their own bookshelves.


    The Books API contains information about digitized books available through the
    Google Books Website. API is the way to facilitate the app to fetch information
    from this giant book database into our application. At the time of writing, Google'
