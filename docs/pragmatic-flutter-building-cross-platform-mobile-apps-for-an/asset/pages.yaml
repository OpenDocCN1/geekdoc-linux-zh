  md: '# BLoC Design Pattern


    +   1. **Basic BLoC Pattern**: In this implementation, you will learn to implement
    a BLoC pattern using Dart''s built-in data types like Stream (Stream<T> class),
    sink (Sink<T> class), StreamController (StreamController<T> class) to manage the
    state of the counter in the defaultCounterApplication.

    2. **Improvised BLoC Pattern**: In this implementation, you will improve on the
    basic implementation by creating classes representing event(s) and state(s).

    3. **BLoC Library**: In this implementation, you will learn to use the `flutter_bloc`
    (flutter_bloc) library to implement the BLoC pattern.


    # BASIC BLoC PATTERN IMPLEMENTATION


    In this section, we will understand the fundamental and minimal implementation
    of the BLoC pattern. Let''s look into how the BLoC and streams, sink, and stream
    controllers fit together to manage the state of the CounterApp Flutter application.
    First, let''s understand the meaning of streams, sink, and controllers.


    +   - Stream (Stream<T>): A stream is a source of asynchronous data events. The
    Stream class provides a way to receive a sequence of asynchronous data events.
    A stream is listened to to start generating.

    - Sink (Sink<T>): The Sink class provides the destination for data. When an event
    is fired from the user interface, it can be put in a sink. A sink should be closed
    when no more data is added to it.

    - StreamController (StreamController<T> class): StreamController manages a stream.
    It creates a stream that can be listened to by others and adds events to it using
    Sink class.


    Refer Figure 19.4 to understand the BLoC internals.


    ![](img/ffb84d2e382861a17088a545dbd2b0c6_289_0.png)


    FIGURE 19.4 BLoC internal details'
