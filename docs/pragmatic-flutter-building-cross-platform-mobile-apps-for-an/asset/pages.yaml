  md: '# 17 ValueNotifier


    In the previous chapter (Chapter 16: Introduction to State Management), we discussed
    managing the widget''s state using the stateful widget. You learned to manage
    state in StatefulWidget using the `setState()` method. We noticed that the interface
    is rebuilt every time the counter was updated inside the `setState()` method.
    In this chapter, we will look into one of the solutions to avoid rebuilding the
    entire tree of StatefulWidget. We will learn to use ValueNotifier (ValueNotifier<T>
    class) to only rebuild the Text widget rather than rebuilding the entire widget.
    The widgets subscribed to ValueNotifier get notified whenever its value is updated.
    Using ValueNotifier implementation for managing states helps to reduce the number
    of times a widget is rebuilt.


    In this chapter, you will also learn to implement the state-management solution
    with the help of ValueNotifier, ValueListable, ValueListableBuilder as described
    below:


    +   1. ValueNotifier: This class belongs to Flutter''s foundation library (foundation
    library). It extends ChangeNotifier (ChangeNotifier class). The ValueNotifier
    holds a single value at a time. You will learn about ChangeNotifier in the next
    chapter (Chapter 18: Provider & ChangeNotifier).

    2. ValueListable (ValueListable<T> class): This class belongs to Flutter''s foundation
    library as well. It is the value emitted by ValueNotifier.

    3. ValueListableBuilder (ValueListableBuilder<T> class): This widget listens to
    the value emitted by ValueNotifier. It gets rebuilt whenever the ValueNotifier
    emits a new value.


