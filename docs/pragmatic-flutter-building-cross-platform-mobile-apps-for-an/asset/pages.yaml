  md: '# 13 Data Modeling


    In the previous chapter (Chapter 12: Integrating REST API), you learned to access
    books data from Google Books API (or Books API). You queried the API for fetching
    ''Python'' programming books and displayed the raw blob of JSON response in a
    Flutter widget of BooksApp. Now that you know how to receive the HttpResponse
    (HttpResponse class) response from API. In this chapter, you will learn to convert
    the response into JSON and parse it to render views in the Flutter ListView widget.
    Later in this chapter, the JSON formatted response is converted into the BookModel
    data model by mapping JSON response into the data model class. These Dart objects
    are used to build the same book listing Flutter user interface.


    # PARSING JSON


    The JavaScript Object Notation or JSON is a type of data interchange. The JSON
    format is programming language independent and text-based. It uses key/value pairs
    to store information and is human-readable. Dart provides the dart:convert (dart:convert
    library) library to parse JSON data.


    # The dart:convert Library


    The dart:convert library parses the JSON response into the Dart collection. In
    the following code, the apiResponse is response returned from http.get(apiEndpoint).

    The HTTP Headers are used to set JSON encoding using `application/json`. The json.decode()
    method takes the response''s body to parse it into Data structures. It returns
    a Map<K, V> as a Future object. Futures are the objects that return the results
    of the asynchronous operations.


    ```

    // importing the Dart package

    import ''dart:convert'';


    // Making HTTP request

    //Function to make REST API call

    Future<dynamic> makeHttpCall() async {

    //API Key: To be replaced with your key

    final apikey = "$YOUR_API_KEY";

    final apiEndpoint = "https://www.googleapis.com/books/v1/volumes?q=python+coding";nfinal
    key=$apiKey&responseType =

    await http http.get(apiEndpoint, headers: {''Accept'': ''application/json''});

    ```'
