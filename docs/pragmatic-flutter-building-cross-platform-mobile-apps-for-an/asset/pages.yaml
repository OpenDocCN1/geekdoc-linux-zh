  md: '# Pragmatic Flutter


    The Moor is the reactive persistence library for Dart and Flutter applications.
    It lets tables to be defined in Dart or SQL while supporting it with seamless
    ease and use query API and streaming results. It persists selected themes in Flutter
    application''s Local database using Moor plugin (moor plugin).


    # PACKAGE DEPENDENCIES


    The following dependencies need to be added to pubspec.yaml configuration file.


    +   - moor plugin (moor plugin): Persistence library built on top of sqlite for
    Dart and Flutter. It works on Android, iOS, Web platforms, and native Dart applications
    for persisting data in Local databases.

    - moor_ffi plugin (moor_ffi plugin): This plugin generates Dart bindings to sqlite
    using dart(dart:ffi library). The ''ffi'' stands for Foreign Function Interface.
    This plugin can be used with Flutter and/or VM applications and supports all platforms
    where sqlite3 is installed: iOS, Android (Flutter), macOS, Linux and Windows.
    However, at the time of this writing Moor plugin is in mid of cleaner implementation,
    and plugin is being phased out. It is recommended to migrate to a newer implementation
    (Phasing out the moor_ffi package). The newer implementation requires sqlite3_ffi
    dependency instead of moor_ffi sqlite3_ffi_libs (sqlite3_ffi_libs) to be added
    as a dependency. We will be adding ''sqlite3_flutter_libs'' (sqlite3_flutter_libs)
    instead.

    - path_provider plugin (path_provider): This Flutter plugin is used for accessing
    file systems on Android and iOS platforms.

    - path plugin (path): A cross-platform filesystem manipulation library that turns
    your Table classes from moor into database code.

    - moor_generator plugin (moor_generator): This library contains the generator
    that turns your Table classes from moor into database code.

    - build_runner plugin (build_runner): This package is used to generate files.
    We need this package to be able to run flutter packages pub build runner --delete-conflict-outputs
    to generate *.dart files.


    ```

    dependencies:

    moor: ^3.3.1

    sqlite3_flutter_libs: ^0.2.0

    #Helper to find the database path on mobile

    path_provider: ^1.6.11

    path: ^1.7.0

    ```


    ```

    dev_dependencies:

    flutter_test:

    sdk: flutter

    build_runner: ^1.10.2

    moor_generator: ^3.3.1

    ```'
