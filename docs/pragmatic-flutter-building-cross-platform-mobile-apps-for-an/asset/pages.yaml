    \ book: booksListing[index],\n),\n\n```\n\n# SOURCE CODE\n\nThe full source code\
    \ of this example (Chapter 14: Direct Navigation) is available on GitHub.\n\n\
    # STATIC NAVIGATION\n\nIn a static navigation application's top-level routing\
    \ table is implemented using a Map<K, V> class> of routes (pages/screens). This\
    \ routing table is assigned to MaterialApp routes (read-only property). The route\
    \ names for pages are pushed using pushNamed(...) (pushNamed<T> extends Object>method).\
    \ This routing is known as Named Routing because each page is given a unique name,\
    \ which is pushed on the Navigator widget.\n\nThe MaterialApp and WidgetApp provide\
    \ the routes. This property enables assigning routes as Map<String, WidgetBuilder>.\
    \ This option works better when there are not many logical steps wrapped around\
    \ the routes. For example, authentication or verification related code wrapped\
    \ around the logic for navigating to a particular page. In this type of navigation,\
    \ only the app's global data can be passed on to the second page.\n\n# ENTRY POINT\n\
    \nThe static navigation provides two ways to assign the initial page – BooksListing\
    \ widget. One option is to assign BooksListing widget to the home property. Second\
    \ option is to assign a route Map containing /, BooksListing() entry to routes\
    \ property. The '/' stands for the home page mapping.\n\n```\n//TheBooksListing\
    \ data is available global to app\nList<BookModel> booksListing;\nclass BooksApp\
    \ extends StatelessWidget {\n  @override\n  Widget build(BuildContext context)\
    \ {\n    //Using Static Navigation (Named Routing)\n    return MaterialApp(\n\
    \      debugShowCheckedModeBanner: false,\n      /home: BooksListing(),\n    \
    \  /Named-Routing using Map routing-table\n      routes: <String, WidgetBuilder>{\n\
    \        '/': (BuildContext context) => BooksListing(),\n        '/details': (BuildContext\
    \ context) => BookDetailsPage(\n```"
