    # FLUTTER


    The Flutter framework was developed by Google in 2017. Flutter is based on reactive-style
    views like React Native. It doesn''t use bridges to talk to the platform and avoid
    performance issues caused by the context switching from the JavaScript to the
    Native realm. Flutter uses Dart language, which compiles ahead-of-time (AOT) into
    Native code for multiple platforms.


    In this architecture, as shown in Figure 2.4, it doesn''t require any JavaScript
    bridge to connect to the platform. The Dart source code compiles to Native code,
    which runs on the Dart virtual machine. The Flutter comes with a vast library
    of widgets for Material and Cupertino (for iOS) design specifications. The widgets
    are rendered on the native canvas, and are sent back to widgets. ''App-X'' talks
    to platform services like Bluetooth, sensors, etc., using Platform Channels (Flutter
    Platform Channels), which are much faster than the JavaScript bridges.


