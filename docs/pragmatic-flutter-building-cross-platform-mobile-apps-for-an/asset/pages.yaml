  md: '# 15 The Second Page – BookDetailsPage Widget


    In previous chapter (Chapter 12: Integrating REST API), we learned to make REST
    calls to Google Books API and fetch book listings. Later in chapter (Chapter 13:
    Data Modeling), we learned to render book listings in the ListView widget. We
    also learned to create a custom widget – BookTile to generate each list item.
    The BookTile widget displayed only three essential information about book: title,
    author(s), and image of the cover page. In chapter (Chapter 14: Navigation & Routing),
    we learned about navigation from the homepage to another page. We started on adding
    the second page – BookDetailsPage to display detailed information about the selected
    book. However, the BookDetailsPage only showed the book''s title in the appBar
    and its description in the screen main area.


    In this chapter, we will continue designing and implementing BookDetailsPage to
    display more relevant information about the given book.


    # ANATOMY Of BookDetailsPage WIDGET


    Let''s start listing out the pieces of information that we are interested in displaying
    about the book.


    +   * Book''s title and subtitle.

    * Author(s) listing.

    * Publication details like publisher and publishing date.

    * Cover page imagery.

    * Web reader link to preview book sample.

    * Link to buy the book, if it is available for sale.

    * Detailed book description.


    Typically, the above can be categorized into three groups: quick book information,
    action items, and detailed description. Let''s rearrange the above information
    for their groups.


    +   1. Book Information: Title, subtitle, authors, publisher, publication date,
    and cover imagery.

    2. Action items: Web reader and buying links.

    3. Detailed Description: Book’s detailed description.


    Figure 15.1 shows the labeled interface for BookDetailsPage.'
