  md: "# Provider and ChangeNotifier\n\n![](img/ffb84d2e382861a17088a545dbd2b0c6_283_0.png)\n\
    \nFIGURE 18.1 Anatomy of CounterApp for Provider and ChangeNotifier implementation\n\
    \n# INCREASING COUNTER\n\nThe counter is increased by pressing the floating action\
    \ button (FAB). Let's check out the implementation of `onPressed` for this FAB.\
    \ The `incrementCounter()` is accessed by calling `read<CountNotifier>().incrementCounter()`\
    \ on the `context`. It executes the `incrementCounter()` method and updates the\
    \ counter without needing to rebuild. The Counter CountNotifier notifies its subscribers.\n\
    \n```\n//Widget#4\nfloatingActionButtonButton(\n  onPressed: () => context.read<CountNotifier>().\n\
    \    incrementCounter(),\n  tooltip: 'Increment',\n  child: Icon(Icons.add),\n\
    );\n```\n\n# CUSTOM WIDGET: CountWidget\n\nThe CountWidget is the custom widget\
    \ that displays the latest value of the counter on the screen. The Text widget\
    \ watches for any broadcasts/notifications sent by the CountNotifier. As soon\
