  md: '# 3 Setting Up Environment


    This chapter gives a quick introduction to setting up a development environment
    for developing Flutter applications. Flutter applications can be created in macOS,
    Windows, Linux, and Chrome OS. In this chapter, setting up the environment on
    macOS is covered. Please refer to the official documentation for setting up the
    environment on other operating systems (Install).


    The macOS supports developing Flutter apps for all four platforms: Android, iOS,
    desktop macOS application, and web app in Chrome or Safari. Flutter''s desktop
    support allows you to compile Flutter source code to native macOS or Linux desktop
    apps. However, a macOS Flutter desktop app can only be assembled on a Linux machine.
    In this book, we''ll be building Flutter app examples for Android, iOS, Web, and
    macOS desktop applications. You need at least one of the setups to be able to
    run your first Flutter app.


    The Flutter is under rapid development itself, and some of the features support
    to web and desktop are not rolled into stable release yet. The support for web
    is available in ''beta'' channel, and desktop support is available in ''dev''
    channel. You may want to switch your Flutter channel to ''dev'' when developing
    for web and desktop at the same time. The ''master'' channel has the bleeding
    edge improvements, features, and bug fix. However, this channel is most unstable
    as well, and needs to be avoided in production.


    # SYSTEM REQUIREMENTS FOR macOS


    You need a 64-bit macOS with 2.8 GB disk space only for Flutter installation.
    Other development tools and Integrated Development Environment (IDE) would require
    additional disk space. You should be comfortable with command-line tools. Flutter
    requires the following command-line tools installed in your environment.


    +   1. `bash`: Shell for macOS.

    2. `which`: Unix base command to locate executables in the system.

    3. `zip` & `unzip`: For compressing and decompressing files and directories.

    4. `mkdir` & `rm`: For creating and removing directories/or files.

    5. git (version 2 or greater): (Download for macOS): Tool for version control.

    6. curl (command line tool and library): Command line for data transfer.


    Once you''ve all these tools installed and ready, it''s time to install the Flutter
    development kit (SDK) in your environment.


    # SETTING UP FLUTTER SDK


    At the time of writing, the Flutter SDK''s stable version for macOS is 12.2.4
    (Flutter Stable 12.2.4). For the latest information about installing Flutter SDK,
    refer'
