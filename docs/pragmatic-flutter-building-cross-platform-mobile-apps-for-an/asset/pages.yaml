    # CONCLUSION


    In this chapter, Flutter widgets were covered and discussed. We learned that there
    are two types of layout widgets: Single- and Multi-child layouts. The Single-child
    layout can have one child whereas Multi-child layout can have multiple children.
    We revisited the HelloBooksApp to understand its layout structure. We discussed
    Single-child layouts like Container, Padding, ConstrainedBox, SizeBox, IntrinsicHeight,
    and IntrinsicWidth. You also learned about the Multi-child layouts like Row, Column,
    ListView, GridView, Table, Stack, and IndexedStack.'
