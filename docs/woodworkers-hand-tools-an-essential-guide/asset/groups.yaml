  - '[PAGE 85]


    # RABBET PLANES


    The rabbet plane (often called a filister plane) is used to cut rabbets on the
    edge of a work-piece, either with or against the grain (top photo). Since it is
    designed specifically for this task, it does an admirable job. The cutter extends
    the full width of the sole to cut cleanly into corners. A couple of add-on accessories
    make cutting highly accurate, and repeatable rabbets a breeze. First, there''s
    a guide fence that adjusts in and out either one or two arm rods that thread into
    the sole of the plane. Moving the guide in or out sets the width of the rabbet
    (bottom drawing). An adjustable depth gauge on the opposite side lets you set
    the depth of the rabbet. A three-pointed spur scribes a line in advance of the
    cutter to help clean cut across the grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_85_0.png)


    # Two blade positions


    I''ll never forget when I bought my first used rabbet plane at an auction: a rather
    nice Stanley No. 78. Since I didn''t know much about rabbet planes at the time,
    I thought it was missing a cutter, as the plane obviously has positions to mount
    two blades. So I embarrassed myself by asking the auctioneer if he knew where
    I could pick up a spare blade. He was kind enough to explain that a rabbet plane
    with only one blade was used in the center position for general rabbet work, and
    then moved forward to rabbet into a corner (similar to a bull-nose plane; see
    pages 87 and 88). To adjust the depth of cut on a rabbet plane, loosen the knob
    on the lever cap and pivot the depth-adjustment lever up and down. When the desired
    depth is reached, simply tighten the knob.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_85_1.png)'
  - '[PAGE 86]


    # The spur


    Undaunted by my embarrassing question about the missing blade, I asked the auctioneer
    if he knew where I could buy a replacement spur. The one on my robert plane looked
    like one of its four spurs had broken off. He gently pointed out that it should
    only have three cutting spurs. The "missing" spur is used for the "idle" position
    (top drawing); that is, it is rotated out of the way when it''s not needed—like
    after you''ve started a rabbet cut with the grain. If you leave the spur down
    so it''s scribing a fine line it''ll quickly dull. The idle position was created
    so you could keep the spur on the plane even when it wasn''t being used. The logic
    here was, there was no way to lose this little beast if you didn''t take off the
    plane and set it aside, where it would likely get swept away with a pile of shavings
    and discarded.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_86_0.png)


    # Basic use


    To use a rabbet plane, by securing the work-piece to your bench. Then set the
    guide fence and depth gauge for the desired cut. Make sure the cutting spur is
    in the active position, and then start the rabbet at the end of the work-piece
    (middle photo). Take a series of light cuts until the shoulder is defined, then
    slowly work your way backwards to the opposite end (bottom photo). If you''re
    planing with the grain, rotate the spur once the shoulder is defined. For cross-grain
    work, leave the spur the entire time. Take full-length, light strokes; if the
    blade is sharp, you''ll peel off full-length, crispy shavings.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_86_1.png)'
  - '[PAGE 87]


    # # SHOULDER PLANES


    After a good jack plane and a block plane, the next plane I''d suggest a beginning
    woodworking purchase is a shoulder plane (top photo). Shoulder planes excel at
    trimming rabbets, shoulders, tenados, and grooves. This is the tool for when a
    joint doesn''t fit right and needs a ''tweak'' or two to get perfect fit. Most
    shoulder planes are all-metal to help create heavy, dense tool that can effectively
    prevent or dampen plane chatter. The blade on a shoulder plane runs the full width
    of the body, and the sides and sole of the plane are ground at right angles to
    each other (bottom drawing).


    Shoulder planes come in widths ranging from 1/2" to slightly over an inch. As
    on a block plane, the blade is mounted bevel up and generally has an effective
    cutting angle of around 37 degrees. This makes it quite good at trimming end grain.
    Another thing that helps with trimming end grain and making fine cuts is an adjustable
    throat.


    On some planes this is adjustable by way of screw; other planes require that you
    add or remove screws between the two halves of the body to vary the placement
    of ways. On larger planes, the blade is often held fast by a lever cap while others
    use a more traditional lever cap screw that requires a screwdriver. Smaller shoulder
    planes generally use a wedge and are adjusted using wood-bodied planes: You tap
    on the front or rear of the body to lower or raise the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_87_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_87_1.png)'
  - '[PAGE 88]


    # Trimming tenons


    My general rule of thumb for cutting mortise-and-tenon joints is to cut the mortise
    first and then cut the tenue to fit. If you''re chopping the mortises by hand
    (see pages 118-120), you''ll likely find some variations from mortise to tenue.
    This means you''ll have to trim or fine-tune each tenue: a perfect job for the
    shoulder plane (top photos). Whenever possible, select a plane that''s wider than
    the area you''re intending to trim. Make sure to set the plane for a very fine
    cut and use a razor-sharp blade. As, take light cuts


    ![](img/82f8fd51f2b064bbc4df21354d664e50_88_0.png)


    and make sure to back up the shoulder with a scrap to prevent tear-out.


    # Smoothing rabbits


    Smoothing rabbits is another easy task for a shoulder plane. Position the plane
    so it fits firmly against the shoulder of the rabbit (middle photo). Use long
    as a shoulder plane as possible, as this helps flatten out any high spots that
    a shorter-bodied plane might rise up and over. Just as with a tenue, it''s important
    to back the trailing edge of the rabbit with a scrap to prevent tear-out.


    # COMBINATION SHOULDER PLANES


    There''s a nifty type of shoulder plane available that''s commonly called a combination
    plane (photo Tight). It''s basically two planes in one: a shoulder plane and either
    a bull-nose plane (see page 88) or a chisel plane (see page 89). The version from
    one to the other is made possible by lifting off a top piece (as shown here) by
    removing a front section of the plane. Sometimes this type of plane is called
    a 3-in-1 plane because it can function as a shoulder plane, bull-nose plane, or
    chisel plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_88_1.png)'
- md: '

    ## Cutting a rabbet


    You''ll occasionally hear as a shoulder plane referred to as rabbet plane. That''s
    because it can be used very effectively for this task (top photo). The disadvantage
    of using a shoulder plane versus a rabbet plane is that the shoulder plane doesn''t
    have a built-in guide fence or depth gauge. But one will work in a pinch as long
    as you clamp a scrap block to the workpiece to guide the cut, and check the depth
    with a rule. Also, since a shoulder plane doesn''t have cutting spurs, it''s a
    good idea to scribe a starting line when planing cross grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_0.png)


    ## Cleaning out a dado


    Another job I often assign to a shoulder plane is cleaning out grooves or dadoos.
    Naturally it''s best to use a shoulder plane that matches the width of the groove
    or dado, but you can usually get just fine with a narrower one as long as you
    get the bottom for flatness. Keep the side of the plane pressed firmly against
    the shoulders of the groove or dado as you plane (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_1.png)


    ## BULL-NOSE PLANES


    A bull-nose plane is a special type of shoulder plane that has a very short nose
    (photo at right). Instead of a longer front section, the nose is often only 1/4"
    wide. This makes the plane perfect for delicate work and for reaching in close
    corners. The disadvantage of using a bull-nose plane: the plane to travel up and
    down over undulations instead of flattening them. If you find this happening,
    it''s best to switch to a longer, standard shoulder plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_2.png)


    ## CHISEL PLANES


    A chisel plane is easily identified by the absence of a fore-sole (top photo).
    The advantage to this is that it lets you reach all the way into a corner—when
    cleaning up a rabbet, for example (middle drawing). A chisel plane is also useful
    for removing glue squeeze-out and for trimming plugs pegs flush with a surface.
    The disadvantage of having a fore-sole is that the blade has a tendency to not
    vibrate or chatter (bottom drawing). This makes the chisel plane generally unfit
    for regular planing tasks.


    A chisel plane in the workshop is like a 1-iron in your golf bag: You won''t use
    it most days, but when the conditions are right, it''s the perfect tool for the
    job. Yes, you could do most of the tasks listed above with other tools; but if
    your budget permits, you''ll be glad you picked one of these fine tools.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_90_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_90_1.png)


    ## CIRCULAR PLANES


    A circular plane (or compass plane, as it''s often called) is another one of those
    specialized planes that you''ll be glad you have when a project calls for planing
    a fair curve (top photo). The most distinctive feature of a circular plane is
    that it has a thin, flexible sole (bottom drawing). Adjusting the curvature forces
    the sole into either a convex or concave shape. The blade and cap rest on a frog
    that works much like that of any other metalbodied plane.


    Although Recoil still produces the No. 020C shown here, you can occasionally find
    a Stanley No. 13 (highly prized by tool collectors) at tool auction or on the
    Internet. I realize that many woodworkers would simply grab a belt sander or other
    electric sanding device to smooth a curved plane; but a circular plane will leave
    a cleaner, more fair curve than you can achieve with one of those noisy tools.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_91_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_91_1.png)


    ## Convex planing


    One of the classic uses for a circular plane is truing the perimeter of a round
    work-piece, such as a table (top photo). The beauty of using one of these planes
    is when the circle is true, you''ll know it: The plane''s cutting action will
    slow significantly. To use a circular plane for this, by adjusting the sole to
    closely approximate the curve of the work-piece. Adjust the plane blade for a
    fine cut and start planning. As with any plane, you''ll need to be careful to
    plane with the grain, and not against it. This takes a bit more thoughts, since
    the grain direction will change periodically around the top''s circumference.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_92_0.png)


    ## Concave planing


    A circular plane also makes quick work of truing up an inside curve (middle photo).
    Though you can start as you did with a convex cut by adjusting the plane''s sole
    to match the inside curve, I''ve found that the circular plane also works well
    for concave shapes. The flexibility of the sole allows it to adapt to the curve.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_92_1.png)


    ## JAPANESE PLANES


    A circular plane also makes quick work of truing up an inside curve (middle photo).
    Though you can start as you did with a convex cut by adjusting the plane''s sole
    to match the inside curve, I''ve found that the circular plane also works well
    for concave shapes. The flexibility of the sole allows it to adapt to the curve.


    A circular plane also makes quick work of truing up an inside curve (middle photo).
    Though you can start as you did with a convex cut by adjusting the plane''s sole
    to match the inside curve, I''ve found that the circular plane also works well
    for concave shapes. The flexibility of the sole allows it to adapt to the curve.


    ## SCRUB PLANES


    A scrub plane (also known as a rough plane) is another one of planes that you
    don''t see around the shop (top photo). That''s because they''re designed to quickly
    remove a lot of wood—when thickening a board, for example—and this job has been
    taken over by the thickness-planar. In many cases, scrub planes were made from
    old, worn-out jack planes. The throat was widened to prevent jams, as the shavings
    were thick and rough. The blade was usually a single cutter with no cap iron (bottom
    drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_94_0.png)

