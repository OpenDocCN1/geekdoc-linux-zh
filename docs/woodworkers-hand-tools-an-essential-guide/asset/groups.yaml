    # RULES


    If told me I could have only one measuring tool in the shop, I''d be hard-pressed
    to decide between the 6" metal rule that lives in one apron pocket and the 12-foot
    Starrett tape measure in the other. Although you might think I''d go for the tape
    rule, I''d stick with the metal rule. Why? It''s accurate, not for laying out
    joints, but also for checking them: A tape measure doesn''t slip into a tongue
    or rabbit cut the edge of a board like a metal rule. Fortunately, I don''t have
    to make that.


    # Type of rules


    Woodworkers can choose from a wide variety of rules made of either metal or wood
    (top photo). I prefer a metal rule because its thickness reduces problems with
    parallax associated with the thicker wooden rules. In my shop I have a 6", 12",
    and 1-meter metal rule. Another specialty rule is a hook rule (top inset). It
    has a plastic hook on one end that catches the edge of the work-piece for super-accurate
    measurement. When buying a graduation, check to make sure that the graduations
    are etched into the metal and not simply printed on (middle photo). Printed graduations
    can wear off time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_14_0.png)


