  - '[PAGE 49]


    # STARTING A CUT


    To make straight cuts with a saw, you have to start it straight. Sure, on saws
    with aggressively set teeth you''ll be able to correct the cut some-what; but
    you''re always better off starting the cut straight in the first place. Here are
    three effective ways to accomplish this:


    # Finger as a guide


    The classic way to start a saw cut is to use either a finger or your thumb as
    a guide (top photo). Start by marking a cut line on the board, then place the
    board on a saw-horse or clamp it to the bench. Next, use your thumb to guide the
    blade to the waste side of the cut. Try to keep the saw and your hand, elbow,
    and shoulder all aligned. Draw the saw back a few inches and make a series of
    short cuts to create a kerf. Keep the blade constantly pressed against your thumb.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_49_0.png)


    # Guide block


    For added accuracy you can start a cut with some type of guide block to hold the
    blade perpendicular- to the work surface (middle photo). A guide block not only
    keeps the edge square, but it also helps make a straight cut across the board.
    Often hand pressure alone will work to hold the block in place, but it''s better
    to clamp it to the board for stability.


    # Starting notch


    Regardless of the type of saw you''re using, the surest way to prevent it from
    hopping off the intended mark is to make a starting notch (bottom photo). Just
    draw the saw back a few times to make a notch.'
  - '[PAGE 50]


    # BACK SAWS


    The back saw (also known as a dovetail saw) can be one of the most important hands
    tools in the shop. If you hand-cut joinery, a quality back saw can make a big
    difference. Back saws are identified by the brass or steel ''back'' that wraps
    around the top of the blade (top photo). This added rigidity allows for a thinner
    blade (around 0.030" thick), which creates a thin kerf and makes it easy to follow
    a pencil line or knife.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_0.png)


    # Anatomy


    Back saws come in a variety of lengths ranging from 8" to 14" and have fine teeth
    (14 to 22 teeth per inch) that may be sharpened as crosscut, rip, or combination
    teeth. If you''re planning on doing a lot of hand-cut joinery pay for two back
    saws: one with crosscut teeth, the other with rip teeth. You''ll find two predominant
    styles on back saws: open and closed (middle drawing). This is really a matter
    of personal preference; some woodworkers prefer the extra rigidity a closed handle
    offers over an open handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_1.png)


    # Basic use


    Because the blade is so thin and the kerf is so fine, a well-sharpened quality
    back saw will generally steer itself in a perfectly straight cut—all you have
    to do is start the cut straight. Use a light grip on the saw and let it do the
    work (bottom photo). If you''re using a saw''s sharpened as a crosscut to rip
    (such as cutting the cheeks of a tenon), you''ll get better results if you stop
    often to clean out the kerf and the saw teeth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_2.png)'
  - '[PAGE 51]


    # GENT''S SAW


    A gent''s saw (also referred to as a dovetail, blitz, or slotting saw) is a special
    type of back saw designed for extremely fine work (top photo). A further refinement
    of this saw is known as an offset dovetail (inset). This type of saw features
    an offset handle and blade that can be reversed to make it easy to saw to a surface,
    as when trimming a through tenon. Since the handle is not in line with the blade,
    I don''t recommend this type of saw for cutting joints.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_0.png)


    # Anatomy


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_1.png)


    > Inset photo courtesy of American Tool Companies, Inc., copyright 2001


    | Steel or Brass Rib | Ferrule |

    |---|---|

    | Blade | Handle |


    # Basic use


    For the most part a gent''s saw should be reserved for use on small parts that
    require more delicacy than a back saw offers. They''re great for fine detail work
    like cutting small rabbets, tenons, or dovetails (bottom photo). Because the blade
    is so thin and the kerf is so tight, the saw will cut straight as long as you
    start it straight. The only exception to this is a saw''s not set correctly (see
    page 56 for more on this).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_2.png)'
  - '[PAGE 52]


    # # Bow SAWS


    If you''ve never used a bow saw, give it a try (top photo). It''s amazing how
    versatile one of these can be. A bow saw can be used to rip, crosscut, or cut
    curves. Although found less less in today''s shop, you can still find them in
    the occasional woodworking catalog. The beauty of a bow saw is that the blades
    are interchangeable. You install a wide rip blade for cross-cutting, or a fine
    blade for detail work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_0.png)


    # ## Anatomy


    A bow saw is a type of frame where the blade is held in the ends of an H-frame
    (middle drawing). Pins on the ends of the handles fit into holes in the ends of
    the blade. A stretcher connects to the checks of a loose mortise-and-tenon joint.
    Blade tension is provided by a twisted cord, cable, or threaded rod. The most
    common type of bow saw uses a toggle or twist stick to wind the cord to increase
    or decrease tension.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_1.png)


    # ## Basic use


    Select the desired blade and install it in the saw. Adjust the twist stick to
    tension the blade. The grip that you use with a bow saw is really a matter of
    personal preference. Some like to place their hands on opposite cheeks of the
    frame. A traditional grip is to hold a handle with one hand and then overlap your
    other hand over it as always. Others feel comfortable with just one hand guiding
    the saw (bottom photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_2.png)


    CUTTING TOOLS'
  - '[PAGE 53]


    # COPING AND FRET SAWS


    Coping and fret saws are yet other types of frame saws where the blade is held
    in a tensioned frame that is adjustable (top photo). Most coping saws accept a
    6/8"long, very thin, narrow blade with fine teeth—typically 15 to 32 teeth per
    inch. Fret saws often have deep throats or an adjustable frame, and accept blades
    with extremely fine teeth: as high as 96 teeth per inch. Both coping and fret
    saws are terrific for cutting curves, making pierced cuts, and getting into tight
    places. Coping saws have the added feature of a blade that can be pivoted to make
    it easier to follow a curve.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_53_0.png)


    # Anatomy


    Blade tension for coping and fret saws is supplied by the steel frame. The frames
    are usually held in place with cross pins (although older coping saws may use
    blades with a hook or loop on the ends). These cross pins fit into grooves in
    metal spigot at the top of the frame and in the handle (middle drawing). The handle
    spigot threads into the handle and allows for fine adjustment of the tension.


    # Changing blades


    To change the blade on a coping saw or fret saw, start by loosening the handle
    a few turns. Then position the saw upside down on your bench and press down on
    the handle slightly to "close" the frame (bottom photo). This creates sufficient
    slack in the blade so that you can slip the pin at one end of the blade out of
    the corresponding spigot. To install a blade, reverse the procedure. Insert the
    blade in one spigot, depress the frame, and slip the other pin in its matching
    spigot. Apply additional tension by tightening the handle.'
  - '[PAGE 54]


    # Basic use


    In most cases, I install a blade so it cuts on the pull stroke. This does two
    things: It provides better control, and it keeps the blade in tension better than
    what pushing (top photo and inset). Since these blades are so thin and fragile,
    they have a tendency to overheat. There are a couple of ways to prevent this.
    First, use the full length of the blade as you cut. Second, stop periodically
    and allow the blade to cool.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_0.png)


    # Delicate cuts


    For delicate cuts, such as cutting veneer or other thin materials for inlay or
    marquetry, the fret saw is the tool to use (middle photo). The extremely fine
    teeth let you negotiate curves without angling the blade. The secret to successful
    cutting is to fully support the thin material (see sidebar below). Also, it''s
    important to install the blade to cut down and on the pull stroke. This way cutting
    action pulls the material against the bird''s mouth (see the sidebar below) instead
    of away from it, which would cause the thin material to fracture.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_1.png)


    # BIRD''S MOUTH


    The best way to support thin material when cutting with a fret saw is to use a
    V-notched board, called a bird''s mouth, that clamps to your bench (drawing at
    right). The idea here is to position the work-piece and saw so that the cutting
    action takes place close to the point of the V for maximum support. For extremely
    accurate cuts, use the first few inches of blade nearest the handle, where the
    blade is the most rigid.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_2.png)


    CUTTING TOOLS 53'
