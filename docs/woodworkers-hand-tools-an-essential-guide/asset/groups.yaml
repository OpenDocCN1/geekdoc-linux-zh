    # BAR CLAMPS


    # Sliding bar clamps


    Of all the clamps in my shop, sliding bar clamps are what I reach for most often
    (top photo). In fact I keep them in a rack directly behind my bench they''re right
    at hand. These clamps feature a fixed jaw that''s attached to a steel bar, and
    a sliding jaw with adjustable screw that can quickly open or close the jaws. Quality
    sliding bar clamps (Bessey''s is my favorite: www.jamesmorton.com) come with plastic
    pads to cover the jaws and protect the work. They''re available in jaw capacities
    from 4" to 38" and with varying reach (depth).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_0.png)


    # Aluminum bar clamps


    I became quite attached to a set of aluminum bar clamps I used in a production
    shop several years ago (middle drawing). They are extremely lightweight and easy
    to work with. You might think they''d bend under pressure, and you''d be right—they
    do. So what good are they? Well, here again, if you need to exert heavy pressure
    to close up gaps, something is wrong. If you''ve done your work with care, these
    clamps will get the job done. Jorgensen (www.adjustableclamp.com) sells these
    in various lengths, although you generally need to special-order them.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_1.png)


    # Steel I-beam clamps


    Steel I-beam clamps are the bruisers of the clamping world. These heavy-duty clamps
    exert wood-crushing force. They feature heavy castings and an I-shaped steel beam
    (bottom drawing), which keeps the beam from bowing under the considerable pressure
    these clamps produce. I-beam clamps are popular in professional shops because
    they don''t bow with use over time, as pipe clamps will. If used judiciously,
    these are great clamps. In the hands of a "Popeye"type clamper, they can do more
    damage than good.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_2.png)'
  - '[PAGE 168]


    # CLAMPING RULES


    +   ### Rule #1: Always dry-clamp


    One of the most reliable ways to prevent clamping problems is to dry-clamp your
    project before you reach for the glue bottle. Dry-clamping a couple of things.
    First, it double-checks that all the parts fit well together. This might seem
    obvious, but I''ve seen many workers sweat over glue and glue only to find a tenon
    doesn''t fit in a mortise, or a rail or cleat too short. Dry-clamping prevents
    this annoying problem. It is also a good way to check clamp placement—and just
    as important, to make sure you''ve got enough clamps on hand. Finally, it gets
    the clamps adjusted the proper distance to span the workpiece so that will go
    quickly. And this is particularly important if you''re working with yellow glue,
    since it has a relatively short open time (about 15 minutes).


    +   ### Rule #2: Protect the workpiece


    Since clamps can apply any pressure, take the time to pad every clamp to the surface
    of the workpiece (see page 162). You should also protect the workpiece from excess
    glue. The best way is to apply the right amount in the first place so that it
    doesn''t squeeze out onto the workpiece.


    If you encounter excess squeeze-out, wipe off the surplus with a clean, damp cloth.


    +   ### Rule #3: Position the clamps for uniform pressure


    Make your clamps are positioned to the sides and edges of a workpiece (unless
    you''re intentionally trying to rack the workpiece back into square (see page
    163). Center the clamps on the workpiece and space them evenly. When gluing up
    panels, take care to distribute the glue pressure on the panel (see page 164).


    +   ### Rule #4: Don''t overcast


    Next to skipping the dry-clamping stage, overcast is one of the main reasons glue-ups
    fail. The problem is that clamps are capable of exerting a lot of pressure, especially
    the steel-beam type. And it is all too tempting to just crank a little harder
    to tighten the up in the joint. Don''t over-clamp the wood, and the wood will
    have its ways and likely split. Here''s another advantage of dry-clamping. If
    something doesn''t fit right, take it apart and tweak it until it does. If everything
    fits properly, you shouldn''t apply a lot of pressure. What you''re looking for
    is an bead of glue squeeze-out at the joints—all the glue creates a “starved”
    joint—leaving nothing behind to create a bond.


    The first time I used a Bessey K-body clamp (www.jamesmorton.com), I was skeptical
    (top photo). According to the manufacturer, the clamp was guaranteed to remain
    parallel as pressure applied, unlike many other clamps where the jaws tilt out
    under great pressure. They work so well that I continue to buy more as my budget
    allows. That''s the only downside to these clamps. They''re expensive (about $50
    for a 4-foot clamp) but well worth it.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_168_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_168_1.png)'
  - '[PAGE 169]


    # THE WORKBENCH


    My favorite clamp in my entire shop is my workbench. That''s right, my workbench.
    The classic Ulmia bench II I picked up almost 25 years ago is still my favorite
    clamping tool (top photo). It features a pair of vises (one front, one tail) and
    a built-tool tray. Naturally the vises provide a lot of clamping capacity but
    what really makes this bench my are the bench dogs and dog holes. Bench dogs are
    wood or metal bars that fit into holes along the length of the bench and into
    holes in the tail vise.


    The beauty of this arrangement is that you can clamp as long as the surface without
    any additional clamps. Just insert bench dog in the tail vise, position the workpiece,
    and open or close the vise until a hole is exposed at the end of the workpiece.
    Slip in dog and tighten the vise. An added benefit of this system is that the
    dogs can be adjusted up or down to keep them below the surface of the workpiece.
    This means you can work on the entire surface


    at once, something that''s essential planing, scraping, or sanding a surface.

    When shopping for a bench, look for stout legs, a thick top, and two vises, including
    a tail vise with dog holes (bottom drawing). Note if you find a bench you like
    and it doesn''t have bench dogs, you can add these after the fact (see the sidebar
    on page 170). Also, if you find you can''t afford the bench you want, consider
    making one. Woodsmith sells an excellent set of plans for a classic European-style
    workbench (www.augusthome.com).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_169_0.png)'
  - '[PAGE 170]


    # BENCH VISES


    A workbench without a solid vise is like a power sander without electricity. You
    could still sand with it by rubbing it on the workpiece, but why not use it to
    its full potential? You''ll need to install at least one sturdy (two) quality
    woodworking vises (top photo) have long been a favorite of woodworkers (www.recordtools.com).
    In particular, their model 521/2ED, with its 9" jaws and 13" opening, is well
    regarded as one of the better-all purpose vises. Most of Record''s vises incorporate
    their patented "Quick-release" feature that lets you open and close the jaws quickly
    without having to turn the screw (inset).


    A bench vise should have belly castings and an adjustable front dog that can be
    used to clamp workpieces. The fixed jaw of the vise is generally "let in" or mortised
    into the front edge of the bench; the adjustable jaw moves in and out as the main
    screw is rotated by the handle (bottom drawing). Both jaws of the vise should
    be lined with wood to prevent damage to the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_1.png)


    CLAMPING TOOLS 169'
  - '[PAGE 171]


    Mounting a bench vise can be simple or complicated. It''s simple if you just bolt
    it to the front edge of the bench and screw it to the underside. The problem with
    this is that a work-piece''s clamped in the vise will always protrude from the
    front edge of the bench. This isn''t a big deal for a short workpiece, but if
    the workpiece is long, it''s difficult to clamp the unsupported end to the edge
    of the bench. This problem goes away when you mount the vise so the fixed jaw
    ends up flush with the workbench edge (actually the fixed jaw is flush with the
    edge). To mount a vise this way, you''ll need to cut a notch in the front edge
    of the bench to accept the vise and liner (top drawing). In many cases, it''s
    also necessary to insert a filler piece or shim between the mounting plate and
    the underside of the bench; consult your vise mounting instructions for details.
    NOTE: High-quality vises can "rack" or twist of square if you clamp a short piece
    in the vise. To prevent this, just insert a scrap of similar thickness at the
    opposite end of the vise to evenly distribute the pressure (middle drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_171_0.png)


    # BENCH DOGS


    Although they have a funny name, bench dogs are an important part of a functioning
    workbench (photo at right). They can be square, rectangular, or round and fit
    into correspondingly shaped holes in the top. If you buy a bench with rectangular
    dogs (like my Ulmia), I recommend that you make wooden versions. All it takes
    is one slip of sharp chisel into a metal dog to understand why. Also, if your
    bench doesn''t have dogs, you can buy ones and simply drill a series of holes
    in the benchtop.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_171_1.png)'
