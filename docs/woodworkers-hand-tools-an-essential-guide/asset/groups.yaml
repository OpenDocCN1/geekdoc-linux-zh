    # STARTING A CUT


    To make straight cuts with a saw, you have to start it straight. Sure, on saws
    with aggressively set teeth you''ll be able to correct the cut somewhat; but you''re
    always better off starting the cut straight in the first place. Here are three
    effective ways to accomplish this:


    ## Finger as a guide


    The classic way to start a saw cut is to use either a finger or your thumb as
    a guide (top photo). Start by marking a cut line on the board, then place the
    board on a saw-horse or clamp it to the bench. Next, use your thumb to guide the
    blade to the waste side of the cut. Try to keep the saw and your hand, elbow,
    and shoulder all aligned. Draw the saw back a few inches and make a series of
    short cuts to create a kerf. Keep the blade constantly pressed against your thumb.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_49_0.png)


    ## Guide block


    For added accuracy you can start a cut with some type of guide block to hold the
    blade perpendicular to the work surface (middle photo). A guide block not only
    keeps the edge square, but it also helps make a straight cut across the board.
    Often hand pressure alone will work to hold the block in place, but it''s better
    to clamp it to the board for stability.


    ## Starting notch


    Regardless of the type of saw you''re using, the surest way to prevent it from
    hopping off the intended mark is to make a starting notch (bottom photo). Just
    draw the saw back a few times to make a notch.


    ## BACK SAWS


    The back saw (also known as a dovetail saw) can be one of the most important hands
    tools in the shop. If you hand-cut joinery, a quality back saw can make a big
    difference. Back saws are identified by the brass or steel ''back'' that wraps
    around the top of the blade (top photo). This added rigidity allows for a thinner
    blade (around 0.030" thick), which creates a thin kerf and makes it easy to follow
    a pencil line or knife.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_0.png)


    ### Anatomy


    Back saws come in a variety of lengths ranging from 8" to 14" and have fine teeth
    (14 to 22 teeth per inch) that may be sharpened as crosscut, rip, or combination
    teeth. If you''re planning on doing a lot of hand-cut joinery pay for two back
    saws: one with crosscut teeth, the other with rip teeth. You''ll find two predominant
    styles on back saws: open and closed (middle drawing). This is really a matter
    of personal preference; some woodworkers prefer the extra rigidity a closed handle
    offers over an open handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_1.png)


    ### Basic use


    Because the blade is so thin and the kerf is so fine, a well-sharpened quality
    back saw will generally steer itself in a perfectly straight cut—all you have
    to do is start the cut straight. Use a light grip on the saw and let it do the
    work (bottom photo). If you''re using a saw''s sharpened as a crosscut to rip
    (such as cutting the cheeks of a tenon), you''ll get better results if you stop
    often to clean out the kerf and the saw teeth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_2.png)


    ## GENT''S SAW


    A gent''s saw (also referred to as a dovetail, blitz, or slotting saw) is a special
    type of back saw designed for extremely fine work (top photo). A further refinement
    of this saw is known as an offset dovetail (inset). This type of saw features
    an offset handle and blade that can be reversed to make it easy to saw to a surface,
    as when trimming a through tenon. Since the handle is not in line with the blade,
    I don''t recommend this type of saw for cutting joints.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_0.png)


    ### Anatomy


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_1.png)


    > Inset photo courtesy of American Tool Companies, Inc., copyright 2001


    | Steel or Brass Rib | Ferrule |

    |---|---|

    | Blade | Handle |


    ### Basic use


    For the most part a gent''s saw should be reserved for use on small parts that
    require more delicacy than a back saw offers. They''re great for fine detail work
    like cutting small rabbets, tenons, or dovetails (bottom photo). Because the blade
    is so thin and the kerf is so tight, the saw will cut straight as long as you
    start it straight. The only exception to this is a saw''s not set correctly (see
    page 56 for more on this).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_2.png)


    ## BOW SAWS


    If you''ve never used a bow saw, give it a try (top photo). The bow saw is incredibly
    versatile and can be used for a variety of tasks. The blade is held in tension
    by a frame, which allows it to be changed. This makes the bow saw a very useful
    tool for any woodworker.


    ### Anatomy


    The bow saw consists of a frame, a blade, and a tension mechanism. The frame is
    usually made of wood or metal, and the blade is held in place by two pins. The
    tension mechanism is often a toggle or a bolt, which allows you to adjust the
    tension of the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_0.png)


    ### Basic use


    To use a bow saw, first install the blade in the frame and tighten the tension
    mechanism until the blade is taut. Once the blade is set, you can use the saw
    to cut a variety of materials. The bow saw is particularly useful for cutting
    curves and resawing shapes.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_1.png)


    ## COPING AND FRET SAWS


    Coping and fret saws are types of back saws used for fine work. They have very
    thin blades that allow for intricate cuts in tight spaces.


    ###img/82f8fd51f2b064bbc4df21354d664e50_52_2.png)


    ### Anatomy


    The coping and fret saws consist of a frame, a blade, and a tension mechanism.
    The frame is usually made of wood or metal, and the blade is held in place by
    two pins. The tension mechanism is often a toggle or a bolt, which allows you
    to adjust the tension of the blade.


    ### Basic use


    To use a coping or fret saw, first install the blade in the frame and tighten
    the tension mechanism until the blade is taut. Once the blade is set, you can
    use the saw to cut a variety of materials. The coping and fret saws are particularly
    useful for cutting curves and resawing shapes.

    '
  mdcn: '


    # 开始切割


    要用锯子锯出直切口，你必须确保开始时是直的。当然，对于锯齿间隙较大的锯子，你可以在一定程度上修正切割方向；但从一开始就保持切割平直总是更好的。这里是实现这一点的三种有效方法：


    ## 手指作为引导


    开始锯割的经典方法是使用手指或大拇指作为引导（上图）。先在木板上标记出切割线，然后将木板放在锯架上或将其夹在工作台上。接着，用大拇指引导锯片向切割的废料侧。尽量让锯子以及你的手、肘部和肩膀保持在一条线上。向后拉锯子几英寸，进行一系列短锯以切出一个锯槽。保持锯片始终压在大拇指上。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_49_0.png)


    ## 引导块


    为了增加准确性，可以使用某种类型的引导块来开始切割，使锯片与工作表面垂直（中间）。引导块不仅能保持边缘垂直，还能帮助横跨木板进行直切。通常仅靠手部压力就能固定引导块，但最好将其夹在木板上以保持稳定。


    ## 起始缺口


    无论你使用哪种锯子，防止它偏离预定标记最可靠的方法是锯出一个起始缺口（下图）。只需向后拉动锯子几次即可切出一个缺口。


    ## 背锯 (BACK SAWS)


    背锯（也称为榫尾锯）可以是木工坊最重要的手工工具之一。如果你手工切割结构，一把高质量的背锯会产生巨大影响。背锯的特征是环绕锯片顶部的铜或钢制“背部”（上图）。这种额外的刚性允许使用更薄的锯片（厚度约0.030英寸），从而产生薄锯槽，并使其易于沿着铅笔线或刀线切割。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_0.png)


    ### 结构


    背锯长度多样，从8 英寸到14 英寸不等，并具有细齿（每英寸14到22齿），可以被磨成横锯齿、纵锯齿或复合齿。如果你计划进行大量的手工切割，请买两把背锯：一把是横锯齿，另一把是纵锯齿。你会发现背锯有两种主流风格：开放式和封闭式手柄（中间图示）。这实际上完全是个人喜好问题；有些木工更喜欢封闭式手柄比开放式手柄提供的额外刚性。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_1.png)


    ### 基本用法


    由于锯片非常薄且锯槽非常细，磨得良好的高质量背锯通常会自我引导进行完美的直切——你只需要做的就是确保开始时是直的。轻手握住锯子，让它自己完成工作（下图）。如果你正在将磨成横锯齿的锯子用于纵锯（例如切割榫头的侧面），经常停下来清理锯槽和锯齿将获得更好的效果。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_2.png)


    ## 精细锯 (GENT''S SAW)


    绅士锯（也称为榫尾锯、快速锯或开槽锯）是一种特殊的背锯，专为极精细的工作设计（上图）。这种锯子的进一步改进型称为偏移榫尾锯（内嵌）。这种锯子具有偏移的手柄和锯片，可以反过来使用以便于向表面进行锯割，例如修整透榫头。由于手柄与锯片不在一条线上，我不建议使用这种锯子来切割结构。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_0.png)


    ### 结构


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_1.png)


    > 内嵌图片由 American Tool Companies, Inc. 提供，版权所有 2001


    | 钢制或铜制背 | 箍圈 |

    |---|---|

    | 锯片 | 手柄 |


    ### 基本用法


    大部分情况下，精细锯应保留用于比背锯提供更精细要求的小零件。它们非常适合精细的细节工作，如切割小槽、榫头或榫尾（下图）。因为锯片非常薄且锯槽非常窄，只要你开始时是直的，锯子就会切得很直。唯一的例外是锯齿开角不正确（更多信息请见第56页）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_2.png)


    ## 弓锯 (BOW SAWS)


    如果你从未用过弓锯，请尝试一下（上图）。弓锯功能非常多，可以用于各种任务。锯片通过框架保持张力，从而可以更换。这使得弓锯对任何木工来说都是一种非常有用的工具。


    ### 结构


    弓锯由框架、锯片和张紧机构组成。框架通常由木头或金属制成，锯片通过两个销钉固定。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_0.png)


    ### 基本用法


    使用弓锯时，首先将锯片安装在框架上并收紧张紧机构直到锯片绷紧。一旦到位，你就可以用锯子切割各种材料。弓锯在切割曲线和开料形状时特别有用。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_1.png)


    ## 曲线锯与框架锯 (COPING AND FRET SAWS)


    曲线锯和框架锯是用于精细工作的背锯类型。它们具有非常薄的锯片，允许在狭窄空间内进行复杂的切割。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_52_2.png)


    ### 结构


    曲线锯和框架锯由框架、锯片和张紧机构组成。框架通常由木头或金属制成，锯片通过两个销钉固定。张紧机构通常是拨杆或螺丝，允许你调整锯片的张力。


    ### 基本用法


    使用曲线锯或框架锯时，首先将锯片安装在框架上并收紧张紧机构直到锯片绷紧。一旦到位，你就可以用锯子切割各种材料。曲线锯和框架锯在切割曲线和开料形状时特别有用。


