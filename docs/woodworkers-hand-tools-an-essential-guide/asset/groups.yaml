    # CLAMP TIPS


    # Spinning G-clamps


    I picked this tip up as a young lad, when I watched a trim carpenter gluing up
    a laminated curve for a window sash. He was working with G-clamps, one in each
    hand, and was adjusting and applying them simultaneously. To open or close the
    jaws of a clamp, he''d hold the clamp by the screw and "spin" the body of the
    clamp, much like you''d twirl one of those old-time party favors that would make
    a clackey-clack noise (top photo). Try it—it really works.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_0.png)


    # Edge-clamping


    Here''s a good way to convert an G-clamp into an edge clamp for attaching edging
    to a workpiece. Position the clamp on the edge of the workpiece so there''s roughly
    a 1/2" gap between the body of the clamp and the edging you''re attaching (middle
    photo). Tighten the clamp securely and then tap a wedge between the body of the
    clamp and the edging, as shown in the middle photo, until the edging is tight.
    Space the clamps around every 6" or so to ensure a good glue joint.


    # Square corners


    G-clamps are handy for gluing up small projects like boxes and drawers, where
    larger clamps would be cumbersome. To make sure the corners glue square, I use
    short lengths of aluminum or steel angle with the clamps to help align everything
    (bottom photo). Aluminum angle works best for this, since you don''t have to worry
    about the metal interacting with the glue and causing stains. Make sure to file
    the ends of the angle smooth to keep from marring the work surface.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_2.png)'
  - '[PAGE 161]


    # HAND SCREWS


    Hand screws (sometimes called parallel clamps) have been around for centuries.
    Older versions used wood screws, while modern hand screws feature metal rods that
    thread into round nuts that can pivot, allowing for angled clamping (top photo).
    The jaws of hand screws are usually made of maple or birch or offering clamping
    capacities between 2" and 12". I''ve picked up many of the new clamps that have
    been introduced in recent years, I still regularly use my hand screws for clamping
    small parallel and irregular workpieces.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_0.png)


    # Parallel surfaces


    One of the things I''ve always liked about hand screws is their ability to quickly
    clamp parallel surfaces. With a couple turns of the hand screw, you get it close
    to the size needed. To do this, grab one handle with your right hand and the other
    with your left and then spin the clamp, "pedaling" a bike. Open the jaws by pedaling
    forward, and close them by going backward (drawing). When the jaws will fit over
    the workpiece, alternately tighten one, then the other jaw (or tighten them at
    the same time) until the jaws are in full contact with the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_1.png)


    # Irregular surfaces


    So more than most other clamps, hand screws also excel at clamping irregular surfaces.
    That''s because the jaws can be adjusted independently of each other. Here again,
    the idea is the same: You want to bring both jaws in full contact with the sides
    of the workpiece (bottom photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_2.png)'
