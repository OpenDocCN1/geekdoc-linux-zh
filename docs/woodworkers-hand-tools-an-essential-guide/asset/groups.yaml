    # 雕刻工具


    他使用了 8 号规格的凿子，其他人一眼就能确切知道他用的是哪种工具。惊讶的是，大多数工具制造商都遵循这些标准。然而，并非所有厂家都是如此，因此购买时请认准口碑良好的品牌。


    我第一次认真开始购买雕刻工具时，我不禁对某些名字笑出了声：Flutoni（槽形）、spoon bit（勺形钻）、allonge fishtail（长鱼尾）？虽然这些名字听起来很傻，但对雕刻师来说有特殊的意义，而且通常贴切地描述了工具的工作部位。雕刻工具大致分为三大类：圆凿、凿子和特种工具（顶部图片）。每种工具的设计都是为了处理特定的任务；资深雕刻师家里拥有几十种雕刻工具，从精细的
    4 英寸长细节凿子到用于粗加工的大型圆凿。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_127_0.png)


    # 标准尺寸


    与大多数木工工具不同，雕刻工具长期以来都有标准尺寸（底部底图）。如果一个雕刻师告诉另一个同事：


    | 圆凿 | 直形或弯形拨刀 | 直形 |

    | --- | --- | --- |

    | #11 | | #5 |

    | #9 | | #7 |

    | #8 | | #9 |

    | #7 | | #11 |

    | #6 | | |

    | #5 | | |

    | #4 | 长鱼尾 (Allonge Fishtail) | |

    | #3 | | #3 |

    | | | #5 |

    | | | #7 |

    | 弯背圆凿 | | |

    | #5 | 直形或斜形 | |

    | #7 | | |

    | 翼形拨刀 (Wing Parting Tool) | 通心圆刀 (Macaroni Tool) | 槽形刀 (Flutoni Tool) |


    # 圆凿


    雕刻圆凿基本上是一种刃口横跨刀刃宽度呈弯曲的凿子（顶部图片）。在所有雕刻工具中，你会发现圆凿具有最丰富的曲线、尺寸和特殊特征（如弯颈）。通常情况下，圆凿分为两种类型：内槽式和外槽式。内槽圆凿的斜面磨在刀刃内侧；外槽圆凿的斜面则磨在刀刃外侧。到目前为止，外槽圆凿更为流行。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_0.png)


    # 凿子


    尽管一些雕刻凿看起来与标准的平凿很像，但有一点不同：雕刻凿子的斜面不是磨在单侧，而是两边都磨了斜面，从而使它们在中间汇合（中部图片）。与大多数凿子的凹形（空心）磨削不同，雕刻凿子通常是凸形磨削。这有助于防止在使用时刃口切入得太深。雕刻凿子可以是平刃，也可以是斜刃。


    # 特种工具


    除了圆凿和凿子，雕刻师的武器库中通常还有许多特种工具（底部图片）。拨刀（Parting tools）是基础。最常用的拨刀是 V 型，用于在木头上切开槽并制作直角切口。V
    型拨刀广泛用于在招牌上刻字母。纹刀（Veiners）可以有方刃或圆刃，主要用于在雕刻中添加装饰性线条或“纹路”。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_1.png)


    # 文件与木锉术语


    你使用锉和木锉的频率在很大程度上取决于你的工作类型以及学习木工的时间。如果你的工作涉及大量的曲线，那么你的锉和木锉在工具箱中可能非常显眼。制作古董家具（尤其是带有经典
    S 形猫爪腿的安妮女王风格家具）的人经常使用锉和木锉。相反，如果你制作的是工艺风格（直线为主）的家具，学习木工的时间也是一个因素。


    我还是新手时，使用锉和木锉的频率比现在多得多。这部分是因为我当时工具不全，而且后来我学会了更好的处理方法。现在，例如，我不再尝试通过锉将榫头放入榫眼，而是使用推刨刨或凿子。我不再用锉来塑造腿部的曲线，而是倾向于使用刮刀。这些工具中的任何一种都能留下更干净、更光滑的表面，同样重要的是，对我来说使用它们更有趣。我仍然在使用木锉和锉——只是不频繁了。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_129_0.png)


    - 柄 (Tang)

    - 蹄部 (Heel)

    - 表面 (Face)

    - 刃 (Edge)

    - 铜箍 (Brass Ferrule)

    - 手柄 (Handle)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_129_1.png)


    # 造型工具


    # 锉齿


    锉是通过以角度在金属表面切割平行的齿行（通常在 60 到 80 度之间）制成的。常见的有三种“齿数”可选：单刃、双刃和弧齿（顶部底图）。单刃锉最常见，适用于通用木工以及我在车间偶尔需要的金属加工。双刃锉相对于第一组齿有第二组成一定角度的齿；因此它们的侵略性更强，当你需要快速去除大量材料时使用。弧齿锉变得越来越罕见，且侵略性极强。它们主要被木锉取代了（见第
    133 页）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_2.png)


    # 形状


    文件的形状和尺寸非常多。常见的形状是：平形（图）、半圆形、圆形和三角形（底部）。对于通用木工，平形是最常用的。锉长度从 4 英寸到 12 英寸不等；8 英寸和
    10 英寸的锉非常有用，而较小的则用于细节工作。![](img/82f8fd51f2b064bbc4df21354d664e50_130_3.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_4.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_5.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_6.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_7.png)


    # 磨削 (MILL)


    有三种常见的用法：直锉、斜锉和推锉。每种都有优缺点。


    ### 直锉 (Straight)


    直锉是最常用的。对于通用木工，直锉是你的首选（顶部）。


    ### 斜锉 (Cross-fileing)


    斜锉广泛用于去除更多材料。当你以角度接触表面使用锉时效果最好。


    ### 推锉 (Draw-fileing)


    推锉可以获得最光滑的光泽（底部）。当你沿着木材长度拉动锉时效果最好。


    # 手柄 (HANDLES)


    难以置信，一次不意的滑脱就能毁掉几个小时（甚至几天）的工作。由于这些家伙是全金属的，如果不加注意，它们会划伤、磕凹并损坏木材。这里有一个在锉易损表面时可以节省很多恼的技巧：只需在锉的端部绕几圈遮光胶或胶带（顶部图片）。这样你就可以安全地在表面上摩擦而不用担心损坏。![](img/82f8fd51f2b064bbc4df21354d664e50_132_0.png)


    # 锉柄 (FILE HANDLES)


    很奇怪：尽管几乎每个锉制造商都警告不要在没有手柄的情况下使用锉，但他们无一不提供手柄。这就像买了台锯却没带锯片一样；真奇怪。重点是，使用锉时真的应该使用手柄，因为柄部（tang）非常伤手（中部图片）。


    我承认我的一些锉没有手柄，但我还没有花时间去除任何毛刺并圆润边缘。尽管我的例子如此，最好还是为你拥有的每把锉和木锉装上手柄。手柄在大多数五金店可以便宜地买到，你也可以自己制作。如果你是木车工，可以做得精致些（下图）。否则，一根短木棍也可以——总比没有好。注意：为了防止手柄裂开，最好增加一个金属箍；一小段黄铜或铜管效果非常好。


