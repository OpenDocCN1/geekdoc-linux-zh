  - '[PAGE 55]


    # JAPANESE SAWS


    If you haven''t already tried one, Japanese saws are another one of must-try tools
    (top photo). Unlike Western saws, which cut on the push stroke, Japanese saws
    cut on the pull (including myself) Many woodworkers feel that this affords better
    control. Also, because the blade is pulled through the cut, there''s less chance
    of crimping the blade. This means the blades can be thinner, in a thinner kerf.
    The metal used for Japanese saws is harder and the teeth are tempered to a high
    degree. This keeps them sharper longer, but makes them almost impossible to ressharpen.
    This isn''t a negative, since the tooth geometry is complex (see the sidebar on
    page 55), and with many of these you can replace the blade when it dulls.


    # Dozuki


    fect for almost any hand-cut joinery (middle photo). Typically this saw has around
    26 teeth per inch and can vary from 8" to 12" in length.


    # Ryoba


    The ryoba saw (pronounced Ree-OH-bah) is a terrific saw to have on hand, as it
    combines the functions of a Western crosscut and rip saw in one tool (bottom photo).
    Ryoba means "double" in Japanese, and this saw has cross teeth on one side of
    the blade and rip teeth on the other. These saws come in blade lengths varying
    from 7" to 13". The smaller saw works well for joinery and the larger versions
    are excellent for generalpurpose cutting.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_2.png)'
  - '[PAGE 56]


    # Azebiki


    The Azebiki saw (pronounced Eh-zeh-BEE) is a special type of ryoba (crosscut teeth
    on one side, rip teeth on the other) that is designed specifically to plunge cuts,
    such as a mortise or tenon in the center of a board (top photo). The blade is
    curved to let you easily start a cut in the middle of a work-piece. Its diminutive
    size makes it handy for getting into places other saws can''t. The curved blade
    also makes it easy for you to clear sawdust from the kerf by simply rocking motion
    as you


    ![](img/82f8fd51f2b064bbc4df21354d664e50_56_0.png)


    # Kugihiki


    The kugihiki saw (pronounced cog-hee-HEE) is another specialty that you might
    find useful. In Japanese, kugihiki means "to cut nails," as in wooden nails or
    dowels. The super-thin blade does not have a back like the duzuki, so it''s extremely
    flexible, but also prone to kinking. And just as important, the teeth on this
    style saw can rest on a surface without scratching it (middle photo). The downside
    to this is that binding can occur if you''re removing a lot of wood, such as when
    cutting off a through tenon.


    # TOOTH PROFILES


    If you examined the teeth of a Japanese saw with a magnifying lens, you''d find
    a complex geometry—the teeth are longer and thinner and have more faced surfaces
    than Western-style teeth (drawing right). This is particularly true of the crosscut
    tooth. Unless you''re willing to devote many hours to practicing these complex
    grinds, I suggest sticking with saws that have replaceable blades.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_56_1.png)


    CUTTING TOOLS'
  - '[PAGE 57]


    # CHECKING FOR DRIFT


    You''ve just bought a new back saw or dovetail saw, and after making a couple
    of test cuts, notice they aren''t straight. Is it you or the saw? Often it''s
    the saw. In many cases the set of the teeth is too aggressive or not even. When
    this occurs, the saw tends to drift one way or the other. To eliminate this, use
    the procedure below.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_0.png)


    # Cut for kerf


    Start by making a test cut in a scrap of wood, and don''t try to compensate if
    it starts to drift off course. Let it make its own kerf (top photo).


    # Check for drift


    Next, remove the saw from the kerf and check the kerf with a square (middle photo).
    Any deviation means that the teeth on one side are either set more aggressively
    or are sharper than the other side. This is also a good time to check for the
    overall set. Insert the blade back in the kerf and try to wiggle it; if there''s
    a lot of flop, the set is too aggressive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_1.png)


    # Correct the problem


    To reduce the set on one side of the saw, use an oilstone. Set the saw on a flat
    surface and add a drop or two of honing oil to the stone and rub it gently over
    the teeth (bottom photo). If the overall set is too aggressive, do this to both
    sides, taking the same number of strokes per side. Take just a few strokes with
    the oilstone and make another test cut. Repeat as necessary until the saw no longer
    drifts and the blade doesn''t wobble in the kerf.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_2.png)'
  - '[PAGE 58]


    # SPECIALTY SAWS


    Hacksaw

    Hacksaw in a wood-shop? You bet. I often incorporate metal parts in many of the
    jigs, fixtures, and projects I build. And Murphy''s Law says the carriage bolt
    or threaded knob I want to use will be too long. A hacksaw, with its fine teeth
    and hardened steel blade, will make short work of cutting bolts, screws, even
    hinges (top photo). Choose blades with fine teeth for cutting through, hard metals
    and coarser teeth for softer materials like tend to clog the finer teeth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_0.png)


    Miter saw

    For the most part, miter saws like the one shown in the middle photo have been
    replaced in the woodworking shop by the power miter saw. Miter saws are, naturally,
    designed to fit in a miter box; they are basically long back saws with crosscut
    teeth. If the blade is well sharpened and there''s no play in the guides, this
    type of setup works well. Unfortunately, there''s usually problem with either
    the saw or the guides and so these can be used only for rough work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_1.png)


    Compass saw

    The compass saw, or keyhole saw has also generally been replaced by its electric
    cousins, the saber saw and jigsaw. Since this type of saw has no frame and a thin
    tapered blade, it can be used to make cuts where other saws can''t (bottom photo).
    On the downside, with no frame and a thin, tapered blade, this saw is highly prone
    to bending and kinking in use. The only way to prevent this is to make light,
    non-rigorous cuts.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_2.png)'
