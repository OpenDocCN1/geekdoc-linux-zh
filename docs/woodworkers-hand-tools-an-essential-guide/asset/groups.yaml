  - '[PAGE 123]


    # CORNER

    CHISELS


    A corner chisel is a special type that has two cutting edges that meet at a perfect
    90-degree angle (top photo). NOTE: The chisel shown here is available from Lie-Nielsen
    Toolworks (www.lie-nielsen.com). Corner chisels are used to square up the corners
    of a mortise after most of the waste has been removed. Because these chisels are
    challenging to sharpen, I use mine only for the finishing cuts. This way the edge
    lasts longer than I used it to remove a lot of waste. Granted, this tool isn''t
    for everyone; but if you cut a lot of mortises—especially mortises—you’ll really
    appreciate this tool. Since I build a lot of Craftsman-style furniture with exposed
    joinery a corner chisel comes in quite handy.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_0.png)


    # Two cutting edges


    Look closely at the business end of a corner chisel: You’ll find flat faces on
    the exterior of the blade and a notch ground the inside to create two cutting
    edges (middle photo). These edges are honed to create both a razor-sharp tool
    and a sharpening challenge. You can sharpen this tool with a standard stone; you''ll
    need slipstones or better yet, small diamond specifically. I suggest maintaining
    the edges by giving each a couple of strokes with a diamond hone before every
    use.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_1.png)


    # Basic use


    The key to using a corner chisel effectively is to take light, paring cuts and
    make sure to hold the chisel perfectly vertical (bottom photo). I often clamp
    a square-scrap block to the workpiece to help guide the chisel in straight. Stop
    often and clean out the waste. If you''re cutting through a mortise, it''s best
    to cut halfway the piece, and continue from the other side.


