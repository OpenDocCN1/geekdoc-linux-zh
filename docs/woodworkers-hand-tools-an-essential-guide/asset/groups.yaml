    # SHARPENING

    TERMINOLOGY


    For an edge to be truly sharp, the two surfaces that meet to the bevel angle must
    be flat and honed the same amount (top photo). This obvious fact is one of the
    most commonly overlooked factors in sharpening tools. I of woodworkers spend considerable
    time and effort honing a bevel to a mirror finish, only to ignore the block. Both
    must be honed to the same degree of finish for the surfaces to meet cleanly at
    the edge (middle drawing).


    will be honed. With a flat grind, the entire bevel rests on the stone unless you
    choose to use a microbevel. The advantage to this is the same as for a hollow
    grind—less material to be removed faster honing.


    Although there are a lot of different-edged tools in the workshop, you''ll likely
    spend most of your time sharpening blades and chisels. There are four common ways
    to handle the grinding and honing of these edges: a flat grind, a flat grind with
    a microbevel, a hollow grind, and a hollow grind with a microbevel (bottom drawing).
    Which you use is really a matter of preference.


    Personally, I prefer to hollow-grind the edges of my cutting tools (the hollow
    results from creating the bevel on a grinding wheel). The big advantage to this
    is that there''s a less material to remove when you hone the bevel. Since the
    bevel is concave, only the toe and heel will rest on the stone, and the toe and
    heel


    > Both Surfaces Must Be Flat to Create Sharp Edge


    | FLAT | FLAT GRIND WITH MICROBEVEL | HOLLOW GRIND | HOLLOW GRIND WITH MICROBEVEL
    |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_175_0.png)'
  - '[PAGE 176]


    # NATURAL OILSTONES


    When I first delved into sharpening some 25 years ago, man-made stones were of
    questionable quality, and the only reasonable choice was to use natural stones.
    I still have the original oilstones I bought back then and am glad I do. It''s
    increasingly hard to find quality oilstones (especially in the larger bench stone
    sizes), as the deposits have already been systematically mined. The most famous
    of these are the novaculite deposits in Arkansas. Novaculite is a natural abrasive
    that holds up extremely well over time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_0.png)


    # Varying grits


    Arkansas stones are available in four grits. From coarse to fine, they are Washita
    (top photo), soft Arkansas (middle photo), hard Arkansas (bottom photo), and black
    hard Arkansas (bottom inset).


    A light machine or honing oil is the lubricant of choice with these stones and,
    if used in progression, can create a razor-sharp edge on your tools.


    Although I have switched primarily to waterstones (see page 177)


    I pull out the desired stone, add a drop of oil, and sharpen away. A quick wipe
    with a clean cloth and the tool is ready for use, and the oilstone can go back
    on the shelf. Contrast this to the water mess when sharpening with waterstones,
    and it''s easy to see why I still use these. If your budget allows for both oilstones
    and water, terrific. If I had to choose one, I''d go with the faster-cutting waterstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_2.png)'
  - '[PAGE 177]


    # MAN-MADE

    STONES


    A number of abrasives manufacturers (like Norton and 3M) make artificial oiltones,
    and produce them in many shapes and sizes (top photo). Particularly useful are
    the larger, wider bench stones that are necessary for sharpening blades. Another
    convenient feature of man-made stones is that they are often made with two grits
    and sandwiched together in a single stone (middle drawing).


    I tried a number of different man-made stones and for the most part have not found
    one that I felt was rugged as a natural stone. True, many of these stones are
    more aggressive, but this also means they wear more quickly—truing a natural or
    artificial oilstone is more work than truing up a waterstone. Before I invest
    in a set of man-made oilstones, I''d buy a set of man-made waterstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_177_0.png)


    # TRUING A STONE


    For any stone to do its job, it must be flat. All stones tend to wear out and
    tend to "dish out" in the middle, as this area sees the most use. The best way
    I''ve found to true an oilstone (either man-made or natural) is to rub it on a
    coarse diamond stone; another option is to use a lapping plate with silicon-carbide
    particles (see page 181). Since waterstones


    are softer than oilstones, they wear more quickly but are easier to true up. The
    simplest way is to true up a fine stone with a coarser one by rubbing them together.
    For any of this work, your coarsest stone must be flat. I''ve found that a piece
    of drywall on a flat surface works well for this (photo above left). Make that
    you thoroughly flush each stone after truing to remove all traces of the coarser
    grit.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_177_1.png)'
