    # 刨子术语


    手工刨子是木工坊的苦力军……而我指的不是昨天的木工匠。我指的是做精细、敏感工作的现代木工。任何认识我的人都可以告诉你，我不和推刨不合。但关于“打磨还是不打磨”的大辩论已经让我足够了。我不是游客：我确实使用电动砂机。但我真心热爱使用我的刨子。像
    Krenov 一样，我相信它们能留下更优的表面。


    看到许多木工加入电动砂机的热潮并作为标准工作方式，真是令人遗憾。我见过人们花费数小时打磨不平整的表面或缺陷，而这些问题用锋利的刨子几分钟就能解决。而且看到美丽的鸟眼木在打磨而非刮刀中失去其脆感，似乎就像是一种浪费。如果你还没有体验过在流汗时从木板上削下薄如羽翼的刨花的快乐，我强烈建议你尝试。


