  mdcn: '


    ## 更换手柄


    随着时间的推移，锤子的柄可能会裂开或断裂。坦率地说，更换手柄很容易——只要尺寸正确即可。我建议在购买替换手柄时，带着旧锤柄去五金店或家居用品中心；或者自己制作一个；把旧手柄当作模板。当然，在安装新手柄之前，你需要先拆掉旧的。只需锯掉锤头，然后用冲子或大螺栓钉将废料部分顶出。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_0.png)


    ## 切开槽


    为了给锤头准备好手柄，你首先需要拟合榫头（tenon）。用锉可以快速完成这项工作。绕着榫头加工，在四个面切去等量的材料，直到榫头完全插入锤头且肩部顶到底。如果拟合得良好，就标记并切掉突出锤头以上的废料。然后取下手柄，在末端切开三个槽。为木楔切开一个纵向槽，并在宽度方向横切两个槽（*上图*）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_1.png)


    ## 钉入楔子


    现在你可以将手柄滑回锤头内，并安装大木楔。这块楔子会将榫头的侧面推开，从而紧住锤头。在这里不要害羞——用力推到到底为止（*中图*）。剩下的工作就是钉入金属横楔，使榫头在锤头内均匀撑开（*下图*）。将楔子钉入你之前切好的槽中，直到它们与锤头平齐。好了：你可以开始使用了。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_3.png)


    ## 沃灵顿锤 (WARRINGTON HAMMERS)


    我的工具箱里有几种不同尺寸的沃灵顿锤（*上图*）。这些轻量级锤子非常适合钉光光钉和小钉钉（brads）。不同于羊角锤，沃灵顿锤有一个小小的楔形十字圆头（cross
    peen），这使得它在钉钉钉时特别有用。在处理短小的钉钉时，这个十字圆头简直是手指的救星（*中图*）。为什么呢？因为十字圆头实际上可以卡在我的手指之间，用来固定钉钉。一旦固定到位，我就翻转锤子，用平脸将钉钉入。这种工具的另一个独特之处是锤头侧面被称为“侧击面”（side
    strikes）的区域，用于在狭窄空间内钉钉。


    沃灵顿锤有四种重量：3/2、6、10 和 12 盎司。我有 6 盎司和 10 盎司的锤子，可以从容应对大多数任务。这些锤子有些奇怪的地方：十字圆头的末端是磨成或铸成尖角的，而不是平的。这实际上让起始钉钉变得困难，因为尖角会从钉钉头部滑开。尝试将尖角磨平，让工具工具更好用。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_0.png)


    ## 沉钉器 (NAIL SET)


    有效钉钉的秘诀之一在于知道何时停止用锤子敲钉。你越接近表面，被锤脸撞出凹痕的机会就越大。为了消除产生凹痕的可能性，在钉钉或钉子的头部接近表面时停止——通常是
    1/16 英寸到 1/8 英寸。然后取用沉钉器（*右图*）。沉钉器的设计旨在通过将钉子钉入表面以下（即“沉入”）来完成工作。市售的沉钉器有不同的顶端直径；选择一个与钉子直径最接近的。将沉钉器放在钉子上，轻轻敲击使其沉入表面以下。紧紧握住沉钉器，防止它滑落并直接钉进木子里。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_2.png)


