    - Hammer handles have come a long way from the old hickory handles of my grandfather''s
    hammer (photo at right). That''s not to say wood handles aren''t still used. They''re
    still very popular, especially because of their excellent flexibility and shock-absorbing
    characteristics. The big disadvantage to a wood handle is simply that the wood—and
    wood constantly reacts to changes in humidity. Over time, the handle will loosen
    and need to be tightened or replaced. Wood handles can also fray and split under
    heavy use.


