    # PLANE

    TERMINOLOGY


    Hand planes are the workhorses of the woodworker''s shop...and I''m not talking
    about the cabinetmakers of yesterday. I''m talking about modern-day woodworkers
    who do fine, sensitive work. Anyone who knows me can tell you that I don''t get
    along with a soapbox plane. But the great ''to sand or not to sand'' debate is
    enough to get me. I''m not a tourist: I do use power sanders. But truly love using
    my planes. And I reach for them whenever I can because, like Kenov, truly believe
    they leave a superior surface.


    It''s said to see so many woodworkers jump on the power sanding bandwagon as a
    standard way of working. I''ve seen guys spend hours sanding out uneven surfaces
    or imperfections that could have been taken of in minutes with a sharp plane.
    And to watch beautiful bird''s eye maple lose its crispness in sanding place of
    a scraper plane just seems like a waste. Okay enough rating. If you have not had
    the pleasure of shearing off thin, wispy


    shavings from a board while working up a light sweat, I heartily recommend it.

    The three types of planes you''ll find most useful in the shop are jack or jointer
    planes, block planes and specialty planes. Jack and jointer planes are used for
    smoothing planes, joining edges, and all-purpose planing. Block planes, with their
    shorter blades and bevel-up blades, are great for trimming, fine-tuning joints,
    and ending grain (bottom drawing). The bulk of the remaining planes you''ll find
    handy classified as specialty planes. These include rabet planes, shoulder planes,
    chisel planes, circular planes, combination planes, and so on:


    ![](img/82f8fd51f2b064bbc4df21354d664e50_61_0.png)'
- md: '

    # Bevel orientation


    One of the big differences between jack and block planes is the orientation of
    the bevel (top drawing). On a jack plane the bevel is down; with a block plane,
    it''s up. Jack planes all have a chip breaker to help sever chips as they roll
    off the edge of the blade. Although a block plane looks like it doesn''t have
    a chip breaker, the bevel actually serves this purpose. The blade on a block plane
    is angled much lower than that of a jack (roughly 25 versus 45 degrees lower cutting
    angle, but it''s actually the combined bevel plus mounting angle. This ends up
    45 degrees—as a jack plane (to learn why a block plane handles end grain well,
    see page 73).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_62_0.png)


    # Skewing


    Effective cutting angles can be varied by skewing a plane. Instead of cutting
    in line, if you angle the plane, 30 degrees, you alter the pitch of the blade,
    as you''re producing more of a shearing cut (middle drawings). This is why skewing
    is often used when working with hard-to-plane woods like bird''s eye maple or
    burls. Skewing is so effective, some plane makers manufacture their planes with
    skewed blades.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_62_1.png)


    # Throats


    The throat opening on a plane—that is, the space between the beveled end of the
    blade and the sole—plays an important role in the tool''s overall performance
    (bottom drawing). The sensitive area of the sole is the portion that “backs up”
    a cut. It prevents the blade from lifting too large a sliver. At the same time,
    it might be wide enough to allow chips to pass through jamming. The throat opening
    on jack and jointer planes is adjusted via a frog (see page 67), and on quality
    block planes they can be adjusted by adjustable throat plates (see page 75).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_62_2.png)


    SMOOTHING TOOLS

    61


    # JACK AND JOINTER PLANES


    Traditionally, a craftsman''s jack plane and jointer plane were his bread and
    butter. With these two planes, he could take a rough-sawn board and turn it into
    a straight board, smoothly surfaced on all four sides. The edges would be perpendicular
    to the faces, so boards could easily be joined together to make larger panels.
    Although the electric planer have taken over these tasks in the modern shop, jack
    and jointer planes are still incredibly useful in the shop for surfacing a panel,
    joining edges, and all-around smoothing. If you''ve never planned a rough-sawn
    board so that its is perfectly square, give it a try; you''ll have a lot more
    respect for the cabinetmakers of the past.


    Jack and jointer planes are very similar in appearance (top photo). The big difference
    is in the length of the sole and the width of the blade. Generally, the cutoff
    between a jack and a jointer plane begins around 22", and a mid-sized plane, often
    referred to as a fore, resides in the no-man-land between the two (see the chart
    below). Another common rule of thumb is: The longer the sole, the wider the blade—but
    there are some exceptions to this. Whether your plane is a jack, fore, or jointer.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_63_0.png)


    # PLANE SIZES


    | Sole | No. | Classification | Length | Width | Sole | No. | Classification |
    Length | Width |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Metal | 1 | Smooth | 51/32" | 11/2" | Wood | 23 | Smooth | 9" | 1 3/4" |

    | Metal | 2 | Smooth | 7" | 15/8" | Wood | 24 | Smooth | 9" | 2" |

    | Metal | 3 | Smooth | 8" | 1 3/4" | Wood | 26 | Jack | 15" | 2" |

    | Metal | 4 | Smooth | 9" | 2" | Wood | 27 | Jack | 15" | 21/8" |

    | Metal | 4/2 | | 19" | 2 3/8" | Wood | 27 1/2 | Jack | 15" | 21/4" |

    | Metal | 5 | Jack | 14" | 2" | Wood | 28 | Fore | 18" | 2 3/8" |

    | Metal | 5 | Jack | 11 1/2" | 1 3/4" | Wood | 29 | Fore | 20" | 2 5/8" |

    | Metal | 5/2 | Jack | | 2" | Wood | 30 | Jointer | 22" | 2 5/8" |

    | Metal | 6 | Fore | 18" | 2 5/8" | Wood | 31 | Jointer | 24" | 2 5/8" |

    | Metal | 7 | Jointer | 22" | 23/8" | Wood | 32 | Jointer | 26" | 2 5/8" |

    | Metal | 8 | Jointer | 24" | 2 5/8" | Wood | 33 | Jointer | 28" | 2 5/8" |

    | Wood | 21 | Smooth | 7" | 1 3/4" | Wood | 34 | Jointer | 30" | 2 5/8" |

    | Wood | 22 | Smooth | 8" | 1 3/4" | | | | | |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_63_1.png)


    SMOOTHING TOOLS

    Old planes had wood bodies or soles, and modern planes have metal bodies. For
    a while, "transitional" planes were made that offered the best of both worlds
    (For more on this, see page 72). One of the best ways to get familiar with a jack
    plane or jointer plane is to take one apart. Start by loosening the cap lock to
    release its pressure (bottom drawing). Then slide the cap up and off. Now you
    can lift out the blade and cap iron assembly. These two pieces are held together
    by a screw or a wide blade-driver. Twist the cap iron, slide it until it slips
    off the screw, and lift it off. The cap iron (also called a chip breaker) helps
    sever chips as they are lifted by the blade; it also serves as a stiffener to
    prevent chatter. The cap iron and blade fit into the frog—a separating casting
    that is screwed to the body of the plane. There''s an adjustment screw in the
    rear of the frog that allows you to open or close the throat opening. The frog
    also houses the lateral-adjustment lever that aligns the blade parallel to the
    sole, and the depth-adjustment knob that lowers the blade. A handle on the back
    and a knob on the front complete the plane. The blades may be sharpened in one
    of common ways: straight, convex, or with softened corners (top drawing). Convex
    is useful for rough work, and softening the corners prevents them from digging
    in.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_64_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_64_1.png)


    SMOOTHING TOOLS

    63


    # TUNING A PLANE


    For a jack plane or jointer plane to create thin, wispy shavings without tear-out,
    you''ll need to tune it. This involves flattening the sole, adjusting the frog,
    removing any slot in the cap iron, sharpening the blade, and fine-tuning the lateral
    and depth adjustments.


    # Flattening the sole


    The flatness of a plane''s sole will have a huge impact on its performance. The
    easiest way to check a sole for flatness is with a straightedge. I found that
    holding the plane up against a bright light while doing so shows any dips or high
    spots.


    To flatten a sole, temporarily fasten some sheets of carbide sandpaper to a known-flat
    surface with spray adhesive. A piece of replacement glass for a jalous window
    works great (available at most hardware stores). What''s really nice jalous glass
    is that its edges are rounded-over for safety. I usually start with 80-grit and
    work my way up to 220-grit.


    Although you might be tempted to remove the blade and cap iron, they keep tension
    on the sole. If you flatten it without this tension, then install the iron, the
    sole won''t be flat. Just make sure to back off the iron 1/8" or so before rubbing
    the sole on the carbide paper. Use steady strokes, and flip the plane end-for-end
    to ensure even pressure over the entire length and width of the sole (top photo).
    Check sole for progress. Although purists flatten the entire sole, the only parts
    where it''s critical that it is flat are the toe, heel, and around the throat
    (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_0.png)


    # The frog


    The frog is another important part of the plane. It holds the plane iron firmly
    at the proper angle, while at the same time letting you adjust the depth of cut
    and the position of the blade (bottom drawing on opposite page).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_1.png)


    # Gap under Cap Iron Allows Shavings to Jam


    A poorly tuned frog is the leading cause of blade chatter. For a frog to do its
    job well where it contacts the blade, the sole, and the sloped face that holds
    the plane iron—must be absolutely flat and square. To flatten these, I use a diamond
    hone or a small stone and gently rub it on the surface. Check often with a straightedge.


    # Cap iron


    A sloppy cap iron can also cause chatter. Its job is to add rigidity to the plane
    and prevent it from flexing. The slight hump at the end also serves as a wedge
    to break chips as the iron cuts into the wood. Neither of these will happen if
    the cap iron doesn''t fully contact the entire edge of the plane iron. And a poorly
    fitting cap iron can allow shavings to jam up between the cap iron and the blade
    (top drawing). The solution to all these problems? Ensure full contact by flattening
    the front edge of the cap iron on an oilstone.


    Before you attach the cap iron to the blade, the blade needs to be sharpened.
    For an in-depth look at sharpening, see pages 182-183. Then re-attach the cap
    iron and secure it to the blade to check for gaps (middle photo). Position the
    cap iron on the blade square to the front edge and set back 1/16.


    # Handle and knobs


    If the handle and knobs of the plane are in good shape, take a moment to tighten
    the screws that secure them to the plane body. There''s usually one for the knob
    and two for the handle (bottom photo). If the handle is cracked or broken, replace
    it with a new one (see the sidebar on page 66).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_66_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_66_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_66_2.png)

