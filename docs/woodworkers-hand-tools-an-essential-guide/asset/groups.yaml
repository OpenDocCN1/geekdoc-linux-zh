    # AWLS


    The awl has historically been used to create starter holes in wood for brads and
    nails, and to create starting points for drill bits. The most common type of awl
    is the scratch awl (top photo). As you can see, the size and length of the awl
    can vary greatly, but each has a cylindrical shaft that tapers to a point. Another
    type of awl (not shown here) that very hard to find anymore a brazil awl. The
    tip of this awl comes to a chisel point, much like screwdriver. A brazil awl was
    used in the past to create starter holes in tougher hardwoods, where the grain
    would often deflect a scratch awl. The chisel point of the brazil awl was aligned
    with the grain at the mark, then pushed in and twisted to cut a small hole. These
    have been superseded by the center-punch (page 12).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_11_0.png)


    # Marking hole locations


    In my shop, I frequently use an awl as a center-punch to mark hole locations.
    An awl is especially useful when marking holes using a template (middle photo).
    That''s the thin tapered shank can pass through the holes in a template, where
    the blunt tip of a center-punch can''t get through.


    # Basic grip


    To use an awl as a center-punch or to create starter holes for nails or brads,
    nest the handle of the awl in the palm of your hand as shown in the bottom photo,
    and then wrap your fingers around the handle. This grip positions the awl in line
    with your forearm so you''ll transfer maximum thrust into the work-piece.'
