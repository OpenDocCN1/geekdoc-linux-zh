  mdcn: "\n\n# 槽口的修整\n\n除了清理榫眼和榫头外，我经常使用凿子对槽、槽（rabbets）、凹槽和其他接头进行精细调整。\n\n## 削平侧面\n\
    \n最常见的削平任务之一是从槽或其他接头的侧面切除少量的材料。只要可能，我都会直接用刀刃进行操作，并采取切削动作（顶图）。与传统的垂直推削动作相比，这种方法有几个优点。首先，倾斜刀刃可以产生更整洁的剪切口。此外，它还很容易让凿子平直的背部沿着槽或凹槽的侧面滑动，作为一个稳定的起点。这样，你就可以从非常轻的切口开始，逐渐切除废料。\n\
    \n## 槽底\n\n无论槽是手工切割还是机器加工的，槽的最后几英寸深度往往不准确。这可能是因为在旋转铣头或刀片停止时松了力，或者在手工切割结束时，工件经过时减小了压力。我习惯使用下切法，并通过一系列轻微的切口削掉废料（中间图）。关于如何使用量块准确测量深度的实用技巧，请参阅第121页。\n\
    \n## 清理底部\n\n清理槽底非常简单。在这里同样，将凿子反过来，使斜面朝下，沿着底部移动（底图）。像这样反转斜面可以防止它卡住并切入槽内。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_117_0.png)\n\
    \n## 平木凿\n\n平木凿（Firmer chisels）是通用的木工凿子，是任何木坊里的骨干之一（顶图）。当大多数木工想起平木凿时，他们脑海中浮现的是顶图中那种粗壮、侧面平角的凿子。但斜边凿（见第110页）也属于平木凿——它们的侧面向顶部逐渐收窄。大多数平木凿的刀刃长度约为4英寸，宽度从1/8英寸到2英寸不等。手柄可能是木制的也可能是塑料的。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_118_0.png)\n\n## 形状\n\n平木凿与斜边平木凿之间的基本区别在于其形状（中间图）。平木凿平角的侧面形成了一个坚固的刀刃，完全能够处理轻微到中度的撞击。边缘斜边的优点是在修整榫卯等接头时可以提供更大的切入空间。缺点是：刀刃没有标准平木凿那么结实，在使用这种更精细的凿子时，应尽量轻地使用木锤。\n\
    \n| 斜边凿 | 平木凿 |\n| :--- | :--- |\n\n## 构造\n\n平木凿由三部分组成：刀刃、手柄和箍环（ferrule）。在大多数情况下，刀刃有一个榫头（tang），插入在手柄末端的钻孔中（底图）。箍环（通常为黄铜）有助于在用木锤敲击凿子时防止手柄裂开。注册凿（Registered\
    \ chisels）经常与平木凿混淆，因为它们看起来很像。区分方法如下：注册式榫眼凿通常刀刃更厚，且手柄末端有一个箍环，以防止手柄“爆头”或蘑菇状变形。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_118_1.png)\n\n## 榫眼凿\n\n榫眼凿的特点是其厚实肥实的刀刃和粗壮的手柄（敲击图），这两者都是为了应对手工凿榫眼时所需的沉重木锤撞击。刀刃更厚还有另一个不明显的原因：宽大的刀刃有助于引导凿子，并使其在切割时与榫眼的侧面保持垂直。这是一个巨大的优点，因为一旦榫眼的侧面和端部确定，凿子几乎可以实现自引导。这也是它是手工凿榫眼首选工具的另一个原因。\n\
    \n## 手柄选项\n\n榫眼凿有两种基本选择：榫头安装式（tang-mount）和套筒安装式（socket-mount）（底图）。对于榫头安装式，手柄末端的榫头插入手柄末端的钻孔中。通常在刀刃底部和手柄之间增加一个皮垫圈作为减震器。在套筒式榫眼凿上，手柄末端被加工出一个榫头，以配合刀刃的套筒。榫头式榫眼凿的缺点是，反复的撞击会将榫头推得进入手柄内部。即使手柄两端安装了箍环，榫头最终会导致手柄裂开。这种情况在套筒式凿子上很少发生。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_119_0.png)\n![](img/82f8fd51f2b064bbc4df21354d664e50_119_1.png)\n\
    \n我第一次手工凿榫眼时那是一场灾难。我用了一个较小的、比较钝的斜边凿（我当时还没搞懂怎么磨刀）。在那块可怜的板上敲了半小时后，我得到了一个歪斜的洞，看起来像个陨石而不是榫眼。宽度不一，侧面粗糙。\n\
    \n第一次手工凿榫眼时，那是一场灾难。[此处重复，省略）] 第一次手工凿榫眼时，那是一场灾难。我用了一个较小的、比较钝的斜边凿（我当时还没搞懂怎么磨刀）。在那块可怜的板上敲了半小时后，我得到了一个歪斜的洞，看起来像个陨石而不是榫眼。宽度不一，侧面粗糙。\n\
