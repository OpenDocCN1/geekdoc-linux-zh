    # BAR CLAMPS


    ## Sliding bar clamps


    Of all the clamps in my shop, sliding bar clamps are what I reach for most often
    (top photo). In fact, I keep them in a rack directly behind my bench—they''re
    right at hand. These clamps feature a fixed jaw that''s attached to a steel bar,
    and a sliding jaw with an adjustable screw that can quickly open or close the
    jaws. Quality sliding bar clamps (Bessey''s is my favorite: www.jamesmorton.com)
    come with plastic pads to cover the jaws and protect the work. They''re available
    in jaw capacities from 4" to 38" and with varying reach (depth).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_0.png)


    ## Aluminum bar clamps


    I became quite attached to a set of aluminum bar clamps I used in a production
    shop several years ago (middle drawing). They are extremely lightweight and easy
    to work with. You might think they''d bend under pressure, and you''d be right—they
    do. So what good are they? Well, here again, if you need to exert heavy pressure
    to close up gaps, something is wrong. If you''ve done your work with care, these
    clamps will get the job done. Jorgensen (www.adjustableclamp.com) sells these
    in various lengths, although you generally need to special-order them.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_1.png)


    ## Steel I-beam clamps


    Steel I-beam clamps are the bruisers of the clamping world. These heavy-duty clamps
    exert wood-crushing force. They feature heavy castings and an I-shaped steel beam
    (bottom drawing), which keeps the beam from bowing under the considerable pressure
    these clamps produce. I-beam clamps are popular in professional shops because
    they don''t bow with use over time, as pipe clamps will. If used judiciously,
    these are great clamps. In the hands of a "Popeye"-type clamper, they can do more
    damage than good.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_167_2.png)


    # CLAMPING RULES


    ### Rule #1: Always dry-clamp


    One of the most reliable ways to prevent clamping problems is to dry-clamp your
    project before you reach for the glue bottle. Dry-clamping a couple of things:
    First, it double-checks that all the parts fit well together. This might seem
    obvious, but I''ve seen many workers sweat over glue and glue only to find a tenon
    doesn''t fit in a mortise, or a rail or cleat too short. Dry-clamping prevents
    this annoying problem. It is also a good way to check clamp placement—and just
    as important, to make sure you''ve got enough clamps on hand. Finally, it gets
    the clamps adjusted the proper distance to span the workpiece so that it will
    go quickly. And this is particularly important if you''re working with yellow
    glue, since it has a relatively short open time (about 15 minutes).


    ### Rule #2: Protect the workpiece


    Since clamps can apply any pressure, take the time to pad every clamp to the surface
    of the workpiece (see page 162). You should also protect the workpiece from excess
    glue. The best way is to apply the right amount in the first place so that it
    doesn''t squeeze out onto the workpiece.


    If you encounter excess squeeze-out, wipe off the surplus with a clean, damp cloth.


    ### Rule #3: Position the clamps for uniform pressure


    Make your clamps are positioned to the sides and edges of a workpiece (unless
    you''re intentionally trying to rack the workpiece back into square (see page
    163)). Center the clamps on the workpiece and space them evenly. When gluing up
    panels, take care to distribute the glue pressure on the panel (see page 164).


    ### Rule #4: Don''t overcast


    Next to skipping the dry-clamping stage, overcast is one of the main reasons glue-ups
    fail. The problem is that clamps are capable of exerting a lot of pressure, especially
    the steel-beam type. And it is all too tempting to just crank a little harder
    to tighten the joint up in the joint. Don''t over-clamp the wood, and the wood
    will have its ways and likely split. Here''s another advantage of dry-clamping.
    If something doesn''t fit right, take it apart and tweak it until it does. If
    everything fits properly, you shouldn''t apply a lot of pressure. What you''re
    looking for is a bead of glue squeeze-out at the joints—all the glue creates a
    “starved” joint—leaving nothing behind to create a bond.


    The first time I used a Bessey K-body clamp (www.jamesmorton.com), I was skeptical
    (top photo). According to the manufacturer, the clamp was guaranteed to remain
    parallel as pressure applied, unlike many other clamps where the jaws tilt out
    under great pressure. They work so well that I continue to buy more as my budget
    allows. That''s the only downside to these clamps. They''re expensive (about $50
    for a 4-foot clamp) but well worth it.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_168_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_168_1.png)


    # THE WORKBENCH


    My favorite tool in the shop is the workbench (top photo). A workbench is the
    heart of any woodworking shop, and it needs to be sturdy, flat, and functional.
    There are many types of workenches, but the most common is the wood-style. The
    top is the most important part, and it should be made of a thick, durable wood.
    The legs need to be strong enough to support the weight of the work.


    A workbench should also have a few key features, such as vises and bench dogs.
    Vises are used to hold work in place while you work on it, and bench dogs are
    used in combination with clamps to hold work. A well-designed workbench will also
    have plenty of storage for tools and materials.


    Building a workbench is a project that can take any time, but it''s one that will
    pay off for years to come. It''s the foundation for all your woodworking projects,
    and it''s a place where you can spend your time creating things.


    If you''re looking for a workbench design, there are many plans available online.
    You can build a simple workbench or a more complex one. The important thing is
    to choose a design that fits your needs and your budget.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_169_0.png)


    # BENCH VISES


    A vise is a tool used to hold work in place while you work on it. There are many
    types of vises, but the most common type for a workbench is the bench vise. A
    bench vise has two jaws that come together to hold the workpiece. One jaw is fixed,
    and the other is moved by a screw.


    Vises are made of various materials, including wood and metal. Metal vises are
    generally more popular because they''re more sturdy and durable. When choosing
    a bench vise, you should consider the size of the work you''ll be doing. If you''ll
    be working on large pieces, you''ll need a large vise. If you''re working on small
    pieces, a smaller vise will do.


    A bench vise is an essential tool for any woodworker. It allows you to hold work
    securely while you''re sawing, planing, chiseling, or doing other tasks. Without
    a vise, it''s very difficult to work accurately and safely.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_1.png)


    # BENCH DOGS


    Bench dogs are small blocks that are used in combination with clamps to hold work
    in place on a workbench. They are inserted into holes in the top of the workbench.
    When a clamp is attached to a bench dog, it pushes the workpiece against the other
    dog, holding it in place.


    Bench dogs can be made of various materials, including wood, metal, and plastic.
    They can be square, rectangular, or round and fit into correspondingly shaped
    holes in the top. If you''re building your own workbench, you can make your own
    bench dogs too.


    Bench dogs are a simple but very useful tool for any woodworker. They allow you
    to hold work in positions that would be otherwise difficult to clamp with a vise
    alone. With bench dogs, you can work on a wide variety of projects, from small
    boxes to large furniture.

