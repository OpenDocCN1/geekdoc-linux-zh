    # 引言


    ![](img/82f8fd51f2b064bbc4df21354d664e50_)


    我对工具的热爱始于妈妈六岁生日时送给我的一套工具包。你可能甚至见过它——经典的《流行机械》（Popular Mechanics）蓝柄工具。天哪，我太爱那套工具了。尽管如此，我依然热爱它。事实如此，我非常喜欢这些工具。这就是为什么本指南对于每一位想要自信处理木材的工匠来说至关重要。精度的重要性无与伦比的——从冲子到分规规，标记和测量工具是准确性的基石。锯子也是至关重要的工具。市面上有什么锯子？在什么时候应该使用哪种？理解描述这些工具、它们的锯齿以及切割动作的术语。


    事实如此，我得到了我的第一把组合规规。无论如何，这些工具令我印象深刻。事实上，我对这些工具非常熟悉。我对这些工具的兴趣如此强烈，以至于我生日经常经常收到工具。在这些期间，我送了我第一把工具。我依然保留它。在10岁时，如果你有机会亲手做点东西，从一把木工刨子开始。即使最后看起来很糟糕，你也会庆幸你曾尝试过。至少，这会让你对木工产生深刻的赞赏。你可能会因此上瘾。


    远离那些木桌。


    Jim Peters

    2001年秋


    ![](img/82f8fd51f2b064bbc4df21354d664e50_7_0.png)


    > ...任何结构的强度和耐用性，无论材料如何，都取决于精度，任何不准确不仅会损害美观，还会导致相应程度的稳定性缺失。


    BLACKIE & SONS (1853)


    # 测量与标记工具


    ![](img/82f8fd51f2b064bbc4df21354d664e50_8_0.png)


    在木工中，“按照数据”执行项目并不是平庸的表现，也不是老调重弹；它是至关重要的。当然，涉及的“数据”是处理木材的尺寸。如果你不进行精确的测量和布局——正如
    Blackie 先生所言——你可能会得到一个不仅美感而且缺乏耐用性的作品。


    你的工作室工具可能是最好的、最锋利的。但如果你无法进行准确的测量和标记，这些工具几乎毫无用处。


    看看左侧照片中的紫木、象牙和黄铜——这并非单纯的奢侈。过去的木工们知道这些优质材料在当时物有所值（其中一件精美之品可能花费几个月的工资）。你的手工艺前辈们理解购买品质来创造品质的重要性，正如
    Blackie & Sons 的木工们一样，他们深知精度的重要性。自信地制作一件精美的作品涉及许多步骤——每一步都依赖于遵循“数据”。


    从左上顺顺时针：一把1904年的“美国组合水平仪和角度规”、一把手工制的24英寸面板规、一把C. S. Co.制造的折叠尺、卡尺（带钢腿）、Stanley
    5号分规、一把7/2英寸组合三角规、Stanley 7号划线子、Henry Dixon 和 Stanley 的榫凿以及一把Stanley 40号象牙银质卡尺。


