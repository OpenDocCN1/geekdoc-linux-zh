    # SPECIALTY VISES


    # Carver''s vise


    A carver''s vise (top vise in drawing at left) is a portable unit that can be
    clamped to any sturdy edge. The workpiece is attached to the round mounting plate,
    which can be adjusted for height, angle, and rotation. This makes it easy for
    the carver to do 360-degree work without having to move around. Instead, the workpiece
    is adjusted into the optimal position for carving.


    # Patternmaker''s vise


    A patternmaker''s vise (middle vise in drawing at left) is a special type of woodworker''s
    vise that can be rotated or flipped horizontal or vertical and that accepts tapered
    work. Sounds great; what''s the catch? This vise will cost easily 3 to 4 times
    a conventional bench vise would. I have a friend who has one of these, and although
    he likes it just fine, he''s found that he rarely uses the special features. He
    has also noted that it doesn''t hold up well under heavy use, such as with his
    chopping mortises.


    # Bench holdfast


    A bench holdfast (or hold-down) is used to press a workpiece firmly against the
    top of the workbench so it can be worked on (bottom vise in drawing at left).
    The holdfast consists of a shaft with a pivoting arm and swivel shoe. The shaft
    fits into a metal collar let into the bench-top. Tightening a screw into the end
    of the pivoting arm forces the swivel shoe into the workpiece. These are commonly
    used by carvers to hold work in progress.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_172_0.png)


