    # WATERSTONES


    I can''t imagine woodworking without my waterstones. To me, they''re far superior
    to other stones because they cut so fast to quickly produce a keen edge. Although
    you can still purchase natural Japanese waterstones, their high cost is usually
    prohibitive. In recent years, man-made waterstones that are much cheaper have
    hit the market. The stones I''ve been using for a while now are manufactured by
    Norton (www.nortonabrasives.com). I like these because they''re wide enough to
    handle my widest plane blade and plenty long (8"x3''). They''re available in four
    grits: 220, 1000, 4000, and 8000. I use the 220-grit stone only for shaping or
    repairing a nicked, damaged blade.


    For waterstones to work effectively, they need to be thoroughly saturated. You
    should soak a waterstone in water for at least 10 minutes prior to use (top photo).
    As you use the stone, it''s important to keep the surface wet to prevent metal
    particles from becoming lodged in the surface (middle photo). I keep water at
    hand and dip my hand in periodically to drip addition on the stone.


    Since I''m continually sharpening my tools, I prefer to store my stones in water.
    This way they''re always ready to use. A plastic storage box with a tight-fitting
    lid works well for them. ShopTip: To eliminate the possibility of mold or mildew
    growing in the box, add a capful of household bleach to the box every time you
    change the water (bottom photo). Caution: Be careful not to leave your stored
    stones in an unheated garage. If the water freezes, the stones will crack and
    you''ll end up with really expensive slipstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_178_0.png)


    # SHARPENING TOOLS


    # GRINDING WHEELS


    When a tool edge damages or needs to be reshaped, an electric or hand-powered
    grinder is for the job. The problem many woodworkers have with power grinding
    is twofold. First, most grinders at 3450 rpm are just too fast. Even with the
    right wheel, this speed can quickly remove the temper from a tool, rendering it
    useless. Recently slower-rpm grinders (1800 rpm) have become available and are
    well worth the extra money. The second problem is that wheels standard on most
    grinders are like the blades that on power saws—they''re useless. These wheels
    are usually very coarse and hard. They''ll burn an edge in seconds. Take them
    off and replace them with wheels intended for use in sharpening tools.


    What you''re looking for is basically the Japanese waterstone equivalent in a
    wheel: the wheel needs to be soft and fine and have a fairly open coat. Like a
    waterstone, this will cut aggressively but wear quickly. I''ve used a Norton 80-grit
    aluminum-oxide wheel successfully for years. It removes a lot of metal in a hurry
    while minimizing the risk of burning—a great all-purpose sharpening wheel (wheel
    in the top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_1.png)


    # WHEEL DRESSERS


    With use, the surface of any grinding wheel will clog up metal particles. This
    happens when the wheel loses its cutting ability and needs to be ''dressed'':
    that is, scraped to reveal a fresh grinding surface.


    There are a number of wheel dressers on the market just for this job. Two of the
    more common are the abrasive stick (photo at far right) and the star-wheel dresser
    (photo near right). I use an abrasive stick more often than my star-wheel dresser,
    as it leaves a smoother surface. To true up an out-of-round wheel, I have a diamond
    dresser resembles a ballpoint pen except it is tipped with a 74-carat industrial
    diamond. These are available from most woodworking catalogs and cost less than
    $20.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_3.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_4.png)


    # HONING GUIDES


    A honing guide is designed to rigidly hold a tool at a constant angle for honing.
    Although I have met a few accomplished cabinetmakers who hone without a guide,
    most woodworkers will benefit from the added reinforcement one offers. There are
    numerous honing guides available through mail-order catalogs and at your local
    hardware store or home center.


    There are two basic types of guides: the type that grips the tool and rolls on
    the stone (top photo) and the larger type where the guide roller rests on the
    adjacent surface (middle photo).


    I''m quite partial to the smaller type of honing guide that rolls on the stone
    with the tool. The one I''ve used for years is an Eclipse No. 35 honing guide,
    which clamps the blade or chisel between two jaws. The beauty of this guide is
    that it automatically centers the tool. Since it runs on the stone, there''s no
    chance of error.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_0.png)


    # ADJUSTING CHISEL AND HEEL


    There are many ways to set the angle of a chisel or plane (bottom photo). I use
    a honing guide to ensure the angle is consistent. Once the angle is set, you can
    move the tool across the stone to create the bevel. For the heel, I use a different-type
    guide to set the tool at the desired angle (www.eclipsesharpening.com).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_3.png)


    # STROPS


    Certain types of leather are used for stropping. You can use a strop just like
    you would use a waterstone (water is the recommended lubricant), but you''ll notice
    a few differences (top photo). First, unlike waterstones, strops won''t dish out:
    they stay flat. And second, they''ll actually cut in most situations because the
    diamonds stay sharp so long—you''ll end up fewer strokes (what a pity, eh?)


    I''m quite partial to the smaller type of honing guide that rolls on the stone
    with the tool. The one I''ve used for years is an Eclipse No. 35 honing guide,
    which clamps the blade or chisel between two jaws. The beauty of this guide is
    that it automatically centers the tool. Since it runs on the stone, there''s no
    chance of error.


    I use a strop of leather attached to a paddle (top photo). You can charge the
    strop with a polishing compound to help create a fine-edge. Move the tool strop
    across the strop. For the most, I use a leather strop to create a super-fine edge
    (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_181_0.png)


    # SLIPSTONES


    Slipstones are another favorite of carvers. These are small, odd-shaped stones
    that are designed for rounded edges (photo at right). They are available in a
    variety of sizes, both natural and man-made, and grits. For the most part, I use
    these primarily to remove a burr on the edge.![](img/82f8fd51f2b064bbc4df21354d664e50_181_1.png)


    # LAPPING PLATES AND DIAMOND STONES


    ## Lapping plates


    A lapping plate is any reference surface that can be used to create a flat surface
    on a tool. I use lapping plates regularly to flatten the soles of planes (top
    photo) and to flatten stones. The plate I use is a piece of 4" thick glass that
    is a replacement for a jalapie window. Since there is still a bit of flex in one
    of these, it''s important to place it on a known-flat surface. The abrasive action
    is supplied by sheets of silicon-carbon mounted to the glass with spray adhesive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_0.png)


    ## Diamond stones


    Although they''re expensive, diamond stones are well worth the money (middle photo).
    Diamond stones are made by bonding uniform-sized diamond particles to a metal
    plate and attaching this to a polycarbonate base. Since diamonds are the hardest
    material known, they wear very slowly and the stone stay "sharp" for a very long
    time. Diamond stones and stones are available in many shapes and sizes in four
    grits: coarse (220 mesh), coarse (325 mesh), fine (600 mesh), and extra-fine (1200
    mesh). I use stones made by DMT (www.dmtsharpen.com) and have yet to wear one
    out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_1.png)

