    GUSTAV STICKLEY (1905)


    ## SHAPING TOOLS


    When it''s time to fine-tune a joint, that''s when you reach for a chisel. To
    make that smooth round-over on a cabriole leg, only a good file or rasp will do.
    For that personal touch a machine cannot duplicate, like carved detail on a cabinet
    pull, a gouge is a good choice. All these shaping tools are guided solely by the
    hand, and that''s what makes their effects so personal and unique. Unlike hand
    planes, which use a sole to guide the cutter, for example, all the direction and
    control of shaping tools is from the hands. What''s makes them so: No machine
    can duplicate their results.


    Think of the chamfered ends of Brian Hogg''s gears, or the crisp through tenants
    of Stickley''s ''work''. They quietly declare themselves made by hand...made with
    care and attention...made by one skilled human being. Anyone can use a sander,
    and its machine-powered abrasives obliterate any "mistake." Not everyone has the
    guts, or the skill, to leave their mark on a piece with a sharp tool. The confidence
    to do that with a little knowledge and a keen edge.


    To left to right: Stanley No. 53 spokesave; mortise chisel by Williams, Morse,
    & Co.; Nicholson USA flat standard file with unmarked cast-iron handle; chisel
    made by Wm. Taylor, 1/2" wide, 15" long; Nicholson ''plasters'' file, woodworker''s
    slide, made by UnderEdge Tool Co.; carving chisel made by W. Butler; folding-handle
    drawknife made by J. S. Canfield, patented December 18, 1853.


    ## CHISEL TERMINOLOGY


    Chisels can be broadly classified into two groups: those designed for use with
    hand pressure only, and those intended to be driven by a mallet. Chisels made
    for hand use may be either firmer chisels (originally called "former" chisels
    because they were used to form rough shapes) or paring chisels. Mallet-driven
    chisels are mostly thick, stout used to chop mortises. Over time, any heavy-duty
    chisel became a mortise chisel, even though they could be used for carving or
    other shaping work.


    Most chisels are similar in appearance. They each have a wood or plastic handle
    and a blade with a tang or socket (bottom drawing). What sets them apart primarily
    is the profile of the blade (top drawing) and their respective grinds or cutting
    angles (middle drawing).


    Mortise chisels are easily identified by thick, almost square blades. The blade
    is ground to a steep angle to hold up under the constant blows of a mallet. Firmer
    chisels can have either square or beveled edges. Square-edged chisels are usually
    steeper than beveled-elsels for planing. Note that in the middle drawing two sets
    of angles are given. As a general rule of thumb, chisels used on hardwoods require
    a steeper bevel to cut effectively than those used on softwoods.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_109_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_109_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_109_2.png)


    ## METAL HARDNESS


    One of the most important characteristics of a chisel affects its ability to hold
    an edge—and its overall performance—is its hardness. Metal is tested using two
    common methods: the Brinell test and the Rockwell test. The Rockwell scale, developed
    with ASTM (American Society for Testing and Materials), is a measure of metal
    hardness. In general, the higher the alphanumeric designation, the harder the
    metal. So “C” is harder than a “B”, a “30” is harder than “20,” etc. The C scale
    is the most used and is often tested at Rockwell C. Chisels with steel proven
    to stand up.


    ## Brinell test


    In this test, a hardened steel ball is pressed into the smooth surface of the
    metal. The area of the indentation is calculated (taking into account the pressure
    applied), where the ball comes to rest, and number obtained.


