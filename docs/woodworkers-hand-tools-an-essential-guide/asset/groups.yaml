    ## TRAMMEL POINTS


    Trammel points (also called a beam compass) come in handy when you need to draw
    a large-diameter circle or arc. Trammel points are a set of steel points that
    can be mounted on virtually any length beam, as long as it''s straight (top photo).
    The heads are held in place by tightening a knurled knob on top of each trammel
    point. Some versions include an accessory head, in case you''d prefer a pencil
    to a scored line. Bridge City Tool Works (www.bridgecitytools.com) manufactures
    a gorgeous tool (inset) that features a beam with a built-in metal rule.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_36_0.png)


    ## Basic use


    Just like the panel gauge, trammel points require two hands for use. One hand
    holds trammel at the pivot point, while the other hand moves the opposite head
    in a graceful arc or circle to mark the workpiece (middle photo). Keep the points
    razor-sharp and you''ll need to apply only light pressure to mark your workpiece.


    ## Stick trick


    If you don''t own a set of trammel points and need to draw a large-diameter arc
    or circle, try this crude but effective substitute. Simply drill a series of small
    holes the desired distance apart in a thin stick. Use an awl or a brad to temporarily
    hold one end at the pivot point, and insert a pencil or awl in the other hole
    to score or mark the arc or circle (bottom drawing). Naturally this isn''t anywhere
    near as accurate as a good set of trammel points, but it''ll do in a pinch.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_36_1.png)


    ## LARGE ARCS WITHOUT TRAMMELS


    Sometimes, you may find that you need to draw a large arc that exceeds the ability
    of your trammel points, or that would require a really long beam, or you just
    don''t have trammel points. In cases like these, try one of the variations of
    the old "bent stick" trick described below.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_37_0.png)


    ## Bent stick


    The boat-builder adage "If it looks fair, it is fair" certainly applies here.
    Just grab a strip of wood that''s long enough to create the desired arc, and have
    a helper flex the stick from start point to finish. Once the desired arc is obtained,
    draw along the wood strip with a pencil to mark it on the workpiece (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_37_1.png)


    ## Plexiglass strip


    One disadvantage of using a wood strip is the grain of the wood and will affect
    how the strip flexes—often in an uneven arc. You can get around this if you''ve
    got some plexiglass handy. Since the plastic doesn''t have any grain, are you
    flex it in it will be perfectly smooth (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_37_2.png)


    ## Clamp trick


    It never seems to fail that whenever I need to use a bent stick to draw an arc,
    there''s nobody around to help. When this occurs (and the arc is small enough),
    you can use a pipe clamp or bar clamp to flex the stick (bottom photo). This leaves
    your other hand free to transfer the arc to the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_37_3.png)


    ## DRAWING SMALL CURVES


    If you''re drawing-challenged, like me, you''ll find a set of French curves a
    real boon when it comes time to lay out graceful curves for a project. French
    curves are available individually or in sets in a variety of shapes and sizes
    (top photo). Most are made of sturdy acrylic and may be clear or tinted. I prefer
    the clear curves, as this allows me to easily see the grain and can position the
    curves to maximize interesting grain patterns. French curves are available in
    most woodworking catalogs and at any art store.


    ## Basic use


    I most often use French curves to create patterns or templates (like the cabriole
    leg shown in the middle photo). Slide the curve up and down the workpiece until
    the desired curve is found. Trace the curve up with a pencil or marking knife
    (I generally use a pencil, since a marking knife can cut and nick the plastic).
    French curves can also be used to lay out ovals (inset). Here again, position
    the curve until the desired shape is obtained, and trace around pair of light
    marks on the A will help you align it for the remaining quadrants.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_2.png)


    ## FLEXIBLE CURVES


    A flexible curve is basically a rod covered with a vinyl sheath (right photo).
    This clever tool can be bent into small, graceful curves and is especially useful
    for reproducing a curve from an existing part, such as a cabriole leg. Flexible
    curves can be found in most woodworking catalogs and at most art stores.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_39_0.png)


    > “It is a singular fact that while vast improvements are constantly made in all
    kinds of saws, the shape and style of handsaws today is very similar to one hundred
    years ago.”


    ## CUTTING TOOLS


    In the 21st century, Henry Disston is still correct. The shape and style of handsaws—so
    basic and functional—have changed little from the time of this legendary saw maker.
    His saws were (and still are) regarded as some of the best ever made: high-quality
    steel, to sharpen and hold a keen edge. A Disston saw was meant to last a lifetime.


    The craft of fine handsaws has almost disappeared in mass retail. Progress, most
    sawing operations have been taken over power tools. That’s too bad. In many cases,
    a handsaw in the hands of a skilled craftsman can produce results just as fine—but
    without the dust and noise. I''m not suggesting you trash your power saws. But
    the next time you need to make just a cut or two, a hand-powered Disston would
    approve.


    From top to bottom and left to right, a combined rip and crosscut saw made by:


    | Saw Type | Size | Manufacturer |

    | :--- | :--- | :--- |

    | Cutout saw | 6” | Bees & Moore |

    | Rip saw | 12” | Spear & Jackson |

    | Rip saw | 24” | G. Collier |

    | Keyhole saw | 7” | Henry Disston & Sons Keystone Works |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_40_0.png)


    ## SAW TERMINOLOGY


    Before delving into the wide variety of saws available and their uses, it''s important
    first to understand the terms used to describe saws, their teeth, and the cutting
    action. Crosscut teeth, on the other hand, sharpened with fine points on the ends
    to cleanly sever the cross-grain fibers. Some saws are sharpened as a sort of
    hybrid, intended to be used for both cross-cutting and ripping. These saws do
    a reasonable job, but not nearly as good as individual saws.


    ## Anatomy of a handsaw


    Every saw has at least two parts: the blade and a handle (bottom drawing). Each
    blade generally has a toe (the end farthest from the handle) and a heel (the closest
    to the handle). Handles may be open or closed, intricate, or be made of wood,
    metal, or a combination of them.


    ## Saw teeth


    For the most part, the configuration of the saw teeth will define whether the
    saw is designed to cut with the grain or against the grain. Teeth designed to
    cut with the grain are rip teeth, and are sharpened flat on the top to create
    a planing or chiseling action.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_41_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_41_1.png)


    ## Teeth per inch


    In addition to how a saw blade is sharpened, the number of teeth per inch will
    have a great impact on the performance of the saw. Generally, the greater the
    number of teeth, the finer the cut, and the longer it''ll take to make the cut.
    There are two common systems used to describe teeth per inch and points per inch
    (top drawing). Points per inch includes teeth at each point, whereas teeth per
    inch doesn''t—a blade with 8 points per inch will have 7 teeth per inch.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_0.png)


    ## Kerf versus set


    Another important characteristic of a saw blade is its set. Set is the amount
    each tooth is bent out of the saw blade. Without set, the blade would quickly
    bind in the kerf (middle drawing). Coarse-cutting saws (such as the rip saw) generally
    have a wider set than a finer cutting saw. This allows for plenty of clearance
    between the blade and the wall of the kerf. Aggressively set teeth are also commonly
    used on saws intended to cut green or wet wood. Here again, the wider set provides
    much-needed chip clearance.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_1.png)


    ## Tapered blades


    Another common method used to prevent binding when cutting with a handsaw is to
    taper the blade (bottom drawing). Looking at a cross section of a tapered blade,
    you can see that the blade is a uniform thickness just above the teeth and then
    quickly begins to taper upward toward the back. Most modern handsaws that you
    find in a hardware store or home center are not tapered—you generally have to
    pick up an older saw to find this useful feature.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_2.png)

