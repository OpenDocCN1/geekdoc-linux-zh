    # BEVEL-EDGED CHISELS


    When I say "chisel," the image that pops into woodworkers'' minds is a bevel-edged
    chisel like any those shown in the top photo. It''s ironic that these chisels
    have been marketed so long as bevel-edged that most people don''t realize that
    these are actually firm chisels. What''s really odd is that many woodworkers think
    that firm chisels are a completely different type of chisel. A bevel-edged chisel
    where the edges have beveled up toward the top of the blade.


    As I mentioned earlier, the advantage to beveling the edges is that this produces
    a chisel more adept at fitting into tight places, such as when removing the waste
    or trimming between dovetails (middle photo). This same slim profile allows a
    bevel-edged chisel to trim sliding dovetails (bottom photo) and other hard-to-reach
    places. The downside to beveling the edges is that it removes metal that would
    normally soften the chisel. This makes bevel-edged chisels more suitable for delicate
    work. I have occasionally take a mallet to mine, but if I''ve got a lot of wood
    to remove, I generally use a square-edged firmer chisel or mortise chisel. Bevel-edged
    chisels can be purchased individually or in sets, in widths ranging from 1/8"
    up to 2". The most common sets consist of six chisels: 1/8", 1/4", 3/8", 1/2",
    3/4", and 1".


    ![](img/82f8fd51f2b064bbc4df21354d664e50_111_0.png)


    # HANDLE VARIATIONS


    I bought my first set of quality chisels from a mail-order catalog. I picked a
    set with blades made from Sheffield steel and what looked like comfortable handles.
    The second I unpacked one and held it in my hand. I knew that it didn''t feel
    right. But being a novice, I figured the manufacturer knew they were doing and
    it must be me. So I kept them—and used them for many (uncomfortable) years. What
    a bonehead!


    It wasn''t until I was visiting a woodworking buddy that I saw the light. My friend
    was cutting a set of dovetails in wide planks for a blanket chest he was building
    for his daughter. I commented on his well-worn chisels, and he handed one to me.
    I couldn''t believe how good it felt in my hand. The balance was near perfect;
    the handle fit so well in palm that it felt like an extension of my hand. So this
    is what a chisel should feel like, I thought.


    I decided then and to always trust my first impression of a tool. I should have
    sent that first set back and ordered else. Better I should have visited a woodworking
    store and tried each brand until I found the best fit. I realize this might sound
    excessive, but chisels are some of the most-used hand tools in my shop. They really
    should mold to your hand and the material used matters of personal preference.


    I have four sets of chisels in my shop: a set of large, stout mortise chisels;
    a set of metal-handled (virtually unbreakable) firmer chisels for heavy work;
    a set of Marples "blue chip" bevel-edged chisels for rough paring and shaping;
    and an exquisite set of bevel-edged Japanese chisels for all my fine work (fitting
    joints, dovetails, etc.). I also have a few specialty chisels, but the bulk of
    the work is done with these four sets.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_112_0.png)


    | SOCKET | ONE-PIECE PLASTIC | ROUND LONDON PATTERN | BOXWOOD CARVING PATTERN
    | MORTISE |

    | :--- | :--- | :--- | :--- | :--- |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_112_1.png)


    # GRIPS


    There are three widespread grips used with chisels: underhand, overhand, and the
    blade grip. Each may be used to cut a single joint.


    ### Underhand grip


    I use the underhand grip most often when I''m making a paring cut. With this grip,
    the handle of the chisel rests in the palm of one hand while the other hand guide
    the blade (top photo). As you lean forward, the blade begins to pare. At any point,
    you can quickly stop the cut by "pinching" the blade with your fingers.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_0.png)


    ### Overhand grip


    The overhand grip is especially useful for vertical cuts, such as when cleaning
    out shoulders of a mortise or trimming the (middle photo). One hand wraps around
    the chisel (typically with thumb resting on top), and the other hand guides the
    blade. This grip lets you get your shoulder into the cut and works especially
    when trimming end grain.


    ### Blade grip


    Another grip I often use is the blade grip (bottom photo). Here, I grip the chisel
    by only the blade so that I can use my other hand for the mallet to drive the
    chisel. This grip lets me position the chisel tip with pinpoint accuracy. Another
    version of the blade grip is the slicing cut, shown in the bottom photo on the
    opposite page.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_1.png)


    # BASIC CHISEL TECHNIQUE


    Whatever work you''re planning, the first step is to secure the workpiece. For
    light work, such as paring, you can just clamp the workpiece in your vise. But
    if you''re doing heavier work (especially chopping mortises), clamp the workpiece
    to the top of the bench. For the best support, to position it directly over (or
    as close as possible to) the legs of the workbench (top photo). This helps dampen
    vibration and prevents the workpiece from bowing.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_114_0.png)


    ### Support block


    For work where you''re paring the full width of the workpiece, or through the
    workpiece, you should always insert a support block under it (middle photo). A
    support block not only protects your workbench from damage, but also prevent tear-out
    by solidly supporting the wood fibers where the chisel exits the work.


    ### Slicing cut


    Although I''ve always considered a slicing cut to be one of the more basic techniques,
    I rarely see it used. This specialized form of the blade grip should be in everyone''s
    bag of tricks. I use two forms of this cut. With one, I grip the blade almost
    like pare away wood (top photo on page 16). With the other form, I grip the blade
    with one hand and use the other as fulcrum. This way, I can pivot the chisel into
    the workpiece, such as when slicing a dowel flush with a surface (bottom photo).
    Either way, it''s a great grip.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_114_1.png)


    # TRIMMING TENONS


    A common paring task for a chisel is trimming or cleaning tenons for a mortise-and-tenon,
    a slip joint, or stub-tenon-and-groove joint. There are a couple of critical areas
    of the tenon that usually need attention: the cheeks and the shoulders.


    ### Cheeks


    The first thing I do when fitting a mortise-and-tenon joint is to check the fit
    of the tenon in the mortise. Since it''s always better to have a tenon that''s
    too big (if it''s too small, you''ll need to cut it), the tenon will often require
    a little paring to fit snugly. I use a wide chisel for this and an underhand grip
    to pare away the excess (top photo). Start at one end and use the lip created
    by the chisel to reference the next cut. Take light cuts and check the fit often.


    ### Shoulder


    Once the tenon fits into the mortise, that''s left is to make sure the joint fits
    snugly with no gaps. Even when you''re careful cutting a tenon, it''s easy to
    end up with a "stepped" shoulder. To clean up the shoulders, start by taking light,
    horizontal paring strokes to clean out the intersection of the cheek and shoulder
    (middle photo). A long time ago I learned the value of "undercutting" the shoulders.
    That is, instead of making a 90-degree cut, I just start inside the shoulder (around
    1/16") and tilt the chisel slightly (bottom drawing). This undercuts the shoulder
    and virtually eliminates any fitting problems.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_115_0.png)

    ![](img/82f8fd51f2b06444df21354d664e50_115_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_115_2.png)


    # CLEANING OUT MORTISES


    The other half of a mortise-and-tenon joint, the mortise, often requires some
    "tweaking" after it has been cut. If you''ve cut the mortises by hand, I usually
    need to tweak the tenons for a good fit. If you use a machine, you may need to
    do a little or a lot of work. If the mortises are router-cut, they''ll likely
    need the corners squared.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_0.png)


    ### Sides


    To clean up the sides of a mortise, choose a sharp chisel that is fairly wide
    (top photo). Take care to keep the chisel vertical (a guide block clamped to the
    workpiece helps), and take light cuts. Skewing the chisel also produces a cleaner
    square.


    ### Ends


    Mortise ends often require paring, either to size the mortise correctly or square
    up corners (middle photo). Although a lot of folks advise using a chisel that''s
    the same width as the mortise for, I''ve had better luck with one that''s slightly
    narrower. This way the chisel doesn''t get jammed between the sides, and you don''t
    have to rock it to get out. Rocking like that can enlarge the mortise, creating
    a sloppy fit.


    ### Bottom


    The bottom of a mortise is a difficult area to clean up, since access is limited
    by the sides and ends. The best way I''ve found to do this is to use a chisel
    with the bevel up and take light, scooping cuts (bottom photo). Avoid the temptation
    of using the top edge of the mortise as a fulcrum point for the chisel: You''ll
    only crush this edge and end up with a weaker joint.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_1.png)

