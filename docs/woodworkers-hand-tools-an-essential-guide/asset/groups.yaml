    ![](img/82f8fd51f2b064bbc4df21354d664e50_139_0.png)


    "A woodworker''s hands develop in a special way with intense and concentrated
    use. The flesh becomes stronger and heavier in certain areas, better fitted to
    grasp and use the tools."

    GEORGE NAKASHIMA (1981)


    ## ASSEMBLY TOOLS


    Hammers, drills, screwdrivers, mallets; not the sexiest array of tools in the
    shop, but these essentials are well, essential. There may be more types of all
    of these that you''re familiar with, and it''s an advantage to know both what''s
    available and how to use it for maximum results. These deceptively mundane implements
    are easy to take for granted. They''re everywhere, everyone knows how to use them
    (or think they do), and one is good as the next, right? Actually, there are differences
    in quality, function, and use that can all make a difference in your completed
    piece.


    For example, if you drive in brads with a claw hammer instead of a Warrington
    hammer, you''ll smash your fingers and put dimples in the wood. And if you install
    hinge screws with an incorrect-sized screwdriver, you''ll shred the screws and
    damage the hardware. So often, these assembly tools are the ones that bring the
    piece together in their final stages. They are not the ones you reach for to install
    drawers, or attach doors. This is not for the bargain-bin, one-size-fits-all tool.
    This is where, master woodworker Nakajima, you know to "grasp and use" the right
    one for you.


    Top left to bottom right: cast-iron hand drill made by Millers Falls Tool Co.;
    10" flat-blade screwdriver; hardwood mallet with cast rings; riveting hammer made
    by 9" round/flat-blade screwdriver; 4-1/2" flat-blade screwdriver; 28-oz. forged
    claw hammer made by Warner & Noble.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_140_0.png)


    ## HAMMER TERMINOLOGY


    Metal handles are often forged along with the head and therefore will never loosen.
    Composite handles (fiberglass or other plastic composition) are usually secured
    to the head with high-grade epoxy. Although these have much less loosening compared
    to a handle, they can break free from the head under heavy use.


    Although I rarely use nails in my woodworking projects, I use hammers regularly.
    I''ll pick up one to drive in wood pegs, tap parts together, and drive chisels
    (with my Japanese hammer). I use a couple of different weights of claw hammers,
    two sizes of Warrington hammer for driving in brads, and a ball-peen hammer for
    metalworking (top photo).


    Regardless of the type, virtually all hammers are similar in construction (bottom
    drawing). This simple tool consists of a handle and head, and depending on the
    type of handle, one or more wedges to keep the head secured. Wood handles (like
    the one shown in the drawing below) typically have three wedges: one wood and
    two metal. The wood wedge spreads the sides of the tenon to grip the head, and
    the metal wedges help distribute the pressure evenly.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_141_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_141_1.png)


    ## CLAW HAMMERS


    When most folks envision a hammer, they think of a claw hammer. And many believe
    a claw hammer is a claw hammer, right? Not true. There are many different kinds
    of claw hammers available. For the most part, they can be divided into two types:
    those with curved claws, and those with straight claws (tap drawing). Curved hammers
    are by far the most common, and they are particularly adept at removing nails.
    Straight-claw hammers are more common in construction work, where the straighter
    claws are commonly used to pry parts apart. What a straight-claw hammer gains
    in demolition work, it loses in nail-pull efficiency.


    But there''s more to claw hammers than the curve of the claw. The weight and handle
    (see the sidebar below) will also have a huge impact on how well the hammer performs.
    Weights range from 7 ounces up to 28 ounces; the most common is 16 ounces. Heavier
    hammers are mostly used in construction by experienced framers, who can drive
    a 16-d nail into two or three strokes. A heavy hammer will drive nails faster,
    but it will also wear out faster; these industrial-strength tools are best left
    to professionals.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_142_0.png)


