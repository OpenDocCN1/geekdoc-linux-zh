  - '[PAGE 17]


    # TAPE MEASURES


    I''m sure that when Alvin J. Fellows patented the steel tape measure in 1868,
    he didn''t expect his invention would turn out to be one of the most useful tools
    to the woodworker. Although his tape measure didn''t have a locking mechanism
    for the tape (this was patented by Stanley in 1968), he was the first to print
    graduations on a steel tape. Today''s tape measures feature spring-loaded tapes
    that are slightly concave to help hold them rigidid over long distances. They''re
    commonly available in 8-, 12-, 16-, and 25-foot lengths. I''ve always found the
    combination of a smaller 12-foot and a larger 25-foot tape measure to be all I
    need in the shop (top photo).


    # Checking a tape


    When you''re buying a tape measure, skip the bargain; it pays buy quality. Go
    with a name brand you can trust, like Starrett, Stanley or Lofkin. And, take the
    time to check it for accuracy at the store. To do this, simply extend the tape
    out several feet and bend it back on itself. Align the inch marks and check whether
    the graduations are even (middle photo). On cheaper tapes, you''ll often find
    that the graduations don''t match.


    # The hook


    Another thing to check for buying a tape measure is a quality hook that''s securely
    riveted to the end of the tape, while still allowing to move freely for inside
    and outside measurements. The reason the hook needs to slide for inside measurements:
    It''s designed to slide in the exact thickness of the hook to provide an accurate
    measurement (bottom drawing).


    | Outside Measurement | Inside Measurement |

    | :--- | :--- |

    | ![Outside Measurement] | ![Inside Measurement] |

    | Hook Slips over Lip | Hook Pushes in Flush with Edge |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_17_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_17_1.png)'
  - '[PAGE 18]


    # Inside measurements


    Most quality tape measures will have the exact dimensions of the case printed
    on the side of the case. This makes it easy to take any measurement. Just butt
    the case of the tape measure firmly against the side of the work-piece and extend
    the tape to the other side (top photo). With this in mind, you''re better off
    choosing a tape whose outside dimensions are easy to work with--it''s a lot simpler
    to add 3" to 9/16" and 21/2" Try to find a measure with an inch dimension.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_0.png)


    # Outside measurements


    An outside measurement is simplicity itself: Just catch the edge of the hook on
    one edge of the work-piece, and pull to extend the tape (middle photo). You''re
    always better offivoting the tape so that it lies flat on the edge to be flush
    with the surface and prevents errors from parallax.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_1.png)


    # ACCURACY TIPS


    The methods described above work fine for general-purpose inside and outside measurements.
    But when you''re looking for added precision, try these two tricks:


    +   1. For inside measurements, butt a reference block against an edge of the
    work-piece (I have a scrap of MDF cut precisely to 4" set aside just for instances
    like this). Then extend the tape to the opposite end and read where it passes
    over the reference block--add the length of the block to get a super-accurate
    reading (top photo at right).

    2. For outside measurements, try extending the hook end of the tape 1" past the
    edge of the work-piece (bottom photo at right). Take the reading and subtract
    an inch. This method eliminates any error caused by a bent or malfunctioning hook.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_2.png)'
