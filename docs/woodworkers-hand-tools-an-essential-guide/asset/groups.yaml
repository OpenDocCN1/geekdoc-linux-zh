    # 榫角规


    榫角规（或称榫卯标记器）是一种一次性工具，用于为榫卯连接的榫头（pins）和榫尾（tails）进行布局。优质的榫角规提供制作榫卯最常用的两种角度：硬木用的
    18° 斜角和软木用的 16° 斜角。如果你通常使用这两种斜角，一个榫角规或如顶图所示的一组标记器会非常好用（金色标记器用于硬木，深色标记器用于软木）。如果你倾向于自己设定角度，游角规（第
    30 页）是更好的选择。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_30_0.png)


    # 榫尾 (Tails)


    使用榫尾标记器时，首先使用划线器或切割尺设定尾部的深度，使其与木材厚度匹配。然后仔细布置尾部的间距。调整榫角规的位置，使其对准其中一个标记，并确保斜角方向正确。然后用铅笔或划线刀标记尾部的侧面（中间图）。翻转标记器并标记对面。继续操作，直到所有的尾部都标记完毕。


    # 榫头 (Pins)


    取决于你切割榫卯的方式（我总是先切榫尾，然后用它们来定位榫头），你可能想或不想在布置榫尾的同时标记榫头。无论你选择哪种方法，都都将标记器与你在工件端部制作的布局图对齐，并用铅笔或划线刀标记它们的位置（底图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_30_1.png)


    # 游角规 (BEVEL GAUGES)


    游角规（或滑动 T 型角尺）是车间里不可或缺的布局工具。你可以用它验证角度、设定工具以匹配角度，并布局几乎任何角度。大多数游角规具有一个金属槽口刀片和一个由木头、塑料或金属制成的柄或主体，有多种尺寸（顶图）。刀片可以方便地滑入体内的槽口进行存放。通过紧固底部的指螺丝、翼母、杠杆或旋钮将刀片固定在位置。


    # 复制角度


    游角规的一个常见用途是复制一个角度以便你可以还原它。要做到这一点，松开指螺丝或翼母使其处于摩擦紧固状态，将游角规的柄压在工件边缘（中间图）。然后调整刀片角度直到它靠在工件边缘上。紧固翼母，使用游角规在另一件工件上复制此角度。


    # 使用圆度规设定


    在很多情况下，你会想要将游角规设定为精确的角度，或读取你刚刚设定的角度（例如当你正在复制角度时）。此此最准确的方法是使用圆度规。这里的关键点是确保游角规的刀片恰好位于圆度规底部的中心（底图）。然后调整刀片到所需角度或读取刀片角度。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_31_0.png)


    # 圆规 (COMPASSES)


    圆规在车间里用于布局圆和弧。最常见的类型是弓形圆规（顶图右侧）和翼形圆规（顶图左侧）。弓形圆规是一种绘图工具，带有螺纹轴，在由弹簧连接的双腿之间。一条腿持有钢针，另一条持有铅芯。翼形圆规的腿在顶部铰合，并用弹簧连接，通过转动连接在螺纹柱上的滚花旋钮来强制张开或关闭。其中一条腿有钢针，另一条通常设计为持有标准铅笔。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_32_0.png)


    # 画圆


    我喜欢用钢尺来设定我的圆规。我将钢针定在标记处的刻蚀刻度线中，然后调整绘图点到所需的半径。虽然圆规的钢针通常能很好地保持在位，但我发现用圆锥钻出一个轻微的引线孔有助于在旋转圆规以标记圆或弧时防止针头游移（中间图）。


    # 分圆


    这里有一个将圆转换为六边形或布置等间距孔（例如用于转轴或安装孔）的快速方法：将圆规设定为所需的半径，将钢针放在圆周上，并旋转圆规直到它在圆周上划过一个标记（底图）。然后将钢针移到此位置并画另一个标记。这样一直绕圆圈下去——你最终会回到起点。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_32_1.png)


    测量与标记工具


    # 分圆器与游卡尺 (DIVIDERS AND CALIPERS)


    弹簧式分圆器与圆规的区别在于，它的两条腿都持有金属针，而不是单个针头和一个铅笔或笔芯（顶图）。分圆器通过调节其中一条腿上的滚花螺母来打开或关闭腿部。虽然你可以使用分圆器划圆或弧线，但它们更常用于布局以“平分”（因此得名）或步进式测量。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_33_0.png) # 步进测量


    一旦将分圆器设定为所需距离，通过让分圆器沿线移动来“步进”等距离，只需让分圆器沿线（中间图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_33_1.png) # 游卡尺：内径与外游卡尺


    初看之下，游卡尺看起来和分圆器非常相似。仔细观察你会发现差异在于腿部（顶图）。由于腿是弯的，游卡尺主要用于测量内径和外径。通过将游卡尺靠在工件边缘，你可以测量内径（右图）。由于游卡尺的腿是弯的，你可以通过在地上转动游卡尺来测量外径（底图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_0.png) # 拨式游卡尺


    拨式游卡尺和滑动式游卡尺在机械加工中非常有用。尽管它们通常被视为机械师工具，拨式游卡尺也可以用于测量深度（顶图）。拨式游卡尺的柄是金属的，而滑动式游卡尺通常带有数读。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_1.png) # 拨式游卡尺


    拨式游卡尺和滑动式游卡尺在机械加工中非常有用。尽管它们通常被视为机械师工具，拨式游卡尺也可以用于测量深度（顶图）。拨式游卡尺的柄是金属的，而滑动式游卡尺通常带有数读。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_2.png) # 拨式游卡尺


    # 深度尺


    游尺也可以作为深度尺。尽管它们通常被视为机械师工具，拨式游卡尺也可以用于测量深度（顶图）。拨式游卡尺的柄是金属的，而滑动式游卡尺通常带有数读。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_0.png) # 深度尺


    测量与标记工具


    # 中心寻找器


    寻找工件的中心是一个布局任务。由于它如此常见，以至于工具制造商制造塑料中心寻找器，如顶图所示，专门用于这项。这些简单的工具在相邻侧带有翼，可以快速定位工件。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_1.png) # 中心寻找器


    基本用法


    要使用像这里这样的中心寻找器，将工件的边缘靠在中心寻找器的翼上。然后将铅笔或划线刀靠在开口并在工件上画一条线。接下来，将工件旋转 90 度并画另一个标记。线条交叉的地方就是正中心（中间图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_2.png) # 中心寻找器


    # 自制中心标记器


    除了寻找工件的中心外，你经常需要在木板边缘寻找中心。我发现最简单且最准确的方法是制作自己的中心标记器。这仅仅是一块带有两对木销（最好是钢针）以及一个铅笔孔的废料（右图所示）。挑战在于定位铅笔的正中心。要做到这一点，首先标记并钻出木销孔（或使用
    1/4 英寸棒）。然后用胶水安装木销（金属棒使用环氧树脂）。现在使用它们来定位正中心。只需将金属尺对角放在木销之间，并在两个方向上标记。在线条交叉处钻一个铅笔孔。（注意：为了获得最大的准确性，此孔的大小应适合机械铅笔。）


