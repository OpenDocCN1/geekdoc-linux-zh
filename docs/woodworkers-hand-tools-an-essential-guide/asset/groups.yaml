    # MARKING TOOLS


    If you were to ask most woodworkers what the foundation of accuracy is, they''d
    likely say the ruler, the tape measure, or the square. But I''ve always felt it''s
    the marking tools you choose. Granted, the ruler, tape measure, and square are
    essential to precision; but without a clean, crisp marking tool, all their accuracy
    is for naught.


    ## Pencils


    The most common marking tool in the shop is a pencil (top photo). A carpenter''s
    pencil is not suitable for intricate layout work; with its thick lead and cumbersome
    body, it''s best left for initial layout of rough boards. Many woodworkers use
    a standard No. 2 pencil for layout work. This is certainly better than a carpenter''s
    pencil, but it can add significant errors to your work. The reason is that the
    line thickness varies as the lead wears (middle drawing). This might seem trivial,
    but it''s not.


    Say, for example, you''re laying out dovetails for a set of drawers. If you use
    a standard pencil, the lead will wear considerably. Unless you constantly sharpen,
    you can introduce anywhere from 1/32" to 1/16" of error from start to finish (no
    wonder those dovetails don''t fit!). My choice for all-around layout work is a
    mechanical pencil with a 0.5mm lead. This leaves a crisp, even line—even as it
    is.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_9_0.png)


    NO. 2 PENCIL / MECHANICAL PENCIL


    ## Marking knives


    If accuracy is paramount, reach for a marking knife (bottom photo). As long as
    it''s sharp, a marking knife produces an extremely fine line on a board. On the
    plus side, this can help guide a chisel or saw during a cut. The downside to this
    is that cutting into the wood can leave marks that may need to be removed later.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_9_1.png)


    MEASURING AND MARKING TOOLS


    In addition to pencils and marking knives, there are three other marking tools
    I like to have on hand in the shop: a lumber crayon, white marking pencils, and
    a chalk line.


    ## Lumber crayons


    A lumber crayon is designed to mark on rough-cut lumber (top photo). Though you
    can use a pencil for this, a lumber crayon will serve you better, especially if
    the wood isn''t completely dry. Pencil marks tend to absorb into the surface of
    the wood over time and disappear. A lumber crayon''s marks are impervious to this.
    As a matter of fact, most sawmills mark freshly cut wood with a crayon before
    it goes into the kiln for drying; after the wood comes out, the crayon''s marks
    are still legible.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_10_0.png)


    ## White pencils


    Another nifty tool to have on hand is a white pencil for drawing on dark woods,
    where a pencil line would blend into the wood and be invisible (middle photo).
    White pencils can be found at most art centers as either a standard colored pencil,
    a grease pencil, or a marker. All of these work well, but I prefer a white colored
    pencil—just make sure to sharpen it frequently if accuracy is an issue.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_10_1.png)


    ## Chalk lines


    Chalk lines are useful for marking long, straight lines, such as when preparing
    rough stock or sizing boards (bottom photo). Make sure to shake the chalk line
    before use to evenly coat the line, and then hook the end over the board at your
    mark. Stretch the line to the opposite end of the board and pull the line straight
    up a couple of inches; then let go to “snap” a line on the board.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_10_2.png)


    ## AWLS


    The awl has historically been used to create starter holes in wood for brads and
    nails, and to create starting points for drill bits. The most common type of awl
    is the scratch awl (top photo). As you can see, the size and length of the awl
    can vary greatly. Another type of awl has a cylindrical shaft that tapers to a
    point. The point of the awl is used to create a small starter hole for a drill
    bit.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_11_0.png)


    ## Marking locations


    In my shop, I frequently use an awl as a center-punch. When I have a lot of holes
    to mark for drilling, I usually reach for a center-punch. Also, since I often
    incorporate metal into the jigs and projects, a center-punch is the best tool
    for marking locations.


    ## Basic grip


    To use an awl as a center-punch, you need to hold it in your palm. This allows
    you to apply downward pressure without the tip from wandering across the wood.


    ## Wobble


    If you use an awl instead of a center-punch, you may find that the tip tends to
    wander. To prevent this, make sure the tip of the awl is sharp, before you use
    it in the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_12_0.png)


    ## Marking


    I''ve known a few woodworkers who prefer an awl for marking in wood. Just make
    sure to keep the point razor-sharp, as it will tend to tear wood fibers.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_12_1.png)


    ## CENTER-PUNCHES


    Although a center-punch is often thought of as a machinists tool, many woodworkers
    (including myself) find them useful in the shop. When I have a lot of holes to
    mark for drilling, I usually reach for a center-punch (top photo). Also, since
    I often incorporate metal into the jigs and fixtures, a center-punch is the best
    tool for marking.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_13_0.png)


    ## Automatic center-punch


    An automatic center-punch has an internal spring that releases when the tool is
    depressed, forcing an internal plunger or anvil to strike the tip and leave a
    dimple on the work-piece (middle drawing). The springs on most automatic center-punches
    are adjustable so that you can vary the depth of the dimple.


    ## Tip angle


    Depending on what material you''re drilling into, you may need to have a couple
    of center-punches, each with the tip ground to a different angle. If you''re drilling
    into metal with twist bits, you''ll want an angle around 60 degrees to match the
    angle of the twist bit. For marking in wood where you''ll be drilling with a brad-point
    or Forstner bit, you''ll find that an angle around 45 degrees works best.

    '
