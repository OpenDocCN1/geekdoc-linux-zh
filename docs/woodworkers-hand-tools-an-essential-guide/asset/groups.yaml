    ## WOOD AND TRANSITIONAL PLANES


    Before metal-bodied became the norm, wood and wood/metal hybrids known as ''transitional''
    planes were the standard. Although you can still find some modern wood planes,
    most wood and transitional planes are antiques, gathering dust on shelves. That''s
    too bad, because there are plenty of shavings left in these classic tools.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_73_0.png)


    ## Wood-body planes


    The advantage a wood-bodied plane offers over a metal plane is more aesthetic
    than technical (top photo). Some woodworkers (including me) appreciate the warmth
    and natural feel that a wood sole offers. And it seems less harsh to the work-piece.
    The downside to a wood sole is that wood moves. Wood-bodied planes need continuous
    attention to ensure the sole is flat; fortunately, it''s a lot easier to true
    up than a metal sole. Additionally, adjusting the blade is cumbersome.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_73_1.png)


    ## Transitional planes


    Transitional planes were designed to bridge the gap between wood-bodied and metal
    planes. They combined a wood sole with the convenient blade adjustments of a metal
    plane (middle photo). I tuned up my great-grandfather''s old Stanley No. 132 jointer
    plane years ago. Although it''s a bit finicky, I use it all of the time.


    ### Blade adjustment


    The big difference between a wood plane and a transitional plane is how the blade
    is adjusted (bottom drawing). On a wood plane, the blade is held in place with
    a wedge. Tapping the heel or toe of the plane raises or lowers the blade, respectively.
    With transitional planes, the blade rests on a metal frog and is adjusted up and
    down by a knob or lever.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_73_2.png)


    ## BLOCK PLANES


    Of all the hand planes in my shop, the one reach for most often is my block plane.
    That''s because it''s handy for fitting joints, trimming parts, and planing a
    delicate detail like a chamfer or round-over on a table top. Block planes typically
    run between 5" and 6-1/2" in length and were originally designed to plane end
    grain (top photo). Many woodworkers mistakenly believe that a block plane handles
    grain so well that the blade is at a much lower angle than a standard plane. True,
    the blade is much lower (roughly 20 versus 45 degrees for a standard bench plane),
    but the effective angle is virtually the same. Why? The blade on a block plane
    is installed up instead of down (as a standard plane). When you add the 25-degree
    bevel''s ground onto the 20-degree blade angle, you get up at 45 degrees.


    Why does a block plane work better on end grain? First, the lower blade angle
    allows for a one-handed grip that puts the hand, and shoulder in line—this creates
    a more effective thrust. Since the bevel is up and there''s no need for a frog,
    the body can rest firmly on the bed of the body, so it''s fully supported virtually
    all the way up to the cutting edge (bottom drawing). This excellent support, combined
    with an efficient stroke, allows a block plane to cleanly sever wood fibers without
    chatter or tear-out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_74_0.png)


    There are two types of block planes available today: a standard block plane and
    a low-angle block plane. As discussed earlier, the blade rests on the body at
    about 20 degrees—this creates an effective angle of 45 degrees (top drawing).


    ### Low-angle block plane


    The blade on a low-angle block plane rests on the bed at about 12 degrees (middle).
    Combined with a 25-degree bevel, this yields an effective cutting angle of approximately
    37 to 38 degrees. You wouldn''t think that 12 degrees would make much difference,
    but I''ve found that a well-sharpened low-angle block plane will generally outperform
    its higher-angle cousin. My block plane of choice is the Record 60-1/2. It fits
    well in both my pocket and hand. If you have smaller hands, you may find the Stanley
    601/2 more to your liking; it fits about 1/4" narrower than the Record.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_1.png)


    ## KNUCKLE-JOINT BLOCK PLANES


    An interesting aside to the evolution of the block plane is the knuckle-joint
    plane, introduced by Stanley in 1888. Virtually identical to a Stanley No. 9,
    these block planes had a longer lever cap screw and a unique hinged lever cap
    known as the knuckle joint. This plane was designed to provide a more comfortable
    one-handed grip. The smooth top of the cap, along with the absence of a protruding
    mechanism, helps this plane nest comfortably into the palm of your hand. If you''re
    fortunate enough to stumble upon a yard sale or auction (and the price is right),
    snap it up.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_2.png)


    ### Adjustable throat


    An interesting aside to the evolution of the block plane is the knuckle-joint
    plane, introduced by Stanley in 1888. Virtually identical to a Stanley No. 9,
    these block planes had a longer lever cap screw and a unique hinged lever cap
