    # CENTER-FINDING TIPS


    You''ll frequently need to find the center of a work-piece. The combination square
    is the perfect tool for the job. Here are three different ways to use it to locate
    dead center.


    ## Marking diagonals


    The first and simplest method to locate center is to use the 45-degree head to
    mark a series of diagonals (top photo). This method works best with stock that
    is relatively square, since sides that are not 90-degree can throw the center-off.


    ## Using a center-finding head


    If you''ve purchased the center-finding head for your combination square, it doesn''t
    get easier than this. Just slip the center-finding head on the blade and position
    the head so it touches adjacent sides of the work-piece; then mark center (middle
    photo). This head is especially useful for finding center on round stock.


    ## With a framing square


    The only disadvantage to the methods described above is that they work only for
    relatively small work-pieces. If you have a work-piece that''s larger than 6"
    you might find that this tip works well:


    Clamp a framing square to the blade of the combination square so that the long
    blade butts against the 45-degree face of the combination square''s head (bottom
    photo). Adjust the blade of the combination square so that it bisects the inside
    corner of the framing square. Then position the framing square so that both its
    legs contact the work-piece, and mark the center.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_24_0.png)


    # FRAMING SQUARES


    A framing square is another one of the tools that some woodworkers feel belong
    only in a carpenter''s toolbox. That''s too bad, because a framing square is quite
    useful in the wood-shop. The longer legs of a framing square make it ideal for
    checking larger surfaces, where a smaller square or combination square won''t
    give an accurate reading. Framing squares can be found in a number of materials
    and sizes (top photo). I prefer an aluminum square over a steel one, as its is
    much lighter and won''t rust over time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_25_0.png)


    ## Checking a framing square


    To make your framing square accurate, place it on a work-piece with a known straight
    edge. Position the square so the short leg (the tongue) extends just over the
    edge of the work-piece. Then draw a line along the long leg (the blade) and flip
    the square over (middle drawing). Slide the square over until the blade aligns
    with the line you''ve drawn—it should line up perfectly. If it doesn''t, you can
    retrue the square by lightly hammering the metal at the diagonal joint between
    the tongue and blade. If you hammer on the inside edge, the square will "open";
    hammering on the outside corner "closes" the square.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_25_1.png)


    ## Accuracy tip


    Whenever you''re looking for added accuracy with a framing square, allow the tongue
    or blade of the square to hang down over the edge of the work-piece and press
    it firmly against the edge (bottom photo). This ensures that the square will be
    aligned perfectly with the edge. It''s easy to introduce error here if you simply
    try to hold the tongue flush with the edge of the square on top of the work-piece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_25_2.png)


    # MARKING GAUGES


    Marking gauges are extremely useful for marking lines parallel to an edge with
    great accuracy, such as when you''re laying out joints to be cut. A marking gauge
    basically consists of four parts: a beam, a fence (stock), a thumbcrew, and a
    marking pin. The beam and fence may be made of wood or metal. Wood marking gauges
    are more common and may or not have brass strips inlaid to reduce wear (top photo).
    Some beams have scales, but these are best used only to set the fence to an approximate
    distance.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_0.png)


    ## Basic use


    To use a marking gauge, loosen the thumbcrew and slide the fence desired distance
    from the pin. Tighten the thumbcrew and make a test mark; readjust necessary.
    Place the fence of the gauge against the edge of the work-piece and angle it so
    the pin tilts away from the direction you''ll move the square (middle photo).
    Although most woodworkers feel they have better control pushing the gauge, there''s
    no reason to pull it if this feels better to you.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_1.png)


    ## Steady, even pressure


    A marking gauge will accurately scribe parallel lines as long as you use it, even
    pressure to hold the fence against the edge of the work-piece (bottom drawing).
    If you don''t, the pin can and wander. Pressing firmly will also keep the beam
    parallel to the surface, which will prevent the pin from scribing at an angle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_2.png)


    # MEASURING AND MARKING TOOLS


    ## CUTTING GAUGE


    A cutting gauge is very similar to a marking gauge except instead of using a pin
    to mark the work-piece, it uses a knife (top photo). The advantage of this is
    that the knife cleanly cuts through the wood fibers instead of tearing them as
    a pin does. This makes the cutting gauge the tool of choice whenever you need
    to mark lines across grain.


    You might then think, why not throw out my marking gauge and just use the cutting
    gauge? Because the knife of a cutting gauge leaves such a thin, crisp line it
    disappears when you use it to scribe a line along the grain. Shop Tip: To create
    a "universal" marking gauge, some woodworkers adjust their marking gauge to a
    finer point. This does an adequate job of marking both with and against the grain,
    but is still inferior to results from individual gauges.![](img/82f8fd51f2b064bbc4df21354d664e50_27_0.png)


    ## Basic use


    The technique for using a cutting gauge is virtually identical to that of the
    marking gauge, with one exception: Take care to use very light pressure (middle
    photo). If the knife is sharp (a few strokes with a diamond hone will bring it
    to a crisp point), it''s easy to cut deeply into the wood, leaving cross-grain
    scratches that can be a hassle to remove.![](img/82f8fd51f2b064bbc4df21354d664e50_27_1.png)


    ## VENEER STRIP TIP


    A cutting gauge can also be used to create uniform strips of veneer to use as
    inlay for your projects (photo at left). Set the fence to the desired strip width,
    and place the veneer on a scrap piece so it''s flush with the edge. Make a series
    of light cuts to produce strips.![](img/82f8fd51f2b064bbc4df21354d664e50_27_2.png)


    # MORTISE GAUGES


    A mortise gauge has two pins instead of one to simultaneously mark out parallel
    lines. It''s designed specifically to lay out the cheeks of mortises and tenons.
    One of the pins is fixed, while the other is independently adjustable (top photo).
    In some cases the the adjusts via a simple pull slide; on others a thumbscrew
    or knurled knob mounted to the end of the beam. Many mortise gauges feature a
    third pin on the beam opposite the two others. This allows the mortise gauge to
    also function as a marking gauge.![](img/82f8fd51f2b064bbc4df21354d664e50_28_0.png)


    ## Setting the pins


    The first step in using a mortise gauge is to set the pins. To do this, hold the
    mortise chisel up and adjust the traveling pin to match the width of the chisel
    and lock it in place (middle photo). Then slide the fence over the pins are set
    the desired distance from the edge of the work-piece. Try the setup on a scrap
    piece first and check the layout with a ruler.![](img/82f8fd51f2b064bbc4df21354d664e50_28_1.png)


    ## Basic use


    Just as with the marking gauge or the cutting gauge, the critical thing here is
    to firmly press the stock against the edge of the work-piece. All you''re looking
    for here is even pressure. Popeye-like strength will only cause problems—commonly,
    excess pressure will shift the position of the traveling pin or the beam. Use
    a light, firm grip, and tilt the gauge away from the direction of movement (bottom
    photo).![](img/82f8fd51f2b064bbc4df21354d664e50_28_2.png)


    # PANEL GAUGES


    A panel gauge is basically a wood marking gauge that''s designed to handle big
    panels. The difference is the beam is much longer (typically 15" to 30") than
    a standard gauge and the fence is much wider. In the past, panel gauges were often
    made of mahogany with brass wear fittings. The exquisite one shown (top photo)
    is made by Bridge City Tools (www.bridgecitytools.com) and will mark the center
    of a 48" wide work-piece. You can also regularly find antique panel gauges on
    the Internet at various sites, running anywhere from $20 to $40 for a gauge in
    good condition.![](img/82f8fd51f2b064bbc4df21354d664e50_29_0.png)


    ## Two hands


    Using a panel gauge is definitely a two-handed operation. After you''ve loosened
    the thumbcrew (often use a wedge to lock the beam in position) and adjusted the
    pin or the desired distance from the edge, lock the beam in place. Then press
    the fence firmly against the edge of the work-piece with one hand while you apply
    light downward pressure to the pin or knife with your other hand (middle photo).
    Move the gauge slowly with steady even pressure.![](img/82f8fd51f2b064bbc4df21354d664e50_29_1.png)


    ## Cutting disc


    Instead of a pin or knife, the Bridge City panel gauge shown here uses a cutting
    disc (bottom photo). The disc is made of hardened steel and is beveled to help
    pull the fence into the work-piece as you move the gauge along the edge of the
    work-piece. This leaves razor-sharp lines with no tear-out, even when your cutting
    across the grain.![](img/82f8fd51f2b064bbc4df21354d664e50_29_2.png)

