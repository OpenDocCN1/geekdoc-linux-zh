    # EDGING TOOLS


    There are several specialized edging tools designed with one purpose: to create
    a rounded or chamfered edge on a work-piece. Three of the more common are the
    Radi plane, the cornering tool, and the chamfer plane.


    # Radi plane


    Radi planes are wood-bodied planes that hold two concave cutters to ground a 1/8"
    radius (top photo). The cutters can be adjusted up or down independently as desired.
    The first cutter shears off the majority of the waste, and the second cutter makes
    a cleanup pass—this lets you make the completed profile in a single pass.


    # Cornering tool


    A cornering tool is a piece of steel with notches cut into both ends. These notches
    are sharpened to create a fixed radius used to round over an edge (middle photo).
    Common radii are 1/16",/8",/16", and 1/4". You position the tool with the notch
    straddling the edge and then pivot it up until the cutting edge engages the wood.
    Pulling the tool creates a nice shaving. As always, several light cuts produce
    a smoother surface than a single deep cut.


    # Chamfer plane


    If you regularly plane a lot you might want to consider a chamfer plane (bottom
    drawing). Most of these planes can be adjusted to cut 30-, 45-, and 60-degree
    chamfers. They work great and will produce a clean, crisp edge without the outing
    and mess of a portable router.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_84_1.png)


    NOTE: Even though the edging tools mentioned here, I''ve always felt that a well-tuned
    block plane can get the job done almost as quickly. However, if you''re fighting
    the clock or are involved with production runs, these specialized tools may be
    right for you.


