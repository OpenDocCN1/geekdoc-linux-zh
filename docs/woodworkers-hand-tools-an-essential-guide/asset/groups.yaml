    一把好的锉或锯木刀就可以了。通过一点知识和锋利的刃口，为你的作品留下个人印记。


    （接前封页内容）


    组装工具如锤子和螺丝刀很容易被忽视。它们随处可见，每个人都知道如何使用（或者他们认为自己知道），而且一个工具和另一个工具并没有区别，对吧？实际上，在质量、功能和使用上的差异会对你的成品作品产生巨大影响。这些工具是你安装抽屉或安装门时所需的工具。这里并不是购买廉价、一多用货的地方。


    夹永远越多越好。但你需要正确的类型：如果你有三个弹簧夹但只有两个管夹，你永远无法成功地胶合一块板材。你还需要知道何时以及如何——以及不要过度使用——不同类型。最后，通过了解更多磨削技巧，你可以避免挫败感、失败的作品和人身伤害。


    了解有哪些工具，以及如何有效地利用它们。


