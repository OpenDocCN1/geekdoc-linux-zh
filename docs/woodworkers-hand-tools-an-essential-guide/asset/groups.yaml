    ## 特种木钳


    ## 雕刻钳


    雕刻钳（见左侧图中顶部的虎钳）是一种便携式装置，可以夹紧在任何坚固的边缘上。工件安装在圆形安装板上，该板可以调节高度、角度和旋转。这使得雕刻者可以轻松进行
    360 度的作业，而无需移动身体。相反，是将工件调整到雕刻的最佳位置。


    ## 样板工钳


    样板工钳（见左侧图中中间的虎钳）是一种特殊的木工钳，可以水平或垂直方向旋转或翻转，并能接受锥形工件。听起来很棒；但问题出在哪里呢？这种钳的成本轻而就是普通台钳的
    3 到 4 倍。我有一个朋友拥有这种钳，尽管他非常喜欢它，但他发现自己很少使用那些特殊功能。他还注意到，这种钳在高强度使用下（例如在他凿榫卯眼时）表现并不理想。


    ## 台锯固定夹


    台锯固定夹（或称快速压板）用于将工件牢牢地压在工作台面上，以便进行加工（见左侧图中底部的虎钳）。固定夹由一个带有转动臂和旋转鞋的轴组成。轴插入嵌入工作台面的金属衬套中。通过拧紧转动臂末端的螺钉，使旋转鞋压入工件。雕刻者通常使用这些夹来固定进行中的工件。


