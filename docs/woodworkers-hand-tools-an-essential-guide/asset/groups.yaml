    You will see a surface change from dull to clear: rough-sawn or even machined
    it is dull and as you, it clears in little waves, the burnished patches are spreading
    like sunshine touching a field under scattered clouds.


    JAMES KRENOV (1977)


    # # SMOOTHING TOOLS


    ![](img/82f8fd51f2b064bbc4df21354d664e50_60_0.png)


    Krenov is so poetically right here: Planing removes surface crud that you can
    see the true beauty that lies beneath.


    We''ve become brainwashed into thinking that our wood projects have to be as smooth
    as the artificial surfaces of plastic laminates like Formica. This is so sad,
    because wood offers such a rich, most sensual surface. And this natural beauty
    is often obscured by power sanders.


    Only hand-planing or scraping can produce the "burnished patches" we all appreciate.
    We glide our fingers on the well-worn edges of the table that Great Jasper made.
    We feel the irregularities—there''s comfort here. We can feel the marks left behind
    by his tools—his honest work. So why we try to conceal our one maker''s marks?
    We''ve come to believe that smoothness without flaws is best. I don''t buy it.


    Leave your mark; let everyone know that you made this piece by hand. Let the wood
    have its character. It did come from a tree, after all, not from a plastic factory.


    Clockwise from top left: a collection of Ohio Tool Company hand planes: Columbus,
    Ohio and Alburn, New York: No. 03, No. 05/1, No. 053/4, No. 06, No. 07 (in red),
    No. 08, No. 041/2, No. 041/4, No. 02, No. 5, No. 51/2, No. 03 (in center).'
