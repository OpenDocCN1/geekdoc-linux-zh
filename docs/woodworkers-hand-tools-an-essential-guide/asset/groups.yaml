    the body can rest firmly on the bed of the body, so it''s fully supported virtually
    all the way up to the cutting edge (bottom drawing). This excellent support, combined
    with an efficient stroke, allows a block plane to cleanly sever wood fibers without
    chatter or tear-out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_74_0.png)'
  - '[PAGE 75]


    There are two types of block planes available today: a standard block plane and
    a low-angle block plane. As discussed earlier, the blade rests on the body at
    about 20 degrees—this creates an effective angle of 45 degrees (top drawing).


    # Low-angle block plane


    The blade on a low-angle block plane rests on the bed at about 12 degrees (middle).
    Combined with a 25-degree bevel, this yields an effective cutting angle of approximately
    37 to 38 degrees. You wouldn''t think that 12 degrees would make much difference,
    but I''ve found that a well-sharpened low-angle block plane will generally outperform
    its higher-angle cousin. My block plane of choice is the Record 60V2. It fits
    well in both my pocket and hand. If you have smaller hands, you may find the Stanley
    601/2 more to your liking; it fits about 1/4" narrower than the Record.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_1.png)


    # KNUCKLE-JOINT BLOCK PLANES


    An interesting aside to the evolution of the block plane is the knuckle-joint
    plane, introduced by Stanley in 1888. Virtually identical to a Stanley No. 9,
    these block planes had a longer lever cap screw and a unique hinged lever cap
    known as the knuckle joint. This plane was designed to provide a more comfortable
    one-handed grip. The smooth top of the cap, along with the absence of a protruding
    mechanism, helps this plane nest comfortably into the palm of your hand. If you''re
    fortunate enough to stumble upon a yard sale or auction (and the price is right),
    snap it up.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_75_2.png)'
  - '[PAGE 76]


    # Adjustable throat


    Since they have no frog to adjust the blade back and forth to open and close the
    throat opening, some block planes offer an adjustable throat plate (top drawing).
    This lets you close the opening for fine cuts, and open it for coarser work. Hardware
    variety block planes do not have adjustable throats. In my opinion, they''re not
    worth the money. For just a little more, you can pick up a quality block plane
    that has an adjustable throat. To adjust the opening, loosen the lock knob and
    pivot the lever to move the plate open or closed.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_76_0.png)


    # Depth adjustment


    Another feature to look for in a block plane, in addition to an adjustable throat,
    a depth-adjustment mechanism. You want one that works well and is comfortable.
    The middle photo shows three common methods for adjusting depth. At top in the
    photo a standard block plane with a horizontal ''disc'' or wheel that turned to
    raise or lower the blade. Below is my personal favorite (common on low-angle block
    planes), an in-line knurled knob that''s rotated to adjust depth. And finally,
    even though it''s a nuisance to adjust, I''ve got a wood-body block plane that
    feels nice in my hand (bottom plane in middle photo); to adjust the depth, you
    tap the metal cap on the body to raise the blade, and on the front of the body
    to lower the blade.


    # Grips


    There are three common grips I use with a block plane: light, heavy, and reverse.
    The grip I use most is the light grip (bottom photo). The plane nestles in the
    hand while the fingers wrap around it with the index finger pressing down on the
    throat-plate lock knob. This grip works well for most trimming and fine-tuning
    jobs.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_76_1.png)'
  - '[PAGE 77]


    Although I don''t use a block plane to remove a lot of wood, a heavier grip comes
    in handy every now and then. For this grip, I use two hands to guide the plane
    (top photo). This works especially well when planing end grain, since you want
    firm pressure to prevent chatter.


    # Reverse grip


    Just like a Japanese plane (see page 92), you may find that you have more control
    over a block plane if you reverse it in your hand (middle photo). This grip lets
    you pull the plane instead of pushing it. I often use this grip when chamfering
    edges or making a final pass on an edge of a work-piece.


    A hybrid of the heavy and reverse grips is to use both hands to pull the plane.
    One hand grasps the throatplate lock knob to pull the plane, while the other hand
    wraps around the body of the plane in a reverse grip to guide it through the cut.
    If you skew the plane body slightly, you''ll find that this modified grip works
    extremely well on end grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_77_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_77_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_77_2.png)


    # A PLANE "KIT"


    I bought my first plane when I was 14. It was a knock-off of a Stanley No. 41/2
    that I picked up at Warner''s hardware store in downtown Minneapolis. I was excited
    to get home and use it. After I pulled it out of the box and clamped a piece of
    scrap wood to my hand, I gleefully made my first pass. What a disappointment—it
    tore up the edge, and shavings jammed under the blade and cap iron. Most be me,
    I thought: Maybe I''m not using it right or I haven''t adjusted properly.


    As you might suspect, this was my first lesson in hard knocks on hand tools, particularly
    planes. What I''d really purchased was a plane "kit." Little did I know then an
    afternoon of "tweaking" would produce a tool capable of creating perfect shavings.
    My point is, almost every plane you needs some fine-tuning before it functions
    properly. Fortunately, this isn''t difficult (see pages 64-66 for tuning a jack/jointer
    plane and for tuning a block plane). As a matter of fact, you may find it quite
    enjoyable. It''s a great way to spend a rainy afternoon in the shop.'
