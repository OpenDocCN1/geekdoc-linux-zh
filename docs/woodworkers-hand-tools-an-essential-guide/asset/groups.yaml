    For me, the biggest challenge to sharpening a saw is keeping track of which teeth
    have been sharpened and which teeth haven''t. I solved this dilemma by sliding
    guards of thin


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_3.png)'
