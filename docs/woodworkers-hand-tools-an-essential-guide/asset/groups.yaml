    # TUNING A BLOCK PLANE


    Since a block plane is often-frequently used to plane end grain and other hard-to-plane
    wood like twisted or squirrelly grain, it is imperative that the plane be tuned
    accordingly. This involves flattening the sole, sides, and under the iron, adjusting
    the throat, sharpening the blade, and tuning the lever cap.


    ## Flatten the sole


    Although a flat sole for a block plane isn''t as critical here as it is for the
    longer-bodied planes, it''s still important to ensure full support around the
    blade (top photo). Just as with a longer plane (see page 64), the key points that
    need to be flat are the toe, the heel, and around the throat opening. The area
    around the throat opening is the biggest concern, since this is the area that
    will ensure support the sole of the plane as it cuts.


    ## Flatten the sides


    Since block planes are occasionally used on their sides, it''s a good idea to
    check to make sure they''re 90 degrees to the sole. Use a small engineer''s square
    for this; if you find any deviation, flatten the sole as you did the sole (middle
    photo). Soften and re-check with the square. At the same time, I like to soften
    the edges of the sole by filing a slight (1/16") chamfer all the way around the
    body. This makes the plane fit comfortably in my hand and helps prevent dings
    on the work-piece.


    ## The bed


    The bed that the plane rests on is rarely flat, and this is a leading cause of
    chatter in a block plane. The best way I''ve found to flatten it is with a paddle-style
    diamond hone like the one shown in the bottom photo. Use firm pressure to keep
    the paddle flat, and continue honing until the bed is flat over its entire surface.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_78_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_78_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_78_2.png)


    ## Throat opening


    If you''re fortunate enough to have an adjustable-throat plane, you can fine-tune
    the throat opening by loosening the adjustment knob and pivoting the lever to
    open and close the opening (top photo). The mating surfaces of the adjustable
    throat plate and plane body will also benefit from a stroke or two by a diamond
    hone.


    ## Sharpen the blade


    A razor-sharp blade is essential for a plane to do its best. I generally grind
    a hollow bevel on the blade and then hone a micro-bevel (middle photo). See pages
    182-183 for detailed instructions on sharpening a plane.


    ## Fine-tune the lever cap


    The lever cap on a block plane combines the functions of the cap iron and the
    lever cap on a larger plane. It has to press the blade securely into the plane
    body (while still allowing for adjustment), and it has to hold it rigid to prevent-chatter.


    Here again, it''s imperative that the front edge of the lever cap make full and
    continuous contact with the plane blade. The best way to ensure this is to flatten
    the edge on an oilstone (bottom photo). You''ll need to experiment a bit to find
    the optimal angle; hone a little and then reassemble the plane.


    Check for gaps by trying to slip a feler gauge between the lever cap and the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_79_0.png)


    # USING A BLOCK PLANE


    ## End grain


    Even though block planes are designed to handle difficult end grain, you still
    have to be careful when you''re planing near an edge. That''s because the unsupported
    end grain near the end of a board will easily splinter and chip out. Frequently
    there are a couple of simple ways to prevent this.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_80_0.png)


    ## Plane toward the center


    One common method to prevent chip-out when planing end grain is to plane only
    toward the center of the board (top photo). This way the wood fibers are supported
    by the fibers in front of them. Simply planing about halfway down one side, then
    reverse the plane direction and plane from the other side. The downside to this
    method is that it can be difficult to create a truly flat surface. I generally
    reserve this for detail work such as planing a slight chamfer on a table top.


    ## Support the end with a scrap


    A more reliable way to prevent chip-out is to clamp a waste or "sacrificial" piece
    to the end of the board you''re planing (middle photo). This fully supports the
    end grain and permits a full stroke across the edge. The scrap piece will chip
    out, but that''s what''s there for.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_80_1.png)


    ## Squaring an edge


    I often use a block plane to quickly square an edge on a work-piece. To keep the
    plane body perpendicular to the sides of the work-piece, I wrap my fingers around
    the plane (bottom photo). Pressing my fingers gently into the side of the work-piece
    lets me steady the plane and make a clean cut.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_80_2.png)


    ## Built-In fence


    If you''re fortunate to own a block plane that has an adjustable fence (like the
    Lie-Nielsen skew plane in the top photo), you''ll find this feature handy. The
    fence is a lot more accurate than the finger support method described on the previous
    page and is adjustable, too. This lets you fine-tune its position for maximum
    support.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_81_0.png)


    ## Trimming small pieces


    I regularly use my block plane to fine-tune small parts. This is one of my favorite
    tools for taking off a sliver or two of a shaving so that part fits perfectly.


    When I need to take just a bit off the end grain of a small piece, such as when
    fine-tuning a mitered piece (middle photo), I hold the block plane firmly in one
    hand and pass the work piece with the other. It''s surprising how much control
    you have this way, especially if you tuck your elbows into the side of the body.
    Take light cuts and check the fit.


    Another way to trim small parts—and this is especially useful when you need to
    take a bit off the length—is to clamp the plane upside down on your workbench
    and then pass the work piece over the blade (bottom photo). Take care to keep
    your fingertips away from the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_81_1.png)


    # SHOOTING BOARDS


    Even in the hands of a master, planing a perfectly square edge on the end of a
    board is a challenge because the surface of the workpiece itself is used as the
    reference, and it isn''t. That''s where a shooting board can come to the rescue.
    They''ve been used to square up work-pieces for as long as there been planes.
    A shooting board is a shop-made jig that lets you hold the work so you can accurately
    trim it with a plane.


    A shooting board can be made to handle 90-degree stock or 45-degree miters (bottom
    photo)—or anything in between, whatever matter, since you make it yourself. Basically,
    the shooting board is a two-step base of flat stock with a groove in the bottom
    piece. The groove collects dust and chips so they don''t interfere with the cut.


    The top step holds one or more cleats that are secured with glue and screws at
    the desired angle. The work-piece is held against the cleat, and the plane is
    laid on its side and passed back and forth over the end of the work piece to trim
    it.


    For all this to work, the sides of the plane must be exactly perpendicular to
    the sole. Use the shooting board, set the plane for a very fine cut and take several
    light passes.


    Shop-Tip: To help prevent the workpiece from creeping during the cut, glue pieces
    of sandpaper to the sides of the cleat—they''ll grip the workpiece better and
    hold it in place.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_82_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_82_1.png)


    ## PREMIUM TOOL MANUFACTERS


    In addition to the respected tool manufacturers like Stanley, Record, and Starrett,
    there are a couple of tool-makers that produce tools of exceptional quality: Bridge
    City Tool Works and Lie-Nielsen Tools. Both of these companies manufacture what
    I consider to be premium tools in small batches under tight tolerances, using
    the finest materials. By simply picking up one of these fine tools, you''ll immediately
    notice a difference in heft, balance, and finish—the tool fits well in your hand,
    and the finish is extraordinary.


    Nothing beats Lie-Nielsen Toolworks (www.lie-nielsen.com). The hand planes, scrapers,
    and saws that Tom Lie-Nielsen manufactures in his Warren, Maine, factory are a
    joy to use. Just like Bridge City, Lie-Nielsen uses the finest materials, as manganese
    bronze for many of his casings and thick Rockwell 60-62 high-carbon tool steel
    for his blades. Yes, they''re expensive, but well worth it.


    ## Bridge City Tool Works


    When it comes to tools for layout and measuring


    ![](img/82f8fd51f2b064bbc4df21354d664e50_83_0.png)


    ## Lie-Nielsen Toolworks


    If you''re looking for the ultimate tools for planing and scraping.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_83_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_83_2.png)

