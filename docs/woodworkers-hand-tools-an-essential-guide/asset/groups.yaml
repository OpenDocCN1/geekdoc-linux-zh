    # SAW

    TERMINOLOGY


    Before delving into the wide variety of saws available and their uses, it''s important
    first to understand the terms used to describe saws, their teeth, and the cutting
    action.


    teeth, on the other hand, sharpened with fine points on the ends to act as small
    knives cleanly sever the cross-grain wood fibers. Some saws are sharpened as sort
    of a hybrid, intended to be used for both cross-cutting and ripping. These saws
    do a reasonable job, but not nearly as good as the individual saws.


    # Anatomy of a handsaw


    Every saw has at least two parts: the blade and a handle (bottom drawing). Each
    blade generally has a toe (the end farthest from the handle) and a heel (the closest
    to the handle). Handles may be open or closed (see page 42), intricate, or be
    made of wood, metal, plastic, or a combination of them.


    # Saw teeth


    For the most part, the configuration of the saw teeth will define whether the
    saw is designed to cut with the grain or against the grain. Teeth designed to
    cut with the grain are rip teeth, and are sharpened flat on the top to create
    a planing or chiseling action. Crosscut


    ![](img/82f8fd51f2b064bbc4df21354d664e50_41_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_41_1.png)'
  - '[PAGE 42]


    # Teeth per inch


    In addition to how a saw blade is sharpened, the number of teeth per inch will
    have a great impact on the performance of the saw. Generally, the greater the
    number of teeth, the finer the cut, and the longer it''ll take to make the cut.
    There are two common systems used to describe teeth per inch and points per inch
    (top drawing). Points per inch includes teeth at each point, whereas teeth per
    inch doesn''t—a blade with8 points per inch will have 7 teeth per inch.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_0.png)


    # Kerf versus set


    Another important characteristic of a saw blade is its set. Set is the amount
    each tooth is bent out of the saw blade. Without set, the blade would quickly
    bind in the kerf (middle drawing). coarse-cutting saws (such as the rip saw) generally
    have a wider set than a finer cutting saw. This allows for plenty of clearance
    between the blade and the wall of the kerf Aggressively set teeth are also commonly
    used on saws intended to cut green or wet wood. Here again, the wider set provides
    much-needed chip clearance.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_1.png)


    # Tapered blades


    Another common method used to prevent binding when cutting with a handsaw is to
    taper the blade (bottom drawing). Looking at a cross section of a tapered blade,
    you can see that the blade is a uniform thickness just above the teeth and then
    quickly begins to taper upward toward the back. Most modern handsaws that you
    find in a hardware store or home center are not tapered—you generally have to
    pick up an older saw to find this useful feature.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_42_2.png)'
- md: '

    Most handsaws have one of two handle styles: open or closed grip. Another common
    handle style is the turned or round handle common to coping, fret, and gent''s
    saws. The type of grip you choose is a matter of personal taste. Whichever style
    you choose, go with a wood handle, as it''s easy to shape and mold to fit your
    hand. It''s surprising how many workers are reluctant to modify a handle to better
    fit their hand. I always consider any "one size fits all" as a suggested starting
    point for shaping it to fit my hand. Give it a try: You''ll be surprised what
    a big difference a custom-fit handle will make.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_43_0.png)


    ## Open grip


    An open grip (or pistol grip) can be found on some back and dovetail saws like
    the one shown in the top photo. I personally find this style of handle very comfortable,
    because it doesn''t crunch my fingers like closed grips do. If you''ve large hands,
    you may find this grip more comfortable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_43_1.png)


    ## Closed grip


    Closed grips are more common than open grips. They''re generally more rugged and
    less easily damaged (middle photo). A closed grip saw also affords a slightly
    more rigid grip, especially if you frequently twist a saw to correct for a crooked
    cut.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_43_2.png)


    ## COMPARATIVE LENGTHS


    Rip saws are generally the longest of handsaws, with crosscut saws the next length.
    Shorter versions of crosscut saws (commonly referred to as panel saws) range between
    20" and 22". Back saws average around 12" to 14" in length.


    ## PROTECTING TEETH


    For a saw to really function well, the teeth need to be sharp and stay sharp.
    Without some form of protection, the teeth can quickly dull if a saw was tossed
    into a toolbox or dropped into a tool well. Here are three simple ways to protect
    the teeth of your saws.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_44_0.png)


    ## Garden hose


    For large saws (like a crosscut or rip saw), the easiest way to protect the teeth
    is to cover them with a short length of garden hose (top photo). You can buy this
    by the foot at most home centers. Make a slit the full length of the hose with
    a utility knife, and slip it over the teeth. You may need to temporarily attach
    the hose to the saw blade with duct tape until the hose straightens out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_44_1.png)


    ## Plastic tubing


    The teeth on smaller saws (like the bow saw shown in the middle photo) are best
    protected with smaller-diameter plastic tubing. Most home centers sell it by the
    foot. Just slit the tubing along its length and slip it over the teeth.


    ## Report binders


    For even smaller saws, such as a back or dovetail saw, the plastic spine from
    a report binder does a good job of protecting the teeth (bottom photo). These
    can be found at any office supply store and slip easily over the teeth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_44_2.png)


    ## RIP SAWS


    A well-tuned rip saw is a joy to use. It''s a shame that it''s getting increasingly
    difficult to find a good rip saw at your local hardware store or home center.
    Fortunately you can pick up a used rip saw at auctions, at estate sales, or on
    the Internet for just a couple of bucks. Rip saws are typically 5" in length and
    have around 5 teeth per inch (top photo and inset). Older saws feature a curved
    or "skew" back that was designed to reduce the weight at the toe, and reportedly
    improves the balance.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_45_0.png)


    ## Teeth profile


    A rip saw has chisel-like teeth that are designed to cut with the grain. In effect,
    they work like tiny planes or chisels to cleanly shear the wood fibers. The teeth
    are usually sharpened around a 3-degree angle and are flat at the top of the teeth.
    Because most quality rip saws are taper-ground, the set can be less aggressive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_45_1.png)


    ## Taper-ground


    A quality rip saw will be taper-ground; that is, the blade will gradually decrease
    in thickness as it moves away from the teeth (bottom drawing). The area directly
    above the teeth is a constant thickness to the teeth. Tapering the blade greatly
    improves the clearance of the saw in the kerf which reduces the likelihood of
    binding, of course, makes it easier to drive the blade through the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_45_2.png)


    The main reason many folks have difficulty ripping a board with a handsaw is they''re
    using a crosscut saw. A well-sharpened rip saw will slice through wood like a
    hot knife (For tips on starting a cut, see page 48).


    ### Beginning stance


    With your hand, elbow, and shoulder aligned with the saw blade, start your cut
    with the blade at a slight angle (top photo). This makes it easier to create a
    starting notch to guide the blade. Use your other hand to guide the blade at the
    start of the cut and secure the work piece as you continue.


    ### Shift to a more vertical cut


    To let the saw teeth do their job as tiny chisels or planes, it''s best to shift
    to a more vertical cut as you make your way into the board (middle photo). Take
    long, even strokes and let the saw do the work. Concentrate on putting force into
    the downstroke, and lighten on the upstroke. Try to keep a firm, relatively loose
    grip on the handle. As always, a well-sharpened saw will cut with little effort
    (see pages 184-185 for details on sharpening a saw).


    ### Chatter


    Anyone who has ever used a handsaw has probably experienced chatter—when the blade
    vibrates with a noisy backstroke (bottom drawing). This is a sure sign of an alignment
    problem: you''re most likely standing to one side or the other of the cut. The
    remedy is to keep the saw, hand, elbow, and shoulder in the same plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_46_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_46_1.png)


    ## CROSSCUT SAWS


    A crosscut saw is designed to cut across the grain. Crosscut saws vary in length
    from 22" to 26" and generally have around 7 to 8 teeth per inch (top photo). Although
    you can find crosscut saws at most hardware stores, you may be better off picking
    a used saw at auction, estate sale, or garage sale. That''s because the older
    saws were made with softer steel that allows for sharpening. Many of the modern
    saws use hardened teeth that are next to impossible to sharpen. They stay sharper
    longer; but when they dull, you have to discard them. A quality older saw will
    last a lifetime with a little care and an occasional sharpening (see pages 184-185
    for more).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_47_0.png)


    ## Profile


    The teeth of a crosscut saw act like tiny knives to cleanly sever the cross-grain
    wood fibers and to clear out the waste between the points (middle drawing). The
    teeth are usually sharpened at a 14-degree angle and often have an aggressive
    set to prevent binding.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_47_1.png)


    Crosscut Teeth Act Like Knives to Sever Wood Fibers


    ## Bench hook anatomy


    For accurate cross-cutting (with any saw), I recommend using a bench hook. You
    can''t find these in any catalog; you''ll have to make your own. A bench hook
    is just a flat, wide piece of lumber with a pair of cleats fastened on the ends
    on opposite faces (bottom drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_47_2.png)


    LEFT-HANDED Version

    RIGHT-HANDED Version

    Screw Cleats to Base

    Left Cleat Supports Work-piece

    Work-piece

    One Cleat Hooks on Bench Edge


    ## Using a bench hook


    A bench hook is positioned on the workbench so the cleat is on the bottom and
    hooks onto the edge of the workbench (top photo). The work-piece is butted up
    against the cleat on top, and slid so the cut line aligns with the end of the
    cleat. This lets you use the cleat as a guide block to start the cut. The cleat
    also supports the wood fibers to help splintering or tear-out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_0.png)


    ## Sight guide


    Even with a bench hook, you may want to use some type of sight aid to help keep
    the saw blade vertical. A tri square or engineer''s square works well for this
    when you set it near the saw blade (middle photo). You can also use a known-square
    block of wood. Whichever you use, try to keep an even gap between the sight guide
    and the saw blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_1.png)


    ## TOOLBOX SAWS


    Toolbox saws are a modern invention that solves the age-old problem of trying
    to fit a full-sized handsaw into a toolbox box (note the size difference between
    the toolbox saw and handsaw shown in the photo at right). These short saws (typically
    around 16" long) fit in larger boxes and have aggressive teeth. Because of the
    aggressive teeth, they have limited use in the shop. They''re suitable only for
    rough cuts, such as when rough-cutting boards to length.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_3.png)

