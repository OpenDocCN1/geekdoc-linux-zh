    ## 切削深度


    如果你拆下了斜垫（frog），则需要对其进行调校。首先松开斜垫螺丝，使其达到摩擦紧固的状态（上图）。然后，使用斜垫调节螺丝滑动斜垫，使其在刃口开启处与刨底对齐。你可能需要拆下手柄才能碰到这颗螺丝。注意：如果深度调节旋上有旷隙，你可以尝试拆掉斜面。如果承接旋角的调节座是钢制或黄铜，可以用C字夹将其夹紧一点。如果调节座是铸铁，请不要动它——任何压力都可能导致其断裂。


    ## 横向调整


    横向调节杆上不需要做什么：只需检查凸轮是否有毛刺，并用细锉或砂砂纸磨掉任何发现的毛刺。然后将刨刨反过来，平视刨底。反复左右转动横向调节杆，直到刨刃的边缘与刨底平行（中间图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_0.png)


    ## 定制手柄


    制作新手柄时，使用旧手柄作为模板（左图）。最好在加工手柄形状之前为手柄螺丝钻孔。切出形状，并对手柄进行光滑和打磨，以符合你的手型。即使你的手柄（或前节）没有问题，我总是建议对它们进行加工以贴合手。出厂的手柄是为“平均”手型设计的，而不是为了你的。定制手柄的手感要好得多。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_3.png)


    ## 使用台刨


    一旦你的台刨或平光刨调校好，在使用它之前还有一件事要做：你需要根据你正在进行的切削类型对其进行调整。我指的不是切削深度，而是背铁和斜垫的位置。


    ### 粗刨


    对于粗刨（如对板材进行初步平整处理），你需要调整背铁以产生相当厚实的刨削（上图）。松开背铁螺丝并移动背铁，使其距离切削边缘约1/8英寸。然后松开斜垫螺丝，转动斜垫调节螺丝以增大刃口开启宽度。这能让你切出更厚、更粗的刨屑而不会卡住。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_0.png)


    后移斜垫或向前移动底板以增大开启


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_1.png)


    ### 精光刨


    对于光光或面光切削，调整刨子是非常值得的。许多木工没有意识到背铁和斜垫位置对于这些关键切削的重要性。目标是将背铁移动到靠近刀刃边缘的位置，以便它能迅速破碎木屑并防止崩裂（中间图）。同时，调整斜垫以关闭开启处。这仍然允许更细的刨屑通过，同时为被切断的木纤维提供更好的支撑。


    向前移动斜垫或向后移动底板以缩小开启


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_2.png)


    ### 铅笔技巧


    现在你准备好刨削了。但在此之前，考虑这个简单的技巧，可以帮助你清楚地看到哪里刨过，哪里没有。用铅笔芯轻轻在工件的边缘或表面涂抹几下（下图）。当你刨削时，可以轻松地检查进度。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_3.png)


    手工刨是一项苦力活：很有趣，但如果你曾尝试仅靠手臂力量刨木板，很快就会学会刨削是一项全身任务。你的腿和手臂一样重要。采取以木板为中心的站姿，双腿分得比肩膀稍宽一点，膝盖微屈（上图）。虽然你想对刨子保持稳固、均匀的压力，但要注意用轻力握住旋钮和手柄：如果你使用“指关节发白”的握法，你的手很快就会酸。


    ## 开始切削


    在开始刨木板之前，花点时间“读”木纹。观察木板边缘，并将其固定在工作台上，使木纹向下并朝向刨身方向倾斜。将刨子放在工件上，使刨身延伸到木纹之外（中间图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_0.png)


    ## 完成切削


    当刨子接近木板末端时，减小手柄上的压力，并在前端减轻（下图）。这可以防止刀片切入木材。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_2.png)


    ## 平光板材


    我一直发现平光刨在平整或光光薄木材方面比小刨效果更好。这是因为长刨身在整个长度上施加压力。这防止了木材弯曲。对于非常薄的木材，我用双面胶将其固定在平整的底座上（上图）。任何间隙都会导致木材变形，产生波浪状切口。


    商店技巧：要将薄木材从底座取下，洒一些稀释剂使其渗透。稀释剂会溶解胶水，释放木材而不损坏。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_70_0.png)


    ## 推边


    平光刨常用的用途之一是连接胶合用的边缘（中间图）。看着长4到5英尺的连续刨花从刨顶吐出，非常有成就感。这里的挑战之一是你需要随着工作移动刨子移动。诀门是在移动身体时保持肘部处于同一高度。


    ## 低角刨


    这款以 Stanley 62 号低角刨为蓝型的图中所示低角台刨由 Lie-Nielsen Toolworks, Inc. 制造（www.lie-nielsen.com）。它像是低角手持刨和台刨的混合体。只需用这件宝贝刨几次，我知道它将成为我最喜欢的刨子之一。它在处理乱且棘手的木纹时效果极佳，我甚至在制作无肩槽浮雕板时用它来刨端面。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_2.png)


