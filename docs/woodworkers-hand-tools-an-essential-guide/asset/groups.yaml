    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_3.png)


    # 角凿 (CORNER CHISELS)


    角凿是一种特殊类型，它有两个以完美 90 度角相交的切刃（顶图）。注意：此处显示的凿子可以从 Lie-Nielsen Toolworks (www.lie-nielsen.com)
    购买。角凿用于在移除大部分废料后修整榫眼的棱角。因为这些凿子很难磨利，我只用它们进行最后的精修切割。这样一来，刃口比我用它去除大量废料时更耐用。诚然，这件工具并不适合每个人；但如果你需要切很多榫眼——尤其是榫卯——你会非常喜欢这件工具。由于我制作很多带有裸露结构的工艺品风格家具，角凿变得非常方便。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_0.png)


    # 两个切刃 (Two cutting edges)


    仔细观察角凿的末端：你会发现刀片外部有平整的表面，内部被磨出一个缺口以形成两个切刃（中图）。这些刃口经过研磨，既能制造出极其锋利的工具，又带来了磨削挑战。你可以用标准磨石磨这件工具；但你需要油石，或者更好是专门的小金刚石。我建议在每次使用前用金刚石对每个刃口磨几下以保持锋利。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_1.png)


    # 基本用法 (Basic use)


    有效使用角凿的关键在于进行轻微的刨削切割，并确保保持凿子完全垂直（底图）。我经常在工件上夹一个正方形的废料木块，以引导凿子直线移动。经常停下来清理废料。如果你在切穿一个榫眼，最好从工件中间切一半，然后从另一侧继续。


    # 塑形工具 (SHAPING TOOLS)


    # 日式凿子 (JAPANESE CHISELS)


    我的日式凿子用起来绝对是一种享受。它们木质的手柄和短刀片，在我的手中达到了完美的平衡。特殊的层压钢结构创造了易于磨利且保持锋利的刀片（顶图）。它们如何在如此小的包装内提供如此多的功能？首先，日式凿子的结构与它们的西方同类有显著区别。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_0.png)


    # 双金属刀片 (Bi-metal blades)


    与由单块钢锻造的西方凿子刀片不同，日式凿子由两个不同的层通过锻焊结合而成（中图）。下层是高碳钢，硬度非常高（通常为 Rc 60 到 65）。虽然这可以保持剃刀般的锋利，但它非常脆。上方焊接了一层软性低碳钢，通过吸收冲击来支撑金属。凿子的背部通常在中间处挖空，使平整工作变得更容易。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_1.png)


    # 基本用法 (Basic use)


    大多数日式凿子在手柄两端都有箍环以防止开裂（底图）。由于刀片厚实且手柄较短，即使是斜刃日式凿子也能承受木锤反复敲击的惩罚。如果你是开始使用，日式凿子有很多（见147页）。![](img/82f8fd51f2b064bbc4df21354d664e50_124_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_3.png)


    # 圆刨刀 (SPOESHAVES)


    虽然圆刨刀在技术上属于刨子，但我把它包含在本章中，因为它经常用于塑形。圆刨刀实际上是一种带双柄的刨子（顶图）。这种短底的设计允许圆刨刀处理普通刨子无法处理的曲线。许多圆刨刀的设计是平底的。


    # 可调节刀片 (Adjustable blades)


    在购买圆刨刀时，我推荐带有可调节刀片的。这种类型的圆刨刀有一对带纹的螺钉插入刀片中，使其上下移动（底图）。这也有助于防止刀片移位![](img/82f8fd51f2b064bbc4df21354d264e50_125_0.png)


    # 拉刨刀 (DRAWKNIVES)


    许多木工永远不会使用拉刨刀（顶图）。它很大、外露，且切割完全由手工控制。但在熟练工匠手中，它可以创造出惊人的效果。我有幸参加过大师 Brian Boggs
    的课程，并对他仅用一把拉刨刀所做的一切感到惊叹。他制作的椅子既舒适又漂亮，他个人保证这些椅子比主人耐用。


    拉刨刀基本上是一个长薄刀片，末端带有圆尾以插入木制手柄（下图）。刀片可以是直的或弯的，手柄有长直的、车型的或小的。


    关于带刃口向上还是向下使用拉刨刀，有很多争议。我觉得哪个感觉用哪个：实验一下哪种方式控制力更好。与许多其他工具一样，斜切会产生更多的切削效果，从而整齐地切断木纤维（中图）。在我看来，拉刨刀的大挑战是磨平背部：将磨石磨在拉刨刀背部并进行小圆周运动。如果刃需要重塑，使用便携式砂带可能比使用磨光机更容易。开光最好是让磨石摩擦刀片背部，而不是刀片摩擦磨石。


