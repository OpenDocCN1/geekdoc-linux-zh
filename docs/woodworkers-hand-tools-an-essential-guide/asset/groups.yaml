    # # SHARPENING SAWS


    I''ve found sharpening a saw very rewarding. It''s a fairly straightforward job
    that takes less than half an hour and produces immediate results.


    between the saw blade and jaws of my shop-made vise (see the sidebar on the opposite
    page). I raise the clamps far enough so that I sharpen each tooth, it leaves a
    tellmark that makes it child''s play to track sharpening progress and allows me
    to concentrate instead of sharpening.


    # Joining the teeth


    The first step in joining a handsaw is to create an even playing field; that is,
    filing all the teeth to the same level so that no tooth does more work than the
    others (top drawing). When this happens, the protruding tooth quickly bulks doing
    most of the work and ends up tearing wood fibers instead of cleanly slicing through
    them. To prevent this, the saw is "jointed" by running a smooth file over the
    tops of the teeth. The simplest way to hold the file perpendicular to the saw
    is to cut a kerf in the block of wood along its length to accept the file. Then
    insert the file in the kerf and set the file on the teeth. Press the scrap into
    the side of the saw and until you can see a bright spot on the tip of each and
    every tooth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_2.png)


    # Setting the teeth


    The next step is to "set" the teeth by alternately bending them away from the
    saw at a specific angle. This is done with a special tool called a saw set, can
    be picked up at any auction for a couple of bucks. Saw sets are adjustable so
    that you can vary the amount of set to match the saw. The general rule of thumb
    is that the set should equal half the thickness of the tooth (middle drawing).
    A saw should be adjusted so that it sets only the one-half of the tooth; and you
    should never reverse the set of tooth, as it will weaken it substantially.


