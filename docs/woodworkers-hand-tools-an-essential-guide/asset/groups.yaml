    ## TRY SQUARES


    Try squares have long been a mainstay of the woodworker. We use them to lay out
    and mark boards for joinery, and to check edges to make sure they''re true square.
    A try square consists of a metal blade and either a wood or metal stock (top photo).
    Most quality wood stocks have the edges faced with brass. Although an engineer''s
    square (see page 19) does the same job as a try square, with a higher degree of
    accuracy, I still like the feel of a handled try square; when accuracy is critical,
    I''ll reach for an engineer''s square.


    A specialized version of the try square is the miter square (inset). It serves
    the same function as a try square, but the blade inset in the stock at 45 degrees
    for checking and laying out miters.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_0.png)


    Photo courtesy of Bridge City Tool Works, copyright 2001


    ## Checking a try square


    Just like any other layout tool a try square isn''t accurate, it''s not much worth.
    We check whether a try square is actually square, place the stock up against a
    known-flat edge (middle-drawing). Draw a line along the blade and flip the stock
    over. Align the blade with the line you just drew—it should be in perfect alignment.
    If not, you''ll have to adjust the stock or the blade by filing it down. (For
    a nifty alternative to this, see the sidebar below.)


    Then Flip Square to Whether Blade Aligns with Line


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_1.png)


    First, Set Square against Edge and Draw Line


    ## ADJUSTABLE SQUARES


    Even though I prefer a try square with a wood stock, these can go out of square
    over time. That''s because the wood in the stock is constantly moving to changes
    in relative humidity. This can loosen the rivets that hold the blade in place.
    Bridge City Tool Works produces a set of adjustable squares designed to get around
    this problem. You can tweak the angle of the blade with an Allen wrench (photo
    at left)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_2.png)


    18 MEASURING AND MARKING TOOLS


    ![](img/82f8fd51f2b064bbc4df21354d664e50_20_0.png)


    ## Checking an edge for square


    The most accurate way to use a square when checking for square is to position
    the blade of the square against the edge of the work-piece (top photo). This lets
    you position the work-piece-so that light can shine through from behind to indicate
    any gaps. The desirable method is to place the blade on the face of the work-piece
    and slide it up until it''s the end of the work-piece (inset). It''s difficult
    to see any gaps this way; avoid it whenever possible.


    ## Accurate marking


    If you''ve ever watched a draftsman in action, you''ll note that he always places
    his pencil at the exact point where he wants to draw a line, and slides the square
    so it butts up against the pencil (middle drawing). This might seem like a no-brainer,
    but over the years I''ve watched a lot of woodworkers just the opposite—set the
    square on the mark and then draw the line. The problem with this is that it doesn''t
    take into account the distance between the square and the center-point of the
    pencil lead.


    ## ENGINEER''S SQUARES


    Engineer''s squares are similar to try squares except both the stock and the blade
    are metal and they''re manufactured to much higher tolerances. I use them whenever
    accuracy is critical, and I''ve found the small size indispensable for checking
    for square. As a matter of fact, the small one shown here is a constant companion
    to the tape measure and 6" metal rule that reside in my apron pockets.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_20_1.png)


    ## LEVELS


    While many woodworkers think of a level as a carpenter''s tool, it has a place
    in every shop. A LEVEL particularly torpedo level is handy for checking that shelves
    are LEVEL cabinets are hung plumb, and work-benches and tools are level (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_21_0.png)


    ## Types of levels


    The most common levels are 3 or 4 feet in length, with bodies made of wood, metal,
    or plastic. Virtually every level has multiple vials, which are curved glass or
    plastic tubes filled with alcohol (hence the name “spirit” level). A bubble of
    air trapped in the vial will always float to the highest point on the curve. Marks
    on each side of the center-point indicate or plumb. While steel I-beam-style levels''
    center level (middle photo) are accurate and lightweight, I prefer the warmth
    of the older wood and brass levels of yesterear (top level in middle photo).


    ## Checking a level


    Can a level go out of whack? You bet. Here''s how to check to make sure your level
    is on level. Place the level on a known-flat surface and mark its location with
    a pencil (bottom drawing). Note the bubble reading on the vials with the pencil
    mark, well and then flip the level.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_21_1.png)


    ## COMBINATION SQUARES


    What do you get when you combine try square, level, miter square, and depth gauge
    into one tool? Most squares come with only 90-degree faces, but some have 45-degree
    and 60-degree faces as well. This makes them very versatile for various woodworking
    tasks.


    The most common use of a combination square is as a square (top photo). It''s
    also used as a miter (middle photo) and a depth gauge (bottom photo). The depth
    gauge can be used to measure the depth of holes or recesses, and the ruler can
    be used for marking out lengths.


    ## As a try square


    Probably the most frequent use of a combination square is as a try square. You
    use the ends of the square to check the square.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_2.png)


    ## As a depth gauge


    Another frequent use of a combination square is as a depth gauge. You use the
    blade of the square to measure the depth of a hole or recess. This is particularly
    useful for marking out tenons or other types of joinery.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_0.png)


    ## Parallel lines


    By far the most common reason I reach for a combination square is that I need
    to mark out a line parallel to an edge or a series of lines. The combination square
    really excels here. Say, for instance, you want to lay out a series of lines on
    a fireplace mantel you''re going to carve flutes. Just set the blade the desired
    distance from the edge of the work-piece, lock it in place, and then butt the
    head against the edge of the work-piece (top photo). You''ll note there''s a small
    notch centered in the end of the metal rule; this is for your pencil. Position
    the pencil in the notch, and while holding it firmly in, slide the square along
    the edge of the work-piece, keeping steady pressure on the head.


    ## PARALLEL LINES WITHOUT A COMBINATION SQUARE


    If you don''t have a combination square and need to lay out parallel lines, here
    are a couple of ways to do it. I had an old-timer woodworker friend who could
    mark parallel lines with just a pencil with unbelievable accuracy. He''d hold
    the pencil in his hand and use his fingers as a stop to position the pencil where
    he needed it (top photo at right). He''d been doing this for so long, he could
    hit a mark within V/32''. Although I''m not accurate, I often use this method
    when I''m marking out a detail that doesn''t require absolute precision, like
    the chamfer around the edge of a table top.


    If you''ve got a lot of parallel lines that need to be precise, consider constructing
    a simple shop-made square (bottom photo). It''s just a block of wood that''s notched
    the desired distance from the edge. A kerf in the end of the scrap accepts a pencil
    to draw uniformly accurately


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_2.png)

