    there are a couple of tool-makers that produce tools of exceptional quality: Bridge
    City Tool Works and Lie-Nielsen Tools. Both of these companies manufacture what
    I consider to be premium tools in small batches under tight tolerances, using
    the finest of materials. By simply picking up one of these fine tools, you''ll
    immediately notice a difference in heft, balance, and finish—the tool fits well
    in your hand, and the finish is extraordinary.


    no no further than Lie-Nielsen Toolworks (www.lie-nielsen.com). The hand planes,
    scrapers, and saws that Tom Lie-Nielsen manufactures in his Warren, Maine, factory
    are a joy to use just Bridge City, Lie-Nielsen uses the finest materials, as manganese
    bronze for many of his casings and thick Rockwell 60-62 high-carbon tool steel
    for his blades. Yes, they''re expensive, but well worth it.


