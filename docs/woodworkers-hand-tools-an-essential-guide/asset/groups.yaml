    # CLAW HAMMERS


    When most folks envision a hammer, they think of a claw hammer. And many believe
    a claw hammer is a claw hammer, right? Not true. There many different kinds of
    claws hammers available. For the most part, they can be divided


    into two types: those with curved claws, and those with straight claws (tap drawing).
    Curved hammers are by far the most common, and they are particularly adept at
    removing nails. Straight-claw hammers are more common in construction work, where
    the straighter claws are commonly used to pry parts apart. What a straight-claw
    hammer gains in demolition work, it loses in nail-pull efficiency.


    But there''s more of claw hammers than the curve of the claw. The weight and handle
    (see the sidebar below) will also have a huge impact on how well the hammer performs.
    Weights range from a 7 ounces up to a 28 ounces; the most common is 16 ounces.
    Heavier hammers are mostly used in construction by experienced frames, who can
    drive a 16 nail into two or three strokes. A heavy hammer will drive nails faster,
    but it will also wear out faster; these industrial-strength tools are best left
    to professionals.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_142_0.png)


    # HANDLE OPTIONS


    +   Hammer handles have come a long way from the old hickory handles of my grandfather''s
    hammer (photo at right). That''s not to say wood handles aren''t still used. They''re
    still very popular, especially because of their excellent flexibility and shock-absorbing
    characteristics. The big disadvantage to a wood handle is simply that the wood—and
    wood constantly reacts to changes in humidity. Over time, the handle will loosen
    and need to be tightened or replaced. Wood handles can also fray and split under
    heavy use.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_142_1.png)


    So it''s no surprise hammer manufacturers have been looking for a better handle.
    Two popular material choices are metal and fiberglass (or some other plastic composite).
    Both of these hold up under heavy use


    ![](img/82f8fd51f2b064bbc4df21354d664e50_142_2.png)


    ASSEMBLY TOOLS


