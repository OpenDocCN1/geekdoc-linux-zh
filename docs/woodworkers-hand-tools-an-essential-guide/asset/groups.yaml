    # BEVEL-EDGED

    CHISELS


    When I say "chisel," the image that pops

    into woodworkers'' minds is a bevel-edged

    chisel like any those shown in the top photo.

    It''s ironic that these chisels have been marketed

    so long as bevel-edged that most people don''t

    realize that these are actually firm chisels.

    What''s really odd is that many woodworkers

    think that firm chisels are a completely differ-

    ent type of chisel. A bevel-edged chisel where the edges have

    beenveled up toward the

    top of the blade.


    As I mentioned earlier,

    the advantage to beveling

    t edges is that this pro-

    duces a chisel more adept at

    fitting into tight places,

    such as when removing the

    waste or trimming between

    dovetails (middle photo). This

    same slim profile allows a

    bevel-edged chisel to trim

    sliding dovetails (bottom

    photo) and other hard-to-

    reach places. The downside

    to beveling the edges is that

    itit removes metal that would

    normally soften the chisel.

    This makes bevel-edged chisels more

    suitable for delicate work. I have occa-

    sionalmente take a mallet to mine, but if

    I''ve got a lot of wood to remove, I gener-

    ally use a square-edged firmer chisel or

    mortise chisel. Bevel-edged chisels can

    be purchased individually or in sets, in

    widths ranging from 1/8" up to 2". The

    most common sets consist of six chisels:

    1/8", 1/4", 3/8", 1/2, 3/4", and 1".


    ![](img/82f8fd51f2b064bbc4df21354d664e50_111_0.png)'
  - '[PAGE 112]


    # HANDLE VARIATIONS


    I bought my first set of quality chisels from a mail-order catalog. I picked a
    set with blades made from Sheffield steel and what looked like comfortable handles.
    The second I unpacked one and held it in my hand. I knew that it didn''t feel
    right. But being a novice, I figured the manufacturer knew they were doing and
    it must be me. So I kept them—and used them for many (uncomfortable) years. What
    a bonehead!


    It wasn''t until I was visiting a woodworking buddy that I saw the light. My friend
    was cutting a set of dovetels in wide planks for a blanket chest he was building
    for his daughter. I commented on his well-worn chisels, and he handed one to me.
    I couldn''t believe how good it felt in my hand. The balance was near perfect;
    the handle fit so well in palm that it felt like an extension of my hand. So this
    is what a chisel should feel like, I thought.


    I decided then and to always trust my first impression of a tool. I should have
    sent that first set back and ordered else. Better I should have visited a woodworking
    store and tried each brand until I found the best fit. I realize this might sound
    excessive, but chisels are some of the most-oftenused hand tools in my shop. They
    really should mold to your hand and the material used matters of personal preference.


    I have four sets of chisels in my shop: a set of large, stout mortise chisels;
    a set of metal-handled (virtually unbreakable) firmer chisels for heavy work;
    a set of Marples "blue chip" bevel-edged chisels for rough paring and shaping;
    and an exquisite set of bevel-edged Japanese chisels for all my fine work (fitting
    joints, dovetails, etc.). I also have a few specialty chisels, but the bulk of
    the work is done with these four sets.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_112_0.png)


    | SOCKET | ONE-PIECE PLASTIC | ROUND LONDON PATTERN | BOXWOOD CARVING PATTERN
    | MORTISE |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_112_1.png)


    SHAPING TOOLS 111'
  - '[PAGE 113]


    # GRIPS


    There are three widespread grips used with chisels: underhand, overhand, and the
    blade grip. Each may be used to cut a single joint.


    # Underhand grip


    I use the underhand grip most often when I''m making a paring cut. With this grip,
    the handle of the chisel rests in the palm of one hand while the other hand guide
    the blade (*top photo*). As you lean forward, the blade begins to pare. At any
    point, you can quickly stop the cut by “pinching” the blade with your fingers.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_0.png)


    # Overhand grip


    The overhand grip is especially useful for vertical par cuts, such as when cleaning
    out a shoulders of a mortise or trimming the trimmers (*middle photo*). One hand
    wraps around the chisel (typically with the thumb resting on top), and the other
    hand guides the blade. This grip lets you get your shoulder and weight into the
    cut and works especially when trimming stubborn end grain.


    # Blade grip


    Another grip I often use is the blade grip (*bottom photo*). Here, I grip the
    chisel by only the blade so that I can use my other hand for the mallet to drive
    the chisel. This grip lets me position the chisel tip with pinpoint accuracy.
    Another version of the blade grip is the slicing cut, shown in the bottom photo
    on the opposite page.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_1.png)'
  - '[PAGE 114]


    # BASIC CHISEL TECHNIQUE


    Whatever chisel work you''re planning, the first step is to secure the workpiece.
    For light work, such as paring, you can just clamp the workpiece in your bench
    vise. But if you''re doing heavier work (especially like chopping mortises), clamp
    the workpiece to the top of the bench. For the best support, to position it directly
    over (or as close as possible to) the legs of the workbench (top photo). This
    helps dampen vibration and prevents the workpiece from bowing under heavy blows.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_114_0.png)


    # Support block


    For chisel work where you''re paring the full width of the workpiece, or through
    the workpiece, you should always insert a support block under it (middle photo).
    A support block not only protects your workbench from certain damage, but also
    helps prevent tear-out by solidly supporting the wood fibers where the chisel
    exits the work.


    # Slicing cut


    Although I''ve always considered a slicing cut to be one of the more basic chisel
    techniques, I rarely see it being used. This specialized form of the blade grip
    should be in every one''s bag of tricks. I use two forms of this cut. With one,
    I grip the blade almost like pare away wood (top photo on page 16). With the other
    form, I grip the blade with one hand and use the other as a fulcrum. This way,
    I can pivot the chisel into the workpiece, such as when slicing a dowel flush
    with a surface (bottom photo). Either way, it''s a great grip.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_114_1.png)'
  - '[PAGE 115]


    # TRIMMING

    TENONS


    A common paring task for a chisel is trimming or cleaning tenons for a mortise-and-tenon,
    a slip joint, or a stub-tenon-and-groove joint. There are a couple of critical
    areas of the tenon that usually need attention: the cheeks and the shoulders.


    # Cheeks


    The first thing I do when fitting a mortise-and-tenon joint is to check the fit
    of the tenon in the mortise. Since it''s always better to have a tenon that''s
    too big (if it''s too small, you''ll need to rec it), the tenon will often require
    a little paring to fit snugly. I use a wide chisel for this and an underhand grip
    to pare away the excess (top photo). Start at one end and use the lip created
    by the chisel to reference the next cut. Take light cuts and check the fit often.


    # Shoulder


    Once the tenon fits into the mortise, that''s left is to make sure the joint fits
    snugly with no gaps. Even when you''re careful cutting a tenon, it''s easy to
    end up with a "stepped" shoulder. To clean up the shoulders, start by taking light,
    horizontal paring strokes to clean out the intersection of the cheek and shoulder
    (middle photo). A long time ago I learned the value of "undercutting" the shoulders.
    That is, instead of making a 90-degree cut, I just start inside the shoulder (around
    1/16") and tilt the chisel slightly (bottom drawing). This undercuts the shoulder
    and virtually eliminates any fitting problems.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_115_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_115_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_115_2.png)'
  - '[PAGE 116]


    # CLEANING OUT MORTISES


    The other half of a mortise-and-tenon joint, the mortise, often requires some
    "tweaking" after it has been cut. If you''ve cut the mortises by hand, I usually
    need to tweak the tenons for a good fit. If you use a machine, you may need to
    do a little or a lot of work. If the mortises are router-cut, they''ll likely
    only need the corners squared. Ifyou drilled them out, you''ve got considerable
    work to do.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_0.png)


    # Sides


    To clean up the sides of a mortise, choose a sharp chisel that is fairly wide
    (top photo). Take care to keep the chisel vertical (a guide block clamped to the
    workpiece helps), and take light cuts. Skewing the chisel also produces a cleaner
    square.


    # Ends


    Mortise ends often require paring, either to size the mortise correctly or to
    square up corners (middle photo). Although a lot of folks advise using a chisel
    that''s the same width as the mortise for, I''ve had better luck with one that''s
    slightly narrower. This way the chisel doesn''t get jammed between the sides,
    and you don''t have to rock it to get it out. Rocking like that can enlarge the
    mortise, creating a sloppy fit.


    # Bottom


    The bottom of a mortise is a difficult area to clean up, since access is limited
    by the sides and ends. The best way I''ve found to do this is to use a chisel
    with the bevel up and take light, scooping cuts (bottom photo). Avoid the temptation
    of using the top edge of the mortise as a fulcrum point for the chisel: You''ll
    only crush this edge and end up with a weaker joint.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_1.png)'
- md: '

    # TRIMMING GROOVES


    In addition to cleaning up mortises and tenons, I routinely use a chisel to fine-tune
    grooves, rabbets, dados, and other joints.


    ## Paring sides


    One of the more common paring tasks is removing just a bit of material from the
    side of a groove or other joint. Whenever possible, I use the blade for this and
    take a slicing cut (top photo). This offers a couple of advantages over the more
    conventional vertical paring stroke. First, skewing the blade creates a cleaner
    shearing cut. Also, it makes it easy to slide the flat back of the chisel along
    the side of the groove or dado as a steady starting point. This way you start
    with a very light cut and ease into the waste.


    ## Ends of the groove


    Whether a groove is cut by hand or by machine, there''s often a tendency for the
    final few inches of the groove to be incorrect depth. This can be caused by letting
    up a spinning bit or blade, or passes over the workpiece as it goes by easing
    pressure near the end of a cut made by hand. I use an underhand cut and pare away
    the waste with a series of light cuts (middle photo). See page 121 for a handy
    tip on using a gauge block to gauge the depth accurately.


    ## Cleaning up the bottom


    Cleaning up the bottom of a groove is fairly straightforward. Here again, flip
    the chisel to the bevel is below, and run it along the bottom (bottom photo).
    Inverting the bevel like this prevents it from catching and digging into the groove.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_117_0.png)


    ## FIRMER CHISELS


    Firmer chisels are general-purpose woodworking chisels that are some of the workhorses
    of any shop (top photo). When most woodworkers think of firmer chisels, they envision
    rather stout, square-sided chisels like those shown in the top photo. But bevel-edged
    chisels (see page 110) also are firmer chisels—their sides are tapered toward
    the top. Most firmer chisels have blades roughly 4" long and in widths varying
    from 1/8" up to 2". The handles may be wood or plastic.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_0.png)


    ## Profile


    The basic difference between a firmer chisel and a bevel-edged firmer chisel is
    its profile (middle drawing). The square sides of firmer chisel create a strong
    blade that''s fully capable of handling light to moderate blows. The advantage
    of beveling the edges is it gives greater access when trimming joints like dovetails.
    The downside to this: The blade is not as stout as a standard firmer chisel, and
    a mallet should be used sparingly and lightly with this more delicate chisel.


    | Bevel-Edged Chisel | Firmer Chisel |

    | :--- | :--- |


    ## Anatomy


    A firmer chisel consists of three parts: blade, handle, and ferrule. In most cases,
    the blade has a tang that fits into a hole drilled in the end of the handle (bottom
    drawing). The ferrule (often brass) helps prevent the handle splitting if the
    chisel is struck with a mallet. Registered chisels are often confused with firmer
    chisels because they look alike. This is how you tell: A registered mortise chisel
    typically has a thicker blade and a ferrule on the end of the handle to prevent
    "crowning," or mushrooming of the handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_1.png)


    ## MORTISE CHISELS


    Mortise chisels are distinguished by their thick, beefy blades and stout handles
    (tap photo), both designed to handle the heavy mallet blows associated with chopping
    mortises by hand. The blades are thicker for another—less obvious reason: The
    wide blade helps guide the chisel and keep it square to the sides of the mortise
    as it''s being cut. This is a big plus, because it makes the chisel almost self-guiding
    once the sides and ends of the mortise are established. It''s another reason why
    this is absolutely the tool of choice for cutting mortises by hand.


    ## Handle options


    There are two basic options available for mortise chisels: tang-mount and socket-mount
    (bottom drawing). With a tang-mount, the tang on the end of the handle fits into
    a hole drilled into the end of the handle. Generally a leather washer is added
    between the base of the blade and the handle to serve as a shock absorber. On
    socket-style mortise chisels, a tenor is turned on the end of the handle to fit
    into the socket of the blade. The disadvantage of a tang-style mortise chisel
    is that repeated blows will tend to drive the tang deeper into the handle. Even
    with ferrules installed at both ends of the handle, the tang will eventually make
    the handle split. This rarely happens with a socket-style chisel.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_119_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_119_1.png)


    The first time I chopped a mortise by hand, it was a disaster. I used a small,
    bevel-edged chisel that was relatively dull (I hadn''t quite figured out sharpening
    yet). After half an hour of pounding on that poor board, I had a lopsided hole
    that looked more like a crater than a mortise. The width varied, the sides were
    rough, and the bottom was a jumble of torn sliwood. I had made three mistakes;
    I was using an improperly sharpened tool, I was using the wrong tool (I should
    have used a stout mortise chisel), and I was using the wrong technique.


    1/8


    ## STEP 1: DEFINE THE ENDS


    Decades later, I find chopping mortise by hand a pleasure--really. Sure it''s
    a bit physical, but it''s very rewarding. I often hand-chop a mortise if I''ve
    got only a few to make. It''s actually quicker than going through the whole machine
    setup and cut-bust business.


    ## Define the ends and remove waste


    ![](img/82f8fd51f2b064bbc4df21354d664e50_120_0.png)


    After you''ve laid out the mortise and clamped the workpiece to your bench (preferably
    over a leg), start by defining the ends. Position the chisel 1/8" from the layout
    line (I''ll explain later). Drive the chisel vertically so the bevel is down,
    and run it along the bottom (bottom photo). Inverting the bevel like this prevents
    it from catching and digging into the groove. Next, tip the chisel so the bevel
    is down, and remove the waste (bottom drawing). Once you''ve reached the desired
    depth, use an underhand cut and pare away the waste with a series of light cuts
    (middle photo).


    ## STEP 2: REMOVE CHIPS


    ![](img/82f8fd51f2b064bbc4df21354d664e50_120_1.png)


    ## STEP 3: REMOVE WASTE AT BOTTOM


    ![](img/82f8fd51f2b064bbc4df21354d664e50_120_2.png)


    SHAPING TOOLS 119


    ## STEP 4: CLEAR WASTE TO OPPITE END


    Continue removing waste from the bottom, working your way toward the opposite
    end. Take light cuts and pry out the waste (top drawing). ShopTip: For a simple
    depth gauge, wrap a piece of tape around the blade of the chisel.


    ## Finish cuts


    Once the full width of the mortise is complete, you can make your finish cuts
    to the ends. By now you''ve figured out why it''s important to level 1/8" or so
    on the ends of the mortises while you chop out the majority of the waste. Even
    when you''re careful prying out the waste, there''s a tendency to use the top
    edge of the mortise as a fulcrum for the blade. The result is that this edge gets
    crushed. If the mortises are stopped, the tenon will cover this, but the joint
    won''t be as sturdy as it could be. But if the mortise is a through mortise, this
    will be highly visible. Leaving a bit of waste to be trimmed away as a final step
    yields clean, crisp edges (middle drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_121_0.png)


    ## STEP 5: MAKE FINISH END CUTS


    # TIGHTENING A LOOSE HANDLE


    Since mortise chisels really do take a beating, the handles can and come do loose
    occasionally. When this happens, here''s an easy way to fix it. Whether the blade
    fits into the handle with a tang or a socket (as shown here), you can insert a
    small wood shim or two to take up the slack (left photo). Then simply hammer the
    handle back on. Another method that works well on sockets is to wrap a curled
    wood around the "tenon" of the handle before driving the handle back in place.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_121_1.png)


    120 Shaping Tools

