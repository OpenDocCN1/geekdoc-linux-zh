    Although there are many rules of thumb selection, I''ve found that I only need
    two for smoothing. I start with 150-grit and finish with 220. This is possible
    because I don''t expect the sandpaper to do what I should have done with a plane
    or a scraper. Instead of sanding any imperfection with a power sander, I''ll remove
    it with a plane or scraper. Many woodworkers don''t realize that it''s actually
    faster. The side of sandpaper from rubbing against itself which will dull it before
    you even have a chance to use it.


    ## Sanding block


    I also strongly recommend a sanding block, especially if you''re working on a
    flat surface. A sanding block helps distribute pressure and reduces hand fatigue
    (bottom photo on opposite). Although you can choose many sanding blocks with complicated
    levers and fancy holds, I''ve always felt a scrap of wood or cork block wrapped
    in sandpaper works well. You can quickly change and even modify the block to make
    it better for the job at hand. As with any, making sure to sand with the grain
    to prevent cross-grain scratches. Also, clean the sandpaper by removing it from
    the sanding block and giving it a sharp rap on the edge of your workbench.


    ## Hand-sanding


    If you''re planning on sanding by hand, getting a standard 9" sheet in half across
    its width and folding it in thirds, as in the middle drawing on the opposite page.
    This creates three separate surfaces that can be folded over until the two sides
    wear out. Just important, folding the paper like this prevents the paper from
    rubbing against itself.


    ## SANDING PLATE


    Years ago, the folks at Sandvik came with a terrific product called a sanding
    plate (photo at right). It''s basically a serrated metal plate that works sort
    of like a cheeseater for wood. Precision holes are punched in the hardened steel
    to create tiny, volcano-like craters with sharp edges (drawing at right). Since
    these holes are made with much accuracy the resulting plate performs like various
    grades of sandpaper, but it doesn''t wear out and rarely, the sanding plate is
    cut into different shapes and sizes and is attached to plastic handles—some in
    the form of a sanding block, others like files. When the plate finally wears out,
    you can strip it off and slap on a replacement plate.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_106_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_106_1.png)


