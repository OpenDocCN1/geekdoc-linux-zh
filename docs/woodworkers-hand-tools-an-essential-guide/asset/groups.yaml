    # ACKNOWLEDGMENTS


    For all their help, advice, and support, I offer special thanks to:


    - Christopher Vendetta, ace photographer, for taking such beautiful photographs
    in less than desirable conditions (my dusty workshop) and under such tight deadlines.

    - William Warner, antique tool aficionado, for allowing Chris and me to come into
    his home and photograph just a tiny portion of his incredible collection. All
    of the luscious tools shown in each chapter are from his collection.

    - David, with American Tool Companies, Inc., manufacturers of such trusted names
