    # PARING CHISELS


    A paring chisel is similar in appearance to a firmer chisel except the blade is
    much longer (top photo). The blade on a firmer chisel is usually around 4" to
    4/2" long, while the average paring chisel blade is 7" to 8" long (bottom drawing).
    This type of chisel was a standard item in a cabinetmaker''s tool chest, but it
    was largely replaced by the electric router.


    The long blade of a paring chisel is perfect for trimming the bottoms of grooves
    and dados to cut shelves and other carcass parts. Once the router entered the
    scene, with its ability to cut perfectly flat-bottomed grooves, the paring chisel
    began to disappear.


    Because the blade of a paring chisel is so long, it''s fairly fragile, and a mallet
    should never be used. Hand pressure is all that is suitable for paring chisels.
    If you plan to use a paring chisel to flatten the bottom of a groove, consider
    making a gauge block to accurately hold the blade at the desired height (middle
    drawing). Occasionally, you can find a paring chisel with a "crank" where the
    handle is offset from the blade (bottom chisel in bottom drawing). This lets you
    pare with the blade flat against the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_0.png)


    Groove


    Gauge Block


    Handle


    Bevel-Edged Blade


    SOCKET STYLE


    Handle


    Brass Ferrule


    Firmer Blade


    Tang


    TANG STYLE


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_3.png)


    # CORNER CHISELS


    A corner chisel is a special type that has two cutting edges that meet at a perfect
    90-degree angle (top photo). NOTE: The chisel shown here is available from Lie-Nielsen
    Toolworks (www.lie-nielsen.com). Corner chisels are used to square up the corners
    of a mortise after most of the waste has been removed. Because these chisels are
    challenging to sharpen, I use mine only for the finishing cuts. This way the edge
    lasts longer than I used it to remove a lot of waste. Granted, this tool isn''t
    for everyone; but if you cut a lot of mortises—especially mortises—you’ll really
    appreciate this tool. Since I build a lot of Craftsman-style furniture with exposed
    joinery, a corner chisel comes in quite handy.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_0.png)


    # Two cutting edges


    Look closely at the business end of a corner chisel: You’ll find flat faces on
    the exterior of the blade and a notch ground the inside to create two cutting
    edges (middle photo). These edges are honed to create both a razor-sharp tool
    and a sharpening challenge. You can sharpen this tool with a standard stone; you''ll
    need slipstones or better yet, small diamond specifically. I suggest maintaining
    the edges by giving each a couple of strokes with a diamond hone before every
    use.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_123_1.png)


    # Basic use


    The key to using a corner chisel effectively is to take light, paring cuts and
    make sure to hold the chisel perfectly vertical (bottom photo). I often clamp
    a square-scrap block to the workpiece to help guide the chisel in straight. Stop
    often and clean out the waste. If you''re cutting through a mortise, it''s best
    to cut halfway the piece, and continue from the other side.


    SHAPING TOOLS


    # JAPANESE CHISELS


    My Japanese chisels are absolutely a joy to use. With their wood handles and short
    blades, they balance perfectly in my hand. The special laminated-steel construction
    creates a blade that is easy to sharpen yet maintains a keen edge (top photo).
    How can they offer so much in such a small package? For starters, the construction
    of Japanese chisels differs considerably from that of their Western cousins.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_0.png)


    # Bi-metal blades


    Unlike the blade of a Western chisel, which is forged from a single piece of steel,
    a Japanese chisel is made from two distinct layers that are forge-welded together
    (middle drawing). The lower layer is a high-carbon steel that''s very hard (typically
    Rc 60 to 65). Although this can maintain a razor edge, it''s quite brittle. A
    mild low-carbon layer is welded on top of to support the metal by absorbing impact.
    The backs of the chisels are often hollowed out in the center to make flattening
    easier.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_1.png)


    # Basic use


    Most Japanese chisels have ferrules on each end of the handle to prevent splitting
    (bottom drawing). Since the blades are stout and the handles are short, even a
    bevel-edged Japanese chisel can take the punishment of repeated blows from a mallet
    or Japanese hammer (see page 147). There is a huge range in quality and cost for
    Japanese chisels. If you''re starting out with a less-expensive set.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_3.png)


    # SPOKESHAVES


    Although spokeshave is technically a type of plane, I''ve included it in this
    chapter because it''s often used for shaping. A spokeshave is really a double-handled
    plane with a very short sole (top photo). This short sole is what allows the spokeshave
    to navigate curves that an ordinary plane couldn''t handle. There are a number
    of spokesaves common being the flat-bottomed sole. This is a good, all-purpose
    shaping tool. Other specialty spokesaves include those with curved sole. Originally
    designed to shape wheels, spokesaves still find a home in many shops.


    # Adjustable blades


    When you''re shopping for a spokeshave, I recommend the one with an adjustable
    blade. This type of spokeshave has a pair of knurled knobs that slot into the
    blade to move it up and down (bottom drawing). This also helps prevent the blade
    from shifting out of position.![](img/82f8fd51f2b064bbc4df21354d664e50_125_0.png)


    # DRAWKNIVES


    Many woodworkers will never use a drawknife (top photo). It''s big, exposed, and
    the cut is totally hand-controlled. But in the hands of a skilled craftsman, it
    can do amazing things. I had the pleasure of sitting in a class with master maker
    Brian Boggs and was simply amazed at what he could do with just a drawknife. He
    makes exquisite chairs that are as comfortable as they are beautiful, and he personally
    guarantees that they''ll outlast the owner.


    A drawknife is basically a long, thin blade with tangs on the ends that are bent
    to fit into wood handles (bottom drawing). The blade can be straight or curved,
    and handles are long and straight, turned, or even small.


    There''s a lot of debate over using a drawknife with the bevel up versus down.
    I say, what feels best: experiment to find which gives you better control. As
    with many other tools, the skewed cut will produce more of a shearing cut to cleanly
    cut wood fibers (middle photo). In my opinion, the big challenge to a drawknife
    is sharpening the back: Rub a sharpening stone on the back of the drawknife in
    small, circular strokes. If the bevel needs reshaping, it may be easier to use
    a portable belt sander than a grinding wheel. Honing is best done by rubbing the
    stone on the back instead of the blade on the stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_126_0.png)


    Tang


    Blade


