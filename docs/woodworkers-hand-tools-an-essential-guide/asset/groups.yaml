    Move Frog Forward or Throat Plate Backwards

    to Decrease Opening


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_2.png)


    # Pencil tip


    Now you''re ready to plane.

    But before you do, consider this

    simple tip to help you clearly see

    where you have and haven''t

    planed. Rub the lead of a pencil

    lightly over the edge or face of

    y work-piece (bottom photos). As

    y plane, you''ll be able to readily

    check your progress.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_3.png)'
  - '[PAGE 69]


    Hand-planing is hard work: enjoyable, but if you''ve ever tried planing a board
    with arm strength alone, learned quickly that planing is a whole-body task. Your
    legs are just as important as your arms. Take a stance centered on the board,
    where your legs are spread bit wider than your shoulders, with knees slightly
    bent (top photo). Though you''ll want to maintain firm, even pressure on the plane,
    take care to hold the knob and handle with a light grip: If you use a "white-knuckle"
    grip, your hands will tire.


    # Start the cut


    Before you begin to plane a board, take a moment to "read" the grain. Look at
    the edge of the board, and clamp it to the bench so that the grain will be sloping
    down and towards the body of the plane. Set the plane on the work-piece so the
    body extends off the board with the blade just in front of the leading edge of
    the board (middle drawing). Press down on the front knob, and push the handle
    steadily with your other hand.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_0.png)


    Press Down on Front Knob


    # Complete the cut


    As the plane passes over the end of the board, continue to press down on the knob
    while pushing forward and down on the handle (bottom drawing). As the blade nears
    the end of the board, lessen the pressure on the knob and concentrate on pressing
    down on the handle as you continue to push the plane forward.


    Push


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_1.png)


    Press Down on Handle Only at Finish


    Press Down on Handle and Knob As You Push Forward


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_2.png)'
  - '[PAGE 70]


    ![](img/82f8fd51f2b064bbc4df21354d664e50_70_0.png)


    # SMOOTHING

    A PANEL


    One of the most frequent reasons I reach for my jack plane is to smooth a panel
    that''s been glued up from several boards. Even with careful prep and clamping,
    there is almost always an edge that needs to be knocked off or smoothed out.


    # Skew cuts


    To quickly remove high spots, skew the plane at a slight angle (top photo). Skewing
    the plane also produces more of a slicing cut and has less of a tendency to tear-out.
    The disadvantage to skewing is that you effectively shorten the body; this means
    it will follow surface undulations instead of removing them.


    # Go with the grain


    As mentioned earlier, you always want to plane with the grain to avoid chipping
    and tearing out (middle photo). Although this sounds simple, it can be a real
    challenge, depending on the wood. The grain pattern on any single board can (and
    often) change direction over its length. This is compounded in a panel glued up
    of several boards, where the grain direction can be haphazard. Take the time to
    read the panel carefully, and make pencil marks directly on the panel grain direction.
    Alter your planning to compensate.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_70_1.png)


    # Light finish cut


    Once the panel is flat, adjust the plane for a fine cut (see page 67) and then
    take a series of light passes over the entire surface to create a panel as smooth
    as a baby''s bottom (bottom photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_70_2.png)'
  - '[PAGE 71]


    ![](img/82f8fd51f2b064bbc4df21354d664e50_71_0.png)'
  - '[PAGE 72]


    I''ve always found that jointer planes do a better job of flattening or smoothing
    thin stock than smaller planes. That''s because the long body of the plane often
    applies pressure over the entire length of the work-piece when planing. This helps
    prevent the thin work-piece from buckling under planing pressure. For really thin
    stock, I temporarily attach the wood to a flat base (typically MDF) with double-sided
    carpet tape (top photo). Cover the entire underside with tape—any gaps can allow
    the stock to deflect, resulting in a scalloped cut. Shop-Tip: To free the thin,
    delicate stocks from the base, drizzle some lacquer thinner over the work-piece
    and let it seep under. The lacquer thinner will dissolve the adhesive, letting
    up the thin stock without breaking it.


    # Edge-jointing


    One of my favorite uses for a jointer plane is to join edges of boards to be glued
    up (middle photo). There''s just something satisfying about watching a 4- or 5-foot
    continuous shaving curl out of the top of the plane. One of the challenges here
    is that you need to walk with the plane as you work. The trick is to keep your
    elbows locked at the same height as you move your body alongside the plane. With
    a little practice you''ll find that is a very natural motion.


    # LOW-ANGLE PLANES


    Patterned after the Stanley No. 62 low-angle plane, the low-angle jack plane shown
    here is manufactured by Lie-Nielsen Toolworks, Inc. (www.lie-nielsen.com). It''s
    sort of a hybrid of a low-angle block plane and a jack plane. It took only a few
    passes with this beauty for me to realize it would become one of my favorite planes.
    It works extremely well on squirrelly and troublesome grain, I''ve even used it
    to plane the end grain when making raised panels with no shoulder.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_2.png)'
