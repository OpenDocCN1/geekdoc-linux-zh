    # INTRODUCTION


    My love of tools began when my mom gave me a tool set for my sixth birthday. You
    may even know it—the classic Popular Mechanics blue-handled tools in the wood
    case. Man, I loved that set. Even though it was much bigger than me, I tore around
    the house "fixing" things. The first things I "fixed" was a coffee table in the
    front room that was too high for me. Out came the ruler to carefully measure 6"
    up from the bottom of each leg. Then I used my own saw to lop off each mark: a
    lot of work, but I was the "man" for the job. Heck, I sanded the bottom of each
    leg before flipping the table over (no simple task when you).


    and 11,I received my first power tools, a Black & Decker jigsaw and finish sander
    (now collectors'' items; still I have, them). Now I have a fully equipped shop
    that rivals Norm''s, I still love my hand tools and use them every chance I get.
    Occasionally, I''ll build something completely by just to slow things down. Working
    with hand tools is always a joyful experience that I don''t get from power tools.
    It''s very personal—the feel of the wood as it responds to the edge. There''s
    nothing quite like it.


    Mom, needless to say, was not impressed. The saw went away. Over the next few
    weeks, so did almost everything, one tool at a time, until I was left with a ruler
    and a try square (do you know how much heat is inside a toaster?). Anyway, my
    passion for tools was so strong and so obvious that I often received tools instead
    of gifts as at Christmas or birthdays. My brother Jim gave me my first real toolbox:
    a blue metal union-made box. I still have it. At ages 10


