    # WATERSTONES


    I can''t imagine woodworking without my waterstones. To me, they''re far superior
    to or other stones because they cut so fast to quickly produce a keen edge. Although
    you can still purchase natural Japanese waterstones, their high cost is usually
    prohibitive. In recent years, man-made waterstones that are much cheaper have
    hit the market. The stones I''ve been using for a while now manufactured by Norton
    (www.nortonabrasives.com). I like these because they''re wide enough to handle
    my widest plane blade and plenty long (8"x3''). They''re available in four grits:
    220, 1000, 4000, and 8000. I use the 220-grit stone only for shaping or repairing
    a nicked damaged blade.


    For waterstones to work effectively, they need to be thoroughly saturated. You
    should soak a waterstone in water for at least 10 minutes prior to use (top photo).
    As you use the stone, it''s important to keep the surface wet to prevent metal
    particles from becoming lodged in the surface (middle photo). I keep water at
    hand and dip my hand in periodically to drip addition on the stone.


    Since I''m continually sharpening my tools, I prefer to store my stones in water.
    This way they''re always ready to use. A plastic storage box with a tight-fitting
    lid works well for them. ShopTip: To eliminate the possibility of mold or mildew
    growing in the box, add a capful of household bleach to the box every time you
    change the water (bottom photo). Caution: Be careful not to leave your stored
    stones in an unheated garage. If the water freezes, the stones will crack and
    you''ll end up with really expensive slipstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_178_0.png)


    SHARPENING TOOLS'
  - '[PAGE 179]


    # GRINDING

    WHEELS


    When a tool edge damages or needs to be reshaped, an electric or hand-powered
    grinder is for the job. The problem many woodworkers have with power grinding
    is twofold. First, most grinders at 3450 rpm is just too fast. Even with the right
    wheel this speed can quickly remove the temper from a tool rendering it useless.
    Recently slower-rpm grinders (1800 rpm) have become available and are well worth
    the extra money. The second problem is that wheels standard on most grinders are
    like the blades that on power saws—they''re useless. These wheels are usually
    very course and hard. They''ll burn an edge in seconds. Take them off and replace
    them with wheels intended for use in sharpening tools.


    What you''re looking for is basically the Japanese waterstone equivalent in a


    wheel: The wheel needs to be soft and fine and have a fairly open coat. Like a
    waterstone, this will cut aggressively but wear quickly. I''ve used a Norton 80-grit
    aluminum-oxide wheel successfully for years. It removes a lot of metal in a hurry
    while minimizing the risk of burning—a great all-purpose sharpening wheel (wheel
    in the top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_1.png)


    # WHEEL DRESSERS


    With use, the surface of any grinding wheel will clog up metal particles. This
    happens wheel loses its cutting ability and needs to be ''dressed'': that is,
    scraped to reveal a fresh grinding surface.


    There are a number of wheel dressers on the market just for this job. Two of the
    more common are the abrasive stick(photo at far right) and the star-wheel dresser(photo
    near right). I use an abrasive stick more often than my star-wheel


    dresser, as it leaves a smoother surface. To true up an out-of-round wheel, I
    have a diamond dresser resembles a ballpoint pen except its tipped with a 74-carat
    industrial diamond. These are available from most woodworking catalogs and cost
    less than $20.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_3.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_4.png)'
  - '[PAGE 180]


    # HONING

    GUIDES


    A honing guide is designed to rigidly hold a tool at a- constant angle for honing.
    Although I have met a few accomplished cabinetmakers who hone with- out guide,
    most woodworkers will benefit from the added re- reinforcement one offers. There
    are numerous honing guides avail- able through mail-order catalogs and at your
    local hardware store or home center.


    There are two basic types of guides: the type that grips the tool and rolls on
    the stone (*top photo*) and the larger type where the guide roller rests on the
    adjacent surface (*middle photo*).


    I''m quite partial to the smaller type of honing guide that rolls on the stone
    with the tool. The one I''ve used for years is an Eclipse No. 35 honing guide,
    which clamps the blade or chisel between two jaws. The beauty of this guide is
    that it auto- matically centers the tool. Since it runs on the stone, there''s
    no chance of error caused by an uneven surface—as is possible with the other type.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_0.png)


    # Adjust Chisel Until Both Heel and Toe Touch Stone


    There are a number of ways to set a honing guide. If the blade or chisel has been
    ground to the desired bevel, you can use this position to the guide. Slide the
    tool up or down in the guide until both the toe and heel of the bevel flat on
    the stone (*bottom drawing*), and begin honing. Alterna- tively, angle-setting
    guides are available for the Eclipse jig that will accurately position the tool
    at the desired angle (www.leevalley.com).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_3.png)'
  - '[PAGE 181]


    # STROPS


    Certain types of leather contain a natural abrasive that makes them ideal for
    touching up an edge. I''m sure you''ve seen a strop in action at a barbershop,
    where they''ve traditionally been used to create a super-fine edge on a straight
    razor. These long flexible strops (top photo) work well for this but are generally
    too flexible for most woodworking (with the exception of some knives). A better
    alternative is a paddle-type strop, where a piece of leather is fastened to a
    wood paddle or block (middle photo). This less-flexible strop works better for
    both straight-edged and curved tools.


    Strops are particularly popular with carvers, as they permit quickly restoring
    a keen edge without the mess of oil or water. You can vary the aggressiveness
    of the strop by "charging" the surface with different grits of rouge. Simply rub
    the rouge on the surface in the same direction as you''d use for honing—usually
    a trailing stroke; that is, the body of the tool is always moved so the bevel
    trails. In stropping the other way, with the edge leading the tool, it will dig
    in and possibly cut the leather.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_181_0.png)


    # SLIPSTONES


    Slipstones are another favorite of carvers. These are small, odd-shaped stones
    that are designed to "slip" into the rounded and V-shaped edges of carving tools
    (photo at right). They are available in a variety of shapes and sizes, different
    materials (both natural and man-made), and numerous grits. For the most part,
    I use these primarily to remove a burr on the inside edge of a carving tool that
    I''ve created with a regular stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_181_1.png)'
  - '[PAGE 182]


    # # LAPPING PLATES AND DIAMOND STONES


    # ## Lapping plates


    A lapping plate is any reference surface that can be used to create a flat surface
    on a tool. I use lapping plates regularly to flatten the soles of planes (top
    photo) and to flatten stones. The plate I use is a piece of V4-thick glass that
    is a replacement louver for a Jalousie window. These louvers have edges conveniently
    rounded-over. Since there is still a bit of flex in one of these, it''s important
    to place it on a known-flat surface. The abrasive action is supplied by sheets
    of silicon-carbon paper mounted to the glass with spray adhesive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_0.png)


    # ## Diamond stones


    Although they''re expensive, diamond stones and stones are well worth the money
    (middle photo). Diamond stones are made by bonding uniform-sized diamond particles
    to a metal plate and attaching this to a polycarbonate base. Since diamonds are
    the hardest material known, they wear very slowly and the stone stay "sharp" for
    a very long time. Diamond stones and stones are available in many shapes and sizes
    in four grits: coarse (220 mesh), coarse (325 mesh), fine (600 mesh), and extra-fine
    (1200 mesh). I use stones made by DMT (www.dmtsharpen.com) and have yet to wear
    one out.


    # ## Basic use


    You can use a diamond stone just like you would use a waterstone (water is the
    recommended lubricant), but you''ll notice a few differences (bottom photo). First,
    unlike waterstones, diamond stones won''t dish out: They stay flat. And second,
    they''ll actually cut in most situations because the diamonds stay sharp so long—you''ll
    end up fewer strokes (what a pity, eh?)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_1.png)'
