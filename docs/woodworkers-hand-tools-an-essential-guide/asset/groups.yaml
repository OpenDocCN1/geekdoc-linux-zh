  - '[PAGE 117]


    # TRIMMING

    GROOVES


    In addition to cleaning up mortises and

    tenons, I routinely use a chisel to fine-tune

    groves, rabbets, dados, and other joints.


    # Paring sides


    One of the more common paring tasks is

    removing just a bit of material from the side of a

    grove or other joint. Whenever possible, I use

    the blade for this and take a slicing cut (top

    photo). This offers a couple of advantages over

    the more conventional vertical paring

    stroke. First, skewing the blade creates a

    cleaner shearing cut. Also, it makes it\easy to slide the flat back of the chisel

    along the side of the groove or dado as

    a steady starting point. This way you

    start with a very light cut and ease into

    the waste.


    # Ends of the groove


    Whether a groove is cut by hand or

    by machine, there''s often a tendency for

    the final few inches of the groove to be

    incorrect depth. This can be caused

    by letting up a spinning bit or blade, or

    passes over the workpiece as it

    by easing pressure near the end of a cut

    made by hand. I

    use an underhand cut and pare away the waste

    with a series of light cuts (middle photo). See

    page 121 for a handy tip on using a gauge block

    to gauge the depth accurately.


    # Cleaning up the bottom


    Cleaning up the bottom of a groove is fairly

    straightforward. Here again, flip the chisel to

    the bevel is below, and run it along the bottom

    (bottom photo). Inverting the bevel like this

    prevents it from catching and digging into the

    groove.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_117_0.png)'
  - '[PAGE 118]


    # FIRMER CHISELS


    Firmer chisels are general-purpose woodworking chisels that are some of the workhorses
    of any shop (top photo). When most woodworkers think of firmer chisels, they envision
    rather stout, square-sided chisels like those shown in the top photo. But bevel-edged
    chisels (see page 110) also are firmer chisels—their sides are tapered toward
    the top. Most firmer chisels have blades roughly 4" long and in widths varying
    from 1/8" up to 2". The handles may be wood or plastic.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_0.png)


    # Profile


    The basic difference between a firmer chisel and a bevel-edged firmer chisel is
    its profile (middle drawing). The square sides of firmer chisel create a strong
    blade that''s fully capable of handling light to moderate blows. The advantage
    of beveling the edges is it gives greater access when trimming joints like dovetails.
    The downside to this: The blade is not as stout as a standard firmer chisel, and
    a mallet should be used sparingly and lightly with this more delicate chisel.


    | Bevel-Edged Chisel | Firmer Chisel |


    # Anatomy


    A firmer chisel consists of three parts: blade, handle, and ferrule. In most cases,
    the blade has a tang that fits into a hole drilled in the end of the handle (bottom
    drawing). The ferrule (often brass) helps prevent the handle splitting if the
    chisel is struck with a mallet. Registered chisels are often confused with firmer
    chisels because they look alike. This is how you tell: A registered mortise chisel
    typically has a thicker blade and a ferrule on the end of the handle to prevent
    "crowning," or mushrooming of the handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_1.png)'
  - '[PAGE 119]


    # MORTISE CHISELS


    Mortise chisels are distinguished by their thick, beefy blades and stout handles
    (tap photo), both designed to handle the heavy mallet blows associated with chopping
    mortises by hand. The blades are thicker for another—less obvious reason: The
    wide blade helps guide the chisel and keep it square to the sides of the mortise
    as it''s being cut. This is a big plus, because it makes the chisel almost self-guiding
    once the sides and ends of the mortise are established. It''s another reason why
    this is absolutely the tool of choice for cutting mortises by hand.


    absorber. On socket-style mortise chisels, a tenor is turned on the end of the
    handle to fit into the socket of the blade. The disadvantage of a tang-style mortise
    chisel is that repeated blows will tend to drive the tang deeper into the handle.
    Even with ferrules installed at both ends of the handle, the tang will eventually
    make the handle split. This rarely happens with a socket-style chisel.


    # Handle options


    There are two basic options available for mortise chisels: tang-mount and socket-mount
    (bottom drawing). With a tang-mount, the tang on the end of the handle fits into
    a hole drilled into the end of the handle. Generally a leather washer is added
    between the base of the blade and the handle to serve as a shock


    ![](img/82f8fd51f2b064bbc4df21354d664e50_119_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_119_1.png)'
