    # INTRODUCTION


    ![](img/82f8fd51f2b064bbc4df21354d664e50_)


    My love of tools began when my mom gave me a tool set for my sixth birthday. You
    may even know it—the classic Popular Mechanics blue-handled tools. Man, I loved
    that set. Even though it was much bigger than me, I tore around the house "fixing"
    things. The first things I "fixed" was a coffee table in the front room that was
    too high for me. Out came the ruler to carefully measure up the bottom of each
    leg. Then I used my own saw to lop off each mark: a lot of work, but I was the
    man for the job.


    Mom, needless to say, was not impressed. The saw went away. Over the next few
    weeks, so did almost everything, one tool at a time, until I was left with a ruler
    and try square (do you know how much heat is inside a toaster?). Anyway, my passion
    for tools was so strong and so obvious that I often received tools instead of
    gifts at Christmas or birthdays. My brother Jim gave me my first real toolbox:
    a blue metal union box. I still have it. At ages 10, if you''ve had the chance
    to build something entirely by hand, start with a rough-sawn plank and hand-plane,
    I heartily recommend. Even if it looks awful in the end (like my first dovetail
    box-yikes!), you''ll be glad you made the effort. If nothing else, it will give
    you a profound appreciation for cabinetmakers of y. You might even get hooked.


    Just stay away from the coffee table.


    Jim Peters

    Fall 2001


    ![](img/82f8fd51f2b064bbc4df21354d664e50_7_0.png)


    > ...for the strength and durability of any structure, independent of the material,
    depends on precision, and any inaccuracy not frequently impairs outward beauty,
    but produces, in a corresponding degree, a real want of firmness and stability.


    BLACKIE & SONS (1853)


    # MEASURING AND MARKING TOOLS


    ![](img/82f8fd51f2b064bbc4df21354d664e50_8_0.png)


    In woodworking, doing a project "by the numbers" isn''t a mark of mediocrity,
    or same old same; it''s absolutely vital. The "numbers" involved, of course, are
    the dimensions of the wood being worked. When you don''t measure and lay out with
    precision—as Mr. Blackie notes—you can end up with a piece that lacks not beauty
    but also durability.


    Your shop tools might be the finest and sharpest available. But if you can''t
    both measure and mark accurately those tools are virtually worthless.


    Look at the rosewood, ivory and brass in the photo at left—this wasn''t mere indulgence.
    Woodworkers of y knew that these quality materials were worth the relative high
    cost at the time (just one of these beauties could cost a couple of months'' worth
    of wages). Your predecessors in the craft understood the importance of buying
    quality to create quality And like cabinetmakers Blackie & Sons, they knew well
    the importance of precision. There are lots of steps involved in crafting a fine
    piece with confidence—and every one relies on going “the numbers."


    Clockwise from top left: an “American Combined Level and Grade Finder, pointed
    1904; a handmade 24” panel gauge; a folding rule No. 15, made by C. S. Co.; calipers
    (with steel legs); Stanley No. 5 trannel; a 7/2” combined tri and meter square,
    made by Stanley Tools; a Stanley No. 7 scratch owl; Henry Dixon and Stanley’s
    mortise rouge; and a Stanley No. 40 ivory and silver ruler caliper.


