    # CARVING TOOLS


    he used a No. 8 gauge, the other will know exactly which tool he used. Surprisingly,
    most toolmakers follow these standards. Not all do, however, so stick with a reputable
    brand when you buy.


    The first time I seriously began shopping for carving tools, I couldn''t help
    snickering at some of the names: Flutoni, spoon bit, allonge fishtail? Silly though
    they may say, these names have special meaning to carvers, and often aptly describe
    the business end of the tool. Carving tools can be broadly categorized into three
    main groups: gouges, chisels, and specialty tools (top photo). Each tool is designed
    to handle a specific task; serious carvers have dozens of carving tools, ranging
    from delicate 4"-long detail chisels to huge gouges for roughing-out work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_127_0.png)


    # Standard sizes


    Unlike most woodworking tools, carving tools have long been available in standard
    sizes (bottom drawing). If one carver tells another that


    | Gouges | Straight or Bent Parting Tools | Straight |

    | --- | --- | --- |

    | #11 | | #5 |

    | #9 | | #7 |

    | #8 | | #9 |

    | #7 | | #11 |

    | #6 | | |

    | #5 | | |

    | #4 | Allonge Fishtail | |

    | #3 | | #3 |

    | | | #5 |

    | | | #7 |

    | Bent-Back Gouges | | |

    | #5 | Straight or Skew | |

    | #7 | | |

    | Wing Parting Tool | Macaroni Tool | Flutoni Tool |


    # Gouges


    A carving gouge is basically a chisel with an edge curved across the width of
    the blade (top photo). Of all the carving tools, you''ll find that gouges have
    the widest array of curves, sizes, and special features (such as a bent neck).
    In general, gouges may be one of two types: in-channel or out-channel. With an
    in-channel gouge, the bevel is ground on the inside of the blade; an out-channel
    gouge has its bevel ground on the outside. Out-channel gouges are by far the more
    popular.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_0.png)


    # Chisels


    Although some carving chisels often look similar to standard firmer chisels, there''s
    one difference: Instead of the bevel being ground on one side, the bevel on a
    carving chisel is ground on both sides so''ll meet in the center (middle photo).
    Unlike the concave (hollow) grind of most chisels, a carving chisel generally
    has a convex grind. This helps prevent the edge from digging in too deep in use.
    Carving chisels may have either a square edge or a skewed edge.


    # Specialty tools


    In addition to gouges and chisels, the carver typically has a number of other
    specialty tools in his arsenal (bottom photo). Parting tools are the stands. The
    most commonly used parting tool is the V-shaped version used for cutting grooves
    in wood and making square-corner cuts. The V-shaped parting tool is widely used
    for incising letters in signs. Veiners can have square or rounded edges and are
    used mainly to add decorative grooves or ''veins'' in carvings.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_1.png)


    # FILE & RASP TERMINOLOGY


    How often you use files and rasps will depend heavily on the type of work you
    do and how long you''ve been woodworking. If your work involves a lot of curved
    shapes, your files and rasps are likely very prominent in your tool cabinet. Folks
    who build antique furniture, especially Queen Anne furniture, with its classic
    S-shaped cabriole legs, use files and rasps regularly. On the other hand, if you
    build Craftsman style furniture, rectilinear lines, how long you''ve been woodworking
    is also a factor.


    I used files and rasps much more often when I was a novice than I do now. This
    was partly because I didn''t have as many tools, and also that I''ve since learned
    better ways to do the jobs. Now, for example, instead of trying to fit a tenon
    into a mortise by filing it, I use a shoulder plane or a chisel. And instead of
    shaping a curve on a leg with a file, I tend to use a spokeshave. Any of these
    tools leaves a cleaner, smoother surface and, just as important, is more of pleasure
    for me to use. I still use my rasps and files—just not often.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_129_0.png)


    - Tang

    - Heel

    - Face

    - Edge

    - Brass Ferrule

    - Handle


    ![](img/82f8fd51f2b064bbc4df21354d664e50_129_1.png)


    # SHAPING TOOLS


    # File cuts


    Files are made by cutting parallel rows of teeth into the surface of the metal
    at an angle (usually between 60 and 80 degrees). There are three common "cuts"
    available: single cut, double cut, and curved tooth (top drawings). Single-cut
    files are the most common and work well for general-purpose woodworking and the
    occasional metalworking I need to do around the shop. Double-cut files have a
    second set of teeth at an angle to the first set; so they''re more aggressive
    and work when you need to remove a lot of material in a hurry. Curved-tooth files
    are becoming quite rare and are very aggressive. These have been replaced primarily
    by the rasp (see page 133).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_2.png)


    # Shapes


    Files come in a huge variety of shapes and sizes. The most frequent shapes are:
    flat (drawing), half-round, round, and triangular (bottom). For all-around woodworking,
    the flat shape is your best bet. Lengths of files range from 4" to 12"; eight-inch
    and 10-inch files are useful, while smaller files are for detail work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_3.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_4.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_5.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_6.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_7.png)


    # MILL


    There are three common techniques for files: straight, cross-filing, and draw-filing.
    Each has advantages and disadvantages.


    ### Straight


    Straight filing is the most common technique (top). For all-around woodworking,
    the straight file is your best bet.


    ### Cross-filing


    Cross-filing is widely used for removing more material (middle). It works best
    when you hold the file at an angle to the surface.


    ### Draw-filing


    Draw-filing puts the smoothest finish you can get (bottom). It works best when
    you pull the file along the length of the wood


    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_1.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_2.png)


    # HANDLES


    It''s amazingly easy to destroy hours (even days) of work with one careless slip
    of a file. Since these beasts are all-metal, they can and will scratch, ding,
    and mar wood if allowed. Here''s a tip that can save you a lot of aggravation
    when filing, particularly near surfaces that are easily damaged: Simply wrap a
    turn or two of masking or duct tape around the end of the file (top photo). This
    way you can safely rub the file on your surface without risk of damage.![](img/82f8fd51f2b064bbc4df21354d664e50_132_0.png)


    # FILE HANDLES


    It''s odd: Although almost every file manufacturer warns you not to use their
    files without a handle, none of them supply one. It''s sort like buying a table
    saw that doesn''t come with a blade guard; go figure. The point is, you really
    should use a handle when using a file, because the tang is a nasty bit of work
    (middle photo).


    I admit that some of my files don''t have handles, but I have not taken the time
    to remove any burrs and soften the edges. My example notwithstanding, it''s a
    good idea to fit every file and rasp you own with its own handle. They can be
    bought for little at most hardware stores, or you can easily make your own. If
    you''re a turner, you can get fancy (drawing below). Otherwise, a short length
    of dowel will do—anything is better than nothing. NOTE: To prevent the handle
    from splitting, it''s a good idea to add a metal ferrule; a short length of brass
    or copper pipe works great for this.![](img/82f8fd51f2b064bbc4df21354d664e50_132_1.png)

