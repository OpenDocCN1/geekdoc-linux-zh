    # 斜面方向


    修木刨（jack plane）和平直木刨（block plane）之间的主要区别之一是斜面的方向（顶部图）。在修木刨上，斜面朝下；而在平木刨上，斜面是朝上的。修木刨都有一个刀垫，有助于在木屑从刃缘滚落时将其切断。虽然平木刨看起来没有刀垫，但实际上斜面起到了这个作用。平木刨的刃片角度比修木刨低得多（切削角大约低了
    25 度而不是 45 度，但这实际上是斜面角加上安装角度的总和）。这最终形成了 45 度——即作为修木刨的角度（若想了解为什么平木刨能很好地处理端面，请参见第
    73 页）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_62_0.png)


    # 倾斜


    通过倾斜刨子，可以改变有效的切削角。与其直线切割，不如如果将刨子倾斜 30 度，你就会改变刃片的仰角，因为你正在产生更多的剪切切割效果（中间图）。这就是为什么在处理如眼枫枫或树节等难以刨削的木材时经常使用倾斜法。倾斜是如此有效，有些刨子制造商直接制造带有倾斜刃片的刨子。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_62_1.png)


    # 槽口


    刨子上的槽口开口——即刃片斜面端与刨底之间的空间——对工具的整体性能起着重要作用（底部图）。刨底的敏感区域是负责“支撑”切削的部分。它能防止刃片铲起过大的木屑。同时，它可能足够宽，以允许木屑通过而不会卡塞。修木刨和平直木刨的槽口通过调节块（frog）进行调整（参见第
    67 页），而在优质的平木刨上，可以通过调节槽口板进行调整（参见第 75 页）。


    ![](img/82f8fd51f2b064bbc4df21354d664e_2.png)


    光光工具

    61


    # 修木刨与平直木刨


    传统上，工人的修木刨和平平直木刨是他的赖生吃饭。通过这两把刨子，他可以将粗锯木板变成平直的木板，并且四个面都刨得光滑。边缘将与面垂直，这样木板就可以轻松地组合成更大的板材。尽管在现代工作坊中电刨已经接管了这些任务，但修木刨和平平直木刨在工作坊中处理面板表面、连接边缘以及全方位的平光方面仍然非常有用。如果你从未刨削过粗锯木板以使其完全方正，请尝试一下；你将对过去的木工们多许多敬意。


    修木刨和平平直木刨的外观非常相似（顶部照片）。主要的区别在于刨底的长度和刃片的宽度。通常，修木刨和平平直木刨的界限从 22 英寸左右开始，而中等尺寸的刨子（通常称为前刨）位于两者之间的“无人地带”（见下表）。另一个常用的经验是：刨底越长，刃片越宽——但对此有一些例外。无论你的刨子是修木刨、前刨还是平直木刨。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_63_0.png)


    # 刨子尺寸


    | 刨底 | 编号 | 分类 | 长度 | 宽度 | 刨底 | 编号 | 分类 | 长度 | 宽度 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 金属 | 1 | 光刨 | 51/32" | 11/2" | 木质 | 23 | 光刨 | 9" | 1 3/4" |

    | 金属 | 2 | 光刨 | 7" | 15/8" | 木质 | 24 | 光刨 | 9" | 2" |

    | 金属 | 3 | 光刨 | 8" | 1 3/4" | 木质 | 26 | 修木刨 | 15" | 2" |

    | 金属 | 4 | 光刨 | 9" | 2" | 木质 | 27 | 修木刨 | 15" | 21/8" |

    | 金属 | 4/2 | | 19" | 2 3/8" | 木质 | 27 1/2 | 修木刨 | 15" | 21/4" |

    | 金属 | 5 | 修木刨 | 14" | 2" | 木质 | 28 | 前刨 | 18" | 2 3/8" |

    | 金属 | 5 | 修木刨 | 11 1/2" | 1 3/4" | 木质 | 29 | 前刨 | 20" | 2 5/8" |

    | 金属 | 5/2 | 修木刨 | | 2" | 木质 | 30 | 平直木刨 | 22" | 2 5/8" |

    | 金属 | 6 | 前刨 | 18" | 2 5/8" | 木质 | 31 | 平直木刨 | 24" | 2 5/8" |

    | 金属 | 7 | 平直木刨 | 22" | 23/8" | 木质 | 32 | 平直木刨 | 26" | 2 5/8" |

    | 金属 | 8 | 平直木刨 | 24" | 2 5/8" | 木质 | 33 | 平直木刨 | 28" | 2 5/8" |

    | 木质 | 21 | 光刨 | 7" | 1 3/4" | 木质 | 34 | 平直木刨 | 30" | 2 5/8" |

    | 木质 | 22 | 光刨 | 8" | 1 3/4" | | | | |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_63_1.png)


    光光工具

    旧刨子有木身或木底，而现代刨子是金属身。一段时间内，出现了“过渡型”刨子，结合了这两者的优点（更多信息请参见第 72 页）。熟悉修木刨和平平直木刨的最佳方法之一是拆解它。先松开锁以释放压力（底部图），然后向上滑下刀垫。现在你可以取出刃片和刀垫。这两部分通过螺丝或宽刃片驱动固定在一起。扭动刀垫，直到它滑落，然后将其取出。刀垫（也称为木垫）在刃片铲起木屑时将其切断；它还充当加强器以防止震动。刀垫和刃片放入调节块（frog）中——这是一个固定在刨体上的铸件。调节块后面有一个调节螺丝，允许你打开或关闭槽口。调节块还包含一个使刃片与刨底平行的侧调杆，以及一个降低刃片的深度调节钮。背部的手柄和前面的旋钮完成了刨子。刃片可以用以下常用方式之一进行研磨：直角、凸面或圆角（顶部图）。凸面适用于粗加工，而圆角可以防止它们切入。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_64_0.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_64_1.png)


    光光工具

    63


    # 调整刨子


    为了让修木刨和平直木刨产生薄薄的木屑而不产生崩裂，你需要对其进行调整。这包括刨平刨底、调整调节块、去除刀垫上的槽、研磨刃片以及精调侧和深度。


    # 平刨底


    刨底的平直度会对性能产生巨大影响。检查刨底平直度最简单的方法是使用直尺。我发现，检查时将刨子对准亮光可以显示任何凹处或凸点。为了平刨底，用喷雾胶将几片金砂纸固定在已知平整的表面。一块百叶玻璃效果非常好（大多数五金店都有）。百叶玻璃非常棒的地方是它的边缘经过了圆角处理以安全。我通常从
    80 目开始，一直用到到 220 目。


    尽管你可能想拆下刃片和刀垫，但它们对刨底保持着压力。如果你在没有这种压力的情况下平刨底，然后再安装刃片，刨底就不会是平的。只需确保在金砂纸上磨刨底前将刃片退约
    1/8 英寸。使用推推，并将刨子调转方向使用，以确保整个长度和宽度压力均匀（顶部照片）。检查刨底的进度。虽然完美主义者会刨整个刨底，但平直度至关重要的部分只有头、尾和槽口周围（中间照片）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_0.png)


    # 调节块


    调节块是刨子的另一个重要部分。它以正确的角度牢固刃片，同时允许你调整切削深度和刃片的位置（对页的底部图）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_1.png)


    # 刀垫下的间隙会导致木屑卡塞


    调节块调节不当是刃片震动的主要原因。为了让调节块在接触刃片、刨底和固定刃片的斜面处良好工作——它们必须绝对平直且垂直。为了平整这些部分，我使用钻石磨石或小石头在表面上轻轻摩擦。经常用直尺检查。


    # 刀垫


    松垮的刀垫也会引起震动。它的工作是增加刨子的刚性并防止其弯曲。末端的微凸起还充当楔子切入木材时切断木屑。如果刀垫没有完全接触刃片的整个边缘，这两点都不会发生。配合不当的刀垫可能会允许木屑卡在刀垫和刃片之间（顶部图）。解决所有问题的办法？通过在油石上磨平刀垫的前缘来确保完全接触。


    在将刀垫安装到刃片之前，刃片需要研磨。有关研磨的详细介绍，请参见第 182-183 页。然后重新安装刀垫并固定在刃片上以检查间隙（中间照片）。将刀垫在刃片上与前缘对齐并向后设置
    1/16。


    # 手柄与旋钮


    如果刨的手柄和旋钮状况良好，请花点时间拧固定它们在刨体上的螺丝。旋钮通常有一个，手柄有两个（底部照片）。如果手柄裂了或断了，请更换新的（参见第 66 页的侧边栏）。


