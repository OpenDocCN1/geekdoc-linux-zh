  - '[PAGE 130]


    # File cuts


    Files are made by cutting parallel rows of teeth into the surface of the metal
    at an angle (usually between 60 and 80 degrees). There are three common "cuts"
    available: single cut, double cut, and curved tooth (top drawings). Single-cut
    files are the most common and work well for general-purpose woodworking and the
    occasional metalworking I need to do around the shop. Double-cut files have a
    second set of teeth at an angle to the first set; so they''re more aggressive
    and work when you need to remove a lot of material in a hurry. Curved-tooth files
    are becoming quite rare and are very aggressive. These have been replaced primarily
    by the rasp (see page 133).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_2.png)


    # Shapes


    Files come in a huge variety of shapes and sizes. The most frequent shapes are:
    mill (or flat), half-round, round, 4-in-hand, and triangular (bottom drawing).
    For all-around woodworking, the half-round shape is your best bet. This combination
    of a gently curving file with a flat face will handle most jobs. Lengths for files
    from 4" to 12" and larger. Eight-inch and 10" files are the most suitable for
    the shop, while smaller files, particularly triangular files, are useful for sharpening.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_3.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_4.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_5.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_6.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_130_7.png)'
  - '[PAGE 131]


    # MILL FILES


    There are three common techniques for using a file: straight, cross-filing, and
    draw-filing. Each has advantages and disadvantages.


    # Straight


    Straight or in-line filing is not used often, since most files perform best when
    skewed at an angle (see Cross-filing, below). There are times when in-line filing
    is your only option or actually works best for the job.


    When I prepare the edge of a scraper by filing flat, I typically use the in-line
    method, since this helps to create an absolutely flat edge (top photo). If you
    hold the file at an angle, there is a big tendency to tip or rock the file, which
    is skewed at an angle and will produce an angled cut.


    # Cross-filing


    Cross-filing is the most common technique used with both files and rasps. With
    this method, the file is skewed to produce more of a shearing cut (middle photo).
    Cross-filing lets you quickly remove wood while leaving a fairly smooth surface.
    Any roughness can usually be removed with draw-filing (see below), a scraper,
    or sanding.


    # Draw-filing


    Draw-filing puts the smoothest finish you can get on a surface with a file. The
    file is held at 90 degrees to the edge and is drawn across the surface (bottom
    photo). This technique works best with single-cut files and with a light touch
    operation, make sure to lift the file at the end of the stroke and return it to
    the starting-position.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_131_2.png)'
  - '[PAGE 132]


    It''s amazingly easy to destroy hours (even days) of work with one careless slip
    of a file. Since these beasts are all-metal, they can and will scratch, ding,
    and mar wood surfaces if allowed. Here''s a tip that can save you a lot of aggravation
    when filing, particularly near surfaces that are easily damaged, such as plywood
    and veneered panels: Simply wrap a turn or two of masking or duct tape around
    the end of the file (top photo). This way you can safely rub the file on your
    surface without risk of damage.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_132_0.png)


    # FILE HANDLES


    **It''s odd:** Although almost every file manufacturer warns you not to use their
    files without a handle, none of them supply one. It''s sort of like buying a table
    saw that doesn''t come with a blade guard; go figure. The point is, you really
    should use a handle when using a file, because the tang is a nasty bit of work.
    It''s sharp, often covered with burrs, and generally painful to hold in your hand.
    I admit that some of my files don''t have handles, but I have not taken the time
    to remove any burrs and soften the edges.


    My example notwithstanding, it''s a good idea to fit every file and rasp that
    own with its own handle. They can be bought for little at most hardware stores,
    or you can easily make your own. If you''re a turner, you can get fancy (drawing
    below). Otherwise, a short length of dowel will do—anything is better than nothing.
    NOTE: To prevent the handle from splitting, it''s a good idea to add a metal ferrule;
    a short length of brass or copper pipe works great for this.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_132_1.png)'
- md: '

    # SPECIALTY FILES


    ## Taper files


    Taper-cut files are triangular-shaped files that taper along their length (top
    photo). They come in various sizes that are defined by their cross section and
    taper, not by their coarseness. Common sizes are regular, slim, extra slim, and
    double-extra slim. These files are most used for sharpening saws but can be pressed
    into service for other tasks as well.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_133_0.png)


    ## Needle files


    Needle files (sometimes called jeweler''s files) are thin, delicate files that
    are used for small fine detail work. They''re usually sold in sets that include
    a variety of shapes, including round (often called a rat-tail file), square, rectangular,
    half-round, triangular, and flat (middle photo). I use my needle files frequently
    to smooth tiny, enlarge a hinge hole, and in the past, to sharpen spurs on some
    of my drill bits; this task has been taken over by my diamond hones (page 137).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_133_1.png)


    ## Riflers


    Riflers are specialty files used primarily by carvers to smooth out small details
    in their work (bottom photo). They may be double-ended or come with a handle.
    Riflers are available individually or in sets and can be either files or rasps.
    I bought a set years ago when I became interested in carving. Although I don''t
    do a lot of carving anymore, I occasionally pull them out when I can''t get into
    a spot with any other tool. They are really quite handy.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_133_2.png)


    ## RASPS


    Even though rasps closely resemble files, they''re very different beasts (tap
    photo). Instead of single rows of teeth cut into the metal surface at an angle,
    rasps have tiny individual teeth in parallel rows. And unlike the smooth, almost
    planing action of a file, a rasp is designed to virtually tear out chunks of wood.
    This makes them very aggressive, and a rasp in the hands of a seasoned user can
    remove a lot of material in no time flat. That''s why rasps are reserved solely
    for roughing-out work that will eventually be smoothed with files, scrapers, or
    sandpaper.


    Most rasps are around 8" to 12" long and come in course, bastard, second-cut,
    and smooth grades. You may also see them described as either wood rasp, a cabinet
    rasp, or a patternmaker''s rasp (bottom drawing). Wood rasps are the most aggressive
    of these and usually come in either flat or half-round profiles. Cabinet rasps
    are typically second-cut and smooth and also come in half-round and flat (half-round
    being the more common). Patternmaker''s rasps are also available in second-cut
    and smooth, and they generally have smaller teeth that tend to leave a smoother
    finish than the cabinet rasp.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_134_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_134_1.png)


    CABINET RASP


    PATTERNMAKER''S RASP


    One of my favorite rasps is a 4-in-hand rasp (originally called a shoe rasp).
    This handy tool combines four tools in one, as you''d guess from the name. It''s
    doubled-ended with a half-round shape. One end is a rasp, the other a file—you
    think they''d call it a 4-in-hand/rasp. Effectively, you have a half-round file,
    a flat file, a half-round rasp, and a flat rasp. What I like best about this tool
    is that both edges are ''safe'' or smooth. This makes the 4-in-hand rasp particularly
    useful when rounding-over tenons to fit into rounded-end mortises, like those
    cut by a router (top drawing).


    I also like how the shorter body fits nicely into my hand—and my shop apron pocket,
    to my use for this tool is light work, fitting a joint or rounding-over tenons
    (middle photo). If I have a lot of wood to remove or I''m working on a long or
    large surface, I''ll pull out the appropriate standard-length file or rasp, since
    the short body of the 4-in-hand is inadequate for this type of work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_135_0.png)


    ## FILECARDS


    - Files and rasps require a lot of maintenance—a lot more than woodworkers give
    them. No wonder the tool skips over the surface instead of cutting properly. Most
    often it needs to be cleaned, and you should do this after every half-dozen strokes
    or so. I know a lot of folks who have never cleaned their files. The problem is,
    the tiny teeth of a file quickly fill with waste. If you don''t remove it, the
    file can''t work properly. Here''s where a filecard comes into play (photo at
    left). Files typically have two faces: a nylon brush on one face and a wire brush
    on the other. Start with the nylon brush, and if this doesn''t clean the file,
    flip it over and use the wire side. Stubborn bits can be removed with the steel
    pic that''s commonly built into most filecards.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_135_1.png)


    ## Shaping Tools


    ## RASP PLANES


    I know quite a few woodworkers who enjoy using rasp plane. Rasp planes are commonly
    referred to by their trade name, Surform (a Stanley trademark). Surforms come
    in several shapes and sizes (top photo), but all use the same plate. This is a
    steel plate with rows of small teeth pressed into the surface. When the plate
    is discarded and a new one installed, this advantage over conventional rasps is
    that the teeth are less likely to clog, since the waste can escape through the
    holes (middle photo).


    Surforms are intended for rough shaping, and they work well at this. I prefer
    other tools such as drawknife or spokes, but I have always found Surforms very
    accessible. Each of them has saved hours in the shop, reducing a square object
    into a finished looking shape.


    Naturally, if you use one of these, Surforms are simple to operate. Hold the tool
    as much as you would a jack plane or block plane, and use even pressure as you
    shape (bottom photo). You''ll find that the tooth design allows you to cut both
    with and against the grain, leaving a rough surface. Once rough shaping is done,
    final smoothing is essential.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_2.png)


    ## SANDVI FILES


    I was skeptical the first time I read the package on Stanley file I was considering.
    If the file was only half as good as they promised, it''d be worth the money.
    According to the package, here was a nifty product that would virtually replace
    both the files and sandpaper in my shop. Although this happened, the Stanley files
    I''ve bought over the years have found a home in my tool cabinet (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_137_0.png)


    Stanley files (and abrasive tools, like sanding block), are all faced with a special
    steel plate that has a series of holes punched in the surface to replicate a variety
    of abrasive grits. What makes this work is that the holes are punched in the metal
    which wears out quickly, the plates last considerably longer. When they wear out,
    you can purchase a replacement plate.


    Unlike standard files, Stanley don''t have to be pushed or pulled in one direction.
    You can literally move these in any direction and they''ll cut (middle photo).
    This makes them particularly handy when working in tight quarters. The only secrets
    to using these are to let the sanding plate do the work, and to clean them often
    by rapping the tool against the side of your bench.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_137_1.png)


    ## DIAMOND FILES/HONES


    Several years ago, I was wandering around a woodworking show with a couple of
    dollars burning a hole in my pocket, when I saw a diamond hone. Seemed like a
    heck of an idea to me, so I bought a couple of pocket holes and a small set of
    diamond files (top photo) and took them home to try. What a discovery. I use these
    little guys all the time for everything from tuning a plane to sharpening a router
    bit. I''m on my second set of paddles, and the files are still in good shape.


    Diamond hones and files are basically pieces of highgrade plastic with crushed
    industrial-quality diamond particles bonded to the surface. Many shapes and sizes
    are available (middle drawing), and they typically come in fine, medium, and coarse
    grits. Without a doubt, I use the paddle-style hones most often (bottom photo).
    There are two things that make these so great. First, since the abrasive is diamond,
    it lasts a long time. Second, their diminutive size allows them to access places
    other stones can''t reach, such as the short bed of a block plane. Diamond hones
    and files can be used dry or else with water. Since I''m usually removing only
    a small amount of metal with one of these, a lubricant is unnecessary.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_138_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_138_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_138_2.png)

