  - '[PAGE 124]


    # JAPANESE CHISELS


    My Japanese chisels are absolutely a joy to use. With their wood handles and short
    blades, they balance perfectly in my hand. The special laminated-steel construction
    creates a blade that is easy to sharpen yet maintains a keen edge (top photo).
    How can they offer so much in such a small package? For starters, the construction
    of Japanese chisels differs considerably from that of their Western cousins.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_0.png)


    # Bi-metal blades


    Unlike the blade of a Western chisel, which is forged from a single piece of steel,
    a Japanese chisel is made from two distinct layers that are forge-welded together
    (middle drawing). The lower layer is a high-carbon steel that''s very hard (typically
    Rc 60 to 65). Although this can maintain a razor edge, it''s quite brittle. A
    mild low-carbon layer is welded on top of to support the metal by absorbing impact.
    The backs of the chisels are often hollowed out in the center to make flattening
    easier.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_1.png)


    # Basic use


    Most Japanese chisels have ferrules on each end of the handle to prevent splitting
    (bottom drawing). Since the blades are stout and the handles are short, even a
    bevel-edged Japanese chisel can take the punishment of repeated blows from a mallet
    or Japanese hammer (see page 147). There is a huge range in quality and cost for
    Japanese chisels. If you''re starting out with a less-expensive set.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_124_3.png)'
  - '[PAGE 125]


    # SPOKESHAVES


    Although spokeshave is technically a type of plane, I''ve included it in this
    chapter because it''s often used for shaping. A spokeshave is really a double-handled
    plane with a very short sole (top photo). This short sole is what allows the spokeshave
    to navigate curves that an ordinary plane couldn''t handle. There are a number
    of spokesaves common being the flat-bottomed sole. This is a good, all-purpose
    shaping tool. Other specialty spokesaves include those with a curved sole from
    front to back, and with those that are either concave or convex. I found the specially
    spokesaves to be of limited use, as the blades are quite time-consuming to sharpen.


    Originally designed to shape spokes for wagon wheels, spokeshelves still find
    a home in many shops today. I use mine when I shape cabrioles (middle photo),
    add a chamfer to a curved edge, or need a round-over on a curved part. In use,
    a firm grip is essential, and the tool may either be pushed or pulled. I generally
    prefer to pull because this gives better control.


    # Adjustable blades


    When you''re shopping for a spokeshave, I recommend the one with an adjustable
    blade. This type of spokeshave has a pair of knurled knobs that slot into the
    blade to move it up and down as they''re turned (bottom drawing). This also helps
    prevent the blade from shifting out of position. Plainer versions use a screw
    to hold the blade in place and are a pain to adjust.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_125_0.png)'
  - '[PAGE 126]


    # DRAWKNIVES


    Many woodworkers will never use a drawknife (top photo). It''s big, exposed, and
    the cut is totally hand-controlled. But in the hands of a skilled craftsman, it
    can do amazing things. I had the pleasure of sitting in a class with master chairmaker
    Brian Boggs and was simply amazed at what he could do with just a drawknife and
    a spokeshare. He makes exquisite chairs that are as comfortable as they are beautiful,
    and he personally guarantees that they''ll outlast the owner.


    A drawknife is basically a long, thin blade with tangs on the ends that are bent
    to fit into wood handles (bottom drawing). The blade can be straight or curved,
    and handles are long and straight, turned, or even small knobs. On my great-grandfather''s
    drawknife (top photo), the handles are adjustable: They can be turned toward the
    blade to protect the edge and allow it to slip easily into a toolbox.


    There''s a lot of debate over using a drawknife with the bevel up versus down.
    I say, what feels best: experiment to find which gives you better control. As
    with many other tools, the skewed cut will produce more of a shearing cut to cleanly
    cut wood fibers (middle photo). In my opinion, the big challenge to a drawknife
    is sharpening the back: Rub a sharpening stone on the back of the drawknife in
    small, circular strokes. If the bevel needs reshaping, it may be easier to use
    a portable belt sander than a grinding wheel. Honing is best done by rubbing the
    stone on the back instead of the blade on the stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_126_0.png)


