    # # REPLACING A HANDLE


    Over time, the handle on a hammer can get cracked or break. Frankly, it''s easy
    to replace a handle—as long as it''s sized correctly. I suggest taking the old
    hammer handle with you to the hardware store or home center when you shop for
    a replacement; or make one yourself; use the old handle as a pattern. Before you
    install the replacement handle, of course, you''ll need to remove the old one.
    Just saw off the head and then drive out the -waste with a punch or large bolt.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_0.png)


    # Cut kerfs


    To get ready the handle for the head, you''ll first need to fit the tenon. A file
    will make quick work of this. Work around the tenon, removing the same amount
    on all four sides until the tenon slips into the head all the way and the shoulders
    bottom out. If the fit is good, mark and cut off the waste that protrudes above
    the head. Then remove the handle and cut three kerfs in the end. Cut a lengthwise
    kerf for a wood wedge, and two kerfs across the width for metal wedges (*top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_1.png)


    # Drive in wedges


    Now you can slide the handle back in the head and install the large wood wedge.
    This wedge pushes the sides of the tenon out to grip the head. Don''t be shy here—drive
    it in as far as it will go (*middle photo*). All that''s left to drive in the
    metal cross wedges that spread the tenon out evenly in the head (*bottom photo*).
    Drive into the kerfs you cut earlier until they''re flush with the head. That''s
    it: You''re ready to go.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_3.png)'
  - '[PAGE 146]


    # WARRINGTON HAMMERS


    I have a couple of different sizes of Warrington hammers in my tool chest (top
    photo). These lighter-weight hammers are ideal for driving finish nails and small
    brads. Instead of a claw, a Warrington hammer has a small, wedge-shaped cross
    peen that makes it especially useful for driving in brads. The cross peen is a
    real finger-saver when working with short, small brads (middle photo). Why? Because
    the cross peen will actually fit between my fingers to start the br. Once it''s
    started, I flip the hammer to use the flat face to drive the br. Another unique
    feature of this tool is the faces called "side strikes" on the sides of the hammer
    that drive nails in tight spaces.


    Warrington hammers are available in four different weights: 3/2, 6, 10, and 12
    ounces. I have a 6- and 10-ounce hammer, and I can comfortably handle most tasks.
    There''s something odd about these hammers: The end of the cross peen is either
    ground or cast to come to a point instead of being deat. This actually makes it
    difficult to start a brad, as the point will glance off the head of the brad.
    Try filing the point flat to make the tool more usable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_0.png)


    # NAIL SET


    One of the secrets to nailing effectively is knowing when to stop driving the
    nail with a hammer. The closer you get to the surface, the greater the chance
    of dinging it with the face of the hammer. To eliminate the chance of dings, stop
    when the head of the brad or nail nears the surface—usually 1/16" to /8". Then
    reach for a nail set (photo at right). A nail set is designed to finish the job
    by driving the nail below the surface, or "setting" it. Nail sets available are
    various tip diameters; choose one that is closest to the diameter of the nail.
    Place the set on the nail and tap it to gently set it below the surface. Keep
    a firm grip on the set, since it''s for it to slip off and end up driven into
    the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_2.png)


    ASSEMBLY TOOLS 145'
  - '[PAGE 147]


    # BALL-PEEN HAMMERS


    Even though most of the work I do is in wood, I often find use for a ball-peen
    hammer (top photo). A ball-peen hammer is handy when I need to work with metal—I
    incorporate into jigs and fixtures. I also use a ball-peen hammer -when I work
    with the metal hardware I install in many projects. A ball-peen hammer (sometimes
    called an engineer''s hammer) has a standard flat face on one end and some type
    of peen on the other.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_0.png)


    # Head styles


    There are three prevailing head styles for peened hammers: a straight peen, a
    cross peen, and by far the most common, the ball peen (middle drawing). Cross
    peens are popular on Warrington hammers, while straight peers are rarely seen
    outside of the metal shop. The rounded head of a ball-peen hammer is used mostly
    for riveting (see the sidebar below). Though I don''t use a lot of rivets, I often
    peen brass rods over to attach brass parts to wood handles on some of the fine
    tools I make.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_3.png)


    # RIVETING


    Riveting is a three-step process. First, a rivet is inserted through the parts
    to be joined, and the flat face of the hammer is used to “mushroom” the end of
    the rivet (drawing at left). Then, the hammer is flipped and used to further shape
    the rivet into a rough dome. Finally, a rivet set is used to create a smooth surface
    on the end.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_4.png)


