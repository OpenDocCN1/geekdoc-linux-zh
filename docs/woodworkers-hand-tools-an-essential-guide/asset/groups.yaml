- md: "\n## Burnishing at 90 degrees\n\nOnce you've honed the edges of the scraper\
    \ smooth, it's time to get out the burnisher (see the *sidebar below*). I begin\
    \ burnishing with the burnisher held perpendicular to the face of the scraper.\
    \ I take several strokes with moderate downward pressure on the entire edge of\
    \ the scraper (top photo). This will compress the metal and actually create a\
    \ small bur, which you should be able to feel by running your thumb up from under\
    \ the edge. In some cases, this may be all the bur you need. If you're planning\
    \ on removing a lot of material, you'll want a larger bur and you'll need to burnish\
    \ the edge at an angle.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_188_0.png)\n\
    \n## Burnishing at an angle\n\nHold the burnisher at 80 to 85 degrees for a flat-edged\
    \ scraper (*middle photo*) and around 40 degrees for an angle-edged scraper (inset).\
    \ Apply light pressure and take a few strokes. Check the bur and repeat if it's\
    \ not enough. You might be surprised how little pressure is needed to create a\
    \ bur. I've seen guys pressing down so hard they were flexing the scraper. This\
    \ shouldn't be necessary. If it is, it's likely that your burnisher isn't hard\
    \ enough to roll the bur (see below).\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_188_1.png)\n\
    \n## BURNISHERS\n\nA burnisher must have two features to work properly: The steel\
    \ must be harder than the scraper (Rc 60 at a minimum), and it must be super-smooth\
    \ to prevent damage to the delicate bur. You can get a burnisher for a couple\
    \ bucks from woodworking catalogs (*photo at near right*). In a pinch, I've used\
    \ the shank of a large drill bit—just be sure to protect your hands with gloves\
    \ (*photo at far right*). Also, take the time to smooth the surface of the burnisher\
    \ with a fine sharpening stone or by buffing it with a felt wheel and some jeweler's\
    \ rouge.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_188_2.png)\n![](img/82f8fd51f2b064bbc4df21354d664e50_188_3.png)\n\
    \n## APPENDIX:\nRestoring Old Hand Tools\n\nI love to bring an old hand tool back\
    \ to life. I often scrounge auctions and yard sales, looking for lively candidates.\
    \ As long as the castings are sound and dirt cheap, I'll adopt it and bring it\
    \ home. Keep in mind that I'm interested in using the tool so I'll do more to\
    \ it than a collector. Most collectors are interested in preserving the tool's\
    \ patina, and that's fine. But the once-over I give a tool (described here) put\
    \ most collectors in shock. If you're interested in collecting tools and want\
    \ to learn more about what you should or shouldn't do to an antique, visit the\
    \ Mid-West Tool Collectors Association website at www.wtca.org. They're a great\
    \ organization.\n\n### Disassemble and clean\n\nTo work on an old tool, I begin\
    \ by taking it completely apart (top photo). This lets me check the condition\
    \ of all the parts and makes them easier to clean. I'll clean most parts with\
    \ a mild detergent solution, if grease and resin have built up, I'll scrub this\
    \ away with a cloth or nonwoven abrasive pad dipped in acetone, mineral spirits,\
    \ or lacquer thinner (middle photo).\n\n### Remove rust\n\nNext, I'll tackle any\
    \ rusty areas (bottom photo). Depending on whether it's rust or heavily pitted,\
    \ this can require anything from scrubbing the part with a Wonderbar (a great\
    \ product) to using a wire brush, or even the magic of electrolysis (sidebar on\
    \ the opposite page).\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_189_0.png)\n\
    \n### Sharpen parts if necessary\n\nIf the tool employs a part with a cutting\
    \ edge, I'll sharpen it using my standard sharpening technique (top photo). For\
    \ more on sharpening, see pages 182—183.\n\n### Reassemble\n\nWhen all the parts\
    \ are clean, free from rust, and sharp (if applicable), I'll put the tool back\
    \ together (middle photo). As I do this, I'll add a drop or two of machine oil\
    \ to linkages and will usually apply a coat of oil-paste to cast-iron surfaces\
    \ to prevent future rust. If the tool has wood parts (like the plane shown here),\
    \ I'll apply a light coat of oil to them to keep out dry and grime. Then on the\
    \ best part—the tool best way to spend an afternoon in the shop!\n\n## REMOVING\
    \ RUST WITH ELECTROSIS\n\nHere's a slick way to remove rust from your tools using,\
    \ of all things, electrolysis. Electrolysis passes a small electrical current\
    \ through a battery charger through a rusty tool that's submerged in an electrolyte\
    \ solution. An exchange of ions takes place, and the rust flakes away. Here's\
    \ how to do it: First, mix an electrolyte solution (1 tablespoon of baking powder\
    \ per gallon of water) in a nonconductive, plastic container. Then, remove all\
    \ nonmetallic parts from the tool. Clamp the positive (red) lead of a 2-amp battery\
    \ charger to an anode—just as large, flat piece of steel (like a kitchen pan).\
    \ SAFETY NOTE: make all adjustments when you start to see bubbles forming on the\
    \ surface of the tool. Connect the negative (black) lead to the rusty tool completely\
    \ submerged in the solution. Turn on the battery charger, and check that it's\
    \ not drawing more current than it is rated. If it is drawing too much, or not\
    \ enough, move the tool further away or closer to the anode to prevent it from\
    \ corroding. Turn off the charger, put on rubber gloves, and fasten the clips.\
    \ The quickest way to remove crud is with an abrasive pad. Scrub the surface with\
    \ a pad dipped in warm, soapy water. If the rust is gone, you're done. If not,\
    \ repeat the process until it is.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_190_0.png)\n\
