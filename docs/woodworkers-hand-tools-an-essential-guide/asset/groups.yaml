    # JAPANESE SAWS


    If you haven''t already tried one, Japanese saws are another one of must-try tools
    (top photo). Unlike Western saws, which cut on the push stroke, Japanese saws
    cut on the pull (including myself). Many woodworkers feel that this affords better
    control. Also, because the blade is pulled through the cut, there''s less chance
    of crimping the blade. This means the blades can be thinner, in a thinner kerf.
    The metal used for Japanese saws is harder and the teeth are tempered to a high
    degree. This keeps them sharper longer, but makes them almost impossible to resharpen.
    This isn''t a negative, since the tooth geometry is complex (see the sidebar on
    page 55), and with many of these you can replace the blade when it dulls.


    # Dozuki


    Perfect for almost any hand-cut joinery (middle photo). Typically this saw has
    around 26 teeth per inch and can vary from 8" to 12" in length.


    # Ryoba


    The ryoba saw (pronounced Ree-OH-bah) is a terrific saw to have on hand, as it
    combines the functions of a Western crosscut and rip saw in one tool (bottom photo).
    Ryoba means "double" in Japanese, and this saw has cross teeth on one side of
    the blade and rip teeth on the other. These saws come in blade lengths varying
    from 7" to 13". The smaller saw works well for joinery and the larger versions
    are excellent for general-purpose cutting.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_55_2.png)


    # Azebiki


    The Azebiki saw (pronounced Eh-zeh-BEE) is a special type of ryoba (crosscut teeth
    on one side, rip teeth on the other) that is designed specifically to plunge cuts,
    such as a mortise or tenon in the center of a board (top photo). The blade is
    curved to let you easily start a cut in the middle of a work-piece. Its diminutive
    size makes it handy for getting into places other saws can''t. The curved blade
    also makes it easy for you to clear sawdust from the kerf by simply rocking motion
    as you.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_56_0.png)


    # Kugihiki


    The kugihiki saw (pronounced cog-hee-HEE) is another specialty that you might
    find useful. In Japanese, kugihiki means "to cut nails," as in wooden nails or
    dowels. The super-thin blade does not have a back like the dozuki, so it''s extremely
    flexible, but also prone to kinking. And just as important, the teeth on this
    style saw can rest on a surface without scratching it (middle photo). The downside
    to this is that binding can occur if you''re removing a lot of wood, such as when
    cutting off a through tenon.


    # TOOTH PROFILES


    If you examined the teeth of a Japanese saw with a magnifying lens, you''d find
    a complex geometry—the teeth are longer and thinner and have more faced surfaces
    than Western-style teeth (drawing right). This is particularly true of the crosscut
    tooth. Unless you''re willing to devote many hours to practicing these complex
    grinds, I suggest sticking with saws that have replaceable blades.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_56_1.png)


    # CUTTING TOOLS


    # CHECKING FOR DRIFT


    You''ve just bought a new back saw or dovetail saw, and after making a couple
    of test cuts, notice they aren''t straight. Is it you or the saw? Often it''s
    the saw. In many cases the set of the teeth is too aggressive or not even. When
    this occurs, the saw tends to drift one way or the other. To eliminate this, use
    the procedure below.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_0.png)


    # Cut for kerf


    Start by making a test cut in a scrap of wood, and don''t try to compensate if
    it starts to drift off course. Let it make its own kerf (top photo).


    # Check for drift


    Next, remove the saw from the kerf and check the kerf with a square (middle photo).
    Any deviation means that the teeth on one side are either set more aggressively
    or are sharper than the other side. This is also a good time to check for the
    overall set. Insert the blade back in the kerf and try to wiggle it; if there''s
    a lot of flop, the set is too aggressive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_1.png)


    # Correct the problem


    To reduce the set on one side of the saw, use an oilstone. Set the saw on a flat
    surface and add a drop or two of honing oil to the stone and rub it gently over
    the teeth (bottom photo). If the overall set is too aggressive, do this to both
    sides, taking the same number of strokes. Take just a few strokes with the oilstone
    and make another cut. Repeat as necessary until the saw no longer drifts and the
    blade doesn''t wobble in the kerf.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_57_2.png)


    # SPECIALTY SAWS


    # Hacksaw


    Hacksaw in the wood-shop? You bet. I often incorporate metal parts in many of
    the jigs, fixtures, and projects I build. Murphy''s Law says I want to use will
    be too long. A hacksaw, with its fine teeth and hardened blade, will make short
    work of cutting bolts, screws, even hinges (top photo). Choose blades with fine
    teeth for cutting hard metals and coarser teeth for softer materials.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_0.png)


    # Miter saw


    For the most part, miter saws like the one shown in the middle photo have been
    replaced naturally designed to fit in a miter box; they are basically long saws
    with crosscut teeth. If the blade is well sharpened and there''s no play in the
    guides, these can be used only for rough work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_1.png)


    # Compass saw


    The compass saw, or keyhole saw, has also been replaced by its electric cousins,
    the saber saw and jigsaw. Since this type of saw has no frame and a thin tapered
    blade, it can be used to make cuts where other saws can''t (bottom photo). The
    downside, with no frame and a thin, tapered blade, this saw is highly prone to
    bending and kinking in use. The only way to prevent this is to make light, non-rigorous
    cuts.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_58_2.png)


    You will see a surface change from dull to clear: rough-sawn or even machined
    is dull and as you clears in little waves, the burnished patches are spreading
    like sunshine touching a field under scattered clouds. — JAMES KRENOV


    Planing removes surface crud that you can see the true beauty that lies beneath.
    We''ve become brainwashed into thinking that our wood projects have to be as smooth
    as the artificial surfaces like Formica. This is so sad, because wood offers such
    a rich, sensual surface. And this natural beauty is often obscured by power sanders.
    Only hand-planing or scraping can produce the "burnished patches" we all appreciate.
    We glide our fingers on the well-worn edges of the table that Jasper made. We
    feel the irregularities—there''s comfort here. We can feel the marks left behind
    by his tools—his honest work. So why try to conceal our maker''s marks? We''ve
    come to believe that smoothness without flaws is best. I don''t buy it. Leave
    your mark; let everyone know that you made this piece by hand. Let the wood have
    its character. It did come from a tree, after all, not from a plastic factory.


    Clockwise from top left: a collection of Ohio Tool Company hand planes: Columbus,
    Ohio and Alburn, New York: No. 03, No. 05/1, No. 03/4, No. 06, No. 07 (in red),
    No. 08, No. 04/2, No. 04/4, No. 02, No. 51/2, No. 03 (in center).


    # PLANE TERMINOLOGY


    Hand planes are the workhorses of the woodworker''s shop...and I''m not talking
    about the cabinetmakers of yesterday. I''m talking about modern-day woodworkers
    who do fine, sensitive work. Anyone who knows me can tell you that I don''t get
    along with a block plane. But the great ''to sand or not to sand'' debate is enough
    to get me. I''m not a tourist: I do use power sanders. But truly love using my
    planes. And I reach for them whenever I can because, like Krenov, truly believe
    they leave a superior surface.


    It''s said to see so many woodworkers jump on the power sanding bandwagon as a
    standard way of working. I''ve seen guys spend hours sanding out uneven surfaces
    or imperfections that could have been taken off in minutes with a sharp plane.
    And to watch beautiful bird''s eye maple lose its crispness in sanding place of
    a scraper just seems like a waste. If you have not had the pleasure of shearing
    off thin, wispy shavings from a board while working up a light sweat, I heartily
    recommend it.


    The three types of planes you''ll find most useful in the shop are jack or jointer
    planes, block planes and specialty planes. Jack and jointer planes are used for
    smoothing planes, joining edges, and all-purpose planing. Block planes, with their
    shorter blades and bevel-up blades, are great for trimming, fine-tuning joints,
    and ending grain (bottom drawing). The bulk of the remaining planes you''ll find
    handy classified as specialty planes. These include rabet planes, shoulder planes,
    chisel planes, circular planes, combination planes, and so on:


    ![](img/82f8fd51f2b064bbc4df21354d664e50_61_0.png)

