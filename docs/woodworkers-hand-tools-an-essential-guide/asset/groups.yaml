    # Gap under Cap Iron

    Allows Shavings to Jam


    iron (bottom drawing on opposite page).

    A poorly tuned frog is the leading

    cause of blade chatter. For a frog to

    do its job well where it contacts the

    them, the sole, and the sloped face that holds

    t plane iron—must be absolutely

    flat and square. To flatten these, I

    use a diamond hone or a small stone

    and gently rub it on the surface.

    Check often with a straightedge.


    # Cap iron


    A sloppy cap iron can also cause chatter. Its

    job is to add rigidity to the plane and prevent

    from flexing. The slight hump at the end also

    erves as a wedge to break chips as the iron cuts

    into the wood. Neither of these will happen if

    t cap iron doesn''t fully contact the entire

    edge of the plane iron. And a poorly fitting cap

    iron can allow shavings to Jam up between the

    cap iron and the blade (top drawing). The solution

    to all these problems? Ensure full contact by

    flattening the front edge of the cap iron on an

    oilstone.


    Before you attach the cap iron to the blade,

    t blade needs to be sharpened. (For an in-depth

    look at sharpening, see pages 182-183.) Then re-

    attach the cap iron and secure it to the blade to

    check for gaps (middle photo). Position the cap

    iron on the blade square to the front edge and

    set back about 1/16.


    # Handle and knobs


    If the handle and knobs of the plane are in

    good shape, take a moment to tighten the

    screws that secure them to the plane body.

    There''s usually one for the knob and two for the

    handle (bottom photo). If the handle is cracked or

    broken, replace it with a new one (see the sidebar

    on page 66).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_66_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_66_1.png)


