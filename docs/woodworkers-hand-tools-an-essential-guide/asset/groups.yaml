    ## 组合刨


    与大多数只能处理单一任务的刨子不同，组合刨的设计是为了胜任多种刨削工作。事实上，一些制造商将这些刨子称为“通用型”。一份旧的史丹利（Stanley）目录（1909年版权）将其
    55 号型号推崇为一种“能完成比一整套所谓‘花式刨’更多种类工作的刨子”。最著名的两个组合刨是史丹利 45 号（上图）和 55 号（下图）。它们可以用于开槽、槽槽、槽槽、滚线槽、榫头、圆弧、装饰线条、棱条、凹槽和圆槽。它们都由一个铸铁主体和一个木制手柄组成。围挡通过一对导轨安装在刨身上，并内置了深度调节装置以实现精确的重复切割。


    尽管我确定这些刨子对于厌倦了在刨子箱中翻来找去的工匠来说确实是个好主意，但“通用型”刨也有几个缺点。首先，这些巨兽需要一些设置时间。每当你切换功能时，都必须更换刀片、添加或移除部件并进行一些调整——这不像直接从工具箱里拿一把造型刨那么方便。其次，它们没有使用排屑器，且刀片没有支撑。将这两者结合，就会产生刀片崩角的倾向。当电电木铣出现后，组合刨就被冷弃了。如今，它们主要被工具收藏家和喜欢用老方法木木的人所追求。组合刨在工具修复者中非常受欢迎，因为它们留下了电铣或修刨无法留下的工具痕迹。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_2.png)


    ## 刮刨


    最容易混淆的两种手工工具是刮刨和柜体刮刨（第99页）。部分原因是史丹利多年来生产 12 号刮刨，其外形与典型的柜体刮刨相似。但有许多地方让这两种工具区别开来。刮刨（上图）由一个类似刨的主体组成，主体以精确的角度固定刮刀片：垂直于平面
    25 度（中间插图）。这使其成为处理扭曲木材和其他难以刨削木材工作的首选工具。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_96_1.png)


    这种配置相比柜体刮刨的优势在于，较长的刀片可以防止它在表面缺陷处凹凸波动；而是使表面变得平整。与柜体刮刨不同（柜体刮刨的刮刀片通过拇指螺钉弯曲以产生更多的挖掘式切削），刮刨的刀片是平直的，并沿着其整个宽度切割（下图）。然而，刀片的磨刃方法与柜体刮刨一样：沿
    45 度斜角进行磨削，然后在刃口抛光出一个刃口（更多信息请参阅第 186-187 页）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_96_2.png)


    ## 手持刮刀


    当我第一次看到刮刀在工作时，我确信其中包含了某种魔法。我的一个木工朋友正用它来平整一幅由几块虎纹枫木制成的板材。这种材料因容易撕裂而声名狼藉；但我的朋友却在用手持刮刀刮出令人愉悦的极薄刨屑。在这一块像标准索引卡大小的平直金属片上，做到这似乎是不可能的（上图）。


    刮刀实际上并不是平的——它的边缘经过了仔细磨削，然后通过火烧在末端形成一个微小的钩子或刃口。这个刃口（中间插图）正是刮刀起作用的关键。实际上，它充当微型刀片。它在难以刨的木材上效果很好的原因之一是刃口非常小。曲线的紧密半径起了排屑器的作用，几乎瞬间切断刨屑，从而大大减少了崩裂的概率。手持刮刀传统上按
    90 度磨刃，但一些木工更偏于常用柜体刮刀和刮刨那种更激进的 45 度角。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_0.png)


    | 平底刮刀 | 45°刮刀 |

    | :--- | :--- |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_1.png)


    ## 鹅颈刮刀


    鹅颈刀或弯形刮刀是一种特殊的手持刮刀，旨在让你平整曲面表面（左图照片）。曲线沿边缘各异，因此你可以调整刮刀的位置以匹配木材的弧度。


    争论点之一是拉还是推。我实际上两种都用，而且心中并没有绝对优劣之分。


    ### 推


    当我有大量的木屑需要处理时，我更倾向于推刮刀（上图）。这种方法能让更多的身体力量作用在推力上，且不易疲劳。在推时更容易维持所需的弯度，特别是当我需要产生较多刨屑时。推的缺点是缺乏拉式刮刀提供的控制力。


    ### 拉


    拉式刮刀的人认为它提供了更好的控制力。我完全赞同。当我用手持刮刀进行最后的修光时，我经常切换到拉推（中间照片）。除其他因素外，这种方法让你看到操作区域——不像刮刀会遮挡表面。唯一的问题是，我不觉得这种手部位置很舒适。手臂不是收在体内，而是向身体延伸。而且弯曲刀片变得很累。


    ### 弯曲


    有时，你会发现侧立使用刮刀很有用，例如在清理槽槽时。侧立握持比侧卧握持更容易弯曲刮刀。然而，你需要磨削末端，这样在侧立使用时才会比较舒服。我有一把专门为此用途磨过的旧刮刀。


    ### 寻找角度


    困难之处在于寻找角度。就像刨子一样，表面通常会被工具遮挡。弯曲得越大，去除的表面面积就越多。


    ### 斜切


    就像刨子一样，斜切产生的切削更多。注意，如果你斜切，工具会顺着起伏移动。


    '
