  - '[PAGE 143]


    Even experienced woodworkers tend to hold a hammer with a weak grip. The most
    common mistake is to choke up on the handle as if it were a baseball bat (top
    photo). And just as with a baseball bat, this will rob the hammer of any power,
    greatly reducing its ability to drive a nail. Some might say that this affords
    better control; without power, the hammer is useless. It''s better to learn to
    control the hammer with the proper grip.


    # Handshake grip


    To get the maximum mechanical advantage from a hammer, you need to grip the handle
    near the end (middle photo). Place the end of the handle in the meaty part of
    your palm, and wrap your fingers around the handle. Stay away from a white-knuckle
    grip, as this will only tire your hand. For less power and a bit more control,
    position the handle just below the palm, and grip. This takes the hammer out of
    alignment with your arm and shoulder, but you may find it more comfortable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_0.png)


    # PULLING NAILS


    Even with the correct grip and stance, you''ll occasionally hammer in a nail crooked
    or in the wrong place. Pulling out nails in a woodworking project is a bit different
    than in carpentry. With you generally don''t care about dents in the surface of
    a 2x4. On a finished or near-finished woodworking project, this could be disastrous.


    Here are two quick ways to avoid dents caused by the hammer. One way is to slip
    a scrap of wood under the head of the hammer to keep it from crushing the surface
    as is to pivot out the nail (top photo at left). A similar method that works particularly
    well for stubborn nails is a slotted wedge. The wedge creates better leverage
    while at the same time protecting the surface (bottom photo at left).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_2.png)'
  - '[PAGE 144]


    # TUNING HAMMER


    I learned to “tune” a hammer from an old carpenter. It was something he''d do
    as he packed up his tools every Friday. Although it''s unlikely that you''ll need
    to tune your hammers once a week as he did, it''s a good idea to inspect them
    regularly and tune them when needed. This takes only 5 minutes and consists of
    flattening the face, sharpening the claws, and maintaining the handle.


    # Flattening the face


    With use, the face of a hammer tends to get dinged up. This makes it difficult
    to hit a nail squarely on the head. Also the ‘pockets’ created by the dings can
    collect rust and other junk. It just makes sense to routinely flatten the face
    of your hammers by taking a few light strokes with a smooth mil (top photo).


    # Sharpening the claws


    The claws on a hammer will also get dinged and worn over time. There are two areas
    that need attention. First, since I often drive the claws of the hammer into a
    2x4 when framing so I can lift it, I like to keep the ends sharp. A few licks
    with a file will bring back a sharp edge (middle photo). The inside edges of the
    claws are used to “bite” into these edges by rocking the head of hammer on sandpaper.


    # Handle


    What you do to a handle will depend on what it''s made of. All handles should
    be cleaned regularly to remove pitch and dirt. Wood handles will benefit from
    an occasional coat of oil. Also, don''t hesitate to shape a wood handle to better
    fit your hand (bottom photo). Go over metal handles lightly with an emery cloth
    to remove any rust. Follow this with a light coat of machine oil. Little can be
    done with composite handles except regular cleaning.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_144_0.png)'
- md: '

    ## REPLACING A HANDLE


    Over time, the handle on a hammer can get cracked or break. Frankly, it''s easy
    to replace a handle—as long as it''s sized correctly. I suggest taking the old
    hammer handle with you to the hardware store or home center when you shop for
    a replacement; or make one yourself; use the old handle as a pattern. Before you
    install the replacement handle, of course, you''ll need to remove the old one.
    Just saw off the head and then drive out the waste with a punch or large bolt.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_0.png)


    ## Cut kerfs


    To get ready the handle for the head, you''ll first need to fit the tenon. A file
    will make quick work of this. Work around the tenon, removing the same amount
    on all four sides until the tenon slips into the head all the way and the shoulders
    bottom out. If the fit is good, mark and cut off the waste that protrudes above
    the head. Then remove the handle and cut three kerfs in the end. Cut a lengthwise
    kerf for a wood wedge, and two kerfs across the width for metal wedges (*top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_1.png)


    ## Drive in wedges


    Now you can slide the handle back in the head and install the large wood wedge.
    This wedge pushes the sides of the tenon out to grip the head. Don''t be shy here—drive
    it in as far as it will go (*middle photo*). All that''s left to drive in the
    metal cross wedges that spread the tenon out evenly in the head (*bottom photo*).
    Drive into the kerfs you cut earlier until they''re flush with the head. That''s
    it: You''re ready to go.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_145_3.png)


    ## WARRINGTON HAMMERS


    I have a couple of different sizes of Warrington hammers in my tool chest (top
    photo). These lighter-weight hammers are ideal for driving finish nails and small
    brads. Instead of a claw, a Warrington hammer has a small, wedge-shaped cross
    peen that makes it especially useful for driving in brads. The cross peen is a
    real finger-saver when working with short, small brads (middle photo). Why? Because
    the cross peen will actually fit between my fingers to start the brad. Once it''s
    started, I flip the hammer to use the flat face to drive the brad. Another unique
    feature of this tool is the faces called "side strikes" on the sides of the hammer
    that drive nails in tight spaces.


    Warrington hammers are available in four different weights: 3/2, 6, 10, and 12
    ounces. I have a 6- and 10-ounce hammer, and I can comfortably handle most tasks.
    There''s something odd about these hammers: The end of the cross peen is either
    ground or cast to come to a point instead of being flat. This actually makes it
    difficult to start a brad, as the point will glance off the head of the brad.
    Try filing the point flat to make the tool more usable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_0.png)


    ## NAIL SET


    One of the secrets to nailing effectively is knowing when to stop driving the
    nail with a hammer. The closer you get to the surface, the greater the chance
    of dinging it with the face of the hammer. To eliminate the chance of dings, stop
    when the head of the brad or nail nears the surface—usually 1/16" to 1/8". Then
    reach for a nail set (photo at right). A nail set is designed to finish the job
    by driving the nail below the surface, or "setting" it. Nail sets available are
    various tip diameters; choose one that is closest to the diameter of the nail.
    Place the set on the nail and tap it to gently set it below the surface. Keep
    a firm grip on the set, since it''s for it to slip off and end up driven into
    the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_2.png)


    ASSEMBLY TOOLS 145


    ## BALL-PEEN HAMMERS


    Even though most of the work I do is in wood, I often find use for a ball-peen
    hammer (top photo). A ball-peen hammer is handy when I need to work with metal—I
    incorporate into jigs and fixtures. I also use a ball-peen hammer—when I work
    with the metal hardware I install in many projects. A ball-peen hammer (sometimes
    called an engineer''s hammer) has a standard flat face on one end and some type
    of peen on the other.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_0.png)


    ## Head styles


    There are three prevailing head styles for peened hammers: a straight peen, a
    cross peen, and by far the most common, the ball peen (middle drawing). Cross
    peens are popular on Warrington hammers, while straight peens are rarely seen
    outside of the metal shop. The rounded head of a ball-peen hammer is used mostly
    for riveting (see the sidebar). Though I don''t use a lot of rivets, I often peen
    brass rods to attach parts to handles on some of the fine tools I make.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_3.png)


    ## RIVETING


    Riveting is a three-step process. First, a rivet is inserted through the parts
    to be joined, and the flat face of the hammer is used to “mushroom” the end (drawing
    at left). Then, the hammer is flipped and used to further shape the rivet into
    a dome. Finally, a rivet set is used to create a smooth surface on the end.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_147_4.png)


    146 ASSEMBLY TOOLS


    ## JAPANESE HAMMERS


    The first time I picked up a Japanese hammer, I knew I had to have one. Its compact
    head and sturdy handle gave it balance I''d never found in a Western hammer (top
    photo). The types of Japanese hammers you''ll likely find in your shop are the
    chisel hammers and the plane-adjusting hammers.


    ## Chisel hammers


    Chisel hammers may have one of two head styles: barrel or flat (middle drawing).
    The flat type are more common and are usually made of high-quality tool steel
    and tempered to produce a tough, durable head. Since both faces are identical,
    some woodworkers prefer the barrel-head chisel hammer; they feel that this more
    compact design centers the weight closer to the handle, so they have greater control.
    These stubby heads are usually tempered so they''re soft on the inside and hard
    on the outside. The theory is that this type of tempering reduces "bounce."


    ![](img/82f8fd51f2b064bbc4df21354d664e50_148_0.png)


    ## Plane-adjusting hammers


    Plane-adjusting hammers can be identified by their thin, slender heads and highly
    polished finish (bottom photo). Because of the degree of finish, these hammers
    are intended for use only on planes to adjust the cutters. Granted, you could
    use a different hammer for this task, but the face will probably be dinged or
    dented—these marks will transfer to the wood body of the plane—not a good way
    to treat a valuable tool.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_148_1.png)


    ## BRAD DRIVERS


    A brad driver is one of "only" tools: when you need it, it''s the only tool for
    the job. Brad drivers install brads and small nails by driving the brad into the
    wood (itself)—no hammer necessary. There are two basic types of brad drivers:
    a push-style driver that looks like an anvil on steroids, and an odd-looking,
    hand-operated device that''s sort of a cross between a small clamp and a nutcracker
    (top photo).![](img/82f8fd51f2b064bbc4df21354d664e50_149_0.png). The push-style
    driver works well in tight quarters; framers (the picture variety) are partial
    to the hand-operated type.


    ## Basic use


    To use a push-style brad driver, insert the brad into the hollow barrel; a magnet
    holds it in place until it''s driven in. Then place the tip where you want the
    brad and push. The spring-loaded barrel retracts up the shaft while driving in
    the brad (middle photo). With the hand-operated type, you need to hold the brad
    in position with one hand and squeeze the handle with the other.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_149_1.png)


    ## BLIND-NAILERS


    Occasionally, you may need to nail a part in place where the head absolutely cannot
    show. You could set the brad and apply putty, but this is still visible. To do
    the job without leaving a trace, consider blind-nailing. With this technique,
    a tiny sliver of wood is peeled up from the surface to create a hiding place for
    the nail. The nail is driven in, the sliver is glued back down, and the nail disappears.
    The sliver can be peeled back with the corner of a chisel, or with a blind-nailer—sort
    of a tiny plane with a protruding blade (photo above right).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_149_2.png)


    148 ASSEMBLY TOOLS

