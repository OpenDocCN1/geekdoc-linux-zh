  - '[PAGE 95]


    # COMBINATION

    PLANES


    Unlike most planes that handle a single task, combination planes-planes were designed
    to take on many planing jobs. In fact, some manufacturers referred to these planes
    as "universal". An old Stanley catalog i (copyright 1909) touts their model No.
    55 as a plane that "will do a greater variety of work than can be done with a
    full line of so called Fancy Planes." Two of the more famous combination planes
    are the Stanley No. 45 (top photo) and No. 55 (bottom photo). They can be used
    to cut grooves, dadoes, rabbets, beads, tongues, ovolos, molding, reeds, hollows
    and rounds. Both consist of a cast-iron body with a wooden handle. A fence attaches
    to the body with a pair of guide rails, and built-in depth adjustment for accurate
    repeat cuts.


    Although I''m sure these planes sounded like a great idea to make craftsmen who
    were tired of unplugging around a box of planes, there are couple of disadvantages
    to a "universal" plane. First, these beasts require some setup time. Every time
    you want to switch functions, you have to change cutters, add or remove parts,
    and make some adjustments-not as convenient as reaching into the toolbox for a
    molding plane. Second, no chip breakers are used and the cutters aren''t supported.
    Combine these and you have a tendency toward cutter. When the electric router
    was introduced, combination planes fell by the wayside. Nowadays, they''re sought
    mostly by tool collectors and individuals who like working wood the old ways.
    Combination planes are popular with tool restorers because they leave tool marks
    that a router or shaper doesn''t.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_95_2.png)'
  - '[PAGE 96]


    ![](img/82f8fd51f2b064bbc4df21354d664e50_96_0.png)


    # SCRAPER PLANES


    Two of the most often-confused hand tools are the scraper plane and the cabinet
    scraper (page 99). Part of this is because Stanley manufactured a No. 12 scraper
    plane for many years that somewhat resembles the typical cabinet scraper. There
    are a number of things, that set these two tools apart. A scraper plane (top photo)
    consists of a plane-like body that holds a scraper blade at a precise angle: 25
    degrees from vertical (middle drawing). This makes it the tool of choice for dealing
    with squirrelly and other hard-to-plane work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_96_1.png)


    The big advantage this setup has over the cabinet scraper is that the longer prevents
    it from dipping in and out of surface imperfections; instead, it levels off the
    surface. And unlike a cabinet scraper, where the scraper blade is bowed (via a
    thumbscrew) to produce more of a scooping cut, the blade of a scraper plane is
    flat and cuts along its full width (bottom drawing). The blade, however, is sharpened
    like that of a cabinet scraper: ground around a 45-degree bevel and then a burr
    is burnished on the edge (see pages 186-187 for more on this).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_96_2.png)'
  - '[PAGE 97]


    # HAND SCRAPERS


    The first time I saw a scraper in action, I was sure some form of magic was involved.
    A cabinet-maker friend of mine was using one to smooth a panel made of several
    pieces of tiger-stripe maple. Now this stuff has deservedly nasty reputation for
    tearing apart; but my friend was pulling off delightfully thavings with a hand
    scraper. It just didn''t seem possible to do with this plain piece of metal about
    the size of a standard index card (top photo).


    The scraper wasn''t actually plain—its edges had been carefully sharpened and
    then burned to form a tiny hook or burr on the end. This burr (middle drawing)
    is what makes a scraper work. In effect, it serves as a tiny blade. One of the
    reasons it works so well on hard-to-plane woods is that the burr is so small.
    The tight radius of the curve acts as a chip breaker to almost instantly break
    a shaving so that the chance of tear-out is greatly reduced. The hand scraper
    is traditionally sharpened at 90 degrees, but some woodworkers prefer the more
    aggressive 45-degree angle that common cabinet scrapers and scraper planes.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_0.png)


    | FLAT SCRAPER | 45° SCRAPER |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_1.png)


    # GOOSENECK SCRAPERS


    Gooseneck or curved scrapers are a special type of hand scraper designed to let
    you smooth curved surfaces (photo at left). The curves vary along the perimeter
    so you can position the scraper to match the curve of your work-piece. These work
    reasonably well but can be difficult to sharpen and burn. As a general rule, I
    recommend that you find the curve you want, mark a couple of pencil lines on the
    scraper, and concentrate on sharpening and burnishing this area. If you were to
    create a burr along the entire perimeter, it would dig into your fingers during
    use.'
  - '[PAGE 98]


    Besides knowing how to sharpen a scraper (see pages 186-187), there are a couple
    of tricks to the "magic" of a scraper: flexing, finding the angle and skewing.


    # Flexing


    Technically, you can use a scraper without flexing it at all. The problem is your
    asking the scraper to take off shaving its full width. For a standard scraper,
    that''s around 4/2" to 6" wide! Even with a sharp scraper and a lot of elbow grease
    this would be difficult. Instead, you can reduce the cutting area by flexing the
    scraper slightly (top photo). Grip the ends of the scraper with both hands, and
    press lightly in the middle with both thumbs. Note that the greater the flex,
    the smaller the cutting area and the more of a scooping cut you''ll make.


    # Finding the angle


    Here''s the tricky part that confuses a lot of woodworkers: finding the correct
    scraping angle. What makes such a challenge is that it''s different for every
    scraper, and will most likely change every time you burnish the edge. And that''s
    normal. Burnishing isn''t an exact science, and the angle will change. As long
    as you can feel a buzz, all you have to do is tilt the scraper forward or backward
    until it "bites into the wood (middle photo). When it does, just lock your wrists
    in this position and start scraping.


    # Skewing


    Just as with a hand plane, skewing a scraper produces more of a shearing cut and
    will likely produce nicer shavings (bottom photo). Note that if you''re producing
    dust, either your scraper is dull or you''re at the wrong angle. It''s also important
    to remember that when you skew something, you effectively reduce its ability to
    smooth out highs and lows—instead, the tool will follow surface undulations.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_2.png)'
  - '[PAGE 99]


    One of the scraper debates is whether ''tis nobler to pull or push. I actually
    use both motions, and in mind there is no right or wrong way—just go with what
    feels natural for you.


    # Pushing


    When I''ve got a lot to scrap to do, I prefer to push the scraper (top photo).
    This method gets more of your body behind the stroke and is less fatiguing overall.
    It''s easier to maintain the desired flex while pushing, especially if it flexed
    a lot and I''m making more of a scraping cut. The disadvantage of pushing is that
    it lacks the control that pulling a scraper offers.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_99_0.png)


    # Pulling


    Those who pull a scraper feel it offers better control. I couldn''t agree more.
    Whenever I''m making the finishing passes with a hand scraper, I often switch
    to the pull stroke (middle photo). Among other things, this method lets you see
    what you''re doing—unlike the scraper, which obscures the surface. The only problem
    is, I don''t find the hand position very comfortable. Instead of my arms being
    tucked in, they extend away from my body. And flexing the blade becomes tiring.
    It''s easy to see why I use this for finish passes and not for the bulk of the
    removal.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_99_1.png)


    # On edge


    Occasionally, you may find it useful to use a scraper on edge, such as when you''re
    cleaning out a rabbet (bottom photo). Holding it on end allows you to flex the
    scraper more easily than if it were on its side. However, you''ll need to sharpen
    the end, which will make it comfortable to use on its side. I have an old scraper
    sharpened just for this use.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_99_2.png)'
- md: "\n# CABINET SCRAPER\n\nAs I mentioned on page 95, the cabinet scraper has often\
    \ been confused with the scraper plane. The cabinet scraper (often called a double-handled\
    \ scraper) is designed to reduce the fatigue associated with hand scraping (top\
    \ photo). It's basically a metal body that holds the scraper blade at a preset\
    \ angle, typically around 110 degrees. The blade is held in place by a pair of\
    \ retaining screws, either slotted or with knurled ends (middle drawing). The\
    \ traditional grinding angle of a cabinet scraper's blade is 45 degrees. This\
    \ creates a sturdier blade that can take a more aggressive cut.\n\nJust like a\
    \ hand scraper, the blade of a cabinet scraper should be flexed to create the\
    \ desired depth of cut—and here's the real beauty of this tool shows. Instead\
    \ of wearing out your thumbs by flexing the blade, the blade is flexed by way\
    \ of a thumbscrew threaded through the body (bottom drawing). To adjust the flex,\
    \ tighten the retaining screws with the adjustment screw slack. Then tighten the\
    \ thumbscrew for the desired cut and make a test shaving. Like the scraper plane,\
    \ a cabinet scraper works well on thin or delicate stock that could easily tear\
    \ if a hand catch or dig into the surface.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_100_0.png)\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_100_1.png)\n\n# HANDLED SCRAPERS\n\n\
    A Variation of the cabinet scraper is the handled scraper (top photo). These are\
    \ designed to be used with either one hand or two. The handled scrapers at left\
    \ in the photo are called shave hooks, and are basically scraper blades attached\
    \ to metal rods inserted into wood handles. The scraper blades come in a variety\
    \ of shapes and sizes and are intended mostly to remove paint and old finishes\
    \ on moldings and other curved surfaces. But I've found that if you sharpen them\
    \ properly and roll a nice burr on the end, they can work much better than a gooseneck.\n\
    \nThe middle and far right scraper in the photo are basically paint scrapers,\
    \ good primarily for removing glue squeeze. The Sandvik scraper (far right) features\
    \ a triangular carbide blade that stands up very well and can be rotated to a\
    \ fresh edge when one side dull.\n\nOne of my favorite handled scrapers is my\
    \ grandfather's Stanley No. 82, shown in the middle photo. It's quite an interesting\
    \ tool that works surprisingly well. Although the actual scraper blade is small,\
    \ it fits in a sturdy head that can be adjusted to the angle. In use, you grip\
    \ the handle with one hand and press down on the front knob with the other (bottom\
    \ photo). This produces a considerable amount of pressure on the blade, and you\
    \ can remove a lot of wood quickly. At the same time, a light touch can produce\
    \ thin, wispy shavings. Even though these scrapers aren't being made anymore,\
    \ you can regularly find them at auctions, at yards sales, and on the Internet\
    \ for just a couple of dollars.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_101_0.png)\n\
    \n# BEADING TOOLS\n\nA beading tool is sort of a hybrid between a scraper and\
    \ a plane (foreground in top photo). They're often confused with beading planes\
    \ (background in top photo), like my Stanley No. 50, that have molded cutters\
    \ sharpened like plane blades. To make things even more confusing, this particular\
    \ beading tool looks like a spokeshave (see page 124). A beading tool is designed\
    \ to hold a variety of cutters to carve beads, reeds, flutes, grooves, and other\
    \ decorative edges. Since they're slow-cutting and with the grain, they work well\
    \ until been superseded by the portable router. So it might inspire you to learn\
    \ that they are still being made. The beading tool shown here is made by Lie-Nielsen\
    \ Toolworks (www.lie-nielsen.com) and is a reproduction of the old Stanley No.\
    \ 66.\n\nSo if the beading tool has been replaced by the router, why is it still\
    \ being made? Nostalgia? The answer is that this classic tool outperforms its\
    \ modern counterpart in two important ways. First, the small \"sole\" of the tool\
    \ allows you to easily follow a three-dimensional curve (such as a cabriole leg),\
    \ where the larger base of a router can't travel. Second, you can make your cutters\
    \ to match antique molding—or create your own, for that matter.\n\nA beading tool\
    \ is similar to a scraper in that the cutter reaches again against the body at\
    \ a preset angle and is held in place with one or more screws (bottom drawing).\
    \ Quality beading tools come with one or more fences help guide the cutter along\
    \ the edge of the work-piece.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_102_0.png)\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_102_1.png)\n\n# Selecting the cutter\n\
    \nTo use a beading tool, start by selecting the desired cutter. Loosen the knurled\
    \ knob and slide the cutter in place (top photos). If you can't find the profile\
    \ you're looking for, Lee-Nielsen supplies blanks with the tool you want (technically\
    \ the negative of the profile you want).\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_103_0.png)\n\
    \n# Adjusting the cutter\n\nOnce you've got the profile set, you can adjust it\
    \ (middle photo). If the profile is off, you'll need to adjust the cutter or the\
    \ tool itself.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_103_1.png)\n\n# Basic\
    \ use\n\nThe big thing to keep in mind when using it is patience. Even with a\
    \ sharp tool, you should take it slow.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_103_2.png)\n\
    \n# SHOP-MADE SCRATCH STOCK\n\nA scratch stock is basically a handle with a screw\
    \ to hold the blade. It is used to create scrapings on curved surfaces.\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_104_0.png)\n\
    \n# Making your own\n\nYou can make your own cutter from an old blade. Just make\
    \ sure to flatten the back (top photo).\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_104_1.png)\n\
    \n# SANDPAPER\n\nNo chapter about smoothing tools would be complete without discussing\
    \ sandpaper. Like many woodworkers, loathe sanding. It's messy work that I try\
    \ to keep to minimum. Whenever possible, I reduce hand- or power-sanding with\
    \ the appropriate use of planes and scrapers. But unless a project consists mainly\
    \ of flat, square surfaces, I end up using sandpaper.\n\n# Types of sandpaper\n\
    \nThere are three main types of sandpaper that are commonly used in a woodshop:\
    \ silicon-carbide, garnet, and aluminum-oxide (to bottom in the top photo). For\
    \ years, all that was available was garnet sandpaper, made from finely crushed\
    \ semipreci stones. This type of paper tends to dull and wear out quickly but\
    \ has the best reputation for smoothing without leaving scratches. Silicon-carbide\
    \ paper (often called wet/dry sandpaper) is used primarily for sanding between\
    \ coats of finish, since it can be used wet. Aluminum-oxide is a relatively new\
    \ abrasive that stands up and lasts much longer than garnet.\n\nRegardless of\
    \ the type of abrasive, all sandpaper is categorized by grits that define the\
    \ particle (see the chart below).\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_105_0.png)\n\
    \nTri-Fold Creates 3 Separate Sanding Surfaces\n\n| Specified grit ANSI CAMP*\
    \ | 600 | 400 | 320 | 280 | 240 | 220 | 180 | 150 | 120 | 100 | 80 | 60 |\n| Particle\
    \ size (in microns) | 16 | 23.6 | 36 | 44 | 53.5 | 64 | 79 | 95 | 113 | 136 |\
    \ 189 | 266 |\n\n*ANSI = American Standards Institute  \n**CAMI = Coated Abrasive\
    \ Manufacturers Institute\n"
  mdcn: "\n\n# 橱柜刮刀 (Cabinet Scraper)\n\n正如我在第95页提到的，橱柜刮刀经常与刮光刨混淆。橱柜刮刀（通常称为双手柄刮刀）的设计目的是为了减少手工刮削带来的疲劳（顶部图片）。它基本上是一个金属刀体，以预设的角度（通常为110度左右）夹持刮削刀片。刀片通过一对固定螺钉固定，可能是槽口的或带有滚花纹的（中间插图）。橱柜刮刀刀片的传统磨削角为45度。这使得刀片更加坚固，能够进行更激进的切削。\n\
    \n与手刮刀一样，橱柜刮刀的刀片需要弯曲以产生所需的切削深度——这正是这个工具真正的魅力所在。你不需要通过弯曲刀片来磨损大拇指，而是通过穿过刀体的拇指螺来弯曲刀片（底部）。要调整弯曲度，请收紧固定螺钉使调节螺丝松动。然后拧紧拇指螺以达到所需的切削深度，并进行测试。像刮光刨一样，橱柜刮刀在处理薄或脆弱的木料时表现良好，而这些木料如果被卡住或陷入表面，很容易发生撕裂。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_100_0.png)\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_100_1.png)\n\
    \n# 手柄刮刀 (Handled Scrapers)\n\n橱柜刮刀的一种变体是柄刮刀（顶部图片）。这些工具设计为单手或双手使用。照片左侧的手柄刮刀被称为修边钩（shave\
    \ hooks），基本上是插入木手柄的金属杆上的刮削刀片。刮削刀片有各种形状和大小，主要用于去除线条和其他弯曲表面的油漆和旧涂层。但我发现，如果能正确地磨利它们并在末端滚出良好的毛刺，它们的效果会比鹅颈刨（gooseneck）好得多。\n\
    \n照片中间和最右侧的刮刀基本上是油漆刮刀，主要用于去除溢出的胶水。Sandvik 刮刀（最右侧）具有三角形碳化钨刀片，非常耐用，且当一侧变钝时可以旋转以露出新的刃口。\n\
    \n我最喜欢的手柄刮刀之一是我爷爷的 Stanley No. 82，位于中间所示。它是一个非常有趣的工具，效果出奇地好。虽然实际的刮刀片很小，但它安装在一个坚固的头部上，头部可以调节角度。使用时，你用一只手握住手柄，另一只手按前面的旋钮（底部图片）。这会在刀片上产生巨大的压力，你可以快速去除大量木材。同时，轻触也能产生纤薄如蝉翼的刨屑。尽管这些刮刀已经不再生产了，但你经常可以在拍卖会、跳蚤市场和网上只需几美元就能找到它们。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_101_0.png)\n\n# 滚边工具 (Beading Tools)\n\
    \n滚边工具是刮削刀和刨的一种混合体（顶部图片前景）。它们经常与滚边刨（顶部图片背景）混淆，例如我的 Stanley No. 50，后者具有像刨刀一样磨利的成型刀头。为了让情况更加困惑，这种特定的滚边工具看起来像推刨刨（spokesave，见第124页）。滚边工具的设计用于安装各种刀片，以刻出滚边、簧槽、凹槽和其他装饰性边缘。由于它们是顺纹切削且速度较慢，在被便携式修铣机取代之前一直非常好。因此，了解它们仍在生产可能会带给你启发。这里展示的滚边工具由\
    \ Lie-Nielsen Toolworks (www.lie-nielsen.com) 制造，是旧款 Stanley No. 66 的复制品。\n\n\
    既然滚边工具已经被修铣机取代了，为什么还在生产呢？为了怀旧吗？答案是，这款经典工具在两个重要方面优于它的现代产品。首先，工具较小的“底座”允许你轻松跟踪三维曲线（如卡里奥椅腿），而修铣机较大的底座无法到达这些区域。其次，你可以制作刀片来匹配古董线条——或者说，创造你自己的线条。\n\
    \n滚边工具与刮削刀相似之处在于，刀片以预设的角度再次接触主体，并用一个或多个螺钉固定（底部插图）。优质的滚边工具带有一个或多个挡板，帮助引导刀片沿作品边缘移动。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_102_0.png)\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_102_1.png)\n\
    \n# 选择刀片 (Selecting the cutter)\n\n使用滚边工具时，首先选择所需的刀片。松开滚花旋钮，将刀片滑到位位置（顶部图片）。如果你找不到所需的轮廓，Lee-Nielsen\
    \ 会随工具提供你所需的毛坯（技术上讲，是你所需轮廓的反型）。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_103_0.png)\n\
    \n# 调节刀片 (Adjusting the cutter)\n\n一旦设定了轮廓，就可以对其进行调整（中间图片）。如果轮廓不对，你需要调整刀片或工具本身。\n\
    \n![](img/82f8fd51f2b064bbc4df21354d664e50_103_1.png)\n\n# 基础使用 (Basic use)\n\n\
    使用它时需要考虑的一点是耐心。即使工具锋利，也应该慢一点。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_103_2.png)\n\
    \n# 自制刮刀 (SHOP-MADE SCRATCH STOCK)\n\n刮刀基本上是一个带螺丝的手柄刀片刀，用于在曲面上进行刮削。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_104_0.png)\n\
    \n# 自制 (Making your own)\n\n你可以用旧刀片制作自己的刀片。只需确保背面平整（顶部图片）。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_104_1.png)\n\
    \n# 砂纸 (SANDPAPER)\n\n任何关于光光工具的章节如果没有讨论砂纸就是不。像许多木工一样，我讨厌打磨。这是一项凌乱的工作，我尽量减少它。尽可能，我会通过合适的刨和刮刀代替手工或动力打磨。除非项目主要由平面组成，否则我最终都会使用砂纸。\n\
    \n# 砂纸种类 (Types of sandpaper)\n\n木工坊常用的三种主要的砂纸：硅碳、石榴和氧化铝（顶部图片底部）。多年来只有石榴砂纸，由细碎的宝石制成。这种纸容易变钝并磨损，但在不留划痕方面声誉最高。硅碳纸（通常称为湿砂）主要用于漆层之间的打磨，因为可以使用水。氧化铝是一种较新的磨料，比石榴耐用得多。\n\
    \n无论磨料类型如何，所有砂纸都根据粒度进行分类（见下表）。\n\n![](img/82f8fd51f2b064bbc4df21354d664e50_105_0.png)\n\
    \n三折设计创建3个独立打磨表面\n\n| 指定粒度 ANSI CAMP* | 600 | 400 | 320 | 280 | 240 | 220 | 180\
    \ | 150 | 120 | 100 | 80 | 60 |\n| 颗粒尺寸（微米） | 16 | 23.6 | 36 | 44 | 53.5 | 64\
    \ | 79 | 95 | 113 | 136 | 189 | 266 |\n\n*ANSI = 美国标准协会  \n**CAMI = 涂层磨料制造商协会\n\
    \n"
