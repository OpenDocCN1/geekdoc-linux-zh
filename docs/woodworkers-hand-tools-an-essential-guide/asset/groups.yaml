  - '[PAGE 150]


    # MALLETS


    In addition to the various hammers I have in the shop. I also have a selection
    of mallets. Each is designed to tackle a different type of task. I have a joiner''s
    mallet, a couple of different-sized dead-blow mallets, a rubber-faced mallet,
    and two sizes of carver''s mallets.


    # Joiner''s mallet


    This was my original mallet. The catalog I ordered it from called it a joiner''s
    mallet, and since I wanted to experience the world of joinery, it seemed like
    the tool for the job (top photo). To be honest, it never felt right to me: It
    was (and still) sort of clunky and large, and the flat, unforgiving faces of the
    mallet were awkward to use. About the only thing I used for driving a chisel.
    But since I picked up my Japanese hammer, this mallet''s relegated to the kids''
    toolbox.


    # Dead-blow mallet


    What a great invention! Dead-blow mallets are high-impact plastic cases that enclose
    a head filled with oil and lead shot (middle photo). When the mallet strikes an
    object, the shot rushes to that end, but the thick oil prevents it from bouncing.


    This delivers a “dead” blow with hardly any bounce. I have two sizes of these
    and use them more than my other mallets combined.


    # Rubber-faced mallet


    A rubber-faced mallet is useful for those jobs where a different mallet or hammer
    would damage the surface. They typically come with interchangeable heads that
    screw on and off (bottom photo). I use mine occasionally during final assembly
    of parts that have been refinished.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_150_0.png)


    ASSEMBLY TOOLS 149'
  - '[PAGE 151]


    # Carver''s mallet


    Years ago when I got into carving, I bought a couple of hardwood mallets. Each
    was turned from a single piece of lignum vitae (one of the toughest woods known),
    and they''re still in great shape even after lots of use. Carver''s mallets are
    identified by their round head, which allows a Carver to work from almost any
    angle without having to change his grip on the tool. These mallets tend to be
    so heavy that the carver can transfer a lot of power to the chisel. Newer Carver''s
    mallets have a wood body and handle but are wrapped in a thick layer of impact
    plastic. I have a carver friend who swears by his, but I just can''t get past
    the plastic part—it just doesn''t sit right with me. I''ll stick with my lignum
    vitae.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_151_0.png)


    # MALLET GRIPS: FULL AND PARTIAL


    There are two main grips that you can use with almost any mallet: full and partial.
    With a full grip, your hand wraps around the handle and the tool is used much
    like a hammer to deliver a full-force blow (photo below left). When you need a
    more delicate touch, switch to a partial grip, where your hand wraps around the
    head of the mallet (photo below right). Gripping a mallet this robs it of power
    but gives much greater control.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_151_1.png)'
  - '[PAGE 152]


    # BRACES


    Until I bought my electric drill in 1971, I drilled all my holes with the brace
    shown in the top photo and the hand drill on page 152. And I drilled a lot of
    holes with these two guys. I don''t use them much anymore except when I make something
    entirely by hand, but I still hang onto them. Braces have been around for a long
    time, they have almost disappeared since the advent of the electric drill and
    now the cordless drill.


    It might surprise you to know that many installers (cable TV telephone, etc.)
    still use a brace. Why The answer is feedback. The power of an electric drill
    can also be a detriment: An electric drill and a sharp bit will blow through most
    materials in a heartbeat. Installers use a brace because they “feel” the bit moving
    through a wall. If they hit metal, they’ll know it. This is important if you are
    interested in not drilling through conduit, gas lines, or water lines.


    Most of the bits used with this style brace have a square tang (see page 153)
    that''s gripped by the jaws of the chuck. To insert or remove a bit, grasp the
    chuck with one hand and rotate the frame to open or close the jaws (middle photo).
    Quality braces have a ratcheting mechanism that allows you to turn the chuck in
    a confined space (bottom drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_152_0.png)'
  - '[PAGE 153]


    # HAND DRILLS


    I''ve always enjoyed using a hand drill—the cranking reminds me of my Mom''s egg
    beater. The hand drill (sometimes called a wheel brace) is designed to accept
    twist bits (see page 153), so it''s used to drill small holes possible with a
    brace. One of the things I like about a hand drill is that it''s very easy to
    match the material. Inexpensive drills (like the one shown here) have only a single
    pinion to engage the larger drive gear (bottom drawing). Better-quality drills
    have two minions to provide more reliable torque (my little single-pinion gear
    will often skip a tooth or two when its pushed too hard, though that''s not bad
    for a 30-year-old drill).


    You insert or remove bits much the same way as with brace. The only difference
    is, you need to prevent the drive gear from turning as you to loosen or tighten
    the chuck. The best way I''ve found to do this is to wrap the index finger of
    the hand with which I''m holding the handle around the drive gear knob (middle
    photo). This does a pretty good job of freezing the drive gear so the chuck can
    be rotated. When using a hand drill, it''s important to use a really sharp waste
    frequently (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_153_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_153_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_153_2.png)'
  - '[PAGE 154]


    # BITS


    There are two types of bits that work well with hand drills: auger bits for braces,
    and twist bits for hand drills.


    # Auger bits


    There''s quite a variety of auger bits still available (top photo). They can have
    the classic square tang or a round shank. The square tang variety will provide
    the better nonslip torque of the two. Auger bits also come in a couple of different
    twists: single and double. Double-twist bits have two flutes that run the length
    of the shaft and quickly clear waste. A single-twist bit has a solid center, although
    doesn''t clear waste as effectively as the double-twist does, its solid core is
    much stronger—that''s why you''ll see this style used on longer bits. A special
    type of auger called the expansive bit can be adjusted to drill a variety of diameters
    (mid photo). It comes with an adjustable cutter that slides in and to change diameter.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_154_0.png)


    Photo courtesy of American Tool Companies, Inc., copyright 2001


    # Twist bits


    Twist bits (or twist drills) are straight bits with two helix-type flutes running
    about two-thirds the length of the bit (bottom photo). This allows for excellent
    chip removal and leaves the end point to fit in the drill core. The ends are typically
    ground to round around a 60-degree bevel. This works fine for general-purpose
    work; but if you''re intending to use a set for woodworking, you may want to consider
    having them ground to a slightly steeper angle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_154_1.png)


    ASSEMBLY TOOLS 153'
  - '[PAGE 155]


    # DRILLING TIPS


    The rules for effective drilling are the same for a brace and a hand drill as
    they are for an electric drill. The bit needs to be guided in straight, and you
    need to take precautions to prevent tear-out. The big difference is, you need
    to do both of while twirling the drill frame or knob. It takes a bit of practice,
    but it''s quite enjoyable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_155_0.png)


    # Drilling straight


    There are a couple of simple, effective ways to ensure that the holes you drill
    end up straight. One method is to use a sight aid. A sight aid is nothing more
    than a try square or square block of wood that you position near the workpiece
    so that you can see along it to keep the bit straight (*top photo*). Another method
    for drilling straight involves using a block of wood to support the bit and keep
    it running true. This is especially useful on long auger bits. Just start the
    hole and stop and clamp a square scrap directly under the bottom of the hole.
    Then use the block to guide the bit (*middle photo*).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_155_1.png)


    # Preventing tear-out


    If you drill completely an unsupported workpiece, the bit will “blow out” the
    opposite face as it exits the wood. With twist bits, the best way to avoid this
    is to clamp a scrap block behind the workpiece to support the wood. You can use
    this same technique with auger bits, or stop drilling once the lead screw pokes
    out the back of the wood. Pull the drill out and continue drilling from the opposite
    face (*bottom photo*).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_155_2.png)'
- md: '

    # SCREWDRIVERS


    The final assembly tool that most woodworkers can''t do without is the screwdriver.
    Flat-blade and Phillips are the most common, though square-drive screws are becoming
    increasingly popular with woodworkers, as their square recess provides an excellent
    grip. I have a nice set of wood-handled cabinetmaker''s screwdrivers that I use
    exclusively for woodworking (top photo). Call me old-fashioned, but I still like
    the feel of a wood handle, especially the way theous end fits so well in the palm
    of my hand.


    That said, I do have a couple of snappy combination screwdrivers with the pull-out
    double-ended bits—the kind that has two different-sized Phillips and flat-blade
    tips. I use these for home improvement work and other non-wood-related jobs.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_156_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_156_1.png)


    ## FITTING A BLADE: TOO WIDE, TOO NARROW, JUST RIGHT


    The most common error when using a screwdriver is not sizing properly to match
    the screw head. This is particularly true with slotted screws. When the screwdriver
    blade is too wide (photo above near right), the protruding edges of the screwdriver
    tip will most certainly damage the surrounding wood when it reaches the surface.
    If a blade is too narrow


    ![](img/82f8fd51f2b064bbc4df21354d664e50_156_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_156_3.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_156_4.png)


    won''t grip the screw fully and will most likely strip out (photo above center).
    A properly fit blade will fill the slot completely without extending the perimeter
    of the head (photo above right).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_157_0.png)


    > In gluing the miters, it will be proper, first, to glue on the outside of each
    miter a piece of deal in the shape of a wedge, which will take a hand-screw, so
    that when they are putting together, the glue may be brought out, and the miters
    made close.

    > THOMAS SHERATON (1793)


    ## CLAMPING TOOLS


    Miter joints are notorious for clamping problems—and were obviously so in Mr.
    Sheraton''s time, too. He didn''t have some of our modern-day advantages, though,
    in the array of clamps available: spring clamps, C-clamps, bar clamps, Bessey''s,
    hand screws, edge clamps, and more. It''s an old saw in woodworking that happens
    to be true: You just can''t have too many clamps. But you do need to have and
    use the right kind: If you have three dozen spring clamps but only two pipe clamps,
    you''ll never be able to glue a panel successfully.


    You also know when and how to use—and not over-use—the different types. When I
    first started woodworking, I try to compensate for a sloppy joint by cranking
    the pressure on the biggest pipe clamp I could find. As one of my buddies would
    often say, "If the joint doesn''t fit, get a bigger clamp." As you probably know
    the wood will always win in the end. The solution is a two-parter: Concentrate
    a little more on your joints skills, and then use the right clamp, with the right
    pressure, to bring it all together.


    Clamping work from top left: hand screw with self-aligning jaw by Wm. Henry, patented
    1887; cam-lock bar clamp, patented 1881; No. 1 cam-lock bar clamp, patented 1881;
    cabinet-maker''s wood bar clamp; cast iron C-clamp; mounted on 7/8"x2/4" beam,
    marked "No. 1, Pat 1889"; bar clamp by Chicago Co., patented 1893.


    ## C-CLAMPS


    C-clamps (or G-clamps) are one of the most universally used clamps in the shop
    (top photo). They''re extremely versatile and are available in many sizes, with
    jaw capacities ranging from 3/4" all the way up to heavy duty 12". The C-shaped
    frame of the clamp has a fixed pad on one end and accepts a threaded screw on
    the other. One end of the screw accepts a swivel shoe, while the other is held
    by a metal rod called a toggle bar (bottom drawing). Twisting the screw raises
    or lowers the jaws of the clamps. The frames can be made of stamped metal, cast
    iron, steel, or aluminum. On G-clamps, the toggle bar is replaced with a wing-type
    screw.


    One of the advantages allowing the shoe to swivel is it can conform to angled
    pieces (middle photo). This same advantage can be troublesome when you''re trying
    to fit a G-clamp on a narrow surface. In this case, you''re usually off flipping
    the G-clamp so the fixed jaw rests on the narrow piece. Consider what happens,
    for example, when you''re trying to clamp a workpiece to a drill press table:
    flip the clamp vertically so the fixed jaw rests on the casting and it''ll work
    fine. NOTE: G-clamps are intended for light to moderate pressure only; excessive
    pressure can crack the casting. If you need to exert greater force, use a hand
    screw (see page 160) or a small bar clamp (see page 158).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_3.png)


    ## CLAMP TIPS


    ### Spinning G-clamps


    I picked this tip up as a young lad, when I watched a trim carpenter gluing up
    a laminated window sash. He was working with G-clamps, one in each hand, and was
    adjusting and applying them simultaneously. To open or close the jaws of a clamp,
    he''d hold the clamp by the screw and "spin" the body of the clamp, much like
    you''d twirl one of those old-time favors that would make a clack-clack noise
    (top photo). Try it—it really works.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_0.png)


    ### Edge-clamping


    Here''s a good way to convert a G-clamp into an edge clamp for attaching edging
    to a workpiece. Position the clamp on the edge of the workpiece so there''s roughly
    a 1/2" gap between the body of the clamp and the edging you''re attaching (middle
    photo). Tighten the clamp securely and then tap a wedge between the body of the
    clamp and the edging, as shown in the middle photo, until the edging is tight.
    Space the clamps around every 6" or so to ensure a good glue joint.


    ### Square corners


    G-clamps are handy for gluing up small projects like boxes and drawers, where
    larger clamps would be cumbersome. To make sure the corners glue square, I use
    short lengths of aluminum or steel angle with the clamps to help align everything
    (bottom photo). Aluminum angle works best for this, since you don''t have to worry
    about the metal interacting with the glue and causing stains. Make sure to file
    the ends of the angle smooth to keep from marring the work surface.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_160_2.png)


    ## HAND SCREWS


    Hand screws (sometimes called parallel clamps) have been around for centuries.
    Older versions used wood screws, while modern hand screws feature metal rods that
    thread into round nuts that can pivot, allowing for angled clamping (top photo).
    The jaws of hand screws are usually made of maple or birch, offering clamping
    capacities between 2" and 12". I''ve picked up many of the new clamps that have
    been introduced in recent years; I still regularly use my hand screws for clamping
    small parallel and irregular workpieces.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_0.png)


    ### Parallel surfaces


    One of the things I''ve always liked about hand screws is their ability to quickly
    clamp parallel surfaces. With a couple turns of the hand screw, you get it close
    to the size needed. To do this, grab one handle with your right hand and the other
    with your left and then spin the clamp, "pedaling" a bike. Open the jaws by pedaling
    forward, and close them by going backward (drawing). When the jaws will fit over
    the workpiece, alternately tighten one, then the other jaw (or tighten them at
    the same time) until the jaws are in full contact with the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_1.png)


    ### Irregular surfaces


    So more than most other clamps, hand screws also excel at clamping irregular surfaces.
    That''s because the jaws can be adjusted independently of each other. Here again,
    the idea is the same: You want to bring both jaws in full contact with the sides
    of the workpiece (bottom photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_161_2.png)

