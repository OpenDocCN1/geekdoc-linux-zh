    ## 90度抛光


    一旦你已经将刮刀的边缘磨得光滑，是时候拿出抛光刀了（参见*下方的侧边栏*）。我开始抛光时，让抛光刀与刮刀的端面垂直。我会在刮刀的整个边缘上施加适中的向下压力，推几下（顶图）。这将压缩金属并实际上产生一个微小的毛刺（bur），你可以通过大拇指从边缘下方向上滑动来感觉到它。在某些情况下，这可能就是你需要的全部毛刺。如果你打算去除大量的材料，你需要较大的毛刺，并且需要以角度对边缘进行抛光。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_0.png)


    ## 角度抛光


    对于平刃刮刀，将抛光刀保持在 80 到 85 度（*中间图片*），对于有角的刮刀，则保持在 40 度左右（插图）。施加轻压力并推几下。检查毛刺，如果不够则重复。你可能会惊讶于产生毛刺所需的压力是多么小。我见过有些人用力按得，连刮刀都弯曲了。这并没有必要。如果确实如此，很可能是你的抛光刀硬度不够，无法压出毛刺（见下文）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_1.png)


    ## 抛光刀


    抛光刀必须具备两个特征才能正常工作：钢必须比刮刀硬（至少 Rc 60），并且它必须极其光滑以防止损坏精细的毛刺。你可以从木工目录中花几块钱买一把抛光刀（*右侧附近的图片*）。在急用时，我用过大钻头的柄——只需确保用手套保护好手即可（*最右侧图片*）。此外，花时间用细磨刀石或用毛毡轮配合一些宝石红蜡抛光抛光刀表面使其光滑。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_2.png)

    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_3.png)


    ## 附录：

    修复旧手动工具


    我喜欢让旧手动工具焕发生新生。我经常在拍卖会和跳货市场搜寻有活力的候选品。只要铸件完好且价格极其便宜，我就会收下并带回家。请记住，我的兴趣在于使用这些工具，所以我对它们做的处理比收藏家多得多。大多数收藏家感兴趣的是保留工具的包浆（patina），这没问题。但我对工具进行的彻底翻新（在此处描述）会让大多数收藏家大吃。如果你对收藏工具感兴趣，并想了解更多关于对古董应该或不应该做的事，请访问中西部工具收藏协会网站
    www.wtca.org。他们是一个非常棒的组织。


    ### 拆解与清洁


    要处理旧工具，我从将其完全拆解开始（顶图）。这让我能够检查所有部件的状态，并让它们更容易清洁。我会用温和的清洁剂溶液清洁大部分部件，如果堆积了油脂和树脂，我会用浸过丙酮、矿物油或或稀稀剂的布或非织磨料性垫将其擦掉（中间图）。


    ### 去锈


    接下来，我会处理任何生锈的区域（底图）。取决于是生锈还是严重的腐蚀，这可能需要从用 Wonderbar（一种极佳的产品）擦拭到使用钢丝刷，甚至是使用电解的魔法（相反页的侧边栏）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_189_0.png)


    ### 如必要磨削部件


    如果工具使用了带有切刃的部件，我会使用我标准的磨削技术对其进行磨削（顶图）。关于磨削的信息，请参见第 182—183 页。


    ### 重新组


    当所有部件都清洁、无锈且锋利（如果适用）后，我会将工具装好（中间图）。在此过程中，我会在联动处加入一两滴机油，通常会在铸铁表面涂一层油膏以防止未来生锈。如果工具带有木制部件（如所示的刨刨），我会在上面涂一层薄油以防止干燥和污垢。然后就是最棒的部分——工具，这是在车间里度过下午的最佳方式！


    ## 电解去锈


    这是一种利用电解去除工具生锈的巧妙方法。电解通过电池充电器将一小股电流通过浸泡在电解溶液中的生锈工具。此时会发生离子交换，锈皮会掉落。方法如下：首先，在非导电塑料容器中混合电解溶液（每加仑水加一汤匙苏打）。然后，取出工具上所有的非金属部件。将
    2 安电池充电器的正极（红色）线夹在阳极上——一块同样大的平整钢（如厨房平锅）。安全提示：当你开始看到工具表面形成气泡时，进行所有调整。将负极（黑色）线连接到完全浸没在溶液中的生锈工具上。打开充电器，检查电流是否没有超过额定值。如果电流过大或不足，将工具移远或靠近阳极以防止其腐蚀。关闭充电器，戴上橡胶手套，并固定夹子。去除污垢最快的方法是使用磨料垫。用浸过温水的垫擦拭表面。如果锈消失了，你就完成了。如果没有，重复此过程直到消失。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_190_0.png)

