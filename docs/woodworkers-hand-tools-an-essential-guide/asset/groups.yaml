- md: '

    ## Depth of cut


    If you removed the frog, you''ll need to tune it. Start by loosening the frog
    screws so they''re friction-tight (top photo). Then, use the frog-adjustment screw
    to slide the frog to align with the sole at the throat opening. You may need to
    remove the handle to get to this screw. NOTE: If there''s a lot of play in the
    depth-adjustment knob, you may be able to remove the slope. If the yoke that accepts
    the knob is steel or brass, you can squeeze it tighter with a C-clamp. If the
    yoke is cast, leave it alone—any pressure at all will likely snap it.


    ## Lateral adjustment


    There''s not much to do on the lateral adjustment lever: check for burrs on the
    cam, and smooth out any you find with a fine file or a piece of emery cloth. Then
    flip the plane over and sight down the sole. Pivot the lateral-adjustment lever
    back and forth until the edge of the plane blade is parallel with the sole (middle
    drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_0.png)


    ## CUSTOM HANDLES


    To make a new handle, use the old handle as a template (left photo). It''s best
    to drill the hole for the handle screw before shaping the handle. Cut out the
    shape, and smooth and sand the handle to fit your hand. Even if there''s nothing
    wrong with your handle (or the front knob), I always suggest shaping them to fit
    your hand. The factory-made handle is designed to fit the “average” hand, not
    yours. A custom-fit handle feels much better.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_3.png)


    ## USING A JACK PLANE


    Once your jack plane or jointer plane is well tuned, there''s one more thing to
    do before you use it: You need to adjust it to match the type of cut you''re making.
    I''m not talking about depth of cut here, but the position of both the cap iron
    and the frog.


    ### Rough cuts


    For rough cuts, as preliminary surfacing a board, you''ll want to adjust the cap
    iron to allow for a fairly heavy shaving (top drawing). Loosen the cap iron screw
    and shift the cap iron so it''s about 1/8" away from the cutting edge. Then loosen
    the frog screws and turn the frog-adjusting screw to increase the throat opening.
    This lets you take thicker, coarser shavings without jamming.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_0.png)


    Move Frog Backwards or Throat Plate Forward to Increase Opening


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_1.png)


    ### Smooth cuts


    For smooth or finish cuts, it''s well worth the effort to adjust the plane. Many
    woodworkers fail to realize the importance of the cap iron and frog position for
    these crucial cuts. The goal is to move the cap iron closer to the cutting edge
    of the blade so that it will quickly break chips and prevent tear-out (middle
    drawing). At the same time, adjust the frog to close the opening. This still allows
    for finer shavings to pass through while affording better support to the wood
    fibers being severed.


    Move Frog Forward or Throat Plate Backwards to Decrease Opening


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_2.png)


    ### Pencil tip


    Now you''re ready to plane. But before you do, consider this simple tip to help
    you clearly see where you have and haven''t planed. Rub the lead of a pencil lightly
    over the edge or face of your workpiece (bottom photos). As you plane, you''ll
    be able to readily check your progress.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_3.png)


    Hand-planing is hard work: enjoyable, but if you''ve ever tried planing a board
    with arm strength alone, learned quickly that planing is a whole-body task. Your
    legs are just as important as your arms. Take a stance centered on the board,
    where your legs are spread bit wider than your shoulders, with knees slightly
    bent (top photo). Though you''ll want to maintain firm, even pressure on the plane,
    take care to hold the knob and handle with a light grip: If you use a "white-knuckle"
    grip, your hands will tire.


    ## Start the cut


    Before you begin to plane a board, take a moment to "read" the grain. Look at
    the edge of the board, and clamp it to the bench so that the grain will be sloping
    down and towards the body of the plane. Set the plane on the workpiece so the
    body extends off the grain (middle drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_0.png)


    ## Complete the cut


    As the plane nears the end of the board, reduce pressure on the handle and let
    down on the front (bottom drawing). This prevents the blade from digging into
    the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_2.png)


    ## SMOOTHING A PANEL


    I''ve always found that jointer planes do a better job of flattening or smoothing
    thin stock than smaller planes. That''s because the long body of the plane applies
    pressure over the entire length. This prevents the thin workpiece from buckling.
    For really thin stock, I temporarily attach the wood to a flat base with double-sided
    tape (top). Cover the entire underside with tape—any gaps can allow the stock
    to deflect, resulting in scalloped cuts.


    Shop-Tip: To free the thin, delicate stocks from the base, drizzle some lacquer
    thinner over the workpiece and let it seep under. The lacquer thinner will dissolve
    the adhesive, letting up the thin without breaking it.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_70_0.png)


    ## Edge-jointing


    One of my favorite uses for a jointer plane is to join edges of boards to be glued
    up (middle). There''s just something satisfying about watching a 4- or 5-foot
    continuous curl out of the top of the plane. One of the challenges here is that
    you need to walk with the plane as you work. The trick is to keep your elbows
    locked at the same height as you move your body.


    ## LOW-ANGLE PLANES


    Patterned after the Stanley No. 62 low-angle plane, the low-angle jack plane shown
    here is manufactured by Lie-Nielsen Toolworks, Inc. (www.lie-nielsen.com). It''s
    sort of a hybrid of a low-angle block plane and a jack plane. It took only a few
    passes with this beauty for me to realize it would become one of my favorite planes.
    It works extremely well on squirrelly and troublesome grain, I''ve even used it
    to plane the end grain when making raised panels with no shoulder.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_72_2.png)

