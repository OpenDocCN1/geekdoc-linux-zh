    # SPECIALTY CLAMPS


    ## Fast-action clamps


    When fast-action clamps hit the market a few years ago, they created quite a stir.
    These clamps (sold under the Quick-Grip blade trade name) were designed to be
    used one-handed (top photo). Pressure is applied by squeezing the handle. To remove
    pressure, you pull a quick-release trigger. I find them extremely handy in the
    shop—more as a third hand than a small clamp—although I occasionally use them
    to clamp parts that require only light pressure. If you need greater clamping
    pressure, use a hand screw or a small bar clamp.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_162_0.png)


    ## Spring clamps


    Since the clamping pressure supplied by a spring clamp comes from a wire-wound
    spring, these small clamps are primarily used to hold small parts together under
    light pressure (middle photo). I routinely use them in the shop to apply thin
    molding or edging strip to a workpiece. They''re also handy for temporarily holding
    stops in place on a miter gauge or a rip fence. These small clamps tend to "creep"
    when used to glue parts together, and often work best with G-clamps.


    ## Band clamps


    Band clamps (sometimes called strap or web clamps) are particularly useful for
    gluing odd-shaped work such as an octagon. They can also be used to apply even
    pressure around a case or carcass (bottom photo) and are often used to glue up
    chairs and other non-square work. A band clamp consists of a cloth band or web
    that slips around the workpiece and is then threaded through the clamping-head.
    A ratchet mechanism here allows you to apply considerable force. Clamping pressure
    is released by depressing the ratchet lever.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_162_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_162_2.png)


    ## PIPE CLAMPS


    It''s a rare woodworker''s shop that doesn''t have pipe clamps (top photo), and
    for good reason: They''re hardworking and inexpensive. Pipe clamps are sold in
    single sets consisting of a separate head and tail piece (middle drawing). You
    supply the pipe, and that''s one of the beauties of these clamps: They can be
    any length. You can buy pipe clamp that accept either 1/2" or 3/4" diameter pipe.
    The 1/2" diameter sets are suitable for light to moderate pressure, whereas the
    3/4" sets can supply a frightening amount of torque.


    When I first started out, I figured that bigger is better, but now most of my
    pipe clamps are 1/2". If you need the force supplied by the larger clamps, there''s
    probably something wrong with the fit of the parts. It''s best to pull these apart
    and tweak them to fit better. Some clamp sets are designed with "clutch" mechanisms
    on both heads. I''d steer clear of these and invest in the type that requires
    a threaded rod on the fixed jaw end.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_163_0.png)


    ## PIPE CLAMP PADS


    Since pipe clamps can exert a lot of pressure, it''s important to protect the
    workpiece from being marred by the metal clamp parts. The simplest way to do this
    is to add pads to the faces of the clamps. Store-bought pads, wood scraps, and
    plastic coating all work well for this (photo below left). Manufacturers sell
    plastic pads specifically designed to fit their clamps. These slip right over
    the clamp and do a good job, although many have a tendency to fall off with use.
    Another method is to coat the pads with Plasti-Dip—a liquid plastic that hardens
    quickly when exposed to air (it''s available at most hardware stores). Finally,
    the old standby is to apply scraps of wood (1/4" hardboard works great) to the
    jaw faces with double-sided tape.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_163_1.png)


    One of the challenges to using pipe clamps is aligning them so they''ll pull parts
    together without causing them to shift or twist. The key is to position them so
    they''re parallel to the sides (top drawing). I like to roughly position a clamp
    so it''s friction-tight. Then I use a wood scrap to align the clamps by holding
    it flush with the edge of the workpiece; then I tap the clamp until it hits against
    the scrap. I do this for both ends, double-checking to make sure neither has shifted
    before I tighten the clamps.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_164_0.png)


    ## Diagonals


    Even with careful clamp positioning, a case often goes out of square under clamping
    pressure. The simplest way is to measure diagonally across the corners. If the
    measurements match, the corners are perfect 90°. Most likely won''t be. When this
    happens, attach a clamp across the longest measurement as shown in the middle
    drawing. Apply gentle pressure to “rack” the case back into square. Check the
    diagonals again and continue clamping until they''re square.


    ## Using a caul


    Pipe clamps are great at applying pressure at a single point, but they''re not
    so at distributing pressure over a wide area. This is a problem when you''re gluing
    up panels. To get around this, insert a dowel (or a rounded-over scrap) between
    the clamp heads (bottom drawing). The dowel centers the clamping pressure and
    helps distribute it evenly.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_164_1)


    ## PIPE CLAMP TIPS


    ### Double up


    Although most of pipe clamps are too short, a simple way to extend the reach of
    pipe is to double up. To do this, clamp the tail portions together as shown in
    the top photo. While this method works for light pressure, you may want to G-clamp
    together.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_0)


    ### Couplers


    Another way to lengthen your pipe is to use couplers like the one shown in the
    middle drawing. You slide the end of the clamp off the pipe, add a coupler, and
    slip the clamp end back on.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_1)


    ### Even pressure


    The heads of pipe clamps tend to tilt when tightened, resulting in uneven pressure.
    To prevent this, insert a dowel between the clamp heads and the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_2)


    ## Preventing stains


    The raw metal pipe used with pipe clamps can stain the surface of your workpiece
    when the iron in the pipe comes in contact with glue. To prevent this, I apply
    a layer of masking tape to the top of the pipe (top photo). Not only does this
    prevent stains, but it also makes it easy to remove dried glue from the clamps:
    Just peel off the tape, and the pipe is clean.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_166_0)


    ## Plywood insert


    Clamping up a case or carcass with pipe clamps can be a challenge, since the case
    has a tendency to rack out under the pressure of the clamps. One way to prevent
    this is to cut a plywood insert to fit just inside the case and hold square when
    clamps are applied (middle drawing). Screwing a pair of cleats to the insert will
    hold it in place while you apply clamps.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_166_1)


    ## Spreader


    You can turn a pipe clamp into a spreader by threading the ends of two pipe clamps
    together, as shown in the bottom photo. Spreaders are a great nondestructive way
    to push parts apart for repair, such as when gluing the rungs on a wobbly chair.
    The trick is to use slow, even pressure and make sure to pad the jaws of the clamp
    to prevent them from marring the workpiece surface.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_166_2)

    '
