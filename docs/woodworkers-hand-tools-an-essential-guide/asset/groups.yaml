    # SHARPENING

    EDGE TOOLS


    The sharpening method described here has served me well for years. I use waterstones
    start with a medium grit and work my way up to my finest stone, which leaves a
    mirror finish. I prefer to both flatten the back and then hone the edge with one
    grit before advancing to the next.


    # Flatten the back


    The first step in sharpening an edged tool is to flatten the back. Although only
    the1/4" or so nearest the end needs to be flat, I''ve seen woodworkers flattening
    the entire back to a mirror finish. This might look spiffly, but it doesn''t make
    the blade any sharper. Select the appropriate stone (see pages 175-177) and lubricant,
    and apply firm downward pressure to the blade as you move it back and forth over
    the full length of the stone (top photo). Stop when you feel a burr on the bevel
    side.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_0.png)


    # Set the guide


    Once you''ve created a burr, the next step is to remove it by honing the bevel.
    Although you can do this free-hand, I recommend some type of honing guide (see
    page 179) to hone the blade at a fixed angle. How you set the guide will depend
    on the guide and the tool you''re honing. In most cases, after you insert the
    tool in the guide, you''ll slide it back and forth until the sharpening angle
    is reached (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_1.png)


    # Hone the bevel


    Honing the bevel is the trickiest part to sharpening—especially if you''re working
    on a narrow tool like a chisel. There''s a natural tendency to rock the tool as
    you slide it back and forth over the stone. The best way I''ve found to avoid
    this is to press down on both corners of-


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_2.png)'
  - '[PAGE 184]


    the blade and lock my elbows in tight against my body (bottom photo on opposite
    page)- Take a few strokes and look at the bevel. If it''s lopsided, compensate
    by pressing more on one side.


    # Remove the burr


    After you''ve honed the edge, check to see whether you''ve created a burr by sliding
    your finger gently up the back of the blade (top photo). Flip the blade over and
    take a few strokes to remove the burr. The whole idea behind sharpening is to
    create finer burrs on the blade''s edge. It''s important to remove the burr before
    progressing to the next stone, as the burr can score the surface of the stone—especially
    the softer waterstones.


    # Change grits


    Depending on which stone you started with, you can move up to the next-finest
    grit. If, for example the tool was relatively sharp and just needed a touchup,
    you may have been with your finest stone. If not, switch stones and repeat the
    process of flattening the bevel, honing the edge and removing the burr until the
    edge is razor-sharp (middle photo). When is it sharp? I don''t recommend the old
    ''shaving the arm hair'' trick. If the tool can cleanly shave end grain, it''s
    sharp enough for.


    # Add a microlevel


    You or may not want to create a microlevel on the edge once the blade is sharp
    (bottom photo). Some honing guides have a built-in cam that can be rotated to
    raise the blade (typically around 1 to 2 degrees) to hone the bevel. Sometimes
    when I want to touch up a blade, it''s faster to create a microlevel than it is
    to sharpen the entire bevel, since I''m removing a whole lot less metal.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_3.png)


