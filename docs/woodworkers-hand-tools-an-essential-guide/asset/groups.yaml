    > “It is a singular fact that while vast improvements are constantly being made
    in all Kinds of Saws, the Hand Saw of today in shape and style is very similar
    to the Hand Saw of one hundred years ago.”


    HENRY DISSTON (1876)


    # CUTTING TOOLS


    In the 21st century, Mr. Disston is still correct. The shape and style of handsaws
    today—so basic and functional—have changed little from the time of this legendary
    saw-maker. His saws were (and still are) regarded as some of the best ever made:
    high-quality steel, to sharpen, and hold a keen edge. A Disston saw was meant
    to last a lifetime—and usually did.


    The craft of fine handsaws has almost disappeared, certainly in mass retail. Go
    out and try to buy a quality saw, as I did recently. After visiting five hardware
    stores, I came empty. Unfortunately the only handsaw in many shops is now a worn-out
    cutout saw.


    Why? Progress, of a sort: Most sawing operations have been taken over power tools.
    That’s too bad. In many cases, a quality saw in the hands of a skilled craftsman
    can produce results just as fine—but without the dust and noise. I’m not suggesting
    that you trash your power saws. But the next time you need to make just a cut
    or two, a hand-powered saw. Mr. Disston would approve.


    From top to bottom and left to right, a combined rip and crosscut saw made by
    Bees & Moore Mfg.; cutout saw, 26”, 12 point, made by Spear & Jackson, Sheffield;
    rip saw, 24”, point, made by G. Collier, Brixton; rosewood and brass keyhole saw
    marked DIXON; and a small back saw with 7” blade, Henry Disston & Sons, Keystone
    Saws Works.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_40_0.png)'
