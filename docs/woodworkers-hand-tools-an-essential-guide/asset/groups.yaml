    > “生活的期望取决于勤奋：想要完美工作的工匠，首先要磨利他的工具，”


    孔子（公元前 551 年 - 公元前 479 年）


    ## 磨工具


    我胆于这样修改孔子的话：为了完善你的工作并免受伤害，首先要磨利你的工具。我手上有一道伤疤，那是强行使用钝工具留下的纪念。如果它是利的，那把 1/4 英的凿子本可以利索地切开木头。但它并没有；而是利索地刺穿了我的右手掌。那天我意识到，作坊里没有比钝工具更危险的东西。几天后，当我学会如何给凿子磨出如刀刃般锋利的边缘时，我成为了一个更好的木工。


    你知道与钝工具作斗有多令人沮丧。像很多木工一样，我曾认为新工具拿来就能用。但我发现事实并非：大多数新工具并不锋利。尽管它们被磨成了正确的角度，但没有经过精磨。在你对其进行精磨之前，它是没用的。因此，通过了解更多关于磨油的知识，你可以避免挫败感、失败和人身伤害。油石、水石、磨刀器、砂轮、抛光器——如果你知道何时以及如何使用它们，它们都大有用处。


    第一行（顶部）从左到右：软管油壶；磨石；用于磨小型物品的台式手动摇摇磨机。第二行：盒装油石、诺顿“Quickcut”盒装碳钢石；黑油石。第三行：用于磨凿子、刨刀等的刃具工具磨刀；Diaton
    手锯平石；Olis A. Smith（康涅狄格州罗克代）可调节锯片。


    ## 磨刀术语


    为了让边缘变得真正锋利，形成刃角的两个表面必须是平整的，且磨得相同（顶部照片）。这个显而易见的事实是磨工具时最容易被忽视的因素之一。我们木工花费了大量的精力将斜面磨到镜面效果，却忽略了背后的平面。两者都必须磨到相同的精细程度，表面才能在边缘处整齐地汇合（中间图画）。


    将被精磨。使用平直磨削时，整个斜面都靠在石头上，除非你选择使用微斜面（microbevel）。这种方法的优点与凹磨相同——去除的材料较少，精磨速度更快。


    尽管作坊里有很多不同刃口的工具，但你可能会花大部分时间在磨刀片和凿子上。处理这些边缘的磨削和精磨有四种方法：平磨、带微斜面的平磨、凹磨以及带微斜面的凹磨（底部图画）。使用哪种实际上取决于个人喜好。


    个人而言，我倾向于对切削工具的边缘进行凹磨（这种凹度是在砂轮上制作斜面时产生的）。这种方法的巨大优点是当你精磨斜面时，去除的材料更少。由于斜面是凹的，只有刃尖（toe）和刃跟（heel）会接触石头上，而刃尖和刃跟


    > 两个表面都必须平整才能产生锋利边缘


    | 平磨 | 带微斜面的平磨 | 凹磨 | 带微斜面的凹磨 |

    | :--- | :--- | :--- | :--- |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_175_0.png)


    ## 天然油石


    当我25 年前开始接触这个领域时，人工石的质量还有待疑，而我现在依然如此。其中最著名的是新武石（novaculite）。新武石是一种良好的天然磨料。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_0.png)


    ## 不同的粗度


    阿肯石石有四种粗度。从粗到细分别是 Washita（顶部）、软阿肯石（中间）、硬阿肯石（底部）和黑阿肯石（底部插图）。我发现用平整的石膏板效果很好（左上照片）。在平整后，要彻底清洗每块石头，以去除所有粗砂痕迹。


    ## 人工石


    许多磨料制造商（如诺顿和 3M）生产人工油石，并提供许多形状和尺寸（顶部照片）。特别是较大的较宽的台用石头对于磨刀非常有用。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_2.png)


    ## 平整石头


    为了让任何石头发挥作用，它必须是平整的。所有的石头都会磨损并在中间变得凹陷，因为这个区域的使用最多。我发现平整油石（无论是人工还是天然）最好的方法是在粗金刚石上摩擦；另一种选择是使用带有碳化硅颗粒的磨板（见第
    181 页）。由于水石比油石软，它们磨损更快，但更容易平整。最简单的方法是用细石与粗石相互摩擦来平整细石。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_177_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_177_1.png)


