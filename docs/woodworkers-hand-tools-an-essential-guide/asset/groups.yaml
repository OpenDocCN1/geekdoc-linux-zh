    # 刨凿 (PARING CHISELS)


    刨凿的外观与推刨凿（firmer chisel）相似，不同之处刀片长得多（顶图）。推刨凿的刀片通常在 4 英寸到 4/2 英寸之间，而普通刨凿刀片的平均长度为
    7 到 8 英寸（下图）。这种凿子曾是橱柜工工具箱中的标准配置，但现在很大程度上被电木铣子取代了。


    刨凿的长刀片非常适合修整槽和凹槽的底部，用于切割隔板和其他箱体部件。一旦电木铣子出现，凭借其切出完美平整底部凹槽的能力，刨凿开始逐渐消失。


    由于刨凿的刀片非常长，因此它相当脆弱，绝对不能使用木锤敲击。刨凿只适用于手推压力。如果你打算用刨凿来平整槽底，可以考虑制作一个量规块，以将刀片精确地固定在所需的高度（中图）。偶尔，你可以找到带有“弯柄”的刨凿，其手柄相对于刀片是偏移的（底部的凿子）。这让你可以在刀片平贴工件的情况下进行刨削。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_0.png)


    槽 (Groove)


    量规块 (Gauge Block)


    手柄 (Handle)


    斜刃刀片 (Bevel-Edged Blade)


    插肩式 (SOCKET STYLE)


    手柄 (Handle)


    铜箍 (Brass Ferrule)


    推刨刀片 (Firmer Blade)


