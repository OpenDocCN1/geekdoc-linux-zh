  mdcn: '


    # 水石


    我无法想象没有水石的木工生活。对我来说，它们远优于其他石刀，因为它们切削速度极快，能迅速产生锐利的边缘。虽然你仍然可以买到日本天然水石，但高昂的价格通常令人望而却步。近年来，便宜得多的人造水石已经上市。我已经用了一段时间的石子是由
    Norton（www.nortonabrasives.com）制造的。我喜欢这些石子是因为它们足够宽，可以处理我最宽的刨刃，而且足够长（8x3英寸）。它们提供四种目数：220、1000、4000
    和 8000。我只用220目的石子来修形或修复有缺口、损坏的刀刃。


    为了让水石有效发挥作用，需要将其彻底浸泡。在使用之前，你应该将水石在水中浸泡至少 10 分钟（顶图）。在使用石刀时，保持表面湿润非常重要，以防止金属颗粒嵌入表面（中间）。我会在旁边准备水，定期将手浸水中，然后水滴在石上。


    由于我一直在磨我的工具，我倾向于将石子储存在水中。这样它们随时都可以使用。一个带有紧密盖子的塑料储物箱非常适合它们。小贴士：为了消除箱内生长霉菌或地衣的可能性，每次换水时向箱内加入一盖家用漂白（底图）。注意：不要将存放的石子放在没有加热设备的车库里。如果水结冰，石子会裂开，你只会得到非常昂贵的磨损石。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_178_0.png)


    # 磨刀工具


    # 油轮


    当工具刃口损坏或需要重新塑形时，电动或手动磨机就能派上用场。许多木工对动力磨的问题在于两点。首先，大多数转速为 3450 rpm 的磨机速度太快了。即使使用正确的砂轮，这种速度也会迅速去除工具的回火，使其变得毫无用。最近出现了更低转速磨机（1800
    rpm），非常值得花这笔钱。第二个问题是大多数磨机自带的砂轮就像动力锯上的刀片一样——毫无用处。这些砂轮通常非常粗且硬。它们会在几秒钟内烧毁刃口。把它们取下来，换成专用于磨刀工具的砂轮。


    你寻找的基本上砂轮版的日本水石：砂轮需要是柔软、精细的并具有相当开放的结构。像水石一样，它的切削非常激进但磨损得很快。我成功地使用 Norton 80 目的氧化铝砂轮多年。它能快速去除大量金属，同时最大限度地减少烧伤的风险——一种极佳的通用磨刀砂轮（顶图砂轮）。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_1.png)


    # 修整器


    在使用过程中，任何砂轮的表面都会被金属颗粒堵塞。当砂轮失去切削能力并需要“修整”时就会发生这种情况：即刮掉表面以露出新的磨削面。


    市场上有很多专门用于这项工作的修整器。最常见的两种是磨砂棒（最右侧照片）和星形修整器（右侧照片）。我使用磨砂棒的频率高于星形修整器，因为它能留下更平滑的表面。为了校正不圆的砂轮，我有一个钻石修整器，它看起来像钢笔，但尖端镶有
    74 克拉工业钻石。这些在大多数木工目录中都可以买，价格低于 20 美元。


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_3.png)


