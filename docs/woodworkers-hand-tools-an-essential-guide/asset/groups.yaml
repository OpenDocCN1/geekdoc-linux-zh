  - '[PAGE 100]


    # CABINET

    SCRAPER


    As I mentioned on page 95, the cabinet scraper has often been confused with the
    scraper plane. The cabinet scraper (often called a double-handled scraper) is
    designed to reduce the fatigue associated with hand scraping (top photo). It''s
    basically a metal body that holds the scraper blade at a preset angle, typically
    around 110 degrees. The blade is held in place by a pair of retaining screws,
    either slotted or with knurled ends (middle drawing). The traditional grinding
    angle of a cabinet scraper''s blade is 45 degrees. This creates a sturdier blade
    that can take a more aggressive cut.


    Just like a hand scraper, the blade of a cabinet scraper should be flexed to create
    the desired depth of cut—and here''s the real beauty of this tool shows. Instead
    of wearing out your thumbs by flexing the blade is flexed by way of a thumbscrew''s
    threaded through the body (bottom drawing). To adjust the flex, tighten the retaining
    screws with the adjustment screw slack. Then tighten the thumbscrew for the desired
    cut and make a test shaving. Like the scraper plane, a cabinet scraper works well
    on thin or delicate stock that could easily tear if a hand catch or dig into the
    surface.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_100_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_100_1.png)


    SMOOTHING TOOLS 99'
  - '[PAGE 101]


    # HANDLED SCRAPERS


    A Variation of the cabinet scraper is the handled scraper (top photo). These are
    designed to be used with either one hand or two. The handled scrapers at left
    in the photo are called shave hooks, and are basically scraper blades attached
    to metal rods inserted into wood handles. The scraper blades come in a variety
    of shapes and sizes and are intended mostly to remove paint and old finishes on
    moldings and other curved surfaces. But I''ve found that if you sharpen them properly
    and roll a nice burr on the end, they can work much better than a gooseneck.


    The middle and far right scraper in the photo are basically paint scrapers, good
    primarily for removing glue squeeze. The Sandvik scraper (far right) features
    a triangular carbide blade that stands up very well and can be rotated to a fresh
    edge when one side dull.


    One of my favorite handled scrapers is my grandfather''s Stanley No. 82, shown
    in the middle photo. It''s quite an interesting tool that works surprisingly well.
    Although the actual scraper blade is small, it fits in a sturdy head that can
    be adjusted to the angle. In use, you grip the handle with one hand and press
    down on the front knob with the other (bottom photo). This produces a considerable
    amount of pressure on the blade, and you can remove a lot of wood quickly. At
    the same time, a light touch can produce thin, wispy shavings. Even though these
    scrapers aren''t being made anymore, you can regularly find them at auctions,
    at yards sales, and on the Internet for just a couple of dollars.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_101_0.png)'
  - '[PAGE 102]


    # BEADING TOOLS


    A beading tool is sort of a hybrid between a scraper and a plane (foreground in
    top photo). They''re often confused with beading planes (background in top photo),
    like my Stanley No. 50, that have molded cutters sharpened like plane


    blades. To make things even more confusing, this particular beading tool looks
    like a spokeshave (see page 124). A beading tool is designed to hold a variety
    of cutters to carve beads, reeds, flutes, grooves, and other decorative edges.
    Since they''re slow-cutting and with the grain, they work well until been superseded
    by the portable router. So it might inspire you to learn that they are still being
    made. The beading tool shown here is made by Lie-Nielsen Toolworks (www.lie-nielsen.com)
    and is a reproduction of the old Stanley No. 66.


    So if the beading tool has been replaced by the router, why is it still being
    made? Nostalgia? The answer is that this classic tool outperforms its modern counterpart
    in two important ways. First, the small "sole" of the tool allows you to easily
    follow a three-dimensional curve (such as a cabriole leg), where the larger base
    of a router can''t travel. Second, you can make your cutters to match antique
    molding—or create your own, for that matter.


    A beading tool is similar to a scraper in that the cutter reaches again against
    the body at a preset angle and is held in place with one or more screws (bottom
    drawing). Quality beading tools come with one or more fences help guide the cutter
    along the edge of the work-piece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_102_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_102_1.png)'
  - '[PAGE 103]


    # Selecting the cutter


    To use a beading tool, start by selecting the desired cutter. Loosen the knurled
    knob and slide the cutter in place (top photos). If you can''t find the profile
    you''re looking for, Lee-Nielsen supplies blanks with the tool you want (technically
    the negative of the profile you want). Just make sure to flatten the back of the
    cutter as you would a plane blade, and then sharpen the profile with slip-stones
    or diamond stones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_103_0.png)


    # Adjusting the cutter


    Once you''ve got the cutter installed, you can adjust it (middle photo). If the
    cutter is small, you can adjust it for a full cut from the start. For larger cutters,
    I recommend setting it so just the first 1/16" or so protrudes, and then make
    a few passes. Lower the cutter an additional 1/16" and repeat until the full profile
    is reached. You''ll also want to adjust the fence or fences to position the cutter
    on the work-piece at the correct starting point.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_103_1.png)


    # Basic use


    The big thing to keep in mind when using a beading tool is patience. Even when
    sharpened correctly, these tools are very slow. Relax and take your time. Enjoy
    watching the profile slowly shape. For your first couple of passes, take it easy
    on the downward pressure (bottom photo). Let the tool begin the cut. Once it''s
    clearly started, apply gentle pressure and keep the tool moving.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_103_2.png)


    102 SMOOTHING TOOLS'
  - '[PAGE 104]


    # SHOP-MADE

    SCRATCH STOCK


    Home-made beading tools or "scratch stocks" could be found in every cabinetmaker''s
    toolbox in the past. Although they took a lot longer to use, they were a lot less
    expensive than a molding plane, and a new cutter could be made in a short while.


    A scratch stock is basically just a handle with a kerf in it to accept a cutter.
    Screws pass through the kerfed portion of the stock to pinch the cutter in place
    (bottom drawing). These are very easy to make and can be a lot of fun to use.
    NOTE: To hold the cutter as securely as possible, I suggest using machine screws
    that pass through the body; then thread on nuts.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_104_0.png)


    # Making your own cutter


    You can make your own cutter from an old scraper blade or broken saw blade. Just
    draw out the negative of the profile you''re after and grind or file the waste
    (top photo). Make sure to flatten the back of the cutter and hone the edge with
    slipstones.


    # Basic use


    Since the cutter for a scratch stock is a scraper, you''ll have to tilt it to
    find the correct cutting angle (middle photo). Pivot the stock until cutting action
    begins. Just as with a be use little downward pressure at first and take light
    cuts. As the profile begins to shape, apply gentle pressure and take your time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_104_1.png)'
