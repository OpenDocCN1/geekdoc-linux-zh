    # SHARPENING EDGE TOOLS


    The sharpening method described here has served me well for years. I use waterstones
    start with a medium grit and work my way up to my finest stone, which leaves a
    mirror finish. I prefer to both flatten the back and then hone the edge with one
    grit before advancing to the next.


    ## Flatten the back


    The first step in sharpening an edged tool is to flatten the back. Although only
    the 1/4" or so nearest the end needs to be flat, I''ve seen woodworkers flattening
    the entire back to a mirror finish. This might look spiffly, but it doesn''t make
    the blade any sharper. Select the appropriate stone (see pages 175-177) and lubricant,
    and apply firm downward pressure to the blade as you move it back and forth over
    the full length of the stone (top photo). Stop when you feel a burr on the bevel
    side.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_0.png)


    ## Set the guide


    Once you''ve created a burr, the next step is to remove it by honing the bevel.
    Although you can do this free-hand, I recommend some type of honing guide (see
    page 179) to hone the blade at a fixed angle. How you set the guide will depend
    on the guide and the tool you''re honing. In most cases, after you insert the
    tool in the guide, you''ll slide it back and forth until the sharpening angle
    is reached (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_1.png)


    ## Hone the bevel


    Honing the bevel is the trickiest part to sharpening—especially if you''re working
    on a narrow tool like a chisel. There''s a natural tendency to rock the tool as
    you slide it back and forth over the stone. The best way I''ve found to avoid
    this is to press down on both corners of the blade and lock my elbows in tight
    against my body (bottom photo on opposite page)- Take a few strokes and look at
    the bevel. If it''s lopsided, compensate by pressing more on one side.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_183_2.png)


    ## Remove the burr


    After you''ve honed the edge, check to see whether you''ve created a burr by sliding
    your finger gently up the back of the blade (top photo). Flip the blade over and
    take a few strokes to remove the burr. The whole idea behind sharpening is to
    create finer burrs on the blade''s edge. It''s important to remove the burr before
    progressing to the next stone, as the burr can score the surface of the stone—especially
    the softer waterstones.


    ## Change grits


    Depending on which stone you started with, you can move up to the next-finest
    grit. If, for example the tool was relatively sharp and just needed a touch-up,
    you may have been with your finest stone. If not, switch stones and repeat the
    process of flattening the bevel, honing the edge and removing the burr until the
    edge is razor-sharp (middle photo). When is it sharp? I don''t recommend the old
    ''shaving the arm hair'' trick. If the tool can cleanly shave end grain, it''s
    sharp enough for.


    ## Add a microlevel


    You or may not want to create a microlevel on the edge once the blade is sharp
    (bottom photo). Some honing guides have a built-in cam that can be rotated to
    raise the blade (typically around 1 to 2 degrees) to hone the bevel. Sometimes
    when I want to touch up a blade, it''s faster to create a microlevel than it is
    to sharpen the entire bevel, since I''m removing a whole lot less metal.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_184_3.png)


    # SHARPENING SAWS


    I''ve found sharpening a saw very rewarding. It''s a fairly straightforward job
    that takes less than half an hour and produces immediate results.


    ## Joining the teeth


    The first step in joining a handsaw is to create an even playing field; that is,
    filing all the teeth to the same level so that no tooth does more work than the
    others (top drawing). When this happens, the protruding tooth quickly bulks doing
    most of the work and ends up tearing wood fibers instead of cleanly slicing through
    them. To prevent this, the saw is "jointed" by running a smooth file over the
    tops of the teeth. The simplest way to hold the file perpendicular to the saw
    is to cut a kerf in a block of wood along its length to accept the file. Then
    insert the file in the kerf and set the file on the teeth. Press the file into
    the side of the saw until you can see a bright spot on the tip of every tooth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_2.png)


    ## Setting the teeth


    The next step is to "set" the teeth by alternately bending them away from the
    saw at a specific angle. This is done with a special tool called a saw set, which
    can be picked up at any auction. Saw sets are adjustable so you can vary the amount
    of set to match the saw. The general rule of thumb is that the set should equal
    half the thickness of the tooth; and you should never reverse the set, as it will
    weaken it substantially. For me, the biggest challenge to sharpening a saw is
    keeping track of which teeth have been sharpened and which haven''t. I solved
    this dilemma by sliding thin guards between the saw blade and jaws of my shop-made
    vise (see the sidebar on the opposite page). I raise the clamps far enough so
    that I sharpen each tooth, it leaves a tellmark that makes it child''s play to
    track sharpening progress and allows me to concentrate instead of sharpening.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_185_3.png)


    ## Sharpening one side


    I think sharpening is the easy part. In most cases, all you want to do is maintain
    the original angles. To do this, gently file a slim taper in one of the gullets
    of the saw. You''ll notice it will almost immediately align with the existing
    angle. All you have to do is hold it at this angle and take a few strokes (top
    photo). The key here is to maintain this angle while taking an identical number
    of strokes for each tooth. Crosscut saws, you''ll need to sharpen every other
    tooth, then flip the saw and do the other side (see below). This work goes surprisingly
    quick because it''s easy to get into a rhythm—three strokes, skip a tooth, three
    strokes.


    ## Sharpening the other side


    If you''re sharpening a rip saw, all the teeth are filed at the same angle—just
    hold the saw perpendicular to the blade, and progress down the blade, sharpening
    every tooth. Crosscut saws, with their angled teeth, require that you flip the
    saw to the teeth you skipped earlier. The technique here is the same, and if you
    use blocks again, you''ll create a crisscross pattern that will track your sharpening
    progress (middle photo).


    ## SHOP-MADE SAW VISE


    Although you could clamp a saw in a bench vise for sharpening, you''ll find that
    it''s a lot easier with a saw vise. A saw vise grips a wide portion of the blade
    and raises the blade to a comfortable working height. You can occasionally find
    a saw vise at an auction, or you can make out of couple scraps and inexpensive
    hardware (drawing right). The saw vise is just a couple pieces of hardwood that
    are lined the top and bottom with strips of hardboard to create jaws. A carriage
    bolt and a wing nut or threaded knob supply the clamping pressure.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_186_0.png)


    # SHARPENING SCRAPERS


    The magic behind a scraper is the burr. This burr is a tiny metal edge that''s
    rolled or ''burnished'' with a special tool called a burnisher. As a general rule
    of thumb, the burr is rolled at an angle between 80 and 85 degrees on a flat-edged
    scraper (top drawing). Bevel-edged scrapers, as those used in cabinet planes,
    are rolled at 35 to 40 degrees. Over the years, I''ve seen a lot of woodworkers
    struggle with sharpening a scraper. If you follow the simple method shown here,
    the same that I''ve used to teach numerous classes, I''m confident you''ll be
    creating whisper-thin shavings in no time.


    ## Filing the scraper flat


    The first step in sharpening a scraper is to file the edges perfectly flat. Just
    clamp the scraper in your bench vise (with wood liners, course) and take a few
    strokes across the top edge with a smooth file (middle photo).


    ## Honing the edge


    After the edges of the scraper are flat, the next thing to do is hone them smooth.
    NOTE: I have successfully skipped this step on occasion; but if you want a uniform
    burr, especially if you''re looking for super-fine shavings, it''s well worth
    the effort to hone the edge. While holding a scraper on edge vertically so it
    is perfectly perpendicular is virtually impossible, I use a trick learned from
    mastermaker Brian Bog. Brian sandwiches the scraper between two wood blocks to
    hold the scraper in perfect position and then rubs this "sandwich" on the stone
    (bottom photo). Note that it''s important to skew the sandwich as shown in the
    bottom photo to prevent the thin edge of the scraper from scoring a groove in
    your stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_3.png)

