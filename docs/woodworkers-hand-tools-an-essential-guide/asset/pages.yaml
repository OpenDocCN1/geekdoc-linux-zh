    # Sanding block


    I also strongly recommend a sanding block, especially if you''re working on a
    flat surface. A sanding block helps distribute pressure and reduces hand fatigue
    (bottom photo on opposite). Although you can choose many sanding blocks with complicated
    levers and fancy holds, I''ve always felt a scrap of wood or cork block wrapped
    in sandpaper works well. You can quickly change and even modify the block to make
    it better the job at hand. As with any, making sure to sand with the grain to
    prevent cross-grain scratches. Also, clean the sandpaper by removing it from the
    sanding block and giving it a sharp rap on the edge of your workbench.


