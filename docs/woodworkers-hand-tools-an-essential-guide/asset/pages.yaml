  md: '# Wobble necessary


    If you use an awl in place of a centerpunch, you may or may not ''want'' to wobble
    the awl—it all depends on the drill you''re using. If it''s a braid-point bit,
    or a Forstner bit, a single thrust into the wood will do. However, when using
    a twist bit, I found that if enlarge the hole by wobbling the awl (top drawing),
    the tip of the bit will have less tendency to wander.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_12_0.png)


    # As a holder


    But an awl can be used for more than marking starter holes. It is also useful
    as a holder or a "third hand," and as a marking tool. I often use an awl as an
    all-purpose holder to temporarily 하다 thin materials together, or as the pivot
    point when scribing a long, graceful arc with a thin strip of wood and a pencil
    (middle photo). An awl is equally effective as a "third hand" when you''re working
    by yourself with long boards, or anything greater than your arm span: secure the
    end of a tape measure or chalk line to a work-piece with an awl, and then stretch
    it to the opposite end to measure or snap a line.


    # Marking


    I''ve known a few wood who prefer a sharp awl to a pencil. The, tapered blades
    of awls make them particularly useful for reaching into tight corners, such as
    when marking pins for dovetails. You can use one in lieu of a marking knife (bottom
    photo); just make sure to keep the point razor-sharp, as it will tend to tear
    wood fibers instead of cutting them like a knife.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_12_1.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CENTER-PUNCHES


    Although a center-punch is often thought of as a machinists tool, many woodworkers
    (including myself) find them useful in the shop. When I have a lot of holes to
    mark for drilling, usually reach for a center-punch or for my automatic center-punch
    (top photo). Also, since I often incorporate metal into the jigs, fixtures, and
    projects I build, a center-punch is the best tool for marking hole locations.
    You''d quickly dull the point on a standard scratch awl if you were to use it,
    instead of a center-punch, metal.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_13_0.png)


    # Automatic center-punch


    An automatic center-punch has an internal spring that releases when the tool is
    depressed, forcing an internal plunger or anvil to strike the tip and leave a
    dimple on the work-piece (middle drawing). The springs on most automatic center-punches
    are adjustable so that you can vary the depth of the dimple.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_13_1.png)


    # Tip angle


    Depending on what material you''re drilling into, you may need to have a couple
    of center-punches, each with the tip ground to a different angle (bottom drawing).
    If you''re drilling into metal with twist bits, you''ll want an angle around 60
    degrees to match the angle of the twist bit. For marking in wood where you''ll
    be drilling with a brad-point or Forstner bit, you''ll find that an angle around
    45 degrees works best. Shop Tip: If accuracy is critical when locating a hole
    in wood, your best bet is to make a small dimple in the wood with an awl, and
    then use this as a starting point for a center-punch.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_13_2.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# RULES


    If told me I could have only one measuring tool in the shop, I''d be hard-pressed
    to decide between the 6" metal rule that lives in one apron pocket and the 12-foot
    Starrett tape measure in the other. Although you might think I''d go for the tape
    rule, I''d stick with the metal rule. Why? It''s accurate, not for laying out
    joints, but also for checking them: A tape measure doesn''t slip into a tongue
    or rabbit cut the edge of a board like a metal rule. Fortunately, I don''t have
    to make that.


    # Type of rules


    Woodworkers can choose from a wide variety of rules made of either metal or wood
    (top photo). I prefer a metal rule because its thickness reduces problems with
    parallax associated with the thicker wooden rules. In my shop I have a 6", 12",
    and 1-meter metal rule. Another specialty rule is a hook rule (top inset). It
    has a plastic hook on one end that catches the edge of the work-piece for super-accurate
    measurement. When buying a graduation, check to make sure that the graduations
    are etched into the metal and not simply printed on (middle photo). Printed graduations
    can wear off time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_14_0.png)


    # CHECKING A RULE


    For a rule to have anything, it must be accurate. Check the graduations of your
    rules against each other—you may be surprised to find they''re not the same. The
    two rules in the photo near right are off almost 1/32". This is an excellent reason
    to use a single rule throughout a project; if you use multiple rules and tape
    measures, you may inject errors that cannot be traced. Also, check


    your rules for flatness (photo below right). Set a rule on a known-flat surface
    and place a pair of flat scraps (called winding sticks) on the rule. Sight along
    the top of the sticks to check for twist; replace any rules that aren''t absolutely
    flat.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_14_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_14_2.png)


    MEASURING AND MARKING TOOLS 13'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# LAYOUT TIPS


    # Block of wood


    A common cause of inaccuracy when using a metal rule is in measuring from the
    edge of a work-piece. The problem is positioning the rule so that it''s absolutely
    flush with the edge. Many woodworkers use their finger as a stop and press the
    rule into their finger. Good idea, but the rule will often go past the edge when
    pressed into the resilient flesh. A better solution is to use a scrap of wood
    as a stop (top photo). I always have a few small scraps of MDF (medium-density
    fiberboard) lying around just for this. This MDF is super-flat and resistant to
    warp. Just press the scrap firmly against the edge of the work-piece and butt
    the end of the rule up against the scrap.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_15_0.png)


    # Center of a board


    Here''s a quick tip for finding the center of a board with a rule. Position one
    end of the rule flush with the edge of the work-piece (the scrap block mentioned
    above works here). Then pivot the rule until a number that''s easily divisible
    by 2 rests directly over the opposite edge. Divide this number in half and mark
    the center (middle drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_15_1.png)


    # Dividing a board equally


    Quick: You need to divide a board that''s 9/8" into five equal parts. The solution?
    Modify the "center of a board" trick above. Place an end of the rule flush with
    one edge of the work-piece. Pivot the rule until a number (10, in this case) that''s
    easily divisible by the desired units rests directly over the opposite edge. Then
    mark to create equal spacing (bottom drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_15_2.png)'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# FOLDING RULES


    Long before the tape measure arrived, the folding rule was used for layout and
    measuring (top photo). Typically made of wood with brass protecting the ends,
    the most common of these was the four-fold 2foot rule that fits easily in a pocket.
    A modern type of folding rule is the zigzag rule (background in top photo). Although
    I usually use a tape in the shop, I often reach for a folding or zigzag rule when
    measuring inside dimensions, anytime that the flexibility of a tape would cause
    a measurement error.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_16_0.png)


    # Extension


    One advantage some zigzag rules have over a folding rule is that they often have
    a built-in extension (middle photo). This extension is a metal bar that slides
    out of one to make inside measurements a snap. (See page 17 for a tip on making
    accurate inside measurements with a tape measure.)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_16_1.png)


    # LEVEL AND PRORACTOR


    Folding rules were in use for many years before the tape measure took over, and
    they evolved to offer extra bells and whistles that tape measures don''t.

    Shown in the photo above are two features that were quite common: a built-in level
    and a set of marks on the pivot point for accurately


    good angles. Here''s a good example of older tool that can do more than its modern
    equivalent. This theme recurs throughout this book because I''m a fan of older
    tools—not just because


    they''re old, but because they''re often better than today''s tools and offer
    features you just can''t find anymore.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_16_2.png)


    MEASURING AND MARKING TOOLS'
  merge: -1
