  md: '# GRIPS


    There are three widespread grips used with chisels: underhand, overhand, and the
    blade grip. Each may be used to cut a single joint.


    # Underhand grip


    I use the underhand grip most often when I''m making a paring cut. With this grip,
    the handle of the chisel rests in the palm of one hand while the other hand guide
    the blade (*top photo*). As you lean forward, the blade begins to pare. At any
    point, you can quickly stop the cut by “pinching” the blade with your fingers.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_0.png)


    # Overhand grip


    The overhand grip is especially useful for vertical par cuts, such as when cleaning
    out a shoulders of a mortise or trimming the trimmers (*middle photo*). One hand
    wraps around the chisel (typically with the thumb resting on top), and the other
    hand guides the blade. This grip lets you get your shoulder and weight into the
    cut and works especially when trimming stubborn end grain.


    # Blade grip


    Another grip I often use is the blade grip (*bottom photo*). Here, I grip the
    chisel by only the blade so that I can use my other hand for the mallet to drive
    the chisel. This grip lets me position the chisel tip with pinpoint accuracy.
    Another version of the blade grip is the slicing cut, shown in the bottom photo
    on the opposite page.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_113_1.png)'
  merge: -1
  pgno: 113
