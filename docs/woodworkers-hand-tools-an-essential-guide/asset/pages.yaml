  md: '# TRIMMING

    GROOVES


    In addition to cleaning up mortises and

    tenons, I routinely use a chisel to fine-tune

    groves, rabbets, dados, and other joints.


    # Paring sides


    One of the more common paring tasks is

    removing just a bit of material from the side of a

    grove or other joint. Whenever possible, I use

    the blade for this and take a slicing cut (top

    photo). This offers a couple of advantages over

    the more conventional vertical paring

    stroke. First, skewing the blade creates a

    cleaner shearing cut. Also, it makes it\easy to slide the flat back of the chisel

    along the side of the groove or dado as

    a steady starting point. This way you

    start with a very light cut and ease into

    the waste.


    # Ends of the groove


    Whether a groove is cut by hand or

    by machine, there''s often a tendency for

    the final few inches of the groove to be

    incorrect depth. This can be caused

    by letting up a spinning bit or blade, or

    passes over the workpiece as it

    by easing pressure near the end of a cut

    made by hand. I

    use an underhand cut and pare away the waste

    with a series of light cuts (middle photo). See

    page 121 for a handy tip on using a gauge block

    to gauge the depth accurately.


    # Cleaning up the bottom


    Cleaning up the bottom of a groove is fairly

    straightforward. Here again, flip the chisel to

    the bevel is below, and run it along the bottom

    (bottom photo). Inverting the bevel like this

    prevents it from catching and digging into the

    groove.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_117_0.png)'
