  md: '# DRAWING

    SMALL CURVES


    If you''re drawing-challenged, like me, you''ll find a set of French curves a
    real boon when it comes time to lay out graceful curves for a project. French
    curves are available individually or in sets in a variety of shapes and sizes
    (top photo). Most are made of sturdy acrylic and may be clear or tinted. I prefer
    the clear curves, as this allows me to easily see the grain and can position the
    curves to maximize interesting grain patterns. French curves are available in
    most woodworking catalogs and at any art store.


    # Basic use


    I most often use French curves to create patterns or templates (like the cabriole
    leg shown in the middle photo). Slide the curve up and down the work-piece until
    the desired curve is found. Trace the curve up with a pencil or marking knife
    (I generally use a pencil, since a marking knife can cut and nick the plastic).
    French curves can also be used to lay out ovals (inset). Here again, position
    the curve until the desired shape is obtained, and trace around pair of light
    marks on the A will help you align it for the remaining quadrants.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_38_2.png)


    # FLEXIBLE CURVES


    A flexible curve is basically a lead rod covered with a vinyl sheath (right photo).
    This clever tool can be bent into small, graceful curves and is especially useful
    for reproducing a curve from an existing part, such as pressing it around a cabriole
    leg that you want to reproduce. Flexible curves can be found in most woodworking
    catalogs and at most art store.


    MEASURING AND MARKING TOOLS 37'
