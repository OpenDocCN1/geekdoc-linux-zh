  md: 'Besides knowing how to sharpen a scraper (see pages 186-187), there are a couple
    of tricks to the "magic" of a scraper: flexing, finding the angle and skewing.


    # Flexing


    Technically, you can use a scraper without flexing it at all. The problem is your
    asking the scraper to take off shaving its full width. For a standard scraper,
    that''s around 4/2" to 6" wide! Even with a sharp scraper and a lot of elbow grease
    this would be difficult. Instead, you can reduce the cutting area by flexing the
    scraper slightly (top photo). Grip the ends of the scraper with both hands, and
    press lightly in the middle with both thumbs. Note that the greater the flex,
    the smaller the cutting area and the more of a scooping cut you''ll make.


    # Finding the angle


    Here''s the tricky part that confuses a lot of woodworkers: finding the correct
    scraping angle. What makes such a challenge is that it''s different for every
    scraper, and will most likely change every time you burnish the edge. And that''s
    normal. Burnishing isn''t an exact science, and the angle will change. As long
    as you can feel a buzz, all you have to do is tilt the scraper forward or backward
    until it "bites into the wood (middle photo). When it does, just lock your wrists
    in this position and start scraping.


    # Skewing


    Just as with a hand plane, skewing a scraper produces more of a shearing cut and
    will likely produce nicer shavings (bottom photo). Note that if you''re producing
    dust, either your scraper is dull or you''re at the wrong angle. It''s also important
    to remember that when you skew something, you effectively reduce its ability to
    smooth out highs and lows—instead, the tool will follow surface undulations.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_98_2.png)'
