  md: '# SHARPENING

    TERMINOLOGY


    For an edge to be truly sharp, the two surfaces that meet to the bevel angle must
    be flat and honed the same amount (top photo). This obvious fact is one of the
    most commonly overlooked factors in sharpening tools. I of woodworkers spend considerable
    time and effort honing a bevel to a mirror finish, only to ignore the block. Both
    must be honed to the same degree of finish for the surfaces to meet cleanly at
    the edge (middle drawing).


    will be honed. With a flat grind, the entire bevel rests on the stone unless you
    choose to use a microbevel. The advantage to this is the same as for a hollow
    grind—less material to be removed faster honing.


    Although there are a lot of different-edged tools in the workshop, you''ll likely
    spend most of your time sharpening blades and chisels. There are four common ways
    to handle the grinding and honing of these edges: a flat grind, a flat grind with
    a microbevel, a hollow grind, and a hollow grind with a microbevel (bottom drawing).
    Which you use is really a matter of preference.


    Personally, I prefer to hollow-grind the edges of my cutting tools (the hollow
    results from creating the bevel on a grinding wheel). The big advantage to this
    is that there''s a less material to remove when you hone the bevel. Since the
    bevel is concave, only the toe and heel will rest on the stone, and the toe and
    heel


    > Both Surfaces Must Be Flat to Create Sharp Edge


    | FLAT | FLAT GRIND WITH MICROBEVEL | HOLLOW GRIND | HOLLOW GRIND WITH MICROBEVEL
    |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_175_0.png)'
