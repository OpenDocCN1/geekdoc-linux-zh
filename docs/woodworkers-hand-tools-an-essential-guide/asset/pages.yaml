  md: '# HAMMER TERMINOLOGY


    Metal handles are often forged along with the head and therefore will never loosen.
    Composite handles (fiberglass or other plastic composition) are usually secured
    to the head with high-grade epoxy. Although these have much less loosening compared
    to a a handle, they can break free from the head under heavy use.


    Although I rarely use nails in my woodworking projects, I use hammers regularly.
    I''ll pick up one to drive in wood pegs, tap parts together, and drive chisels
    (with my Japanese hammer). I use a couple of different weights of claw hammers,
    two sizes of Warrington hammer for driving in brads, and a ball-pen hammer for
    metalworking (top photo).


    Regardless of the type, virtually all hammers are similar in construction (bottom
    drawing). This simple tool consists of a handle and head, and depending on the
    type of handle, one or more wedges to keep the head secured. Wood handles (like
    the one shown in the drawing below) typically have three wedges: one wood and
    two metal. The wood wedge spreads the sides of the tenon to grip the head, and
    the metal wedges help distribute the pressure evenly.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_141_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_141_1.png)'
