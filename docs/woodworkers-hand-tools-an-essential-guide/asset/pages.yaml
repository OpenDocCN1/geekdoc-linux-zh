  md: '# BEVEL-EDGED

    CHISELS


    When I say "chisel," the image that pops

    into woodworkers'' minds is a bevel-edged

    chisel like any those shown in the top photo.

    It''s ironic that these chisels have been marketed

    so long as bevel-edged that most people don''t

    realize that these are actually firm chisels.

    What''s really odd is that many woodworkers

    think that firm chisels are a completely differ-

    ent type of chisel. A bevel-edged chisel where the edges have

    beenveled up toward the

    top of the blade.


    As I mentioned earlier,

    the advantage to beveling

    t edges is that this pro-

    duces a chisel more adept at

    fitting into tight places,

    such as when removing the

    waste or trimming between

    dovetails (middle photo). This

    same slim profile allows a

    bevel-edged chisel to trim

    sliding dovetails (bottom

    photo) and other hard-to-

    reach places. The downside

    to beveling the edges is that

    itit removes metal that would

    normally soften the chisel.

    This makes bevel-edged chisels more

    suitable for delicate work. I have occa-

    sionalmente take a mallet to mine, but if

    I''ve got a lot of wood to remove, I gener-

    ally use a square-edged firmer chisel or

    mortise chisel. Bevel-edged chisels can

    be purchased individually or in sets, in

    widths ranging from 1/8" up to 2". The

    most common sets consist of six chisels:

    1/8", 1/4", 3/8", 1/2, 3/4", and 1".


