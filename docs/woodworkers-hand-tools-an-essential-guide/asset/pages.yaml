  md: '# CENTER FINDERS


    Finding the center of a work-piece is a layout task. It''s so common that a number
    of tool manufacturers make plastic center finders, like the one shown in the top
    photo, specifically for this task. These simple tools have lips on two adjacent
    sides to quickly position the work-piece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_0.png)


    # Basic use


    To use a center finder like the one shown here, press the edges of the work-piece
    up against the lips of the center finder. Then butt a pencil or marking knife
    against the center cutout and draw a line on the work-piece. Next, rotate the
    work-piece 90 degrees and make another mark. Where the lines intersect is dead
    center (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_1.png)


    # SHOP-MADE CENTER MARKER


    In addition to finding the center of a work-piece, you''ll often need to find
    the center on the edge of a board. The simplest and most accurate way I''ve found
    to do this is to make your own center marker. This is nothing more than a scrap
    of wood with a pair of dowels (or better, steel pins) and a hole in it for a pencil
    (drawing at right). The challenge is locating the pencil dead center. To do this,
    start by marking out and drilling the dowel holes (or use short lengths of 1/4"
    rod). Then install the dowels with glue (or epoxy for the metal rods). Now use
    these to locate dead center. Simply place a metal rule on edge between the dowels
    on a diagonal and make marks in both directions. Drill a hole for the pencil where
    the lines cross. (NOTE: For maximum accuracy, size this hole to accept a mechanical
    pencil.)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_35_2.png)


    MEASURING AND MARKING TOOLS'
