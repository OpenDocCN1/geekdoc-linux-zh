  md: '# PIPE CLAMP TIPS


    Double up clamps


    Although most of my pipe clamps are 5 to 6 feet long, I occasionally come across
    a clamping job where they''re too short. A simple way to extend the reach of the
    clamps is to double them up. To do this, interlock the tail portions of the clamps
    as shown in the top photo. Although this method works for light pressure, you
    may want to clamp the tail portions together with a G-clamp to keep them from
    slipping apart under heavier pressure.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_0.png)


    Couplers


    Another way to lengthen your pipe couplers on hand. Black pipe couplers like the
    one shown in the middle photo cost less than a buck and can be used to connect
    two of your pipe clamps together. I keep a couple of 3- and 4-foot lengths of
    black pipe around just for this purpose. I slide the end of the clamp off the
    pipe, add a coupler and the desired spare black pipe, slip the clamp end back
    on, and volfa-an instant pipe-stretcher.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_1.png)


    Even pressure


    This is one of my favorite tips for pipe clamps, which will really improve your
    ability to glue up flat panels. The heads of pipe clamps tend to tilt when tightened,
    resulting in an uneven pressure. To get around this, insert a dowel (or a rounded-over
    scrap piece) between the clamp heads and the workpiece (bottom drawing). The dowel
    both centers the clamping pressure on the workpiece edge and helps distribute
    it evenly.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_165_2.png)'
