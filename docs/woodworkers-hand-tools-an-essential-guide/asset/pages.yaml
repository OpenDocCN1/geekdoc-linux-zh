  md: '(continued from front flap)


    a good file or rasp will do. Leave a personal mark on your work with a little
    knowledge and a keen edge.


    Assembly tools such as hammers and screwdrivers are easy to take for granted.
    They''re everywhere, everyone knows how to use them (or they think they do), and
    one is as good as the next, right? Actually, there are differences in quality,
    function, and use that can make all the difference in your completed pieces. These
    tools are the ones you reach for install drawers or attach doors. This is not
    the place for a bargain-bin, one-size-fits-all.


    You can never have too many clamps. But you need to have the right kind: if you
    have three dozen spring clamps but only two pipe clamps, you''ll never be able
    to glue a panel successfully. You also need to know when and how to use—and not
    over-use—different types. And finally, you can avoid frustration, botched jobs,
    and personal injury by knowing more about your sharpening options.


    Learn what''s out there and how to use it to best effect.


