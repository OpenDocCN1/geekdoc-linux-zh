  md: '# APPENDIX:

    Restoring Old Hand Tools


    I love to bring an old hand tool back to life. I often scrounge auctions and yard
    sales, looking for lively candidates. As long as the castings are sound and dirt
    cheap), I''ll adopt it and bring it home. Keep in mind that I''m interested in
    using the took so I''ll do more to it than a collector. Most collectors are interested
    in preserving the tool''s patina, and that''s fine. But the once-over I give a
    tool (described here) put most collectors in shock. If you''re interested in collecting
    tools and want to learn more about what you should or shouldn''t do to an antique,
    visit the Mid-West Tool Collectors Association website at www.wtca.org. They''re
    a great organization.


    # Disassemble and clean


    To work on an old tool, I begin by taking it completely apart (top photo). This
    lets me check the condition of all the parts and makes them easier to clean. I''ll
    clean most parts with a mild detergent solution, if if and resin have built up,
    I''ll scrub this away with a cloth or nonwoven abrasive pad dipped in acetone,
    mineral spirits, or lacquer thinner (middle photo).


    # Remove rust


    Next, I''ll tackle any rusty areas (bottom photo). Depending on whether it''s
    rust or heavily pitted, this can require anything from scrubbing the part with
    a Wonderbar (a great product) to using a wire brush, or even the magic of electrolysis
    (sidebar on the opposite page).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_189_0.png)'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Sharpen parts if necessary


    If the tool employs a part with a cutting edge, I''ll sharpen it using my standard
    sharpening technique (top photo). For more on sharpening, see pages 182—183.


    # Reassemble


    When all the parts are clean, free from rust, and sharp (if applicable), I''ll
    put the tool back together (middle photo). As I do this, I''ll add a drop or two
    of machine oil to linkages and will usually apply a coat of oilpaste to cast-iron
    surfaces to prevent future rust. If the tool has wood parts (like the plane shown
    here), I''ll apply a light coat of oil to them to keep out dry and grime. Then
    on the best part—the tool best way to spend an afternoon in the shop!


    # REMOVING RUST WITH ELECTROSIS


    Here''s a slick way to remove rust from your tools using, of all things, electrolysis.
    Electrolysis passes a small electrical current through a battery charger through
    a rusty tool that''s submerged in an electrolyte solution. An exchange of ions
    takes place, and the rust flakes away. Here''s how to do it: First, mix an electrolyte
    solution (1 tablespoon of baking powder per gallon of water) in a nonconductive,
    plastic container. Then, remove all nonmetallic parts from the tool. Clamp the
    positive (red) lead of a 2-amp battery charger to an anode—an anode is just as
    large, flat piece of steel (like a kitchen pan lid). And connect the negative
    (black) lead to the rusty tool.


    is completely submerged and the red clip that attached to the anode is above the
    solution to prevent it from corroding. Turn on the battery charger, and check
    that it''s not drawing more current than it''s rated (this is where a built-in
    amperes is indispensable). If it is drawing too much, or not enough, move the
    tool further away or closer to the anode (SAFETY NOTE: make all of adjustments
    with the charger unplugged!) You''ll start to tell when you start to see bubbles
    forming on the surface of the tool. The average tool will de-rust in two hours.
    Turn off the charger, put on rubber gloves to remove the tool, and fasten the
    clips. You''ll find a lot of black crud on the tool. The quickest way to remove
    crud is with an abrasive pad. Scrub the surface with a pad dipped in warm, soapy
    water. If the rust is gone, you''re done. If not, repeat the process until it
    is.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_190_0.png)


