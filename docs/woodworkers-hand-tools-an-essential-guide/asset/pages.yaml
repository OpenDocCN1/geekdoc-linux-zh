  md: '# TUNING HAMMER


    I learned to “tune” a hammer from an old carpenter. It was something he''d do
    as he packed up his tools every Friday. Although it''s unlikely that you''ll need
    to tune your hammers once a week as he did, it''s a good idea to inspect them
    regularly and tune them when needed. This takes only 5 minutes and consists of
    flattening the face, sharpening the claws, and maintaining the handle.


    # Flattening the face


    With use, the face of a hammer tends to get dinged up. This makes it difficult
    to hit a nail squarely on the head. Also the ‘pockets’ created by the dings can
    collect rust and other junk. It just makes sense to routinely flatten the face
    of your hammers by taking a few light strokes with a smooth mil (top photo).


    # Sharpening the claws


    The claws on a hammer will also get dinged and worn over time. There are two areas
    that need attention. First, since I often drive the claws of the hammer into a
    2x4 when framing so I can lift it, I like to keep the ends sharp. A few licks
    with a file will bring back a sharp edge (middle photo). The inside edges of the
    claws are used to “bite” into these edges by rocking the head of hammer on sandpaper.


    # Handle


    What you do to a handle will depend on what it''s made of. All handles should
    be cleaned regularly to remove pitch and dirt. Wood handles will benefit from
    an occasional coat of oil. Also, don''t hesitate to shape a wood handle to better
    fit your hand (bottom photo). Go over metal handles lightly with an emery cloth
    to remove any rust. Follow this with a light coat of machine oil. Little can be
    done with composite handles except regular cleaning.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_144_0.png)'
