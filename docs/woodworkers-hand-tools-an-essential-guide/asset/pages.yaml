  md: '# NATURAL OILSTONES


    When I first delved into sharpening some 25 years ago, man-made stones were of
    questionable quality, and the only reasonable choice was to use natural stones.
    I still have the original oilstones I bought back then and am glad I do. It''s
    increasingly hard to find quality oilstones (especially in the larger bench stone
    sizes), as the deposits have already been systematically mined. The most famous
    of these are the novaculite deposits in Arkansas. Novaculite is a natural abrasive
    that holds up extremely well over time.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_0.png)


    # Varying grits


    Arkansas stones are available in four grits. From coarse to fine, they are Washita
    (top photo), soft Arkansas (middle photo), hard Arkansas (bottom photo), and black
    hard Arkansas (bottom inset).


    A light machine or honing oil is the lubricant of choice with these stones and,
    if used in progression, can create a razor-sharp edge on your tools.


    Although I have switched primarily to waterstones (see page 177)


    I pull out the desired stone, add a drop of oil, and sharpen away. A quick wipe
    with a clean cloth and the tool is ready for use, and the oilstone can go back
    on the shelf. Contrast this to the water mess when sharpening with waterstones,
    and it''s easy to see why I still use these. If your budget allows for both oilstones
    and water, terrific. If I had to choose one, I''d go with the faster-cutting waterstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_176_2.png)'
