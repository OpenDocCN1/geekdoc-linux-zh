  md: '# TRY SQUARES


    Try squares have long been a mainstay of the woodworker. We use them to lay out
    and mark boards for joinery, and to check edges to make sure they''re true square.
    A try square consists of a metal blade and either a wood or metal stock (top photo).
    Most quality wood stocks have the edges faced with brass. Although an engineer''s
    square (see page 19) does the same job as a try square, with a higher degree of
    accuracy, I still like the feel of a handled try square; when accuracy is critical,
    I''ll reach for an engineer''s square.


    A specialized version of the try square is the miter square (inset). It serves
    the same function as a try square, but the blade inset in the stock at 45 degrees
    for checking and laying out miters.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_0.png)


    Photo courtesy of Bridge City Tool Works, copyright 2001


    # Checking a try square


    Just like any other layout tool a try square isn''t accurate, it''s not much worth.
    We check whether a try square is actually square, place the stock up against a
    known-flat edge (middle-drawing). Draw a line along the blade and flip the stock
    over. Align the blade with the line you just drew—it should be in perfect alignment.
    If not, you''ll have to adjust the stock or the blade by filing it down. (For
    a nifty alternative to this, see the sidebar below.)


    Then Flip Square to Whether Blade Aligns with Line


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_1.png)


    First, Set Square against Edge and Draw Line


    # ADJUSTABLE SQUARES


    Even though I prefer a try square with a wood stock, these can go out of square
    over time. That''s because the wood in the stock is constantly moving to changes
    in relative humidity. This can loosen the rivets that hold the blade in place.
    Bridge City Tool Works produces a set of adjustable squares designed to get around
    this problem. You can tweak the angle of the blade with an Allen wrench (photo
    at left)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_19_2.png)


    18 MEASURING AND MARKING TOOLS'
