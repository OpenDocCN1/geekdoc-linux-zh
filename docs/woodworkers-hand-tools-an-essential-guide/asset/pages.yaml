  md: '# SANDVIK

    FILES


    I was skeptical the first time I read the package on a Sandvik file I was considering
    purchasing. If the file was only half as good as they promised, it''d be worth
    the money. According to the package, here was a nifty product that would virtually
    replace both the files and the sandpaper in my shop. Although this certainly hasn''t
    happened, the Sandvik files I''ve bought over the years have found a home in my
    tool cabinet (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_137_0.png)


    # Tiny holes


    Sandvik files (and abrasive tools, like their sanding block), are all faced with
    a special steel plate that has a series of holes punched in the surface to replicate
    a variety of abrasive grits. What makes this work is that the holes are punched
    in the metal with sandpaper, which wears out quickly, the sanding plates last
    considerably longer. When they wear out, you can purchase a replacement plate.


    # Basic use


    Unlike standard files, Sandviks don''t have to be pushed or pulled in one direction.
    You can literally move these in any direction and they''ll cut (middle photo).
    This makes them particularly handy when working in tight quarters. The only secrets
    to using these are to let the sanding plate do the work, and to clean them often
    by rapping the tool against the side of your bench.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_137_1.png)'
