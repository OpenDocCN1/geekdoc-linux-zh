  md: '# STROPS


    Certain types of leather contain a natural abrasive that makes them ideal for
    touching up an edge. I''m sure you''ve seen a strop in action at a barbershop,
    where they''ve traditionally been used to create a super-fine edge on a straight
    razor. These long flexible strops (top photo) work well for this but are generally
    too flexible for most woodworking (with the exception of some knives). A better
    alternative is a paddle-type strop, where a piece of leather is fastened to a
    wood paddle or block (middle photo). This less-flexible strop works better for
    both straight-edged and curved tools.


    Strops are particularly popular with carvers, as they permit quickly restoring
    a keen edge without the mess of oil or water. You can vary the aggressiveness
    of the strop by "charging" the surface with different grits of rouge. Simply rub
    the rouge on the surface in the same direction as you''d use for honing—usually
    a trailing stroke; that is, the body of the tool is always moved so the bevel
    trails. In stropping the other way, with the edge leading the tool, it will dig
    in and possibly cut the leather.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_181_0.png)


    # SLIPSTONES


    Slipstones are another favorite of carvers. These are small, odd-shaped stones
    that are designed to "slip" into the rounded and V-shaped edges of carving tools
    (photo at right). They are available in a variety of shapes and sizes, different
    materials (both natural and man-made), and numerous grits. For the most part,
    I use these primarily to remove a burr on the inside edge of a carving tool that
    I''ve created with a regular stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_181_1.png)'
