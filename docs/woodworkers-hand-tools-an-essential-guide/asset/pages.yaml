  md: '# COPING AND FRET SAWS


    Coping and fret saws are yet other types of frame saws where the blade is held
    in a tensioned frame that is adjustable (top photo). Most coping saws accept a
    6/8"long, very thin, narrow blade with fine teeth—typically 15 to 32 teeth per
    inch. Fret saws often have deep throats or an adjustable frame, and accept blades
    with extremely fine teeth: as high as 96 teeth per inch. Both coping and fret
    saws are terrific for cutting curves, making pierced cuts, and getting into tight
    places. Coping saws have the added feature of a blade that can be pivoted to make
    it easier to follow a curve.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_53_0.png)


    # Anatomy


    Blade tension for coping and fret saws is supplied by the steel frame. The frames
    are usually held in place with cross pins (although older coping saws may use
    blades with a hook or loop on the ends). These cross pins fit into grooves in
    metal spigot at the top of the frame and in the handle (middle drawing). The handle
    spigot threads into the handle and allows for fine adjustment of the tension.


    # Changing blades


    To change the blade on a coping saw or fret saw, start by loosening the handle
    a few turns. Then position the saw upside down on your bench and press down on
    the handle slightly to "close" the frame (bottom photo). This creates sufficient
    slack in the blade so that you can slip the pin at one end of the blade out of
    the corresponding spigot. To install a blade, reverse the procedure. Insert the
    blade in one spigot, depress the frame, and slip the other pin in its matching
    spigot. Apply additional tension by tightening the handle.'
