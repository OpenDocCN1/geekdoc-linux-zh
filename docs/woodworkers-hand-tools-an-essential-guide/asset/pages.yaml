  md: '# BASIC CHISEL TECHNIQUE


    Whatever chisel work you''re planning, the first step is to secure the workpiece.
    For light work, such as paring, you can just clamp the workpiece in your bench
    vise. But if you''re doing heavier work (especially like chopping mortises), clamp
    the workpiece to the top of the bench. For the best support, to position it directly
    over (or as close as possible to) the legs of the workbench (top photo). This
    helps dampen vibration and prevents the workpiece from bowing under heavy blows.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_114_0.png)


    # Support block


    For chisel work where you''re paring the full width of the workpiece, or through
    the workpiece, you should always insert a support block under it (middle photo).
    A support block not only protects your workbench from certain damage, but also
    helps prevent tear-out by solidly supporting the wood fibers where the chisel
    exits the work.


    # Slicing cut


    Although I''ve always considered a slicing cut to be one of the more basic chisel
    techniques, I rarely see it being used. This specialized form of the blade grip
    should be in every one''s bag of tricks. I use two forms of this cut. With one,
    I grip the blade almost like pare away wood (top photo on page 16). With the other
    form, I grip the blade with one hand and use the other as a fulcrum. This way,
    I can pivot the chisel into the workpiece, such as when slicing a dowel flush
    with a surface (bottom photo). Either way, it''s a great grip.


