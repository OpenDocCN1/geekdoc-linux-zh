  md: '# FIRMER CHISELS


    Firmer chisels are general-purpose woodworking chisels that are some of the workhorses
    of any shop (top photo). When most woodworkers think of firmer chisels, they envision
    rather stout, square-sided chisels like those shown in the top photo. But bevel-edged
    chisels (see page 110) also are firmer chisels—their sides are tapered toward
    the top. Most firmer chisels have blades roughly 4" long and in widths varying
    from 1/8" up to 2". The handles may be wood or plastic.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_0.png)


    # Profile


    The basic difference between a firmer chisel and a bevel-edged firmer chisel is
    its profile (middle drawing). The square sides of firmer chisel create a strong
    blade that''s fully capable of handling light to moderate blows. The advantage
    of beveling the edges is it gives greater access when trimming joints like dovetails.
    The downside to this: The blade is not as stout as a standard firmer chisel, and
    a mallet should be used sparingly and lightly with this more delicate chisel.


    | Bevel-Edged Chisel | Firmer Chisel |


    # Anatomy


    A firmer chisel consists of three parts: blade, handle, and ferrule. In most cases,
    the blade has a tang that fits into a hole drilled in the end of the handle (bottom
    drawing). The ferrule (often brass) helps prevent the handle splitting if the
    chisel is struck with a mallet. Registered chisels are often confused with firmer
    chisels because they look alike. This is how you tell: A registered mortise chisel
    typically has a thicker blade and a ferrule on the end of the handle to prevent
    "crowning," or mushrooming of the handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_118_1.png)'
