  md: '# Using a bench hook


    A bench hook is positioned on the workbench so the cleat is on the bottom hooks
    onto the edge of the workbench (top photo). The work-piece is butted up against
    the cleat on top, and slid over the cut line aligns with the end of the cleat.
    This lets you use the cleat as a guide block to start the cut. The cleat also
    supports the wood fibers to help prevent splintering or tear-out.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_0.png)


    # Sight guide


    Even with a bench hook, you may want to use some type of sight aid to help keep
    the saw blade vertical. A tri square or engineer''s square works well for this
    when you set it near the saw blade (middle photo). You can also use a known-square
    block of wood. Whichever you use, try to keep an even gap between the sight guide
    and the saw blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_1.png)


    # TOOLBOX SAWS


    Toolbox saws are a modern invention that solves the age-old problem of trying
    to fit a full-sized handsaw into a toolbox box (note the size difference between
    the toolbox saw and handsaw shown in the photo at right). These short saws (typically
    around 16" long) fit in larger boxes and have aggressive teeth. Because of the
    aggressive teeth, they have limited use in the shop. They''re suitable only for
    rough cuts, such as when rough-cutting boards to length.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_48_3.png)'
