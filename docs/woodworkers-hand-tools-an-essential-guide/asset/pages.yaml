  md: '# BACK SAWS


    The back saw (also known as a dovetail saw) can be one of the most important hands
    tools in the shop. If you hand-cut joinery, a quality back saw can make a big
    difference. Back saws are identified by the brass or steel ''back'' that wraps
    around the top of the blade (top photo). This added rigidity allows for a thinner
    blade (around 0.030" thick), which creates a thin kerf and makes it easy to follow
    a pencil line or knife.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_0.png)


    # Anatomy


    Back saws come in a variety of lengths ranging from 8" to 14" and have fine teeth
    (14 to 22 teeth per inch) that may be sharpened as crosscut, rip, or combination
    teeth. If you''re planning on doing a lot of hand-cut joinery pay for two back
    saws: one with crosscut teeth, the other with rip teeth. You''ll find two predominant
    styles on back saws: open and closed (middle drawing). This is really a matter
    of personal preference; some woodworkers prefer the extra rigidity a closed handle
    offers over an open handle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_1.png)


    # Basic use


    Because the blade is so thin and the kerf is so fine, a well-sharpened quality
    back saw will generally steer itself in a perfectly straight cut—all you have
    to do is start the cut straight. Use a light grip on the saw and let it do the
    work (bottom photo). If you''re using a saw''s sharpened as a crosscut to rip
    (such as cutting the cheeks of a tenon), you''ll get better results if you stop
    often to clean out the kerf and the saw teeth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_50_2.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# GENT''S SAW


    A gent''s saw (also referred to as a dovetail, blitz, or slotting saw) is a special
    type of back saw designed for extremely fine work (top photo). A further refinement
    of this saw is known as an offset dovetail (inset). This type of saw features
    an offset handle and blade that can be reversed to make it easy to saw to a surface,
    as when trimming a through tenon. Since the handle is not in line with the blade,
    I don''t recommend this type of saw for cutting joints.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_0.png)


    # Anatomy


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_1.png)


    > Inset photo courtesy of American Tool Companies, Inc., copyright 2001


    | Steel or Brass Rib | Ferrule |

    |---|---|

    | Blade | Handle |


    # Basic use


    For the most part a gent''s saw should be reserved for use on small parts that
    require more delicacy than a back saw offers. They''re great for fine detail work
    like cutting small rabbets, tenons, or dovetails (bottom photo). Because the blade
    is so thin and the kerf is so tight, the saw will cut straight as long as you
    start it straight. The only exception to this is a saw''s not set correctly (see
    page 56 for more on this).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_51_2.png)'
