  md: '# BENCH VISES


    A workbench without a solid vise is like a power sander without electricity. You
    could still sand with it by rubbing it on the workpiece, but why not use it to
    its full potential? You''ll need to install at least one sturdy (two) quality
    woodworking vises (top photo) have long been a favorite of woodworkers (www.recordtools.com).
    In particular, their model 521/2ED, with its 9" jaws and 13" opening, is well
    regarded as one of the better-all purpose vises. Most of Record''s vises incorporate
    their patented "Quick-release" feature that lets you open and close the jaws quickly
    without having to turn the screw (inset).


    A bench vise should have belly castings and an adjustable front dog that can be
    used to clamp workpieces. The fixed jaw of the vise is generally "let in" or mortised
    into the front edge of the bench; the adjustable jaw moves in and out as the main
    screw is rotated by the handle (bottom drawing). Both jaws of the vise should
    be lined with wood to prevent damage to the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_170_1.png)


    CLAMPING TOOLS 169'
