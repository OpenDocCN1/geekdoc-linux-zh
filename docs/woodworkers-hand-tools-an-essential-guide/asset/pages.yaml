  md: '# WATERSTONES


    I can''t imagine woodworking without my waterstones. To me, they''re far superior
    to or other stones because they cut so fast to quickly produce a keen edge. Although
    you can still purchase natural Japanese waterstones, their high cost is usually
    prohibitive. In recent years, man-made waterstones that are much cheaper have
    hit the market. The stones I''ve been using for a while now manufactured by Norton
    (www.nortonabrasives.com). I like these because they''re wide enough to handle
    my widest plane blade and plenty long (8"x3''). They''re available in four grits:
    220, 1000, 4000, and 8000. I use the 220-grit stone only for shaping or repairing
    a nicked damaged blade.


    For waterstones to work effectively, they need to be thoroughly saturated. You
    should soak a waterstone in water for at least 10 minutes prior to use (top photo).
    As you use the stone, it''s important to keep the surface wet to prevent metal
    particles from becoming lodged in the surface (middle photo). I keep water at
    hand and dip my hand in periodically to drip addition on the stone.


    Since I''m continually sharpening my tools, I prefer to store my stones in water.
    This way they''re always ready to use. A plastic storage box with a tight-fitting
    lid works well for them. ShopTip: To eliminate the possibility of mold or mildew
    growing in the box, add a capful of household bleach to the box every time you
    change the water (bottom photo). Caution: Be careful not to leave your stored
    stones in an unheated garage. If the water freezes, the stones will crack and
    you''ll end up with really expensive slipstones.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_178_0.png)


    SHARPENING TOOLS'
