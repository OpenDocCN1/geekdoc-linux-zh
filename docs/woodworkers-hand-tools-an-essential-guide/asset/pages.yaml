  md: '# SCRUB PLANES


    A scrub plane (also known as a rough plane) is another one of planes that you
    don''t see around the shop much anymore (top photo). That''s because they''re
    designed to quickly remove a lot of wood—when thickening a board, for example—and
    this job has been taken over by the electric thickness-planar. In many cases,
    scrub planes were made from old, worn-out jack planes. The throat was widened
    to prevent jams, as the shavings were thick and rough. The blade was usually a
    single cutter with no cap iron (bottom drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_94_0.png)


    # Curved profile


    What makes a scrub plane cut so aggressively is the curved or "scoop" profile
    on its business end (middle drawing). A curved grind like this lets you remove
    a lot of wood. What doesn''t leave a smooth surface. But that''s irrelevant here;
    all a scrub plane is supposed to allow you to level a surface quickly, and it
    does just that.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_94_1.png)


    # Basic use


    Unlike most traditional planing, a scrub plane can be effectively used against
    the grain, or more commonly at a 45-degree angle. In addition to leveling surfaces,
    a scrub plane can also be pressed into service whenever you need to remove a lot
    of wood. The beginning cuts for scooping out a seat, a tamer at the end of a work-piece,
    or even the beginning stages of cooperating a scrub plane can handle. You can
    pick one of these up at an auction or yard sale for a few dollars, or can make
    your own by converting an old jack plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_94_2.png)


    SMOOTHING TOOLS 93'
