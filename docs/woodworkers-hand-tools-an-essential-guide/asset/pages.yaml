  md: '# TUNING A

    H PLANE


    For a jack plane or jointer plane to create thin, wispy shavings without tear-out,
    you''ll need to tune it. This involves flattening the sole, adjusting the frog,
    removing any slot in the cap iron, sharpening the blade, and fine-tuning the lateral
    and depth adjustments.


    # Flattening the sole


    The flatness of a plane''s sole will have a huge impact on its performance. The
    easiest way to check a sole for flatness is with a straightedge. I found that
    holding the plane up against a bright light while doing will show any dips or
    high spots.


    To flatten a sole, temporarily fasten some sheets of silicon-carbonide sandpaper
    to a known-flat surface with spray adhesive. A piece of replacement glass for
    a Jalous window works great (available at most hardware stores). What''s really
    nice Jalous glass is that its edges are rounded-over for safety. I usually start
    with 80-grit and work my way up to 220-grit.


    Although you might be tempted to remove the blade and cap iron,they keep tension
    on the sole. If you flatten it without this tension, then install the iron, the
    sole won''t be flat. Just make sure to back off the iron 1/8" or so before rubbing
    the sole on the silicon-carbonide paper. Use steady strokes, and flip the plane
    end-for-end to ensure even pressure over the entire length and width of the sole
    (top photo). Check sole for progress. Although purists flatten the entire sole,
    the only parts where it''s critical that it flat are the toe, heel, and around
    the throat (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_0.png)


    # The frog


    The frog is another important part of the plane. It holds the plane iron firmly
    at the proper angle, while at the same time letting you adjust the depth of cut
    and the position of


    ![](img/82f8fd51f2b064bbc4df21354d664e50_65_1.png)'
