  md: '# CIRCULAR

    PLANES


    A circular plane (or compass plane, as it''s often called) is another one of those
    specialized planes that you''ll be glad you have when a project calls for planing
    a fair curve (top photo). The most distinctive feature of a circular plane is
    that it has a thin, flexible sole (bottom drawing). Adjusting the curvature forces
    the sole into either a convex or concave shape. The blade and cap rest on a frog
    that works much like that of any other metalbodied plane.


    Although Recoil still produces the No. 020C shown here, you can occasionally find
    a Stanley No. 13 (highly prized by tool collectors) at


    tool auction or on the Internet. I realize that many woodworkers would simply
    grab a belt sander or other electric sanding device to smooth a curved plane;
    but a circular plane will leave a cleaner, more fair curve than you can achieve
    with one of those noisy tools.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_91_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_91_1.png)'
