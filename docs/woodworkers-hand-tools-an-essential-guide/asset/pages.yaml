- img_proc: true
  md: '# Convex planing


    One of the classic uses for a circular plane is truing the perimeter of a round
    work-piece, such as a table (top photo). The beauty of using one of these planes
    is when the circle is true, you''ll know it: The plane''s cutting action will
    slow significantly. To use a circular plane for this, by adjusting the sole to
    closely approximate the curve of the work-piece. Adjust the plane blade for a
    fine cut and start planning. As with any plane, you''ll need to be careful to
    plane with the grain, and not against it. This takes a bit more thoughts, since
    the grain direction will change periodically around the top''s circumference.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_92_0.png)


    # Concave planing


    A circular plane also makes quick work of truing up an inside curve (middle photo).
    Though you can start as you did with a convex cut by adjusting the plane''s sole
    to match the inside curve, I''ve found that if you adjust it so that it''s a hair
    tighter than the inside curve, you''ll have better luck. A tighter cut on the
    sole allows the plane to fit tighter to the curve and makes it easier to lop off
    the high spots. Once the spots are gone, you can adjust the plane''s sole to better
    match the inside curve. As with a convex cut, it''s important to take extra care
    to plan against the grain (bottom drawing). This is one plane that will gladly
    bury its blade in end grain and tear out a big chunk of wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_92_1.png)'
