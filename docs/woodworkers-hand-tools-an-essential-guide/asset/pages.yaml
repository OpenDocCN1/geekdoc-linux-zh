  md: '# Cutting a rabbet


    You''ll occasionally hear as a shoulder plane referred to as rabbet plane. That''s
    because it can be used very effectively for this task (top photo). The disadvantage
    of using a shoulder plane versus a rabbet plane is that the shoulder plane doesn''t
    have a built-in guide fence or depth gauge. But one will work in a pinch as long
    as you clamp a scrap block to the workpiece to guide the cut, and check the depth
    with a rule. Also, since a shoulder plane doesn''t have cutting spurs, it''s a
    good idea to scribe a starting line when planing cross grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_0.png)


    # Cleaning out a dado


    Another job I often assign to a shoulder plane is cleaning out grooves or dadoos.
    Naturally it''s best to use a shoulder plane that matches the width of the groove
    or dado, but you can usually get just fine with a narrower one as long as you
    get the bottom for flatness. Keep the side of the plane pressed firmly against
    the shoulders of the groove or dado as you plane (middle photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_1.png)


    # BULL-NOSE PLANES


    A bull-nose plane is a special type of shoulder plane that has a very short nose
    (photo at right). Instead of a longer front section, the nose is often only 1/4"
    wide. This makes the plane perfect for delicate work and for reaching in close
    corners. The disadvantage of using a bull-nose plane: the plane to travel up and
    down over undulations instead of flattening them. If you find this happening,
    it''s best to switch to a longer, standard shoulder plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_89_2.png)'
