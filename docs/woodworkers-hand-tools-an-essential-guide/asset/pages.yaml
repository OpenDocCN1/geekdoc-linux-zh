  md: '# HANDLE VARIATIONS


    I bought my first set of quality chisels from a mail-order catalog. I picked a
    set with blades made from Sheffield steel and what looked like comfortable handles.
    The second I unpacked one and held it in my hand. I knew that it didn''t feel
    right. But being a novice, I figured the manufacturer knew they were doing and
    it must be me. So I kept them—and used them for many (uncomfortable) years. What
    a bonehead!


    It wasn''t until I was visiting a woodworking buddy that I saw the light. My friend
    was cutting a set of dovetels in wide planks for a blanket chest he was building
    for his daughter. I commented on his well-worn chisels, and he handed one to me.
    I couldn''t believe how good it felt in my hand. The balance was near perfect;
    the handle fit so well in palm that it felt like an extension of my hand. So this
    is what a chisel should feel like, I thought.


    I decided then and to always trust my first impression of a tool. I should have
    sent that first set back and ordered else. Better I should have visited a woodworking
    store and tried each brand until I found the best fit. I realize this might sound
    excessive, but chisels are some of the most-oftenused hand tools in my shop. They
    really should mold to your hand and the material used matters of personal preference.


    I have four sets of chisels in my shop: a set of large, stout mortise chisels;
    a set of metal-handled (virtually unbreakable) firmer chisels for heavy work;
    a set of Marples "blue chip" bevel-edged chisels for rough paring and shaping;
    and an exquisite set of bevel-edged Japanese chisels for all my fine work (fitting
    joints, dovetails, etc.). I also have a few specialty chisels, but the bulk of
    the work is done with these four sets.


