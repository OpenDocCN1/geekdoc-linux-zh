  md: '# HAND SCRAPERS


    The first time I saw a scraper in action, I was sure some form of magic was involved.
    A cabinet-maker friend of mine was using one to smooth a panel made of several
    pieces of tiger-stripe maple. Now this stuff has deservedly nasty reputation for
    tearing apart; but my friend was pulling off delightfully thavings with a hand
    scraper. It just didn''t seem possible to do with this plain piece of metal about
    the size of a standard index card (top photo).


    The scraper wasn''t actually plain—its edges had been carefully sharpened and
    then burned to form a tiny hook or burr on the end. This burr (middle drawing)
    is what makes a scraper work. In effect, it serves as a tiny blade. One of the
    reasons it works so well on hard-to-plane woods is that the burr is so small.
    The tight radius of the curve acts as a chip breaker to almost instantly break
    a shaving so that the chance of tear-out is greatly reduced. The hand scraper
    is traditionally sharpened at 90 degrees, but some woodworkers prefer the more
    aggressive 45-degree angle that common cabinet scrapers and scraper planes.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_0.png)


    | FLAT SCRAPER | 45° SCRAPER |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_97_1.png)


    # GOOSENECK SCRAPERS


    Gooseneck or curved scrapers are a special type of hand scraper designed to let
    you smooth curved surfaces (photo at left). The curves vary along the perimeter
    so you can position the scraper to match the curve of your work-piece. These work
    reasonably well but can be difficult to sharpen and burn. As a general rule, I
    recommend that you find the curve you want, mark a couple of pencil lines on the
    scraper, and concentrate on sharpening and burnishing this area. If you were to
    create a burr along the entire perimeter, it would dig into your fingers during
    use.'
