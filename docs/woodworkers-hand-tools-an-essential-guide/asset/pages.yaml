  md: '# JACK AND nJOINTER PLANES


    Traditionally, a craftsman''s jack plane and jointer plane were his bread and
    butter. With these two planes, he could take a rough-sawn board and turn it into
    a straight board, smoothly surfaced on all four sides. The edges would be perpendicular
    to the faces, so boards could easily be joined together to make larger panels.
    Although the electric planer and have taken over these tasks in the modern shop,
    jack and jointer planes are still incredibly useful in the shop for surfacing
    a panel, joining edges, and all-around smoothing. If you''ve never planned a rough-sawn
    board so that its perfectly square, give it a try; you''ll have a lot more respect
    for the cabinetmakers of the past.


    Jack and jointer planes are very similar in appearance (top photo). The big difference
    is


    in the length of the sole and the width of the blade. Generally, the cutoff between
    a jack and a jointer plane begins around 22", and a mid-sized plane, often referred
    to as a fore, resides in the no-man-land between the two (see the chart below).
    Another common rule of thumb is: The longer the sole, the wider the blade—but
    there are some exceptions to this.

    Whether your plane is a jack, fore, or jointer.


