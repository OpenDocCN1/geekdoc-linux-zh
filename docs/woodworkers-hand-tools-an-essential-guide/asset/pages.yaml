  md: '# CHISEL

    PLANES


    A chisel plane is easily identified by the absence of a fore sole (top photo).
    The advantage to this is that it lets you reach all the way into a corner—when
    cleaning up a rabbet, for example (middle drawing). A chisel plane is also useful
    for removing glue squeeze-out and for trimming plugs pegs flush with a surface.
    The disadvantage of having a fore sole is that the blade has a tendency to not
    vibrate or chatter (bottom drawing). This makes the chisel plane generally unfit
    for regular planing tasks.


    A chisel plane in the workshop is like a 1-iron in your golf bag: You won''t use
    it most days, but when the conditions are right, it''s the perfect tool for the
    job. Yes, you could do most of the tasks listed above with other tools; but if
    your budget permits, you''ll be glad you picked one of these fine tools.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_90_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_90_1.png)'
