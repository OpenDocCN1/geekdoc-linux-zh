  md: '# Depth of cut


    If you removed the frog, you''ll need to tune it. Start by loosening the frog
    screws so they''re friction-tight (top photo). Then, use the frog-adjustment screw
    to slide the frog to align with the sole at the throat opening. You may need to
    remove the handle to get to this screw. NOTE: If there''s a lot of play in the
    depth-adjustment knob, you may be able to remove the slope. If the yoke that accepts
    the knob is steel or brass, you can squeeze it tighter with a C-clamp. If the
    yoke is cast, leave it alone—any pressure at all will likely snap it.


    # Lateral adjustment


    There''s not much to do on the lateraladjustment lever: check for burrs on the
    cam, and smooth out any you find with a fine file or a piece of emery cloth. Then
    flip the plane over and sight down the sole. Pivot the lateral-adjustment lever
    back and forth until the edge of the plane blade is parallel with the sole (middle
    drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_0.png)


    # CUSTOM HANDLES


    To make a new handle, use the old handle as a template (left photo). It''s best
    to drill the hole for the handle screw before shaping the handle. Cut out the
    shape, and smooth and sand the handle to fit your hand. Even if there''s nothing
    wrong with your handle (or the front knob), I always suggest shaping them to fit
    your hand. The factory-made handle is designed to fit the “average” hand, not
    yours. A custom-fit handle feels much better.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_67_3.png)'
