  md: '# RABBET PLANES


    The rabbet plane (often called a filister plane) is used to cut rabbets on the
    edge of a work-piece, either with or against the grain (top photo). Since it is
    designed specifically for this task, it does an admirable job. The cutter extends
    the full width of the sole to cut cleanly into corners. A couple of add-on accessories
    make cutting highly accurate, and repeatable rabbets a breeze. First, there''s
    a guide fence that adjusts in and out either one or two arm rods that thread into
    the sole of the plane. Moving the guide in or out sets the width of the rabbet
    (bottom drawing). An adjustable depth gauge on the opposite side lets you set
    the depth of the rabbet. A three-pointed spur scribes a line in advance of the
    cutter to help clean cut across the grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_85_0.png)


    # Two blade positions


    I''ll never forget when I bought my first used rabbet plane at an auction: a rather
    nice Stanley No. 78. Since I didn''t know much about rabbet planes at the time,
    I thought it was missing a cutter, as the plane obviously has positions to mount
    two blades. So I embarrassed myself by asking the auctioneer if he knew where
    I could pick up a spare blade. He was kind enough to explain that a rabbet plane
    with only one blade was used in the center position for general rabbet work, and
    then moved forward to rabbet into a corner (similar to a bull-nose plane; see
    pages 87 and 88). To adjust the depth of cut on a rabbet plane, loosen the knob
    on the lever cap and pivot the depth-adjustment lever up and down. When the desired
    depth is reached, simply tighten the knob.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_85_1.png)'
