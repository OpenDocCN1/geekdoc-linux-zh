  md: '# Inside measurements


    Most quality tape measures will have the exact dimensions of the case printed
    on the side of the case. This makes it easy to take any measurement. Just butt
    the case of the tape measure firmly against the side of the work-piece and extend
    the tape to the other side (top photo). With this in mind, you''re better off
    choosing a tape whose outside dimensions are easy to work with--it''s a lot simpler
    to add 3" to 9/16" and 21/2" Try to find a measure with an inch dimension.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_0.png)


    # Outside measurements


    An outside measurement is simplicity itself: Just catch the edge of the hook on
    one edge of the work-piece, and pull to extend the tape (middle photo). You''re
    always better offivoting the tape so that it lies flat on the edge to be flush
    with the surface and prevents errors from parallax.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_1.png)


    # ACCURACY TIPS


    The methods described above work fine for general-purpose inside and outside measurements.
    But when you''re looking for added precision, try these two tricks:


    +   1. For inside measurements, butt a reference block against an edge of the
    work-piece (I have a scrap of MDF cut precisely to 4" set aside just for instances
    like this). Then extend the tape to the opposite end and read where it passes
    over the reference block--add the length of the block to get a super-accurate
    reading (top photo at right).

    2. For outside measurements, try extending the hook end of the tape 1" past the
    edge of the work-piece (bottom photo at right). Take the reading and subtract
    an inch. This method eliminates any error caused by a bent or malfunctioning hook.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_18_2.png)'
