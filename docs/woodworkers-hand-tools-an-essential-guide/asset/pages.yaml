  md: '# TAPE MEASURES


    I''m sure that when Alvin J. Fellows patented the steel tape measure in 1868,
    he didn''t expect his invention would turn out to be one of the most useful tools
    to the woodworker. Although his tape measure didn''t have a locking mechanism
    for the tape (this was patented by Stanley in 1968), he was the first to print
    graduations on a steel tape. Today''s tape measures feature spring-loaded tapes
    that are slightly concave to help hold them rigidid over long distances. They''re
    commonly available in 8-, 12-, 16-, and 25-foot lengths. I''ve always found the
    combination of a smaller 12-foot and a larger 25-foot tape measure to be all I
    need in the shop (top photo).


    # Checking a tape


    When you''re buying a tape measure, skip the bargain; it pays buy quality. Go
    with a name brand you can trust, like Starrett, Stanley or Lofkin. And, take the
    time to check it for accuracy at the store. To do this, simply extend the tape
    out several feet and bend it back on itself. Align the inch marks and check whether
    the graduations are even (middle photo). On cheaper tapes, you''ll often find
    that the graduations don''t match.


    # The hook


    Another thing to check for buying a tape measure is a quality hook that''s securely
    riveted to the end of the tape, while still allowing to move freely for inside
    and outside measurements. The reason the hook needs to slide for inside measurements:
    It''s designed to slide in the exact thickness of the hook to provide an accurate
    measurement (bottom drawing).


    | Outside Measurement | Inside Measurement |

    | :--- | :--- |

    | ![Outside Measurement] | ![Inside Measurement] |

    | Hook Slips over Lip | Hook Pushes in Flush with Edge |


    ![](img/82f8fd51f2b064bbc4df21354d664e50_17_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_17_1.png)'
  merge: -1
