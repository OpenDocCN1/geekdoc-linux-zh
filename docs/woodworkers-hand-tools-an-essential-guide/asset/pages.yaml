  md: '# JAPANESE

    HAMMERS


    The first time I picked up a Japanese hammer, I knew I had to have one. Its compact
    head and sturdy handle gave it balance I''d never found in a Western hammer (top
    photo). The types of Japanese hammers you''ll likely find useful in your shop
    are the chisel hammers and the plane-adjusting hammers.


    # Chisel hammers


    Chisel hammers may have one of two head styles: barrel or flat (middle drawing).
    The flat type are more common and are usually made of high-quality tool steel
    and tempered to produce a tough, durable head. Since both faces are near identical,
    Some woodworkers prefer the barrel-head chisel hammer; they feel that this more-compact
    design centers the weight closer to the handle, so they have greater control.
    These stubby heads are usually tempered so they''re soft on the inside and hard
    on the inside. The theory is that this type of tempering reduces "bounce."


    ![](img/82f8fd51f2b064bbc4df21354d664e50_148_0.png)


    # Plane-adjusting hammers


    Plane-adjusting hammers can be identified by their thin, slender heads and highly
    polished finish (bottom photo). Because of the degree of finish, these hammers
    are intended for use only on planes to adjust the cutters. Granted, you could
    use a different hammer for this task, but the face will probably be dinged or
    dented these marks will transfer to the wood body of the plane—not a good way
    to treat a valuable tool.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_148_1.png)'
  merge: -1
