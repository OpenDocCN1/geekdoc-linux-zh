  md: 'Even experienced woodworkers tend to hold a hammer with a weak grip. The most
    common mistake is to choke up on the handle as if it were a baseball bat (top
    photo). And just as with a baseball bat, this will rob the hammer of any power,
    greatly reducing its ability to drive a nail. Some might say that this affords
    better control; without power, the hammer is useless. It''s better to learn to
    control the hammer with the proper grip.


    # Handshake grip


    To get the maximum mechanical advantage from a hammer, you need to grip the handle
    near the end (middle photo). Place the end of the handle in the meaty part of
    your palm, and wrap your fingers around the handle. Stay away from a white-knuckle
    grip, as this will only tire your hand. For less power and a bit more control,
    position the handle just below the palm, and grip. This takes the hammer out of
    alignment with your arm and shoulder, but you may find it more comfortable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_0.png)


    # PULLING NAILS


    Even with the correct grip and stance, you''ll occasionally hammer in a nail crooked
    or in the wrong place. Pulling out nails in a woodworking project is a bit different
    than in carpentry. With you generally don''t care about dents in the surface of
    a 2x4. On a finished or near-finished woodworking project, this could be disastrous.


    Here are two quick ways to avoid dents caused by the hammer. One way is to slip
    a scrap of wood under the head of the hammer to keep it from crushing the surface
    as is to pivot out the nail (top photo at left). A similar method that works particularly
    well for stubborn nails is a slotted wedge. The wedge creates better leverage
    while at the same time protecting the surface (bottom photo at left).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_143_2.png)'
