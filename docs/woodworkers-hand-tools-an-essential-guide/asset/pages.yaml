  md: '# JAPANESE PLANES


    I''ll admit that I was quite excited to get out my first Japanese plane (top photo).
    Since I had quickly grown so fond of Japanese saws, I thought the planes were
    sure to find a treasured spot in my tool chest. Although these planes can be very
    easily tuned properly they do require a substantial amount of fiddling to get
    them to work properly. As any wood-bodied plane, they also require constant attention
    to make sure they''re cutting true. The wood can twist or warp and will need to
    be periodically trued.


    Don''t get me wrong, I have a few wood-bodied planes in my shop; I just don''t
    use all the time. I''m in a hurry, I''ll stick with a metal-bodied plane that
    I know will be relatively square and able to get right off the shelf. If you don''t
    mind tinkering a bit, you may enjoy a Japanese plane. They do take getting used—unlike
    their Western cousins, Japanese planes are cut on the pull stocks.


    The body (or dia) of the plane serves as its handles. You wrap your hands, or
    hand,


    carefully around the body and pull to create a nice, shaving. The simplicity of
    a Japanese plane (bottom drawing) is also one of its primary drawbacks. The laminated
    blade fits into tapered grooves in the dia, and the chip breaker is held in place
    by a metal pin. The absence of a frog means you''ll have to devote time whenever
    you use it to properly adjust the blade to the desired depth of cut.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_93_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_93_1.png)'
