  md: '# PARING CHISELS


    A paring chisel is similar in appearance to a firmer chisel except the blade is
    much longer (top photo). The blade on a firmer chisel is usually around 4" to
    4/2" long, while the average paring chisel blade is 7" to 8" long (bottom drawing).
    This type of chisel was a standard item in a cabinetmaker''s tool chest, but it
    was largely replaced by the electric router.


    The long blade of a paring chisel is perfect for trimming the bottoms of grooves
    and dados to cut shelves and other carcass parts. Once the router entered the
    scene, with its ability to cut perfectly flatbottomed grooves, the paring chisel
    began to disappear.


    Because the blade of a paring chisel is so long, it''s fairly fragile, and a mallet
    should never be used. Hand pressure is all that is suitable for paring chisels.
    If you plan to use a paring chisel to flatten the bottom of a groove, considering
    making a gauge block to accurately hold the blade at the desired height (middle
    drawing). Occasionally, you can find a paring chisel with a "crank" where the
    handle is offset from the blade (bottom chisel in bottom drawing). This lets you
    pare with the blade flat against the workpiece.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_122_0.png)


