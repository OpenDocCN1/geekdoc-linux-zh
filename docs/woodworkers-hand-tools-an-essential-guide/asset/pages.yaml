  md: '# USING A

    JACK PLANE


    Once your jack plane or jointer plane is

    well tuned, there''s one more thing to do before

    y use it: You need to adjust it to match the

    type of cut you''re making. I''m not talking about

    deep of cut here, but the position of both the

    cap iron and the frog.


    # Rough cuts


    For rough cuts, as preliminary surfac-

    ing a board, you''ll want to adjust the cap iron

    to allow for a fairly heavy shaving (top drawing).

    Loosen the cap iron screw and shift the cap iron

    so it''s about/1/8" away from the cutting edge.

    Then loosen the frog screws and turn the frog-

    adjusting screw to increase the throat opening.

    This lets you take thicker, coarser shavings with-

    out jamming.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_0.png)


    Move Frog Backwards or Throat Plate Forward

    to Increase Opening


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_1.png)


    # Smooth cuts


    For smooth or finish cuts, it''s well worth

    t effort to adjust the plane. Many wood-

    workers fail to realize the importance of the cap

    iron and frog position for these crucial cuts.

    The goal is to move the cap iron closer to the

    cutting edge of the blade so that it will quickly

    break chips and prevent tear-out (middle drawing).

    At the same time, adjust the frog to close the

    opening. This still allows for finer shavings

    pass through while affording

    better support to the wood fibers

    being severed.


    Move Frog Forward or Throat Plate Backwards

    to Decrease Opening


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_2.png)


    # Pencil tip


    Now you''re ready to plane.

    But before you do, consider this

    simple tip to help you clearly see

    where you have and haven''t

    planed. Rub the lead of a pencil

    lightly over the edge or face of

    y work-piece (bottom photos). As

    y plane, you''ll be able to readily

    check your progress.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_68_3.png)'
