  md: '# C-CLAMPS


    C clamps are one of the most universally used clamps in the shop (top photo).
    They''re extremely versatile and are available in many sizes, with jaw capacities
    ranging from 3/4" all the way up to a heavyduty 12".


    The C shaped frame of the clamp has a fixed pad on one end and accepts a threaded
    screw on the other. One end of the screw accepts a swiveling shoe, while the other
    is pierced by a metal rod called a tommy bar (bottom drawing). Twisting the screw
    raises or lowers the jaws of the clamps. The frames can be made of stamped metal,
    cast iron, steel, or aluminum. Tommy bars are fixed or may slide. On Gclamps,
    the tommy bar is replaced with a wingtype screw.


    One of the advantages allowing the shoe to swivel is it can conform to angled
    pieces (middle photo). This same advantage can be troublesome when you''re trying
    to fit a G-clamp on a narrow surface. In this case, you''re usually better off
    flipping the G-clamp so the fixed jaw rests on the narrow piece. Consider what
    happens, for example, when you''re trying to clamp a workpiece to a drill press
    table. Quite often the thin castings under the table are exactly where you need
    to apply the clamp (Murphy''s Law in action) Just flip the clamp vertically so
    the fixed jaw rests on the casting, and it''ll work fine. NOTE: G-clamps are intended
    for light to moderate pressure only; excessive pressure can crack the casting.
    If you need to exert greater force, with a hand screw (see page 160) or a small
    bar clamp (see page 166).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_159_3.png)


    158 CLAMPING TOOLS'
