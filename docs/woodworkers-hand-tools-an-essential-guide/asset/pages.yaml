  md: 'Continue removing waste from the bottom, working your way toward the opposite
    end of the mortise. Take light cuts and pry out the waste (top drawing). ShopTip:
    For a simple depth gauge, wrap a piece of tape around the blade of the chisel.


    # Finish cuts


    Once the full width of the mortise is complete, you can make your finish cuts
    to the ends. By now you''ve probably figured why it''s important to level/8" or
    so on the ends of the mortises while you chop out the majority of the waste. Even
    when you''re careful prying out the waste, there''s a tendency to use the top
    edge of the mortise as a fulcrum for the blade. The result is that this edge gets
    crushed. If the mortises are stopped, the tenon will cover this, but the joint
    won''t be as sturdy as it could be. But if the mortise is a through mortise, this
    will be highly visible. Leaving a bit of waste to be trimmed away as a final step
    yields clean, crisp edges (middle drawing).


