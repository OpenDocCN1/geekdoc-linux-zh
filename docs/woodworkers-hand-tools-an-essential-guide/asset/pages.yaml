  md: '# HONING

    GUIDES


    A honing guide is designed to rigidly hold a tool at a- constant angle for honing.
    Although I have met a few accomplished cabinetmakers who hone with- out guide,
    most woodworkers will benefit from the added re- reinforcement one offers. There
    are numerous honing guides avail- able through mail-order catalogs and at your
    local hardware store or home center.


    There are two basic types of guides: the type that grips the tool and rolls on
    the stone (*top photo*) and the larger type where the guide roller rests on the
    adjacent surface (*middle photo*).


    I''m quite partial to the smaller type of honing guide that rolls on the stone
    with the tool. The one I''ve used for years is an Eclipse No. 35 honing guide,
    which clamps the blade or chisel between two jaws. The beauty of this guide is
    that it auto- matically centers the tool. Since it runs on the stone, there''s
    no chance of error caused by an uneven surface—as is possible with the other type.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_0.png)


    # Adjust Chisel Until Both Heel and Toe Touch Stone


    There are a number of ways to set a honing guide. If the blade or chisel has been
    ground to the desired bevel, you can use this position to the guide. Slide the
    tool up or down in the guide until both the toe and heel of the bevel flat on
    the stone (*bottom drawing*), and begin honing. Alterna- tively, angle-setting
    guides are available for the Eclipse jig that will accurately position the tool
    at the desired angle (www.leevalley.com).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_180_3.png)'
