  md: "# SANDPAPER\n\nNo chapter about smoothing tools would be complete without discussing\
    \ sandpaper. Like many woodworkers, loathe sanding. It's messy work that I try\
    \ to keep to a minimum. Whenever possible, I reduce hand- or power-sanding with\
    \ the appropriate use of planes and scrapers. But unless a project consists mainly\
    \ of flat, square surfaces (like many Craftsman-style designs), I end up using\
    \ sandpaper for final smoothing.\n\n# Types of sandpaper\n\nThere are three main\
    \ types of sandpaper that are commonly used in a woodshop: silicon-carbide, garnet,\
    \ and aluminum-oxide (to bottom in the top photo). For years, all that was available\
    \ was garnet sandpaper, made from finely crushed semiprecious stones. This type\
    \ of paper tends to dull and wear out quickly but has the best reputation for\
    \ smoothing without leaving scratches. Silicon-carbide paper (often called wet/dry\
    \ sandpaper) is used primarily for sanding between coats of finish, since it can\
    \ be used wet. Aluminum-oxide is a relatively new abrasive that stands up and\
    \ lasts much longer than garnet.\n\nRegardless of the type of abrasive, all sandpaper\
    \ is categorized by grits that define the particle (see the chart below).\n\n\
