  md: '# SHARPENING

    SCRAPERS


    The magic behind a scraper is the burr. This burr is a tiny metal edge that''s
    rolled or ''burnished'' with a special tool called a burnisher. As a general rule
    of thumb, the burr is rolled at an angle between 80 and 85 degrees on a flat-edged
    scraper (top drawing). Bevel-edged scrapers, as those used in cabinet planes,
    are rolled at 35 to 40 degrees. Over the years, I''ve seen a lot of woodworkers
    struggle with sharpening a scraper. If you follow the simple method shown here,
    the same that I''ve used to teach numerous classes, I''m confident you''ll be
    creating whisper-thin shavings in no time.


    # Filing the scraper flat


    The first step in sharpening a scraper is to file the edges perfectly flat. Just
    clamp the scraper in your bench vise (with wood liners, course) and take a few
    strokes across the top edge with a smooth fill (middle photo).


    # Honing the edge


    After the edges of the scraper are flat, the next thing to do is hone them smooth.
    NOTE: I have successfully skipped this step on occasion; but if you want a uniform
    burr, especially if you''re looking for super-fine shavings, it''s well worth
    the effort to hone the edge. While holding a scraper on edge vertically so it
    is perfectly perpendicular is virtually impossible, I use a trick learned from
    mastermaker Brian Bog. Brian sandwiches the scraper between two wood blocks to
    hold the scraper in perfect position and then rubs this "sandwich" on the stone
    (bottom photo). Note that it''s important to skew the sandwich as shown in the
    bottom photo to prevent the thin edge of the scraper from scoring a groove in
    your stone.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_187_3.png)'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Burnishing at 90 degrees


    Once you''ve honed the edges of the scraper smooth, it''s time to get out the
    burnisher (see the *sidebar below*). I begin burnishing with the burnisher held
    perpendicular to the face of the scraper. I take several strokes with moderate
    downward pressure on the entire edge of the scraper (top photo). This will compress
    the metal and actually create a small bur, which you should be able to feel by
    running your thumb up from under the edge. In some cases, this may be all the
    bur you need. If you''re planning on removing a lot of material, you''ll want
    a larger bur and you''ll need to burnish the edge at an angle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_0.png)


    # Burnishing at an angle


    Hold the burnisher at 80 to 85 degrees for a flat-edged scraper (*middle photo*)
    and around 40 degrees for an angle-edged scraper (inset). Apply light pressure
    and take a few strokes. Check the bur and repeat if it''s not enough. You might
    be surprised how little pressure is needed to create a bur. I''ve seen guys pressing
    down so hard they were flexing the scraper. This shouldn''t be necessary. If it
    is, it''s likely that your burnisher isn''t hard enough to roll the bur (see below).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_1.png)


    # BURNISHERS


    A burnisher must have two features to work properly: The steel must be harder
    than the scraper (Rc 60 at a minimum), and it must be super-smooth to prevent
    damage to the delicate bur. You can get a burnisher for a couple bucks from woodworking
    catalogs (*photo at near right*). In a pinch, I''ve used the shank of a large
    drill bit—just be sure to protect your hands with gloves (*photo at far right*).
    Also, take the time to smooth the surface of the burnisher with a fine sharpening
    stone or by buffing it with a felt wheel and some jeweler''s rouge.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_188_3.png)


    SHARPENING TOOLS 187'
