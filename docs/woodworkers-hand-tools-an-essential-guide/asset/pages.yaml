- img_proc: true
  md: '# Trimming tenons


    My general rule of thumb for cutting mortise-and-tenon joints is to cut the mortise
    first and then cut the tenue to fit. If you''re chopping the mortises by hand
    (see pages 118-120), you''ll likely find some variations from mortise to tenue.
    This means you''ll have to trim or fine-tune each tenue: a perfect job for the
    shoulder plane (top photos). Whenever possible, select a plane that''s wider than
    the area you''re intending to trim. Make sure to set the plane for a very fine
    cut and use a razor-sharp blade. As, take light cuts


    ![](img/82f8fd51f2b064bbc4df21354d664e50_88_0.png)


    and make sure to back up the shoulder with a scrap to prevent tear-out.


    # Smoothing rabbits


    Smoothing rabbits is another easy task for a shoulder plane. Position the plane
    so it fits firmly against the shoulder of the rabbit (middle photo). Use long
    as a shoulder plane as possible, as this helps flatten out any high spots that
    a shorter-bodied plane might rise up and over. Just as with a tenue, it''s important
    to back the trailing edge of the rabbit with a scrap to prevent tear-out.


    # COMBINATION SHOULDER PLANES


    There''s a nifty type of shoulder plane available that''s commonly called a combination
    plane (photo Tight). It''s basically two planes in one: a shoulder plane and either
    a bull-nose plane (see page 88) or a chisel plane (see page 89). The version from
    one to the other is made possible by lifting off a top piece (as shown here) by
    removing a front section of the plane. Sometimes this type of plane is called
    a 3-in-1 plane because it can function as a shoulder plane, bull-nose plane, or
    chisel plane.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_88_1.png)'
