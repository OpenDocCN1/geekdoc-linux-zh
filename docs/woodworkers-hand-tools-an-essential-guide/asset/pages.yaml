    BLACKIE & SONS (1853)


    # # MEASURING and MARKING TOOLS


    ![](img/82f8fd51f2b064bbc4df21354d664e50_8_0.png)


    In woodworking, doing a project "by the numbers" isn''t a mark of mediocrity,
    or same old same; it''s absolutely vital. The "numbers" involved, of course, are
    the dimensions of the wood being worked. When you don''t measure and lay out with
    precision—as Mr. Blackie notes—you can end up with a piece that lacks not beauty
    but also durability.


    Your shop tools might be the finest and sharpest available. But if you can''t
    both measure and mark accurately those tools are virtually worthless.


    Look at the rosewood, ivory and brass in the photo at left—this wasn''t mere indulgence.
    Woodworkers of y knew that these quality materials were worth the relative high
    cost at the time (just one of these beauties could cost a couple of months'' worth
    of wages). Your predecessors in the craft understood the importance of buying
    quality to create quality And like cabinetmakers Blackie & Sons, they knew well
    the importance of precision. There are lots of steps involved in crafting a fine
    piece with confidence—and every one relies on going “the numbers."


    Clockwise from top left: an “American Combined Level and Grade Finder, pointed
    in 1904; a handmade 24” panel gauge; a folding rule No. 15, made by C. S. Co.;
    calipers (with steel legs); Stanley No. 5 trannel; a 7/2” combined tri and meter
    square, made by Stanley Tools; a Stanley No. 7 scratch owl; Henry Dixon and Stanley’s
    mortise rouge; and a Stanley No. 40 ivory and silver ruler caliper.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_8_1.png)'
