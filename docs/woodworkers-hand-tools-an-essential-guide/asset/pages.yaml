  md: '# # LAPPING PLATES AND DIAMOND STONES


    # ## Lapping plates


    A lapping plate is any reference surface that can be used to create a flat surface
    on a tool. I use lapping plates regularly to flatten the soles of planes (top
    photo) and to flatten stones. The plate I use is a piece of V4-thick glass that
    is a replacement louver for a Jalousie window. These louvers have edges conveniently
    rounded-over. Since there is still a bit of flex in one of these, it''s important
    to place it on a known-flat surface. The abrasive action is supplied by sheets
    of silicon-carbon paper mounted to the glass with spray adhesive.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_0.png)


    # ## Diamond stones


    Although they''re expensive, diamond stones and stones are well worth the money
    (middle photo). Diamond stones are made by bonding uniform-sized diamond particles
    to a metal plate and attaching this to a polycarbonate base. Since diamonds are
    the hardest material known, they wear very slowly and the stone stay "sharp" for
    a very long time. Diamond stones and stones are available in many shapes and sizes
    in four grits: coarse (220 mesh), coarse (325 mesh), fine (600 mesh), and extra-fine
    (1200 mesh). I use stones made by DMT (www.dmtsharpen.com) and have yet to wear
    one out.


    # ## Basic use


    You can use a diamond stone just like you would use a waterstone (water is the
    recommended lubricant), but you''ll notice a few differences (bottom photo). First,
    unlike waterstones, diamond stones won''t dish out: They stay flat. And second,
    they''ll actually cut in most situations because the diamonds stay sharp so long—you''ll
    end up fewer strokes (what a pity, eh?)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_182_1.png)'
