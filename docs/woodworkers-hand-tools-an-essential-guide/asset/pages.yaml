  md: 'it will have similar parts. Old planes had wood bodies or soles, and modern
    planes have metal bodies. For a short while, "transitional" planes were made that
    supposedly offered the best of both worlds. (For more on this, see page 72).


    One of the best ways to get familiar with a jack plane or jointer plane is to
    take one apart. Start by loosening the cap lock to release its pressure (bottom
    drawing). Then slide the lever cap up and off the screw. Now you can lift out
    the


    blade and cap-iron assembly. These two pieces are held together by a screw that
    leans over or a wide-blade screw-driver. Twist the cap iron, slide it over until
    it slips over the screw, and lift it off. The cap iron (also called a chip-breaker)
    helps serve chips as they are lifted up by the blade; it also serves as a stiffener
    to prevent chatter.


    The cap iron and blade fit into the frog—a separating casting that''s screwed
    to the body of the plane. There''s an adjustment screw in the rear of the frog
    that allows you to open or close the throat opening. The frog also houses the
    lateral-adjustment lever that aligns the blade parallel to the sole, and the depth-adjustment
    knob that lowers the blade. A wood handle on the back and a knob on the front
    complete the plane.


    The blades may be sharpened in one of three common ways: straight, convex, or
    with softened corners (top drawing). Convex is useful for rough work, and softening
    the corners prevents them from digging in.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_64_0.png)


