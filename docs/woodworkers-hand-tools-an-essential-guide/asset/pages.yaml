  md: '# Basic use


    In most cases, I install a blade so it cuts on the pull stroke. This does two
    things: It provides better control, and it keeps the blade in tension better than
    what pushing (top photo and inset). Since these blades are so thin and fragile,
    they have a tendency to overheat. There are a couple of ways to prevent this.
    First, use the full length of the blade as you cut. Second, stop periodically
    and allow the blade to cool.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_0.png)


    # Delicate cuts


    For delicate cuts, such as cutting veneer or other thin materials for inlay or
    marquetry, the fret saw is the tool to use (middle photo). The extremely fine
    teeth let you negotiate curves without angling the blade. The secret to successful
    cutting is to fully support the thin material (see sidebar below). Also, it''s
    important to install the blade to cut down and on the pull stroke. This way cutting
    action pulls the material against the bird''s mouth (see the sidebar below) instead
    of away from it, which would cause the thin material to fracture.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_1.png)


    # BIRD''S MOUTH


    The best way to support thin material when cutting with a fret saw is to use a
    V-notched board, called a bird''s mouth, that clamps to your bench (drawing at
    right). The idea here is to position the work-piece and saw so that the cutting
    action takes place close to the point of the V for maximum support. For extremely
    accurate cuts, use the first few inches of blade nearest the handle, where the
    blade is the most rigid.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_54_2.png)


    CUTTING TOOLS 53'
