  md: '# SPOKESHAVES


    Although spokeshave is technically a type of plane, I''ve included it in this
    chapter because it''s often used for shaping. A spokeshave is really a double-handled
    plane with a very short sole (top photo). This short sole is what allows the spokeshave
    to navigate curves that an ordinary plane couldn''t handle. There are a number
    of spokesaves common being the flat-bottomed sole. This is a good, all-purpose
    shaping tool. Other specialty spokesaves include those with a curved sole from
    front to back, and with those that are either concave or convex. I found the specially
    spokesaves to be of limited use, as the blades are quite time-consuming to sharpen.


    Originally designed to shape spokes for wagon wheels, spokeshelves still find
    a home in many shops today. I use mine when I shape cabrioles (middle photo),
    add a chamfer to a curved edge, or need a round-over on a curved part. In use,
    a firm grip is essential, and the tool may either be pushed or pulled. I generally
    prefer to pull because this gives better control.


    # Adjustable blades


    When you''re shopping for a spokeshave, I recommend the one with an adjustable
    blade. This type of spokeshave has a pair of knurled knobs that slot into the
    blade to move it up and down as they''re turned (bottom drawing). This also helps
    prevent the blade from shifting out of position. Plainer versions use a screw
    to hold the blade in place and are a pain to adjust.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_125_0.png)'
