  md: '# Gouges


    A carving gouge is basically a chisel''s curved across the width of the blade
    (top photo). Of all the carving tools, you''ll find that gouges have the widest
    array of curves, sizes, and special features (such as a bent neck). In general,
    gouges may be one of two types: in-channel or outchannel. With an in-channel gouge,
    the bevel is ground on the inside of the blade; an out-channel gouge has its bevel
    ground on the outside. Out-channel gouges are by far the more popular.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_0.png)


    # Chisels


    Although some carving chisels often look similar to standard firmer chisels, there''s
    one difference: Instead of the bevel being ground on one side, the bevel on a
    carving chisel is ground on both sides so''ll meet in the center (middle photo).
    Unlike the concave (hollow) grind of most chisels, a carving chisel generally
    has a convex grind. This helps prevent the edge from digging in too deep in use.
    Carving chisels may have either a square edge or a skewed edge.


    # Specialty tools


    In addition to gouges and chisels, the carver typically has a number of other
    specialty tools in his arsenal (bottom photo). Parting tools are the stands. The
    most commonly used parting tool is the V-shaped version used for cutting grooves
    in wood and making squarecorner cuts. The V-shaped parting tool is widely used
    for incising letters in signs. Veiners can have square or rounded edges and are
    used mainly to add decorative grooves or ''veins'' in carvings.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_128_1.png)'
