  md: '> “The expectations of life depend on diligence: The mechanic that would perfect
    his work first sharpen his tools,”


    CONFUCIUS (55 BC - 479 BC)


    # SHARPENING TOOLS


    I would dare amend Confucius'' words this way: To perfect your work and keep yourself
    from harm, first sharpen your tools. I have a hand scar as a souvenir of forcing
    a dull tool. If it''d been sharp, the 1/4” chisel would have sliced cleanly through
    wood. But it wasn''t; instead cleanly pierced my right palm. That was the day
    I learned that there is nothing more dangerous in the shop than a dull tool. Some
    days later, the day I learned how to put a razor-sharp edge on a chisel, was the
    day I became a better woodworker.


    You know how frustrating it is to fight with a dull tool. Like many woodworkers,
    I once assumed that a brand-new tool was ready to go. But I learned otherwise:
    Most brand-new tools are not sharp. Although they''re ground to the correct angle,
    they''re not honed. Until you hone it, it''s useless. So you can avoid frustration,
    botched jobs, and personal injury by knowing more about your sharpening oils.
    Oilstone, waterstones, honing guides, grinding wheels, burnishers—they all have
    a role to play, if you know when and how to use them.


    Row 1 (top) left to right: flexible-neck oil can; sharpening stones; bench-mounted
    hand-crank grinder for sharpening smaller objects. Row 2: boxed oilstone, Norton
    “Quickcut” boxed carbonundum stone; black oilstone. Row 3: Edge-tool hone for
    sharpening chisels, plane blades, etc.; Diaton hand-saw jointer; Olis A. Smith,
    Rockdale, Connecticut, adjustable saw set.


    173'
