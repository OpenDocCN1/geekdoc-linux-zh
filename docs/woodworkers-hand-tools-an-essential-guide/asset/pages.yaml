  md: '# GRINDING

    WHEELS


    When a tool edge damages or needs to be reshaped, an electric or hand-powered
    grinder is for the job. The problem many woodworkers have with power grinding
    is twofold. First, most grinders at 3450 rpm is just too fast. Even with the right
    wheel this speed can quickly remove the temper from a tool rendering it useless.
    Recently slower-rpm grinders (1800 rpm) have become available and are well worth
    the extra money. The second problem is that wheels standard on most grinders are
    like the blades that on power saws—they''re useless. These wheels are usually
    very course and hard. They''ll burn an edge in seconds. Take them off and replace
    them with wheels intended for use in sharpening tools.


    What you''re looking for is basically the Japanese waterstone equivalent in a


    wheel: The wheel needs to be soft and fine and have a fairly open coat. Like a
    waterstone, this will cut aggressively but wear quickly. I''ve used a Norton 80-grit
    aluminum-oxide wheel successfully for years. It removes a lot of metal in a hurry
    while minimizing the risk of burning—a great all-purpose sharpening wheel (wheel
    in the top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_1.png)


    # WHEEL DRESSERS


    With use, the surface of any grinding wheel will clog up metal particles. This
    happens wheel loses its cutting ability and needs to be ''dressed'': that is,
    scraped to reveal a fresh grinding surface.


    There are a number of wheel dressers on the market just for this job. Two of the
    more common are the abrasive stick(photo at far right) and the star-wheel dresser(photo
    near right). I use an abrasive stick more often than my star-wheel


    dresser, as it leaves a smoother surface. To true up an out-of-round wheel, I
    have a diamond dresser resembles a ballpoint pen except its tipped with a 74-carat
    industrial diamond. These are available from most woodworking catalogs and cost
    less than $20.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_2.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_3.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_179_4.png)'
