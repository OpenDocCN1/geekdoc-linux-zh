    more often when I was novice than I do now. This was partly because I didn''t
    have as many tools, and also that I''ve since learned better ways to do the jobs.
    Now, for example, instead of


    trying to fit a tenon into a mortise by filing it, I use a shoulder plane or a
    chisel. And instead of shaping a curve on a leg with a file, I tend to use a spokeshave.
