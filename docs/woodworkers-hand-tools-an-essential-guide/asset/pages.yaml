  md: '# LEVELS


    While many woodworkers think of a level as a carpenter''s tool, it has a place
    in every shop. A LEVEL particularly torpedo level is handy for checking that shelves
    are LEVEL cabinets are hung plumb, and work-benches and tools are level (top photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_21_0.png)


    # Types of levels


    The most common levels are 3 or 4 feet in length, with bodies made of wood, metal,
    or plastic. Virtually every level has multiple vials, which are curved glass or
    plastic tubes filled with alcohol (hence the name “spirit” level). A bubble of
    air trapped in the vial will always float to the highest point on the curve. Marks
    on each side of the center-point indicate or plumb. While steel I-beam-style levels''
    center level (middle photo) are accurate and lightweight, I prefer the warmth
    of the older wood and brass levels of yesterear (top level in middle photo).


    # Checking a level


    Can a level go out of whack? You bet. Here''s how to check to make sure your level
    is on level. Place the level on a known-flat surface and mark its location with
    a pencil (bottom drawing). Note the bubble reading on the vials with the pencil
    mark, well, and then flip the level end for end, aligning it with the pencil marks.
    Check the bubbles by flipping the level upside down. All of If they don''t, most
    levels have adjustable vials to make this correction. Loosen the screws, adjust
    the vial positions, and repeat until all readings are the same.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_21_1.png)'
  merge: -1
