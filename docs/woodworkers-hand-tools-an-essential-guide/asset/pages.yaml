  md: '# SHOOTING BOARDS


    Even in the hands of a master, planing a perfectly square edge on the end of a
    board is a challenge. That''s because the surface of the workpiece itself is used
    as the reference, and odds are that it isn''t. That''s where a shooting board
    can come to the rescue. They''ve been used to square up work-pieces for just as
    long as there been planes. A shooting board is a shop-made jig that lets you hold
    the work so that you can accurately trim it with a plane.


    A shooting board can be made to handle 90-degree stock drawing or 45-degree miters
    (bottom drawing)—or anything in between, that for matter, since you make it yourself.


    Basically, the shooting board is a two-step base of flat stock with a groove in
    the bottom piece. The groove collects dust and chips so they don''t interfere
    with the cut.


    The top step holds one or more cleats that are secured with glue and screws at
    the desired


    angle. The work-piece is held against the cleat, and the plane is laid on its
    side and passed back and forth over the end of the work-piece to trim it.


    For all this to work, the sides of the plane must be exactly perpendicular to
    the sole. Use the shooting board, set the plane for a very fine cut and take several
    light passes.


    Shop-Tip: To help prevent the work-piece from creeping during the cut, glue pieces
    of sandpaper to the sides of the cleat—they''ll grip the workpiece better and
    hold it in place.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_82_0.png)


