- img_proc: true
  md: '# MARKING

    GAUGES


    Marking gauges are extremely useful for marking lines parallel to an edge with
    great accuracy, such as when you''re laying out joints to be cut. A marking gauge
    basically consists of four parts: a beam, a fence (stock), a thumbcrew, and a
    marking pin. The beam and fence may be made of wood or metal. Wood marking gauges
    are more common and may or not have brass strips inlaid to reduce wear (top photo).
    Some beams have scales, but these are best used only to set the fence to an approximate
    distance.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_0.png)


    # Basic use


    To use a marking gauge, loosen the thumbcrew and slide the fence desired from
    the pin. Tighten the thumbcrew and make a test mark; readjust necessary. Place
    the fence of the gauge against the edge of the work-piece and angle it so the
    pin tilts away from the direction you''ll move the square (middle photo). Although
    most woodworkers feel they have better control pushing the gauge, there''s no
    reason to pull it if this feels better to you.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_1.png)


    # Steady, even pressure


    A marking gauge will accurately scribe parallel lines as long as you use it, even
    pressure to hold the fence against the edge of the work-piece (bottom drawing).
    If you don''t, the pin can and wander. Pressing firmly will also keep the beam
    parallel to the surface, which will prevent the pin from scribing at an angle.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_26_2.png)


    MEASURING AND MARKING TOOLS 25'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# CUTTING GAUGE


    A cutting gauge is very similar to a marking gauge except instead of using a pin
    to mark the work-piece, it uses a knife (top photo). The advantage to this is
    that the knife cleanly cuts through the wood fibers instead of tearing them, as
    a pin does. This makes a cutting gauge the tool of choice whenever you need to
    mark lines across grain.


    You might then think, why not throw out my marking gauge and just use the cutting
    gauge? Because since the knife of a cutting gauge leaves such a thin, crisp line,
    it virtually disappears when you use it to scribe a line along the grain. Shop-Tip:
    To create a "universal" marking gauge, some woodworkers the point of their marking
    gauge to a finer point. This does an adequate job of marking both with and against
    the grain, but is still inferior to results from the individual gauges.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_27_0.png)


    # Basic use


    The technique for using a cutting gauge is virtually identical to that of the
    marking gauge, with one exception: Take care to use very light pressure (middle
    photo). If the knife is sharp (a few licks with a diamond hone will bring it to
    a crisp point), it''s easy to cut deeply into the wood, leaving cross-grain scratches
    that can be a hassle to remove.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_27_1.png)


    # VENEER STRIP TIP


    A cutting gauge can also be pressed into service to create uniform strips of veneer
    to use as inlay for your projects (photo at left). Set the fence to the desired
    strip width, and place the veneer on a scrap piece so it''s flush with the edge.
    Make a series of light cuts to produce strips.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_27_2.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# MORTISE GAUGES


    A mortise gauge has two pins instead of one to simultaneously mark out two parallel
    lines. It''s designed specifically to lay out the cheeks of mortises and tenons.
    One of the pins is fixed, while the other is independently adjustable (top photo).
    In some cases, the pin adjusts via a simple pull slide; on others there a thumbscrew
    or knurled knob mounted to the end of beam. Many mortise gauges feature a third
    pin on the beam opposite the two mortises. This allows the mortise gauge to also
    function as a marking gauge.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_28_0.png)


    # Setting the pins


    The first step in using a mortise gauge is to set the pins. To do this, hold the
    mortise chisel up adjust the traveling pin over to match the width of the chisel
    and lock it in place (middle photo). Then slide the fence over the pins are set
    the desired distance from the edge of the work-piece. Try the setup on a scrap
    piece first and check the layout with a ruler.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_28_1.png)


    # Basic use


    Just as with the marking gauge or the cutting gauge, the critical thing here is
    to firmly press the stock against the edge of the work-piece. All you''re looking
    for here is even pressure. Popeye-like strength will only cause problems—commonly,
    excess pressure will shift the position of the traveling pin or the beam. Use
    a light, firm grip, and tilt the gauge away from the direction of movement


    ![](img/82f8fd51f2b064bbc4df21354d664e50_28_2.png)


    (bottom photo).'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# PANEL GAUGES


    A panel gauge is basically a wood marking gauge that''s designed to handle big
    panels. The difference is the beam is much longer (typically 15" to 30") than
    a standard gauge and the fence is much wider. In the past, panel gauges were often
    made of mahogany with brass wear fittings. The exquisite one shown (top photo)
    is made by Bridge City Tools (www.bridgecitytools.com) and will mark the center
    of a 48"wide work-piece. You can also regularly find antique panel gauges on the
    Internet at various sites, running anywhere from $20 to $40 for a gauge in good
    condition.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_29_0.png)


    # Two hands


    Using a panel gauge is definitely a two-handed operation. After you''ve loosened
    the thumbscrew often use a wedge to lock the beam in position) and adjusted the
    pin or the desired distance from the edge, lock the beam in place. Then press
    the fence firmly against the edge of the work-piece with one hand while you apply
    light downward pressure to the pin or knife with your other hand (middle photo).
    Move the gauge slowly with steady even pressure.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_29_1.png)


    # Cutting disc


    Instead of a pin or knife, the Bridge City panel gauge shown here uses a cutting
    disc (bottom photo). The disc is made of hardened steel and is beveled to help
    pull the fence into the work-piece as you move the gauge along the edge of work-piece.
    This leaves razor-sharp lines with no tear-out, even when your cutting across
    the grain.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_29_2.png)'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# DOVETAIL GAUGES


    A dovetail gauge (or dovetail marker) is a single-use tool that''s designed to
    lay out the pins and tails for dovetail joints. Quality dovetail gauges will offer
    the two most common angles for dovetails: 18 slope for hardwoods and a 16 slope
    for softwoods. If you generally use these two slopes, a dovetail gauge or set
    of markers like shown in the top photo will serve you well (the gold marker is
    for hardwoods, the dark marker for softwoods). If you prefer to set your own angles,
    a bevel gauge (page 30) is a better choice.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_30_0.png)


    # Tails


    To use a dovetail marker, first use a marking or cutting gauge to set the depth
    of the tails to match the thickness of the wood. Then carefully lay out the tail
    spacing. Position the dovetail marker so it aligns with one of the marks and so
    the slope is in the correct direction. Then use a pencil or marking knife to mark
    the side of the tail (middle photo). Flip the marker and mark the opposite side.
    Continue until all the tails have been marked.


    # Pins


    Depending on how you cut your dovetails (I always cut the tails first and then
    use them to locate the pins), you may or may not want to mark the pins at the
    same time you lay out the tails. Whichever method you choose, align the marker
    with the layout maps that you made on the end of the work-piece and mark their
    location with a pencil or marking knife (bottom photo).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_30_1.png)'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# BEVEL GAUGES


    A bevel gauge (or sliding T-bevel) is an invaluable layout tool in the shop. You
    can use it to verify angles, set tools to match angles, and lay out virtually
    any angle. Most bevel gauges feature a metal slotted blade a stock or body made
    of wood, plastic, or metal, available in a variety of sizes (top photo). The blade
    conveniently slips into the slot in the body for storage. The blade is locked
    in place by tightening a thumbscrew, wing nut, lever, or knob at the base of the
    stock.


    # Duplicating an angle


    A common use of the bevel gauge is to duplicate an angle that you can reproduce
    it. To do this, loosen the thumbscrew or wing nut so it''s friction-tight, and
    press the stock of the gauge up against the edge of the work-piece (middle photo).
    Then angle the blade until it rests on the angled edge of the work-piece. Tighthen
    the wing nut, and use the gauge to duplicate this angle on another work-piece.


    # Setting with a protractor


    In many cases you''ll want to set the bevel gauge to an an exact angle, or read
    the angle you''ve just set (such as when you''re duplicating an angle). The most
    accurate way to do this is to use a protractor. The critical point here is to
    make sure that the blade of the bevel gauge intersects the base of the protractor
    exactly on center (bottom photo). Then either adjust the blade to the desired
    angle, or read the angle of the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# COMPASSES


    A compass is useful in the shop for laying out circles and arcs. The most common
    types are the bow compass (right in top photo) and the wing compass (left in top
    photo). The bow compass is a drafting tool with a threaded shaft that runs between
    the legs held together with a spring on. One leg holds a steel point, the other
    a pencil lead. The legs of a wing compass are hinged at the top joined with a
    spring and forced open or closed by turning a knurled knob that attaches to a
    threaded post that spans the legs. One leg has a steel point and the other is
    often designed to hold a standard pencil.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_32_0.png)


    # Drawing circles


    I like to set my compass with a steel rule. I set the steel point into the etched
    graduation at the 1" mark and then adjust the drawing point to the desired radius
    (plus 1"). Although the steel point of compass generally does an adequate job
    of holding its place, I''ve found that making a slight starter hole with an awl
    helps keep the point from wandering as the compass is rotated to mark the circle
    or arc (middle photo).


    # Dividing circles


    Here''s a quick way to convert a circle to a hexagon or lay out equally spaced
    holes (such as for spindles or mounting holes) with the compass set to the desired
    radius, place the steel point on the perimeter of the circle and rotate the compass
    until it scribes a mark across the perimeter (bottom photo). Then move the steel
    point to this location and write another mark. Continue like this all the way
    around the circle—you''ll end up where you started.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_32_1.png)


    MEASURING AND MARKING TOOLS 31'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# DIVIDERS

    AND CALIPERS


    A spring divider differs from a compass in that both legs hold metal points instead
    of a single point and a pencil or pencil lead (top photo). The legs of the dividers
    are opened or closed by adjusting a knurled nut on one of the legs. Although you
    can use dividers to scribe circles or arcs, they are more commonly used for layout
    to "divide" (hence the name) or step out equal distances, often referred to as
    stepping off a measurement.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_33_0.png)


    # Stepping off measurements


    Once you''ve set the dividers to the desired setting, you can easily "step off"
    equal measurements along a line by "walking" the dividers along the line. Simply
    pivot the dividers as you go by holding the post between your finger and thumb
    and moving the dividers from one point to another (middle drawing).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_33_1.png)


    # CALIPERS: INSIDE AND OUTSIDE


    At first glance, a caliper looks very similar to a set of dividers. On closer
    examination you''ll find that the difference lies in the legs. The legs bow in
    (photo below right); with outside calipers, they curve out at the ends (photo
    at left). Calipers are used primarily to take inside and outside measurements
    that can be transferred to another layout or to reproduce a part. If you practice
    holding the caliper so that your fingers adjust the knurled knob, you can set
    it with one hand, leaving the other hand free to steady the work.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_33_2.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# DIAL AND SLIDE CALIPERS


    Thought of mostly as machinists'' tools, dial and slide calipers can be quite
    useful in the woodworking shop. Although you rarely need to measure in thousands
    of an inch, these precision tools are great for measuring small parts and checking
    the thickness of work-piece. Slide calipers (bottom caliper in top photo) are
    not as easy to read dial calipers (top caliper in top photo). Whoever came up
    with the idea of adding the dial deserves a medal, in my opinion. The bodies of
    slide calipers are usually metal, whereas as you can find dial calipers with metal
    or plastic bodies. The latest in calipers takes advantage of digital technology
    and offers a numeric readout (though these are quite pricey).


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_0.png)


    # Thickness


    I''ve been using dial calipers for years to measure the thickness of stock (middle
    photo). I use one so regularly for that it resides in my planer stand. Once you
    get to using one of these, you''ll wonder how you ever lived without it. Look
    for one with a dial that has/64" measurements as thousandths.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_1.png)


    # Depth gauge


    Most dial and slide calipers can also be used as very accurate depth gauges. Just
    position the end of the caliper over the hole to be measured. Open the sliding
    jaw until the rod on the end of the caliper bottoms out in the hole; then read
    the dial (bottom drawing).


    Extend Rod to Read Depth


    ![](img/82f8fd51f2b064bbc4df21354d664e50_34_2.png)


    MEASURING AND MARKING TOOLS 33'
