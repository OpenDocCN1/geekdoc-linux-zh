  md: '# Parallel lines


    By far the most common reason I reach for a combination square is that I need
    to mark out a line parallel to an edge or a series of parallel lines. The combination
    square really excels here. Say, for instance, you want to lay out a series of
    lines on a fireplace mantel you''re going to carve a set of flutes. Just set the
    blade the desired distance from the edge of the work-piece, lock it in place,
    and then butt the head against the edge of the work-piece (top photo). You''ll
    note there''s a small notch centered in the end of the metal rule; this is for
    your pencil (or awl, if you prefer). Position the pencil in the notch, and while
    holding it firmly in place, slide the square along the edge of the work-piece,
    keeping steady pressure on the head.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_0.png)


    # PARALLEL LINES WITHOUT A COMBINATION SQUARE


    If you don''t have a combination square and need to lay out parallel lines, here
    are a couple of ways to do it. I had an old-timer woodworker friend who could
    mark parallel lines with just a pencil with unbelievable accuracy. He''d hold
    the pencil in his hand and use his fingers as a stop to position the pencil where
    he needed it (top photo at right). He''d been doing this for so long, he could
    hit a mark within V/32''. Although I''m not accurate, I often use this method
    when I''m marking out a detail that doesn''t require absolute precision, like
    the chamfer around the edge of a table top.

    If you''ve got a lot of parallel lines that need to be precise, consider constructing
    a simple shop-made square (bottom photo). It''s just a block of wood that''s notched
    the desired distance from the edge. A kerf in the end of the scrap accepts a pencil
    to draw uniformly accurately


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_23_2.png)'
