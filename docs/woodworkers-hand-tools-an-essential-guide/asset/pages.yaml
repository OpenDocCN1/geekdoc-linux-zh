  md: '# RASPS


    Even though rasps closely resemble files, they''re very different beasts (tap
    photo). Instead of single rows of teeth cut into the metal surface at an angle,
    rasps have tiny individual teeth in parallel rows. And unlike the smooth, almost
    planing action of a file, a rasp is designed to virtually tear out chunks of wood.
    This makes them very aggressive, and a rasp in the hands of a seasoned user can
    remove a lot of material in no time flat. That''s why rasps are reserved solely
    for roughing-out work that will eventually be smoothed with files, scrapers, or
    sandpaper.


    Most rasps are around 8" to 12" long and come in course, bastard, second-cut,
    and smooth grades. You may also see them described as either wood rasp, a cabinet
    rasp, or a patternmaker''s rasp (bottom drawing). Wood rasps are the most aggressive
    of these and usually come in either flat or half-round profiles. Cabinet rasps
    are typically second-cut and smooth and also come in half-round and flat (half-round
    being the more common). Patternmaker''s rasps are also available in second-cut
    and smooth, and they generally have smaller teeth that tend to leave a smoother
    finish than the cabinet rasp.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_134_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_134_1.png)


    CABINET RASP


    PATTERNMAKER''S RASP'
