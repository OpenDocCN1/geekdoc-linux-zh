  md: '# RASP PLANES


    I know quite a few woodworkers who enjoy using a rasp plane. Rasp planes are commonly
    referred to by their trade name, Surform (a Stanley registered trademark). Surforms
    come in several shapes and sizes (top photo), but all use the same cutting plate.
    This is a steel plate with rows of small teeth pressed into the surface. When
    the plate is discarded and a new one installed, this design advantage over conventional
    rasps is that the teeth are a less likely to clog, since the waste can escape
    through the holes in the plate (middle photo).


    Surforms are intended for rough shaping, and they work well at this. I prefer
    other tools such as a drawknife or spokeshave, but my kids have always found Surforms
    very accessible. Each of them has hailed away hours in the shop with me, reducing
    a square scrap into a convoluted object that “finished” was proudly proclaimed
    to be rocket ship, doll, or doggy (although most ended up looking like hotdog
    buns).


    # Basic use


    Naturally, if young kids use one of these, Surforms are simple to operate. Hold
    the tool as much as you would a jack plane or block plane, and use even pressure
    as you shape (bottom photo). You''ll find that the tooth design allows you to
    cut both with and against the grain, leaving a rough surface. Once rough shaping
    is done, final smoothing is essential.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_136_2.png)'
