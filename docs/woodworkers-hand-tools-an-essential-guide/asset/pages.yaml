    shapes, your files and rasps are likely very prominent in your tool cabinet. Folks
    who build antique furniture, especially Queen Anne furniture, with its classic
    S-shaped cabriole legs, use files and rasps regularly. On the other hand, if you
    build Craftsman style furniture, rectilinear lines,


