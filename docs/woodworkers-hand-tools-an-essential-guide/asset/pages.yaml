  md: '# # SHOULDER PLANES


    After a good jack plane and a block plane, the next plane I''d suggest a beginning
    woodworking purchase is a shoulder plane (top photo). Shoulder planes excel at
    trimming rabbets, shoulders, tenados, and grooves. This is the tool for when a
    joint doesn''t fit right and needs a ''tweak'' or two to get perfect fit. Most
    shoulder planes are all-metal to help create heavy, dense tool that can effectively
    prevent or dampen plane chatter. The blade on a shoulder plane runs the full width
    of the body, and the sides and sole of the plane are ground at right angles to
    each other (bottom drawing).


    Shoulder planes come in widths ranging from 1/2" to slightly over an inch. As
    on a block plane, the blade is mounted bevel up and generally has an effective
    cutting angle of around 37 degrees. This makes it quite good at trimming end grain.
    Another thing that helps with trimming end grain and making fine cuts is an adjustable
    throat.


    On some planes this is adjustable by way of screw; other planes require that you
    add or remove screws between the two halves of the body to vary the placement
    of ways. On larger planes, the blade is often held fast by a lever cap while others
    use a more traditional lever cap screw that requires a screwdriver. Smaller shoulder
    planes generally use a wedge and are adjusted using wood-bodied planes: You tap
    on the front or rear of the body to lower or raise the blade.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_87_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_87_1.png)'
