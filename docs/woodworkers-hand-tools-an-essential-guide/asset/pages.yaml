  md: '# WARRINGTON HAMMERS


    I have a couple of different sizes of Warrington hammers in my tool chest (top
    photo). These lighter-weight hammers are ideal for driving finish nails and small
    brads. Instead of a claw, a Warrington hammer has a small, wedge-shaped cross
    peen that makes it especially useful for driving in brads. The cross peen is a
    real finger-saver when working with short, small brads (middle photo). Why? Because
    the cross peen will actually fit between my fingers to start the br. Once it''s
    started, I flip the hammer to use the flat face to drive the br. Another unique
    feature of this tool is the faces called "side strikes" on the sides of the hammer
    that drive nails in tight spaces.


    Warrington hammers are available in four different weights: 3/2, 6, 10, and 12
    ounces. I have a 6- and 10-ounce hammer, and I can comfortably handle most tasks.
    There''s something odd about these hammers: The end of the cross peen is either
    ground or cast to come to a point instead of being deat. This actually makes it
    difficult to start a brad, as the point will glance off the head of the brad.
    Try filing the point flat to make the tool more usable.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_0.png)


    # NAIL SET


    One of the secrets to nailing effectively is knowing when to stop driving the
    nail with a hammer. The closer you get to the surface, the greater the chance
    of dinging it with the face of the hammer. To eliminate the chance of dings, stop
    when the head of the brad or nail nears the surface—usually 1/16" to /8". Then
    reach for a nail set (photo at right). A nail set is designed to finish the job
    by driving the nail below the surface, or "setting" it. Nail sets available are
    various tip diameters; choose one that is closest to the diameter of the nail.
    Place the set on the nail and tap it to gently set it below the surface. Keep
    a firm grip on the set, since it''s for it to slip off and end up driven into
    the wood.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_146_2.png)


    ASSEMBLY TOOLS 145'
