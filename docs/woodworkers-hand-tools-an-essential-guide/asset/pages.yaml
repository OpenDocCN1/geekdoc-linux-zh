  md: 'Hand-planing is hard work: enjoyable, but if you''ve ever tried planing a board
    with arm strength alone, learned quickly that planing is a whole-body task. Your
    legs are just as important as your arms. Take a stance centered on the board,
    where your legs are spread bit wider than your shoulders, with knees slightly
    bent (top photo). Though you''ll want to maintain firm, even pressure on the plane,
    take care to hold the knob and handle with a light grip: If you use a "white-knuckle"
    grip, your hands will tire.


    # Start the cut


    Before you begin to plane a board, take a moment to "read" the grain. Look at
    the edge of the board, and clamp it to the bench so that the grain will be sloping
    down and towards the body of the plane. Set the plane on the work-piece so the
    body extends off the board with the blade just in front of the leading edge of
    the board (middle drawing). Press down on the front knob, and push the handle
    steadily with your other hand.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_0.png)


    Press Down on Front Knob


    # Complete the cut


    As the plane passes over the end of the board, continue to press down on the knob
    while pushing forward and down on the handle (bottom drawing). As the blade nears
    the end of the board, lessen the pressure on the knob and concentrate on pressing
    down on the handle as you continue to push the plane forward.


    Push


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_1.png)


    Press Down on Handle Only at Finish


    Press Down on Handle and Knob As You Push Forward


    ![](img/82f8fd51f2b064bbc4df21354d664e50_69_2.png)'
