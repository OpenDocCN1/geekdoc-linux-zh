  md: '# PIPE CLAMPS


    It''s a rare woodworker''s shop that doesn''t have pipe clamps (top photo), and
    for good reason: They''re hardworking and inexpensive. Pipe clamps are sold in
    single sets consisting of a separate head and tail piece (middle drawing). You
    supply the pipe, and that''s one of the beauties of these clamps: They can be
    any length. You can buy pipe clamp that accept either 1/2" or 3/4" diameter pipe.
    The 1/2"diameter sets are suitable for light to moderate pressure, whereas the
    3/4"sets can supply a frightening amount of torque.


    When I first started out, I figured that bigger is better, but now most of my
    pipe clamps are 1/2". If you need the force supplied by the larger clamps, there''s
    probably something wrong with the fit of the parts. It''s best to pull these apart
    and tweak them to fit better. Some clamp sets are designed with "clutch" mechanisms
    on both heads. I''d steer clear of these and invest in the type that requires
    a threaded rod on the fixed jaw end.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_163_0.png)


    # PIPE CLAMP PADS


    Since pipe clamps can exert a lot of pressure, it''s important to protect the
    workpiece from being marred by the metal clamp parts. The simplest way to do this
    is to add pads to the faces of the clamps. Store-bought pads, wood scraps, and
    plastic coating all work well for this (photo below left). manufacturers sell
    plastic pads specifically designed to fit their clamps. These slip right over
    the clamp and do a good job, although many have a tendency to fall off with use.
    Another method is to coat the pads with Plasti-Dip—a liquid plastic that hardens
    quickly when exposed to air (it''s available at most hardware stores). Finally,
    the old standby is to apply scraps of wood (1/4") hardboards works great) to the
    jaw faces with double-sided tape.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_163_1.png)'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'One of the challenges to using pipe clamps is aligning them so they''ll pull
    parts together without causing them to shift or twist. The key is to position
    them so they''re parallel to the sides (top drawing). I like to roughly position
    a clamp so it''s friction-tight. Then I use a wood scrap to align the clamps by
    holding it flush with the edge of the workpiece; then I tap the clamp until it
    hits against the scrap. I do this for both ends, double-checking to make sure
    neither has shifted before I tighten the clamps.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_164_0.png)


    # Diagonals


    Even with careful clamp positioning, a case often goes out of square under clamping
    pressure. The simplest way is to measure diagonally across the corners. If the
    measurements match, the corners are perfect 90°. Most likely won''t be. When this
    happens, attach a clamp across the longest measurement as shown in the middle
    drawing. Apply gentle pressure to “rack” the case back into square. Check the
    diagonals again and continue clamping until they''re square.


    # Using a caul


    Pipe clamps are great at applying pressure at a single point, but they''re not
    so at distributing pressure over a wide area. This can be a real problem when
    you''re gluing a case and need the pressure to spread over the entire length of
    a joint. Here''s where a caul can come to rescue. A caul is just a scrap of hardwood
    whose ends are tapered evenly away from the center (bottom drawing). In use, the
    ends of the caul are forced down with pipe clamps and the slight bow in the caul
    creates pressure all along the joint.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_164_1.png)'
