  md: '# Sharpening one side


    I think sharpening is the easy part. In most cases, all you want to do is maintain
    the original sharpening angles. To do this, gently file a slim taper in one of
    the gullets of the saw. You''ll notice that it will almost immediately align with
    the existing angle. All you have to do is then hold it at this angle and take
    a few strokes (top photo). The key thing here is to maintain this angle while
    taking an identical number of strokes for each tooth. Crosscut saws, you''ll need
    to sharpen every other tooth at this angle, then flip the saw and do the other
    side (see below). This work goes surprisingly quick because it''s easy to drift
    into a rhythm—three strokes, skip a tooth, three strokes, et.


    # Sharpening the other side


    If you''re sharpening a rip saw, all the teeth are filed at the same angle—just
    hold the saw perpendicular to the saw blade, and progress down the blade, sharpening
    every tooth in turn. Crosscut saws, with their opposing angled teeth, require
    that you flip the saw to the teeth you skipped earlier. The technique here is
    the same, and if you use the scrap blocks again, you''ll create a crisscross pattern
    that will track your sharpening progress (middle photo).


    # SHOP-MADE SAW VISE


    Although you could clamp a saw in a bench vise for sharpening, you''ll find that
    it''s a lot easier with a saw vise. A saw vise grips a wide portion of the blade
    and raises the blade to a comfortable working height. You can occasionally find
    a saw vise at an auction, or you can make out of a couple scraps and some inexpensive
    hardware (drawing right). The saw vise is just a couple pieces of hard-wood that
    are lined at the top and bottom with strips of hardboard to create jaws. A carriage
    bolt and a wing nut or threaded knob supply the clamping pressure.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_186_0.png)


