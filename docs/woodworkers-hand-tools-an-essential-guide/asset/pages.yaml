  md: '# CLEANING OUT MORTISES


    The other half of a mortise-and-tenon joint, the mortise, often requires some
    "tweaking" after it has been cut. If you''ve cut the mortises by hand, I usually
    need to tweak the tenons for a good fit. If you use a machine, you may need to
    do a little or a lot of work. If the mortises are router-cut, they''ll likely
    only need the corners squared. Ifyou drilled them out, you''ve got considerable
    work to do.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_0.png)


    # Sides


    To clean up the sides of a mortise, choose a sharp chisel that is fairly wide
    (top photo). Take care to keep the chisel vertical (a guide block clamped to the
    workpiece helps), and take light cuts. Skewing the chisel also produces a cleaner
    square.


    # Ends


    Mortise ends often require paring, either to size the mortise correctly or to
    square up corners (middle photo). Although a lot of folks advise using a chisel
    that''s the same width as the mortise for, I''ve had better luck with one that''s
    slightly narrower. This way the chisel doesn''t get jammed between the sides,
    and you don''t have to rock it to get it out. Rocking like that can enlarge the
    mortise, creating a sloppy fit.


    # Bottom


    The bottom of a mortise is a difficult area to clean up, since access is limited
    by the sides and ends. The best way I''ve found to do this is to use a chisel
    with the bevel up and take light, scooping cuts (bottom photo). Avoid the temptation
    of using the top edge of the mortise as a fulcrum point for the chisel: You''ll
    only crush this edge and end up with a weaker joint.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_116_1.png)'
