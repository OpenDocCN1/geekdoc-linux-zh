  md: '![](img/82f8fd51f2b064bbc4df21354d664e50_20_0.png)


    # Checking an edge for square


    The most accurate way to use a square when checking for square is to position
    the blade of the square against the edge of the work-piece (top photo). This lets
    you position the work-piece-so that light can shine through from behind to indicate
    any gaps. The desirable method is to place the blade on the face of the work-piece
    and slide it up until it''s the end of the work-piece (inset). It''s difficult
    to see any gaps this way; avoid it whenever possible.


    # Accurate marking


    If you''ve ever watched a draftsman in action, you''ll note that he always places
    his pencil at the exact point where he wants to draw a line, and slides the square
    so it butts up against the pencil (middle drawing). This might seem like a no-brainer,
    but over the years I''ve watched a lot of woodworkers just the opposite—set the
    square on the mark and then draw the line. The problem with this is that it doesn''t
    take into account the distance between the square and the center-point of the
    pencil lead.


    # ENGINEER''S SQUARES


    Engineer''s squares are similar to try squares except both the stock and the blade
    are metal and they''re manufactured to much higher tolerances. I use them whenever
    accuracy is critical, and I''ve found the small size indispensable for checking
    for square. As a matter of fact, the small one shown here is a constant companion
    to the tape measure and 6" metal rule that reside in my apron pockets.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_20_1.png)'
