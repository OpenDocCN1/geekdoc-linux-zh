- img_proc: true
  md: '# COMBINATION

    QUARES


    What do you get when you combine a metal rule, try square, miter square, level,
    and depth gauge into one tool? A combination square (top photos) is a metal rule
    with a groove in the head of the square. The head has two faces—one at 90 degrees
    and the other at 45 degrees. When the knurled nut on the end of the pin is tightened,
    the head locks the rule in place at the desired location. Some heads incorporate
    a spirit level, but the short length of the head (typically 4") limits its usefulness.
    Most combination squares come with only one head, there are two accessory heads
    that are quite useful: a center-finding head and a protractor head that adjusts
    to any angle from 0 to 180 degrees (inset).


    # As a try square


    Probably the most ordinary use of a combination square is as a try square (middle
    photo). The advantage to using a combination square is that you can adjust the
    head to the desired length. Also, since its head is metal, a combination square
    is usually more accurate than a try square with a wood stock.


    # As a depth gauge


    Another frequent use of a combination square is as a depth gauge (bottom photo).
    To use one for this purpose, loosen the knurled knob and place the 90-degree face
    of the head so that it spans the hole to be measured. Make sure all chips are
    cleared from the hole, and then lower the blade until it bottoms out. Tighten
    the knurled knob and remove the blade to read the depth.


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_0.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_1.png)


    ![](img/82f8fd51f2b064bbc4df21354d664e50_22_2.png)'
