    bud. When we type nslookup, it gives the standard tool prompt in the form of the
    "> symbol. By typing server 192.168.1.85, we tell nslookup to use that IP as the
    DNS server, instead of the one in the local /etc/resolv.conf file. When you use
    a hostname, nslookup comes back and tells us that using 192.168.1.85 as the DNS
    server, it is able to resolve the hostname—in this case, poudaltcom.com.


