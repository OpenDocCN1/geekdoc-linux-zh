  md: "# Chapter 7 • WRT54G Hardware Hacking\n\nContained within our automotive power\
    \ converter is the appropriate circuitry to maintain a constant 5 volts DC at\
    \ USB amperages (100 to 500 milliamperes). By using the adapter and our USB cable\
    \ modification, we can safely provide appropriate voltage to the WRT54G as well\
    \ as isolate the router from the automotive electrical system.\n\n# Homebrew Power\
    \ over Ethernet (PoE)\n\nPower over Ethernet (PoE) is a technology that can deliver\
    \ power over standard Ethernet cables by utilizing unused pairs in the Ethernet\
    \ cable. We refer to this as a homebrew PoE configuration, as it will not conform\
    \ to the IEEE 802.3af standard. The 802.3af standard requires significant power\
    \ output, complex signaling, and some serious software implementation. In our\
    \ nonstandard implementation, we will be injecting power directly into the unused\
    \ pairs.\n\nIn most standard 10-baseT and 100-baseT Ethernet networks, white-blue/blue\
    \ pairs (pins 4 and 5) and white-brown/brown pairs (pins 7 and 8) are unused.\
    \ With this knowledge, we can use readily available components to transmit power\
    \ utilizing these unused pairs. We'll be constructing a pair of adapters, CAT\
    \ 5 cable, and N-type power connectors.\n\nAt the power injection end (where we\
    \ plug in our standard Linksys power adapter), we will need three ports, one of\
    \ which will be a male, N-type connector to receive power. \nThe remaining two\
    \ will be for network connections; incoming from our switch, and the output to\
    \ our WRT54G over a length of CAT 5 cable. In Table 7.6, we indicate the three\
    \ ports for the power injection adapter, and the connection matrix.\n\n# Table\
    \ 7.6 Power over Ethernet Injector Wiring Table\n\n| Output to WRT54G (Ethernet)\
    \ | Input from Network (Ethernet) | Power Input (N-Type Male) |\n|---|---|--|\n\
    | 1 | 1 | |\n| 2 | 2 | |\n| 3 | 3 | |\n| 4 | Unused | +12 |\n| 5 | Unused | +12\
    \ |\n| 6 | 6 | |\n| 7 | Unused | - Ground |\n| 8 | Unused | - Ground |\n\n> It\
    \ is important to note that pins 4, 5, 7, and 8 are not connected to our network\
    \ end. We do not want to inject power back to our switch by accident, the best\
    \ way to ensure that is to not connect them. Also, we will utilize both wires\
    \ in the pair to connect to our power source. If we need provide larger voltages,\
    \ we will have effectively provided a larger diameter of wire.\n\n![](img/41991837f74596e7c29a2498b6ec56e8_331_0.png)"
