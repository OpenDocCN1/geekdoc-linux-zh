    # Captive Portal-in-a-Box


    A captive portal is a handy suite of technologies that allows you to redirect
    users on a wireless network to a page where they can ask to register, authenticate,
    or simply accept an acceptable policy. The various captive portals all do using
    slightly different techniques. Numerous captive portal solutions are available
    to the WRT54G platform. Wifidog and Chillspot are two projects that have grown
    large and are supported on both DD-WRT and OpenWrt. However, both require that
    you have an external authentication service, which can mean setting up a Remote
    Authentication Dial-in User Service (RADIUS) server and even Apache, along with
    MySQL or Postgres database applications. Other projects have taken it a bit further
    and integrated it into a hotspot community, and as a member of the hotspot network.
    Table 4.1 briefly describes the many of the available hotspots.


    # Table 4.1 Available Hotspots


    | Hotspot | Web Site | Technology |

    | --- | --- | --- |

    | Wifidog | http://dev.wifidog.org | An agent that runs on an access point to
    redirect users. Requires a PHP and Postgres backend for authentication and management.
    |

    | Chillspot | www.chillisp.org | Uses a space application to redirect users to
    an authentication Web server which can authenticate using RADIUS. |

    | NoCat | http://nocat.net | The original NoCatAuth requires Perl and typically
    runs on a Linux server. NoCatSplash is a rewrite of this code in C, and it has
    been ported to many platforms, including OpenWrt. It is typically run without
    authentication. |

    | Coova | www.coova.org | A custom firmware based on OpenWrt that uses Chillspot
    and/or Wifidog to provide a captive portal in different configurations. |

    | WorldSpot | http://worldspot.net/wk/ | A social captive portal Web site that
    allows you to join the hotspot, or run your own for fun and profit. Based on DD-WRT
    and Chillspot. |'
