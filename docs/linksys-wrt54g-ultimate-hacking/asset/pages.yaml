    access points), not the user''s client systems. In our case, the RADIUS client
    and server are on the same machine, but we still need to share a secret key between
    them. Configuration reflects that, by setting the key to SecretKey. We then set
    the wlo_auth_mode to radius, and use the combination of AES and TKIP for our paging
    protocol.


