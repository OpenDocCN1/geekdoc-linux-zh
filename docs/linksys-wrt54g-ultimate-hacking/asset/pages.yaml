  md: '# Chapter 1 • WRT54G Fundamentals


    further addition of open source methodologies, it appears clear that Linksys is
    committed to keeping the product line alive and well. This is good news for all
    of us who are tearing them open, and making them submit to our will!


    # History of the WRT54G Open Source Firmware


    At some point in 2003, Andrew Miklas posted several times to the Linux Mailing
    List (http://lkml.org/lkml/2003/6/7/164) about his discovery that Linksys was
    using General Public License (GPL) in the firmware for the WRT54G. As part of
    the GPL, anyone who modifies the code is required to release modification back
    to the community, and Andrew was unable to locate the source for the modifications.
    Andrew opened, communicated with Linksys in order to get the modified software
    released back to the community, and gave signific- support in this endeavor


    Linux enthusiasts were aware of Linksys''s use of open source software by several
    postings to Slashdot in June 2003. The Slashdot and Linksys communities rallied
    to support the GPL, and made their opinions known that Linksys should comply with
    the GPL. Given the enormous pressure from the community, and a group of executives
    who understood the GPL at Linksys, Linksys released its modified code under the
    GPL.


    In June 2003, Rob Flicker posted to his O''Reilly blog about what he had been-forming
    during Hack Night sessions with Seattle Wireless. During these postings, Rob linked
    to the start of the tools for building your own custom firmware. Additionally,
    Andrew made some postings to the Linux Kernel Mailing List on methods and issues
    with cross-compiling code for the Linksys WRT54G.


    From this point forward, we were able to create our own firmware, and many individuals
    did just that. This resulted in a number of different firmware versions, all with
    different add-ons. We will disc-cus a number of these firmware versions throughout
    this book.


    # Linksys WRT54G Series Hardware


    # WRT54G Series: Common Features


    Although there are many models and variations of the WRT54G, most models have
    the same basic features. Let''s explore these common features so that we have
    a solid foundation for under-standing the differences among versions, which will
    allow us to become better WRT54G hackers. This book covers many projects which
    require some knowledge of the WRT54G internal hardware, Also, we will be referring
    to many parts of the WRT54G throughout this book, so it is important that we establish
    a common foundation of embedded device hardware knowledge. We will start with
    an overview of the hardware inside the WRT54G. In this case, we will use WRT54GL,
    version 1.1, as shown in Figure 1.1.'
