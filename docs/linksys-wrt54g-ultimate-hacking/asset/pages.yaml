  md: '# WRT54G Fun Projects • Chapter 4


    Ewrt is an OpenWrt-based firmware distribution that is focused on providing a
    captive portal. Although captive portals are convenient, they do not offer the
    protection of other security mechanisms, such as WPA.


    If you want to prompt the user for a username and password, you must make special
    modifications to the captive portal configuration. Be certain to change the default
    usernames and passwords.


    # Asterisk for VoIP


    +   Asterisk provides a fully featured VoIP PBX on your WRT54G with either software-based
    or hardware-based VoIP phones.


    +   A fully configured Asterisk server is lot of work, but even a basic configuration
    will be useful for making inexpensive calls with the right VoIP provider.


    +   The X-Lite soft phone available for Linux, OS, and Windows is a great, free
    way to get started with VoIP.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask Author” form.


    +   Q: What features does the WRT54G offer over the WGA54G Wireless Gaming Adapter,
    which was intended to be a gaming adapter?


    +   A: The WGA54G does not support WPA, it contains only one wired Ethernet port,
    and it has no easy way to upgrade the antenna.


    +   Q: WPA is not working on my WRT54G running OpenWrt. How do i come?


    +   A: In order for WPA to work on your WRT54G running OpenWrt, you will need
    to install the wl package (ipkg install wl).


    +   Q: How do I reload the wireless settings on my WRT54G running OpenWrt?


    +   A: Simply execute the command wifi to reload the wireless adapter.


    +   Q: I want to experiment with NoCatSplash on OpenWrt. Where should I look for
    information?


    +   A: NoCatSplash is the program heavily modified by the Ewrt forks, and you
    can find more information at http://www.nocat.net/~sderle/README.OpenWrt.


