    # ## IP and Networking


    NVRAM variables relating to the Internet Protocol (IP) and networking appear in
    Table A.2. In this table, the “*” can refer to the interface name, which is, by
    default, lan, wan, or wifi.


    # ### Table A.2 IP and Networking NVRAM Variables


    | NVRAM Variable | Expected Value | Description |

    | --- | --- | --- |

    | *_iframe | <port> | Assigns the network interface name for this category/group.
    Valid values for <port> include (but not limited to) eth1, eth2, eth3, eth4, eth5,
    and ppp0. |

    | *_ipaddr | <ip address> | Sets the IP address of the network interface, where
    <ip address> = valid IP address in x.x.x.x format |

    | *_netmask | <mask> | Sets the subnet mask of the network interface, where <mask>
    = valid subnet mask in x.x.x.x format |

    | *_gateway | <ip address> | Sets the IP address of the network interface default
    gateway, where <ip address> = valid IP address in x.x.x.x format |

    | *_dns | <ip address> | Sets the IP address of the domain name system (DNS) server
    for the network interface, where <ip address> = IP address of a valid DNS server
    in x.x.x.x format |

    | *_proto | <text> | Defines the protocol for obtaining IP information for the
    interface. Valid values for <text> include none, static, dhcp, pppoe, and pptp.
    |'
