    Additionally, the SD card is definitely intended to act as removable media. If
    you have configured specific software to start from, or write to, the SD card,
    operating or booting the WRT54GL without the card inserted can and produce undesirable
    results.


    # Serial


    Another very helpful modification to our WRT54G is the addition of one or more
    serial ports, which can be useful for attaching a GPS, as shown in Chapter 4.
    Most models do have the connectors for serial ports contained on the circuit board.
    In our example, we will be demonstrating on a WRT54GL, version 1.1, as it is readily
    available and possesses the capability for serial ports


    # Components Needed for This Hack


    This hack requires a few additional components that are not provided standard
    with any WRT54G model. The additional components required are:


    +   - A 10-pin set of header pins in a 2-by-5 layout

    - A 10-pin ribbon cable connector

    - Ribbon cable or other appropriate wire'
