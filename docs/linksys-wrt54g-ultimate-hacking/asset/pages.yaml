  md: '# Auto-Starting Asterisk on Boot


    By default, the packages used to install Asterisk do not set Asterisk to survive
    a reboot. At this point, if our WRT54G were to reboot, Asterisk would not be running.
    This can be particularly frustrating, if you expect Asterisk to "just work"''
    after you have configured it, or when the WRT54G is installed in an area where
    it is not readily accessible physically or via the network. It is also not particularly
    helpful to log in and restart Asterisk when it is readily accessible and you are
    using it!


    In order to have Asterisk restart after a reboot, you need to add a script to
    the standard Linux startup framework under /etc/init.d.You also need to make sure
    the /etc/asterisk file files contain ENABLE_ASTERISK=yes, which may already be
    set to no. It is possible that the file does not exist, and if it does not, you
    will need to create it.


    You''ll also create the following script with vi under /etc/init.d, and name it
    S60Asterisk:


    ```

    #!/bin/sh


    DEFAULT=/etc/default/asterisk

    OPTIONS=""


    [ -f $DEFAULT ] && . $DEFAULT

    [ "ENABLE_ASTERISK" = "yes" ] || exit 0


    case $1 in

    start)

    [ -d /var/run ] || mkdir -p /var/run

    [ -d /var/log/asterisk ] || mkdir -p /var/log/asterisk

    [ -d /var/spool/asterisk ] || mkdir -p /var/spool/asterisk

    usr/sbin/asterisk $OPTIONS

    ;;

    stop)

    [ -f /var/run/asterisk.pid ] && kill $(cat /var/run/asterisk.pid) >/dev/null 2>&1

    ;;

    *)

    echo "usage: $0 (start|stop)"

    exit 1

    esac

    ```


    To make sure your startup script is executable, use:


    ```

    chmod +x /etc/init.d/S60Asterisk

    ```'
