  md: '# Summary


    Wireless networks have become quite ubiquitous in our current environment, and
    security is becoming increasingly important as their usage grows. Unlike wired
    networks, wireless networks extend their range beyond the physical world. As a
    result, we open ourselves to attack each time we use a wire-network, at home,
    at work, or at the local coffee shop. By utilizing these security methods for
    our wireless networks, we can begin to protect our networks from unauthorized
    use. Although not all of the security methods are ideal, or truly secure, they
    at least provide a deterrent.


    # Solutions Fast Track


    # Basic Wireless Security


    +   - Choosing an appropriate SSID name is important, as you do not want to give
    out too much information about yourself within the namespace of the SSID.

    - Hiding your SSID and configuring MAC address filtering, when used together in
    conjunction with other wireless security mechanisms, can help to secure your wireless
    network.

    - Some devices will only support WEP, although WEP is not considered a secure
    protocol, it is still better than running an open wireless network.


    # Configuring WPA-Personal (PSK)


    +   - WPA-PSK uses a shared secret to offer much better security than WEP and
    it is supported on most wireless hardware available today.

    - WPA-PSK is vulnerable to dictionary attacks, so be certain to use a strong passphrase
    and change your SSID to something that is nonstandard.

    - WPA2-PSK offers some enhanced security over WPA-PSK and should be used if the
    client hardware can support it. OpenWrt supports both WPA-PSK and WPA2-PSK.


    # Configuring WPA-Enterprise (and WPA2-Enterprise)


    +   - WPA-Enterprise offers increased security over WPA-PSK because it does not
    use a static key, and it utilizes a central directory for authentication.

    - There are many different EAP types. However, PEAP and TTLS are recommended for
    general use and offer a similar level of security and client support.

    - Using TTLS in Windows requires that a third-party, open source supplicant, called
    SecureW2, be installed.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'Chapter 5 • Securing Wireless Using a WRT54G


    Using OpenWrt, the standard wireless drivers, FreeRadius, you can set up an access
    point as a self-contained WPA-Enterprise wireless network.


    # # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: I live far away from other people. Do I still need to put security on my
    wireless network?

    A: At the DEFCON 13 Wireless Shoothesout Contest, in 2005, the winning team was
    able to get a wireless signal to reach 125 miles. We always recommend people secure
    their wireless networks, regardless of their location (unless you have built a
    faraday cage around your house).


    +   Q: In my environment, I am able to use only MAC address filtering and WEP
    as security mechanisms. What can I do to help protect my wireless network?

    A: You can do two things. Implement Snort wireless (http://snort-wireless.org),
    and you can monitor the traffic coming from your wireless network carefully using
    the standard Snort, firewall logs, and traffic captures,


    +   Q: I left my SSID at the default setting of linksys and enabled WPA with a
    password of password. Am I still safe?

    A: If an attacker wants to target your network, he would be able to crack the
    SSID and password combination quickly using the hacking tools mentioned in this
    chapter. It is best to set a unique SSID name and use a long string of characters
    for the WPA/WPA2 shared key.


    +   Q: No matter what I do, WPA will just not work. What''s wrong?

    A: The most common problem is that people do not install the package in OpenWrt.
    Do an ipkg update and then ipk install nas.


    +   Q: I upgraded to a more recent version of OpenWrt and now WPA is not working.
    how come?

    A: When upgrading, sometimes the nas package needs to be reinstalled (enter ipkg
    remove nas, ipkg update, and then ipk install nas).


    +   Q: I created my own certificates, but I am getting errors that they are invalid.
    Why?


    ![](img/41991837f74596e7c29a2498b6ec56e8_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Securing Wireless Using a WRT54G • Chapter 5


    A: Be certain that you followed the instructions for setting the correct time
    on your routers, in Chapter 3. Certificates have an expiration date associated
    with them, so if the client and access point are not set to the correct time,
    you will get errors.


    Q: I have more than 10 people connecting to a WRT54G running WPA-Enterprise using
    PEAP with AES encryption. What can I do to improve performance?


    A: The first thing to do is to separate the RADIUS server out to a separate device.
    This could be another WRT54G box; however, it might be best to configure a Linux
    server. Also, you can experiment with WPA versus WPA2, and use TKIP instead of
    AES to save processing power.


    Q: I have seen bothAP types, PEAP and TTLS, require a digital certificate on the
    server and authenticate the user through the user''s password. Apart from the
    built-in Windows support, what is the main difference between PEAP and TTLS?


    A: PEAP discloses the usernames when establishing the secure TLS communication
    channel with the server. If you capture network traffic, you can see the usernames
    in the clear. TTLS uses a generic user instead, called *anonymous*, and then exchanges
    the real username inside the TLS tunnel. Therefore, TTLS is the preferred method
    from a security perspective.


