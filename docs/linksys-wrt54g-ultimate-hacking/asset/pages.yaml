  md: '# File System


    NVRAM variables relating to the flash file system (JFS2) appear in Table A.5.


    Table A.5 File System NVRAM Variables


    | NVRAM Variable | Expected Value | Description |

    |---|---|---|

    | jffs_mounted | <number> | Automatically mounts the JFS2 file system, where <number>
    is 0 = not mounted and 1 = utilized under DD-WRT. |

    | enable_jiffs2 | <number> | Enables the JFS2 file system, where <number> is 0
    = disabled and 1 = enabled. Only utilized under DD-WRT. |

    | sys_enable_jiffs2 | <number> | Enables the JFS2 file system at the system level,
    where <number> is 0 = disabled and 1 = enabled. Only utilized under DD-WRT. |

    | clean_jiffs2 | <number> | Maintains the JFS2 file system at the user level,
    where <number> is 0 = disabled and 1 = enabled. Only utilized under DD-WRT. |

    | sys_clean_jiffs2 | <number> | Maintains the JFS2 file system at the system level,
    where <number> is 0 = disabled and 1 = enabled. Only utilized under DD-WRT. |


    # Miscellaneous Hardware and Custom Software Options


    NVRAM variables relating to other miscellaneous hardware options appear in Table
    A.6.'
