  md: '# Chapter 1 • WRT54G Fundamentals


    +   The WRT54G, version 4.0, was the first device to combine the CPU, Wireless
    MAC, and Ethernet MAC onto a single chip (SoC, or System-on-Chip).


    +   The WRT54GL is produced by Linksys specifically for hacking.


    +   The WRT54GS contains the fastest processor (266 MHz) that we will cover in
    this book. It also offers a USB port and is the only router we will cover that
    does not use RP-TNC connectors for the wireless antennas.


    # WRT54G Buyer’s Guide


    +   The average user might not require third-party firmware, and therefore use
    a WRT54G version 5.0 or 6.0. However, if such a user requires a boost in wireless
    signal strength, he can install the DD-WRT micro edition to gain this ability.


    +   Power users and typical geeks will want to purchase the WRT54GL model routers
    or use OpenWrt firmware.


    +   Speed freaks will want to purchase routers with the most memory and flash,
    so versions 1.0 through 3.0 of the WRT54GS, or the WRTLS54GS, are good choices.


    +   The hardware hacker should buy any WRT54G he can afford, as all contain GPIO
    ports and can be hacked in some way, shape, or fashion.


    # Frequently Asked Questions


    The following Frequently Asked Questions answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to syngress.com/solutions
    and click on the “Ask Author” form.


    Q: What is the difference between the WRT54G and WRT54GS?


    A: There are few differences between the two models. However, the major difference
    is that WRT54G models contain 16 MB of RAM and 4 MB of flash. Most WRT54GS models
    contain 32 MB of RAM and 8 MB of flash, and the SpeedBooter/AfterBurner technology
    enabled by default.


    Q: Why would I want to put third-party firmware on my WRT54G?


    A: For the same reason people climb mountains because you can! Also, you are able
    to unlock many of the hidden features inside your WRT54G routers, such as the
    ability to adjust the wireless radio transmit power, access all of the firewall
    features, change the default port assignments, and install a wide variety of open
    source software.'
