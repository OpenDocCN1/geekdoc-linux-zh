    # Disabling HTTP and Enabling HTTPS


    As Telnet, HTTP will transmit your usernames, passwords, and all data in clear
    text across the network. This means that anyone on the same subnet on either client
    or the server networks could intercept the traffic and steal your credentials.
    Using packages from Backports, you can install an HTTPS-only Web server:


    ```

