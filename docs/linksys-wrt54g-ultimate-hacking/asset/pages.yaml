- img_proc: true
  md: '# Chapter 7 • WRT54G Hardware Hacking


    Once you have removed the antennas, you can remove the light purple panel in the
    front from the rest of the casing. To remove the front panel, grip the side of
    the WRT54G on the gray portion, and pull on the front panel as demonstrated in
    Figure 7.5. Pull hard! Don''t be afraid! It is not necessary to remove the foil
    warranty sticker, as it will be quickly rendered useless by a hard pull.


    > WARNING

    Version 3 of the WRT54G does have a Phillips screw under each front leg that you
    need to remove before removing the front panel. They are located under the black
    rubber feet on the underside of the front panel.


    # Figure 7.5 Opening the WRT54G Front Panel


    ![](img/41991837f74596e7c29a2498b6ec56e8_291_0.png)


    After you remove the front panel, separate the top of the remaining gray case
    from the bottom panel by sliding the top toward the router about one-quarter of
    an inch, and then lifting off the base. You will also need to remove the circuit
