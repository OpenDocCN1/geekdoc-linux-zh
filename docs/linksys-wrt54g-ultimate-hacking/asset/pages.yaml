  md: '# WRT54G Fundamentals · Chapter 1


    We want this book to be your road map to using WRT54G devices to your advantage
    in many different environments, including work and home. We''ve found so many
    users for them that we know others can benefit as well. Hence, this book will
    guide you on your journey to unlocking all of the potential of the WRT54G hardware
    and software platforms.


    > NOTE


    There are a few perceived meanings of the word hacking. hacking means using things
    for a purpose for which they were not originally intended. For example, Linksys
    did not intend to allow users to add a Secure Digital (SD) card reader to a WRT54G.
    However, we will show you how to “hack” the WRT54G and add an SD card reader to
    expand the WRT54G storage capabilities. Hacking also refers to the act of gaining
    access to computer systems/or networks (i.e., using the systems or software in
    a way that the creators did not originally intend), along those lines, we will
    show you how to use WRT54G routers in your legitimate hacking and security practices,
    such as penetration testing and performing network/system audits. You must all
    perform this testing with permission, preferably written, from appropriate parties.


    # History of the Linksys WRT54G


    Linksys began version 1.0 of the WRT54G in late 2002 as a home router, firewall,
    and wire-less networking product. In the beginning, it was primarily intended
    to support wireless networks, and inclusion of additional features merely complemented
    the wireless capabilities. At that time, the device was relatively commonplace;
    it featured a wide area (WAN) port, a four-port 10/100 switch, and 802.11b switch.
    The device also supplied a Web interface for configuration—practice that had become
    popular with consumer devices in earlier years. Since the initial launch in 2002,
    Linksys has revised the hardware of the WRT54G several times to provide upgrades
    to the base unit. The device has proven enough that Linksys has spawned very similar
    models in the WRT54G series to deliver various features, speed enhancements, and
    form factors. We will discuss a number of the models later in this chapter, and
    we will begin to see the natural progression that developments have afforded the
    product line.


    This product line has been a very good for Linksys. Although sales figures for
    the device are typically not broken out from figures for Linksys as a whole, company
    executives have quoted as saying, “We literally hundreds of thousands per month.”
    This popularity is by part, due to the fact that you can modify the device, and
    as a community of open source advocates and hardware hackers alike has embraced
    it.


    With the recent official support from Linksys of third-party firmware through
    the release of the WRT54GL, Linksys is poised to sell even more units. We are
    currently seeing additional hardware revisions of the WRT54GL which, from an initial
    observation, seem to be following the trend of the original WRT54G series of hardware.
    With this continued development of the WRT54G


    ![](img/41991837f74596e7c29a2498b6ec56e8_20_0.png)'
