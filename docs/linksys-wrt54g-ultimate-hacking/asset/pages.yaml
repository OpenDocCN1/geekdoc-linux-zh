- img_proc: true
  md: '# Summary


    There are many ways to break your WRT54G, and a few ways to fix them. Utilizing
    the methods in this chapter, you should be able to revive most dead WRT54G routers
    that have had software errors. If nothing else, there is always more help available.


    # Solutions Fast Track


    # Using OpenWrt Failsafe Mode to Unbrick Your Router


    +   - You must have OpenWrt Whiterussian RC5 or later in order to use failsafe
    mode.


    +   - Failsafe mode works great if you are trying to recover from a corrupt JFFS
    partition or NVRAM went wrong.


    +   - When in failsafe mode, be certain to set your local IP address to something
    in the 192.168.1.0/24 subnet (other than 192.168.1.1, which will be the IP address
    of your router).


    # Using JTAG to Unbrick Your Router


    +   - The HairyDairyMaid''s Debrick Utility is the tool of choice for both Windows
    and Linux users who want to perform JTAG read and write operations for the CFE,
    kernel, or NVRAM.


    +   - Always make a backup of your CFE and NVRAM. It is impractical to back up
    your kernel or the whole flash chip.


    +   - You can obtain new copies of the CFE from the Skynet Repair Kit Bootloader
    Creator.


    # Getting Further Help


    +   - The OpenWrt project has many excellent online resources, such as a wiki,
    forum, and IRC channel.


    +   - The DD-WRT project has online resources as well, covering a wide range of
    topics.


    +   - The Web offers other resources that will help you if you get stuck. For
    example, the Linksysinfo.org Web site has information about hacking the WRT54G
    platform, including support for many different firmware distributions.'
  merge: -1
