    nYou might be looking at the screen in Figure 3.4 and wondering what Afterburner
    is. We are not talking about the device game, but wondering what chipset manufacturers
    attempt to get more throughput using 802.11g. Broadcom''s attempt was Afterburner
    and rebranded by Linksys as "SpeedBooster". It uses a combination of reduced signal
    overhead and combining packets to provide more throughput. Of course, this does
    nothing to improve distance and the client card must also support this technology
    to see any performance improvements (in fact, using cards that do not support
    it can decrease performance!). Linksys originally intended the WRT54GS models
    to only support SpeedBooster; however, thirdparty firmware can enable this on
    even WRT54G models because the same chipsets are used. See www.dd-wrt.com/wiki/index.php/Afterburner
    for more information.


