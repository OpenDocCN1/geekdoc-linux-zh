    # Configuring WPA-Enterprise (and WPA2-Enterprise)


    WPA-Enterprise is intended for organizations that wish to use WPA and tie into
    a backend authentication mechanism such as Lightweight Directory Access Protocol
    (LDAP) or Microsoft''s Active Directory. Instead of using a shared key, WPA-Enterprise
    uses an EAP type to provide the authentication. We could go into many of the details
    of WPA-Enterprise; however, they are far beyond the scope of this book. We do
    believe it is the best option for wireless security for the following reasons:


    +   - It is vulnerable to dictionary attacks against the shared key, because there
    is no static and user-selected presared key.

    - It is much easier to change the authentication credentials, as it not done with
    a key that must exist on the client device, but rather via a central authentication
    point.

    - A Remote Authentication Dial-in User Service (RADIUS) server is used for authentication,
    which can provide detailed accounting and logging, as well as advanced features
    that can be implemented for authorization.


    With WPA-Enterprise come many different EAP types, each with their own characteristics.
    Table 5.1 displays some of the most popular EAP types from the long list of Internet
    Task Force (IETF) standards and vendor proposals.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Table 5.1 Available EAP Types


    | EAP Type | Description |

    |---|---|-|

    | EAP-TLS (Transport Layer Security) | PKI; certificates on both, the client and
    server. | Requires that you generate a certificate for every client, which serves
    as the authentication mechanism. |

    | TTLS (Tunneled Transport Layer Security) | PKI; only a server certificate is
    required. Clients are authenticated using a user password, and usernames are not
    disclosed in the network (as in PEAP). | Authenticates the server to the client.
    Requires a third-party supplicant to run in Windows. |

    | EAP-GTC (Generic Token Card) | Smart card or other security token. | Developed
    by Cisco as an alternative to PEAP that did not require MSCHAPv2, but instead
    uses a smart card. Sometimes referred to as PEAPv1/EAP-GTC. |

    | PEAP (Protected EAP) | PKI; only a server certificate is required. Clients are
    authenticated using MSCHAPv2, typically tied to Microsoft Active Directory. |
    Windows hosts and is the most widely deployed EAP type. |

    | EAP-MD5 | MD5 hashing function. | Does not offer a high level of security; is
    vulnerable to dictionary attacks. |


    Much of the configuration surrounding WPA-Enterprise will be focused on the server
    itself which runs on the router for a completely self-contained WPA-Enterprise
    solution. Larger organizations (10+ people) should utilize an authentication server,
    such as Microsoft’s Internet Authentication Service (IAS) or FreeRadius, and the
    corresponding user repository infrastructure, such as Microsoft’s Active Directory
    or other LDAP server.


    Although WPA-Enterprise offers better security than other options such as WEP
    and WPA-PSK, it relies only on user passwords for security. If you are using this
    option, be certain to enforce a good password policy. The SANS Institute has a
    good example of a password policy located at www.sans.org/resources/policies/Password_Policy.pdf.'
  merge: -1
