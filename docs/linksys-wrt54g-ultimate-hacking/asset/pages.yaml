  md: '# Chapter 1 • WRT54G Fundamentals


    # WRT54GS, Version 1


    The WRT54GS, version 1.0, much like version 1.1 of the WRT54G, contains the BCM2050
    wireless chipset, which will be prevalent throughout most of the WRT54G models.


    With the introduction of the WRT54GS series, the Cisco Systems have been a fixture,
    as the WRT54GS models were released after Cisco acquired Linksys. Additionally,
    all of the GS models use the same 12V DC 1.0 A power supply, present in many other
    G and GS models.


    The LED in front of the device are very similar to those on the G models, and
    exhibit the same characteristics. They blink when there is activity and stay solid
    green to show a link. The power light should be solid green; if it is blinking,
    there could be trouble. Many other LED states indicate problems, or opportunities
    to do something, as push the Reset button.


    This model is also the only WRT54GS router to utilize the ADMtec ADM6996L chipset
    to provide the Ethernet switch into the router. Other unique characteristics of
    this GS model are that Linksys has elected to use 32 MB of Erontech SDRAM.


    Version 1.0 of the GS model features 8 MB of Intel flash memory and the Broadcom
    BCM4712 processor. Table 1.1 lists the specifications of the WRT54GS, version
    1.0.


