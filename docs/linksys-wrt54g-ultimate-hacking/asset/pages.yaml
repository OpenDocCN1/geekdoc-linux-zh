  md: '# Chapter 8 • Troubleshooting WRT54G


    Before you select a device for which to create a CFE, you need to update the CFE
    images by selecting the Online-Update button, and then clicking Start in the Online
    updating window. Once the update is complete, you utilize the drop-down menu,
    Select Device, to pick your device. Next, you will need to provide a Media Access
    Control (MAC) address in the Device''s labeled MAC address field. You can find
    this MAC address on the label at the bottom of the WRT54G. After you''ve filled
    in all of the fields, click the Create CFE.BIN button, which will display a standard
    Windows save dialog box. Save the CFE.BIN file in your desired location, and proceed
    with the JTAG CFE flash.


    # Getting Further Help


