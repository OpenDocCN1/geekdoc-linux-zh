  md: '# WRT54G for Penetration Testers • Chapter 6


    +   - wl promis the wireless card in promiscuous mode, allowing all network traffic
    (at Layer 2) to be captured, regardless of source or destination Media Access
    Control (MAC) address.


    +   - Monitor mode is enabled using the wl monitor to capture all wireless traffic
    (at Layer 2), including management, control, and data 802.11 files.


    +   - Kismet is started using the custom configuration in /etc/kismet.conf, and
    with the unsigned console output to /dev/null (nowhere).


    Now that you have the Kismet Drone and channel starting at every boot, you can
    configure a centralized server to connect to the Kismet Drone. Typically, you
    will want to connect your WRT54G to the Kismet Drone installed on your network
    using the wide area network (WAN) port, for ease of installation. The WAN port,
    in its default configuration, is already configured to obtain an IP address via
    the Dynamic Host Configuration Protocol (DHCP), and it provides some firewalls.
    By using the WAN port, you can also prevent a second firewall from becoming active
    on the attached subnet, which can cause network problems.


    We introduce a few problems when using the WAN port for connecting to your Kismet
    Drone. First, we would not be able to connect the Kismet Drone due to the IPTABLES
    firewall rules. We will change these settings shortly, so will no longer be an
    issue. Second, we are electing to utilize DHCP on the WAN interface. This can
    cause the WAN port to receive a different IP address, as we would no longer be
    able to connect to our drone!


    You can resolve the WAN port DHCP problems if you want, by assigning an appropriate
    static IP to the WAN port to be static (instead of DHCP), as well as the WAN IP,
    netmask, gateway, and domain name system (DNS) server:


    ```

    # nvram set wan_proto=static

    # nvram set wan_ipaddr=<WAN IP Address>

    # nvram set wan_netmask=<WAN Netmask>

    # nvram set wan_gateway=<Gateway IP Address>

    # nvram set wan_dns=<WAN DNS IP Address>

    # nvram commit

    # ifup wan

    ```


    After you have changed these NVRAM settings, you will be able to use the statically
    assigned address defined by wan_ipaddr. This has the potential to allow more controlled
    filtering for firewalls (on the WRT54G, or on a network inline), and better filtering
    on your server configuration.

    You also need to change the default firewall configuration on your WRT54G to allow
    the Kismet Drone to connect to the WAN-assigned IP address. You should also allow
    SSH connections on the WAN port, for remote management and configuration of the
    Kismet Drone. You can accomplish these firewall changes by editing /etc/firewall.user.
    In /etc/firewall.user, you need to locate the Open Port to WAN configuration section.
    In this section, note that two configuration lines exist for enabling SSH access
    via the WAN port, but they have been commented out.


    You need to uncomment the SSH configuration lines in the Open Port to WAN connection,
    to allow traffic for the Kismet Drone port. The easiest way is to paste a copy
    of the two SSH rules, and modify them to reflect reflect port 3501 (the default


    ![](img/41991837f74596e7c29a2498b6ec56e8_254_0.png)'
