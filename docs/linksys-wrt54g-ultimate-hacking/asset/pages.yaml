    # Solutions Fast Track


    # Our Approach to This Book


    +   - Please read this chapter first, it will help you decide which Linksys router
    to purchase, and previously unknown features about any Linksys WRT54G routers
    that you currently own.

    - We provide you with real-world examples of how to use WRT54G routers throughout
    the different projects in this book.

    - "Hacking" refers to the way in which we use something for a purpose other than
    what was originally intended. Always get written permission from appropriate parties
    before you engage in performing security assessments.


    # History of the Linksys WRT54G


    +   - The Linksys WRT54G series routers have been available since 2002, and have
    sold well.

    - Linksys used modified GPL source code, and in early 2003 was forced to release
    this to the public due to Andrew Miklas? discovery of Andrew

    - Once the source code to the WRT54G was released, many people began to create
    their own firmware and cross-compile applications.


    # Linksys WRT54G Series Hardware


    +   - All WRT54G series routers have common features, such as Flash, RAM, RP-TNC
    antenna connectors, CPU, Ethernet MAC, Wireless MAC, and wireless radios.

    - All WRT54G series routers use a Broadcom MIPS CPU.

    - The model, version, and serial number can be obtained from the sticker on the
    underside of the device.

    - The WRT54G, version 1.0, was the only WRT54G series router to use a mini PCI
    slot for the wireless card.

    - The WRT54G, version 2.2, came with 32 MB of RAM; however, Linksys activated
    only 16 MB of RAM in its default configuration.'
