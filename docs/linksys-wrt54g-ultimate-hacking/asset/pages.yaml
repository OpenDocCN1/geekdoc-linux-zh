  md: '# WRT54G Fun Projects • Chapter 4 159


    works passively collecting packets and detecting standard named networks, detecting
    (and, given) time, cloaking hidden networks, and inferring the presence of nonbeaconing
    networks via data traffic.


    Kismet works a bit differently than most other network discovery tools, in that
    it is completely passive; it only listens for wireless traffic. Most other tools
    send requests for wireless networks. By just listening, we gain several advantages:
    It is unlikely that Kismet will be detected, as it does not generate any traffic
    to be seen by another; and by listening, we can determine information that other
    tools cannot.


    > NOTE

    Kismet is under constant development and is well supported through user forums.
    For more information and assistance with Kismet, visit the Project site at www.kismetwireless.net.


    Fortunately for this hack, Kismet has already been ported to the WRT54G; however,
    there are some issues with the ipkg installation. Most notably, the OpenWrt package
    repositories have the appropriate GPS interface code removed. Because you will
    likely be driving on the move, GPS data values become very volatile when analyzing
    the data in order to determine which individual access points are located. You
    can acquire working Kismet elsewhere, as shown in our instructions. In order to
    install Kismet, you only need to install kismet-server on your WRT54G. In order
    to start this multiprocess step, you will need to obtain and extract the precompiled
    Kismet binaries.


    ```

    # cd /tmp

    # wget http://wrt54ghacks.com/whiteussian/kismet-2006-04-R1-wrt54.tar.gz

    # tar -zxvf kismet-2006-04-R1-wrt54.tar.gz

    ```


    Now copy your precompiled binaries and configuration files to some useable locations:


    ```

    # cd /tmp/kismet-2006-04-R1-wrt54

    # cp kismet_server /usr/bin/kismet_server

    # cp conf* /etc/kismet/

    ```


    In order for Kismet to function properly, you also need to install libpcap to
    support network packet capture.You can install libpcap from the default OpenWrt
    repository with:


    ```

    # ipkg install libpcap

    ```


    For the third step, you need to edit your Kismet configuration file in /etc/kismet/kismet.conf
    for your environment.The following lines should replace the existing lines in
    the current /etc/kismet/kismet.conf:


    ```

    source=wrt54g,prism0,wrt54g

    suideruser=root

    channelhop=false

    ```


