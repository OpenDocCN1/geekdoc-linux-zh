  md: "# Securing Wireless Using a WRT54G • Chapter 23\n\n```\nmax_servers = 4\nmin_spare_servers\
    \ = 1\nmax_spare_servers = 3\nmax_requests_per_server = 300\n```\n\n tells FreeRadius\
    \ to start only one daemon at boot time, and to never start more than four. The\
    \ min_spare_servers and max_spare_servers define how many additional daemons FreeRadius\
    \ will start. FreeRadius is adaptive. It will dynamically adjust the number of\
    \ servers running to handle the load, in keeping a few \"spares\" around for other\
    \ traffic and higher load conditions. The max_requests_per_server is the maximum\
    \ number of requests it will handle before cleaning up, freeing resources, and\
    \ restarting. This ensures that a memory leak, which could be detrimental to an\
    \ embedded device, does not get out of control and the system to crash.\n\nWe've\
    \ included a file called clients.conf, which lists the clients that will use this\
    \ RADIUS server for authentication (in our scenario, the only local server acting\
    \ as a wireless access point):\n\n```\nclient 127.0.0.1 {\n  secret = SecretKey\n\
    \  shortname = localhost\n  nastype = other              # localhost isn't usually\
    \ a NAS...\n}\n```\n\nBe certain that the value of the RADIUS parameter, secret,\
