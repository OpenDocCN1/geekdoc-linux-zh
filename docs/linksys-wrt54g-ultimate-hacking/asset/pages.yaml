  md: '# Configuring a Caching-Only DNS Server


    A caching-only DNS server is a great way to control your local DNS lookups. Instead
    of having to connect to your Internet service provider''s (ISP''s) DNS servers,
    you can set up your own server to answer queries from the local network, which
    are then forwarded to the ISP''s servers. For each lookup that you do, the local
    DNS server will cache the lookup so that subsequent lookup come directly from
    the local DNS server. The other advantage this has the ability to "blackhole"
    certain domains. For example, there is a list of domains that are commonly used
    to provide ads, and others that are commonly used to distribute malware. By adding
    entries for these domains to resolve 127.0.0.1, you can effectively prevent yourself
    from seeing the banner ads or not downloading malware. You can use banner ads
    to not only displaying animated images, but also possibly collect personal information
    about you. Using cookies, a company like DoubleClick log your IP address, Web
    browser type and version, and operating system, and even your name! These images
    could be used to distribute malware, either through directly exploiting your computer
    with the images (see the Microsoft advisory MS006-001, www.microsoft.com/tech/security/Bulletin/MS006-001.msp)
    or by enticing you to click on a link which will take you to a Web site that will
    attempt to exploit your Web browser software and/or operating system.


    The first step is to disable the default startup script for dnsmasq, the program
    that controls DNS and DHCP for OpenWrt:


    ```

    # /etc/init.d

    # mv S60dnsmasq disabled_s60dnsmasq

    # chmod -x disabled_s60dnsmasq

    ```


    Next, you need to create a replacement file. The new S60dnsmasq startup script
    should look as follows:


    ```

    #!/bin/sh

    dnsmasq -C /etc/dnsmasq.conf

    ```


    This startup script requires execute permissions to run. You can set these using
    the following command:


    ```

    # chmod 755 /etc/init.d/S60dnsmasq

    ```


    Next, you need to remove the default /etc/resolv.conf and replace it with your
    own:


    ```

    # rm /etc/resolv.conf

    # cat > /etc/resolv.conf

    nameserver isp.dns.srv.ip1

    nameserver isp.dns.srv.ip2

    <CTRL-D>

    ```


    Be certain to replace isp.dns.srv.ip1 and isp.dns.srv.ip2 with the IP addresses
    of your ISP-provided DNS servers. Next, you need to update the DNS resolution
    file option in /etc/dnsmasq.conf, which you should change to the following value:


    ```

    resol-file=/etc/resolv.conf

    ```'
  merge: -1
  pgno: 139
