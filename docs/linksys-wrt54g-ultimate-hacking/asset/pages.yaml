    also extend this solution to employees that are frequently traveling and require
    a VPN connection coupled with wireless connectivity for clients. For example,
    a trade show or hotel room is a likely scenario. Typically, hotels offer either
    wireless or Internet access for a fee. These hotspot networks are almost always
    open. The same goes for a trade show; you may have computers or other devices
    that are required to operate your booth at the show and need a secure wireless
    connection with access to your company''s local network. Having your WRT54G provide
    you a secure VPN tunnel to the corporate network, and a secure wireless network
