  md: 'To configure the initial settings it is best to take a laptop or PC and plug
    it into the LAN side of wrt-pc.You will get a default, dynamically assigned IP
    address where you can then log into the Web interface using the default username
    of admin and a password of admin. Next, you need to use the Web GUI to configure
    the IP address on the WAN interface, which can be either static or dynamically
    assigned. You will also need to be certain that the default gateway and DNS servers
    are provided, manually if you are using a static IP address. A static IP address
    can have an advantage, as you can restrict it to the rest of the network as it
    will represent all wireless portal ports. A static IP address also makes it easy
    to admin from the WAN if you choose. The LAN side of wrt-pc needs to be a different
    subnet from the WAN side; in this case, you assign 10.13.37.0/24 the subnet. By
    changing this setting, you will need to re-login to the Web GUI. You will need
    to be to configure a DHCP server on the LAN side as well so that clients can get
    an address, default gateway, and DNS server when associating to the wireless captive
    portal SSID, which can be called something like "MyHotSpot". By default, the SSID
    is dwelt, but you can change this by going into the wireless settings (Wireless
    | Basic Settings).


    ```

    # ssh 10.13.37.1

    ```


    > The SSH server takes a minute or more to produce a prompt as it generates the
    keys. Be patient.


    Set the following NVRAM variables:


    ```

    # nvram set lan_gateway_enable="0"

    # nvram set lan_gateway=""

    # nvram set lan_dns_enable="0"

    # nvram set lan_dns=""

    # nvram set lan_wan_proxy_arp="0"

    # nvram set lan_wan_bridge="0"

    # nvram commit

    # reboot

    ```


    These ensure that your default route or DNS server on the WAN works properly and
    is not confused with a route or DNS server setting on the LAN port. Next, go to
    the GUI and enable NoCat, as shown in Figure 4.6.'
