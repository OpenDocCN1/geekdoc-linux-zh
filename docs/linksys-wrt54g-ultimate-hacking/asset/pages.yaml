    Captive Portal Password Sniffer


    Captive portals are useful technology and are used throughout the world in various
    hotspots. Some charge for wireless Internet access, whereas others may just ask
    you to agree to an acceptable policy (AUP). Most of these services do not provide
    encryption for the wireless


