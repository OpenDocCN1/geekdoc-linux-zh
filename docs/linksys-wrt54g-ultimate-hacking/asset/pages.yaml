  md: '# Setting the Wireless Radio Transmit Power


    One of the most common features sought after by WRT54G hackers is the ability
    to adjust the less radio transmit power (TX power). Entire firmware distributions
    are dedicated to this ability (for instance, HyperWRT, created in Chapter 2).
    There are a few items that we covered up until now, but we believe require more
    explanation.The actual transmit power limit of the WRT54G hardware and associated
    driver is 25mW.As stated in Chapter 2, this will cause overheating. In addition,
    cranking the power to achieve more will actually have the reverse effect. Due
    to the noise created by such a high output power, the signal will bleed into others
    and becomes less efficient


    http://explorer.cyberstreet.com/wrt4/WRT54g-spectraloutput.html). The optimum
    output power, meaning that one will increase and not introduce noise, is documented
    as 89mW. This setting will not overheat the router; however, we recommend that
    you provide adequate ventilation for your WRT54G routers (e.g.,do not put them
    in your desk drawer).


    You can easily change the transmit power using OpenWrt from the command line.
    First, let''s take a look at the default wireless transmission power value in
    OpenWrt (Whiterussian 0.9). To do this we will need to install the wl command-line
    program. This is a small, proprietary, binary program from Broadcom that allows
    you to view and change the settings of the wireless driver.


    ```

    # ipkg install wl

    Installing wl (3.90.37-1) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/non-free/wl_3.90.37-1_mipsel.wl

    Configuring wl

    ```


    Successfully terminated.


    # WARNING


    During the course of writing this book, the authors uncovered a bug in the wl
    command. If you execute this command (any parameter) while the radio is disabled
    (nvram set wl0_radio="0"; nvram /sbin/wifi) you will receive an error, shown here:


    +   # txpwrxlimit


    Segmentation fault

    Once this command has executed and generated the preceding error, any attempt
    to access the wireless subsystem will result in the command hanging and not responding.
    These commands include wl, wifi, and, reboot. You will still be able to connect
    to the router via SSH from the LAN or WAN ports; however, to fix the wireless
    problem you need to power-cycle the device. It is a good idea to be certain your
    wireless radio/interface is enabled before executing commands that access it (nvram
    get wl0_radio). The authors are in the process of contacting the vendor (because
    the wl binary comes from Broadcom) and reporting this bug. Check www.wrt54ghacks.com
    for updates.


    ![](img/41991837f74596e7c29a2498b6ec56e8_136_0.png)'
