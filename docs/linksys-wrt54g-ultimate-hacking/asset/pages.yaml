    # # The Ping Hack


    Linksys WRT54G stock firmware versions prior to 1.42.2 contained a vulnerability
    in the ping.asp Web page allowed remote arbitrary code execution. This method
    is used only for older routers and is no longer required. However, it is important
    to understand some of the historical items surrounding it. Using the vulnerable
    Linksys firmware, you need to browse to http://192.168.1.1/Ping.asp (or by using
    the menu in the Web interface, click Administration | Diagnostics | Ping). The
    original intent of this page was to allow the user to send ping packets via the
    Web interface. However, due to a programming flaw, you can run commands of your
    choosing by enclosing them in "", and sending the output to /tmp/ping.log. Figure
    5 provides an example of the Ping Hack Screen.


    # Figure 2.5 Example of the Ping Hack Screen


    ![](img/41991837f74596e7c29a2498b6ec56e8_79_0.png)


    For example, consider the following command:

    ls${IFS}>tmp/ping.log


    If you were to put that command into the IP Address or Domain Name field and then
    clicked Ping, it would execute and list the contents of the current directory
    in the text box. The ${IFS} is an interfield separator, a UNIX/Linux environment
    variable that inserts a space so that the command can run properly. With some
    modifications, you can write a set of commands that will enable the boot_wait
    parameter:


    ```

    ; cp${IFS}/*/*nvram${IFS}/tmp/n

    ;*n${IFS}set${IFS}boot_wait=on

    ;*n${IFS}commit

    ;*n${IFS}show>tmp/ping.log

    ```


    www.synergy.com'
