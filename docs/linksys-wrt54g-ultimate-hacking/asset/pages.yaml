    # OpenVPN Bridge Mode versus Route Mode


    OpenVPN offers two modes of operation: bridge and route. There are significant
    differences in the way these two modes behave:


    +   - Bridge mode provides a Layer 2 connection between clients and servers. This
    means that all broadcast traffic is shared between them, which could cause performance
    problems.


    +   - Once a bridge is established, connectivity is pretty simple, as there are
    no routes to add because you are on the same Internet Protocol (IP) subnet.


    +   - Route mode is a Layer 3 connection, and it requires that changes be made
    to your routing tables in order to provide connectivity to the remote end.


    +   - Bridge mode is a bit more complicated to set up, as you need to be certain
    that the appropriate tunnel drivers are added to the kernel and that the correct
    interfaces are added to the bridge.


    +   - Route mode performs better than bridge mode in most cases.


    For the examples in this book, we are using bridge mode with a WRT54G set up as
    a client. You can apply this method of operation to many of the projects in this
    book, such as Kismet Drone and Wi-Spy, to tunnel data securely to a central server.


    # Using the WRT54G as an OpenVPN Bridged Client


    OpenVPN is a very popular open source software that utilizes Sockets Layer/Transport
    Layer Security (SSL/TLS) to create VPN tunnels. OpenVPN is very flexible, and
    it runs on a variety of different platforms, including Windows, OS X, Linux, and
    of course, various firmware on the WRT54G. In this example, we will use OpenWrt,
    as the OpenVPN packages are already compiled and available in the package repository.


    As security professionals, we can use OpenVPN to our advantage in many ways. First,
    let''s explore using the WRT54G as an OpenVPN client and the advantages this provides.
    Consider the diagram in Figure 6.1.


