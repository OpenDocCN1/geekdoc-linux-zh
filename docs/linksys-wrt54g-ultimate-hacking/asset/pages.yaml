    bridge. We use two virtual LANs (VLANs) on the device to serve the two subnets
    into what is referred as "routed bridge mode." Let''s take a look at this configuration.
    We first have to break the default bridge that connects the wireless interface
    to the LAN port:


    ```

    # nvram set lan_ifname="vlan0"

    # nvram set wan_ifname="eth1"

    # the wireless interface

