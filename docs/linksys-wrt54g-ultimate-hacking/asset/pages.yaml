    # Installing Software under FairizaWRT


    FairizaWRT comes with a robust package management system used for installing,
    removing, and updating software. Setting up ipkg under FairizaWRT is subtly from
    ipkg under OpenWrt setup. FairizaWRT is configured to use the FairizaWRT package
    repository as the default place to look for and obtain packages. Although the
    FairizaWRT repository is very similar to that of OpenWrt, the FairizaWRT repository
    may not up-to-date with the latest OpenWrt packages, or provide many older or
    additional packages offered by OpenWrt. As FairizaWRT is based on the OpenWrt
    project, the packages are interchangeable.


    # Installing Arack-ng with FairizaWRT


    We are using Arack-ng as an example in this section because it is one of the most
    popular wireless networking auditing tools. It has the capability to sniff wireless
    traffic and crack WEP keys. It is an essential tool for wireless audits and penetration
    testing, and when you combine it with a small, embedded device you can use for
    mobile devices. For example, if you have gained access to an organization and
    wish to leave behind for auditing the wireless network further, WRT54G with Arack-ng
    is a useful device for this purpose.


    In order to install Arack-ng with FairizaWRT, you need to modify the default ipkg
    repository. Unfortunately, The Hacker Pims do not include Arack in the base install,
    nor do they include it in the online package repositories. OpenWrt does an Arack-ng
    package in its repository. As you may recall, The Hacker Pims have the configuration
    to use their own package repository. As a result, you need to add an additional
    package repository to the configuration.


    In order to add the additional package repository to the configuration, you need
    to modify the ipkg.conf file located in the `/etc` directory. If you perform a
    directory listing, you will note that the ipkg.conf file is a symbolic link to
    `/rom/etc/ipkg.conf`.


    ```

    lrwrxrwrw  1 root  root  18 Jan  1 2000 ipkg.conf -> /rom/etc/ipkg.conf

    ```'
