  md: '# Introduction


    In this chapter, we will cover the hacks that require hardware modification to
    the WRT54G routers. Although many people would consider some of these hardware
    hacks to be on the advanced side, we are here to show you that they can be easily
    accomplished by experts and amateurs alike. It will be helpful in the course of
    this chapter to have a little experience with a soldering iron and a power tool
    or two. Don''t let soldering scare you! With little to no practice, you can master
    some basic soldering techniques.


    ![](img/41991837f74596e7c29a2498b6ec56e8_285_0.png)


    > MAKE magazine released some fantastic tutorials on soldering as part of its
    "Learn to Solder Month." These tutorials will turn you into an expert in no time,
    and they are very easy to understand. You can find the tutorials, and other great
    soldering links, on the MAKE blog at www.makezine.com/archive/2007/01/its_learn_to_so.html.


    # Fun with Wireless Antennas


    Antenna selection can be one of the make-or-break activities that will determine
    the success of your wireless network. For many, the default antennas that ship
    with the WRT54G are perfectly suitable. However, being the hackers that we are,
    we probably want something more from our wireless networks. By changing our antennas,
    we can achieve some very impressive results.


    # Components Needed for This Hack


    This hack requires a few additional components that are provided standard with
    any WRT54G model. The additional components required are:


    +   - An appropriate antenna

    - A pigtail (optional)


    # Understanding RF


    In order to understand how to pick an appropriate antenna, you need to understand
    a little about how the radio frequency (RF) signals can be affected by power settings
    and antennas. Because a comprehensive discussion of RF could fill more than half
    of this book, we will be providing a very basic description.


    Ultimately, the wireless signal that reaches your client will be affected by the
    amplitude, power, of the signal that reaches it. Wireless signals work much like
    the ripples in a pond created by dropping a stone in the water. When the ripples
    extend further out from the epicenter, they become'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# WRT54G Hardware Hacking • Chapter 7


    softer and less powerful. We can make the ripples stronger from the epicenter
    by applying more initial force—in the case of wireless, with increasing transmission
    power, increasing antenna gain, or adding amplifiers. Effectively, all of these
    solutions will increase the range of a wireless network. By utilizing additional
    antennas for point-to-point links, it is important to note that antenna upgrades
    must be performed at both ends. Additionally, clients connected to a network where
    increased range is desired will also benefit from upgraded antennas.


    The initial transmission power of the WRT54G radio is 89mW (as determined by the
    wire-driver), with the default 2.2dB antennas giving us about 142mW of total transmit
    power at the antenna, using the RF rules of the 3 s and 10 s. This total output
    power of wireless card plus antenna is also known as EIRP (Equivalent Isotropically
    Radiated Power). The FCC determines the limits of WiFi radiation in the US based
    upon the EIRP, and they are rated at 1000mW (1 Watt) for indoor applications,
    or 4000mW (4 Watt) for outdoor applications.


    ![](img/41991837f74596e7c29a2498b6ec56e8_286_0.png)


    Cisco has some great information on calculating EIRP using the RF math rules of
    the 3s and the 10s, at www.cisco.com/en/US/tech/tk72/tk809/techniques_tech_note09186a0080e09fe.html.
    Additionally, RadioLabs offers a free wireless calculator, useful for converting
    mW to dB, and so. You can find the wireless calculator at http://radiabs.com/stations/wifi_calc.html.


    By simply upgrading our antennas on our WRT54G to some inexpensive 7dB replacements,
    we can increase the EIRP value to about 446mW! for every increase in our antenna
    gain by +9dB (or +6dB) outdoors, we effectively double our coverage area (or distance)


    # Antenna Types


    Antennas come in many different shapes, sizes, and capabilities. However, you
    can break them into two generic types based on their RF propagation methods. It
    is important to verify that the antenna you select is suitable for the 2.4GHz
    (802.11b/g) and/ 5.8GHz (802.11a) bands, and antenna design depends on the intended
    frequency range.


    # Omnidirectional Antennas


    Omnidirectional antennas, as the default 2.2dB antennas, are the most common for
    indoor applications. As the name may imply, an omnidirectional antenna radiates
    RF signals in a circular, 360-degree pattern. This type of antenna, shown in Figure
    7.1, makes perfect sense when trying to cover an area such as a home, apartment,
    or office with wireless signals.


    ![](img/41991837f74596e7c29a2498b6ec56e8_286_1.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'Chapter 7 • WRT54G Hardware Hacking


    # Figure 7.1 Omnidirectional Antennas: 2.2dB, 7dB, and 9dB


    ![](img/41991837f74596e7c29a2498b6ec56e8_287_0.png)


    # Directional Antennas


    Directional antennas come in many different flavors, including Yagi, panel, sector,
    reflector, and parabolic. These different types all refer to the unique design
    in which they are constructed. Construction differences do have an impact on how
    the antenna functions or focuses wireless signals. In this chapter, we will be
    illustrating several types of directional antennas.


    Directional antennas focus the wireless signal based on their capabilities or
    design, and as a result, they increase the effective dB. By focusing the wireless
    signal, a directional antenna does not propagate signals in a 360-degree pattern
    (much like an omnidirectional antenna). Instead, it reduces the degree of propagation
    to less less than 90 degrees. However, directional antennas can range from 5 to
    180 degrees, depending on design. This reduction in propagation angle is referred
    to as beam width, and beam width varies for each antenna and design.


    Directional antennas are perfect for implementing long-range wireless links between
    multiple WRT54G units in either a WIRE or a WET configuration, as described in
    Chapter 4.The smaller directional antennas (shown with the larger antennas) in
    Figure 7.2 can also be extremely helpful as an aide in pinpointing other networks,
    such as rogue, by utilizing the focused nature of the wireless signal. Some of
    these smaller antennas, such as the 9dB Yagi in Figure 7.2, are also capable of
    being installed on a compatible dish (as shown at netgate.com/product_info.php?cPath=23_36&products_id=382)
    to further increase their dB and narrow their beam width.'
  merge: -1
