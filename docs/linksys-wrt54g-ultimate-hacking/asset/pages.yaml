  md: '# Tools & Traps...


    # Which Hardware Do I Have?


    You''ll see when we cover the hardware in version 4.0 of the WRT54G that the lines
    separating all the routers in this series moving forward will begin to blur. There
    are few notable differences between the WRT54G hardware after version 4.0 and
    the hardware in version 2.0 of the WRT54GS. To dig a bit deeper, it is important
    to understand some of the subtle differences, as they may be significant depending
    on which WRT54G hack you are trying to perform.


    The WRT54G devices, in addition to other devices, store information in NVRAM related
    to the type of hardware. You can view this information by using the following
    commands to list the pertinent NVRAM variables, as board information:


    ```

    # nvram show | grep board sort

    size: 13076 bytes (19692)

    boardflags=0x2

    boardnum=42

    boardrev=0x10

    boardtype=0x0467

    ```


    You can then compare this information to the table provided by the OpenWrt project,
    located at http://wiki.openwrt.org/OpenWrtDocs/Hardware/Linksys/WRT54G, Section
    1.1.8, "Table Summary." First let''s look at the boardflags variable and find
    it on the table. We can see that WRT54 versions 4.0 through 6.0 have this same
    value. Upon closer inspection, we see that the same versions also have the boardnum
    and boardtype. However, the boardrev in our case is 0x10 and corresponds to a
    version 4.0 WRT54G, according to the table. We established that the WRT54GL is
    the same, and we can verify this as the variables in the preceding example did,
    in fact, come from a WRT54GL (version 1.1, to be specific). It is not possible
    to differentiate between version 5.0 and 6.0 models with this table.


    Another important detail is the process version. You can obtain the processor
    type and version by running the following command:


    ```

    # grep cpu /proc/cpuinfo

    cpu model : BCM3302 V0.8

    ```


    Versions 4.0 through 6.0 of the WRT54G also share the same CPU model: the BCM3302,
    version 0.8.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 1 • WRT54G Fundamentals


    # WRT54G, Versions 5.0 and 6.0


    For a brief moment, the entire WRT54G community stood in shock and awe as Linksys
    released the WRT54G, version 5.0. Indeed, the company ended a long series of hackable
    routers by introducing a model based on VxWorks rather than Linux, but it quickly
    followed this with the release of the WRT54GL, which was intended for WRT54G hackers.
    However, versions 5.0 and 6.0 of the WRT54G routers contain several significant
    architectural changes, as listed here and in Figure 1:15.


    +   - **Decreased flash** The amount of flash was reduced from 4 MB to 2 MB. This
    was a major factor in the crippling of the device, as it greatly limits the amount
    of software that can install.


    +   - **Decreased memory** The memory was also cut in half, from 16 MB to 8 MB.
    Before this change, you could easily push the WRT54G platform to its limits with
    respect to available memory, and cutting it in half makes the problem twice as
    bad. For example, the popular سكان tool, Nmap, has a difficult time running on
    the WRT54G platform, with ever 16 MB of RAM.


    +   - **Transition to the VxWorks operating system** The final blow was the migration
    from a Linux-based operating system to VxWorks, a proprietary OS from Wind River
    used in embedded devices which include printers, private branch exchange (PBX)
    telephone systems, digital cameras, and the Mars Exploration Rover! VxWorks is
    a true Real Time Operating System (RTOS), which means it is intended to have a
    small footprint for embedded devices, yet still provide a multitasking environment.


    Other than these changes, there are few notable differences between the devices.
    The type of RAM used is slightly different, with version 5.0 using an ISSI brand
    and version 6.0 using Samsung-branded memory. Most other models use an Intel-branded
    flash, whereas these do. It has been speculated that the company transitioned
    to this platform to reduce manufacturing costs.


    On the plus side, you can still hack these versions! And thanks to a great effort
    from some dedicated folks in the WRT54G hacking community, doing so is actually
    a fairly simple process. Please note, you will be limited to the DD-WRT micro
    edition; however, we believe this firmware has much more to offer than VxWorks.
    We provide full and updated instructions in Chapter 2. Table 1.9 lists the specifications
    of versions 5.0, 5.1, and 6.0 of the WRT54G.'
