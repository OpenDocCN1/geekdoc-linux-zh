  md: '# WRT54G Fundamentals • Chapter 1 41


    strength.) Even frustrating are the people who try to blame it on Linksys and
    give its routers a bad name. Rest assured that more people misunderstand the problem
    than understand it.


    To understand the problem you have to understand some Transmission Control Protocol/Internet
    Protocol (TCP/IP) fundamentals and how peer-to-peer networking protocols work.
    All TCP communications (a.k.a. sessions) have a lifetime without them, sometimes
    called a timeout. In addition to timeouts, devices have limits on the number of
    connections they can handle simultaneously. These two factors are important for
    devices running firewalls. All the Linux-based devices we will be talking about
    throughout this book use iptables (linux filter). iptables tracking the number
    of sessions and timeouts.


    Peer-to-peer software typically creates more simultaneous sessions than most.
    When you start up peer-to-peer software, it connects to hundreds, sometimes thousands,
    of hosts looking for other machines that have other software. When about the file
    you are looking for, or portions of the file you are looking for. It''s generally
    a noisy protocol, which in turns loves create large numbers of sessions, some
    of which even cause problems with enterprise-level firewalls.


    The default settings on Linksys routers using older versions of the stock firmware
    would, among other things, set the default established session timeout to five
    days. After some period of time, your router will run out of connections and stop
    traffic. Additionally, Linksys did not do a very job of tuning these default settings.
    Even some of the third-party firmware packages include settings that cause the
    routers to hang. However, we did not find that this problem existed in OpenWrt.


    In any case, for this problem equates to the following commands on older WRT54G
    firmware that uses Linux kernel versions prior to 2.4.23:


    ```

    # echo "60 1800 120 60 120 120 10 60 30 120" > \

    /proc/sys/net/ipv4/ip_conntrack_tcp_timeouts

    ```


    These values correspond to TCP/IP parameters as follows:


    | Timeout (Seconds) | TCP/IP Connection State |

    |---||

    | 600 | NONE |

    | 1,800 | ESTABLISHED |

    | 120 | SYN_SENT |

    | 60 | SYN_RECV |

    | 120 | FIN_WAIT |

    | 120 | TIME_WAIT |

    | 10 | CLOSE |

    | 60 | CLOSE_WAIT |

    | 30 | LAST_ACK |


    The preceding TCP/IP parameters control many of the properties and timeouts associated
    with TCP/IP connections. For example, “60 – SYN SECV” refers to how long Continued


    ![](img/41991837f74596e7c29a2498b6ec56e8_58_0.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 1 • WRT54G Fundamentals


    the operating system should wait for a TCP three-way handshake to complete once
    the initial SYN packet is received. For more information, refer to http://forum.utor-rent.com/viewtopicic.php?pid=29675.


    Firmware using kernel 2.4.23 or later would change the following:


    ```

    # echo ''4096'' > /proc/sys/net/ipv4/netfilter/ip_conrack_max

    ```


    The preceding command puts a value of 4096 as the maximum number of connections
    that the kernel can track. In this case any attempt to initiate a "connection"
    in a TCP/IP connection to another host that requires passing through the WAN port
    of the router. If you are using OpenWrt, the default value is already set to an
    even value of 5953. For DD-WRT, the default value is set to 512. You may want
    to experiment with these values and/or check the current connection count. You
    can check the number of current connections by using the following command in
    OpenWrt and DD-WRT:


    ```

    # wc -l /proc/net/ip_conntrack

    ```


    Although these configuration changes are not the only ones to fix "peer-to-peer
    problems," they are the most effective as they address the root cause of the problem.
    Each distribution has its own take on this problem. For further information, refer
    to the following links:


    +   OpenWrt (http://forum.openwrt.org/viewtopic.php?pid=39508) OpenWrt

    Forum, "How to Debug router crash & reboots?"

    DD-WRT (www.dd-wrt.wiki/index.php/Router_Slowdown) Router Slowdown

    HyWRT/Thibor

    ((www.torrent.org/faq#Special_note_for_users_with_Linksys_WRT54G_GL_GS_routers)
    "Special note for users with Linksys WRT54GI/GL routers, there are severe problems
    with them when running any P2P app (read for fix)")


    # Recommended Firmware


    No-party firmware is required to perform the basic functions described early,
    and the Linksys firmware is more than capable, provided it is the latest version
    and the review is kept up-to-date with regular firmware upgrades. Average users
    will most likely run the standard Linksys firmware. However, the most common feature
    in third-party firmware sought by this user is the ability to increase the wireless
    signal strength. Many users will place an access point in their homes and want
    to connect wirelessly throughout. Without the dynamic level of interference could
    occur, signal strength may not always be optimal. An increase in radio power could
    solve some of these issues (although not all) and is more cost-effective than
    adding large antennas. This feature is, of course, not available in the stock
    Linksys firmware (Link likely does not want to be responsible for users melting
    their WRT54G routers). However, an upgrade to DD-WRT micro edition on the WRT54G,
    versions 5.0, 6.0, and 7.0, is an excellent way to increase signal strength and
    gains available in


