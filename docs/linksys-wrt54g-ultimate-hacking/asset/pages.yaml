  md: '# Tools & Traps...


    # All Your Passwords Belong to dsniff


    As far as password sniffing goes, few tools are as widely recognized as Dug Song’s
    dsniff program, available at www.monkey/~dugsong/dsniff. dsniff allows you to
    capture traffic and pick off passwords from a long list of protocols, on the fly.
    dsniff supports many different protocols with respect to password sniffing, including
    FTP, Telnet, POP3, SMTP, IMAP, and HTTP. This is a perfect tool to install on
    our fake captive portal device because we could not obtain the passwords the users
    enter on the splash Web page, but also we could potentially grab some of their
    other words when connecting to remote servers with dsniff. The preceding example
    uses an older version of Ewrt (Whiterussian 0.9). To combine these two small projects
    would require some development effort, but would not be too difficult overall.
    To install dsniff, do the following:


    ```

    # ipkg install dsniff

    Installing dsniff (2.3-2) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/dsniff_2.3-2_mipsel.ipk

    Installing libnet (1.0.2a-7) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/libnet_1.0.2a-7_mipsel.ipk

    Installing libcap (0.9.4-1) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/libcap_0.9.4-1_mipsel.ipk

    Installing libnids (1.18-0) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/libnids_1.18-0_mipsel.ipk

    Installing libssl (0.9.8d-1) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/libopenssl_0.9.8d-1_mipsel.ipk

    Installing libdbm (1.8.3-0) to root...

    Downloading http://downloads.openwrt.org/whiterussian/packages/libgdm_8.3-0_mipsel.ipk

    Configuring dsniff

    ```'
