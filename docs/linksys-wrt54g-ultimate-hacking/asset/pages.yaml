- img_proc: true
  md: '# Chapter 8 • Troubleshooting WRT54G


    split all the flash backup images into the individual files using some other utilities,
    it quickly becomes an exercise in inefficiency.


    Once you have completed all of your backups, you can begin to restore your router
    configuration back to a working state. You will start with the simple problems,
    and work up to the more difficult ones.


    The easiest problem that you can fix with the JTAG cable concerns NVRAM. It is
    very easy to turn a WRT54G into a brick by setting NVRAM variables to incorrect
    settings and making the router inaccessible! During the course of this tricky,
    the authors successfully locked themselves out of WRT54G by incorrectly defining
    virtual (VLAN) assignments, and no Internet Protocol (IP) communication to the
    router was possible.To clear NVRAM settings use the following:


    ```

    # wrt54g -erase:nvram

    ```


    After a short period of time, the debrick utility should report a success. If
    this is all you need to fix your router, a reboot should restore the WRT54G to
    the default configuration.


    # WARNING


    > It is not safe to perform an NVRAM erase on all models, as the CFE on some models
    does not re-create the minimal NVRAM settings. Please refer to Chapter 3, which
    discusses which models is unsafe to erase NVRAM. If you have erased NVRAM on a
    model that is unstable you can use the debrick utility to restore your previously
    backed-up NVRAM settings (you did make a backup, right?) with the following command,
    which should issue issue after renaming your NVRAM file to NVRAM.BIN:

    # nvram -flash:nvram

    The debrick utility will only upload specific files (there is no option to change
    the filename). The files to upload via JTAG must be named CFE.BIN, KERNEL.BIN,
    NVRAM.BIN, or WHOLEFLASH.BIN, depending on the type of write to be performed.

    Models where erasing NVRAM is not a good idea, access via a serial console to
    change NVRAM settings may be possible after performing the serial port mod change
    in Chapter 6.


    If you have corrupted your operating system through one or more means (deleting
    needed files, creating a startup loop, or any other method), you can resolve this
    situation with a little more work. By starting with the debrick utility to erase
    the kernel (or operating system) partition:


    ```

    # wrt54g -erase:kernel

    ```


    This command will complete the kernel erase. Once the utility reports a success,
    you will need to reboot the WRT54G. During the reboot, you will notice that there
    is no operating system, and will revert to failsafe mode. In failsafe mode, you
    can once again upload new firmware to the'
