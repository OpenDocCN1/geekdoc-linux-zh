  md: '# Table A.4 continued Wireless Networking and Encryption NVRAM Variables


    | NVRAM Variable | Expected Value | Description |

    | wl0_wpa_psk | <text> | Defines the WPA or WPA2 preshared key. Valid entries
    for <text> are alphanumeric characters, from 8 to 63 characters in length. |

    | wl0_crypto | <text> | Defines the WPA underlying cryptographic method. Valid
    values for <text> are tikip, aes, or tikip+aes. |

    | wl0_closed | <number> | Enables disables SSID broadcasting, where <number> =
    0 for broadcast-enabled or 1 for broadcast-disabled (cloaked network). |

    | wl0_wep | <number> | Enables Encryption Protocol (WEP) encryption, where <number>
    = 0 for disabled or 1 for enabled. |

    | wl0_key | <number> | Primary WEP key index. Chooses the appropriate WEP key
    as defined by the wl0_key<N> NVRAM variables. Valid values for <number> are 1
    through 4, depending on the desired wl0_key<N>. |

    | wl0_key<N> | <text>, s:<text> | Defines a WEP key. <text> should be composed
    of five characters, or 10 HEX digits for 64-bit WEP, or 13 characters or 26 HEX
    digits for 128-bit WEP. <text> must be in hexadecimal formatting, unless the s:
    prefix is defined. Valid values for N are 1 through 4. |

    | wl0_macmode | <text> | Sets wireless Media Access Control (MAC) access control
    list. Valid values for <text> are: disabled = disables filtering allow = allows
    only the MAC addresses defined in wl0_maclist deny = denies only the MAC addresses
    defined in wl0_maclist |

    | wl0_maclist | <text> | A quoted, space-separated list of MAC addresses to allow
    or deny access via wireless. MAC addresses must be listed in the xx:xx:xx:xx:xx
    format. |'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Appendix A • NVRAM Command Reference


    # Table A.4 continued Wireless Networking and Encryption NVRAM Variables


    | NVRAM Variable | Expected Value | Description |

    |---|---|---|

    | wl0_radius_port | <number> | Sets the Transmission Control Protocol (TCP) port
    number used for authentication to a Remote Authentication Dial-in User Service
    (RADIUS) server for WPA/WPA2 Enterprise, where <number> = a valid TCP port number
    1 to 65536. |

    | wl0_radius_ipaddr | <ip address> | Sets the IP address of the RADIUS server
    for WPA/WPA2 Enterprise, where <ip address> = a valid IP address in x.x.x.x format
    |

    | wl0_radius_key | <text> | Defines the key for authentication to a RADIUS server.
    <text> should contain an alphanumeric string of 1 to 64 characters. |

    | wl0_auth_mode | <text> | Sets the authentication mode for WPA. Has been deprecated
    by wl0_ak, but will not damage any other settings by defining this variable, and
    some installations require it. Valid settings for <text> are: psk = WPA or WPA2
    presared key radius = WPA or WPA2 Enterprise |

    | wl0_antdiv | <number> | Sets the wireless antenna diversity. Valid values for
    <number> are: -1 = auto-select 0 = main antenna (near Reset button) 1 = auxiliary
    antenna (near power connector) 3 = diversity, uses both antennas |'
  merge: -1
  pgno: 363
