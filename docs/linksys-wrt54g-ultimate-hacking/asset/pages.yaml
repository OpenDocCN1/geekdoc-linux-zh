  md: '# Introduction


    In this appendix, we will list the NVRAM variables used throughout this book,
    broken down category. This appendix is not intended to be an all-encompassing
    listing, but includes the variables that were important to be included elsewhere
    in the book. For a full list of all OpenWrt NVRAM commands, visit http://wiki.openwrt.org/OpenWrtNVRAM.
    Additionally, http://downloads.openwrt.org/docs/contains a listing of manufacturers
    with default NVRAM settings for some devices listed in the nvram.txt file for
    each hardware version (Table A.1).


    # nvram Command Usage


    # Table A.1.


    | Command | Description |

    |---|---|

    | nvram show | Lists all NVRAM variables and values. The list is typically quite
    long, so nvram show | sort | more is a good way to make the output more readable.
    Also, these values are stored in /dev/nvram and you can access them with the command
    strings /dev/nvram | sort | more. If you need to send your NVRAM variables to
    someone (e-mail, commands, forum, etc.) you can run either of the two preceding
    commands and pipe to a file (e.g., strings /dev/nvram | sort > /ltmp/nvram.out).
    |

    | nvram get <variable> | Gets the value of a specific variable and displays it
    on the screen. If you do not know the entire variable name, you can use the command
    nvram show | grep <string>. For example, to see all of the wireless settings,
    use the command nvram show | grep wlo0_*. |

    | nvram set <variable>= | Sets a variable to a specified value. NVRAM commands
    apply only to the running memory on the router. They do not take effect until
    they are committed to flash nvram commit. You can clear the value of any variable
    using an empty string, as in nvram set wlo0_sid="" |

    | nvram unset <variable> | Deletes a variable from NVRAM. It is very useful to
    undo the creation of new variables with invalid names, such as wlo0_sid instead
    of wlo0_sid. |

    | nvram commit | Saves NVRAM settings from memory to flash.'
  merge: -1
