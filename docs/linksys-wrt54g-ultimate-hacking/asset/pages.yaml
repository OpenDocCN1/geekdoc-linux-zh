    be on the

    10.13.37.0/24 subnet. Once rebooted, go back into the Web interface and go to
    Access

    Restrictions | Captive Portal (NoCat), as shown in Figure 6.10, and customize
    the settings to

    your choosing by changing the Gateway Name of your captive portal.


