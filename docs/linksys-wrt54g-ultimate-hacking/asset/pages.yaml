  md: '# WRT54G Fun Projects • Chapter 4


    You can find the full dial plan from BroadVoice at www.broadvoice.com/support_install_
    asterisk.html.


    # Configuring the X-Lite Soft Phone


    Before investing a considerable amount of money in a physical IP phone, we suggest
    a software-based VoIP phone. There is no sense in spending your hard-earned money
    just to make sure Asterisk meets your needs. Although you have many options to
    choose from, the X-Lite soft phone CounterPath (www.xten.com) is a great alternative.The
    X-Lite soft phone supports Windows, Linux, and OS X.


    > > WARNING As of this writing, the OS X X-Lite client (version 2.0 1105x, build
    stamp 21409) is very buggy. It will make and receive calls appropriately; however,
    it has a nasty habit of crashing when a call has ended. X-Lite is under constant
    development, so we expect many of these issues to be resolved in future releases.


    For our example, we will be configuring the OS X client. Although the Linux and
    Windows clients have slightly different appearances, the menus and items needed
    for configuration are the same. With the OS X and Linux installations, when the
    X-Lite soft phone is first started it enters into a configuration wizard for determining
    appropriate sound configuration. We will skip the configuration wizard under OS
    X and Linux, as the reminder of the settings that need to be configured are the
    same for all three clients.


    Under OS X and Linux, you can find these settings under Menu | System Settings
    | SIP Proxy. We need to configure a few settings for our example in this menu,
    also reflected in Figure 4.8.


    +   - Display Name Set this to whatever you want Caller ID to display.

    - Username This is the extension as defined in sip.conf.

    - Password In our example, this should be left blank.

