    # # Solutions Fast Track


    # # Configuring and Using OpenWrt


    +   - OpenWrt relies on the command-line interface to manipulate its settings.
    It uses a stripped-down Linux shell called BusyBox to provide a Linux/UNIX interface.
    Configuration data stored in NVRAM is easily changed using the nvram command.


    +   - Opkg is a package management system similar to the Debian Linux "apt” project.
    It provides for package updates, easy software installation, and dependency handling.
    You can point opkg to a few different package repositories, including backports,
    a collection of posted software not in the main OpenWrt package tree.


    +   - Using OpenWrt, you can customize your DNS and DHCP environments, including
    domain filtering and fixed address assignment by MAC address.


    +   - Adding USB support and/or configuring Samba will provide your router with
    access to more disk space. If you have disk space attached to the router itself,
    you can share this with the rest of your network using Samba too.


    # # Configuring and Using DD-WRT


    +   - DD-WRT relies on the Web interface for configuration. It is one of the most
    complete Web interfaces, allowing you to change and configure all aspects of your
    WRT54AG.


    +   - Changing VLANs and adjusting radio transmit power is easy in the configuration
    screens. Changing the VLAN assignment of a port is as easy as manipulating checkboxes
    in the Web interface.


    +   - The command-line interface to DD-WRT is somewhat limited; however, for certain
    tasks (such as enabling the JJFS file system), you will need to use the command
    line.


    # # Securing Your Firmware


    +   - The first step to securing your firmware is to use Nmap to detect the services
    available from the network (open ports).


    +   - Whenever possible, disable insecure plain-text management services such
    as HTTP and Telnet and replace them with their more secure, encrypted equivalents
    such as HTTPS and SSH. Disable any unused services that listen on a network interface.


    ![](img/41991837f74596e7c29a2498b6ec56e8_171_0.png)'
