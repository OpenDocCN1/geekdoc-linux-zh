  md: '+   • WAN port The WAN port, as it is labeled on the outside of the router,
    is assigned to VLAN1 and its internal port assignment is 4. When you plug your
    cable modem into this port, it will typically pull a Dynamic Host Configuration
    Protocol (DHCP) address from your Internet service provider (ISP). Because the
    WAN port and all LAN assigned ports are on separate VLANs, they act as two physically
    separate networks linked by the WRT54G routing capabilities. The firewall prevents
    traffic flowing from the WAN network to the LAN network by default, but allows
    all traffic initiated from the LAN to exit via the WAN port.


    # Antenna Connectors


    One of the common features of all WRT54G models (with the exception of the WRT54SLGS,
    which does not feature a removable antenna) is the external antenna connectors.
    Shown in Figure 1.7 without antennas connected, this connector is referred to
    as an RP-TNC Polarity–Threaded Neiled Non-Celcon, named after its creators).This
    connection type is standard for use in 802.11 wireless networking.


    # Figure 1.7 RP-TNC Antenna Connector from a WRT54G


    ![](img/41991837f74596e7c29a2498b6ec56e8_30_0.png)


    The RP-TNC connector allows you to easily upgrade antennas, or replace damaged
    antennas, simply by unscrewing the existing ones and screwing on new ones. Many
    add-on antenna options are on the market that will increase gain; see Chapter
    7 for more information.


    # Determining Your Hardware Version


