    # # Attaching Your WRT54G to Your Laptop


    By far, attaching your WRT54G to your laptop is the easiest hardware hack in this
    book, and can certainly be helpful. In many of the applications used in this book,
    it can be very helpful to either go mobile with your router, take up less room
    during use, or give us free hand while on the move. Clearly, from our power hacks,
    we should even be able to power our WRT54G from the laptop itself.


    # # Component Needed for This Hack


    This hack requires an additional component that is not provided standard with
    any WRT54G model. The additional component required is:


    +   - Industrial-strength Velcro, or other hook and loop fastener


    # # The Hack


    This book is about hacking the WRT54G series of routers, and successfully voiding
    those warranties, so that is where we will focus our direction. Given the vast
    differences in laptops, we won''t actually be hacking the laptop, not to mention
    keeping the laptop warranty intact!


    The easiest way we have discovered to attach a WRT54G to a laptop is industrial-strength,
    self-adhesive Velcro (or hook and fasteners), obtained from a local home improvement
    store.Thissolution is completely reversible, and “temporarily permanent”: It will
    perform the task at hand, and keep you from disassembling your laptop!


    ![](img/41991837f74596e7c29a2498b6ec56e8_335_0.png)'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# WRT54G Hardware Hacking • Chapter 7


    The best place to attach the Velcro on the WRT54G is the underside of the feet,
    which will likely provide the largest surface area. The black rubber inserts on
    the bottom of the feet are removable with a little bit of prying. Frankly, you
    can use them to trace a pattern on the Velcro for both the hook and the loop halves.
    You can also cut Velcro with a pair of scissors to the appropriate size. Figure
    7.44 shows the rubber foot pattern we made out of Velcro.


    # Figure 7.44 Rubber Foot and Velcro Cutout


    ![](img/41991837f74596e7c29a2498b6ec56e8_336_0.png)


    Next, separate the protective paper from the hook (rough) portions of the Velcro,
    and apply them to the underside of the feet of the WRT54G. In order to eliminate
    any problems with lining up the hook (soft) part of the Velcro on the laptop,
    apply the loop portion to the hook portion already attached to the feet. Peel
    off the protective paper from all loop portions, line them up to the backside
    of the laptop screen, and affix away! Apply gentle pressure to ensure proper contact
    to the laptop. Figure 7.45 shows the results.


    > WARNING

    Applying too much pressure to the back of your laptop can crack the LCD panel
    inside, rendering the screen useless. Be careful!

    Also, note the appropriate placement of the WRT54G so that it does not interfere
    with the operation of the display hinge. Mounting the router too low can interfere
    with obtaining an appropriate view of the laptop screen.


    Once you have mounted the WRT54G to your laptop, you can power it via alternative
    sources, go mobile, and still have two hands to type with, or wield various antennas.'
