  md: '# Summary


    The WRT54G platform can be an invaluable tool for a penetration tester by providing
    alternative connection methods to a remote network to perform testing without
    having to travel. VPNs can be used to tunnel traffic for various purposes, such
    as remote sniffing. For creating a backdoor into a network, a CDMA connection
    is most useful, allowing you to bypass the local network for remote connectivity.


    You use WRT54G routers to remotely monitor the wireless spectrum and Bluetooth
    traffic. These services will allow you to troubleshoot user problems, detect rogue
    devices, and monitor for vulnerable Bluetooth devices such as cell phones, which
    may contain sensitive information.


    Finally, you can use Airsn Rogue Squadron to create fake hotspots for use in a
    penetration test, or just to have a little fun with friends.


    # Solutions Fast Track


    # Tunneling and VPN


    +   - OpenVPN is a great open source project that can provide a routed or bridge
    VPN connection using SSL/TLS tunnels.

    - OpenVPN requires that you have a CA to generate certificates for clients and
    servers.

    - There are limitations when using OpenVPN for remote penetration testing. Namely,
    in order to provide a true bridge between the client side and the penetration
    tester’s site, you need to put the OpenVPN server at the client site in order
    to have full access to all systems available.


    # Wireless Security Tools Using OpenWrt


    +   - A Kismet Drone is useful for locating access points and determining information
    about the wireless environment.

    - Channel hopping is not supported in the wireless chipset, but a shell script
    can do the channel hopping instead.

    - In order to connect to the Kismet Drone on the WAN port, you must modify the
    firewall ruleset.

    - Modification of an inexpensive USB Bluetooth dongle can provide long-range Bluetooth
    scanning.

    - The BlueZ utilities have been ported to OpenWrt, and they can provide basic
    Bluetooth discovery.

    - With some scripting, you can perform continuous Bluetooth scans and e-mail them
    off-site for further analysis.'
  merge: -1
