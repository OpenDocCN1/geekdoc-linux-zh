    # Powering Your WRT54G with Alternative Sources


    Powering WRT54G with an alternative power source can have several advantages.You
    can carry your device in a backpack for covert testing, perform untethered wireless
    testing, or use the device where wall power is not readily.The possibilities are
    endless!


    In terms of consumer use, the WRT54G is intended to be installed with a hardwired
    power connectiondelivered the included "wall wart" power adapter. The included
    power adapter operates at 12 volts at 1 amp.Because these relatively modest power
    requirements, you can power the WRT54G with a battery, which also produces DC
    power.


    # Components Needed for This Hack


    This requires a few additional components that are provided standard with any
    WRT54G model. Not all of the parts listed are required for each hack, but rather
    are specific to the method selected. The additional components required are:


    +   - Appropriately sized wire

    - N-type power connector

    - Batteries (dependent upon method)

    - Battery holder that holds AA batteries

    - 9 volt battery connector

    - USB connector or USB cable

    - FireWire connector or FireWire cable

    - Solar panel (optional)

    - Automotive 12 volt to USB power converter

    - CAT 5 solid core network cable

    - CAT 5 jacks

    - CAT 5 jack housings

    - N-type power receptacle'
