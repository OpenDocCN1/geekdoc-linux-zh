  md: '# Using the Serial Port under OpenWrt


    In order to utilize our serial ports for a device under OpenWrt, we need to make
    sure we have installed the serial package. Again, by the fantastic package management
    under OpenWrt, we can issue the following commands in an SSH session on our Internet-connected
    device to install the serial package:


    ```

    # ipkg update

    # ipkg install setserial

    ```


    By default, the serial ports are enabled at 115200 baud, N 8 1. Many serial devices
    that we want to install will not support this speed. We can adjust this by using
    the stty utility using the following commands, which will download the stty package,
    extract it, and place it in an appropriate location:


    ```

    # cd /usr/sbin

    # wget http://tobe.mine.nu/software/openwrt/stty.tgz

    # tar -zxvf stty.tgz

    # chmod 755 stty

    ```


    In order to use a device on /dev/tts/1, we need to assign an interrupt request
    line (IRQ) to our serial port. We do not need to perform this on /dev/tts/0, as
    it has already been done in order to enable terminal output. We accomplish this
    by executing:


    ```

    # setserial /dev/tts/1 irq 3

    ```


    Now we can successfully set the speed of /dev/tts/1 to 4,800 baud using the stty
    command -F /dev/tts/1 raw 4800, and we can perform the same task for /dev/tts/0
    if we want with stty -F /dev/tts/0 raw speed 4800.


    At this state they are not permanent, and will not survive a reboot. In order
    to have them effect we create the /etc/init.d/S91serial file using. The contents
    of S91serial be as follows:


    ```

    /usr/sbin/setserial /dev/tts/1 irq 3

    /usr/sbin/setserial -F /dev/tts/0 raw speed 4800

    /usr/sbin/setserial -F /dev/tts/1 raw speed 4800

    ```


    After saving the file, we need to make sure it is executable at boot


    ```

    # chmod 755 /etc/init.d/S91serial

    ```


    # JTAG


    Another port to install in a WRT54G the JTAG port. The JTAG port will provide
    direct access to the basic input/output system (BIOS) of the WRT54G. This connection
    will be extremely helpful in recovering a bricked WRT54G, a process that we will
    describe in Chapter 8.The JTAG port will typically be used only for troubleshooting
    and recovery purposes, so it may not be needed every installation. The JTAG port
    is the safest method to recover from a bad flash, or to revive a bricked router,
    so in some cases, we may not have a choice.'
