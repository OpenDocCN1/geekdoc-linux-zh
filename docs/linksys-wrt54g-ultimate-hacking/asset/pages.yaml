  md: '# Working with WRT54G Firmware - Chapter 2


    acceptable operating range of the wireless chipset. It is possible to provide
    a manual setting for the transmit power by selecting Manual from the drop-down
    box, and defining the desired transmit power value in the provided field. The
    maximum manual setting acceptable to the firmware is 251mW, and the Web management
    interface will reject any value over that.


    In addition to adjust the transmit power, HyperWRT unlocks the use of all 14 available
    wireless channels, 1–11 for the United States, the addition of channels of 12
    and 13 for Europe, and channel 14 for Japan, as we indicate in Chapter 6. .


    > WARNING

    HyperWRT does not restrict channels you can use in a particular region. Be aware
    that in certain locations, it may be against country, government, or federal regulations
    to use certain channels. For example, in the United States it is against FCC regulations
    to use channels 12, 13, and 14. HyperWRT unlocks these additional channels, so
    please be mindful of which channels are legal for your area.


    In addition to the previous adjustments, HyperWRT provides a significant upgrade
    to the default Linksys port forwarding and game definition settings of the firewall,
    by providing several more line items for available settings. Additionally, HyperWRT
    provides more robust QoS for defined applications, and allows for custom definitions.
    QoS is important to time-sensitive applications, such as online games, and voice
    applications such as Skype and VoIP, QoS can allow for this type of application
    to be identified, and can ensure that network traffic receives priority over any
    other network traffic.


    One unusual feature that is included in HyperWRT and is useful for remote management
    is Wake On Lan (WOL) capabilities, as shown in Figure 2.23.


    # Figure 2.23 HyperWRT Wake On Lan Settings


