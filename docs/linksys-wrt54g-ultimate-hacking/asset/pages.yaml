  md: '# Chapter 1 • WRT54G Fundamentals


    # Average User


    The average user of the WRT54G is someone whose primary usage is to check email
    and browse the Web. Such users have only one computer—or two if there is a laptop
    in use. A laptop may also be the primary computer. They may require one Ethernet
    port for the home PC which will plug in directly. Wireless may also be required
    for the laptop, which will connect via the interface. The network may look as
    shown in Figure 1.21.


    # Figure 1.21 Average User Network Layout


    ![](img/41991837f74596e7c29a2498b6ec56e8_57_0.png)


    # Recommended Models


    We recommend that users purchase the off-the-shelf, standard Linksys WRT54G, version
    5.0, or of 7.0. This device will serve as a firewall, protecting the home PC and/or
    laptop from the Internet. It will also serve as the DHCP server, providing IP
    addresses for the one or two systems that are connected to it. The wireless network
    server should, configured with WPA-PSK or, preferably, WPA2-PSK (if the client
    wireless card and driver support it) to provide adequate security.


    > Notes from the Underground...

