    # Disabling Telnet


    Because you will be using SSH to log into the router, you do not need Telnet,
    even though it is configured to accept login requests, as shown here:


    ```

    pdc:~ login$ telnet wrt-hacker

    Trying 192.168.1.85...

    Connected to wrt-hacker

    Escape character is ''^]''

    Login failed.

    Connection closed by foreign host.

    ```


    The preceding code could be an attack if an attacker were to uncover a remote
    buffer overflow in the Telnet service (besides, if you are using this in an environment
    that has ever succumbed to an IT audit, having Telnet enabled will not help make
    you friends with your local auditor). To disable it, do the following:


    ```

    # cd /etc/init.d

    # mv S50telnet disabled_s50telnet

    # chmod -x disabled_s50telnet

    ```


    Now reboot your router and verify that Telnet is disabled by going to any other
    host command line and entering telnet <router-ip-address>. Enabling SSH is not
    required because it comes by default the router is initially changed. The only
    SSH version provided by the OpenWrt SSH server is version 2.


    ![](img/41991837f74596e7c29a2498b6ec56e8_162_0.png)'
