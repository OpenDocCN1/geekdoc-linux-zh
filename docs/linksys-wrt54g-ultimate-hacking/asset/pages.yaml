    # Keeping Up-to-Date


    You must keep security up-to-date. This means each time you upgrade, you should
    follow the same steps as we outlined earlier, making certain that an upgrade did
    not enable any services that you do not need. However, how do you know whether
    your router needs an update? You could constantly monitor the Web site and look
    for updates; you could easily follow the announcement (and anyway, this is not
    terribly fetch). With the script that follows, your router will check for updated
