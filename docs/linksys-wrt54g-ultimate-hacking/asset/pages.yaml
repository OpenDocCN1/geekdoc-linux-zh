    \ WET bridge, we ran into problems and realized that an upgrade from RC5 to RC6\
    \ was the cause. The fix was to reinstall the NAS package as follows:\n\n```\n\
    # ipkg remove nas\n# ipkg install nas\n```\n\nWe found this in the OpenWrt forums,\
    \ which we highly recommend that you sign up and read on a regular basis. They\
    \ are very useful for troubleshooting problems with OpenWrt. The following forum\
    \ posting is what led us to the aforementioned solution: http://forum.openwrt.org/viewtopic.php?pid=38430.\
    \ The forum handle “mbm,” mentioned in this post, is Mike Baker, OpenWrt project\
    \ cofounder and leader developer. For more information about NAS, see http://wiki.openwrt.org/OpenWrtDocs/nas.\n\
    \nNext, follow this command to scan for other wireless networks to connect:\n\n\
    ```\n# wl scan ; sleep 1 ; wl scanresults\n```\n\nIn our example, we see a wireless\
