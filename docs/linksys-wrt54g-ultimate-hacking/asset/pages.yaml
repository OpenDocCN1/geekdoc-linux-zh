    # # Installing Firmware via TFTP


    In this section, you will learn how to upgrade firmware via TFTP, which will entail
    the following:


    +   - Understanding the WRT54G boot sequence

    - Resetting the WRT54G to factory defaults

    - Understanding boot_wait does and how to enable it

    - Applying firmware via TFTP in Linux, Windows, and OS X


    Aside from JTAG (covered next), installing your firmware images via TFTP (and
    does not require hardware modifications). In order to use this method, you must
    be able to access the TFTP process that is part of PMON (PROM Monitor/CFE (Common
    Firmware Environment)).

    When a WRT54G boots, the PMON (for WRT54G, versions 1.0 and 1.1) or CFE (for all
    versions 1.1) bootloader takes control of the boot process. The PMON/CFE is similar
    to a CMOS in PCs and Cisco routers, performing the basic functions upon device
    startup to get the operating system (which is referred to as *firmware*) loaded.
    The first things PMON/CFE does is check that the NVRAM partition exists. Whether
    it is a new NVRAM partition or an existing one, the bootloader then reads the
    boot_wait parameter. If it is set to on, the TFTP server waits for incoming connections
    for the specified period of time. It will perform a cyclic redundancy check (CRC).
    If the firmware is not corrupt, booting will proceed. If the firmware does not
    pass the CRC (i.e., it is corrupt), the bootloader will go into the wait state
    until new firmware is received via TFTP. Refer to Figure 2.4 for a graphical representation
    of the boot process.


    In the wait state, a result of boot_wait being enabled or corrupt firmware, the
    router has a few things to get itself on the network and provide a TFTP server:


    +   - The PMON/CFE loads a very limited IP stack, which does two things. First,
    it responds to ARP requests for 192.168.1.1 and listens for ARP broadcasts. This
    will also respond to Internet Control Message Protocol (ICMP) ping echoes.

    - The PMON/CFE starts the TFTP server with no password. This is very different
    from the TFTP server that is available when the router is booted normally. In
    fact, many people get confused between the two, and try to upload firmware when
    the router is booted normally and they are stunned by the password.


    ![](img/41991837f74596e7c29a2498b6ec56e8_76_0.png)'
