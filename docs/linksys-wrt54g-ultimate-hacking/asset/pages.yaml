  md: '# Chapter 5 • Securing Wireless Using a WRT54G


    be cracked in a few hours or less! The precalculated dictionaries and associated
    files have been made available as a torrent download. For more information, see
    the Church of WiFi’s site regarding the release, at www.churchofwifi.org/Project_Display.asp?PID=90.
    Be warned that the entire tables download is just more than 8 GB!


    This release clearly indicates how important it is, when using WPS, to pick a
    unique SSID and a very complex key. It will make this attack very time-consuming.
    It is also a good idea to change your SSID so often, as this will help thwart
    repeated attempts to compromise the shared key.


    # Configuring WPA-PSK (and WPA2-PSK)


    The easiest way to begin to provide a more secure wireless connection is to use
    WPA. To do so, we need to have clients support WPA to connect to our WRT54G. In
    this section, we will configure WPA over OpenWrt, which will require command-line
    access to set our WRT54G,


    Before we can get set up WPA (including WPA-PSK or WPA-Enterprise) we must first
    install the nas package. The nas package contains the Broadcom proprietary utility
    that is used to set up the encryption for the WPA and WPA connections. We’ll also
    need to be sure that our package repository is up-to-date before we install the
    nas package, by issuing the two commands:


    ```

    # ipkg update

    # ipkg install nas

    ```


    As part of the installation, the nas package will create a startup script, /etc/init.d/S41wpa,
    which passes the NVRAM variables that we set to the nas. Although we should not
    need to modify this script under normal circumstances, when nas fails to start
    on boot, this script is a good place to investigate to determine the cause of
    the failure.


    In order to define our WPA type, we need to set an NVRAM variable to a setting
    for ours. For WPA-PSK, we need to set wl0_akm to psk:


    ```

    # nvram set wl0_akm="psk"

    ```


    > Note

    To avoid conflicts and potential problems it is best to disable WEP before using
    WPA. You can do this easily by issuing the command nvram set wl0_wep="disabled"
    and then committing the NVRAM settings using the nvram commit and reloading the
    wireless settings using the lsbin/wifi command.


    For WPA2-PSK, we need to set wl0_akm to psk2:


    ```

    # nvram set wl0_akm="psk2"

    ```'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Securing Wireless Using a WRT54G • Chapter 25


    # NOTE


    > If you set wlo0_akm to any value, it will override WEP settings, regardless
    of what you set wlo0_wep to. This will effectively override wlo0_wep.


    We also need to set an NVRAM variable with the encryption type for the WPA/WPA2
    network. We have three choices: tkip, aes, and tkip+aes. You will want to choose
    the encryption type that is best for your environment, and is the minimum supported
    by all of your wireless clients. For example, we use AES:


    ```

    # nvram set wlo0_crypto=aes

    ```


    # NOTE


    Although the aes and tkip+aes settings may be slightly more secure, the crypto-graphic
    functions that utilize AES will put an increased load on the WRT54G processor.
    In environments with large numbers of wireless clients connected to the same WRT54G,
    using aes or tkip+aes may introduce significant wireless speed deficiencies. With
    AES and many connected clients, the processor will spend more time performing
    cryptographic functions instead of processing network traffic.


    The use of tkip will increase wireless speed with a large number of wireless clients,
    as the processing requirements for Temporary Key Integrity Protocol (TKIP) are
    reduced.


    The second and final step to the PSK configuration is to set the preshare key
    on the router that we will utilize on all of the connected clients. The key we
    pick must be between eight and 63 characters long and can contain letters, numbers,
    and special characters. In order to counteract the dictionary attacks mentioned
    before using coWParty, it is recommended that we use a preshare key of more than
    20 characters. Once we select it, we will set the key for either WPA or WPA2 on
    the router with the following commands:


    ```

    # nvram set wlo0_wpa_ps="haxorthematrix.com!"

    ```


    ![](img/41991837f74596e7c29a2498b6ec56e8_222_0.png)


    TIP You can find a great place to generate preshared keys with maximum entropy
    (randomness) on Steve Gibson''s Web site, at www.grc.com/passwords.


    ![](img/41991837f74596e7c29a2498b6ec56e8_222_1.png)'
  merge: -1
