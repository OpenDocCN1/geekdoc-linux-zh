- img_proc: true
  md: '# Chapter 5 • Securing Wireless Using a WRT54G


    In order to complete our WPA-PSK or WPA2-PSK setup, we need to save our NVRAM
    changes. If we do not change, the changes will not survive a reboot. We can save
    the changes with the following-command:


    ```

    # nvram commit

    ```


    If we want our settings to take effect immediately, we can execute the nas startup
    script manually with the following command:


    ```

    # /etc/init.d/S41wpa

    ```


    Alternatively, we can reboot our router. Upon restart, our selected WPA/WPA2 preshared
    key will be available for wireless clients.


    ![](img/41991837f74596e7c29a2498b6ec56e8_223_0.png)


    As we have experienced already, there are many configuration options for wireless
    settings, and wireless security settings, on your WRT54G running OpenWrt. The
    nvram command line is very powerful, but it does not provide you with an easy
    way to take a snapshot of the current wireless settings on your router. Thanks
    to Raul Siles, and a handy little shell script, this task is now greatly simplified.


    The script is currently hosted at You can obtain it by issuing the following commands:


    ```

    root@openvpn:-# wget http://www.wrt54ghacks.com/whiterussian/wifi_info.sh

    Connecting to www.wrt54ghacks.com[213.194.149.156]:80

    wifi_info.sh                               100%

    |****************************************************| 3778      00:00

    ETA

    ```


    Once downloaded, we can then change the permissions and execute:


    ```

    root@openvpn:-# chmod +x wifi_info.sh

    root@openvpn:-# ./wifi_info.sh


    [ OpenWrt versions ]

    - OpenWrt: WHITE RUSSIAN (0.9)

    - Busybox: BusyBox v1.00 (2007.01.30-11:42+0000) multi-call binary

    - NAS: nas -3.90.37-17 - Proprietary Broadcom WPA

    - Authenticator/Supplicant

    ```'
