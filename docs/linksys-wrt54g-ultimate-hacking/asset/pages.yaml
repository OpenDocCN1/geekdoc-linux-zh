    # Who Should Use This Firmware


    Ewrt is clearly built for those looking to operate internet service as part of
    a business or social offering. Ewrt is very good at providing solutions in an
    almost turnkey fashion. Ewrt is highly recommended for these types of deployments,
    when you do not want to build the entire infrastructure from scratch. We will
    use Ewrt for two projects in this book: one in Chapter 4, where we will set up
    a self-contained WPA-Enterprise wireless network, and again in Chapter 6, where
    we will use Ewrt-based firmware to create a captive portal that allows all usernames
    and passwords.


    # Other Firmware Worth Mentioning


