  md: '# WRT54G, Version 2.2


    Version 2.2 of the WRT54G sports the first appearance of the BCM5325 chipset for
    the Ethernet MAC. It also uses Hynix memory, which will become standard on most
    model WRT54Gs from this version forward. Table 1.6 lists the specifications of
    the WRT54G, version 2.2


    # Table 1.6 Specifications of the WRT54G, Version 2.2


    | CPU Speed | 200 MHz |

    | RAM | 16 MB |

    | Flash | 4 MB |

    | Serial number prefix | CDF07 |


    > Attention, owners of WRT54G version 2.2 model routers: Linksys shipped this
    version and advertised as having 16 MB of RAM. However, the memory chips inside
    are IS42S16800A-7T, which support 32 MB of RAM. Although this is not an officially
    supported configuration, many people have reported that they have successfully
    enabled the other 16 MB of RAM (after all, the word hacking is in the title of
    this book). If you have this particular version, we recommend that you verify
    the model number on the RAM chip, and if it matches IS42S16800A-7T, you can use
    the following nvram commands to enable the extra memory:

    ```

    vram set sdram_init=0x0008

    vram set sdram_ncd=0x0000

    vram commit

    reboot

    ```


    You can verify that the memory is being recognized with the following command
    (note the MemTotal line, which should be about 2 MB less than the actual total):

    # cat /proc/meminfo

    total: used: free: shared: buffers: cached:

