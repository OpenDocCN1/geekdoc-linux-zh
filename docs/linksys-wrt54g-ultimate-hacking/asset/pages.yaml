    \nBy running this script manually, you can verify that everything is working properly,\
    \ and that you receive e-mail.\n\n> You can also download this script with wget\
    \ http://www.wrt54hacks.com/whiterusian/ppp-ip.sh, and copy it to the appropriate\
    \ location, /usr/bin.\n\nYou will also need to set this script to execute at startup,\
    \ as will be the first time that the interface is activated.You can have your\
