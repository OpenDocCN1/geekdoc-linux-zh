- img_proc: true
  md: '# Configuring Asterisk


    Configuring Asterisk can be a monumental task, given its complexity and highly
    configurable nature. Although we won''t be covering all of the options in this
    section, as it is beyond the scope of the book, we will lay the foundation for
    further customization. You can find more information on configuring all of the
    features of Asterisk at www.asterisk.org/support.


    # Configuring modules.conf


    We need to begin by modifying a few of the configuration files located in /etc/asterisk.
    The first one we need to modify modules.conf, which instructs Asterisk which modules
    to load at startup. Obviously, the more modules you load at startup, the greater
    the impact on your memory usage. With limited RAM on the WRT54G device, you need
    to make some cautious decisions about which modules you use.


    The default modules.conf is an excellent start; you can, and should, remove a
    few modules from the default startup. Asterisk has two methods for loading modules:


    +   - Specify autoload=yes in the [modules] section of modules.conf, and Asterisk
    will load all modules in the Asterisk directory as specified in asterisk.conf
    (the astmoddir directory which is set to /usr/lib/asterisk by default), unless
    they are specified as a no own option, which will not load the specified module.


    +   - Specify autoload=no in the [modules] section of modules.conf, and Asterisk
    will load only the modules specified with the load option.


    By default, Asterisk uses the autoload=yes option, so that is the method we will
    describe here. You should add the following line to modules.conf with autoload=yes,
    in order to disable the module and save space on systems:

    nolad => res__micsisonhold


    At this time, you do not have any music copied to the WRT54G, and due to limited
    space, it is not recommended that you use the WRT54G as a music repository.You
    could provide music at an alternative location, such as a Server Message Block
    (SMB) or SD memory card. Please see Chapters 3 and 7 for more information on configuring
    SMB shares and SD cards.


    Additionally, in our example, we are using only a limited set of audio codecs
    and connection types, we will leave only the ones we need (in our case, Session
    Initiation Protocol [SIP] and ulaw). This will reduce our memory footprint, by
    removing these modules. However, your needs may vary depending on your VoIP provider,
    or on your client capabilities.


    We should remove these modules, chan_iax2.so,format_wav.so, and format_wav_gsm.so
    (for iax2 and audio conversions), for our example, we do not need them:


    ```

    nolad => chan_iax2.so

    nolad => format_wav.so

    nolad => format_wav_gsm.so

    ```


    We also need to be very careful about the codecs that we use with our SIP (or
    other) clients, such as iLibC. These particular codecs can use a significant amount
    of processor horsepower, and we'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 4 • WRT54G Fun Projects


    require a dedicated math processor. You may recall from Chapter 1 that none of
    the WRT54G models is terribly powerful, as none of the processors contains dedicated
    math processing. As a result, using these codecs will result in poor to no call
    quality.


    # Configuring VoIP Provider Connectivity


    Next, we will configure WRT54G to connect to a SIP provider on the Internet so
    that we can start to make calls with phones attached to our local Asterisk installation.
    Although there are several methods for connecting to various VoIP providers, the
    we have elected to use in this example, BroadVoice (www.broadvoice.com), allows
    for only SIP connections.


    ![](img/41991837f74596e7c29a2498b6ec56e8_203_0.png)


    # Choosing a VoIP Provider


    Due to the rise in popularity of Internet-based VoIP solutions, there has been
    a huge upswing in VoIP providers. As with many other industries, not all vendors
    are created equal. Take great care in selecting a VoIP provider!


    With a local Asterisk installation it is very important to make sure that the
    VoIP provider allows for and supports Bring Your Own Equipment (BYOE). Certainly
    one could select a provider that does not support Asterisk, but the labor required
    to figure out how to make the installation work may be considerable. Not just
    do the research upfront for a guaranteed solution! Additionally, some providers
    will not allow BYOE, and require that you purchase their equipment or purchase-limited,
    compatible equipment. This would defeat our purposes of running our own PBX on
    WRT54G.


    As with any technology purchase, it is good to read all of all the reviews, and
    do your research upfront. A great resource for selecting a VoIP provider that
    will allow BYOE and is to work with/or support Asterisk is http://voip-info.org.


    A great (and bad) thing about the market explosion of VoIP providers is consumer
    choice. Be sure to familiarize yourself with all of the plans and costs associated
    with each provider, and make sure they give you the correct plans for your needs.
    For example, many VoIP provide provide service at decent rates, and international
    rates as well; just be sure that the countries you want to call are listed for
    your provider of choice. Picking the wrong provider for your needs could result
    in even higher costs than your current Plain Old Telephone Service (POTS).


    > BroadVoice has provided some great installation instructions for use with Asterisk.
    Be sure to check your selected provider’s configuration instructions. With the
    instructions provided from BroadVoice, we will be utilizing SIP; but many other
    providers can utilize connection types, such as Global System for Mobile Communications
    (GSM) or Inter-Asterisk Exchange (IAX).


    www.singress.com'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# WRT54G Fun Projects • Chapter 4


    # NOTE


    Although different providers may use different connection types, essentially the
    requirements for connections are: a connection point, a username, and a password.
    The different connection types do require different configuration files to be
    modified. These configuration files are also located under /etc/asterisk/, and
    are named for the appropriate connection type, such as gsm.conf or iax.conf.


    In our example of BroadVoice, we will be modifying the sip.conf file located in
    /etc/asterisk. This file can be easily modified with vi. The first thing you need
    to do is update the sip.conf file to register your device with BroadVoice so that
    you may begin using your WRT54G to route calls. The registration is configured
    with a register directive, which can be located anywhere in the configuration
    file. We have elected our particular register directive in the section pertaining
    to registration to make it easier for us to find later.


    For BroadVoice, the *register* directive is as follows:


    ```

    register ==<VoIP Phone #>sip.broadvoice.com:<password>:<VoIP Phone \

    #=sip.broadvoice.com/666

    ```


    You need to replace a few items in the configuration directive to items provided
    by your VoIP provider, such as your phone number and password. There are two other
    items to note that are important with your registration configuration: sip.broadvoice.com
    and 666. sip.broadvoice.com does not refer to the actual DNS name, but to another
    section later in the SIP configuration file where you define more information
    about the connection type to BroadVoice. The 666 refers to a local VoIP phone
    attached to Aster Aster installation. We will also make a section later in our
    sip.conf file.


    This *register* [configuration section] sip.broadvoice.com/ should register its
    capabilities for extension 666. This will allow extension 666 to receive calls
    directly when a third party calls the VoIP number.


    Now we need to define additional configuration sections for additions for the
    two different connections: one for BroadVoice and one for our local 666.

    BroadVoice has provided some excellent configuration instructions; however, we
    have made a few changes to our BroadVoice connection. Here is the configuration
    we used. Replace items by your provider.


    ```

    [sip.broadvoice.com]

    type=peer

    user=phone

    host=sip.broadvoice.com

    fromdomain=sip.broadvoice.com

    fromuser=<VoIP Phone #>

    secret=<password>

    username=<VoIP Phone #>

    insecure=very

    ```


    ![](img/41991837f74596e7c29a2498b6ec56e8_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Chapter 4 • WRT54G Fun Projects


    ```

    context=from-broadvoice

    authname=<VoIP Phone #

    dtmmode=inbound

    dtmf=inbound

    disallow=all

    ;allow=gsm

    allow=ulaw

    ;Disable canreinvite if you are behind a NAT

    canreinvite=no

    ```


    In our configuration, we added the option disallow=all and commented out allow=gsm
    using a leading ; which defines the line as a comment. We elected this because
    our VoIP phone upports ulaw as a codec. When we perform conversion, it will require
    more processing power to convert from our local phone to BroadVoice, possibly
    reducing our call quality. Our local phone extension supports GSM, so we disabled
    it in order to make sure we are forcing ulaw.


    ![](img/41991837f74596e7c29a2498b6ec56e8_205_0.png)


    GSM requires significantly less bandwidth than ulaw, but unfortunately, BroadVoice
    does not support GSM connections. If at possible, use GSM when connecting to your
    VoIP provider, as the Internet connection that we could have limited bandwidth.
    The reduced traffic footprint of GSM will perform much better over an Internet
    connection, resulting in better call quality.

    The local connection to the VoIP phone, in many cases, will have a significantly
    faster connection to the Asterik installation than our connection to the Internet.
    As a result, we can use the higher-bandwidth codec (in this case, ulaw) between
    the two. This will require additional processing power by the WRT54G to perform
    the codec conversion, which is why we elected to match the connections with ulaw.


    You should also note that the [sip.broadvoice.com] section declaration is a match
    to what was used in the register directive we defined earlier.

    We also need to define the capabilities of our local phone extension 666 so that
    it can connect to our Asterisk installation. To accomplish that, we need to define
    an additional configuration section for our local VoIP phone:


    ```

    [666]

    ; X-Lite - Mac SoftPhone

    type=friend

    context=default

    host=dynamic

    dtmmode=rfc2833

    ```'
