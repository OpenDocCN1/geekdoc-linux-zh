    # SSH Server Security


    SSH is already a very secure protocol, but there are a few minor enhancements
    you can make to be certain you are using it properly. SSH supports public key
    cryptography for authentication and encryption, meaning that you have a public/private
    key pair, and your router has a public/private key pair. Let''s create this key
    for accessing our routers.


    First, create a public key on the host from which you will be managing your router:


    ```

    paulda@bud:-$ ssh-keygen -t dsa

    Generating public/private key pair.

    Enter file in which to save the key (/home/paulda/.ssh/id_dsa):

    Enter passphrase (empty for no passphrase):

    Enter same passphrase again:

    Your identification has been saved in /home/paulda/.ssh/id_dsa.

    Your public key has been saved in /home/paulda/.ssh/id_dsa.pub.

    The key fingerprint is:

    60:99:71:df:d3:b2:6e:52:32:bc:80:46:b6:ed:90 paulda@bud

    ```


    Copy the public key to the router:


    ```

    paulda@bud:-$ sc ~/.ssh/id_dsa.pub wrt-hacker:/tmp/

    root@192.168.1.85:password:

    id_dsa.pub 100% 597 0.6KB/s 00

    ```


    Create the authorized keys on the router:


    ```

    # cd /etc/dropbear/

    # cat /id*.pub >> authorized_keys

    # chmod 0600 authorized_keys

    ```


    Now you use SSH to the router, instead of asking you for your password, it will
    ask you for the passphrase protecting your private key:


    ```

    paulda@bud:-$ ssh wrt-hacker

    ```


    ```

    BusyBox v1.00 (2006.11.07-01:40+0000) Built-in shell (ash)

    ```


