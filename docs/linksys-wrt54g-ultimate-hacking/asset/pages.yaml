  md: '# 28 Chapter 6 • WRT54G for Penetration Testers


    Kismet Drone port instead of port 22 for SSH. Your final Port to WAN section should
    look like this:


    ```

    iptables -t nat -A prerouting -i $WAN -p tcp --dport 22 -j ACCEPT

    iptables -A input_rule -i $WAN -p tcp --dport 22 -j ACCEPT

    iptables -t nat -A prerouting_rule -i $WAN -p tcp --dport 3501 -j ACCEPT

    iptables -A input_rule -i $WAN -p tcp --dport 3501 -j ACCEPT

    ```


    OpenWrt uses iptables for a firewall, and it is highly configurable. Instruction
    on iptables is beyond the scope of this book, the Gentoo Linux wiki has a great
    resource at http://gentoo-wiki.com/HOWTO_iptables_for-bies. Additionally, you
    can find an online iptables rule generator at www.hideaway.net/iptables.


    These firewalls will be applied after a reboot, but you can make them active immediately
    by issuing the following command:


    ```

    # /etc/init.d/$s5firewall restart

    ```


    You can now have your non-WRT54G-based Kismet server connect to your WRT54G Kismet
    Drone. Configuring the Kismet server under various operating systems is beyond
    the scope of this book; you can find installation guides at www.kismetwireless.com.
    In order to have a Kismet server connect to a drone, you need to modify the Kismet
    server''s kismet.conf file to define it as a capture source. You can also define
    multiple drones, as shown in the following code. We''ll assume in this example
    that we have two WRT54G Kismet Drones with IP addresses of 192.168.1.110 and 192.168.1.220:


    ```

    source=kismet_drone,192.168.1.110:3501,drone1

    source=kismet_drone,192.168.1.220:3501,drone2

    ```


    Once you have made these changes, you can start up a Kismet client, either on
    your Kismet server installation or on a separate PC, and connect to the drone
    over the network. Figure 6.4 shows an example.'
