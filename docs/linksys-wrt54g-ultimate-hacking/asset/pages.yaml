  md: '# Tools & Traps...


    # Stale ARP Caches and TFTP Usernames/Passwords


    Because of the way in which the PMON/CFE handles limited network connectivity
    during the boot process, you may want to either clear your ARP cache or set a
    static ARP entry. When in the wait state, the router will answer for ARP requests
    to 192.168.1.1, regardless of the IP address configured. However, if you are on
    a system that has an existing entry for 192.168.1.1, your packets will never get
    to the router. In order to solve this problem, you can clear your ARP cache using
    the following command, which works on Linux, OS X, and Windows:


    ```

    # arp -d 192.168.1.1

    ```


    Alternatively, you could set a static ARP entry. This would require that you note
    the Media Access Control (MAC) address on the bottom of the router and add the
    entry using your operating system''s arp command. For example, if the MAC address
    is 01:02:03:04:05:06, the command would look like this:


    ```

    # arp -s 01:02:03:04:05:06 192.168.1.1

    ```


    This will ensure that you have the appropriate ARP entry and that your new firmware
    gets copied over properly.

    Another common mistake is confusing the PMON/CFE TFTP server with the WRT54G operating
    system''s TFTP server. The PMON/CFE TFTP server does not require a password. The
    operating system''s TFTP server requires a username and password and has a different
    purpose. So, if you initiate the TFTP process and you receive the error "Invalid
    Password", your router is not in the appropriate wait state and you should double-check
    all of your steps and possibly use the JTAG method covered in Chapter 8.


    Some other interesting notes about the boot process are that the kernel will protect
    the PMON/CFE bootloader by not allowing anyone to write to it. This will prevent
    the router from becoming corrupt. Also, you can exploit the fact that an NVRAM
    partition will be created if one does not exist by wiping it and rebooting the
    router. Sometimes a brick is created when the firmware image is good; for example,
    you''ve rolled your own firmware that passes a CRC, but does not boot properly,
    or you''ve changed your NVRAM variables and rendered the device unusable. For
    complete coverage of these features see Chapter 8.'
