  md: '# Chapter 8 • Troubleshooting WRT54G


    Q: I asked a question on the OpenWrt IRC IRC channel, but no one responded. How
    come?


    A: Be certain to read the guidelines, “Getting help on IRC” (http://wiki.openwrt.org/irc),
    before posting to the channel. One of the most common problems is asking a question
    that has already been answered in the wiki or forums, so be certain to look there
    first before posting a question in IRC.


    Q: Someone answered my question in IRC, but I forget what the answer was. Is there
    a log?


    A: Yes, it is located at http://openwrt.org/logs.


    Q: Do the OpenWrt developers and the Sveasoft developers hate each other?


    A: Hate is a strong word, but you can read more about the situation here: http://openwrt.org/logs/openwrt-meets-sveasoft.'
