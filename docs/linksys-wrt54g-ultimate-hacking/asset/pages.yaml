  md: '# TFTP Installation Step by Step


    We have gone through many of the details surrounding TFTP installation, which
    we will use throughout this book. Completing the projects throughout this book
    will mean installing firmware on many different routers. We have found that the
    TFTP method is best suited for this task. To be certain that it is successful,
    here is a consolidated guide to installing firmware via TFTP in a WRT54G:


    +   1. Locate and download the third-party firmware image to the be used in the
    upgrade process. Verify the MD5 checksum to be certain that the image is not corrupt.

    2. Connect the computer and WRT54G to a reliable power source.

    3. Connect the computer to the WRT54G with a reliable Ethernet cable. Verify the
    link lights on the computer (if available, they are solid green) and the WRT54G.
    The LED associated with that port should be solid green and flashing when there
    is activity.

    4. Assign a static IP address to the computer in the 192.168.1.0/24 subnet (e.g.,
    192.168.1.10/24, or anything that is not 192.168.1.1 and a valid IP address) and
    disable any DHCP client the host in accordance with the operating system instructions.

    5. To ensure there are no stale ARP entries, remove the entry for 192.168.1.1
    by issuing the command `arp -d 192.168.1.1`.This command should work in OS X,
    Linux, and Windows; refer to your operating system-documentation for more details.

    6. On the computer, if you are using Linux or OS X, issue the appropriate TFTP
    commands outlined in the preceding sections, being certain to use 192.168.1.1
    as the destination. Do not yet send the image (via the TFTP put command) to the
    WRT54G.

    7. Unplug the WRT54G from its power source.

    8. Send the firmware image via TFTP. For Linux and OS X, run the TFTP `put` command.
    Windows, use the `tftp` command.

    9. Plug the power source back into the router, making sure that you do not unplug
    the router while the TFTP transfer is taking place or in the time thereafter.

    10. Once the firmware transfer completes, the router will then reboot on and you
    will be able to ping it (using the command `ping 192.168.1.1`).


    # Installing Firmware via JTAG


    Firmware installation via the JTAG connector is not recommended for the faint
    of heart, nor for standard installations. Ideally, the only time you would ever
    want to install firmware via JTAG is when you have totally hollowed out your WRT54G.
    We discuss the construction of an unbuffered JTAG cable for your WRT54G in Chapter
    7. We also discuss the use of the unbuffered JTAG cable and the HairyDairyMaid
    WRT54G Debrick Utility in Chapter 8.'
