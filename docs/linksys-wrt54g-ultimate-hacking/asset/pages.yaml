  md: '# Chapter 2 • Working with WRT54G Firmware


    In order to begin using FairuzaWRT you will need to connect to the WRT54G via
    Telnet the first time. Using your favorite Telnet client, connecting to the WRT54G
    via Ethernet cable to any of the LAN ports. Upon connecting, you will be placed
    at the command line, as indicated in Figure 2.17.


    # Figure 2.17 First-Time Telnet Login to FairuzaWRT


    ![](img/41991837f74596e7c29a2498b6ec56e8_107_0.png)


    When connect to a FairuzaWRT installation for the first time via Telnet, you should
    note that you are never asked for a username and password in the same manner as
    OpenWRT. You must follow the same process for FairuzaWRT with regard to setting
    the initial password. This means you must Telnet to the device, set a password
    using the `passwd` command, and exit.


    You now SSH with your favorite SSH client. Begin by connecting your computer via
    Ethernet cable to any LAN port on the WRT54G. After obtaining a DHCP address from
    the FairuzaWRT WRT54G, connect to the default internal IP address. For example,
    under most UNIX/Linux distributions and Mac OS X, `ssh root@192.168.1.1` at the
    command prompt.'
