  md: '# Figure 1.1 Overview of the WRT54GL Hardware Components


    ![](img/41991837f74596e7c29a2498b6ec56e8_22_0.png)


    # Power


    Aside from WRT54G, version 1.0, all power requirements are the same, using 12V
    DC 1.0A.The power requirements are standard for embedded devices and wireless
    access points, making them compatible with Power over Ethernet (POE). We will
    cover “power supply hacking” in greater detail in Chapter 7, where we will show
    you how to make a battery pack for your WRT54G devices, which you will need if
    you want to take advantage of the WRT54G’s capabilities in mobile scenarios such
    as war-driving activities.


    # The Reset Button


    This button, will reset the device to factory defaults. It is programmable and
    has many different uses, depending on when and how long you press it, which router
    version you are, and which firmware you are running. You will need a small instrument
    (such as a ballpoint pen) to press this button. Be careful not to press it by
    accident, because doing so could cause the device to reboot or could reset the
    router’s settings. We discuss the use of the Reset button in depth in Chapter
    8.


    # LED


    The LED lights differ on the various models, and combinations of the LED light
    states indicate different conditions. Figure 1.2 depicts the most common configuration
    of LEDs on a WRT54G.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 1 • WRT54G Fundamentals


    # Figure 1.2 WRT54G Front Panel LEDs


    ![](img/41991837f74596e7c29a2498b6ec56e8_23_0.png)


    The Power light indicates whether the device is receiving power. This light will
    be a solid green when the device is booting, or when you''re applying new firmware,
    the Power light will typically flash. DMZ light usage varies among different firmware.
    For example, OpenWrt uses it to indicate progress in the boot process. The WLAN
    LED and the Ethernet numbered 1-4 are activity lights, and a solid green when
    connected and a flashing green when indicating activity. The solid green when
    a connection is made and a flashing green to indicate activity. Once you success-fully
    installed third-party firmware on your device, you will be able to manipulate
    the LED status by simply changing values in the contents files of system.


    # Secure Easy Setup


    The button in Figure 1.2 labeled "Cisco Systems" (yes, the Cisco logo on the left-hand
    side of the front panel is a button) is referred to as the Secure Easy Setup,
    or the CES setup, or simply the SES button. The SES first appeared in WRT54G,
    version 1.1, and was originally intended to allow users to easily set up an encrypted
    wireless network, provided that they used hardware from vendors participating
    in the SecureEasySetup program (those vendors being Linksys, Gateway, and HP).
    Third-party firmware allows you to reprogram this button to do anything you want;
    for example, turn off the wireless interface or enable/disable a virtual private
    network (VPN).


    # NOTE


    SecureEasySetup is being replaced by a new standard developed by the Wi-Fi Alliance.
    Wi-Fi Protected Setup, or WPS (which is another acronym), was made available as
    an optional standard for wireless vendors to provide a push-button setup for encrypted
    wireless networks. WPS also adds the capability to provide a PIN number, instead
    of a physical button, the user would enter to enable the setup of a secure wireless
    network. The PIN number method will allow device manufacturers to enable WPS on
    older devices that do not provide a hardware facility for WPS. For more information,
    see the Wi-Fi Alliance Web site at http://wi-fi.org.'
