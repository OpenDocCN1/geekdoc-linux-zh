- img_proc: true
  md: 'WRT54G Hardware Hacking • Chapter 7


    # Figure 7.35 WRT54G Power Regulation Chips


    ![](img/41991837f74596e7c29a2498b6ec56e8_324_0.png)


    Now that we know what our minimum power requirements are, we can begin to determine
    what other power sources we can use. We''ll want to use power sources that can
    deliver 5 volts DC with appropriate amperage.


    # Alkaline Batteries


    The first obvious choice for power is some readily available alkaline batteries.
    Most alkaline batteries output 1.5 volts, so whether we pick AAA, AA, C, or D
    cells, we will need to use a minimum of four batteries (for a total of 6 volts).
    In our alkaline battery example, we have elected to utilize eight AA batteries,
    as this will effectively double the length of operation time over the four-battery
    solution. In the eight AA battery configuration, we can expect to power a WRT54G
    with wireless enabled at the default power level for about four hours. The battery
    holder shown in Figure 7.36 was readily available from our local Radio Shack,
    which also featured a 9 volt battery style of connector.


    # Figure 7.36 AA Battery Pack and 9 Volt Adapter


    ![](img/41991837f74596e7c29a2498b6ec56e8_324_1.png)


    www.syngress.com'
  merge: -1
