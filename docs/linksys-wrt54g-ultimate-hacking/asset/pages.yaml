    the same time, and we have modified the AD233BK appropriately. We will be completing
    the installation only for /dev/tts/1; however, we can complete /dev/tts/0 at any
    time. You can find the instructions for adding /dev/tts/0 at Rod Whiby''s Web
    site, www.rwhitby.net/projects/wrt54g. We elected to implement only the /dev/tts/1
    option, as it is most easily used with a serial device, whereas the /dev/tts/2
    device is typically reserved for a serial console connection.


    When attaching the converter to the WRT54G, you''ll need to make sure that you
    pick an appropriate length of ribbon cable so that can mount the serial connector
    on the outside of the case. You will need to pick an appropriate mounting location
    as well. Your mounting location should be that the TTL to serial converter will
    not interfere with any of the other electronics, in order to prevent any shorts.


    One particularly good place to mount the serial port in the front panel, on the
    right-hand side. Due to the L-shaped nature of the system board, this location
    will not interfere with any other electronics.


    In other models, especially those that have full-size system boards, this front
    location may not be acceptable in the configuration that we have presented. With
    the WRT54GL model, we attached the serial pin header to the converter circuit
    board by utilizing some ribbon cable or appropriately sized wire. When adding
    a second serial port, there may be enough room to mount them side by side, or
    you could use the center of the casing.


    Installation of the converter is the same for each mounting location; the steps
    are the same, just the location is different. For the first step, outline the
    outside corner shielding of the serial port connector on the casing. If your serial
    connector has screw terminal standoffs, mark the appropriate locations for the
    mounting holes as well. After marking your location, use your rotary tool with
    a small grinding cut out of the hole. You can clean it with some medium-grade
    sandpaper and a small rounded file.


    In order to create the optional holes for the screw standoffs, you can use an
    appropriately sized drill in your rotary tool. A small pointed grinding stone
    can also be used, but will deliver less-precise results. Figure 7.27 shows our
    final product.'
