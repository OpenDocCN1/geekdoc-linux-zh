  md: '# Chapter 2 • Working with WRT54G Firmware


    Q: In what version of OpenWrt was a Web GUI introduced?


    A: The Web GUI was introduced in OpenWrt Whiterussian RC1, the initial release
    of Whiterussian.


    Q: OpenWrt supports two different systems: SQASHFS and JFF2. Which one should
    I use?


    A: SQASHFS is a read-only file system, whereas JFF2 is read-write. With regard
    to OpenWrt, the architecture has changed so that this decision is not necessary
    anymore.


    Q: What is the difference between OpenWrt and DD-WRT?


    A: OpenWrt is a full-featured operating system for the WRT54G platform (and many
    other devices). Its goal is to create a stable and extensible operating system
    for embedded devices that allows developers to easily create and modify code.
    DD-WRT uses OpenWrt as its foundation, with a heavy focus on providing the user
    with the best, most full-featured, graphical interface.


    Q: What is the name of the penetration testing firmware and why would I want to
    use it?


    A: FairizuWRT is the penetration testing software for the WRT54G routers, versions
    1.0–3.0.You can use this as a platform to perform penetration testing and wireless
    assessments. However, it''s best served as an example of just how extensible the
    OpenWrt development platform is, including creating your own package repository.


    Q: What if I just want to increase the radio transmit power of my WRT54G; which
    firmware should I choose?


    A: The HyperWRT firmware advertises itself as being developed specifically to
    allow users to increase the radio transmit power. However, if you are going to
    go through the trouble of putting third-party software on your router, use OpenWrt
    as you will then be able to take advantage of all the features and receive frequent
    software updates in addition to always being able to access the software repository.'
