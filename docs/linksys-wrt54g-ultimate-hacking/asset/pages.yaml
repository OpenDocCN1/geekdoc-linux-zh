  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: Will my WRT54G void my warranty?


    A: Definitely! Opening your WRT54G is going beyond the point of no return.


    Q: Which antenna should I use?


    A: You should use an omnidirectional antenna to increase your wireless footprint
    over a 360-degree area, such as an apartment, residence, or business. A directional
    antenna is better suited to long-range outdoor network-to-network connections,
    or for penetration testing applications.


    Q: Should I turn up my wireless power by increasing the milliwatt output of the
    WRT54G, or by adding different antennas with increased DB?


    A: Ideally, you should do a little of both by increasing power output (mW) and
    antenna gain (db) a little at a time. Too much power (or both) can actually degrade
    your wireless signal instead of making it better.


    Q: Why is there a difference in GPIO port selection for MMC/SD card installation?


    A: Most models of the WRT54G and WRT54GS have GPIO 5 available on the board, but
    it seems to be missing on the version 4.0 WRT54G and WRT54GL models, where GPIO
    2 is available instead.


    Q: How many serial ports can I add to a WRT54G?


    A: The WRT54G models have the capacity for two serial ports, and with some slight
    modification you can tweak the AD233BK single-port serial board to support two
    ports.


    Q: What else can I use the JTAG port for besides my broken router?


    A: In most cases, it will not be useful for any other purposes; however, you could
    it to do in-depth hardware debugging.


    Q: What is the minimum power requirement for powering a WRT54G?


    A: A WRT54G can be safely powered with a steady 5 volts DC at about 100mA. It
    may be possible to power one with less than 100mA, as a WRT54G typically draws
    over 30– 40mA under standard load.


    Q: Is the WRT54G compatible with 802.3af Power over Ethernet (PoE) standards?


    A: No, the WRT54G does not directly support any PoE specification, but you can
    use it with third-party PoE solutions that are either proprietary, homebrew, or
    802.3af standard devices.'
