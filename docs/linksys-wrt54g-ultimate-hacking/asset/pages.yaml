    # Power User


    A power user is someone who may have a desktop computer and a laptop, or even
    two desktop computers and a laptop. She uses the Internet to download music and
    movies (legally, of course) and to transfer large video files, and she allows
    others to use her system to the Web or use the Internet in some way at any given
    time. The power user may also use some sort of home media extender and have one
    or more video console systems.


    # Recommended Models


    For this setup, we recommend purchasing at least two WRT54GL series routers. Two
    routers will help to separate wireless traffic (and the associated processing
    required to perform encryption/decryption) from wired traffic. The WRT54GL also
    provides the option of upgrading firmware, which will allow for better performance
    on its own, and tuning, if necessary. Also, with third-party firmware, you will
    be able to utilize the VLAN features inside the router to separate traffic, and
    numerous other features to enhance your setup. Figure 1.22 shows what this setup
    may like.


    Figure 1.22 Power User Network Layout


    ![](img/41991837f74596e7c29a2498b6ec56e8_60_0.png)


    Figure 1.22 shows one WRT54GL, called "wrt-inet", connected via an Ethernet cable
    to the cable modem. This would connect to the WAN port on the WRT54GL. Connected
    to the LAN ports are the home computer and another WRT54G, labeled "wrt-ap". "wrt-ap"
    is placed on a separate VLAN from the home computer. This allows "wrt-ap" to provide
    wireless connectivity to the'
