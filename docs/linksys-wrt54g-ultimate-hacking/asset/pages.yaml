  md: '# Penetration Tester


    This is a relatively unused usage of the WRT54G series routers, and one we wish
    to explore throughout this book. The challenges presented to today''s penetration
    testers are much different from those of years ago, and we believe the WRT54G
    series routers can help. The WRT54G series routers with custom firmware allow
    you to deploy wireless access points to clear sites, sit behind the organization''s
    perimeter firewall, and act as a gateway for your attacks, sniff traffic off the
    wireless network, map the wireless network, map the internal wired network, and
    perform various other tasks to help with your assessments.


    # Recommended Models and Firmware


    As a penetration tester, the activities for which you may want to use your WRT54G
    require the most RAM and flash, so the WRT54GS model routers, versions 1.0 through
    3.0, are well suited to the task. Also, the WRTLS5G router has a good amount of
    RAM and flash, in addition to a USB port, so it can be more flexible and allow
    you to perform more remotely (analyze the 2.4 GHz spectrum, perform Bluetooth
    hacking, and even perform RFID analysis). The firmware recommended for this setup
    is OpenWrt, and from a security perspective, Fairuza-WRT.


    # Bargain Shopper


    You''re a bargain shopper if you want all the features and technology, but do
    not want to spend a dime more than you have. We may admire your type, and we purchase
    many WRT54G series routers and we are encouraging you, the reader, to do the same.


    # Recommended Models and Firmware


    If you''re after deals, the WRT54G model routers, versions 5.0, 6.0, and 7.0,
    seem to have the best price point. You can typically find them on sale, usually
    after a rebate, for $39. There are many ways to shop for deals on WRT54G series
    hardware. What follows is a list that will help you:


    +   - **Your local computer store** This can be a good place to look; pay attention
    to the Sunday paper advertisements.

    - **Online Web sites** Many online merchants carry all of the WRT54G series devices.
    Popular ones are www.amazon.com, www.buy.com, and www.newegg.com.

    - **eBay** is the best place to find older model (even internationally). Some
    even include the original box, with the best being an unopened package, proving
    the router has never been used. Other routers will cost more money, especially
    the WRT54G, versions 1.0 through 3.0, which are selling for around $80 at the
    time of this writing. If you plan to purchase WRT54G hardware on eBay, be certain
    to beware of eBay scans and use caution with any other author.

    - **Your local craigslist** craigslistlist (craigslist.org) is an online classified
    ads Web that will typically have listings in your area. The URL for your area
    would be <your city>.craigslist.org. For example, http://providence.craigslist.org
    is the Web site for this author''s local area (several people are selling Linksys
    routers at the time of this


