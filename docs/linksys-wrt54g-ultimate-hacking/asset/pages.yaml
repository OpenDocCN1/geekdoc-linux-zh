    Unlike the default Linksys firmware, OpenWrt allows you to be more flexible when
    it comes to the WRT54G functions on the network, and reassign ports and virtual
    LANs (VLANs) just as you would do one other enterprise switch. Figure 3.1 displays
    the default port layout.


    Figure 3.1 WRT54G 546L Default Port Assignments


