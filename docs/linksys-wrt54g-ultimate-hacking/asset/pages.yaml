  md: '# WRT54G Hardware Hacking • Chapter 7


    # Automotive Power


    Automotive power is typically derived from technology identical to that of lead
    acid battery power, usually delivering 12 volts DC at more adequate ampere. There
    are, however, some additional challenges with utilizing power from an automobile
    electrical system.


    The first challenge is ground interference by engine operation. This symptom often
    is indicated by a quiet whine while operating a radio. This whine will rise in
    pitch as the engine runs. Ground interference can be eliminated with some additional,
    expensive, electronics. The second challenge is some significant voltage fluctuation
    during operation. While starting the electronics, the voltage can drop as low
    as 8 volts, and while the vehicle is running the output typically is around 13.5
    volts.


    # WARNING


    > Attaching a WRT54G directly to your automotive electrical system without voltage
    regulation or isolation can render your router inoperable, and potentially damage
    it beyond repair.


    In order to overcome these challenges, we could build our own circuit to perform
    voltage stabilization and regulation. In true hacker fashion, we could also use
    technology in a manner for which it was not intended! In our example, we will
    utilize the knowledge learned from our USB power section to power our WRT54G connection.


    Many devices are powered by USB, and now there are plenty of cigarette lighter
    adapters that provide a USB power port. These USB power adapters, for whichever
    device they intended, must also overcome the same power issues that we must. In
    our example, we were able to obtain a cigarette lighter to USB power converter
    from an automotive kit to provide simultaneous power and sync capability to an
    older Palm organizer, shown in Figure 7.41, for just less than $10. We could not
    assemble the circuitry and adapters at the same cost.


    # Figure 7.41 Automotive USB Power Converter


    ![](img/41991837f74596e7c29a2498b6ec56e8_330_0.png)


    www.syngress.com'
  merge: -1
