- img_proc: true
  md: '# Chapter 3 • Using Third-Party Firmware


    Once you have downloaded and installed the wl program, you can use it to query
    the driver for the transmit power setting:


    ```

    # wl txpwrlimit

    ```


    Current TX Power Limit: 89 mW ( 19.50 dBm)


    The default setting, once you install OpenWrt, depends on the default driver setting,
    which in most cases it will be 89mw (19.5 dBm), the optimum output power for the
    radio on the WRT54G. TX power is often expressed in dBm, a measure of absolute
    power. For reference, you can refer http://en.wikipedia.org/wiki/DBm. However,
    suppose you want to decrease the radio transmit power? This could help limit the
    range and save power consumption (especially if you are implementing one of the
    battery hacks in Chapter 7). To commit the transmit power by the following:


    ```

    # nvram set wl0_txpwr="56"

    # nvram commit

    # wifi

    # wl txpwrlimit

    ```


    Current TX Power Limit: 25 mW ( 14.00 dBm)


    In the first command, we set the NVRAM variable wl0_txpwr to 56. This variable
    is expressed as qdBm, which means it is in fours (one-quarter) the value of dBm.
    The default value is 78 qdBm. A setting of 56 means we should have a dBm of 14
    (56 / 4 = 14). We commit the changes to the NVRAM partition and reload the wireless
    settings using the wifi command. To verify that the settings have taken effect,
    we can again use the wl txpwrlimit command, which returns 14 dB as our output
    power.


    The wl txpwr1 provides even more comprehensive and accurate information by displaying
    the current TX power in all the different measurement units already described:


    ```

    # wl txpwr1

    TxPower is 56 qdBm, 14.00 dBm, 25 mW Override is Off

    ```


    You can also double-check that this value was set properly using the iwconfig
    command:


    ```

    # iwconfig

    lo no wireless extensions.

    eth0 no wireless extensions.

    ```


