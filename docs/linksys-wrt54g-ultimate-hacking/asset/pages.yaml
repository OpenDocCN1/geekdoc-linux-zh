    # Configuring a Samba Client


    The easiest way to get extra storage on WRT54G series routers is to use the CIFS
    file system, which allows you to act as a CIFS client and mount Samba shares.
    This is an excellent way to get storage on WRT54G series routers that do not have
    a USB port. First, you need to install the CIFS kernel module and the cifs package,
    which will allow you to mount remote Samba or Windows Server Message Block (SMB)
    shares:


    ```

    ipkg install cifs kmod-cifs

    ```


    Once the installation has completed, you need to add CIFS file system support
    into the kernel with the following command:


    ```

    # insmod cifs

    Using /lib/modules/2.4.30/cifs.o

    ```


    Next, you will create a directory to mount your remote file share:


    ```

    # mkdir /mnt/smblog/

    ```


    And finally, mount the remote share:


    ```

    # mount.cifs //192.168.1.208/wrt54g /mnt/smblog

    Password: <enter your password here>

    ```


    To verify that the share was mounted successfully, use the mount command. You
    will see a line that looks as follows:


    ```

    //192.168.1.208/wrt54g /mnt/smblog\\192.168.1.208\wrt54g,username=root,domain=,rsize=4100,wsi
    ze=4100

    ```


