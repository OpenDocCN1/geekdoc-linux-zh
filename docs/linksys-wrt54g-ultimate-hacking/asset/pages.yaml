    # Using the Operating System nvram Command


    If you already have an operating system installed that gives you access to the
    command line, you can simply enable boot_wait using the following commands:


    ```

    # nvram set boot_wait-on

    # nvram commit

    ```


    By setting the boot_wait parameter to on, and committing the changes to the NVRAM
    partition, the system will go into a boot wait state upon the next reboot. We
    recommend that you always do this once you''ve installed third-party firmware,
    in case you want to revert to Linksys firmware or apply a new/different firmware
    image.


    # Directly in the PMON/CFE


    You can access the PMON/CFE variables by directly adding a serial port on /dev/ts/0
    and connecting via a terminal session (see Chapter 7). Once you have command-line
    access, you can enable boot_wait in PMON/CFE by entering the following commands:


    ```

    CFE> nvram set boot_wait=on

    *** command status = 0

    CFE> nvram commit

    *** command status = 0

    CFE>

    ```


    This setting will be used if the NVRAM partition does not exist (either due to
    user error or because you want to re-create it because the NVRAM values are wrong,
    causing the device not to function). You can remove the NVRAM partition using
    the OpenWrt command line with mtd. The mtd partition allows you to manipulate
    partitions. The following command will format the NVRAM partition and reboot the
    device:


    ```

    # mtd -r erase nvram

    ```


    > WARNING

    The mtd -r erase nvram command is dangerous. It worked on all of our WRT54GL series
    routers over the course of writing this book. However, if your hardware version,
    and CFE somehow are unable to write a clean NVRAM partition, or if you write a
    corrupt NVRAM partition, you will be in serious trouble. Use this only as a last
    resort and not as a regular course of business.


