    # Using the SD Card under OpenWrt


    Our new SD card reader will not be much without some software to interface the
    hardware with the OpenWrt kernel. We need to provide a driver for the reader,
    and some support to read the contents.

    First, you need to enable some file system support for the file allocation table
    (FAT). FAT file systems are typically associated with Windows, but we choose this
    file system format for interoperability.A FAT file system can be read/and/written
    to just under every modern operating system. In order to install FAT support under
    OpenWrt, you can use a package from the default OpenWrt package repository. In
    order to install the package, called kmod-vfat, to your OpenWrt installation,
    you need to make sure that you have Internet connectivity to your WRT54G. Once
    connected, you need to update the ipkg repository, and install the FAT kernel
    modules via an SSH connection. From the SSH command line, issue the following
    commands:


    ```

    # ipkg update

    # ipkg install kmod-vfat

    ```


    After the installation of kmod-vfat is complete, you need to make sure that the
    modules are loaded, and that they reload after a reboot. As a benefit of installation
    through ipkg, the package'
