- img_proc: true
  md: '# NOTE


    The pin header and pin connectors should be available from most well-stocked electronics
    supplies houses. We obtained many of our parts from www.digi-key.com and from
    a local Radio Shack retail store. We''ll provide a list of part numbers and suppliers
    where we obtained our parts in Appendix B.


    After obtaining an appropriate pin header and connectors, you will need to place
    the pin header in the JP2 location and solder it to the board. If solder is already
    bonded to the connection locations, you will need to remove it with a solder sucker
    or soldering braid before inserting the pin header. Once you insert the pin header
    on the top side of the board, solder it from the underside of the board.


    # TIP


    In many cases, once installed, the pin header will obscure the markings on the
    board that indicate the pin numbering at the JP2 location. As it will be important
    to us to be mindful of the pin numbering, it is helpful to make additional, visible
    markings designating one or more pins.


    The JP2 header does contain the capability for two serial ports, each with different
    abilities under OpenWrt (or many other firmware distributions). The first serial
    port pin out, as shown in Table 7.2, is recognized as /dev/tts/0 under OpenWrt.
    This port is bound to a terminal session, and by connecting this to a serial terminal
    at 115200 baud N81 (no parity, 8 data bits, 1 stop bit), we can gain command-line
    access simply by pressing Enter. It should also be noted that neither serial port
    has hardware flow control, and software flow control should be used.

    The second serial port available on the JP2 header is available on the pin, as
    indicated in Table 7.2. This port is usable at the same time as the first port;
    however, this port is not bound to a terminal session by default. This is particularly
    useful for connecting serial devices that do not require a terminal session, and
    will be the one we utilize in this example to leave /dev/tts/0 available if we
    require a terminal session.


    # Table 7.2 WRT54G JP2 Serial Port Out


    | WRT54G JP2 Pin | Function |

    |---|---|

    | 1 | 3.3 volts |

    | 2 | 3.3 volts |

    | 3 | Tx (/dev/tts/1) |

    | 4 | Tx (/dev/tts/0) |'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Table 7.2 continued WRT54G JP2 Serial Port Pin Out


    | WRT54G JP2 Pin | Function |

    | 5 | Rx (/dev/tts/1) |

    | 6 | Rx (/dev/tts/0) |

    | 7 | Unused |

    | 8 | Unused |

    | 9 | Ground |

    | 10 | Ground |


    # Tools & Traps...


    # /dev/tts/0 Hangs My Serial Device!


    Although it is possible to use /dev/tts/0 for any serial device, some devices
    may lock up due to unexpected data being sent to the device. Under OpenWrt, /dev/tts/0
    is bound to a terminal session by default. As the result of the binding, all boot
    messages (such as those provided by normal Linux system boot) are redirected to
    this serial port. Devices attached to this port at boot with the default binding
    enabled will receive the boot output, and some devices do not know how to interpret
    this data, causing them to lock up or become unusable.


    There are two options for dealing with these problems. First, you can attach the
    serial device after boot. However, although this is the simplest answer, it may
    not be the most practical. Your WRT54G and serial device may be placed in an area
    that is not readily accessible. If power is lost to a WRT54G in this location,
    it may be difficult, or impractical, to detect the serial device, reboot the WRT54G,
    and reattach the serial device after the boot process has completed.


    Alternatively, you can remove the terminal binding from /dev/tts/0. This is a
    great solution, especially if you need to use both serial ports for devices, and
    both devices cannot appropriately handle the terminal output on boot. Although
    disabling the terminal session may solve your device problem, however, it is possible
    that it can cause an issue should you ever need a serial terminal session, as
    it will no longer be available in reviving a bricked router, so be aware of the
    benefits.


    If you want to remove the terminal session binding, you can do so by editing /etc/initt.ab
    and commenting out the tts/0 line with a #, as shown here


    ```

    #tts/0:::askfirst:/bin/ash --login

    ```'
  merge: -1
