  md: '# Chapter 6 WRT54G for Penetration Testers


    At this point in the installation process, your Kismet Drone should function as
    configured. As we indicated in Chapter 4, the WRT54G platforms do not support
    channel hopping, and we will miss important wireless traffic and information without
    channel hopping. The Kismet Drone will start and begin to listen on the last configured
    channel, likely the default channel 6. In order to provide channel hopping, you
    need to provide a manual method via a shell script. With this script you can also
    add the additional non-U.S. channels, as described in Chapter 4. In order for
    your script to function, you also need to install the wl package with:


    ```

    # ipkg install wl

    ```


    You now need to create your channel hopping script, identical to that in Chapter
    4 in the "Warding-in-a-Box" section. If this is a dedicated Kismet Drone device
    you will want the channel hopping to be performed at startup, using the guide
    found in Chapter 4. To put the finishing touches on the automatic startup sequence,
    create a S93kismet_drone startup script in /etc/init.d with the following contents:


    ```

    #! /bin/sh

    /sbin/ifconfig eth1 up

    /usr/sbin/wl ap 0

    /usr/sbin/wl passive 1

    /usr/sbin/wl promisc 1

    /usr/sbin/wl monitor 1

    /usr/bin/kismet_drone -f /etc/kismet/kismet_drone.conf > /dev/null 2>&1

    ```


    Now, make it executable with the following command:


    ```

    # chmod 755 /etc/init.d/S93kismet_drone

    ```


    # Note


    Change eth1 to the appropriate wireless interface for your device, which will
    differ depending on the model, type, and version. Refer to the sidebar in this
    chapter and http://wiki.openwrt.org for more information.


    This script performs a number of steps to ensure that Kismet will start properly:


    +   - It uses ifconfig to set the eth1 interface up, or to an active state, in
    preparation for capture. This is just a precaution, as the interface should already
    be active.

    - The wl ap command sets the AP mode to be of a client, instead of acting as an
    access point.

    - Passive mode is set with wl passive to prevent the transmission of any network
    or wireless packets during Kismet use and to prevent it from contacting unauthorized
    networks.'
