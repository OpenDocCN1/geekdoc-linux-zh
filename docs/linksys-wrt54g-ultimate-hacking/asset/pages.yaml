  md: '# WARNING


    Currently, a freshly booted WRT54G does not retain current date information. You
    could set the date at boot by installing and configuring the ntpclient package,
    that requires an active Internet connection to function properly. In most cases,
    with a dedicated wardriving WRT54G, the active Internet connection will not be
    available, rendering ntpclient useless. The default date that a WRT54G will boot
    is San Jan1 00:00:00 UTC 2000, and the Kismet log files with the current configuration
    reflect this date.


    The final step to wardriving-in-a-box WRT54G is to set Kismet to start at every
    boot. Kismet will need to start after the serial ports have been set, before channel
    hopping occurs. To accomplish this, we will create a S93kismet_server startup
    script in /etc/init.d with the following contents:


    ```

    #! /bin/sh

    /sbin/ifconfig eth0 wl

    /usr/sbin/wl ap 0

    /usr/sbin/wl passive 1

    /usr/sbin/wl promisc 1

    /usr/sbin/wl monitor 1

    /usr/bin/kismet_server -f /etc/kismet.conf > /dev/null 2>&1 &

    sleep 3

    echo "kismet_server now running"

    ```


    This script performs a number of steps to ensure that Kismet will start properly:


    +   * It uses ifconfig to set the eth1 interface, or to an active state, in preparation
    for capture. This is just a precaution, the interface should already be active.


    +   * The wl command sets the ap mode to be that of a client, instead of acting
    as an access point.


    +   * Passive mode is set with wl passive to prevent the transmission of any network
    or wireless packets during our Kismet use to prevent it from contacting unauthorized
    networks.


    +   * wl promisc sets the wireless card in promiscuous mode, allowing all network
    traffic (Layer 2) to be captured, regardless of source or destination Media Access
    Control (MAC) addresses.


    +   * Monitor mode is enabled through the wl monitor command to capture all wireless
    traffic (Layer 2), including management, control, and data 802.11 frames.


    +   * Kismet is started utilizing our custom configuration in /etc/kismet.conf,
    and sends the unused console output to /dev/null (nowhere).'
