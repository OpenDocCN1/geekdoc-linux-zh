    # Preparing the WRTLS54GS USB Capabilities


    In order to be able to use a USB device under OpenWrt, you need to install a few
    kernel modules to support the USB port. As the USB port is featured on only the
    WRTLS54GS model, the required kernel modules are not included by default in OpenWrt,
    in order to conserve space and memory. The USB modules have already been packaged
    for use OpenWrt, and they are available through the default package.


    In order to enable support under OpenWrt, you need to install the core USB kernel
    drivers as well the specific Open Host Controller Interface (OHCI) kernel drivers.
    You can do this with the following command:


    ```

    # ipkg install kmod-usb-core kmod-usb-ohci

    ```


    > NOTE It is possible to use multiple USB devices on the single USB port on the
    WRTLS54GS, by using an inexpensive third-party USB hub. The authors have successfully
    used a USB Bluetooth adapter, USB spectrum analyzer, and two USB storage devices
    simultaneously! Depending on the hub''s manufacturer, it may utilize the Universal
    Host'
