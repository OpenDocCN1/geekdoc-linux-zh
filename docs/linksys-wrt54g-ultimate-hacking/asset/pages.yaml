  md: 'Here are some operational indicators for the LED lights:


    +   - **Flashing Power light** by itself, this is not a cause for concern. The
    Power light will flash at various points in the startup process, and may also
    flash to indicate other states.


    +   - **Solid DMZ light** indicates that the device is booting.


    +   - **Flashing Power light and slowly flashing DMZ light** indicates that your
    flash image is corrupt. You can resolve this using the Trivial File Transfer Protocol
    (TFTP) to upload a new flash image; we give you the instructions in Chapter 2.


    # Processor Architecture


    All processors that ship with the WRT54G models use a Broadcom (Microprocessor
    without Interlocked Pipeline Stages) processor, common to embedded devices and
    game consoles. These processors are based on the Reduced Instruction Set Computer
    (RISC), meaning they have a smaller set of instructions than most processors from
    Intel (which have a Complex Instruction Set, or CISC, architecture). MIPS processors
    are used by SGL, for its PlayStation and PlayStation 2 game consoles, and by Cisco
    Systems in its routers and switches. Speeds will vary throughout the models; however,
    all feature the same architecture and are all manufactured by Broadcom. So, why
    do we use Linux-based open source software for the Intel x86 platform, which is
    a completely different architecture. This means we will need to "port" or "cross-compile"
    software to allow it to run on this platform, or be certain that what has already
    been ported. Two primary families of Broadcom processors are used in all WRT54G
    models: BCM47xx and BCM5352.


    # BCM47xx


    There are two distinct models in the BCM47xx family. The BCM4704 series was released
    to be used in small wireless access points to targeted the home or SOHO user.
    It used only CPU functions and relied on separate chips to control the Ethernet
    Media Access Control (MAC) and Wireless MAC. You can see in earlier versions of
    the WRT54G, such as the version 1.0 and 1.1 models, that they do, in fact, contain
    separate chips for all three functions. The BCM4712 series processors not only
    contained CPU functionality but also were able to provide Wireless MAC capability
    (integrating with the BCM2050 wireless radio). This design is referred as SoC,
    or System-on-Chip. The BCM47xx series always relied on a separate processor for
    Ethernet MAC in the form of the ADM696 and BCM5352 series processors. The latest
    revision of this processor was used in WRT54G, version 2.0, which increased CPU
    speeds from 125 MHz to 200 MHz.


    # BCM5352


    The BCM5352 family of processors is a next-generation SoC architecture that combines
    the CPU, Wireless MAC, and Ethernet MAC onto one chip (see Figure 1.3).'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Figure 1.3 Broadcom BCM5352 Chip from a Version 1.1 WRT54GL


    ![](img/41991837f74596e7c29a2498b6ec56e8_25_0.png)


    # Notes from the Underground...


    # Overclocking Your WRT54G


    You can find different tutorials and articles online describing how to overclock
    your WRT54G. Overclocking allows your processor to run at a speed that is faster
    than to which it was originally set or for which it was designed. At first glance,
    this might seem like an easy change to gain some speed (in essence, it is as easy
    as making a change to an NVRAM variable). However, you need to be very cautious
    if you are going to attempt this hack. It is dangerous hack to perform, as it
    could cause your router to overheat and become "bricked." Your CPU frequency capacity
    is defined by the router version, version, and processor version. You can determine
    which processor (CPU) and version a specific device uses by executing the following
    command (tested on OpenWrt- and DD-WRT):


    ```

    root@openvnp:~# grep cpu /proc/cpuinfo

    cpu model             : BCM3302 V0.8

    ```


    So, just it is a BCM3302 v0.8? It''s the actual CPU associated with a WRT54GL
    model router. Table 1.1 lists the different CPU types and versions.


    Continued'
  merge: -1
  pgno: 25
