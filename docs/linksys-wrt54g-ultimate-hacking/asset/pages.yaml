  md: '# Figure 7.3 RP-TNC to N Male Pigtail


    ![](img/41991837f74596e7c29a2498b6ec56e8_289_0.png)


    # Notes from the Underground...


    # When Diversity Is a Bad Thing...


    In the default configuration of the WRT54G router, the included omnidirectional
    antennas are used in what is called diversity mode. In diversity mode, the router
    uses both antennas simultaneously to resolve any signal anomalies, called multipath.
    If you were to connect a directional antenna to only one antenna connector on
    the router, you might be able to send out plenty of data; however, you''d likely
    be unable to receive any data due to the lack of a long-range antenna on the other
    part, thus fusing the signal anomaly math to resolve multipath issues contained
    in the wireless radio chipset!


    For a more detailed discussion of diversity and multipath, Cisco offers a detailed
    explanation at http://forum.cisco.com/en/US/tech/tk722/tk809/technologies_tech_
    noted09186a008019646.html.


    Although a hardware modification is available to resolve this issue, it is very
    difficult to remove the antenna diversity chip and replace it with a small piece
    of wire (check the forum thread at http://forum.bsr-clan/forum8743.html for more
    information), but there is a software modification that is much easier to implement,
    requiring that you issue only two NVRAM commands on the WRT54G:


    ```

    # nvram set wlo0_antdev=x

    # nvram commit

    ```


    Replace x in the preceding command with the appropriate antenna designation that
    you want to use: 0 indicates the main antenna, and 1 is the auxiliary antenna.
    On the WRT54G, versions 1.0 and 1.1, and on the WRT54GS 1.0, the main antenna
    is'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# WRT54G Hardware Hacking • Chapter 7


    closest to the power jack. On the WRT54G, versions 2.0 and later, and on the WRT54G,
    versions 1.1 and later, the main antenna is located closest to the reset button.
    Setting x to 3 resets to diversity mode, and setting it to -7 sets it to auto-select.
    Once you have selected an individual antenna, both send and receive capabilities
    will be active on the selected antenna connector.


    # Adding Ports: SD Card, Serial, and JTAG


    Of all the hardware modifications in this chapter, some of the most useful concern
    the addition of other ports. These ports will allow you to add more storage to
    the device, add additional devices as a GPS receiver, and add a JTAG connector
    in case you really screw up your firmware.


    # Opening the Router


    In order to perform many of these hardware hacks, you first need to gain access
    to all of the juicy bits contained inside.


    # WRT54G and GL Series


    > WARNING

    Opening your WRT54G will void your warranty! By opening the router, you will be
    passing beyond the point of return.


    First, you need to remove the two antennas from the rear of the router. You can
    do this by straightening the antennas, and sliding the plastic collar at the base
    of the antennas toward the tip. This will reveal the metal collar underneath,
    as shown in Figure 7.4, which you will use to unscrew the antennas.


    # Figure 7.4 Removing the WRT54G Antennas


    ![](img/41991837f74596e7c29a2498b6ec56e8_290_0.png)'
  merge: -1
