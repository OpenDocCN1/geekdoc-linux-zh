  md: '# Chapter 6 • WRT54G for Penetration Testers


    You can find more information on locating rogue access points with Kismet, Kismet
    Drones, and WRT54G routers in a paper at the SANS Reading Room, at www.sans.org/reading_room/whitepapers/honors/1671.php.


    # WRT54G Remote Bluetooth Scanner


    Bluetooth scanning is increasingly important for a wireless penetration tester,
    that is used on a Bluetooth device. Devices with Bluetooth handle all sorts of
    information; phones have calls and address books, keyboards are used to pass passwords
    and financial information, and Bluetooth headsets carry audio communications.
    These types of information are valuable to an attacker, and Bluetooth devices
    are transmitting this information over the air.


    Bluetooth is intended to be a short-range wireless technology, ranging from 1–100
    meters, depending on the class of Bluetooth device. This would limit the range
    at which an attacker could intercept transmissions; however, an enterprise group
    of hackers have made Bluetooth connections over distances greater than 1 mile,
    utilizing commodity hardware! Bluetooth utilizes the 2.4GHz frequency range as
    Wi-Fi, so the antenna, and design, are interchangeable between the two technologies.


    # NOTE


    > For more information on Bluetooth, including protocol information, frequencies,
    and distance information, check the Wikipedia entry at http://en.wikipedia.org/wiki/Bluetooth.
    You can find more information about long-range Bluetooth connections at http://trifinite.org/trifinite_stuff_ids.html
    and at www.smallnetbuilder.com/content/view/24256/98.


    We will perform this hack on a WRT54GS due to the availability of a Universal
    Serial Bus (USB) port on the model. We will be utilizing a third-party USB Bluetooth
    adapter to perform our scans.


    # About the Bluetooth Adapter


    The USB adapter that we have elected to use for this hack is a Linksys USBBT100,
    as shown in Figure 6.5, which is a Class 1 device capable of communicating up
    to 100 meters by default. This adapter features features an external antenna;
    however, it has been replaced with a cable and an RP-SMA connector. We also mated
    the adapter with a 5dB omnidirectional antenna. Now, due to the modularity, we
    can select from different antennas as needed.


    ![](img/41991837f74596e7c29a2498b6ec56e8_257_0.png)'
