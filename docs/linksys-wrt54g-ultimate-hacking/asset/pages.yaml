  md: '# Chapter 6 • WRT54G for Penetration Testers


    Controller Interface (UHCI) USB standard controller instead of the OHCI controller
    in the WRT54GS. Kernel modules are available for UHCI devices by installing the
    kmod-usb-uhci package.


    Once you have installed these kernel module packages, you will need to reboot
    the WRT54GS in order to have the kernel modules started. You can install these
    modules manually with the following commands:


    ```

    # insmod usbcore

    # insmod usb-uhci

