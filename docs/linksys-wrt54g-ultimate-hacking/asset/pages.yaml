    # The Hack


    > > NOTE\ Very few WRT54G models do not have capabilities for adding a serial
    port to the circuit board. Particularly, the WRT54G, versions 1.0 and 1.1, do
    not contain the appropriate circuitry. You cannot add serial ports to these models.


    The serial ports are populated in the form of a number of solder points on the
    board, aligned in two rows of five points. In most cases (as in our WRT54GL),
    the points are labeled JP2, as shown in Figure 7.24.


    # Figure 7.24 Unpopulated WRT54G Serial Ports at JP2


    ![](img/41991837f74596e7c29a2498b6ec56e8_309_0.png)


    The easiest and best way to begin to take advantage of our serial ports is to
    install a pin header in the appropriate location on the board, and use a connector
    attached to a ribbon cable to interface with it. Installing the pin header will
    enable us to detach our serial connector so that we can replace it if it breaks,
    or more easily disassemble the case at a later date.'
  merge: -1
