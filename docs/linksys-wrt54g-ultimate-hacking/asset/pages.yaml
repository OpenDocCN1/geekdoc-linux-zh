    These modules allow OpenWrt to be able to communicate with the USB port and the
    host controller, in order to determine information about devices attached to the
    USB port so that the kernel can load the appropriate drivers.


    # Configuring the USB Bluetooth Adapter


    Before you plug in and use the USB Bluetooth adapter, you need to make sure that
    you install the appropriate drivers for the Bluetooth adapter, and the Bluetooth
    utilities. First, you need to install the generic Bluetooth kernel modules and
    the kernel modules for the USB Bluetooth Host Controller (HCI) from the default
    OpenWrt package tree:


    ```

    # ipkg install kmod-bluetooth kmod-bluetooth-hciusb

    ```


    You also need to install the Bluetooth utilities in the bluez package. Unfortunately,
    the bluez packages are not in the default OpenWrt backports tree. In order to
    add these packages, you will need to update /etc/ipkg.conf with an additional
    repository: Add an src directive to /etc/ipkg.conf as follows:


    ```

    src backports http://downloads.openwrt.org/backports/0.9/

    ```


    This additional source provides a descriptive name (backports), and gives the
    location of the new repository that contains the BlueZ utilities. In order to
    install the BlueZ utilities, you need to make sure you update your package database
    to add the items from the new backports repository:


    ```

    # ipkg update

    # ipkg install bluez-utils

    ```


    To begin using your USB Bluetooth adapter, you do need to modify some system configuration,
    as one of the modules does not automatically install after restart, which is required
    for the Bluetooth adapter to function.You will need to add this additional module
    to the startup routines under /etc/modules.d files in directory are processed
    in numerical order by the name of the file.Want this module to be added last,
    after the Bluetooth kernel modules, and after the USB port has been initialized.
