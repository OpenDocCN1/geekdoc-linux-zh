  md: '# Introduction


    This chapter will walk you through the various methods of installing third-party
    firmware on the Linkys WRT54G. This process is usually fairly simple, provided
    you verify certain information properly (such as router model and version) and
    follow the instructions *exactly* as we wrote. Most of the problems people have
    when installing third-party firmware stem from the incorrect firmware image for
    their hardware. Refer to Chapter 1 for more information about determining your
    hardware version.


    > WARNING


    Installing third-party firmware on your Linkys WRT54G voids the manufacturer’s
    warranty. If you “brick” your WRT54G (i.e., render it unusable), Linkys will not
    provide you with a new one. We include full instructions on how to recover from
    a firmware upgrade gone bad in Chapter 8; however, realize that you are doing
    at your own risk and we hold no responsibility.


    The installation instructions for the various firmware and WRT54G models may differ
    slightly, which is even more reason to check you and double-check your installation
    procedures. We promise that this effort will pay off. Although we call "installing
    third-party firmware," some call it "upgrading firmware" because of the increased
    functionality. We cover a bit of the added functionality you will gain in this
    chapter, and continue to expand on it throughout this book. Your diligence and
    caution in the beginning will be worth it in the end.


    # Installing Third-Party Firmware


    The following sections will show you how to install third-party firmware via the
    Web interface and the Trivial File Transfer Protocol (TFTP). We will also cover
    the concepts you will need in order to do an installation via a Joint Test Action
    Group (JTAG) cable in Chapter 7. Before you begin, refer to Table 2.1 as a guide
    to the potential upgrade paths.


    Table 2.1 Firmware Installation Methods


    | Method | Description | Tools Required |

    |---|---|--|

    | Web interface | Use this method when upgrading from the Linkys firmware for
    the first time, because no TFTP server is readily available. This is the easiest
    way to apply firmware updates (either from Linkys or from a third party). | PC,
    Web browser, network cable |


    Continued


