  md: 'Unfortunately, the WRT54G models supported by FairizaWRT are not currently
    available in your local computer retailer, as they are older models. One way to
    obtain the supported models is to search eBay or your friends'' older units. If
    a friend happens to have a unit that is valuable to your cause, offer to buy a
    brand-new one from the local computer retailer for an even trade. Frequently,
    you will find the cost of the new router will be more expensive than traveling
    to obtain a used unit from eBay. It also helps to mention that your friend will
    get a new unit with a warranty, and you will be trading for a (presumably) known
    working device.


    Although FairizaWRT installation is certainly possible with the GUI interface,
    it is highly recommended that you install it via TFTP, as indicated earlier in
    this chapter. You can download the latest image from hackerpimps.com/fairuzazwrt/bin/fairazwrt-02.bin.
    The SHA-1 sums are inside the associated README file, located at hackerpimps.com/fairuzazwrt/bin/README.


    # Using FairizaWRT


    Once you have FairizaWRT installed on your Linksys device, you must use the command
    line to configure its settings. The FairizaWRT developers omitted any GUI management
    of the firmware for two suspected reasons: one, to space by not installing the
    GUI frontend and supporting files, leaving more room for additional tools; and
    two, to make it more difficult to use. Given that FairizaWRT can be a very dangerous
    tool when used by the wrong individuals, it makes sense that you have to pay your
    dues in order to use the tools contained within! FairizaWRT does have a Web server
    installed and started by default, but it provides only an information splash page,
    as indicated in Figure 2.16.


    Figure 2.16 FairizaWRT Splash Page


