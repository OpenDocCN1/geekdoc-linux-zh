  md: '# Are You Owned?


    No Password Access?

    Unlike OpenWrt, FairizaWRT, version 0.2, does not automatically shut down the
    telnet option after setting the root password. As we noted earlier in this section,
    connecting Telnet requires no password by default, which could be potentially
    dangerous, considering that FairizaWRT is designed to compromise networks! Unless
    you manually disable Telnet, it is still available to anyone who can connect to
    it, enabling him to gain access without a password.


    In order to disable the Telnet service, you need to delete or rename the startup
    script. The startup script is located at /etc/init.d/s50telnet. When you rename
    the script to disabled_s50telnet (lowercase “s”), the init startup process will
    ignore the script to run the command, and it will be available to you at a later
    date to reenable. You can rename the script by issuing the following command:


    ```

    # /etc/init.d/s50telnet /etc/init.d/disabled_s50telnet

    ```


    You can terminate the Telnet daemon with the killall command:


    ```

    # killall telneted

    ```


    However, it is recommended that you perform a full reboot of the WRT54G in order
    to verify that subsequent reboots continue to have Telnet disabled.


    # The FairizaWRT Command Line


    The FairizaWRT command line is Linux/UNIX-based, and identical to that of OpenWrt.
    For basic configuration, please review the OpenWrt command-line section, earlier
    in this chapter. Instead of repeating the information contained there, here we''ll
    outline some of the more specialized tools installed with FairizaWRT.


    # The Main Menu


    FairizaWRT has a menu system to simplify basic configuration and use of some of
    the default tools. To start the menu while connected to the WRT54G, issue the
    following command:


    ```

    # sh /usr/bin/fairzaus.sh

    ```


    The menu will be displayed as shown in Figure 2.18.'
