  md: '# WRT54G for Penetration Testers · Chapter 6


    You may also want to add /usr/bin/ppp-ip.sh to your crontab, as shown earlier
    in this chapter. If your CDMA connection drops and reconnects, the ppp0 interface
    could obtain a different IP address from the provider. With a regular crontab
    entry, you will receive regular updates containing the IP address information.
    The startup script will only run at startup, and the CDMA disconnect could happen
    at any time. You should set the crontab to a time interval that is appropriate
    for your needs. For example, if you want the script to run every two hours, 0
    0-23 * * /usr/bin/ppp-ip.sh > /dev/null 2>&1 to your crontab using the crontab
    -e command.


    You will find at this point if you attempted to connect to the WRTSL4GS via SSH
    or the CDMA WAN connection, you failed. You need to enable SSH on the WAN port
    by modifying your firewall rules. You can accomplish these firewall changes by
    editing /etc/firewall.user. In this section, note that two configuration lines
    for enabling SSH access to the WAN port, have been commented out. Refer to the
    Open Port to WAN configuration section.


    You need to uncomment the two SSH configuration lines in the Open Port to WAN
    section. Your final Open Port to WAN section should look like this:


    ```

    iptables -t nat -A prerouting_rule -i $WAN -p tcp --dport 22 -j ACCEPT

    iptables -A input_rule -i $WAN -p tcp --dport 22 -j ACCEPT

    ```


    After either a reboot or a restart of the firewall with /etc/init.d/S45restart,
    you will be able to connect to your WRTSL4GS over the CDMA WAN connection. At
    this point, you can utilize the WRTSL4GS for whichever penetration tests you want
    to perform, and you will successfully bypass any external firewalls.


    In order to make full use of the network connection, you will likely need to modify
    virtual LAN (VLAN) IP addresses, and get creative with routing entries. Each penetration
    testing environment will be different, so each modification will be unique.


