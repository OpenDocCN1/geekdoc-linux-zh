- img_proc: true
  md: 'disallow=all

    allow=ulaw

    callerid="Larry Pesce" <800-555-1212>


    In a nutshell, we are defining our local phone extension so that it can connect
    to Asterisk installation. Again, we are allowing only the ulaw code to be used
    between Asterisk and the VoIP phone, and you will note that the configuration
    section header [666] matches the extension we defined as being allowed to receive
    calls with the register command. For more information on the other commands, refer
    to www.asterisk.org/support.


    ![](img/41991837f74596e7c29a2498b6ec56e8_206_0.png)


    # VoIP Security


    In our configuration examples for our Asterisk setup for our local VoIP phones,
    we assumed a trusted network. You may note that our local extension does not require
    authentication of either a username or a password. If a nefarious individual was
    able to gain access to our trusted network, he could effectively knock out our
    local phone off the network with several different types of denial of service
    (DoS) attacks. If the phone was a soft phone (a VoIP phone based in software),
    it is even possible that the soft phone may not be running.


    In these instances, an attacker could impersonate our phone and gain connectivity
    to our Asterisk installation with all the privileges that our regular VoIP phone
    would have, including the capability to answer and make calls! It can do this
    with very little captured network traffic. Keep in mind that if any phones are
    implemented wireless, this traffic could be captured over the air.


    In addition to our trusted networks, VoIP traffic is notoriously difficult to
    secure. For example, SIP traffic over a network is essentially "in the clear,"
    with no encryption. If this traffic were intercepted, it would be possible to
    impersonate the device establishing the call. Additionally, the Real-time Transport
    Protocol (RTP) also travels "in the clear," which makes it possible to record
    the phone calls. One part particularly easy to use under Windows is Cain and Abel,
    a multipurpose security auditing tool. Cain and Abel is able to sniff VoIP traffic
    off an appropriately configured network, and automatically convert and save the
    phone conversations into .wav files. Cain and Abel is available from www.oxid.it.
    You can perform this type of VoIP traffic to phone conversation conversion through
    the standard Wireshark sniffer, available at www.wireshark.org.


    Although the SIP, RFC 3261, defines secure extensions (called Secure SIP) based
    on Transport Layer Security (TLS), and there is another standard, called Secure
    Real-time Transport Protocol (SRTP), RFC 3711, focused on providing security to
    the RTP VoIP calls, their implementation is not widely adopted.


    Continued'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'For information on securing your Asterisk installation plenty of resources
    are available, including the various configuration files for Asterisk, guides
    at www.asterisk.org and www.voip-info.org, and Practical VoIP Security, from Sygress
    Publishing (ISBN # 1597490601).


    We completed a significant amount of Asterisk configuration; however, we will
    still be unable to dial until we define our dial plan in the extensions.conf.


    # Configuring extensions.conf


    In order to be able to dial out from our VoIP phone, we need to create a default
    dial plan. A dial plan on any PBX is a mapping of what paths a phone should call
    when specific numbers are dialed from one of the phones. In order to create default
    dial mappings, we need to edit the extensions.conf in /etc/asterisk.


    The comments in extensions.conf are a valuable resource for understanding how
    to create customized dial plans that handle voicemail, call transfers, and multiple
    VoIP providers. This can come in handy for additional configurations, but those
    are beyond the scope of this book. We’ll at least give you the basics to getting
    calls working with our BroadVoice example.


    In order for our VoIP phone extension to make an outbound call, we need to tell
    Asterisk where to route it. As a result, the setup does not have any generic routing
    information. We need to add the following lines to your extensions.conf:


    ```

    exten => _1NXXXXXXX, 1, dial(SIP/${EXTEN}@sip.broadvoice.com,30)

    ```


    ```

    exten => _1NXXXXXXX, 2, congestion()

    ```


    ```

    exten => _1NXXXXXXX, 102, busy()

    ```


    ```

    exten => 3,1,Dial(SIP/${EXTEN}@sip.broadvoice.com,20,tr)

    ```


    The first three extent perform pattern matching for numbers by local VoIP extensions.
    extent commands match with an underscore pattern matching. These particular examples
    are tailored to U.S. dialing examples; U.S. dialing starts with 1, a three-digit
    area code (NXX), and a seven-digit number (XXXXXXX). In the first command, when
    a number is dialed, Asterisk must use SIP to call the extension from the connected
    connection (${EXTEN}), which in our configuration is 666), and that it needs to
    use the connection profile sip.broadvoice.com as defined in our sip.conf. The
    second and third lines define how to deal with network overload and busy connections
    for U.S. dialing. The fourth line allows for any other connections that are not
    covered by the pattern matching to be routed via the sip.broadvoice.com-connection
    profile.


    It’s easy to extend this dial plan to add functionality to international dialing
    by adding additional pattern matching. For example, BroadVoice provides additional
    services for international calling to particular countries. The it recommend direct
    dial plan from BroadVoice for its international calling plan looks like this,
    and it has been edited for:


    ```

    exten_=01130..,1,dial(SIP/${EXTEN}@sip.broadvoice.com,30)

    ```


    ```

    exten_=01131..,1,dial(SIP/${EXTEN}@sip.broadvoice.com,30)

    ```


    ```

    exten_=011..,2,congestion() ; No answer, nothing

    ```


    ```

    exten_=011..,102,busy() ; Busy

    ```'
