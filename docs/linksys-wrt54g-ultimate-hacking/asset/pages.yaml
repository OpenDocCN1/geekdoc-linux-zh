  md: '# WRT54G Fundamentals • Chapter 1


    the vulnerability. Code examples that implement this exploit are readily available
    on the Web.

    Keeping-to-date with your firmware is extremely important, especially if you are
    running a version 5.0 or higher WRT54G that runs the VxWorks Firmware, as it tends
    to be very buggy. When you decide to experiment with third-party firmware as well,
    you also need to keep up-to-date. The following Web site keeps track of the latest
    firmware releases for many different hardware platforms and firmware projects,
    including WRT54G, versions 5.0 and higher, running VxWorks, and the stock Linksys
    US firmware versions:

    www.linksinfo.org/forums/showthread.php?t=47159

    Although you may be good at keeping your firmware up-to-date, maybe your friends
    and neighbors are not. Be a responsible citizen and help them out by applying
    the latest firmware for them. Deep down, they will be eternally grateful, and
    perhaps call you a lot less often.


    # WRT54G, Version 7.0


    Little is known about this model at the time of this writing. There are reports
    that there are 2 MB of flash memory and 4 MB of RAM. According to specifications,
    it uses an Atheros AR2317 chipset, which is still an 802.11b/g-only radio. Although
    the move to an Atheros-based chipset is intriguing, the reduced flash/RAM will
    inhibit the hackability of this platform.


    # WRT54GL Models


    Linksys has proposed that its WRT54GL series of routers should appeal to the hacking
    community, and therefore most of the hacks covered in this book will be based
    on this platform. The average cost is between $59 and $79; slightly higher than
    the average WRT54G with the same hardware (which is one of the complaints we have
    about this series). For the extra cost, you get a model that is intended to be
    hacked; however, Linksys will not offer support for third-party firmware. We will
    cover this model extensively throughout the book, documenting its internals, and
    showing how to install firmware on it, taking it apart, and showing you to add
    SD card readers, JTAG cables, and serial ports. If you plan to do some hacking
    on the WRT54GL platform, this is the model for the specifications of versions
    1.0 and 1.1 of the WRT54GL.


    # Table 1.10 Specifications of the WRT54GL, Versions 1.0 and 1.1


    | CPU speed | 200 MHz |

    | RAM | 16 MB |

    | Flash | 4 MB |

    | Serial number prefix | Version 1.0: CL7A

    Version 1.1: CL7B |


