  md: '# Access Point Configuration


    > NOTE


    This configuration can be a bit daunting to enter by hand. The authors have provided
    a tarball with all of the appropriate configuration files, which you can download
    from www.wrt54ghacks.com/whiterussian/wpa-ent.tar. Once you download it (/tmp
    is a good place to download it to), simply go to the root directory by typing
    cd / and execute the command tar xvf /tmp/wpa-ent.tar.


    To configure WPA- Enterprise we first need to configure the wireless settings
    as follows:


    ```

    # nvram set wlo0_akm="wpa w2"

    # nvram set wlo0_ssid="shinobi"

    # nvram set wlo0_radius_port="18182"

    # nvram set wlo0_radius_ipaddr="127.0.0.1"

    # nvram set wlo0_radius_key="SecretKey"

    # nvram set wlo0_auth_mode="radius"

    # nvram set wlo0_crypto="aes-tkip"

    ```


    > NOTE


    You can use the same utility mentioned earlier, located at www.grc.com/passwords,
    to generate the RADIUS server and client (wlo0_radius_key). However, the maximum
    length of A RADIUS shared key is 31 characters, so be certain not to use the entire-64
    or 63-character string.

    Another Windows-based free tool for generating RADIUS shared keys is Password
    Amplifier, from Funk Software, which was acquired by Juniper Networks. You can
    download it from www.function.com/Download/PassAmp.msi.


    You must reboot after making the NVRAM changes.The first value should be WPA and
    WPA2 (802.11) in enterprise mode. The SSID to some value, just as you would when
    setting up any other wireless network.

    Next, we will need to point to a RADIUS server. In this case, we are going to
    set FreeRadius locally on the WRT54G to achieve a self-sustaining system. If you
    choose, you could put the RADIUS server on any other machine, and if it FreeRadius,
    reuse the configurations that follow. We will tell the access point to use the
    RADIUS server on the local system—127.0.0.1 or port 1812 (UDP)—which is the standard
    RADIUS authentication port. RADIUS has what it calls


