    > WARNING

    It is strongly advised that any USB cables utilized for power be thoroughly tested
    for short circuits before use. It is possible to seriously damage any PC or laptop
    if a short exists. This could seriously damage the system repair.


    From our pin out, we can see that power is delivered via pins 1 and 4. Pin 1 delivers
