  md: '# Using Third-Party Firmware • Chapter 3


    +   Disabling Telnet and HTTP in favor of SSH and HTTPS greatly improves the security
    of your router when managing it. Both firmware distributions, OpenWrt and DD-WRT,
    allow you to do this without too trouble.


    +   If you are not using the DNS and DHCP server components, it''s best to turn
    them off. Not only will this help to secure the device, but it can improve performance
    as well.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse www.syngress.com/solutions
    and click on the “Ask Author” form.


    ### Q: How do I keep my software up-to-date once I flash WRT54G with OpenWrt?


    A: OpenWrt uses ipkg to keep everything up-to-date. Using ipkg update and then
    upgrade will bring you to the latest package for that release. For example, Ukrainian
    RC6 to Whiterussian RC6, it is recommended that you refresh.


    ### Q: I''ve always used Telnet and HTTP to manage my WRT54GR. Why should I change?


    A: Your usernames and passwords could be sniffed if an attacker to be on the client
    or server subnet, or any network between the client and the server. One method
    for doing this in a switched environment is through ARP cache poisoning to achieve
    a man-in-the-middle attack. Using secure protocols such as SSH and HTTPS helps
    to defend against these attacks.


    ### Q: I made configuration changes and my router will not boot. What do I do?


    A: To reset your NVRAM configuration type mid-erase nvram. This will erase the
    NVRAM partition on the flash, causing the CFE to reset to defaults upon reboot.
    Use caution, as this does not work on all routers.


    ### Q: My ISP does not provide me with an NTP server. Where can I find one?


    A: http://ntp.isc.org/bin/view/Servers/WebHome contains a list of public NTP servers.
    To find the closest NTP server with the best response time, consider using the
    Linux/UNIX command ntp-sweep.


    ### Q: Which router do I need if I want to get USB support?


    A: You will need a WRTSL54GS model router to gain support for USB. Additionally,
    the Asus WL-500G Premium has a very similar processor architecture and has two
    USB 2. ports.


