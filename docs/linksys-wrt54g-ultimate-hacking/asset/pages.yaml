- img_proc: true
  md: 'The 9 volt style connector is convenient for our battery pack construction.
    Also at our local Radio Shack, we were able to obtain 9 volt battery connectors
    and some N-type jacks. By soldering an N-type jack directly to the leads from
    the 9 volt battery connector, we created an adapter from our battery pack to the
    WRT54G, as shown in Figure 7.36. Not only can we use this with our eight AA battery
    pack, but also we now have a quick swap-out method for another battery pack, or
    even a 9 volt battery. Our adapter can now utilize any battery or pack with the
    9 volt style of connector.


    # Rechargeable Lithium-ion Battery Pack


    Lithium-ion battery technology offers a significant upgrade over traditional alkaline
    batteries. First, the power output from a lithium-ion cell is rated higher per
    size compared to traditional alkaline technology and can provide longer output.
    Second, lithium-ion batteries are rechargeable!

    The rechargeable of lithium-ion batteries makes them a bit more practical from
    a cost perspective. When alkaline batteries are discharged, they must be disposed
    of and replaced with a new set. Rechargeable batteries, however, can be refreshed.
    Granted, lithium-ion batteries have a higher cost of entry (our example battery
    and charger, as shown in Figure 7.37, cost about $40 combined), they will easily
    outline several hundred (if not a thousand) dollars'' worth of alkaline batteries.


    Figure 7.37 Lithium-ion Battery and Charger


    ![](img/41991837f74596e7c29a2498b6ec56e8_325_0.png)


    Our example, as shown in Figure 7.37, will output 7.4 volts at the desired amperage
    for our WRT54G. 7.4 volts is greater than the 5 volts required to power the router,
    but it could power the WRT54G under moderate use for about 72 hours! It may not
    be obvious, but our example lithium-ion battery is just about one-quarter the
    size of the eight AA alkaline pack. With that performance improvement, we could
    implement four identical lithium-ion batteries in a series, and deliver over 288
    hours in a factor that is about the same. That is a huge improvement over alkaline
    batteries.


    www.syngress.com'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'WRT54G Hardware Hacking • Chapter 7


    Lithium-ion technology is not without its dangers. It is important to note that
    when purchasing lithium-ion batteries, you should ensure that they contain a built-in
    protection circuit. If this circuit is not included, it is a very real possibility
    that the battery while recharging, it will explode in a dramatic fashion, possibly
    causing a fire.


    # 12 Volt Lead Acid Battery


    A lead acid battery will function well in terms of powering our WRT54G. Delivering
    12 volts at the appropriate manner, lead acid batteries will provide more than
    adequate power. Appropriate recharging is also available for lead acid batteries.

    Quite clearly, these batteries will not fit comfortably into our pants pockets,
    however! Most of these batteries can be sourced from motorcycles and riding lawn
    mowers. For those of us who are more technically inclined, a great source of 12
    volt lead acid batteries is UPS units. The battery shown in Figure 7.38 was salvaged
    from a broken UPS unit.


    Figure 7.38 Small Lead Acid Battery and Solar Panel


    ![](img/41991837f74596e7c29a2498b6ec56e8_326_0.png)


    This repurposed UPS battery can power a WRT54G using the default wireless power
    setting for about 24 days (roughly 573 hours). Combined with an appropriate charger,
    possibly recycled from a UPS unit, an emergency lighting unit, or via solar power,
    a WRT54G could be powered almost indefinitely. Couple with that a waterproof enclosure
    and an appropriate antenna, and it would be a perfect setup for a remote wireless
    bridge.'
