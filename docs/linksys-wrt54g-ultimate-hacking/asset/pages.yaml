  md: '# Tools & Traps...


    # My WRT54G Doesn''t Work under Kismet


    Due to the significant wireless differences in the WRT54G versions, discussed
    in Chapter 1, Kismet may not function as installed. The instructions in this chapter
    should support most versions of the WRT54G, WRT54GS, WRT54GL, and WRTLS54GS, but
    you can make the other combinations work with a few minor changes.


    Kismet''s configuration files instruct the software as what utilizes capture source,
    or wireless card, to while operating. As shown, we defined a capture source for
    our WRT54GL v1.1 in /etc/kismet/kismet.conf as source=wrt54g,prism0,wrt54g. Here
    are the other combinations for some earlier WRT54G models:


    WRT54G, versions 1.0 and 1.1:


    ```

    source=wrt54g,eth2,wrt54g

    ```


    WRT54G, version 2.0:


    ```

    source=wrt54g,eth1,wrt54g

    ```


    WRT54G, version 3.0:


    ```

    source=wrt54g,eth1:prism0,wrt54g

    ```


    And the default, as instructed earlier:


    ```

    source=wrt54g,prism0,wrt54g

    ```


    Although Kismet does support channel hopping by default, it utilizes the channel
    hopping capability in the particular wireless driver. As indicated, we disabled
    channel-hop capability. When channel hopping is disabled, Kismet will begin operating
    on the last configured channel, typically channel 6, and will stay on this channel.
    Channel hopping is a method in which you use the wireless radio to cycle through
    all available channels in the WiFi spectrum. Unfortunately, the proprietary closed
    driver provided by Broadcom for wireless radios does not support channel hopping.
    The lack of supported channel hopping will severely hinder your wardriving operations,
    as wireless access points can be configured to be on a number of channels, and
    if your Kismet installation is fixed to only one channel, much of the wireless
    environment will be invisible to you!


    You can fix this problem by creating a shell script that will manually cycle the
    radio channels in the background while Kismet is running. Before you create the
    channel-hopping script, you need to install the wl package to support setting
    the channel. You can do this by entering the following at the command prompt:


