  md: '# Working with WRT54G Firmware · Chapter 2


    The destination of the symbolic link points to a location that has been made read-only,
    as indicated by the initial /rom path (ROM stands for Read Only Memory). To edit
    this file, you need to create a writable version in /etc. With the following commands
    you can create a backup of the original symbolic link, copy to /etc/ipkg.conf


    ```

    # mv /etc/ipkg.conf /etc/ipkg-backup.conf

    # cp /rom/etc/ipkg.conf /etc/ipkg.conf

    ```


    You now need to edit the new ipkg.conf to add the additional repository. You can
    use a common text editor, such as vi, to edit this file.

    You will add a third package repository that contains the Acrack-package by inserting
    the package repository from the OpenWrt project for Whiterian 0.9 backports located
    at http://downloads.openwrt.org/backports/0.9. Another use (“src”) directive and
    provide a descriptive name for the repository:


    ```

    src openwrt-wr-09-backports http://downloads.openwrt.org/backports/0.9

    ```


    Now save the file and exit vi to update your configuration.


    > TIP You can find the vi editor on just every POSIX-based operating system on
    the planet, and as a result, it is extremely valuable to know how to use it. Although
    vi may be very Spartan in its appearance, it is in fact a powerful text editor.
    For more information on using vi, visit http://docs.freebsd.org/44doc/usd/12/vi/paper.html.


    In order to have your configuration take effect, you need to have ipkg update
    its repositories from the configuration, by issuing the following command:


    ```

    # ipkg update

    ```


    Now that you have updated the package list from all package repository, you can
    successfully install Acrack from your repository. To install Acrack-ng, you need
    to issue the following command:


    ```

    # ipkg install acrack-ng

    ```


    Once Acrack-ng has been installed, you need to modify the menu to make it function
    with Acrack-ng, as The Hacker Pims have only included the functionality for the
    discontinued version of Acrack-ng (non-ng). You need to modify lines 206 and 207
    of the menu script, /usr/bin/fahrzaus.sh, with vi. The original lines are:


    ```

    if [ -n "$ffactor" ] && [ -f "/usr/sbin/acrack" ] && [ -n "ivLoc" ]; then acrack
    $ffactor -f $ivLoc

    ```'
