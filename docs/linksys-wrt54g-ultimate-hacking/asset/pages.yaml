  md: '# Chapter 7 • WRT54 Hardware Hacking


    You also need to update OpenWrt system variables so that any packages installed
    to the SD card will function properly, and the install locations will be added
    to the default path. You will need to modify /etc/profile to accomplish these
    two tasks.


    First, need to replace the existing PATH statement with the following, new PATH
    statement:

    export PATH=$PATH:/mnt/mmc/bin:/mnt/mmc/sbin:/mnt/mmc/usr/bin:/mnt/mmc/usr/sbin


    This will add the locations for binaries located on the SD card in typical binary
    locations to the default path.

    Additionally, you need to make sure you update the LD_LIBRARY_PATH to reflect
    the new position of libraries installed on the SD card. Adding the following line
    after the PATH declaration to /etc/profile:

    export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/mnt/mmc/lib:/mnt/mmc/usr/lib


    Because our profile is read only at login, the next time we log in to the WRT54GL
    via SSH we will reload our profile. If we do not log in again, we will experience
    errors while installing packages, or running software from our SD card. We can
    also update the variables from our current session by reloading our profile:


    ```

    # /etc/profile

    ```


    In order to install or remove packages on the SD card, you need to switch to the
    ipkg command if you want the packages to end up there. For example, if we wanted
    to install tcpdump on our SD card, we would issue the following command:

    # ipkg -d switch mmc install tcpdump


    The -d switch is followed by our new shorthand location, as defined in /etc/ipkg.conf,
    to specify install on our SD card.


    ![](img/41991837f74596e7c29a2498b6ec56e8_307_0.png)'
