- img_proc: true
  md: '# Troubleshooting WRT54G - Chapter 8


    router. For a full tutorial on how to flash your router with TFTP, please see
    Chapter 1. Unfortunately, if you have made customized changes to your previous
    firmware installation, it will be lost during the reflash operation, but what
    good was a bricked router to you anyway! After performing a TFTP upload, the router
    should be fully functional.


    The last problem that you would need to rectify is a corrupted CFE. Although this
    does not often happen, it is certainly possible to corrupt the bootloader.You
    can restore the bootloader with the same debrick utility using the following command:


    ```

    wrt54g -flash:cfe

    ```


    You may notice that you did not need to erase the CFE before writing. The debrick
    utility automatically erases the CFE before working the one from CFE.BIN.

    You may be asking yourself at this point why you would want to flash your backed-up,
    corrupt CFE. Certainly, you wouldn''t! The next question you may ask is where
    you can obtain a new CFE, as they are not part of most firmware distributions.
    That question is a tricky one to answer.

    Every of the WRT54G series routers contains a different version of the CFE to
    account for differences in hardware. There is one repository that is as complete
    as possible, and it comes with a few extra utilities as well. This repository,
    part of the Skynet Repair Kit, is a full-featured set of Windows utilities from
    which you can download the most-to-date version of the utility at http://wlan-skynet.com/download/index.html.


    # NOTE


    > At the time of this writing, there did not appear to be a version of the Skynet
    Repair Kit for any platform other than Windows.


    The Skynet Repair Kit is easy to install: Simply download and run the setup executable.
    Once you''ve installed it, you can access the CFE creation utility from the Start
    menu by selecting Start | All Programs | Skynet Repair Kit | Bootloader Creator
    2.0, which will display a new window, as shown in Figure 8.4.


    # Figure 8.4 Skynet Bootloader Creator


    | PMDON / CFE Bootloader Creator | |

    |---||

    | SKYNET | MkCFE v2.0 Here we boot again |

    | Select Device: | WRT54G V1.0 | |

    | Device''s labeled MAC adress | |

    | 00 : 00 : 00 : 00 : 00 | |

    | Online-Update | Create CFE.BIN | Cancel |


