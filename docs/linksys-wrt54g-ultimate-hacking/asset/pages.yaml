    # Configuring the Firewall


    In order to manage the WRT54G that we are using a routed bridge (Figure 4,3),
    we need to adjust the firewall rules that apply to the routing process inside
    the WRT54G. The default firewall rules do not accept connections on the WAN ports,
    because we''ve put the wireless adapter in the WAN VLAN, we need to adjust the
    rules.You can easily adjust firewall rules on your WRT54G running OpenWrt by editing
    the /etc/firewall.user file. To allow management over port 22 Transmission Control
    Protocol (SSH) and port 80 TCP (HTTP), add the following rules:


    ```

    iptables -t nat -A Prerouting_rule -i $WAN -p tcp --dport 22 -j ACCEPT

    iptables -A Input_rule -i $WAN -p tcp --dport 22 -j ACCEPT

    iptables -t nat -A Prerouting_rule -i $WAN -p tcp --dport 80 -j ACCEPT

    iptables -A Input_rule -i $WAN -p tcp --dport 80 -j ACCEPT

    ```


    Then, execute /etc/firewall.user as follows:


    ```

    # /etc/firewall.user

    ```


    This script will clear all of the firewall rules and reset them, including your
    new changes. If you have enabled HTTPS management on your WRT54G, be to allow
    port 443 instead of (or in addition to depending on your level of protection)
    port 80:


    ```

    iptables -t nat -A Prerouting_rule -i $WAN -p tcp --dport 443 -j ACCEPT

    iptables -A Input_rule -i $WAN -p tcp --dport 443 -j ACCEPT

    ```


    You may also need to open a port in the firewall that will map access to a host
    plugged into the LAN VLAN. For example, if you require FTP access to your game
    system, you should add the following-rule:


    ```

    iptables -t nat -A Prerouting_rule -i $WAN -p tcp --dport 21 -j DNAT --to 10.10.10.10:21

    ```


