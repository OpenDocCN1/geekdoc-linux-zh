  md: '# Chapter 2 • Working with WRT54G Firmware


    # Table 2.10 continued Sveasoft Tailored Builds


    | Build | Description |

    |---|---|

    | Talisman VPN | Talisman VPN adds IPSec and PPTP servers to the basic branch
    feature set. This firmware is dedicated to creating a VPN endpoint. |

    | Talisman Hotspot | The Hotspot version of the firmware is ideal for creating
    a wireless hotspot, much like Ewrt. In addition to the Ewrt captive portal, Talisman
    Hotspot features its own internal Remote Authentication Dial-in User Service (RADIUS)
    and SQL servers. External RADIUS server support is also included. |

    | Talisman Mesh | Talisman Mesh is ideally suited to those looking to create a
    wireless mesh network, as a wireless Internet service provider (ISP) or community-based
    wireless network. |

    | Talisman VOIP | This version turns the base installation into a Session Initiation
    Protocol (SIP) gateway. You can use this firmware to locally terminate SIP connections,
    and forward them to outside VoIP/SIP provider. |


    Although Sveasoft Talisman has a number of tailored builds, it is not very extensible
    beyond its aims. Talisman does not fully support OpenWrt packages, as Sveasoft
    maintains its own packaging system, spkg. At the time of this writing, four packages
    were listed in the Sveasoft repository, located at www.sveasoft.com/modules/phpBB2/func=select_folder&folder_id=23.


