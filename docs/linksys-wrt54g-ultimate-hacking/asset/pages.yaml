    # Signal Strength with Kismet on a WRT54G


    One of the reasons you would deploy several Kismet Drones is to monitor for rogue
    access points. Rogue access points are wireless access points that may be installed
    in your environment, that are not permitted, and that may be providing unauthorized
    access to your network.


    One of the best ways to determine the location of a rogue access point is to determine
    its signal strength as seen by the Kismet Drone. Unfortunately, the proprietary
    source wireless drivers provided by Broadcom do not provide usable signal information!
    This puts a snag into rogue access point location using a Kismet Drone.


    It is still possible to utilize Kismet to locate access points, but it quickly
    becomes a complex process. At a minimum, Kismet Drones on WRT54G routers combined
    with a central server, and a laptop with a directional antenna, is an effective
    method.


    Continued'
