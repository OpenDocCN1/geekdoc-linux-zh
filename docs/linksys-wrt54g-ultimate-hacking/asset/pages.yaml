  md: '# Chapter 3 - Using Third-Party Firmware


    It is important to understand that the LAN port assignments in Figure 3.1 on the
    outside of the WRT54G above the LAN ports are only to correspond to the lights
    on the front of the device. They have no meaning when referring to them using
    OpenWrt, as the LAN ports are assigned numbers 0-3, and the wide area (WAN) port
    is assigned to port 4 on the switch. You can view and change which VLAN is assigned
    to a particular port by manipulating NVRAM variables:


    ```

    vlan0hname="eth0"

    vlan1hname="eth0"

    vlan0ports="3 2 1 0 *"

    vlan1ports="4 5"

    ```


    The vlanXname refer to the physical interface associated with the switching hardware—that
    is, the built-in switch represented by eth0. The WRT54G and WRT54GL have only
    a single interface (eth0); other routers may have none. The eth0 interface is
    associated to one or multiple VLANs, with one or more ports assigned to each VLAN.
    The vlanXports variables contain switch ports assigned to particular VLAN, indicated
    by number (X). Numbers 0-3 are the physical ports labeled on the back of the WRT54G
    (1–4). Port 4 is the WAN (or Internet) port, and port 5* is reserved for the VLAN
    tagging interface.


    > Need an extra LAN port? Did you know that you can change the function of the
    WAN port (the one labeled “Internet” on the back) to act like a LAN port? This
    gives you one extra switch port in cases where you just want to use your WRT54G
    as a wireless access point or switch and not use it as a router. Here are the
    NVRAM settings required to convert port 4 (the default port number for the WAN
    interface) from the WAN VLAN (vlan1) to the LAN VLAN (vlan0):


    ```

    # nvram set vlanports="0 1 2 3 4 5"

    # nvram set vlan1ports="5"

    # nvram set wan_proto=static

    # nvram commit

    # reboot

    ```


    The first command modifies the vlanports variable to include port 0, which changes
    the WAN interface assignment to vlan0; remember, number 0 corresponds to the WAN
    interface. Next, we modify the vlan1ports variable to remove port 0 from vlan1,
    leaving the virtual port 5 in case we ever want to reuse this VLAN (5 is the virtual
    tagging port that must exist in every VLAN). Then, we set the wan_proto variable
    from the default setting of dhcp to static. This will disable the Dynamic Host
    Configuration Protocol (DHCP) client for that interface because it is no longer
    necessary. All that is left is to commit the changes and reboot. Once completed,
    enjoy the extra switch port!'
