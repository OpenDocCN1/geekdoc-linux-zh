    # USB


    The Universal Serial Bus (USB) found in most modern PCs and laptops provides the
    capability to deliver 5 volts of power per provided hub, at a maximum of 500 milliamps.This
    is an appropriate amount for powering a WRT54G, as the power regulation chips
    will upscale the power levels to operate the router.


    > Not all USBs are created equal. Although there are some specific standards,
    many implementations do not follow them to the letter. There are also some different
    interpretations on the implementation specifications, depending on manufacturer.
    For more information on the caves on USB power, read the USB power section of
    Wikipedia: http://en.wikipedia.org/wiki/Usb#Power_supply.


    We can derive power from the USB using an appropriate USB connector and matching
    the appropriate polarity to the N-type connector. Figure 7.39 shows the USB standard
    A type pin out. We built our cable from an unused USB cable we had on hand, and
    we removed one end with a pair wire cutters and stripped the outer shielding to
    reveal the internal cabling. As an alternative, unassembled USB connectors are
    readily available from most electronics suppliers, such as Digi-key.'
