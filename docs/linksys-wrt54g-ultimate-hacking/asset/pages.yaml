    | JTAG | This method is for recovery purposes only and you should use it if you
    have a ''brick'', meaning there is no other way to recover the firmware. Applying
    firmware updates via JTAG can take several hours. | PC, JTAG cable, specialized
    software; refer to Chapter 7 for more information. |


    > WARNING

    To ensure a smooth and successfully upgrade you must abide by the following guidelines:

    - Be certain that your router and computer are plugged into a reliable power source.
    This doesn''t have to be a UPS powered outlet, although that would be the best
    option. Make that the plugs are firmly in place, and that the cords are not placed
    where someone could easily trip and unplug them. If you are using a laptop, it
    is plugged in and not relying solely on battery power.

    - Connect your computer to any local network (LAN) port of the WRT54G using any
    standard Ethernet cable.

    - Assign a static Internet Protocol (IP) address to your computer adapter. Do
    not use a Dynamic Host Configuration Protocol (DHCP) address. Using a dynamic
    address could cause you to lose contact with the router. You may not retain the
    DHCP address long enough communicate with the router. Even worse, you could lose
    your connection while transferring the new firmware images. This would "brick"
    your router. Refer to Chapter 8 for recovery procedures.


