    # WRT54G Buyer''s Guide


    One of the questions we hear most often is "WRT54G should I purchase?"The answer
    is always "It depends." Of course, if we keep answering this question with "It
    depends," we would not be winning any popularity contests anytime soon, nor would
    that help anyone. In response to this question, and to help you make informed
    purchasing decisions, we have created a chart that you can use for reference when
    buying a WRT54G and subsequently deciding which firmware to install on it.


    Table 1.19 lists columns, the first being "User Type."In order to get the most
    out of your WRT54G and associated hacking activities, you need to identify with
    yourself. Without getting too philosophical, we merely want to put yourself in
    a category that best defines the ways in which you will use WRT54Gs. You could
    also put into multiple categories. For example, at home you may need a stable
    and secure wireless network to which you can connect and do your work. Your day
    job may be that of a penetration tester, so you can review the recommendations
    in the category you use as well. The next column is "Features Desired," where
    we attempt to list the main features we think each user type will want. This is
    based on feedback we have received over the past several months, and our experience
    in general. Based on the data we include in the "User Type" and "Features Desired"
    columns, we list the WRT54G models, under "Recommended Model(s)" and "Recommended
    Firmware".


    We then expand on each user type and offer some suggestions and recommendations
    for various network setups. Some may seem elaborate or complex; however, they
    are built using only the projects we cover in this book. You may choose to implement
    them shown. Whatever you decide, we hope the following information provides a
    useful guide for all of your WRT54G hacking needs.'
  merge: -1
