    # Figure 4.2 Wireless Ethernet Bridge Setup


    ![](img/41991837f74596e7c29a2498b6ec56e8_189_0.png)


    # Configuring the Bridge


    The first thing you need to do is give the wr-bridge access point a proper Internet
    Protocol (IP) address that will be reachable from your network—in this case, 192.168.1.40:


    ```

    # nvram set lan_ipaddr="192.168.1.40"

    # nvram set lan_gateway="192.168.1.1"

    # nvram set lan_dns="192.168.1.10"

    # nvram commit

    # ifup lan

    ```


    Notice that we have also added a default gateway and DNS server. This is required
    so that, among other things, you can use the ipkg command to keep the box up-to-date
    with packages and install software. Next we will enable the bridge and disable
    the Dynamic Host Configuration Protocol (DHCP):


    ```

    # nvram set wlo_mode="wet"      bridged client

    # nvram commit

    # wifi

    # cd /etc/init.d

    # mv s50dnsmasq disabled_s50dnsmasq

    # chmod -x s50dnsmasq

    # killall dnsmasq

    ```


    The nas package is required for WPA, while the wl package is not, it allow you
    to do some cool things, such as look at all of the surrounding wireless networks
    and their encryption types:


    ```

    # ipkg install nas wl

    ```


    www.syngress.com'
