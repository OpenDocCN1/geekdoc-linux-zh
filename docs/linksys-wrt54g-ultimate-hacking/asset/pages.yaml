  md: '# WRT54G Remote 2.4GHz Spectrum Analyzer


    The 2.4GHz spectrum is home to numerous networking and communications protocols,
    such as 802.11b/g, Bluetooth, and even cordless phones. Being able to analyze
    this spectrum in a cost-effective manner has many benefits:


    +   - Troubleshooting wireless client connectivity problems

    - Accurately choosing the least populated channel for your access points

    - Detecting activity on all 14 802.11 channels (not limited by protocol)

    - Detecting malicious or accidental flooding of the spectrum

    - Analyzing and measuring anomalies that may cause interference (i.e., microwaves)


    In order to accomplish these tasks, you will need the Wi-Spy USB dongle from MetaGeek
    (www.metageek.net), in Figure 6.6. It is a modified wireless USB keyboard dongle
    that has been given the capability to analyze spectrum information.


    # Figure 6.6 Wi-Spy Dongle


    ![](img/41991837f74596e7c29a2498b6ec56e8_266_0.png)


    Currently, the Wi-Spy dongle works with Windows, Linux, and OS X, as both a client
    and a host for the USB dongle. For example, you could plug the dongle into your
    laptop and use to read the spectrum information, either locally or over the network.


    The OS X version of the software is called EaKi, and was authored by Dave, from
    Cookware, Inc. Cookware provides the OS X client for free, and includes a program
    called LINUX which allows you to plug the Wi-Spy dongle into any Linux host, and
    then connect it remotely with the OS X client. This is a great concept; however,
    using the dongle on a laptop presents a couple of problems. First, you must dedicate
    a laptop running Linux for this purpose. Second, you have to get the laptop to
    the area where you want to analyze the 2.4GHz spectrum. This job is much better
    suited to the WRTLS54GS router. For this to work well for you, you will need the
    following:'
