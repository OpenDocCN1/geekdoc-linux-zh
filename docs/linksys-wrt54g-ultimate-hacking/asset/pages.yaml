    # Switching among Firmware Distributions


    During the course of this book, you may want to try out different firmware distributions
    until you find the one you like. You may even want to experiment with different
    versions of a particular firmware, such as OpenWrt Kamikaze or DD-WRT beta releases.
    Before installing a new firmware distribution, it is a good idea to wipe the NVRAM
    partition, which clears out any settings from previous installations. There are
    two ways to do this. The following command is not-so-safe way:


    ```

    mtd -r nvram erase

    ```


    Use caution with this command, as it will force a reboot, and depending on your
    model/firmware, will have to reinstall a new image. Also, this does not work for
    all WRT54G series routers. Refer to the following table before running this command:


    | WRT54G Version | mtd -r nvram erase Is... |

    | --- | --- |

    | WRT54G v 1.x | Not safe |

    | WRT54G v 2.x | Safe |

    | WRT54G v 3.x | Safe |

    | WRT54G v 4.0 | Safe |

    | WRT54GL 1.x | Safe |

    | WRTLS54GS | Safe |


    However, if you are planning to install a new image anyway, it''s a good way to
    wipe out the previous firmware''s settings. A safe way to revert back to the defaults
    contained specifically within the OpenWrt firmware is to follow these commands:


    ```

    /tmp

    wget http://downloads.openwrt.org/people/kaloz/nvram-clean.sh

    chmod a-x /tmp/nvram-clean.sh

    /tmp/nvram-clean.sh

    ```


    Continued'
