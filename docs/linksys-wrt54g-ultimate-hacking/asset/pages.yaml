    # Configuring the DNS and DHCP Server Using dnsmasq


    DNS and DHCP are two of the most fundamental protocols on the Internet today.
    Whereas DHCP hosts with dynamic IP addresses, DNS is used to resolve hostnames
    to IP addresses and versa. Your WRT54G running OpenWrt (and DD-WRT, for that matter)
    uses an open source DNS/DHCP server called dnsmasq. Dnsq is a lightweight server
    that provides functionality for both DNS and DHCP, in addition to some useful
    features which we will cover shortly. If you do not plan to use your WRT54G as
    a DNS or DHCP server, refer to the last section in this chapter, “Securing Your
    Firmware,” as it details how to disable this service.'
