    # Battery Comparison


    Clearly from the preceding examples, we should expect to see some different usage
    times from different types of batteries. Our testing in preparation for this book
    revealed the capacities shown in Table 7.5.


    # Table 7.5 Battery Usage Times


    | Battery Operation | Approximate Rating | Approximate Length of |

    |---|---|---|n| AA alkaline (quantity 8) | 2.2mAh (each) | 4 hours |

