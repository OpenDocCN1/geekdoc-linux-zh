  md: '# Chapter 8 • Troubleshooting WRT54G


    # Introduction


    Occasionally, you''ll be in a position where you''ve done something bad to your
    router and can no longer interact with it. This can happen by flashing your router
    and losing power on the router or on the PC in the middle of an upload, or if
    you have set some NVRAM settings that are not valid or incorrect. A router that
    is not booting or is in an unknown operational state is “bricked”; the router
    is as useful as a brick in this state (that is to say, it is useless). Fortunately,
    you can usually recover from these problems using one or more of the methods discussed
    in this chapter.


    > WARNING

    There is significant discussion online about the ability to recover by shorting
    some pins on the flash chip, known as the voidmains mode. This method invalidates
    the flash checksum and sends the router into failsafe mode. This method may work,
    it has the potential to destroy your router''s circuit board. In the initial stages
    of researching this book, the authors rendered two routers inoperable and beyond
    repair using the pin-shorting method. There are better and safer ways to accomplish
    recovery, which we outline in this chapter. For a complete discussion, refer to
    the OpenWrt forum posting at http://forum.openwrt.org/topic.php?pid=78.


    # Using OpenWrt Failsafe Mode to Unbrick Your Router


    In the course of WRT54G hacking adventures, you may become brave enough to make
    some changes to NVRAM (VLANs, etc.), customize your firewall rules, and back up
    or restore firmware, JFFS partitions, and NVRAM partitions. All of the aforementioned
    activities could potentially “brick” your router. It is conceivable to be able
    to fix the router to your problems without starting to over or make a JTAG cable.


    Enter failsafe mode, a handy feature built into the OpenWrt distribution. During
    the boot process, OpenWrt will give you a window of opportunity to use the Reset
    button and enter failsafe mode. The Reset button does not have any preprogrammed
    function by default in OpenWrt, once the OS is running. However, during the kernel
    process (i.e., when the DMZ light is solid when the router is booting up), OpenWrt
    will respond to the Reset button being pushed. Be careful; if you push the button
    too soon (i.e., before the DMZ light is lit and when the Power light is flashing),
    it will send the “Reset button pushed” command to the bootloader.The bootloader
    may cause your router to restore to factory defaults!


    ![](img/41991837f74596e7c29a2498b6ec56e8_341_0.png)'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Troubleshooting WRT54G • Chapter 8


    # WARNING


    > Fafe mode works only with OpenWrt Whiterussian RC5 and later. This means you
    must already have this firmware installed in order to use this feature. If you
    have some other firmware installed, the Reset button may do something different,
    such as restore to factory defaults!


    To enter safe mode, do the the following:


    +   1. Unplug the power from the WRT54G router. Using the same precautions as
    listed in the Trivial File Transfer Protocol (TFTP) installation instructions
    in Chapter 2, plug a laptop or PC into any of the local area network (LAN) assigned
    ports. Even if you have switched the wide area network (WAN) port to be a LAN
    port, you must be certain to plug into the predefined ports.


    +   2. Install the recvdup program on your computer. This is a small program that
    will listen for the special User Datagram Protocol (UDP) packets as are seen by
    the router during the boot process. You can find the source code at http://downloads.openwrt.org/people/nbd/recvdup.c.
    In addition, precompiled binaries for UNIX and Windows are located at http://downloads.openwrt.org/people/florian/recvdup.
    An alternative to this program is to use tcpdump (or windump on Windows) and capture
    packets on UDP port 4919. You may wonder why they chose 4919 as port. If you convert
    4919 to hexadecimal, you get 0x1337.


    +   3. Once you''ve installed the program, you can run it by typing ./recvdup
    (or recvdup.exe in Windows) from the command line, or start your packet capture
    with tcpdump with the command tcpdump -i <interface> -X -s 100 ''udp port 4919''.
    This command will grab the first 100 bytes (-s 100) of each UDP packet on port
    4919. The -X parameter tells tcpdump to output the header and ASCII values of
    the packet payload, and -nn says not to resolve hostnames or services.


    +   4. Now power on your router, and as it boots, you will see a message that
    reads Msg from 192.168.1.1: Press reset, to enter Failsafe! Immediately press
    and hold the Reset button for two seconds.


    +   5. If successful, you should see the message Msg from 192.168.1.1: Entering
    Failsafe! and booting continue.


    +   6. Once the router has finished booting, you can tel to 192.168.1.1 without
    a password and have access to the command line. During failsafe mode, the Power
    and DMZ LEDs will keep blinking.


    ![](img/41991837f74596e7c29a2498b6ec56e8_342_0.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# NOTE


    There are no precompiled recvdup binaries for Linux, so you will need to compile
    one yourself. Assuming that you use the gcc C compiler for your Linux system of
    choice, you can compile it with the command gcc -o recvdup recvdup.c. This command
    calls the gcc C compiler, and will create the output file (with -o) of recvdup,
    from the source file of recvdup.c.


    # NOTE


    Pressing the Reset button at the right time might be tricky, so don''t become
    frustrated if it doesn''t work the first time. Try it again, being certain to
    press and release the Reset button according to the instructions.


    Your router will contain only the settings from the SquashFS (read-only) file
    system, and not any changes written to the JFFS (writable) partition. From here,
    you can reset your NVRAM variables (mtd -r erase nvram), or revert to the original
    JFFS partition using the first command. Additionally, you can mount your JFFS
    partition with the /sbin/mount_root command.


    Failsafe mode also allows you to restore from a backup, as outlined in Chapter
    3.


    > Notes from the Underground...


    The "Other" Hardware

    Although this book is focused on the WRT54G series hardware, you can successfully
    recover other hardware platforms using OpenWrt''s failsafe mode.

    First, let''s start with the WRT54G family. You can recover the WRTLS54GS using
    OpenWrt''s failsafe mode. However, the timing might be slightly different on model.
    Timing in general will depend on the router''s bootloader version, so don''t be
    afraid to experiment with different timings.

    Other hardware, such as the Asus WL-500G Premium, is fully supported by OpenWrt,
    and uses very similar hardware. Recovery on this device requires experimentation
    with timing:

    * When you initially press the Reset button

    * How long you wait before pressing it again'
