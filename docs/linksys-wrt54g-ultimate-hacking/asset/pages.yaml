  md: '# WRT54G Fun Projects • Chapter 4


    After your new reboot, Kismet will be able to monitor all 11 channels. Alternatively,
    you can start the script immediately by executing /usr/bin/chanhop &.


    # Are You Owned?


    As an astute reader, you may notice that the channel-hopping script is missing
    channels 12 through 14, which are available in locations outside the United States.
    Certainly we need to be able to detect a wireless network on at least the first
    11 channels (1 through 11), as nefarious individual can certainly use those channels
    anywhere where in the world. However, it is possible for another party to violate
    any FCC (equivalent regulatory agency) regulations in order to avoid detection.
    Remember, a determined attacker (whom you may be trying to detect) will not always
    obey federal regulations while potentially breaking other layers!


    We can resolve the missing-channels problem by enabling them with an NVRAM setting
    to allow channels 12 through 14. Please note that the authors do not condone violating
    any government regulations! With that said, we can enable the additional channels:


    ```

    # nvram set wl0_country_code=All

    # nvram commit

    ```


    We also need to update the startup script to reference the additional channels
    already included in the script. We can do this by modifying the /etc/init.d/s95chanhop
    script and replacing the -b switch to option the channels 1 through 14, which
    are authorized for use in Japan:


    ```

    #!/bin/sh

    /usr/bin/chanhop.sh -b IEEE80211JP -p openwpt

    ```


    We will need to reload the NVRAM variables before wl can take full use of the
    additional channels.


    # The Finishing Touches


    We have only a few more steps to perform before our wardriving-in-a-box WRT54G
    is complete! As mentioned in the beginning of this hack, we need to be able to
    measure our physical location with a GPS receiver, which is approaching one of
    the final steps that we need to perform.


    With our GPS receiver powered on, locked to our satellites ,and to the serial
    port on our router, we need to configure the GPS software to acquire location
    data, and be able to provide the coordinates to Kismet. In order to interface
    with the GPS, we need to use the GPSd package.


    ![](img/41991837f74596e7c29a2498b6ec56e8_184_0.png)'
