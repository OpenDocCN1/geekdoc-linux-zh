  md: '# Configuring OpenWrt Using nvram


    The nvram command allows you to manipulate the configuration settings contained
    within the reserved 64KB of flash memory known as NVRAM. Using the nvram show
    command will display a list of the configuration variables and their value. The
    nvram get <variable> will show you this variable''s value, and nvram set <variable>=<value>
    is the command to change the variable''s value. Here is an example of how to change
    the device SSID (or wireless network name):


    ```

    # nvram get wlo_ssid

    OpenWrt

    # nvram set wlo_ssid="GetPwn3dHere"

    # nvram get wlo_ssid

    GetPwn3dHere

    # nvram commit

    ```


    First, we use the nvram get wlo_ssid command to retrieve the current SSID assigned
    to the access point. Next, we change the default SSID (always a good idea) using
    the nvram set command from "OpenWrt" to "GetPwn3dHere". We must always remember
    to write the changes to memory (RAM) to the NVRAM and committing the variable
    by executing the command nvram commit. Although changing NVRAM to flash stores
    the variable and value, you may need to run other scripts or programs (or even
    reboot the device) to really apply those values. In the examples that follow,
    we will specify the actions that need to be taken in order for your changes to
    take effect. For the preceding changes to take effect, you will need to run the
    command /sbin/iwconfig, which applies the current wireless configuration.


    ![](img/41991837f74596e7c29a2498b6ec56e8_128_0.png)


    # Fear of nvram commit-ment?


    Throughout this book, we recommend that at the end of NVRAM modifications using
    the nvram set command, you completed the commands with an nvram commit. The final
    save nvram commit will copy the nvram contents from memory (RAM), and will save
    a copy to flash, allowing it to survive a reboot.


    However, for testing purposes, you may wish to omit the nvram commit, and make
    the changes active with the appropriate commands (such as /sbin/iwconfig in the
    case of wireless changes). This will allow you to perform a reboot, and revert
    to the previous NVRAM settings if something go wrong, or if the settings are not
    desirable.'
