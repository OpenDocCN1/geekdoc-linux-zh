  md: '# Introduction


    The road to third-party firmware has been one long, at least the computer industry
    is concerned, and the changes to the WRT54G series of hardware have been many.
    In this chapter, we will discuss our approach to this book, the history of the
    WRT54G product line and its variations, and the history behind the development
    of third-party firmware.


    # Our Approach to This Book


    This book is meant to document many of the features, projects, and interesting
    and fun things in general that you can do with the WRT54G series of routers from
    Linksys. Everyone should read this chapter in its entirety before moving to other
    chapters in the book. Whether you own one WRT54G router or one of each model in
    the series—or even if you have to purchase a WRT54G—you should read this chapter
    before reading any other. It will give you a map and a history of this hardware
    and help you decide which model to purchase and/or your current hardware will
    do what you want it to. If you do not own a WRT54G, or you have just an old one
    in the corner, please note that we believe everyone should have at least two WRT54Gs
    at their disposal. Many of projects we cover in this book will require at least
    two routers, or will benefit performance-wise with at two routers because you''ll
    be able to split the processing load among them. And don''t worry; the prices
    of these devices have come down over the years, making them affordable for even
    penny-pinching college students.


    In this book, we have taken a “top-down” approach to teaching you how to make
    the most of the WRT54G platform. For instance, we show you by example how to configure
    and use these devices in various ways. In addition, we selected and documented
    each project and use devices carefully to ensure practical usage. Yes, we could
    show you our web site, database and all, but this is certainly not advisable.
    There are proper uses for your WRT54G, and there are some who stretch the limits
    so far that they are not practical. On the flip side of practical is practical,
    well, just plain and we''ve made to include projects in this book as well. In
    each instance, we attempt to fully document the use case, based on extensive testing
    we''ve conducted in our own home and work environments. We included enough details
    about embedded devices, operating systems, and software engineering as we thought
    you would need, and we provide resources for those of you who want more details
    in these areas. We want this book to expand the audience of the WRT54G platform,
    and embedded device usage as a whole, unlocking the potential that platform has
    to offer.'
  merge: -1
