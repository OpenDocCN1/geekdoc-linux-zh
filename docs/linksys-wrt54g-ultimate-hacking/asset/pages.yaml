  md: 'Chapter 1 • WRT54G Fundamentals


    # Are You Owned?


    # Applying the Latest Linksys

    ware for the WRT54G, Versions 5.0 and 6.0


    The average consumer will purchase a router, plug it in, make it work, and forget
    about it. Usually somewhere

    the line, problems begin to occur. Maybe the router is locked up and you have
    to

    power-cycle it before it becomes operational. Maybe operation is slow, either

    randomly or on an ongoing basis. What could all this mean?


    The most common cause is that the firmware has not been kept up-to-date, and

    with respect to the version 5.0 and 6.0 platforms, the consequences can be truly
    dis-

    astrous. These models were the first to use the new VxWorks-based firmware,

    they tend to contain bugs. In fact, the initial firmware version was 100.0, and
    those

    of us familiar with software development life cycles know that 1.0 revisions are
    typ-

    cally full of bugs, and this is no exception. The release notes provided by Linksys
    doc-

    ument numerous bug fixes as the version numbers increase. Some of the fixes include:


    +   - Resolves issues with slow downstream speeds


    +   - Resolves issues with instability when using BitTorrent


    +   - Resolves SSH issue with disassociation to inactivity


    +   - Resolves issues with accessing online game servers


    And those are just a sample of the problems that have been fixed! The first one,

    slow downstream speeds, is obvious and could be related to the problem

    stability when using BitTorrent. We will provide some tips and details on these

    issues through the book; for now, note that you can solve most of these issues

    by installing third-party firmware. Losing the terminal (SSH, Telnet) connect-

    s can be very annoying, and it is a problem most immediately reported by

    users, in addition to not being able to play games online.


    Another reason to stay with firmware upgrades is security. On

    August 4, 2006, a security researcher going by the name of "Ginu Rabbit" posted
    a

    vulnerability to the Full-Disclosure mailing list that describes two vulnerabilities
    in the

    VxWorks 1.0.0 firmware release (http://lists.grok.org/ui/pipermail/full-disclo-/2006-August/044895.html).
    One of these vulnerabilities allows anyone with HTTP

    Web GUI access to make configuration changes to your router. Linksys simply fixed

    t vulnerability in the 1.0.10 firmware release (by silent, we mean it was not
    men-

    tioned in any of the release notes). An attacker would need access to the LAN
    network

    assigned to the WRT54G in order to exploit this vulnerability. However, an attacker
    can\easily craft a Web page that sends the crafted HTTP request to the router
    to exploit


