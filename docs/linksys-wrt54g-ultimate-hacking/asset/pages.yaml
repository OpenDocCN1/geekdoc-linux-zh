- img_proc: true
  md: 'If the debrick utility does not auto-detect your hardware, you can force it
    to use a specified chipset by specifying the *Ifc:<value>* switch on the command
    line when executing the utility. To determine the correct value for your chipset,
    execute the debrick utility without any command-line options to display the built-in
    help. The built-in help contains all of the values for the chipsets that are supported.


    # Tools & Traps...


    # Watchdog Guard Dog


    During all of your JTAG operations with the debrick utility, you will see some
    output about Clearing Watchdog. This watchdog is a protection mechanism built
    into the CFE (discussed in Chapter 2) to determine whether any undesired access
    to the CFE is performed (your activity may be considered undesired according to
    the manufacturer). This watchdog is set to a predefined internal timer, and when
    the timer is triggered, the watchdog terminates all JTAG operations.


    This termination will be fatal to flash-writing operations! Without the watchdog
    disabled, a write of CFE to flash will halt, and will fail at 3 percent. This
    partially written state will be nonfunctional!


    In order to perform a successful write, and for you to gain “undesired” access,
    you will need to disable the watchdog. Occasionally, it will fail, and some success
    can be had by adding the *noem* option. The *noem* switch is intended to disable
    memory writes, but it still allows memory open and provides some additional interaction
    with the watchdog shutdown.


    If your JTAG cable does not detect that a router is installed, or is unable to
    communicate with the flash chip, refer back to Chapter 7 and verify the construction
    of the JTAG cable. This is the cause for most problems between the PC and the
    router when using a JTAG cable.


    In order to reviving your bricked router via JTAG, you will want to back up your
    current flash memory contents. You may remember from Chapter 2, the flash chip
    is divided into three major sections: CFE (or input/output system [BIOS]/bootloader),
    kernel (or firmware or operating system, possibly OpenWRT), and NVRAM (where configuration
    variables are stored). Typically, you will to back up your CFE and NVRAM, while
    ignoring the kernel. You typically ignore the kernel backup, as the kernel is
    large and due to the speed of the JTAG interface, it can take up to six hours
    to perform a backup (or install) of the kernel. Later in this chapter, we will
    show you a more effective method for writing the kernel and foregoing a backup.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Troubleshooting WRT54G • Chapter 8


    In order to begin your backups, you need to add some command-line switches to
    the execution of the debrick utility. First, back up the CFE with the following
    command:


    ```

    # wrt54g -backup:cfe

    ```


    The debrick utility will connect to the router and begin copying the contents
    of the CFE on the PC, named CFE.BIN.SAVED_<datestamp>_, in the same directory
    as the debrick utility. Once complete, it will notify you of the completion status
    and return to you the command line. Back up your NVRAM with the following command:


    ```

    # wrt54g -backup:nvram

    ```


    Again, the debrick utility will connect to the router and begin copying the contents
    of the NVRAM to a file on the PC, named NVRAM.BIN.SAVED_<datestamp>_, in the same
    directory as the debrick utility. Once complete, it will notify you of the completion
    status and return to you the command line.


    > WARNING

    Before executing multiple debrick utility commands that read or write to the flash
    chip, it is always a good idea to reboot the router in between commands. This
    will ensure that the router and the CFE are in an appropriate state for each command.


    ![](img/41991837f74596e7c29a2498b6ec56e8_348_0.png)


    # Backing Up the Entire Flash Chip


    Although we suggest that you skip backing either the kernel or the whole flash
    chip, it is entirely possible to do so. Even though the usefulness of backing
    up the entire flash on a bricked unit is dubious, it may be useful for other situations.

    In order to back up the entire flash chip, you can still utilize the debrick utility.
    To perform the backup, issue the following command.


    ```

    # wrt54g -backup:wholeflash

    ```


    Depending on the size of the flash chip of the WRT54G model you are attempting
    to back up, this process can take from six to 24 hours to complete! This is because
    of the limited amount of bandwidth over the JTAG connection, and the large size
    of the whole flash chip.

    Another reason, besides time constraints, you should avoid backing up the whole
    flash on a bricked router is that the three major flash sections are combined
    into one file instead of being split into individual, easily restorable files.


    Continued'
  merge: -1
