    To test the DHCP server you can use any clients that support DHCP. Windows systems
    work well to identify the DHCP server on same subnet as your router and configuring
    the network interface for DHCP. Then start a command prompt (go to Start | Run,
    type cmd.exe, and click OK). Review the results and be certain that your machine
    received the appropriate IP address, subnet mask, default gateway, and DNS server.

    If all that looks good, you are ready to move on to the next step, assigning a
    fixed IP address via DHCP. To enable this, add the following lines to your /etc/dnsmasq.conf
    file:


    ```

    # use /etc/ethers for static hosts; same format as --dhcp-host

    # <hwaddr> <ipaddr>

    read-ethers

    ```


    The preceding directive tells dnsmasq to read the static MAC address to IP address
    mappings from a file. Save and edit this file, and create a new file that contains
    the mappings:


    ```

    # cat /etc/ethers

    00:04:75:F7:B0:BE 192.168.1.45

    <CTRL-D>

    ```


    This tells dnsmasq every time a device with a MAC address of 00:04:75:F7:B0:BE
    makes a request for an IP address, give it the 192.168.1.45 IP address. To enable
    your you must once again stop and restart dnsmasq, as you did earlier:


    ```

    # killall dnsmasq

    # /etc/init.d/S60dnsmasq

    ```


    Now you are ready to start using the enhanced DNS and DHCP server configuration.
    It would be best to have at least two DNSs on your network in case one fails.
    You can do this easily using earlier configuration examples.


