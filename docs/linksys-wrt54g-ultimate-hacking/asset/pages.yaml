  md: '# Chapter 1 • WRT54G Fundamentals


    laptop, passing it along the Ethernet connection to “wrt-inet” for Internet access.
    This setup helps increase performance by putting all of the wireless processing,
    including encryption and decryption of wireless frames, on the “wrt-apt” access
    point.


    # Recommended Firmware


    Because a power user may not be a computer professional proficient in command-line
    usage, we recommend DD-WRT be installed on both of these routers. It will easily
    allow you to set up a WPA-PSK wireless network, and separate traffic through VLANs
    via the Web interface.


    # Typical Geek


    The typical geek is someone who has everything in the power user set, and more,
    including the urge/need/desire to tinker with the hardware and experiment with
    different software. First, lets define the practical need. A geek has multiple
    computers, laptops, gaming devices, media extenders, and/or handheld devices.
    Typical geeks also have typical geeks friends who visit on occasion and require
    access to the Internet, either with a laptop or a handheld device. The purpose
    of the visits could be specific well, such as having a LAN party or recording
    a podcast (such as PaulDotCom Security Weekly, http://pauldotcom.com/security_weekly/).


    # Recommended Models and Firmware


    This setup can be pretty elaborate. For practical usage, we recommend WRT54GL
    routers, which are made for hacking and support all the popular third-party firmware
    packages. The setup described in Figure 1.23 utilizes four WRT54GL routers.


    # Figure 1.23 Typical Geek Network Layout


