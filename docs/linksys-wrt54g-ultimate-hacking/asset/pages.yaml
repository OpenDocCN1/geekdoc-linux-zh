  md: '# Introduction


    # Configuring and Using OpenWrt


    Once you have OpenWrt installed on your Linksys device, you can use either the
    GUI or the command line to configure its settings. We strongly recommend that
    you use the command line to configure OpenWrt. It is very powerful and allows
    you to easily implement advanced configurations. The GUI, covered briefly in Chapter
    2, allows you access only a small subset of functionality and configure only basic
    settings. This was not intentional; OpenWrt was intended primarily for developers
    in the beginning and is still working on becoming more “user friendly” with respect
    to a Web interface.Chapter will also cover X-Wrt, a Web interface that is full-featured
    and mirrors the functionality of the command line. The sections that will follow
    show you how to use the OpenWrt command-line interface and implement numerous
    configuration changes to perform tasks such as enabling the Universal Serial Bus
    (USB), Syslog, Samba, and more!


    > NOTE The version of OpenWrt used throughout this book is Whittaker version 0.9
    (which uses BusyBox v1.00), based on a Linux 2.4 kernel (2.4.30). The version
    of DD-WRT used throughout the book is DD-WRT V23 SP2.


    # The OpenWrt Command Line


    The OpenWrt command line is Linux/UNIX-based, so readers who are familiar with
    those platforms should be very comfortable. For those just starting with the Linux/UNIX
    command line, remember one thing: Don’t be afraid of it. Think of the command
    line as merely a different way to configure your device. Instead of clicking your
    way around, you need to know which commands to enter. The following sections offer
    a good introduction to the command line, even for the most novice user.


    > TIP The command line in OpenWrt is handled by BusyBox (www.busybox.net). BusyBox
    is a small, single executable that combines many Linux/UNIX commands. It has a
    small footprint and is extremely modular, allowing you to add or remove components
    to your needs. For complete documentation on all of its commands, see www.busybox.net/downloads/BusyBox.html.
    Please note that not all of these commands may be built into OpenWrt.


    ![](img/41991837f74596e7c29a2498b6ec56e8_127_0.png)'
  merge: -1
  pgno: 127
