- img_proc: true
  md: 'You can perform Remote Spectrum 2.4GHz Spectrum analysis with a WRTLS54GS and
    a Wi-Spy dongle.


    EaKiu is the client tool to use with a remote Wi-Spy dongle attached to a WRTLS54GS.


    # WRTSL54GS and CDMA Internet Connection


    You can use a CDMA device, connected to the Internet, to bypass external firewalls.


    You can interface the CDMA modem with PPP.


    You use NVRAM variables to change the default WAN connection to the CDMA USB adapter.


    # WRT54G Wireless Captive Portal Password Sniffer


    Rogue Squadron from the Shmoo Group provides a customizable, fake portal for acquiring
    passwords.


    Passwords acquired with the Rogue Squadron portal are stored on the device, and
    must be periodically retrieved.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: Why isn''t channel hopping supported natively with a Kismet Drone?


    A: The proprietary nature of the drivers for the Broadcom wireless drivers has
    prevented native channel hopping. Due to the lack of documentation from the manufacturer,
    support for native channel hopping has not been able to be determined.


    Q: Are other Bluetooth tools available under OpenWrt?


    A: As of this writing, no other Bluetooth tools exist for OpenWrt. However, it
    may be possible to port some existing tools to this platform.


    Q: Why should I pick a USB CDMA modem over a PCMCIA one?


    A: Many mobile technologies have dropped PCMCIA support for Express/34 slots,
    which are not compatible with each other. USB ports are featured on just about
    all modern (and not so)'
