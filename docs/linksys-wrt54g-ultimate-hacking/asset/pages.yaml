  md: '# Chapter 3 • Using Third-Party Firmware


    Q: What is the best way to provide additional storage on a WRT54G?


    A: Samba, and specifically the CIFS file system, works well to mount remote Samba/Windows
    file shares to provide additional storage.


    Q: I really like OpenWrt, but I am not familiar with the command line and the
    GUI that comes by default is limited. What are my options?


    A: X-Wrt, although still in beta, is an excellent choice for a Web interface until
    you can become comfortable with the command line. Each task you perform in the
    GUI is translated to the command-line equivalent and displayed to you on the screen
    while you are committing the changes.


    Q: How do I see how much space is left on the flash device?


    A: Issuing the command `df -h` will list each mounted volume, the available disk
    space, the used disk space, and the total disk space for each in human-readable
    format.'
