  md: '# Introduction


    In this chapter, we will explore how the WRT54G series hardware can help you perform
    penetration testing and vulnerability assessments. However, you do not have to
    use it for these purposes. We present the material in this fashion because this
    is how we are using it. Feel free to use the examples in this book for your own
    purposes; fact we encourage you to do so! Specifically, you can use the examples
    that follow to:


    +   - Set up your own OpenVPN server for home or office use

    - Set up your own WRT54G OpenVPN client to connect to other OpenVPN servers

    - Deploy Kismet Drones and remote 2.4GHz spectrum analyzers for troubleshooting
    wireless connectivity problems

    - Travel with your WRTLS54GS Code Division Multiple Access (CDMA) Internet connection
    and use it for General Internet access for you and your friends


    The only project listed in this chapter, that having some fun with your friends,
    is solely geared towards penetration testing is the wireless captive portal that
    logs all usernames and passwords (Airsnaf-Rogue Squadron).However, you could also
    use this for demonstration purposes to show the risks of using open wireless hotspots,
    but remember, always use it with permission.


    # Tunneling and VPN


    If you find that you need to transport data from one computer or network to another
    securely, you have probably looked into using some of virtual private network
    (VPN) technology. VPNs make it easy to transport data securely, independent of
    higher-layer applications. For example, later in this chapter we will discuss
    Kismet Drone, which sends raw packets to a Kismet server over the network. The
    Kismet protocol does not implement encryption; however, if you send it across
    a VPN, the Kismet and wireless traffic will be secured by the VPN protocol and
    protected from prying eyes.


    VPNs are also very useful for connecting remote clients to networks. For example,
    you may have a WRT54G at home that you would like to set up as an OpenVPN server.
    This will allow you to connect to your network at home from any point on the Internet
    over a secure tunnel, and access all of the computers and network resources available
    on your home network.'
