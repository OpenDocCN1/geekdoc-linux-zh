  md: '# Notes from the Underground...


    # Increasing Radio Power: Avoid a Fire


    One nice feature of third-party firmware for the WRT54G platform is the ability
    to

    change the radio transmit power (TX Power). The default setting for Svesoft is
    50

    W, and the default Linksys firmware does not allow you to change this. As a function-

    of the wireless card, the TX power is 89mW.


    Using one of the firmware add-ons discussed in this book you can increase it all

    to the 251 mW, the hardware maximum for all WRT54G models, including the

    WRT54G, WRT54GL, and WRT54GS. The Svesoft firmware indicates that you can

    increase the power to 1000 mW; however, the wireless chipset will not output

    more than 251 mW. This artificially increased setting with Svesoft is so that
    it can sup-\port additional devices other than Linksys hardware.


    > CAUTION: Increasing your radio power beyond 89mW could cause overheating,

    and potentially melt your WRT54G, and even cause a fire.


    For more information about signal strength and antennas, please refer to

    Chapter 7.


    # Who Should Use This Firmware


    Svesoft Talisman is a great firmware solution for those who have a fear of the
    command line,

    an want to use GUI management through a Web browser for all manner of configuration.You
    will

    pay the price for GUI management, in the form of $20 licensing and support fees
    you pay.

    Additionally, the other flavors of the firmware are equally robust with GUI management,
    and

    also also recommended for those with a fear of the command line and specific requirements.


    Please note the ongoing issues surrounding Svesoft and OpenWRT regarding GPL licensing,
    and

    Svesoft'' alleged violation. If you choose to utilize Svesoft, it may be beneficial
    to keep a watchful

    ey on the situation, as it may directly affect Svesoft''s business model.


    # HyperWRT


    # Background


    HyperWRT''s original goal was to add some limited features to the Linksys firmware,
    main-

    taining a very similar look and feel to stock the Linksys firmware. Initially,
    HyperWRT''s claim to

    fame was to increase the wireless transmit power, but it has now other functionality.

    Timothy James created the original HyperWRT firmware in 2004, and developed in

    2005, when a developer named Rupan adopted the project. Later in 2005 two developers,
    Thibor and

    tofuku, took over HyperWRT development, creating two separate forks of the project.
    As a result'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Working with WRT54G Firmware · Chapter 2


    of these forks, many differences were evident in the separate versions. Although
    both Tibor and toof worked together and shared many features, there were plenty
    of gaps and confusion. Most notable was the support for the newer WRT54GL models
    in toof, whereas Tibor did not support it.


    In early 2006, toof elected to start development on his fork of the HyperWRT firmware,
    and provided the code to Tibor. Shortly thereafter, Tibor was able to incorporate
    all of the features from toof previously missing in Tibor fork. As a result, there
    is now only one official HyperWRT port. This single, official version has reduced
    confusion regarding which firmware needs to be used for each device. Tibor has
    been able to support the WRT54GL with the integration of the toof codebase.


    > Site for the original HyperWRT project still exists at www.hyperwrrt.org, even
    though development on this original firmware has ceased. You can find the currently
    supported HyperWRT release, HyperWRT Tibor, at www.thibor.co.uk.


    > You can install HyperWRT with the standard Web and TFTP methods described earlier
    in this book. Upon installation, you can access it via the Web interface with
    a blank username and a password of admin.


    # Features


    HyperWRT looks almost identical to the original Linkys GUI Web management console,
    as shown in Figure 2.21.


    2.21.


    This interface keeps much of what makes the Linkys interface very comfortable
    to many home users.


    HyperWRT has included many features that have been missing from much of the stock
    Linkys firmware, including the ability to adjust wireless transmit power, without
    the cost of the Sveasoft firmware. You can find the wireless transmit power under
    the Web management menu, under


    Wireless | Advanced Wireless, as shown in Figure 2.22.'
