    # # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: Should I use the Web or TFTP method of installation?


    +   A: Most users will feel more comfortable using the Web method of installation.
    It allows you to easily select the new firmware from the Web GUI and install it
    to flash.


    +   Q: When I install third-party firmware using the TFTP method I get the error
    “Code pattern is incorrect.” What does that mean?


    +   A: That means you are trying to install a firmware image that was created
    for a different model router. Be certain that the image file you downloaded corresponds
    to the router model you are trying to reimage. For more information on the different
    router models refer to Chapter 1.


    +   Q: When I installed OpenWrt and when first booted it asked me to change the
    password. When I tried to change it, I got an error.


    +   A: If you JFFS as your file system, you need to reboot after the initial installation.
    The file system will not be writeable until you reboot; thus, you are not able
    to change the password (which requires writing to /etc/shadow).


    +   Q: When I install third-party firmware using the TFTP method I get the error
    “Invalid Password.” What does that mean?


    +   A: That means your router has booted the PMON/CFE TFTP server and into the
    operating system. The TFTP server you are accessing is in the operating system.
    Try putting a bug in your TFTP client and the router, increasing the wait time
    using wait_time=<seconds>, and/or statically assigning the MAC address of your
    router to 192.168.1.1 in the ARP table on the TFTP client.


    ![](img/41991837f74596e7c29a2498b6ec56e8_124_0.png)


    www.syngress.com'
