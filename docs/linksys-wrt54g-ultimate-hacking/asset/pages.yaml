  md: 'Chapter 1 • WRT54G Fundamentals


    # WRT54GL, Version 1.0


    This is the first release of the WRT54GL series router, and it is almost identical
    to the WRT54G, version 4.0. The only difference we could find was a slightly different
    part number on the memory chip, the Hynix 166 MHz DDR SDRAM chip.


    # WRT54GL, Version 1.1


    There are many minor differences between the version 1.0 and 1.1 WRT54GL routers.
    The processor appears to have a slightly different model associated with it; however,
    we could find no documentation that the actual differences. One notable difference
    is the software loaded on the devices of the box. Version 1.1 has a slightly newer
    firmware, which does not matter because our goal is to replace it with something
    better anyway!


    # Linksys WRT54GS Hardware


    # WRT54GS Models


    The WRT54GS series of routers are very similar to the WRT54G routers in many ways.
    These similarities include the physical characteristics, as well as many of the
    electrical components. In the following sections, we will indicate the capabilities
    of the WRT54GS series of routers.


    The WRT54GS series of routers are typically more desirable for modification, as
    most routers in this series contains double the amount of RAM and flash of the
    WRT54G series. As we mentioned earlier, this will provide more computing and storage
    resources.


    One unique feature of the WRT54GS series of routers is a technology known as SpeedBooster
    SpeedBooster is the Linksys branding for the technology known as AfterBurner,
    developed by Broadcom, the maker of many of the chips in the WRT54G series of
    routers. AfterBurner is a technology that allows for increased wireless speeds.
    With a typical 802.11g wireless connection, the theoretical operating speed is
    54 megabits per second (Mbps). Broadcom claims that with SpeedBooster/AfterBurner
    can operate at a theoretical throughput up to 125 Mbps! It should be noted that
    AfterBurner will deliver performance gains only using a compatible client device
    that also contains AfterBurner technology.


    The AfterBurner technology has been licensed to a number of companies for use
    in their wireless products, including Berlin, Buffalo, Dell, Gateway, HP, Motorola,
    and U.S. Robotics. In addition, a number of companies have rebranded the AfterBurner
    technology under their own names; however, they are interoperable. Clearly, we
    would not be tied to only Linksys wireless cards to obtain higher-speed 802.11g
    connectivity.


    ![](img/41991837f74596e7c29a2498b6ec56e8_45_0.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Notes from the Underground...


    # SpeedBooster/AfterBurner Available Only on GS Models?


    Linksys SpeedBooster do charge a premium of about $20 for the GS series of routers,
    ostensibly for the inclusion of the SpeedBooster technology, and the increased
    flash and RAM. Through our descriptions of the GS models in this section, you
    will probably note extensive similarities in the chipsets. Our original thought
    when we began this book was that SpeedBooster/AfterBurner was a function of the
    chipsets themselves, and we figured that if there was some overlapping hardware,
    the technology would be available on both the G and GS models. We were partially
    right.


    SpeedBooster/AfterBurner is supported on all of the Broadcom BCM4712 and BCM5352
    processors, and on the BCM2050 and BCM2050K wireless chips. However, this support
    is not a function of the hardware; it is provided by the wireless driver provided
    by Broadcom on the GS units! As Broadcom does not provide the source code for
    the drivers, developers are forced to utilize the precompiled drivers included
    with the Linksys firmware. The OpenWRT (and DD-WRT) developers have included the
    GS driver by default in the firmware installations. As a result, SpeedBooster/AfterBurner
    can be enabled on G series routers!


    The Broadcom driver does verify that the hardware can support SpeedBooster/AfterBurner
    through the reading of some NVRAM variables. Under many third-party firmware installations,
    we can change our NVRAM settings through the command-line interface. We will use
    the cover of NVRAM in more depth in Chapter 3.


    In order to enable SpeedBooster/AfterBurner support on G series routers, we need
    to set the boardflags NVRAM variable from the default value of 0x0188 to 0x0388.
    After setting the proper boardflags variable and reloading the wireless driver
    (wl), we will need to tell the wireless driver to enable SpeedBooster/AfterBurner.
    We can accomplish these steps with the following commands:


    ```

    nvram set boardflags=0x0388

    nram commit

    rmmod wl

    ismod wl

    wl gmode 6

    ```


    After you have issued these commands, SpeedBooster/AfterBurner should be enabled
    on your G series router.'
