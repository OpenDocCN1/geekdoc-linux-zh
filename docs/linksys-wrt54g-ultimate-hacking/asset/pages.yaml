  md: '# WRT54G Fundamentals • Chapter 1 45


    Figure 1.23 shows WRT54GL routers in use. The “wrt-inet” is providing access for
    the entire setup, in addition to providing connectivity between wired and wireless
    clients via the “wrt-ap” access point. Wireless connectivity is being provided
    by “wrt-ap” and is using WPA encryption. WPA-capable wireless clients are able
    to connect and get Internet access. The “wrt-bridge” is being used in bridging
    mode, with the wireless capabilities being used as a client to “wrt-ap” to provide
    access for a gaming system. The fourth WRT54GL is labeled “wrt-CP” and is a captive
    portal implementing technology WiFi hotspots (as T-Mobile hotspots), “wrt-CP”
    has the sole purpose of providing Internet access for guests. The connection from
    “wrt-CP” to “wrt-inet” is an Ethernet connection and could conceivably be put
    on a separate VLAN to prevent guests from accessing the internal network. The
    firmware recommended for this setup is OpenWrt.


    # Speed Freak


    If it''s speed you''re after, we have just just the router for you. You are planning
    to make the most out of one router and want to be fast for a variety of tasks.
    These tasks could include using it for general Internet access, experimenting
    with the numerous software packages that have been ported to the WRT54G platform,
    such as Asterisk, OpenVPN, Snort, and Nessus. These are also used for penetration
    testing, which we have dedicated third-party firmware installations such as Fairza-WRT.


    # Recommended Models and Firmware


    Versions 1.0 through 3.0 of the WRT54GS contain the most flash and RAM of any
    other models. They have a whopping 8 MB of flash and 32 MB of RAM. If you plan
    to run hungry applications such as the ones listed earlier, this is the router
    for you. The firmware recommended for this setup is OpenWrt.


    # Hardware Hacker


    The hardware hacker is someone who wants to push the physical limits of the WRT54G
    platform. Examples of hardware hacking including overclocking (which usually requires
    your own heat-sync and fan to the processor), adding additional antennas, adding
    serial ports, adding flash memory, and adding USB ports.


    # Recommended Models and Firmware


    Hardware hackers can really do all the hardware hacking they wish of with the
    WRT54G series routers. However, the type of hack you are trying to perform may
    require a specific model and version number, so be certain to research the hack
    in advance. All of the hardware hacks in this book will indicate the proper model
    and version number required to do the. As general guidance, the firmware recommended
    for this setup is OpenWrt.


