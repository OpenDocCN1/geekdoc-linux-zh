  md: 'HyperWRT will act as a Wake On Lan client, generate a WOL Magic Packet, and
    send it on the LAN for the specified MAC address. If the computer is properly
    configured, this Magic Packet will turn on the destination computer, in the powered-off
    state. This is extremely helpful if you need to provide remote support to computers
    attached to the WRT54G with HyperWRT, allowing you to potentially turn on Use
    computers from a remote location.


    # Who Should Use This Firmware


    HyperWRT is an awesome, free upgrade for a home user who wants additional appropriate
    functionality on his WRT54G router without the hassle of learning the command
    line. This firmware would also be ideal for a small-business network due to the
    additional firewall configurations and Internet filtering capabilities, which
    could help to secure company commuters. These same features may be useful for
    the average home user as well.'
