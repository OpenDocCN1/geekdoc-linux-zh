    # Windows TFTP Instructions


    The Windows TFTP command behaves a bit differently than the Linux and OS X TFTP
    commands. It does not support interactive mode, and you must run it as a single
    command. Following the instructions for connecting your router before you, you
    can upload a new image using the Windows TFTP command as:


    ```

