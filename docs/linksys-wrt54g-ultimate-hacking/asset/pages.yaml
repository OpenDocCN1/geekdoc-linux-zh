    # Using JTAG to Unbrick Your Router


    In severe cases where failsafe mode won''t allow you to correct your bricked router,
    you will need to utilize a JTAG cable, which we constructed and to which we enabled
    the connection on our router in Chapter 7. In order to utilize the JTAG cable
    and port, you will need to provide some additional software on a PC.


    The required software, called HairyDaisy''s Debrick Utility, is available for
    both Linux and Windows. The source code for Linux and binaries for Windows are
    contained in the same package, which you can find at a mirror at http://downloads.openwrt.org/utils.
    You can download the HairyDaisyMaid''s Debrick Utility, from now on referred to
    in this text as the debrick utility, with a Web browser over your choice of OS.
    The PC on which you use the debrick utility must have a parallel port in order
    to connect the JTAG cable.


    The Windows installation is quite trivial. After downloading the tool, unzip the
    executable to a directory of your choice and execute it from the command line.
    To obtain a command line under Windows XP, select **Start | Run** and in the **Run**
    dialog box type **cmd.exe** and then click **OK**. In the new command prompt window,
    be sure to navigate to the correct directory where the debrick utility was extracted.


    Before you use the Windows version of the debrick utility, you need to load an
    input/output Windows driver. In the debrick utility directory, you can start the
    driver load utility with the following-command:


    ```

    loaddrv

    ```


    This creates a new window. In the **Full pathname of driver** field, you need
    to enter the full path to gevio.sys, also located in the debrick utility directory.
    In our example, gevio.sys is located in c:\hdm\, as shown in Figure 8.1. Once
    you entered the full path, click **Start**.


    > TIP The LoadDrv utility appears to be subtly broken. It would be intuitive for
    the Install button to allow you to permanently install the driver, but it does
    not. You need to restart the driver using the aforementioned process after a reboot
    if you want to use the JTAG cable again.


    ![](img/41991837f74596e7c29a2498b6ec56e8_344_0.png)'
