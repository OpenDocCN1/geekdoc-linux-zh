  md: '# Summary


    OpenWrt and DD-WRT are two of the firmware distributions which we will use as
    examples throughout this book, and they seem to be the most popular of all firmware
    distributions. OpenWrt''s primary interface is the command line; however, an ambitious
    project X-Wrt is aimed at providing a full-featured Web interface. The DD-WRT
    primary management interface is its full-featured and easy-to-use Web server.


    You may make small configuration enhancements to improve the maintainability and
    usability of your firmware, which include Samba, USB, NTP, and using the SES button
    as a WiFi toggle.


    Security is important to network every device, and WRT54G routers are no exception.
    Following best practices standards is the desire approach. This means disabling
    services that are not in use, or using encrypted protocols in favor of clear-text
    protocols.


    # Resources


    +   - http://wiki.openwrt.org/DropbearPublicKeyAuthenticationHow OpenWrt entry
    covers how to set up public key authentication, and includes details on how to
    configure clients, such as putty, and an SSH client for Windows.

    - http://linuxdevices.com/articles/AT4802795572.html An animated BusyBox tutorial
    that covers what BusyBox is, pros and how to customize your own instance.

    - dd-wrt.com/wiki/index.php/ipkg A tutorial on the ipkg command from the DD-WRT
    project, including alternative sources for packages, and other DD-WRT-specific
    configuration examples.

    - tcpdump.org/tcpdump_man.html The complete tcpdump command reference (man page),
    which includes details on all tcpdump command-line switches. For example, to capture
    all packets in their entirety and disable service and name resolution, use tcpdump
    -s0 -n i <interface>.

    - daleholley.com/linksys/linksys.html A WRT54G “cooling hack”, which details how
    one person modified a WRT54G, version 2.0, using PC chipsets and heat syncs. Use
    at your own risk!

    - http://theklleys.org/dnsmag/doc.html The main site for dnsmag, including FAQs
    and command documentation in the format of an online page.

    - http://matt.ucc.asn.au/dropbear/dropbear.html The project home page for dropbear,
    the SSH server used in many firmware distributions for the WRT54, such as OpenWrt.
    It includes a complete list of other projects using dropbear.

    - bleedsingsort.com/blackhole-dns/ An excellent article from bleedsingsort.com
    that explains how to use DNS blackholes for malware prevention, including links
    to a few DNS blackhole lists.'
