  md: '# Working with WRT54G Firmware • Chapter 2


    +   - SQUASHFS This is the safer of the two options because it is a read-only,
    compressed file system. It uses a smaller JFFS2 file system to store files that
    need to be changed. It has a common Linux file system and has some interesting
    features, such as detecting and deleting duplicates. It is commonly found on embedded
    devices, and it is recommended for new users because it can help prevent a user
    error that would leave the device inoperable. (See http://squashfs.sourceforge.net
    for more information.)


    +   - JFFS2 This file system was designed from the ground up to embedded devices,
    and more specifically GNU listed file systems that run natively on flash devices
    without using translation. This file system is not compressed, which means it
    takes slightly more space on the flash. However, it is a read/write file system
    and it is prone to user error, which could leave your device unusable. (See http://sourceware.org/jfs2/
    for more information.)


    # WARNING


    If you choose JFFS2 in versions prior to Whuterian RC6, you must reboot after
    you install OpenWrt before you can use the file system. This is especially important
    if you''ve spent time wondering why you could not change the password after the
    initial installation (which you should do, but after you have rebooted the device).
    You can do this by either unplugging the device and plugging it back in, or typing
    **reboot** at the command prompt and pressing **Enter**.


    As of Whuterian RC6, you no longer need to choose between file systems, because
    the developers made the decision to include both. Both file systems exist, OpenWrt
    utilizes a third file system, *mini_fo*, acting as a proxy to the JFFS2 and SQUASHFS
    file systems. This means you can use JFFS2 only when writes are required.


    When choosing a file system for RC6 or greater, the `<fstype>` field in Table
    2.2 will always be “squashfs”. In previous versions, you have a choice between
    the two. Regardless of file system, use Table 2.2 to choose the correct image
    for your hardware.


