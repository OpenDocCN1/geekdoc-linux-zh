  md: '# Working with WRT54G Firmware · Chapter 2


    Although FairuzaWRT is poorly documented, it is based on many tools that are widely
    documented across the Internet, which will make it easy to learn. It would also
    be very easy to take the concepts and software with FairuzaWRT to use OpenWrt
    and build your own penetration testing WRT54G suitable to your needs.


    # Sveasoft


    # Background


    Sveasoft was one of the first-party firmware packages available for the WRT54G
    platform. In the beginning, it was free. Sveasoft now requires a commercial license
    ($20 per year) which includes support through user forums (www.sveasoft.com/modules/phpBB2/index.php).
    The newer versions also offer a redesigned Web interface. The software is locked
    to five MAC addresses (due to licensing restrictions), so you will need to purchase
    one for every five routers you install. Sveasoft is now based on the OpenWrt packages
    and offers multiple firmware versions tailored to different uses: Basic, Micro,
    Hotspot, Mesh, VoIP, and OEM. There has been some recent news from the OpenWrt
    team with Sveasoft. Apparently, OpenWrt has rescinded Sveasoft''s right to redistribute
    under the GPL, as Sveasoft is apparently not releasing the modifications as required
    by the OpenWrt license.


    Sveasoft has released a number of different firmware versions since the beginning
    of the project. Although the Talisman version is the only supported version, it
    does require the paid license. The free versions, Alchemy (v1), Satori (v4), and
    Samadhi (v2), are available from Sveasoft (www.sveasoft.com/modules/phpBB2/dlman.php?select_folder&folder_id=10);
    however, appears appears they are no longer maintained and support through the
    forums is nonexistent. Also, the firmware will not work on newer hardware revisions
    of the WRT54G. It is not recommended that you use the free versions from the Sveasoft
    project.


    From the Talisman branch of firmware, several sub-builds are customized to a specific
    task, as indicated in Table 2.10.


    # Table 2.10 Sveasoft Tailored Builds


    | Build | Description |

    | Talisman Basic | This is the core of the Talisman branch. It contains all of
    the basic features one would expect from a WRT54G, plus a few enhancements, including
    those to the Web interface and wireless transmit power. |

    | Talisman Micro | The micro build of Talisman reduces the firmware size so that
    it is suitable for installation on hardware that contains only 2 MB of flash memory.
    In order to appropriately reduce the size, the functionality of PPPoE, PPTP, and
    DHCP was sacrificed. |'
