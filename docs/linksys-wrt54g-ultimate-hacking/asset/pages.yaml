- img_proc: true
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: I push the Reset button before the DMZ light come on. How can my router
    has been reset to factory defaults?


    A: When the router is booting, the bootloader may respond to the Reset button
    being pushed, forcing the firmware to return to factory defaults (using the NVRAM
    values stored in the CFE) or even brick your router (depending on the model and
    version). Always be certain that the Power light has stopped and the DMZ light
    is solid before pushing the Reset button.


    +   Q: When my router powers on, the Power light flashes and nothing happens.
    What is wrong?

    A: You may have bricked your router, in which case you need to use a JTAG cable
    to diagnose the problem.


    +   Q: I used voidmain''s method to debrick my router. However, now it won''t
    power on. How?

    A: We have to say we told you so, but we told you so. You should short the pins
    on the board itself only when all else (failsafe, JTAG) fails.


    +   Q: Can I upload a new kernel via JTAG?

    A: Yes, it is possible to upload a new kernel via JTAG (http://downloads.openwrt.org/whaterian/0.9/default/OpenWrt-brcm-2.4-squashfs.trx),
    but it can take up to 24 hours. It is more practical to upload it via TFTP.


    +   Q: How do I specify a different file to upload via JTAG with the HairDairyMaid''s
    Debrick Utility?

    A: In the current releases, it is not possible to specify an alternative filename
    to upload. It will upload only the specifically named files (CFE.BIN, NVRAM.BIN,
    KERNEL.BIN, WHOFLASH.BIN) in the same directory as the utility. Therefore, you
    need to rename the file you want to upload.


    +   Q: Is there another way to obtain CFE images?

    A: Yes, there are a few online repositories, but most are incomplete.You can find
    the one that was most complete as of this writing at http://lonewolf.hacker-nin.com/wrt/cfe.'
  merge: -1
