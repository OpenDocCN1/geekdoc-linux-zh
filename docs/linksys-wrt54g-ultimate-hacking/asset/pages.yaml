    workgroup = OpenWrt

    server string = OpenWrt Samba Server

    security = share

    ncrypt passwords = yes

    # guest account = nobody

    guest account = root

    local master = yes

    name resolve order = lmhosts hosts bcast


    [tmp]

    comment = /tmp

    path = /tmp

    browseable = yes

    public = yes

    writeable = no

