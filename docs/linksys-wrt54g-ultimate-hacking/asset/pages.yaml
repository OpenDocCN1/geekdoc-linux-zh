  md: '# Introduction


    Wireless security has been a topic in the computer security community for years,
    for very good reasons. Unsecured wireless networks can be compromised easily,
    revealing your personal information and computer files allowing your network to
    be used to attack others or to conduct various inappropriate activities. By utilizing
    multiple layers of security, including (most importantly) Wi-Fi Protected Access
    (WPA) or WPA2, you can reduce those risks.


    The examples in this chapter are based on the features of OpenWrt 0.9, the current
    release as of this writing.


    # Basic Wireless Security


    In this section, we will discuss some basic, fundamental security settings that
    you should use as part of an overall defense-in-depth security strategy. These
    security measures by themselves may not provide adequate security; however, when
    you combine them with each other, and with WPA/WPA2, you can offer improved security
    for your wireless networks. Of course, you must choose an encryption protocol
    (Wireless Encryption Protocol [WEP], WPA, or WPA2), with WPA2 being the best choice
    (the reasons for which should become clear by the end of this chapter).


    # Select a Secure Network Name (SSID)


    Too many times have organizations and individuals leak information about themselves
    in the form of the wireless network name, known as the SSID. To test this theory,
    you will need to do enable your wireless adapter and review the list of available
    SSIDs. Inevitably, you will find yourself structured as FirstName_LastName, Company,
    or Name_Location. This gives away that you are in, Company X or Person Y, and
    that is quite possible your wireless network. Use an SSID that does not give any
    information about you or your organization, if you can. For example, the following
    commands set the SSID using OpenWrt:


    ```

    # nvram set wlo_ssid="TheMatrix"

    # nvram commit

    ```


    restart the wireless subsystem with the settings:

    # /sbin/wifi


    The most an attacker could glean from the preceding SSID is the name of your favorite
    movie. Additionally, if you want an extra level of security, you should change
    your SSID often to prevent dictionary attacks against WPA/WPA2, which we discuss
    in this chapter.


    # Hiding Your SSID


    Although this might not hide you from most attackers (and certainly not from anyone
    who is reading this book) it may prevent your neighbor from connecting to your
    network. Connections to wireless networks are managed by the operating system,
    and Windows XP especially is not selective about which it connects to. For example,
    if you have a wireless network with the SSID linkays and could be connecting to
    each other''s networks without even knowing it!'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Securing Wireless Using a WRT54G • Chapter 5


    In an effort to make it less convenient for unauthorized people to connect to
    your network, you can hide your SSID by doing the following, using OpenWrt as
    an example:


    ```

    # nvram set wlo0_closed="1"

    # nvram commit

    ```


    Then restart the wireless subsystem to enable the settings:


    ```

    # /sbin/wifi

    ```


    Wireless networks that hide their SSIDs—that is, that do not include the SSID
    in the beacon frames broadcast by the access point—are known as **cloaked networks**.


    > NOTE\Microsoft Wireless Client Update, a patch for Windows XP with Service Pack
    2, KB8917021, available at http://support.microsoft.com/kb/917021, changed the
    default behavior in Windows XP. Among other things, it allows you to configure
    “Connect even if the network is not broadcasting,” which could reveal a hidden
    SSID wherever the client uses. This option with caution and be to review the aforementioned
    patch from Microsoft. This patch is not included in the default Microsoft updates
    at the time of this writing.


    # MAC Address Filtering


    In conjunction with hiding your SSID, it might also be a good idea to build another
    layer of access control in the form of Media Access Control (MAC) address filtering.
    This will configure your access to allow only certain computers on your network
    based on their MAC addresses. MAC addresses can easily be spoofed, and a list
    can be obtained from sniffing the wireless network, but why not make your attacker
    go through the trouble? To set a list of allowable MAC addresses, do the following:


    ```

    # nvram set wlo0_macmode="allow"

    # nvram set wlo0_maclist="01:02:03:04:05:06 0A:0B:0C:0D:0E:0F"

    # nvram commit

    ```


    Then restart the wireless subsystem to enable the settings:


    ```

    # /sbin/wifi

    ```


    Note that multiple MAC addresses are separated by a space.


    # Configuring WEP


    In the beginning of wireless network security, there was the Wireless Encryption
    Protocol (WEP). WEP was designed to provide an encryption layer on top of all
    communications over wireless.'
