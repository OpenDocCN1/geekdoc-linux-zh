  pgno: 364
- img_proc: true
  md: '# Table A.6 Miscellaneous Hardware and Custom Software Options NVRAM Variables


    | NVRAM Variable | Expected Value | Description |

    | --- | --- | --- |

    | boot_wait | <text> | Enables the boot wait option to pause booting in order
    to be able to recover from failures. Valid values for <text> are: on = enabled
    off = disabled |

    | wait_time | <number> | Amount of time in seconds for boot_wait to wait before
    continuing to boot, where <number> = 1 through 65,536 (recommended is 30). |

    | NC_LeaseFile | <text> | Specifies the location of the DHCP lease file, where
    <text> = the full path to the DHCP lease file. Only used by NoCat under Ewrt.
    |

    | NC_binary_name | <text> | Specifies the NoCat executable, where <text> = full
    path to the NoCat executable file. Only used by NoCat under Ewrt. |

    | NC_binary_path | <text> | Specifies the NoCat binaries, where <text> = the full
    path to the directory containing the NoCat binaries. Only used by NoCat under
    Ewrt. |

    | NC_DocumentRoot | <text> | Specifies the location of the Web pages for NoCat,
    where <text> = the full path to the NoCat document root. Only used by NoCat under
    Ewrt. |'
