    project by The Hacker Pimps (www.hackerpimps.com), and has been affectionately
    named over the developers'' obsession with the film actress, Fairiza, The Hacker
    Pimps have developed FairizaWRT as a proof of concept for a different attack vector
    for network-based security attacks. From this proof of concept, an additional
    version was developed to become a viable security penetration testing plat-'
