  md: '# Chapter 7 • WRT54G Hardware Hacking


    single AD233BK. For instance, we need to cut two traces on the top side of the
    circuit board using a razorblade. The first is between the left-hand pin of J1
    and pin 7 of the DB9 pads, and the second is between the right-hand pin of J2
    and pin 8 of the DB9 pads. Do not install the four-pin header at J1 and J2, but
    reuse one of the attached jumpers and place it on J3.


