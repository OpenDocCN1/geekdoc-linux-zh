    # Linux TFTP Instructions


    From a Linux command-line window, enter the following:


    ```

    $ tftp

    (to) 192.168.1.1

    tftp> bin

    tftp> trace

    Packet tracing on.

    tftp> timeout 60

    tftp> rxmt 1

    tftp> put openwrt-wrt54g-squashfs.bin

    ```


    When you execute the tftp command, it should ask you the IP address of the host
    in which you want to send the image—in this case, 192.168.1.1. Next, you will
    issue the bin command, telling the TFTP program to transfer the image in binary
    format, as it is a binary file and not a text (ASCII) file. In general, it is
    always a good idea to transfer files in binary mode, as if in ASCII mode it will
    try to accommodate the file format with regard to carriage returns and line feeds).
    The trace command will display and receive messages (with byte counts) to indicate
    the file progress, which helps to reassure you that the file is actually transferring
    (and the command itself reassures you that it is activated by displaying "Packet
    tracing on." after completing the'
