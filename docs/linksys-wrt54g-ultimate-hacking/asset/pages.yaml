  md: '# Chapter 5 • Securing Wireless Using a WRT54G


    Unfortunately, the group that designed the encryption methods for WEP did so in
    a vacuum, and did not consult cryptographic experts. If they had, they would have
    been told that WEP would be quite trivial to compromise.


    Although WEP is considered insecure, it is better than nothing. When utilizing
    older hardware that does not support WPA/WPA2, it is a good idea to use WEP. Although
    WEP won''t keep out a determined attacker, it will keep out the "wireless thief";
    neighbors, casual drivers, and others that may be looking for open access points.
    To configure WEP using OpenWrt, the following:


    ```

    # nvram set wl0_wep="enabled"

    # nvram set wl0_key="1"

    # nvram set wl0_keyfile="f3d6b75b435038412f246531"

    # nvram commit

    ```


    ```

    # /sbin/wifi

    ```


    The preceding code shows a 104-bit (sometimes referred to as 128-bit) WEP key
    (hexadecimal characters). If you prefer a string instead of hexadecimal characters,
    you can use the syntax `nvram set wl0_keyfile="s:mywepeystring"`. Again, you should
    not use WEP if WPA is available; however, some specialized devices (such as Voice
    over IP [VoIP] phones) may support only WEP.


    > A great site for generating WEP keys is www.andrecompanies.com/tools/wep.asp.
    Many others are available on the Internet and well. If you prefer to generate
    your own keys, you could write a shell script; see this posting, www.securityfocus.com/archive/137/439531/30/300/threaded,
    for an example.


    # Configuring WPA-Personal (PSK)


    # Introduction to WPA/WPA2 (802.11i)


    In response to the weaknesses inherent in WEP, the Wi-Fi Alliance created a new
    encryption scheme called Wi-Fi Protected Access (WPA). At the time, WPA was intended
    to closely follow the draft 802.11i specification that was in front of the IEEE.
    WPA was intended to be backward-compatible with existing hardware, access points,
    and wireless that had low processing requirements and capabilities. Although many
    wireless cards would benefit from WPA with a firmware upgrade, many access points
    would not support WPA.


    WPA contained many significant upgrades in the encryption methods used, as well
    as some other protections that plagued WEP installations. In addition to the increased
    protections, WPA'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Securing Wireless using a WRT54G • Chapter 5


    was designed to be implemented in two different modes: WPA-Personal, also known
    as WPA-PSK (Wi-Fi Protected Pre-Shared Key), and WPA-Enterprise. WPA-PSK was intended
    to be used by home and small-business consumers, utilizing a single key as a password
    for the wireless network on each access point and on each client wireless. WPA-Enterprise
    implements the key via a 802.1x/Extensible Authentication Protocol (EAP) backend
    authentication server (instead of the shared password), with software on the wireless
    client (the supplicant) to manage the WPA-Enterprise authentication and subsequent
    keys.


    WPA was an interim measure until the full IEEE 802.11 specification was completed
    and ratified by the IEEE. 802.11 became known as Wi-Fi Protected Access 2 (WPA2).
    WPA2 includes all the same features as WPA, but provides stronger encryption for
    the underlying key exchanges. WPA2 will also function in PSK and Enterprise modes,
    just as WPA does. The drawbacks with WPA2 are the more, processor-intensive encryption
    techniques, which use many older networking cards and access points will not be
    supported, and must be swapped out for newer units in order to support WPA2.


    It is theoretically possible to obtain the WPA-PSK or WPA2-PSK presared key using
    brute force attacks; however, it is not terribly easy. These attacks require incredible
    amounts of processing power, and years'' worth of effort. It is possible because
    the presared key is static, whereas the Enterprise implementation of either utilizes
    random and changing keys, making it virtually impossible to obtain the keys.


    # Are You Owned?


    Cracking WPA/WPA2 PSK

    coWPAtty(www.churchofwifi.default.asp?PageLink=Project_Display.asp?PID=95) is
    a tool specifically designed to reveal WPA and WPA2 sheared keys. This tool works
    by comparing specific, precured wireless traffic, and cycling through comparisons
    utilizing a dictionary of possible keys. This operation can take several weeks
    (or) longer to complete, depending on the size of the dictionary.


    In 2006, DEFCON 14, the Church of WiFi (a wireless security research group) coordinated
    a release of a new version of coWPAtty that supports the cracking of WPA2-PSK,
    as well as the ability to precompute the attacks against the specific wireless
    traffic needed to obtain the keys. In order to precompute the keys, coWPAtty needs
    a dictionary and the SSID of the network in which you wish to crack WPA/WPA2-PSK.
    The SSID is utilized with the network to calculate the final key that is transmitted
    over the network, so it is essential that it is included in the comparisons.


    With this new release of coWPAtty, the Church of WiFi also released a set of precomputed
    tables that was developed utilizing a 1-million-word dictionary in conjunction
    with the top 1,000 SSIDs discovered by wardrivers as reported to http://wigle.net.
    These precomputed tables, when utilized against a WPA/WPA2-PSK network with one
    of the 1,000 SSIDs, and utilizing relatively insecure shared keys,


    Continued


