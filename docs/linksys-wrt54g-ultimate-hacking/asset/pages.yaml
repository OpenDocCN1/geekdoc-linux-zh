    # Securing Your Firmware


    Many distributions come with services enabled by default in order to provide a
    better user experience. However, usability and security are typically mutually
    exclusive, and one must trade usability for security. What follows is a guide
    to securing the default installations, sometimes called “hardening,” of both OpenWrt
    and DD-Wrt. The services offered by both are identical. How you secure them is
    different in each distribution.


    # Securing OpenWrt


    The first step when trying to secure a network device is to execute a portscan
    of the device while it is on the network to see what services it is offering.
    So your strategy is to enable only those services that you absolutely need. A
    great tool for discovering the services running on your WRT54G is Nmap (secure.org/nmap).
    It runs on Linux, Windows, and Mac OS X and does a fantastic job of describing
    which services are available on the WRT54G:'
