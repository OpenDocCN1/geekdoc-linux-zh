  md: '# Components Needed for This Hack


    This hack requires a few additional components that are not provided standard
    with any WRT54G model. The additional components required are:


    +   - Ribbon cable (or appropriate wire)

    - An SD card

    - An SD card connector (either a floppy drive edge connector, or a standard premade
    SD card connector)


    You can order a premade SD card connector from an electronics supply house, or
    in the spirit of all good hardware hackers, remove one from an existing device.
    We opted to use one from an existing device that we were able to pick up at a
    local brick-and-mortar retailer in the discount bin for a few dollars.


    The standard tools that you will need for this project are the same for just about
    all hardware projects: a soldering iron, rosin-core solder de-solder, and a #1
    Phillips head screwdriver, a pair of wire cutters, a pair of wire strippers, and
    Dremel (or other rotary tool).


    # The Hack


    For this hack, you will need to connect the SD card reader to six points on the
    WRT54G board. In our example, we''ll be performing this mod on a WRT54GL, version
    1.1. This model is readily available of this writing.These instructions will also
    work on the WRT54GL, version 1.0, and the WRT54G, version 4.0. Although many of
    the concepts are the same with the other hardware versions mentioned, there are
    some differences in GPIO locations on the other models.


    > NOTE You can find the appropriate GPIO connections on the versions we do not
    mention in this chapter in the OpenWrt wiki, at http://wiki.openwrt.org/OpenWrtDocs/Customizing/Hardware/MMC.


    First, we need to note the pins on the SD card, as indicated in Figure 7.9.'
