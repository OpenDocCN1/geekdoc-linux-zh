  md: '# WRTS4G Hardware Hacking • Chapter 7


    As you can see in Table 7.1, we will need a seven-stranded ribbon cable (an equal
    amount of 18ga to 28ga wire will work as well). We need to connect the appropriate
    pins on our SD card connector to each point on the board. First, we''ll attach
    the ribbon cable to the SD card connector. Additionally, we''ve elected to connect
    our connector to the original board for more stable mounting later on. It is possible
    that the rest of the components on the board will cause either the SD card or
    the WRT not to function. We were able to isolate the connector that we are attaching
    by using a razor blade to cut all of the traces on the board around the connector.


    We should note that we elected to identify pin 1 of the SD card connector with
    the red marker on the ribbon cable. It is important to make these distinctions
    to avoid mistakes when wiring your connections. When recycling a floppy drive
    cable for a ribbon cable, it is important to mark the cable for sanity''s sake
    as well A line drawn with permanent marker down the side of the ribbon cable well.


    With a floppy drive cable connector, the connection of the ribbon cable is a little
    bit simpler. Removing the back of the connector will reveal a series of metal
    teeth. The teeth are aligned in two rows, each corresponding to either side of
    the internal connector, as shown in Figure 7.11.


    # Figure 7.11 Teeth Corresponding to Floppy Connectors


    ![](img/41991837f74596e7c29a2498b6ec56e8_296_0.png)


    We will need to pick a point on our floppy edge connector so that we can line
    up the pins on the card, and translate that to the teeth. We decided to use the
    key marker on the inside of the connector to line up with the unused pin 8 of
    the SD card, as shown in Figure 7.12.


    # Figure 7.12 Lining Up the SD Card to the Floppy Connector


    ![](img/41991837f74596e7c29a2498b6ec56e8_296_1.png)'
  merge: -1
