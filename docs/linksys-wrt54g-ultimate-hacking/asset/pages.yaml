    # Tools & Traps


    # Testing Pin Connector Connections


    It is extremely important to make sure that the pin connectors are wired properly
    in order to prevent damage to your router. One common way to do this is to verify
    electrical continuity from the end of the attached ribbon cable to the connector
    of the pin connector with a multimeter. By clearly, examining the pin connector,
    you can see that most multimeter probes will not fit inside the connector.


    In order to resolve this problem, you can utilize an additional, unused pin header
    inserted into the pin connector. This will extend the electrical connection outside
    of the connector where you can accurately test it with a probe. If a spare pin
    header is not available, you could utilize one already attached to the board by
    measuring the external point on the reverse of the circuit board. In a pinch,
    a paper clip or the leftover wire from a trimmed resistor can be inserted into
    the pin connector and used


    Continued'
