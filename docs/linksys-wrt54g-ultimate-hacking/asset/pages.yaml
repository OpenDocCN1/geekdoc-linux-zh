    # Notes from the Underground...


    # Boardroom and Conference Room Bluetooth


    One fantastic place to set up a WRTLS54GS for some effective Bluetooth scanning
    is in the boardroom, or in a popular conference room in the facility in which
    you are testing. This setup will have the “victims” bring their devices to you,
    in the boardroom. Clearly these types of rooms will frequently be occupied by
    company executives, or other individuals that may have access to privileged information.


    We have intentionally set the scan interval to 30 minutes, during those times,
    we are likely to scan a room full of Bluetooth devices attached to important people!
    As an added benefit, any errors from Bluetooth scanning on the users’ devices
    (such as asking for a pin) can be easily blamed on another device in the room,
    inadvertently trying to create a connection to a phone.


    As an added benefit, many of the new conference room equipment is now being shipped
    with Bluetooth! It would be great to know that you could capture the latest confidential
    sales presentation transmitted Bluetooth to the projector (such as Sanyo’s PLC-EF10NZ
    or Toshiba’s TLP-X20 or TLP-X21), or via a Bluetooth microphone (such as the Sony
    ECMHW1).


    In most cases, the modern boardroom or conference room will feature power and
    network connectivity built into the table! This makes for a convenient place to
    power and provide a WAN connection to a WRTLS54GS. A little duct tape to the underside
    of the table, and it is likely that no one will be the wiser.'
