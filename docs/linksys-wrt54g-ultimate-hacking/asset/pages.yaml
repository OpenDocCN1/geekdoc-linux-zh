  md: '# Chapter 7 • WRT54G Hardware Hacking


    You can check the output of dmesg by issuing the dmesg command. The last few lines
    of output should look similar to the following:


    ```

    mmc Hardware init

    mmc Card init

    mmc Card init *1*

    mmc Card init *2*

    Size = 1006080, hardsectsize = 512, sectors = 2012160

    Partition check:

    mmca: pl

    ```


    ![](img/41991837f74596e7c29a2498b6ec56e8_305_0.png)


    An All-in-One mmc.o Solution

    Under OpenWrt Whrussian, versions RC5 and later, the MMC driver is subtly broken
    because of the way that the newer versions of diag.o (the diagnostic driver) handle
    GPIO. Patches are available, as are precompiled MMC drivers that will work under
    RC5 and RC6.


    These updated drivers still have the same issues concerning GPIO selection as
    GPIO 2 and 5. Nick DePetrillillo has graciously provided us with an updated MMC
    driver that includes the patches for the diag.o issues, as well as the ability
    to select our GPIO settings on installation of the driver. so, instead of the
    commands listed earlier in this chapter, in our example we will perform an insmod
    of mmc.o for Nick’s gpio 2:


    ```

    # insmod mmc.o gpio_sd_pin=2

    ```


    We can also use the same driver for GPIO 5 as well with the appropriate module
    option:


    ```

    insmod mmc.o gpio_sd_pin=5

    ```


    If you intend to use Nick’s updated MMC driver, you will also need to update /etc/modules.d/40-mmc
    to include the additions of the command-line options. In addition, Nick’s updated
    MMC driver can reassign any one of the GPIO settings as long as your hardware
    supports it, and it supports SD cards greater than 2GB.

    You can find the all-in-one MMC driver, with source code, at www.paudoldcom.com/wrt54g/all-in-one-mmc.tar.gz.'
