  md: '# Introduction


    Up to this point, we have laid the foundation for explaining the differences and
    similarities among all of the WRT54G routers, showed how to hack them with third-party
    firmware, and how to configure some common parameters on your newly hacked WRT54G.
    In this chapter, we will showcase some of the fine and interesting things you
    can do, such as building a wardriving kit that lives entirely on a WRT54G, use
    your WRT54G as a Voice over IP (VoIP) private branch exchange (PBX), create wireless
    bridges for your favorite video gaming system, and set up a captive portal on
    the WRT54G to impress all of your friends when they visit. We will live by the
    expression "All work and no play makes Jack a dull boy," so don''t be afraid to
    tackle some, or all, of the projects in this chapter besides, well, you!


    # Wardriving-in-a-Box


    A wardriving-in-a-box unit is a helpful tool for wireless aficionados as well
    as penetration testers forming a wireless student. **Wardriving** is a method
    of finding wireless networks by utilizing software to interface with the wireless
    radio, monitor all wireless channels and examine them for traffic. As the name
    may indicate (with the "drive" base), there is a concept of moving monitoring
    station, which makes location important, and is typically done by GPS.


    Typically, a wardriving setup would require a laptop, a power source, antenna(s),
    a GPS receiver, and an appropriate wireless card. With a WRT54G, you can deliver
    all of this in a smaller form factor, with reduced power requirements. With the
    WRT54G''s reduced size, you can put it on the dashboard, or hide it inside a small
    bag or other camouflaging device.


    # Prerequisites for This Hack


    In order to complete this hack, you will need to have a few things in place before
    you can begin, building a self-contained wardriving WRT54G is quite involved.
    In short, you need:


    +   * A working and writable MMC/SD card mount, as described in Chapter 7. We''ll
    assume in this example that your SD card is mounted under /mnt/mmc/SD card, as
    configured in Chapter 7. It is possible to complete this hack without the MMC/SD
    but due to the large quantity of data that you can capture, it will be limited
    in its uses.

    * A working, configured serial port on /dev/ttyS1, as described in Chapter 7.

    * A third-party GPS receiver that can output NMEA (National Marine Electronics
    Association) data. In this example, we will be using a Garmin eTrex Basic with
    a serial cable.


    Once you have met these three prerequisites, you can begin to build your self-contained
    wardriving WRT54G.


    # Kismet


    Kismet is an open source 802.11 Layer 2 wireless network detector, sniffer, and
    intrusion detection system, developed by Mike Kershaw. Kismet will work with any
    wireless card that supports raw monitoring (RFMON) mode, and it can sniff 802.11b,802.11a,
    and 802.11g traffic. Kismet identifies net


    ![](img/41991837f74596e7c29a2498b6ec56e8_175_0.png)'
