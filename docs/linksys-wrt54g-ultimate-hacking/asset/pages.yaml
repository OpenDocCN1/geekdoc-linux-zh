    # Attaching Antennas to the WRT54G


    In Chapter 1, we indicated that both of the antenna connectors on the rear of
    the WRT54G are female RP-TNC connectors. By using an antenna with a male RP-TNC
    connector, you can attach it directly to the router. Of course, as you may imagine,
    there are many types of antenna connectors, and not all are compatible. In order
    to use antennas with a WRT54G, you need to utilize a pigtail. A pigtail is essentially
    an antenna connector.


    For example, the WRT54G uses female RP-TNC connectors, but all of our directional
    antennas shown in Figure 7.3 utilize N female connectors (not to be confused with
    the U.S. N-type power connector). Therefore, we need to utilize a female RP-TNC
    to male N connector, as shown in our pigtail in Figure 7.3. Be sure to research
    and select your antennas carefully, and purchase the appropriate pigtail and connectors
    if needed.


