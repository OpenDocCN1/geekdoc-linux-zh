    Although it''s easy to install DD-WRT and have all of those features at your fingertips,
    you do pay a price when it comes to performance. DD-WRT consumes far more resources
    than some of the other firmware choices, such as OpenWrt.


    # Ewrt


    # Background


    Ewrt was originally developed by two employees of Portless Networks, named Irving
    Popovovsky and Brandon Psmythe, to be used in community wireless networking projects,
    most notably as an easy-to-use, rock-solid, self-contained wireless hotspot. Ewrt
    was maintained by Troy Jaqua with the continued support of Portless Networks.
    While we were writing this book, the project ended. The developers are currently
    seeking a person, or team of people, to adopt this project.You can find more information
    at www.portless.net. They have made all of the project files (firmware, packages,
    documentation, and source code) available at www.portless.net/ewrt.


    # Features


    Ewrt is built to be a self-contained wireless hotspot. In order to accomplish
    this task, the Ew developers reused the default Linksys Web interface, as seen
    in Figure 2.13, and added support for configuring the additional features.


    # Figure 2.13 Ewrt Default Configuration Web Page


    ![](img/41991837f74596e7c29a2498b6ec56e8_101_0.png)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Working with WRT54G Firmware · Chapter 2


    Ewrt provides a hotspot-like captive portal, similar to many that you would encounter
    in airports and coffee shops around the world. The user associates to an SSID
    and receives his IP address, gateway, and domain name (DNS) server. All HTTP requests
    are redirected to the captive portal, also known as a splash screen. Here, the
    user is typically presented with instructions for proceeding. In some cases, the
    user may be asked to agree to an acceptable usage policy and then allowed to access
    the Internet, which is the default behavior of Ewrt. hotspots may require payment
    for network access, usernames and passwords, and/or registration. In our case,
    the captive portal splash screen shown in Figure 2.14 will be automatically presented
    to all wireless clients when they begin to access network resources through their
    browsers.


    # Figure 2.14 Ewrt Default Captive Portal Page


    ![](img/41991837f74596e7c29a2498b6ec56e8_102_0.png)


    The Ewrt project based the captive portal portion of the firmware on the NoCatSplash
    project (http://nocat.net), which the developers have ported to the WRT54G platform.
    The Ewrt developers have created a writeable JFS2 partition for customized captive
    portal web pages, and have included many security and stability fixes.


    The Ewrt firmware is ideally designed to be installed on a WRT54G in a remote
    location where physical access to the WRT54G is limited. In order to support these
    types of deployments, Ewrt contains some additional features over the base Linksys
    firmware, notably the addition of SSH for secure command-line access and management,
    as shown in Figure 2.15.'
