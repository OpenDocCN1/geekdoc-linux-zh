  md: '# Asterisk for VoIP


    Asterisk is a fully functional, commercial free source Linux-based IP PBX system.
    It has every feature you can imagine from a commercial PBX solution (call hold,
    transfer, customized dial plans, etc.). Asterisk is infinitely configurable. As
    a matter of course for open source projects, the source code is available and
    portable to many different platforms; in our case, the WRT54G. Additionally, due
    to the highly configurable nature of Asterisk, it can be slimmed down to fit in
    a small space. The initial install of Asterisk on WRT54G must be very small, as
    after the installation of OpenWrt, there are only 5.5MB of available space left.
    If desired, it is possible to eliminate some of the unused modules, and enable
    additional ones for more features, including voicemail, music on hold, and so
    on. You can also apply the SD card mod to increase WRT54G storage capacity and
    take advantage of all of Asterisk''s capabilities.


    For more information about the Asterisk project, visit www.asterisk.com.


    # Installing Asterisk


    Installing Asterisk under OpenWrt is a very trivial thing to accomplish! The OpenWrt
    package tree includes a version of Asterisk as an ipkg package. Although this
    version may not be the latest version of Asterisk, it is completely stable on
    the WRT54G platform.


    > Note The current version of Asterisk in the OpenWrt package tree at the time
    of our writing is 1.0.10-1, whereas the current version released from the Asterisk
    project under a full Linux installation is 1.4. You can obtain later versions
    of Asterisk for the WRT54G in the ipkg format from a number of places; however,
    you should treat them as Beta or unstable. We were able to use several of the
    unofficial OpenWrt packages to cause significant issues with the OpenWrt install.

    If you want to use a later version, you can obtain one from various sources listed
    in the OpenWrt forums, by searching for “asterisk”. You can find the OpenWrt forums
    at http://Forum.openwrt.org.


    You need to install the OpenWrt package of Asterisk with a connection to the WAN
    port to the Internet for package retrieval. First, you need to update your OpenWrt
    package list with the following command:


    ```

    # ipkg update

    ```


    To install Asterisk, issue the following command at the OpenWrt command line (via
    SSH):


    ```

    # ipkg install asterisk

    ```


    By performing this install, ipkg will also include any dependencies that have
    not been met previously. The dependencies for Asterisk include libncurses and
    libthread.'
  merge: -1
