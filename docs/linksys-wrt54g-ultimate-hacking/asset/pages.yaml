    # Setting Up a Routed Bridge


    A routed bridge is configured differently than a WET. In this example, we will
    put the WRT54G wireless radio into "STA" mode, which is short for *station*,*
    referring to its capability to become a wireless client. Consider the example
    network in Figure 4.3.


    # Figure 4.3 Wireless Routed Bridge Setup


    ![](img/41991837f74596e7c29a2498b6ec56e8_192_0.png)


