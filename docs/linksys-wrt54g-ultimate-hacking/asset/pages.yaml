  md: 'WRT54G Fun Projects • Chapter 4


    # Setting Up a Wireless Media Adapter


    All modern console game systems on the market today use an Internet connection;
    in fact, some require it. This can present some interesting challenges for the
    average gamer, parents of an avid gamer, and even someone who has networking experience.
    Running cables through your house is well, not fun. We''ve done it with mixed
    degrees of success (after you''ve put that first hole through your hardwood floor,
    it''s not so bad). A better way is to purchase a wireless gaming adapter. The
    Linksys WGA54G Wireless-G Gaming Adapter, which was detailed for approximately
    $90 at the time of his writing. The WGA54G has the following “features” that are
    much better reproduced on the WRT54G platform:


    +   - No Wi-Fi Protected Access (WPA) support (only Wireless Encryption Protocol
    [WEP])


    +   - Only one wired Ethernet port


    +   - No easy to upgrade the external antenna


    As mentioned earlier, WPA/WPA2 is the standard for wireless security and you should
    use it wherever. If you have a WGA54G or similar product, and it supports only
    WEP, you have to convert your network to WEP. With more and more devices in your
    entertainment requiring an Internet connection, installing a device that has only
    one Ethernet port would seem to be shortsighted. For example, the concepts that
    will follow for providing access to your TV as well. A gaming system may not be
    limited to the living room; typical households may have one in the basement as
    a spare TV, or in a child’s bedroom. These alternative locations may not get a
    strong signal on your wireless network, so the option for a wireless antenna is
    key to solving this problem. What follows are two practical examples of how you
    can use a WRT54G as a wireless gaming adapter, complete with WPA support, five
    available Ethernet ports, and two easily upgradable external antennas.


    # Creating a Wireless Ethernet Bridge (WET)


    WET, stands for Wireless Ethernet Bridge, will allow clients connected to the
    Ethernet ports (or local area network [LAN]) ports to communicate with networks
    that may be reachable only via wireless. Consider the example network shown in
    Figure 4.2.


    In Figure 4.2, we plug the system, such as an Xbox, into a WRT54G called “wrt-bridge”.
    Wrt-bridge is made to be a wireless client (instead of an access point). As a
    client, wrt-bridge associates to another access point called “wrt-livingrm”. In
    order for our communications to be secure, we will set up WPA-PSK, using the original
    version of WPA (sometimes called WPA1 or WPA, version 1) as the encryption protocol.
    Wrt-livingrm is connected to the rest of the network via wired links and Ethernet
    cables. The network also has a local domain name system (DNS) server.


    www.syngress.com'
