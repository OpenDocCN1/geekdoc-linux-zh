    ```

    [MyBackupDrive]

    comment = /mnt/disc0_1

    path = /mnt/disc0_1

    browseable = yes

    public = yes

    writeable = yes

    ```


    There are a few notable items in the preceding configuration. We have commented
    out the line guest account = nobody, and replaced it with guest account = root.
    This allows remote Samba users to write files to the Samba shares. We are also
    sharing out /tmp, which is typically the JFF2 writable partition. The backup drive,
    called MyBackupDrive, has the writable flag set, which means that with the current
    configuration, anyone can connect to this share and write files to the disk. There
    are many aspects of Samba security, and they go beyond the scope of this book.
    The preceding configuration is merely an example, so please take the time to properly
    secure your network and systems if you'
