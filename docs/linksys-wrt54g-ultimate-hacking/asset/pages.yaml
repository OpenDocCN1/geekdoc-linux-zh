  md: '# Chapter 7 • WRT54G Hardware Hacking


    # The Hack


    The power connector provided with the power adapter is a standard N-type power
    connector which is readily obtained from most electronics supply houses. You can
    also source a connector from a broken or other unused power adapter, possibly
    from a completely different application. In the case of a cannibalized power connector
    to be reused, the power output of the sacrificial power adapter will not be important;
    we are only after the connector. The power connector is wired for a polarity with
    a WRT54G. As shown in Figure 7.34, the power lead is attached to the tip, or center
    connector, whereas the negative lead is connected to the ring, or outside connector.
    For testing all of the methods described in this book, we built a single N-type
    connector with a short length of cable and some quick disconnect connectors so
    that we can swap power methods at without the need for individual cables.


    Figure 7.34 N-type Connector Polarity for the WRT54G


    ![](img/41991837f74596e7c29a2498b6ec56e8_323_0.png)


    Upon entering the WRT54G, the incoming power source is immediately split into
    two different power regulation chips, as shown in Figure 7.35. These power regulation
    chips deliver voltage requirements to all the components of the board. The Anchip
    1509-33 chip delivers 3.3 volts DC at 2 amps as an output, and the Anchip 1509-50
    chip delivers 5 volts DC at 2 amps. The power regulation chips are being driven
    by 12 volts at 1 amp from the default power adapter and are delivering the appropriate
    output voltage. According to the chip manufacturer, the chips will deliver the
    required voltage and amperage when driven with to 22 volts DC and to 2 amps, with
    a minimum requirement of the lowest output voltage. This means that at the absolute
    minimum, we need to power the WRT54G before conversion with 5 volts. During testing
    in preparation for this book, we determined that a WRT54G under moderate load
    and with wireless set to the default power draws only about 30 milliamps!'
