  md: '# Chapter 6 • WRT54G for Penetration Tests


    # WRTSL54GS CDMA Internet Connection


    As penetration testers, occasionally we find ourselves in a situation where we
    are able to hide a rogue device, such as a WRTLS54GS, at a client in an inconspicuous
    location (i.e., tucked behind a printer or copier). This type of rogue device
    could give us backdoor access to a corporate network by making outbound connections,
    allowing us to bypass inbound firewall rules. Sometimes we may find ourselves
    in a position where a rogue device will not work for us, likely due to very restrictive
    outbound firewall rules. Finding that your client firewall rules is a good thing,
    but it is entirely possible that they have allowed anyone to attach a rogue device
    with an alternative routing path to their network, bypassing the firewall completely.


    Enter cellular data networking. In the United States, Sprint maintains a CDMA
    cellular data network capable of reasonable broadband speeds. Early in 2007, Sprint
    released a new cellular data modem, the Novatel Wireless Ovation U720, shown in
    Figure 6.8. The U720 becomes very useful to us, in that it features a USB connection.
    When we combine it with a WRTSL54GS, we can utilize it as a cellular router. Although
    Linksys also released the WRT54G3G-ST, which is compatible with Sprint’s EV-VO
    data network, the cost of the WRT54G3G-ST is more than double the cost of the
    WRTLS54GS! Both solutions require the purchase of a cellular modem from Sprint
    (either USB or PCMCIA, at the same cost). The PCMCIA version that is required
    for the WRT54G3G-ST is becoming increasingly incompatible with new mobile computing
    technologies, with USB and ExpressCard are the future standards.


    # Figure 6.8 The Novatel Wireless Ovation U720 CDMA Modem


    ![](img/41991837f74596e7c29a2498b6ec56e8_269_0.png)


    In order to begin utilizing the U720 under OpenWrt, we need to install a few packages
    that enable the USB port, PPP communications, and serial modem drivers. In order
    to install these packages, perform the following commands:


    ```

    # ipkg install kmod-usb-core kmod-usb-ohci kmod-ppp chat kmod-usb-serial

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# WRT54G for Penetration Testers • Chapter 6


    After the packages are installed, you need to make sure that a number of kernel
    modules are installed and loaded at startup. You need to customize the insertion
    of the usserial kernel module, as the kernel module does not yet know about the
    U720. You need to specify the device and product ID. To get your modules installed
    in the appropriate order, and to make your changes, you need to edit two files
    under /etc/modules.d. The first file to edit is 60-usb-serial, and you should
    modify it to follow as in order to register the U720 with the usserial module:

    usserial vendor=0x1410 product=0x2110


    ![](img/41991837f74596e7c29a2498b6ec56e8_270_0.png)


    > It is possible that these instructions will work with USB cellular devices other
    than the U720. In these other cases, you will need to change the vendor and product
    code passed to the USB serial kernel module. You can obtain the proper vendor
    and product ID for your device by issuing the dmesg command immediately after
    plugging in your USB device and examining the output.


    In addition to the usserial module, you need to create an additional set of modules
    to be loaded after usserial. Under /etc/modules.d, create a new file named 80-pop
    and populate it with the following lines to load these modules at startup.


    ```

    slhc

    ppp_generic

    ppp_async

    ```


    In order to create a working PPP connection, you need to provide a number of configuration
    options across several files. You need to define your connection port, the number
    to dial, routing information, and scripts for connection and disconnection. First
    you need to define your peer, or connection to dial, under /etc/ppp/peers. Create
    the settings and described here as /etc/ppp/peers/s:


    ```

    /dev/usb/tts/0 # Where your U720 Modem device is attached

    921600 # Baud rate

    defaultoutroute # Utilize Sprint''s default route

    usepeerdns # Utilize Sprint''s DNS servers

    crtscts # Use hardware flow control

    lock # Lock the serial port so no other apps interfere

    noauth # No authentication to Sprint

    local # Don''t use Carrier Detect or Data Terminal Ready

    persist # Redial if disconnected

    user # Sends no user name

    ppp # Use PPP protocol

    holdoff 5 # Try a redial after disconnect after 5 seconds

    ```


    ![](img/41991837f74596e7c29a2498b6ec56e8_270_1.png)'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 254 Chapter 6 • WRT54G for Penetration Testers # Prevents timeouts


    ```

    lcp-echo-failure 4 # Prevents timeouts

    lcp-echo-interval 65535 # Prevents timeouts

    connect "/usr/bin/chat -v /etc/chatscripts/s-connect"

    # Use this connect script when establishing a PPP connection

    disconnect "/usr/bin/chat -v /etc/chatscripts/s-disconnect"

    # Use this disconnect script when hanging up a PPP connection

    ```


    The Sprint script that we have just created references a connect and disconnect
    script at the very end, which also need to be created.These scripts provide commands
    to the modem portion of the U720 to dial and connect the PPP Internet connection.
    Here is the connect script, named sprint-connect, in /etc/chatscripts:


    ```

    TIMEOUT 10

    ABORT ''BUSY''

    ABORT ''NO ANSWER''

    ABORT ''ERROR''

    SAY ''Starting Sprint...\n''

    # Get the modem''s attention and reset it.

    "\ ''ATZ''

    # E0=No echo, V1=English result codes

    OK ''ATEOV1''

    # List signal quality

    ''OK'' ''AT+CSQ''

    ''OK'' ''ATDTW777''

    CONNECT

    ```


    Here is the script named sprint-disconnect, in /etc/chatscripts, which will handle
    the connection:


    ```

    " "\K"

    " "++ATH0"

    SAY "Disconnected from Sprint."

    ```


    > TIP You can download the peer file and both chatscripts with wget http://www.wrt54ghacks.com/whiterussian/U720.tar.gz
    and extract them with tar - xvf U720.tar.gz. Once you''ve extracted the files,
    you can copy them to the appropriate locations.


    Now that you have all of the configuration pieces in place, you need to make the
    final jump and set the U720 to connect at boot and make the default WAN interface,
    instead of the WAN port.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'The first script that you''ll want to add to the default startup scripts under
    /etc/init.d is called s80pp.

    Create S80ppp as shown here to set up the serial lock directory, and connect to
    Sprint with the pppd daemon.


    ```

    #!/bin/sh

    mkdir -p /var/lock

    pppd call sprint

    ```


    You also need to make S80pp executable with the following command:


    ```

    # chmod 755 /etc/init.d/s80ppp

    ```


    As the last step in turning the WRTS54GS into a CDMA router, you need to change
    the NVRAM variables to set a new network interface as the default WAN port. This
    will disable the current WAN port and set the new ppp0 interface, created by connecting
    to Sprint via the U720, as the new WAN port. You can do this with two NVRAM commands,
    and a commit:


    +   # nvram set wan_device=ppp0

    # nvram set wan_ifname=ppp0

    # nvram commit


    > In order to restore to the default WAN port, if you no longer want to use the
    WRTS54GS as a CDMA router, you need to revert the NVRAM settings to the values
    with:

    nvram set wan_device=vlan1

    nvram set wan_ifname=eth1

    nvram commit


    A final reboot should result in a working CDMA router! If you were to unplug any
    cable from the WAN interface, you should still be able to connect to the Internet
    over the CDMA connection.

    Now, you may have one slight problem with using your CDMA connection as a penetration
    test. Typically, you would be deploying this in a covert manner, and you won''t
    be able to log into the WRTS54GS to determine the WAN IP address assigned by the
    CDMA provider. You can create a script to query the interface and e-mail the new
    WAN IP every time a PPP connection is established to an e-mail address that you
    provide. In order for this script to work, you need to install mini-sendmail


    ```

    ipkg install mini-sendmail

    ```


    Our script is fairly simple, as it sends the output of ifconfig ppp0 in an e-mail
    via our defined mail relay to an e-mail address that we specify:


    ```

    #!/bin/sh

    # Change these to reflect your environment

    ```'
