- img_proc: true
  md: '# NOTE


    The size indication in dmesg output indicates that we are using a 1GB SD card
    in this example. Your size may be different, depending on the SD card you are
    using. Currently, mmc.o supports only SD cards of 2GB and less.


    After installation of the MMC kernel module, the Cisco SecureEasySetup will be
    illuminated in amber. As noted earlier, you should have it auto-install after
    every reboot. By creating a file named S20mm under /etc/init.d. In the S20mm file,
    you need to set up a GPIO mask, reference which driver to load, and the SD card.
    Edit the file using the vi editor so that S20mmc looks like:


    ```

    echo 9c > /proc/diag/gpiomask

    insmod mmc

    mdir /mnt/mmc

    mount /mnt/mmc

    ```


    Save and close the file. The first line of the S20mmc file creates the /etc/diag/gpiomask
    file in order to alert the diag module not to monitor GPIO 1, 5, and 6. Because
    these GPIO lines are now used for the SD card, the diag module no longer needs
    to monitor them. Continuing to have the diag module monitor these GPIO lines will
    cause locks and poor performance access to the SD card. In cases where we utilize
    GPIO 2 instead of 5, we can replace the 9c with 7e to accurately reflect the appropriate
    values in hex.


    Don''t forget to make the script executable:


    ```

    # cmd 755 /etc/init.d/S20mmc

    ```


    Now we can set the partition to automatically mount upon by creating a default
    mount point, and defining default mount configuration. First, we need to use vi
    /etc/fstab, and add the following line:


    ```

    /dev/mmc/disc0/part1 /mnt/mmc vfat defaults 0 0

    ```


    This will define a lookup table for OpenWrt so the MMC file system can be mounted
    with considerable ease. Instead of typing the long, multipart command each time,
    /etc/fstab allows us to shorten our command, providing many of the configuration
    items beforehand.


    A final reboot will verify that everything has worked properly. After the reboot,
    the SecureEasySetup amber LED does not stay lit, but light momentarily during
    boot. It will become lit, and stay lit, upon the first read or write operation.


    Now that the SD card is fully operational, you can use the extra storage just
    as you would for normal disk usage. You can also set up OpenWrt so that you can
    install packages to the SD card. In order to allow ipkg to use the SD card as
    a install location, you must modify /etc/ipkg.conf to define a new destination.
    Using vi, add the following line to the end of ipkg.conf:


    ```

    dest mmc /mnt/mmc

    ```'
