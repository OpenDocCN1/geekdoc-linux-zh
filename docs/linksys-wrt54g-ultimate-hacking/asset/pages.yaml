  md: '# Chapter 6 • WRT54G for Penetration Testers


    network, or any other security mechanism, leaving them vulnerable to attack. One
    attack,

    dubbed the "evil twin" by popular media, works by creating an access point that
    broadcasts the same

    SSID as the hotspot and to steal people''s credentials and sniff traffic. For
    example, a popular

    hotspot is provided by T-Mobile, SSID is typically "t-mobile". By creating a captive
    portal

    using the SSID "t-mobile" we can grab people''s credentials as they think they
    are logging into a

    Real T-Mobile hotspot.


    The Shmooo Group (www.shmooo.com) has documented this attack, dubbing it (more
    appropriately-nalsnarf). In recent versions, they have customized the Ewrt firmware
    such that it will grab

    users'' passwords as they pass through the hotspot. They have released the firmware
    and call it

    Airsnarf-Rogue Squadron. You will need the following to set up and use it (with
    per-mission, of course) in your penetration tests:


    +   - A WRT54G, version 2.x or 3.x

    - The Airsnarf/Rogue Squadron firmware

    - A connection to the WAN port that provides Internet access

    - The ability to customize Hypertext Markup Language (HTML) Web pages to impersonate

    a real captive portal


    Airsnarf?Rogue Squadron installs like any other hotspot firmware. In fact, it
    is based on Ewrt

    firmware, 0.3 beta 1, by Portless Networks, which supports only the W54G, versions
    2.x and 3.x.

    Once you have acquired the hardware, you can download the firmware from

    http://airsnarf.shmooo.com/rogue_squadron/index.html. Load the firmware, following
    the instructions

    provided in Chapter 2. Then go to //192.168.1.1 and log in with the username root
    and the

    default password of airsnarf. If you''re successful, the default administrative
    Web page should look like

    Figure 6.9. We used a screenshot from a real-world installation for this example,
    which references the

    IP address of 10.13.37.1. You will want to change to the 192.168.1.1 IP address,
    especially if the

    WAN IP address will be 192.168.1.0/24.


    To change the LAN IP to the Local IP Address field and change it to a subnet that

