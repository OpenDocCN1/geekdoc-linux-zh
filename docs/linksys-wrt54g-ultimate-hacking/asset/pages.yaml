- img_proc: true
  md: '# Chapter 7 WRT54G Hardware Hacking


    Once we have the appropriate teeth on our floppy connector picked out on both
    planes, we can fan out the end of the ribbon cable just enough to line it up with
    the correct teeth. Be sure to put the marked wire in the ribbon where pin 1 should
    be. Insert the wire into the appropriate teeth, and place the back of the connector
    back over the teeth to hold the wire in place. When fully-pressing the back of
    the connector, it is best to provide equal, even pressure over the length of the
    connector, especially where new wires are inserted in the teeth. A great way to
    accomplish this is to use a C-clamp between two pieces of wood, or a clamp with
    a large enough head to cover the length of the connector, as shown in Figure 7.13.
    Squeeze the back of the connector back on, using enough force to fully seat the
    cable into the teeth.


    # Figure 7.13 Using a Clamp to Squeeze the Floppy Connector


    ![](img/41991837f74596e7c29a2498b6ec56e8_297_0.png)


    Now that we have our choice of SD card connector attached to our wire or ribbon
    cable, we need to attach the cable to the proper places on the board. As indicated
    earlier, we will be noting the proper locations for specific models.


    We must attach pin 1 of the SD card via our ribbon cable to the WRT54GL board
    at the GPIO 7 location. We can find this location at the front of the board while
    looking at the LEDs. From the underside of the board, GPIO 7 is located on the
    left-hand pin of the DMZ LED. Solder pin 1 to the LED post, as shown on the right
    in Figure 7.14.'
