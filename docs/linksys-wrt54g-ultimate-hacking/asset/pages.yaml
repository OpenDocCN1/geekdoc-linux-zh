  md: '# Components Needed for This Hack


    This hack requires a few additional components that are not provided standard
    with any WRT54G model. The additional components required are:


    +   - A 10-pin set of header pins in a 2-by-5 layout

    - A 10-pin ribbon cable connector

    - Ribbon cable or other appropriate wire

    - Four 100 Ohm resistors

    - A 25-pin male parallel port connector, with hood


    # The Hack


    You can find the JTAG connector in the form of a number of solder points on the
    board, aligned in two rows of six points. In our WRT54GL, version 1.1, the points
    are labeled JP1, as shown in Figure 7.29. With all WRT54G models, this will be
    the only 2-by-6 set of connection pads on the board.


    Figure 7.29 Unpopulated WRT54G JTAG Port at JP1


    ![](img/41991837f74596e7c29a2498b6ec56e8_317_0.png)


    The easiest and best way to begin to take advantage of our JTAG interface is to
    install a pin header in the appropriate location on the board, and use a connector
    attached to a ribbon cable to interface with it. With the installation of the
    pin header, we will be able to attach our custom JTAG cable (shown later in this
    section) at without a permanent and messy installation.


    > NOTE The pin header and pin connectors should be available from most well-stocked
    electronics supply houses. We obtained many of our parts from www.digi-key.com
    and'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'from a local Radio Shack retail store. We''ll provide a list of part numbers
    and sup-liers where we obtained our parts in Appendix B.


    After obtaining an appropriate pin header and connectors, place the pin header
    on the JP1 loca-tion and solder it to the board. If solder is already bonded to
    the connection locations, remove the solder with a sucker or soldering braid before
    inserting the pin header. Once you insert the pin header on the top side of the
    board, solder it from the underside of the board. Shown in Figure 7.30 is a completed
    set of pin headers for both JTAG and serial.


    # Figure 7.30 WRT54GL, version 1.1, JTAG and Serial Pin Headers


    ![](img/41991837f74596e7c29a2498b6ec56e8_318_0.png)


    > In many cases, once installed, the pin header will obscure the markings on the
    board that indicate the pin numbering at the JP1 location. As it will be important
    to us to be mindful of the pin numbering, it is helpful to make additional, visible
    markings designating one or more pins.


    # Constructing a JTAG Cable


    In order to interface with the JTAG port on the WRT54G, we need to construct a
    custom cable that will attach to a parallel port on a PC. There are two types
    of cables: buffered and unbuffered. Due to ease of construction and low cost,
    we''ll be describing the unbuffered type of cable. This type of cable is based
    on the Xilinx DLC5 Cable III unbuffered JTAG cable, and costs about $5 in parts
    to construct.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Chapter 7 • WRT54G Hardware Hacking


