    # Who Should Use This Firmware


    This firmware is aimed at more experienced users, Linux enthusiasts, network/security
    engineers, and anyone who is willing to take a base Linux-embedded device and
    configure it for his needs. For example, a graphical web interface was not introduced
    until recent versions, and nevertheless, most of the configuration must be done
    via the command-line interface. However, once you become accustomed to making
    changes via the command line, you will find it very easy to create your own Linux-embedded
    device.


    Also, if you are interested in device development, this is the firmware for you.
    The OpenWrt project welcomes developers, and provides us with an entire site to
    develop OpenWrt development: http://dev.openwrt.org. Here you can find all the
    latest versions of the source code, and get access to the buildroot environment,
    which allows you to compile source code packages to run on OpenWrt, build your
    own kernels, and create your own firmware images. This is also a short tutorial
    on the OpenWrt forums, located at http://forum.openwrt.org/viewtopic.php?pid=31794.


    # DD-WRT


    DD-WRT was created by BrainSlayer to offer a free version of Sveasoft (see the
    Sveasoft "The OpenWrt Worth Mention section", later in this chapter). Sveasoft
    was based on the original GPL versions of the WRT54G firmware from Linksys. Sveasoft
    decided to start charging users $20 to download the firmware for their routers.
    The earlier versions of DD-WRT (up to and including v22) were based on the last
    free version of Sveasoft, called Alchemy. It has since adopted the OpenWrt kernel
    base and ipkg package structure. DD-Wrt sports is one of the slickest interfaces
    of any WRT54G firmware solution, making it a very popular choice among computer/networking
    enthusiasts who want to quickly and easily take advantage of third-party features.


    # Features


    DD-WRT offers an array of interesting features that the original Linksys firmware
    did not offer, including:


    +   - The ability to increase wireless radio transmit power


    +   - Hotspot Captive Portal Support via Wifidog (http://dev.wifid.org)'
