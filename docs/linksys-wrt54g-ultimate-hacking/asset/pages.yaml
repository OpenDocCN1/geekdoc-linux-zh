  md: '# WRT54G Fundamentals • Chapter 1


    Some 4.0 models of the WRT54GS do contain 8 MB of Intel flash and 32 MB of Lynix
    RAM; however, Linksys elected not to create different hardware versions for each
    variety. Unfortunately, there is no method to determine these amounts based upon
    the serial number.


    The rest of the components, aside from the flash and RAM, remain identical to
    those in version 3.0 of the WRT54GS, including the new BCM5352 processor and the
    inclusion of the SES button. Table 1.16 lists the specifications of the WRT54GS,
    version 4.0.


    # Table 1.16 Specifications of the WRT54GS, Version 4.0


    | CPU speed | 200 MHz |

    |---|---|

    | RAM | 16 MB |

    | Flash | 4 MB |

    | Serial number prefix | CGN |


    # WRT54GS, Versions 5.0, 5.1, and 6.0


    Like version 5.0 of the WRT54G, the entire WRT54G hacking community stood in shock
    and awe when Linksys released the WRT54GS, version 5.0, and subsequent models.
    The new version ended a long series of hackable routers, but was quickly followed
    with the release of the WRT54GL, which was intended for WRT54G hackers. This version
    marked significant changes to the WRT54GS architecture:


    +   **Decreased flash** The amount of memory was again reduced, this time from
    4 MB to 2 MB. This was a major factor in the crippling of the device, as it greatly
    limits the amount of software you can install.

    **Decreased memory** The memory was also cut in half, this time from 16 MB to
    8 MB. The WRT54GS platform could be easily pushed to its limits with available
    memory in the 16 MB models, and cutting it in half makes the problem twice as
    bad.

    **Transition to the VxWorks operating system** This final blow was the migration
    from a Linux-based operating system to VxWorks, a proprietary OS from Wind River
    used in embedded devices which includes printers, PBX telephone systems, digital
    cameras, and the Mars Exploration Rover! VxWorks is a true RTOS, which means it
    is intended to have a small footprint for embedded devices, yet still provide
    a multitasking environment.


    Additional differences include a slightly different type of RAM, with version
    5.0 using the NECI brand and 6.0 using RAM from undefined parameters. Most other
    models use an Intel-branded flash module, whereas versions 5.0, 5.1, and 6.0 use
    a generic, unbranded chip. It has been speculated that the transition to this
    platform was to reduce manufacturing costs.


    ![](img/41991837f74596e7c29a2498b6ec56e8_50_0.png)'
