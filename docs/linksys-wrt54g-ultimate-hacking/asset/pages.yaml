  md: '# Table 1.1 CPU Types and Versions


    | Model | CPU Type and Version | Default Speed | Max Speed* |

    |---|---|---||

    | WRT54G 1.0 | BCM471 V0.0 | 125 MHz | 216 MHz |

    | WRT54G 1.1 | BCM471 V0.0 | 125 MHz | 216 MHz |

    | WRT54G 2.0 | BCM302 V0.7 | 200 MHz | 250 MHz |

    | WRT54G 2.2 | BCM302 V0.7 | 200 MHz | 250 MHz |

    | WRT54G 3.0 | BCM302 V0.7 | 200 MHz | 250 MHz |

    | WRT54G 3.1 | BCM302 V0.7 | 200 MHz | 250 MHz |

    | WRT54G 4.0 | BCM302 V0.8 | 200 MHz | 250 MHz |

    | WRT54G 5.0 | BCM302 V0.8 | 200 MHz | 250 MHz |

    | WRT54G 5.1 | BCM302 V0.8 | 200 MHz | 250 MHz |

    | WRT54G 6.0 | BCM302 V0.8 | 200 MHz | 250 MHz |

    | WRT54GL 1.0 | BCM302 V0.8 | 200 MHz | 250 MHz |

    | WRT54GL 1.1 | BCM302 V0.6 | 200 MHz | 250 MHz |

    | WRT54GS | BCM302 V0.6 | 266 MHz | 300 MHz |


    The BCM3502 processor is part of the BCM5352 family of SoC processors. Seeds in
    the "Max Speed" column were reported by various users and in online documentation,
    and were gleaned from the source code that determines the clock frequency. You
    can go higher in most cases, but going higher than the values listed will likely
    cause problems with overheating and routers locking up. This is one reason we
    are covering this only briefly and not providing a full tutorial. For those of
    you who just have to do it because, well, you can, the following commands will
    change the CPU clock frequency:


    ```

    nvram set ckfreq=250

    nvram commit

    reboot

    ```


    On the other hand, overclocking has has some added advantages, such as increasing
    I/O when using SD cards, and using applications that are CPU-intensive. We disclaim
    responsibility for melted routers that come as a result of overclocking.


    # Storage


    Storage on all WRT54G-based devices comes by way of flash memory, a form of nonvolatile
    storage commonly used in small electronic devices, such as your digital camera
    (see Figure 1.4). One of the limiting factors we will have to work with limited
    storage, which defines just how much software we can load onto the device. However,
    no fear: we will show you how to upgrade the capacity of your flash memory in
    Chapter 7 through the use of other storage techniques.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1 • WRT54G Fundamentals


    # Figure 1.4 Intel 4 MB Flash Chip from a a Version 1.1 WRT54GL


    ![](img/41991837f74596e7c29a2498b6ec56e8_27_0.png)


    The more flash storage you have, the better, because it means you can load more
    software (kernel and software packages) onto the device. WRT54GS models with version
    numbers from 1.0 through 3.0 and the WRTSL54GS series contain the most on-board
    flash in the entire WRT54G family,


    # Memory


    # RAM


    The WRT54G routers use Synchronous Dynamic Random Access Memory (SDRAM) for their
    main memory system. However, this is a different kind of SDRAM than you would
    put into your PC. RAM on the WRT54G series is soldered directly to the printed
    circuit board (PCB) instead of using a standard PC DIMM format (see Figure 1.5).


    Tutorials on the Web discuss how you can upgrade the memory on your WRT54G. However,
    they require special tools (such as an rework station) and special skills (such
    as adding and removing surface mount components) in order to execute properly
    (above and beyond what we will cover in this book).'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Figure 1.5 RAM Memory Chip from a Version 1.1 WRT54GL


    ![](img/41991837f74596e7c29a2498b6ec56e8_28_0.png)


    # Wireless-54G and Ethernet Networking


    The WRT54G platform has a very powerful networking architecture, which includes
    an Ethernet switch, virtual LAN (VLAN) configuration, and bridging capabilities.
    It provides a five-port Ethernet switch, which by default is broken into two VLANs
    (VLAN0 and VLAN1). The wireless interface, although separate, is bridged by default
    to the Ethernet switch, and you can use it like another Ethernet interface and
    place it on any VLAN. You also can use the wireless interface to serve clients
    when the device is acting as an access point (Master mode), as a client and connect
    to other wireless networks (Managed mode), to provide direct connectivity to other
    clients, Peer-to-Peer network (Ad Hoc mode), and to act as a wireless bridge (Client
    Bridge mode).


    Figure 1.6 shows the architecture of the WRT54G (specifically the WRT54GL). Starting
    with the WiFi component, it has an 802.11 b/g radio chipset, the BCM2050. The
    device uses a diversity chip to balance signals between the two built-in antennas.
    The WiFi radio connects to the CPU Wireless MAC on eth1, which is bridged to VLAN0
    via the br0 interface. The Ethernet MAC in the CPU provides the tagging functions
    for the two default VLANs, and carries this information to the switch via port
    5, the internal port associated with eth0. The VLANs are then assigned to the
    appropriate ports, putting, by default, the WAN port (VLAN1) and local area network
    (LAN) ports (VLAN0) on different VLANs. The Ethernet switch controls the Ethernet
    (LAN) and Internet LED lights, whereas the Power, DMZ, and WLAN lights are controlled
    by a General Purpose Input/Output (GPIO) port on the CPU.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Figure 1.6 WRT54GL Block Diagram


    ![](img/41991837f74596e7c29a2498b6ec56e8_29_0.png)


    Throughout this book, we will be customizing this configuration to suit our needs,
    so it is important that we discuss some of the basic concepts in more detail:


    +   * VLAN tagging VLANs allows us to, in essence, create multiple Layer 2 segments
    on the same switch:You can think of this as a switch within a switch. WRT54Gs
    come with a standard VLAN setting, and for the WRT54GL it sets up two VLANs by
    default. VLAN0 is referred to as the Ethernet VLAN (LAN), and tags ports 0, 1,
    2, 3, and 4 with this VLAN tag, which corresponds to the physical ports labeled
    1, 2, 3, and 4, respectively (i.e., tagged port 0 is physical port). The tagged
    port numbers will be of significance when we cover how to manipulate VLANs in
    various projects throughout the book.


    +   * Bridging the WRT54G, by default, creates a networking bridge between the
    wireless interface and the LAN ports, known as br0. If you have used a Linksys
    brand router before, even in its default configuration with the Linksys firmware,
    you know that when associate to the wireless network you end up on the same subnet
    as though you were plugged directly into a LAN port. Br0 is also the interface
    assigned to the actual switch itself, which is the LAN Internet Protocol (IP)
    address that you connect to in order to manage the router (192.168.1.1 by default).'
