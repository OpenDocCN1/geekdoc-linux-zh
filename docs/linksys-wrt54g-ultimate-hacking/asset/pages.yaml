  md: '# Chapter 2 • Working with WRT54G Firmware


    # Are You Owned?


    # Hijacked SSH Connection or Key Change?


    SSH is a wonderful protocol for secure access, primarily on UNIX/Linux/OS X-based
    systems, but it also runs on Windows (see http://sshwindows.sourceforge.net).
    Version 2 of the SSH protocol is very secure, and it implements a number of techniques
    to secure your terminal sessions, one of which is host authentication with a public/private
    key change. For example, when the WRT54G router boots OpenWrt the first time it
    generates a public/private key pair for the device. When your client connects
    to this device for the first time, you should see something similar to the following:


    ```

    root@bud:~ ssh 192.168.1.42

    ```


    The authenticity of host ''192.168.1.42'' (192.168.1.42)'' can''t be established.

    RSA fingerprint is 14:e8:3d:a5:96:27:78:e3:69:19:fd:65:44:a6:53.


    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''192.168.1.42'' (RSA) to the list of known hosts.


    In this example, we are initiating an SSH session to the newly installed router
    by typing ssh 192.168.1.42. Our SSH client tells us that it cannot verify the
    authenticity of the host to which we are connecting. This is the host''s (i.e.,
    the WRT54G) public key has not been saved to our client. If we were diligent,
    we would verify that it does, in fact, match the fingerprint on the WRT54G. Of
    course, we verify the fingerprint and type yes, the public key is added to your
    $HOME/.ssh/known_hosts file, and login proceeds normally:


    ```

    root@192.168.1.42''s password:

    ```


    ```

    BusyBox v1.00 (2006.11.07-01:40+0000) Built-in shell (ash)

    Enter ''help'' for a list of built-in commands.

    ```


    | | | | | |

    |---|---|---|---||

    | | | | | |

    | | | | | |

    | | | WIRELESS FREEDOM | |

    | WHITE RUSSIAN (0.9) | | |


