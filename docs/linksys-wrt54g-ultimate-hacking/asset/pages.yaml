  md: '# Technical Editor


    **Raúl Siles** is a senior Independent Security Consultant specializing in advanced
    security solutions and prevention, detection and response services in various
    industries including government, defense, telecom, manufacturing, and financial.
    Raul’s expertise and service offerings include security architecture design and
    review, penetration testing, incident handling, security assessments and hardening,
    code security reviews, wireless security, forensic and malware analysis, network,
    system, database and application security solutions and hardening, honeynets solutions,
    intrusion detection/prevention, expert witness, information security security
    management and security awareness and training through The SANS Institute.'
