    # WRT54GS, Version 3.0


    The WRT54GS, version 3.0, introduces a significant change in the design of the
    WRT54GS series of routers. This change replaces the BCM4712 processor with the
    Broadcom BCM5352 processor. With this new processor, the Ethernet MAC is contained
    in the new BCM5352, and as a result, we no longer have a separate Ethernet MAC,
    nor do we have a BCM5325 chipset! This consolidation applies to the Wireless MAC
    and the Broadcom BCM2050 wireless chipset. This consolidation of parts likely
    reduces the overall cost to manufacture the router. Even with the upgraded processor,
    the upgrade does not come at any speed, as the new BCM5352 still operates at 200
    MHz. The real upgrade is found with the chipset consolidation.


    The rest of the components remain the same, including the 8 MB of Intel flash,
    32 MB of Hynix DDR-SDRAM, and continued inclusion of the SES button. Table 1.15
    lists the specifications of the WRT54GS, version 3.0.


    # Table 1.15 Specifications of the WRT54GS, Version 3.0


    | CPU speed | 200 MHz |

    | --- | --- |

    | RAM | 32 MB |

    | Flash | 8 MB |

    | Serial number prefix | CGN55 |


    # WRT54GS, Version 4.0


    The WRT54GS, version 4.0, reveals a disappointing trend with the GS series. Version
    4.0 features half of the flash and RAM of previous GS models. These routers have
    been reduced to 4 MB of Intel flash and 16 MB of Hynix RAM.'
