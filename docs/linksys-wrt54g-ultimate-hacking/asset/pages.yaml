  md: '# WRT54G Hardware Hacking • Chapter 7


    In order to utilize the serial port on the WRT54G board, we need to provide some
    additional circuitry which will perform conversion from the default 3.3 volt (as
    delivered by the WRT54G) to a more standard 5 volt connection.


    # WARNING


    Standard PC ports operate at 5 or 12 volts, whereas the serial ports on the WRT54G
    operate at 3.3 volts. Attaching a PC port directly to the WRT54G will seriously
    damage your router, possibly rendering it completely inoperable. As we have already
    passed the point of any warranty service, you will just have created an expensive,
    yet geekily attractive, artwork or doorstop.


    One great way to implement the appropriate hardware for our serial connection
    is to utilize the MAX232 chipset in a Transistor-Transistor Logic (TTL) to serial
    converter circuit. Compsys Workbench offers the MAX232 chipset in a TTL to serial
    kit with all the necessary components; perfect for our WRT54G. Compsys Workbench
    offers the AD233BK CTS/RTS kit as a do-it-your-self project. The fully assembled
    kit, as shown in Figure 7.25, is available for about $20, and is what we will
    be using in our example.


    # Figure 7.25 The Compsys Workbench AD233BK Serial Kit


    ![](img/41991837f74596e7c29a2498b6ec56e8_312_0.png)


    Follow the instructions from Compsys Workbench for appropriate assembly of the
    AD233BK. We will need to make some slight modifications if we want to implement
    both serial ports with our'
