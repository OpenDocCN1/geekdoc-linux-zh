  md: '# Chapter 2 • Working with WRT54G Firmware


    party firmware distributions will contain a Web interface for upgrading firmware,
    and will contain the same protections against corrupt firmware.


    > To avoid installing a corrupt firmware image on the WRT54G, be certain to verify
    the Message Digest 5 (MD5) hash. this ensures that the firmware distributed from
    the developer''s Web page is in fact the same as the one you''ve downloaded. For
    example, the OpenWrt project stores MD5 hashes of all firmware images for the
    Whuterian RC6 version in http://downloads.openwrt.org/whuterian/rc6/bin/md5sum.
    Here is a sample:


    ```

    4492c751fb352eea9072b35e283079-openwrt-wrt54g-squashfs.bin

    53a5d697a7df2b7a578a90bca5332b-openwrt-wrt54g-squashfs.bin

    e541c34b1d3067af5a6270a88bd0-openwrt-wrt54gs-squashfs.bin

    ```


    The MD5 hashes of all firmware images for the Whuterian 0.9 version are available
    at http://downloads.openwrt.org/whuterian/0/MD5SUMS.

    To check the MD5 hash, say you downloaded openwrt-wrt54g-squashfs.bin. Now you
    need to use an MD5 hashing utility to generate the MD5 hash and compare it against
    the OpenWrt project has published. Here is how you do that on various platforms:


    +   MacOS X:

    $ md5 openwrt-wrt54g-squashfs.bin

    MD5 (openwrt-wrt54g-squashfs.bin) = 53a5d697a7df2b7a578a90bca5332b openwrt-wrt54g-squashfs.bin

    Linux:

    $ md5sum openwrt-wrt54g-squashfs.bin

    53a5d697a7df2b7a578a90bca5332b openwrt-wrt54g-squashfs.bin

    Windows:

    Download md5sums from http://pc-tools.net/win32/md5sums/

    C:\downloads\md5sums.exe "C:\downloads\openwrt-wrt54g-squashfs.bin"

    MD5sums 1.2 framework for Win9/ME/INT/2000/XP+

    Copyright (C) 2001-2005 Jen Berkes - http://pc-tools.net/

    Type md5sums.exe -h help

    [Path] filename


    ```

    [c:\downloads\openwrt-wrt54g-squashfs.bin

    53a5d697a7df2b7a578a90bca5332b

    ```


    Not only this to ensure that your firmware image is not corrupt, but also it will
    prevent you from contracting malware, in the form of a Trojan, by verifying the
    file you''ve downloaded is in the same file published by the OpenWrt project.
    Although it''s not 100 percent guaranteed against malware, it is an important
    step to take.


    You will want to be certain if you''ve made changes to the Linkys firmware—in
    other words, you were not taking it out of the box for the first time—to restore
    to factory defaults. You'
