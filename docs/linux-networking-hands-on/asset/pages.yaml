  md: 'There are several ways of sharing file systems on a TCP/IP network, but we''re
    going to look at three in particular:


    NFS – This stands for Network File System NFS was developed by Sun Microsystems
    and the default file sharing service for UNIX and UNIX-like systems.


    Samba - Samba is an open-source, free software product that can turn any UNIX-based
    machine into a Windows file and print server. In addition, Samba can even let
    your UNIX box emulate an NT domain controller and let your Windows clients authenticate
    against it. Samba does this by using SMB (Server Message Block) networking and
    NetBIOS over TCP/IP to fool Windows machines into thinking that is just another
    Windows server.


    WebDAV - WebDAV (short for World Wide Distributed Authororing and Versioning)
    is a file-sharing protocol built on top of HTTP. It was originally intended to
    allow groups of Web authors to collaborate easily on the Internet. It allows the
    author(s) to mount the remote file system on their desktop and work with the files
    as they were local. There is a locking mechanism that prevents two authors from
    changing the document at the same time.


    WebDAV is an open, draft internet standard and as can be freely incorporated by
    any software developer who wishes to do. Many vendors have support for WebDAV
    in their products. For example, Microsoft''s Web Folders are entirely WebDAV-based
    and Microsoft Office has built-in support for WebDAV. Most professional Web authoring
    tools (like GoLive and Dreamweaver) include support for managing a site using
    WebDAV.


