    Let''s head up the complexity a little bit. How about a file share that you can
    modify but be read-only for everyone else?


    # Step 1: Create the folder


    For this example, I''ll create a folder under var called all-mine and make it
    owned by my non-root user, tsinclai.


    ```

    mkdir /var/all-mine

    chown tsinclai /var/all-mine

    ```


    # Step 2: Create the Share.


    In the Shares page, create a shared name mine and set the path to /var/all-mine.
    Set the comment to something appropriate, like Only I can Write To This, Ha-Ha!


    So far, it''s like the last example. But now we will give your user access. Set
    the list option to the name of your non-root user. (Note that this will override
    the read-only setting for the share.)


    Click on Commit Changes.


    # Step 3: Test the Network


    Connect to the share with Konqueror like last time. Notice that now you can do
    anything you want in this folder. Connect as a different user and notice that
    this is read-only.


    Now let''s try something a little more sophisticated and set up a shared group
    folder. That is, a share to which multiple users in a group can read and write.
    In addition, we''ll not allow anyone in the group to connect to this share.


    # A Shared Group-Writable Folder


    # Step 1: Create the users and group


    Rather create a new UNIX group, we''ll use the existing group staff. Create at
    least one other user, if necessary and make them members of staff. I''ll use my
    existing login, tsinclai, and add a new user jsmith.


    Create Samba users with the same names as the UNIX users (tsinclai is already
    a Samba user, so I''ll just add jsmith.) Add both to the staff group. You can
    use either Webmin for (the Users and Groups module) or KUser or edit /etc/group
    directly using the vigr


    188'
