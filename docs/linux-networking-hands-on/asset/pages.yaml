    # Introduction to Name Resolution


    The most important service on a TCP/IP network (like the Internet) is name resolution.
    This is the process of associating a human-friendly name with an IP address. Why
    would we want to do this? Please sit comfortably and listen, for I have a tale
    to tell.


    If one computer wants to communicate with another, it needs to know the IP address
    of the other computer. Now this is all well and good, just like having the mailing
    address to send some postcard. When you have a handful of computers, it''s not
    that big of a problem to remember (or, in extreme cases, write down) the IP addresses
    for those computers. So what''s the problem?


    The problem occurs when you have a handful of computers with which you wish to
    communicate. For example, if you wish to connect to, say, the Internet with who-knows-how-many-hundreds
    of thousands/millions/jillions of computers. Now that little sticky note is getting
    a little crowded. We need a better way to look up these addresses.


    So if you''re ready, let''s begin.


    # The Hosts File


    When the Internet was in its infancy (and still called the ARPANet), there were
    only a few hundred computers from government labs, universities and military networks
    connected to it. To help keep track of their IP addresses and host names, a revolutionary
    technique was devised. We wrote them down.


    More specifically, they wrote down in a text file, called hosts. On a Unix/Linux
    system this file is usually found in the /etc/ directory. In fact, every computer
    that has TCP/IP installed a hosts file, even now.


    So does this work? Every computer (or host) on the network has an entry in hosts,
    mapping its name to its IP address, like so:


    ```

    192.168.2.1     myc

    ```


    With this example, when we connect to the computer myc our computer will link
    to hosts to find the IP address. The master hosts file was kept on a computer
    at the University of San Diego (UCSD) and all the other computers on the ARPANet
    would connect to this machine and update their own copies. So everyone''s up to
    date and everyone''s happy, right?


    Not exactly. Flash forward a few years. The Internet, renamed, is no longer the
    exclusive playground of a few scientists, graduate students and military contractors,
    but is to


    +   1 Not a real number

    2 Microsoft is a little more coy about it, burying hosts under C:\SYSTEMROOT%\system32\drivers\etc'
  merge: -1
