    # # Filesystem Management


    We were introduced to Linux filesystems in a previous chapter. Now we''re going
    to discuss them in more detail. Let''s take a look around and get the lay of the
    land. To see what filesystems are currently mounted, run the mount command with
    no parameters.


    ```

    tsclinai@podog:- $ mount

    /dev/hd1 / type ext3 (rw,errors=remount-ro)

    proc on /proc type proc (rw)

    devpts on /dev/pts type devpts (rw,gid=5,mode=620)

    tmpfs on /dev/shm tmpfs rw

    usbfs on /proc/bus/usb type usbfs usbfs (rw)

    ```


    Each of these lines can be read as `<filesystem device> on <mount point> type
    <file format> (mounting options). But where does this information come from? Is
    there a dynamically updated file /etc/mtab (mount table):


    ```

    tsclinai@podog:- $ cat /etc/mtab

    /dev/hd1 / ext3 rw,errors-remount-ro 0 0

    proc /proc proc rw 0 0

    devpts /dev/pts devpts rw,gid=5,mode=620 0 0

    tmpfs /dev/shm tmpfs rw 0 0

    usbfs /proc/bus/usb usbfs usbfs 0 0

    ```


    Of course, this raises another question. How does the operating system know what
    devices get mounted and with what options? The primary configuration file is /etc/fstab:


    ```

    tsclinai@podog:- $ cat /etc/fstab

    # /etc/fstab: static file system information.

    # <file system> <mount point> <type> <options> <dump>

    proc /proc proc defaults 0 0

    /dev/hd1 ext3 defaults,errors=remount-ro 0 1

    /dev/hd5 none swap sw 0 0

    /dev/hdc /media/cdrom0 iso9660 ro,user,noauto 0 0

    /dev/fd0 /media/floppy0 auto rw,user,noauto 0 0

    ```'
