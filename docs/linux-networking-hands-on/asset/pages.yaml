  md: '# Debian version of Webmin is split into multiple packages for convenience.


    At this point, there are no additional materials specifically for instructor use
    as the text was designed to be straight-forward, feel free to e-mail me (tsclair
    AT mac dot COM) and let me know what would be of to use.


    I recommend putting together a small test system and going through these exercises
    on your own before presenting them in class, particularly if you are relatively
    new to Linux. You may also wish to set up a local file server on your network
    for course-specific scripts, documentation and tools. In addition, since software
    packages are being continually updated, the outputs from various commands and
    applications illustrated in the text may vary from your experience. Packages may
    be pulled from the repository or even be temporarily broken. A good Internet connection,
    intellectual flexibility and keen engine skills will be your strongest allies
    when delivering this course. For the most part, I''ve found Linux error messages
    (and those of Debian) to be surprisingly clear and to the point, even to the extent
    of suggesting solutions. Pay attention to what the operating system is trying
    to tell you!


    # Acknowledgments


    As always, a book is the product of more than one individual or organization.
    I''d like to thank my parents for giving me a lifelong love of learning. In addition,
    I''d like to thank Joan Bouillon and Joe Ziegler for giving me the encouragement
    and support I needed. I''d also like to thank my students, for continually challenging
    me to improve and excel.


