  md: '# Chapter 13 – Advanced Services


    # Objectives


    +   - Install and Configure a Directory Service with OpenLDAP


    +   - Install and Configure a Caching Proxy with Squid


    # Terminology


    **ACL** – Access Control List – a list of services available, each with a list
    of users or hosts allowed to access the service.

    **Attribute** – If we think of the entities in the directory as database records,
    attributes are the fields in that. For example, if we had an entity called "Joe
    Smith", it might have attributes such as PhoneNumber, Address and so on.

    **Caching** – A technique of storing frequently accessed data in RAM for faster
    lookups. This area of memory is called a cache.

    **CN** – Common Name – Everything you store in a directory has a name.

    **Container** – Think of these as folders in a file system. They’re used to organize
    information in a directory. They contain leaf objects (see below) or other containers.

    **DC** – Domain Component – Since we use our DNS domain as the naming scheme for
    our LDAP directory trees, each part of that name is a DC object. Example: dc=prairedog,dc=edu
    for the westwood edu domain

    **Directory** – an organized set of data

    **Directory Service** – a network server that contains a database optimized for
    lookups. For example, a company e-mail address book.

    **DN** – Distinguished Name – The path to a particular entry in the directory.

    **LDAP** – Lightweight Directory Access Protocol – A communication protocol for
    directory services

    **LDIF** – LDAP Interchange Format. This is an open, text-based format for importing
    and exporting directory service data.

    **Leaf** – In a directory, these contain records.

    **OU** – Organization Unit – A particular type of container.

    **Proxy server** – any server which acts on behalf of another. For example, a
    Web proxy will take your HTTP requests, contact the Web server and pass the received
    data back to your browser.

    **Schema** – A set of rules for a database. A schema describes all of the possible
    types of records in a database as well as each record''s relationship to the others.


    # Introduction


    In this chapter we will be installing and configuring two somewhat advanced network
    services. The first is OpenLDAP, which is a directory service. In other words,
    it’s a network look-up database. We’ll be using it as a corporate e-mail address
    book.'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'The second server will be caching proxy, using a software package called Squid.
    This will not let us save on Internet bandwidth by caching frequently accessed
    content locally but can let us control who can access the Internet and what they''re
    allowed to do.


    # OpenLDAP


    Regardless of what kind of network you run, you most likely have multiple data
    stores that you have to manage: password files, customer data, access control
    lists, e-mail address books and so on. In network-speak, these are known as directories.
    (Don''t confuse this with file system directories, however. Directories are a
    kind of database that is designed for fast lookups.) Software that presents this
    directory to users or to applications is known as a directory service. Chances
    are you''ve heard of at least one directory service, even if you didn''t realize
    it at the time. Examples are DNS, Microsoft''s Active Directory and Novell''s
    NDS (now known as eDirectory).


    So what''s the point? The point is that all of these directories are data stores
    that have to be maintained. Chances are, the one who has to maintain them is the
    network administrator, or to put bluntly, you. So it would be nice to have a single
    set of tools that would allow you to tie these directories together and maintain
    them with a common interface.


    Enter LDAP. LDAP stands for Lightweight Directory Access Protocol. In other words,
    LDAP is simply a standard set of methods for accessing directory information.
    Just about every directory service understands LDAP which makes it something of
    a ''universal language'' for tying multiple, cross-platform directories together.
    An example of the use of LDAP in a typical network might be as a single point
    of authentication for a mixture of UNIX, Windows and NetWare servers.


    OpenLDAP is a free, open-source software package that implements the LDAP specification
    and runs on a multitude of operating systems, including Windows, Linux, Solaris,
    HP-UX, BSD and Mac OS X. It is not as highly polished a toolset as eDirectory
    or Active Directory, but it is extremely flexible and customizable.


    An OpenLDAP server consists of two parts: the service process (slapd) and the
    backend database which stores the directory data. An LDAP client (like Thunderbird
    or Outlook) connects to slapd, submits a request (like a query), slapd accesses
    the database and issues the response. It looks something like this:'
  merge: -1
  pgno: 249
