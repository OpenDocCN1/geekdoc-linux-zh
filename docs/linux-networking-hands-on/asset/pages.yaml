  md: 'Install the source packages:


    ```

    apt-get install ucspi-tcp-src qmail-src

    ```


    Build the binary packages:


    ```

    build-ucspi-tcp && build-qmail

    ```


    For each of these commands, you''ll be asked where to put the packages. You can
    go ahead and keep the default (in /tmp) but you might want to put them somewhere
    safer. (/tmp gets cleared out at re-boot.) I''ll place them in /root instead.


    We''re almost ready to go, but we have a couple of configuration details left.

    Under /var/qmail/control, create these three files :


    +   me - contains your fully qualified hostname. Ex: mail.sinclair.prairiedog.edu

    defaultdomain - this contains your domain name. Ex: sinclair.prairiedog.edu

    locals - this tells qmail what e-mails are local to this machine. For example,
    these


    +   entries:

    sinclair.prairiedog.edu

    mail.sinclair.prairiedog.edu


    tell qmail that any e-mail sent to these domains (like tinsclai@sinclair.prairiedog.edu
    or tinsclai@mail.sinclair.prairiedog.edu ) should be delivered locally.


    Edit the file /var/qmail/control/rcpthosts and change


    localhost


    to your fully qualified name for your mail server, plus your e-mail


    ```

    mail.sinclair.prairiedog.edu

    sinclair.prairiedog.edu

    ```


    This will make sure qmail will accept e-mail from its own domain. (By default,
    qmail will refuse e-mail from any domain that isn''t listed in rcpthosts. This
    is to keep your server from being used to relay spam.


    Now we need to tell qmail where to put our mail when it arrives. We can do that
    by editing the startup script /etc/init.d/qmail.


    You have three places to put your mail, all controlled by the variable alias_empty
    in the qmail startup script. You simply need to undo-comment the appropriate line:


    ```

    alias_empty = "/usr/sbin/qmail-procmail" - This sends your mail to a program called
    qmail-procmail, which is a mail filtering program that is extremely configurable
    and powerful. (For example, you can set up spam filtering and forwarding.) However,
    setting it up is beyond the scope of this tutorial. The default action is to put
    messages in /var/mail/<userid>, where <userid> is your login.

    ```'
