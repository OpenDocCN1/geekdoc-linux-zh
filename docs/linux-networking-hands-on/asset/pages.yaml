  md: '# Chapter 10 – File-Sharing Services


    # Objectives


    +   - Install and Configure an NFS Server

    - Create an NFS File Share

    - Mount an NFS File Share

    - Install and Configure a Samba Server

    - Create a read-only file share using Samba

    - Create a single-user-writable, world-only file share.

    - Create a group-writable file share using Samba

    - Create a read-only file share using WebDAV

    - Create a group-writable file share using WebDAV

    - Compare Basic and Digest Authentication in Apache


    Terminology

    CIFS – Common Internet File System – a protocol that allows computers to share
    their filesystems. It is sometimes referred to as SMB.

    File Share – a filesystem that has been made available over the network.

    NetBIOS – Network Basic Input/Output System. A transport protocol connecting hardware
    with the network operating system.

    Realm – a domain that shares an authentication database.

    Samba – a free, open-source SMB server for Unix and Linux systems.

    SMB – Server Message Block – protocol used by Windows to share resources across
    a network, including filesystems and printers.

    Superuser – a service that controls other services. Examples are inetd and xinetd.

    WebDAV – Web-based Distributed Authororing and Versioning – Extensions to HTTP
    that allow users to collaboratively edit and manage pages on remote Web servers.


    Introduction

    In this chapter we will be looking at sharing files over a network. In the previous
    chapter we looked at an FTP server to download and upload files, but this is a
    pretty primitive way of doing file sharing. Modern file sharing allows you to
    use a filesystem on the network as if it was stored on your own computer.'
  merge: -1
