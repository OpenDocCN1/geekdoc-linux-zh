  md: '# Appendix A – Quick Start Guide to the Command Line


    As in real estate, the three most important things about using the Linux command
    line are 1) Location, 2) Location and 3) Location. In other words, if you''re
    going to use the command line effectively, you have to know where you are in the
    file system. Fortunately, there are several tools specifically designed for that
    purpose.


    When you''re using the Linux command line, you are virtually inside the Linux
    filesystem, a collection of folders (directories) that organizes the thousands
    of files that are needed to run your Linux system. So, the key to mastering the
    command line is to be able to visualize where you are and what this means we have
    to build up a mental picture of that filesystem.


    Picture a tree. This tree has a short stub that divides into branches. Each branch
    can have leaves and split into more branches. Now let''s sprout the tree and in
    our mind, turn upside down. Now we have the stub at the top, splitting downward
    into branches and leaves. Get that picture in your mind?


    In the Linux filesystem, the system is directory at the top. It''s called the
    *root* directory and is denoted by a forward slash, so: /. The branches underneath
    it are other directories (in Windows they''re called *folders*). The leaves in
    our example are files. So we have a top level folder (the root) which contains
    other folders and files. Okay, now start a console so we can get to the command
    line. (KDE menu -> System -> Konsole should do it.) First, let''s find out where
    we are:


    ```

    pwd

    ```


    This stands for ''print directory''. When I run this command on my machine, I
    get the response:


    > /home/tsinclai


    This is what is known as an *absolute path*. In other words, it''s the complete
    route from the root directory to my current location. Let''s see how this breaks
    down. Under the root directory (the leading /), there''s a folder called *home*
    and underneath there''s a folder called *tsinclai* and that''s where I am in the
    file system. Now, let''s take a look around:


    ```

    ls -a

    ```


    This prints out a list of the files and folders in this location. But does it
    print all of them? Actually, no. This tries:


    You should see a few more entries. That''s because in Linux, any file or folder
    name that starts with a . (that''s a period) is considered *hidden*. These are
    usually system files and settings that you don''t fuss much with anyway. By adding
    the -a option to the ls command we can get a listing of both hidden and non-hidden
    files. (The -a stands for ''all''). All right, let''s do a little moving around.
    The'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'cd command (change directory) will let us our location. We issue the command
    followed by the location where we wish to be. For example, if I want to move to
    the /etc folder, I would type:


    ```

    cd /etc

    ```


    Do not. We use the pwd command to verify that you''re actually there and use ls
    to look around. We can see that there are a lot of files and folders here.


    Now that we''re out of our home directory, let''s talk about your user account.
    There are two kinds of users: root (which wield ultimate cosmic power over everything
    in the system) and everyone else. You, as a regular user, only yield full control
    over your own home directory. If you wish to manage the system, you''ll have to
    get the power of root. It''s not a good idea to log in as root, but rather just
    get administrative power when and where you need it. The easiest way to do this
    is to use the command:


    ```

    tsinclai@pdog:~ su

    Password:

    podog:/home/tsinclai#

    ```


    > (You need to enter the root account password to switch to the root user. To
    get back to your previous user, simply type exit.)


    Sometimes we''ll want to view the contents of a text file. If it''s a short file,
    we can use cat:


    ```

    cat /etc/hosts

    ```


    For files that span more than one page, we can use either less or more, which
    display the file one screen at a time.


    ```

    less /etc/passwd

    ```


    Sometimes we only want to look at the last few lines in a file. (System logs,
    for example, have their most recent entries at the end of the file.) For this
    we can use tail, which shows the last ten lines of the given file:


    ```

    tail /etc/passwd

    ```


    We may want to send the contents of a file or the output of a command to another
    command. For this we use the pipe (|) character:


    ```

    cat /etc/passwd | sort

    ```


    This command sends the contents of /etc/passwd to the sort command and the output
    will be a sorted version of /etc/passwd. We may wish to redirect the output of
    a command to a file. We can use the redirect (>) character:


    ```

    cat /etc/passwd | sort > pass.sorted

    ```'
