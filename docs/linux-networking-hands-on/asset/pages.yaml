    # Chapter Summary


    Name resolution is the process of mapping IP addresses to host names.

    in the early days of the Internet, name resolution was done using a flat text
    file called hosts. DNS replaces the flat file database with a distributed system
    where the name information is spread over multiple servers that work together.

    The top of the DNS hierarchy is known as root and is denoted by a dot (.).

    The Internet is divided into top level domains (TLDs) such as .com, .net, .org
    and .edu.


