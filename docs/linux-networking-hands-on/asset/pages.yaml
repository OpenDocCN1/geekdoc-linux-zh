    # Chapter Summary


    FTP was one of the first Internet file transfer protocols. FTP is a plain text
    protocol, in that all of its network data is transmitted in plain text. Because
    FTP uses plain text, login names and passwords are transmitted in the clear. Anonymous
    FTP is when a user logs into the server with the user name anonymous and uses
    their email address as the password. CUPS is a modern print service that supports
    a broad range or print connection types. Access to printers in CUPS is controlled
    through acl directives in cupsd.conf. By default, a CUPS printer is not available
    for remote users.


