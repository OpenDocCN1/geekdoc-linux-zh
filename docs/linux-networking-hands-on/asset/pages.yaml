    # Protect Your Web Site With A Password


    What if you want to post a Web page, restrict access? As it turns out, you can
    protect an

    entire site or just a single page by requiring a login ID and password². It''s
    not much harder to set

    up a regular site. Apache supports multiple types of authentication. We''re going
    to use the most

    simple (and thus the most secure) type known as basic authentication.


    # Step 0 – Create an alias for the site


    Although we can use one of our current sites and set up a password-protected page,
