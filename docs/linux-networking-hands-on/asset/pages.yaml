  md: '![](img/d96c1eab2a6e614c032e1320a5285200_250_0.png)


    We''re going to set up a simple corporate ''white pages'' or address book using
    OpenLDAP, but you can do so much more. For example, you can put your user and
    group information in the database so it can be accessed from anywhere on the network.
    If you include authentication information, you get single sign-on for everyone
    on your network. OpenLDAP can use other services for authentication, such as Kerberos.
    Like this:


    ![](img/d96c1eab2a6e614c032e1320a5285200_250_1.png)


    You can get even more elaborate, using OpenLDAP to support single sign-on in a
    mixed Windows/Linux network. Like so:'
