- img_proc: true
  md: 'The OS uses this number to identify you instead of your login name. The good
    news is that this means you can change your login name as much as you want without
    losing any of your privileges. The not so good news is when you mount an NFS share,
    the remote system looks at your UID and determines your permissions based on that
    number. Let me give you an example.


    Let''s say your login name is jmiit with a UID of 500. The remote NFS server has
    a user called jblow, also with a UID of 500. So, no problems. When you mount an
    NFS share from the server, the system will see your UID and assume that when it
    comes to permissions on the mounted share, you are jblow. Worse yet, if the remote
    server doesn''t have a user with your UID, you will effectively be an anonymous
    guest user on that machine. When you''re mounting your home remotely, this can
    be a big problem.


    There are possible solutions for this, depending on your situation:


    +   1. Create a new user on both machines with the same UID, copy your home directory
    to the new users and modify ownership and permissions accordingly.


    +   2. Use a network user directory (like LDAP or NIS) to establish a set of common
    accounts and UIDs. (This is more of a beter long-term solution.)


    # Samba


    # Install/Upgrade Samba


    Samba is part of the default Linux install, we''ll go ahead and grab the latest
    version and some other packages we''ll need.


    ```

    apt-get install samba samba-doc

    ```


    We''re also installing some online documentation (samba-doc).


    There is a web-based administrative tool for Samba called swat, but we can''t
    install it until the samba package is completely installed. So, let''s install
    swat now:


    ```

    apt-get install swat

    ```


    NOTE: During the post-install for samba, you might be asked if you wish to run
    Samba as a daemon (background service) or controlled by inetd (a service that
    manages other services). The default, as a daemon. You may also be asked if you
    wish to create a password database for Samba. Take the default of Yes. During
    the post-install, you''ll be warned to re-write your Samba configuration file,
    smb.conf.


    # Enable SWAT, or what''s a superuser?


    Unlike other services we''ve seen so far, swat doesn''t run on its own, but is
    controlled by another service called inetd. Inetd is a superuser, a service that
    controls all other services. Here''s how it works:


    +   The inetd configuration has a list of available services, along with what
    port they use and what program to start for each service.


    There is another superuser called xinetd, which offers additional features.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'inetd listens for requests to any of its managed services.


    When a request comes in, inetd will start up the service, hand off the request
    and go back to listening.


    So why not run the service on its own? First of all, many services don''t need
    to be on all the time. We can save resources by only running them when needed.
    Second, since inetd acts as a gatekeeper for services, we can use it to control
    when and how the service is used. For example, we can set certain services to
    only be available certain times of the day or deny service requests from untrusted
    networks.


    Now that we know swat is controlled by inetd and have an idea how inetd works,
    how do we persuade inetd to enable swat? Inetd gets its marching orders from its
    configuration file, /etc/inetd.conf, so we can enable and disable services by
    editing this file and sending a HUP message to inetd.


    However, with Debian, there is an easier way. The Debian developers have provided
    a program called update-inetd, which will handle all the work for us. So, to enable
    swat, all we have to run the command:


    ```

    update-inetd --enable swat

    ```


    That''s it. We''re ready to move on to the next step, configuring Samba.


    # Configure Samba


