  md: '# Chapter Summary


    Linux has many built-in commands for monitoring system resources.

    The /proc file system is a virtual filesystem that contains information about
    the state of the system.

    The file /proc/cpuinfo contains information about the CPU.


    Some files in /proc are writable, allowing you to change system settings on the
    fly.

    The free command gives us information about free and used memory.

    The vmstat command gives us data about virtual memory.

    The ps command displays information about running processes.


    A partition is a logical section of a physical drive.

    Formatting a disk partition prepares it to read and write files.

    A formatted partition is also a filesystem.


    There are several native utilities that can create, delete and format Linux partitions.

    Linux has support for a wide variety of file system formats.


    The utility parted and its GUI frontend parted can also re-size partitions.

    A file system can be mounted temporarily using the mount command.

    To set up a file system to mount at re-boot, place an entry for it /etc/fstab.


    Linux networking can be managed by low-level tools ifconfig and route.

    Running ifconfig and route with no options will display the current settings for
    the network interfaces and the routing table.


    The network interface that is always available is the loopback interface, designated
    by the Linux device name lo.

    Debian offers two high-level network configuration utilities, ifup and ifdown,
    that work with a settings file /etc/network/interfaces.


    On a LAN, Linux will use DHCP to default up the Ethernet interface.

    When using Linux as a server, a static (permanent) IP address is recommended.


    User information is kept in the file /etc/passwd and /etc/group.

    For security purposes, passwords are kept in /etc/shadow, which is only readable
    by the user.


    User information in /etc/passwd includes the user name, UID, GID, home directory
    location and default command shell.


    The operating system keeps tracks of users and groups by their ID numbers, not
    their names.

    The Linux GUI is separate from the kernel, to improve stability and flexibility.


    Since the X Window system is modular, any layer can be replaced without disrupting
    the other layers.

    The X Window system is network-transparent, so applications can be displayed anywhere
    on the network, regardless of where the actual application is running.'
