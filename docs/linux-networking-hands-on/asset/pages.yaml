    # Chapter Summary


    Cryptography is the science of encoding and decoding secret messages.

    Encryption is the process of encoding a secret message. Decoding a secret message
    is known as decryption.

    One of the most basic forms of encryption is symmetric encryption, where both
    parties use the same code key to encrypt and decrypt messages. This is also known
    as private key encryption.\Public key encryption, also known as asymmetric encryption,
    involves all parties having a pair of unique keys, one secret and one public.

    A hash function generates a unique number for a file or text sequence.

    Hash functions are widely used for authentication.

    The openssl command is part of the OpenSSL cryptography toolkit and can perform
