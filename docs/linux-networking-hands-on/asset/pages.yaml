    # Digital Certificates


    # Introduction


    This section is dedicated to give the student an basic understanding of how digital
    certificates work in OpenSSL. A digital certificate is simply an identifier, like
    your social security number or driver''s license number. They are used to identify
    entities like e-commerce servers or to make sure when you buy something on the
    Internet you are not dealing with a criminal who is trying to steal your credit
    card numbers and other personal information.


    In this section, we''ll demonstrate how to set up a Certificate Authority (CA),
    how to create a certificate signing request (CSR) and how to use the signed certificate.'
