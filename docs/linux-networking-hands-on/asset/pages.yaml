  md: '# Setting up a Certificate Authority


    A Certificate Authority (CA) is a trusted third party that can sign keys and digital
    certificates. If the CA root certificate is installed in your e-mail client or
    Web browser, then any key or certificate signed by that CA will be trusted.


    Many services use digital certificates to set up secure network connections, including
    Web servers, e-mail servers and even Webmin. Let me illustrate how the process
    works in a general way.


    ![](img/d96c1eab2a6e614c032e1320a5285200_138_0.png)


    Figure 6 SSL/TLS Example


    +   1. The customer connects to the secure server and their Internet software
    gives a public key to the server.

    2. The server responds with a digital certificate. This not only identifies the
    server, but is signed by a trusted CA and includes a copy of the server''s public
    key and a symmetric key encrypted with the public key of the client.

    3. The client software checks the CA signature on the certificate and makes sure
    it is from one of the authorities that the software trusts. If it is, the certificate
    is accepted as genuine and the symmetric'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'key is decrypted with the client''s secret key.


    4. The client and server use the symmetric key to encrypt their transaction and
    once they are done, the session key is discarded. A new key will be used for next
    time.


    Fortunately, it''s not too hard to start carving out our own, signed certificates.
    In fact, we''re going to use the openssl command, which we looked at earlier in
    this chapter.


    For this example, let''s assume two users: Jane, who is the Certificate Authority
    (CA) and Bill, who administers a service (Webmin, in this example) that requires
    a digital certificate.


    First Jane sets up her CA by creating a CA key and signing certificate:


    ```

    (as root, all on one line)\openssl req -new -x509 -days 730 -keyout /etc/ssl/private/cacert.pem

    -out /etc/ssl/cacert.pem

    ```


    NOTE: She only has to do this once.


    | Taking each openssl option in turn: |

    | req - this tells openssl we''re going to be working with digital certificates
    and certificate requests. (Much like the enc option was used for encryption earlier.)
    |

    | -new Normally we''re generating a certificate request. Used with the x509 option,
    we''re generating a self-signed certificate for use with our CA. By default we''ll
    generate a private key for digital signatures as well. |

    | -x509 This tells the number of days for which the certificate is valid. The
    default is 30. |

    | -keyout This is the filename where we will be writing the newly created private
    key. The default is set in /etc/ssl/openssl.cnf. |

    | -out This is the filename for the newly created certificate. The default is
    set in /etc/ssl/openssl.cnf. |


    # Advertising Your CA


    We''re not quite done. If Jane''s CA is not a well-known trusted authority, she''ll
    have to create a CA root certificate and post it so that users can import it into
    their Web browsers: openssl x509 -in /etc/ssl/cacert.pem -out /etc/ssl/cacert.crt


    NOTE: Jane only needs to do this once.


    This will create a certificate called cacert.crt. Jane should then post this file
    where customers and other users can get it at. For example, on a Web site or shared
    filesystem.


    # Certificate Signing


    Now she is ready to sign other certificates. Bill needs one, so the first thing
    he has to do is create a Certificate Signing Request (CSR) and a secret key for
    the service for which he needs a certificate. (We''ll use Webmin as an example.)


    2 To get a complete set of available options, use the man req'
