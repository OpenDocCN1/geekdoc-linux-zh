  md: 'The rule will write all mail service messages to the file /var/log/mail.log.
    A typical log message takes the format


    <timestamp> <hostname> <program> <message text>


    where:

    <timestamp> is the date and time when the event occurred.

    <hostname> is the name of the system on which the event occurred.

    <program> is the program generating the message.

    <message text> is the log message itself.


    A sample log message is:


    ```

    [Mon Sep 12 11:22:07 2005] [notice] Apache/2.0.54 (Debian GNU/Linux) DAV/2-mod_ssl/2.0.54
    OpenSSL/0.9.7e configured -- resuming normal operations

    ```


    Note that the text might be more than one line.

    Logs are extremely useful for troubleshooting. To make the best of them, use the
    tail

    command to see the most recent messages. If you use tail -f option, this will
    let you watch

    t log in real time.


    Though most messages are generated by system programs, you can send messages to
    the log

    yourself (from a shell script) using the logger command. For example:

    root@pdog:~ logger this is a sample message

    creates the following line in /var/log/messages:

    Sep 12 15:04:47 pdog tinsclai: this is a sample message


    This utility is very useful if you write custom scripts to manage your system
    and want them to

    able to log their status.


    # LogWatch


    LogWatch is a log monitor that runs nightly by default and mails the results to
    you. It''s

    modular and you to fine-tune your reports to as close a tolerance as you want.
    Logwatch is

    b on logfile groups, each of which is an individual log, multiple logs and even
    archived logs.


    Once you''ve installed logwatch, you can see what services you use to filter and
    report on

    files by listing /etc/logwatch/conf/services.


    NOTE: Logwatch configuration files are case-insensitive in the configuration file
    /

    etc/logwatch/conf/logwatch.conf. Let''s look at some currently enabled values:


    +   E) LogDir – the default directory for your system''s logs.

    F) TmpDir – the default directory for temporary files.

    G) MailTo – The default email address for reports.

    H) Print - if set to Yes, the reports will be printed to stdout instead of mailed.'
