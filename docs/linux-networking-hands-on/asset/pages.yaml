    # Step 3 – Set up an entry in fstab for our new partition.


    In order for any filesystem to be automatically mounted, there has to be a corresponding
    entry in


    /etc/fstab that describes how and under what conditions the filesystem is mounted.

    generic format for an entry is:


    ```

    <file system> <mount point> <type> <options> <dump> <pass>

    ```


    where

    <file system> is the name of the device we are mounting

    <mount point> is the location where the device is being mounted

    <type> is the filesystem type or format

    <options> are the settings to be used when mounting this device (we''ll go over
    these in a moment)

    <dump> indicates whether this file system should participate in backups and is
    mostly used these days since backup software is more advanced. You can just set
    this to 0.

    <pass> indicates what order the file system is checked by the fsck tool at boot
    time. The root


    filesystem should have a 1 and others use 2. Filesystems that don''t need to be
    automatically checked (such as a CD) should have a 0 here.

    Before we create an entry for our new partition, let''s have that discussion about
    mount.

    Here are the options that are usually available on a Linux system:


    | Option | Description |

    | --- | --- |

    | async | All I/O must be done asynchronously |

    | atime | Update inode time when accessed (this is the default) |

    | auto | Can be mounted with the -a option |

    | defaults | Sets options to rw, suid, dev, exec, auto, nouser, and async. |'
