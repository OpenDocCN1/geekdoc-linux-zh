    Debian uses a management system called APT (Advanced Package Tool). This is a
    very powerful and flexible suite of software that give you complete control over
    installing, updating and removing software. The source of this suite''s power
    is the Debian community''s strict adherence to well-thought set of policies. These
    are rules that govern how the system should behave in a wide variety of circumstances.
    Debian enforces policies regarding such issues as how a package is organized,
    how the installer should handle problems and where files should be located. This
    makes things very consistent and helps package management as automatic as possible.


    The Debian maintainers have defined three main categories of software:


    +   4. stable - This is rock-solid, with updates and security patches applied
