  md: '# Chapter 12 – System Management


    # Objectives


    +   - Use Built-in System Tools


    +   - Scheduling Tasks Using at, batch and cron


    +   - Using Gkrellm


    +   - Using KsysGuard


    +   - Using LogWatch


    # Terminology


    **Bogomips** – a made-up benchmark that allows you to compare one CPUs performance
    directly with another.


    **Child process** – a process spawned by another process.


    **Nice level** – the amount by which a process is willing to lower its priority
    level so that other processes can get access to system resources.


    **P** – the process of copying data between RAM and the hard drive to enable virtual
    memory.


    **Parent process** – a process that spawns one or more processes.


    **Priority** – the priority level of a process tells the kernel how important
    it is and determines how much system resources are given to the process. Priority
    levels range from -20 (the highest) to 20 (lowest). The default is 0.


    **PID** – Process ID – a number assigned to a running process by the system.


    **PPID** – Parent Process ID – the number of a process'' parent either started
    by a user or the system.


    **Process** – a running program,


    **syslog** – System Logging Daemon – the service that monitors messages from running
    processes and the kernel.


    **Utilization** – the fraction of a resource''s total capacity currently in use.


    **Virtual memory** – a trick to maximize use of physical RAM by copying unused
    data to a section of the hard drive to free space for new programs or data.


    **Virtual filesystem** – a set of folders and/or files that exist only in RAM
    but can be browsed as if they were on disk.


    # Introduction


    With all the services and software we''ve installed so, it''s time to step back
    and take a look at what tools and techniques we have to keep an eye on our systems.
    There are third-party tools available, Linux provides many built-in tools to monitor
    what is happening with your computer, as we''ve seen. Linux also has tools to
    help automate many, if not all, standard maintenance tasks.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Scheduling Tasks Using at, batch and cron


    It''s one thing to perform routine tasks while you''re at the office, but not
    all of these can be done during normal working hours. For example, file system
    backups should be done when the systems are idle, which is usually in the middle
    of the night. Even during regular working hours, you sometimes have things to
    do and you need to offload these boring, routine tasks to someone else. Should
    I say something else?


    I have a personal motto: For creative stuff, humans are your best bet. For the
    boring, repetitive stuff, get a computer. So wouldn''t it be great if we had the
    computer do these tasks by themselves while we''re off doing the creative stuff?
    Fortunately for us, Linux has several built-in tools to help us accomplish this.


    +   * For one-off commands that need to run at a certain time, we can use the
    at utility. The general format is:


    ```

    at [TIME]

    ```


    which gives you a command prompt


    ```

    at>

    ```


    Type in the commands you wish to run at [TIME]. When you type, <Ctrl>-d. The specifications
    for [TIME] are very flexible. It understands keywords like now, noon, midnight
    and teatime (4 pm). It will also accept times in HH:MM format with an AM or PM.
    You can specify a particular day in the format month-name day or adding the year
    in MM/DD/YY format. You can specify now + <time units> where time units are minutes,
    hours, days or weeks. You can also specify a time with today or tomorrow. Let''s
    try a simple example:


    ```

    tsinclai@podog:-$ who

    tsinclai pts/0      Sep 19 10:02 (192.168.2.3)

    tsinclai@podog:-$ echo hello > /dev/pts/0

    hello

    tsinclai@podog:-$ at now + 2 minutes

    warning: commands will be executed using /bin/sh

    at> echo hello world > /dev/pts/0

    at> <EOT>

    job 3 at 2005-09-19 11:28

    tsinclai@podog:-$ stq

    3      2005-09-19 11:28 a tsinai

    tsinclai@podog:-$ at -1

    j3      2005-09-19 11:28 a tsinai

    tsinclai@podog:-$ date

    Mon Sep 19 11:26:42 MDT 2005

    tsinclai@podog:-$ hello world

    ```'
  merge: -1
  pgno: 237
- img_proc: true
  md: '```

    Mon Sep 19 11:28:16 MDT 2005

    tsinclai@pdog:-$ atq

    tsinclai@pdog:-$

    ```


    There are a couple of additional commands we can use at:


    +   - atq - listing the jobs in the queue.

    - atrm - remove a job from the queue by job number.


    So what if we have jobs that aren''t time-critical but we still want to run when
    the system is idle?

    For we use the batch command. This uses the same subsystem as at but instead of
    waiting for a particular time, jobs using batch will wait until the load average
    drops below 1.5.


    ```

    tsinclai@pdog:-$ batch

    warning: commands will be executed using /bin/sh

    at echo this a batch job > /dev/pts/0

    at at 2005-09-19 11:32

    tsinclai@pdog:-$ this is a batch job

    ```


    ```

    tsinclai@pdog:-$ uptime

    11:33:06 7 days, 21 min, 1 user, load average: 0.00, 0.00, 0.00

    ```


    (Note that the job ran right away because I scheduled it on a lightly loaded system.)

    There are two files that determine whether a user can schedule jobs using at or
    batch: /etc/at.allow and /etc/at.deny. Here are the rules:


    +   - The superuser can always use at.

    - If /etc/at.allow exists, then only users listed there are allowed to use at.

    - If /etc/at.deny doesn''t exist, then /etc/at.deny is checked.


    So what if we have jobs that have to be repeated at certain times? This is the
    purpose of the cron service. The cron daemon wakes up every minute and checks
    to see if there are any jobs scheduled. If so, it runs with the authority of the
    user who scheduled the job.

    How do we set the schedule? There are a number of ways. First of all, let''s see
    if we''re allowed to use cron. For we need to check /etc/cron.allow and /etc/cron.deny.
    Here are the rules for the use of cron:

    If /etc/cron.allow exists, then you must be listed there to use cron.

    If /etc/cron.allow does not exist and /etc/cron.deny, then you must not be listed
    in /etc/cron.deny to use cron.

    If neither file exists, then only the superuser can use cron.

    Assuming we''re allowed to use cron, we can repeat jobs using the crontab command
    to create a file of scheduled commands. One job is listed per line in the following
    format:


    ```

    <minute> <hour> <day-of-month> <month of year> <day of week> <cmdline>

    ```'
