    9639 blocks (5.00%) reserved for the super user

    First data block=1

    24 block groups

    8192 blocks per group, 8192 fragments per group

    2016 inodes per group

    Superblock stored on blocks:

    8193, 24577, 40961, 53729

    ```


    This filesystem will be automatically checked every 39 months or 180 days, whichever
    comes first. Use tune2fs -c or -i to override.


    # Step 2 – Verify we can mount and unmount the partition.


    Now that our partition is formatted, let''s see if we can mount it and make it
    available for use. In order to do this, we''ll need a mount point. This is the
    location in the filesystem hierarchy for our new partition. To put it simply,
    we''ll need an empty directory. Since this is just a test, we''ll create a temporary
    mount point and use the mount command to add our new partition:


    ```

    # mkdir /mnt/hda3

    # mount -t ext3 /dev/hda3 /mnt/hda3

    # ls -al /mnt/hda3

    total 17

    drwxr-xr-x 3 root root 1024 2006-01-04 16:25 ..

    drwxr-xr-x 3 root root 4096 2006-01-04 16:31 ..

    ```'
