    # Public Key Encryption


    So far, encryption seems pretty straightforward. You use a secret key to encode
    a message and the receiver uses their secret key to decode the message. However,
    if you have an insecure channel (like the Internet), how can you exchange secret
    keys? In addition, how do you know the person sending the message is who they
    say they are? The answer is using public key encryption.


    Public key encryption uses two keys for each user, a public key and a private
    key. The public key can be published anywhere but the private key is always kept
    secret. Now when A wishes to send an encoded message to B, she uses B''s public
    key to encode the message and her own private key to sign the message. When B
    receives the message, he uses A''s public key to verify the signature. This means
    no sensitive information travels across the insecure channel in clear.


    There are several software packages available to help you use public key encryption.
    One such freely available package is GnuPG (for GNU Privacy Guard), which is usually
    installed by default on Linux systems. We will be using GnuPG to run the command
    and manage our keys.


