  md: 'So why would you install software from source rather than a pre-compiled binary
    package?

    Actually, there are several possible reasons:


    +   - The software may only be available in source form.

    - A binary package may be available, but not for your system.

    - You may wish to examine the source code for bugs or security holes before you
    install it.

    - You may want to customize the source code or remove unwanted features before
    installing it.

    - Since pre-compiled software is targeted at lowest common denominator hardware,
    you may wish to optimize this software for your hardware configuration.


    All major Linux distributions offer source packages and almost all Linux software
    is available as a generic tarball.


    # Summary


    To sum up, both Windows and Linux will let you install pre-compiled software either
    by hand or by using a package manager. In addition, Linux will let you install
    software from source either by hand or by using a package manager. The following
    table illustrates the comparison more readily:


    | Linux | Windows |

    |---|---|n| Binary (manager) | .rpm, .deb, .tgz | Control panel, setup.exe |

    | Source (manager) | .rpm, .deb, .tgz | N/A |

    | Binary (by hand) | .tar.gz | .zip |

    | Source (by hand) | .tar.gz | N/A |


    Table 3-1 A comparison of Windows and Linux software management.


    # Software Management with RPM


    Linux distributions such as Red Hat, Mandriva and SuSe use a package manager called
    RPM, which stands for RPM Package Manager. Like other systems, RPM can install
    both binary and source packages, as well as let you manage and query the package
