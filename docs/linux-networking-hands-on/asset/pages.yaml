  md: 'A Samba server can replace any Windows server, up to and including a Primary
    Domain Controller.

    A Samba server can join and/or authenticate to a Windows ADS (Active Directory
    Service) tree.

    WebDAV stands for Web-based Distributed Authoring and Versioning.

    WebDAV was designed to make it easy for multiple people to manage a Web site,
    but it can also be used to provide file services.

    Most Internet-aware software has WebDAV client capability, as Microsoft Office
    and Adobe InDesign.

    WebDAV is an extension of HTTP, the standard WebDAV communication protocol.

    To enable WebDAV use in Apache, you have to load the dav and dav_fs modules.

    A WebDAV file share can be created just like other Apache site, but with additional
    directives.

    Authenticating to a WebDAV share can use any method supported by the Web server
    host.

    Web-based authentication can come in two varieties: Basic and Digest

    Basic authentication is not very secure but Basic, but is supported only on newer
    clients.

    Digest is more secure than Basic, but is supported only on newer clients.

    A Samba server can also authenticate using a database that contains user names
    and passwords.


