  md: 'In the procs column:

    * r – number of running processes

    * b – number of sleeping processes

    * swpd – number of processes swapped out but still runnable.


    In the memory column:

    * swpd – amount of virtual memory used.

    * free – amount of idle memory.

    * buff – amount of memory used as buffers.

    * cache – amount of memory used to cache frequently used data


    In the swap column:

    * si – Amount of memory swapped from disk

    * so – Amount of memory swapped to disk.


    In the io (input/output) column:

    * bi – Blocks sent to the hard drive (in blocks per second)

    * bo – Blocks received from the hard drive (in blocks per second)


    In the system column:

    * in – Number of interrupts per second

    * cs – Number of context switches (changes from one process to another) per second.


    In the cpu column:

    * us – User time

    * sy – System time

    * id – Idle time.

    * wa – Time spent waiting for Input/Output.


    # Disk Space


    It''s very important to keep track of how much drive space your system is using,
    in ways that you might not suspect. For example:

    * If the tmp partition runs out of space, the system will shut down.


    * If the tmp runs out of space, programs that write to /tmp will be unable to
    start up, or if already running, may crash.


    A basic utility for monitoring disk space usage is df:


    ```

    root@pdog:~# df

    Filesystem K-blocks Used Available Use% Mounted on

    /dev/hdl 5162796 2183160 2717380 45% /

    ```


    This gives you the available and used space in 1024 byte blocks. To get the data
    in more human-readable format, use the -h option:

    root@pdog:~# -h'
