  md: '# Introduction


    This book was written for me.


    Too terse? All right, I''ll start again.


    I teach computer programming and data networking at a technical college, where
    the academic work is complemented by the hands-on imperative. So when I was asked
    to produce a course in UNIX system administration using Linux, I was delighted.
    From my personal and professional experience, UNIX in general and Linux in particular
    are the very embodiment of the hands-on imperative, where students can just dive
    in and have complete top-to-bottom control of their systems.


    Like any course author, I looked for textbooks. This is where I began to sense
    something was wrong. There were no lack of reference books. In addition, online
    documentation on the Internet was also plentiful, since Linux was born and raised.
    But there was a distinct lack of textbooks.


    Let me distinguish between a textbook and a reference book a reference book provides
    a convenient source of information for someone who is already working in the field
    and is designed to be dipped into as needed, rather than being read from front
    to back. A textbook is designed to be read straight through. In fact, the knowledge
    is presented with that mind, presenting simple concepts that first build in later
    chapters to more complex skills.


    Now I''ll admit that some reference books are, superbly, written in this style.
    (The "Blank for Dummies" series comes immediately to mind.) However, a textbook,
    unlike a reference, also contains features designed to aid the instructor in presenting
    the material and the student in absorbing it. I''m talking about glossaries, chapter
    review exercises, labs, test material and chapter summaries.


    That all being said, from a certain perspective, there are quite a few Linux (and
    UNIX) textbooks, by my own definition. However, the majority of them are about
    shell scripting. The remaining few (and there are very few) deal with very basic
    command line administration procedures such as user management, printing, file
    and directory permissions and so on.


    So here''s dirty little secret about Linux textbooks.


    Ready?


    They completely miss the point of running Linux.


    Okay, sure you should be comfortable with the command line and know about file
    systems programs but the point of running Linux (and also a UNIX) machine is to
    connect to other Linux (or UNIX or Windows) machines over a network, either as
    a server or a client or both.


    Linux has networking built into its very heart and soul. To install Linux and
    not'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'let it communicate with any other computers is akin to chopping the arms and
    legs off of your child so they can''t run and explore their world. When you talk
    about administering a Linux computer, you are necessarily talking about administering
    Linux networking.


    “But, Tom,” you say, “what about all that stuff with users and processes and folders?
    What about Printing?”


    Relax. We''ll get to it. It''s just that we''ll be doing a lot of really interesting,
    cool and real-world stuff while we sneak other things in as we go.


    What kind of stuff? What about setting up a Web server, complete with a secure
    site? What about e-mail? How about network-accessible address book? Encryption?
    Digital certificates? Web-based administration tools? Webmail?


    There''s more, of course. The point is, in learn how to administer a Linux system,
    you have to learn how to administer a Linux network. The goal of this book is
    to start very simply and keep adding additional services and clients, all the
    time building up our knowledge and skill sets in real hands-on work. At the end
    of the way, you''ll have a basic, but quite powerful Linux-based network. As a
    bonus, along the way, you''ll learn how to use managers, configure file and folder
    permissions and even print stuff.


    I mentioned other little secrets about Linux textbooks, didn''t I? All right,
    here''s another:


    # They''re stuck at the command line.


    Now, to be sure, you can do everything you need to do at a command line and there
    are even some tasks that are much easier and faster at the command line but that''s
    not the only tool in your kit. In addition to working at the command line, I''ll
    be showing you several popular GUI and Web-based tools that you can use to make
    your life easier. Remember, if you only have a hammer, every problem looks like
    a nail.


    Okay, here''re stuck with Red Hat.


    All right, Red Hat is (in the U.S. anyway) the most commonly used distribution
    of Linux and authors, being the kindly and thoughtful souls that they are, feel
    obliged to write to what they consider to be a ‘standard’.


    Now I have a problem with that. First of all, all Linux distributions work the
    same way. With the exception of minor differences in file system layout and software
    package management, when you''ve seen one Linux system, you''ve seen them all.
    Yes, I realize this is heresy in some circles.


    “Aha!”, you cry, “Got you! If all Linux distributions are the same, why not use
    Red Hat?”'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'For the simple reason that Red Hat is a terrible learning distribution. It''s
    fine for setting up Web servers, database machines and providing all the other
    information technology needed for anyone.


    However, for someone just learning, there''s far too much fussing around that
    gets in the way of accomplishing a task. Experienced system administrators are
    used to this and take it in stride, but for the classroom you want a Linux system
    that will get out of your way and let you work.


    That''s why I wrote this book using Kanotix, which is derived from the Debian
    Linux distribution. Debian is very logically organized, well thought out and designed
    with the recent certification of Ubuntu (another Debian-based distribution) is
    well on its way to becoming another standard. Debian will let you do what you
    need and take care of the low-level drudgery. So what''s Kanotix?


    Kanotix is a bootable CD-ROM that gives you a full-blown Linux desktop without
    having installing anything on your hard disk. However, if you wish to install
    it on your hard disk, Kanotix comes with an installer and once that''s done, it
    becomes Debian. The latest free version of Red Hat, Fedora, on four CDs. Kanotix
    needs only one.


    You can''t do anything with Red Hat until you run the installer. Kanotix provides
    two gigabytes of software you can use before you touch the installer.


    With Red Hat, you can do basic Linux system rescue with the install CD. With Kanotix,
    you can do system rescue, virus scanning, repair, backups, password resets and
    more for your Linux and Windows computers. (Yes, you can even print.)


    So feel free to jump in with both feet, have fun and maybe even learn something.
    I did and I''d like to share it with you.'
  merge: -1
