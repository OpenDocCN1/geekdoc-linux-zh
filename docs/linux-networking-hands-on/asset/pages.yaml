  md: 'In fact, mkfs is just a front-end for a number of utilities. The tool that
    actually runs depends on which filesystem you decide to use and which are installed
    on your system. For example, if I want to use the ext3 filesystem, mkfs runs the
    utility mkfs.ext3.


    I''m going to use ext3, with a journaling filesystem. This means that the operating
    system keeps track of all the file transactions and if my computer shuts down
    unexpectedly, it will restore my data to the last known state. Linux supports
    a number of filesystems with this capability and it''s a good idea to use them
    if you want a little extra protection for your data. NOTE: This does not mean
    that you don''t have to make regular backups!


    At rate, I''m going to format my new partition:


    ```

    # mkfs -t ext3 /dev/hda3

    mke2fs 1.39-WIP (10-Dec-2005)

    Filesystem label=

    OS type: Linux

