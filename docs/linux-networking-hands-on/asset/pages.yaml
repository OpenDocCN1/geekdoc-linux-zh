    # Webmail


    There are lot of standalone e-mail clients available these days, but you may not
    always have access to your PC when you wish to check your mail. Adding a Web front
    to your e-mail server lets users manage their mail from a standard Web browser
    on any Internet-connected PC.


    How works like this: You set a Web server (in use Apache) and install a set of
    applications CGI (Common Gateway Interface) scripts. When you execute a CGI script,
    whatever is coded into it and the output is standard HTML code that is then passed
    from the Web server to your browser. CGI makes it very easy to build a Web browser
    interface to access any tool or service. (Webmin is an excellent example of this.)


    In this case, the CGI scripts are to access your IMAP mail server. You type in
    your login and password on the Webmail page, and the scripts log into the mail
    server for now. After that, when you make changes in the Web interface (reading/writing/deleting)
    the scripts send these commands to the mail server.


    > NOTE: The Webmail server doesn''t have to be on the same box as the e-mail server
    but it should be able to connect to the mail server


