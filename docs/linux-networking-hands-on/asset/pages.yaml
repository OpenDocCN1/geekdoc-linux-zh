  md: '# Chapter 14 – Network Authentication with Kerberos


    # Objectives


    +   - Manage Authentication with Linux-PAM


    +   - Install and Configure a Kerberos Authentication Server


    # Terminology


    **ACL** – Access Control List


    **Host** – a computer that can be accessed over the network


    **KDC** – **Key Distribution Center** – A machine that issues Kerberos tickets.


    **Kerberos** – in Greek mythology, the three-headed dog that guards the entrance
    to the underworld. In the computing world, Kerberos is a network security package
    that was developed at MIT.


    **Kerberos Client** – An entity that can obtain a ticket. Usually a user or a
    host. **Keytab** – a key table file containing one or more keys. A host or service
    uses a keytab file in much the same way a user his/her password file.


    **PAM** – **Pluggable Authentication Modules** – a set of function libraries provide
    code for authentication, password and session management.


    **Principal** – a string that names a specific entity to which set of credentials
    may be assigned. It generally has three parts:


    +   1) **primary** – the first part of a Kerberos principal. In the case of a
    user, it is the user name. In the case of a service, it is the name of the service.


    +   2) **Instance** – the second part of a Kerberos principal. It gives information
    that qualifies the primary. The instance may be null. In the case of a user, the
    instance is often used to describe the intended use of the corresponding credentials.
    In the case of a host, the instance is the fully qualified hostname


    +   3) **realm** – the logical network served by a single Kerberos database and
    a set of Key Distribution Centers. By convention, realm are generally all uppercase
    letters, to differentiate the realm/instance from the internet domain. The typical
    format of a Kerberos principal is primary/instance@REAL.


    **Service** – any program or computer you access over a network. Examples of services
    include "host" (a e.g., when you use telnet and ssh), "ftp" ("krbtgt" (authentication;
    cf. ticket-granting ticket), and "pop" (email).


    **Ticket** – a temporary set of electronic credentials that verify the identity
    of a client for a particular service.


    **TGT**-**Ticket-Granting Ticket**. A special Kerberos ticket that permits the
    client to obtain additional Kerberos tickets within the same Kerberos realm.


    # Introduction


    In this chapter we are going to discuss moving user authentication off of the
    local machine and out to the network. For easier user management and the convenience
    of single sign-on for'
