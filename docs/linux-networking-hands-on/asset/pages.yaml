    # Squid - A Caching Proxy Server


    Simply put, a proxy server sits between your computer and (usually) the Internet.
    When your computer requests something from the Internet, the proxy server intercepts
    the requests and services it for you. It will download the data you send, to it
    and save a copy for itself in a cache. Later, if someone else requests the same
    page, the proxy server will quickly check to see if the page has changed and if
    it hasn''t the proxy will serve its local copy. In its simplest form, a caching
    proxy (another name for this kind of server) can speed up Internet access.


    But a proxy server can do much, much more. It can redirect requests to different
    computers, re-write client requests and filter Internet content as banner ads.
    Squid is a very powerful, complex piece of software and this is not meant to be
    a complete guide but merely an introduction. If you''re interested, there are
    many sources of documentation on Squid that will let you unlock its full power.


    # Install Squid


    Piece of cake. We''ll use APT:

    apt-get install squid webmin-squid


    (The package webmin-squid is the Webmin module you can use to administer your
    Squid proxy. This is optional, but a good idea since we''re already using Webmin
    to administer our computers.)


    # Configure a basic caching proxy


    The configuration file for Squid is /etc/squid/squid.conf. Open it in your favorite
    text editor and search for a line that contains http_access. NOTE: Use the editor''s
    search tool, since'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'the file is forty-eight printed pages long! The http_access option determines
    who is and isn''t allowed to connect to this server. After all, if it was wide
    open to the world, then anyone could use it for their own nefarious purposes,
    as such for a spam relay. Add a line at the top of the section that reads:


    ```

    http_access allow all

    ```


    I know, I know, we just opened it up to the world, despite what I said before.
    Don''t worry, we''ll fix that up in a bit.


    Restart the service:


    ```

    /etc/init.d/squid restart

    ```


    # Test your proxy server


    Just about every Web browser knows how to connect to a proxy server, so that makes
    for a simple test. For this example, we''ll use the Mozilla browser.


    +   - In the Tools menu, select Options -> General -> Connection Settings

    - Click on the radio button labeled "Manual proxy configuration" and put the IP
    address of your proxy server and the port (3128) in the HTTP Proxy: entry

    - Connect to a Web site, either locally or on the Internet. The page should render
    in your browser with no problem. If you get an error message from Squid, go back
    to squid.conf again and check the http_access line you added to make sure you
    spelled everything correctly. (You might also have to re-start Squid).


    # Squid Access Control


    Now we know our proxy works, let''s lock it down a bit to control who can use
    it. First let''s restrict it to users on our own network. Open squid.conf again
    and locate and check with the keyword acl. Add the line:


    ```

    acl MyNetwork 192.168.2.0

    ```


    (Substitute your own network address for 192.168.2.0, of course. If you''re familiar
    with the CIDR addressing format, you can use that instead.)


    +   - Change the http_access line you entered earlier from:


    ```

    http_access allow all

    ```


    to


    ```

    http_access allow MyNetwork

    ```


    This will tell the proxy to only accept incoming (src) requests from hosts on
    our network. In theory we could use instead of the line:


    ```

    http_access deny !MyNetwork

    ```


    to specifically refuse requests from hosts not on our network. (The ! in UNIX-means
    ''not'').

    Restart Squid and with your browser to make sure we didn''t break anything.


