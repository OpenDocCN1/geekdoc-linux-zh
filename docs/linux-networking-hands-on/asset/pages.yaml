    # Terminology


    **A Record** – a DNS record that consists of a host name and an IP address. Also
    known as an Address record.

    **Authoritative server** – a resolver that contains all the information for a
    particular zone or instead stores (caching) the results of queries.

    **CNAME Record** – A DNS record that creates an alias that points to an A record.
    For example, the alias might really correspond to pdog.sinclair.prairiedog.edu.
    Also known as a Canonical Name record or a Name Alias record.

    **DNS** – Domain Name Service. DNS is a TCP/IP protocol designed to resolve IP
    addresses, given a host name. A computer needs an IP address before it can connect
    to another.

    **Iterative query** – If the local resolver has the answer, it responds. If not,
    it sends the error "host not found." No other lookups are done.

    MX Record** – A DNS record that maps an e-mail domain to one or more e-mail servers.
    Also known as a Mailchanger record from a host name.

    **Name Resolution** – Getting an IP address

    **NS Record** – A DNS record that maps a name server to the domain it supports.
    Also known as a Name Server record.

    **Primary name server** – a name server that gets its zone information from local
    files.

    **PTR Record** – A DNS record that lets us look up the host name associated with
    an IP address. Also known as a Pointer record.

    **Recursive query** – If the local DNS server has the answer, it responds immediately.
    If not, it searches the rest of the DNS hierarchy for the answer.

    **Resolver** – a DNS server that looks up DNS records on behalf of a client.

    **Resource Record** – a record in a DNS database.'
