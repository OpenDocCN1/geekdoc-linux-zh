    # The Linux Boot Process


    Now that we have a working installation of Linux, we can begin to take a closer
    look at how it works. The most obvious place to start is with the system boot
    process. In order to understand how Linux boots, we need to take a moment and
    learn a little UNIX history.


    When UNIX was originally developed by Bell Labs, it was used for, among other
    things, to experiment with operating systems. The researchers there decided to
    control the UNIX works by coming up with different system states, or *run levels*.
    The idea was that each run level would have different capabilities, depending
    on which programs were loaded and which weren''t. They decided on seven run levels:


    | Run Level | Function |

    | 0 | Halt |

    | 1 | Single User mode, no network,no GUI. |

    | 2 | Single User mode, networking,no GUI. |

    | 3 | Multi-user, networking, no GUI. |

    | 4 | Undefined |

    | 5 | Multi-user, networking, GUI. |

    | 6 | Reboot |


    To move from one run level to another, the machine needs to go through the run
    levels in between them. The process that controls what run level is called init.
    This program is the one that starts up all the other processes. When a Linux system
    boots, it first loads the kernel into memory. The kernel loads the device drivers
    it needs to support the installed hardware on the PC and then starts up init.


    But how does init know to do? When init starts, it looks in its startup file /etc/inittab
    (short for **init table**). A typical entry in inittab has the following format:


    ```

    id:runlevels:action:process

    ```


    id – a unique 1 to 4 character identifier.

    runlevels – The run levels for which the action should be taken

    action – Which action should be taken

    process – the process to be executed'
