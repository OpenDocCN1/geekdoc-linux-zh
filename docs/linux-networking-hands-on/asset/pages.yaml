  md: 'Alone, configure WINS as not used and click on Yes to expose home directories.
    To make these changes permanent, click on the Commit button.


    Now lets examine our server settings. Click on the Globals button.

    We''re not going to change much here, but please notice that each entry has a
    Help link to the left. If you click on that, you''ll be taken to a page where
    this setting is explained in more detail. Now for a few changes.


    Under the heading Base Options, Set the Workgroup value to your last name. Set
    the NetBIOS name to set to User and Encrypt passwords is set to Yes.


    For now, that all we want to do. However, you may wish to spend a little time
    examining the online help for the other options. When you''re ready, click on
    the button Commit Changes.


    In order to connect shared resources on a Samba server you need to have an account.

    Actually, you need a UNIX account plus a Samba account. So let''s create a Samba
    account mapped to your Linux user account. Click on the Password button.


    Under Server Password Management, enter your non-root user in the User Name field.
    Set the password for this user. (Make it the same as your Linux password, for
    convenience.) When you''re done, click on the button labelled New User.


    Now we''re ready to create a new file share.


    # A Read-only Network File Share


    This is the simplest way to create. For this example, we will be creating a folder
    called samba-docs contains the Samba documentation, which is stored in /usr/share/doc/samba-doc.


    Step 1: Click on the Shares Button.

    In the text field to Create the Share button, enter the name of your share. This
    can be almost any legal Windows share name, but we''ve decided to use samba-docs.
    Enter this name and click on Create. You''ll be taken to a page where you can
    enter the settings for your file share.


    Step 2: Configure the file share.

    In the Base Options section, set the Commit field to Online Samba Documentation.
    This is the description of the share that people will see when they browse the
    network. In the same section, set the path to the share as /usr/share/doc/samba-doc.
    This is the folder that we are sharing.


    The rest of the options allow us to do things like only allow certain users to
    connect to this share, give certain users write access, whether she is visible
    on the network and for forth. The default options, however, make this share read-only
    and available to anyone with a valid Samba account. That''s exactly what we want,
    so we''ll click on Commit Changes. (Don''t be alarmed if the browser refreshes
    and brings you back to the same page. Your share has been created.


    Step 3: Test the file share.'
