  md: '![](img/d96c1eab2a6e614c032e1320a5285200_311_0.png)


    # From the Introduction:


    "This book was written for me.

    Too terse? All right, I''ll start again.

    I teach computer programming and data networking at a technical college, where
    the academic work is complemented by the hands-on imperative. So when I was asked
    to produce a course in UNIX system administration using Linux, I was delighted.
    From my personal and professional experience, UNIX in general and Linux in particular
    are the very embodiment of the hands-on imperative, where students can just dive
    in and have complete top-bottom control of their systems."


    Linux is a fun, powerful, flexible, scalable operating system that was born and
    bred on the Internet. So it''s only appropriate that a book like this, which provides
    step-by-step instructions for building a modern TCP/IP network using Linux.


    Tom Sinclair started teaching after fourteen years of industry experience. He
    has done systems administration, technical support, IT architecture and systems
    design with such firms as AT&T, Lucent Technologies and KPMG LLP. He has a Master''s
    Degree in Computer Science from Loyola University of Chicago. He currently teaches
    courses in network security, computer programming, game software development and
    Linux systems administration.


    Tom lives in Colorado with his wife Betty and their two cats, Charlie and Scruffy.'
