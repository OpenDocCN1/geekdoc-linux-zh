    must obtain a new ticket when connecting to a new host.


    +   - allow_renewable – determines whether this principal can obtain renewable
    tickets. That is, tickets that can be renewed at or before their expiration time.
    By default the KDC issues renewable tickets. However, if you wish to force a principal
    to re-authenticate with the KDC, you can disable this for this principal.


    +   - allow_proxiable – determines whether this principal can obtain proxiable
    tickets. Proxiable tickets are similar to forwardable tickets, except they can
    only be used to obtain further service tickets.


    +   - allow_dup_skey – determines whether this principal can obtain a session
    key for another user. This controls user-to-user authentication.


    +   - requires_preauth – This attribute determines whether a principal has to
    preauthenticate to another service before the KDC will administer a ticket.


    +   - requires_hwauth – This attribute determines whether a principal has to preauthenticate
    to a hardware device before the KDC will administer a ticket.


    +   - allow_svr – Allows or denies the issuance of service tickets for this principal.


    +   - allow_tgs_reg – specifies whether the ticket granting service (TGS) is allowed
    to request a service ticket for this principal. Disabling this is pretty useless.


    +   - allow_tix – determines whether this principal will be issued any tickets.
    This is one way to lock out a Kerberos user without deleting their principal.


    +   - needchange – determines whether the principal has to change their password.
    The default is to turn off, but it''s easy to enable. Once enabled, it will be
    disabled after the user resets their password.


    +   - password_changing_service – This attribute is set for a principal that acts
    as a password-changing service. Generally useless for most things.


    # Chapter Summary


    Kerberos is named after the three-headed dog that guarded the gates to the underworld.\Kerberos
    authentication uses encrypted tickets to identify users and hosts to the network.

    Aberos principal is a database entry for a host, user or service.

    Linux-PAM is a flexible method of handling authentication using simple text configuration
    files that point to function libraries.


