    # File System Check and Repair


    The primary tool for finding and fixing problems is fsck. Like mkfs, it''s only
    a front end that calls a filesystem-specific tool to do the actual work. You can
    tell which file systems are supported on your machine with the locate command:


    ```

    pdog:~# locate fsck.

    /sbin/fsck.ramfs

    /sbin/fsck.ext2

    /sbin/fsck.ext3

    /sbin/fsck.minix

    /sbin/fsck.nfs

    ```


    +   Normally, fsck will run automatically at boot time based on one of two conditions:

    - The partition has reached its maximum number of reboots or mounts

    - The operating system detects that the file system was shut down cleanly


    > Every local file system has a setting flag called a clean bit. If the file shuts
    down normally, the clean bit gets set. If it doesn''t (for example, if the computer
    gets accidentally unplugged), the clean bit doesn''t get set at the next reboot,
    the file system will be automatically checked and repaired if necessary.'
