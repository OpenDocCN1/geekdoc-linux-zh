- img_proc: true
  md: '+   - If rc sees a link beginning with S (such as S20ssh), it runs the corresponding
    script in /etc/init.d with the start option. On the other hand, if it sees a link
    beginning with K, it runs the linked script with the stop option. The two digit
    number after the S or the K lets control the order in which the scripts run.


    So if we want to have a service automatically start or shut down in a certain
    run level, we simply make a startup script in /etc/init.d and create a symbolic
    link into the appropriate /etc/rc* directory. All right, maybe this isn''t so
    simple. Fortunately, there is a script called update-rc.d which lets easily create
    and delete the links as needed. In general, to set a service to start at boot
    time, use the command:


    ```

    update-rc.d <svc> defaults

    ```


    where <svc> is the name of the script for the service in /etc/init.d (without
    the angle brackets). To disable a service from starting automatically, use the
    command:


    ```

    update-rc.d -f <svc> remove

    ```


    So how can we change run levels manually? There are a number of ways to do this.
    The most direct way is to send the run level as an argument:


    ```

    init 5

    ```


    Another way is to use the telinit command:


    ```

    telinit 5

    ```


    There are also several commands that communicate with init:

    reboot – change to run level 6 (reboot)

    halt – change to run level 0

    poweroff – change to run level 0 and if possible, shut off power to the PC.


    To change the behavior of init without rebooting, you must edit the file /etc/inittab
    and send a message to init asking it to re-read its configuration file:


    ```

    kill -HUP

    ```


    (NOTE: Since init is the first process to start, it always has the process ID
    of 1.)


