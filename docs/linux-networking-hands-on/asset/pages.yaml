  md: '# Chapter 3 – Basic System Administration


    # Objectives


    +   - Using Built-In System Tools

    - Filesystem Management

    - Network Management

    - User Management

    - X-Windows


    # Terminology


    **clean bit** – A file system flag that is set when a partition unmounts normally.

    **directory record** – A unique identifier associated with a directory, consisting
    of the inode and directory name, in addition to file records for the files contained
    in the directory.

    **DISPLAY** – the system variable that contains the address of the screen where
    the X client renders it.

    **file record** – A unique identifier associated with a file, consisting of the
    inode and file name.

    GID** – short for group ID, a unique number associated with a user group.

    **inode** – A unique number associated with a file or directory. The operating
    system tracks files and directories by inode, not by name. Each partition has
    its own set of inode numbers.

    **NIC** – Short for Network Interface Card, the physical hardware that connects
    the computer to the network media.

    **superblock** – a data structure that describes the characteristics of a file
    system.

    **UID** – Short for UID, a unique number associated with a user.


    # Introduction


    Now that we have a working Linux system, let''s see about taking care of day-to-day
    tasks. In other words, I''m talking about system administration. Since Linux is
    a multi-user operating system, there are a few extra considerations than we have
    with a single-user PC. Fortunately Linux has a lot of built-in tools that will
    us monitor and manage our PC.


    # Using Built-In System Tools


    In any computer system, there are three sets of resources that should be monitored:


    +   - CPU utilization

    - Memory

    - Disk Space'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'In some cases, their performance is related. For example, running low on memory
    space increases the use of virtual memory increases disk utilization and puts
    more load on the CPU. Consequently, your overall computer system will become dramatically
    slower. Fortunately there are a number of built-in tools that can help us, system
    administrators, to monitor these resources.


    # CPU


    The first tool we need to discuss is /proc. This is hard to describe at first,
    so we''ll take it one step at a time. First of all, it''s a virtual filesystem.
    That is, it''s a set of folders and files that exist only in RAM and doesn''t
    correspond to any file system on your hard drive. As a matter of fact, it contains
    information about your system and is updated dynamically as your system changes.
    It''s a useful resource any other tool can use the information contained here.
    So what does this have to do with the CPU? While you can''t get utilization information
    from /proc you can at least get data about your CPU type:


    ```

    $tsinclair@pddog$: cat /proc/cpuinfo

    processor : 0

    vendor_id : GenericIntel

    cpu family : 6

    model : 5

    model name : Celeron (Covington)

    stepping : 2

    cpu MHz : 400.913

    cache size : 32 KB

    fdiv_bug : no

    hlt_bug : no

    f00_bug : no

    coma_bug : no

    fpu : yes

    fpu exception : yes

    cpuid level : 2

    wp : yes

    flags : cpu vme de pse pse scr msar pae cx8 apic sep mtr

    bogomips : 799.533

    ```


    What kind of information can we get from /proc? From the man page, here''s a summary
    (not complete listing):

    * /proc/[number] - a numerical subdirectory for every running process. The subdirectory
    is named for the process ID (PID).

    * /proc/[number]/cmdline - the full command line for the process with the PID
    of [number].

    * /proc/bus/pci/devices - Information about PCI devices.

    * /proc/cmdline - The arguments passed to the kernel at boot time.

    * /proc/meminfo - Information about real and virtual memory.

    * /proc/net/arp - an ASCII-readable dump of the kernel ARP table.

    * /proc/pci - A list of all the PCI devices found at boot time.'
