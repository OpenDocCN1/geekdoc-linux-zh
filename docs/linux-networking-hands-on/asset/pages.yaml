  md: 'E-mail is built in UNIX and thus into Linux from the ground up. So every UNIX/Linux
    system has an MTA installed, even if only to handle e-mail between local users.


    So why not use the MTA software? Why replace it with qmail? There are two reasons
    for this. there are many possible MTA packages out there, so I''d have to produce
    documentation for each possible version of installed software and chapter would
    be many pages longer. Using qmail allows me to come up with a single set of configuration
    and installation instructions and provide a consistent environment. This is the
    practical reason. The other reason is that qmail, although it has its detractors,
    is fast, stable and very secure. In addition, even though it takes some time fiddling
    to install it and set up, once you get that it just runs and you don''t have to
    fuss with it very much.


    The question, then, how do we uninstall the current MTA? As we saw in the chapter
    package management, we need to know the name of the package to remove it. The
    easy way to do this is to query the package database. Always, there is more than
    one way to do it. I''ll mention this at two points.


    The first method is to directly query the package database using dpkg. We know
    that the -l option will dump a list of all installed packages. We can just pipe
    this to the grep command to locate what we want. For example, on my system


    ```

    dpkg -l | grep Mail


    ii exim 3.36-17 An MTA (Mail Transport Agent)

    ```


    So at this point, it looks like email is the current MTA. However, let''s check
    this other way. A file that is associated with MTA software is /usr/lib/sendmail.
    To find out which package supplies this file, we can use dpkg once again:


    ```

    dpkg -S /usr/lib/sendmail

    ```


    When I ran this on my desktop PC, I got the result:


    ```

    exim: /usr/lib/sendmail

    ```


    This confirms our previous, so now we know which package to remove. Since I can''t
    predict which one on your particular machine, I can offer some guidelines:


    +   * apt-get remove <pkg> to delete the package.

    * Pay attention to the messages returned by this command. You may have to uninstall
    other packages first and you may get a message that other packages will be removed
    which you''ll have to re-install later.

    * Taking good notes during this process will help.


    At some point, the old software will finally be removed. Let me run through an
    actual example on one of my test servers so you can see the process.


    Determine which e-mail package is installed:


    ```

    tsinlai@podgres:~$ dpkg -S /usr/lib/sendmail

    exim4-daemon-light: /usr/lib/sendmail

    ```'
