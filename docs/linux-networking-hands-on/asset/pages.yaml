  md: '# Chapter 6 – Encryption and Secure Networking


    # Objectives


    +   - Set up a GnuPG Key Pair

    - Describe the Web of Trust

    - Install and Configure Kgpg

    - Set up a Certificate Authority

    - Create a Signed Digital Certificate for Webmin


    # Terminology


    **Algorithm** - The set of simple instructions that combine to accomplish a task.
    Computer codes are algorithms.

    Asymmetric Encryption** – Another name for public key encryption. It''s called
    this because the sender and receiver use different keys. See also Public Key Encryption.

    Certificate Authority** - A trusted third party whose purpose is to sign certificates
    for network entities that it has authenticated using secure means.

    Cipher - a cryptographic algorithm used to encrypt and decrypt files and messages.

    Cryptography** - The study of codes. Literally, it means “secret writing”.

