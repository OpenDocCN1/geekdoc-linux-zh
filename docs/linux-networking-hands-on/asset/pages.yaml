  md: 'your users. We begin with a discussion of PAM, a flexible authentication system
    available for Linux and some other Unixs. Then we''ll use this knowledge to set
    up a Kerberos authentication server and have our users login to the network using.
    Finally, we''ll look at two ways to keep an eye on the bad guys trying to exploit
    your computer over the network.


    # Linux-PAM


    Managing user authentication used to be easy. You had a file of user names and
    password hashes and the system had to check here. However, with the increasing
    complexity of networks and network services, this simple technique doesn''t scale
    very well. But how do you change to a new system when you need to re-code every
    single application that uses the old?


    Sun Microsystems developed a new authentication mechanism known as PAM (Pluggable
    Authentication Modules) and most Linux distributions use this by default. The
    PAM system is scalable, easily upgradable and when a new authentication system
    is introduced, not a single PAM-aware application will have to be re-written.


    # Overview


    The PAM system consists of two parts: a set of libraries that provide the code
    to authentication and a configuration file for each PAM-aware application. This
    way, the job of authentication is separate from the programs that need to authenticate
    and when we change our authentication mechanism, we simply add a new library file
    and modify a configuration file. PAM is a modular design and gives you complete
    control over how users are authenticated.


    # PAM Configuration:


    There are two ways to configure PAM: /etc/pam.conf or with application-specific
    configuration files in the folder /etc/pam.d. The latter is more commonly used,
    but regardless of which you prefer, simply pick one and don''t use the other.
    Most modern distributions, including Debian, use the latter method so that''s
    we''ll focus on in this document.


    # Configuration File Syntax:


    The PAM configuration files under /etc/pam.d are named after the service they
    support (ex. /etc/pam.d/login is the PAM configuration for the login program)
    and consist of at least one line of text with the following format:


    ```

    module-type      control-flag      module-path      args

    ```


    where:

    module-type can be one of four types:


    +   auth

    account

    session

    password


    This indicates the work that the module is doing. The auth module provides authentication
    in two ways: by instructing the application to ask the user for identification
    and by


    244'
