    \ readily available so if you need some special function you can go ahead and\
    \ do yourself.\n\n> NOTE: Though Webmin provides a friendly GUI, you still need\
    \ to understand what's going on behind the scenes. For example, the Samba server\
    \ module has many configuration options and is too complex for someone unfamiliar\
    \ with Samba to use. Therefore, it is highly recommended that you familiarize\
    \ yourself with the traditional UNIX tools before using the equivalent module\
    \ in Webmin. This has the additional advantage of deepening your understanding\
