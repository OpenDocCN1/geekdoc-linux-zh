  md: '# Chapter 11 – Electronic Mail


    # Objectives


    +   - Install and Configure an SMTP Server

    - Install and Configure a POP3 Server

    - Install and Configure an IMAP Server

    - Configure an E-mail client to send and receive signed, encrypted e-mail.

    - Install and Configure a Web front-end for our E-mail server.


    # Terminology


    **IMAP** – Internet Message Access Protocol – A TCP/IP protocol that allows an
    e-mail client to manage its messages without having to download them from the
    mail server.

    **LDA** – Local Delivery Agent – This takes the mail from the incoming mail queue
    and moves it to the user''s mailbox.

    **Mailbox** – The folder or file where the user''s mail is stored. The default
    location is /var/spool/mail/<userid> where <userid> is the name of the e-mail
    user (without the angle brackets).

    **MTA** – Mail Transport Agent – A server designed to relay mail from its source
    to its destination.

    **MUA** – Mail User Agent. An e-mail client, like Outlook or Thunderbird.

    **Notifier** – A service that watches the mailbox for new e-mail and notifies
    the user. Most e-mail clients have a built-in notifier.

    **POP3** – Post Office Protocol ver. 3 – A TCP/IP protocol that allows an e-mail
    client to get messages from a server.

    **SMTP** – Simple Mail Transfer Protocol - The open standard Internet protocol
    used to transfer e-mail from one server to another.


    # Introduction


    Though most people these days are familiar with sending and receiving e-mail,
    few give any thought as how the mail gets from one machine on the Internet (or
    corporate network)- to another. Behind the scenes, there are multiple software
    packages diligently working to transfer and route our messages seamlessly as possible.


    Breaking down, here''s what happens when bob@hotmail.com wants to send an e-mail
    to jane@mac.com (Let''s say they''re both using Linux):


    Bob uses his MUA (Mozilla) to send the message into a local queue. The MTA (qmail)
    notices the message, that it''s not for someone local and tries to send it over
    the Internet. Qmail'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'sends a request to the SMTP server of Bob''s ISP e-mail server. The SMTP software
    responds and Bob''s message is handed off to it sent back onto the Internet. The
    MTA in the e-mail server sees that the message is not for local and sends it out.
    The e-mail is relayed (using SMTP) from machine to machine until it reaches Jane''s
    ISPs e-mail server. The mac. server sees that this message is for Jane, one of
    its users and puts it into Jane''s mailbox, a file on the e-mail server. When
    Jane uses her MUA (Evolution) to contact her e-mail server, it sends a request
    to the POP server asking if she has any mail. She does and the POP server lets
    her download it to her machine.


    Follow that? Let''s get dig in and start building our own e-mail server for handling
    remote mail and maybe the previous paragraph will make more sense. Once we get
    that working, we''ll set up a Web-based front for your email service.


    # E-Mail


    First, we need to create some DNS records to accommodate our e-mail server. If
    we don''t this, we''ll have to put the full host name of our e-mail server as
    per your address, like


    tsinlai@instructor.sinclair.prairiedog.edu


    It''s more professional to be able to use a domain name with our e-mail instead:


    tsinlai@sinclair.prairiedog.edu


    Also, when we set our clients, we''d like to point them to those whose name look
    like this:


    mail.sinclair.prairiedog.edu


    instead of:


    instructor.sinclair.prairiedog.edu


    So we''ll be creating a DNS record for the host instructor and telling our DNS
    about your e-mail domain.


    Add a new A record called with the IP address of your e-mail server.


    Add an MX record noting that your e-mail domain (in our example sinclair.prairiedog.edu)
    is being handled by the server mail.sinclair.prairiedog.edu.


    However you do this (editing the file by hand or using Webmin), you should have
    two records in your master zone file that look something like this:


    | mail.sinclair.prairiedog.edu. | IN CNAME pdog |

    | sinclair.prairiedog.edu. | IN MX 10 mail |


    # Part I - The MTA


    Every Linux system has an MTA already installed. This is usually sendmail, which
    is somewhat complex for the beginner. Qmail, on the other hand, is relatively
    easy to set up and configure and the author has a standing $1000.00 reward for
    anyone able to compromise it. The reward has gone unclaimed since 1997. In any
    event, even with qmail this is the hard part of the setup.


    # Step 0 - Uninstall your current MTA'
