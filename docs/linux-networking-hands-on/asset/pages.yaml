  md: 'That''s it. Your Master KDC is ready to go.


    # Administering the KDC


    The command for managing the Kerberos database is kadmin. There is another version
    of kadmin that doesn''t use the Kerberos database to authenticate called kadmin.local.
    This is useful when setting up your first principals, as you can simply run this
    as root and be allowed access to the database. Regardless of which command use,
    the interface is the same. Here are the commands available in both kadmin and
    kadmin.local (more detailed options are available on the kadmin man page):


    +   - add_principal – Add a principal to Kerberos.

    - delete_principal – Delete a principal from the database.

    - get_principal – Retrieve the properties of the given principal. This command
    will take wild cards for the principal name.

    - list_principals – Print a list of all principals in the database.

    - modify_principal – Change some property of a principal, such as password, policy
    or other attributes.

    - add_policy – Policy refers to a password policy. Policies can be used to enforce
    good password rules. This command will create a new policy with the settings supply.
    (We''ll discuss policies in more detail later in this chapter)

    - get_policy – Print the settings for the given policy.

    - list_policies – Print all policies defined in the database.

    - modify_policy – Change the settings for a given policy.

    - change_password – Change the password of the given principal.

    - ktadd – Add one or more principals to a keytab. Remember, a keytab is used like
    a password for services.

    - ktremove – Delete one or more principals from a keytab.


    Most of these commands can be abbreviated. To see a list of all available commands
    in kadmin, type lr (list requests) at the prompt.


