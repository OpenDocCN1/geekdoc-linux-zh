  md: '# Part II - The POP3 Service


    Step 1 - Install and configure the POP software.


    We''re using dovecot, a fast secure POP/IMAP server which is pretty easy to install
    and configure. To install the POP server:


    ```

    apt-get install dovecot-pop3d

    ```


    To configure dovecot, edit the file /etc/dovecot/dovecot.conf. This file is extremely
    well commented so each section is clearly laid out. First change the line:


    ```

