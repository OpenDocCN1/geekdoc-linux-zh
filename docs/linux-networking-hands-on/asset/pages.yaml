    | nomand | Do not allow mandatory locks on this filesystem. |

    | nsuid | Do not allow setuid or setgid settings to take effect on this filesystem.
    |

    | nouser | Only root can mount this file system. (This is the default) |

    | owner | Allow an ordinary user to mount this file system if they are the owner
    of the device. |

    | remount | Attempt to remount an already-mounted device. This is mainly used
