    \ information, of course.) Verify that you can create and modify the contents\
    \ of this share.\n\n# Chapter Summary\n\nNFS is the native UNIX file sharing protocol\n\
    samba lets a UNIX server look like a Windows server by using the SMB protocol.\n\
    Samba is a Windows networking protocol for sharing out network resources.\nSamba\
    \ is administered by editing the configuration file smb.conf.\nThere are GUI tools\
