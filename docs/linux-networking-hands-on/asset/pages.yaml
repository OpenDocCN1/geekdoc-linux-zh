  md: '# # Chapter 2 – Installation


    # ## Objectives


    +   * Install Linux

    * Describe the Linux Boot Process

    * Configure the Installation

    * Run the Insteller


    # ## Terminology


    **Journaling File System** – A file system that records changes (writes/reads)
    to a data file called a journal. This allows the operating system to restore the
    files to their last known state after an improper shutdown.

    **Partition** – a logical division of a hard drive dedicated to a particular operating
    system.

    **RAM** – Random Access Memory. A place for your PC to store data. Any program
    you wish to run or open must be loaded into RAM first.

    **Run Level** – A mode of operation for computers based on System V UNIX.

    **Swap** – a partition of the hard drive used for virtual memory. (See Virtual
    Memory)

    **Virtual Memory** – A way to improve utilization of physical memory (RAM) by
    using the hard drive as storage for items not currently in use.


    # ## Introduction


    When you think about using Linux, you usually feel like have to clear out some
    disk space and install it on your PC. These days, however, there are a lot of
    distributions that are being distributed on what are known as “Live CDs”. That
    is, bootable CD-ROMs that will start up a Linux environment without the need to
    install anything. Live CDs allow you to try out different distributions and tools
    without too much muss or fuss.


    So what if happened to find one like you? Many of CDs have installation programs
    that let you copy the software on the CD to your hard drive. These programs aren''t
    usually as sophisticated as installers from Red Hat or Mandrake but they''re quick,
    pretty straight-forward and you automatically have a rescue disk if you need one.


    # ## Installing Linux


    When it comes right down to it, installing Linux these days is very much like
    installing any operating system. That is, the steps are:'
  merge: -1
  pgno: 37
- img_proc: true
  md: '+   * Find out if your hardware is compatible.

    * Insert the CD (or sometimes DVD)

    * Reboot the computer

    * Partition your hard drive

    * Copy files from the CD/DVD

    * Reboot.


    Let''s take these steps one at a time, first in a general way, then more specifically
    with the installation of Kanotix.


    # Check Hardware Compatibility


    Admittedly, this is more of a problem with Linux than it is with Windows or Mac
    OS X. However, PC hardware has become much more standardized than it once was,
    making compatibility less of a problem than it used to be. In addition, Live CD
    distributions are designed to work well with a wide range of hardware. It''s still
    a good idea to do a little research, however, regardless of what operating system
    you plan to install.


    So how do we make sure our hardware will work? We have three sources of information:


    +   * The software vendor – In our case, the developer of the Linux distribution
    that we''re going to install. The commercial vendors will maintain a list of supported
    hardware on their Web sites and most come with free installation support (assuming
    you purchased your software from, course). For other, hobbyist, distributions,
    you can check their Web sites, online discussion boards and e-mail the developer.

    * The hardware vendor – More and more hardware vendors are producing Linux drivers
    for their hardware and advertise their Linux compatibility.

    * Do it yourself – With the growth of Live CD Linux distributions, this is becoming
    an easier and more popular option for determining hardware compatibility. Boot
    the Live CD on your computer and note which hardware is detected and which is
    not. Since you don''t have to install anything, you can quickly try different
    CDs to determine which is the most compatible. Once you''ve completed this step
    to your satisfaction, you''re ready to install Linux.


    # Booting up the Linux CD


    If you have a PC that supports booting off of a CD, this is no- brain-brainer.
    If it doesn''t, there is a floppy disk image on the CD (usually in a folder called
    ‘images’) that will create a boot floppy that starts off the CD. This is beyond
    the scope of this thesis is all I''ll say about the topic. You may also have to
    modify something in your PC''s screen to tell it boot off the CD-ROM drive, so
    check your computer''s documentation. If you were able to get through Chapter
    1 with no problems, you''ll be right here.


    When you start up with Linux, you will always be presented with a screen where
    you can set different options for booting. In addition, you may be able to press
    certain function keys to get more information. Read the screen messages carefully.
    If it times out and begins to boot before you''re done, just hit the reset button.
    You won''t lose any data.


    A standard Linux CD will boot into the installation utility and guide you through
    setup. A live CD will boot you by default into a Linux desktop. From there you
    can start an installation'
