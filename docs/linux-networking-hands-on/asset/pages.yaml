  md: 'So if you''re ready, let''s begin.


    # FTP


    So far, so good. At this point, we have a DNS server up for name resolution and
    a certificate authority (CA) to produce valid digital certificates for future
    secure services. Now''s time to build on our network foundation. An FTP server
    is simple to set up and quite useful. However, before we begin, we need to consider
    some potential security issues. The FTP protocol transmits data across the network
    in plain text that anyone watching the network can steal user names and passwords
    if we allow users to log into the server using their Linux accounts. However,
    if we set our server to allow only anonymous logins (user name anonymous, password
    address), this will be a more secure setup. That''s what we are going to do. Once
    we secure our server, we''ll post some files to download.


    We start by giving our server''s host name in DNS and call it ftp. This is for
    convenience that users can easily remember the name of the local FTP server. For
    this purpose, we''ll be creating an alias (CNAME) record that points to the real
    host for the server.


    Add the following line to your master zone file (modify for your own setup):


    ```

    ftp      CNAME pdog

    ```


    The first field is the alias name, the second is the record type and the last
    is the name that corresponds to a A record in the zone for the real host. REMEMBER
    to use tabs instead of spaces between each field!


    Refresh the zone data and test your alias. We''ll use the rndc utility to reload
    the data for this zone''.


    ```

    rndc reload sinclair.prairieydog.edu

    ```


    This is less disruptive than restarting the service. Test your alias:


    ```

    ping ftp

    ```


    You should get a response. If not, check the logs to make sure the zone data loaded
    correctly. Now we''re ready to install the FTP server. We''ll be using vsftpd,
    which is very fast, stable and secure.


    ```

    apt-get install vsftpd

    ```


    When the install is complete, the service should be running. Let''s check the
    process table:


    ```

    ps -ef | grep vsftpd

    ```


    What did we just do here? The ps command returns what processes (programs) are
    currently running and the -ef option returns every running process. We pipe that
    output to grep for the string vsftpd. If a process contains vsftpd, then our service
    is running.


    We can also see if the server is running by connecting to the ftp listener port:


    +   - You might want to create an alias for this command to save typing.'
