- img_proc: true
  md: 'system that would run on his PC and would be powerful enough to do the work
    needed. At the time, the only option was Minix and Linux couldn''t afford to purchase
    it. Left with no option, he decided to write his own.


    He began by writing a kernel, which he called Linux after himself. A kernel is
    the core of a operating system and manages access to the hardware and other system
    resources, like RAM and disk space. However, a kernel by itself is not much good.


    # GNU/Linux


    Back to Richard Stallman. Richard had started the GNU Project to create a free
    (as in speech) UNIX-like operating system. By creating set of software tools like
    text editors, compilers and other useful tools that were just waiting for a working
    kernel. Before you said "Hey, you got your kernel in my software", Linux used
    the GNU tools to add useful abilities to his kernel and create a full-blown operating
    system, released to the Internet in 1991.


    # Linux Distributions


    So here we are. Linux refers to Linux'' kernel. GNU refers to the software tools
    provided by Richard Stallman and the FSF. All of them are called GNU/Linux.


    "But", you say, "what about Red Hat? Debian? SuSe? What are they?"

    Red Hat and the others provide what is known as a ''Linux distribution''. This
    consists of the Linux kernel, GNU tools (plus other software, usually) and an
    installer program that will let you copy this software to your PC and run GNU/Linux.
    Since the software is free, anyone can create their own distribution.


    # Conclusions?


    What does this mean? According to Linux Weekly News?, there are currently over
    400 different Linux distributions available (as of 01/02/2005), each with their
    own target market.


    "But that''s too much choice! How will I know which one to pick?"

    Do a little research, try them out and find one you. Your average PC user today
    doesn''t have a lot of software choices and most of those are chosen for them.
    Because of this, I have seen long-time PC users become upset at the thought of
    having these kinds of decisions. Freedom has its price, but it''s worth it.


    "But aren''t all these different versions incompatible? Do I have to get new software
    if I change from one distribution to another?"


    No. The major difference between one distribution and another is how software
    is installed, updated and removed. There are many differences with the version
    of the kernel and what tools are included. Switching from one distribution to
    another isn''t difficult and almost all the skills you picked up with your old
    version can be used with the new one.


    # Live CDs


    This is a bootable CD-ROM that will let you run Linux without installing it first.'
