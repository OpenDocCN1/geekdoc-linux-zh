  md: '/proc/sys/kernel/hostname - Can be used to set the hostname


    /proc/sys/kernel/domainname - Can be used to set the domain name.


    /proc/uptime - contains two numbers: the uptime of the system (seconds), and the
    amount of time spent in idle process (seconds).


    /proc/version - Identifies the currently running kernel version.


    Now, all of these values are read-only. We can also modify some values. For example:


    ```

    root@pdog:# cat /proc/sys/kernel/hostname

    pdog

    root@pdog:~# hostname

    pdog

    root@pdog:~ echo pdog01 > /proc/sys/kernel/hostname

    root@pdog:# cat /proc/sys/kernel/hostname

