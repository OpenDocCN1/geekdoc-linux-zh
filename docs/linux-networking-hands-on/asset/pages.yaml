    # Troubleshooting Tips:


    The configuration files for CUPS are in /etc/cups. When I added my printer and
    shared it

    out, the following entries were created:


    ```

    The setup information for the new printer can be found in printers.conf -

    <Printer HP_Test>

    Info HP LaserJet 5MP

    Location Back Office

    DeviceURI socket://192.168.2.1:9100

    State Idle

    Accepting Yes

    JobSheets none none

    QuotaPeriod 0

    PageLimit 0

    KLimit 0

    </Printer>

    ```


    The printer sharing information is in cupsd.conf -


    ```

    <Location /printers/HP_Test>

    Encryption IfRequested

    Satisfy All

    Order allow,deny

    Allow 192.168.2.3

    </Location>

    ```


    The printer server process is called cupsd, so you can check to make sure it''s
    running using

    the ps as command:


    ```

    ps -ef | grep cupsd

    ```


    If it''s not running, start it with the cupsys script:

    /etc/init.d/cupsys start


    In addition, the server should be listening on port 631 so we can check that:'
