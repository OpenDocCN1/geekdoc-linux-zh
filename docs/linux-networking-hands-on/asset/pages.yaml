  md: "# Setting up a Secure Encrypted Web Site\n\nYou've seen this on your Internet\
    \ travels. You buy something online and when it's time to enter your credit card\
    \ information you're taken to a special page which encrypts the information traveling\
    \ from your browser to the shopping site. It isn't hard to set up a Web page that\
    \ uses a secure, encrypted connection. The code to manage the customer database,\
    \ verify your credit card information and take care of your order is much harder.\
    \ But we're all doing now is the secure page.\n\nStep 1 – Set up the listener\
    \ port\n\nBy default, HTTPS (Secure HTTP) listens (accepts requests) on port 443.\
    \ To have Apache listen on that port we edit /etc/apache2/ports.conf to add the\
    \ line:\n\n```\nListen 443\n```\n\nStep 2 – Add SSL functionality to Apache\n\n\
    The SSL (Secure Socket Layer) protocol is how our network connection is encrypted.\
    \ We need to tell Apache how to use it. Apache is a modular server, meaning that\
    \ we can add functionality through the use of plug-ins, called modules. The modules\
    \ are available in the folder /etc/apache2/mods-available. To enable a module,\
    \ we create a link from the module's conf and .load files from mods-available\
    \ to mods-enabled, similar to how we enable a Web site. We have two utilities\
    \ to help us with this: a2enmod (enable modules) and a2dism (disable modules).\
    \ Let's enable the SSL module:\n\n```\na2enmod ssl\n```\n\nStep 3 – Create the\
    \ certificate and private key for our secure site\n\nThis is the same process\
    \ we used to create the secure Webmin certificate and key in the previous chapter.\n\
    \nStep 4 – Create the document root directory for our site.\n\nWe'll create a\
    \ folder called /var/secure:\n\n```\nmkdir /var/secure\n```\n\nStep 5 – Create\
    \ the site file.\n\nWe'll create a file called under /etc/apache2/sites-available.\
    \ For my site, it looks like this:\n\n# Site file for our secure Web site\n\n\
    ```\n<VirtualHost *:443>\n  DocumentRoot /var/www.sinclair.prariedog.edu\n  ServerName\
    \ webmaster@sinclair.prariedog.edu\n  SSLEngine on\n  SSLCertificateFile /etc/ssl/certs/apache2-cert.pem\n\
    \  SSLCertificateKey /etc/ssl/private/apache2-key.pem\n```"
