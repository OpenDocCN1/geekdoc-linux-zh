    - Put your real name and your email address in the next page like so:

    - The type of incoming server you''re using is POP and put in the fully-qualified
    domain name of your e-


    > ¹ You might not find this package if the developer decided to separate out the
    enigmail plugin. In that case, install mozilla-thunderbird and use the Extensions
    tool to install enigmail.


