  md: '# WebDAV


    So far, so good. WebDAV (short for Web-based Distributed Authororing and Versioning)
    was originally intended to allow groups of Web authors to collaborate easily on
    the Internet. It allows the author(s) to mount the remote file system on their
    desktop and work with the files as if they were local. There is also a locking
    mechanism that prevents others from changing the same document at the time.


    WebDAV is an open, draft internet standard and as such can be freely incorporated
    by any software developer who wishes to do so. Many vendors have support for WebDAV
    in their products. For example, Microsoft''s Web Folders are actually WebDAV-based.
    Apple''s iDisk is a WebDAV file system. Most professional Web authoring tools
    (like GoLive and Dreamweaver) include support for managing a site using WebDAV.


    As turns out, WebDAV (or DAV as some prefer to call it) is what you might call
    a "universal" network file system. That is, instead of having to share a file
    system using SMB for Windows clients, NFS for UNIX clients and AppleShare for
    Mac clients, you can simply share it with DAV and make sure your desktops have
    the appropriate clients (Most with DAV clients already installed, like Windows
    2000/XP and Mac OS).


    DAV has a advantages over traditional network file systems:


    +   - Authentication (and the connection itself) can use SSL to set up an encrypted
    connection.

    - You can access a DAV folder through a corporate firewall since it uses port
    80.

    - The DAV file system only connects when needed, so you can keep it mounted without
    problems when your network connection ''burps'' or if you move from one network
    to another, such as with a laptop.


    # Create a Read-Only DAV Share


    Step 0 - Create a CNAME record for dav pointing to your web server.


    Step 1 - Create folders for your DAV share and for DAV lock files

    Piece of cake. We''ll put them in the document root for our Web server:


    ```

    mkdir /var/DAVDocs

    mkdir /var/www/DAVlock

    ```


    Change the DAV folder to be owned by the same user and group that runs the Apache
    server:


    ```

    chown www-data:www-data /var/www/DAVlock

    ```


    Add a random file or two to the DAV folder (maybe a software installer or some
    documentation files.)


    Step 2 - Create a password file to use for this share and create a DAV user called
    guest


    ```

    htpasswd2 -c /etc/apache2/users guest

    ```'
