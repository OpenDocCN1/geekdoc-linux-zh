- img_proc: true
  md: 'Create a directory for the shared space


    ```

    mkdir /var/staff

    ```


    Set the group ownership of /var/staff to the UNIX group staff.


    ```

    chgrp staff /var/staff

    ```


    Make the folder writable for the group.


    ```

    chmod 775 /var/staff

    ```


    Set the ''sticky'' bit for the folder so that users can overwrite each other''s
    work.


    ```

    chmod +t /var/staff

    ```


    Create a Samba group called Staff and map it to the UNIX group staff. (Unfortunately,
    you can''t currently do this in swat.)


    ```

    net groupmap add group="staff" unixgroup=staff

    ```


    Create a shared staffshare, with the comment "Shared Area for Staff" and point
    it to the path /var/staff.


    Set the following options (You''ll have to switch to the Advanced View):


    ```

    valid users = @staff

    read list = @staff

    write list = @staff

    ```


    This means only members of the staff group can connect to this share, read its
    contents and modify them.


    ```

    force group = staff

    ```


    This causes any new folders or files to have a group ownership of staff.


    ```

    read only = No

    ```


    This means this is not a read-only share. Technically we don''t need this, since
    the Linux permissions override this option any way.


    ```

    create mask = 0774

    directory mask = 0775

    ```


    This sets the default permissions for any new file to 774 (rwxrwxrr--) and for
    any new folder to 775 (rwxr-xr-x). In other words, writable by the owner and group,
    but read-only to anyone else.


    That should do it. Commit your changes and test with your favorite SMB client
    and make sure it works as designed before moving on to the next section.'
  merge: -1
