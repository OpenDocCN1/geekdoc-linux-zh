    Zip – A type of archive file (generally used on Windows/DOS systems).


    # Introduction to Software Package Management


    Software package management is the process of installing, updating and deleting
    software on a computer system. Every operating system has its own way of doing
    this, from the very simple to the quite complex. Many operating systems have multiple
    methods of managing software packages. Let’s start with an overview of package
    management by comparing Linux to Windows.


    # Automatic vs. Manual


    First of all, software can be installed manually, where the user does most of
    the work, or by using a program called a package manager. A package manager will
    not only take care of the details of installing a package, but will also track
    the software in a special database that makes it easy to upgrade or delete the
    package, as well as track dependencies (that is, software that depends on other
    software being available). Ideally, it’s best to use a package manager if one
    is available for your system, since it makes administration much easier. However,
    as we will see, both Windows and Linux have package managers available. On the
    Windows side, package management is built into the Add/Remove Software control
    panel. In addition, many Windows packages have a standalone installer (usually
    called setup.exe) that works with the Windows package manager. With Linux, there
    are several options and sometimes a deciding factor in which distribution to use.
    Red Hat-based distributions use rpm (RPM Package Manager), whose package files
    have a .rpm extension. Debian-based distributions use APT (Advanced Package Tool),
    whose packages end with .deb. Slack-based distributions use a tarball-based tool
    and packages ending in .tgz. In addition, Linux distributions let you install
    software .tar.gz. Windows will let you install software by hand, from a ZIP file.


    # Binary vs. Source


    Next, we can install software from source or via a pre-compiled binary. On Windows,
    installing from source is not a common option, since the development tools (which
    include the compiler and libraries) are not included with the base install and
    in fact cost extra. Linux, on the other hand, with a generous assortment of development
    tools installing from source is a viable option. In Linux, you can install from
    a source package or a source tarball. A source package (in the distribution''s
    native format) is preferable since it produces a binary that can then be installed
    and tracked by the package manager. A source tarball involves extra work and is
    not tracked by the package manager.'
