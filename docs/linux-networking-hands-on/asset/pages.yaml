    # Booting Linux


    # Step 0 – Before We Begin


    Let''s make sure we have what we need to start up Linux. The minimum requirements
    for us are:


    +   - Intel-compatible CPU (486 or later)

    - 20 MB of RAM for text mode, at least 96 MB for graphics mode

    - bootable CD-ROM drive, or a boot floppy and CD-ROM (IDE/ATAPI or SCSI)

    - standard SVGA-compatible graphics card

    - serial or PS/2 standard mouse or IMPS/2-compatible USB-mouse


    I repeat, these are minimum requirements. With this hardware Linux (with a GUI)
    will run but it will be slow. For work in this book, I recommend, at minimum:


    +   - Pentium 3 800 MHz or better

    - 128 MB of RAM (we''ll be using graphics mode)

    - 8 GB Hard drive

    - SVGA-compatible graphics card with at least 16 MB of video RAM

    - CD-ROM (same as above)

    - Mouse (same as above)


    # Step 1 – Getting the boot prompt


    Live CDs support a wide range of hardware and Windows, and are very flexible,
    but they may have some problems with hardware specifically designed for such as
    Winmods and Winprinter. You can boot a Live CD in a variety of ways, including
    different graphical desktops. Different distributions handle this in different
    ways. The most extreme example is Knoppix (www.knoppix.net) which has a three
    set of boot cds (called ''cheat codes'') by creator Klaus Knopper). Others allow
    you to select from a menu of options at the boot prompt.


    # To boot the CD:


    If you have a bootable CD-ROM drive, simply put the CD in the drive and restart
    your computer.³


    If you don''t have a bootable CD-ROM drive, create a bootable floppy from the
    disk image on the CD called boot.img. Place the boot disk in the floppy drive,
    the CD in the CD-ROM drive and restart your computer.


    Regardless of how you boot up, after a few moments you should see a boot loader
    screen. At this point, you should use the down arrow to select ACPI, DMA On and
    English, press <Return>.


