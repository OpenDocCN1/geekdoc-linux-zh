  md: '![](img/d96c1eab2a6e614c032e1320a5285200_147_0.png)


    Figure 1 Sample DNS Query


    This is called a **recursive query**, where your local name server queries the
    rest of the DNS hierarchy. The other kind of query is an *iterative query*, where
    the name server will return the record if it has locally, but if it won''t continue
    to search. This sounds complicated, the whole thing only takes a few seconds.
    In fact, we can demonstrate the process using a command line utility called `dig`.

    The basic format of the dig command is:


    ```

    dig @server name type

    ```


    **server** - the name or IP address of the DNS server you wish to query. It defaults
    to your local name server.

    **name** - the domain or hostname you wish to locate

    **type** - the type of record you wish to find. DNS records are also called resource
    records and come in several varieties:


    +   - A - Address record (hostname -> IP address)

    - MX - Mail Exchanger (e-mail domain -> mail server)

    - NS - Name Server (DNS domain -> name server)

    - CNAME - Canonical Name (Alias -> hostname)


    3 If you don''t have dig installed, you can get it by installing the package dnsutils.'
