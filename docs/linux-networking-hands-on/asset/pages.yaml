    # Instructor Notes


    As mentioned previously, but for a more “real world” experience, I recommend breaking
    students into project teams of 3 to 5 and dividing the work among the group. In
    addition, I have students produce maintenance and troubleshooting––documentation
    for each network service they produce as part of the project deliverables. This
    helps reinforce the idea of teamwork and the interdependence of typical network
    services. (Example: Without working DNS, users cannot contact the Kerberos server
    to log in.) Appendix B contains a handout for a sample project.


    The labs in this book were done using Kanotix, a Linux CD distribution based on
    Debian and available for free download at http://kanotix.com/info/index.php. Nearly
    any Debian-based Linux (or Debian itself) should work just fine but you may have
    to do Chapter 1 after installation if you decide not to use a Live CD.


    If you prefer not to use Debian and have sufficient experience with Linux, you
    can use any other distribution with this text. The only chapter that is actually
    Debian-specific is Chapter 2, which describes package management, I 1 include
    although a brief discussion of rpm and the Slackware package systems. In addition,
    the Debian version of Apache 2 has a slightly different file system layout than
    the vanilla version and the'
