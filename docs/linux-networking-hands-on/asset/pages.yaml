  md: '# Appendix B – Sample Class Project


    **Overview:**


    ConHugeCo, a major corporation, is planning to move their IT infrastructure to
    Linux and open source solutions. Since they don''t currently have in-house expertise
    to accomplish this, they are putting out an RFP (Request For Proposal) to interested
    firms who wish to assist them in the transition. Their back-end needs are relatively
    simple:


    +   - Domain name service

    - E-mail (SMTP/POP3/IMAP)

    - Web-based front end for the e-mail service

    - Support for group collaboration using WebDAV

    - Secure authentication services using Kerberos

    - Networked print services

    - A Web site, including a main corporate page, personal home pages for users and
    an SSL-encrypted site

    - File and print support for Windows clients

    - A Certificate Authority (CA) to provide signed digital certificates

    - An LDAP-based corporate “White Pages”, containing employee information


    Competing firms must not only produce a demonstration network that implements
    at least the minimum requirements above, but must also demonstrate their ability
    to transfer their platform knowledge by providing documentation on maintaining
    their proposed platform. *Special consideration will be given to firms who demonstrate
    the ability to use scripted automation to ease the burden on day-to-day maintenance
    and troubleshooting.*


    **Details:**


    **Each team will produce:**


    **Servers:**


    **WebDAV** - This will be a password-protected file share, accessible from both
    Windows and Linux, for group collaboration work.


    **Samba** - This will provide file services for the remaining Windows clients.

    **Print services** - The client should be able to print through the server from
    both Samba and Linux.

    Apache - The minimum requirement here is a main page (accessed by the URL `http://<server>`)
    and consisting of something other than the Apache test page and a personal user
    page (accessed by the URL `http://<server>/<userid>`). In addition, at least one
    ''secure'' page (using SSL) should be created and available.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'white Resolution - The minimum here will be a DNS server that will contain
    the IP address mappings for the machines in your group. You will be using CNAME,
    A and MX records.


    E-mail - The server should support POP, IMAP and SMTP in addition to secure client
    connections. (You will need to set up appropriate CNAME and MX records in your
    DNS.) In addition, you will have to set up a mail relay with another team''s mail
    server.


    Webmail - E-mail will be accessible through a Web browser (in addition to a traditional
    mail client) over a secure network connection.


    Kerberos - Each team will have a Kerberos server installed and configured, providing
    authentication services through the Linux machines. Password policies will be
    set and enforced through Kerberos as well.


    Directory Service - Each team will provide an LDAP-based directory server to serve
    as a corporate ''white pages'' accessible from anywhere on the network. In addition,
    users will be able to view and update their information in this directory.


    Certificate Authority (CA) - Each team will have a CA, to produce signed, trusted
    digital certificates for all secure network services.


    Other:


    Webmin - Each Linux machine will have Webmin installed and accessible through
    a secure network connection.


    Encryption - All team members will be able to send, receive, sign and authenticate
    encrypted e-mail and documents from each other.


    The output of this project:

    Servers (as described above)

    Maintenance and troubleshooting documentation for each server and client.

    A live demonstration of your mini-network. I will ask you to perform a series
    of administrative tasks to show your practical skills.


    Grading:

    - Both implementation and documentation will be given equal weight. For example,
    if you are in charge of the Web server, you need to be the one to document it.

    - The documentation should be coherent. That is, it should have a standard format
    and style.

    - Difficult tasks will be given more points than easy ones.


    This project is due on the final day of the term. No late work will be accepted.


    ADDITIONAL NOTES:

    - The details in this document are subject to change by the instructor.

    - Documentation should not so much focus on installation but on specific configuration
    details


    261'
