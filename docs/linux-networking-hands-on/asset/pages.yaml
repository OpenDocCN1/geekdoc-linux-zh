  md: '# Logging


    Webmin Index

    Module Index


    Webmin can be configured to write a log of web server hosts, in the standard CLF
    log format. If logging is enabled, you can also choose IP addresses or hostnames
    are recorded, and how often the log file is cleared. When logs are written to
    the file /var/log/webmin/miniserv.log.


    When logging is enabled, Webmin will also write a more detailed log of user actions
    to the file /var/log/webmin/miniserv.log. This log can be viewed and analysed
    with the Webmin Actions Module to see exactly what each Webmin user has done.


    ![](img/d96c1eab2a6e614c032e1320a5285200_110_0.png)


    Return to webmin configuration


    Figure 6 Webmin Logging Configuration


    Since Webmin gives administrative access to your machine, it''s a good idea for
    you to be able to track what Webmin users are doing. This is where you set that
    up. You can log all users or only selected ones. You can also log all actions
    or just actions in certain modules. The default is to track all users in all modules
    and log file system changes. This is a good, secure default setting but feel free
    to customize it for your use.


    We''ll skip over the next few modules but let me briefly about the one labeled
    Webmin Modules. As, the name implies, you install, delete or clone (copy) selected
    modules. If you installed Webmin from a Debian package, this module is not going
    to see much use. The Debian developers separated the Webmin into individual packages
    so you only install the ones you need. However, if there is a third party module
    you wish to install (perhaps one you developed yourself), this is the place to
    do it.


    As we continue the list of configuration modules, let me briefly mention the labeled
    Upgrade Webmin. If you installed Webmin from a Debian package, do NOT, under any
    circumstances. If you use this module to upgrade your installation! The Debian
    Webmin packages are maintained separately. If you use this module, you will pull
    the new software from the Webmin site (http://www.webmin.com). Not only will you
    get lots of new modules that you don''t need, but more importantly, you may introduce
    software that is not compatible with your current installation. If you wish to
    upgrade, use apt-get instead.'
