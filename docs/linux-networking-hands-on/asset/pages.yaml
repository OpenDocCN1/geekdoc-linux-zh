    # Network Management


    Linux supports a wide range of networking hardware but for the purposes of this
    book we''ll assume that your computer is connected to a LAN (Local Area Network)
    using Ethernet. Every network interface has an associated device. For an Ethernet
    card the file name starts with eth (sometimes lan) followed by the device number.
    So eth0 (or lan0) is the first NIC, eth1 (or lan1) is the second and so on. In
    addition, all network-capable computers have a loopback interface, designated
    as lo.


    With that in mind, let''s look at how to configure your network interfaces. There
    are two categories of tools for this: low-level and high-level. As a general rule,
    pick one category and stick with it. In addition, just as other system-level tweaking
    needs root authority, so does network configuration.


    # Low Level Tools - ifconfig out route


    The ifconfig utility lets you directly configure the network interface and the
    route command lets you manipulate the routing table. When used without options,
    they will return the current settings:


    ```

    pdog:-# ifconfig

    eth0 Link encap:Ethernet Haddr 00:A0:24:E1:E6:AB

    inet addr:192.168.2.250 Bcast:192.168.2.255 Mask:255.255.255.0

    ```'
