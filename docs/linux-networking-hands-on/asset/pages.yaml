    ```


    to


    ```

    protocols = pop3 pop3

    ```


    Finally change the line:


    ```

    #default_mail_env =

    ```


    to


    ```

    default_mail_env = maildir:/home/%u/Maildir

    ```


    Start the service using the startup script:


    ```

    /etc/init.d/dovecot start

    ```


