- img_proc: true
  md: 'granting group membership through credential granting. The account module performs
    nonauthentication account management as restricting access based on time of day
    or location of the current user. The session module handles tasks that need to
    be done before/after the user is given service, such as logging. The password
    module is required for updating the authentication token (in other words, changing/resetting
    the password) for the user. There is typically one of five for each module type.


    The control-flag tells the PAM code how to react to success or failure. There
    are four possibilities here as well:


    +   - required - This indicates that this module must succeed in order for the
    module-type to succeed.

    - requisite - Like required, but upon failure control returns to the application.

    - sufficient - The success of this module is considered ''sufficient'' to satisfy
    the Linux-PAM library. Assuming no previous required modules have failed, control
    returns to the application.

    - optional - Not critical to success or failure of the module. However, in the
    absence of the success or failure of previous, stacked modules, the application
    will look at the output of this module to determine what action to take.


    Since we can stack modules, the control-flag gives us an idea of the relative
    importance

    The keyword-path is the path to the PAM library file. The default location is
    lib/security, so if a module is in this directory, the name of the module alone
    will do for this entry.


    The args stands for a list of arguments passed to a PAM module when it is invoked,
    much like arguments to a shell command. Some generic arguments that any modules
    understand are:


    +   - debug - log the activity of this module to syslog.

    - no_warn - Don''t issue any warning messages to the application

    - use_first_pass - Don''t prompt for a password. Instead use the password from
    the previous auth module. If it doesn''t work, the user is not authenticated.
    (This is only used by auth modules.)

    - try_first_pass - Try to authenticate with the password from the previous auth
    module. If it doesn''t work, prompt the user for a password.

    - use_mapped_pass - Take the cleartext from a previous module that requests a
    token and an encryption/decryption key to store that token. Please note that this
    is not currently supported under Linux-PAM, as it requires reliably strong encryption
    and is U.S. restrictions on exporting encryption.


    +   - expose_account - Make a module "friendly" by encouraging it to expose some
    user information, as their full name or home directory. NOTE: This would be mainly
    for a trusted network, this information could be used by a system cracker


    Some modules have additional arguments that they can use. See the specific module'
