    root@pdog:~ echo sinclair.prairedied.edu > /proc/sys/kernel/domainname

    root@pdog:~# cat /proc/sys/kernel/domainname

    sinclair.prairedied.edu

    dnsdomainname: Unknown host

    root@pdog:~# echo pdog > /proc/sys/kernel/hostname

    root@pdog:~# hostname

    idog

    ```


    If we want to idea how busy the CPU is, we can find this out indirectly by monitoring
    how many and kind of processes are running on the system. For this we can use
    the ps command.


    ```

    tsinsai@pdog:~$ ps

    PID TTY      TIME CMD

    3237 pts/0    00:00:00 bash

    4688 pts/0    00:00:00 ps

    ```


    If you run the command by itself, it will list the processes being run by the
    current user. The main fields in which we are interested:


    +   - PID - this is a unique assigned to the process by the kernel. The PID is
    used to send messages to the process. For example, "Stop right now".


    +   - TIME - this is the amount of accumulated CPU time in hh:mm:ss format. This
    number is low, less than a few seconds but more than that could indicate a process
    is hogging the CPU.


    +   - CMD - this is the command that started the process.


    To get more process information, use the -f option:


    ```

    tsinsai@pdog:~$ ps -f

    UID PID     C STIME TTY           TIME CMD

    tsinsai 3237 3236 0 11:43 pts/0    00:00:00 -bash

    tsinsai 5260 3237 0 12:14 pts/0    00:00:00 ps -f

    ```'
