- img_proc: true
  md: 'The init process reads the file from the top down and the first entry it sees
    is this one:


    ```

    id:3:default

    ```


    This is the default run level for the machine. (In this case, run level 3.) So
    init knows it has to start from run level 1 to get to level 3. The entries for
    each run level look like this:


    ```

    10:0:wait=/etc/init.d/rc 0

    11:1:wait=/etc/init.d/rc 1

    12:2:wait=/etc/init.d/rc 2

    13:3:wait=/etc/init.d/rc 3

    14:4:wait=/etc/init.d/rc 4

    15:5:wait=/etc/init.d/rc 5

    16:6:wait=/etc/init.d/rc 6

    ```


    What each line says "when you enter this run level, start the /etc/init.d/rc command
    with the argument given and then wait until it finishes moving on. So far, so
    good. But what does the rc script do with the numeric argument? To put it, there
    are seven directories under /etc/ called rc0 through rc6, one for each run level.
    The rc program looks in the directory corresponding to the numeric argument it
    was given and runs the programs inside. Let''s take a look at one of them, /etc/rc3:


    | K01kldm | S20autofs | S20webmin | S99fetchmail |

    | K01xdm | S20cuspys | S20rsync | S20kfs |

    | S10ysklogd | S20bus-1 | S20email | S25mdamd |

    | S11hotplug | S20firestarter | S20smartmontools | S40arpwatch |

    | S11klkog | S20initd | S20ssh | S89atd |

    | S12kerneld | S20makedev | S20vsftpd | S89cron |


    But this isn''t even the revert. Every file in each of the rc*.d directories is
    a symbolic link to a script in /etc/init.d. For example:


    ```

    tsclinai@pdog:/etc/init.d$ ls -1 -S20ssh

    lrwxr-xr-x 1 root 20 Nov 13 2004 ssh -> ../../ssh

    ```


    So what''s in /etc/init.d? This is where the scripts that control system services
    are stored. They all take the same arguments: start, stop and restart. Example:


    ```

    /etc/init.d/ssh start

    ```


    will start the secure shell daemon.

    Let''s put all these ideas together.


    +   - When init starts up, it looks in /etc/initabb to learn its default run level.

    - When init enters a run level, it runs the rc script with the d directory corresponding
    to the level number.

    - The rc script executes in /etc/rc.*'
