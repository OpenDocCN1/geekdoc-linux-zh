  md: '# Step 3 – Modify our DAV share to use Digest authentication


    Edit /etc/apache2/sites-available/dav to make the following changes:

    The line


    AuthType Basic


    should now read:


    AuthType Digest


    The line


    UserFile /etc/apache2/users


    should now read:


    DigestFile /etc/apache2/users_digest


    That''s about it. Don''t forget to reload Apache if necessary:


    ```

    /etc/init.d/apache2 force-reload

    ```


    Test your share with Konqueror to make sure it still works. If you have a network
    sniffer, you might wish to examine the authentication traffic between the client
    and the server to see if there are any differences.


    # Create a Group-writeable, Secure File Share


    +   We''re doing well so far, but we can do better. The previous exercise had
    a few drawbacks:

    - The share was read-only

    - Since HTTP is not secure, the login and password were sent in plaintext over
    the network.

    - Since the login was ''guest'', the share was basically available to anyone.


    We can do better though. In this section, we will be creating a group-writeable
    file share similar to the one we made with Samba earlier. We''ll be using SSL
    to create a secure, encrypted connection to the file share.


    # Step 1 – Create the folder we''re going to share.


    Since our web server can only have one SSL site, we''ll place our DAV folder under
    the DocumentRoot for our web site, /var/secure:


    ```

    mkdir /var/secure/staffshare

    ```


    Before we go, let''s make sure that the Web server can read and write to this
    folder:


    ```

    chown www-data:www-data /var/secure/staffshare

    ```'
