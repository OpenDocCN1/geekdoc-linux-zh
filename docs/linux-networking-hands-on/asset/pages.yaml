    You''ll be prompted for a database master password. DO NOT FORGET THIS PASSWORD
    MAKE IT EASY TO GUESS!


    - Add administrators to the Access Control List (ACL) file.


    By default, your ACL file is /etc/kerb5kdc/kadm5.acl. Once again, the Kerberos
    documentation gives more detailed information on the setup of this file, but in
    our case we simply want to let anyone in the admin domain full access to the database.
    This is NOT a good idea in a real production system! We edit the ACL file to include
    the line:


    ```

    *admin@SINCLAIR.PRAIRIEDOG.EDU *

    ```


    - Add administrators to the database


    Actually, we''re just going to add one administrator (called admin) to our database.
    There are two programmers to add the Kerberos database, kadmin and kadmin.local.
    Both do the same job, but kadmin.local is only available on the master KDC, where
    the database physically resides.


    # kadmin.local


    kadmin.local: addprinc admin/admin


    (You''ll be warned that no policy has been specified for this principal and prompted
    for a password twice. We''ll tell you about policies later.)


    (Add whatever other users you need. You''ll also be prompted for a password for
    each user you create.)


    kadmin.local: addprinc tsinclai


    kadmin.local: ktadd -k /etc/kerb5kdc/kadm5.keytab kadmin/admin

    kadmin.local: ktadd -k /etc/kerb5kdc/kadm5.keytab kadmin/changepw


    (This will export authentication keys for admin and changepw provided by kadmin,
    so that the KDC can be managed remotely and the password change will work correctly.


    That''s it. When you''re done, type quit.)


