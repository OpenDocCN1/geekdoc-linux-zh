  md: '# listpols


    So what are the default values? Let''s find out by creating a simple policy called
    default kadmin that doesn''t specify any options:


    ```

    add_policy default

    ```


    To discover the settings for this policy:


    ```

    get_policy default

    ```


    Well, the default settings aren''t great, so let''s fix them:


    ```

    modpol -maxlife "+30 days" -minlife "+7 days" -minlength 8 -minclasses 2 -history
    7 default

    ```


    This modifies the default policy to require passwords that:


    +   - expire every 30 days

    - force the user to wait at a week before changing them after resetting

    - have a minimum length of eight characters

    - have a mix of letters and numbers

    - not let the user re-use any of their previous passwords.


    (NOTE: There is more specific information about the time format used in this command
    on the kadmin man page.)


    We can create as many different policies as we want. You might, for example, to
    have a password policy for administrators for regular users.


    So far, so good. We now have at least one policy, but it doesn''t take effect
    for any users until we assign the policy. For an existing user (.tsinclai) you
    can assign the policy with the command:


    ```

    modprince -policy default tsinclai

    ```


    Pretty straightforward. But what about new users (ex poltest)? Turns out it''s
    just as simple as simple:


    ```

    addprince -policy default poltest

    ```


    So we know how to add policies, then modify them and assign them to principals.
    What''s left? Deleting them, of:


    ```

    delpol default

    ```


    > NOTE: If you create a policy named default, it will be automatically assigned
    to all new users unless you specify otherwise when adding the principal.


