    Terminology


    Directive – a label for an Apache server setting, found in server and site configuration
    files. HTML – HyperText Markup Language – the codes used to create Web pages.
    HTTP – HyperText Transport Protocol – The TCP/IP protocol that is used to transfer
    HTML between a Web server and client. SSL/TLS– Secure Socket Layer/Transport Layer
    Security – Used to communicate securely across an insecure network connection.
    TLS is used to verify host identities and exchange an encrypted session key using
    public key encryption. SSL then uses the session key to encrypt and decrypt the
    session data using private key encryption. After the session closes, the key is
    discarded.


    Virtual Hosting – a features that lets a Simple Web server host multiple Web sites.
    There are two types of virtual hosting: IP-based and name-based.


