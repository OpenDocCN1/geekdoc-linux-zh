    # Terminologyology


    **Archive** – A set of related files combined into a single file. Archives are
    usually compressed to save space.

    **Binary** – A file that is not in human readable text format. Usually refers
    to a program file but could also be a data file.

    **Cache** – A workspace, either in RAM or on disk, where commonly used items are
    stored for quick access.

    **Compiler** – A program that takes one or more text files containing source code
    (see below) and produces an executable program.

    **Dependency** – If a piece of software requires that one or more specific libraries
    or programs be available, that software is said to have dependencies. The other
    software must be installed before the former package can be installed.

    **Executable** – A file that can be run (executed) by the user. Sometimes known
    as a program.

    **Library** – A file containing executable code that multiple applications can
    use to perform common tasks, such as printing or connecting to the network.

    **Package** – Sometimes referred to as a software package. A set of one or more
    files required to install and run a particular software program. A package also
    includes annotations, which are notes about that package and its files and scripts
    that are used to do as much of the work of installing and configuring the software
    as possible and to remove it when it''s not needed any more.'
