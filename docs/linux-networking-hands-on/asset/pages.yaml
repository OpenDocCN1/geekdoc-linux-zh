    # Advanced Partitioning Topics


    Note that we created two partitions (root and swap) when we did our Linux installation.
    However, most Linux distributions give you the option of dividing your hard disk
    into multiple partitions. Or you might ask why we want to make things more complicated
    than just the two minimal partitions?


    There are at least three reasons we might want to create more than two partitions:


    +   - **Ease of maintenance** - In order to unmount the root filesystem, we need
    to shut down the server. However, non-root partitions don''t have this requirement.
    So if you have, for example, user home directories on a separate partition from
    root, then you can do maintenance on that file system if necessary and leave the
    machine up and running.

    - **Flexibility** - Having multiple partitions allows a system administrator to
    more easily upgrade storage without disrupting service.

    - **Security** - Separate partitions can be mounted with special attributes and
    permissions to make them more secure. For example, you could set disk quotas for
    your users or keep them from running programs from their home directories.


    As an example, let''s take a look at a typical Linux file system.'
