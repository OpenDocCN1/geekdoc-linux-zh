  md: '# Chapter 8 – Basic Network Services


    # Objectives


    +   - Install FTP


    +   - Configure a Shared Printer


    # Terminology


    **Classes** – A collection of printers, similar to a printer pool of files. Jobs
    sent to a particular class are sent to the first available printer in the class.


    **CUPS** – Common UNIX Printing System - a modularized computer printing system
    for Unix-like operating systems that allows computers to act as powerful print
    servers. A computer running CUPS is a host which can accept print jobs from client
    computers, process them, and send them to the appropriate printer.


    **Filter** – Allows a user or application to printer many different kinds of files.
    A filter performs tasks such as transforming files into formats that are understandable
    to the printer, page selection and ordering.


    **FTP** – File Transfer Protocol – TCP/IP protocol used to upload and download
    files using an FTP server.


    **IPP** – Internet Printing Protocol – a standardized network printing protocol
    layered on top of HTTP.


    **JetDirect** – a network printing protocol developed by Hewlett Packard with
    their brand of printers and print servers.


    **Job** – In CUPS terminology, a job is a file or set of files submitted for printing.


    **LPD** – Line Printer Daemon – the traditional UNIX print service.

    PPD** files describe the capabilities of each printer, including page sizes and
    supported features.


    **Print Driver** – PostScript Printer Description – A file usually associated
    with a printer queue. **Print Queue** – a logical device associated with a physical
    printer. When you print in UNIX, you send the job to a queue, not the printer
    itself. A single queue can be associated with multiple printers (such as in a
    printer pool) and multiple queues can be associated with a single printer (for
    different types of print jobs).


    **SMB** – Server Message Block – file and print sharing protocol used by Microsoft
    Windows.


    # Introduction


    As the title of this chapter suggests, we''ll be setting up some basic network
    services to give us a solid foundation with which to build more advanced capabilities
    into our Linux network. We''ll be installing and/or configuring two services:


    +   - FTP – File Transfer Protocol. This is one of the simplest file sharing services
    to set up. (In later chapters we''ll be looking at other file sharing servers).


    +   - Print Services – This is so basic that it gets overlooked a lot. (You don''t
    miss it until it''s broken.) We''ll be setting up a connection to a printer and
    then sharing it over the network.'
