    # # Chapter Summary


    Many system tasks can be automated using built-in tools.


    The utilities at batch let us schedule work on a one-time basis.


    The at utility allows us to specify a certain date and time for a program to run.


    The batch utility runs a given set of programs whenever the system load goes below
    5%.


    The cron service lets us schedule a given program to run on a regular schedule.
    For example, we may write a file system backup to run at 3 AM every Sunday morning.


    Gkrell is a lightweight system monitor that can let a regular user see what''s
    happening on their computer.


    Gkrell can be customized and extended through the use of plug-ins.


    KysGuard is a more powerful tool than Gkrell and can be used to monitor multiple
    computers across a network.


    Linux system programs report their status in plain text files called logs, usually
    found under /var/.


    Logging is controlled by a system service syslogd, which can be extensively customized.
    Since logs are plain text files, there are many tools that can automatically monitor
    and report on log status.


    One standard log monitoring tool is logwatch.


    The default action of logwatch is to scan the logs and send a summary report in
    an e-mail to the root user.


