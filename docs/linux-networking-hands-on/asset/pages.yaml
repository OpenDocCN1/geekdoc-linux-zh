    | --- | --- |

    | dev | Interpret character or block special devices on the system |

    | exec | Permit execution of binaries |

    | group | Allow an ordinary (non-root) user to mount this device if one of his
    groups matches the group of the device. |

    | mand | Allow mandatory locks on this filesystem. |

    | _netdev | This filesystem is on a device that requires network access. |

    | noatime | Do not update access times. |

    | noauto | Can be mounted explicitly. |

