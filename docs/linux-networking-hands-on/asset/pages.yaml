    # Chapter Summary


    +   * Webmin is a software package that offers a Web-based GUI for administering
    a UNIX or Linux system.

    * By default, Webmin tools are divided into categories, such as System, Hardware
    and Servers.

    * Since Webmin offers remote administrative access to your machine, it defaults
    to a secure encrypted connection that only responds to requests from the local
    machine.

    * Additional security features include logging user actions, limiting access through
    the Webmin groups and blocking access after a set of login attempts.

    * You can change the look and behavior of your Webmin session using these.

    * The Debian developers have broken up the Webmin modules into individual packages
    for convenience and ease of use.

    * You can assign Webmin modules to a group or an individual user and then customize
    those modules to further control access to them.


