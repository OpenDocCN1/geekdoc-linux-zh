    # The KDC


    There are two kinds of KDCs: masters and slaves. The Master (There Can Be Only
    One) has the actual physical copy of the Kerberos database. The slaves (as many
    as you want) have a read-only copy of the database. Periodically, the Master will
    push out a copy of the database to the slaves to keep them up to date, but all
    database changes must be done on the Master.


