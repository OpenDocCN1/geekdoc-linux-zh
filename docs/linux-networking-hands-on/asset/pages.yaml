    # Part IV - Secure POP


    POP is a very easy protocol to use and just about every mail client supports it,
    but it has a couple of flaws. First, you have to download all of your e-mail before
    you can read any of it and that can be a pain on dial-up or if you have a lot
    of junk mail or large email attachments. We''ll fix this by setting up IMAP later.
    The second flaw, which we''ll take care of right now, is that POP by default sends
    your ID and password in plain text across the network so that anyone with a network
    sniffer can steal your personal information.


    Fortunatelyely we can deal with this. POP can run in secure mode, which uses an
    SSL-encrypted connection to communicate with your mail server. If someone is "listening
    in" all they will get gibberish. The POP server is installed in both insecure
    (port 110) and secure (port 995) modes so all we have to modify our e-mail client
    to use secure POP.


    Confirm dcovet is listening on the secure port:


    ```

    telnet localhost 995

    ```


    Edit your Thunderbird configuration to use secure POP and send a test mail. Notice
    that you will get a warning message from Thunderbird about the digital certificate.
    So we need to fix this. Fortunately, we''ve done this with Webmin. I won''t repeat
    all the details, but if you remember back from in our discussion of digital certificates,
    the steps are:


    +   - Generate a certificate request and key for Dcovet with the common name of
    "mail.<yourdomain>


    +   - Sign the request with your CA and create a digital certificate.


    +   - Install the certificate and key somewhere safe. (/etc/ssl/certs/ and /etc/ssl/private).


    +   - Edit dcovet.conf to point to the certificate and key. Specifically, uncomment
    and edit the lines


    ```

    #ssl_cert_file = /etc/ssl/certs/dcovet.pem

    #ssl_key_file = /etc/ssl/private/dcovet.pem

    ```


    +   - Restart Dovecot.


    > In more current releases of Dovecot, plaintext authentication is disabled by
    default. If you wish to enable it, change the setting disable plaintext auth in
    /etc/dovecot/dcovet.conf from yes to no and uncomment the line.


