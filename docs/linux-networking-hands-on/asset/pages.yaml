  md: 'If you get a response, the server is up. If there seems to be a problem, you
    can check for error messages in the logfile /var/log/syslog:


    tail /var/log/syslog

    By default, the tail command displays the last 10 lines of whatever file you give
    it as an argument. This is very handy for log files, where the most recent messages
    are at the end of the file.


    By default, your DNS server is acting as a caching-name server. That means that
    it doesn''t have any local information about IP addresses, but it can forward
    queries and when it gets a response, it stores information in its cache.


    Let''s point our client to the DNS and make sure it works. First, we''ll save
    off a copy of our DNS client configuration file: cp /etc/resolv.conf /etc/resolv.old


    Now we''ll create a file to point to our new server. Edit /etc/resolv.conf so
    that it contains the single line:


    nameserver 127.0.0.1


