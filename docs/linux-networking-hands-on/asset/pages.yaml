  md: 'Review Exercises – Questions to test the student''s command of the chapter
    material.

    Critical Thinking Exercises – Questions that force the student to move beyond
    the text material.


    # Text and Graphics Conventions


    Each chapter begins with a brief discussion of theory and then jumps immediately
    into practical application, with periodic sidebars to provide additional details
    along the way. Linux command examples and software packages appear in Courier
    font, like so:


    ```

    cat /etc/passwd

    ```


    Periodically, I will insert a text box to briefly present a note or tip, like
    so:


    > This is just a note from the author to clear up a technical point or offer suggestions.


