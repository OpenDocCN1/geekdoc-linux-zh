  md: '# Preface


    Linux Networking: Hands On is designed to guide you through setting up and administering
    a Linux-based TCP/IP network.


    # This book includes:


    +   - Instructions for installing Linux from a Live CD distribution.

    - An overview of Linux software package management

    - Step-by-step instructions for installing a Linux-based network from a basic
    installation, including DNS, e-mail, Web, directory services and network-based
    authentication using Kerberos.

    - Per-chapter glossaries of key terms plus summaries, review exercises and critical
    thinking problems

    - Presentation of topics, including digital signatures, secure networking and
    digital certificates

    - Graphics and screen captures to provide a visual reference for students

    - Presentation of the powerful and popular Desktop Environment (KDE)

    - Presentation of Webmin, a Web-based administrative interface


    # Intended Audience


    This book is suitable for anyone with a basic knowledge of Linux (ie, you can
    log in and use simple commands such as cd, ls, cat and vi'') who wants to build
    a network based on the latest Internet standards. The labs are ideally done in
    a team environment but can easily be done by a single user. In addition, though
    the text was designed for use in an instructor-led class, it can be readily used
    for self-instruction.


    # Chapter Descriptions


    Chapter 1: An Introduction to Linux – Definition of free software versus open
    source, the contributions of Linux Torvalds and Richard Stallman, a guided tour
    of the KDE desktop and a guide to online documentation, both local and on the
    Internet.


    Chapter 2: Installation – Determining hardware compatibility, preparing your hard
    drive, installing a tour of the Linux file system, the boot process and the Linux
    system.


    Chapter 3: Basic System Administration – Monitoring resource usage, file system
    management, user management and an overview of the X server.


    Chapter 4: Software Package Management – Compare and contrast of package management
    between Linux and Windows, source versus binary installations, overview of the
    RPM Package Manager, and Debian''s Advanced Package Tool.


    Chapter 5: Webmin – Installing and configuring Webmin, a guided tour of the interface,
    creating custom groups and users.


    Appendix A has a quick start guide to the commands you will need.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Chapter 6: Encryption and Security Networking – A brief history of cryptography,
    an introduction to hashes, symmetric encryption, asymmetric encryption, setting
    up a certificate authority (CA), creating digital certificates, using digital
    signatures, an overview of SSL/TLS.


    Chapter 7: Domain Name Service – An introduction to name resolution, the origin
    of the Domain Name System, following a DNS query, installing and configuring a
    caching only server, setting up a primary name server, configuring a client.


    Chapter 8: Basic Network Services – Sharing files over FTP, an overview of Linux
    print services, connecting to and sharing a printer using CUPS.


    Chapter 9: Web Services Apache – installation and basic configuration, setting
    up a default page, creating a personal home page, setting up a secure, encrypted
    Web site, password-protecting a Web page, virtual hosting (name-based and IP-based),
    Basic, Digest and BLM authentication in Apache, using a public-key exchange


    Chapter 10: File-Sharing Services – installing and configuring a Network File
    System (NFS) server, sharing files to Windows using Samba, creating a Web-based
    file using Apache and WebDAV.


    Chapter 11: Electronic Mail – An overview of TCP/IP mail protocols and software,
    setting up an SMTP server, installing and configuring a POP3 mail server with
    SSL support, installing and configuring an IMAP mail server with SSL, configuring
    a standalone email client, installing and configuring a Web-based e-mail front.


    Chapter 12: System Management – Using built-tools (ps, killall and the system
    logs), installing and customizing krell, configuring KSysGuard to monitor local
    and remote machines, using LogWatch to automate log file monitoring.


    Chapter 13: Advanced Services – installing and configuring OpenLDAP, setting up
    a network directory service, installing and configuring Squid as a caching proxy
    and application layer firewall.


    Chapter 14: Network Authentication Using Kerberos – an overview of PAM (Pluggable
    Authentication Modules), installing and configuring a Kerberos Key Distribution
    Center (KDC), Kerberos Admin Server, configuring the Kerberos client.


    Appendix A: Linux for Windows – a quick start guide to the Linux command environment.


    Appendix B: Term Project – A sample project handout, suitable for either individuals
    or teams of three students.


    Appendix C: Answers to Review Questions


    # Features


    Chapter Objectives – Each chapter has a set of concrete objectives demonstrating
    key concepts that will be completed by the end of the chapter.


    Graphics and Screen Captures – Actual screen shots and detailed diagrams provide
    a vivid illustration of chapter topics.


    Tips and Tricks – Each chapter contains one or more boxed notes that deliver more
    detailed information about particular sub-topics.


    Chapter Summary – Provides an overview of the important concepts in each chapter.'
  merge: -1
