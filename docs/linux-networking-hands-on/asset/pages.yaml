    This provides a dynamic, real-time view of system operations, including the top
    20 processes by CPU and memory usage. In addition to process information, the
    display includes summary data, such as CPU utilization, load averages and status.

    There are a couple of columns in this listing that are of interest:


    +   PR - This is the priority level of the process. Priority values range from
    -20 to +20, with lower values meaning higher priority. The default priority is
    0. To start a command with a non-standard priority, use the nice value.


    nice -15 mys


    This will start your program with the nice level of 15, making it run more slowly
    (at a lower priority than normal).


    +   NI - This stands for the nice level of the process. You can think of nice
    level as almost the opposite of priority. In other words, a higher nice level
    means a process takes lower priority so that other processes get more resources.
    In other words, the process is ''nice'' to the others. A lower level (the process
    is ''less nice'') means that the process is a higher priority and gathers more
    resources that would otherwise be used by other processes. The default level is
    0, but you can change the nice level of a running process with the nice command
    and the process (PID):


    renice +10876'
