    # ## Partitioning Your Hard Drive


    In order to install any operating system, you will have to partition (create a
    space on) your hard drive. Most Linux installation utilities will guide you through
    this process and even offer to do it automatically. With Live CDs, this varies
    quite a bit. The installer should at least have an option to partition the drive
    yourself.


    So how many partitions of type do we need? The absolute minimum is two: one to
    contain the complete filesystem, the root partition, and one to let Linux swap
    out from memory to free up RAM. This one is called the swap partition. As far
    as file system goes (how the data is arranged on the partition), you have quite
    a few choices for the root partition and only one for the swap partition. The
    type for swap is called linux-swap. For the root partition, the most popular formats
    are ext3 (Extended Type 3) and reiserfs (developed by a coincidentally named entity).
    Both are good choices and include journaling, so that they keep track of file
    system changes when restoring from an ungraceful shutdown more reliable. The default
    is usually ext3.


    So let''s keep things simple and create a root partition (about 2 to 3 gigabytes
    in size for a full install, but more is okay) and a swap partition (about 1.5
    to 2 times your physical RAM, up to about 1 GB). We''ll talk about advanced partitioning
    options in a later section.


    > NOTE: If you''re using a Live CD and are unable to do your partitioning work,
    you can delete the partition table. THIS IS A LAST RESORT MOVE SINCE IT WILL MAKE
    ALL DATA ON THE DRIVE INACCESSIBLE! From a root prompt, type the command: dd if=/dev/zero
    of=/dev/hda will completely zero out the first 512 bytes of your hard drive, wiping
    out the partition and the bootloader. **Don''t do this if you plan to dual-boot
    or can afford to lose the data on the drive**


    # ## Copying Files to your Hard Drive


    This isn''t actually a step, since the installer will do this for you. The installer
    will ask you a few questions, first as letting you create a user account and set
    a password for the root account (system administrator). Once you''ve done this,
    just settle back and let the installer do its work. The important thing to remember
    is, if you''re not careful with the install, read all of the on-screen messages
    so you understand what''s going on before you proceed. I''ve seen many students
    get stuck with a problem that the developer anticipated simply because they blasted
    right past some warning message or helpful note.


