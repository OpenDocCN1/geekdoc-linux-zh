    # System Logs and LogWatch


    Processes running on a Linux/Unix system communicate their status to the syslog
    service. This, in turn, writes those messages to one or more log files. Its operation
    is controlled by a set of rules in the configuration file /etc/syslog.conf. Each
    rule takes the form:


    facility-priority action


    wherenfacility - the program category being monitored, such as mail or daemon.

    priority - the type of messages being recordednThe priorities, in increasing order
    of importance, are debug, info, notice, warning, err, crit, alert and emerg.

    action - This is what to do when you get a message. Possible actions are:

    ) Write the message to a file

    F) Write the message to a terminal console

    G) Write the message to the screen of all logged-in users

    H) Write the message to the syslog service on a remote system.

    A sample line from syslog.conf is:


    ```

    mail.* -/var/log/mail.log

    ```'
