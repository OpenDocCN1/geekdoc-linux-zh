  md: 'documentation.


    # Potential Issues With Linux-PAM


    Linux-PAM is a powerful tool and as a tool that can seriously change the security
    on your system, it should be approached with care and foresight. One of the most
    serious you can encounter with PAM is if you delete your configuration files.
    If this happens, you could be completely locked out of your system. To fix this,
    you will have to boot to single-user mode (if you don''t know what this is, then
    you shouldn''t be reading this document) and recreating the files from a backup
    or by creating a lowest-common denominator configuration and working up from there.
    While we''re talking about this, it''s probably a good idea to back up your PAM
    configuration files on a regular basis. They''re just text so they should be able
    to fit on a single floppy disk if necessary.


    Another potential issue is having a weak configuration. This is used for applications
    that use PAM but don''t have their own configuration files. In other words, it''s
    a sort of fail-safe.


    Here''s a sample configuration (courtesy of the Linux-PAM System Administrator''s
    Guide):


    +   # The PAM configuration file for the `other'' service

    #


    ```

    auth      required      pam_deny.so

    auth      required      pam_warn.so

    account   required      pam_deny.so

    account   required      pam_warn.so

    password  required      pam_deny.so

    password  required      pam_warn.so

    session   required      pam_deny.so

    session   required      pam_warn.so

    ```


    What this means is if an application hits this file, access will be denied and
    a time-stamp log entry will be generated. This will make your system less vulnerable
    to attack.


    # Kerberos


    Kerberos is a network service developed at MIT that does authentication. In other
    words, it identifies you to the network so that you only have to log in once.
    Microsoft currently uses Kerberos for authentication to their Active Directory
    Service.


    Here''s what happens when you use a Kerberos-aware network.


    +   - You log into your machine and the login program sends your user ID to the
    KDC.

    - The KDC looks your ID up in its database and if it finds a match, it sends a
    TGT (Ticket Grant Ticket) back to you encrypted with your Kerberos password.

    - You are prompted by the login program for your password and the TGT is decrypted
    and ready for'
