  md: '# NameVirtualHost *


    This enables name-based virtual hosting, which we will discuss in a later chapter
    in more detail. The * indicates that virtual hosting is set for all IP addresses
    and ports. For now, we want to modify this setting to limit it to sites served
    over port 80, the default for HTTP. (Later we will be setting a secure Web page
    that is served over port 443 for HTTPS or Secure HTTP.) So edit this line to read:


    ```

    NameVirtualHost *:80

    Next we see a whole section of directives starting with

    <VirtualHost *

    and ending with

    </VirtualHost>

    ```


    This is a description of the rules for the default site, including where the Web
    pages are and how they can be accessed.


    ```

    We''ll change the first line to

    <VirtualHost *:80>

    ```


    This is all we need to do for now. Let''s create a simple site describing our
    main Web page, which users will use by connecting to www.sinclair.prairiedog.edu.


    First need a directory to put our site files. It doesn''t matter where, as long
    as the server can get to them.


    ```

    mkdir /var/main

    ```


    Now let''s create a file in sites-available describing our new site. I''ve called
    it main and it contains the following:


    ```

    <VirtualHost *:80>

    DocumentRoot /var/main/

    ServerAdmin webmaster@sinclair.prairiedog.edu

    ServerName www.sinclair.prairiedog.edu

    </VirtualHost>

    ```


    In brief, it says that any Web request for www.sinclair.prairiedog.edu should
    be directed to /var/main and served the file index.html. Which reminds me, let''s
    create the Web page for our site. This can be generated by any application that
    can save as HTML.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 4.01 Transitional//EN">

    <html>

    <head>

    <meta content="text/html; charset=ISO-8859-1">

    http-equiv="content-type">

    ```'
  merge: -1
  pgno: 186
- img_proc: true
  md: '```

    <title></title>

    </head>

    <body>

    <div style="text-align: center;">

    <h1>This is my main Web page</h1>

    </div>

    <br>

    </body>

    </html>

    ```


    Why is this file called index.html? It has to do with the Apache directive DirectoryIndex
    which sets the default file name for the main page of a site. When you point your
    Web browser to a directory of a Web, the server looks in that folder for a file
    with one of the default file names DirectoryIndex and if found, serves it to you.
    This setting is found in /etc/apache/apache2.conf in Debian and in httpd.conf
    on other distributions.


    We can fix this up later with images and links to make it look nice, but for now
    it''s just a placeholder. Now that we have a page for our organization, let''s
    demonstrate a named-based virtual host.


    # Step 1 – Create an alias for our virtual host.


    Create a CNAME record in your DNS master zone called vhost and point it to your
    Web server.


    Test the alias.


    # Step 2 – Create a site for our new virtual host.


    Create a folder for our new site, /var/virtual.


    Add an HTML file called index.html under /var/virtual with the following content
    (or similar):


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 4.01 Transitional//EN">

    <html>

    <head>

    <meta content="text/html; charset=ISO-8859-1" http-equiv="content-type">

    <title></title>

    </head>

    <body>

    <div style="text-align: center;">

    <h1>This is my virtual host Web page</h1>

    </div>

    <br>

    </body>

    </html>

    ```'
  merge: -1
