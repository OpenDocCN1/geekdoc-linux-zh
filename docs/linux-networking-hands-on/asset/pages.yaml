    The following hardware is recommended for the hands-on work in this book:


    +   - Pentium PC (500 MHz or higher)

    - 128 MB of RAM

    - 8 to 16 MB VRAM (for the GUI desktop)

    - At least 3 to 5 GB of hard drive space

    - CD-ROM drive

    - 3.5-inch floppy drive

    - Mouse or pointing device


