    # Introduction


    Every Linux book ever written starts out by defining “free software” and I’m certainly
    not going to the first author to buck the system. Actually, I’m going to begin
    by talking about free software, then go on to introduce Linux. Ready?


    # Free vs. free


    One problem with the English language is that we have these words with more than
    one meaning. The word ‘free’ is a good example. If I were to hand you a CD and
    tell you that it has ‘free’ software on it, you’d assume I mean the software didn’t
    cost anything. Almost everyone does the first time.


    But there’s another meaning to ‘free’. Free can also mean ‘able to act at will’,
    in free speech, free press and so forth. When I use this definition and say ‘free
    software’, I mean that you are free to do whatever you want with the software,
    including:


    +   - Make as many copies as you want

    - Give away as many copies as you want

    - Sell as many computers as you want

    - Load a single copy on as many computers as you want


    The first meaning of ‘free’ is known in the hacker community as ‘free as beer’.
    The second is ‘free as in speech’. Now if someone tells you that they have some
    free software, you Ask Free as in beer, or free as in speech?


    In the early days of computers, all software used to be free in both senses of
    the words. After all, computer hardware was no good without software and everyone
    who bought a computer had to heavily customize the software for their own use.
    These days software and hardware are so widely available that it might seem hard
    to believe that at one time there was no such thing as a company that only software.


    # The Free Software Foundation


    Enter Richard Stallman. Richard was (and is) an old school hacker who remembers
    the days when software was free and you could just use it and modify it any way
    you wanted. With the rise of commercial software companies, there was less and
    less free code available. Stallman decided to form the Free Software Foundation
    (FSF) whose mission was to protect, preserve and promote free software. That is,
    free as in speech.


    # Linux


    Along comes Linus Torvalds, a Finnish computer science student. Linus wanted an
    operating


    > ¹ I might be exaggerating here.'
