  md: 'the general public. Now hundreds of computers have become hundreds of thousands.
    The hosts file at UCSD is groaning at the seams and computers are having to update
    their copies several times a day. So, it looks like this solution works for a
    few hundred computers, but as the network grows it becomes nothing better than
    a big sticky note. We need a way to do name resolution that will grow gracefully
    as the network grows.


    # # DNS


    Now the fundamental idea of the hosts file, associating IP addresses with human-friendly
    names, was perfectly sound. The problem comes when the amount of data grew too
    large to effectively manage in a single file. As your network grows, this problem
    grows even faster. DNS is the current solution to this problem and it solves it
    by handling the data differently.


    So how do you manage much data that it can''t easily fit in a single file? Split
    it into multiple files, of course! Not only, but make copies of these files and
    spread them around multiple computers so you have plenty of capacity and no one
    gets overwhelmed by the load. To make this work, we needed a better way to identify
    computers by the network name. We split the network into layers. The top layer
    is root and is denoted by a. (dot). Don''t worry about why right now. The next
    level is the top-level domains (TLDs) and consists of .com, .edu, .org and so
    on. The next level consists of the subdomains for organizations. For example,
    Microsoft has a subdomain of a .com top-level domain, called enough, microsoft.
    The next level is down for individual machine names. www.microsoft.com is the
    Web name www in the microsoft subdomain of the top level domain .com. This way
    we can have many computers named www, for example, and still keep straight because
    they''re in different domains, like:


    +   * www.microsoft.com

    * www.apple.com

    * www.ibm.com

    * www.purdue.com

    * www.whoppix.org


    So, DNS works by having different groups of computers responsible for each level
    in the hierarchy. For example, the root servers know where to find the servers
    for .com, .org, etc. The .com servers know where to find the servers for microsoft.com,
    apple.com and so on.


    +   A DNS query works like this:

    1. A user puts the address www.ibm.com (for example) into her Web browser.

    2. The local DNS server looks up the name to see if it can produce a network address.
    If it can, it returns the address to the user''s computer, she connects and all
    is well. If it can''t...

    3. The local DNS contacts the root servers and asks about .ibm.com. The root servers
    don''t know where to find the .com servers, so they direct the local DNS there.

    4. The .com servers know where .ibm.com server is, but they know the ibm.com servers
    are and re-direct your local DNS to them.

    5. The IBM DNS knows about the machine name www and return the IP address to her
    local DNS. The local DNS stores the address in its local cache and handles the
    address to the client.

    6. The client PC can connect directly to the server www.ibm.com.


    The process can be visualized like so:'
  merge: -1
