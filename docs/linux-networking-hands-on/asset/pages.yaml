    # Chapter Summary


    A directory is a database where you look up commonly used information.

    A directory server is a network service that responds to lookup requests for a
    directory. An example of a directory server is an online e-mail address book.

    LDAP is the standard protocol that directory servers use to exchange information.

    LDIF is a standard file format for importing and exporting LDAP data.

    A schema is a set of rules that describe database records and their relationships.
    OpenLDAP uses multiple schemas and additional record types can be added simply
    by including the appropriate schema.

    A directory server can store nearly any type of data, but is typically used for
    user accounts, network hosts and other network resource information.

    A proxy server acts as a middleware between the client requesting data and the
    remote server that provides the data.

    A caching proxy is a proxy server that stores (caches) the results of network
    requests to speed up access to commonly requested data.

    A proxy server can also be used as an application layer firewall to block access
    to certain network services, network hosts and network clients.


