  md: 'choice of a number of print systems. One of the most popular days is CUPS (Common
    UNIX Print System). It is relatively easy to administer and offers a wide range
    of printer support, including many Windows printers. Like other services, you
    can administer it at either the command line or in a GUI.


    # How UNIX Printing Works (in general)


    UNIX printing (no matter print system you use) has several steps and we need to
    understand the jargon to understand the steps.


    Application - That is, any piece of software that can print. An application produces
    a data file to the printer. This file is known in printer pienso as a.job.


    Print Job - A file (or set of files) are sent through a filter to be transformed
    into a more suitable for printing.


    Print Filter - A filter is a piece of software that can do a variety of jobs,
    including transforming a file from one format to another and offer less show work
    ordering pages. A filter that is associated with a specific printer model is referred
    to as a print driver.


    Print Queue - UNIX print jobs are sent to a print queue, which is a logical device
    associated with a printer. Each queue is associated with a folder in the file
    system, called a spool pool.


    Print Daemon - This is a background process that looks for waiting print jobs
    in the system and send them to the printer.


    SO, an application sends a print job to a queue. The printer daemon picks the
    job out of the queue and sends it through the filter associated with the printer.
    The filter transforms the file into the appropriate format for the printer and
    transfers the data to the print device, which then prints it. CUPS can also print
    to a file. For example, cups-pdf:/ URI sends the job to the CUPS PDF filter and
    creates a PDF file.


    # Adding a Printer


    From the command line: I don''t recommend this, personally, if you''re given a
    choice. However, sometimes you don''t have a choice so you should always be able
    to manage anything on your Linux box from the command line.


    The primary command for managing your printers is lpdadmin. But before you use
    it, you have to understand how CUPS works.


    Every printer queue in CUPS has a unique name. The name can contain up to 127
    characters, including letters, and the numbers¹. Names are not case-sensitive,
    so MyPrinter and myprinter would be interpreted as the same name. A CUPS print
    queue is associated with a physical device, such as a serial or network interface.
    The path to the queue is written as a URI (Uniform Resource Identifier, as a serial)
    which is just a general version of the URL (Uniform Resource Locator ) that you
    use in web browser.


    To see the URI''s supported on your system, use the lpinfo command:

    home4-deb:/var/log# -v


    3 The only characters not allowed are " " (a space) and "@".'
