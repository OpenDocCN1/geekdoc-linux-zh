- img_proc: true
  md: "(You'll be prompted to set a password for guest.)\n\n- Create a site file for\
    \ this share in /etc/apache2/sites-available called dav:\n\n```\n#\n# Settings\
    \ for WebDAV Server\n#\n<VirtualHost :80>\n  DAVLock /var/www/DAVlock/\n  DAVMinTimeout\
    \ 600\n  DocumentRoot /var/DAVdocs/\n  ServerName dav.sinclair.prairiedog.edu\n\
    \n<Directory /var/DAVdocs>\n  DAV On\n  AllowOverride AuthConfig\n  AuthName \"\
    Read-only DAV SHARE\"\n  AuthType Basic\n  AuthUserFile /etc/apache2/users\n \
    \ <LimitExcept OPTIONS>\n    Require valid-user\n  </LimitExcept>\n</Directory>\n\
    </VirtualHost>\n```\n\nMost of these new lines are familiar to us from the previous\
    \ chapter on Apache, but a few are new to us:\nDAVLock /var/www/DAVlock/ - This\
    \ is the path to the file locking database. We use locks to make sure that one\
    \ person can modify a file or folder at a time.\nMinTimeout 600 - The minimum\
    \ amount of time (in seconds) that DAV will hold a lock on a resource. In other\
    \ words, if you don't do anything in ten minutes, it will unlock so other people\
    \ can get at it.\n<Directory /var/DAVdocs> - This is the path to the directory\
    \ we're going to share using DAV.\nDAV On - This enables DAV for the listed above.\n\
    <LimitExcept OPTIONS> - This says that if you want to use any HTTP methods OTHER\
    \ THAN THE ONED IN THE TAG, you need to authenticate.\n</LimitExcept> - Closing\
    \ the <LimitExcept> tag.\n\n- Add the DAV modules to your Apache configuration:\n\
    \n```\na2enmod dav\na2enmod dav_fs\n```"
