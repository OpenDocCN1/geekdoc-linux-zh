  raw: 'These file formats can be understood by learning the documentation of shadow,
    gshadow, passwd.


    ### User Account Creation


    Kali Linux is a sophisticated operating system. It relies heavily on the root
    user to perform most of the tasks. However, there can be reasons to create users
    without root permission, especially if you use Kali Linux in your day-to-day activity.


    To add a user, you need to use the adduser command.


    Once you put it in, it will then ask you for the username. You can add the username
    and then press enter to complete the task.


    However, as you can see from the above screenshot, it asks for a variety of information
    before finishing the process of creating a new user. It starts by creating the
    user, adding a new group, and adding a new user (1000) with a group. The group
    is created similar to that of the username. You can also mention the group name
    by adding it after the username. adduser command takes two inputs. The first input
    is the username, whereas the second input is groupname.


    adduser [username] [groupname]


    You can also gather more information on how the adduser function by typing the
    help command as below.


    adduser --help


    First, it asks for the password. You can set a password for the new user. The
    user can then change this password once he logs into his/her session.


    Next, it will ask you to enter values asking for more information about the user.
    You can opt to skip it by simply pressing enter. The user itself can enter this
    information once he uses his user account.


    The information asked by the adduser command includes the following.


    Full Name


    Room Number


    Work Phone


    Home Phone


    Other


    If you still want to know more, then you can check out the configuration file
    used by the adduser command. It is stored in /etc/adduser.conf. The configuration
    files include some nice stuff that you can learn about. For example, you will
    find that a user identity(UID) range is defined to ensure if something is shared
    with the group or not.


    Also, you noticed how it created directories in the user home directory. The structure
    of the directories utilizes the /etc/skel/template. The adduser command uses the
    template and configuration files to ensure that a user is added by following set
    standards.


    ## Getent Command


    There is one more useful command that you should know about. It is the getent
    command. It stands for get entries as it can query the system database. To do
    so, it first calls the needed library function, then followed by the calling the
    NSS(name service switch) module. This module is configured in the /etc/nsswitch.conf.


    The syntax of the command is as below:


    getent [database_name] [search_key]


    So, if you want to search for a password for a particular user, you can run the
    following query.


    getent passwd user1


    ## Changing or Modifying an Account


    There can be many scenarios where you may need to modify an account. It can include
    changing passwords or other information about the account. The command to change
    the password for a Linux account is as below:


    ### passwd


    The first command that we are going to discuss is passwd command. It is a straightforward
    command that lets you change password. Any root or normal user can use the command.
    No root privilege is required to run passwd.


    It will ask you to type the password once you enter the command. It will once
    again ask to re-type it before changing the password.


    Using the command modifies the /etc/shadow file.


    ### chfn


    chfn lets you change the full name of the user. It is only reserved for the superuser,
    i.e., root user.


    ### chage


    chage command is used to change the password expiration settings for a user. It
    can only be used by an administrator and is used to enforce good password habits.
    Passwords are sensitive in nature and hence needs to be modified from time to
    time. If you want a user to change the password immediately, then you need to
    use the -e argument. It will force the user to change the password the next time
    he logs in.


    ## Account Disabling


    Some accounts need to be disabled due to many reasons, including not following
    rules or if an account gets hacked by someone else. To ensure that this does not
    hamper your Kali Linux installation, then you need to delete the account or at
    least lock the user out for an indefinite time while you run an investigation.


    To disable an account, you need to use the passwd -l command.


    passwd - l [username]


    This will lock the account. This also means that the account files are not deleted
    and are only locked. They can be referenced later on once it is unlocked. As a
    Kali Linux administrator, you should only use account disabling to ensure that
    you can revert the account if needed. Also, some users may be sensitive information
    in their home directory. Data once deleted cannot be reverted, so be wary of the
    consequences before you delete a user account.


    ## Use Groups Management


    Lastly, we are going to discuss how to manage groups. Groups are a critical part
    of any Linux operating system as they enable file and folder sharing for a group.


    You can add groups by using the command, addgroup.


    To delete a group, you can use the delgroup command.


    If you want to modify a group command, then you need to use the groupmod command.
    It lets you modify the group using the GID or the identifier.


    You can also set a group password using the gpasswdgroup. For removing the password,
    you need to use the following command.


    gpasswd - r group


    This leads us to the end of our Unix groups and user management. Now, let’s move
    to configure the services.


    ## Configuring Services


    Service configuration is also an important part of Kali Linux. When we say services,
    we generally mean daemons. They are the programs that keep running in the background.
    The services are also responsible for making sure that the systems function as
    intended.


    As there are tons of services running in the background, it is not possible to
    discuss each one of them. That’s why we are going to discuss a few of the important
    ones only. Let’s get started and see how important services can be configured.


    ### Specific Program Configuration


    In this section, we will learn to configure a specific program. Before you get
    started, you first need to understand the program. To do so, you need to read
    the documentation properly. Generally, the README file is located in the following
    location. → /usr/share/doc/package/README. Debian


    By going through the documentation, you will only save time. Generally, package
    configuration can be very specific, and the documentation does have the required
    information to do so. The documentation might also contain a link to other resources
    that you can find useful.


    Next, it is a good idea to check the software’s official documentation.


    If you feel lost, then you should check out the dpkg -L package command. This
    command will return a list of files. From there, you can easily find the documentation.


    Another useful command is the dpkg -s package, which shows you the meta-data about
    the package. The meta-data can contain important information or simply can suggest
    other packages that can contain the required information.


    Also, you can always try to run the configuration beforehand. By going through
    the configuration, you will know what to expect, and then find those things in
    the documentation.


    The configuration steps can also be self-explanatory with proper comments. In
    some instances, some configuration files are disabled using comments. By uncommenting,
    you can make the configuration file to run and make the package execute.


    ### Remote Logins SSH


    SSH stands for secure shell. It lets users connect to the machine remotely. After
    connecting, you can perform a different set of tasks, including executing commands
    or transferring files. SSH is a well-known tool among Linux users. In fact, it
    is used on an industrial level to connect to remote machines.'
