  trans: '


    你将获得一个精美的 GTK 图形用户界面，通过它你可以控制所有功能。其一些显著功能包括专用的 `ncurses` 模式、读取自定义配置文件的选项、调试模式、用于保存所有结果和数据的日志文件支持，以及更多功能。


    ## DHCPig - DHCP 耗尽应用


    `DHCPig` 是一种动态主机配置协议（DHCP）耗尽工具。它可以帮助你对网络创建并启动高级攻击，从而耗尽局域网（LAN）上所有的 IP 地址，限制新用户获取
    IP 地址，甚至可以释放网络中正在使用的任何 IP 地址。锦上添花的是，该工具甚至可以使用 `ARP` 让所有 Windows 主机离线。


    一旦执行该脚本，它会首先获取你邻居的 IP 地址并监听来自任何已连接客户端的 DHCP 请求。如果检测到提议（offer），工具将对该提议响应请求。它还可以循环从所有不同的主机和
    MAC 地址发送 DHCP 请求，检测邻居的 MAC 和 IP 地址并将其从 DHCP 服务器中释放，以及许多更多功能。


    ## [THC Hydra - 用于暴力破解远程身份验证服务](https://github.com/vanhauser-thc/thc-hydra)


    接下来是 `THC Hydra` - 这是一个免费的黑客工具，可以帮助你启动暴力攻击来破解远程身份验证服务。该工具支持超过 50 种协议，使其非常适合测试任何类型服务器环境的密码安全级别。


    该工具以其极快的密码破解速度、可以在多个操作系统上运行的能力、并行启动多次暴力攻击的选项以及更多功能而闻名。此外，作为一个基于模块的应用程序，它提供了添加自定义模块以扩展其功能的选项。


    ## Metasploit Framework - 渗透测试套件


    `Metasploit Framework` 可以帮助你针对远程主机创建、测试和执行漏洞利用。它让你能够访问一整套渗透测试工具，并配有一个强大的基于终端的控制台——
    `msfconsole` —— 来帮助你定位目标、启动扫描、利用任何漏洞并收集所有可用数据。


    事实上，它是市场上最强大的安全审计工具之一，由于它是免费提供的，它是你应该随身携带的工具。该工具的显著特性包括支持网络枚举和发现、在远程主机上规避检测的能力、开发和执行漏洞利用，以及更多功能。


    ## [FunkLoad - Web 压力工具](https://pypi.org/project/funkload/)


    通过 `FunkLoad`，你获得了一个基于 `python` 的强大功能和负载 Web 测试器。它可以帮助你模拟浏览器，并带有真实的浏览器功能，如 cookies、引用（referrer）支持等。如果你正在测试一个
    Web 项目并分析你的 Web 服务器的性能，它是非常完美的。


    在功能方面，该工具可以帮助你对 Web 项目进行功能测试和回归测试。它还可以在加载应用程序后监控你的服务器性能，以帮助发现任何瓶颈。其他显著特性还包括帮助发现
    bug 的负载测试、用于评估应用程序恢复能力的压力测试等。


    ## [SlowHTTPTest - 针对 HTTP 服务器的 Web 压力应用](https://github.com/shekyan/slowhttptest)


    `SlowHTTPTest` 是目前最著名的应用层 DoS 攻击模拟器。它具有高度可配置性，可以帮助你延长 HTTP 连接以模拟应用层拒绝服务攻击。它是测试你的服务器或
    DoS 漏洞，或者简单地测试它一次可以处理多少并发连接的理想选择。


    该工具还会每次测试生成用的统计数据，因此你可以获得有用且可操作的信息。一旦测试完成，它会将所有统计和指标保存在 HTML 或 CSV 文件中，你可以将其用于展示或进一步分析。该工具的其他显著特性还包括设置各种详细程度的选项、设置自定义
    HTTP 连接速率，甚至支持代理重定向（Proxy redirects）。


    ## [Inundator - 多线程 IDS 规避安全工具](http://inundator.sourceforge.net/)


    `Inundator` 是一个多线程、基于队列的入侵检测假报生成器。此外，由于它是完全匿名的（得益于 `TOR` 集成），它是测试入侵检测或防御系统的完美选择。它可以每秒生成一千多个假报来字面上淹没安全系统。


    使用该工具生成的所有假报都使用了非常糟糕的模式匹配规则。因此，如果系统检测到很少或没有假报，则意味着它是基于一组编写良好的规则。相反，如果它成为数百个假报的受害者，那么你应该考虑在网络中采用基于启发式的检测或基于异常的检测机制。


    ## [社会工程工具包](https://github.com/trustedsec/social-engineer-toolkit)


    `Social Engineering Toolkit` 是另一个强大的渗透测试框架，拥有大量工具，帮助你只需点击几次即可创建并执行社会工程攻击。如果你想使用强大的社会工程学技巧和门路黑入社交网络账户，它是完美的。


    你将获得可以帮助你进行 WiFi 攻击的工具，这些攻击可以重定向或拦截来自你同一 WiFi 网络的用户的数据包。此外，你还可以创建短信、电子邮件和基于 Web
    的欺骗和钓鱼攻击。该工具甚至可以让你创建恶意的 `.exe` 文件，用户在运行它后将损害其系统。


    ## [OpenVAS - 漏洞扫描工具](http://www.openvas.org/)


    `OpenVAS` 是一个免费软件，可以帮助你检测任何本地或远程网络的漏洞。它还可以帮助你直接在 `OpenVAS` 平台上编写、创建和集成你的自定义安全插件。此外，该平台将为你提供五万多个
    `NVTs`（网络漏洞测试），可以扫描系统中的几乎任何安全漏洞。


    现在看看该软件的一些显著特性，你获得了执行同步主机发现、网络映射和端口扫描、访问 OpenVAS 传输协议、与 SQL 数据库和 SQLite 完全集成、自动计划扫描以及更多功能的选项。


    ## [Nikto - 帮助进行 Web 服务器扫描](https://www.cirt.net/Nikto2)


    `Nikto` 设计用于作为某些漏洞扫描工具（包括 `OpenVAS`）的补充软件。它可以帮助你对 Web 服务器进行全扫描，以定位系统/网络中的漏洞和缺陷。扫描结果非常全面，可以收集不安全文件、应用程序模式、过服务器软件、文件名（默认）、任何软件配置错误等信息。


    你可以用它同时扫描服务器上的多个端口。此外，它还带有 IDS 规避技术、以各种格式输出结果的选项、针对 Apache 和 `cgi-wrap` 的用户名枚举，以及更多功能。


    ## [WPScan - 用于 WordPress 安全审计的工具](https://wpscan.org/)


    正如众所周知，`WordPress` 是世界上最流行的 CMS 平台，驱动着全球超过 30% 的网站。因此，包含一个可以帮助审计网站 WordPress 安全的
    Kali 安全工具显然是合理的。通过 `WPScan`，你可以扫描并检测你的 Web 项目是否免受某些类型攻击的侵害，以及从其核心文件、插件或主题中暴露了多少敏感信息。


    '
- fmt: '

    The tool can also help you scan weak passwords used by all registered users, and
    stimulate brute force attacks to see if the passwords can be easily cracked or
    not. Other notable features include the option to perform non-intrusive security
    scans, WP username enumerations, and Scheduled WordPress Security Scans.


    ## [CMSMap - A Centralized Security Solution For All Popular CMS](https://github.com/Dionach/CMSmap)


    Unlike WPScan, which is solely a security tool for WordPress websites, CMSMap
    is a centralized multi-platform security solution designed to work with not only
    WordPress, but also with Joomla, Drupal, and Moodle.


    The tool can help you find security flaws on all the CMSs mentioned above by running
    brute force attacks, scanning for vulnerabilities, and launching exploits to break
    into any found vulnerabilities. The tool can also help you set custom user-agent
    and header, comes with support for SSL, a dedicated verbose mode for debugging
    purpose, and so on.


    ## Choose The Right Tool And Reinforce Your Network Security


    So as you can see, Kali Linux is compatible with some of the best ethical hacking
    and penetration testing tools in the market. Not only that, but you also get access
    to a whole entourage of different security-centric tools that can help you in
    various other ways as well.


    These tools can easily help you quickly scan out all security vulnerabilities
    in your network and fix them before any hacker has the time to exploit it.


    ## Things We Learned in This Chapter


    - Kali Linux is known for its collection of tools.

    - It has more than 600+ pen-testing tools.

    - `Nmap` - used to scan a network

    - `Fierce` - It helps you to do network mapping and port scanning

    - `Unicornscan` - It is used for gathering information and also offers the ability
    to scan UDP and TCP.

    - `Wireshark` - `Wireshark` is a cross-platform network analyzer.

    - `Aircrack-ng`: It is wireless security software. It comes with tons of options
    and other small tools

    - `Kismet Wireless` - Another useful wireless tool used for sniffers, DIS and
    LAN analysis

    - `John The Ripper` - `John the Ripper` is a popular cryptography testing tool.
    It is used for cracking as well.

    - `BeEF` - It is a Browser Exploitation Framework. It is a penetration testing
    tool used to find exploit and vulnerability.

    - `Yersinia` - The tool is used for L2 attacks

    - `DHCPig` - The tool is useful for making advanced network attacks

    - `THC Hydra` - It is a brute force crack a remote authentication

    - `Metasploit framework` - a popular penetration testing suite

    - `FunkLoad` - It is a web stress tool for testing browsers

    - `SlowHTTPtest` - It is used for launching DOS attacks against HTTP servers

    - `Inundator` - It is a multi-thread IDS evasion security tool

    - `Social Engineering Toolkit` - Lets you make social engineering attacks with
    few clicks

    - `OpenVas` - It is a network vulnerability scanning tool.

    - `WPScan` - It is a WordPress security auditing tool.

    - `CMSMap` - Centralized Security Solution for Popular CMS


    ## Conclusion


    Kali Linux is the number one penetration testing tool. If you have an interest
    in security or hacking in general, then Kali Linux is something you should learn.
    I hope that you found the book useful. The book is also suitable for those who
    are into the Linux ecosystem and wants to learn about different distribution.


    The book tried to teach you how to use Kali Linux to your advantage. We also covered
    other important topics such as cybersecurity, hacking process, and Debian package
    management. Our focus soon shifted more towards the intricacies of Kali Linux,
    where we learned about how to configure Kali Linux. We also learned Debian Package
    Management.


    One interesting topic that we covered is how Kali Linux is closely connected with
    Debian. Without the evolution of Debian, Kali Linux would not be as successful
    as it is now. Kali Linux is also known for the tools that it offers. It has hundreds
    of useful tools that you can use to do penetration testing. As it is not possible
    to list every tool, we covered a few of them in this book. Each tool is powerful
    in its own way. However, the usage of the tools depends on the user itself. You
    need to be creative to make the most out of it.


    You can also think of Kali Linux as a tool. Without the necessary problem-solving
    skills and aptitude, you will not be able to prosper the use of it. So, why I
    am stressing it? It is because, after you read the book, I want you to experiment
    with Kali Linux as much as possible. This will open up new possibilities and improve
    your understanding of a whole new level.


    If you are interested more on Kali Linux, then I recommend reading more about
    the tools that we discussed on the Kali Linux Tools chapter. I also recommend
    contributing to the community to make the Kali Linux community more awesome! Kali
    Linux is mostly community-driven, and any contributions can make it more secure
    and useful.


    I congratulate you on completing the book and wish you the best of luck in your
    future endeavors.

    '
