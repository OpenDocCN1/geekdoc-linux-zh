  trans: "\n\n# 使用 USB 方法安装 Kali Linux\n\n在没有预装操作系统的裸机机器上安装 Kali Linux 是很容易的。你只需要制作一个可启动的\
    \ U 盘或使用 DVD 安装光驱。要制作可启动的 U 盘，你需要按照下面提到的步骤操作。\n\n* 下载 Kali Linux ISO\n* 现在，下载\
    \ `Rufus`。\n* 一旦下载了 `Rufus`，就在你的机器上安装它。如果你没有可用的机器，应该向同事或朋友寻求帮助，让他们替你完成。\n* 现在，启动\
    \ `Rufus`，它的界面如下所示。\n\n![](img/image00144.jpeg) \n\n* 你的 U 盘将显示在设备区域。在启动选择（boot\
    \ selection）中，你需要选择 Kali Linux 镜像。为此，你需要点击 `SELECT` 然后选择已下载的 Kali Linux 文件。在分区方案（partition\
    \ scheme）中，你应该保持为 `MBR`。目标系统应为“BIOS or UEFI”。\n* 当涉及到高级驱动器属性时，你可以保留显示的默认设置。\n\
    * 一旦所有设置都正确，点击 `Start` 按钮。\n* 现在，等待 `Rufus` 完成过程。\n\nUSB 驱动准备好后，你现在需要从它启动。你现在只需要按照安装向导所示的步骤进行安装即可。\n\
    \n## 双系统安装 Kali Linux\n\n双系统安装 Kali Linux 与上面的过程非常相似。在这里，你需要确保有足够的空间来安装 Kali Linux。一个不同的分区（即使在同一块硬盘上）也可以。然而，如果你缺少空间，则需要使用一个名为\
    \ `GParted` 的工具。该工具让你能够缩小 Windows 安装分区并为 Kali Linux 安装腾出空间。要进行正确的双系统 Kali Linux\
    \ 安装，你需要按照下面提到的步骤操作：\n\n* 你首先需要从你的 USB 驱动或你选择的安装介质启动。一旦进入 Kali Linux 启动界面，你现在需要选择“Live（实时模式）”。这将进入\
    \ Kali Linux 的默认桌面。\n* 从那里，你需要启动 `GParted` 程序。`GParted` 程序对于缩小 Windows 分区非常有用。通过它，你可以在有限的空间内成功安装\
    \ Kali Linux。\n* 一旦 `GParted` 启动，你需要选择 Windows 分区并右键点击它。然后点击“Resize/Move”（调整大小/移动）。确保你为\
    \ Kali Linux 留有 20 GB 的安装空间。\n* 在选择更改后，现在点击“Apply All Operations”（应用所有操作）。\n*\
    \ 完成后，你现在需要再次启动 Kali Linux 并选择 `Guided -- use the largest continuous free space\
    \ as the partition disk`引导 -- 使用最大的连续空空间作为分区磁盘）。\n* 安装完成后，系统将重启，你最终可以使用 `GRUB`\
    \ 启动菜单引导到 Kali Linux。\n\n## 在 Hyper-V 上安装 Kali Linux\n\n现在，我们将学习如何在 `Hyper-V`\
    \ 上安装 Kali Linux。这是我在学习 Kali Linux 时的建议。请记住，本书重点是学习 Kali Linux，而最好是虚拟化。\n\n###\
    \ 在你的机器上启用 Hyper-V\n\nHyper-V 在 Windows 环境中提供虚拟化。要启用 `Hyper-V`，你需要满足以下要求。\n\n\
    * 支持 `SLAT`（二级地址翻译）的 64 位 CPU。\n* 虚拟化支持。基本上，对于 Ryzen 芯片应为 `SVM` 模式，对于 Intel 芯片应为\
    \ `VT-c` 模式。\n* 至少 4 GB 内存。\n\n尽管你的机器支持虚拟化，但在使用之前需要先启用它。要启用它，你需要进入 BIOS 并启用虚拟化。我正在使用一台带有\
    \ `AB350` 和 `Ryzen 1600` 的不错的中端配置。对于我的机器，我必须进入 CPU 高级功能，在那里启用 `SVM` 模式。如果虚拟化在你的系统中仍然不起，你需要在\
    \ BIOS 中允许强制性硬件数据执行保护（Data Execution Prevention）。\n\n要检查你的机器现在是否准备好进行虚拟化（特别是用于\
    \ `Hyper-V` 方案），请运行以下命令。\n\n* 运行命令提示符\n* 在命令提示符上运行 `systeminfo.exe` 命令\n* 按回车\n\
    \n你将看到命令的正面回复。\n\n仅启用硬件虚拟化是不够的。Windows 默认不运行 `Hyper-V` 模块。要允许它们运行，你需要进入控制面板并搜索“启用或关闭\
    \ Windows 功能”。\n\n在那里你会找到 `Hyper-V` 选项，以及两个子选项：`Hyper-V Platform` 和 `Hyper-V Management\
    \ Tools`。启用这两个选项并点击确定继续。\n\n完成后，你需要重启，然后进入实际安装过程。\n\n### 开始安装过程\n\n* 对于此，我们建议通过\
    \ `Quick Create`（快速创建）选项。一旦你打开 `Hyper-V`，你将在菜单中找到 `Quick Create` 选项。\n* 你将看到 `Create\
    \ Virtual Machine`（创建虚拟机）窗口。在那里发现几个选项，包括 `Ubuntu 18.04.3 LTS` 和 `Ubuntu 19.04`。\n\
    * 这里你需要先点击“Local installation source”（本地安装源），然后移动到“Change installation source”（更改安装源）。\n\
    * 从那里选择 Kali Linux ISO。此外，取消勾选“This virtual machine will run windows”（此虚拟机将运行\
    \ Windows）选项。\n* 完成后，点击 `Create Virtual Machine` 。\n* 它将提示你连接到新虚拟机。关闭提示，然后右键点击你刚刚创建的新虚拟机并选择“Setting”（设置）。\n\
    * 现在，从那里进入 `SCSI` 连接器并选择硬盘。\n* 从这里，如果你想更改磁盘的位置，需要点击 `New`新建）。这很重要，因为 `vhdx` 文件存储在\
    \ `C:` 盘中。\n* 点击 `Connect`连接）。完成后，你现在看到 Kali Linux 启动菜单，如下所示。\n\n![](img/image0145.jpeg)\n\
    \n在这里你可以看到 Live system（实时系统）选项。实时系统选项对于测试非常有用。这让 Kali Linux 成为一个好主意。\n\n要开始安装，你需要按下\
    \ installer 选项。完成后，它将使用安装向导启动。\n\n它将遵循的步骤概述如下。\n\n![](img/image046.jpeg)\n\n让我们列出步骤以确保安装正确：\n\
    \n* 选择安装过程的语言。它还会询问安装系统的语言。我们将两个选项都选择英语。\n* 根据你所在地选择位置。\n* 然后它要求你配置键盘布局。选择你喜欢的键盘布局。\n\
    * 之后，它将从源加载安装组件。在我们的情况下，它是 ISO。向导还将配置网络。\n* 完成后，你需要为系统选择一个主机。这是一个单单词主机。它会自动选择\
    \ Kali 作为主机，我们建议你使用它，这将有助于你遵循书籍内容。它还会要求你选择域名。主机是可选的。\n* 现在，你需要选择 root 密码。root\
    \ 密码是必须的，你需要在继续之前选择一个。现在，选择一个难以猜测或破解的强密码。同时，确保你以后不会忘记密码，否则将导致你无法访问 Kali Linux。\n\
    * 它现在会要求你设置时区。\n* 现在，涉及到配置你的分区磁盘。Kali Linux 或任何 Linux 安装都有不同的文件系统，因此它们看起来与任何其他操作系统安装完全不同，特别是\
    \ Windows OS 安装。为了确保你不需要做太多，你可以选择 `Guided - use entire disk`（引导 - 使用整个磁盘）选项。由于我们正在使用虚拟化，我们不需要担心分区，因为\
    \ `Hyper-V` 已经为我们的操作系统安装分配了唯一的硬件位置。\n\n"
