    我们最后想要讨论的一种网络攻击是钓鱼。这是一种常见的攻击，始于伪造的电子邮件。这些邮件随后被用于收集关键信息，包括信用卡号或登录信息。防止此类攻击的最佳方法是在电子邮件服务中建立适当的过滤机制。


    其他类型的网络攻击包括：


    *   中间人 (MITM) 攻击

    *   SQLi 攻击

    *   拒绝服务 (DoS) 攻击

    *   XSS 跨站脚本攻击

    *   分布式拒绝服务 (DDoS) 攻击


    除了上述攻击外，还有其他类型的网络攻击。攻击的类型取决于黑客试图破解的设备和网络。


    下面我们将尝试用简单的语言来解释这些类型的攻击。


    ### 中间人 (MITM) 攻击


    这是一种流行的攻击，通常用于黑入设备。在这种攻击中，第三方恶意者获取了在两个双方之间通信的权限。通过这种方式，它可以窃取信息并利用这些信息伤害受害者。


    ### SQLi 攻击


    在 `SQLi` 攻击中，黑客试图在数据库上执行恶意的 `SQL` 语句。如果黑客成功执行了这些语句，他们就能获得数据库或系统的访问权限。有很多方法可以保护数据库免受此类常见的网络攻击。


    ### 拒绝服务(DoS) 攻击


    这也是最常见的网络攻击之一。它通过阻塞提供服务的网络或服务来实施。有大量的机器被用于执行 `DoS` 攻击。`DoS` 攻击的主要目标是破坏服务并暴露系统的漏洞。如果由多台机器进行攻击，则被称为分布式拒绝服务(`DDoS`)
    攻击。


    ### XSS 跨站脚本攻击


    跨脚本攻击(`XSS`) 是一种 Web 应用程序漏洞，在网页中注入了客户端脚本。


    ## 为什么网络安全很重要？


    网络安全在我们社会中的性至关重要。每个组织都需要对其系统进行适当的安全保护。如果没有这些，它们将会崩溃。每家机构也都需要基础的网络安全。事实上，个人也需要基础的网络安全保护，以防止成为想要索索软件或对他们造成伤害的黑客的受害者。


    网络安全可以被视为一种基础设施——一种运行在每个设备和位置上的保护层。在不同系统的世界中，统一系统总是运行良好的。然而，集成需要努力，这可能会留下一些漏洞。


    另一点是，任何东西都不可能是 100% 安全的。这意味着网络安全领域是一个不断增长的领域。新技术和演进几乎每年发生一次，这使得网络安全专家很难让工作变得更加安全。


    ## 本章学到的知识


    *   网络安全涉及保护组织、政府、医疗机构和其他机构免受网络攻击和恶意者的侵害。

    * 处于网络安全核心的是 `CIA` 三要素。它包括机密性、完整性和可用性。

    *   机密性涉及用户的隐私。它是关于在任何代价下维护用户的隐私。它保护敏感信息，并在任何系统中都难以实现。

    * 完整性是第二个 `CIA` 要素，涉及数据在整个生命周期期间的准确性、一致性和可信度。

    *   可用性是第三个 `CIA` 要素，它关于在任何条件或场景下 100% 的系统或数据可用性。

    *   `CIA` 三要素带来了许多挑战。

    * 有许多类型的网络威胁，包括恶意软件、社会工程、高级持续性威胁、勒索软件和钓鱼。

    *   其他常见的网络攻击类型包括 `SQLi` 攻击、中间人(`MITM`) 攻击、`SQLi` 攻击、`XSS` 跨站脚本攻击、拒绝服务(`DoS`)
    攻击。

    *   网络安全攻击很重要，因为它涉及到多个组织、系统以及互联网赖生存的整个生态系统的安全性。


    # 第 5 章：学习 Debian 连接


    Kali Linux 是一个纯正的 Debian 衍生版。Kali Linux 的工作始于 2012 年。学习它与 Debian 的关系很重要，因为这能让你理解它的重要性以及它的工作原理。


    更具体地说，它是基于 Debian Testing 构建的。这意味着你在 Kali Linux 中看到的软件包来自 Debian 仓库——并非全部，但大多数都是如此。然而，不要产生
    Kali Linux 依赖于 Debian 的误解。在软件包选择和分发方面，Kali Linux 有自己的基础设施。用户可以选择他们想要的任何内容，并拥有完全的自由。


    ## 软件包是如何从 Debian 流向 Kali Linux 的


    正如我们已经提到的，软件包从 Debian 发行版流向 Kali Linux。这是妥善过的。


    Debian 每天由贡献者更新。他们更新软件包，并确保软件包更新到不稳定的（unstable）Debian 发行版。一旦软件包上传，它们就会移动到 Debian
    Testing 发行版。在这里，所有的漏洞都会被移除，然后这些软件包就可以发布了。


    Debian testing 是 Kali Linux 的最佳实验场，因为它们的目标是一致的。


    Kali Linux 的贡献者随后通过两步过程来包含这些软件包。


    第一步是将 Kali 软件包强制注入到 `Kali-dev` 仓库中。这可能会破坏仓库，但这是预期的结果。为了使其正常工作，下一步是确保新软件包与旧软件包一起重新编译，使其能够运行。


    Kali Linux 还有一个名为 `Kali-rolling` 的发行版，用户可以使用它来跟踪 `Kali-dev` 发行版发生的所有更改。最终目标是确保在软件包迁移之前满足所有依赖关系。


    ## 如何管理 Debian 的差异？


    差异主要通过减少分支（forked）软件包的数量来管理。这样做是为了确保 Kali 的独特功能被正确实现。上游软件包的修改极少。如果你想了解 Debian
    和 Kali Linux 软件包之间的差异，可以查看它们的 Kali Package Tracker(`https://pkg.kali.org/derivative/kali-dev/`)。


    ## 本章学到的知识


    *   Kali Linux 和 Debian 之间密切相关。

    *   软件包从 Debian 流向 Kali Linux。

    *   Kali Linux 有一个名为 `Kali-rolling` 的发行版，用于处理对发行版软件包的更改。

    *   如果软件包良好，它们会被移动到主 Kali 发行版。


    # 第 6 章：Linux 基础回顾


    作为读者，你可能对 Linux 并不完全了解。如果你想精通 Kali Linux，首先需要熟悉 Linux。学习 Linux 并不困难，如果你学习了它，你就能理解互联网的大部分，因为服务器、Web
    和其他服务都使用 Linux 服务器来运行。


    ## 理解 Linux


    我们可以将 Linux 定义为操作系统，但实际上，它仅仅是一个操作系统内核。内核是文件、库和特性的集合，使操作系统能够运行。它充当软件和硬件之间的介质，并为你提供探索计算机的手段。内核负责管理用户、文件进程、硬件和权限系统。所有与系统相关的活动都运行在环零（ring
    zero）中，也称为内核空间（kernel space）。相反，Linux 还有用户空间（user space），它被定义为内核活动之外的一切活动发生的空间。


    ## 内核驱动硬件


    '
- fmt: '

    The number one task for kernel is to make sure that the hardware works as intended.
    It controls hardware components and configures them. So, if you plug in a USB
    drive, then it is the kernel who will identify the hardware and make it ready
    for use. One more thing that the kernel does is to make the hardware available
    to high-level software. In simple words, it acts as a bridge using a programming
    interface. The clear winner in this is applications as they get access to a virtual
    extension to utilize the resources.


    The new hardware is detected with the help of `/sys/` and `/proc/` virtual file
    systems. The applications, on the other hand, need to access `/dev/` as files
    are created there.


    Everything in Linux is a file. This means that hardware is also represented as
    a file. For example, the disk drives are represented as `/dev/sda`. The partitions,
    on the other hand, are represented as `/dev/sda1`.


    The device files, however, can be of two types, character and block. They are
    defined based on the method of how the information is stored or retrieved. A block
    is fixed in nature, and bytes can be accessed from any given block position. The
    character file, on the other hand, acts as a flow of characters.


    A block file is represented by `b` in front of the permissions, whereas the character
    file is represented by `c`.


    ## A Working File System


    The file system is also at the core of the Linux operating system. It is a feature
    that the kernel offers out of the box. The file system is inherited from the Unix
    kernel. Everything is located within a single directory, and it is known as the
    root. “`/`” character is used to represent the root directory. All the directories
    are contained within the root directory, where it creates a hierarchical tree.


    An example of a subdirectory within the root directory is `/home` directory. The
    home directory contains user-specific files. It is also hierarchical and contains
    more sub-directories and files. So, if you create a file on your desktop, it will
    be stored within the desktop subdirectory present within the `/home` directory.
    The unified file system is used by major Linux distributions allowing easy data
    management. So, for instance, if you know about one Linux distribution, then you
    would be effectively able to use other distribution. It only uses one such hierarchy.
    It doesn’t matter how many disk drives or partitions you are using, it can list
    all the directories and subdirectories in a single hierarchy and under the `/root`.


    If you are using multiple disks, then one disk is assigned as `/root`, whereas
    the other disks are named as `ext2`, `ext3`, and so on.


    ## Process Management


    The kernel is also well-equipped with process management features. Any program
    in its running state is known as a process. The process makes sure that the program
    instance runs as intended. To do so, it uses memory. The kernel, in this case,
    makes sure that it creates and tracks the process. The memory management is also
    done by the kernel while ensuring that there is enough memory for the optimal
    work of the system. Once it allocates the memory, it then loads the executable
    file into the memory and starts running it. To make sure that it can track and
    manage the process, a process identifier(`PID`) is also allocated to the process.


    Linux is a multitasking operating system. This means it is equipped with features
    to manage multiple applications running at the same time. It simply manages the
    memory and processor time allocation for each process, giving the illusion that
    it is multitasking. In general, it only runs one program at a time. Even though,
    in the background, it manages multiple processes in the dormant stage. Once a
    user changes to a background process, then it re-assigns resources to the said
    process.


    ## Command Line: Interface To Talk To Your System


    Command-line is the way you can interact with the system. There are different
    types of terminals, but Kali Linux utilizes the GNOME terminal. To access the
    terminal, you need to press `CTRL + ALT + T`. You can also access the terminal
    by typing “terminal” on the search bar in Kali Linux.


    Once you start your terminal, you can now use commands on it. Let’s start with
    the `ls` command.


    `ls` command lists all the files and directory at the location it is run.


    As you can see, you need to provide input to the command line prompt. Once done,
    `shell` -- a command-line interpreter will then execute the input. In the case
    of Kali Linux, the default shell is `Bash` shell. `Bash` stands for Bourne Again
    Shell. If you see either `$` or `#` at the beginning, it means the shell is waiting
    for your input.


    ## Command Line Basics


    Let’s go through the commonly used Linux commands. These commands will let you
    optimally use the operating system.


    - `pwd` → Show you the current working directory

    - `cd [directory_name]` → use to change directory

    - `cd .` → go back one directory

    - `cd ..` → go back two directories

    - `ls` → list files and folders

    - `mkdir [directory_name]` → create new directory

    - `mv [directory_name]` → move directory

    - `rmdir [directory_name]` → remove directory


    I would also suggest you to read free online tutorials on the Linux command line.
    There are plenty of good tutorials out there that are worth your time. Always
    remember, that without proper working knowledge of Linux, it is next to impossible
    to learn Kali Linux, forget mastering it.


    ## Filesystem Hierarchy Standard


    As we already discussed that the Kali Linux utilizes a unified file system known
    as the Filesystem Hierarchy Standard(FHS). To make sure that you work effectively
    with the Kali Linux OS or any distro, the knowledge of the FHS can help you engage
    with the OS. With this knowledge, you can easily get around Linux OS and know
    the purpose and use of each directory. Let’s list them below.


    - `/boot/`: contains files for the boot process

    - `/dev/`: contains device files

    - `/bin/`: contains basic programs

    - `/etc/`: configuration files

    - `/opt/`: third party applications

    - `/root/`: personal files for administrator

    - `/home/`: home user’s personal files

    - `/media/`: removal devices for mount points

    - `/mnt/`: temporary mount point

    - `/lib/`: basic libraries

    - `/run/`: contains runtime data, gets removed after reboot

    - `/srv/`: server hosted data on system

    - `/sbin/`: contains system programs

    - `/tmp/`: temporary files are stored here

    - `/var/`: variables used by daemons while running. It can include caches, queues,
    spools, and log files.

    - `/sys/` and `/proc/` used by Linux Kernel and is not part of FHS

    - `/usr/`: contains applications and architecture-independent data


    ## Home Directory


    The home directory is also an important part of any Linux OS. However, it doesn’t
    contain any standardized elements, but it does contain some of the interesting
    stuff that you should know.


    The home directory is mostly referred to as “`~`” tilde sign. This makes it easy
    for the user and as well as the command interpreters as they can change the tilde
    sign to the home directory.


    To know the value of the home directory, you need to check the environmental `HOME`
    variable. In most cases, it is set to `/home/user`.


    In the home directory, you can find the application configuration files. Also,
    the files contained within the home directory can be hidden by default. The files
    that are hidden start with `.` (dot), signifying that it is hidden. If you want
    to see all files including hidden files, then you need to use the `ls` command
    with the `-a` option as below.


    ```

    ls -a

    ```


    The configuration files used by programs and services can be multiple files. This
    can lead to issues as to where the configuration files are stored. To ensure that
    this doesn’t happen, XDG Base Directory Specification is followed. This ensures
    that the files have a clean structure attached to it -- the place they are stored.
    For instance, the cache files always need to be stored within `~/.cache`, the
    configuration files in `~/.config`, and so on.


    ## Learning More Useful Commands

