    The last type of cyber attack that we want to discuss is phishing. It is a common
    attack that begins with fake emails. The emails are then used to gather key information,
    including credit card numbers or login information. The best way to protect against
    is to have proper filter mechanisms in the email service.


    Other types of cyberattacks include the following:


    * Man-in-the-middle(MITM) attack

    * SQLi attack

    * Denial-of-service(DoS) attack

    * XSS Cross-Site Scripting attack

    * Distributed denial-of-service(DDoS) attack


    There are other cyber attacks other than the above attacks. The type of attack
    depends on the devices and the network that the hacker is trying to hack.


    Let’s try to explain these types of attack in simple terms below.


    ### Man-in-the-Middle (MITM) Attack


    It is a popular attack that is often used in hacking devices. In this attack,
    a third-party malicious actor gains access to talk between two other parties.
    By doing so, it can steal information and use that information to harm the victims.


    ### SQLi Attack


    In the `SQLi` attack, the hacker tries to execute malicious `SQL` statements on
    the database. If the hacker can execute them successfully, then he gains access
    to the database or the system. There are plenty of ways to protect the database
    against his common cyber-attack.


    ### Denial-of-Service(DoS) Attack


    This is also one of the most common cyber-attacks out there. It takes place by
    jamming a network or service to provide the service. A large number of machines
    are used to carry out `DoS` attacks. `DoS` attack''s main aim is to disrupt service
    and also reveal a weakness in the system. If multiple machines make the attack,
    then it is known as a distributed denial-of-service(`DDoS`) attack.


    ### XSS Cross-Site Scripting Attack


    Cross scripting attack(`XSS`) is a web application vulnerability where the web
    pages are injected with client-side scripts.


    ## Why is Cyber Security Important?


    Cyber security’s importance is paramount in our society. Every organization requires
    proper security to their systems. Without it, they will fall apart. Every institution
    also requires basic cybersecurity. In fact, individuals also need basic cybersecurity
    protection so that they do not become victims to hackers who may want to do Ransom
    or want to cause any harm to them.


    Cybersecurity can be seen as an infrastructure -- a layer of protection that works
    on every single device and location. A unified system always works great in the
    world of different systems. The integrations, however, require work, and that
    can leave some loopholes.


    Another thing is that anything can never be 100% secure. This means that the cybersecurity
    field is always a growing field. New technologies and evolutions take place almost
    every year, which makes it even harder for cybersecurity specialists to make the
    work safer.


    ## Things We Learned in This Chapter


    * Cybersecurity deals with the protection of the organization, governments, medical
    organizations, and other institutions against cyber attacks and malicious actors.

    * There are `CIA` Triad that is at the core of cybersecurity. It includes confidentiality,
    integrity, and availability.

    * Confidentiality deals with the user’s privacy. It is all about maintaining the
    user’s privacy at any given cost. It protects sensitive information and is hard
    to implement in any system.

    * Integrity, the 2nd `CIA` triad, deals with data accuracy, consistency, and trustworthiness
    during the data life cycle.

    * Availability, the third `CIA` triad, is all about 100% system or data availability
    at any condition or scenario.

    * There are many challenges the `CIA` triad brings to the table.

    * There are many types of cyber threats, including malware, social engineering,
    advanced persistent threats, ransomware, phishing.

    * Other types of common cyber attacks include `SQLi` attack, Man-in-the-middle(`MITM`)
    attack, `SQLi` attack, `XSS` Cross-Site Scripting attack, `Denial-of-service(`DoS`)
    attack.

    * Cybersecurity attack is important because it deals with the security of multiple
    organizations, system, and the overall ecosystem in which the internet thrives.


    # Chapter 5: Learning about Debian Connection


    Kali Linux is a genuine Debian derivative. The work on Kali Linux started in 2012.
    Its connection to Debian is important to learn as it will make you understand
    its importance and also understand how it works.


    More specifically, it is based on top of Debian Testing. This means that the packages
    that you see in Kali Linux are from Debian repository -- not all, but most. However,
    do not make the confusion that Kali Linux is dependent on Debian. Kali Linux has
    its own infrastructure when it comes to packaging selection and distribution.
    The user can choose whatever he wants and has the complete freedom to do so.


    ## How Packages Flow From Debian to Kali Linux


    As we already mentioned that the packages flow from Debian distribution to Kali
    Linux. This is done properly.


    The Debian gets updated by contributors daily. They update packages and also ensure
    that the packages get updated to the unstable Debian distribution. Once the packages
    are uploaded, it is then moved to the Debian Testing distribution. This is where
    all the bugs are removed, and the packages are then made available for release.


    Debian testing is the best playground for Kali Linux as their goals are aligned.


    The contributors of Kali Linux then take a two-step process to include the packages.


    The first step is to force-inject the Kali packages to the `Kali-dev` repository.
    This can break the repository, but that’s the expected outcome. To make it work,
    the next step is to make sure that the new packages are recompiled along with
    the old ones to make it work.


    Kali Linux also has a distribution named `Kali-rolling`, which can be used by
    the users to track all the changes that are made to the `Kali-dev` distribution.
    The end goal is to ensure that all dependencies are met before packages are migrated.


    ## How is The Debian Difference Managed?


    The difference is mostly managed by reducing the number of forked package. This
    is done to ensure that Kali’s unique features are implemented correctly. The upstream
    packages are modified minimally. If you want to learn about the difference between
    Debian and Kali Linux packages, you can check out their Kali Package Tracker(`https://pkg.kali.org/derivative/kali-dev/`).


    ## Things We Learned in This Chapter


    * Kali Linux and Debian are closely related.

    * Packages flow from Debian to Kali Linux.

    * Kali Linux has a distribution known as `Kali-rolling` that deals with the changes
    made to the distribution packages.

    * If the packages are good, they are then moved to the main Kali distribution.


    # Chapter 6: Linux Fundamentals Refresh


    As a reader, you might not be completely informed about Linux. If you want to
    master Kali Linux, you first need to be comfortable with Linux. Learning Linux
    is not hard, and if you learn it, you will be able to understand most of the internet
    as servers, web, and other services use Linux servers to operate.


    ## Understanding Linux


    We can define Linux as an operating system, but in reality, it is simply an operating
    system kernel. A kernel is a collection of files, libraries, and features that
    makes an OS work. It acts as a mediator between the software and the hardware
    and provides you the means of exploring your computer. A kernel is responsible
    for managing users, file system processes, hardware, and permission system. All
    the system related activities run in ring zero, which is also known as kernel
    space. On the contrary, Linux also has user space, which is defined as the space
    where everything other than kernel activities takes place.


    ## Kernel Powering Hardware

