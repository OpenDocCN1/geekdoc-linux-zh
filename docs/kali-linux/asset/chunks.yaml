    With time, your network and system will change, and the security concerns will
    shift from one area to the other. Hackers are going to be always on the lookout
    for these vulnerabilities, so you need to be on your toes to make sure all angles
    are well protected and secured from malicious attacks.


    ## Things We Learned in This Chapter


    - Pin-pointing areas in your network which are most vulnerable.

    - Getting into the hacker mindset and understanding how they are going to attack
    your network.

    - Working out a map of all publicly available information on your network, server,
    and host so you can provide extra security.

    - Using tools reinforce security on all system vulnerabilities and weak points.

    - Performing regular scans to maximize protection against cyber attacks.


    # Chapter 13: Kali Linux Tools


    In our previous chapter, we talked about the specific approach and mindset required
    to reinforce our network security. Now here we are going to focus on a more practical
    topic - the different tools that can help us improve our network security.


    We will cover a whole range of tools that can help us perform various security
    tests and scans on our system to detect vulnerabilities and fix them before they
    are exploited by hackers.


    Now the best thing about Kali Linux that it includes tons of powerful security-hacking
    tools which can help you with information gathering, password cracking, hardware
    hacking, reverse engineering, wireless attacks, vulnerability analysis, exploitation
    testing, stress testing, sniffing & spoofing, and so on.


    In fact, if you do a little searching online, you will find there are literally
    hundreds of Kali Linux tools advertised to help you with your network security.
    It can get really confusing when choosing which tools to use on your system to
    detect vulnerabilities and weak points.


    This is why we have put together a list going over some of the best Kali Linux
    Tools in different categories to help you out. We have also made sure to include
    alternatives to a particular category of tools, so you are not completely stripped
    out of options.


    ## [Nmap - The World’s Most Famous Network Mapper Tool](https://nmap.org/)


    The primary feature of `Nmap` is to help you find active hosts inside a network.
    Apart from this, it can also help you with port scanning and can even enumerate
    open ports on the local or remote host.


    And that’s not all; the tool can also collect information regarding the hardware
    and OS used on all connected devices, detect the various applications used on
    the systems along with their version number. You can even extend its functionalities
    by using the `Nmap Scripting Engine`, a.k.a. `NSE`.


    ## [Fierce - Network Mapping & Port Scanning Tool](https://github.com/mschwager/fierce)


    `Fierce` is a popular DNS reconnaissance tool that can help you find hostnames
    and non-contagious IP spaces against a specified domain. As such, you should not
    confuse `Fierce` as an IP scanner, or a DDoS tool. It can’t help you scan the
    whole internet or perform un-targeted attacks.


    However, it can help you locate likely targets both inside and outside a specific
    network, which is one of the reasons why it is mostly used in corporate environments.
    At its core, it is essentially a `PERL` script that can quickly scan domains in
    a couple of minutes, using sophisticated algorithms and clever tactics.


    ## [Unicornscan - Information Gathering & Data Correlation Tool](https://sectools.org/tool/unicornscan/)


    `Unicornscan` is one of the most popular Infosec tools that can help you with
    information gathering and data correlation. It comes with advanced asynchronized
    TCP and UDP scanning features backed by useful network discovery patterns to help
    you locate remote hosts.


    The tool can also collect and showcase information about the software and applications
    running on each of these remote hosts. Other notable features include the option
    to use custom data sets along with support for SQL relational output.


    ## [Wireshark - Network Analyzer](https://www.wireshark.org/)


    `Wireshark` is a cross-platform network analyzer tool that is widely used because
    of its ability to show detailed information about everything going on inside your
    network. It also tags along a very intuitive GUI, which makes it extremely beginner-friendly
    and easy to use.


    Now coming to the feature side of things, the tool offers useful features like
    `Packet Live Capture`, `Offline Analysis`, `Full Protocol Inspection`, `Gzip Compression
    and Decompression`, `VoIP analysis`, and much more. You can also use the tool
    to help you decrypt `WPA/WPA2`, `SSL/TLS`, `IPsec`, and the likes.


    ## [Aircrack-ng - Wireless Security Software Suite](https://www.aircrack-ng.org/)


    With `Aircrack-ng`, you will get access to a complete suite of tools to help you
    assess your network WIFi security. All the included tools are command-line based,
    which means you can do heavy scripting.


    Some of the notable tools available with `Aircrack-ng` can help you capture packets
    of data and export them to text files to get processed by third-party tools. Besides
    this, you also get access to attacking tools that can help you replay attacks,
    create fake access points, perform packet injects, and help with deauthentication.


    ## [Kismet Wireless - Wireless LAN Analyzer, Sniffer, and IDS](https://www.kismetwireless.net/)


    `Kismet` is one of the first choice of security experts looking for Wireless LAN
    Analysis, Sniffers, Wardriving tools, and Wireless Intrusion Detection Frameworks.
    The tool is multi-platform compatible and works with almost any wireless card.


    The tool can be used to work with WiFi interfaces, Bluetooth interfaces, software-defined
    radio hardware, and some other specialized capture hardware. In terms of functionality,
    it can help you identify wireless clients, detect wireless intrusions, and much
    more. You can even configure it to work in the background as you run your assessments
    using other tools.


    ## [John The Ripper - Cryptography Testing Tool](https://www.openwall.com/john/)


    `John The Ripper` is one of the fastest password cracking cryptography tools in
    the market. Right from the start, the tool has been used to help users detect
    weak Unix passwords and has gained a lot of popularity thanks to its high speed
    and great performance.


    The password decryption methods are set automatically based on the detected algorithms.
    The tool also comes with dedicated support for dictionary attacks along with the
    option to define your own dedicated custom dictionary attack lists. The brute
    force attacks can also be customized with your own set of rules.


    ## [BeEF - Browser Exploitation Framework](https://beefproject.com/)


    Browser Exploitation Framework, also known as `BeEF`, is a powerful and popular
    penetration tester mostly used to scan out vulnerabilities and weak links in the
    browser and then exploit those flaws in the host. The tool is primarily focused
    on testing the security of both desktop and mobile browsers. As such, you will
    get access to specific modules that will help you audit the browser security in
    real-time.


    Some of the main noteworthy features of the tool include a dedicated Web User
    Interface, a modular structure in terms of functionality, Metasploit Integration,
    powerful history and gathering intelligence, interprocess communication and exploitation,
    and much more. Also, being a browser exploitation framework, the tool can also
    help you detect any installed plugins on the browser.


    ## [Yersinia - L2 Attacks](https://github.com/tomac/yersinia)


    `Yersinia` is a security framework dedicated for layer 2 Attacks on different
    networks. It can scan out flaws and vulnerabilities in the security protocols
    used by the networks to find points of attack. The tool works with a wide range
    of network protocols, including `CDP`, `DHCP`, `DTP`, `ISL`, `HSRP`, `STP`, and
    `VTP`.

