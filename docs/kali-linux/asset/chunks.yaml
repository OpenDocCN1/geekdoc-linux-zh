    in this case, is stored in package-doc. You can find the documentation package
    while installing it. It will recommend it to you so that you can install it. If
    you are still not able to find the documentation, then you need to search for
    the package website.


    Debian is also proactive in providing documentation for some packages. These documentation
    files are contained within the default place of package documentation. It generally
    does it improve the documentation so that the user can benefit from it.


    ### Docs.Kali.Org: Kali Documentation


    Kali Linux has its official documentation at docs.kali.org. The book we are working
    on includes a lot of stuff about Kali Linux, but it is always important to know
    about Kali Linux documentation. It contains some useful information include tutorials.


    If you open the documentation, you will be able to find that there are a lot of
    things that are covered in the documentation including introduction, USB installation,
    Kali On ARM, Virtualization, Base Images, Containers, Cloud, Windows Subsystem
    for Linux, Tools, General Use, Kali NetHunter Documentation, Troubleshooting,
    Community, Kali Development and Policy.


    All of these categories hold some valuable information.


