    * Type of operating system used

    * Find any possible vulnerability


    Also, you need to make sure that you have all the information in one single place.
    By doing all of this, you will be able to make sense of the data, and also remove
    or separate data that you think is less important.


    ## Gaining Access


    With all our information gathering done, we are now ready to gain access to the
    target system. Until now, we have a good amount of information in our hands. This
    information will help us to gain access. Our information contains network mapping,
    logging information, and other vital information.


    The goal is to take advantage of the vulnerabilities to gain access to the target
    system. If you were successful in finding a vulnerability and use it correctly,
    you should be able to get access to the system.


    However, finding vulnerability is not easy, and you might need to do additional
    penetration testing to find a path. Also, it is the most important aspect of your
    hacking process. Without direct access to the target system, you simply cannot
    do anything. That makes finding vulnerability so important as it gains access
    to the target system.


    So, what methods you can use to gain access? Actually, there are many ways you
    can do so. If you were successful in your social engineering technique, you might
    get a direct username and password to enter the system. That would be awesome!
    However, that’s extremely rare. In most cases, you need to find the vulnerability
    on the application hosted on the system. Otherwise, you need to find the vulnerabilities
    with the system version.


    Few of the techniques that you can use are as follows:


    * Make Denial of Service attack

    * Use Session Hijacking


    Denial of Service attack will not enable you to get access to the system but will
    allow you to expose the vulnerability of the system.


    Once you find at least one vulnerability, you should be able to get into the system.
    However, the time to break in depends on how robust their security system in.
    Most companies invest heavily in their security aspects. They do have white hat
    hackers, and their job is to protect the system at any cost. If they find someone
    accessing the system unauthorized, then they will try to prevent it. It is better
    to be pre-equipped with this type of threat. As a hacker, it goes a long way to
    learn the working time for the white hat hackers and only try to get access to
    the system when you think that there are very minimal chances of you getting caught
    or defined the entry to the system.


    If you are a grey hat hacker yourself, then you might want to report the vulnerability
    to the company. You can also continue with the process and may be reported later
    with more details about the vulnerability. The choice is yours.


    Gaining access can also take some time to accomplish. Most of the hackers give
    up at this point. But, if you are determined, then you will eventually get into
    the system.


    Another thing that you need to keep track of is human errors. They are pretty
    common, and you can find your way by capitalizing on the errors. Humans are prone
    to make mistakes. They lack 100% attention when doing tasks, which results in
    loopholes. These loopholes can be both technical and non-technical in nature.


    ## Maintaining Access


    Once you get access to the system or the network, you now need to maintain access
    to it. This part is as challenging as getting access to the network. The networks/system
    have their own custom-made firewalls which continuously monitor the network for
    any anomalies. Some firewalls come equipped with advanced systems powered by the
    latest technologies. This makes maintaining access to one of the hardest steps
    in the hacking process.


    The best approach is to ensure that you do not get identified as a rogue in the
    system. Also, to maintain access to the system, you need to include a backdoor
    or trojan into the system. A rootkit can also help you keep access to the system
    in the future.


    Another approach is to infect other applications and machines within the network.
    The more infected machines there are, the better you have chances to maintain
    access now and in the future. However, do not go overboard with it. Always maintain
    a low-key and only infect machines in small numbers so that the host system does
    not get suspicious about your presence within the network.


    Once you establish access, now you need to monitor emails, system login information,
    and other important things. You can also monitor the network traffic and modify
    them according to your requirements. The best approach to gather information from
    a particular terminal or machine is to equip it with a keylogger. This way, you
    can get further access to specific accounts, giving you more control over the
    network.


    The goal is to keep yourself hidden within the system for as long as you can.
    You need to be slow and steady in your approach. Initially, you can simply observe
    the different workings of the system. Once you are confident about how the system/network
    work, then you can go and infect the environment.


    ## Clearing the Tracks


    The last step of the hacking process is clearing your tracks. As a hacker, you
    do not want to get exposed, especially if you are doing black hat hacking. We
    already discussed how severe punishments could be, and if you are doing black
    hat hacking, you are exposing yourself to risks. To protect your presence in the
    long run, you need to hide your tracks or at least clear them so that no one knows
    that you ever accessed the system.


    The main goal is to hide from the IT professionals that maintain the system. You
    should also think like a white-hat hacker and protect yourself against his techniques
    of finding you.


    If the white hat team or the IT professional knows that someone is accessing the
    system unauthorized, then they would kick you out of the system, making you lose
    access to the system. This means no future access to the system, as.


    The best approach is to override the log mechanisms of the system. Logs offer
    different information about how the system works. This means you can remove your
    entries from the log. You can automate the system to do so. The logs are commonplace
    for white hat hackers who are looking for anomalies within the system.


    By clearing your tracks, you are ensuring two things:


    * Keeping long access to the system

    * Ensuring you do not get caught and gets prosecuted


    This leads us to the end of our hacking process steps. We went through it as it
    is important to learn Kali Linux. Kali Linux is a penetration testing operating
    system, and even if you are going to be a white-hat hacker, you need to know how
    the hackers work and think.


    ## Things We Learned in This Chapter


    * In this chapter, we learned solely about the hacking process.

    * The five critical steps of a hacking process include Information Gathering,
    Scanning, Gaining Access, Maintaining Access, and Covering Tracks.

    * In the information-gathering step, you need to gather as much information as
    possible using techniques.

    * There are two types of reconnaissance - passive and active.

    * In passive reconnaissance, you can use techniques like social engineering and
    dumpster diving.

    * In the active reconnaissance, you need to use techniques like scanning and tool
    as well.

    * To gain access, you need to find a vulnerability in the system and use it to
    your advantage. You can also use techniques including Denial of Service and Session
    Hijacking to reveal the issues with the system.

    * Once you gain access, you need to maintain Access to it. You can do it by staying
    low, deleting entries in the log files, or installing malware.

    * Lastly, you need to clear tracks so that you can have access to the system in
    the long run.


