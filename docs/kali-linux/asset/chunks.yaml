    该工具还可以帮助你扫描所有注册用户使用的弱密码，并触发暴力破解攻击以查看这些密码是否可以被轻易破解。其他显著特性还包括执行非侵入式安全扫描、WP 用户名枚举以及计划
    WordPress 安全扫描等选项。


    ## [CMSMap - 针对所有流行 CMS 的集中化安全解决方案](https://github.com/Dionach/CMSmap)


    与 WPScan 不同（后者仅是针对 WordPress 网站的安全工具），CMSMap 是一个集中化的多平台安全解决方案，其设计用于不仅支持 WordPress，还支持
    Joomla、Drupal 和 Moodle。


    该工具可以通过运行暴力破解攻击、扫描漏洞以及启动利用程序来突破发现的漏洞，帮助你发现上述所有 CMS 中的安全缺陷。该工具还可以帮助你设置自定义 user-agent
    和标头，支持 SSL，并带有用于调试的专用详细模式（verbose mode）等。


    ## 选择正确的工具并强化你的网络安全


    正如你所看到的，Kali Linux 兼容市场上一些最优秀的伦理黑客和渗透测试工具。不仅如此，你还可以获得一系列不同的以安全为中心的工具，它们也可以在其他许多方面为你提供帮助。


    这些工具可以轻松帮助你快速扫描网络中所有的安全漏洞，并在黑客有时间利用之前修复它们。


    ## 本章我们学到的知识


    - Kali Linux 以其工具集而闻名。

    - 它拥有 600 多个渗透测试工具。

    - `Nmap` - 用于扫描网络。

    - `Fierce` - 它帮助你进行网络映射和端口扫描。

    - `Unicornscan` - 用于收集信息，并提供扫描 UDP 和 TCP 的能力。

    - `Wireshark` - `Wireshark` 是一款跨平台网络分析器。

    - `Aircrack-ng`: 它是一款无线安全软件，带有许多选项和其他小型工具。

    - `Kismet Wireless` - 另一个实用的无线工具，用于嗅探、DIS 和局域网分析。

    - `John The Ripper` - `John the Ripper` 是一个流行的密码测试工具，也用于破解。

    - `BeEF` - 浏览器利用框架。是一种用于寻找利用和漏洞的渗透测试工具。

    - `Yersinia` - 该工具用于 L2 层攻击。

    - `DHCPig` - 该工具用于进行高级网络攻击。

    - `THC Hydra` - 用于暴力破解远程身份认证。

    - `Metasploit framework` - 一套流行的渗透测试套件。

    - `FunkLoad` - 一种用于测试浏览器的网络压力工具。

    - `SlowHTTPtest` - 用于对 HTTP 服务器发起 DOS 攻击。

    - `Inundator` - 一种多线程 IDS 规避安全工具。

    - `Social Engineering Toolkit` - 让你只需点击几次即可发起社会工程攻击。

    - `OpenVas` - 一种网络漏洞扫描工具。

    - `WPScan` - 一种 WordPress 安全审计工具。

    - `CMSMap` - 流行 CMS 的集中化安全解决方案。


    ## 结论


    Kali Linux 是顶级渗透测试工具。如果你对安全或泛黑客感兴趣，那么 Kali Linux 是你应该学习的内容。希望你发现这本书很有用。这本书也适用于那些喜欢
    Linux 生态系统并想要学习不同发行版的人。


    本书试图教你如何利用 Kali Linux 这一优势。我们还涵盖了其他重要主题，如网络安全、黑客流程和 Debian 软件包管理。我们的重点很快转向了 Kali
    Linux 的细节，在其中我们学习了如何配置 Kali Linux。我们还学习了 Debian 软件包管理。


    我们涵盖的一个有趣主题是 Kali Linux 如何与 Debian 紧密相。没有 Debian 的演进，Kali Linux 不会有现在这样成功。Kali
    Linux 也因其提供的工具而闻名。它有数百种可以用于渗透测试的有用工具。由于无法列出每一个工具，我们在书中涵盖了其中几个。每个工具都以其独特的方式非常强大。然而，工具的使用取决于用户本身。你需要发挥创意才能充分利用它的价值。


    你也可以把 Kali Linux 视为工具。如果没有必要的解决问题能力和天赋，你将无法善使用它。那么，我为什么要强调这一点呢？因为在读完这本书后，我希望你尽可能地尝试
    Kali Linux。这将开启新的可能性，并将你的理解提升到一个全新的水平。


    如果你对 Kali Linux 有更大的兴趣，我建议多阅读我们在“Kali Linux 工具”章节中讨论的工具。我还建议为社区做出贡献，让 Kali Linux
    社区变得更加出色！Kali Linux 大程度上是由社区驱动的，任何贡献都能让它更安全、更有用。


    祝贺你完成了本书，并祝你未来的事业好运。


