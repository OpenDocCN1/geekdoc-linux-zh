    # Introduction

    Kali Linux is a community-driven project. You can find tons of communities on
    social media. In fact, there are also local communities that enjoy sharing knowledge
    and helping others when it comes to Kali. Communities are places where you can
    help others, share useful information, and interact with others with similar interests.


    To help you, we are going to list two communities in which you can join and become
    part of it.


    ### IRC Channel on Freenode

    Kali Linux has an IRC channel on Freenode. IRC stands for the real-time chat system.
    This is where you can interact directly with a group of people in real-time. These
    chat rooms are basically channels with a theme attached to them.


    You can connect to the Kali Linux channel on Freenode by opening `chat.freenode.net`
    as IRC server, and then listening to the `6667` port. If it seems too technical,
    you can also use an IRC client, which lets you connect easily to the server.


    We recommend using `irssi` if you are fond of console mode. `Hexchat` is also
    a good option as it offers a graphical interface. If you are not interested in
    downloading any client, then you can check out their web client at `webchat.freenode.net`.


    ### Understanding Rules

    IRC channels are very strict when it comes to rules and regulations. Before you
    join or interact with other members, make sure that you read the rules. If you
    make mistakes, you can get silenced or removed from the server.


    ## Become Part of the Community: Do Bug Reports

    To create a great community, you also need to be an active contributor. One of
    the best and easiest ways to do so is to submit bug reports. These bug reports
    can help developers to solve issues and make Kali Linux even better. As you might
    already know that not all software is free from issues. The same is true for Kali
    Linux.


    By sharing the bug report, you are going to share valuable information with the
    developers, which can then be used by the developers to fix the issue. The more
    information you can provide, the better bug reports become. If it is well-thorough
    and explains the conditions at which you are able to generate it, the chances
    are that your bug report will be read and resolved in a few days.


    ## Things We Learned in This Chapter

    - Kali Linux has an amazing community and documentation

    - It has documentation sources. The packages have their own document manual.

    - You can read the manual pages with the `man` command

    - The format used to structure the documentation is `info`.

    - There is also package-specific documentation you should read if you feel stuck

    - You can find Kali Linux documentation at `docs.kali.org`

    - You can also connect to the IRC channel on Freenode

    - If you join, do not forget to read the rules before communicating.

    - You can also join the Kali Linux community by doing bug reports.


    # Chapter 9: Kali Linux Monitoring and Security

    Kali Linux is an operating system for penetration testers. By default, it is designed
    and created for professional workers. It may sound fun for newbies, but it requires
    careful planning to get the most out of it. In this chapter, we will learn how
    to define a policy, understanding the threats, and then finally discuss packet
    filtering and firewalls. In the end, you will be able to ensure that your system
    remains intact and secure. You will also be able to use the monitoring tool and
    actually design a strategy to secure your site.


    ## Security Policy For The Rescue

    Security doesn’t happen by itself. If you are a security expert, you will know.
    Each organization requires a security strategy to become secure. You need to find
    out the right security policy for your organization. Just going through the currently
    available tools, procedures, or concepts will not help. The security aspects need
    to be configured depending on many conditions. If you try to rush the implementation,
    you are going to fail miserably and put your operating system at risk.


    To ensure that you do not make hasty decisions, you need to find the goal. To
    do so, you need to ask questions and then find answers to them. Let’s go through
    the questions below together.


    - What aspects of your system do you need to protect?

    - What are the threats?

    - Who are the attackers?


    Answering these three questions will give you critical information on how to define
    the security policy. Let’s try to understand each question below.


    - What aspects of your system need to be protected? In this question, you need
    to find out the type of system or data you want to protect. If you identify the
    system or the data, then you need to answer the question of what type of data
    or system you want to protect.

    - When it comes to 2nd question, you need to figure out the threats. The threats
    can be a malicious entity or simply the way the data or system is compromised.
    For example, you may want to protect against malicious actors that try to gain
    entry to the system. When it comes to method, you may want to protect confidential
    data leak, service disruption due to `DDoS`, and so on.

    - Lastly, you need to find figure out the threat types. For example, the threat
    can easily be the user or a third-party malicious entity. In both cases, you have
    to make sure that your system is protected at any cost.


    As a Kali Linux user, you also need to understand that security is not just one-time.
    It can be equated to an ongoing process where you need to work hard towards protecting
    the system constantly. With the system’s evolving every second day, it is common
    for bugs or exploits to go through. This is where hackers get a chance to do harm.
    This makes security one of the hardest things to do.


    In reality, you need to make sure you minimize the risk factor. There will always
    be a slight risk, but it should not be more than acceptable. Depending on the
    system evolution, risks change with time. By ensuring that you cover the constraints
    correctly, you can minimize the risk in a great way.


    That’s why creating a risk model that evaluates all parameters can be of great
    help. Modeling around the risk model is what you need to do. Initially, you need
    to cover the basic minimal parameters. Once they are covered, then you need to
    find the extreme conditions at which the system can be compromised.


    Another important factor is the cost of implementing the security and the risk
    associated with it. There can be instances where protecting risk is not worth
    the cost associated with it. You also need to evaluate the loss if the risk is
    exploited by someone else. If the loss is less than the cost of implementation,
    it is better to leave it as is.


    ## Data Confidentiality

    Data confidentiality is very important. It is the number one priority for anyone
    who wants to protect their system. As a Kali Linux user or any system’s user,
    you need to make sure that your or system’s critical data. This should be your
    top priority, and you should consider this more important than any other security
    concerns. If you do not protect the data, it can land into a malicious entity
    that can harm you in one way or another. The hackers can also erase your data
    or destroy your hard disk or simply can use the information to gain an advantage
    over other computers. This makes data confidentiality a big topic in the security
    world.


    ## Extreme Cases

    Any security policy should consider extreme cases while securing a system or data.
    Extreme cases are those that have low chances of happening and rely on hard exploits
    in any system. Zero-day vulnerability exploits can also be considered within the
    extreme cases as they are fresh and new in their own way. Almost every system
    out there suffers from zero-day vulnerability exploits. Also, not all extreme
    cases can be considered due to the hardness they carry to solve them or simply
    the cost associated with them to solve them. However, few extreme cases should
    be solved depending on the severity it carries.


    ## Approach

