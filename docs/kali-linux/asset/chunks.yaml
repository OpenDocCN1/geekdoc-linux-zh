    The victims can be anyone who is on the internet. There are hundreds of instances
    where hackers hack personal photos and post them on social media, embarrassing
    the said person. The hacker can also blackmail the person. In fact, the number
    one activity that hackers do is identity theft. They hack a person''s account
    and copy all their photos and information. Once they are done, they create a similar
    profile and try to act as that said person. Another common activity is to do credit
    card theft and unauthorized payments.


    ## Things We Learned in This Chapter


    * Hacking is a process of getting access or stealing data to/from a system, process,
    or solution without authorized access.

    * Hacking can also be defined as a creative process of breaking things and gaining
    access to them.

    * There are three types of hackers including black hat hackers, white hat hackers,
    and grey hat hackers

    * Black hat hackers are hackers that choose an unethical path. Their main aim
    is to use exploits to steal data or gain access to a system.

    * White hat hackers(Ethical hackers) work to protect systems, solutions, and services
    from hackers. They follow an ethical route.

    * Grey hat hackers is a middle path between black and white hat hackers. Generally,
    they hack systems, only to inform the organization about the flaw so that it can
    be fixed.

    * There are hacking consequences if you take the unethical road. So, always beware
    of them.

    * Victims can be anyone who gets hampered because of the actions of hackers.


    # Chapter 3: The Hacking Process


    Kali Linux is a hacker tool. If you choose Kali Linux, I hope you know by now
    that you are going to use it for hacking or penetration testing. That’s why you
    need to learn about the hacking process. The hacking process can be applied to
    most of the hacking attempts and can be used as a framework. These steps will
    guide you to become better at hacking(both ethical and unethical).


    The key five steps that are present within a hacking process include the following:


    * Information Gathering (Reconnaissance)

    * Scanning

    * Gaining Access

    * Maintaining Access

    * Covering Tracks


    Let’s go through each of the steps in detail.


    ## Information Gathering(Reconnaissance)


    The very first step that you are going to do is information gathering. It is the
    most important part of the hacking process. And, most of the time, it gets ignored.
    The information-gathering process is known as reconnaissance. In this step, your
    job is to gather as much information as you can — the more useful information
    you have, the better the chance of success of the hacking process. The information
    you gathered in your very first step will help you in all the next four steps,
    including scanning, gaining access, maintaining access, and covering tracks.


    As a hacker or a learner, you may find the information gathering step a little
    boring -- as it has basically no need for the technical tools. Most of the time,
    you have to keep staring at the system and try to find information. You need to
    decide which information is useful to you. In terms of tools, you might need to
    use one. And, when it comes to techniques, there are quite a few of them out there
    that you need to learn.


    ## Types of Reconnaissance


    Reconnaissance can be done in two types. To help you understand the concept, we
    will go through each of them one by one.


    ### Passive Reconnaissance


    In passive reconnaissance, your work is to not interact with the system directly,
    but passively try to gather information. So, if you want to find loopholes in
    a system, you may want to go to the company’s website, learn about who they are
    hiring, understanding what technologies they are using, and so on. By doing so,
    you can learn about the company without trying to interact with the system you
    want to hack.


    To get started, you can use Google to your advantage. There, you can find public
    records. To learn more about the company, you may want to do a `WHOIS` search.
    It will help you know about more data, the hosting they are using, and other important
    details.


    Next, you can also try to research about the client to which the company works
    with. Also, try to find which employees are working on which project or at least
    try to find their most valuable employee. This information might seem insignificant
    but can be game-changing in the later phase of your hacking process.


    Social Engineering is also a great technique that you can use. In social engineering,
    you simply stole the identity of a person and then used the identity to gain information
    from other people. This way, you might get access to a company’s account that
    the employee uses. Social engineering is a very powerful tool, but you should
    be very cautious before you start doing it. If you make a single mistake, your
    cover will be blown, and it will become harder for you to get into the system
    or gather more critical information.


    The best way to approach social engineering is to make fake social media profiles
    and connect with people you think that you can get more information. Social engineering
    can also be done through calls. It might look a little intimidating initially,
    but with practice, you will become more successful in doing so.


    Dumpster Diving is a technique where you look for information from the discarded
    place. You can gain information from the documentation that is dropped in the
    trash can. For example, you can gain access to an ATM slip, and from there, you
    can learn about the person’s transaction information. You can also gain access
    to phone numbers or even bank statements.


    ### Active Reconnaissance


    Active reconnaissance is the complete opposite of passive reconnaissance. It requires
    active engagement with the system. The target needs to be clearly defined, and
    you should actively search for the system. But, active information gathering is
    more challenging than passive ones. One of the ways is to take help from an employee
    of the company. May be asking them to let you go through the normal process of
    using the solution/software. You may also want to go through their documentation(if
    they have any) and try to learn about their system as much as you can.


    With active reconnaissance, you need to do the following:


    * Check if the system responds from external `ping`

    * If the system is not responding to `ping`, then you need to find other ways
    to interact with the system.

    * Work directly with the system by creating accounts, accessing their payment
    system, and more!

    * Try all the different ways to connect with the server. However, be very wary
    of how you do your interaction as it can activate the safety mechanisms of the
    system and flag your identity.


    ## Scanning


    The next step in the hacking process is scanning. The scanning phase includes
    heavy use of tools. The scanning tools will help you further refine the information
    you gather from the reconnaissance phase. As a hacker, you need to use a variety
    of tools, including port scanners, ping tools, sweepers, vulnerability scanners,
    and network mappers. The network scanning is important as it will help you gain
    access to the system(the next step).


    Learning about the list of open ports is also vital, as. It will also inform you
    about more information, including the operating system being used. Also, the response
    type will be different depending on the operating system or the response ports
    that are open on the platform. So, if you are trying to access a Linux based operating
    system, you will get a different response.


    Another technique you need to follow is "sniff" network packets. There are many
    tools out there that will let you do it. However, I recommend you use `Wireshark`,
    the number one tool used to analyze traffic. Once the phase is completed, you
    should be able to understand the whole network structure.


    At the end of the scanning, you have the following things


    * More vital information, mostly technical

    * Proper network map

    * Open ports

