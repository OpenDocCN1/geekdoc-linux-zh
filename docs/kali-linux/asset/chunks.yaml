    ## Kali Linux Features


    Until your installation is done, let’s quickly go through the features, which
    makes Kali Linux a great choice.


    ### Open source


    Kali Linux is licensed under the Open Source model. It brings multiple benefits,
    including the ability to use it for free. The open-source community around Kali
    Linux is also strong, and we also see many developers contributing to it.


    ### Free to use


    Kali Linux is free to use. This makes Kali Linux the number one choice for pen-testers.
    It comes with all the necessary things that you will need to work optimally. All
    of these without paying a single penny.


    ### Penetration testing tools


    Another great feature of Kali Linux is its collection of penetration testing tools.
    It has more than six hundred penetration testing tools! That’s a huge number considering
    the scope of each tool''s capabilities. Also, each tool included in the release
    is unique in its own ways. Tools that replicate or duplicate other tools functionalities
    are eliminated.


    ### FHS compliance


    It follows the Filesystem Hierarchy Standard, which is also used by other Linux
    distros, including Ubuntu distro. As a user, you benefit from it as it allows
    you to carry your FHS knowledge from one distro to another. You do not have to
    re-think where you can find the libraries, binaries or other files.


    ### Custom kernel


    Kali Linux kernel is custom made and includes the latest injection patches. It
    is frequency patched and also developed securely.


    ### Wireless device support


    Not all Linux distros come with wireless support. However, Kali Linux comes with
    wireless device support. It is developed in such a way that it comes equipped
    with hundreds and thousands of devices compatibility.


    ### Language support


    It supports many languages out of the box.


    ### GPG signed


    All the packages used in Kali Linux are GPG signed, which means that the packages
    are secure and are made based on the standard protocols.


    ### Customizable


    Kali Linux is highly customizable from the core. It is developed in such a way
    that it can meet every user requirement. The customization needs to be done on
    top of the kernel.


    All these features make Kali Linux different from other Linux distros. First of
    all, it is a single user, i.e., root. This means that all the critical changes
    can only be made through root user. It also means that it is a single-user operating
    system. This is a good approach considering that most of the tools require high-level
    access. Apart from that, network services come disabled so that you can install
    applications without much difficulty. Lastly, it comes with minimal repositories
    which ensure better system integrity.


    ## Is Kali Linux For You?


    Before we move into learning Kali Linux, we need to learn whether Kali Linux is
    the right choice for you. It is common for learners to choose an operating system
    only to find out that it is not for them. The book is for Kali Linux, but as a
    learner, you should make sure that you really need Kali Linux.


    First of all, Kali Linux is not for normal users. It is an operating system that
    especially for penetration testing. This means if you want to become a security
    specialist or are already a one, you have made the right choice in learning or
    using Kali Linux. However, it is not a good choice for doing other development
    things or using it as a normal day-to-day activity.


    Another thing that makes Kali Linux so amazing is its production value. Only a
