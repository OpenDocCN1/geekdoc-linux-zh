  trans: '

    随着时间的推移，你的网络和系统会发生变化，安全关注点也会从一个领域转移到另一个领域。黑客会时刻寻找这些漏洞，因此你需要保持警惕，以确保所有角度都得到良好的保护并免受恶意攻击。


    ## 本章我们学到的


    - 精准确定你网络中最脆弱的区域。

    - 进入黑客思维，并理解他们将如何攻击你的网络。

    - 梳理你的网络、服务器和主机上所有可用信息的地图，以便提供额外的安全保障。

    - 使用工具加强所有系统漏洞和弱点的安全防护。

    - 定期进行扫描以最大限度地加强对网络攻击的防护。


    # 第 13 章：Kali Linux 工具


    在上一一章中，我们讨论了加强网络安全所需的特定方法和思维。现在，我们将关注一个更具实践意义的话题——可以帮助我们改进网络安全的各种工具。


    我们将涵盖一系列工具，这些工具可以帮助我们对系统执行各种安全测试和扫描，以检测漏洞并在它们被黑客利用之前对其进行修复。


    现在，Kali Linux 最棒的一点在于，它包含了大量强大的安全黑客工具，可以帮助你进行信息收集、密码破解、硬件破解、逆向工程、无线攻击、漏洞分析、利用测试、压力测试、嗅探与欺骗等。


    事实上，如果你在网上稍作搜索，你会发现实际上有数百种旨在帮助你网络安全的 Kali Linux 工具。在选择使用哪些工具来检测系统中的漏洞和弱点时，可能会非常困惑。


    这就是为什么我们整理了一份涵盖不同类别的最佳 Kali Linux 工具列表来为你提供帮助。我们还确保包含了某些特定类别工具的替代方案，以免让你完全没有选择余地。


    ## [Nmap - 世界最著名的网络映射工具](https://nmap.org/)


    `Nmap` 的主要功能是帮助你发现网络内部活动主机。除外，它还可以帮助你进行端口扫描，甚至可以列出本地或远程主机上的开放端口。


    不仅如此，该工具还可以收集有关所有连接设备上使用的硬件和操作系统的信息，检测系统上使用的各种应用程序及其版本号。你甚至可以通过使用 `Nmap Scripting
    Engine`（简称 `NSE`）来扩展其功能。


    ## [Fierce - 网络映射与端口扫描工具](https://github.com/mschwager/fierce)


    `Fierce` 是一种流行的 DNS 侦察工具，可以帮助你针对特定域名发现主机名和非连续 IP 空间。因此，你不应该将 `Fierce` 误认为是 IP
    扫描器或 DDoS 工具。它无法帮助你扫描整个互联网或执行无目标的攻击。


    然而，它可以帮助你定位特定网络内部和外部的可能目标，这也是它主要用于企业环境的原因之一。从核心，它本质上是一个 `PERL` 脚本，可以使用复杂的算法和巧妙的策略在几分钟内快速扫描域名。


    ## [Unicornscan - 信息收集与数据关联工具](https://sectools.org/tool/unicornscan/)


    `Unicornscan` 是最受欢迎的信息安全工具之一，可以帮助你进行信息收集和数据关联。它带有先进的异步 TCP 和 UDP 扫描功能，并由实用的网络发现模式支持，帮助你定位远程主机。


    工具还可以收集并展示运行在这些远程主机上的软件和应用程序信息。其他显著特性还包括使用自定义数据集选项以及对 SQL 关系输出的支持。


    ## [Wireshark - 网络分析器](https://www.wireshark.org/)


    `Wireshark` 是一款跨平台网络分析工具，因为它能够显示你网络内部发生的一切的详细信息而被广泛使用。它还带有一个非常直观的图形用户界面（GUI），对新手非常友好且易于使用。


    在功能方面，该工具提供了许多实用功能，如`数据包实时捕获`、`离线分析`、`全协议检查`、`Gzip 压缩与解压缩`、`VoIP 分析`等。你还可以使用该工具帮助解密
    `WPA/WPA2`、`SSL/TLS`、`IPsec` 等。


    ## [Aircrack-ng - 无线安全套件](https://www.aircrack-ng.org/)


    通过 `Aircrack-ng`，你将获得一套完整的工具来评估你的网络 WiFi 安全。所有包含的工具都是基于命令的，这意味着进行大量的脚本操作。


    `Aircrack-ng` 提供的一些可用工具可以帮助你捕获数据包并将其导出到文本文件中供第三方工具处理。此外，你还可以获得攻击工具，它们可以帮助你执行重放攻击、创建伪造访问点、执行数据包注入并协助取消认证。


    ## [Kismet Wireless - 无线局域网分析器、嗅探器和 IDS](https://://.kismetwireless.net/)


    `Kismet` 是寻找无线局域网分析、嗅探器、车载搜场工具和无线入侵检测框架的安全专家的首选之一。该工具兼容多平台，几乎适用于任何无线网卡。


    该工具可用于 WiFi 接口、蓝牙接口、软件定义无线电硬件以及其他专门的捕获硬件。在功能方面，它可以帮助你识别无线客户端、检测无线入侵等。你甚至可以配置它在你运行其他工具进行评估时在后台运行。


    ## [John The Ripper - 加密测试工具](https://www.openwall.com/john/)


    `John The Ripper` 是市场上最快的密码破解加密工具之一。从一开始，该工具就被用于帮助用户检测弱 Unix 密码，并由于其高效的性能而广受欢迎。


    密码解密方法根据检测到的算法自动设置。该工具还带有专用字典攻击的支持，并允许定义你自己的自定义字典攻击列表。暴力破解也可以根据你自己的规则进行自定义。


