- fmt: "\nIn a vulnerability assessment, you are required to create a simple inventory\
    \ highlighting all the discovered vulnerabilities inside a target environment.\
    \ You will most likely use an automated tool to identify listening services, server\
    \ software, versioning, platform, and so on.\n\nOnce done, you will have to check\
    \ each of them for any known signature of the potential threat of vulnerabilities.\
    \ These signatures include a wide range of data point combinations which include\
    \ but are not limited to:\n\n### A Version of the Operating System\n\nAn outdated\
    \ operating system that hasn’t received a security patch is more likely to have\
    \ more vulnerability.\n\n### Patch Level\n\nMany times, even though a security\
    \ patch is released, the admin hasn’t installed on their system, making it more\
    \ vulnerable.\n\n### Processor Architecture\n\nDepending on what architecture\
    \ the system is based on - `Intel x86`, `Intel x64`, `ARM`, `UltraSPARC`, the\
    \ network might be prone to different vulnerabilities.\n\n### Software Version\
    \ \n\nCertain software versions have security vulnerabilities that can be used\
    \ by hackers to break into an otherwise secure system.\n\nAnd much more.\n\nYour\
    \ job will be to use these data points to create a signature as a part of your\
    \ vulnerability assessment. Now, as you can imagine, the more data points you\
    \ have, the more accurate the signature you will be able to create.\n\n## Compliance\
    \ Penetration Test\n\nNext, we have the Compliance Penetration Test. It is the\
    \ most common type of penetration test as they are using government and industry\
    \ mandated requirements and based on a compliance framework used by that particular\
    \ organization.\n\nNow, as you can imagine, there are tons of industry-specific\
    \ compliance frameworks. A very popular example would be the `PCI DSS` - Payment\
    \ Card Industry Data Security Standard, which is a compliance framework used by\
    \ payment card companies that process retail transactions.\n\nWhile conducting\
    \ a compliance test, you might first have to start with a vulnerability assessment\
    \ as it will satisfy many of base the requirements of most compliance frameworks.\n\
    \n## Traditional Penetration Test\n\nTraditional Penetration Tests, in contrast\
    \ to the previous assessment types, doesn’t start with a scope definition. It\
    \ generally will focus on a goal - for example, you might be required to simulate\
    \ a situation showcasing how much of the network gets compromised if an internal\
    \ user is compromised.\n\nAs such, these types of tests aren’t focused on finding\
    \ and documenting vulnerabilities inside a system. Instead, they focus on certain\
    \ identified issues and stimulates the worst-case scenario that is possible if\
    \ it were to happen.\n\nTechnically, it can get a bit more complicated. Not only\
    \ will you have to find the vulnerabilities, you must follow up its impact by\
    \ using an exploit, and then exploring the level of access the exploit provides\
    \ to ultimately understanding if it can lead to further attacks against the target\
    \ environment.\n\nYou will have to critically review your target environment and\
    \ have to resort to manual searching, out of the box thinking, apart from using\
    \ tools and vulnerability scanners. This generally needs to be done a couple of\
    \ times to make sure that no stone is left unturned.\n\nGenerally, these sorts\
    \ of assessments can be segmented into different phases where you will need to\
    \ use different tools for information gathering, vulnerability discovery, exploitation,\
    \ pivoting and exfiltration, reporting, and so on.\n\n## Application Assessment\n\
    \nWhile the previous assessments involved testing the entire targeted environment,\
    \ an application assessment requires you to focus all your resources on a single\
    \ application. With more organizations putting extra focus on their mission-critical\
    \ apps, this is slowly becoming an extremely popular and important security assessment.\n\
    \nNow, Application Assessments can be conducted in various ways. For example,\
    \ you can use an application-specific automated tool to find potential vulnerabilities\
    \ and security issues in the application. These types of tools use application-specific\
    \ logic to identify unknown issues instead of relying on any known signatures.\
    \ As such, the tools have a built-in understanding of how the application works\
    \ and functions.\n\nAlso, depending on the application assessment, you might be\
    \ required to conduct your tests inside a black box or white box manner:\n\n###\
    \ Black Box Application Assessment\n\nHere, the tool will interact with the application\
    \ without any special knowledge or deep access beyond what a standard user gets\
    \ to experience. This can help you understand how a hacker can break into the\
    \ application from the outside.\n\n### White Box Application Assessment\n\nThis\
    \ is completely opposite with the tool or assessor getting full access to the\
    \ source code as well as administrative access to the platform running the application.\
    \ This type of test helps create a comprehensive review of all the app functionality.\n\
    \nSo which type of application assessment should you use? Well, it depends on\
    \ the goal of the assessment! If you want to know the worst-case scenario when\
    \ the app comes under a focused external attack, then running a black box assessment\
