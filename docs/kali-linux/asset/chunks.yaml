    要使用 SSH，你首先需要确保你的机器已经预装了 `openssh-server`。默认情况下，它是预装的。如果没有安装，你你需要使用 `sudo apt-get
    install` 命令进行安装。有时，SSH 服务也可能被禁用。要让其工作，你需要使用以下命令。


    ```bash

    systemctl start ssh

    ```


    你还可以配置它在开机时启动。要做到这一点，你需要运行以下命令。


    ```bash

    systemctl enable ssh

    ```


    ### 配置 SSH


    默认情况下，SSH 的配置已经足够良好。然而，你可以对其进行配置使其功能更强大。要了解它提供了哪些功能，你可以检查 `/etc/ssh/sshd_config`
    文件中的配置文件。相关文档可以在 `sshd_config(5)` 文件中找到。


    如果你是第一次使用 SSH，你会发现它不允许基于密码的登录。要建立连接，你需要使用 SSH 密钥。SSH 密钥是使用 `ssh-keygen` 生成的。


    如果你希望每个用户都使用 SSH 密钥登录，你需要在配置文件中将 `PassswordAuthentication` 设置为“no”。与其他基于密码的登录相比，这始终是一个更好的选择。


    为了确保更改生效，你需要使用以下命令。


    ```bash

    systemctl reload ssh

    ```


    ### 生成新的 SSH 密钥


    SSH 密钥利用它们自身的加密密钥。它们被存储为 SSH 主机密钥。此外，密钥存储在 `/etc/shh/shh_host_*`。密钥应该保持安全。这意味着你不应该与任何人共享密钥，并应将其放在安全的地方。


    你需要确保的另一件事是创建新的 SSH 密钥。如果你使用 `debian-installer` 安装操作系统或简单地复制了整个磁盘镜像，那么可能会有一些预装的
    SSH 主机密钥。作为用户，你不想使用这些密钥。此外，你还需要重置随之而来的 root 密码。这样，你就能确保密钥不会被他人滥用。


    要生成新密钥，你需要使用以下命令：


    ```bash

    # passwd

    ```


    上述命令将更改密码。


    接下来，你需要使用以下一组命令生成新密钥。


    ```bash

    # rm /etc/ssh/ssh_host_*

    # dkpg-reconfigure openssh-server

    # service ssh restart

    ```


    ## PostgreSQL 数据库配置


    作为 Kali Linux 的活跃用户，你需要使用 `PostgreSQL` - 这是一个数据库服务器。在涉及其他服务或程序时，该服务非常有用。作为用户，你可能永远不需要使用它。为了确保依赖于
    `PostgreSQL` 的服务能够正常运行，你需要使用数据库服务。大多数情况下，它被网络服务使用。


    要启动该服务，你只需要运行以下命令。


    ```bash

    # systemctl start postgresql

    ```


    ### 配置 PostgreSQL


    默认情况下，PostgreSQL 监听 5432 TCP 端口。你可以通过编辑 `postgresql.conf` 文件来更改 PostgreSQL 设置。它运行在名为
    `/var/run/postgreql/.s.PGSQL.5432` 的基于文件的套接上。


    在 `postgresql.conf` 文件中，你可以通过编辑 `port` 指令来更改端口。其他关键指令包括 `listen_address`（更改 PostgreSQL
    监听的地址）以及 `unix_socket_directories`（处理操作过程中创建的文件套接）。


    每当有人从网络连接时，他们可以通过两种不同的方式进行连接。这两种方式如下：


    第一种方法是使用基于文件的套接。这是一个流行的方法，因为它利用 Unix 用户账户登录为 PostgreSQL 用户。这意味着一旦连接，就不再需要额外的身份验证，使其成为最显眼的连接方式。


    另一种方法是简单地通过 TCP 连接使用用户名和密码。在这种方法中，用户名和密码与你的操作系统登录用户名或密码并不相似。


    要更改行为并配置如何进行登录，你可以查看 `pg_hba.conf` 文件，你可以在该文件中定义连接的套接字以及用于身份验证的方法。


    如果你想对数据库有完全的控制权，那么使用第二种方法是一个好主意，因为 `Postgres` 用户具有特殊权限。


    ### 开始创建用户和数据库


    我们的下一步是现在创建一个新的数据库和用户。要创建一个一个用户，你需要使用 `createuser` 命令。删除用户也很简单，你只需要使用 `dropuser`
    命令。如果你对这些命令如何工作感到困惑或需要更多帮助，可以随时使用 `man` 命令阅读它们的手册。


    ## Apache 配置


    我们需要配置的另一个重要服务是 Apache Web 服务器。Kali Linux 预装了 Apache。如果没有安装，你需要安装 `apache2` 包。


    要启动 `apache` 服务，你需要使用以下命令。


    ```bash

    systemctl start apache2

    ```


    我们需要学习一点 Apache，因为大多数应用程序现在都是以 Web 应用程序的形式分发的。通过学习如何使用 Apache，你可以教自己如何在网络上托管你自己的应用程序，或使用其他托管的网络应用程序。


    Apache 具有模块化设计。这意味着你可以通过添加新模块为 Apache 添加功能。此外，并不是所有模块都是预装的，你需要安装它们才能使用。此外，大多数库在本质上是外部的。


    作为 Apache 用户，你将发现已安装的常用模块。默认配置确保了这一点。


    要启用新模块，你需要运行 `a2enmod` 模块启用该模块。你也可以使用 `a2dismod` 禁用模块。


    启用的符号链接存储在 `/etc/apache2/mods-enabled` 中。而实际文件存储在 `/etc/apache2/mods-available/`。


    ### 启用并配置两个重要模块 - PHP 和 SSL


    作为 Kali Linux 用户，你无法关注所有可用模块。这就是为什么我们将检查两个重要的模块，包括 SSL 和 PHP。


    利用 PHP 的 Web 应用程序使用 Apache Web 服务器。它利用 `libapache-mod-php` 包。因此，如果你安装了 Apache，它会自动启用。而另一个包
    SSL 则是建立适当 HTTPS 连接所需要的。它包含在 Apache 2.4 及更高版本中。


    要启用 SSL，你需要使用 `a2enmod`。完成后，你现在需要添加指令，还需要编辑配置文件。


    ## 管理服务


    到目前为止，我们学习了如何在 Kali Linux 上管理某些特定的服务。现在是时候学习如何管理服务了。在启动序列中，Kali Linux 利用 `systemd`
    初始化系统。


    `systemd` 初始化系统也是一个功能齐全的服务管理器。它允许你管理服务，包括启动和监控它们。


    那么，如何管理服务呢？让我们查看下方。


    ```bash

    systemctl list-units

    ```


    `status` 命令提供层级结构输出。你还可以看到不同类型的单元（units）。服务（services）是这些单元的一部分。


    每个服务单元代表每个服务。服务单元是存储在 `/lib/systemd/system/` 中的服务文件。还有两个存储这些服务单元的目录包括 `/etc/systemd/system/`
    和 `/run/systemd/system/`。


    ## 本章学到的知识


    *   Kali Linux 易于配置

    *   你可以使用 `NetworkManager` 或使用 `ifupdown` 命令配置网络。

    *   你也可以利用 `systemd-networkd` 来管理网络。

    *   Unix 组和用户管理也是 Kali Linux 的关键部分


