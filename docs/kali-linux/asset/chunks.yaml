    However, if you want to remove the packages, including the dependent packages
    completely, then you need to use the `APT` command. The command to completely
    purge the package from your system is as below.


    ```

    apt remove package-name

    ```


    The `APT` command also ensures that the user data and configuration files are
    not removed.


    If you want to remove the user data, but no configuration file, then you need
    to use `dpkg` with the `-p` option. For `apt`, you need to use the `apt purge`
    command.


    The `purge` command should be used cautiously as it can remove the user data,
    which cannot be retrieved in any condition.


    # Learning About Package Contents


    If you are curious about how to inspect packages that we got you covered. You
    can look into the contents of the packages by using `apt`, `apt-cache`, and `dkpg`
    packages.


    To read the package files, you need to use the `--listfiles` or `-L` option with
    `dpkg`. The syntax of the command is as below.


    ```

    dkpg --listfiles [package-name]

    ```


    ```

    dkpg -L [package-name]

    ```


    ### Searching For a Particular File


    If you are looking for a particular file within the package, then you can use
    the `--search` option. The syntax for it is as below.


    ```

    dkpg --search [package-name]

    ```


    ```

    dkpg -s [package-name]

    ```


    ### Status of The Package


    To check the status of the package, you need to use the `--status` option. The
    syntax is as below.


    ```

    dkpg --status [package-name]

    ```


    ```

    dkpg -s [package-name]

    ```


    ### Listing the Known Number of Packages


    To list all the packages in the system, you need to use the following command.


    ```

    dpkg --list

    ```


    ```

    dpkg -l

    ```


    Both the commands work the same. You can also provide a wildcard as the third
    parameter to search for a particular package if you want. This will execute the
    search based on the wildcard or the string that you used for searching. The command
    for it is as below.


    ```

    dpkg -l ‘file*.’

    ```


    # Troubleshooting Packages


    Running into problems is a part of working with Kali Linux. That’s why, in this
    section, we will go through troubleshooting.


    ### Problems After an Upgrade


    Upgrading your Linux operating system can sometimes cause issues. It can lead
    to issues including incompatible packages, bugs, or even instability. In those
    cases, you can do the following.


    #### Bug Reports


    As a user, you may want to report the bug. You can also follow the Kali bug tracker
    to know if the bug is already reported or not. If it is not, then you should go
    forward and report it. You should also read the section where we discussed on
    bug reporting. Also, make sure that you do a proper bug report with as much information
    as possible.


    #### Downgrading


    You can also downgrade if needed. Sometimes, it is required to downgrade your
    Kali Linux or the package that you upgraded. You can downgrade if you know the
    old package version. This way, you can use the `APT` command to install that version.
    If you have the old `.deb` file, then also you can downgrade the package. Kali
    Linux or Debian, in general, have the `.deb` file stored in few places.


    `/var/cache/apt/archives/`


    Kali mirror pool directory


    You can also find the old package on [http://snapshot.debian.org](http://snapshot.debian.org)


    # Things We Learned in This Chapter


    * You can install packages using `APT` and `dpkg` tools

    * `APT` stands for Advanced Package Tool(APT).

    * `dkpg` is at the core of handling proper package management

    * `APT` is more advanced as it offers seamless package management

    * With `APT`, you do not have to worry about dependencies.

    * Multiple Kali Linux repositories hold the packages.

    * For normal users, Kali-Rolling Repository is best as it offers tested packages

    * Devs use Kali-Dev Repository.

    * You can get access to the latest package from Kali-Bleeding-Edge repository

    * To install a package, you can use `dkpg` or `APT` command

    * You can upgrade your packages using the `apt upgrade` command

    * You can remove a package using `dkpg` –remove`


    # Chapter 11: Kali Linux And Security Assessment


    In this chapter, we will explore how Kali Linux can help us with the Security
    Assessment. First, let''s familiarize ourselves with what security means in terms
    of an information system. We covered the CIA triad in earlier as well. For a refresh,
    let’s go through them again.


    Mainly, you should concern yourself with three primary attributes:


    * Confidentiality - is your system information secure from authorized access?

    * Integrity - can your system information be changed or modified in a way that
    is not intended or desired?

    * Availability - and finally, is all the data and information on your system readily
    accessible as and when it is required?


    These three factors form the triad of cybersecurity, also known as the CIA. These
    are the areas where you will focus your security concerns as a part of the deployment,
    maintenance, and assessment. With this in mind, let’s move on to discussing how
    to use Kali Linux in a Security Assessment.


    ## Preparing Kali Linux for Security Assessment


    The first thing to make sure is always to use a clean Kali Linux installation.
    Many security professionals without much experience make the novice mistake of
    using the same installation in multiple security assessments. This can cause a
    lot of problems.


    For starters, during the security assessments, you will need to reinstall, tweak,
    and change the system. All these changes will build on one another, increasing
    the overall complexity of future configurations. Furthermore, each assessment
    is unique in its own way, and using the same installation can cause cross-contamination
    of client data.


    However, you can use a pre-customized version of Kali Linux primed for the network/system
    it is assessing. This can, in fact, help automate parts of the process, which
    will lead to more convenient and less time consumption.


    Here are some points to keep in mind while creating your custom installation of
    Kali Linux:


    * Use an encrypted installation as it will protect your data on the physical machine.
    As an extra measure, create a decryption key, send it to the site where you will
    take the machine after completing the assessment and nuke the decryption that
    is with you. That way, even if the device gets stolen, all your data will be safe
    and encrypted.

    * Preplan all the tools and packages you will need during the assessment beforehand.
    During the assessment, it is highly likely that you won''t have ready access to
    the internet. Therefore keep all these packages with you from the get-go.

    * Also, review your network settings before starting with the assessment. Review
    the services that are connected with your assigned IP address and recheck your
    DHCP settings.


    Keeping these few things in mind will help you during and after the security assessment
    to ensure everything is handled smoothly.


    ## The Different Types of Security Assessments


    With your Kali Linux ready to go, it is time you decide what type of security
    assessment you want to conduct on your network. The different types of security
    assessments can be broadly classified into four types: Vulnerability Assessment,
    Compliance Penetration Test, Traditional Penetration Test, and Application Assessment.


    Here we will give you a brief run-down on all these different types of assessments.
    But first, you need to have a clear understanding regarding a vulnerability and
    an exploit.


    ### What Is A Vulnerability?


    It is basically a flaw in the network that a bad actor can use to compromise the
    confidentiality, integrity, and availability of your system information.


    ### What Is An Exploit?


    It is a software, which if and when used, can take advantage of a specific vulnerability
    in the system. In practice, an exploit requires changing a running process and
    forcing it to make unintended actions.


    Now, with the definitions out of the way, here is a look at the different types
    of security assessments:


    ## Vulnerability Assessment

