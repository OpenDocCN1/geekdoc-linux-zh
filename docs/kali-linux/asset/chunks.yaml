    These are the most common point of entry for hackers, and therefore you should
    multiple tests to make sure they are secure and fortified. However, with that
    being said, with more devices connected to your system, you have more vulnerabilities,
    which means you will need to spend more time and resources to check/scan them.


    ## Thinking Like A Hacker


    One of the key aspects of reinforcing security on your system is to think like
    the hacker who is going to break into the system. Whether you are the owner of
    the system, or a security professional hired to protect it, getting admin access
    can blind you from focusing on on the more practical vulnerabilities on your website.


    Most hackers will do some manual research to collect information on your system
    or network before attempting to hack it. As such, if you can limit this sensitive
    information from easy public access, then that will play an extensive role in
    increasing your site’s security.


    The first thing you will need to do is head on over to a search engine, and start
    collecting information about your business to see what can be accessed by the
    regular Joe.


    You can start out by simple keyword-based searches on `Google`. However, hackers
    will perform advanced searches to find more sensitive information to help with
    their attacks. Therefore, you also need to be ready and well aware of all the
    information the hackers can use if you want to have the upper hand.


    Here are somethings that you can search online to see what information is publically
    available:


    * Contact information of people connected to your business - Search Engines like
    `USSearch`, `ZabaSearch`, and `Choicepoint`, and help you find these information.

    * Press Releases that make public any major changes occurring within your company,
    including news of Technology adoption, Company Merger, and so on.

    * `SEC` documents that are available online.

    * Patents or Sensitive Documents available online.


    The Hackers can search for this information and use it to break into your system.
    However, if you go ahead and search out this information beforehand, then you
    already know what information most of the hackers are likely to use to exploit
    your system. The knowledge on what info is being used to orchestrate a cyber-attack
    can be very helpful in mitigating it.


    ## Create A Map Of Publicly Available Information


    Once you have identified the weak links on your network and the most likely information
    the hackers might use to exploit it, it''s time to start protecting things and
    making it more secure. The first thing would be to create a map of the sensitive
    information available on your network.


    A graphical representation of the network and related public information will
    help us better comprehend the network structure, which can help us easily find
    all weak links and potential issues that can happen if it gets exploited. Visual
    network representation is also a great way to find out the footprint the system
    or network is leaving for the users or hackers.


    To begin the process, you will want to head on over to the `Whois` website from
    where you can figure out the domain registrar of the website as well as personal
    information about the website owner, including their names, email addresses, and
    the likes.


    `Whois` can also provide information about the `DNS` server related to a particular
    domain along with information relating to their tech support. You might want to
    take a look at the `DNSstuf` where you should find a lot of information about
    your domain name including:


    * Information regarding how the host handles emails for the domain name.

    * The location of the hosting servers.

    * Generic information regarding the Domain Registrar that can be used by the hackers.

    * Whether or not there is a spam host with the domain name.

    * And so on.


    Now, `Whois` is just one of the site which offers public access to all this information.
    Therefore, it is a good idea to go ahead and check information about yourself
    to understand what hackers are using to break into your system.


    Apart from `Whois`, you can also snoop around `Google Forums` and `Groups`, where
    you are likely to find similarly useful information about your system and network.
    In fact, you might be amazed at the extensive collection of information on these
    pages, even though you haven’t submitted them yourself.


    Someone(including your employees) might have posted a seemingly innocent message
    or post involving your company, but it might have clues and information which
    hackers can use to break into your system.


    However, despite the security concerns it poses, finding and neutralizing this
    is as easy as doing a quick search using your domain name or company name. If
    you find sensitive info, you can either request to remove it from the site or
    take appropriate actions on your end so it can’t be exploited.


    ## Reinforcing All The Weak Links and Vulnerabilities


    Following all the above-mentioned steps, you should be able to find out a chunk
    of useful information which hackers might exploit to break into your system. Now
    it''s time to close off all these vulnerabilities and secure your network.


    ### Step 1


    First, as mentioned earlier, you need to browse around the internet to find publicly
    available sensitive information about your hosting provider, `IP addresses`, and
    so on. However, there is no reason to think all this information is correct. You
    can do a scan yourself to verify the legitimacy of this information.


    If they are wrong, then there is nothing to worry as the hackers will be led down
    a wild goose chase. But if they are correct, you can request the website to remove
    it. But do note that removing `Whois` information about your site can affect your
    business in terms of trustability and some `SEO` metrics.


    ### Step 2


    Now, it''s time to scan your internal hosts and see what parts of your network
    is visible to your users. There is a high likelihood that the hacker might just
    come from within the network, either as a user of your services or via a compromised
    employee account.


    Once you know all the network areas which are exposed to your users, you can exercise
    extra caution to make sure they are well protected. Also, make sure that your
    employees adhere to strict protocol and don’t lose their security credentials.
    Just as an extra measure of security, you can make it compulsory to change their
    passwords every two months or so.


    ### Step 3


    Next, you will want to check out the `ping` utility of the system. This can be
    easily handled by using a third-party tool like `SuperScan`, which can even help
    you get more than one address to ping at a time.


    ### Step 4


    Finally, we would recommend doing an outside scan of your system, going over all
    the ports that are open and vulnerable to cyber threats. `SuperScan` can help
    you here, as well. Alternatively, you can also use a tool like `Wireshark`. It
    goes without saying that once you detect a vulnerable port, it''s time to secure
    it to prevent any malicious attacks.

    '
