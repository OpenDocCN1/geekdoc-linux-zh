    *   一旦你选择了引导式分区，系统会要求你选择分区方案。它包括以下选项：


    1. 所有文件放在一个分区中（针对新用户）

    2. 独立的 `/home` 分区

    3. 独立的 `/home`、`/var` 和 `/tmp` 分区


    由于你是 Kali Linux 的新用户，我们建议使用第一个选项。


    最后，它将为你展示已创建的分区的概述。如果一切看起来都没问题，现在就可以点击“完成分区并将更改写入磁盘”了。


    *   现在选择“是”继续

    *   现在你必须等待安装完成。


    # ARM 安装


    在本节中，我们将讨论如何进行 ARM 安装。ARM 代表高级 RISC （Advanced RISC Machine）。ARM 设备的一些示例包括嵌入式计算机、开发板、笔记本电脑等。


    如果你想在 ARM 设备上安装 Kali Linux，就不能使用我们上面讨论的普通 Kali Linux 安装。对于这些设备，你需要配置内核以使引导程序工作。


    要开始，你需要使用针对 ARM 设备的 Offensive Security 脚本。检查下载链接：[`gitlab.com/kalilinux/build-scripts/kali-arm`](https://gitlab.com/kalilinux/build-scripts/kali-arm)


    对于 ARM 设备，你还需要使用其他安装镜像([`www.offensive-security.com/kali-linux-arm-images/`](https://www.offensive-security.com/kali-linux-arm-images/))


    一旦你下载了镜像和脚本，请按照步骤在基于 ARM 的设备上完成 Kali Linux 安装。


    *   检查和是否与你下载的内容匹配。你可以使用在线提供的校验和工具进行操作。

    *   一旦你确定下载了正确的镜像，就需要根据你的 ARM 设备情况获取存储设备。你还需要确保存储设备至少有 8 GB 的容量。

    *   现在使用 `dd` 将镜像复制到你选择的存储设备。你也可以使用 Rufus 拷贝镜像。

    *   如果你使用 `dd`，需要使用以下命令。

    *   接下来，你需要将存储设备插入你的你的 ARM 设备。

    *   完成后，使用凭据登录：用户 → `root`，密码 → `toor`。连接后，生成新的 SSH 密钥和 root 密码。

    *   你的 ARM 设备现在已可以使用！


    # Kali Linux 特性


    在安装完成之前，让我们快速回顾一下让 Kali Linux 成为极佳选择的特性。


    ### 开源

    Kali Linux 采用开源模型许可。它带来了多处好处，包括可以免费使用。Kali Linux 周围的开源社区也非常强大，我们还看到许多开发者在对其做出贡献。


    ### 免费使用

    Kali Linux 是免费的。这使得 Kali Linux 成为渗透测试人员的首选。它配备了你为了优化工作所需的所有内容，而这一切都无需支付一分钱。


    ### 渗透测试工具

    Kali Linux 的另一个大大特性是它的渗透测试工具合集。它拥有六百多种渗透测试工具！考虑到每个工具的能力范围，这是一个巨大的数字。此外，发布版中包含的每个工具在各方面都是独有的。那些复制或重复其他工具功能的工具已被剔除。


    ### FHS 合规性

    它遵循文件系统层级标准（FHS），其他 Linux 发行版（包括 Ubuntu）也使用该标准。作为用户，你从中受益，因为它允许你将 FHS 知识从一个发行版带到另一个。你不需要重新思考在何处找到库、二进制文件或其他文件。


    ### 自定义内核

    Kali Linux 内核是定制的，并包含了最新的注入补丁。它经过了频率补丁，并且经过安全开发。


    ### 无线设备支持

    并不是所有 Linux 发行版都带有无线支持。然而，Kali Linux 带有无线设备支持。它的开发方式确保了对成百上千种设备的兼容性。


    ### 语言支持

    它开箱即支持多种语言。


    ### GPG 签名

    Kali Linux 中使用的所有包都经过了 GPG 签名，这意味着包是安全的，并且是根据标准协议制作的。


    ### 可定制

    Kali Linux 从内核开始就是高度可定制的。它的开发方式可以满足每个用户的需求。定制需要在内核之上完成。


    所有这些特性使得 Kali Linux 与其他 Linux 发行版与不同。首先，它是单用户模式，即 `root`。这意味着所有关键更改都只能通过 root
    用户进行。这也意味着它是一个单用户操作系统。考虑到大多数工具都需要高级访问权限，这是一个很好的方法。此外，网络服务默认是禁用的，这样你可以很轻松地安装应用程序。最后，它配备了精简的存储库，确保了更好的系统完整性。


    # Kali Linux 适合你吗？


    在我们学习 Kali Linux 之前，我们需要了解 Kali Linux 是否是你的正确选择。学习者选择一个操作系统后发现它不适合自己，这种情况很常见。这本书是关于
    Kali Linux 的，但作为一名学习者，你应该确保你确实需要 Kali Linux。


    首先，Kali Linux 并不适合普通用户。它是一个专门为渗透测试设计的操作系统。这意味着如果你想成为一名安全专家或已经是该专家，那么你在学习或使用 Kali
    Linux 方面做出了正确的选择。然而，对于进行其他开发工作或将其作为日常活动，它并不是一个好选择。


    另一个让 Kali Linux 如此惊人的特性是它的制作价值。只有少数资深人士有权限更新项目。你可以建议新的更改，但由这些资深人士决定是否进行更改。最初，开发者对存储库进行签名，然后由整个团队进行签名。作为用户，这意味着在添加或自定义包时你会受到限制。因此，如果你想添加一个包，你需要花费大量的研究和耐心才能完成。


    那么，这意味着它适合你吗？为了确保你没有走错路，请确保在以下情况下**不要**选择 Kali Linux：


    *   你从未用过 Linux 操作系统。

    *   你不理解基础管理知识，或者完全没有操作系统经验。

    *   如果你认为你会把 Kali Linux 作为日常主系统，用于浏览网页、看视频或游戏等日常活动。


    此外，你应该了解在对网络进行未经授权的渗透测试时涉及的法律条款。如果你做了可能损坏计算机或网络的更改，你可能会遇到麻烦。执法部门对这类活动的打击非常严厉，你应该事先知道，而不是事后才后悔。


    然而，如果你是一个想要让每个人的计算变得更安全的人，那么 Kali Linux 就适合你。你懂得如何使用渗透测试工具，并在进行活动时拥有适当的授权。


    ## 本章学到的知识


    *   Kali Linux 用于渗透测试目的。

    *   它由 Offensive Security 管理。

    *   它提供了一系列优秀的渗透测试和黑客工具。

    *   Kali Linux 的开发始于 2013 年的 BackTrack Linux 项目。

    *   它支持 Metasploit 项目。

    *   它为开发、执行和测试安全漏洞解决方案提供了一个完美的实验场。

    *   安装 Kali Linux 很容易。你可以在 USB 方法（带或不带双引导）和虚拟化方法之间进行选择。


