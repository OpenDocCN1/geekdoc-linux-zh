    本节将进一步列出更多实用的命令，帮助你在 Linux 操作系统中完成更多操作。


    ### 修改和显示文件


    要修改或显示文件，你需要使用 `cat` 命令。该命令可以用于显示文件内容。


    如果你想限制在屏幕上显示的内容，那么则需要配合 `less` 或 `more` 命令使用。要同时运行两个命令，你需要使用管道符（`|`）。它接收上一个命令的输出，并将其作为另一个命令的输入。


    ```bash

    cat file1 | more

    ```


    这将显示 `file1` 的内容，确保你可以一次查看一页。如果你想查看更多内容，可以使用回车键。要关闭操作，可以按下 `CTRL + Z` 并终止它。


    你还可以使用大于号（`>`）将命令或字符串文本存储到文件中。在大多数情况下，当你想要修改文件时，会使用文本编辑器。它可以是 `vi` 或 `nano`。你可以使用
    `vi` 或 `nano` 命令后跟文件名，在相应的文本编辑器中打开文件。


    但是，向文件添加内容最简单的方法是使用 `>` 或 `>>` 命令。`>` 会替换文件的内容，而 `>>` 则将其追加到文件内容之后。


    ```bash

    $ echo “We are learning Kali Linux” > Kali-Linux-Learning.txt

    $ cat Kali-Linux-Learning.txt

    $ We are Learning Kali Linux

    $ echo “we learn every day” >> Kali-Linux-Learning.txt

    $ cat Kali-Linux-Learning.txt

    ```


    我们正在学习 Kali Linux

    我们每天都在学习 Linux


    ### 查找文件


    你可以借助 `find` 命令来搜索文件。它接受你搜索的目录作为输入，后面紧跟文本字符串。


    ### 进程管理


    Linux 操作系统系统的另一个重要部分是进程管理。你可以通过命令行进行进程管理。每个进程都有自己的 `PID`。这意味着很容易管理它们。


    要中断一个进程，你需要使用 `kill` 命令。


    ```bash

    kill [pid]

    ```


    这将发送一个信号并停止或终止该进程。你还可以让命令在后台运行。要做到这一点，你需要在命令后使用 `&`。这将使命令在后台运行，你也将立即获得 shell 本身的访问权限。你还可以使用
    `jobs` 命令查看系统上运行的进程，并根据此进行相应操作。


    如果你想将进程移动到前台，你需要使用 `fg` 命令，它会将后台进程带到前台。此外，一旦进程移动到后台，它就无法被终止。因此，你需要将其移回前台才能终止它。


