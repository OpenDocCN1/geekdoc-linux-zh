    通过学习 `shadow`、`gshadow` 和 `passwd` 的文档，可以理解这些文件格式。


    ### 用户账户创建


    Kali Linux 是一个复杂的操作系统。它高度依赖 `root` 用户来执行大多数任务。然而，在某些情况下，可能需要创建没有 root 权限的用户，特别是当你日常活动中使用
    Kali Linux 的时候。


    要添加用户，你需要使用 `adduser` 命令。


    一旦运行了该命令，它会要求你输入用户名。你可以输入用户名并按回车键完成任务。


    然而，如上方的截图所示，在完成创建新用户的过程之前，它会要求你提供各种信息。它首先创建用户、添加一个新组，并添加一个带组的新用户（ID 为 1000）。组的创建方式与用户名类似。你也可以通过在用户名后添加组名来指定组。`adduser`
    命令接受两个输入：第一个输入是用户名，第二个输入是 `groupname`。


    ```

    adduser [username] [groupname]

    ```


    你也可以通过输入下面的帮助命令来获取更多关于 `adduser` 函数的信息。


    ```

    adduser --help

    ```


    首先，它会要求输入密码。你可以为新用户设置密码。用户在登录会话后可以更改此密码。


    接下来，它会要求你输入更多关于用户的详细信息。你可以选择直接按回车键来跳过这些。。用户在使用其账户后也可以自行输入这些信息。


    `adduser` 命令询问的信息包括：


    - 全名

    - 房间号

    - 工作电话

    -  家庭电话

    - 其他


    如果你仍想了解更多，可以查看 `adduser` 命令使用的配置文件。它存储在 `/etc/adduser.conf` 中。配置文件包含一些你可以学习的有用内容。例如，你会发现定义了用户标识
    (UID) 范围，以确保某些内容是否与组共享。


    此外，你还会注意到它如何在用户主目录中创建目录的。目录结构利用了 `/etc/skel/template` 模板。`adduser` 命令使用模板和配置文件来确保在添加用户时遵循设定的标准。


    ### Getent 命令


    还有一个你应该了解的有用命令，即 `getent` 命令。它代表“get entries”（获取条目），因为它可以查询系统数据库。要做到这一点，它首先调用所需的库函数，然后调用
    NSS（名称服务切换）模块。该模块配置在 `/etc/nsswitch.conf` 中。


    命令的语法如下：


    ```

    getent [database_name] [search_key]

    ```


    因此，如果你想搜索特定用户的密码，可以运行以下查询。


    ```

    getent passwd user1

    ```


    ### 修改或更改账户


    在许多场景下，你可能需要修改账户。包括更改密码或其他账户的其他信息。更改 Linux 账户密码的命令如下：


    #### passwd


    我们将讨论的第一个命令是 `passwd`。这是一个简单易用的命令，允许你更改密码。任何 root 或普通用户都可以使用该命令。运行 `passwd` 不需要
    root 权限。


    在你输入命令后，它会要求你输入密码。在更改密码之前，它会再次要求你重新输入。


    使用该命令会修改 `/etc/shadow` 文件。


    #### chfn


    `chfn` 允许你更改用户的全名。它仅留给超级用户（即 root 用户）使用。


    #### chage


    `chage` 命令用于更改用户的密码过期设置。它只能由管理员使用，用于强制良好的密码习惯。密码本质上是敏感的，因此需要定期修改。如果你想让用户立即更改密码，则需要使用
    `-e` 参数。它将强制用户在下次登录时更改密码。


    ### 禁用账户


    由于许多原因，某些账户需要禁用，包括不遵守规则或账户被他人黑入。为了确保这不会影响你的 Kali Linux 安装，你需要删除该账户，或者在进行调查期间至少将用户无限锁定。要要禁用账户，你需要使用
    `passwd -l` 命令。


    ```

    passwd - l [username]

    ```


    这将锁定账户。这意味着账户文件没有被删除，只是被锁定了。在解锁后可以再次引用它们。作为 Kali Linux 管理员，你应该只使用禁用账户功能以确保在需要时可以恢复账户。此外，某些用户的主目录中可能包含敏感信息。一旦删除的数据无法恢复，因此在删除用户账户之前要考虑后果。


    ### 组管理


    最后，我们将讨论如何管理组。组是任何 Linux 操作系统的关键部分，因为它们实现了组内的文件和文件夹共享。


    你可以使用 `addgroup` 命令添加组。


    要删除组，你可以使用 `delgroup` 命令。


    如果你想修改组，则需要使用 `groupmod` 命令。它允许你使用 GID 或标识符来修改组。


    你还可以使用 `gpasswd` 设置组密码。要移除密码，你需要使用以下命令。


    ```

    gpasswd - r group

    ```


    这标志着我们 Unix 组和用户管理的结束。现在，让我们进入配置服务的阶段。


    ### 配置服务


    服务配置也是 Kali Linux 的重要部分。当我们谈论服务时，通常指的是守护进程（daemons）。它们是在后台持续运行的程序。服务还负责确保系统按预期运行。


    由于后台运行着大量服务，因此不可能讨论每一个。这就是为什么我们将只讨论其中几个重要的服务。让我们开始吧，看看如何配置重要的服务。


    #### 特定程序配置


    在本节中，我们将学习如何配置特定程序。在开始之前，你首先需要了解该程序。做到这一点，你需要正确阅读文档。通常，`README` 文件位于以下位置：→ `/usr/share/doc/package/README.
    Debian`。


    通过阅读文档可以节省时间。通常，软件包配置可能非常具体，而文档确实包含了所需的信息。文档中还可能包含其他你认为有用的资源链接。


    接下来，检查软件的官方文档是一个好主意。


    如果你感到迷茫，应该查看 `dpkg -L package` 命令。该命令将返回文件列表。从那里你可以轻松找到文档。


    另一个有用的命令是 `dpkg -s package`，它显示有关该软件包的元数据。元数据可能包含重要信息，或者仅仅建议其他包含所需信息的软件包。


    此外，你始终可以尝试预运行配置。通过查看配置，你将会有预期，并在文档中找到相应内容。


    配置步骤通过良好的注释也可以自说明易懂。在某些情况下，某些配置文件是通过注释禁用的。通过取消注释，可以让配置文件运行并让软件包执行。


    #### 远程登录 SSH


    SSH 代表安全外壳（secure shell）。它允许用户远程连接到机器。连接后，你可以执行不同的任务，包括执行命令或传输文件。`SSH` 是 Linux
    用户非常熟知的工具。事实上，它被工业级地用于连接远程机器。


    '
- fmt: '

    To use SSH, you first need to make sure that your machine comes pre-installed
    with the `openssh-server`. By default, it comes pre-installed. If it doesn’t,
    then you need to install it using `sudo apt-get install` command. Sometimes, SSH
    services can also be disabled. To make it work, you need to use the following
    command.


    ```bash

    systemctl start ssh

    ```


    You can also configure it to start it with the boot. To do so, you need to run
    the following command.


    ```bash

    systemctl enable ssh

    ```


    ### Configuring SSH


    By default, the SSH comes with good enough configuration. However, if you can
    configure it to make it more functional. To know what it has to offer, you can
    check its configuration file at `/etc/ssh/sshd_config` file. The documentation
    can be found in the `sshd_config(5)` file.


    If you are using SSH for the first time, then you will notice that it doesn’t
    allow password-based logins. To connect, you need to use the SSH keys. The SSH
    keys is generated using the `ssh-keygen`.


    If you want every user to use the SSH key-based login, then you need to set the
    `PassswordAuthentication` to “no” in the configuration file. This is always a
    better option compared to other password-based logins.


    To ensure that the changes are applied, you need to use the following command.


    ```bash

    systemctl reload ssh

    ```


    ### Generating new SSH Keys


    SSH keys utilize their own cryptographic keys. They are stored as SSH host keys.
    Also, the keys are stored in `/etc/shh/shh_host_*`. The keys should be kept safe.
    This means that you should not share the keys to anyone and should be kept in
    a safe place.


    One more thing that you need to make sure is to create new SSH keys. If you installed
    your OS using the `debian-installer` or simply copied the full disk image, then
    there can be some pre-installed SSH host keys. As a user, you do not want to use
    those keys. Moreover, you also need to reset the root password that comes along
    with them. This way, you will make sure that the keys are not being misused by
    someone else.


    To generate new keys, you need to use the following commands:


    ```bash

    # passwd

    ```


    The above command will change the password.


    Next, you need to generate new keys using the following set of commands.


    ```bash

    # rm /etc/ssh/ssh_host_*

    # dkpg-reconfigure openssh-server

    # service ssh restart

    ```


    ## PostgreSQL Database Configuration


    As an active user of Kali Linux, you need to use `PostgreSQL` - a database server.
    The service is very useful when it comes to other services or programs. As a user,
    you may not need to use it ever. To make sure that the services that rely on the
    `PostgreSQL` can run normally, you need to use database service. Mostly, it is
    used by services over the network.


    To start the service, all you need to do is run the following command.


    ```bash

    # systemctl start postgresql

    ```


    ### Configuring the PostgreSQL


    By default, PostgreSQL keeps listening to the 5432 TCP port. You can change the
    PostgreSQL setting by editing the `postgresql.conf` file. It runs on the file-based
    socket known as the `/var/run/postgreql/.s.PGSQL.5432`.


    In the `postgresql.conf` file, you can change the port by editing the `port` directives.
    Other key directives include `listen_address` to change the address to which PostgreSQL
    will listen and the `unix_socket_directories` which deals with the file-based
    sockets that are created during the operation.


    Whenever someone connects from the network, they can connect in two different
    ways. The two different ways are as below.


    The first way is using a file-based socket. It is a popular way as it utilizes
    the Unix user account to log in as a PostgreSQL user. This means that once it
    connects, it requires no further authentication, making it the most obvious way
    of connecting.


    Another way is to use a username and password over a TCP connection simply. The
    username and password, in this method, is not similar to your OS login username
    or password.


    To change the behavior and configure how logins are done, you can check out the
    `pg_hba.conf` file, where you can define the socket for connection, and the method
    that needs to be used for authentication.


    If you want full control over the database, then it is a good idea to use the
    2nd method as the `Postgres` user has special privileges.


    ### Getting Started With User And Database Creation


    Our next step is to create a new database and users now. To create a user, you
    need to use the `createuser` command. Removing a user is also easy. All you need
    to use is `dropuser` command. If you are confused about how these commands work
    or need more help, then you can always use the `man` command to read their manuals.


    ## Apache Configuration


    Another important service that we need to configure is the Apache webserver. Kali
    Linux comes pre-installed with Apache. If it doesn’t, then you need to install
    the `apache2` package.


    To start the `apache` service, you need to use the following command.


    ```bash

    systemctl start apache2

    ```


    We need to learn a little bit of Apache as most of the applications are now distributed
    as web applications. By learning how to use Apache, you can teach yourself how
    to host your own applications on the network or use the other hosted network applications.


    Apache has a modular design. This means that you can add features to Apache by
    adding new modules. Also, not all modules come pre-installed, and you need to
    install it to use it. Also, most of the libraries are external in nature.


    As an Apache user, you will be able to find common modules that come installed.
    The default configuration makes sure of that.


    To enable new modules, you need to run the `a2enmod` module to enable the module.
    You can also disable a module by using `a2dismod`.


    The deabled symbolic links are stored in `/etc/apache2/mods-enabled`. The actual
    files, on the other hand, is stored in `/etc/apache2/mods-available/`.


    ### Enabling and Configuring Two Important Modules - PHP and SSL


    As a Kali Linux user, you simply cannot focus on all the available modules. That’s
    why we will check out two important ones, including SSL and PHP.


    Web applications that utilize PHP use Apache webserver. It utilizes the `libapache-mod-php`
    package. So, if you install Apache, it will automatically get enabled. The other
    package SSL, on the other hand, is required to make a proper HTTPS connection.
    It is included in Apache 2.4 and beyond.


    To enable SSL, you need to use `a2enmod`. Once done, now, you need to add the
    directives, you also need to edit the configuration file.


    ## Managing Services


    Until now, we have learned how to manage some particular services on Kali Linux.
    Now, it is time to learn how to manage services. At the boot sequence, Kali Linux
    utilizes `systemd` for initializing the system.


    The `systemd` init system is also a fully-featured service manager. It lets you
    manage services, including starting and monitoring them.


    So, how do you manage the services? Let’s check it below.


    ```bash

    systemctl list-units

    ```


    The status command gives a hierarchy output. You can also see that there are different
    kinds of units. The services, on the other hand, is part of those units.


    A service unit represents each service. The service units are service file which
    is stored in `/lib/systemd/system/`. There are two other directories in which
    these service units are stored. These include the `/etc/systemd/system/` and `/run/systemd/system/`.


    ## Things We Learned in This Chapter


    *   Kali Linux is easy to configure

    *   You can configure the network by using the `NetworkManager` or using the `ifupdown`
    command.

    *   You can also utilize `systemd-networkd` also to manage the network.

    *   Unix groups and user management is also a critical part of Kali Linux

    '
