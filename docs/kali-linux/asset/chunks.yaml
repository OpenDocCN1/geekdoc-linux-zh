    内核的首要任务是确保硬件按照预期工作。它控制硬件组件并对其进行配置。因此，当你插入一个 USB 驱动器时，是内核识别该硬件并使其准备好就绪。内核做的另一件事是让高层软件可以使用这些硬件。简单来说，它通过编程接口充当桥梁。在这方面，最大的获益者是应用程序，因为它们可以通过虚拟扩展来利用资源。


    新硬件的检测是通过 `/sys/` 和 `/proc/` 虚拟文件系统的帮助完成的。另一方面，应用程序需要访问 `/dev/`，因为文件是在那里创建的。


    Linux 中的一切皆皆为文件。这意味着硬件也被表示为文件。例如，磁盘驱动器被表示为 `/dev/sda`。而分区则被表示为 `/dev/sda1`。


    然而，设备文件有两种类型：字符设备（character device）和块设备（block device）。它们根据信息存储或检索的方法定义。块在本质上是固定的，可以从给定的块位置访问字节。而字符文件则充当字符流。


    块文件在权限位前用 `b` 表示，而字符文件则用 `c` 表示。


    ## 工作文件系统


    文件系统也是 Linux 操作系统的核心。它是内核开箱即用的一个特性。文件系统继承自 Unix 内核。所有内容都位于一个目录内，被称为根目录（root）。“`/`”字符用于表示根目录。所有目录都包含在根目录中，形成了一个层次树结构。


    根目录下的子目录示例是 `/home` 目录。家目录包含用户特定的文件。它也是分层次的，并包含更多的子目录和文件。因此，如果你在桌面上创建一个文件，它将存储在
    `/home` 目录下的桌面子目录中。主要的 Linux 发行版都使用统一文件系统，允许易于数据管理。例如，如果你了解一个 Linux 发行版，那么你实际上就能有效地使用其他发行版。它们只使用这样一种层次结构。无论你使用多少个磁盘驱动器或分区，它都可以在单一层次结构中列出所有目录和子目录，并位于
    `/root` 下。


    如果你使用多个磁盘，则一个磁盘被分配为 `/root`，而其他磁盘命名为 `ext2`、`ext3` 等。


    ## 进程管理


    内核也配备了强大的进程管理功能。任何运行状态下的程序被称为进程。进程确保程序实例按预期运行。为了做到这一点，它使用了内存。在这种情况下，内核确保创建并跟踪该进程。内存管理也由内核完成，同时确保有足够的内存供系统最佳工作。一旦分配了内存，它就会将可执行文件加载到内存并开始运行。为了确保能够跟踪和管理进程，还会为进程分配一个进程标识符（`PID`）。


    Linux 是一个多任务操作系统。这意味着它具备同时管理多个运行应用程序的功能。它简单地管理每个进程的内存和处理器时间分配，产生一种多任务运行的错觉。通常情况下，它一次只一个程序。尽管如此，在后台，它管理着多个处于休眠阶段的进程。一旦用户切换到后台进程，它就会为该进程重新分配资源。


    ## 命令行：与系统交互的界面


    命令行是你与系统交互的方式。有不同类型的终端，但 Kali Linux 利用 GNOME 终端。要访问终端，你需要按下 `CTRL + ALT + T`。你也可以在
    Kali Linux 的搜索栏中输入“terminal”来访问终端。


    一旦启动了终端，你现在就可以上面使用命令了。让我们从 `ls` 命令开始。


    `ls` 命令列出运行所在位置的所有文件和目录。


    如你所见，你需要向命令行提示符提供输入。完成后，`shell`——一个命令行解释器——将执行该输入。在 Kali Linux 中，默认的 shell 是 `Bash`
    shell。`Bash` 代表 Bourne Again Shell（再次伯恩 壳）。如果你在开头看到 `$` 或 `#`，意味着 shell 正在等待你的输入。


    ## 命令行基础


    让我们来看一下常用的 Linux 命令。这些命令将让你能够优化地使用操作系统。


    - `pwd` → 显示你当前的工作目录

    - `cd [directory_name]` → 用于切换目录

    - `cd .` → 返回上一级目录

    - `cd ..` 返回上两级目录

    - `ls` → 列出文件和文件夹

    - `mkdir [directory_name]` → 创建新目录

    - `mv [directory_name]` → 移动目录

    - `rmdir [directory_name]` → 目录


    我还会建议你读一读关于 Linux 命令行的免费在线教程。那里那里有很多优秀的教程值得你花时间。始终记住，如果没有适当的 Linux 工作知识，学习 Kali
    Linux 几乎是不可能的，更不用说精通它了。


    ## 文件系统层次结构标准


    正如我们讨论过的，Kali Linux 利用了名为文件系统层次结构标准（FHS）的统一文件系统。为了确保你能有效地与 Kali Linux OS 或任何发行版工作，FHS
    的知识可以帮助你与操作系统交互。有了这些知识，你可以轻松地遍历 Linux 操作系统并了解每个目录的用途和用法。让我们列出它们：


    - `/boot/`: 包含启动过程的文件

    - `/dev/`: 包含设备文件

    - `/bin/`: 包含基础程序

    - `/etc/`: 配置文件

    - `/opt/`: 第三方应用程序

    - `/root/`: 管理员的个人文件

    - `/home/`: 用户的个人文件

    - `/media/`: 设备挂载点路径

    - `/mnt/`: 临时挂载点

    - `/lib/`: 包含基础库

    - `/run/`: 包含运行时数据，重启后会删除

    - `/srv/`: 系统托管的服务数据

    - `/sbin/`: 包含系统程序

    - `/tmp/`: 临时文件存储在此处

    - `/var/`: 守护进程运行时使用的变量。包括缓存、队列、池和日志文件。

    - `/sys/` 和 `/proc/`: Linux 内核使用，不属于 FHS

    - `/usr/`: 包含应用程序和体系无关的数据


    ## 家目录


    家目录也是任何 Linux 操作系统的重要部分。然而，它不包含任何标准元素，但确实包含了一些你应该知道的有趣内容。


    家目录通常被称为“`~`”波浪号。这对用户以及命令行解释器来说都很方便，因为可以将波浪号替换为家目录。


    要获取家目录的值，你需要检查环境变量 `HOME`。在大多数情况下，它设置为 `/home/user`。


    在家目录下，你可以找到应用程序配置文件。此外，家目录下包含的文件默认是的。隐藏文件以 `.`（点）开头，表示它是隐藏的。如果你想看到包括隐藏文件在内的所有文件，你需要使用
    `-a` 参数使用 `ls` 命令，如下：


    ```

    ls -a

    ```程序和服务使用的配置文件可能是多个文件。这会导致配置存储位置的问题。为了确保避免这种情况，遵循了 XDG 目录规范。这确保了文件有一个整洁的结构——它们存储的位置。例如，缓存文件始终需要存储在
    `~/.cache` 中，配置文件存储在 `~/.config` 中，以此此类推。


    ## 学习更多实用命令


