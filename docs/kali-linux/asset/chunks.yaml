- fmt: "\n# Installing Kali Linux Using USB-Method\n\nInstalling Kali Linux to a bare-bone\
    \ machine with no pre-installed operating system is easy. All you need is to make\
    \ a bootable pen-drive or use a DVD installation drive. To make a bootable pen-drive,\
    \ you need to follow the steps mentioned below.\n\n* Download the Kali Linux ISO\n\
    * Now, download `Rufus`.\n* Once you downloaded `Rufus`, install it on your machine.\
    \ In case you do not have a working machine, you should take help from a colleague\
    \ or a friend who can do it for you.\n* Now, turn on `Rufus`, and it will look\
    \ below.\n\n![](Images/image00144.jpeg) \n\n* Your Pendrive will showcase in the\
    \ device section. In boot selection, you need to select the Kali Linux image.\
    \ To do so, you need to click on `SELECT` and then choose the downloaded Kali\
    \ Linux. In the partition scheme, you should leave it at `MBR`. The target system\
    \ should be “BIOS or UEFI.”\n* When it comes to advance drive properties, you\
    \ can leave the default settings as it shows.\n* Once every setting is set correctly,\
    \ click on the `Start` button.\n* Now, wait for `Rufus` to complete the process.\n\
    \nWith the USB drive ready, you now need to boot from it. All you now to do is\
    \ follow the installation steps, as shown by the installation wizard.\n\n## Dual\
    \ Boot Kali Linux Installation\n\nDual-booting Kali Linux is very similar to the\
    \ above process. Here, you need to make sure that you have enough room for installing\
    \ the Kali Linux. A different partition(even on the same hard disk) will work.\
    \ However, if you lack space, then you need to use a tool known as `GParted`.\
    \ The tool gives you the ability to shrink the Windows installation and make space\
    \ for the Kali Linux installation. To do a proper dual boot Kali Linux installation,\
    \ you need to follow the steps mentioned below:\n\n* You first need to boot from\
    \ your USB drive or the choice of your medium installation. Once you are in the\
    \ Kali Linux boot screen, you now need to select “Live.” This will book the Kali\
    \ Linux default desktop.\n* From there, you need to launch `GParted` program.\
    \ The `GParted` program is useful in shrinking Windows partition. With this, you\
    \ can successfully install Kali Linux in limited space.\n* Once `GParted` starts,\
    \ you need to select the Windows partition and then right-click on it. Then click\
    \ on “Resize/Move.” Make sure that you have 20 GB of installation size for Kali\
    \ Linux.\n* After you select the changes, now click on “Apply All Operations.”\n\
    * Once it is completed, now you need to boot the Kali Linux again and select the\
    \ `Guided -- use the largest continuous free space as the partition disk`.\n*\
    \ After the installation is done, the system will reboot, and you can finally\
    \ boot into Kali Linux using a `GRUB` boot menu.\n\n## Installing Kali Linux on\
    \ Hyper-V\n\nNow, we will learn how to install Kali Linux on `Hyper-V`. This is\
    \ my recommendation when it comes to learning Kali Linux. Remember, this book\
    \ focuses on learning Kali Linux, and it is best to virtualize.\n\n### Enabling\
    \ Hyper-V On Your Machine\n\nHyper-V offers virtualization in the Windows environment.\
    \ To enable `Hyper-V`, you need to have the following requirements.\n\n* A `SLAT`(Second\
    \ Level Address Translation) supported 64-bit CPU.\n* Virtualization support.\
    \ Basically, it should be `SVM` mode for Ryzen chips and `VT-c` for Intel chips.\n\
    * 4 GB minimum RAM.\n\nEven though virtualization is supported on your machine,\
    \ it needs to be enabled first before you use it. To enable it, you need to go\
    \ to your BIOS and enable virtualization. I am using a decent mid-range rig with\
    \ `AB350` and `Ryzen 1600`. For my machine, I have to go to the CPU advanced feature,\
    \ and then enable the `SVM` mode there. In cases where virtualization still doesn’t\
    \ work on your system, you need to allow the enforced hardware Data Execution\
    \ Prevention setting in your BIOS.\n\nTo check if your machine is now virtualization\
    \ ready, especially for using `Hyper-V` solution, run the following command.\n\
    \n* Run command prompt\n* Run `systeminfo.exe` command on the command prompt\n\
    * Press Enter\n\nYou will see a positive reply from the command.\n\nEnabling hardware-based\
    \ virtualization is not enough. Windows, by default, doesn’t run the `Hyper-V`\
    \ modules. To allow them to, you need to go to the Control Panel and search for\
    \ the “Turn Windows Features on or off.”\n\nThere you will find the `Hyper-V`\
    \ option, along with two options: `Hyper-V Platform` and `Hyper-V Management Tools`.\
    \ Enable both the options and click OK to proceed.\n\nOnce done, you need to reboot\
    \ and then move on to the actual installation process.\n\n### Starting Installation\
    \ Process\n\n* For this, we recommend going through the `Quick Create` option.\
    \ Once you open `Hyper-V`, you will find the `Quick Create` option from the menu.\n\
    * You will then be greeted with the `Create Virtual Machine` window. There you\
    \ will find few options, including `Ubuntu 18.04.3 LTS` and `Ubuntu 19.04`.\n\
    * Here you need to click on the “Local installation source” first and then move\
    \ to “Change installation source.”\n* From there, select the Kali Linux ISO. Also,\
    \ untick the “This virtual machine will run windows option.”\n* Once done, click\
    \ on the `Create Virtual Machine` button.\n* It will then prompt you to Connect\
    \ to your New Virtual Machine. Close the prompt and then right-click on the New\
    \ Virtual Machine you just created and chose “Setting.”\n* Now, from there, go\
    \ to the `SCSI` connector and then choose a hard drive.\n* From here, you need\
    \ to click on `New` if you want to change the location of your virtual disk. This\
    \ is important as `vhdx` file is stored within `C:` drive.\n* Click on `Connect`.\
    \ Once done, you will now see the Kali Linux Boot Menu, as shown below.\n\n![](Images/image0145.jpeg)\n\
    \nHere you can see the Live system option. The live system option is useful for\
    \ testing out the need for installation. This makes working Kali Linux a good\
    \ idea.\n\nTo start the installation, you need to press Enter on start installer\
    \ option. Once done, it will start the installation using the installation wizard.\n\
    \nA glimpse of what steps it will follow is below.\n\n![](Images/image0146.jpeg)\n\
    \nLet’s list the steps below to ensure proper installation.\n\n* Select the language\
    \ of your choice for the installation process. It will also ask you the language\
    \ choice for the installed system. We are going to choose English for both options.\n\
    * Select your location, depending on where you stay.\n* It will then ask you to\
    \ configure the keyword. Choose the keyboard layout that you like.\n* After that,\
    \ it will load installer components from the source. In our case, it is an ISO.\
    \ The wizard will also configure the network.\n* Once done, you need to choose\
    \ a hostname for your system. It is a single word hostname. It will automatically\
    \ pick Kali as the hostname, and we recommend you to use it as it will help you\
    \ to follow the book contents easily. It will also ask you to choose a domain\
    \ name. The hostname is optional.\n* Now, you need to choose a root password.\
    \ Root passwords are a must, and you need to make sure that you choose one before\
    \ you proceed. Now, choose a strong password that is hard to guess or crack. Also,\
    \ make sure that you do not forget the password later on as it will make your\
    \ Kali Linux inaccessible.\n* It will now ask you to set your time zone.\n* Now,\
    \ it comes to configure your partition disks. Kali Linux or any Linux installation\
    \ has a different file system, and hence, they might seem completely different\
    \ from any other OS installation, especially Windows OS installation. To make\
    \ sure that you do not have to do much, you can choose `Guided - use entire disk`\
    \ option. As we are using virtualization, we do not have to worry about partitions\
    \ as `Hyper-V` has already allocated a unique hardware location for our OS installation.\n"
  raw: '## Installing Kali Linux Using USB-Method


    Installing Kali Linux to a bare-bone machine with no pre-installed operating system
    is easy. All you need is to make a bootable pen-drive or use a DVD installation
    drive. To make a bootable pen-drive, you need to follow the steps mentioned below.


    *   Download the Kali Linux ISO


    *   Now, download Rufus.


    *   Once you downloaded Rufus, install it on your machine. In case you do not
    have a working machine, you should take help from a colleague or a friend who
    can do it for you.


    *   Now, turn on Rufus, and it will look below.


    ![](Images/image00144.jpeg) 


    *   Your Pendrive will showcase in the device section. In boot selection, you
    need to select the Kali Linux image. To do so, you need to click on SELECT and
    then choose the downloaded Kali Linux. In the partition scheme, you should leave
    it at MBR. The target system should be “BIOS or UEFI.”


    *   When it comes to advance drive properties, you can leave the default settings
    as it shows.


    *   Once every setting is set correctly, click on the Start button.


    *   Now, wait for Rufus to complete the process.


    With the USB drive ready, you now need to boot from it. All you now to do is follow
    the installation steps, as shown by the installation wizard.


    ## Dual Boot Kali Linux Installation


    Dual-booting Kali Linux is very similar to the above process. Here, you need to
    make sure that you have enough room for installing the Kali Linux. A different
    partition(even on the same hard disk) will work. However, if you lack space, then
    you need to use a tool known as GParted. The tool gives you the ability to shrink
    the Windows installation and make space for the Kali Linux installation. To do
    a proper dual boot Kali Linux installation, you need to follow the steps mentioned
    below:


    *   You first need to boot from your USB drive or the choice of your medium installation.
    Once you are in the Kali Linux boot screen, you now need to select “Live.” This
    will book the Kali Linux default desktop.


    *   From there, you need to launch GParted program. The GParted program is useful
    in shrinking Windows partition. With this, you can successfully install Kali Linux
    in limited space.


    *   Once GParted starts, you need to select the Windows partition and then right-click
    on it. Then click on “Resize/Move.” Make sure that you have 20 GB of installation
    size for Kali Linux.


    *   After you select the changes, now click on “Apply All Operations.”


    *   Once it is completed, now you need to boot the Kali Linux again and select
    the Guided -- use the largest continuous free space as the partition disk.


    *   After the installation is done, the system will reboot, and you can finally
    boot into Kali Linux using a GRUB boot menu.


    ## Installing Kali Linux on Hyper-V


    Now, we will learn how to install Kali Linux on Hyper-V. This is my recommendation
    when it comes to learning Kali Linux. Remember, this book focuses on learning
    Kali Linux, and it is best to virtualize.


    ### Enabling Hyper-V On Your Machine


    Hyper-V offers virtualization in the Windows environment. To enable Hyper-V, you
    need to have the following requirements.


    *   A SLAT(Second Level Address Translation) supported 64-bit CPU.


    *   Virtualization support. Basically, it should be SVM mode for Ryzen chips and
    VT-c for Intel chips


    *   4 GB minimum RAM.


    Even though virtualization is supported on your machine, it needs to be enabled
    first before you use it. To enable it, you need to go to your BIOS and enable
    virtualization. I am using a decent mid-range rig with AB350 and Ryzen 1600\.
    For my machine, I have to go the CPU advanced feature, and then enable the SVM
    mode there. In cases where virtualization still doesn’t work on your system, you
    need to allow the enforced hardware Data Execution Prevention setting in your
    BIOS.


    To check if your machine is now virtualization ready, especially for using Hyper-V
    solution, run the following command.


    *   Run command prompt


    *   Run systeminfo.exe command on the command prompt


    *   Press Enter


    You will see a positive reply from the command.


    Enabling hardware-based virtualization is not enough. Windows, by default, doesn’t
    run the Hyper-V modules. To allow them to, you need to go to the Control Panel
    and search for the “Turn Windows Features on or off.”


    There you will find the Hyper-V option, along with two options: Hyper-V Platform
    and Hyper-V Management Tools. Enable both the options and click OK to proceed.


    Once done, you need to reboot and then move on to the actual installation process.


    ## Starting Installation Process


    *   For this, we recommend going through the Quick Create option. Once you open
    Hyper-V, you will find the Quick Create option from the menu.


    *   You will then be greeted with the Create Virtual Machine window. There you
    will find few options, including Ubuntu 18.04.3 LTS and Ubuntu 19.04.


    *   Here you need to click on the “Local installation source” first and then move
    to “Change installation source.”


    *   From there, select the Kali Linux ISO. Also, untick the “This virtual machine
    will run windows option.”


    *   Once done, click on the “Create Virtual Machine” button.


    *   It will then prompt you to Connect to your New Virtual Machine. Close the
    prompt and then right-click on the New Virtual Machine you just created and chose
    “Setting.”


    *   Now, from there, go to the SCSI connector and then choose a hard drive.


    *   From here, you need to click on “New” if you want to change the location of
    your virtual disk. This is important as, by default, the vhdx file is stored within
    the C: drive.


    *   Click on “Connect.” Once done, you will now see the Kali Linux Live Boot Menu,
    as shown below.


    ![](Images/image00145.jpeg)


    Here you can see the Live system option. The live system option is useful for
    using the Kali Linux without the need for installation. This is okay for testing
    out a feature, but it is not user-friendly as it doesn’t save the work environment
    settings or the work you have actually done. This makes working with installed
    Kali Linux a good idea.


    To start the installation, you need to press Enter on start installer option.
    Once done, it will start the installation using the installation wizard.


    A glimpse of what steps it will follow in the install process is as below.


    ![](Images/image00146.jpeg)


    Let’s list the steps below to ensure proper installation.


    *   Select the language of your choice for the installation process. It will also
    ask you the language choice for the installed system. We are going to choose English
    for both options.


    *   Select your location, depending on where you stay.


    *   It will then ask you to configure the keyword. Choose the keyboard layout
    that you like.


    *   After that, it will load installer components from the source. In our case,
    it is an ISO. The wizard will also configure the network.


    *   Once done, you need to choose a hostname for your system. It is a single word
    hostname. It will automatically pick Kali as the hostname, and we recommend you
    to use it as it will help you to follow the book contents easily. It will also
    ask you to choose a domain name. The hostname is optional.


    *   Now, you need to choose a root password. Root passwords are a must, and you
    need to make sure that you choose one before you proceed. Now, choose a strong
    password that is hard to guess or crack. Also, make sure that you do not forget
    the password later on as it will make your Kali Linux installation inaccessible.


    *   It will now ask you to set your time zone.


    *   Now, it comes to configure your partition disks. Kali Linux or any Linux installation
    has a different file system, and hence, they might seem completely different from
    any other OS installation, especially Windows OS installation. To make sure that
    you do not have to do much, you can choose Guided - use entire disk option. As
    we are using virtualization, we do not have to worry about partitions as Hyper-V
    has already allocated a unique hardware location for our OS installation.'
