- fmt: '

    Systems can be complex in nature. That makes creating system policy a tricky thing.
    However, there is an approach that can simplify the process. As a user, you can
    create security policies for subsystems. This segmentation needs to be used to
    ensure that you can do slowly and steadily. It will also help you understand the
    constraints and requirements of each subsystem and then do a proper risk assessment
    depending on the broad security policy and needs.


    Also, it is always easy to defend your system against small types of attacks.
    There are already established means of protecting your system against those. However,
    large attacks are where you should spend most of the time. In the end, you need
    to make sure that the data is protected at any cost.


    One last thing that you also need to make sure is to define your firewall rules
    depending on the traffic you receive.


    ## Security Measures


    So, what are the security measures you can do to secure Kali Linux? Let’s go through
    the options below.


    ### Laptop Security


    If you are using a laptop as a penetration tester, then you have to protect yourself
    from risks associated with personal computers. As you are not on the public server,
    you at least do not have to worry about people who use scripts to hack into the
    system. As you are not connected to the network, you are almost safe from network-based
    attacks.


    The real challenge is to protect your laptop from others who are around you. There
    can be a chance that authorities can seize your laptop, and you might not want
    them to read through the contents of your laptop. To make sure that they do not
    do it, you need to use full-disk encryption. If you are serious about data or
    other information within your laptop, then you can also go with the nuke option.
    If you have a `nuke option`, then it simply removes all the data from the laptop
    with a combination.


    Apart from the data safety, you also need to make sure that you have proper firewall
    protection if you connect to the internet. This will provide you unwanted access
    by others. Configuring the firewall rules is important here. Just make sure that
    you only filter the traffic that you need.


    ### Server Setup Protection


    Kali Linux on a public server is different from that of the laptop. Here, you
    need to have more security and ensure that you keep your login username and password
    secure. Also, you need to use the firewall every time you connect. One more thing
    to ensure is the generate a strong password for the users that you generate. Make
    sure that passwords are strong enough so that they do not get hacked from brute-force
    attacks.


    ## How To Secure Network Services


    Kali Linux comes with a plethora of services. As a good rule of thumb, do not
    active the services that you do not need. Simply disable them. Even if you do
    not disable them, Kali Linux disables them for you.


    Apart from it, you need to make sure that no firewall is running by default. If
    a firewall is running by default, then it means that it is listening to network
    interfaces that you do not want.


    Also, some of the services running on the public server might not require any
    authentication to connect or discover. As a Kali Linux user, you need to make
    sure that the authentications are enabled and set a good password for them to
    discover you. The key here is to implement privacy in the best possible way. You
    may also want to disable services that require root access to run. If someone
    gets access to those services, they can simply gain access to your Kali Linux
    installation.


    ## Getting Your Firewall To Work: Packet Filtering


    You can protect your Kali Linux setup with a firewall. Firewall can be of three
    types, hardware or software or both. Its work is to filter packets and ensure
    that they meet a certain condition. If you are a part of the network, you can
    also use a filtering network, which saves the whole network. Network firewalls
    have their own dedicated machines considering that they need to do a lot of work
    filtering packets.


    However, as a Kali Linux user, your main job is to protect your local installation
    than that of a network. The good news is that Linux comes with its own firewall
    solution. It is the `Netfilter` firewall. But, there is one caveat that you need
    to take care of. You simply cannot just turn it on and leave it. You need to configure
    `Netfilter` according to your network requirement.


    `netfilter` firewall can be configured using the `ip6tables` and `iptables` commands.
    The `ip6tables` command is used to configure an IPv6 network, whereas the IPv4
    network can be configured by the `iptables` command.


    You can also use the GUI-based `fwbuilder` tool that lets you graphically select
    the firewall rules. We will not go in-depth into these tools as you can easily
    find information on how to set up the firewall by yourself. If you are still confused,
    then you can check the documentation for each tool. They are simple and straightforward.


    ## Logging and Monitoring


    Monitoring your machine is also very crucial to its security. In this chapter,
    we learned how to protect yourself from third-party malicious actors. We learned
    how important is data security. For this, we learned how to protect the device
    on which you were working and set up a firewall. Now, how do you know that things
    are working as intended? To do so, you need to use the monitoring and logging
    capabilities of the Kali Linux operating system.


    Logging and monitoring enable you to detect anomalous behavior on your system.
    If you see that there is an issue with the system functionality or performance,
    then you need to check the log files to find out what’s wrong with the system.
    Sometimes, it can be packages that can clog the system resources or instances
    where there is actually a breach in your system. This is where you will learn
    how to successfully monitor and log your Kali Linux so that you know what is going
    on with the system.


    ### logcheck Monitoring Logs


    The first tool that you can use is the `logcheck` program. It works by logging
    the system through log files generated by the system. Every one hour, it sends
    a report to the administrator through email. The administrator can then go through
    the log and see for any anomalies that are recorded in the system.


    So, which files are monitored by `logcheck`? They include the directory `/etc/logcheck/logcheck.logfiles`.


    `logcheck` is pretty comprehensive when it comes to gathering and reporting the
    issues to the administrator. It offers varied data levels gathering, including
    settings suited for a workstation, server, or paranoid.


    `Paroid` is the most verbose type of report generation. This means that it is
    not the best option out there. It is only useful for machines that host firewalls
    for the network. The default mode that `logcheck` uses is `server` mode. It is
    used for most users. The last mode is the `workstation` mode, which is meant for
    the workstation. The `workstation` mode is also very terse and is the only ideal
    for few scenarios where it is needed.


    `logcheck` also offers different parameters which can then be used for customizing
    it. Some of these rules can help you detect cracking attempts and other security
    issues.


    ### Real-Time Monitoring


    Real-time monitoring can also be done if you feel the need for it. The tool that
    you need to use for real-time monitoring includes the `top` interactive tool.
    It offers a currently running processes list.


    The `top` tool offers a good amount of information, including the processor time,
    occupied memory, process identifier. It also lets you kill a process using the
    `k` key.


    The `top` tool is excellent for monitoring the system. It also helps you to find
    out which process is slowing down your system by eating memory or processor.


    ## How to Detect Changes

