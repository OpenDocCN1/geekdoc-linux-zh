- fmt: '

    Not everyone is on the dark side. Many people want to make the world a safer place.
    As a learner who is interested in `Kali Linux`, you also need to get yourself
    equipped with the cybersecurity terminology and knowledge.


    We will keep this chapter short, and soon after this, we will move into the realms
    of `Kali Linux`. The fact that learning `Kali Linux` is not all about tools; you
    need to have the proper background knowledge to use them properly.


    So, what is cybersecurity?


    Cybersecurity is an ecosystem where you can find the practices, processes, and
    technologies used to protect a wide array of devices, programs, networks from
    malicious actors, and unauthorized access. It is also known as information technology
    security.


    ## Why Cyber Security is Important


    Cybersecurity is important to our society. With the introduction of computers
    and the internet, we slowly moved to the information technology era. Our lives
    are now deeply connected with information technology as we store, process, and
    retrieve data online.


    Governments, medical organizations, military, and others heavily dependent on
    computers. Cybersecurity is used to keep all of them safe. Organizations have
    critical data stored in their server. This critical data is important for the
    organization as it gives them a competitive edge. If the data gets leaked, then
    they will lose the competitive edge and market share. Governments also have tons
    of sensitive information that needs protection. Cybersecurity is what protects
    them from leaking. Governments are also keen to invest heavily in intelligence,
    protect their sensitive information while looking for information to protect the
    countries interest.


    ## Learning About the CIA Triad


    At the core of cybersecurity, we have the `CIA` triad. It is a fundamental concept
    that keeps the cybersecurity ecosystem working. Without any of the three elements
    in the `CIA` triad, there would never be a secure system.


    The three elements are as below:


    - Confidentiality

    - Integrity

    - Availability


    If we want to explain the three elements in short, then you confidentiality can
    be explained as a set of rules for information access; integrity is related to
    data accuracy and trustworthiness, whereas the availability makes sure that the
    data is available reliability for authorized people only.


    Let’s go through them below.


    ### Confidentiality


    The first element of the `CIA` triad is confidentiality. In other words, it is
    related to privacy. By maintaining confidentiality, a system ensures that the
    user’s privacy is maintained at any cost. It also ensures that the owner only
    accesses sensitive information, and malicious actors cannot access it.


    Confidentiality rules can differ based on the data type and owner status. The
    categorization is done based on how intense the damage can be if the data falls
    in the wrong hands.


    Confidentiality is hard to implement. To make it work, people need to be trained.
    This training ensures that the security risks associated with the data are reduced.
    One of the biggest security threats are humans itself. If they are not trained,
    they are more likely to leave loopholes open for hackers to exploit. They need
    to learn how to set strong passwords and how to keep the password secure. These
    best practices will also ensure identifying social engineering attempts. The social
    engineering method tries to pursue people to give up on their information, including
    passwords.


    When it comes to the technical aspect, confidentiality is maintained with the
    use of cryptography. The hardened encryption ensures that the username and passwords
    are not leaked online by hackers. Companies need to store the data securely, and
    that’s what makes it more challenging — the other types of verification types,
    including security tokens, biometric verifications, soft tokens, and so on.


    ### Integrity


    The second element in the `CIA` triad is integrity. It is all about the data trustworthiness,
    accuracy, and consistency through the data life cycle. This means that the data
    should not be modified or changed by unauthorized access or malicious actors.
    Most of the time, if the confidentiality breaks, the integrity of the data breaks
    too.


    To maintain integrity, it is necessary to use access control to ensure that only
    authorized users can access the data. Also, the integrity needs to be checked
    and verified through methods, including cryptographic checksums or hash numbers,
    and so on.


    Some of the algorithms used for checking data integrity include `SHA1`, `SHA2`,
    `SHA3`, `SHA5`, and `MD5`.


    ### Availability


    The last trait is the availability trait. The data stored should be available
    at all times. The data that is not available is useless. To achieve 100% availability,
    the hardware manufacturers need to maintain their hardware and immediately repair
    them if any issues occur. They also need to focus on the software, or the operating
    system used so that the requested data can be served to the user in the best possible
    way.


    Another big requirement is to provide enough bandwidth for optimal availability.
    Just having availability is not enough, and it is required to serve the data to
    the user in a well-defined time that is justifiable.


    Other key aspects that need to be maintained include `RAID`, redundancy, failover,
    etc. A proper disaster recovery system ensures that none of the data is lost.
    It also makes sure that data delivery is not hampered in different scenarios.


    Data availability also needs to be maintained during the denial-of-service(`DoS`)
    attacks. The best approach is to have proper firewalls and proxy servers to make
    the service work in the worst condition.


    The two best ways to provide data availability is redundancy and backup.


    ## What Challenges Does the CIA Triad Bring?


    Even though the `CIA` triad can seem a simple thing to achieve, in reality, it
    is just the opposite. It uses big data, and other technologies make the `CIA`
    paradigm a tough thing to maintain. Big data is all about collecting important
    data from a variety of data sources. This can add unwanted cost and makes it even
    harder to maintain the `CIA` triad.


    Other technologies also pose their own issues. For example, `IoT` brings a new
    whole level of challenge. Connecting different devices together through a different
    medium, interface, and networks is in itself a challenge. Now, protecting data
    confidentiality, integrity, and availability is much bigger a challenge. `IoT`
    is not as secure as other technologies.


    ## Different Types of Cyber Threats


    Cyber threats are at the core of cybersecurity. As a `Kali Linux` user, you also
    need to learn about the terminologies. The hackers are keen to use any form of
    cyber attack to get access to the system. To make sure that you know about the
    attacks, let’s list them below.


    ### Malware


    One of the most common cyber attacks is the use of malware. It is a software that
    is used to gain system access. It can also be used to cause harm to the system
    without the owner’s prior knowledge.


    ### Social Engineering


    Social engineering is a non-technical threat where a person tries to impersonate
    and gather information through social skills. It is all about psychologically
    manipulate people.


    ### Advanced Persistent Threats


    Advanced persistent threats are used by unauthorized users to maintain access
    to networks or systems for a more extended period.


    ### Ransomware


    Ransomware is a new type of malware. It is used mainly to ask for ransom from
    an affected computer. The extortion starts after the target machine is infected
    with malicious software. The software can lock important files in the system and
    then ask for money in exchange for unlocking them. Many ransomware would lock
    users completely out of their system. Even after the user agrees to pay the amount,
    the hacker might keep a backdoor to the system so that he can infect other computers
    in the network. He can also try to infect the system again after some time.


    ### Phishing

