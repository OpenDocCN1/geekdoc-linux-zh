    ## 引言


    欢迎来到 Kali Linux：学习 Kali Linux 的简单且有效的方法。在本书中，你将学习 Kali Linux 以及如何有效地利用它。无论是中级用户还是初学者都能从书中通过赋予他们有效使用
    Kali Linux 的技能来受益。


    在本书中，我们将学习 Kali Linux 及其目的、它对黑客领域的影响、安装过程以及围绕它的其他重要概念。


    黑客已成为对 0 和 1 痴迷的学生或专业人士的一个主要关注点。


    Kali Linux 由 Offensive Security 编写。它包含了让你对网络、计算机和安全进行捣鼓和研究的工具和机制。目前，Kali Linux
    提供了 300 多种工具，可用于漏洞评估、密码破解、无线黑客等！Kali Linux 是最流行工具的汇堂，包括 `Wireshark`、`Metasploit
    Framework`、`Nmap`、`Aircrack-ng`、`John the Ripper` 等！


