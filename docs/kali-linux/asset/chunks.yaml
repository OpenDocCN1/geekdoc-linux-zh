    # 简介

    Kali Linux 是一个社区驱动的项目。你可以在社交媒体上找到大量的社区。事实上，在涉及 Kali 时，还有一些本地社区也乐于分享知识和帮助他人。社区是你能够帮助他人、分享有用信息以及与志趣相投的人进行互动的地方。


    为了帮助你，我们将列出两个你可以加入并成为其一部分社区。


    ### Freenode 上的 IRC 频道

    Kali Linux 在 Freenode 上有一个 IRC 频道。IRC 代表实时聊天系统。在这里，你可以与一群人进行实时互动。这些聊天室基本上是带有特定主题的频道。


    你可以通过打开 `chat.freenode.net` 作为 IRC 服务器，然后监听 `6667` 端口来连接到 Freenode 上的 Kali Linux
    频道。如果这看起来太技术化，你也可以使用 IRC 客户端，它可以让你轻松地连接到服务器。


    如果你喜欢控制模式，我们推荐使用 `irssi`。`Hexchat` 也是一个不错的选择，因为它提供了图形界面。如果你不感兴趣下载任何客户端，可以查看他们在
    `webchat.freenode.net` 上的网页客户端。


    ### 理解规则

    IRC 频道在规则和规定方面非常严格。在加入或与其他成员互动之前，请务必阅读规则。如果你犯了错，可能会被禁言或从服务器中移除。


    ## 成为社区的一员：提交漏洞报告

    要创建一个优秀的社区，你还需要成为一个活跃的贡献者。做到这一点最好且最简单的方法就是提交漏洞报告。这些漏洞报告可以帮助开发者解决问题并让 Kali Linux
    变得更好。你可能已经知道并不是所有软件都是没有问题的。Kali Linux 也是如此。


    通过分享漏洞报告，你正在与开发者分享有价值的信息，开发者随后可以使用这些信息来修复问题。你提供的信息越多，漏洞报告就越完善。如果报告足够详尽并解释了生成该报告的条件，那么你的漏洞报告很有可能在几天内被阅读并解决。


    ## 本章我们学到的东西

    - Kali Linux 拥有惊人的社区和文档

    - 它有文档来源。软件包有自己的文档手册。

    - 你可以使用 `man` 命令读取手册页。

    - 用于结构化文档的格式是 `info`。

    - 如果你遇到困难，还可以阅读特定包的文档。

    - 你可以在 `docs.kali.org` 找到 Kali Linux 文档。

    - 你也可以连接到 Freenode 上的 IRC 频道。

    - 如果加入，不要忘记在交流之前阅读规则。

    - 你也可以通过提交漏洞报告加入 Kali Linux 社区。


    # 第 9 章：Kali Linux 监控与安全

    Kali Linux 是一个为渗透测试人员设计的操作系统。默认情况下，它是为专业人员设计创建的。对于新手来说，这可能很有趣，但需要仔细的规划才能发挥最大作用。在本章中，我们将学习如何定义策略、理解威胁，最后讨论数据包过滤和防火墙。最后，你将能够确保系统保持完整和安全。你还将能够使用监控工具并实际设计一种策略来保护你的站点。


    ## 救援安全策略

    安全不是凭空产生的。如果你是安全专家，就会知道。每个组织都需要安全策略来变得安全。你需要为你的组织找到合适的安全策略。仅仅通过目前现有的工具、程序或概念是没有帮助的。安全方面需要根据许多条件进行配置。如果你试图急于实施，将会面临惨痛失败并使你的操作系统处于风险。


    为了确保你不会做出草率的决定，你需要找到目标。做到这一点，你需要提出问题并找到答案。让我们一起来看以下问题。


    - 你的系统需要保护哪些方面？

    - 威胁是什么？

    - 攻击者是谁？


    回答这三个问题将为你提供有关如何定义安全策略的关键信息。让我们尝试理解下面的每个问题。


    - 系统的哪些方面需要被保护？在这个问题中，你需要找出想要保护的系统或数据类型。如果你识别了系统或数据，那么你就需要回答你想保护的是什么类型的数据或系统。

    - 涉及到第二个问题时，你需要找出威胁。威胁可能是一个恶意实体，或者仅仅是数据或系统被破坏的方式。例如，你可能想要防止试图进入系统的恶意攻击者。在方法方面，你可能想要防止机密数据泄露、由于
    `DDoS` 导致的服务中断等。

    - 最后，你需要找出威胁类型。例如，威胁很容易就是用户或第三方恶意实体。在这两种情况下，你都必须确保你的系统不惜代价地受到保护。


    作为一名 Kali Linux 用户，你还需要理解安全不是一次性的。它等同于一个持续的过程，你需要在不断努力以保护系统。随着系统日新月异，漏洞或利用程序的出现是常有的。这正是黑客获得伤害的机会。这使得安全成为最困难的事情之一。


    实际上，你必须确保将风险因素降至最低。总会有微小的风险，但不应超过可接受范围。根据系统的演变，风险会随时间变化。通过确保正确涵盖了限制条件，你可以很好地减少风险。


    这就是为什么创建一个评估所有参数的风险模型会有很大帮助。围绕风险模型进行建模是你需要做的。最初，你需要涵盖基本的最小参数。一旦涵盖了它们，你就需要找到系统被破坏的极端条件。


    另一个重要因素是实施安全的成本以及相关的风险。在某些情况下，保护风险并不与其相关的成本值。你还需要评估如果风险被他人利用的损失。如果损失小于实施成本，最好保持原样。


    ## 方法


