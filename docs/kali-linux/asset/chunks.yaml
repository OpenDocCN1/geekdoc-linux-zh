    # 第 8 章：了解 Kali Linux 社区与文档


    Kali Linux 是一个复杂的操作系统。即使你完整地通读了这本书，仍会有一些东西遗漏。此外，即使你已经在它上工作了多年，也会会有感到停滞或困惑的时刻。这就是
    Kali Linux 社区和文档大显身场的地方。简而言之，你需要尽可能地利用资源。你需要能够自己找到问题的解决方案。这将使你成为一名胜任且优秀的问题解决者。


    本章旨在加深你对 Kali Linux 社区的理解。显然，你有许多方法可以获得帮助，但在投入时间之前，最好先了解你的选择。


    我们还将涵盖有关如何最好地使用可用信息的策略。让我们开始吧。


    ## 文档来源


    Kali Linux 拥有详尽的文档。这让你能够轻松地开展 Kali Linux 工作。此外，如果你想确定发生了什么，最好是阅读文档。一个程序可能是复杂的，为了确保万无一失，请阅读文档。这样，你就能对程序的运行机制了如指掌。


    在论坛或社区提问时，还有一点你需要留意。如果你是这个领域的初学者，可能会发现别人用关键词 `RTFM` 回复你。这是对手册中已涵盖的查询的一种流行回复方式。它的全称是“Read
    The Fine Manual（仔细阅读手册）”。在互联网上，它也可以意味着“Read The F**king Manual（去读那该死的手册）”。如果你收到这类回复，意味着你的答案就在文档本身。此外，不要对这个术语感到被犯，它仅仅意味着你需要阅读手册。


    ### 手册页 (Manual Pages)


    你寻找信息的第一个地方是手册页。手册页采用不同的方法来组织信息。查找程序或命令手册的命令是 `man`。


    手册页的语法如下。


    ```

    man [command]

    ```


    例如，如果你想学习 `ls` 命令的作用及其所有可能的结果，那么你需要使用以下命令。


    ```bash

    man cp

    ```


    手册页也用于记录 Kali Linux 的其他重要方面。例如，它还记录了系统调用、C 库函数、配置等。然而，这可能会导致问题，因为名称之间可能会冲突。一个经典的例子是
    `read` 命令和 `read` 系统调用。为了确保问题不会干扰你的工作，手册页是编号方式组织的。让我们看看下面的章节：


    *   命令 (Commands)

    *   系统调用 (System calls)

    *   库函数 (Library functions)

    *   设备 (Devices)

    *   配置文件 (Configuration files)

    *   游戏 (Games)

    *   标准和宏集 (Standards and macros sets)

    *   系统管理命令 (System administration command)

    *   内核例程 (Kernel routines)


    上面的章节编号可以帮助你找到要查找命令的正确手册。因此，如果你想阅读 `read` 系统调用的手册，你需要使用以下命令。


    ```bash

    man 2 read

    ```


    这将向你显示 `read` 系统调用的手册页。如果你想学习 `read` 命令，那么你需要使用以下命令。


    ```bash

    man 1 read

    ```


    如果你想阅读命令的手册页，也可以不包含数字，因为它们位于章节编号的顶部。它默认取 1 或与命令或程序相关的数字。如果你想阅读 `shadow` 的手册且不输入任何数字，它将简单地返回
    `shadow(5)`，因为 1-4 节没有可返回的手册页内容。


    然而，可能会出现你不知道命令名称的情况。这可能会导致问题。但是，你仍然可以使用命令来搜索手册页。


    执行搜索的命令是 `apropos` 命令。


    你可以使用任何你认为与要搜索的命令或程序相关的关键词配合 `apropos` 命令。关键词的选择在这里很重要，因为它能让你找到正确的命令或程序。该命令将为你返回一个选项列表。然后你可以选择你正在寻找的。它还会返回一个关于该命令的句子，以便让你有更好的了解。


    如果你在寻找有关该命令更多信息，还可以查看“See Also”（另见）部分。如果文档中有该部分，它将包含指向某些外部文档的链接和更多信息。


    还有其他方法查找文档。你可以使用 Gnome 中的 `yelp` 和 KDE 中的 `Konqueror`。


    ## 学习信息文档


    除了手册页，你还可以查看 `info` 文档。这是一个旨在以 `info` 格式编写的 GNU 项目。你也可以找到许多以 `info` 格式编写的手册页。然而，查看
    `info` 页可能是一项艰巨的任务，因为它们本质上是复杂的。为了确保你不需要这样做，可以使用 `pinfo`。它让你以更好的方式阅读复杂信息。


    要安装 `pinfo`，你需要使用以下命令。


    ```bash

    apt install pinfo

    ```


    你可能还想运行以下命令，以便所有依赖项无问题地预安装。


    那么，`info` 文档是什么样子的？它是层级结构。


    ### 特定包的文档


    所有包都自带文档。你可以轻松在包内找到 `README` 文件，其中包含了有关如何安装、操作和排除包故障的必要信息。


    特定包的文档存储在 `/usr/share/doc/package/directory`。只需将包名为你正在使用的包，就能找到特定的文档。如果你找不到，那么文档可能有它自己的包。我们的意思是，有时包文件很大。这使得提供一个独立的包变得非常理想。在这种情况下，文档存储在
    `package-doc` 中。你在安装时可以找到该文档包。它会向你推荐。如果你仍然找不到文档，则需要搜索包的网站。


    Debian 也积极为某些包提供文档。这些文档包含在包文档的默认位置。它通常会改进文档，让用户从中受益。


    ### Docs.Kali.Org: Kali 文档


    Kali Linux 在 `docs.kali.org` 有其官方文档。我们正在写的这本书包含了许多关于 Kali Linux 内容，但了解 Kali Linux
    文档始终很重要。它包含了一些有用信息，包括教程。


    如果你打开文档，你会发现涵盖了许多内容，包括介绍、USB 安装、ARM 版 Kali、虚拟化、基础镜像、容器、云、Linux 的 Windows 子系统 (WSL)、工具、通用用法、Kali
    NetHunter 文档、故障排除、社区、Kali 开发与策略。


    所有这些类别都包含一些价值信息。


    ## 社区驱动的 Kali Linux


