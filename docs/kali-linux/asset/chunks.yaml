    `Linux`。然而，如果你很有抱负，你可以在学习 `Linux` 的同时阅读并实现书中分享的理念。


    书中涵盖的所有主题都是从初学者的角度出发的。我们首先查看如何正确安装 Kali Linux。我们的方法将包括创建双启动或在 `Windows 10` 中创建虚拟机。这两种方法都涵盖了，以确保良好的学习体验。在书的后半部分，我们的重点将转向网络安全、黑客或
    Kali Linux 提供的工具。


    此外，我们的重点主要放在伦理黑客上。但并不意味着我们不会涵盖一些黑帽技术。


    在书的最后，你将具备充分利用 Kali Linux 的技能，理解黑客攻击、漏洞，并准备好保护你自己的系统。


    # 第一章：开始使用 Kali Linux


    Kali Linux 是目前领先的 Linux 发行版之一。它主要用于黑客攻击目的。黑客部分既可以是黑帽，也可以是白帽（我们稍后会详细介绍不同类型的黑客）。作为一名学习者，我一直好奇是什么让
    Kali Linux 如此有趣。这鼓励我写了这本书，我们现在在这里！


    ## 什么是 Kali Linux？


    Kali Linux 是一个 Linux 操作系统。它基于 `Debian`。Kali Linux 的主要目的是安全。它用于渗透测试和安全审计。这使其成为具有恶意意图的黑客的理想工具。


    让 Kali Linux 存在的核心点是它所提供的工具。它预装了大量的工具。这些工具可以用于执行各种信息安全任务。例如，它允许你进行逆向工程、安全研究、计算机取证等。目前，它有超过
    600 多个渗透测试程序。随着安全领域进行更多研究，工具的数量将继续增长。


    Offensive Security 管理 Kali Linux 发行版。这是一家领先的信息安全培训公司。他们现在管理着用于制作 Kali Linux 的资金，它是用于渗透测试和数字取证最好的
    Linux 发行版。该项目背后的两个主要人物包括 Offensive Security 的 `Devos Kearns` 和 `Mati Aharoni`。另一位产生影响的开发者是
    `Raphael Hertzog`，一位 `Debian` 专家。


    这一切使得 Kali Linux 成为一个学习黑客攻击或渗透测试的完美工具。你可以选择你如何使用它。


    Kali Linux 的演变始于 2013 年 `BackTrack Linux` 的终结。该项目在 2013 年 3 月重启为 Kali Linux，同时保持了
    `Debian` 的开发标准。


    Kali Linux 也因支持 `Metasploit Project` 而闻名。该项目用于安全漏洞的开发和执行。


    ## 安装和准备 Kali Linux


    在我们开始之前，我们需要准备 Kali Linux。安装 Kali Linux 很容易的。此外，Kali Linux 可以通过两种方式安装。你可以使用 `USB`
    驱动器将它安装在单独硬盘上，或者简单地使用虚拟化解决方案将操作系统虚拟化。


    *   `USB` 方法

    *   `USB` 方法双启动安装

    *   虚拟化方法 (`VMware` 或 `Hyper-V`）


    如果你是虚拟化的新手，让我用简单的话向你解释。虚拟化是一种通过这种方法，为操作系统或软件拥有其独立的虚拟资源，以便在已有的操作系统/设备/解决方案上运行。那里有很多虚拟化解决方案，包括
    `VMware`。许多大公司严重依赖虚拟化技术。即使是云公司也使用虚拟化为其订阅者提供云计算。托管公司也将虚拟化根植于服务之中。到现在，你应该知道虚拟化是一件大事，而且它确实如此！


    如果你正在使用 `Windows 10`（Windows 的最新迭代），那么你可以使用虚拟化安装 Kali Linux。`Windows 10` 逐渐接受
    `Linux`，这就是为什么他们在 2016 年引入了了自己的 `Hyper-V` 虚拟化解决方案。如果你使用的是最新的 `Windows 10` 版本或
    `1803` 及更高版本，你的 Windows 应该预装了 `Hyper-V` 软件。


    让我们先学习如何使用 `USB-drive` 方法安装 Kali Linux。但在我们之前，请查看安装 Kali Linux 的最低要求。


    *   一个 `USB-drive` 可启动介质或 `DVD` 可启动介质

    *   至少 20 GB 硬盘空间

    *   `Kali Linux ISO`。


    你可以从官方 `Kali Linux` 网站 `www.kali.org` 下载 `Kali Linux ISO`。在那里你可以在 `Kali Linux
    Downloads`: `https://www.kali.org/downloads/` 下找到所有下载选项。我也建议你使用种子链接下载，这样速度会更快。


    从那里，你应该选择 `Kali Linux 64-bit`。对于本书，我们将使用 `2019.3` 版本。我建议你下载与我相同的版本。这样你就可以轻松地遵循书中分享的教程和方法。然而，如果你选择下载稍不同的版本（特别是最新版本），你也会没问题的。


