    掌握了系统监控的知识，现在是时候学习如何检测变化了。这些检测变化的思路可以帮助你判断系统文件是否发生了更改。如果在基础安装后发生了变化，那么可能意味着恶意攻击者修改了系统文件。


    你可以使用 `dpkg --verify` 工具来验证系统文件的完整性是否发生了变化。命令如下：


    ```

    dkpg -- verify

    dkpg -V

    ```


    然而，这并不总是判断目标系统是否真的被攻破的妥妥答案。这就是为什么你可能需要使用更高级的工具。我们不会讨论这些工具，因为它们超出了本书的范围。


    ## 本章我们学到的


    - 作为一名 Kali Linux 用户，你应该保护好你的 Kali Linux。

    - 应该使用安全策略来确保适当的安全。

    - 你还应该确保不惜代价地维护数据的机密性。

    - 在处理操作系统安全时，也应该考虑极端情况。

    - Kali Linux 系统的安全性还取决于它的安装位置。如果你使用的是笔记本电脑，那么你需要不同的安全方法。在公共服务器上访问操作系统意味着另一种不同的方法。

    - 你应该使用软件包防火墙来保护你的操作系统。

    - 日志记录对于访问系统健康状况也非常重要。

    - 日志文件存储在 `/etc/logcheck/logcheck.logfiles` 目录中。

    - 你也可以使用 `top` 命令进行实时监控。

    - 要检测核心系统软件包的变化，你需要使用 `dkpg --verify` 命令。


    # 第 10 章：Debian 软件包管理


    Kali Linux 是一个基于 Debian 的 Linux 操作系统，特别是 Debian 软件包管理系统。它直接借用了 Debian 的软件包管理系统。我们已经讨论过如何创建并将新软件包添加到
    Kali Linux 中。


    Kali Linux 的核心是软件包管理系统，如果我们学习了它，就能了解很多关于操作系统的知识。通过学习，我们将学会 Kali Linux 是如何构建和使用的。它在需要时也能帮助你排除故障。


    在本章中，我们的重点将是 Debian 软件包管理系统。我们还将学习 `APT` 套件工具和 `dpkg`。通过学习，你将理解 Kali Linux 的主要优势，即它的软件包管理系统。Kali
    Linux 也因其软件包管理系统无无缝安装过程而闻名。


    软件包管理系统还确保了你不需要为了程序运行而费力，因为管理系统会自动处理大部分工作。让我们开始开始吧。


    ## APT 介绍


    `APT` 代表 Advanced Package Tool(`APT`）。它比 `dpkg` 更高级。但是，`dpkg` 到底是做什么的？两者又是如何比较的？让我们在下面寻找。


    ### APT 与 dpkg


    任何软件应用程序都存储在 Debian 软件包中。此外，如果你想构建二进制软件包（`.deb`），你需要源码包，其中包含了安装它的指令和文件。如果你只考虑二进制软件包（`.deb`），它只包含可直接使用的文件，包括文档或程序。


    简而言之，一个 Debian 软件包配备了安装该软件包所需的所有信息。元数据还包括依赖关系，并具有正确的信息以便如何管理软件包的安装、升级和删除。


    要安装 Debian 软件包，你需要使用 `dpkg` 工具。该工具非常简单，通常用于安装软件包。然而，如果缺少依赖项，它将无法安装软件包。会抛出错误，提示你缺少软件包。


    另一方面，高级软件包工具(`APT`) 完全能够安装缺失的依赖项。它通过 `apt` 和 `apt-get` 命令来实现这一点。`APT` 仅仅是 Debian
    软件包的升级版。


    Debian 软件包命令是 `dpkg`。


    通过使用该命令，你能够分析并安装 `.deb` 软件包。然而，`dpkg` 在本质上是有局限性的。它们不知道任何其他软件包。相比之下，`APT` 比 `dpkg`
    具有更好的功能集。


    `APT` 是一个完整的解决方案，让你不仅可以安装和管理 Debian 应用或软件包，还可以在需要时升级系统。如果你以前用过 Linux，你应该了解 `apt-get`
    和 `apt-upgrade` 。这些选项允许你正确地升级和更新所有可用软件包（包括它们的依赖项）。我们可以认为 `APT` 是一个伞型工具。此外，你不应该忘记没有
    `dpkg`，`APT` 工具是没用的，因为 `dkpg` 处理所有的核心软件包管理任务，包括安装、删除和升级。`APT` 的优势在于它可以连接网络，并在安装过程中学习软件包的依赖关系。这解决了依赖处理问题并提升了用户体验。


    `APT` 和 `dkpg` 是当前 Linux 用户的福音。早些，用户需要通过 `GCC`、`make` 和 `configure` 等程序自己编译程序。他们正在编译程序，并且很容易让安装过程变得复杂。在最终完成安装过程之前，你可能必须经历各种错误和故障。这需要阅读文档和在线研究——这反过来消耗了大量的时间和精力。


    随着用户体验的进步，我们可以说 Kali Linux（或通用的 Linux）已经走了很远。`APT` 和 `dkpg` 以独特的方式解决了问题，使得基于 Linux
    的操作系统更加用户友好。


    正如我们已经说过的，`APT` 是联网的，并能够检索软件包。`APT` 获取软件包的源列表列在 `/etc/apt/sources.list` 文件中。


    ### 查看 sources.list 文件


    在 `APT` 的核心，有一个 `source.list` 文件。该文件包含了 `APT` 用来运行的配置和源。如果文件没有配置正确，那么 `APT` 可能会无法按预期工作。


    `APT` 的 `source.list` 文件中的源由三部分组成。用空格分隔这三部分。让我们看看下面的示例。


    ```

    deb [http://http.kali.org/kali] kali-rolling main non-free contrib

    ```


    命令的第一部分是 `deb`。在这种情况下，它代表二进制软件包。它是源类型。它也可以是 `deb-src`，代表源码包。


    第二部分从外观上看一目易见。它是源的 URL。在这种情况下，可以是 Debian 镜像或其他第三方 URL。是的，第三方也可以维护源，以根据你所处的位置提供更好的服务。这里的源是
    `HTTP://`，意味着它是存储源的 Web 服务器。如果你看到的是 `FTP://` 而不是 `HTTP://`，这意味着源存储在 FTP 服务器上。最后，如果用户从
    CD/DVD-ROM 安装软件包，他们将看到使用 `cdrom:` 语法。然而，这很少有帮助，因为现在大部分工作都是在网上完成的。此外，软件包经常更新，而设备是无法更新的。这也意味着
    CD/DVD-ROM 源很容易过时。


    第三部分是变得有趣的地方。它的结构取决于正在使用的仓库。


    ## 不同的软件包许可证


    软件包提供了许可证，并且主要由作者自己选择。软件包还可以根据三个部分进行进一步区分。


    - 包含在 MAIN 中的软件包符合 Debian 自由软件指南。

    - Contrib 是开源软件，需要非自由元素才能运行。


    ## Kali 仓库


