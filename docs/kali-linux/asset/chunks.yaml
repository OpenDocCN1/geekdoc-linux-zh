    This section will further list more useful commands that will help you do more
    things in the Linux operating system.


    ### Modifying and Displaying Files


    To modify files or display them, you need to use the `cat` command. The command
    can be used to display file commands.


    If you want to limit the content shown on the screen, then you need to use either
    `less` or `more` command with it. To run two commands together, you need to use
    pipe (`|`). It takes one command’s output and makes it an input to the other.


    ```bash

    cat file1 | more

    ```


    This will show the contents of `file1`, making sure you can view one page at a
    time. If you want to view more, you can use the enter key. To close the operation,
    you can press `CTRL + Z` and terminate it.


    You can also use greater than (`>`) to store commands or string text to a file.
    Most of the time, a text editor is used when you want to modify a file. It can
    be either `vi` or `nano`. You can use the `vi` or `nano` command followed by the
    file name to open up the file in the respective text editor.


    But, the simplest way to add content to a file is to use the `>` or `>>` command.
    The `>` replaces the content of the file, whereas `>>` appends it to the file’s
    content.


    ```bash

    $ echo “We are learning Kali Linux” > Kali-Linux-Learning.txt

    $ cat Kali-Linux-Learning.txt

    $ We are Learning Kali Linux

    $ echo “we learn every day” >> Kali-Linux-Learning.txt

    $ cat Kali-Linux-Learning.txt

    ```


    We are learning Kali Linux

    We are learning every day


    ### Finding Files


    You can search for files with the help of the `find` command. It takes the directory
    in which you are searching as input, followed by the text string.


    ### Process Management


    Another important part of the Linux operating system is process management. You
    can do process management through the command line. Each process has its own `PID`.
    This means that it is easy to manage them.


    To interrupt a process, you need to use the `kill` command.


    ```bash

    kill [pid]

    ```


    This will send a signal and stop or terminate the process. You can also make a
    command run in the background. To do so, you need to use the `&` after the command.
    This will make the command run in the background, and you will also instantly
    gain access to the shell itself. You can also use the `jobs` command to see the
    processes that are running on the system, and then do things accordingly.


    If you want to move a process in the foreground, you need to use the `fg` command,
    which will bring the background process to the foreground. Also, once a process
    is moved to the background, it cannot be terminated. So, you need to bring it
    to the foreground to terminate it.


    ## Things We Learned in This Chapter


    - Here, we learn about Linux fundamentals.

    - At the core, kernel ensures the proper functioning of the system.

    - It also utilizes a proper file system for easy access to files and directories.

    - Kernel also does a proper process management.

    - Command-line is used to talk to the system

    - `ls` command is used to list all files and directories

    - Linux utilizes Filesystem Hierarchy Standard(FHS)


    # Chapter 7: Kali Linux Configuration


    You have reached a point where you are now ready to go into the Kali Linux operating
    system. In this chapter, we will learn how to configure Kali Linux. Configuring
    Kali Linux is important as it will make you use it to its full potential. This
    includes configuring the network, services, and Unix & user groups.


    So, let’s get started.


    ## Network Configuration


    Before you start to use your Kali Linux, you need to configure the network. Network
    configuration will help you connect with the internet. Let’s see how you can configure
    the network.


    ### NetworkManager


    Gnome provides an interactive way to access different Kali Linux. It offers `NetworkManager`,
    an interactive way to configure your network. To get started, go to the top-right
    menu of your desktop view, and there you can see the drop-down arrow. Click on
    it, and then choose wired connection. From there, you need to choose “wired settings.”


    Once you click on wired settings, you will see the following window open up.


    ![](Images/image00147.jpeg)


    Here you can see that the connection is already setup. DHCP is used to configure
    the network, including IP address, gateway, and DNS server. If you want advanced
    settings, you need to click on the gear icon on the wired connection. From there,
    you can change settings, including IPv4, IPv6, security, and identity.


    In fact, you can create multiple profiles by clicking on the plus symbol. This
    way, you can change between different settings. For a wired connection, you can
    change easily. If you are on the wireless network, then the SSID setting is used
    to connect to those networks. SSID stands for the public identifier.


    `NetworkManager` utilizes PPPoE(point-to-point over ethernet) and WWAN(Wireless
    Wide Area Network).


    You can also see that there is an option to set up a VPN. VPN works with the protocols
    used by the `NetworkManager`. You can connect with different VPN types through
    plugins, including OpenVPN, `SSH`, and so on.


    Lastly, you can set the network proxy. By default, it is set as off. You can change
    it to manual or automatic.


    ## Configuring Network Using Command Line


    You can also configure the network using the command line. There are instances
    where you might not have access to graphical desktop.


    Configuring the network through the command line includes the use of `ifupdown`.
    The package includes two tools, `ifup`, and `ifdown`. The tools are located at
    `/etc/init.d/networking`. The file is used to network configuration during boot.
    The devices that are managed by `ifupdown` can be registered and deregistered
    using `ifdown`.


    So, how do you do it? Let’s take a look at the `ifupdown` configuration file.
    Inside the file, there are two main derivatives that you should know about:


    `auto network-device`: This directive enables `ifupdown` to configure the network.
    It only does it once the system finds a new network.


    `iface network-device`: This directive is used actually to configure the interface.


    The `ifup` is used to activate network, whereas `ifdown` is used to disable interface.
    When you enable a network, it is now ready to receive and transmit data. On the
    other hand, disabling a network means that it can further receive or transmit
    data.


    ## Using systemd-networkd


    There can be instances where `ifupdown` might not work. This can be a reason behind
    it being too old. After all, it is a historical tool that is being used in Debian.
    You can use the new tool known as `systemd-networkd`. It comes integrated with
    the init system `systemd`. This is a new tool and is not Debian based. It is also
    lightweight and is easy to integrate with multiple distros.


    In `/etc/systemd/network/` directory, you need to place the network files. This
    will enable you to configure `systemd-networkd`. There you can find the `[Match]`
    section, which has information about network interfaces. There you can also find
    which configuration applies to which network interface. Moreover, you can also
    configure different aspects of the interface, including the MAC address.


    Sometimes, `networkd` might be disabled. That’s why you need to enable it to use
    it. Also, before you use it, you need to ensure that you have done the DNS resolution
    integration. It can be done by creating a symlink to `/run/systemd/resolve/resolv.conf`
    replacing the `/etc/resolv.conf` file.


    ## Unix Groups and Users Management


    User management is a very important part of any operating system. This is also
    true for Kali Linux. As a user, you need to make sure how to work with user permissions.
    There are some key files that you should know about. Let’s list them below:


    - List of users → `/etc/passwd`

    - User’s encrypted password → `/etc/shadow`

    - List of groups → `/etc/group`

    - Encrypted passwords of groups → `/etc/gshadow`

