    You will get access to a sleek GTK Graphical User Interface from where you get
    to control all the features. Some of its notable functionalities include a dedicated
    `ncurses` mode, option to read custom configuration files, a debugging mode, support
    for log files to save all results & data, and much more.


    ## DHCPig - DHCP Exhaustion Application


    `DHCPig` is a Dynamic Host Configuration Protocol (DHCP) exhaustion tool. It can
    help you create and launch advanced attacks on networks that can consume all IPs
    on a LAN, limit new users from obtaining IPs, and even release any IPs in use
    by the network. As the icing on the cake, the tool can even turn all windows hosts
    offline by using `ARP`.


    Once you execute the script, it will first grab your Neighbours’ IPs and listen
    for DHCP requests from any connected clients. If it detects an offer, the tool
    will respond with a request for that offer. It can also loop and send DHCP requests
    from all different hosts and MAC addresses, detect neighbor MAC & IP address and
    release them from the DHCP server, and much more.


    ## [THC Hydra - For Brute Force Crack Remote Authentication Services](https://github.com/vanhauser-thc/thc-hydra)


    Next up, we have `THC Hydra` - a free hacking tool that can help you launch brute
    force attacks to crack remote authentication services. The tool comes with support
    for more than 50 protocols, which makes it perfect for testing the password security
    levels of any type of server environment.


    The tool is known for its super-fast password cracking speeds, the capability
    to run on multiple operating systems, option to launch multiple brute force attacks
    parallelly, and much more. Also, being a module-based application, it comes with
    the option to add custom modules to extend its functionality.


    ## Metasploit Framework - Penetration Testing Suite


    The `Metasploit Framework` can help you create, test, and execute exploits against
    remote hosts. It gives you access to a whole suite of penetration testing tools
    paired with a powerful terminal-based console – `msfconsole` - to help you locate
    targets, start scans, exploit any vulnerabilities, and collect any and all available
    data.


    It is, in fact, one of the most powerful security auditing tools in the market,
    and being available for free, it is something you should have up your belt. Notable
    features of the tool include support for network enumeration and discovery, ability
    to evade detection on remote hosts, development and execution of exploits, and
    much more.


    ## [FunkLoad - Web-Stress Tool](https://pypi.org/project/funkload/)


    With `FunkLoad`, you get a powerful functional and load Web tester based on `python`.
    It can help you emulate a web browser complete with real browser functionalities
    like cookies, referrer support, and so on. It is perfect if you are looking to
    test a web project and analyze the performance of your web server.


    In terms of functionality, the tool can help you will functional testing and regression
    testing of your web projects. It can also monitor your server performance after
    loading the application to help find any bottlenecks. Other notable features include
    load testing to help find bugs, stress testing to gauge application recoverability,
    and so on.


    ## [SlowHTTPTest - Web-Stress Application For HTTP Servers](https://github.com/shekyan/slowhttptest)


    `SlowHTTPTest` is by far the most well-known application layer DoS attack simulator.
    It is highly configurable and can help you lengthen an HTTP connection to simulate
    the Application Layer Denial of Service attacks. It is ideal for testing your
    server or DoS vulnerability, or simply to test how many simultaneous connections
    it can handle at a time.


    The tool also generates useful statistics on each test, so you get access to useful
    and actionable information. Once a test is completed, it will save all the stats
    and metrics in an HTML or CSV file, which you can use for representation or further
    analysis. Other notable features of the tool include an option to set various
    verbose levels, set a custom HTTP Connect Rate, and even support for Proxy redirects.


    ## [Inundator - Multi-Thread IDS Evasion Security Tool](http://inundator.sourceforge.net/)


    `Inundator` is a multi-thread, queue-based intrusion detection false positive
    generator. Also, since it’s completely anonymous (thanks to `TOR` integration),
    it is perfect for testing intrusion detection or prevention systems. It can literally
    flood the security system by generating over a thousand false positives per second.


    All the false positives generated using the tools used very poor pattern matching
    rules. As such, if the system detects little to no false positives, then it means
    it is based on a well-written set of rules. Whereas, if it becomes victim to the
    hundreds of false positives, then you should consider adopting heuristic-based
    detection or anomaly-based detection mechanisms on your networks.


    ## [Social Engineering Toolkit](https://github.com/trustedsec/social-engineer-toolkit)


    `Social Engineering Toolkit` is another powerful penetration testing framework
    boasting tons of tools to help you create and execute a social engineering attack
    in a matter of clicks. It is perfect if you want to hack into social network accounts
    using powerful social engineering tips and tricks.


    You will get access to tools that can help you with WiFi-based attacks that can
    redirect or intercept packets from users on the same WiFi network as yours. On
    top of that, you will get to create SMS, Email, and web-based spoofing and phishing
    attacks. The tool can even let you create malicious `.exe` files that will compromise
    users’ systems after they run it.


    ## [OpenVAS - Vulnerability Scanning Tool](http://www.openvas.org/)


    `OpenVAS` is free software that can help you detect vulnerabilities in any local
    or remote networks. It can also help you write, create, and integrate your custom
    security plugin straight on the `OpenVAS` platform. On top of that, the platform
    will give you access to over fifty-thousand `NVTs` (Network Vulnerability Tests),
    which can scan almost any security vulnerability in your system.


    Now, taking a look at some of the notable features of the software, you get the
    option to perform simultaneous host discovery, network mapping and port scanning,
    access to OpenVAS transfer protocol, full integration with SQL databases and SQLite,
    automatic scheduled scans, and much more.


    ## [Nikto - Helps In Full Web Server Scans](https://www.cirt.net/Nikto2)


    `Nikto` is designed to work as a complementary software to some vulnerability
    scanning tools, including `OpenVAS`. It can help you perform a full scan on a
    web server to help locate vulnerabilities and flaws in the system/network. The
    scan results are extremely comprehensive and can gather information on insecure
    files, app patterns, server software that is out of date, file names (default),
    any software misconfiguration, and so on.


    You can use it to scan several ports on the server at the same time. On top of
    that, it comes with IDS evasion techniques, the option to output results in various
    formats, username enumeration for both Apache and `cgi-wrap`, and much more.


    ## [WPScan - Auditing Tool For WordPress Security](https://wpscan.org/)


    `WPScan`, as you all know, is the most popular CMS platform powering over 30%
    of all websites on the world wide web. So it clearly makes sense to include a
    Kali Linux security tool that can help audit the WordPress security of a website.
    With `WPScan`, you get to scan and detect whether your web project is safe from
    certain types of attacks and how much sensitive information is being exposed from
    its core files, plugins, or themes.

