    is a method through which an operating system or software is given its own separate
    virtual resources to run on an already existing operating system/device/solution.
    There are many virtualization solutions out there, including `VMware`. Many big
    companies rely heavily on virtualization techniques. Even cloud companies use
    virtualization to provide cloud computing to its subscribers. The hosting company
    also have virtualization ingrained into their services. By now, you should know
    that virtualization is a big thing, and it is!


    If you are using `Windows 10`, the latest iteration of `Windows`, then you can
    use virtualization to install Kali Linux. `Windows 10` has been slowly accepting
    `Linux`, and that’s why in 2016, they introduced their own `Hyper-V` solution
    for virtualization. If you are using the latest `Windows 10` version or `1803`
    version or above, your Windows should come pre-equipped with `Hyper-V` software.


    Let’s first learn how to install Kali Linux using the `USB-drive` method. But,
    before we do, check out the minimum requirements to install Kali Linux.


    *   A `USB-drive` bootable media or `DVD` bootable media

    *   20 GB minimum hard disk space

    *   `Kali Linux ISO`.


    You can download the `Kali Linux ISO` from the official `Kali Linux` website,
    `www.kali.org`. There you can find all the download options under the `Kali Linux
    Downloads`: `https://www.kali.org/downloads/`. I also recommend you to use torrents
