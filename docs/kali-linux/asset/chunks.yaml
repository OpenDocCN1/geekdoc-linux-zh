    # Chapter 2: Getting Started With Hacking


    As we already learned, Kali Linux is mainly used for hacking. And, that’s why
    we need to cover the topic in detail. We need to learn what is hacking, types
    of hackers, and the path you should take. We will also learn the role of Kali
    Linux in making you a security expert.


    ## What is Hacking?


    Hacking is an activity that is done by hackers, which involves modification of
    a system, service, or solution. It can be done in a subversive manner, where the
    hacker can have authorized or unauthorized access.


    However, in general space, hacking is always seen as a bad thing. It is all about
    doing criminal activity, including gathering information or data unauthorized,
    hacking security systems, or transferring a huge amount of money from a bank account.
    Even though they are an example of hacking, they do not confine what actually
    hacking is.


    Currently, hacking can be related to multiple definitions. The best way we can
    define is hacking as “being creative.” Hacking is not only a computer-related
    activity. It is an activity that is carried out in our daily lives. If you modify
    or transform an object or process to the way you want -- that can be termed as
    hacking.


    Hacking in computer terminology is exploring for vulnerability -- using it or
    fixing it. The world of cybersecurity runs on finding vulnerabilities and solving
    them so that anyone using that service or solution are safe. Computer hacking
    has now become one of the biggest skills to have. It is now performed by certified
    professionals who know what they are doing. This also gives rise to different
    types of hackers, including white hat, black hat, and gray hat hackers. The approach,
    motivation, and method of penetration determine their type.


    You may find hackers and crackers confusing. Crackers are hackers but only do
    specific types of activity, including breaking passwords, bypassing software access,
    or going around computer security.


    ## Learning About Types of Hackers


    There are three different types of hackers. These include the following.


    - Black Hat Hacker

    - White Hat Hacker

    - Gray Hat Hacker


    ### Black Hat Hacker


    Black hat hackers are hackers who do hacking in an unethical way. Most of the
    time, the black hat hackers are new learners in the pen testing or cybersecurity
    field. Their eagerness to learn about hacking is what makes them use a more unethical
    approach. They are also not trained when it comes to hacking ethics. Also, lack
    of guidance and mentorship means there are more chances that they will pick up
    black hat hacking.


    They do their activities without proper authorization and gain access to the system,
    either destroying them or gaining them to further their work. Black hat hackers
    are also known for blackmailing the owner for paying a ransom. This is a serious
    crime as it includes two offense - black hat hacking and blackmailing.


    Most of the time, black hat hacking is all about feeling good about yourself.
    It can be defined as a selfish act where they are okay with harming others for
    their own achievements. Their approach is what defines them, and if they use unethical
    ways, they are simply harming others by their actions. This doesn’t end here as
    black hat hackers also continue to use the data they collect. They either sell
    the data in the black market(deep web) or use the data to further their black
    hat hacking.


    Black hat hackers mostly work in groups. And, there are chances that many governments
    have their own set of black hat hackers to gain an advantage when it comes to
    ruling the world. But, in no circumstances, the action of black hat hackers can
    be justified as they always do unauthorized hacking.


    ### White Hat Hacker (Ethical Hackers)


    White hat hackers work completely different from that of black hat hackers. White
    hat hackers are ethical in their approach and never do unauthorized access. They
    are more creative and know how to access networks or computers in different ways.
    They use their knowledge to look out for exploits or weaknesses and then fix them.
    If they do not know how to fix an exploit, they will simply inform the person
    who is the owner of the service, product, or solution.


    White hat hackers are only different in their ethics. They use the same approach
    as that of black hat hackers. Their tools are the same, and there are chances
    for their skills to be the same.


    It is not easy to become a white hat hacker as it requires tons of patience and
    training in both technical and ethical sense. Also, there is no single path to
    become a white hat hacker. There are many instances when a black hat hacker becomes
    a white hat hacker during his/her career. The opposite is also true where hackers
    change from white to black. Also, white hat hackers are commonly known as “Penetration
    Testers.” Their job is to find vulnerabilities in networks, machines, or solutions
    before they get exploited. Almost every tech company has its team of penetration
    testers as they want to make their products as secure as possible.


    ### Grey Hat Hacker


    Grey hat hackers are hackers that lies between the white hat hacker and black
    hat hacker. They use both black hat and white hat techniques. Grey hat hackers
    are also inclined towards the good side but are not 100% committed in their approach.


    The grey approach is mostly used by learners who want to improve themselves. They
    often do some unethical things, but also want to ensure that they inform the company
    about the vulnerability. Grey hat hackers thrive on problem-solving, and even
    companies are willing to pay them if they report the vulnerabilities. There are
    bounties that companies put if someone finds a vulnerability and report it to
    them. Grey hat hackers are also not inclined towards stealing data or making money.


    Also, becoming a grey hacker is completely optional, and you can still create
    your own playground to test your skills and improve, rather than trying out your
    skills on other’s networks or computers.


    ## Hacking Consequences


    Hacking can be a fascinating thing to do, especially for new learners, but it
    comes with its consequences. The consequence of unauthorized access can vary depending
    on the situation. In many cases, hackers, once caught, are prosecuted according
    to law. The laws are also not light when it comes to hacking. The criminal charges
    can be big, depending on the hacking done. For example, if you hacked a financial
    institute, you are bound to get a severe penalty, including serving in jail and
    paying a hefty amount. This is done to discourage hackers from doing unethical
    hacking.


    But not all hacking is bad. White hat hackers or ethical hackers are at the core
    of good hackers. There are also cases where white hat hackers are caught doing
    unethical hacking. In those cases, their punishment depends on their actions and
    contributions they have made to the community.


    ## Victims


    If you are going to do penetration testing with `Kali Linux`, you should also
    learn about the victims of your actions. If you are on the right path, then there
    is no need to worry, but what happens if you try to be unethical? Who will be
    your victims?

