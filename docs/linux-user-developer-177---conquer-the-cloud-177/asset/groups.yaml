    # Mozilla 收购 Pocket 以增强移动端地位


    # Pocket 拥有 1000 万活跃用户


    Firefox 浏览器的创建者 Mozilla 正式宣布收购热门应用 Pocket。该应用因其随时随地保存文章、视频和其他网页内容的最佳方法而闻名。此次收购的一个大优势是
    Mozilla 拥有的数百万用户群体，该群体自在 Android 平台首次发布以来一直在增长。


    “Pocket 的使命是创建一个平台，让用户能够分享、保存和消费他们想要的内容。通过这种方式，我们希望能让保存和寻找‘高质量’内容变得更容易，”首席执行官
    Nate Weiner 说，“对我们来说，最重要的是能够对用户的生活产生真实影响。我们终于找到了一个强大的新盟友，帮助我们在实现使命的同时，构建一个更美好、更健康、更有趣的互联网。”


    通过他们的“发现”功能与其他用户进行社交。人们可以对自己的内容进行评分、分享，并与喜欢他们爱好的人交流消息。预计 Mozilla 团队将引入 Firefox
    的功能并将两者整合。


    然而，目前尚不确定核心团队会被引入 Mozilla。Weiner 赞扬该团队将作为项目的一部分留任，项目将独立于 Mozilla 公司继续增长。无论如何，我们将负责所有权。我们的团队和现有的路线图已经加强，并且比以往任何时候都清晰。


    作为存储网页内容的中央枢纽，Pocket 还允许用户在获取内容时进行几次重大更新。当第一个 Mozilla 关联应用发布时，Pocket 最近发布了 iMessage
    应用，表明其业务如常。


    # 开源


    Linux 新闻与观点


    # 软件


    # Skype 视频通话服务进入测试阶段


    热门的视频通话服务正在获得势头。可以可以说，自从去年推出 Linux 版 Skype 以来，获得发布版本的进展相当缓慢。经过多次更新和新功能的加入，微软最近宣布
    Linux 版已进入测试阶段，一些改进的功能缩小了 Linux 客户端与 Windows 版之间的差距。


    “几个月前推出 Skype Alpha 版以来，我们一直在构建从点对点到现代云架构的新体验。我们希望创建一个功能丰富的 Linux 版 Skype。今天，我们宣布准备好迈出下一步，推广
    Linux 版 Skype 的![](img/a6a91935f07f13d62210d3016f91c5fc_9_0.png) 测试版，”Skype 团队在官方公告中表示。


    用户现在可以为 Skype 账户添加联系人。对于终端用户，这使他们可以使用账户进行通话，并与 Android、iOS 和 Mac 其他用户进行一对一通话。另一个用户请求的功能是允许自定义状态，这对于识别联系人是否处于‘勿打扰’或‘离开’模式非常有用。新的测试版可以在此处下载：www.skype.com/download/skype-for-linux


    更新的核心是增加了功能，让人们可以使用预付费账户。


    # 虚拟现实


    # Valve 发布 Linux 支持


    Linux 内容可能会登陆 HTC Vive。Valve 极大地提升了全球 Linux 用户的能力。所有开源支持将随着 SteamVR 的发布推出。在写作此时，尚不清楚哪些硬件支持。项目大部分处于测试阶段，目前的开发范围限于
    NVIDIA 驱动程序；AMD 显卡也是如此。所有必要的文档和 Linux 已问题的详情已发布在 Valve 的官方页面。


    NVIDIA 驱动是推荐的选择，稳定性是一个已知问题。广泛预计其他显卡将![](img/a6a91935f07f13d62210d3016f91c5fc_9_1.png)


    # 分发


    # Manjaro ARM 关闭嵌入式操作系统


    缺乏贡献者导致项目结束


    用于嵌入式设备的流行发行版 Manjaro ARM 将下月关闭。在最近的公告中，Manjaro 团队提到，由于贡献者意味着无法完成未来的更新。团队已经停止开发并发布新版本。直接从
    Manjaro 网站下载的所有用户将维护到网站关闭，用户根据需要可以自由更新项目版本。尽管发布了公告，Manjaro ARM 仍然是最常用的 Arch 发行版之一，开发团队已花时间概述了其关闭计划。


    # 内核


    # 11 年漏洞在最近的内核更新中被修复


    漏洞直到现在才被注意到


    我们在 Linux 内核中看到了许多安全修复，但有一个漏洞漏掉了相当长的时间。正如 CVE-2017-6024 所示，该漏洞一直追溯到 2006 年，当时内核因“数据时代”而闻名。在漏洞中，这是最危险的漏洞之一。它可以使用堆喷技术在内核中执行恶意代码。更令人担心的是，![](img/a6a91935f07f13d62210d3016f91c5fc_10_0.png)


    用户无法在 5 月期待未来的更新。尽管如此，Manjaro ARM 的论坛和官方网站将保持完全运行，不会丢失，因为团队表示他们希望与想要帮助 Manjaro
    ARM 项目未来发展的的用户讨论计划。感兴趣的伙伴应前往 https://manjaro-arm.org 网站获取更多信息。


    内核中的这类元素已与其他漏洞结合，可能允许黑客再次进行随机攻击。然而，为了讨论职业为 Google 研究员的 Andrey Konovalov 所的发现，修复程序现在已合并到内核开发中。Red
    Hat、Debian 和 Ubuntu 用户也受到了影响，但可以通过他们的网站直接获取必要的补丁。我们建议受影响的用户尽快下载这些补丁。


    # 发行版快讯


    # 前 10（平均每日访问量，2017 年 2 月 15 日至 3 月 15 日）


    1. Mint, 2718

    2. Debian, 1990

    3. Ubuntu, 1610

    4. Manjaro, 1481

    5. Zorin, 1328

    6. openSUSE, 1227

    7. deepin, 1041

    8. Antixos, 1010

    9. elementary, 998

    10. Fedora 917


    # 本月


    - 稳定版本（13 份），2 月（7 份）


    虽然我们本月有几个新版本要加入列表，但就下载量而言并非如此。


    # 亮点


    ![](img/a6a91935f07f13d62210d3016f91c5fc_10_1.png)


    # Manjaro Linux


    分析 ARM 分支（参见 Manjaro）。Manjaro 随着每次发布都在增长，提供了易用性和锁定功能。其最近的 15.5 测试更新目前为止是成功的。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_10_2.png)


    # elementary OS


    elementary OS 的简单性被证明是一个完美的特性。预计在未来几个月内会有更新，并在未来的期中提供更多信息。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_10_3.png)


    # 最新可用发行版：


    ```

    filesite.ux.com

    ```


