  mdcn: "\n\n# 评测新款戴尔 XPS 13\n\n# LinuxUser\nGNU 世代与开发者的必读杂志\n\n# 征服云端\n\n# 专业人士最佳\
    \ VPN\n使用安全隧道\n热火加密技术\n向你的 ISP 隐藏 Tor 流量\n\n- 最新云技术\n- 团队工具设置\n- 安全文件同步\n- 构建云办公\n\
    \n# 锁死你的 Web 服务器\n使用主动监控和反 XSS 及 SQL 注入措施确保 NGININX 安全\n\n# PI ZERO W 到货\n内部深度评测最新型号\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_0_0.png)\n\n# 采访真正的“机器人”\nMeARM Pi，孩子可以自己搭建的机器人臂\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_0_1.png)\n\n### 5 款媒体播放器\n我们精选的最优开源（FOSS）视频和音乐播放器\n\
    \n### 使用 Erlang 编程\n开发健壮的 TCP/IP 服务器和客户端\n\n### 更多精彩内容\n>> Ubuntu 安全\n>> 运行集群\n\
    >> Refracted（折射）\n\n### 冷存储你的比特币\n将你的树莓派运行为离线钱包\n\n# 群晖（Synology®）\n\n### 群晖路由器\
    \ RT1900ac\n为您家打造的智能 WiFi\n\n### Video Station DS216+II\n### DS216play | DS716+II\
    \ | DS216+II\n\n# 4K 转码与存储解决方案 \n### 4K 视频转码\n将 4K 视频转码以适用于所有屏幕和带宽，无论是本地媒体播放器还是远程移动设备。\n\
    \n### 将你的 NAS 变为媒体中心\n通过我们的系列应用程序，随时随地访问并共享存储在 NAS 上的所有媒体文件，适用于家庭或工作。\n\n### 存储并流传输你的媒体\n\
    轻松通过 Roku、Apple TV、Chromecast、三星 TV 以及所有蓝牙、Airplay 和 DLNA 设备流传输数字内容。\n\n了解更多请访问\
    \ www.synology.com\n\n可用移动 App\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_1_0.png)\n\
    ![](img/a6a91935f07f13d62210d3016f91c5fc_1_1.png)\n![](img/a6a91935f07f13d62210d3016f91c5fc_1_2.png)\n\
