    # The parameters of gen_tcp:listen()


    The parameters of a TCP/IP connection play a key in which way you are going to
    connect. The however, gen_tcp:listen/1 function allows a set of parameters that
    define the behavior of the application socket.


    Right The Wireshark program is a tool for debugging network applications and solve-related
    problems


    The binary option specifies whether the received packets are in binary format.
    Sockets are opened as either active, active once or passive. Setting the socket
    in active mode means that after receiving the first message it will need to be
    enabled again before being able to receive another message, which is not the case
    in passive mode (active,true). When a socket is in pass mode you will need to
    call get_tcp:accept/1 to read data from the socket. The advantage it enables you
    to control the flow of the data, which cannot be done in active mode.


