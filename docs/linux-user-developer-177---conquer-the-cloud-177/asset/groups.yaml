    via text message.


    07 Creating an instance at DigitalOcean

    This is a relatively straightforward process though there is a slightly different
    terminology - theOcean refers to ''droplets''. After selecting a droplet, you
    will be prompted for the distro (select Ubuntu 16.04.2 x64), the size ($5 option
    should be), the region and the name. To access the droplet, you need to use a
