    # 功能：征服云端


    # 使用 NEXTCLOUD 替换整个网络环境


    掌握文件、日历和联系人同步


    如果你正在寻找一种简单的方法，在自己的硬件上尝试云服务器——而不是查看 Google Cloud 服务（请参见后文），那么 Nextcloud 是一个极佳的尝试选择。Nextcloud
    由 owncloud 创始人 Frank Karitschke 创建，适用于任何机构，提供在 macOS、Windows 和 Linux 电脑上随时访问的自由。它还支持运行
    Android 和 iOS 的移动设备等。


    Nextcloud 基本上是一个开源云服务器，被设计为完整的云解决方案。文档、照片和联系人信息等数据存储在数据中心，并在策略允许的情况下从任何地方访问。Nextcloud
    还关注数据安全，并提供粒度管理以引导用户或服务器之间的数据流。同时，客户端应用程序由经验丰富的专业人士完全控制。你可以通过从网站安装或从 nextcloud.com
    下载来获取。


    ![](img/a6a1935f07f13d62210d3016f91cfcfc23_0.png)

    ![](img/a6a1935f07f13d62210d3016f91cfcfc23_1.png)


    压缩包包含一个你需要运行一次的可执行文件。之后，选择你的设置选项。如果你已经安装了 Nextcloud，请使用更新命令运行它并完成安装。


    字体 服务器用户存档压缩包

    - 管理员用户

    - 开发者

    - 测试人员

    - 适用于虚拟主机的 Web 安装程序

    - 易于部署的设备设备

    - 论坛


    Nextcloud 安装程序将启动一个向导，帮助你配置环境。Nextcloud 将检查你的系统是否符合要求。我们根据你的个人需求推荐这些内容。


    ## 01 安装服务器和客户端


    要开始 Nextcloud，你需要安装服务器和客户端。它们将是不同的设备，但你可以将 PC 或移动设备作为客户端。如前所述，还提供 Android 和 iOS
    的移动版本。运行 Windows 和 Mac 的企业也能访问存储器。你可以从你的光盘安装，或访问 https://nextcloud.com/install。


    ## 02 三种安装选项


    你可以在专用服务器、PC 或作为虚拟应用程序安装 Nextcloud。物理需求要求你检查完整性，同时也提供了通过 PGP 验证的选项。同时，为虚拟主机提供了
    Web 安装程序，而 Nextcloud VM 是在安全的虚拟环境中尝试它的极佳方式。我们建议使用此选项，以便于部署，并在你的 PC 上尝试。


    ## 03 解压虚拟机


    下载完虚拟机（这是一个 RAR 文件）后，你需要将其解压。为了实现这一点，你需要 unrar 工具：


    ```bash

    sudo apt-get install unrar

    ```


    安装完成后，如果虚拟机非常大且超出了我们的磁盘空间，它中还包含了为已经运行的用户提供的服务器安装程序——你需要使用以下命令解压 RAR 包：


    ```bash

    unrar Nextcloud_Community_VM.rar

    ```


    这将需要几分钟时间。文件为 VMX/VMDK 磁盘格式，因此你需要选择一个合适的虚拟机。


    ![](img/a6a1935f07f13d62210d3016f91cfcfc24_0.png)


    ## 04 运行虚拟机


    如果你想为机器添加硬盘，可以创建一个新的硬盘文件，或者使用文件夹从列表或其他位置选择一个。如果你需要更复杂的设置，可以跳过此步，并在机器创建后对设置进行更改。建议的硬盘大小为
    8.00 GB。


    - 不要添加虚拟磁盘

    - 创建虚拟硬盘

    - 使用现有的虚拟磁盘


    ```

    Nextcloud_Community_VM.vmx

    ```


    ## 05 在 VirtualBox 中运行 Nextcloud


    接下来，你需要使用 VirtualBox 运行 VMDK 镜像。在 VirtualBox 中，点击“下一步”，然后为虚拟机命名（例如 Nextcloud）。选择
    Linux 和 Ubuntu 作为操作系统。接下来，选择 8GB 虚拟磁盘，然后在虚拟设置中选择“使用现有硬盘”指向提取出的 VMDK 镜像。运行 Nextcloud
    机器，在 VirtualBox 中选择它并点击“启动”。


    > Nextcloud 遵循数据安全的行业惯例


    ![](img/a6a1935f07f13d62210d3016f91cfcfc24_1.png)


    ## 06 登录并配置 Nextcloud


    当 Nextcloud 服务器运行时，你需要登录。详情可以在 VMDK 上的文本中找到，并使用 cloudadmin 访问 Nextcloud。接下来，你需要提供少量的输入，例如
    IP 地址、键盘布局等，并且 LAMP 栈已经安装。随后你会被提示安装一个应用，有许多选项，如 Collabora Online（参见第22页），这对于小组项目非常有用。点击“确定”继续，遵循屏幕上的指令操作。


    ## 07 完成 Nextcloud 设置


    安装完成时，你将获得摘要/确认，并被提示安装 SSL 证书。这对于企业角色来说是一个好主意，但对于个人使用则没那么重要。之后，服务器需要重启，然后作为 Nextcloud
    设置运行。


    当服务器准备好访问时，安装桌面版（或移动客户端），创建一个新账户并开始使用 Nextcloud。设置已完成，但还有许多额外功能。


