    > SuExec cleans the environment by wiping out all environment variables except
    those marked as safe by the server''s configuration


    ![](img/a6a91935f07f13d62210d3016f91c5fc_43_0.png)


    module has installed, you will be greeted with 500 errors if you try to reload
    your CGI scripts - this is because of the security measures that are applied by
    SuExec. Don''t worry, this is easily resolved.


    create an appropriate place with the command sudo mkdir /home/scripter/scripts
    - SuExec is strict about who has permissions to write and execute in the directory,
    so we can transfer ownership and the right permissions with sudo chown scripter:scripter
    /home/scripter/scripts - sudo chmod 700 /scripts - Our user scripter will be able
    to write to it.


    # 08 Create a new user


    The next step of the process is to create a new user who will execute our own
    CGI scripts. If you have multiple sites, each user can have its own home directory,


    ```

    $ useradd -m -d /home/scripter scripter

    Adding new user: ''scripter'' with group ''scripter''

    Creating home directory: ''/home/scripter''

    Copying files from ''/etc/skel'' to ''/home/scripter''

    passed password ownership successfully

    $ chown scripter:scripter /home/scripter

    $ chmod 755 /home/scripter

    ```


    # 10 Create and copy the new script


    We will create a new script, but first we need to make sure it works under our
    new user, so we use sudo touch /home/scripter/scripts/test.pl

    Paste the following into the file we use to define the interpreter, "Content-type:
    text/html\n<html><head></head>

    <body>print(\Hello World!");</body></html>" to output the content. When we test
    the script in a few steps, it will work exactly as it did.


    ```

    $ touch /home/scripter/scripts/test.pl

    $ chmod 700 /home/scripter/scripts/test.pl

    $ chown scripter:scripter /home/scripter/scripts/test.pl

    ```


    and use. Hit the Enter key at each piece of information prompted - im not explicitly
    logging in as the user, so that is fine. Setting the user will automatically create
    the appropriate home directory, which we will use in the next step.


    ```

    $ su -s scripter -d /home/scripter /home/scripter/scripts/test.pl

    ```


    # 11 Make the executable


    Now we''ve tested the script, we need for it to be executable. We also need to
    ensure that our new scripter is the one that has permissions to the file. To do
    this, we need to use the command chmod 700 /home/scripter/scripts/test.pl. We
    will now set everything up in the web-data user home directory, so the only way
    this script will correctly run via SuExec.


