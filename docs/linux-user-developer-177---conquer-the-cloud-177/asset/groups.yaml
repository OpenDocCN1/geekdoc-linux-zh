  - '[PAGE 64]


    # 16 Prepare for Algo


    To prepare for Algo, start by downloading the source from the git repository with
    the command clone https://github.com/TrailOfBits/Algo.git or a ZIP download. Open
    config.cfg to find a line edit and specify the users you wish to create in the
    ''users'' list.


    ```

    $ git clone https://github.com/TrailOfBits/Algo.git

    cd algo

    ```


    To add more users, edit the file and restart the service. To remove users, delete
    the line from the list and restart the service.


    # 18 Deploying Algo


    Now that you have the virtual environment, you''re ready to start Algo. From the
    main source directory, /algo, you will be prompted to choose which version to
    install. If you want to deploy to multiple previously prepared VPS, you will need
    to re-run the Ansible playbook manually - full details on how to do so are on
    the site. Use Stressand, you can also deploy Algo locally (directly on the target).


    # 17 Installing Algo-requirements


    Pre-requisites setup is something less demanding - you will just need Python,
    and a Python environment present. If you''re already set up for Stressand, you
    will need to set up a new virtual environment with pip install virtualenv && virtualenv
    venv && activate pip install -r requirements.txt. The virtual environment configured
    here and launched with /bin/activate must be running whenever you are running
    Algo.


    # 19 Connecting to an algo server.


    When the Algo deployment finishes, you''ll see a message confirming that everything
    has completed and detailing the location of the created config files. Also displayed
    on the screen are your private and public keys. Keep them somewhere safe! The
    private key files will enable you to connect to the algo server using a suitable
    Stressand connection for your chosen platform. Profile files will be created for
    Apple devices, a Powershell script will be prepared for Windows and Android clients,
    so use Stressand for Android.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_64_0.png)'
  - '[PAGE 65]


    # Feature VPNs and VPSPs


    ![](img/a6a91935f07f13d62210d3016f91c5fc_65_0.png)


    # OPENVPN $4.99/mo


    ![](img/a6a91935f07f13d62210d3016f91c5fc_65_1.png)


    # 20 Ensuring traffic goes via your VPN


    After you have connected to your VPN, you need to ensure that traffic is being
    routed appropriately. You can either check My IP online or check manually. For
    a more detailed breakdown, use My IP in your browser, which will show your IP
    and ISP. This is a handy tool, if you are configuring split tunnelling, to determine
    which route your VPN is tracking.


    # Backups


    Backups are created automatically. They are scheduled to restart weekly Sunday
    8 PM to Monday 7 AM. Backups for Dropout cost $2.00 per month.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_65_2.png)


    # Dropplet backups


    ![](img/a6a91935f07f13d62210d3016f91c5fc_65_3.png)


    # 21 Do you need to back up your VPN?


    After you''ve deployed your VPN server, it''s worth considering whether you should
    snapshot or back up the box. Most VPS providers offer cheap or free snapshots,
    but if you need to revert the matter changes, you can. The reality is that backing
    a box is not a massive amount of effort, if you don''t choose to do it, it''s
    not much of concern.


    # 22 Alternative services


    Streandish, in particular, is a number of services that stand out alternatives
    to the most common L2/spec and OpenVPN. Shadowsocks is a high-performance SOCKS
    proxy that is super-fast, mobile-ready and incredibly easy to set up using a QR
    code. OpenConnect, an open source implementation of Cisco, is an excellent and
    lightweight VPN server that also features full compatibility with the AnyConnect
    clients.


    # 23 Setting up a home or business VPN


    If you want to set up your home or business, VPN you have a couple of options.
    You could use the router that you have but it may not be the best, particular
    if your router is provided by your ISP. In this instance, there are a couple of
    options – you could either replace the router with something that supports a VPN
    server or deploy a Linux machine on your network and forward ports. A simple setup
    dont need to be powerful, even a cheap Raspberry Pi can do it!


    # 24 Installing VPN


    If you have a Raspberry Pi 1, 2 or that is running Raspberry OS or Jessie Lite,
    you can install OpenVPN from vpn.io. You can install it by simply running `curl
    https://://pn.io/install | bash` on your Pi. Then you''ll be prompted to customize
    a number of options such as the VPN port (which you''ll need to forward) and then
    the installation will be complete. You can run the VPN utility until you need
    to make any changes.


    # The PiVPN Project


    Secure connection for your servers. Low cost, high security.


    | General | Wi-Fi | IPv6-Fi Security | IPv4 Settings | IPv6 Settings |

    |---|---|---|---|--|

    | Automatically connect to network when it is active | | | | |

    | All users may connect to this network | | | | |

    | Automatically connect to VPN using this connection | | | | |

    | VPNpn-USA-Chicago | | | |


    # 25 Auto connecting VPNs in Linux


    After you have configured a VPN connection on your Linux machine, you will notice
    that in your network settings, there is an option to automatically connect a VPN
    using the chosen connection. This is helpful trick for your coffee shop situation
    – set up your machine so when you are connected to a public Wi-Fi, the VPN automatically
    fires up, but when you are at home, it connects as normal.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_65_4.png)'
