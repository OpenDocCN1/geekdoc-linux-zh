    ```\n\n保持系统更新也更好。为了配置 SSL 频繁发布的安全补丁，并备份和更新已安装的包：\n\n```bash\nsudo apt-get update\
    \ && sudo apt-get upgrade\n```\n\n## 02 防止信息泄露\n\nNGINX 服务器以 HTTP 头的形式暴露了大量数据。例如，使用以下命令检查操作系统：\n\
