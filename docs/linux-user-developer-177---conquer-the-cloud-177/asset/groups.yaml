    \ OS 细节。为了隐藏这些，编辑后端的 php.ini 文件：\n\n## SSL 配置\n\n为了加固你的 Nginx 服务器，首先检查服务器是否启用了\
    \ HTTPS。编辑 Nginx 配置文件的 server 块：\n\n```bash\nsudo nano /etc/nginx/sites-enabled/default\n\
    server {\n    listen 80 default;\n    listen [::80] default;\n    ipv6_only;\n\
