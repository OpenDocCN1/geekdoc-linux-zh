    # Drobo 5N


    为您的网络提供更快速、更简单的 Drobo。一个简单、安全的设备，用于共享和备份您网络上的每一份数据。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_0.png)


    # 简单


    # BeyondRAID


    | 正常 |

    | 正常 |

    | 扩展存储 |

    | 正常 |

    | 更换硬盘 |


    # 自愈、自管理全方位保护


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_1.png)


    # myDrobo 平台


    DroboAccess: 就像拥有您的个人云。DroboPix: 自动将您的照片和视频上传到您的 Drobo。


    # 无需：


    - 管理您的数据

    - 购买特定的硬盘

    - 成为存储专家


    # 现在已发售：


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_3.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_4.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_4_5.png)


    # 光盘中的开源内容


    # 本期您的免费 / DVD 中包含


    # 探索您免费光盘上的内容


    **欢迎使用 Linux 用户与开发者 DVD。** 对于出版物来说，这是一个奇特的时刻，因为我们正在等待每半年一次的 Ubuntu “马戏团”到临。在此期间，我们选择了几个发行版中的异起之星与
    Ubuntu 16.10 并列。Antheros 和 Solus 在过去一年中都变得很重要，作为对我们云功能的致敬，我们包含了 Peppermint 7 和三个出色的平台。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_0.png)


    # 加载 DVD


    要访问软件和教程文件，只需将光盘插入驱动器并双击光盘图标。


    # 现场启动 (Live boot)


    要进入此光盘提供的发行版进行现场启动，请将光盘插入驱动器并重启电脑。


    请注意：


    - 您需要确保您的电脑已设置为从计算机的 BIOS 屏幕启动，以“更改启动选项”（Change Boot Options）

    - 如果您想按键从光盘进行现场启动，请检查制造商网站以确认是否支持此功能

    - 现场启动的发行版来自光盘；除非您选择安装，否则它们不会被安装


    # 特色软件：


    # Ubuntu 16.10


    准备好在下期光盘中自动升级到 Ubuntu 16.10。前往“设置 > 软件与更新”，设置“有新 Ubuntu 版本时我”（LTS+2）并输入 **update-manager**
    - 更新管理器将在发布新的 LTS 时通知您。点击“升级”并按照屏幕上的指示操作。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_1.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_3.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_4.png)


    # Antheros


    基于 Arch Linux，它的设计时尚，让新手也能接触 Arch，并包含了开箱即所需的一切。


    # Solus


    受 Chrome 启发，Solus 迅速成为简单性和与 Google 卓越集成典范之一。


