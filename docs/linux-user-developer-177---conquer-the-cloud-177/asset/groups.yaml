    \ -days 指定证书的有效天数。newkey 选项指定在创建新证书的同时创建一个密钥。最后，keyout 和 -out 选项分别指定密钥和证书的输出位置：\n\
    \n## 设置防火墙\n\n只有通过密码认证才能使你的 Web 服务器漏洞变得意义。例如，如果你的网站是 WordPress CMS，管理页面密码可能被绕过。你可以将管理页面访问限制为你的\
