  - "[PAGE 44]\n\n# 12 Update virtualhost with scripts directory\n\nAs we are changing\
    \ the location of the scripts directory, we need to update our virtual host file\
    \ - so say, edit the default virtual host file /etc/apache2/sites-enabled/000-default,\
    \ and change the ScriptAlias to /home/user/scripts/. The ScriptAlias command actually\
    \ needs the opt for Options +ExecCGI, this is strictly needed only when you restart\
    \ apache.\n\n```\n```apache\n<Module module_cgi.so>\n  LoadModule cgi_module /usr/lib/apache2/modules/mod_cgi.so\n\
    </Module>\n<Module module_env.so>\n  LoadModule env_module /usr/lib/apache2/modules/mod_env.so\n\
    </Module>\n<Module module_rewrite.so>\n  LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so\n\
    </Module>\n<Module module_proxy.so>\n  LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so\n\
    </Module>\n```\n```\n\n# 13 Set the user in virtual host\n\nMost of all, we're\
    \ going to need to add a new line to the SetOptions UserGroup scripter-user -\
    \ this suss out the user who owns the virtual host file and, as we discussed before,\
    \ which group the script will run as. There's only one thing left to configure\
    \ before we are ready to test!\n\n```\n```apache\n# /etc/apache2/sites-enabled/000-default.conf\n\
    <VirtualHost *:80>\n  ServerName localhost\n  DocumentRoot /var/www/html\n  ScriptAlias\
    \ /cgi-bin/ /home/user/scripts/\n  Options +ExecCGI\n  SetOptions UserGroup scripter-user\n\
    </VirtualHost>\n```\n```\n\n# 14 Set SuExec directories\n\nRemember that in the\
    \ tutorial, we were talking about installing a custom version of SuExec and how\
    \ we could use custom virtual directories? Edit the SuExec configuration file\
    \ /etc/apache2/suexec/www-data and add the line /home/user/scripts/. Now we will\
    \ recognise our script's subdirectories as a valid place from which to run CGI\
    \ scripts. If you are setting up additional users this is an easy step to forget\
    \ and if you do not omit step, doing so will result in a 500 error from Apache.\n\
    \n# 15 Restart Apache and test\n\nEverything is set, so let's test! Restart Apache\
    \ (service apache2 restart) and try reloading the page as before - http://yourdomain.com/cgi-bin/test.\
    \ If you see the correct output, then SuExec is working correctly. Check the Apache\
    \ log (tail /var/log/apache2/error.log) for any steps you may need to take or\
    \ what could be the cause of the problem. You can also manually check your script\
    \ by the command line.\n\n# 16 SuExec and general config\n\nIf you have existing\
    \ CGI configuration for your server, remember that after you have configured SuExec,\
    \ you might not work fine on other Virtual Hosts, so be careful. This is because\
    \ existing configurations might have various constraints that SuExec requires.\
    \ If you realise that this is causing an issue, you may disable the SuExec module\
    \ to restart the server.\n\n# 17 SuExec and the cleaned environment\n\nMentioned\
    \ earlier in this that environment cleaning occurs - which is security reasons.\
    \ SuExec works by allowing all environment variables marked as safe in mod_env.vars\
    \ which is not what we need. The safe variables are effectively defined at compile\
    \ time, so you cannot change them without compiling the module. Some workarounds\
    \ are available, but they are considered - if you are developing the application\
    \ use, of environment variables is best\n\n# 18 Troubleshooting\n\nIf you are\
    \ having trouble with SuExec, where to start your debugging? Aside from the forbidden\
    \ main error log, you can also check a /var/log/apache2/suExec.log - this may\
    \ provide clues. Remember: your script must\n\n```\n```bash\n# /etc/apache2/suexec/www-data\n\
    www-data:www-data:/home/user/scripts\n```\n```\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_44_0.png)\n\
    \nhave the same user/group ownership as the parent folder, and no other users\
    \ should have permissions to the file (or folder) at all. Finally, don't forget\
    \ to update /etc/apache2/suexec/www-data file - particularly when adding users\n\
    \nwww.linuxuser.com 45"
