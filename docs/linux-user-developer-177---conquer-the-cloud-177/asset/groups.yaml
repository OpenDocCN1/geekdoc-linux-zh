    # Feature Conquer the cloud


    # CONQUER THE CLOUD


    It''s time to tackle cloud technologies – it''s now a huge business and offers
    significant advantages for data storage, productivity and personal development'
  - '[PAGE 18]


    # WHY CLOUD?


    The advantages of specialising in Linux technologies are obvious. Perhaps you''re
    already working as a Linux professional, supporting a Linux network or end users,
    or you might simply be a beginner towards FOSS computing.


    For organisations moving towards FOSS - either in the server room or out in the
    offices - having Linux and open source professionals on role is a major advantage.
    Skills in Linux were their top priority in the last Linux Foundation Job report
    (2016) - especially when it came to service continuity.


    Even those businesses with Linux networks might benefit from adopting a single
    Linux cloud-based technology. Such technologies might be


    as straightforward as a cloud desktop, as important as a cloud-based office suite,
    as useful as cloud syncing or vital to the running of the organisation as a virtual
    server. Whereas, if you''re already a Linux pro, you''ll need to get on board
    cloud-based apps and services. This might mean setting up a view virtual machines
    for extra-curricular cloud dektops or requesting training from your manager.


    Either, the cloud is where current enterprise-level IT support is heading, so
    if you''t already mastered cloud storage, cloud desktops and virtual cloud servers
    now is the time to start.


    > It''s funny to think that your everyday tasks, or your hobby, can improve your
    job prospects.


    But developing skills in Linux and open source can do just as much. A report from
    the Linux Open Source Skills in 2016 shows that 51% of managers are looking for
    Linux professionals with cloud skills. You''re not already using at least one
    cloud technology, so how can you leverage this knowledge to improve your resume?


    As with anything, it comes about competence, and as long as your demands require
    Linux-related cloud tools and services, you should be able to impress enough to
    win an all-important interview - and perform the job.


    But cloud technologies aren''t just Dropbox-style storage and synchronisation.
    While this terecht comes


    into it, there are other cloud services and applications that you can try, such
    as cloud-harness Linux distributions (distros) such as Peppermint 7 (which we''ve
    included in recent reports).


    Getting a good job is also about impressing the hiring manager. Skills anyone
    can bring, such as desktop support and hardware repairs, are unlikely to make
    you stand out. Knowledge of working with cutting-edge FOSS cloud distributions,
    such as CODE, Collabor''s project for running LibreOffice Online in the cloud
    and setting up your own cloud server using Nextcloud 11 for your family or a local
    charity will highlight you as a potential hire. In short, these are the technologies
    you can quickly familiarise yourself with in order to grab the bill by the horns
    and get some experience under your belt.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_18_0.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_18_1.png)


