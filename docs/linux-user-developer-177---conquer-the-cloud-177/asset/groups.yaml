    # OpenSource


    您的 Linux 新闻与观点来源


    ## 观点


    ## 内核专栏


    Jon Masters 总结了 Linux 内核社区的最新动态


    Linus Torvalds 宣布了 Linux 内核 4.1 版本的第二个 RC（发布候选版本）。在公告中，Torvalds 对 4.1 合并窗口（允许更改的时间段）的关闭感到很高兴。这篇简报也是他上周发送给
    LKML（Linux 内核邮件列表）的一封邮件，其中包含了一段长长的控诉，指责某些内核贡献者未能建立一种实践：对新功能进行浸泡测试（soak-testing），使其在
    `next` 分支中持续一整个开发周期，然后再被拉入下一个内核。


    在对 4.1 合并的分析中，Linus 注意到，他看到的提交并没有跟踪从一个维护者的开发树到另一个维护树或 Linux 主树的合并，且并未出现在 `next`
    中。他表达了些困恼，认为那些没有使用 `next` 的人应该知道 `next` 合并窗口很快就会开启。有趣的是，有人通过 `linux-next` 流程提前请求了计划在
    4.12 中上线的特性初始启用。


    从现在起，4.1 包含了一些新功能，大多数功能对终端用户（企业和移动开发者除外）影响不大。这些包括对支持该性的三元 MONITOR/MWAT 调用的支持、各种性能优化（包括
    IRID 评审），以及带有初始 SMP 支持的 RISC-V 架构。正如预期的，还有常规的通用修复以及适用于任何内核的新驱动程序。让我们顺序来看这三个例子。


    第一个功能允许应用程序（例如针对 NFV 和实时系统）使用特殊的 MONITOR/MWAT 指令，这些指令之前仅供特权内核代码使用。MWAT 是一种高性能机制，通过该机制，“v8”处理器（其他地方也类似机制）可以被指令临时等待内存位置的变化，而无需显式地循环检查其值变化。必须注意其对系统稳定性的影响，但它可以节省能量并提高应用程序性能。该实现是目前正在进行的核心代码众多性能改进示例之一。


    GRID 提供了一个小型指针翻译服务，传统上使用固定大小的表格进行快速查找，或将进程 ID 转换为数据结构。该实现与内核现有的基数树（radix trees）支持和谐共存，后者使用了底层机制。这种功能是许多开发者新观察到的，并增加了内核的整体质量。


    最后，对 RISC-V 架构的评审显示，正如所预期，考虑到需完成的工作量，RISC 和 RISC-V 开放式计算机架构正接近稳定规范，已有多个硬件实现使用
    Verilog 编写。这是一种硬件描述语言（HDL），用于指定可以在 FPGA（现场可编程门阵列）中运行的逻辑门。


