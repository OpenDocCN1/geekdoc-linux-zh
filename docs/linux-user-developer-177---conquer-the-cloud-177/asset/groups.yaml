    with some expertise, this could be used as a project to refresh their skillset.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_13_0.png)


    # How integral has the Raspberry Pi been in the development of the project?


    The Raspberry Pi is open to the running of the MeArm Pi and all of its core functions.
    The motors are controlled directly from the GPIO pins and we dedicate two pins
    on the Pi as well. The software is a Node.js service that allows you to use the
    joystick or control it through a web API, which is all of the built-in apps use.
    We love Node.js as service, as it''s once again a relatively simple piece of kit
    for new users to learn and develop with.


    # Programming with MeArm Pi


    Getting to grips with the development process before the MeArm couldn''t be simpler,
    and there are a few ways for users to get stuck in it. For one, the MeArm uses
