    \ at ArubaCloud\nAfter you've logged into ArubaCloud control panel, you can choose\
    \ from many different locations: Italy, Czech Republic, France and the UK. By\
    \ selecting your location before pressing 'Create Server' - select server, choose\
    \ template (select Ubuntu 16.04 LTS), enter root username and give the server\
    \ a name.\n\n### 08 Login password or SSH key\nDifferent people prefer different\
    \ options for authentication with your server. DigitalOcean requires you to upload\
    \ SSH key. On your Linux machine, this can be found in ~/.ssh/id_rsa.pub in your\
    \ home directory. If this file does not exist, enter ssh-keygen -t rsa (you can\
    \ hit through all the prompts). SSH key is much less to be compromised than password!\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_62_2.png)\n\n### 06 Signing up at DigitalOcean\n\
    DigitalOcean is a more civil affair. You'll sign up for a single account and receive\
    \ $10 credit for first two months. Even better, for each person refer to DO, you\
    \ will receive further $25 credit. A standard account is limited to 25 instances,\
    \ or you can get this limit increased.\n\n### 09 Signing up at Amazon Lightsail\n\
    You've heard about Amazon Web Services, cloud hosting platform owned by the retail\
    \ giant. Lightsail is a relatively new offering to take on the likes of DigitalOcean\
    \ and Linode. It uses the same platform as Amazon for more offerings such as EC2,\
    \ but greatly simplifies the whole process. You'll sign up for an AWS account\
    \ in order to use Lightsail.\n\n# Feature VPNs and VPSs\n\n# Create an instance\n\
    An instance is a virtual server.\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_0.png)\n\
    \n# Creating at Amazon Lightsail\nYou will be able to access the main Web panel\
    \ with your new VPN. Lightsail has a simplified interface. For beginners, just\
    \ click on 'Create instance' button, choose your OS and plan. The $5 plan is tagged\
    \ as 'first month free', which we need. Choose deployment zone, name your instance\
    \ and press the create button.\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_1.png)\n\
    \n# Package configuration\nInstalling software on a frequent basis is an important\
    \ part of maintaining system security. You can install what you need using package\
    \ management tools. Alternatively, you can choose to have your system automatically\
    \ install and stable updates.\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_2.png)\n\
    \n# Preparing your Ubuntu instance\nRegardless of how you have launched your instance,\
    \ there are a few steps to complete before you deploy the VPN server. First, use\
    \ apt-get update & apt-get upgrade to ensure everything is up to date. Look through\
    \ the installed packages to set up your VPN server as quickly as possible. Finally,\
    \ use sudo apt install unattended-upgrades to set up automatic updates on your\
    \ server.\n\n```\nsudo apt-get update\nsudo apt-get upgrade\nsudo apt install\
    \ unattended-upgrades\n```\n\n```\napt-get update\napt-get install -y git build-essential\
    \ libssl-dev zlib1g-dev libncurses5-dev-utils libffi-dev libsqlite3-dev python3-dev\
    \ python3-pip python3-venv curl wget libxml2-dev libxslt-dev libreadline-dev\n\
    ```\n\n# Installing prerequisites\nTo deploying stretchraid from a Linux box,\
    \ you need to install id_rsa_key, install git (so you can download the Stretchraid\
    \ from the repo), install the package management system for Python and Ansible\
    \ (for running the deployment scripts). You only have to do this once.\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_3.png)\n\
    \n# Download and prepare the script\nNow you have the prerequisites met, download\
    \ the script from the repository with git clone: https://github.com/jland/stretchraid.\
    \ If you want to deploy a new instance of one of the providers listed, you are\
    \ ready to go. If you want to deploy your own server, you just follow the final\
    \ two steps and add your instance's IP address.\n\n```\n# user paul@stretchraid-key\
    \ ~ \ngit clone https://github.com/jland/stretchraid.git\nCloning into....\nCounting\
    \ objects: 100 (delta 90), pack-rere: 90\nReceiving objects: 100% (100/100), 1\
    \ MB\nResolving objects: 100% done\ndone\n```\n\n```\n# git clone https://github.com/jland/stretchraid.git\n\
    ```\n\n```\ncd stretchraid\n```\n\n```\nansible-playbook deploy.yml\n```\n\n#\
    \ Deploying\nIt's time to go! For the standard scenario, use the command cd @stretchraid\
    \ or to deploy to your own server, use the ansible-playbook ./playbooks/stretchraid.yml.\
    \ You will use the ansible-run script, which will handle everything between 10\
    \ and 20 minutes. If the process is interrupted, just restart the script and everything\
    \ will proceed fine. When the process is complete, your HTML files will be created:\n\
    \n> Welcome to the Stretchraid Gateway. You are only moments away from an uncommon\
    \ connection\n\n# STRETRAID\n\n# Connection Issues\nThere are many ways to connect\
    \ to us, Streraid provides several choices and different protocols in the event\
    \ that any of them are restricted. Here are the options listed here below:\n\n\
    - OpenVPN\n- OpenConnect / Cisco AnyConnect\n- OpenVPN (direct)\n\n# Connecting\
    \ to a server\nThe final file created by the installation process will be in a\
    \ subdirectory on your machine. This file details how to download and authenticate\
    \ the SSL certificate for your new instance's NGINX. You can then use your new\
    \ server for details how to connect to the VPN. A number of protocols are provided\
    \ in the instructions for a head of different platforms, so you can experiment\
    \ to find the right solution for you.\n"
  mdcn: "\n\n# Algo 是 Streand 工具的流行替代方案\n\n虽然 Streand 是一个流行且频繁使用的替代方案，但它并非独一。Algo\
    \ —— 是一组 Ansible 脚本，用于设置大多数人需要的 IPv6 VPN 或或其他服务器配置。它包含了安全的默认设置，支持许多常见的提供商，至关重要的是，它在大多数设备上不需要客户端软件。\n\
    \nAlgo 比 Streand 流行得多，这是它的主要优势。Algo 支持使用单一加密算法 AES-GCM 的所有 IKEv2，而且你不需要安装 Tor。它有一点“风险”，而且在大多数设备上不需要客户端软件。Algo\
    \ 的设置也比 Streand 容易得多，后者可以使用 use-post 来更新用户列表。\n\nAlgo 具有可选功能，例如通过本地 DNS 解析器进行广告拦截。\n\
    \n# WireGuard\n\nWireGuard 是一种创新的 VPN 选项\n\n现今使用的许多 VPN 协议已经存在很长时间，并且可以即时完成。你只需要快速设置好\
    \ Streand 和 Algo 即可——关于项目中应该包含哪些服务和协议，有很多讨论，但对这一问题尚未达成共识。也许 WireGuard 才是答案？\n\n\
    WireGuard 是一种极其简单且快速的 VPN，利用了最先进的加密技术。它的目标是比 IPSec 更快、更简单、更精简、更有用。它的设计旨在始终优于 OpenVPN\
    \ 标准。WireGuard 被设计为一种通用 VPN，运行在各种平台上适用于所有类型的使用。\n\nWireGuard 比 OpenVPN 快得多，由于它现在是\
    \ Linux 内核的一部分，它经过了大量的开发，已经被许多用户视为历史上最安全、最易用且最简单的 VPN 解决方案。\n\nWireGuard 网站有一份安装产品的指南，当然，有两个选项：从源码编译或从包安装。为\
    \ Ubuntu 提供了 PPA，如果你使用的是 Debian、Arch、Fedora/CentOS、OSSE 或任何其他发行版，也适用。如果你准备好了，安装非常简单。\n\
    \nWireGuard 不仅仅是一个协议——它是一种革命性的 VPN 配置方式，正受到关注。凭借其作为简单网络接口的巧妙实现、极高的性能和最小的攻击面，它可能是未来的\
    \ VPN 解决方案。\n\n对于 Streand，该项目是开源的，并不断通过修复和改进进行更新。\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_60_0.png)\n\
    \n# 功能 VPN 与 VPS\n\n# 指南：设置你的 VPN 和 VPS\n\n启动你的第一个 VPS 或 VPN 并不令人畏畏\n\n你已经读过关于不同的\
    \ VPN 选项，以及为什么 VPN 是 Linux 装备库中非常有用的工具。在指南中，我们将带你通过几个不同的提供商来设置和配置 VPS，然后根据你的需求安装\
    \ WireGuard 或 Algo，最后配置你的客户端连接到你的新 VPN。\n\n那么，你在哪里部署你的 VPS 呢？最好的提供商都提供一些免费试用，所以你可以运行\
    \ VPS 一个月甚至更久。ArubaCloud 是我们最便宜的，提供带有 1 vCPU、1GB RAM、20GB 存储空间和 1TB 带宽的 Ubuntu\
    \ VPS 服务器，使用欧元额度每月仅 1 欧元。缺点是管理界面在最好的控制面板中不算太理想。DigitalOcean 提供带有 1 vCPU、512MB\
    \ RAM、25GB 存储空间和 1TB 带宽的服务器，每月每月 5 美元，注册时赠送 10 美元额度。这两家提供商都有多个欧洲数据中心。\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_61_0.png)\n\
    \nAmazon Lightsail\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_61_1.png)\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_61_2.png)\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_61_3.png)\n\n### 01 使用哪个 VPN 平台？\n\
    在决定使用哪种 VPN 平台时，你应该考虑哪些因素？\n一个好主是加载每个选项的主页并阅读，看看它们提供了什么。\nWireGuard 是一个全功能功能的的绝佳方法。如果你想保持精简且不要在服务器上增加太多东西，它也能保持简单和安全。既然有许多便宜的\
    \ VPS 可选，为什么不试试呢？\n\n### 02 决定你的 VPS 平台\n现在你已经决定了要什么，请决定使用哪种 VPS 平台。之前提到过许多提供商提供免费试用。明智的做法是查看你将使用的管理界面以及哪些提供商受到支持。所有都可以部署，Ubuntu\
    \ 部署是最简单的选项。\n\n### 03 你想把服务器放在哪里？\n另一个考虑因素是你希望你的物理服务器位于哪里？这个问题取决于你想如何使用它。如果你希望你的\
    \ VPN 位于英国，那么 Lightsail 是理想之选。如果你希望在美国，它也是理想的。DigitalOcean 在荷兰、新加坡、美国、伦敦和印度有数据中心。\n\
    \n# 每月 1.00 欧元的云 VPS\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_62_0.png)\n\n\
    ### 04 在 ArubaCloud 注册\n我们注意到 ArubaCloud 是最便宜的……要开始，访问 www.arubacloud.com 并点击\
    \ Cloud VPS 开始。你将被提示注册账户——一个用于客户（管理你的详情），一个用于控制面板（管理你的服务器）。提供免费试用——输入你的详情后你将获得欧元额度。\n\
    \n# 添加 SSH 密钥\n\n这是一个相对直接的过程，尽管术语不同——DigitalOcean 使用 'droplets'。在选择 droplet 后，你将被提示发行版（选择\
    \ Ubuntu 16.04）、大小（$5 选择）、区域和名称。访问 droplet 需要使用 SSH 密钥——这将作为部署的一部分被保存。\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_62_1.png)\n\
    \n### 05 在 ArubaCloud 创建实例\n登录 ArubaCloud 控制面板后，你可以从许多位置中选择：意大利、捷克、法国和英国。在点击“创建服务器”之前选择位置，选择模板（选择\
    \ Ubuntu 16.04 LTS），输入用户名和服务器名称。\n\n### 08 登录或 SSH 密钥\n不同的人有不同的验证方式。DigitalOcean\
    \ 要求你上传 SSH 密钥。在你的 Linux 机器上，可以在 `~/.ssh/id_rsa.pub` 找到它。如果该文件不存在，输入 `ssh-keygen\
    \ -t rsa`（你可以通过所有提示操作）。SSH 密钥比密码安全得多！\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_62_2.png)\n\
    \n### 06 在 DigitalOcean 注册\nDigitalOcean 更加文明。注册单一个账户在前两个月获得 10 美元额度。更好，每个人推荐\
    \ DO 将获得 25 美元额度。标准账户限制为 25 个实例，或者你可以增加限制。\n\n### 09 在 Amazon Lightsail 注册\n你听说过\
    \ Amazon Web Services，这家零售巨头拥有的云托管平台。Lightsail 是 DigitalOcean 和 Linode 的较新产品。它与\
    \ Amazon 的 EC2 等平台相同，但极大地简化了整个过程。你需要注册 AWS 账户来使用 Lightsail。\n\n# 功能 VPN 与 VPS\n\
    \n# 创建实例\n实例是一个虚拟服务器。\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_0.png)\n\n\
    # 在 Amazon Lightsail 创建\n你可以使用你的新 VPN 访问主面板。Lightsail 有一个简化的界面。对于学者，只需点击“创建实例”按钮，选择你的操作系统和计划。5美元计划标记为“首月免费”，这是需要的。选择部署区域，命名你的实例并按下创建。\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_63_1.png)\n\n# 包配置\n定期安装软件是维护安全的重要部分。你可以使用包管理工具安装所需的程序。或者，你可以让系统自动安装更新。\n\
    \n![](img/a6a91935f07f13d62210d3016f91c5fc_63_2.png)\n\n# 准备你的 Ubuntu 实例\n无论你如何启动实例，在部署\
    \ VPN 服务器之前都要完成几个步骤。首先，使用 `apt-get update` 和 `apt-get upgrade` 确保一切都是最新的。查看已安装的包以最快速度设置你的\
    \ VPN 服务器。最后，使用 `sudo apt install unattended-upgrades` 在你的服务器上设置自动更新。\n\n```\n\
    sudo apt-get update\nsudo apt-get upgrade\nsudo apt install unattended-upgrades\n\
    ```\n\n```\napt-get update\napt-get install -y git build-essential libssl-dev\
    \ zlib1g-dev libncurses5-dev-utils libffi-dev libsqlite3-dev python3-dev python3-pip\
    \ python3-venv curl wget libxml2-dev libxslt-dev libreadline-dev\n```\n\n# 安装前提条件\n\
    要在 Linux 节点部署 stretchraid，你需要安装 `id_rsa_key`、安装 git（以便从仓库下载 Stretchraid）、安装 Python\
    \ 和 Ansible 的包管理系统（用于运行部署脚本）。你只需要执行一次。\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_63_3.png)\n\
    \n# 下载并准备脚本\n现在你已经满足了前提条件，使用 `git clone` 从仓库下载脚本：https://github.com/jland/stretchraid。如果你想部署列出的提供商之一的新实例，你已经准备就绪。如果你想部署自己的服务器，只需遵循最后两个步骤并添加你的实例\
    \ IP 地址。\n\n```bash\n# user paul@stretchraid-key ~ \ngit clone https://github.com/jland/stretchraid.git\n\
    Cloning into....\nCounting objects: 100 (delta 90), pack-rere: 90\nReceiving objects:\
    \ 100% (100/100), 1 MB\nResolving objects: 100% done\ndone\n```\n\n```\n# git\
    \ clone https://github.com/jland/stretchraid.git\n```\n\n```\ncd stretchraid\n\
    ```\n\n```\nansible-playbook deploy.yml\n```\n\n# 部署\n该出发了！对于标准场景，使用命令 `cd @stretchraid`；或者部署到自己的服务器，使用\
    \ `ansible-playbook ./playbooks/stretchraid.yml`。你将使用 ansible-run 脚本，它将处理 10 到\
    \ 20 分钟。如果过程被中断，只需重启脚本，一切都会正常运行。过程完成后，你的 HTML 文件将创建创建\n\n> 欢迎来到 Stretchraid 网关。你离非凡连接仅一步之遥。\n\
    \n# STRETRAID\n\n# 连接问题\n有很多方法可以连接我们，在任何一个受限的情况下，Streraid 提供了多种选择和不同的协议。列出的选项如下：\n\
    \n- OpenVPN\n- OpenConnect / Cisco AnyConnect\n- OpenVPN (直接)\n\n# 连接到服务器\n安装过程创建最后一个文件位于你机器上的子目录。该文件详细说明了如何下载并验证新实例\
    \ NGINX 的 SSL 证书。然后你可以使用新服务器获取如何连接 VPN 的详情。说明中为不同的平台提供了许多协议，因此你可以尝试以找到适合你的解决方案。\n\
    \n"
