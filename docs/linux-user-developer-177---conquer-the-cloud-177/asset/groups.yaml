    # 教程


    #制作比特币冷钱包


    将你的比特币“冷冻”，并使用树莓派作为冷钱包来离线安全存储你所有的数字货币


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_0.png)


    Nate Drake

    是一位自由职业财经记者，专攻网络安全和复古技术 @natewriter


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_1.png)


    > 你需要准备

    适用于所有型号的 Pi（推荐使用 Pi Zero）。出于安全考虑，你需要为此项目准备一个专用的树莓派。


    你可能已经知道，加密货币比特币可以用于匿名且不可逆转的支付，类似于现金。但对于注重隐私的人来说，它是数字货币这一事实意味着黑客经常针对比特币软件钱包的所有者。在教程中，我们将探索一种在树莓派上使用轻量级
    Bitcoin Wallet Electron 的解决方案。树莓派将始终离线保存你的私钥。


    你还需要在另一台电脑上设置一个在线“观察”钱包，以接收收到的付款。支付仅通过使用你的观察钱包生成交易来发送，然后通过 USB 闪盘手动将其传输到你的“冷”钱包进行签名。


    由于你的冷钱包是离线的，只有拥有物理访问权限的人才能进行支付，这让你能够安全地存储比特币。


    本指南假设你已经熟悉比特币的基础知识。如果不熟悉，请访问此教程介绍页 http://bit.ly/2tmCt2x 了解概述。


    出于安全考虑，你应该只将这台树莓派作为未来购买的钱包。


    仓库（repos）包含旧版本的 Electron 钱包，但最好手动下载最新版本。


    接下来，运行以下两个命令，使用 `sudo apt-get install python3-pip` 安装最新的钱包软件。使用 http://download.electron.org/2.17/Electron-2.17.tar.gz
    进行安装。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_2.png)


    ## 01 安装软件

    将树莓派连接到显示器和键盘。打开终端运行这两个命令：


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    ## 02 断开网络连接

    此步骤是为了确保你的钱包安全。移除连接到树莓派的任何网络和 Wi-Fi 适配器。如果你使用的是 Pi 3，只需点击 Pi 上的无线和蓝牙图标并选择“关闭 Wi-Fi
    和蓝牙”。保持树莓派连接显示器和键盘，你在发送支付时需要它们。离线后，在终端中运行 `electrum` 命令启动钱包。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_3.png)


    ## 比特币钱包


    10 个字符，混合字母、数字和符号。如果密码弱、中等或强，Ethereum 会发出提示。不要使用钱包中的任何单词作为密码。


    ### 匿名化你的网络连接


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_0.png)


    ## 06 导出公钥

    在 Ethereum Wallet 中，点击“Wallet”（钱包）菜单然后选择“Master Public Keys”（主公钥）。将其导出为可以在单独电脑上使用的字符串。


    默认情况下，任何监控你连接的人都可以连接到 Ethereum 网络。你的 IP 可能用于在“观察”钱包中识别你的身份。如果你在系统上运行 Linux，可以通过进入
    Tools（工具）> Network（网络）> ‘SOCKS’ 通过暗网连接。填写剩余信息后，点击“OK”。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_1.png)


    ## 03 生成钱包


    在第一个窗口选择“Auto”（自动），然后点击“Next”（下一步），在下一个屏幕选择“standard”（标准）New Seed（新种子）。为钱包生成 12
    个随机单词，程序要求将这些写在纸上。这些纸可以在树莓派发生任何故障时恢复你的钱包。点击“Next”继续。


    点击图标复制所有密钥，然后前往 Applications（应用程序）> Text Editor（文本编辑器）将其编辑为文本文件。使用 USB 闪盘并将新文件保存。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_2.png)


    ## 07 安装钱包

    从树莓派拔下 USB 闪盘，将其插入要作为“观察钱包”使用的电脑。出于安全考虑，我建议使用 Linux 而不是其他平台。如果你使用的是 Ubuntu 等基于
    Debian 的发行版，请确保使用 apt-get。对于其他平台，请按照 https://ethereum.org/ 的说明进行操作。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_3.png)


    ## 04 确认并存储种子

    确认种子后，你可以选择设置密码来保护树莓派上的钱包副本。在发送比特币时，你需要重新输入此密码。理想情况下选择至少 10 个字符的密码。将你写下的单词存储在安全的地方，或通过关联位置记住它们。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_4.png)


    ## 05 选择你的钱包密码

    在第一个屏幕选择“standard”（标准）钱包，在“Keystore”（密钥库）屏幕上选择“Private Keys”（私钥）。在下一个屏幕，粘贴来自 USB
    闪盘的主种子。读取警告并点击“OK”。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_5.png)


    ## 08 恢复主密钥

    在在线机器上启动 Ethereum 。在 Linux 中，你可以从终端运行 `electrum`。在第一个屏幕选择“Auth”（授权）并点击“standard”（标准）钱包。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_6.png)


    ## 09 设置地址

    主窗口打开时，Electrum 会为你生成地址，点击“Receive”（接收）标签查看你的地址。你会看到新地址的文本字符串和二维码。如果需要，为你的接收地址输入描述，然后点击“Save”（保存）。你可以生成更多地址。


    ## 13 签名交易

    在树莓派上打开 Electron 并点击“Tools”（工具）菜单。选择 Load Transaction（加载交易）> From，找到 USB 闪盘上的交易文件。交易详情将加载。检查一切是否正常。输入密码，然后点击“Save”将新交易文件存储到
    USB 闪盘。点击“OK”，然后是“Close”（关闭）并安全地拔下 USB 闪盘。


    ## 10 测试钱包地址

    使用你的比特币钱包向新地址发送资金。如果可能，使用支持扫描二维码的客户端，这样就没有发错地址的危险。一旦支付发送，未确认的新余额应显示在 Electrum
    窗口的左下角。你需要等待余额确认后再继续。


    ## 14 广播交易

    接下来你需要插入 USB 闪盘以同步“观察”钱包。打开 Electrum 并点击 Tools > Load Transaction > From。选择 USB
    闪盘上的签名文件。弹出一个新窗口，显示：


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_0.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_1.png)


    ## 11 设置发送

    现在你可以接收资金了，是时候测试你是否可以发送它们了。找到收件人的钱包地址。在本教程中，我们使用以太坊基金 (EEF) 的比特币地址发送捐赠。在 Electrum
    中点击“Send”（发送）标签并将地址粘贴到“Pay to”（支付给）字段。如果需要，添加描述然后点击“Preview”（预览）。


    交易详情。双检查并点击“Broadcast”（广播）将它们发送到比特币网络，你会看到确认消息。点击“Close”在 Electrum 窗口中查看未确认的金额。交易的处理时间将取决于你支付的手费。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_3.png)


    ## 12 保存交易

    在新窗口中点击“Save”查看 TXN（交易）文件，导航到你的 USB 闪盘并将其放在那里。Electrum 确认交易已保存。你可以点击“Close”关闭窗口。交易需要由树莓派上的钱包进行数字签名才能发送。


    ## 15 生成新地址

    为了防止交易被追踪，你应该通过点击 Electrum 的“Receive”标签来生成新的接收地址，点击“New”创建一个新的。如果愿意，添加描述后点击“Save”。在“Requests”（请求）标签中，重复步骤
    10-14 以接收和发送每个地址的交易。


    完成本教程后，你将设置好“冷”钱包、支付方法以及用于跟踪支付的在线“观察”钱包。


