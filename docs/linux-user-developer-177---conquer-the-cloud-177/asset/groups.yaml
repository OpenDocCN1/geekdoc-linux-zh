    **Welcome to the Linux User & Developer DVD.** It''s an odd time for publications
    as we are waiting for the bi-annual Ubuntu circus to roll into. In the meantime,
    we''ve opted for a few rising stars of the distro to sit alongside Ubuntu 16.10.
    Both Antheros and Solus have gained significance in the last year and as homage
    to our cloud feature, we''ve included Peppermint 7 and a trio of great platforms.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_0.png)


    # Load DVD


    To access software and tutorial files, simply insert the disc into your drive
    and double-click the disc icon.


    # Live boot


    To live-boot into the distro supplied on this disc, insert the disc into your
    drive and reboot your computer.


    Please note:


    +   - You will need to ensure that your computer is set up to boot from your computer''s
    BIOS screen to Change Boot Options

    - If you want to press a key to live booting from your disc, check your manufacturer''s
    website to find out if this is supported

    - Live-booting distros are from the disc; they will not install unless you choose
    to do so


    # Featured software:


    # Ubuntu 16.10


    Get ready for Ubuntu 16.10 next issue''s disc to automatically upgrade. Go to
    Settings > Software & Updates and set ''Notify me of a new Ubuntu version'' (LTS+2)
    and type **update-manager** - Update manager will inform you when a new LTS is
    released. Click ''Upgrade'' and follow the instructions on the screen.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_1.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_2.png)


