    # 关于 VPN 你想知道的一切


    事实：你无法阻止 GCHQ（英国政府通讯）或 NSA（美国国家安全局）追踪你，但你可以让这种追踪变得困难。虚拟专用网络（VPN）是保护两台电脑之间连接的重要工具，我们将帮助你选择最适合你的一个。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_56_0.png)


    # 为什么要虚拟化？


    你为什么想使用 VPN？隐私和安全担忧是建立私有网络最常见的原因，但不是唯一的原因。


    无论你是使用家庭宽带还是在国外漫游移动数据，你都有可能受到服务提供商采用的流量整形（traffic shaping），该技术用于限制其网络上的某些特定类型流量。例如，许多英国网络提供商会在内容匮乏时通过整形来限制音乐和视频流服务的速度，以阻止客户消耗大量流量。同样，一些英国提供商会在高峰时段对文件下载采取同样措施。VPN
    可以帮助避免这种情况，因为它会加密通过你连接的所有流量，使得提供商无法准确看到你正在做什么。一个例外是，某些提供商可能会检测并限制 VPN 流量，尽管有许多不同的提供商可用，但通过使用不那么常见的服务（通常不是
    OpenVPN）可以避免这一点。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_56_1.png)


    如果你使用 Linux 机器访问互联网，那么了解虚拟专用网络（VPN）的优缺点是值得的。VPN 允许你保护两个位置之间的流量——第一个位置可以是你的 VPN
    提供商，或者是你在其他地方部署的 VPN 系统，而第二个位置是你自选择的另一个地点，例如办公室。


    VPN 可通过多种协议使用，但它们的本质是流量在主机端加密并在服务器端解密，确保其在通往目的地的途中不会被任何中间人窥探。


    在使用 VPN 时，有许多与路由相关的选项。典型的场景是所有流量都通过 VPN 连接进行路由。然而，你也可以使用“分流隧道”（split tunneling），即根据路由规则，某些网络地址将绕过
    VPN 连接并使用常规互联网连接。


    VPN 通常被那些担心因活动受到迫害的人用工具，但它为任何在公共网络上发送数据的人提供了安心感。


    # 功能 VPN 与 VPS


    # 数据安全


    # 使用 VPN 的场景将帮助保护你的数据。


    VPN 的经典用例是公共 Wi-Fi 热点。如果你带着你的 Linux 笔记本电脑（或其他任何设备）在外面，你可能会获得你喜爱的咖啡馆提供的免费连接。这种方法的麻烦在于，你真的不知道正在发生什么。网络或咖啡馆中的其他活动者可能会拦截你想要使用的服务。如果你正准备发送任何你在意的数据，无论是社交网络还是在线银行，使用
    VPN 将确保你通过网络的所有流量都经过安全加密。


    当用户连接到 VPN 时，他们可以像实际上在办公室里一样浏览。分流隧道意味着网络访问仍然可行，但 IP 范围内的地址将通过 VPN 路由。通过在家里安装 VPN
    服务器（或使用 VPN 功能），当你离开家时，可以连接到家中的网络中任何地方的机器。如果你有安全摄像头并想远程查看它们而不将它们暴露给全世界，这尤其有用用。


    VPN 的常见用途是为办公室网络提供远程访问。使用这种方法可以避免将机器完全开放给全世界，而是只配置一个 VPN 服务器。


    VPC，或虚拟私有云。这意味着公司可以在云中拥有若干服务器，但通常无法从 Web 访问。这仅允许它们相互通信。一个很好的选项是在 VPC 内部部署 VPN
    访问，这样只有极少数的服务器暴露在世界上，有助于增强整体安全性。


    使用 VPN 时的一个考虑因素是它们的位置。如果你在英国使用 VPN，但连接到另一个国家的 VPN——例如美国——这将影响网页浏览等活动，因为网站将显示你的
    IP；即你实际路由流量的那个服务器的 IP。如果你想使用 Google 但结果都显示为另一种语言，这可能是负面的；或者如果你 VPN 回自己的国家以访问本地内容，这可能是积极的。


    使用 VPN 为你提供了无值的安心感，确保你的流量在通过如 Amazon Web Services 等云基础设施传输时不会被拦截。云托管中的一个常见概念是
    VPC。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_57_0.png)


    # VPN 与 VPS


    | 窃听者 & 黑客 | | | | 互联网 | | | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 左：无论你选择建立自己的虚拟专用服务器还是使用提供商，VPN 都会加密你的互联网连接以增强安全性和隐私 | | | | | | |

    | 你 | VPN | | 加密隧道 | | | |

    | | | | | 政府与企业封锁 | | | |


    # 什么是 VPN 服务？


    - 通常由专业的 VPN 公司提供

    - 懂技术的人也可以也可以部署

    - 价格非常昂贵，但从免费开始

    - 通常，你付什么钱就得到什么服务


    # 什么是 VPS？


    - VPS 是一个虚拟私有云。这意味着公司可以在云中拥有若干服务器，但通常无法从 Web 访问。这仅允许它们相互通信。一个很好的选项是在 VPC 内部部署
    VPN 访问，这样只有极少数的服务器暴露在世界上，有助于增强整体安全性。


    # 功能 VPN 与 VPS


    # 针对 Linux 用户的最佳提供商


    # ## STREISAND 易于部署


    在部署自己的服务器时有许多选择。该脚本设计在 Ubuntu 16.04（当前的 LTS 版本）上运行，并且可以（诚然，这提供了最高级别的控制），但非常耗时。另一种选择是使用
    Streisand。在安装结束时，你会得到一个可以与朋友或家人分享的 HTML 文件。使用 Streisand 的用处在于你可以随意拆除 VPN 并重新部署，从而减少了被攻破的风险。


    这带有许多开源工具，如 L2TP/IPsec、OpenVPN、Shadowsocks、Stunnel 和 WireGuard（参见 pdf）。


    # ## VYPRPN


    虽然本文的大部分讨论了你的 VPN 解决方案，但如果你想注册托管服务呢？你可以选择 GoldenFog 提供的 VyprPN，它誉为“世界上最受信赖的 VPN”。每月不到
    5 美元，你可以获得快速的 VPN 速度、70 个全球服务器、20 万 IP 地址、适用于各种设备的易用应用程序，以及一种名为 Chameleon 的智能技术。


    在后台，VyprPN 基于 Ubuntu 服务器以及大量的开源栈，包括 OpenVPN、StrongSwan、Nginx、OpenSSH、Python 等。系统的闭源部分使其如此出色：Web
    界面、客户端和 API。Chameleon 功能也是闭源的，但它是使用该服务的有力理由。基于 OpenVPN，Chameleon 使用了多种协议。


    当你不想使用开源解决方案时，GoldenFog 声称其 100% 的软件和网络不使用第三方协议，因此你的隐私得到了端到端的保护，并添加了混淆层，这对于故障排除非常有用（一种允许提供商进行流量整手的工具）。


    当其他 VPN 方法在特别激进的提供商面前挣扎时，Chameleon 的表现出色。


    如果这就是你需要的，VyprPN 可能是答案。该公司提供免费试用，你可以去了解。

