    server {\n    error_page 401 403 404 /404.html;\n}\n```\n\n重启 Nginx 保存更改。\n\n\
    ```nginx\nlocation / {\n    try_files $uri $uri/ =404;\n}\n```\n\n为你的 Nginx 服务器创建一个自签名\
    \ SSL 证书。除非经过信任机构的签名，否则此证书不会验证你的用户。自签名证书允许你与 Web 服务器进行加密通信。创建一个证书：\n\n现在重启 Nginx\n\
