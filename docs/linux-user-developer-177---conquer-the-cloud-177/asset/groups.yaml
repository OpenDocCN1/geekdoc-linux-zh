    # 04 配置、创建和启动


    在创建实例之前，你可以对硬件进行自定义。你可以更改 CPU 和 RAM 分配，以及 HDD 大小。这里也可以添加其他内容。完成后，点击“创建”。在实例列表中，你将看到你的新
    VM 和 IP 地址。你可以 SSH 连接到浏览器，或者使用 IP 地址和你的账户凭据通过终端进行 SSH 连接。


    # 05 远程管理你的服务器


    服务器设置完成后，你就可以开始安装、构建 Web 和移动应用、数据仓库、托管博客和维基、客户管理、负载均衡、API 管理等。请注意，这些都可以单独部署。你可能需要为其中任何一项启用
    HTTP/HTTPS 访问，并且确保在试用期间实例的安全是至关重要的。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_26_1.png)


    # 06 停止你的实例


    实例的管理就像管理任何物理（或本地位置）服务器一样。在 VM 实例页面上，你会找到停止、启动、重置、删除或创建新实例的工具。同时，选择实例可以监控其性能，例如
    CPU、磁盘或网络使用情况。你还可以更改实例的设置，例如添加 SSH 密钥并更改 IP 地址。


    # 07 克隆你的实例


    出于连续性考虑——或者仅仅是为了节省时间——你可能会发现克隆实例是有益的。例如，当你准备启动一个新的在线服务时，可以克隆现有的服务器实例并将其上线。选择实例后，点击“克隆”。你将看到想要保存的所有详细信息，并在需要时更改这些内容的选项。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_26_2.png)


    # 08 使用快照备份


    同样地，你可以通过快速创建快照来从新软件设置从快照创建实例。这似乎是一个当原始实例出现问题时可以进行切换的快速备份。你可以在左侧菜单中找到“快照”选项。点击它，然后点击“创建快照”。为它命名、添加描述，并选择源磁盘——即你想备份的实例。创建初始快照后随后的任何快照都是增量的。


    # 09 使用 Google Cloud 掌控一切


    Google Cloud 的真正优势在于为活动和发布业务提供了灵活的选项。你可能花几个月时间寻找工作，因此你可以确信雇主会想要使用更多这里提供的技术。到那时，你已经了解
    Google Cloud 对企业或作为员工是有多重要，并积累了关于其提供的 Web 应用和服务的知识。


    www.linuxuser.co.uk 27


    # 特色：征服云


    ## 使用 PEPPERMINT SEVEN 推出以云为中心的发行版


    降低组织内的硬件成本通常会导致配置较低降低，这使得云桌面成为保留功能的好方法。


    除了购买一批 Chromebook 之外，这里的最佳选择可能是 Peppermint Seven，这是一种基于 Ubuntu 并带有 LXDE 桌面的以云为中心的发行版。它足够轻量，可以刷新你的简历和技能储备。轻松的入门方法是从云盘或
    USB 闪盘安装它，它可以作为你的主操作系统安装、作为双系统/多系统操作系统安装，甚至直接从 USB 运行。如果你不确定，也不要排除在虚拟机中尝试它。


    Peppermint Seven 本质上是一个带有云应用和本地应用的混合桌面，其界面允许你运行多个浏览器（SSB）。SSB 基本上会将网站变成桌面快捷方式。同时，软件要么通过云可用，要么没有可用选项，而是包含在发行版中。简而言之，这是一个平衡了功能、速度和简单性的云操作系统，可能可能是预算紧张情况的答案。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_0.png)

    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_1.png)

    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_2.png)

    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_3.png)

    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_4.png)

    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_5.png)


    ### 01 现场启动盘还是虚拟机？

    如果你是第一次使用 Peppermint Seven，可以从现场启动盘运行，或从官方网站 https://peppermintos.com 下载。安装过程与安装
    Ubuntu 等非常相似，这也是一种选项。它可以安装到你现有的 PC 或笔记本电脑中，也可以从 CD 或 USB 以现场会话运行。无论你选择哪种，它应该感觉像一个真实的桌面，这是任何以云为中心的操作系统的核心。


    ### 02 查找应用程序

    启动 Peppermint Seven 后，打开菜单查找应用程序。可以立即看出哪些应用是云端的，哪些是随发行版安装的。要找到它们，点击“筛选”标签卡以查看
    Peppermint Seven 中的应用。


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_6)


    ### 03 使用 Ice 创建 Web 应用

    Peppermint Seven 中的某些 Web 应用可以通过 Ice 添加。给应用程序命名，输入 URL，然后选择它在哪个窗口中打开，以及是否将其设置为默认浏览器。Firefox
    预装在 Peppermint Seven 中。


    ### 04 标准应用安装

    Peppermint Seven 的重点是云应用，你仍然可以安装 Linux 软件。通过打开终端并使用 `sudo apt install 软件包名` 来实现这一点。此外，你会在系统设置中找到软件管理器。如果你发现需要的工具在任何地方都不可用，Gaptic
    安装程序也已安装。


    ### 05 实用预装工具

    Peppermint Seven 有许多实用工具。例如，应用程序管理器和系统工具菜单。你还会找到非常有用的镜像写入器和 USB 闪盘格式化工具。。你还会找到用于连接网络和打印机的
    Samba，以及系统设置：任务管理器、更新管理器和 LXDE。


    ### 06 Peppermint 7

    Peppermint Seven 不应忽视的元素之一是简化设置面板中的集成 Linux 搜索。显然，作为其他 Linux 工具和偏好伞的菜单使得终端用户管理生产系统比像
    Ubuntu 简单得多。你可以在菜单 > 偏好中找到 Peppermint 设置和 Peppermint 控制中心。


