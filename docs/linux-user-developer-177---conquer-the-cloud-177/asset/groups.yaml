    # State name  A brief description


    | State name | A brief description |

    | --- | --- |

    | Open | This is considered the most dangerous state for a port. An open port
    typically indicates that a server has a service handling request on this port,
    which can easily be an entry point for external hackers to get into the server.
    |

    | Closed | Though a closed port can be accessed, there is no service waiting here.
    |

    | Filtered | If you do not want to access a specific port, then ''filtered'' is
    the best state to port in. Please note that even though a service could be listening
    on a port, the firewall will block the access to that port. |

    | Unfiltered | In this state, the nmap scan will be able to see the port, but
    it cannot determine if the port is open or closed. |

    | Open | Filtered | The nmap scan sees the port but is unable to determine if
    the port is open or filtered. |

    | Closed | Filtered | The nmap scan sees the port but is unable to determine if
    the port is closed or filtered. |


    you can refer to the official website (https://nmap.org/) for detailed information
    on it. You can install nmap using the following command below:


    ```

    $ apt-get install nmap

    ```


    To audit your system, the nmap utility utilizes several useful type of scans.
    All the various port-scanning techniques you can use at https://nmap.org/ of the
    most popular types of port scans used for service auditing:


    +   - TCP - this type of scan, nmap tries to connect to the main ports of the
    transport protocol, unless the server connect port completes a three-way handshake.

    - UDP - this type of scan nmap sends a UDP packet to every port on the system.


    When we run nmap, it produces a report with the information about the system we
    are scanning and the related ports. The nmap scan lists six possible states (see
    the table above). The following command can be used to carry out TCP connect scan:


    ```

    $ nmap -sS 127.0.0.1

    ```


    As we can see from Figure 1, the TCP Connect scan indicates that our example has
    two TCP ports open and we have services that are listening on the localhost for
    requests on these ports. To perform a UDP scan using the following command:


    ![](img/a6a91935f07f13d62210d3016f91c5fc_52_0.png)


    > Above TCP Connect scan is a scan as it requires a full TCP connection to run


    ```

    $ nmap -sU 127.0.0.1

    ```


    As you can see in Figure 2, the UDP scan has reported three UDP ports and there
    are services listening on those ports. You can use these two types of nmap to
