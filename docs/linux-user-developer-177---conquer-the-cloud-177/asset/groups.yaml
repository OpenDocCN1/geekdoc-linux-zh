    ## 为 OpenWRT 添加硬件访问


    ### 使用 OpenWRT 的硬件控制实现家庭网关冗余


    树莓派的 GPIO 布局可能不符合每个人的口味，但我们无法否认这 40 针脚提供了连接各种硬件的充足机会。我们提到的许多内容对于 PI 的频繁读者来说应该是众所周知的，在让它们运行
    OpenWRT 时只会遇到极小的障碍。本文假设您已处于遵循了教程并需要自定义 OpenWRT 构建的阶段。如果您尝试使用来自 OpenWRT 项目的代码库进行构建，它将无法工作。


    在实践中，访问微处理器上的资源涉及向寄存器写入特定值。有几个映射的内存位置（如图 1 所示）。


    直接提供内存访问可能会导致各种问题。Linux 内核与 Windows 之间的巨大差异就是一个例子——默认情况下，不允许对内存进行无限访问。


    这一特定限制通过设置特殊常量来修复，该常量强制内核对内存保护变得不那么严格。


    在我们情况下，在 http://bit.ly/STRICT_DEVMEM 找到的方法提供了有关该解决方案以及如何通过图形 menuconfig 系统启用的更多信息。


