    #### 基础和高级播放


    在我们介绍的四个播放器中，Miro 提供了最好的控制。这不一定是一件大事，但我们确实更好地与他们的任何进一步连接。该应用程序也连接在线视频文件，提供与离线文件相同水平的控制。视频输出是
    MPV 的最强资产。它帮助了几个高级功能，因为这里可以进行视频缩放，我们还没有发现本组中的其他人使用它。我们还找到了需要的颜色管理选项。


    #### 插件和额外功能


    除了是一个不错的视频播放器，另一个 也是一个不错的音频播放系统。两者结合，提供了一些可以帮助你视频文件的关键额外设置。还有 Miro 将你存储的视频文件转换为其他格式等。MPV
