    > Network > ''SOCKS'' as your ''Proxy''. The rest of the information filled in,
    just click ''OK''.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_1.png)


    ## 03 Generate wallet


    Choose ''Auto'' on the first Ethereum window, then click ''Next'' to the next
    screen choose a ''standard'' wallet New Seed. Ethereum generates 12 random words
    for wallet seed and as the program requests it writes these on paper. These papers
    will enable you to restore your wallet if anything happens to your Pi. Click ''Next''
    to continue.


    Click the icon to copy all the keys then go to Applications > Text Editor to edit
    it into a text file. Use USB stick and save the new file to.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_2.png)


    ## 07 Install wallet

    Safe eject the USB stick from the Pi and insert the stick to the computer that
    you want to use for your ''Watching Wallet''. works on most platforms for security
    reasons, and I''d recommend using Linux over any other platform. If you''re using
    a Debian-based distro like Ubuntu, make sure to use apt-get as well. For other
    platforms follow the instructions at https://ethereum.org/, but move on.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_3.png)


    ## 04 Confirm and store seed

    After you have confirmed the seed you can optionally set a password to protect
    this copy of the wallet on the Pi. You''ll need to re-enter this password when
    sending Bitcoins. Ideally choose a password that''s at least 10 characters. Use
    the words you wrote down, store the paper in a safe place or remember the words
    by associating them with a location.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_4.png)


    ## 05 Choose your wallet password

    Choose ''standard'' wallet once again on the first screen and on the ''Keystore''
    screen choose ''Private Keys''. On the next screen, paste the master in the text
    file from your USB stick. Read the warning and click ''OK''.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_5.png)


    ## 08 Restore master keys

    Launch the Ethereum client on your online machine. In Linux, you can run electrum
    from the Terminal. Choose ''Auth'' once again on the first screen and click on
    the ''standard'' wallet.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_74_6.png)


    ## 09 Set up addresses

    Electrum will generate addresses for you when the main window opens click on the
    ''Receive'' tab to view your address. You will see both a text string and QR code
    for your new address. Type a description for your receiving address if you wish,
    then click ''Save''. You can generate more addresses.


    ## 13 Sign transaction

    Open the Electron client on your Pi and click on the ''Tools Menu''. Select Load
    Transaction > From and navigate to the transaction file on the USB stick. Details
    of the transaction will load. Check everything is in order. Enter your password,
    then click ''Save'' to store the newly transaction file to the USB stick. Click
    ''OK'', followed by ''Close'' and safely eject the USB stick from the Pi.


    ## 10 Test wallet address

    Using your Bitcoin wallet, try to send funds to your new address. If possible,
    use a client that supports scanning QR codes, there is no danger of getting the
    wrong address. Once the payment is sent, the unconfirmed new balance should show
    in the bottom-left corner of the Electrum Window. Now, you will need to wait until
    the balance is confirmed before proceeding.


    ## 14 Broadcast transaction

    Next, you will need to insert the USB stick to sync with the ''watching'' wallet.
    Open Electrum and click Tools > Load Transaction > From. Choose the signed file
    on the USB stick. A new window opens with


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_0.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_1.png)


    ## 11 Set up sending

    Now you can receive funds, it is time to test if you can send them. Find your
    recipient''s wallet address. For this tutorial, we are using the Bitcoin Address
    of the Ethereum Foundation (EEF) to send a donation. Click on the ''Send'' tab
    in Electrum and paste the address into the ''Pay to'' field. Add a description
    if you want to and then click ''Preview''.


    the transaction details. Double-check and click ''Broadcast'' to send them to
    the Bitcoin network, You will see a confirmation message. Click ''Close'' to see
    the unconfirmed amount in the Electrum window. The processing times for a transaction
    will vary based on the fee you pay.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_75_3.png)


    ## 12 Save transaction

    Click ''Save'' in the new window to see the TXN (transaction) file and navigate
    to your USB stick and place it there. Electrum confirms that the transaction is
    saved successfully. You can click ''Close'' to close the window. A transaction
    needs to be digitally signed by the wallet on your Pi to send it.


    ## 15 Generate new addresses

    To prevent transactions from being traced, you should generate a new address for
    receiving by clicking the ''Receive'' tab of Electrum, click ''New'' to create
    a new one. Add a description if you would like to click ''Save''. From the ''Requests''
    tab, Repeat Steps 10-14 to receive and send the transaction for each new address.


    Having worked with this tutorial, you''ll have a ''cold'' wallet set up, a method
    for making payments and an online ''watching'' wallet for tracking payments.

