    # # gen_tcp


    MODULE


    gen_tcp


    MODULE SUMMARY


    Interface to TCP/IP sockets.


    DESCRIPTION


    This module provides functions for communicating with sockets using the TCP/IP
    protocol.


    The following code fragment is a simple example of a client connecting to a server
    at 5678, and closing the connection.


    ```

    client() ->\n{Socket = gen_tcp:connect(binary, packet, 0), % to make it runnable
    on one machine\n{ok, Bin} = gen_tcp:connect(socket, "localhost", 5678, "Data")\n{ok,
    Connection} = gen_tcp:open(Bin)}

    ```


    At the other end, a server listening on 5678 accepts the connection, and returns
    the binary:


    ```

    server() ->\n{ok, Socket} = gen_tcp:accept(5678, active),\n{ok, Bin} = gen_tcp:recv(Socket,
    B),\n{ok, List} = list_to_binary(Bin)}

    ```


    For more examples, see Examples section.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_46_0.png)


    MODULE


    MODULE SUMMARY


    Access to TCP/IP protocols.


    DESCRIPTION


    This module provides access to TCP/IP protocols.


    Also see inet:configuration for more information about how to configure an Erlang
    runtime system and use communication.


    The following two TCP connection parameters affect the behavior of all sockets
    on an open Erlang node:


    +   - inet_connect_options: contains a list of options for all sockets when returned
    when the node is closed.\n- inet_listen_options: contains a list of options used
    when a listening socket is called.


    When accept is used, the values of the listening socket options are inherited.
    No such application variable


    Useful Erlang packages

    There are three Erlang packages that help us develop network applications in Erlang:
    gen_tcp, gen_udp. These two offer low-level functionality whereas the third one
    gives us to create any raw TCP/IP sockets.


    Figure 1 shows a small part of the documentation page of the module, which is
    a module that enables us to use the TCP/IP protocols from Erlang. Here as you
    will


    see later, on to use our TCP and UDP clients and you will need to use the proper
    Erlang functions from gen_tcp and gen_udp_modules.


    # A TCP server in Erlang


    This section will show you how to make a TCP server using the Erlang shell in
    order to better understand the functions they use:


    ```

    3> (ok, TCPPort) = gen_tcp:listen(8000,

    ```'
