    sudo apt-get install unrar

    ```


    Once installed, if the VM is massive and too large for our disc, also included
    the server installer for those already running - you''ll need to unpack the RAR
    with:


    ```bash

    unrar Nextcloud_Community_VM.rar

    ```


    This will take a few minutes. The files are in VMX/VMDK disk format, so you''ll
    need to choose a suitable virtual machine.


    ![](img/a6a1935f07f13d62210d3016f91cfcfc24_0.png)


    ## 04 Run Virtual Machine


    If you wish to add a hard disk to the machine, you can create a new hard disk
    file or select one from the list or another location using the folder. If you
    need a more complex setup, you can skip this step and make the changes to the
    settings once the machine is created. The recommended size of the hard disk is
    8.00 GB.


    - Do not add a virtual disk

    - Create a virtual hard disk

    - Use an existing virtual disk


    ```

    Nextcloud_Community_VM.vmx

    ```


    ## 05 Run Nextcloud in VirtualBox


    Next, you''ll need to run the VMDK image as VirtualBox. With VirtualBox, click
    ''Next'', then give the VM a name (Nextcloud, for instance). Select Linux and
    Ubuntu as the operating system. Next, select the virtual 8GB disk, then in the
    virtual settings, select ''Use existing hard disk'' for the extracted VMDK image.
    To run the Nextcloud machine, select it in VirtualBox and click ''Start''.


    > Nextcloud adheres to industry practices for data security


    ![](img/a6a1935f07f13d62210d3016f91cfcfc24_1.png)


    ## 06 Login and configure Nextcloud


    With the Nextcloud server running, you''ll need to log in. The details can be
    found in the text on the VMDK page, and use cloudadmin to access Nextcloud. Next,
    you''ll need to provide minimum input from you for things like IP address, keyboard
    layout, etc., and the LAMP stack is installed already. You''ll then be prompted
    to install an app, with many options like Collabora Online (see p22), which is
    very useful for group projects. Click ''OK'' to continue, following the instructions
    on screen.


    ## 07 Complete Nextcloud setup


    As you finish installing, you''ll be given a summary/confirmation and then prompted
    to install an SSL certificate. This is a good idea for an enterprise role, but
    less vital for personal use. Following this, the server will need to reboot, and
    then run as Nextcloud setup.


    With the server ready to access, install the desktop (or mobile client), create
    a new account, and start using Nextcloud. The setup is complete, but there are
    plenty of extra features.

