    As you saw, the inet:getaddrs() function supplies a more detailed analysis of
    IP addresses.


    # Working with the inet module


    In this section, we will show you how to work with the inet lang module, which
    provides access to the TCP/IP protocols and takes care of handling all operations
    that can be common to both gen_tcp and gen_udp sockets. For instance, you can
    find the IP addresses of a Linux machine in the following:


    ```

    > inet:getif().

    ok,((192,168,1,200)),(192,168,1,255)),(255,255,255,255))

    ```


    # About TCP/IP protocols


    The TCP/IP suite contains a plethora of protocols. As we know, the two most important
    ones are TCP and IP. Others used for transmission of data are DNS, FTP, NTP, SMTP,
    DHCP, HTTP, MAP, POP, SSH and SSL.

    Each protocol has the complexity of a protocol, and there are times when you need
    to use different protocols. Within the others, you should read the appropriate
    Request For Comments (RFC) to see in more detail the particular protocol of interest
    by visiting the site of the Internet Task Forces at http://ietf.org.'
