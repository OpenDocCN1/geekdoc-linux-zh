    # # Welcome

    to issue 177 of Linux User & Developer


    # # This issue


    > >> Meet the man behind Acme, p12

    >> Get the right VPN for you, p58

    >> Pi Zero W reviewed, p87


    Change is sometimes challenging. When I began this column, as your new editor,
    our offices were in a state of flux. LU&D was being rebuilt in Bath and the world
    was. Every day the new team hear the steady dust of sledgehammers and watch the
    lazy decay of dust from the ceiling, now I''m fitting right, clean straight with
    breakouts zones and no sofas (fortunately),


    so, you can be happy, but maybe I hope that you''ll come to approach me, and I
    am keen to hear from dear readers. What do you think about LU&D and what else
    is inspiring or you or just making your blood boil? (If you know GNU/Linux) Email
    me at chris.thornnton@futurenet.com or use the general team email and let''s chat.


    We''re building leading features while we are at the mercy of OSes and devices
    out of our control, a VPN is a good privacy measure, even if it''s to avoid tracking
    by your ISP. In, we''re locking down NGINX (p53), and on the Pi, we''ve reviewed
    several VPNs (p78). And oh, we have the Pi Zero W and the Linux Desktop XL. In
    review!


    Chris Thornton, Editor


