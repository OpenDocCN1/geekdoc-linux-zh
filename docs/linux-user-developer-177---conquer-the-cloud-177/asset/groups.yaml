    \ Apache 和 PHP 的运行。如果渲染正确，则在浏览器中加载该文件。如果你看到文件的内容，可能是 `libapache2-mod-php` 软件包有问题。这是一个常见的疏忽：Apache\
    \ 实现了本文引用的站点。\n\n| 特性 | 值 |\n| :--- | :--- |\n| 系统 | Linux x86_64 4.6.0-ubuntu\
    \ |\n| 构建日期 | 2017年2月16 11:52 |\n| 服务器 API | Core |\n| 虚拟目录 | enabled |\n| 加载配置\
    \ | /etc/php/7.1/cli.ini |\n| 额外文件扫描目录 | /etc/php/7.1/conf.d |\n| 额外文件 | 7.1.3-deb\
    \ |\n\n# 02 启用 cgi 模块\n\n要在 Apache 中使用 CGI，首先需要启用相应的模块。浏览 `modules-enabled` 目录（通常为\
    \ `/etc/apache2/mods-enabled`）下的 Apache 配置，并使用 `LoadModule cgi_module /usr/apache2/modules/mod_cgi.so`\
    \ 指令启用它。如果没有该文件，说明我们使用一个允许配置运行目录的修改模块。我们看到所需的目录是 `/usr/lib/cgi-bin`，因此创建一个内容的测试文件：\n\
    \n```bash\n#!/usr/bin/perl\nprint \"Content-type: text/html\\n\";\nprint \"Hello,\
    \ World!\\n\";\n```\n\n这里的 header 特别重要，因为它告诉浏览器如何解释我们发送的数据。Web 服务器应该无任何警告地重启，你现在应该能够在启用的模式中看到该文件。使用\
    \ `a2enmod suexec` 命令显示单个模块，然后通过 `service apache restart` 重启 Apache。\n\n```bash\n\
    sudo service apache restart\n```\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_42_0.png)\n\
    \nHello, World.\n\n```apache\n# Module mod_cgi_conf\nLoadModule cgi_module modules/libapache2_mod_cgi.so\n\
    # ...\n```\n\n# 03 检查默认虚拟主机\n\n假设你使用的是 Apache 的基础安装，“默认虚拟主机”将通过 `/etc/apache2/sites-available/000-default.conf`\
    \ 文件进行配置。如果你打开它，将发现没有启用 CGI 选项。这是因为系统没有提供 CGI 内容——它是通过这种方式被专门启用的。关键行是配置 `ScriptAlias`，你的网站上设置\
    \ `ScriptAlias /cgi-bin/` 将映射到 `/usr/lib/cgi-bin/`。由于 `+Execgi`，执行被启用。\n\n```apache\n\
    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/\n+Execgi\n```\n\n![](img/a6a91935f07f13d62210d3016f91c5fc_42_1.png)\n\
    \n"
