    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_4.png)


    # Antheros


    Based on Arch Linux, it''s stylish designed to make Arch accessible to newcomers
    and includes everything you need out of the box.


    # Solus Budget


    Inspired by Chrome, Solus has quickly become one of the best examples of elegant
    simplicity and excellent integration with Google.


    # Peppermint 7


    A well-centric distro with a highly customized LXDE and lots of nifty cloud apps.
    It''s on the eye and very, very fast.


    # Seafile Server


    As well storing your files on your cloud, Seafile enables you to sync and share
    files across many devices and access them as a virtual drive.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_5.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_6.png)


    # Nextcloud 11


    Access, store and protect your files in your own cloud. Track calendars, keep
    contacts at home and in your enterprises.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_5_7.png)


    # Pydio Core


    The community-version of the cloud platforms for systems and IT pros. Support
    the fully managed online office suite using Collabora.


    # For best results:


    This disc has been missed by many users needing updates to the HTML and CSS standards.
    So get it right, we recommend you use:


    +   - Internet Explorer or higher

    - Firefox

    - Safari 4 or higher

    - Chrome or higher


    # Problems with the disc?


    Send us email at linuxuser@futureforum.com to let us know if you are having problems
    using the programs or resources provided, check our software campaigns/projects.


