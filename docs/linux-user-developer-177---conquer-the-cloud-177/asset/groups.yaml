    > net:parse_address("192.168.1.256").

    error(invalid).

    ```


    Figure 8 shows a small Erlang program named dns.er that allows you to resolve
    hostnames using inet:getaddr(Hostname).

    Executinguting it gives the following kind of output:


    ```

