    \ `sudo chown scripter:scripter /home/scripter/scripts` 传输所有权和正确的权限，以及 `sudo chmod\
    \ 700 /home/scripter/scripts`——我们的用户 scripter 将能够写入该目录。\n\n# 08 创建新用户\n\n流程的下一步是创建一个新用户，该用户将执行我们的\
    \ CGI 脚本。如果你有多个站点，每个用户都可以有自己的家目录，\n\n```\n$ useradd -m -d /home/scripter scripter\n\
    Adding new user: 'scripter' with group 'scripter'\nCreating home directory: '/home/scripter'\n\
    Copying files from '/etc/skel' to '/home/scripter'\npassed password ownership\
    \ successfully\n$ chown scripter:scripter /home/scripter\n$ chmod 755 /home/scripter\n\
    ```\n\n# 10 创建并复制新脚本\n\n我们将创建一个新脚本，但首先我们需要确保它在我们新用户下可以正常工作，因此我们使用 `sudo touch\
    \ /home/scripter/scripts/test.pl`。\n将以下内容粘贴到我们用于定义解释器的文件中`\"Content-type: text/html\\\
    n<html><head></head>\\n<body>print(\\\"Hello World!\\\");</</body></body></html>\"\
    ` 中，以输出内容。当我们在接下来的步骤中测试脚本时，它的运行方式将与完全一样。\n\n```bash\n$ touch /home/scripter/scripts/test.pl\n\
    $ chmod 700 /home/scripter/scripts/test.pl\n$ chown scripter:scripter /home/scripter/scripts/test.pl\n\
    ```\n\n并使用。在每个提示信息处按回车键——我没有显式地以用户身份登录，所以没关系。设置用户将自动创建相应的家目录，我们将在下一步中使用它。\n\n\
    ```bash\n$ su -s scripter -d /home/scripter /home/scripter/scripts/test.pl\n```\n\
    \n# 11 变为可执行\n\n现在我们已经测试了脚本，我们需要它是可执行的。我们还需要确保我们的新 scripter 是拥有该文件权限的人。为了做到，我们需要使用命令\
