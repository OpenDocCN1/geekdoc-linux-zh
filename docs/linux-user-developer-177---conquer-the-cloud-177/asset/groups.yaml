    # 树莓派


    # 认识全新的 Raspberry Pi Zero W，采用注塑外壳


    Raspberry Pi Zero 自五年前亮相以来没有显示出任何减速迹象。从那时起，它拥有了一系列出色的扩展，并刷新了单板计算机几乎的所有记录。作为庆祝
    Raspberry Pi Zero 五周生日的方式，基金发布了 Raspberry Pi Zero W（参见我们的评测）。到目前为止，Pi 一直一直是预算开发者的首选，因为它可以处理许多原始
    Pi 可以处理的项目，并配有广泛的配件。像 Pi Zero 一样，W 模型遵循相同的设计理念，并且尺寸明显小于全功能 Raspberry Pi 型号，这是其尺寸的一个大因素。W
    模型最令人兴奋的方面是，它通过嵌入的 802.11b/g/n Wi-Fi 和蓝牙为微型计算世界增加了无线功能。


    CSI 摄像头接口。W 模型与原始 Zero 完全相同，但无线芯片使其略重。除了 Pi 之外，树莓派基金会还将包含一个由 Pimoroni 设计的注塑外壳和一组可更换的盖子。每个盖子都为不同类型的项目定制。其中一个盖子为
    GPIO 留了空间，并带有额外的摄像头模块孔。外壳还包含一个排线固定器和一组螺丝。


    然而，增加的功能意味着 W 模型的价格将是原始的两倍。对于英国用户，价格将从 10 英镑起。


    正如 Pi 发布时预期的那样，Zero W 的库存可能会紧张，基金会尚未获得确切的数字，它向每个库存分配了货物，但我们建议您尽快购买。


