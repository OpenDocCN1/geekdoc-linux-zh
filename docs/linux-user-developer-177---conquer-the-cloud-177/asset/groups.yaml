    \ FailBan，你可以用它来加固你的安装。我们还将包括如何设置 SSL 证书防止通过 HTTP 泄露信息。\n\nwww.nginx.com\n\n##\
    \ 01 开始\n\n在本教程中，我们将使用 Ubuntu 16.04 发行版创建 NGINX Web 服务器。要安装 NGINX，执行：\n\n```bash\n\
