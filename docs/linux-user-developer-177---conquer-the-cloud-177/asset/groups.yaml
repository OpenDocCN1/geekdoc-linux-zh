    support it, various performance optimizations including an IRID review, and the
    RISC-V architecture with initial SMP support. As expected, there is also the usual
    of generic fixes, and new drivers for any kernel. Let''s look at these three examples
    in order. The first provides for applications (such as targeting NFV and Real
