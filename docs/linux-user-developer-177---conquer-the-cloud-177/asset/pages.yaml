    # 04 Configure, create and launch


    Before creating the instance, you can customise the hardware. You can change the
    CPU and RAM allocation, as well as the HDD size. Here can also be added. When
    done, hit ''Create''. In the instances, you''ll see your new VM and IP address.
    You can SSH down to an browser or use the IP address and your account credentials
    to connect via SSH in the terminal.


    # 05 Remote admin your server


    With the server set up, you can begin installing, building web and mobile apps,
    data warehousing, hosting blogs and wikis, customer management, load balancing,
    API management and more. Note that these can be deployed individually. You may
    need to enable HTTP/HTTPS access for any of these and it is important to ensure
    that the instance is secure during the trial.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_26_1.png)


    # 06 Stop your instance


    Instances are managed just as you would any physical (or locally located) server.
    On the VM instances page, you''ll find the tools to Stop, Start, Reset, delete
    or create a New instance. Selecting an instance, meanwhile, enables you to monitor
    its performance, such as CPU, disk or network usage. You can also change settings
    of the instance, such as add SSH keys, and change the IP address.


    # 07 Clone your instance


    For continuity purposes – or just to save time – you may find beneficial to clone
    your instance. You might do this, as an example, when preparing to launch a new
    online service, cloning the existing server instance and making it live. After
    selecting an instance, click ''Clone''. You will see all the details that you
    want to save and you will have the option to change these if you need.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_26_2.png)


    # 08 Back up with a snapshot


    In the same vein, you can create an instance from snapshots changing settings
    from new software by making a quick snapshot. This is seemingly a fast backup
    to be switched if something goes wrong with the original. You''ll find the Snapshots
    option in the left-hand menu. Click this, then ''Create snapshot''. Give it a
    name, description, and select the source disk – the instance you want to backup.
    The initial snapshot is made – any subsequent snapshots are incremental.


    # 09 Do everything with Google Cloud


    The real advantage of Google Cloud is the flexibility of options for events and
    publishing businesses. You won''t be seeking a role for months, so you can be
    confident that an employer will want to use more of the technologies offered here.
    By now, you will have an idea of how important Google Cloud can be to be, a business,
    or as an employee and developing knowledge about the web apps and services it
    offers.


