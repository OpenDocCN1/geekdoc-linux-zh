- pgno: 27
  md: '# # Feature Conquer the cloud


    # # ROLL OUT A CLOUD-FOCUSED DISTRIBUTION WITH PEPPERMINT SEVEN


    Cutting hardware costs within an organisation typically leads to lower-spec machines,
    making cloud desktops a good way to retain functionality.

    Perhaps the best option here, aside from buying a palette of Chromebooks, is Peppermint
    Seven, a cloud-centric distro on Ubuntu with the LXDE desktop. It is lightweight
    enough to refresh your resume and repertoire of skills. The easy way to get started
    would be to install it from the cloud disc or a USB stick, where it can be installed
    as your main OS, as a dual/multi-boot OS, or even run from USB. Don''t rule out
    playing with it in a virtual machine, either if you''re not sure.

    Essentially a hybrid desktop with cloud and local applications, Peppermint 7 with
    its icy interface allows you to run multiple specific browsers (SSB). An SSB will
    basically turn a website into a desktop shortcut. Meanwhile, software is either
    available via the cloud or no suitable option is available, it is included in
    the distro.

    In short, this is a cloud OS with a balance of features, speed and simplicity
    which might just be the answer for a tight budget.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_0.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_1.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_3.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_4.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_5.png)


    01 Live disc or virtual machine?

    If you''re getting with Peppermint 7 for the first time, you can run it from a
    live disc or download it from the official site https://peppermintos.com. Installation
    is very similar to installing Ubuntu and as such encryption is an option. It can
    be installed into your existing PC or laptop or it can run as a live session,
    from CD or USB. Wherever option you choose, it should feel like a real desktop,
    which is the heart of any cloud-centric operating system.


    02 Find the apps

    With Peppermint 7 launched, open the menu to find the apps. It is immediately
    clear which apps are cloud-based and which are installed with the distro. To find
    out, click the ''Remove'' tab to display the list of cloud-based apps bundled
    in Peppermint 7. You''ll be able to launch these by opening the menu and browsing
    for them – use the All Filter to display everything, even when a cloud app is
    launched, it will do so in a web browser window.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_27_6.png)'
