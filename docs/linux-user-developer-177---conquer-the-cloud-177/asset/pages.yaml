  md: '# State name  A brief description


    | State name | A brief description |

    | --- | --- |

    | Open | This is considered the most dangerous state for a port. An open port
    typically indicates that a server has a service handling request on this port,
    which can easily be an entry point for external hackers to get into the server.
    |

    | Closed | Though a closed port can be accessed, there is no service waiting here.
    |

    | Filtered | If you do not want to access a specific port, then ''filtered'' is
    the best state to port in. Please note that even though a service could be listening
    on a port, the firewall will block the access to that port. |

    | Unfiltered | In this state, the nmap scan will be able to see the port, but
    it cannot determine if the port is open or closed. |

    | Open | Filtered | The nmap scan sees the port but is unable to determine if
    the port is open or filtered. |

    | Closed | Filtered | The nmap scan sees the port but is unable to determine if
    the port is closed or filtered. |


