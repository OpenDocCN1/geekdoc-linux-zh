    ```


    # 05 Mark as executable and test


    After saving the file in the correct location, we need to make the file executable
    so that it can be produced the desired output. Use chmod 755 /usr/lib/cgi-bin/test.cgi
    to set the permissions, then try to access it via http://localhost/cgi-bin/test.cgi
    to ensure everything is working correctly. You should see the "Hello, World" text
    printed in the browser. If you see anything else, ensure perl is installed.


    ```

    ```bash

    chmod 755 /usr/lib/cgi-bin/test.cgi

    ```

    ```


    # 03 Check the default virtualhost


    Assuming you are with a base installation of Apache, a single "default virtualhost"
    will be configured with files at /etc/apache2/sites-available/000-default.conf.
    If you open this, you will see that no CGI options are enabled. This is because
    no CGI content is served by the system - it has been specifically enabled in this
    way. The key line is to configure "ScriptAlias" "ScriptAlias /cgi-bin/" on your
    website will be mapped to /usr/lib/cgi-bin/. Execution is enabled by virtue of
    the +ExecCgi.


    ```

    ```apache

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/

    +ExecCgi

    ```

    ```


    ![](img/a6a91935f07f13d62210d3016f91c5fc_42_1.png)


    # 06 Install the SuExec module


    Now that we''ve been configured we will install the SuExec module. For this article,
    we''re using a modified module that allows us to configure the directories in
    which it operates. Normally would not be possible without reconfiguring Apache.
    On Ubuntu, use the command sudo apt-get install apache2-suexec-server. The module
    should be included with most popular distributions.


