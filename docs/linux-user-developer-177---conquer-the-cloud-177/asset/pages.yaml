    # OPINION


    # The kernel column


    Jon Masters summarizes the latest happenings in the Linux kernel community


    > Linus Torvalds announced the second RC (release candidate) of what became Linux
    kernel 4.1. In his announcement, Torvalds was pleased to see him coming down the
    closure of the 4.1 merge window (the period during which changes are allowed).
    This briefing was also an email to the LKML (Linux Kernel Mailing List) from the
    previous week, which included a lengthy rant about the failure of particular contributors
    to the kernel to establish the practice of soak-testing new features to remain
    in ''next'' for an entire development cycle before them to be pulled into the
    following kernel. In his analysis of the 4.1 merge, Linus noted that commits he
    sees are not tracking the merging of one maintainer''s development tree into another
    or Linux''s tree were not In-next. He expressed some annoyance that those failing
    to use ''next'' would window know that ''next'' merge window will not open for
    a moment. Amusingly, with the linux-next process by requesting the initial enablement
    for a feature, planned to land in 4.12, ahead of time. From now on The 4.1 includes
    some new features, most of which won''t affect much for end users except enterprise,
    and mobile developers. These include support for 3-arity MONITOR/MWAT calls that
    support it, various performance optimizations including an IRID review, and the
    RISC-V architecture with initial SMP support. As expected, there is also the usual
    of generic fixes, and new drivers for any kernel. Let''s look at these three examples
    in order. The first provides for applications (such as targeting NFV and Real
    Time) to use the special MONITOR/MWAT instructions that had previously only been
    available to privileged kernel code. MWAT is a high-performance


    mechanism by which an ''v8'' (similar mechanisms exist elsewhere) processor can
    be instructed to temporarily wait for a memory location to change, without looping
    and checking its contents for a change in value explicitly. Care must be taken
    in respect to how it affects system stability, but it can save energy and improve
    performance for applications. The implementation of this is an example of the
    many performance improvements in core code that are in flight at the moment.


    GRID provides a small pointer translation service that has traditionally used
    a fixed (size) table for fast lookups, or process ID to data structure. The implementation
    functions harmoniously with the existing in-kernel support for radix trees, which
    uses the underlying mechanism instead. This kind of feature is newly observed
    by many developers and adds to the overall quality of the kernel.


    Finally, the review of the RISC-V architecture shows it was as expected, given
    the amount of work left to do. Both RISC and RISC-V open computer architectures
    are approaching stable specification, with several hardware implementations written
    in Verilog. This is a Hardware Description Language (HDL), used to specify logic
    gates that can be run in FPGA-Field Programmable Gate Array-or.


