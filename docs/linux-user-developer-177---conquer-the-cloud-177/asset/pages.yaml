    you will use Python to build a real-time humidity display. The program uses the
    SenseHAT''s on-board sensor, then calculates a ratio to determine how humid it
    is, the more LEDs are turned on. Then the number of LEDs that need to be turned
    ''off'' is calculated and added to the list. Finally, you''ll set the program
    to display and turn ''on'' the requested LEDs. The program continues to loop so
    the LED display is updated as the humidity changes.


