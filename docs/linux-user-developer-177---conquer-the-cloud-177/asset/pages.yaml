  md: '# Tutorial Erlang


    # Program in Erlang: Network programming


    Mihalis Tsoukalos administrator, a programmer (UNIX and SQL and a mathematician).
    He has been writing code since 1993. You can reach him on Twitter @mactsoukalos
    or mtsoukalos.eu


    Our series on Erlang continues with an introduction to creating TCP/IP clients
    and servers and the inet module


    # Resources


    A recent installation of Erlang A text editor such as Emacs or vi


    > This is the third in our Erlang programming language series, and we are going
    to cover network programming, which mostly includes the development of TCP/IP
    servers. The single most important difference between regular command-line utilities
    and network applications is that the latter work across networks and two machines
    also on every networking device and software that lies between these two machines.


    You cannot develop a network application without knowing about TCP/IP, so we will
    start with a very brief introduction to the protocol of the internet.


    The main difference between the two protocols is that TCP is a reliable protocol
    whereas UDP is unreliable. Each protocol is based on IP which is also unreliable.
    Generally speaking, the UDP protocol is simpler than TCP because it does not need
    any bridging, routing, or buffering that could help you develop reliable UDP applications.
    If you need reliability then use TCP.


    The best advice that we can offer developers who program network applications,
    is to know the theory before the task they want to perform and how to write the
    software that is using TCP. SSH generates encrypted traffic that cannot be decrypted
    without a perfectly working network application failure. Remember that without
    TCP there is no internet be careful when creating applications that work on networks.


    Every TCP or UDP server listens to a port to use - for example, a server that
    supports the HTTP protocol, is called an HTTP server and it uses ports. The choice
    of this port does not mean that it cannot be used on the port number that is used
    to characterise TCP. In other words: do not use the port number that is used by
    the machine that has asked for the connection as the IP address and the port number
    of the machine that really establishes the connection with the first machine.


    In this chapter we will learn how to create UDP clients and servers; introduce
    the inet module and cover how to use Wispecker to debug and Wireshark to debug
    TCP/IP services and the network command utility that help you test TCP/IP server
    and client software


    # Tutorial files available:


    files.co.uk


    ![](img/a6a91935f07f13d62210d3016f91c5fc_45_0.png)


