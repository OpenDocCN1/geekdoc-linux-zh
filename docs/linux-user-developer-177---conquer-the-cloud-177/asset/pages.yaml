  md: '# Unpack the VM


    After downloading the virtual machine, which is a RAR file, you''ll need to unpack
    it. For this, you''ll need the unrar tool


    ```

    $ sudo apt-get install unrar

    ```


    Once installed, if the VM - a massive 1.9GB and too large for our disc, also we''ve
    included the server installer for those already running their own - downloaded,
    you''ll need to unpack the RAR with:


    ```

    $ unrar Nextcloud_Community_VM_PRODUCTION.rar

    ```


    This will take a few minutes. The note files are in the VMX/VMDK disk format,
    so you''ll need to choose a suitable virtual machine


    # Run Virtual Machine


    ![](img/a6a91935f07f13d62210d3016f91c5fc_24_0.png)


    # Hard disk


    If you wish to add a virtual hard disk to the machine. You can create a new hard
    disk file or select one from the list or another location using the folder


    If you need a more complex setup you can skip this step and make the changes to
    the settings once the machine is created.


    The recommended size of the hard disk is 8.00 GB.


    +   - Do not add a virtual hard disk

    - Create a virtual hard disk

    - Use an existing virtual hard disk


    ```

    Nextcloud_Community_VM_PRODUCTION.vm

    ```


    # 04 Run Nextcloud in VirtualBox


    Next, you''ll need to run the VMDK image, as VirtualBox. With VirtualBox, click
    ''Next'', then give the VM a name (Nextcloud, for instance). Select Linux and
    Ubuntu as the operating system


    Next, select the virtual (512MB-GB) disk, then in the virtual settings, select
    ''Use existing hard disk'' and for the extracted VMDK image. To run the Nextcloud
    machine, select it in VirtualBox and click ''Start''.


    > Nextcloud adheres to industry practices for data security


    ![](img/a6a91935f07f13d62210d3016f91c5fc_24_1.png)


    # 05 Login and configure Nextcloud


    With the Nextcloud server running, you''ll need to log in. The details can be
    found in the text on the VMDK page, and use ncloudadmin to access Nextcloud. Next,
    you''ll need to require minimum input from you for things like IP address, keyboard
    layout, etc., and the LAMP stack is installed already. You''ll then be prompted
    to install an app, with many options are Collabora Online (see p22), which is
    very useful for group projects. Click ''OK'' to continue, following the instructions
    on screen.


    # 06 Complete Nextcloud setup


    As you finish installing, you''ll be given a summary/confirmation and then be
    prompted to install an SSL certificate. This is a good idea for an enterprise
    role, but less vital for personal use. Following this, the server will need to
    reboot, and then run as Nextcloud setup.


    With the server ready to access, install the desktop (or mobile client), create
    a new account, and start using Nextcloud. The setup is complete, but there are
    plenty of extra features available through Nextcloud Apps - give it a try!


    ![](img/a6a91935f07f13d62210d3016f91c5fc_24_2.png)'
