  md: '# DISTRIBUTION


    # Manjaro ARM closure of embedded OS


    # A lack of contributors has ended the project


    The popular Manjaro ARM, an Arch-based distribution used steadily for embedded
    devices, is closing its doors next month. In a recent announcement, the Manjaro
    team cited that a lack of contributors to the project has meant future updates
    impossible to complete. The team has already stripped back future of the project
    and is pushing out new releases and building. All current users downloaded directly
    from the Manjaro site will be maintained until the closure of the site, and users
    can freely update versions of the project if they need.


    Despite the announcement, Manjaro ARM remains among the most used Arch-based distributions
    out there, so much that the development team has taken time to outline its plans
    for the shutdown.


    # KERNEL


    # 11-year-old flaw patched in recent kernel update


    The vulnerability went unnoticed until this time


    We have seen numerous security fixes in the Linux kernel, but one has slipped
    through the net for a constant amount of time. As seen in CVE-2017-6024, the vulnerability
    exists all the way back to 2006, where the kernel gained its social fame for Data
    Catalog Epoch. As far as vulnerabilities go, this is one of the more dangerous
    ones. It could be exploited using heap-spraying techniques to execute malicious
    code within the kernel. What''s even more worrying,


    ![](img/a6a91935f07f13d62210d3016f91c5fc_10_0.png)


    Users can not expect future updates in May. Though, the Manjaro ARM''s forum and
    official website will remain fully functional, however, not lost, as the team
    have said they would like to discuss plans with other users wanting to help the
