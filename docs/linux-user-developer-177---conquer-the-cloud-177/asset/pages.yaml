  md: '# # SYNC NOTES WITH MIXNOTE


    Bring Evernote''s cloud-based note syncing to the Linux office


    In a similar vein, many users are likely to demand access to their favorite app.
    There''s a strong chance that this will be Evernote, but there is no official
    Linux app for it. While guiding users towards an open source collaboration tool
    like Etherboard should be preferred, from a desktop support point of view, all
    users need to be happy. One solution here is NixNote, a client for Evernote


    notaking app. Once installed – you should try it out to gain familiarity with
    it in advance – your users will be able to access all their notes, pictures, animations,
    and recordings. Encouraging a new note system can solve this if users have access
    to their old material, so this makes perfect. It introduces tools for new users
    in the right. Understanding how they work, alone the benefits to the end user,
    will go a long way towards proving suitability in such a matter.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_0.png)


    # 01 Install the NixNote


    NixNote is a useful client app on Linux desktops and syncs with your Evernote
    data. Notes, pictures, recordings, everything in Evernote can be synced via NixNote,
    and there should be no noticeable difference.


    Installation is deb at sourceforge.net/projects/nevernote (the project''s old
    name). For Debian and Ubuntu distros, you''ll be able to use your package manager.
    The download is small, and installation typically completes within a minute.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_1.png)


    # 02 Tidy your notes


    Whether you''re running for an evaluation, or rolling out NixNote across your
    department or organization, you''ll need to ensure that your notes are tidy. Purge
    what and make a backup of your data. This is important as you don''t want to lose
    any notes. While there is a little risk of happening (it can happen with Evernote
    clients), it''s best to be prepared. Once you''ve done that, you''ll be ready
    to introduce NixNote to Evernote.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_2.png)


    # 03 Sync with Evernote


    Now with NixNote installed and your Evernote backed up and tidied, it''s time
    to sync NixNote with the official services. After launching, click ''Sync'' to
    start the process for


    your username. You''ll be switched to an authorisation screen to grant NixNote
    permission to access your notebook. Input the login details of the Evernote account
    in question, click ''OK'', and then continue. For security purposes, we suggest
    using one year. Click ''Authorize'' to complete.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_3.png)


    # 04 Evernote on Linux


    As we''ve previously mentioned, if you''re attempting to encourage and guide non-Linux
    corporate users towards Linux, NixNote is a great entry point. It''s a little
    sticky but demonstrates that any free and open source software is just usable
    as any of the proprietary operating systems they are used to. And if you''re applying
    for jobs as a Linux professional, you''ll feel right in this way, not by the end
    users, but by the interview panel.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_4.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_22_5.png)'
