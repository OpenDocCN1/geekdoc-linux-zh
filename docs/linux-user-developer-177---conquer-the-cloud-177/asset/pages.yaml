  md: '# Review Media players


    # VLC


    Are VLC''s regular updates keeping ahead of the chasing pack?


    ![](img/a6a91935f07f13d62210d3016f91c5fc_81_0.png)


    You can edit and play with audio effects to enhance the playback of your video
    files


    # User interface and overall design


    From the outset, VLC highlights its simplicity with a one-click system in place
    to get your video files playing. It''s a system that can work flawlessly; however,
    through the tools, there is enough scope to control the UI through series of unique
    keys. You don''t necessarily add anything extra to the experience, but they do
    look nice.


    # Media management


    Users have support options on when they come to playing their files. There are
    options for uploading multiple files simultaneously, as well as playing content
    from a disc, both work well in here. However, we found the direct network stream
    option easy to set up properly. It is a big feature for you.


    # Basic and advanced playback


    A series of controls controls the bottom of the player and all the basic support
    you need. Included is also the advanced management function, which is particularly
    good for editing videos. These are especially useful if you have an external scroll
    bar to adjust to.


    # Plugins and extras


    There are hundreds of extras included within VLC and others can be downloaded
    from the net. It is a system that provides created content at the top of the list.
    Being able to improve VLC''s subtitle functionality is the first plugin that others
    should explore, and the native support is rosy for the most part.


    # Overall


    VLC keeps on improving and renewing updates to its plugin manager have made it
    truly hard to beat. No matter what you''re running, VLC is a worthy addition to
    your choice of software.


    # Kodi


    Learn the basics and Kodi will reward you with a great experience


    ![](img/a6a91935f07f13d62210d3016f91c5fc_81_1.png)


    Take your time to go through Kodi''s library of settings to get the program perfectly
    tailored for


    # User interface and overall design


    Kodi has recently launched its 17.1, which offers a massive visual overhaul. For
    new users, it''s a very intuitive system that doesn''t overwhelm you with a stream
    of unnecessary options when it comes to the initial setup. The side-menu includes
    all the menu items for managing and watching video files.


    # Media management


    Kodi is the best media management system. Importing takes all but a few minutes
    to complete - depending on the size of files - with the program pulling in all
    relevant data and cover art for your films. Kodi uses a library to show off your
    films with a series of small animations to enhance it better.


    # Basic and advanced playback


    There''s a good level of playback control for your files in Kodi, but it can be
