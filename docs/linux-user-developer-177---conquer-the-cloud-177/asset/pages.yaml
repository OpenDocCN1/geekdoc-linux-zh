  md: '# Tutorial SuExec Apache


    # # Managing user privileges with SuExec Apache


    SuExec for improved security and enables Apache to execute CGI scripts as the
    original user


    ![](img/a6a91935f07f13d62210d3016f91c5fc_41_0.png)


    # Hello, World.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_41_1.png)


    After installation, the key to configuring SuExec is the virtualhost set


    +   SuExec (with User Execution) is a system that enables Apache users to run
    CGI and SSL files on a different web server, from the one that runs the original
    user


    Normally, these programs run as the same user as the web server, for example www-data
    on Ubuntu or some other (distributions).


    SuExec can reduce the security risks that occur when users run their own CGI scripts,
    in a multi-tenant environment. This is because SuExec performs a directory check
    to ensure that the directory containing the script is only writable by the owner
    user - the web server will return an error 500 if this is not the case.


    Keep in mind that the script must be executable - this is frequently overlooked
    by a lot of people and can also lead to an error 500. Cleaning environment can
    occur, we''ll detail later.


    # 01 Set up the LAMP stack


    In order to configure SuExec, ensure that you have a LAMP stack installed. You
    can verify the operation of Apache and PHP by creating a php file in /var/www
    with the content <?php phpinfo(); ?>; If PHP is rendered correctly, then loading
    the file in your browser. If you see the contents of the file, you may have a
    problem with the libapache2-mod-php package. This is a common oversight: base
    Apache2 implements a standard site that you''ll reference in this article.


