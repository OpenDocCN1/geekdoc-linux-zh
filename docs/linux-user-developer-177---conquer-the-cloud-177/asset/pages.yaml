    # # Create a real-time LED humidity display with Python


    Use the Astro Pi (aka SenseHAT) to take humidity readings and immediately display
    the results


    ![](img/a6a91935f07f13d62210d3016f91c5fc_71_0.png)


    **Dan Aldred**

    is a Raspberry Pi Certified Educator and a Lunch School Teacher for CAS. He led
