  md: '![](img/a6a91935f07f13d62210d3016f91c5fc_56_0.png)


    # # WHY GO VIRTUAL?


    Why would you want to use a VPN? Privacy and security concerns are the most common
    reasons for setting up private networks, but they are not the only ones.


    Whether you are using your home broadband or roaming mobile data in a foreign
    country, there''s a good chance you''ll be subject to traffic shaping employed
    by service providers to limit the certain types of traffic across their network.
    For example, many of the UK network providers use shaping to throttle down music
    and video streaming services when out of content, in order to discourage customers
    from using large amounts. Similarly, some UK providers will do the same with file
    downloads at peak hour. A VPN can help avoid this, as it encrypts all traffic
    going across your connection, such that your provider won''t be able to see exactly
    what you are doing. One caveat is that some providers may detect and throttle
    VPN traffic although with a wealth of different providers available, this can
    be avoided by using a less common service (typically, not OpenVPN).


    ![](img/a6a91935f07f13d62210d3016f91c5fc_56_1.png)


    if you use your Linux machine to access the internet, it''s worth learning about
    the pros and cons of Virtual Private Networks (VPNs). A VPN enables you to secure
    traffic between two locations - the first being either your own VPN provider or
    a VPN system that you have deployed elsewhere and the second another location
    of your choice, such as in the office.


    VPNs are available using a host of different protocols, but their essence is that
    traffic is encrypted at the host and decrypted at the server, ensuring


    that cannot be snooped by by any middle-man on the way to its destination.


    While using a VPN, there are a number of different options related to routing.
    The typical scenario is to route all traffic through the VPN connection. However,
    you can also use ''split tunneling'', where some network addresses bypass the
    VPN connection and use the regular internet connection, based on routing rules.


    VPNs are often used as a tool for those worried about persecution for their activity,
    but they offer peace of mind for anyone who sends data over public networks.'
  merge: -1
  img_proc: true
