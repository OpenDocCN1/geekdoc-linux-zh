- pgno: 23
  md: '# Feature Conquer the cloud


    # REPLACE A COMPLETE NETWORK

    ENVIRONMENT WITH NEXTCLOUD


    Get to grips with file, calendar and contact syncing


    If you''re looking for an easy way to try out a cloud server on your own hardware
    – as opposed to looking at Google Cloud Services, see peck – then Nextcloud is
    an excellent option to try. By the co-founder of owncloud, Frank Karitschke, Nextcloud
    is ideal for any organisation, offering freedom from anywhere macOS, Windows and
    Linux computers. There''s also support for mobile devices running Android and
    iOS – and so on.


    Pretty much the open source cloud server, Nextcloud is designed as the complete
    enterprise cloud solution. Data, such as documents, photos, projects and contact
    information is stored in a Nextcloud data centre and accessed from anywhere –
    if policy allows it. Nextcloud also indicators for data security and offers granular
    workflow management control to direct the flow of data between users or servers.
    Meanwhile, client apps have full control over data created by the end user.


    Any business considering Nextcloud is being crying out for professionals with
    experience. You can gain it by installing it from the cover disc or downloading
    it from the website or demos@nextcloud.com.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_23_0.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_23_1.png)


    The archive contains an executable file that you run once. After that select your
    setup options.


    Execute the file and follow the prompts. If you already have Nextcloud, run it
    with the update command.


    Details and finish installation.


    +   - Archive File

    For server users

    - Users

    - Admins

    - Developers

    - Testers


    +   - Web Installer

    For shared hosts


    +   - Appliances

    For easy deployment

    - The Forum

    - IRC Channel


    Nextcloud installer will start a wizard that will help you to configure your environment.


    Nextcloud will check if your system meets the requirements. We recommend


    These consists of

    Considering helping

    Your own needs


    # 01 Install the server and client


    To started with Nextcloud, you''ll need to install the server and the client.
    They will be different devices, but if you''re using a short of PC, a mobile device
    as the client. As noted, mobile versions for Android and iOS are also available.
    Enterprises users running Windows and Mac computers will also be able to access
    Nextcloud storage. You can install from your cover disc or head to https://nextcloud.com/install.


    # 02 Three options to install


    You install Nextcloud on a dedicated server, a PC, or as a virtual application.
    The physical demand requires you to check MD5 integrity and is also option to
    verify authenticity via PGP. Meanwhile, a web installer is provided for shared
    hosts, while the Nextcloud VM is an excellent way to try it out in the safety
    of a virtual environment. We recommend using this option, for ease of deployment,
    and to try the out on your PC.'
