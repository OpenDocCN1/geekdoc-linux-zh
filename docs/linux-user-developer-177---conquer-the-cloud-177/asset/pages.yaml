  md: '# Feature VPNs and VPSs


    # GUIDE: SET UP YOUR VPN AND VPS


    Getting your first VPS or VPN up and rolling doesn''t be daunting


    You''ve read about the different VPN options and why a VPN is a useful tool to
    have in your Linux armour. In this guide we''ll take you through the process of
    setting up for and configuring a VPS with a couple of different providers, then
    installing WireGuard or Algo to suit your needs before finally configuring your
    client to connect to your new VPN.

    So where do you deploy your VPS? All of the best providers offer some free trial,
    so you can run a VPS for a month, if not longer. ArubaCloud is our cheapest, offering
    Ubuntu VPS servers with 1 vCPU, 1GB RAM, 20GB storage and 1TB of bandwidth for
    €1 per month with an e euro credit. The downside is the admin interface is somewhat
    unwise of the best control panels. DigitalOcean offers servers with 1 vCPU, 512MB
    RAM, 25GB storage and 1TB of bandwidth for $5 per month, with a free $10 credit
    on signup. Both providers have a number of European datacentres.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_61_0.png)


    Amazon Lightsail


    ![](img/a6a91935f07f13d62210d3016f91c5fc_61_1.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_61_2.png)


    ![](img/a6a91935f07f13d62210d3016f91c5fc_61_3.png)


    +   01 Which VPN platform to use?

    What factors should you consider when deciding which VPN platform to use?

    A good idea is to load up the homepages of each of the options and read through
    them to see what they offer.

    WireGuard is a great way to start with a full host of features. Also keeps it
    simple and secure if you want to go bare bones and not too much to the server.
    With a number of cheap VPSs available, why not try them?


    +   02 Deciding on your VPS platform

    Now you''ve decided what you''re going to need, decide which VPS platform you
    are going to use. We mentioned previously that a number offer you a free trial.
    It''s sensible to check out the admin interface of the guide you are going to
    use and which providers are supported out of the box. All can deploy to a box.
    Ubuntu box, a deployment that spins up a box is the easiest option of all.


    +   03 Where do you want your server?

    Another consideration is where you want your physical box to be located? This
    question is lately dictated by where you want to do with it. If you want your
    VPN to break out in the UK, then Lightsail is US-only locations. If you want to
    be explicit in the US, it''s ideal. DigitalOcean, has datacentres in the Netherlands,
    Singapore, the US, London, Germany, Canada and India.


