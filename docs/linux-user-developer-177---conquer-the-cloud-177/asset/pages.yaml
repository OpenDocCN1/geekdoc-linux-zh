  md: '# Tutorial


    # Make a Bitcoin cold store


    Put your Bitcoins on ice and use a Raspberry Pi as a cold wallet to store all
    your digital currency safely offline


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_0.png)


    Nate Drake

    is a freelance finance journalist, specialising in cybersecurity and retro tech
    @natewriter


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_1.png)


    > What you''ll need

    Suitable for all models of Pi (Pi Zero recommended). For security reasons, you
    need a dedicated Pi for this project.


    As you''re probably aware, the cryptocurrency Bitcoin can be used to make anonymous
    and irreversible payments, similar to hard cash. But for privacy-minded people,
    the fact that it is digital currency means that hackers often target owners of
    Bitcoin software wallets. In this tutorial, we''ll explore a solution using the
    lightweight Bitcoin Wallet Electron on the Raspberry Pi. The Pi will hold your
    private keys kept offline at all times.


    You''ll also need to set up online ''watching'' wallet on another computer to
    receive payments as they come. Payments are only sent by generating a transaction
    with your watching wallet, which you transfer manually via a USB stick to your
    ''cold'' wallet to be signed.


    As your cold wallet is offline, only people with physical access can make payments,
    which enables you to store Bitcoins safely.


    This guide assumes you are familiar with the basics of Bitcoin. If not, visit
    this tutorial introduction page http://bit.ly/2tmCt2x for a rundown.


    For security reasons, you should only use this Pi as a wallet for future purchases.


    The repositories (repos) have an old version of the Electron wallet, but it is
    best to download the latest version manually.


    Next, run the following two commands to install the latest wallet software with
    sudo apt-get install python3-pip. Install it using http://download.electron.org/2.17/Electron-2.17.tar.gz.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_2.png)


    +   01 Install software

    Connect the Pi to a screen and keyboard. Terminal and run these two commands:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    +   02 Disconnect from the internet

    This step is for ensuring your wallet is safe. Remove any networks and Wi-Fi adapters
    connected to your Pi. If you use a Pi, 3, simply click on the wireless and Bluetooth
    icons on the Pi and choose ''Turn off Wi-Fi and Bluetooth''. Keep your Pi connected
    to a monitor and keyboard, which you will need for sending payments. Once you''re
    offline, run the command element in Terminal to start the wallet.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_73_3.png)


    74'
