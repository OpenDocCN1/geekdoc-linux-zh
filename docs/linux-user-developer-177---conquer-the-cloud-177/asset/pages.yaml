  md: '# # Tutorial NGINX


    # # Secure your NGINX web server


    NGINX has become a hugely popular web server choice. In this tutorial, we show
    how to secure your setup


    ![](img/a6a91935f07f13d62210d3016f91c5fc_37_0.png)


    Nishit Tiwari

    A software developer with a huge interest in free and open source software. As
    well as a moderator and author for leading FOSS projects helps organizations understand
    their business needs.


    Welcome to the tutorial!

    The goal of this tutorial is to teach you how to install, configure and much more
    about NGINX.

    Thank you for using this tutorial.


    NGINX is a lightweight, high-performance web server that can handle almost all
    the tasks and has become impressive for performance and stability. According to
    NetWorkers'' February 2017 report, 28.3% of all the-hosting websites, such as
    WordPress, Hulu, and GitHub, use NGINX. In comparison, NGINX was at 16.3% in January
    2015.


    Unlike traditional servers, NGINX does not use to handle requests, but a much
    more event-driven architecture. Its popularity means increased security concerns.
    Since NGINX serves through modules, a security vulnerability could affect many
    users.


    In this tutorial, we will explore third-party modules, such as NAXLI and FailBan,
    which you can use to secure your installation. We will also include how to set
    up SSL certificates, protection section and prevention of information disclosure
    via HTTP headers.


    #  Resources


    www.nginx.com


    # 01 Getting started


    In this tutorial, we will create an NGINX web server using Ubuntu 16.04 as the
    base distribution. To install NGINX, execute:


    ```

    $ sudo apt-get update

    sudo apt-get install nginx

    ```


    ```

    # To run a command as administrator (root), use ''sudo''

    sudo apt-get update

    sudo apt-get install nginx

    # Check if NGINX is installed correctly

    service nginx status

    # Check if the server is running

    curl -I http://localhost

    # If you see HTTP/1.1 OK, then the server is working.

    ```


    NGINX automatically starts once it is installed. You can access your server via
    browser to check if it''s running. By default the server points to http://localhost.
    To ensure that your web server restarts automatically when the server reboots,
    execute the following: If this is already enabled, you will get an error message.


    # $ sudo update-rc.d nginx defaults


    As the basic requirements for a secure web server, you need to have SSL configured
    and a non-root user with sudo privileges.


    NGINX releases frequent security patches. To make sure your server is backed up
    and for updates, use the following command:


    # $ sudo apt-get upgrade nginx


    It''s better to keep the system up to date, too. Update the repository list and
    all currently installed apt-get managed packages:


    # $ sudo apt-get update && sudo apt-get upgrade


    # 02 Prevent information disclosure


    An NGINX server, exposes lots of data in the form of HTTP headers, application
    error reporting and so. For example, try checking the operating system with:


    ```

    $ curl -i /localhost

    ```


    The output shows the NGINX version and operating system. You can limit the data
    leaked by editing the nginx.conf file and hiding the information:


    # $ sudo nano /etc/nginx/nginx.conf


    Add a line within HTTP configuration of the configuration file to turn off servers:


    ```

    ##

    # Basic Settings

    server_tokens off;

    ```


    Now save and reload the server:


    # $ sudo service nginx reload


    The command will hide the NGINX version and operating system name now. If you
    run NGINX with PHP, the curl output will include OS details with PHP version details.
    To hide this, edit the php.ini file in the back-engine:


