- pgno: 25
  md: '# Feature Conquer the cloud


    # RUN A VIRTUAL MACHINE WITH GOOGLE CLOUD PLATFORM


    Get to grips with an all-important cloud technology


    If you''re looking to extend your skills to a job in any modern IT department,
    having knowledge of the products and services on offer from the likes of Google
    Cloud Platform is vital. The vast collection of technologies available. An overview
    of what Google Cloud Platform offers will help you spend time your fingers dirty
    and using it as much as you can.


    A free trial gives you access to cloud tools by some of the world''s biggest companies.
    This affords the ability to run virtual machines on Google infrastructure, create
    SQL databases, NoSQL databases, and manage a cloud network. Security tools are
    also at your fingertips, are data warehousing tools, and more.


    As you might expect, development tools (including cloud tools for Android Studio)
    are also available. There is, however, a caveat with all of this—that free trial
    is


    ![](img/a6a91935f07f13d62210d3016f91c5fc_25_0.png)


    run out quite as there is much to look at. But understanding and knowledge of
    the technologies are vital when


    searching for a new job, whether using individuals or as part of Google Cloud
    Platform.


    ![](img/a6a91935f07f13d62210d3016f91c5fc_25_1.png)


    # 01 Set up a free trial


    Google Cloud Platform offers you the ability to set up a free 60-day trial to
    get started with the service. You will need to provide credit card details. Justify
    this as you are a human and not a bot. However, Google will not charge you any
    point or after the trial period without your permission. If you''ve signed up,
    you will be prompted to create a new project. Give it a try—beginning is easy
    and click ''create''


    # 02 Browse the built-in projects


    Although you can create your own projects in Google Cloud Platform, it is worth
    exploring the many existing projects that can be launched with just a few clicks.
    To find these, get Started and click on Marketplace. Here, you''ll find a wide
    selection of selections on offer, such as LAMP stacks, WordPress, Cloudflare,
    and Linux servers. A number of over 82 virtual machines are free to use.


    # 03 Deploy your virtual machine


    Once you''ve settled on a virtual machine, it''s time to deploy. Many of the virtual
    applications available in Google Cloud Platform are provided by Binary, if you''ve
    ever used this on your own PC, you know how to install it. Other providers are
    also available. To deploy your chosen VM, click it in the launcher, then Launch
    on Compute Engine. Wait until the instances initialize—it can take time—and get
    to work with your virtual machine.


    26'
