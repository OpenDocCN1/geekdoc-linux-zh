  md: '# Tutorial OpenWRT


    ![](img/a6a91935f07f13d62210d3016f91c5fc_33_0.png)


    Tam Hanna

    is the CEO of the Breitavada-based consulting company Tamgemogen Holding''s. The
    firm''s is consulting in the development of interdisciplinary systems consisting
    of software, HID and hardware.


    # Add hardware access to OpenWRT


    # Use OpenWRT''s hardware controls to make home gateway redundant


    The Raspberry Pi''s GPIO layout might not be everybody''s taste, but we cannot
    argue that the 40-pin header provides ample opportunities to connect all kinds
    of hardware. Many of the things that we mentioned should be well-known to frequent
    readers of the PI, few small obstacles when getting them to run OpenWRT. This
    article assumes that you are at the stage where you have followed tutorials and
    require a custom OpenWRT build. If you attempt to build it with the code repositories
    from the OpenWRT project, it will not work.


    In practice, accessing resources on microprocessors involves writing specific
    values to registers. There are several memory locations (as be seen in Figure
    1) which are mapped.


    Providing direct access to the memory can lead to all kinds of trouble. The stark
    difference between the Linux kernel, and Windows is a good example—by default,
    does not allow unlimited access to memory.


    This particular restriction is fixed by setting a special constant, which forces
    the kernel to be less strict about memory protection.


    In our case, the found the method at http://bit.ly/STRICT_DEVMEM provides further
    information about the solution and the way that it can be enabled via the graphical
    menuconfig system.


    Even though the author could give you a step-by-step instruction on how to include
    the option in the menu, it stands instead


    Resources

    OpenWRT

    https://openwrt.org


    | TABLE 4-4 | SUMMARY OF REGISTERS ASSOCIATED WITH PORT | Figure 1 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | Address | Name | R0 | R1 | R2 | R3 | R4 | R5 | R6 | R7 | R8 | R9 | R10 | R11
    | R12 | R13 | R14 | R15 | PORT RESSETS | PORT INTERRUPTS | |

    | | | | | | | | | | | | | | | | | | | | |

    | | | | | | | | | | | | | | | | | | | | |

    | | | | | | | | | | | | | | | | | | | | |


    Above Microchip''s PIC16F84A has a set of registers dedicated to input and output
    pin


    +   * /vfs/ext44_find -name config

    xargs | grep config DEVMEM

    * /build/target-arm-cortex-a3on-vfp4_mu-1.1.16/linux/linux-arm/brcm2837-bcm710/

    * /build/target-arm-cortex-a3on-vfp4_mu-1.1.16/linux/linux-arm/brcm2837-bcm710/linux-4.4/drivers/char/config.config
