    | Additional ini files |


    # 02 Enable the cgi module


    In order to use CGI in Apache, you''ll first need to enable the appropriate module.
    Browse the Apache configuration directory, in the modules-enabled directory (typically
    /etc/apache2/mods-enabled) and you should enable a cgi_load, using the appropriate
    module with a LoadModule cgi_module /usr/lib/apache2/modules/mod_cgi.so directive.
