  md: 'There are four important tables in iptables and the functionality of each one
    is listed:


    +   - filter - This table provides the packet-filtering feature of the firewall.
    Access control decisions made in this table for packets coming into and leaving
    your Linux system.

    - nat - This is the Network Address Translation function for remapping IP address
    space into another.

    - mangle - This can be used to modify rules in the table.

    - raw - This is used to exclude certain packets from connection tracking.


    DROP - The network packet is dropped and not allowed into the server; a rejection
    message is not sent.


    It is normal to use the DROP action on inbound traffic so that malicious personnel
    are unaware that their traffic is blocked.

    Even though Ubuntu Server will come with the firewall up and running, it is good
    practice to check and see if it is enabled. The commands that we can enable rules
    are slightly different on various Linux distributions. On our Ubuntu, for example,
    the firewall is ufw (Uncomplicated Firewall), a front-end for iptables and to
    check if it is running or not,


    Of the above tables, firewall administrators need to focus on the filter table.

    For each filter, you can set up a rule and this rules what action to be taken
    for that specific packet. The firewall can identify a packet based on the source
    IP, destination IP, protocol and inbound/output interface. If there''s no rule
    for it, the overall policy will be drop. When a network packet matches a specific
    rule.


