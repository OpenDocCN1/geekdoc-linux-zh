    # RASPBERRY PI


    # Meet the all-new Raspberry Pi Zero W with injection-moulded case


    The Raspberry Pi Zero hasn''t shown any signs of slowing down since its debut
    five years ago. Since then it has numbered an array of excellent add-ons and has
    almost all existing records for single-board computers. As a way of celebrating
    Raspberry Pi Zero''s fifth birthday, the Foundation has released the Raspberry
    Pi Zero (see our review) up W. Until now, the Pi has been the leading choice for
    budget developers as it can handle many of the projects that the original Pi can
    and comes with a wide range of accessories. Like the Pi Zero, the W model follows
    the same design ethic and


    remains noticeably smaller than the full Raspberry Pi model, which has a big factor
    in its size. The most exciting aspect of the W model is that it adds wireless
    capabilities to the mini computing world with embedded 802.11b/g/n Wi-Fi and Bluetooth.


    CSI camera connectors. The W model is identical to the original Zero, but the
    wireless chip makes it slightly heavier. Alongside the Pi, Raspberry Pi Foundation
    will also include an injection-moulded case, designed by Pimoroni and a set of
    interchangeable lids. Each lid is tailored to different types of projects. One
    of the lids is designed out for GPIO with a hole for an additional camera module.
    The case also includes a ribbon cable holder and a set of screws. The lid and
    case will be available separately from the Pi Zero and W, priced at £6.


    However, the added capabilities mean the W model will cost double the original.
    For UK users, prices will start at £10 and be available from all trusted Raspberry
    Pi stores.


    Aside from the added connectivity, the Pi W boasts an impressive price tag. There''s
    a BCM2835- core chip at 1GHz, alongside 512MB of RAM. Ports are also included,
    with options for both HDMI and OTG available—the list is HAT-compatible, slideable
    composite and video


    The W model adds a wireless chip that has 802.11 b/g Wi-Fi and Bluetooth 4.0


    As expected with the launch of the Pi, stocks of the Zero W are likely to be sparse
    and a number of UK stocks have sold out. The Foundation hasn''t found any exact
    numbers yet it has allocated stock to each stock but we recommend getting your
    unit as soon as possible'
