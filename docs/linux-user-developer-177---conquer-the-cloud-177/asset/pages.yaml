- pgno: 28
  md: '# # Create a web app with Ice


    Web apps that are built in Peppermint 7 can be added

    via the Ice tool. Give the application a name, then the URL, in

    the corresponding field, in the first box, with the

    URL to the English language version in the second box.


    You can then decide which sub-menu the app will appear

    in, which web browser it should open in, and whether to make it the default

    nbrowser. Firefox is pre-installed in Peppermint 7, so use this for

    a first try. Click ‘Apply’ to create the app, then browse to the

    appropriate menu to find it.


    # # 04 Standard app installation


    Peppermint 7''s focus is on cloud apps, you can still

    install Linux software. Using APT, you can do this by

    opening a Terminal and installing

    sudo apt install package-name followed by the appropriate package name.


    Additionally, you''ll find Software Manager in the System Settings.

    If you find the tool you''re looking for isn''t available in either, Gebi

    Package Installer is also installed. So, you''re covered for all

    your apps, whether running in the cloud or not.


    # # 05 Useful preinstalled


    Peppermint 7 has several useful built-in tools. For

    example, the App Manager and System Tools menu is useful. You''ll

    find very useful UI Image Writer and USB Stick Formatter

    tool. Also you''ll find Samba for connecting to

    network and printers, as well as the System Settings:

    Task Manager, Update Manager, and LXDE GT. There''s also

    the desktop wallpaper tool to customise the welcome

    screen for your computer and catering to new users.


    # # 06 Peppermint 7


    One element of Peppermint 7 that should not be

    overlooked is the integrated Linux search in the

    simplified Settings Panel. Obviously a menu that acts like an

    umbrella over other Linux tools and preferences means,

    it makes the job of administering a production system on the desk

    of an end user far simpler than say, like Ubuntu. You can find the

    Peppermint Settings and Peppermint Control Centre in the

    Menu > Preferences screen.


