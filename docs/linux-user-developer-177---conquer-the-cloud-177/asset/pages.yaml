    | Security considerations with SuExec |

    | --- |

    | There are often questions around whether SuExec creates security vulnerabilities
    if implemented correctly. Put simply, SuExec enables scripts to run as the script
    owner rather than the user. In an Apache environment, vulnerabilities could compromise
    security, whereas in a SuExec environment,...


    present a single module with the command a2mod cgi then restart Apache with service
    apache restart. The web server should restart without any warnings and you should
