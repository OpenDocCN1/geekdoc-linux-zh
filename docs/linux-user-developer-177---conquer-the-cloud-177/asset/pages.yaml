  md: '# TOP FIVE


    # Top accessories for the Raspberry Pi


    ![](img/a6a91935f07f13d62210d3016f91c5fc_8_0.png)


    # 1 Pi Camera V2


    This quintessential camera is the official accessory from the Raspberry Pi Foundation.
    It''s a high-quality 8-megapixel snapper, which is capable of reproducing 1080p,
    640p at 30FPS, 1080p at 30FPS, or 720p at 60FPS.


    # 2 WDLabs Media Stick


    If you love creating entertainment projects, this is the accessory for you. The
    Media Stick is fully user-size with touch module programming. It also boasts a
    full HDMI port, dual USB ports and an additional micro-USB port.


    # 3 Adafruit PiTNT


    This 2.8-inch TFT display is large expected for the Raspberry Pi. As well as boosting
    creativity, you can use it as a central console, media player or as a subtitle
    for file management.


    # 4 Raspberry Pi-Top


    The Pi-Top is essentially your Raspberry Pi turned into a fully functional laptop.
    The project is open source and encourages developing with the Pi. It also uses
    the Raspberry OS at its core, which is worth checking out.


    # 5 Adafruit 16-Channel PWM/Servo-HAT


    The Pi is great for a lot of things, but it struggles with electronics. This HAT
    has many features that allow you to add and control 16 servos in sequence without
    needing to do anything but wiring.


    # APPS


    # Mozilla Corp acquires

    Pocket to enhance

    mobile foothold


    # Pocket counts 10 million active users


    Firefox browser creator, Mozilla has officially announced the acquisition of the
    popular Pocket app. The app has gained fame for being the best method for saving
    articles, videos, and other web content in place. A major plus for the acquisition
    will be Mozilla''s million strong user base, which has been growing since its
    first launch on the Android platform.


    "Pocket''s mission is to create a platform that enables users to share, save and
    consume the content they want. And by doing so, we hope it becomes easier to save
    and find ''high quality'' content," said CEO Nate Weiner. "What matters most to
    us is being able to make a real impact in the lives of our users. We''ve finally
    found a powerful new ally in helping us achieve our mission while building a better,
    healthier and more interesting internet in the process."


    to socialise with other users through their Discovery feature. People can then
    rate, share their own content and message with other people who like what they
    love. It is largely expected that the Mozilla team will bring forth the features
    of Firefox and integrate both.


    However, it is uncertain whether the core team will be brought over to Mozilla.
    Weiner has lauded that the team will remain part of the project, which will continue
    growing independent of Mozilla Corp. We will be in charge of ownership, anyway.
    Our team and our existing roadmap has been reinforced and is clearer than ever.


    As well as a central hub for storing web content, Pocket also enables its users
    to have a few major updates up what they get into their hands in the months.


    When the first Mozilla-affiliated Pocket app launched, Pocket recently released
    an iMessage app, indicating its business as usual.'
