  md: '# Controlling the boot process


    Change the run level by modifying /etc/inittab.


    It is possible to finely control the boot process by modifying scripts within
    "rc" directories.


    +   - In Red Hat Linux, they are in the /etc/rc.d directory

    - In SuSE Linux, they are in /etc/init.d/rc

    - In Debian Linux, they are in /etc


    There is an "rc" directory that corresponds to each run level. For example, rc3
    corresponds to run level 3. You''ll look for the corresponding directory to the
    run level you wish to modify. Within that directory, you''ll find scripts for
    each of the services on the system. Each script name includes an "S" or a "K".
    Scripts with "S" start indicated daemons within the directory''s run level. Scripts
    which start with "K" kill daemons within the run level. (Scripts in an rc directory
    are executed in alphabetical, then numerical order)


    | Debian:/etc/rc3.db | S20daald | S20beth-common | S20sprintf |

    |---|---|---|---|

    | K1anacron | S20exim | S20ints-kernel-server | S21ifs-common |

    | S18syslogd | S20ftam | S20pcmelia | S88of lushu |

    | S11killlog | S21kbuttons | S89anacron |

    | S14pp | S21r8kom | S20postgresql | S89atad |

    | S15ind9 | S20rsync | S89cron |

    | S15dsmasq | S20inetd | S20amba |

    | S19guissed | S20isutils | S20smartdevtools | S99apache |

    | S19vassassin | S20bsd | S20office | S99stop-bootlogd |

    | S20apod | S20madedev | S99ptctli |

    | S20cupsys | S20nstatalk | |

    |debian:/etc/rc3.db | | | |


    Figure 6 Scripts within an rc directory


    Notice in the scene capture that there are scripts starting with the letter "S".
    These are the scripts that are started when the run level is chosen. Note that
    the "S" is followed by a number, which indicates the order in which the scripts
    run. If certain processes were to be killed (such as anacron), they would be listed
    with their name preceded by a "K".


    You''ll also notice scripts in /etc/rc.d called, rc.local, and rc.sysinit. The
    rc script is responsible for starting and stopping services when runlevels change,
    rc.sysinit runs once at boot time before other scripts, and rc.local runs after
    all the other scripts. You can put your initialization stuff in rc.local instead
    of working through the System V runlevels.


    # Using chconfig to Manage Startup Daemons (Services)


    The chconfig utility is a convenient way to manage and monitor startup daemons.
    There are several switches available with chconfig, however, commonly used switches
    with:

    chconfig --list all lists of the services which chconfig knows about, and whether'
