    # When your boot loader is LILO


    Many Linux systems today use the GRUB boot loader, but some distributions use
    LILO (Linux Loader). If you need to reset the root password on a system using
    LILO, you can use this procedure.


    At the LILO boot screen, enter CTRL+X to get a text mode boot prompt. Enter "linux
    single" at the prompt and press enter. The system will boot into runlevel one
    (single user mode) as root. You can then use the "passwd" command to change the
    root password and reboot your system to operate normally.


    # soundthinking point: Physical Security


    The preceding exercise underscores the importance of maintaining physical security
    of your servers in locked closets, locking equipment racks, or secure data centers.'
