    # Linux Compression and Archiving Tools


    Archiving is the process of storing multiple files in one file to simplify backup,
    moving, and transfer. Compression uses various algorithms to store files and directories
    in a way that consumes less space on the disk or tape. A common practice is to
    create an archive file and then compress it.


    “tar” is a commonly-used archiving utility. It saves many files together in a
    single archive for tape or disk and allows the restoration of individual files
    from that archive.


