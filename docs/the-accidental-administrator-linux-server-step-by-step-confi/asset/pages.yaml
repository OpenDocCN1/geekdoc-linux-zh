  md: '# Network Administration


    # Network Configuration Files


    The /etc/sysconfig/network file contains non-interface specific parameters such
    as enabling networking, the persistent hostname, and the default gateway.


    # Network Card Configuration


    Check the /etc/sysconfig/network-scripts/ifcfg-eth[x] file (where “x” is the number
    of the interface to be configured.


    A sample interface configuration file might look like this:


    ```

    DEVICE=eth0

    BOOTPROTO=static

    ONBOOT=yes

    USERCTL=no

    PEERDNS=no

    TYPE=Ethernet

    IPADDR=10.16.0.100

    NETMASK=255.240.0.0

    GATEWAY=10.16.0.1

    NETWORK=10.16.0.0

    BROADCAST=10.31.255.255

    ```


    This file can be modified to meet your needs. Changes take effect upon a restart
    (service network restart).


    # RHEL/Fedora/CentOS Network Configuration Applet


    As an alternative to the text configuration file, RHEL/Fedora/CentOS provides
    a GUI tool that can be used to configure the network card. From within the GUI,
    click Desktop>>System Settings>>Network to open the Network Configuration Tool.
    From the CLI, type “system-config-network” to open it. If X is running, the GUI
    version of the tool will open. If X is not running, the text-based tool will open
    it.


    # Using ifconfig


    +   * ifconfig, typed by itself, will show you the network card is working and
    display a variety of information about its configuration including its IP address.

    * ifconfig eth0 10.20.30.1 netmask 255.240.0.0 will assign the IP address'
