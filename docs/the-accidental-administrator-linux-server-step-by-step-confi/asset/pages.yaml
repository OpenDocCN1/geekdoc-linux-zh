  md: '# Checking Disk Usage


    While inside a directory, you can check disk usage with the du command:


    ```

    # du -h -c -s

    ```


    (-h) includes an identification as to whether the number displayed represents
    kilobytes, megabytes, etc., -c provides totals, and -s makes it a short display
    without detailing subdirectories).


    ```

    [root@instructor samba]# cd /etc

    [root@instructor etc]# du -h -c -s

    166M total

    [root@instructor etc]# cd /common

    [root@instructor common]# du -h -c -s

    4.0K total

    ```


    **Figure 10** Checking disk usage with du


    As usual, for more information, check the man page:


    ```

    #man du

    ```'
