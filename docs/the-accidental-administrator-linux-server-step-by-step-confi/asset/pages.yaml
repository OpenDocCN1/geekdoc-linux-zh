  md: '+   * /etc/ is where configuration files and directories are located.

    * /home/ is the default location for users'' home directories.

    * /initrd/ is used to load required device modules and mount the initrd.img image
    file during system setup.

    * /lib/ and /usr/lib/ hold library files used by programs in /bin/ and /sbin/.

    * /lost+found/ holds orphaned files (files without names) found by fsck

    * /mnt/ holds the mount points for file systems that were mounted after boot.

    * /opt/ is used primarily for installation and uninstallation of third-party software.
    Holds optional files and programs.

    * /proc/ is a virtual directory (not actually stored on the disk) which holds
    system information required by certain programs.

    * /root/ is the home directory of the superuser “root"

    * /sbin/ and /usr/sbin/ store system commands.

    * /tmp/ is the temporary directory. All users have read+write access to /tmp/.

    * /usr/ contains files related to users such as application files and related
    library files (“usr” is an acronym for UNIX system resources).

    * /var/ (as in “variable”) holds files and directories that are constantly changing
    as printer pools and log files.


    The above is a brief overview of Linux/UNIX directory structures, search on “Filesystem
    Hierarchy Standard” at www.wikipedia.com.


