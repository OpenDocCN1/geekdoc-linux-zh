    The new permissions should be “rw” for the user and “r” for the group and the
    world (other).


    +   3. Execute the following command:

    #chmod 777 file


    +   4. Again, use the `ls -1` command to display the permissions. What happened?


    The permissions for file are now “rwx” for user, group, and world.


    # Setting Default Permissions


    The `umask` command is the user file-creation mask command which allows you set
    default permissions.


    The `umask` command uses an octal value that is the inverse of the values used
    with the `chmod` command for the group, and nothing for the world, if you wish
    to set permissions for a directory to full for the owner, read you would use `chmod`
    as follows:


    ```

    #chmod 740

    ```


    To set the default permissions for all future files and directories created to
    full for the owner, read for the group, and nothing for the world, use the `umask`
    command with a value that is the inverse of the value used with `chmod`:


    ```

    #umask 037

    ```


    Note that this is a universal command and cannot be applied to a single directory.'
