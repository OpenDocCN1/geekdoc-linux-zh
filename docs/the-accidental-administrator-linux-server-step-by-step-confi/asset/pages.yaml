    # Using sudo


    As discussed earlier, best practice is to have two user accounts for the administrator.
    One account is used for daily use and the “root” account is used only when needed
    for administrative purposes. You can use the switch user command to work as root,
    but doing so means that you have probably opened a terminal window and are executing
    all commands as root, whether needed or not. It can also be easy to forget back
    to your regular user account, exposing your system to potential security issues.


    An alternative is a tool called sudo. Sudo is similar to runas in Windows. It
    allows you to execute specific commands under root context without leaving your
    regular user profile or context. To use sudo, you preface the root command you
    wish to run with the word sudo. For example, if you want to run the command ifconfig,
    you would enter it as sudo ifconfig. If your account is allowed to run that command,
    it would then execute. Otherwise, you would receive an error.


