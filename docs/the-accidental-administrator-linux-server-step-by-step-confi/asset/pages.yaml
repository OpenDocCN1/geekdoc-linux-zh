  md: "# Linux File System\n\nDebian Etch, RedHat, SuSE, and other distributions use\
    \ the ext3 file system by default. ext3 is a journaling file system which offers\
    \ greater stability and reliability than predecessor file systems.\nAnother popular\
    \ journaling file system is ReiserFS. V3 of reiserfs is used as the default filesystem\
    \ for Windows, FTOSX, Libranet, Xandros and Yoper. Ext4 is also now available\
    \ and becoming a default file system in new Linux versions.\n\nLinux can also\
    \ read/write to many other file systems including FAT, FAT32, NTFS, HPFS, and\
    \ others. Partitions are mounted onto existing directories called \"mount-points\"\
    \n\nLinux uses a tree model to organize directories and files. Directories are\
    \ the basic unit of storage in the Linux file system. Directories can contain\
    \ files or other directories. In the same way that a tree cannot exist without\
    \ its roots, the Linux file system starts at root. Root is designated by \"/.\
    \ The term \"root\" is used in three different ways in Linux: \"Root\" is the\
    \ name of the user, to identify the superuser's home directory [/root], and to\
    \ indicate the root of the file system [/]. It can be difficult to know which\
    \ \"root\" someone is talking about. It helps to be clear about what is meant\
    \ when referring to \"root\"\n\n# Linux Files Types\n\nWhen you use the `ls -l`\
    \ command, Linux will display a listing of files along with information about\
    \ the files. The left hand column of the listing indicates the type of file. Three\
    \ common file types are regular files, links, and directories.\n\n# Regular files\n\
    \nRegular files are the most common file type on Linux or UNIX systems. They can\
    \ be used to store various types of data including text that you can read or binary\
    \ data that can be executed by the system. It is often helpful to identify more\
    \ information about the file than whether it is a regular file or not. For example,\
    \ you might want to know whether the file is an ASCII text file or a shell script.\
    \ \n\n```\n$file [filename]$\n```\n\n# Links\n\nLinks are files that point to\
    \ other files on the system. There are two types of links: hard links and symbolic\
    \ links.\n\nHard links are a special type of directory entry that have certain\
    \ limitations:\n\n+   - Hard links can only point to a file; they cannot point\
    \ to a directory.\n- They cannot be distinguished from the file to which they\
    \ are pointing.\n\nHard links are created with the `ln` command:\n\n```\n$ln [source]\
    \ [target]$\n```"
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Symbolic links are special files that store a pathname to another file.


    Symbolic links are created with the “ln” command, combined with the “-s” option:


    ```

    $ln -s [source pathname] [target]

    ```


    You can think of symbolic links as being similar to shortcuts in Microsoft Windows.


    # Directories


    Directories are containers that hold various types of files or other directories.
    Directories are used for organizing the file system.


    # Mounting a Device


    In order to make a device such as a CD-ROM or floppy drive available to the file
    system, it must be “mounted” to an existing mount point within the file system.
    Before using the “mount” command, ensure that the desired mount point already
    exists within the file system. A common place to locate mount points is within
    the /mnt directory (but they can be placed anywhere). To mount a device to the
    mount-point:


    ```

    #mount /dev/cdrom /mnt/cdrom

    ```


    You can navigate to the newly mounted device with the “cd” command:


    ```

    #cd /mnt/cdrom

    ```


    Before ejecting CDs or floppy disks, you must unmount them from the file system.
    To unmount a mount-point:


    ```

    #umount /mnt/cdrom

    ```


    Note that, before a mountpoint be unmounted, you must “CD” out of the directory
    which you etc wish to unmount.


    Partitions can be mounted automatically on boot through the fstab file, which
    is located at /etc/fstab.


    # Understanding Mount Points


    You can think of mount points as a way of accessing a partition. Recall that in
    Linux, everything is oriented around the file system. The first SCSI drive on
    a computer might be known as /dev/sda, the second as /dev/sdb, and so on. The
    first IDE drive would be known as /dev/hda. Partitions are numbered, the first
    partition on the first SCSI drive would be known as /dev/sda1, the second partition
    would be /dev/sda2, etc.


    You cannot, however, access partitions through /dev/ files; you must create mount
    points which are simply a means of gaining access to a partition through the computer''s
    file system.


    A basic partitioning scheme will usually have three partitions: /,boot, and a
    swap partition. Often, server administrators will create separate partitions for
    other purposes as shown below:'
