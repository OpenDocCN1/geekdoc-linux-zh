    # The init process


    +   - The sysinit is the first script that runs on a Linux system

    - Sysinit controls the most basic Linux services such as mounting the file systems
    specified in /etc/fstab, enabling the swap partition, setting system-wide environment
    variables, setting the system time, and other important operating system tasks.

    - After sysinit is run, the system is started in the default-run-level specified
    in the "inittab" file in the /etc directory. Run level 3 is the most common run
    level.

    - Any services defined in the default-run-level are started. The services are
