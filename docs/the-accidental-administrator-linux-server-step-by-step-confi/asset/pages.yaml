  md: 'Occasionally, the RPM database will become corrupted. This can occur when an
    RPM process is forcibly stopped using the “kill -9” command. Symptoms of a corrupted
    database are known and installed RPMs not being displayed when an RPM query is
    initiated. To repair a corrupted RPM database, begin by deleting the existing
    database:


    ```

