    In other words, the address will revert back to the original address upon restart.)


    +   - ifconfig eth0:0 10.20.30.1 netmask 255.0.0.0 will assign a second IP address
    of 10.20.30.1 to the first NIC. This process is known as IP aliasing.


    +   - ifconfig eth1 10.20.30.1 netmask 255.0.0.0 will assign the IP address 10.20.30.1
