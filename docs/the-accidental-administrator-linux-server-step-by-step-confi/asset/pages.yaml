  md: '4. cd into /common and create some files:

    #touch file1 file2 file3<enter>


    5. Use vim or the text editor of your choice to open the /etc/exports file (it
    is an empty

    file, but it should already be in /etc) with a text editor and add the line:

    /common 192.168.0.0/24(ro,sync)

    (Note: There are no spaces in the line except between "/common" and the IP

    address.)


    6. Save the file (by typing :wq in vi).


    7. Set the network access rights by modifying /etc/hosts.allow. Add the following
    line:

    portmap: 192.168.0.

    (Note the trailing period after the “0”).


    8. Deny all networks not explicitly permitted in /etc/hosts.allow by modifying

    /etc/hosts.deny with the following line:

    portmap: ALL


    NFS is dependent upon remote procedure calls (RPC) for proper operation. In order
    to

    map RPC requests to the correct services, the portmap service is required. portmap
    is

    notified by RPC processes as they start. They identify the port number they are

    monitoring and which RPC program numbers they’re expecting to service. The server’s

    portmap service is contacted by the client system with a specific RPC program
    number.

    The client is then redirected by portmap to the proper port number to communicate
    with

    it intended service.


    The portmap service can also be used with hosts access files (/etc/hosts.allow
    and

    /etc/hosts.deny) to control which remote systems (not users) are permitted to
    use RPC-

    based services on that particular server. Such control is based on IP address
    and is,

    therefore, subject to IP address spoofing attacks.


    9. Enable the export immediately with the following command:

    #exportfs -v'
