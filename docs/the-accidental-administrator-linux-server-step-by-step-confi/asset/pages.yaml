  md: "# Apache Web Server\n\nThe Apache Web Server is arguably the most popular of\
    \ all the web server software. By some estimates it has a market share of more\
    \ than 60%. It works on a large number of platforms, including UNIX, Linux, and\
    \ Windows. The Apache Web Server is generally regarded as being extremely flexible,\
    \ secure, and stable.\n\nThere is an online manual at `/var/www/www/manual/index.html`.\n\
    \n# Understanding Apache\n\nThree primary parts of Apache\n\n+   Httpd daemons\n\
    \  - Respond to incoming requests to the server's network interfaces\n  - The\
    \ requests are processed according to parameters specified in the configuration\
    \ files\n\nThe Apache configuration files\n\n+   - httpd.conf\n  - The primary\
    \ configuration file\n  - Magic\n  - Helps Apache identify different media types\n\
    \nWeb site's content\n\n+   - In Red Hat Linux, located in `/var/www/html` (the\
    \ Apache configuration file identifies the location of the document pages for\
    \ each distro\n\n# The Apache Configuration Directives\n\nThe Apache configuration\
    \ parameters are contained within directives in the httpd.conf file. The httpd.conf\
    \ file is divided into containers (also called “blocks”) which provide the structure\
    \ used by Apache to combine one or more directives into a single entity. Each\
    \ container includes a beginning and an end tag to bind the directives together.\
    \ Within each container, a directive is used to assign a variable or option.\n\
    \n# The Three Parts of httpd.conf\n\nThe httpd.conf file can be broken into three\
    \ parts: Global Environment, Main Server, and Virtual Hosts. Global Environment\
    \ defines the behavior of the httpd daemons. The directives in the Global Environment\
    \ section deal with the overall operation of your Web server. Main Server sets\
    \ the server's default behavior, and Virtual Hosts defines the parameters for\
    \ the virtual Web servers.\n\n# Developing a Virtual Site"
