    # Soundthinking point: Change Terminals


    As a true multi-user operating system, Linux allows you to change terminals and
    even log on as a different user. When in the CLI, use the key combination of Alt-F#
    to change to a different terminal. Type tty to display which terminal is active.


    # System shutdowns and reboots


    As with any operating system, it is very important to shut Linux down properly.
    During the shutdown process, services and daemons are stopped and file systems
    are unmounted in an orderly fashion. An improper shutdown can cause corrupted
    file systems and other problems that may prevent the system from booting successfully.


    The use of the "sync" command is recommended to flush the filesystem buffers,
    but synchronizing with the hard disk. Although it is possible to shut down the
    system by typing "init 0" or reboot by typing "init 6", it is recommended to use
    the shutdown command to perform an orderly shutdown. There are several switches
    that can be used with the shutdown command:


    +   shutdown -r reboots the system


    +   shutdown -h halts the system


    +   shutdown -h 10 shuts down and halts the system in 10 minutes


    +   shutdown -r 23:00 forces a reboot at 11:00 p.m.


    +   shutdown -c cancels a scheduled shutdown


    +   shutdown - Ignore the last shutdown message cancels a scheduled shutdown and
    broadcasts the message "Ignore the last shutdown message".


    +   shutdown -k 10 doesn''t shut the system down, but broadcasts the message that
    the system goes into maintenance mode in 10 minutes.


    Many distros also support the use of the "halt" command and the "reboot" command
    instead of requiring you to type the entire shutdown command with switches.'
