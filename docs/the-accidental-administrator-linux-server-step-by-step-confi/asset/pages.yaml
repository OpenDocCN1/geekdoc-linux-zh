  md: "# Using uptime\n\n“uptime” displays the current time, total time the system\
    \ has been running, the number of currently logged on users, and the system load\
    \ averages for the past one, five, and 15 minutes.\n\n# Using xload\n\n“xload”\
    \ shows a periodically updating histogram of average system load.\n\n# The /proc\
    \ directory\n\n /proc directory contains files and subdirectories that provide\
    \ information about the computer's resources and how they're allocated.\n\nUse\
    \ these commands to view the contents of the /proc directory:\n\n+   - /cat /proc/meminfo\
    \ has information about the computer's memory, including used memory, free memory,\
    \ and swap file size.\n\n+   - /cat /proc/cpuinfo will display information about\
    \ the computer's CPU including speed, cache, and model.\n\n+   - /cat /proc/partitions\
    \ shows information about the partitions in use by the system.\n\n+   - /cat /proc/swaps\
    \ displays information about the swap file or the swap partition.\n\n# Understanding\
    \ and using syslog\n\nsyslog is the Linux logging daemon. As with nearly everything\
    \ in Linux, it is highly configurable. syslog can track anything you wish on your\
    \ Linux system from kernel messages to logins to mail usage. You can configure\
    \ syslog by modifying /etc/syslog.conf on most Linux systems. If you do not find\
    \ syslog.conf under /etc, try “whereis syslog.conf” to locate it.\n\nsyslog.conf\
    \ controls the type of messages that are logged, the level of logging, and what\
    \ messages are stored. syslog is usually extensively commented and fairly easy\
    \ to understand. The format of syslog.conf is divided into two parts: selectors\
    \ and actions. Selectors is also divided into two parts: facility and level and\
    \ they are separated by a period. Selectors and actions are separated by a tab:\n\
    \n```\nfacility.level action\n```\n\nFacility is the source of the logging messages,\
    \ level is the amount of logging, and action is where to send the messages. For\
    \ example:\n\n```\nmail.info /var/log/maillog\n```\n\nsyslog to log messages concerning\
    \ using a level of “info” to /var/log/maillog. The available levels, in order\
    \ of decreasing severity, are emerg, alert, crit, err, warning, notice, info,\
    \ and debug. (debug syslog provides the greatest amount of information; emerg\
    \ provides the least.) You can also use wildcards in syslog.conf. For example:"
