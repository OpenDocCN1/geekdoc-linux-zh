  md: 'installed, by Red Hat recommends vsftpd as the most secure FTP available. In
    fact, vsftpd is an acronym for “very secure FTP”. FTP is implemented as the vsftpd
    daemon. It is installed as part of the “servers” option during initial installation.


    By default, vsftpd permits “anonymous” to login with any password. The anonymous
    user, however, can only download files from the FTP server using the “get” command.
    Anonymous user cannot upload files.


    The configuration file is /etc/vsftpd/vsftpd.conf. Unless you configure it otherwise,
    the FTP root is /var/ftp.


    You can change the FTP root for anonymous logins by adding a line to the vsftpd.conf
    file that specifies anon_root:


    ```

    anon_root=/var/ftp/anon added to the vsftpd.conf file would change the root for
    anonymous logins to /var/ftp/anon

    ```


    As mentioned previously, the anonymous user, by default, has only read access
    to the FTP server. You can uncomment line 27 in /etc/vsftpd/vsftpd.conf to allow
    write access. It will also be necessary to modify permissions on the FTP root
    directory to permit anonymous write access.


    Note: Anonymous write access should only be allowed on a trusted, protected network.


    Logging is done in /var/log.'
