  md: "# Linux Mail Servers\n\nPostfix and sendmail are e-mail servers included with\
    \ most Linux distributions. Both are mail-transfer-agents, and MTAs, which are\
    \ responsible for forwarding or relaying mail to the destination.\n\n# Mail Components\n\
    \nMUA (Mail User Agent)\n\nMS Outlook and Netscape Messenger are examples of an\
    \ MUA\n\nMTA (Mail Transfer Agent)\n\nPostfix, sendmail and MS Exchange are examples\
    \ of an MTA\n\nMDA (Mail Delivery Agent)\n\nProcmail is an MDA. The MDA delivers\
    \ mail to the user's mail box\n\n# Message spools\n\nIncoming messages are in\
    \ /var/sp/mail.\n\nOutgoing messages are in /var/sp/mqueue.\n\n# Student Exercise\
    \ 12.1: Installing and Configuring a Mail Server Using Postfix and Dovecot\n\n\
    In this exercise, you will configure a basic SMTP and POP3 email server using\
    \ Postfix as the Mail Transfer agent (MTA) and Dovecot as the POP3 server.\n\n\
    Note: Mail servers are complex systems. On public networks, they are under constant\
    \ attack by spammers looking to exploit any vulnerability. Management of mail\
    \ servers connected to the public Internet is beyond the scope of this document.\
    \ Under no circumstances does the author recommend connecting a basic mail server,\
    \ such as the one configured in this exercise, to the public Internet.\n\nThis\
    \ configuration is acceptable for a closed, trusted system, but should not be\
