  md: '# The Samba Web Administration Tool (SWAT)


    SWAT provides a browser-based SAMBA configuration tool. The advantage of using
    SWAT over the Samba Server Configuration Tool is that it offers many more configuration
    options and is accessible through any browser, regardless of the operating system.


    You can install SWAT either from the lernet using yum or from the CentOS installation
    DVD. To install SWAT using yum, use the following command as root:


    ```

    #yum install samba-swat*

    ```


    Confirm the installation when prompted.


    To install SWAT from the installation media, mount the installation DVD and navigate
    to /CentOS/RPMS, then run this command:


    ```

    #rpm -ivh samba-swat*

    ```


    After SWAT is installed, it has to be turned on with this command:


    ```

    #chkconfig swat on

    ```


    The xinetd start-up script must also be restarted with this command:


    ```

    #service xinetd restart

    ```


    Connect to SWAT by typing this URL in your local browser:


    ```

    http://localhost:901 or http://127.0.0.1:901

    ```


    By default, SWAT will not allow connections from any computer other than the one
    on which it is installed. You can, however, allow remote connections by modifying
    the SWAT configuration file (/etc/xinetd.d/swat). Modify the line “only_from=127.0.0.1”
    to read as follows:


    > only_from=192.168.0.0 127.0.0.1


    The above line will allow any host on the 192.168.0.0 network, plus the localhost
    (127.0.0.1) to access SWAT through a Web browser.'
