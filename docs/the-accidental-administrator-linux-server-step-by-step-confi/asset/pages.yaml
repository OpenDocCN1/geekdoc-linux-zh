  md: '# Monitoring and Controlling the System


    Processes Reporting with ps

    Use the "ps" command to check the status of processes on your system


    +   * Which processes are running

    * Whether a process has completed

    * Whether a process is hung or having some difficulty

    * How long a process has run

    * The resources a process is using

    * The PID (process ID number) needed before you can kill a process


    # How to use the "ps" command:


    ```

    #ps -aux

    ```


    +   * "a" – show all processes

    * "u" – show the users running the process

    * "x" – show process without a controlling terminal


    # Using the Kill Command


    The kill command will allow you to terminate a process


    +   * #kill pid :(SIGTerm)#15

    * #kill -9 pid :(SIGKill)

    * #kill -HUP pid :(SIGHup)#1

    * #kill cat /var/file.pid


    # Performance Monitoring and Troubleshooting


    # Monitoring the System


    # Using top


    The "top" utility monitors processor activity in real time, showing a listing
    of the most CPU-intensive tasks on a system. "ps" does the same thing in a snapshot.


    # Using free


    "free" displays memory usage.'
