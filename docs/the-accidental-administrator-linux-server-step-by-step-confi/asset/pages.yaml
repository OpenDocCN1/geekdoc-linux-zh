  md: "# Automating Administration Tasks with cron\n\ncron is a UNIX tool that allows\
    \ scheduling of automated tasks. Cron commands are stored in a file named for\
    \ the user who created them in /var/spool/cron/.\n\nThe crontab command is used\
    \ to create new cron files:\n\n+   - crontab -l lists the contents of your personal\
    \ cron file\n- crontab -r removes all crontab entries\n- crontab -e opens your\
    \ default text editor for cron job creation\n- Wildcards can be used. For example,\
    \ replacing the month parameter with \"*\" would activate the cron entry on the\
    \ day/date/time specified in every month.\n\nA sample cron entry:\n\n10 8 * *\
