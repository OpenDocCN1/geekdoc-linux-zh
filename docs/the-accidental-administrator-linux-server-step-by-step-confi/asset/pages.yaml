    If SSH is not running, you can start it with this command:

    #/etc/init.d/sshd start


    To turn SSH on at startup for run levels 2, 3, 4, and 5, type the following command:

    #chkconfig sshd on


    # Student Exercise 16.2: Using SSH (secure shell)


    Telnet is the traditional method of establishing a remote connection to another
    system. Telnet, however, is inherently insecure due to its lack of encryption
    on any aspect of the session. SSH offers both encrypted authentication and an
    encrypted session and is the preferred method for establishing remote connections.

    To connect using ssh:


    +   1. #ssh [hostname or ip address]<enter> (Enter “yes” when prompted to accept
    authenticity)

    2. To disconnect, type “exit” <enter>

    3. Logon as a different user with this command:

    #ssh [username] @ [hostname]

    (where “username” is a user account on the remote computer and “hostname” is the
    name or IP address of the remote computer)

    4. See who is connected to your system with the “who” command:

    #who


    For more information on using SSH, see the SSH man page.


    Using SCP (secure copy)

    To transfer a file from one computer to another, use the following command syntax:

    #scp [remote computer name]:[/path & filename] [/local directory]


    For example, the following command:

    #scp comp01.soundtraining.class:/common/file1 /public

    copies the file “file1.txt” from the directory “common” on a computer named “comp01”
    to a directory called “public” on the local computer. Passwords are required in
    order to complete the transfer. SCP can be used in either direction from either
    computer. In fact, copies are permitted between two remote hosts.'
