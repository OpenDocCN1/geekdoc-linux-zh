  md: '# Limiting Users’ Disk Usage


    Disk quotas are used to prevent users from monopolizing hard disk space. Quotas
    can be set to limit disk usage by users, groups, or both. Quotas can be set to
    evaluate usage by disk space or number of files.


    Display disk statistics with these commands:


    ```

    #df shows the amount of disk space available

    ```


    ```

    #du summarizes disk usage of each file

    ```


    # Using disk quotas


    To use disk quotas, perform the following steps:


    +   1.Verify the disk quota RPM

    2.Modify /etc/fstab to enable quotas on a per file system basis.

    3.Remount the modified file systems.

    4.Prepare the quota files, then generate the disk usage table.

    5.Assign the desired quotas.


    Verify that the disk quota RPM is installed


    Run the following command:


    ```

    #rpm -qa | grep quota

    ```


    # Enable the quotas


    As the super (root), add the options "usquota" and/or "grpquota" to the desired
    file systems in the /etc/fstab file. For example:


    “Label=/home/home ext3 defaults,usquota,grpquota 1 2” enables user and group quotas
    on the /home file system.


    # Remount the modified file systems


    If the file system is not in use, use the “umount” and “mount” commands to remount
    modified file systems, otherwise it is simplest to reboot the system.


    # Preparing the quota files


    Use the “quotacheck” command to examine quota-enabled file systems. “quotacheck”
    will build a table showing present disk usage per file system. This table is used
    to update the information the operating system has about disk usage. Additionally,
    it updates the file systems’ disk quota files.


    Prepare the quota files with this command:'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# #quotacheck -cug /home


    The “c” switch creates a quota file for each quota-enabled file system, the “u”
    switch checks for user quotas, and the “g” switch checks for group quotas. The
    option /home puts the quota files (aquota.user and aquotroup) in the /home directory.)


    Following the creation of the quota files, the following command is used to generate
    a table of present disk usage on a per file system basis:


    ```

    #quotacheck -vug /home

    ```


    (The options are the same as before except for “v” which simply displays verbose
    output during the quota check.)


    # Assigning the desired quotas


    The “edquota” (edit quota) command is used to assign quotas to users and/or groups:


    ```

    #edquota [username]

    ```


    To assign quotas to a group, use this similar command:


    ```

    #edquota -g [groupname]

    ```


    Either command opens the default text editor where you can set quotas for the
    user or group. You can change the soft and hard values for each user or group
    subject to quotas. The soft value allows the user to exceed it for a certain number
    of days, defined by the grace period. The hard limit does not allow a user to
    exceed it; it is an absolute value. A block is equal to 1K, an “inode” is equal
    to one file.


    Set the grace period with the command:


    ```

    #edquota -t

    ```


    # Getting a Quota Report


    ```

    #repquota [mount point] displays a quota report for users.

    ```


    ```

    #repquota -g [mount point] displays a quota report for groups

    ```


    | Student Exercise 11.1: Enabling Disk Quotas

    In this exercise, you will configure disk quotas and apply them to /home.


    1. Confirm that disk quotas are installed with the following command:

    #rpm -qa | grep quota

    2. You should see a response similar to this: |


    129'
