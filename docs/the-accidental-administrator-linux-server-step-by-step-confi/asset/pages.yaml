  md: '# Virtual Network Computing—Sharing Remote Desktops


    Remote Administration With VNC


    VNC is a tool developed by ATT''s Cambridge Labs to allow the sharing of a desktop.
    It allows connections between disparate platforms. For example, a computer running
    UNIX or Linux can display a Microsoft Windows desktop and vice-versa. There are
    two parts to VNC: vncviewer and vncserver. vncviewer is used to connect to a system
    running vncserver. The server component is installed as part of the server options
    during the installation process. The server component can be installed either
    from the Internet by using yum or from the CentOS/Red Hat installation DVD.


    # Setting Up VNC


    Install the VNC package


    VNC is in the yum repositories, on the CentOS installation DVD, or it can be downloaded
    for free from www.realvnc.com or www.tightvnc.com.


    To run VNC, use the following commands:


    +   * vncserver <enter>

    * Enter a password and verify

    * #vncpasswd can be used later to change the password

    * A terminal will be displayed like: lisrv.domain.test:1


    # Connecting to a VNC Server


    +   * vncviewer <enter>

    * ipaddress:terminal#

    For example: 10.0.0.20:1

    * Enter the password for the remote server <enter>


    > Student Exercise 14.1: Running VNC (Virtual Network Computing)

