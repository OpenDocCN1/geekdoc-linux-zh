  md: "# Using Dynamic Host Configuration Protocol (DHCP)\n\n# Configuring DHCP\n\n\
    DHCP is not installed by default when you choose network servers in the initial\
    \ installation. If it is necessary to install it, later you can either yum on\
    \ the Internet or rpm locally.\n\nOnce installed, DHCP uses the /etc/dhcpd.conf\
    \ file to retrieve its configuration information.\n\nAs of this writing, DHCP\
    \ uses two DNS update schemes: the ad-hoc DNS update mode and the interim DHCP-DNS\
    \ interaction draft update mode. The recommended method is DHCP-DNS interaction\
    \ draft update mode, which is implemented by placing this line at the op of the\
    \ configuration file:\n\n```\nddns-update-style interim;\n```\n\nWithin the dhcpd.conf\
    \ file are two types of statements: parameters and declarations:\n\nParameters\
    \ state whether a task is to be performed and how tasks are to be performed, and\
    \ what network configuration options are to be sent to the client.\n\nAny parameters\
    \ declared before braces ({}) ) are global parameters and apply to all following\
    \ sections.\n\nDeclarations describe the network topology and the clients. Declarations\
    \ also provide client addresses and apply groups of parameters to groups of declarations.\n\
    \nA subnet declaration must be included for each subnet in your network. The DHCP\
    \ server will fail to start if this step is omitted.\n\nWhat follows is a sample\
    \ dhcpd.conf file:\n\n```\nddns-update-style interim;\nsubnet 192.168.0.0 netmask\
    \ 255.255.255.0 :\n  option routers 192.168.0.1;\n  option subnet-mask 255.255.255.0;\n\
    \  option domain-name \"class.local\";\n  option domain-name-servers 192.168.0.1;\n\
    \  option time-offset -1800; # Eastern Standard Time\n  range 192.168.0.50 192.168.0.99;\n\
    \nhost xp1 {\n  hardware ethernet 00:0c:29:ba:08:ae;\n  fixed-address 192.168.0.61;\n\
    ```\n\nFigure 9 Understanding /etc/dhcpd.conf"
  merge: -1
  pgno: 103
- img_proc: true
  md: 'In the example configuration:


    +   - The dynamic DNS update style is “interim”.

    - The parameters will be assigned to DHCP clients on the 192.168.0.0 subnet.

    - The default gateway is at 192.168.0.1.

    - The subnet mask is 255.255.255.0 (/24).

    - The domain name is class.local (note the use of quotation marks surrounding
    the domain name).

    - The name server is at 192.168.0.1.

    - The time offset is -18000 seconds from clients. GMT.

    - The DHCP pool of available IP addresses for assignment is 192.168.0.50 through
    192.168.0.99.

    - When host XP1 with a MAC address of 00:0c:29:ba:08ae comes online and sends
    a DHCPREQUEST packet, it will be assigned the IP address of 192.168.0.61.


    # Viewing DHCP leases


    DHCP lease information is stored in /var/lib/dhcp/dhcpd.leases. A separate file
    called /var/lib/dhcp/dhcpd.leases~ is created at regular intervals as a backup
    to dhcpd.leases.


    # Domain Name System (DNS) and BIND


    DNS resolves host names to IP addresses. Think of DNS as being similar to the
    white pages of a telephone book. The white pages map names to telephone numbers
    such as Pat Smith—(206) 555-1234. DNS maps hostnames to IP addresses such as www.redhat.com—66.187.232.56.
    In Linux, DNS runs as the “named” daemon. It is most often implemented with the
    BIND (Berkeley Internet Name Domain) software.


    BIND is usually included in the various Linux distributions, including RedHat,
    CentOS, and Fedora. The most current version can be downloaded from ISC (Internet
    Systems Consortium) at www.isc.org.


    # The Resolver


    The client requesting name resolution is called the resolver. Resolvers send queries
    to the name server which answers the queries that come from the resolver. The
    resolver can be configured from the /etc/resolv.conf file. The /etc/resolv.conf
    file contains the IP address of the nameserver for the domain.


    # DNS Configuration Files


    The main configuration file for BIND is /etc/named.conf. It defines the basic
    parameters and points to the sources of domain database information.


    The default zone directory is /var/named. A file containing the root DNS server
    information for the Internet (named.ca) is located in /var/named.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Primary, Secondary, and Caching Zones


    DNS primary zones get their zone information from the zone files in /var/named.
    DNS configuration changes are made on the server hosting the primary zone.


    DNS secondary zones get their zone information by performing a zone transfer from
    the server hosting the primary zone.


    A DNS caching zone does no lookups, but holds information from other lookups to
    speed query response times.


    # DNS Tools


    # Using host


    “host” is a simple utility for performing DNS lookups.


    Usage:


    ```

    # host -1 [domain name] lists all hosts in a domain

    ```


    # Using dig


    "dig” is the domain information groper. It is used to query DNS servers for information
    concerning hostnames and servers. You may be familiar with “nslookup”, an older
    utility that does much the same thing. “dig” uses a clearer, easier to understand
    command structure and is generally more stable than “nslookup”, so it is the recommended
    tool for querying name servers.


    # Using dig


    ```

    # dig [server to query] [name to be looked up] [type of query (if not specified,
    dig will perform a lookup for an RR)]

    ```


    # Using nslookup


    nslookup emulates a resolver in making queries. It queries only one name server
    at a time. It does zone transfers just like a name server.


    Use noninteractive when looking up just one record. Use interactive when looking
    up multiple records.


    ```

    #nslookup (when used with no parameters starts interactive mode)

    ```


    ```

    #nslookup [hostname.domain] starts non-interactive mode

    ```


    Interactive mode:


    ```

    #nslookup

    ```


    ```

    >set type=[type of record] to look up

    ```'
  merge: -1
