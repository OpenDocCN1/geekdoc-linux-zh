    #tar -tvf demofile.tar will list all files in the archive demofile.tar verbely.

    #tar -xf demofile.tar will extract all files from archive “demofile.tar”.

    ```


    Common compression tools in RedHat Linux include (.gz), bzip2 (.bz2), and zip
    (.zip).'
