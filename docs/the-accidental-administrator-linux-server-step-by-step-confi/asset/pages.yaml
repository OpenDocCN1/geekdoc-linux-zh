    # Prioritizing Repositories


    When using third-party repositories, it is possible that the third-party repo
    might update a package installed by the base repo. Although that might seem desirable
    under some circumstances, a more conservative approach might be desirable on,
    for example, mission-critical systems.


    You can enable priorities to limit which repo can upgrade packages installed by
    another repo. For more information about implanting priorities, visit http://wiki.centos.org/PackageManagement/Priorities.


    # RPM: The RedHat Package Manager


    RPM is the RedHat Package Manager. It is designed to simplify the installation,
    maintenance, and removal of software in the Linux environment. It allows ease
    of updating existing packages and verification of packages. Verification of packages
    is useful when packages may have been inadvertently deleted.


    RPM packages can only be installed by the user root.


    # RPM usage:


    +   - rpm -ivh [package name].rpm (where "i" represents "install", "v" represents

    "verbose", and "h" represents "hash") [displaying the installation progress)

    - rpm -qa grep [package name] (where "q" represents "query" and "a" represents

    "all")n- rpm -Uvh [package name] is used to upgrade packages and can be used to
    install some

    types of packages.

    - rpm -e [package name] is used to remove packages.

    - rpm -Va will verify all RPM packages.


    # Additional RPM switches


    You can get information about an RPM package with this command:

    #rpm -ql [package name]


    Find the location where the files were copied with this command:

    #rpm -ql [package name]


    Determine what rpm file came from with this command:

    #rpm -qf /path/filename'
