    \ configurations for run levels in a system running a Red Hat-based distribution:\n\
    \n+   * runlevel0\n  * Shut down the system\n  * Do not set the inittab value\
    \ to runlevel0\n* runlevel1\n  * Single-user mode\n* runlevel2\n  * Multi-user\
    \ mode, but no NFS support\n* runlevel3 (the most commonly used run level and\
    \ usually the best choice for servers)\n  * Multi-user mode without “X\"\n* runlevel4\n\
    \  * Not used\n* runlevel5 (good for end-user workstations, but not recommended\
    \ for servers)\n  * X11\n* runlevel6\n  * Reboot\n  * Do not set the inittab value\
    \ to runlevel6\n\nA Debian-based system also has seven run-levels. Run levels\
    \ two through five are identical, but can be configured in whatever way you desire.\
    \ The default configuration boots the system into run level 2 which is configured\
    \ as full multi-user mode with graphics (X windows).\n\nYou can view the current\
    \ run level with this command:\n\n```\n#runlevel\n```\n\nThe display will indicate\
    \ the current and previous run level(s), separated by a space. You can change\
    \ the current run level with this command:\n\n```\n#init [desired run level] or\
    \ #telinit [desired run level]\n```"
