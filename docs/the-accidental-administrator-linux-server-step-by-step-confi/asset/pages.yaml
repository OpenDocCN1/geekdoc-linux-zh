  md: '# Using Linux as a Router


    Routing is used to connect two logical IP networks. A router forwards packets
    between one network and another. A router appliance can be installed or a computer
    running Linux can be configured with two or more network interfaces with IP forwarding
    enabled.


    # Configuring Linux as a Router


    +   - Install a second network interface (probably an Ethernet NIC) and configure
    its IP address.

    - Enable forwarding between the two NICs by editing /etc/sysctl.conf. Find the
    line that says "net.ipv4.ip_forward = 0" and change "0" to "1".

    - Restart the network service.


    # Iptables


    Iptables is the new Linux firewall, replacing iptchains from previous versions
    of Linux. Use iptables to control traffic and from your Linux system.


    Configuring a Linux firewall


    Type the following command:


    ```

    #setup

    ```


    The text mode setup utility will appear. Use the arrow keys to select Firewall
    configuration. Use the tab key to select Run Tool. In the Firewall Configuration
    window, you can enable or disable the firewall. You can also use the tab key to
    select Customize, which allows you to specify trusted devices and allowed types
    of traffic by port number.


    # Masquerading IP Addresses


    Use this command when a service such as DHCP is used to dynamically assign IP
    addresses to hosts in the network:


    ```

    #iptables -t nat -A POSTROUTING -o eth1 -d ! 10.1.0.0/16 -j MASQUERADE

    ```


    Use this command when IP addresses are statically assigned:


    ```

    #iptables -t nat -A POSTROUTING -o eth1 -d 10.1.0.0/16 -j SNAT

    ```


    To set up a DMZ, poke a hole in your firewall with this command (on a single line):


    ```

    #iptables -t nat -A PREROUTING -i eth0 -d 10.16.0.1 -p tcp --dport 80 -j DNAT
    --to 192.168.1.2 (where 10.16.0.1 is the publicly accessible address and 192.168.1.2
    is the address of the internal web server).

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Student Exercise 16.4: Configuring NAT


    Network Address Translation (NAT) is used to isolate a private network (say, 192.168.0.0/24)
    from the public Internet. Inexpensive cable modem and DSL routers use NAT to create
    a simple, yet effective firewall. Hosts on the private network share a single
    IP address on the public network. Port numbers are assigned to each connection
    to ensure that each connection has a unique identifier. This lab will show you
    how to configure NAT on a gateway device. Modern Linux systems use iptables to
    access the netfilter infrastructure of the kernel to implement firewall.


    +   1. Switch user to root:

    su -


    +   2. Use the following command to enable routing:

    echo "1" > /proc/sys/net/ipv4/ip_forward


    +   3. Use this command to enable IP masquerading (where your internal (private)
    hosts all share the same public IP address:

    iptables -t nat -A POSTROUTING -o 12.1.2.3 -j MASQUERADE

    where 12.1.2.3 is the actual public Internet address of your router


    +   4. View the filter with this command:

    iptables -t nat -n -L -v


    +   5. To flush a filter, use the following command:

    iptables -t nat -F POSTROUTING

    (This command specifies the NAT table and tells iptables to flush the POSTROUTING
    chain, removing the previously configured rule.)


    +   6. Reset the system to disable IP forwarding with this command:

    echo "0" > /proc/sys/net/ipv4/ip_forward


    There is more information about iptables at www.netfilter.org. You can download
    customizable scripts at these locations:


    www.e-infomax.com/ipmasq


    www.malibity.net/iptables/scripts/fwscripts.html


    # Port Scanning


    Caution: Do not conduct port scanning without written permission from your supervisor.
    Unauthorized port scanning can be considered an intrusion attempt and can result
    in disciplinary or punitive action.'
