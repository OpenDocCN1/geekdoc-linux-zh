  md: '# Soundthinking Point: Working in Terminal (No X)


    When working in full multi-user mode, but with no X Windows, you can scroll up
    and down the screen output by using the key combination of Shift-PageUp or Shift-PageDown.


    # X Windows


    X Windows is the underlying technology used in the Linux/UNIX world to support
    graphics. There are several versions of X, but the one most commonly used with
    Linux is XFree86.


    Think of X as the foundation for the Graphical User Interface (GUI). On top of
    the foundation (X) is the user environment. As with X, there are several different
    user environments available, but the most common are KDE and GNOME. The user environments
    provide such things as icons, buttons, desktop backgrounds, and user applications.


    # Starting GUI


    When in a command-line terminal, use the command "startx" to start X windows.


    To kill X, use the key combination of ctrl+alt+backspace.


    # Configuring "X"


    In Red Hat, you can run the XFree86 configuration tool by issuing the command:


    ```

    #system-config-display

    ```


    # Getting help


    Linux includes ample, built-in help including "man" pages, "info", "help", and
    "apropos".


    man


    man formats and displays the online manual pages. There are manual pages for nearly
    every command imaginable. Unfortunately, many of the man pages assume a fairly
    extensive background in UNIX, therefore they often require research beyond the
    initial man page.


    The pages are divided into sections. Many entries appear only in one section,
    but some appear in multiple sections when a command and a library function have
    the same name. The sections that are most likely to be of interest to system and
    network administrators are sections 1, 5, and 8.


    +   - Section 1: user commands (introduction)

    - Section 2: system calls (introduction)

    - Section 3: library functions (introduction)

    - Section 4: special files (introduction)

    - Section 5: file formats (introduction)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '+   - Section 6: games (introduction)

    - Section 7: conventions and miscellany (introduction)

    - Section 8: administration and privileged commands (introduction)

    - Section L: math library functions

    - Section N: tcl functions (Tool command language, a dynamic programming language)


    You can view a man page as follows:

    #man chown


    You can specify a particular section as follows:

    #man 1 chmod


    The above command would display only section 1 (the manual for the chmod command.
    chmod is also a system call, so if you wanted to see the man page for the system
    call "chmod", you would need to enter the following command:

    #man 2 chmod


    info

    info is an on-line manual reader used by the GNU Project to document utilities.
    It is similar to man (and often produces identical documents), but offers a standardized
    set of commands for viewing the documentation. The info utility does not assume
    as great depth of UNIX knowledge as man.


    Basic usage is the same as man:

    #info chown

    The above command will display the info page for the chmod command.


    Info divides its help into nodes instead of sections. A node, like a section in
    man, describes a specific topic at a specific level of detail. In a moment, you
    will work through the first few steps of a tutorial using info.


    help

    The --help option is included with most GNU utilities. It displays command options
    and other information about the utility:

    #ls --help


    The above command shows options and other information about the ls command.


    apropos

    apropos looks in the description sections of man pages for text strings. When
    executed, apropos will return every man page with whose description contains the
    specified text string:

    #apropos edit'
