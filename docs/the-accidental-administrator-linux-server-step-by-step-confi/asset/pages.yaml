    # The Linux Boot Process


    # A Common Linux Boot Process


    +   - The system is checked by the system BIOS which launches the first boot loader
    on the primary hard disk''s MBR


    +   - The first stage boot loader is loaded into memory by itself and it then
    launches the second stage boot loader from the /boot partition


    +   - The kernel is loaded into memory by the second stage boot loader. Necessary
    modules are loaded by the second stage boot loader which also mounts the root
    partition read-only


    +   - Control of the boot process is transferred by the kernel to the /bin/init
    program. “init” runs with a process ID of 1 and spawns all processes.


    +   - “init” reads /etc/initab to find the location of the “sysinit” script.


    +   - Services and user-space tools are loaded by the /bin/init program which
    also mounts all partitions listed in /etc/fstab


    +   - The login prompt appears'
