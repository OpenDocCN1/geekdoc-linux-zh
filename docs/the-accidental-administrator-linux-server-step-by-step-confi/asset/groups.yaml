    \ should count as life. I think it says something about human nature the only\
    \ form of life we have created so far is purely destructive. We’ve created life\
    \ in our own image.” --Stephen Hawking\n\n## Apache Web Server\n\nThe Apache Web\
    \ Server is arguably the most popular of all the web server software. By some\
    \ estimates it has a market share of more than 60%. It works on a large number\
    \ of platforms, including UNIX, Linux, and Windows. The Apache Web Server is generally\
    \ regarded as being extremely flexible, secure, and stable.\n\nThere is an online\
    \ manual at `/var/www/www/manual/index.html`.\n\n## Understanding Apache\n\nThree\
    \ primary parts of Apache\n\n- Httpd daemons\n  - Respond to incoming requests\
    \ to the server's network interfaces\n  - The requests are processed according\
    \ to parameters specified in the configuration files\n\nThe Apache configuration\
    \ files\n\n- httpd.conf\n  - The primary configuration file\n  - Magic\n  - Helps\
    \ Apache identify different media types\n\nWeb site's content\n\n- In Red Hat\
    \ Linux, located in `/var/www/html` (the Apache configuration file identifies\
    \ the location of the document pages for each distro\n\n## The Apache Configuration\
    \ Directives\n\nThe Apache configuration parameters are contained within directives\
    \ in the httpd.conf file. The httpd.conf file is divided into containers (also\
    \ called “blocks”) which provide the structure used by Apache to combine one or\
    \ more directives into a single entity. Each container includes a beginning and\
    \ an end tag to bind the directives together. Within each container, a directive\
    \ is used to assign a variable or option.\n\n## The Three Parts of httpd.conf\n\
    \nThe httpd.conf file can be broken into three parts: Global Environment, Main\
    \ Server, and Virtual Hosts. Global Environment defines the behavior of the httpd\
    \ daemons. The directives in the Global Environment section deal with the overall\
    \ operation of your Web server. Main Server sets the server's default behavior,\
    \ and Virtual Hosts defines the parameters for the virtual Web servers.\n\n##\
    \ Developing a Virtual Site\n\nUsing Virtual Hosts makes a single Apache Web server\
    \ appear as many. There are several uses for virtual sites including the conservation\
    \ of IP addresses, greater utilization of server hardware, and allowing employees\
    \ and customers to have their own web sites. There are two types of virtual hosts:\n\
    \n### IP-based Virtual Hosts\n\n- Requires an IP address for each site (in other\
    \ words, each hostname on the server is given its own IP address)\n- Generally,\
    \ the only time IP-based virtual-hosting is desirable is when an SSL certificate\
    \ is used to provide security, since such certificates are associated with an\
    \ IP address\n\n### Name-based Virtual Hosts\n\n- Associates a name with each\
    \ site and does not require an individual IP address\n- Allows multiple hostnames\
    \ (websites) to share a single IP address\n- It is generally considered a best\
    \ practice unless an SSL certificate is in use\n\n## Enabling Name-Based Virtual\
    \ Hosting\n\nTo enable named based virtual hosting uncomment the directive: \n\
    `<NameVirtualHost [your computer's IP address]>`\n\nReplicate this address in\
    \ all virtual host blocks.\n\n## Checking the httpd.conf file\n\nUse the command\
    \ `httpd -t` to check the file for syntax errors\nThe web root is /var/www/html.\n\
    \n| Student Exercise 13.1: Creating a Simple Web Server |\n| :--- |\n| In this\
    \ exercise, you will modify the Apache configuration file to create a basic Web\
    \ server hosting a single site. |\n| 1. Log on to your system and su to root:\
    \ <br> $ su - <br> Password:p@ss5678 |\n| 2. Install the Apache web server: <br>\
    \ #yum -y install httpd* |\n| 3. Create a backup of the httpd configuration file:\
    \ |\n\n```bash\n#cd /etc/httpd/conf\n#cp httpd.conf httpd.conf.bak\n#vi httpd.conf\n\
    ```\n\n- 4. Use the key combination of 251+G(the number 251 plus upper-case “G”)\
