    # Using grep


    “grep” is a filtering utility used in the ''unix world to aid in searches. “grep”
    is one of the most useful tools in Information Systems and Technology.


    Some examples:


    +   - #grep red blue will display lines of text from the blue file that contain
    the word “red"

    - #rpm -qa | grep smb will display all installed RPMs with “smb” in their name


    Here is a handy way to use grep. Suppose you need to find a file (or files) containing
    a particular text string. Use the grep with -r and -H options to find all files
    containing that particular string (remember that everything in Linux is case sensitive).
    By default, grep only prints the text string. If you’re looking for files containing
    the text string, you must tell grep to the filename, too. The -H command does
    that.


    In the following statement, -H prints the filename and -r searches recursively
    from the starting point (lists/) for the text string PHPMAILERHOST:


    ```

    $ grep -Hr PHPMAILERHOST lists/

    ```


    This is the output from the previous command:


    ```

    lists/config/config.php: define("PHPMAILERHOST",'''');

    ```


    You can include the option “n” in your search to display the line number in the
    file where the string appears.'
