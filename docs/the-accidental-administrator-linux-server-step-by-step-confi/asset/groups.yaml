    /etc/resolv.conf


    Although it perhaps more closely related to DNS, the file /etc/resolv.conf also
    warrants examination. /etc/resolv.conf contains several different configuration
    directives including nameserver, domain, and search. There are others, but we
    will focus on these three.


    The nameserver directive is the IP address in dotted decimal notation of the name
    server(s) that should be queried. You can specify up to three names.


    The domain directive is the local domain. If none is specified, this value is
    determined from the local host name, using everything after the first “.”. There
    is no domain part in the local host name, the root domain is assumed.


    ```

    ; generated by /sbin/dhclient-script

    search soundtraining.local

    nameserver 192.168.16.2

    /etc/resolv.conf (END)

    ```


    The search directive specifies the search list for host name lookup. The search
    list is normally determined from the local domain name. By default, it contains
    only the local domain name. According to the man page for resolv.conf,

    “you can change the default behavior by listing the desired search path following
    the search keyword, with spaces or tabs separating the names. Most resolver queries
    will be attempted using each component of the search path until a match is found.
    This process may be slow and will generate a lot of network traffic if servers
    for the listed search are not local. Queries will time out if no server is available
    for all of the domains. The search list is currently limited to six domains and
    a total of 256 characters.” Note in the screen capture how the resolv.conf file
    was configured automatically by /sbin/dhclient-script with values provided by
    the DHCP server in the author’s office network.'
