    ## Controlling the boot process


    Change the run level by modifying /etc/inittab.


    It is possible to finely control the boot process by modifying scripts within
    "rc" directories.


    - In Red Hat Linux, they are in the /etc/rc.d directory

    - In SuSE Linux, they are in /etc/init.d/rc

    - In Debian Linux, they are in /etc


    There is an "rc" directory that corresponds to each run level. For example, rc3
    corresponds to run level 3. You''ll look for the corresponding directory to the
    run level you wish to modify. Within that directory, you''ll find scripts for
    each of the services on the system. Each script name includes an "S" or a "K".
    Scripts with "S" start indicated daemons within the directory''s run level. Scripts
    which start with "K" kill daemons within the run level. (Scripts in an rc directory
    are executed in alphabetical, then numerical order)


