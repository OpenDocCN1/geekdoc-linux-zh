    \ Asia Pacific regions\n\n## Ubuntu (www.ubuntu.com)\n\n- The newest of the major\
    \ distros\n- Based on Debian\n- Designed for ease of use\n- Popular as a desktop\
    \ OS\n\nFor more information on various distributions, visit www.distrowwatch.com.\n\
    \n## The Linux Kernel\n\n### Linux kernel numbering\n\nThe Linux kernel numbering\
    \ scheme has no relation to distribution numbering. For example, SuSE Linux 11\
    \ and Red Hat Enterprise Linux 5.4 might both use the 2.6 kernel. An older version\
    \ of Linux such as SuSE Linux 6.1 use the 2.2 kernel.\n\nNumbering follows this\
    \ scheme: x.y.z where \"x\" is the major version number, \"y\" is the minor version\
    \ number, and \"z\" is the kernel patch number. Official (stable) releases are\
    \ given even minor version numbers (2.2, 2.4, 2.6) while beta/developer releases\
    \ are given odd numbers (2.3, 2.5, 2.7). It's often recommended to wait before\
    \ upgrading production systems to a new kernel until several kernel patches have\
    \ been released, even if the kernel has an even numbered minor release version.\n\
    \nAs of 2010, the kernel available from www.kernel.org is 2.6.35.5.\n\nYou can\
    \ display your operating system's kernel version with the command \"uname -r\"\
    .\nThe uname command displays various system information. For example, \"uname-a\"\
    \ provides a summary of system information:\n\n```\n$root@instructor:~# uname\
    \ -a\nLinux instructor.soundtraining.class 2.6.18-164.els #1 SMP SMP Thu Sep 3\
    \ 03:33:56 UTC 2009 ED\n+ 2089-03-1038 i686 GNU/Linux\n$root@instructor:~# \n\
    ```\n\nFigure 2: The use of \"uname -a\"\n\n## Chapter Two: Linux Administration\n\
    \n> \"If you want to travel around the world and be invited to speak at a lot\
    \ of different places, just write a Unix operating system.\" --Linus Torvalds\n\
    \n## GUI vs. CLI\n\nSince the first graphical user interface (GUI) was created\
    \ in the Xerox Palo Alto Research Center in the early 1970s, those of us who work\
    \ in information systems and technology have debated its merits and liabilities.\n\
    \nThe real issue is not whether to use a GUI or a command-line interface (CLI);\
    \ it is about choosing a tool that works for you and helps you work most effectively.\
    \ For most of us, that means that sometimes we'll use a GUI and sometimes we'll\
    \ use a CLI.\n\nOnce had a student in a Linux workshop whose said nickname was\
    \ “No GUI Louie”. While I remember Louie as a very knowledgeable and capable IT\
    \ pro, I also had students who avoid the CLI because of its complexity without\
    \ considering the power it affords an administrator. I think we limit ourselves\
    \ when we arbitrarily limit the tools at disposal by eliminating GUI or CLI tools.\
    \ In my own work, I find that I use both the CLI and GUI, depending on the task\
    \ at hand and my personal familiarity with the tools in question. (Okay, I use\
    \ the command-line most often, but I'm very grateful for the GUI when performing\
    \ unfamiliar tasks!)\n\n| GUI Pros | Farther away from the “road” |\n| :--- |\
    \ :--- |\n| Fewer typing errors | Less control |\n| Less minutia | Java and other\
    \ issues might make GUI unavailable |\n| Safer (harder to make mistakes) | Some\
    \ of the names and labels it creates are strange |\n| Can help teach you CLI commands\
    \ | Some people are more familiar with the CLI |\n\n## Linux Directories\n\nEverything\
    \ in Linux/UNIX is on the file system. The file system is comprised of various\
    \ directories (Windows call them “folders”). The root directory (\"/) is at the\
    \ base of the file system. Some directories may be on different partitions or\
    \ drives, but they are still a part of the file system. Some directories may even\
    \ be on completely different computers, perhaps running a completely different\
    \ operating system, but they are still part of the file system. What follows is\
    \ a list of some of the more commonly found directories in the Linux file system\
    \ (all directories are not included on all systems):\n\n- * is the root directory\n\
    - /bin/ and /usr/bin/ store user commands.\n- /boot/ contains files used for system\
    \ startup including the kernel.\n- /dev/ contains device files\n- /etc/ is where\
    \ configuration files and directories are located.\n- /home/ is the default location\
    \ for users' home directories.\n- /initrd/ is used to load required device modules\
    \ and mount the initrd.img image file during system setup.\n- /lib/ and /usr/lib/\
    \ hold library files used by programs in /bin/ and /sbin/.\n- /lost+found/ holds\
    \ orphaned files (files without names) found by fsck\n- /mnt/ holds the mount\
    \ points for file systems that were mounted after boot.\n- /opt/ is used primarily\
    \ for installation and uninstallation of third-party software. Holds optional\
    \ files and programs.\n- /proc/ is a virtual directory (not actually stored on\
    \ the disk) which holds system information required by certain programs.\n- /root/\
    \ is the home directory of the superuser “root\"\n- /sbin/ and /usr/sbin/ store\
    \ system commands.\n- /tmp/ is the temporary directory. All users have read+write\
    \ access to /tmp/.\n- /usr/ contains files related to users such as application\
    \ files and related library files (“usr” is an acronym for UNIX system resources).\n\
    - /var/ (as in “variable”) holds files and directories that are constantly changing\
    \ as printer pools and log files.\n\nThe above is a brief overview of Linux/UNIX\
    \ directory structures, search on “Filesystem Hierarchy Standard” at www.wikipedia.com.\n\
    \n## Soundthinking point: Customizing the Desktop Background\n\nCustomize the\
    \ Gnome or KDE background by right-clicking on the background and choosing Change\
    \ Desktop Background.\n\n## Starting and Stopping Services\n\nIn Linux, the various\
    \ services that make up the entire system are called daemons (pronounced DEE-mons).\
    \ There are daemons for the DNS name (named), the Web server (httpd), DHCP (dhcp),\
    \ and so on. When you see some names ending with the letter \"d\", you’re most\
    \ likely looking at a daemon. Most daemons can be controlled through scripts at\
    \ /etc/init.d/. For example, to start the Web server from a terminal window, you\
    \ would execute the command /init.d/ start. To stop it, you would execute the\
    \ command /init.d/ stop\n\nDifferent distros might place the scripts in slightly\
    \ different locations. Later in the book, you'll learn how to use the find command\
    \ to locate such scripts as well as other files and directories.\n\n## The Red\
    \ Hat System-Config and System-Control Utilities\n\nRed Hat-based systems include\
    \ the system-config and system-control utility, a text and graphics-based utility\
    \ to help you configure various aspects of your system. You can see the available\
    \ utilities by opening a terminal window and, as root, typing the following:\n\
    \n```\n$dom@centos-inst]$ \nPassword:\nroot@centos-inst]# system-\nsystem-install-helper\n\
    system-config-authentication\nsystem-config-date\nsystem-config-display\nsystem-config-httpd\n\
    system-config-kmp\nsystem-config-keyboard\nsystem-config-message\nsystem-config-lvm\n\
    system-config-network\nsystem-config-network-cmd\nsystem-config-network-gui\n\
    system-config-network-tui\nroot@centos-inst ~]$\nsystem-config-nfs\nsystem-config-packages\n\
    system-config-printer\nsystem-config-password\nsystem-config-samba\nsystem-config-securitylevel\n\
    system-config-services\nsystem-config-soundcard\nsystem-config-users\nsystem-control-network\n\
    system-install-packages\n```\n\nFigure 3: The Red Hat system utility\n\nDo not\
    \ enter, but touch the key twice and you'll be seeing a list of options.\n\nThe\
    \ Shell\n\nThe shell is a keyboard interpreter, taking the keyboard input from\
    \ the user and delivering it to the operating system. You can think of the shell\
    \ as being part of the operating system that allows you to interact with the kernel.\
    \ The shell is the program that executes Linux or UNIX commands.\n\nThere are\
    \ several shells available for use in Linux and UNIX. The most commonly used in\
    \ Linux is the bash shell (Bourne Again Shell). Other shells include sh (Bourne\
    \ Shell), csh (CShell), tch, csh, and ksh (Korn Shell).\n\nYou can change the\
    \ shell by typing the name at a command prompt.\n\nThe shell is not only a command\
    \ interpreter, but also a scripting language. Experienced Linux administrators\
    \ often write scripts to automate frequently conducted tasks.\n\nLinux, like all\
    \ multi-user operating systems, has an administrator account which is used for\
    \ system\n"
