    ## Disk Configuration Tools


    fdisk /dev/hda starts the disk configuration utility "fdisk" ("hda" represents
    the first IDE drive, "sda" would represent the first SCSI drive on the system.


    Using fdisk returns a different prompt than the customary Linux command prompt:


    - Command (m for help):d displays disk partitions.

    - Command (m for help):s schedules partitions for deletion (if you make a mistake
    and don''t want to delete a partition, you can simply type q to quit without saving)

    - Command (m for help):l lists known partition types

    - Command (m for help):m lists available commands


    ### Related commands


    - fdisk -l displays information about partitions on a hard drive

    - fdisk -t sets the file system for a partition

    - mkfs will format a partition

    - fsck will repair a corrupted file system

    - fsck /mbr will repair a corrupted Master Boot Record


    > soundthinking point: partition management tool


    The open source tool gparted is a great tool for managing disks and partitions.


    ## Chapter Five: Networking with Linux


    > “If computers get too powerful, we can organize them into a committee - that
    will do them in” --Bradley’s Bromide


    ## Network Administration


    ### Network Configuration Files


    The /etc/sysconfig/network file contains non-interface specific parameters such
    as enabling networking, the persistent hostname, and the default gateway.


    ### Network Card Configuration


    Check the /etc/sysconfig/network-scripts/ifcfg-eth[x] file (where “x” is the number
    of the interface to be configured.


    A sample interface configuration file might look like this:


    ```

    DEVICE=eth0

    BOOTPROTO=static

    ONBOOT=yes

    USERCTL=no

    PEERDNS=no

    TYPE=Ethernet

    IPADDR=10.16.0.100

    NETMASK=255.240.0.0

    GATEWAY=10.16.0.1

    NETWORK=10.16.0.0

    BROADCAST=10.31.255.255

    ```


    This file can be modified to meet your needs. Changes take effect upon a restart
    (service network restart).


    ## RHEL/Fedora/CentOS Network Configuration Applet


    As an alternative to the text configuration file, RHEL/Fedora/CentOS provides
    a GUI tool that can be used to configure the network card. From within the GUI,
    click Desktop>>System Settings>>Network to open the Network Configuration Tool.
    From the CLI, type “system-config-network” to open it. If X is running, the GUI
    version of the tool will open. If X is not running, the text-based tool will open
    it.


    ## Using ifconfig


    - ifconfig, typed by itself, will show you the network card is working and display
    a variety of information about its configuration including its IP address.

    - ifconfig eth0 10.20.30.1 netmask 255.240.0.0 will assign the IP address 10.20.30.1
    to the first NIC (Addresses assigned in this manner are not persistent. In other
    words, the address will revert back to the original address upon restart.)

    - ifconfig eth0:0 10.20.30.1 netmask 255.0.0.0 will assign a second IP address
    of 10.20.30.1 to the first NIC. This process is known as IP aliasing.

    - ifconfig eth1 10.20.30.1 netmask 255.0.0.0 will assign the IP address 10.20.30.1
    to a second NIC.

    - ifdown eth[x] disables the network card specified

    - ifup eth[x] enables the network card specified


    ### /etc/resolv.conf


    Although it perhaps more closely related to DNS, the file /etc/resolv.conf also
    warrants examination. /etc/resolv.conf contains several different configuration
    directives including nameserver, domain, and search. There are others, but we
    will focus on these three.


    The nameserver directive is the IP address in dotted decimal notation of the name
    server(s) that should be queried. You can specify up to three names.


    The domain directive is the local domain. If none is specified, this value is
    determined from the local host name, using everything after the first “.”. There
    is no domain part in the local host name, the root domain is assumed.


    ```

    ; generated by /sbin/dhclient-script

    search soundtraining.local

    nameserver 192.168.16.2

    /etc/resolv.conf (END)

    ```


    The search directive specifies the search list for host name lookup. The search
    list is normally determined from the local domain name. By default, it contains
    only the local domain name. According to the man page for resolv.conf,

    “you can change the default behavior by listing the desired search path following
    the search keyword, with spaces or tabs separating the names. Most resolver queries
    will be attempted using each component of the search path until a match is found.
    This process may be slow and will generate a lot of network traffic if servers
    for the listed search are not local. Queries will time out if no server is available
    for all of the domains. The search list is currently limited to six domains and
    a total of 256 characters.” Note in the screen capture how the resolv.conf file
    was configured automatically by /sbin/dhclient-script with values provided by
    the DHCP server in the author’s office network.


