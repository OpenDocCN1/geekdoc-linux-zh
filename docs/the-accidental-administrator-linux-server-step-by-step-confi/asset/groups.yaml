    # Using the alias command


    The alias command is a shell function that allows you to substitute one command
    for another. Aliases are also handy for assigning default arguments to commands,
    such as ensuring that the "-i" (interactive) option is always used with the "cp"
    and "mv". The syntax for the alias command is:


    ```

    #alias [new command]="command with arguments"

    #alias cps="cp -s" would create the new alias "cps" which would always invoke
    the "cp" command with the symbolic link argument.

    ```


    You can see existing aliases by issuing the alias command with no options at a
    command prompt.'
  - "[PAGE 53]\n\nAliases can be removed with the unalias command:\n#unalias cps will\
    \ remove the “cps” alias.\n\n# Making Aliases Persistent\n\nIf you use the alias\
    \ command to create an alias, the aliases are only in effect for your current\
    \ session. To make them persistent across logon, add them to your profile by modifying\
    \ ~/.bashrc. In the following screen capture, you can see how three aliases were\
    \ added to the file, making them persistent across logons and system boots. Note\
    \ the leading period in the filename (.bashrc) which makes it a hidden file in\
    \ Linux.\n\n```\n# .bashrc\n\n# User specific aliases and functions\n\nalias rm='rm'\n\
    alias cp='cp'\nalias mv='mv'\n\n# Source global definitions\nif [ -f /etc/bashrc\
    \ ]; then\n    /etc/bashrc\nfi\n```\n\n**Figure 4** Creating persistent aliases\n\
    \n# Starting Services\n\nAs mentioned earlier, many daemons (services) are started\
    \ from shell scripts located in the /etc/rc.d/init/ directory. You can view the\
    \ various services by navigating to the directory and issuing the “-ls” command.\
    \ You’ll notice that the files within the directory are all scripts (you can tell\
    \ by the execute permission on each file). You can execute scripts from within\
    \ the directory by preceding the script name with “./” or from any directory as\
    \ follows:\n\nStart a service:\n#/etc/rc.d/init.d/.nfs start\n\nStop a service:\n\
    #/etc/rc.d/init.d/.nfs stop\n\nRestart a service\n#/etc/rc.d/init.d/.nfs restart\n\
    \nSoundthinking point: Red Hat’s “service” tool"
- md: "\nLinux distros based on Red Hat such as RHEL, CentOS, and Fedora include a\
    \ script called “service” which is located in /bin. The “service” script will\
    \ do essentially the same thing as the above commands, but in a simpler form:\n\
    \n```bash\n#service nfs start\n#service nfs stop\n#service nfs status\n#service\
    \ nfs restart\n```\n\nWhen using a RedHat-based product such as RHEL, Fedora,\
    \ CentOS, you can see the various services available for use with the service\
    \ command by typing “service”, then touching the tab key twice.\n\nNote: When\
    \ you compile applications from source, you will not be able to use tools such\
    \ as those listed on this page without creating customized scripts for each compiled\
    \ application. That is one of the benefits of using applications compiled by the\
    \ distro vendor instead of compiling them.\n\nTo start applications you compiled\
    \ yourself, you must find the script or binary that starts the application. Usually,\
    \ there is a README file included with the source code that will tell you the\
    \ default installation paths. Alternatively, you can use the “find” utility to\
    \ search the filesystem for files by name.\n\n## Linux Compression and Archiving\
    \ Tools\n\nArchiving is the process of storing multiple files in one file to simplify\
    \ backup, moving, and transfer. Compression uses various algorithms to store files\
    \ and directories in a way that consumes less space on the disk or tape. A common\
    \ practice is to create an archive file and then compress it.\n\n“tar” is a commonly-used\
    \ archiving utility. It saves many files together in a single archive for tape\
    \ or disk and allows the restoration of individual files from that archive.\n\n\
    ## Soundthinking point: The Acronym “tar”\n\nThe acronym “tar” comes from the\
    \ phrase “tape archive”.\n\nTar usage:\n\n```bash\n#tar [option] [file]\n#tar\
    \ -cf demofile.tar file1.txt file2.txt file3.txt will create the archive demofile.tar\
    \ including the files file1.txt, file2.txt, and file3.txt.\n#tar -tvf demofile.tar\
    \ will list all files in the archive demofile.tar verbely.\n#tar -xf demofile.tar\
    \ will extract all files from archive “demofile.tar”.\n```\n\nCommon compression\
    \ tools in RedHat Linux include (.gz), bzip2 (.bz2), and zip (.zip). compression\
    \ tools used with each type of file are gzip, bzip2, and zip. The uncompression\
    \ tools used with each type of compression are gunzip, bunzip2, and unzip.\n\n\
    ## Compression usage:\n```bash\n#gzip [filename]\n#gunzip [filename]\n#bzip2 [filename]\n\
    #bunzip2 [filename]\n#zip [filename]\n#unzip [filename]\n```\n\nbzip2 is recommended\
    \ due to its high compression rate and availability on most UNIX/Linux systems.\
    \ bzip2 can also create a single compressed file from multiple files.\n\nzip and\
    \ unzip are compatible with the Windows file compression utility PKZIP versions\
    \ 2.04 and later.\n\n## Student Exercise 2.3: Archiving and compressing\n\nIn\
    \ the following exercise, you will learn how to create a “tarball” and compress\
    \ it using common archiving and compression tools.\n\n1. Enter the following commands\
    \ to switch user to root and change directory to /demo:\n   su -\n   Password:p@ss5678\n\
    \   #cd /demo\n2. Once again, use the touch command to create three files in /demo:\n\
    \   #touch file1 file2 file3\n3. Enter the “ls” command to confirm the presence\
    \ of file1, file2, and file3.\n4. Create a tarball (tape archive) of the three\
    \ files called files.tar with the following command:\n   #tar cvf files.tar file*\n\
    5. View the contents of the tarball with the following command:\n   #tar tvf files.tar\n\
    6. View the size of the tarball with the following command:\n   #ls -l\n7. What\
    \ is the size of files.tar?\n   It should be about 10,240 bytes.\n8. Compress\
    \ the tarball with the following command:\n   #gzip files.tar\n9. Touch the up\
    \ arrow twice to cycle back to the “ls -l” command and press Enter.\n10. Notice\
    \ that files.tar has been renamed to files.tar.gz, indicating that it’s a gzip\
    \ compressed file. What is the size of files.tar.gz?\n    It should now about\
    \ 141 bytes.\n11. Now, uncompress files.tar.gz with the following command:\n \
    \   #gunzip files.tar.gz\n12. Touch the up arrow twice to cycle back to the “ls\
    \ -l” command and press Enter.\n13. Notice that the .gz extension has been removed\
    \ and files.tar is back to its original size.\n14. Remove the tarball with the\
    \ following command:\n    #rm -rf files.tar\n\nYou can perform similar operations\
    \ with bzip2 using the commands bzip2 and bzip2. also allows you to create a tarball\
    \ and compress it in a single operation using the “z” switch for gzip or the “j”\
    \ switch for bzip2:\n\n1. While in /demo, execute the following command:\n   #tar\
    \ cvfj files.tar.bz2 file*\n2. Use the “ll” command to display the contents of\
    \ /demo.\n3. Notice that files.tar.bz2 is now compressed. What is its size?\n\
    4. What was the size of files.tar.gz?\nIn this case, the tarball compressed with\
    \ bzip2 should be slightly smaller than the tarball compressed with gzip.\n5.\
    \ Use the following command to view the contents:\n   #tar -jf files.tar.bz2\n\
    6. Notice that the .gz extension has been removed and files.tar is back to its\
    \ original size.\n7. Remove the tarball with the following command:\n   #rm -rf\
    \ files.tar\n\n## The init process\n\nThe init is the first script that runs on\
    \ Linux controls the most basic services such as mounting the file systems specified\
    \ in fstab, enabling the swap partition, setting system-wide environment variables,\
    \ setting the system time, and other operating system tasks. After init is run,\
    \ the system is started in the default-runlevel specified in the initab file.\
    \ Run level 3 is the most common. Any services defined in the default-runlevel\
    \ are started. The services are controlled by scripts within the rc[X].d directory\
    \ (where \"X\" is the chosen run level).\n\n## Run Levels\n\nThe number of run\
    \ levels varies from distro to distro, as do the default settings in each run\
    \ level. What follows is an example of the default configurations for a system\
    \ running a Red Hat-based distribution:\n\n- runlevel0:\n  - Shut down the system\n\
    \  - Do not set the initab value to runlevel0\n- runlevel1:\n  - Single-user mode\n\
    - runlevel2:\n  - Multi-user mode, but no NFS support\n- runlevel3:\n  - The most\
    \ commonly used run level and usually the best choice for servers\n  - Multi-user\
    \ mode without “X\"\n- runlevel4:\n  - Not used\n- runlevel5:\n  - good for end-user\
    \ workstations, but not recommended for servers\n  - X11\n- runlevel6:\n  - Reboot\n\
    \  - Do not set the initab value to runlevel6\n\nA Debian-based system also has\
    \ seven run-levels. Run levels two through five are identical, but can be configured\
    \ in whatever way you desire. The default configuration boots the system into\
    \ run level 2 which is configured as full multi-user mode with graphics (X windows).\n\
    \nYou can view the current run level with this command:\n\n```bash\n#runlevel\n\
    ```\n\nThe display will indicate the current and previous run level(s), separated\
    \ by a space. You can change the current run level with this command:\n\n```bash\n\
    #init [desired run level] or #telinit [desired run level]\n```\n"
  mdcn: "\n基于 Red Hat 的 Linux 发行版（如 RHEL、CentOS 和 Fedora）包含一个位于 `/bin` 的名为“service”的脚本。“service”\
    \ 脚本的作用本质上与上述命令相同，但形式更简单：\n\n```bash\n#service nfs start\n#service nfs stop\n\
    #service nfs status\n#service nfs restart\n```\n\n在使用基于 RedHat 的产品（如 RHEL、Fedora、\
    \ CentOS）时，你可以输入“service”然后按两次 Tab 键，来查看可以使用 service 命令调用的各种服务。\n\n注意：当你从源码编译应用程序时，如果不为每个编译的程序创建自定义脚本，你将无法使用此页面列出的工具。这就是使用发行版厂商编译的应用程序而不是自己编译的好处之一。\n\
    \n要启动你自己编译的程序，你必须找到启动该程序的脚本或二进制文件。通常，源代码中会包含一个 README 文件，告知你默认的安装路径。或者，你可以使用“find”工具按名称在文件系统中搜索文件。\n\
    \n## Linux 压缩与归档工具\n\n归档（Archiving）是将多个文件存储在一个文件中，以简化备份、移动和传输。压缩（Compression）则使用各种算法存储文件和目录，以占用更少的磁盘或磁带空间。常见的做法是先创建一个归档文件，然后对其进行压缩。\n\
    \n“tar”是一种常用的归档工具。它将许多文件保存在单个用于磁带或磁盘的归文件中，并允许从该归文件中恢复单个文件。\n\n## 思考点：缩写“tar”\n\
    \n缩写“tar”源于短语“tape archive”（带存档）。\n\nTar 的用法：\n\n```bash\n#tar [option] [file]\n\
