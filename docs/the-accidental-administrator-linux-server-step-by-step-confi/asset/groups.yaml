    ## 网络管理


    ### 网络配置文件


    /etc/sysconfig/network 文件包含非特定于接口的参数，例如启用网络、持久性主机名和默认网关。


    ### 网卡配置


    检查 /etc/sysconfig/network-scripts/ifcfg-eth[x] 文件（其中 “x” 是要配置的接口编号）。


    一个接口配置示例文件可能如下：


    ```

