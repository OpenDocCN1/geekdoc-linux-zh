    baseurl=http://download.webmin.com/download/yum

    enabled=1

    ```


    You should also install the Webmin GPG key which the packages are signed. Use
    the following command:


    ```

    rpm --import http://www.webmin.com/jcameron-key.asc

    ```


    You will be able to install with the following command :


    ```

    yum install webmin

    ```


    All dependencies should automatically be resolved.

    You use Webmin by pointing your browser to https://localhost:10000. Log on with
    your root username and password.


