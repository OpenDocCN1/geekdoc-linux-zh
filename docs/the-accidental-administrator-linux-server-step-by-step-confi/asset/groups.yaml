    ## Chapter Eight: Linux Network Services\n\n> “Software is like sex: it's better\
    \ when it's free.” --Linus Torvalds\n\n## Dynamic Host Configuration Protocol\
    \ (DHCP)\n\n### Configuring DHCP\n\nDHCP is not installed by default when you\
    \ choose network servers in the initial installation. If it is necessary to install\
    \ it later you can either yum on the Internet or rpm locally. Once installed,\
    \ DHCP uses the /etc/dhcpd.conf file to retrieve its configuration information.\
    \ As of this writing, DHCP uses two DNS update schemes: the ad-hoc DNS update\
    \ mode and the interim DHCP-DNS interaction update mode. The recommended method\
    \ is DHCP-DNS interaction update mode, which is implemented by placing this line\
    \ at the configuration file:\n\n```\nddns-update-style interim;\n```\n\nWithin\
    \ dhcpd.conf are two types of statements: parameters and declarations: Parameters\
    \ state whether a task is to be performed and how tasks are to be performed, and\
    \ what network configuration options are be sent to the client. Any parameters\
    \ declared before braces {} are global parameters and apply to all following sections.\
    \ Declarations describe the network topology and the clients. Declarations also\
    \ provide client addresses and apply groups of parameters to groups of declarations.\
    \ A subnet declaration must be included for each subnet in your network. The DHCP\
    \ server will fail to start if this step is omitted.\n\nWhat follows is a sample\
    \ dhcpd.conf file:\n\n```\nddns-update-style interim;\nsubnet 192.168.0.0 netmask\
    \ 255.255.255.0 :\n  option routers 192.168.0.1;\n  option subnet-mask 255.255.255.0;\n\
    \  option domain-name \"class.local\";\n  option domain-name-servers 192.168.0.1;\n\
    \  option time-offset -1800; # Eastern Standard Time\n  range 192.168.0.50 192.168.0.99;\n\
    \nhost xp1 {\n  hardware ethernet 00:0c:29:ba:08:ae;\n  fixed-address 192.168.0.61;\n\
    }\n```\n\nFigure 9 Understanding /etc/dhcpd.conf\n"
