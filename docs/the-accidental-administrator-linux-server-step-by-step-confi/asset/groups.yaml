    agent by using system-switch-mail:


    +   1. #system-switch-mail


    A window will appear in which you can change the MTA from the default of sendmail
    to Postfix. This also starts Postfix automatically on runlevels 3, 4, and 5:


    +   2. Configure Dovecot to start on boot on runlevels 3, 4, and 5:


    ```

