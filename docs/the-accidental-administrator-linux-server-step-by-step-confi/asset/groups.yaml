- md: "\n# Chapter Ten:\nIntegrating Linux with Windows Systems\n\n> \"If you hear\
    \ a voice within you say,\n'You cannot paint,' then by all\nmeans paint and that\
    \ voice will be\nsilenced.\" --Vincent van Gogh\n\n## Using SAMBA\n\n## Integrating\
    \ Linux with Windows-based Computers\n\nServer Message Block (SMB) was the file\
    \ and printer sharing protocol used on computers running earlier operating systems.\
    \ It has been upgraded to the Common Internet File Sharing (CIFS) protocol on\
    \ recent Windows systems. For either SMB or CIFS, Samba allows Linux/Unix computers\
    \ to interact with computers running the Windows operating system.\n\nUsing Samba,\
    \ you can:\n\n- Configure Unix/Linux systems to share files and printers with\
    \ Microsoft clients\n- Configure a Unix/Linux server as a Windows domain controller\n\
    - Allow Unix/Linux clients to access SMB/CIFS shares on Microsoft servers\n\n\
    ## Required Samba Daemons\n\nsmbd is the server daemon that provides filesharing\
    \ and printing services to Windows clients. It provides payspace and printer services\
    \ to clients using the SMB (or CIFS) protocol. It can serve clients such as Windows,\
    \ DOS, OS/2, Linux/Unix, and Macintosh.\n\nYou can check version of Samba is running\
    \ with this command:\n\n```\n#smbd -V (Note that the “V” is upper-case).\n```\n\
    \nThe other daemon required for Samba is nmbd which provides NetBIOS naming services.\
    \ It is a server that understands and relates to NetBIOS over IP name service\
    \ requests such as those produced by SMB/CIFS clients including Windows 95/98/ME,\
    \ Windows NT, Windows 2000, and LanManager. It also participates in the browsing\
    \ protocols which make up the Windows \"Network Neighborhood\" and “My Network\
    \ Places” view.\n\nThe nmbd daemon is not strictly required, however it allows\
    \ NetBIOS name lookups which can simplify shared resource access.\n\n## Samba\
    \ configuration files\n\nThere are three main files used to configure Samba:\n\
    \n- smb.conf - the main Samba configuration file\n- lmhosts - NetBIOS hosts file\n\
    - smbpasswd - SMB password file\n\n## The smb.conf file\n\nThe /etc/samba/smb.conf\
    \ is divided into two main sections:\n\n- “Global Settings” defines properties\
    \ that influence all shares\n- “Share Definitions” defines the shares\n\n## The\
    \ lmhosts file\n\nThis file maps NetBIOS names to IP addresses. It is similar\
    \ to the /etc/hosts file, except that the component for the hostname must comply\
    \ with the NetBIOS naming format. It contains one line for each NetBIOS name.\
    \ Each line has two fields separated by a space. Entries beginning with a pound\
    \ sign (#) are ignored.\n\nThe IP address is expressed in the common dotted decimal\
    \ format. The NetBIOS name is a maximum of 15 characters.\n\nThe lmhosts file\
    \ is located in /etc/samba/\n\n## The smbpasswd file\n\nThis is the encrypted\
    \ password file for Samba containing the username, Unix (Linux) ID, and the SMB\
    \ hashed password for the user. The format of the smbpasswd file is similar to\
    \ /etc/passwd. It is an ASCII text file with one line for each user. Fields within\
    \ each line are separated by a colon. Entries beginning with a pound sign (#)\
    \ are ignored.\n\nThe format of the smbpasswd file is as follows:\n\n| Name |\
    \ LanMan | password hash |\n| :--- | :--- | :--- |\n\nThe name is the username\
    \ which must already exist in /etc/passwd. In other words, it must be an existing\
    \ Linux user on the system.\n\nThe UID is the UNIX uid which must match the uid\
    \ field for the same user entry in /etc/passwd. If it does not match, the smbpasswd\
    \ entry for that user will be ignored.\n\n## Samba Authentication\n\nThere are\
    \ four levels of SAMBA authentication:\n\n- Share Level- Permits access similar\
    \ to win9x\n- User Level- Authentication is required (default method)\n- Server\
    \ Level- Similar to User Level but authentication is passed to another SMB password\
    \ server\n- Domain Level- Samba server acts as a member of a windows domain\n\n\
    ## Using Samba as a Domain Controller\n\nA Linux server running Samba can perform\
    \ most of the functions of a Windows Domain Controller including domain authentication\
    \ and logons, plus logon scripts, roaming profiles, and system policies.\n\n##\
    \ Student Exercise 10.1: Configuring Samba for File Sharing\n\nIn this exercise,\
    \ you will learn how to configure Samba to share resources located on a Linux\
    \ computer with users on Windows computers.\n\n1. Enter the following commands\
    \ to create a Samba demo directory and configure it for access:\n$su\nPassword:\
    \ p@ss5678\n#mkdir /smbdemo\n#chmod 777 /smbdemo\n#cd /smbdemo\n\nNote: Changing\
    \ the directory with three files for use this exercise: smbdemo has the potential\
    \ to create security vulnerabilities. On a production system, more restrictive\
    \ permissions are appropriate.\n\n2. Populate the directory with three files for\
    \ use during this exercise:\n#touch smb1 smb2 smb3\n\n3. Now, you will modify\
    \ the Samba configuration file to share the /smbdemo directory’s contents with\
    \ other users on both Linux and Windows computers:\n#cd /etc/samba\n\n4. Make\
    \ a backup of the Samba configuration file:\n#cp smb.conf smb.conf.bak\n\n5. Use\
    \ the vi text editor to modify smb.conf:\n#vi smb.conf\n   a. Turn on line numbering\
    \ with the following command in vi:\n      :set nu\n   b. Modify line 74 to read:\
    \ workgroup = soundtraining.class\n   c. Modify line 75 to read: server string\
    \ = [your computer name]\n      For example, if you're using comp01, line 75 should\
    \ read as follows:\n      server string = comp01\n   d. Uncomment line 80 by removing\
    \ the leading semicolon.\n   e. Modify line 80 to read:\n      hosts allow = 192.168.0.127\n\
    \      (Notice the trailing periods after the “0” and “127” and the space between\
    \ 0. And 127).\n\n6. Touch the ESC key, then use the key combination of Shift-G\
    \ to navigate to the bottom of the file\n\n7. Touch the “o” key by inserting text\
    \ on the line below the current line\n\n8. Type [smbdemo]<enter> (Note: the directory\
    \ name, in this case “smbdemo”, must be enclosed in square brackets.)\n\n9. Type\
    \ path = /smbdemo<enter> (Note, you must include spaces between path, and /.)\n\
    \n10. Type writable = yes (Note, you must include spaces between writable, and\
    \ yes.)\n\n11. When you are done, the section should look like:\n[smbdemo]\npath\
    \ = /smbdemo\nwritable = yes\n\n12. Touch the ESC key, then :wq\n\n13. Verify\
    \ the Samba service by typing:\n#service smb status\n\n14. Verify the accuracy\
    \ of your /etc/samba/smb.conf with the following command:\n#testparm\n\n15. Set\
    \ a password for Samba by typing smbpasswd -a user\n\n16. Repeat the process for\
    \ each computer.\n\n## Mounting SMB Shares\n\nIn this portion of the exercise,\
    \ you will mount an external share to make it part of your file system.\n\n17.\
    \ Create a mount point with the following command:\n# mkdir /mnt/smb\n\n18. Check\
    \ the share with the smbclient -L command:\n# smbclient -L localhost\n\n19. Mount\
    \ the share with the following command (all on a single line):\n# mount -t cifs\
    \ -o username=user,password=pass localhost/share /mnt/smb\n\n## The Samba Web\
    \ Administration Tool (SWAT)\n\nSWAT provides a browser-based configuration tool.\
    \ The advantage of using SWAT over the Server Configuration Tool is that it offers\
    \ many more configuration options and is accessible through any browser.\n\nYou\
    \ can install SWAT either from the lernet using yum or from the CentOS installation\
    \ DVD. To install SWAT using yum, use the following command as root:\n\n```\n\
    #yum install samba-swat*\n```\n\nConfirm the installation when prompted.\n\nTo\
    \ install SWAT from the installation media, mount the installation DVD and navigate\
    \ to /RPMS, then run this command:\n\n```\n#rpm -ivh samba-swat*\n```\n\nAfter\
    \ SWAT is installed, it has to be turned on with this command:\n\n```\n#chkconfig\
    \ swat on\n```\n\nThe xinetd start-up script must also be restarted with this\
    \ command:\n\n```\n#service xinetd restart\n```\n\nConnect to SWAT by typing this\
    \ URL in your local browser:\n\n```\nhttp://localhost:901 or http://127.0.0.1:901\n\
    ```\n\nBy default, SWAT will not allow connections from any computer other than\
    \ the one on which it is installed. You can, however, allow remote connections\
    \ by modifying the SWAT configuration file (/etc/xinetd.d/swat). Modify the line\
    \ “only_from=127.0.0.1” to read as follows:\n\n> only_from=192.168.0.0 127.0.0.1\n\
    \nThe above line will allow any host on the 192.168.0.0 network, plus the localhost\
    \ (127.0.0.1) to access SWAT through a Web browser.\n"
  mdcn: "\n\n# 第十章：\n将 Linux 与 Windows 系统集成\n\n> “如果你听到内心有一个声音说：‘你不会画画’，那么无论如何，去画吧，那个声音将会会消失。”——文森·梵高\n\
    \n## 使用 SAMBA\n\n## 将 Linux 与基于 Windows 的计算机集成\n\nServer Message Block (SMB) 是早期运行操作系统的计算机使用的文件和打印机共享协议。在最近的\
    \ Windows 系统中，它已升级为通用互联网文件共享（CIFS）协议。对于 SMB 还是 CIFS，Samba 都允许 Linux/Unix 计算机与运行\
    \ Windows 操作系统的计算机进行交互。\n\n通过 Samba，你可以：\n\n- 配置 Unix/Linux 系统以与 Microsoft 客户端共享文件和打印机\n\
    - 将 Unix/Linux 服务器配置为 Windows 域控制器\n- 允许 Unix/Linux 客户端访问 Microsoft 服务器上的 SMB/CIFS\
    \ 共享\n\n## 所需的 Samba 进程\n\nsmbd 是为 Windows 客户端提供文件共享和打印服务的服务器进程。它为使用 SMB（或 CIFS）协议的客户端提供空间和打印机服务。它可以为\
    \ Windows、DOS、OS/2、Linux/Unix 和 Macintosh 等客户端提供服务。\n\n你可以使用以下命令检查正在运行的 Samba\
    \ 版本：\n\n```\n#smbd -V（注意“V”是大大写的）。\n```\n\nSamba 要求的另一个进程是 nmbd，它提供 NetBIOS 命名服务。它是一个理解并响应基于\
    \ IP 的 NetBIOS 服务请求的服务器，例如包括 Windows 95/98/ME、Windows NT、Windows 2000 和 LanManager\
    \ 在内的 SMB/CIFS 客户端产生的请求。它还参与组成 Windows“网络邻域”和“我的网络”视图的浏览协议。\n\nnmbd 进程并非严格强制，但它允许\
    \ NetBIOS 名称查找，这可以简化共享资源的访问。\n\n## Samba 配置\n\n有三个主要文件用于配置 Samba：\n\n- smb.conf\
    \ - Samba 主配置文件\n- lmhosts - NetBIOS 主机文件\n- smbpasswd - SMB 密码文件\n\n## smb.conf\
    \ 文件\n\n/etc/samba/smb.conf 分为两个主要部分：\n\n- “Global Settings（全局设置）”定义影响所有共享的属性\n\
    - “Share Definitions（共享定义）”定义共享内容\n\n## lmhosts 文件\n\n该文件将 NetBIOS 名称映射到 IP 地址。它类似于\
    \ /etc/hosts 文件，不同之处主机名部分必须符合 NetBIOS 命名格式。它为每个 NetBIOS 名称包含一行内容。每行有两个用空格分隔的字段。以井号（#）开头的条目会被忽略。\n\
    \nIP 地址用常用的点分进制格式表示。NetBIOS 名称最大为 15 个字符。\n\nlmhosts 文件位于 /etc/samba/\n\n## smbpasswd\
    \ 文件\n\n这是 Samba 的加密密码文件，包含用户名、Unix (Linux) ID 以及用户的 SMB 哈希密码。smbpasswd 文件的格式与\
    \ /etc/passwd 类似。它是一个 ASCII 文本文件，每个用户占一行。每行内的字段用冒号分隔。以井号（#）开头的条目会被忽略。\n\nsmbpasswd\
    \ 文件的格式如下：\n\n| 名称 (Name) | LanMan | 密码哈希 (password hash) |\n| :--- | :--- | :---\
    \ |\n\n名称是用户名，必须已经存在于 /etc/passwd 中。换句话说，它必须是系统中已存在的 Linux 用户。\n\nUID 是 UNIX uid，必须与\
    \ /etc/passwd 中相同用户条目的 uid 字段匹配。如果不匹配，该用户的 smbpasswd 条目将被忽略。\n\n## Samba 认证\n\n\
    有四种级别的 SAMBA 认证：\n\n- 共享级（Share Level）：允许类似于 win9x 的访问\n- 用户级（User Level）：需要认证（默认方法）\n\
    - 服务器级（Server Level）：类似于用户级，但认证将传递给另一个 SMB 密码服务器\n- 域级（Domain Level）：Samba 服务器作为\
    \ Windows 域的一部分\n\n## 将 Samba 作为域控制器\n\n运行 Samba 的 Linux 服务器可以执行大多数 Windows 域控制器功能，包括域认证和登录，以及登录脚本、漫游配置文件和系统策略。\n\
    \n## 学生练习 10.1：配置 Samba 进行文件共享\n\n在练习中，你将学习如何配置 Samba，将 Linux 计算机上的资源与 Windows\
    \ 计算机上的用户共享。\n\n1. 输入以下命令创建一个 Samba 目录并对其进行访问配置：\n$su\nPassword: p@ss5678\n#mkdir\
    \ /smbdemo\n#chmod 777 /smbdemo\n#cd /smbdemo\n\n注意：为了本次练习，更改了带有三个文件的目录：smbdemo\
    \ 可能会产生安全漏洞。在生产系统中，应使用更严格的权限。\n\n2. 在目录中填充三个文件以供练习：\n#touch smb1 smb2 smb3\n\n\
    3. 现在，你将修改 Samba 配置文件，以便 Linux 和 Windows 计算机上的其他用户共享 /smbdemo 目录的内容：\n#cd /etc/samba\n\
    \n4. 为 Samba 配置文件备份：\n#cp smb.conf smb.conf.bak\n\n5. 使用 vi 编辑器修改 smb.conf：\n\
    #vi smb.conf\n   a. 在 vi 中通过以下命令开启行号：\n      :set nu\n   b. 修改第 74 行，内容为：workgroup\
    \ = soundtraining.class\n   c. 修改第 75 行，内容为：server string = [你的计算机名称]\n      例如，如果你使用\
    \ comp01，第 75 行应写为：\n      server string = comp01\n   d. 删除开头的分号取消第 80 行的注释。\n\
    \   e. 修改第 80 行，内容为：\n      hosts allow = 192.168.0.127\n      （注意“0”和“127”后面的点号，以及\
    \ 0 和 127 之间的空格）。\n\n6. 按 ESC 键，然后使用 Shift-G 组合键导航到文件末尾\n\n7. 按“o”键，在当前行下方插入文本\n\
    \n8. 输入 [smbdemo]<回车>（注意：目录名在此处为“smbdemo”，必须包含在方中。）\n\n9. 输入 path = /smbdemo<回车>（注意，path\
    \ 和 / 之间必须包含空格。）\n\n10. 输入 writable = yes（注意，writable 和 yes 之间必须包含空格。）\n\n11.\
    \ 完成后，该部分看起来应该是：\n[smbdemo]\npath = /smbdemo\nwritable = yes\n\n12. 按 ESC 键，然后输入\
    \ :wq\n\n13. 通过输入命令验证 Samba 服务：\n#service smb status\n\n14. 通过以下命令验证 /etc/samba/smb.conf\
    \ 的准确性：\n#testparm\n\n15. 输入 smbpasswd -a 为 Samba 设置密码\n\n16. 为每台计算机重复此过程。\n\n\
    ## 挂载 SMB 共享\n\n在练习的范围内，你将挂载外部共享以成为文件系统的一部分。\n\n17. 使用以下命令创建挂载点：\n# mkdir /mnt/smb\n\
