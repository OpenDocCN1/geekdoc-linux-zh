  mdcn: "\n# 第十三章：\nLinux 网络服务\n\n> “我认为计算机病毒应该被看作生命。我认为这反映了人性的本质：到目前为止我们创造的唯一生命形式是纯粹的破坏性的。我们是按照自己的形象创造了生命。”——斯蒂芬·霍金\n\
    \n## Apache Web 服务器\n\nApache Web 服务器无疑是所有 Web 服务器软件中最受欢迎的。根据某些估计，它的市场份额超过 60%。它运行在许多平台上，包括\
    \ UNIX、Linux 和 Windows。Apache Web 服务器通常被认为具有极高的灵活性、安全性和稳定性。\n\n在 `/var/www/www/manual/index.html`\
    \ 处有一份在线手册。\n\n## 了解 Apache\n\nApache 的三个主要部分\n\n- Httpd 守护进程 (daemons)\n  - 响应服务器网络接口的传入请求\n\
    \  - 根据配置文件中指定的参数处理请求\n\nApache 配置文件\n\n- httpd.conf\n  - 主配置文件\n  - Magic 模块\n\
    \  - 帮助 Apache 识别不同的媒体类型\n\n网站内容\n\n- 在 Red Hat Linux 中，位于 `/var/www/html`（Apache\
    \ 配置文件会指定每个发行版的文档页面位置）\n\n## Apache 配置指令\n\nApache 配置参数包含在 `httpd.conf` 文件的指令中。`httpd.conf`\
    \ 文件分为容器（也称为“块”），这些容器提供了 Apache 将一个或多个指令组合成单个实体的结构。每个容器包含一个开始和结束标签，将指令绑定在一起。在每个容器内部，使用指令来分配变量或选项。\n\
    \n## httpd.conf 的三个部分\n\n`httpd.conf` 文件可以分为三部分：全局环境 (Global Environment)、主服务器\
    \ (Main Server) 和虚拟主机 (Virtual Hosts)。全局环境定义了 httpd 守护进程的行为。全局环境部分的指令涉及你的 Web\
    \ 服务器的整体运行。主服务器设置服务器的默认行为，虚拟主机定义了虚拟 Web 服务器的参数。\n\n## 开发虚拟站点\n\n使用虚拟主机可以使单个 Apache\
    \ Web 服务器看起来像许多个服务器。虚拟站点有多种用途，包括节省 IP 地址、提高服务器硬件的利用率，以及允许员工和客户拥有自己的网站。虚拟主机有两种类型：\n\
    \n### 基于 IP 的虚拟主机\n\n- 每个站点都需要一个 IP 地址（也就是说，服务器上的每个主机名都分配一个自己的 IP 地址）\n- 通常，只有在使用\
    \ SSL 证书提供安全性时，基于 IP 的虚拟主机才是理想的，因为此类证书与 IP 地址相关\n\n### 基于名称的虚拟主机\n\n- 为每个站点关联一个名称，不需要单独的\
    \ IP 地址\n- 允许多个主机名（网站）共享单个 IP 地址\n- 除非在使用 SSL 证书，否则这通常被认为是最佳实践\n\n## 启用基于名称的虚拟主机\n\
    \n要启用基于名称的虚拟主机，请取消注释指令：\n`<NameVirtualHost [你的计算机 IP 地址]>`\n\n在所有虚拟主机块中复制此地址。\n\
    \n## 检查 httpd.conf 文件\n\n使用命令 `httpd -t` 检查文件是否存在语法错误\nWeb 根目录为 /var/www/html。\n\
    \n| 学生练习 13.1：创建一个简单的 Web 服务器 |\n| :--- |\n| 在此练习中，你将修改 Apache 配置文件以创建一个托管单个站点的基础\
    \ Web 服务器。 |\n| 1. 登录你的系统并切换到 root 用户：<br> $ su - <br> 密码:p@ss5678 |\n| 2. 安装\
    \ Apache Web 服务器：<br> #yum -y install httpd* |\n| 3. 创建 httpd 配置配置文件的备份： |\n\n\
    ```bash\n#cd /etc/httpd/conf\n#cp httpd.conf httpd.conf.bak\n#vi httpd.conf\n\
    ```\n\n- 4. 使用组合键 251+G（数字 251 加上大写“G”）跳转到第 251 行并将 `root@localhost` 替换为 `user[xx]@soundtraining.class`（其中\
    \ [xx] 是你的计算机编号）。\n\n- 5. 导航到第 265 行。通过删除前面的井号 (#) 取消注释。将 `www.example.com`:80\
    \ 替换为 `comp[xx].soundtraining.class:80`。\n\n- 6. 使用组合键 :wq 保存配置文件。\n\n- 7. 使用以下命令测试语法：`httpd\
    \ -t`\n\n- 8. 如果必要，进行任何修正。\n\n- 9. 使用以下命令启动 Apache Web 服务器：#service httpd start`\n\
    \n- 10. 使用浏览器尝试连接到你的服务器 `http://comp[xx].soundtraining.class`（其中 [xx] 是你的计算机编号）来测试你的\
    \ Web 服务器。如果你的服务器运行正常，你将看到 Apache2 测试页面。如果你没有看到测试页面，请检查设置是否存在配置错误。\n\n## 为网站创建内容\n\
    \n在 Red Hat 系统中，网站内容的默认位置是 /var/www/html。`httpd.conf` 文件会在其他系统中指定该位置。\n\n- 11.\
    \ 使用以下命令导航到 /var/www/html：#cd /var/www/html`\n\n- 12. 你可以使用以下命令创建简单内容（如果你愿意，可以写得更详细，确保你的内容能清晰识别你的计算机）：#echo\
    \ \"This is comp[xx]\"`\n\n- 13. 使用浏览器尝试连接到你的服务器 `http://comp[xx].soundtraining.class`（其中\
    \ [xx] 是你的计算机编号）来测试你的 Web 服务器。如果你的服务器运行正常，你将看到 Apache2 测试页面。如果你没有看到测试页面，请检查你的设置是否存在配置错误。\n\
    \n*(注：由于原始文本存在大量重复和 OCR 乱码，译文已根据逻辑流进行了清理整合)*\n"
