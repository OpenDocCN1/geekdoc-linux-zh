    ## Other Pre-Installation Tasks


    Additional information you may need during the installation includes:


    - IP address

    - Subnet mask

    - Default gateway

    - DNS server address(s)

    - Host name

    - Domain name

    - Partition types to be used during setup

    - Root (administrator) password

    - A regular user''s username and password


    ## Soundthinking point: Installation Issues


    During operating system installation, various issues frequently come up related
    to your specific hardware or software configuration. It is impossible to anticipate
    every issue. When problems arise, your best course of action is to search the
    Internet on the specific error message you receive, combined with the name and
    version of your operating system. It is likely that someone else has already had
    and solved your issue.


    One caveat on using procedures learned from the Internet: Always test them on
    a non-critical system before implementing them on a production system. Sometimes,
    even well-meant forum posts can be inaccurate and potential harmful.


    ## Student Exercise 1.1: Installing CentOS Linux

    ### Starting the Installation Program


    This exercise is designed for use with CentOS 5.x DVD-based installation, which
    is available for free at http://mirror.centos.org/centos/5/isos/. Choose the most
    recent version (5.5 at the time of this writing) and the appropriate .iso image
    for your system architecture (i386 for a 32-bit processor or x86 64 for a 64-bit
    processor). The steps shown are similar for other RedHat-based distros and should
    also work perfectly well with a CD-ROM-based installation except that you will
    have to insert CDs when prompted by the installation routine.


    1. Place the installation DVD (or CD-ROM #1) in your computer''s DVD drive


    2. Reboot your computer (If necessary, change your "boot sequence" settings to
    boot from the DVD/CD-ROM drive).


    3. Press the Enter key at the “Boot:” prompt.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_17_0.png)


    4. Using the arrow keys on your keyboard (your mouse is not yet functional), select
    and press “Skip” to bypass the media check. (In a real world setting, it can be
    helpful to perform the test to avoid installation problems later.)


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_17_1.png)


    5. Click “Next” on the splash screen.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_17_2.png)


    6. Select English as the language to use during the installation process.

    7. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_18_0.png)


    8. Select “U.S. English” as the appropriate keyboard for the system.

    9. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_18_1.png)


    10. A warning may appear concerning disk partitions. (If you''re upgrading an
    existing system, the message will make reference to existing partitions. If you''re
    installing to a blank drive, there may not be a warning. Be aware that, regardless
    of whether you''re doing a new installation or an upgrade, this step alters disk
    partitions and will probably erase all data.)

    11. Click “Yes”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_18_2.png)


    12. On the partitioning screen, choose the option to “Create custom layout.” (Again,
    this will erase all data on the disk! Take a backup before proceeding.)


    13. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_19_0.png)


    14. The partitioning window appears.

    15. Click “New”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_19_1.png)


    16. The Add Partition window appears.

    17. In the Mount Point field, click the downward facing arrow and choose “boot"

    18. Leave the File System Type in its default setting of ext3

    19. Leave the Size (MB) setting in its default value of 100 and click OK.

    20. Repeat the preced steps for the following Mount Points, configuring the size
    as indicated:

    - /, Fill to maximum allowable size

    - /var, 2048MB

    - /home, 2048MB


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_19_2.png)


    The partition sizes indicated are used for instructional purposes only. The sizes
    you choose on a production system should be based on the size of hard drive and
    how you intend to use your system. Later in this book, you will gain an understanding
    of how each partition is used, which will help you determine the right size for
    each partition.


    21. Create a swap partition by clicking "New"

    22. Leave the Mount Point blank.

    23. For File System Type, select "swap"

    24. Set the Size(MB) to twice the amount of RAM on your system. (In the example,
    my system has 1GB or 1024MB RAM, so I set the swap size to 2048MB.)

    25. Click OK, then click Next.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_20_0.png)


    26. The GRUB loader window appears.

    27. It is not necessary to make any changes in this window. Click Next.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_20_1.png)


    The Network Devices window appears.


    28. Under Hostname, choose to set the hostname manually and enter the hostname.
    In a classroom, instructor will specify hostnames. If you''re working on your
    own, choose a descriptive name.

    29. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_21_0.png)


    30. Select a city near you for the time zone.

    31. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_21_1.png)


    “root” is the Linux/Unix super user or administrator.

    32. Enter “password5678” for the root password.

    33. Click “Next”.


    Note: standardized throughout all exercises with the administrator password password5678
    and the regular user password1234.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_21_2.png)


    34. On the software selection page, in addition to the default selections, select
    Desktop – KDE, Server, and Server – GUI.

    35. Click “Next”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_22_0.png)


    36. A splash screen appears prompting you to click next to begin the installation
    process.

    37. Click “Next”. (This process will take several minutes (15-30), depending on
    your computer’s speed. For example, during an installation on a Dell Latitude
    P01L, this part of the process took 29 minutes.)


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_22_1.png)


    38. When the installation is complete, a splash screen appears telling you to
    reboot your system.

    39. Click “Reboot”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_22_2.png)


    40. When your computer comes back up, another splash screen appears (There are
    a lot of splash screens!) welcoming you.

    41. Click “Forward”.


    42. The Firewall page appears. For the purposes of the exercise, change the firewall
    setting to “Disabled”. (In a real world environment, you would probably want a
    firewall enabled.)

    43. Click “Forward”.


    44. Confirm that you wish to override the existing firewall configuration by clicking
    “Yes”.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_23_0.png)


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_23_1.png)


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_23_2.png)


    45. The SELinux (Security Enhanced Linux) page appears. SELinux allows finer-grained
    security controls on the file system than the controls available on a traditional
    Linux system. For the purpose of the exercise, choose Disabled for the SELinux
    setting.

    46. Click "Forward"


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_24_0.png)


    47. A warning appears telling you that a change to the SELinux setting requires
    a reboot upon completion of the firstboot configuration.

    48. Click "Yes"


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_24_1.png)


    49. The Kdump screen appears. In a real-world environment, Kdump can be helpful
    in diagnosing system crashes. For the purpose of this exercise, do NOT enable
    Kdump.

    50. Click "Forward"


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_24_2.png)


    51. The Date and Time page appears.

    Adjust the time and date appropriately.

    52. Click "Forward".


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_25_0.png)


    53. The Create User page appears.

    Create a user and password based on the table following this exercise. (If you''re
    working independently, pick a username of your choice and enter your full name
    and desired password where indicated.)

    54. Click "Forward".


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_25_1.png)


    55. The Sound Card page appears.

    56. Click "Forward".


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_25_2.png)

