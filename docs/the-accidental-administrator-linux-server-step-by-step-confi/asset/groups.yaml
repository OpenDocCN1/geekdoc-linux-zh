    \n-   面向快速的服务器\n-   首批提供集群技术的 Linux 发行版之一\n-   提供 32 位和 64 位版本\n-   在亚太地区广泛使用\n\
    \n## Ubuntu (www.ubuntu.com)\n\n-   主流发行版中最新的\n-   基于 Debian\n-   专为易用性而设计\n-\
    \   作为桌面操作系统非常流行\n\n有关各种发行版的更多信息，请访问 www.distrowwatch.com。\n\n## Linux 内核\n\n\
    ### Linux 内核版本编号\n\nLinux 内核的编号方案与发行版编号没有关系。例如，SuSE Linux 11 和 Red Hat Enterprise\
    \ Linux 5.4 可能都使用 2.6 内核。较旧的 Linux 版本如 SuSE Linux 6.1 使用 2.2 内核。\n\n编号遵循此方案：x.y.z，其中“x”是主版本号，“y”是次版本号，“z”是内核补丁号。官方（稳定）发布版赋予偶数次版本号（2.2,\
    \ 2.4, 2.6），而测试/开发者版本则赋予奇数数字（2.3, 2.5, 2.7）。通常建议在升级生产系统到新内核之前，等待几个内核补丁发布，即使该内核是一个偶数次次版本版本。\n\
    \n截至 2010 年，从 www.kernel.org 可用的内核为 2.6.35.5。\n\n你可以使用命令 \"uname -r\" 显示操作系统的内核版本。\n\
    `uname` 命令显示各种系统信息。例如，“uname-a” 提供系统信息的摘要：\n\n```\n$root@instructor:~# uname -a\n\
    Linux instructor.soundtraining.class 2.6.18-164.els #1 SMP SMP Thu Sep 3 03:33:56\
    \ UTC 2009 ED\n+ 2089-03-1038 i686 GNU/Linux\n$root@instructor:~# \n```\n\n图 2：“uname\
    \ -a”的用法\n\n## 第二章：Linux 系统管理\n\n> “如果你想环游世界并被邀请到许多不同的地方演讲，就写一个 Unix 操作系统吧。” --Linus\
    \ Torvalds\n\n## GUI 与 CLI\n\n自 20 世纪 70 年代初在思罗普 Palo Alto 研究中心创建第一个图形用户界面（GUI）以来，我们从事信息系统和技术的人一直在对其优缺点进行争论。\n\
    \n真正的问题不在于使用 GUI 还是命令行界面（CLI），而在于选择一个适合你并帮助你最有效地工作的工具。对于我们大多数人来说，这意味着我们有时会使用 GUI，有时会使用\
    \ CLI。\n\n以前在 Linux 工作坊中遇到过一个学生，他的绰号是“没有 GUI 的 Louie”。我记得 Louie 是一个知识渊博且能力出色的\
    \ IT 专业人士，但也有学生因为 CLI 的复杂性而避开它，没有考虑到它为管理员带来的力量。我认为，当我们随意地消除 GUI 或 CLI 工具时，我们是在限制自己。在自己的工作中，我发现我同时使用\
    \ CLI 和 GUI，取决于正在处理的任务以及我对相关工具的熟悉程度。（好吧，我最常用命令行，但在执行不熟悉的任务时，我非常感谢 GUI！）\n\n| GUI\
    \ 优点 | 远离“主道”（注：此处可能指更硬核或更底层的控制） |\n| :--- | :--- |\n| 打字错误较少 | 控制力较弱 |\n| 琐碎细节较少\
    \ | Java 和其他问题可能导致 GUI 无法使用 |\n| 更安全（更难出错） | 它创建的某些名称和标签很奇怪 |\n| 可以帮助你学习 CLI 命令\
    \ | 有些人更熟悉 CLI |\n\n## Linux 目录\n\nLinux/UNIX 中的一切内容都在文件系统中。文件系统由各种目录（Windows\
    \ 称之为“文件夹”）组成。根目录 (\"/\") 位于文件系统的底部。某些目录可能在不同的分区或驱动器上，但它们仍然是文件系统的一部分。某些目录甚至可能完全不同的计算机上，可能运行完全不同的操作系统，但它们仍然是文件系统的一部分。以下是\
    \ Linux 文件系统中常见的目录列表（并非所有系统都包含所有目录）：\n\n- * 是根目录\n- /bin/ 和 /usr/bin/ 存储用户命令。\n\
    - /boot/ 包含用于系统启动的文件，包括内核。\n- /dev/ 包含设备文件。\n- /etc/ 是配置文件和目录所在。\n- /home/ 是用户主目录的默认位置。\n\
    - /initrd/ 用于在系统设置期间加载设备模块并挂载 initrd.img 镜像文件。\n- /lib/ 和 /usr/lib/ 存放 /bin/ 和\
    \ /sbin/ 中程序使用的库文件。\n- /lost+found/ 存放 fsck 发现的孤文件（无名称的文件）。\n- /mnt/ 存放启动后挂载的文件系统的挂载点。\n\
    - /opt/ 主要用于第三方软件的安装和卸载。存放可选文件和程序。\n- /proc/ 是虚拟目录（实际上不存储在磁盘上），存放某些程序所需的系统信息。\n\
    - /root/ 是超级用户“root”的主目录。\n- /sbin/ 和 /usr/sbin/ 存储系统命令。\n- /tmp/ 是临时目录。所有用户对\
    \ /tmp/ 都有读写权限。\n- /usr/ 包含与用户相关的文件，如应用程序文件和相关库文件（“usr”是 UNIX 系统资源的缩写）。\n- /var/（代表“variable”）存放不断变化的文件和目录，如打印机池和日志文件。\n\
    \n以上是 Linux/UNIX 目录结构的简述，可以在 www.wikipedia.com 搜索“文件系统层次结构标准”（Filesystem Hierarchy\
    \ Standard）。\n\n## 思考：自定义桌面背景\n\n通过右键点击背景并选择“更改桌面背景”，自定义 Gnome 或 KDE 背景。\n\n##\
    \ 启动和停止服务\n\n在 Linux 中，构成整个各种服务被称为守护进程（读作 DEE-mons）。DNS 名称（named）、Web 服务器（httpd）、DHCP（dhcp）等都有守护进程。当你看到以字母“d”结尾的名字时，你可能看到一个守护进程。大多数守护进程可以通过\
