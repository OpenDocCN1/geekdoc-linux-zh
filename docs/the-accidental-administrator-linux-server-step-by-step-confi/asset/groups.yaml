    ## 登录和注销程序


    与 UNIX 一样，Linux 被认为是一个安全的操作系统。访问 Linux 系统需要成功输入用户名和密码。


    ## 访问级别


    Linux 系统有两种访问级别：普通用户访问和超级用户 (root) 访问。普通用户访问限制了用户访问系统文件和目录以修改系统设置的能力，而超级用户 (root)
    允许用户对系统进行完全控制。成功登录后，shell 提示符会显示当前用户的访问级别；在 BASH shell 中，美元符号 ($) 表示当前用户具有普通用户访问权限，而井号
    (#) 表示超级用户访问权限。


    如前所述，最佳实践是仅在系统管理需要时才使用 root 账户。聪明的管理员会有一个用于正常日常操作的普通用户账户。当他们需要执行管理任务时，他们使用 "su"（切换用户）命令以
    root 身份执行命令。使用 su 命令时，在命令后添加一个连字符 (su -) 还会更改配置文件，使用户可以获得原本无法使用的系统配置命令。请注意，在调用
    su 命令后，用户会提示输入 root 密码。（您可以使用 su 命令切换到任何其他用户的账户以进行管理操作。）使用以下语法：


    ```

    #su - [用户名]

    ```


    输入 "exit" 返回到上一个用户账户。


    ## 深度思考/知识点：切换用户


    当您开始使用新安装的 Linux 系统时，将以出于安全目的创建的普通用户身份登录。然而，您需要执行的许多命令将需要“超级用户”或“root”权限。


    切换用户命令允许您在不注销的情况下临时更改用户账户和上下文。例如，假设您需要执行某些需要 root 权限的管理任务。您可以注销普通用户并以 root 身份登录，执行必要的任务，然后重新登录普通用户账户。这既笨拙又不方便。作为替代方案，在终端窗口中输入
    "su -"（"-" 告诉系统使用 root 用户的配置文件及其权限）并输入 root 密码。当完成管理任务后，输入 "exit" 返回您的普通用户账户。


    在图形环境中注销系统，点击“系统 (System)”，然后点击“注销 (Logout)”。使用 exit 命令。要关闭系统，请在命令行环境中中使用 shutdown
    命令。


    shutdown 命令有多种可用选项。两个常用的切换器包括 -r（重启）和 -h（停止）：


    ```

    #shutdown -r now

    ```


    ```

    #shutdown -h now

    ```


    注意时间选项的使用。您还可以指定格式为 hh:mm 的绝对时间。


