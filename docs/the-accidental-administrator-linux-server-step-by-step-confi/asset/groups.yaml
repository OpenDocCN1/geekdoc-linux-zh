    ## Additional User Management


    To delete a user:

    ```

    #userdel [username]

    ```


    To delete a directory:

    ```

    #userdel -r [username]

    ```


    To display the user''s ID:

    ```

    #id

    ```


    To view the group memberships:

    ```

    #groups [username]

    ```


    ## Chapter Four: File and Directory Management


    ### File System


    In order to make a device available to the file system, it must be “mounted” to
    a mount point. Before using the “mount” command, ensure that the desired mount
    point already exists within the system. A common place to locate mount points
    is /mnt (but they can be placed anywhere). To mount a device to the mount-point:

    ```bash

    #mount /dev/cdrom /mnt/cdrom

    ```

    You can navigate to the newly mounted device with the “cd” command:

    ```bash

    #cd /mnt/cdrom

    ```

    Before ejecting CDs or floppy disks, you must unmount them from the file system.
    To unmount a mount-point:

    ```bash

    #umount /mnt/cdrom

    ```

    Note that, before a mountpoint is unmounted, you must “CD” out of the directory
    you wish to unmount.


    Partitions can be mounted automatically on boot through the fstab file, which
    is located at /etc/fstab.


    ### Understanding Mount Points


    You can think of mount points as a way of accessing a partition. Recall that in
    Linux, everything is oriented around the file system. The first SCSI drive on
    a computer might be known as /dev/sda, the second as /dev/sdb, and so on. The
    first IDE drive would be known as /dev/hda. Partitions are numbered, the first
    partition on the first SCSI drive would be known as /dev/sda1, the second partition
    would be /dev/sda2, etc.


    You cannot, however, access partitions through /dev/ files; you must create mount
    points which are simply a means of gaining access to a partition through the file
    system.


    ### Directories


    Directories are containers that hold various types of files. Directories are used
    for organizing the file system.


    ### Links


    Links are files that point to other files. There are two types of links: hard
    links and symbolic links.


    Hard links are a special type of entry that can only point to a file; they cannot
    point to a directory. Hard links are created with the ln command:

    ```bash

    #ln [source] [target]

    ```


    Symbolic links are special files that store a pathname to another file. Symbolic
    links are created with the ln command, combined with the -s option:

    ```bash

    #ln -s [source] [target]

    ```

    You can think of symbolic links as being similar to shortcuts in Windows.


    ### Regular Files


    Regular files are the most common type. Three common types are regular files,
    links, and directories. When you use the ls -l command, it will display information
    about the file:

    ```bash

    #ls -l [filename]

    ```

