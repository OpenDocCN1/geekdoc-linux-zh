  - '[PAGE 15]


    # Note to the reader:


    This book, like my workshops, is designed to deliver a lot of hands-on experience.
    In many (perhaps most) other I.T. books, the first few opening pages are filled
    with background information. When I''m building a system or working on one, I
    just like to get into the process of configuration as quickly as possible. This
    book gets you into the installation process right away, then provides some background
    information about Linux to read while the installation process runs on its own.


    # Performing a Linux Installation


    As all operating systems, the minimum hardware requirements vary based on how
    the system is being used. For an example, a simple router/firewall could realistically
    be installed on a system with a Pentium processor running at 200 MHz and only
    64 MB of RAM. Conversely, a system designed for MySQL and expected to handle large
    numbers of queries would require hardware far in excess of the stated minimums.


    As with any operating system, you should carefully review the manufacturer''s
    or distribution''s recommended hardware specifications prior to starting any operating
    installation. Pay attention not only to the minimum hardware requirements, but
    also to any hardware compatibility lists.


    # Inventory Your Hardware


    It can be very helpful to understand your hardware before beginning the installation.
    It is especially important to inventory your video hardware to simplify the installation
    and configuration of X Windows (the graphical display systems used in Linux and
    UNIX).


    Things to inventory include: the video card''s manufacturer and model number,
    the monitor''s manufacturer and model number, monitor vertical and horizontal
    frequency rates, and amount of RAM present in the video adapter. It is also helpful
    to know the resolution and color capabilities of your monitor and video adapter.


    Other things to inventory include the amount of RAM, the mouse type and port,
    and the network adapter and resources.


    If you are migrating from the Microsoft Windows operating system, the system properties
    and device manager can provide a wealth of information about the system. If you''re
    installing to bare metal, live CD versions of Linux such as Knoppix can help determine
    your system''s hardware configuration.'
