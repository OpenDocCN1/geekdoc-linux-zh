    Most Linux systems configured as servers are managed in a command-line interface
    (CLI) and many Linux power-users prefer to manage even their desktop system in
    the CLI. Although the graphical user interface (GUI) tools available for use have
    improved considerably over many Linux distros over past versions, the CLI continues
    to provide the greatest power and flexibility for configuring and managing a Linux
    system. The other benefit to working in a CLI is that each Linux distro is much
    more similar in the CLI than in the GUI. For the purpose of this workshop, you
    will do most of your configurations in the CLI, allowing you to make smoother
    and simpler transitions from Debian to other distros such as SuSE, Ubuntu, RedHat,
    Slackware, or even traditional UNIX systems.


