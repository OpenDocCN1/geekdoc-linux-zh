    # Student Exercise 16.4: Configuring NAT


    Network Address Translation (NAT) is used to isolate a private network (say, 192.168.0.0/24)
    from the public Internet. Inexpensive cable modem and DSL routers use NAT to create
    a simple, yet effective firewall. Hosts on the private network share a single
    IP address on the public network. Port numbers are assigned to each connection
    to ensure that each connection has a unique identifier. This lab will show you
    how to configure NAT on a gateway device. Modern Linux systems use iptables to
    access the netfilter infrastructure of the kernel to implement firewall.


    +   1. Switch user to root:

    su -


    +   2. Use the following command to enable routing:

    echo "1" > /proc/sys/net/ipv4/ip_forward


    +   3. Use this command to enable IP masquerading (where your internal (private)
    hosts all share the same public IP address:

    iptables -t nat -A POSTROUTING -o 12.1.2.3 -j MASQUERADE

    where 12.1.2.3 is the actual public Internet address of your router


    +   4. View the filter with this command:

    iptables -t nat -n -L -v


    +   5. To flush a filter, use the following command:

    iptables -t nat -F POSTROUTING

    (This command specifies the NAT table and tells iptables to flush the POSTROUTING
    chain, removing the previously configured rule.)


    +   6. Reset the system to disable IP forwarding with this command:

    echo "0" > /proc/sys/net/ipv4/ip_forward


    There is more information about iptables at www.netfilter.org. You can download
    customizable scripts at these locations:


    www.e-infomax.com/ipmasq


    www.malibity.net/iptables/scripts/fwscripts.html


    # Port Scanning


    Caution: Do not conduct port scanning without written permission from your supervisor.
    Unauthorized port scanning can be considered an intrusion attempt and can result
    in disciplinary or punitive action.'
