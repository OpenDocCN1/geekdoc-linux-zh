- md: "\nmakes a fundamental understanding of its basic commands worthwhile.\n\nThe\
    \ traditional “vi” text editor has been replaced on most systems with “vim” (“vi”)\
    \ improved. The command set is substantially the same for both “vi” and “vim”.\
    \ On most systems, the “vi” command has been aliased to “vim”.\n\nTo open a file\
    \ with Vim, type the following command:\n\n```\n#vim [filename]\n```\n\nOperation\
    \ with Vim is done with a variety of commands, some of which are listed here:\n\
    \n```\n:set nu displays line numbers along the left margin\n```\n\n```\n:q? quits\
    \ without saving\n```\n\n```\n:wq writes and quits (saves and quits)\n```\n\n\
    Arrow keys can be used to move the cursor or letter keys can be used:\n\n- h to\
    \ go left\n- j to go down\n- k to go up\n- l to go right\n- G goes to the end\
    \ of the file\n- nG (where “n” is a line number) goes to the specified line in\
    \ the file\n\nVim has many more commands and options available. Help is available\
    \ by typing :help.\n\n## Other Commonly Used Text Editors\n\n### Emacs\n\nEmacs\
    \ is a class of text editors, known for their extensibility. Emacs has more than\
    \ 1000 editing commands. It also supports the use of macros to automate work by\
    \ combining commands. The name is based on Editor MACROSSS.\n\nDevelopment of\
    \ emacs began in the mid-70s and continues actively as this writing (early 2010).\n\
    \n### Gedit\n\nGedit is the default text editor for the Gnome desktop environment.\
    \ It supports syntax highlighting and is designed to be a very clean, easy-to-use\
    \ editor. Gedit is available for both the Linux/Unix and the Windows platforms.\n\
    \n### Notepad ++\n\nNotepad ++ is a text editor for Windows. It is often used\
    \ as a replacement for the built-in Notepad text editor. It offers several advantages\
    \ over Notepad including tabbed windows, line numbering, and syntax highlighting.\n\
    \n| Student Exercise 2.3: Working with vim: Using the vim Tutorial |\n| :--- |\n\
    | 1. In Terminal, enter the following command to start a VIM tutorial: `$vimt`\
    \ |\n| 2. Work at least through lesson four. |\n\nThere is a VIM cheat sheet on\
    \ the following page. Feel free to copy it and tape it to the side of your monitor.\n\
    \n## soundtraining.net\naccelerated i.t. training\nvim cheat sheet\n\n## Some\
    \ common vim commands\n\nPress the <ESC> (escape) key to ensure you're in normal\
    \ mode, then:\n\n- :q quits without saving\n- :wq saves and quits (write quit)\n\
    - x deletes individual characters\n- i inserts text\n- dw deletes to the end of\
    \ a word (d2w deletes two words, d3w deletes three words)\n- d$ deletes to the\
    \ end of a line\n- dd deletes an entire line (2dd deletes two lines, 23dd deletes\
    \ 23 lines)\n- u undoes the last command\n- U fixes an entire line\n- <CTRL>R\
    \ redoes the command\n- p puts the last deletion after the cursor\n- r replaces\
    \ the character under the cursor\n\ncw is the \"change word\" command, deletes\
    \ the word (from the cursor to the right) and places you in \"insert\" mode\n\
    cs is the \"change line\" command, deletes the line (from the cursor to the right)\
    \ and places you in \"insert\" mode\n\n<SHIFT>G moves to the end of the file,\
    \ [number]<SHIFT>G moves to the line number specified in the command, for example\
    \ 1<SHIFT>G moves to line #1.\n\n/[search term] searches forward through a file\
    \ for a search term. For example, \"/apache\" will search for the next instance\
    \ of the word \"apache\" in the file\n? [search term] searches backwards through\
    \ a file for a search term. For example, \"?apache\" will search for the last\
    \ instance before the cursor of the word \"apache\" in the file\n\n- :s /[old]/[new]\
    \ will replace the last instance of \"old\" with \"new\". For example, :s/blue/red\
    \ will replace the last instance of \"blue\" with \"red\"\n- :s /[old]/[new]/g\
    \ will replace every instance of \"old\" on the current line with \"new\". For\
    \ example, :s/blue/red will replace every instance of \"blue\" with \"red\".\n\
    \n- #,$$s/[old]/[new]/g will replace every instance of \"old\" with \"new\" in\
    \ the range of lines specified with the # sign.\n- ! allows you to execute external\
    \ commands\n\n- set nu on line numbering\n- nohlsearch turns off highlighting\
    \ of search terms\n\n## Using grep\n\n“grep” is a filtering utility used in the\
    \ 'unix world to aid in searches. “grep” is one of the most useful tools in Information\
    \ Systems and Technology.\n\nSome examples:\n\n- #grep red blue will display lines\
    \ of text from the blue file that contain the word “red\"\n- #rpm -qa | grep smb\
    \ will display all installed RPMs with “smb” in their name\n\nHere is a handy\
    \ way to use grep. Suppose you need to find a file (or files) containing a particular\
    \ text string. Use the grep with -r and -H options to find all files containing\
    \ that particular string (remember that everything in Linux is case sensitive).\
    \ By default, grep only prints the text string. If you’re looking for files containing\
    \ the text string, you must tell grep to the filename, too. The -H command does\
    \ that.\n\nIn the following statement, -H prints the filename and -r searches\
    \ recursively from the starting point (lists/) for the text string PHPMAILERHOST:\n\
    \n```\n$ grep -Hr PHPMAILERHOST lists/\n```\n\nThis is the output from the previous\
    \ command:\n\n```\nlists/config/config.php: define(\"PHPMAILERHOST\",'');\n```\n\
    \nYou can include the option “n” in your search to display the line number in\
    \ the file where the string appears.\n\n## Student Exercise 2.4: Conditional Searching\n\
    \nIn this exercise, you will search for a unique text string within a file buried\
    \ deep in a directory tree.\n\n1. Create a deep directory tree with the following\
    \ command in a terminal window:\n`mkdir -p /demo/demo1/demo2/demo3`\n(The \"p\"\
    \ switch creates parent directories when they do not already exist.)\n2. Using\
    \ `vi`, create a file called \"deepfile\" in the demo4 directory:\n`vi /demo/demol/demo2/demo3/deepfile`\n\
    \n| File | Edit | View | Ter |\n| :--- | :--- | :--- | :--- |\n| line1 | | | |\n\
    | line2 | | | |\n| line3 | | | |\n| line4 | | | |\n| line5 | | | |\n\n3. Enter\
    \ five lines to the file as shown in the screen capture\n4. When you're finished,\
    \ use the combination of ESC, :wq to save the file\n5. While still in a terminal,\
    \ enter the following command to find the string:\n`grep -r \"deepfile\" /demo/demol/demo2/demo3`\n\
    6. The command should return the following:\n`/demo/demol/demo2/demo3/deepfile:5`\n\
    (In the above output, the path is displayed, followed by the line number where\
    \ the string appears.)\n\n## Using alias\n\nThe alias command is a shell function\
    \ that allows you to substitute one command for another. Aliases are also handy\
    \ for assigning default arguments to commands, such as ensuring that the \"i\"\
    \ (interactive) option is always used with \"cp\" and \"mv\". The syntax for the\
    \ alias is:\n\n```\n#alias [new command]=\"command with arguments\"\n#alias cps=\"\
    cp -s\" would create the new alias \"cps\" which would always invoke the \"cp\"\
    \ command with the symbolic link argument.\n\n```You can see existing aliases\
    \ by issuing the alias command with no options at a command prompt.\n\nAliases\
    \ can be removed with the unalias command:\n#unalias cps will remove the “cps”\
    \ alias.\n\n## Making Aliases Persistent\n\nIf you use the alias command to create\
    \ an alias, the aliases are only in effect for your current session. To make them\
    \ persistent across logon, add them to your profile by modifying ~/.bashrc. In\
    \ the following screen capture, you can see how three aliases were added to the\
    \ file, making them persistent across logons and system boots.\n\n```\n# .bashrc\n\
    \n# User specific aliases and functions\n\nalias rm='rm'\nalias cp='cp'\nalias\
    \ mv='mv'\n\n# Source global definitions\nif [ -f /etc/bashrc ]; then\n    /etc/bashrc\n\
    fi\n```\n\n**Figure 4** Creating persistent aliases\n\n## Starting Services\n\n\
    As mentioned earlier, many daemons (services) are started from shell scripts located\
    \ in the /etc/rc.d/init/ directory. You can view the various services by navigating\
    \ to the directory and issuing the “-ls” command. You’ll notice that the files\
    \ within the directory are all scripts (you can tell by the execute permission\
    \ on each file). You can execute scripts from within the directory by preceding\
    \ the script name with “./” or from any directory as follows:\n\nStart a service:\n\
    #/etc/rc.d/init.d/.nfs start\n\nStop a service:\n#/etc/rc.d/init.d/.nfs stop\n\
    \nRestart a service\n#/etc/rc.d/init.d/.nfs restart\n\nSoundthinking point: Red\
    \ Hat’s “service” tool\n"
