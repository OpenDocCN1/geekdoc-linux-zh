    # The Accidental Administrator:


    # Linux Server

    Step-by-Step Configuration Guide


    Your easy-to-follow step-by-step guide to configuring a Linux Server from the
    ground up!


    The Accidental Administrator: Linux Server Step-by-Step Configuration Guide is
    packed with 44 easy-to-follow hands-on exercises plus numerous command examples
    and screen captures to help you build a working Linux server configuration from
    scratch. It''s the most straight-forward approach to learning how to configure
    a CentOS/Red Linux server, filled with practical tips and secrets learned from
    years of teaching, consulting, and administering Linux servers. There is no time
    wasted on boring theory. The essentials are covered in chapters on installing,
    administering, user management, file systems and directory management, networking,
    package management, automated task scheduling, network services, Samba, NFS, disk
    quotas, mail servers, Web and FTP servers, desktop sharing, printing, security,
    routing, performance monitoring, management tools, and more.

    Here''s what you''ll:


    +   - Where to find and legally download the free server software

    - How to build and configure an Apache Web server, including virtual hosts

    - How to configure file and printer sharing for Windows clients with Samba

    - How to understand Linux file and directory permissions


    All this information is presented in a straightforward style that you can understand
    and use right away. The idea is to be able to sit down with your Linux server
    and build a configuration in a matter of minutes. Of course, some of the more
    advanced configs may take a little longer, but even so, you''ll be able to “get
    it done” in a minimal amount of time!


    > DON R. CRAWLEY, Linux+ and CCNA Security has invested 35 years of workplace
    experience and 15 years as a technical trainer in the Accidental Administrator
    book series. He is also author of Skillpath best-selling Wit and Wisdom and is
    President/Chief Technologist at soundtraining.net, the Seattle-based firm specializing
    in accelerated training for I.T. professionals on Cisco Linux products, plus workplace
    skills for I.T. pros.


