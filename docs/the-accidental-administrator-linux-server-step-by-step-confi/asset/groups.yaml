    # Configuring and Managing Webmin


    Webmin consists of a variety of modules which permit management of various aspects
    of the computer on which Webmin is installed. Among the modules is a Webmin configuration
    module.


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_178_0.png)


    In its default configuration, Webmin permits unlimited access (subject to authentication).
    In most cases, you should restrict access by IP address, which can de done under
    IP Access Control.


    # Using Cryptographic Keys for SSH Root Login


    Requirements:


    +   - PuTTY

    - PuTTYGen

    - Local computer running Windows

    - Remote computer running Linux or UNIX


    Remote Files:


    +   - /etc/ssh/sshd_config

    - /root/.ssh/authorized_keys


    Take one look at /var/log/secure on an Internet-connected server and you''ll immediately
    understand the need for securing your root account. The bad guys are constantly
    attempting root and other usernames to attempt to login to your server using SSH
    or some other protocol. If you use a simple'
  - '[PAGE 179]


    password, it''s only a matter of time before your server is compromised by a password-guessing
    attack.


    Best practice is to disallow SSH logins by root, thus eliminating a big part of
    the risk. The problem is that doing so also eliminates a lot of convenience for
    sys admins and complicates the use of tools such as WinSCP for file copy from
    your Windows desktop or laptop to your Linux or UNIX server.


    A fairly simple solution is to use public/private keypairs for authentication.
    The public key is stored on the Linux/UNIX server and the private key is stored
    on your local Windows computer. When you connect to the Linux/UNIX server from
    your Windows computer, authentication is done with the keypair instead of a password.
    Password authentication is actually disabled for root, so no amount of password
    guessing will work for authentication.


    Here''s how to do:


    +   1. Start by downloading the PuTTY Windows installer http://the.earth.lisgatham/putty/latest/x86/putty-0.60-installer.exe.
    Run the installer on your local windows computer.

    2. Now, you must generate the keypairs. The PuTTY Windows installer you just ran
    installs an application called PuTTYgen you can use to generate the keypairs.
    The installer probably placed PuTTYgen (and the other PuTTY applications) in Start>>All
    Programs>>PuTTY.

    3. When you run PuTTYgen for the first time, you must generate a new keypair.
    At the bottom of the PuTTY window there are parameters choices including SSH-1
    (RSA), SSH-2 RSA, and SSH-2 DSA. SSH-2 RSA is the default choice with a default
    key length of 1024 bits. Longer keys are more secure, but require more processing
    power. 1024 bits is is an acceptable compromise at this time (late 2010), but
    may not be acceptable in the future as computer processing continues to increase.

    4. Click the button labeled Generate to produce your public and private keys.
    (You must move your mouse pointer over the blank area at the top of the screen
    to generate some randomness for use in producing the keypair. Move your mouse
    pointer in a circular motion over the blank area until the progress bar reaches
    the far right side and PuTTY generates the keys.)

    5. You can now save the private key on your local laptop or desktop computer and
    copy the public key to the remote Linux/UNIX server.

    6. Enter and confirm a passphrase to protect the key in the two fields in PuTTYgen.

    7. Click the button labeled Save private key and select a location on your local
    hard drive to save the private key. (Remember to protect your private key by storing
    securely!)

    8. Copy the gibberish text that is the public key (at the top of the PuTTYgen
    window) and paste it into /root/.ssh/authorized_keys on your server (You might
    have to create the .ssh directory


    178'
  - '[PAGE 180]


    and you''ll probably have to create the authorized_keys file. Note also that the
    .ssh directory is a hidden directory whose name starts with a period).


    9. On your Linux/UNIX server, inspect /etc/ssh/sshd_config to ensure RSA authentication
    and public key authentication are both allowed. If not, change "no" to "yes" or
    uncomment the lines to allow said authentication. Also, ensure that the path to
    the authorized_keys file is set to "~/.ssh/authorized_keys" and uncomment the
    line. (I found the three lines at approximately line 43 on a RedHat system and
    approximately line 29 on a Debian system). When you''re done, the lines should
    look like this:


    ```

    RSAAuthentication yes

    PubkeyAuthentication yes

    AuthorizedKeysFile %h/.ssh/authorized_keys

    ```


    10. When you use PuTTY to log on, you''ll use the username "root". PuTTY will
    prompt you for the passphrase to use your private key.


    179'
