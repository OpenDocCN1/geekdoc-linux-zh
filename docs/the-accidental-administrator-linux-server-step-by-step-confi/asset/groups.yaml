    ## Using yum to update your system


    The yum (Yellowdog Updater) utility is installed with RHEL/Fedora/CentOS for the
    management of software. It is an interactive, automated system using RPM. It allows
    you to install, update, and remove software on your computer running RHEL/Fedora/CentOS
    operating system. yum is a command-line utility.


    When you use the yum utility, you connect to various repositories for software
    installation. A repository is a prepared directory or web site containing software
    packages and index files.


    A common practice after completing the initial installation of a system is to
    run “yum update” to connect to various repositories and update all of the packages
    on your system.


    Here are some ways you can use yum:


    - yum update will update all packages on your system. The -y option will answer
    “yes” to all prompts as confirmation that you want to install or update a particular
    package. (Use with care!)

    - yum update [package name] will only update the specified package on your system.
    yum resolves all dependencies during the update process. The option “y” prevents
    yum from asking for confirmation before updating the specified package.

    - yum install [package name] will install the specified package on your system.
    yum resolves all dependencies during the installation process. The option “y”
    prevents yum from asking for confirmation before installing the specified package.

    - yum search [text string] will search for any packages matching the string in
    the description, summary, packager, and package name fields in the rpm.

    - yum deplist displays a list of all dependencies and the packages that provide
    those dependencies.


    As you can imagine, there are many other options available with yum. See the yum
    man page for details.

