    ## 第八章：Linux 网络服务\n\n> “软件就像性：免费的时候更好。” -- Linus Torvalds\n\n## 动态主机配置协议 (DHCP)\n\
    \n### 配置 DHCP\n\n在初始安装选择网络服务器时，默认不安装 DHCP。如果以后需要，你可以通过网络 yum 或本地 rpm 安装。安装后，DHCP\
