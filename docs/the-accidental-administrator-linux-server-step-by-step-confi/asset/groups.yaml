    cp: cannot create directory /cache/goomatic: Disk quota exceeded

    cp: cannot create directory /cache/alchemist: Disk quota exceeded

    cp: cannot create directory /cache/logwatch: Disk quota exceeded

    cp: cannot create directory /cache/yum: Disk quota exceeded

    ```

