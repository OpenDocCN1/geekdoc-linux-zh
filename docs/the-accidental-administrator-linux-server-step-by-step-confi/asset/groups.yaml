    Routing is used to connect two logical IP networks. A router forwards packets
    between one network and another. A router appliance can be installed or a computer
    running Linux can be configured with two or more network interfaces with IP forwarding
    enabled.


    # Configuring Linux as a Router


    - Install a second network interface (probably an Ethernet NIC) and configure
    its IP address.

