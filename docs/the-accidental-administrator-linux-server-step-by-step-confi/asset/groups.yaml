    配置与操作。在 Linux/UNIX 中，管理员账户被称为“root”（在其他操作系统中等于“admin”、“administrator”或“supervisor”）。“root”通常被称为“超级用户”（superuser），因为该账户对系统的每个区域和系统配置的每个方面都有不受限制的访问权限。


    当使用 bash shell 以 root 身份登录时，提示符是一个井号 (#)。当使用 bash shell 以普通用户身份登录时，提示符是一个美元符号
    ($)。


    Linux/UNIX 世界中的 Shell 命令通常是区分大小写的。


    你可以通过此命令查看你的默认 shell：


    ```

    #echo $SHELL

    ```


    ## Linux 配置文件 (Linux Profiles)


    Linux 配置文件有两种类型：系统级和用户特定的。系统级配置影响所有用户，而用户特定的配置只影响单个用户。通常情况下，你必须拥有 root 权限才能更改系统级配置。


    ## 用户特定配置文件


    用户特定的配置文件设置位于用户的家目录（/home/don）中，但它们通过在文件名开头加一个“.”来隐藏隐藏。配置文件的示例包括：


    - .bashrc

    - .bash profile

    - .bash_history


    还有许多其他文件。你可以使用“ls -a”查看任何目录下的隐藏文件。


    ## 系统级配置


    系统级配置设置几乎完全位于 /etc 中。这里是你可以找到配置 Apache、BIND DNS 以及 Linux 其他任何方面的文件的地方。例如，在 Debian
    中，如果你想修改 Apache 服务器的设置，你可能会修改 /etc/apache2/apache2.conf。如果你正在使用 Red Hat 产品，该文件很可能是
    /etc/httpd/conf/httpd.conf。（使用不确定性语言的原因是因为 Linux 中的一切内容都是可配置的，而且构建你 Linux 系统的人可能选择将配置文件放在其他地方。）


    ## 管理工具与技术


    ### 在终端中工作


    大多数配置为服务器的 Linux 系统都在命令行界面 (CLI) 中进行管理，许多 Linux 高级用户甚至倾向于在 CLI 中管理他们的桌面系统。尽管在许多版本的
    Linux 发行版中，可图形用户界面 (GUI) 工具已显著改进，但 CLI 持续为配置和管理 Linux 系统提供最大的权灵活性。在 CLI 中工作的另一个用处是，每个
    Linux 发行版在 CLI 中的相似性远高于 GUI 界面。为了本次工作会的目的，你将在 CLI 中完成大部分配置，这将允许你从 Debian 到其他 SuSE、Ubuntu、RedHat、Slackware
    甚至传统的 UNIX 系统进行更平滑、更简单的过渡。


    ### 思考点：桌面环境


    CentOS 5.x、Debian 4.0r5 以及许多其他 Linux 发行版的默认桌面环境是 Gnome。桌面环境提供了按钮、背景、特效和应用程序。工作会将在晚些部分介绍桌面环境，但现在请理解，不同的桌面环境与此处描述的位置相比略有不同或显著不同。


    ### 学生环境 2.1：常用 Shell 命令


    当你首次登录 Linux 系统时，你可能处于 GUI 中，也可能处于命令行 shell 中。如果你在 GUI 中，可以通过点击桌面顶部菜单中的“Applications”（应用程序）打开终端窗口（命令行
    shell），然后将鼠标悬停在“Accessories”（附件）上，并点击“Terminal”。一旦进入命令行 shell，你将被放置在家目录（/home/[username]）。你可以使用
    "cd" 命令通过目标目录的路径导航到其他目录。


    - 如果你还没有使用 root 账户，请使用 su（切换用户）命令并带有 "su" 参数切换到 root 账户和配置：

    $su

    Password: pss5678


    - #cd 更改工作目录。输入以下命令（记住 "#"）代表你的提示符：

