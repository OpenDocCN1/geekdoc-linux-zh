  - "[PAGE 99]\n\n# Automating Administration Tasks with cron\n\ncron is a UNIX tool\
    \ that allows scheduling of automated tasks. Cron commands are stored in a file\
    \ named for the user who created them in /var/spool/cron/.\n\nThe crontab command\
    \ is used to create new cron files:\n\n+   - crontab -l lists the contents of\
    \ your personal cron file\n- crontab -r removes all crontab entries\n- crontab\
    \ -e opens your default text editor for cron job creation\n- Wildcards can be\
    \ used. For example, replacing the month parameter with \"*\" would activate the\
    \ cron entry on the day/date/time specified in every month.\n\nA sample cron entry:\n\
    \n10 8 * * rm /tmp/* would delete all files in the /tmp directory at 8:10 a.m.\
    \ on the 12th of March and September.\n\n30 19 * * mon rm /tmp/* would delete\
    \ all files in the /tmp directory at 7:30 p.m. every Monday.\n\n45 22 1,15 * *\
    \ rm /tmp/* would delete all files in the /tmp directory at 10:45 p.m. every the\
    \ 1st and 15th of every month.\n\nThe command syntax is minute, hour, date, month,\
    \ day, command.\n\n# Soundthinking point: Use crontab to edit cronjobs\n\nDo not\
    \ edit cron files directly. In order for cron to work, you must use the crontab\
    \ utility to edit cron files.\n\n| Student Exercise 7.1: Using cron\nIn this exercise,\
    \ you will create crontab to empty a directory at a specified point in the future.\
    \ In the real world, you can use cron to schedule any task you can imagine such\
    \ as running a backup or compressing a database.\n1. Create a directory called\
    \ /crondemo and navigate to it:\n$su - \nPassword:p@ss5678\n#mkdir /crondemo\n\
    #cd /crondemo |"
