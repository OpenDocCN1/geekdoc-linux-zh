    ## Login and logout procedures


    Like UNIX, Linux is considered to be a secure operating system. The successful
    entry of a username and password is required to access a Linux system.


    ## Access levels


    There are two levels of access to Linux systems: regular user and super user (root)
    access. Regular user access limits a user’s ability to access system files and
    directories to modify system settings, while super user (root) access gives the
    user full control over the system. After a successful logon, the shell prompt
    indicates the current user''s level of access; in the BASH shell, a dollar sign
    ($) means that the current user has regular user access and a pound sign (#) indicates
    super user access.


    As mentioned earlier, best practice is to use the root account only when necessary
    for system administration. Smart administrators have a regular user account they
    use for normal, day-to-day functions. When they need to perform administrative
    tasks, they use the "su" (switch user) command to execute commands as root. When
    using the su command, adding a hyphen to the command (su -) also changes the profile,
    giving the user access to system configuration commands that would otherwise be
    unavailable. Note that, after invoking the su command, the user is prompted for
    the root password. (You can use the su command to change to any other user''s
    account for administrative purposes.) Use the following syntax:


    ```

    #su - [user name]

    ```


    Type "exit" to return to the previous user account.


    ## soundthinking point: Switch User


    As you starting with your newly-installed Linux system, you will log on as the
    regular user you created for security purposes. Many of the commands you will
    need to execute, however, will require "superuser" or "root" privileges.


    The switch user command allows you to change your user account and context temporarily
    without logging off. For example, suppose you need to perform some administrative
    tasks that requires root privileges. You could log off as your regular user and
    log back on as root, perform the necessary tasks, and log back on with your regular
    user account. That''s awkward and inconvenient. As an alternative, in a terminal
    window, type "su -" (the "-" tells the system to use the root user''s profile
    as well as their privileges) and enter the root password. When you are finished
    with the administrative tasks, type "exit" to return to your regular user account.


    To logout of a system in the graphical environment, click on System, then click
    on Logout. Use the exit command. To shutdown a system, use the shutdown command
    in the command line environment.


    There are a variety of options available for use with shutdown. Two commonly used
    switches include -r (reboot) and -h (halt):


    ```

    #shutdown -r now

    ```


    ```

    #shutdown -h now

    ```


    Note the use of the time option. You can also specify an absolute time in the
    format of hh:mm


    ![](img/3787df26ffed7af9a9dedb7c1fbb7672_29_0.png)


    or it can be in the format +m in which "m" is the number of minutes to wait until
    the system shuts down.


    ## When the GUI Package Updater Fails


    Sometimes graphical tools fail. When that happens, it is important to know alternatives
    that will allow you to accomplish your management objectives. In the case of the
    Software Updater, you can use a command-line tool called "yum". "yum" is covered
    in more detail later in this book, so for right now, we will simply cover how
    to use yum to update your system from the command-line.

    Using the following commands in a terminal window to update your system:


    ```

    $su -

    Password:

    #yum -y update

    ```


    The "su" command switches user to root. The hyphen "-" switches to root''s profile.
    The password is root''s password (which will not be echoed as you type). "yum"
    invokes the yum utility. "-y" bypasses confirmation of updates. "update" compares
    currently installed packages against repository packages for updated versions
    and updates all packages for which updates exist.


    ## What is Linux?


    Linux is a free Unix-type operating system originally created by Linus Torvalds
    with the assistance of developers around the world. Developed as open source software
    under the GNU General Public License, the source code for Linux is freely available
    to everyone.

    Linux is a general-purpose operating system. It can function as an end-user desktop
    operating system, a development platform for programmers, or a server.

    As a server, Linux can perform the role of Web server, mail server, database server,
    name server, directory server, file and print server, proxy server, router, or
    even as a very effective firewall.

    www.linux.org


    ## Open Source Software


    What is open source?


    "The basic idea behind open source is very simple: When programmers can read,
    redistribute, and modify the source code for a piece of software, the software
    evolves. People improve it, people adapt it, people fix bugs. This can happen
    at a speed that, if one is used to the slow pace of conventional software development
    seems astonishing."


    *Open Source Initiative (www.opensource.org)


    ## The GNU General Public License


    Under the GNU General Public License, the source code for software is freely distributed
    and available to the public.


    You have the freedom to distribute copies of free software (and charge for this
    service if you wish). You receive source code or get it if you want, that you
    can change the software or use pieces of it in new programs.


    To protect your rights, there are restrictions that forbid anyone to deny you
    these rights or to ask you to surrender the rights. These restrictions translate
    to certain responsibilities for if you distribute copies of the software, or you
    modify it. If, for example, you distribute copies of such a program, gratis or
    for a fee, you must make sure that they, too, receive source code and must show
    them the terms of the GNU Public License so they know their rights.


    ## The GNU General Public License Background


    The GNU project began in 1984 to create a UNIX-like operating system. MIT professor
    Richard Stallman published a paper “The GNU Manifesto” which discussed the need
    for software built on open source. The operating system that came out of the GNU
    project is Linux. GNU is a recursive acronym for “GNU’s not UNIX”.


    For more information, visit www.gnu.org


    ## Linux Distributions


    Linux was created by Lin Torvalds with the help of programmers around the world.
    Various organizations, both commercial and not-for-profit, package the Linux kernel
    (the core of the operating system) with various system services and software.
    Such packages are called “distributions” or “distros” for short. What’s the difference
    among distros? The differences lie in the file locations and the customized administration
    tools that are included with each distro. There are hundreds of distros, but some
    of the better known distros are listed here:


    ### CentOS (www.centos.org)


    -- CentOS is a community-supported, mainly free software operating system based
    on Red Hat Enterprise Linux. All of the Red Hat branding has been removed.

    - It exists to provide a free enterprise class computing platform and strives
    to maintain 100% binary compatibility with its upstream distribution.

    - The name CentOS stands for Community ENprise Operating System.

    - CentOS and RedHat version number usually match.


    ### Debian (www.debian.org)


    -- Completely non-commercial

    - High-quality, well-managed distribution

