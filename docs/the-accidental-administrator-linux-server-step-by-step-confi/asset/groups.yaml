    installed, by Red Hat recommends vsftpd as the most secure FTP available. In fact,
    vsftpd is an acronym for “very secure FTP”. FTP is implemented as the vsftpd daemon.
    It is installed as part of the “servers” option during initial installation.


    By default, vsftpd permits “anonymous” to login with any password. The anonymous
    user, however, can only download files from the FTP server using the “get” command.
    Anonymous user cannot upload files.


    The configuration file is /etc/vsftpd/vsftpd.conf. Unless you configure it otherwise,
    the FTP root is /var/ftp.


    You can change the FTP root for anonymous logins by adding a line to the vsftpd.conf
    file that specifies anon_root:


    ```

    anon_root=/var/ftp/anon

    ```

    Adding this to the vsftpd.conf file would change the root for anonymous logins
    to /var/ftp/anon.


    As mentioned previously, the anonymous user, by default, has only read access
    to the FTP server. You can uncomment line 27 in /etc/vsftpd/vsftpd.conf to allow
    write access. It will also be necessary to modify permissions on the FTP root
    directory to permit anonymous write access.


    Note: Anonymous write access should only be allowed on a trusted, protected network.


    Logging is done in /var/log.


    # Chapter Fourteen:

    Desktop Sharing with VNC


    > “And computers are getting smarter all the time: scientists tell us that soon
    they will be able to talk to us. (By them I mean computers: I doubt scientists
    will ever be able to talk to us.)” --Dave Barry


    # Virtual Network Computing—Sharing Remote Desktops


    Remote Administration With VNC


    VNC is a tool developed by ATT''s Cambridge Labs to allow the sharing of a desktop.
    It allows connections between disparate platforms. For example, a computer running
    UNIX or Linux can display a Microsoft Windows desktop and vice-versa. There are
    two parts to VNC: vncviewer and vncserver. vncviewer is used to connect to a system
    running vncserver. The server component is installed as part of the server options
    during the installation process. The server component can be installed either
    from the Internet by using yum or from the CentOS/Red Hat installation DVD.


    # Setting Up VNC


    ### Install the VNC package


    VNC is in the yum repositories, on the CentOS installation DVD, or it can be downloaded
    for free from www.realvnc.com or www.tightvnc.com.


    To run VNC, use the following commands:


    - vncserver <enter>

    - Enter a password and verify

    - #vncpasswd can be used later to change the password

    - A terminal will be displayed like: lisrv.domain.test:1


