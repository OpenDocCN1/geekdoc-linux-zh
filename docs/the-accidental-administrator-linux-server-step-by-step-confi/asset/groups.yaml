    configurations and operations. In Linux/UNIX, the administrator account is called
    “root” (equivalent to “admin”, “administrator”, or “supervisor” in other operating
    systems). “root” is often referred to as the “superuser” because of the account''s
    unrestricted access to every area of the system and every aspect of the system''s
    configuration.


    When logged in as root using the bash shell, the prompt is a pound sign (#). When
    logged on as a regular user using the bash shell, the prompt is a dollar sign
    ($).


    Shell commands in the Linux/UNIX world are usually case sensitive.


    You can see your default shell with this command:


    ```

    #echo $SHELL

    ```


    ## Linux Profiles


    There are two types of Linux profiles: system-wide and user-specific. System-wide
    configurations affect all users, while user-specific configurations affect only
    a single user. Normally, you must be root to change system-wide configurations.


    ## User-Specific Profiles


    User-specific profile settings are found in the user’s home directory (/home/don),
    but they’re hidden by prepending a “.” to the filename. Examples of profile files
    include:


    - .bashrc

    - .bash profile

    - .bash_history


    There are many others. You can view the hidden files in any directory by using
    “ls -a”.


    ## System-Wide Configurations


    System-wide configuration settings are almost entirely found in /etc. This is
    where you find files for configuring Apache, BIND DNS, and any other aspect of
    Linux. For example, in Debian, if you want to modify settings of your Apache server,
    you would probably modify /etc/apache2/apache2.conf. If you are working with a
    Red Hat product, the file most likely is /etc/httpd/conf/httpd.conf. (The reason
    for using tentative language is because everything is configurable in Linux and
    the person who built your Linux system might have chosen to place the configuration
    files elsewhere.)


    ## Administration Tools and Techniques


