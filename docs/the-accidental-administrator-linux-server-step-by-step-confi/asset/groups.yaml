    ## 配置和管理 Webmin


    Webmin 由多种模块组成，允许管理安装了 Webmin 的计算机的各个方面。模块中包含一个 Webmin 配置模块。


    在默认配置下，Webmin 允许不受限制的访问（需经过身份验证）。在大多数情况下，您应该通过 IP 地址限制访问，这可以在 IP 访问控制（IP Access
    Control）下完成。


    ## 使用密钥进行 SSH Root 登录


    要求：


    - PuTTY

    - PuTTYGen

    - 运行 Windows 的本地计算机

    - 运行 Linux 或 UNIX 的远程计算机


    远程文件：


    - /etc/ssh/sshd_config

    - /root/.ssh/authorized_keys


    看一眼连接互联网的服务器上的 /var/log/secure，您就能立即理解保护 root 账户的必要性。坏人会不断尝试 root 和其他用户名，试图使用
    SSH 或其他协议登录您的服务器。如果您使用简单的密码，服务器被密码破解攻击攻破只是早晚问题。


    最佳实践是禁止 root 账户进行 SSH 登录，从而消除很大一部分风险。问题是，这样做也会导致系统管理员失去很多便利性，并增加使用 WinSCP 等工具从您的
    Windows 桌面或笔记本拷贝文件到 Linux 或 UNIX 服务器的复杂度。


    一个相当简单的解决方案是使用公/私钥对进行身份验证。公钥存储在 Linux/UNIX 服务器上，私钥存储在本地 Windows 计算机上。当您从 Windows
    计算机连接到 Linux/UNIX 服务器时，使用密钥对而非密码进行验证。root 实际上禁用了密码验证，因此无论如何猜测密码都无法通过验证。


    以下是操作方法：


    1. 首先下载 PuTTY Windows 安装程序 http://the.earth.lissatham/putty/latest/x86/putty-0.60-installer.exe。在您的本地
    Windows 计算机上运行安装程序。

    2. 现在，您必须生成密钥对。您运行的 PuTTY Windows 安装程序安装了一个名为 PuTTYgen 的应用程序，可以使用它可以生成密钥对。安装程序可能将
    PuTTYgen（以及其他 PuTTY 应用）放置在开始>>所有程序>>PuTTY。

    3. 当您第一次运行 PuTTYgen 时，必须生成一个新的密钥对。在 PuTTY 窗口底部有参数选择，包括 SSH-1 (RSA)、SSH-2 RSA 和
    SSH-2 DSA。SSH-2 RSA 是默认选项，默认密钥长度为 1024 位。长密钥更安全，但需要更多的处理能力。在目前（2010 年后期），1024
    位是一个可以接受的折中，但随着计算机处理能力的不断提高，未来可能不再被接受。

    4. 点击为 Generate 的按钮生成您的公钥和私钥。（您必须将鼠标指针悬停在屏幕顶部的空白区域以产生一些随机数用于生成密钥对。在空白区域按圆形移动鼠标指针，直到进度条到达最右侧且
    PuTTY 生成了密钥。）

    5. 现在，可以将私钥保存在您的本地笔记本或桌面电脑上，并将公钥拷贝到远程 Linux/UNIX 服务器。

    6. 在 PuTTYgen 的两个字段中输入并确认短语（passphrase）以保护密钥。

    7. 点击 Save private key 按钮，并在本地硬盘上选择一个位置保存私钥。（记住通过安全地存储来保护您的私钥！）

    8. 复制公钥的乱码文本（位于 PuTTYgen 窗口顶部），并将其粘贴到服务器的 /root/.ssh/authorized_keys 中（您可能需要创建
    .ssh 目录，并且可能需要创建 authorized_keys 文件。另注意 .ssh 目录是一个以点开头的隐藏目录）。

    9. 在您的 Linux/UNIX 服务器上，检查 /etc/ssh/sshd_config 以确保 RSA 验证和公钥验证均已允许。如果不是，将 "no"
    改为 "yes" 或取消相关行的注释以允许上述验证。此外，确保 authorized_keys 文件的路径设置为 "~/.ssh/authorized_keys"
    并取消该行的注释。（我在 RedHat 系统上大约第 43 行，在 Debian 系统上大约第 29 行发现了这三行）。完成后，这些行看起来应该像这样：


    ```

    RSAAuthentication yes

    PubkeyAuthentication yes

    AuthorizedKeysFile %h/.ssh/authorized_keys

    ```


    10. 当您使用 PuTTY 登录时，将使用用户名 "root"。PuTTY 将提示您输入用于使用私钥的短语。


