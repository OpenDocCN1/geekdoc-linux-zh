    ## 附加用户管理


    删除用户：

    ```

    #userdel [username]

    ```


    删除目录：

    ```

    #userdel -r [username]

    ```


    显示用户 ID：

    ```

    #id

    ```


    查看组组成：

    ```

    #groups [username]

    ```


    ## 第四章 文件与目录管理


    ### 文件系统


    为了使设备文件系统可用，必须将其挂载到挂载点。在使用 mount 命令之前，请确保挂载点已存在。挂载点的常用位置是 /mnt（但可以放置任何地方）。将设备挂载到挂载点：

    ```bash

    mount /dev/cdrom /mnt

    ```

    使用 cd 命令进入新挂载的设备：

    ```bash

    cd /mnt/cdrom

    ```

    在弹出光驱或软盘之前，你必须从系统中卸载它们。卸载挂载点：

    ```bash

    umount /mnt/cdrom

    ```

    分区可以通过 fstab 文件自动挂载，该文件位于 /etc/fstab。


    ### 挂载点


    你可以将挂载点视为访问分区的手段。记住，在 Linux 中，一切都围绕文件系统。计算机上的第一个 SCSI 驱动器被称为 /dev/sda，第二个是 /dev/sdb，以此此类推。第一个
    IDE 驱动器被称为 /dev/hda。分区是有编号的，第一个 SCSI 驱动器的第一个分区被称为 /dev/sda1，第二个分区为 /dev/sda2 等。


    然而，你无法通过 /dev/ 文件访问分区；你必须创建挂载点，这是通过文件系统访问分区的手段。


