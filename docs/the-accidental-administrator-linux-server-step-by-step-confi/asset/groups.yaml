    | 2. In the terminal window, use the following commands to modify /etc/issue:
    |

    | Ssu - |

    | Password: p@ss5678 |

    | 3. Navigate to /etc/pam.d/, create a backup copy of login, and open /etc/pam.d/login
    in vi for editing: |

