    (/etc/passwd 是包含所有用户账户及相关信息的文件。）按下 End 键导航到文件底部，并观察类似这样的一行：user01x:500:500:User:/home/user01:/bash
    在这一行中，每个字段都由冒号分隔。第一个字段是用户的登录名，“x”表示启用了影子密码（shadow passwords），第一个 500 是 UID，第二个
    500 是用户主组的 GID，接下来的字段是注释字段，随后是用户的家目录，最后是用户的默认 shell。


    13. 你可以使用以下命令查看你创建的新组：

