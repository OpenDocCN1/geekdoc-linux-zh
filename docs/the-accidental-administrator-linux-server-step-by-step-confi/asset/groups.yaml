    # GUI vs. CLI


    Since the first graphical user interface (GUI) was created in the Xerox Palo Alto
    Research Center in the early 1970s, those of us who work in information systems
    and technology have debated its merits and liabilities.


    The real issue is not whether to use a GUI or a command-line interface (CLI);
    it is about choosing a tool that works for you and helps you work most effectively.
    For most of us, that means that sometimes we''ll use a GUI and sometimes we''ll
    use a CLI.


    Once had a student in a Linux workshop whose said nickname was “No GUI Louie”.
    While I remember Louie as a very knowledgeable and capable IT pro, I also had
    students who avoid the CLI because of its complexity without considering the power
    it affords an administrator. I think we limit ourselves when we arbitrarily limit
    the tools at disposal by eliminating GUI or CLI tools. In my own work, I find
    that I use both the CLI and GUI, depending on the task at hand and my personal
    familiarity with the tools in question. (Okay, I use the command-line most often,
    but I''m very grateful for the GUI when performing unfamiliar tasks!)


    | GUI Pros | Farther away from the “road” |

    |---|---|

    | Fewer typing errors | Less control |

    | Less minutia | Java and other issues might make GUI unavailable |

    | Safer (harder to make mistakes) | Some of the names and labels it creates are
    strange |

    | Can help teach you CLI commands | Some people are more familiar with the CLI
    |


    # Linux Directories


    Everything in Linux/UNIX is on the file system. The file system is comprised of
    various directories (Windows call them “folders”). The root directory (“/) is
    at the base of the file system. Some directories may be on different partitions
    or drives, but they are still a part of the file system. Some directories may
    even be on completely different computers, perhaps running a completely different
    operating system, but they are still part of the file system. What follows is
    a list of some of the more commonly found directories in the Linux file system
    (all directories are not included on all systems):


    +   * is the root directory

    "* /bin/ and /usr/bin/ store user commands.

    "* /boot/ contains files used for system startup including the kernel.

    "* /dev/ contains device files"'
