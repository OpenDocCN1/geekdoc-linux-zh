    4. cd into /common and create some files:

    `#touch file1 file2 file3<enter>`


    5. Use vim or the text editor of your choice to open the /etc/exports file (it
    is an empty file, but it should already be in /etc) with a text editor and add
    the line:

    `/common 192.168.0.0/24(ro,sync)`

    (Note: There are no spaces in the line except between "/common" and the IP address.)


    6. Save the file (by typing :wq in vi).


    7. Set the network access rights by modifying /etc/hosts.allow. Add the following
    line:

    `portmap: 192.168.0.`

    (Note the trailing period after the “0”).


    8. Deny all networks not explicitly permitted in /etc/hosts.allow by modifying
    /etc/hosts.deny with the following line:

    `portmap: ALL`


    NFS is dependent upon remote procedure calls (RPC) for proper operation. In order
    to map RPC requests to the correct services, the portmap service is required.
    portmap is notified by RPC processes as they start. They identify the port number
    they are monitoring and which RPC program numbers they’re expecting to service.
    The server’s portmap service is contacted by the client system with a specific
    RPC program number. The client is then redirected by portmap to the proper port
    number to communicate with its intended service.


    The portmap service can also be used with hosts access files (/etc/hosts.allow
    and /etc/hosts.deny) to control which remote systems (not users) are permitted
    to use RPC-based services on that particular server. Such control is based on
    IP address and is, therefore, subject to IP address spoofing attacks.


    9. Enable the export immediately with the following command:

    `#exportfs -v`


    ## Student Exercise 9.1.3: Start the NFS Server


    1. Start nfs on a Red Hat-based system with the following commands:

    ```bash

    $su -

    Password: p@ss5678

    #service nfs start

    ```


    2. Notice that the service nfs start command started four components:

    - NFS services

    - NFS quotas

    - NFS daemon

    - NFS mountd


    3. Check the status of nfs with the following command:

    ```bash

    #service nfs status

    ```


    4. Notice that the service nfs status command shows three daemons (services) running:

    - rpc.mountd

    - nfsd

    - rpc.quotad


    5. Check your exports with the showmount command:

    ```bash

    #showmount -e

    ```


    6. Check the exports of other systems:

    ```bash

    #showmount -e [hostname or IP address]

    ```


    ## Student Exercise 9.1.4: Mounting nfs Exports


    A file system is the process used to make data on a file system (such as a remote
    nfs file system) accessible on the local computer. Before you can mount an nfs
    export to a mount point, you must create the mount point in your computer''s Linux
    file system. In this exercise, you will create mount points for the other classroom
    computers.


    For example, #mkdir /mnt/comp01 creates the new directory comp01 as a subdirectory
    of /mnt. You can then use /mnt/comp01 as a mount point for comp01''s nfs export.


    1. Create mount points for each of the other lab computers with the mkdir command
    (it is not necessary to create mount points for computers that are not present
    in the lab):


    ```bash

    $su -

    Password: p@ss5678

    #cd /mnt

    #mkdir comp01 comp02 comp03 comp04 comp05 comp06 comp07 comp08

    ```


    2. Use the mount command to associate (mount) a remote filesystem to one of the
    mount points you just created:


    ```bash

    #mount [computer name or IP address:/dir] [mountpoint]

    ```


    For example:


    ```

    #mount 192.168.0.43:/common /mnt/comp01

    ```


    (Note: The IP address (192.168.0.43) is a sample address. You should use the address
    of the other computer to which you wish to connect.)


    ## Student Exercise 9.1.5: Configuring nfs to start on boot


    The chkconfig utility updates and queries runlevel information for system services.


    1. Use the chkconfig command to start NFS upon boot with the following command:

    ```bash

    #chkconfig --levels 345 nfs on

    ```


    2. The above command will start NFS automatically upon boot in run levels 3, 4,
    and 5. You can also use chkconfig to display information about what services start
    at the various runlevels. Execute the following command:


    ```bash

    #chkconfig -list

    ```


    ## Soundthinking: Unmounting remote file systems


    It is important to unmount remote file systems when you are finished using them
    at the end of this exercise. Failure to do so can potentially result in a corrupted
    file system on your computer. You can use the `mount` command to unmount file
    systems. Use `man umount` for more information.


    ## Student Exercise 9.2: Understanding the nfs Daemons


    You will now analyze the “service” utility and the nfs option to understand how
    “service” starts and stops daemons. Once you understand the process, you will
    be able to start and stop daemons.


    1. Use the “service” utility to find:

    `service nfs status`


    2. Notice the location of the service script:

    `ls /etc/init.d/nfs`


    3. Examine the script to see how it starts the daemons:

    `more /etc/init.d/nfs`


    4. Use the service command to stop the daemon:

    `service nfs stop`


    5. Check the status again to ensure it has stopped:

    `service nfs status`


    6. Start the service again:

    `service nfs start`


    7. Check the status one last time:

    `service nfs status`


    8. Use the chkconfig utility to ensure the service starts on boot:

    `chkconfig --levels 345 nfs on`


    9. Verify the service is enabled for boot:

    `chkconfig -list`


    10. Congratulations, you have learned how to manage the NFS service using the
    service utility!

