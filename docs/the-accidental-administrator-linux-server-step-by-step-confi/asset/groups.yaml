    # Using SAMBA


    # Integrating Linux with Windows-based Computers


    Server Message Block (SMB) was the file and printer sharing protocol used on computers
    running earlier operating systems. It has been upgraded to the Common Internet
    File Sharing (CIFS) protocol on recent Windows systems. For either SMB or CIFS,
    Samba allows Linux/Unix computers to interact with computers running the Windows
    operating system.


    Using Samba, you can:


    +   * Configure Unix/Linux systems to share files and printers with Microsoft
    clients

    * Configure a Unix/Linux server as a Windows domain controller

    * Allow Unix/Linux clients to access SMB/CIFS shares on Microsoft servers


    # Required Samba Daemons


    smbd is the server daemon that provides filesharing and printing services to Windows
    clients. It provides payspace and printer services to clients using the SMB (or
    CIFS) protocol. It can serve clients such as Windows, DOS, OS/2, Linux/Unix, and
    Macintosh.


    You can check version of Samba is running with this command:


    ```

    #smbd -V (Note that the “V” is upper-case).

    ```


    The other daemon required for Samba is nmbd which provides NetBIOS naming services.
    It is a server that understands and relates to NetBIOS over IP name service requests
    such as those produced by SMB/CIFS clients including Windows 95/98/ME, Windows
    NT, Windows 2000, and LanManager. It also participates in the browsing protocols
    which make up the Windows "Network Neighborhood" and “My Network Places” view.


    The nmbd daemon is not strictly required, however it allows NetBIOS name lookups
    which can simplify shared resource access.


    # Samba configuration files


    There are three main files used to configure Samba:


    +   * smb.conf - the main Samba configuration file

    * Imhosts - NetBIOS hosts file

    * smbpasswd - SMB password file


    # The smb.conf file


    The /etc/samba/smb.conf is divided into two main sections:


    +   * “Global Settings” defines properties that influence all shares

    * “Share Definitions” defines the shares'
  - '[PAGE 120]


    # The lmhosts file


    This file maps NetBIOS names to IP addresses. It is similar to the /etc/hosts
    file, except that the component for the hostname must comply with the NetBIOS
    naming format. It contains one line for each NetBIOS name. Each line has two fields
    separated by a space. Entries beginning with a pound sign (#) are ignored.


    The IP address is expressed in the common dotted decimal format. The NetBIOS name
    is a maximum of 15 characters.


    The lmhosts file is located in /etc/samba/


    # The smbpasswdwd file


    This is the encrypted password file for Samba containing the username, Unix (Linux)
    ID, and the SMB hashed password for the user. The format of the smbpasswd file
    is similar to /etc/passwd. It is an ASCII text file with one line for each user.
    Fields within each line are separated by a colon. Entries beginning with a pound
    sign (#) are ignored.


    The format of the smbpasswd file is as follows:


    Name LanMan password hash


    The name is the username which must already exist in /etc/passwd. In other words,
    it must be an existing Linux user on the system.


    The UID is the UNIX uid which must match the uid field for the same user entry
    in /etc/passwd. If it does not match, the smbpasswdwd entry for that user will
    be ignored.


    # Samba Authentication


    There are four levels of SAMBA authentication:


    +   - Share Level- Permits access similar to win9x

    - User Level- Authentication is required (default method)

    - Server Level- Similar to User Level but authentication is passed to another
    SMB password server

    - Domain Level-Samba server acts as a member of a windows domain


    # Using Samba as a Domain Controller


    A Linux server running Samba can perform most of the functions of a Windows Domain
    Controller including domain authentication and logons, plus logon scripts, roaming
    profiles, and system policies.'
