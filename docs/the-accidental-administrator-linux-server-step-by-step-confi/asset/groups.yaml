    # Linux Root Password Recovery


    Sometimes, it is necessary to perform password recovery procedures on a system
    due to lost passwords, disgruntled former administrators, and security breaches.
    The vast majority of systems require physical access to the system in order to
    perform password recovery procedures. Typically, password recovery involves restarting
    a system, interrupting the boot process, and going into a repair mode. On Linux
    and Unix systems, the repair mode is known as runlevel 1.


    | Student Exercise 16.8: Linux Root Password Recovery |

    | :--- |

    | When your boot loader is GRUB

    | CentOS uses the GRUB (Grand Unified Boot Loader) boot loader. When you do not
    know the root password and need to gain access to a system, you can use the following
    procedure: |


    1. Boot your system and, when you see the first GRUB screen, quickly press “e”
    to edit.

    2. Next, use your up and down arrow keys to select the desired version of the
    kernel and again enter "e" for edit.

    3. A list of items will be displayed in the configuration file for the title you
    have chosen. Select the line that starts with the word kernel and again enter
    "e" to edit the line.

    4. At the end of the line type a space, type the word "single" and press the <enter>
    key.

    5. When you return to the GRUB screen, type "b" to boot into single-user mode.

    6. Single-user mode automatically boots the system as "root", but doesn''t require
    a password. You can use the "passwd" command to reset your root password to a
    known value.

    7. Reboot your system.

    8. Your GRUB configuration file should automatically be reset and you can start
    using your new password.


    # When your boot loader is LILO


    Many Linux systems today use the GRUB boot loader, but some distributions use
    LILO (Linux Loader). If you need to reset the root password on a system using
    LILO, you can use this procedure.


    At the LILO boot screen, enter CTRL+X to get a text mode boot prompt. Enter "linux
    single" at the prompt and press enter. The system will boot into runlevel one
    (single user mode) as root. You can then use the "passwd" command to change the
    root password and reboot your system to operate normally.


