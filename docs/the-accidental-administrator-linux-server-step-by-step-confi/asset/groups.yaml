    Webmin is a web-based administration tool that simplifies management of Linux
    and UNIX systems by providing a graphical management interface for common tasks
    including Apache, BIND, DHCP, NFS, and others.


    # Installing Webmin via yum


    To install and update Webmin via yum, you create the /etc/yum.repos.d/webmin.repo
    file containing. Use vi to create a blank file /etc/yum.repos.d/webmin.repo and
