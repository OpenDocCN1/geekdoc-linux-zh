    it." --Mark Twain


    # Printing with CUPS


    Printing from a computer running Linux is no longer the ordeal that it used to
    be. The Common Unix Printing System (CUPS) is the new printing subsystem that
    runs on all versions of *NIX. The GPL version of CUPS is included with most Linux
    distros, but a commercial version of CUPS is also available that offers several
    enhancements over the GPL version including support and a greater selection of
    printer drivers.


    CUPS printer configuration is handled through a web interface or command line.
    CUPS printer configuration is handled through a web interface or command line.


    CUPS can be configured either through the command-line or a browser. The lpstat
    command offers information about CUPS.


    > Student Exercise 15.1: Configuring CUPS

    In the following exercise, you will install a standalone printer on Linux.

    1. Start by ensuring that CUPS is running:

    $lpstat -t

    If CUPS is running, you will see a message saying “scheduler is running” along
    with some other information. If it is not, you will see a message saying it is
    unable to connect to the server. In that case, you''ll need to start it with the
    following command: /etc/init.d/cups start (alternatively, on Red Hat systems,
    you could use the command service start).

    2. In a GUI, click on Applications, then mouse over Internet, and click on Firefox
    Browser. In the address bar, enter the following URL: http://localhost:631

    3. In the menu bar in the Welcome section, click “Add Printer”.

    4. If you are prompted for a username and password, enter “root” and “p@ss678”.

    5. You must provide three values:

    - Name: Choose something simple with no spaces. Give this consideration because
    it is difficult to change it later.

    - Location: Optional

    - Description: Optional

    6. Click Continue.

    7. Next, you are prompted for the device. The device is how your printer is connected
    to your computer. Common devices are LPT1 or USB ports. For the purpose of this
    exercise, choose “hp no_device_found” and click Continue.

    8. Next, choose the model of printer. Choose HP and click Continue.

    9. Now, choose the model of printer: Choose HP LaserJet 5P Fomatic/ljet4 (recommended)
    and click “Add Printer”.

    10. Enter the username root and the password rootss8 and click OK.

    11. You will receive confirmation that your printer has been successfully added.


    The printer driver used in the above example is an HP LaserJet 5P driver. The
    driver you need is most likely included, but if not additional drivers can be
    found at Fomatic and Gimp-Print (both mentioned earlier).


    An additional source of CUPS drivers is through the commercial version of CUPS,
    available at www.easysw.com (Easy Software Products).

