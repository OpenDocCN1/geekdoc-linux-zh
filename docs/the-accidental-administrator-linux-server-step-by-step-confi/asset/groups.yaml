    作为文本配置文件的替代方案，RHEL/Fedora/CentOS 提供了一个用于配置网卡的 GUI 工具。在 GUI 内部，点击 Desktop（桌面）>>System
    Settings（系统设置）>>Network（网络）打开网络配置工具。在 CLI 中，输入 “system-config-network” 打开它。如果
    X 正在运行，将打开工具的 GUI 版本。如果 X 未运行，将打开基于的工具。


    ## 使用 ifconfig


    - 单输入 ifconfig 将显示网卡正在工作并显示有关其配置的各种信息，包括 IP 地址。

    - ifconfig eth0 10.20.30.1 netmask 255.240.0.0 将 IP 地址 10.20.30.1 分配给第一个网卡（以这种方式分配的地址不是持久的。换句话说，地址在重启后将恢复原始地址）。

    - ifconfig eth0:0 10.20.30.1 netmask 255.0.0.0 将为第一个网卡分配第二个 IP 地址 10.20.30.1。此过程被称为
    IP 别名 (IP aliasing)。

    - ifconfig eth1 10.20.30.1 netmask 255.0.0.0 将为第二个网卡分配 IP 地址 10.20.30.1。

    - ifdown eth[x] 禁用指定的网卡。

    - ifup eth[x] 启用指定的网卡。


    ### /etc/resolv.conf


    尽管它可能与 DNS 关联密切，但 /etc/resolv.conf 文件也值得检查。/etc/resolv.conf 包含多个不同的配置指令，包括 nameserver（名称服务器）、domain（域）和
    search（搜索）。还有其他指令，但我们将关注这三个。


    nameserver 指令是应查询的名称服务器的点点表示法 IP 地址。你可以指定最多三个名称。


    domain 指令是本地域名。如果没有指定，该值将根据本地主机名确定，使用第一个 “.” 之后的内容。如果本地主机名没有域名部分，则假设为根域名。


    ```

    ; generated by /sbin/dhclient-script

    search soundtraining.local

    nameserver 192.168.16.2

    /etc/resolv.conf (END)

    ```


    search 指令指定主机名查找的搜索列表。搜索列表通常根据本地域名确定。默认情况下，它只包含本地域名。根据 resolv.conf 的帮助页：

    “你可以通过在 search 关键字后列出所需的搜索路径来更改默认行为，用空格或制表符分隔名称。大多数解析查询将尝试使用搜索路径的每个组件，直到找到匹配项。如果列出的搜索服务器不是本地的，此过程可能会很慢并产生大量的网络流量。如果所有域名都没有可用服务器，查询将超时。搜索列表目前限制为六个域名，总共
    256 个字符。” 注意屏幕截图中，resolv.conf 文件是如何由 /sbin/dhclient-script 自动配置的，其值由作者办公室网络中的
