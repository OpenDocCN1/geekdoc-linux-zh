    # Monitoring and Controlling the System


    ### Processes Reporting with ps

    Use the "ps" command to check the status of processes on your system


    - Which processes are running

    - Whether a process has completed

    - Whether a process is hung or having some difficulty

    - How long a process has run

    - The resources a process is using

    - The PID (process ID number) needed before you can kill a process


    # How to use the "ps" command:


    ```

    #ps -aux

    ```


    - "a" – show all processes

    - "u" – show the users running the process

    - "x" – show process without a controlling terminal


    # Using the Kill Command


    The kill command will allow you to terminate a process


    - #kill pid :(SIGTerm)#15

    - #kill -9 pid :(SIGKill)

    - #kill -HUP pid :(SIGHup)#1

    - #kill cat /var/file.pid


    # Performance Monitoring and Troubleshooting


    # Monitoring the System


    ### Using top


    The "top" utility monitors processor activity in real time, showing a listing
    of the most CPU-intensive tasks on a system. "ps" does the same thing in a snapshot.


    ### Using free


    "free" displays memory usage.


    # Using uptime


    “uptime” displays the current time, total time the system has been running, the
    number of currently logged on users, and the system load averages for the past
    one, five, and 15 minutes.


    # Using xload


    “xload” shows a periodically updating histogram of average system load.


    # The /proc directory


    /proc directory contains files and subdirectories that provide information about
    the computer''s resources and how they''re allocated.


    Use these commands to view the contents of the /proc directory:


    - /cat /proc/meminfo has information about the computer''s memory, including used
    memory, free memory, and swap file size.

    - /cat /proc/cpuinfo will display information about the computer''s CPU including
    speed, cache, and model.

    - /cat /proc/partitions shows information about the partitions in use by the system.

    - /cat /proc/swaps displays information about the swap file or the swap partition.


    # Understanding and using syslog


    syslog is the Linux logging daemon. As with nearly everything in Linux, it is
    highly configurable. syslog can track anything you wish on your Linux system from
    kernel messages to logins to mail usage. You can configure syslog by modifying
    /etc/syslog.conf on most Linux systems. If you do not find syslog.conf under /etc,
    try “whereis syslog.conf” to locate it.


    syslog.conf controls the type of messages that are logged, the level of logging,
    and what messages are stored. syslog is usually extensively commented and fairly
    easy to understand. The format of syslog.conf is divided into two parts: selectors
    and actions. Selectors is also divided into two parts: facility and level and
    they are separated by a period. Selectors and actions are separated by a tab:


    ```

    facility.level action

    ```


    Facility is the source of the logging messages, level is the amount of logging,
    and action is where to send the messages. For example:


    ```

    mail.info /var/log/maillog

    ```


    syslog to log messages concerning using a level of “info” to /var/log/maillog.
    The available levels, in order of decreasing severity, are emerg, alert, crit,
    err, warning, notice, info, and debug. (debug syslog provides the greatest amount
    of information; emerg provides the least.) You can also use wildcards in syslog.conf.
    For example:


    ```

    * .emerg /dev/console

    ```


    sends all messages of emerg level straight to the console. Another example:


    ```

    kern.* /dev/console

    ```


    sends all kernel messages to the console. Similarly, this example:


    ```

    kern.* *

    ```


    sends emergency level messages to all users. For more information, read the man
    page for syslog.conf.


    # #man syslog.conf


    # Viewing System Logs


    You can view system logs by navigating to /var/log and viewing the file “messages”.
    Each line of the log can be broken down into five parts:


    - The date and time the message was received

    - The name of the computer that generated the message

    - The service or program associated with the message

    - The PID of the program or service

    - The message itself


    It is often helpful to use a grep filter to limit the number of log messages viewed.
    For example, if you are having problems with secure shell, you might start your
    troubleshooting by using a command similar to this:


    ```

    #less /var/log/messages | grep ssh

    ```


    # Using “netstat”


    The netstat family of commands offers detailed information about network conditions.
    Use netstat with various switches:


    - netstat -r displays the routing table

    - netstat -a displays all connections and listening ports


