  - "[PAGE 103]\n\n# Using Dynamic Host Configuration Protocol (DHCP)\n\n# Configuring\
    \ DHCP\n\nDHCP is not installed by default when you choose network servers in\
    \ the initial installation. If it is necessary to install it, later you can either\
    \ yum on the Internet or rpm locally.\n\nOnce installed, DHCP uses the /etc/dhcpd.conf\
    \ file to retrieve its configuration information.\n\nAs of this writing, DHCP\
    \ uses two DNS update schemes: the ad-hoc DNS update mode and the interim DHCP-DNS\
    \ interaction draft update mode. The recommended method is DHCP-DNS interaction\
    \ draft update mode, which is implemented by placing this line at the op of the\
    \ configuration file:\n\n```\nddns-update-style interim;\n```\n\nWithin the dhcpd.conf\
    \ file are two types of statements: parameters and declarations:\n\nParameters\
    \ state whether a task is to be performed and how tasks are to be performed, and\
    \ what network configuration options are to be sent to the client.\n\nAny parameters\
    \ declared before braces ({}) ) are global parameters and apply to all following\
    \ sections.\n\nDeclarations describe the network topology and the clients. Declarations\
    \ also provide client addresses and apply groups of parameters to groups of declarations.\n\
    \nA subnet declaration must be included for each subnet in your network. The DHCP\
    \ server will fail to start if this step is omitted.\n\nWhat follows is a sample\
    \ dhcpd.conf file:\n\n```\nddns-update-style interim;\nsubnet 192.168.0.0 netmask\
    \ 255.255.255.0 :\n  option routers 192.168.0.1;\n  option subnet-mask 255.255.255.0;\n\
    \  option domain-name \"class.local\";\n  option domain-name-servers 192.168.0.1;\n\
    \  option time-offset -1800; # Eastern Standard Time\n  range 192.168.0.50 192.168.0.99;\n\
    \nhost xp1 {\n  hardware ethernet 00:0c:29:ba:08:ae;\n  fixed-address 192.168.0.61;\n\
    ```\n\nFigure 9 Understanding /etc/dhcpd.conf"
- md: "\nIn the example configuration:\n\n- The dynamic DNS update style is “interim”.\n\
    - The parameters will be assigned to DHCP clients on the 192.168.0.0 subnet.\n\
    - The default gateway is at 192.168.0.1.\n- The subnet mask is 255.255.255.0 (/24).\n\
    - The domain name is class.local (note the use of quotation marks surrounding\
    \ the domain name).\n- The name server is at 192.168.0.1.\n- The time offset is\
    \ -18000 seconds from clients. GMT.\n- The DHCP pool of available IP addresses\
    \ for assignment is 192.168.0.50 through 192.168.0.99.\n- When host XP1 with a\
    \ MAC address of 00:0c:29:ba:08ae comes online and sends a DHCPREQUEST packet,\
    \ it will be assigned the IP address of 192.168.0.61.\n\n## Viewing DHCP leases\n\
    \nDHCP lease information is stored in /var/lib/dhcp/dhcpd.leases. A separate file\
    \ called /var/lib/dhcp/dhcpd.leases~ is created at regular intervals as a backup\
    \ to dhcpd.leases.\n\n## Domain Name System (DNS) and BIND\n\nDNS resolves host\
    \ names to IP addresses. Think of DNS as being similar to the white pages of a\
    \ telephone book. The white pages map names to telephone numbers such as Pat Smith—(206)\
    \ 555-1234. DNS maps hostnames to IP addresses such as www.redhat.com—66.187.232.56.\
    \ In Linux, DNS runs as the “named” daemon. It is most often implemented with\
    \ the BIND (Berkeley Internet Name Domain) software.\n\nBIND is usually included\
    \ in the various Linux distributions, including RedHat, CentOS, and Fedora. The\
    \ most current version can be downloaded from ISC (Internet Systems Consortium)\
    \ at www.isc.org.\n\n## The Resolver\n\nThe client requesting name resolution\
    \ is called the resolver. Resolvers send queries to the name server which answers\
    \ the queries that come from the resolver. The resolver can be configured from\
    \ the /etc/resolv.conf file. The /etc/resolv.conf file contains the IP address\
    \ of the nameserver for the domain.\n\n## DNS Configuration Files\n\nThe main\
    \ configuration file for BIND is /etc/named.conf. It defines the basic parameters\
    \ and points to the sources of domain database information.\n\nThe default zone\
    \ directory is /var/named. A file containing the root DNS server information for\
    \ the Internet (named.ca) is located in /var/named.\n\n## Primary, Secondary,\
    \ and Caching Zones\n\nDNS primary zones get their zone information from the zone\
    \ files in /var/named. DNS configuration changes are made on the server hosting\
    \ the primary zone.\n\nDNS secondary zones get their zone information by performing\
    \ a zone transfer from the server hosting the primary zone.\n\nA DNS caching zone\
    \ does no lookups, but holds information from other lookups to speed query response\
    \ times.\n\n## DNS Tools\n\n### Using host\n\n“host” is a simple utility for performing\
    \ DNS lookups.\n\nUsage:\n\n```\n# host -1 [domain name] lists all hosts in a\
    \ domain\n```\n\n### Using dig\n\n“dig” is the domain information groper. It is\
    \ used to query DNS servers for information concerning hostnames and servers.\
    \ You may be familiar with “nslookup”, an older utility that does much the same\
    \ thing. “dig” uses a clearer, easier to understand command structure and is generally\
    \ more stable than “nslookup”, so it is the recommended tool for querying name\
    \ servers.\n\n### Using dig\n\n```\n# dig [server to query] [name to be looked\
    \ up] [type of query (if not specified, dig will perform a lookup for an RR)]\n\
    ```\n\n### Using nslookup\n\nnslookup emulates a resolver in making queries. It\
    \ queries only one name server at a time. It does zone transfers just like a name\
    \ server.\n\nUse noninteractive when looking up just one record. Use interactive\
    \ when looking up multiple records.\n\n```\n#nslookup (when used with no parameters\
    \ starts interactive mode)\n```\n\n```\n#nslookup [hostname.domain] starts non-interactive\
    \ mode\n```\n\nInteractive mode:\n\n```\n#nslookup\n```\n\n```\n>set type=[type\
    \ of record] to look up\n>[domain name]\n\nType \"exit\" or \"ctrl+c\" to exit\n\
    \n## DNS RFCs\n\n- RFC 1034 covers domain name facilities and concepts\n- RFC\
    \ 1035 explains the technical workings of DNS\n- RFC 1591 provides a general description\
    \ of DNS\n\nStudent Exercise 8.1: Building a Caching Name Server\nIn this exercise,\
    \ you will install and configure a simple caching name server.\n1. Use rpm -qa\
    \ | grep bind and rpm -qa | grep caching to determine if the following packages\
    \ are installed:\n   - bind\n   - bind-utils\n   - bind-libs\n   - bind-chroot\n\
    \   - caching-nameserver\n2. If they are not already installed, use the following\
    \ command to install them:\n#yum install [package name]\nAlternatively, if you\
    \ do not have Internet access, you can install them from the installation DVD\
    \ after inserting and mounting the DVD:\n#rpm -ivh [package name].rpm\n3. Open\
    \ the file /var/named/chroot/etc/named.caching-nameserver.conf and add the following\
    \ lines to the options section (be very careful of syntax, especially semi-colons):\n\
    forwarders { 192.168.0.1; }\nforward only;\n4. Save named.caching-nameserver.conf\
    \ (ESC, :wq) and assign 644 permissions with the following command:\n#chmod 644\
    \ /var/named/chroot/etc/named.caching-nameserver.conf\n5. Check the syntax with\
    \ the following command:\n# named-checkconf /var/named/chroot/etc/named.caching-nameserver.conf\n\
    (If you do not get a response, the configuration is fine.)\n\n6. Configure the\
    \ local resolver to point to itself for name resolution. Make the following change\
    \ to /etc/resolv.conf:\nnameserver 127.0.0.1\n\n7. The DHCP client software will\
    \ overwrite /etc/resolv.conf with nameserver information from the DHCP server.\
    \ You can prevent this by making the following change to your network card configuration\
    \ script(s) (/etc/sysconfig/network-scripts/ifcfg-eth0 (replace eth0 with your\
    \ network interface if different):\nPEERDNS=no\n\n8. Start the nameserver as root\
    \ and configure it in runlevels 3 and 5:\n$su -\nPassword:p@ss5678\n#service named\
    \ named start\n#chkconfig named on 35\n\n9. Test your nameserver using the dig\
    \ utility to query soundtraining.class:\n#dig soundtraining.class\n;; Query time:\
    \ 10 msec\n;; SERVER: 127.0.0.1#53(127.0.0.1)\n\n10. From the previous dig query,\
    \ you can see it took 10 msec to receive the name queries. Now test the caching\
    \ ability of your nameserver by running dig again on the soundtraining class domain:\n\
    #dig soundtraining.class\n;; Query time: 1 msec\n;; SERVER: 127.0.0.1#53(127.0.0.1)\n\
    \n## Miscellaneous DNS Tools\n\nDNS entries are cached on client computers using\
    \ nsc (name server caching daemon). You can flush locally cached entries with\
    \ the following command:\n#service nsc restart\n\nIf you are running named, you\
    \ can view the cache using the rndc tool (remote name control) with the dumpdb\
    \ option:\n#rndc dumpdb\n\nThe above command will write the contents of the cache\
    \ to /var/named/chroot/var/named/data/cache.db or whatever file is specified in\
    \ /etc/named.conf.\n\nOn computers running operating systems other than Red Hat,\
    \ the rndc utility is useful for many aspects. To see its myriad options, enter\
    \ rndc by itself at a command prompt.\n\nLearning more about BIND DNS\n\nTo gain\
    \ a detailed understanding of BIND including the installation and management of\
    \ primary and secondary DNS servers, consider attending soundtraining.net’s BIND\
    \ training-101.\n\n## DNS Websites\n\n- www.isc.org\n- www.dnsstuff.com\n\n##\
    \ Chapter Nine: Integrating Linux with Other Systems\n\n> \"A computer lets you\
    \ make more mistakes faster than any invention in human history - with the possible\
    \ exceptions of handguns and tequila.\"\n-- Mitchcliffe\n\n## NFS (Network File\
    \ System)\nIntegrating Linux with Unix-based Systems\n\n- Allows you to share\
    \ files between Linux systems\n- Allows you to share files between Linux and Unix\
    \ systems\n- NFS is the Unix of sharing files and applications\n\nFor extensive\
    \ information about NFS including tuning and troubleshooting, visit http://nfs.sourceforge.net.\n\
    \n### Student Exercise 9.1: Configuring an NFS Server\n\nIn this exercise, you\
    \ will create a directory to share with other users, edit /etc/exports to share\
    \ the directory, and grant network permissions by subnet to access the exported\
    \ (shared) directory.\n\n#### Student Exercise 9.1.1: Confirm that NFS is Installed\n\
    \nBegin by ensuring that NFS is installed. Use this command:\n\n```\n#rpm -qa\
    \ | grep nfs\n```\nYou should see two or three packages related to NFS such as\
    \ nfs-utils-lib, system-config-nfs, and nfs-utils. If you don't see any NFS packages,\
    \ use the yum utility to install the three packages:\n\n```\n#yum install nfs-utils\n\
    #yum install system-config-nfs\n```\n\n#### Student Exercise 9.1.2: Create a NFS\
    \ Export\n\nIn this exercise, you will create a directory to be exported (shared)\
    \ and populate it with three test files.\n\n1. Make a directory off of \"/\" called\
    \ \"common\":\n```bash\n$ss -\nPassword:p@ss5678\n#mkdir /common <enter>\n```\n\
    \n2. Set permissions for common:\n3. #chmod 777 /common <enter>\n"
  mdcn: "\n\n在示例配置中：\n\n- 动态 DNS 更新样式为“interim”（中间的）。\n- 参数将分配给 192.168.0.0 子网上的 DHCP\
    \ 客户端。\n- 默认网关位于 192.168.0.1。\n- 子网掩码为 255.255.255.0 (/24)。\n- 域名为 class.local（注意在域名外围使用了引号）。\n\
    - 域名服务器服务器位于 192.168.0.1。\n- 客户端相对于 GMT 时间偏移为 -18000 秒。\n- 用于分配的可用 IP 地址 DHCP\
    \ 池为 192.168.0.50 到 192.168.0.99。\n- 当 MAC 地址为 00:0c:29:ba:08ae 的主机 XP1 上线并发送\
    \ DHCPREQUEST 数据包时，它将获得 IP 地址 192.168.0.61。\n\n## 查看 DHCP 租约\n\nDHCP 租约信息存储在 `/var/lib/dhcp/dhcpd.leases\
    \ 中。系统会定期创建一个名为 `/var/lib/dhcp/dhcpd.leases~` 的独立文件，作为 dhcpd.leases 的备份。\n\n##\
    \ 域名系统 (DNS) 和 BIND\n\nDNS 将主机名解析为 IP 地址。可以将 DNS 想象成电话簿的白页。白页将名称映射到电话号码，例如 Pat\
    \ Smith—(206) 555-1234。DNS 将主机名映射到 IP 地址，例如 www.redhat.com—66.187.232.56。在 Linux\
    \ 中，DNS 作为“named”守护进程运行。它通常使用 BIND（伯基利互联网域名）软件实现。\n\nBIND 通常包含在各种 Linux 发行版中，包括\
    \ RedHat、CentOS 和 Fedora。最新版本可以从 ISC（互联网系统协会）网站 www.isc.org 下载。\n\n## 解析器\n\n\
    请求名称解析的客户端称为解析器（resolver）。解析器向域名服务器发送查询，由域名服务器回答来自解析器的查询。解析器可以通过 `/etc/resolv.conf`\
    \ 文件进行配置。`/etc/resolv.conf` 文件包含该域名的域名服务器 IP 地址。\n\n## DNS 配置文件\n\nBIND 的主配置文件是\
    \ `/etc/named.conf`。它定义了基本参数并指向域名数据库信息的来源。\n\n默认区域目录为 `/var/named`。包含互联网根 DNS\
    \ 服务器信息（named.ca）的文件位于 `/var/named` 中。\n\n## 主区域、二级区域和缓存区域\n\nDNS 主区域从 `/var/named`\
    \ 中的区域文件中获取其区域信息。DNS 配置的更改在托管主区域的服务器上进行。\n\nDNS 二级区域通过从托管主区域的服务器执行“区域传输”（zone\
    \ transfer）来获取其区域信息。\n\nDNS 缓存区域不进行查找，但存储来自其他查找的信息以加快查询响应速度。\n\n## DNS 工具\n\n\
    ### 使用 host\n\n“host”是一个用于执行 DNS 查询的简单实用。\n\n用法：\n\n```\n# host -1 [domain name]\
    \ 列出域名中的所有主机\n```\n\n### 使用 dig\n\n“dig”是“域名信息探寻器”（domain information groper）。它用于查询\
    \ DNS 服务器以获取有关主机名和服务器的信息。你可能熟悉“nslookup”，这是一个功能类似的旧工具。“dig”使用了更清晰、更易理解的命令结构，并且通常比“nslookup”更稳定，因此是查询域名服务器的推荐工具。\n\
    \n### 使用 dig\n\n```\n# dig [要查询的服务器] [要查找的名称] [查询类型（如果未指定，dig 将执行对 RR 的查找)]\n\
    ```\n\n### 使用 nslookup\n\nnslookup 模拟解析器进行查询。它一次只查询一个域名服务器。它像域名服务器一样执行区域传输。\n\n\
    在仅查找单个记录时使用非交互模式（noninteractive）。在查找多条记录时使用交互模式（interactive）。\n\n```\n#nslookup\
    \ （当不带任何参数使用时会启动交互模式）\n```\n\n```\n#nslookup [hostname.domain] 启动非交互模式\n```\n\n\
    交互模式：\n\n```\n#nslookup\n```\n\n```\n>set type=[要查找的记录类型]\n>[domain name]\n\n\
    输入 \"exit\" 或 \"ctrl+c\" 退出\n\n## DNS RFCs\n\n- RFC 1034 涵盖了域名设施和概念\n- RFC 1035\
    \ 解释了 DNS 的技术原理\n- RFC 1591 提供了 DNS 的通用描述\n\n学生练习 8.1：构建缓存域名服务器\n在此练习中，你将安装并配置一个简单的缓存域名服务器。\n\
    1. 使用 `rpm -qa | grep bind` 和 `rpm -qa | grep caching` 确定是否安装了以下包：\n   - bind\n\
    \   - bind-utils\n   - bind-libs\n   - bind-chroot\n   - caching-nameserver\n\
    2. 如果尚未安装，使用以下命令安装它们：\n#yum install [package name]\n或者，如果你没有 Internet 连接，可以在插入并挂载\
    \ DVD 后从安装光盘中安装它们：\n#rpm -ivh [package name].rpm\n3. 打开 `/var/named/chroot/etc/named.caching-nameserver.conf`\
    \ 文件，并在 `options` 部分添加以下几行（请非常注意语法，尤其是分号）：\nforwarders { 192.168.0.1; }\nforward\
    \ only;\n4. 保存 `named.caching-nameserver.conf`（ESC, :wq）并使用以下命令分配 644 权限：\n#chmod\
    \ 644 /var/named/chroot/etc/named.caching-nameserver.conf\n5. 使用以下命令检查语法：\n#named-checkconf\
    \ /var/named/chroot/etc/named.caching-nameserver.conf\n（如果没有收到响应，则说明配置是正确的。）\n\
    \n6. 配置本地解析器指向其自身进行名称解析。对 `/etc/resolv.conf` 进行以下更改：\nnameserver 127.0.0.1\n\n\
    7. DHCP 客户端软件将用来自 DHCP 服务器的 nameserver 信息覆盖 `/etc/resolv.conf`。你可以通过对你的网络网卡配置脚本（`/etc/sysconfig/network-scripts/ifcfg-eth0`（如果\
    \ eth0 不同，请替换为你的网络接口））来防止这一点：\nPEERDNS=no\n\n8. 以 root 身份启动域名服务器并在运行级别 3 和 5 中配置它：\n\
    $su -\nPassword:p@ss5678\n#service named\n#chkconfig named on 3\n\n9. 使用 dig 工具测试域名服务器：\n\
    #dig soundtraining.class\n;; Query time 10 msec\n;; SERVER: 127.0.0.1\n\n10. 从之前的\
    \ dig 查询中，测试缓存能力：\n#dig soundtraining.class\n;; Query time 1 msec\n;; SERVER:\
    \ 127.0.0.1\n\n## 杂项 DNS 工具\n\nDNS 条目缓存在客户端 nsc（名称服务器守护进程）。你可以通过以下命令刷新本地缓存：\n\
    #service named restart\n\n如果你正在运行 named，可以使用 rndc 工具（远程名称控制）查看缓存：\n#rndc dumpdb\n\
    \n上述命令会将缓存内容写入 `/var/named/chroot/var/named/cache.db` 或 `/etc/named.conf` 指定的文件。\n\
    \n在运行非 Red Hat 操作系统的上，rndc 工具在许多方面都很有用。在命令行提示符输入 rndc 查看其各种选项。\n\n了解更多 BIND\n\n\
