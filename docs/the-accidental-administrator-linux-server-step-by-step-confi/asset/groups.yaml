    # Adding a user to a group


    +   - #usermod -G [group name][username] adds a user to a supplementary group

    - #usermod -g [group name][username] will change a user''s initial group.


    Additionally, the usermod command can be used after a user account is created
    to add comments to the user account, change the user''s home directory, add an
    expiration date to the account, and various other account parameters.


    User accounts are stored in the /etc/passwd file, which is readable by everyone.
    When shadow passwords are enabled, the password field in the passwd file is filled
    with an “x” and the user’s encrypted password is stored in /etc/shadow, which
    is only readable by root.


    Group accounts are stored in the /etc/group file, which is also readable by everyone.


    To view a user''s group membership, type this command:


    ```

    #groups [username]

    ```


