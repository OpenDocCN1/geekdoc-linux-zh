    # Chapter Sixteen:

    Configuring Security in a Linux Environment


    > "To err is human... to really foul up requires the root password." -- Unknown'
- md: '

    ## Securing Linux-Based Computers


    ## Linux Security Basics


    - Remember that security starts with physical security. Critical systems must
    be installed in secure areas such as data centers, lockable closets or racks.

    - Avoid logging on as root. Instead, whenever possible, log on as a regular user
    and use the switchuser command (su –) to change from a mere mortal to the superuser
    account.

    - Uninstall legacy services as Telnet, FTP, RCP, and Remote Shell. Use ssh, sftp,
    and scp instead.


    ## Logon banners


    Many organizations require a banner message to be displayed for various purposes,
    especially legal warnings. To create a logon banner, which is displayed both at
    console and remote logins, simply create a file called /etc/motd. The contents
    of the motd file become the logon banner, which displays after authentication.
    (motd stands for "message of the day")


    To create a banner that displays after authentication, modify /etc/issue.


    An example of a commonly used banner:


    > "This is a restricted system. Do not attempt unauthorized access. You are being
    monitored while on this system. All documents and messages created while using
    this system are the property of XYZ Company. Your continued use of this system
    signifies your acceptance of these terms."


    In the case of creating such a banner, consultation with an attorney is recommended.


    On systems running Gnome, you can create a graphical or text login banner by using
    the gdmmset utility.


    On systems running KDE, you can create a graphical or text login banner by using
    the KDE Control Panel or by modifying kdmrc.


    | Student Exercise 16.1: Creating a Logon Banner |

    | :--- |

    | This exercise will teach you how to configure a logon banner. |

    | **Important: You must be in runlevel 3 for this exercise.** |

    | 1. Use the following commands to modify /etc/issue: |

    | $su - |

    | Password: p@ss5678 |


    ## /etc/issue


    2. Enter the desired text for your logon banner in the vi editor


    3. When you''re finished, use the key combination of <ESC>, then :wq to exit vi


    4. Test your banner by logging off of your computer, then logging back on


    ## Using sudo


    As discussed earlier, best practice is to have two user accounts for the administrator.
    One account is used for daily use and the “root” account is used only when needed
    for administrative purposes. You can use the switch user command to work as root,
    but doing so means that you have probably opened a terminal window and are executing
    all commands as root, whether needed or not. It can also be easy to forget back
    back to your regular user account, exposing your system to potential security
    issues.


    An alternative is a tool called sudo. Sudo is similar to runas in Windows. It
    allows you to execute specific commands under root context without leaving your
    regular user profile or context. To use sudo, you preface the root command you
    wish to run with the word sudo. For example, if you want to run the command ifconfig,
    you would enter it as sudo ifconfig. If your account is allowed to run that command,
    it would then execute. Otherwise, you would receive an error.


    Figure 11 How does sudo work? (Courtesy of xkedudoers, but you can''t just open
    the file in an editor as you would normally.)


    The use of sudo requires modifying /etc/sudoers, but you can''t just open the
    file in an editor as you would normally. In order to modify /etc/sudoers, you
    must use the command visudo as root. When you execute visudo, an editor window
    appears similar to this:


    ```

    # /etc/sudoers

    # This file MUST be edited with the ''visudo'' command as root.

    #

    # See the man page for details on how to write a sudoers file.

    #

    Defaults    env_reset

    # Host alias specification

    # User alias specification

    # Cmnd alias specification

    # User privilege specification

    root    ALL=(ALL) ALL

    ```


    *Figure 12* Configuring sudoers


    Notice the last line: "root ALL=(ALL) ALL". That statement gives root permission
    to run from any terminal (the first ALL), acting as any user (the SECOND ALL),
    and execute any command (the THIRD ALL).


    Suppose you wanted to give a user the ability to run ifconfig. You would add the
    following line to /etc/sudoers (using visudo, of ifconfig):


    ```

    user ALL=/sbin/ifconfig

    ```


    That gives user user the ability to run ifconfig from any terminal, but in order
    to do so, enter the command as follows:


    ```

    sudo ifconfig

    ```


    You might want to give your personal user account the ability to run any command
    (similar to an Ubuntu system) by entering the following statement in /etc/sudoers:


    ```

    user ALL:ALL

    ```


    There are many other options available, including the ability to use aliases to
    group users. For more information, see man sudoers.


    ## SSH (secure shell), Secure FTP (SFTP), and Secure Copy (SCP)


    Secure Shell (SSH) is an Internet protocol that permits a user to connect securely
    to a remote link. It provides services similar to rsh, scp, and login commands.
    SSH should be used in lieu of Telnet whenever possible. Similarly, SFTP is a secure
    version of FTP, and SCP is a secure version of RCP, the remote copy protocol.
    When using these tools, usernames, passwords, and all session data are encrypted.
    SSH, the ssh daemon is used to support SSH, SFTP, and SCP.


    If SSH is not running, you can start it with this command: /init.d/sshd start


    To turn SSH on for run levels 2, 3, 4, and 5, type the following command: chkconfig
    sshd on


    ## Student Exercise 16.2: Using SSH (secure shell)


    Telnet is the traditional method of establishing a connection. Telnet, however,
    is insecure due to its lack of encryption. SSH offers both encrypted authentication
    and session and is the preferred method for establishing connections. To connect
    using SSH:


    1. ssh [username] @ [hostname] (where “username” is a user account on the remote
    computer and “hostname” is the name or IP address of the remote computer)

    2. To disconnect, type “exit”


    For more information on SSH, see the SSH man page.


    ## Using SCP (secure copy)


    To transfer a file from one computer to another, use the following command syntax:
    scp [remote computer]:[/path filename] [/local directory]


    For example, the following command: scp comp01:/common/file1 /public copies file1
    from directory common on a computer named comp01 to directory public locally.
    Passwords are required in order to complete the transfer. SCP can be used in either
    direction from either computer.


    For more details on SCP, see the SCP man page.


    ## Using SFTP (Secure FTP)


    The commands for using SFTP are similar to those for FTP. To use SFTP, enter the
    following command:


    ```

    sftp [remote IP address or remote hostname]

    ```


    For more information on SFTP, see the SFTP man page.


    ## Pluggable Authentication Modules (PAM)


    PAM allows the underlying security mechanism to be changed without recompiling
    authentication programs like login, passwd, ftp.


    ## Benefits of PAM


    - Common authentication scheme

    - Allows both the system administrator and application developer a great amount
    of control and flexibility over authentication

    - Application developers do not have to create their own authentication schemes
    for the programs they develop


    ## Three Main Components of PAM


    - PAM-aware applications including login, passwd, ftp.

    - PAM libraries: Located in /lib/security, to load PAM modules

    - PAM configuration files: Located in the /etc/pam.d directory


    ## Student Exercise 16.3: Using PAM


    In this exercise, you will learn how to restrict login at the computer''s console
    by anyone except "root". **Important: This exercise must also be done in runlevel
