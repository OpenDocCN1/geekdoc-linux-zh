    # # Administering Users & Groups


    ## Understanding /etc/passwd

    The user list is in /etc/passwd. /etc/passwd is a simple text file containing
    entries such as this example:


    ```

    lgaga:x:508:512:Lady Gaga:/home/lgaga:/bin/bash

    ```


    In the above example, there are seven fields, each separated by colons.


    | Field Number | Example Value | Description |

    |---|---|--|

    | 1 | lgaga | Username |

    | 2 | x | Password ("x" indicates shadow passwords are being used) |

    | 3 | 508 | UID (User ID) |

    | 4 | 512 | GID (Group ID) |

    | 5 | Lady Gaga | Comment (usually the user''s full name) |

    | 6 | /home/lgaga | User''s home directory |

    | 7 | /bin/bash | User''s default shell |


    Figure 7 Understanding /etc/passwd


    It is possible to add and delete users by modifying this file, but it is much
    easier to do it with command line tools like “useradd” or the GUI-based Users
    and Groups.


    # ## Creating a new user


    Using the “useradd” command in the CLI:


    +   * #useradd jbridges will create the user account “jbridges”, a group classed
    “jbridges”, and a “home directory” for the new user


    # ## Passwords


    Using the “passwd” command in the CLI:


    ```

    #passwd rseacrest will prompt for a new password for user rseacrest

    #passwd -l [username] will lock the user account

    ```'
  - '[PAGE 70]


    # # passwd -u [username] will unlock the user account


    Require passwords to be changed at regular intervals with this command:


    # chage -M [# of days] [username]


    Everyone can read the /etc/passwd file, therefore shadow passwords are normally
    enabled which replace the password in /etc/passwd with an “x” and moves the encrypted
    passwords to the /etc/shadow file.


    # Default Values


    Default values are found in /etc/login.defs. By modifying the values found in
    /etc/login.defs, you can set default values for all new users created with “useradd”.
    Values found in /etc/login.defs include minimum and maximum password age, the
    location of user mailboxes, starting and ending UIDs and GIDs, and whether or
    not to create home directories for new users.s


    You also use the “-D” option to set default values such as default group, default
    home, default expire date, default inactive, and default shell.


    # Adding groups


    Using the “groupadd” command in the CLI:


    +   - groupadd sales will add the group “sales” to your system


    Using “useradd” with switches


    +   - useradd -c “Johann S. Bach” -g musicians -G baroque, organists, jbach adds
    the user “jbach” with the comment “Johann S. Bach”, making him a member of the
    primary group “musicians”, plus additional group membership in “baroque” and “organists"


    +   - useradd wloman -g sales -e 2008-06-18 creates a new user named woman, in
    the sales group, and sets account to expire on June 18, 2008.


    +   - useradd hopkins -g sales -p p@ss1234 will create a new user topkins, put
    him in the sales group and create the password “p@ss1234” for his account.


    # Deleting users


    Using the “userdel” command in the CLI:


    +   - userdel -r jbach deletes the user account. The “-r” deletes the user’s home
    directory and its contents.


    # Changing ownership for a file or directory


    +   - chown [user][:group] [filename][dir] changes group and user ownership for
    a file or directory'
