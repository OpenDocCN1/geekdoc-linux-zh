    \ Red Hat Linux (**www.redhat.com**)\n\n- Most widely used commercial distro\n\
    - High quality support\n- Rpm (Red Hat Package Manager)\n- Red Hat has divided\
    \ its distros into commercial (Red Hat Enterprise Linux or RHEL) and non-commercial\
    \ (Fedora). RHEL is sold and supported by Red Hat. Fedora is available for free\
