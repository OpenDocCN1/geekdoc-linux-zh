    # Foreword


    This book began life in the late 1990s as a handout lab manual to supplement other
    workshop materials in my Linux workshops. It grew, it evolved, and it took on
    a life of its own. Ultimately, it replaced the other workshop materials and became
    a full-fledged workbook of its own accord.


    I use both Windows and Linux in my work. I''m not passionate about operating systems.
    I prefer to save my passion for family, music, theatre, sports, food, and life.
    I view operating systems as tools to accomplish a job. I don''t get passionate
    about shovels, why should I get passionate about an operating system? That said,
    I tell students that Linux is like heroin, it''s very addictive. I love the flexibility
    and the absence of restrictive licensing in Linux. It is fun to explore and experiment
    with Linux and can do so in ways that are simply not possible with proprietary
    operating systems. This book, therefore, is written from the perspective of someone
    who is pragmatic about operating systems, yet enjoys working with them.


    As you work through the book, many of the exercises assume you''re connected to
    a private network with a network address of 192.168.0.24, a default gateway of
    192.168.0.1, a DNS domain name of soundtraining.class, and a DNS server located
    at 192.168.0.1. If your settings are different, make the appropriate changes in
    your configuration. If you don''t have a DNS server, you can configure your system
    to use the Google public DNS servers at 8.8.8.8 and 8.8.4.4. You won''t, however,
    be able to use your own host names and the soundtraining class domain name with
    the Google servers. If you want to use your own host names and domain name with
    an Internet-connect DNS server, consider setting up an account at zoneedit.com.


    This book is a human endeavor and, as such, is subject to human error. As much
    as I have tried to eliminate errors, I am certain to spot some immediately after
    the book is published. I have created an errata section on the series website:
    www.accidentaladministrator.com. If something doesn''t work as expected, first
    review your configuration for typos, then check the website to see if there are
    any corrections there.


    # Acknowledgements


    As I''ve acknowledged previously, any book, large or small, is a huge undertaking.
    This one is no exception. Many people have contributed to this work, some knowingly
    and other unknowingly. Thanks of course to my wife Janet, my niece Sally, and
    the rest of my family for their support and encouragement. Thanks to Linus Torvalds,
    Richard Stallman, Patrick Volkerding, and the thousands of other GNU and Linux
    creators, developers, users, and supporters. Thanks to Kris Rebillion for your
    art and instruction. Thanks to Claudia Mayorga and Randy Rash for seeing something
    in me many years ago that I couldn''t see myself. Thanks to “No-GUI Louie” and
    the countless other Linux students I''ve worked with over the years. Thanks to
    Cleo the dog, my office mate. Thanks to music and theatre for keeping me sane
    sometimes and insane at other times. Finally, thanks to you for reading this book.


    # Chapter One: Basics of Linux


    > "When choosing between two evils, I always like to try the one I''ve never tried
    before." --Mae West


    # Note to the reader:


    This book, like my workshops, is designed to deliver a lot of hands-on experience.
    In many (perhaps most) other I.T. books, the first few opening pages are filled
    with background information. When I''m building a system or working on one, I
    just like to get into the process of configuration as quickly as possible. This
    book gets you into the installation process right away, then provides some background
    information about Linux to read while the installation process runs on its own.


    # Performing a Linux Installation


    As all operating systems, the minimum hardware requirements vary based on how
    the system is being used. For an example, a simple router/firewall could realistically
    be installed on a system with a Pentium processor running at 200 MHz and only
    64 MB of RAM. Conversely, a system designed for MySQL and expected to handle large
    numbers of queries would require hardware far in excess of the stated minimums.


    As with any operating system, you should carefully review the manufacturer''s
    or distribution''s recommended hardware specifications prior to starting any operating
    installation. Pay attention not only to the minimum hardware requirements, but
    also to any hardware compatibility lists.


    # Inventory Your Hardware


    It can be very helpful to understand your hardware before beginning the installation.
    It is especially important to inventory your video hardware to simplify the installation
    and configuration of X Windows (the graphical display systems used in Linux and
    UNIX).


    Things to inventory include: the video card''s manufacturer and model number,
    the monitor''s manufacturer and model number, monitor vertical and horizontal
    frequency rates, and amount of RAM present in the video adapter. It is also helpful
    to know the resolution and color capabilities of your monitor and video adapter.


    Other things to inventory include the amount of RAM, the mouse type and port,
    and the network adapter and resources.


    If you are migrating from the Microsoft Windows operating system, the system properties
    and device manager can provide a wealth of information about the system. If you''re
    installing to bare metal, live CD versions of Linux such as Knoppix can help determine
    your system''s hardware configuration.

