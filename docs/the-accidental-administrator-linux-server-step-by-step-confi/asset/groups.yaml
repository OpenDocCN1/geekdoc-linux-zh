    # Using Linux as a Router


    Routing is used to connect two logical IP networks. A router forwards packets
    between one network and another. A router appliance can be installed or a computer
    running Linux can be configured with two or more network interfaces with IP forwarding
    enabled.


    # Configuring Linux as a Router


    - Install a second network interface (probably an Ethernet NIC) and configure
    its IP address.

    - Enable forwarding between the two NICs by editing /etc/sysctl.conf. Find the
    line that says "net.ipv4.ip_forward = 0" and change "0" to "1".

    - Restart the network service.


    # Iptables


    Iptables is the new Linux firewall, replacing iptchains from previous versions
    of Linux. Use iptables to control traffic and from your Linux system.


    ## Configuring a Linux firewall


    Type the following command:


    ```bash

    #setup

    ```


    The text mode setup utility will appear. Use the arrow keys to select Firewall
    configuration. Use the tab key to select Run Tool. In the Firewall Configuration
    window, you can enable or disable the firewall. You can also use the tab key to
    select Customize, which allows you to specify trusted devices and allowed types
    of traffic by port number.


    # Masquerading IP Addresses


    Use this command when a service such as DHCP is used to dynamically assign IP
    addresses to hosts in the network:


    ```bash

    #iptables -t nat -A POSTROUTING -o eth1 -d ! 10.1.0.0/16 -j MASQUERADE

    ```


    Use this command when IP addresses are statically assigned:


    ```bash

    #iptables -t nat -A POSTROUTING -o eth1 -d 10.1.0.0/16 -j SNAT

    ```


    To set up a DMZ, poke a hole in your firewall with this command (on a single line):


    ```bash

    #iptables -t nat -A PREROUTING -i eth0 -d 10.16.0.1 -p tcp --dport 80 -j DNAT
    --to 192.168.1.2 (where 10.16.0.1 is the publicly accessible address and 192.168.1.2
    is the address of the internal web server).

    ```


