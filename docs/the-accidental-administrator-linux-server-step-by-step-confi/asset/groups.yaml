    run. If certain processes were to be killed (such as anacron), they would be listed
    with their name preceded by a "K".


    You''ll also notice scripts in /etc/rc.d called, rc.local, and rc.sysinit. The
    rc script is responsible for starting and stopping services when runlevels change,
    rc.sysinit runs once at boot time before other scripts, and rc.local runs after
