  - "[PAGE 77]\n\n# Linux File System\n\nDebian Etch, RedHat, SuSE, and other distributions\
    \ use the ext3 file system by default. ext3 is a journaling file system which\
    \ offers greater stability and reliability than predecessor file systems.\nAnother\
    \ popular journaling file system is ReiserFS. V3 of reiserfs is used as the default\
    \ filesystem for Windows, FTOSX, Libranet, Xandros and Yoper. Ext4 is also now\
    \ available and becoming a default file system in new Linux versions.\n\nLinux\
    \ can also read/write to many other file systems including FAT, FAT32, NTFS, HPFS,\
    \ and others. Partitions are mounted onto existing directories called \"mount-points\"\
    \n\nLinux uses a tree model to organize directories and files. Directories are\
    \ the basic unit of storage in the Linux file system. Directories can contain\
    \ files or other directories. In the same way that a tree cannot exist without\
    \ its roots, the Linux file system starts at root. Root is designated by \"/.\
    \ The term \"root\" is used in three different ways in Linux: \"Root\" is the\
    \ name of the user, to identify the superuser's home directory [/root], and to\
    \ indicate the root of the file system [/]. It can be difficult to know which\
    \ \"root\" someone is talking about. It helps to be clear about what is meant\
    \ when referring to \"root\"\n\n# Linux Files Types\n\nWhen you use the `ls -l`\
    \ command, Linux will display a listing of files along with information about\
    \ the files. The left hand column of the listing indicates the type of file. Three\
    \ common file types are regular files, links, and directories.\n\n# Regular files\n\
    \nRegular files are the most common file type on Linux or UNIX systems. They can\
    \ be used to store various types of data including text that you can read or binary\
    \ data that can be executed by the system. It is often helpful to identify more\
    \ information about the file than whether it is a regular file or not. For example,\
    \ you might want to know whether the file is an ASCII text file or a shell script.\
    \ \n\n```\n$file [filename]$\n```\n\n# Links\n\nLinks are files that point to\
    \ other files on the system. There are two types of links: hard links and symbolic\
    \ links.\n\nHard links are a special type of directory entry that have certain\
    \ limitations:\n\n+   - Hard links can only point to a file; they cannot point\
    \ to a directory.\n- They cannot be distinguished from the file to which they\
    \ are pointing.\n\nHard links are created with the `ln` command:\n\n```\n$ln [source]\
    \ [target]$\n```"
  - '[PAGE 78]


    Symbolic links are special files that store a pathname to another file.


    Symbolic links are created with the “ln” command, combined with the “-s” option:


    ```

    $ln -s [source pathname] [target]

    ```


    You can think of symbolic links as being similar to shortcuts in Microsoft Windows.


    # Directories


    Directories are containers that hold various types of files or other directories.
    Directories are used for organizing the file system.


    # Mounting a Device


    In order to make a device such as a CD-ROM or floppy drive available to the file
    system, it must be “mounted” to an existing mount point within the file system.
    Before using the “mount” command, ensure that the desired mount point already
    exists within the file system. A common place to locate mount points is within
    the /mnt directory (but they can be placed anywhere). To mount a device to the
    mount-point:


    ```

    #mount /dev/cdrom /mnt/cdrom

    ```


    You can navigate to the newly mounted device with the “cd” command:


    ```

    #cd /mnt/cdrom

    ```


    Before ejecting CDs or floppy disks, you must unmount them from the file system.
    To unmount a mount-point:


    ```

    #umount /mnt/cdrom

    ```


    Note that, before a mountpoint be unmounted, you must “CD” out of the directory
    which you etc wish to unmount.


    Partitions can be mounted automatically on boot through the fstab file, which
    is located at /etc/fstab.


    # Understanding Mount Points


    You can think of mount points as a way of accessing a partition. Recall that in
    Linux, everything is oriented around the file system. The first SCSI drive on
    a computer might be known as /dev/sda, the second as /dev/sdb, and so on. The
    first IDE drive would be known as /dev/hda. Partitions are numbered, the first
    partition on the first SCSI drive would be known as /dev/sda1, the second partition
    would be /dev/sda2, etc.


    You cannot, however, access partitions through /dev/ files; you must create mount
    points which are simply a means of gaining access to a partition through the computer''s
    file system.


    A basic partitioning scheme will usually have three partitions: /,boot, and a
    swap partition. Often, server administrators will create separate partitions for
    other purposes as shown below:'
- md: "\n| Mount Point | Purpose |\n| --- | --- |\n| /boot | Contains boot loader,\
    \ kernel and related files |\n| / | Root of the file system |\n| /usr | UNIX resources\
    \ where you find program and related files |\n| /home | Users directories and\
    \ profiles |\n| /var | Variable size files including logs and spools |\n| /tmp\
    \ | Temporary files |\n\n## Managing File and Directory Permissions\n\nLinux uses\
    \ three types of file/directory permissions for files:\n- Read means that you\
    \ can view a file's contents.\n- Write means you can change or delete the file.\n\
    - Execute means you can run the file.\n\nFor directories:\n- Read means you can\
    \ list the contents of the directory.\n- Write means you can add and remove files\
    \ in the directory.\n- Execute means you can list information about the directory.\n\
    \nPermissions are assigned to both users and groups:\n- Read permission: Whether\
    \ the file can be read or the directory can be listed.\n- Write permission: Whether\
    \ the file can be modified or written to or whether changes can be made to the\
    \ contents of the directory.\n- Execute permission: Files, whether the file can\
    \ be executed. For directories, this is the permission to enter, search through\
    \ the directory, or execute from the directory.\n\nYou can list directory permissions\
    \ by using the \"ls -l\" command, for example. On Red Hat-based systems, you can\
    \ also use \"ls -ll\". When you list files and folders using \"-l\" option, you\
    \ will see a display like this:\n\n```\ndr-rw---- 1 root root 40 file\n```\n\n\
    The first column (dr-rw--) is actually divided into four groups:\n- The first\
    \ group is a single column to identify the type of entry:\n    - \"d\" indicates\
    \ a directory\n    - \"l\" is a symbolic link to another program or file elsewhere\
    \ on the system\n    - \"-\" is a regular file\n- The second group is three columns\
    \ used to identify the permissions of the owner\n- The third group is three columns\
    \ used to identify the permissions of the group\n- The fourth group of three columns\
    \ identifies the permissions of the world (everyone).\n\nThe three permissions\
    \ are, in order: read (r), write (w), and execute (x). If the permissions are\
    \ expressed as \"-rw-rw--\", then the entry is a file whose owner and owner group\
    \ read+write, but not execute and the rest of the world is denied access.\n\n\
    ## Changing permissions\n\nUse the \"chmod\" command to change permissions. You\
    \ can set permissions for the user (u), group (g), and others (o). Permissions\
    \ can also be set for all (a).\n\nPermissions are set using +, -, and =\n- + adds\
    \ the permission\n- - removes the permission\n- = sets the permission as specified\
    \ and can be used to copy permissions.\n\nFor example:\n- chmod u+x file1 adds\
    \ the execute permission for the user owner on file1.\n- chmod g-w file2 removes\
    \ the write permission for the group owner on file1.\n- chmod a+r file3 adds the\
    \ permission for everyone on file3.\n- chmod o=u file4 copies the user permissions\
    \ for file4 to the world.\n\n## Octal (Numeric)\n\nOctal permissions are simply\
    \ a form of shorthand for assigning access to files and folders.\n- Read = 4\n\
    - Write = 2\n- Execute = 1\n- No access = 0\n\nUse `chmod` to assign permissions\
    \ using the numeric system. For example: `chmod 644 file1` would assign owner\
    \ read+write (6=2+4), the owner’s group and everyone would have read permission\
    \ (4).\n\n## Special Permissions\n\n- Sticky bit:\n    - Can be used on “world\
    \ writable directories” to prevent users from deleting users’ files\n\n## Assigning\
    \ Special Permissions\n\n- chmod 1766 [directory] (1 makes it sticky)\n\n### Student\
    \ Exercise 4.1: Managing file and directory permissions\n\nIn this exercise, you\
    \ will use various commands to set and edit file and directory permissions.\n\n\
    #### Student Exercise 4.1.1: Viewing Permissions\n\n1. Change to the superuser\
    \ (root) account with the switch user command:\n$su -\nPassword:p@ss5678\n\n2.\
    \ Navigate to the \"/\" directory and use the \"ls -l\" command to verify the\
    \ existence of /demo. If it is not present, use the \"mkdir\" command to create\
    \ a new directory called “demo”:\n#mkdir demo\n\n3. Now, use the \"cd\" command\
    \ to navigate to the \"demo\" directory, then use the \"ls -l\" command to verify\
    \ the existence of file1, file2, file3. If they are not present, use the \"touch\"\
    \ command to create three files:\n#cd demo\n#touch file1 file2 file3\n\n4. Use\
    \ the following command to view the permissions for the three files you just created:\n\
    ls -l\n\n5. What are the permissions on each of the files for the user?\nEach\
    \ of the files should have \"rw\" permission for the user.\n\n6. What are the\
    \ permissions on each of the files for the group?\nEach of the files should have\
    \ \"r\" permission for the group.\n\n7. What are the permissions on each of the\
    \ files for the world?\nEach of the files should have \"r\" permission for the\
    \ world (other).\n\n### Student Exercise 4.1.2: Changing Permissions Using Alphabetic\
    \ Expressions\n\nIn this exercise, you will use alphabetic and octal syntax to\
    \ modify permissions using the chmod command.\n\n1. While still in /demo, execute\
    \ the following command to display the permissions for file1:\nls -l\n2. Notice\
    \ that only file1 is modified because you appended \"ux\" to the end of the command.\
    \ What are the permissions for the user?\nThe permissions should be \"rwx\" for\
    \ the user.\n3. Now, execute the following command:\nchmod g+w file2\nNow, what\
    \ are the permissions for the group?\nThe permissions should be \"rw-\" for the\
    \ group.\n4. Execute the following command:\nchmod a+x file*\nWhat happened now\
    \ to the permissions on all files?\nAll files should have \"x\" permission in\
    \ addition to any pre-existing permissions.\n5. Execute the following command:\n\
    chmod o=u file3\n6. Use the ls -l command to view the new permissions. What happened\
    \ to the permissions for the world? Are they the same as for the user?\n\n###\
    \ Student Exercise 4.1.3: Octal (Numeric) Permissions\n\nIn this exercise, you\
    \ will practice managing permissions using octal settings instead of alphabetical\
    \ expressions.\n\n1. Execute the following command:\nchmod 644 file*\n2. Using\
    \ the `ls -l` command, display the changed permissions. What are the new permissions\
    \ for the files?\nThe new permissions should be \"rw-\" for the user and \"r\"\
    \ for the group and the world (other).\n3. Execute the following command:\nchmod\
    \ 777 file\n4. Again, use the `ls -l` command to display the permissions. What\
    \ happened?\nThe permissions for file are now \"rwx\" for user, group, and world.\n"
