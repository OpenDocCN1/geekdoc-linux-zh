    # 意外的管理员：Linux 服务器

    配置指南


    从零开始配置 Linux 服务器的易上手分步指南！


    《意外的管理员：Linux 服务器分步配置指南》包含了 44 个易于操作的实践练习，以及大量的命令示例和截图，帮助您从零构建一个运行的 Linux 服务器。这是学习如何配置
    CentOS/Red Linux 服务器最简单的方法，书中充满了多年教学、咨询和管理 Linux 服务器积累的实用技巧和秘诀。书中没有浪费时间在枯燥的理论上。内容涵盖安装、管理、用户管理、文件系统和目录管理、网络、包管理、任务调度、网络服务、SMB、NFS、磁盘配额、邮件服务器、Web
    和 FTP 服务器、桌面共享、打印、安全、路由、性能监控、管理工具等。


    在这里将学会：


    - 如何找到并合法下载服务器软件

