- img_proc: true
  md: "# Appendix C: About CD-ROMs\n\ndoesn't contain a whole lot more, beyond some\
    \ useful install utilities and a handy-dandy README file from Red Hat that explains\
    \ precisely what you'll find. The directory structure looks like the following\
    \ (except lacking our handy annotations, of course):\n\n```\n/mnt/redhat\n  --\
    \ current Linux release\n  ---> RedHat -- binary packages, incl:\n      ---> RPMS\
    \ -- OS, GUIs, Apache, etc.\n                                 -- on 7 release\n\
    \      ---> base -- used by install process\n                                \
    \ -- boot & ramdisk images\n  ---> images -- DOS install utilities\n  ---> dosutils\
    \ -- copyright information\n  ---> COPYING -- general read me file\n  ---> README\n\
    \  ---> RPM-GPG-KEY -- GPG sigs for Red Hat pkgs\n```\n\nOutside of the RedHat/\
    \ directory, access to the dosutils, file, and the GPG signature for the Red Hat\
    \ software (in the RPM-GPG-KEY directory), you probably won't need to access much\
    \ else on this CD (and the install program handles most of for you on your behalf).\n\
    \n# About CD2\n\nCD2 consists mainly of Red Hat Linux 7, additional RPMs, and\
    \ source packages. You're either promoted to install these during the installation\
    \ process or choose to install them. CD2 also includes a README file from Red\
    \ Hat that explains precisely what you find on CD. The directory structure looks\
    \ like the following (except lacking our handy annotations, of course):\n\n```\n\
    /mnt/redhat\n  ---> RedHat -- addtl binary pkgs, incl:\n      ---> RPMS -- games,\
    \ tools, & utilities\n      ---> instimage -- NFS install tree\n  ---> SRPMS --\
    \ source pkgs, incl:\n                               -- RPM pkgs for 3rd-party\n\
    \                               -- tools & utilities\n                       \
    \        -- alpha & beta pkgs\n                               -- (source & binary)\
    \ for\n                               -- adventurous users only\n  ---> preview\
    \ -- copyright info\n  ---> COPYING -- CD 2 read me file\n  ---> README\n  --->\
    \ RPMS-GPG-KEY -- GPG sigs for Red Hat pkgs\n```\n\nOutside of the RedHat/RPM\
    \ directory, the SRPMS directory, and the GPG signature for the Red Hat software\
    \ (in the RPM-GPG-KEY directory), you probably won't need to access much else\
    \ on this CD (and the Red Hat Package Manager handles most of for you on your\
    \ behalf)."
