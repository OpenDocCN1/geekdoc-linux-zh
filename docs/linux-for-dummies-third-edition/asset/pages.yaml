    Note that you rarely have any need to make changes to any of these files. Enabling
    and disabling services at start time is simply a matter of creating or deleting
    the symlink for a process in the required runlevel directory. Maybe we provide
    some easy configuration tools the *a la carte* section later in this chapter,
    so that you don''t have to mess with the command prompt.


    # Kernel modules


    You probably woke up in the middle of the night wondering how the system knows
    what kernel modules to load at boot time. *Kernel modules provide a way for you
    to add hardware and special system drivers after you''ve loaded the kernel into
    memory.* Each kernel module may also require specific parameters to be passed
    to it at load time. You can find the configuration file that contains these parameters,
    as well as determining which modules to load at boot time, in the `/etc/modules.conf`
    file (`/etc/conf.modules` in Red Hat Linux 7).


    # Users and groups


    Of your system only benefits users if they can get to it. A critical file that
    maintains a list of the system users, along with password information, home directory,
    and default shell of each user, is the `/etc/passwd` file. The `/etc/group` file
    contains information about the groups on the host and the members (users) of each
    group.


    If you enabled shadow passwords during installation, you also need to be aware
    of the `/etc/shadow` file, which is owned and marked exclusively `read-only` by
    root. This file keeps the encrypted passwords instead of the traditional location
    in the second field of the `/etc/passwd` file.


    Although it''s possible to simply edit these files to make additions, deletions,
    or changes to users, we don''t advise it. The `login` program matches these files
    for line, and a simple fat-finger mistake in your editor could cripple your entire
    system. Use the `adduser` or LinuxConf utilities for user and group maintenance—you''ll
    be glad you did!'
