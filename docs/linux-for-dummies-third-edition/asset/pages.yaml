  md: '# Chapter 1: Getting Acquainted with Linux


    Linux is great for many reasons. Linux was built from the ground up with the following
    features in mind:


    +   - Multi-user: More than one user can be logged into a single computer at one
    time. This is a nice feature for the currently popular thin-client computing model
    that relies heavily on a central computer host to perform the heavy lifting.

    - Multi-process: True preemptive multi-tasking enables the operating system to
    efficiently run several running programs at once. This is important for providing
    multiple services on one computer.

    - Multi-platform: Linux currently runs on Intel-based PCs, Digital/Compaq Alpha,
    PowerPC-based (Apple Macintosh), Sun Spar, Amiga, and StrongARM-based computers.

    - Interoperable: Linux plays nice with most network protocols and operating systems
    including Microsoft Windows, Unix, Novell, and Apple’s Mac OS.

    - Scalable: As your needs grow, you can run Linux to grow with you. The Linux
    kernel is currently scalable to four processors, with a flurry of current development
    activity to increase this number.

    - Portable: Linux is mostly written in the C programming language. C is a mid-level
    language, created specifically for writing system-level software that can be readily
    ported to new computer hardware.

    - Flexible: You can configure the Linux operating system as a network host, router,
    graphical workstation, office productivity PC, home entertainment computer, file
    server, Web server, cluster, or just about any other computing appliance that
    you can think of.

    - Stable: The Linux kernel has achieved a level of maturity to make most software
    developers envious. It is not uncommon to hear reports of Linux servers running
    for years without any downtime.

    - Efficient: The modular design of Linux enables you to configure in just those
    components that you need to run your desired services. Ever older 486 computers
    can utilize Linux to become useful again.

    - Free: The most intriguing aspect of Linux to most people is the fact that it’s
    free. How (the capitalists murmur) can a better mousrap be built with no incentive
    of direct monetary return?


    In this chapter, we intend to answer that last question for you. We also hope
    to paint a picture of the open source software development model that created
    Linux.'
