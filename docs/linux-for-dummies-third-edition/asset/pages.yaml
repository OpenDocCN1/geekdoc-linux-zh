  md: '# 80 Part I: Getting Your Feet Wet


    ![](img/4e9f259b21147d1fb7569159ef49ec31_107_0.png)


    # Picking apart the kernel


    A word that you hear a lot while reading about Linux is **kernel**. The kernel
    is the central core of your operating system. Everything else is a collection
    of applications, tools, trappings, and other things that make it usable by people
    like you and a. Word of caution: Don''t mess with your kernel! The Linux kernel
    itself. If you move or delete the kernel, you no longer have an operating system!


    We''re not saying this is right or wrong — it''s how it is. Linux allows a much
    closer relationship with the kernel, which can be both good and bad, depending
    on what happens when you try to develop this relationship.


    The kernel is kept in the boot section of your file system. In some distributions
    this is in others, it is there in the root (/). The file typically has a name
    starting with vmlinuz. Whenever you need to know what version of the kernel you''re
    using, use **uname -r** either as the root user or another user.


    All operating systems have a kernel. Windows, Macintosh, and other operating systems,
    however, keep the kernel under lock and key.


    ```

    image=/boot/vmlinuz-2.2.16-12

    label=linux

    read-only

    root=/dev/hd1

    other=/dev/hdb1

    table=/dev/hdb

    label=dos

    ```


    The local section in LILO has as many menu items as you have operating systems.
    While the global section has a pretty freedom layout, the local section is more
    rigid. Each menu item for a Linux install looks similar to:


    ```

    image=path_to_kernel

    label=linux

    root=partition

    ```


    The image value points directly to the kernel. The path is usually either the
    root directory (/) or /boot. The kernel itself typically starts with vmlinuz.
    You can find out more about how to partition structures in Chapter 14.


    For an operating system such as Windows, the menu item entry looks different.
    Instead of using the structure shown in the preceding code example, use the following:


    ```

    other-partition

    label=windows

    table=drive

    ```'
