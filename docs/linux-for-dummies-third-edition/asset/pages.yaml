  md: '# Chapter 11


    # Breaking Linux Out of Its Shell


    In This Chapter


    +   - Understanding shell instances

    - Using redirection and pipes

    - Working with the bash shell

    - Customizing the bash environment


    > “Whom computers would destroy, they must first drive mad.”

    —Anonymous


    Everyone needs a place to work. In an office, we may use a nice desk with lots
    of drawers and organizers. In school, we have a smaller desk, sometimes with a
    lifting lid so we can store a few things inside it, and at other times we have
    just a surface to work on. In this chapter, we discuss the work-space Linux provides
    and how you can make the most of it.


    # Playing the Shell Game


    You need a place to work on the computer — and we don''t mean a desk. In this
    case we''re talking about a place to work within the computer itself. In Linux,
    this place is where you are called the *shell*. A shell is not a graphical thing
    but the sum total of the commands and syntax that you have available to you to
    do your work.


    # bash is not a violent act!


    The default shell used in Linux is the *bash* shell. This work environment is
    based on the original Unix shell, which is called the *Bourne* shell and is also
    referred to as *sh*, bash stands for the *Bourne Again shell*, which is based
    on and comes with most Linux distributions. The first time you'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    encounter this shell is when you''ve finished logging in and get the command prompt.
    For example, if you''re logged in as sue on the machine bartleby Red Hat Linux
    7, your prompt looks like the following:


    ```

    [sue@bartleby sue]#

    ```


    Red Hat Linux 7, which comes on the CDs that accompany this book, uses bash as
    the default shell, as many other Linux distributions.


    Everything you do from here is determined in some way by the shell''s capabilities.


    # Which login am I1 in?


    One of the most confusing things about Linux shells is that you''re constantly
    moving in and out of them. Each time you log in, you open a shell instance—a specific
    shell with its own settings. This means that if you''re logged in two different
    times on two virtual terminals, you actually have two shells going. If you change
    the settings in one of the shells, those settings do not apply to the other! If
    you make the changes permanent, however, then new shells will open the new settings.


    If you want your new settings in one login session to apply to your other login
    session, log out and log back in. If you have multiple sessions open and want
    the new settings to apply to everything (including perhaps being in the GUI),
    you need to leave all of your sessions and re-enter.


    # The bash Shell at Your Beck and Call


    If you understand what a shell really is, you''re ready to get down and dirty.
    (If you don''t, you need to refer to the previous section, "Playing the Shell
    Game.") shell has its own way of handling commands and additional sets of tools.
    In this section, we specifically cover what you can do with the bash shell, starting
    with working at the command prompt and then getting into bash shell interior decorating.


    # Command syntax and structure


    Many people happily skip through their Linux use without understanding the fundamentals
    of commands in the bash shell. Note that this approach makes you lose out on some
    of the cool capabilities available in bash. The more you'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 11: Breaking Linux Out of Its Shell


    know about this shell language works, the more interesting things you can do with
    it.


    The basics of using bash at the command prompt often involves typing a command
    and any of its flags and values. For example, you enter the ls -la ~ command to
    see a long format listing of all files in your home directory, including those
    that start with a dot — are typically configuration files and directories.


    # Detours with redirection


    One feature available to you in bash is the ability to add a detour sign in conjunction
    with a command. One group of such signs is referred to collectively as redirection.
    We stick with redirecting command output here, because this is by far the most
    common form of detouring. Output redirection involves piping a command to send
    its results to a file instead of the screen. Typing ls -la ~ and then pressing
    Enter produces something like the following:


    ```

    total 20

    ddrwx------2 sue users 4096 Oct 30 07:48 .

    drwxr-xr-x 5 root 4096 Oct 30 11:57 .

    ---r--r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    ---r--r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    ---r--r-- 1 sue users 124 Oct 30 06:50 .bashrc

    ---r--r-- 1 sue users 0 Jan 2 07:48 wishlist

    ```


    Want to send this information to a file instead? Enter the ls -la -> listing command.
    The > is the detour sign that tells bash to take the data that would otherwise
    be sent to the screen to send the data to a file named listing instead.


    If you type ls -la >> listing, the data is overwritten, meaning that the file''s
    contents are wiped out and replaced with the new output. You can avoid this by
    using >> as your detour sign, which tells bash to add the command''s output to
    the end of the specified file. So, if you use ls -la >> listing in the same directory
    after making no changes, the contents of listing are now as:


    ```

    total 20

    ddrwx------2 sue users 4096 Oct 30 07:48 .

    drwxr-xr-x 5 root 4096 Oct 30 11:57 .

    ---r--r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    ---r--r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    ---r--r-- 1 sue users 124 Oct 30 06:50 .bashrc

    ---r--r-- 1 sue users 0 Jan 2 07:48 wishlist

    total 20

    ddrwx------2 sue users 4096 Oct 30 07:48 .

    drwxr-xr-x 5 root 4096 Oct 30 11:57 .

    ---r--r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    ---r--r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    ---r--r-- 1 sue users 124 Oct 30 06:50 .bashrc

    ---r--r-- 1 sue users 0 Jan 2 07:48 wishlist

    ```'
  merge: -1
