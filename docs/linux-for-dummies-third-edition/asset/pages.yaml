  md: '# # Chapter 6


    # # Adding Devices and Software to Linux


    In This Chapter


    +   * Checking out the nuts and bolts of hardware and software

    * Installing new hardware and device drivers

    * Adding software that isn''t part of the package

    * Troubleshooting newly added hardware and software


    Most Linux distributions contain a nice collection of software packages that range
    from productivity tools to fun and games. Although these may be sufficient and
    provide the features you need, you have many other software packages to consider.
    Some of these are similar to shrink-wrapped commercial products and often are
    capable of reading and writing to many file format types. At the other end of
    the software spectrum are applications that crash your environment, cause more
    harm than good, and get in the way. Between these two extremes sit hundreds of
    programs that range from productivity applications to utilities to you-name!


    Undoubtedly, the time will come in your Linux experience when you need to add
    or change hardware. Depending on the type of change, you may have very little
    to do or may have a number of factors to think about. Typically, you simply have
    to go back in, add a new driver or two, and make the kernel aware of the changes.


    In this section, we cover the basics of what to do when you add hardware and software.
    Covering all the different software and hardware options that you can stick in
    a Linux system is impossible. So we cover those topics that are most common to
    Linux systems.'
