  md: '# Chapter 17

    Security


    # In This Chapter


    +   - Implementing user and administrator security

    - Pluggingging security holes

    - Installing, configuring, and running SWATCH


    > I am Inspector Clouseau and I am on official police business.

    — Inspector Clouseau


    Security. Here''s a buzzword that you can''t escape. Anywhere that you read about
    the Internet, you see reports of break-ins, new viruses, and dire warnings about
    the security of our systems. In some ways, this hype is necessary to keep everyone
    on their toes. The biggest problems you face with security — whether it''s in
    your home, at work, or on a computer — happen when you get lax.


    You wouldn''t leave the front door of your house open when you went to work, how
    about leaving it shut and locked but with a few big windows open? The problem
    is that many people do this every day with their computers and they don''t even
    know it! So, we take a look at where your open doors and windows are and what
    you can do to secure them.


    # Implementing User and\Administrator Security


    Every user''s actions affect your overall system security. If your family or officemates
    need access to your Linux machine, then take the time to sit down and explain
    the facts of secure life to them. They can then take this information and apply
    it to the other computers they use, because these issues aren''t specific just
    to Linux.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Daily tasks for users


    Fortunately, you, and the users you''re letting onto your machine, can do a number
    of things to contribute to your machine''s security.


    # Choosing passwords


    The first line of defense from intruders is the entire collection of passwords
    on your system. If even one of the accounts has a weak password, then you may
    be in some trouble. When choosing passwords, follow these rules:


    Every person on your system needs to follow these rules, including you! Consider
    keeping a sheet of paper with the rules on it to keep next to the machine.


    We can''t stress this enough: Never give out your password. Make sure that the
    people on your machine understand this. You can find alternative methods to accomplish
    a task without giving out your password.


    # Getting new software


    All users can download and install new software. Of course, the program(s) they
    install are limited to the user''s own permissions. The thing to be careful of
    here — with any operating system — is that you don''t get a version of a program
    that''s been tampered with, or is even an all-out fake trying to trick folks into
    installing it.


    Give your users a list of Web sites that you trust, such as the ones listed in
    this book, and tell them if they aren''t sure or not they can trust


    ![](img/4e9f259b21147d1fb7569159ef49ec31_309_0.png)'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 17: Security


    a particular Web site, they need to ask you for your opinion. This means of, course,
    that you need to look around and decide what sites you trust and what sites you
    don''t.


    # Daily tasks for the administrator


    If users need to be careful, then the administrator of a Linux machine (or any
    machine) needs to be doubly watchful. As the person in charge, your job is to
    make sure that this computer stays intruder-free. Aside from making sure that
    you do all of the same things a user would do for your account(s) and the superuser
    (root) account, you must do one additional thing, no matter what Linux distribution
    you''re running, and that''s keeping up to date with security problems.


    Every operating system has security issues. You can''t escape them. The people
    who manage to do break-in problems are who stay informed and apply fixes when
    they appear. Almost all Linux distributions offer the ability to find out and
    grab fixes. If the instructions aren''t in the documentation, they''ll be on the
    distributors'' Web sites.


    In the case of Red Hat Linux, write to the e-mail address `redhat-list@redhat.com`
    with the word subscribe as the subject and nothing in the body. This adds you
    to the Red Hat mailing list. You''ll receive announcements whenever a new security
    problem is uncovered with a Linux or Red Hat package, including instructions on
    how to fix the problem.


    When you get out these warnings from Red Hat, keep the following in mind:


    +   - Are you using this program You potentially receive warnings about everything
    that comes with the distribution. You can determine whether or not the warning
    pertains to you in a number of ways, depending on the distribution and package.
    A quick way of telling if you''re using a program is to type man program. If the
    package is installed, then the help for it comes up; the help information isn''t
    installed unless the program is.


    +   - Are you using the same version of the program that you''re warned about?
    You may be using an older or newer version. You have to read the warning message
    carefully to see what range of versions it covers. If it doesn''t mention one,
    then assume that the warning applies to you too (just to be safe).


    ![](img/4e9f259b21147d1fb7569159ef49ec31_310_0.png)'
