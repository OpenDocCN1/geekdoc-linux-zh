- img_proc: true
  md: '# 356 Part VI: Appendixes


    **plug-in:** A small program or module that works within an application to offer
    a service or function that wasn''t originally part of the application. Web browsers,
    such as Netscape Navigator, use many plug-ins that provide multi-media functions.


    **Post Office Protocol (POP) server:** A server, most often under the control
    of an Internet Service Provider, that enables dial-up access to the Internet.


    **queuing:** The process of storing files (usually print files) temporarily until
    they''re ready to be accessed. Also called spooling.


    **Red Hat Linux:** A popular version of the Linux operating system.


    **red:** In bash, the use of a detour sign in conjunction with a command. Redirecting
    command output, involves the use of a symbol in a command to send the results
    to a file instead of the screen. The `ls -la ~ listing` command sends the results
    of the `ls -la` command to the file listing rather to the screen.


    **root directory:** The parent directory of all directories in Linux and Unix.
    The root directory is represented in the file system tree structure by a / (for-ward
    slash).


    **root user:** The administrator account in Linux. The root user has all rights
    within the system. Also called superuser.


    **router:** A networking device that connects networks with different physical
    media and uses a routing table to determine the destination of data packets. A
    router also chooses the best route between any two hosts, reducing network traffic.


    **RPM (Red Hat Package Manager):** An open packaging system distributed under
    the GPL that developers use to package source code for end users, and assists
    users in the installation and upgrading of their Linux files. RPM is available
    in Red Hat Linux and Linux distributions and Unix systems.


    **sector:** The smallest physical unit on a disk.


    **shell:** The user interface for Linux and Unix. A shell may be a command prompt
    driven or menu driven.


    **shell scripting:** The process of creating a list of commands in a text file
    that can run with a single command. Scripting saves the time of typing the same
    group of commands repeatedly at a command prompt.


    **SMTP (Simple Mail Transport Protocol):** A TCP/IP protocol used to transfer
    e-mail across a network, including the Internet.'
  merge: -1
