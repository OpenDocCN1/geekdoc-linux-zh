  md: '# Chapter 14: Checking Out the Linux File System


    your machine to automatically mount the remote /home directory. To accomplish

    this, follow these steps on each secondary machine in turn:


    +   1. Log in as root.


    No one but root should be logged in. Users have no home directories


    +   2. Open the file /etc/fstab in your favorite text editor.

    This file may look something like what you don''t see in Figure 14-4. Don''t let
