  md: '# 190 Part III: Getting Up to Speed with Linux


    3. Press the key or sequence of keys that executes what you want to do.


    Table 12-1 shows one group of commands that you may want to use.


    # indicates the optional ability to include a number so that the command works
    on more than one line, word, or character. If you don''t include a number, vi
    assumes a 1. Whenever you see an underscore (_), you need to specify a character
    that the command is to work on.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_217_0.png)


    | Keystroke(s) | Initial Cursor Position | Result |

    | --- | --- | --- |

    | a | One space before the place you want to add text. | vi enters Insert mode
    directly after the cursor''s position. |

    | p | Directly where you want the text to appear. | vi copies the buffered text
    into the document. |

    | # | Anywhere directly above where you want the new line to appear. | vi adds
    a blank line or lines below the cursor''s position and then enters Insert mode
