  md: '# 24 Part I: Getting Your Feet Wet


    +   Use an existing operating system to document the hardware. For example, if
    your system has Windows 9x/ME, go to the System Control Panel and choose the Device
    Manager tab. You can either write down the information or use the Print button
    to send the information to a printer. If your system has Windows NT (Workstation
    or Server), use the Windows Diagnostics tool to gather the information. The NT
    diagnostic utility also enables you to print out the information.


    +   Download PC hardware detect tools. If you don''t have any diagnostic tools
    and you have a relatively current version of DOS, you can download various PC
    hardware detect tools from the Internet.


    PC-CONFIG is a tool that you can download from the Internet at www.holin.com.
    The PC-CONFIG tool contains several screens of information and menus to choose
    hardware areas and options. This tool is shareware and the usage and fee information
    is available from the Holin Technik Web site.


    +   Gather information by reading the screen when the computer starts. If your
    system doesn''t contain any operating systems and you can resort to reading the
    screen as your computer starts. On some systems, video information appears as
    the computer boots. You may have to reboot several times to read the information
    if it goes too fast. Also, some systems display the PCI components and their settings
    as the system is starting up. Again, you may need to reboot several times to capture
    all the information.


    +   Access the BIOS (Basic Input/Output System) information. Stored in a small
    area of memory and retained by a battery, it is sometimes referred to as CMOS
    (which stands for Complimentary Metal-Oxide Semiconductor), which indicates the
    type of chip that can store and retain information. The type of information stored
    in the BIOS can be very little to quite a lot. Some newer systems may display
    screens of information about the computer''s hardware.


    In order to access the BIOS, you need to get into the BIOS before any operating
    systems load. Most manufacturers indicate the keyboard key or key sequence to
    get into the BIOS, or Setup, or, on the screen when the system is starting up.
    If you can''t find the keyboard sequence, check out the manufacturer''s Web site.
    After you''ve entered the BIOS, you typically navigate around with the arrow keys,
    Tab key, or Enter key. In some BIOS environments, the function keys are also used.


    One of the BIOS screens usually includes information about the computer''s drives
    — floppy drive, hard drive, and CD-ROM drive — and the amount of memory contained
    in the computer.


    BIOS screens usually includes settings for the type of mouse and other IDE settings.
    Your system may contain several other BIOS setting screens. Check these out to
    see if you can determine any more information about your system''s hardware.'
