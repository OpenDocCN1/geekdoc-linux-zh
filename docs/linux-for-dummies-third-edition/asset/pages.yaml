  md: '# Chapter 19: Ten Lovely Troubleshooting Tips 315


    If your Linux system is starting to use more swap space, your disk systems may
    begin to thrash. Thrashing occurs when your machine can accomplish nothing else
    but moving innards around on the hard drive.


    Take a look at your boot scripts and make sure you aren''t loading unused services
    when you start up the Linux system. You can typically find boot scripts in subdirectories
    below the /etc/rc.d directory.


    The top command is a good utility for observing the Linux system''s memory usage,
    CPU info, and which applications are using the most resources. Other utilities
    include free, which displays the amount of free and used memory, and df, which
    reports disk space usage. See Bonus Appendix D for more information on monitoring
    system resources.


    # Improving Internet Access


    To improve your Internet access, you can look at several things that don''t involve
    Linux. Check your local area for broadband or high-speed services. Linux works
    with many common broadband systems, such as cable modems and digital satellites.
    Because a lot of these technologies are recent or evolving, probably your best
    source for more information is the Internet.


    A Linux solution that can help improve your access is to set up a caching proxy
    server, which caches or stores in memory pages you''ve visited and, in most cases,
    also stores a copy on the local hard drive. This allows faster display of the
    Web page because pulling the file from memory is a lot faster than accessing the
    same file again on the Internet.


    One caching proxy server to investigate and possibly use is Squid. The Apache
    Web server can also be used as a caching proxy server.


    > I have not failed. I''ve just found 10,000 ways that won''t work.


    > Thomas Alva Edison (1847-1931)'
