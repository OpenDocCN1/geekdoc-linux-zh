  md: '# Checking Out Other Shells


    Other shells are available in Linux. We recommend two in particular that you can
    try out if you''re the type to experiment: tcsh and pdksh. Remember that a shell
    is your working environment. When you change the shell, you change certain things
    about how it works. Your prompt changes slightly. You have to do your shell scripts
    a bit differently. So, if you''re not into experimenting with these things or
    are just not ready yet, don''t change your shell (for now).


    # Meeting the enhanced C shell


    The enhanced C shell (tcsh) is a newer version of the older C shell, just like
    bash is a newer version of the old Bourne shell. If you''ve done a lot of C programming
    and are comfortable in that kind of format, then this shell may be for you. Although
    tcsh has a number of commands that you''re probably already familiar with, it
    also has additional environment variables that are unique to the C shell and its
    children and some that are unique to tcsh itself.


    If you''re interested in finding out more about this shell, type man tcsh at the
    command prompt. It may take you some time to read through, but keep plugging at
    it.


    # Meeting the Public Domain Korn shell


    ![](img/4e9f259b21147d1fb7569159ef49ec31_281_0.png)


    pdksh isn''t always installed by default. The Red Hat Package Managers (RPMs)
    includes pdksh in its own package on the Red Hat distribution CD-ROMs if you want
    to install it (and comes with most other distributions).'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Chapter 15: Customizing Your System


    # Changing your shell


    Has someone been going on and on to you about how one shell is cooler than another?
    Or, maybe you''re an inquisitive type and feel pretty comfortable in the default
    bash shell and are ready to see what else is available to you. You can change
    your current shell at any time using the chsh command.


    Before you change shells, however, you need to know which ones are installed on
    your system. So, type chsh -l to take a look. For example, you may see the following
    result:


    ```

    /bin/bash2

    /bin/bash

    /bin/sh

    /bin/ash

    /bin/bsh

    /bin/tcsh

    /bin/csh

    ```


    If you don''t see the shell you want to use, then you need to install it on your
    system. How you do so depends on the distribution that you use, but most distributions
    come with a nice collection of shells. You can have as many installed as you want,
    but you can only use a single shell at a time.


    When you''re ready to change your shell, type chsh -s /path/shell. For example,
    type chsh -s /bin/tcsh to change it to the C shell.


    # Constructing Your Own Kernel


    You''ve been happily using Linux, minding your own business, and then one day,
    futilely try to get a software package working that simply won''t cooperate. You
    get a distinctive error message, so you ask fellow Linux folks what you can do.
    What do they say in their attempt to be helpful? "Oh, just recompile the kernel."
    Uh huh. "Why don''t I disassemble and reassemble my car when I''m at it?" be your
    initial response. Believe it or not, this process really isn''t as painful as
    it sounds. Be brave and read on.


    # Deciding when to rebuild


    Actually, the reason to rebuild your kernel is often not as drastic as trying
    to solve error messages. We can think of many and varied reasons to rebuild a
    kernel. The following items are the most common of these reasons:


    +   * You need to add support for a new device or devices and don''t want to mess
    with individual device drivers.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 256 Part IV: Sinking Teeth into Linux


    +   - You want to go through the experience of rebuilding the kernel, just to
    find out more about it.


    +   - You''ve heard that rebuilding the kernel makes it smaller and faster. That''s
    mostly right. Some feel it doesn''t really change the speed all that much. But
    if you''re low on memory or want to check it out for yourself, go for it! A lot
    of unnecessary stuff is in there to make sure that the default kernel works with
    everything. For example, the default kernel contains support for many devices
    you don''t have and provides support for services that you don''t need. Fortunately,
    you can remove them.


    # Rebuilding the kernel


    Some folks find rebuilding an existing kernel easier than getting a new one. The
    processes are quite different. In a way, you''re about to get an introduction
    to compiling software. Don''t worry! This is a basic step-by-step kind of introduction.
    We''re also hoping to help you feel more comfortable later when you run into something
    besides the kernel that you have to compile.


    # Introducing the tools


    Because recompiling the kernel involves programming tools, you need to make sure
    you have all the necessary tools installed before starting. Otherwise, you may
    have to stop partway through and hunt down yet one more thing to install. In general,
    you need the following:


    +   - The GNU C compiler, which may be included as either gcc or egcs: This program
    is what''s used to take C programming language code and compile it (or change
    it) into a raw computer language that you can run.


    +   - The source code for the kernel: This package name is probably similar to
    kernel-source or Linux. It may also include the version number of the kernel.
    You also need the kernel header (these files contain code additions), which may
    be packaged separately.


    +   - The GNU C libraries: Many programs look to a bunch of files in order to
    reuse code during the compilation process. The kernel source code is no exception.
    These library collections are likely labeled libc or glibc.


    +   - Additional C compilation tools: These may or may not be bundled together
    for your distribution, but they should all be included in the package. Look to
    the Linux distribution''s documentation or Web site to find out what items you
    need to compile C programs if they are not in a recognizable package.'
  merge: -1
  pgno: 283
