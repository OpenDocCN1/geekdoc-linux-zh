  md: '# 98 Part I: Getting Your Feet Wet


    After you download a tarball file, you need to compile it and install the application.
    Don''t worry. You don''t need to be a programmer to do this. For an example, we
    downloaded a little graphical application that you can run within X that generates
    special effects.


    To go from a tarball file to a running application, follow these steps:


    +   1. Navigate to the tarball file directory using the cd command.


    +   2. At the command prompt, expand a .tgz file with the gunzip utility by typing
    gunzip filename where filename is the name of the .tgz file you want to unzip.


    The result of the gunzip command is to produce a tar file. In our example, the
    filename is fxd. tar. You must restore the tar file with the command.


    +   3. At the command prompt, type tar xv filename and press Enter, where filename
    is the name of the .tar file you want to expand.


    When you execute this, several lines of information appear on-screen. This is
    the name and locations of the files in the archive. The process places all the
    files in a subdirectory.


    In this directory, you may also find README, INSTALL, or HOWTO files. We recommend
    that you read these files. Sometimes, these files include information about how
    to compile the application or any software dependencies the application has.


    The next few steps compile the source into the application.


    +   4. Change to the subdirectory mentioned in Step 3 with the cd command, then
    enter /configure at the command prompt and press Enter.


    This process may take several seconds depending on the speed of your Linux system
    and the size of the software package. When the process has finished, the command
    prompt appears. If any errors occurred in this process, the problem appears on-screen.


    The next step uses the make command, which determines what portion of the programs
    to recompile and issues the necessary commands to perform the recompilations.
    This process usually takes longer than the previous process, possibly taking several
    minutes on some systems. While make is working, you see information on-screen.


    +   5. At the command prompt, type make.


    Now you can run the application. Because our example is an X application, we make
    sure that we perform this step in a command window of X. Use the cd command to
    change to the /src directory. Here you find the application.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_125_0.png)'
