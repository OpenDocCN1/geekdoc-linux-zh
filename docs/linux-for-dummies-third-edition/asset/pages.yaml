    # No driver? Write one! (or find someone who has)


    Linux contains many device drivers. If the one you need isn''t in the packaged
    software, you can usually find one easily enough. Here are a few well-known places
    on the Web that have device drivers you can use or can point you to another location
    that has drivers:


    ```

    www.rmfind.net

    www.linuxapps.com

    www.fresmeat.net

    ```


    You can also write your driver if you have programming experience. Usually, you
    may find it easier to write a device driver as a run-time loadable kernel module.
    You can easily use these modules as loadable modules, or compile them and add
    them to the kernel. The Linux development environment provides routines for accessing
    interrupts, I/O ports, and DMA channels. In addition, Linux provides many software
    routines that device drivers commonly use.


    # Adding Software to Linux Manually


    Linux provides tools to add software, such as productivity applications or games,
    from a GUI environment or the command prompt. You can make applications available
    to all users of the system by placing them in a common location such as the /usr
    directory. If the application is only for you or another single user, you can
    install the application in the home directory.


    You typically find installation software as a package. You may also find it as
    a tarball—files in the tar (which stands for tape archive) format. The package
    format is more common now and in some cases, has replaced the traditional tar
    format. Tools such as the Red Package Manager (RPM), make it easier to work with
    packages. However, software is often first released as a tarball before it''s
    packaged. A package may not be available for the software until several months
    later. In this section, we cover installing software from the command prompt using
    a tarball file.'
