    # Newsgroups


    Another veteran Internet service is the newsgroup service. Thousands of public
    newsgroups are accessible on the Internet. You can subscribe to the ones that
    interest you and participate in an open forum type of environment. Most common
    browsers have the built-in capacity to interact with newsgroups, but you can also
    use separate newsreader programs.


    Linux can provide newsgroup services on your intranet. Imagine that you have a
    project involving several people need to work out some ideas. With a news server,
    you can set up a discussion group for the project team in which they can exchange
    ideas and comments. Because a discussion group is threaded, you can follow a topic''s
    responses and replies, or thread, and read comment and comment on other people''s
    responses.'
