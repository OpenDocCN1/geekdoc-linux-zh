    ```


    # # System control


    These commands provide system-wide information and control. Many commands can
    be run by normal users of the system to obtain system information; however, those
    commands that actively change the configuration of the system need to run while
    you''re logged in as root.


    # # Kernel module handling


    You may sometimes need to add kernel support for an additional device (software
    or hardware). If this arises, you have limited choices: You can either rebuild
    the kernel or install a loadable kernel module. Although rebuilding a kernel doesn''t
    exactly require a Ph.D. in nuclear science, consider it a time-consuming nuisance
    that''s best to avoid. The following commands enable you to include the kernel
    support you need while the system is running.


    ```

    depmod, insmod, lsmod, modprobe, rmmod

    ```


    # # Processes


    Most of your system activity requires processes. When your system appears idle,
    a dozen or so processes are running in the background. These commands enable you
    to check under the hood to make sure that everything needs to be running is running
    and you''re not overheating or overtaxing resources.


    ```

    at, atq, batch, crontab, env, fuser, kill, killall, nice,

    pidof, pkill, ps, pstree, renice, sleep, top,

    usleep, watch

    ```'
