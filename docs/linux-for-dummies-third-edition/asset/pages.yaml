  md: '# Chapter 15: Customizing Your System


    Checking for and installing the tools in Red Hat Linux


    In this section, we walk you through how to check for the programming tools under
    Red Hat and its children. You need these same tools no matter what distribution
    you''re using — unless they have some other method of rebuilding kernels that
    we are not aware of — so pay attention to the package names even though different
    distributions probably don''t use RPMs.


    To ensure you have all the necessary tools installed in Red Hat Linux, follow
    these steps:


    +   1. Log in as root.

    2. Type rpm -q kernel-headers glibc-dev binutils cpp gcc ncurses-devel make kernel-source
    at the command prompt and press Enter.


    The combination rpm -q tells the RPM tool that you want to check particular packages
    are installed. What you see after entering the command is a list of all the package
    names that must be installed in order to build a new kernel. If you didn''t go
    out of your way to install the programming utilities, you get output similar to
    the following:


    ```

    package kernel-headers is not installed

    package glibc-dev is not installed

    package binutils is not installed

    package cpp is not installed

    package gcc is not installed

    ncurses-5.1-1

    package ncurses-devel is not installed

    package make is not installed

    package kernel-source is not installed

    ```


    +   3. Place the Red Hat CD-ROM in the CD-ROM drive.

    4. Type mount /mnt/cdrom and press Enter.

    5. Type cd /mnt/cdrom/RedHat/RPMS and press Enter.


    The Red Hat CD-ROM is mounted onto the file system.

    You change to the Red Hat packages directory.


    +   6. Make a note of which packages were not installed, in the exact order we
    list them in Step 2.


    RPM manages package dependencies, meaning that it watches out that you aren''t
    installing things that require absent programs to work properly. If you are missing
    the items that we''ve listed them in the order in Step 2, then you won''t run
    into dependency problems.


    +   7. For each package you need to install, type rpm -ivh packageName and then
    press Tab to complete the package name.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_284_0.png)'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 258 Part IV: Sinking Teeth into Linux


    8. Press Enter to install the package.


    The only item these instructions don''t work for is gcc, the GNU C Compiler is
    discussed in the "Introducing the tools." section earlier in this chapter. Type
    is gcc* to see which version you have of this package and make sure to type rpm
    -ivh gcc-* before pressing Tab. The # is the first part of the version number.


    # Creating the old configuration file


    An amazing number of options are available when you configure your new kernel
    from scratch, rather than being forced to configure by kernel, you have the option
    of building an old configuration file first. Later, when you open the configuration
    program, you can then modify whatever you already had rather than starting from
    the very beginning. Otherwise, you have to set every configuration option, which
    can get pretty tedious and confusing.


    To build this old configuration file, do the following:


    +   1. Log in as root.

    You need to be in the superuser account to have access to everything.


    +   2. Type cd /usr/src and press Enter.

    This directory contains the source code (raw material) directories for one or
    more programs.


    +   3. Type ls and press Enter.

    You should see at least one directory named linux. In Red Hat Linux, you see something
    similar to what''s shown in Figure 15-11, as an ls -l.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_285_0.png)


    +   4. Determine which directory you need.


    In all likelihood, you need either /usr/src/linux or /usr/src/linux-version.


    +   5. Type cd directory to the directory you chose in Step 4.


    +   6. Make type oldconfig to build the old configuration file.


    All the information scrolls across your screen as well as being stored in a file.
    Often, you see instructions on what you need to do next!'
