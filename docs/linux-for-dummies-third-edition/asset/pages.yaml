    The first line of many categories sets whether support is included for these items
    at all. In the case of old CD-ROM drive drivers (from before perhaps 1993), you
    have no reason to keep these items in the kernel. They''re just weighing down
    it. Click $n$ for this one.


    Disabling a category causes all its options to become unavailable.


    +   6. If you don''t often need this category but may need it sometime, then click
    the m diamond (assuming it''s available) if the line contains the word support.


    The Linux kernel isn''t all in one piece. There''s one big central piece that''s
    the kernel itself and then there are lots of little pieces called modules. The
    kernel picks up and drops modules as it needs them. Anything that you don''t use
    often (maybe a floppy drive driver) should be in a module to reduce the size of
