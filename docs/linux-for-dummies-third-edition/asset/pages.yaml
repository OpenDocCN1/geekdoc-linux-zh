  md: '# Shifting Netscape into Gear


    After you finely you tune your graphical Internet vehicle, it''s time to take
    it for the road test. In the following sections, we cover some righteous maneuvers
    with your Netscape browser.


    # Navigating the Navigator


    Netscape Navigator is your viewing window into the wonderful World Wide Web. Its
    primary purpose is to fetch Web pages on your command, download all the graphics
    and related files into your computer''s memory, and finally render the page for
    your interactive, viewing pleasure. The default protocol used for fetching Web
    pages is HTTP (or Hypertext Transport Protocol).


    We know what you''re thinking: "Doesn''t information run around the Internet in
    like TCP/IP packets? What use is this stuff? Well, HTTP is a packaging protocol
    that describes how data gets boxed for shipment. Does it make sense to sync your
    shaker collection in one box, or to send each piece at a time in separate envelopes?
    Different transport protocols are designed to make efficient use of network resources.
    Other protocols that ride the TCP/IP freeway include FTP and Telnet. Although
    more appropriate tools are available for moving files around the Internet, such
    as FTP, your Netscape browser has the built-in ability to download files (move
    files to your local computer) straight from the browser window!


    When your browser first starts, the home page that you''ve designated in your
    Preferences dialog box appears (see the "Configuring Netscape Communicator" section
    earlier in this chapter).


    www.yahoo.com, shown in Figure 8-3, is a popular starting point for many Web users.
    Any text that is blue and underlined is a hyperlink. Just click any of these links
    once and your browser sends a request to that site for a peek. If successful,
    a new Web page is loaded in your browser with more links, images, and digital
    potpourri.


    A Web page usually has many backward, but none forward. In other words, a Web
    page is a pretty good idea about where you''ve been, but doesn''t know where you''re
    going. Your browser is good at leaving popcorn on the cybertrail so that you can
    find your way back to the last page you visited, simply click the Back button
    at the top of the browser.


