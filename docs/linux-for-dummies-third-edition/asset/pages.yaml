- img_proc: true
  md: '# 140 Part III: Getting Up to Speed with Linux


    # Getting information about specific files


    You can zoom in and focus on specific files. Of course, you can use the ls command
    to do this. Typing ls filename gives you the short listing (where filename is
    the name of the file you''re interested in), which isn''t all that useful unless
    you weren''t sure the file was there in the first place. What is more useful is
    ls -l filename (again designating a specific file for filename), which gives you
    a single line in the same format as the entire directory with the ls -1 command.


    You''re now getting into file types. The very first letter in any long format
    listing (ls -l results) tells you what type of file you''re dealing with. In Table
    9-2, we list the types of file you''re likely to run into.


    | Label | Type | Description |

    | --- | --- | --- |

    | | Regular file | The item is an everyday file, such as a text file or program.
    |

    | b | Block device | The item is a driver (control program) for a storage medium,
    such as a hard drive or CD-ROM drive. |

    | c | Character device | The item is a driver (control program) for a piece of
    hardware that transmits data, such as a modem. |

    | d | Directory | The item is a container for files, also referred to as a folder
    in some operating systems'' lingo. |

    | l | Link | The item is either a hard or soft link. |


    Why does a directory show up under file types? Linux sees everything as a file.
    Text files, directories, monitors, hard drives—they''re all files to Linux. The
    file type designation helps the Linux kernel understand how to deal with the file
    in question.


    Linux has commands that can give you something bit easier to understand than a
    raw file listing of information. The first of these commands is simply named file,
    which directly tells you what kind of file you''re dealing with. For example,
    if you typed file /home, you would get the following result:


    ```

    /home: directory

    ```


    ![](img/4e9f259b21147d1fb7569159ef49ec31_167_0.png)'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Chapter 9: Files and Directories


    The file command even traces links for you! You can use it with links in two different
    ways. If you just use the file command by itself, it tells you about the exact
    item you gave it. When you use the -L flag with file, it traces a link back to
    the original and gives you an answer based on the original. So, the query file
    -L /usr/src/linux actually turns into file /usr/src/linux-2.2.14.


