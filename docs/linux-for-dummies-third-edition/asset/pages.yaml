    # Zen and the Art of Linux Configuration


    Anyone can use Linux but become a true Linux master requires an intimate knowledge
    of your system''s internal mechanics. This is a daunting task when you consider
    that Linux is the sum of many different software subsystems, each written by different
    programmers from different backgrounds and beliefs regarding problem solving.
    Fortunately, software developers try to comply with a few universal truths. One
    of these truths is that mortals must be able to configure the program.


    You can define a computer program as a series of instructions that direct the
    computer to perform a specified task. You can change any instructions that are
    hard coded into the program (unless, of course, you make the required changes
    to the source code and recompile them.) As you can imagine, the slightest variance
    in program requires the handwork of a skilled programmer. What if you had to edit
    the kernel code to include the new username and password and then reclaim your
    system every time that created a new user for your system?


    Most Linux subsystems are comprised of, at least, the following files:


    +   * The executable file: most likely a binary file that only speaks the language
    of the computer. (You undoubtedly experience this firsthand at some point when
    you attempt to view one of these files and your screen gibkersish and noise you.)

    * The configuration file: a simple text file that you can view and alter with
    your favorite editor.


    The executable file reads directives from the configuration file to know how to
    behave. Keep in mind that the executable must understand the directives in the
    configuration files. Any old command doesn''t work. This is why it''s imperative
    that you RTFM (Read The Fine Manual) prior to doing any heavy lifting in a configuration
    file. Configuration formats are as different as snowflakes and very complex. For
    example, the Sendmail configuration is one of the most notorious; if not forewarned,
    you may think that the sendmail cf is a message from a distant planet. This complexity
    is directly correlated to the flexibility and power of the program.


    It''s the scope of this book to provide details on any of these configuration
    files. We identify them and show you where to find them and let your curiosity
    take it from there.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_81_0.png)'
