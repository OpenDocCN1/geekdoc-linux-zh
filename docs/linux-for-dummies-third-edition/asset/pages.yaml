    Figure 6-3 A sample of /proc/pci file


    **Device drivers:** The code containing commands directed to the controllers is
    commonly referred to as a *device driver*. You can think of it as software that
    talks to the device and makes it work. Many applications on your Linux system
    use device drivers. To make these commands readily available to applications,
    the Linux kernel contains the device driver. Including the device driver in the
    kernel also provides two other benefits: Keeping one copy of the code eliminates
    extra baggage by reducing drive space, and it provides one point where you can
    add new devices and driver updates. Both PCI and ISA hardware components use device
    drivers.


    # Adding Hardware to Linux


    When Linux starts, each device driver contained in the kernel or in the startup
    files is initialized. Each device driver looks for the hardware device that it''s
    controlling. If the hardware isn''t physically present, the system'
