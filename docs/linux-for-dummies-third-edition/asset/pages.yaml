  md: '# Chapter 2: Prepping Your Computer for Linux


    In this chapter, we concentrate on preparing to install Linux from the CD or with
    the installation floppy disk.


    +   - Determine where on your target hard drive you want Linux to reside.

    If your computer already has an existing operating system, you can choose to retain
    that operating system, and have the option to boot to Linux or the other operating
    system. You can also choose to remove any existing operating systems and install
    just Linux. Furthermore, you can install another operating system or another Linux
    system later. All of this depends, of course, upon much hard drive space you have
    available. In this case, you may want to make sure that you leave some disk space
    for any future operating systems. In Chapter 3, we address the different installation
    options that can affect your disk architecture.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_48_0.png)


    You must complete some basic tasks prior to beginning Linux installation. The
    first of these is to locate the documentation. If you encounter a required configuration
    setting or problem during installation, the documentation may help you get over
    the roadblock. Linux documentation can help you get the most out of your system
    after installation. Depending on your Linux distribution and how you obtained
    it, documentation may exist in different forms. Some come with printed documentation
    and most include the documentation on the CD or CDs. In addition, most distributions
    have the documentation available on Web sites. If you come across a situation
    that the documentation doesn''t cover, refer to your distribution''s Web site
    or check out one of the many Linux reference sites.


    # Knowing Your Hardware


    Before you begin installing Linux, document your computer''s hardware. The critical
    items that you need to note are the processor, memory, hard drive(s), CD-ROM drive,
    video card, monitor, network card, modem, and printer. We explain this detail
    in the following list:


    +   - CPU (central processing unit): Linux can run on a wide range of processor
    brands, speeds, and models. In general, the faster the processor, the better your
    performance. Other than maybe some really, really old processors and architectures,
    your system should do just fine.

    - RAM (random access memory): Linux doesn''t require a lot of memory to run when
    compared to other popular current commercial operating systems. But you should
    still have at least 8MB of physical memory and you''ll do better with a minimum
    of 32MB. Of course, Linux supports a huge amount of memory if your system has
    more than 32MB of RAM.


