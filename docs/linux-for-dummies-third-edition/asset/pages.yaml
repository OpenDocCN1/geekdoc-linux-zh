  md: '# 314 Part V: The Part of Tens


    # # Saving System Security


    One of the most important security things that you must remember is: DO LOG IN
    AS ROOT. If you need to perform a task that needs this type of permission and
    you''re already logged in using your account, use the command to temporarily gain
    access as root. When you complete doing the task that requires the root account,
    use exit to go back to the current user account.


    The following are other considerations that you need to keep in mind regarding
    security:


    +   * Make sure that your user accounts require passwords.

    * Utilize file system security to restrict access to specific files or directories.

    * Put a firewall between your network and the outside if your network is interfacing
    another network over which you don''t have control. You can find many good references
    on the Internet for configuring Linux as a firewall.

    * Use the command to determine who is actually attached to your system and what
    resources they''re using. Here you may find unwanted users, or notice that an
    account has been logged in for an unusually long period of time.

    * Be aware of security holes in Linux (or any operating system). You can usually
    find good documentation and discussions regarding security issues in some of the
    larger online forums.

    * Check the SANS (System Administration, Networking, and Security) Institute,
    which maintains information about most operating systems and potential areas where
    security can be compromised. Go to www.sans.org and take a look at their Web site.
    You can also add yourself to an e-mail list that sends out weekly security reports.

    * Go to www.bastille-linux.org for information about a current Linux project that''s
    striving to identify and fix Linux so that it''s an even more operating system.


    # # Tuning In to Performance Problems


    The amount of physical memory and swap space you''re using may affect performance.
    If you have a fast CPU and lots of disk space but very little memory, your system
    may suffer. Make sure you have sufficient physical memory to handle the services.'
