    After booting from the CD-ROM fails (if there''s not a bootable CD-ROM in the
    drive), the system then checks the floppy drive, then the hard drive, and finally
    a network boot configuration. In your system''s BIOS, make sure the CD is listed
    first in the sequence. Make sure to save your changes before exiting the BIOS;
    otherwise, the items you don''t take effect.


    # Setting Up to Boot from the Floppy Installation Disk


    If your system cannot boot from a CD, the Linux installation CD isn''t bootable,
    or you just don''t want to boot from the CD, you can start the installation from
    a floppy disk. Some distributions include the installation boot floppy disk, but
    some don''t (Red Hat Linux 7, which accompanies this book, does not). Whatever
    the situation is, you can make the installation floppy on another system that''s
    running MS-DOS or Windows or Linux.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_53_0.png)


    When you''re creating a Linux installation boot disk, the original contents of
    the floppy disk are erased, so make sure the disk contains nothing that you want
    to keep.


    Usually, a directory of DOS utilities is on the Linux installation CD — it''s
    called dosutils on CD1 that comes with this book. The name of the utility that
    creates the installation boot disk is called writer.exe. The documentation for
    writer is located in the same directory as the utility. You can use Windows Explorer
    or the DOS dir command to investigate the contents of the /dosutils directory.
    In addition, the CD1 also contains disk image files, which contain the information
    that''s copied to the installation boot disk. With Red Hat Linux 7 on CD1 that
    comes with this book, image files are kept in the /images directory. The images
    directory contains images for English and other languages.


    To make an English-language boot disk on a Windows 9/ME system using Red Hat Linux
    7 and the CDs that came with this book, follow these steps:


    +    Insert CD1 that came with this book into the CD drive and make a note of
    the drive letter that corresponds to your CD drive.'
