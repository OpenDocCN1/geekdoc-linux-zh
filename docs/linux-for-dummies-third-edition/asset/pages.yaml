    host: A computer on a network that stores data that is accessed by users. A host
    on a TCP/IP network must have a unique IP address.


    HTTP (HyperText Transfer Protocol): The protocol that serves as the base for Internet
    communications, defining how messages are formatted and transmitted and how Web
    servers and browsers should respond to requests.'
