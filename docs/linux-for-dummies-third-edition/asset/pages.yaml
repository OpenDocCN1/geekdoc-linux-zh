  md: '# Chapter 8


    # Surfing the Web and Managing E-mail with Netscape Communicator


    **In This Chapter**


    +   - Installing and configuring Netscape Communicator

    - Surfing technique tips and tricks

    - Test driving your e-mail

    - Subscribing to newsgroups


    > Give a man a fish and feed him for a day; teach him to use the Net and he won''t
    bother you for weeks.


    — Anonymous


    Assuming you have your dialup networking configured (as we discuss in Chapter
    7), you can now get on with doing interesting with the Internet. In this section,
    we introduce you to a few useful communication utilities that provide you with
    the tools of the Internet trade.


    Many hold the graphical Web browser personally responsible for the growth of the
    Internet. The Internet has been around for much longer than the invention of the
    browser. It is just that most of the work done on the Internet was in plain old
    text, which had little attraction for its belonging to the more spatially oriented
    of the species (that is, we preferred picture books as young children).


    Several graphical Web browsers are available for Linux. The most popular, and
    also the browser included with Red Hat Linux 7 on the CDs that come with this
    book, is Netscape Communicator, which does far more than just display Web pages.
    You can use Communicator to manage your e-mail and newsgroup subscriptions as
    well.'
