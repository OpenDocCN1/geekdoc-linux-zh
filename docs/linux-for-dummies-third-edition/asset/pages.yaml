    searches specified document directories and info man pages.

    - System Configuration (LinuxConf): Provides another way to start the

    LinuxConf discussed earlier in this chapter.


    # Shooting Trouble, Configuration-wise


    Unfortunately, no single, proven method for troubleshooting an errant config-

    uration exists. As you probably know, Linux is an orchestra comprised of

    any different processes. The more understanding you have of the structure

    and process of Linux, the better your troubleshooting ability.


    Becoming adept at Linux requires you to develop your own troubleshooting

    techniques. Here are a few pointers to help you along the way:


    +   - RTFM (Read The &#! Manual): We can''t stress this enough (neither

    could ever started the acronym?). Read through the documentation

    that with the software in question. Read the man and info pages

    they exist. Be sure that any configuration files have been formatted

    correctly.

    - Log files: tail the log files for possible errors written to the kernel

    located in /var/log/.

    - Command prompt options: Set command prompt options for debug-

    g. Often, commands have debugging, or verbose, options that perform

    more status reporting. Most commands must do their job and return you

    to the prompt, a verbose option provides more feedback as to what

    the command is doing.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 72 Part I: Getting Your Feet Wet


    +   - Dependent services: Make sure that supporting services are running. Some
    processes may require that others are already running.


    +   - File permissions: A common problem. Make sure that all the files and directories
    that are required by this service have the required permissions. Read the man
    page for the process to see what required files you may need.


    +   - Check returned error code: Compiled programs often return an error code
    in the form of an integer. A zero (0) indicates that the process ran successfully;
    any other code code indicates a problem. Usually the documentation lists the possible
    error codes and their meaning.


    +   - Use the Internet community: If you are trying to configure a well-known
    and well-used program, chances are someone has gone before you and perhaps encountered
    a similar problem. You can probably find an instant solution after a quick search
    through the newsgroup archives at www.deja.com/usenet.


    +   - Learn bash shell programming: Many processes are started by a shell script.
    If you understand the basics of shell scripting, you can follow through the code,
    trying each step manually to determine where the problem lies. See *Linux Programming
    For Dummies* by Jim Keogh (IDG Books Worldwide) to get up to speed on *bash* shell
    programming.'
