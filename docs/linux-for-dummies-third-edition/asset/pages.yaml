    # Turning to TCP/IP


    > It''s a good thing — Martha Stewart


    You can make it all the way to the Internet without one single mention of Internet
    Protocol (IP) numbers helping you get there! That demonstrates the'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# 112 Part II: Internet NOW


    progress that renders Linux easier to use. Rest assured, TCP/IP is still humming
    away in the background, doing its job of carrying information packets for you
    in all its complex and robust glory.


    Transport Control Protocol/Internet Protocol (TCP/IP) is a set of rules for moving
    information from one point in a network to another. These TCP/IP rules of packet
    delivery are similar to the methods a parcel service uses to move packages. Each
    package contains a label with a destination and return address and also contains
    something important to the sender/or receiver. Using this address, the package
    carrier can make a decision how to route the package. Its intended destination
    until it arrives. The network component that provides this routing information
    is known as, strangely enough, a router.


    Every computer on a TCP/IP network requires a distinct IP number. You have two
    methods that you can use to assign your number to the computer — static and dynamic.


    You assign a static IP number when you configure the machine; the number stays
    the way you assign it until you change it. Servers and other computers that are
    required to service the network usually have static IP numbers.(Static IPs are
    generally administered by seasoned professionals.)


    Typically, dialup Internet users or workstations logged into the network use dynamic
    IP numbers. If your computer is configured to obtain an IP number dynamically,
    it requests an IP number from another network host configured as a Dynamic Host
    Configuration Protocol (DHCP) server has authority for a range of IP numbers that
    it can assign to trusted clusters. The DHCP server also provides other services
    such as dishing out DNS, gateway, and routing information — that are otherwise
    required to know — and stitching it into those cryptic and sometimes elusive configuration
    files.


    You can be thankful that the dialup networking tools provided with your Red Hat,
    along with services provided by your ISP, perform these geeky functions for you
    transparently.


    The IP number looks like this to your computer (remember, the computer stores
    information in the form of ones and zeros):


    ```

    1101001110101011110101011100100

    ```


    Ouch, do your eyes hurt?


    ```

    11010010.1001010.11110101.01100100

    ```


    Is that any better?… not hardly?'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Chapter 7: Connecting to the Internet 113


    209.148.245.100


    What about this?


    The last example is a decimal representation of the first binary number example.
    Known as an IP number, every computer on the Internet requires a unique one.


    IP numbers represent 32 bits of information. With 32 available address bits, only
    4,294,967,295 IP numbers exist. When six billion of the Earth''s inhabitants connect
    to the Internet at the same time, we don''t enough IP numbers to go around. The
    current IP standard is known as IPv4. Experts are actively discussing the IPv6
    standard, currently on the proverbial board. Due to the explosive growth of the
    Internet, along with the problem of dwindling IP numbers, are other design considerations
    that the original TCP/IP architects were never expected to encounter. IPv6 calls
    for a 128-bit address that provides addresses for our planet, along with a few
    million more inhabited planets that we may connect with in the future. We suspect
    that there was at least one AOL disk sent with Voyager into deep space.


    The IP number is the mailing address for your information packages. Granted, the
    casual cybestrian doesn''t keep a list of IP numbers for friends; rather, we use
    symbols that are more familiar to them. The Internet uses an ingenious method
    for resolving names into IP numbers: the *Domain Name System*, or DNS.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_140_0.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_140_1.png)


    # Dealing with DNS


    DNS is a distributed database of information across the Internet that maps IP
    numbers to names meaningful for humans. For example, when e-mail is sent to an
    address such as woodsmormonlake.us,com, our computer networking system sends an
    IP number and has no idea where, what, mormonlake.us. The DNS service resolves
    mormonlake.us into an IP number that stamps on the e-mail package and ships through
    the Internet. The personal address of woodsman is no concern to the routing address,
    it becomes the part of the envelope that the recipient host uses for knowing where
    to place the message — woodsman''s P.O. box, of course!


    Like an experienced librarian, a DNS server doesn''t know everything, but simply
    knows where to look and who to ask for information. The DNS system is comprised
    of work hosts that has the authority over a specific domain of computers. If you
    want information about a computer within a specific domain, you can query the
    DNS server that has authority for that domain. This method distributes responsibility
    for relying on a designated, single computer servers constantly maintain the Internet''s
    who directory. You can visit the Network Solutions site at www. networksolutions.com.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_140_2.png)'
  merge: -1
