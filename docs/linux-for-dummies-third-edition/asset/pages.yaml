    have to decide if you want to get rid of all the packages that need this one first.


    We know, this is a pretty involved process. Get to know a lot about your system
    all the way, however, and the more you know, the better off you are.


    # Being Vigilant


    One last security issue that you may want to configure concerns log files. Your
    network programs, kernel, and other programs run all log files, which contain
    records of what''s been happening on your system. You may be amazed at just how
    much information gets put in them! They''re mostly in /var/log; take a look sometime.
    It''s frightening.'
