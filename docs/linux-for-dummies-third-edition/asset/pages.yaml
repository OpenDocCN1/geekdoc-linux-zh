  md: '# # Linux For Dummies, 3rd Edition


    # # vi quick reference


    | Command | Description |

    | --- | --- |

    | A | Enter insert mode directly after the cursor''s position |

    | P | Copy buffered text into the document at cursor''s position |

    | U | Undo the last command |

    | #CC | Cut the entire selected line(s) |

    | #d > | Delete the specified characters |

    | #dd | Delete the entire selected line(s) |

    | #o | Add a blank line below the cursor and enter insert mode |

    | #x | Delete the specified characters into the buffer |

    | #yy | Copy the specified line(s) into the buffer |

    | :WQ | Save a file without closing it |

    | Esc | Return to command mode |

    | Shift+ZZ | In command mode, save and close a file |


    # # mtools


    | Command | Description |

    | --- | --- |

    | mcat [options] sourcefile targetfile | Write raw data to a diskette |

    | mcopy [options] sourcefile targetfile | Copy files on to an MS-DOS formatted
    disk and from Linux without manually mounting the floppy device |

    | mdel [-v] msdosfile [msdosfiles] | Delete a file on an MS-DOS formatted diskette
    |

    | mdelete [-v] msdosdirectory [msdosdirectories] | Delete entire MS-DOS tree structure
    |

    | mdir [options] msdosdirectory | Display the contents of an MS-DOS directory
    on diskette |

    | mformat [options] drive: | Add an MS-DOS file system to a floppy diskette |

    | mmount msdosdrive [mountargs] | Mount an MS-DOS formatted device |

    | mmove [options] sourcefile targetfile | Move or rename an MS-DOS file on a formatted
    diskette |'
