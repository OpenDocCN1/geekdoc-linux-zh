    the Main Menu and choose Programs>System>System Info. The GNOME System Info appears.
    To see the disk information, click the Disk Information tab, as shown in Figure
    16-14.


    Figure 16-14: Checking your disk info.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_306_1.png)


    # Tweaking to Handle Busy Linux Servers


    If you''re going to use Linux as a Web, e-mail, or FTP server for a large organization''s
    intranet or a server accessible from the Internet, you must consider aside performance
    issues. For these types of servers, you will need plenty of physical memory and
    the fastest storage systems and other hardware you can find.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 280 Part IV: Sinking Teeth into Linux


    If Linux is performing a lot of CPU-intensive tasks, such as rendering graphics,
    then multiple processors may help speed up these tasks. Linux supports SMP (symmetrical
    multiprocessing) and automatically installs the appropriate kernel elements for
    SMP support.


    To help disk-intensive services, such as reading and writing lots of data, SCSI
    is better suited for these tasks than IDE. You can add more physical drives to
    a SCSI system than you can with IDE. IDE supports up to four physical drives per
    computer but SCSI supports up to seven drives on one interface channel. In addition,
    you can have more than one SCSI interface channel per computer and therefore can
    handle more than seven drives. The architecture of SCSI permits faster access
    to stored data and faster writing of information. For more details on SCSI and
    IDE, see Chapter 2.


    If you''re considering RAID 5 (Redundant Array of Inexpensive Disks) on Linux,
    the vast majority of solutions are SCSI based. RAID 5 provides hardware fault
    tolerance in the event of disk failure and is a common hardware solution on mission-critical
    servers. Refer to the following Web site for Information about RAID 5 and Linux.


    ```

    www.redhat.com/support/docs/tips/raid/RAID-INDEX.html

    ```


    To reduce disk swapping, make sure you have plenty of physical memory so that
    you need only a little swap space. You can monitor the amount of swap space with
    the free command, which we cover in the "What''s in the memory" section earlier
    in this chapter.


    Separating tasks across multiple servers helps memory usage by dedicating the
    Linux system''s resources to one task, such as serving Web pages, instead of splitting
    its resources among different services. Dedicate Linux systems for your Web services
    and use others for e-mail, FTP, and so on.'
