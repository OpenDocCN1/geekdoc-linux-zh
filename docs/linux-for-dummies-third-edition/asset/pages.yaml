  md: '# # Starting up and shutting down


    Linux is anything but an idle system. Running the top command at the command prompt
    reveals a couple dozen processes are running in the background at any time. These
    processes were spawned somewhere along the way, likely during the boot process.
    Understanding the startup and shutdown procedure is critical to configuring the
    behavior of your Linux system. By configuring the startup procedure, you can fine
    tune your Linux computer to start just the processes you want and need while leaving
    others out of system memory.


    All processes have been spawned by an existing process. A program called init
    is the first process started by the kernel at boot time. All subsequent processes
    can trace their lineage to the init process. The file that directs the behavior
    of init is called /etc/inittab. init performs a few system operations and manages
    another program rc that performs the details of the startup process.


    First, rc runs a script called /etc/rc.sysinit. This performs general, system-level
    operations and environment settings that are required regardless of runlevel.
    rc then executes the script links in the subsequent runlevel directory. Finally,
    rc runs the shell script called /etc/rc.d/rc.local, which provides any post startup
    functions required after loading runlevel-specific scripts.


    You can think of each runlevel as a different boot configuration. When your system
    boots you can choose to only allow yourself as a user, allow others to log in
    to your system (multi-user), or allow multi-user access with networking. These
    are three common runlevel examples. The runlevel directory contains symbolic links
    to the /etc/init_d directory where all the startup scripts are located. You will
    notice that each runlevel has a separate directory. Adding or removing a service
    from a particular runlevel is as simple as adding or deleting the symbolic link
    from the runlevel directory.


    The seven runlevels, along with their intended purpose, are as follows:


    | Runlevel | What It Does |

    |---|---|

    | 0 | Perform an orderly shutdown of all processes and halt the CPU |

    | 1 | Single-user-mode; used primarily for maintenance and troubleshooting |

    | 2 | Multi-user mode without networking |

    | 3 | Multi-user mode with networking |

    | 4 | User defined |

    | 5 | Multi-user mode with networking and X display manager |

    | 6 | Perform an orderly shutdown and subsequent reboot to default runlevel |'
