    The file closes, and you''re now back at the command prompt.


    The second method of saving a file involves saving without closing. To save a
    file and keep working on it in vi, follow these steps:


    +   1. Press Esc to enter Command mode from any mode you may currently be in.


    The layout of this screen looks familiar (see Figure 12-1).


