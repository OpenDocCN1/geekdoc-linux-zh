  md: 'another modem, which translates the analog signals back to digital for the

    receiving computer.


    **motherboard:** In a computer, the main circuit board into which all components

    (video card, RAM, CPU, controller cards, and so on) plug to operate together.


    **mount point:** In Linux, a disk partition.


    **Netscape Navigator:** The Web browser that''s part of the Netscape

    Communicator suite.


    **newsgroup:** One thousands of online discussion groups on the Internet

    in which participants post and read messages and share information on a

    particular topic of interest.


    **NIC (network interface card):** An adapter card in a computer that has one or

    more ports to which a network cable attaches. The NIC is the hardware inter-

