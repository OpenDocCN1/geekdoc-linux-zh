  md: '# 262 Part IV: Sinking Teeth into Linux


    +   6. Type make clean and press Enter to get rid of the temporary files your
    computer created while building the kernel.


    You now have your very own custom kernel! Linux doesn''t know about it yet, though.


    # Moving the kernel into place


    When Linux builds a kernel for you (see the previous section for more information),
    it places the main file in a temporary location. You have to manually put the
    kernel in its new home. There are a number of reasons for this. The main reason
    is that the programs doing the building don''t know whether you want this kernel
    to replace an old one, what you want to name it, or a number of other issues that
    are critical to not messing up your system. Remember, the kernel is Linux itself!


    Do the following to put your kernel into place:


    +   1. Type cp /boot/vmlinuz /boot/vmlinuz.old to make a backup copy of the kernel
    you''re using right now.


    Never delete the old kernel before you test the new one!


    +   2. Type locate bzimage and press Enter.\Not all distributions put the new
    kernel image in the same place. This command makes sure you aren''t lost it in
    the next step!


    +   3. Type cd /usr/src/linux/arch/x86/boot or the equivalent that matches your
    new kernel was placed.


    Change the directories as necessary. You may need to change the linux part to
    linux-version, for example.


    +   4. Type cp bzimage /boot/vmlinuz to replace the old kernel.

    This is why we backed up the old kernel in Step 1.


    +   5. Type cp /usr/src/System.map /boot to copy the new map file into the boot
    directory or partition.


    Now all of the kernel files are properly in place! Next, you have to tell Linux
    how to find them.


    # Telling Linux about the kernel


    Linux needs to be able to find the kernel at boot time. You have to be careful
    at this point because you can''t be 100 percent sure that this new kernel—the
    one that we show you how to build in the previous sections — is going to work!
    So, we tell Linux the new one, but leave ourselves with the option of using the
    old one if we need it. To do so, follow these steps:


    +   1. Type cp /etc/lilo.conf /etc/lilo.conf.backup to create a backup of your
    boot loader''s configuration file.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_289_0.png)'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Chapter 15: Customizing Your System 263


    2. Type vi /etc/lilo.conf to open the LILO configuration file.


    This file contains something like the following:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    message=/boot/message

    linear

    default=linux


    image=/boot/vmlinux-2.2.16-17

    label=linux

    read-only

    root=/dev/hd1

    ```


    3. Press i to enter the Insert mode.


    4. Cursor down to the line above the line containing the word image.


    5. Add the following section:


    ```

    image=/boot/vmlinux

    label=linux

    read-only

    root=/dev/hd1

    ```


    Make sure that the root line is the same as it is in your file''s other line.
    For example, in Step 2, the root line is:


    ```

    root=/dev/hd1

    ```


    This matches what we have in this step''s root line.


    6. Edit the original label statement (such as in Step 2) so that it ends as the
    following:


    ```

    label=linux-old

    ```


    The second half of the file now looks similar to the following:


    ```

    image=/boot/vmlinux

    label=linux

    read-only

    root=/dev/hd1

    ```


    ```

    image=/boot/vmlinux-2.2.16-17

    label=linux-old

    read-only

    root=/dev/hd1

    ```


    7. Press Esc to return to the vi Command mode.


    8. Type ZZ and press Enter to save and close the file.


    9. Type /etc/lilo-v and press Enter to rerun LILO so that it loads the new options.'
