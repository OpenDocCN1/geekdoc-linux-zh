  md: '# Using the CD


    You can take either of two basic approaches to using the Red Hat Linux installation
    CDs. We cover each of these in separate step-by-step lists. Here''s where we will
    tell you how to pick which set of instructions you''ll want to follow. The two
    ways to use these CDs are as follows:


    +   - If you boot from your CD drive (and this probably means you''ve got a newer
    PC, probably with a Pentium processor or better), follow the instructions in the
    section, "Booting from the CD."

    - If you can''t boot from your CD drive, for whatever reason, follow the instructions
    in the section, "Booting from a Linux Floppy." This means that you boot from a
    Linux boot floppy, with CD1 that you can create with this book already inserted
    into your CD drive (to create a Linux boot floppy to enable this approach, please
    check out the instructions in Chapter 2). The floppy disk handles the very beginning
    of the process and turns the rest of the installation over to the CD.


    # Booting from the CD


    To install the items from the CD to your hard drive, follow these steps:


    +   1. **Insert the CD into your computer''s CD-ROM drive.**

    2. **Reboot your PC.** (As long as your PC is configured to boot from the CD,
    this starts the Linux installation process for you automatically.)

    3. **Congratulations!** The Linux installation process is now underway. For the
    rest of the gory details on this fascinating task, please consult Chapter 3.


    # Booting from a Linux floppy


    To install the items from the CD to your hard drive with a boot disk (we show
    you how to make one in Chapter 2), follow these steps:


    +   1. **Insert the CD into your computer''s CD-ROM drive, and insert a bootable
    Linux floppy into your floppy drive — see the instructions for creating a bootable
    Linux floppy in Chapter 2.

    2. **Reboot your PC.** (This starts the Linux installation process for you automatically.)

    3. **Congratulations!** The Linux installation process is now underway. For the
    rest of the gory details on this fascinating task, please consult Chapter 3.'
