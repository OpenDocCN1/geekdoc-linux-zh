    -rw-r--r-- 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee dee 124 Jul 27 06:50 .bashrc

    ```


    Now you get to files, which we recognize by the first character. Files are always
    listed after directories when you use -1. The permissions for all these items
    are the same. Their first triad is rw-, which means that the owner (dee) can view
    the file''s contents and edit them. The second and third triads for these are
    r-- Anyone in the group can view the contents of these files, and everyone on
    the entire system can as. Each has only one link, a different size in bytes, and
    was created at the same time — in this case, when the account itself was created.
    The names for these files are .bash_logout, .bash_profile, and .bashrc.


    # Line seven


    ```

    -rw-r--r-- 1 dee dee 0 Jul 29 07:48 l1file

    ```


    This item is also a file. You can tell because the first character is a dash.
    Its first two triads are identical (rw-), meaning that the owner (dee) and members
    of the group (dee) can view both the file''s contents and change them. Everyone
    else, however, can only view the contents because the last is r-- There is only
    one link, and this item is owned by the user and group dee. It''s empty too, indicated
    by the file size — 0 bytes. After the creation or modification date and time,
    we see the file''s name: l1file.


    # File Managers


    Tired of typing at the command prompt? If you prefer, the GUI contains a bunch
    of file managers for you to use. A file manager is a program, such as Windows
    Explorer, enables you to go through and manipulate your files and directories
    with your mouse instead of the command prompt. In this section, we take you on
    a tour of the file managers that, by default, come with popular Linux distributions.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 154 Part III: Getting Up to Speed with Linux


    # Campaigning with the GNU Midnight Commander


    In the GNOME desktop environment, the default file manager is the Midnight Commander,
    also referred to as the GMC. You can find this program in GNOME by clicking the
    Main Menu button to open the Main Menu, and then clicking the File Manager menu
    option. Figure 9-2 shows an example of what you can see with the GMC open.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_181_0.png)


    Figure 9-2: The GNU Midnight Commander.


    The workings of this file manager should seem familiar compared to those from
    other operating systems. The GMC has the same two-panel layout and click drag
    functionality that you''re probably used to.


    # Browsing your files


    Moving through the file system is pretty easy in the GMC. The main thing that
    you need to keep in mind is that your directories are on the left and your files
    are on the right. Things that you can do in the GMC are as:


    +   * To open a directory using the left side, locate it in the list and click
    the plus sign next to it.

    * To open a directory using the right side, locate it in the window and double-click
    it. Linux automatically displays the files in this directory.

    * To view the files in a directory using the left side, click the directory''s
    folder icon or the name.

    * To view a file''s contents or run a program, double-click the item in the listing.'
  merge: -1
