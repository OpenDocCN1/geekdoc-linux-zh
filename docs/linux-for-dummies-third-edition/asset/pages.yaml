    the first item listed, you don''t need this option. For example, if you want to
    boot the Linux menu option and it''s the third listed, then use default=3rd. |

    | delay=secs | How many seconds LILO should wait before giving up and booting
    into the first or specified menu item. You don''t typically use this and timeout
    together. For example, if you wanted LILO to boot immediately because you don''t
    have a multiboot system, you would use delay=0. |

    | linear | Many people find LILO works just well with or without this setting.
    If you had to begin with and LILO isn''t working properly, remove it, or vice
    versa. |

    | prompt | Enters the LILO prompt without expecting any intervention. If you''re
    not there when the machine is booting or timeout isn''t set, then it waits until
    someone tells it what operating system to boot into. |

    | timeout=tenthsecs | How many tenths of a second LILO should wait at the boot
    prompt before booting the first or specified menu item. If you wanted LILO to
    wait at the boot prompt for twenty seconds, then you would use timeout=200. |

    | verbose=level | Specifies how much information LILO should print on the screen
