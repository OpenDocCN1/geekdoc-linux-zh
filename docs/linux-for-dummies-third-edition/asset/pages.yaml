    # NICs


    After you install the cables and your hubs, you need to plug the cables into the
    computers. Each device that you need to attach must have some type of network
    interface, which may be in the form of a card that you install in one of the available
    slots on the system''s main board or motherboard. This card is known as a network
    interface card (NIC) and is available from many vendors in various types. Sometimes,
    the network interface circuitry is part of the computer''s motherboard, in which
    case you can find the connector somewhere on the back of your computer''s motherboard
    where the other connectors are.'
