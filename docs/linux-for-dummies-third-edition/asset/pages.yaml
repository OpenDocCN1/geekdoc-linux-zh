  md: '# Chapter 2


    # Prepping Your Computer for Linux


    In This Chapter


    +   - Basic pre-installation steps

    - Knowing (and finding) your hardware information

    - Preparing for CD or floppy disk installation

    - Starting the installation from MS-DOS

    - Customizing disk partitions before and during installation


    Most current Linux distributions include the ability to automatically detect your
    hardware and guide you through the installation process. On most modern systems,
    installing Linux is painless and trouble-free. But whatever your system is, it''s
    very important that you know your computer''s hardware before you begin installation.
    A little bit of documenting your system may help prevent a problem either at installation
    time or later. Plus, if you ever need to replace any hardware, upgrade, or add
    new hardware, you have a record of your system''s hardware.


    Your Linux pre-installation preparation steps are like Chinese food preparation,
    which involves no time to prepare ingredients in the middle of the cooking unless
    you have overcooked/and burnt food. Before you begin, you must have all ingredients
    assembled and within reach so that you''re cooking, all you need to do is grab
    the next ingredient, add it to the wok, and keep flipping and stirring. Likewise,
    before you install Linux, you need all the necessary information and components
    on hand — assembled and within reach — so that you don''t have to (hopefully)
    hunt around and find the next component as the install waits patiently for you
    to continue.


    In this chapter we address some suggested preparation tasks before you start installing
    Linux. In addition, we show you how to set up your system to install Linux directly
    from the CD or with an installation floppy disk.'
