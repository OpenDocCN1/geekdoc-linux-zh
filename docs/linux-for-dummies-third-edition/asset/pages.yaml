- img_proc: true
  md: '# 76 Part I: Getting Your Feet Wet


    If you have problems with your machine as it boots up, you really need to be able
    to figure out where that problem is occurring before you can fix it. We cover
    some specific problems here and provide you with the tools that you need to diagnose
    other problems on your own.


    # Where''s my boot prompt?


    People typically cross their fingers the first time they boot their system after
    installing Linux. Booting the system properly means the Linux installation went
    well! However, you don''t always experience a trouble-free boot at first. Sometimes,
    you can''t get as far as the LILO boot prompt. Don''t worry, you have ways of
    dealing with this issue.


    The first thing to look at is how much of the LILO boot: prompt you get. Each
    letter of LILO is printed at a specific stage of the loading process. If you don''t
    get all four letters and the word boot, as shown in the following line of code,
    then something''s wrong:


    ```

    LILO boot:

    ```


    Before you start worrying about how much of the prompt shows up in this situation,
    reboot the machine four times to see if it eventually boots properly. Sometimes,
    the problem sorts itself out. Once, it magically started working for us after
    seven reboots!


    If you reboot a few times and still can''t get your machine to boot properly,
    your problem is more serious. (You didn''t want to hear that — it''s true.) The
    solution for a partial LILO boot: prompt may be one of the following:


    +   - Re-run LILO and reboot.

    - Ensure that the root partition — or the /boot partition, if you made one and
    it''s appropriate for your distribution — is active.

    - Check the partition with the root or /boot partition for damage.


    Each of these situations sounds a bit overwhelming. Don''t worry. Take a deep
    breath and relax. We tell you all you need to know how to do these things. First,
    you have to find a way to boot into Linux even though your LILO doesn''t work.
    Depending on what distribution you''re using, you have a few different ways to
    handle this. In all Linux distributions, you have the capability to create a custom
    boot disk.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_103_0.png)


    You shouldn''t keep boot disks around just for Linux — things can go wrong with
    Windows and other operating systems, too operating system has a method of creating
    boot disks. Be sure to make one and keep it handy, especially when you start dual-
    or triple-booting.'
