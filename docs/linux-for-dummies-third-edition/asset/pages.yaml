    ready to host centralized /home information, follow these steps on each secondary
    machine in turn:


    +   1. Log in as root.


    +   2. Make sure that no one but root is logged in at the moment.


    Unless you allow people to remotely access the machine, you don''t need to worry
    about this.


    +   3. Type mv /home/home-old.


    This action actually moves the entire contents of /home into a new directory,
    /home-old. Still, don''t allow anyone to log in as anything but root. Your users
    have no /home directories to use!


    ![](img/4e9f259b21147d1fb7569159ef49ec31_265_0.png)


    If people are waiting to use the computers, go through this entire process on
    each secondary machine so that people can use the other computers while you''re
    working on one.


    # Permanently mounting our remote /home


    In the preceding sections, we tell you how to determine which machine hosts the
    central /home directory for all your user accounts, how to set this machine up
    so that your other Linux machines can access this directory using NFS, and finally
    how to adjust the secondary machines so that their /home directories don''t conflict
    with the new one. Here, we tell the secondary machines where to find the central
    /home directory.


    Each Linux machine has a central file that it uses to tell what to mount onto
    the file system at boot time. This file also contains any shortcuts that may be
    on your system for typing things such as mount /mnt/cdrom instead of -t iso9660
    /dev/cdrom /mnt/cdrom. It''s here you can tell'
