  md: '# 146 Part III: Getting Up to Speed with Linux


    "Comprehending File Types" section earlier in this chapter gives you a feeling
    for the first letter on each line, but nine more characters are attached to that
    item before you get to the next column. This group of nine is the set of permissions
    (also called a permission set) for the file or directory. Linux, Unix, and even
    MacOS use permissions as a way of providing file and directory security by giving
    you the means to specify exactly who can look at your files, who can change them,
    and even who can run your programs. You need this when you have a bunch of different
    users on the same machine, which is networked to the world.


    # Checking out the triads


    Each permission set consists of three sets of triads. Each of the triads has the
    same basic structure, but controls a different aspect of who can use what. Consider
    the long format listing for /home/dee in the following code:


    ```

    total 20

    drwx------x 2 dee 4096 Jul 27 09:48 .

    drwxr-xr-x 5 root 4096 Jul 27 11:57 .

    -rw-r--r-- 1 dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee 124 Jul 27 06:50 .bashrc

    -rw-r--r-- 1 dee 0 Jul 27 09:48 lsfile

    ```


    The first character in the permission set refers to the type of file; for a directory,
    the character is shown as "d", as you see here for the first two items in the
    listing list, and files are designated with a dash (--) instead. Each file or
    directory''s permission set is a group of nine characters— that is, the nine characters
    that follow the first character (for a total of ten). But this group of nine is
    really three groups of three, as shown in Figure 9-1.


    The three triads read as follows:


    +   The first triad consists of the second, third, and fourth characters in the
    long format file listing. This triad sets the permissions for the user, or owner
    of the file (owners are discussed in the "Beware of owners" section later in this
    chapter).

    The second triad consists of the fifth, sixth, and seventh characters in the long
    format file listing. This triad sets the permissions for the group that is assigned
    to the file (groups are discussed in the "Hanging out in groups" section later
    in this chapter).

    The third triad consists of the eighth, ninth, and tenth characters in the long
    format file listing. This triad sets the permissions for others, or everyone who
    isn''t the file''s owner or a member of the owning group.'
