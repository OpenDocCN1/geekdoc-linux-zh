    # # To LinuxConf or Not to LinuxConf?:nThat’s the Question


    LinuxConf is GPL (General Public License) software that provides one-stop-shopping
    for all your Linux configuration and administration needs. At least that’s what
    the creators of this software proclaim as their mission. As least you know by
    now, LinuxConf is a complicated and powerful beast, comprised of varied software
    from thousands of programmers around the world. Attempting to create a tool that
    understands the configuration of these many systems is indeed ambitious.


    Some users use LinuxConf as a magic tool that enables novices to configure their
    Linux system, yet others consider it the pocketknife of the devil. Experienced
    Systems Administrators encourage you to work towards understanding the underlying
    systems work and learn the syntax of the related configuration file(s). Their
    argument is valid in that you never know exactly what the configuration tool is
    doing behind the scenes. This is fine advice for the long term, but often you
