  md: '# 354 Part VI: Appendices


    **link:** Two kinds of links are used in Linux and Unix — soft and hard. A soft
    link is like a shortcut that points to the original file and any changes you make
    are made to the original file. Erase the original file and the link remains, but
    it becomes unusable. It''s broken without the original file. A hard link isn''t
    just a shortcut; it''s another instance of the file itself. The original file
    is only saved in one place, but you can edit the hard link and the edits appear
    in the original file as well.


    **Linux:** An Open Source operating system, built around the Unix framework, that
    is now widely used as a Web server in many companies and organizations. Linux
    is multi-platform, interoperable with many existing networking protocols, highly
    configurable, stable, and free, among many praiseworthy traits.


    **LinuxConf:** A configuration and activation utility that allows you to change
    many Linux system settings, such as user and group accounts, network configuration,
    and LILO settings, and activate system tools such as printtool, modentool, and
    kernelcfig


    **loadable module:** A small program that is called from within an operating system
    to provide a service or function that isn''t a part of the operating system.


    **log file:** A file, usually a text file, that contains a list of actions that
    have occurred. Network programs, the kernel, and many other programs write to
    log files.


    **login prompt:** The command prompt area or GUI text box in which a username
    and password are entered to log into a system.


    **loopback interface:** A phantom network interface that allows your computer
    to listen to itself and use network programs without having a physical network
    device.


    **lpd:** The line printer daemon; Linux printing service manager.


    **Mac OS:** The GUI-based, Macintosh operating system.


    **man pages:** A comprehensive, online help system in Linux.


    **MBR (Master Boot Record):** A small program that runs when a computer is turned
    on and determines which partition to boot from. The MBR is stored in the first
    sector of a hard drive.


    **Microsoft Windows:** The dominant GUI operating system in the world today.


    **modem (MOdulator/DEModulator):** A communications device that changes digital
    signals from a computer to analog signals, transmits the data to'
  merge: -1
