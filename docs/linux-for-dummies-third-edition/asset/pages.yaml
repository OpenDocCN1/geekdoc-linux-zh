    it''s running incredibly different hardware from what this one is running.* |

    | /usr/src | The source code that you use to build the programs on your system.


    # Partitions Versus Directories


    One very important thing that you must understand about the Linux system is that
    it might not all be on one single hard drive or hard-drive partition. If you''ve
    dealt with this point during the installation, you probably already know it. But
    maybe you sidestepped this issue by using one of the install classes that does
    things for you automatically.


    What really confuses people later, however, is that partitions and directories
    tend to blend together. In the Microsoft world, if you separate hard drives or
    partitions, you have a specific letter designation for each one.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Chapter 14: Checking Out the Linux System


    The primary hard drive is C; the next is D; and so on. Under Linux, each of these
    drives and partitions quietly blends in.


    If you partitioned your hard drives on your own, you know that you needed to specify
    a mount point — which is like an empty spot in a puzzle, where the outside partition
    or media can be plugged into the rest of the file system — for each partition.
    In the case of a hard drive partition, the mount point isn''t in the /mnt part
    of the file system. It''s actually an item in the root directory — maybe /boot/
    or or /usr. You literally attach permanent items, as hard drives and partitions,
    right into the file system and can''t tell the difference. Linux doesn''t want
    to know or care about the difference. It just wants to its thing. But don''t worry
    — you have reliable designations that are related to where in the scheme of hardware
    you can find your drive. See Table 14-3 for a breakdown of popular designations.


    # Table 14-3 Common Drive Designations


    | Designation | Description |

    |---|---|

    | /dev/cdrom | CD-ROM drive |

    | /dev/fd0 | Floppy drive #1 |

    | /dev/fd1 | Floppy drive #2 |

    | /dev/hda | First IDE hard drive |

    | /dev/hda1 | First IDE hard drive, first primary or extended partition |

    | /dev/hda2 | First IDE hard drive, second primary or extended partition |

    | /dev/hdb | Second IDE hard drive |

    | /dev/hdb1 | Second IDE hard drive, first primary or extended partition |

    | /dev/hdb2 | Second IDE hard drive, second primary or extended partition |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | First SCSI hard drive, first primary or extended partition |


    You probably see a pattern by now. A hard drive has a three-letter designation:


    +   - An IDE drive''s designation starts with /dev/hd; the first drive of this
    type is a, the second b, and so on. The third IDE drive looks like this: /dev/hdc.


    +   - A SCSI drive''s designation starts with /dev/sd; the first drive of this
    type is also a, the second b, and so on. The third SCSI drive looks like this:
    /dev/sdc.'
  merge: -1
