  md: '# 360 Part VI: Appendixes


    # # System Requirements


    Make sure that your computer meets the following minimum system requirements.
    If your computer doesn''t match up to most of these requirements, you may have
    problems using the contents of the CD.


    +   - A PC with an Intel-compatible 486 or faster processor.

    - MS-DOS 6.02 or Microsoft Windows 3.1 or later is convenient to help you set
    up your system, but you can install from a Linux bootable floppy without needing
    DOS or Windows, if you prefer.

    - At least 80MB of total RAM installed on your computer. For best performance,
    recommend at least 32MB of RAM or more. Linux can handle as much RAM as you can
    fit into a typical PC and more is almost always better than.

    - At least 800MB (the barest minimum) up to 2GB of hard drive space available,
    if you want to install all the software from this CD. (You need less space if
    you don''t install every program, but you''ll want to go ahead and make 2GB of
    space available to give yourself the most options.)

    - A CD-ROM drive — double-speed (2x) or faster (the faster the CD-ROM drive, the
    faster your installation experience).

    - Just about any VGA monitor will do, but you''ll want one that''s capable of
    displaying at least 256 colors or grayscale.

    - A keyboard and mouse, so you''ll have a way to communicate with your Linux system
    and tell it what to do!

    - A 3.5" floppy drive, so that you can create an emergency boot disk for your
    Linux system (and though you hope never need one, you''ll thank your lucky stars
    you got one, if ever). With this tool in your PC, you can also use it to boot
    from a floppy should you ever need to do as well.

    - A PDF viewer so that you can read the bonus appendices we''ve included on CD3.
    xpdf is installed by default with the Workstation installation of Red Hat Linux
    7 (which we show how to set up in Chapters 2 and 3) and opens automatically when
    you double-click a PDF file.

    - Optional: A modem with a speed of least 14,400 bps; here again, the faster your
    Internet connection, the less time it will update your installation to the most
    recent versions. Your authors use cable modem or DSL for their Internet connections
    and like the increased speed when it comes to dealing with the many and varied
    sources of Linux software and updates online.


    If you need more information on PC basics, check out PCs For Dummies, 6th Edition,
    by Dan Gookin (published by IDG Books Worldwide).'
  merge: -1
