  md: '# Chapter 1: Getting Acquainted with Linux


    # # GNU?


    Imagine, software created out of need rather than projected profit. Even though
    Unix ultimately became expensive proprietary software, the ideas and motives for
    its creation were intrinsic. What we refer to in singular the Linux operating
    system is actually a collection of software tools that were created with the express
    pressure of solving specific computing problems.


    Linux wouldn''t be possible without the vision of a man whom Steven Levy (author
    of the book *Hackers*) refers to, *The Last of the Great MIT-AHAB hackers*. This
    pioneer and advocate of freedom software, who made Linux even possible, Richard
    Stallman.


    The Massachusetts Institute of Technology (MIT) has long held a reputation for
    nourishing the greatest minds in the technological disciplines. In 1984, a gifted
    student and brilliant programmer at MIT was faced with a dilemma — sell his talent
    to a company for a tidy sum of money or donate his gifts to the world. What did
    we''d do... right?


    Richard Stallman set out on a journey to create a completely free operating system
    that he would donate to the world. He understands and continues to live the hacker
    ethic, which declares that information should be freely exchanged and made available
    to anyone. This wasn''t a new concept.


    The early days of the computing industry made advancements by freely sharing and
    programming code. Manufacturer-sponsored user groups brought the best minds together
    for solving complicated problems. This ethic, Mr. Stallman felt, lost when companies
    began to hide software as their own intellectual property with the single purpose
    of profit.


    As you may not have gathered by this, widespread and accessible source code is
    paramount to successful software development. *Source code* is the term for the
    human-readable text that we type to communicate instructions to the computer.


    A computer stores information in 1s and 0s, or *binary*. Writing computer programs
    in binary is an extremely arduous task. Modern computer software is usually written
    in a human language and is *compiled*, or translated into the native instruction
    set of the computer. To make changes to this software, a programmer needs access
    to a program''s source code. Most proprietary software comes only as pre-compiled
    and the source code for those programs is kept under lock and key by the software
    developer.


    Stallman had to devise a name to refer to his free software project. He chose
    a recursive acronym, *GNU* (pronounced Ga-New), which means Gnu''s Not Unix. Having
    determined that his operating system would be built around the conceptual framework
    of Unix, Stallman wanted the actual project name to distinguish the fact that
    his wasn''t Unix.'
  merge: -1
