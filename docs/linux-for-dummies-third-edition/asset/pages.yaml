- img_proc: true
  md: '# Chapter 10: Gettin'' Gooey with the GUIs 175


    # Ditching an applet


    You have room for only many applets. And if you''re like us, you probably don''t
    want to have every bit of free space cluttered with things. Luckily, you can get
    rid of the applets you don''t want to use. To remove an applet from the Panel,
    simply right-click the applet you want to remove and choose Remove from Panel
    from the pop-up menu that appears. With nary a whimper, the applet vanishes from
    the Panel.


    # Don''t forget the programs


    You may be looking at your Panel and wondering why you can put applets on it but
    can''t make any changes to the programs that are on it. After all, a few programs
    already appear on the bar by default. The good news is that you can change the
    programs on the bar! They fit in the same empty spaces applets do. Unlike with
    the applets, however, you aren''t restricted to putting a program shortcut just
    on the Panel. You can have one on your desktop, too.


    # Adding a program to the Panel


    If you have a program that you end up using a lot, you can add it to your Panel
    by doing the following:


    +   1. Click the Main Menu button and browse to the program that you want to add
    to the bar.

    Don''t actually open the program. Just point to the menu item with your mouse
    pointer.

    2. After you select the program in the menu, click it and drag it onto the Panel.


    An icon for this program now appears on your Panel. It may not be exactly where
    you tried to place it. In fact, it''s probably off to the far right.


    If you have your program on the Panel, you can run it just by clicking its icon.


    # Removing a program from the Panel


    If you want to remove one of the programs on the Panel, just right-click the icon
    that you want to remove and choose Remove From Panel from the pop-up menu that
    appears. The icon vanishes from the panel. That''s it!'
  merge: -1
