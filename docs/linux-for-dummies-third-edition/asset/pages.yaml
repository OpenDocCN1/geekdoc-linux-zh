  md: 'It''s it! Finally. All you have to do is test and see if your new kernel boots
    okay.


    # Testing your new kernel


    To test your new kernel, all you need to do is reboot! When you get the LILO prompt,
    type linux to try out the new kernel. If for reason the machine doesn''t boot
    properly, reboot and type linux-old at the boot prompt to boot to the safe old
    kernel. You can then go through the whole kernel creation process again and get
    the new one working correctly.


    If your new kernel doesn''t work, the following are just a couple things that
    you can do:


    +   Return to the"Configuring your kernel" section and go through the configuration
    again. You may have disabled features that are vital to your system''s ability
    to work properly.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_291_0.png)


    +   Can''t figure out which features you added and removed, and which ones were
    there before? Reboot under the linux-old kernel, and follow the instructions in
    the section "Creating the old configuration file.". Then, follow the instructions
    in "Configuring your kernel" just long enough to allow you to browse through and
    see how this one''s different from the new one.


    +   See Chapter 19 for additional advice on troubleshooting your Linux problems.'
  merge: -1
