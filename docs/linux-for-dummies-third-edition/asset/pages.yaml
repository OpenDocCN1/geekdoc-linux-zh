  md: '# 22 Part I: Getting Your Feet Wet


    +   - Hard drive: Document the number and type of hard drives you have (IDE or
    SCSI).

    - For IDE systems, note the channels the drives are attached to and whether they''re
    a master or slave.

    - For SCSI systems, document the SCSI ID numbers.


    In addition to the disk hardware, if you already have an existing operating system
    that you want to retain, note what drive or drives it''s on and the space allocated.
    Linux recognizes most other operating systems'' file architectures, but it''s
    a good idea to know what''s already present to verify what detects.


    Besides your disk and file system architecture, make to sure that you have sufficient
    disk space to install Linux. In Chapter 3, we will cover installing the Workstation
    mode of the Red Hat distribution, which requires about 1GB of disk space. If you
    choose to install all the packages on the Red Hat distribution, the total amount
    of disk space that you need is about 2.2GB. Some distributions'' complete install
    around 3GB. Each distribution''s documentation tell you the amount of disk space
    that you need.


    +   - CD-ROM drive: The type of CD drive in your system (IDE or SCSI) should be
    documented. If you''re using an IDE CD drive, it''s most likely using the ATAPI
    (Attachment Packet Interface) standard. ATAPI CD-ROM drives are supported by many
    operating systems and system architecture. If your IDE-ROM does not support the
    ATAPI standard, make a note of the CD-ROM''s architecture.


    +   - Mouse: If you''re planning on using a mouse, note the brand and model specified
    on the mouse. If it''s a serial mouse, indicate which serial port it''s attached
    to. For both serial and PS/2 mice, note the number of buttons (2 or 3) and whether
    or not it has a wheel. If you''re not sure of the type of mouse you have, look
    at its connector where it''s plugged into your machine. If the connector is round
    with pins sticking, you''ve got a PS/2 mouse. If the connector is rectangular,
    it''s a serial mouse.


    +   - Video card: Documenting your video hardware is very important. You need
    to know the brand and model of your video card or interface the amount of video
    memory and supported resolutions. Also document the make and model of your video
    monitor and its capabilities.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_49_0.png)


    Setting up the video parameters is the most likely place that the hardware-probe
    may fail or return incorrect information. Unfortunately, many types and versions
    of video cards are available in addition to onboard video. Onboard video, which
    is built into the computer''s circuitry, isn''t exactly the same as its comparable
    external video card. You must establish the details of your video hardware before
    beginning any Linux installation.'
