  md: '# # Linux® For Dummies,® 3rd Edition


    # Cheat Sheet


    # ## Common Commands


    | Command | Description |

    | --- | --- |

    | cat [filename] | Display the contents of a file to the standard output device
    |

    | cd [/directorypath] | (bash built-in) Change the current working directory |

    | chgrp [options] group filename | Change the primary group ownership of a file
    |

    | chmod [options] mode filename | Change the permissions of a file |

    | chown [options] filename | Change file and/or group ownership of a file |

    | cp [options] source destination | Copy files and directories |

    | date [options] | Display or set the system date and time |

    | df [options] | Display used and available disk space for all mounted file system
    volumes |

    | du [options] | Report the number of disk blocks each file is consuming |

    | file [options] filename | Perform several tests to verify if a file is ASCII
    |

    | find [pathname] [expression] | Search all branches of a given point in the file
    system hierarchy for files matching a provided regular |

    | grep [options] pattern | Search for lines containing a given regular expression
    or pattern |

    | kill [options] pid | Send a signal to a process (default is TERM) |

    | less [options] [filename] | View the contents of a file (more features than
    the command) |

    | ln [options] source [destination] | Create a link to a specified target |

    | lp [options] | Spool print job for device queuing by the printer daemon |

    | ls [options] | List information about the files in a directory |

    | mkdir directory | Create a new directory |

    | more [options] [filename] | View the contents of files and standard output page
    at a time |

    | mv [options] source destination | Rename or move file(s) or directories |

    | passwd [name] [password] | Change the password or allow the System Administrator
    to change any password |

    | ps [options] | Display a snapshot of running processes |

    | pw | Display the pathname of the current directory |

    | rm [options] directory | Remove (delete) file(s) and/or directories |

    | rmdir [options] directory | Delete empty directories |

    | su [user [arguments]] | Switch user (note: not superuser) |

    | tail [options] [filename] | Display the last n lines of a file (default is 10)
    |

    | tar [options] [filename] | Store and extract files from a tarball or archive
    file |

    | who [options] | Display who is logged on |'
