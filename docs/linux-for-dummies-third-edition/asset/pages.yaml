  md: '# Chapter 9: Files and Directories 161


    The following list shows you how you can use wildcards to access those files:


    +   - If you type *?file* in this directory, you get the files afile, bfile, cfile.

    - If you type *file?*, you get file1, file2, and file3.

    - If you type *is file*, you get file1file, file2file, afile, file1, file2, file3,
    and filefile.

    - If you type *file*, you get afile, cfile, file1file, file2file, afile, afile,
    bfile, and filefile.

    - If you type *is file[1-3]*, you get file1, file2, and file3.

    - If you type *is file[1-3]**, you get file1, file2, file3, file1file, and file2file.

    - If you type *is file[1,a]*, you get file1, file1file, and afile.


    You may also find filename and command completion useful. The bash shell (the
    default Linux shell; see Chapter 11) has a feature that finishes a filename for
    you. If you''re working at the command prompt typing a long filename, press the
    Tab key and bash does the rest. You can also complete commands by pressing the
    Tab key. You have to type enough letters, however, to make the item unique so
    nothing else can come up during the completion.


