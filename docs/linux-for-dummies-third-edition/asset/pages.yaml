  md: '# 364 Part VI: Appendices


    Both packages include GPG signatures because the installer can check the contents
    of files it tries to install using the stored signatures to make sure the files
    haven''t been changed (and the assumption is that all changes would be for the
    worse, such as Trojan horses or viruses) because they were written to the CD.
    Thus, signatures provide a way to make sure everything is safe and wholesome for
    your computer!


    ![](img/4e9f259b21147d1fb7569159ef49ec31_391_0.png)


    # About CD3


    CD3 contains documentation files for Red Hat 7. These include "The Official Red
    Hat Linux Getting Guide," "The Official Red Linux Installation Guide," and "The
    Official Red Linux Reference Guide." In addition, you''ll find many FAQs and HOWTOs
    that help you learn more or offer step-by-step instructions for using your Linux
    system, and the README file from Red Hat themselves describing the contents of
    the CD (that README is just named "README" whereas the one for this is named "IDGB_README")
    You can install the guides on your computer''s hard drive or view them on the
    CD. Either way, keep them handy—you''ll probably refer to them time again


    In the /linux_for_dummies directory on CD3, you''ll also find a README file including
    the text from this appendix and four bonus appendixes (named BonusApp.pdf through
    BonusAppD.pdf) and a links page to all the URLs in this book (named links.html).


    # If You''ve Got Problems (Of the CD Kind)


    We tried our best to locate programs that work on most computers with the minimum
    system requirements, as did Red Hat for its operating system. Alas, your computer
    may differ, and some programs may not work properly for some reason.


    The two likeliest problems are that you don''t have enough memory (RAM) for the
    programs you want to use or that you have other programs running that are affecting
    the installation or running of a program. If you get error messages like Not enough
    memory or Setup cannot continue, try one of the following methods and then try
    using your software:


    +   * Turn off any antivirus software that you have on your computer. Installers
    mimic virus activity and may make your computer incorrectly believe that a virus
    is infecting it.

    * Close all running programs. The more programs you''re running, the less memory
    is available to other programs. Installers also typically update files and programs;
    if you keep other programs running, Installation may not work properly.'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'In Linux, close your GUI environment and run demos or installations directly
    from a shell. The interface itself can tie up system memory or even conflict with
    certain kinds of interactive demos. Use the command prompt to browse files on
    the CD and launch installers or demos.


    Have your local computer add more RAM to your computer. This is, admittedly, a
    drastic and somewhat expensive step. If you have a modern PC with less than 32MB
    of RAM, however, adding more memory can really help the speed of your computer
    and enable more programs to run at the same time.


    If you still have trouble installing the items from the CD, please call the IDG
    Books Customer Service phone number: 800-762-2974 (outside the U.S.: 317-572-3993).'
