    # Spreading directory structures across different hard drives


    One technique that you can use to improve performance and to help growing directories
    is to spread the directory structure over multiple drives. We suggest placing
    primarily read-only files on one drive and placing read/write files on another
    physical drive, which enables the operating system to alternately access different
    storage devices. Files that are primarily read include the Linux binaries such
    as /bin, /usr/bin, and /usr/lib. Read/write files include /home, /tmp, and /var.
    If you use these techniques on newer systems with enhanced IDE features, you may
    not see much performance gain.


    If you''re using an IDE system, spread the files over the master drives and secondary
    channels rather than placing all the files on a single channel''s master and slave
    drives. This reduces the contention on one channel and the load across both channels.
    If you have a CD-ROM drive that isn''t used you may do better by leaving hard
    drives on the same partition and placing the CD-ROM on its own separate.


    You can look at the lifetime of files to get another view on the number of partitions
    and what is on. Temporary files are on one partition and other, longer life files
    are those that include the Linux operating system: /bin, /sbin, /usr/sbin, /usr/bin,
    and other files in directories that store applications like /var. The directories
    holding more transient files include /var/sp/lp, /var/news, and /tmp. Also, be
    sure to consider the files in /home and their average lifetime (if you can determine
    one). You may find it is better to place /home on a separate partition. We suggest
    placing /var on one partition, /home on another, and (/root directory) on a separate
    partition. In addition, your directories can only grow as far as the partition
    boundary and aren''t able to run your directories out of space.


