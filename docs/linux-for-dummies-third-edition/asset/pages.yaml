    # Directory structures and disk fragmentation


    Where you place the file system directories affects the overall performance and
    efficiency of Linux. If you place all the files on one partition, the drive''s
    system may be over-tasked when servicing the reads and writes. Also, if everything
    is on one partition, how do you handle ballooning directories that can quickly
    use up all the available disk space?'
