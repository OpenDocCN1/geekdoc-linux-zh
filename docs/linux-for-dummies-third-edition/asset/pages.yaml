  md: '# Chapter 16: Tuning and Optimizing Linux


    +   - **Free**: Indicates the amount of available physical memory and is simply
    the value of the Total column minus the value of the Used column.


    +   - **Shared**: The amount of physical memory holding code shared between multiple
    applications or processes.


    +   - **Buffers**: The amount of memory used by the kernel buffer cache. The kernel
    buffer cache is used to speed up disk operations by allowing the reads and writes
    to be handled directly from memory rather than both the CPU. Applications can
    reclaim this memory if needed.


    +   - **Cached**: Indicates how much memory the file caching is using. File caching
    holds contents in memory to provide quick access to files. Information stored
    in memory can be retrieved faster than pulling it off the hard disk. Notice that,
    in Figure 16-7, most of the physical memory is used. That isn''t however, because
    file caching used some of it.


    The vertical rows in Figure 16-7 are described in the following list, starting
    with the second row (the first is just the column headers for the columns described
    in the previous list):


    +   - **Mem**: Mem: displays memory values and the headings indicate the type
    of memory. When an application needs more memory, it can reclaim the memory used
    for cache and buffers.


    +   - **+/- buffers/cache**: This indicates the actual state of the physical memory.
    In Figure 16-7, notice the big differences in the used and free values on the
    Mem: and -/+ buffers/cache: rows.


    +   - **Swap**: The last row in Figure 16-7 (Swap:) indicates the state of the
    virtual memory plus the amount of swap space. The swap space may be reported as
    significantly less than what you specified. This is because each swap area maintains
    a map of how each page in the swap area is being used. This map takes up few blocks
    of swap area and is usually only a few kilobytes per swap area. The second entry
    (used) shows the amount of swap space in use and the last entry (free) displays
    the amount of swap space available. In Figure 16-7, we have plenty of swap space
    available!


