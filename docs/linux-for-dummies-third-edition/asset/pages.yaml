  md: '# Plugging software holes


    When someone''s already in your system — whether they''re allowed to be or not
    — you have additional security concerns to keep in mind. One of these involves
    what software you have on the machine. Each piece of soft- is a potential security
    hole, believe it or not. If someone can get a program to crash in the right way,
    they can get greater access to your system than they should. This is a very bad
    thing!


    You can do two things to close software holes. One of these is to remove all programs
    that you don''t need. (We discuss the other in the section, "Daily tasks for the
    administrator,"earlier in this chapter.) You can always add them later if necessary.
    How exactly you do depends on the package manage-ment scheme your distribution
    runs. The following works at the command prompt on Red Hat, and all other distributions
    that RPM.


    To remove all programs that you don''t need, follow these steps:


    +   1. Type rpm -qa | more to see every package you have installed, a screen at
    time.


    The list displayed is probably a bit daunting! We suggest that you don''t try
    to review and delete them all at once. Do a group of packages, and come back the
    next day and do another. The start of the list may look like the following:


    ```

    filesystem-2.0.7-1

    glibc-2.1.91-18

    termcap-11.0.1-3

    ```


    You can also use one of the GUI package managers. In Red Hat, it''s Gno.


    +   2. In another virtual console, type rpm -qi packageName for the package that
    you want to investigate, without the version number.


    Detailed information about this package is displayed. For example, see Figure
    17-1 to see the data on glibc-2.1.91-18. We got this informa- by typing rpm -qi
    glibc.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_314_0.png)'
