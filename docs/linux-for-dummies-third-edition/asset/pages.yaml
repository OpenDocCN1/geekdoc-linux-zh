    # # Translating System Log Viewer data into useful SWATCH entries


    Eventually you may find something that you''re worried about in your log entries
    — from both the System Log Viewer and manually glancing through many of the files
    in the /var/log directory. Or, maybe you just want to practice, so you''ll know
    exactly how to keep an eye out for later. To build a useful SWATCH entry so that
    you can put this tool to work, follow these steps:


    +   1. Make sure that you''re logged in as root, or use su to attain root privileges.

    nYou need this level of authority to access everything.

    2. Open ~/.swatchrc in your favorite text editor.

    This is an empty file initially.

    3. Begin all SWATCH entries with either the word ignore or watchfor.

    Think of this as watching a watchdog. Certain things are below the program''s
    notice, so start the line with ignore. Others are important to keep an eye out
    for, so start the line with watchfor. This second item is what you use for most
    of your entries.

    4. Add a space and then a forward slash (/).

    This starts the section that contains the text that SWATCH needs to watch for.

    5. Type the text that you want SWATCH to keep an eye out for.

    6. Add another forward slash.

    This closes the text to watch for section.

    7. Press Enter and then Tab.

    You''re getting ready now to tell SWATCH what to do when it finds what you specified.'
