    # Changing the home directory


    Everyone''s account must point to the correct home directory. Suppose, for example,
    that the user bob has the user account pferd on one machine and blue on another.
    To fix it so he can use his centralized home directory on the secondary machines,
    follow these steps on each secondary machine in turn:


    +   1. Log in as root.


    +   2. Type usermod -d /home/primaryaccount localaccount.


    So on the computer where Bob''s account is pferd, type usermod -d /home/bob pferd.


    # Adding a New Hard Drive


    One day, you may need to add a hard drive to your Linux system. This requires
    that you install the drive — a daunting task by itself — and then partition it,
    format it, and mount it. We walk through how to do all of this specifically in
    the context of adding a new drive — to soothe your tangled nerves.


    # Partitioning your drive


    Although many third-party partitioning programs are out there, only one comes
    with every Linux distribution: fdisk. A lot of people find it pretty scary, but
    don''t worry; you get through it with our help. To partition your hard drive after
    you physically install it, follow these steps:


    +   1. Determine what partitions you want on the drive.


    This may seem like a straightforward issue. But we''re talking about a system
    where Linux is already installed. If it''s not installed, you just partition and
    add the drive during the installation process. So what did you add this drive
    for? Are you moving a directory over to? Are you creating a new hierarchy or subhierarchy?
    Take a look at the drive''s size and break it on paper before you continue.


    +   2. Log in to the machine that you installed the drive in root.'
