    ![](img/4e9f259b21147d1fb7569159ef49ec31_257_0.png)


    If you move around the file system, you can''t tell which of these directories
    are on which drive. The prompt, for example, doesn''t change depending on which
    drive each directory is on; it just doesn''t matter as far as the commands you
    use to move around.


    # Adding Media to Your File System


    The items in /mnt, such as /mnt/floppy and /mnt/cdrom, are temporary media: disks
    that you must add to the file system if you want to work with them and then remove
    after you''re done. Although this sometimes be done automatically—some distributions
    have tools in the GUI that automatically mount a CD-ROM after you close the drive—you
    often must do it manually. But you can easily do it if you know how.'
  merge: -1
