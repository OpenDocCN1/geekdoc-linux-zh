  md: '# Chapter 3: Installing Red Hat Linux


    6. Click Next after you''ve finished with the material on the Welcome to Red Hat
    Linux screen.


    The Install Options selection screen appears, shown in Figure 3-5, displaying
    the following four options:


    ![](img/4e9f259b21147d1fb7569159ef49ec31_68_0.png)


    Figure 3-5: The Install Options screen.


    +   * Workstation: Installs the X Window System and the desktop manager(s) of
    your choice. If your system already contains a copy of Linux, the default for
    the Workstation installation is to remove any existing Linux-related partitions
    and use all the remaining unpartitioned space. If you choose this default, any
    existing Non-Linux partitions, such as DOS/Windows, remain untouched. After installation,
    you''re able to boot to Linux and your other operating systems or systems. If
    you decide not to enable Linux to automatically partition and delete existing
    partitions, you can manually partition with Disk Druid or with `fdisk`. For more
    information, see the sidebar. "Defining partitions" else-in this chapter.


    +   * Server System: Designed for a basic Linux-based server without the X Window
    System and contains just the necessary server customization options. When you
    select this option, the default partitioning scheme is to remove ALL existing
    partitions on ALL your hard drives. This means all partitions and operating systems
    of any type, Linux and others, are removed and all drives are erased. If you decide
    not to enable Linux to automatically partition and delete existing partitions,
    you can manually partition with Disk Druid or with `fdisk`.'
