  md: '# # Chapter 3


    # # Installing Red Hat Linux


    +   ### In This Chapter


    - [ ] Installing Linux as a Workstation using the graphical interface

    - [ ] Checking out some neat features and installation improvements


    Recently many enhancements have been added to the Linux installation procedure,
    mostly designed to make installation easier. In the following list, we describe
    a few the newer features increasingly used in many Linux distributions (including
    Red Hat Linux 7, the distribution that comes on the CD-ROMs packaged with this
    book:


    +   - Have Linux automatically detect your hardware. Most Linux distributions
    now support the majority of current hardware peripherals and configurations.

    - Start the installation or boot your computer from a CD. This makes it very easy
    to begin the installation without the need to first make the installation floppy
    disk. In Chapter 2, we cover the process of setting up your system to boot from
    the CD and creating the installation floppy disk if you cannot boot from CD.

    - Use a GUI (graphical user interface) to install Linux. This installation option
    makes full use of your mouse while supporting keyboard navigation.


    In this chapter, we are installing Red Hat Linux for a Workstation role using
    the graphical interface. If you aren''t a GUI-type individual or your computer
    can''t use the graphical installation, you can install Linux in text mode (without
    the mouse and without the graphical interface). We will describe the text-mode
    installation in Bonus Appendix B, which you can find on CD3 that came with this
    book.


    +   - Define your disk partitions in any of the installation modes. In the past,
    some of the installation choices automatically altered or erased your disks and
    partitions. If your system has an existing operating system and you want to keep
    it, the Workstation mode does this for you default. However, you also have the
    choice to decide what partitions to remove. In addition, you can also specify
    the size and location of your disk partitions.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_62_0.png)'
