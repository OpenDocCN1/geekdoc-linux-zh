  md: '# Chapter 2: Prepping Your Computer for Linux


    +   - Network card: If you have a network card, document its manufacturer and
    model number. Note whether it is ISA (Industry Standard Architecture) or PCI (Peripheral
    Component Interconnect) architecture and jot down the interrupt, I/O port, base
    memory, and DMA (Direct Memory Access) channel parameters. If you are not using
    DHCP (Dynamic Host Configuration Protocol), note the IP (Internet Protocol) address,
    network mask, default gateway, and DNS (Domain Name System) servers you''re using.


    +   - Modem: If you have a modem that you plan on using with Linux, document its
    make and model number. If it is an external modem, indicate which serial port
    it is attached to. If an internal modem, note whether it is PCI or ISA, the interrupt,
    I/O port, base memory, and DMA channel details. Also document the maximum communication
    rate and whether not it supports the ability to send and/or receive fax documents.
    If you have a Winmod, or software modem, you probably can''t make it work in Linux.
    See Chapter 7 for more information.


    +   - Printer: You need to document the printer attachment point. If it''s connected
    to a computer, note the parallel port it''s attached to. If the printer is directly
    connected to the network, document its IP information. Also document the manufacturer,
    model number, memory, and language capabilities of the printer.


    # Finding Out What Hardware You Have


    Not everything that can be counted, and not everything that counts can be counted.


    > — Albert Einstein (1879-1955)


    Now that you have an idea of the information you need to gather, how do you find
    out what you''ve got? You do have to rip out all the hardware and hope that you
    can put it back the same way you took it out? Probably not. You can determine
    your computer''s hardware in many ways:


    +   - Refer to the documentation that came with your system. If you purchased
    a complex, preassembled system within the last couple of years, you should have
    a nice pile of literature — as you know where to put it.


    +   - Check your system provider''s Web site. If you''ve misplaced your original
    documentation, some complete system providers supply the details of your system
    on their Web sites. In some cases, you may need to enter your system''s asset
    tag or unit/customer number and the details of your system appear in your browser.'
