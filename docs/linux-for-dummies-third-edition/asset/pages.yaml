  md: '# 274 Part IV: Sinking Teeth into Linux


    # Disk fragmentation


    Because the size of a file rarely fits exactly into the number of disk blocks
    allocated for it, you may have to store the rest of the file somewhere else on
    the partition. The total area the file occupies, is, therefore, non-contiguous
    blocks that hinder performance because the drive''s heads have to move more to
    get all the pieces of the file. The features of the Linux native file system (ext2,
    ID=83) are designed to reduce fragmentation. One technique ext2 performs to set
    aside eight contiguous blocks at the end of a file in anticipation of the file''s
    growth. On average, a Linux system suffers 2-5 percent fragmentation, which isn''t
    significant.


    Using mdos (FAT16, ID=1) as a partition type for your Linux system introduces
    file fragmentation. If your Linux system is coexisting with another operating
    system that uses FAT16, FAT32, or NTFS, create separate partitions for Linux and
    use ext2 for Linux.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_301_0.png)


    # Tracking Memory and Disk Space


    Linux comes with a set of utilities for observing memory and disk space usage.
    Some are command prompt (shell) driven and others are available under X. Here
    we uncover a few of these and show you what they do.


    # What''s in the memory


    To look at the state of your memory (your Linux memory, that is), you can execute
    the free command at a command prompt. The free reports values in 1024-byte memory
    blocks. Figure 16-7 shows sample results of the free command.


    | | free | shared | buffers | cached |

    |---|---|---|---||

    | total | 71398 | 47564 | 35916 | 45036 |

    | used | 23760 | 11432 | | |

    | buff/cache | 22502 | | | |

    | free | 71432 | | |


    Figure 16-7: Results of the free command.


    You can see in Figure 16-7 that the output of the free command displays information
    in columns and rows. In the following list, we describe the columns that you see
    in Figure 16-7:


    +   - Total: The amount of physical memory; it''s slightly less because the bit
    of memory used by the kernel is subtracted.

    - Used: Represents the amount of physical memory currently occupied.'
