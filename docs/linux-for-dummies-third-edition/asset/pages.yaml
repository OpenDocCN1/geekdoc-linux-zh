    # Copying and moving files

    You can copy and move items using two different methods in the GMC. The first
    is the usual drag-and-drop method that you''re personally familiar with Windows
    or MacOS, and the other is using the program''s menus. To move a file using the
    drag-and-drop method, first click the file you want to move in the listing on
    the right. Then do one of the following:


    +   - Drag the file into the folder you want to drop it into the right pane.

    - Drag the file into the folder you want to drop it into in the left pane.


    You do the same to copy, except you click the item and then hold down the Ctrl
    key while you drag and drop.


    # Deleting files and directories

    You can''t select something and use the Delete key to get rid of something in
    the GMC. To delete either a file or a directory from the file system, the following:


    +   1. Browse to the file or directory''s location.

    You need the file or directory to appear in the right pane, so you want to click
    the folder that contains the item.

    2. Select the file or directory.

    Click the item to highlight its name.

    3. Open the pop-up menu.

    Right-click over the file and the pop-up menu.

    4. Choose Delete in the pop-up menu.

    Click Delete in the pop-up menu. A dialog box opens asking if you really want
    to delete the item.

    5. If you''re sure, click Yes.

    If you click Yes, you delete the item. Clicking No leaves it intact.


    Viewing and changing permissions

    If you''ve experimented with the different file views, then you already know that
    only the Custom view shows you a file''s permissions. If you try clicking those
    permissions, you see that you can''t work with them that way in the GMC. Instead,
    to change a file or directory''s permissions, you need to do the following:'
