  md: '# 242 Part IV: Sinking Your Teeth into Linux


    # # Formatting your new partition


    After you create a partition, you must format it so that you can place Linux files
    on it. Use **mke2fs /dev/device** to format the partition. In this case, the device
    refers to the new partition. If you just added a third IDE drive and are formatting
    its first partition, use **mke2fs /dev/hdc1**.


    Doing so formats the drive. This formatting process can take much longer than
    formatting a simple floppy disk, so you might want something else to do while
    you''re waiting.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_269_0.png)


    If you''re setting up a new hard drive, a smart idea is to check for bad sectors,
    too. Type **mke2fs -c /dev/device** if you want to do so.


    # # Mounting your new partition


    After you install, partition, and format the drive, you can set up to permanently
    mount the new partition onto the file system each time you boot the machine. To
    accomplish this, follow these steps:


    +   1. Log in as root.

    2. Open the file /etc/fstab in your favorite text editor.

    This file may look similar to Figure 14-4.

    Don''t change anything unless you really understand what it does.

    3. Open a new blank line at the end of the file.

    4. Add a new line for each of the partitions in the format:


    ```

    /dev/device  mountpoint  ext2  defaults  0 #

    ```


    To determine which device you''re dealing with, refer to Table 14-3.

    You also need to decide where this drive fits in the file system hierarchy.

    The # represents where in the mount order to mount the drive. Look in the last
    column for the largest number and use one bigger. In Figure 14-4, for example,
    the largest number on the right is 2, so in this case, use a 3 for #.


    +   5. Save and exit the file.

    6. Create the mount point by typing mkdir mountpoint.

    The mountpoint must exist so that you can attach something to it.

    7. Type shutdown -rf now to immediately reboot the machine.


    Handle the boot process as you always do, making sure that you boot into Linux.'
