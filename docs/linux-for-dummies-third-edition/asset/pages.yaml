    # The Dadgum Browser Plug-Ins


    Do you ever get irritated at those Web sites that you download a plug-in, or additional
    piece of software, just to view their site? While annoying if you''re looking
    for some basic information, these plug-ins can also provide some pretty cool stuff
    like streaming video and music through your Web browser.


    Plug-ins provide browser capability extensions, programs that interface with the
    browser to provide nonstandard features such as sound and video playing. The digital
    age is still in its infancy, so the industry hasn''t yet adopted these multimedia
    formats as standard. In this, the developers at Netscape have chosen not to build
    in support to the Communicator browser. Rather, the plug-in architecture enables
    software developers to innovate without requiring the supporting browser to know
    what to do with newly emerging media formats.


    Each plug-in may require manual setup steps and not all plug-ins that are available
    for Netscape are supported by Linux — Apple''s QuickTime is one good example).
