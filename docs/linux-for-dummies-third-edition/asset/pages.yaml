  md: '# Chapter 13: Setting Up Your LAN


    # # Planning and designing a LAN


    Each device you want to attach to a network must have a physical interface between
    the computer''s hardware and the transmission media. The transmission media is
    used to carry or transmit the information from one device to another. Copper wire
    contained in a flexible plastic covering a cable is typically used inside buildings.
    To transmit information between different geographical locations, wireless technology
    can be used. Outdoor wireless solutions use microwave and infrared. In addition,
    wireless can also be used indoors and is a nice option for notebook computers.


    For our discussion, our network uses a common transmission media — the typical
    Ethernet that you find in most small networks. Ethernet specifies how the information
    is placed on the transmission media. A common network cable is UTP (unshielded
    twisted pair). It is rated to carry up to 100 Mbps (megabits per second) and uses
    a phone-type connector (RJ-45). You can purchase these cables with the appropriate
    connector already attached at most computer supply stores or home building carry
    the cable, connectors, and crimper (the tool to attach a connector to a cable)
    separately so that you can make your own. The supplier may even provide the wiring
    diagrams for you. If not, you can easily find the correct wiring directions on
    the Internet.


    # Cables


    Each device that you want to connect must have its own network cable. A single
    length of cable has a physical limit — 100 meters, or 328 feet. The rating and
    the quality of the cable can have an effect on the maximum distance for each length
    of cable. Even if the cable is the best, you can''t just throw the network cable
    over and around certain types of electrical devices. The signal travelling down
    the wire is a small electrical current. External electrical fields can change
    the current on the wire and scramble the packets of data that drop down the cable.
    Fluorescent lights, for example, emit a strong electric field and can alter the
    signal on a cable passing nearby. As you design the physical layout of your cabling
    system, keep these types of physical barriers in mind. If you use a certified
    network wiring company, its workers know all about these types of issues.


    # Hubs


    After you have a cable for each device, you need to connect them. The typical
    UTP-based Ethernet network is physically arranged in a star. That is, each device
    connects to a central device. The star doesn''t need to be even or straight. As
    the cables wind around their physical boundaries, such as walls and ceilings,
    the star may look like some type of off-world alien or unknown deep-sea network.
    The important thing is that all the cables meet at a common point. You plug all
    the cables into a device called a hub, or concentrator. The number of devices
    a hub can connect ranges from four to 24 or 36. If you have more than 36 devices,
    you can use more than one hub and connect them so that they function as one big
    hub. Figure 13-7 shows an example of a hub with network cables attached.'
