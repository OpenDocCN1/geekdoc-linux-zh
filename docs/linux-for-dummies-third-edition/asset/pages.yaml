    # Setting Up Your LAN


    In This Chapter


    +   - Intranets and the Internet

    - Common types of network services

    - Laying out your LAN

    - Sharing network resources

    - Security on the LAN


    One of the wonderful things about Linux is its capability to function as a single-user
    system or to integrate with others on a network. The primary reason that we have
    networks is to share stuff, so be glad that you can connect Linux systems together
    and share resources. The stuff that we share includes hardware, such as printers,
    and software, such as databases. And a network makes a great delivery mechanism
    for messages and data, especially if the information is big. You can view movies,
    play music, and read entire books on your Linux system, but none of these fits
    on a floppy disk. They''re likely to fit on a CD-ROM, but you can also put them
    on one networked Linux system. Linux can also share data with other non-Linux
    systems, such as Novell, Microsoft, and Apple systems. In addition, those other
    operating systems can share their resources with networked Linux systems.


    # The Two Types of Nets — Intranet and Internet


    The primary reason why one would use or setup a network is to share resources.
    Say, for example, that you have a fancy color printer that you want several people
    to use. Without a network, each person who wanted to print would need to go to
    the specific machine that is cabled to the printer, wait his turn, and then print
    his document. Instead, if you share the color printer on the network, each person
    can print from his own machine without needing to change systems.'
