  md: '# 212 Part IV: Sinking Teeth into Linux


    During the development of networks, different languages, communication protocols,
    evolved. To support multiple protocols, sometimes the languages are translated
    to another protocol. The protocol used on the Internet is Internet Protocol (IP)
    and is often referred to as TCP/IP. (TCP stands for Transmission Control Protocol.)
    Linux''s native language is IP, makes Linux very easy to communicate with new
    or existing IP-based networks. Linux also supports languages used by other operating
    systems — for example, IPX for Novell systems and AppleTalk for Macintosh systems.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_239_0.png)


    You must also consider how to interface the inside with the outside. Complete
    solutions are available from vendors whose services may cover a range of options.
    These can include all necessary equipment and software, hardware only, or software
    only. If you want to use an available local service, you can usually find a solution
    through your local telephone provider.


    Depending on where you are, you may have other local solutions available to you,
    which can include solutions that the local television cable system or a local
    university provides. You may even have a local Internet access solution company
    or satellite systems. In some home-market areas, you can purchase access boxes
    that work with the local broadband service provider, such as cable modem or DSL,
    and connect your LAN or home network to the Internet. These devices are discussed
    in Chapter 7.


    After you interface the inside to the outside, you must consider security. How
    can you protect your systems on the inside from unwanted access from the outside?
    Besides access concerns, you also need to think about the possibility of viruses
    or other unwanted programs ending up on your systems. For more details, refer
    to Chapter 17, in which we cover Linux security issues.


    # Setting Up Your LAN


    After you set up your Linux systems, you need them to talk to each other. You
    may also have a printer attached to one of the Linux systems that you want the
    other Linux computers capable of printing to the same printer. You are also thinking
    about adding some other services in the future. In addition, you may need to get
    your LAN on the Internet. You have many factors to consider in building a network,
    and your initial step is to design and plan it all out first.


    > There are three kinds of death in this world. There''s heart death, there''s
    brain death, and there''s being off the network.


    Guy Almes'
