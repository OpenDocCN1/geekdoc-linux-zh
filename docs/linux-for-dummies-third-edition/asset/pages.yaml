    KDE, as shown in Figure 10-7, is the K Desktop Environment. This is the older
    of the environments that we cover in this book — although not the oldest piece
    of Linux GUI by any means — and, therefore, is quite stable. Some, however, don''t
    find it as intuitive to navigate as GNOME.


    The main KDE Web site is www.kde.org/'
