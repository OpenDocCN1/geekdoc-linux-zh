  md: '# 210 Part IV: Sinking Teeth into Linux


    # Telnet


    Telnet provides the capability to remotely access and interact with another system.
    Telnet has been around for some time and is one of the first protocols developed.
    With Telnet, you can access another system and enter commands at the keyboard,
    which are executed on the remote system you are attached to. Linux supports the
    Telnet protocol. You can access a Linux system from another computer and interact
    with the remote Linux system. In a Telnet session, you can do almost all tasks
    and run applications that you can perform sitting in front of the Linux system.
    In matter of security, however, you are not permitted to perform some actions
    from a remote connection. Figure 13-5 shows an example of a Telnet command interface,
    or session, from one system to another.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_237_0.png)


    # Web services


    Probably one of the most common services today is Web services. This service provides
    a graphical interface to interact with information, and it supports many types
    of data. You can place a Linux Web server on your local network and provide an
    Internet service on your intranet. Linux is one of the most popular operating
    systems for running a Web server. The best-known Web server software is called
    Apache, and it runs many major corporations'' large intranet and Internet Web
    servers. We discuss Apache in Bonus Appendix A. Figure 13-6 shows the test page
    from an Apache Web server on a Linux system.


    # Distinguishing inside from outside


    The concept of your network refers to services and systems accessing those that
    are physically located on your network. Because being local, this provides you
    with fast access to resources and easy access for maintenance. This also provides
    a level of security. If you keep everything local and don''t connect to any other
    network, you confines all of problems to your network.'
