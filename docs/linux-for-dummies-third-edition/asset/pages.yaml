    w stands for write (or save). You''re now back in the file within Command mode.


    > Want to close the file without saving changes? In the previous step list, follow
    the first two steps. When you get to Step 3, type qt instead of w.


    # Checking Out Other Text-Based Text Editors


    As a command prompt Linux user, you have dozens of text editors available to you.
    We don''t want to overwhelm you with choices, so we cover just two'
