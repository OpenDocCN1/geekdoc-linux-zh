    GNU: (Pronounced "ga-new.") means GNU''s Not Unix. GNU mainly refers to the Unix-like
    operating system that arose from Richard Stallman''s free software project effort
    (in cooperation with the Free Software Foundation). When combined with the kernel
    that Linux Torvalds developed, the complete operating system was born.


    GPL (General Public License): A unique and innovative software license that protects
    software users under copyright law to use, alter, and distribute the software
    in any way they choose. GPL also stands for Guaranteed Public Free. See copyleft
    software.


    GUI (Graphical User Interface): (Pronounced "gooey.") An alternative to a command
