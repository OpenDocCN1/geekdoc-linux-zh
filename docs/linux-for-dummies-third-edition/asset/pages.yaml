    # # Will Linux Work on a Laptop?


    Making Linux work on a laptop is a trying, and sometimes lousy, proposition. Even
    the distribution vendors'' technical support Web pages and FAQs shy away from
    this topic. Instead, nearly everybody points to a single, spectacular resource
    on the subject: the Linux Laptop Pages. If you''re aiming to install Linux on
    a laptop, I suggest that you visit these pages before even THINK about starting
    the install process. You can visit this outstanding Web site at www.cs.utexas.edu/users/kharker/linux-laptop/.It''s
    a veritable treasure of information. Be sure to put it on your hit list!


    The short answer is through constant attention and effort. A longer answer to
    this question requires us to remind you the answer to most real questions in life
    is: That depends. What it depends on in this case is the mechanism, or mechanisms,
    your distribution site may support. Most such operations post updates and notices
    to a Web page, assuming that users check the page regularly and take appropriate
    action when new stuff appears. Other such operations may operate mailing lists
    for update or new release notification, or they may post such notifications to
    an appropriate Linux newsgroup.


    The thing is, you''re going to have to poke around your distribution site to learn
    how it posts upgrades and where to get them. For Red Hat Linux (the poster child
    for this book), visit their official update page at www.redhat.com/errata to grab
    the latest and greatest updates. For new releases, you will have to poke further
    around their site on a release-by-release basis. Red Hat also operates a mailing
    list called redhat-announce-list to publicize updates, which you can check at
    www.redhat.com/mailing-lists/redhat-announce-list/.


