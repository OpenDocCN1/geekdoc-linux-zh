    # Printing architecture


    If you have several users printing to the same printer, a mechanism to receive
    and store the print files until the printer is available must be in place. If
    such a mechanism is not in place, users can''t perform any other activities on
    their systems until their print files print. The Linux printing environment provides
    the capability to store print files temporarily, which is known as *spooling*
    or queuing.


    Software known as the *line printer daemon (lpd)* manages the Linux printing service.
    This is activated automatically after Linux starts if you set up printing. The
    daemon is responsible for checking to make sure that you configured your environment
    for printing. The command to send output to a printer is *lpr*.


    One of the tasks tasks printing management system performs is to make sure that
    you define a printer to send your output to. If that checks out, the *print* command
    output spools to a storage location. This storage location is a directory where
    the print files are written. The spool directories are located in the `var/spool/lpd`
    directory. If the spool directory already contains print files or jobs, the last
    print file is placed at the end of the line, or queue. After the first file ahead
    of yours, which is sent to the printer.'
