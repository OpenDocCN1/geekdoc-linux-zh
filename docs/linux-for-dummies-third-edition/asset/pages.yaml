  md: '# # Chapter 10

    # Gettin'' Gooey with the GUIs


    *In This Chapter*


    +   - Checking out GNOME

    - GNOME tips and tricks

    - Glancing at KDE


    When deciding between a command-prompt interface and a GUI, you need to first
    consider speed. If you plan to compile programs or perform other-intensive tasks
    that tend to slow down your machine, the GUI only is going to add to the speed
    problem, especially if you don''t have a fast computer.


    Readability can also be a big issue in choosing the GUI and the command prompt.
    If you have a hard time reading text in those small command-windows from within
    the GUI, you can either make them and their fonts bigger, or you can work directly
    at the command prompt outside of the GUI. In this case, you may or may not want
    to close the GUI. We cover how you can manipulate all these items in the next
    section.


    The X Window System (or X) opens a world of possibilities that some people find
    downright overwhelming. In this chapter, we try to narrow it down as much as possible
    and give you enough information to explore it deeply, after you''re ready. In
    general, X is a set of applications that work together to provide a graphical
    interface. Some parts draw the windows, some manage the look and feel, and others
    handle other aspects of the graphical world for you.


    The two biggest GUI contenders for Linux are GNOME and KDE. Because Red Hat Linux
    7 comes with this book and GNOME is the default GUI for Red Hat Linux, this chapter
    mostly covers GNOME. The section "KDE, the Other Windows-like GUI," later in this
    chapter, includes screen shots and brief coverage of the KDE interface so that
    you can compare KDE to GNOME.


    # ## Checking Out GNOME Basics


    GNOME (see Figure 10-1) is the GNU Network Object Model Environment. We know —
    that doesn''t tell you much, does it? It''s a full desktop environment,'
