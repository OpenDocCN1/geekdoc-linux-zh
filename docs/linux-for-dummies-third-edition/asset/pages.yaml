  md: '# Chapter 3: Installing Red Hat Linux


    # Defining partitions manually


    If you choose to define partitions manually, you can choose between two main Linux
    tools that you can use: Disk Druid and fdisk. When the installation gets to the
    Automatic Partitioning screen (refer to Figure 3-6), you have the option to accept
    the default or to set your partitions with Disk Druid or fdisk.


    To use Disk Druid, select Man partition with Disk Druid and click Next. The Partitions
    installation screen appears, as shown in the following.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_70_0.png)


    Disk Druid enables you to delete existing partitions and add new partitions. If
    you don''t know how to use Disk Druid, we recommend that you not proceed any further.
    Click Back to return to the Automatic Partitioning screen.


    The following example shows an example of adding a 20MB Linux native partition
    to the hard drive with Disk Druid.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_70_1.png)


    (continued)'
  merge: -1
