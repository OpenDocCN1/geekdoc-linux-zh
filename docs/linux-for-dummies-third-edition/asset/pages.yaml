  md: '# About the Authors


    Dee-Ann LeBlanc, RHCE, is a writer, course developer, and trainer who specializes
    in Linux topics. She is the author of numerous books on Linux and other computer
    topics, including most recently Linux System Administration Black Book (Coriolis,
    2000), General Linux I Exam Prep (Coriolis, 2000), and Linux Install and Configuration
    Little Black Book (Coriolis, 1999). When she''s not teaching, developing course
    materials, writing, or chatting about Linux topics online or at conferences, Dee-Ann
    hikes with her dog Zorro and experiments on her husband with new recipes. See
    the latest that Dee-Ann''s up to www.Dee-AnnLeBlanc.com/


    Contact Dee-Ann at dee@renaisoft.com


    Melanie Hoag, PhD, MCNI, MCNE, MCT, MCSE, is full-time trainer for Productivity
    Point International in Austin, Texas, where she teaches a variety of network-related
    subjects that include Linux. She''s currently preparing for Saif''s LCA (Linux
    Certified Administrator) and LCI (Linux Certified Instructor) certification. Melanie
    is the author of two books on NetWare: Exam Cram for Advanced NetWare 5 Administration
    and Exam Cram for Service and Support (by The Coriolis Group). When she''s not
    busy with teaching, writing, or researching, Melanie and her family raise and
    show Texas Longhorns and keep with a few Black Angus cattle, chickens, and two
    golden retrievers outside Hutto, Texas.


    Contact Melanie at MelHoag@aol.com


    Evan Bloomquist is CEO and Director of Training for Viking Systems, Inc. (www.vikingsystems.com),
    which develops courseware and provides technical training services exclusively
    on open source topics. He has authored three instructor-led courses for Viking
    Systems and is an advocate for the use of free software in the corporate enterprise.
    Evan''s professional computing career began in the mid-1980s and he hasn''t left
    the trenches since. Holding positions from Computer Operator to CEO, he has seen
    how the information revolution has affected people and business from many angles.
    In those rare days away from the free software crusade, Evan enjoys spending time
    with his family, preferably exploring the back roads of the desert southwest.


    Contact Evan at evan@vikingsystems.com'
