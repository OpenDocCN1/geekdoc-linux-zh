  md: '# 260 Part IV: Sinking Teeth into Linux


    ![](img/4e9f259b21147d1fb7569159ef49ec31_287_0.png)


    Figure 15-13: The tool''s Old CD-ROM drivers (not SCSI, not IDE) dialog box.


    +   5. If you want to completely deactivate this category, click the n diamond
