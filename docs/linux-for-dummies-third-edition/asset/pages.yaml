  md: '# 234 Part IV: Sinking your Teeth into Linux


    # # Checking the file system


    Whenever you shut down your machine, you can use the -f option to skip the file
    system check after the machine comes back up. Even if you do this every time,
    Linux only enables you to get away with it a set number of times before it decides
    to take over and do a check anyway. However, we recommend not always using -f.
    Checking the file system costs you an extra minute or so in boot time, although
    it can save you panicked hours of trying to revive a damaged machine later.


    You can also manually check file systems using the e2fsck command as follows:


    +   1. **Type df to see whether the item that you want to check is mounted.**


    The df command lists the mounted partitions and media, as well as some statistics
    about them. You may, for example, see what''s shown in Figure 14-3.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_261_0.png)


    +   2. **If the item is mounted and not vital for using the system, type unmount
    mount point (specifying a particular mount point) to remove it from the file system.**


    If you want to manually check a portion of the file system that''s vital for the
    running of your Linux machine (/bin, and so on), you must boot with rescue disks
    so that you can unmount these directories (Rescue disks are special boot disks
    that you use in emergencies, when your system isn''t booting correctly; see Chapter
    5 for more information.) This is a huge pain! Luckily, Linux actually checks these
    directories while it''s booting so that you don''t need to do it manually.


    +   3. **Type e2fsck /dev/device (specifying a particular device) to run the check.**


    This can take a while. Table 14-5 shows few options that you may be interested
    in adding. If you decide to use an option, use the format e2fsck options /dev/device
    (specifying any options and a device).


    +   4. **Type mount /dev/device mount point (specifying a particular device and
    mount point) to put the partition back in the file system if you want or need
    to do so.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Chapter 14: Checking Out the Linux System


    | Table 14-5 Commonly Used Options for e2fsck |

    | Option | Purpose |

    |---|---|n| -f | Convince e2fsck to check the file system even if it tells you
    that the file systems already been checked and declared clean. |

    | -n | Answers "no" to all questions regarding whether things should be fixed
    or not. |

    | -p | Repairs the file system without asking any questions at all; subsequently,
    you can''t see what''s done. |

    | -y | Answers "yes" to all questions regarding whether things should be fixed
    or not. |


    # Segmenting the problem areas


    If you''ve already installed Linux at this point, some people often reinstall
    several times before they''re really happy with the setup. One smart thing that
    you do is place parts of the file system that change frequently onto their own
    partitions. The segments of concern traditionally are /var and /tmp at the very
    least. These portions of the file system can change many times—every day, every
    hour, or more on some machines. If changes occur this much, something''s likely
    to go wrong with the disk media.


    Isolating these onto partitions minimizes the damage these changes can inflict
    on the rest of the file system. If /tmp is on its own partition and disk damage
    occurs from wear and tear due to /tmp''s constantly changing contents, this problem
    can affect other files only within /tmp. If /tmp is in with the root partition
    and something goes wrong with /tmp, however, another segment of the file system
    may later try to use that part of the hard drive. If you placed a critical file
    there, you can suddenly have quite a serious problem.


    # Leaving spare room


    One of the most insidious problems that all computer users run into from time
    to time is a lack of disk space. The scope of this problem depends on a number
    of things. The primary issue is that, if your root partition becomes 99 or 100
    percent full, you''re going to need to use rescue techniques to boot the machine
    and clean it out. That''s no fun, is it?


    In the beginning, you''re probably not in danger of filling the drives, unless
    you barely had enough room to install Linux in the first place. Over time, you''re
    probably going to forget about watching the drives for'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 236 Part IV: Sinking Your Teeth into Linux


    space. Even experienced administrators run into this problem, certainly you''re
    forgiven if you do it as well! Save yourself the worry and make sure that you
    know how to get regular updates about how full all of your partitions are. To
    access the drive updates, follow these steps:


    +   1. Log into the account that you tend to use the most.


    +   2. Type vi .bash_profile to open your main login settings file.


    The file opens in the vi editor.


    +   3. Type G to jump to the end of the file.


    The cursor is now on the last line.


    +   4. Type o to open a new line after the line your cursor rests on and to enter
    vi''s Insert mode.


    +   5. Type df -h.


    You really need the df command by itself; the -h option refers to human-readable,
    making the amount of space used and available easier for you to read.


    +   6. Press Esc to return to vi''s Command mode.


    +   7. Type ZZ to save and close the file.


    Next time that you log into this account and then on, you get a list of the space
    available and used on all mounted media.


    # Sharing Files By Using NFS


    If you install multiple Linux computers on a network, you may want to share a
    partition or section of the file system between two or more of them. You can share
    the /usr hierarchy (see the section, "Meet the /usr subdirectories," earlier in
    this chapter) among multiple Linux machines. An even more popular item to share
    is the /home hierarchy, which allows you to access the same files in your user
    directories regardless of which Linux machine you''re logged into. A lot of steps
    are involved in making this work, so we break it down into tasks.


    All these instructions assume that each machine have the same usernames. If Bob
    uses the username bob on one, pfred on another, and blue on a third, you need
    to adjust his settings so that his home directory always points to /home/bob,
    even if his account''s something else. To do so, see the section, "Changing the
    home directory," later in this chapter.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_263_0.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 14: Checking Out the Linux File System


    # Creating a shared directory


    You first need to set up the directory that''s going to contain every machine''s
    home directories. You may want to make this its own partition, or even a separate
    hard drive, depending on how many users you activate and how much space you expect
    them to use. To set up this directory, follow these:


    +   Choose which Linux machine you want to host the central /home directory.


    +   Log into that machine as root.


    +   Open the file /etc/exports in your preferred text editor.


    This is the Network File System (NFS) central configuration file. By default,
    it''s empty.


    +   Type /home networkaddress(rw,root_squash).


    This line ensures that the /home directory and all its subdirectories are sharable
    between all the computers in share, they can both read and write to their directories.
    We''re not, however, letting root access its home directory remotely. We don''t
    need to — the root home directory is /root, not /home!


    The format of networkaddress is important here. In Chapter 7, we show how to set
    up your Internet connection, and in Chapter 13, we show how to set up your Local
    Area Network (LAN). Refer to these chapters if you need to brush up on this information
    because you need a basic grasp of it. The networkaddress entry can be any one
    of the following:


    +   A single full IP address. (You can have a copy of this line for each machine
    if you want, rather than merging them into one.)


    +   A single machine''s full name and domain information in the format host extension.


    +   All machines in a domain format *.domain.extension.


    +   The entire network IP information in the format /network/netmask.


    Inside the parentheses, we set the rules for access. In this case, the rw refer
    to read-write access so that people can both look at information in this directory
    and save their own files to it. The root_squash means that root can''t use this
    shared directory. Although you can remove this item, best leaving it alone. The
    root account has a lot of high-level permissions and you want to limit its capability
    to move from one to another as much as possible.


    +   Save and exit the file.'
  merge: -1
