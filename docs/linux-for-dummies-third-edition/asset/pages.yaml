  md: '# 14 Part I: Getting Your Feet Wet


    # So, where did Linux come from?


    To understand Linux requires a peek at its rich heritage. Even though programming
    of the Linux core started in 1991, the design concepts were based on the academic
    and time-proven Unix operating system.


    science student, he also wanted to look inside the software to see how it worked.
    This was impossible to do with the proprietary, and closed source, system that
    came with his PC.


    Unix was developed at Bell Laboratories in the early 1970s by programmers for
    programmers. The original architects of Unix created it out of a need for a special
    layer of software known as the operating system. This provided tools for abstract
    computing tasks to a human level, and also portability that would simplify the
    installation of it on new computer hardware as it emerged. In other words, some
    engineers needed a tool that wasn''t available at the time, so they built it.


    Torvalds set out to write an operating system himself. Six months later he posted
    his work to the Internet for anyone else who was interested in the work he was
    doing. Writing an operating system is no small task. After six months of his work,
    Torvalds had made very little toward the general utility of the system. Still,
    there were enough people on the Internet he shared his interest and curiosity.
    Before long, some of the brightest minds around the world were contributing to
    Linux'' project, adding enhancements or fixing bugs.


    In 1991, Linus Torvalds was a computer science student at the University of Helsinki
    in Finland. He wanted an operating system for his 386 personal computer that was
    like the Unix he''d fond of at the University. As a computer


    Torvalds originally referred to his project as Freaks but later changed it to
    Linux. Can you imagine convincing your sympa that an operating system known as
    freaks would be good for them?


    # Anatomy of an Open Source Software Project


    > "Linux is not a product. Linux is an organic part of a software ecosystem."


    Just as science forever attempts to classify and identify the world, technology
    commentators are currently trying to understand how this open source model creates
    superior software. We have many reasons to have out our innate desire to fill
    a need with a correct solution. Although the essence of why open source works
    perhaps is yet to be identified, the framework has been recognized.'
  merge: -1
