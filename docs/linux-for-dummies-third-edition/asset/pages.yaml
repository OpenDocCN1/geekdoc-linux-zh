  md: '# 90 Part I: Getting Your Feet Wet


    +   * PCI (Peripheral Component Interconnect): PCI is probably the most common
    interface today for your NIC (network interface card), video, SCSI, and sound
    cards. Devices placed on separate communication channels (buses) don''t have to
    compete with other access to the bus. Each PCI bus can support up to ten devices.
    The PCI bus also supports *mastering*, which enables the devices to do their own
    processing without the need to bother the CPU. Non-PCI and older architectures
    are typically ISA devices. ISA (which stands for Standard Architecture) devices
    operate more slowly than PCI because they depend on the CPU for processing and
    data exchange. You still find slots for ISA cards on newer computers. In general,
    if you have the choice between a PCI or an ISA device, choose the PCI device.
    You can see what PCI devices are use in your system by examining /proc/pci (see
    Figure 6-3)


