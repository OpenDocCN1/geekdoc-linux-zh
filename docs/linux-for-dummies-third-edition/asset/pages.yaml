  md: '# 184 Part III: Getting Up to Speed with Linux


    # Listing current values


    You can see current environment variable settings in two different ways. First,
    though, you must understand one more thing about how the bash shell handles variables:
    A variable has one name and its value has another name. For example, we can talk
    about the prompt environment variable, PS1. When we talk about its value, we''re
    talking about $PS1.


    Now onto how to view variable contents. You can look at them one at a time by
    using the format echo $variable (inserting appropriate word for variable) — this
    works for regular and environment variables. For example, to see what the contents
    of your prompt environment variable look like, type echo $PS1. If you''re using
    Red Hat Linux, you see the following:


    ```

    [$@\h \W\]

    ```


    See Table 11-2 for the various components available to the bash prompt environment
    variable. You may want to utilize this information to play around with what your
    command prompt looks like in one of your user accounts. We tell you how to do
    this in the next section, "Changing Environment Variables."


    | Table 11-2 | Pieces of the PS1 Puzzle |

    | Component | Result |

    | \ | Prints the position of the command in your history list. |

    | \ | Prints the number of commands you''ve used during the current shell session.
    |

    | $ | Prints a $ for user accounts or a # for the superuser. |

    | \d | Prints the date in the following format: day month date. |

    | \h | Prints the name of the machine you''re logged into. |

    | \n | Moves down to the next line. |

    | \s | Prints bash for the bash shell. |

    | \t | Prints XE "lt" component the time in 24-hour format. |

    | \u | Prints your user name. |

    | \w | Prints the lowest current directory level. |

    | \W | Prints the entire current directory. |


    ![](img/4e9f259b21147d1fb7569159ef49ec31_211_0.png)


    Type history to find out what''s in the history list. Then type #!, where # is
    the list location of the command that you want to re-run.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 11: Breaking Linux Out of its Shell 185


    You can also find the settings for all your environment variables at once by typing
    `env`.


    # Changing environment variables


    You don''t have to stick with the original décor of your homey little shell; you
    can change it. You change the value of an environment variable in the format `variable=value`.
    For example, the default HISTSIZE setting may be 500. Maybe you want to shrink
    it so that it only keeps a memory of the last 250 commands. So, you type `HISTSIZE=250`.


    Working with non-numbers is a bit trickier. Static items — ones that don''t change
    until you manually change them — sometimes needs to be enclosed in double quotes
    (") but only for text strings. Text strings are collections of letters that you
    type on the keyboard and this includes the space key. Linux doesn''t know whether
    you''re adding another item when you have a space, or whether you''re still working
    on the same one. So, putting the string in — for example, "Joe Blow" ensures that
    Linux knows exactly what you''re talking about. Things like directories don''t
    count because there aren''t spaces in them, so Linux won''t get confused. Take
    the PATH variable as an example. If you type `echo` you get something like this:


    ```

    /usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin

    ```


    For the path mentioned in the previous line of code, bash first looks for it if
    you type a command (maybe $1) in `/usr/local/bin`, then `/bin`, then `/usr/bin`,
    and then `/usr/X11R6/bin`.


    Perhaps you want to add the directory `/home/raph/PATH` to the end of the search
    path. You can do this by typing `PATH=$home/raph/scripts`. The `$PATH` in this
    case adds to the original. Isn''t that handy?


    So, when do you need quotes? Maybe you want to create a new environment variable
    that contains a quote you really like (this is one from the movie *Mystery Men*).
    You type something like the following:


    > "We''ve got a blind date with destiny, and it looks like she''s ordered the
    lobster."


    Now, when you type `echo $QUOTE`, you see that text. You don''t always use double
    quotes. They refer to things that aren''t going to change. Some environment variables,
    however, change on a regular basis. The most notable of these is the prompt variable
    PS1. Whether it changes or not depends on what values you put in it. The following
    raw code shows bash sees the prompt:


    ```

    \[u@\h \W]\$

    ```


    ![](img/4e9f259b21147d1fb7569159ef49ec31_212_0.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'As you can see from referring to Table 11-2, this prompt translates to the
    following:


    ```

    [user@host lowdir]$

    ```


    The lowdir entry is the lowest part of the directory you''re in. For example,
    if you''re in /home/jon, it just prints jon. Every time you change directories,
    this entry changes... if you placed it inside single quotes (''''). If you put
    a prompt entry inside double quotes, then bash assumes it doesn''t need to pay
    any more attention to it! Putting it inside single quotes tells bash to look at
    it regularly.


    Suppose that you want to change the prompt for your account to like the following:


    ```

    We''ve got a blind date with destiny, and it looks like she''s ordered the lobster.

    user@host fulldir]$

    ```


    Yes, that''s a lot of text, but some folks like it! How can you do like that?
    You simply type the following:


    ```

    PS1=''$QUOTE\n[\u@\h \w]\$ ''

    ```


    In the preceding line of code, notice the extra space at the end of the prompt
    before the end quote. You need to add this if you want a space between the $ and
    the cursor.


