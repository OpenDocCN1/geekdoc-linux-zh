  md: '# Chapter 2: Prepping Your Computer for Linux


    # Trying to Boot from CD-ROM


    A really nice installation option is the ability to install Linux from the CD-ROM.
    This means you don''t have to have any other operating system already installed
    on your hard drive to install Linux. Before you attempt to set up your system
    to boot from a CD, you must complete two steps:


    +   1. Determine if the Linux installation CD is bootable. You see this information
    in the documentation or in the features listing of your Linux distribution.


    The version of Linux that comes on the CDs with this boot — Red Hat Linux 7, to
    be exact allows installation directly from CD.


    +   2. Determine if your system is capable of booting from a CD. If you''ve ever
    booted your system from a CD, you''ll have no problem booting from the Linux installation
    CD.


    Whether or not you''ve booted from a CD first, most computers enable you to boot
    from the hard drive or floppy disk. Many others enable you to boot from a CD or
    other removable media such as a Zip drive. Your system''s BIOS configuration enables
    you to select the storage devices that are checked for an operating system at
    boot time.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_52_0.png)


    An easy way to tell if your computer can boot from CD-ROM is to simply put CD1
    that came with your CD-ROM drive and boot (or reboot) your computer. If your computer
    boots from the CD, your computer is set up to boot from CD-ROM. If your computer
    ignores the CD-ROM, your computer isn''t set up to boot from CD-ROM. In that case,
    you can try to set up your computer to boot from CD-ROM or give up and create
    a boot disk, as we show you how to do in the following section.


    When you start your computer, you will see a line of text indicating the keyboard
    sequence to enter your computer''s setup or BIOS settings. If this information
    does not appear on-screen and you don''t know the key sequence, check the documentation
    that came with your computer or check your computer manufacturer''s Web site.


    If your computer can''t boot from a CD, you won''t see an option to choose the
    CD as a bootable device in the BIOS settings.


    Refer to the BIOS settings to see the order in which the system looks for an operating
    system. If your computer can boot from a CD and is set up that way, the first
    device searched is the CD drive. Many BIOS allow you to specify the order of devices
    to boot from. For example, if your system''s boot device order is as follows,
    the system first tries to boot from the CD-ROM.'
  merge: -1
