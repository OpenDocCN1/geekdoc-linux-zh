  md: '# Linux For Dummies, 3rd Edition


    You don''t need to be a master logician or a wizard in the arcane art of programming
    to use this book, nor do you need a Ph.D. in computer science. You don''t even
    need a complete or perfect understanding of what''s going on in the innards of
    your computer to deal with the material in this book.


    If you can boot a PC, or install an application on your machine, then you''re
    better off than nine out of ten playground bullies — and you can install, configure,
    and manage a basic Linux system. If you have an active magician and the ability
    to solve rudimentary problems, even better — you''ve already mastered the key
    ingredients necessary to making Linux work for you. The rest is details, and we
    help you with those!


    # How This Book Is Organized


    This book contains six major parts, arranged in an order to take you from Linux
    installation and configuration through the activities and issues involving keeping
    a Linux system up and running, if not humming like a (happy!) top! Most parts
    contain three or more chapters or appendix, and each chapter or appendix contains
    modular sections. Any time you need help or information, pick up the book and
    start anywhere you like, or use the Table of Contents and Index to locate specific
    topics or key words.


    Following is a breakdown of the book''s six parts and what you will find in each
    one.


    # Part 1: Getting Your Feet Wet


    This part sets the stage and includes an overview of introduction to the terms,
    techniques, and software components that make Linux the raging soft tiger that''s
    ready, willing, and able to do its operating system thing. Of course, we also
    introduce you to the Open Source movement that made Linux possible and powerful,
    along with many and various software components, and lots of step-by-step instructions
    that take you a hunk of inert metal and turn it into a functioning Linux system
    (assuming that the hunk of inert metal you start with is a properly-configured
    PC and not a lawn mower, anyway).


    To be a little more specific, you start out with a Linux overview that explains
    what Linux is, where it came from, and how it works. Next, you tackle the various
    tasks and activities involved in preparing for installing Linux on a PC. After
    that, you go through the motions necessary to configure your Linux system to do
    what you want and need it to do. The experience culminates by giving Linux the
    boot — not to get rid of it by any means — but rather, to fire'
