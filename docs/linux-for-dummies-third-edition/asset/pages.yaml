  md: '# Main Menu tools


    The Main Menu tools are all fairly simple beasts, available to help new and old
    Linux users adjust more easily to the GNOME desktop environment.


    # The Run tool


    After you choose the Run option on the Main Menu, the Run Program dialog box appears,
    as shown in Figure 10-4. To run a program by using this dialog box, do one of
    the following:


    +   * Type the path to the program (including the program) in the text box.

    * Click the drop-down list button to select a program you already ran using this
    dialog box.

    * Click the Browse button to find and select the program that you want to run.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_196_0.png)


    After you have the program you want, click Run in Terminal if you want the program''s
    output displayed in a virtual terminal; leave this button alone if you want the
    program to run quietly in the background. Then click the Run button.


    # The lock screen tool


    After you choose the Lock screen option on the Main Menu as but the root user,
    your screen fades to black or your screensaver appears — this tool doesn''t work
    for the root user. If anyone moves the mouse or uses your keyboard, a dialog box
    appears with your login name in it. Access to this GUI session is granted only
    if your password is entered.


    Notice that we say GUI session and not machine. Folks who know how to sidestep
    out GNOME (something we discuss in the section, “Checking Out GNOME Tips and Tricks,"
    later in this chapter) can change over to a virtual terminal and do whatever they
    want. So don''t think of this as completely securing your machine.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 170 Part III: Getting Up to Speed with Linux


    # The Log out tool


    After you choose the Log out option on the Main Menu, the screen darkens somewhat
    and the "Really log out?" dialog box opens. To use this box, do the the following:


    +   1. If you want GNOME to remember what items you have open and return you to
    its current state after you log back in, make sure that you select the Save Current
    Setup check box.

    2. Determine whether you want to log out of the machine, shut it off, or reboot
    it.

    3. Click Logout, Halt, or Reboot to set the appropriate action or click No if
    you don''t want to do any of these.

    These options do the following:

    * Logout: Exit GNOME and return to the command prompt.

    * Halt: Shut the machine down and then off. You must be able to enter the root
    password to use this option.

    * Reboot: Shut the machine down and then bring it back up. You can use this only
    if you know the root password.


    # The Panel


    Along the bottom of your GNOME desktop is a long bar with icons on it. This is
    the Panel. Because this bar is neatly divided into sections, take a look at each''s
    section from left to right. On the far left of the Panel is the GNOME Main Menu
    button (refer to Figure 10-1), which opens the appropriate Main Menu.


    To the right of this is the section where applets show up. You can add small programs
    to the panel for a variety of reasons. We get into how to do this in the section
    "Checking Out GNOME Tips and Tricks," later in this chapter.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_197_0.png)


    To use the special character applet, position the cursor where you want to place
    the character and then click on the character to insert it.


    As we continue our journey to the right, we run into the standard set of GNOME
    tools. You can actually reach all these through the Main Menu, but they''re placed
    here so you can find them quickly and easily. Notice the Help icon (refer to Figure
    10-1). The next button opens a virtual X terminal, as shown in Figure 10-5, so
    that you can get a command prompt. And, and finally, the GNOME Center button.
    You want to use this one lot, especially as you''re first setting up your system.'
