  md: '# Part VI: Appendixices


    And some people say that installing Linux is hard! What could be easier than this?
    On the other hand, if all you want to do is investigate the contents of the Linux
    installation CDs (CD1 and CD2, to be exact), simply insert them into your machine''s
    CD player (one at a time, please — you won''t like what happens if you try to
    read all at once, trust us!). After that, you can browse through each CD''s contents,
    which we describe in the ‘What You''ll Find’ section later in this appendix.


    # Checking out the bonus content


    To check out the bonus appendixes, mount CD3 in Red Hat Linux (typing mount cdrom
    at a GNOME virtual terminal and then pressing Enter should do the trick if it
    isn''t already mounted). Next, open the GNOME File Manager (by clicking the Main
    Menu and choosing Programs*; File Manager) and navigate to /linux_dummies directory
    on CD3 double-click the icon representing the appendix you wish to view. xpdf
    opens the file and you can use the navigation buttons at the bottom of the xpdf
    window to check out the chapter (click the arrow buttons to flip pages).


    For the links page, simply navigate to the file (in the same folder as the PDF
    appendixes mentioned in the preceding paragraph) using the GNOME File Manager
    and double-click the file to automatically open it in Netscape Navigator.


    # What You''ll Find


    Here''s a summary of the software on the CDs arranged by directory organization.
    If you use Windows, the CD interfaces help you navigate the CDs easily; you''ll
    only be able to surf the CD in a meaningful way if you''ve already got Linux installed.


    You probably won''t need to spend much time using CD1 after you''ve installed
    Linux on your machine. That is Linux copies everything from that CD0 into your
    machine during the installation process. You may need to access CD2 at some point
    or another, should you decide to install any of the supplementary software that
    it contains.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_389_0.png)


    # About CD1


    The contents of CD1 pretty much consists of Red Hat Linux 7, plus key software
    distributions that are installed automatically or that you can opt to install
    should you choose to do so during the installation process. This CD'
  merge: -1
