    # Packaging Linux: The Distribution


    What we call a Linux distribution is actually the culmination of the GNU project,
    Linux kernel, and a number of other open source software development projects
    that have sprung up along the way.


    Robert Young, CEO of Red Hat, has coined the analogy comparing Linux to catsup.
    Essentially, the operating system we call Linux, with the GNU tools, Linux kernel,
    and other software, is freely available commodity that, like catsup, different
    distributors can package and label in different containers. Anyone is encouraged
    to package and market the stuff, even though the ingredients are fundamentally
    the same.


    Because Linux is a very complex, malleable operating system, it can take on many
    appearances. The greatest advancement with Linux in recent years has been being
    an easier installation. The tools and methods haven''t tradition-been available
    to the casual PC user to install Linux. Companies such as Red Hat saw this as
    an opportunity to add value to an existing product.


    Following, in alphabetical order, are a few of the major Linux distributions along
    with a short comment on each:


    +   - Corel Linux: This relatively newcomer to the Linux distribution list has
    made an impressive entrance. The installation process is very simple and does
    a great job of detecting and automatically configuring many sound and video adapters.
    Corel also comes bundled with Corel''s famous WordPerfect processing package which
    has been ported to run on Linux.


    +   - Debian GNU/Linux: This distribution is one of the oldest and recognized
    favorites among advanced technical circles. Historically, it''s relatively difficult
    to install; perhaps this can be correlated to the very high granularity of installation
    options. The Debian team works closely with the GNU project and is considered
    the most open of the Linux distributions.'
