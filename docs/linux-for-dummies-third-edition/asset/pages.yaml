  md: '# Introduction


    Welcome to the fascinating world of open source software that is Linux. In this
    book, we introduce you to the wonders of the Linux operating system originally
    created by Linus Torvalds in the early 1990s as a labor of love. Our goal is to
    initiate you into the rapidly growing gang of Linux users and enthusiasts who
    are so busy rewriting the rules for the operating system marketplace.


    If you''ve contemplated switching to Linux but find the prospect forbidding, you
    can relax. If you can boil water or set your alarm clock, you too can become a
    Linux user. (No kidding!)


    When this book appeared in its first edition, Linux was an emerging phenomenon
    that was neither terribly well known nor understood. In this edition for a new
    generation of Linux users, we went after the best of today''s broad understanding
    of what Linux is and what it does, along with the most usable of the many online
    resources, tips, and tricks that have gathered around this subject.


    We''ve kept the amount of techno-babble to a minimum and stuck with plain English
    as much as possible. Besides plain talk about Linux installation, boot-up, configuration,
    and tuning, we include lots of examples, plus lots of detailed instructions to
    help you build and manage your own Linux machine with a minimum of stress or confusion.


    We also include with this book three peachy CDs that contain a copy of the latest
    Hat Linux distribution — plus a number of interesting widgets that you can use
    to embell your installation with the best that the Open Source movement has to
    offer for your delectation. For this edition, we''ve added discussions of important
    topics that have come increasingly to the fore (though not yet to the putting
    green) in the last few years. And we carry a timehonored tradition upheld by the
    computer industry generally and IDG Books Worldwide in particular:


    Anything silly you may read in this book is a feature, not a bug!


    # About This Book


    Think of this book as a friendly, approachable guide to tackling terminology and
    taking up the Linux operating system and its retinue of tools, utilities, and
    widgets to build yourself a capable and powerful Linux system. Although Linux'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Linux For Dummies, 3rd Edition


    isn''t terribly hard to figure out, it packs a boatload of details, parameters,
    and administratrivia (administrative trivia, in Unix-speak). You need to wrestle
    them into shape while you install, configure, manage, and troubleshoot a Linux-computer.
    Some sample topics you find in this book include:


    +   - Understanding where Linux comes from and what it can do for you

    - Installing and configuring the Linux operating system

    - Working with a Linux system to manage files, add devices, or add and configure
    software

    - Networking a Linux system for LAN use and Internet access

    - Customizing, tuning, and optimizing your Linux system

    - Managing Linux system security and resources


    Although first glance it may seem that working with Linux requires years of arduous
    training, advanced computer science training, and dedication, take heart: It''s
    not true! If you can tell somebody how to find your office, you can certainly
    build a Linux system that does what you want it to. The purpose of this book isn''t
    to turn you into a full-blown Linux geek (this being the ultimate state of Linux
    enlightenment, of course); it''s to show you all the ins and outs that you need
    to master to build a smoothly functioning Linux system and give you the know-how
    and confidence to do a great job!


    # How to Use This Book


    This book tells you how to install, configure, customize, and tune a Linux system.
    We tell you what''s involved in using this powerful and capable operating system
    after it''s up and running — assuming, of course, that''s why you bought this
    book in the first place — and maybe have some high-tech high jinks along the way.


    Because much of the input needed to make Linux do this things happens at the command
    prompt — where you type detailed instructions to load or configure software, access
    files, and so forth — input appears in monospaced type like this:


    ```

    rmdir /etc/bin/devone

    ```


    When you type Linux commands or other related information, be sure to copy the
    information exactly as you see it in the book, because that''s part of the magic
    that makes Linux behave properly.'
