    — Quentin Crisp


    You can''t use a computer without some point needing to manipulate files and directories.
    At this point, Linux begins to remind most people of the command-prompt days of
    MS-DOS. But you will find a lot of differences that you have to deal with along
    the way. Because this is a general Linux tome instead of about one specific distribution,
    we''re going to discuss how to work with files and directories at the command
    prompt, which rarely changes from distribution to distribution. We get into some
    fancy stuff near the end.


    # Comprehending File Types


    You find a lot of different file types out there in the Linux world. By types,
    we''re not referring to extensions, such as .exe or .doc. The type issue instead
    a reflection of what the file is and how you''re meant to use it. In the following
    sections, we show you how to see what''s in your file system, each of the file
    types that you use in Linux, and how to figure out which type you''re looking
    at.'
