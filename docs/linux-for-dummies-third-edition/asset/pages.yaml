  md: '# Plugging network holes


    Linux manages incoming connections in two different ways. The first involves individual
    programs. You can control these using the tools that we describe in the next section.
    The second method of managing incoming connections, however involves a central
    program that watches on many ports. This program answers the door when a network
    client — maybe an FTP client — comes knocking and starts the program that handles
    the service.


    The program that handles these centralized network services is the superdaemon.
    (You can refer to Bonus Appendix A on the CD for a discussion concerning daemons
    — we do just a quick review here.) A daemon is a program that runs in the background
    and typically handles network services. The superdaemon is the daemon that starts
    and stops a bunch of daemons. This program is inetd.


    If you are using Red Hat Linux 7 (which is on the CDs with this book), you''re
    in luck. They''re no longer using inetd, so you can skip to the next section.
    If you''re not using this version of Red Hat or Red Hat at all, then we have a
    quick test to see whether you need to tighten up your networking or not.


    To conduct this test and plug any holes, follow these steps:


    +   1. Type inetd.

    If you see the inetd man page, then continue with the remaining steps.

    If you don''t see the inetd man page, then that''s it. You''re done with the test
    and using the more secure superdaemon, so you don''t need to plug holes.


    +   2. Open /etc/inetd.conf in your favorite text editor.

    This is the superdaemon configuration file. Each distribution has a slightly different
    setup, so ours are going to direct you on how to navigate the file and find what
    you may want to turn on or off.


    +   3. Move down through the file, looking for any line that doesn''t start with
    a #.

    The hash mark, or #, denotes a comment in this file and many others. Linux ignores
    any text on a line after the #. So, if there''s no #, Linux is going to use the
    text on the line.


    +   4. Determine whether you need this service or not.

    This part sounds a bit trickier than it really is. Many of these have distinctive
    names like telnet or ftp. The thing to remember is that you''re'
