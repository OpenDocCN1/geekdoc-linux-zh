  md: '# Chapter 3: Installing Red Hat Linux 37


    To install Red Hat Linux, follow these steps:


    +   1. If you would rather boot and install from the Red Hat installation CD,
    place CD1 that came with this book in your CD-ROM drive and reboot your system;
    if not, place the installation floppy disk in your floppy drive, put CD1 in your
    CD-ROM drive, and reboot your system.


    The default installation mode for Red Hat Linux is graphical. Other Linux distributions,
    such as Caldera and Core, also have graphical installation options. Even though
    the installation screens in other distributions are different than Red Hat, the
    same basic steps are contained in other distributions.


    If you don''t choose any options or press Enter, the graphical installation process
    starts.


    Whether you start the installation from the floppy disk or the CD, the first installation
    screen appears containing several options, as shown in Figure 3-1. We describe
    each option in the following list:


    +   - The first option in the graphical interface is for installing Red Hat Linux
    for the first time or for upgrading an existing version of Linux. This installation
    uses probing to detect your system''s hardware. The graphical interface is designed
    to work with a mouse to select options. If you don''t have a mouse, you can use
    the keyboard to navigate around the screens. In most places, the Tab key and/or
    the arrow keys advance you to the next option, the space bar toggles options off
    and on, and the Enter key accepts the choices and moves to the next screen. In
    most screens, if you want to change a previous setting, a Back button is available
    to navigate to earlier screens. The graphical installation screens also include
    help in the left panel. The content changes to reflect information about the current
    configuration.


    In this chapter, we follow the graphical installation. If you can''t use the graphical
    installation for some reason (if Linux doesn''t support your video card, for example),
    see Appendix B, which you can find on CD3 that comes with this book, to follow
    the text-based installation.


    +   - The second option enables you to install or upgrade Red Hat Linux using
    a text interface. This interface presents the options in text menus and you use
    the arrow keys and/or Tab key to move the selection area. In some areas, the space
    bar is used to turn off and on options. To install the text interface, type text
    at the boot : prompt and press Enter.


    +   - The third option is expert mode. This method enables complete control over
    the installation process and doesn''t use autoprobing for hardware detection.
    In this mode, you need to know all of your hardware specifics. The expert mode
    also enables you to enter optimal parameters for modules. To use this mode, type
    expert at the boot : prompt and press Enter.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_64_0.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_64_1.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_64_2.png)'
  merge: -1
