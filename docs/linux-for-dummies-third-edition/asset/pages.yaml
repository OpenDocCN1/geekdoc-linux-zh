    way that you like to work, rather than leaving you with just one option, which
    may cause you to spend a lot of time and effort researching others.


    # Pico


    The pico text editor is popular among people who don''t want to remember or need
    a lot of complex editing commands. All they want to do is type in their text and
    get on with life. For a glance at what an empty file (which you open by typing
    pico filename) looks like pico, see Figure 12-4.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_220_0.png)


    Figure 12-4:

    The initial pico screen with an empty file.


    You don''t have to worry about modes or memorizing commands with the pico editor.
    Wherever you want plainly see a menu at the bottom of the screen. Whenever you
    see a caret (^) in the menu, you need to press the Ctrl key to execute the command.
    So, for example, to save and quit (Exit), type ^X, or press Ctrl+x (whether you
    use capital or lowercase letters here doesn''t make any difference). In fact,
    all of the pico commands involve the Ctrl key.


    To access the full list of pico commands, press Ctrl+g or F1. To navigate through
    this list, press Ctrl+v to move down or Ctrl+y to move up. The arrow keys do not
    work here. Press Ctrl+x after you''re finished.


    You may not have pico installed by default. Don''t worry, you probably have it
    somewhere in your distribution files. If you''re using Red Hat or a related distribution,
    do the following to install the pico editor (if it''s not already there):


    +   1. Place your Red Hat (or related) CD-ROM in the CD-ROM drive.

    2. Type mount /mnt/cdrom/RedHat to add the CD-ROM to your file system.

    3. Type cd /mnt/cdrom/RPMS to change to the directory containing program packages
    in Red Hat Package Manager format.'
