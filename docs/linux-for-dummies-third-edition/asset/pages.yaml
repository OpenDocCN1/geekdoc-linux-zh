  md: 'Finally, the rest of the filename just provides a reference so that we can
    see what service is being handled. So where do all the actual service programs
    reside and what do they look like?


    The `rc<runlevel>.d` directories contain files that point to the `/etc/rc.d/init`
    directory where all the actual scripts live. You''re welcome to view these files,
    as they''re shell scripts. If you understand shell programming, you can walk the
