  md: '# Chapter 13: Setting Up Your LAN 223


    ![](img/4e9f259b21147d1fb7569159ef49ec31_250_0.png)


    For home or small office use, you may be able to use DSL, cable modem, or satellite
    services. For these, you need to have the hardware to interface with the provider''s
    transmission media. You can configure Linux to work with these types of services.
    This is a growing and changing field, so you may need to do some searching on
    the Internet for solutions or suggestions.


    # Securing your LANs


    If you attached your network to another network, you''ve opened a potential hole
    (or holes) for unauthorized access. This is where a firewall comes into play.
    A firewall is a device that sits between your network and the other side. This
    can be a dedicated hardware device or software running on a machine. You can configure
    Linux as a simple firewall without any add-ons. If you want more substantial protection,
    investigate the various firewall products/packages available.


    You can set up a Linux system between your network and the other network to reduce
    unauthorized access from the outside. This Linux system has two network interfaces:
    one attached to your network and the second attached to the other network. This
    other network can be your access to the Internet or another network in your organization.


    To restrict access from the outside, configure the Linux system as a Network Address
    Translation (NAT) router. NAT translates the IP numbers on one side to an IP number
    that is compliant with the other side''s IP numbers. On Linux, this is known as
    IP Masquerading also just as NAT. To set NAT configure, you need to use IP numbers
    on your network that are in the private IP address ranges. Unfortunately, you
    can''t go into any further detail because of the scope of this book. You can,
    however, check the following for a good reference guide that starts you down the
    NAT path:


    ```

    http://mirrors.indyramp.com/ipmasq

    ```


    Linux has remarkably resistant to viruses. You can bet, however, that somebody
    there is working on a Linux virus or two. You can keep track of virus problems
    by subscribing to notification services (some of which are provided by anti-virus
    software vendors). You may also want to visit www.sans.org and investigate the
    SANS (System Administration, Networking, and Security) Institute. It''s dedicated
    to virus and security issues on a variety of operating systems.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_250_1.png)


    Finally, one last comment about security: To configure your IP numbers, routing
    off or, gateway, and printing all require superuser or root privileges. After
    you configure and enable the features, these standard user accounts can use the
    services.'
