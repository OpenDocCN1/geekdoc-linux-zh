    # # Adding a device driver from the command prompt


    You can also add a device driver from the command prompt. This process uses several
    commands to test and add drivers to the Linux system.


    To add a device driver from the command prompt, follow these steps:


    +   1. **At the command prompt**, use the `cd` command to change to the directory
    that stores the dynamically loadable device drivers.


    Under the /lib/modules directory is another directory labeled with the version
    number of your Linux kernel (for example, 2.2.16-22). Below that directory is
    located the drivers themselves. Figure 6-6 shows several subdirectories for the
    different categories of drivers.


    ```

    $root -l /lib/modules

    $root -l /lib/modules/2.2.16-22

    $root -l /lib/modules/2.2.16-22

    total 36

    drw-xr-x 2 root root Sep 26 09:57 kernel

    drw-xr-x 2 root root Sep 26 09:57 module

    dn-rw-- 1 root root Sep 26 18:24 vxtag

    drwxr-xr-x 2 root root Oct 2  5 build

    drw-xr-x 2 root root Sep 26 09:57 drivers

    drw-xr-x 2 root root Sep 26 09:57 network

    dn-rw-- 1 root root Sep 26 09:57 sound

    dn-rw-- 1 root root Sep 26 10:20 modules_pci

    dn-rw-- 1 root root Sep 26 10:20 modules_pciap

    dn-rw-- 1 root root Sep 26 09:57 scsi

    drw-xr-x 2 root root Sep 26 09:57 scusb

    drw-xr-x 2 root root Sep 26 09:57 virt

    ```


    > **Figure 6-6: The different categories of loadable Linux device drivers.**


    We use a driver in the `/lib/modules/2.2.16-22/net` directory.


    +   2. **Type is `/lib/modules/2.2.16-22/net` at the command prompt** and press
    Enter to display the contents of that directory.


    Network card device drivers are available in the `/lib/modules/2.2.16-22/net`
    directory, as shown in Figure 6-7.


    The long number in the pathname above (2.2.16-22) refers to the Linux kernel.
    If you have a different version of Linux than the copy that comes with this book,
    the directory may vary depending on the kernel version included in the distribution.
