  md: '# Chapter 14: Checking Out the Linux System


    # # Adding media temporarily


    Rarely do you want to keep removable media (floppy disks, CD-ROMs, even Zip disks)
    always in the drive. Even if you did, you probably don''t always want the same
    disk, so you need a way to tell Linux that you attached the disk and where. You
    can do so by using the mount command at the command prompt or in a command prompt
    window in the GUI by the following:


    +   1. Make note of whether you''re trying to access a floppy or a CD-ROM.

    The newest Linux distributions have a handy feature that automatically mounts
    a CD-ROM after you place it in the drive — if you''re in the GUI. Although not
    all distributions have this feature, the one that we include with this book does.


    +   2. If it''s a floppy, type /mnt/floppy; if it''s a CD-ROM, type it /mnt/cdrom.

    If directory doesn''t exist, you need to create it. Use the mkdir command as follows:
    mkdir /mnt/location (specifying the location).


    +   3. If it''s a floppy, make note of the operating system that the disk comes
    from.


    Table 14-4 shows what operating system corresponds to what type label.


    +   4. Put the command together in the following format: mount -t *type* /dev/*device*
    /mnt/*location.*


    You need to replace *italic* words with specific information. To mount a floppy
    disk that you put under Windows 98, for example, mount -t vfat /dev/fd0 /mnt/floppy.


    | Table 14-4 | File System Types That Your Floppy Disk Can Contain |

    | Type | Description |

    | --- | --- |

    | ext2 | Linux |

    | mdsos | Windows 3.11 or earlier |

    | vfat | Windows 95 or later |


    If you''re mounting a CD-ROM, always use the command as follows: mount -t iso9660
    /dev/cdrom /mnt/cdrom (unless for some reason the reason hasn''t made the shortcut
    from the exact CD-ROM driver to /mnt/cdrom). You may be able to use just mount
    /mnt/cdrom in some cases. For a Linux floppy, you can skip the type and just try
    mount /mnt/floppy or mount /dev/fd0 /mnt/floppy.


    To remove the item later, type umount /mnt/location.'
  merge: -1
