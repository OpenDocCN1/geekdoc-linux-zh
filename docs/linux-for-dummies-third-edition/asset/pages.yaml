  md: '# Chapter 7: Connecting to the Internet


    # Beware of devices posing as modems


    We''re going to try and save you some frustrations... and ultimately reduce your
    computer from the hammer. Many a ball-pen hammer. Many Linux newbie has been irritated
    by not being able to communicate with their internal modem. *After all,* the newbie
    reasons, "the same hardware works with Microsoft Windows running on it."


    Your modem is recognized by Windows but not recognized by Linux.


    In short, if you determine that you have a soft modem, Linux simply doesn''t work
    with it. For the adventurous out there, the Lin Modem project (http://linmodems.org)
    has successfully written Linux drivers to work with a few of these softwares.
    We encourage you to become involved in such a project if you''ve moved. These
    groups of explorers drive the wonderful world of *freedom* software that Linux
    is a prominent part.


    Well, the story is: Several years ago, hardware manufacturers developed a *software
    modem* in an effort to reduce hardware costs. The idea was to trim some responsibility
    from the modem and relegate these tasks to the CPU over the operating system.
    The result was an inexpensive interface that routed signals to proprietary software
    that would only operate under Microsoft Windows. In short, so called modems, also
    known as *Winmodems*, aren''t really modems at all, but rather a telephone cable
    interface to Windows.


    The bummer in all this is that you probably saved a few bucks buying a software
    modem, you probably need to acquire a real modem for use with Linux (unless you
    have a LinModem!)


    The following lists methods you can use to determine whether or not you have a
    software modem:


    +   - The model number has an "HFC-", "HSP-", or "HSF-" in front of it.


    +   - The packaging refers to the device as a Winmodem, or designates that it
    only works with Windows.


    We strongly advise searching the Linux modem compatibility list to determine whether
    your modem is a good buddy with Linux. You ultimately save money in headache medicine,
    which you can use to buy a real modem.


    ```

    www.o2.net/~gromitkc/winmodem.html

    ```


    # Selecting an Internet Service Provider (ISP)


    Due to the recent meteoric rise in popularity of Linux, all ISPs are training
    their support staff in the ways of Linux. If you already have a dialup service,
    give them a call to let them know of Linux pursuits. Chances are they already
    have information pertinent to Linux subscribers and can provide you that information.
    If you''re shopping for a new ISP, read on some practical selection advice.'
  merge: -1
