  md: '# Chapter 12


    # # Putting the x in Text


    +   **In This Chapter**

    - Choosing a text editor in Linux

    - Basic file manipulation in vi

    - Basic file manipulation in pico and emacs

    - Basic file manipulation in gnotepad+

    - Available office editor for Linux


    Long ago, in a galaxy far far away, lived an editor named ed. Some were perfectly
    happy to use this editor for the rest of their lives. Others, however found it
    difficult to use and quickly tired of it. From their frustrations, em was born
    in London, England. However, the features in em were not enough for some. Another
    group in Berkeley, California, beefed up em, which resulted in yet another editor—ex.


    Still, some people are just never happy. A fellow named Bill Joy in the Berkeley
    group wanted even more. He especially wanted something that worked well over a
    slow modem connection (300 bps!), which meant the commands had to be very simple
    and quick. After several months of laboring through the night, the vi editor was
    born. That was not the end of the story, though.


    From text editors were born word processors, which not only allowed people to
    input and edit text, but also let them format things with bolts and italics and
    fancy stuff that we take for granted today. In this chapter, we take a look at
    some of the tools that you can use in the text editor and word processing areas.


    # # Getting Prehistoric with vi


    People tend to have a love/hate relationship with the vi editor. Some think of
    vi as a wonderful, efficient, fast-moving tool (often those who know how to use
    it), while others find it cryptic and confusing. Whether you love or hate it,
    you can''t get around the fact that if something is wrong with your Linux'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 188 Part III: Getting Up to Speed with Linux


    computer, vi may be the only editor that you have access to. The whole program
    is small enough to fit on a single floppy disk — a rare these days! We suggest
    that you take the time to get familiar with vi, and then try out other editors
    and decide which one you like best.


    # Opening files


    Because vi is a text-based text editor, opening a file is pretty straightforward.
    You just type vi filename (replacing filename with the name of the particular
    file that you want to see) and the file opens. If the content already exists,
    then you can see it in the file. Otherwise, you get a blank screen, as shown in
    Figure 12-1.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_215_0.png)


    Looking for menus? You won''t see any. The vi editor has help information, but
    no menus. Instead, it has modes. vi has three basic modes:


    +   * Command mode: vi assumes that everything you type is a vi command.

    * Insert mode: vi interprets everything that you type in this mode as that goes
    in the file.

    * ex mode: You can still use those old ex commands in this mode.


    If you have a file open in vi, you can go to the help information by pressing
    the F1 key. To get out of it, type :q and press Enter, which takes you back to
    vi in command mode.


    # Entering text


    To type text in vi, you need to enter Insert mode. To enter Insert mode, follow
    these steps:'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Chapter 12: Putting the x in Text


    +   1. Press Esc to enter Command mode from any mode you may currently be in.


    The layout of this screen looks familiar (see Figure 12-1).


    +   2. Press I to enter Insert mode from Command mode.


    Notice that the screen changes slightly from mode to mode. Figure 12-2 shows a
    blank file open in vi while in Insert mode.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_216_0.png)


    From here, you simply type text until you''re finished.


    You need to press Enter at the end of each line of text, just as you hit the carriage
    return on a typewriter. Otherwise, vi doesn''t wrap the words properly and actually
    sees the text as one long line, making it hard for you to use the editing functions.


    # Editing text


    You have a number of ways you can edit text in the vi editor. You can do the old-fashioned
    way by entering Insert mode and manipulating the text using the Delete key, Insert
    key, and more from your keyboard. However, vi has even fancier options available.
    To use any of these options, the following:


    +   1. Press Esc to enter Command mode from any mode you may currently be in.


    The layout of this screen looks familiar (see Figure 12-1).


    +   2. Use the arrow keys to properly position the cursor for the option to work.


    See Table 12-1 for an explanation of proper cursor positioning.'
