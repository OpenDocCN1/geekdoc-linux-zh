    # Care and Feeding of Your File System


    Regardless of what operating system you''re using, you need to keep your file
    system healthy and happy. Everything that you need to operate the machine and
    do your work (or play) on exists in that file system. Keep it in good shape and
    it''s sure to treat you well in return. Fortunately, Linux does some of this automatically
    for you.'
