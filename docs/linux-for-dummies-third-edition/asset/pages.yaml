    **Open Source software:** Software that can be altered and redistributed without

    a fee and few restrictions.


    **operating system:** The basic program on a computer that runs the main

    system and hardware. Every computer must have an operating system to

    work.


    **owner:** The user who created a file or directory.


    **parent directory:** The two dots near the top of a directory display that refer

    to the parent directory, or the directory one level up from where you are now.

    in In Linux, for almost all user home directories, the parent is /home.


    **partition:** The basic physical unit of a hard drive or other form of mass storage.


    **permissions:** Rights assigned to users and/groups to access files or

    directories.


    **pico:** A text editor used in Linux that''s based on the Pine mail system

    composer.


    **PID (process ID):** A non-negative identification number for running programs.


    **ping:** A command that searches for an IP address on a network to determine

    whether that computer or device is available. The ping command is frequently

    to check connections on the Internet.


    **pipe:** A bash shell feature that enables commands to be connected together

    such that the output of one becomes the input for the next.'
  merge: -1
