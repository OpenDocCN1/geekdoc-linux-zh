  md: '# Chapter 15: Customizing Your System


    +   10. After you finish configuring the kernel, click the Save and Exit buttons
    to proceed.


    The Kernel build instructions dialog box opens. This contains the same information
    that you get in the following section


    To have the computer compile your new kernel, follow these steps:


    +   1. Type make dep have the compilation software sets things up for you.


    This may take a few minutes. Have something else available to do, or browse through
    this book while you wait.


    +   2. Type make bimage to build the main kernel.


    Depending on how slow or fast your machine is, you may want to go off and have
    lunch or something while you''re waiting. This step can take 15 to 30 minutes,
    or longer. The amount of time depends on how fast your computer is, how much memory
    it has, and how much functionality you left in the main kernel.


    +   3. Type make modules to build the pieces the kernel picks up and drops.


    This process can take a while. It depends on how many items you set as modular
    as opposed to turning them off or putting them in the central kernel.


    +   4. Type make modules_install to put the modules where the kernel can find
    them.


    This is a quick process. You see a series of lines starting with Installing modules
    and then it''s done.


    +   5. If your Linux machine is booting from a SCSI hard drive, then type uname
    -r to see which kernel version you''re using, and then type mkinitrd /boot/initrd-version
    and press Enter.


    This process creates a special version of the kernel used only when you boot the
    machine. You need to make sure that Linux can use your SCSI drive when it''s booting.'
