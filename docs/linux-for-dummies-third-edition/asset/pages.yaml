  md: '# 182 Part III: Getting Up to Speed with Linux


    Just typed a command and now you have to type it again? In bash, you use the up
    and down arrow keys to move between previously typed commands. Pressing the up
    arrow keys brings the last command you typed to the command prompt. Pressing again
    brings the one before that, and so on. If you press down, you''ll move backwards
    through a series of long commands and need to redo them. Give it a try!


    ![](img/4e9f259b21147d1fb7569159ef49ec31_209_0.png)


    # Laying pipes


    Another bash feature enables you to connect commands such that the output of one
    becomes the input for the next. This feature is referred to as a pipe. Suppose
    that you want to look over the details of all files in the /etc directory in long-listing
    format. If you type ls -la /etc to do so, a massive listing appears. A lot of
    the information scrolls right past you. While you can go back up a certain extent
    by pressing Shift+PageUp, you may not be able to see everything.


    You can choose between two ways to handle this:


    +   - You can send the data to a file with redirection by typing something like
    ls -la /etc -> /listing (making sure to replace the directory and filename, of
    course).


    +   - You can pipe the output to the more command. This ensures that text doesn''t
    show more than one screen at a time. It waits until you press the space bar before
    you see the next screen''s worth of text. Linux users find this command very useful.


    To pipe the output to more, type ls -la directory_path | more where directory_path
    is the directory you want to list the contents of. The | symbol (which is on the
    key looks like two vertical bars stacked on top of each other instead of just
    one solid line) tells bash that you want to utilize a pipe.


    # Altering the shell environment


    A number of variables — words or strings of text that are used in computers to
    represent a piece of data, such as setting the variable fruit to contain the text
    apple — contain information about your account and environment settings. The bash
    shell has a specific set of these variables that it uses regularly and a specific
    way of dealing with them. In this section, we take a look at what they are and
    how you can make best of them.


    # Variables and environment variables


    The first thing that we need to make clear is the bash shell has two classes of
    variables: variables and environment variables. A variable is used in a program
    and then is gone. Nothing bothers to remember that point past again. An environment
    variable, used by the shell itself, is pertinent to your'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Chapter 11: Breaking Linux Out of Its Shell


    environment in some way, whether it holds your account information, prompt, or
    something else.


    You can tell the difference between a variable and an environment variable at
    a glance in bash. Variables may be all lowercase or in upper- and lowercase. An
    environment variable, however, is always in all uppercase letters.


    # Common environment variables


    bash has many environment variables, and you can even create more if you need
    to. You''ll be amazed at the range of items that these variables store. The great
    thing is that if it''s stored in a variable, you can change it to suit your needs!
    In Table 11-1, we list the environment variables that you''re likely to work with.


    | Environment Variable | Purpose | Value |

    | --- | --- | --- |

    | HISTSIZE | Remembers the number of previously typed commands. | Number of commands
    |

    | HOME | Sets the location of your home directory. | The path to your home directory
    |

    | MAILCHECK | Sets how often the bash shell looks to see whether mail has arrived
    in your mailbox. If mail has arrived, you see a message similar to You have new
    mail the next time you do something at the command prompt. | Number of seconds
    between checks |

    | PATH | Sets the directories that bash looks in, and the order to look in to
    find a program name that you type at the command prompt. | A series of colon-separated
    directories |

    | PSI | Sets your command prompt. | A series of the characters and formatting
    characters used to form the prompt |


    ![](img/4e9f259b21147d1fb7569159ef49ec31_210_0.png)


    Want to see the whole list of environment variables? Type man bash and press Enter,
    and then type /Internal Field Set and press Enter. You see the first line in section
    of environment and shell variables — a shell variable only exists in a single
    shell instance, it doesn''t persist outside of that — in the bash pages.'
  merge: -1
