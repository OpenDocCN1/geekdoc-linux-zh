    +   **DMA (Direct Memory Access):** Because the processor can only do one task,
    or at a time, whenever a hardware device needs to interrupt the processor, it
    takes time away from another activity. Certain types of actions really don''t
    need the processor''s attention and can occur faster if time isn''t used to interrupt
    the processor. The *DMA channel (or Direct Memory Access channel)* enables the
    device to move data in and out of memory without the processor intervening. As
    interrupts, common devices use particular DMA channels. For example, the hard
    drive controller typically uses DMA channel 1, and the floppy disk controller
    typically uses DMA channel 2. In order for DMA to work properly, the hardware
    device and the computer''s hardware must support DMA. The */proc/dma* file contains
    information about any DMA channels in use.


    ```

    [root@localhost ~]# cd /proc

    [root@localhost ~]# cat is

    0000:00f: dma

    0000:00f: 0

    0000:05f: 1 timer

    0000:05f: keyboard

    0000:00f: rtl

    0000:00f: page rag

    0000:00f: pci1

    0000:00f: fpy

    0000:00f: serial(auto)

    0000:00f: eth0

    0000:00f: serial(auto)

    0000:00f: irq1

    0000:00f: 1 timer

    0000:00f: hci

    ```


    Figure 6-2: A sample /proc/ports file.


    +   **Base memory:** Each hardware device has intelligence in the form of code
    embedded in the hardware''s components. A copy of this code is placed in an assigned
    location in memory known as the *base memory* or shared memory address. Executing
    a device''s code in memory is much faster than running the code from the device
    itself. As with the other hardware settings, common hardware devices use similar
    base memory addresses.'
