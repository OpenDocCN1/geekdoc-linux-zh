  md: '# Exit stage left


    Few things are more frustrating than wanting to get out of a program that you
    just can''t seem to exit. A lot of new Linux users run into just that in GNOME.
    For whatever the reason, they want to get out of the desktop environment and work
    straight from the command prompt. You have two ways that you can do this.


    These methods of quitting out of GNOME work in almost any GUI combination that
    you run into Linux.


    The first method involves leaving GNOME without actually leaving GNOME. You can
    kind of sidestep out of the GUI and go to a command prompt virtual terminal —
    one of the login sessions available in Linux, each of which is tied to a function
    key — (and here''s the big secret) the GUI is a virtual terminal, too! The function
    keys F1–F6 take to virtual terminals where you can log in and do whatever need
    at the command prompt. F7 (or sometimes F8), however, is what returns you to the
    GUI if you happen to be running one.


    Although you can press Alt+F# to move from one virtual terminal to another, you
    must do something slightly different if you''re in the GUI. If you''re in GNOME
    and want to use the virtual terminals, press Ctrl+Alt+F6. You can get back by
    pressing Alt+F7.


    Don''t forget about the Logout option in the main GNOME menu. If you don''t want
    to use the GUI for a while or want to free up the memory and CPU power that the
    GUI is hogging, choose this option.


    If something is wrong and you need to get rid of the GUI in a hurry, press Ctrl+Alt+Backspace.
    This key combination gets you immediately out of the GUI and stops the programs
    used to run it, and you end up at a command prompt in one of the virtual terminals.


    Press Ctrl+Alt+Backspace only in an emergency. This key combination doesn''t cleanly
    stop the programs involved.


    # How do ya like them applets?


    Applets — a collection of mini-programs that do anything from display the time,
    show system status, or even provide little bits of entertainment — are available
    out in the great world of computer programming. A number of people got it in their
    heads to write some of these applets specifically for use in the GNOME desktop
    environment in Linux. So these applets are included with your GNOME installation.
    Some these mini-programs are more useful than others. We all need a bit of entertainment
    in our life, too, though, right?'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 174 Part III: Getting Up to Speed with Linux


    # Adding an applet icon to the Panel


    You can have fun sifting through to see what kinds of applets are available to
    you. Look for them in the main GNOME menu, where you find a submenu applets. Even
    better, you can quickly and painfully add them to and remove them from your GNOME
    Panel as suits your needs. To add an applet to the Panel, do the following:


    +   1. Right-click any free space on the Panel and choose Applets from the pop-up
    menu that appears.


    A submenu appears.


    +   2. Click to choose the applet you want to add to the Panel.


    The applet is now on your Panel.


    # Configuring an applet


    After you have an applet running, configuration options may be available that
    you can play with. Some of these options enable you to change what information
    is displayed. Others have a variety of look and feel settings, and in general,
    you can move them around the Panel to where you want. To check for these and configure
    those applets that offer this option, do the following:


    +   1. Right-click the applet and choose Properties from the pop-up menu that
    appears.


    The pop-up menu appears is different from applet to applet. The top portion is
    always the same, however.


    This action opens a dialog box that is different for every applet.


    +   2. Configure the applet''s behavior.


    Here is where you get to have some fun. Make changes so that you can see what
    this applet can do.


    +   3. Continue playing around until you finish.


    +   4. Click Apply to put your changes into effect without closing the dialog
    box or click OK to put them into effect while closing the dialog box.


    Your changes go into effect.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_201_0.png)


    The pop-up menu items we discuss here (aside from the standards — Properties,
    Help, and About) include additional things that this applet can do. Clicking these
    items may do a number of different things: you may open a dialog box with configuration
    options, open a submenu, or maybe even nothing happens. In the case of a disk
    space monitoring applet, you can use the menus to change which drive to watch.
    With some applet menus, the nonstandard options require that you''ve already done
    something else before they make any sense.'
  merge: -1
