  md: '# 58 Part I: Getting Your Feet Wet


    To determine the default runlevel of your system, enter the following command
    at a command prompt:


    ```

    grep :initdefault:/etc/inittab

    ```


    You''ll see something like this in the response:


    ```

    id:3:initdefault:

    ```


    This indicates that runlevel 3 is the default. If you opted to log in with a graphical
    interface during installation, your results are likely as follows:


    ```

    id:5:initdefault:

    ```


    Although a simple change with a text editor can change your default runlevel,
    just hold on. You can also change your default runlevel in LinuxConf, a configuration
    utility that we tell you about in the "To LinuxConf or not to LinuxConf: That''s
    the Question" section later in this chapter.


    The startup scripts that are called depend on the runlevel your system is starting
    at. For example


    ```

    ls /etc/rc.d/rc3.d

    ```


    The first thing you notice is that all the files are symbolic links, or symlinks
    for short. In other words, these files just point elsewhere rather than containing
    the scripts themselves. If you consider that the same services may be started
    under different runlevels, you will see it makes sense to call the same script.
    Otherwise, we need to copy the same script to all runlevel directories that need
    to start the service... a maintenance nightmare avoided.


    Another interesting part of this directory listing is the filename convention.
    The rc program actually executes the script uses the filename to determine the
    order and event in which a particular service is executed. rc calls each script
    with a command prompt argument depending on the event. A startup event is passed
    a start argument while a shutdown event is passed a stop argument. rc knows which
    script to run by evaluating the symlink name. The S at the front of the filename
    tells rc that script must be run during the startup of this runlevel. The K in
    the script name tells rc that the script is run with a stop argument when a runlevel
    change is requested from it


    The next two characters after the event type represent a two-digit integer, which
    provides the order in which a process is started. Some processes require others
    to be started first. This naming convention enables the system to call services
    in a particular order.'
