- img_proc: true
  md: '# Chapter 18: Ten Questions Most Frequently Asked 299


    Cost isn''t the main factor that makes Linux attractive to business, though. Companies
    of any size find Linux attractive due to its stability and reliability. Linux
    can run for months — even years! — without having to be restarted or rebooted.
    Also, the source code for Linux is open to the public, bugs get fixed quickly
    and without having to wait for a vendor''s next software release cycle to roll
    around. Linux also runs on about any kind of computer, including older, outdated
    PCs, and thereby offers a way to keep their hardware investments working alongside
    newer, more capable machines.


    Linux''s flexibility helps to explain why major IT vendors — including IBM, Netscape,
    Oracle, and Sun — have understood and embraced the benefits of Linux in-house,
    and why they support Linux-based solutions for their customers. It also helps
    to explain why major corporations — including Burlington Coat Factory, Sony Electronics,
    Sallie Mae, and Mercedes-Benz, among many others — have made Linux an important
    part of their IT infrastructure. The same also goes for a multitude of educational
    and research institutions around the world, where Unix has long been a key component
    of their IT infrastructures.


    Whether your organization is concerned about cost, reliability, usability, or
    simply wants to be in good company with other, like-minded organizations, Linux
    has a role to play in the business world.


