  md: '# Part III: Getting Up to Speed with Linux


    # Adding a program to the desktop


    The Panel has only so much room. Maybe you''d rather have your program shortcuts
    lined up on the desktop as you do in Windows. To add one of these, do the following:


    +   1. Click the Main Menu button and choose Programs::Application, where Application
    is the name of the program that you want to add to the desktop.

    If you want to add StarOffice to the desktop, for example, choose Programs::StarOffice
    (assuming that you have StarOffice!).

    2. Select the program that you want to add to the desktop.

    Don''t open the program.

    3. Drag the program to the desktop.

    A little piece of paper graphic follows your mouse pointer until you release the
    mouse button. After you do so, your new shortcut is added to the desktop.


    If you''re not happy with where a desktop icon is, click it and then drag it to
    a new location.


    # Removing a program from the desktop


    To get rid of an icon you have on your desktop, do the following:


    +   1. Right-click the icon and choose Delete from the pop-up menu that appears.

    The Delete dialog box opens.

    2. Click Yes to confirm the deletion or No to cancel.

    If you click Yes, the icon is deleted.


