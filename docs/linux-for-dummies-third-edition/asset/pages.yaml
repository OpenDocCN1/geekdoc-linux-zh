  md: '# Linux: Revolution or Just Another Operating System?


    > "Contrary to popular belief, penguins are not the salvation of modern technology.
    Neither do they throw parties for the urban proletariat."


    Author note: Cute quote...obviously Anonymous has never been to a Linux convention!


    Before going any further


    Tux is the formal name of the mascot penguin that represents Linux. Rumor has
    it Linux''s creator is rather fond of these well-dressed inhabitants of the Antarctic.


    An operating system is the software (instruction) that makes the hardware (computer)
    do something. Whether you''re writing a letter, calculating a budget, or managing
    your recipes on your computer, the operating system provides the essential air
    that your computer breathes.


    Who''s behind all this hype? You can''t open a computer trade rag these days without
    at least one article or announcement mentioning Linux in the headline. When you
    stop to consider that Linux has no marketing budget behind it, you see that this
    is an interesting phenomenon. No company owns Linux and no formal organization
    earns profit directly from the installed user base! We can determine only one
    answer that seems to account for the popularity of Linux: It stands on its own
    merits. In other words, it works and it works well. People are discovering fact
    in droves.


    Linux has been accused of being just another operating system. On the surface,
    it may appear, but if you look deeper you can see that this isn''t so. The Linux
    project is a flagship leading the current apocalypse within the software industry.
    A rock-solid operating system because of the model under which it was, and continues
    to be, developed, Linux represents all that is good and pure in software development.


    Two fundamental distinctions separate Linux from the rest of the operating system
    pack:


    +   1. Linux is licensed under the unique and ingenious General Public License
    (which we discuss in the next section).


    +   2. Linux is developed and maintained by a worldwide team of volunteer programmers
    working together over the Internet.'
