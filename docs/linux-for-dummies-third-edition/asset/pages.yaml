  md: '# Conquering Configuration Problems


    When configuring your Linux machine, you may encounter problems with the /etc/lilo.conf
    file. This file indicates the operating system or systems that your system can
    boot to and some Linux startup settings. Linux is capable of booting from any
    of your hard drives — not just the IDE drive on the primary IDE channel. Consider
    the following when this gives you:


    +   - If you''ve altered or added hard drives, you may need to change the boot
    line in /etc/lilo.conf file.

    - If you haven''t made hardware changes, check to make sure that your lilo.conf
    is referring to the correct location of the Linux image.

    - If the location under the /boot directory or the device for the root entry is
    incorrect, your system isn''t able to boot to Linux. In this situation, rescue
    or emergency disk is helpful. See Chapter 5 for instructions on how to create
    a rescue.

    - If you''re working with a multiboot operating system environment, check that
    your /etc/lilo.conf file contains entry stanzas for each of your operating systems.
    Each operating system or Linux installation needs to be in a separate state.

    - If your file contains entries to switch to a higher resolution display but you''re
    having boot problems, try reducing the video setting to simple VGA.


    When you modify the /etc/lilo.conf file, don''t forget to run LILO at a command
    prompt. If you forget to do this, your changes to /etc/lilo.conf aren''t applied
    and your system startup doesn''t change.


    Before you change configuration settings, look for the current environment settings
    in the /proc directory. Here you find files that contain information about the
    current hardware and configuration settings. For example, take a look at the files
    in the /proc directory:


    +   - interrupts — lists used/detected interrupts in use

    - cpuinfo — indicates CPU vendor, model, speed, and other CPU features

    - iports — lists used/detected port values in use

    - modules — lists the loaded modules

    - meminfo — reports the amount of the physical memory, swap area(s), free memory,
    and other memory-related values

    - partitions — displays the partitions and information for each storage device

    - mounts — indicates the volumes currently mounted and their file type and status


    ![](img/4e9f259b21147d1fb7569159ef49ec31_336_0.png)'
  merge: -1
