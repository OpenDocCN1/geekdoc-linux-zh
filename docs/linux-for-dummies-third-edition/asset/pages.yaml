- img_proc: true
  md: '# 44 Part I: Getting Your Feet Wet


    (continued)


    The mount point, or starting point in the directory hierarchy, for this example
    is /boot. For Linux native partitions, you need to define the mount point, size,
    and hard drive. For a Linux swap partition, you need to define the size and hard
    drive. When you''re finished making all your changes, click Next to continue the
    installation.


    If you want to use fdisk instead of Disk Druid, select the Manually partition
    with fdisk (experts only) option in the Automatic Partitioning screen and click
    Next. The next option is to select the hard drive that you want to run fdisk on.
    At this point, you''re in a command window inside the Partitioning With fdisk
    screen, as shown in the following figure.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_71_0.png)


    If you don''t know how to use fdisk, we recommend that you not proceed any further.
    To exit fdisk, type q and press Enter. The Back button is now activated, so you
    can go back and use Disk Druid or accept the default partitioning strategy.


    If you''re installing Linux using the text interface, the Disk Druid text interface
    is similar to the graphical interface that you use the Tab key and arrow keys
    to navigate to various portions of the screen. The interface for fdisk in both
    the graphical and text modes is identical. The fdisk utility is used from a command
    prompt. To find out more about utilities before using them, consult the Linux
    distribution documentation or the vendor''s Web site. In addition, most Linux
    reference sites provide information about the use of utilities.'
  merge: -1
