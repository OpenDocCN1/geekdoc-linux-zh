  md: '# Appendix B: Glossary 353


    **hub**: A multiport networking device that connects LAN segments. A passive hub
    simply passes information from one segment to another. An active hub regenerates
    the signal between segments to help ensure delivery of the data.


    **Internet**: Another term for the World Wide Web. The Internet is a worldwide
    conglomeration of mainframes, Web servers, and individual computers that use common
    protocols, such as TCP/IP and FTP, to share and transfer data. A common element
    of the Internet is a Web page, which is primarily an HTML document available for
    viewing by any user on the Internet.


    **interrupt**: A signal to the CPU that a peripheral device has performed an event
    and is requesting attention. Each type of hardware is assigned its own interrupt
    number for identification. The CPU addresses each interrupt separately and passes
    the request to the appropriate device.


    **I/O (Input/Output) port**: A location in a computer''s memory where devices
    temporarily store data to be picked up by the processor.


    **IP (Internet Protocol) address**: Also called an IP number. A 32-bit numeric
    address which uniquely identifies computers or devices on a TCP/IP network.


    **IP (Internet Protocol) routing**: The process of moving data between two IP
    networks.


    **ISDN (Integrated Services Digital Network)**: A digital communications technology
    that offers increments of 64-Kbps connections, most often used by small office/home
    office users to connect to WANs.


    **ISP (Internet Service Provider)**: A company that provides Internet access and
    other Internet-related services, such as IP address leasing, for a fee.


    **KDE (K Desktop Environment)**: An alternative GUI desktop environment in Linux,
    similar in function to GNOME.


    **kernel**: The core of the Linux operating system. The kernel is the interface
    between the system''s hardware and software.


    **kfm (KDE file manager)**: The default file manager in the KDE desktop environment.


    **LAN (local area network)**: A group of computers and devices that are attached
    by network cabling and a common set of protocols to share information.


    **LILO (Linux LLoader)**: The program that executes a Linux kernel at boot time.
    If the computer has more than one operating system installed, LILO enables the
    user to boot to any of the operating systems.'
  merge: -1
