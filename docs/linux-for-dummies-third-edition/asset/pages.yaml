  md: '# Managing Installation Woes


    Installing Linux on new hardware can often go without any bumps or bruises. But,
    even with the latest and greatest hardware, you may still come across some hurdles.
    If you''re having trouble installing Linux and the computer has a functioning
    operating system already installed, you may be able to use that operating system
    to to document the hardware settings.


    Before you install Linux, document your machine''s hardware components and settings.
    This information includes:


    +   - Configuration settings for your various interface cards.

    - Interrupts, I/O ports, DMA, and base memory settings.

    - Information that you find in the BIOS (Basic Input/Output System), including
    the drive specifications attached to your IDE channels or SCSI.

    - The size of your drives, whether they''re master or slave for IDE, or the ID
    numbers if the system is using SCSI. Your system may have both IDE and SCSI, so
    document both areas.

    - Information about your CD-ROM drive and where it''s attached. If your system
    has hardware interface cards and these devices have settings in the BIOS, document
    that information also.


    An area that can give you headaches when installing Linux is video. So many different
    types of video cards, settings, and monitors are available that if you don''t
    have the right combo, you may not have acceptable resolution and/or desktop settings.
    Prior to installing Linux, record the following:


    +   - Your video card/interface brand, model number, memory, and resolution capabilities.
    Linux can attempt to probe the video card for you, but if it doesn''t gather the
    correct information, the settings may not be appropriate for your hardware.

    - Your monitor brand, model, and resolution capabilities. If your monitor isn''t
    on the list of monitors compatible with Linux, determine the monitor or its is
    equivalent to use those for your settings.


    If your system has the video embedded in the circuitry of the system or motherboard,
    on some embedded video circuitry, we''ve seen video probe report configuration
    information that doesn''t match the actual capabilities. In some cases, this difference
    may be enough to reduce the video to 16 colors and 640 x 480 resolution.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 308 Part V: The Part of Tens


    You need to be cautious of hardware labels that include the term Win (as in Windows).
    These components, such as Winmodem, are designed for Windows operating systems.
    Instead of containing all the configuration and software on the hardware, these
    components are designed to handle some of the load. Only a very slight chance
    exists that you may be able to find a Linux driver for Win hardware. If you do
    find one, copy it to a floppy disk before installing Linux. If you can''t find
    a driver and you really need a modem, put down a little cash and get a real modem.


    The default installation mode for some distributions, such as Red Hat, is graphical.
    Some graphical installations try to determine all of your hardware for you and,
    and at some point in the installation phase incorrect configuration parameters
    are applied, your Linux system may be nonfunctional or incomplete when you try
    to reboot after installation.


    If you''re having trouble installing Linux in graphical mode, try using text mode
    (or interface), which doesn''t require you to enter command codes but presents
    the options in text menus that you highlight with the arrow keys and select with
    the Enter key. The text installation mode usually presents you with more options
    than the graphical installation mode so you''re able to change the probed settings
    to match your hardware configuration settings.


    If you''re still having installation problems, try skipping some of the hardware
    components at installation time. For example, bypass the network interface card,
    sound card, and so on. If your installation is successful without these components,
    then you have a pretty good idea which hardware component or components are giving
    you problems. You can go back and add the supporting software pieces for the hardware
    at a later time.


    When ideas fails, words come in very handy.


    > — Goethe (1749-1832)


    If you''re encountering problems installing a software package or application,
    make sure you''ve read the installation and/or readme notes. Some software packages
    depend on the existence of other software components. The installation notes include
    these requirements and often indicate where you can locate and/or download the
    additional software components.


    When you''re installing Linux or applications, pay attention to disk space. If
    you encounter a disk full error when installing, you need to change the size of
    the partition or move existing directories and files to other partitions.'
