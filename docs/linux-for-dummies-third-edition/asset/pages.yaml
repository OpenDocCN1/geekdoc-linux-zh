    consult when it''s time to cry Help!


    # What Is Linux, Anyway?


    For the uninitiated, Linux is a curious and puzzling phenomenon. The best answer
    to the question that launches this section is this: Linux is an operating system
    that you can download for free. Linux also belongs to a vast'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 298 Part V: The Part of Tens


    community of developers working in concert and is no single company''s-proprietary
    possession. That''s why anybody and everybody — from home-based hobbyists to software
    professionals — can access the source code for Linux and make changes to that
    code.


    Everything about Linux is out in the open and freely available to anyone who''s
    interested, explaining why Linux is known as an open source operating system and
    called free software. This also explains why companies such as Red Hat, SuSE,
    Caldera, and many others, can sell and distribute Linux on CD-ROM or across the
    Internet, and even those companies must keep the Linux code they offer for public
    inspection, comment, and changes.


    Linux is an open source version of Unix that started as the brainchild of Linux
    Torvalds was a student at the University of Helsinki, and he began his work by
    targeting the Intel 8036 PC processor and is one of the most widely ported operating
    systems for PCs in general). Torvalds sought to create a new version of Unix,
    so he enlisted the help of a group of programmers to create a new operating system
    that he named Linux.


    Since that time, Linux has grown and evolved substantially. A large cadre of software
    developers working on the Linux kernel and the Internet to share information,
    coordinate activities, and decide what changes become parts of Linux. Over time,
    this project has become self-sustaining and self-regulating, to the point where
    developers manage the responsibility for parts of Linux. If somebody decides they
    want to leave the project, other developers step in time to take over the vacancies
    vacated by their departure.


    The result is the powerful, robust, and full-featured operating system known as
    Linux that continues to change and grow, and that is widely available around the
    world today, on CDs, and over the Internet.


    # Is Linux Ready for Business Use?


    The answer to this question is a resounding yes, if recent marketplace trends
    and statistics are any indication. Today, Linux is the fastest-growing operating
    system for servers, and it''s making major headway on the desktop. Unlike proprietary
    operating systems, you can install and upgrade Linux for free. Low cost makes
    Linux attractive to small businesses that'' don''t have big IT budgets but who
    must nevertheless use computers as part of their day-to-day activities.'
  merge: -1
