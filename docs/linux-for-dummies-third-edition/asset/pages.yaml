    Troubleshooting is like reading a mystery novel. You have some facts, symptoms,
    and details, but you don''t know who did it. You have to take what information
    you have, work with it, look at the different possibilities, and then narrow down
    the possibilities to a single suspect. You need to test your theory and prove
    that your suspect is the actual guilty party.


    > Once you eliminate the impossible, whatever remains, no matter how improbable,
    must be the truth.

    - Sherlock Holmes (by Sir Arthur Conan Doyle, 1859-1930)


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the operating system or the hardware or
    a service is giving you headaches, the following are some basic troubleshooting
    techniques that you can start with:


    +   - Write down any and all symptoms that the system is experiencing, including
    what actions you can and can''t do. Jot any information you may see in error messages.

    - Take a look at the Linux log files. You can find most of these in /var/log directory.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 306 Part V: The Part of Tens


    +   - Compare your problem system with a working system. Comparing configuration
    files and settings may reveal the problem or narrow down the possibilities.


    +   - Check to make sure all the hardware is connected properly and powered. Verify
    that all cables and connections are attached properly and are set at the correct
    specifications.


    +   - Remove any hardware that you''ve recently changed or added before the problem
    started and check if the problem disappears. If it does, then you can probably
    suspect the hardware is the culprit.


    +   - Stop unnecessary services and applications that aren''t related to the problem
    at hand. You may easily figure out what''s happening if other services and applications
    aren''t getting in the way.


    +   - Check whether the problem is reproducible or not. Does the same sequence
    of events produce the problem? For example, suppose that when you go to print
    to the color printer, every time you attempt to print, nothing happens, then the
    problem is reproducible. If, instead, sometimes your information is printed, and
    others it isn''t, the problem pattern is not the same and is not reproducible.
    Unfortunately, problems that are non-reproducible are often more difficult to
    resolve because no set pattern of events re-create the problem.


    After you''ve come up with a solution, take a few moments to document the situation.
    Note the symptoms of the problem, the cause of the problem, and the solution you
    implemented. The next time you encounter the same problem, you''re able to call
    upon your notes for a solution instead of reinventing the wheel.


    > Each problem that I became a rule, which served afterwards to solve other problems.


    — Rene Descartes (1596-1650), "Discours de la Methods"


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you have a problem. You may want to print some of this information, because
    a future problem may prevent you from accessing your files.


    In this chapter, we cover some tips to start with when you encounter a problem
    with Linux.


