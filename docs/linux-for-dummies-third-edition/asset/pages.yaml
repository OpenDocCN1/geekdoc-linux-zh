  md: '# 312 Part V: The Part of Tens


    # Making Maintenance Work for You


    One of the best maintenance processes is to properly shut down or restart the
    Linux system. If you just turn the power off, you log files, and don''t allow
    the operating system to save or close any open files, update log files, and so
    on. Most distributions have support a shutdown or restart application in the X
    Window System. Also, must support the same processes through command-prompt entries.
    The following shows a few examples:


    ```

    shutdown -h now

    shutdown -r now

    reboot

    CTRL+ALT+DEL key sequence

    ```


    In Chapter 5, we discuss the importance of following proper shutdown procedures.


    Finally, make sure to update your system. If you installed Linux five years ago,
    the kernel probably isn''t current. Most distributions contain update packages
    or Web site information for getting updates.


    # Backing Up to Move Forward with Confidence


    The hardware in your Linux systems will fail! Unfortunately, you have no of knowing
    when. If you''re using old hard drives or you''ve been running your Linux system
    on the same hardware for the last five years, don''t be surprised if a hard drive
    fails, or the power supply fails, or other hardware piece fails by the wayside.
    Thus, we recommend that you keep a current copy of your critical information and/or
    files on removable media and store these files in a safe place.


    Linux has always provided a mechanism to back up files to tape and restore the
    information. The interface, however, isn''t all that is intuitive and setup and
    initiated at the command prompt. You may want to investigate other backup programs
    that provide a friendlier interface and more options. You can get information
    about Amanda, a common backup program, at www.amanda.org.


    After you back up your files onto tape or other removable media, make sure you
    store the backup at a location other than where the Linux systems'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Chapter 19: Ten Lovely Troubleshooting Tips


    reside. A major cause of data loss isn''t necessarily due to human error from
    events such as earthquakes, floods, and so on. If you keep the backup tapes in
    the same room or vicinity as the Linux systems, the backups may also suffer the
    same natural disaster damage as your Linux computers—leaving you stuck with no
    backup at all.


    For online fault tolerance of your storage system, Linux supports RAID (Redundant
    Array of Inexpensive Disks). Most RAID systems use SCSI storage architecture.
    You can get more information about Linux and RAID with your distribution''s HOWTO
    files and other sources available on the Internet.


    # Stopping Scripting Screw-ups


    A script contains a series of commands collected to perform some task (usually
    repeatedly) that saves you from typing all the commands at a prompt line at a
    time. If you''re having trouble with a script, consider the following:


    +   - Make spelling or syntax errors aren''t causing the problems. Remember, most
    things in Linux are case sensitive, so a simple slip of the Shift key may make
    an entire script nonfunctional.

    - If your script contains several sections to perform different tasks, try commenting
    out all lines except for one task. If the script then works for the task specified,
    then uncomment one line at a time and run the script between each edit. When you
    encounter your first error, you probably have a good idea on what line the error
    occurred and where to make the appropriate correction.

    - Start simple when you are writing a script from scratch. Make sure the script
    works before you start doing fancy stuff. If your recent addition causes the script
    to fail, then you know where the problem resides.

    - Verify the content of any variables your script may be dependent on. Use the
    echo statement in the script to display the contents of the variables you''re
    using. You may need to use the echo command at several places in your script so
    that you can watch what''s happening to the value of the variables.


    For more information about scripts, see Bonus Appendix D on CD3. For more information
    on variables, see Chapter 11.'
  merge: -1
