    # Accounts, Great and Small


    Linux is a multi-user operating system. This allows everyone to have their own
    account and lets more than one user can log on at once. Even if you''re the only
    user who is going to use this system, you need an account of your own that isn''t
    the root user. Multiple accounts are especially fun for experimenting with different
    user setups.


    # Avoiding root


    The root user, also known as the superuser or just as root, has access to anything
    and everything on the machine. No matter how you set things up, you can''t keep
    the root account out of any area. The root user also has access to all commands
    and devices. Many Linux beginners figure they may as always use the root account
    because it''s so convenient.


    For several reasons, the root account isn''t for everyday use:


    +   - You don''t always need root-level access.

    - Root-level access is as much of a curse as it is a blessing. If you screw up
    as a user, you only mess the stuff in your account. If you screw up as the root
    user, you can wipe out everything!

    - If you send e-mail or news posts as root for anything other than serious administrative
    business, people think you don''t know what you''re doing or are showing off.

    - Root comes with too much temptation. The superuser can read people''s e-mail
    and files, which introduces a few ethical issues.


