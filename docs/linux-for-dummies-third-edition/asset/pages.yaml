  md: '# Listing directory contents


    Computer users frequently need to see what files are on their computers and where
    exactly these files are. The command you use to do this in the Linux is ls, short
    for list. If you use this command by itself, it tells you what files are in a
    directory and what directories are in that directory. For example, if you type
    ls at the command prompt in the very base of the directory structure in Red Hat
    Linux, you will see the following:


    ```

    bin dev home lost+found opt root tmp var

    boot etc lib mnt proc sbin usr

    ```


    But this is only the tip of the iceberg for the ls command. A bunch of options
    are available with the ls command that you can mix and match to get the results
    you need. We list the more interesting of these options in Table 9-1.


    | Table 9-1 Is Options |

    | Option | Purpose |

    | --- | --- |

    | -a | Displays all files, including those starting with a period. |

    | -c | Displays the last time the file was changed. |

    | --color | Color codes items by type. |

    | -l | Displays a long format file listing. |

    | -R | Displays the contents of the directories in this directory. |

    | -S | Lists the files by size. |

    | -t | Lists the files according to how long ago they were changed. |

    | -u | Lists the files according to how long ago they were accessed. |


    In this table, -a and -l are far the most commonly used options. If you''re in
    a brand-new home directory and type ls, you see nothing. If you type ls -a, you
    may see:


    ```

    .bash_logout .bash_profile .bashrc

    ```


    What are the first two entries? The single dot always refers to "right here."
    It points to the directory that you''re currently in. Don''t worry if this doesn''t
    make any sense to you at the moment. As you work with other commands and get more
    familiar with Linux, it will make sense. The two dots refer to the parent directory,
    or the one up from where you are currently. For almost all home directories, the
    parent is /home. We discuss file system structure in the "Working with the File
    System" section later in this chapter.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 9: Files and Directories 139


    Now, if you type ls -l in this directory, you get nothing again, just:


    ```

    total 0

    ```


    Type one of the most commonly used combinations and you get a lot more information.
    If you type ls -la you get something similar to:


    ```

    total 20

    drwx------ 2 dee dee 4096 Jul 29 07:48 -.

    drwxr-xr-x 5 root 4096 Jul 27 11:57 - .bash_logout

    -rw-rw--r-- 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-rw--r-- 1 dee dee 124 Jul 27 06:50 .bashrc

    -rw-rw--r-- 1 dee dee 0 Jul 29 07:48 lsfile

    ```


    You may find some parts of this format easier to understand, at a glance, others.
    The first item in each listing (the part with the letters and dashes — for example,
    -- in the first line are the permissions assigned to the item. Briefly, permissions
    define who can read the file, change it, or run it if it''s a program. You can
    read more about permissions in the "Permissions" section later in this chapter.
    The second item, in this case, 2, is the number of links to the item.


    A link is a file link that actually points to another file. You use two kinds
    of links in Linux and Unix:


    ![](img/4e9f259b21147d1fb7569159ef49ec31_166_0.png)


    +   - Soft link: This link is like a Windows shortcut in that the link points
    back to the original file, and anything you do to the link happens to the original
    file. Erase the original file and the link remains, but it becomes unusable. It''s
    broken without the original.


    +   - Hard link: This link doesn''t have a parallel in the Windows world. A hard
    link isn''t just a shortcut; it''s another instance of the file itself. The file
    is only saved in one place, but you can edit either the original or the link and
    the edit goes.


    The third item (dee) is the file''s owner and the fourth (dee) is the group. You
    can find out more about both of these in the "Haggling with Permissions" section
    later in this chapter. The fifth item is the file''s size in bytes. All directories
    show up as 4096 bytes. Everything else has its own size. You can tell an empty
    file from the zero.


    The sixth, seventh, and eighth entries are all related to the last time the file
    was changed: the month (Jul), the date (29), and the time in 24-hour format (07:48).
    Finally, the ninth item is the actual filename (for example, bash logout, in the
    third row).'
  merge: -1
