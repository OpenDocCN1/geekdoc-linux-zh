    # # Chillin'' with kfm (KDE File Manager)


    In KDE, the default file manager is kfm. You can find this program in KDE in few
    different ways. The quickest way is to click the icon at the bottom of the screen
    that''s a picture of a folder with a house on it the very bottom left of the screen.
    Another method involves clicking the K icon to open the Main Menu button, and
    then clicking the Home directory menu option. Figure 9-4 shows an example of what
    you can see with kfm open.


    The workings of this file manager would seem familiar compared to those from other
    operating systems. Although kfm doesn''t have a two-panel setup, it does let you
    click to move from directory to directory, and click and drag to move items within
    the file system structure.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_184_0.png)


    Figure 9-4: KDE''s kfm.


    # ## Browsing your files


    You''re probably used to use file managers that let you work in two panes, such
    as Windows Explorer or even GNOME''s GMC. The kfm program uses only a single window.
    To navigate the file system, you simply click directories or files to open them.
    You also have extra buttons available that help you jump around, as shown in Figure
    9-4.'
