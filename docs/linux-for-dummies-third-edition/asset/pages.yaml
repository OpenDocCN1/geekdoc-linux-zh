    # # Troubleshooting New Additions to Your System


    Adding hardware and its device drivers can create some interesting problems. If
    you''re having trouble with your system immediately after adding a piece of hardware,
    suspect a hardware conflict. If the newly added device has the same interrupt
    or I/O address as an existing device, that can cause immediate problems. Remove
    the newly added hardware. Start Linux and document the information contained in
    your `/proc/interrupts` and `/proc/ioports` files. If conflicts exist, you need
    to change the settings on the new hardware before adding it back into the system.


    Another problem arises when adding modules with the `insmod` command and the module
    doesn''t add. Try using the `modprobe` utility with the appropriate hardware settings
    to determine whether or not the device driver detects the hardware. If it''s not
    probed, you need to verify the hardware settings. Also, make sure that you''re
    using the correct driver for the device.


    If the `insmod` command produces messages about unresolved symbols, then a module
    dependency is missing. Here you may find the `depmod` command helpful. For example,
    the following command shows the dependencies of the `sb.0` module:


    ```

    depmod -e sb.0

    ```


    Figure 6-11 shows many dependencies. In fact, more dependencies exist than the
    command window can display at once. To determine what other modules are needed
    by the driver, refer to the driver''s documentation.'
