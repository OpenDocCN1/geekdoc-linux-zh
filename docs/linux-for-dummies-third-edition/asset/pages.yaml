  md: '# 310 Part V: The Part of Tens


    ![](img/4e9f259b21147d1fb7569159ef49ec31_337_0.png)


    Linux allows you to use spaces and other characters in filenames that you may
    or not be able to use in other operating systems. Some Linux applications stumble,
    however, when they encounter file or directories containing spaces. Usually, a
    safe bet is to stick with alphanumeric characters and avoid spaces and odd characters,
    such as question marks, exclamation points, and so on.


    # Perfecting Printing


    Most Linux distributions include a printer configuration tool called printtool.
    This utility enables you to select the printer type, the name of the printer device,
    and its location. From this information, printtool creates the /etc/printcap file,
    which contains the print information. The syntax of the /etc/printcap is strict
    and if you aren''t familiar with the syntax, /etc/printcap can be confusing. If
    you''re having trouble printing from one system, check out the /etc/printcap file
    of a working system.


    If you were able to print early to your network printer, haven''t made any changes,
    and you can''t print now, try using the ping utility to see if you can access
    the printer. You may want to use the Internet Protocol (IP) number of the printer
    rather than its Domain Name System (DNS) name, so as not to complicate matters
    with a possible DNS error if a DNS problem exists.


    If you can reach the printer by its IP number, make sure lpc is running. If this
    isn''t running on the system hosting the printer and/or the system trying to access
    the printer, the file won''t print. You can use the printtool utility to restart
    the application or lpc via the command prompt.


    If lpc is running and the /etc/printcap file isn''t found, you can contact the
    network printer by its IP number; take a look at the print queue and see if your
    print files are stuck in the print queue. You can use the lpc command to assist
    in this process. In Chapter 13, we cover these various printer utilities. You
    can use the line printer control program, lpc, to disable or enable printers and
    queues, reorder print jobs in the queue, and start and stop print services, and
    other tasks. The man page for lpc is a good starting point for using lpc.


    # Nipping Network Troubles in the Bud


    If you aren''t able to configure your network card on your system, verify the
    hardware settings for your card. Linux is pretty good at detecting most common
    network cards from different vendors, including older models. This isn''t always
    true, however, during the installation process. You may need to specify the network
