    # Harmony and Security on Your LAN


    Networks make sharing information and resources much easier for you. If you

    need to deliver a file to another individual, you can easily do so on a network.

    If you don''t have a network, however, you may need to use sneakernet.

    Sneakernet is the physical transport of files from one computer to another on

    a floppy disk or CD-ROM. On occasion, you may still use this method, but you

    can greatly optimize your information transfer by using a network.


    A new problem arises — getting your information from your network to

    an network. And some of your users need to access a Web server

    on network. To solve this latter problem, you need to connect two or

    networks through some type of interface. This interface is typically a

    router (see the section, "Ruters," earlier in this chapter) or gateway, another

    term for a router sometimes used in network setup dialog boxes,

    route information and requests from one network to another. In addition,

    after you open your front door to another network, you introduce security

    and integrity concerns. In this section, we only touch on each of these

    topics — we could write entire books about each.


    # Making inter and intra harmonize


    IP routing refers to moving data between two IP networks, which you can

    accomplish by using dedicated routers — also by using a Linux system.

    The only difference between the two methods is that a Linux router

    requires two (or more) NIC cards in place. You attach one NIC card to one

    network and a second NIC card to the other network. Both segments are

    using IP, but they''re different IP networks. To enable IP forwarding, you

    er /etc/sysconfig/network file and add the entry for enabling IP for-

    warding. Figure 13-14 shows an example of the network file with the IP for-

    warding in the last line.'
