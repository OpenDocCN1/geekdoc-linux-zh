  md: '# 16 Part I: Getting Your Feet Wet


    To manage the GNU project, Stallman organized the Free Software Foundation (FSF),
    which actually sold free software to help the programmers who worked the on-going
    development of the GNU project. Although this organization and goal setting was
    necessary and important, a much important piece of the puzzle had to be put into
    place to protect this new software from the pirates of big business.


    The General Public License (GPL) is a unique and creative software license that
    uses copyright law to protect the freedom of the software user. This is opposite
    of how we usually think of copyright as an enforceable designation of ownership
    and restriction from duplication by anyone but the copyright holder. When software
    is licensed under the GPL, recipients are bound by copyright law to respect the
    freedom of anyone else to use the software in any way they choose. Software licensed
    with the GPL is also known as copy-left software. Another way to remember the
    GPL is that it means Guaranteed Public for Life.


    # Who''s in charge of Linux anyway?


    As an open source project evolves, various people emerge as leaders. The leader
    has become known as the benevolent dictator. People who become the benevolent
    dictator have probably spent more time on a particular problem and have some unique
    insight. A leader becomes recognized as someone who can make prudent decisions
    with regard to the project. Normally, we don''t pair the word democratic with
    dictator in the same sentence. However, the open source model is a very democratic
    process that endorses the reign of a benevolent dictator.


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel.
    He ultimately determines what features are added to the kernel and what features
    aren''t. The community trusts his vision and discretion. In the event that he
    loses interest in the project, or the community decides that he has gone senile
    in his decision-making ability, a new leader will emerge.


    An open source project has no politics; climbing the success ladder is truly based
    on your merits. The ultimate goal is to get a job done and get it done in the
    most correct manner possible. It''s a natural selection process at work. Linux
    only fails after the last person stops using it.


    # Einstein was a volunteer


    Someone who is a volunteer or donates their time to a project isn''t necessarily
    providing a second-rate effort or only working on weekends and holidays. In fact,
    any human resource expert will probably tell you that people choosing to do so
    of their own free will perform the best work.'
