  md: '# Chapter 16


    # Tuning and Optimizing Linux


    In This Chapter


    +   - Exploring swapping

    - Looking at disk efficiency

    - Discovering tools to watch the action

    - Thinking about busy servers


    A great feature of Linux on a single-user computer is that Linux doesn''t really
    need much tuning and optimizing. Keeping an eye on your resource usage to ensure
    all is running smoothly and efficiently, however, is a good idea. When Linux is
    set up to perform specific tasks, such as to function as a Web server or e-mail
    server, you may need to do tuning so these services perform well on Linux. At
    the end of this chapter, we take a look at some of these specialized situations,
    but first you can take a look at some things to watch for on your ordinary Linux
    system.


    > In theory, there is no difference between theory and practice, but in practice,
    there is.

    — Jan L.A. van de Snepscheut


    # Managing Memory and Disk Space


    Linux is very flexible and can run on a wide variety of hardware systems. Two
    performance-related areas that can vary quite a bit are speed and storagespace
    features. If you''re running Linux on a new fast system, then hardware constraints
    may not be an issue. If you''re running Linux on an older computer system, however,
    then hardware may impact how well Linux runs.


    > Computers in the future may weigh no more than 1.5 tons.

    — Popular Mechanics, 1949'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 266 Part IV: Sinking Teeth into Linux


    Linux, like other operating systems, can''t have too much memory. On the other
    hand, insufficient memory is one area that can affect Linux performance. In this
    section, we cover how Linux handles things when physical memory is low.


    Another area that impacts performance is your storage system. We''re talking about
    hard drives, not boxes and closets. Again, the better, the better if you have
    a few extra dollars, we recommend SCSI over IDE. Most non-server Linux systems
    use IDE drives so we cover tuning techniques for IDE-based systems as well. You
    can find hardware details about IDE and SCSI in Chapter 2.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_293_0.png)


    Finally, another area affecting performance is the CPU. The type, speed, and number
    of processors all have a role. The fastest and newest are usually the best. A
    lot of folks stick Linux on older computers that don''t run other operating systems
    well (or at all); if the CPU is too old and slow, you may not like the performance.
    However, we''ve been quite pleased with Linux running the X Window System (which
    we mostly just call X for short) and several applications on half the hardware
    as other popular Intel-based operating systems!


    # Getting creative with swap space


    Linux automatically uses all the memory you have in your system. On Intel platforms,
    Linux can address all the available space permitted by a 32-bit operating system,
    and 32 bits gives you a maximum of 4GB of memory. You probably don''t need more
    than 4GB of memory, anywhere near that, but Linux''s performance rarely degrades
    when available memory is insufficient. In this section, we show you how Linux
    handles things when physical memory or RAM (Random Access memory) is low.


    Linux can run on very small amounts of memory if not much is needed beyond the
    command prompt, on a basic single-user system, or a workstation on a network.
    Like most other operating systems, however, Linux performs better when more physical
    memory is available. You need to have at least 16MB of memory for a personal-use
    machine. If you''re anticipating running a lot of services and/or heavy usage
    (for example, a Web server), you need to increase the memory.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_293_1.png)


    Memory isn''t the only thing that benefits resource-intensive processes; you also
    need to consider the speed of the processor.


    To increase the amount of available memory for applications, Linux uses a process
    called disk paging in which a specified amount of disk space is set as swap space.
    When Linux requires more physical memory than what''s available, it swaps out,
    or exchanges, pages of memory holding inactive contents to the swap space. This
    makes more physical memory available to the process that needs it. Sometimes,
    this feature is called virtual memory, or'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 16: Tuning and Optimizing Linux 267


    virtual RAM. The applications running have no idea this is going on and they think
    they have lots of physical memory. The ability to swap memory contents to and
    from the hard drive also enables the support of more simultaneous users on the
    same system.


    A nice advantage of this virtual memory system is the ability to share these memory
    pages between applications. For example, if you are running the vi editor and
    you open another vi editor, you have only one copy of the vi code in memory. (For
    more about the vi editor, see Chapter 12.) You are therefore able to run the same
    program more than once in the same amount of physical memory where, if all the
    programs had to have their own space, it wouldn''t fit.


    If you really want to improve performance, you have to add more physical RAM.


    # Calculating how much swap space you need


    You can calculate the amount of virtual memory your system can work with by adding
    the amount of physical memory to the amount of swap space. When determining the
    amount of swap space to create, you must have at least 16MB total virtual memory,
    and out, 4MB physical RAM is the bare minimum.


    You can make the size of a swap area pretty much any size you want — as long as
    the size of your swap area plus physical memory doesn''t exceed 4GB. But if you
    configure an individual swap space larger than 128MB, you waste disk space because
    Linux only uses 128MB no matter how big the swap space is. If you need more than
    128MB, you can have more than one swap area. In fact, you can have up to 16 separate
    swap areas per Linux, which means that you can have as much as 16 times the 128MB
    — 2GB — of swap space!


    You should never need to swap your total area greater than three times the amount
    of physical RAM. If you''re performing a greater than three times of intensive
    graphics under X, you may need more swap space. Remember, your mileage may vary.


    # Avoiding swap files


    Linux supports implementation of swap space in two forms:


    +   - A swap partition: A disk partition specified as type Linux swap (ID=82).
    With a swap partition, you reserve an area of the disk only for swapping and the
    disk blocks are contiguous.


    +   - A swap file: A file placed somewhere in your Linux system. With a swap file,
    the contents of the file may be distributed across non-contiguous blocks, which
    negatively affects access performance.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_294_0.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_294_1.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 268 Part IV: Sinking Teeth into Linux


    ![](img/4e9f259b21147d1fb7569159ef49ec31_295_0.png)


    Swap partitions are more efficient to use swap files and, therefore, the preferred
    method. With a swap partition, you create a partition on the disk that is only
    used for swapping. A dedicated swap partition is more efficient because the memory
    pages can be stored and retrieved from contiguous disks blocks. Disk blocks are
    chunks of disk space, and access by the drive hardware is much faster if data
    can be stored on contiguous blocks of disk space. In contrast, a swap file may
    be located on non-contiguous disk blocks. If data is sprinkled over non-contiguous
    disk blocks, the drive must work harder to locate and find the contents of the
    swapped memory pages. For best performance, use swap partitions.


    Because of the increased use of storage space (slower to access physical memory),
    the overall performance of your system drops when it is doing a lot of swapping.
    When physical memory is too low and/or your swap space is small, your drives begin
    to thrash about. So much time is spent moving memory contents back and forth from
    the drive that nothing else is happening, and the drive''s lights are going wild.
    With the time to the bullet and add more physical memory. Swap space is no substitute
    for physical memory!


    ![](img/4e9f259b21147d1fb7569159ef49ec31_295_1.png)


    Why do you pay a price for using swap space over adding more physical RAM? Remember,
    that drives are primarily mechanical devices. Information is read from and written
    to a set of spinning circular platters stacked inside the external shell of the
    hard drive like a multiple-layer cake. The filling between each layer is air and
    floating above each surface of these platters are heads. Heads perform the changes
    (magic) to the platters'' surfaces to represent your data. When data is read or
    written to the disk, as it is when swap space is used, the head for the appropriate
    platter must physically move to the spot over the designated location. Moving
    back and forth over the surfaces of the disk can only go so fast and is considerably
    slower than transmission of electrical signals through your circuitry. With the
    current hard drives and disk subsystems available today, mechanical operations
    are still slower than electrical currents. What helps on harder drives is the
    presence of multiple heads above each platter surface switching between heads
    on the same track is considerably faster than moving the heads to another track.
    Obviously, on an older system, the negative impact of older disk architecture
    may be more significant.


    # Knowing where to put your swap partition


    Another issue to consider is on the disk you should place the swap partition.
    Older drives have the same number of sectors on each track. Newer drives that
    use ZBR (zone bit recording) have more sectors on the outer or longer tracks than
    on the inner tracks. Because the disk spins at a constant rpm (revolution per
    minute), you get get better performance on the outer tracks of drives using ZBR.
    On ZBR drives, try to place the partition as close to the outer edge as possible
    (meaning one of the first partitions on your drive). For older drives, placing
    the swap partition in the middle of the drive leads to faster access.'
