  md: '# Getting Down and Installing Red Hat Linux


    > Do, or do not. There is no "try."


    — Yoda ("The Empire Strikes Back")


    You can install Red Hat Linux by booting with the Red Hat Installation CD or by
    booting with an installation floppy disk, and having the remainder of the files
    read from the CD.


    The Red Hat Linux 7 distribution is included on the CD-ROMs that come with this
    book. The instructions in this chapter tell you how to follow the installation
    for only Red Hat Linux 7 (6.1 and 6.2, although the instructions are similar for
    Red Hat Linux 7, as well).


    To begin the installation from the CD, you must first change your system to start
    or boot from a CD. In Chapter 2, we cover an example of configuring to boot from
    the CD.


    If you want or need to make the installation floppy disk and have access to a
    DOS, Windows 9x/ME, or Linux system, perform the steps to create the installation
    floppy that we outline in Chapter 2.


    In this chapter we concentrate on Red Hat Linux and its installation for two main
    reasons: because covering the installation of every Linux distribution in existence
    would make this book set of encyclopedias, and because we''ve included Red Hat
    Linux on the CDs with this book. We chose the Workstation installation to cover
    because it requires little or no hard drive preparation and doesn''t use uptem
    partitions like other installations. In addition, if your computer already has
    an existing non-Linux operating system, the Workstation installation retains the
    other operating system by default and allows you to boot to either operating system.
    The Workstation installation opts the X Window System and applications that are
    commonly used on workstations. Server or service type applications, such as the
    Apache Web server and FTP server, aren''t installed with the Workstation option.
    You can also add these to your Workstation installation or choose a different
    option at installation time.


    Until you reach the About To Install (GUI) screen, you can back out of the installation
    without changing anything on your system. None of the configuration options you
    make before the About to Install screen are saved to your disks. After you continue
    beyond the About To Install install screen, data is written to disk and your system
    is changed.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_63_0.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_63_1.png)


    ![](img/4e9f259b21147d1fb7569159ef49ec31_63_2.png)'
  merge: -1
