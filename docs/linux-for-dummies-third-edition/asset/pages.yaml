  md: 'When you''re experiencing network problems, consider the following points:


    +   - If you run ifconfig (one of the best tools for determining your network
    card configuration) and only see the output for lo (loopback), Linux isn''t using
    your network card.


    +   - If you see an entry for eth0 for Ethernet systems, this is a pretty good
    indication that Linux recognizes your network card.


    +   - If your network card is recognized but you can''t do anything on your network,
    make sure you have a valid IP number and subnet mask for your network.


    +   - If you''re using Dynamic Host Configuration Protocol (DHCP) and ifconfig
    shows the address for eth0 as 0.0.0.0, your system didn''t get an IP number and,
    therefore, can''t communicate.


    +   - If you need to use your system before addressing the DHCP issue, manually
    enter a non-conflicting IP number and subnet mask for your network. If you can
    then access the network, you need to look at either the DHCP server and its settings
    or why your system is unable to obtain an address.


    +   - If your system has the proper configuration settings, the ping application
    to ping other systems on your network. You may want to use the IP numbers of the
    other systems instead of their DNS names. If another problem with name resolution
    is lurking and you use DNS names, you may complicate your troubleshooting.


    +   - If your system can access other systems on your network cannot access the
    Internet or another network, make sure the system has a gateway IP address specified.
    The gateway, or router address, tells your system where to go when it encounters
    a reference to an IP address outside your network.


    +   - If you have the gateway IP number set but can''t get to the outside, make
    sure you can ping the gateway address. If you can''t ping the gateway number,
    then you aren''t able to go outside your network.


    The IP configuration and/or related applications files on your system can also
    cause problems if they become corrupted. To check, type ping localhost at a command
    prompt.


    If this command fails, the problem is probably one of the IP component files.
    To correct this, you need to replace the files with a known good copy from another
    source. If you can ping your machine''s IP number but not another machine, then
    you may have an incorrect or misconfigured network card driver.'
  merge: -1
  pgno: 338
