- img_proc: true
  md: '# 284 Part IV: Sinking Teeth into Linux


    # Plugging the Holes and Fixing the Leaks


    Although you can''t plug some holes until you find them — such as the items pointed
    out in security notifications — others come prepackaged. The natural thing to
    do when reading about an unknown security hole in the shrinkwrapped version of
    a Linux distribution is why this is, if they''re known, they''re not plugged up
    in the first place. Good question. The answer is that the people building the
    Linux distributions don''t know exactly what you, in particular, want to do. They
    do their best to meet the security needs of an average user, which isn''t exactly
    right for everyone. But rest easy, because this issue''s a lot easier to deal
    with than you may think.


    # Understanding network dangers


    It''s important that you don''t have any network services running that you don''t
    intend to use. To understand why, you first need to comprehend a bit about how
    these services work. Every network service listens to an assigned place leading
    to the outside world. For example, if you''re running a Web server, it''s listening
    to port 80. Think of a port as an apartment number. Whenever a person wants to
    look at one of your Web pages, they point their browser toward your Web server,
    which is typically named something like www.mywebserver.org. This is the street
    that you live on. Along with a name, this server also has an IP address, which
    is something like 192.168.15.65. This is the street address assigned to your apartment
    building. The apartment building is full of doors leading to various network services
    — unless you set them up differently. Don''t do unless you want to have a hard
    time getting to it.


    > TECHNICAL STUFF

    like an apartment door. You may have just a bit of security, like a normal key
    lock. Or, you may have a deadbolt, a combination lock, and other gizmos protecting
    the point of entry. Here is where the metaphor begins to break down, though. You''re
    not likely to decide that a particular apartment can''t have anyone going in or
    out. With a computer''s network services, however, this is a very important thing
    to consider. If you''re not going to run an FTP server, for example, having ports
    20 and 21 functioning provides more doors for potential intruders to attack through.


    You can see which port corresponds to which network service in the file /etc/services.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_311_0.png)


    It''s possible to have a certain amount of security protecting each port, just
    like an apartment door. You may have just a bit of security, like a normal key
    lock. Or, you may have a deadbolt, a combination lock, and other gizmos protecting
    the point of entry. Here is where the metaphor begins to break down, though. You''re
    not likely to decide that a particular apartment can''t have anyone going in or
    out. With a computer''s network services, however, this is a very important thing
    to consider. If you''re not going to run an FTP server, for example, having ports
    20 and 21 functioning provides more doors for potential intruders to attack through.'
