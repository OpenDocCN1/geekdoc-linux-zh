    # File attributes


    Files are a lot like candy bars. The wrapper provides information about the ingredients,
    size, package date, and so on — all descriptive of the tasty nugget inside. (Perhaps
    the wrapper is even child proofed.) Files keep all this wrapper information in
    an inode. Along with the capability to change file inode information, these commands
    also can return information about the actual content of the file.


    ```

    chage, chattr, chgrp, chmod, chown, file, stat, sum, touch, wc

    ```


