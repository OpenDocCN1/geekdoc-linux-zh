- img_proc: true
  md: '# Appendix B: Glossary


    **sneakeret**: A method of data sharing that involves copying data from one computer
    to a floppy disk and carrying (walking) that floppy to another computer for data
    retrieval.


    **software**: A general term for programs or applications that can be electronically
    stored and run on computers. Software is most often tested and packaged before
    distribution to users.


    **source code**: The human-readable text that we want to communicate to the computer.
    Source code must be compiled, or translated into native binary language to make
    it computer-readable.


    **spooling**: See queuing.


    **static IP address**: An IP address that''s manually assigned to a computer or
    device. See also dynamic IP address.


    **superuser**: See root user.


    **SWATCH (Simple WATCHer)**: Security software that monitors and filters information
    written to log files and carries out an action when it detects a pre-determined
    pattern in the log.


    **symlink**: Short for symbolic links. Marker files or shortcuts in Linux that
    point to files containing script instructions.


    **tarball file**: Similar to WinZip or PKZip files, an archive file created with
    the Unix tar utility that contains one or more compressed files. The files can
    be extracted and decompressed back to their original form. Archive files are commonly
    used to shrink files temporarily for faster transfer between remote computers
    and via the Internet.


    **TCP/IP (Transport Control Protocol/Internet Protocol)**: A popular communications
    protocol that supports data transfer between hosts in networks, such as the Internet.


    **Telnet**: A terminal emulation program used on networks to connect to a remote
    computer and enter process commands as if the user were working on the remote
    computer.


    **Tux**: The formal name of the mascot penguin that represents Linux.


    **Unix**: A less-than-user-friendly but powerful network operating system that
    supports a multi-user, multitasking environment. Unix was one of the first network
    operating systems introduced and became the foundation for the Internet.


    **user**: A person who uses a computer.'
  merge: -1
  pgno: 384
