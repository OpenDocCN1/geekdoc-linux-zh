  md: '# Authors'' Acknowledgments


    As a team, the authors and editors on this project would like to thank IDG Books
    for inviting LANWrights for putting a team together to take over for John "Maddog"
    Hall on this book. He is too busy leading Compaq''s UNIX Software Group, acting
    as Executive Director for Linux International, and sitting on the Board of Advisors
    for Sair Linux/GNU certification to take on a third edition, and we''re glad to
    have been asked to take over this time around.


    Next, we''d like to thank the great teams at LANWrights and IDG Books for their
    efforts on this title. At LANWrights, our fervent thanks to Kim Lindros, who nearly
    tied herself in knots making some pretty challenging deadlines on this project.
    We''d also like to thank Rader for his outstanding-leadership and planning skills.
    At IDG Books, we must thank our project editor, James Russell, for his extraordinary
    efforts, and copy editor Nicole Laure for her marvelous way with our ours. Others
    we need to include production coordinator Dale White and his fabulous PLTs for
    their artful page layouts, Marianne Santy for their painstaking trials, and Laura
    Carpenter for their CD production tranche. IDG Books'' Joe Wikert and Judy described
    extraordinary insight and taste by hiring us for this project.


    Finally, we want to thank our gifted — talented and above all, quick-witted —
    team of writers for their work on this book. Dee-Ann: thanks for the first chair,
    and helping to shape the content and coverage for this book, as well as for your
    excellent work. Melanie: thanks not only for your great work, but also for your
    great ideas on some tricky and time-consuming tasks. Evan: thanks for your great
    ideas on some useful chapters and appendices.


    > —Ed Titel, for LANWrights, Inc.


    Rather than making this huge back-patting session, I will just tell the folks
    at IDG Books, LANWrights, and my co-authors for all working so hard to pull this
    together! I''d also like to thank Zorro for his great patience when I kept telling
    him "in a minute" to all of his requests to go play or go hiking.


    > —Dee-Ann LeBlanc


    > —Melanie Hoag


    — Wei Ming'
