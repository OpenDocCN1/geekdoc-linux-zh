  md: '# Chapter 6: Adding Devices and Software to Linux


    continues to load anyway. Any extra, unused device driver code hangs around but
    causes no harm. This unused code does take up a small amount of memory.


    Ignoring missing hardware is great because it enables the system to continue loading
    instead of waiting for a non-present device to respond. You''ll find this particularly
    useful when you''re removing hardware for repair. After you replace hardware of
    the same type, the driver recognizes the hardware and you''re back up and rolling.


    # Those pesky drivers


    When you add hardware to Linux, you also need to add its device driver. A nice
    feature of Linux drivers is that you can load and unload them dynamically. In
    short, you can add or remove device drivers at the command prompt or in X, which
    is especially useful for testing and adding updated device drivers. After you
    load a Linux driver or module, it''s as much part of the kernel as any of the
    other kernel code.


    An important item that you need to keep in mind is that some device drivers require
    supporting code to be present, either in the form of another device driver or
    as part of the kernel. If the device''s supporting code is not available, the
    device driver doesn''t load and usually you get some type of error message. We
    cover methods you can use to determine what other component a device driver needs.


    To illustrate some of these hardware and software concepts, we walk you through
    an example of adding a NIC device driver to the Linux system. For this example,
    we assume the hardware has already been properly installed.


    # A GUI way to add a device driver


    Before we can begin adding a device driver, we need to document the type of NIC
    and its hardware settings. For an example, we use a Ethernet card.


    A very nice utility called LinuxConf enables you to configure many aspects of
    your Linux system. You can access it from within X or from the command prompt
    with LinuxConf. We use the X version of LinuxConf, but you use the same options
    and settings when executing it from the command prompt.


    To access LinuxConf from X, follow these steps:


    +   1. Click the Main Menu button and choose Programs: System: LinuxConf.


    The default display should be Config, but if it isn''t, click the Config tab at
    the top of the LinuxConf window.'
