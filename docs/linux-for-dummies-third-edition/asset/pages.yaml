  md: '# Chapter 14


    # Checking Out thenLinux File System


    **In This Chapter**


    +   - Discovering the root directory and subdirectories

    - Discerning partitions from directories

    - Adding removable media to the file system

    - Caring for your file system

    - Adding a new hard drive


    > I have an existential map. It has “You are here” written all over it.

    — Steven Wright


    One of the most frustrating things about learning a new operating system is figuring
    out where it keeps files. Instead of keeping all the important files in a single
    directory, like the C:\WINDOWS directory in Microsoft Windows, Linux follows the
    lead of its Unix cousins and spreads things out a bit more. Although the setups
    involve different methods, they''re both logical. They also require that you understand
    where to look.


    Another issue that you come across is adding new media — hard drives, floppy disks,
    CD-ROM''s, Zip disks, and more — onto the existing file system. In this chapter,
    we focus on how the file system is organized and other handy things, such as how
    to access data on a floppy disk.


    # Introducing the Linux File System


    Picture your hard drive. Maybe you have Linux all by itself on there, or it might
    be sharing it with another operating system such as Microsoft Windows. All the
    hard drive space that you allocated for Linux during the installation process
    is your Linux file system. Because you''re running'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 226 Part IV: Sinking Your Teeth into Linux


    own Linux machine, you must be familiar with how it''s put together — especially
    the sections that are dangerous to mess with!


    # Walking through the layout


    As you probably already noticed, the Linux file system is deeply layered. It consists
    of lots of directories and subdirectories. Most of the internal information in
    an operating system such as Microsoft Windows is hidden away in the Windows directory.
    In Linux, however, this information is scattered a bit wider and for good reason:
    Lots of files are involved! But after you come to understand it, you see that
    Linux maintains a logical order where it keeps things.


    # Meet the root directory


    Everything in the Linux file system is relative to the root directory, which is
    referred to as /. The root directory is the file-system base, a doorway into all
    of your files. The root directory contains a mostly predictable set of directories.
    Each distribution varies slightly, but standards exist to which they all conform.
    The standards keep us all sane.


    Rather than flood you with everything at once, we start by talking about just
    the items that are directly off of root. Table 14-1 lists the standards and some
    of the more common extras. An asterisk (*) at the end of a description indicates
    that you shouldn''t mess with this directory unless you have a specific reason
    to, because it contains files that are very important to the functioning of your
    system.


    | Table 14-1 Standard / Contents in Linux |

    | Directory | Contains |

    | :--- | :--- |

    | /bin | The commands that everyone needs to use at any time.\* |

    | /boot | The information that boots the machine, including your kernel (which
    we discuss in Chapters 4 and 15).* |

    | /dev | The device drivers for all the hardware that your system needs to interface
    with.\* |

    | /etc | The configuration files that your system and many of its software packages
    use.\* |

    | /home | The home directories for each of your users. |

    | /lib | The code that many programs, and the kernel, use.\* |

    | /mnt | The spot where you put temporary media, such as floppy disks and CD-ROMs.
    |'
