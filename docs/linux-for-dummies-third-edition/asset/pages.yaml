    The IP number listed adjacent to indent add: in Figure 7-4 is the number your
    ISP dynamically provided your system when you logged in. This number is likely
    to change each time you dial in. You may get the same number again, however, because
    your ISP is providing IPs from the same pool each time you connect.


    If you care about how your information is traveling through the network, route
    provides you with some interesting reading. The most significant tidbit of data
    is the line labeled default. In that line the Gateway column, the IP number listed
    is the machine acting as your bridgedevice to the Internet at large. This number,
    likely handed to your machine by your ISP when you connected, is the first stop
    for the IP packets leaving your computer.


    # Putting IP to work on your network


    The ping command is akin to a submarine using sonar to detect other objects in
    the ocean. Son sends out a ping signal, which reflects off a hard surface. By
    measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine object is.


    Latency, or the amount of time it takes for a signal to travel, on the Internet
    has little to do with physical distance. Rather, factors such as network traffic,
    bandwidth, and network hardware all contribute to a slow latency. These factors
    determine whether a ping to your neighbor''s computer takes longer than pinging
    a host at the South Pole.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_142_0.png)'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 116 Part II: Internet NOW


    To use the ping command in Linux, you must have an object in mind that you want
    to ping, which is usually another host computer that''s connected to the network.
    You can ping an IP number of another host, or a hostname that your DNS is working
    correctly.


    For an example, the gateway IP number that you found from the route command issued
    in Figure 7-4 (remember, the gateway is the first intersection of your network
    traffic crosses to get to the Internet at large) using the following command:


    ```

    ping 209.250.140.150

    ```


    Press Ctrl-C to break the ping; otherwise, your machine continues to ping at the
    target.


    The ping line, shown in Figure 7-5, provides information about what the ping is
    doing. If the host is unreachable, a message indicates so. If the host is located,
    you receive a line that provides some useful data, namely the item on the line:
    time=. This is the time, in milliseconds for the signal from your computer to
    go out to the destination computer and return. Lower numbers are better. For an
    Ethernet, a ping time of 1-3ms is an acceptable response time from another machine
    on the same local net (that is, the gateway). For dialup connections, expect around
    150ms (ms meaning milliseconds). When you start pinging times to 900ms or better,
    some serious network traffic likely sits between you and your target.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_143_0.png)


    Figure 7-5

    Sample results of the ping command.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_143_1.png)


    Suppose you were attempting to visit www.yahoo.com and it didn''t appear. You
    could jump out to a command prompt and try to the destination:


    ```

    ping www.yahoo.com

    ```


    ping lets you know whether or not a network problem sits between you and the host
    that manages the Yahoo.com Web site. Although this may indicate a network problem,
    ping doesn''t provide much information about'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Chapter 7: Connecting to the Internet 117


    than that. To flush out more of the problem, you can use the traceroute command.


    The traceroute command enables you to map your IP packets taking from your computer
    to the intended destination. Just because you may not be able to visit your Web
    site does not mean the Web site is down, it may simply mean that link along your
    route is down. Ever hear of traffic congestion on your morning commute due to
    a pile-up? The same thing happens on the Internet when a significant router or
    conduit goes down.


    To use traceroute, you need to know of a destination. Try Yahoo.com!


    ```

    traceroute yahoo.com

    ```


    ![](img/4e9f259b21147d1fb7569159ef49ec31_144_0.png)


    Figure 7-6 Results of the traceroute command.


    Notice that the first line, shown in Figure 7-6, indicates a warning simply noting
    that Yahoo.com uses multiple hosts (each of which needs its own unique IP number)
    to serve your information. With the high volume of activity that Yahoo! gets,
    it serves the community by dividing the load to various hosts over the Internet
    and DNS direct traffic.


    Each line of your traceroute result represents a hop. This command helps to illustrate
    the concept explained earlier packets being routed, or handed off to carriers
    along the way to move your package to its destination. Each hop is a physical
    machine that reads your packet address and forwards it. You will also notice a
    latency time associated with each hop. You can identify heavy network congestion,
    or a weak router along the way, by identifying the larger numbers in the list.


    Sometimes, especially when you''re troubleshooting why you can''t access your
    intended Web site, you perform a traceroute that times somewhere along the way.
    This usually indicates that a traffic accident has occurred somewhere along the
    internet highway. Give it a few minutes and try again. TCP/IP is an amazingly
    robust protocol that was designed to route packets efficiently in the event of
    a failed network segment.'
  merge: -1
