  md: '# Chapter 7


    # Connecting to the Internet


    **In This Chapter**


    +   - Accessing the Internet

    - Wrestling your modem into submission

    - Connecting to your Internet Service Provider (ISP)

    - Some TCP/IP tidbits

    - Hacking your way around the Internet


    Most folks simply assume that their personal computer is capable of connecting
    to the Internet. To become a Linux power user, you must become Internet savvy.


    To get connected, Linux has traditionally required you to understand the mysterious
    details of dialup networking. Fortunately, Red Hat has developed graphical desktop
    tools to help grade the learning curve for you. In this chapter, we slash a trail
    through the dialup networking jungle and help you connect your Linux machine to
    the rest of the world. After you''re connected, we show you how to mingle with
    the Linux community with the use of a few cool tools.


    # Bandwidth: 1 Want My OC-255


    Okay, perhaps 13.2GB per second is overkill when you consider that your PC would
    seize while attempting to digest data at that speed. Regardless, every Internet
    surfer is on a quest: to find open lanes on the information superhighway. Telephone,
    cable, and satellite television companies are currently jockeying for a strategic
    location in your future Internet-connection budget. In the following list we briefly
    examine a few Linux-friendly options that may be available to you.


    +   - Cable modems: Many cable television companies have expanded their product
    line to include Internet access over their cable infrastructure. When you subscribe
    to a cable service, the install technician provides you with a special device
    called a cable modem along with a standard network adapter of some sort that then
    they install into your'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 104 Part II: Internet NOW


    computer. If available in your area, cable Internet connectivity provides the
    best cost to bandwidth ratio currently available. In other words, the service
    will likely cost you more than a dialup connection, a cable connection can reach
    speeds 50 times faster than a 56 Kbps dialup account while typically costing only
    two times as much.


    You may be on your own to configure your Linux machine to work with cable Internet
    service. Most cable companies do not provide technical support for Linux. The
    following web page provides a document that you fill in all of the:


    ```

    www.linuxdoc.org/HOWTO/Cable-Modem/index.html

    ```


    As you''ve probably noticed by now, your computer is a conglomeration of micro-electronic
    components, each performing a unique function. A network adapter is a device that
    communicates digital (binary) information over a transport medium (cable, copper
    wire, fiber optic, infrared, or radio frequency) to another computer. A modem
    is an additional device that is required to convert the digital signal generated
    by the native signal of the carrier medium.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_131_0.png)


    +   ISDN: Just a couple of years ago, Integrated Services Digital Network (ISDN)
    provided the residential high-speed option when 28 Kbps was all that you were
    able to make like milk from the copper strands that connected your telephone to
    the telephone company. Still available, ISDN promises a steady 128 Kbps — provided
    that you are within 3.4 miles of the telephone company''s central office. You
    may need a special device like a terminal adapter (an ISDN modem) and a network
    adapter. The Gnome desktop includes the Red Hat config tool that you can use to
    configure your ISDN service (choose Programs:System:isdn-config).


    +   DSL (Digital Subscriber Line): DSL works much like ISDN in that it carries
    data to your telephone jack in a digital format. DSL is gaining popularity because
    it provides a faster connection with a lower cost of installation and service
    than ISDN and it utilizes your existing copper telephone wiring provided by your
    telephone company. A DSL connection requires additional communication hardware
    that should be provided by your ISP. Typical residential connection service ranges
    from 128 Kbps to 384 Kbps. For an overview of DSL, visit the following page:


    ```

    www.linuxdoc.org/HOWTO/DSL-HOWTO/index.html

    ```


    +   Dialup modems: The modem, still the most widely used Internet connection device,
    translates the digital signal from the computer into an analog signal required
    for transmission from the wall jack to the telephone company. Because it utilizes
    existing voice telephone service, you need no special setup beyond subscribing
    to an Internet Service Provider (ISP). Following the following sections, we guide
    you through setting up a modem on your Linux workstation and connecting to the
    Internet.'
