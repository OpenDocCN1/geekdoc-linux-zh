  md: '# Introduction


    ![](img/4e9f259b21147d1fb7569159ef49ec31_30_0.png)


    Failure to follow instructions exactly can have all kinds of unfortunate, unseemly,
    or unexpected side effects. If you don''t know exactly what you''re doing at the
    command prompt, don''t experiment for the sake of exploration — you may regret
    your carefree departure from our instructions!


    Other than that, you find out how to marshal and manage the many commands, utilities,
    and programs that help to make Linux the powerful and all-encompassing computing
    environment that it is today.


    The margins of a book don''t give you the room as your computer screen. Wherever,
    some lengthy command at the command prompt, or designs for World Wide Web sets
    (URLs, for Uniform Resource Locators), may wrap to the next line when we present
    them. Remember that your computer sees wrapped lines as a single set of instructions,
    or as a single URL — if you''re typing in a hunk of text, keep it on a single
    line. Don''t insert a hard return if you see one of these wrapped lines. We''ll
    clue you that it''s supposed to be all one line by breaking the line with a slash
    (to imply "wait, there''s more") and slightly indenting the overage, as in the
    following simply:


    ```

    http://www.infocadabra.transylvania.com/nexus/plexus/plexus/praxis/oday/this/is/a/make-believe/URL/but/some/real/ones/are=SERIOUSLY/long.html

    ```


    ![](img/4e9f259b21147d1fb7569159ef49ec31_30_1.png)


    In some cases, Linux or its attendant software wants you to match all input text
    as to uppercase, lowercase, or both. Do yourself a favor: please, enter all input
    text as it appears in the book, unless we tell you explicitly that you can take
    liberties with upper- and lowercase characters. This is especially true for account
    names, passwords, and filenames where case matters a lot!


    # Three Presumptuous Assumptions


    They say that making assumptions makes a fool out of the person who makes them
    and the person about whom those assumptions are made (and just who are They, anyway?
    We assume know, but ... never mind). Even so, practicality demands that we make
    a few assumptions about you, your gentle reader:


    +   - You can turn your computer on and off.

    - You know how to use a mouse and a keyboard.

    - You want to install, configure, and use a Linux system because you''re curious,
    interested, or it''s your job to do so.


    # 3'
