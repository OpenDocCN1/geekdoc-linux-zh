  md: '# Creating Your Internet-O-Matic


    Sara, could you connect me with Goober down at the fillin'' station?


    — Andy Griffith


    If only it that simple. Fortunately, the good folks at Red Hat have provided us
    with a few tools that reduce the complexity of dial-up networking with Linux.
    Not long ago, configuring dialup networking on a Linux machine was nothing short
    of debugging a defective Rube Goldberg contraption.


    Connecting to the Internet with your Linux PC is as easy as 1, 2, . . . er . .
    . um . 3–4–5.


    +   1. Determine if your modem is Linux-friendly.

    2. Gather ISP service information.

    3. Configure your modem.

    4. Connect to the Internet.

    5. Surf!


    # Finding a modem


    Please fasten your seat belts. No PC is immune to the turbulence encountered with
    modem installation. Historically, computer hardware manufacturers have considered
    modems luxury options that you must install yourself. Although you''re led to
    believe that the Plug and Play concept is designed to harness those Fisher-Price
    skills you picked up as a child, you may ultimately become acquainted with the
    arcane ideas of IRQs and memory addresses to make the device work work properly.
    You may even encounter problems with your factory-installed modem, as Linux doesn''t
    currently provide support for many of these wannabe modems posing as modems (See
    the “Beware of devices posing as modems in this chapter).


    Hopefully, you''re not sobbing into a pillow, cursing your misguided consumer
