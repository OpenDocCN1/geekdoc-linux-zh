    # # Customizing Your Disk Partitions


    If you install Linux, you can modify and set up your disk partitions. If you already
    have an existing operating system on your drive(s) that you want to keep all of
    the disk space is used, you need to resize your partitions before begin installing
    Linux. Also, some people prefer setting up all the disk partitions for Linux before
    installation rather than during the installation process. See Chapter 3 for information
    about managing disk partitions.


    Commercial programs are on the market, such as Partition Magic, that can resize,
    move, and add partitions for a wide range of operating systems. In addition, free
    programs (some are shareware) are available that you can also use to modify your
    disk architecture.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_56_0.png)


    # # Partitioning safely with fips


    Probably the most common free partition modification program is fips (First nondestructive
    Interactive Partition Splitting). Most Linux installation CDs contain this program.
    If you not, you can download it from the Internet.


    On the Red Hat Linux 7 CD1 that came with this book, it''s contained in the /dosutils
    directory. In that directory, you find two subdirectories for fips — fips15c and
    fips20. The /fips20 directory contains the most recent version of fips and the
    documentation.


    As its name implies, fips enables you to modify your partitions without destroying
    existing data or operating systems. However, because you''ll be modifying your
    disks'' file system architecture, make a backup of your existing files and important
    data before using fips.'
