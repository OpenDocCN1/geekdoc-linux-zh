  md: '# Installation Instructions


    To install the items from the CD to your hard drive, follow these steps:


    +   1. Insert CD1 into your computer''s CD-ROM drive.


    +   2. Reboot your PC. (As long as your PC is configured to boot from the CD,
    this starts the Linux installation process for you automatically.)


    +   3. Congratulations! The Linux installation process is now underway. For the
    rest of the gory details on this fascinating task, please consult Chapter 3.


    To install the items from the CD to your hard drive with a boot disk (we show
    you how to make one in Chapter 2), follow these steps:


    +   1. Insert CD1 into your computer''s CD-ROM drive, and insert a bootable Linux
    floppy into your computer''s floppy drive — see the instructions for creating
    a bootable Linux floppy in Chapter 2.


    +   2. Reboot your PC. (This starts the Linux installation process for you automatically.)


    +   3. Congratulations! The Linux installation process is now underway. For the
    rest of the gory details on this fascinating task, please consult Chapter 3.


