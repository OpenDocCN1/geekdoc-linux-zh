  md: '# Chapter 13: Setting Up Your LAN


    If your device doesn''t have the capability to install a NIC and/or doesn''t have
    the necessary circuitry built in it, you can use an external device between the
    system and the network cable. You often must use an external device for printers
    that are network aware. These printers have no network cable connection and cannot
    accept a NIC card. Hewlett-Packard JetDirect devices are examples of external
    devices that enable you to connect a printer that itself contains no network hardware
    to a network. For this situation, the external device has two connectors. One
    connects to the connection port, and the other connects to the network. The intelligence
    that makes the printer networkable is the external device itself. For more information
    on these types of devices, refer to a vendor''s Web site. Figure 13-8 shows an
    example of computers and devices attached to the network cable.


    # Routers


    Another planning and design issue that you must consider is how to connect your
    network to another network. The device that handles this is known as a router.
    the router sends information from one network to another network. You can think
    of a router as being like the Post Office. The Post Office takes your mail from
    a mailbox (computer and NIC) to a central location (hub) and sends (routes) to
    its destination. The mail''s journey may take it through other Post Offices until
    it ends up at its final location. The same concept applies to networks connected
    with routers. Your information travels from network segment to network segment
    connected one or more routers until it reaches its recipient.


    Routers come in different forms. A router can be a separate physical device that
    does only routing and nothing else. These devices are usually more expensive but
    have several benefits, including security. Because they only route packets of
    data, the routers themselves contain no data. In addition, most office-grade routers
    include other features such as firewalls and permissions.


    Your Linux system can also act as a router. You can install more than one NIC
    or interface in your Linux computer. Each network interface is attached to a different
    network. You can also configure Linux to route different protocols:


    +   - IP — This is the protocol used on the Internet and in many LANs and WANs

    - IPX — Novell developed this protocol, which can be used on non-Novell operating
    systems

    - AppleTalk — Apple developed this protocol, which is designed to be used primarily
    on small Macintosh networks'
