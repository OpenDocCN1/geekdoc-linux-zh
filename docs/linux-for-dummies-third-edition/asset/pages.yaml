  md: '# Chapter 5: Booting Linux and Setting Up a User Account


    # Fun with your BIOS and MBR


    After you switched the loud fan, and listening to your obviously computer looks
    for your BIOS (Basic Input/Output System). The BIOS is a special chip on your
    machine that stores information about your hardware and tests to make sure everything
    is working and working properly at boot time. This includes memory test that most
    people find so annoying and pressing Esc to stop.


    If you have multiple operating systems when you installed LILO, it put information
    into the MBR that ensures when the system boots, you get a menu asking which operating
    system you want to boot from.


    When the BIOS has finished its tests, the computer looks to the MBR (or Master
    Boot Record), which is always on the very first sector on your hard drive, for
    instructions on how to boot the operating system. The MBR looks and finds LILO
    and summons the initial LILO boot: prompt.


    The MBR is the first sector on your hard drive — hard drives are usually divided
    into a bunch of different kinds of pieces, as shown in the following figure. Sectors
    are one of the measurements a PC uses to find data on a drive. Many versions of
    BIOS cannot look the 1024th sector (around the 8GB point) on the drive during
    the initial boot process. So, being familiar with sectors makes it easier to make
    sure that your boot / partition is somewhere where the BIOS can find it.


    MBR = Master boot record


    ![](img/4e9f259b21147d1fb7569159ef49ec31_102_0.png)'
  merge: -1
