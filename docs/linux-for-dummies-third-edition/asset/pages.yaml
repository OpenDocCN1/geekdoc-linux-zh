    Some ISPs provide their own proprietary software that you must install on your
    PC to connect to the Internet. The software they provide is likely to run only
    on Windows. Several free dialup services now gaining in popularity don''t work
    with Linux because of this. Their proprietary software meddles with the operating
    system to ensure that banner advertising isn''t hidden, or that you only stayed
    in for a specified duration.


    If you''re shopping around for an ISP, consider the following:


    +   - Can you get local dialup numbers across the country and around the world?
    If you travel a lot and need Internet access from different cities, this service
    is a handy money saver.

    - Do they provide technical support for Linux?

    - Ask a friend. ISPs best friend is an endorsement from a satisfied customer.

    - Although not entirely an accurate measure, a subscriber-to-line ratio of 7 to
    1 (meaning that there will be on average 7 or less subscribers per line) or better
    would help you avoid frequent busy signals. Hey, it doesn''t hurt to ask.


    # Information you need from your ISP


    Most reputable ISPs provide you with a customer information sheet after signing
    up for their services. This sheet should include the following information at
    your minimum:


    +   - Local telephone dial-in number(s)

    - User login name

    - User login password

    - E-mail address

    - E-mail host

    - News host


    With this information, you''re able to establish an Internet connection using
    your Linux system.


    # Configuring your dialup service


    If you haven''t already done so, start up your computer and login to your GNOME
    desktop. You don''t need to be logged in as the root user, but you do need to
    know the root password.'
