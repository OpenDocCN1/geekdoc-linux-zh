    Before using fips, you must defragment your hard drive. Windows 9x/ME includes
    a defragmentation utility.


    +   4. Click the Start button and click OK.

    5. Type defrag in the Open field and click OK.


    Defragmentation shuffles around your files so they occupy the beginning of your
    disk''s storage area. This frees up unused space at the end of the drive so that
    you can shrink your partition. If you don''t defragment your hard drive, you may
    not be able to shrink your partition.


    The Defragmentation Utility dialog box opens.


    +   6. Select your drive or drives and click OK.


    Depending on the size of your hard drive, the number of files, and how much the
    drive is already fragmented, defragmentation may take a long time. A long time
    may translate to several hours. We recommend that you start this task in the evening
    and allow defragmentation to occur overnight.'
