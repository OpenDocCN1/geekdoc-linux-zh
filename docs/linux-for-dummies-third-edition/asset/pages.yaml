  md: '# 232 Part IV: Sinking Teeth into Linux


    Do not remove a floppy disk without correctly unmounting it, or you may wind up
    with missing data! Although you don''t need to worry about data with CD-ROMs,
    you often can''t remove the disk until you mount it. And you can''tmount an item
    if you''re already in it, make sure that you''re not anywhere in its directories
    before you do so.


    ![](img/4e9f259b21147d1fb7569159ef49ec31_259_0.png)


    If you''ve got both Windows and Linux set up on your computer and can boot from
    either operating system (a dual-boot setup), you can mount your Windows partition
    while you''re in Linux! This is a great way to transfer files back and forth if
    you need to.


    # Formatting disks


    A floppy disk often comes as a blank slate or formatted for Windows or Macintosh
    use. If the disk is a blank slate, no computer can use it for anything. No computer
    running any operating system can store data on a totally blank floppy disk. A
    disk must have a file system on it to store information within that file system''s
    format. That''s what formatting a disk is all about: building a file system. You
    can either format a disk from the command prompt or use a GUI tool to do it here
    in case you''re not using GNOME.


    # Formatting at the command prompt


    To format a floppy at the command prompt so that Linux can recognize it as a Linux
    disk, follow these steps:


    +   1. Place the floppy /fd0.

    2. Type mke2fs /dev/fd0.


    Technical information about the information being written to the disk scrolls
    past. After the light on the floppy drive turns off, you can either eject the
    disk or mount it onto the file system and use it.


    After you format the floppy, you can mount it, as we discuss in the section "Adding
    media temporarily," earlier in this chapter.


    # Formatting in GNOME


    To format a floppy in GNOME so that Linux can recognize it as a Linux disk, follow
    these steps:


    +   1. On the icon bar, click the Footprint icon to open the main menu.

    2. Click Programs: Utilities: floppy.


    The Format a Floppy dialog box opens, as shown in Figure 14-2.'
