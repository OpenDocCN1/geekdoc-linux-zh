  md: '# 88 Part I: Getting Your Feet Wet


    # # Understanding Hardware and Software Basics


    Before we start, we must first roll up our sleeves and delve into a little hardware
    and Linux kernel stuff. Before you add new hardware, you must know what the device''s
    hardware settings are. You need to keep these straight so one device doesn''t
    interfere with another device. Hardware conflicts can render your system completely
    inoperable or not functional. The following list describes the major points you
    need to grasp to understand hardware and software.


    > Those parts of the system that you can hit with a hammer (not advised) are called
    hardware; those program instructions that you can only curse at are called software.


    Anonymous


    +   **Controllers**: Each physical device on your system has some intelligence
    and its own hardware controller. The controller provides a mechanism for the CPU
    to interface with the hardware so that commands and data can pass between the
    two. Some devices, such as the keyboard and mouse ports, share the same controller.
    Others have their own controllers. For example, SCSI and IDE storage systems have
    their own types of controllers.


    +   **Interrupts**: When the hardware''s controller needs something done, such
    as computations or data sent to another component, it interrupts the the processor
    to get the CPU''s attention. To keep straight which hardware device is, each device
    is assigned an interrupt number. This number is commonly referred to as an IRQ
    (Interrupt Request line) number. The IRQ is a direct line to the processor so
    when the doorbell rings on interrupt 5, the CPU knows who''s at door. The processor
    can then accept the request from the device and send the results back to the correct
    hardware. Most systems, common hardware devices use the same interrupt values.
    For example, the standard interrupt value assigned to a floppy drive is 6 and
    the first IDE controller is usually 14. You can see which interrupts your system
    is using by looking at the /proc/interrupts file (see Figure 6-1).


    +   **I/O port**: Hardware devices and the CPU pass data back and forth between
    them. If the CPU is busy processing one device''s task, it can''t just stop to
    accept data from another device. The system maintains a location in memory for
    each device to drop off data the processor picks it up. The CPU uses this same
    location to place its data for the device to use. You can think of this as an
    In/Out bin. On the system, it''s known as the I/O (Input/Output) port, base address,
    or I/O address. Unlike interrupts, the device''s I/O port can''t overlap or be
    the same as another device. Also, common hardware such as the hard drive uses
    the same addresses on different machines. You can find the I/O port values in
    use and the devices using them in the /proc/ioports file (see Figure 6-2).'
  merge: -1
