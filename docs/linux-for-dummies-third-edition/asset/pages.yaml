    # Restoring LILO


    After you manage to boot with the custom boot disk or install the boot disk, you
    need to fix the problem. The fastest thing you can try is re-running LILO and
    rebooting. To run LILO in verbose mode (which means it tends to give you lots
    of information), type lilo -v at the command prompt and press Enter. You should
    get a result similar to the following:


    > LILO version 21. Copyright 1992-1998

    Werner Almesberger


    Reading boot sector from /dev/sda

    Merging with /boot/boot.b

    Boot image: /boot/mlinuz-2.2.14-5.0

    Added linux *

    /boot/boot.0300 exists - no backup copy made.

    Writing boot sector.


    If you get something similar to this with no errors, then reboot the machine and
    press Enter if it comes up right time. Make sure to remove the floppy disk from
    the drive so it has to use the MBR on the hard drive.


    If you get errors, you may need to edit your LILO configuration file. To do so,
    you must be familiar with how it works. The file /etc/lilo.conf is broken into
    two parts: global and local. The global section contains the items that apply
    to everything. An example may be:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    message=/boot/message

    linear

    default=linux

    ```'
