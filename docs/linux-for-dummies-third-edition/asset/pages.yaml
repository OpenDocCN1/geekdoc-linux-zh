  md: '# Chapter 16: Tuning and Optimizing Linux


    # Spreading swap space across multiple drives


    You can spread your swap space across different drives (if you have multiple drives,
    of course). This methodology may help to improve performance, especially on older
    hardware and IDE-based systems. Instead of tying up one channel for swapping,
    you can spread the load across different drives on different channels. You may
    also want to consider setting aside one disk channel for swapping and leaving
    the other for file system access.


    The most efficient use of swap space is to use partitions on drives that aren''t
    occupied with a lot of other disk-intensive tasks, and to spread swap space across
    multiple fast drives with multiple drive heads.


    # Creating a swap partition


