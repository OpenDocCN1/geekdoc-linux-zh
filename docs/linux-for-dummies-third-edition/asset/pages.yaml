  md: '# 172 Part III: Getting Up to Speed with Linux


    ![](img/4e9f259b21147d1fb7569159ef49ec31_199_0.png)


    See the left-facing arrow at the end of the icon panel''s left side and the right-facing
    arrow at the end of its right side? You can use these to minimize the Panel. Give
    it a try!


    # Playing with desktop icons


    What you see on your desktop (the main GNOME screen) may be very different from
    distribution to distribution. In the case of Red Hat Linux''s setup, a vertical
    row of icons line the left side of the screen. The first two (refer to Figure
    10-1) are GNOME GNU Midnight Commander (GMC). The home icon opens the GMC with
    your home directory''s contents displayed, while the trash icon opens ~/.gnome-desktop/Trash.
    A trash can be a welcome to those who accidentally delete files in Linux and find
    that they can''t recover them!


    ![](img/4e9f259b21147d1fb7569159ef49ec31_199_1.png)


    Use the trash can, drag any files you want to delete into it. Later, if you are
    sure you want to be rid of them, delete them manually from ~/.gnome-desktop/Trash.


    The next two icons (refer to Figure 10-1) are the Red Hat-specific ones. The first
    is a shortcut to a Web page within the Red Hat Web site. The other enables you
    to register for support. Double-clicking one of these links opens Netscape and
    (in order, from top to bottom) the following:


    +   - Red Hat''s main home page, www.redhat.com/. If you want to look at something
    on the Red Hat site and aren''t sure where it is, here to start.

    - Red Hat''s Network registration tool. Takes down user-support information and
    what RPM packages you installed so it can notify you about updates.


    # Checking Out GNOME Tips and Tricks


    > "Change is inevitable, except from a vending machine." — Anonymous


    The GNOME desktop environment has an amazing set of features for you to explore,
    including lots of ways to change the GUI''s look and feel. We tried to group the
    types of changes into related topics for your easy perusal. If you want to get
    more into the fun of customizing the actual look and feel of GNOME, see Chapter
    15. What do we cover here is more practical.'
  merge: -1
