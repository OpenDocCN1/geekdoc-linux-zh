    # My Screen Goes Blank! What Can I Do?


    The first thing you must do is relax and take a deep breath. Things are running
    normally, even if you don''t like what normal means. Fortunately, this situation
    — usually reflects a screen blanker kicking in or Advanced Power Management (APM)
    turning off your PC''s monitor — is easy to fix.


    If you''re running a screen saver program, you may want to turn it off. In text
    mode, the Linux kernel automatically turns on a screen saver unless you enter
    the following command at the command prompt:


    ```

    Setter -powersave off -blank 0

    ```


    On the other hand, if you notice that your hard disks and other drives have spun
    down, APM may be kicking in and disabling your monitor. You can disable APM by
    logging in to your system as root, typing nsys at the command prompt, and deselecting
    APM when the utility opens. When you exit the utility, reboot the system, because
    APM runs deep in the kernel and can''t turn off without a restart.


    Of course, if you''re running some kind of third-party screen saver program, all
    you need to do is turn it off or lengthen its blank-out interval. Because we don''t
    know which one you''re using, we can''t tell you how to change its behavior. We
    resort to an old standby to tell you what to do: RTFM (Read The Fabulous Manual,
    or help file, or whatever). Good luck!'
