  md: '# 358 Part VI: Appendixices


    vi: A popular text-based editor. Documents are edited in vi in one of three modes
    — command, insert, and ex.


    Web site: A group of Web pages, either in a simple or complex arrangement, for
    a particular individual, company, or organization on the Internet. A Web site
