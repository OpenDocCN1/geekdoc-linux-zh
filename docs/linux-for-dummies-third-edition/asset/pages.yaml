  md: '# Knowing Where the Good Stuff Lives


    Even though the configuration file formats are very different from one another,
    they usually hang out in the same directory or at least in the same branch of
    the directory tree. The location of a configuration file depends on the intended
    purpose of the subsystem. Following are the most common locations of configuration
    files, in context with their use.


    +   - /etc (System or host specific): The configuration files kept here are global
    to the functioning of the host. For example, the `passwd` file that contains all
    the system user information is kept here. Other important subdirectories are under
    `/etc` as well. For example, the `/etc/X11` directory contains X configuration
    files and `/etc/rc` files define how to perform system startup and shutdown procedures.
    We cover those in detail in the “Pop the Hood and Take a Look Inside” later in
    this chapter.


    +   - /usr/etc (application-specific): Just as the `/etc` directory contains the
    configuration files for a specific host, the `/usr/etc` directory contains configuration
    files for `nonsystem`-specific applications. The reason for this may not be clear
    until you apply it to a distributed system over a network. Consider the example
    of a shared host where many network users require the same application. Rather
    than install the application on each workstation, duplicating effort and creating
    a maintenance nightmare for the system administrator, she can install it to one
    server and allow everyone on the network to access it. This simplifies and configuration
    as the system administrator now needs to manage with only one machine for configuration
    and upgrading of the package.


    +   - ~ (user specific): The user’s home directory also contains a number of configuration
    files. These files define the behavior of applications and system services that
    the user has control over.


    There may be more than one configuration file for the same service. A service
    may require a different configuration for a system level versus a user level.
    One example is when a bash shell session begins with a user logging in to the
    system — two levels of configuration occur:


    +   - First, the `/etc/profile` file is read and interpreted.

    - Then, the `/.bash_profile` file is read to provide specific configuration options
    that the user may have included.


    You may be asking yourself what the named directory /etc has to do with anything.
    After all, isn’t /configuration more descriptive of what’s kept there? Before
    you start writing your own Linux distribution with just this type of naming scheme,
    please read the “Everyone joins hands” sidebar nearby for a brief explanation
    of the Filesystem Hierarchy Standard.'
