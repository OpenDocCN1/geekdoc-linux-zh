  md: '# 158 Part III: Getting Up to Speed with Linux


    # Copying files


    You may think that it''s hard to drag and drop when just clicking an item opens
    it. You can, however, still use this feature! Just make sure not to click and
    release the item that you want to move. You have to click it and hold the mouse
    button down as you drag the item.


    For copying and pasting without using drag and drop, do the following:


    +   Right-click the item and choose Copy from the pop-up menu that appears.


    Your computer copies the item to its memory.


    +   Navigate to where you want to put the copy.


    +   Right-click in the destination directory and choose Paste from the pop-up
    menu that appears.


    Your computer copies the file to this location.


    # Moving and deleting files


    Unfortunately, things aren''t always as straightforward as you like them. Moving
    a file requires a slightly stranger method:


    +   Click the item and drag it an inch or two and then release it.


    A pop-up menu appears.


    +   Choose Move from the pop-up menu.


    You get an odd dialog box, as shown in Figure 9-5.


    +   Change the path and/or filename to suit your needs.


    Leave the part before the colon in place. For example, you may see the following:


    ```

