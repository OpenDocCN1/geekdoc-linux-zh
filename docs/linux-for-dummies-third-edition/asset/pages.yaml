    contrast, look at the steps you''re traditionally required to perform for system
    configuration:


    +   1. Find the configuration file responsible for directing the intended service.

    2. Edit the file, conforming to the exact syntax required by the service.

    3. Load or reload the service into memory. Even if the process is already running,
    you may be required to restart the service in order for the updated configuration
    file to be read.


    LinuxConf was created to be a single portal for all things configurable in Linux.
    As you may know, the dynamic nature of Linux and the plethora of services and
    configuration formats required to run your system this impossible. While a worthy
