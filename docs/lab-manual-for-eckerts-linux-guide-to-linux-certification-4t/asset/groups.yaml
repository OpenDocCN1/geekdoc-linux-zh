    ## Lab 9.2 Customizing Output


    ## Objectives


    The goal of this lab is to learn how to use the ps command to customize process
    display formats. Standard display formats are designed for general use and usually
    show more information than needed, but you can use command-line options to modify
    what information is displayed.


    ## Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    ## Activity


    1. If necessary, start your Linux computer, switch to a command-terminal, and
    log in to the terminal as User1.


    2. Type `ps -e l` and press Enter. The -e option displays all processes. The output
    has four columns: PID, TTY, TIME, and CMD. The first few lines of output look
    similar to the following:


    | PID | TTY | TIME | CMD |

    |---|---|---|---|

    | 1 | ? | 00:00:04 | systemd |

    | 2 | ? | 00:00:02 | kthreadread |

    | 3 | ? | 00:00:00 | ksoftirqd/0 |


    If you see a -- prompt at the bottom, press q to get back to the command prompt.


    3. Type `ps ax l` and press Enter. The option displays all processes started by
    a terminal (tty), and the x option displays all processes not started by a terminal.
    Using these two options is the logical equivalent of the -e option. This display
    has columns: PID, TTY, STAT, TIME, and COMMAND. There are also subtle differences
    in how data is displayed; for example, child processes are shown in brackets and
    the STAT column shows the status of the process. The S in the status column means
    the process is in the interruptible sleep state. The first few lines of output
    look similar to the:


    | PID | TTY | STAT | TIME | COMMAND |

    |---|---|---|---|---|

    | 1 | ? | S | 00:04 | /usr/lib/systemd/systemd |

    | 2 | ? | S | 00:02 | [kthreadread] |

    | 3 | ? | S | 00:00 | [ksoftirqd/0] |


    If you see a -- prompt at the bottom, press q to get back to the command prompt.


    4. To see more options for changing the format, type `ps -ef | more` and press
    Enter. The -ef option displays all processes in a listing format, as you can see
    in this example:


    | UID | PPID | C | STIME | TTY | CMD |

    |---|---|---|---|---|---|

    | root | 1 | 0 | 0Oct | ? | 00:00:04 | /usr/lib/systemd/systemd |

    | root | 2 | 1 | 0Oct | ? | 00:00:02 | [kthreadadd] |

    | root | 3 | 0 | 0Oct | ? | 00:00:00 | [ksoftirqd/0] |


    If you see the --More-- prompt at the bottom, press q to go back to the command
    prompt.


    5. Try the following formats and notice how each one is displayed:


    - -f—Full listing

    - -j—Jobs format

    - -j—Job control format

    - -l—Long listing

    - -s—Signal format

    - -v—Virtual memory format

    - -X—i386 register format (use only with an Intel processor-based system)


    6. The -o option is for a user-defined format. Type `ps -eo pid,cmd` and press
    Enter to specify only the PID and CMD columns, as in example:


    | PID | CMD |

    |---|---|

    | 1 | /sbin/init |

    | 2 | [kthreadadd] |

    | 3 | [migration/0] |


    You must have a space after the -o option and no spaces after the commas. If you
    see the --More-- prompt at the bottom, press q to go back to the command prompt.


    7. Type `ps -eo pid,ppid,mem` to add PPID and %MEM columns to the display (A PPID
    is the process ID of a parent process, as learned in Lab 9.1). The %mem option
    displays the percentage of system memory a process uses. Processes that use only
    a tiny portion of memory are displayed as 0.0, as shown in this example:


    | PID | PPID | %MEM | CMD |

    |---|---|---|---|

    | 1 | 0 | 0.1 | /usr/lib/systemd/systemd |

    | 2 | 0 | 0.0 | [kthreadadd] |

    | 3 | 2 | 0.0 | [ksoftirqd/0] |


    ## Chapter 9 Managing Linux Processes


    Processes with PPID of 0 have been started by the OS. Processes with PPID of 1
    have been started by init. Linux refers to these processes as core services. If
    you plan to continue to the next lab, press Ctrl+Alt+F1 to return to the graphical
    screen; otherwise, shut down the computer.


    ## Review Questions


    1. Which command displays all processes?

    a. ps

    b. ps a

    c. ps x

    d. ps -e


    2. Which command is equivalent to ps -e in terms of what processes are displayed?

    a. ps

    b. ps ax

    c. ps -l

    d. ps a


    3. Which command displays a user-defined format?

    a. ps --pid,cmd

    b. ps --options pid,cmd

    c. ps -o pid,cmd

    d. ps -o pid,cmd


    4. Which command displays the status of a process?

    a. ps

    b. ps ax

    c. ps -l

    d. ps -e


    5. Which of these options should you use with user-defined format to display the
    command that started the process?

    a. com

    b. ppid

    c. cmd

    d. %mem


    ## Lab 9.3 Writing a Shell Script with an Infinite Loop


    ## Objectives


    In this lab, you write a script that creates an infinite loop. You use this script
    in subsequent labs.


    ## Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 10 minutes


    ## Activity


    1. Start Linux, if necessary, and log in to the GUI as User1.


    2. Open a terminal window. To start the text editor, type `gedit loop` and press
    Enter. In gedit, type the following, pressing `Enter` after each line:


    ```bash

    #!/bin/bash

    while :

    x=1

    done

    ```


    3. Click Save, and then close gedit. The first line specifies that the file is
    a BASH script. The second line starts a while loop that''s infinite because of
    the : at the end. The do and done lines make up the body of the loop. The x=1
    statement just gives the loop something to do; you can''t have a loop with no
    statements in it.


    4. To set the executable permission for the script, type `chmod 555 loop` at the
    terminal prompt and press Enter.


    5. To test the script, type `./loop &` and press Enter (*Tip*: You precede the
    filename with ./ to specify loading the script from the current directory). This
    runs the script in the background and you can see the process ID generated for
    it: 8630


    6. Type `ps ax | grep 8630` and press Enter. You see that the process name is
    bash since the bash shell runs the loop script.


    7. Stop the loop by typing `kill 8630` and press Enter (replacing 8630 with the
    process ID shown in step 5).


    8. You see the message "[1]+ Terminated loop". Close all terminal windows, but
    stay logged in for the next lab.


    ## Review Questions


    1. After you create a script, what must you do before you can run it?

    a. Compile it with gcc.

    b. Set the executable permission.

    c. Move the file to the /bin directory.

    d. Do nothing; the script is ready to run.


    2. If you want to start an infinite loop in the BASH shell, which command do you
    use?

    a. while :

    b. do until ;

    c. do forever

    d. while [ [ ]


    3. If you want to see information about a process named myproc which command can
    you use?

    a. ps | find myproc

    b. grep myproc | ps -e

    c. ps -e | locate myproc

    d. ps ax | grep myproc


    4. Which command do you use to run a script named myscript in your current directory?

    a. run myscript

    b. ..myscript

    c. ./myscript

    d. myscript


    5. When you run a process in the background using the & symbol at the end of the
    command, it displays the process ID. True or False?


