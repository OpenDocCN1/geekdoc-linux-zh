- md: "\n# Chapter 3 Exploring Linux File Systems\n\n5. Which option do you use with\
    \ od to specify that you want decimal offsets?\n\n- a. -A d\n- b. -a x\n- c. -t\
    \ u\n- d. -t o\n\n## 3.5 Working with Unusual File and Directory Names\n\n###\
    \ Objectives\n\nThe goal of this lab is to see how Linux file systems enable you\
    \ to use almost any file and directory names you like and use any special characters\
    \ in names.\n\n## Materials Required\n\nThis lab requires the following:\n\n-\
    \ A computer running Fedora 20 Linux\n\nEstimated completion time: 20 minutes\n\
    \n## Activity Background\n\nIf you career started with DOS or early Windows versions,\
    \ you might remember severe restrictions on file and directory names. DOS restricted\
    \ file and directory names to eight characters with an optional extension of up\
    \ to three characters. Early Windows versions had the same restriction, but Windows\
    \ 95 changed it that names could be up to 256 characters, but there were limitations\
    \ on the types of characters that were allowed.\n\nLater Windows versions reduced\
    \ the limitations, but some still remain. You can create names with any characters\
    \ you like. You just need to realize that some characters might conflict with\
    \ your system's shell. Although conflicts can result, Linux usually has a way\
    \ to work around them.\n\n## Activity\n\n1. Switch to a command-line terminal\
    \ (tty2) by pressing Ctrl+Alt+F2, and log in to the terminal with your username.\n\
    \n2. To change the shell prompt so you can see your current directory easily,\
    \ type PS1=\"\\w\" and press Enter. The prompt now shows the current working directory.\n\
    \n3. Chances are good that the current directory is your home directory. If so,\
    \ the command prompt should be ~. If it's not, go to your home directory by typing\
    \ cd ~ or cd and pressing Enter.\n\n4. The tilde (-) represents your home directory.\
    \ If you want to see the actual directory, type pwd and press Enter. If you are\
    \ logged in root, your home directory is most likely /root, although it could\
    \ be different depending on how the administrator set up the system.\n\n5. Create\
    \ a directory called test below your home directory by typing mkdir test and pressing\
    \ Enter. Make it the current directory by typing cd ~/test and pressing Enter.\
    \ The command prompt is now ~/\n\n6. Linux includes the touch command for creating\
    \ a file with no contents and easily. Type touch abc and press Enter, and then\
    \ type ls and press Enter. You should see the abc file listed.\n\n7. Type touch\
    \ ABC and press Enter, and then type ls and press Enter. You should see both the\
    \ abc and ABC files listed. Linux distinguishes between character case, so the\
    \ abc and ABC files are considered two different files.\n\n8. To use touch to\
    \ create a very long filename, touch thisisaverylongfilename-notmorethan256characters.\
    \ Type ls and press Enter. (Note: The name must be no longer than 256 characters.)\
    \ Type ls and press Enter to see how the name is displayed. ls -l and press Enter\
    \ to see the file displays.\n\n9. To delete a file, take advantage of the BASH\
    \ completion instead of typing the entire file. To do this, use rm this and press\
    \ Tab. The command line should show the entire filename. Press Enter, and then\
    \ press y and Enter to confirm the deletion. Confirm that the file has been deleted\
    \ by typing ls and pressing Enter.\n\n10. Linux, like DOS and Windows, uses a\
    \ name consisting of a single period (.) to represent the current directory. A\
    \ name consisting of two periods (..) represents the parent directory. To see\
    \ these directories listed, type ls -a and press Enter.\n\n11. Type . . (that's\
    \ three periods) and press Enter. ls -a and press Enter. You see the . . name\
    \ in the listing. To verify that it's a file, not a directory, type ls -al and\
    \ press Enter. Notice that the . . entry does not start with a d (which stands\
    \ for \"directory\")\n\n12. Unusual names, such as . . . , aren't limited to files.\
    \ Type mkdir . . . and press ls -al and press Enter to see that you've created\
    \ a directory. The entry looks like this:\n\n```\ndrwx-xr-x 2 users 4096 Jan 24\
    \ 15:31 . . .\n```\n\n13. Make .... your current directory by typing cd .. and\
    \ pressing Enter, and then notice the command prompt.\n\n14. Filenames beginning\
    \ with a hyphen, such as -n, are allowed but can cause problems many commands\
    \ assume the character is a command-line option. If, for example, you try to touch\
    \ to create a file named -n, you get the following error message:\n\n```\ntouch:\
    \ invalid option -- n\ntouch --help' for more information.\n```\n\nTo work around\
    \ this problem, you need to precede the filename with -- (two dashes), which tells\
    \ touch no more command-line options follow the --. Type touch --n and press Enter,\
    \ and then type ls -l and press Enter. The following is displayed to:\n\n```\n\
    -rw-r--r-- 1 ed users 0 Jan 24 15:31 -n\n```\n\n15. If you want to edit the file\
    \ with the vi editor, you have a problem if you type vi -n because vi -n is an\
    \ option indicating not to use a swap file of a filename. The solution is using\
    \ the -- option so that vi interprets -n as a filename. Type vi --n and press\
    \ Enter to verify you can edit the file named -n. Press :q and type Enter to quit\
    \ vi.\n\n16. If you want to remove the -n file, you have to use the -- trick again.\
    \ Type rm -- -n and press Enter, then press y to confirm the deletion. Next, type\
    \ ls -al and press Enter to see that the file has been removed.\n\n17. Type logout\
    \ and press Enter to log out of the system, and press Ctrl+Alt+F1 to go back to\
    \ the graphical screen.\n\n## Review Questions\n\n1. Which of the following commands\
    \ changes the shell prompt to show the current directory?\n  a. prompt $p$\n \
    \ b. PROMPT=\\w$\n  c. PS1=\"\\w$\"\n  d. echo $PS1\n\n2. Which of the following\
    \ commands brings you to your home directory? (Choose all that apply.)\n  a. cd\n\
    \  b. cd -\n  c. cd ~\n\n3. Which of the following commands creates a file of\
    \ zero length?\n  a. cat >> filename\n  b. touch filename\n  c. ls -c filename\n\
    \  d. md filename\n\n4. You can't have files abc and ABC in the same directory.\
    \ True or False\n\n5. Which of the following commands removes a file called?\n\
    \  a. rm\n  b. touch\n  c. ls\n  d. md\n\n## Lab 3.5 Working with Unusual File\
    \ and Directory Names 33\n\n# LINUX FILESYSTEM MANAGEMENT\n\nLabs included in\
    \ this chapter\n\n- 4.1 Exploring the Filesystem Hierarchy\n- 4.2 Working with\
    \ Aliases\n- 4.3 Using Advanced Options\n- 4.4 Working with File and Directory\
    \ Permissions\n- 4.5 Using Advanced Features\n\n# CompTIA Linux+ Exam Objectives\n\
    \n| Objective | Lab |\n| :--- | :--- |\n| 103.1 | Work on the command line 4.2-4.5\
    \ |\n| 103.3 | Perform basic file management 4.3-4.5 |\n| 104.7 | Find system\
    \ files and place in correct location 4.1,4.4 |\n| 105.1 | Customize and use the\
    \ shell environment 4.2 |\n\n## Lab 4.1 Exploring the Filesystem Standard\n\n\
    ### Objectives\n\nThe goal of this lab is to learn about the Filesystem Standard\
    \ (FHS) by exploring the FHS site. When you understand FHS, you know where files\
    \ should be placed in the system.\n\n## Materials Required\n\nThis lab requires\
    \ the following:\n\n- A computer running Fedora 20 Linux\n\nEstimated completion\
    \ time: 30 minutes\n\n## Activity\n\n1. Log in to your Linux computer as an ordinary\
    \ user.\n2. Start a Web browser, and go to www.pathname.com/fhs/.\n3. Click the\
    \ FHS 2.3 HTML link, and then examine the Table of Contents.\n4. Click the *The\
    \ Filesystem* link and read the “Chapter 2. The Filesystem.” It explains that\
    \ the FHS applies to any file system supporting the basic security features in\
    \ most UNIX file systems. These file systems include Linux but not non- such as\
    \ Windows. You also learn that files are placed in four categories: shareable,\
    \ unshareable, variable, and static. Press PageUp or Home to return to the Table\
    \ of Contents.\n5. Click the *Purpose* link under the “Root Filesystem.” Note\
    \ the caution that “Applications must never create or require special files or\
    \ subdirectories in the root directory” and the reasons for this caution. Users\
    \ shouldn’t do this, either, but if permissions are set up correctly, the only\
    \ user capable of doing so is the root user.\n6. Go back to the Table of Contents.\
    \ Click the */bin : Essential user binaries (for use by all users)* link, and\
    \ read the “Purpose” section. The /bin directory is required so that the system\
    \ can run and be administered at a basic level, even when no other file systems\
    \ are mounted. This also tells you the files that must be in this directory.\n\
    7. Go back to the Table of Contents. Click the */etc : Host-specific system configuration*/,\
    \ and read the “Purpose” and “Requirements” sections. The /etc directory and subdirectories\
    \ contain files for configuring the system, daemon, and applications. Executable\
    \ programs (binaries) can be stored in this directory structure, according to\
    \ FHS.\n8. Read the “Specific Options” section, which states that certain subdirectories\
    \ must exist but only “if the corresponding subsystem is installed.” The best\
    \ example is the X11 subdirectory, which must exist only if you’re running the\
    \ X Window system (the graphics system). If your Linux computer is running as\
    \ a server and has no graphical system installed, the X11 subdirectory isn't needed.\
    \ Some Linux distributions install it anyway.\n"
  mdcn: "\n\n# 第 3 章 探索 Linux 文件系统\n\n5. 使用 od 命令时，使用哪个选项来指定要使用十进制偏移量？\n\n- a. -A\
    \ d\n- b. -a x\n- c. -t u\n- d. -t o\n\n## 3.5 处理异常的文件和目录名称\n\n### 目标\n\n本实验的目标是了解\
    \ Linux 文件系统如何允许你使用几乎任何喜欢的运行和目录名称，并使用任何特殊字符。\n\n## 所需材料\n\n本实验需要以下设备：\n\n- 一台运行\
    \ Fedora 20 Linux 的计算机\n\n预计完成时间：20 分钟\n\n## 活动背景\n\n如果你的职业生涯始于 DOS 或早期 Windows\
    \ 版本，你可能记得文件和目录名称的严格限制。DOS 将文件和目录名称限制为八个字符，带有最多三个字符的可选扩展。早期 Windows 版本也有同样的限制，但\
    \ Windows 95 改变了这一点，允许名称最多 256 个字符，但对允许的字符类型有限制。\n\n后续 Windows 版本减少了这些限制，但仍然存在一些。你可以使用任何喜欢的字符创建名称。你只需要意识到某些字符可能会与系统的\
    \ shell（外壳程序）冲突。虽然可能会导致冲突，但 Linux 通常有方法绕过它们。\n\n## 活动\n\n1. 按 Ctrl+Alt+F2 切换到命令行终端\
    \ (tty2)，并用你的用户名登录终端。\n\n2. 更改 shell 提示符以便方便查看当前目录，输入 `PS1=\"\\w\"` 并按回车。现在的提示符会显示当前工作目录。\n\
    \n3. 很有可能当前目录就是你的家目录。如果是，命令提示符应为 `~`。如果不是，请输入 `cd ~` 或 `cd` 并按回车进入你的家目录。\n\n4.\
    \ 波浪号 (-) 代表你的家目录。如果你想查看实际目录，输入 `pwd` 并按回车。如果你以 root 身份登录，你的家目录很可能是 /root，尽管这取决于管理员如何设置系统。\n\
    \n5. 输入 `mkdir test` 并按回车，在你的家目录下创建一个名为 `test` 的目录。输入 `cd ~/test` 并按回车进入该目录。命令提示符现在显示为\
    \ `~/`。\n\n6. Linux 包含 `touch` 命令，用于方便地创建空文件。输入 `touch abc` 并按回车，然后输入 `ls` 并按回车。你应该能看到列出的\
    \ abc 文件。\n\n7. 输入 `touch ABC` 并按回车，然后输入 `ls` 并按回车。你应该能看到 `abc` 和 `ABC` 文件。Linux\
    \ 区分大小写，因此 `abc` 和 `ABC` 文件被视为两个不同的文件。\n\n8. 使用 `touch` 创建一个非常长的文件名：`touch thisisaverylongfilename-notmorethan256characters`。输入\
    \ `ls` 并按回车。（注意：名称不能超过 256 个字符）。输入 `ls` 并按回车查看名称如何显示。输入 `ls -l` 并按回车查看文件显示信息。\n\
    \n9. 要删除文件，利用 BASH 自动补全功能而不是输入整个文件名。为了这一点，使用 `rm this` 并按 Tab 键。命令行应该显示整个文件名。按回车，然后按\
    \ `y` 并按回车确认删除。输入 `ls` 并按回车确认文件已删除。\n\n10. Linux 与 DOS 和 Windows 一样，使用由单个点 (.)\
    \ 组成的名称表示当前目录。由两个点 (..) 组成的名称表示父目录。要查看这些目录，输入 `ls -a` 并按回车。\n\n11. 输入 `. .`（三个点）并按回车。输入\
    \ `ls -a` 并按回车。你在列表中看到了 `. .` 名称。要验证它是一个文件而不是目录，输入 `ls -al` 并按回车。注意 `. .` 条目不以\
