    \n12. 返回目录。点击 [/tmp : 临时文件](#) 链接，并阅读此短章节。最重要的概念是，放置在此目录中的任何文件预计不会在系统关闭和启动后保留。然而，如何处理这个问题是一个本地问题。某些\
    \ Linux 发行版在启动时会删除 `/tmp` 目录中的所有文件，而某些则不会。\n\n13. 退出浏览器，如果继续进行下一个实验，请保持登录；否则，关闭计算机。\n\
