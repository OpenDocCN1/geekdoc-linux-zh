    # ## 11.3 Installing and Removing Packages


    # Objectives


    Most Linux distributions use the Red Hat Package Manager (RPM) to install and
    uninstall software. You will use rpm to perform basic queries on installed packages
    and then use yum to install and perform other package management tasks. The yum
    program works with rpm packages and uses repositories on the Internet. In this
    lab, you learn how to do the following:


    +   - Display all installed packages

    - Install packages using yum

    - View configured package repositories

    - Uninstall packages


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - Fedora 20 installation DVD


    Estimated completion time: 15 minutes


    # ## Activity


    +   1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2**, and
    log in as the root user.


    +   2. To see a list of all packages installed on your computer, type **rpm -qa**
    and press **Enter**. Notice that they''re not listed in alphabetical order. To
    sort them alphabetically and display a page at a time, type **rpm -qa | sort |
    more** and press **Enter**. When you''re finished reviewing the list, press **q**
    to quit more. To see whether a package named cracklib is installed, type **rpm
    -qa | grep cracklib** and press **Enter**. If it is installed, you will see a
    couple of lines of output using the string `cracklib`. Use the same method to
    check for a package named rdesktop. You shouldn''t see any output because the
    package isn''t installed.


    +   3. Type **yum q x*** and press **Enter**. You see all installed packages that
    begin with x. Next, you''ll use yum which also works with rpm packages.


    +   4. Type **yum search rdesktop** and press **Enter**. You see output that lists
    the name of the package and a description of the package.


    +   5. Type **yum list rdesktop** and press **Enter** to see version detailed
    information about the package. In the listing, look for the line that starts with
    Repo: This is the repository in which rdesktop package can be found.


    +   6. To see a list of repositories used by yum to find packages, type **yum
    repolist** and press **Enter**. This shows basic information about the repositories
    used by yum.'
  - '[PAGE 130]


    8. For more detailed repository information, type yum repoinfo and press Enter.
    You see detailed information about the repositories including the URL used to
    access each repository.


    9. To view your yum configuration file that shows the repositories, type ls /etc/yum.conf
    and press Enter. Read the last few lines of the file where you are told that you
    can add your repositories in the yum.conf file or you can create files with the
    .repo extension that contain repository information. Type q to quit less.


    10. Type ls /etc/yum.reposd and press Enter to see the list of repos. Type cat
    /etc/yum.repos/fedora.repo and press Enter to see the one of the repo configuration
    files.


    11. Type yum-config-manager and press Enter to see the yum configuration options.
    You can use this command to configure yum options and add new repositories rather
    than editing the configuration files. For example, to add a repository, type yum-config-manager
    -add repo repositoryurl where repositoryurl is the url of the repository


    12. Install the rdesktop package by typing yum install rdesk* and press Enter.
    Press y and Enter when prompted. You can use wildcards instead of typing the entire
    name as long as there are no conflicts.


    13. To verify that the rdesktop package is installed, type yum info rdesk* and
    press Enter. You see a list of information. On the line that starts with Repo
    you will see that the package is installed.


    14. Next, uninstall the package with the remove option by typing yum remove rdesktop
    and pressing Enter. Press y and Enter to confirm.


    15. Verify that the package was uninstalled by typing whereis rdesktop and pressing
    Enter. You should see rdesktop; which means the package can''t be found.


    16. Type yum info rdesk and press Enter. Look at the line that begins with Repo:
    The line tells you that the package can be found in the updates/20/x86_64 repository
    (“x86_64”) will be “i386” if you are using the 32-bit version of Fedora 20.


    17. If you plan to continue to the next lab, stay logged in; otherwise, shut down
    the computer.


