    # Lab 7.2 Customizing the BASH History Feature


    # Objectives


    The goal of this lab is to familiarize you with ways to customize the BASH command
    history feature.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    | Estimated completion time: 20 minutes |


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and if
    necessary, log in to the terminal as User1. Don''t log in as root.

    2. To remember commands in the history after a system is shut down and restarted,
    Linux uses the .bash_history file, which is stored in your home directory. If
    necessary, go to your home directory by typing cd and pressing Enter.

    3. Look at the last lines in the .bash_history file by typing tail .bash_history.
    The last line of the file isn''t tail .bash_history, and the previous command
    isn''t cd, meaning the .bash_history file isn''t up to date.


    4. Type history and press Enter. The last line displayed is the history command,
    and the previous line is tail .bash_history. So the history command seems to be
    up to date, even though the .bash_history file is not. The reason is that the
    command is kept in system memory. In the next steps, you see when the .bash_history
    file is updated.


    5. Type echo ''This is my command'' and press Enter. Type tail .bash_history and
    press Enter. You don''t see your recent commands.


    When you use the echo command, it''s best to use single quotes rather than double
    quotes around the string. Single quotes prevent the shell from trying to interpret
    special characters.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_80_0.png)


    6. Type logout and press Enter. Log in again as User1.


    7. Type tail .bash_history and press Enter. You see the echo ''This is my command''
    near the end of the list, which means the .bash_history file was updated when
    you logged out.


    8. The .bash_history file can be quite large if you''ve used the command a lot.
    Most of it scrolls quickly, but you can use the more or less commands to prevent
    scrolling. Type history less and press Enter. You should see the oldest commands
    onscreen. Press the spacebar to see more of the file, and then exit it by pressing
    q.


    9. You can use the wc (word count) command to see exactly how many commands are
    in the .bash_history file. To have lines instead of words counted, wc -l .bash_history
    and press Enter. You see output similar to the following:


    ```

    105 .bash_history

    ```


    10. The preceding output shows that 1000 commands are stored in the history file.
    The default limit for history file is 1000. An environment variable called HISTSIZE
    is used to set this limit. To see the value of HISTSIZE on your system, set |
    grep HISTSIZE and press Enter. You should see HISTSIZE=1000


    11. If you want to change the limit to 5000 commands, you have to change the HISTSIZE
    in the startup script, .bashrc, which is stored in your home directory. The HISTSIZE
    variable is defined in this file, you can use any text editor to change the value.
    In Fedora, HISTSIZE is set to 1000 by default and isn''t set in .bashrc. However,
    if you create the variable in .bashrc, you override the default value. To create
    the variable with a value of 5000 in .bashrc without using a text editor, type
    echo ''HISTSIZE=5000'' >> .bashrc and press Enter. This new value is used the
    next time the BASH shell reads .bashrc file—typically, when you log in.


    12. Type logout and log in again as User1.


    13. Press the arrow up to see the set | grep HISTSIZE command and press Enter.
    You should see HISTSIZE=5000 displayed to indicate that the HISTSIZE has changed.


    14. Type history and press Enter five times. Each time you do this, a history
    command is added to the history. This is okay if you want the history to be a
    faithful record of every command you type, but it''s a waste of file space if
    you use the BASH history feature mainly as a way to save keystrokes. (Note that
    with Fedora 20, duplicate entries in the history file are ignored automatically,
    so you won''t see the history command repeated. If you want to see the command
    repeated, first type echo ''HISTORY-CONTROL=>>.bashrc and then log out and log
    again to repeat this step.


    +   15. You can use the HISTORY_CONTROL variable to control which commands are
    saved. For example, you can set it to ignore duplicate commands or commands that
    start with a space. To do this, type echo ''HISTORY_CONTROL=ignoredups'' >> .bashrc
    and press Enter.


    16. Type logout and log in again as User1.


    17. Press the arrow up to see the set | grep HISTORY_CONTROL command and press
    Enter. You should see HISTORY_CONTROL=ignoredups displayed to indicate that the
    variable has changed.


    18. Type history and press Enter several times. If you type the same command multiple
    times, it should only appear once in the history.


    19. Type logout and press Enter. Log in again as User1.


    20. Type tail .bash_history and press Enter. You should see that duplicate commands
    are no longer in the file.

