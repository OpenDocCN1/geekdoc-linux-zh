    # # Lab 4.3 Using Advanced find Options


    # ## Objectives


    The goal of this lab is to learn how to use the find command''s advanced options.
    These options are useful for system administrators who must manage a computer''s
    file system.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    | Estimated completion time: 20 minutes |


    # ## Activity


    +   1. Switch to a command-terminal (tty2) by pressing **Ctrl+Alt+F2**, and log
    in to the terminal as the root user, if necessary.


    +   2. A common administration problem is dealing with files and directories with
    owners who do not exist. This happens when users are removed from the system,
    but their files are not removed. You can use the `-nouser` option to display a
    list of these files and directories. Type `find / -nouser` and press **Enter**.


    +   3. If you''re using a Fedora installation, you probably don''t have any files
    with owners who do not exist, but you can use the `shown` command to assign an
    invalid owner to a file. Type `touch test` and press **Enter** to create a file
    in the current directory. Next, type `chown7000 test` and press **Enter** to assign
    a nonexistent user as the file owner. Type `find / -nouser` and press **Enter**,
    and you should see `/root/test` displayed. (In the preceding command, use `/`
    for the path to the system root.)


    +   4. You can also use the `shown` command to fix any files that aren''t owned
    by a valid user. Type `own nobody test` and press **Enter**. The user is now the
    file owner. The user nobody is a user created by Linux for the purpose of assigning
    temporary owner-ship to files that have no current owner. Type `find / -nouser`
    and press **Enter**, and notice that the file is listed.


    +   5. An administrator might want to know which files on the system are set to
    the SUID permission. You can use the `-perm` option to list these files, but you
    need to specify the SUID permission correctly. For example, use numeric representation
    for this permission (4000), type `find / -perm 4000` and press **Enter**. No files
    were found in all likelihood. However another permission setting: type `find /
    -perm 600` and press **Enter**. You see a list of permissions with nobody


    +   6. You can use the `-size` option to display all files larger than a specified
    value. For larger files, you can specify “M” for megabytes and “G” for gigabytes.
    For example, to list all files on your system larger than 5 MB, type `find -size
    5M` and press **Enter**. For smaller files, you can use “c” for bytes and “k”
    for kilobytes.


    +   7. Until now, you''ve been searching the entire file system, but you can search
