    \n```\n\n- 8. The PRUNE lines specify file systems that updatedb doesn't scan.\
    \ You can specify other directories that updatedb doesn't scan. You can exclude\
    \ directories by editing the /etc/updatedb.conf file or using the -e option in\
    \ the updatedb command, as explained in Step 6. Type locate sample99 and press\
    \ Enter. The sample99 file should be listed.\n\n- 9. Log in as an ordinary user\
    \ with the su command. For example, your user account is user1, type su user and\
    \ press Enter.\n\n- 10. To find the sample99 file by typing locate sample99 and\
    \ pressing Enter. The file shouldn't be found because you're logged in as an ordinary\
