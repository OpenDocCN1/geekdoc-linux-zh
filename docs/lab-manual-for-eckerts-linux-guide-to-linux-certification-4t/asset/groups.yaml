    -rw--r--r---- 1 root 9136 Aug 6 test-gray.jpeg\n-rw--r--r---- 1 root 11394 Aug\
    \ 6 test.jpeg\n```\n\n- 10. Close all windows. If you plan to continue to the\
    \ next lab, stay logged in; otherwise, shut down the computer.\n\n## Review Questions\n\
    \n- 1. Which command tells you whether a file with the .bmp extension is really\
