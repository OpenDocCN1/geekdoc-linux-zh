    # Lab 1.4 Seeing How Linux and Windows Can Be Integrated


    # Objectives


    The goal of this lab is to help you become aware of the many ways Linux and Windows
    computers can be integrated.


    # Materials Required


    This lab requires the following:


    +   * An Internet connection


    +   * A Web browser


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_19_0.png)


    # Activity


    1. Start your Web browser. Type http://www.samba.org link in the address bar and
    press Enter.


    2. On the Samba home page, click the think Samba and then click The Official Samba
    HOWTO link. Review some of the documentation. (Samba is one of the best open-source
    software projects.) You''ll find that when you run Samba on your Linux computer,
    it becomes a file and print server compatible with Windows computers.


    3. Type http://www.winehq.org in the address bar and press Enter to get to the
    Web site for Wine, which allows running Windows programs on a Linux computer.


    4. Click the About link to get to the About Web page, which states that the first
    stable release of Wine was in 2008, and it''s still under active development.
    It has been for many years, and its status is not likely to change soon. However,
    many people use Wine with various levels of success.


    5. Under "Open Source and User Driven," click the Application Database link. This
    page tells you which Windows applications work in a Wine environment and which
    don''t.


    6. Type http://www.vmware.com in the address bar and press Enter to get the site
    for VMware, a commercial product that enables you to run Windows programs on a
    Linux computer or versa. VMware''s approach is different from Wine''s. It requires
    installing Windows OS on a virtual machine running on your Linux computer. (The
    site explains the concept of a virtual machine.) When you run Windows programs
    on a virtual machine, they''re actually running in Windows and therefore, run
    correctly. VMware is one of the best ways to run Windows applications on a Linux
    computer.


    7. Type http://www.rd..org in the address bar and press Enter to get to the Web
    site for rdesktop, a Windows Terminal client for Linux. Using rdesktop, you can'
  - '[PAGE 20]


    Windows programs on your Windows Terminal Server machine have Linux operate your
    screen, keyboard, and mouse. Your Windows programs are running on a Windows client,
    and you''re using a Linux computer.


    8. If you''re continuing to the next lab, leave your Web browser open; otherwise,
    close it.


    All the Windows-Linux integration solutions you''ve seen in this lab can be used
    separately or in combination. There are many ways to introduce open-source software
    and Linux into your company without sacrificing Windows features. With these integration
    solutions, you can run newer Linux applications on the same computers and networks
    that are running Windows applications.


    # Review Questions


    +   1. On which of the following operating systems would you *not* expect to find
    Samba running? (Choose all that apply.)


    +   a. Linux


    +   b. FreeBSD


    +   c. Windows


    +   d. NetWare


    +   2. A Samba server is what kind of server?


    +   a. SMTP server


    +   b. File and print server


    +   c. Application server


    +   d. DNS server


    +   3. Using Samba, a Linux computer can access files on a Windows computer. True
    or False?


    +   4. Wine requires installing a Windows OS on your Linux computer. True or False?


    +   5. The rdesktop program allows you to run a Windows application on a Windows
    Server client but use your Linux computer''s screen, keyboard, and mouse. True
    or False?


    # Lab 1.5 Investigating Linux Security


    # Objectives


    The goal of this lab is to show you why open-source software, including Linux,
    can sometimes be more secure than other operating systems.


    # Materials Required


    This lab requires the following:


    +   - An Internet connection


    +   - A Web browser


    Estimated completion time: 30 minutes'
  - '[PAGE 21]


    # Activity


    +   1. Start your Web browser.


    +   2. Type http://www.linuxsecurity.com in the address bar and press Enter to
    see a Web page on Linux security matters. The page changes frequently, feel free
    to explore Notice that you''re cautioned about potential security holes in software,
    want to use secure protocols (such as SSH) instead of unsecured ones (such as
    Telnet), and so forth.

    The emphasis is on how to avoid security problems and attacks. Linux software
    updates and patches are usually available before Web sites are attacked, unlike
    typical situation with commercial software (with updates and patches becoming
    available only after sites are attached).


    +   3. Click the HOWTos near the top. Click the Secure firewall link to go to
    a list of articles and Web sites on Linux firewalls. The Linux OS has a built-in
    firewall. You just need to configure it—and that can be challenging if you don''t
    understand protocols as IP, TCP, and UDP. The resources on this page help you
    configure the firewall by giving you instructions or supplying software (as scripts)
    that makes it easier.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_21_0.png)


    +   4. Type http://www.ietf.org/rfc/rfc2137.txt in the address bar and press Enter.
    You are looking at a Request for Comment (RFC), published by the Internet Engineering
    Task Force (IETF) to describe an Internet Standard. (The IETF is the caretaker
    of the Internet, and its focus is security and protecting the Internet from attack.)
    This document''s content is detailed and technical and might be beyond your comprehension,
    but you''re focusing on how the IETF handles security concerns.


    +   5. Scroll down until you see the section “Security Considerations,” and read
    these paragraphs. Most IETF RFCs have a security section. What do IETF RFCs have
    to do with Linux? Designers of Linux and other open-source software use protocols
    and standards, as IETF RFCs, to be compatible with other software. The only designers
    use proprietary protocols when they''re designing software to integrate with a
    vendor''s product, with as the Samba product.


    +   6. Type http://www.nsa.gov/research/selinux in the address bar and press Enter
    to see the SELLinux (stands for “enhanced Linux”) site. SELinux, created by the
    U.S. National Security Agency (NSA), adds extensions to Linux to make it less
    vulnerable to break-ins. Even if a Linux computer is attacked, SELinux severely
    limits the attacker''s ability to do anything on the computer. Attacks common
    in the Windows world, such as Code Red and Nimda, are also in the Linux world,
    even without SELinux. With SELinux, these attacks are highly unlikely.


    +   7. Exit your browser, and close any windows.'
  - '[PAGE 22]


    # Review Questions


    +   1. Which of the following statements about Linux security is correct?


    +   a. Linux e-mail programs are easy targets for viruses, as is Microsoft Outlook.


    +   b. Linux has a built-in firewall you can use to secure any Linux computer,
    but configuring it can be challenging.


    +   c. Linux Web browsers can''t use SSL to secure Web pages.


    +   d. Sometimes Web browsers can''t connect to Apache Web servers because Apache
    doesn''t follow open standards for security.


    +   2. Are there as many virus scanner programs for Linux as there are for Windows.
