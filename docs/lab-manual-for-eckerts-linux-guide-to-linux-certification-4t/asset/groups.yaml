  mdcn: "\n\n# 第 12 章 网络配置\n\nLinux 内部路由器使用路由表来确定数据包需要发送到何处以便到达目的地。`route` 命令也用于排排除网络问题。\n\
    \n![](img/272b3b99ebe228b8c0cfa22abe675a46_139_0.png)\n\n如果 eth0 接口正在使用 DHCP 分配\
    \ IP 地址，关闭接口并重启的过程会将接口重置为使用 DHCP，从而覆盖你之前设置的地址和子网掩码。在这种情况下，请询问你的导师在步骤 12 设置默认网关时使用哪个地址。\n\
    \n- 2. 为 IP 地址为 10.100.1.250 的路由器或设备添加默认网关，输入 `route default gw 10.1.1` 并按 Enter。再次输入\
    \ `route -n` 并按 Enter，查看你的路由表发生了什么变化。应该有一个新网关的条目，其 Destination（目标）列设置为 0.0.0.0。`route\
    \ 0.0.0.0` 用于指定默认路由。\n- 3. 将电脑保持当前配置以继续实验 12.2。\n\n如果你的以太网接口不是 eth0 而是类似于 en016777736\
    \ 的名称，你可以按照以下指令进行更改：\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_139_1.png)\n\n\
    - 1. 编辑文件 `/etc/default/grub`\n- 2. 找到以 `GRUB_CMDLINE_LINUX` 开头的行，并在行末的引号内添加 `net.ifnames=0\
    \ biosdevname=0`\n- 3. 在命令提示符下，输入 `grub2-mkconfig -o /grub2/grub.cfg`\n- 4. 输入\
    \ `mv /etc/sysconfig/network-scripts/ifcfg-eno167777736 /etc/sysconfig/network-scripts/ifcfg-eth0`\n\
    - 5. 重启系统。\n\n# 复习\n\n- 1. 大多数 Linux 系统上第一个以太网接口的名称是什么？\n  a. eth0\n  b. eth1\n\
    \  c. etha\n  d. eth0:0\n- 2. 哪个 Linux 命令用于更改子网掩码？\n  a. netmask\n  b. ifconfig\n\
    \  c. ipconfig\n  d. route\n- 3. 以太网卡的 MAC 地址可以通过 `route` 命令更改。对或错？\n- 4. 关闭第一个以太网接口，应该使用哪个命令？\n\
    \  a. `ifconfig eth0 down`\n  b. `ifconfig down eth0`\n  c. `ifconfig stop eh0`\n\
    \  d. `ifconfig eth0 stop`\n- 5. 哪个命令用于设置默认网关？\n  a. netmask\n  b. ifconfig\n\
    \  c. ipconfig\n  d. route\n\n# 实验 12.2 创建 IP 别名\n\n# 目标\n\n实验 12.1 向你展示了如何使用基本的\
    \ `ifconfig` 函数，例如设置以太网网卡（NIC）的 IP 地址、子网掩码和广播地址。本实验涵盖了更高级的用法：创建 IP 别名（为单个物理接口分配多个\
    \ IP 地址）。你还将更详细地检查 `ifconfig` 显示的状态信息。\n\n# 所需材料\n\n本实验需要：\n\n- 一台运行 Fedora 20\
    \ Linux 的电脑\n- 局局域网（LAN）连接\n- 你的电脑处于实验 12.1 结束时的状态\n\n预计完成时间：15 分钟\n\n# 活动背景\n\
    \n每个物理接口都可以分配多个 IP 地址。当你为物理接口分配另一个 IP 地址时，你正在创建一个 IP 别名。你可以为每个物理接口创建最多 256 个 IP\
    \ 别名，甚至为本地环回接口分配 IP 别名。本地环回（lo）接口是一个特殊的逻辑设备（意味着它在物理上不存在），用于在单个主机内部移动网络数据包。它在不需要访问另一台电脑的情况下测试功能非常有用。为本地环回接口创建\
    \ IP 别名对于网络应用（例如构建 Web 服务器）也很有帮助。\n\n# 活动\n\n- 1. 你应该已经以 root 身份登录到 tty2。如果没有，请切换到\
    \ tty2 并以 root 身份登录。\n- 2. 要创建 IP 别名，必须基于物理接口的名称命名。第一个接口默认称为 eth0，因此通过输入 `ifconfig\
    \ eth0:192.0.2.1` 创建一个名为 eth0 的 IP 别名。这显示了如何创建 IP 别名。实际 IP 地址取决于你的网络（img/272b3b99ebe228b8c0cfa22abe675a46_141_0.png）。\n\
    - 3. 要查看新别名，输入 `ifconfig` 并按 Enter。你将看到类似的输出：\n  eth0: flags<UP,BROADCAST,RUNNING,MULTICAST>\
    \ mtu:1500\n  inet:10.100.1.1 mask:255.255.255.0 broadcast:10.100.255\n  lo: flags<UP,LOOPBACK,RUNNING>\
    \ mtu:65536\n  inet:192.0.2.1 mask:255.255.255.0 broadcast:192.0.2.255\n- 4. 接下来，输入\
    \ `ifconfig eth0:2:192.5.100.1` 并按 Enter 创建另一个 IP 别名。你应该有两个 IP 别名。使用 `ifconfig`\
    \ 验证\n- 5. 输入 `ifconfig eth0:2` 并按 Enter 查看仅关于 eth0 的信息。\n- 6. 惯例是在名称后面使用数字和冒号来作为\
    \ IP 别名，但你可以使用任何内容。输入 `ifconfig eth0:abc:2.3.5` 并按 Enter，然后输入 `ifconfig eth0:abc`\
    \ 查看新的\n- 7. 现在，通过输入 `ifconfig lo:0:127.0.0.2` 并按 Enter，然后输入 `ifconfig lo:1:127.0.0.3`\
    \ 并按 Enter 为本地环回（lo）接口创建两个 IP 别名。输入 `ifconfig` 查看你目前创建的所有接口。\n- 8. 要关闭 IP 别名，输入\
    \ `ifconfig eth0:2` 并按 Enter，然后输入 `ifconfig` 查看 eth0:2 不再列出。\n- 9. 如果你想重启已关闭的\
    \ IP 别名，必须重新创建它。通过输入 `ifconfig eth0:2` 并按 Enter 查看其工作。你会收到错误消息：SIOCFLAGS: Cannot\
    \ assign address\n- 10. 要与别名通信，输入 `ping 192.0.2.1` 并按 Enter。你会看到 ping 回复。ping\
    \ 命令继续向目标 IP 地址发送数据包，直到你按下 Ctrl+C。现在按下 Ctrl+C。\n- 11. 对接口和 IP 设置的更改只有在重启并初始化到接口配置文件（/etc/sysconfig/network-scripts/ifcfg-eth0）时才会有效。如果你继续下一个实验，请重启。\n\
    \n# 复习\n\n- 1. 哪个命令配置 IP 别名？\n  a. `ifconfig -alias eth0 192.0.2.1`\n  b. `ifconfig\
    \ eth0-alias 192.0.2.1`\n  c. `ifconfig eth0:0 192.0.2.1`\n  d. `ifconfig eth0:0\
    \ 192.0.2.1 -a`\n- 2. 你不能为本地环回（lo）接口分配 IP 别名。对或错？\n- 3. 可以创建多少 IP 别名？\n  a. 每个物理接口最多\
    \ 64 个\n  b. 每个物理接口最多 256 个\n  c. 无论物理接口数量，最多 64 个\n  d. 无论物理接口数量，最多 256 个\n-\
    \ 4. 关闭物理接口后，重启时必须再次指定 IP 地址、子网掩码和广播地址。对或错？\n- 5. IP 别名仅用于内部测试；你无法向别名 IP 地址发送数据包并获得响应。对或错？\n\
    \n# 实验 12.3 安装和配置 NcFTPd\n\n# 目标\n\nFTP 是网络上传输文件的常用方法。Linux 上广泛使用的 FTP 服务器之一是\
    \ WuFTP，几乎包含所有的 Linux 发行版。然而，它很难配置且存在安全漏洞。丰富的 Linux 用户和管理员经常使用其他 FTP 服务器软件，例如\
    \ NcFTPd。在本实验中，你将下载、安装并配置 NcFTPd。\n\n# 所需材料\n\n本实验需要：\n\n- 一台运行 Fedora 20 Linux\
