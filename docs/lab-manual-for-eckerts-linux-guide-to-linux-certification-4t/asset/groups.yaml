    root, if necessary. Use systemctl set-default multi-user.target and press Enter.


    +   2. Type shutdown -r now and press Enter to restart the computer. When you
    see a text-mode login prompt, log in as


    +   3. The X Server is a file called Xorg in the /usr/X11/bin directory, but there''s
    also a symbolic link to it called x. To start X Server, type X and press Enter.
    (Make sure you type an uppercase X.) You should see some flashing text, followed
    by a blank screen, and then a mouse.


    If the screen is black and you don''t see a cursor, just skip to Step 7.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_95_0.png)


    +   4. If you move the mouse, the cursor should move. Try clicking the left mouse
    button, the right mouse button, and then both buttons. Nothing happens.


    +   5. Press Ctrl+Alt+Backspace to stop the X server and return to the virtual
    console, which now displays useful information about the X server, such as the
    server''s identity and version. (Information looks different in different Linux
    distributions.) It also tells you that the X server is logging errors and messages
    to the /var/log/Xorg.0 log file and is using the /etc/X11/xorg.conf d file for
    configuration information.


    +   6. Type X and press Enter to stop X server again


    +   7. Go to virtual console 1 by pressing Ctrl+Alt+F1. You see the same text
    as in Step 6. You don''t see the command prompt, however, because the X server
    is running as a foreground process in this virtual console.


    +   8. Press Ctrl+C to stop the X server and go to the command prompt.


    +   9. If you want to start the X server from a virtual console but run it as
    a background process, type X & and press Enter. Go to virtual console 1 by pressing
    Ctrl+Alt+F1. Press Enter. You should see a command prompt, which means the X server
    is running in the background. To confirm that it''s running, type ps ax | grep
    X and press Enter. You will see output similar to the following:


    ```

    2333 tty2 Ss+ 0:02 X

    ```


    +   You can also confirm the X server is running by pressing Ctrl+Alt+F2 to go
    to the X server (again, the screen may be blank and you might not see a cursor.
    This is okay, you will see one when you run an application in step 13.)


    +   11. Next, you see how to run graphical programs when you have only one X server
    running. (and no desktop manager, such as Gnome), you must start programs from
    a virtual console. Press Ctrl+Alt+F1 to go to the first virtual console.


    +   12. Install xcalc by typing yum install xcalc and pressing Enter. When prompted,
    press y and Enter to confirm.'
