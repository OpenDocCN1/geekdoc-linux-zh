    \   c. tar -cvf /mnt/backup/libback.tar /lib\n   d. tar -xzf /lib /mnt/backup/libback.tar\n\
    \n3. The z option in the tar command filters the archive through bzip2. True or\
    \ False?\n\n4. Write the command that mounts a SAMBA shared named reports located\
    \ on a server named operations to the /mnt/reports directory.\n\n5. If you filter\
    \ files through gzip using the tar command, you will always get about a 90% compression\
    \ ratio. True or False?\n\n## NETWORK CONFIGURATION\n\n### Labs included in this\
    \ chapter\n\n- Lab 12.1 Configuring Ethernet Interfaces\n- Lab 12.2 Creating IP\
    \ Aliases\n- Lab 12.3 Installing and Configuring NcFTPd\n- Lab 12.4 Using Advanced\
    \ Options with Network Tools\n\n### CompTIA Linux+ Exam Objectives\n\n| Objective\
    \ | Lab |\n| --- | --- |\n| 109.1 | Fundamentals of Internet protocols | 12.1–12.4\
