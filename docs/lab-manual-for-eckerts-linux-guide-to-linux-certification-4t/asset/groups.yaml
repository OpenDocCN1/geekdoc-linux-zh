    \ and press Enter.\n\n6. Next, create a tar file and save it in the /mnt/backup\
    \ directory. Type tar -cvf /mnt/backup/yumback.tar /etc/yum* and press Enter.\n\
    \n7. Check the size of the tar file by typing -l /mnt/backup/yum* and pressing\
