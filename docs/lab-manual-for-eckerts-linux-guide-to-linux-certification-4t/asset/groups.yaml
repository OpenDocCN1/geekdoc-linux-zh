    # Lab 12.2 Creating IP Aliases


    # Objectives


    Lab 12.1 showed you how to use basic ifconfig functions, such as setting an Ethernet
    NIC''s IP address, subnet mask, and broadcast address. This lab covers a more
    advanced use, creating IP aliases (assigning more than one IP address to a single
    physical interface). You also examine in more detail the status information ifconfig
    displays.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - A LAN connection

    - Your computer in its state at the end of Lab 12.1


    Estimated completion time: 15 minutes


    # Activity Background


    Each physical interface can have more than one IP address assigned. When you assign
    another IP address to a physical interface, you''re creating an IP alias. You
    can create up to 256 IP aliases for each physical interface and even assign IP
    aliases to the local loopback interface. The local loopback (lo) interface is
    a special logical device (meaning it doesn''t exist physically) used to move network
    packets in a single host. It can be useful in testing networking functions without
    needing network access to another computer. Creating IP aliases for the local
    loopback interface can also be helpful in advanced networking applications, such
    as building a Web server.'
