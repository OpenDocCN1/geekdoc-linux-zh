  mdcn: "\n\n# 活动背景\n\n与运行级别（runlevels）类似，Ctrl+Alt+Del 键的功能由目标（targets）控制。通过更改分配给目标的键组合，你可以更改\
    \ Ctrl+Alt+Del 键组合的功能。\n\n# 活动\n\n- 1. 按 Ctrl+Alt+Del+F2 切换到命令行终端 (tty2)，并以 root\
    \ 登录终端。\n- 2. Ctrl+Alt+Del 键组合的操作由 `/usr/lib/systemd/system/ctrl-alt-del.target`\
    \ 定义。输入 `cd /usr/lib/systemd/system` 并按回车。\n- 3. 输入 `ln -f reboot.target ctrl-alt-del.target`\
    \ 并按回车。这将链接执行系统重启的 ctrl-alt-del 文件。这是默认设置。\n- 4. Ctrl+Alt+Del 键的操作需要更新在系统重启或 init\
    \ 初始化时发生什么。你可以强制其重新初始化以避免重启。输入 `kill -HUP 1` 并按回车。\n- 5. 按 Ctrl+Alt+Del 启动系统重启。（使用虚拟化，你可能需要使用不同的组合键或点击\
    \ Ctrl+Alt+Del 图标；如果你不知道如何向系统发送 Ctrl+Alt+Del，请询问你的导师。）系统重启。\n- 6. 系统重启后，切换到命令行终端并以\
    \ root 登录终端。输入 `cd /usr/lib/systemd/system` 并按回车。这将系统在你按下 Ctrl+Alt+Del 时关机。输入\
    \ `kill -HUP 1` 并按回车。\n- 7. 输入 `ln -s poweroff.target ctrl-alt-del.target` 并按回车。\n\
    - 8. 按 Ctrl+Alt+Del（或相应的组合键或图标）。你的电脑将关机而不是重启。如果你的电脑具有电源管理且你的 Linux 发行版支持它，你的电脑将自动关闭。\n\
    \n# 复习题\n\n- 1. 当你按下 Ctrl+Alt+Delete 键组合时，默认会发生什么？\n   a. 电脑重启。\n   b. 电脑关机并停止。\n\
    \   c. 从终端或虚拟控制台注销。\n   d. X Server 终止。\n- 2. 执行哪个命令使 Ctrl+Alt+Del 键组合执行关机操作？\n\
    \   a. init Ctrl+Alt+Del\n   b. ln -s poweroff.target ctrl-alt-del.target\n  \
    \ c. runlevel poweroff.target\n   d. ln -s -f ctrl-alt-del.target\n- 3. 让 Ctrl+Alt+Del\
    \ 键更改生效的最快方法是？\n   a. 按 Ctrl+Alt+Delete。\n   b. 按 Ctrl+Alt+Backspace。\n   c. 输入\
    \ `shutdown -r now`。\n   d. 输入 `kill -HUP 1`。\n- 4. ctrl-alt-del.target 文件位于？\n\
    \   a. /etc/init/system\n   b. /usr/lib/systemd/system\n   c. /usr/keys/system\n\
    \   d. /lib/system/targets\n\n# 实验 8.3 运行 X Server\n\n## 目标\n\nGnome 和 KDE 是 Linux\
    \ 图形桌面环境，其功能与 Macintosh 和 Windows 类似。这些环境非常复杂，每一层都有软件和设置。在本次实验中，你将运行这些层之一——X Server\
    \ 程序。你将看到 X server 提供哪些功能，以及如何与 X server 交互以运行应用程序。\n\n你可能会认为运行 X server 没用，但在没有图形桌面环境其他层的情况下使用它可以减少系统资源需求，并锁定桌面，使用户只能运行授权的应用程序。例如，你可以使用这种技术构建亭式应用（kiosk\
    \ application）。\n\n完成本实验后，你将能够做到：\n\n- 启动和停止 X server\n- 从命令行运行 X 应用程序\n- 指定命令行选项来设置窗口属性\n\
    \n## 所需材料\n\n本实验需要：\n\n- 一台运行 Fedora 20 Linux 的电脑\n- 基础 X Window 程序 xcalc 和 xterm\n\
    - 用于安装 xcalc 和 xterm 的 Internet 连接\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_94_0.png)\n\
    \n本实验在所有虚拟环境中运行方式可能不同。\n\n# 活动\n\n- 1. 本实验在电脑配置为运行级别 3 时效果最佳。启动 Linux 系统，如有必要，切换到命令行终端并以\
    \ root 登录终端。使用 `systemctl set-default multi-user.target` 并按回车。\n- 2. 输入 `shutdown\
    \ -r now` 并按回车重启电脑。当看到文本模式登录提示时，进行登录。\n- 3. X Server 是 `/usr/X11/bin` 目录下一个名为\
    \ `Xorg` 的文件，但也有一个名为 `x` 的符号链接。要启动 X Server，输入 `X` 并按回车。（确保输入的是大写的 X）。你应该看到一些闪烁的文字，然后是空白屏幕，最后是鼠标。\n\
    \n如果屏幕是黑色的且你没有看到光标，直接跳到第 7 步。\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_95_0.png)\n\
    \n- 4. 如果移动鼠标，光标应该移动。尝试点击鼠标左键、右键。\n- 5. 如果屏幕是黑色的且你没有看到光标，直接跳到第 7 步。\n- 6. 如果移动鼠标，光标应该移动。尝试点击鼠标左键、右键。\n\
    - 7. 如果屏幕是黑色的且你没有看到光标，直接跳到第 7 步。\n- 8. 如果移动鼠标，光标应该移动。尝试点击鼠标左键、右键。\n- 9. 如果屏幕是黑色的且你没有看到光标，直接跳到第\
    \ 7 步。\n- 10. 如果移动鼠标，光标应该移动。尝试点击鼠标左键、右键。\n\n"
