    本章包含以下实验：


    - 实验 11.1 使用 gzip 压缩程序

    - 实验 11.2 压缩图像文件

    - 实验 11.3 安装和删除包

    - 实验 11.4 检测并替换缺失的包文件

    - 实验 11.5 备份到 SAMBA 共享


