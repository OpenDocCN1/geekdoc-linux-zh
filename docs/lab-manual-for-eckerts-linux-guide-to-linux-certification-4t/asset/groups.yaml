  mdcn: "\n\n## 第 4 章 Linux 文件系统管理\n\n8. `find` 命令的另一个良好用法是查找在特定时间段内访问或修改的文件。例如，要列出\
    \ `/etc` 目录下在过去 60 分钟内被访问的文件，输入 `find /etc -amin -60` 并按回车。要查看过去一天内修改过的列表，输入 `find\
    \ /etc -mtime -1` 并按回车。\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_55_0.png)\n\
    \n`-amin` 参数查找在指定分钟内被访问过的文件。你也可以使用 `-mmin` 来查找被修改的文件。`-mtime` 和 `-atime` 参数用于查找在特定天数内被修改或访问的文件。\n\
    \n到目前为止，你关注的是显示符合标准的文件，但你可以使用 `find` 在文件符合标准时执行其他操作。在步骤 2 和 3 中，你使用 `find` 确定位了没有用户所有者的文件。在步骤\
    \ 4 中，你使用 `chown` 为这些文件分配了所有者。你可以将这两个步骤合并为一个。首先，更改文件的所有者使其变得没有所有者：输入 `chown 7000\
    \ test` 并按回车。输入 `find / -nouser` 并按回车列出 test 文件。现在输入 `find / -nouser -exec chown\
    \ nobody \"{}\"` 并按回车。此命令将所有没有用户所有者的文件和目录的用户所有者更改为 `nobody`。输入 `ls -l test` 并按回车，查看\
    \ test 文件现在由 `nobody` 用户所有。\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_55_1.png)\n\
    \n`exec` 参数指定每当 `find` 找到没有所有者的文件时运行 `chgrp` 命令。大括号 `({})` 是无所有者文件名的占位符，分号 (`;`)\
    \ 表示命令的结束。\n\n9. `find` 命令还有许多更多选项。要获取此命令的帮助，输入 `man find` 并按回车。浏览 man 页面，完成后按\
    \ `q` 退出。输入 `logout` 并按回车，然后按 `Ctrl+Alt+F1` 返回图形界面。\n\n## 复习题\n\n- 1. 下列哪项显示当前目录下没有有效用户所有者的文件列表？\n\
    \  - a. `find /bin -nroup`\n  - b. `find -nouser`\n  - c. `find /user=\"`\n  -\
    \ d. `find nouser`\n- 2. 哪个命令查找 `/bin` 目录下在过去一小时内修改过的文件？\n  - a. `find /bin -amin\
    \ -60`\n  - b. `find -bin /amin -1`\n  - c. `find /bin -mmin -60`\n  - d. `find\
    \ /bin -mtime -1`\n- 3. 下列哪项产生了硬盘上所有设置为 SUID 权限的文件列表？\n  - a. `find / -perm 1000`\n\
    \  - b. `find / -perm 2000`\n  - c. `find / -perm 4000`\n  - d. `find / -perm\
    \ 777`\n- 4. 哪个命令产生了大于或等于 2 MB 的文件列表？\n  - a. `find / -size gt 2MB`\n  - b. `find\
    \ / -size => 2000000`\n  - c. `find / -size 2M`\n  - d. `find / -size 2000M`\n\
    - 5. 哪个命令产生了硬盘上所有符号链接的列表？\n  - a. `find / -type 1`\n  - b. `find / -symlinks`\n\
    \  - c. `find / -type s`\n  - d. `find / --links`\n\n## Lab 4.4 操作文件和目录权限\n\n\
    ### 目标\n\n本实验的目标是理解如何处理文件和目录权限的细节。特别是，你将看到粘滞位（sticky bit）如何作为特殊权限函数运行。\n\n###\
    \ 所需材料 本本实验需要：\n\n- 一台运行 Fedora 20 Linux 的计算机\n\n预计完成时间：20 分钟\n\n### 实验背景\n\n\
    在实验中，你同时登录了三个用户：root 用户和两个普通用户。你其中一个普通用户创建文件，并观察对另一个普通用户的影响。你还登录了 root，以便执行普通用户无法执行的任务。\n\
    \n### 实验步骤\n\n- 1. 按 `Ctrl+Alt+F2` 切换到命令行终端 (tty2)，并以 root 用户登录终端。\n2. 输入 `mkdir\
    \ /var/local/share` 并按回车创建一个目录。\n\n## 第 4 章 Linux 系统管理\n\n3. 输入 `ls -ld /var/local/share`\
    \ 并按回车。检查输出以确保目录具有这些权限：\n\n```\ndrwxr-xr-x 2 root 4096 Aug 18 15:23 /var/local/share\n\
    ```\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_57_0.png)\n\n如果你使用 `ls -l /var/local/share`\
    \ 列出目录内容（省略选项），你将看到目录是空的，因为你刚刚创建了它。\n\n如果权限不同，输入 `chmod 755 /var/local/share`\
    \ 并按回车。\n4. 本实验需要两个普通用户账户。你应该已经设置好了一个；对于本实验，假设它是 `user1`。如果你没有第二个账户，需要创建一个名为 `user2`\
    \ 的账户。输入 `useradd user2` 并按回车。接下来输入 `password user2` 并按回车，然后输入并确认一个容易记住的密码。\n\n\
    5. 按 `Ctrl+Alt+F3` 切换到虚拟控制台 3。以 `user1` 登录。输入 `cd /var/local/share` 并按回车。\n\n\
    6. 按 `Ctrl+Alt+F4` 切换到虚拟控制台 4。以 `user2` 登录。输入 `cd /var/local/share` 并按回车。\n\n\
    7. 输入 `echo \"Hello from User\" > file1` 尝试创建一个文件。你会看到以下错误信息，因为你没有该共享目录的权限：\n\n\
    ```\n-bash: file1: Permission denied\n```\n\n8. 按 `Ctrl+Alt+F2` 切换到虚拟控制台 2。以 root\
    \ 用户登录。\n9. 按 `Ctrl+Alt+F4` 切换到虚拟控制台 4。以 `user2` 登录。\n\n`>>` 运算符指定追加到文件而不是覆盖。\n\
    \n![](img/272b3b99ebe228b8c0cfa22abe675a46_58_0.png)\n\n14. 按 `Ctrl+Alt+F2` 切换到虚拟控制台\
    \ 2。以 root 用户登录。输入 `cd /var/local/share` 并按回车。输入 `echo \"Hello from root\" >>\
    \ file1` 尝试追加内容。此命令执行成功，因为 root 用户拥有所有权限。\n\n15. 按 `Ctrl+Alt+F3` 切换到虚拟控制台 3。以\
    \ `user1` 登录。输入 `file1` 并按回车，你看到：\n\n```\nHello from User2\nHello from root\n\
    ```\n\n16. 输入 `rm file1` 并按回车。如果询问你是否要删除文件，输入 `y` 并按回车。输入 `ls -l` 并按回车。注意文件已不存在，因为\
    \ `user1` 能够删除 `user2` 的文件。你可能认为该用户对文件只有读取权限，不应该能删除它。然而，`user1` 对 `/var/local/share`\
    \ 目录有写权限，这允许它删除。你可以通过在目录上设置粘滞位来解决此安全问题，见下一步。\n\n17. 按 `Ctrl+Alt+F2` 切换到虚拟控制台 2。以\
    \ root 用户登录。输入 `chmod o+t /var/local/share` 并按回车。接下来输入 `ls -ld /var/local/share`\
    \ 并按回车。如下所示，粘滞位 (t) 已替换了 x 位：\n\n```\ndrwxr-xr-t 2 root 4096 Aug 18 15:23 /var/local/share\n\
    你可能还会看到 /var/local/share 高亮，表示粘滞位已设置。```\n\n18. 按 `Ctrl+Alt+F4` 切换到虚拟控制台 4。以 `user2`\
    \ 登录。通过 `echo \"Hello from User2\" > file1` 创建文件1。输入 `ls -l` 并按回车验证文件已创建。\n\n\
    19. 按 `Ctrl+Alt+F3` 切换到虚拟控制台 3。以 `user1` 登录。再次尝试删除文件输入 `rm file1` 并按回车。你会收到此行提示：\n\
    `rm: remove write-protected regular file 'file1'?`\n\n20. 输入 `y` 并按回车。你会看到一条账户无法删除该文件的错误信息：\n\
    `rm: cannot remove 'file1': Operation not permitted`\n\n21. 注销每个终端会话，并按 `Ctrl+Alt+F1`\
    \ 返回图形界面。\n\n"
