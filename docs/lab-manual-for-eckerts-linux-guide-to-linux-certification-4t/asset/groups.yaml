    \n如果你使用指定斜杠 (`/`)、点 (`.`) 或两个点 (`..`) 开头的目录 `cd` 命令，PATH 功能将不会搜索目录。\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_88_0.png)\n\
