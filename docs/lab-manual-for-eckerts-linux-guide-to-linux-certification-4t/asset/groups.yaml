    - 5. 等待几分钟，然后输入 `ip neighbor` 并按回车。此时，默认网关的条目应该变为过（stale），你会看到类似下面的输出：\n\n```\n\
    10.1.10.250 dev eth0 00:0f:34:e5:63:b0 STALE\n```\n\n如果你仍然看到 REACHABLE，继续定期输入\
    \ `ip neighbor` 命令，直到看到与前几行类似的输出。\n\n- 6. 输入 `ifconfig eth0 -arp` 并按回车。这将禁用 eth0\
