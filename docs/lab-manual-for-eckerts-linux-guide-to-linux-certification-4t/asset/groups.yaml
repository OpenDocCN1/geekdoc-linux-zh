    # Lab 10.1 Configuring Default User Account Settings


    # Objectives


    The goal of this lab is to become familiar with commands used to manage and configure
    user accounts.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20


    Estimated completion time: 20 minutes


    # Activity


    +   1. Start your Linux computer and switch to a command-line terminal, if necessary
    and log in root.


    +   2. Type **useradd -D** and press **Enter** to see the default values that
    are used when users are created.


    +   3. Set the default number of days that a user account is disabled after the
    password has expired, type `useradd -D -f 20` and press **Enter**.


    +   4. Type **useradd -D** and press **Enter** to confirm the change. You see
    the line INACTIVE=20 in the output. All accounts that were created will now be
    set to be disabled 20 days after their password expires.


    +   5. By default, the shell that users will log into by default is the bash shell.
    To change the default shell for created users to sh, type `useradd -s /bin/sh`
    and press **Enter**. Type `useradd -D` and press **Enter** to confirm.


    +   6. Create a new user by typing `useradd testuser1` and pressing **Enter**.
    Set the password by typing `passwd testuser1` and pressing **Enter**. Type **Password01**
    and press **Enter** Type **Password01** and press **Enter** again.


    +   7. Type `cat /etc/passwd` and press **Enter** to see the new user in the password
    file. You will see that the shell is set to `/bin/sh`.


    +   8. Type `cat /etc/shadow` and press **Enter** to see the user in the shadow
    file. Look at the end of the line for testuser1 and see the 20 that indicates
    the inactive value.


    +   9. Press **Ctrl+Alt+F3** to go to TTY3. Login as *testuser1* with password
    **Password01**. Notice the shell prompt. Type **echo $SHELL** and press **Enter**
    to see the default shell value.


    +   10. Change to TTY2 by pressing **Ctrl+Alt+F2**. Type `cat /etc/default/useradd`
    and press **Enter**. This is the file that the `useradd -D` command changes. You
    can also edit this file directly.


    +   11. Shut down your Linux computer.'
