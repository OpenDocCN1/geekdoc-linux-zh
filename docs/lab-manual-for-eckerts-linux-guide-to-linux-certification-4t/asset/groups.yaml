    # Lab 11.5 Backing Up to a SAMBA Share


    # Objectives


    This lab explains how to mount a SAMBA share and back up files using tar to the
    share. You will need a network server that has a SAMBA (Windows SMB) share created
    that requires no authentication. You can also use a network attached storage appliance
    and create a public share. In this lab, the share will be /server1/public but
    you should substitute your own server and share name. If you cannot create a public
    share that requires no credentials, an alternative method is provided that uses
    log in with credentials.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - Access to a SAMBA share that requires no logon credentials


    Estimated completion time: 30 minutes


    # Activity


    1. Start your Linux computer. Switch to a command-line terminal (tty2) by pressing
    Ctrl+Alt+F2, and log in as the root user.


    2. Create a directory to mount the SAMBA share by typing mkdir /mnt/backup and
    pressing Enter.


    3. Mount the SAMBA share by typing mount -t cifs //server1/public /mnt/backup
    and pressing Enter. If you are prompted for a password, press Enter.


    > If your share requires login credentials, replace the mount command with: -t
    cifs -o username,password //server1/public where username and password are the
    required credentials.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_133_0.png)


    4. Type ls /mnt/backup and press Enter to see the contents of the share.


    5. To see all the yum related files in the /etc/yum directory, type ls /etc/yum*
    and press Enter.


    6. Next, create a tar file and save it in the /mnt/backup directory. Type tar
    -cvf /mnt/backup/yumback.tar /etc/yum* and press Enter.


    7. Check the size of the tar file by typing -l /mnt/backup/yum* and pressing Enter.
    The file is probably about 20000 bytes.'
