    \ eth0 | grep inet and pressing Enter. You should see the following:\n\nether\
    \ 00:00:ba:ad:f0:0d txqueelen 1000 (Ethernet)\n\n11. The ifconfig command can't\
    \ be used to configure one important parameter: the default route (default gateway).\
