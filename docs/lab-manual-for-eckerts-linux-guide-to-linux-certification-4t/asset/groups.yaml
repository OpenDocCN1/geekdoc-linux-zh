    # Introduction


    Hands-on learning is the best way to master the skills needed for the Linux+ Powered
    by LPI certification from CompTIA and a Linux-related career. This book contains
    hands-on labs that apply fundamental Linux concepts as they''re used in the real
    world. In addition, each chapter offers review questions to reinforce your mastery
    of the topics. The organization of this book follows the same organization as
    Cengage Learning''s CompTIA Linux+ Guide to Linux Certification, and using the
    two together gives you an effective learning experience. This book is suitable
    for use in a beginning Linux administration course. As a prerequisite, students
    should have a fundamental understanding of general operating system concepts and
    at least one course in operating systems and introductory networking. This book
    is best used when accompanied by the Cengage Learning book, CompTIA Linux+ Guide
    to Linux Certification, 4th Edition.


    # Features


    To ensure a successful experience for instructors and students alike, this book
    includes the following features:


    +   - Linux+ certification objectives—Each chapter lists the relevant objectives
    from the CompTIA Linux+ exam.

    - Lab objectives—Every lab has a brief description and list of learning objectives.

    - Materials required—Each lab includes information on the materials you need to
    perform the lab.

    - Completion times—Every lab has an estimated completion time so that you can
    plan your activities more accurately.

    - Activity sections—Labs are presented in manageable sections; additional information
    is given when needed.

    - Step-by-step instructions—Logical step-by-step instructions guide you through
    the hands-on activities in each lab.

    - Review questions—Questions help reinforce concepts covered in the lab.


    # Minimum Hardware Requirements


    These minimum hardware requirements might not be enough for running Fedora 20
    in all situations, but they should be satisfactory for running the labs in this
    manual:


    +   - 64-bit CPU

    - 80 GB hard disk space

    - 4 GB MB memory (RAM)

    - DVD drive

    - Internet connection'
