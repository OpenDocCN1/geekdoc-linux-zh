    \ can't send or receive packets on it.![](img/272b3b99ebe228b8c0cfa22abe675a46_138_1.png)\n\
    \n9. Change the MAC address by typing ifconfig eth0 hw ether 00:00:ba:ad:f0:0d\
    \ and pressing Enter.\n\n10. Restart the interface by typing ifconfig eth0 up\
