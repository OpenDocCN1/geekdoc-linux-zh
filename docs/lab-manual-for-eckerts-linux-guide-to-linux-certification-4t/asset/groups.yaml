- md: "\n# Materials Required\n\nThis lab requires the following:\n\n- A computer\
    \ running Fedora 20 Linux\n- A network connection and the IP address of another\
    \ device on your network\n\nEstimated completion time: 10 minutes\n\n# Activity\n\
    \n1. Start Linux and log in to the GUI as a regular user. Open a terminal window,\
    \ and then type ifconfig and press Enter to view your IP address. Type route and\
    \ press Enter to see the address of your default gateway. Make a note of both\
    \ addresses.\n2. Type su and press Enter to type the root password so you are\
    \ running as root. You need root privileges to configure the firewall.\n3. Type\
    \ firewall-cmd --state and press Enter to see the current status of the firewall.\
    \ You should see a message that says “running.”\n4. Type firewall-cmd --get-services\
    \ and press Enter to see the list of services supported by the firewall-cmd. You'll\
    \ see a list of common services you are probably familiar with such as dhcp, dns\
    \ ftp, http, telnet and some that you may not be familiar with such as pmcd, nmproxy,\
    \ and snmp. These are the services you can use by name with the firewall-cmd command\
    \ so you don't need to know their port number and protocol.\n5. Type firewall-cmd\
    \ --list-all-zones and press Enter. You'll see a list of zones which you'll learn\
    \ about in Chapter 14 of the accompanying book. The first line after zone name\
    \ is interfaces: Press Space until you see the zone named public. Notice that\
    \ after the public name, it says “default, active). And after interfaces: you\
    \ see nothing. On the line that starts with “services:” you see a list of services\
    \ that are enabled for this zone. Press q if necessary, to exit.\n6. Type firewall-cmd\
    \ --get-active-zones and press Enter. You will see only the public zone.\n7. To\
    \ enable the ftp service in the default zone (public), firewall-cmd --add-service=ftp\
    \ and press Enter. Type firewall-cmd --query-service=ftp and press Enter. The\
    \ output is “yes”, which means the service is enabled for the default zone.\n\
    8. Type firewall-cmd --list-all and press Enter to see detailed information for\
    \ the default zone.\n9. Type firewall-cmd --remove-service=ftp and press Enter\
    \ to disable the service. Type firewall-cmd --query-service=ftp and press Enter.\
    \ The output is “no”, which means the service is disabled for the default zone.\
    \ Type firewall-cmd --list-all and press Enter to see that ftp is no longer listed\
    \ on the services.\n10. Now type firewall-cmd --add-service=ftp --timeout=120\
    \ and press Enter. This enables the service for two minutes (120 seconds). Type\
    \ firewall-cmd --query-service=ftp and press Enter. The output is “yes.” Wait\
    \ about two minutes and type firewall-cmd --query-service=ftp and press Enter.\
    \ The output is “no”, indicating the service is now disabled.\n11. Type ping -c\
    \ 5 10.10.1.250 and press Enter (replace 10.10.1.250 with the address of your\
    \ default gateway). You should get 5 successful replies.\n12. Type firewall-cmd\
    \ --panic-on and press Enter. Now type the ping command again. You see a message\
    \ similar to \"ping send: Operation not permitted.\" The --panic-on option blocks\
    \ all network traffic on the selected zone. Type firewall-cmd --panic-off and\
    \ press Enter and try the ping command again which should be successful.\n13.\
    \ Close all windows, and shut down the computer.\n\n# Review Questions\n\n1. You\
    \ can change firewall settings with an ordinary user's privileges. True or False?\n\
    2. Which command lists all the services supported by the firewall-cmd --list-services\
    \ command?\na. firewall-cmd --list-services\nb. firewall-cmd --get-services\n\
    c. firewall-cmd --show-services\nd. firewall-cmd --all-services\n3. Which of the\
    \ following is the default active zone?\na. Internal\nb. Trusted\nc. Work\nd.\
    \ Public\n4. What command do you use to block all traffic in the default zone?\n\
    a. firewall-cmd disable\nb. firewall-cmd --panic-on\nc. firewall-cmd --block-all\n\
    d. firewall-cmd --remove-service=all\n5. What command do you use to find out if\
    \ the DNS service is enabled for the default zone?\n\n# CHAPTER FOURTEEN\n\n#\
    \ TROUBLESHOOTING, PERFORMANCE, AND SECURITY\n\n# Labs included in this chapter\n\
    \n- Lab 14.1 Validating Files\n- Lab 14.2 Using SSH\n- Lab 14.3 Generating Public\
    \ and Private Keys\n- Lab 14.4 Exchanging and Signing Keys\n- Lab 14.5 Encrypting\
    \ Files\n\n# CompTIA Linux+ Exam Objectives\n\n| Objective | Lab |\n| :--- | :---\
    \ |\n| 103.4 Use streams, pipes, and redirects | 13.1, 13.4 |\n| 110.3 Securing\
    \ data with encryption | 13.1–13.5 |\n\n# Lab 14.1 Validating Files\n\n# Objectives\n\
    \nThis lab shows you how to validate files using cryptographic hashes to verify\
    \ that they’re genuine. The `md5sum` command is one method for performing this\
    \ task.\n\n# Materials Required\n\nThis lab requires the following:\n\n- A computer\
    \ running Fedora 20 Linux\n\nEstimated completion time: 10 minutes\n\n# Activity\
    \ Background\n\nIn Linux, you have a few ways to validate files, such as the `sum`,\
    \ `cksum`, and `md5sum` commands. However, `md5sum` is cryptographically stronger\
    \ than `sum` and `cksum`, so you should use it when possible. Use the MD5 message\
    \ digest to create a cryptographic hash of a file. When transmitting this file,\
    \ make the hash to the recipient, who also uses `md5sum` to compute a hash on\
    \ the file. If the recipient’s hash is the same as the sender’s hash, the file\
    \ is genuine. If the hashes differ, the file has been tampered with.\n\nA hash\
    \ consists of 32 characters. Fortunately, you don’t have to compare two long sequences\
    \ of characters because `md5sum` handles this comparison for you if you use the\
    \ `--check` or `-c` option.\n\n# Activity\n\n1. Start your Linux computer. Switch\
    \ to a command-line terminal (tty2) by pressing `Ctrl+Alt+F2`, and log in as user1.\n\
    2. To become familiar with the `md5sum` command, type `man md5sum` and press Enter.\
    \ Read the information, but don’t be concerned if you don’t everything on the\
    \ page. Press q to exit.\n3. To copy a program to your home directory, type `cp\
    \ /bin/bash ~` and press Enter.\n4. To generate a cryptographic hash of the bash\
    \ file and display the onscreen, type `md5sum -b bash` and press Enter. The `-b`\
    \ option is used on binary files; by default, md5sum assumes the file is a text\
    \ file. Output similar to the following:\n\n```\n26b6100fa713bb559a7407fe62bcc\n\
    ```\n5. Generate the hash again, but this time send the output to a file by typing\
    \ `md5sum -b bash > bash.md5` and pressing Enter.\n6. To validate the bash file,\
    \ type `md5sum -c bash.md5` and press Enter. You see bash: OK. The `-c` option\
    \ is the same as --check, which tells md5sum to compare the.\n7. Next, you change\
    \ the bash file by writing a few characters at the end of it. To do this, type\
    \ `echo \"123\" >> bash` and pressing Enter.\n8. Validate the bash file after\
    \ typing md5sum -c bash.md5 and pressing Enter. Because the file has been modified,\
    \ see the following:\n\n```\nbash: FAILED\nmd5sum: WARNING: 1 computed checksum\
    \ did NOT MATCH\n```\n\nThe md5sum command uses the term \"checksum\" instead\
    \ of the more precise term \"hash\".\n\n9. Delete the bash file by typing rm bash\
    \ and pressing Enter.\n10. If you plan to continue to the next lab, stay logged\
    \ in; otherwise, shut down your computer.\n\n# Review Questions\n\n1. Which of\
    \ the following commands compares the hash of a file named myfile to a stored\
    \ hash?\n   a. md5sum -c myfile\n   b. md5sum --check myfile.md5\n   c. md5sum\
    \ -c myfile -md5\n   d. md5sum --check myfile myfile.md5\n2. The md5sum command\
    \ outputs its hash to STDOUT by default. True or False?\n3. The md5sum command\
    \ produces a cryptographic hash of how many characters?\n   a. 16\n   b. 32\n\
    \   c. 64\n   d. 128\n4. Instead of \"hash,\" md5sum uses which term?\n   a. Parity\n\
    \   b. Checksum\n   c. Block check character\n   d. CRC\n5. The md5sum command\
    \ can check only binary files to see whether they’re genuine. True or False?\n"
  mdcn: "\n\n# 所需材料\n\n本实验需要以下内容：\n\n- 一台运行 Fedora 20 Linux 的计算机\n- 网络连接以及你网络上另一台设备的\
    \ IP 地址\n\n预计完成时间：10 分钟\n\n# 活动步骤\n\n1. 启动 Linux 并以普通用户身份登录 GUI。打开一个终端窗口，输入 `ifconfig`\
    \ 并按回车查看你的 IP 地址。输入 `route` 并按回车查看默认网关的地址。记下这两个地址。\n2. 输入 `su` 并按回车，输入 root 密码以便以\
    \ root 身份运行。配置防火墙需要 root 权限。\n3. 输入 `firewall-cmd --state` 并按回车查看防火墙的当前状态。你应该能看到显示“running”（运行）的消息。\n\
    4. 输入 `firewall-cmd --get-services` 并按回车查看 `firewall-cmd` 支持的服务列表。你将看到一系列你可能熟悉的常用服务，例如\
    \ dhcp、dns、ftp、http、telnet，以及一些你可能不熟悉的服务，如 pmcd、nmproxy 和 snmp。你可以通过名称使用 `firewall-cmd`\
    \ 命令使用这些服务，因此无需知道它们的端口号和协议。\n5. 输入 `firewall-cmd --list-all-zones` 并按回车。你将看到区域列表，你将在配套书籍的第\
    \ 14 章学习它们。zone 名称后的第一行是 `interfaces:`：按空格键直到看到名为 `public` 的区域。注意在 `public` 名称之后显示的是“default,\
    \ active”。而在 `interfaces:` 之后你什么都没有。在以“services:” 开头的行上，你会看到该区域启用的服务列表。必要时按 `q`\
    \ 退出。\n6. 输入 `firewall-cmd --get-active-zones` 并按回车。你只会看到 public 区域。\n7. 要在默认区域（public）中启用\
    \ ftp 服务，输入 `firewall-cmd --add-service=ftp` 并按回车。输入 `firewall-cmd --query-service=ftp`\
    \ 并按回车。输出为“yes”，意味着该服务已在默认区域启用。\n8. 输入 `firewall-cmd --list-all` 并按回车查看默认区域的详细信息。\n\
    9. 输入 `firewall-cmd --remove-service=ftp` 并按回车禁用该服务。输入 `firewall-cmd --query-service=ftp`\
    \ 并按回车。输出为“no”，意味着该服务在默认区域已禁用。输入 `firewall-cmd --list-all` 并按回车查看 ftp 不再出现在服务列表中。\n\
    10. 现在输入 `firewall-cmd --add-service=ftp --timeout=120` 并按回车。这将使该服务持续两分钟（120 秒）。输入\
    \ `firewall-cmd --query-service=ftp` 并按回车。输出为“yes”。等待两分钟后输入 `firewall-cmd --query-service=ftp`\
    \ 并按回车。输出为“no”，表示该服务现在已禁用。\n11. 输入 `ping -c 5 10.10.1.250` 并按回车（将 10.10.1.250\
    \ 替换为你的默认网关地址）。你应该能获得 5 次成功的回复。\n12. 输入 `firewall-cmd --panic-on` 并按回车。现在再次输入\
    \ ping 命令。你会看到类似“ping send: Operation not permitted”的消息。`--panic-on` 选项阻止所选区域的所有网络流量。输入\
    \ `firewall-cmd --panic-off` 并按回车，再次尝试 ping 命令，它应该是成功的。\n13. 关闭所有窗口并关闭计算机。\n\n\
    # 复习题\n\n1. 你可以使用普通用户的权限更改防火墙设置。对还是错？\n2. 哪条命令列出了 `firewall-cmd --list-services`\
    \ 命令支持的所有服务？\n   a. firewall-cmd --list-services\n   b. firewall-cmd --get-services\n\
    \   c. firewall-cmd --show-services\n   d. firewall-cmd --all-services\n3. 下列哪项是默认活动区域？\n\
    \   a. Internal\n   b. Trusted\n   c. Work\n   d. Public\n4. 使用什么命令可以阻止默认区域中的所有流量？\n\
    \   a. firewall-cmd disable\n   b. firewall-cmd --panic-on\n   c. firewall-cmd\
    \ --block-all\n   d. firewall-cmd --remove-service=all\n5. 使用什么命令来查找 DNS 服务是否已在默认区域启用？\n\
    \n# 第十四章\n\n# 故障排除、性能与安全\n\n# 本章包含的实验\n\n- 实验 14.1 验证文件\n- 实验 14.2 使用 SSH\n- 实验\
    \ 14.3 生成公钥和私钥\n- 实验 14.4 交换和签名密钥\n- 实验 14.5 文件加密\n\n# CompTIA Linux+ 目标\n\n|\
    \ 目标 | 实验 |\n| :--- | :--- |\n| 103.4 使用流、管道和重定向 | 13.1, 13.4 |\n| 110.3 使用加密保护数据\
    \ | 13.1–13.5 |\n\n# 实验 14.1 验证文件\n\n# 目标\n\n本实验向你展示如何使用加密哈希来验证文件，以确认其真实性。`md5sum`\
    \ 命令是执行此任务的方法之一。\n\n# 所需材料\n\n本实验需要以下内容：\n\n- 一台运行 Fedora 20 Linux 的计算机\n\n预计完成时间：10\
    \ 分钟\n\n# 活动背景\n\n在 Linux 中，你有几种方法可以验证文件，例如 `sum`、`cksum` 和 `md5sum` 命令。然而，`md5sum`\
    \ 更加可靠。使用加密哈希来验证文件是否真实。`md5sum` 生成的哈希值由 32 个字符组成。如果接收到的文件的哈希值与发送者的哈希值相同，则文件是真实的；如果哈希值不符，则文件可能被篡改。\n\
    \n# 活动步骤\n\n1. 启动 Linux。切换到终端2 (Ctrl+Alt+F2) 并登录 user1。\n2. 为了熟悉 `md5sum` 命令，输入\
    \ `man md5sum`。阅读信息，按 `q` 退出。\n3. 将程序复制到你的家目录：`cp /bin/bash ~`。\n4. 在屏幕上显示显示，输入\
    \ `md5sum -b bash`。`-b` 选项用于二进制文件。输出类似于：\n\n```\n26b6100fa713bb559a7407fe2bcc\n\
    ```\n5. 再次生成哈希，这次将其输出到文件，输入 `md5sum -b bash > bash.md5`。\n6. 为了验证文件，输入 `md5sum\
    \ -c bash.md5`。你会看到 bash: OK。`-c` 选项等同于 `--check`，它告诉 md5sum 进行比较。\n7. 接下来，通过在文件末尾写入字符来更改\
    \ bash 文件。输入 `echo \"123\" >> bash`。\n8. 输入 `md5sum -c bash.md5` 后验证文件。由于文件已被修改，你会看到：\n\
    \n```\nbash: FAILED\nmd5sum: WARNING: 1 computed checksum did NOT MATCH\n```\n\
    \nmd5sum 使用“checksum”一词而不是更精确的“hash”。\n\n9. 输入 `rm bash` 删除 bash 文件。\n10. 如果你计划继续下一个实验，请保持登录；否则，关闭计算机。\n\
    \n# 复习题\n\n1. 下列哪条命令将名为 myfile 的哈希与存储的哈希进行比较？\n   a. md5sum -c myfile\n   b. md5sum\
    \ --check myfile.md5\n   c. md5sum -c myfile -md5\n   d. md5sum --check myfile\
    \ myfile.md5\n2. md5sum 命令默认将它的哈希输出到 STDOUT。对还是错？\n3. md5sum 命令产生的加密哈希由多少个字符？\n\
    \   a. 16\n   b. 32\n   c. 64\n   d. 128\n4. 与“hash”，md5sum 使用哪个术语？\n   a. Parity\n\
    \   b. Checksum\n   c. Block check character\n   d. CRC\n5. md5sum 命令只能检查二进制文件以查看其是否真实。对还是错？\n\
    \n"
