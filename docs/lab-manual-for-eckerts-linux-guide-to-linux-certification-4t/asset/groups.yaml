    \n- 2. Which command from the ImageMagick suite can convert a bitmap image to\
    \ a compressed image file?\n  a. file\n  b. bmpcvt\n  c. convert\n  d. jpeg\n\n\
    - 3. A grayscale jpeg file is usually larger than a color bmp file. True or False?\n\
    \n- 4. Write the command that will show a list of files that have a jpeg extension\
