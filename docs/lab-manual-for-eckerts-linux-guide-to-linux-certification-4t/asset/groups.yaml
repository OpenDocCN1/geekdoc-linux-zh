    ### 实验目标\n\n本实验向你展示如何在不重启 Linux 的情况下更改任何接口参数。特别是，它展示了如何更改以太网 NIC 的 IP 地址、子网掩码、广播地址和\
    \ MAC 地址。你还学习了如何为访问本地网络网段的数据包设置默认路由。\n\n### 所需材料\n\n本实验需要以下材料：\n\n- 一台运行 Fedora\
    \ 20 Linux 的计算机\n- 局域网连接\n\n预计完成时间：15 分钟\n\n### 背景知识\n\n处理接口和 IP 地址时使用的主要命令是 `ifconfig`（全称为\
