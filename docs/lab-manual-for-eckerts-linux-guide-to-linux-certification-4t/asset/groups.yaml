    \ blank DVDs\n\n# Acknowledgments\n\nThanks to Natalie Pashoukos, Cengage Learning\
    \ Senior Content Developer, for giving me an opportunity to update this lab manual;\
    \ Brooke Greenhouse, Senior Content Project Manager, for coordinating this book’s\
