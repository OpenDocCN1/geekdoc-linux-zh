    # Lab 6.1 Installing Fedora Linux with a Live Media Edition


    # Objectives


    The goal of this lab is to learn how to prepare a USB flash drive to start a Linux
    Fedora 20 installation.


    # Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux

    - 2 GB or more USB flash drive

    - a computer that can boot to a USB drive

    - Knowledge of the keystroke for starting your computer to a boot menu

    - An Internet connection


    Estimated completion time: 30 minutes


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_71_0.png)


    # Activity


    1. Log to the GUI on your Linux computer as User1.

    2. Start a Web browser, and go to www.fedoraproject.org. Click the Workstation
    link.

    3. Click Download now and then click Download. Save the file in the Documents
    directory.

    4. After the download has finished, open a terminal window. (If you forgot how
    to open a terminal window, recheck step 4 in Activity 5.1)

    5. Change to the Documents directory by typing cd ~/Documents and pressing Enter.

    6. Insert the USB drive in a USB port on your computer. Wait a minute or so for
    it to automount. When prompted, click Open with Files.

    7. Type su and press Enter, when prompted, enter the root password. Type umount
    /dev/sdb1 and press Enter to mount the USB drive. You may need to replace the
    correct name. If the mount command didn''t work, use dmesg and press Enter to
    see which device is is using and repeat the mount command.

    8. Type ls and press Enter to see the downloaded file. You will use the name of
    the file in the next command. dd if=NameOfISO=/dev/sdb1 and press Enter (replacing
    NameOfISO with the name of the file listed by ls). This command writes the file,
    using a sector-by-sector, to your USB drive. It may take several minutes to complete.


    9. After the file has been copied, leave the USB flash drive inserted and restart
    your computer. As the computer starts, press the key to start to a boot menu (sometimes
    F12 or Delete). When you see the boot menu, highlight the USB option as the boot
    device and press Enter. The Linux welcome window is displayed.

    10. You can press Enter to boot to LinuxLive or simply wait for the system to
    boot automatically. Allow the system to boot automatically. After the system finishes
    booting, you have the options Try Fedora or Install to Hard Drive. If you want
    to the latest version of Fedora, go ahead and click Try Fedora. When you''re finished,
    remove the USB drive, and shut down the system.


    # Review Questions


    1. If you want to try Fedora Linux without actually installing it, what type of
    Linux distribution should you download?


    + a. 64-bit version

    + b. Live media edition

    + c. Full installation DVD

    + d. Bootable installation version


    2. What command do you use if you want to write an ISO file directly to a device,
    using a sector-by-sector copy?


    + a. dd

    b. cp -uselectors

    c. dump

    d. mv


    3. Which command helps you determine which device a USB drive is using?


    a. mount

    b. usbdev

    + c. dmesg

    d. showdev


    # Lab 6.2 Troubleshooting a Linux Boot


    # Objectives


    The goal of this lab is to learn how to troubleshoot the boot process using the
    journalctl command.


    # Materials Required


    This lab requires the following:


    - A computer running Fedora 20


    Estimated completion time: 15 minutes


    # Activity


    1. Log to the GUI on your Linux computer as User1.

    2. Open a terminal window. Change to the root user by typing su and pressing Enter.
    Type the root password when prompted.

    3. Type man journalctl and press Enter to see the manual page for the journalctl
    command.

    4. Scroll through the manual page until you see the -b option. Read the information
    about the -b option.

    5. Press Enter to exit the manual page.

    6. Type journalctl -b 0 and press Enter to see the log information. Browse through
    the output to see what information is provided. If your system is having difficulties
    booting such as taking a long time, the provided information may be helpful in
    determining what the problem is. It will also tell you which image and options
    were used to boot the system. Press q when you are finished.

    7. Type journalctl -b 1 and press Enter to see information about the first boot.
    Press q when you are finished.

    8. Reboot the Linux system and when the boot menu is displayed, choose the second
    boot option which boots to Linux rescue image. Logon as User1.

    9. Open a terminal window and type su and press Enter. Type the root user''s password
    when prompted.

    10. Type journalctl -b 0 and press Enter to see information about the last boot.
    Notice that the name of the boot image specifies the rescue image. Press q and
    shut down the system.


