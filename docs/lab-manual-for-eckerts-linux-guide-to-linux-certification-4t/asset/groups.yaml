    \ `-t` 选项指定的生存时间（TTL）值为 20 的 ping 消息。TTL 值指定了 ping 消息在发出之前可以穿越的路由器数量。20 的 TTL\
    \ 应该允许数据无论你在哪里都能到达该站点。接下来，输入 `ping -c 5 -t 1 www.google.com`。ping 将超时，因为数据包需要穿越多个路由器。\n\
    \n# 第12 章 网络配置\n\nIP 分片会减慢网络并引起问题。默认情况下，如果数据超过最大传输单元（MTU），IP 会进行分片。要确定可以在不分片的情况下发送的最大包大小，使用\
    \ `-M` 选项，输入 `ping -M do -c 5 -s 1472 www.google.com` 并按回车。ping 应该通过。接下来，输入 `ping\
    \ -M do -c 5 -s 1473 www.google.com` 并按回车。你可能会收到 Frag needed and mtu=1500）。`-M\
    \ do` 选项告诉 ping 不要分片，因此数据包中的 DF（不分片）标志已设置。\n\n- 13. 输入 `man traceroute` 并按回车查看页面并检查可用选项。（你在实验中使用了\
