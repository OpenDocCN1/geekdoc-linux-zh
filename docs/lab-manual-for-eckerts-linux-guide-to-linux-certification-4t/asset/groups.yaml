    # 实验 7.2 定制 BASH 历史记录功能


    # 目标


    本实验的目标是让你熟悉各种定制 BASH 命令历史记录功能的方法。


    # 所需材料


    本实验需要以下设备：


    +   - 一台运行 Fedora 20 Linux 的计算机


    | 预计完成时间：20 分钟 |


    # 活动步骤


    +   1. 按 Ctrl+Alt+F2 切换到命令行终端 (tty2)，如有必要，以 User1 身份登录终端。不要以 root 登录。

    2. 为了在系统关闭并重启后记住历史命令，Linux 使用存储在主目录下的 `.bash_history` 文件。如有必要，输入 `cd` 并按回车进入主目录。

    3. 输入 `tail .bash_history` 查看 `.bash_history` 文件的最后几行。文件的最后一行不是 `tail .bash_history`，之前的命令也不是
    `cd`，这意味着 `.bash_history` 文件还没有更新。


    4. 输入 `history` 并按回车。显示的最后一行是 history 命令，上一行是 `tail .bash_history`。因此，history
    命令似乎是最新的，尽管 `.bash_history` 文件不是。这是因为命令被保存在了系统内存中。在接下来的步骤中，你将看到 `.bash_history`
    文件何时更新。


    5. 输入 `echo ''This is my command''` 并按回车。输入 `tail .bash_history` 并按回车。你没有看到最近输入的命令。


    当你使用 `echo` 命令时，最好在字符串周围使用单引号而不是双引号。单引号可以防止 shell 尝试解释特殊字符。


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_80_0.png)


    6. 输入 `logout` 并按回车。再次以 User1 登录。


    7. 输入 `tail .bash_history` 并按回车。你在列表末尾看到了 `echo ''This is my command''`，这意味着在你注销时
    `.bash_history` 文件被更新了。


    8. 如果你频繁使用该命令，`.bash_history` 文件可能会变得很大。大部分内容会快速滚动，但你可以使用 `more` 或 `less` 命令来防止滚动。输入
    `history less` 并按回车。你应该能在屏幕上看到最旧的命令。按空格键查看文件的更多内容，然后按 `q` 退出。


    9. 你可以使用 `wc`（单词计数）命令来查看 `.bash_history` 文件中到底有多少条命令。要统计行数而不是单词数，输入 `wc -l .bash_history`
    并按回车。你会看到类似下面的输出：


    ```

    105 .bash_history

    ```


    10. 上述输出显示历史文件中存储了 1000 条命令。历史文件的默认限制为 1000。一个名为 `HISTSIZE` 的环境变量被用于设置此限制。要查看你系统上
    `HISTSIZE` 的值，设置 `grep HISTSIZE` 并按回车。你应该看到 `HISTSIZE=1000`。


    11. 如果你想将限制改为 5000 条命令，必须更改启动脚本 `.bashrc` 中的 `HISTSIZE`，它存储在你的主目录下。`HISTSIZE`
    变量在该文件中定义，可以使用任何文本编辑器更改该值。在 Fedora 中，`HISTSIZE` 默认设置为 1000 且在 `.bashrc` 中设置。然而，如果你在
    `.bashrc` 中创建该变量，就会覆盖默认值。要在不使用文本编辑器的情况下在 `.bashrc` 中创建一个值为 5000 的变量，输入 `echo ''HISTSIZE=5000''
    >> .bashrc` 并按回车。这个新值将在下次 BASH shell 读取 `.bashrc` 文件时使用——通常是在你登录时。


    12. 输入 `logout` 并再次以 User1 登录。


