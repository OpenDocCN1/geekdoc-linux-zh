    \ --version` 并按回车。你会看到未压缩文件 (rpm-) 和压缩文件 (rpm) 均可工作。（请确保在前面的命令中输入两个 \"-\" 字符），\n\
    \n- 7. 当你压缩程序时，启动时间会稍微长一点，因为它必须先解压缩。首先使用 `time` 命令比较两个程序运行所需的时间。首先输入 `./rpm --version`\
