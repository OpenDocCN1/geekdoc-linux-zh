    # Lab 12.3 Installing and Configuring NcFTPd


    # Objectives


    FTP is a common method of transferring files over a network. One widely used FTP
    server for Linux is WuFTP, included in nearly all Linux distributions. However,
    it can be difficult to configure and has security vulnerabilities. Experienced
    Linux users and administrators often use other FTP server software, such as NcFTPd.
    In this lab, you download, install, and configure NcFTPd.


    # Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux

    * A Web browser and access to the Internet


    Estimated completion time: 45 minutes


    # Activity


    +   1. Start your computer, if necessary, and log in to the GUI as User1. A Web
    browser and go to www.ncftp.com/ncftpd.

    2. Read the home page to learn the benefits of using this FTP server. Note that
    NcFTPd doesn''t use inetd or xinetd, which improves performance, and doesn''t
    have to call other programs, such as /bin/ls, to do its job.'
