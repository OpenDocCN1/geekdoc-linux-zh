    本实验需要：\n\n- 一台运行 Fedora 20 Linux 的计算机\n- 互联网连接\n\n预计完成时间：30 分钟\n\n## 实验步骤\n\n\
    - 1. 切换到 tty2 并以 root 用户身份登录。\n\n- 2. 输入 `ifconfig` 并按回车查看页面，向下滚动到 Options（选项）部分。注意你可以通过\
