    # # Lab 13.1 Installing and Configuring a Telnet Server


    # ## Objectives


    The goal of this lab is to learn how to install a Telnet server and connect to
    it.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux

    - An Internet connection


    Estimated completion time: 15 minutes


    # ## Activity Background


    Although Telnet isn''t a secure method of establishing a communication with a
    Linux computer, you might need to have it available in case your client computer
    doesn''t have the SSH client installed, for example.


    # ## Activity


    +   1. Start your Linux computer, log in to the GUI, and then open a terminal
    window. To switch to the root user, type **su** and press **Enter**, then enter
    the password.

    2. Type **yum install telnet-server** and press **Enter**. Press y and **Enter**
    to confirm.

    3. Next, install the telnet client package. Type **yum install telnet** and press
    **Enter**. Press y and **Enter** to confirm.

    4. To start the telnet server, type **systemctl start telnet.socket** and press
    **Enter**.

    5. To check the status of the telnet server, type **systemctl status telnet.socket**
    and press **Enter**. You see output similar to the following:


    ```

    Loaded: loaded (/usr/lib/systemd/system/telnet.socket; enabled disabled)

    Active: active (listening) since 2015-01-10 12:51:23 MST 1 3min ago

    Docs: man:telnetd(8)

    Listen: [::23 (Stream)

    Accepted: 0; Connected: 0

    ```


    +   6. Type **telnet localhost** and press **Enter** to log in to the telnet server.
    You see output similar to the following:


    ```

    Trying 127.0.0.1 ...

    Connected to localhost.

    Escape character is ''^''

    Fedora release 20 (Heisenbug)

    Kernel 3.11.0-301.fc20.x86_64 on an x86_64 (1)

    localhost login:

    ```'
