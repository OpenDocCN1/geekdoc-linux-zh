    \ i\n   c. -i\n   d. z\n\n# 实验 3.4 显示二进制数据\n\n## 目标\n\n本实验的目标是观察如何以各种格式（如十进制、十六进制和八进制）显示二进制数据文件。\n\
    \n## 所需材料\n\n本实验需要：\n\n- 一台运行 Fedora 20 Linux 的计算机\n\n预计完成时间：30 分钟\n\n## 实验背景\n\
    \n有时你需要搜索二进制文件以找到文本字符串；例如，你可能想知道程序或数据文件的版本号。在这种情况下，直接查看二进制文件可能比使用通常用于打开文件的程序更简单。当你想要查看二进制数据时，工具有时会转换为方便使用的格式，但有时并不方便。这些工具之一是\
