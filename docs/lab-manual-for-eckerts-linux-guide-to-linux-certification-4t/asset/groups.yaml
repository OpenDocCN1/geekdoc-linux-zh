    \ 地址解析为 MAC 地址。\n\n- 8. 再次启用 ARP，输入 `ifconfig eth0 arp` 并按回车。ping 默认网关以验证你可以这样做。按\
    \ Ctrl+C 退出。\n\n- 9. 输入 `ping` 并按回车查看帮助页。你在实验中使用了 `-s`、`-t`、`-c` 和 `-M` 选项，所以请阅读相关介绍。完成后，按\
    \ `q` 退出页面。\n\n- 10. 输入 `ping -c 5 www.google.com` 并按回车，向 www.google.com 发送五个\
    \ 64 字节的 ping 消息（默认默认大小）。注意时间值。接下来，输入 `ping -c 5 -s 5000 www.google.com` 并发送五个\
