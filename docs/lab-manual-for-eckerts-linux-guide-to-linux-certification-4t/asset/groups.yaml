    # # 4.2 Working with BASH Aliases


    # ## Objectives


    The goal of this lab is to become familiar with BASH aliases. You learn how to
    display, add, delete, and redefine aliases.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    > Estimated completion time: 20 minutes


    # ## Activity Background


    Many Linux commands are affected by aliases that have been defined. For example,
    you learned in Chapter 4 when you use the mv command as root, you''re actually
    running mv -i because an alias has been defined to change mv to mv -i. Note that
    the default aliases are dependent on the shell you are running and the user you
    are logged on as. In this lab, you create BASH aliases that are in effect while
    you are logged in and are removed after you log out. If you want them to be permanent,
    you must add them to a startup script. With Fedora, you can add them to the .bashrc
    file in your home directory.


    # ## Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log
    in to the terminal as root.'
