    # 1.1 Becoming Familiar with the Squid Proxy Server


    # Objectives


    The goal of this lab is to become familiar with a useful open-source software
    package that runs on Linux. The Squid proxy server is a great example of a high-quality
    software package that''s free and well supported and runs on many different hardware
    and software platforms.


    # Materials Required


    This lab requires the:


    +   - An Internet connection

    - A Web browser on any computer (The Labs in this chapter do not require your
    Linux machine, any computer with a Web browser and an Internet connection will
    suffice)


    Estimated completion time: 30 minutes


    # Activity Background


    There are thousands of software packages you can run on Linux. The Squid proxy
    server is a particularly useful because it can substantially reduce the Internet
    bandwidth required for Web browsing and improve the performance of FTP file transfers.
    Squid serves as a good example of the support available for open-source software.


    # Activity


    +   1. Start your Web browser.

    2. Type http://www.squid-cache.org in the address bar, and press Enter to display
    the Squid Proxy Cache page.

    3. Click the About Squid link at the left. Spend some time reviewing the information.
    Next, click the Why Squid link and learn why many Internet providers use Squid.

    4. Click the Squid Deployment Case-Studies link at the left. Click the Wikipedia
    Squid Deployment link, and spend some time reading about how Wikimedia Squid uses.

    5. Click the FAQ link at the left, and then click the AboutSquid link. Browse
    through the page, and notice the plethora of operating systems Squid supports.

    6. If you''re continuing to the next lab, leave your Web browser open; otherwise,
    close it.'
