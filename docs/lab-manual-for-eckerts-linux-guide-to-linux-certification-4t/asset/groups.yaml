    # # Lab 4.1 Exploring the Filesystem Hierarchy Standard


    # ## Objectives


    The goal of this lab is to learn about the Filesystem Hierarchy Standard (FHS)
    by exploring the FHS Web site. When you understand FHS, you know where files should
    be placed in the file system.


    # ## Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # ## Activity


    +   1. Log in to your Linux computer as an ordinary user.

    2. Start a Web browser, and go to www.pathname.com/fhs/.

    3. Click the FHS 2.3 HTML link, and then examine the Table of Contents.

    4. Click the *The Filesystem* link and read the “Chapter 2. The Filesystem.” It
    explains that the FHS applies to any file system supporting the same basic security
    features in most UNIX file systems. These file systems include Linux but not non-UNIX
    operating, such as Windows. You also learn that files are placed in four categories:
    shareable, unshareable, variable, and static. Press PageUp or Home to return to
    the Table of Contents.

    5. Click the *Purpose* link under the “Root Filesystem.” Note the caution that
    “Applications must never create or require special files or subdirectories in
    the root directory” and the reasons for this caution. Users shouldn’t do this,
    either, but if permissions are set up correctly, the only user capable of doing
    so is the root user.

    6. Go back to the Table of Contents. Click the *//bin : Essential user binaries
    (for use by all users)* link, and read the “Purpose” section. The /bin directory
    is required so that the system can run and be administered at a basic level, even
    when no other file systems are mounted. This also tells you the files that must
    be in this directory.

    7. Go back to the Table of Contents. Click the *//etc : Host-specific system configuration*/
    link, and read the “Purpose” and “Requirements” sections. The /etc directory and
    subdirectories contain files for configuring the system, daemon, and applications.
    Executable programs (binaries) can be stored in this directory structure, according
    to FHS.

    8. Read the “Specific Options” section, which states that certain subdirectories
    must exist but only “if the corresponding subsystem is installed.” The best example
    is the X11 subdirectory, which must exist only if you’re running the X Window
    system (the graphics system). If your Linux computer is running as a server and
    has no graphical system installed, the X11 subdirectory isn''t needed. Some Linux
    distributions install it anyway.'
