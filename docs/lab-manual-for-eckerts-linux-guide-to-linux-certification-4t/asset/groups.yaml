    ## 11.3 Installing and Removing Packages


    ### Objectives


    Most Linux distributions use the Red Hat Package Manager (RPM) to install and
    uninstall software. You will use rpm to perform basic queries on installed packages
    and then use yum to install and perform other package management tasks. The yum
    program works with rpm packages and uses repositories on the Internet. In this
    lab, you learn how to do the following:


    - Display all installed packages

    - Install packages using yum

    - View configured package repositories

    - Uninstall packages


    ### Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux

    - Fedora 20 installation DVD


    Estimated completion time: 15 minutes


    ### Activity


    1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2**, and log
    in as the root user.


    2. To see a list of all packages installed on your computer, type **rpm -qa**
    and press **Enter**. Notice that they''re not listed in alphabetical order. To
    sort them alphabetically and display a page at a time, type **rpm -qa | sort |
    more** and press **Enter**. When you''re finished reviewing the list, press **q**
    to quit more. To see whether a package named cracklib is installed, type **rpm
    -qa | grep cracklib** and press **Enter**. If it is installed, you will see a
    couple of lines of output using the string `cracklib`. Use the same method to
    check for a package named rdesktop. You shouldn''t see any output because the
    package isn''t installed.


    3. Type **yum q x*** and press **Enter**. You see all installed packages that
    begin with x. Next, you''ll use yum which also works with rpm packages.


    4. Type **yum search rdesktop** and press **Enter**. You see output that lists
    the name of the package and a description of the package.


    5. Type **yum list rdesktop** and press **Enter** to see version detailed information
    about the package. In the listing, look for the line that starts with Repo: This
    is the repository in which rdesktop package can be found.


    6. To see a list of repositories used by yum to find packages, type **yum repolist**
    and press **Enter**. This shows basic information about the repositories used
    by yum.


    7. For more detailed repository information, type **yum repoinfo** and press **Enter**.
    You see detailed information about the repositories including the URL used to
    access each repository.


    8. To view your yum configuration file that shows the repositories, type **ls
    /etc/yum.conf** and press **Enter**. Read the last few lines of the file where
    you are told that you can add your repositories in the yum.conf file or you can
    create files with the .repo extension that contain repository information. Type
    **q** to quit less.


    9. Type **ls /etc/yum.reposd** and press **Enter** to see the list of repos. Type
    **cat /etc/yum.reposd/fedora.repo** and press **Enter** to see one of the repo
    configuration files.


    10. Type **yum-config-manager** and press **Enter** to see the yum configuration
    options. You can use this command to configure yum options and add new repositories
    rather than editing the configuration files. For example, to add a repository,
    type **yum-config-manager --add-repo repositoryurl** where repositoryurl is the
    url of the repository.


    11. Install the rdesktop package by typing **yum install rdesk*** and press **Enter**.
    Press **y** and **Enter** when prompted. You can use wildcards instead of typing
    the entire name as long as there are no conflicts.


    12. To verify that the rdesktop package is installed, type **yum info rdesk***
    and press **Enter**. You see a list of information. On the line that starts with
    Repo you will see that the package is installed.


    13. Next, uninstall the package with the remove option by typing **yum remove
    rdesktop** and pressing **Enter**. Press **y** and **Enter** to confirm.


    14. Verify that the package was uninstalled by typing **whereis rdesktop** and
    pressing **Enter**. You should see no rdesktop; which means the package can''t
    be found.


    15. Type **yum info rdesk** and press **Enter**. Look at the line that begins
    with Repo: The line tells you that the package can be found in the updates/20/x86_64
    repository (“x86_64”) will be “i386” if you are using the 32-bit version of Fedora
    20.


    16. If you plan to continue to the next lab, stay logged in; otherwise, shut down
    the computer.


    ### Review Questions


    1. Which command displays all packages installed on your computer?

    a. rpm --list

    b. rpm -q

    c. rpm -qa

    d. rpm -qa | all


    2. Which command displays the names of all installed packages starting with y?

    a. rpm -q y*

    b. rpm -qa y*

    c. rpm -qp y*

    d. rpm -qa | grep y


    ## Chapter 11 Compression, System Backup, and Software Installation


    ### Objectives


    Sometimes files are erased from a hard disk because of a user mistake or an attack.
    If these files are part of a package, the programs in the package might not run
    or might not run correctly. You need some way to detect when files are missing
    and a means to replace them. Package managers can do that for you. This lab shows
    you how the Red Hat Package Manager (RPM) and yum perform these functions.


    ### Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux

    - Fedora 20 installation DVD


    Estimated completion time: 20 minutes


    ### Activity


    1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and log in
    as the root user, if necessary.


    2. The gzip package is installed on most Linux computers. To find its package
    name, type `rpm -qa | grep gzip` and press Enter. It''s probably named `gzip-1.6-2.fc20.x86_64`
    or similar.


    3. To get the package description by using the -i option, type `rpm -qi gzip-1.6-2.fc20.x86_64`
    (or i386 if you are using the 32-bit version) and press Enter.


    4. To see what files are part of the package, using the -l option, type `rpm -ql
    gzip-1.6-2.fc20.x86_64` (or i386 if you are using the 32-bit version) and press
    Enter.


    5. To see whether all files part of the package are actually installed on the
    hard disk, use the -V option by typing `rpm -V gzip-1.6-2.fc20.x86_64` (or i386
    if you are using the 32-bit version) and press Enter.


    6. Delete some files by typing `rm /usr/share/man1/gzip*` and pressing Enter.
    Press **y** and **Enter** if you''re prompted to confirm.


    7. To see how rpm handles the files, type `rpm -V gzip-1.6-2-fc20.x86_64` (or
    i386 if you are using the 32-bit version) and press Enter. You should see output
    similar to:

    missing d /usr/share/man1/gzip.1gz


    8. To fix the problem, you need to reinstall the package. Type `yum reinstall
    gzip` and press Enter. Press **y** and **Enter** to confirm.


    9. Check again whether all files are installed, type `rpm -V gzip-1.6-2-fc20.x86_64`
    and press Enter. Nothing is displayed; no files are missing.


    Note that yum does not contain a verify option like rpm does; however, there is
    a plugin yum-verify that will perform a similar function as rpm -V. The yum-verify
    plugin can be installed using yum install yum-verify.


    10. In previous steps, you checked whether any files were missing from the hard
    disk. Check whether there are any missing files for all packages installed on
    your system, type `rpm -Va` and press Enter. This process takes a while.


    11. If you plan to continue to the next lab, stay logged in; otherwise shut down
    the computer.


    ### Review Questions


    1. Which command displays information about the words-2-17 package?

    a. rpm -i words-2-17

    b. rpm -qa words-2-17

    c. rpm -iq words-2-17

    d. rpm -qi words-2-17


    2. Which command shows you the files that are part of a package?

    a. rpm -q words-2-17

    b. rpm -qa words-2-17

    c. rpm -ql words-2-17

    d. rpm -qi words-2-17


    3. Which command shows you files that are part of a package but not installed
    on the hard disk?

    a. rpm -q words-2-17

    b. rpm -ql words-2-17

    c. rpm -V words-2-17

    d. rpm -Z words-2-17


