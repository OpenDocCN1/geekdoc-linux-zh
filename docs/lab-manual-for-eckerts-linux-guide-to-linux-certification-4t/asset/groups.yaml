    # Lab 12.1 Configuring Ethernet Interfaces


    Objectives

    This lab shows you how to change any interface parameter in real time without
    having to restart Linux. In particular, it shows you how to change an Ethernet
    NIC''s IP address, subnet mask, broadcast address, and MAC address. You also learn
    how to set the default route for packets going outside a local network segment.


    Materials Required

    This lab requires the following:


    +   * A computer running Fedora 20 Linux

    * A LAN connection


    Estimated completion time: 15 minutes


    Activity Background

    The main command you use when dealing with interfaces and IP addresses is ifconfig
    (which stands for "interface configuration"). In this lab, you configure an Ethernet
    NIC.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_137_0.png)


    > The Windows version of ifconfig is ipconfig. Both commands perform similar functions,
    but ifconfig has more capabilities for configuring a network interface. Windows''s
    ipconfig is used mainly to display IP configuration information.


    You also learn to use the route command to set the default gateway, which is the
    router acting for communication to networks outside a local network segment.


    # Activity


    +   1. Start your Linux computer. Switch to a command-line terminal (tty2) by
    pressing Ctrl+Alt+F2, and log in as the root user.


    +   2. Issuing ifconfig with no parameters displays a status message for all interfaces.
    Type ifconfig and press Enter. You should see output similar to the following
    when the only interface is a single Ethernet NIC (eth0):


    ```

    eth0: flags=4163<UP,RUNNING,MULTICAST> mtu 1500

    inet:10.10.128.3 netmask:255.255.0.0 broadcast 0.0.0.0

    inet6: fe80::20c:29ff:fe8d:be36 prefixlen 64 scope:0x20<link>

    eth0 00:2c:29d8:be36 txqueuel 1000 (Ethernet)

    ..

    lo: flags=73<UP,LOOPBACK,RUNNING> mtu 65536

    inet 127.0.0.1 netmask:255.255.255.0

    ..

    ```'
