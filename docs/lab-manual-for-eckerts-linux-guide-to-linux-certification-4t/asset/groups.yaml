    # Lab 10.3 Finding Broken Links and Files with No Owners


    # Objectives


    The goal of this lab is to learn how to find and fix files with no owners and
    symbolic links that no longer point to a file. Both are common system administration
    tasks.


    # Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_117_0.png)


    If you already have accounts for users named Julie and Mike, substitute other
    names in this lab.


    # Activity


    +   1. Start your Linux system, if necessary. Switch to a command-line terminal
    (tty2) pressing Ctrl+Alt+F2, and log in to the terminal as root.

    2. To create a user account for this lab, type useradd julie and press Enter.
    Log in to Julie''s user account by typing su julie and pressing Enter.


    When you''re the root user and use the su command to become another user, you
    don''t have to enter the user''s password.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_117_1.png)


    +   3. Go to Julie''s home directory by typing cd /home/julie and pressing Enter.
    Type touch file1 and press Enter to create a file in this directory. Create three
    or four more files, using whatever names you like.

    4. Type -l and press Enter to see the files in Julie''s home directory. Note that
    Julie is both the user owner and group owner of the files you created.

    5. To make other users read files in Julie''s home directory, take away their
    read permission by typing chmod - * and pressing Enter. Type ls -l and press Enter
    to verify that only Julie and the root user can read her files. Type exit and
    press Enter to log out of Julie''s account. You''re logged in as root. Type cd
    /home/julie and press Enter.

    6. To delete Julie''s user account, type userdel julie and press Enter.

    7. Type ls -l and press Enter to see in Julie''s home directory. The user owner
    is now a number, such as 1002, instead of the name “Julie.” The group owner is
