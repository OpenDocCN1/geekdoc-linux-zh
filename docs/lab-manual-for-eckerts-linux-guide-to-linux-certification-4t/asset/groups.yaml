    # Lab 14.4 Exchanging and Signing Keys


    # Objectives


    This lab shows how to exchange keys with other users and sign their keys, creating
    a “web of trust,” which is a decentralized method of establishing authenticity
    between users. (The centralized method is using a certification authority to establish
    authenticity.)


    # Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


