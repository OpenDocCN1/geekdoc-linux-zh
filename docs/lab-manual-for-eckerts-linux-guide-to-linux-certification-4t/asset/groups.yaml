- md: '

    You can recover disk space by deleting old files that are no longer needed or
    moving them to other media (tape, optical discs, flash drives, and so on). To
    identify old files, you can check their timestamps. Each file has three types
    of timestamps, and administrators should know how to work to help them with file-housekeeping
    tasks.


    # Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # Activity Background


    Linux files have three types of timestamps:


    - The creation time (atime) is set to the current time and date automatically
    when the file or directory is created. It is also changed to the current time
    when a file''s permissions, attributes, owners, or contents change.

    - The access time (atime) is changed to the current time and date automatically
    when the file is opened.

    - The modification time (mtime) is changed when the file is written to and closed.


    # Activity


    1. If necessary, start your system, switch to tty2, and log in to the terminal
    as root.

    2. If necessary, switch to Julie''s home directory (created in Lab 10.3) by typing
    cd /home/julie and pressing Enter.

    3. To remove all files in this directory, type rm * -I and press Enter. When you''re
    prompted with rm: remove all arguments?, type y and press Enter.

    4. Create a new file called file1 with the touch command. Type ls -l and press
    Enter. Normally, the ls command displays mtime, as shown in this example:

    5. To display the file''s ctime, use the --time option. Type ls -l --time=ctime
    and press Enter. (Note: Make sure you use two hyphens before the time option.)
    In this example, the date and time are the same as with mtime:

    6. To display a file''s atime, use ls -l --time=atime and press Enter. As shown
    in the example, the atime is the same as the mtime and value:

    7. You can''t use only one command to display atime, ctime, and mtime at once.
    To do this, you need to create an alias that combines three commands by typing
    alias dir="ls -l --time=ctime | grep root;ls -l grep root;ls -l --time=atime |
    grep root" and pressing Enter.


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    ```


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file2

    ```


    8. Type dir and press Enter. As shown in the following example, the first line
    of output shows the cime, the second line shows the mtime, and the third line
    shows the atime:


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    ```


    9. Open the file1 to see how the timestamps are affected, cat file1 and press
    Enter. (The file is empty, so there''s no output from the cat command, but the
    atime is changed because the file was accessed.) Type dir and press Enter. Only
    the atime should have changed, as you have:


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:40 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:47 file1

    ```


    10. To modify the file with the editor, type vi1 and press Enter. Enter insert
    mode by typing i. To add file content, this is a test. Press Esc to go back to
    command mode, and then you type: :wq and press Enter.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_121_0.png)


    > You could simulate modifying the file by typing file1 and pressing Enter.


    11. Type dir and press Enter. Notice that all times have changed:


    ```

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    ```


    You probably modified the file to change you mtime and atime because you had access
    to the file to modify it. However, ctime also changes, which might not make sense
    but that''s how time values work in the Linux system.


    12. If you change a file''s permissions, do its timestamps change? If so, which
    of the three times change? Type chmod 700 file1 and press Enter, and then type
    dir and press Enter. You see that the ctime changes:


    ```

    -rw------- 1 root root 0 Oct 23 09:04 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    -rw-r--r-- 1 root root 0 Oct 23 08:50 file1

    ```


    13. If you change a file''s owners? Type chown nobody file1 and press Enter, and
    again, only the ctime changes. You get the same result if you change a file''s
    attributes.


    14. One attribute affects time and date: The A attribute affects a file''s atime.
    When this attribute is set, a file''s atime isn''t updated when the file is accessed.
    To set this attribute, chattr +A file1 and press Enter. Type dir and press Enter
    to see the current atime value. Access the file using cat, and display the directory
    listing again with dir. You should see that the atime hasn''t changed, despite
    accessing the file.


    # Lab 10.4 Understanding File Timestamps


    The A attribute is useful when you have frequently accessed files and you don''t
    care about their atime values being updated. Using this attribute saves a little
    of processing time and disk I/O.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_122_0.png)


    15. As mentioned, you can change a file''s timestamps with the touch command.
    When you use touch with no options, all three timestamps are updated. Type touch
    file1 and press Enter, then type dir and press Enter to see that all three times
    are the same.


    16. The main page for the touch command states that the -a option specifies only
    the atime. Wait a minute or two, and then type touch -a file1 and press Enter.
    Type dir and press Enter. As shown, both the atime and ctime values change:


    ```

    -rwx 1 root 0 Oct 23 09:15 file1

    -rwx 1 root 0 Oct 23 09:13 file1

    -rwx 1 root 0 Oct 23 09:15 file1

    ```


    17. Similarly, the -m option specifies only the mtime. Wait a minute or two, and
    then touch -m file1 and press Enter. Type dir and press Enter. Both the mtime
    and ctime values change.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_122_1.png)


    Anything you do to a file, except open it and read it, causes the ctime to change.
    Therefore, ctime can be used as an indication that something happened to the file.


    18. You can use the atime to search for files that haven''t been accessed in one
    year, for example, type find -atime 365 and press Enter. The 365 is the number
    of days since the file was last accessed.


    19. To use search for files based on their mtime values, use find -mtime 5 and
    press Enter, which searches for files that haven''t modified in five days.


    You can also use the -exec -or options with the command to take some action, exec
    as deleting or backing up, on files you''ve found, as in Lab 10.3.


    # CHAPTER ELEVEN


    # COMPRESSION, SYSTEM BACKUP, AND SOFTWARE INSTALLATION


    # Labs included in this chapter


    - Lab 11.1 Compressing Programs with gzip

    - Lab 11.2 Compressing Image Files

    - Lab 11.3 Installing and Removing Packages

    - Lab 11.4 Detecting and Replacing Missing Package Files

    - Lab 11.5 Backing Up to a SAMBA Share


    | Objective | Lab |

    |--- |--- |

    | 104.3 | Perform basic file management | 11.1, 11.2, 11.5 |

    | 103.3 | Use RPM and YUM package management | 11.3, 11.4 |

    | 102.5 | Control mounting and unmounting of file systems | 11.5 |

