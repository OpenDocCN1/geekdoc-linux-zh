    \n- 8. 输入 `time ./rpm- --version` 并按回车，查看未压缩程序运行所需的时间。你可能会发现花费的时间更短。\n\n你可以使用\
    \ `gzexe` 命令的 `-d` 选项将压缩程序恢复到原始未压缩状态。\n\n- 9. 输入 `rpm*` 并按回车删除你创建的两个 rpm 文件。按\
    \ y 然后按回车确认每次删除。\n\n- 10. 如果你要继续进行下一个实验，请注销并切换到 GUI；否则，关闭计算机。\n\n## 复习题\n\n- 1.\
    \ 哪个命令可以压缩 Linux 二进制程序并允许以压缩格式运行？\n  a. gzip\n  b. compress\n  c. gzexe\n  d.\
