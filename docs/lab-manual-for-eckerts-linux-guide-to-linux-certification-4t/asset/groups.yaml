    # Lab 7.3 Customizing Shell Prompts


    # Objectives


    The goal of this lab is to see how to control the most often used shell prompts:
    PS1 and PS2.


    # Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux


    Estimated completion time: 20 minutes


    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing Ctrl+Alt+F2, and if
    necessary, log in to the terminal as User1.

    2. You can configure the main BASH prompt by setting the value of the PS1 environment
    variable. For example, instead of displaying a static string as a prompt, you
    might want the string to be dynamic, such as showing the current directory or
    the current time. To have the BASH prompt display the current time in 24-hour
    format, type PS1=''\t:'' and press Enter. You should see the current time in HH:MM:SS
    format, such as 18:31:00.

    3. To display the time in 12-hour format with AM and PM indicators, type PS1=''\t@''
    and press Enter. You should see the current time in HH:MM:SS format, such as 06:31PM:.
    Notice that the AM or PM indicator replaces the spaces.

    4. Most people want the BASH prompt to display the current directory. You can
    use \w or \W to display the directory name. PS1=''\w'' and press Enter. If your
    current directory is your home directory, you will see the ~ prompt.

    5. Type cd /usr/sbin and press Enter. You should see /usr/sbin: as the prompt.

    6. Type PS1=''\w:'' and press Enter. The prompt changes to display only the subdirectory
    name.

    7. You can customize other BASH prompts: PS2, PS3, PS4. The PS2 prompt is used
    as the secondary prompt. To see how it''s used, type echo ''Hello'' (omitting
    the closing quote) and press Enter. The greater-than symbol (>) is displayed,
    indicating that BASH is waiting for you to complete the command.'
