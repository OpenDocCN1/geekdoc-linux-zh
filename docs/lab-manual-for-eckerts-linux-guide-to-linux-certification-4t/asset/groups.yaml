    \ 选项指定起始 TTL；第一次测试使用默认值，即 1。注意跟踪从网关路由器开始。要获取从路径中第五个路由器开始的跟踪信息，输入 `traceroute -f\
    \ 5 www.google.com` 并按回车。尝试其他选项，例如 `-T`（使用 TCP 代替 ICMP）。\n\n- 15. 注销并关闭计算机。\n\n\
