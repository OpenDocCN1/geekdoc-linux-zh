    inet6 fe80::2cfffe8d:be36 prefixlen=64 scope=0x20\n```\n\n8. Sometimes you need\
    \ to see an Ethernet NIC's MAC address, for example, your company uses locally\
    \ managed MAC addresses. In Step 2, the MAC address is 00:00:29:8d:be:36. You\
