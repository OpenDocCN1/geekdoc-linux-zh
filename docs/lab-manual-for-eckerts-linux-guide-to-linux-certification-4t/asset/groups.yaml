    ## Lab 2.3 Researching Hardware Support


    ## Objectives


    In this lab, you do research to see how well Linux supports the latest hardware,
    such as USB 3.0 and 802.11ac. You can find this hardware on many new computers.


    ## Materials Required


    This lab requires the following:


    - A computer running Windows (any version) or Linux

    - An Internet connection and a Web browser


    Estimated completion time: 30 minutes


    ## Activity Background


    Say you want to purchase a new computer that works with Linux. The computer you''re
    considering has USB 3.0 ports and a built-in 802.11ac Wifi interface, and you
    want to find out whether Linux supports these technologies.


    ## Activity


    -1. Start your Web browser, if necessary, and go to www.google.com. Enter linux
    usb 3.0 in the search box and click the Search button or press Enter. Notice the
    large number of sites returned in the search results.

    2. Click Linux and USB 3.0 - LinuxPlanet. If you can''t find this article, go
    to http://www.linuxplanet.com/linuxplanet/reports/6956/1.

    3. Read the article to learn more about USB 3.0 and find out when the Linux OS
    started supporting USB 3.0.

    4. Next, use Google to search for Linux 802.11ac.

    5. Click the Comparison of open-source wireless drivers link. Scroll down to the
    Driver capabilities section and look in the column to see which drivers support
    802.11ac.

    6. Close your web browser but keep your computer running if you are continuing
    to the next lab.


    ## Review Questions


    -1. FireWire (IEEE 1394) is faster than USB 2.0. True or False?


    -2. What is the maximum speed of USB 2.0?

    a. 1 Mbps (megabits per second)

    b. 12 Mbps

    c. 480 Mbps

    d. 5 Gbps (gigabits per second)


    -3. What is the maximum speed of USB 3.0?

    a. 1 Mbps

    b. 12 Mbps

    c. 480 Mbps

    d. 5 Mbps

    4. USB 3.0 was supported in the original release of Windows 7. True or False?

    5. When did Linux start supporting USB 3.0?

    a. May 2004

    b. September 2009

    c. January 2011

    d. Linux doesn''t support USB 3.0.


    ## Lab 2.4 Locating the Kernel File


    ### Objectives


    The goal of this lab is to learn how to find the kernel file on your hard disk.


    ### Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 10 minutes


    ### Activity Background


    The kernel is typically stored on the hard disk in an ordinary file, where this
    file is located which allows your system to boot quickly. You should know where
    this file is located to create a boot disk, or you might need to modify your boot
    loader (LILO or GRUB) configuration file. LILO and GRUB are the most common Linux
    boot loaders. Knowing the kernel''s name and location is necessary for each task.


    ### Activity


    -1. Boot your Fedora 20 Linux computer. If it''s displaying a graphical desktop,
    such as GNOME or KDE, switch to a command-line terminal (tty) by pressing Ctrl+Alt+F2.
    Log in using the password you assigned to the root user (it should be LNXroots!).

    2. Most Linux distributions place the kernel file in the /boot directory, but
    it can be located anywhere. Some distributions place it in the root (/) directory.
    Go to the /boot directory by typing cd /boot and pressing Enter.

    3. Display files in the /boot directory by typing ls -l and pressing Enter. The
    command specifies displaying a long directory listing (-l), suppressing the display
    of group (g) owner, and reverse-sorting the files by size (-S). Remember that
    Linux commands are case sensitive, so you must use the lowercase or uppercase
    letters.

    The file starting with vmlinuz is most likely the kernel file. In Fedora 20, the
    kernel file is vmlinuz-3.11.10-301.fc20.x86_64.

    4. Your system might have more than one kernel. If so, how can you tell which
    one is used to boot the system? You can see kernel version is running using the
    uname command. Type -r and press Enter. You should see output similar to: 3.11.10-301.fc20.x86_64.

    5. You can also look at the boot loader configuration file. For a Fedora 20 system,
    the boot loader is normally /boot/grub2/grub.cfg. Display its contents by typing
    cat /boot/grub2/grub.cfg and pressing Enter. The file is actually a script generated
    by the grub-mkconfig program using templates found in the /etc/directory. Press
    Space to scroll the file until you see a line that looks like linux /vmlinuz-3.11.10-301.fc20.x86_64.

    6. Linux kernels aren''t required to have certain filenames. Any name can be used.
    You can name the kernel file mykernel for example. So if you tell a kernel file
    by its name, how you tell whether a file is a kernel file? It''s easy: use the
    file command. Type name (replacing name with the name of the file you want to
    test) and press Enter. On your system, type ls -l /boot/vmlinuz-* and press Enter.
    The output includes the name followed by the kernel executable.

    7. If you''re continuing to the next lab, leave your computer; otherwise, shut
    down the computer.


    ## Review Questions


    -1. Most Linux distributions place the kernel file in which directory?

    a. root (/)

    b. /boot

    c. /etc

    d. /loader

    -2. What command can you use to tell which version of the Linux kernel is currently
    running?

    -3. Which are the most common boot loader programs in Linux?

    a. rpm and dpkg

    b. file and ls

    c. LILO and GRUB

    d. /boot

    4. What is path and name of the GRUB configuration file?

    a. /boot/grub.conf

    b. /boot/grub2/grub.cfg

    c. /etc/grub.d/grub.conf

    d. /etc/grub2.d

    5. Which command tells you whether a file is a kernel file?

    a. kernel

    b. file

    c. ls -k

    d. which


    ## Lab 2.5 Seeing Everything as a File


    ### Objectives


    The goal of this lab is to show you that Linux, like UNIX, is file oriented in
    its behavior and treats all (or most) devices as though they''re files.


    ### Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    ### Activity Background


    The concept of terminals shows you how to move between them with Alt+key sequences.
    These terminals are devices, and most devices in Linux can be treated as files.
    This activity shows you how to read from and write them. The practical applications
    for writing strings (or other data) to terminal screens might not seem clear now,
    but you will appreciate this flexibility as you gain experience with Linux. The
    ability to send output to specific terminals when you write shell scripts and
    configure your system for logging these topics are covered in later chapters.


    ### Activity


    -1. Start your Linux system and log in, if necessary. If your computer is displaying
    a graphical desktop, press Ctrl+Alt+F2 to go to a command prompt.

    2. To send the string "Hello from tty2" to the tty5 device, type echo "Hello from
    tty2" > /dev/tty5 and press Enter.

    The letters “tty” are an abbreviation for teletype, an obsolete mechanical terminal
    used in the early days of computing. Linux and UNIX use this abbreviation to refer
    to modern consoles. To refer to a tty, you must prefix the name with /dev/.

    3. Switch to tty5 by pressing Alt+F5. You should see the string "Hello from tty2"
    on tty5 terminal screen. Note that even though the message you sent to tty5 is
    not the login prompt, the login prompt didn''t register the input as an attempt
    to log in; no programs in a terminal register text sends to it as input. Login
    to tty5 as root.

    4. From tty5, write to tty2 by typing echo "Hello yourself" > /dev/tty2 and pressing
    Enter.

    5. Press Alt+F5 to go back to tty2. Notice the string "Hello yourself" is displayed.

    6. So far, you''ve simply sent text messages to other terminals. You can also
    copy one device to another. One interesting device is the random number generator,
    called /dev/random. Copy random numbers to tty5 by typing cat /dev/random > /dev/tty5
    and pressing Enter. You''ll likely hear the computer''s beeping buzzer, which
    is normal.

    7. Switch to tty5 by pressing Alt+F5. The screen should be rapidly filling with
    characters and scrolling as random characters are displayed.

    8. Stop the random numbers from being displayed on tty5 by switching back to tty2
    and pressing Ctrl+C.

    9. If you''re continuing to the next lab, leave your computer; otherwise, shut
    down the computer.


    The random numbers from /dev/random aren''t displayed as normal decimal numbers.
    They are binary numbers that the tty interprets as characters.


    ## Review Questions


    -1. Which of the following is the correct way to refer to terminals in Linux commands?

    a. tty5

    b. device:tty5

    c. /dev/tty5

    d. tty:5

    -2. If you send a string to a tty being used by a program, the program is aware
    that you wrote to its screen. True or False?

    -3. Suppose a device called /dev/dice produces random numbers between 1 and 6
    (simulating the role of a die). What command do you use to display these numbers
    to tty6?

    a. cat /dev/dice > /dev/tty6

    b. cat /dev/dice > tty6

    c. cat dice > /dev/tty6

    d. cat dice > tty6

    -4. Write the correct command to send the contents of the GRUB boot loader configuration
    to tty5.

    '
