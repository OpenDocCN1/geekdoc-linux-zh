    c. /usr\nd. /lib\n\n## 4.2 使用 BASH 别名\n\n### 目标\n\n本实验的目标是熟悉 BASH 别名（aliases）。你将学习如何显示、添加、删除和重定义别名。\n\
    \n### 所需材料\n\n本实验需要：\n\n+ - 一台运行 Fedora 20 Linux 的计算机\n\n> 预计完成时间：20 分钟\n\n###\
