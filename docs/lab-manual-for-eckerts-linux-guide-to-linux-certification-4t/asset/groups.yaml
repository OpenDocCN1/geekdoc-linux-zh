- md: "\n# Lab 2.6 Giving Shutdown Notification\n\n## Objectives\n\nThe goal of this\
    \ lab is to learn how to shut down a Linux system so that other users are notified.\n\
    \n## Materials Required\n\nThis lab requires the following:\n\n- A computer running\
    \ Fedora 20 Linux\n\nEstimated completion time: 30 minutes\n\n## Activity Background\n\
    \nWhen Linux computers are networked and one computer's resources are being used\
    \ by others, it's useful to notify all users when the system is being shut down\
    \ so that they have a chance to save their data and exit applications before the\
    \ shutdown. You can use the Linux shutdown command to specify a notification message\
    \ and send it to users automatically.\n\n## Activity\n\n- 1. Start your Linux\
    \ computer and press Ctrl+Alt+F2 to go to a command prompt and login as root,\
    \ if necessary.\n- 2. Tell Linux to shut down five minutes from now by typing\
    \ `shutdown -h +5`. The system is going down and pressing Enter. You see the following\
    \ messages:\n\n```\nShutdown scheduled for Date-Time, use shutdown -c to cancel.\n\
    Broadcast message from root@localhost.localdomain\nThe system is going down\n\
    The system is going down for power-off at Date-Time.\n```\n\n- 3. Wait about four\
    \ minutes, and you will see these additional lines displayed onscreen:\n```\n\
    Broadcast message from root@localhost.localdomain Date-Time.\nThe system is going\
    \ down\nThe system is going down for power-off at Date-Time.\n```\n\n- 4. Type\
    \ `shutdown -c` and press Enter to abort the shutdown.\n- 5. Type `shutdown -h\
    \ +5`. The system is going down again and press Enter. You see the same messages\
    \ you saw in Step 3.\n- 6. Next, go to tty5 by pressing Alt+F5. Log in as root.\
    \ After entering your password, in a minute or so you see a similar message to\
