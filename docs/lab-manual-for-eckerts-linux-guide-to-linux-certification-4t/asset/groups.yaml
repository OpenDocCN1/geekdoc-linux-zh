    - b. /dev/sda0

    - c. /dev/system/root

    - d. /dev/default


    3. Which command will change the root filesystem to /mnt/sysimage?


    - a. cd /mnt/sysimage

    - b. su /mnt/sysimage

    - c. chroot /mnt/sysimage

    - d. root /mnt/sysimage


    4. You need an empty directory in order to mount the root filesystem. True or
    False?


