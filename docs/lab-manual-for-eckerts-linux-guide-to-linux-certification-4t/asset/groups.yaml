    \ 活动\n\n+   1. 按 Ctrl+Alt+F2 切换到命令行终端 (tty2)，如有必要，以 User1 身份登录终端。\n\n+   2. 输入\
    \ `runlevel` 并按回车查看当前运行级别。你看到 N5，意味着你处于级别 5。\n\n+   3. 输入 `systemctl get-default`\
