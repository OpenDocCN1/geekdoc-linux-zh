    # Activity


    +   1. Switch to a command-line terminal (tty2) by pressing **Ctrl+Alt+F2**, and
    log in to the terminal as root.


    +   2. Type **runlevel** and press **Enter** to see the current runlevel. You
    see N 5 which means yours are at runlevel 5. The N before the 5 means that you
    have not previously running at a different runlevel.


    +   3. Now, type **systemctl get-default** and press **Enter** to see the runlevel
    using targets. You see graphical.target.


    +   4. Type **systemctl isolate multi-user.target** and press **Enter** to switch
    to runlevel 3. At the prompt, login as root. Type **runlevel** and press **Enter**.
    You see output of 3 which means your current runlevel is 3 and your boot was at
    runlevel 5.


    +   5. Type **init 5** and press **Enter** to go back to the GUI login. Press
    **Ctrl+Alt+F2**, to return to the terminal.


    +   6. Type **systemctl set-default multi-user.target** and press **Enter** to
    set the default runlevel to 3. This command actually causes two commands to run.
    The first command deletes the default.target file and the second creates a symbolic
    link from multi-user.target to default.target. Type **shutdown -r now** and press
    **Enter** to restart the system.'
