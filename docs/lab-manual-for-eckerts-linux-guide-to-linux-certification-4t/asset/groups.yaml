    # Lab 9.3 Writing a Shell Script with an Infinite Loop


    # Objectives


    In this lab, you write a script that creates an infinite loop. You use this script
    in sub-quent labs.


    # Materials Required


    This lab requires the following:


    +   * A computer running Fedora 20 Linux


    Estimated completion time: 10 minutes


    # Activity


    +   1. Start Linux, if necessary, and log in to the GUI as User1.

    2. Open a terminal window. To start the edit text editor, type `gedit loop` and
    press `Enter`. In geedit, type the following, pressing `Enter` after each line:

    ```bash

    #!/bin/bash

    while

    x=1

    done

    ```

    3. Click Save, and then close geedit. The first line specifies that the file is
    a BASH script. The second line starts a while loop that''s infinite because of
    the : at the end. The do and done lines make up the body of the loop. The x=1
    statement just gives the loop some-thing to do; you can''t have a loop with no
    statements in it.

    4. To set the executable permission for the script, type `chmod 555 loop` at the
    terminal prompt and press `Enter`.

    5. To test the script, type `./loop &` and press `Enter`. (*Tip*: You precede
    the filename with / to specify loading the script from the current directory).
    This runs the script in the back-ground and you can see the process ID generated
    for it:

    [1] 8630

    6. Type `ps ax | grep 8630` and press `Enter`. You see that the process name is
    bash since the bash shell runs the loop script.

    7. Stop the loop by typing `kill 8630` and press `Enter` (replacing 8630 with
    the process ID shown in step 5).

    8. You see the message “[1]+ Terminated /loop”. Close all terminal windows, but
    stay logged in for the next lab.'
