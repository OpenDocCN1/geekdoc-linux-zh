    # Lab 2.6 Giving Shutdown Notification


    # Objectives


    The goal of this lab is to learn how to shut down a Linux system so that other
    users are notified.


    # Materials Required


    This lab requires the following:


    +   - A computer running Fedora 20 Linux


    Estimated completion time: 30 minutes


    # Activity Background


    When Linux computers are networked and one computer''s resources are being used
    by others, it''s useful to notify all users when the system is being shut down
    so that they have a chance to save their data and exit applications before the
    shutdown. You can use the Linux shutdown command to specify a notification message
    and send it to users automatically.


    # Activity


    +   1. Start your Linux computer and press Ctrl+Alt+F2 to go to a command prompt
    and login as root, if necessary.


