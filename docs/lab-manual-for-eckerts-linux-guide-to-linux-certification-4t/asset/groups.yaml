    ## Lab 7.1 Using the BASH History Feature


    ## Objectives


    The goal of this lab is to learn about the command history available with the
    BASH shell. With this feature, you don''t have to retype shell commands you''ve
    entered previously. After finishing this lab, for example, you can use this feature
    to recall every command you entered by pressing the up arrow key, specifying numbers
    that represent a command''s order in the history list, and searching for commands
    containing a certain string. You can also replace words in the most recent command
    as a shortcut to retyping the entire command.


    ## Materials Required


    This lab requires the following:


    - A computer running Fedora 20 Linux


    Estimated completion time: 15 minutes


    ## Activity


    1. Start your Linux system and switch to a command-line terminal by pressing Ctrl+Alt+F2.
    Log in as root.

    2. To see your command history, use the up arrow key to cycle through previous
    commands.

    3. Type several commands such as `ls`, `date`, and `who`.

    4. Use the up arrow key to recall the `date` command.

    5. To search for a specific command, press Ctrl+R and start typing a string, for
    example, `ls`. BASH will show the most recent match.

    6. To search for the next match, press Ctrl+R again.

    7. To execute the found command, press Enter.

    8. To edit the command before executing it, press the arrow key.

    9. To clear your command history, type `history -c`.

    10. To view the entire history list, type `history`.


    ## Review Questions


    1. What shortcut is used to search backward through command history?


    - a. Ctrl+S

    - b. Ctrl+R

    - c. Ctrl+H

    - d. Ctrl+T


    2. Which command clears the current session history?


    - a. history -clear

    - b. history -w

    - c. history -c

    - d. clear-history

