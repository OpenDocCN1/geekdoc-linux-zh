- md: "\n# Lab 14.2 Using SSH\n\n# Objectives\n\nIn this lab, you use Secure Shell\
    \ (SSH) to communicate with another Linux computer.\n\n# Materials Required\n\n\
    This lab requires the following:\n\n- A computer running Fedora 20 Linux\n\n```\n\
    Estimated completion time: 20 minutes\n```\n\n# Activity Background\n\nIn an earlier\
    \ lab, you practiced configuring and using Telnet. However, this protocol poses\
    \ major security risks if it's used over a public network. It produces an unencrypted\
    \ packet stream that can be intercepted easily. SSH is a more secure way to communicate\
    \ because the packet stream is encrypted with a cryptographically strong cipher.\n\
    \n# Activity\n\n1. On your Linux computer, if necessary, switch to the second\
    \ virtual console (tty2) and log in as user.\n2. Start the sshd service by typing\
    \ `sudo systemctl start sshd.service` and press Enter. Enter the password for\
    \ the root user when prompted.\n3. You will simulate making an ssh connection\
    \ to another computer by connecting to local-host. Type `ssh user@localhost` and\
    \ press Enter. You see output similar to this:\nThe authenticity of host 'localhost'\
    \ (127.0.0.1)' can't be established.\nRSA key fingerprint is 3d:c1:c4:b4:24:df:f2:ec:a8:f2:62:34:51:5a:0b.\n\
    Are you sure you want to continue connecting (yes/no)?\n4. Type yes and press\
    \ Enter. You see this warning:\nWarning: Permanently added 'localhost' (RSA) to\
    \ the list of known hosts, user@localhost's password:\n5. Type the password and\
