    \ `rpm: 58%` 的输出。该数字表示压缩率，因此在本例中，rpm 程序被压缩了 58%。\n\n- 5. 原文件被重命名为 `rpm-`，新的压缩文件名为\
    \ `rpm`。输入 `ls -l rpm` 查看两个文件的大小。会有显著差异，如下：\n\n```\nrwxr-xr-x 1 root root 7615\
    \ 10:22 rpm\nrwxr-xr-x 1 root root 16152 10:21 rpm-\n```\n\n- 6. 两个文件都运行相同的程序。输入\
