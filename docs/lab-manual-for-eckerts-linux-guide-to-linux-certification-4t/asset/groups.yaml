    \ options to set window properties\n\n## Materials Required\n\nThis lab requires\
    \ the following:\n\n- A computer running Fedora 20 Linux\n- The basic X Window\
    \ programs xcalc and xterm\n- A connection to the Internet to install xcalc and\
    \ xterm\n\n![](img/272b3b99ebe228b8c0cfa22abe675a46_94_0.png)\n\nThis lab may\
    \ not work the same way in all virtual environments.\n\n# Activity\n\n- 1. This\
    \ lab works best with your computer configured for runlevel 3. Start your Linux\
