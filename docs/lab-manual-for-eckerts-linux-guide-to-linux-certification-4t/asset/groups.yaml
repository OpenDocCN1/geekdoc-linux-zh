    \ **Enter**. Read the results of the man command. Press **q** when you are finished.\n\
    - 9. Type **shutdown -h +5 Close all running programs and log off** and press\
    \ **Enter**.\n- 10. Change to **tty5**. Log out by typing `exit` and pressing\
