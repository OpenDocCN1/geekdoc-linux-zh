    ## 实验 2.4 定位内核文件


    ### 目标


    本实验的目标是学习如何在硬盘上找到内核文件。


    ### 所需材料


    本实验需要：


    - 一台运行 Fedora 20 Linux 的电脑


    预计完成时间：10 分钟


    ### 活动背景


    内核通常以普通文件的形式存储在硬盘上，该文件所在的位置允许系统能够快速启动。你应该知道该文件的位置，以便创建启动盘，或者你可能需要修改你的引导加载程序（LILO
    或 GRUB）配置文件。LILO 和 GRUB 是常见的 Linux 引导加载程序。对于每个任务，知道内核的名称和位置都是必要的。


    ### 活动


    -1. 启动你的 Fedora 20 Linux 电脑。如果显示的是图形桌面（如 GNOME 或 KDE），通过按 `Ctrl+Alt+F2` 切换到命令行终端
    (tty)。使用你分配给 root 用户的密码登录（应为 LNXroots!）。

    2. 大多数 Linux 发行版将内核文件放在 `/boot` 目录下，但它也可以位于任何地方。某些发行版将其放在根 (`/`) 目录。输入 `cd /boot`
    并按回车进入 `/boot` 目录。

    3. 输入 `ls -l` 并按回车显示 `/boot` 目录中的文件。该命令指定显示详细目录列表 (`-l`)，抑制组 (g) 所有者的显示，并按大小反序排序文件
