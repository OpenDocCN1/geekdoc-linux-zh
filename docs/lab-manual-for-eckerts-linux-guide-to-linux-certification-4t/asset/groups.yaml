    \ following:\n\n+   - A computer running Fedora 20 Linux\n\n### Background\n\n\
    The common runlevels and their meanings as follows:\n\n- 0:poweroff.target: Halt\
    \ the system.\n- 1:rescue.target: Single-user mode.\n- 3:multiuser.target: Multiuser\
