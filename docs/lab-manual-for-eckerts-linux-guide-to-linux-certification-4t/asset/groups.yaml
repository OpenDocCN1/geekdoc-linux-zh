    # Lab 5.1 Mounting and Ejecting DVDs/CDs


    # Objectives


    The goal of this lab is to become familiar with automounting. You experiment with
    mounting, unmounting, and ejecting DVDs/CDs. You also learn that you can''t unmount
    a DVD/CD if the mount point is in your current directory. Most Linux distributions
    use autofofs for automounting.


    # Materials Required


    This lab requires the following:


    +   - A computer with a DVD/CD drive running Fedora 20 Linux

    - A CD or DVD containing information, such as the Fedora 20 Linux installation
    disc


    Estimated completion time: 10 minutes


    # Activity Background


    You should begin this lab without a DVD/CD in the drive.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_63_0.png)


    # Activity


    +   1. Start your Linux system and log in to the GUI as user1.


    +   2. Open the DVD/CD tray by pressing the button on the drive''s front panel.
    Insert a data DVD/CD, such as the Linux installation disc.


    +   3. Close the tray by pressing the eject button on the front panel. If you''re
    using a notebook computer, push the tray closed manually. Wait a few seconds.
    You will be prompted to open the DVD/DVD with the Files application.


    +   4. Open a terminal window by clicking Activities, clicking the Show Applications
    icon, clicking Utilities, and clicking Terminal.


    +   5. View the mounted disc''s details by typing mount and pressing Enter. The
    last line of output from the mount command should be similar to /dev/sr0 /run/media/user1/VolumeName
    typeiso9660 . . . (with VolumeName representing the name of the disc.


    +   6. Open the drive tray by typing eject and pressing Enter.


    +   7. To check whether the DVD/CD is mounted, type mount and press Enter. You
    shouldn''t see the line of output that was displayed in Step 5 because the DVD/CD
    was unmounted before it was ejected.


    +   8. Close the drive tray by typing eject -t and pressing Enter.


    +   9. Wait a few seconds, and then check whether the DVD/CD is mounted by typing
    mount and pressing Enter. You see the same output as in step 5 and you are prompted
    to open the volume with Files.'
