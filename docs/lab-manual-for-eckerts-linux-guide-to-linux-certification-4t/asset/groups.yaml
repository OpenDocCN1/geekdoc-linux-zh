    \   d. ln -s -f ctrl-alt-del.target\n- 3. What's the quickest way to have changes\
    \ to the Ctrl+Alt+Del key effect?\n   a. Press Ctrl+Alt+Delete.\n   b. Press Ctrl+Alt+Backspace.\n\
    \   c. Type shutdown -r now.\n   d. Type kill -HUP 1.\n- 4. Where is the ctrl-alt-del.target\
    \ file located?\n   a. /etc/init/system\n   b. /usr/lib/systemd/system\n   c.\
    \ /usr/keys/system\n   d. /lib/system/targets\n\n# Lab 8.3 Running an X Server\n\
    \n## Objectives\n\nGnome and KDE are Linux graphical desktop environments with\
