    \ typing `ls -l rpm` and pressing Enter. The file size should be between 15,000\
    \ and 16,000 bytes.\n\n- 4. Compress the program by typing `gzexe rpm` and pressing\
    \ Enter. This process takes a few seconds. When it's finished, you see a line\
    \ similar to rpm: 58%. The number indicates the percentage of compression, so\
    \ in this example, the rpm program was compressed by 58%.\n\n- 5. The original\
    \ file was renamed as rpm-, and the new compressed file is named rpm. Type `ls\
    \ -l rpm` to see both file sizes. There will be a substantial difference, as shown:\n\
    \n```\nrwxr-xr-x 1 root root 7615 10:22 rpm\nrwxr-xr-x 1 root root 16152 10:21\
    \ rpm-\n```\n\n- 6. Both files run the same program. Type `./rpm --version` and\
    \ press Enter. You see output similar to RPM version 4.11.1, indicating the rpm\
    \ program's version. Next, type `./rpm- --version` and press Enter. You see both\
    \ the uncompressed file (rpm-) and the compressed file (rpm) work. (Be sure to\
    \ type two \"-\" characters front in the previous commands),\n\n- 7. When you\
    \ compressed the program, it takes slightly longer to start because it must be\
    \ uncompressed first. First use the time command to compare the times both programs\
    \ take to run. First, type `./rpm --version` and press Enter to see how long the\
    \ compressed program takes to run. Rpm output similar to the following:\n\n```\n\
    RPM version 4.11.1\nreal 0.0024s\nuser 0.0013s\nsys 0.0003s\n```\n\nThe time command\
    \ displays three results in minutes.seconds format: the real elapsed time from\
    \ program start to finish, the amount of time the program spent running as the\
