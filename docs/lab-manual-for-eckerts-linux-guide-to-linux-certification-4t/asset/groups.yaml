    \ `arp/-arp` 选项。）完成后，按 `q` 退出主页面。\n\n- 3. 输入 `route` 并按回车获取你网关的 IP 地址。要找到网关的 MAC\
    \ 地址，输入 `ping default-gateway` 并按回车（将 `default-gateway` 替换为你通过 `route` 命令找到的 IP\
    \ 地址）。按 Ctrl+C 停止 ping 命令。\n\n- 4. 你可能熟悉 Windows 中用于 `arp` 命令来显示 ARP 表。在 Fedora\
