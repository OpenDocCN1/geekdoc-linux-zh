    \ from being scanned?\n   a. locatedb -f\n   b. updatedb\n   c. locatedb /var\n\
    \   d. locate /var\n\n4. You can exclude the /home directory from scan by adding\
    \ it to the PRUNE line in /etc/updatedb.conf. True or False?\n\n5. For an ordinary\
    \ user to find a file with locate, it must have only the execute permission set.\
    \ True or False?\n\n## CHAPTER FIVE LINUX FILESSTEM ADMINISTRATION\n\n### Labs\
    \ included in this chapter\n\n| Objective | Lab |\n|---|---|\n| 103.1: Work at\
    \ the command line | 5.2, 5.3 |\n| 103.5: Create, monitor, and kill processes\
    \ | 5.3 |\n| 104.3: Control mounting and unmounting of file systems | 5.1, 5.2\
    \ |\n\n### Lab 5.1 Mounting and Ejecting DVDs/cds\n\n### Objectives\n\nThe goal\
    \ of this lab is to become familiar with automounting. You experiment with mounting,\
    \ unmounting, and ejecting DVDs/CDs. You also learn that you can't unmount a DVD/CD\
    \ if the mount point is your current directory. Most Linux distributions use autofofs.\n\
    \n### Materials Required\n\nThis lab requires the following:\n- A computer with\
    \ DVD/CD drive running Fedora 20\n- A CD or DVD containing information, such as\
    \ the Linux installation disc\n\nEstimated completion time: 10 minutes\n\n###\
    \ Activity Background\n\nYou should begin this lab without a DVD/CD in the drive.\n\
    \n### Activity\n\n- 1. Start your Linux system and log in to the GUI as user1.\n\
    - 2. Open the DVD/CD tray by pressing the button on the drive's front panel. Insert\
