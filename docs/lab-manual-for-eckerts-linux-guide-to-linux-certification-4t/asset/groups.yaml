    \ troubleshooting | 12.4 |\n\n## Lab 12.1 Configuring Ethernet Interfaces\n\n\
    ### Objectives\n\nThis lab shows you how to change any interface parameter in\
    \ real time without having to restart Linux. In particular, it shows you how to\
