    5. To see whether all files are part of the package are actually installed on
    the hard disk, use the -V option by typing rpm -V gzip-1.6-2.fc20.i686 and pressing
    Enter. If all files are on the hard disk, there''s no output from the rpm program.


    6. Delete some of files by typing rm /usr/share/man/man1/gzip* and pressing Enter.
    Press y and Enter if you''re prompted to confirm the file deletion.


    7. To see how rpm handles the files, type rpm -V gzip-1.6-2.fc20.i686 and press
    Enter. You should see output similar to:


    ```

    missing d /usr/share/man/man1/gzip.1.gz

    ```


    8. To fix the problem, you need to reinstall the package. Type yum reinstall gzip
    and press Enter. Press y and Enter to confirm.


    9. Check again whether all package files are installed, type rpm -V gzip-1.6-2.fc20.i686
    and press Enter. Nothing''s displayed no files are missing.


    > Note that yum does not contain a verify option like rpm does; how-ever, there
    is a plugin yum-verify that will perform a similar function as rpm -V. The yum-verify
    plugin can be installed using yum install yum-verify.


    10. In previous steps, you checked whether any files were missing from the hard
