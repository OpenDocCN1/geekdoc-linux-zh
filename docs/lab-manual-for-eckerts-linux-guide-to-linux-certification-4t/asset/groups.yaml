    # Lab 4.4 Working with File and Directory Permissions


    The >> operator specifies appending to a file instead of overwriting.


    ![](img/272b3b99ebe228b8c0cfa22abe675a46_58_0.png)


    +   14. Switch to virtual console 2 by pressing Ctrl+Alt+F2. You''re logged in
    as the root user. Enter cd /var/local/share and press Enter to change the share
    directory. Try to append (write) to the file by typing echo "Hello from root"
    >> file1 and pressing Enter. This command succeeds because the root user has access
    to all files and directories on the system, regardless of permissions.


    +   15. Switch to virtual console 3 by pressing Ctrl+Alt+F3. You''re logged in
    as user1. Type file1 and press Enter, and you see the following:


    Hello from User2

    Hello from root


    +   16. Type rm file1 and press Enter. If you''re asked whether you want to remove
    the file, type y and press Enter. Type ls -l and press Enter. Notice that the
    file no longer exists because user1 was able to erase user2''s file. You might
    think that the user account has only read access to the file, it shouldn''t be
    able to erase it. However, user1 has write access to the /var/local/share directory,
    which enables it to delete user2''s files. You can solve this security problem
    by setting the sticky bit on the directory, as shown in the next step.


    +   17. Switch to virtual console 2 by pressing Ctrl+Alt+F2. You''re logged in
    as the root user. Type chmod o+t /var/local/share and press Enter. Next, is ls
    -ld /var/local/share and press Enter. As shown in the following line, the sticky
    bit (t) has been added in place of the x bit:


    ```

    drwxr-xr-t 2 root 4096 Aug 18 15:23 /var/local/share

    You''ll probably also see that /var/local/share is highlighted in green to indicate
    that the sticky bit is set.

    ```


    +   18. Switch to virtual console 4 by pressing Ctrl+Alt+F4. You''re logged in
    as user2. Create file1 by typing echo "Hello from User2" -file1 and pressing Enter.
    Verify that the file was created by typing ls -l and pressing Enter.


    +   19. Switch to virtual console 3 by pressing Ctrl+Alt+F3. You''re logged in
    as user1. Again, try to delete the file by typing rm file1 and pressing Enter.
    You''re prompted with this line:

    rm: remove write-protected regular file ''file1?


    +   20. Type y and press Enter. You will follow the error message stating that
    the account cannot erase the file:

    rm: cannot remove ''file1'': Operation not permitted


    +   21. Log out of each terminal session, and press Ctrl+Alt+F1 to go back to
    the graphical screen.'
