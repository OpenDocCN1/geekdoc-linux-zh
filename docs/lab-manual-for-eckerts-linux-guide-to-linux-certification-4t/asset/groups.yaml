    ## Lab 6.3 Changing a Forgotten Root Password


    ## Objectives


    The goal of this lab is to boot to a Fedora 20 live installation and change the
    root password on the Linux system installed on the hard drive. This process is
    useful if you forget the root password for an installed Linux system.


    ## Materials Required


    This lab requires:


    - * A virtual machine running Fedora 20 Linux

    - An ISO file of the Fedora 20 installation media


    Estimated completion time: 15 minutes


    ## Activity


    1. Connect the CD/DVD drive of your Fedora 20 virtual machine to the Fedora 20
    ISO. Boot the virtual machine to the ISO file (to do this in VMware press the
    Esc key when the virtual machine is booting and select the CD-ROM boot option).

    2. When you see the Welcome to Fedora screen, switch to a command-line terminal
    by pressing Ctrl+Alt+F2. Type root and press Enter to logon. When you boot to
    a live Linux installation, the root user does not require a password.

    3. Create a new directory /mnt where you will mount the root file system. Type
    mkdir /mnt/sysimage and press Enter.

    4. Next, you need to mount the partition on the Fedora 20 installation that contains
    the root file system to the /mnt/sysimage directory (although, it can be any empty
    directory). The partition is /dev/mapper/fedora-root but you may want to verify
    this with your instructor or by booting the Fedora 20 installation and typing
    mount to see which partition is mounted as root (/). Type /dev/mapper/fedora-root
    /mnt/sysimage and press Enter.

    5. Type cd /mnt/sysimage and press Enter to verify that the filesystem is mounted.
    You should see the familiar Linux directories such as bin, dev, home, and so forth.

    6. Type chroot /mnt/sysimage and press Enter to change the root file system to
    /mnt/sysimage. The prompt changes to [root@localhost]#


    7. Type **passwd** and press **Enter**. Type **FedoraPass** and press **Enter**.
    Type **FedoraPass** and press **Enter** again to confirm. You just changed the
    password for the root user on the Fedora 20 system installed on the hard drive.

    8. Type **exit** and press **Enter** to return to the Fedora 20 live filesystem.
    Type **shutdown -r now** and press **Enter** to restart the system and boot to
    Fedora 20.

    9. When Fedora 20 boots, switch to a command-line terminal and login as root.
    Be sure to use FedoraPass when prompted to enter the root password. Change the
    root password back to LNXrocks! by typing **passwd** and pressing **Enter** and
    then type and confirm the password. Shut down the system.


    ## Review Questions


    1. What is the default root password for a Fedora 20 Live installation?


    - a. root

    - b. fedora

    - c. LNXrocks!

    - d. No password


