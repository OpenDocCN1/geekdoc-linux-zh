    \ `mv -i`，因为定义了一个别名将 `mv` 更改为 `mv -i`。注意，默认别名取决于你运行的 shell 以及你登录的用户。在实验中，你创建的\
    \ BASH 别将在登录期间有效，注销后移除。如果你希望它们永久生效，必须将它们添加到启动脚本中。对于 Fedora，你可以将它们添加到家目录下的 `.bashrc`\
    \ 文件中。\n\n### 活动\n\n+ 1. 按 Ctrl+Alt+F2 切换到命令行终端 (tty2)，并以 root 身份登录终端。\n\n2. 显示现有别名，输入\
    \ `alias` 并按回车。你会看到类似下面的输出：\n\n```\nalias cp='cp-i'\nalias 1ls='ls -d .* --color=auto'\n\
    alias 11ls='ls -l --color=auto'\nalias 1ls='ls --color=auto'\nalias mv='mv -i'\n\
    alias rm='rm -i'\nalias which='alias|/usr/bin/which --tty-only--read-alias--show-dot=show-tilde*'\n\
    ```\n\n+ 3. 输入 `alias Ispass=less /etc/passwd` 并按回车添加别名。\n\n+ 4. 要查看你添加到 BASH\
    \ shell 的别名，输入 `alias` 并按回车。\n\n+ 5. 尝试你的新别名，输入 `Ipass` 并按回车。将显示 `/etc/passwd`\
    \ 文件的内容。由于该文件是通过 `less` 命令显示的，按 `q` 返回 shell 提示符。\n\n+ 6. 假设你想在文件显示后立即返回 shell\
    \ 提示符，而不是按 `q`。编辑别名没有简单的方法，因此必须用新别名替换旧别名。输入 `alias Ispass=cat /etc/passwd` 并按回车。\n\
    \n+ 7. 验证别名已更改，输入 `alias` 并按回车，然后输入 `Ipass` 并回车。\n\n+ 8. 要删除 `Ipass` 别名，输入 `unalias\
    \ Ispass` 并按回车。再次输入别名以验证其已删除。\n\n+ 9. 接下来，创建一个关闭系统的别名，但使用 `-k` 选项使系统不会实际关闭。输入\
    \ `alias goodnight=\"shutdown -h -k\"` 并按回车。\n\n+ 10. 输入 `goodnight` 并按回车。注意显示了关机消息。\n\
    \n+ 11. 为了防止 shell 运行别名，可以在命令前加上 shell 的转义字符——通常是反斜杠。在 shell 提示符输入 `\\goodnight`\
    \ 并回车。你会看到“command not found”，因为 shell 没有将 `goodnight` 视为别名。相反，它寻找名为 `goodnight`\
    \ 的命令但未找到。\n\n+ 12. 你可以在命令行中创建多个别名。当第一个别名以空格结束时，shell 会尝试扩展命令行的下一个单词。输入以下内容，每行后按回车：\n\
    \n```\nalias a=\"echo \" b=\"Hello World\"\n```\n\n+ 13. 在命令行创建两个别名以执行命令（确保 `a`\
    \ 和 `b` 之间有空格）并按回车。你会看到结果：Hello World\n\n## 文件系统管理\n\n14. 查看 shell 如何扩展别名，创建这三个别名：\n\
    alias 1=\"ls -l\"\nalias 2=\"1\"\nalias 3=\"2\"\n\n输入 `3` 并回车显示长格式列表。shell 将 `3`\
    \ 扩展为 `2`，然后将 `2` 扩展为 `1`。\n\n15. 为了查看将命令定义为其他内容可能发生的问题，输入 `cd=\"shutdown -h -k\"\
    ` 并回车，然后输入 `cd`。系统执行了 `shutdown` 命令而不是 `cd` 命令并显示了 `/etc`。\n\n16. 删除你创建的别名，按回车注销。再次登录并输入\
    \ `alias` 以验证别名已删除。如果继续下一个实验，请登录。\n\n## 复习题\n\n+ 1. 哪个命令显示所有别名？\n   a. ls\n  \
    \ b. --alias\n   c. alias --show\n\n+ 2. 哪个命令创建一个使用长格式显示所有文件的别名？\n   a. alias=\"\
    ls -al\"\n   b. mkalias=\"ls -al\"\n   c. alias -c\n   d. ls -al\n\n+ 3. 哪个命令删除别名？\n\
    \   a. alias -d\n   b. rm\n   c. alias --del\n   d. unalias\n\n+ 4. 通过以下哪种操作防止\
    \ shell 扩展别名？\n   a. 使用 --no 编译 shell\n   b. 在别名前加反斜杠\n   c. 在别名后加点\n   d. 在别名后加正斜杠\n\
    \n+ 5. 如果你想修改名为 `xx` 的别名，你使用 `-e` 命令。对或错？\n\n## 实验 4.3 使用 find 选项\n\n### 目标\n\n\
    本实验的目标是学习如何使用 `find` 命令的高级选项。这些选项对于必须管理文件系统的管理员有用。\n\n### 所需材料\n\n本实验需要：\n\n-\
    \ 一台运行 Fedora 20 Linux 的计算机\n\n| 预计完成时间 |\n| :--- |\n| 20 分钟 |\n\n### 活动\n\n+\
    \ 1. 按 Ctrl+Alt+F2 切换到命令行终端 (tty2)，必要时以 root 用户身份登录终端。\n\n+ 2. 一个常见的管理问题是处理所有者不存在的文件和目录。这发生在用户从系统中删除但其文件未删除时。你可以使用\
    \ `-nouser` 选项显示这些文件和目录的列表。输入 `find / -nouser` 并回车。\n\n+ 3. 如果你使用的是 Fedora，可能没有所有者不存在的文件，但可以使用\
    \ `chown` 命令为文件分配无效的所有者。输入 `touch test` 并回车在当前目录创建一个文件。接下来，输入 `chown root test`\
    \ 并回车，将不存在的用户分配为文件所有者。输入 `find / -nouser` 并回车，你应该看到显示了 `/root/test`。（在前面的命令中，使用\
    \ `/` 作为系统根路径。）\n\n+ 4. 你也可以使用 `chown` 命令修复任何不属于有效用户的文件。输入 `chown nobody test`\
    \ 并回车。现在 `nobody` 用户是文件所有者。`nobody` 用户是 Linux 创建的用户，用于为没有当前所有者的文件分配临时所有权。输入 `find\
    \ / -nouser` 并回车，注意文件列表中。\n\n+ 5. 管理员可能想知道系统中哪些文件设置了 SUID 权限。你可以使用 `-perm` 选项列出这些文件，但你需要正确指定\
    \ SUID 权限。例如，使用该权限的数字表示（4000），输入 `find / -perm 4000` 并回车。可能没有找到文件。然而，另一个权限设置：输入\
    \ `find / -perm 600` 并回车。你会看到一个带有 nobody 的权限列表\n\n+ 6. 你可以使用 `-size` 选项显示所有大于指定值的文件。对于较大的文件，你可以指定\
    \ \"M\" 表示兆字节，“G\" 表示千字节。例如，列出系统中所有大于 5 MB 的文件，输入 `find -size 5M` 并回车。对于较小的文件，你可以使用\
    \ \"c\" 表示字节，“k\" 表示千字节。\n\n+ 7. 直现在你一直在搜索整个文件系统，但可以通过指定目录来搜索较小部分。例如，列出 `/sbin`\
    \ 目录下的符号链接，输入 `find /usr/sbin -type l` 并按回车。\n\n"
