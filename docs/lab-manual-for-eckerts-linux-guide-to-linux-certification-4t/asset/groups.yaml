    to start the tar program.


    7. To go to the new subdirectory that was created, type cd nftpd, press Tab to
    fill out the rest of the directory name, and then press Enter.


    8. To install the software, switch to the root user by typing su and pressing
    Enter, and then type the root password and press Enter.


    9. The installation file for nftpd uses the Perl programming language which is
    installed in order before nftpd. To install Perl, type yum install perl and press
    Enter. Press y and Enter to confirm.


    10. After the installation of Perl is complete, type /install_ncftpd.pl and press
    Enter. You see output similar to the following:


    ```

