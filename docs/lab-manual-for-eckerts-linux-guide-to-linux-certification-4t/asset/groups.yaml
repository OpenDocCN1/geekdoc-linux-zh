    \ to jpeg?\n  a. To preserve the best quality\n  b. To conserve space and bandwidth\n\
    \  c. To display the image with more colors\n  d. To allow the files to be displayed\
    \ in Windows\n"
  mdcn: "\n\n## 实验 11.1 使用 gzexe 压缩程序\n\n## 目标\n\n将文件尽可能减小是非常用的，特别是当它们必须存储在磁盘上，或必须通过慢速网络或调制解器链路传输时。Linux\
