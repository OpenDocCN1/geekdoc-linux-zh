    \ home directory by entering cd bin. True or False?\n\n+   4. If you're logged\
    \ in as root and your current directory is your home directory, when you issue\
    \ the command CDPATH=/usr, you can go to the /bin directory by entering cd ../bin.\
    \ True or False?\n\n+   5. If you issue the command CDPATH=/usr and your current\
    \ directory is your home directory, you can go to the bin directory below your\
    \ home directory by entering cd ~/bin. True or False?\n\n## SYSTEM INITIALIZATION\
    \ AND X WINDOW\n\nLabs included in this chapter\n\n- Lab 8.1 Setting the Default\
    \ Runlevel\n- Lab 8.2 Changing the Function of Ctrl+Alt+Del\n- Lab 8.3 Running\
    \ an X Server\n- Lab 8.4 Configuring X Programs\n\n### CompTIA Linux+ Exam Objectives\n\
    \n| Objective | Lab |\n| --- | --- |\n| 101.3 | Change runlevels and shut down\
    \ or reboot system | 8.1 |\n| 103.1 | Install and configure X | 8.3 |\n| 106.2\
    \ | Work on X1 | 8.4 |\n| 106.3 | Set up display | 8.4 |\n\n## Lab 8.1 Setting\
    \ the Default Runlevel\n\n### Objectives\n\nThe purpose of this lab is to learn\
